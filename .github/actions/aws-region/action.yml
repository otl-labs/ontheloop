name: aws-region
description: >-
  Resolve the project's one AWS region from config/aws-region (rec-4067, Decision 202 clause 4)
  and export it as AWS_REGION / AWS_DEFAULT_REGION, failing closed (REGION_MISSING /
  REGION_INVALID) on a missing or invalid value. Every workflow sign-in reads the region through
  this action rather than a hardcoded literal, so the platform stays shippable as a tool whose
  users set exactly one region.

outputs:
  aws_region:
    description: "The resolved project AWS region."
    value: ${{ steps.resolve.outputs.aws_region }}

runs:
  using: composite
  steps:
    - name: Resolve project AWS region
      id: resolve
      shell: bash
      # Thin adapter only -- the body lives in resolve.sh (Decision 162 R1/R2) so it is
      # shellcheckable and testable under the exact `bash --noprofile --norc -e -o pipefail`
      # invocation GitHub uses here. Do NOT re-inline the fail-closed logic this collapsed -- the
      # ONLY effective line is the delegate call -- adding a `set -euo pipefail` line beside it
      # would make the shared guard's thin-adapter classifier stop recognising this action.
      # resolve.sh's own exit status propagates as this step's status (last command of the body).
      run: bash "${{ github.action_path }}/resolve.sh"
