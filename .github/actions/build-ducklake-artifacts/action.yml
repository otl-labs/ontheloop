name: build-ducklake-artifacts
description: >-
  Build the DuckLake Lambda artifacts and upload them to S3, or fetch the already-reviewed
  artifacts without rebuilding, in one of four modes. Single copy of the "Build DuckLake lambda
  packages" step that existed 5x across terraform-apply-sandbox.yml and reconcile.yml (DEP-08);
  the assert+dual-write body for the 'assert'/'skip-assert' modes and the fetch+copy body for
  'fetch' both live in the tested scripts/ci/ducklake_artifacts.py (T2.42 c4 / rec-2659; fetch:
  Decision 154 / rec-2862).

inputs:
  mode:
    description: >-
      'assert' rebuilds via --skip-upload, byte-checks the seven build/apply-path artifacts
      against their per-sha S3 reference (Decision 77 no-TOCTOU), then dual-writes them (the
      sandbox push path -- the sole remaining reproducibility canary; rec-4372: a mismatch whose
      every difference traces to a tracked input that moved on main between the PR's last plan
      and its merge still applies the reviewed plan.bin, on merge-tree zips). 'skip-assert'
      rebuilds via --skip-upload and dual-writes those same seven artifacts with no prior check (a
      fresh workflow_dispatch plan with nothing to compare against yet). 'upload-only' runs
      scripts.ci.ducklake_artifacts --mode upload-only -- the PR speculative-plan job's
      first-upload path, which builds and dual-writes all NINE artifacts (including
      ducklake-maintenance-smoke.zip and ducklake-telemetry-writer.zip, which the other modes deliberately exclude -- see
      scripts/ci/ducklake_artifacts.py's DUCKLAKE_ARTIFACT_NAMES) via build_lambda's own internal
      upload_to_s3, with no separate assert since there is nothing yet to compare against, then
      also records and uploads each artifact's tracked-input identity as inputs.json (rec-4372).
      'fetch' does NOT rebuild: it downloads the seven reviewed per-sha artifacts -- following a
      superseded-by.json pointer one hop first, when the push run left one (rec-4372) -- and
      server-side copies each onto its fixed key (gated-apply, and both Reconcile call sites --
      every human-gated site that re-applies a previously-reviewed plan after an unbounded
      approval wait, where a rebuild could resolve a dependency to bytes nobody reviewed).
    required: true
  artifact-sha:
    description: >-
      Content-addressing sha for the per-sha S3 key (lambda-packages/<artifact-sha>/<name>) --
      the PR head sha on push/PR paths, the dispatch commit sha on a fresh workflow_dispatch
      plan, or the red commit's originating PR head sha on Reconcile. Callers resolve this
      themselves (it is the same value used elsewhere for the tfplan content-addressed key).
      Exported as LAMBDA_ARTIFACT_SHA so build_lambda's own artifact-sha resolution
      (scripts/build_lambda_deploy.py _resolve_artifact_sha) picks it up in every mode.
    required: true
  bucket:
    description: "S3 bucket for the DuckLake artifacts."
    required: false
    default: "agent-platform-data-lake"
  region:
    description: "AWS region. Falls back to AWS_REGION, exported by the aws-region action or the job's sign-in."
    required: false
  working-directory:
    description: "Directory the build runs from (lambda-packages/ lands here) -- the repo root in every current call site."
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Build DuckLake lambda packages (rebuild before plan/apply, rec-2512)
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MODE: ${{ inputs.mode }}
        ARTIFACT_SHA: ${{ inputs.artifact-sha }}
        LAMBDA_ARTIFACT_SHA: ${{ inputs.artifact-sha }}
        BUCKET: ${{ inputs.bucket }}
        REGION: ${{ inputs.region || env.AWS_REGION }}
      run: |
        set -euo pipefail
        # This runner has no .venv (CC-web-only convention); install the build + upload
        # import-time deps directly, mirroring ci.yml's "Install validate.py import-time deps".
        pip install pyyaml pydantic boto3
        if [ "$MODE" = "upload-only" ]; then
          echo "Building + uploading all DuckLake artifacts (PR speculative-plan first-upload path), then recording inputs.json (rec-4372)."
          python3 -m scripts.ci.ducklake_artifacts "pull_request" "$ARTIFACT_SHA" "$BUCKET" --region "$REGION" --mode upload-only
          exit 0
        fi
        if [ "$MODE" = "fetch" ]; then
          echo "Fetching reviewed DuckLake artifacts from lambda-packages/${ARTIFACT_SHA}/ -- no rebuild (Decision 154 / rec-2862)."
          python3 -m scripts.ci.ducklake_artifacts "workflow_dispatch" "$ARTIFACT_SHA" "$BUCKET" --region "$REGION" --mode fetch --skip-build
          exit 0
        fi
        if [ "$MODE" = "assert" ]; then
          EVENT_ARG="push"
        elif [ "$MODE" = "skip-assert" ]; then
          EVENT_ARG="workflow_dispatch"
        else
          echo "::error::build-ducklake-artifacts: unknown mode '${MODE}' (expected 'assert', 'skip-assert', 'upload-only', or 'fetch')" >&2
          exit 1
        fi
        echo "Content-addressed artifact namespace: lambda-packages/${ARTIFACT_SHA}/"
        python3 -m scripts.ci.ducklake_artifacts "$EVENT_ARG" "$ARTIFACT_SHA" "$BUCKET" --region "$REGION"
