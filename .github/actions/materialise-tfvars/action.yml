name: materialise-tfvars
description: >-
  Materialise terraform.personal.tfvars from the /secret/agent-platform-terraform-personal-tfvars SSM parameter, mask secret-sourced values in logs,
  and assert the file is non-empty (fail-closed). Single copy of the "Materialise tfvars from
  Secrets Manager" / "Mask secret-sourced tfvars values in logs" / "Assert tfvars file is
  non-empty (fail-closed)" sequence that existed 4-5x across terraform-apply-sandbox.yml and
  reconcile.yml (DEP-08/rec-2663). Preserves the rec-2285-fixed first-'='-split parse and the
  ::add-mask:: / non-empty assert verbatim. Note: gated-apply-reconcile previously omitted the
  masking step (a latent gap on a PUBLIC repo, Decision 101) -- applying this action there closes
  it as a disclosed side effect of consolidation, not a scope violation.

inputs:
  working-directory:
    description: "Directory to run from (the tfvars file is always written to terraform/personal/terraform.personal.tfvars regardless)."
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Materialise tfvars from Secrets Manager
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # Thin adapter only -- the body lives in materialise_tfvars.sh (Decision 162 R2) so it is
      # shellcheckable and testable under the exact `bash --noprofile --norc -e -o pipefail`
      # invocation GitHub uses here. materialise_tfvars.sh clears the inherited errexit itself and
      # checks every failure path explicitly; do NOT re-inline the fetch/mask/assert logic this
      # collapsed (rec-3977). The ONLY effective line is the delegate call -- adding
      # `set -euo pipefail` here would make the shared guard's _delegated_script classifier stop
      # recognising this as a thin adapter. materialise_tfvars.sh's own exit status propagates as
      # this step's status (last command of the body).
      run: bash "${{ github.action_path }}/materialise_tfvars.sh"
