name: subagent-plan-review
description: >-
  Digest-fed subagent plan review (names-only terraform_plan_digest.py on stdin, no-tools reviewer, claude_p_retry.sh,
  review_verdict.py JSON classification, single same-budget STARVED retry per T2.39 c2). Single
  copy of the "Subagent plan review" step that existed in both terraform-apply-sandbox.yml
  (apply-sandbox) and reconcile.yml (apply-reconcile) (DEP-08). Preserves the STARVED-no-latch
  anti-masking (Decision 55) exactly: outcome=proceed|revise|starved, never an implicit PROCEED
  or REVISE on starvation.

inputs:
  claude-oauth-token:
    description: >-
      secrets.CLAUDE_CODE_OAUTH_TOKEN -- composite actions cannot read secrets.* directly, so the
      caller must pass it explicitly as a with: input.
    required: true
  context-description:
    description: >-
      The plan-under-review's context phrase, interpolated into the reviewer prompt in place of
      "the sandbox auto-apply pipeline" (e.g. a Reconcile caller passes "a Reconcile heal-button
      re-apply of a previously red sandbox commit (<sha>)").
    required: false
    default: "the sandbox auto-apply pipeline"
  working-directory:
    description: "Terraform root module directory containing plan.json."
    required: false
    default: "terraform/personal"

outputs:
  outcome:
    description: "proceed | revise | starved"
    value: ${{ steps.review.outputs.outcome }}

runs:
  using: composite
  steps:
    - name: Subagent plan review (digest-fed, JSON-classified)
      id: review
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude-oauth-token }}
        CONTEXT_DESCRIPTION: ${{ inputs.context-description }}
        WORKSPACE_ROOT: ${{ github.workspace }}
      working-directory: ${{ inputs.working-directory }}
      # Thin adapter only -- the body lives in review.sh (rec-2924) so it is shellcheckable and
      # testable under the exact `bash --noprofile --norc -e -o pipefail` invocation GitHub uses
      # here. review.sh clears the inherited errexit itself and pre-writes the fail-closed
      # outcome; do NOT re-inline this logic. review.sh's own exit status propagates as this
      # step's status (last command of the body).
      run: bash "${{ github.action_path }}/review.sh"

    - name: Archive review transcripts (best-effort, rec-2923 preventive action)
      # ALWAYS runs, regardless of the review step's outcome -- this is what makes a starved
      # transcript recoverable for investigation. archive_transcripts.sh is TOTAL (always exits
      # 0), so it can never change outputs.outcome above; `if: always()` is used rather than
      # `continue-on-error` (a documented GitHub grey area on composite steps).
      if: always()
      shell: bash
      # Composite steps do NOT inherit the previous step's working-directory -- review.json /
      # review_retry.json were written in inputs.working-directory by the step above, so this
      # step must set it explicitly or it looks in the wrong directory and archives nothing.
      working-directory: ${{ inputs.working-directory }}
      env:
        RUN_ID: ${{ github.run_id }}
      run: bash "${{ github.action_path }}/archive_transcripts.sh"
