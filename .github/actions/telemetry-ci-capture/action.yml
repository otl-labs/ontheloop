name: telemetry-ci-capture
description: >-
  Capture the headless Claude Code sessions of the calling job as telemetry (PLAN-telemetry-claude-p-capture-adapter). One synchronous
  final pass over the sessions the scripts/ci/claude_p_retry.sh wrapper recorded in its manifest. The body is total: it exits 0
  on every path and never writes GITHUB_OUTPUT, GITHUB_ENV or GITHUB_STEP_SUMMARY, so the caller's job conclusion never depends
  on it. Pair it with `if: always()` and `continue-on-error: true` (validate_claude_p_retry_wrapper enforces both).

inputs:
  manifests:
    description: >-
      Newline-separated globs of the wrapper manifests (<output_file>.sessions.jsonl) of the calling job.
    required: true
  aws-access-key-id:
    description: >-
      Optional capture-role credentials (all three or none): composite actions never sign in themselves
      (validate_actions_account_id_masking R4), so the caller passes the role's session keys. When all three are set the
      ambient AWS_* variables are stripped for the pass.
    required: false
    default: ""
  aws-secret-access-key:
    description: "See aws-access-key-id."
    required: false
    default: ""
  aws-session-token:
    description: "See aws-access-key-id."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Capture agent session telemetry
      shell: bash
      env:
        CAPTURE_MANIFESTS: ${{ inputs.manifests }}
        CAPTURE_AWS_ACCESS_KEY_ID: ${{ inputs.aws-access-key-id }}
        CAPTURE_AWS_SECRET_ACCESS_KEY: ${{ inputs.aws-secret-access-key }}
        CAPTURE_AWS_SESSION_TOKEN: ${{ inputs.aws-session-token }}
      run: bash "${{ github.action_path }}/capture.sh"
