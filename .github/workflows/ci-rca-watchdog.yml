name: ci-rca-watchdog

# Hourly reconciliation (rec-5504): every watched red on main and every CI RCA run must have ended with an outcome, else
# one GitHub issue lists it (scripts.ci_rca.watchdog). Deterministic: no LLM, no vendor CLI, no AWS role, no secret, so it
# shares no failure mode with CI RCA. ci-rca.yml's final watchdog job runs the same check after every real CI RCA run;
# this schedule path covers a CI RCA run that never starts. No workflow_run trigger: it would add a run per CI RCA run
# and blind dispatch_integrity's run window.

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Hours of history to reconcile (1..720)'
        required: false
        type: string
        default: '24'

permissions:
  contents: read

jobs:
  watch:
    if: (github.event_name != 'workflow_dispatch' || github.actor != 'otl-workflow-dispatcher[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ci-rca-watchdog
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install watchdog dependencies
        run: python -m pip install pyyaml -c requirements.txt

      - name: Reconcile CI RCA outcomes
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKBACK: ${{ inputs.lookback_hours || '24' }}
        run: python -m scripts.ci_rca.watchdog --lookback-hours "$LOOKBACK"
