name: CI RCA
# Triggered on every CI failure. Invokes the ci-rca agent headlessly to diagnose
# the root cause and file a recommendation via ops_data_portal.
# Decision 72: RCA-as-Plan-Source for CI Merge Gate Failures.

on:
  workflow_run:
    # CD.35 / T2.20: terraform-apply-sandbox is wired in so sandbox apply FAILURES (and the
    # refusals-while-red they cause) file source=ci_rca recs. The dedup step below anchors
    # terraform-apply-sandbox failures on the red convergence record's commit so one underlying
    # apply failure + every later refusal collapse to ONE rec.
    # PLAN-ci-rca-ops-plane-coverage (rec-2849): rec-autoclose and deploy-ducklake-lambdas are
    # ADDED -- the 2026-07-24 ducklake-writer-errors incident went unrecorded because rec-autoclose
    # (an ops-plane write path) was absent from this filter. deploy-ducklake-lambdas' STANDING
    # reconcile-gate refusal is a designed refusal, not a defect -- it is excluded from filing via
    # the designed-refusal skip step below, never by omitting the workflow from this filter.
    # deploy-prod-lambdas mirrors deploy-ducklake-lambdas for the prod class (Decision 126 point 1)
    # -- ADDED to close the prod-deploy blind spot (PLAN-ci-rca-adjudication-guard).
    # terraform-drift, convergence-health, and dedup-probe are deliberately EXCLUDED -- see
    # config/ci_rca_taxonomy.yaml's `workflows:` map (validate_ci_rca_adjudication) for the
    # per-entry adjudication, which is the sole source of truth for this filter.
    workflows:
      [
        "CI",
        "Main Canary",
        "terraform-apply-sandbox",
        "rec-autoclose",
        "deploy-ducklake-lambdas",
        "deploy-prod-lambdas",
      ]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'GitHub Actions run ID of the failed CI run to diagnose'
        required: true
        type: string
      force_rca:
        description: 'Force RCA even if already filed for this commit (dedup bypass)'
        required: false
        type: boolean
        default: false

# CIRCA-03(b): never cancel-in-progress -- a queued run for the SAME head_sha+workflow waits
# instead of superseding an in-flight run, preserving the terraform-apply-sandbox convergence
# backstop (Decision 92/94: every distinct convergence failure must still get its own run).
concurrency:
  group: ci-rca-${{ github.event.workflow_run.head_sha || github.event.inputs.run_id }}-${{ github.event.workflow_run.name || 'dispatch' }}
  cancel-in-progress: false

# Only run when CI failed -- skip success and cancellation.
# Loop guard: this workflow is NOT listed in the workflows: filter above,
# so a ci-rca failure cannot trigger another ci-rca run.
jobs:
  rca:
    # Fork-PR privilege gate (public-repo CRITICAL): ci-rca runs in the base-repo context with the
    # write-capable branch role, so a fork PR that merely fails CI must NOT trigger it. workflow_dispatch
    # (manual, privileged actor) is retained; workflow_run is gated to the same repo (non-fork).
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      actions: read
      statuses: write

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/aws-region

      - name: Checkout at failing commit
        uses: actions/checkout@v7
        with:
          # workflow_run: the failing commit. workflow_dispatch: head_sha is absent, so fall back
          # to github.sha (the dispatched ref, e.g. main) -- an empty ref would silently checkout
          # the default branch; this makes that intent explicit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # fetch-depth: 0 (full history) -- belt-and-suspenders alongside ci_rca_lifecycle's
          # code-level guard-fetch (_ensure_ancestry_history). A bounded depth (formerly 2, kept
          # only for HEAD^ in the evidence bundle's merged-diff reconstruction) left an older
          # closed head's fixed_by_sha commit unreachable, so `git merge-base --is-ancestor`
          # could not resolve it and classify_closed_head misfiled every stale-code rerun as a
          # fresh REGRESSION instead of dropping it (ci-rca-identity-lifecycle post-merge fix).
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Activate venv
        # The repo ships no installable package and no [dev] extra, so `pip install -e .[dev]`
        # would be a no-op that leaves scripts.ops_data_portal unimportable and file_rec silently
        # failing. Install the real dependencies from requirements.txt (mirrors the main-validate
        # job).
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install -r requirements.txt

      # TODO(bedrock): When this runner migrates to GitHub-hosted (target: 90-day window),
      # replace this step and the `claude -p` invocation below with a Python entrypoint
      # that calls bedrock-runtime via the runner's IAM role (boto3). This eliminates the
      # Claude Code CLI dependency, the CLAUDE_CODE_OAUTH_TOKEN rotation requirement, and the
      # npm permission complexity (EACCES on global npm install without sudo) entirely.
      - name: Install Claude Code CLI
        run: |
          if ! command -v claude &> /dev/null; then
            sudo npm install -g @anthropic-ai/claude-code@2.1.148 --omit=dev --omit=optional && sudo npm cache clean --force
          fi
          claude --version

      - name: Configure AWS credentials (OIDC -- branch role)
        uses: aws-actions/configure-aws-credentials@v6
        env:
          MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-branch
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve run metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          # Bind event/input values to env (never interpolate ${{ }} directly into run: bodies)
          # and sanitise the untrusted dispatch run_id to digits to prevent shell injection.
          RUN_ID_RAW: ${{ github.event.workflow_run.id || github.event.inputs.run_id }}
          HEAD_SHA_RAW: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_NAME_RAW: ${{ github.event.workflow_run.name }}
          # CD.35 / T2.20: the convergence record (its own prefix, outside tfstate/). The branch role
          # already reads the whole data-lake bucket, so no extra IAM grant is needed here.
          CONVERGENCE_BUCKET: agent-platform-data-lake
          CONVERGENCE_KEY: convergence/personal/sandbox.json
        run: |
          RUN_ID=$(printf '%s' "$RUN_ID_RAW" | tr -cd '0-9')
          HEAD_SHA="$HEAD_SHA_RAW"
          WORKFLOW_NAME="$WORKFLOW_NAME_RAW"

          if [ -z "$HEAD_SHA" ]; then
            HEAD_SHA=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" --jq '.head_sha' 2>/dev/null || echo "")
          fi
          if [ -z "$WORKFLOW_NAME" ]; then
            WORKFLOW_NAME=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" --jq '.name' 2>/dev/null || echo "unknown")
          fi

          WORKFLOW_SLUG=$(echo "$WORKFLOW_NAME" | tr '[:upper:]' '[:lower:]' | tr ' /' '_-' | sed 's/[^a-z0-9_-]//g')

          # Convergence-refusal dedup (CD.35 5.5d): a terraform-apply-sandbox apply FAILURE and the
          # refusals-while-red it causes on LATER commits are ONE underlying failure. Anchor the
          # dedup on the RED record's commit (not the refusing run's head_sha) so the first failure
          # files one rec and every later refusal dedupes against it. Non-apply-sandbox workflows and
          # a green/absent record fall back to head_sha (unchanged behaviour).
          ANCHOR_SHA="$HEAD_SHA"
          if [ "$WORKFLOW_SLUG" = "terraform-apply-sandbox" ]; then
            REC_JSON=$(aws s3 cp "s3://${CONVERGENCE_BUCKET}/${CONVERGENCE_KEY}" - 2>/dev/null || echo "")
            if [ -n "$REC_JSON" ]; then
              REC_STATUS=$(printf '%s' "$REC_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('status',''))" 2>/dev/null || echo "")
              REC_COMMIT=$(printf '%s' "$REC_JSON" | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit_sha',''))" 2>/dev/null || echo "")
              if [ "$REC_STATUS" = "red" ] && [ -n "$REC_COMMIT" ]; then
                ANCHOR_SHA="$REC_COMMIT"
                echo "Convergence dedup: anchoring on red-record commit ${REC_COMMIT} (run head ${HEAD_SHA})."
              fi
            fi
          fi

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "anchor_sha=${ANCHOR_SHA}" >> "$GITHUB_OUTPUT"
          echo "workflow_slug=${WORKFLOW_SLUG}" >> "$GITHUB_OUTPUT"
          echo "workflow_name=${WORKFLOW_NAME}" >> "$GITHUB_OUTPUT"

      # rec-2857 forward fix: the fetch/classify/retry logic (previously an inline content grep
      # against the merged stdout+stderr stream, which false-positived on a genuine HTTP-5xx log
      # BODY) now lives in scripts/ci_rca/fetch_logs.py, unit-tested and structurally guarded by
      # _check_ci_rca_fetch_classification (an allowlist over this step's run: body -- see
      # scripts/checks/ci_guards/validate_ci_workflow_guards.py). The rec-2117 / rec-2118 /
      # rec-2718 retry provenance lives in that module's docstring. Decision 72 is provenance
      # for workflow_run-triggered CI-RCA failed-run log retrieval. `test -s` below is a local
      # YAML-side fail-closed guard pinned to this default-branch-checked-out file, independent
      # of the module's own exit status.
      - name: Fetch failed run logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ steps.meta.outputs.run_id }}"
          bin/venv-python -m scripts.ci_rca.fetch_logs --run-id "$RUN_ID" --repo "${{ github.repository }}" --out /tmp/ci-rca-log-evidence.json
          bin/venv-python -m scripts.ci_rca.log_evidence --validate /tmp/ci-rca-log-evidence.json --extract-body /tmp/ci-rca-failed.log
          test -s /tmp/ci-rca-log-evidence.json
          test -s /tmp/ci-rca-failed.log

      - name: Fetch jobs JSON
        id: jobs_json
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          RUN_ID="${{ steps.meta.outputs.run_id }}"
          gh run view "$RUN_ID" --repo "${{ github.repository }}" --json jobs \
            > /tmp/ci-rca-jobs.json 2>/dev/null || echo '{}' > /tmp/ci-rca-jobs.json

      - name: Designed-refusal check (fail-closed skip predicate)
        # PLAN-ci-rca-ops-plane-coverage: a STANDING, self-documenting refusal (e.g.
        # deploy-ducklake-lambdas' reconcile-gate) should not mint a fresh L5/L6 critical on every
        # push. No network call -- consumes the jobs JSON the step above already wrote. Fails
        # CLOSED (skip=false) on any uncertainty, so an undeclared failure always files.
        id: designed_refusal
        run: |
          WORKFLOW_SLUG="${{ steps.meta.outputs.workflow_slug }}"
          OUTPUT=$(bin/venv-python -m scripts.ci_rca.designed_refusal --jobs-json /tmp/ci-rca-jobs.json --workflow-slug "$WORKFLOW_SLUG")
          echo "$OUTPUT"
          SKIP=$(echo "$OUTPUT" | grep '^skip=' | cut -d= -f2)
          echo "skip=${SKIP}" >> "$GITHUB_OUTPUT"

      - name: Fetch junit report (v2 fingerprint substrate)
        # ci-rca-identity-lifecycle: best-effort download of the failing run's own pytest-junit
        # artifact (uploaded by ci.yml's main-validate / main-canary.yml's canary job, per
        # scripts.checks._scaffolding._build_unit_test_cmd's --junitxml). Absent for a non-pytest
        # failure (e.g. terraform-apply-sandbox) -- the evidence generator falls back to the
        # log-tail signature when the file is missing, never fails the job.
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          RUN_ID="${{ steps.meta.outputs.run_id }}"
          mkdir -p /tmp/ci-rca-junit
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name pytest-junit --dir /tmp/ci-rca-junit \
            || echo "No pytest-junit artifact for run ${RUN_ID} -- falling back to log-tail signature."

      - name: Fetch validation-result artifact (CI-RCA attribution substrate)
        # ci-rca-evidence-fidelity: best-effort download of the failing run's own
        # validation-result artifact (uploaded by ci.yml's main-validate / main-canary.yml's
        # canary job -- scripts.checks.validation_result.write_completed). Absent for a workflow
        # that never runs `scripts.validate` (e.g. terraform-apply-sandbox) -- the evidence
        # generator falls back to the existing log-derived classification ladder when the file is
        # missing, never fails the job.
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          RUN_ID="${{ steps.meta.outputs.run_id }}"
          mkdir -p /tmp/ci-rca-validation-result
          gh run download "$RUN_ID" --repo "${{ github.repository }}" --name validation-result --dir /tmp/ci-rca-validation-result \
            || echo "No validation-result artifact for run ${RUN_ID} -- falling back to log-derived classification."

      - name: Fetch merged PR's selection-manifest (Decision 135 escape-attribution)
        # ci-rca-identity-lifecycle: this workflow only ever fires post-merge on the default
        # branch (see the job-level `if:` gate above), so the failing commit IS a merge onto
        # main. Best-effort: resolve the PR that produced it, then its --pre selection-manifest
        # artifact (uploaded by ci.yml's pr-validate job on the PR's OWN head commit). Any
        # resolution failure degrades to no manifest -- escape_class is simply omitted.
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        run: |
          ANCHOR_SHA="${{ steps.meta.outputs.anchor_sha }}"
          mkdir -p /tmp/ci-rca-manifest
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/commits/${ANCHOR_SHA}/pulls" --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No merged PR resolved for commit ${ANCHOR_SHA} -- skipping selection-manifest (escape_class omitted)."
            exit 0
          fi
          PR_HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefOid --jq .headRefOid 2>/dev/null || echo "")
          if [ -z "$PR_HEAD_SHA" ]; then
            echo "Could not resolve head SHA for PR #${PR_NUMBER} -- skipping selection-manifest."
            exit 0
          fi
          ARTIFACT_ID=$(gh api "repos/${{ github.repository }}/actions/artifacts" --paginate \
            --jq ".artifacts[] | select(.name==\"selection-manifest\" and .workflow_run.head_sha==\"${PR_HEAD_SHA}\") | .id" \
            2>/dev/null | head -1 || echo "")
          if [ -z "$ARTIFACT_ID" ]; then
            echo "No selection-manifest artifact found for PR #${PR_NUMBER} (head ${PR_HEAD_SHA}) -- skipping."
            exit 0
          fi
          gh api "repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/ci-rca-manifest.zip \
            && unzip -o -q /tmp/ci-rca-manifest.zip -d /tmp/ci-rca-manifest \
            && echo "Downloaded selection-manifest for PR #${PR_NUMBER}." \
            || echo "Selection-manifest download/unzip failed -- escape_class will be omitted."

      - name: Generate evidence bundle
        id: evidence
        continue-on-error: true
        env:
          S3_LOG_BUCKET: agent-platform-data-lake
        run: |
          RUN_ID="${{ steps.meta.outputs.run_id }}"
          WORKFLOW_NAME="${{ steps.meta.outputs.workflow_name }}"
          JUNIT_FLAG=""
          if [ -f /tmp/ci-rca-junit/pytest-junit.xml ]; then
            JUNIT_FLAG="--junit-file /tmp/ci-rca-junit/pytest-junit.xml"
          fi
          MANIFEST_FLAG=""
          if [ -f /tmp/ci-rca-manifest/selection-manifest.json ]; then
            MANIFEST_FLAG="--selection-manifest /tmp/ci-rca-manifest/selection-manifest.json"
          fi
          VALIDATION_RESULT_FLAG=""
          if [ -f /tmp/ci-rca-validation-result/validation-result.json ]; then
            VALIDATION_RESULT_FLAG="--validation-result /tmp/ci-rca-validation-result/validation-result.json"
          fi
          .venv/bin/python -m scripts.ci_rca.evidence \
            --log-file /tmp/ci-rca-failed.log \
            --retrieval-envelope /tmp/ci-rca-log-evidence.json \
            --jobs-file /tmp/ci-rca-jobs.json \
            --workflow-name "$WORKFLOW_NAME" \
            --workflow-run-id "$RUN_ID" \
            --emit-dir /tmp/ci-rca-bundles \
            ${JUNIT_FLAG} ${MANIFEST_FLAG} ${VALIDATION_RESULT_FLAG} \
            > /tmp/ci-rca-evidence-out.txt 2>/tmp/ci-rca-evidence-err.txt || true
          BUNDLE_SHA=$(grep '^BUNDLE_SHA=' /tmp/ci-rca-evidence-out.txt | head -1 | cut -d= -f2 || echo "")
          BUNDLE_S3_URI=$(grep '^BUNDLE_S3_URI=' /tmp/ci-rca-evidence-out.txt | head -1 | cut -d= -f2 || echo "")
          BUNDLE_PATH=$(grep '^BUNDLE_PATH=' /tmp/ci-rca-evidence-out.txt | head -1 | cut -d= -f2 || echo "")
          BUNDLE_LOCAL=$(grep '^BUNDLE_LOCAL=' /tmp/ci-rca-evidence-out.txt | head -1 | cut -d= -f2 || echo "")
          # Extract per-check failure categories from the emitted bundles (schema_version 2,
          # N-failure enumeration). Used by the dedup guard and mark steps for per-category contexts.
          CATEGORIES=""
          if ls /tmp/ci-rca-bundles/*.json 2>/dev/null | head -1 > /dev/null; then
            CATEGORIES=$(for f in /tmp/ci-rca-bundles/*.json; do
              .venv/bin/python -c "import json,pathlib; print(json.loads(pathlib.Path('$f').read_text(encoding='utf-8'))['failure_category'])" 2>/dev/null || echo "unknown"
            done | sort -u | paste -sd ',' -) || CATEGORIES=""
          fi
          echo "bundle_sha=${BUNDLE_SHA}" >> "$GITHUB_OUTPUT"
          echo "bundle_s3_uri=${BUNDLE_S3_URI}" >> "$GITHUB_OUTPUT"
          echo "bundle_path=${BUNDLE_PATH}" >> "$GITHUB_OUTPUT"
          echo "bundle_local=${BUNDLE_LOCAL}" >> "$GITHUB_OUTPUT"
          echo "categories=${CATEGORIES}" >> "$GITHUB_OUTPUT"

          # c12(ii): bundle_absent when the generator produced neither a BUNDLE_SHA nor any
          # emit-dir bundle file -- the continue-on-error above swallowed a hard failure, so the
          # agent has zero deterministic evidence. Surface it loudly instead of letting the agent
          # proceed as if it had a bundle.
          BUNDLE_ABSENT="false"
          if [ -z "$BUNDLE_SHA" ] && ! ls /tmp/ci-rca-bundles/*.json > /dev/null 2>&1; then
            BUNDLE_ABSENT="true"
            echo "[CI_RCA_BUNDLE_ABSENT] evidence bundle generation produced no BUNDLE_SHA and no emit-dir bundle file for run ${RUN_ID}."
          fi
          echo "bundle_absent=${BUNDLE_ABSENT}" >> "$GITHUB_OUTPUT"

      - name: Dedup guard
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ANCHOR_SHA="${{ steps.meta.outputs.anchor_sha }}"
          WORKFLOW_SLUG="${{ steps.meta.outputs.workflow_slug }}"
          CATEGORIES="${{ steps.evidence.outputs.categories }}"

          ALREADY_FILED="false"
          if [ "${{ github.event.inputs.force_rca }}" = "true" ]; then
            echo "force_rca=true; bypassing per-category dedup check."
          elif [ -n "$ANCHOR_SHA" ] && [ -n "$CATEGORIES" ]; then
            # Per-category dedup: check each category's status context separately so a real
            # regression co-occurring with a SLOC line is not masked by a single context key.
            ALREADY_FILED="true"
            IFS=',' read -ra CAT_ARRAY <<< "$CATEGORIES"
            for CAT in "${CAT_ARRAY[@]}"; do
              CONTEXT="ci-rca/${WORKFLOW_SLUG}/${CAT}"
              STATE=$(gh api "repos/${{ github.repository }}/commits/${ANCHOR_SHA}/statuses" \
                --jq ".[] | select(.context == \"${CONTEXT}\") | .state" 2>/dev/null | head -1)
              if [ "$STATE" != "success" ]; then
                ALREADY_FILED="false"
                echo "Category ${CAT} not yet filed (context=${CONTEXT}); will run agent."
                break
              fi
            done
            if [ "$ALREADY_FILED" = "true" ]; then
              echo "Dedup: all categories (${CATEGORIES}) already filed for ${WORKFLOW_SLUG}@${ANCHOR_SHA}; skipping."
            fi
          fi

          # Cause-aware convergence dedup (PLAN-ci-rca-convergence-dedup): a CONVERGENCE_RED
          # refusal is a downstream SYMPTOM, not its own root cause. When the per-category check
          # above found no direct match for convergence_refused (a brand-new category has no
          # prior status context), consult scripts.ci_rca.convergence_dedup for a backed cause:
          # a drift-red matches the open tf_drift rec by drift_run_url; an apply-failure-red
          # matches a pre-existing non-convergence ci-rca commit-status already posted on the
          # SAME commit (ANCHOR_SHA already equals the red record's commit_sha for this
          # workflow -- see "Resolve run metadata" above). All other paths (non-sandbox
          # workflows, force_rca, non-convergence categories) are untouched.
          if [ "$ALREADY_FILED" != "true" ] && [ "${{ github.event.inputs.force_rca }}" != "true" ] && \
             [ "$WORKFLOW_SLUG" = "terraform-apply-sandbox" ] && \
             echo "$CATEGORIES" | tr ',' '\n' | grep -qx "convergence_refused"; then
            echo "convergence_refused present with no direct per-category match; checking cause-aware convergence dedup."
            aws s3 cp "s3://agent-platform-data-lake/convergence/personal/sandbox.json" /tmp/convergence-record.json 2>/dev/null \
              || echo '{}' > /tmp/convergence-record.json
            gh api "repos/${{ github.repository }}/commits/${ANCHOR_SHA}/statuses" > /tmp/commit-statuses.json 2>/dev/null \
              || echo '[]' > /tmp/commit-statuses.json
            CONV_OUT=$(bin/venv-python -m scripts.ci_rca.convergence_dedup \
              --record /tmp/convergence-record.json --commit-statuses /tmp/commit-statuses.json)
            echo "$CONV_OUT"
            CONV_FILED=$(echo "$CONV_OUT" | grep '^already_filed=' | cut -d= -f2)
            if [ "$CONV_FILED" = "true" ]; then
              ALREADY_FILED="true"
              CAUSE_REC=$(echo "$CONV_OUT" | grep '^cause_rec=' | cut -d= -f2)
              CAUSE_KIND=$(echo "$CONV_OUT" | grep '^cause_kind=' | cut -d= -f2)
              echo "Convergence dedup: cause-rec ${CAUSE_REC} (kind=${CAUSE_KIND}) already covers this refusal; skipping agent."
              # Bump ONLY a source=ci_rca cause-rec (context_v2_json carrier); a tf_drift
              # cause-rec (rec-2695-style) gets the already_filed skip with no bump.
              if [ "$CAUSE_KIND" = "ci_rca" ]; then
                bin/venv-python -m scripts.ops_data_portal --bump-ci-rca-occurrence "$CAUSE_REC"
              fi
            fi
          fi

          echo "already_filed=${ALREADY_FILED}" >> "$GITHUB_OUTPUT"

      - name: Fingerprint dedup guard (cross-commit root-cause grouping)
        id: fp_dedup
        # CIRCA-03(b): additive to the commit-status "Dedup guard" above (RETAINED -- it covers
        # same-commit reruns and the terraform-apply-sandbox red-record anchor, which this
        # cross-commit layer does not). Only runs the reader lookup when the commit-status
        # layer did not already skip the agent.
        #
        # Per-bundle decision (not all-or-nothing): delegates to scripts.ci_rca.dedup so the
        # decision logic is unit-tested (tests/test_ci_rca_dedup.py) rather than living in this
        # shell. A matched-open bundle is skipped+bumped independently of any co-occurring novel
        # bundle; a genuinely-novel fingerprint always runs the agent (Decision 55).
        if: steps.dedup.outputs.already_filed != 'true'
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_rca }}" = "true" ]; then
            FORCE_FLAG="--force-rca"
          fi
          OUTPUT=$(bin/venv-python -m scripts.ci_rca.dedup --bundles-dir /tmp/ci-rca-bundles ${FORCE_FLAG})
          echo "$OUTPUT"
          DEDUPED=$(echo "$OUTPUT" | grep '^deduped=' | tail -1 | cut -d= -f2)
          echo "deduped=${DEDUPED}" >> "$GITHUB_OUTPUT"

      - name: Run ci-rca agent
        id: rca_agent
        if: steps.dedup.outputs.already_filed != 'true' && steps.fp_dedup.outputs.deduped != 'true' && steps.designed_refusal.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CI_RCA_BUNDLE_EMIT_DIR: /tmp/ci-rca-bundles
          # CIRCA-03(c) / Decision 74: force_rca must bypass BOTH the pre-agent fp_dedup skip
          # (already reads github.event.inputs.force_rca directly) AND the write-time backstop
          # inside file_rec(), which the agent invokes as a Bash tool call within this step --
          # env vars set here propagate to that child process.
          CI_RCA_FORCE_RCA: ${{ github.event.inputs.force_rca }}
        run: |
          RUN_ID="${{ steps.meta.outputs.run_id }}"
          BUNDLE_SHA="${{ steps.evidence.outputs.bundle_sha }}"
          BUNDLE_S3_URI="${{ steps.evidence.outputs.bundle_s3_uri }}"
          BUNDLE_PATH="${{ steps.evidence.outputs.bundle_path }}"
          BUNDLE_LOCAL="${{ steps.evidence.outputs.bundle_local }}"
          BUNDLE_ABSENT="${{ steps.evidence.outputs.bundle_absent }}"
          EVIDENCE_CONTEXT=""
          if ls /tmp/ci-rca-bundles/*.json 2>/dev/null >/dev/null 2>&1; then
            # Reference the emit-dir so multi-failure runs expose all N bundles to the agent.
            # For a single-failure run BUNDLE_SHA is the only SHA; for N>1 the agent enumerates
            # /tmp/ci-rca-bundles/*.json to find each bundle's sha256 and failure_category.
            EVIDENCE_CONTEXT=" Evidence bundle(s) are at /tmp/ci-rca-bundles/ -- enumerate *.json for multi-failure runs (one JSON per failed check). Primary bundle SHA: ${BUNDLE_SHA}. Primary S3 URI: ${BUNDLE_S3_URI}. Pending path: ${BUNDLE_PATH}. Local bundle path: ${BUNDLE_LOCAL}."
          fi
          # c12(ii): when no evidence bundle was generated at all, force the agent onto the
          # mandatory human-review route instead of letting it file a confidently-wrong rec with
          # zero deterministic evidence. ops_data_portal.file_rec's bundle-absent fail-loud check
          # only accepts a bundle-absent rec when rca_confidence='undetermined'.
          if [ "$BUNDLE_ABSENT" = "true" ]; then
            EVIDENCE_CONTEXT=" No evidence bundle was generated for this run (bundle_absent=true) -- you have zero deterministic evidence. You MUST set detection_gap.earliest_viable_gate='undetermined', rca_confidence='undetermined', and file the rec anyway so it routes to mandatory human review (preflight 'CI-RCA Mandatory Human Review'). Do NOT guess earliest_viable_gate/escape_mode without a bundle."
          fi
          # Pass the prompt via stdin: --allowedTools is variadic and would otherwise swallow a
          # trailing positional prompt, leaving claude with no input ("Input must be provided
          # either through stdin or as a prompt argument when using --print").
          PROMPT="Apply the .claude/agents/scheduled/ci-rca.md instructions to failed CI run ${RUN_ID}. The failed log is at /tmp/ci-rca-failed.log.${EVIDENCE_CONTEXT}"
          printf '%s' "$PROMPT" | ${GITHUB_WORKSPACE}/scripts/ci/claude_p_retry.sh /tmp/ci-rca-output.json -- \
            --output-format json \
            --max-turns 30 \
            --allowedTools "Read,Bash(grep:*),Bash(cat:*),Bash(git log:*),Bash(bin/venv-python -m scripts.ops_data_portal:*)" || true
          cat /tmp/ci-rca-output.json
          # Deterministic filing check: the marker/dedup must reflect a real filing, not the
          # || true-masked exit above. CIRCA-07: gate on --all (ALL FILED: markers) rather than
          # the legacy single-marker helper -- the single-marker helper is last-marker-wins, so
          # a multi-failure run where the LAST diagnosed bundle emits "FILED: none" while an
          # EARLIER bundle genuinely filed would otherwise report zero filings and skip mark_rca
          # entirely for a rec that was actually filed. --all is empty only when truly nothing
          # was filed (fail-open toward re-diagnosis, per Decision 74).
          FILED_PAIRS=$(bin/venv-python -m scripts.ci_rca.filing --all /tmp/ci-rca-output.json || true)
          if [ -z "$FILED_PAIRS" ]; then
            echo "::error::ci-rca agent filed no recommendation (no FILED: marker in output)"
            exit 1
          fi
          # rec_id output feeds the PR-comment step, which reports a single rec id -- prefer the
          # legacy last-marker helper's value, falling back to the last --all pair when the final
          # marker was "none" but an earlier bundle filed (the case this fix addresses).
          REC_ID=$(bin/venv-python -m scripts.ci_rca.filing /tmp/ci-rca-output.json || true)
          if [ -z "$REC_ID" ]; then
            REC_ID=$(echo "$FILED_PAIRS" | tail -1 | cut -d, -f1)
          fi
          echo "rec_id=${REC_ID}" >> "$GITHUB_OUTPUT"

      - name: Mark failure as RCA'd
        id: mark_rca
        if: steps.rca_agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CIRCA-07: gate per-category on the rec id ACTUALLY parsed for that category (via
          # ci_rca_filing --all), not on the full evidence-step category enumeration -- a 1-of-2
          # filing marks exactly one category's status context, never both. Anchor: CD.35 5.5d
          # anchors terraform-apply-sandbox on the red record's commit; other workflows use head_sha.
          ANCHOR_SHA="${{ steps.meta.outputs.anchor_sha }}"
          WORKFLOW_SLUG="${{ steps.meta.outputs.workflow_slug }}"
          if [ -n "$ANCHOR_SHA" ]; then
            bin/venv-python -m scripts.ci_rca.filing --all /tmp/ci-rca-output.json | while IFS=',' read -r REC_ID CAT; do
              [ -z "$REC_ID" ] && continue
              [ -z "$CAT" ] && CAT="unknown"
              CONTEXT="ci-rca/${WORKFLOW_SLUG}/${CAT}"
              gh api "repos/${{ github.repository }}/statuses/${ANCHOR_SHA}" \
                --method POST \
                --field state=success \
                --field context="${CONTEXT}" \
                --field description="ci-rca filed ${REC_ID} for this failure"
            done
          fi

      - name: Comment on originating PR
        # Gate on the agent actually running (not dedup-skipped) so a skipped run never posts a
        # misleading "filed unknown" comment.
        if: ${{ steps.rca_agent.outcome == 'success' && github.event.workflow_run.pull_requests[0] != null && github.event.workflow_run.pull_requests[0].number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUM="${{ github.event.workflow_run.pull_requests[0].number }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          REC_ID="${{ steps.rca_agent.outputs.rec_id }}"
          gh pr comment "${PR_NUM}" \
            --body "ci-rca agent diagnosed CI run ${RUN_ID} and filed ${REC_ID}. Review in the next /plan session under 'CI RCA Recs (open)'."
