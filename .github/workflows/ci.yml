name: CI
# Thin safety net: calls python -m scripts.validate (single source of truth for validation logic).
# Agents validate locally via python -m scripts.validate before pushing.
# To add a new check: add it to validate.py first, then it runs both locally and here.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  pr-validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pr-validate-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: ./.github/actions/aws-region

    - name: Print repository identity anchor
      # Decision 172 (OIDC immutable-subject recovery): a zero-credential, zero-AWS echo of the
      # numeric ids GitHub's immutable OIDC subject claim pins (terraform/personal/oidc.tf,
      # terraform/bootstrap/github_ci_apply.tf) -- keeps them falsifiable against GitHub itself
      # on every PR, rather than only against this plan's own committed literals. Runs green
      # during any OIDC outage: pr-validate uses no OIDC and no AWS.
      run: |
        echo "repository_id=${{ github.repository_id }}"
        echo "repository_owner_id=${{ github.repository_owner_id }}"

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements-fast.txt', 'requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache pre-commit hook environments
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-precommit-

    - name: Install fast-tier dependencies only
      # --pre runs ruff, mypy, pytest affected-set selection (Decision 135),
      # pyyaml-backed validators, and the diff-aware pre-commit suite (detect-secrets +
      # denylist + hygiene). It does NOT need torch, CUDA, pyarrow, awswrangler, etc.
      # Installing the full requirements.txt fills the runner's disk (~3GB of
      # torch+CUDA wheels). Lint/type/test tool versions come from requirements-fast.txt;
      # dev tools + pre-commit come from requirements-dev.txt.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-fast.txt
        pip install -r requirements-dev.txt

    - name: Validate fast tier (ruff lint, ruff format, mypy, prompt checks)
      run: python -m scripts.validate --pre

    - name: Upload affected-set selection manifest
      # PR-context observability capture for the live affected-set derivation (Decision
      # affected-set-selection): the manifest is an OUTPUT/observability artifact only, never
      # a selection input -- best-effort, always uploaded regardless of the validate step's
      # outcome so a red run's selection is diagnosable too. pr-validate has no AWS creds (see
      # requirements-fast.txt / no OIDC block above); the manifest's own best-effort S3 leg
      # lazy-imports boto3 and degrades to a loud skip in this job -- this artifact is the
      # PR-context capture, independent of that S3 leg.
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: selection-manifest
        path: logs/debug/selection-manifest.json
        if-no-files-found: ignore
        retention-days: 14

  main-validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write      # REQUIRED for OIDC token minting
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: ./.github/actions/aws-region

    - name: Configure AWS credentials (OIDC -- branch role)
      uses: aws-actions/configure-aws-credentials@v6
      env:
        MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-branch
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.in', 'requirements-dev.in', 'requirements.txt', 'requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Cache pre-commit hook environments
      uses: actions/cache@v6
      with:
        path: ~/.cache/pre-commit
        key: ${{ runner.os }}-precommit-${{ hashFiles('.pre-commit-config.yaml') }}
        restore-keys: |
          ${{ runner.os }}-precommit-

    - name: Install dependencies
      # requirements-dev.txt supplies pre-commit (pinned), needed for the full-tier
      # `pre-commit run --all-files` step inside validate.py.
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Validate full tier (ruff, mypy, pytest, DQ runner, verifier harness)
      run: python -m scripts.validate

    - name: Upload pytest junit report (v2 fingerprint substrate)
      # ci-rca-identity-lifecycle: the full-tier unit-test step emits logs/debug/pytest-junit.xml
      # (--junitxml, scripts.checks._scaffolding._build_unit_test_cmd); upload it on failure so
      # ci-rca.yml can download it for the failing run and parse a v2 cause-anchored fingerprint
      # instead of falling back to the log-tail signature. always() so a red run still uploads.
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pytest-junit
        path: logs/debug/pytest-junit.xml
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload validation-result evidence (CI-RCA attribution substrate)
      # ci-rca-evidence-fidelity: scripts.checks.validation_result.write_completed already writes
      # logs/debug/validation-result.json with an exact failed_checks list AND (schema_version 2)
      # failed_check_attributions on the failure path -- upload it so ci-rca.yml can carry the
      # real failed check instead of re-deriving it from a log-text scan. always() mirrors the
      # pytest-junit step above so a red run still uploads.
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: validation-result
        path: logs/debug/validation-result.json
        if-no-files-found: ignore
        retention-days: 14

  trailer-census:
    # Decision 201 slice A: parses the Resolves: rec-NNNN trailer from the merge commit, reads
    # each named rec via the DuckLake reader, and classifies its acceptance command -- executes
    # nothing. Mirrors backlog-health.yml's three-job credential split (Decision 143).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: ./.github/actions/aws-region

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-fast.txt

      - name: Configure AWS credentials (OIDC -- branch role, reader-only usage)
        uses: aws-actions/configure-aws-credentials@v6
        env:
          MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-branch
          aws-region: ${{ env.AWS_REGION }}

      - name: Run trailer census (parse trailer, read named recs, classify -- executes nothing)
        run: .venv/bin/python -m scripts.rec_trailer_acceptance census --artifact-dir /tmp/trailer_acceptance

      - name: Upload census artifact
        uses: actions/upload-artifact@v7
        with:
          name: trailer-census-${{ github.run_id }}
          path: /tmp/trailer_acceptance/trailer_census.json
          retention-days: 1

  trailer-acceptance-evaluate:
    # Decision 143 credential split: the ONLY job that executes rec-authored acceptance
    # commands, delegated entirely to scripts.backlog_health.probe's unshare -rmn sandbox. Holds
    # no AWS credential and no writer secret -- {contents: read} only.
    needs: trailer-census
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-fast.txt

      - name: Download census artifact
        uses: actions/download-artifact@v8
        with:
          name: trailer-census-${{ github.run_id }}
          path: /tmp/trailer_acceptance

      - name: Allow unprivileged user namespaces (unshare -rmn -- Ubuntu 24.04 default AppArmor restriction)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run trailer acceptance evaluator (sandboxed -- the sole executor of rec-authored commands)
        run: .venv/bin/python -m scripts.rec_trailer_acceptance evaluate --artifact-dir /tmp/trailer_acceptance

      - name: Upload verdict artifact
        uses: actions/upload-artifact@v7
        with:
          name: trailer-acceptance-verdict-${{ github.run_id }}
          path: /tmp/trailer_acceptance/acceptance_verdict.json
          retention-days: 1

  trailer-junit-verdict:
    # Decision 201 slice B: the SECOND verdict source, reading a junit verdict from the SAME
    # push run's own authoritative pytest-junit report rather than re-running the node under
    # probe's sandbox. needs main-validate (the report's producer) as well as trailer-census (the
    # routing partition's producer); always() so this still runs -- and refuses loud-not-red --
    # if either upstream job failed, mirroring trailer-closure's own always() posture. Bare
    # always() with no pull_request admission would be read as PR-gating by
    # scripts/verify_ci_workflow/_ci_yaml.py::_admits_pull_request; the github.event_name == 'push'
    # conjunct keeps it out of signal-green.needs.
    #
    # Decision 143 credential split: {contents: read} only, no id-token, no secret -- this job
    # never touches the warehouse. Invokes scripts.rec_trailer_acceptance_junit DIRECTLY (never
    # via scripts.rec_trailer_acceptance's own subparser, which imports scripts.backlog_health.probe
    # at module scope) so validate_sandbox_runner_test_deps's M2 marker never arms on a job that
    # executes nothing.
    needs: [trailer-census, main-validate]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-fast.txt

      - name: Download census artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: trailer-census-${{ github.run_id }}
          path: /tmp/trailer_acceptance

      - name: Download pytest-junit report (same-run only -- no run-id input)
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pytest-junit
          path: /tmp/trailer_acceptance

      - name: Run trailer junit verdict (probe-free thin adapter -- reads the same run's junit report)
        run: .venv/bin/python -m scripts.rec_trailer_acceptance_junit --artifact-dir /tmp/trailer_acceptance --junit-report /tmp/trailer_acceptance/pytest-junit.xml

      - name: Upload junit verdict artifact
        uses: actions/upload-artifact@v7
        with:
          name: trailer-junit-verdict-${{ github.run_id }}
          path: /tmp/trailer_acceptance/junit_verdict.json
          if-no-files-found: ignore
          retention-days: 1

  trailer-closure:
    # Rejoins the (untrusted) verdict artifacts against census's own entries and closes with
    # require_acceptance_verdict=True (Decision 163: structurally cannot fail open). always()
    # so this still runs -- and refuses loud-not-red -- even if an upstream job failed.
    #
    # Merge-leg gate (rec-3775 / rec-3901, unchanged by the Decision 201 relocation): a trailer
    # whose merge diff is confined to docs/plans/ (a plan-only merge) -- or whose diff is
    # empty/unresolvable, the true-merge-commit shape -- is REFUSED by
    # scripts/ops_portal/trailer_closure_gate.py::merge_leg_refuses, called from
    # close_recs_from_trailer before any acceptance verdict is even consulted: every named rec is
    # left OPEN rather than closed, loud-not-red.
    #
    # DECLARED COST (slice B): this job now waits behind main-validate (via trailer-junit-verdict),
    # so trailer closure completes roughly 16 to 20 minutes after the merge rather than within a
    # couple of minutes -- unavoidable, since consuming the authoritative verdict means waiting
    # for the run that produces it.
    needs: [trailer-census, trailer-acceptance-evaluate, trailer-junit-verdict]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: ./.github/actions/aws-region

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install -r requirements.txt -r requirements-fast.txt

      - name: Configure AWS credentials (OIDC -- branch role)
        uses: aws-actions/configure-aws-credentials@v6
        env:
          MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-branch
          aws-region: ${{ env.AWS_REGION }}

      - name: Download census artifact
        uses: actions/download-artifact@v8
        with:
          name: trailer-census-${{ github.run_id }}
          path: /tmp/trailer_acceptance

      - name: Download verdict artifact
        uses: actions/download-artifact@v8
        with:
          name: trailer-acceptance-verdict-${{ github.run_id }}
          path: /tmp/trailer_acceptance

      - name: Download junit verdict artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: trailer-junit-verdict-${{ github.run_id }}
          path: /tmp/trailer_acceptance

      - name: Close resolved recs from Resolves trailer (Decision 201 acceptance-gated)
        env:
          DUCKLAKE_WRITER_URL: ${{ secrets.DUCKLAKE_WRITER_URL }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: .venv/bin/python -m scripts.rec_trailer_acceptance close --artifact-dir /tmp/trailer_acceptance --junit-verdict /tmp/trailer_acceptance/junit_verdict.json

  terraform-validate:
    # GitHub-hosted runner (CD.21 -- self-hosted runner retired). Delegates to
    # `python -m scripts.validate --terraform-only`, the single source of truth for
    # terraform validation: init -backend=false + validate + fmt -check across the
    # live roots (terraform/personal, terraform/github, terraform/bootstrap).
    # Fires on both push and PR.
    #
    # PLAN-ci-provider-mirror-terraform-init-hardening (rec-2836): this job DOES make AWS calls
    # now -- a best-effort, read-only OIDC assume + S3 sync that consumes the Decision 120
    # provider filesystem_mirror, so a github.com provider-asset outage cannot red this required,
    # branch-protection-gating check (Decision 83). Event-conditional role (the PR-sub
    # `agent-platform-github-ci-pr` role for pull_request; the already-trusted
    # `agent-platform-github-ci-branch` role for push -- see terraform/personal/oidc.tf, whose
    # trust conditions accept exactly these two sub claims). id-token:write below is REQUIRED for
    # either OIDC mint to succeed at all. Every gate fails OPEN (continue-on-error on the creds
    # step; the gate-chain step never itself fails the job) with a printed reason to stdout AND
    # $GITHUB_STEP_SUMMARY -- degrading to today's direct-fetch behaviour, never wedging the
    # required check (Decision 55/83). The one fail-CLOSED branch is the internal consistency
    # invariant below, which fires solely when all three gates already succeeded.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write   # REQUIRED for OIDC token minting (provider-mirror gate chain)
      contents: read

    steps:
    - uses: actions/checkout@v7

    - uses: ./.github/actions/aws-region

    - name: Configure AWS credentials (OIDC -- event-conditional role, best-effort)
      # Best-effort: continue-on-error so an OIDC/AWS outage, a fork PR (whose token cannot
      # satisfy either trust condition), or the read grant not yet having applied post-merge
      # (IAM-before-consumer ordering) degrades to gate 1/3 below rather than failing this
      # required check outright.
      id: mirror_oidc
      continue-on-error: true
      uses: aws-actions/configure-aws-credentials@v6
      env:
        MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}
      with:
        role-to-assume: >-
          arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ github.event_name == 'pull_request' && 'agent-platform-github-ci-pr' || 'agent-platform-github-ci-branch' }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Provider-mirror gate chain (fail-open; Decision 55/83)
      # Three gates, evaluated in order -- ANY failure degrades to today's direct-fetch behaviour
      # with a printed reason (stdout + $GITHUB_STEP_SUMMARY); the required check never wedges:
      #   1/3 OIDC credentials (steps.mirror_oidc.outcome == 'success')
      #   2/3 non-empty S3 mirror sync
      #   3/3 EXACT-LOCKED-VERSION presence -- parsed from terraform/personal/.terraform.lock.hcl,
      #       never mere directory non-emptiness. cc-web.tfrc excludes kislerdm/* from `direct` and
      #       terraform's provider_installation has NO method-chaining, so an exported tfrc over a
      #       mirror missing the exact locked version would RED this required check in a state
      #       that passes today (see terraform/CLAUDE.md).
      # Only when all three succeed is the tfrc rendered and TF_CLI_CONFIG_FILE exported.
      id: mirror_gate
      run: |
        set -uo pipefail
        reason=""
        active=false

        if [ "${{ steps.mirror_oidc.outcome }}" != "success" ]; then
          reason="gate 1/3 (OIDC credentials) failed: could not assume the mirror-read role -- degrading to direct-fetch"
        else
          MIRROR_DIR="${RUNNER_TEMP}/tf-provider-mirror"
          mkdir -p "$MIRROR_DIR"
          if ! aws s3 sync "s3://agent-platform-data-lake/tf-provider-mirror/" "$MIRROR_DIR" --only-show-errors; then
            reason="gate 2/3 (mirror sync) failed: aws s3 sync errored -- degrading to direct-fetch"
          elif [ -z "$(ls -A "$MIRROR_DIR" 2>/dev/null)" ]; then
            reason="gate 2/3 (mirror sync) failed: synced tree is empty -- degrading to direct-fetch"
          else
            NEON_VERSION=$(awk '
              /^provider "registry.terraform.io\/kislerdm\/neon"/ { found=1 }
              found && /version[ \t]*=/ { gsub(/[",]/, "", $3); print $3; exit }
            ' terraform/personal/.terraform.lock.hcl)
            if [ -z "$NEON_VERSION" ]; then
              reason="gate 3/3 (exact-locked-version) failed: could not parse kislerdm/neon version from terraform/personal/.terraform.lock.hcl -- degrading to direct-fetch"
            elif ! ls "$MIRROR_DIR/registry.terraform.io/kislerdm/neon/terraform-provider-neon_${NEON_VERSION}_"*.zip >/dev/null 2>&1; then
              reason="gate 3/3 (exact-locked-version) failed: synced mirror lacks terraform-provider-neon_${NEON_VERSION}_*.zip (locked version) -- degrading to direct-fetch (re-seed via terraform-provider-mirror-seed.yml)"
            else
              RESOLVED_TFRC="${RUNNER_TEMP}/cc-web.tfrc"
              sed "s|__TF_MIRROR_DIR__|${MIRROR_DIR}|g" config/terraform/cc-web.tfrc > "$RESOLVED_TFRC"
              echo "TF_CLI_CONFIG_FILE=${RESOLVED_TFRC}" >> "$GITHUB_ENV"
              active=true
            fi
          fi
        fi

        echo "active=${active}" >> "$GITHUB_OUTPUT"

        if [ "$active" = "true" ]; then
          echo "provider-mirror: ACTIVE (neon ${NEON_VERSION} served from s3://agent-platform-data-lake/tf-provider-mirror/)"
          echo "provider-mirror: ACTIVE (neon ${NEON_VERSION})" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "provider-mirror: DEGRADED -- ${reason}"
          echo "provider-mirror: DEGRADED -- ${reason}" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Provider-mirror fail-closed consistency invariant (Decision 55/83)
      # Fires only when all three gates above already succeeded. If TF_CLI_CONFIG_FILE is somehow
      # unset in that state (a render/export bug), fail LOUDLY rather than silently falling back to
      # a direct fetch the tfrc's exclude would leave with no provider to install -- no silent
      # degradation once every gate has already reported success.
      if: steps.mirror_gate.outputs.active == 'true'
      run: |
        set -euo pipefail
        if [ -z "${TF_CLI_CONFIG_FILE:-}" ]; then
          echo "::error::Provider-mirror gates all succeeded but TF_CLI_CONFIG_FILE is unset -- fail-closed invariant violated."
          exit 1
        fi
        echo "Fail-closed invariant OK: TF_CLI_CONFIG_FILE=${TF_CLI_CONFIG_FILE}"

    - name: Read pinned Terraform version
      id: tfver
      run: echo "version=$(cat config/terraform-version)" >> "$GITHUB_OUTPUT"

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: ${{ steps.tfver.outputs.version }}

    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install validate.py import-time deps
      run: pip install pyyaml pydantic

    - name: Terraform validate + fmt (both roots via validate.py)
      run: python -m scripts.validate --terraform-only

  signal-green:
    # Gate: fires only after BOTH PR checks succeed. This captures every required
    # PR-gating check in this workflow (pr-validate + terraform-validate). INVARIANT:
    # if a future workflow adds a pull_request-triggered check it must be added to
    # this needs list -- cross-workflow needs are not supported by GitHub Actions.
    # The PR-activity subscription wakes a watching Claude session on comments and
    # failures, not on clean check passes -- so an all-green PR is silent. Posting a
    # pass comment on agent-session branch PRs restores the green wake only AFTER all
    # required checks complete. Scoped to the declared prefix set (see
    # docs/contracts/git-ops.yaml branching_topology.agent_branch_prefixes, which
    # scripts/ci/pr_conflict_signal.sh's _WAKE_HEAD_PREFIXES must match) to avoid
    # commenting on every human PR; continue-on-error so a comment hiccup can never
    # red the build.
    needs: [pr-validate, terraform-validate]
    if: ${{ success() && github.event_name == 'pull_request' && (startsWith(github.head_ref, 'agent/') || startsWith(github.head_ref, 'claude/') || startsWith(github.head_ref, 'ccr-')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write

    steps:
    - name: Signal green CI (wake a watching session)
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        for attempt in 1 2 3; do
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body "CI green: all required PR checks passed for ${{ github.event.pull_request.head.sha }}. Automated wake signal for a watching session; no action needed." \
            && break || sleep 3
        done
