name: convergence-health

# CD-convergence staleness escalation sensor (CD.35 Wave 6 / T2.35).
#
# Runs on a cron schedule (offset from terraform-drift's '17' to avoid
# concurrency pile-up) and on workflow_dispatch. Reads the sandbox convergence
# record, derives red_since / red_age_hours / unapplied_backlog, and queries
# GitHub Actions for stuck gated-apply approvals.
#
# On a threshold breach: files or updates exactly ONE tf_convergence_stale rec
# per red-episode via the ops portal (idempotent; never duplicates). On green:
# closes the open rec if present.
#
# Alarm-only invariants:
#   - NO terraform apply step.
#   - NO workflow_dispatch of terraform-apply-sandbox (not even a trigger attempt).
#   - Never writes the convergence record (red or green).
#   - Never re-fires the T2.20 latch.
#   - Not added to main-protection required_status_checks (Decision 83 non-wedging).
#
# Identity: assumes agent-platform-github-ci-branch (the same role ci-rca uses).
# That role already (a) reads the agent-platform-data-lake bucket so it can read
# convergence/personal/sandbox.json with no new grant, and (b) invokes the
# ducklake_writer Function URL so it can file recs via the ops portal.
#
# Also runs the T2.38 / Decision 125/126 DuckLake code-drift sensor on the same cron/identity:
# compares each deploy-records/ducklake/<function>.json's recorded source_git_sha against the
# latest main commit touching ducklake source and files/updates a single deduped
# ducklake_code_drift rec when stale (alarm-not-gate, mirrors the tf_convergence_stale pattern).
# The checkout below uses fetch-depth: 0 so the sensor can resolve real main git history -- a
# default shallow checkout would make it silently report no-drift (Decision 55 false-negative).
#
# Also runs the T2.43 / Decision 125/126 prod-class code-drift sensor the same way, comparing
# deploy-records/prod/<function>.json against the latest main commit touching prod source
# (scripts.convergence_health.PROD_SOURCE_PATHSPECS) and filing/updating/closing a single deduped
# prod_code_drift rec when stale.
#
# Also runs the rec-3288 CI budget-block warehouse ingester on the same cron/identity: sweeps the
# recent `selection-manifest` artifacts ci.yml's pr-validate job uploads on every run, extracts the
# PR #968 `budget` block, and files/updates ONE deduped budget_breach rec per (branch,
# dominant_phase) episode. This exists because pr-validate is credential-free (it also runs on fork
# PRs), so the local filing path skips the portal write in CI, and ci-rca.yml's own manifest fetch
# is gated on the default branch -- so a fast-tier breach, which does red pr-validate, reaches the
# warehouse nowhere: the breach population is invisible to it, and a breach on a PR head that is
# later fixed and merged leaves no warehouse trace at all. The step needs the job's existing
# `actions: read` grant (artifacts listing + download) and GH_TOKEN; it never closes a rec (a
# budget_breach rec is also filed by the local validate path, and an episode ageing out of the
# 14-day artifact retention is not evidence it was resolved), it never re-files an episode whose
# rec has been resolved (the trigger is an immutable artifact, so an open-recs-only dedupe would
# resurrect a human-closed rec every hour for 14 days), and it never buffers a failed write
# (Decision 84 I-4: no outbox -- a failure reds this step and the next tick re-derives from the
# artifact window).
#
# Also runs the LSA-02 scheduled-loop liveness sensor (audit loop-spec-adoption-4d8bac4a) on the
# same cron/identity: derives the schedule-bearing peer set from every .github/workflows/*.yml
# on:.schedule block AT RUN TIME (no declared register anywhere), asserts each peer's newest
# `event=schedule` run against a threshold derived from that peer's OWN cron, and files/updates
# (NEVER closes) a single deduped loop_liveness_stale rec per stale loop -- or one collapsed
# __fleet__ rec when 3+ peers are stale simultaneously. Alarm-only invariants, same posture as the
# tf_convergence_stale escalation above: no workflow_dispatch of a stale peer, no schedule edit, no
# close verb -- restored cadence does not auto-resolve a filed rec; a human investigates and closes
# it. The step needs the job's existing `actions: read` grant (per-peer run queries plus one
# workflow-state listing) and GH_TOKEN; it never touches terraform apply, the convergence record,
# or main-protection required_status_checks (Decision 83 non-wedging).

on:
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      diagnose:
        description: 'Read-only diagnostic mode: prints HealthVerdict and diagnose_stuck_approvals output without escalating'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Prevent overlapping health ticks from double-filing. cancel-in-progress: false
  # so a running tick always completes -- a cancelled tick might miss a close action.
  group: convergence-health
  cancel-in-progress: false

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write   # OIDC token minting for assume-role
      contents: read    # checkout
      actions: read     # query waiting gated-apply runs via GitHub API

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: the ducklake code-drift sensor resolves main git log

      - uses: ./.github/actions/aws-region

      - name: Configure AWS credentials (OIDC -- github_ci_branch role)
        uses: aws-actions/configure-aws-credentials@v6
        env:
          MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-branch
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies (venv)
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Assess convergence health and escalate
        env:
          GH_TOKEN: ${{ github.token }}
          CONVERGENCE_HEALTH_DIAGNOSE: ${{ inputs.diagnose && '1' || '' }}
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.convergence_health

      - name: Detect DuckLake code drift (T2.38 / Decision 125/126)
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.convergence_health --ducklake-drift

      - name: Detect prod-class code drift (T2.43 / Decision 125/126)
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.convergence_health --prod-drift

      - name: Ingest CI fast-tier budget breaches (rec-3288)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.convergence_health --budget-ingest

      - name: Assert scheduled loop liveness (LSA-02)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          .venv/bin/python -m scripts.convergence_health --sensor-liveness
