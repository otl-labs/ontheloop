name: decision-census

# Decision 177 append-only census (rec-5266): replays every main merge since the post-cleanse anchor that touched the
# Decision corpus and reports any that rewrote ratified text. Alarm, not gate (Decision 83 non-wedging).
#
# Invariants: never pull_request and never a required check; the census job holds no credential (workflow permissions
# contents: read, no id-token there); full-history checkout without persisted credentials; every remote action
# SHA-pinned. Daily schedule is the self-test heartbeat the loop-liveness sensor watches (the '*/24' hour form is
# required because sensor_liveness.cron_period_seconds rejects a fixed-hour daily shape).
#
# Exit contract (rec-5410): the census exits 1 on a finding or ledger defect, which the filer turns into a rec (the
# run stays green once filed); exit 2 (the census cannot complete) or a failed rec write reds the run and loop
# liveness backstops it. The credential sits only in file-recs, which runs on main and uses the CI branch role.

on:
  push:
    branches: [main]
    paths:
      - docs/DECISIONS.md
      - docs/DECISIONS_ARCHIVE.md
      - config/agent/decision_census.yaml
      - scripts/checks/decisions/append_only_census.py
      - scripts/checks/decisions/append_only_census_recs.py
      - scripts/checks/decisions/append_only_rule.py
      - scripts/checks/decisions/_baseline.py
      - scripts/decisions_md.py
      - scripts/preflight/decision_conditions.py
      - scripts/checks/_common.py
      - scripts/checks/registry.py
      - requirements.txt
      - .github/workflows/decision-census.yml
  schedule:
    - cron: '43 */24 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-census
  cancel-in-progress: false

jobs:
  census:
    if: (github.event_name != 'workflow_dispatch' || github.actor != 'otl-workflow-dispatcher[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history -- the replay walks every corpus merge since the anchor)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the census dependency
        run: python -m pip install --quiet pyyaml -c requirements.txt

      - name: Run census
        run: python -m scripts.checks.decisions.append_only_census --summary "$GITHUB_STEP_SUMMARY" --result "$RUNNER_TEMP/census-result.json" || test $? -le 1

      - name: Upload census result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: decision-census-result-${{ github.run_id }}
          path: ${{ runner.temp }}/census-result.json
          retention-days: 1

  file-recs:
    needs: census
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout (credential-free)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/aws-region

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Activate venv
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Configure AWS credentials (OIDC -- branch role, portal writes)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        env:
          MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-branch
          aws-region: ${{ env.AWS_REGION }}

      - name: Download census result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: decision-census-result-${{ github.run_id }}
          path: /tmp/decision_census

      - name: Run filer (file, update or close the census recs)
        run: .venv/bin/python -m scripts.checks.decisions.append_only_census_recs --file /tmp/decision_census/census-result.json
