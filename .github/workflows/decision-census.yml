name: decision-census

# Decision 177 append-only census (rec-5266): replays every main merge since the post-cleanse anchor that touched the
# Decision corpus and reports any that rewrote ratified text. Alarm, not gate (Decision 83 non-wedging).
#
# Invariants: never pull_request and never a required check; holds no credential (workflow permissions contents: read,
# the job has no id-token); full-history checkout without persisted credentials; every remote action SHA-pinned.
# Daily schedule is the self-test heartbeat the loop-liveness sensor watches (the '*/24' hour form is required because
# sensor_liveness.cron_period_seconds rejects a fixed-hour daily shape). rec-5410 adds rec filing; until it lands a
# finding reds this run.

on:
  push:
    branches: [main]
    paths:
      - docs/DECISIONS.md
      - docs/DECISIONS_ARCHIVE.md
      - config/agent/decision_census.yaml
      - scripts/checks/decisions/append_only_census.py
      - scripts/checks/decisions/append_only_rule.py
      - scripts/checks/decisions/_baseline.py
      - scripts/decisions_md.py
      - scripts/preflight/decision_conditions.py
      - scripts/checks/_common.py
      - scripts/checks/registry.py
      - requirements.txt
      - .github/workflows/decision-census.yml
  schedule:
    - cron: '43 */24 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: decision-census
  cancel-in-progress: false

jobs:
  census:
    if: (github.event_name != 'workflow_dispatch' || github.actor != 'otl-workflow-dispatcher[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history -- the replay walks every corpus merge since the anchor)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the census dependency
        run: python -m pip install --quiet pyyaml -c requirements.txt

      - name: Run census
        run: python -m scripts.checks.decisions.append_only_census --summary "$GITHUB_STEP_SUMMARY"
