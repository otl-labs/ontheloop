      - name: Install Python dependencies (venv)
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Smoke test -- lambda-telemetry-production (telemetry writer light production gate)
        run: .venv/bin/python -m scripts.ducklake_neon_smoke_test --lambda-telemetry-production

      - name: Smoke test -- lambda-telemetry-reader (telemetry reader production-pinned READ_ONLY proof)
        run: .venv/bin/python -m scripts.ducklake_neon_smoke_test --lambda-telemetry-reader
