name: deployment-approval-probe

# Inert, alarm-free manual probe target for rec-4695: proves what GitHub credentials cannot approve a
# pending deployment waiting on a reviewer-gated Environment. Never a required check (Decision 83);
# never add id-token or secrets. Separate from tf-gated-apply-prototype.yml on purpose (approving that
# one assumes the apply role through OIDC). Dispatch from main only.
#
# Re-run the probe (plan VP 5-9) after any change to the Claude GitHub App's permissions, repo
# ownership or admins, the reviewer set, or a new GitHub credential surface for agents (for example
# rec-4700's broker).

on:
  workflow_dispatch:
    inputs:
      bot_leg:
        description: Also run the GITHUB_TOKEN approval attempt (ci-bot leg)
        type: boolean
        default: false

permissions: {}

jobs:
  gated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: deployment-approval-probe
    permissions: {}
    steps:
      - name: Gate opened
        run: echo "deployment-approval-probe gate opened"

  bot-attempt:
    if: ${{ inputs.bot_leg }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Probe approval with GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          python3 -m scripts.session.deployment_approval_probe --leg ci-bot --repo "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --wait-pending 180 | tee -a "$GITHUB_STEP_SUMMARY"
