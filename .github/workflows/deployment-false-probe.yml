name: deployment-false-probe
# TEMPORARY: lives only on the build branch of rec-4913 and is deleted before the PR opens.
on:
  push:
    branches-ignore: [main]
    paths: [.github/workflows/deployment-false-probe.yml]
permissions: {}
jobs:
  ran:
    runs-on: ubuntu-latest
    steps:
      - run: echo "sibling job without an Environment ran"
  branch-refusal:
    runs-on: ubuntu-latest
    environment: {name: tf-trusted-plan, deployment: false}
    permissions: {}
    steps:
      - run: echo "BRANCH-REFUSAL-STEP-EXECUTED"
  claims:
    runs-on: ubuntu-latest
    environment: {name: deployment-approval-probe, deployment: false}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 -I scripts/ci/oidc_claims_probe.py --audience sts.amazonaws.com --require sub --require environment --require job_workflow_ref
