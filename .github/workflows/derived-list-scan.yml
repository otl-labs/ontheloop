name: derived-list-scan

# Weekly derived-list scan (rec-5516): finds hand-kept lists the repo can already enumerate, ranks them by coupled
# appends and files at most three code-smell recs at once. A report, never a gate: never pull_request or push, never a
# required check, not a registered check (no --pre or full-tier cost).
#
# Invariants: the scan job holds no credential (workflow permissions contents: read, no id-token there) and runs on a
# full-history checkout without persisted credentials; the credential sits only in file-recs, which runs on main and
# uses the CI branch role; every remote action is SHA-pinned. The weekly cron is a weekly-by-dow shape the
# loop-liveness sensor derives as a peer, so a run that cannot complete (scan exit 2 or a failed rec write) is
# backstopped by loop_liveness_stale.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: derived-list-scan
  cancel-in-progress: false

jobs:
  scan:
    if: (github.event_name != 'workflow_dispatch' || github.actor != 'otl-workflow-dispatcher[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history -- coupled appends read 90 days of commits)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the scan dependency
        run: python -m pip install --quiet pyyaml -c requirements.txt

      - name: Run the derived-list scan
        run: python -m scripts.checks.hygiene.derived_list_scan --result "$RUNNER_TEMP/derived-list-result.json" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload scan result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: derived-list-result-${{ github.run_id }}
          path: ${{ runner.temp }}/derived-list-result.json
          retention-days: 1

  file-recs:
    needs: scan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout (credential-free)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/aws-region

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Activate venv
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Configure AWS credentials (OIDC -- branch role, portal writes)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        env:
          MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-branch
          aws-region: ${{ env.AWS_REGION }}

      - name: Download scan result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: derived-list-result-${{ github.run_id }}
          path: /tmp/derived_list

      - name: Run filer (at most three open derived-list recs)
        run: .venv/bin/python -m scripts.checks.hygiene.derived_list_recs --file /tmp/derived_list/derived-list-result.json
