name: ghas-probe

# Standing GHAS live-probe (audit finding ULF-01, Decision 83/101).
#
# Verifies -- against the live GitHub API, not Terraform configuration -- that the three
# confidential-data-boundary controls (secret-scanning, secret-scanning push-protection, Actions
# permissions) are actually enabled. Decision 83 recorded these as applied-per-Terraform but left
# live verification outstanding; this workflow closes that gap on a recurring schedule.
#
# Design invariants (Decision 55 / Decision 80 / Decision 101):
#   - LOUD-FAIL, not skip: the runner (scripts.checks.misc.validate_ghas_probe, _run_cli) exits
#     non-zero on a proven-disabled control AND on any inability to verify (missing/expired/
#     mis-scoped token, 401/403, transport error) -- a token that silently stops working must
#     never read green, or ULF-01 is reintroduced one level up.
#   - No PR-triggered runs: the secret is never exposed to a fork-triggered run.
#   - Single probe implementation: this workflow invokes the same _probe() helper used by the
#     registered validate.py check (Decision 80) -- it does not reimplement the API calls.
#   - Control-state-only: the runner never prints raw response bodies or the token itself
#     (Decision 101 -- this is a PUBLIC repository).
#   - Alarm-only: this workflow detects and fails loudly; it never mutates any GitHub setting.
#
# Credentials (interim home pending rec (c); names/scopes/dates only, never a value -- Decision
# 101 public-repo boundary). This is the two PAT-class credential expiries, NOT a complete
# credential inventory -- TF_VAR_PLATFORM_ADMIN_EXTERNAL_ID and TF_VAR_PLATFORM_DEV_EXTERNAL_ID
# are a different class (IAM ExternalIds, no GitHub PAT clock) and belong to rec (c)'s inventory.
#   - GHAS_PROBE_TOKEN: fine-grained PAT, repo-scoped to benjamin-blake/theseus only.
#     Scopes: Administration (read-only), Secret scanning alerts (read-only), Metadata
#     (read-only, auto-required). Expires 2027-05-31.
#   - CLAUDE_CODE_OAUTH_TOKEN: Claude Code OAuth token (Max-plan subscription, no API billing).
#     Expires 2027-05-31. Not consumed by this workflow's run step -- recorded here for operator
#     convenience alongside the other repo PAT pending rec (c)'s durable home.
#   - Rotation procedure (either credential): re-mint with the same scopes, update the matching
#     GitHub Actions secret, re-run this workflow via workflow_dispatch, confirm the run is green,
#     then append fresh dated evidence to Decision 83 (docs/DECISIONS.md) and re-arm its
#     reversal-conditions stanza.

on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install probe dependencies
        # This runner has no .venv (CC-web-only convention); yaml is the only third-party need at
        # runtime (scripts.checks.registry -> scripts.checks._common's `import yaml`). Not
        # requirements.txt (ci.yml:69-72 documents it as a ~3GB disk-filling install) and not the
        # venv shape (would force the run line below to .venv/bin/python).
        run: pip install pyyaml

      - name: Run GHAS live-probe (loud-fail)
        env:
          GHAS_PROBE_TOKEN: ${{ secrets.GHAS_PROBE_TOKEN }}
        run: python -m scripts.checks.misc.validate_ghas_probe
