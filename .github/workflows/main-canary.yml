name: Main Canary

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - uses: ./.github/actions/aws-region

    - name: Configure AWS credentials (OIDC -- branch role)
      uses: aws-actions/configure-aws-credentials@v6
      env:
        MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}
      with:
        role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-branch
        aws-region: ${{ env.AWS_REGION }}

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.in', 'requirements-dev.in', 'requirements.txt', 'requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Validate full tier against main
      run: python -m scripts.validate

    - name: Upload pytest junit report (v2 fingerprint substrate)
      # ci-rca-identity-lifecycle: mirrors ci.yml's main-validate job -- Main Canary is a
      # ci-rca.yml workflow_run trigger too, so its pytest failures need the same v2 signature.
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pytest-junit
        path: logs/debug/pytest-junit.xml
        if-no-files-found: ignore
        retention-days: 14

    - name: Upload validation-result evidence (CI-RCA attribution substrate)
      # ci-rca-evidence-fidelity: mirrors ci.yml's main-validate job -- the canary run is the
      # workflow that produced all three misdiagnosed rec-2957/2958/2973 bundles, so it needs the
      # same attribution substrate as the primary CI path.
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: validation-result
        path: logs/debug/validation-result.json
        if-no-files-found: ignore
        retention-days: 14
