name: persona-verdict-egress-probe

# Keyless probe of the verdict shell's egress filter (PLAN-persona-verdict-shell-deny; T4.32 c7 shell leg). It runs the PR's own
# definition and code, so a build proves itself before merge. No secret, id-token, Environment or artifact. The
# egress-container job runs the digest-pinned persona image through the root launcher on an internal network behind a
# key-adding proxy (PLAN-persona-verdict-container-egress; container leg) and its control job shows each refusal is the control's.
# The filtered job shows a listed host reached and an unlisted name, raw IPs, outside resolvers and sudo refused; the
# unfiltered control shows each refusal is the filter's or the floor's and that the vendor's filter-supplied list is no
# wider than config/persona_verdict_egress.yaml's snapshot. Every filtered job lays the egress floor right after its
# checkout (PLAN-persona-verdict-egress-floor; rec-5362) and the drill jobs show a simulated mid-job revert cutting the
# job off with the floor's exit hook and leaving it open without. The filter no longer revokes sudo in its pre: entry
# (its switch is off), so the PR's own code runs with sudo until the floor step; every job here is keyless.
on:
  pull_request:
    paths:
      - tests/fixtures/persona_verdict/fixture_pr/**
      - config/persona_verdict_egress.yaml
      - config/persona_image.yaml
      - scripts/personas/egress_*.py
      - scripts/personas/run.py
      - .github/workflows/persona-verdict-egress-probe.yml

permissions: {}

jobs:
  egress-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: sts.amazonaws.com:443
          disable-telemetry: true
          disable-sudo-and-containers: false

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lay the egress floor
        id: probe-floor
        run: sudo python3 -I scripts/personas/run.py egress-floor

      - name: Probe the egress filter
        id: probe-egress
        run: python3 -I scripts/personas/run.py egress-probe

      - name: Check the egress filter again
        id: probe-final-check
        if: always()
        run: python3 -I scripts/personas/run.py egress-self-check

  egress-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install the control dependencies
        id: control-install
        run: pip install pyyaml -c requirements.txt

      - name: Probe without the filter
        id: control-egress
        run: python3 -I scripts/personas/run.py egress-control

  egress-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: api.deepseek.com:443 pkg-containers.githubusercontent.com:443
          disable-telemetry: true
          disable-sudo-and-containers: false

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lay the container egress floor
        id: container-floor
        run: sudo python3 -I scripts/personas/run.py egress-floor-container

      - name: Check the egress filter
        id: container-self-check
        run: python3 -I scripts/personas/run.py egress-self-check

      - name: Probe from the container
        id: container-probe
        run: python3 -I scripts/personas/run.py egress-container-request | sudo /usr/bin/python3 -I -S /usr/local/lib/persona-egress/egress_launcher.py probe

      - name: Check the egress filter again
        id: container-final-check
        if: always()
        run: python3 -I scripts/personas/run.py egress-self-check

  egress-container-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Probe from the container without the filter
        id: container-control
        run: python3 -I scripts/personas/run.py egress-container-control

  egress-fail-closed:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: sts.amazonaws.com:443
          disable-telemetry: true
          disable-sudo-and-containers: false

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: drill-floor
        id: drill-floor
        run: sudo python3 -I scripts/personas/run.py egress-revert-drill

      - name: drill-self-check
        id: drill-self-check
        run: python3 -I scripts/personas/run.py egress-self-check

      - name: drill-fail-closed
        id: drill-fail-closed
        run: python3 -I scripts/personas/run.py egress-fail-closed

      - name: drill-final-check
        id: drill-final-check
        if: always()
        run: python3 -I scripts/personas/run.py egress-self-check

  egress-fail-closed-control:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: sts.amazonaws.com:443
          disable-telemetry: true
          disable-sudo-and-containers: false

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: drill-floor
        id: drill-floor
        run: sudo python3 -I scripts/personas/run.py egress-revert-drill-control

      - name: drill-self-check
        id: drill-self-check
        run: python3 -I scripts/personas/run.py egress-self-check

      - name: drill-fail-closed
        id: drill-fail-closed
        run: python3 -I scripts/personas/run.py egress-fail-closed

      - name: drill-final-check
        id: drill-final-check
        if: always()
        run: python3 -I scripts/personas/run.py egress-self-check

  egress-fail-closed-verdict:
    needs: [egress-fail-closed, egress-fail-closed-control]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the drill jobs
        id: fail-closed-verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/personas/run.py egress-fail-closed-verdict
