name: persona-verdict-egress-probe

# Keyless probe of the verdict shell's egress filter (PLAN-persona-verdict-shell-deny; T4.32 c7 shell leg). It runs the PR's own
# definition and code, so a build proves itself before merge. No secret, id-token, Environment, container or artifact.
# The filtered job shows a listed host reached and an unlisted name, raw IPs, outside resolvers and sudo refused; the
# unfiltered control shows each refusal is the filter's and that the vendor's filter-supplied list is no wider than
# config/persona_verdict_egress.yaml's snapshot.
on:
  pull_request:
    paths:
      - tests/fixtures/persona_verdict/fixture_pr/**
      - config/persona_verdict_egress.yaml
      - scripts/personas/egress_*.py
      - scripts/personas/run.py
      - .github/workflows/persona-verdict-egress-probe.yml

permissions: {}

jobs:
  egress-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: sts.amazonaws.com:443
          disable-telemetry: true
          disable-sudo-and-containers: true

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Probe the egress filter
        id: probe-egress
        run: python3 -I scripts/personas/run.py egress-probe

  egress-control:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the control dependencies
        id: control-install
        run: pip install pyyaml -c requirements.txt

      - name: Probe without the filter
        id: control-egress
        run: python3 -I scripts/personas/run.py egress-control
