name: persona-verdict-trigger

# Secretless pull_request trigger (T4.2 c8, Decision 205 cl.2): no checkout, no uses:, no secrets, no Environment,
# permissions {}. Its conclusion carries no meaning; persona-verdict.yml (workflow_run, main's definition) reads only
# fields GitHub sets on the run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Echo the head SHA
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "persona-verdict trigger head_sha=$HEAD_SHA"
