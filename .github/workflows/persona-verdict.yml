name: persona-verdict

# The verdict chain shell (PLAN-persona-verdict-chain; T4.32 c1, T4.2 c8/c9/c12). workflow_run runs main's definition and
# main's code. The PR is resolved only from fields GitHub sets; the author allowlist fails closed; routing reads the diff.
# The override workflow's completion is a second upstream (PLAN-persona-verdict-override): the run job never runs on that
# event, so no persona runs on an override, and prepare resolves and proves the approval from GitHub's own records.
# No job reads a secret other than its GITHUB_TOKEN, holds id-token: write or names an Environment (the persona-verdict
# role is first assumed in PLAN-persona-verdict-egress). Only the post job holds checks: write.
on:
  workflow_run:
    workflows: [persona-verdict-trigger, persona-verdict-override]
    types: [completed]

permissions: {}

run-name: persona-verdict ${{ github.event.workflow_run.event }} ${{ github.event.workflow_run.head_sha }}

concurrency:
  group: persona-verdict-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_branch || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      allowlisted: ${{ steps.resolve.outputs.allowlisted }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false

      - name: Create the work directory
        run: mkdir -p "$RUNNER_TEMP/work"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml -c "$GITHUB_WORKSPACE/main/requirements.txt"

      - name: Resolve the pull request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" resolve

      - name: Route on the diff
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" route

      - name: Fetch the head snapshot
        if: steps.resolve.outputs.allowlisted == 'true' && steps.route.outputs.routes != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" fetch

      - name: Materialise the inputs
        if: steps.resolve.outputs.allowlisted == 'true' && steps.route.outputs.routes != '0'
        env:
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" materialise

      - name: Upload prepared inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-verdict-prepared
          path: ${{ runner.temp }}/work/prepared
          retention-days: 1

  run:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false

      - name: Create the work directory
        run: mkdir -p "$RUNNER_TEMP/work"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema -c "$GITHUB_WORKSPACE/main/requirements.txt"

      - name: Download prepared inputs
        if: needs.prepare.outputs.allowlisted == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-prepared
          path: ${{ runner.temp }}/work/prepared

      - name: Run the routed personas
        if: needs.prepare.outputs.allowlisted == 'true'
        env:
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" execute

      - name: Upload verdict results
        if: needs.prepare.outputs.allowlisted == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-verdict-results
          path: ${{ runner.temp }}/work/results
          retention-days: 1
          if-no-files-found: ignore

  post:
    needs: [prepare, run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
      actions: read
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false

      - name: Create the work directory
        run: mkdir -p "$RUNNER_TEMP/work"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml jsonschema -c "$GITHUB_WORKSPACE/main/requirements.txt"

      - name: Download prepared inputs
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-prepared
          path: ${{ runner.temp }}/work/prepared

      - name: Download verdict results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-results
          path: ${{ runner.temp }}/work/results

      - name: Post the check runs
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" post
