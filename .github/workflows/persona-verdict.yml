name: persona-verdict

# The verdict chain shell (PLAN-persona-verdict-chain; T4.32 c1, T4.2 c8/c9/c12). workflow_run runs main's definition and
# main's code. The PR is resolved only from fields GitHub sets; the author allowlist fails closed; routing reads the diff.
# The override workflow's completion is a second upstream (PLAN-persona-verdict-override): the run job never runs on that
# event, so no persona runs on an override, and prepare resolves and proves the approval from GitHub's own records.
# Only the keyed jobs (PLAN-persona-verdict-first-key-read: keyprep, smoke, refusal; PLAN-persona-verdict-fixture-run: run; fixture PRs only) read a secret other
# than GITHUB_TOKEN, hold id-token: write or name an Environment. smoke, in the persona-verdict Environment, first assumes
# the persona-verdict role and runs each tier role's cold start; refusal shows the role refuses a job outside the
# Environment. The post job (PLAN-persona-verdict-app-post) is the only App-token holder: in the persona-verdict-app
# Environment it builds every check body first, then mints one verdict App installation token and posts with it.
on:
  workflow_run:
    workflows: [persona-verdict-trigger, persona-verdict-override]
    types: [completed]

permissions: {}

run-name: persona-verdict ${{ github.event.workflow_run.event }} ${{ github.event.workflow_run.head_sha }}

concurrency:
  group: persona-verdict-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_branch || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      allowlisted: ${{ steps.resolve.outputs.allowlisted }}
      fixture: ${{ steps.route.outputs.fixture }}
      fallback_drill: ${{ steps.route.outputs.fallback_drill }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false

      - name: Create the work directory
        run: mkdir -p "$RUNNER_TEMP/work"

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml -c "$GITHUB_WORKSPACE/main/requirements.txt"

      - name: Resolve the pull request
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" resolve

      - name: Route on the diff
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" route

      - name: Fetch the head snapshot
        if: steps.resolve.outputs.allowlisted == 'true' && steps.route.outputs.routes != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" fetch

      - name: Materialise the inputs
        if: steps.resolve.outputs.allowlisted == 'true' && steps.route.outputs.routes != '0'
        env:
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" materialise

      - name: Upload prepared inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-verdict-prepared
          path: ${{ runner.temp }}/work/prepared
          retention-days: 1

  run:
    needs: [prepare, keyprep]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && github.event.workflow_run.event == 'pull_request' && needs.prepare.outputs.allowlisted == 'true' && needs.prepare.outputs.fixture == 'true' && needs.keyprep.result == 'success' }}
    environment: persona-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      primary_outage: ${{ steps.run-persona.outputs.primary_outage }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            sts.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443
            ssm.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443
            api.deepseek.com:443
            pkg-containers.githubusercontent.com:443
          disable-telemetry: true
          disable-sudo-and-containers: false

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false

      - name: Lay the container egress floor
        id: run-floor
        run: sudo python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-floor-container

      - name: Create the work directory
        id: run-mkdir
        run: mkdir -p "$RUNNER_TEMP/work"

      - name: Check the egress filter
        id: run-self-check
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-self-check

      - name: Download prepared inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-prepared
          path: ${{ runner.temp }}/work/prepared

      - name: Probe from the container
        id: run-probe
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-container-request | sudo /usr/bin/python3 -I -S /usr/local/lib/persona-egress/egress_launcher.py probe

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Download the wheelhouse
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-wheels
          path: ${{ runner.temp }}/work/wheels

      - name: Install the wheelhouse offline
        id: run-install
        run: |
          pip install --no-index --find-links "$RUNNER_TEMP/work/wheels" --require-hashes --no-deps --only-binary :all: -r "$GITHUB_WORKSPACE/main/docker/persona/requirements-persona.txt"

      - name: Run the fixture persona
        id: run-persona
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          PERSONA_AWS_REGION: ${{ needs.keyprep.outputs.aws_region }}
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
          PERSONA_ROLE: primary
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" persona-request | sudo /usr/bin/python3 -I -S /usr/local/lib/persona-egress/egress_launcher.py run | python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" persona-record

      - name: Upload verdict results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-verdict-results
          path: ${{ runner.temp }}/work/results
          retention-days: 1
          if-no-files-found: ignore

      - name: Probe from the container again
        id: run-probe-final
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-container-request | sudo /usr/bin/python3 -I -S /usr/local/lib/persona-egress/egress_launcher.py probe

      - name: Check the egress filter again
        id: run-final-check
        if: always()
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-self-check

  run-fallback:
    needs: [prepare, keyprep, run]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && github.event.workflow_run.event == 'pull_request' && needs.prepare.outputs.allowlisted == 'true' && needs.prepare.outputs.fixture == 'true' && needs.keyprep.result == 'success' && (needs.run.outputs.primary_outage == 'true' || needs.prepare.outputs.fallback_drill == 'true') }}
    environment: persona-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            sts.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443
            ssm.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443
            api.anthropic.com:443
            pkg-containers.githubusercontent.com:443
          disable-telemetry: true
          disable-sudo-and-containers: false

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false

      - name: Lay the container egress floor
        id: run-fallback-floor
        run: sudo python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-floor-container

      - name: Create the work directory
        id: run-fallback-mkdir
        run: mkdir -p "$RUNNER_TEMP/work"

      - name: Check the egress filter
        id: run-fallback-self-check
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-self-check

      - name: Download prepared inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-prepared
          path: ${{ runner.temp }}/work/prepared

      - name: Probe from the container
        id: run-fallback-probe
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-container-request | sudo /usr/bin/python3 -I -S /usr/local/lib/persona-egress/egress_launcher.py probe

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Download the wheelhouse
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-wheels
          path: ${{ runner.temp }}/work/wheels

      - name: Install the wheelhouse offline
        id: run-fallback-install
        run: |
          pip install --no-index --find-links "$RUNNER_TEMP/work/wheels" --require-hashes --no-deps --only-binary :all: -r "$GITHUB_WORKSPACE/main/docker/persona/requirements-persona.txt"

      - name: Run the fixture persona
        id: run-fallback-persona
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          PERSONA_AWS_REGION: ${{ needs.keyprep.outputs.aws_region }}
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
          PERSONA_ROLE: warm_fetched_escape_hatch
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" persona-request | sudo /usr/bin/python3 -I -S /usr/local/lib/persona-egress/egress_launcher.py run | python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" persona-record

      - name: Upload fallback verdict results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-verdict-results-fallback
          path: ${{ runner.temp }}/work/results
          retention-days: 1
          if-no-files-found: ignore

      - name: Probe from the container again
        id: run-fallback-probe-final
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-container-request | sudo /usr/bin/python3 -I -S /usr/local/lib/persona-egress/egress_launcher.py probe

      - name: Check the egress filter again
        id: run-fallback-final-check
        if: always()
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-self-check

  keyprep:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      aws_region: ${{ steps.region.outputs.aws_region }}
    steps:
      - name: Check out the workflow's commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve the project region
        id: region
        uses: ./.github/actions/aws-region

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Build the hash-locked wheelhouse
        id: keyprep-wheels
        run: |
          pip download --require-hashes --no-deps --only-binary :all: -r docker/persona/requirements-persona.txt -d "$RUNNER_TEMP/work/wheels"

      - name: Upload the wheelhouse
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persona-verdict-wheels
          path: ${{ runner.temp }}/work/wheels
          retention-days: 1
          if-no-files-found: error

  smoke:
    needs: [prepare, keyprep]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && github.event.workflow_run.event == 'pull_request' && needs.prepare.outputs.allowlisted == 'true' && needs.prepare.outputs.fixture == 'true' && needs.keyprep.result == 'success' }}
    environment: persona-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            sts.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443
            ssm.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443
            api.deepseek.com:443
            api.anthropic.com:443
          disable-telemetry: true
          disable-sudo-and-containers: false

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false

      - name: Lay the egress floor
        id: smoke-floor
        run: sudo python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-floor

      - name: Create the work directory
        id: smoke-mkdir
        run: mkdir -p "$RUNNER_TEMP/work"

      - name: Check the egress filter
        id: smoke-self-check
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-self-check

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Download the wheelhouse
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-wheels
          path: ${{ runner.temp }}/work/wheels

      - name: Install the wheelhouse offline
        id: smoke-install
        run: |
          pip install --no-index --find-links "$RUNNER_TEMP/work/wheels" --require-hashes --no-deps --only-binary :all: -r "$GITHUB_WORKSPACE/main/docker/persona/requirements-persona.txt"

      - name: Smoke the primary role
        id: smoke-primary
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          PERSONA_AWS_REGION: ${{ needs.keyprep.outputs.aws_region }}
          PERSONA_SMOKE_ROLE: primary
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" inference-smoke

      - name: Smoke the warm_fetched_escape_hatch role
        id: smoke-warm-fetched-escape-hatch
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          PERSONA_AWS_REGION: ${{ needs.keyprep.outputs.aws_region }}
          PERSONA_SMOKE_ROLE: warm_fetched_escape_hatch
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" inference-smoke

      - name: Check the egress filter again
        id: smoke-final-check
        if: always()
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-self-check

  refusal:
    needs: [prepare, keyprep]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && github.event.workflow_run.event == 'pull_request' && needs.prepare.outputs.allowlisted == 'true' && needs.prepare.outputs.fixture == 'true' && needs.keyprep.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: |
            sts.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443
          disable-telemetry: true
          disable-sudo-and-containers: false

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false

      - name: Lay the egress floor
        id: refusal-floor
        run: sudo python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-floor

      - name: Create the work directory
        id: refusal-mkdir
        run: mkdir -p "$RUNNER_TEMP/work"

      - name: Check the egress filter
        id: refusal-self-check
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-self-check

      - name: Show the role refuses a job outside the Environment
        id: refusal-attempt
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          PERSONA_AWS_REGION: ${{ needs.keyprep.outputs.aws_region }}
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" key-refusal

      - name: Check the egress filter again
        id: refusal-final-check
        if: always()
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-self-check

  post:
    needs: [prepare, run, run-fallback, keyprep]
    if: ${{ !cancelled() }}
    environment: persona-verdict-app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: read
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >-
            sts.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443
            ssm.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443
          disable-telemetry: true
          disable-sudo-and-containers: false

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false

      - name: Lay the egress floor
        id: post-floor
        run: sudo python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-floor

      - name: Create the work directory
        id: post-mkdir
        run: mkdir -p "$RUNNER_TEMP/work"

      - name: Check the egress filter
        id: post-self-check
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-self-check

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Download the wheelhouse
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-wheels
          path: ${{ runner.temp }}/work/wheels

      - name: Install the wheelhouse offline
        id: post-install
        run: |
          pip install --no-index --find-links "$RUNNER_TEMP/work/wheels" --require-hashes --no-deps --only-binary :all: -r "$GITHUB_WORKSPACE/main/docker/persona/requirements-persona.txt"

      - name: Download prepared inputs
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-prepared
          path: ${{ runner.temp }}/work/prepared

      - name: Download verdict results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-results
          path: ${{ runner.temp }}/work/results

      - name: Download fallback verdict results
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-results-fallback
          path: ${{ runner.temp }}/work/results-fallback

      - name: Post the check runs
        id: post-post
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          PERSONA_AWS_REGION: ${{ needs.keyprep.outputs.aws_region }}
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
          PERSONA_FALLBACK_RESULT: ${{ needs.run-fallback.result }}
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" post

      - name: Check the egress filter again
        id: post-final-check
        if: always()
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-self-check

  wake:
    needs: [prepare, post]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: main
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Create the work directory
        id: wake-mkdir
        run: mkdir -p "$RUNNER_TEMP/work"

      - name: Install dependencies
        id: wake-install
        run: pip install pyyaml -c "$GITHUB_WORKSPACE/main/requirements.txt"

      - name: Download prepared inputs
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: persona-verdict-prepared
          path: ${{ runner.temp }}/work/prepared

      - name: Post wake
        id: wake-post
        env:
          GH_TOKEN: ${{ github.token }}
          PERSONA_SNAPSHOT: ${{ runner.temp }}/snapshot
          POST_RESULT: ${{ needs.post.result }}
        working-directory: ${{ runner.temp }}/work
        run: python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" wake
