name: publish-ontheloop

# workflow_dispatch-only PyPI publish via OIDC Trusted Publishing (rec-3941, Decision 163/172).
#
# This workflow claims and republishes ONLY the `ontheloop` PyPI project via PyPI's Trusted
# Publisher OIDC exchange -- no PyPI API token is stored anywhere, and the `pypi` GitHub
# Environment's required reviewer gates every dispatch (see
# docs/contracts/package-registry-reservation.yaml VP step 20 / pypi_trusted_publisher). npm and
# crates.io publish locally by the operator -- no Node or Rust toolchain enters CI
# (PLAN-ontheloop-placeholder-packages constraint).
#
# Trigger: manual only, dispatched by the operator after building confidence via a local dry-run
# (twine check). Never runs on push or pull_request.
#
# proof_only (default false): proves a Trusted Publisher without creating a file. The build step runs
# scripts/ci/pypi_proof_only_guard.py, which refuses unless every built file is already on PyPI; the
# publish action then skips the duplicates and attests nothing (docs/contracts/github-org-transfer.yaml
# transfer_credentials, pypi_trusted_publisher).

on:
  workflow_dispatch:
    inputs:
      proof_only:
        description: "Publisher proof: re-upload the published version; PyPI skips the duplicate and no new file is created"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build distribution
        env:
          PROOF_ONLY: ${{ inputs.proof_only }}
        run: python -m pip install --upgrade build && python -m build packages/ontheloop-py && python -m scripts.ci.pypi_proof_only_guard ontheloop packages/ontheloop-py/dist

      - name: Publish to PyPI (Trusted Publishing -- OIDC, no token)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/ontheloop-py/dist
          skip-existing: ${{ inputs.proof_only }}
          attestations: ${{ !inputs.proof_only }}
