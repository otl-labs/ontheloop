name: rec-autoclose
# DECISIONS.md backfill edge (Decision 201 relocation): closure of Resolves: rec-NNNN trailers
# moved to ci.yml's trailer-census / trailer-acceptance-evaluate / trailer-closure jobs, which
# add the closure-time acceptance-verdict gate this workflow never carried. This workflow now
# retains only the DECISIONS.md -> ops_decisions backfill (Decision 84 single-portal invariant),
# gated on a DECISIONS.md change in the merge commit, and stays a ci_rca-watched workflow via
# that backfill step's failed-counter exit (Decision 155).
#
# See docs/contracts/git-ops.yaml::resolves_trailer and docs/contracts/git-ops.yaml::
# trailer_acceptance_gate for the current closure path and its refusal semantics.

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  autoclose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: ./.github/actions/aws-region

      - name: Detect DECISIONS.md change
        id: detect-decisions
        run: |
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only HEAD^ HEAD | grep -qx 'docs/DECISIONS.md'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        id: install-dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: Configure AWS credentials (OIDC -- branch role)
        id: aws-creds
        uses: aws-actions/configure-aws-credentials@v6
        env:
          MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-branch
          aws-region: ${{ env.AWS_REGION }}

      - name: Backfill decisions to warehouse
        if: "!cancelled() && steps.install-dependencies.outcome == 'success' && steps.aws-creds.outcome == 'success' && steps.detect-decisions.outputs.changed == 'true'"
        env:
          DUCKLAKE_WRITER_URL: ${{ secrets.DUCKLAKE_WRITER_URL }}
        run: |
          cd "$GITHUB_WORKSPACE"

          .venv/bin/python << 'PYEOF'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, os.environ.get("GITHUB_WORKSPACE", str(Path.cwd())))

          from scripts.ops_data_portal import backfill_decisions_from_md

          result = backfill_decisions_from_md()
          print(f"rec-autoclose: DECISIONS.md backfill result: {result}")
          sys.exit(1 if result["failed"] else 0)
          PYEOF
