name: reconcile

# Input-free workflow_dispatch "heal button" (Decision 126 / T2.37). Manually dispatched (an
# operator, or a future CD.17-reversal executor) to self-heal a stuck sandbox convergence record
# in ONE run: reads the red commit SHA directly from the durable convergence record via
# scripts/ci/reconcile_target.py (no operator-supplied SHA), re-runs the SAME deterministic guard
# terraform-apply-sandbox.yml uses, and re-applies the SAME plan.bin that was reviewed on the red
# commit's originating PR (no re-plan -- Decision 77 no-TOCTOU: only the frozen plan ARTIFACT is
# reused).
#
# Ref-resolution note (narrowed by Decision 154 / rec-2862 -- do NOT restate the old blanket
# claim): this workflow FILE ITSELF -- its job/step/`if:` definitions -- is always read at
# whatever the dispatch ref currently is; that is GitHub's own workflow-resolution behaviour, not
# something this file controls. That is NOT the same as saying the tooling those steps invoke
# resolves there too. apply-reconcile and gated-apply-reconcile both checkout ref: env.RED_SHA as
# their FIRST step, and every `uses: ./.github/actions/...` local composite-action reference in
# those jobs resolves against THAT checkout, not the dispatch ref -- so guard.py,
# review_verdict.py, fetch-saved-plan, materialise-tfvars, terraform-init-retry and
# write-convergence-record all still resolve from the RED_SHA checkout. The ONE exception is the
# artifact-fetch step ("Fetch reviewed DuckLake lambda packages"), which this plan repoints at a
# second, dispatch-ref-pinned checkout (path: .dispatch-tooling) specifically so it can load the
# NEW scripts.ci.ducklake_artifacts --mode fetch path added at the dispatch ref -- the RED_SHA
# checkout's copy predates this fix and is exactly what was stuck.
#
# Guard-PASS -> the apply-reconcile job below re-applies directly, behind the SAME
#               digest-fed subagent review gate as terraform-apply-sandbox.yml (T2.39): nothing
#               auto-applies without an explicit PROCEED token (plan constraint).
# Guard-BLOCK (out-of-budget IAM / trust / destroy) -> routed through THIS workflow's OWN
#               gated-apply-reconcile job (environment: tf-gated-apply) in the SAME run -- NOT
#               terraform-apply-sandbox.yml's gated-apply job, which is push-only
#               (github.event_name == 'push') and therefore unreachable from a workflow_dispatch.
#               Subsumes the routed case that previously stranded a dispatch-triggered
#               acknowledge-and-retry (rec-2647/rec-2523 dispatch-vs-push deadlock, T2.37 c3).
#
# DEP-10 (T2.47) -- fresh-replan fallthrough. ENTRY CONDITION IS A UNION of TWO causes, resolved
# by the `route` step below into a single `needs_fresh_plan` signal (rec-2847):
#   (a) stale_saved_plan  -- the verbatim apply of the saved plan.bin hit terraform's stale-plan
#       signature (state serial advanced out-of-band since the plan was captured); and
#   (b) guard_routed      -- the saved-plan guard BLOCKed, so the `apply` step was SKIPPED and
#       could never emit a stale signal at all. Before rec-2847 every fallthrough step was gated
#       on the (a) signal ALONE, which made the whole fallthrough STRUCTURALLY UNREACHABLE on a
#       guard-BLOCK -- and a BLOCK episode's own partial gated apply is exactly what stales its
#       saved plan. The union closes that cell.
# On either cause apply-reconcile does NOT latch red: it re-plans fresh in this SAME run
# (STALE_PLAN_FRESH_REPLAN) and re-runs the SAME deterministic guard against the fresh plan.
#
# THE COMPLETE TERMINAL ROUTE SET out of a saved-plan guard-BLOCK, post-rec-2847 (Decision 158 --
# there is no fourth):
#   (i)   fresh guard-PASS  -> digest-fed subagent review, then `apply_fresh` AUTO-APPLIES here,
#         with that review as the ONLY gate and NO tf-gated-apply Environment approval. This cell
#         was structurally impossible pre-fix; the narrowing of the Environment control's reach is
#         deliberate, human-adjudicated and recorded in Decision 158 -- not a side effect.
#   (ii)  fresh guard-ROUTE (out-of-budget IAM / trust / destroy residual) -> the fresh plan.bin is
#         handed to gated-apply-reconcile below via a run-scoped GitHub Actions artifact
#         (RECONCILE_FRESH_PLAN_ARTIFACT) with its sha256 passed as a job output and verified again
#         on download, so byte-integrity crosses the job boundary without new IAM/S3, and the apply
#         happens behind the tf-gated-apply Environment approval.
#   (iii) the fresh re-plan itself fails -> every downstream step short-circuits on `success()` and
#         the always-run record write latches RED. Pre-ratified by Decision 154 point 5(i), which
#         deliberately EXCLUDES `replan` from the closed pre-apply-failure allow-list.
#
# Green/absent convergence record -> clean no-op: resolve-target resolves nothing actionable, the
# apply/gated-apply jobs are skipped entirely, and the record is never written (T2.37 c1).
#
# Optional rec_id input: purely a traceability link to an open rec tracking the episode. When
# supplied, validated OPEN via the ops portal (ducklake_reader closed boundary, Decision 84) BEFORE
# anything else runs; an invalid/non-open rec-id fails the dispatch closed (T2.37 c2). Reconcile
# ALWAYS resolves the red commit from the convergence record itself, never from this input.
#
# Trust: resolve-target assumes agent-platform-github-ci-branch (read-only convergence record
# access + the DuckLake reader/writer invoke rights the T2.34:c2 gate confirms it holds -- needed
# for rec-id validation; github_ci_pr, which is otherwise read-only-first-choice, trusts only
# pull_request/refs/pull/* and cannot be assumed from a workflow_dispatch on main). apply-reconcile
# and gated-apply-reconcile assume agent-platform-github-ci-apply -- the SAME role
# terraform-apply-sandbox.yml's apply-sandbox/gated-apply jobs use, trusted for both
# ref:refs/heads/main (routine) and environment:tf-gated-apply (gated) subs. No new IAM surface:
# every role this workflow assumes already exists (Decision 92/94; guard-BLOCKED IAM role CREATEs
# are out of scope for this plan).

on:
  workflow_dispatch:
    inputs:
      rec_id:
        description: >-
          Optional: an open rec id (rec-NNNN) tracking the episode being reconciled. When
          supplied, validated OPEN via the ops portal before anything else runs. Purely a
          traceability link -- Reconcile always reads the red commit from the convergence record
          itself, never from this input.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # SAME group as terraform-apply-sandbox.yml: both drive apply against the same shared tfstate
  # and the same convergence record, so they must serialise against each other, not just against
  # themselves (a pending gated-apply-reconcile approval correctly queues a later routine push
  # behind it, and vice versa -- mirrors the existing gated-apply concurrency tradeoff).
  group: terraform-apply-sandbox
  cancel-in-progress: false

env:
  CONVERGENCE_BUCKET: agent-platform-data-lake
  CONVERGENCE_KEY: convergence/personal/sandbox.json
  WORKDIR: terraform/personal
  MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}

jobs:
  # ---------------------------------------------------------------------------
  # Resolve job: validate the optional rec-id FIRST (fail closed before anything else runs), then
  # read the convergence record and resolve the red commit SHA (or a clean no-op). No terraform /
  # tfstate access needed here -- read-only convergence record + DuckLake reader invoke only.
  # ---------------------------------------------------------------------------
  resolve-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      actionable: ${{ steps.target.outputs.actionable }}
      commit_sha: ${{ steps.target.outputs.commit_sha }}
      aws_region: ${{ steps.region.outputs.aws_region }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/aws-region
        id: region

      - name: Configure AWS credentials (OIDC -- branch role, convergence read + DuckLake reader invoke)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-branch
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install reconcile_target's runtime deps
        # This runner has no .venv (CC-web-only convention); install the minimal import-time deps
        # scripts/ci/reconcile_target.py and its src.common.ducklake_reader_client chain need directly.
        run: pip install boto3 requests

      - name: Resolve reconcile target (optional rec-id OPEN validation + convergence record read)
        id: target
        # Validates --rec-id (if supplied) BEFORE the convergence record is even read (T2.37 c2:
        # an invalid/non-open rec-id fails this step -- and therefore the whole dispatch -- closed).
        # Emits GITHUB_OUTPUT-compatible `key=value` lines directly (scripts/ci/reconcile_target.py
        # main()'s documented stdout contract).
        env:
          REC_ID: ${{ github.event.inputs.rec_id }}
        run: |
          set -euo pipefail
          # Invoked as a MODULE (-m), not a file path: the optional --rec-id validation path
          # does a deferred `from src.common.ducklake_reader_client import make_reader`, which only
          # resolves when the repo root is on sys.path. `python3 scripts/ci/reconcile_target.py`
          # puts scripts/ci/ on sys.path[0] instead (no repo root, no PYTHONPATH on the runner),
          # so `src` would fail to import and every rec-id dispatch would fail closed. `-m` from
          # the repo-root working directory (this step's default) puts the repo root on sys.path.
          if [ -n "$REC_ID" ]; then
            python3 -m scripts.ci.reconcile_target --rec-id "$REC_ID" --profile "" >> "$GITHUB_OUTPUT"
          else
            python3 -m scripts.ci.reconcile_target --profile "" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise
        run: |
          echo "actionable=${{ steps.target.outputs.actionable }}"
          echo "commit_sha=${{ steps.target.outputs.commit_sha }}"
          if [ "${{ steps.target.outputs.actionable }}" != "true" ]; then
            echo "Nothing to reconcile -- clean no-op, no record write, no apply."
          fi

  # ---------------------------------------------------------------------------
  # Apply-reconcile job: only runs when resolve-target found an actionable red commit. Re-runs the
  # guard against the SAME plan.bin the red commit's originating PR captured, re-applies on
  # guard-PASS behind the SAME digest-fed subagent review gate as terraform-apply-sandbox.yml
  # (T2.39), and routes guard-BLOCK to gated-apply-reconcile below (never auto-applies it).
  # ---------------------------------------------------------------------------
  apply-reconcile:
    needs: [resolve-target]
    if: needs.resolve-target.result == 'success' && needs.resolve-target.outputs.actionable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      routed: ${{ steps.resolved.outputs.routed }}
      # fresh_plan_pending: 'true' iff the DEP-10 stale fallthrough's fresh re-plan was itself
      # guard-ROUTEd (out-of-budget residual) -- gated-apply-reconcile downloads the
      # RECONCILE_FRESH_PLAN_ARTIFACT in that case instead of fetch-saved-plan.
      fresh_plan_pending: ${{ steps.upload_fresh_plan_sha256.outcome == 'success' }}
      fresh_plan_sha256: ${{ steps.upload_fresh_plan_sha256.outputs.sha256 }}
      # Decision 162 / rec-2664: consumed by the file-reconcile-starved-rec job below to detect a
      # STARVED episode without re-deriving the resolved triple a second time.
      review_outcome: ${{ steps.resolved.outputs.review_outcome }}
    permissions:
      id-token: write
      contents: read
      pull-requests: write  # best-effort wake comment on the red commit's originating PR
    env:
      TF_VAR_aws_profile: ""
      RED_SHA: ${{ needs.resolve-target.outputs.commit_sha }}

    steps:
      - name: Checkout the red commit
        # Explicitly the RED commit (not the dispatch ref's tip): the checked-out tree must match
        # the commit plan.bin was planned from, so terraform apply's own state/plan-serial checks
        # operate against the same tree the guard and reviewer inspected (Decision 77 no-TOCTOU).
        # NOT because a DuckLake lambda-zip rebuild needs to reproduce source_code_hash bytes from
        # this tree -- Decision 154 / rec-2862 replaced that rebuild with fetch_reviewed() below.
        # Terraform reads no build artifact (docs/contracts/environment-taxonomy.yaml conformance;
        # validate_terraform_no_build_artifact_reads), so nothing under lambda-packages/ is a plan
        # input for this checkout.
        # Any red commit Reconcile is ever dispatched against postdates this plan's merge (Reconcile
        # cannot meaningfully run before it exists), so scripts/ci/terraform_plan_digest.py,
        # scripts/ci/review_verdict.py, and scripts/ci/reconcile_target.py are always present here.
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RED_SHA }}

      - name: Checkout dispatch-ref tooling (side-checkout, Decision 154 / rec-2862)
        # Full checkout (not sparse) at path .dispatch-tooling -- .github/ must be present for the
        # composite action reference the fetch step below resolves against. Placed AFTER the root
        # RED_SHA checkout above: that checkout's git clean would otherwise wipe a side-checkout
        # placed before it. No ref: input -- defaults to the dispatch ref (this workflow file's
        # own trigger), NOT env.RED_SHA. This is the mechanism that lets the "Fetch reviewed
        # DuckLake lambda packages" step below load the NEW scripts.ci.ducklake_artifacts (added
        # at the dispatch ref) even while the root checkout is pinned to the red, pre-fix commit.
        # Everything else in this job (guard.py, review_verdict.py, fetch-saved-plan,
        # materialise-tfvars, terraform-init-retry, write-convergence-record) still resolves from
        # the RED_SHA root checkout -- only the artifact-fetch step moves to the dispatch ref.
        uses: actions/checkout@v7
        with:
          path: .dispatch-tooling

      - name: Configure AWS credentials (OIDC -- apply role, main only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-apply
          aws-region: ${{ needs.resolve-target.outputs.aws_region }}

      - name: Read pinned Terraform version
        id: tfver
        run: echo "version=$(cat config/terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Re-verify the record is still red at the resolved commit (race guard)
        id: recheck
        # Reconcile's target was resolved in a separate job/step; re-check immediately before
        # spending any apply-side work in case another run already cleared (or re-reded at a
        # DIFFERENT commit) the record in between. Never overwrites anything itself -- read-only.
        run: |
          set -euo pipefail
          pip install boto3 requests
          OUT=$(python3 -m scripts.ci.reconcile_target --profile "")
          echo "$OUT"
          CURRENT_SHA=$(printf '%s\n' "$OUT" | sed -n 's/^commit_sha=//p')
          ACTIONABLE=$(printf '%s\n' "$OUT" | sed -n 's/^actionable=//p')
          if [ "$ACTIONABLE" != "true" ] || [ "$CURRENT_SHA" != "$RED_SHA" ]; then
            echo "Record is no longer red at ${RED_SHA} (current: actionable=${ACTIONABLE} commit_sha=${CURRENT_SHA}) -- someone else already resolved this episode. Clean no-op, not touching the record." >&2
            echo "still_actionable=false" >> "$GITHUB_OUTPUT"
          else
            echo "still_actionable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Convergence precondition (refuse on red record)
        # Reconcile is a no-op when the record no longer matches what resolve-target saw (race
        # guard above) -- this step converts that into a hard `if: success()` gate for every
        # subsequent step, mirroring terraform-apply-sandbox.yml's own precondition contract.
        if: steps.recheck.outputs.still_actionable != 'true'
        run: |
          echo "::notice::Reconcile no-op -- the episode this run targeted is no longer red at ${RED_SHA}."
          exit 1

      - name: Materialise tfvars from Secrets Manager
        # id: tfvars is in the CLOSED pre-apply-failure allow-list (Decision 154 / rec-2862).
        id: tfvars
        if: success()
        uses: ./.github/actions/materialise-tfvars

      - name: Terraform init (S3 backend, sandbox)
        # id: tf_init is in the CLOSED pre-apply-failure allow-list (Decision 154 / rec-2862).
        id: tf_init
        if: success()
        uses: ./.github/actions/terraform-init-retry
        with:
          working-directory: ${{ env.WORKDIR }}

      - name: Resolve DuckLake artifact sha (content-addressed key, T2.42 c3)
        # The red commit's originating PR-head-sha -- resolved the same way as the "Fetch saved
        # plan" step below, from the job-level RED_SHA env (not the dispatch ref's tip).
        id: artifact_sha
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VALUE=$(gh api "repos/${REPO}/commits/${RED_SHA}/pulls" --jq '.[0].head.sha' 2>/dev/null || echo "")
          if [ -z "$VALUE" ] || [ "$VALUE" = "null" ]; then
            echo "::error::No originating PR resolved for ${RED_SHA}; cannot resolve the content-addressed artifact sha (Decision 77 no-TOCTOU)." >&2
            exit 1
          fi
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"

      - name: Fetch reviewed DuckLake lambda packages (no rebuild, Decision 154 / rec-2862)
        id: build_ducklake
        # Loads scripts.ci.ducklake_artifacts from the DISPATCH-REF side-checkout
        # (.dispatch-tooling), not the RED_SHA root checkout -- the RED_SHA copy has no --mode
        # fetch, which is precisely why this route was previously unreachable (the stuck
        # episode). working-directory MUST be .dispatch-tooling: the composite action's body runs
        # `python3 -m scripts.ci.ducklake_artifacts` under working-directory, so leaving it at the
        # default "." would still resolve the OLD RED_SHA module and die on the unrecognized
        # --mode argument. Consequence: lambda-packages/ lands under .dispatch-tooling/, NOT at
        # the workspace root -- safe because the fetch path's load-bearing output is the
        # server-side copy_object onto the fixed key, and Terraform reads no build artifact
        # (environment-taxonomy.yaml conformance; validate_terraform_no_build_artifact_reads), so
        # nothing under lambda-packages/ is a plan input -- the local download itself is dead
        # weight on this call site (~183 MB terraform never reads; rec-4248 makes the fetch
        # copy-only), retained only for call-site symmetry with the sandbox path. No
        # rebuild here, so no re-assert either -- Decision 77 no-TOCTOU is preserved by the
        # ORIGINAL PR-time byte-identical assert plus this fetch's own fail-closed missing-object
        # check (scripts/ci/ducklake_artifacts.py fetch_reviewed()), not by a second rebuild-assert.
        if: success()
        uses: ./.dispatch-tooling/.github/actions/build-ducklake-artifacts
        with:
          mode: fetch
          artifact-sha: ${{ steps.artifact_sha.outputs.value }}
          working-directory: .dispatch-tooling

      - name: Fetch saved plan from S3 (no re-plan, T2.21 parity)
        # Resolves the red commit's originating PR (number + head sha) and fetches the SAME
        # content-addressed plan.bin (DEP-07 c3) that PR's speculative-plan job persisted,
        # digest-verified (DEP-07 c2) -- never re-plans. Fails closed if no PR or no saved plan is
        # found; recovery is the SAME workflow_dispatch acknowledge-and-retry path
        # terraform-apply-sandbox.yml already exposes (which DOES re-plan, human-reviewed).
        # id: fetch_plan is in the CLOSED pre-apply-failure allow-list (Decision 154 / rec-2862).
        id: fetch_plan
        if: success()
        uses: ./.github/actions/fetch-saved-plan
        with:
          resolve-from-sha: ${{ env.RED_SHA }}
          produce-plan-json: 'true'
          working-directory: ${{ env.WORKDIR }}

      - name: Deterministic apply guard (fail-closed) -- saved plan
        id: guard
        # SAME three-way exit code contract as terraform-apply-sandbox.yml's guard step: 0 = PASS
        # (apply proceeds below), 2 = BLOCKED (routed=true, routes to gated-apply-reconcile, NOT a
        # failure), 1 = internal error (fails closed, record write below sets red).
        if: success()
        uses: ./.github/actions/deterministic-guard
        with:
          working-directory: ${{ env.WORKDIR }}

      - name: Subagent plan review (digest-fed, JSON-classified) -- saved plan
        # IDENTICAL contract to terraform-apply-sandbox.yml's review step (T2.39): digest on
        # stdin, no tools (--tools ""), --output-format json classified via review_verdict.py, a
        # STARVED verdict retries once at the SAME turn budget, and a still-STARVED outcome after
        # the retry is surfaced via steps.review.outputs.outcome for the record-write step below
        # to skip the red write on (Decision 55 anti-masking). Nothing auto-applies here without an
        # explicit PROCEED -- Reconcile's own apply path preserves the same fail-closed contract as
        # the routine push path (plan constraint: "nothing auto-applies without an explicit
        # PROCEED token OR explicit human approval").
        id: review
        if: success() && steps.guard.outputs.routed != 'true'
        uses: ./.github/actions/subagent-plan-review
        with:
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          working-directory: ${{ env.WORKDIR }}
          context-description: "a Reconcile heal-button re-apply of a previously red sandbox commit (${{ env.RED_SHA }})"

      - name: Terraform apply (same plan file the guard inspected) -- saved plan
        id: apply
        # DEP-10 STALE_PLAN_FRESH_REPLAN: Decision 77 no-TOCTOU is preserved -- the saved plan is
        # applied VERBATIM first, no re-plan up front. Only on terraform's specific stale-plan
        # signature (state serial advanced by an out-of-band admin apply since the plan was
        # captured) do we set stale=true and exit 0 (a genuine non-stale failure still exits
        # non-zero here, which fails this step and short-circuits the fresh-replan steps below via
        # their `success()` guards, falling through to the always-run record write as RED --
        # unchanged from the pre-DEP-10 contract).
        if: success() && steps.guard.outputs.routed != 'true'
        working-directory: ${{ env.WORKDIR }}
        run: |
          set +e
          STDERR_FILE=$(mktemp)
          bash "$GITHUB_WORKSPACE/.dispatch-tooling/scripts/ci/neon_api_key.sh" run -- terraform apply -input=false -lock-timeout=120s plan.bin 2>"$STDERR_FILE"
          rc=$?
          STDERR_CONTENT=$(cat "$STDERR_FILE")
          rm -f "$STDERR_FILE"
          set -e
          printf '%s\n' "$STDERR_CONTENT" >&2
          if [ "$rc" -eq 0 ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s' "$STDERR_CONTENT" | grep -Eiq 'saved plan is stale|plan file can no longer be applied|state was changed'; then
            echo "::notice::STALE_PLAN_FRESH_REPLAN -- saved plan.bin is stale (state serial advanced out-of-band since it was captured); falling through to a fresh guarded+reviewed re-plan in this SAME run (the sanctioned dispatch-ack exception, Decision 77)." >&2
            echo "stale=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "stale=false" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Resolve fresh-plan entry condition (saved-plan stale OR saved-plan guard-routed)
        id: route
        # rec-2847 / Decision 158. The SINGLE place the two fresh-replan causes are unioned, so no
        # fallthrough step below ever reads one cause in isolation again.
        #
        # WHY THIS STEP EXISTS: a destroy (or out-of-budget IAM / trust change) ALWAYS guard-BLOCKs,
        # which SKIPS the saved-plan `apply` step above -- and a skipped step emits no outputs, so
        # its stale signal is always empty on exactly the episodes most likely to need a fresh plan.
        # Gating the fallthrough on that signal alone made it unreachable on the BLOCK route.
        #
        # `if: success()` (NOT always()) is deliberate: a genuine NON-stale apply failure, or a guard
        # internal error (exit 1), must keep short-circuiting straight to the always-run record write
        # as RED, exactly as before this step existed. A guard BLOCK is exit 2 -> routed=true with the
        # action itself exiting 0, so success() is still true on the route this step exists to serve.
        if: success()
        env:
          SAVED_PLAN_STALE: ${{ steps.apply.outputs.stale }}
          SAVED_PLAN_ROUTED: ${{ steps.guard.outputs.routed }}
        run: |
          set -euo pipefail
          if [ "${SAVED_PLAN_STALE:-}" = "true" ]; then
            echo "::notice::STALE_PLAN_FRESH_REPLAN entry condition: stale_saved_plan."
            echo "needs_fresh_plan=true" >> "$GITHUB_OUTPUT"
            echo "fresh_reason=stale_saved_plan" >> "$GITHUB_OUTPUT"
          elif [ "${SAVED_PLAN_ROUTED:-}" = "true" ]; then
            echo "::notice::STALE_PLAN_FRESH_REPLAN entry condition: guard_routed -- the saved plan was guard-BLOCKed, so it was never applied and could not report staleness."
            echo "needs_fresh_plan=true" >> "$GITHUB_OUTPUT"
            echo "fresh_reason=guard_routed" >> "$GITHUB_OUTPUT"
          else
            echo "needs_fresh_plan=false" >> "$GITHUB_OUTPUT"
            echo "fresh_reason=" >> "$GITHUB_OUTPUT"
          fi

      - name: Fresh re-plan (STALE_PLAN_FRESH_REPLAN fallthrough)
        id: replan
        # Fires ONLY on the `route` union above -- never a silent re-plan-and-apply (plan
        # constraint). Re-plans against the ROOT checkout, which is `ref: ${{ env.RED_SHA }}` (see
        # "Checkout the red commit" above) -- NOT the dispatch ref: only the `.dispatch-tooling`
        # side-checkout sits at the dispatch ref (Decision 154 point 2). Planning at RED_SHA is what
        # makes the fresh plan a same-base successor of the saved one rather than a wider diff. Then
        # re-guarded, and re-reviewed below, before anything is ever applied.
        if: success() && steps.route.outputs.needs_fresh_plan == 'true'
        working-directory: ${{ env.WORKDIR }}
        run: |
          bash "$GITHUB_WORKSPACE/.dispatch-tooling/scripts/ci/neon_api_key.sh" run -- terraform plan -input=false -lock-timeout=120s -var-file=terraform.personal.tfvars -out=plan.bin
          terraform show -json plan.bin > plan.json

      - name: Deterministic apply guard (fail-closed) -- fresh re-plan
        id: guard_fresh
        if: success() && steps.route.outputs.needs_fresh_plan == 'true'
        uses: ./.github/actions/deterministic-guard
        with:
          working-directory: ${{ env.WORKDIR }}

      - name: Subagent plan review (digest-fed, JSON-classified) -- fresh re-plan
        # Re-runs the SAME digest-fed review gate against the FRESH plan -- guard-PASS never
        # auto-applies without an explicit PROCEED here either.
        id: review_fresh
        if: success() && steps.route.outputs.needs_fresh_plan == 'true' && steps.guard_fresh.outputs.routed != 'true'
        uses: ./.github/actions/subagent-plan-review
        with:
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          working-directory: ${{ env.WORKDIR }}
          context-description: "a Reconcile fresh re-plan after the saved plan went stale (STALE_PLAN_FRESH_REPLAN) for a previously red sandbox commit (${{ env.RED_SHA }})"

      - name: Terraform apply (fresh re-plan, guard-PASS)
        id: apply_fresh
        # ROUTE (i) of Decision 158's complete terminal set: when the FRESH guard PASSes, this step
        # auto-applies inside apply-reconcile with the subagent review above as the ONLY gate and NO
        # tf-gated-apply Environment approval. Pre-rec-2847 this cell was structurally unreachable
        # for a saved-plan guard-BLOCK episode. The narrowing of the Environment control's reach is
        # deliberate and human-adjudicated -- do NOT re-narrow it by adding a fresh_reason conjunct
        # here without also widening the uploader gate below, or a fresh guard-PASS episode strands
        # with no artifact and the gated job falls back to the STALE saved plan (Decision 158,
        # reversal conditions: it is a TWO-SITE change).
        if: success() && steps.route.outputs.needs_fresh_plan == 'true' && steps.guard_fresh.outputs.routed != 'true'
        working-directory: ${{ env.WORKDIR }}
        run: bash "$GITHUB_WORKSPACE/.dispatch-tooling/scripts/ci/neon_api_key.sh" run -- terraform apply -input=false -lock-timeout=120s plan.bin

      - name: Emit fresh plan.bin sha256 (RECONCILE_FRESH_PLAN_ARTIFACT sha256 job-output EMIT)
        # CARRY-1: the byte-integrity gate that crosses the job boundary to gated-apply-reconcile
        # must be independently checkable, not merely "an artifact exists" -- this job output is
        # verified again on download below (VERIFY, symmetric with this EMIT).
        id: upload_fresh_plan_sha256
        if: success() && steps.route.outputs.needs_fresh_plan == 'true' && steps.guard_fresh.outputs.routed == 'true'
        run: echo "sha256=$(sha256sum ${{ env.WORKDIR }}/plan.bin | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload fresh plan.bin as a run-scoped artifact (RECONCILE_FRESH_PLAN_ARTIFACT)
        # guard-ROUTE on the fresh re-plan (out-of-budget IAM/trust/destroy residual): hand the
        # fresh plan.bin to gated-apply-reconcile below via a GitHub-native run-scoped artifact
        # (workflow token only -- no new IAM, no S3 write) so the episode completes in this SAME
        # dispatch after one Environment approval, instead of stranding.
        if: success() && steps.route.outputs.needs_fresh_plan == 'true' && steps.guard_fresh.outputs.routed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reconcile-fresh-plan-${{ github.run_id }}
          path: ${{ env.WORKDIR }}/plan.bin
          retention-days: 1

      - name: Resolve final routing + apply outcome (saved-plan vs fresh-replan)
        id: resolved
        # Single place that collapses the two possible paths (verbatim saved-plan apply, or the
        # DEP-10 stale fallthrough's fresh re-plan) into the routed/apply-outcome/review-outcome
        # triple the record-write step below consumes -- so write-convergence-record's contract
        # (skip on routed, green iff apply succeeded) is satisfied identically regardless of which
        # path this run actually took.
        #
        # Decision 162 / rec-2923: review_step_outcome is emitted from the SAME branch as
        # review_outcome in every arm below -- `steps.review_fresh.outcome` pairs with
        # `steps.review_fresh.outputs.outcome`, `steps.review.outcome` pairs with
        # `steps.review.outputs.outcome`. A naive `steps.review.outcome` reused across all three
        # arms would pair the SAVED-PLAN review's step outcome with the FRESH-REPLAN path's value
        # on the two needs_fresh=true arms -- validating the wrong pair.
        if: always()
        run: |
          NEEDS_FRESH="${{ steps.route.outputs.needs_fresh_plan }}"
          GUARD_FRESH_ROUTED="${{ steps.guard_fresh.outputs.routed }}"
          if [ "$NEEDS_FRESH" = "true" ]; then
            if [ "$GUARD_FRESH_ROUTED" = "true" ]; then
              echo "routed=true" >> "$GITHUB_OUTPUT"
              echo "apply_outcome=skipped" >> "$GITHUB_OUTPUT"
              echo "review_outcome=" >> "$GITHUB_OUTPUT"
              echo "review_step_outcome=${{ steps.review_fresh.outcome }}" >> "$GITHUB_OUTPUT"
            else
              echo "routed=false" >> "$GITHUB_OUTPUT"
              echo "apply_outcome=${{ steps.apply_fresh.outcome }}" >> "$GITHUB_OUTPUT"
              echo "review_outcome=${{ steps.review_fresh.outputs.outcome }}" >> "$GITHUB_OUTPUT"
              echo "review_step_outcome=${{ steps.review_fresh.outcome }}" >> "$GITHUB_OUTPUT"
            fi
          else
            # routed=false is now provably the ONLY reachable value here, not a defaulted fallback:
            # reaching this branch means needs_fresh_plan != 'true', which -- by the `route` step's
            # own union -- means the saved-plan guard did NOT route. (The pre-rec-2847 form read
            # `routed=${GUARD_ROUTED:-false}`, which after the union became dead code that could
            # never yield true; it is removed rather than left silently unreachable.)
            echo "routed=false" >> "$GITHUB_OUTPUT"
            echo "apply_outcome=${{ steps.apply.outcome }}" >> "$GITHUB_OUTPUT"
            echo "review_outcome=${{ steps.review.outputs.outcome }}" >> "$GITHUB_OUTPUT"
            echo "review_step_outcome=${{ steps.review.outcome }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write convergence record (always-run, red-on-failure)
        id: record_write
        # IDENTICAL contract to terraform-apply-sandbox.yml's record-write step: skips the S3
        # write (does not overwrite) when this run was already a stale no-op (recheck), the guard
        # routed, or the reviewer was STARVED. green iff apply succeeded; red on any genuine
        # non-success (guard internal error / an explicit REVISE / apply failure). Consumes the
        # RESOLVED triple above so the saved-plan and fresh-replan paths share one write.
        #
        # Decision 154 / rec-2862: pre-apply-failure is computed INLINE from steps.apply /
        # steps.apply_fresh directly -- NEVER via steps.resolved (that aggregator is defined AFTER
        # both apply steps, which would contradict the subset rule). BOTH apply steps (apply AND
        # apply_fresh -- this job's DEP-10 stale-fallthrough can run either or both) must report
        # 'skipped' AND one of {artifact_sha, tfvars, tf_init, build_ducklake, fetch_plan} must
        # report 'failure'. guard/review/replan/guard_fresh/review_fresh are deliberately EXCLUDED
        # -- they must keep latching red.
        if: always()
        uses: ./.github/actions/write-convergence-record
        with:
          sha: ${{ env.RED_SHA }}
          apply-outcome: ${{ steps.resolved.outputs.apply_outcome }}
          still-actionable: ${{ steps.recheck.outputs.still_actionable }}
          routed: ${{ steps.resolved.outputs.routed }}
          review-outcome: ${{ steps.resolved.outputs.review_outcome }}
          review-step-outcome: ${{ steps.resolved.outputs.review_step_outcome }}
          plan-sha-mode: unchecked
          working-directory: ${{ env.WORKDIR }}
          pre-apply-failure: >-
            ${{ steps.apply.outcome == 'skipped' && steps.apply_fresh.outcome == 'skipped' && (steps.artifact_sha.outcome == 'failure' || steps.tfvars.outcome == 'failure' || steps.tf_init.outcome == 'failure' || steps.build_ducklake.outcome == 'failure' || steps.fetch_plan.outcome == 'failure') }}
          failed-step: >-
            ${{ steps.artifact_sha.outcome == 'failure' && 'artifact_sha' || (steps.tfvars.outcome == 'failure' && 'tfvars' || (steps.tf_init.outcome == 'failure' && 'tf_init' || (steps.build_ducklake.outcome == 'failure' && 'build_ducklake' || (steps.fetch_plan.outcome == 'failure' && 'fetch_plan' || '')))) }}

      - name: Best-effort wake comment on the red commit's originating PR
        if: always() && steps.recheck.outputs.still_actionable == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROUTED: ${{ steps.resolved.outputs.routed }}
          REVIEW_OUTCOME: ${{ steps.resolved.outputs.review_outcome }}
          APPLY_OUTCOME: ${{ steps.resolved.outputs.apply_outcome }}
          FRESH_REASON: ${{ steps.route.outputs.fresh_reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PR_NUM=$(gh api "repos/${REPO}/commits/${RED_SHA}/pulls" --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "No originating PR resolved for ${RED_SHA}; skipping wake comment."
            exit 0
          fi
          # A routed outcome now ALWAYS carries a fresh_reason: post-rec-2847 routed=true is only
          # emitted on the needs_fresh_plan branch of the `resolved` aggregator. The pre-rec-2847
          # "routed with no fresh re-plan" message is therefore unreachable and is not restated here.
          if [ "$FRESH_REASON" = "guard_routed" ]; then
            WHY="the saved plan.bin for ${RED_SHA} was guard-BLOCKed (so it was never applied and could not report staleness), and Reconcile re-planned fresh in this same run"
          else
            WHY="the saved plan.bin for ${RED_SHA} was stale (STALE_PLAN_FRESH_REPLAN), and Reconcile re-planned fresh in this same run"
          fi
          if [ "$ROUTED" = "true" ]; then
            # The tf-gated-apply approval is requested BEFORE gated-apply-reconcile starts, so at
            # approval time the reviewer can see nothing of the fresh plan from inside that job --
            # the only evidence lives in THIS run's apply-reconcile step logs. Name them, or the
            # approval is uninformed by construction.
            MSG="Reconcile: ${WHY}, then routed the FRESH plan to the tf-gated-apply job in reconcile.yml (out-of-budget IAM / trust / destroy). Pending reviewer approval in GitHub Actions -- the convergence record keeps its pending_gated marker until the gated apply completes. BEFORE APPROVING, review the fresh plan in this run's apply-reconcile job -- steps \`Fresh re-plan (STALE_PLAN_FRESH_REPLAN fallthrough)\` and \`Deterministic apply guard (fail-closed) -- fresh re-plan\` at ${RUN_URL} -- because the gated job itself shows nothing of it at approval time."
          elif [ "$REVIEW_OUTCOME" = "starved" ]; then
            MSG="Reconcile's subagent reviewer was STARVED for ${RED_SHA} (max-turns/no-verdict after retry); apply was blocked and the convergence record was NOT touched. Re-dispatch Reconcile once the reviewer is healthy."
          elif [ "$APPLY_OUTCOME" = "success" ]; then
            if [ -n "$FRESH_REASON" ]; then
              MSG="Reconcile: ${WHY}, re-guarded it, and converged GREEN; convergence record updated. The fresh plan guard-PASSed, so it was applied here behind the digest-fed subagent review rather than the tf-gated-apply Environment (Decision 158 route (i))."
            else
              MSG="Reconcile converged GREEN for ${RED_SHA}; convergence record updated."
            fi
          else
            MSG="Reconcile did NOT converge (RED) for ${RED_SHA}. Inspect this run's logs directly (ci-rca does not watch reconcile.yml)."
          fi
          gh pr comment "$PR_NUM" --repo "$REPO" --body "$MSG" || true

  # ---------------------------------------------------------------------------
  # Gated-apply-reconcile job: only when apply-reconcile's guard routed (out-of-budget IAM / trust
  # / destroy). Declares environment: tf-gated-apply so it does NOT start until a required
  # reviewer approves in GitHub Actions -- the Environment is the authorization boundary (Decision
  # 92), exactly as terraform-apply-sandbox.yml's own gated-apply job. Re-fetches plan.bin (no
  # shared artifact between jobs -- matches how the existing gated-apply job independently
  # re-fetches rather than depending on apply-sandbox's in-job copy); still the SAME plan.bin, no
  # re-plan. Subsumes the previously-stranded dispatch-vs-push deadlock (T2.37 c3; rec-2647/rec-2523):
  # this job -- not terraform-apply-sandbox.yml's push-only gated-apply -- is reachable from a
  # workflow_dispatch run.
  # ---------------------------------------------------------------------------
  gated-apply-reconcile:
    needs: [resolve-target, apply-reconcile]
    if: always() && needs.apply-reconcile.result == 'success' && needs.apply-reconcile.outputs.routed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: tf-gated-apply
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      TF_VAR_aws_profile: ""
      RED_SHA: ${{ needs.resolve-target.outputs.commit_sha }}

    steps:
      - name: Checkout the red commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RED_SHA }}

      - name: Checkout dispatch-ref tooling (side-checkout, Decision 154 / rec-2862)
        # Full checkout (not sparse) at path .dispatch-tooling -- .github/ must be present for the
        # composite action reference the fetch step below resolves against. Placed AFTER the root
        # RED_SHA checkout above: that checkout's git clean would otherwise wipe a side-checkout
        # placed before it. No ref: input -- defaults to the dispatch ref (this workflow file's
        # own trigger), NOT env.RED_SHA. This is the mechanism that lets the "Fetch reviewed
        # DuckLake lambda packages" step below load the NEW scripts.ci.ducklake_artifacts (added
        # at the dispatch ref) even while the root checkout is pinned to the red, pre-fix commit.
        # Everything else in this job (materialise-tfvars, terraform-init-retry, fetch-saved-plan,
        # write-convergence-record) still resolves from the RED_SHA root checkout -- only the
        # artifact-fetch step moves to the dispatch ref.
        uses: actions/checkout@v7
        with:
          path: .dispatch-tooling

      - name: Configure AWS credentials (OIDC -- apply role, main only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-apply
          aws-region: ${{ needs.resolve-target.outputs.aws_region }}

      - name: Read pinned Terraform version
        id: tfver
        run: echo "version=$(cat config/terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Materialise tfvars from Secrets Manager
        id: tfvars
        # Consolidation note: this job previously omitted the log-masking step (a latent gap on a
        # PUBLIC repo, Decision 101) -- the shared materialise-tfvars action always includes it,
        # closing the gap here as a disclosed, low-risk side effect of DEP-08 consolidation.
        uses: ./.github/actions/materialise-tfvars

      - name: Terraform init (S3 backend, sandbox)
        id: tf_init
        uses: ./.github/actions/terraform-init-retry
        with:
          working-directory: ${{ env.WORKDIR }}

      - name: Resolve DuckLake artifact sha (content-addressed key, T2.42 c3)
        # The red commit's originating PR-head-sha -- resolved the same way as the "Fetch saved
        # plan" step below, from the job-level RED_SHA env (not the dispatch ref's tip).
        id: artifact_sha
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VALUE=$(gh api "repos/${REPO}/commits/${RED_SHA}/pulls" --jq '.[0].head.sha' 2>/dev/null || echo "")
          if [ -z "$VALUE" ] || [ "$VALUE" = "null" ]; then
            echo "::error::No originating PR resolved for ${RED_SHA}; cannot resolve the content-addressed artifact sha (Decision 77 no-TOCTOU)." >&2
            exit 1
          fi
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"

      - name: Fetch reviewed DuckLake lambda packages (no rebuild, Decision 154 / rec-2862)
        id: build_ducklake
        # Loads scripts.ci.ducklake_artifacts from the DISPATCH-REF side-checkout
        # (.dispatch-tooling), not the RED_SHA root checkout -- the RED_SHA copy has no --mode
        # fetch. working-directory MUST be .dispatch-tooling: the composite action's body runs
        # `python3 -m scripts.ci.ducklake_artifacts` under working-directory, so leaving it at the
        # default "." would still resolve the OLD RED_SHA module and die on the unrecognized
        # --mode argument. This is precisely the job VP14's DEP-02 approval path runs through, so
        # a mis-wired working-directory here would break the resolution the whole plan exists to
        # deliver. Consequence: lambda-packages/ lands under .dispatch-tooling/, NOT at the
        # workspace root -- safe because the fetch path's load-bearing output is the server-side
        # copy_object onto the fixed key, and Terraform reads no build artifact
        # (environment-taxonomy.yaml conformance; validate_terraform_no_build_artifact_reads), so
        # nothing under lambda-packages/ is a plan input (rec-4248 makes the fetch copy-only).
        uses: ./.dispatch-tooling/.github/actions/build-ducklake-artifacts
        with:
          mode: fetch
          artifact-sha: ${{ steps.artifact_sha.outputs.value }}
          working-directory: .dispatch-tooling

      - name: Download fresh plan.bin artifact (RECONCILE_FRESH_PLAN_ARTIFACT handoff)
        # DEP-10: the stale-fallthrough's fresh re-plan was guard-ROUTEd in apply-reconcile --
        # download the SAME plan.bin it uploaded rather than re-fetching the (now-stale) saved
        # plan from S3. GitHub-native artifact transport only (workflow token) -- no new IAM/S3.
        if: needs.apply-reconcile.outputs.fresh_plan_pending == 'true'
        uses: actions/download-artifact@v8
        with:
          name: reconcile-fresh-plan-${{ github.run_id }}
          path: ${{ env.WORKDIR }}

      - name: Verify downloaded fresh plan.bin sha256 (RECONCILE_FRESH_PLAN_ARTIFACT sha256 download-side VERIFY)
        # CARRY-1: symmetric with apply-reconcile's EMIT -- re-derive the artifact's sha256 here
        # and compare against the job output it emitted, so byte-integrity across the job
        # boundary is independently checkable, not merely "an artifact was downloaded".
        if: needs.apply-reconcile.outputs.fresh_plan_pending == 'true'
        working-directory: ${{ env.WORKDIR }}
        env:
          FRESH_PLAN_SHA256: ${{ needs.apply-reconcile.outputs.fresh_plan_sha256 }}
        run: |
          set -euo pipefail
          ACTUAL=$(sha256sum plan.bin | cut -d' ' -f1)
          if [ "$ACTUAL" != "$FRESH_PLAN_SHA256" ]; then
            echo "::error::RECONCILE_FRESH_PLAN_ARTIFACT sha256 mismatch: expected ${FRESH_PLAN_SHA256}, got ${ACTUAL}. Refusing to apply a possibly-corrupted plan." >&2
            exit 1
          fi
          echo "RECONCILE_FRESH_PLAN_ARTIFACT sha256 verified: ${ACTUAL}"

      - name: Fetch saved plan from S3 (gated -- no re-plan)
        id: fetch_plan
        # Content-addressed by (pr, sha) -- DEP-07 c3, digest-verified -- DEP-07 c2. No plan.json
        # needed here (no re-guard in this job). Skipped when the fresh-replan artifact above
        # already supplied plan.bin (DEP-10 stale fallthrough's routed residual).
        if: needs.apply-reconcile.outputs.fresh_plan_pending != 'true'
        uses: ./.github/actions/fetch-saved-plan
        with:
          resolve-from-sha: ${{ env.RED_SHA }}
          produce-plan-json: 'false'
          working-directory: ${{ env.WORKDIR }}

      - name: Terraform apply (gated -- plan.bin verbatim, no re-plan)
        id: apply
        # Wrapped via scripts/ci/stale_plan_signature.py's --wrap mode (Decision 59 scope
        # discipline -- no new delegate script; the wrapped command stays literal, real argv in
        # this run: text): the wrapper runs terraform apply as a subprocess, re-emits its stderr,
        # preserves its exit code as this step's own (steps.apply.outcome is unchanged for every
        # other reader -- write-convergence-record, the pre-apply-failure predicate, best-effort
        # wake comment), and on a DEP-10 stale-plan stderr match emits a distinguishable
        # PLAN_STALE_CONCURRENT_WRITER ::error:: marker (diagnostic only; this is a Decision
        # 55/154 anti-masking guard -- it must never be folded into Decision 154's
        # pre-apply-failure allow-list below) so ci-rca gets a stable signature instead of a
        # generic failure_category=unknown. FAILS CLOSED exactly as before this wrapper existed --
        # no same-run fresh-replan fallthrough is added. DEP-10's fresh-replan (Decision 158) is
        # deliberately scoped to apply-reconcile's own non-gated apply step above, where no human
        # approval is at stake; silently substituting and auto-applying a fresh plan at this
        # human-gated site after approval was granted for specific reviewed content would violate
        # Decision 92's Environment-gates-execution security model. Recovery stays the
        # workflow_dispatch acknowledge-and-retry path only.
        working-directory: ${{ env.WORKDIR }}
        run: bash "$GITHUB_WORKSPACE/.dispatch-tooling/scripts/ci/neon_api_key.sh" run -- python3 "$GITHUB_WORKSPACE/scripts/ci/stale_plan_signature.py" --wrap -- terraform apply -input=false -lock-timeout=120s plan.bin

      - name: Write convergence record (always-run, red-on-failure)
        id: record_write
        # No precondition check here: the shared concurrency group (cancel-in-progress: false)
        # serialises ALL applies against the same tfstate + record while this job holds the group
        # pending approval -- the SAME implicit serialisation invariant terraform-apply-sandbox.yml's
        # gated-apply job already relies on.
        #
        # Decision 154 / rec-2862: pre-apply-failure is the CLOSED-allow-list conjunction, computed
        # INLINE -- (a) the SOLE apply step reports 'skipped' AND (b) one of {artifact_sha, tfvars,
        # tf_init, build_ducklake, fetch_plan} reports 'failure'. This is precisely the job VP14's
        # DEP-02 approval path runs through.
        if: always()
        uses: ./.github/actions/write-convergence-record
        with:
          sha: ${{ env.RED_SHA }}
          apply-outcome: ${{ steps.apply.outcome }}
          plan-sha-mode: unchecked
          working-directory: ${{ env.WORKDIR }}
          review-step-outcome: ""
          pre-apply-failure: >-
            ${{ steps.apply.outcome == 'skipped' && (steps.artifact_sha.outcome == 'failure' || steps.tfvars.outcome == 'failure' || steps.tf_init.outcome == 'failure' || steps.build_ducklake.outcome == 'failure' || steps.fetch_plan.outcome == 'failure') }}
          failed-step: >-
            ${{ steps.artifact_sha.outcome == 'failure' && 'artifact_sha' || (steps.tfvars.outcome == 'failure' && 'tfvars' || (steps.tf_init.outcome == 'failure' && 'tf_init' || (steps.build_ducklake.outcome == 'failure' && 'build_ducklake' || (steps.fetch_plan.outcome == 'failure' && 'fetch_plan' || '')))) }}

      - name: Best-effort wake comment on the red commit's originating PR
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          PR_NUM=$(gh api "repos/${REPO}/commits/${RED_SHA}/pulls" --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            exit 0
          fi
          if [ "$APPLY_OUTCOME" = "success" ]; then
            MSG="Reconcile's gated apply converged GREEN for ${RED_SHA} (IAM/trust/destroy change applied after reviewer approval); convergence record updated."
          else
            MSG="Reconcile's gated apply did NOT converge (RED) for ${RED_SHA}. Inspect this run's logs directly."
          fi
          gh pr comment "$PR_NUM" --repo "$REPO" --body "$MSG" || true

  # ---------------------------------------------------------------------------
  # File-reconcile-starved-rec job: Decision 162 / rec-2664. A starved Reconcile subagent reviewer
  # (max-turns/no-verdict/API-exhausted after the same-budget retry) blocks apply WITHOUT latching
  # the convergence record red (Decision 55 anti-masking, T2.39 c3) -- correct, but on the
  # Reconcile heal-button path that silence has no durable record anywhere else. This job closes
  # that observability gap: it files ONE durable rec per starved episode and is otherwise a LEAF --
  # it applies nothing, gates nothing downstream, and is no part of reconcile.yml's terminal route
  # set (Decision 158). `always()` in the `if:` is load-bearing: apply-reconcile CONCLUDES
  # `failure` on a starved episode (review.sh exits 1 on STARVED), so a bare `needs:` dependant
  # would be SKIPPED on exactly the episode this job exists to record.
  # ---------------------------------------------------------------------------
  file-reconcile-starved-rec:
    needs: [resolve-target, apply-reconcile]
    if: always() && needs.apply-reconcile.outputs.review_outcome == 'starved'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC -- branch role, DuckLakeInvokeCI writer grant)
        # github_ci_apply (the apply-role apply-reconcile/gated-apply-reconcile assume) holds NO
        # lambda invoke grant at all -- this filing job must NOT run under it. The branch role is
        # not the UNIQUE holder of DuckLakeInvokeCI (github_ci_pr carries a statement too,
        # oidc.tf:712), but it is the correct one for this dispatch-on-main path (mirrors
        # resolve-target's own role choice above).
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-branch
          aws-region: ${{ needs.resolve-target.outputs.aws_region }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install -r requirements.txt

      - name: File reconcile_starved rec (Decision 55 anti-masking observability)
        env:
          DUCKLAKE_WRITER_URL: ${{ secrets.DUCKLAKE_WRITER_URL }}
          RED_SHA: ${{ needs.resolve-target.outputs.commit_sha }}
        run: |
          cd "$GITHUB_WORKSPACE"

          .venv/bin/python << 'PYEOF'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, os.environ.get("GITHUB_WORKSPACE", str(Path.cwd())))

          from scripts.ops_data_portal import file_rec

          red_sha = os.environ.get("RED_SHA", "unknown")
          repo = os.environ.get("GITHUB_REPOSITORY", "unknown")
          run_id = os.environ.get("GITHUB_RUN_ID", "unknown")
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          fields = {
              "title": f"Reconcile subagent reviewer STARVED for {red_sha}",
              "file": ".github/workflows/reconcile.yml",
              "status": "open",
              "source": "reconcile_starved",
              "priority": "High",
              "effort": "S",
              "risk": "low",
              "verification_tier": "V2",
              "context": (
                  "Reconcile's subagent plan reviewer STARVED (max-turns/no-verdict/API-exhausted "
                  "after the same-budget retry, T2.39 c2) while re-applying previously red sandbox "
                  f"commit {red_sha}. Apply was blocked and the convergence record was NOT "
                  "overwritten (Decision 55 anti-masking, T2.39 c3) -- correct behaviour, but this "
                  "rec is the durable record of the episode on the Reconcile heal-button path. "
                  f"Run: {run_url}."
              ),
              # MUST be a single runnable inline command, never prose: the portal registers
              # acceptance_lint as a WRITE-TIME validator (scripts/executor/acceptance_lint.py runs
              # `bash -n` on this value), so a prose sentence -- especially one containing
              # parentheses -- makes file_rec RAISE and this job file nothing on precisely the
              # starved episode it exists to record. Verified offline by
              # TestReconcileStarvedFilingJobShape::test_acceptance_passes_the_live_portal_linter.
              "acceptance": (
                  "aws s3 cp s3://agent-platform-data-lake/convergence/personal/sandbox.json - "
                  "--profile agent_platform | grep -q green"
              ),
          }
          rec_id = file_rec(fields)
          print(f"file-reconcile-starved-rec: filed {rec_id}")
          PYEOF
