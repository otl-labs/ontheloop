name: subagent-review-smoke

# Dispatch-only smoke of the real merge-time plan reviewer (rec-4639, fork 3a): runs the pinned
# claude CLI on a sentinel fixture and fails on a starved outcome or any SENTINEL- value in the
# digest or transcripts. Maintainer-dispatched (Decision 205 clause 1); never a gate on main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run reviewer smoke
        id: run-smoke
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: bash scripts/ci/subagent_review_smoke.sh
