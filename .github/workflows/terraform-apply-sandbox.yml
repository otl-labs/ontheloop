name: terraform-apply-sandbox

# Sandbox PLATFORM-environment auto-apply (Decision 77, docs/contracts/environment-taxonomy.yaml).
#
# On push to main touching terraform/personal/**, this workflow plans the personal root module,
# runs scripts/terraform_apply_guard.py (deterministic, fail-closed) over the plan JSON, then a
# subagent plan review, then applies the SAME plan file the guard inspected (no re-plan -- avoids
# TOCTOU). Branch protection is now active (main-protection ruleset, Decision 83 / CD.20), but
# deliberately non-wedging -- the guard plus the subagent review ARE the plan-content gate, and both fail closed.
#
# CD.35 / T2.20 (Wave 1) adds the server-side convergence anchor on top of the above:
#   - A read-PRECONDITION before apply REFUSES (distinguishable marker CONVERGENCE_RED, record NOT
#     overwritten) when the durable convergence record is red -- the SOLE hard block, unbypassable
#     by any merge-path actor. An absent record = first-apply-allowed (pass-on-absent).
#   - An ALWAYS-run record-write after apply writes status=green on success / status=red on failure
#     to s3://agent-platform-data-lake/convergence/personal/sandbox.json (its OWN prefix, NOT under
#     tfstate/), so a failed apply can never leave a stale green. Write-IAM is apply-identity-only.
#   - A red record clears ONLY via the workflow_dispatch acknowledge-and-retry path (input names the
#     red commit or rec id); a plain push never clears red (auto-allow-descendants is rejected --
#     on linear-history main every commit is a descendant, so the latch would never latch).
#   - A read-only pull_request job posts the ADVISORY terraform-converged commit status (NOT a
#     required check, Decision 83) under the read-only PR role.
#   - A best-effort post-merge SHA->PR wake (Decision 76 poll-free; next-planning-session re-check
#     is the authoritative baseline). Apply failures wire into ci-rca.yml (Decision 72/55).
#
# CD.35 / T2.22 (Wave 3) adds a human-gated CD apply path for the guard fail-closed set:
#   - The guard BLOCK verdict (exit 2) now sets a job output routed=true and exits 0 -- routing is
#     not a failure; the apply-sandbox job stays green and the convergence record is NOT touched.
#   - A new gated-apply job (needs: apply-sandbox, if: routed == 'true', environment:
#     tf-gated-apply) fetches the SAME plan.bin the guard inspected and applies it VERBATIM after a
#     human reviewer approves in GitHub Actions (no re-plan -- Decision 77 no-TOCTOU).
#   - The gated-apply job reuses the T2.20 always-run red-on-failure convergence record write so a
#     failed gated apply writes red and files a ci-rca rec (Decision 55/72 anti-masking preserved).
#   - The gated-apply job is NOT a PR required check (Decision 83 / T2.22 constraint).
#   - The routine guard-PASS auto-apply path is unchanged.
#
# Decision 183: TWO heal verbs reach gated-apply, both fed by Decision 77 artifact identity --
#   - push: the digest-verified saved plan.bin fetched from S3 (fetch_plan, T2.21/DEP-07).
#   - workflow_dispatch acknowledge-and-retry, guard-ROUTED: the SAME run's fresh plan.bin the
#     guard inspected, handed over as a run-scoped SANDBOX_FRESH_PLAN_ARTIFACT (sha256 EMIT in
#     apply-sandbox, VERIFY in gated-apply -- reconcile.yml's RECONCILE_FRESH_PLAN_ARTIFACT
#     pattern, verbatim). The two plan sources are mutually exclusive per run (fetch_plan is
#     gated on push AND fresh_plan_pending != 'true'); a saved plan.bin is NEVER fetched on a
#     dispatch. See docs/contracts/environment-taxonomy.yaml axis_a.sandbox_gated_apply and
#     docs/contracts/deploy-paths.yaml's reconcile row for the routing rule between this path and
#     reconcile.yml's red-commit replay.
#
# Trust: assumes agent-platform-github-ci-apply, which trusts refs/heads/main ONLY (oidc.tf). A PR
# or agent/* branch cannot assume it, so auto-apply is reachable only via a merge to main. The
# advisory PR job assumes the read-only agent-platform-github-ci-pr role (refs/pull/*).

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/personal/**'
  pull_request:
    paths:
      - 'terraform/personal/**'
  workflow_dispatch:
    inputs:
      acknowledge_red_commit:
        description: >-
          Unlatch a RED convergence record: name the red commit SHA (or the open rec id, rec-NNNN).
          This is the ONLY sanctioned path to clear red; a successful apply from this run writes
          green. Plans fresh at main HEAD -- if the guard ROUTES the fresh plan (IAM/trust/destroy
          diff), it reaches the tf-gated-apply Environment in THIS run via SANDBOX_FRESH_PLAN_ARTIFACT
          (Decision 183), the same Environment approval a routine push-path guard-BLOCK routes
          through. Leave blank for a routine manual apply (refused if the record is red).
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Event-keyed (T2.35 hardening, incident #559/#560): pull_request runs get a per-PR key so a
  # gated-apply approval held on one PR's run can no longer cancel a follow-on PR's saved
  # speculative plan.bin. push/workflow_dispatch runs keep the EXISTING shared key (NOT renamed
  # -- reconcile.yml deliberately joins it, Decision 77/92/94 no-TOCTOU cross-workflow
  # serialization) with cancel-in-progress OFF, held for the whole run (apply-sandbox through the
  # gated-apply approval wait) -- serialising applies against shared S3 state and closing the
  # read-precondition -> apply -> write-record race between rapid merges (CD.35 5.5b).
  group: >-
    ${{ github.event_name == 'pull_request' && format('terraform-apply-plan-pr-{0}',
    github.event.pull_request.number) || 'terraform-apply-sandbox' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The convergence record lives in its OWN S3 prefix, OUTSIDE tfstate/ (CD.35 5.5c): the read-only
  # PR role gets read on this prefix only and must never gain tfstate read.
  CONVERGENCE_BUCKET: agent-platform-data-lake
  CONVERGENCE_KEY: convergence/personal/sandbox.json
  MASK_AWS_ROLE_ID_ACCOUNT_PART: ${{ secrets.AWS_ROLE_ID_ACCOUNT_PART }}

jobs:
  # ---------------------------------------------------------------------------
  # Apply job: push to main + the sanctioned workflow_dispatch unlatch ONLY.
  # NOT pull_request (PRs get the read-only advisory job below; a PR cannot assume the apply role).
  # ---------------------------------------------------------------------------
  apply-sandbox:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # routed=true when the guard exits 2 (IAM/trust/destroy diff) -- signals the gated-apply
      # job to fetch the SAME plan (saved, on push; the fresh SANDBOX_FRESH_PLAN_ARTIFACT, on a
      # routed workflow_dispatch) and wait for human approval. The convergence record is NOT
      # touched while routed (anti-masking, T2.22 / Decision 55).
      routed: ${{ steps.guard.outputs.routed }}
      # artifact_sha: the SAME content-addressed sha the plan.bin (saved or fresh) was built
      # against -- gated-apply's artifact_sha step echoes this verbatim instead of re-resolving it
      # (Decision 183; a re-resolution would fail on a dispatch commit with no originating PR).
      artifact_sha: ${{ steps.artifact_sha.outputs.value }}
      # fresh_plan_pending/fresh_plan_sha256: the SANDBOX_FRESH_PLAN_ARTIFACT hand-off (Decision
      # 183, mirrors reconcile.yml's RECONCILE_FRESH_PLAN_ARTIFACT). fresh_plan_pending is true
      # only on a guard-ROUTED workflow_dispatch (the EMIT step below only runs on that path);
      # gated-apply's fetch_plan step is gated on its negation so the two plan sources stay
      # mutually exclusive.
      fresh_plan_pending: ${{ steps.upload_fresh_plan_sha256.outcome == 'success' }}
      fresh_plan_sha256: ${{ steps.upload_fresh_plan_sha256.outputs.sha256 }}
    permissions:
      id-token: write       # REQUIRED for OIDC token minting
      contents: read
      pull-requests: write  # best-effort post-merge SHA->PR wake comment (CD.35 5.3)
      actions: write        # self-dispatch ci-rca on a re-run failure (workflow_run re-run gap)

    env:
      # The personal provider defaults profile = var.aws_profile (agent_platform_admin), which does
      # not exist on a GitHub-hosted runner. Blank it so the AWS provider uses the OIDC-exported
      # credential env vars (configure-aws-credentials) instead of a named profile.
      TF_VAR_aws_profile: ""
      # All other required root-module variables are sourced from the
      # agent-platform-terraform-personal-tfvars Secrets Manager secret (fetched by the
      # "Materialise tfvars" step below). New no-default vars only require updating that secret.
      WORKDIR: terraform/personal

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/aws-region

      - name: Configure AWS credentials (OIDC -- apply role, main only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Read pinned Terraform version
        id: tfver
        run: echo "version=$(cat config/terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Convergence precondition (refuse on red record -- sole hard block)
        id: precond
        # CD.35 5.5: the SOLE server-side hard block. Read the durable convergence record; if main
        # is non-converged (status=red) REFUSE this run and do NOT overwrite the record -- UNLESS
        # this is the workflow_dispatch acknowledge-and-retry path naming the red commit/rec. An
        # absent record = first-apply-allowed (pass-on-absent). The refusal emits a distinguishable
        # marker (CONVERGENCE_RED) so ci-rca can dedupe refusals against the open red-record rec.
        # Decision 190: the refusal message names the MEASURED cause via
        # `python3 -m scripts.ci.convergence_classify --refusal` (this job already has
        # actions/checkout@v7 as its first step, so the -m form resolves) -- never presenting a
        # stale last-successful-apply commit as the cause of a drift-flip red.
        env:
          ACK: ${{ github.event.inputs.acknowledge_red_commit }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Fail-CLOSED read: the precondition is the SOLE hard block, so a read it cannot complete
          # must NOT silently degrade to pass-on-absent. Distinguish a genuinely-absent record
          # (NoSuchKey/404 -> first-apply-allowed) from any other error (transient / AccessDenied ->
          # REFUSE without overwriting; the operator re-runs once S3 is reachable). s3api get-object
          # (not `s3 cp`) so the error class is inspectable.
          set +e
          READ_ERR=$(aws s3api get-object --bucket "$CONVERGENCE_BUCKET" --key "$CONVERGENCE_KEY" /tmp/convergence-record.json 2>&1 1>/dev/null)
          READ_RC=$?
          set -e
          if [ "$READ_RC" -ne 0 ]; then
            if printf '%s' "$READ_ERR" | grep -qiE 'NoSuchKey|Not Found|404'; then
              echo "No convergence record (pass-on-absent): first apply allowed."
              echo "refused=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "refused=true" >> "$GITHUB_OUTPUT"
            echo "::error::CONVERGENCE_READ_ERROR could not read the convergence record; failing CLOSED (NOT pass-on-absent) and NOT overwriting it. Re-run once S3 is reachable. Details: ${READ_ERR}"
            exit 1
          fi
          REC_JSON=$(cat /tmp/convergence-record.json)
          # rec-2209: guard against a non-empty but malformed record (explicit refusal, not an unguarded
          # set -e abort). On parse failure emit a distinguishable marker, write refused=true, and exit 1
          # WITHOUT overwriting the record -- ci-rca can then dedupe it like a CONVERGENCE_RED refusal.
          # Both fields extracted in a single python3 call: a second json.load on the same bytes cannot
          # fail independently, so two separate guards was dead code and a misleading second error marker.
          if ! PARSE_OUT=$(printf '%s' "$REC_JSON" | python3 -c "import json,sys; r=json.load(sys.stdin); print(r.get('status','')); print(r.get('commit_sha',''))" 2>/dev/null); then
            echo "refused=true" >> "$GITHUB_OUTPUT"
            echo "::error::CONVERGENCE_PARSE_ERROR convergence record exists but could not be parsed as JSON; failing CLOSED and NOT overwriting it. Inspect s3://${CONVERGENCE_BUCKET}/${CONVERGENCE_KEY} and re-file if corrupt."
            exit 1
          fi
          STATUS=$(printf '%s' "$PARSE_OUT" | sed -n '1p')
          RED_COMMIT=$(printf '%s' "$PARSE_OUT" | sed -n '2p')
          echo "Convergence record: status=${STATUS} commit=${RED_COMMIT}"
          if [ "$STATUS" != "red" ]; then
            echo "Main is converged (status=${STATUS}); proceeding."
            echo "refused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # status == red. The ONLY clear path is a workflow_dispatch acknowledge-and-retry whose
          # input names the red record's commit SHA or an open rec id (rec-NNNN). The dispatch actor
          # + input are the audit trail (Decision 55/72); the agent may dispatch after rec review.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$ACK" ] && { [ "$ACK" = "$RED_COMMIT" ] || printf '%s' "$ACK" | grep -qiE '^rec-[0-9]+$'; }; then
            echo "::notice::CONVERGENCE_ACK acknowledge-and-retry for red commit ${RED_COMMIT} (input=${ACK}); proceeding to clear red on a successful apply."
            echo "refused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "refused=true" >> "$GITHUB_OUTPUT"
          echo "::error::$(REC_JSON="$REC_JSON" python3 -m scripts.ci.convergence_classify --refusal | sed -n '3p')"
          exit 1

      - name: Materialise tfvars from Secrets Manager
        # Fetch the agent-platform-terraform-personal-tfvars secret (apply role SecretsManagerReadOnly
        # grant) and write it to the gitignored terraform.personal.tfvars. Fail-closed: if the fetch
        # fails the step exits non-zero and blocks all downstream steps (no continue-on-error).
        # id: tfvars is in the CLOSED pre-apply-failure allow-list (Decision 154 / rec-2862).
        id: tfvars
        if: success()
        uses: ./.github/actions/materialise-tfvars

      - name: Terraform init (S3 backend, sandbox)
        # id: tf_init is in the CLOSED pre-apply-failure allow-list (Decision 154 / rec-2862).
        id: tf_init
        if: success()
        uses: ./.github/actions/terraform-init-retry
        with:
          working-directory: ${{ env.WORKDIR }}

      - name: Resolve DuckLake artifact sha (content-addressed key, T2.42 c3)
        # PR-head-sha on push (same sha tfplan/personal/<pr>/<sha>.bin is keyed by; resolved the
        # same way as the "Fetch saved plan from S3" step below) and the dispatch commit sha on
        # workflow_dispatch (no originating PR to resolve).
        id: artifact_sha
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VALUE=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].head.sha' 2>/dev/null || echo "")
            if [ -z "$VALUE" ] || [ "$VALUE" = "null" ]; then
              echo "::error::No originating PR resolved for ${SHA}; cannot resolve the content-addressed artifact sha (Decision 77 no-TOCTOU)." >&2
              exit 1
            fi
          else
            VALUE="${SHA}"
          fi
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"

      - name: Build DuckLake lambda packages (rebuild before plan/apply, rec-2512)
        id: build_ducklake
        # rec-2512: lambda-packages/ is gitignored and Terraform reads no local zip (the configuration
        # addresses code by s3_key). Rebuild the seven DuckLake artifacts here, before plan/apply, using the
        # profile-less env-credential path (this GitHub-hosted OIDC runner has no named AWS
        # profile). On push (apply-the-saved-plan path, Decision 77 no-TOCTOU): the plan.bin about
        # to be applied was reviewed against the PR job's uploaded S3 objects, so assert the
        # freshly rebuilt zips are byte-identical to those objects BEFORE re-uploading -- a
        # mismatch means the applied layer content would skew from the reviewed plan and must fail
        # closed rather than silently apply divergent bytes. workflow_dispatch (fresh plan) skips
        # the assert since there is no prior trusted-plan artifact to compare against.
        #
        # rec-4372 (Decision 154 Update): that reference can go stale -- its window runs from the
        # PR's last speculative plan to this merge, with no upper bound, and main can edit a
        # packaged file in between. When every differing artifact's bytes trace to a tracked input
        # that moved on main (scripts/ci/ducklake_artifacts.py assert_and_upload, keyed on
        # GITHUB_SHA as the merge sha), this step applies the reviewed plan.bin unchanged on the
        # merge-tree zips, uploaded to the fixed key and lambda-packages/<merge sha>/, and writes a
        # superseded-by.json pointer beside the untouched PR-head zips. A pre-existing pointer at
        # this sha refuses an identical-bytes re-upload (only the moved branch may create one).
        #
        # T2.42 c3 (DEP-03): the byte-assert reads the per-artifact-sha key
        # (lambda-packages/<sha>/<name>, overwrite-immune per PR-head-sha) instead of the fixed
        # key -- a later, concurrent PR's push can no longer skew this PR's reviewed artifact bytes
        # out from under the assert. The upload dual-writes BOTH the fixed key (keeps terraform's
        # static s3_key genuine-republish read fed) AND the per-sha key.
        if: success()
        uses: ./.github/actions/build-ducklake-artifacts
        with:
          mode: ${{ github.event_name == 'push' && 'assert' || 'skip-assert' }}
          artifact-sha: ${{ steps.artifact_sha.outputs.value }}

      - name: Fetch saved plan from S3 (push -- apply-the-saved-plan path, T2.21)
        id: fetch_plan
        # CD.35 Wave 2: on push to main, apply the SAME plan.bin reviewed on the PR (no re-plan).
        # Resolves the originating PR (number + head sha) from the merge commit, fetches the
        # content-addressed tfplan/personal/<pr>/<sha>.bin object (DEP-07 c3), verifies its sha256
        # digest against the terraform-plan-digest commit status (DEP-07 c2, fail-closed on
        # mismatch/missing), and runs terraform show -json to produce plan.json for the guard.
        # Fail closed if no PR is found or no saved plan object exists -- recovery is the
        # workflow_dispatch acknowledge-and-retry (dispatch re-plans fresh; push NEVER re-plans
        # autonomously).
        if: success() && github.event_name == 'push'
        uses: ./.github/actions/fetch-saved-plan
        with:
          resolve-from-sha: ${{ github.sha }}
          produce-plan-json: 'true'
          working-directory: ${{ env.WORKDIR }}

      - name: Terraform plan (workflow_dispatch -- fresh plan)
        id: plan
        if: success() && github.event_name == 'workflow_dispatch'
        working-directory: ${{ env.WORKDIR }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/neon_api_key.sh" run -- terraform plan -input=false -lock-timeout=120s -var-file=terraform.personal.tfvars -out=plan.bin
          terraform show -json plan.bin > plan.json

      - name: Deterministic apply guard (fail-closed)
        id: guard
        # Three-way exit code branch (CD.35 Wave 3 / T2.22 + T2.25 guard narrowing):
        #   exit 0 -- guard PASS; non-IAM or in-budget IAM (inline-policy/attachment UPDATE on
        #             managed boundary-carrying role, T2.25 / Decision 92 point 5); apply proceeds
        #   exit 2 -- guard BLOCKED (out-of-budget IAM / trust diff / destroy); sets routed=true
        #             output and exits 0 (routing is not a failure -- the gated-apply job takes
        #             over); record_write and apply SKIP when routed (anti-masking, Decision 55)
        #   exit 1 -- internal guard error; apply blocked, record_write writes red (fail-closed,
        #             Decision 77 / Decision 55 anti-masking)
        if: success()
        uses: ./.github/actions/deterministic-guard
        with:
          working-directory: ${{ env.WORKDIR }}

      - name: Subagent plan review (digest-fed, JSON-classified)
        # Second gate: only runs if the guard passed (not routed). rec-2658 forward-fix (T2.39):
        # the reviewer used to be handed only the plan.json FILENAME with nothing on stdin, so it
        # burned its entire turn budget reading the raw terraform show -json dump before reaching
        # a verdict (--output-format text also discarded the turn trace -- zero diagnosability).
        # Fix: feed a bounded, names-only scripts/ci/terraform_plan_digest.py digest on stdin (no
        # Terraform values reach the reviewer), run the reviewer with no tools from an empty
        # directory, classify the verdict from --output-format json via
        # scripts/ci/review_verdict.py (not a grep over combined stdout/stderr), and keep a small
        # FIXED turn budget. A STARVED verdict (max-turns / no-verdict / API-exhausted) retries the
        # reviewer exactly ONCE at the SAME budget (never a larger one, T2.39 c2); a still-STARVED
        # outcome after the retry blocks apply and is surfaced via steps.review.outputs.outcome so
        # the record-write step below can skip the red write (Decision 55 anti-masking --
        # starvation is a reviewer-infra failure, not a plan rejection). An explicit REVISE always
        # fails closed and reds the record, exactly as before.
        id: review
        if: success() && steps.guard.outputs.routed != 'true'
        uses: ./.github/actions/subagent-plan-review
        with:
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          working-directory: ${{ env.WORKDIR }}

      - name: Terraform apply (same plan file the guard inspected)
        id: apply
        # Gated on success() of all prior steps (precondition + guard + subagent review). Applies
        # plan.bin -- the exact artefact the guard parsed via plan.json -- with no intervening
        # re-plan (no TOCTOU). Skipped when routed=true: the gated-apply job handles the apply
        # after human approval via the tf-gated-apply Environment (Decision 92).
        #
        # Wrapped via scripts/ci/stale_plan_signature.py's --wrap mode (Decision 59 scope
        # discipline -- no new delegate script; the wrapped command stays literal, real argv in
        # this run: text, satisfying structural guards that inspect it, e.g.
        # validate_dispatch_gated_apply_topology.py's invariant (ii)): the wrapper runs terraform
        # apply as a subprocess, re-emits its stderr, preserves its exit code as this step's own
        # (steps.apply.outcome is unchanged for every other reader -- write-convergence-record,
        # the pre-apply-failure predicate, best-effort PR wake), and on a DEP-10 stale-plan stderr
        # match emits a distinguishable PLAN_STALE_CONCURRENT_WRITER ::error:: marker (diagnostic
        # only; this is a Decision 55/154 anti-masking guard -- it must never be folded into
        # Decision 154's pre-apply-failure allow-list below) so ci-rca gets a stable signature
        # instead of a generic failure_category=unknown. FAILS CLOSED exactly as before this
        # wrapper existed -- no same-run fresh-replan fallthrough is added (Decision 77 no-TOCTOU
        # is preserved by design at this push-path site).
        if: success() && steps.guard.outputs.routed != 'true'
        working-directory: ${{ env.WORKDIR }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/neon_api_key.sh" run -- python3 "$GITHUB_WORKSPACE/scripts/ci/stale_plan_signature.py" --wrap -- terraform apply -input=false -lock-timeout=120s plan.bin

      - name: Emit fresh plan.bin sha256 (SANDBOX_FRESH_PLAN_ARTIFACT sha256 job-output EMIT)
        # Decision 183, mirrors reconcile.yml's RECONCILE_FRESH_PLAN_ARTIFACT EMIT verbatim: the
        # byte-integrity gate that crosses the job boundary to gated-apply must be independently
        # checkable, not merely "an artifact exists" -- this job output is verified again on
        # download in gated-apply (VERIFY, symmetric with this EMIT).
        id: upload_fresh_plan_sha256
        if: success() && github.event_name == 'workflow_dispatch' && steps.guard.outputs.routed == 'true'
        run: echo "sha256=$(sha256sum ${{ env.WORKDIR }}/plan.bin | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload fresh plan.bin as a run-scoped artifact (SANDBOX_FRESH_PLAN_ARTIFACT)
        # Decision 183: guard-ROUTE on a workflow_dispatch acknowledge-and-retry (out-of-budget
        # IAM/trust/destroy) -- hand the fresh plan.bin to gated-apply below via a GitHub-native
        # run-scoped artifact (workflow token only -- no new IAM, no S3 write) so the episode
        # completes in THIS SAME dispatch after one Environment approval, instead of stranding
        # (the dispatch-vs-push deadlock rec-3522/rec-3135/rec-2918 identified). retention-days 2
        # is the ephemeral_handoff class maximum (docs/contracts/github-actions-evidence.yaml),
        # giving the human approval two days before the hand-off expires.
        if: success() && github.event_name == 'workflow_dispatch' && steps.guard.outputs.routed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sandbox-fresh-plan-${{ github.run_id }}
          path: ${{ env.WORKDIR }}/plan.bin
          retention-days: 2

      - name: Write convergence record (always-run, red-on-failure)
        id: record_write
        # CD.35 5.5 integrity anchor: apply-identity-only write, ALWAYS-run so a failed apply writes
        # red (never leaves a stale green that would defeat the precondition). The step itself is
        # `if: always()`; it SKIPS the S3 write when the precondition refused, the guard routed, OR
        # the subagent reviewer was STARVED (T2.39 / rec-2658 -- see below), so none of those cases
        # overwrite/corrupt the record. green iff apply succeeded; red on any genuine non-success
        # (plan/guard internal error/an explicit REVISE/apply failure). Guard BLOCK (exit 2 ->
        # routed=true) is NOT a failure -- the record is not latched red on this path; the
        # gated-apply job writes the record after the human-approved apply (Decision 55 anti-masking).
        # Decision 154 / rec-2862: pre-apply-failure is the CLOSED-allow-list conjunction, computed
        # INLINE (never via an aggregator) -- (a) the SOLE apply step reports 'skipped' (safety-
        # critical: if it ran, infrastructure may have been mutated and the record must latch red)
        # AND (b) one of {artifact_sha, tfvars, tf_init, build_ducklake, fetch_plan} reports
        # 'failure'. `plan` and `guard`/`review` are deliberately EXCLUDED -- they must keep
        # latching red (a plan failure, a fail-closed guard verdict, or an explicit reviewer
        # REVISE are not infra errors).
        if: always()
        uses: ./.github/actions/write-convergence-record
        with:
          sha: ${{ github.sha }}
          apply-outcome: ${{ steps.apply.outcome }}
          refused: ${{ steps.precond.outputs.refused }}
          routed: ${{ steps.guard.outputs.routed }}
          review-outcome: ${{ steps.review.outputs.outcome }}
          review-step-outcome: ${{ steps.review.outcome }}
          pre-apply-failure: >-
            ${{ steps.apply.outcome == 'skipped' && (steps.artifact_sha.outcome == 'failure' || steps.tfvars.outcome == 'failure' || steps.tf_init.outcome == 'failure' || steps.build_ducklake.outcome == 'failure' || steps.fetch_plan.outcome == 'failure') }}
          failed-step: >-
            ${{ steps.artifact_sha.outcome == 'failure' && 'artifact_sha' || (steps.tfvars.outcome == 'failure' && 'tfvars' || (steps.tf_init.outcome == 'failure' && 'tf_init' || (steps.build_ducklake.outcome == 'failure' && 'build_ducklake' || (steps.fetch_plan.outcome == 'failure' && 'fetch_plan' || '')))) }}

      - name: Best-effort post-merge SHA->PR wake
        # CD.35 5.3 / Decision 76 (poll-free): the push event's workflow_run.pull_requests[] is
        # empty, so resolve the originating PR from the merge commit SHA and comment to re-engage a
        # held subscription. Decision 183: on a routed workflow_dispatch, resolve from the
        # ACKNOWLEDGED RED COMMIT instead -- that is the PR humans are actually watching for this
        # incident, not whatever merge happens to sit at github.sha when the dispatch runs.
        # BEST-EFFORT ONLY (continue-on-error) -- the authoritative baseline is the
        # next-planning-session record re-check; nothing depends on this wake. Skipped on refusal
        # (no apply ran) and on an un-routed dispatch (no PR to notify).
        if: ${{ always() && steps.precond.outputs.refused != 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && steps.guard.outputs.routed == 'true')) }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event_name == 'push' && github.sha || github.event.inputs.acknowledge_red_commit }}
          ROUTED: ${{ steps.guard.outputs.routed }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          PR_NUM=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "No originating PR resolved for ${SHA}; next-planning-session baseline applies."
            exit 0
          fi
          if [ "$ROUTED" = "true" ]; then
            # Guard exit 2 (out-of-budget IAM / trust / destroy) -> routed to gated-apply job.
            # The convergence record is NOT touched; the gated-apply job pending reviewer approval
            # handles the apply. Distinct message so the held subscription knows a human action is
            # required (T2.22). ${{ github.sha }} (not $SHA, which is the ack'd red commit on a
            # routed dispatch) is the commit whose fresh plan is pending and this run's
            # apply-sandbox plan + guard step logs are what to review before approving.
            MSG="sandbox terraform-apply guard routed ${{ github.sha }} to the tf-gated-apply job (out-of-budget IAM / trust / destroy diff); pending reviewer approval -- review this run's apply-sandbox plan + guard step logs, then approve at: Actions -> gated-apply job. The convergence record is unchanged until the gated apply completes (commit_sha becomes ${{ github.sha }} on success). (Best-effort wake.)"
          elif [ "$APPLY_OUTCOME" = "success" ]; then
            MSG="sandbox terraform-apply converged GREEN for ${SHA}; convergence record updated. (Best-effort wake; next planning session re-checks the record.)"
          else
            MSG="sandbox terraform-apply did NOT converge (RED) for ${SHA}; ci-rca will file a source=ci_rca rec. After review, unlatch via the workflow_dispatch acknowledge-and-retry path. (Best-effort wake.)"
          fi
          gh pr comment "$PR_NUM" --repo "$REPO" --body "$MSG" || true

      - name: Self-dispatch ci-rca on re-run failure (workflow_run re-run gap)
        # PLAN-gated-apply-rca-trigger: ci-rca.yml triggers SOLELY on the workflow_run:
        # [terraform-apply-sandbox] completed event, but GitHub does not reliably re-dispatch
        # workflow_run-triggered workflows on a manual RE-RUN's completion (run_attempt >= 2) --
        # the exact class of gap that left run 28379330706 (gated-apply, run_attempt=2) with zero
        # RCA signal. Gated on run_attempt != '1' so the fresh-push attempt-1 path (already covered
        # by workflow_run) never double-fires; force_rca is omitted so any residual overlap
        # collapses via ci-rca's existing per-category commit-status dedup (Decision 74).
        # failure()-only, runs after the record write -- never touches the plan/apply data path
        # (Decision 77 no-TOCTOU preserved).
        if: ${{ failure() && github.run_attempt != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-rca.yml -f run_id=${{ github.run_id }}

  # ---------------------------------------------------------------------------
  # DuckLake artifacts job: pull_request ONLY, same-repo gated (Decision 238 cutover, rec-4637).
  # The PR-time terraform plan moved to terraform-plan-trusted.yml (main's pull_request_target
  # workflow under agent-platform-github-ci-trusted-plan). This job only builds the PR's DuckLake
  # artifacts under the planner role's PR-sub statement and uploads them to the fixed per-sha keys
  # (lambda-packages/<PR head sha>/..., plus inputs.json, rec-4372) that the trusted plan's
  # configuration addresses and that the merge-time apply and gated-apply re-verify or fetch
  # (Decision 154 cl.1, rec-2512). It writes no plan.bin, posts no status or comment and runs no
  # terraform. Fork PRs are excluded by the job-level if: (fork OIDC cannot assume the planner
  # role's non-reserved-session PR-sub statement). Advisory (Decision 83 / CD.20): never add it to
  # required_status_checks.
  # ---------------------------------------------------------------------------
  ducklake-artifacts:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write       # OIDC for the planner role (PR-sub, non-reserved session)
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/aws-region

      - name: Configure AWS credentials (OIDC -- planner role, PR-sub, non-reserved session)
        # role-session-name is set EXPLICITLY to a NON-reserved value -- it must NOT equal
        # local.convergence_writer_session_name (terraform/personal/oidc.tf), which the planner's
        # pr-sub trust statement StringNotEquals-enforces. Best-effort: before the gated apply creates
        # the planner role (bootstrap window), the assume-role fails. continue-on-error keeps the job
        # from failing; the build step below is skipped when creds are absent, so the job ends
        # green-with-skipped rather than hard-failing during the bootstrap window.
        id: oidc_plan
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-planner
          role-session-name: terraform-plan-pr
          aws-region: ${{ env.AWS_REGION }}

      - name: Surface a failed assume (no DuckLake artifacts will be uploaded)
        # Decision 172 PR-2: a failed assume must stay visible. A warning annotation, not exit 1: this
        # job is advisory and must not wedge a PR.
        if: steps.oidc_plan.outcome != 'success'
        run: |
          echo "::warning::OIDC_ASSUME_FAILED could not assume agent-platform-github-ci-planner (PR-sub). The DuckLake artifact build is SKIPPED, so no per-sha artifacts are uploaded for this PR head sha."

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build DuckLake lambda packages (build + upload before the merge-time apply, rec-2512)
        id: build_ducklake
        # LAMBDA_ARTIFACT_SHA pins upload_to_s3's per-sha dual-write to the PR head sha, the same sha the
        # trusted plan job keys tfplan/personal/<pr>/<sha>.bin by (T2.42 c3 / DEP-03). rec-4372:
        # upload-only also records each artifact's tracked git-blob inputs as
        # lambda-packages/<PR head sha>/inputs.json.
        if: success() && steps.oidc_plan.outcome == 'success'
        uses: ./.github/actions/build-ducklake-artifacts
        with:
          mode: upload-only
          artifact-sha: ${{ github.event.pull_request.head.sha }}

  # ---------------------------------------------------------------------------
  # Advisory status job: pull_request ONLY, read-only (CD.35 5.5).
  # Reads the convergence record under the read-only PR role and posts the ADVISORY
  # terraform-converged commit status. NOT a required check (Decision 83) -- a required status would
  # wedge the autonomous fix-merge once a record is red, or be admin-bypassed anyway. Same-repo only
  # (fork PRs cannot mint the OIDC token / write statuses; mirrors ci-rca.yml's fork gate).
  # ---------------------------------------------------------------------------
  advisory-status:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write     # OIDC for the read-only PR role
      contents: read
      statuses: write     # post the advisory terraform-converged commit status
    steps:
      # Required for `python3 -m scripts.ci.convergence_advisory` below to resolve: this job
      # previously had no checkout (it was two steps -- assume + inline body). scripts/ci/ has no
      # __init__.py; the -m form works via PEP 420 from the repo root, but ONLY after checkout.
      - uses: actions/checkout@v7

      - uses: ./.github/actions/aws-region

      - name: Configure AWS credentials (OIDC -- PR read-only role)
        # Best-effort: this advisory job must NEVER red a PR. Before the oidc.tf trust+read grant is
        # applied (the bootstrap window), or on any transient OIDC hiccup, the assume-role fails --
        # continue-on-error lets the job carry on. Decision 172 PR-2: it no longer carries on to a
        # pass-on-absent GREEN. The step now declares an id, and the body below classifies a failed
        # assume as error/UNVERIFIED -- "could not read the record" is not evidence of convergence.
        id: oidc_advisory
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-pr
          aws-region: ${{ env.AWS_REGION }}

      - name: Read convergence record and post advisory terraform-converged status
        # Thin adapter (Decision 162): all six-way classification lives in
        # scripts/ci/convergence_advisory.py, which never raises -- that, NOT a continue-on-error
        # on this step, is what keeps the job green (adding continue-on-error here would pull this
        # body into validate_masked_errexit_steps' population for no benefit).
        # DO NOT rename this step or give it an id: its r3_workflows baseline key is the
        # hyphen-slug of this name, so either change mints an unregistered key and orphans the old.
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set +e
          REC_JSON=""
          if [ "${{ steps.oidc_advisory.outcome }}" != "success" ]; then
            RC=1
            S3_STDERR="assume-role failed -- OIDC credentials unavailable"
          else
            aws s3api get-object --bucket "$CONVERGENCE_BUCKET" --key "$CONVERGENCE_KEY" /tmp/rec.json >/dev/null 2>/tmp/s3err
            RC=$?
            S3_STDERR=$(cat /tmp/s3err)
            [ "$RC" -eq 0 ] && REC_JSON=$(cat /tmp/rec.json)
          fi
          OUT=$(RC="$RC" S3_STDERR="$S3_STDERR" REC_JSON="$REC_JSON" python3 -m scripts.ci.convergence_advisory)
          gh api "repos/${REPO}/statuses/${HEAD_SHA}" --method POST \
            --field state="$(printf '%s' "$OUT" | sed -n '1p')" \
            --field context="terraform-converged" \
            --field description="$(printf '%s' "$OUT" | sed -n '2p')" \
            --field target_url="${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"

  # ---------------------------------------------------------------------------
  # Gated-apply job: reachable on EITHER heal verb, when guard exits 2 (CD.35 Wave 3 / T2.22;
  # Decision 183 widens the reach from post-merge push ONLY to also admit a guard-ROUTED
  # workflow_dispatch acknowledge-and-retry).
  #
  # Triggered when apply-sandbox sets routed=true (guard exit 2: IAM/trust/destroy diff), on
  # EITHER a push or a workflow_dispatch acknowledge-and-retry. Declares environment:
  # tf-gated-apply so the job does NOT start until a required reviewer approves in GitHub Actions
  # -- the Environment is the sole authorization boundary on both routes (Decision 92, Decision 183).
  #
  # Key invariants:
  #   - No re-plan: applies the SAME plan.bin the guard inspected (Decision 77 no-TOCTOU) -- the
  #     digest-verified saved plan.bin on push, the sha256-verified SANDBOX_FRESH_PLAN_ARTIFACT on
  #     a routed dispatch (the two sources are mutually exclusive per run). A stale or corrupted
  #     plan fails closed -> red convergence record -> ci-rca rec; recovery is the workflow_dispatch
  #     acknowledge-and-retry path only.
  #   - Always-run red-on-failure record write: a failed gated apply writes red (ci-rca files
  #     a rec). Decision 55 / 72 anti-masking: nothing auto-remediates.
  #   - NOT a PR required check (Decision 83 / T2.22): the gated-apply job is an out-of-band
  #     apply path, not a merge gate. Adding it to required_status_checks would wedge the
  #     autonomous fix-merge or be admin-bypassed.
  #   - Trust unchanged: assumes agent-platform-github-ci-apply (refs/heads/main ONLY). The
  #     Environment, not an OIDC environment claim in the sub, is the gate (oidc.tf comment).
  #   - Serialised by the shared concurrency group (cancel-in-progress: false): a pending
  #     gated-apply approval holds the group, so later auto-applies queue behind it. This is
  #     correct (serialisation prevents plan.bin from going stale; applies must serialise on
  #     shared tfstate). If an approval is abandoned, reject it in the GitHub Actions UI to
  #     release the queue.
  #   - Approval-window expiry: when the Environment approval window expires (GitHub default
  #     30 days -- adequate for this workflow's cadence) the waiting job transitions to failure,
  #     the workflow concludes failure, and the concurrency group releases normally. The
  #     "waiting" state during the review window is NOT a failure.
  #   - PLAN-gated-apply-rca-trigger: the workflow_run:[terraform-apply-sandbox] trigger that
  #     ci-rca.yml relies on is NOT reliably re-dispatched on a manual RE-RUN's completion
  #     (run_attempt >= 2) -- the normal way this job executes after Environment approval, and
  #     also how an approval-window expiry concludes. The workflow_run trigger stays in place
  #     for the fresh-push attempt-1 path; the job's own failure-path self-dispatch step
  #     (below) is the reliable path for the re-run / expiry path (Decision 92 point 6).
  # ---------------------------------------------------------------------------
  gated-apply:
    needs: [apply-sandbox]
    if: >-
      always() &&
      needs.apply-sandbox.result == 'success' &&
      needs.apply-sandbox.outputs.routed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: tf-gated-apply
    permissions:
      id-token: write       # OIDC for the apply role (same as apply-sandbox)
      contents: read
      pull-requests: write  # best-effort post-merge wake comment
      actions: write        # self-dispatch ci-rca on a re-run failure (workflow_run re-run gap)
    env:
      TF_VAR_aws_profile: ""
      WORKDIR: terraform/personal

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/aws-region

      - name: Configure AWS credentials (OIDC -- apply role, main only)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/agent-platform-github-ci-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Read pinned Terraform version
        id: tfver
        run: echo "version=$(cat config/terraform-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Terraform init (S3 backend, sandbox)
        # id: tf_init is in the CLOSED pre-apply-failure allow-list (Decision 154 / rec-2862).
        id: tf_init
        uses: ./.github/actions/terraform-init-retry
        with:
          working-directory: ${{ env.WORKDIR }}

      - name: Resolve DuckLake artifact sha (content-addressed key, T2.42 c3)
        # Decision 183: this job is reachable on EITHER heal verb now, so it can no longer
        # re-resolve the originating PR itself (a workflow_dispatch commit has none). Echo the
        # SAME value apply-sandbox already resolved (PR head sha on push, github.sha on dispatch,
        # which apply-sandbox's skip-assert build dual-wrote to lambda-packages/<sha>/* in the
        # same run) -- the identical content-addressed sha the plan.bin (saved or fresh) was built
        # against, so mode: fetch below resolves on every route.
        id: artifact_sha
        if: success()
        run: echo "value=${{ needs.apply-sandbox.outputs.artifact_sha }}" >> "$GITHUB_OUTPUT"

      - name: Fetch reviewed DuckLake lambda packages (no rebuild, Decision 154 / rec-2862)
        id: build_ducklake
        # This job sits behind an UNBOUNDED human-approval wait (tf-gated-apply Environment). A
        # rebuild after that wait can resolve a dependency to a version published DURING the
        # wait, producing bytes nobody reviewed -- the exact rec-2862 hit (pytz 2026.3.post1
        # published between the PR's byte-identical assert and the human's approval). Fetch the
        # already-reviewed per-sha artifacts instead and server-side copy them onto the fixed key
        # (scripts/ci/ducklake_artifacts.py fetch_reviewed(), fail-closed on any missing per-sha
        # object -- Decision 77 no-TOCTOU is preserved by the ORIGINAL PR-time assert plus this
        # fetch's own fail-closed missing-object check, not by a repeated rebuild-assert here).
        #
        # rec-4372: fetch first reads lambda-packages/<artifact-sha>/superseded-by.json. Absent,
        # the usual route, fetches from artifact-sha's own prefix as above. Present, it follows the
        # pointer one hop to the merge sha the push run rebuilt from when the PR-time zips predated
        # an input that moved on main -- identity there rests on that push run's input attribution,
        # not on a byte match against the PR-time assert.
        if: success()
        uses: ./.github/actions/build-ducklake-artifacts
        with:
          mode: fetch
          artifact-sha: ${{ steps.artifact_sha.outputs.value }}

      - name: Download fresh plan.bin artifact (SANDBOX_FRESH_PLAN_ARTIFACT handoff)
        # Decision 183: the guard-ROUTEd workflow_dispatch's fresh re-plan was uploaded by
        # apply-sandbox above -- download the SAME plan.bin it uploaded rather than fetching a
        # saved plan from S3 (there is none on this route). GitHub-native artifact transport only
        # (workflow token) -- no new IAM/S3.
        if: needs.apply-sandbox.outputs.fresh_plan_pending == 'true'
        uses: actions/download-artifact@v8
        with:
          name: sandbox-fresh-plan-${{ github.run_id }}
          path: ${{ env.WORKDIR }}

      - name: Verify downloaded fresh plan.bin sha256 (SANDBOX_FRESH_PLAN_ARTIFACT sha256 download-side VERIFY)
        # Decision 183, symmetric with apply-sandbox's EMIT: re-derive the artifact's sha256 here
        # and compare against the job output it emitted, so byte-integrity across the job boundary
        # is independently checkable, not merely "an artifact was downloaded".
        id: verify_fresh_plan_sha256
        if: needs.apply-sandbox.outputs.fresh_plan_pending == 'true'
        working-directory: ${{ env.WORKDIR }}
        env:
          FRESH_PLAN_SHA256: ${{ needs.apply-sandbox.outputs.fresh_plan_sha256 }}
        run: |
          set -euo pipefail
          ACTUAL=$(sha256sum plan.bin | cut -d' ' -f1)
          if [ "$ACTUAL" != "$FRESH_PLAN_SHA256" ]; then
            echo "::error::SANDBOX_FRESH_PLAN_ARTIFACT sha256 mismatch: expected ${FRESH_PLAN_SHA256}, got ${ACTUAL}. Refusing to apply a possibly-corrupted plan." >&2
            exit 1
          fi
          echo "SANDBOX_FRESH_PLAN_ARTIFACT sha256 verified: ${ACTUAL}"

      - name: Fetch saved plan from S3 (gated-apply path, T2.22)
        # Resolve the PR (number + head sha) from the merge commit and fetch the content-addressed
        # plan.bin from S3 (DEP-07 c3), digest-verified (DEP-07 c2). Same logic as apply-sandbox's
        # "Fetch saved plan" step. No re-plan -- applies the guard-inspected plan verbatim (Decision
        # 77 no-TOCTOU). No plan.json needed here (no re-guard in this job). Decision 183: skipped
        # when the SANDBOX_FRESH_PLAN_ARTIFACT above already supplied plan.bin -- the two plan
        # sources stay mutually exclusive, and this push-only path never runs on a dispatch.
        # id: fetch_plan is in the CLOSED pre-apply-failure allow-list (Decision 154 / rec-2862).
        id: fetch_plan
        if: needs.apply-sandbox.outputs.fresh_plan_pending != 'true' && github.event_name == 'push'
        uses: ./.github/actions/fetch-saved-plan
        with:
          resolve-from-sha: ${{ github.sha }}
          produce-plan-json: 'false'
          working-directory: ${{ env.WORKDIR }}

      - name: Terraform apply (gated -- plan.bin verbatim, no re-plan)
        id: apply
        # Applies the exact plan.bin the guard inspected -- on push, the same plan.bin the
        # trusted plan job showed on the originating PR; on a routed workflow_dispatch, the
        # SANDBOX_FRESH_PLAN_ARTIFACT this run's apply-sandbox job planned, guard-routed, and
        # uploaded (Decision 183). Human approval via tf-gated-apply Environment is the
        # authorization on EITHER route. No re-plan after approval (Decision 77 no-TOCTOU). A
        # stale or corrupted plan fails closed -> record write below sets red -> ci-rca rec files.
        # Recovery: workflow_dispatch acknowledge-and-retry path only.
        #
        # Wrapped via scripts/ci/stale_plan_signature.py's --wrap mode (Decision 59 scope
        # discipline -- no new delegate script; the wrapped command stays literal, real argv in
        # this run: text, satisfying structural guards that inspect it, e.g.
        # validate_dispatch_gated_apply_topology.py's invariant (ii)): the wrapper runs terraform
        # apply as a subprocess, re-emits its stderr, preserves its exit code as this step's own
        # (steps.apply.outcome is unchanged for every other reader), and on a DEP-10 stale-plan
        # stderr match emits a distinguishable PLAN_STALE_CONCURRENT_WRITER ::error:: marker
        # (diagnostic only; this is a Decision 55/154 anti-masking guard -- it must never be
        # folded into Decision 154's pre-apply-failure allow-list below) so ci-rca gets a stable
        # signature instead of a generic failure_category=unknown. FAILS CLOSED exactly as before
        # this wrapper existed -- no same-run fresh-replan fallthrough is added. A silent
        # post-approval re-plan-and-apply at this human-gated site would violate Decision 92's
        # Environment-gates-execution security model (approval was granted for specific reviewed
        # content); recovery stays the workflow_dispatch acknowledge-and-retry path only.
        if: success()
        working-directory: ${{ env.WORKDIR }}
        run: bash "$GITHUB_WORKSPACE/scripts/ci/neon_api_key.sh" run -- python3 "$GITHUB_WORKSPACE/scripts/ci/stale_plan_signature.py" --wrap -- terraform apply -input=false -lock-timeout=120s plan.bin

      - name: Write convergence record (always-run, red-on-failure)
        id: record_write
        # Reuses the T2.20 always-run red-on-failure record write. apply-identity-only write.
        # A failed gated apply writes red -> ci-rca files a source=ci_rca rec (Decision 55/72).
        # Recovery: dispatch-ack path (naming the red commit or rec-id) after rec review -- nothing
        # auto-remediates. plan_sha: sha256 of the applied plan.bin (same convention as apply-sandbox
        # push path; proves the saved plan -- not a re-plan -- was applied).
        #
        # No convergence-record precondition check here (unlike apply-sandbox's hard-block at Step 1):
        # the shared concurrency group (cancel-in-progress: false) serializes ALL applies on the
        # same tfstate, so the record cannot go red via the CD path while this job holds the group.
        # A workflow_dispatch ack run also queues behind this job (same group). This is an implicit
        # serialization invariant, not an explicit read-then-refuse gate -- accepted design tradeoff
        # for the gated path where the concurrency group provides the safety guarantee.
        #
        # Red-write dependency (VP10, 2026-06-22): this step writes the red record using the SAME
        # OIDC apply-role creds configured in the "Configure AWS credentials" step. If the failure
        # occurs AT OR BEFORE that creds step (e.g. the OIDC trust regresses, as VP9 first found),
        # this step cannot reach S3 ("Unable to locate credentials") and the record stays at its
        # prior value rather than going red. Failures AT the apply stage (creds already configured)
        # DO red the record here as intended.
        #
        # PLAN-gated-apply-rca-trigger (repairs the VP10 backstop clause above): the pre-creds
        # backstop is NOT solely the workflow_run trigger -- confirmed run 28379330706 (run_attempt
        # 2, a normal post-approval re-run) failed and produced zero ci-rca signal because GitHub
        # does not reliably re-dispatch workflow_run-triggered workflows on a re-run's completion.
        # The job's own failure-path self-dispatch step (below, gated on run_attempt != '1') is the
        # reliable backstop for the re-run path; workflow_run remains the attempt-1 path.
        #
        # Decision 154 / rec-2862: pre-apply-failure is the CLOSED-allow-list conjunction, computed
        # INLINE -- (a) the SOLE apply step reports 'skipped' AND (b) one of {artifact_sha, tf_init,
        # build_ducklake, fetch_plan} reports 'failure' (no tfvars step in this job -- the applied
        # plan.bin is self-contained and needs no -var-file).
        if: always()
        uses: ./.github/actions/write-convergence-record
        with:
          sha: ${{ github.sha }}
          apply-outcome: ${{ steps.apply.outcome }}
          working-directory: ${{ env.WORKDIR }}
          review-step-outcome: ""
          pre-apply-failure: >-
            ${{ steps.apply.outcome == 'skipped' && (steps.artifact_sha.outcome == 'failure' || steps.tf_init.outcome == 'failure' || steps.build_ducklake.outcome == 'failure' || steps.fetch_plan.outcome == 'failure') }}
          failed-step: >-
            ${{ steps.artifact_sha.outcome == 'failure' && 'artifact_sha' || (steps.tf_init.outcome == 'failure' && 'tf_init' || (steps.build_ducklake.outcome == 'failure' && 'build_ducklake' || (steps.fetch_plan.outcome == 'failure' && 'fetch_plan' || ''))) }}

      - name: Best-effort post-merge SHA->PR wake
        # Best-effort wake to re-engage a held subscription after the gated apply completes.
        # Same poll-free pattern as apply-sandbox (Decision 76). Decision 183: resolve the PR from
        # the ACKNOWLEDGED RED COMMIT on a routed dispatch (the incident PR humans are watching),
        # push's merge commit SHA otherwise -- same split as apply-sandbox's wake step. The
        # authoritative baseline is the next-planning-session convergence-record re-check.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event_name == 'push' && github.sha || github.event.inputs.acknowledge_red_commit }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          PR_NUM=$(gh api "repos/${REPO}/commits/${SHA}/pulls" --jq '.[0].number' 2>/dev/null || echo "")
          if [ -z "$PR_NUM" ] || [ "$PR_NUM" = "null" ]; then
            echo "No originating PR resolved for ${SHA}; next-planning-session baseline applies."
            exit 0
          fi
          if [ "$APPLY_OUTCOME" = "success" ]; then
            MSG="gated-apply converged GREEN for ${{ github.sha }} (IAM/trust/destroy change applied in CD after reviewer approval); convergence record updated with commit_sha and plan_sha. (Best-effort wake; next planning session re-checks the record.)"
          else
            MSG="gated-apply did NOT converge (RED) for ${{ github.sha }}; ci-rca will file a source=ci_rca rec. After review, unlatch via the workflow_dispatch acknowledge-and-retry path. (Best-effort wake.)"
          fi
          gh pr comment "$PR_NUM" --repo "$REPO" --body "$MSG" || true

      - name: Self-dispatch ci-rca on re-run failure (workflow_run re-run gap)
        # PLAN-gated-apply-rca-trigger: confirmed run 28379330706 (gated-apply, run_attempt=2)
        # failed with zero RCA signal -- ci-rca.yml's workflow_run:[terraform-apply-sandbox]
        # trigger is not reliably re-dispatched on a re-run's completion, and this job's normal
        # execution mode (post-approval) IS a re-run (run_attempt >= 2), as is an approval-window
        # expiry conclusion. Gated on run_attempt != '1' for parity with apply-sandbox's
        # self-dispatch; force_rca is omitted so any residual overlap collapses via ci-rca's
        # existing per-category commit-status dedup (Decision 74). failure()-only, after the
        # record write -- never touches the plan/apply data path (Decision 77 no-TOCTOU preserved).
        if: ${{ failure() && github.run_attempt != '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci-rca.yml -f run_id=${{ github.run_id }}
