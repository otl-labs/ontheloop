  findings:
    - id: CMTS-01
      surfaces: [S2]
      candidates: [C1, C20]
      question: Q1
      dimension: VD2
      title: "Every rebase discards the local full tier, the procedure never says a behind-main branch may be pushed, and the handoff loop is unbounded at peaks"
      evidence: "scripts/checks/validation_result.py:283-304|docs/contracts/git-ops.yaml handoff_sequence (189-226) and rebase_phase_distinction.commit_flow_time|.claude/skills/implement/SKILL.md IMPLEMENTATION Commit Flow|rec-4790|E1:day-2026-10-30|E2:pairs-185-of-1893"
      evidence_kind: observed
      current_behavior: >-
        attests_head requires the pushed HEAD tree to equal the attested tree, so any rebase, including one whose
        base delta touches none of the branch's files, returns tree_mismatch and forces a fresh 20-32 min run. The
        sequence is commit, rebase, full tier, verify-head, push; nothing states that a push may be behind main,
        and rec-4790's session re-rebased on every main move: five rebases, two with conflicts, four discarded runs,
        a tree_mismatch refusal and a hand push by the operator. Plans-only merges (48.6%) invalidate in-flight runs
        exactly as code merges do.
      ideal_behavior: >-
        Evidence survives a rebase whose base delta is disjoint from the branch's affected set; an agent pushes a
        behind-main branch as is and rebases only on a CONFLICTING signal; staleness at merge time is the server-side
        update-branch's job. Time-to-push is then bounded by the forced-conflict rate alone.
      gap: >-
        Expected handoff iterations at the P0 peak are about 28 under current practice and 1.18 under the
        conflict-only rule (DD-A); at H10 average the forced rate alone is 0.30 per push and the local run cannot
        survive H100 at all.
      compensating_controls_considered: >-
        The handoff evidence gate's failed_run pass-with-warning covers verdicts, not identity: a rebased tree is
        refused as tree_mismatch (counterfactual: a disjoint base delta still fails). The merge gate's update-branch
        remedy covers merge-time staleness (Decision 245 cl.4 needs no local run) but not the push. Neither
        property-matches the discarded-run cost.
      change_type: amend_decision
      proposed_change: >-
        Land handoff_remedy: affected-set carry-over in attests_head plus a record field for the attested merge-base;
        the rebase-only-on-conflict rule in git-ops.yaml and the implement skill; amend Decision 163 point 3 (cost
        basis per content change) and Decision 203 clause 1 (identity up to a disjoint base delta). Schedule option
        (b), retiring the local run for interactive handoffs, at about 220 merges per day or once deploys consume
        green verdicts and inherited reds are released.
      acceptance: >-
        A test rebases an attested branch onto a main that changed only files outside the branch's affected set and
        --verify-head exits 0; a test rebases onto a main that changed a file in the affected set and --verify-head
        reports tree_mismatch; the implement skill and git-ops.yaml carry the conflict-only rule and a test pins the
        wording; a replay of rec-4790's five rebases under the new rule needs one full-tier run.
      severity: high
      severity_rationale: >-
        Materially reduces liveness today (an observed hand push, an unbounded loop at peak hours) and is a scale
        limit whose trigger (forced re-rebase 0.3 per push) sits below H10; not critical because no wrong verdict is
        produced.
      confidence: CONFIRMED
      roadmap_crossref: {classification: planned-unbuilt, item_ids: [rec-4790],
        dedup_search_terms: ["handoff", "rebase", "attestation", "full tier", "tree_mismatch", "carry-over", "verify-head"],
        dedup_hit_count: 6,
        note: "rec-4790 (open, High, M, 2026-10-30) names options (a) carry-over, (b) push on fast-tier evidence, (c) a queue and says the choice amends Decisions 203 and 163; nothing plans it. rec-4118 and rec-4775 are gate parsing defects; rec-3625 is the planning-time rebase; rec-4451 the merge race. Prior audits: none."}
      effort: M
    - id: CMTS-02
      surfaces: [S2]
      candidates: [C2]
      question: Q1
      dimension: VD2
      title: "An implementation subagent cannot complete the pre-handoff full tier: the foreground cap is 10 min, the background completion never reaches it"
      evidence: "AGENTS.md:145-146|docs/contracts/overseer-dispatch.yaml:52 (author subagent commits and pushes) and liveness block (281-311)|rec-3039|E3:run-41744867975 (main-validate 35.9 min)"
      evidence_kind: static
      current_behavior: >-
