  handoff_remedy:
    verdict: attestation_carry_over
    mechanism: >-
      Two changes, landed together. (1) Carry-over: attests_head accepts a record whose attested tree differs from
      the pushed HEAD tree only by a rebase onto main whose base delta has an affected set (Decision 135's
      import-closure and data-edge channels over the files main changed since the attested merge-base) disjoint from
      the branch's own affected set; the record gains the attested merge-base, the gate computes the base delta from
      origin/main, and a non-disjoint delta still returns tree_mismatch. (2) Procedure: the handoff sequence states
      that a behind-main branch is pushed as is; a rebase is taken only when the PR reports CONFLICTING (the
      pr-conflict-signal wake) or the merge gate refuses with an update conflict; staleness at merge time is handled
      by the server-side update-branch remedy alone (Decision 245 cl.1), never by a local re-rebase.
    what_changes: >-
      scripts/checks/validation_result.py (record field plus the carry-over predicate), the handoff evidence gate's
      call site, git-ops.yaml handoff_sequence and rebase_phase_distinction.commit_flow_time, the implement skill's
      Commit Flow, and tests that fail without each. Decision 163 point 3's per-push cost basis becomes per content
      change; Decision 203 clause 1's identity rule becomes identity up to a disjoint base delta.
