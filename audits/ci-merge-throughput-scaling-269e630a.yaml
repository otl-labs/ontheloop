            push, and the 30% red rate on main shows the escapes but not the catches. Without a catch rate, the
            decision to keep or retire the local run (Decision 163 point 3) is narrative. Emit one telemetry event
            per --verify-head outcome (ok, failed_run, tree_mismatch) and compare catches with CI reds for a month
            before the next horizon.
          basis: [CMTS-14, CMTS-01]
        - question: "Own question: can the pipeline tell an agent merge from an operator merge?"
          answer: >-
