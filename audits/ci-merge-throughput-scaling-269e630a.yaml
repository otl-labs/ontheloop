  deep_dives:
    dd_a: >-
      Handoff timing trace (one agent against main). Inputs: local full tier T = 25 min (rec-4790: 20-25 min; CI
      main-validate mean 29.3 min on a 4-core runner, E3); merge rate r: H0 day-average 41/1440 = 0.0285 per min,
      P0 peak 8/60 = 0.133 per min; H10 ten times each. Poisson model P(main changes during T) = 1 - exp(-rT):
      H0 average 0.51, H0 peak 0.96, H10 average 0.999, H10 peak 1.0. A main change alone does not invalidate the
      evidence: attests_head (scripts/checks/validation_result.py:283-304) compares the pushed HEAD tree with the
      attested tree, GitHub accepts a push that is behind main, and the ruleset's strict policy is false
      (terraform/github/repo.tf:116). The evidence is discarded only by a REBASE, and every rebase discards it,
      clean or not, because the rebased tree differs from the attested tree (counterfactual: a base delta touching
      none of the branch's files still yields tree_mismatch). A rebase is forced only by a textual conflict (the PR
      turns CONFLICTING and pr-conflict-signal wakes the session). P(forced re-rebase during T) = 1 - exp(-rT q),
      with q = P(a landing merge conflicts non-mechanically with the branch) estimated at 0.05 from E2 (9.8% of
      merge pairs within 6 h share a file; about half the hotspot paths are outside the mechanical classes): H0
      average 0.035, H0 peak 0.15, H10 average 0.30, H10 peak 0.81, H100 average 0.97. Expected handoff iterations
      1/(1-p): H0 1.04 (peak 1.18), H10 1.43 (peak 5.3), H100 35. Expected time-to-push with rebase only on
      conflict: H0 about 28 min (peak 32), H10 39 min (peak 143 min), H100 over 16 h. The procedure, however, does
      not say that a behind-main branch may be pushed (git-ops.yaml handoff_sequence; implement SKILL.md Commit
      Flow), and rec-4790's observed case re-rebased on every main move (5 rebases, 2 with conflicts, 4 discarded
      runs, 1 hand push): under that practice the iteration count is 1/(1-P(main moves)), about 2 at H0 average and
      about 28 at the P0 peak, which is unbounded in practice. This is the reported stranding. Merge gate:
      P(OVERLAP on first attempt) about 4-5% at H0 (Decision 245's replay 2/38; E5 median 0 commits behind at merge);
      each update-branch iteration costs about 5 min (update, pr-validate mean 3.1 min, signal-green comment); the
      per-iteration re-refusal probability 1 - exp(-r x 5 min x 0.1) is H0 1.4% (peak 6.4%), H10 13% (peak 49%),
      H100 average 76%; the loop has no attempt cap (CMTS-03). Time-to-merge at H0: E5 median 9.5 min from PR
      creation, median 0.45 min from the green wake. Turn-ending waits and their wake sources: (1) the local full
      tier, backgrounded with a 2 h limit: wake = the harness background-task completion, delivered to the top-level
      session only, never to a subagent (AGENTS.md:145-146; CMTS-02); (2) PR CI: wake = the signal-green comment
      (ci.yml:539-571), continue-on-error, prefix-scoped (agent/, claude/, ccr-), so a lost comment or an unlisted
      prefix is a silent miss; (3) a conflict after a push to main: wake = the pr-conflict-signal comment, only on a
      later push to main; (4) update-branch: as (2); (5) a red main: NO wake source exists for "main is green again";
      E7 shows three open PRs idle about 11 h at read time behind the open red window, one body saying it is
      waiting for green main (CMTS-15); (6) the post-merge closeout fallback (implement SKILL.md step 5) instructs a
      WAIT on the trailer-closure job with no wake source; it is post-merge and bounded by the run, so it is noted,
      not filed; (7) operator approvals (typed approval, tf-gated-apply) are human-bounded. Waits with no wake: (1)
      for subagents and (5) for every session.
    dd_b: >-
      Capacity model inputs and method (every value is recorded in capacity_model.assumptions). Jobs per push to
      main with no path filter and an if true on every push: ci.yml main-validate, trailer-census,
      trailer-acceptance-evaluate, trailer-junit-verdict, trailer-closure, terraform-validate (six; pr-validate and
      signal-green are skipped on push), codeql.yml analyze, pr-conflict-signal.yml detect-conflicts,
      rec-autoclose.yml autoclose: 9 jobs, 39.3 job-minutes (main-validate mean 29.27, codeql push run about 5.0,
      rec-autoclose mean 1.75, terraform-validate 0.67, the four trailer jobs 0.52-0.62 each, conflict signal 0.38).
      Path-filtered on push: deploy-ducklake-lambdas (9 jobs, several conditional), deploy-prod-lambdas (2),
      terraform-apply-sandbox (apply-sandbox plus a conditional gated-apply). Jobs per pull_request synchronize on an
      agent branch: ci.yml pr-validate (mean 3.12 min), terraform-validate (0.68), signal-green (0.07, only on
      success), codeql analyze (about 1.5): 4 jobs, 5.4 job-minutes. Listed separately: path-filtered PR jobs
      (terraform-apply-sandbox ducklake-artifacts and advisory-status, terraform-github-plan, terraform-plan-trusted
      on pull_request_target); actor-dependent dependabot-auto-merge (skipped on agent PRs); comment- and
      review-triggered claude.yml. U = 0.87 head updates per merged PR (E5), so 1.87 PR runs per merge; M = 0.663 h
      mean time-to-merge (median 0.158 h; the mean is used because Little's law needs the mean residence time).
      Job-minutes per merge as is: 39.3 + 1.87 x 5.4 = 49.4. Scheduled job-minutes per hour at nominal cron: Main
      Canary 34 min per 3 h = 11.3, convergence-health 2.9, terraform-drift 1.1, security-detector-liveness 0.8,
      telemetry-causal-chain 0.23, telemetry-verification 0.33, telemetry-golden-replay 0.17, weekly workflows about
      0.1: 16.8 job-minutes per hour = 0.28 slots (observed cron delivery is 4-8 h apart, rec-4233, so the realised
      figure is lower). Peak-hour slot demand = r_peak(H) x 49.4 / 60 + 0.28. Plans-only variant (C17): a plans-only
      push (48.6%, E8) runs the fast tier (3.12 min) instead of 29.27, saving 12.7 job-minutes per merge on average.
      Persona variant: one job per persona per qualifying PR update; qualifying shares from E8 classes: code
      reviewer on code, deploy-path, terraform and config PRs (45.7%), decision scout and plan critic each once on
      plans-only PRs (48.6% x 2); persona_jobs_per_pr_update = 0.457 + 0.972 = 1.43; persona minutes ASSUMED 10 per
      job (checkout, image pull, one LLM verdict); 1.87 x 1.43 x 10 = 26.7 job-minutes per merge. Red occupancy:
      the pinned formula counts every red run as its own window, which double counts consecutive reds inside one
      window (10 of the 15 reds in E3 sit in one window); the deviation recorded is to use red EPISODES per merge
      (windows started per push, 4/50 = 0.08) with the mean window of 3.6 h (three closed windows of 0.24, 0.77 and
      0.76 h plus the open window truncated at BASE_DATE, 12.6 h); the run-based figure (0.30 x 3.6 h) is reported
      in the note. GITHUB_TOKEN calls: pr-conflict-signal issues one gh pr list per push plus, per open agent PR, a
      mergeable poll of 1-5 calls (mergeability is UNKNOWN for a while after every push to main, so 2 is used), plus
      a comments read and a comment post on a conflict; signal-green one call per green PR update; ci-rca about 15
      calls per red episode; the trailer and deploy jobs use no GitHub API. Open PRs at H by Little's law (r_day x
      M): 1.13, 11.3, 113; observed at read time 4 (three held by the red window, one conflicted for 36 h), reported
      alongside. Operator escalations: conflict stops modelled at 0.014 per merge at H0 (0.47 x 0.06 x 0.5) rising
      to 0.27 at H10 average; hand pushes as in rec-4790 (1 in about 4 days); tf-gated-apply approvals on about
      half of terraform merges (3.7% of merges); Track B red repairs needing a plan approval (0.08 x 0.75 per
      merge); gate release-valve merges once the gate loop exceeds a cap (none at H0, about 20% of peak-hour merges
      at H10). Decision 205 clause 3's path-filtered push triggers for repo-scoped scheduled agents would add one
      LLM job (about 10 min) per qualifying push; with three such agents on disjoint path filters and the E8 mix,
      roughly 3-5 job-minutes per merge, which does not change the binding constraint but brings the persona
      saturation point from about 80 to about 75 merges per day.
    dd_c: >-
      Coupling map of per-push main-validate (what assumes one full-tier run per push-to-main commit). (1)
      ci-rca.yml: the workflow_run head_sha is checked out (line 80), the anchor commit is that head (lines 156-171,
      except the terraform-apply-sandbox convergence case), one PR is resolved per anchor via commits/{sha}/pulls
      .[0].number (line 260) and its selection-manifest is fetched (lines 258-281), dedup is keyed on commit
      statuses of that one anchor per workflow slug (lines 340-368); scripts/ci_rca/vacuous_pass.py reconstructs the
      merged diff as git diff HEAD^ HEAD (lines 69-92). Under a batched run covering three merges the diff and the
      PR are the batch tip's only, the two earlier merges are never considered, dedup misses them, and the rec's
      affected set (which red_overlap uses to halt overlapping work, Decision 226 cl.3) is the tip's. Minimum
      change: carry the batch range (last green SHA..head) in the evidence bundle, diff and resolve PRs over the
      range (git log --first-parent with the (#N) subjects, or commits/{sha}/pulls per commit), run a culprit
      step that re-executes only the fingerprinted failing check per commit in the range (cheap when the fingerprint
      names a test node), and key dedup on fingerprint plus range rather than one anchor. (2) ci.yml
      trailer-junit-verdict (268-328) needs main-validate and downloads the SAME run's pytest-junit artifact with no
      run-id input, a provenance rule git-ops.yaml trailer_acceptance_gate.source_admission makes structural
      (Decision 201). If main-validate does not run on a push, junit-routed recs get no verdict and trailer-closure
      refuses loud-not-red, so every junit-routed rec on a non-batch push stays open. Minimum change: let the junit
      verdict bind to the first full-tier run whose head contains the merge commit (ancestry plus conclusion), posted
      by that run's workflow_run, amending Decision 201's same-run provenance rule to an ancestry-bound rule; or
      route junit-shaped acceptances through the sandboxed probe on the push run until then. (3) Decision 226's
      workflow_tier: is_track_a (scripts/ops_portal/ci_rca_schema.py:200-205) requires workflow_tier CI, and
      config/ci_rca_taxonomy.yaml maps both CI and Main Canary to tier CI, so a batch run on the canary workflow
      already classifies as CI; no change. (4) rec-autoclose.yml runs per push with a HEAD^ diff of DECISIONS.md
      (lines 21-30): per-push, unaffected by batching the full tier. (5) The merge gate, the handoff gate, signal-green
      and pr-conflict-signal are per-PR or per-push and unaffected. (6) A deploy gate keyed on workflow_run of CI
      (CMTS-09) keys on the batch run's head under batching, which is last-green-wins by construction. (7) Decision
      226 cl.3's overlap halt reads the red's affected set: under batching it is the union of the batch until the
      culprit step narrows it (over-blocking, bounded by the batch size). (8) Decision 205 cl.5's plans-only fast
      tier (rec-4114) is a path filter on main-validate, orthogonal to batching.
    dd_d: >-
      Deploy versus verdict ordering. deploy-ducklake-lambdas.yml: on push to main with path filters (src/lambdas/
      ducklake_*, src/common/ducklake_*.py, config/lambda/ducklake, src/row_rules, src/telemetry) plus
      workflow_dispatch; concurrency group deploy-ducklake-lambdas, cancel-in-progress false; deploy jobs assume the
      agent-platform-github-ci-deploy role, smoke jobs the branch role; nine jobs with reconcile-gate and smoke
      gates. deploy-prod-lambdas.yml: on push to main with its own path filters; concurrency deploy-prod-lambdas,
      non-cancelling; deploy role then branch role. terraform-apply-sandbox.yml: on push to terraform/personal/**
      applying the PR-time saved plan (Decision 77) in the non-cancelling terraform-apply-sandbox group under the
      agent-platform-github-ci-apply role; the gated leg uses environment tf-gated-apply. Identity: the deploy and
      apply roles trust sub repo:<owner-segment>:ref:refs/heads/main (terraform/personal/oidc_pipeline_roles.tf main-sub
      statement; terraform/bootstrap/github_ci_apply.tf lines 86-89 trust both the main ref and
      environment:tf-gated-apply). A workflow_run-triggered job runs on the default branch's workflow definition with
      github.ref refs/heads/main, so its OIDC sub is unchanged and both roles keep trusting it; checking out
      github.event.workflow_run.head_sha changes the tree, not the subject. workflow_run has no path filter, so the
      path test moves in-job (git diff --name-only <last deployed sha>..<head_sha> against the same patterns), and
      out-of-order completion needs an ancestry test (deploy only when head_sha descends from the last deployed SHA;
      last-green-wins). E6 join: deploy-ducklake-lambdas 20 of 20 push deploys completed before the CI verdict
      (deploys finish in 6-13 min, main-validate in 20-45 min; identical created_at, same push event), 1 of 20
      deployed a commit whose main-validate later failed (a06a8a1152, deploy run 40548129029 green at 17:19:52Z on
      2026-10-27, CI run 40548128960 red at 17:45:53Z; no source=ci_rca rec resolves to that run in E4, cause not
      determined here). deploy-prod-lambdas: 2 of 2 in the window completed before the verdict; 1 of 2 preceded a
      red (22588cd321, deploy 39833077932 green 18:38:52Z on 2026-10-22, CI 39833078207 red 19:11:21Z; the red is
      rec-4552, a Track A coverage drop in scripts/run_scheduled_agent.py, a file on that deploy channel's own path
      list). terraform-apply-sandbox: 20 of 20 completed before the verdict, 0 preceded a red; two apply runs
      failed on their own while CI passed. Counterfactual: no deploy workflow refuses a SHA whose main-validate later
      fails, so a later green verdict is not a control for any channel today. Recommended trigger for the two Lambda
      channels: on workflow_run of CI, types completed, branches main, if conclusion == success, checkout head_sha,
      in-job path and ancestry tests, same concurrency groups. Terraform stays on push (deploy_channel_gating).
