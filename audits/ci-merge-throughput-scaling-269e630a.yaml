      verdict: degraded
      confidence: CONFIRMED
      basis: [CMTS-01, CMTS-02, CMTS-03, CMTS-15, CMTS-14]
      prose: >-
        At H0 the common case is fast: a PR reaches merge in a median 9.5 min, no merged head lacked a green fast
        tier, and the merge gate rarely refuses (0 commits behind at merge is the median). The path degrades in four
        places. The local full tier (20-32 min) races main with a 0.51 chance of a move per run at the day average
        and 0.96 at the peak hour; the race only forces a rebase on a textual conflict (3.5% average, 15% at peak),
        but the procedure never says a behind-main branch may be pushed, so agents re-rebase on any move and the
        loop becomes 2 to 28 expected iterations (rec-4790: 5 rebases, 4 discarded runs, a hand push). A subagent
        cannot run the full tier at all (foreground cap 10 min, background completion never delivered). A red main
        halts handoffs with no wake for recovery: three PRs sat 11 h behind the open 12.6 h red window at read time.
        The merge-gate update loop has no attempt cap, harmless at H0 (1-6% re-refusal per iteration) and divergent
        at H10 peaks (49%). Remedy: see handoff_remedy.
