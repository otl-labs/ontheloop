          basis: [CMTS-13]
        - question: "Which constraint binds first: the 20-job cap, the GITHUB_TOKEN rate limit, GitHub's workflow trigger rate limit, red occupancy, or the operator's capacity to handle escalations?"
          answer: >-
            Red occupancy (1.0 at about 83 merges per day, partly observed now at 0.34), then concurrent jobs
            (about 80 with personas, 123 as is, 165 with plans-only fast), then GITHUB_TOKEN (about 160-300), then
            operator capacity (conflict stops pass one per day at about 70 merges per day and reach about 110 per
            day at H10; escalations of all kinds about 220 per day at H10). The workflow trigger limit (1500 events
            per 10 s) never binds: H100's peak is 800 pushes per hour.
          basis: [CMTS-15, CMTS-06, CMTS-12, CMTS-04]
        - question: "How many human-only escalations per day reach the single operator at H10 and H100, and which design choices remove them?"
          answer: >-
            Model: H0 about 4 per day (0.6 conflict stops, 0.25 hand pushes, 0.8 gated applies, 2.5 Track B plan
            approvals); H10 about 220 (110 conflict stops, 80 gate release-valve merges, 8 gated applies, 25 Track B
            approvals); H100 thousands. Removals, in order of leverage: an agent-owned bounded rebase with escalation
            after two failures, un-gated from executor concurrency (Decision 217 cl.2); evidence carry-over and
            rebase-only-on-conflict (CMTS-01); a gate attempt cap with an automatic local-rebase fallback instead of
            an operator merge (CMTS-03); delta ratchets and roster unions for the unlisted hotspots (CMTS-04,
            CMTS-05); class-level preventives so Track B reds stop each needing a plan cycle (rec-4441).
          basis: [CMTS-04, CMTS-03, CMTS-01, CMTS-05]
        - question: "Is the sandbox deploy tier now production in practice (Decision 73 clause 5's premise), and what follows if so?"
          answer: >-
            Yes. deploy-prod-lambdas.yml deploys the three prod-class Lambdas into it, the DuckLake warehouse that
            is the sole ops backend (Decision 84) and the telemetry pipeline run there, and the 2026-07-24
            ops_decisions outage was a sandbox code deploy. Decision 73 cl.5's "mocked, no real capital" premise
            describes the trading product axis, not the ops plane. What follows: NSP-3 applies to the ops plane now
            (CMTS-09); the single_account_rule stands, because a last-green ref inside the tier delivers the property
            without a new account; and "tolerates red main" should be re-scoped to the product sandbox only.
          basis: [CMTS-09, CMTS-11]
        - question: "Should plans-only merges ride the main merge path at all, or invalidate in-flight handoff evidence (C20)?"
          answer: >-
            They should ride it, because Decision 205 cl.5 makes the git file at a SHA the plan's authority and the
            merge is the approval record, but they should cost a fast-tier run only (rec-4114 removes about 12.7
            job-minutes per merge on average) and should never invalidate evidence: with carry-over keyed on affected
            sets a plans-only base delta has an empty code-affected set, so no in-flight full tier is discarded. They
            should also not trigger codeql or the trailer evaluate job (consolidation, CMTS-06 lever).
          basis: [CMTS-01, CMTS-06]
        - question: "What does an adopter on a private, minutes-billed repository inherit from this design?"
          answer: >-
            About 49 job-minutes per merge (about 2,000 minutes on an H0 day), so a Pro plan's 3,000 included
            minutes last under two days and a Free private plan's 2,000 under one; a 20-slot cap with no larger
            runners; rulesets and CODEOWNERS that need Pro or better on private repos (the private-repo audit's
