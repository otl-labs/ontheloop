        recs_related raw total 179. rec-3250 (open since 2026-08-24, High) is in no plan's bundled_recommendations; T4.24
        is deferred_post_mvp; T1.5 is not_started. Waiting for T4.24 is not sound: the read grows by about 250 tokens a
        round each day and the interim remedy is one small plan.
    effort: S
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
