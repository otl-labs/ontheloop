  - q: Q10
    answers:
    - question: >-
        Does the 6,144-byte cap now shape how entries are written in a way that makes them harder for an agent to read correctly?
      answer: >-
        It shapes them; whether they are read less correctly the repository cannot show. Half of the entries landed since
        the cap was armed sit within 5 percent of it and 28 of 94 within 50 bytes. What changed in the text is mostly omission,
        not abbreviation: the Rationale section is present in 41 percent of the newest band against 74 percent before, and
        is half the size. Clause packing is confined to a few entries: Decision 254 amends 11 Decisions in 9 clauses and
        cites 13 of them by bare number ('73 cl.2'), which tooling that matches 'Decision N' does not see; the band average
        is 1.1 bare citations an entry. No measure of comprehension exists.
      basis:
      - CFR-02
    - question: >-
        Is amends the main way the corpus grows, and what does a chain of amendments cost a reader who lands on the oldest
        entry?
      answer: >-
        Yes. 81 of the 97 entries since Decision 167 amend at least one earlier entry and 1 supersedes one; there are 209
        live amends edges. For the six most-amended entries a reader needs 6 to 10 entries to state the current rule, and
        the amended entries have grown to 9,049-13,949 bytes through annotations. The entry itself names its amender on
        189 of 209 edges (153 of 155 in P2); the other 20 are waived. Through waived edges a reader of Decision 73 or Decision
        144 alone could act on a clause a later entry changed (E4-01, E4-06). In the planning path the risk is smaller than
        it looks, because the scout triages every live entry and so meets the amender as well.
      basis:
      - CFR-01
    - question: >-
        Do contracts now show the growth pattern the decision corpus showed in P0, and is the 500-effective-line budget
        changing how they are written?
      answer: >-
        Yes to both. Contract bytes went from 467,997 to 1,919,749 since 2026-08-07, and the class took in 17,596 bytes
        a day in P2 against the decision corpus's 8,192. Files at the budget are edited line-neutral with longer lines (telemetry_sessions.yaml:
        413 lines and 19,351 bytes to 500 lines and 64,750 bytes; longest line 118 to 1,750 characters), and amendment_log
        rows are folded into one-line mappings or compacted by hand.
      basis:
      - CFR-05
    - question: >-
        What share of entries landed since Decision 167 are themselves about governing decisions, contracts or this corpus?
      answer: >-
        From titles only: 8 of 97 (167, 168, 175, 177, 179, 196, 243, 262), 8 percent. Counting entries about neighbouring
        governance records as well (plans, the roadmap, the verification registry, wording approval, the glossary: 174,
        176, 181, 197, 227, 240, 246) gives 15 of 97. The share fell after the intervention window: 5 of 21 entries in P1,
        3 of 76 in P2.
      basis: []
    - question: >-
        At what number of live entries does one plan's decision-scout triage stop being reliable or affordable, and what
        in the repository would show it happening?
      answer: >-
        Affordable: each entry adds about 220 tokens to the index, which is about 46,600 tokens at 216 entries and reaches
        100,000 near 460 entries, about seven months away at the P2 rate. That is half of a 200,000-token window and a tenth
        of the one-million-token window sessions are set to. Reliable: unknown, and nothing would show it. The 'N of M'
        line proves the count was read, not that each entry was judged; the scout returns flags on 92 percent of rounds,
        so its verdict does not discriminate; T1.5's retrieval-quality criterion is unbuilt and no record links a missed
        citation found later to the round that missed it.
      basis:
      - CFR-03
      - CFR-07
    - question: >-
        What would a steady state look like: what must leave, or stop costing, for entries to keep arriving at the P2 rate
        indefinitely?
      answer: >-
        Four things. The index must stop being read whole, or rows must leave it (slim rows; skeleton rows for compacted
        stubs). Specification must have a home whose change does not mint an entry, since four in five new entries exist
        to amend. Chains must be retired by supersession: a consolidating entry that restates a subject's current rule lets
        its predecessors compact. And reversal conditions must be computed or expire, because about 2.7 manual conditions
        are added a day. The entry file itself need shed nothing.
      basis:
      - CFR-01
      - CFR-03
      - CFR-06
    - question: What do the routing and alignment gates cost per plan against what the record shows they catch?
      answer: >-
        Across the 111 plans that record rounds: 6.5 plan-critique rounds a plan (400 of 720 REVISE), 1.56 scout rounds
        (159 of 173 with flags, no BLOCK recorded) and 2.4 wording-check runs (28 of 269 failed). In the 16 plans that draft
        a Decision: 6.0, 2.2 and 3.4. Each round is a fresh sub-agent; a scout round reads about 54,000 tokens of fixed
        files (its skill, the north stars, the index) before the plan. What they catch is recorded only as counts of blocking
        findings and nits, so the record cannot say how many REVISE verdicts were routing catches. T4.32 c6 and rec-4434
        are set to record findings by id.
      basis: []
    - question: Q2 measures a planning run. What does an implementing run read?
      answer: >-
        Taking the paths that .claude/commands/implement.md and .claude/skills/implement/SKILL.md name today under docs/contracts/,
        under .claude/ or at the repository root, the two files included: 17 files; 266,582 bytes on 2026-08-07, 360,889
        on 2026-09-12 and 497,688 at the audited commit. The list comes from today's workflow, and 8 of the 17 were not
        named by the two files at the 2026-08-07 boundary. The pattern is the planning run's: the skill shrank (48,196 to
        33,216) while its pointer targets grew.
      basis:
      - CFR-04
    - question: Did outcomes change, as well as cost and routing?
      answer: >-
        One outcome can be measured and it improved: a census before the intervention found 55 of 126 live entries edited
        out of line with what they described, and an exact-line comparison now finds no unsanctioned change to a ratified
        body since 2026-08-27. Beyond that the repository cannot measure it. No label ties a red main, a REVISE or a recommendation
        to a governance cause; the gate-round fields are newer than the intervention, so there is no 'before'; and a scout
        BLOCK has been recorded as rare, once, in a Decision's prose.
      basis:
      - CFR-07
    - question: Where does the change narrative go now?
      answer: >-
        Not into the squash commit: median bodies on contract-changing feat commits fell from 1,155 bytes (with a Decision)
        and 1,072 (without) in P0 to 454 and 324 in P2. It goes into the plan file, whose median size rose from 26,449 bytes
        for plans first added in P0 to 46,222 in P2, and partly outside the repository: one sampled plan cites its consult
        evidence in a shared workspace folder (rec-3958 owns plan self-containment). Pull-request bodies were not read.
      basis: []
    - question: Is Decision text being tested as if it were code?
      answer: >-
        In part. Thirteen test modules import the decision-entry fixture and pin the wording, envelope values, dated notes
        or size of particular entries. They stand in for the retired immutability guard on those entries (13 modules so
        far). One blocked a sanctioned annotation (commit ac06ced6) and two recommendations were needed to align their size
        measure with the contract (rec-4730 closed, rec-4744 open).
      basis: []
    - question: How many reviews fall due at once?
      answer: >-
        Five stanzas between 2026-11-17 and 2026-12-07, one overdue since 2026-09-30, then 15, 17, 20 and 16 stanzas (205
        conditions) on the last day of March, April, May and June 2027.
      basis:
      - CFR-06
