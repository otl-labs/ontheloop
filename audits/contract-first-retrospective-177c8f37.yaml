    proposed_change: >-
      Keep the 500-line budget. Add a per-file byte companion for the contracts class seeded at each file's current size,
      with the existing raise-approved marker, or lower the long-line companion for this class with present lines grandfathered.
      Name 'split by subject into a sibling contract' as the relief valve in the class row and in plan_obligations' NEAR_CAP
      text. Land rec-4119's amendment_log retention rule.
    acceptance: >-
