  - id: CFR-05
    surface: contracts
    question: Q5
    dimension: VD4
    title: >-
      The contract budget counts lines while readers pay in bytes: files at the limit keep growing through longer lines
      and compacted logs
    evidence: >-
      metrics.contracts_near_budget; E2-11, E2-15, E2-16, E2-18, E2-20; config/structural_size_budgets.yaml:33-35, :94
    evidence_kind: observed
    current_behavior: >-
      Twenty of 77 contracts sit at or above 475 effective lines against a budget of 500 (2 of 37 on 2026-08-07), nine of
      them between 493 and 500. At the limit, changes arrive line-neutral: in five sampled P2 commits a file kept or lost
      lines (down by up to nine) while gaining 1,190 to 5,297 bytes, and one records that it compacted two earlier amendment_log
      rows into its own 'as the contracts-class relief valve'. Bytes per effective line for the class rose from 63 to 84.
      docs/contracts/telemetry_sessions.yaml went from 413 lines and 19,351 bytes on 2026-09-12 to 500 lines and 64,750
      bytes, its longest line from 118 to 1,750 characters; 15 files now hold a line over 1,000 characters, against 1. The
      engine's header says a line count alone can be met by joining lines and adds a 2,000-character companion to close
      that; set about 20 times above the class's mean line, the companion has not bound. amendment_log rows are 16 percent
      of the class's effective lines. Decomposition, the designed response to a full budget, is not what happens.
    ideal_behavior: >-
      A contract that reaches its budget splits by subject or retires log history under a stated rule, and the budget's
      unit tracks what an agent pays to read the file.
    gap: >-
      The flow governor is in lines and the cost is in bytes; the companion that was meant to link the two is too loose
      to bind.
    compensating_controls_considered: >-
      The 2,000-character long-line companion (config/structural_size_budgets.yaml:33-35): no file breaches it, so it has
      never failed, and it would allow a 500-line file of a megabyte. plan_obligations' NEAR_CAP rows report headroom in
      lines. rec-4119's proposed retention rule would relieve log lines only. None fails when a file at 500 lines grows
      in bytes.
