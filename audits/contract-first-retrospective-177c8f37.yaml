    contract_notes: >-
      (1) meta.model: the session's policy forbids writing a model identifier into a repository artifact; the key is kept
      and its value withheld (alternative: name the model). (2) Web: three fetches were attempted (RFC 8126, the MADR site,
      Nygard's 2011 post) and all three failed DNS resolution because the hosts are outside this environment's network allow-list;
      web_unavailable is set, practices are cited from own knowledge, and each Q9 step whose practice goes beyond an EX
      id of the pinned checklist is HYPOTHESIS (alternative reading: every Q9 step HYPOTHESIS). (3) Band assignment: docs/contracts/file-router.yaml,
      docs/contracts/git-ops.yaml and docs/contracts/project-alignment.yaml are assigned always_read because AGENTS.md:124,
      .claude/commands/plan.md:45 and :60 send every run to them with no section bound; the alternative is on_demand (read
      in part), and Q2's prose gives both results. (4) E1 block rule as applied: a block goes to change-record when any
      sentence's truth is tied to the landing (incident narrative with run or PR ids, dated measurements, 'residual until
      X lands'), else to specification when it holds forward rules, bindings or obligations, else to rationale; class four
      is the header, envelope, Status/Date/Warehouse markers, the bare Decision label, Related, separators and dated annotations.
      Recorded shares are rounded to 5 points by least total error so that each row sums to 100. (5) Extra read targets:
      counted explicit paths, contract basenames and skills named by skill name; excluded gitignored logs/ paths, globs,
      output paths and paths named only as a validator. (6) Compaction: no telemetry read was spent on it; every derived
      read verb's SQL selects session events of kind open, close or annotate only, so no read could return a compact count.
      (7) E5 sessions are summed over a tree's per-model rows. (8) Q8 Decision 179 index-read-context-cost: reading one
      chosen (the window closed when the first of the two criteria landed); the alternative keeps it open until T1.5 c1
      lands. (9) The audited commit is 23 first-parent commits after 197c800c (same day); every difference from Section
      10's figures is ordinary drift (entries 264-267, registered checks 185, P2 feat commits 220) and no anchor failed
      to resolve. origin/main moved during the run; every figure is from the audited commit. (10) The worker process restarted
      once mid-run; state was held in scratch notes and nothing was re-derived differently. (11) Limits used: 22 of 40 dedup
      commands, 4 of 8 telemetry reads, 3 of 10 web lookups (all failed).
