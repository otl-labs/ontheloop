  question_answers:
  - q: Q1
    verdict: not-shifted
    rule_share_p2: 0.17
    rule_share_p0: 0.5
    carrying_share_p2: 1.0
    carrying_share_p0: 1.0
    basis:
    - CFR-01
    - CFR-02
    prose: >-
      Bound: mean_spec_share of the 12 newest live entries is 74 against a baseline of 65 (plus or minus 10), so 'shifted'
      is not available. Limit on that comparison: the pinned block rule sends a mixed block to the first class any of its
      content matches, which reads high if the baseline judged blocks by their main job. It probably did: baseline entry
      Decision 164 has a Related list of 27 percent of its bytes and was scored 5 percent 'other'. Counting every Problem
      paragraph as rationale instead gives 64, still above 55, so the bound holds on either reading. The four recorded shares
      are not comparable with the baseline's for the same reason; spec_share is. Threshold applied inside the bound: 'partially-shifted'
      needs at least two of the four like-for-like comparisons to move the intended way. None did. spec_share 74 (or 64)
      against 65. rule_share, rules landing in a contract with no Decision: 1 of 6 now against 3 of 6 before. carrying_share,
      entries that still carry specification: 4 of 4 now and 4 of 4 before (three of today's four state more than the commit
      put in any contract; one restates it). Contract-changing commits that also change the decision file: 94 of 243 (39
      percent) in P2 against 27 of 81 (33 percent) in P0. The E1 partition and the E2 groups carried the verdict. Inputs
      that point the other way: the bar test (10 of 12 clear the bar on their own clauses, 2 only through an amends edge,
      none is owned by another routing row, because the rule as written has no row for mechanism specification); new entries
      per plan file 0.221 against 0.262 in P0, which is not like-for-like across the Decision 178 deletion; entries are
      smaller (median 5,870 bytes at first appearance against 7,257 for Decisions 140 and up at the baseline) and no longer
      carry file lists or verification-round narrative; and the destination is real, 77 contracts against 37, but it receives
      the content beside the entry, not instead of it. Contract changes with no Decision were already 68 percent of contract
      feat commits in P0 and are 60 percent in P2, so their presence shows nothing. The samples are small (12 entries; 6,
      6, 4 and 4 commits) and single-rater; no one E2 figure decides this. The 12 entries were decided between 2026-11-10
      and 2026-11-16: they show the newest practice, not every entry since Decision 167.
  - q: Q2
    verdict: grown
    root_agent_direction: grown
    gate_subagent_direction: grown
    basis:
    - CFR-03
    - CFR-04
    - CFR-07
    prose: >-
      The three directions are arithmetic on the band table. always_read plus gate_subagent is 426,088 bytes at the audited
      commit against 276,193 on 2026-08-07 (plus 54 percent; token estimate 69,048, then 71,509 on 2026-09-12, now 106,522).
      always_read alone is up 41 percent (137,615 to 193,734) and gate_subagent up 68 percent (138,578 to 232,354). The
      judgment is the assignment. Five files are ambient or mandated in full. Three more are assigned always_read because
      every run is sent to them with no section named: git-ops.yaml (AGENTS.md:124, read before any push), file-router.yaml
      (plan.md:45) and project-alignment.yaml (plan.md:60). If those three are read in part instead, the root agent's intake
      is down 22 percent (113,782 to 89,129) and the total is still up 27 percent, because the gate band does not depend
      on that call. Roles changed between boundaries: the git-ops procedure left AGENTS.md (33,190 to 16,725 bytes) for
      git-ops.yaml (0 to 54,340), and the planning skill (55,810 to 42,994) moved its walks into tier-item-lifecycle, vp-red-before
      and recommendation-relevance contracts. Outside the 16, the two workflow files name 24 further read targets: 1,615,022,
      then 1,695,668, now 2,417,669 bytes. Three of them are only ever read in part (the decision file and two roadmaps);
      the other 21 went from 198,324 to 442,999 bytes. They are conditional reads and move the comparison further toward
      grown. logs/.preflight-report.json is 174,193 bytes at audit time, is not in git and is in no figure. Observed: eight
      plan-producing session trees from 2026-11-15 and 2026-11-16 took in a median 676,094 first-time tokens (minimum 425,593,
      maximum 10,564,188). Six ran 108 to 214 model calls and 425,593 to 754,896 first-time tokens; the other two ran 1,564
      and 3,062 calls and plainly did more than plan. These are upper bounds for one plan. Telemetry begins 2026-10-20,
      so there is no observed 'before', and compaction cannot be counted (meta.compaction_unreadable). What a run needs
      against what it could fetch: the three largest items in the two bands are the decisions index and the two procedure
      contracts, and all three could be fetched in part.
  - q: Q3
    verdict: enforced-by-default
    basis:
    - CFR-08
    prose: >-
      Default rule applied, not departed from. enforcing_share is (41 x 5/6 + 12 x 4/6) / 53 = 0.80, and bound_count is
      9 of 12; both sit at their thresholds (0.75 and 9), so one reclassified sample in either set would give 'mixed'. What
      the verdict measures is that a unit has something that asserts part of it or instructs an agent at a trigger. It does
      not measure that the sampled statement is enforced: of the 12 evaluator samples 2 assert the statement, 4 instruct
      at a trigger, 3 assert other content of the file, 1 reads structure only and 2 only mention the file. For the 12 newest
      entries the main clause is bound to a check, test or hook in 9; 2 are cited only (Decisions 253 and 254, whose enforcement
      is named as recommendations still to be built) and 1 has nothing (Decision 258, whose own Coverage paragraph says
      so). The original complaint no longer describes new entries: all 12 carry a Coverage paragraph naming the enforcer
      and the residual for each clause.
  - q: Q4
    verdict: core-holding
    basis:
    - CFR-01
    - CFR-02
    - CFR-03
    - CFR-06
    prose: >-
      Computed from the ledger. Every core purpose has at least one row that is holding or holding-with-side-effect (routing
      L2, L5, L6; entry-size L3; contract-enforcement L7; read-cost L11, L16, L17), so there is no core gap; three rows
      are eroded (L4, L12, L18) and two retired without a replacement (L14, L15), so not all hold. Counts: holding 7, holding-with-side-effect
      8, eroded 3, retired-without-replacement 2, never-exercised 1. The ledger measures whether each mechanism does what
      it was specified to do. The routing rows do (a claim is recorded, a justification is written), and Q1 shows that none
      of them was specified to change what an entry carries. Both retirements were recorded acts, and the property behind
      L14 held without its guard: an exact-line comparison finds one changed entry among the 131 present on 2026-08-27,
      and it is Decision 67's sanctioned compaction. Earlier findings: closed 8 (CFG-01, 03, 04, 05, 06, 08, 10, 11), partly-closed
      1 (CFG-09), superseded 1 (CFG-02), open 1 (CFG-07).
  - q: Q5
    verdict: sustainable-with-named-gaps
    any_limit_binds_within_30_days: "no"
    projections:
    - horizon_days: 90
      live_entries: 321
      token_estimate: 155002
    - horizon_days: 180
      live_entries: 426
      token_estimate: 203481
    - horizon_days: 365
      live_entries: 643
      token_estimate: 303133
    basis:
    - CFR-02
    - CFR-03
    - CFR-04
    - CFR-05
    prose: >-
      No hard limit binds within 30 days: the only one is the roadmap's 10,000 lines, and its P2 rate is negative (the Decision
      227 archive move; since then it has grown 13 lines a day against 1,097 of headroom). Threshold for the judgment: unsustainable
      only where a limit binds within 30 days or a per-run cost grows with no lever identified. Each gap here has a lever
      that is identified and not built. The cost of one planning run does not stay flat as stock grows. Each new entry adds
      about 880 bytes to an index the scout reads in full, and the two largest contracts in the run's path have grown since
      2026-09-12 (git-ops.yaml 14,335 to 54,340 bytes; file-router.yaml 31,482 to 44,878). On the P2 trend the static estimate
      is 155,002 tokens at 90 days and 303,133 at 365. The entry file itself is sustainable: a per-entry cap bounds what
      each addition costs, and no reader loads the file. Having no limit on entry count is not by itself a problem under
      B4; it becomes one only through the index. The ambient layer is governed by a ratchet and is shrinking. Plans, recommendations,
      checks and tests have no limit and are read one at a time or through bounded verbs. Contracts: the class absorbed
      17,596 bytes a day in P2, twice the decision corpus's byte inflow, under a governor that bounds lines per file. It
      does not bound that rate. A file that reaches its budget does not split: it takes line-neutral edits with longer lines
      and compacts amendment_log rows (20 of 77 files are within 25 lines of the budget; bytes per effective line rose from
      67 to 84 in P2).
  - q: Q6
    verdict: insufficient
    basis:
    - CFR-01
    - CFR-02
    - CFR-04
    - CFR-05
    - CFR-06
    - CFR-07
    prose: >-
      Computed from the findings: 1 is novel and 5 are planned-insufficient, 6 of 8, more than half. An owner exists for
      seven of the eight, and none is in progress. Five owners have an acceptance that would not remove the defect: rec-3023
      and rec-3682 for the corpus, rec-4119 for contracts, rec-3264 for reversal conditions, T3.14 for the cost metric.
      Two have an adequate remedy that is unbuilt: rec-3250 with T4.24 c7, and T2.54.
  - q: Q7
    verdict: mixed
    basis:
    - CFR-01
    - CFR-02
    - CFR-08
    prose: >-
      Computed from the deltas: one up (EX13), one down (EX11), eleven unchanged; 3 met, 9 partial, 1 missed. EX13 rises
      because every contract is now versioned and gate-bound. EX11 falls on the rejected-alternatives half only; its reversal
      half is stronger than at the baseline, and the fall is a judgment call on the figures given. Several properties improved
      inside 'partial' (EX3, EX4, EX12) without reaching 'met'. EX7 stays 'missed' under the baseline's own rule, which
      forecloses 'frontier' on every surface.
    external_checklist:
    - property: EX1
      rating: partial
      evidence: >-
        Immutable in practice (no unsanctioned change to a ratified body since 2026-08-27), numbered, with context, decision,
        status and consequences. Still doubles as the specification: 41 percent of the 12 newest entries' bytes. Control:
        the specification in an entry is backed by a contract or check that is the enforced copy for 9 of the 12 main clauses,
        so the entry is not its only home; the control fails when code leaves the contract, not when the entry leaves it.
      baseline: partial
      delta: same
    - property: EX2
      rating: partial
      evidence: >-
        A labelled specification surface now exists and is gated (53 Class D contracts with evaluators), but Decision clauses
        remain citable requirements: checks quote them (validate_decisions_size.py:43-47) and the scout blocks on them.
        Control: every new entry's Coverage paragraph labels, clause by clause, what enforces it and what does not (12 of
        the 12 newest).
      baseline: partial
      delta: same
    - property: EX3
      rating: partial
      evidence: >-
        Contracts are authored with their checks and each Class D contract must name a reader. Specification is still first
        written in Decisions and plans (Decisions 253 and 254 name unbuilt recommendations as their enforcement), and 13
        test modules bind to Decision text. Control: the evaluator-resolution gate fails a contract nothing reads (_population.py:315-357).
