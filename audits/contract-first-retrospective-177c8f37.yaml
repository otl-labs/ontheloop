    current_behavior: >-
      Turn capture writes a compact lifecycle row and no reader verb selects it: every derived verb filters session events
      on open, close or annotate. Of the 8 most recent plan-producing session trees, 3 carry workflow plan and 5 carry claude_code,
      so a filter on workflow would miss most planning cost. This audit joined merge-commit trailers to session keys instead,
      which works only for merged plans and includes whatever else the tree did; two of the eight trees ran 1,564 and 3,062
      model calls. Telemetry starts on 2026-10-20, so there is no observed 'before'. The static read-set is not reported
      anywhere. T3.14, the roadmap's context-budget metric, measures reachable source lines and is deferred.
    ideal_behavior: >-
      The cost purpose of the intervention has numbers an operator can read: first-time tokens per planning run, compactions
      per session tree and read-set bytes by band, each with a trend.
    gap: What governance costs a reader is measured only by an audit such as this one.
    compensating_controls_considered: >-
      telemetry_usage models --by-root gives tokens per tree (used here), and prose_context in the preflight report estimates
      the ambient load. Neither isolates a planning run, counts compaction or covers contracts and the index, so neither
      would show per-plan intake regressing.
    change_type: add
    proposed_change: >-
      Add a compact count to an existing session rollup verb; the rows are already written. Label a tree by the workflows
      it ran, not only by the one that started it, or expose plan merges as a join key in a verb. Report read-set bytes
      by band, with CFR-04.
    acceptance: >-
      A named verb returns compact events per session tree; for the 8 most recent plan merges the planning total read by
      workflow and the total read by trailer join agree, apart from non-plan work the trees declare; read-set bytes by band
      appear in one report.
    severity: medium
    severity_rationale: >-
      A purpose with no metric cannot show whether it holds. No decision was traced going wrong for lack of it, and the
      fix is small.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-insufficient
      item_ids:
      - T3.14
      dedup_search_terms:
      - compact compaction event telemetry rollup count session
      - planning context tokens per plan metric workflow attribution telemetry
      dedup_hit_count: 1
      note: >-
        recs_related raw totals 113 and 99; no recommendation owns compaction readability or per-plan intake (rec-5104 covers
        cost-state totals, a different measure). T3.14 is deferred_post_mvp and its criteria measure reachable source lines,
        import surface and orphans, not what a run reads; pulling it forward would not close this.
    effort: S
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
      note: >-
        Reader-verb and report changes only. Whether telemetry labels sessions correctly was not audited; this is about
        what can be read.
  - id: CFR-08
    surface: contracts
    question: Q3
    dimension: VD2
    title: >-
      Evaluator resolution proves that something names the contract, not that the contract's rules are checked or that the
      reader is live
    evidence: >-
      E3-01 to E3-12; scripts/checks/contracts/_population.py:301-312, :315-357; .claude/skills/overseer/SKILL.md:3-4; scripts/checks/contracts/validate_git_ops_contract.py:51-60
    evidence_kind: observed
    current_behavior: >-
      All 53 Class D contracts declare an evaluator that resolves. Resolving means a registered check whose module holds
      the contract's basename as a string, or a file whose text contains it. In 12 samples the named evaluator would react
      to a breach of the sampled statement in 6: 2 checks assert it and 4 surfaces instruct an agent at a trigger. Three
      checks assert other content of the file, 1 reads structure only and skips unless the file changed, and 2 surfaces
      only mention the file. One of those is docs/contracts/overseer-dispatch.yaml, whose declared evaluator is a skill
      marked 'being retired; do not run'; the live instruction sits in the planning skill, which is not the declared evaluator.
      docs/contracts/git-ops.yaml, 54,340 bytes of procedure, resolves through a 65-line check that asserts its path list
      and that AGENTS.md points at it. Nothing records which statements of a contract are enforced, which are instructed
      and which are neither.
    ideal_behavior: >-
      A contract says which of its keys a check asserts and which an agent is told to apply, and where; resolution fails
      for a surface that no workflow loads.
    gap: >-
      Binding is enforced at the level of the file. At the level of the statement it is unmeasured, and the agent_surface
      test cannot tell an instruction from a mention or a live surface from a retired one.
    compensating_controls_considered: >-
      The evaluator-resolution gate (_population.py:315-357) fails a contract that nothing names and passes a mention. The
      amendment-log and conformance-loss checks guard the file's shape. Coverage paragraphs on new Decisions cover Decision
      clauses, in prose. None fails when a contract statement has no enforcer.
    change_type: enforce
    proposed_change: >-
      Extend the evaluator declaration: a check evaluator lists the top-level keys it asserts; an agent_surface evaluator
      names its trigger text or anchor; resolution requires an agent surface to be listed as live in instruction-architecture.yaml's
      layers. Re-point overseer-dispatch.yaml. This is a thin first slice of T2.54 c1.
    acceptance: >-
      A Class D contract whose agent surface is absent from the live layer table fails the drift gate; the gate prints,
      per contract, the keys asserted, the keys instructed and the keys with neither; overseer-dispatch.yaml resolves against
      a live surface.
    severity: medium
    severity_rationale: >-
      Decision 168 claimed an evaluator that demonstrably reads the contract, and that holds for all 53. The finer property
      was never claimed; the gap is ambiguity with a clear fix, plus one stale evaluator.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-unbuilt
      item_ids:
      - T2.54
      dedup_search_terms:
      - agent_surface evaluator resolution mention basename Class D
      dedup_hit_count: 1
      note: >-
        recs_related raw total 102; no recommendation owns it (rec-4597 concerns a different hollow check). T2.54 (not_started,
        both criteria open) owns clause-to-check traceability for contracts, skills and AGENTS.md, and its c2 validator
        would make every contract clause name an enforcer.
    effort: M
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
      note: >-
        Mechanism only. Scope it to agent_surface evaluators first if declaring asserted keys for 41 check contracts is
        too much for one plan.
