  findings:
  - id: CFR-01
    surface: shared
    question: Q1
    dimension: VD1
    title: >-
      Routing controls record a claim but have not changed what a Decision carries: specification still lands in entries,
      and changing it mints another entry
    evidence: >-
      content_partition (mean_spec_share 74 against 65); E2-07 to E2-10 and E2-17 to E2-20; docs/contracts/decision-entry.yaml:398-441;
      .claude/skills/planning/SKILL.md:228-231; scripts/checks/decisions/envelope_rules.py:28-48
    evidence_kind: observed
    current_behavior: >-
      All 97 entries landed since Decision 167 claim numbered_decision, and the 12 newest clear the bar as written (10 on
      their own clauses, 2 only through an amends edge). Their content mix is the baseline's: 41 percent specification and
      16 percent change-record by bytes, a spec_share of 74 under the pinned block rule and 64 if every Problem paragraph
      counts as rationale, against 65. In the four newest contract-changing commits that add an entry, the entry still carries
      specification (three state more than the commit put in any contract, one restates it), exactly as in the four newest
      before the intervention. The routing rule has five rows and none sends mechanism specification to a contract. The
      planning skill's why-not-a-contract test is answered on structural grounds in 40 of 97 envelope justifications: 31
      say a contract or annotation cannot amend, widen or reverse a ratified clause, and 13 that a contract records a mechanism
      and not the authority for it. Because earlier entries hold specification, each later change to it needs another entry:
      81 of the 97 amend an earlier one, and 1 supersedes one.
    ideal_behavior: >-
      A new entry states the ruling, why it was chosen over the alternatives and what would reverse it, and points at the
      contract or config key that holds the obeyable specification: the sets, thresholds, schedules and procedures. It says
      who may change that key and within what bounds, so that a routine change is a contract amendment and a change of direction
      is a new Decision.
    gap: >-
      Spans corpus and routing_gates. Nothing in either can fail when an entry carries specification: the claim has one
      admissible value in practice, the gate tests ask for a reason and accept a structural one, and no routing row names
      the destination.
    compensating_controls_considered: >-
      The significance claim (envelope_rules.py:28-48) fails a missing claim or a never-numbered row, so it passes every
      specification-bearing entry. The planning-skill tests (SKILL.md:222-236) are met by naming a rejected home; 8 of the
      12 newest name one and all 12 still mint. Plan-critique step 12p (plan-critique SKILL.md:87-90) leaves no verdict
      per entry, so it cannot be shown to have changed an outcome. The per-entry cap bounds bytes, not content. Class D
      contracts receive the specification beside the entry (E2-18) and do not take it out. None exercises the property;
      none would fail if the defect were real.
    change_type: add
    proposed_change: >-
      Forward-only, for new entries. (1) Add a mechanism_specification routing row whose home is the owning Class D contract
      or config key. (2) Let a clause delegate: it states the ruling and the bounds, names the key that holds the values
      and names the change rule for that key (contract amendment for mechanism, operator approval for direction). (3) Have
      the conformance check fail a new entry whose only ruling is a change to a key an earlier entry delegated. (4) Record
      plan-critique's step 12p verdict per drafted entry in gate_rounds. Entries that predate the rule are untouched and
      still change by Decision. One amendment to Decision 167, taken together with CFR-02.
    acceptance: >-
      Over the next 20 new entries the mean spec_share under this audit's partition rule is 45 or lower; a fixture entry
      that only changes a delegated key fails --pre; every plan that drafts a Decision carries a recorded step 12p verdict.
    severity: high
    severity_rationale: >-
      Two of the intervention's four recorded purposes are routing purposes, and none of the four like-for-like measures
      moved the intended way. The consequence traced is structural: specification in entries makes amendment the way the
      corpus grows (81 of 97), which feeds the index every plan reads and leaves the same rule in two places. No control
      can fail on it.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-insufficient
      item_ids:
      - rec-3023
      - rec-3682
      dedup_search_terms:
      - decision entry specification routing contract body content
      - amends chain Decision clause delegate contract amendable threshold exact set
      - significance bar entry count stock guard decision inflow rate
      dedup_hit_count: 2
      note: >-
        recs_related raw totals 175, 130 and 44. rec-3023 (open since 2026-08-04, High, in no plan) owns the subject; its
        acceptance is that a body_content key exists in decision-entry.yaml and a check named validate_decision_entry_shape
        is registered, which can be met without giving specification a home or ending amend-by-new-entry. rec-3682 owns
        the cap's signature. The earlier audit's CFG-07 is the same defect and is not an owner.
    effort: M
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
      note: >-
        Needs an operator ruling: it amends Decision 167 and adds a routing row. The routing-consistency lint rejected on
        2026-08-17 is not re-proposed; this is a different mechanism.
  - id: CFR-02
    surface: corpus
    question: Q5
    dimension: VD4
    title: The per-entry byte cap works as a target, and what it squeezes is the rationale
    evidence: >-
      metrics.cap; content_partition; scripts/checks/decisions/validate_decisions_size.py:66-90, :93-155; docs/contracts/decision-entry.yaml:565-598
    evidence_kind: observed
    current_behavior: >-
      Of the 94 entries that first appeared after the cap was armed on 2026-08-13, 47 landed within 5 percent under 6,144
      bytes, 28 within 50 bytes and 54 in the top 512 bytes; none landed over. The cap is blind to content, and the fixed
      parts of an entry have grown (the envelope averages 545 bytes, 635 in the newest band; a Coverage paragraph and a
      reversal stanza are now usual), so the discretionary part gives way. Entries with a Rationale section fell from 74
      percent (Decisions 140-166) to 41 percent (231-267), the section's median from 999 to 463 bytes, and 11 of the 34
      newest entries carry neither a Rationale section nor any rejected-alternative text. Growth after landing is outside
      the cap: 70 of 97 entries are larger now, 49 are over 6,144 bytes, and additions to landed entries were 22 percent
      of P2 byte inflow. Two WARN lines meter that channel; live entries over 1.2 times the cap went from 23 to 37 in P2
      with no recorded response.
    ideal_behavior: >-
      The size instrument presses on what the routing rule wants out of an entry, specification and landing narrative, and
      protects what a decision record is for: why this choice, what was rejected, what would reverse it. Entry sizes spread
      below the limit instead of piling at it.
    gap: >-
      A byte cap on the whole entry cannot tell rationale from specification, so while specification is not routed out (CFR-01)
      the cap is paid in rationale. The after-landing channel has a meter and no response.
    compensating_controls_considered: >-
      The WARN accretion legs (validate_decisions_size.py:93-155) report and never fail; the count they report rose 61 percent
      in P2. Plan fork records (docs/contracts/overseer-dispatch.yaml:412) keep rejected options in the plan file, which
      is reached from an entry only through the commit that added it, and one sampled plan keeps its consult evidence outside
      the repository. Reversal stanzas preserve the reversal half. None restores rejected alternatives to the record a reader
      retrieves by number, and none would fail if they were absent.
    change_type: retune_gate
    proposed_change: >-
      Change what the cap measures, not its value. Count the Problem, the Decision clauses and the Coverage text against
      the limit; leave the envelope, a rejected-alternatives block and the reversal stanza outside it (tests/fixtures/decision_entry.py
      already separates trailing annotations). Require a rejected-alternatives line, or 'none considered', on new entries.
      Add an optional envelope field naming the plan slug. Decide in the same amendment whether sustained standing pressure
      flips the amendment-delta leg, as decision-entry.yaml's flips_to_hard_fail_when already allows.
    acceptance: >-
      Of the next 20 new entries at least 16 carry a rejected-alternatives block and fewer than 5 land within 5 percent
      of the limit; a fixture entry with no rejected-alternatives line fails --pre.
    severity: medium
    severity_rationale: >-
      The cap does bound bytes per new entry, so the guarantee it was installed for holds. The side effect is measured and
      has a clear fix; the loss is partial (two thirds of the newest entries still record a rationale or rejected options)
      and plan files keep the forks.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-insufficient
      item_ids:
      - rec-3682
      - rec-4744
      - rec-3179
      dedup_search_terms:
      - per-entry cap rationale rejected alternatives compressed entries
      dedup_hit_count: 3
      note: >-
        recs_related raw total 165. rec-3682 (open since 2026-09-07, Medium, in no plan) owns the Goodhart signature; its
        acceptance is a WARN on file:line citations and dense measurement blocks plus computing Decision 167 condition (a),
        which addresses neither the pile-up nor the loss of rationale. rec-4744 and rec-3179 own two wording gaps in the
        cap's contract text.
    effort: S
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
      note: >-
        The cap's instrument is on the open-to-challenge list and is the operator's to change. Best taken in the same amendment
        as CFR-01.
  - id: CFR-03
    surface: read_path
    question: Q2
    dimension: VD3
    title: >-
      The index the decision scout reads in full on every round grows with every entry: up 56 percent in 65 days, with no
      bound and no owner in progress
    evidence: >-
      metrics.planning_context_footprint.static; .claude/skills/decision-scout/SKILL.md:28; scripts/decisions_index.py:107;
      docs/ROADMAP-PLATFORM.yaml item T4.24 criterion c7
    evidence_kind: observed
    current_behavior: >-
      docs/decisions-index.json is read whole by a fresh decision-scout sub-agent on every scout round, 1.56 rounds a plan
      across the 111 plans that record rounds. It was 110,608 bytes on 2026-08-07 and 119,191 on 2026-09-12 and is 186,329
      now, about 46,600 tokens a round; each entry landed in P2 added about 880 bytes. Decision 179 clause 1 removed its
      byte pin and clause 5 accepted the unbounded read as a residual owned by T2.56 c1 and T1.5 c1. T2.56 c1 was met without
      touching the index, T1.5 is not started, and T4.24 c7, which now names itself the owner, is deferred post-MVP. The
      gate sub-agent band of the planning read-set is up 68 percent since 2026-08-07.
    ideal_behavior: >-
      What a planning run takes in to triage decisions does not rise with the number of entries: the scout loads slim rows
      or queries by tag, and fetches excerpts only for the entries it shortlists.
    gap: >-
      The entry file is retrieved by identifier; its projection is still loaded whole. Nothing bounds or meters the projection,
      and the condition that watched it closed by its own wording on 2026-09-12.
    compensating_controls_considered: >-
      The 320-character excerpt cap (scripts/decisions_index.py:107) bounds a row, not the total. Skeleton rows for archived
      entries cost a third of a live row, and no entry has been archived since before the intervention. A one-million-token
      window makes the read affordable today; it does not make it flat. None fails when the index grows.
    change_type: rescope
    proposed_change: >-
      Pull rec-3250 forward instead of waiting for T4.24: slim rows loaded whole (number, title, currency, tags, edges)
      and excerpts fetched for shortlisted entries only. Emit skeleton rows for compacted stubs as well as archived entries.
      Restate Decision 179's index condition as a measured threshold (condition_reviews).
    acceptance: >-
      The bytes a scout round loads whole fall below the 2026-08-07 figure of 110,608 at today's entry count; tests/test_decisions_index.py::TestSlimIndex
      passes (rec-3250's own acceptance); the scout still reports Decisions triaged N of M with N equal to M.
    severity: medium
    severity_rationale: >-
      Unmetered growth with a clear fix. The cost traced is about 46,600 first-time tokens a scout round today on a linear
      trend of about 1,030 bytes a day; no wrong triage was traced, so this is cost and not a wrong-but-trusted outcome.
