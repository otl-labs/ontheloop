      gate that Decision 82 replaced the same day; Decision 88''s compaction invariant, written for catalog egress and never
      checked against the files a read opens; and the 2026-10-18 measurement that recorded the reader''s cold elapsed p95
      at 90 s, attributed it to the catalog waking, and opened no item for it. Examined with evidence and accepted: the
      telemetry cold-read diagnosis of 2026-10-19 (0.135 s per file, serial), which shipped a typed deadline and compaction
      for telemetry only, and rec-5042 of 2026-11-09, which measured cold connect and deferred it. The quota raise the operator
      asked about was a chosen trade-off: agents had no AWS access, the durations were read from CloudWatch, the operator
      picked the REST API and 120 s, and follow-ups were filed. But the evidence was misread (the ops reader''s p99 of 109.7
