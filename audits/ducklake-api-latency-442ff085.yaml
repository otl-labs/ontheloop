  - q: Q1
    verdict: partially-decomposed
    basis:
    - LAT-01
    - LAT-05
    - LAT-10
    prose: 'Seven-day baseline, REPORT Duration, both transports mixed: 19,460 calls, 533 over 29 s (ops/reader 359, telemetry/reader
      167, telemetry/writer 5, ops/writer 2). Two phases carry them. (1) First touch of a table''s data files. On ops/reader
      a new environment''s first statement costs 87.0 s at p50 (n=300) against 11.3 s of connect; setting it to zero would
      bring 242 of the 359 slow calls under 29 s, setting connect to zero only 30. The other 105 slow calls are on reused
      connections and occur in young environments (167 of 176 reused calls over 10 s fall in the first 15 minutes of an
      environment). What the function is doing: opening the table''s Parquet files on S3 one request after another on one
      DuckDB thread and keeping the bytes in that connection''s memory. Probes on one environment, same connection state:
      a metadata-only count answered in 81 ms as the first statement after a reconnect (so loading catalog metadata is not
      the cost); a point read of one recommendation took 5.6 s; the same row through the batch verb, which cannot prune,
      took 84.1 s; count_by_status took 96.4 s and 0.58 s when repeated; a second verb needing two other columns paid 30.3
      s more; the 238-row decisions table took 16.8 s. A forced reconnect repays the whole cost, so the cache is per connection.
      Merge passes do not explain reused-path slowness (0 slow calls in 266 calls made in the hour after a merge in environments
      older than 15 minutes). (2) Connect on a new process: 11.3 s p50 on the readers, 14.0 s on the writer, about 15.9
      s on the telemetry writer. On one writer environment the phased probe measured attach 15.5 s on a cold process and
      0.49 s on the warm process seconds later, with the catalog 2-4 ms away (TCP) and 16-33 ms to authenticate: the time
      is import and extension loading in the process, not the catalog. Lambda init is 0.2 s. Outside the function every
      call pays about 0.5 s of route lookup (SSM) and about 0.45 s of transport, which is 0.95 s around a 0.26 s warm read.
      Not decomposed: which step inside the 10-15 s cold connect takes the time and why the 3,008 MB functions are slower
      than the 1,024 MB ones (no step timers; rec-5042 step 1 would settle it); which verbs the telemetry reader''s 167
      slow calls are (no verb on its line; rec-4706); and one 41.7 s commit on a reused telemetry-writer connection. Hence
      partially-decomposed. Addendum: how many files each table holds was unread during the audit and has since been read
      by the operator: 580 data files and 563 delete files in the recommendations current table (1,143 objects for a full
      read, about 84 ms each), 91 and 80 in the decisions one.'
  - q: Q2
    verdict: avoidable-by-tuning
    basis:
    - LAT-01
    - LAT-02
    - LAT-05
    prose: 'ops/reader drives the verdict: it has 359 of the 533 calls over 29 s and all 12 timeouts. Its slow calls are
      not slow because the work is large: the answers are a few hundred bytes to a few kilobytes over a table of 3,880 rows,
      and the same statements take 0.1-0.8 s once the bytes are cached. The time is the number of files opened serially.
      If the current tables were kept to a bounded number of files (OPT-01, no monthly cost) the model leaves 0 of the 359
      over 29 s; raising DuckDB threads alone (OPT-02) leaves about 178. ops/writer (2) and telemetry/writer (5) are over
      29 s only through cold connect; a cold-start row removes them bar one unexplained 41.7 s commit (keep-warm about 0.2
      USD a month, snapshot restore about 32 USD a month at US East rates). telemetry/reader (167) is estimated to fall
      to about 30 with more frequent compaction and parallel reads; that estimate is verb-blind and HYPOTHESIS. So 120 s
      is not inherent to this workload. It is also not holding: the ops catalog''s after-merge file count rose from 807
      to 944 in 14 days without ever falling, the slowest first statements rose from 103.5 s to 109.0 s, and the limit they
      must fit is 120 s minus 11.3 s of connect. Twelve reads hit the 120 s function timeout in the last 7 days (all of
      them since 2026-11-11), including one in this session''s own preflight whose retry finished in 117.97 s.'
