  optimisation_inventory:
  - id: OPT-01
    finding: LAT-01
    mechanism: 'Bound the live data files of the ops current tables: a scheduled rewrite of files that carry deletes, run
      with an explicit low delete threshold, followed by the existing merge (or a periodic rebuild of the current projection),
      with a per-table live-file ceiling asserted by control_health.'
    kind: tuning
    alternative_group: ops-first-touch
    routes:
    - ops/reader
    paths_affected:
    - new_env
    - fresh_connection
    - reused_connection
    - failure
    serves: both
    est_saving:
      p50_ms: 63906
      p95_ms: 102429
      basis: 'Baseline ops/reader: every statement over 5 s (451 calls) is taken as first touch and assumed to fall to 3
        s once a full read opens about 16 objects instead of 1,143 (580 data files and 563 delete files, operator-run read
        of 2026-11-15; 8 buckets after). Sum 3,795 s a day plus 201 s for the 12 timeouts. Slow calls: 347 with phase data
        plus the 12 timeouts, assumed to be the same first touch. The file counts are measured; the time after compaction
        is not. The rewrite''s default threshold of 0.95 would skip these files, which are 38 percent superseded on average
        (https://ducklake.select/docs/stable/duckdb/maintenance/rewrite_data_files via search).'
    calls_affected_share: 0.088
    est_daily_seconds_saved: 3996
    est_slow_calls_removed: 359
    effort: M
    monthly_cost_usd: 0
    cost_basis: A few seconds of maintenance Lambda time per pass.
    risk: high
    risk_note: 'Touches data layout: rewrites files and leaves the old ones to the weekly GC; needs the restore-drill and
      guard posture the existing GC has.'
    prerequisites: []
    owner_state: in-progress
    owned_by:
    - T2.18
    owner_delivers_saving: 'no'
    confidence: HYPOTHESIS
