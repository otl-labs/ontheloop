    prose: 'The main costs came from four decisions at which the latency consequence was not examined and two at which it
      was. Not examined: the June 2026 storage design, which replaced a read-time view with a materialised current table
      to spare reads a full scan of history and assumed, untested, that compaction would pay down the small files (one Parquet
