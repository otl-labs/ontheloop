      basis: []
    - question: Do client retries turn a slow dependency into a longer outage, and can a retried write duplicate?
      answer: 'Yes to both. A read that reaches the gateway timeout is retried up to twice: 366 s worst case for one logical
        read (3 x 120 s plus 6 s backoff). Observed: 9 retries after timeouts, each 101.6-118.0 s, so a recovered read costs
        about 227 s. A write is retried on a transport error or 502/503/504 when it carries an idempotency ULID or is update_ops:
        worst case 547 s. file_ops is replay-safe; a retried update_ops whose first attempt committed appends a second history
        version with a new ULID (the current row converges). No writer call came near 120 s in the sample (max 32.2 s),
        so the gateway path to that duplicate is not taken today; a lost response is.'
      basis:
      - LAT-07
      - LAT-02
    - question: With reads that can run 110-120 s, what bounds the number of concurrent catalog connections?
      answer: 'One warm connection per environment and slot, so connections equal live environments. The telemetry reader
        and writer have reserved concurrency 5 and both reached 5 in the week; the ops reader and writer have none and are
        bounded only by the stage throttle (20 requests a second), the account''s concurrency and the catalog''s connection
        limit. Observed maxima: reader 3, writer 2. A slow read also breeds environments: 21 percent of new ops-reader environments
        were created while another invocation was running. rec-5155 owns reserved concurrency (open).'
      basis:
      - LAT-05
    - question: Did the quota raise itself carry a cost or a risk?
      answer: 'Cost: none measured. Risk one, documented by AWS: raising the integration timeout ''might require a reduction
        in your Region-level throttle quota for your account'' (https://docs.aws.amazon.com/apigateway/latest/developerguide/api-gateway-execution-service-limits-table
        via search); I could not read the account''s quota, and the stage''s 20 requests a second sits far below any plausible
        value. Risk two, settled here: the egress proxy does hold a request for 120 s; it relayed the gateway''s 504 at
        120.0 s and returned a 117.97 s call. Risk three is the real one: the raise removed the symptom that would have
        forced a diagnosis while the cost keeps growing toward the new limit.'
