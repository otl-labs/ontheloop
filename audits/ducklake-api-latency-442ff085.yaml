      basis:
      - LAT-11
      - LAT-06
    - question: How likely is an agent session to meet a call over 29 s, and which flows would break at 29 s?
      answer: 'On the cutover day 6.5 percent of REST calls exceeded 29 s (gateway Latency p93 26.3 s, p94 33.0 s, n=661;
        p95 38.0 s), and 8 answered 5XX. A session that starts after more than five minutes of quiet starts cold with near
        certainty (70 percent of new reader environments follow such a gap), and its preflight then makes three calls over
        29 s: the decisions pull (32.6 s), the recs tally (120 s timeout, then 117.97 s) and the signal rows (33.0 s) in
        this session. At 29 s today the following fail cold: preflight''s recs inputs (after three attempts, since each
        retry starts a new environment while the first is still running), any full-table verb called first (count_by_status,
        open_recs_tally, recs_by_ids, recs_related), the decisions pull on the margin, telemetry window reads (new_env p50
        21.9 s, p90 66.5 s) and DQ checks. Point reads (rec_by_id, decision_by_id) and writes fit except on the slowest
        cold connects (writer new_env p95 26.5 s).'
      basis:
      - LAT-01
      - LAT-03
    - question: How do the main costs move as data grows, and is 120 s itself holding?
      answer: 'They grow with the file count and 120 s is not holding. Ops after-merge files: 807 on 2026-10-31, 944 on
        2026-11-14, monotonic, about 9.8 a day; telemetry 54 to 129. New-environment first statement on ops/reader: daily
        p50 between 80 and 94 s on 11 of the 13 days since 2026-11-02, daily maximum 103.5 s rising to 109.0 s. The first
        statement must fit in 120 s minus 11.3 s of connect. Timeouts at 120 s: 2 on 2026-11-05, then 2, 5, 0 and 5 on 2026-11-11
        to 11-14. The 9 immediate retries seen all succeeded, in 101.6-118.0 s. At 1 percent more files a day the typical
        first read of the recommendations table (88-96 s) reaches the limit in about two weeks (HYPOTHESIS, linear); from
        then the retries fail too and every cold session loses its recs signals.'
      basis:
      - LAT-01
      - LAT-02
    - question: Is anything in the record measuring the wrong thing?
      answer: Five things. The 2,000 ms gate measures warm writes to the smoke pair on pre-warmed containers, not a production
        read or a cold path. CommitLatencyMs is the whole write transaction including OCC retries, not the catalog commit.
        MergeOpsFilesAfterTotal is one catalog-wide total with no alarm on the ops series, so a 17 percent rise in 14 days
        was invisible and nothing records which table holds the files (580 of 949 are in one, by the operator's read after
        the audit). Every server-side latency (Lambda Duration, gateway Latency) omits about 0.95 s of client lookup and
        transport per call. And Decision 214's reversal clock was defined to start after a compute change that was never
        built, so 'no trigger has fired' (Decision 253) is true by construction while both budgets have been over since
        2026-10-18.
      basis:
      - LAT-08
      - LAT-10
    - question: 'Own question: does a slow read make cold starts more frequent?'
      answer: 'Yes. An environment serves one request at a time, so a 100 s first read occupies the only warm environment
        and the next caller gets a new one and pays its own connect and first touch: 69 of 335 new ops-reader environments
        (21 percent) were created while another invocation was running. Environments live 3 minutes at the median and 90
        of 335 served a single call.'
      basis:
      - LAT-05
      - LAT-01
    - question: 'Own question: does the planned verb consolidation (rec-4240) make point reads slower?'
      answer: 'Yes, as the batch verb is written today. rec_by_id filters with an equality the engine prunes on; recs_by_ids
        filters with list_contains over a split string and opens every file: 5.6 s against 84.1 s for the same row on first
        touch, 0.26 s against 0.81 s steady. update_rec''s fetch-before-update and the dependency check use rec_by_id today
        and rec-4240 would move them.'
      basis:
      - LAT-03
    - question: 'Own question: what did the path cost this audit session itself?'
      answer: Preflight took 322 s. A batched read of 23 recommendations took 116 s (new environment, 12.8 s connect, 100.8
        s first statement). Four of its first six ops reader calls exceeded 29 s. That is one session; it matches the post-cutover
        sample (35 of 484 ops/reader calls over 29 s, 4 timeouts).
      basis:
      - LAT-01
