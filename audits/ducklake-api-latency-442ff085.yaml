  architecture_challenges:
  - subject: engine
    concerns: both
    measured_share: 'Total: 9,531 s a day of function time, four routes, 7-day baseline. GROSS about 9,440 s a day (99 percent):
      connect 1,747 (which includes a small Python share I cannot split out), statements 7,486, and 206 of timed-out reads.
      NET about 2,630 s a day (28 percent of the same total) once OPT-01 (3,996), one cold-connect row (1,621), OPT-10 (1,192)
      are removed; OPT-01''s figure includes the timed-out reads. Method: sums of connect_ms and elapsed_ms minus connect_ms
      from the invocation lines; commit_ms on the telemetry writer.'
    verdict: keep_and_tune
    alternative: ''
    migration_cost: ''
    expected_gain: ''
    what_is_lost: ''
    rationale: 'The gross share is material and tuning removes about 70 percent of it. Both halves contribute. The table
      format and its use here (one Parquet file per write, a current projection maintained by delete plus insert, compaction
      that does not bound files) produce the first-touch cost; the query engine as deployed (99 MB of extensions loaded
      per process, one thread, synchronous file I/O in 1.5.4) produces the cold connect and makes the file opens serial.
      What remains after tuning is statement work of about 0.9 s per call on average, 0.1-0.8 s for reads and 1.4 s for
      writes, on tables of thousands of rows. That is high for the data size and would be milliseconds on a row store, but
      I do not judge the gain over tuning large enough to justify leaving Decision 84''s single backend: the tuned path
      would sit far inside any gateway limit. Revisit if, after OPT-01 and a cold-connect row, warm writes still exceed
      their 2,000 ms budget.'
    confidence: HYPOTHESIS
  - subject: runtime_language
    concerns: n/a
    measured_share: 'Same total, 9,531 s a day. GROSS between 80 and 160 s a day (0.8 to 1.7 percent): Init Duration 33
      s, first-call module work on a new environment about 0.25 s x 155 a day = 39 s, handler overhead about 3 ms a call
      = 8 s, plus an unmeasured boto3 import inside connect of at most about 77 s. NET about 15 s a day if a snapshot row
      absorbs init and imports. Method: Init Duration lines; connectionless describe Duration on warm (3 ms) and new (242
      ms) environments.'
    verdict: keep
    alternative: ''
    migration_cost: ''
    expected_gain: ''
    what_is_lost: ''
    rationale: The gross share is not material. The 11-15 s people attribute to Python start-up is native library and extension
      loading that any host language would pay.
    confidence: CONFIRMED
  - subject: compute_substrate
    concerns: n/a
    measured_share: Same total. GROSS about 1,780 s a day (19 percent) is work repeated per execution environment (connect
      plus init) because environments live 3 minutes at the median; first touch (about 6,000 s a day across the two readers)
      is also repaid per environment. NET about 160 s a day with one cold-connect row and OPT-01.
    verdict: keep_and_tune
    alternative: ''
    migration_cost: ''
    expected_gain: ''
    what_is_lost: ''
    rationale: Material, and removed by tuning rows that keep Lambda. A long-lived service would remove it too, at a standing
      cost several times the present bill; nothing measured calls for it.
    confidence: HYPOTHESIS
  - subject: sync_request_model
    concerns: n/a
    measured_share: 'No share of its own: the contract adds no time, it sets how long a caller may wait. 533 of 19,460 calls
      exceed 29 s today; an estimated 31 after tuning.'
    verdict: keep
    alternative: ''
    migration_cost: ''
    expected_gain: ''
    what_is_lost: ''
    rationale: Once first touch is bounded the synchronous contract fits with margin; an asynchronous contract would deliver
      the same wait in more calls.
    confidence: HYPOTHESIS
  process_trace:
  - date: '2026-06-04'
    artifact: Decision 81 clause 8 and its rationale (docs/DECISIONS.md:11842-11848,11868-11874); roadmap CD.33 / CD.34
      (docs/ROADMAP-PLATFORM.yaml:1256-1279)
    latency_evidence_available: No measurement. The Decision reasoned that 'latest per id' is unprunable, so deriving current
      at read time forces a full scan, and that the small files of a file-per-write design are 'a cheap, self-correcting
      cost paid down by daily compaction'. The durability concern was a catalog with about 6 h of point-in-time recovery.
    what_the_process_did: Replaced the earlier read-time view with a materialised current table written through on every
      write (INSERT history plus MERGE current in one transaction), one Parquet file per write, inlining off for every table,
      and left small-file growth to a scheduled merge.
    kind: unexamined-consequence
    bears_on_main_costs: 'yes'
    caught_today_by: ''
    note: 'Read cost was reasoned about, and soundly for a view. What was never tested is the assumption that compaction
      pays the files down: it holds for append-only history and fails for a table kept by delete plus insert, where the
      merge leaves every file that carries a delete (563 of 580 on 2026-11-15, operator-run read).'
