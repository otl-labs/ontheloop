# Spike: one audit prompt, six model runs, four blinded verifiers. Shallow evidence; see meta.evidence_strength.
spike:
  meta:
    kind: spike
    title: 'Model comparison: one audit prompt, six runs across five models, four blinded verifiers'
    date: '2026-11-05'
    audited_prompt: docs/audit-prompts/AUDIT-verdict-personas-on-actions.md
    audited_commits:
    - 66ab746e
    - b3044d78
    - 2b8c4326
    audited_commits_note: None of the files changed between the three base commits is in the audit prompt's Section 4 scope,
      and docs/ROADMAP-PLATFORM.yaml, docs/DECISIONS.md and the audited contracts are identical across them.
    evidence_strength: shallow
    evidence_strength_note: One completed run per model (two for DeepSeek), two harnesses (Claude Code and the Mistral Vibe
      CLI), no web access for any Vibe run, and Claude both as a contestant and as one of the four verifiers. Treat every
      finding below as HYPOTHESIS-grade direction, not measured fact.
    model_identifier_note: 'Claude runs are labelled by harness, not by model identifier: the session that composed this
      spike may not write a Claude model identifier into a pushed artefact (the same rule made #1861 withhold its own).
      The non-Claude models are named because they are the subject of the spike.'
    operator_question: Can models far cheaper than Claude execute a hard, self-contained repository audit, and verify one,
      well enough to take on gate roles such as decision-scout and code-review?
    method:
      audit_runs: 'Each model executed the audit prompt as written (Vibe runs added a one-line waiver of Section 5 step
        0, the hook canary, because this repository''s Claude Code hooks do not run under Vibe). Vibe ran with an explicit
        shell allowlist, never auto-approve, because auto-approve bypasses Vibe''s own denylist. AWS stayed reachable for
        preflight and live rec dedup, as it was for the Claude run. Session journals were checked afterwards: no run filed
        or updated a rec or called ops_data_portal, aws or gh.'
      verification: 'The 13 findings that runs raised beyond the 18 candidates (blinded as runs P/Q/R/S) and the 8 candidates
        the runs disagreed on (neutral prompt wording only, no run''s verdict) were judged by four verifiers: a fresh-context
        Claude Code subagent (benchmark, different harness) and GLM 5.3, DeepSeek V4.1 Flash and Kimi K3.1 Pro under an
        identical read-only Vibe setup. Blinding: local audit/* branches and refs were deleted and git fetch and arbitrary
        Python were denied, so no verifier could read any run''s deliverable.'
      scoring: Claim verdicts score SUPPORTED=3, PARTLY=2, ALREADY-OWNED=1, NOT-SUPPORTED=0; self-preference is a verifier's
        mean for its own model's run minus the other verifiers' mean for the same run.
  findings:
  - id: SPK-01
    title: DeepSeek V4.1 Flash executed the audit comparably to models far more expensive than it
    confidence: HYPOTHESIS
    evidence: 'DeepSeek run 2 (#1877) produced 4 findings beyond the candidates (verifier consensus: 1 SUPPORTED, 3 PARTLY),
      31 evidence path:line anchors all resolving (the Claude run had 33), a 22-package work breakdown and live rec dedup,
      in 22 minutes, autonomously, for about USD 0.18 at list price. The Claude run''s list-price equivalent was about USD
      28 (about 155x); GLM 5.3 and Mistral Large 4 cost USD 3-4 and produced no beyond-candidate findings. Its gaps: one
      contested candidate call (C12), some inflated severities, and an independent ''critical'' rating on C2 that no other
      run gave.'
  - id: SPK-02
    title: Only the Claude run produced a material finding beyond the candidate list
    confidence: HYPOTHESIS
    evidence: 'CL-01 (#1861 VPA-04: the code-review flip moves review behind a draft-PR push that the full-tier handoff
      gate guards) is the only finding all four verifiers rated material. The Claude run also had zero clear misses on the
      disputed candidates and used its 12 web lookups. Depth of original thinking, not breadth or citation accuracy, is
      where the expensive model led.'
  - id: SPK-03
    title: Verifiers lean towards their own model's work, even blinded
    confidence: HYPOTHESIS
    evidence: 'Self-preference deltas: DeepSeek +0.58 (run Q) and +0.33 (run R), Kimi +0.17 (run S), Claude -0.11 (run P).
      Every verifier that had a run of its own named that run strongest in its prose summary; GLM, the only neutral verifier,
      named P and S. The same pattern showed in candidate rulings (GLM rejected C12 as its audit did; DeepSeek called C15
      planned-insufficient as its run 2 did). Samples are 2-4 claims per run.'
  - id: SPK-04
    title: A second model surfaced every disagreement that mattered
    confidence: HYPOTHESIS
    evidence: Single judges split on sequencing-relevant calls (C12, C15, CL-05); exact claim-verdict agreement between
      verifier pairs ranged from 6/13 to 9/13. One judge alone would have settled each split silently.
  - id: SPK-05
    title: 'Judges differ in strictness: GLM is lenient, Claude is strict, DeepSeek sits in the middle'
    confidence: HYPOTHESIS
    evidence: GLM never returned NOT-SUPPORTED and never rated a severity too high; the Claude verifier rated six too high
      and two NOT-SUPPORTED. DeepSeek agreed most with the other three (24/39 claims, 23/24 candidates), partly because
      it sits between them. As auditors, Mistral Large 4 was the most lenient (S2-S4 'strong', 'complete and dispatchable')
      and GLM the harshest (S2-S4 'nascent').
  - id: SPK-06
    title: Kimi K3.1 Pro is slow and carries procurement friction
    confidence: OBSERVED
    evidence: 'About 55 s per step against about 7 s (DeepSeek) and 11 s (GLM) on the identical verification task; single
      calls ran past 300 s (one was cut by this container''s agent proxy restarting). Business purchase needs a UK VAT number
      (credits were bought personally); rate limits are tied to cumulative top-ups (Tier 0: 1.5M tokens a day, which stopped
      the first attempt; Tier 1: 2M tokens a minute, which caps concurrent large-context agents); the published terms say
      a risk-control restriction ''cannot be lifted'' once triggered. Mistral and DeepSeek took a prepaid key with no friction
      and hit no rate limit across about 70M tokens.'
  - id: SPK-07
    title: Cost is dominated by re-sent context, so steps x context size and the cached-input price decide it
    confidence: OBSERVED
    evidence: About 60% of each Mistral bill was cached input; DeepSeek's cached-input price (USD 0.003 per 1M off-peak)
      is what makes it cheap. On the Claude run, 1-hour cache writes were 60% of the list-price equivalent, and a follow-up
      after the 1-hour cache expired re-wrote a 610k-token context at 2x input price (about 30% of that session's total,
      zero output).
  direction:
    operator_conclusion: 'The significant finding is SPK-01: DeepSeek can perform comparably to models significantly more
      expensive than it. That supports DeepSeek taking on gate roles such as decision-scout and code-review, run alongside
      Claude for comparison, with work to cover its limitations.'
    fit_with_existing_design: 'This is the path the roadmap already designs: T4.28 (code_reviewer), T4.29 (plan_critic)
      and T4.30 (decision_scout) add Actions verdict personas on DeepSeek via LiteLLM and dual-run them against the in-session
      Claude gates before any flip (Decisions 205, 229). The spike is early evidence for that direction, not a new commitment.
      It also fits the repository''s model-portability stance: Decision 43 sizes files because ''monolith files degrade
      LLM execution quality'', and Decisions 128 and 130 hold the 500-SLOC limit ''load-bearing for model portability''
      because ''lower-tier models (Sonnet/Gemini/Deepseek) degrade on comprehension''.'
    limitations_to_cover:
    - 'Self-preference (SPK-03): do not let one model verify its own drafts alone on key calls (see rec-4948, framed as
      encouragement).'
    - Severity inflation and occasional missed controls written into the very criteria cited (DeepSeek run 1 CL-05, CL-06).
    - 'Depth: beyond-candidate findings were real but mostly PARTLY; the one material original finding came from Claude
      (SPK-02).'
    - 'No web access in these runs: external facts (pricing, capabilities) were answered from model knowledge.'
    - 'Harness sensitivity: command spelling, compaction summaries and long calls broke Vibe runs (harness_lessons).'
    not_a_decision: Under docs/contracts/decision-entry.yaml significance.routing_rule this is evidence, not a durable commitment.
      If a model-role policy is adopted later, that would be the Decision, citing this spike.
  recommendations_filed:
  - id: rec-4943
    priority: High
    title: T4.28 code-review flip moves review behind a draft-PR push that the full-tier handoff gate guards
  - id: rec-4944
    priority: Medium
    title: Verdict check runs have no designed path for a human override of a failing scout or critique verdict
  - id: rec-4945
    priority: Medium
    title: Flip items' files_in_scope omit coordinator.yaml and capabilities.yaml that the flips must change
  - id: rec-4946
    priority: Medium
    title: Scout verdict is not recomputed when a Decision a plan cites is amended on main
  - id: rec-4947
    priority: Low
    title: Actions verdict runtime has no egress-deny criterion, unlike the local sandbox adapter
  - id: rec-4948
    priority: Low
    title: Encourage a second-model opinion on key forks before an operator rules
  harness_lessons:
  - Vibe's --auto-approve skips its own command denylist (journal approvalSource 'bypass'); use an explicit allowlist.
  - 'Vibe''s allowlist matches by exact prefix plus a space: ''git add audits/'' never matches ''git add audits/<file>'',
    and ''git -C <path>'', ''timeout N <cmd>'' and absolute interpreter paths each need their own entry.'
  - 'Vibe does not check the command wrapped by ''timeout'': allowing bare ''timeout'' allows anything.'
  - Vibe's web search is a Mistral-hosted connector; enable_connectors=false (needed to drop an account GitHub connector)
    also removes web search.
  - 'Vibe''s context compaction can mislead a model: Kimi read a compaction summary as an instruction that did not exist.'
  - Long single model calls (300 s or more) can be cut when the container's agent proxy restarts (server_draining).
  - A malformed tool call (arguments as a string) can crash Vibe 3.1.0 and poison the saved session so that resume replays
    the crash.
  - Claude Code transcripts now record hook commands as 'command hook N' labels; the turn-capture project_ref pin reads
    the command string, so capture deferred for every session observed (handed to a separate investigation; no rec filed
    by this spike).
