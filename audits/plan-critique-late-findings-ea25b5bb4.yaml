  - q: Q3
    verdict: no_safe_rule
    basis:
    - I04
    - I09
    - I14
    - I15
    - I20
    - I22
    - I26
    prose: 'see blocking_rules. None of R1, R1v, R2, R2v, R3 is safe for the late group: each demotes at least one CONFIRMED
      core-mattered item. R1 and R1v (ship wrong behaviour) miss what is not build behaviour: a post-deploy step that cannot
      pass (I22), rollback text (I14, I20), a refused closing call (I26), and for R1 approved wording (I04). R2 and R2v
      fail worst: ''CI and the verification plan would catch it'' is true of I09 and I15, but only after merge. R3 comes
      closest: it keeps 10 of 11 core items blocking and demotes only I26, which a one-line build note covers (safe_with_notes
      yes); on the narrow reading of clause (iii) it also demotes I22. No rule is safe only from a given round: the demoted
      core items sit at rounds 3 to 5. Excluding always_ask_surface items changes no verdict (I14, I22, I26 are not on such
      a surface); excluding diff_inferred items changes none either (I04 and I09 drop out; I14, I22 and I26 are still demoted).
      RX, written after the traces and therefore fitted to them, demotes no core item on this sample and blocks 13 of 30;
      it is a proposal to test on a fresh sample, not a result.'
  - q: Q4
    verdict: some_recurring
    basis:
    - I17
    - I18
    - I31
    - I32
    - I33
    - I35
    - I39
    prose: 'see deterministic_checks. 7 of 40 items were mechanical (2 of 30 late, 5 of 10 control). Three finding types
      recur: a test file the build must touch has no scope row (I18, I33), VP command shape (I32, I39), and pins or size
      headroom (I17, I31). None of the seven is core-mattered; I18 and I33 would have forced a plan amendment at build.
      The plan lint already reports two of the properties as advisories (size headroom, undecidable acceptance) that critics
      then re-raise as blocking. I35 (closure steps) is mechanical too but stands alone in its type; its better remedy is
      to stop asking plans to restate the build skill.'
  - q: Q5
    verdict: 'yes'
    basis:
    - I04
    - I05
    - I08
    - I11
    - I25
    prose: 'Q5a: yes. Two of the 8 traced confirming-round items are core-mattered and CONFIRMED: I05, a sandbox defect
      that would have shipped, and I04, a change to approved wording. One more left a guard gap (I08); five changed nothing.
      Two of the eight (I01, I06) were defects written by the nit fixes applied after the preceding PROCEED, which is the
      case the confirming round exists for; both turned out harmless. Frame fact: 201 confirming rounds, 32 returned REVISE
      (16 percent), 159 returned PROCEED with nits again and 10 a clean PROCEED. What 8 items can and cannot say: the observed
      core share is 2 of 8 (Wilson 7 to 59 percent); had none mattered the one-sided 95 percent bound would still have been
      about 31 percent. The unit is one item per round, so a round''s yield can only be higher than its traced item shows.
      Q5b: of the 7 items from rounds 6 to 12, 4 were real and 2 core-mattered (I11 and I25, both fail-open holes in gate
      code); the other real ones are a guard gap (I08) and an elided API path the build had to settle (I12). Q5c: estimated
      core-mattered items per round are about 0.05 for a confirming round, 0.73 at round 3, 0.25 at rounds 4-5 and 0.29
      from round 6; the last band rests on 5 items and all four rest on row-level items, so read them as orders of magnitude.'
