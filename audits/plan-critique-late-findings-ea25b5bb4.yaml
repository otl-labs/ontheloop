    - I27
    prose: '11 of the 30 late-group items are in the core mattered set (CONF 2 of 8, LATE stratum 9 of 22); weighted by
      pool the share is 39.4 percent, the top of the ''some'' band (40 percent starts ''many''). No item is undeterminable,
      so the band does not depend on how unknowns are counted. The 11 are not alike: three are fail-open holes that would
      have shipped in gate code (I05, I11, I25); one more is the same kind in an unbuilt plan (I27); three would have failed
      only after merge and needed a code, IAM or plan repair (I09, I15, I22); one is a refused closing call the session
      re-issues (I26); two are rollback instructions that are wrong only if a rollback happens (I14, I20); one changed approved
      wording (I04), where the operator approves once after PROCEED either way. Leaving out I14, I20 and I26 the weighted
      share is 27.1 percent; counting only CONFIRMED core items it is 31.2 percent. Both stay in ''some''. The other 19
      late items: 15 no effect, 2 guard gaps, 1 caught by the build, 1 caught by a pre-deploy VP step with a plan amendment.
      Row-level selection pulls this share down: core items are 8 of 18 where a commit message named the item and 2 of 17
      where a diff row was drawn.'
    shares:
      weighted: 39.4% ((32 x 2/8 + 303 x 9/22) / 335)
      unweighted: 36.7% (11/30)
      late_stratum: 40.9% (9/22)
      extended_weighted: 48.8% (CONF 3/8, LATE 11/22)
      weighted_without_needs_operator: '38.4% (I04 removed: CONF 1/7, LATE 9/22)'
      weighted_without_always_ask: '31.7% (I05, I06, I13, I15, I20, I25 removed: CONF 1/6, LATE 6/18)'
