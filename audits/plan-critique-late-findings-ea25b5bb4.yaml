  - id: PCL-05
    origin: C3
    surface: S1
    question: Q5
    dimension: VD5
    title: 'The loop''s stopping rules do not see what drives late rounds: unread last nit fixes, a nit stream that never
      ends, an escalation that never fires'
    evidence: 'I01, I06 (blocking defects written by nit fixes applied after a PROCEED); frame at 79a6cd09: 201 confirming
      rounds, 159 PROCEED with nits; 2 escalated rows in 1,039; .claude/skills/planning/SKILL.md:412-414'
    evidence_kind: observed
    current_behavior: A PROCEED with nits leads to one confirming round; that round's own nits are applied and not re-read.
      Escalation needs a finding to recur at a recorded tag and anchor, a disputed blocking finding, or a fix that changes
      approved scope, tier or a cited Decision. No count caps the rounds.
    ideal_behavior: 'NS4: the loop ends when further rounds stop paying in consequence, and every edit that can change the
      build is read once.'
    gap: Nit fixes are a measured source of blocking defects (2 of the 8 traced confirming items, and one traced nit that
      changed behaviour), yet 159 of 201 confirming rounds end by applying a further batch that nobody reads. No harm from
      that batch was observed, and this sample could not show one. Nits stay near 4 to 5 per round to round 15 and blocking
      findings stop falling after round 4, so 'findings, not rounds' gives no signal that a plan has converged; 30 of 152
      plans ran 10 or more rounds. The escalation triggers fired twice in 1,039 rows, both in round 1, and not once in a
      21-round series, because late rounds bring a new finding on neighbouring text rather than the same finding again.
    compensating_controls_considered: Plan PR CI re-runs the fast tier on the final text, which guards schema and lint properties
      of the last nit batch but not its content. The build's own controls catch only what Q1 credits them with.
    change_type: retune_gate
    proposed_change: (a) After a confirming round, apply without re-read only nits that a diff test shows to be wording,
      citation or ordering (no change to a scope file set, a command, a selector, an expected literal or a number); any
      other nit fix is re-read or travels as a build note. (b) Add an escalation trigger on a third blocking finding against
      the same plan row or sidecar block within one series, so serial discovery reaches the operator. (c) Close the revisit
      clause with this audit's Q5 answer.
    acceptance: A plan whose post-confirming nit batch changes a command or scope row is re-dispatched (test on a fixture
      plan); the serial-discovery trigger fires on telemetry-session-ref-stability's rounds 5, 8 and 9 (three blocking findings
      on one approved sentence); the revisit sentence is gone from the planning skill.
    severity: medium
    severity_rationale: 'An unguarded window and two triggers that do not fire, with a clear fix. Not critical: no core-mattered
      item was shown to merge through the window, and the absence of such a case here is not evidence that the stopping
      rule is safe.'
    confidence: CONFIRMED
    roadmap_crossref:
      classification: novel
      item_ids: []
      dedup_search_terms:
      - confirming round nits re-read escalation convergence rounds
      dedup_hit_count: 0
      note: 'Two pages of recs_related on .claude/skills/planning/SKILL.md (16 returned of about 630): none owns the confirming-round
        or escalation rules. rec-5365 owns the revisit clause''s home; rec-3976 notes in passing that the oscillation interrupt
        fires only after the rounds are spent, and its remedy is a VP subject check. The roadmap''s OE-02 assumption (2
        cycles on average) is a context-surface note in Q7, not an owner.'
    effort: S
