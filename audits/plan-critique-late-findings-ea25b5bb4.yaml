audit:
  meta:
    audited_commit: ea25b5bb4
    base_branch: main
    model: withheld (session policy keeps model identifiers out of repository artifacts; see the commit trailer)
    methodology_version: 1
    scope_surfaces:
    - S1
    degraded_dedup: false
    pr_refs_unavailable: []
    unprocessed_samples: []
    contract_notes: 'No degraded mode: audited on branch audit/plan-critique-late-findings-ea25b5bb4 cut from origin/main;
      preflight and the rec dedup probe ran; all 50 PR refs fetched and all 40 fix commits resolved; all 40 samples and
      all 10 DD-B PRs processed; scripts.validate --pre was not run (optional). Every Section 11 row matched the repository
      row (round, verdict, blocking count). The frame re-derives exactly at 79a6cd09 (152 plan files, 1,039 plan-critique
      rows; REVISE pools CONF 32, LATE 303, CTRL 264; 201 confirming rounds). Conventions this run had to fix, each applied
      to every item: (1) Several sampled fix commits (at least samples 2, 9, 10, 11, 15, 17 and 33) also add a plan context
      line that lists the round''s B and N items, a naming source Section 9 does not list; items were still numbered from
      the three listed sources, and the context-line labels are recorded in item_note. (2) A diff_inferred item is one plan
      row. Where the selected row is the origin of a change copied into other rows (a rename), the copies are withheld with
      it (I10); where the selected row is itself a dependent copy, it is withheld alone and the later-rewrites rule then
      applies (I17). Row-level items understate their parent finding: for 17 diff_inferred items the diff yielded 3 to 22
      non-wording rows against row counts of 1 to 8, and several selected rows were probably critic nits. (3) Latent defects
      count as shipped when the defective artifact is on main and wrong as written for a reachable use, whether or not the
      triggering input has occurred: code holes (I05, I11, I25, I27) and rollback text read at an operator act (I14, I20).
      (4) I26 is caught_post_merge by the stage rule although the failure is a refused portal call that the build session
      re-issues; question_answers gives every headline share with I14, I20 and I26 left out as a sensitivity. (5) R3 clause
      (iii) is read to cover a verification that gives the same result whether or not its criterion holds (cannot fail,
      or cannot pass); the narrow reading changes I22 only. (6) C5 was judged on the 18 late items whose source is gate_rounds_annotation
      or commit_message; for I23 and I24 the message named more changes than the row counts as blocking. (7) meta.model
      is withheld by session policy. (8) DD-B: two follow-up commits without a body were classed from their subject and
      diff stat (samples 8 and 25); sample 30''s amendment window runs from the original plan PR #1982, so amendment #1999
      is inside it. (9) rec-5123, rec-5407, rec-3885, rec-3080, rec-5365, rec-3976, rec-5192 and rec-5125 were read by id
      through the reader for dedup and for I30; nothing was filed or updated.'
