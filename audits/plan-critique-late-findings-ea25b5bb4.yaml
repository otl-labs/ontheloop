  findings:
  - id: PCL-01
    origin: executor
    surface: S1
    question: Q5
    dimension: VD5
    title: No check is aimed at fail-open holes in plans that build or change a gate; the three sampled ones were caught
      at rounds 5 to 7
    evidence: I05, I11, I25 (CONFIRMED shipped_defect); I27 (HYPOTHESIS); I09, I15, I22 (caught only after merge); .claude/skills/plan-critique/SKILL.md:34-90
      (checklist items 6 to 12p)
    evidence_kind: observed
    current_behavior: The checklist asks about Decisions, scope breadth, acceptance, verification commands, obligations,
      closure, tier, size and graduation. Nothing asks, of a plan that adds or changes a guard (a hook, a check, an IAM
      statement, a sandbox, a size cap), which inputs it lets through unexamined. Such holes are found when one of the repeated
      full reads happens to see them.
    ideal_behavior: 'NS2 and NS4: a class of error with no downstream control is aimed at by a named check in the first
      round, so its detection does not depend on how many rounds the loop happens to run.'
    gap: 'Three sampled items are holes that would have shipped in gate code with no test, VP step or CI check to surface
      them: a probed command running as PID 1 of the probe sandbox (I05, confirming round 5), a size cap lifted by deleting
      one sub-key (I11, round 7), a secret name hidden behind command substitution reading as an approvable target (I25,
      round 6). I25''s text was in the first commit and five full reads passed over it; I11 and I05 were written by the
      fixes of rounds 5 and 3. Commit messages show the same class among items not drawn (samples 13, 18, 36, 38). A second
      class behaves alike but has a late control: a live step that cannot work under the identity or limits it names (I09,
      I15, I22), found at rounds 3 to 5 and otherwise failing only after merge. Any change that shortens the loop without
      aiming at these classes first would ship them.'
    compensating_controls_considered: Build code review and the persona verdict workflows are LLM judgement, not property
      checks (Q1 rule). The planned tests assert the plan's own rule set, so they pass with the hole present. The operator's
      word on the final diff of security code (I25's plan) is review, not a check that must fail. For I09, I15 and I22 the
      post-deploy step does fail, but after merge.
    change_type: add
    proposed_change: 'Add one checklist item, run in round 1 for any plan whose scope adds or changes a hook, a check under
      scripts/checks, an IAM or boundary statement, a sandbox or a governance cap: the critic lists each input form the
      guard decides on (unknown, malformed, substituted, grouped or indirect, a present key with a bad value) and states
      the outcome, and lists for each live VP step the identity and size limits it runs under; REVISE when a path passes
      unexamined or a live step cannot run as written. Keep the uncapped loop until this is in place.'
    acceptance: A seeded gate plan with a missing-sub-key hole and one with a live step its identity cannot run both get
      REVISE in round 1; over the next 20 gate-building plans, findings of this class first raised at round 4 or later are
      counted from the per-finding record (PCL-04) and fall against this sample's 3 in 30.
    severity: high
    severity_rationale: A core-mattered class that the gate catches only through repeated generic reads (rounds 5 to 7 for
      the three sampled cases, no checklist line aimed at it), and no property-matched control compensates for the three
      shipped_defect items.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: novel
      item_ids: []
      dedup_search_terms:
      - fail-open bypass guard gate security enumerate inputs
      dedup_hit_count: 0
      note: 'recs_related on .claude/skills/plan-critique/SKILL.md returned 8 of 557 with all 7 direct recs listed (direct_complete
        true); none owns the class. Near: rec-5125 (inputs a verification step reads need a producer), rec-4246 (Terraform
        plan review parity). No roadmap criterion, candidate decision or Decision header on the critique checklist''s coverage.'
    effort: S
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
      note: Independent; PCL-02 and PCL-05 should follow it.
  - id: PCL-02
    origin: C1
    surface: S1
    question: Q3
    dimension: VD3
    title: 'The blocking tag does not track consequence: 22 of 40 blocked items traced CONFIRMED to no effect'
    evidence: I01, I02, I03, I07, I10, I13, I16, I17, I19, I21, I24, I29, I30 (late); I31, I32, I34-I40 (control); .claude/skills/plan-critique/SKILL.md:18,156;
      blocking_rules
    evidence_kind: observed
    current_behavior: A finding blocks when it belongs to a class (correctness, safety, scope, a Decision conflict, a failed
      checklist check) or when the critic is unsure. Phase 1 also has the critic reject a plan whose closure steps do not
      spell out readiness, validator evidence, postflight evidence and push outcome.
    ideal_behavior: 'NS1: a finding blocks when leaving it unfixed would let a wrong outcome reach main undetected or needs
      the operator; otherwise it travels as a note.'
    gap: '13 of 30 late items (43 percent) and 9 of 10 control items have CONFIRMED counterfactuals outside the extended
      mattered set. The cause is not the ''when unsure'' default: 15 of 18 named late items fit a named class, and 6 of
      those 15 still had no core consequence. Class membership is the wrong test. The clearest case is closure-step completeness
      (I35, and blocking findings named in the commit messages, row comments or context lines of samples 10, 14, 26 and
      34): the text asked for restates the build skill''s mandatory Commit Flows, so its absence changes nothing built.
      Row-level selection inflates the no-effect count (17 items are diff rows), but among the 23 items a message or row
      comment named, 11 are CONFIRMED no effect.'
    compensating_controls_considered: 'None applies: a REVISE that predicts no consequence is not corrected downstream,
      because the planner fixes every finding either way. The harm is a blocking signal that cannot be used to decide when
      to stop.'
    change_type: retune_gate
    proposed_change: '(a) Have the critic write, for each blocking finding, what reaches main if it is left unfixed and
      which control would fail first, and tag from that answer (the RX wording in blocking_rules.rx_text) instead of class
      membership plus ''when unsure''. Run it in shadow beside today''s tag before switching, since no candidate rule was
      safe on this sample. (b) Stop blocking on plan text that restates the build skill: drop the closure-step line from
      the critic''s rejection list or make it a lint.'
    acceptance: On a fresh sample of at least 30 late REVISE rounds traced as in this audit, the new tag demotes no core-mattered
      item and the CONFIRMED no-effect share among blocked items is under 25 percent.
    severity: medium
    severity_rationale: 'Mis-sorting: more than a quarter of each group''s blocked items have CONFIRMED counterfactuals
      outside the extended mattered set; one finding, carried by the blocking rule.'
    confidence: CONFIRMED
    roadmap_crossref:
      classification: novel
      item_ids: []
      dedup_search_terms:
      - blocking nit consequence when unsure closure steps
      dedup_hit_count: 0
      note: 'Two pages of recs_related on the two skill files (16 returned of about 790): none owns the blocking rule. rec-5365
        owns giving the revisit clause a watched home, not its answer; rec-3082 concerns a static successor to the closure-obligation
        rule (12k), a different check.'
    effort: M
    depends_on:
    - PCL-01
    - PCL-04
    sequencing:
      safe_to_queue_now: false
      blocked_behind:
      - PCL-01
      - PCL-04
      note: Part (b) can go now. Part (a) needs the per-finding record to run the shadow comparison and the PCL-01 check
        so that demotion cannot lose the late class.
