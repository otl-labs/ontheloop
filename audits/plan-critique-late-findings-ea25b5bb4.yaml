  - q: Q6
    verdict: no_measurable_effect
    confidence: CONFIRMED
    basis:
    - B11
    - B30
    - B13
    prose: 'see build_rework. All 10 PRs classified. Two carry a plan_detail_wrong commit (B11: the taxonomy row the plan
      added did not fit a file at its size limit; B30: the sidecar''s ledger blocks lacked amendment rows), which is neither
      the three that would show detail causing rework nor the at-most-one that would support prevention, so the rule returns
      no_measurable_effect. What the rows do show: every test node the plans named in their first ten obligation rows exists
      verbatim in the build (40 of 40; another 29 rows name a file or a command), 6 of 10 builds are a single commit, and
      3 of 10 needed a plan amendment before they could merge (B11 twice, B13, B30), each over a size limit, a ledger pairing
      or a verification step''s run time, not over a judgement call. Named detail is used; whether it prevents rework cannot
      be measured without thin plans to compare.'
  - q: Q7
    answers:
    - question: 'Recall: did any nit-tagged change carry a core-mattered consequence, and are nit fixes a source of defects?'
      answer: 'Five nit changes were traced lightly. One would have mattered: round 5 nit N1 of bridge-teardown-end-record
        (only OSError-leaf groups count as teardown failures) changes behaviour; without it a grouped RuntimeError is reported
        as a teardown failure and the run keeps its result, with no test (HYPOTHESIS; it also superseded I40). One would
        have left stale rec titles (decision-census-rec-filing r3 N1). Three changed nothing or only when a test is selected
        (persona-image-python-line r3 N1; friction-signature-coverage r6 CLI refusal and tie order; telemetry-session-ref-stability
        r4 N3). Because the planner fixes every nit, a mis-tagged nit is still fixed; what it loses is a re-read. Nit fixes
        applied after a PROCEED did write blocking defects (I01, I06), both caught by the confirming round. The last batch,
        applied after the confirming round and not re-read, produced no defect seen here, and the sample (REVISE rounds
        only) could not have shown one.'
      basis:
      - I01
      - I06
      - I40
    - question: Does the escalation rule ever fire?
      answer: 'Almost never. The 40 sampled plans hold 363 plan-critique rows and one has escalated: true (actions-sha-pin-native-policy,
        round 1). The frame holds 2 in 1,039 rows, both at round 1. The longest series with none is sit-organization: 21
        rounds, 13 of them REVISE. Its triggers need a finding to recur at a recorded tag and anchor, a disputed blocking
        finding, or a fix that changes approved scope; late rounds instead bring a new finding on neighbouring text each
        time (three rounds on one sentence of approved wording in telemetry-session-ref-stability; one test sentence widened
        in three rounds of arrival-lost-window-author-date).'
      basis:
      - I08
      - I14
    - question: Can the gate's yield be measured from what the repository stores, and what is the smallest record that would
        help?
      answer: 'Only as counts. A row stores round, verdict, blocking and nits, written by the planner; 5 of the 40 sampled
        rows carry a comment and at least seven fix commits keep a B/N list in a context line instead. The critic''s own
        tags (blocking or nit, mechanical or judgement, anchor), which the skill requires, are not kept, so 17 of 40 items
        had to be inferred from diffs. The smallest useful record is one line per finding on the gate row, copied from the
        critic''s output: id, tag, kind, anchor (plan field path), named class, a subject of a dozen words, disposition.
        With it this audit''s item selection needs no inference and a rule change can be tested in shadow (PCL-04).'
      basis:
      - PCL-04
    - question: Do late items cluster on particular plan fields, and does that differ from the control group?
      answer: 'Late items sit mostly on scope rows (17 of 30), then verification_plan (6), rollback (2), and one each on
        acceptance_criteria, constraints, execution_steps, context and the sidecar. Control items split evenly: scope 3,
        verification_plan 3, execution_steps 3, test_obligations 1. Core late items sit on scope rows (6 of 11), rollback
        (2), and one each on a VP step, an execution step and the sidecar. By type, late items are approach or design (7),
        VP steps (4), invariants (3), test cases (3) and wording (3); control items lean to VP steps (3) and pins or sizes
        (2). With 10 control items this is a description, not a tested difference.'
      basis:
      - I04
      - I05
      - I09
      - I11
      - I14
      - I15
      - I20
      - I22
      - I25
      - I26
      - I27
    - question: Defects seen while tracing that no round flagged, or defects in context-only surfaces
      answer: '(1) Under-blocking, one case: scout-input-fingerprint''s first loop ended on a confirming PROCEED with its
        sidecar''s ledger blocks missing amendment rows; the wording check, the critique and the operator''s approval all
        passed, the build''s full tier failed, and amendment #1999 plus a second approval followed (rec-5123 and rec-5480
        own the wording-check blind spot). It was caught before merge, so it is not a core item, but it shows the loop can
        end with a build-stopping item open. (2) The plan lint reports size headroom and undecidable rec acceptance as advisories
        that planners left unresolved and critics then raised as blocking (I31; row comments of samples 14 and 16). (3)
        Three merged sampled plans still carry a VP command that masks its exit status (samples 9, 12, 34). (4) The roadmap''s
        operating estimate OE-02 assumes an average of 2 critique cycles and a worst case of 5; the frame''s median is 5.5
        rounds, its mean 6.8 and its maximum 21, with 30 of 152 plans at 10 or more. (5) I21: a late-round plan detail the
        build did not use (the check reads the manifest file directly, so the added glob names a file it does not depend
        on).'
      basis:
      - I21
      - I30
      - I31
    - question: 'Executor''s own: is the late tail self-inflicted?'
      answer: 'Partly. 17 of 30 late items (57 percent) sit in text that an earlier fix commit on the same PR wrote, against
        1 of 10 control items; 6 of the 11 core late items are among them (I05, I11, I14, I15, I26, I27). The loop is repairing
        its own repairs as much as it is finding what round 1 missed. The frame agrees: blocking findings fall from 4.0
        in round 1 to about 0.65 by round 4 and then stay flat to round 15, and nits stay near 4 to 5 per round throughout
        (5,794 nits against 1,418 blocking findings in the frame).'
      basis:
      - I05
      - I11
      - I14
      - I15
      - I26
      - I27
    - question: 'Executor''s own: what does the core mattered set hide?'
      answer: Its three labels cover unlike things. Of the 11 late core items, 4 are wrong behaviour or a missing guarantee
        on main with no control (I05, I11, I25, I27), 3 are post-merge failures needing a real repair (I09, I15, I22), 1
        is a post-merge call that fails loudly and is re-issued (I26), 2 are rollback text that matters only if a rollback
        happens (I14, I20), and 1 is approved wording (I04). A stopping or blocking rule should be judged against the first
        seven; the report gives the shares both ways.
      basis:
      - I04
      - I05
      - I09
      - I11
      - I14
      - I15
      - I20
      - I22
      - I25
      - I26
      - I27
