    prose: 'LATE stratum 9 of 22 core (40.9 percent) against control 0 of 10; the Newcombe interval for the difference is
      +8.0 to +61.3 points, wholly above zero, so the pinned rule returns late_higher_value. Treat it as ''no sign that
      late items matter less'', not as a measured gap: the verdict turns back to insufficient_evidence if I14, I20 and I26
      are not counted (6 of 22: -3.9 to +48.2), or if one control item is counted as core (-4.3 to +52.9), and I40 is no_effect
      only because a later nit on its PR superseded it. Round 1-2 fix commits also answer more findings at once (median
      2 blocking per row against 1 late), and half the control items are row fragments. About 30 items per group would confirm
      or refute a 25-point gap; about 70 per group would be needed to call the two similar within 15 points.'
