  findings:
  - id: RB-01
    surface: S1
    question: Q3
    dimension: VD3
    title: 'Core code locates the project from its own file location: no path-resolution seam separates the release-installed
      root from the project root (C4, C24)'
    evidence: 'scripts/checks/_common.py:23; scripts/roadmap/find_plan.py:22,58,65; src/persona_hosts/local_container/adapter.py:24,43-54;
      census: 89 files define a root constant, at least 85 definitions from Path(__file__); at least 305 files quote repository
      paths'
    evidence_kind: observed
    current_behavior: 89 scripts/ and src/ files define a module-level root constant and at least 85 definitions compute
      it from the module's own location. The same constant resolves shipped schemas (the settings registry read by a persona
      host), project instance content (plans, budgets, decisions) and the working directory for git. At least 305 files
      then join repository paths onto it. 202 test files patch such a constant at 1,130 sites.
    ideal_behavior: One resolver exposes a release root (package data), a project root (flag, then an OTL_ variable, then
      the git top level of the working directory) and a runtime root, with role-keyed accessors. No core module derives
      a project path from its own location.
    gap: 'An installed build would look for the adopter''s decisions, plans and budgets inside its own install directory
      and run git there. This blocks the released-version rule for everything outside a future kernel and turns each c12,
      c16 or c17 move into an edit of every reader. C24 holds for the constants only: one root must become two, so each
      of the 305 files'' reads has to be classified as shipped or project content. Also touches S2 and S5.'
    compensating_controls_considered: 'Many checks accept root: Path | None (validate_ports_contract.py:279) and tests inject
      fixture roots by patching constants: this exercises fixture reads per call and would not fail if production reads
      stayed bound to the install location. T4.24 c10 would expose the gap but is unbuilt.'
    change_type: add
    proposed_change: Add the resolver with defaults equal to today's layout; move scripts/checks/_common.py onto it first
      (209 of the 305 check files read through its ROOT); migrate one package per plan; add a ratchet check that fails a
      new file-location root or a new quoted repository path outside the resolver in a core_engine package.
    acceptance: A test imports one migrated check from a directory other than the project and passes against a fixture project
      whose contracts and config live under ontheloop/; the ratchet fails on a planted Path(__file__) root in a migrated
      package; the root-constant census is below 89.
    severity: high
    severity_rationale: 'This repository''s core code depends on private paths an adopter cannot have, and no built control
      redirects production reads (high class). The injectable-root pattern does not property-match: it would pass unchanged
      if the defect were real.'
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-insufficient
      item_ids:
      - T4.24:c3
      - T4.24:c9
      - T4.24:c12
      - T4.22:c5
      dedup_search_terms:
      - ROOT root resolution installed package wheel
      - repo root constant path resolution installed package project root
      dedup_hit_count: 2
      note: 'Owners of the outcome: T4.24 and T4.22 (kernel load rule, recorded assumptions, the ontheloop/ root). No criterion
        or rec owns a resolver. Raw returned: 167 and 216 open recs, none owning.'
    effort: L
    depends_on: []
    sequencing:
      slice_keys:
      - NEW-3
      - NEW-6
      - NEW-7
      - NEW-8
      - NEW-9
      safe_to_queue_now: true
      blocked_behind: []
      note: NEW-3 is behaviour-neutral and can be queued today; the package migrations follow it.
