    - RB-04
    - RB-08
    - RB-10
    - RB-16
    prose: 'Two properties met, seven partial, three missed. Met: layered on-demand agent instructions for this repository
      (E6) and justified suppression through cited raise markers (E8). Missed: one validated project configuration file
      with a doctor command (E2), customer zero through the public interface (E3) and overlays instead of forks (E5) --
      each has a recorded design and no built part. The partial rows rest on two built precedents worth generalising: the
      verdict shell that runs the default branch''s code over a snapshot of the change, and the digest-pinned persona image
      with an enumerated file list.'
    external_checklist:
    - property: E1
