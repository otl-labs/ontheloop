  release_classification:
    K01:
      verdict: split
      mechanism: 'core_engine: mechanism checks (contract shape, decision-entry conformance, ports, persona contracts, check
        accounting, verification registry mechanics). optional_profile: house-style enforcers (sloc/, prose/, glossary,
        the docs-root and scripts-root allowlists). repository_only: iam_tf/, lambda_pkg/, the Terraform, region and deploy
        checks in ci_guards/, licence and package-registry checks.'
      what_changes: Classify each check Entry (NEW-2); core and profile checks read through the resolver (NEW-7); profile
        checks take limits from shipped defaults and honour supersession (NEW-11); repository-only checks stay and keep
        reading this repository's files.
      cost: L
      rationale: Six sampled checks fall in all three parts; 162 of 305 files quote a repository path and all 195 registrations
        carry owner platform, so nothing separates the parts today.
      confidence: CONFIRMED
    K02:
      verdict: core_engine
      mechanism: Move the dispatcher and registry into the release package; manifests stay declarative and gain discovery
        of adopter and extension checks plus the release and enforces fields.
      what_changes: Entry gains release, enforces and why (NEW-2, NEW-10); dispatch resolves the effective decision set
        (NEW-11); the per-run scaffolds in validate.py that drive this repository's Terraform and Lambda steps stay behind
        as repository-only steps.
      cost: M
      rationale: The check runner is the enforcement half of the memory layer Decision 211 clause 7 lets an adopter install
        alone; scripts/checks/registry.py holds no repository content itself.
      confidence: CONFIRMED
    K03:
      verdict: split
      mechanism: 'core_engine: scripts/ops_portal/ and scripts/ops_data_portal.py (the work-item mechanism''s portal verbs,
        Decision 197 clause 1; the ducklake adapter of work_item_storage). optional_profile: the glossary and acceptance
