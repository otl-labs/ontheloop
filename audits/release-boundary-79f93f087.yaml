audit:
  meta:
    audited_commit: 79f93f087
    base_branch: main
    model: withheld -- harness rule forbids a model identifier in pushed artifacts (see contract_notes)
    methodology_version: 1
    scope_surfaces:
    - S1
    - S2
    - S3
    - S4
    - S5
    degraded_dedup: false
    web_unavailable: false
    contract_notes: 'main carried one open CI-RCA rec at audit time (rec-5543, Critical, a regression on scripts/ci/notice_digest.py);
      recorded per Section 5 step 2, task unchanged. Conflict resolved per Section 17: the session harness forbids a model
      identifier in any pushed artifact, so meta.model is withheld. Skills read in full: one (code-review) of the two allowed;
      planning was read by headings and grep, so no skill is called free of repository content. External lookups used: 9
      of 12. Repository-wide validate was not run (optional). The session-start hook warned that history deepening failed;
      no claim here rests on git log or blame. Every census value is a floor (Section 5 step 5).'
    stale_anchors: []
  question_answers:
  - q: Q1
    verdict: partial
    basis:
    - RB-04
    - RB-05
    - RB-17
    - RB-02
    prose: 'No mechanism records a release classification today; several can enforce one once it is recorded. north-star
      binds/adopters is the only machine-readable statement (nine entries, shape-checked in scripts/north_star_models.py:22-26,
      read by nothing else). Decision 196 clause 5 is a rule that needs the missing list of shipped mechanisms (RB-05).
      Decision 197 clause 1 is prose. ports.yaml records adapter locations and 16 hand-kept assumptions; the settings registry
      records 22 user-set settings; .importlinter layers first-party imports; boundary_patterns lists leash paths; file-router
      with validate_placement holds topic routes and root allowlists; decision kind is direction or mechanism. Together
      they are an enforcement substrate, not a classification: contract headers, check Entries and skill frontmatter are
      validated homes with no ships-or-not field. Proposed mechanism: one `release` field using the six buckets of this
      audit, collocated on each contract header, check Entry, skill and command frontmatter and persona row, with a path-level
      default table for code packages in docs/contracts/file-router.yaml; one fast-tier check, validate_release_boundary,
      with three legs: every artifact is classified; no core_engine, release_schema_defaults or optional_profile artifact
      imports, reads or enforces a repository_only one; and a generated manifest of what ships equals the committed one.
      Classes that would carry operator deployment content into a release if shipped whole: K01 (iam_tf, ci_guards and lambda_pkg
      checks), K03 (scripts/ops), K07 (the preflight AWS section), K13 (src/common/config.py defaults, operations modules,
      src/data handlers), K16 (the settings registry''s this_repository blocks, deploy-paths, environment-taxonomy), K17
      (admin-only-root and V-tier rules in persona templates), K22 (config/aws-region, config/lambda, config/terraform),
      K24 (Terraform and Lambda assessments in skills), K25 (session_start_aws.sh and the project-ref flag in .claude/settings.json).
      22 of the 29 classes are split.'
  - q: Q2
    verdict: insufficient
    basis:
    - RB-02
    - RB-01
    - RB-03
    prose: 'The pair is neither sufficient nor complete. SA rows are recorded by hand ''as T2-T4 work meets it'' (ports.yaml:112-113)
      and the validator checks id shape, non-blank text, an existing location and a resolvable owner, never coverage. The
      16 rows, all open, mostly record external-system shapes (Claude Code hook and transcript fields, GitHub APIs). At
      least 166 of 837 core files quote a docs/ or config/ path, at least 305 when joins and other repository paths are
      counted, and none of the three reads traced in DD-A has a row. The settings registry holds 22 user-set settings and
      no content location. The root-constant census (89 files, at least 85 definitions derived from the module''s own location)
      shows the assumption is structural, not enumerable by hand. ports.yaml has 89 bytes of headroom and one row was deferred
      for size (rec-5134). rec-4191''s acceptance passes vacuously: 12 block-form rows exist, none from its sweep, and its
      scope names scripts/executor, which Decision 247 retired. A sufficient source is the generated role list of a path-resolution
      seam, plus SA rows for what a path role cannot express (external-system shapes, identity), plus the settings registry,
      kept complete by a census check.'
  - q: Q3
    verdict: insufficient
    basis:
    - RB-01
    - RB-16
    - RB-04
    prose: 'Target layout. Core code: one import namespace built from one pyproject; existing scripts.* and src.* packages
      move one per plan behind re-export shims (the namespace is an operator decision, T4.24:c5, RB-16). Shipped schemas,
      default values, base persona contracts, base skills and the Tier B snapshot: package data inside the distribution,
      read through importlib.resources, never copied into a project. Project instance content: the tracked ontheloop/ root
      -- the settings file, Tier A north stars, Tier C decisions and supersedes records, guidance, plans, and the generated-then-confirmed
      boundary map, verification registry and recipes. Runtime state: the gitignored .ontheloop/ root -- local catalog,
      logs, transcripts, run state, config.yaml, the generated decisions index, maps. How core code finds each: one resolver
      with three roots (release root from package data; project root from a flag, then an OTL_ variable, then the git top
      level of the working directory; runtime root) and role-keyed accessors, so no module derives a path from its own location
      and each instance path literal appears once. Until content moves, the project accessors default to today''s paths,
      so every move is one revertible change. Current enforcement: no check can fail when core code reads a repository-only
      file. .importlinter enforces first-party layering, validate_placement enforces root allowlists and route targets,
      and validate_ports_contract enforces row shape; none knows which files are repository-only.'
  - q: Q4
    verdict: viable_with_preconditions
    basis:
    - RB-18
    - RB-16
    - RB-04
    - RB-01
    prose: 'Viable now, with three preconditions. (1) The pull-forward needs its own live roadmap item: the roadmap schema
      refuses a live item that depends on a deferred one (scripts/platform_roadmap_models.py:359-368) and T4.24 depends
      on the deferred T4.22 and T4.23, so T4.24 cannot simply be reactivated (NEW-1, RB-18). (2) Two operator decisions
      precede code moves: the import namespace and build root (T4.24:c5) and the settings-file name (rec-4673). (3) The
      classification (NEW-2) precedes bulk migration, because it decides which packages need the seam. On C5: c16, c17 and
      this repository''s half of c12 need neither T4.22 nor T4.23; c14 and c15 split (the settings-file schema and loader
      do not; otl doctor and init writing local adapters do). Order: record the item; classification and the path seam in
      parallel; the rename and the namespace decision; package-by-package migration, the generated inventory, the enforces
      edge and the Tier B membership list; then this repository''s ontheloop/ root and the north-star and settings moves;
      then the installable subset and the pinned build this repository''s CI runs; last the cloud-hosted kernel behind the
      promotion train. Staying deferred with the rest of T4.24: otl init itself, the first run on a fixture repository,
      local scheduling, the three-repository acceptance test, the verification-plane build and otl doctor (c2, c4, c8, c10,
      c11, c13, c15), which need the local engine and local adapters. NEW-7 may split by check domain when planned.'
  - q: Q5
    verdict: instinct_holds_with_conditions
    basis:
    - RB-16
    - RB-01
    - RB-05
    - RB-08
    - RB-10
    prose: 'Assessed from this repository''s side only: the public adopter products monorepo is not readable from this session.
      The topology holds; nothing found argues for a different split, and Decision 220 clause 4 makes the first adopter
      product the first otl init target, the cheapest real test of the boundary. Conditions before that repository can consume
      a release as a genuine external adopter: (1) an installable distribution under one namespace (RB-16) -- today the
      only consumable form is a checkout of this tree; (2) the path seam and the ontheloop/ layout (RB-01), or the adopter
      repository must reproduce docs/contracts/, config/ and docs/DECISIONS.md; (3) a Tier B membership list that excludes
      this repository''s operator decisions (RB-05); (4) a way to decline the house-style profile that switches enforcers
      off, because that repository declines it (RB-08); (5) persona guidance slots, because its review and planning conventions
      differ (RB-10); (6) CI gates delivered as reusable workflows pinned to a release (Q10 h); (7) rec-4391''s import ban
      once its package name exists. Until (1)-(4) hold, any use from that repository goes through this repository''s internals.'
  - q: Q6
    verdict: instinct_holds_with_conditions
    basis:
    - RB-15
    - RB-01
    - RB-16
    prose: 'The instinct is right for one plane and too conservative for the others. Decision 185 clause 3''s trigger is
      incomplete: it names concurrency above 1 and the first release, has no leg that makes this repository adopt the rule
      first as rehearsal, and does not say what ''installed'' means on the cloud host, where the kernel is a rendered state
      machine, Lambda packages and a persona image the operator deployment deploys (RB-15). There the promotion train is
      the release step: once T2.58 c3 holds, PROD receives only the artifact that ran on SIT behind one approval, so binding
      the cloud-hosted kernel after T2.57 and T2.58 is sound. Checks, hooks, the verdict shell and the persona image need
      no environment: the verdict shell already runs the default branch''s scripts over a snapshot of the change, and the
      persona image already runs by pinned digest with its source commit recorded, bumped by an operator-merged pin change.
      Bootstrap path: (1) the path seam, so core code runs from an installed location against a project root; (2) an installable
      build of the migrated subset cut from main; (3) a tracked version pin modelled on config/persona_image.yaml, bumped
      by a human-merged change; (4) this repository''s CI and hooks invoke the pinned build instead of the working tree,
      with a refusal check; (5) the kernel is written against the seam from its first commit and, on the cloud host, binds
      through the promotion train. No kernel exists yet (T4.19, T4.20 and T4.1 not started; T4.22 deferred), so no kernel
      migration is owed.'
  - q: Q7
    verdict: insufficient
    basis:
    - RB-10
    - RB-12
    - RB-13
    - RB-11
    - RB-14
    prose: 'The typed-input, pinned-template persona contract is a sound base, but no design exists for adopter customisation
      and the built contracts work against it. Repository-only content today: in templates, the postflight mock rule and
      its path, admin-only-root and V3 evidence rules, V-tier fitness from .tf and Lambda scope files, Decision citations
      and Terraform review items; in inputs, review_guidance, governance_contracts, review_exemptions, review_dispositions
      and rec_write_guidance are defined as extracts of this repository''s files; all nine skills reference this repository''s
      tooling or records. Layered model against the seams: (1) the fixed frame and (2) the base method stay in the shipped,
      hash-pinned contract, which the pin and the contract_version rule already protect; (3) adopter guidance enters only
      as values of input slots the shipped contract declares (project guidance, path-scoped guidance selected by the change''s
      paths, installed domain packs): values are outside the hash, while a new input adds a read_input capability and so
      changes the rendered bytes; guidance is quoted content under the existing quoted-content clause, so it can inform
      findings but cannot set the verdict, and verdict_consistency still binds the output; (4) adopter-defined personas
      are new contracts in the adopter''s ontheloop/ validated by the shipped schema, never edits to shipped ones. Guidance
      files must be boundary paths and read at the base ref, as verdict inputs already are, so a change cannot rewrite the
      guidance that judges it (RB-12). Evaluation: T4.14''s offline lane should take a guidance set as a candidate parameter
      beside the contract and model. Context size: report bytes and estimated tokens per run for the rendered prompt and
      each materialised input, advisory only, in run telemetry and doctor output; rendered prompts are 10 to 16 KB today
      and input sizes are unmeasured because no producer exists.'
  - q: Q8
    verdict: partial
    basis:
    - RB-06
    - RB-09
    - RB-07
    - RB-08
    prose: 'The why exists upstream but does not travel. (1) Snapshot: 194 of 228 entries carry a Problem and 119 a Rationale,
      yet 31 carry neither (Decision 117 among them) and 93 are amended by annotation, so a snapshot ''without amendment
      history'' either ships stale clauses or ships the history; the design does not say which (RB-06). (2) Override: supersedes
      is a bare number list; a superseding Tier C record should carry an accepts block naming the overruled reason, what
      replaces the rule and a failure signal -- the analogue of Tier A''s required failure_signal -- pre-filled by init
      from the snapshot and confirmed by a human (RB-09). (3) Point of violation: each shipped check should declare the
      decision it enforces and a one-line why, printed only on failure with the id to look up, so the reason costs context
      only when a rule blocks; today the SLOC check names Decision 43, gives no reason and tells the agent to register a
      file through a command that never registers it (RB-07). (4) From the eight-check sample plus SA-03: the SLOC limit
      (a constant, 500), the SLOC raise guard, prose byte budgets and the docs-root and scripts-root allowlists run for
      every caller with no switch, because check membership is code literals and nothing reads supersession (RB-08); the
      placement allowlists skip only when their key is absent; the rec portal''s glossary lint is declared in the table
      contract and is advisory. The 500-SLOC chain: the reason (model portability; NS.4) sits in Decision 128''s Problem
      and NS.4''s detail, two hops from the failure text, and an adopter''s superseding record would have to name that reason,
      the replacement limit or none, and how the adopter would notice comprehension degrading.'
  - q: Q9
    verdict: partially_at_practice
    basis:
