  - q: Q10
    answers:
    - question: (a) Should tests/ split along the release boundary so core tests run against fixture projects (C18)?
      answer: Yes, in two tiers, without moving files. 335 of 1,557 test files quote a docs/ or config/ path; 153 of those
        read the real tree, which is right for tests of this repository's own instance (C25); 217 build temporary trees
        in this repository's layout, and 202 files patch a module root constant at 1,130 sites. Keep tests/ here as repository_only;
        add a fixture-project tier that runs migrated core code from a separate location against projects in the ontheloop/
        layout (NEW-3's acceptance starts it); ship port conformance suites with the release (one of twelve exists).
      basis:
      - RB-01
    - question: (b) Should the ontheloop Claude Code plugin become the adopter distribution channel for skills and hooks,
        or stay repository-only (C16)?
      answer: 'Make it the channel for the interactive-lane surfaces only after two changes: build it from the classification
        manifest so repository_only files are excluded, and make hooks self-contained (each hook command now locates a checkout
        and runs that checkout''s script through bin/venv-python, so in another repository every hook exits 0). Until then
        record it as repository-only; its marketplace name equals the distribution namespace. Claude Code cloud sessions
        do not load locally installed plugins, so project-scope enablement through a committed settings file is the path
        an adopter would use (https://code.claude.com/docs/en/plugins).'
      basis:
      - RB-14
      - RB-13
    - question: (c) Does the ordering of rec-4673 (settings file rename) relative to creating the file matter (C7)?
      answer: 'Yes: rename first. The name appears 78 times in 27 tracked files outside the Decision corpus and the file
        does not exist yet. Each pull-forward slice that creates or reads it (the loader, the shared CI read step, the settings
        moves) adds references and, after c16, live values. rec-4673 costs one short Decision and a contract-and-check edit
        now.'
      basis: []
    - question: (d) How do Tier B/Tier C id prefixes interact with bare Decision numbers cited in code and check labels
        (C20)?
      answer: 'Bare numbers appear 2,130 times in 560 core files and 2,359 times in 87 contracts; 81 occurrences in 57 check
        files are printed output. Rewriting them is unnecessary if enforcers cite through a typed enforces edge (RB-05)
        and messages are rendered from it: the prefix then lives in one field per mechanism and in the snapshot''s ids,
        while comments keep upstream numbers as provenance. Fix the prefix (T4.24:c7''s first slice) before the edge is
        populated, so ids are written once.'
      basis:
      - RB-05
      - RB-07
    - question: (e) Should terraform/ and tests/ be inside or outside the release classification at all?
      answer: Inside, as whole classes with a recorded bucket, so the manifest is exhaustive and a check can prove nothing
        unclassified ships. terraform/ is repository_only today; the open point is whether the AWS adapters Decision 209
        clause 4 keeps public need a shippable deployment kit, which would be a new core artifact rather than this repository's
        roots. tests/ is repository_only with the two tiers of answer (a).
      basis:
      - RB-04
    - question: (f) What is a release's stable interface, and how do an adopter's ontheloop/ content and Tier C supersedes
        records migrate when a shipped schema changes?
      answer: 'By cost of a break to adopters: the settings-file schema; Tier B ids and the decision-entry grammar; the
        persona contract schema and capability vocabulary; check ids and their enforces edges; CLI verbs; reusable-workflow
        inputs. contract_version and semantic_break already mark breaking changes per contract and are the right raw signal.
        Missing: a release-level rule that maps a semantic_break in a shipped schema to a major version and requires a migration
        step for ontheloop/ content, and a redirect in the snapshot when a superseded clause is renumbered or split (Decision
        217 clause 6 lets an edge target a clause).'
      basis:
      - RB-04
      - RB-06
    - question: (g) How does a release locate and rebuild the decision warehouse half for an adopter, and does Tier B appear
        in an adopter's ops_decisions?
      answer: The rebuild is a core mechanism that reads a fixed path through file-location roots. For an adopter it must
        read Tier B from package data and Tier C from ontheloop/ through the resolver, write through the ops port's local
        adapter (T4.23), and generate the index into .ontheloop/ (Decision 217 clause 7; this repository still commits docs/decisions-index.json).
        Tier B should appear in an adopter's ops_decisions as rows marked with tier and release version and replaced on
        upgrade, so the decision lookup verb serves the why for shipped rules. Nothing records this today.
      basis:
      - RB-01
      - RB-06
    - question: '(h) How does an adopter receive the CI gates: reusable workflows or composite actions pinned to a release,
        or copies scaffolded by otl init?'
      answer: Reusable workflows and composite actions referenced at a release tag or commit SHA, plus one thin caller workflow
        that init generates from the adopter's settings. That keeps P2 (gate logic is never copied) and P4 (an upgrade is
        a ref bump); scaffolded copies fork the logic on day one. Only one of 47 workflows here is reusable today (deploy-gate.yml),
        so the gates an adopter needs must first be factored out of ci.yml and the persona-verdict workflows (https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows).
      basis:
      - RB-04
    - question: (i) Which adapters does a release carry, is core_engine code free of any one cloud's SDK outside its adapters,
        and how would a check tell?
      answer: 'A release carries local adapters as defaults and the AWS and GitHub adapters as optional extras. Core code
        is not free of the AWS SDK outside adapters: 43 files import boto3 or botocore across 15 packages and 3 sit inside
        an adapter location ports.yaml registers. Many of the rest are operator deployment tooling that never ships; the
        others (the ops writer transport, the capture transport, a preflight section, two checks) are couplings. A check
        can tell: an import-linter forbidden contract that includes external packages and forbids boto3 and botocore outside
        the adapter modules ports.yaml lists, seeded with today''s exceptions as a shrinking allow-list.'
      basis:
      - RB-04
    - question: (j, added) How do release-bound north stars reach an adopter?
      answer: 'binds and adopters are shape-checked only. T4.24 c17 moves the file unchanged into this repository''s ontheloop/
        and c8 scaffolds an adopter''s own entries; nothing says whether NS.1, NS.6 and NS.9 (binds both, adopters bound)
        arrive as read-only Tier A text, only through their carrying Decisions in Tier B, or not at all, or what stops an
        init template copying the binds: repository entries. An operator decision is needed before c8 is planned.'
      basis:
      - RB-04
      - RB-05
    - question: (k, added) What should be deleted rather than migrated?
      answer: scripts/executor/ (25 files) is retired by Decision 247 yet imported by 14 live modules and 69 test files,
        named in the code_reviewer template and skill, and listed in rec-4191's seed scope; the overseer skill and command
        and the legacy executor prompts are retired too. Extracting the live utilities and deleting the rest before bulk
        migration removes surface that would otherwise be classified, moved and tested (NEW-27).
      basis:
      - RB-02
      - RB-10
    - question: (l, added) Should shipped contracts drop their amendment logs and instance blocks, as Tier B drops amendment
        history?
      answer: Yes, as a release-build rule. ports.yaml's log is 52 rows of plan slugs and rec ids and the settings registry
        carries this repository's homes per row; Decision 275 already treats logs as the first thing to compact. Stripping
        amendment_log and instance blocks from shipped contracts settles RB-17 and most byte pressure together.
      basis:
      - RB-17
      - RB-03
