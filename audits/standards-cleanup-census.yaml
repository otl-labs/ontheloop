# Standards cleanup census (rec-5367). Membership is computed, never stored: scripts/checks/decisions/standards_census.py
# (--list <query>, --summary, --verify). This file is a living disposition record edited by the owners' builds, although
# the audits/*.yaml class's size exemption assumes write-once files. The change that closes an owner rec runs
# `--verify --read-owners` and re-disposes its row, rewriting its reason so the closed owner's id leaves the file and the
# reason names no rec still pending (the next census review runs it too); T2.54's closer re-disposes S10. TestCommittedCensus
# reads docs/ROADMAP-PLATFORM.yaml, docs/decisions-index.json and the registered check names, so completing an owner
# roadmap item, compacting an owner Decision or renaming a guard check turns it red until the row is re-disposed.
