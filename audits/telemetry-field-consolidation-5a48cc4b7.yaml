audit:
  meta:
    audited_commit: 5a48cc4b7
    base_branch: main
    model: 'not recorded here: the session harness forbids model identifiers in repository artifacts'
    methodology_version: 1
    scope_surfaces:
    - telemetry_sessions
    - telemetry_observations
    - observations_metadata
    - telemetry_agents
    - telemetry_transcripts
    - envelope
    - persona_findings
    - design_and_lookup_path
    producers_registered:
    - claude_code
    field_counts:
      bookkeeping: 64
      stored_written: 52
      declared_unwritten: 27
      read_derived: 31
      hidden_key: 29
    degraded_dedup: false
    degraded_empirical: false
    degraded_probe: false
    web_unavailable: false
    trees_sampled: 12
    days_sampled:
    - '2026-10-20'
    - '2026-10-21'
    - '2026-10-24'
    - '2026-10-26'
    - '2026-11-06'
    - '2026-11-07'
    - '2026-11-08'
    - '2026-11-09'
    - '2026-11-14'
    - '2026-11-16'
    - '2026-11-17'
    - '2026-11-19'
    parser_versions_sampled:
    - 7
    - 8
    - 9
    - 10
    - 11
    contract_notes: 'Base is origin/main; the short sha has nine characters. The clone is not shallow (2,220 commits). Preflight,
      the rec search and the rec body reads all succeeded. Sample: 30,169 rows in 12 trees (18,410 observations, 11,468 transcripts,
      212 sessions, 79 agents), all producer claude_code; three trees hold two parser generations, so every join was made
      within one parser_version. Two sampled roots are CI-hosted. Not sampled: any withheld_by_policy or oversize transcript
      row, any synthetic tool_call close, any phase or step observation, any non-null agents.error; producer_version and content
      are not returned by session_tree_rows. Those cases rest on code and the golden corpus (TFC-04 was reproduced by running
      record_turn on a golden case). The served describe() lists 16 of the 18 verbs in EVENT_READS at this commit. Counts
      are of stored rows, so anything re-parsed counts once per parser generation: 5,328 tool_call open rows are 4,840 distinct
      calls and 36 sub-agent run rows are 32 distinct runs. Probes: two fresh subagents, repository files only; MCP tools
      and every warehouse read, recommendation reads included, were also barred, which is stricter than the prompt, so that
      rec bodies stating the rulings could not be read. Lookup item 5 was replaced. Web: 6 of 8 lookups used; the Langfuse
      page returned 403, so no Langfuse claim is made; the OpenTelemetry GenAI pages now point to a separate repository and
      the registry page marks its entries deprecated for that reason. Privacy: one early census printed value counts of categorical
      columns outside the Section 11 allow-list (agents agent_type, agent_name and version; sessions workflow, execution_attempt
      and checkout_dirty; observations reasoning_effort) to this session''s own tool output; none is an id, ref, hash, branch,
      command or free text, and none of those values is in either deliverable. meta.model is withheld by a harness rule. scripts.validate
      --pre was not run (optional).'
    stale_anchors:
    - anchor: 'Section 10 G1: data-modeling-standard.yaml design_time_walk step count'
      prompt_value: nine steps
      found_value: 'eight numbered steps plus a second, expanded step 6 (nine entries); the planning skill calls it the eight-step
        walk. The dependent claim holds: no entry asks whether the fact is already stored.'
  question_answers:
  - q: Q1
    verdict: some_redundancy
    basis:
    - TFC-05
    - TFC-04
    - TFC-08
    - TFC-01
    prose: '4 of 53 fields are merge or derive_at_read (7.5%). The denominator is the 52 stored_written fields plus transcripts.entity_ref,
      the one bookkeeping field a candidate singles out (C4: kept, it is the uniform identity input); C12''s $ref set is judged
      as one design. The four: sessions.model_primary and agents.model (the first model call''s model on 51/51 and 79/79 rows),
      transcripts.model (its model_call''s model on 5,519/5,519) and sessions.execution_attempt (1 on open, resume rank plus
      1, 124/124). No reader verb reads any of them. Exactly recomputable but kept, because the declared reason holds: observations.sequence
      (5,822/5,822, but only by parsing external_ref), tokens_cache_creation (the 1h plus 5m split on 4,715/4,715; the split
      is nullable), output_sha256 and output_bytes (equal to a transcript digest and size on 5,318/5,318; raw identity, see
      TFC-04), agents.workflow_run_id (inside host_run_ref, 4/4), sessions.outcome (the last turn''s outcome on 75/75; other
      producers have no turns) and usage_final (from stop_reason on 4,715/4,715; a producer-neutral flag). Not copies: requested_model
      (differs on 433 rows), reasoning_visibility, origin (33 harness tool results). One typed column disagrees with its own
      hidden source: agents.trigger (TFC-08). Overlap is concentrated in the metadata bag, not the columns: 11 of 29 keys
      copy or derive from stored facts (TFC-01).'
  - q: Q2
    verdict: unjustified
    basis:
    - TFC-06
    - TFC-07
    - TFC-02
    prose: '15 of 27 unwritten fields are retire or have no live owner (56%): 14 retire, plus exit_code, which stays but has
      no live owner (TFC-02). Reserve, with a live owner and a reason (12): six merge-link fields on telemetry_sessions and
      attempt, provider and persona_backend on telemetry_observations have approved, unbuilt producers; cost_usd_reported
      (already read by model_call_cost_estimate), recs_created and queue_entries_written have open recs that name them. Retire
      by drop_column, batched (14): the step and phase family (steps_total, failure_phase, acceptance_passed), coverage_before
      and coverage_after, time_lost_seconds, token_count, plan_slug, scope_drift_files, rec_id on observations and transcripts,
      and on telemetry_agents provider, findings_count and lambda_request_id. None has held a value in these tables: 0 non-null
      in 30,169 sampled rows, no producer in git history, nothing in the golden corpus; five telemetry_agents names, three
      of them in this set, were written only by a v1 handler deleted before the tables existed (ever_non_null unknown). Six
      fields have no live owner: four under the hold label alone and two under roadmap criterion T4.32:c1, whose text names
      neither (TFC-07). The realization check proves every unwritten field has a well-formed owner; it does not prove the
      owner knows. The verdict measures a share, not harm: the 27 entries are 22.9 KB (8%) of contract text and cost no storage;
      the 14 to retire are 10.3 KB, of which 4.9 KB and 2.3 KB sit in the two contracts with no byte headroom.'
  - q: Q3
    verdict: undeclared
    basis:
    - TFC-01
    - TFC-02
    - TFC-03
    - TFC-10
    prose: '27 of 28 fact-carrying metadata keys are named in no contract (96%). The producer writes 29 keys (the Section
      10 table matches the code); 28 appear in sampled rows and each holds a value on at least one row; synthetic is a constant
      on a row type the sample lacks. Named: attribution_mcp_server, in the reader''s Class B contract, and synthetic, in
      an envelope note. The metadata entry''s own lists (STEP, PHASE, PROCESS_EVENT, MODEL_CALL) name 15 keys the claude_code
      producer never writes, and say exit_code is not in the bag although 1,371 sampled hook rows hold it (TFC-02). 18 keys
      carry a fact no column holds; 8 copy a typed column or hold its inputs; 2 are counts of stored rows; 1 repeats the parent
      link. Code reads one key (attribution_mcp_server: tool_use_rollup and derive_usage). metadata is the only JSON column
      (compare.py JSON_COLUMNS, confirmed). Other free-form text columns that carry structured facts: external_ref (row role,
      block index and, on merge links, the squash commit: TFC-03); transcripts.content on tool_input rows (the call''s JSON
      input, where a Skill call''s skill name lives: TFC-10); agents.error (a notice_status token or free text; no finding,
      0 sampled values); agents.host_run_ref and observations.name, whose grammars are declared and write-enforced. The remedy
      is a registry with a golden-row check, not 18 new columns (TFC-01).'
  - q: Q4
    verdict: findable
    basis:
    - TFC-03
    - TFC-10
    prose: 'Lookup probe: 6 of 6 valid items correct. This is a trap-set rate: the items target known weak spots and do not
      sample the field set evenly. Both controls were correct and nothing was contaminated. Item 5 was replaced by a question
      about why a model call ended, to probe an undeclared key that has no like-named column. Design probe, reported beside
      the count: correct. The agent found the stored input digest and the external_ref pairing and proposed a read-side derivation
      with no new stored field, so the incidents'' failure mode did not reproduce. What the probes measured under NS8 is price,
      not failure. The lookup agent read about 258 KB in 19 files over 52 tool calls for eight facts; the design agent read
      about 330 KB over 69 calls for one. Four of eight lookup answers needed only contracts (the typed-column items); the
      four trap items needed producer code: refs.py for the pairing in items 1 and 2, observations.py for the keys in items
      3 and 5. Each probe is one run of one capable model with repository access only. Sufficiency of the planned work: rec-5440''s
      link half removes the cause of the second incident, and this sample discharges its precondition (5,328 of 5,328 across
      parsers 7-11); its existence step would have stopped neither incident; rec-5438''s column-keyed index has no row for
      the homes involved; rec-5439 is sound as written (TFC-03, TFC-10).'
  - q: Q5
    verdict: proportionate
    basis:
    - TFC-01
    - TFC-03
    - TFC-06
    - TFC-07
    prose: 'Proportionate, with two pockets of excess. Under NS8 the count is not the cost. Of 174 entries, 64 are bookkeeping,
      nearly all held once and referenced, 31 are read-derived declarations and 27 are unwritten; 52 are written facts across
      four tables, which is in line with what an event journal for turns, tool calls, model calls and payloads needs (the
      common GenAI attribute set covers the same ground: request and response model, token classes with cache read and write,
      finish reasons, provider, tool call id). The probe agents parsed the set correctly. What they paid for was prose and
      gaps: whole-contract reads of 34 to 68 KB, one-line entries of 1 to 2 KB that return history with meaning, and four
      answers no contract holds. The excess is 14 unwritten fields with no producer path (TFC-06, TFC-07) and amendment history,
      which is 32% of all contract bytes. The shortfall runs the other way: 27 undeclared keys and one undeclared link. Practices
      that transfer to an agent reader: reuse before create (E2), declared bag keys (E5), declared joins (E4), deprecation
      marks (E8), one name for one meaning. Practices that transfer in part: synonyms and examples (E3) matter more, because
      an agent searches by meaning and here must guess the name; sharing by $ref (E6) costs a second file read and saves about
      60 KB. ''Fewer columns'' as a goal in itself does not transfer.'
    external_checklist:
    - property: E1
      rating: missed
      transfers_to_agent_reader: 'yes'
      surfaces_missed:
      - observations_metadata
      evidence: 'Every stored column has one enforced entry (realization rules R1-R8 and write-time rules). The 29 metadata
        keys have none: no entry and no check. An agent needs one place that is true for both.'
      confidence: CONFIRMED
    - property: E2
      rating: missed
      transfers_to_agent_reader: 'yes'
      surfaces_missed:
      - design_and_lookup_path
      evidence: 'No entry of design_time_walk asks whether the fact is already stored; rec-5440 owns adding one. OpenTelemetry:
        ''Reuse existing attributes when possible.'' https://opentelemetry.io/docs/specs/semconv/how-to-write-conventions/'
      confidence: CONFIRMED
    - property: E3
      rating: missed
      transfers_to_agent_reader: partly
      surfaces_missed:
      - observations_metadata
      evidence: 'All 110 locally defined entries carry a description; none has synonyms or an examples key (13 embed an example).
        The 29 metadata keys have no description. ODCS defines description, businessName, synonyms, examples: https://bitol-io.github.io/open-data-contract-standard/latest/schema/'
      confidence: CONFIRMED
    - property: E4
      rating: missed
      transfers_to_agent_reader: 'yes'
      surfaces_missed:
      - design_and_lookup_path
      evidence: _joins.yaml declares 18 joins, none on external_ref; the tool_call to tool_input pairing (5,328/5,328) is
        undeclared. The 31 read-derived fields declare formula and inputs; write-time derivations (severity, usage_final)
        do not.
      confidence: CONFIRMED
    - property: E5
      rating: missed
      transfers_to_agent_reader: 'yes'
      surfaces_missed:
      - observations_metadata
      evidence: '27 of 28 fact-carrying keys are named in no contract. OpenTelemetry sends authors to its attribute registry
        before they define an attribute: https://opentelemetry.io/docs/specs/semconv/how-to-write-conventions/'
      confidence: CONFIRMED
    - property: E6
      rating: met
      transfers_to_agent_reader: partly
      surfaces_missed: []
      evidence: 11 envelope entries and the identity-key contracts are specified once and referenced by 64 entries. The agent
        pays a second file read (the envelope is 53.9 KB) and the fragment path does not resolve literally; restating would
        add about 60 KB.
      confidence: CONFIRMED
    - property: E7
      rating: missed
      transfers_to_agent_reader: 'yes'
      surfaces_missed:
      - observations_metadata
      evidence: severity, outcome and usage_final are stored beside undeclared metadata inputs (exit_code; is_error, interrupted,
        tool_denial_kind; stop_reason), recomputable on 2,091/2,091, 5,328/5,328 and 4,715/4,715. Typed copies elsewhere are
        declared, some loosely (TFC-05).
      confidence: CONFIRMED
    - property: E8
      rating: partial
      transfers_to_agent_reader: 'yes'
      surfaces_missed: []
      evidence: 'All 27 unwritten fields are marked unproduced with an owner and checked in CI, which is stronger than a flag.
        None is pruned, six have no live owner and there is no retired state. ODCS has a deprecated flag: https://bitol-io.github.io/open-data-contract-standard/latest/schema/'
      confidence: CONFIRMED
  - q: Q6
    verdict: consolidate_now
    basis:
    - TFC-03
    - TFC-01
    - TFC-02
    - TFC-08
    - TFC-06
    prose: 'consolidate_now applies to the highest-leverage set, because that set changes no column: declare the tool-call
      link (TFC-03), register the metadata keys with a check (TFC-01), reword exit_code, trigger and the model headlines (TFC-02,
      TFC-08, TFC-05) and fix the realized flag (TFC-09). These are contract and check changes, each an operator-approved
      wording step under Decision 246, with no DDL and no production deploy hold. Three contracts have no byte headroom (sessions,
      observations, envelope) and agents has 257 bytes, so each edit there starts with amendment_log compaction; the key registry
      avoids the problem by living in a sibling contract. One claude_code parser_version bump then carries every producer
      change together: write exit_code on hook rows, derive trigger from the spawn result, apply the withheld rule to the
      output identity and stop writing 11 keys (TFC-01, TFC-02, TFC-04, TFC-08). A bump needs a golden corpus refresh, and
      a re-parse reaches only trees the producer can still read; stored rows are never updated. Column removal is batch_with_next_column_change:
      14 unwritten columns and model_primary, one contract_version bump per table, timed with that table''s next production
      column change and with rec-5214''s re-decision of Decision 216 cl.3. That a drop discards nothing was checked here only
      as far as the sample goes: all 14 are NULL on every sampled row. leave applies to the unread copies on other tables
      (agents.model, transcripts.model, execution_attempt): a column change each, for no reader.'
  - q: Q7
    answers:
    - question: (a) Is the four-table split itself a cause of cross-table copies?
      answer: 'Yes, for three families, each written to save a join across the split. Model: the serving model sits on model_call
        rows and is repeated on tool_call open rows, transcripts, agents and sessions. Output identity: output_sha256 and
        output_bytes on the tool call equal the transcript row''s digest and size on 5,318/5,318. Run and child session: agents.model
        equals sessions.model_primary on 79/79 rows; on a top-level run agent_type equals sessions.workflow (4/4) and the
        run''s outcome mirrors the session close (2/2). The copies are narrow and the reasons for the split hold: the payload
        table keeps the node table small (it holds 38% of sampled rows and all text), Decision 236 keeps content out of the
        ordinary reader, and agents carries run identity with its own lifecycle. The costlier effect is asymmetry rather than
        duplication: a tool call''s output identity is on the node while its input identity is on the payload row, reachable
        only through a ref (TFC-03). No Decision 95 revisit is proposed; declare the link and the copies.'
      basis:
      - TFC-03
      - TFC-04
      - TFC-05
    - question: (b) Should a read-derived relation carry a table-shaped contract?
      answer: 'Yes, with two repairs. Decision 199 and rule derived-state want derived fields declared so readers have one
        schema, and telemetry_persona_findings does that clearly: its header says no table holds it, it states the grain and
        it names the triggers for materializing. The lookup agent read its definition_sha256 as a derived copy of the telemetry_agents
        column, not as a second store. The costs are 16 KB and 18 entries that inflate the headline count of 174, and a realized
        flag that is false on all 31 derived fields, so it cannot tell a projection with no read verb from one that is served
        (TFC-09). Repairs: make realized a checked fact, and have any index or count report read-derived entries apart from
        stored ones.'
      basis:
      - TFC-09
    - question: (c) Do rec-4701, rec-4704, rec-5079 and rec-5250 ask for facts already stored or derivable?
      answer: 'rec-5079: the premise holds. The digest is on tool_input rows and each tool call reaches exactly one by the
        external_ref prefix (5,328/5,328, parsers 7-11). Three qualifications: it is the digest of the scrubbed, sorted-key
        JSON, so inputs that differ only inside a scrubbed credential collide; every withheld-policy row carries the same
        empty digest (none sampled); and the key has work to do, since 530 sampled calls sit in 54 repeated groups of session,
        tool and digest. rec-4701: the premise half holds. A model-invoked Skill call''s skill name is inside the tool_input
        content, but the ordinary reader serves no content, so counting needs the content reader; a skill started by a typed
        slash command is a command tag in the prompt, not a Skill tool call (sessions.py _workflow reads it there), so the
        inferred gap is real; and a withheld run stores nothing. agent_name is a precedent for promoting one input key to
        a column. rec-5250: derivable now from output_sha256 (10 unavailable closes carry no digest). rec-4704: not stored;
        the parser recognises those attachment records and drops them, so it is a new fact family and the natural batch for
        any typed additions.'
      basis:
      - TFC-03
      - TFC-10
    - question: (d) What should one line of a fact index contain, keyed by fact rather than column?
      answer: 'One line per fact a reader could ask for: the plain phrase with its search words; the home, as one of table.column,
        a metadata key, ''inside the payload of'', ''inside a ref'' or ''derived by verb''; the row qualifier (discriminator
        values); how the row is reached from its neighbours (a declared join id or a ref rule); status (written by which producer
        since which parser_version, unwritten with its owner, or derived and whether the verb is served); which reader serves
        it (ordinary, content reader, none) and what a withheld run stores; other homes of the same fact and which one is
        authoritative. rec-5438''s row, one per table.column and discriminator value, cannot hold the three homes behind the
        incidents and this audit''s findings: 28 metadata keys, facts inside a payload (a skill name), and facts inside a
        ref (the tool-call pairing, the merge commit). It also has no place for a fact with several homes, such as the model.
        Rows for metadata keys can be generated from the golden corpus, the same source the registry check in TFC-01 uses.'
      basis:
      - TFC-01
      - TFC-03
      - TFC-10
    - question: (e) Does writing null-valued metadata keys cost an agent reader or a query anything?
      answer: 'Little. 42,874 of 91,877 sampled key instances are null: 0.91 MB of 2.39 MB of metadata text (38%), about 49
        bytes a row before compression. No query result changes, and no agent-facing verb returns metadata (only the verification
        verb does). The real cost is a reading trap: presence is not value (agent_id is present on 5,328 closes and set on
        36). The benefit is that any one row shows its row type''s whole key set, which is the only declaration the keys have
        today. Once a registry exists the nulls are pure overhead and can go at a parser bump that is happening anyway; they
        do not justify one.'
      basis:
      - TFC-01
    - question: (f) Would rec-5440, rec-5438 and rec-5439 together, as written, have prevented both incidents?
      answer: 'One of the two. The input-key proposal would have been prevented by the link half of rec-5440: its author knew
        the digest was on the tool_input row and concluded it could not be joined. The existence step would have prevented
        neither, since both authors knew where the fact was. The skill-name proposal is not addressed: the fact is stored
        only inside content the ordinary reader does not serve, and nothing says what to do then (read through the content
        reader, or promote it to a typed column inside a batch). Missing: (1) the question at the points where both proposals
        began, a rec and a REPORT-ONLY report, neither of which runs the design walk; (2) a rule for stored-but-not-served
        facts; (3) index rows for homes that are not columns; (4) the rulings themselves in the repository, where a plan note
        and a report still point to a typed-column plan.'
      basis:
      - TFC-03
      - TFC-10
    - question: (g) Which practices do not transfer to an agent reader, and what replaces them?
      answer: 'Do not transfer: column count as a cost in itself (an agent searches rather than scans, and 64 of 174 entries
        are shared references); business names; companion summaries. Transfer fully: reuse before create, declared bag keys,
        declared joins, deprecation marks, one name for one meaning (an agent matches on names, which is what makes exit_code
        a trap). Agent-specific replacements: search words per fact, because the agent arrives with a meaning and must otherwise
        guess the name (25 searches for eight facts in the probe); locality, so that the lines a search returns are enough
        to answer (here a matched entry is one line of 1 to 2 KB that mixes meaning with amendment history); liveness flags
        a machine checks, so ''unwritten'' and ''served'' can be trusted without reading code; answerability from contracts
        alone as a tested property, with a small fixed question set like this probe run as a regression check; and rulings
        recorded where the planner reads.'
      basis:
      - TFC-01
      - TFC-09
      - TFC-10
    - question: (h) Where do the contracts' bytes go, and what dominates what an agent pays?
      answer: 'Recount at this commit: 276.5 KB in six contracts. Field entries are 192.1 KB: amendment_log 60.8, semantics
        46.8, description 20.9, governance_notes_local 15.6, derivation 11.7, populated_by 10.7. Top-level governance notes
        are 36.2 KB (22 of it in the envelope) and top-level amendment logs 28.1 KB. History is therefore 88.9 KB, 32% of
        everything. By kind: stored_written 76.2 KB for 52 fields (1.5 KB each), read_derived 41.4 KB, bookkeeping 29.2 KB
        for 64 entries, declared_unwritten 22.9 KB, the envelope''s own 11 entries 22.4 KB. Field count is not the driver:
        removing all 27 unwritten fields frees 8%, compacting history could free up to 32%. In the probe an agent read 258
        KB to place eight facts. What dominated was per-field prose carried in one-line entries, and, for half the trap items,
        something else: a home that is in no contract, which sends the agent into producer code.'
      basis:
      - TFC-01
      - TFC-03
      - TFC-06
    - question: '(i) Added: do any typed columns disagree with the source they are derived from?'
      answer: 'Two do. agents.trigger follows the spawn input flag while the producer shapes the run from the spawn result:
        8 of 32 distinct sampled runs are labelled sync and ran in the background (TFC-08). observations.outcome reads error
        for 4 of 23 sampled denied tool calls whose tool_denial_kind is automode-blocked, because the producer''s denial map
        has entries only for permission-rule and user-rejected and counts anything else as unknown; the friction rules then
        label those closes tool errors rather than blocks. The second is a producer mapping gap outside this audit''s field
        questions and has no finding here; it is the clearest case of a metadata key holding what the typed column lost.'
      basis:
      - TFC-01
      - TFC-08
    - question: '(j) Added: does a withholding or scrubbing rule cover every stored home of the fact it protects?'
      answer: No. The withheld content policy empties the digest and size on transcript rows and leaves the raw output digest,
        size and line count on the tool call row (TFC-04), and it leaves a hook's scrubbed command and stderr head in metadata
        (owned by rec-4985). Any rule written against one table should be tested against the copies the four-table split creates.
      basis:
      - TFC-04
    - question: '(k) Added: is anything declared that no code can set or read?'
      answer: 'Yes, in two places. content_truncated is described as a detector with an alert; no path sets it and nothing
        reads it (TFC-11). And the step and phase vocabulary survives from the executor era with no producer: two accepted
        observation_type values, three unwritten columns (steps_total, failure_phase, acceptance_passed), one read-derived
        count that can only read zero (steps_completed_total) and the STEP and PHASE key lists in the metadata entry. Retiring
        that family together is cleaner than field by field (TFC-06, TFC-01).'
      basis:
      - TFC-01
      - TFC-06
      - TFC-11
  findability_probe:
    mode: subagent
    design_probe:
      item: 'You are planning a change to this repository''s friction analysis: repeated identical tool calls -- the same
        tool given exactly the same input -- should be recognised as one run. That needs, for every tool call, a key derived
        from its exact input. Using this repository''s telemetry, what would you add or change to make that key available?
        Describe the storage and read changes you would make.'
      answer_given: No new stored field. The key is telemetry_transcripts.content_sha256 on purpose tool_input rows, joined
        to the tool_call open row where its external_ref equals the transcript ref plus '/tool_call_open'; declare a read-derived
        input_key and change the friction verbs; withheld rows read as NULL.
      grade: correct
      answered_from: both
      contaminated: false
      correct_location: 'all of: the digest already exists as telemetry_transcripts.content_sha256 where purpose is tool_input;
        a tool call reaches it by the shared external_ref prefix, not by observation_id; no new stored field.'
      files_opened: 25
      bytes_read_approx: 330000
      tool_calls: 69
      confidence: CONFIRMED
      note: One run. The pairing came from refs.py and observations.py, not a contract. The agent reported that a plan note
        and a report in the repository still point to a producer field and asked for a ruling.
    lookup_items:
    - n: 1
      item: Where is the SHA-256 of the exact input a tool call was given?
      surface: telemetry_transcripts
      answer_given: telemetry_transcripts.content_sha256 where purpose is tool_input (digest of the scrubbed canonical JSON);
        its observation_id is the model_call; reach the tool_call by the external_ref prefix.
      grade: correct
      answered_from: both
      contaminated: false
      correct_location: 'all of: telemetry_transcripts.content_sha256; rows where purpose is tool_input; linked to the tool_call
