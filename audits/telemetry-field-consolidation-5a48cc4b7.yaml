  findings:
  - id: TFC-01
    surface: observations_metadata
    surfaces_affected:
    - observations_metadata
    question: Q3
    dimension: VD3
    candidate_ids:
    - C6
    - C7
    - C13
    - C20
    title: 27 of 28 fact-carrying metadata keys have no contract entry, and the declared key lists name keys no producer writes
    evidence: Code writes 29 keys (observations.py _tool_rows, _result_meta, _turn_open_row, _turn_close_rows, _turn_rows,
      _hook_row; gate_events.py; hook_denials.py). 28 appear in 18,410 sampled rows. Only attribution_mcp_server is named,
      in the reader's Class B contract.
    evidence_kind: observed
    current_behavior: 'telemetry_observations.yaml fields.metadata lists keys for STEP, PHASE, PROCESS_EVENT and MODEL_CALL;
      the claude_code producer writes none of them. It writes 29 others across tool_call, turn, model_call and process_event
      rows, and no check validates a key (validate_telemetry_field_realization covers columns only). 8 keys copy a typed column
      or hold its inputs (is_error, interrupted, persisted_output, persisted_output_size, agent_id, is_async, status, synthetic);
      2 are counts of stored child rows (response_count, tool_call_count: exact on 415/415); tool_use_id repeats the parent
      link on 207/207 rows that have a tool_call parent. 18 carry a fact no column holds, among them stop_reason, hook_event,
      duration_ms, turn_origin, permission_decision_source and tool_denial_kind (4 automode-blocked closes read outcome error).'
    ideal_behavior: Every key a producer writes has one declared entry (meaning, row type, producer, since which parser_version)
      that a check compares with the golden rows; a key that only copies a column is not written.
    gap: No declaration for 27 of 28 fact-carrying keys; declared lists that match nothing written; no enforcement; 11 keys
      that duplicate stored facts.
    compensating_controls_considered: 'The golden corpus pins every metadata string, so a producer cannot change a key without
      a parser_version bump, and derive_usage re-derives attribution_mcp_server against the reader. Neither tells a reader
      or planner which keys exist or what they mean: the lookup probe found exit_code and stop_reason only by reading observations.py.'
    change_type: clarify
    proposed_change: 'Extend rec-4733 from the tool_call keys to all 29. Keep the registry in a sibling contract (Decision
      275 names that split; telemetry_observations.yaml has 0 bytes and 2 lines of headroom): one entry per key with row type,
      meaning, producer and since-version, and a check that the key set of the golden rows equals the registry. Replace the
      STEP/PHASE/PROCESS_EVENT/MODEL_CALL lists with a pointer and correct the ''NOT in this bag'' sentence. At the next claude_code
      parser_version bump stop writing the 11 copy keys (field_verdicts lists them) and stop writing null-valued keys.'
    acceptance: A contracts check fails when a golden row carries a metadata key the registry does not declare, or the registry
      declares a key no golden row carries; telemetry_observations.yaml no longer lists STEP or PHASE keys.
    severity: medium
    severity_rationale: 'Undeclared stored facts with a clear fix. Not high: both hidden-key items in the lookup probe were
      answered correctly from code, and the golden corpus stops a silent producer change.'
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-insufficient
      item_ids:
      - rec-4733
      dedup_search_terms:
      - rg '^## Decision' docs/DECISIONS.md
      - docs/ROADMAP-PLATFORM.yaml tier_items and candidate_decisions projection
      - 'recs_related: metadata keys undeclared tool_call process_event model_call'
      - 'recs_related: null metadata keys canonical_json'
      - 'recs_related: response_count tool_call_count stop_reason usage_final'
      - rg -F 'metadata key' docs/plans
      dedup_hit_count: 1
      confidence: CONFIRMED
      note: rec-4733 (open, XS) adds a TOOL_CALL entry for 12 keys inside telemetry_observations.yaml, with no check. It leaves
        17 keys undeclared, would declare 8 copy keys rather than stop them, and its target has no byte headroom. Decision
        210 governs; Decision 275 names the split.
    effort: M
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
      note: The registry and its check need no parser bump and no column change. The stop-writing half rides the next claude_code
        parser_version bump, together with TFC-02, TFC-04 and TFC-08.
  - id: TFC-02
    surface: shared
    surfaces_affected:
    - telemetry_observations
    - observations_metadata
    question: Q3
    dimension: VD6
    candidate_ids:
    - C5
    title: A hook run's exit code is stored under a metadata key the contract says is not there, beside an unwritten typed
      column of the same name with another meaning
    evidence: observations.py _hook_row writes metadata.exit_code (non-null on 1,371 of 2,091 sampled hook rows) and derives
      severity from it (exact on 2,091/2,091). fields.exit_code is unwritten and described for model_call; fields.metadata
      says exit_code is NOT in the bag.
    evidence_kind: observed
    current_behavior: 'Three statements disagree with the rows. The typed exit_code column (0 non-null in 18,410 rows) is
      described as a model_call process exit code. The metadata entry lists exit_code among fields promoted to typed columns
      and absent from the bag. The bag holds a hook exit code on process_event rows. severity keeps a lossy form of it (2
      is error, 0 or none is info, anything else is warning: 10 rows with code 1 and 21 with other codes all read warning).
      The column''s owner T4.32:c1 is an open criterion that names neither the field nor a producer, and the litellm plan
      leaves the column there.'
    ideal_behavior: 'One name, one meaning: the exit code of the process a row describes lives in the typed exit_code column,
      and the contract says which row types carry it.'
    gap: A reader working from the contract reads a column that is always NULL, or concludes that a hook's exit code is not
      stored.
    compensating_controls_considered: The lookup probe answered this item correctly, but from observations.py; it reported
      that the contract's key list omits the key. No check compares the 'NOT in this bag' sentence with rows.
    change_type: add
    proposed_change: Reword fields.exit_code as the exit code of the process the row describes (a hook run on process_event
      rows, a CLI model call on model_call rows) and take exit_code out of the 'NOT in this bag' sentence; both edits need
      amendment_log compaction first (0 byte headroom). At the next claude_code parser_version bump write the typed column
      on hook rows and stop writing the key. The column already exists in production, so there is no DDL and no deploy hold.
      Rows written before the bump keep the key; a reader coalesces the two.
    acceptance: A producer test asserts a hook process_event row carries exit_code as a column and no metadata.exit_code;
      the realization block lists exit_code under produced.claude_code; the metadata entry no longer names exit_code as absent.
    severity: medium
    severity_rationale: 'A misleading declaration with a clear fix. Not high: the probe agent avoided the trap by reading
      the producer, so the fallback held in the one trial run.'
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-insufficient
      item_ids:
      - T4.32:c1
      dedup_search_terms:
      - rg '^## Decision' docs/DECISIONS.md
      - docs/ROADMAP-PLATFORM.yaml tier_items and candidate_decisions projection
      - 'recs_related: exit_code hook severity process_event'
      - rg -F 'exit_code' docs/plans
      - T4.32 exit_criteria c1 text
      dedup_hit_count: 1
      confidence: CONFIRMED
      note: T4.32:c1 is the realization owner of exit_code; its text covers the persona foundation and names no telemetry
        field, so it states no remedy. rec-4733 declares tool_call keys only. Decision 210 cl.4 governs a semantic contract
        change.
    effort: M
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
      note: Wording first (an operator-approved Class A change), then the producer change in the shared parser bump with TFC-04
        and TFC-08.
  - id: TFC-03
    surface: design_and_lookup_path
    surfaces_affected:
    - envelope
    - telemetry_transcripts
    question: Q4
    dimension: VD4
    candidate_ids:
    - C10
    - C17
    title: A tool call reaches its input row, and a merge link carries its commit, only through the external_ref grammar that
      the envelope calls not a caller-facing key
    evidence: 5,328 of 5,328 sampled tool_call open rows (4,840 distinct calls, parsers 7-11) match exactly one tool_input
      row by external_ref minus '/tool_call_open'; none matches through observation_id, the only declared join. session_tree_rollup
      regex-extracts merge_sha from external_ref.
    evidence_kind: observed
    current_behavior: 'refs.py builds both refs from the same record uuid and block index (role_ref, transcript_ref), so the
      pairing is exact, but no contract states it. _joins.yaml''s observation_id join lists tool_input among a node''s payloads
      without saying the node is the model_call. The envelope''s external_ref description says ''Not a caller-facing FK''.
      The same grammar is the only home of two more facts: the squash commit of a merge link (declared in a governance note
      on telemetry_sessions external_ref and read by regex) and the block index that orders sibling tool calls. What the digest
      identifies also depends on the payload form (transcripts.py canonical_json, then the scrub), which the contract does
      not state. rec-5079''s first text concluded the digest could not be joined.'
    ideal_behavior: Every link a reader needs is a declared join or a named verb output; a fact carried inside a ref has a
      declared derivation; the envelope describes external_ref as it is used.
    gap: The link that makes the stored input digest usable is discoverable only in producer code, and the contracts point
      the other way.
    compensating_controls_considered: Both probe agents found the pairing in refs.py and observations.py, at about 115 KB
      of reading for that item. The golden corpus fixes the grammar per parser_version but pins no cross-table pairing. The
      author of rec-5079's first text, reading the same contracts, concluded there was no join.
    change_type: add
    proposed_change: 'Under rec-5440: (1) declare the pairing as a join entry or a reader verb output and pin it with a producer
      test over the golden corpus; this audit''s sample shows it exact across parsers 7-11. (2) Amend the envelope sentence:
      external_ref is the hash input and, where a table contract declares it, a read-side link (0 byte headroom: compact first).
      (3) Say in _joins.yaml that tool_input, thinking and response rows join to the model_call. (4) Declare the tool_input
      payload form (sorted-key compact JSON, scrubbed) beside content_sha256. (5) Give facts carried inside a ref, the merge
      commit first, a declared derived field.'
    acceptance: A test fails when a tool_call open row in the golden corpus has no single tool_input row at its external_ref
      prefix; _joins.yaml or the reader contract names the pairing; the envelope no longer says 'Not a caller-facing FK' without
      the qualifier.
    severity: high
    severity_rationale: This gap already led an agent to propose a column for a stored fact (rec-5079's first text), reversed
      only by an operator ruling. The fallback, reading producer code, failed in that case and cost each probe agent a code
      read.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-insufficient
      item_ids:
      - rec-5440
      - rec-5438
      dedup_search_terms:
      - rg '^## Decision' docs/DECISIONS.md
      - docs/ROADMAP-PLATFORM.yaml tier_items and candidate_decisions projection
      - 'recs_related: external_ref tool_input tool_call link join'
      - rg -F 'tool_call_open' docs/plans
      - rg -F 'caller-facing' docs/plans
      dedup_hit_count: 2
      confidence: CONFIRMED
      note: rec-5440 settles the tool-call link after checking it across parser versions (this sample does that) but names
        neither the envelope sentence, the join description, the payload form nor other facts held in a ref. rec-5438's index
        rows list joins. Decision 199 governs.
    effort: S
    depends_on: []
    sequencing:
      safe_to_queue_now: true
      blocked_behind: []
      note: 'Unblocks rec-5079. The envelope edit needs amendment_log compaction first: that contract has 0 bytes of headroom.'
  - id: TFC-04
    surface: telemetry_observations
    surfaces_affected:
    - telemetry_observations
    question: Q1
    dimension: VD2
    candidate_ids:
    - C3
    title: The withheld content policy blanks a tool output's digest on the transcript row and leaves the same digest on the
      tool call row
    evidence: output_sha256 equals a transcripts content_sha256 on 5,318/5,318 sampled closes. record_turn on the golden case
      host_run_only_withheld gives 5 of 5 transcript rows the empty digest while the tool_call close keeps a raw digest, output_bytes
      and output_lines.
    evidence_kind: static
    current_behavior: 'transcripts.py _row replaces content_sha256 and content_bytes with the empty-string digest and 0 when
      the run''s content policy is withheld, and the contract gives the reason: a raw digest of a short output confirms an
      exact guess. observations.py _output_cols never reads the policy, so the tool_call close row stores the raw output''s
      SHA-256, byte length and line count, and the ordinary reader serves those columns. No withheld run was among the 12
      sampled trees, so this rests on code and the golden case.'
    ideal_behavior: A withholding rule covers every stored home of the fact it withholds, or the contract declares the residual
      as accepted.
    gap: The second home of a tool output's identity is outside the rule that protects the first.
    compensating_controls_considered: tests/turn_capture/test_host_run.py asserts the transcript rows only. rec-4985 (open)
      blanks scrubbed text on observation rows; a digest and two counts are not text, so its acceptance test would pass with
      them present.
    change_type: enforce
    proposed_change: 'Extend rec-4985: on a withheld run write output_capture and no output_sha256, output_bytes or output_lines,
      enforced by a row rule keyed on the run''s policy; or state in telemetry_observations.yaml that the raw identity is
      accepted on withheld runs, as the transcripts contract does for oversize rows. Rides the next claude_code parser_version
      bump.'
    acceptance: A producer test on a withheld host-run case asserts the tool_call close row carries no output_sha256, output_bytes
      or output_lines; or the output_sha256 entry states the accepted residual.
    severity: medium
    severity_rationale: An inconsistency between two homes of one fact, with a clear fix. Its effect is a withholding rule
      that does not cover its own duplicate, which the operator may weigh above this scale.
    confidence: CONFIRMED
    roadmap_crossref:
      classification: planned-insufficient
      item_ids:
