  - id: TFC-05
    surface: shared
    surfaces_affected:
    - telemetry_sessions
    - telemetry_agents
    - telemetry_transcripts
    question: Q1
    dimension: VD2
    candidate_ids:
    - C1b
    title: Three model columns repeat a model call's model, two under descriptions that say otherwise, and no reader uses
      them
    evidence: sessions.model_primary equals the first model_call's model on 51/51 open rows; agents.model equals it on 79/79;
      transcripts.model equals its model_call's on 5,519/5,519. 2 of 51 sessions used two models; 256 of 4,715 calls ran on
      a model other than model_primary.
    evidence_kind: observed
    current_behavior: sessions.py first_model sets model_primary ('the primary model that drove the session') and agents.model
      ('the model the agent ran on') to the model of the stream's first non-error assistant record; in one sampled session
      that is not the most used model. transcripts.model mirrors the producing call. No reader verb reads any of the three;
      session_startup_baseline computes the first call's model from telemetry_observations itself.
    ideal_behavior: The serving model has one home, telemetry_observations.model on model_call rows; a headline copy says
      exactly which call it copies.
    gap: Two copies are described as a property of the whole session or run, which stops being true once the model changes.
    compensating_controls_considered: The semantics of model_primary and transcripts.model point to telemetry_observations
      for per-call truth, and the probe agent went there for the serving model. Nothing states that the headline is the first
      call's.
    change_type: derive
    proposed_change: 'Now: reword model_primary and agents.model as the model of the session''s first model call (XS; telemetry_sessions.yaml
      needs compaction first). Batched: stop storing model_primary at the next telemetry_sessions column change and serve
      the headline from a verb. Leave agents.model (Decision 95 names it in the agent dimension) and transcripts.model (not
      worth a column change).'
    acceptance: The two descriptions name the first model call; a reader test derives a session's first model from its model_call
