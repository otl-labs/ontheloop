audit:
  meta:
    audited_commit: 2b8c4326aa349de7d7d7ec2ede1b1869cb0bd1a7  # pragma: allowlist secret - audited git SHA, not a credential
    base_branch: main
    model: Kimi (Mistral Vibe CLI)
    methodology_version: 1
    scope_surfaces: [S1, S2, S3, S4, S5]
    degraded_dedup: false
    web_unavailable: true
    contract_notes: >-
      Section 5 step 0 was waived by the operator. Preflight passed on the audit branch and the roadmap parsed with
      186 tier items. Live rec dedup and exact recs_by_ids read-backs succeeded; owning recs are classified rather
      than rediscovered. No model, persona, workflow, Terraform apply, or secret-value read was performed. The
      GitHub PR connector is unavailable, so Section 16's PR fallback applies after push. External capabilities,
      context sizes, retention, pricing, three-head-SHA volume, and public-runner charging are HYPOTHESIS because
      no web connector is available. Rec-3866 supersedes the earlier assumption that a new verdict-comment wake
      is needed; native check-suite success is the primary wake and rec-3335 remains the backup reliability issue.
    stale_anchors:
      - "C5: scripts/smoke_test_inference_credentials.py:35-45 now reads the DeepSeek key from SSM, not Secrets Manager."
      - "docs/contracts/git-ops.yaml:275-282 says native CI-success wake is absent; rec-3866 records two later native check_suite.completed successes."
      - "Empirical diff counts were recomputed from git numstat; no counts were inherited from the prompt or earlier notes."

  question_answers:
    - q: Q1
      verdict: partial
      basis: [VPA-08, VPA-09, VPA-10, VPA-11]
      prose: >-
        The dependency shape has no T4.1, T4.9a, or T4.15 edge and C3 is not circular: T4.10a authors forward
        bindings and T4.32 implements them. The full prerequisite set is T1.12 (complete); the three verdict
        contracts plus shared registry and validator; rec-4026 then rec-4028 for LiteLLM events (rec-4024,
        rec-4101, and rec-4172 are closed); rec-4416 (closed at ad596e99), rec-4433, then rec-4434; rec-4477;
        rec-4766 before draft plan PRs; rec-4490 before interactive scout parity; rec-4498 to re-point T4.17;
        and the credential, image, input, threat-model, and consumer-contract changes in the findings. The explicit
        per-child decision adds no T3.22 umbrella edge. T4.10a is nevertheless over-broad and the named set omits
        rec-4026/rec-4028 and rec-4766, so the current chain is partial, not sufficient.

    - q: Q2
      verdict: partial
      basis: [VPA-01, VPA-02, VPA-03, VPA-12, VPA-14]
      prose: >-
        Use the LiteLLM Python SDK in-process, never a proxy. Start all three personas on deepseek/deepseek-chat:
        scout performs bounded triage over deterministic projections, while critic and code reviewer need its more
        certain tool/JSON path. HYPOTHESIS: chat tool calling, structured output, and a conservative 64K-token
        planning context are adequate; reasoner is a configuration-only second arm for critic or code reviewer
        after a measured miss, not an unexamined default. Raw diffs plausibly fit, but 35 and 31 scope-file plans
        and the 43-file code sample do not prove full-read fit. Materialize compact deterministic evidence rather
        than bulk repository text, validate structured output locally, and keep MCP reads read-only. Non-PR blobs
        can arrive in the input and trusted prompts can be baked from main, but scope_projection,
        plan_obligations, find_plan, extract_imports, weakening candidates, wording checks, and V3 PR evidence
        currently have no equivalent producer. Credential naming, resolved-model recording, per-call bounds, and
        token caps also remain open.

