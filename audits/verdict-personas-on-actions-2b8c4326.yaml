    - q: Q2
      verdict: insufficient
      basis: [VPA-01, VPA-03, VPA-09, VPA-10]
      prose: >-
        As their skills are written today the three personas cannot run on the primary role's DeepSeek models
        through the designed transport, for one empirical reason and three design reasons. Empirical: the
        personas are read-heavy, and the DESIGNED input rule (files and blobs at the head SHA, into one
        schema-validated input) does not bound what they must read. Measured on merged artefacts: plan-critic's
        required scope-file read (skill Phase 1 step 5 plus the Quality Gate's "read EVERY file in the plan's
        scope") is 88,982 B to 1,431,014 B - roughly 22k to 358k tokens - across five sampled plans; the changed
        files alone of two of five sampled code PRs are 1.4 MB (about 360k tokens). Even at the larger 128k-token
        window I attribute to the tier-1 aliases (HYPOTHESIS, no web access), three of five plan samples and two
        of five code samples do not fit before a single supporting read. Design: (a) the read surface is
        warehouse-only - scripts/agent_sdk/mcp_server.py projects DuckLake named reads and nothing else, and
        none of the three personas needs a warehouse read, so T4.10a c7 provides no capability for the reads they
        do perform (decisions index, Decision sections, roadmap text, main's source files, repo scripts);
        scripts/roadmap/scope_projection, plan_obligations, find_plan, extract_imports and
        validate_weakening_candidates are repo scripts with no capability to invoke them on a workspace-less
        host; (b) tool calling is the load-bearing capability and the tier-1 pair is not uniform: I believe
        deepseek/deepseek-chat supports function calling and JSON output while deepseek-reasoner historically does
        not (HYPOTHESIS), so the reasoner alias is unusable for a tool-using persona until that changes, and
        nothing in the criteria says which persona gets which model - the row that would say it
        (ports.run_persona.litellm.model) is `defaults: null` with a note pointing at inference-provider.yaml;
        (c) credential naming is wrong for the selection (VPA-03), so the backend cannot authenticate DeepSeek at
        all, and the tier-2 fallback has no credential expression because one row carries one variable. What must
        change: the prompt persona-side is small (a persona prompt states that quoted repository content is data,
        and the verdict vocabulary is unchanged), but the INPUT PROJECTION is a new component that must select,
        not concatenate - a per-persona projection budget plus a retrieval step (MCP repo-read capability or an
        indexed slice) is the only shape that fits real plans. What stays the same: the skills' judgement, their
        vocabularies, and their output shapes. Timeouts/retries: T4.10a c1's max_turns and
        max_wall_clock_seconds bound a run; no criterion sets a per-call timeout, bounded retries, a per-run token
        cap, or a fallback-to-tier-2 rule for a verdict persona, and the wall-clock budget is the only thing
        standing between a hung provider and an unbounded job.
    - q: Q3
      verdict: partial
      basis: [VPA-04, VPA-05, VPA-06, VPA-08, VPA-09]
      prose: >-
        The security core is genuinely designed: no pull_request_target, a secretless pull_request trigger
        chained to a workflow_run verdict job on the default branch's definition and code, permissions {} on the
        trigger, SHA-pinned actions required for the verdict job, a trigger-policy check that also refuses a
        PR-triggered workflow holding checks:write, a verdict identity distinct from the executor App, fail-rather
        -than-skip, and add/dual-run/flip/remove with a rollback flag. That is X1-X4 and X8-X9 met or defensibly
        partial. What is missed clusters in seven cheap-to-add places: no image provenance or signing anywhere
        (X5); pip-compile output carries no hashes and litellm is a dev-only pin (X6); no injection mitigation on
        the path while T4.13 is sequenced after the flips (X7 - a wrong verdict is the harm, so capability
        containment is not a property match); no resolved-model record under aliases that remap upstream (X10);
        token/cost/latency capture absent because rec-4028 is not a persona prerequisite (X12); no concurrency
        group or timeout-minutes on any verdict criterion (X13) and no egress control anywhere in .github/
        (X14); no offline regression set while T4.14 is deferred (X16). I add two rows: X17, required-check
        enforcement - nothing names the check-run names a ruleset must require, and the repo protects main by a
        ruleset configured from a human-gated local Terraform root; X18, volume control - T4.32 c4's fingerprint
        suppression covers the scout but nothing bounds code_reviewer's per-push fan-out.
      external_checklist:
        - {property: X1, rating: met, evidence: "T4.2 c8 (ROADMAP-PLATFORM.yaml:5886) secretless pull_request, permissions {}, chained by workflow_run, never pull_request_target; Decision 205 cl.2 (DECISIONS.md:2714)", executor_added: false}
        - {property: X2, rating: partial, evidence: "per-job minimum grants are not stated for the verdict job; property-matched control: T4.2 c10's registered check fails when any pull_request-triggered workflow is granted checks:write, so an over-grant on the untrusted trigger is refused rather than trusted, and the check is red on a fixture", executor_added: false}
        - {property: X3, rating: met, evidence: "T4.2 c8 'with SHA-pinned actions'; current repo practice is 176 tag refs against 7 SHA refs, but the criterion binds the verdict job only", executor_added: false}
        - {property: X4, rating: met, evidence: "T4.2 c9 'a GitHub Environment restricted to protected branches, or OIDC bound to job_workflow_ref'; the delivery object is unowned - see VPA-04", executor_added: false}
        - {property: X5, rating: missed, evidence: "T4.32 c2 and rec-4477 name a digest-pinned image and a build-and-publish channel; neither requires provenance or signing, and no cosign/SLSA reference exists in the repo", executor_added: false}
        - {property: X6, rating: missed, evidence: "requirements.txt is pip-compile --no-index without hashes (0 sha256 lines in requirements.txt and requirements-dev.txt); litellm==1.106.2 is dev-only at requirements-dev.txt:139", executor_added: false}
        - {property: X7, rating: missed, evidence: "no injection mitigation on this path: T4.13 c1-c4 unbuilt and sequenced after T4.2 (VPA-08); capability containment (T4.10a c1/c3) and schema-validated output (T4.2 c8) limit the blast radius to a wrong verdict, which is the harm a gate must not absorb", executor_added: false}
        - {property: X8, rating: met, evidence: "T4.2 c8 'fails rather than skips' and c9 'fails rather than skips'; stable required-check names are unsettled - see VPA-05", executor_added: false}
        - {property: X9, rating: met, evidence: "T4.28 c4-c6, T4.29 c4-c5, T4.30 c4-c5: advisory dual-run, N >= 20 pre-registered, per-persona rollback flag", executor_added: false}
        - {property: X10, rating: missed, evidence: "definition/prompt hash is designed (T4.10a c5, rec-4433) but no resolved-model version is recorded and no sampling setting is fixed; the tier-1 aliases 'remap to deepseek-v4-flash post-2026-07-24' (inference-provider.yaml:394) - see VPA-10", executor_added: false}
        - {property: X11, rating: partial, evidence: "T4.10a c1 bounds a run by max_turns and max_wall_clock_seconds; no per-call timeout, bounded retry, per-run token cap or tier-2 fallback rule on a verdict persona. Property-matched control: the wall-clock budget terminates the run and c8's fail-rather-than-skip turns that termination into a red verdict, which is the failure an unbounded call would otherwise hide", executor_added: false}
        - {property: X12, rating: missed, evidence: "persona identity + per-finding rows are designed (rec-4433, rec-4434, top-level run shape rec-4416 closed); tokens/cost/latency come from rec-4028, open and named by no persona criterion - see VPA-06", executor_added: false}
        - {property: X13, rating: missed, evidence: "no concurrency group with cancel-in-progress and no job timeout-minutes appears in T4.2 c8-c14 or in any T4.28-T4.30 criterion; T4.12 cG shows the repo knows the pattern for push-triggered agents only", executor_added: false}
        - {property: X14, rating: missed, evidence: "no harden-runner or any egress allowlist in .github/workflows/ or .github/actions/", executor_added: false}
        - {property: X15, rating: partial, evidence: "public repo content only (Decision 101), secretless trigger, no GITHUB_TOKEN read and no write capability (T4.2 c8, T4.10a c1/c3); provider retention terms are stated nowhere. Property-matched control: the secretless trigger itself - if a persona could reach a secret, X1's split would be absent and the design would fail its own c8", executor_added: false}
        - {property: X16, rating: missed, evidence: "no offline regression set on the persona path; T4.14 is deferred_post_mvp (ROADMAP-PLATFORM.yaml:6693) and Decision 231 puts grading offline, so nothing catches a prompt or model change before it goes live", executor_added: false}
        - {property: X17, rating: missed, evidence: "required-check enforcement is undesigned: no criterion names the check-run names a ruleset must require, main is protected by a ruleset rather than a classic rule, and terraform/github is human-gated local apply (terraform/github/environments.tf:22-30); a flip with no required check is a hook-level gate only", executor_added: true}
        - {property: X18, rating: partial, evidence: "T4.32 c4 suppresses a redundant scout run on an unchanged fingerprint (a real volume control for the scout); nothing bounds plan-critique re-runs after ready or code-review's per-push fan-out, and one extra commit multiplies both. Property-matched control for the covered half: the fingerprint recompute, which fails as a cost control if the projection moves on every push", executor_added: true}
    - q: Q4
      verdict: partial
      basis: [VPA-02, VPA-05, VPA-11, VPA-12, VPA-13]
      prose: >-
        The four-step strangler is sound in shape and measurable only after three things are fixed. Sound: the
        advisory-then-blocking order, the per-persona flag, the in-session outage fallback and the never-skip rule
        are explicit in all three items and in Decision 229 cl.4. Not yet measurable or operable: (1) no wake
        signal exists for a concluded verdict check run (VPA-02) - subscribe_pr_activity delivers failure events
        but no success event (docs/contracts/git-ops.yaml:275-282) and ci.yml's signal-green comment fires only on
        ci.yml, so a session waiting on persona-verdict.yml would idle exactly as rec-3335 recorded for CI-green;
        the fix is a second, independent wake: a per-persona comment posted by the verdict workflow on a
        conclusion, which c9 permits because it is a wake, not a verdict channel; (2) the verdict vocabulary has
        no mapping to a check-run conclusion or name (VPA-05), and a required status check needs a stable name per
        persona; propose code-review / decision-scout / plan-critique as the three names, with the conclusion
        derived by one table (PROCEED / NO_FLAGS -> success; REVISE / FLAGS_FOUND -> failure; BLOCK and
        're-scout required' -> failure; a job error or timeout -> failure; a cancelled superseded run -> neutral
        and not counted toward N); (3) merge authority is undefined at flip (VPA-11): 'critique PROCEED' and
        'code review PROCEED' in coordinator.yaml standing_authorisation must read as "the named check run on the
        head SHA concluded success", and a worker waits by subscription, not by polling. Agreement measures I
        propose each dual-run plan pre-register, over rec-4434 rows: decision_scout - the verdict enum AND the
        set of named CONTRADICT decision numbers must agree exactly on >= 20 consecutive plan PRs, with zero
        "in-session BLOCK vs persona NO_FLAGS" inversions; plan_critic - the Recommendation enum agrees AND the
        blocking-finding sets agree after normalising to (anchor, tag), zero blocking finding present in one
        report and absent in the other at the same anchor; code_reviewer - the Verdict enum agrees AND every
        Critical/High finding in the in-session report appears in the persona report at the same file:line, zero
        Critical/High in either direction. Missing the measure: the disposition is ordered and per-persona - hold
        the check advisory, revise the prompt and re-open the window at N (never shorten N), and if a second window
        misses, move that persona to the tier-2 role by configuration (Decision 173 makes that a contract edit,
        not a build). Which gate reviews the WP that changes a gate: the flip PR is reviewed by the OTHER two
        gates in-session and never by the persona it flips (VPA-12 makes this explicit); after a persona's flip,
        its own later changes are reviewed by the persona running main's committed prompt, so a persona may not
        gate its own flip PR - the criterion set says nothing about that rule.
      agreement_measures:
        - persona: decision_scout
          measure: >-
            On >= 20 consecutive plan PRs: the verdict enum agrees (NO_FLAGS/FLAGS_FOUND/BLOCK) AND the set of
            contradiction-named Decision numbers agrees exactly; zero inversions where the in-session gate says
            BLOCK and the persona says NO_FLAGS; recorded as rec-4434 rows keyed to the persona run.
          n: 20
          agreement_miss_disposition: >-
            Hold advisory, revise the scout prompt/input projection, re-open a fresh N window (never shorten N);
            a second miss moves decision_scout to tier 2 by project-configuration edit.
        - persona: plan_critic
          measure: >-
            On >= 20 consecutive ready plan PRs: the Recommendation enum agrees (PROCEED/REVISE) AND the blocking
            finding sets agree after normalising each finding to (plan field anchor, tag); zero blocking finding
            present at the same anchor in one report only.
          n: 20
          agreement_miss_disposition: >-
            Hold advisory, revise the critique prompt and the projection of scope files, re-open a fresh N
            window; a second miss moves plan_critic to tier 2 by configuration, or narrows the persona to the
            mechanical checks (tier, closes_criteria, VP commands) with the judgement half left in-session.
        - persona: code_reviewer
          measure: >-
            On >= 20 consecutive code PRs: the Verdict enum agrees AND every Critical/High finding in the
            in-session report appears in the persona report at the same file:line; zero Critical/High findings in
            either direction unaccounted for.
          n: 20
          agreement_miss_disposition: >-
            Hold advisory; for a miss weighted to missing findings, widen the changed-file projection and re-open
            the window; a second miss keeps the code-review gate in-session and moves only the mechanical half
            (weakening candidates, test obligations) to the persona.
    - q: Q5
      verdict: ready_with_forks
      basis: [VPA-01, VPA-04, VPA-11]
      prose: >-
        See execution_plan. 22 work packages across waves 0 through 11 (wave_count = the highest wave = 11);
        wave 0 is two operator actions (the credential boundary and the operating-contract text), wave 1 starts
        two planning workers on disjoint files (persona contracts, capture prerequisites), and the transport
        starts in wave 2 behind the contracts it reads. The critical path is a ten-package chain:
        WP-03, WP-04, WP-06, WP-07, WP-08, WP-11, WP-14, WP-18, WP-21, WP-22. The critical path runs
        decision-scout -> plan_critic because plan-critique cannot be added before a scout verdict exists: T4.29
        c1 makes the critic fail 're-scout required' while the head has no scout verdict, and the operator's
        start order puts T4.29 last of the three, which breaks the tie with the equally long code_reviewer and
        scout chains. No WP on the path is undesigned; three are needs_operator_fork: WP-07 (the input
        projection: what a persona may read beyond the head-SHA blobs - an extended MCP repo-read capability, a
        baked copy of main, or a per-persona projection with a size budget), WP-01 (Environment secret versus
        OIDC-to-SSM, recommendation OIDC), and WP-02 (the coordinator and project-alignment text plus the three
        agreement measures). Off the path, no WP is undesigned either: WP-10/WP-12/WP-16/WP-19 (code_reviewer)
        and WP-11/WP-13/WP-17/WP-20 (scout) restate criteria that already fix their steps, and WP-15 (rec-content
        provenance, T4.13 c2) is fully specified by its criterion. Two file-ownership serialisations are forced
        by the criteria themselves: the scout flip and the critic flip both own .claude/commands/plan.md and
        .claude/skills/planning/SKILL.md, and each persona's REMOVE re-owns the files its FLIP touched, so those
        three pairs can never share a wave. Is docs/contracts/coordinator.yaml (status draft) complete enough to
        run this workstream as written? No, in two places, both of which WP-02 settles before any flip: its
        lifecycle order is write_the_plan -> critique -> plan_pr, which the PR flow inverts (the plan PR must
        exist before the critic can run on it, and T4.30 c5's 2026-10-24 amendment already opens the draft PR
        before the alignment sign-off), and its standing_authorisation says 'on critique PROCEED' without saying
        what that reads on a check run. Its critique step is host-neutral otherwise and needs no change; its
        liveness.scope correctly leaves CI waits out, but says nothing about a verdict wait, which is neither its
        CI nor its stalled-worker case.
    - q: Q6
      verdict: partial
      basis: [VPA-06, VPA-08, VPA-12]
      prose: >-
        See bundle_dispositions. The design's own bundling is right about the foundation (T4.32 takes the
        transport, image, twin and chain; each persona item stays a persona) and silent about three edges that
        matter: rec-4028 belongs with the capture prerequisites (VPA-06), T4.13 c1/c3/c4 must precede the flips
        rather than follow the umbrella (VPA-08), and rec-4476 belongs in the contract wave because its
        acceptance is a boundary_patterns edit that no persona item's file scope carries (VPA-12). T4.26 and
        rec-4506 stay deferred; the pull-forward rec-4506 requests is an operator call, recorded as a disposition,
        not a finding. SHA pinning of existing workflows is repo-wide hygiene (176 tag refs) and must not be
        dragged into this workstream; the verdict job's own pinning is already required by T4.2 c8.
    - q: Q7
      verdict: moderate
      basis: [VPA-04, VPA-11]
      prose: >-
        See execution_plan.operator_touchpoints: nine counted rows - three credential acts (approve the
        Environment-or-OIDC trust and role, apply the human-gated Terraform root, set the key values out of
        band), two contract texts (the coordinator merge-authority and lifecycle wording, the project-alignment
        carrier), two design forks (the input projection, the agreement measures), one boundary-pattern edit, and
        one spend authorisation for the inference lane. Eight of the nine can be settled before wave 1 because
        they are text, a grant or a fork the operator can answer from the intake block; the two that must wait
        inside the acting worker are the out-of-band key values and the Terraform apply, both of which
        docs/contracts/coordinator.yaml approvals says count only in the worker that performs the act. Plan
        approvals per plan are listed but not counted.
    - q: Q8
      answers:
        - question: Is DeepSeek's quality on long, tool-heavy repository review adequate for a BLOCKING gate, and what evidence would show it before flip without an LLM grader?
          answer: >-
            Unproven, and the design currently cannot prove it: the evidence a flip needs is the dual-run
            agreement rows plus a replay set, not a model-quality opinion. Concretely: (a) replay 20 already
            merged plan PRs and 20 merged code PRs whose defects are known from later recs, audits or fix
            commits, and score the persona on whether it flags them - a real-outcome label, which Decision 231
            permits; (b) the rec-4434 agreement rows; (c) a blind operator rating of 20 persona reports against
            the in-session report, which Decision 231 names as a permitted grader. Until (a) exists, the honest
            position is advisory-only. My own read from the input sizes above is that quality is the second
            problem: a DeepSeek model handed a 40k-token projection will produce a plausible report, and
            agreement with an in-session gate that read 350k tokens is not evidence of anything.
          basis: [VPA-01, VPA-10]
        - question: Should code_reviewer flip before the plan-PR personas, or does plan-PR routing make the scout first?
          answer: >-
            Start code_reviewer's ADD first (the operator's start order) because it depends on nothing the
            plan-PR routing owns and its file set (implement.md, implement/SKILL.md) is disjoint from the plan
            flow, but do not let it be the first FLIP to matter: plan-critique cannot even be added before a
            scout verdict exists (T4.29 c1's 're-scout required'), so the scout's ADD is a hard prerequisite for
            the critic's, and the critic is the gate whose absence burns the most wall-clock today (five critique
            rounds on PLAN-persona-first-migration alone). Concretely - code_reviewer ADD, scout ADD, code_reviewer
            dual-run, scout dual-run, code_reviewer flip, scout flip, critic ADD + dual-run + flip - in that
            order, which is what the packages encode.
          basis: [VPA-11]
        - question: Bootstrap - the WPs that change the three gates are themselves reviewed by those gates; is that safe at every step?
          answer: >-
            Not today. Two unsafe steps: (1) the in-session code-review, plan-critique and decision-scout gates
            load their skill text from the branch under review, so a flip PR that edits
            .claude/skills/{code-review,plan-critique,decision-scout} or .claude/commands/{plan,implement} is
            judged by its own edit, and config/agent/executor/capabilities.yaml boundary_patterns lists
            .claude/agents/ but neither .claude/skills/ nor .claude/commands/ (rec-4476); (2) T4.28 c6 says the
            self-review gap 'closes here', but rec-4476's acceptance is a boundary_patterns edit that T4.28's
            file scope does not carry, so the rec cannot close at the flip. Fix: rec-4476's boundary leg lands
            in the contracts WP (wave 1), before any gate is touched, and every flip PR is reviewed by the other
            two gates plus the human under standing_authorisation.
          basis: [VPA-12]
        - question: What happens to in-flight plans and branches at each flip?
          answer: >-
            Nothing in the criteria says, and the safe rule is cheap to state: a flip applies to PRs pushed
            after the flip commit; the flag is read from main, so an in-flight plan PR keeps the in-session gate
            until it is rebased onto the flip, and its next push re-runs the Actions persona over the same head
            shape. The flip plan should name the in-flight PR list at flip time, re-run the Actions persona on
            each head SHA before that PR merges, and record on each PR which gate gave the verdict of record. A
            draft plan opened before the flip but readied after it needs the re-scout path, which is exactly the
            stale-verdict hole in VPA-13.
          basis: [VPA-13, VPA-11]
        - question: What is the monthly Actions-minutes and DeepSeek token cost at current volume?
          answer: >-
            Volume, measured on origin/main's first parent over 30 days (436 squash merges): 355 merges touch
            docs/plans/ (plan-PR class) and 203 touch a file outside docs/ and audits/ (code-PR class); a merge
            doing both counts in both. Runs per PR are per head-SHA push, not per PR: no pull_request_read tool
            is available here, so I assume 3 commits per PR (HYPOTHESIS). Persona tokens per run, from the
            measured inputs above: scout ~50k input, critic ~100k, code_reviewer ~80k, output ~4-5k. At 5 persona
            runs per plan PR (3 scout + 2 critic) and 3 per code PR: about 88M scout tokens, about 177M critic
            tokens and about 49M code-review tokens a month, roughly 315M input tokens. At my recollection of
            DeepSeek's chat pricing (~$0.28/M input on a cache miss, ~$0.03/M on a hit, ~$0.42/M output -
            HYPOTHESIS, no web access) that is $50-150/month, call it $100/month, dominated by plan-critique.
            Actions minutes are $0 on a public repository's standard runners (HYPOTHESIS); the real bill is the
            queue time and the rate limit, not dollars.
          basis: [VPA-06]
        - question: Does moving gates off the session change the interactive session's wall-clock loop materially?
          answer: >-
            Today the gate is synchronous: the session blocks for minutes and the human sees nothing. After a
            flip without a wake signal the session blocks FOREVER - CC-web has no sleep or idle tool and the repo
            forbids polling (AGENTS.md, docs/contracts/git-ops.yaml:269-303) - so the flip would trade a
            synchronous cost for an unbounded one. With the per-persona wake comment the loop improves: the
            author keeps working while the verdict runs, and the wait becomes one comment-to-turn round trip.
            That is why VPA-02 is a flip precondition, not a nicety.
          basis: [VPA-02]
        - question: A Decision cited by a plan is amended on main after the scout ran - does anything re-scout?
          answer: >-
            No. T4.32 c4 recomputes the fingerprint "on every push, draft or ready" of the plan PR, so an
            amendment on main moves the projection only when the PR is pushed again; Decision 217 cl.8's "every
            head SHA is covered by a scout verdict over an identical scout-input fingerprint" is therefore false
            for exactly the case its content hashes were added for. The criterion's own note ("so an amendment on
            main to a cited clause re-scouts") is not delivered by the trigger set. Cheapest fix: the verdict
            workflow also runs on push to main over open plan PRs, recomputing the fingerprint and posting
            're-scout required' where it moved - the same projection, one more trigger.
          basis: [VPA-13]
        - question: Does the /implement one-full-tier rule survive the flip?
          answer: >-
            Not as written, and the flip plans must say so. /implement's Step 5 (code review) runs before Step 7
            (commit, PR, merge), on the belief that the gate reviews a working tree; the flipped gate reads a
            check run on a draft PR, so the commit and PR must move ahead of the review, and Critical/High fixes
            arrive after a commit that the one-full-tier rule assumes is final ("the full tier runs exactly ONCE
            per implementation session: Step 7's closure item 4, after implementation_declared: true and after
            every Step 5 write"). The rule survives if the full run stays at the last commit and PR CI's --pre
            tier carries each intermediate head - that should be written into the flip plan, not discovered by a
            build worker.
          basis: [VPA-11]
        - question: Do the three personas need the On The Loop MCP server at all?
          answer: >-
            None of the three does: they read repository files and Decision text, never a warehouse verb. The MCP
            server (scripts/agent_sdk/mcp_server.py) projects DuckLake named reads only. So T4.10a c7's "one MCP
            server consumed as an MCP client" is the right shape for plan_agent, implement_agent and the
            advice-consult persona, and the wrong thread for these three - the capability they need (a
            repository-content read) does not exist on any surface, which is what VPA-01 is about.
          basis: [VPA-01]
  per_surface_assessment:
    - surface: S1
      maturity: solid
      strengths: >-
        The foundation is the strongest part of the design: one digest-pinned image with a named channel, a
        local_container oracle with a gating conformance suite, a thin-shell verdict chain with its trigger-policy
        and GitHub-agnosticism checks, a fingerprint-keyed scout projection with a completeness test, and a
        three-plan decomposition that maps cleanly onto waves.
      top_gaps: [VPA-01, VPA-04, VPA-02, VPA-09, VPA-10]
    - surface: S2
      maturity: solid
      strengths: >-
        The scout is the best-specified of the three: explicit trigger rules for draft and ready, a
        fingerprint-keyed re-scout, a verdict vocabulary with a deterministic rule, and a bounded triage source
        chosen for hermeticity.
      top_gaps: [VPA-01, VPA-02, VPA-05, VPA-13]
    - surface: S3
      maturity: solid
      strengths: >-
        Trigger semantics (ready_for_review and every push after) are pinned; the critique gate is the one the
        migration most needs off the session, and its criteria are explicit about re-running on a revision commit.
      top_gaps: [VPA-01, VPA-02, VPA-05, VPA-12]
    - surface: S4
      maturity: solid
      strengths: >-
        The four-step strangler is fully spelled out per criterion, the flip names its rollback flag, the
        self-review gap is named as closing at the flip, and the code-review persona fixes a real hazard (a
        branch reviewing its own edit).
      top_gaps: [VPA-01, VPA-02, VPA-06, VPA-12]
    - surface: S5
      maturity: frontier
      strengths: >-
        Built and working on claude -p with a scoped OAuth token: a real workflow_run chain, a fork-privilege
        gate, an adjudication taxonomy, and a run-scoped concurrency rule for ci-rca.
      top_gaps: []
