  findings:
    - id: VPA-01
      origin: C2
      surface: S1
      affected_surfaces: [S1, S2, S3]
      question: Q2
      dimension: VD1
      title: The verdict persona input projection names no source for main's governance corpus
      evidence: |
        docs/ROADMAP-PLATFORM.yaml:5940 (T4.2 c8, "ingests the PR only as API data (files and blobs at the head
        SHA)") against :7999 (T4.32 c4 requiring a hash of each approved Decision text block) and :6476 (T4.10a c1
        input_schema). Skills: .claude/skills/decision-scout/SKILL.md:20-45, .claude/skills/plan-critique/SKILL.md:22-46.
        Measured inputs: docs/decisions-index.json 170005 B, docs/DECISIONS.md 11967 lines / 1.1 MB,
        docs/ROADMAP-PLATFORM.yaml 692 KB, docs/PROJECT_CONTEXT.md 196 lines.
      evidence_kind: static
      current_behavior: |
        c8 pins what the persona may ingest from the PR and states that main's persona CODE and prompts run; it
        says nothing about main's DATA files. c4 nevertheless requires a per-decision content hash, which can only
        come from reading DECISIONS.md, and both plan skills read main-side files that are not in the PR
        (PROJECT_CONTEXT.md, the roadmap, the decision sections, the plan's scope files). The image is digest-pinned
        and built by a channel, so if the corpus travels inside it, it lags main by an unbounded time - and c4's own
        rule ("an amendment on main to a cited clause re-scouts") then silently stops working.
      ideal_behavior: |
        One criterion states that the shell materialises main's governance corpus (decisions-index.json, the
        Decisions and roadmap files, PROJECT_CONTEXT.md, and any scope file absent from the PR) at a pinned main
        SHA into the schema-validated input, that the input schema carries that SHA, and that every fingerprinted
        hash is computed from it. The local_container twin then reproduces a verdict byte-for-byte.
      gap: |
        No wording in T4.2 c8, T4.10a c1 or T4.32 c1/c4 assigns the corpus a source or a pin, so two
        implementations are equally compliant and one of them (image-baked) can produce a NO_FLAGS verdict that
        never saw a merged Decision amendment.
      compensating_controls_considered: |
        T4.10a c5's rendered-prompt hash pins the PROMPT, not the corpus; the digest-pinned image pins bytes, not
        currency; and the scout's own Phase 1 step 2 fails to BLOCK only for a missing caller brief, not for a
        stale corpus. None of them would catch a stale corpus, so none lowers the severity.
      change_type: clarify
      proposed_change: |
        Add one clause to T4.2 c8 and one field to T4.10a c1: the input carries a governance_corpus block with a
        pinned main SHA, the file list, and a per-file content hash; the shell fetches it through the contents API
        (main only, never the PR ref) and the persona reads nothing else from main except its own image. State in
        T4.32 c4 that its decision-text hashes come from that block.
      acceptance: |
        A contract test asserts the input schema rejects a payload with no corpus SHA; a fixture run scores the
        same verdict with the corpus fetched at SHA X and a second run with a Decision amended after X produces a
        different fingerprint.
      severity: high
      severity_rationale: |
        A stale corpus can make the scout's central judgement wrong while the verdict looks trustworthy, and from
        the flip on that verdict gates a merge. It is not critical because the designed pipeline is fail-closed
        (a schema-validated input with a required corpus field cannot silently omit it) and only one of the two
        plausible implementations fails silently.
      confidence: CONFIRMED
      roadmap_crossref:
        classification: planned-insufficient
        item_ids: [T4.32, T4.10a]
        dedup_search_terms: ["governance corpus", "input projection", "decisions-index", "scout-input fingerprint", "image baked main"]
        dedup_hit_count: 2
        note: "T4.32 c4 and T4.10a c1 both own parts of the input schema; neither names a corpus source. recs_related was unavailable (degraded_dedup), so no recommendation-side count exists."
      effort: S
      depends_on: []
      sequencing:
        safe_to_queue_now: true
        blocked_behind: []
        note: "belongs in WP-05's plan, which owns the input projection"
    - id: VPA-02
      origin: C2
      surface: S4
      affected_surfaces: [S4]
      question: Q2
      dimension: VD1
      title: The input projection cannot carry the PR body, PR comments, the merge base or the head branch
      evidence: |
        docs/ROADMAP-PLATFORM.yaml:5940 (files and blobs only) against
        .claude/skills/code-review/SKILL.md:150-176 (the V3 Post-Deploy Evidence check reads the PR body or a
        comment), :38-45 (git diff origin/main...HEAD and bin/venv-python -m scripts.roadmap.find_plan, which
        resolves by current branch). .claude/skills/implement/SKILL.md:130-137 requires the evidence to be POSTED to
        the PR before merge.
      evidence_kind: static
      current_behavior: |
        The reviewer's V3 check is mandatory for every V3-tier plan and raises a High finding (forcing REVISE) when
        the evidence artifact is absent or names no real run URL. The artifact is a PR body or comment. Neither is a
        file or a blob at the head SHA, so the designed input cannot carry it. The same projection cannot say what
        the merge base is, which the diff needs, nor which branch is under review, which plan resolution needs.
      ideal_behavior: |
        The schema-validated input carries the PR body, the issue comments, the base SHA and the head ref as
        first-class data (never as instructions), and the reviewer reads them exactly as it reads the diff.
      gap: |
        As designed, a V3 code PR either fails the gate for absent evidence it actually posted, or the implementer
        drops the check to make the gate pass - a silent weakening of a mandatory check in the same migration that
        claims to strengthen it.
      compensating_controls_considered: |
        None property-matching: the PR body is the only carrier of the artifact (Decision 103), and no other check
        reads it.
      change_type: add
      proposed_change: |
        Extend T4.2 c8's enumerated input to include pr_body, issue_comments, base_sha and head_ref as data-only
        fields, with the existing note that none of them is a verdict channel, and add the corresponding fields to
        T4.10a c1's input_schema for code_reviewer. Have WP-05's input projection populate them.
      acceptance: |
        A V3 fixture PR whose body carries a run URL passes the evidence check, and the same PR with the body
        blanked raises the High finding.
      severity: high
      severity_rationale: |
        It silently disables or falsely reds a mandatory check on the exact PR class that ships infrastructure, and
        the failure mode is chosen by whichever implementer hits it first. Not critical: the wrong-verdict path
        requires the implementer to drop the check, which a reviewer can see in the diff.
      confidence: CONFIRMED
      roadmap_crossref:
        classification: planned-insufficient
        item_ids: [T4.32, T4.28]
        dedup_search_terms: ["V3 post-deploy evidence", "PR body", "input schema", "merge base", "find_plan"]
        dedup_hit_count: 2
        note: "T4.32 c1 owns the chain and T4.28 c1 the binding; neither enumerates the input fields. recs_related unavailable."
      effort: S
      depends_on: [VPA-01]
      sequencing:
        safe_to_queue_now: true
        blocked_behind: [WP-05]
        note: "same WP as VPA-01 (WP-05); sequence the schema change once, not twice"
    - id: VPA-03
      origin: C13
      surface: S1
      affected_surfaces: [S1, S2, S4]
      question: Q4
      dimension: VD5
      title: No wake path exists for a verdict check run, and the only session wake is barred as a verdict channel
      evidence: |
        docs/contracts/git-ops.yaml:269-282 (wake_signals.coverage_note: subscribe_pr_activity delivers failure
        events but NOT a success webhook, and CC-web has no sleep or idle tool; the pass wake is a comment);
        .github/workflows/ci.yml:539-559 (signal-green, with an explicit invariant that a new pull_request-check must
        join its needs list); docs/ROADMAP-PLATFORM.yaml:5943 (T4.2 c9: PR comments are never verdict channels) and
        :7846, :7882, :7920 (the flip criteria: "reads the code-review check run", "loops on the plan-critique check
        run", "reads the decision-scout check run"); docs/contracts/ports.yaml:260-263 (change_surface read_verdict
        is owned by T4.1) and :243-258 (verdict_plane read_check_runs, no implemented reader).
      evidence_kind: static
      current_behavior: |
        The verdict job would post a check run, which is not a pull_request-triggered job in ci.yml, so signal-green
        never fires for it; a session watching the PR receives no comment and, having no sleep tool, cannot wait.
        The only designed read verbs live on ports whose adapters are owned by T4.1 (which every persona item is
        forbidden to depend on) or are unimplemented.
      ideal_behavior: |
        The verdict job posts a wake comment that is explicitly a signal and not the verdict channel (the check run
        stays the verdict of record), and a session reads the conclusion through one named verb before merging.
      gap: |
        Both plan-persona flips and the code-review flip are written as "loop on the check run", and no criterion,
        port adapter or contract gives a session a way to learn that the check run finished.
      compensating_controls_considered: |
        subscribe_pr_activity does deliver failure events, so a red verdict wakes the session; only the green case
        is silent - which is the case that must proceed. The comment signal that covers green is scoped to ci.yml's
        own needs list and cannot see a verdict job.
      change_type: add
      proposed_change: |
