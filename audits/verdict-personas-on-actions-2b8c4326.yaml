  findings:
    - id: VPA-01
      origin: C2
      surface: shared
      affected_surfaces: [S1, S2, S3, S4]
      question: Q1
      dimension: VD1
      title: The schema-validated verdict input has no designed source for the repository context all three personas read
      evidence: "docs/ROADMAP-PLATFORM.yaml:5886 (T4.2 c8); :8003 (T4.10a c6 workspace None); :6469 (T4.10a c7); scripts/agent_sdk/mcp_server.py:1-9; .claude/skills/plan-critique/SKILL.md:36,40; .claude/skills/code-review/SKILL.md:43-60"
      evidence_kind: observed
      current_behavior: >-
        T4.2 c8 fixes the input rule ("ingests the PR only as API data (files and blobs at the head SHA) into a
        schema-validated input") and T4.10a c6 fixes the verdict persona's workspace as None. The three skills
        read far more than the head-SHA file set: the plan for the branch (find_plan, git), PROJECT_CONTEXT.md,
        DECISIONS.md sections, the roadmap, DECISIONS_ARCHIVE.md's exemption section, the plan's scope files at
        their current content, one-level direct imports, pyproject/requirements/CI workflows, and the PR body's
        V3 evidence. Measured inputs: plan_critic 88,982-1,431,014 B of scope files; code_reviewer 39,461-1,473,744
        B of changed files alone. The only read surface designed (T4.10a c7's single MCP server) projects
        DuckLake warehouse verbs (mcp_server.py docstring and build_tool_registry), which none of the three
        personas needs and two of which cannot serve a plan or a diff.
      ideal_behavior: >-
        One named input projection per persona, with a byte/token budget and a documented source for every read
        the skill performs today, plus a retrieval step for what does not fit; a verdict that cannot obtain a
        required read fails rather than silently reasoning on a subset.
      gap: >-
        No criterion defines the input's CONTENT, its size bound, or the read surface for repository content. The
        scout-input fingerprint covers only the scout's plan-shape fields and excludes the free-text approach the
        scout skill requires (decision-scout SKILL.md Phase 1 step 2 returns BLOCK when it is absent), so the one
        piece of the input that is specified is specified for hashing, not for reading.
      compensating_controls_considered: >-
        Capability containment (T4.10a c1/c3: no write capability, no persona-invoking capability) bounds what a
        persona can DO, never what it can be blind to; schema validation bounds the output's shape, not its
        grounding. Both fail the counterfactual: a persona that reasons on a truncated projection and emits a
        schema-valid PROCEED is precisely the "passes on missing input" case.
      change_type: add
      proposed_change: >-
        Add a verdict-input contract (one file, docs/contracts/persona-input.yaml) and a projection builder under
        scripts/personas/input/: a per-persona source list, a byte budget, a deterministic ordering, and an
        explicit fail condition when a source is unavailable or over budget. Decide the repository-content read
        surface in the same plan (bounded read-only MCP tools at a pinned main SHA, a baked main copy, or a
        projection) and record the choice against T4.10a c7. Cite the measured inputs so the budget is not a
        guess.
      acceptance: >-
        A conformance test runs each of the three personas' projections over the five sampled plans and five
        sampled PRs, asserts every read named in the skill is either present or a recorded failure, asserts the
        projection stays inside its budget, and asserts an over-budget projection fails the verdict rather than
        truncating.
      severity: critical
      severity_rationale: >-
        The designed path can produce a wrong-but-trusted verdict that gates a merge: a persona that cannot see
        the scope files or the exemptions list reasons on a subset and returns a schema-valid verdict, and after
        the flip that verdict blocks or admits a merge. It also caps Q2: three of five sampled plan inputs and two
        of five sampled code inputs do not fit the tier-1 window before a single supporting read.
      confidence: CONFIRMED
      roadmap_crossref:
        classification: planned-insufficient
        item_ids: [T4.32, T4.2]
        dedup_search_terms: ["verdict input projection persona repo read", "scout input projection approach text plan"]
        dedup_hit_count: 2
        note: "recs_related totals 155 and 178; no returned row owns the input projection's content. T4.32 c1 owns the chain and T4.2 c8 owns the API-data rule - both are what make the gap visible, neither fixes it."
      effort: XL
      depends_on: []
      sequencing: {safe_to_queue_now: true, blocked_behind: [], note: "Wave 3; must land before the chain's fixture run exercises a real input."}
    - id: VPA-02
      origin: C13
      surface: shared
      affected_surfaces: [S1, S2, S3, S4]
      question: Q4
      dimension: VD5
      title: No wake signal exists for a concluded verdict check run, so the flipped gates cannot be waited on
      evidence: "docs/contracts/git-ops.yaml:269-303 (wake_signals coverage_note, ci_green_comment); .github/workflows/ci.yml signal-green job; docs/contracts/coordinator.yaml liveness.scope"
      evidence_kind: static
      current_behavior: >-
        The repository's only pass-wake is ci.yml's signal-green comment, which fires on ci.yml's own success for
        a PR head matching a declared branch prefix; subscribe_pr_activity delivers failure events but no
        success event, and pr-conflict-signal covers conflicts only. A persona-verdict workflow is a different
        workflow, so its success produces no comment and no native wake, and CC-web has no sleep or idle tool
        while polling is explicitly forbidden. rec-3335 records the closest failure mode (a single-path pass
        signal failing silently, n=1) and asks for a second independent signal for CI-green only.
      ideal_behavior: >-
        Each verdict workflow posts one wake comment per check-run conclusion (a signal, never a verdict channel,
        which T4.2 c9 permits), and the consuming session's wait is a subscription on that comment; the flip
        criteria name the wake as the wait mechanism.
      gap: >-
        Nothing in T4.2 c8-c14, T4.28 c4-c7, T4.29 c1-c6 or T4.30 c1-c6 designs a wait for a verdict: T4.28 c6
        says /implement "reads the code-review check run on its draft PR" without saying how it learns the run
        concluded, and T4.29 c5 says /plan "loops on the plan-critique check run" with the same silence.
      compensating_controls_considered: >-
        A worker could re-read check runs whenever it next wakes for another reason (CI green, a conflict, an
        operator message). That control fails the counterfactual: the verdict job runs concurrently with CI, so
        the CI-green comment can arrive BEFORE the verdict concludes and the worker would then merge on a pending
        gate, or wait with no event left to wake it.
      change_type: add
      proposed_change: >-
        In the verdict workflow, post one comment per conclusion naming the persona, the head SHA and the
        conclusion (idempotent per head SHA, continue-on-error), mirroring the signal-green pattern; consume it
        through subscribe_pr_activity. State in each flip criterion that the wait is this comment, and add it to
        git-ops.yaml wake_signals as a third signal.
      acceptance: >-
        A fixture PR's verdict check run concludes and the comment appears once per head SHA; a session
        subscribed to the PR receives it as a wake; no session that waits on a verdict ever polls.
      severity: high
      severity_rationale: >-
        Without it the flip converts a synchronous wait into an unbounded one, so the migration cannot be executed
        as designed; it also re-creates the failure rec-3335 observed (a mergeable PR idling on a green gate) on a
        path with no fallback at all.
      confidence: CONFIRMED
      roadmap_crossref:
        classification: novel
        item_ids: []
        dedup_search_terms: ["check run completion wake session", "check run completion wake session check required status"]
        dedup_hit_count: 0
        note: "recs_related total 36 (and 95 on the adjacent terms). rec-3335 (open, High) requests a second signal for CI-green specifically and rec-3039 a dispatch-brief pattern for background waits; neither owns a verdict-check-run wake, so the negative search stands."
      effort: S
      depends_on: []
      sequencing: {safe_to_queue_now: true, blocked_behind: [WP-08], note: "Lands with the chain; every FLIP depends on it."}
    - id: VPA-03
      origin: C4
      surface: S1
      affected_surfaces: []
      question: Q2
      dimension: VD4
      title: The litellm credential row names ANTHROPIC_API_KEY for a DeepSeek-direct primary role and cannot express the fallback tier
      evidence: "docs/contracts/project-configuration.yaml:169-180; docs/contracts/inference-provider.yaml:391-395"
      evidence_kind: static
      current_behavior: >-
        Row ports.run_persona.litellm.api_key declares variable ANTHROPIC_API_KEY with homes {local: user_env_file,
        ci: actions_secret, cloud: secrets_port}, set_by user, one row for the adapter. The primary role's current
        selection is DeepSeek-direct (inference-provider.yaml litellm_tier_models.tier_1), which authenticates
        with a DeepSeek key; there is exactly one api_key row, so the tier-2 Anthropic key has no expression, and
        a verdict job configured from this row would send a DeepSeek request with an Anthropic key.
      ideal_behavior: >-
        One credential row per provider role, each naming its own variable and its own homes, with the tier-1 row
        naming the DeepSeek variable and the tier-2 row the Anthropic one; the run_persona backend selects by role,
        never by a hardcoded provider.
      gap: >-
        The row is the only declared home for the port's credential and it is both mis-named for the current
        selection and structurally unable to carry the fallback, so Q2's "fallback to the tier-2 role" and Q3 X11
        have nothing to point at.
      compensating_controls_considered: >-
        The smoke test (scripts/smoke_test_inference_credentials.py --provider deepseek) proves a DeepSeek key can
        be read from Secrets Manager, but it is a local script with its own credential path and never consults
        this row; it cannot catch a wrong variable in the contract.
      change_type: rescope
      proposed_change: >-
        Split the row into ports.run_persona.litellm.api_key.tier_1 (DeepSeek variable) and
        ports.run_persona.litellm.api_key.tier_2 (Anthropic variable), give each its homes, and make
        validate_project_configuration reject a litellm adapter row whose variable does not match the provider
        its tier declares.
      acceptance: >-
        validate_project_configuration fails on a litellm credential row naming a provider other than the tier's
        declared one, and a run_persona litellm call on tier 1 reads the DeepSeek variable while a tier-2 call
        reads the Anthropic one.
      severity: high
      severity_rationale: >-
        The credential is the gate's power supply: as written, no verdict job can authenticate the selected
        provider, and the independent-vendor fallback that NS2 requires has no declared credential at all. Both
        block the path rather than weaken it silently, which is why it is high and not critical.
      confidence: CONFIRMED
      roadmap_crossref:
        classification: planned-insufficient
        item_ids: [T4.24, T4.32]
        dedup_search_terms: ["persona llm api key environment secret"]
        dedup_hit_count: 2
        note: "recs_related total 219; no owning rec. T4.24 c2 is the row's stated basis and T4.32 c1 builds the backend - neither fixes the naming or the per-tier split."
      effort: S
      depends_on: []
      sequencing: {safe_to_queue_now: true, blocked_behind: [], note: "Wave 1 with the transport."}
    - id: VPA-04
      origin: C5
      surface: S1
      affected_surfaces: []
      question: Q3
      dimension: VD3
      title: No credential delivery object or owning Terraform root is designed for the verdict job
      evidence: "terraform/github/environments.tf:32,65,93; terraform/personal/secret_parameters.tf:1-12; terraform/personal/inference_credentials.tf; docs/ROADMAP-PLATFORM.yaml:5886 (T4.2 c9)"
      evidence_kind: static
      current_behavior: >-
