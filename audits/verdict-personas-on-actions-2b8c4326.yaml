    - q: Q4
      verdict: partial
      basis: [VPA-04, VPA-05, VPA-07, VPA-08]
      agreement_measures:
        - persona: decision_scout
          n: 20
          measure: >-
            Twenty consecutive eligible plan PRs with exact normalized verdict agreement (NO_FLAGS, FLAGS_FOUND,
            BLOCK) and identical BLOCK/CONTRADICT and ROADMAP CONFLICT references on every evaluated head; CITE-only
            and RELATED-only differences are informational. A mismatch restarts the consecutive window.
          agreement_miss_disposition: >-
            Hold advisory. Replay the identical projection to separate extractor, prompt, and model causes; repair
            projection first, then prompt. If model-only mismatch remains, run one new 20-PR reasoner arm by
            configuration. Persistent miss stays advisory; tier-2 requires the pre-registered spend decision. Never
            loosen the metric or flip.
        - persona: plan_critic
          n: 20
          measure: >-
            Twenty consecutive ready plan PRs with exact PROCEED/REVISE agreement and identical blocking finding
            anchors (plan field path or VP step) and severities on every evaluated head; nit wording is excluded.
            A REVISE/REVISE pair with different blocking anchors is disagreement and restarts the window.
          agreement_miss_disposition: >-
            Hold advisory, repair projection/prompt, then try one new 20-PR reasoner arm. If still unequal, keep the
            in-session gate and present the pre-registered tier-2 spend fork; never average away blocking anchors.
        - persona: code_reviewer
          n: 20
          measure: >-
            Twenty consecutive code PRs with exact PROCEED/REVISE agreement and identical Critical/High finding
            fingerprints (normalized file, rule, and line range) on every evaluated head. Medium/Low findings remain
            captured but do not change gate agreement. Any Critical/High symmetric difference restarts the window.
          agreement_miss_disposition: >-
            Hold advisory, prove projection parity, repair prompt, then try reasoner for one fresh window. Persistent
            model-only disagreement holds the flip and routes to the pre-registered tier-2 spend fork.
      prose: >-
        ADD and dual-run are sound once VPA-01 and VPA-10 close. At flip, code review PROCEED means a successful
        code-review verdict on the exact head plus green CI. Critique PROCEED means a successful critique verdict,
        a scout NO_FLAGS or fully dispositioned FLAGS_FOUND result, no BLOCK, and green CI. Scout NO_FLAGS maps to
        success, BLOCK to failure, and FLAGS_FOUND to action_required; REVISE maps to failure. Missing, malformed,
        stale, or timed-out evidence fails closed. Individual checks are advisory during dual-run; the fixed
        aggregate becomes required only after the final flip, avoiding inapplicable required checks. Native
        check_suite.completed is the success wake and check_run.completed the failure wake (rec-3866), with the
        existing backup retained for rec-3335. Every open PR needs a current-head verdict at flip; no routine old
        gate continues. Before ADD, base-main in-session gates review the WP. After ADD, the main-hosted persona may
        review its own FLIP/REMOVE PR only alongside the still-primary base-main in-session gate; it never solely
        authorizes its own authority change.

    - q: Q5
      verdict: not_ready
      basis: [VPA-01, VPA-02, VPA-04, VPA-07, VPA-08, VPA-09, VPA-10]
      prose: >-
        WP-01, WP-02, and WP-06 on the critical path are undesigned, so the verdict is not_ready. Off-path WP-03 is
        designed. After WP-01's approved split, T4.32 depends on the verdict-contract slice while WP-03 completes
        the other four contracts independently. Coverage: all T4.10a, T4.32, T4.28-T4.30 criteria and the T4.2/T4.17
        criteria discharged by them appear exactly once or in named complementary parts. Deliberately excluded are
        T4.2:c1-c2, c5-c7, and c15 (loop host, compute plane, or admin separation); T4.17:c2-c4 (provider comparison,
        not transport); and T4.14 (deferred). WP-02 implements a verdict injection slice without claiming T4.13's
        original full criteria. The draft coordinator contract is not sufficient as written: roles.structure lacks
        the after-flip caveat, plan_pr and standing_authorisation assume an undefined in-session PROCEED, and GitOps
        wake text is stale. WP-01 makes those semantics explicit before workers dispatch dependent builds.

    - q: Q6
      verdict: partial
      basis: [VPA-06, VPA-08, VPA-10, VPA-11]
      prose: "See bundle_dispositions. The existing named bundles are necessary but omit rec-4026/rec-4028, rec-4766, the injection slice, consumer wording, and supply-chain acceptance; S5 and deferred evaluation stay separate."

    - q: Q7
      verdict: heavy
      basis: [VPA-02, VPA-03, VPA-07, VPA-11]
      prose: "Fifteen counted touchpoints (credential and registry forks, spend, governing text, security, publication, and manual parameter confirmation) make this heavy; fourteen write_the_plan approvals are listed but not counted. Credential delivery, registry identity, and spend can settle before wave 1; exact text and acting-worker approvals cannot."

    - q: Q8
      answers:
        - question: Is DeepSeek quality adequate for a blocking, long, tool-heavy repository review?
          answer: >-
            Not yet proven. Evidence is the three exact 20-PR measures in Q4, joined to rec-4434 findings and later
            escape ground truth, with deterministic projection comparisons and no LLM grader. Flip only after all 20
            consecutive cases agree; otherwise hold advisory and use the bounded model-miss sequence.
          basis: [VPA-01, VPA-03, VPA-10]
        - question: Should code_reviewer flip before the plan personas, or must scout be first?
          answer: >-
            Build plan-PR routing in T4.32 for all three, then run code-reviewer ADD/dual-run in parallel with scout.
            Code review can flip first because it does not edit planning files. Scout must precede critic because
            critique enforces the scout fingerprint. This respects start order without inventing completion edges.
          basis: [VPA-07, VPA-08]
        - question: Is bootstrap safe when WPs change the gates that review them?
          answer: >-
            Only with base-main review. Before ADD, a clean base worktree or independent human gate reviews the WP;
            rec-4476 also makes skills/commands boundary paths. After ADD, the main-hosted persona may run on its own
            FLIP/REMOVE PR, but the base-main in-session gate remains primary until merge. No branch-modified gate or
            new persona solely approves its own authority change.
          basis: [VPA-07]
        - question: What happens to in-flight plans and branches at each flip?
          answer: >-
            Every affected open PR obtains the new verdict on its current head before merge. A maintainer re-runs the
            trusted workflow for that head or pushes a retrigger commit; an unavailable verdict enters the visible
            outage fallback. There is no retroactive pass and no routine continuation of the old gate.
          basis: [VPA-04, VPA-07]
        - question: What are monthly Actions minutes and DeepSeek cost at current volume?
          answer: >-
            HYPOTHESIS: 355 plan PRs and 203 code PRs per 30 days times three head SHAs gives 1,065 scout, 1,065
            critique, and 609 code runs (2,739 total). At 25K/1.5K, 45K/2K, and 35K/2K input/output tokens this is
            95.865M input and 4.9455M output tokens. Illustrative $0.27/M input and $1.10/M output yields $31.32/month.
            Four minutes/run is 10,956 runner-minutes; public-repo Actions charge is HYPOTHESIS $0. Recheck prices and
            real head counts before spend approval; retries and cache discounts are excluded.
          basis: [VPA-12]
        - question: Does moving gates off-session materially change wall-clock loops?
          answer: >-
            HYPOTHESIS: queuing plus a four-minute workflow can exceed the roadmap's roughly four-minute scout,
            six-minute critique, and five-to-ten-minute review assumptions, but it frees session context and can
            overlap CI. Native check-suite wakes avoid polling. Measure queue-to-check latency during dual-run and
            hold flip if the event loop strands workers; no timing claim was measured here.
          basis: [VPA-05, VPA-12]
        - question: May verdict personas use general warehouse MCP reads?
          answer: >-
            Deny them by default. The required evidence is public plan, PR, and trusted-main content; rec-4434 capture
            is an output, not prompt input. Any later operational-data read needs an explicit field allowlist,
            provider-retention review, and a fresh security decision rather than an incidental capability grant.
          basis: [VPA-01]
        - question: Should adjacent Claude-on-Actions agents join this migration?
          answer: >-
            Not in the critical path. T4.26/rec-4506 and rec-4415 have different credentials, capture, replay, and IAM
            decisions. Reuse the governed image and LiteLLM conventions after the three verdict chains prove them;
            do not widen these WPs to ci-rca, subagent-plan-review, or claude.yml.
          basis: [VPA-02, VPA-10]

