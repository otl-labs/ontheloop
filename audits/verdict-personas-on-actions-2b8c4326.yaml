    - q: Q1
      verdict: partial
      basis: [VPA-08, VPA-11, VPA-15, VPA-16, VPA-17]
      prose: |
        The core chain is present and correctly ordered for START: T4.10a (depends only on T1.12, complete) ->
        T4.32 -> {T4.30, T4.29, T4.28}, and no child inherits T4.1, T4.9a or T4.15 (each intent says so, and
