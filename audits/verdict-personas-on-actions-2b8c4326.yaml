  findings:
    - id: VPA-01
      origin: C2
      surface: shared
      affected_surfaces: [S1, S2, S3, S4]
      question: Q2
      dimension: VD1
      title: Deterministic evidence and data-governance inputs have no complete producer
      evidence: "T4.2:c8 docs/ROADMAP-PLATFORM.yaml:5940; T4.10a:c1/c7 :6485/:6497; decision-scout/SKILL.md:26,46,63; plan-critique/SKILL.md:20-30; code-review/SKILL.md:15,41-43,91,154-167; all ten empirical_samples"
      evidence_kind: observed
      current_behavior: "The chain accepts files/blobs into a schema, while the existing gates execute projections and read base/main context and PR evidence. MCP exposes DuckLake named verbs, not repository projections. No criterion enumerates semantic inputs, provenance, or a public-data allowlist."
