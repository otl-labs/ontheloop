    - id: VPA-13
      origin: novel
      surface: shared
      affected_surfaces: [S1, S2, S3]
      question: Q1
      dimension: VD1
      title: A Decision amended on main after the scout ran does not re-scout, so a covered head SHA can carry a stale verdict
      evidence: "docs/ROADMAP-PLATFORM.yaml:8007-8009 (T4.32 c4 recompute trigger); docs/DECISIONS.md:591 (Decision 217 cl.8 amended-by text)"
      evidence_kind: static
      current_behavior: >-
        T4.32 c4 recomputes the fingerprint "on every push, draft or ready" of the plan PR, and includes each
        cited and amended decision's content hash so that "an amendment on main to a cited clause re-scouts". No
        trigger fires on a push to main, so the recompute happens only at the PR's next push; until then the last
        scout verdict is treated as covering the head SHA.
      ideal_behavior: >-
        The verdict workflow also runs on push to main against every open plan PR, recomputes the fingerprint and
        either re-uses the verdict or posts "re-scout required"; Decision 217 cl.8's coverage claim then holds for
        every head SHA at every moment.
      gap: >-
        The one case the content hashes were added for is the one case the trigger set cannot see. A plan citing
        an amended Decision can be readied, critiqued and merged on a scout verdict computed against the
        superseded text.
      compensating_controls_considered: >-
        The critic reads the cited Decision sections itself and does a conflict sweep, so it can catch a
        contradiction the scout missed. That control fails the counterfactual for its own inputs: the critic's
        Phase 1 step 4 reads the sections the plan names, so a Decision amended into conflict after the critic's
        run is invisible to both gates until the next push - and the plan can merge between the two.
      change_type: add
      proposed_change: >-
        Add a push-to-main trigger to the verdict workflow that recomputes each open plan PR's fingerprint and
        posts "re-scout required" (or re-runs the scout) where it moved; extend T4.32 c4's sentence from "on every
        push" to "on every push to the PR and on every push to main touching a fingerprinted source".
      acceptance: >-
        A fixture amends a cited Decision on main and an open plan PR's scout check run turns to "re-scout
        required" without a push to the PR; a re-used verdict names the fingerprint it covers.
      severity: medium
      severity_rationale: >-
        A narrow, real staleness window on the flips' central coverage claim, with a cheap fix; it needs an
        adversarial timing (an amendment between two PR pushes) to bite.
      confidence: HYPOTHESIS
