    - q: Q2
      verdict: partial
      basis: [VPA-01, VPA-02, VPA-07, VPA-12, VPA-14]
      prose: |
        Transport shape is sound for what it names: LiteLLM THE PYTHON SDK IN-PROCESS (not the proxy) is fixed by
        T4.32's files_in_scope naming scripts/llm/client.py and by client.py's own docstring
        (scripts/llm/client.py:1-7) saying the tier model "lands with T4.2's transport rewrite"; no proxy
        deployment, port or host is named anywhere, so the SDK reading is the only consistent one.
        Four limbs are undesigned. (a) Input and context fit: the scout's triage source is
        docs/decisions-index.json, 168 KB, 170005 B at BASE, read WHOLE in Phase 1 step 1 (about 42k tokens before
        any decision section is opened); the critique must read every plan scope file, and a merged 2026-11-03 plan
        puts docs/DECISIONS.md (11967 lines, 1.1 MB, about 275k tokens) in scope (empirical sample 1). Neither
        fits a 64k window and the reasoner tier is the narrower of the two, so per-persona projections must be
        narrowed before any run (VPA-01). (b) Where the non-PR corpus comes from is unstated (VPA-01). (c) Which
        tier-1 model a persona uses has no resolution rule at all: tier_1 declares a two-element SET
        (docs/contracts/inference-provider.yaml:390-391) and the only band mechanism in the repo,
        model_routing.executor.roles.effort_bands (same file, line 467 onward), is Gemini-CLI pro/flash/auto and
        was never ported; the selection's home, ports.run_persona.litellm.model
        (docs/contracts/project-configuration.yaml:157), is single-valued and unresolved (VPA-12).
        (d) Credential naming contradicts the selection: the api_key row names ANTHROPIC_API_KEY
        (project-configuration.yaml:174) while tier 1 is DeepSeek-direct and two separate secret envelopes exist
        (terraform/personal/inference_credentials.tf:33 and :39), so one variable cannot carry the pair (VPA-07).
        Recommendation, to be settled in the transport plan: decision_scout on deepseek-chat (mechanical tag
        triage, one long read, no multi-document comparison); plan_critic and code_reviewer on
        deepseek-reasoner with a hard input cap and a chat fallback when the projection exceeds the window.
        Tool calling: the three personas need no tool calls at all once the shell materialises the input, and
        T4.10a c7's MCP surface is warehouse-only (scripts/agent_sdk/mcp_server.py:1 projects DuckLake NAMED_READS),
        so no MCP client is on this path. Structured output and the schema are designed (T4.10a c1, T4.2 c8).
        Timeouts, retries and tier-2 fallback on the verdict path are absent (VPA-14). Model-version pinning is
        absent and the aliases remap upstream (VPA-12). What stays the same: the three skills' methodology and
        verdict vocabularies; what changes: the input projection for all three and, for plan_critic, the
        scope-file read list.
    - q: Q3
      verdict: partial
      basis: [VPA-04, VPA-05, VPA-07, VPA-12, VPA-14]
      prose: |
        Sixteen rows plus two added. The chain's shape is genuinely close to practice: secretless
        pull_request plus workflow_run (X1), a stated SHA-pin rule (X3), a named key-reachability rule with two
        candidate mechanisms (X4), fail-closed text in three places (X8), a mandated shadow period with a
        pre-registered metric and a per-persona rollback flag (X9). The lost rows concentrate in three places:
        the credential and capture WIRING (no environment, no role, no writer, no owner), the reproducibility and
        resilience of the model call (no resolved-model record, no sampling, no timeout/retry/fallback), and
        runner egress (absent repo-wide, not only here).
      external_checklist:
        - property: X1
          rating: met
          evidence: |
            T4.2 c8 (docs/ROADMAP-PLATFORM.yaml:5940) and Decision 205 cl.2: a secretless pull_request trigger
            with no checkout, no secrets and permissions {}, chained by workflow_run to a verdict job that runs the
            default branch's definition; pull_request_target is never a persona trigger.
          executor_added: false
        - property: X2
          rating: partial
          evidence: |
            The trigger workflow is pinned to permissions {} (T4.2 c8) and T4.2 c10 registers a check that fails
            when a pull_request-triggered workflow is granted checks: write. No criterion states the verdict job's
            own minimum grant; it needs contents: read plus checks: write and c9 only says its token IS the verdict
            identity. Compensating control: the verdict job's definition lives on main, is the same file the
            check-run identity is read from, and is reviewed by the flip PR, so a widened grant is visible in the
            reviewed definition - a review control, which would NOT catch a grant added in a later unreviewed push
            to main, so this row stays partial. No workflow in the repo holds checks: write today (grep over
            .github/workflows/ returns zero).
          executor_added: false
        - property: X3
          rating: met
          evidence: |
            T4.2 c8 requires SHA-pinned actions inside the verdict-chain sentence itself. Scoped correctly: the
            existing 100+ tag references (actions/checkout@v7 x56, actions/setup-python@v7 x41,
            aws-actions/configure-aws-credentials@v6 x39) are outside that criterion's scope and are handled as a
            separate bundling question in Q6 rather than counted against it.
          executor_added: false
        - property: X4
          rating: met
          evidence: |
            T4.2 c9 (docs/ROADMAP-PLATFORM.yaml:5943): the LLM key is reachable only from the verdict workflow ref,
            via a GitHub Environment restricted to protected branches or OIDC bound to job_workflow_ref, and the
            author allowlist fails rather than skips. The DESIGN provides the property. The missing owner, file and
            apply path for it is a Q1 sequencing defect (VPA-04), not a checklist miss. Note for the builder:
            terraform/github/environments.tf:8-11 records that protected_branches=true in this repository does NOT
            mean main (a ruleset protects main and there is no classic rule); tf_trusted_plan uses
            custom_branch_policies plus branch_pattern instead. A verdict Environment must copy that shape.
          executor_added: false
        - property: X5
          rating: partial
          evidence: |
            T4.32 c2 names a digest-pinned image and a named build-and-publish channel (rec-4477), and T4.2 c13
            asserts one digest across shell, twin and compute plane. Provenance or signing (SLSA, Sigstore/cosign)
            is named by no criterion and rec-4477's text could not be read (degraded). Compensating control: the
            governed build channel plus the one-digest assertion gives integrity AFTER build and catches an
            unreviewed image swap, but it cannot catch a build-time compromise, which is exactly the property
            provenance adds - so partial, not met.
          executor_added: false
        - property: X6
          rating: partial
          evidence: |
            requirements-dev.txt pins litellm==1.106.2 and the rest by ==, and holds ZERO sha256 hashes (grep -c
            sha256 returns 0); litellm appears in no runtime requirements file. Compensating control: the
            digest-pinned image (T4.32 c2) pins the exact installed byte set for every run, which is the property
            that matters at run time; the unpinned-by-hash half remains at build time.
          executor_added: false
        - property: X7
          rating: partial
          evidence: |
            The input is data (T4.2 c8: PR ingested "only as API data ... into a schema-validated input"), output
            is forced structured, personal capabilities deny by default (T4.10a c1), no contract permits merge,
            rec closure or terraform apply (T4.10a c3), and persona code holds no gh, API client or GITHUB_TOKEN
            (T4.2 c13). The prompt-injection-specific mitigations - ingress inventory, provenance tagging of
            log-derived rec text, prompt hardening - are T4.13's and are sequenced after the personas go live
            (VPA-11). Compensating control: a hijacked verdict persona can only emit a verdict, and the
            authority-changing actions it might be steered to take are structurally unavailable, so the residual
            is a wrong verdict, not a wrong merge.
          executor_added: false
        - property: X8
          rating: met
          evidence: |
            Decision 205 cl.2 "fails, never skips, off the author allowlist"; T4.2 c9 "fails rather than skips";
            T4.28 c6, T4.29 c5, T4.30 c5 make the in-session subagent "the fallback for an unavailable verdict ...
            entered visibly and never a skipped gate"; T4.32 c4 makes a missing scout verdict fail plan-critique
            with "re-scout required". Check-name stability is the one limb left to plan detail and is carried as
            added row X17.
          executor_added: false
        - property: X9
          rating: met
          evidence: |
            T4.28 c5, T4.29 c4 and T4.30 c4: advisory check run (CD.12 alarm-not-gate) while the in-session
            subagent still gates; N at least 20 consecutive PRs of verdict agreement read from rec-4434 rows, with
            N and the measure pre-registered in the dual-run plan before its first run; a per-persona flag rolls
            back (c6/c5/c5).
          executor_added: false
        - property: X10
          rating: partial
          evidence: |
            rec-4433 requires a persona key and definition hash per run (named by T4.28 c3, T4.29 c2, T4.30 c2),
            and T4.10a c5 records a rendered-prompt content hash per contract version, so the HARNESS is
            reproducible. Pinned model version and fixed sampling are absent, and the tier-1 ids are aliases whose
            contract note says they remap upstream (docs/contracts/inference-provider.yaml:393-396) (VPA-12).
            Compensating control: the image digest plus the definition hash make any post-change drift visible in
            the capture rows; that does not property-match a version pin, because a silent upstream remap changes
            no hash in this repo.
          executor_added: false
        - property: X11
          rating: partial
          evidence: |
            Per-run cost is bounded by contract (T4.10a c1: max_turns plus max_wall_clock_seconds, one turn = one
            model call), which is a property-matched control for the token-cost limb (a turn cap bounds tokens and
            dollars) and for the wall-clock limb. Per-call timeout, bounded retries and tier-2 fallback on the
            verdict path are named by no criterion (VPA-14), and with no proxy there is no Router to supply them.
            Also no per-run token cap as such.
          executor_added: false
        - property: X12
          rating: partial
          evidence: |
            Capture is designed (rec-4433 persona key and definition hash, rec-4434 per-finding rows, rec-4416
            surface, all named as gating prerequisites by each persona's CAPTURE criterion) and T4.2 c3 carries
            per-turn model/token/cost/latency rows for the compute plane. No criterion says who writes the verdict
            job's rows or with which credential, and rec-4028 (the LiteLLM telemetry producer) is named by no
            persona criterion (VPA-05, VPA-16).
          executor_added: false
        - property: X13
          rating: partial
          evidence: |
            No `concurrency:` block or `timeout-minutes` is required of either verdict workflow by any criterion.
            Compensating control, property-matched for correctness but not for cost: verdicts are per-head-SHA and
            T4.32 c4's fingerprint rule makes a superseded scout verdict harmless (an equal fingerprint means the
            old verdict covers the new head), so an uncancelled run wastes minutes rather than producing a stale
            gate. Half the repo's workflows already declare concurrency (16 of 32), so the practice exists to copy.
          executor_added: false
        - property: X14
          rating: missed
          evidence: |
            No egress allowlist anywhere in the repository: zero workflows reference harden-runner or
            step-security, and no criterion names egress control for the verdict job. The only related text is
            Decision 234 cl.1-2, whose confinement legs are the user-owned sandbox adapters and explicitly not the
            Actions host. Nothing supplies this property even in part.
          executor_added: false
        - property: X15
          rating: partial
          evidence: |
            The content boundary is satisfied structurally: the repository is public (Decision 101), the input is
            PR and main content from this repository only, and the persona holds no secret but the inference key.
            Provider retention terms are named nowhere, and the schema-validated input is not required to exclude
            operational data beyond what Decision 101 already forbids. Compensating control: the schema and the
            public-only corpus mean a leak would require a PR that itself carries the secret into the public
            repository, which the pre-commit never-commit hook already blocks.
          executor_added: false
        - property: X16
          rating: partial
          evidence: |
            During the migration the mandated dual-run (N at least 20, pre-registered) is a genuine regression
            signal, and T4.32 c3's fixture run plus the local_container conformance suite catch contract breakage.
            After REMOVE a prompt or model change has no offline signal at all: the offline lane is T4.14, which is
            deferred_post_mvp (Decision 93), and pulling it forward is a bundling recommendation for the operator
            (Section 13), never a finding. Compensating control: the fixture run would fail on a structurally
            broken prompt, which is a partial property match and the reason this row is not missed.
          executor_added: false
        - property: X17
          rating: partial
          evidence: |
            Executor-added: check-run identity, required-check registration and ruleset interplay. Identity is
            designed (T4.2 c9, distinct from the executor App, executor App holds no checks: write). Not designed:
            a stable required-check name per persona and its registration in the main ruleset, and the fact that
            the repo protects main by a ruleset rather than classic branch protection (terraform/github/repo.tf),
            so making a verdict REQUIRED is a separate admin act that no criterion names. Partial because identity
            is the harder half and is settled.
          executor_added: true
        - property: X18
          rating: n/a
          evidence: |
            Executor-added: merge-queue interaction. No merge queue is configured for this repository and no
            contract mentions one; verdicts are per-head-SHA, so a queue would re-run on the queued SHA with no
            change to this design. The property cannot apply today.
          executor_added: true
    - q: Q4
      verdict: partial
      basis: [VPA-03, VPA-06, VPA-09, VPA-13]
      prose: |
        The strangler shape is sound and measurable per persona; what is missing is the wait, the attribution and
        the consumers. WAIT: a CC-web session cannot sleep or poll (docs/contracts/git-ops.yaml:269-282) and its
        only pass wake is ci.yml's signal-green comment (ci.yml:539-575), whose `needs:` list is an invariant over
        pull_request-triggered jobs; a verdict check run is neither, so "loops on the plan-critique check run"
        (T4.29 c5) and "reads the code-review check run" (T4.28 c6) have no wake (VPA-03). ATTRIBUTION: a
        Claude-subagent vs DeepSeek-persona comparison changes model family, harness, input projection and prompt
        at once, so agreement alone cannot say which to fix; each dual-run must carry a control arm - the SAME
        persona run through run_persona in-session on the same input projection - so the residual difference is
        the model and harness only (VPA-09). CONSUMERS: the flips change two consumers beyond /plan and /implement
        (VPA-06). Proposed pre-registered measures and miss dispositions are in agreement_measures. MERGE
        AUTHORITY at each flip: "critique PROCEED" becomes "the check run named for plan_critic on the PR's head
        SHA has conclusion success AND its structured output's recommendation is PROCEED"; "code review PROCEED"
        becomes the same for code_reviewer; the coordinator reads it from the check run, never from a session
        assertion, and docs/contracts/coordinator.yaml standing_authorisation is reworded to say so in the flip PR.
        WAITING: a worker ends its turn on the PR-activity subscription plus a verdict-completion wake comment
        posted by the verdict job (a wake signal, never the verdict channel, which c9 keeps as the check run); the
        overseer resumes the paused author via SendMessage on that wake. WHICH GATE VERSION REVIEWS THE FLIP: the
        in-session gate as loaded from the flip branch - which is exactly the self-review gap (rec-4476); the
        defensible rule is that a flip PR's gate runs from origin/main's copy, and that .claude/skills/ and
        .claude/commands/ join config/agent/executor/capabilities.yaml boundary_patterns before the first flip, so
        a persona never gates its own flip or removal from edited text.
      agreement_measures:
        - persona: decision_scout
          measure: |
            Primary: exact-enum agreement on the three-value verdict (NO_FLAGS | FLAGS_FOUND | BLOCK) on the same
            head SHA and the same scout-input fingerprint. Secondary: Jaccard >= 0.8 over the decision ids named in
            CONTRADICT rows (BLOCK and WARN alike), and zero cases in which the in-session gate emitted BLOCK while
            the persona emitted NO_FLAGS. N = 25 consecutive plan PRs (floor 20), reported with the two count lines
            the skill already emits.
          n: 25
          agreement_miss_disposition: |
            Hold advisory and revise the prompt projection before re-measuring; if the BLOCK lane is the diverging
            one, add the control arm first and read the residual as model-side. Never flip on a partial window.
        - persona: plan_critic
          measure: |
            Primary: categorical agreement on {PROCEED, REVISE}. Secondary: Jaccard >= 0.7 over blocking findings
            keyed by (tag, anchor), and zero false PROCEEDs - cases where the in-session gate returned REVISE with
            a blocking finding the persona did not reproduce. N = 25 consecutive ready plan PRs (floor 20),
            counting a revision commit as a new observation on its own head SHA.
          n: 25
          agreement_miss_disposition: |
            Zero false PROCEED is absolute: one occurrence holds advisory, adds the control arm and re-measures.
            Otherwise hold advisory and revise the prompt; if agreement stays below target after two prompt
            revisions, move plan_critic to the tier-2 role by contract edit (ports.run_persona.litellm.model) and
            re-measure before flip.
        - persona: code_reviewer
          measure: |
            Primary: categorical agreement on {PROCEED, REVISE}. Secondary: Jaccard >= 0.6 over High and Critical
            findings keyed by (file, issue type), and zero missed Criticals - cases where the in-session gate
            raised a Critical the persona did not. N = 25 consecutive code PRs (floor 20), each PR's head SHA an
            observation.
          n: 25
          agreement_miss_disposition: |
            A missed Critical on a merged PR holds advisory and re-opens the prompt; two holds move code_reviewer
            to the tier-2 role by configuration. If both agree except on Medium/Low volume, flip anyway and record
            the divergence band - Medium/Low rows are filed as recs by the caller and are not gate-driving.
    - q: Q5
      verdict: ready_with_forks
      basis: [VPA-13, VPA-16, VPA-17]
      prose: |
        Eleven work packages in eight waves; see execution_plan. Critical path (tie broken explicitly, see the
        note below): WP-02 -> WP-03 -> WP-05 -> WP-07 -> WP-08 -> WP-09 -> WP-10 -> WP-11. All eight are
        `designed` except WP-07 (`needs_operator_fork`), so the verdict is ready_with_forks. The other chain of the
        same length is WP-01 -> WP-06 -> WP-05 -> WP-07 -> WP-08 -> WP-09 -> WP-10 -> WP-11; Section 14 breaks a
        tie by (a) a non-designed WP, which both chains satisfy only through WP-07, then (b) the chain ending
        latest in the operator's start order, which both satisfy by ending at WP-11. The tie was therefore broken
        by the roadmap's own declared precedence - T4.10a is T4.32's sole depends_on - and the WP-02 chain is
        reported. Off-path packages not `designed`: none. Two off-path packages carry operator forks implicitly
        through their input (WP-06 starts from WP-01's recorded answer) and are marked `designed` for that reason.
        Every open criterion of T4.10a (c1-c8), T4.32 (c1-c4), T4.28 (c1-c7), T4.29 (c1-c6) and T4.30 (c1-c6)
        appears in exactly one package's roadmap_closes, plus the T4.2 criteria those items discharge (c3, c4, c8,
        c9, c10, c12, c13, c14). Deliberately left out: T4.2 c1, c2, c5, c6, c7, c11 and c15 stay on T4.2 itself
        per its own discharge map and per "never T4.15"; T4.25 is reserved and audited as rehomed only.
        Coordinator readiness: docs/contracts/coordinator.yaml is NOT complete enough to run this workstream
        unchanged. Its `critique` step says "rounds follow the planning skill's convergence rule" and
        `plan_pr` says "merge on critique PROCEED + green CI" - both assume an in-session gate that produced a
        PROCEED string; neither names a check run, and `standing_authorisation` repeats the assumption twice
        ("critique PROCEED", "code review PROCEED"). `roles.structure` still authorises workers to run the three
        verdict gates as subagents with no date or flag gating that to the pre-flip state. WP-10's contract edits
        fix all four sentences; until then a coordinator following the contract literally would keep merging on
        session-asserted verdicts after the flip. Two further coordinator-side facts this workstream needs and the
        contract does not carry: a verdict-completion wake (liveness lists CI waits as out of scope, correctly,
        but nothing covers a check-run wait) and a worker-side rule that a check-run conclusion, not a summary,
        is the verdict of record.
    - q: Q6
      verdict: partial
      basis: [VPA-16, VPA-17]
      prose: |
        The design's own bundling is adequate for what it names - three atomic plans under T4.32 and one per
        persona - and inadequate in one respect: it leaves four open recs (rec-4477, rec-4433, rec-4434, rec-4028)
        and one live item (T4.36 c5) unassigned to any plan, while making three of them hard gates on the add and
        dual-run steps. See bundle_dispositions for all seventeen rows. The three that change the build order are:
        rec-4028 bundled into WP-03 (the transport is where per-call token/cost/model telemetry is emitted, and it
        is the only rec no criterion names); rec-4477 bundled into WP-04 (it is the add-step gate and has no plan);
        T4.36 c5 sequenced before WP-02, because it changes two of the three gate skills and the rendered prompts
        (T4.10a c5) must be rendered from the post-T4.36 text or be stale on arrival.
    - q: Q7
      verdict: moderate
      basis: [VPA-04, VPA-05, VPA-06]
      prose: |
        Nine counted rows (two design forks, seven always_ask approvals) plus ten plan_approval rows that are
        listed and not counted: see execution_plan.operator_touchpoints. Settleable BEFORE wave 1: the credential
        delivery fork, the capture-identity fork, the IAM shape that follows from the first, the monthly spend,
        and the persona-contract wording (WP-01 and WP-02 run in wave 1 from those answers). Must wait inside the
        acting worker, because an approval counts only in that worker and covers exactly the text shown
        (docs/contracts/coordinator.yaml approvals): the inference-provider and project-configuration row wording
        in WP-03, the Terraform apply and the two out-of-band key values in WP-06, and the coordinator, overseer
        and project-alignment rewording in WP-10. No fork is left for a worker to settle on advisor evidence
        except the mechanical ones the plan records as settled (per-persona model ids, check-run naming, egress
        hardening if the operator asks for it).
    - q: Q8
      answers:
        - question: Is DeepSeek quality adequate for a BLOCKING gate, and what evidence would show it before flip without an LLM grader?
          answer: |
            Adequate is unproven and unprovable from the repository today; what is provable is agreement with a
            stronger judge on this repo's own artifacts. Without an LLM grader (Decision 231) the usable evidence
            is three-fold and all of it is mechanical: (1) the dual-run of Q4, with its zero-false-PROCEED and
            zero-missed-Critical limbs, over at least 25 PRs per persona; (2) a replay set assembled from merged
            PRs whose defects are known from AFTER the merge - recs filed by ci-rca or by a later fix commit that
            names the file the persona reviewed - so the label is an outcome, not a judgement; (3) the operator's
            blind rating of a sample (Decision 231's c5 lane), recorded as a rate, never as a score. A useful
            pre-flip floor: zero missed Criticals and zero false PROCEEDs over the window, with overall agreement
            stated as a number rather than a pass. If those limbs are met, quality is adequate FOR THIS
            REPOSITORY'S PR SHAPE, which is the only claim the evidence supports.
          basis: [VPA-09]
        - question: Should code_reviewer flip before the plan-PR personas, or does plan-PR routing make the scout first?
          answer: |
            The operator's start order (docs/ROADMAP-PLATFORM.yaml:5898) puts T4.32 first and then T4.28, T4.30,
            T4.29, and it survives the file analysis with one correction. code_reviewer's flip is the cleanest
            first: its files (.claude/commands/implement.md, .claude/skills/implement/SKILL.md) are disjoint from
            the plan pair, its PR stream is the largest (about 205 code PRs a month), and its verdict has a
            deterministic rule already ("REVISE iff any Critical or High"). The plan pair cannot be split: T4.29
            and T4.30 own the SAME two files and one shared /plan re-sequencing, so their flips are one work
            package (VPA-13), and within it the scout must flip with or before the critique because T4.29 c1 makes
            plan-critique fail with "re-scout required" whenever the head's fingerprint has no scout verdict. So:
            T4.28 first, then the scout and the critique together, exactly one wave later than a naive parallel
            plan would put them.
          basis: [VPA-13]
        - question: Bootstrap - the work packages that change the three gates are themselves reviewed by those gates; is that safe at every step?
          answer: |
            Not at every step, and the exposure is narrower than it looks. Until a flip, the gate dispatched on a
            flip PR loads the SKILL.md from the flip branch, so the branch that edits .claude/skills/code-review/
            is reviewed by its own edited copy - Decision 229's stated problem and rec-4476's gap. Nothing structural
            stops it: config/agent/executor/capabilities.yaml boundary_patterns covers .claude/agents/ but not
            .claude/skills/ or .claude/commands/ (lines 25-45). Two mitigations make it safe: the flip PR's gate is
            dispatched from an origin/main worktree (so the reviewing copy is the pre-flip text), and
            .claude/skills/ plus .claude/commands/ join boundary_patterns before the first flip, which also makes
            the executor unable to self-modify them. The REMOVE package needs the same rule; by then the Actions
            persona is the gate and its code is main's, so the exposure closes of its own accord.
          basis: [VPA-06]
        - question: What happens to in-flight plans and branches at each flip?
          answer: |
            Nothing in the design covers them, and the gap is real in both directions. A plan PR opened BEFORE the
            scout flips carries no scout check run, so after the flip it must not be required to have one -
            otherwise a mid-flight plan can never merge. A plan PR opened before the critique flips has its
            in-session critique rounds recorded in the plan's gate_rounds; after the flip those rounds stop arriving
            and the same field silently empties, which breaks the 20-plan revisit the planning skill's convergence
            rule relies on. The flip PR should therefore carry an explicit grandfathering line (a plan PR whose
            first commit predates the flip keeps the in-session gate, recorded in the plan's context) and a
            transcribing rule (the caller copies the check run's verdict and CITE list into context and appends one
            gate_rounds row per check run). The same applies to open build PRs at code_reviewer's flip, where the
            cheaper rule is to re-run the persona once on each open head SHA.
          basis: [VPA-06]
        - question: What is the monthly Actions-minutes and DeepSeek token cost at current volume?
          answer: |
            HYPOTHESIS throughout, because no web lookup ran and pushes-per-PR could not be read (no GitHub tool
            in this session; Section 8's fallback of 3 is used). Volume: 436 first-parent merges in the last 30
            days, of which 208 subjects are plan PRs and about 205 are code PRs by the Section 11 definition (a
            PR doing both counts twice). Runs: 3 pushes per PR means about 624 scout runs, 624 critique runs and
            615 review runs. Tokens per run, from measured inputs: scout 60-100k in and about 2k out (the 168 KB
            index alone is about 42k tokens); critic 40-90k in and about 3k out; reviewer 30-70k in and about 3k
            out. At DeepSeek list prices assumed from my own knowledge (chat about 0.27 USD per M input on a cache
            miss and 1.10 USD per M output; reasoner about 0.55 and 2.19), the monthly inference bill is about
            40-70 USD, dominated by the two plan personas. Actions minutes for a PUBLIC repository are not billed
            on standard runners, so the runner cost is 0 USD at 6 minutes per run and about 4700 runs a month. If
            the repository were private the same load would be about 28000 minutes, which is above the free
            allowance - a reason to keep the image small and to set timeout-minutes and concurrency.
          basis: [VPA-14]
        - question: Does moving the gates off the session change the interactive session's wall-clock loop materially?
          answer: |
            Yes, and asymmetrically. In-session, a gate is a subagent call inside one turn: seconds to a couple of
            minutes, no turn boundary. On Actions, each gate is a queue plus an image pull plus a model run, and a
            CC-web session cannot wait for it inside its turn - it must end the turn and be woken. So one plan
            session becomes one turn per gate round instead of one turn overall, and a revision loop multiplies
            that. For the operator this is a slower, more interrupted /plan; for the Claude-projects coordinator it
            is closer to free, because that coordinator is already turn-based and event-driven (its liveness rules
            explicitly exclude CI waits). The offsetting gain is context: the gate stops paying for the corpus in
            the session's own window.
          basis: [VPA-03]
        - question: Executor-added - who owns the plan artifact's gate bookkeeping once the verdict is a check run?
          answer: |
            Nobody, today. .claude/commands/plan.md:87-89 requires the plan's context to carry "the REQUIRED
            decision-scout verdict + CITE list item" and Step 9 requires one gate_rounds row per critique round,
            both written by the session that reads the subagent's reply. A persona emits a check run and never a
            commit (Decision 205 cl.1), and no criterion gives the caller a transcribing duty. The flip PR should
            add it explicitly, or gate_rounds and the required context item decay to optional prose. The decay is
            already visible in the sample: the item's wording has drifted between "Decision-scout verdict
            FLAGS_FOUND" and "Decision-scout r1 FLAGS_FOUND" across five recent plans.
          basis: [VPA-06]
        - question: Executor-added - what makes a verdict check run REQUIRED, and who registers it?
          answer: |
            Not designed. A check run only blocks a merge once its name is a required status check on main, and
            this repository protects main with a ruleset rather than classic branch protection
            (terraform/github/repo.tf), so making a verdict required is a ruleset edit - an admin act with no owner
            on this path and no criterion naming it. Two consequences worth stating up front: the check name is
            therefore a stable interface and must be fixed before the flip (a rename silently un-gates), and the
            flip criterion itself must be read as "the check run exists and is green", with "required" added as a
            separate operator act at the same moment the in-session dispatch is removed.
          basis: [VPA-06]
        - question: Executor-added - what stops a PR from steering its own verdict, given T4.13 lands later?
          answer: |
            Three structural facts, and they are enough for an advisory check run but not for a blocking one. The
            persona cannot commit, merge, close a rec or apply Terraform (T4.10a c3), it holds no GitHub client and
            no token (T4.2 c13), and its only channel is a structured verdict validated against a schema (T4.2 c8).
            What it can do is be talked into a PROCEED by text inside the diff, and the mitigations for that -
            ingress inventory, provenance tagging of log-derived rec text, prompt hardening - are T4.13 c1-c4,
            which depends_on T4.2 and so lands after the flips. The cheap sequencing fix is to bundle T4.13 c3
            (the hardening requirements) into WP-08, the add step, rather than deferring all four criteria to
            T4.13's own item; that costs one prompt-hardening paragraph and removes the window in which a blocking
            verdict can be steered by the artifact it reviews.
          basis: [VPA-11]
  per_surface_assessment:
    - surface: S1
      maturity: solid
      strengths: |
        The foundation is unusually well specified for an unbuilt surface: a thin shell with the persona in the
        image (T4.2 c8), one image digest across three hosts (c13), a local_container oracle with a gating
        conformance suite (c14), a fingerprint rule that makes a stale scout verdict impossible by construction
        (T4.32 c4), named atomic plans, and a trigger-policy check with a maintainer-actor guard set (c10). The
        strangler, the rollback flag and the fallback are all in text.
      top_gaps: [VPA-01, VPA-04, VPA-05, VPA-07, VPA-12, VPA-14]
    - surface: S2
      maturity: solid
      strengths: |
        The scout's bounded-retrieval design is genuinely credential-free and hermetic (a committed index plus
        targeted reads, chosen for exactly that reason at docs/contracts/instruction-architecture.yaml:195-210),
        its verdict vocabulary is three-valued and closed, and its trigger is the best-specified of the three
        (draft pushes plus fingerprint-change re-runs, T4.30 c1).
      top_gaps: [VPA-01, VPA-03, VPA-06, VPA-09, VPA-10, VPA-13]
    - surface: S3
      maturity: solid
      strengths: |
        The critique is the richest gate and the design keeps its machinery: 12 checks, the closure and
        graduation walks, the plan_obligations arithmetic, and a deterministic PROCEED/REVISE rule. Plan-PR routing
        and the re-scout dependency are correctly shared with the scout through one fingerprint.
      top_gaps: [VPA-01, VPA-03, VPA-06, VPA-09, VPA-10, VPA-13]
    - surface: S4
      maturity: solid
      strengths: |
        The reviewer has the most mature verdict semantics of the three (a deterministic REVISE rule), the largest
        PR stream, an additive-file scope rule that already bounds context, and a capture criterion that names its
        prerequisites. Its flip is the least entangled with other consumers.
      top_gaps: [VPA-02, VPA-03, VPA-05, VPA-06, VPA-09, VPA-10, VPA-11]
    - surface: S5
      maturity: frontier
      strengths: |
        Built and working: ci-rca runs on workflow_run with a maintainer-dispatched fallback, dispatches to
        subagent-plan-review in reconcile and terraform-apply-sandbox, carries least-privilege permissions per job,
        and has a dispatch-only smoke fixture with a sentinel check. It is bundle context only, and no finding
        targets it.
      top_gaps: []
