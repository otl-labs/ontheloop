        T4.10a c7's MCP surface is warehouse-only and the three verdict personas need no warehouse read or write:
        the scout reads a committed index and Decision sections, the critic reads the repo and the plan, the
        reviewer reads the diff and the repo, and all three return findings to a caller that files them. The server
        the criterion names already exists (scripts/agent_sdk/mcp_server.py, 151 lines, projecting DuckLake
        NAMED_READS), so the "no litellm backend exists yet" premise is a build-order fact, not a gap on this path.
      compensating_control: |
        The capability vocabulary denies by default (T4.10a c1) and T4.10a c8 forbids any persona-starting
        capability, so an unbuilt MCP client cannot silently grant a persona more than its contract.
      control_property_match: |
        The property is "a persona's reads are bounded by its contract". The control operates at
        docs/contracts/executor-personas.yaml via validate.py's capability check (T4.10a c2), and it would FAIL if
        the defect were real in the form of an over-broad capability: a contract naming a warehouse verb the
        persona does not need is rejected at validation, which is exactly the surfaced risk.
      decision_or_item_id: "T4.10a c7, T4.10a c1, T4.10a c8"
    - candidate: C6
      why_dismissed: |
        T4.2 c8 requires SHA-pinned actions for the verdict job, which is the only surface the checklist property
        covers here, and the two new workflows are built by WP-04 and WP-05 with that requirement. The tag
        references elsewhere (100+ across 32 workflows, including one moving branch ref,
        pypa/gh-action-pypi-publish@release/v1) are a repo-standing property that no criterion on this path
        governs; the prompt routes them to bundling, and bundle_dispositions sequences them separately.
      compensating_control: |
        The new workflows are the only workflows that can post a verdict, they are authored under a criterion that
        names SHA pinning, and they run from main's definition, so a regression to a tag reference would appear in
        a reviewed diff of the very file the verdict identity comes from.
      control_property_match: |
        The property is "the code that produces a verdict is pinned by content". The control operates on
        .github/workflows/persona-verdict.yml through the reviewed PR that creates it, and it would FAIL if the
        defect were real: a tag-pinned action in that file would be visible line by line in the only diff that
        creates the verdict surface.
      decision_or_item_id: "T4.2 c8, T4.32 c1"
    - candidate: C15
      why_dismissed: |
        The SDK-in-process reading is settled, not open: T4.32's files_in_scope names scripts/llm/client.py and no
        proxy host, port, deployment or credential exists anywhere for one, and client.py's docstring says the tier
        model lands in that file. A proxy would be a separate deployment on someone's substrate, which Decision 205
        cl.1 excludes for a verdict persona's own compute. The consequences of that choice - no Router, so no
        built-in retry or routing - are carried as VPA-14 rather than as a question about which LiteLLM is meant.
      compensating_control: |
        Decision 173's role model plus T4.17 c5's runtime resolution give the configuration-driven provider swap
        without a proxy.
      control_property_match: |
        The property is "provider identity is configuration, not architecture". The control operates at
        docs/contracts/inference-provider.yaml resolved by the transport, and it would FAIL if the defect were real
        in the form of a hardwired provider: a single hardwired client could not satisfy a contract edit that
        changes the resolved provider with no code change, which is exactly the acceptance T4.17 c5 requires.
      decision_or_item_id: "T4.32 c1, T4.17 c5, Decision 173"
    - candidate: C16
      why_dismissed: |
        The hypothesis that the path is dispatchable with no further design work is false, and this audit's
        finding set is the counter-evidence rather than a restatement of it: four undesigned or unowned
        prerequisites (VPA-01 corpus source, VPA-03 check-run wake, VPA-04 credential home, VPA-05 capture writer)
