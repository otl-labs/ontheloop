    - q: Q4
      verdict: partial
      basis: [VPA-01, VPA-02, VPA-04, VPA-07, VPA-12]
      prose: >-
        The order add -> dual-run -> flip -> remove is sound and measurable per persona once four things the
        criteria leave open are written down. (1) Measure: the criteria pre-register N and 'an agreement measure'
        but give no reset rule; the measures below compare outputs only (outcome parity, Decision 206 cl.4) from
        rec-4434 rows joined on the PR head SHA, and the count restarts when either lane's definition hash
        (rec-4433) or the served model string changes, so C8's attribution problem (model, harness, projection or
        prompt) is dissolved by construction rather than diagnosed: a prompt change is a new window, a model change
        is a new window, and the harness and projection are fixed within a window. (2) Vocabulary to check-run
        conclusion (C9): NO_FLAGS -> success; FLAGS_FOUND -> success with the flags in output.text (the human reads
        them at the alignment sign-off, as today; T4.9a c7 accepts success only); BLOCK -> failure; PROCEED ->
        success; REVISE -> failure; a missing, malformed or timed-out verdict -> failure, never neutral or skipped.
        (3) Waiting (C13): the session or worker subscribes to the PR and is woken by the verdict wake WP-12 adds
        (VPA-02), then confirms the check run by get_check_runs; the watcher beat stays a backstop. (4) Consumers
        (C18): write the consumer text once, flag-aware, so each flip is a flag default change (VPA-01). Merge
        authority after a flip: 'critique PROCEED' means the plan_critic check run on the merge-time head SHA has
        conclusion success and no 're-scout required' failure; 'code review PROCEED' means the code_reviewer check
        run on that head has conclusion success; the worker passes expectedHeadSha to the merge, and the merge_gate
        hook refuses a merge whose flag-selected persona check is not success (VPA-07). A worker or the overseer
        waits event-driven on the PR subscription plus the verdict wake and never polls. Gate version for a WP that
        changes a gate: before the first flip, a PR touching .claude/skills/<gate>/ or .claude/commands/ has its
        in-session gate load the skill text from origin/main (git show), closing rec-4476's interactive half early;
        after the flip the Actions persona runs main's definition by construction (T4.2 c8). A persona may gate its
        own flip PR: the flip edits consumer text, not the persona definition, and the REMOVE PR that edits the
        in-session skill is reviewed by the Actions persona from main, so both are safe. Miss dispositions are
        pre-written per persona below so the coordinator meets no unplanned fork; a persona that never reaches N
        stays advisory, which is a valid end state recorded as a dated note on its item.
      agreement_measures:
        - persona: decision_scout
          measure: >-
            Verdict-class equality (NO_FLAGS | FLAGS_FOUND | BLOCK) AND recall 1.0 of the in-session lane's
            CONTRADICT decision ids at BLOCK or WARN within the Actions lane's CONTRADICT set, computed per PR from
            rec-4434 rows joined on the head SHA (the in-session row from the claude_code producer's parser, the
            Actions row from stored content); CITE-set Jaccard reported, not gating. A PR counts once, on the last
            head SHA both lanes scouted.
          n: 20
          agreement_miss_disposition: >-
            Hold advisory (the in-session gate keeps gating). Classify the miss: a BLOCK or WARN id the Actions lane
            did not flag -> revise the rendered prompt or the tag shortlist (a definition-hash change restarts N);
            an Actions-only flag the operator adjudicates blind as real -> record it as an in-session escape, no
            reset. After two prompt revisions still missing, select deepseek/deepseek-v4-pro for decision_scout in
            ports.run_persona.litellm.model (a contract edit under Decision 173 cl.2, spend re-estimated and
            re-approved) and restart N. Never flip on a partial window.
        - persona: plan_critic
          measure: >-
            Recommendation equality (PROCEED | REVISE) AND, when both lanes say REVISE, at least 60 percent of the
            in-session lane's blocking findings matched by anchor (plan field path or VP step id, rec-4434) in the
            Actions lane; Actions-only blocking findings are tallied and adjudicated blind by the operator (Decision
            231 cl.2) as a reported precision figure, not a gate. One PR counts once, on its final ready head SHA.
          n: 20
          agreement_miss_disposition: >-
            Hold advisory. If misses concentrate on scope-file content, widen the input projection (a plan-level
            change to the contract's input_schema, which also changes the definition hash and restarts N) before
            touching the prompt; otherwise revise the rendered prompt (restarts N). After two revisions, select
            deepseek/deepseek-v4-pro for plan_critic by configuration and restart N. A persona that never reaches N
            stays advisory indefinitely; record that as a dated note on T4.29, never as a skipped gate.
        - persona: code_reviewer
          measure: >-
            Verdict equality (PROCEED | REVISE) AND recall of at least 50 percent of the in-session lane's Critical
            and High findings by anchor (same file, line within 5) in the Actions lane; Actions-only Critical or
            High findings adjudicated blind by the operator, with a false-positive rate above 20 percent over the
            window counting as a miss. One PR counts once, on its final head SHA before merge.
          n: 20
          agreement_miss_disposition: >-
            Hold advisory. False positives dominating -> add the exemptions source and finding-origin discipline to
            the rendered prompt (restarts N); recall misses -> check the import-closure projection first, then the
            prompt. After two revisions, select deepseek/deepseek-v4-pro by configuration and restart N. Never
            loosen the measure to reach a flip (Decision 235).
    - q: Q5
      verdict: ready_with_forks
      basis: [VPA-10, VPA-03, VPA-04, VPA-01, VPA-13]
      prose: >-
        See execution_plan. critical_path is the longest depends_on chain ending at a REMOVE WP: WP-00 -> WP-01 ->
        WP-07 -> WP-11 -> WP-12 -> WP-14 -> WP-15 -> WP-17 -> WP-19 -> WP-20 (ten WPs, ending at the plan-PR
        REMOVE that closes T4.29:c6 and T4.30:c6; the code_reviewer branch WP-13 -> WP-16 -> WP-18 is shorter).
        No WP on it is undesigned; WP-11 (image channel) is needs_operator_fork, so the verdict is
        ready_with_forks. Off the path, WP-04 (credential delivery) and WP-16 (handoff-gate interplay) are also
        needs_operator_fork; all three forks are listed in WP-00 so the operator can settle them before wave 1 and
        collapse the verdict to ready. Every open criterion of T4.10a, T4.32, T4.28, T4.29 and T4.30, and every
        T4.2 criterion T4.32 c1 names (c4, c8, c9, c10, c12, c13 and c14 non-compute legs), appears in exactly one
        WP's roadmap_closes; none is left out. Item COMPLETION (as distinct from criterion closure) of T4.32 and the
        three persona items also needs T4.10a complete, which is WP-10's plan_agent and implement_agent contracts
        plus the c1 rescope in WP-01 (VPA-09). docs/contracts/coordinator.yaml (status draft) can run this
        workstream with two amendments: its critique step (line 83) and plan_pr step (line 84) assume the
        planning skill's in-session convergence loop and 'critique PROCEED' as a subagent verdict, and
        standing_authorisation (lines 133-135) names 'critique PROCEED' and 'code review PROCEED' without saying
        which lane -- WP-09 rewrites them flag-aware; and its liveness section (lines 193-203) excludes self_wake
        for CI-like waits, so the verdict wake (VPA-02) must exist before any worker waits on a check run. Its
        approvals rule (an approval counts only in the acting worker) is why most touchpoints cannot be settled
        before wave 1; the three forks and the spend ceiling can.
    - q: Q6
      verdict: partial
      basis: [VPA-08, VPA-01, VPA-07, VPA-05, VPA-06]
      prose: >-
        See bundle_dispositions. The design's own bundling names the right recs where criteria name them (rec-4477,
        rec-4433, rec-4434, rec-4490, rec-4476) and misses five bundles the path needs: rec-4028 (the producer),
        the flag-aware consumer contracts, the merge-gate predicate (rec-4080 at the same seam), the model-id
        correction, and the co-location of rec-4566 with the api_key row fix in one file. T4.26 and rec-4506 are
        sequenced separately after WP-12 (they reuse the chain and image; the operator rules on pulling T4.26
        forward); the SHA pinning of existing workflows is a standalone S plan; T4.13 c3 is pulled into WP-01 as a
        prompt clause; T4.14 fixtures stay deferred (Decision 231).
    - q: Q7
      verdict: heavy
      basis: [VPA-03, VPA-10, VPA-04, VPA-01]
      prose: >-
        See execution_plan.operator_touchpoints: 18 counted rows (4 design forks, 14 always_ask acts) plus 20
        plan approvals. Four can be settled before wave 1 as WP-00's rulings (credential delivery, image registry
        and provenance, per-persona model selection, the handoff-gate ruling for draft pushes) together with one
        spend ceiling; the thirteen remaining acts are verbatim contract-text, IAM and admin approvals that
        coordinator.yaml's approvals rule binds to the acting worker. Nine of the fourteen always_ask acts are
        'Decision text and governing contract text' approvals, so the operator's load is mostly reading short
        wording, not deciding.
    - q: Q8
      answers:
        - question: "Is DeepSeek's quality on long, tool-heavy repository review adequate for a BLOCKING gate, and what evidence would show it before flip without an LLM grader (Decision 231)?"
          answer: >-
            Unknown today and knowable only from the dual-run window: the pre-registered measures in Q4 are
            deterministic comparisons of structured outputs (verdict class, anchor recall) against the in-session
            lane, plus the operator's blind adjudication of Actions-only findings, which is exactly Decision 231
            cl.2's grader shape (code checks, real outcomes, blind operator ratings). Two further non-LLM signals
            cost nothing: escape ground truth (post-merge ci_rca recs on PRs the Actions reviewer passed, T4.14 c5's
            shape) and the per-run served-model string, so a quality shift from a silent upstream build change
            (DeepSeek ships V4.1-Flash-1017 under the unchanged alias deepseek-flash) is visible as a reset. The
            inputs are long but not tool-heavy once projected: a workspace-less persona reads a materialised
            snapshot through one read tool, so the model's tool-use burden is a handful of section reads, not a
            shell loop. Risk to state plainly: the in-session lane is a Claude model in an interactive harness, so
            agreement measures parity with that reference, not truth; blind adjudication is the only truth signal
            before flip.
          basis: [VPA-12, VPA-05]
        - question: "Should code_reviewer flip before the plan-PR personas, or does plan-PR routing (T4.32 c4) make the scout first?"
          answer: >-
            Keep the operator's start order (code_reviewer first) for the add steps, because the reviewer has the
            simplest routing (any code PR) and no fingerprint dependency, but expect the scout and critic to flip
            later by construction: the critic waits on the scout ('re-scout required'), both need WP-05's
            fingerprint, and their flips reorder /plan Steps 6-8. Start WP-05 in wave 1 so the plan-PR personas are
            not delayed by it. Volume favours the plan-PR side (147 plan-adding merges and 352 plan-touching merges
            versus 205 code merges in 30 days), so their flips remove more interactive wall-clock once they land.
          basis: [VPA-04]
        - question: "Bootstrap: the WPs that change the three gates are themselves reviewed by those gates; is that safe at every step?"
          answer: >-
            Safe with one rule added before the first flip: a PR touching a gate's own skill or command text has its
            in-session gate load that text from origin/main (the self-review gap rec-4476 names). After a flip the
            Actions persona runs main's definition, so the flip PR (consumer text) and the REMOVE PR (skill text) are
            reviewed by the unmodified persona. The one place the rule does not reach is the overseer path, which
            dispatches gates 'unmodified' from the branch until WP-09 makes its trampoline flag-aware.
          basis: [VPA-01]
        - question: "What happens to in-flight plans and branches at each flip?"
          answer: >-
            The flag is read at each gate dispatch, so an in-flight plan continues under whichever value it meets
            next. A plan PR opened before the scout flip has no scout check; its next push runs the chain, the
            fingerprint differs from 'none', the scout runs, and the critic's 're-scout required' failure clears.
            An implementation branch mid-flight at the reviewer flip gets a check run on its next push; its session
            reads the flag at Step 5 and switches to the check run. gate_rounds rows record which lane produced each
            verdict, so the plan's audit trail stays legible across the flip.
          basis: [VPA-02]
        - question: "What is the monthly Actions-minutes and DeepSeek token cost at current volume?"
          answer: >-
            Actions: zero dollars -- standard GitHub-hosted runners are free for public repositories
            (https://docs.github.com/en/billing/managing-billing-for-your-products/managing-billing-for-github-actions/about-billing-for-github-actions),
            though the chain would consume roughly 9,000 runner minutes a month. DeepSeek (deepseek-flash, blended
            peak/off-peak, HYPOTHESIS on tokens per run): measured volume 434 merges in 30 days (147 adding a plan,
            205 changing code); runs per PR 3.2 for code PRs (sampled commits per PR 1, 4, 1, 7, 3), about 2 scout
            runs and about 6 critic runs per plan PR (sampled critique rounds 13, 5, 5, 4); cumulative input per run
            0.9M (scout), 1.05M (critic), 1.7M (reviewer) tokens with about 85 percent cache hits and 15-20k output
            tokens: about USD 0.05, 0.06 and 0.08 per run, so about USD 14 + 52 + 54 = USD 120 a month, range 100-350
            with thinking on and peak pricing; selecting deepseek-v4-pro for the critic adds about USD 150-250. The
            in-session gates today spend the operator's Claude subscription allowance instead, which this frees.
          basis: [VPA-05]
        - question: "Does moving gates off the session change the interactive session's wall-clock loop materially?"
          answer: >-
            Per round it is roughly neutral (an Actions verdict is queue plus image pull plus a 2-5 minute persona
            run, against a 3-6 minute in-session subagent) and the parent session stops paying to read subagent
            output. Two changes are material: the code_reviewer flip requires a draft PR before review, which under
            the handoff evidence gate means a 20-25 minute full tier per push and a race against a main that merges
            every 10-15 minutes (rec-4790) unless the draft-push ruling is made (VPA-04); and the critic loop
            averages many rounds (13 observed on one plan), each now a push that re-runs the chain, so the verdict
            wake (VPA-02) must be reliable or every round stalls.
          basis: [VPA-04, VPA-02]
        - question: "Executor-added: does the persona check run need to be a required status check, and can it be?"
          answer: >-
            Not for the interim coordinator, and not yet: rec-4624 forbids editing the main-protection ruleset until
            the provider models two keys, and bypass_actors keeps admin bypass always. Until then the merge_gate hook
            is the enforcement seam (VPA-07); registering the checks as required is a later github-root apply once
            rec-4624 lands, and the orchestrator's acceptance rule is T4.9a c7.
          basis: [VPA-07]
        - question: "Executor-added: should any out-of-scope fresh-context check join the migration?"
          answer: >-
            Not now. The REPORT-ONLY deliverable critique (/plan Step 10) and the /audit verification subagents are
            low-volume and human-consumed; the coordinator's advisor_consults decide nothing and Decision 231 cl.4
            treats the consult as a judgment persona that may justify a more capable selection, the opposite of the
            doing personas' cost argument. Revisit after the three flips, when the chain, image and projection
            exist and a fourth persona is a contract plus a routing rule.
          basis: []
        - question: "Executor-added: is the routing rule's bookkeeping-field list (T4.2 c12) complete in practice?"
          answer: >-
            Yes on the sample: all four sampled implementation PRs that touched their plan file changed only
            implementation_declared (PR 1847, 1840, 1839, 1841), so c12 routes them as implementation PRs and no
            build PR would receive scout and critic verdicts. Record the observed field set in the routing module's
            test so a future implement-skill write to another plan field is caught before it reroutes builds.
          basis: []
