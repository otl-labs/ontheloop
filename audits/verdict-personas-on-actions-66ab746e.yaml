      title: "No wake reaches a waiting session when a verdict check run completes, and the verdict chain designs none"
      evidence: "docs/contracts/git-ops.yaml:269-283 (subscribe_pr_activity delivers failures, not CI success; the CI-green comment is the pass wake); .github/workflows/ci.yml:539-569 (signal-green posts it only for ci.yml's own checks on agent branch prefixes); docs/contracts/coordinator.yaml:193-203 (CI waits stay event-driven, self_wake excluded); T4.32:c1, T4.28:c6, T4.29:c5, T4.30:c5 (no wake named); rec-3335 (the comment wake failed once, n=1)"
      evidence_kind: static
      current_behavior: "A session waits on a PR by subscription and is woken by failures, comments and closes; a successful check run from another workflow produces no wake, and the repository forbids polling and self-wakes for CI waits."
      ideal_behavior: "Every verdict completion wakes the subscribed session or worker through a signal verified to deliver, and the session reads the Checks API for the verdict."
      gap: "The flipped /plan critique loop and /implement review wait on a check run with no designed wake; the dual-run comparison inherits the same stall."
      compensating_controls_considered: "The coordinator's watcher beat (2 h day, 6 h night) is a lost-wake backstop for green-and-unmerged PRs, not a gate wake; its latency breaks a 5-13 round critique loop. subscribe_pr_activity's delivery of check_run events is unverified."
      change_type: add
      proposed_change: "WP-12: the verdict shell posts an idempotent wake per (head SHA, persona) on the event class rec-3335's diagnosis proves to deliver (a PR comment as ci.yml does, or a value-free label toggle), never carrying the verdict value; git-ops.yaml wake_signals gains a verdict_posted row; T4.32 c3's fixture run proves a subscribed CC-web session wakes."
      acceptance: "The fixture run (T4.32 c3) shows a CC-web session subscribed to the fixture PR woken by the advisory check run; git-ops.yaml wake_signals names the verdict wake."
      severity: high
      severity_rationale: "Blocks autonomous execution of every flipped loop (NS6) and the dual-run's wall-clock; the available controls are excluded by contract (no polling, no self_wake for CI waits) or hours late (watcher)."
      confidence: CONFIRMED
      roadmap_crossref: {classification: novel, item_ids: ["T4.32:c1", "T4.32:c3"], dedup_search_terms: ["wake check run comment verdict session subscribe signal"], dedup_hit_count: 0, note: "105 rows returned; rec-3335 owns the fragility of the CI-green comment wake, not a verdict wake; rec-3221 and rec-3389 are unrelated"}
      effort: S
