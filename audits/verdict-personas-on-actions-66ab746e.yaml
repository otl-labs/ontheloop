    - q: Q2
      verdict: partial
      basis: [VPA-05, VPA-06, VPA-13]
      prose: >-
        Fitness holds on capability and fails on identity. DeepSeek's current API models (deepseek-flash =
        DeepSeek-V4.1-Flash-1017, deepseek-v4-pro = DeepSeek-V4-Pro-0813) have a 1M context, 384K max output,
        function calling, json_object output and thinking mode (https://api-docs.deepseek.com/quick_start/pricing),
        so every persona input fits: the scout's whole decisions index is 170,005 bytes (about 42k tokens, cache-
        friendly as an identical prefix), the critic's worst sampled plan is 82,543 bytes plus a 42-row scope, the
        reviewer's largest sampled diff is 131,916 bytes (about 33k tokens) plus one level of imports. LiteLLM's
        SDK is the right transport shape (in-process litellm.acompletion with the litellm.mcp_client bridge over
        stdio, https://docs.litellm.ai/docs/mcp); the three skills need no warehouse read today, so T4.10a c7's MCP
        surface is not on the path (C3 rejected). Structured output: DeepSeek documents json_object only
        (https://api-docs.deepseek.com/guides/json_mode: include the word json, set max_tokens, content may come back
        as spaces) and LiteLLM lists no json_schema support for it
        (https://docs.litellm.ai/docs/completion/json_mode), so T4.2 c8's forced structured output is json_object plus
        client-side schema validation (litellm.enable_json_schema_validation or the contract's own validator) and a
        bounded schema-repair retry (T4.11 c4 shape) with blank content treated as failure. Identity: the contract's
        tier_1 ids deepseek/deepseek-chat and deepseek/deepseek-reasoner were discontinued on 2026-07-24 and their
        remap target deepseek-v4-flash retired on 2026-09-10 (https://api-docs.deepseek.com/updates), and DeepSeek
        offers no dated snapshot ids, so pinning means recording the served model string per run and resetting the
        dual-run window when it changes (VPA-05). Recommended selection: deepseek/deepseek-flash for all three
        personas (thinking on for plan_critic and code_reviewer, off for decision_scout, whose work is a tagged
        shortlist and targeted reads), with deepseek/deepseek-v4-pro recorded as the named escalation for
        plan_critic only if its dual-run misses; the home is ports.run_persona.litellm.model per persona and
        inference-provider.yaml litellm_tier_models. Credentials: the api_key row names one variable
        (ANTHROPIC_API_KEY) for a two-role transport (VPA-06). Timeouts, bounded transport retries and a fail-over
        to the tier-2 role only on provider unavailability (never on a malformed verdict) are plan-level under
        Decision 173 cl.1 and T4.11 c3-c4, unstated for verdicts. What changes: the input projection (a workspace-
        less persona reads a materialised head-tree snapshot and main's governance docs through a read tool, VPA-13)
        and the output (the skill's verdict vocabulary rendered as a JSON schema). What stays: each skill's method
        becomes the rendered system prompt (T4.10a c5), its verdict vocabulary and its finding anchors.
