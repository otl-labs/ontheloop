  findings:
    - id: VPA-01
      origin: C18
      surface: shared
      affected_surfaces: [S2, S3, S4]
      question: Q4
      dimension: VD7
      title: "Flip criteria name only /plan and /implement; the overseer trampoline, coordinator contract, lifecycle state machine and alignment carriers are unnamed gate consumers"
      evidence: "docs/ROADMAP-PLATFORM.yaml T4.28 files_in_scope (.claude/commands/implement.md, .claude/skills/implement/SKILL.md), T4.29 and T4.30 files_in_scope (.claude/commands/plan.md, .claude/skills/planning/SKILL.md); docs/contracts/overseer-dispatch.yaml:64-73,209-272; docs/contracts/coordinator.yaml:72-75,83-86,132-135; docs/contracts/tier-item-lifecycle.yaml:328-345; docs/contracts/project-alignment.yaml:58-62"
      evidence_kind: static
      current_behavior: "Four consumers dispatch or merge on the in-session gates: the overseer dispatches every gate as a fresh sibling, the coordinator contract lets workers run the gates as subagents and merges on 'critique PROCEED' and 'code review PROCEED', the lifecycle state machine interleaves bookkeeping with the subagent, and project-alignment lists the PR flow as a future carrier. No flip criterion or files_in_scope names any of them."
      ideal_behavior: "Every consumer reads the per-persona flag: a flipped persona's verdict is its check run on the head SHA for the overseer, the coordinator's workers and the lifecycle state machine alike; the contracts say so in one flag-aware rewording."
      gap: "A coordinator executing a flip WP from the criteria would flip /plan or /implement and leave the overseer dispatching in-session gates and its own standing_authorisation ambiguous between two lanes."
      compensating_controls_considered: "Decision 229's 2026-11-02 update rules that a session runs a gate after flip only as the fallback, a rule with no edit behind it; the overseer skill says gates run 'unmodified' (overseer/SKILL.md:16-17), so the result is double gating rather than a skipped gate, but two authorities for one merge rule."
      change_type: rescope
      proposed_change: "Add the four consumer files to the persona items' files_in_scope (or to T4.32 as shared scope) and write the consumer text once, flag-conditional, in WP-09: the trampoline, the lifecycle state machine and standing_authorisation read gates.<persona>.verdict_source; each flip then changes a default."
      acceptance: "A test asserts coordinator.yaml standing_authorisation, overseer-dispatch.yaml's three gate stages and tier-item-lifecycle.yaml name the flag and the check-run read; T4.28, T4.29 and T4.30 files_in_scope list the consumer files."
      severity: high
      severity_rationale: "Blocks autonomous execution (NS6): the coordinator has no criterion naming its own contract, and after a flip two live gate definitions make 'merge on critique PROCEED' ambiguous; no property-matched control exists because the persona check is not a required check."
      confidence: CONFIRMED
      roadmap_crossref: {classification: novel, item_ids: ["T4.28:c6", "T4.29:c5", "T4.30:c5"], dedup_search_terms: ["overseer coordinator flip check run gate consumer standing authorisation"], dedup_hit_count: 0, note: "recs_related returned 242 rows (top rec-4899, rec-3039, rec-4518, rec-4026, rec-3264); none owns a gate-consumer rewording at flip"}
      effort: M
      depends_on: []
      sequencing: {safe_to_queue_now: true, blocked_behind: [WP-03], note: "WP-09 shares project-configuration.yaml with WP-03, so wave 2"}
