    dd_a:
      - {persona: decision_scout, read: "caller brief: intent, proposed approach, scope file list, verification tier, cited decision ids (SKILL.md:28-35)", designed_source: input, note: "from the plan YAML blob at the head SHA; the approach text is an input but excluded from the fingerprint (T4.32 c4)"}
      - {persona: decision_scout, read: "docs/decisions-index.json whole (SKILL.md:26; 170,005 bytes, 197 live entries)", designed_source: input, note: "materialised by the shell from main's checkout, never the PR head; an identical prefix across runs, so cache-friendly"}
      - {persona: decision_scout, read: "targeted DECISIONS.md sections for the shortlist (rg '^## Decision N:', SKILL.md:46)", designed_source: input, note: "the shortlist is judged inside the run, so main's DECISIONS.md (1,108,367 bytes) must be an input blob served by a read tool; no read_input capability exists in T4.10a c1's vocabulary (VPA-13)"}
      - {persona: decision_scout, read: "bin/venv-python -m scripts.roadmap.scope_projection <scope paths> (SKILL.md:63)", designed_source: input, note: "deterministic; the shell runs main's script over the plan's scope paths and main's roadmap"}
