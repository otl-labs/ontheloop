        repo-wide SHA pinning sequence separately; T4.14 fixtures defer.
    - q: Q7
      verdict: moderate
      basis: [VPA-01]
      prose: >-
        6 counted operator_touchpoints rows (3 on WP-00 settle before wave 1: the credential mechanism fork,
        the out-of-band secret value, the human-gated terraform/github apply; 1 spend row with a monthly
        estimate; 2 contract-text approvals inside their acting workers), plus 1 plan_approval row (not
        counted) covering write_the_plan for every plan WP. Every always_ask class in a WP's list is covered
        by a row naming that WP.
    - q: Q8
      answers:
        - {question: "Is DeepSeek's quality on long, tool-heavy repository review adequate for a BLOCKING gate, and what evidence would show it before flip (no LLM grader, Decision 231)?", answer: "Evidence before flip is the dual-run agreement on N>=20 consecutive real PRs per persona with the pre-registered measure (Q4), graded by code, never an LLM; the offline lane (T4.14, deferred) adds replay later. Recommend reasoner for scout/critic, chat for code review; on a miss, hold advisory and move the persona to the tier-2 role by contract edit.", basis: [VPA-06]}
        - {question: "Should code_reviewer flip before the plan-PR personas, or does plan-PR routing (T4.32 c4) make the scout first?", answer: "code_reviewer first is safe - it is independent of plan-PR routing. The scout must precede the critic because T4.29 c1 fails 're-scout required' until the head's fingerprint has a scout verdict; the operator's start order (T4.32, then T4.28, T4.30, T4.29) already matches this.", basis: []}
        - {question: "Bootstrap: the WPs that change the three gates are themselves reviewed by those gates - is that safe at every step?", answer: "Yes with one accepted residual: until a gate's flip, its changing WPs are reviewed by the in-session gate from the branch (the rec-4476 self-review residual, closing at flip when .claude/skills/ and .claude/commands/ join boundary_patterns); the flip PR is the last in-session-reviewed change; post-flip WPs are reviewed by the Actions persona from main's definition, which reads the PR diff, not the branch's edited skill text.", basis: [VPA-04]}
        - {question: "What happens to in-flight plans and branches at each flip?", answer: "The per-persona flag rolls back individually; in-flight plan PRs keep verdicts already posted; the scout-input fingerprint (T4.32 c4) lets one scout verdict cover later head SHAs with an equal fingerprint, and revision commits re-trigger, so no in-flight PR is left uncovered.", basis: []}
        - {question: "Monthly Actions-minutes and DeepSeek token cost at current volume?", answer: "436 first-parent merges in 30 days (plan-only 218, code-only 67, both 137); runs per PR ~3 (HYPOTHESIS, mcp__github__pull_request_read unavailable) -> ~1,300 head-SHA runs/month; ~40K input tokens/run at ~80% cache hit, $0.252/$0.378 per 1M in/out (CD.28 figures) -> ~USD 5-15/month DeepSeek; ~5-10 Actions minutes/run -> ~USD 80-150/month; total ~USD 100-170/month. All HYPOTHESIS (web unavailable).", basis: []}
        - {question: "Does moving gates off the session change the interactive session's wall-clock loop materially?", answer: "The in-session subagent latency leaves the loop but a check-run wait enters; net effect is measured during dual-run by recording per-gate wall-clock in the rec-4434 rows. Expect neutral-to-positive for /plan (scout and critique serialize today) and a wait-for-check-run for /implement.", basis: [VPA-02]}
        - {question: "Do the REPORT-ONLY Step 10 deliverable critique, /audit verification subagents, project-alignment sign-off or advisor consults join the migration?", answer: "No. Only the three gates migrate; the Step 10 report critique, /audit subagents and advisor consults are read-only or human gates outside the three-gate scope (Section 4), and the project-alignment sign-off stays a human gate (T4.29 c5 amendment).", basis: []}
