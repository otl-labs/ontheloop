audit:
  meta:
    audited_commit: b3044d78
    base_branch: main
    model: mistral-vibe (Mistral Vibe CLI harness)
    methodology_version: 1
    scope_surfaces: [S1, S2, S3, S4, S5]
    degraded_dedup: false
    web_unavailable: true
    contract_notes: >-
      Operator waived Section 5 step 0 (hook canary) for this harness; the repo's Claude Code hooks do not
      run here. Web access unavailable in this harness: 0 of 12 external lookups used; every row depending
      on an external fact is confidence HYPOTHESIS. mcp__github__* tools are unavailable here, so Section
      16 step 5's fallback applies (final message names branch, sha, error, intended PR title/body) and
      commits-per-PR is assumed 3 (HYPOTHESIS). Branch name carries -r2 because
      audit/verdict-personas-on-actions-b3044d78 already existed locally; deliverable filenames keep the
      sha. Preflight OK (logs/.preflight-report.json written, gitignored); rec reader live (recs_by_ids
      used for all named recs); roadmap parse OK (186 tier_items). always_ask enum re-read from
      docs/contracts/coordinator.yaml: eight items, no drift. Advisory `scripts.validate --pre` was not
      run: the harness approval callback denied the invocation, so no unrelated failures were observed
      or recorded.
    stale_anchors:
      - "config/agent/executor/capabilities.yaml boundary_patterns '.claude/agents/' cited at line ~32, actually line 11; content verified (.claude/skills/ and .claude/commands/ absent as claimed)"
  question_answers:
    - q: Q1
      verdict: partial
      basis: [VPA-08, VPA-01, VPA-09]
      prose: >-
        The designed chain T4.10a -> T4.32 -> {T4.28, T4.29, T4.30} is complete and correctly ordered: T4.10a's
        only depends_on is T1.12 (complete); T4.32's only depends_on is T4.10a; each persona item depends
        only on T4.32 and its intent forbids inheriting T4.1/T4.9a/T4.15. No circular edge: T4.32 c1
        references T4.17 c5 but discharges it (runtime tier resolution), it does not depend on it; T4.13,
        T4.26, T4.27, T4.34 hang off T4.2/T4.32 in the reverse direction only. rec-4043 (T4.2 c15) binds
        executor personas, not the Actions verdict personas, so it is not a prerequisite here. Named rec
        prerequisites: rec-4477 (T4.32 c2), rec-4433/rec-4416/rec-4434 (persona capture criteria). Two gaps
        keep this partial: the LiteLLM telemetry producer rec-4028 (open) is not named in any persona
        criterion although the per-finding rows key to its model_call rows (VPA-08), and the verdict-job
        credential path has no owning Terraform resource and an unmade mechanism fork (VPA-01).
    - q: Q2
      verdict: partial
      basis: [VPA-05, VPA-06]
      prose: >-
        Fitness is plausible but not fully designed. Tool calling: DeepSeek models support function calling
        via LiteLLM (HYPOTHESIS, web unavailable); the MCP read surface binds to one On The Loop MCP server
        consumed by the litellm backend as an MCP client (T4.10a c7) - LiteLLM SDK MCP-client support is
        HYPOTHESIS. Context window: sampled code PRs peak at 42 files / ~1.6K changed lines plus the
        skill's required reads; this fits even a 64K-token window, and deepseek-chat/reasoner are documented
        at 64K-128K (HYPOTHESIS). Per-persona model: recommend deepseek-reasoner for decision_scout and
        plan_critic (judgment over the decisions corpus) and deepseek-chat for code_reviewer (diff-heavy
        review); the selection home is ports.run_persona.litellm.model / inference-provider.yaml, set per
        persona contract. Structured output: T4.2 c8 forces it and T4.10a c1 gives one output schema per
        persona; DeepSeek JSON-mode support via LiteLLM is HYPOTHESIS. Gaps: resolved model version is not
        pinned per run (VPA-06), the api_key registry row names ANTHROPIC_API_KEY against a DeepSeek-direct
        tier 1 (VPA-05), and no criterion states per-call timeout, bounded retries, tier-2 fallback or a
        per-run token cap (X11 missed). What changes per persona: the input projection and prompt only;
        the skill methodology stays.
    - q: Q3
      verdict: partial
      basis: [VPA-01, VPA-03, VPA-06]
      prose: >-
        Judged against the design (criteria text) plus what is built; all external-fact rows are HYPOTHESIS
        (web unavailable). The verdict chain's core security properties are designed (X1, X2, X3, X4, X8,
        X9, X12, X17 met); the misses are dependency locking (X6), provider resilience (X11), concurrency
        hygiene (X13), runner egress (X14) and ruleset/merge-queue interaction (X18); partials are image
        provenance (X5), injection hardening sequencing (X7, VPA-03), reproducibility (X10, VPA-06), data
        governance (X15) and the offline regression set (X16).
      external_checklist:
        - {property: X1, rating: met, evidence: "T4.2:c8 + Decision 205 cl.2: secretless pull_request (no checkout, permissions {}) chained by workflow_run; pull_request_target never a persona trigger", executor_added: false}
        - {property: X2, rating: met, evidence: "T4.2:c8 permissions {} on the trigger; T4.2:c9 verdict identity = job GITHUB_TOKEN, executor App holds no checks:write", executor_added: false}
        - {property: X3, rating: met, evidence: "T4.2:c8 'with SHA-pinned actions' for the verdict job (design); existing workflows mixed: 7 SHA-pinned uses, rest tag refs (bundle_dispositions)", executor_added: false}
        - {property: X4, rating: met, evidence: "T4.2:c9: LLM key reachable only from the verdict workflow ref via Environment restricted to protected branches or OIDC bound to job_workflow_ref; unbuilt, fork unmade (VPA-01); environments.tf:30,63,91 lists only tf-gated-apply, tf-trusted-plan, deployment-approval-probe", executor_added: false}
        - {property: X5, rating: partial, evidence: "digest-pinned image + one digest across hosts designed (T4.2 c8/c13); build-and-publish channel rec-4477 open (T4.32 c2); SLSA provenance/signing not required by any criterion", executor_added: false}
        - {property: X6, rating: missed, evidence: "no criterion requires hash-locked image dependencies; requirements-dev.txt:139 pins litellm==1.106.2 by version, not hash", executor_added: false}
        - {property: X7, rating: partial, evidence: "schema-validated input + forced structured output (T4.2 c8), read-only capabilities (T4.10a c1/c7); prompt-injection threat model T4.13 depends on T4.2 so lands after the personas read untrusted PR content (VPA-03)", executor_added: false}
        - {property: X8, rating: met, evidence: "T4.2:c9 'fails rather than skips' off the author allowlist; c8 forces structured output; T4.10a:c1 failure_outputs; one check run per persona per head SHA (c9)", executor_added: false}
        - {property: X9, rating: met, evidence: "dual-run N>=20 with pre-registered measure (T4.28 c5, T4.29 c4, T4.30 c4), advisory while in-session gates (CD.12 alarm-not-gate), per-persona rollback flag (Decision 224 row)", executor_added: false}
        - {property: X10, rating: partial, evidence: "prompt/definition content hash designed (T4.10a c5, rec-4433); resolved model version not pinned (VPA-06); fixed sampling settings not stated", executor_added: false}
        - {property: X11, rating: missed, evidence: "no criterion states per-call timeout, bounded retries, tier-2 fallback or per-run token cap for verdict runs; T4.10a c1 budgets are max_turns/max_wall_clock only", executor_added: false}
        - {property: X12, rating: met, evidence: "T4.2 c3 per-turn telemetry (model_id, tokens, cost, latency); rec-4433/rec-4434 capture rows; rec-4028 LiteLLM producer (open, VPA-08)", executor_added: false}
        - {property: X13, rating: missed, evidence: "re-run per head SHA designed (T4.30 c1, T4.29 c1) but cancel-in-progress and job timeout-minutes are not stated in any criterion", executor_added: false}
        - {property: X14, rating: missed, evidence: "no egress allowlist / harden-runner equivalent in any verdict-chain criterion", executor_added: false}
        - {property: X15, rating: partial, evidence: "prompts carry public-repo content only (Decision 101 public boundary holds by construction); provider retention terms not recorded anywhere read", executor_added: false}
        - {property: X16, rating: partial, evidence: "fixture run designed (T4.32 c3); offline regression set for prompt/model changes is T4.14, deferred_post_mvp (Decision 231 lane)", executor_added: false}
        - {property: X17, rating: met, evidence: "verdict identity non-forgeable by the executor: T4.2 c9 - on Actions the job's GITHUB_TOKEN, executor App holds no checks:write; elsewhere a dedicated verdict App", executor_added: true}
        - {property: X18, rating: missed, evidence: "stable required-check names designed (c9: one check run per persona per head SHA) but ruleset bypass rules and merge-queue interaction are not addressed in any criterion read", executor_added: true}
    - q: Q4
      verdict: partial
      basis: [VPA-02, VPA-04]
      prose: >-
        The add -> dual-run (N>=20, pre-registered) -> flip -> remove order is sound and measurable per persona,
        with a per-persona rollback flag (Decision 224 row) and the in-session subagent as visible outage
        fallback (Decision 229 cl.4). What is missing: the wake path for a check-run completion in a CC-web
        session (VPA-02) and the flip text for the /overseer trampoline and the coordinator contract
        (VPA-04). Merge authority at flip: 'critique PROCEED' / 'code review PROCEED' become the
        corresponding check-run conclusion (success) on the head SHA, read from the Checks API by the
        session/coordinator; standing_authorisation is reworded to name the check run (WP-09). A worker or
        overseer session waits via the verdict-wake signal added to git-ops wake_signals (WP-09). Gate
        version reviewing gate-changing WPs: the incumbent in-session gate from the branch until that
        gate's flip (the flip PR is the last in-session-reviewed change; rec-4476 closes at flip); after
        flip, WPs including REMOVE are reviewed by the Actions persona running main's definition, which
        reads the PR diff, not the branch's edited skill text - a persona never gates its own flip
        post-flip.
      agreement_measures:
        - {persona: decision_scout, measure: "exact verdict match (NO_FLAGS/FLAGS_FOUND/BLOCK) plus equality of the CONTRADICT decision-id set and ROADMAP CONFLICT criterion-id set between the in-session subagent and the check run, on consecutive plan PRs", n: 20, agreement_miss_disposition: "hold advisory, revise prompt/input projection, re-run dual-run; if still missing, move the persona to the tier-2 role by contract edit (Decision 173 cl.2) and keep the in-session gate; never skip"}
        - {persona: plan_critic, measure: "PROCEED/REVISE match plus blocking-finding count delta <= 1 and zero blocking findings present in one verdict and absent in the other, on consecutive ready plan PRs", n: 20, agreement_miss_disposition: "hold advisory, revise prompt, re-run; tier-2 fallback by configuration if the miss persists"}
        - {persona: code_reviewer, measure: "PROCEED/REVISE match plus Critical/High finding-set Jaccard >= 0.8 keyed by file:line anchor, on consecutive code PRs", n: 20, agreement_miss_disposition: "hold advisory, revise review scope projection, re-run; tier-2 fallback by configuration if the miss persists"}
    - q: Q5
      verdict: ready
      basis: []
      prose: >-
        execution_plan holds 13 WPs in 6 waves; critical_path = [WP-01, WP-02, WP-04, WP-07, WP-08, WP-12]
        (6 WPs, ends at WP-12 closing T4.29:c6, the REMOVE criterion). Every WP on the critical path is
        design_state: designed, so the verdict is ready. Off-path WPs are all designed too (WP-00 is an
        operator_action fully specified). Every open criterion of T4.10a, T4.32, T4.28-T4.30 and the T4.2
        criteria those items discharge (c4, c8, c9, c10, c12, c13, c14 non-compute legs) appears in exactly
        one WP's roadmap_closes. Deliberately left out: T4.2 c1-c3, c5-c7, c11, c15 - they belong to the loop
        host / compute plane (T4.1, T4.15, T4.9a), out of scope per Section 4; T4.2 c11's migration scope is
        the flip criteria themselves. coordinator.yaml (status draft) is complete enough to run this
        workstream: its lifecycle's critique/plan_pr steps assume in-session gates today, which WP-09
        rewords at flip (VPA-04); until then the in-session gates still run, so the contract works as
        written. A 3-of-7 T4.10a slice (C17) could unblock T4.32 earlier; optional, not required.
    - q: Q6
      verdict: sufficient
      basis: []
      prose: >-
        The design's own bundling (T4.32 decomposition_hints: transport, image+twin, verdict jobs) is
        adequate; bundle_dispositions records each named candidate. Notable: rec-4415/4028/4433/4434 bundle
