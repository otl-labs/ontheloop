audit:
  meta:
    audited_commit: b3044d78
    base_branch: main
    model: Mistral Vibe CLI
    methodology_version: 1
    scope_surfaces: [S1, S2, S3, S4, S5]
    degraded_dedup: false
    web_unavailable: true
    contract_notes: >-
      Section 5 step 0 (hook canary) waived by the operator for this harness. Web lookups unavailable
      (no web tool in the harness; curl denylisted): every external fact (DeepSeek capabilities, pricing,
      GitHub Actions pricing) is answered from model knowledge and marked HYPOTHESIS. No mcp__github__*
      tools exist in this harness: commits-per-PR assumed 3 (HYPOTHESIS) for the Q8 cost seed, and the
      Section 16 step 5 fallback (human opens the PR) applies. Preflight OK; rec reader live; roadmap
      parses (186 tier_items). coordinator.yaml always_ask.items matches the Section 14 enum mapping
      exactly (eight items, no drift). All Section 10 anchors resolved; none stale. The advisory
      scripts.validate --pre could not be run: the harness approval callback denied the invocation;
      the required pre-push gate (YAML parse, counting invariant, C1-C18 coverage, word count) was
      run directly and passed.
    stale_anchors: []
  question_answers:
    - q: Q1
      verdict: partial
      basis: [VPA-01, VPA-04, VPA-08, VPA-09]
      prose: >-
        The designed chain T4.10a -> T4.32 -> T4.30/T4.29/T4.28 is correctly ordered at the item level and
        no persona child inherits a forbidden edge (each intent says "never T4.1, T4.9a or T4.15"; T4.32
        depends on T4.10a alone, which depends on T1.12, complete). The full prerequisite set as traced
        adds edges the roadmap does not name: (a) T4.10a c1 requires all SEVEN persona contracts and its
        c4 amendment says the item "completes before any persona exists", so the three verdict personas
        are blocked on four non-verdict contracts (VPA-01); (b) the CAPTURE criteria require rec-4433,
        rec-4434 and rec-4028 closed before add/dual-run, but no tier_item criterion or rec owns closing
        them (T3.22 c1-c4 own rec-4417..4420; T3.20 c9 owns rec-4415) (VPA-08); (c) the verdict job's
        telemetry-producer identity admission (rec-4420: "each concrete grant stays always-ask") is an
        unnamed prerequisite edge; (d) the LLM-key delivery mechanism (GitHub Environment vs OIDC to the
        Decision 237 SSM parameter) is framed by T4.2 c9 but unmade, and the secrets-to-ssm cutover
        sequencing depends on that choice (VPA-04); (e) the flip steps assume the session learns of
        check-run completion, but no wake signal exists for a non-ci.yml workflow (VPA-09). rec-4477
        (image channel) is correctly owned by T4.32 c2; rec-4416 is closed; rec-4043 binds compute-plane
        personas only (T4.2 c7 amendment) and is NOT a verdict prerequisite.
    - q: Q2
      verdict: partial
      basis: [VPA-02, VPA-03, VPA-06]
      prose: >-
        Credible but with three named gaps. Capability (HYPOTHESIS, web unavailable): DeepSeek's
        OpenAI-compatible API offers function calling and a JSON output mode, and LiteLLM normalises
        both; the design's schema-validated input plus forced structured output (T4.2 c8, T4.10a c1) is
        therefore reachable. The load-bearing fork is HOW each persona gets its non-PR repo context
        (VPA-02): the scout's bounded retrieval (index triage then targeted section reads) is inherently
        multi-step, so either the persona gets an MCP read_repo loop (T4.10a c7's binding for read
        capabilities is unstated for repo files) or the shell pre-materialises a deterministic
        projection; the critic and code-reviewer could run one-shot over a pre-assembled input. Context
        fit (HYPOTHESIS: 128K-token-class window for the current DeepSeek chat/reasoner generation):
        scout inputs (index ~200 live entries plus shortlisted sections) fit comfortably; the critic's
        scope-file reads fit only with the skill's targeted-read discipline (sampled plans carry 2-46
        scope rows); the code-reviewer's largest sampled diff (42 files, +1594/-70, plus one-level
        imports and config) is near the ceiling and needs the skill's scoping rules enforced in the
        projection. Model selection (the selection's home is ports.run_persona.litellm.model /
        inference-provider.yaml litellm_tier_models): decision_scout -> deepseek/deepseek-chat (bounded
        classification, highest volume); plan_critic -> deepseek/deepseek-reasoner (strategic judgment);
        code_reviewer -> deepseek/deepseek-reasoner for a blocking gate, with deepseek-chat as the
        cost-bound alternative the dual-run agreement data should arbitrate. Version pinning is absent
        (VPA-06): the aliases remap upstream, and no criterion records the resolved version on a run.
        Credential naming is wrong for the primary role (VPA-03). Timeouts/retries: turn and
        wall-clock budgets exist (T4.10a c1) and the tier-2 Anthropic-direct fallback role is designed
        (Decision 173), but per-call timeout, retry policy and a per-run token cap are unstated
        (plan-level detail for the transport WP). What changes at the persona: the skill methodology
        becomes the rendered contract prompt (T4.10a c5), tool reads become input projection or MCP
        reads, verdict vocabularies stay (their check-run mapping is VPA-07). What stays: the verdict
        semantics, the caller-side verdict handling, the capture shape.
    - q: Q3
      verdict: partial
      basis: [VPA-04, VPA-05, VPA-06, VPA-07, VPA-10]
      prose: >-
        The designed verdict chain is strong on the core trust properties (X1, X2, X4, X9, X12 met) and
        weak on operational hardening: egress control is not designed (X14 missed), the offline
        regression set is deferred_post_mvp with T4.14 (X16 missed), and post-flip required-check
        registration is unstated (X17 missed, executor-added). Prompt-injection hardening is designed
        but mis-sequenced (VPA-10, X7 partial). See external_checklist rows for property-by-property
        evidence.
      external_checklist:
        - {property: X1, rating: met, evidence: "T4.2 c8 + Decision 205 cl2: secretless pull_request trigger (no checkout, no secrets, permissions {}) chained by workflow_run to the verdict job on the default branch's definition; pull_request_target never a persona trigger", executor_added: false}
        - {property: X2, rating: met, evidence: "T4.2 c8 permissions {} on the trigger; T4.2 c9 verdict identity = the verdict job's GITHUB_TOKEN with checks:write only on the trusted job; c10's check fails any pull_request-triggered workflow granted checks:write", executor_added: false}
        - {property: X3, rating: met, evidence: "T4.2 c8 requires SHA-pinned actions for the verdict job; the existing tag-pinned workflows are a separate S5 finding (VPA-05), not the verdict chain", executor_added: false}
        - {property: X4, rating: met, evidence: "T4.2 c9: the LLM key reachable only from the verdict workflow ref (a GitHub Environment restricted to protected branches, or OIDC bound to job_workflow_ref); the mechanism fork is VPA-04 and must be settled before build", executor_added: false}
        - {property: X5, rating: partial, evidence: "Digest-pinned image with a governed build-and-publish channel is designed (T4.32 c2, rec-4477) and one digest is asserted across hosts (T4.2 c13); no provenance/signing attestation (SLSA, cosign) is named anywhere -- property-matched control for the missing half does not exist yet", executor_added: false}
        - {property: X6, rating: partial, evidence: "The digest pin freezes image contents transitively and requirements-dev.txt pins versions (litellm==1.106.2, line 139), but no criterion states a hash-locked dependency set as the image build input", executor_added: false}
        - {property: X7, rating: partial, evidence: "Structural controls designed: schema-validated input, forced structured output (T4.2 c8), no write-capable tools for verdict personas (T4.10a c3), author allowlist failing closed (T4.2 c9); the prompt-level control (T4.13 c3 hardening, c4 red-team fixture) is sequenced after the umbrella completes (VPA-10), so the instruction-following threat is unmitigated at add time", executor_added: false}
        - {property: X8, rating: partial, evidence: "Fail-not-skip is designed repeatedly (T4.2 c9, Decision 205 cl2); stable required-check names and the conclusion mapping are unstated (VPA-07), so the fail-closed surface is not yet fully defined", executor_added: false}
        - {property: X9, rating: met, evidence: "Decision 229 cl4 + T4.28 c5/T4.29 c4/T4.30 c4: dual-run advisory (CD.12), N >= 20 pre-registered per persona, per-persona rollback flag in project-configuration.yaml (Decision 224)", executor_added: false}
        - {property: X10, rating: partial, evidence: "Definition hash per contract version is designed (rec-4433, T4.10a c5); the resolved upstream model version is neither pinned nor recorded (VPA-06) and sampling settings are unstated", executor_added: false}
        - {property: X11, rating: partial, evidence: "Fallback to an independent vendor is designed (Decision 173 tier-2 role, warm-fetched, cold-start assertion per billing shape); turn and wall-clock budgets exist (T4.10a c1); per-call timeout, bounded retry policy and a per-run token cap are unstated", executor_added: false}
        - {property: X12, rating: met, evidence: "T4.2 c3 telemetry (model_id, tokens in/out, cached, est_cost_usd, latency_ms per turn) plus rec-4433 persona key + definition hash, rec-4434 per-finding rows and rec-4028's LiteLLM producer give the per-run trace; equivalent in coverage to OpenTelemetry GenAI conventions", executor_added: false}
        - {property: X13, rating: partial, evidence: "The wall-clock budget bounds a run (T4.10a c1); cancellation of superseded head SHAs and job timeout-minutes are unstated -- revision commits re-trigger verdicts by design (T4.29 c1), making cancellation hygiene material", executor_added: false}
        - {property: X14, rating: missed, evidence: "No egress allowlist or equivalent is designed for the verdict job; the job holds the LLM key and its only designed egress is the provider call plus the shell's check-run post, but nothing enforces that", executor_added: false}
        - {property: X15, rating: partial, evidence: "The repository is public (Decision 101) and the schema-validated input is built from public repo content, so no secrets reach prompts by design; provider retention terms are unverified (web unavailable, HYPOTHESIS) and no criterion records a retention review", executor_added: false}
        - {property: X16, rating: missed, evidence: "The offline regression set is T4.14, deferred_post_mvp (a deferral is not a defect; pulling it forward is a bundle_dispositions recommendation); pre-MVP only the deterministic fingerprint-completeness test (T4.32 c4) exists, which covers routing, not model regression", executor_added: false}
        - {property: X17, rating: missed, evidence: "executor_added: post-flip enforcement registration (required-check name, ruleset/bypass interaction) is unstated; the design relies on the merging session reading the check run, so a human merge that ignores a pending verdict is unblocked by anything mechanical (VPA-07)", executor_added: true}
    - q: Q4
      verdict: partial
      basis: [VPA-07, VPA-09, VPA-10, VPA-11]
      prose: >-
        Add -> dual-run (N >= 20, pre-registered) -> flip -> remove is sound and measurable per persona:
        each step has a criterion, the dual-run is advisory (CD.12), the rollback flag and the visible
        outage fallback are designed, and the agreement data source (rec-4434 per-finding rows) is
        named. Proposed agreement measures are in agreement_measures. The confound C8 names is real and
        must be controlled in each dual-run plan: both arms must receive the identical input projection
        at the identical head SHA, and disagreement is attributed confounded unless one edit isolates
        model, harness, projection or prompt. Merge authority at flip: "critique PROCEED" becomes the
        plan-critique check run's structured Recommendation on the plan PR's head SHA, and "code review
        PROCEED" becomes the code-review check run's verdict on the build PR's head SHA; the coordinator
        contract's standing_authorisation and the overseer's GATE_REQUEST handling must be reworded to
        say so (VPA-11, WP-09), and a worker or overseer session waits on the check-run completion wake
        (VPA-09: the verdict workflow must post a wake comment, the same pattern as ci.yml's
        signal-green job, because subscribe_pr_activity delivers no success events). Which gate
        reviews a gate-changing WP: the Actions persona always runs main's definition, so a PR that
        changes, flips or removes a gate is judged by the pre-change persona from main -- a persona
        never gates its own flip PR; before the ADDs land, gate-changing WPs are reviewed by the
        in-session gate from the branch, which for skill edits is the known rec-4476 self-review gap
        (mitigated by the operator's write_the_plan gate and, once live, by the advisory check runs).
        Gaps that keep this partial: the conclusion mapping and required-check registration (VPA-07),
        the missing wake (VPA-09), the un-reworded consumers (VPA-11), and injection hardening landing
        after flip-relevant personas (VPA-10).
      agreement_measures:
        - persona: decision_scout
          measure: >-
            Exact verdict agreement (NO_FLAGS/FLAGS_FOUND/BLOCK) on the same scout-input fingerprint at
            the same head SHA, plus CITE-set Jaccard >= 0.7 and zero missed BLOCK-severity flags across
            both arms; both arms receive the identical input projection.
          n: 20
          agreement_miss_disposition: >-
            Hold advisory; revise the rendered scout prompt (definition hash changes, re-run from the
            new hash); if the second window also misses, move decision_scout to the tier-2 role by
            configuration (an inference-provider.yaml edit, Decision 173 cl2) and re-dual-run; never
            flip below the pre-registered N.
        - persona: plan_critic
          measure: >-
            Recommendation agreement (PROCEED/REVISE) on the same plan head SHA, plus every blocking
            finding in one arm matched by an anchored finding (same plan field path or VP step id) in
            the other within one revision; nit-only divergence is not disagreement.
          n: 20
          agreement_miss_disposition: >-
            Hold advisory; revise the rendered critique prompt; if still missing, move plan_critic to
            the tier-2 role by configuration and re-dual-run; escalate to the operator only if the
            tier-2 window also misses (a fork the coordinator cannot settle).
        - persona: code_reviewer
          measure: >-
            Verdict agreement (PROCEED/REVISE) on the same head SHA, plus Critical/High findings
            matched by file:line across arms (a finding present in one arm only counts as disagreement
            when the other arm's report shows the same file); Medium/Low divergence is recorded, not
            counted.
          n: 20
          agreement_miss_disposition: >-
            Hold advisory; revise the rendered review prompt; if still missing, move code_reviewer to
            the tier-2 role by configuration and re-dual-run; rec-4476's closure (T4.28 c6) waits with
            the flip.
    - q: Q5
      verdict: ready_with_forks
      basis: [VPA-01, VPA-02, VPA-04, VPA-07, VPA-08, VPA-09, VPA-11]
      prose: >-
        execution_plan has 16 packages across waves 0-10; critical_path is
        WP-00, WP-01, WP-02, WP-04, WP-05, WP-06, WP-08, WP-12, WP-14, WP-15 (10 WPs, ending at
        T4.29:c6; a length tie with the WP-03 variant was broken by keeping the capture prerequisite
        WP-02 on the path, both variants containing the one needs_operator_fork WP). Every WP on the
        path is designed except WP-04 (needs_operator_fork: image registry and signing choice) and
        none is undesigned, so the verdict is ready_with_forks; all off-path WPs are designed. The
        wave-0 operator session (WP-00) settles the credential mechanism, spend, the T4.10a slice
        amendment and the per-persona model selection before any plan starts. Deliberately left out of
        roadmap_closes, with reasons: T4.10a c1/c5's non-verdict four personas (rca, bookkeeping,
        plan_agent, implement_agent contracts) stay on T4.10a's remainder once the slice amendment
        lands -- they block nothing on this path; T4.2 c1, c2, c5, c6, c7, c15 and c11's executor half
        are compute-plane/loop-host criteria owned by T4.15, T4.31 and T4.1 (out of scope per Section
        4); T4.13's compute-plane legs stay on T4.13. coordinator.yaml (status draft) IS complete
        enough to run waves 1-6 as written: its lifecycle, routing, approvals and parallelism rules are
        harness-neutral and its always_ask list matches the repo's; but its critique and plan_pr steps
        and standing_authorisation assume an in-session gate ("merge on critique PROCEED"), so WP-09
        must land before the first flip (wave 5, before any flip WP at wave 6+), and the coordinator
        cannot read the repository, so every dispatch rides the plan_seed and intake briefs below.
    - q: Q6
      verdict: partial
      basis: [VPA-05, VPA-08, VPA-10]
      prose: "see bundle_dispositions"
    - q: Q7
      verdict: moderate
      basis: [VPA-03, VPA-04, VPA-08, VPA-11]
      prose: "see execution_plan.operator_touchpoints; 8 counted rows (always_ask or design_fork), 4 of which settle before wave 1 in the WP-00 operator session; plan_approval rows are listed but not counted."
    - q: Q8
      answers:
        - question: "Is DeepSeek's quality on long, tool-heavy repository review adequate for a BLOCKING gate, and what evidence would show it before flip (without an LLM grader, Decision 231)?"
          answer: >-
            Unproven either way (HYPOTHESIS: no external benchmark could be fetched, and none of the
            three personas has run on DeepSeek). The pre-flip evidence that Decision 231 permits is
            exactly the dual-run record: rec-4434 per-finding rows from both arms on the same head
            SHA, scored against escape ground truth (post-merge ci_rca recs, back-validation fails --
            T4.14 c5's grader shape, runnable by code before the offline lane opens), plus the
            operator's blind spot-check of a sample of disagreement cases. Concretely: zero
            missed-BLOCK/missed-Critical events across the N >= 20 window and the pre-registered
            agreement measures in Q4 are the flip bar; a miss holds the persona advisory. The
            tool-heaviness question is mostly dissolved by the design: the verdict personas are
            one-shot-or-MCP-read shapes, not long tool loops, so the load-bearing risk is context fit
            and instruction-following, not agentic stamina.
          basis: [VPA-02, VPA-06, VPA-10]
        - question: "Should code_reviewer flip before the plan-PR personas, or does plan-PR routing (T4.32 c4) make the scout first?"
          answer: >-
            The operator's start order (T4.32; then T4.28, T4.30, T4.29) is correct and the ADD steps
            for code_reviewer and decision_scout can run in parallel (disjoint files: implement.md +
            implement SKILL.md vs plan.md + planning SKILL.md). Two hard orderings bind regardless of
            start order: the scout must be live before the critic (T4.29 c1 fails with "re-scout
            required" while the head's fingerprint has no scout verdict, and both personas share
            plan.md and planning SKILL.md, so their WPs are sequential anyway), and the critic's flip
            should follow the scout's flip for the same file reason. code_reviewer flipping first is
            safe: it consumes no plan-PR routing and its own dual-run data is independent.
          basis: []
        - question: "Bootstrap: the WPs that change the three gates are themselves reviewed by those gates; is that safe at every step?"
          answer: >-
            Yes, with one known window. The verdict job always executes the default branch's
            definition and main's persona code (T4.2 c8), so from the first ADD onward a gate-changing
            PR is reviewed by the pre-change persona from main -- no persona ever gates its own flip
            PR. Before the ADDs (waves 1-5), gate-adjacent WPs touch contracts, transport and
            workflows, not the gate skills themselves; the WPs that do edit gate skills (the flips and
            removes) land after the ADDs. The residual window is the rec-4476 self-review gap: an
            in-session gate on the branch reviewing a PR that edits its own skill, which closes at
            T4.28 c6 (WP-10) and is mitigated until then by the operator's write_the_plan approval and
            the advisory check runs.
          basis: [VPA-11]
        - question: "What happens to in-flight plans and branches at each flip?"
          answer: >-
            Nothing loses a gate. A flip lands on main; open PRs created before the flip already carry
            advisory check runs (the ADD has been live since wave 5), and their next push re-triggers
            the now-gating persona on the new head SHA. A session mid-/plan that started before the
            flip keeps the in-session dispatch it read at its branch base -- the per-persona flag
            rolls it back deliberately, and the in-session subagent is the sanctioned outage fallback
            (Decision 229 cl4), so an in-flight branch is never left without a gate. Revision commits
            re-trigger the critic per T4.29 c1 and re-scout per the fingerprint rule, so in-flight
            revision loops transition mechanically.
          basis: [VPA-09]
        - question: "What is the monthly Actions-minutes and DeepSeek token cost at current volume?"
          answer: >-
            Volume (measured): 436 first-parent merges in 30 days, ~207 plan PRs and ~207 code PRs.
            Runs per PR assumed 3 (HYPOTHESIS: no GitHub tool to read commit counts). Estimated
            verdict runs: scout ~620 (draft plan-PR pushes), critic ~300 (ready and post-ready
            pushes), code-review ~620, roughly 1,500 runs/month. Tokens per run (HYPOTHESIS, from the
            DD-A input sizes): scout ~45K in / 1K out, critic ~80K in / 2K out, code-review ~100K in
            / 3K out. At the contract's recorded DeepSeek pricing ($0.252/M input, $0.378/M output,
            $0.0252/M cache-hit, CD.28 note; current pricing unverified) with ~80% prefix cache-hit,
            the token bill is order $10-40/month, dominated by the reasoner share and the cache-hit
            ratio. Actions minutes: standard hosted runners are free for public repositories
            (HYPOTHESIS, well-established but unverified here), so $0/month on standard runners;
            if the verdict job ever needs larger runners or the repository goes private, the same
            volume is roughly 8-15K minutes/month. The spend approval row carries this estimate.
          basis: []
        - question: "Does moving gates off the session change the interactive session's wall-clock loop materially?"
          answer: >-
            Per gate round the session gains the verdict job's queue plus run time (order 2-10
            minutes, HYPOTHESIS) instead of an in-session subagent's 1-3 minutes, and a revision
            round now requires a push (which the flow already requires) before the re-run triggers.
            The session's own context gets lighter: the gate's report arrives as check-run output the
            session reads, not as an in-context subagent result. Net: a few added minutes per gate
            round, no throughput change given event-driven wakes -- which is exactly why VPA-09 (the
            missing wake comment) must land with the verdict chain, or the loop degrades from
            minutes to the watcher's 2-6 hour cadence.
          basis: [VPA-09]
        - question: "Should any out-of-scope surface join the migration (Section 4's invitation)?"
          answer: >-
            One candidate: /plan Step 10's REPORT-ONLY deliverable critique (plan.md line ~107) is a
            fresh-context subagent check with the same shape as plan-critique; once the plan_critic
            contract and chain exist, a REPORT-ONLY variant is a contract instance, not a new
            persona. I recommend NOT pulling it into this workstream (it is not a gate; it advises
            the human on a deliverable) but noting it as the first cheap follow-on after WP-08. The
            /audit verification subagents and the coordinator's advisor consults should stay
            in-session: they are read-only advice with no blocking semantics, and Decision 229's
            2026-11-02 update explicitly preserves them.
          basis: []
  per_surface_assessment:
    - {surface: S1, maturity: strong, strengths: "The verdict chain's trust design is excellent: secretless trigger + workflow_run split, thin shell, one digest across hosts, verdict identity distinct from the executor, fail-not-skip, and a fully-specified strangler protocol with per-persona rollback; the decomposition hints make the foundation dispatchable as three plans.", top_gaps: [VPA-01, VPA-02, VPA-04, VPA-06, VPA-08]}
    - {surface: S2, maturity: nascent, strengths: "The scout's Actions shape is the best-designed of the three: T4.32 c4 defines its input projection (the fingerprint) deterministically, including re-scout semantics and a completeness test, and rec-4490 twins it into interactive /plan.", top_gaps: [VPA-07, VPA-09, VPA-10, VPA-11]}
    - {surface: S3, maturity: nascent, strengths: "The critic's trigger design is precise (ready_for_review plus every post-ready push, re-scout-required coupling to the scout's fingerprint) and its flip correctly binds to the operator's alignment sign-off.", top_gaps: [VPA-02, VPA-07, VPA-09, VPA-11]}
    - {surface: S4, maturity: nascent, strengths: "code_reviewer is first in the start order with disjoint files, its flip closes the rec-4476 self-review gap, and its capture criteria are the most explicit (rec-4433/4416 before add, rec-4434 before dual-run).", top_gaps: [VPA-02, VPA-07, VPA-09, VPA-10, VPA-11]}
    - {surface: S5, maturity: frontier, strengths: "The built adjacent surface works today on claude -p + OAuth with pinned CLI versions, advises-never-locks semantics, and a named swap lane (T4.26) with a watch-signal (token expiry) -- no critical or high finding lands on S5.", top_gaps: [VPA-05]}
  rubric_ratings:
    - {surface: S1, dimension: VD1, rating: adequate, evidence: "T4.32 c1-c4; T4.10a c1-c8", note: "criteria exist and are testable; input projection (VPA-02) and capture-rec ownership (VPA-08) are the completeness gaps"}
    - {surface: S1, dimension: VD2, rating: weak, evidence: "T4.10a c1 + T4.10a c4 amendment; T4.32 depends_on [T4.10a]", note: "the seven-contract scope blocks the verdict personas on four non-verdict contracts (VPA-01); rec-4433/4434/4028 closure is unowned (VPA-08)"}
    - {surface: S1, dimension: VD3, rating: adequate, evidence: "T4.2 c8/c9/c10; Decision 205 cl2", note: "strong design; the api_key variable row (VPA-03) and the unmade delivery mechanism (VPA-04) are the residuals"}
    - {surface: S1, dimension: VD4, rating: adequate, evidence: "inference-provider.yaml litellm_tier_models; T4.10a c1 budgets; Decision 173", note: "tier roles and fallback designed; version pinning (VPA-06) and per-call timeout/retry unstated"}
    - {surface: S1, dimension: VD5, rating: adequate, evidence: "Decision 229 cl4; T4.2 c14 local_container oracle", note: "the foundation itself needs no migration; the local twin is the drift oracle"}
    - {surface: S1, dimension: VD6, rating: strong, evidence: "T4.2 c3; rec-4433, rec-4434, rec-4028; T3.22 c5 met", note: "capture-from-day-one is designed into every persona item; the resolved model version is the one gap (VPA-06)"}
    - {surface: S1, dimension: VD7, rating: adequate, evidence: "T4.32 decomposition_hints; coordinator.yaml lifecycle", note: "dispatchable after WP-00 settles the forks; the wake mechanism (VPA-09) is required for the flip steps"}
