schema_version: 1
workflow: .github/workflows/ci-rca.yml
proven_by_values:
  main_smoke: the post-merge smoke on main runs this step (rec-5493)
  pr_smoke: a pre-merge smoke runs this step (rec-5510)
  seam_contract: the seam contract test covers this step (rec-5509)
  watchdog_only: only a real run exercises this step; the watchdog (rec-5504) reports when it fails
known_top_level: [.mcp.json, requirements.txt]
smoke_workflow: .github/workflows/ci-rca-smoke.yml
smoke_verify_step: 'smoke::verify'
smoke_verify_run: 'bin/venv-python -m scripts.ci_rca.smoke verify --smoke-id "$CI_RCA_SMOKE_ID" --bundles-dir /tmp/ci-rca-bundles /tmp/ci-rca-smoke-sink.jsonl /tmp/ci-rca-smoke-fallback.jsonl /tmp/ci-rca-output.json'
steps:
  'rca::#0': {proven_by: watchdog_only, declared_inputs: []}
  'rca::install-claude-code-cli': {proven_by: main_smoke, smoke_step: 'smoke::install-claude-code-cli', declared_inputs: []}
  'rca::#2': {proven_by: main_smoke, smoke_step: 'smoke::#2', declared_inputs: []}
  'rca::checkout-at-failing-commit': {proven_by: watchdog_only, declared_inputs: []}
  'rca::set-up-python-3-12': {proven_by: main_smoke, smoke_step: 'smoke::set-up-python-3-12', declared_inputs: []}
  'rca::activate-venv': {proven_by: main_smoke, smoke_step: 'smoke::activate-venv', declared_inputs: []}
  'rca::configure-aws-credentials-oidc-branch-role': {proven_by: main_smoke, smoke_step: 'smoke::configure-aws-credentials-oidc-branch-role', declared_inputs: []}
  'rca::meta': {proven_by: watchdog_only, declared_inputs: []}
  'rca::range': {proven_by: watchdog_only, declared_inputs: []}
  'rca::range_fallback': {proven_by: watchdog_only, declared_inputs: []}
  'rca::jobs_json': {proven_by: watchdog_only, declared_inputs: []}
  'rca::rejected_deployment': {proven_by: watchdog_only, declared_inputs: []}
  'rca::fetch-failed-run-logs': {proven_by: watchdog_only, declared_inputs: []}
  'rca::designed_refusal': {proven_by: watchdog_only, declared_inputs: []}
  'rca::fetch-junit-report-v2-fingerprint-substrate': {proven_by: watchdog_only, declared_inputs: []}
  'rca::fetch-validation-result-artifact-ci-rca-attribution-substrate': {proven_by: watchdog_only, declared_inputs: []}
  'rca::fetch-merged-pr-s-selection-manifest-decision-135-escape-attribution': {proven_by: watchdog_only, declared_inputs: []}
  'rca::evidence': {proven_by: main_smoke, smoke_step: 'smoke::evidence', declared_inputs: [config/ci_rca_taxonomy.yaml], note: taxonomy is read as data; the fixture exercises no junit, selection manifest or validation-result input, and --no-upload skips the S3 upload leg, so those stay proven only by real runs}
  'rca::dedup': {proven_by: watchdog_only, declared_inputs: []}
  'rca::fp_dedup': {proven_by: watchdog_only, declared_inputs: []}
  'rca::persona_gate': {proven_by: watchdog_only, declared_inputs: []}
  'rca::rca_agent': {proven_by: main_smoke, smoke_step: 'smoke::rca_agent', declared_inputs: []}
  'rca::fallback': {proven_by: main_smoke, smoke_step: 'smoke::fallback', declared_inputs: []}
  'rca::mark_rca': {proven_by: watchdog_only, declared_inputs: []}
  'rca::comment-on-originating-pr': {proven_by: watchdog_only, declared_inputs: []}
  'rca::capture-agent-telemetry': {proven_by: watchdog_only, declared_inputs: []}
  'watchdog::#0': {proven_by: watchdog_only, declared_inputs: []}
  'watchdog::set-up-python-3-12': {proven_by: watchdog_only, declared_inputs: []}
  'watchdog::install-watchdog-dependencies': {proven_by: watchdog_only, declared_inputs: []}
  'watchdog::reconcile-ci-rca-outcomes': {proven_by: watchdog_only, declared_inputs: []}
