# Data Quality Checks: Ops Tables
# Recommendations, decisions, execution plans, priority queue, session log.
#
# SOLE BACKEND (Decision 84 I-1): DuckLake is the sole ops backend for ops_recommendations,
# ops_decisions, and ops_priority_queue. The retired dual-backend storage-selector flag and its
# rollback path no longer exist -- data_quality_runner sends these tables' checks as dq_check requests (a closed kind
# plus bound params; the reader owns the SQL and answers a violation count) to the closed reader unconditionally, and
# additionally emits the CD.33-clause-8 checks declared under `clause8_checks`. A test here is one of the compilable
# kinds in scripts/data_quality_compile.py; a contract rule the writer enforces at write time is not restated here.
#
# DQ BACKSTOP ONLY (Decision 210; rec-4158): every ops_recommendations test here that restates a contract rule is a
# backstop of the DuckLake writer's enforcement, never stricter than the Class A contract (the rule source;
# validate_ops_rule_source keeps that one-way). This file has no write-time role: the portal runs the writer's own
# gate over the contract's projection. T1.6 c7 retires this file.

database: agent_platform

# DuckLake backend. Each check runs as a dq_check request (a closed kind plus bound params; the reader owns the SQL)
# against the per-table `current` or `history` projection via the ducklake_reader dq_check action.
ducklake:
  meta_schema: ducklake_ops
  # CD.33 clause-8 checks, generated by data_quality_runner.build_clause8_checks. ops_decisions and
  # ops_priority_queue are ALREADY migrated to DuckLake and their base column/row_count checks
  # already run via the reader (see the SOLE BACKEND note above) -- but clause8 extension to those
  # two tables is DEFERRED to T1.6 (Decision 62 gate-amplification avoidance): clause8 checks
  # execute against the LIVE reader at the presubmit gate (ensure_fresh_dq_results ->
  # data_quality_runner -> build_clause8_checks -> _execute_check_ducklake), and adding tables here
  # would add net-new gate-time live-reader calls, the exact amplification Decision 62's
  # 2026-06-16 amendment blamed for DQ hangs / 502 merge-gate flapping. T1.6 relocates that
  # coverage to the scheduled monitor instead. The Decision-64 2026-05-01 anchor is preserved via
  # the per-table exclude_before on the existing column checks below.
  clause8_checks:
    tables: [ops_recommendations]
    ulid_history_unique: true      # append-history ULID is the idempotency PK -- never duplicated
    current_merge_key_unique: true # the `current` projection has exactly one row per merge key
    referential: true              # update targets must exist in `current` (enforced in-writer; L2 backstop)

tables:
  ops_recommendations:
    description: "Recommendation lifecycle (SCD Type 2 - use _current view)"
    view_suffix: _current
    row_count:
      min: 1
      severity: error
      enforced: true
    recency:
      column: last_updated_timestamp
      warn_after_hours: 24
      error_after_hours: 168
      enforced: true
    columns:
      id:
        description: "Recommendation unique identifier, format rec-NNN"
        semantics: "DynamoDB-allocated; never set directly by agents. SCD2: multiple rows per id in base table; uniqueness enforced at _current view level only."
        tests:
          - not_null:
              enforced: true
              exclude_before: '2026-05-01'
          # Not unique because SCD Type 2 has multiple versions per ID.
          # Uniqueness is enforced at the _current view level.
      title:
        description: "Concise one-line description of the recommendation"
        semantics: "Minimum 10 stripped characters for rows created from 2026-09-01, enforced by the DuckLake writer from the Class A contract's title min_length rule (the portal runs the writer's own gate as a derived pre-check). Near-duplicate titles across different file targets are legitimate."
        tests:
          - not_null:
              enforced: true
              exclude_before: '2026-05-01'
      source:
        description: "Agent type that filed this recommendation; harness-injected AGENT_TYPE identifier"
        semantics: "Lineage key: analytically equivalent to session_id for cross-table joins to telemetry on agent type. Never set by agents -- injected from AGENT_TYPE env var by the invocation harness. Validated against config/agent/data_quality/source_registry.yaml at write time in ops_data_portal -- unregistered values are rejected before reaching the warehouse. Human-initiated portal calls use source=manual."
        tests:
          - not_null:
              enforced: true
              exclude_before: '2026-05-01'
      effort:
        description: "Estimated implementation size (t-shirt: XS/S/M/L/XL)"
        semantics: "Interim string label. Migration rec-627: convert to LOC-weighted integer; t-shirt labels derived in _current view from integer thresholds. Weights defined in config/agent/executor/capabilities.yaml."
        tests:
          - not_null:
              enforced: true
              exclude_before: '2026-05-01'
          - accepted_values:
              values: [XS, S, M, L, XL]
              enforced: true
              exclude_before: '2026-05-01'
      priority:
        description: "Business urgency tier (Critical/High/Medium/Low)"
        semantics: "Interim string label. Migration rec-628: convert to int 1-4 (1=Critical, 4=Low); ORDER BY priority ASC gives urgency sort. Labels derived in _current view via CASE. Source-informed defaults at portal write time."
        tests:
          - not_null:
              enforced: true
              exclude_before: '2026-05-01'
          - accepted_values:
              values: [Critical, High, Medium, Low]
              enforced: true
              exclude_before: '2026-05-01'
      status:
        description: "Recommendation lifecycle state"
        semantics: "Valid domain: open | closed | failed | declined | superseded. Pydantic Literal guard at write time (rec-594). SCD2 append-only: deletion requires setting status=superseded via ops_data_portal -- never direct JSONL edits."
        tests:
          - not_null:
              enforced: true
          - accepted_values:
              values: [open, closed, failed, declined, superseded]
              enforced: true
      automatable:
        description: "Whether this recommendation is within the executor's current capability boundary"
        semantics: "Derived, never agent-set. Formula: (file NOT IN executor_boundary) AND (risk_score <= executor_maturity_ceiling). Both inputs from config/agent/executor/capabilities.yaml. Recomputed only when the maturity ceiling is raised."
        tests:
          - not_null:
              enforced: true
              exclude_before: '2026-05-01'
      file:
        description: "Repo-relative path to the primary source file this recommendation targets"
        semantics: "Must use forward slashes. Must not be absolute. Enforced by the DuckLake writer from the Class A contract's file pattern rule (the portal's derived pre-check refuses it early). Recs targeting files-to-be-created are valid -- no existence check applied. file names the surface the acceptance probe checks: the probe's verdict depends on that file's content, directly or through a test that exercises it, so file-keyed discovery (recs_related) returns the rec. A probe whose verdict never depends on file means the rec is mis-keyed."
        tests:
          - not_null:
              enforced: true
              exclude_before: '2026-05-01'
      context:
        description: "Why this recommendation exists -- minimum 80 stripped characters"
        semantics: "Must answer 'what problem does this solve and why now?'. Enforced by the DuckLake writer from the Class A contract's context min_length rule (>= 80 stripped chars; the portal's derived pre-check refuses it early). Executor relies on this for planning; thin contexts produce low-quality execution. Never append unrelated work to an existing rec (a rider): file a new rec and cite the first in its context; use dependencies only when the new work cannot start before the first is done. A context change through update_rec refines the rec's own problem only."
        tests:
          - not_null:
              enforced: true
              exclude_before: '2026-05-01'
      acceptance:
        description: "Verifiable shell command that proves the recommendation is implemented"
        semantics: "Must pass lint_acceptance_command() from scripts/executor/acceptance_lint.py with require_discrimination=True. Prefer grep/pytest commands over prose descriptions. Banned patterns: python -c one-liners, absolute paths, line-number greps, fenced blocks. The probe must discriminate the pre-fix tree from the post-fix tree: a lone grep/rg for a plain literal with no negation, count assertion or chained second assertion is rejected, as is a bare pytest path with no ::node_id against an already-existing test file. Fix by adding a ::node_id, asserting a negation or count, chaining a second assertion, or pointing at a not-yet-created test file."
        tests:
          - not_null:
              enforced: true
              exclude_before: '2026-05-01'
      dependencies:
        description: "List of rec-IDs that must complete before this recommendation is eligible"
        semantics: "Nullable array<string>. Each element must match ^rec-[0-9]+$ AND reference an existing rec (any status -- open, closed, or superseded alike) at write time through both file_rec and update_rec; null or empty list means no dependencies."
      tags:
        description: "Free-form categorisation tags for ad-hoc filtering"
        semantics: "Nullable array<string>. Each element must match ^[a-z][a-z0-9-]*$ (kebab-case) at write time through both file_rec and update_rec, e.g. T2.56 -> t2-56; null or empty list means no tags."
      risk:
        description: "Implementation risk tier (low/medium/high)"
        semantics: "Derived, never agent-set. Formula: R = (C x S) / M where C=max cyclomatic complexity of target file, S=effort scale factor, M=coverage% + 0.1 baseline. Thresholds: 0-5=low, 6-15=medium, 15+=high. Portal derives at write time from file + effort."
        tests:
          - not_null:
              enforced: true
              exclude_before: '2026-05-01'
          - accepted_values:
              values: [low, medium, high]
              enforced: true
              exclude_before: '2026-05-01'
      created_timestamp:
        description: "Timestamp when this recommendation was first filed"
        semantics: "SCD2 invariant: identical across all versions of a given rec id; does not change on update. Enforced constraint: created_timestamp <= last_updated_timestamp."
        tests:
          - not_null:
              enforced: true
              exclude_before: '2026-05-01'
      last_updated_timestamp:
        description: "Timestamp of the most recent write to this SCD2 row"
        semantics: "Advances on every SCD2 append (open->closed, field update, etc.). Covered by table-level recency check (warn_after_hours: 24, error_after_hours: 168). Enforced constraint: created_timestamp <= last_updated_timestamp."

  ops_decisions:
    description: "Architectural decisions governing the Theseus platform (SCD Type 2, append-only). Portal-first invariant enforced from Phase 0+1 onward: all writes via scripts/ops_data_portal.py file_decision/update_decision. Source of truth post-Phase-3b; DECISIONS.md is decommissioned after Phase 3b."
    view_suffix: _current
    row_count:
      min: 1
      severity: error
      enforced: true
    recency:
      column: last_updated_timestamp
      warn_after_hours: 24
      error_after_hours: 168
      enforced: false  # decisions written infrequently; staleness is expected
    columns:
      id:
        description: "Canonical string decision key (dec-NNN format). Introduced Phase 0+1; backfilled for all historical rows before view rewrite."
        semantics: "Primary deduplication key for ops_decisions_current view post-Phase-0+1. Must match ^dec-\\d+$. Dual-write invariant: int(id.split('-')[1]) == decision_id when both set."
        tests:
          - not_null:
              enforced: false
              phase4_session: ops-decisions-graduation-phase-5
          - pattern:
              value: '^dec-[0-9]+$'
              enforced: false
              phase4_session: ops-decisions-graduation-phase-5
      decision_id:
        description: "Legacy integer decision key (e.g. 50). Deprecated in Phase 6 after 14-day clean-data window post-Phase-5."
        semantics: "Redundant projection of id: decision_id = int(id.split('-')[1]). Preserved through Phase 5 for reader compatibility. Phase 6 column drop depends on dual-write invariant holding for every row."
        tests:
          - not_null:
              enforced: false  # nulls present
      title:
        description: "Human-readable title of the decision."
        semantics: "Required field. Must be present for agent consumption. No minimum-length enforcement in Phase 0+1; Phase 2 ratification session may add length gate."
        tests:
          - not_null
      status:
        description: "Lifecycle state of the decision."
        semantics: "Current free-text drift includes 'Decided', 'Superseded', 'Open', and others. Phase 2 narrows to enum. Phase 0+1 placeholder only."
        tests:
          - not_null
          - accepted_values:
              values: [Decided, Superseded, Open]
              enforced: false  # invalid values present; narrowed in Phase 2
      problem:
        description: "Problem statement that motivated the decision."
        semantics: "Optional in Phase 0+1; may gain minimum-length enforcement in Phase 2."
      decision_text:
        description: "The decision made."
        semantics: "Core narrative field. Optional in Phase 0+1."
      context:
        description: "Why this decision was made."
        semantics: "Rationale and constraints. Optional in Phase 0+1; Phase 2 may enforce minimum length."
      decided_date:
        description: "Date the decision was ratified."
        semantics: "Current drift includes empty string, 'April 2026', 'March 2026', ISO 8601 dates. Phase 2 normalises to ISO 8601 or null."
      related_decisions:
        description: "Legacy array of related decision IDs (integers)."
        semantics: "Deprecated in Phase 6 after related_decisions_v2 is populated. Do not write new values to this field post-Phase-0+1."
      related_decisions_v2:
        description: "Array of related decision IDs in dec-NNN string format."
        semantics: "Introduced Phase 0+1. Populated in Phase 4 from related_decisions integer values per the Phase 2 int-to-dec-NNN mapping table."
      created_timestamp:
        description: "SCD2 creation timestamp for this row version."
        semantics: "Set by the warehouse writer on first write. Not null post-Phase-0+1 for new rows. Historical rows may be null."
      last_updated_timestamp:
        description: "SCD2 ordering key. The row with the latest last_updated_timestamp for a given id is current."
        semantics: "Advances on every SCD2 append (status change, field update, etc.). Partition key for ops_decisions_current view post-Phase-0+1."

  ops_execution_plans:
    description: "Executor plan-revision log (SCD Type 2 -- one row per plan revision; current = latest revision per rec_id). DuckLake migration landed T2.26 (c9); the executor producer stays CD.17-frozen (Decision 67) so the table lands empty until resume."
    view_suffix: _current
    row_count:
      min: 1
      severity: warn  # empty-on-fresh-provision is expected until the frozen producer resumes
    recency:
      column: last_updated_timestamp
      warn_after_hours: 24
      error_after_hours: 168
      enforced: false  # CD.17-frozen producer: staleness is expected, not a signal
    columns:
      rec_id:
        description: "Recommendation ID this plan revision belongs to."
        semantics: "Merge key (scripts/executor/plan.py::ExecutionPlan.rec_id). SCD2: one history row per (rec_id, revision); current holds only the latest revision per rec_id."
        tests:
          - not_null:
              enforced: true
          - unique:
              # (rec_id, revision) over the history projection: no duplicate plan-revision writes. A check scoped to
              # `current` could never observe one (one row per rec_id there).
              columns: [rec_id, revision]
              projection: history
              enforced: true
          - history_not_ahead_of_current:
              # Late-replay clobber guard: no history row's revision may exceed the revision the writer's MERGE landed in
              # `current` for that rec_id (an out-of-order write silently regressing `current`).
              column: revision
              enforced: true
      status:
        description: "Plan lifecycle state."
        semantics: "Valid domain: draft | critique | approved | superseded | failed | no_changes_needed (scripts/executor/plan.py::ExecutionPlan.status)."
        tests:
          - accepted_values:
              values: [draft, critique, approved, superseded, failed, no_changes_needed]
              enforced: true

  ops_priority_queue:
    description: "Curator-generated priority rankings"
    row_count:
      min: 1
      severity: warn
    recency:
      column: last_updated_timestamp
      warn_after_hours: 36
      error_after_hours: 72
      enforced: false  # data stale beyond error threshold
    columns:
      queue_run_id:
        tests:
          - not_null:
              enforced: false  # nulls present
      rank:
        tests:
          - not_null:
              enforced: false  # nulls present
          - min_value:
              value: 1
              enforced: false  # no manifest yet; enroll after DQ remediation session
      rec_id:
        tests:
          - not_null:
              enforced: false  # nulls present
          - relationships:
              to_table: ops_recommendations
              to_column: id
              severity: warn
      mode:
        tests:
          - not_null:
              enforced: false  # nulls present
          - accepted_values:
              values: [solo, compound]
              enforced: false  # no manifest yet; enroll after DQ remediation session
