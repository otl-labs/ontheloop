# Source Registry -- canonical agent-type taxonomy for ops_recommendations.source
# Maintained as the single source of truth for valid source values.
# Enforced at write time in scripts/ops_data_portal.py via validate_source().
# CI guard in scripts/validate.py verifies schedule.yaml agent names are registered.
# Added: 2026-05-08 (Wave 1 of DQ Phase 4, Decision 66)

entries:
  - canonical_id: executor-postmortem
    description: "Autonomous postmortem agent that analyses failed executor runs and files recovery recommendations"
    signal_interpretation: "Recommendation filed as a result of an executor failure. High density signals executor reliability regression or boundary misconfiguration."
    added_date: '2026-05-08'

  - canonical_id: executor-supervision
    description: "Human-supervised executor session that monitors, diagnoses, and steers autonomous executor runs"
    signal_interpretation: "Recommendation filed during a human-in-the-loop supervision session. Often corrective; indicates a gap in autonomous executor capability."
    added_date: '2026-05-08'

  - canonical_id: code-review
    description: "Automated code review agent that audits changed files for quality, safety, and repository-wide pattern compliance"
    signal_interpretation: "Recommendation filed by the code-review skill post-implementation. Medium/Low priority recs from this source are deferred improvement items; Critical/High are mandatory pre-merge."
    added_date: '2026-05-08'

  - canonical_id: planning
    description: "Planning agent or /plan workflow session that produces PLAN-{slug}.md implementation briefs"
    signal_interpretation: "Recommendation filed as a scoping or gap artefact during planning. Often represents work deliberately deferred from the plan scope."
    added_date: '2026-05-08'

  - canonical_id: brainstorm
    description: "Exploratory brainstorming or design session that generates candidate improvements without committing to a plan"
    signal_interpretation: "Low-commitment recommendation; may be superseded or declined as design evolves. High volume from this source suggests the system is in an exploratory phase."
    added_date: '2026-05-08'

  - canonical_id: doc-freshness
    description: "Scheduled agent that identifies documentation files stale relative to their source files"
    signal_interpretation: "Recommendation filed because a doc has not been updated since its corresponding source changed. Volume tracks documentation debt accumulation rate."
    added_date: '2026-05-08'

  - canonical_id: orphan-code
    description: "Scheduled agent that detects unreferenced functions, classes, and modules in scripts/ and src/"
    signal_interpretation: "Recommendation filed for dead code removal. Persistent volume suggests refactoring cycles leave orphans; zero volume means codebase is clean or agent is misconfigured."
    added_date: '2026-05-08'

  - canonical_id: transcript-review
    description: "Scheduled agent that analyses recent session transcripts for recurring friction patterns and unresolved issues"
    signal_interpretation: "Recommendation filed from transcript analysis. Recurring themes across transcripts indicate systemic friction; one-off findings indicate ad-hoc gaps."
    added_date: '2026-05-08'

  - canonical_id: code-smell
    description: "Scheduled agent that performs lightweight static analysis for code quality issues"
    signal_interpretation: "Recommendation filed for code quality improvement. Persistent volume at the same file paths indicates the executor is not clearing its own debt."
    added_date: '2026-05-08'

  - canonical_id: prompt-quality
    description: "Scheduled agent that evaluates prompt file quality, specificity, and adherence to prompt engineering standards"
    signal_interpretation: "Recommendation filed for prompt improvement. High volume signals prompt engineering debt is accumulating faster than the executor can address it."
    added_date: '2026-05-08'

  - canonical_id: rec-curator
    description: "Scheduled agent that audits the recommendation backlog for staleness, duplicates, and superseded entries"
    signal_interpretation: "Recommendation filed for backlog hygiene. Volume tracks recommendation lifecycle health; low volume means the backlog is clean."
    added_date: '2026-05-08'

  - canonical_id: manual
    description: "Human operator filing a recommendation directly via the ops_data_portal CLI or Python API"
    signal_interpretation: "Human-initiated recommendation. Always treated as intentional; not subject to automated source injection. High volume indicates active human oversight or bootstrapping activity."
    added_date: '2026-05-08'

  - canonical_id: scoping
    description: "Scoping agent or /implement workflow that decomposes a STRATEGIC plan into atomic executor recommendations"
    signal_interpretation: "Recommendation filed by the scoping step of /implement. Volume tracks how many strategic plans have been broken down; should correlate with planning activity."
    added_date: '2026-05-08'

  - canonical_id: cli-migration-analysis
    description: "One-time analysis agent that audited the codebase for CLI migration gaps and compatibility issues"
    signal_interpretation: "Recommendation filed during a targeted migration analysis session. Low expected volume; historical source for recs filed during the copilot-to-Claude Code CLI transition."
    added_date: '2026-05-08'

  - canonical_id: telemetry-audit
    description: "Agent session that audited telemetry coverage, schema correctness, and instrumentation gaps"
    signal_interpretation: "Recommendation filed to improve observability. Volume tracks instrumentation debt; should trend to zero as telemetry matures."
    added_date: '2026-05-08'

  - canonical_id: executor-gap-analysis
    description: "Agent session that analysed gaps between executor capability and the open recommendation backlog"
    signal_interpretation: "Recommendation filed to extend executor capability boundary. High volume indicates the boundary is being actively pushed; zero volume indicates the boundary is stable."
    added_date: '2026-05-08'

  - canonical_id: architectural-review
    description: "Agent session that reviewed system architecture, design decisions, and structural integrity"
    signal_interpretation: "Recommendation filed from an architectural review. Typically high-impact, low-volume. Source used for structural or cross-cutting recommendations that do not fit a single file target."
    added_date: '2026-05-08'

  - canonical_id: implement-agent
    description: "Implementation agent (/implement workflow) filing recs for out-of-scope issues discovered during execution"
    signal_interpretation: "Recommendation filed as a side-effect of implementation work. Indicates scope creep was avoided by filing rather than fixing inline. Volume tracks discipline of the out-of-scope rule."
    added_date: '2026-05-08'

  - canonical_id: cc-scheduled-agent-test
    description: "Test invocation of a Claude Code scheduled agent, used to verify harness routing and packaging integrity"
    signal_interpretation: "Recommendation filed during a smoke-test or harness validation run. Should be rare; unexpected volume indicates test runs are producing artefacts in production."
    added_date: '2026-05-08'

  - canonical_id: workflow-audit
    description: "Agent session that audited CI/CD workflows, automation scripts, and operational runbook coverage"
    signal_interpretation: "Recommendation filed to improve automation reliability. Volume tracks workflow debt; should trend to zero as automation matures."
    added_date: '2026-05-08'

  - canonical_id: tech-debt
    description: "Agent session focused on identifying and cataloguing technical debt items for future resolution"
    signal_interpretation: "Recommendation filed as an explicit tech-debt item. High volume signals intentional debt accumulation; low volume means debt is being addressed faster than it accumulates."
    added_date: '2026-05-08'

  - canonical_id: delegate-investigation
    description: "Agent session delegated to investigate a specific issue, behaviour, or anomaly and report findings"
    signal_interpretation: "Recommendation filed as an outcome of a delegated investigation. Volume tracks how often investigations produce actionable findings vs. closing without recs."
    added_date: '2026-05-08'

  - canonical_id: infra-recommendation-executor
    description: "Infrastructure-focused executor session that implements Terraform, AWS config, or deployment recommendations"
    signal_interpretation: "Recommendation filed during infrastructure implementation work. Volume tracks infra debt; should correlate with Terraform and Lambda change rate."
    added_date: '2026-05-08'

  - canonical_id: autonomous-postflight-cleanup
    description: "Autonomous postflight agent that performs session-close cleanup, log sync, and outbox drain operations"
    signal_interpretation: "Recommendation filed during automated session cleanup. Unexpected volume may indicate the postflight is over-reaching its cleanup scope."
    added_date: '2026-05-08'

  - canonical_id: agent-cron
    description: "Legacy Lambda catch-all source value for all scheduled agents dispatched via the CloudWatch Events Lambda path (disabled May 2026)"
    signal_interpretation: "Historical source value from the Lambda-based scheduler era. Present in bootstrap JSONL cache for recs filed before the Claude Code scheduled agent migration. No new recs should carry this value -- use the specific agent canonical_id instead."
    added_date: '2026-05-08'

  - canonical_id: ci_rca
    description: "CI failure root-cause analysis agent triggered by workflow_run on CI failure; files one rec per failed check, priority derived from its repair track (Decision 226)"
    signal_interpretation: "Recommendation filed by automated CI triage. Each rec maps to one failed CI run. Open recs from this source are surfaced by session_preflight.py and block overlapping work, and all new work once past the repair SLO (scripts.ci_rca.red_overlap, Decision 226)."
    added_date: '2026-05-11'

  - canonical_id: budget_breach
    description: "Fast-tier validation budget breach detector in scripts/validate.py; fires when --pre wall-clock exceeds 5 minutes"
    signal_interpretation: "Recommendation filed automatically when the fast tier overruns its 5-minute design budget. Accumulation signals that slow checks have crept into the fast tier. Zero volume is the target state."
    added_date: '2026-05-13'

  - canonical_id: budget_bypass
    description: "Fast-tier budget assertion bypass audit; filed when --ignore-budget flag is used on validate.py --pre"
    signal_interpretation: "Recommendation filed each time an operator bypasses the fast-tier budget gate. Three or more in a rolling 7-day window surfaces a soft alert in session_preflight. Persistent volume indicates the fast tier needs to be restructured, not repeatedly bypassed."
    added_date: '2026-05-13'

  - canonical_id: implement-session
    description: "Legacy source value for recs filed during an /implement session before the canonical implement-agent / scoping taxonomy was adopted"
    signal_interpretation: "Historical source value present in the migrated bootstrap data only. No new recs should carry this value -- use implement-agent or scoping instead. Registered as a legacy entry so the public-migration import (Phase C) passes validate_source for these preserved rows."
    added_date: '2026-05-28'

  - canonical_id: Autonomous Postflight Cleanup
    description: "Legacy free-text source value (Title Case, with spaces) for recs filed by the autonomous postflight before the kebab-case autonomous-postflight-cleanup canonical_id was adopted"
    signal_interpretation: "Historical source value present in the migrated bootstrap data only; validate_source is exact-match so this differs from autonomous-postflight-cleanup. No new recs should carry this value -- use autonomous-postflight-cleanup instead. Registered so the public-migration import (Phase C) preserves the source verbatim without aborting."
    added_date: '2026-05-28'

  - canonical_id: tf_drift
    description: "Scheduled Terraform drift detector that runs terraform plan against sandbox and flips the convergence record on a state-vs-code delta"
    signal_interpretation: "A green->red convergence flip from out-of-band infra drift -- volume tracks how often real infra diverges from code. One rec per drift event (deduped while the record is already red); rec clears via the dispatch-ack apply path (the converged apply writes green, then the rec is closed via the standard portal path)."
    added_date: '2026-06-24'

  - canonical_id: tf_convergence_stale
    description: "CD-convergence staleness escalation sensor (CD.35 Wave 6 / T2.35): fires when the sandbox convergence record has been red longer than the configured threshold, when a terraform-apply-sandbox gated-apply job has been waiting on the tf-gated-apply Environment beyond threshold (independent of the record's own colour -- a routed gated-apply deliberately leaves the record green while it waits), or when a green record carries an unapplied terraform/personal/ backlog that has persisted past STALE_GREEN_BACKLOG_THRESHOLD_HOURS"
    signal_interpretation: "Persistence escalation -- one rec per episode across three conditions (deduped: update_rec on subsequent over-threshold ticks; no duplicate filing): persistently-red, stuck-approval, and stale-green-backlog. Volume tracks how often the convergence pipeline stalls without self-clearing, including the green-but-stuck blind spot a red-only check would miss. Each rec closes automatically on the condition that resolves it (next sensor tick runs update_rec --status closed): approvals-clear for the stuck-approval condition, backlog-drained for the stale-green-backlog condition, or record-returns-to-green for the persistently-red condition. A rec from this source does NOT hard-block the /plan queue (priority=High, not source=ci_rca/priority=critical); it escalates visibly without wedging planning."
    added_date: '2026-06-27'

  - canonical_id: ci_rca_evidence_dispute
    description: "Typed dispute path against an existing source=ci_rca rec: routes agent/bundle disagreement through /plan human review (Decision 72) rather than a silent agent override. Filed when the ci-rca agent's detection_gap cross-check disagrees with the deterministic evidence bundle on earliest_viable_gate or actual_gate_that_caught_it (INTENT Section 2 / Section 4 check 8)."
    signal_interpretation: "Review-resolution flow: open dispute recs surface in /plan under 'CI-RCA Dispute Recs (open)'. When the bundle SCRIPT logic is the defect, /plan scopes a PLAN-ci-rca-evidence-script fix; when the AGENT value is wrong, the dispute is closed declined. Dispute recs do NOT hard-block the /plan queue (they are review requests, not CI failures). High volume without resolution indicates the evidence bundle script needs a targeted fix."
    added_date: '2026-06-29'

  - canonical_id: ci_rca_probe_health
    description: "CI-RCA probe abstention health sensor (T1.13 c12(i)): fires when the deterministic evidence probe's abstention rate (rca_confidence=undetermined across source=ci_rca recs in the trailing window) meets or exceeds threshold, indicating the probe is systematically unable to classify earliest_viable_gate/escape_mode."
    signal_interpretation: "Persistence escalation -- one rec per sustained-abstention episode (deduped: update_rec on subsequent over-threshold ticks; no duplicate filing). Volume tracks how often the deterministic evidence bundle degrades to a pass-through. The rec closes automatically when the abstention rate returns under threshold (next sensor tick runs update_rec --status closed with the sub-threshold rate recorded as proof). A rec from this source does NOT hard-block the /plan queue (priority=High, not source=ci_rca/priority=critical); it escalates visibly without wedging planning."
    added_date: '2026-07-01'

  - canonical_id: cost_reconciliation
    description: "Monthly invoice-vs-telemetry cost reconciliation monitor (CD.28 / ULF-08): evaluates the five cost_projection.reevaluation_triggers plus KG.7's programmatic-pool-exhaustion concern against a per-provider cost snapshot and files a rec when a trigger trips or the invoice/telemetry discrepancy exceeds 5%."
    signal_interpretation: "Alarm-not-gate cost signal (Decision 55 / Decision 62) -- deduped one-rec-per-trigger-episode (update_rec on persistence) and auto-closed on clear (update_rec status=closed), mirroring the tf_convergence_stale / ci_rca_probe_health pattern. Volume tracks how often the cost envelope's watched lines breach; it never blocks a merge or auto-remediates."
    added_date: '2026-07-02'

  - canonical_id: ci_rca_warn_period_audit
    description: "Phase-4 back-validation CLI (scripts.ops_data_portal --back-validate, T1.13 c2 enabler): re-validates warn-period source=ci_rca recs against the current CI_RCA_STRICT_MODE schema and, with --refile-audit, files one audit rec per non-conformant parent (schema deficiency or a stamped non-schema warn_mode_reject reason), capped at 20/day."
    signal_interpretation: "Surfacing-only audit trail (Decision 55) -- never auto-closes, auto-remediates, or flips the strict-mode flag. Each rec carries the parent rec id and its failing-checks list. Volume tracks how many warn-period recs would have been rejected under strict mode; feeds the evidence base for the CI_RCA_STRICT_MODE warn->strict cutover decision (T1.13 c2), it does not perform the flip."
    added_date: '2026-07-05'

  - canonical_id: ducklake_code_drift
    description: "DuckLake Lambda code-drift sensor (T2.38 / Decision 125/126): runs on the convergence-health cron and compares each deploy-records/ducklake/<function>.json's recorded source_git_sha against the latest main commit touching ducklake source paths, for all four DuckLake functions (writer, reader, maintenance, catalog-dr)."
    signal_interpretation: "Alarm-not-gate (Decision 55) -- one deduped rec per drift episode (update_rec on persistence; no duplicate filing), mirroring the tf_convergence_stale pattern. Volume tracks how often the governed deploy channel's live code falls behind main (e.g. a bootstrap-window no-op deploy, a failed governed run). The rec closes automatically when every function's deploy record matches the latest ducklake-source commit (next sensor tick runs update_rec --status closed). Priority High, not source=ci_rca -- does NOT hard-block the /plan queue."
    added_date: '2026-07-13'

  - canonical_id: reconcile_starved
    description: "Decision 162 / rec-2664: filed by reconcile.yml's file-reconcile-starved-rec job when the reconcile.yml subagent plan reviewer STARVED (max-turns/no-verdict/API-exhausted after the same-budget retry) while re-applying a previously red sandbox commit -- the observability gap the STARVED-skips-the-write anti-masking path (Decision 55, T2.39 c3) would otherwise leave silent on the Reconcile heal-button path."
    signal_interpretation: "Durable observability record, not a gate -- the job that files it carries no terraform apply and is no part of reconcile.yml's terminal route set (Decision 158). One rec per starved Reconcile episode; volume tracks how often the heal-button path itself hits reviewer starvation, distinct from the routine sandbox push path's own STARVED rate (see the review.sh STARVED marker, mirrored to $GITHUB_STEP_SUMMARY). Priority High, not source=ci_rca -- does NOT hard-block the /plan queue."
    added_date: '2026-08-02'

  - canonical_id: prod_code_drift
    description: "Prod-class Lambda code-drift sensor (T2.43 / Decision 125/126): runs on the convergence-health cron and compares each deploy-records/prod/<function>.json's recorded source_git_sha against the latest main commit touching prod source paths, for the prod-class functions (scheduled-agent-dispatcher, findings-processor)."
    signal_interpretation: "Alarm-not-gate (Decision 55) -- one deduped rec per drift episode (update_rec on persistence; no duplicate filing), mirroring the ducklake_code_drift pattern. Volume tracks how often the governed deploy channel's live code falls behind main (e.g. a bootstrap-window no-op deploy, a failed governed run, or a workflow_dispatch recovery deploy stamping a sha that postdates the latest source change). The rec closes automatically once every function's deploy record reaches the latest prod-source commit under the reachability oracle (next sensor tick runs update_rec --status closed). Priority High, not source=ci_rca -- does NOT hard-block the /plan queue."
    added_date: '2026-08-18'

  - canonical_id: executor-hotfix
    description: "Filed by scripts.executor.branch_lifecycle.file_hotfix_rec() when the autonomous executor applies a mid-flight hotfix to a rec's own working branch during execution."
    signal_interpretation: "Tracks a fix applied outside the rec's original plan, referencing the parent rec_id so the hotfix can be reviewed to determine root-cause vs symptom. Dormant while the executor is frozen (Decision 67) -- no new recs expected from this source until the executor resumes; volume then tracks mid-flight-correction frequency."
    added_date: '2026-08-18'

  - canonical_id: loop_liveness_stale
    description: "Scheduled-loop liveness backstop (audit finding LSA-02, loop-spec-adoption-4d8bac4a; success leg PLAN-monitor-liveness-sweep): runs on the convergence-health cron and derives the schedule-bearing peer set from every .github/workflows/*.yml on:.schedule block AT RUN TIME (never a declared register). TWO independent legs judge each peer against the SAME cron-derived threshold: CADENCE asks whether the newest event=schedule run exists at all (has the schedule stopped firing?), SUCCESS asks whether the newest event=schedule run with status=success exists (does it fire on cadence but never succeed?) -- the cadence leg alone cannot see a schedule that fires hourly and fails every single time."
    signal_interpretation: >-
      Alarm-not-gate (Decision 55) -- one deduped rec per (loop, leg) episode (update_rec on
      persistence; the open matcher keys on (loop, leg), so a recovery-then-redeath while the rec is
      open updates it rather than minting a fresh episode -- a marker-less title is always the
      CADENCE leg, since every rec filed before the success leg existed carries no leg marker) or
      one collapsed __fleet__ rec PER LEG when 3+ peers are stale simultaneously ON THAT LEG (a
      distinct-peer count per leg, never a (peer, leg)-pair count, so two peers stale on both legs
      never spuriously collapses a fleet that only a real 3-peer correlated outage should). Both
      legs FILE/UPDATE ONLY, NEVER auto-closed: restored cadence, or a first success, does not
      resolve a filed rec; a human investigates and closes it. Three tuning/grain calls, stated
      here because this leg's own plan (PLAN-sensor-liveness, extended by PLAN-monitor-liveness-sweep)
      routes field semantics to the registry and nowhere else: (a) threshold = clamp(2 x nominal
      cron period, 6h, 45d) -- the floor tolerates GitHub's best-effort scheduled delivery on the
      two hourly loops (~5 missed runs), the ceiling is the LARGEST threshold whose first staleness
      bucket [T, 2T) still fits inside the 90-day Actions run-retention horizon (2 x 45d = 90d
      exactly), so a live run:{id} anchor never flips to an intro:{sha} anchor mid-bucket; this
      clamp imposes a numeric detection latency per cadence class -- 6 hours to detect a dead hourly
      loop, 14 days a dead weekly loop, 45 days a dead monthly loop -- applied identically to both
      legs. (b) FLEET_COLLAPSE_MIN_STALE = 3: when 3 or more derived peers are simultaneously stale
      ON ONE LEG, per-loop episodes on THAT LEG are suppressed (never closed) in favour of one
      leg-keyed fleet rec, because a correlated outage is one incident with one root cause, not N
      defects; 3 rather than a 5-of-9 majority because the live threshold classes are 6h x3 (both
      hourly loops plus the every-3-hours loop), 14d x5 (the weeklies) and 45d x1 (the monthly), so
      a total delivery outage reaches 3 stale at T+6h but would not reach a majority until T+14d --
      a majority rule would have missed the 2026-08-15 OIDC-rename incident (Decision 172) entirely,
      since it resolved within days. (c) Buckets advance on a log2 schedule (1x, 2x, 4x, 8x ... the
      threshold), bounding recs per EPISODE (~11/year for a permanently-dead loop) but not episode
      count, so a flap needs a TWO-LEG post-closure dwell (a per-episode dwell distinct from the
      cadence/success LEGS above): same-anchor mutes while
      current_bucket <= max_resolved_bucket + 1 (a closure anywhere inside a bucket buys one full
      bucket-width of quiet); cross-anchor -- needed because a flap changes the anchor, which the
      same-anchor dwell cannot see across -- mutes while now - closed_at < threshold, using the
      newest resolved rec's closure timestamp (one rec_by_id call, only when the same-anchor dwell
      did not already mute); the resolved sweep is loop-wide (both legs share one warehouse read,
      leg-discriminated client-side, Decision 88). Priority High, not source=ci_rca -- does NOT
      hard-block the /plan queue; it escalates visibly without wedging planning. Volume tracks how
      often a scheduled workflow goes silent (auto-disable, a removed schedule: block, a delivery
      drop) OR fires on cadence while every run fails, rather than merely producing an occasional
      bad run, which the fleet's other sensors already cover.
    added_date: '2026-09-07'

  - canonical_id: backlog_health_vacuous_probe
    description: "scripts.backlog_health scheduled monitor (PLAN-backlog-health-detection, Decision 62 2026-06-16 amendment / CD.12): class 1 -- an open rec whose acceptance command exits 0 under probe.py's sandboxed isolation but no commit has touched rec.file since the rec's creation."
    signal_interpretation: "A probe pass here proves nothing -- the target never changed, so the acceptance command was vacuously satisfied rather than verifying a real fix. Alarm-not-gate: one deduped rec per episode (rec_episode.run_episode), never auto-closed, never touches an individual backlog rec by id. Volume tracks how many open recs' acceptance commands are stale-but-passing; the corrective action is per-rec triage in /plan, not automated repair."
    added_date: '2026-09-07'

  - canonical_id: backlog_health_acceptance_quality
    description: "scripts.backlog_health scheduled monitor: class 2 -- an open rec whose acceptance command is either lint-rejected (the same banned-pattern shape validate_recommendations_schema.py already rejects: an unquoted 'python -c' one-liner, or a bare --pre flag) or non-discriminating (no construct whose outcome could ever differ between a fixed and a broken tree)."
    signal_interpretation: "Low-quality acceptance commands erode the recommendation backlog's own self-verification value. Alarm-not-gate, one deduped rec per episode; volume tracks how many open recs carry an acceptance command that cannot actually discriminate pass from fail."
    added_date: '2026-09-07'

  - canonical_id: backlog_health_dependency_ref
    description: "scripts.backlog_health scheduled monitor: class 3 -- an open rec whose `dependencies` array carries a malformed entry (not a bare rec-<digits> string) or a dangling one (well-shaped but naming an id absent from the known corpus)."
    signal_interpretation: "Measured empty on the open backlog by design (Bundle 1 / #1007's write-time array_element_format prospectively guards the malformed arm) -- an empty finding set here is a clean pass, not evidence the detector is inert. Alarm-not-gate, one deduped rec per episode when non-empty."
    added_date: '2026-09-07'

  - canonical_id: backlog_health_premise_dead
    description: "scripts.backlog_health scheduled monitor: class 4 -- an open rec whose rec_relevance.py verdict is stale_target (its target file no longer exists; split at the Decision 64 2026-05-01 bootstrap-cohort anchor) or duplicate (title Jaccard >= 0.7 against another open rec on the same file)."
    signal_interpretation: "Composes scripts.rec_relevance.py (Decision 103: THE relevance evaluator) rather than re-deriving it. Alarm-not-gate, one deduped rec per episode; volume tracks how much of the open backlog has decayed since its premise was written or duplicated another entry."
    added_date: '2026-09-07'

  - canonical_id: security_detector_stale
    description: "Liveness probe of the platform-security-* IAM-change detector (rec-4044, Decision 202): security-detector-liveness.yml runs scripts.ci.security_detector_probe hourly and fails when a detector alarm is missing, disabled or not targeting the alerts topic, the IAM-event heartbeat alarm is not OK, a detector alarm recorded a failed action in the last 25 hours, the alerts topic carries a KMS key or a Deny policy statement, or no email subscription is confirmed."
    signal_interpretation: "Alarm-not-gate (Decision 55) -- one rec per healthy-to-unhealthy transition of the probe (filed only when the previous completed scheduled run succeeded, or none exists; a failed lookup files anyway). Never auto-closed. Distinct from tf_drift so Decision 190 clause 5's convergence gap check can never be satisfied by it; a persistently red run is also backstopped by loop_liveness_stale. Priority High, not source=ci_rca -- does NOT hard-block the /plan queue."
    added_date: '2026-09-25'

  - canonical_id: claude-code-subagent
    description: "A sub-agent spawned by the Claude Code Agent tool; its raw agentType is carried in telemetry_agents.agent_name (the Claude Code set is open and user-extensible)."
    signal_interpretation: "telemetry_agents.agent_type for every sub-agent run captured from a Claude Code transcript (PLAN-telemetry-turn-capture-core). Also a valid ops_recommendations.source value by the shared-registry contract."
    added_date: '2026-09-29'

  - canonical_id: telemetry_verify
    description: "Telemetry verification findings (telemetry slice 4, rec-4025): the golden replay through the deployed writer and reader, the in-session source check (stored rows against a fresh re-parse of the transcript, tokens against Claude Code's cost-state ledger), and the daily verification monitor (re-derived verb outputs, orphans, silent-failure checks and session-list completeness)."
    signal_interpretation: "Alarm-not-gate (Decision 210 cl.2, Decision 61) -- one deduped rec per finding class (update_rec on persistence; no duplicate filing). Volume tracks how often stored telemetry disagrees with its source or its contract derivations and should be zero; declared residual classes (owner recs named in the finding) are counted, never filed. Never blocks capture, merges or deploys."
    added_date: '2026-10-17'
