# Read-set band table for scripts/roadmap/read_set_report.py (measure-only; nothing gates on it; rec-5256).
# Bands (precedence: always_read, then gate_subagent, then on_demand; a file fitting two takes the earlier):
#   always_read:   read in full by the root agent on every run of the workflow.
#   gate_subagent: read in full by a gate sub-agent the workflow dispatches (decision-scout, plan-critique, code-review).
#   on_demand:     read only on a condition or in part, so outside the token estimate.
# tokens = (always_read + gate_subagent) // 4. alt_band is the reading if the file is consulted in part (judgment-banded).
# Edit rule: any change to a run's files rows recomputes that run's stored baselines in the same change
# (tests/test_read_set_report.py::test_stored_baselines_match_recompute enforces it).
# entry_files: the files the drift scan reads for named read targets. extra: read targets kept outside every total.
# exclude: named paths that are not read targets. baselines: stored totals per band at their boundary.
runs:
  planning:
    entry_files: [.claude/commands/plan.md, .claude/skills/planning/SKILL.md]
    files:
      - {path: CLAUDE.md, band: always_read, basis: "ambient; imports AGENTS.md"}
      - {path: AGENTS.md, band: always_read, basis: "CLAUDE.md: the @AGENTS.md import"}
      - {path: .claude/commands/plan.md, band: always_read, basis: "the command itself"}
      - {path: .claude/skills/planning/SKILL.md, band: always_read, basis: "plan.md: invoke the planning skill"}
      - {path: docs/PROJECT_CONTEXT.md, band: always_read, basis: "plan.md: the context load step"}
      - {path: docs/contracts/file-router.yaml, band: always_read, alt_band: on_demand, basis: "plan.md Step 4 and PROJECT_CONTEXT.md: every plan, no section bound"}
      - {path: docs/contracts/git-ops.yaml, band: always_read, alt_band: on_demand, basis: "AGENTS.md git-ops pointer: read before any push; every plan pushes"}
      - {path: docs/contracts/project-alignment.yaml, band: always_read, alt_band: on_demand, basis: "plan.md alignment step: every plan, no section bound"}
      - {path: .claude/skills/decision-scout/SKILL.md, band: gate_subagent, basis: "plan.md: the decision-scout gate"}
      - {path: docs/contracts/north-star.yaml, band: gate_subagent, basis: "decision-scout SKILL.md: north-star read"}
      - {path: docs/decisions-index.json, band: gate_subagent, basis: "decision-scout SKILL.md: the index it triages"}
      - {path: .claude/skills/plan-critique/SKILL.md, band: gate_subagent, basis: "plan.md: the plan-critique gate"}
      - {path: docs/contracts/instruction-architecture.yaml, band: on_demand, basis: "AGENTS.md Instruction architecture: one block named"}
      - {path: docs/contracts/plan-obligations.yaml, band: on_demand, basis: "read by scripts/roadmap/plan_obligations.py; no agent surface names it"}
      - {path: docs/contracts/overseer-dispatch.yaml, band: on_demand, basis: "plan.md: section anchor autonomy_tiers.plan_fork_classification"}
      - {path: docs/contracts/decision-entry.yaml, band: on_demand, basis: "planning SKILL.md: significance section, only when a Decision is drafted"}
    extra:
      - {path: docs/DECISIONS.md, when: "every plan, in part: only the sections the scout shortlists and the plan cites"}
      - {path: docs/ROADMAP-PLATFORM.yaml, when: "every plan, in part: plan-critique extracts the items the plan names"}
      - {path: docs/contracts/deploy-paths.yaml, when: "scope touches an admin-only Terraform root"}
      - {path: .claude/skills/implement/SKILL.md, when: "every plan, in part: its Commit Flows section at Step 11"}
      - {path: docs/contracts/data-modeling-standard.yaml, when: "a table, field_semantics entry or warehouse write path is in scope"}
      - {path: docs/contracts/environment-taxonomy.yaml, when: "Terraform files are in scope"}
      - {path: docs/contracts/implement-scope-boundary.yaml, when: "amendment mode after a plan-defect report"}
      - {path: docs/contracts/exit-criteria-ledger.yaml, when: "the plan sets closes_criteria or followon_recs"}
      - {path: docs/contracts/vp-red-before.yaml, when: "any hermetic or pre-deploy verification step"}
      - {path: docs/contracts/tier-item-lifecycle.yaml, when: "intent resolves to a roadmap item or to an in_progress item"}
      - {path: terraform/CLAUDE.md, when: "Terraform roots are in scope"}
      - {path: docs/contracts/_joins.yaml, when: "the plan needs a join or correlation key"}
      - {path: docs/contracts/build-lambda.yaml, when: "a Lambda-packaged artifact is affected"}
      - {path: docs/contracts/candidate-decision-ratification.yaml, when: "the plan carries a ratification block"}
      - {path: docs/contracts/decision-kind.yaml, when: "a Decision candidate is drafted"}
      - {path: docs/contracts/recommendation-relevance.yaml, when: "the plan bundles recommendations"}
      - {path: docs/contracts/red-main-recovery.yaml, when: "red_overlap reports a red"}
    exclude:
      - {path: .claude/commands/implement.md, reason: "named as the portal-call reference for a planning-time split, not read by planning"}
      - {path: .claude/skills/orient/SKILL.md, reason: "named as a prior session's skill; /orient is a separate run"}
      - {path: .claude/skills/overseer/SKILL.md, reason: "named for the retired dispatch trampoline, not read by planning"}
      - {path: logs/.preflight-report.json, reason: "gitignored, generated each run, about 174 KB per the audit Q2 prose; read by plan.md but git cannot size it"}
    baselines:
      - boundary: "2026-08-07"
        ref: e871e89100ebd1ee77af675139c85b8b63a8b96c  # pragma: allowlist secret
        primary: {always_read: 137615, gate_subagent: 138578, on_demand: 64054}
        alternative: {always_read: 113782, gate_subagent: 138578, on_demand: 87887}
      - boundary: "177c8f37"
        ref: 177c8f376dc4b0d93208f1f737271d868a4a18eb  # pragma: allowlist secret
        primary: {always_read: 193734, gate_subagent: 232354, on_demand: 115777}
        alternative: {always_read: 89129, gate_subagent: 232354, on_demand: 220382}
  implementing:
    entry_files: [.claude/commands/implement.md, .claude/skills/implement/SKILL.md]
    files:
      - {path: CLAUDE.md, band: always_read, basis: "ambient; imports AGENTS.md"}
      - {path: AGENTS.md, band: always_read, basis: "CLAUDE.md: the @AGENTS.md import"}
      - {path: .claude/commands/implement.md, band: always_read, basis: "the command itself"}
      - {path: .claude/skills/implement/SKILL.md, band: always_read, basis: "implement.md: invoke the implement skill"}
      - {path: docs/PROJECT_CONTEXT.md, band: always_read, basis: "implement.md Step 2: also read docs/PROJECT_CONTEXT.md"}
      - {path: docs/contracts/git-ops.yaml, band: always_read, alt_band: on_demand, basis: "implement.md: canonical git-ops procedure"}
      - {path: .claude/skills/code-review/SKILL.md, band: gate_subagent, basis: "implement SKILL.md: Code Review Protocol subagent invokes it"}
      - {path: docs/contracts/candidate-decision-ratification.yaml, band: on_demand, basis: "implement SKILL.md: CD Ratification Bookkeeping, only with a ratification block"}
      - {path: docs/contracts/ci-rca-lifecycle.yaml, band: on_demand, basis: "implement SKILL.md: Wait-for-CI red branch"}
      - {path: docs/contracts/exit-criteria-ledger.yaml, band: on_demand, basis: "implement SKILL.md: Tier_item bookkeeping"}
      - {path: docs/contracts/implement-scope-boundary.yaml, band: on_demand, basis: "implement SKILL.md: Deviation trigger"}
      - {path: docs/contracts/overseer-dispatch.yaml, band: on_demand, basis: "implement SKILL.md: gate_request_trampoline, subagent mode only"}
      - {path: docs/contracts/recommendation-relevance.yaml, band: on_demand, basis: "implement SKILL.md: Bundled Recommendation Relevance Re-check"}
      - {path: docs/contracts/tier-item-lifecycle.yaml, band: on_demand, basis: "implement SKILL.md: Tier_item bookkeeping read-trigger"}
      - {path: docs/contracts/verification-registry.yaml, band: on_demand, basis: "implement SKILL.md: Verification Graduation"}
      - {path: docs/contracts/deploy-paths.yaml, band: on_demand, basis: "AGENTS.md Lambda deploy channel: check first when a production action is denied"}
      - {path: .claude/skills/overseer/SKILL.md, band: on_demand, basis: "implement SKILL.md: Fable Advice-Consult Protocol"}
      - {path: .claude/skills/planning/SKILL.md, band: on_demand, basis: "implement SKILL.md: named for the Lambda deployment assessment"}
      - {path: .claude/skills/executor-rca/SKILL.md, band: on_demand, basis: "implement.md: Step 8 RCA-first protocol"}
    extra:
      - {path: docs/DECISIONS.md, when: "only the decisions cited in the plan context, located by rg"}
      - {path: docs/ROADMAP-PLATFORM.yaml, when: "bookkeeping walk, only the plan's tier_item"}
    exclude:
      - {path: logs/.preflight-report.json, reason: "gitignored, generated each run, about 174 KB per the audit Q2 prose; read by implement.md but git cannot size it"}
    baselines:
      - boundary: "2026-08-07"
        ref: e871e89100ebd1ee77af675139c85b8b63a8b96c  # pragma: allowlist secret
        primary: {always_read: 102845, gate_subagent: 12605, on_demand: 165139}
        alternative: {always_read: 102845, gate_subagent: 12605, on_demand: 165139}
      - boundary: "177c8f37"
        ref: 177c8f376dc4b0d93208f1f737271d868a4a18eb  # pragma: allowlist secret
        primary: {always_read: 127497, gate_subagent: 12568, on_demand: 371543}
        alternative: {always_read: 73157, gate_subagent: 12568, on_demand: 425883}
