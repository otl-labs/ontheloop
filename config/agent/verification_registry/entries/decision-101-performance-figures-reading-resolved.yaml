check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; from scripts.checks.decisions.entry_resolution import live_block; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    f=lambda s: [m.group(1) for m in re.finditer(r''^## Decision (\d+): (.*)$'', t, re.M) if s in m.group(2)]; b=f(''Recursive
    self-improvement is proven against a judge the loop cannot edit''); assert len(b)==1, (''proof-design Decision absent'',
    b); n=b[0]; blk=live_block(t, 101); U=r''^> \*\*Update \(\d{4}-\d{2}-\d{2}\):\*\* ''; got=[] if blk is None else [x for
    x in blk.splitlines() if re.match(U, x) and ''financial performance of any kind'' in x]; assert blk is None or len(got)==1,
    (''expected exactly one dated point (d) reading on Decision 101'', got); x=got[0] if got else ''''; need=[''performance
    figures'', ''financial performance of any kind'', ''Decision ''+n+'' clause 5'', ''not published under point (d) as it
    stands'', ''supersede this entry in full'']; assert blk is None or (re.search(r''rec-\d{4,}'', x) and ''rec-X'' not in
    x and ''DATE'' not in x and ''cost'' not in x.lower()), (''rec id, placeholder or cost wording'', x); miss=[p for p in
    need if blk is not None and p not in x]; assert not miss, (''Decision 101 reading text missing'', miss); print(''DEC_101_READING_RESOLVED_OK'',
    n, ''live'' if blk is not None else ''compacted'')"'
