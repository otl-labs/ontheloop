check_id: decisions-index-archive-rows-are-skeletons
primitive_slot: command_exit_zero
guard_target: docs/decisions-index.json
guard_symbol: null
plan_slug: migration-step-5-index-skeleton
graduated_at: '2026-08-18'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - import json; d=json.load(open('docs/decisions-index.json'))['decisions']; SKEL={'number','title','status','decided_date','supersedes','superseded_by','amends','live'}; FULL=SKEL|{'triage_excerpt','triage_excerpt_source','triage_excerpt_truncated','category_tags','currency'};
    a=[r for r in d if not r['live']]; l=[r for r in d if r['live']]; assert a and l, (len(a),len(l)); bad=[r['number'] for r in a if set(r)!=SKEL]; assert not bad, ('archive row not a skeleton',bad); EXT={'serves','kind'}; lbad=[r['number']
    for r in l if set(r) not in (FULL, FULL|EXT)]; assert not lbad, ('live row lost a key',lbad); assert any(set(r)==FULL|EXT for r in l), 'no live row carries serves and kind'; ar=len(json.dumps(a))/len(a); lr=len(json.dumps(l))/len(l); assert ar < 0.5*lr, ('archive rows not materially thinner',ar,lr);
    print('SKELETON_SHAPE ok')
