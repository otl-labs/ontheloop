check_spec:
  command:
  - bin/venv-python
  - -c
  - import yaml, pathlib; from scripts.decisions_index import build_index; from scripts.decisions_md import parse_decisions_md, status_is_superseded; ds=build_index()['decisions']; d={e['number']:e for
    e in ds}; exp={44:'superseded_compacted',58:'superseded_compacted',37:'superseded_compacted',80:'superseded_pointer',43:'amended',67:'superseded_compacted',168:'current'}; bad={n:(d[n].get('currency'),v) for n,v
    in exp.items() if d[n].get('currency')!=v}; assert not bad, bad; vocab=set(yaml.safe_load(pathlib.Path('docs/contracts/decision-entry.yaml').read_text())['currency']['values']); live=[e for e in ds
    if e['live']]; assert all(e.get('currency') in vocab for e in live), [e['number'] for e in live if e.get('currency') not in vocab]; rows={r['decision_id']:r['raw_block'] for r in parse_decisions_md()};
    marked={n for n,b in rows.items() if status_is_superseded(b)}; compacted={e['number'] for e in live if e['currency']=='superseded_compacted'}; assert compacted==(marked & {e['number'] for e in live}),
    (sorted(compacted), sorted(marked)); print('derivation OK; compacted set ==', sorted(compacted))
