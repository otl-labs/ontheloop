check_id: structural-frozen-base-side-legs
primitive_slot: command_exit_zero
guard_target: scripts/checks/structural/budget_raises.py
guard_symbol: frozen_base_violations
plan_slug: roadmap-size-ceiling
graduated_at: '2026-08-05'
graduated_by: implement-agent
check_spec:
  command:
  - bin/venv-python
  - -c
  - |
    import pathlib
    from scripts.checks.structural.budget_raises import frozen_base_violations
    LINE = "docs/contracts/decision-entry.yaml: 508"
    base = pathlib.Path("config/structural_size_budgets.yaml").read_text(encoding="utf-8")
    assert LINE in base, "the frozen pin line moved -- re-anchor this probe before trusting it"
    def e4(cur):
        return [x for x in frozen_base_violations(base, cur) if x.startswith("E4:")]
    assert frozen_base_violations(base, base) == [], "a no-op diff must be clean"
    assert e4(base.replace(LINE, "docs/contracts/decision-entry.yaml: 9999")), "leg 1: an INCREASE must red even with the committed marker"
    assert frozen_base_violations(base, base.replace(LINE, "docs/contracts/decision-entry.yaml: 400")) == [], "a SHRINK must pass"
    unfrozen = base.replace("frozen: true", "frozen: false")
    assert "frozen: false" in unfrozen, "probe anchor failed -- the frozen flag is not written as expected"
    assert e4(unfrozen.replace(LINE, "docs/contracts/decision-entry.yaml: 9999")), "legs 1+2: a one-commit unfreeze-and-raise must red"
    assert e4(unfrozen), "leg 2: un-freezing while the entry survives must red"
    retired = "\n".join([x for x in unfrozen.splitlines() if not x.startswith("  " + LINE)])
    assert frozen_base_violations(base, retired) == [], "retirement (unfreeze plus entry removal) must stay clean"
    ANCHOR = "      docs/ROADMAP-PLATFORM.yaml:\n        incumbent: validate_platform_roadmap\n        authorized_by: dec-166\n"
    assert ANCHOR in base, "the deferral block shape changed -- re-anchor this probe"
    ADDED = ANCHOR + "      docs/contracts/decision-entry.yaml:\n        incumbent: validate_platform_roadmap\n        authorized_by: dec-166\n"
    bypass = "\n".join([x for x in unfrozen.replace(ANCHOR, ADDED).splitlines() if not x.startswith("  " + LINE)])
    assert e4(bypass), "leg 3: a path frozen in BASE that is newly deferred must red even with its note deleted"
    print("FROZEN_BASE_LEGS_OK")
