    month(created_timestamp), day(created_timestamp)'; pb=[yaml.safe_load(open('docs/contracts/'+c+'.yaml', encoding='utf-8'))['governance']['partition_by']
    for c in ('ops_recommendations','ops_decisions')]; assert all(p.startswith('history='+T+';') for p in pb), pb; dm=yaml.safe_load(open('docs/contracts/data-modeling-standard.yaml',
