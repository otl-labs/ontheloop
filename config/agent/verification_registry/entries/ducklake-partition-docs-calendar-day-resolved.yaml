    Decision 137:',1)[1].split(chr(10)+'## Decision ',1)[0]; s81=live_block(dec, 81); assert T in s137, 'Decision 137 annotation
    missing'; assert s81 is None or T in s81, 'Decision 81 annotation missing'; print('PARTITION_DOCS_CALENDAR_DAY_RESOLVED',
    '137 live', '81 live' if s81 else '81 compacted')"
