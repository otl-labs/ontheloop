check_id: inference-provider-local-model-servers
primitive_slot: command_exit_zero
guard_target: docs/contracts/inference-provider.yaml
guard_symbol: null
plan_slug: user-owned-persona-execution
graduated_at: '2026-10-23'
graduated_by: implement-agent
check_spec:
  command:
  - bash
  - -c
  - bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/contracts/inference-provider.yaml'));
    ls=d['model_id_formats'].get('litellm_local_servers') or {}; assert {'ollama','vllm'}<=set(ls), sorted(ls);
    assert ls['ollama']['litellm_prefix']=='ollama/' and ls['vllm']['litellm_prefix']=='hosted_vllm/',
    ls; ax=d['vocabulary']['axes']; bad=[k for k in ('ollama','vllm') if ls[k]['credential_holder']!='end_user'
    or ls[k]['persona_backend']!='litellm' or ls[k]['credential_holder'] not in ax['credential_holder']['values']
    or ls[k]['persona_backend'] not in ax['persona_backend']['values'] or 'no tier role' not in ls[k]['notes']
    or 'billing_shape local' not in ls[k]['notes']]; assert not bad, bad; tm=str(d['model_id_formats']['litellm_tier_models']).lower();
    assert 'ollama' not in tm and 'vllm' not in tm, 'a tier selects a local server'; assert all(r['selection_ref'].startswith('model_id_formats.litellm_tier_models.')
    for r in d['tier_model']['tiers']); assert 'Decision-234' in d['decisions_cited']; assert any('Decision
    234' in r['summary'] and 'litellm_local_servers' in r['summary'] for r in d['amendment_log']), 'no
    amendment_log row'; from scripts.checks.contracts.validate_inference_provider_registry import validate_inference_provider_registry;
    f=[]; validate_inference_provider_registry(f); assert not f, f; print('INFERENCE_LOCAL_SERVERS_OK')"
