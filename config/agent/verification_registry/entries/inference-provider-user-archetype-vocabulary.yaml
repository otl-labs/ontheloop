check_id: inference-provider-user-archetype-vocabulary
primitive_slot: command_exit_zero
guard_target: docs/contracts/inference-provider.yaml
guard_symbol: null
plan_slug: product-surface-and-open-core
graduated_at: '2026-10-23'
graduated_by: implement-agent
check_spec:
  command:
  - bash
  - -c
  - bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/contracts/inference-provider.yaml', encoding='utf-8'));
    v=d['vocabulary']; tm=v['terms']; p=tm['persona']; u=tm['user_archetype']; assert 'AI role' in p['reserved_meaning']
    and 'never a human' in p['reserved_meaning'] and 'user archetype' in p['do_not_use_for'], p; assert 'human target-user
    type' in u['reserved_meaning'] and 'two words' in u['reserved_meaning'] and 'buyer' in u['reserved_meaning']
    and 'persona' in u['do_not_use_for'], u; assert any('persona' in a and 'user archetype' in a for a in v['anti_patterns']),
    v['anti_patterns']; assert {'persona_backend','billing_shape','credential_holder','auth_method'}<=set(v['axes']),
    sorted(v['axes']); assert {'claude','claude_code','claude_api','subscription','byok','ai_api_call'}<=set(tm),
    sorted(tm); bad=[k for k,e in {**v['axes'],**tm}.items() if not (e.get('reserved_meaning') and e.get('do_not_use_for'))];
    assert not bad, ('entries lacking reserved_meaning/do_not_use_for', bad); assert 'Decision-232' in d['decisions_cited'],
    d['decisions_cited']; rows=[r for r in d['amendment_log'] if 'PLAN-product-surface-and-open-core' in str(r.get('summary',''))];
    assert len(rows)==1 and rows[0]['semantic_break'] is False, rows; print('USER_ARCHETYPE_VOCABULARY_OK')"
