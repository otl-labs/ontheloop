check_id: open-core-reframe-annotations
primitive_slot: command_exit_zero
guard_target: docs/DECISIONS.md
guard_symbol: null
plan_slug: product-surface-and-open-core
graduated_at: '2026-10-23'
graduated_by: implement-agent
check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n'', t, re.M) if ''The open core is customer-owned''
    in m.group(2)]; assert len(es)==1, ''open-core reframe Decision absent''; n=es[0].group(1); blk=lambda k: re.search(r''^##
    Decision ''+k+r'':.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0); A=r''> \*\*Amended by Decision ''+n+r''
    \(\d{4}-\d{2}-\d{2}\):\*\*''; amd={''184'':[''customer-owned'',''in the title'',''module boundary stays literal'',''a
    laptop by default (Decision 224 clause 4)'',''own cloud through the public adapters'',''The title is never rewritten
    (Decision ''+n+'' clause 1)''],''209'':[''Clause 1 is reworded, not reversed'',''scale is never blocked'',''the
    tooling that makes scale painless is paid'',''any number of repositories through the public adapters is free'',''on
    one repository'',''multi-repository operation itself is no longer paid'',''the multi-tenant control plane and
    what it carries'',''operating it for you, stay paid'',''Decision ''+n+'' clause 2'',''Clauses 2-5 are unchanged'']};
    keep={''184'':''whether they remain open or move private is OPEN'',''209'':''Everything one team needs to run
    the full governed loop on one repository is free''}; got={k:[l for l in blk(k).splitlines() if re.match(A, l)]
    for k in amd}; probs=[(k,''no Amended-by line citing ''+n) for k in amd if not got[k]]; assert not probs, probs;
    probs=[(k,[w for w in ws if w not in got[k][-1]]) for k,ws in amd.items() if [w for w in ws if w not in got[k][-1]]]+[(k,''retired
    name in appended line'') for k in amd if ''Theseus'' in got[k][-1]]+[(k,''original body edited (Decision 177)'')
    for k,s in keep.items() if s not in blk(k)]+[(k,''Amended-by line outside the Intent section (Decision 151 clause
    3(ii))'') for k in amd if not (blk(k).find(''**Intent:**'') < blk(k).find(got[k][-1]) < blk(k).find(''**Decision:**''))];
    assert not probs, probs; print(''OPEN_CORE_REFRAME_ANNOTATIONS_OK'', n)"'
