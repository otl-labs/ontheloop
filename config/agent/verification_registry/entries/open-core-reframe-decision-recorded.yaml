check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; from scripts.decisions_md import extract_amends_edges as ae; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''The
    open core is customer-owned'' in m.group(2)]; assert len(es)==1, (''expected exactly one open-core reframe Decision'',
    [e.group(1) for e in es]); n=es[0].group(1); assert n==''233'', (''operator-authorised number'', n); b=es[0].group(0);
    b0=re.split(chr(10)+r''(?:> \*\*|\[Amendment )'', b)[0]; assert re.search(''^''+chr(96)*3+r''yaml\s*\nnumber:
    ''+n+r''\b'', b, re.M), ''no bare yaml envelope carrying number ''+n; assert ''value: numbered_decision'' in
    b and chr(10)+''amends: [184, 209]''+chr(10) in b, ''envelope significance or amends list''; assert sorted(ae(es[0].group(2)))==[184,
    209], (''title amends edges'', ae(es[0].group(2))); edges=re.findall(r''(?:amends|Amends|supersedes|Supersedes)
    Decision (\d+)'', b0); assert edges==[''209''], (''unexpected amends/supersedes edges'', edges); assert ''dec-''+n+''
    (per Decision 84'' in b and ''decision: ''+n+chr(10) in b, ''Warehouse ID or stanza number drift''; bad=[w for
    w in [''Theseus'',''Guerdon'',''London'',''Underground'',''Tube'',''TfL'',''Transport for London'',''Beck'',''arn:'',chr(36),chr(163),chr(8364)]
    if w in b0]+re.findall(r''\b\d{12}\b'', b0); assert not bad, (''public-boundary or retired-name token'', bad);
    need=[''customer-owned'',''the free tier of its clauses 1-2'',''module boundary stays literal'',''a laptop by
    default (Decision 224 clause 4)'',''own cloud through the public adapters'',''never rewritten'',''append-only
    dialect'',''Scale is never blocked; the tooling that makes scale painless is paid'',''reworded, not reversed'',''any
    number of repositories, self-hosted through the public adapters, is free'',''the multi-tenant control plane
    and what it carries'',''cross-repository DAG aggregation'',''org-wide distribution of north stars and Tier C
    overrides'',''fleet dashboards'',''SSO/RBAC'',''audit and retention policy'',''operating it for you'',''On The
    Loop-hosted compute being one paid option'',''Decision 194 condition (b)'',''fleet learning over allow-listed
    metadata'',''Decision 209 clause 2(b)'',''routing add-on is a candidate'',''risk transfer (SLA, support)'',''price
    only'',''Additional Use Grant stays with Decision 194 clause 4 and T4.24 c6'',''sets no licence term'',''Champion
    first'',''Signaller'',''managed trial comes much later and is undefined'',''Like dbt Core'',''no identity system
    of its own'',''Postgres roles, bucket IAM'',''branch protection, required reviewers, Environments'',''own GitHub
    identity'',''Decision 217 clause 3'',''approve or deny is never an engine verb'',''thin display over one shared
    store'',''Postgres catalog plus object storage'',''local file catalog is single-user'',''neon_postgres, not
    a new port'',''Decision 84 I-3'',''Decision 81 clauses 5 and 7'',''Decision 210 clause 5'',''unless the writer
    runs as a service'',''Decision 84 I-2'',''unproven with several writers'',''rec-4558'',''rec-4559'',''Options
    considered'',''second approval authority'',''multi-writer-unsafe'',''approval-authority-absent'',''yaml reversal-conditions'',''Coverage
    (Decision 181 cl.2)'']; miss=[p for p in need if p not in b]; assert not miss, (''open-core reframe Decision
    text missing'', miss); print(''DEC_OPEN_CORE_REFRAME_OK'', n)"'
