check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n'', t, re.M) if ''Persona evaluation is an offline
    lane'' in m.group(2)]; assert len(es)==1, (''expected exactly one persona-eval Decision entry'', len(es)); n=es[0].group(1);
    b=re.search(r''^## Decision 221:.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0); a=[l for l in b.splitlines()
    if re.match(r''> \*\*Amended by Decision ''+n+r'' \(\d{4}-\d{2}-\d{2}\):\*\*'', l)]; assert len(a)==1 and all(w
    in a[0] for w in (''Clause 2'',''offline persona-evaluation lane'',''T4.14'',''deterministic code'',''blind
    adjudication'',''never an LLM judge'',''IAM and network, never lexically'',''boundary_patterns'',''PUBLIC repository'',''Clause
    7'',''one loop record journal'',''no second mechanism'')), a; keep=(''2. **Judge.** An independent probe with
    its own credentials computes OUTCOME.'',''7. **One mechanism each.** One ladder controller and transition log'');
    lost=[k for k in keep if k not in b]; assert not lost, (''original body edited, not annotated'', lost); print(''DEC221_ANNOTATED_OK'',
    n, len(b.encode(''utf-8'')))"'
