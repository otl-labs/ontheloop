check_id: persona-eval-decision-recorded
primitive_slot: command_exit_zero
guard_target: docs/DECISIONS.md
guard_symbol: null
plan_slug: persona-eval-lane
graduated_at: '2026-10-19'
graduated_by: implement-agent
check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''Persona
    evaluation is an offline lane'' in m.group(2)]; assert len(es)==1, (''expected exactly one persona-eval Decision
    entry'', [m.group(1) for m in es]); n=es[0].group(1); b=es[0].group(0); assert int(n)>=231, n; sz=len(b.encode(''utf-8''));
    fence=''^''+chr(96)*3+''yaml''; assert re.search(fence+r''\s*\nnumber: ''+n+r''\b'', b, re.M), ''no bare yaml
    envelope carrying number ''+n; assert ''value: numbered_decision'' in b and chr(10)+''amends: [221]''+chr(10)
    in b, ''envelope significance or amends list''; from scripts.decisions_md import extract_amends_edges as ae;
    assert set(ae(es[0].group(2)))=={221}, (''title amends edges'', ae(es[0].group(2))); cl=re.findall(r''^(\d)\.
    \*\*'', b, re.M); assert cl==[''1'',''2'',''3'',''4''], (''expected four clauses'', cl); need=[''Reinforcement
    learning'',''Offline lane, run records'',''Grader.'',''Faithful, sealed inputs'',''Roster and spend'',''apart
    from the live feedback loop'',''offline replay or by shadow runs beside live work'',''unit of record is one
    persona run'',''never a whole work item'',''never a concurrency limit'',''in parallel at any concurrency'',''never
    binds live work'',''consumes only the incumbent'',''never files a rec'',''never writes through the portal'',''names
    its model'',''one record per arm'',''settled or contested'',''agreement is not truth'',''human gate stays'',''No
    run is dropped or sampled at write'',''validity rules still apply'',''dual-run stage, which has its own flag'',''plan_agent'',''one
    loop record journal'',''Goodhart register row'',''staged CD.47, CD.46'',''no second journal, register or filer
    (Decision 221 cl.7)'',''deterministic code checks, real-outcome replay'',''blind adjudication'',''attribution
    revealed only after marking'',''never from an LLM judge'',''Decision 59'',''Decision 55'',''extended from recovery
    to this lane'',''learned-components path'',''docs/EXPERIMENTS.md'',''outcomes, never trajectories (Decision
    206 cl.4)'',''never graded'',''A persona with no such grader is not evaluated'',''point-in-time'',''no live
    AWS in the agent step'',''as_of read on the named reader verbs'',''Decision 84'',''never a local cache'',''sealed
    set (Decision 221 cl.2)'',''apart from this PUBLIC repository'',''IAM and network (Decision 143), never lexically'',''boundary_patterns'',''never
    as an executor-authored diff (Decision 185'',''judgment personas'',''the advice consult'',''CI-RCA'',''more
    capable model selection'',''does not transfer to the doing personas'',''offline_eval_llm_tokens (rec-4436)'',''never
    capped'',''loop_llm_tokens'',''adds no budget'',''loop-dispatched run'',''per-rec and per-day'',''subscription-lane
    shadow dollars'',''Decision 217 cl.4'',''operator starts every eval run and enables every shadow arm'',''post-MVP'',''deferred_post_mvp'',''Harness^2'',''confounded'',''LLM
    pairwise judging'',''yaml reversal-conditions'',''grader-insufficient'',''vendor-model-change'',''eval-spend-unabsorbed'',''Coverage
    (Decision 181 cl.2)'',''T4.14 c7'']; bb='' ''.join(b.split()); miss=[p for p in need if p not in bb]; assert
    not miss, (''persona-eval Decision text missing'', miss); edges=re.findall(r''(?:amends|Amends|supersedes|Supersedes)
    Decision (\d+)'', b); assert edges and set(edges)<={''221''}, (''unexpected amends/supersedes edges'', edges);
    deny=re.findall(r''(?i)\b(fable|kimi|deepseek|sonnet|opus|haiku|gemini|gpt-?\d|glm|minimax|moonshot|qwen|llama|mistral|grok|max
    \d+x)\b'', b); assert not deny, (''model, vendor or subscription-tier name in the Decision'', deny); print(''DEC_PERSONA_EVAL_OK'',
    n, sz)"'
