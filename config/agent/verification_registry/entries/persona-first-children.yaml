check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import yaml; from pathlib import Path; from scripts.platform_roadmap_state import
    load; from scripts.platform_roadmap_liveness import toxic_node_ids; d=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml''));
    ti={x[''id'']:x for x in d[''tier_items'']}; kids={''T4.32'':[''T4.10a''],''T4.28'':[''T4.32''],''T4.30'':[''T4.32''],''T4.29'':[''T4.32''],''T4.15'':[''T4.21'',''T4.32''],''T4.31'':[''T4.15'']};
    miss=[k for k in kids if k not in ti]; assert not miss, (''persona children missing'', miss); bad=[(k,ti[k][''depends_on''])
    for k in kids if not set(kids[k])<=set(ti[k][''depends_on'']) or ti[k][''tier'']!=''T4'' or ti[k].get(''strategic'')];
    assert not bad, (''child shape'', bad); reach=lambda ks,s=frozenset(): s if not set(ks)-s else reach([p
    for k in set(ks)-s for p in (ti[k].get(''depends_on'') or []) if p in ti], s|set(ks)); seen=reach(list(kids));
    hit=sorted(seen & {''T4.1'',''T4.22'',''T4.9a'',''T4.2''}); assert not hit, (''a persona child reaches
    the loop host or the umbrella'', hit); t2=ti[''T4.2'']; assert set([''T4.1'']+list(kids))<=set(t2[''depends_on'']),
    t2[''depends_on'']; it=t2[''intent'']; assert all(w in it for w in (''UMBRELLA'',''STRANGLER PROTOCOL'',''Personas
    never invoke personas'',''at least 20'',''pre-registered'',''outage fallback'',''rec-4435'',''Discharge
    map'',''T4.10a alone'',''START ORDER'',''not completion edges'')), ''T4.2 umbrella annotation''; assert
    max(t2[''related_decisions''])>=229, t2[''related_decisions'']; dead=[(x[''id''],p) for x in d[''tier_items'']
    if x[''status''] in (''not_started'',''in_progress'') for p in x.get(''depends_on'') or [] if p in
    ti and ti[p][''status'']==''deferred_post_mvp'']; assert not dead, (''Decision 93'', dead); tox=set(toxic_node_ids(load(Path(''docs/ROADMAP-PLATFORM.yaml''))));
    base=set(yaml.safe_load(open(''config/roadmap_liveness_baseline.yaml''))[''entries'']); assert tox==base
    and not tox & set(kids), (''liveness'', sorted(tox ^ base), sorted(tox & set(kids))); txt=lambda k:
    '' ''.join(c[''text''] for c in ti[k][''exit_criteria'']); probs=[(k,w) for k in (''T4.28'',''T4.30'',''T4.29'')
    for w in (''CAPTURE FROM DAY ONE'',''rec-4433'',''rec-4416'',''T4.2 c3'',''rec-4434'',''ADD --'',''DUAL-RUN'',''FLIP'',''REMOVE'',''project-configuration.yaml'',''at
    least 20'',''pre-registered'',''never a skipped gate'') if w not in txt(k)]; probs+=[(''T4.32'',w)
    for w in (''T4.2 c4, c8, c9, c10 and c12'',''c13 and c14 except their compute-plane legs'',''T4.17
    c5'',''Decision 173'',''compute-plane persona'',''SCOUT-INPUT FINGERPRINT'',''scope file paths'',''content
    hash'',''single plan-edge extractor'',''amends and introduces'',''FINGERPRINT-COMPLETENESS TEST'',''approach-only
    change does not'',''rec-4490'',''re-scout required'',''A refinement never re-scouts'',''No new GitHub
    write scope'',''ready_for_review'',''rec-4477'',''FIXTURE RUN'') if w not in txt(''T4.32'')]; probs+=[(''T4.28'',w)
    for w in (''CONSUMES T4.32'',''rec-4477'',''rec-4476'',''T4.25 c3'') if w not in txt(''T4.28'')];
    probs+=[(''T4.30'',w) for w in (''T4.32'',''whose scout-input fingerprint differs'',''head SHA'',''T4.25
    c1'') if w not in txt(''T4.30'')]; probs+=[(''T4.29'',w) for w in (''T4.32'',''ready_for_review'',''every
    push after ready'',''re-scout required'',''T4.25 c2'') if w not in txt(''T4.29'')]; probs+=[(''T4.31'',w)
    for w in (''T4.15 c2'',''HUB AND SPOKE'',''INTERIM INPUT'',''operator-chosen work item (a rec today)'',''never
    pick_work_item'',''T4.21 c9, c11'',''never by the operator identity'',''rec-4043'',''T4.2 c7'') if
    w not in txt(''T4.31'')]; probs+=[(''T4.10a'',w) for w in (''HUB AND SPOKE'',''another persona'',''registered
    conformance check that binds each persona item'') if w not in txt(''T4.10a'')]; probs+=[(k,w) for
    k in (''T4.15'',''T4.31'') for w in (''CAPTURE FROM DAY ONE'',''rec-4433'',''rec-4416'',''T4.2 c3'')
    if w not in txt(k)]; hd=lambda k: {str(e).strip().split()[0] for e in ((ti[k].get(''decomposition_hints'')
    or {}).get(''atomic_plans'') or []) if str(e).strip()}; probs+=[(''two parents'',h,k) for k in kids
    for h in hd(k) & hd(''T4.2'') if h.startswith(''PLAN-'')]; assert not probs, probs; print(''PERSONA_FIRST_CHILDREN_OK'',
    sorted(kids))"'
