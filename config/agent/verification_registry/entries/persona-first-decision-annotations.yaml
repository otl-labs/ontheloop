check_id: persona-first-decision-annotations
primitive_slot: command_exit_zero
guard_target: docs/DECISIONS.md
guard_symbol: null
plan_slug: persona-first-migration
graduated_at: '2026-10-19'
graduated_by: implement-agent
check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n'', t, re.M) if ''Persona-first migration''
    in m.group(2)]; assert len(es)==1, (''expected exactly one persona-first Decision entry'', len(es));
    n=es[0].group(1); blk=lambda k: re.search(r''^## Decision ''+k+r'':.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0);
    b={k:blk(k) for k in (''205'',''217'',''90'')}; a205=[l for l in b[''205''].splitlines() if re.match(r''>
    \*\*Amended by Decision ''+n+r'' \(\d{4}-\d{2}-\d{2}\):\*\*'', l)]; assert len(a205)==1 and all(w
    in a205[0] for w in (''persona_compute_host'',''launcher only'',''T4.15'',''implement_agent'',''live
    vehicle'',''post-confirmation conformance leg'',''scout-input fingerprint'',''ready_for_review'')),
    a205; u217=[l for l in b[''217''].splitlines() if re.match(r''> \*\*Amended by Decision ''+n+r'' \(\d{4}-\d{2}-\d{2}\):\*\*'',
    l)]; assert len(u217)==1 and all(w in u217[0] for w in (''T4.25 c1'',''Coverage home'',''T4.30'',''covered
    by a scout verdict over an identical scout-input fingerprint'',''never sampled'')), u217; u90=[l for
    l in b[''90''].splitlines() if re.match(r''> \*\*Update \(\d{4}-\d{2}-\d{2}\):\*\*'', l) and ''Decision
    ''+n in l]; assert len(u90)==1 and all(w in u90[0] for w in (''rec-4478'',''interim'',''STRATEGIC'',''queue'',''IMPLEMENTATION'',''plan_agent
    drafting its plan'',''operator-chosen work item (a rec today)'')), u90; keep={''205'':''6. Compute
    plane. CD.44'',''217'':''The pre-merge scout on every plan PR head SHA'',''90'':''Executor and STRATEGIC
    plans are frozen per Decision 67 / CD.17''}; lost=[k for k in keep if keep[k] not in b[k]]; assert
    not lost, (''original body edited, not annotated'', lost); s217=len(b[''217''].encode(''utf-8''));
    assert s217<=6144, (''Decision 217 over the cap its shard pins'', s217); print(''PERSONA_FIRST_ANNOTATIONS_OK'',
    n, s217)"'
