check_spec:
  command:
  - bash
  - -c
  - bin/venv-python -c "import yaml,re; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); ti={x['id']:x
    for x in d['tier_items']}; t1=ti['T4.1']; ec=t1['exit_criteria']; dh=[c for c in ec if c.startswith('DEFERRED
    HALVES FROM T4.15')]; assert len(dh)==1 and all(w in dh[0] for w in ('lambda:invoke','.sync','iam:PassRole','waitForTaskToken','T4.15
    c5','T4.15 c6','T4.15 c9','T4.9a','T4.21 c11','second caller','subset-outgrown')), dh; nodes=[l for
    l in t1['intent'].splitlines() if '[' in l and 'T4.2]' in l]; assert len(nodes)==2, nodes; assert
    re.search(r'\[Annotation \d{4}-\d{2}-\d{2}, Decision \d+ -- personas ship first to an interim coordinator',
    t1['intent']) and 'await_scout re-enters when the plan' in t1['intent'], 'T4.1 annotation'; t21={c['id']:c['text']
    for c in ti['T4.21']['exit_criteria']}; c6=[c for c in ti['T4.21']['exit_criteria'] if c['id']=='c6'][0];
    assert c6['status']=='rehomed' and c6.get('met_by')=='T4.16', c6; assert 'c11' in t21 and all(w in
    t21['c11'] for w in ('FILE_PR BROUGHT FORWARD','open_change','T4.15','T4.31','interim coordinator','never
    under the operator identity')), t21.get('c11'); cds={c['id']:c for c in d['candidate_decisions']};
    e=[p for p in cds['CD.27']['discipline_points'] if isinstance(p,str) and p.startswith('Layer-2 ratification
    precondition (ESB-04)')]; assert len(e)==1 and 'discharges against T4.15 and against nothing else'
    in e[0] and e[0].count('implement_agent-on-Fargate')>=1 and 'live vehicle is implement_agent' in e[0]
    and 'post-confirmation conformance leg' in e[0], 'CD.27 ESB-04 note or live-vehicle narrowing'; c2={c['id']:c
    for c in ti['T4.2']['exit_criteria']}; assert c2['c7']['status']=='open' and 'compute-plane personas
    only' in c2['c7']['text'] and 'confirmation run' in c2['c7']['text'], c2['c7']; assert 'flip criteria
    of T4.28, T4.30' in c2['c11']['text'], c2['c11']['text']; print('PERSONA_FIRST_DEFERRED_HALVES_OK')"
