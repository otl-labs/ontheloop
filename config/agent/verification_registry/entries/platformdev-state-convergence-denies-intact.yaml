check_id: platformdev-state-convergence-denies-intact
primitive_slot: command_exit_zero
guard_target: terraform/bootstrap/platform_dev_policies.tf
guard_symbol: null
plan_slug: agent-observability-read-axis
graduated_at: '2026-09-13'
graduated_by: implement-agent
check_spec:
  command:
  - bash
  - -c
  - |
    grep -q 'cloudwatch:' terraform/bootstrap/platform_dev_policies.tf && grep -q 'logs:FilterLogEvents' terraform/bootstrap/platform_dev_policies.tf && bin/venv-python -c 'import re,pathlib;t=pathlib.Path("terraform/bootstrap/platform_dev_policies.tf").read_text();w=[p for p in re.split(r"(?=Sid\s*=)",t) if re.match(r"Sid\s*=\s*.DenyState",p)];want={"DenyStateAndConvergenceWrite","DenyStateRead","DenyStateAndConvergenceVersionRead","DenyStateAndConvergenceVersionList"};sids=[re.search(r"Sid\s*=\s*.(\w+).",x).group(1) for x in w];assert len(w)==4 and set(sids)==want and len(sids)==len(set(sids)),f"expected exactly the four DenyState Sids {sorted(want)} with no duplicate, got {sids}";e=[re.search(r"Effect\s*=\s*.(\w+).",x) for x in w];assert all(m is not None and m.group(1)=="Deny" for m in e),"a DenyState statement first Effect is not Deny";j="".join(w);miss=[p for p in ("convergence/personal/*","tfplan/personal/*","tfstate/personal/*") if p not in j];assert not miss,f"protected prefixes dropped: {miss}"'
