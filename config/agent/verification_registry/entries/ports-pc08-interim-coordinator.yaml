check_spec:
  command:
  - bash
  - -c
  - bin/venv-python -c "import yaml; p=yaml.safe_load(open('docs/contracts/ports.yaml')); pc={c['id']:c
    for c in p['coupling_findings']}; c=pc.get('PC-08'); assert c and c['ports']==['persona_compute_host','orchestration_host']
    and c['status']=='accepted' and c['location']==c['owning_item'] and c['owning_item'].startswith('dec-'),
    c; assert int(c['owning_item'][4:])>=229, c['owning_item']; ds=c['description']; assert all(w in ds
    for w in ('fargate','run_image','ecs:RunTask','iam:PassRole','interim coordinator','not an orchestration_host
    adapter','second caller')), ds; host=[x for x in p['ports'] if x['id']=='persona_compute_host'][0];
    ad={a['id']:a for a in host['adapters']}; assert ad['fargate'].get('owning_item')=='T4.15:c12', ad['fargate'];
    assert not [a for a in ad if any(w in a for w in ('interactive','session','coordinator','overseer'))],
    ('the interim coordinator is not an adapter', sorted(ad)); assert any('PC-08' in r.get('summary','')
    for r in p['amendment_log']), 'no amendment_log row names PC-08'; from scripts.checks.contracts.validate_ports_contract
    import validate_ports_contract; f=[]; validate_ports_contract(f); assert not f, f; print('PORTS_PC08_OK')"
