check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib,yaml; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    m=re.search(r''^## Decision \d+: User-owned persona execution(.*?)(?=^## Decision |\Z)'', t, re.M|re.S);
    assert m, ''Decision absent''; pc=re.search(r''ports\.yaml (PC-\d+)'', m.group(1)); assert pc, ''no
    coupling id cited''; p=yaml.safe_load(open(''docs/contracts/ports.yaml'')); h=[x for x in p[''ports'']
    if x[''id'']==''persona_compute_host''][0]; ad={a[''id''] for a in h[''adapters'']}; assert {''sandbox_runtime'',''sandbox_runtime_windows''}<=ad,
    sorted(ad); assert h[''oracle''][''ref'']==''local_container'', h[''oracle'']; c=[x for x in p[''coupling_findings'']
    if x[''id'']==pc.group(1)]; assert len(c)==1, pc.group(1); c=c[0]; assert {''work_item_storage'',''orchestration_host'',''change_surface''}<=set(c[''ports'']),
    c[''ports'']; miss=[w for w in (''execution_pr_url'',''pull-request number'',''T4.31 c2'',''plan_agent
    tuple'',''node identifiers'',''T4.9a c2'',''correlation ids of T4.9 and CD.38'',''T4.16 c3'',''T4.5
    c4'',''telemetry_sessions'',''generic change id'',''Decision 234 clause 4'',''T4.19 c6'',''T4.23 c6'')
    if w not in c[''description'']]; assert not miss, miss; assert any(''Decision 234'' in r.get(''summary'','''')
    and ''sandbox_runtime'' in r.get(''summary'','''') for r in p[''amendment_log'']), ''no amendment_log
    row''; from scripts.checks.contracts.validate_ports_contract import validate_ports_contract; f=[];
    validate_ports_contract(f); assert not f, f; print(''PORTS_SANDBOX_RUNTIME_OK'', c[''id''])"'
