    b, ''envelope significance''; assert ''amends: ['' not in b0, ''a stray envelope amends list''; assert ae(es[0].group(2))==[],
    (''title amends edges'', ae(es[0].group(2))); edges=re.findall(r''(?:amends|Amends|supersedes|Supersedes) Decision
    (\d+)'', b0); assert edges==[], (''unexpected amends/supersedes edges'', edges); assert ''dec-''+n+'' (per Decision
    84'' in b and ''decision: ''+n+chr(10) in b, ''Warehouse ID or stanza number drift''; bad=[w for w in [''Theseus'',''Guerdon'',''London'',''Underground'',''Tube'',''TfL'',''Transport
    for London'',''Beck'',''arn:'',chr(36),chr(163),chr(8364)] if w in b0]+re.findall(r''\b\d{12}\b'', b0); assert
    not bad, (''public-boundary, transit-operator or retired-name token'', bad); need=[''names an AI role only'',''user
    archetype'',''always two words'',''inference-provider.yaml'',''not the buyer (the organisation)'',''The Signaller,
    after a railway signaller'',''never drives the train'',''engineer moving into supervision'',''the champion who
    installs and hosts On The Loop, with local admin rights'',''Served first'',''without admin rights'',''champion-hosted
    setup'',''managed trial (undefined)'',''target users'',''Decision 101 point (f)'',''rec-4389'',''One human surface
    for supervising the loop'',''Every read and write it makes goes through the engine'',''closed named-verb surface'',''except
    approve or deny, which it sends to GitHub under the user'',''not supervision surfaces'',''steer, watch, get
    interrupted and approve or deny'',''Decision 233 clause 4'',''Decision 185 clause 3'',''CLI plus that UI on
    localhost'',''no localhost assumption'',''no desktop app'',''Decision 209 clause 3(1)'',''Decision 90'',''Decision
    184 clause 4'',''Decision 229'',''never a diff first'',''intent -> work item -> plan -> PR -> diff'',''drop
    to code'',''work-item model'',''transit-map, schematic network-diagram visual language'',''inspired by intuitive
    relationship mapping'',''a later contract owns its grammar'',''same persona backend selection as any persona'',''Decisions
    173 and 206'',''API keys go through LiteLLM'',''subscription-only champion'',''read-only persona contract (T4.10a)'',''every
    answer cites a receipt'',''an answer with none is withheld'',''proposed work item'',''triage inbox'',''none
    enters the queue untriaged'',''Decision 205 clauses 1-2'',''non-persona code posts the reply'',''(a), (c) and
    (e) bind the UI'',''stays unratified'',''never caller SQL'',''no build artefact is tracked'',''false zeroes'',''scope
    fence'',''operational-control UI'',''Decision 127 clause 1 binds by audience-of-record, not file extension'',''T2.53
    c5'',''no standing narrative for a human reader'',''amendment question stays'',''Post-MVP (Decision 93)'',''T4.33'',''yaml
    reversal-conditions'',''signaller-unvalidated'',''named-verbs-insufficient'',''any other data path'',''validate_prose_allowlist
    reads only'',''Coverage (Decision 181 cl.2)'',''rec-4560'']; miss=[p for p in need if p not in b]; assert not
    miss, (''human-surface Decision text missing'', miss); print(''DEC_HUMAN_SURFACE_OK'', n)"'
