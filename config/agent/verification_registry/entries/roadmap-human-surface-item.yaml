check_spec:
  command:
  - bash
  - -c
  - bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml', encoding='utf-8')); its=[i
    for i in d['tier_items'] if 'one web UI over the engine' in i.get('name','')]; assert len(its)==1, ('expected
    exactly one human-surface item', [i['id'] for i in its]); t=its[0]; assert t['tier']=='T4' and t['status']=='deferred_post_mvp',
    (t['tier'], t['status']); assert {'T4.10a','T4.23','T4.24'}<=set(t.get('depends_on') or []), t.get('depends_on');
    assert {232,233}<=set(t.get('related_decisions') or []), t.get('related_decisions'); assert 'CD.42' in (t.get('related_candidate_decisions')
    or []), t.get('related_candidate_decisions'); live=[i['id'] for i in d['tier_items'] if i.get('status') in ('not_started','in_progress')
    and t['id'] in (i.get('depends_on') or [])]; assert not live, ('a live item depends on the deferred item (Decision
    93)', live); c={x['id']:x['text'] for x in t['exit_criteria']}; need={'c1':['NAMED VERBS ONLY','no caller SQL','no
    tracked build artefact','standing narrative for a human reader','GitHub approve or deny'],'c2':['SERVE ANYWHERE','localhost
    by default','remote host'],'c3':['APPROVALS ARE','own GitHub identity','never as the identity that wrote the
    change','no approve or deny verb','no identity system of its own'],'c4':['GATE CARDS AND ALTITUDE','before any
    diff','intent -> work item -> plan -> PR -> diff','change_surface read verb'],'c5':['DEPENDENCY MAP','transit-map
    visual language'],'c6':['GROUNDED Q&A','read-only persona contract (T4.10a)','persona backend selection','withheld'],'c7':['COMMENT
    INTAKE','proposed work item','bot reply','duplicate','triages it from the inbox','Decision 205 clauses 1-2'],'c8':['SHARED
    STORE','Postgres catalog plus object storage','Decisions 216 and 230','neon_postgres','single-user']}; miss={k:[w
    for w in ws if w not in c.get(k,'')] for k,ws in need.items()}; miss={k:m for k,m in miss.items() if m}; assert
    not miss, ('criterion text missing', miss); print('HUMAN_SURFACE_ITEM_OK', t['id'])"
