check_spec:
  command:
  - python
  - -c
  - 'import yaml,sys

    d=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml''))

    items={it[''id'']:it for it in d[''tier_items'']}

    cds={c[''id'']:c for c in d.get(''candidate_decisions'',[])}

    checks=[]

    def c(name,cond): checks.append((name,bool(cond)))

    c(''T4.9a not_started or in_progress'', items.get(''T4.9a'',{}).get(''status'') in (''not_started'',''in_progress''))

    c(''T4.9a re-pin noted'', ''rec-5054'' in items.get(''T4.9a'',{}).get(''progress_note'',''''))

    c(''T4.9a deps'', items.get(''T4.9a'',{}).get(''depends_on'')==[''T4.1'',''T2.20''])

    c(''T4.9 deferred'', items.get(''T4.9'',{}).get(''status'')==''deferred_post_mvp'')

    c(''T4.10a not_started'', items.get(''T4.10a'',{}).get(''status'')==''not_started'')

    c(''T4.10a deps'', items.get(''T4.10a'',{}).get(''depends_on'')==[''T1.12''])

    c(''T4.10 deferred'', items.get(''T4.10'',{}).get(''status'')==''deferred_post_mvp'')

    c(''T4.11 not_started'', items.get(''T4.11'',{}).get(''status'')==''not_started'')

    c(''T4.11 deps'', items.get(''T4.11'',{}).get(''depends_on'')==[''T4.1'',''T4.10a'',''T4.19''])

    dep2=items.get(''T4.2'',{}).get(''depends_on'',[])

    c(''T4.2 dep T4.9a'', ''T4.9a'' in dep2)

    c(''T4.2 dep T4.10a'', ''T4.10a'' in dep2)

    shape=items.get(''T4.1'',{}).get(''intent'','''')

    c(''T4.1 merge state'', ''merge'' in shape and ''deploy_dispatch'' in shape)

    c(''CD.38 gates T4.9a'', ''T4.9a'' in cds.get(''CD.38'',{}).get(''gates'',[]))

    bad=[n for n,ok in checks if not ok]

    sys.exit(1 if bad else 0)

    '
