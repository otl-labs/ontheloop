check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; from scripts.decisions_md import extract_amends_edges
    as ae; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m
    for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'',
    t, re.M|re.S) if ''Recursive self-improvement is proven against a judge the loop
    cannot edit'' in m.group(2)]; assert len(es)==1, (''expected exactly one proof-design
    Decision'', [e.group(1) for e in es]); n=es[0].group(1); b=es[0].group(0); env=re.search(''^''+chr(96)*3+r''yaml\s*\n(.*?)\n''+chr(96)*3,
    b, re.M|re.S); assert env and env.group(1).startswith(''number: ''+n+chr(10)),
    ''no bare yaml envelope carrying number ''+n; assert ''amends:'' not in env.group(1)
    and ''supersedes:'' not in env.group(1), ''envelope carries an edge''; assert
    ''value: numbered_decision'' in b, ''significance''; assert ae(es[0].group(2))==[],
    (''title amends edges'', ae(es[0].group(2))); edges=re.findall(r''(?:amends|Amends|supersedes|Supersedes)
    Decision (\d+)'', b); assert not edges, (''unexpected amends/supersedes edges'',
    edges); assert ''amends Decision 209 clause 5'' not in b, ''rec-4141 acceptance
    phrase''; assert ''**Warehouse ID:** dec-''+n+'' (per Decision 84'' in b and ''decision:
    ''+n+chr(10) in b, ''Warehouse ID or stanza number drift''; assert ''rec-X'' not
    in b and ''DATE'' not in b, ''unsubstituted placeholder''; ids=set(re.findall(r''rec-\d{4,}'',
    b))-{''rec-4141''}; assert len(ids)>=2, (''expected at least the two filed rec
    ids'', sorted(ids)); bad=[w for w in [''arn:'', ''Theseus'', ''Guerdon'', chr(36)]
    if w in b]+re.findall(r''\b\d{12}\b'', b)+re.findall(r''[^\x00-\x7f]'', b); assert
    not bad, (''public-boundary or ASCII hygiene'', bad); need=[''OUTCOME'', ''PROCESS'',
    ''RECURSIVE'', ''tokens and GB-seconds per verified merge'', ''never stored or
    published'', ''Decisions 199 clause 1, 217 clause 4'', ''user-authored Tier A
    north star'', ''Goodhart register row'', ''independent probe with its own credentials'',
    ''held out from training'', ''boundary_patterns'', ''Decision 185 clause 3'',
    ''T4.24 c3'', ''tenant and project ids'', ''self-healing only'', ''difference-in-differences'',
    ''sampled rung'', ''committed before a run'', ''S1.7-S1.8'', ''curated projection
    (Decision 111)'', ''Decision 88'', ''no financial figure'', ''Decision 209 clause
    5(i) is not amended'', ''dependent on rec-4141'', ''training is not inference'',
    ''stamp bump back to read_all'', ''two-by-two'', ''One ladder controller'', ''only
    proposer of a PROOF close'', ''one row per attempt (Decision 207'', ''init determinism'',
    ''binds only at that row'', ''Decision 197 clause 8'', ''Decision 75'', ''Coverage:**
    none enforced today'', ''journal-ratified'', ''sampled-rung-exists'', ''vendor-model-change'',
    ''REPORT-showcase-product-and-rsi-proof.md:'', ''epoch-start ref'', ''one ladder
    lane per arm'', ''only as a closed enum rec-4141 admits'', ''pre-registered protocol
    reports the arm comparison'', ''REPORT-w3-feedback-loop-staging.md:380-382'',
    ''Recursive self-improvement model'', ''cl.3 T3.4 (CD.46) and rec-'', ''cl.4 S1.7
    c1 (external-subject arm) and rec-'', ''cl.6 T3.4 (CD.46)'', ''product-abandoned'',
    ''by subject'']; miss=[p for p in need if p not in b]; assert not miss, (''proof-design
    Decision text missing'', miss); print(''DEC_RSI_PROOF_OK'', n, len(ids))"'
