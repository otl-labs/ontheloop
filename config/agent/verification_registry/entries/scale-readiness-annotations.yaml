check_id: scale-readiness-annotations
primitive_slot: command_exit_zero
guard_target: docs/DECISIONS.md
guard_symbol: null
plan_slug: scale-readiness-concurrency-commitments
graduated_at: '2026-10-14'
graduated_by: implement-agent
check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S)
    if ''Scale-readiness commitments gated on executor concurrency above 1'' in m.group(2)]; assert len(es)==1,
    (''expected exactly one scale-readiness Decision'', [e.group(1) for e in es]); n=es[0].group(1); b=es[0].group(0);
    blk=lambda k: re.search(r''^## Decision ''+k+r'':.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0);
    A=r''> \*\*Amended by Decision ''+n+r'' \(\d{4}-\d{2}-\d{2}\):\*\* ''; ann={''73'': [''affected-set
    overlap block'', ''cannot be determined still blocks'', ''Decision {n} clause 1'', ''clause 4 stands
    unchanged'', ''Decision {n} clause 2''], ''196'': [''file slug is the decision identity'', ''existing
    numbers freeze'', ''first-parent merge order'', ''gitignored runtime root'', ''Decision {n} clauses
    5-7'', ''clause 6 prefixes are unchanged''], ''205'': [''ONE non-bypass App'', ''measured rate-limit
    breach'', ''Decision {n} clause 3'', ''push-to-main decision-scout pass'', ''files a rec on a hit'',
    ''pre-merge scout on every plan PR is unchanged'', ''Decision {n} clause 8''], ''206'': [''plan-limit
    pause'', ''shadow dollars are never a spend'', ''cost per verified merge'', ''Decision {n} clause
    4'']}; got={k: [l for l in blk(k).splitlines() if re.match(A, l)] for k in ann}; one=[(k, len(got[k]))
    for k in ann if len(got[k])!=1]; assert not one, (''expected exactly one Amended-by line citing ''+n+''
    per entry'', one); miss=[(k,p) for k,ps in ann.items() for p in ps if p.replace(''{n}'',n) not in
    got[k][0]]; assert not miss, (''Amended-by line text missing'', miss); lo={k: blk(k).find(''**Related:**'')
    for k in ann}; lo[''73'']=blk(''73'').find(''> **Amended by Decision 205 (2026-09-28):**''); bad=[k
    for k in ann if lo[k] < 0 or not lo[k] < blk(k).find(got[k][0])]; assert not bad, (''Amended-by line
    misplaced (must follow the Related marker; 73 must follow its Decision 205 line)'', bad); print(''DEC_ANNOTATIONS_OK'',
    n, {k: len(blk(k).encode(''utf-8'')) for k in ann})"'
