check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; from scripts.decisions_md import extract_amends_edges as ae;
    t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m for m in re.finditer(r''^##
    Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''Scale-readiness commitments
    gated on executor concurrency above 1'' in m.group(2)]; assert len(es)==1, (''expected exactly one
    scale-readiness Decision'', [e.group(1) for e in es]); n=es[0].group(1); b=es[0].group(0); sz=len(b.encode(''utf-8''));
    assert sz<=6144, (''over the 6144-byte cap'', sz); assert re.search(''^''+chr(96)*3+r''yaml\s*\nnumber:
    ''+n+r''\b'', b, re.M), ''no bare yaml envelope carrying number ''+n; assert ''value: numbered_decision''
    in b, ''significance''; assert chr(10)+''amends: [73, 196, 205, 206]''+chr(10) in b, ''envelope amends
    list''; assert ae(es[0].group(2))==[73, 196, 205, 206], (''title amends edges'', ae(es[0].group(2)));
    edges=re.findall(r''(?:amends|Amends|supersedes|Supersedes) Decision (\d+)'', b); assert not edges,
    (''unexpected textual amends/supersedes edges'', edges); assert ''**Warehouse ID:** dec-''+n+'' (per
    Decision 84'' in b and ''decision: ''+n+chr(10) in b, ''Warehouse ID or stanza number drift''; need=[''No
    global merge enforcer for red main'', ''import-closure and data-edge channels'', ''still blocks (Decision
    215)'', ''Until then cl.4 stands'', ''rec-4323 lands'', ''derived files by regeneration'', ''rosters
    by union'', ''numbering race by renumbering'', ''existing structural handoff gate'', ''two failures
    escalate via a rec'', ''ONE non-bypass GitHub App (confirms Decisions 185 cl.3 and'', ''per-persona
    Apps wait on a measured'', ''repository-scoped fine-grained token'', ''effective-dated price table'',
    ''cap per rec and per day'', ''plan-limit pause'', ''Cost per verified merge is top-line'', ''shadow
    dollars are never a spend'', ''first-parent merge order'', ''existing numbers freeze'', ''Decision
    196 cl.6 prefixes are unchanged'', ''a supersession edge may target a clause'', ''gitignored'', ''never
    committed'', ''unchanged and never sampled'', ''push-to-main scout audits merged Tier C entries against
    Tier A'', ''files a rec on a hit'', ''**Coverage:**'', ''T4.24 c7'', ''T4.11'', ''rec-4321'', ''rec-4322'',
    ''Decision 197 cl.8'', ''not frame-lock'', ''redesigning-source-control'', ''session_011cfEwz5UxFbXnqycRhnXbL'',
    ''yaml reversal-conditions'', ''id: concurrency-raised'', ''id: split-executing'', ''id: rate-limit-breach'',
    ''id: red-window-growth'', ''excluded by CD.37'', ''semantic locks (T4.8) stay post-merge'', ''(cl.1-2
    also T4.8)'', ''T4.1/T4.2/T4.9a'', ''CD.37.'', ''derived data computed on demand'']; miss=[p for p
    in need if p not in b]; assert not miss, (''scale-readiness Decision text missing'', miss); bad=[w
    for w in [''arn:'',''rec-AAAA'',''rec-BBBB'',''rec-CCCC'',''DATE''] if w in b]+re.findall(r''\b\d{12}\b'',
    b); assert not bad, (''placeholder or public-boundary token'', bad); print(''DEC_SCALE_READINESS_OK'',
    n, sz)"'
