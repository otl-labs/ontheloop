check_id: showcase-product-178-update
primitive_slot: command_exit_zero
guard_target: docs/DECISIONS.md
guard_symbol: null
plan_slug: showcase-product-and-rsi-proof
graduated_at: '2026-10-17'
graduated_by: implement-agent
check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    f=lambda s: [m.group(1) for m in re.finditer(r''^## Decision (\d+): (.*)$'', t,
    re.M) if s in m.group(2)]; a=f(''First showcase product -- a UK organisation graph
    over public money''); assert len(a)==1, (''showcase-product Decision absent'',
    a); n=a[0]; blk=re.search(r''^## Decision 178:.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0);
    U=r''^> \*\*Update \(\d{4}-\d{2}-\d{2}\):\*\* ''; got=[x for x in blk.splitlines()
    if re.match(U, x) and ''bootstrapping exception'' in x]; assert len(got)==1, (''expected
    exactly one dated bootstrapping-exception Update on Decision 178'', got); x=got[0];
    need=[''Decision ''+n+'' records one bounded bootstrapping exception'', ''metadata
    source and proof population'', ''why it was chosen'', ''provisional init-handoff
    input'', ''stay in its own repository'']; miss=[p for p in need if p not in x];
    assert not miss, (''Decision 178 Update text missing'', miss); assert not re.search(r''(?:amends|Amends|supersedes|Supersedes)
    Decision'', x), ''edge phrase in the Update''; print(''DEC_178_UPDATE_OK'', n)"'
