check_id: showcase-product-209-annotation
primitive_slot: command_exit_zero
guard_target: docs/DECISIONS.md
guard_symbol: null
plan_slug: showcase-product-and-rsi-proof
graduated_at: '2026-10-17'
graduated_by: implement-agent
check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    f=lambda s: [m.group(1) for m in re.finditer(r''^## Decision (\d+): (.*)$'', t,
    re.M) if s in m.group(2)]; a=f(''First showcase product -- a UK organisation graph
    over public money''); assert len(a)==1, (''showcase-product Decision absent'',
    a); n=a[0]; blk=re.search(r''^## Decision 209:.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0);
    A=r''^> \*\*Amended by Decision ''+n+r'' \(\d{4}-\d{2}-\d{2}\):\*\* ''; got=[x
    for x in blk.splitlines() if re.match(A, x)]; assert len(got)==1, (''expected
    exactly one Amended-by line naming ''+n+'' on Decision 209'', got); x=got[0];
    need=[''first showcase product is named'', ''UK organisation graph over public
    money'', ''public products monorepo'', ''importing released platform versions'',
    ''Decision 101 point (d)'', ''Decision ''+n]; miss=[p for p in need if p not in
    x]; assert not miss, (''Decision 209 annotation text missing'', miss); assert
    ''amends Decision 209 clause 5'' not in x; print(''DEC_209_ANNOTATION_OK'', n)"'
