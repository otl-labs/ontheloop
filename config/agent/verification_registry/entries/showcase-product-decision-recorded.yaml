check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; from scripts.decisions_md import extract_amends_edges
    as ae; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m
    for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'',
    t, re.M|re.S) if ''First showcase product -- a UK organisation graph over public
    money'' in m.group(2)]; assert len(es)==1, (''expected exactly one showcase-product
    Decision'', [e.group(1) for e in es]); n=es[0].group(1); b=es[0].group(0); assert
    re.search(''^''+chr(96)*3+r''yaml\s*\nnumber: ''+n+r''\b'', b, re.M), ''no bare
    yaml envelope carrying number ''+n; assert ''value: numbered_decision'' in b,
    ''significance''; assert chr(10)+''amends: [209]''+chr(10) in b, ''envelope amends
    list''; assert ae(es[0].group(2))==[209], (''title amends edges'', ae(es[0].group(2)));
    edges=re.findall(r''(?:amends|Amends|supersedes|Supersedes) Decision (\d+)'',
    b); assert edges==[''209''], (''unexpected amends/supersedes edges'', edges);
    assert ''amends Decision 209 clause 5'' not in b, ''rec-4141 acceptance phrase'';
    assert ''**Warehouse ID:** dec-''+n+'' (per Decision 84'' in b and ''decision:
    ''+n+chr(10) in b, ''Warehouse ID or stanza number drift''; assert ''rec-X'' not
    in b and ''DATE'' not in b, ''unsubstituted placeholder''; ids=set(re.findall(r''rec-\d{4,}'',
    b))-{''rec-4141''}; assert len(ids)>=4, (''expected at least the four filed rec
    ids'', sorted(ids)); bad=[w for w in [''arn:'', ''Theseus'', ''Guerdon'', chr(36)]
    if w in b]+re.findall(r''\b\d{12}\b'', b)+re.findall(r''[^\x00-\x7f]'', b); assert
    not bad, (''public-boundary or ASCII hygiene'', bad); need=[''UK organisation
    graph over public money'', ''public products monorepo'', ''project under the operator'',
    ''Decision 101 point (d)'', ''metadata source and proof population'', ''sanctioned
    bootstrapping exception'', ''Decision 178'', ''clean oracle'', ''statistical power'',
    ''mandated open data'', ''only after a legal review'', ''robots.txt'', ''withdrawal
    of consent to automated access'', ''never solves or evades'', ''switches route'',
    ''converges on garbage'', ''Decision 205 clause 4'', ''compliance function'',
    ''Decision 55'', ''not settled here'', ''first otl init target'', ''fourth adoption
    case'', ''never one of them'', ''house-style profile'', ''built and burned'',
    ''never as instruction'', ''never imports product code'', ''provisional input,
    not a ruling'', ''failure_signal'', ''Tier C'', ''Coverage:** none enforced today'',
    ''first-paying-customer'', ''tier-one-gates-bots'', ''row-grain-chosen'', ''REPORT-showcase-product-and-rsi-proof.md:'',
    ''cl.5 .importlinter, owner rec-'', ''by subject'', ''35-96, 131-140'', ''product-abandoned''];
    miss=[p for p in need if p not in b]; assert not miss, (''showcase-product Decision
    text missing'', miss); print(''DEC_SHOWCASE_PRODUCT_OK'', n, len(ids))"'
