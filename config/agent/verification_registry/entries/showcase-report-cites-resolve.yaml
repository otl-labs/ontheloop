check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; r=pathlib.Path(''docs/plans/reports/REPORT-showcase-product-and-rsi-proof.md'').read_text(encoding=''utf-8'');
    assert r.endswith(chr(10)) and not r.endswith(chr(10)*2), ''final newline''; L=r.split(chr(10))[:-1];
    bad=[i+1 for i, x in enumerate(L) if x!=x.rstrip()]+re.findall(r''[^\x00-\x7f]'',
    r)+re.findall(r''\b\d{12}\b'', r)+[w for w in [''arn:'', ''rec-X'', ''DATE'']
    if w in r]; assert not bad, (''REPORT hygiene'', bad[:10]); H=[x for x in L if
    x.startswith(''## '')]; want=[''## ''+str(k)+''. '' for k in range(1, 11)]; assert
    len(H)==10 and [h[:len(w)] for h, w in zip(H, want)]==want, (''REPORT sections'',
    H); t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m.group(0)
    for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'',
    t, re.M|re.S) if ''First showcase product -- a UK organisation graph over public
    money'' in m.group(2) or ''Recursive self-improvement is proven against a judge
    the loop cannot edit'' in m.group(2)]; assert len(es)==2, (''expected both new
    entries'', len(es)); cites=[tuple(int(v) for v in r.split(''-'')) for e in es
    for g in re.findall(r''REPORT-showcase-product-and-rsi-proof[.]md:(\d+-\d+(?:,
    \d+-\d+)*)'', e) for r in g.split('', '')]; assert len(cites)>=5, cites; off=[(x,
    y) for x, y in cites if not (1<=x<=y<=len(L) and L[x-1].startswith(''## '') and
    (y==len(L) or L[y].startswith(''## '')))]; assert not off, (''REPORT cites not
    on whole-section bounds'', off, len(L)); print(''REPORT_CITES_OK'', len(L), sorted(set(cites)))"'
