    judging'',''never --file-rec'',''rec-4507'',''Decision 205 clause 1'',''rec-4506''),''c10'':(''snapshotted inputs'',''no
    live AWS in the agent step'',''as_of read'',''Decision 84'',''never a local read cache'',''rec-4504'',''detached
    checkout at the pinned SHA'',''fixed-argument git_log'')}; miss={k:[w for w in ws if w not in ec[k]] for k,ws
