  - bin/venv-python -c "import yaml,re; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); ti={x['id']:x
    for x in d['tier_items']}; t=ti['T4.15']; assert 'implement_agent on Fargate' in t['name'], t['name'];
    it=t['intent']; assert re.search(r'\[Amendment \d{4}-\d{2}-\d{2}, Decision \d+ clause 3 -- re-scoped
    to BE the implement_agent-on-Fargate T4.2 child', it), 'T4.15 intent amendment absent'; assert all(w
    in it for w in ('DEFERRED HALVES','T4.31','rec-4479','always-ask','frame-lock sentence above still
    holds')), 'T4.15 discharge split or rec-4479 owner unstated'; assert {'T4.19','T4.20','T4.21','T4.32'}<=set(t['depends_on']),
    t['depends_on']; ec={c['id']:c['text'] for c in t['exit_criteria']}; assert {'c12','c13','c14','c15'}<=set(ec),
    sorted(ec); need={'c12':('run_image','interim coordinator','kill path','terminal report','never starts
    or messages another persona','T4.2 c13','fargate drift leg'),'c13':('ecs:RunTask','no command or environment
    overrides','at or below','iam:PassRole','terraform/bootstrap','Decision 223 clause 2','made before
    this item','first live run','Decision 223 clause 1','Decision 144','rec-4043','asked of the human','T4.2
    c7','no-override scope','permissions boundary admits ecs:RunTask','rec-4479','task execution role'),'c14':('file_pr','T4.21
    c3, c11','never by the operator identity','base-ref leash'),'c15':('CAPTURE FROM DAY ONE','rec-4433','rec-4416','T4.2
    c3','first live run')}; miss={k:[w for w in ws if w not in ec[k]] for k,ws in need.items() if [w for
    w in ws if w not in ec[k]]}; assert not miss, miss; br={k:w for k,w in (('c2','post-confirmation conformance
    leg'),('c5','DEFERRED HALVES'),('c6','DEFERRED HALVES'),('c9','required CI checks')) if not (re.search(r'\[Amendment
    \d{4}-\d{2}-\d{2}, Decision \d+ clause 3 -- ', ec[k]) and w in ec[k])}; assert not br, ('T4.15 brackets',
    br); assert 'T4.21 c11' in ec['c5'], 'c5 does not hand file_pr to T4.21 c11'; pn=str(t.get('progress_note',''));
    assert all(w in pn for w in ('decision_scout','abandoned','anti-abuse','Decision 205 clause 6')),
    'abandonment not recorded'; rd=t.get('related_decisions') or []; assert {206,223}<=set(rd) and max(rd)>=229,
    rd; print('T415_IMPLEMENT_AGENT_OK')"
