    stale+=[p for p in ('AGENTS.md','docs/PROJECT_CONTEXT.md') if 'T4.25' in pathlib.Path(p).read_text(encoding='utf-8')];
    assert not stale, ('a live surface still cites reserved T4.25', stale); into=[x['id'] for x in d['tier_items']
