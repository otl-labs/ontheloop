check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n'', t, re.M) if m.group(2).startswith(''User-owned
    persona execution'')]; assert len(es)==1, ''user-owned persona execution Decision absent''; n=es[0].group(1);
    blk=lambda k: re.search(r''^## Decision ''+k+r'':.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0);
    D=r'' \(\d{4}-\d{2}-\d{2}\):\*\*''; pat={''206'':r''> \*\*Amended by Decision ''+n+D,''212'':r''>
    \*\*Amended by Decision ''+n+D,''194'':r''> \*\*Update''+D}; need={''206'':[''Clause 2'',''a subscription
    runs only work its owner initiated'',''own unattended queue'',''triggering actor'',''team API key
    (byok) through LiteLLM'',''verdict fails, never skips'',''per-run state'',''passed by name'',''clause
    5'',''own machine'',''per-run git clone'',''sandbox-runtime'',''T4.34''],''212'':[''Clause 5'',''Forgejo
    or Gitea'',''then GitLab, then bare git'',''Decision 184 clause 3 and Decision 205 clause 2'',''coupling
    PC-02'',''clause 7'',''generic change id'',''accepted while the repository bootstraps'',''sandbox_runtime'',''T4.34''],''194'':[''licence-sensitive'',''BUSL'',''grant-widening
    point (clause 4, T4.24 c6)'',''the two stanza conditions remain the flip'',''Decision 171 clause 5'',''rec-3154'']};
    keep={''206'':''One subscription serves one individual, never shared or pooled.'',''212'':''Change
    surface as verbs.'',''194'':''Staged flip.''}; got={k:[l for l in blk(k).splitlines() if re.match(pat[k],
    l) and ''Decision ''+n in l] for k in need}; probs=[(k,''expected a dated line naming ''+n) for k
    in need if not got[k]]; assert not probs, probs; probs=[(k,[w for w in ws if w not in got[k][0]])
    for k,ws in need.items() if [w for w in ws if w not in got[k][0]]]; probs+=[(k,''annotation sits before
    the Related paragraph'') for k in need if blk(k).find(got[k][0]) < blk(k).find(''**Related:**'')];
    probs+=[(k,''original body edited'') for k,s in keep.items() if s not in blk(k)]; assert not probs,
    probs; print(''ANNOTATIONS_OK'', n)"'
