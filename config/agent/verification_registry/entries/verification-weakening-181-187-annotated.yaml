check_spec:
  command:
  - bash
  - -c
  - 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); blk=lambda
    k: re.search(r''^## Decision ''+k+r'':.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0); b1=blk(''181''); b7=blk(''187'');
    pat=r''^> \*\*Amended by Decision 235 \(\d{4}-\d{2}-\d{2}\):\*\*.*?(?=\n\n|\n---|\Z)''; m1=re.findall(pat, b1, re.M|re.S);
    m7=re.findall(pat, b7, re.M|re.S); assert len(m1)==1 and len(m7)==1, (''expected one Decision 235 Amended-by line on each
    of 181 and 187'', len(m1), len(m7)); q1='' ''.join(m1[0].replace(chr(10)+''> '','' '').split()); q7='' ''.join(m7[0].replace(chr(10)+''>
    '','' '').split()); w1=(''to obtain green'',''earned lane evidence'',''ladder lane'',''docs/contracts/implement-scope-boundary.yaml
    invariants.content.earned_autonomy'',''otherwise unedited''); w7=(''second authorization kind'',''an evidence record naming
    the check, resolvable at the base ref'',''shared marker guard (clause 7)'',''reversal conditions c1 and c3'',''blocking,
    shadow, drop'',''dropping a shadowed check needs that record'',''below it clause 5 stands'',''otherwise unedited''); assert
    all(w in q1 for w in w1), (''181 annotation'', q1); assert all(w in q7 for w in w7), (''187 annotation'', q7); assert
    b1.index(''**Related:**'') < b1.index(m1[0]) and b7.index(''**Related:**'') < b7.index(m7[0]), ''annotation must follow
    Related''; n1='' ''.join(b1.split()); n7='' ''.join(b7.split()); keep=((''1. The CONTENT invariant -- no acceptance criterion,
    VP step, assertion, or budget is ever weakened to obtain green'', n1), (''4. Authorization is at CHECK-NAME level.'',
    n7), (''5. DELETION HAS NO MARKER ESCAPE.'', n7), (''id: c1'', n7)); lost=[k for k, s in keep if k not in s]; assert not
    lost, (''original body edited, not annotated'', lost); names=set().union(*[set(re.findall(r''name=.([A-Za-z_][A-Za-z0-9_]*).'',
    p.read_text(encoding=''utf-8''))) for p in pathlib.Path(''scripts/checks'').glob(''*/_manifest.py'')]); hit=sorted(x for
    x in names for q in (q1, q7) if re.search(r''(?<![A-Za-z0-9_])''+re.escape(x)+r''(?![A-Za-z0-9_])'', q)); assert not hit
    and not re.search(r''validate_[a-z]'', q1+q7), (''a registered check is named in an annotation'', hit); print(''DEC181_187_ANNOTATED_OK'',
    len(b1.encode(''utf-8'')), len(b7.encode(''utf-8'')))"'
