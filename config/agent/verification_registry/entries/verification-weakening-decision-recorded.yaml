  - 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m for
    m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''Verification weakening
    is human-gated at entry'' in m.group(2)]; assert len(es)==1, (''expected exactly one Decision 235 entry'', [m.group(1)
    for m in es]); n=es[0].group(1); b=es[0].group(0); assert n==''235'', (''operator-allocated number is 235'', n); fence=''^''+chr(96)*3+''yaml'';
    assert re.search(fence+r''\s*\nnumber: 235\b'', b, re.M), ''no bare yaml envelope carrying number 235''; assert ''value:
    numbered_decision'' in b and chr(10)+''amends: [181, 187]''+chr(10) in b, ''envelope significance or amends list''; from
    scripts.decisions_md import extract_amends_edges as ae; assert set(ae(es[0].group(2)))=={181,187}, (''title amends edges'',
    ae(es[0].group(2))); cl=re.findall(r''^(\d)\. \*\*'', b, re.M); assert cl==[''1'',''2'',''3'',''4'',''5'',''6'',''7''],
    (''expected seven clauses'', cl); need=[''Class and entry rung.'',''down-direction or loosening token of marker-grammar.yaml'',''only
    truthful disposition is'',''size-budget raises stay under Decisions 128/165'',''plan-field edits stay forbidden'',''a
    human-confirmed plan naming it, or a Decision its marker cites'',''fast-lane repair (Decision 226 cl.2)'',''Weakening
    to obtain green stays forbidden at every rung'',''a check red on the change is never eligible'',''Ladder lane.'',''review
    ladder (read_all, sampled, spot_check, anomaly_triggered)'',''one controller and transition log (Decision 221 cl.7)'',''binding
    when CD.46 ratifies'',''The operator approves every promotion; demotion is automatic'',''never exceeds its evidence producers'',''necessary,
    never sufficient'',''measured verification-boundary coverage below the current gate'',''Decision 211 cl.4'',''Shadow step.'',''blocking,
    then shadow, then removed'',''still runs and records each verdict as its own record kind'',''one loop record journal'',''shadow
    runs'',''Decision 170'',''a run gap voids the window'',''fails where every blocking check passed is restored'',''the lane
    returns to read_all'',''Redundancy evidence.'',''positive evidence the check is subsumed'',''killed by a retained blocking
    check'',''mutation-on-target kind'',''computed by deterministic code outside the loop'',''boundary_patterns and Decision
    185 cl.3'',''A clean history alone is never evidence, nor is an empty kill set'',''per-hunk or per-key revert operator
    exists at the base ref (T3.7 c8)'',''pre-registered (Decision 221 cl.4) under T4.4 c2'',''Irreducible floor.'',''never
    enumerated (Decision 187 cl.1)'',''the judge among them (Decisions 221 cl.2, 231)'',''pre-commit configuration declares'',''secret
    scanning among them'',''every check a marker-grammar.yaml token lists in used_by'',''every enforcer the CONTENT map names'',''controller,
    recorder and producer once built'',''gate forever'',''Amendments.'',''to obtain green'',''a routed weakening of any kind,
    each held to clause 4'',''a second authorization kind, an evidence record naming the check, resolvable at the base ref'',''bound
    through the shared marker guard (cl.7)'',''authorization bar; it counts toward reversal c1 and c3'',''at an earned rung
    mark-then-drop becomes blocking, shadow, drop'',''below it cl.5 stands'',''dropping a shadowed check needs that record'',''Decision
    163 point 1 is unchanged'',''no exception path to an exceptionless floor'',''meets the skip-citation floor by citing its
    work item'',''Sequencing.'',''Design now, build later (Decision 197 cl.8), not frame-lock (Decision 75)'',''rec-4413'',''(from
    2027-01-18)'',''(T3.7, deferred)'',''Coverage (Decision 181 cl.2):'',''none enforced'',''T3.4 c3 and T4.4 c7-c8'',''T3.7
    c8 (deferred)'',''invariants.content.earned_autonomy'',''yaml reversal-conditions'',''unique-catch'',''cd46-reshaped'',''remeasure-slip''];
    bb='' ''.join(b.split()); miss=[p for p in need if p not in bb]; assert not miss, (''Decision 235 text missing'', miss);
    edges=re.findall(r''(?:amends|Amends|supersedes|Supersedes) Decision (\d+)'', b); assert set(edges)=={''181''}, (''unexpected
    amends/supersedes edges'', edges); names=set().union(*[set(re.findall(r''name=.([A-Za-z_][A-Za-z0-9_]*).'', p.read_text(encoding=''utf-8'')))
    for p in pathlib.Path(''scripts/checks'').glob(''*/_manifest.py'')]); assert len(names)>=100, len(names); hit=sorted(x
    for x in names if re.search(r''(?<![A-Za-z0-9_])''+re.escape(x)+r''(?![A-Za-z0-9_])'', b)); assert not hit and not re.search(r''validate_[a-z]'',
    b), (''a registered check is named in the Decision body'', hit); deny=re.findall(r''(?i)\b(fable|kimi|deepseek|sonnet|opus|haiku|gemini|gpt-?\d|claude|anthropic|openai|qwen|llama|mistral)\b'',
    b); assert not deny, (''model or vendor name in the Decision'', deny); print(''DEC235_RECORDED_OK'', n, len(b.encode(''utf-8'')))"'
