check_id: visual-grammar-durable-structure
primitive_slot: command_exit_zero
guard_target: docs/contracts/visual-grammar.yaml
guard_symbol: null
plan_slug: dependency-map-transit-renderer
graduated_at: '2026-10-24'
graduated_by: implement-agent
check_spec:
  command:
  - bash
  - -c
  - |-
    bin/venv-python -c "
    import re, yaml
    from pathlib import Path
    from scripts.contracts import load_contract_meta
    p = Path('docs/contracts/visual-grammar.yaml')
    assert p.is_file(), 'docs/contracts/visual-grammar.yaml is absent'
    m = load_contract_meta(p)
    d = yaml.safe_load(p.read_text(encoding='utf-8'))
    assert m.class_.value == 'D' and m.subject == 'visual-grammar', (m.class_, m.subject)
    rules = {r['id']: r for r in d['firm_rules']}
    need = {'no-meaning-by-colour-alone': 'survives without colour', 'loop-never-bisected': 'symmetrically intersected', 'no-transit-operator-named': 'transit operator'}
    assert set(need) <= set(rules), sorted(rules)
    assert all(rules[k].get('coverage') and w in ' '.join(rules[k].get('rule', '').split()) for k, w in need.items()), 'a firm rule lost its text or coverage'
    ro = d['rendered_output']
    assert ro['default_folder'] == '.ontheloop/maps/' and ro['filename_shape'] == '<name>.otl-map.<ext>', ro
    rx = re.compile(ro['never_commit_regex'])
    assert rx.search('.ontheloop/maps/a.svg') and rx.search('x.otl-map.svg') and 'never committed' in ' '.join(ro['rule'].split()), ro
    sc = {k: ' '.join(v.split()) for k, v in d['scope'].items()}
    assert 'every human-facing visual' in sc['owns'], sc['owns']
    assert all(w in sc['dashboard_boundary'] for w in ('config/agent/visual_contract.yaml', 'inherits', 'firm rules', 'no colour vocabulary of its own')), sc['dashboard_boundary']
    print('VISUAL_GRAMMAR_CONTRACT_OK')
    "
