# Check-accounting declaration baseline (Decision 170; docs/contracts/check-accounting.yaml).
# ONE-TIME, shrink-only grandfather roster of registered checks that had not yet adopted the
# examined()/skipped() declaration obligation at this file's seeding. Generated from the live
# registry at seed time (scripts.checks.registry.all_checks()), not hand-listed.
#
# Enforced by scripts/checks/hygiene/validate_check_accounting.py (validate_check_accounting):
#   - A name here is exempt from the "declares examined()/skipped() somewhere in its defining
#     module" requirement that every OTHER registered check must satisfy.
#   - NO MARKER ESCAPE GRAMMAR OF ANY KIND. This is deliberate, not an omission (Decision 165
#     makes scripts/checks/_marker_guard.py the mandatory home for any future marker grammar --
#     adding one later means going there, never smuggling a `#`-comment escape into this file).
#   - SHRINK ONLY: a name may be REMOVED (once its module adopts the declaration) but can never
#     be RE-ADDED once removed -- the guard diffs this file's current entries against its
#     content at the diff base (scripts.checks._marker_guard.default_base_reader) and fails any
#     net growth relative to that base.
#   - FROZEN-CONSTANT CROSS-CHECK: independently of the diff-based shrink check, every entry here
#     must also appear in validate_check_accounting.py's own frozen `_BASELINE_SEED` constant.
#     A config-file edit alone -- adding a name neither shrink-diffed away nor already in that
#     frozen constant -- can never admit a new member; growing the roster past its seed requires
#     editing that constant in a reviewed code change.
#   - TOUCH-IT-FIX-IT (Decision 162 r3 shape): if a PR edits a baselined check's own defining
#     module without that module adopting the declaration in the same PR, the guard fails --
#     grandfathered stock cannot sit permanently exempt while still being actively maintained.
#   - MISSING-BASE SKIP: when this file is unreadable at the diff base (e.g. this seeding PR
#     itself, or origin/main unreachable), the shrink-only comparison SKIPs loudly rather than
#     treating "missing base" as "empty base" -- so the seeding PR does not fail its own gate.
#
# REVERSAL: if the declaration ratchet proves to be noise (no vacuous finding drives a fix
# within a stated window) or wedges unrelated PRs, unwind the channel + this baseline + the
# validation-result.json schema_version 3 shape together (Decision 170) -- never this file
# alone, since consumers key off the v3 shape.
#
# Paydown of this roster (adopting the declaration on each remaining entry) is future work; this
# file records the honest starting point, not a target state.
