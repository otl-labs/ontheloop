# Composite-action shell-body ratchet baseline (Decision 162 / rec-2923 preventive action).
# Enforced by scripts/checks/ci_guards/validate_composite_action_shell_bodies.py -- see that
# module's docstring for the full R1/R2/R3 rule text. Two sections, keyed by rule:
#
#   r1: known output-producing violators (R1) -- STRICTLY SHRINKING, no raise-approved escape at
#       all. A NEW output-producing inline body always fails regardless of this baseline; these
#       two pre-existing instances of the rec-2923 class are pinned here ONLY until extracted, and
#       the guard also cross-checks this section against its own frozen
#       _R1_KNOWN_VIOLATORS constant -- a config edit alone can never add a third entry.
#       Each value is an ENFORCED CEILING, not a note: a pinned body that GROWS past it fails,
#       and unlike r3 no `# raise-approved:` marker rescues it. Shrink or extract, never grow.
#   r3: non-output-producing inline body sizes, by effective (non-blank, non-comment) line count.
#       A live body exceeding its declared ceiling fails unless the entry carries an inline
#       `# raise-approved: dec-NNN <reason>` marker naming a real `## Decision N:` header (R3
#       ONLY -- r1 has no such escape).
#
# Keys are "<action-relative-dir>::<step-id>" (a positional "#<index>" fallback when a step
# declares no `id`). Seeded at the state PLAN-ci-rca-starved-surface (Decision 162) leaves the
# repo in (2026-08-02) -- a ONE-TIME grandfather in the sense of Decision 130 clause 2, explicitly
# NOT a precedent, so the PR installing the ratchet is not punished by its own rule.
# Touch-it-fix-it binds from the NEXT edit onward: a behavioural edit to a baselined body must
# extract it (r1) or extract-or-raise-with-marker (r3).
#
# HEADER EXTENSION (audit finding SGE-03 / PLAN-workflow-body-ratchet). The block above describes
# this file as it stood at Decision 162 and is left byte-identical on purpose (the installing PR
# proves its own edit is append-only). Everything below AMENDS it; where the two disagree, this
# block wins.
#
#   TWO GOVERNED SURFACES, THREE SECTIONS. R3 -- and only R3 -- now also governs every inline
#   `run:` body under .github/workflows/ whose effective shell is absent or begins with bash/sh.
#   That is one rule gaining scope, not a second rule: no second registered check name exists, and
#   the workflow leg's violations carry an `R3-workflow:` prefix so a workflow finding is never
#   read as a composite-action one (Decision 104). R1 and R2 stay COMPOSITE-ONLY -- R1 keys on a
#   manifest's top-level `outputs.<id>.value` block and R2 on a `.sh` delegate under the action
#   directory, and neither construct has a workflow analogue.
#
#   FILENAME. It names one surface and governs two. Retained deliberately: renaming would churn
#   the guard's baseline path constant, both contracts and Decision 162's named artifact for no
#   functional gain. This header, not the filename, is the authoritative description.
#
#   KEY GRAMMARS, one per section.
#     r1, r3        -- "<action-relative-dir>::<step-id>", positional "#<index>" fallback.
#     r3_workflows  -- "<workflow-rel-path>::<job-id>::<step-identity>", where step-identity is the
#                      step's own `id`, else a lowercase hyphen-slug of its `name` (every run of
#                      non-alphanumerics collapsed to one hyphen, so no YAML-unsafe character
#                      survives), else a positional "#<index>" over the job's FULL steps list, with
#                      a deterministic "~N" suffix on collision inside one job. The extra job-id
#                      segment is why this diverges from r3's grammar: workflow jobs are long
#                      (reconcile.yml's apply-reconcile job alone carries 26 steps) and mostly
#                      id-less, so a purely positional key would renumber every subsequent entry in
#                      a job whenever one unrelated step was inserted.
#
#   SECTION ALLOWLIST, ENFORCED not asserted. The set of top-level sections in this file is frozen
#   at exactly {r1, r3, r3_workflows}; an unrecognised top-level section FAILS the guard. Admitting
#   a fourth grandfather roster HERE requires editing _KNOWN_BASELINE_SECTIONS in
#   scripts/checks/ci_guards/_workflow_shell_bodies.py in a reviewed code change -- never a config
#   drop-in. Scope stated precisely: this bars a roster smuggled into THIS file, and cannot bar one
#   minted somewhere else.
#
#   r3_workflows SEEDING. Seeded one-time at the state PLAN-workflow-body-ratchet leaves the repo
#   in -- 128 bodies across 17 workflow files, 1,220 effective lines, re-censused by structural
#   YAML parse at implement HEAD -- each entry at its exactly-measured count, no padding, no
#   headroom, no markers, exactly matching how Decision 162 seeded r3. Decision 130 clause 2's
#   "ONE-TIME grandfather, NOT a precedent" bars a grandfathered ENTRY from growing; it is not a
#   bar on seeding a further surface, which is why this needs no new numbered Decision (Decision
#   166's Related section already anticipates SGE-03 as post-landing implementation work).
#   Touch-it-fix-it binds from the next edit onward here too: extract to scripts/ci/, or raise the
#   ceiling with a marker citing a Decision that names the entry or its workflow file path.

