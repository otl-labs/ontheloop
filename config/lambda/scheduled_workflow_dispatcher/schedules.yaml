# Scheduled workflow dispatcher register and allowlist (Decision 267, rec-4233).
# Read by src/data/handlers/workflow_dispatcher_handler.py (bundled in data-pipeline.zip), the liveness sensor
# (scripts/convergence_health/sensor_liveness_dispatch.py), the integrity reads
# (scripts/convergence_health/dispatch_integrity.py) and the refusal-guard test
# (tests/verify_ci_workflow/test_dispatch_bot_guard.py).
# terraform/personal/scheduled_workflow_dispatch.tf repeats each row's cron, name and alarm periods as literals (the
# trusted-plan HCL screen allows no file read there) and the stack test holds them equal, so a row change lands with
# its HCL change.
# A row is a workflow the dispatcher may start on main with no inputs. A new row is rec-5113's and needs the 14-day
# soak first.
app:
  client_id: Iv23liikVDiOobQGxwGR
  bot_login: otl-workflow-dispatcher[bot]
key_parameter: /secret/agent-platform-workflow-dispatcher-app-key
repository: otl-labs/ontheloop
ref: main
schedules:
  terraform-drift:
    workflow: terraform-drift.yml
    aws_cron: "cron(17 * * * ? *)"
    skip_window_seconds: 900
    alarm_period_seconds: 3600
    alarm_evaluation_periods: 2
  convergence-health:
    workflow: convergence-health.yml
    aws_cron: "cron(37 * * * ? *)"
    skip_window_seconds: 900
    alarm_period_seconds: 3600
    alarm_evaluation_periods: 2
  main-canary:
    workflow: main-canary.yml
    aws_cron: "cron(0 0/3 * * ? *)"
    skip_window_seconds: 900
    alarm_period_seconds: 10800
    alarm_evaluation_periods: 1
