# The one persona image file (T4.32 c2). An agent session opens each pin PR with persona_image_pin update and the operator
# merges it. Read through src/persona_hosts/image_pin.py, plus two line-level readers of the image, digest and source_commit
# lines: persona_image_changed.py, and persona_image_pin.py (which also rewrites the digest and source_commit lines).
# digest and source_commit are both null or both set.
image: ghcr.io/otl-labs/ontheloop-persona
digest: "sha256:a91969b8fad81829dd28e8254c136c1042c1ca2c19e56e8df06a832465812547"
source_commit: "920d18ad09262b2af6f4e44b20b440bc379a0f6d"  # pragma: allowlist secret
build:
  dockerfile: docker/persona/Dockerfile
  files:
    - docker/persona/Dockerfile
    - docker/persona/Dockerfile.dockerignore
    - docker/persona/requirements-persona.txt
  copy:
    - scripts/__init__.py
    - scripts/run_persona.py
    - scripts/llm/__init__.py
    - scripts/llm/litellm_cold_start.py
    - scripts/llm/litellm_transport.py
    - scripts/llm/litellm_wire.py
    - scripts/llm/tier_selection.py
    - src/__init__.py
    - src/persona_backends/
    - src/turn_capture/__init__.py
    - src/turn_capture/litellm_usage.py
    - docs/contracts/personas/
    - docs/contracts/inference-provider.yaml
    - docs/contracts/project-configuration.yaml
consumers:
  local_container: {status: built, location: src/persona_hosts/local_container/}
  github_actions_shell: {status: pending, owning_item: "T4.2:c8"}
  fargate: {status: pending, owning_item: "T4.15:c12"}
