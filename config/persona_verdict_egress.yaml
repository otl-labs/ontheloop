# The verdict chain shell's network egress list (PLAN-persona-verdict-shell-deny; T4.32 c7 shell leg; Decision 224 cl.1).
# Every entry is core-owned, never a user-set setting. A host derived from a project setting (the region, a
# provider) arrives only with a form the static check resolves from that setting's home (PLAN-persona-verdict-first-key-read);
# no region id or account id is ever written here (Decision 101, Decision 202).
# Two derived forms: {aws_region} resolves from config/aws-region's home through a keyless job's aws-region output;
# provider hosts resolve from docs/contracts/inference-provider.yaml litellm_tier_models through provider_hosts.
# filter: the pinned block-mode filter and the sha256 of the agent binary inside its agent v0.18.1 linux amd64 release.
# filter_supplied: the normalised snapshot of the hosts the filter adds to every job (the vendor's served list plus the
# agent's hard-coded hosts, productionresultssaN folded to productionresultssa*); egress-control fails if the vendor's
# list is wider. The egress-container job (PLAN-persona-verdict-container-egress) lists the routed tier's provider and GHCR's blob host
# (ghcr.io is filter-supplied) for the digest pull. The jobs' filter leaves sudo and containers to the egress floor (PLAN-persona-verdict-egress-floor). jobs: <workflow path>: {<job>: [host:port, ...]}.
filter:
  action: step-security/harden-runner
  sha: 1d88384fd173af6ecb012dfd0264a306b711241a  # pragma: allowlist secret
  version: v2.22.4
  agent_sha256: 765b8bdb631bac93645d8039c9b8719c40105d3f444a155d7073859ded0b020a  # pragma: allowlist secret
filter_supplied:
  - "*.actions.githubusercontent.com"
  - "*.github.com"
  - "*.githubapp.com"
  - ghcr.io
  - github-registry-files.githubusercontent.com
  - github-releases.githubusercontent.com
  - github.com
  - objects-origin.githubusercontent.com
  - objects.githubusercontent.com
  - productionresultssa*.blob.core.windows.net
  - release-assets.githubusercontent.com
wildcard_residuals: []
provider_hosts:
  deepseek/: api.deepseek.com:443
  anthropic/: api.anthropic.com:443
jobs:
  .github/workflows/persona-verdict-egress-probe.yml:
    egress-probe:
      - sts.amazonaws.com:443
    egress-container:
      - api.deepseek.com:443
      - pkg-containers.githubusercontent.com:443
    egress-fail-closed:
      - sts.amazonaws.com:443
    egress-fail-closed-control:
      - sts.amazonaws.com:443
  .github/workflows/persona-verdict.yml:
    run:
      - sts.{aws_region}.amazonaws.com:443
      - ssm.{aws_region}.amazonaws.com:443
      - api.deepseek.com:443
      - pkg-containers.githubusercontent.com:443
    smoke:
      - sts.{aws_region}.amazonaws.com:443
      - ssm.{aws_region}.amazonaws.com:443
      - api.deepseek.com:443
      - api.anthropic.com:443
    refusal:
      - sts.{aws_region}.amazonaws.com:443
    post:
      - sts.{aws_region}.amazonaws.com:443
      - ssm.{aws_region}.amazonaws.com:443
