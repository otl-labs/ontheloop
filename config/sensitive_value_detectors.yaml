# Sensitive-value detector ratchet registry (rec-4481 plan 1; semantics in scripts/checks/misc/sensitive_value_detectors.py).
# One entry per profile and positive corpus case: "<profile>.<CLASS>.<case_id>@<8 hex of sha256(text NUL planted_value)>".
# Value 1 = the case is masked and attributed to its own class; 0 = a tombstone left by a marked drop.
# A 1-to-0 change, or deleting a value-1 entry, needs `# detector-loosening-approved: dec-NNN <reason>` on the entry's
# own line, with the cited Decision naming the exact key. A new case or a 0-to-1 raise is always free. To retire a case:
# mark-then-drop (set it to 0 with the marker in one PR; the tombstone is deletable later).
