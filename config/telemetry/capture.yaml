# Claude Code turn-capture switch (PLAN-telemetry-capture-hooks rule SW-1), read by scripts/telemetry_capture/switch.py.
#
# The switch is read from origin/main, then main, then this checkout (rule SW-3, parser_version 4): setting enabled
# false on main (or deleting this file there) reaches a running session at its next fetch of main or its next
# SessionStart. OTL_TURN_CAPTURE=off stays the per-session stop. Hook and producer code still come from each session's
# checkout.
#
# The CI path (ci-pass, PLAN-telemetry-claude-p-capture-adapter) is separate from the hook path below: it is read from
# origin/main first like the switch, and runs only for a workflow listed under ci_workflows, on refs/heads/main of
# ci_repository, with enabled true. Removing an entry (or enabled: false) on main stops CI capture at the next run.
# Hook capture stays off in Actions. ci_workflows entries are {workflow, agent (a source_registry key), content_policy
# (full | withheld)}; they carry no project_ref (its one home is the pin hook flag in .claude/settings.json).
# ci_uncaptured lists call sites that run claude -p without capture, each with a reason and an owning rec.
#
# Capture runs only when ALL of these hold:
#   - enabled: true below (switched on 2026-10-15 on the operator's word; set it back to false to disable)
#   - CLAUDE_CODE_REMOTE == "true" (a Claude Code cloud session)
#   - GITHUB_ACTIONS != "true" (never inside CI)
#   - OTL_TURN_CAPTURE != "off" (the disable-only environment variable: export OTL_TURN_CAPTURE=off to stop capture)
#   - credentials resolve (checked by the runner; none -> diagnostic no_credentials, a raising chain -> credential_error, a chain that could not connect -> credential_transport, nothing sent)
#
# The c8 smoke override (rule SW-2): OTL_TURN_CAPTURE_SMOKE_REF=synthetic:<ref> allows capture regardless of this switch
# and CLAUDE_CODE_REMOTE, only for a tree whose pinned project_ref equals that synthetic: ref. GITHUB_ACTIONS == "true"
# and OTL_TURN_CAPTURE == "off" still win.
enabled: true
ci_repository: otl-labs/ontheloop
ci_workflows:
  - {workflow: .github/workflows/ci-rca.yml, agent: ci_rca, content_policy: full}
ci_uncaptured:
  - {call_site: .github/actions/subagent-plan-review, reason: "plan review needs the capture role (producer-admission plan)", owner: rec-4420}
