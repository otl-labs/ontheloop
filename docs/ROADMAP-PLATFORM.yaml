        text: "Decision 164's collapse pricing is recorded before any persona routes through the CLI backend -- which substrates can host the vendor CLI, and what routing through it costs the substrate set [Rehomed 2026-09-28, Decision 206 clause 8 -- the collapse pricing is recorded by Decision 206 clause 8, and which substrates can host the CLI is T4.15 c11's desk-scored row]"
