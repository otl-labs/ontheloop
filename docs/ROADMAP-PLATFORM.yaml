        met_by: T4.15
      - id: c2
        text: "The design-now constraints the backend places on T4.10a (persona contracts), Decision 199 (telemetry event journal) and the run_persona port are decided and landed on those surfaces"
        status: met
        met_by: cli-persona-backend
      - id: c3
        text: "The backend never runs on the paid plane On The Loop hosts, and On The Loop never collects, stores or forwards the user's token (Decision 205 clause 4)"
        status: open
      - id: c4
        text: "Before design, the current vendor terms for subscription-backed CLI use by third-party tooling are quoted as retrieved and confirmed to permit the user-owned backend; a bar fires Decision 205's vendor-terms reversal condition"
        status: met
        met_by: cli-persona-backend
      - id: c5
        text: >-
          Adapter -- the claude_cli backend renders its flags from the persona contract, never per persona by
          hand: the rendered system prompt (whether --system-prompt, which replaces the CLI default prompt, or
          --append-system-prompt, which keeps it, is decided by a recorded spike against prompt-hash parity),
          the tool set from the capability map, --max-turns from the turn budget, the output schema through
          the CLI's structured-output flag, and --output-format json or stream-json. It runs the pinned CLI
          as a subprocess under the wall-clock budget as a hard timeout, in bypass-permissions mode inside the
          OS sandbox, and maps the result message and exit code onto the contract's failure_outputs
        status: open
      - id: c6
        text: >-
          Capability ceiling -- CLI extras (web search, plugins, skills, hooks, slash commands, CLAUDE.md and
          auto memory, MCP servers outside the contract) are unavailable unless a capability names them,
          enforced through the tool and context surfaces the run exposes, never by permission prompts (bypass
          mode prompts nothing) and never by --bare (bare mode never reads OAuth credentials, so it cannot
          serve a subscription); the capability-to-tool map lives under a Decision 117 boundary path
        status: open
      - id: c7
        text: >-
          Conformance suite, the anti-drift gate -- (i) prompt-hash equality per persona contract version
          across both backends; (ii) a capability-to-tool mapping table with a test that fails on any unmapped
          capability or any CLI tool the run reports enabled outside the map; (iii) both backends' results
          validate against the same output schema; (iv) golden recorded fixtures, one CLI stream-json and one
          litellm transcript per persona, normalize to identical Decision 199 events modulo ids and timestamps
        status: open
      - id: c8
        text: >-
          The CLI version is pinned (the @anthropic-ai/claude-code pin pattern ci-rca uses, Decision 74),
          preflight refuses an installed CLI whose --version is below the pin, and a pin-bump PR runs the
          conformance suite before it merges
        status: open
      - id: c9
        text: >-
          Usage window -- concurrency 1 by default; a plan-limit signal (its observable form recorded from a
          live fixture, since the CLI documents no exit code for it) moves the queue to a paused_until state,
          not a failure and never a retry storm; only if the end user configured an API key may paused work
          resume on the litellm backend
        status: open
      - id: c10
        text: >-
          Credential preflight (Decision 206 clauses 2-3; secret-material-handling.yaml) -- On The Loop code
          handles credential names, never values: the subprocess environment is built from an allowlist of
          names, and no log, crash dump or telemetry row serialises it. claude_cli is subscription-only:
          preflight refuses to start when ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, an apiKeyHelper or a
          cloud-provider flag is present, derives auth_method (subscription_stored_login or
          subscription_setup_token) from what the CLI will resolve, refuses on the hosted paid plane, and
          offers no configuration that shares one token across people
          [Amendment 2026-10-23, Decision 234 clause 3 -- with the laptop's saved login retired (a persona run on the local adapter signs in with a setup-token passed by name, T4.34 c8), preflight derives only subscription_setup_token]
        status: open
      - id: c11
