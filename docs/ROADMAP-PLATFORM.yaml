  - id: T4.16
    tier: T4
    name: 'Executor plan data plane -- content pin, critique-authorship boundary and loop-safety criteria (MVP slice)'
    intent: |
      Decision 87 as amended makes warehouse RESIDENCY of executor-authored plans a prerequisite for
      T4.2 rather than a consequence of it, and the two-plane design recorded in CD.44 has every
      persona fetch its plan from the warehouse row instead of receiving it through the orchestration
      plane. That moves the plan data plane from post-MVP to MVP-critical: nothing downstream of
      plan_agent can run without it. This item lands the MVP slice -- the named read verb, the
      content pin that makes a fetch verifiable, and the authorship boundary around critique_history
      -- and routes the verb-RBAC split itself forward to T4.5/T4.6, where per-persona credentials
      exist. It builds no persona and selects no substrate.

      [Re-grounded 2026-09-28, Decision 205 clause 5 -- every plan lives in git, so personas read the plan file at the attested head SHA, the content pin IS that SHA, and critique authorship is enforced by GitHub identity. The warehouse named read verb (c1) is rehomed to T4.5 as a projection read; the remaining MVP slice is the pin, the authorship boundary and the loop-safety criteria c6-c17.]
    depends_on: [T4.21]
    files_in_scope:
      - src/common/ducklake_scd2_schema.py
      - scripts/ops_portal/execution_plans.py
      - config/lambda/ducklake/field_semantics.yaml
    exit_criteria:
      - id: c1
        text: >-
          DATA-1 -- the named read verb execution_plan_by_rec, taking (rec_id, revision), is registered in the
          NAMED_READS registry and reachable across the closed reader boundary. Personas fetch their plan through
          it and never through query_ops, which accepts caller SQL: the agent contract is named verbs precisely so
          no caller SQL crosses the boundary [Rehomed 2026-09-28, Decision 205 clause 5 -- personas read the plan from git at the attested head SHA; the named read verb is a projection read, T4.5 c6]
        status: rehomed
        met_by: T4.5
      - id: c2
        text: >-
          The plan fetch PINS CONTENT -- every persona reads the plan file at the head SHA the
          orchestration plane carries (a git commit SHA is store-minted and content-addressed), and
          the fetch fails closed when the PR head no longer equals that SHA; a (rec_id, revision)
          pair is never the fetch key
        status: open
      - id: c3
        text: >-
          The planner/critic split is enforced by GitHub identity at MVP rather than by writer
          verbs -- the executor App commits plan files and holds no checks:write, and the verdict
          of record is a check run under the verdict identity (on Actions the GitHub Actions app,
          elsewhere a dedicated verdict App -- Decision 205 clause 2). The orchestration plane
          carries (rec_id, pr_number, head_sha), and every persona fetch and the merge node verify
          it; writer-verb role scoping is not built (T4.5 c3)
        status: open
      - id: c4
        text: >-
          A critique verdict is authored by the verdict identity, never by the critiqued persona --
          the executor App cannot create, edit or dismiss the critique check run, and critique
          directives live in that check run's output, never in the plan file, so a critique never
          invalidates the head-SHA pin
        status: open
      - id: c5
        text: >-
          The plans-table NAME is RULED rather than defaulted, and this item is where the ruling has to be legible
          because the read verb BINDS a physical name into NAMED_READS: ops_execution_plans is the single plans
          table, selected on prevalence (the implemented name, carried on 278 matching lines across 80 files, 32
          of them load-bearing across terraform, field_semantics, .importlinter, the verification and data-quality
          registries and 12 test modules, against 30 prose-only lines across 8 files for the rejected alternative
          name, none load-bearing). No surface leaves the name open [Rehomed 2026-09-28, Decision 205 clause 5 -- the name binds into T4.5's projection read verbs now that c1 is rehomed; ops_execution_plans stays the ruled name]
        status: rehomed
        met_by: T4.5
      - id: c6
        text: >-
          The read path survives a Neon COLD RESUME: a cold-start reconnect is retried with bounded backoff before
          the step is failed, and the bound is stated. The design declares unattended operation impossible without
          it, so an unretried cold resume is an outage rather than a latency spike [Scoped 2026-09-28, Decision 205 clause 5 -- the persona plan fetch no longer reads the warehouse; the bound covers the loop's remaining warehouse reads (queue pick, rec fetch)]
        status: open
      - id: c7
        text: >-
          MECH-4 -- a reaper unsticks a rec whose executor run died mid-flight. ci-rca-inactivity-sweep.yml closes
          genuinely-inactive open source=ci_rca recs on a timestamp predicate and is NOT a reaper for a crashed
          run holding a queue slot; without an equivalent the queue silently loses a slot per crashed run
        status: open
      - id: c8
        text: >-
          DATA-2 -- per-revision history has a home that survives an ephemeral compute plane -- each plan revision
          is a commit on the plan PR (git history), and the projection holds one row per (plan_path, head_sha)
          (T4.5 c4), so jsonl_store's repo-relative PLANS_JSONL is not the revision record and dies harmlessly
          with the job
        status: open
      - id: c9
        text: >-
          DATA-3 -- every fanned-out scout leg is HANDED its parent's observation_id as an input.
          parent-observation-id.yaml is explicit that a child never re-mints a correlation key it did not
          originate, so a naive matrix fan-out records N disconnected roots and violates the contract by default;
          the contract also notes there is no current populator, so the swarm tree is contracted but not built [Re-grounded 2026-09-28, Decision 205 clause 2 -- for an Actions verdict job the thin shell carries the parent observation_id into run_persona, read from the check run's external_id or the PR metadata the executor wrote when it opened the PR; persona code never mints it]
        status: open
      - id: c10
        text: >-
          OPS-3 -- LLM-authored code must not execute inside a session holding broad cloud credentials.
          implement_agent writes tests and then runs them; Decision 117 boundary patterns gate which recs are
          ADMITTED, not what an agent writes once admitted. Credentials are scoped to the specific steps that need
          them rather than held for the whole run
        status: open
      - id: c11
        text: >-
          A MERGE-NODE DIFF-PATH GUARD is live: at the merge node the PR diff is inspected and the merge is
          refused when that diff touches .github/workflows/** or any path matching the Decision 117
          boundary_patterns SSOT. ci.yml runs on pull_request, so a same-repo branch runs its own version of the
          workflow -- the guard has to sit on the plane the agent cannot edit through its own merge loop, so the
          merge node CONSUMES the T4.21 executor-boundary-guard check run for the head SHA (refusing when it is
          absent or failed) rather than re-implementing the diff inspection, and the diff, the workflow path and
          the merge node are gated together in that one control; the same consumption gates the plan-PR merge and every persona-verdict acceptance (T4.9a c7), so a verdict on a head SHA whose boundary check is absent or failed is refused
        status: open
      - id: c12
        text: >-
          QUEUE SEEDING for the first queue-fed run is decided rather than discovered: what populates
          ops_priority_queue before the executor has filed any recs of its own, and which producer owns that
          seeding
        status: open
      - id: c13
        text: >-
          ONE eligibility predicate is authoritative and the divergent versions are reconciled to it -- including
          the effort and target-SLOC admission gates Life 1 actually enforced, which appear in none of the forward
          design
        status: open
      - id: c14
        text: >-
          The three CLOSURE POINTS are adjudicated: the executor closing the rec itself, the Resolves: trailer on
          push, and post-merge full-validate PASS. Which one counts as done, and what happens when they disagree
        status: open
      - id: c15
        text: >-
          A cross-run FAILURE BUDGET either exists with a numeric threshold and a named owner, or is recorded as
          deliberately absent with the reason. Per-rec loop budgets (T4.11) bound one run and are not a rate
          limiter ACROSS runs
        status: open
      - id: c16
        text: >-
          Where an executor-authored RCA rec surfaces is decided: source=ci_rca carries a preflight section, a
          hard block, liveness alerts, a fingerprint chain and an inactivity sweep, while executor-rca and
          executor-postmortem recs have none of it and land in a generic backlog current policy leaves unexamined
          until the executor exists
        status: open
      - id: c17
        text: >-
          Whether ops_recommendations gains a PLURAL TARGETS field is decided: both the Decision 117 boundary
          predicate and the semantic-lock derivation are specified over a rec's targets, while the schema carries
          a single scalar file, so neither is implementable as written
        status: open
