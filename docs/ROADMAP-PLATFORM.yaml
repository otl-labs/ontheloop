      - "Every waitForTaskToken / verdict-wait state in the state machine carries HeartbeatSeconds and TimeoutSeconds; timeout transitions route to ci-rca (Decision 72), never a silent re-wait -- the executor analogue of the interactive dropped-green-signal backstop"
      - "pick_rec admission predicate enforced (not merely poll priority queue): a rec is admitted for autonomous execution only when its T3.8 relevance verdict == relevant (CD.36 / Decision 103), automatable == true, and its risk is within the current T4.4 autonomy-gate ceiling (Decision 92 ratchet), AND none of its targets match the Decision 117 boundary_patterns SSOT (config/agent/executor/capabilities.yaml); a refused pick emits a typed telemetry event, and a boundary_patterns hit re-routes the rec to the human path (Decision 55) -- never auto-executed. The standing validate_executor_boundary guard is NOT a substitute: it reads a gitignored derivative cache, returns silently when that cache is absent (every fresh clone, and CI), and never inspects a diff -- tracked as rec-3218 and repaired outside this item"
      - "The GitHub credential model for file_pr and merge is specified in the T4.1 / T4.9(a) atomic plans (the IAM criteria above cover the AWS leg only): PAT versus GitHub App, its scopes, storage, rotation, and why no persona environment other than file_pr / merge holds it (Decision 92 least-privilege OIDC precedent). This is a DIFFERENT credential from the orchestration-to-compute dispatch credential (MECH-1, owned by T4.15) -- neither discharges the other. Decision 185 clause 3 pins the choice: a GitHub App installation identity, installed with contents and pull_requests write only, ABSENT from branch-protection bypass_actors (Decision 83 ruleset; terraform/github/repo.tf; human-gated apply). Its creation, installation and the live probe that a red required check refuses its merge are T4.21 c3, which this item depends on; this discharges rec-2827 premise, and rec-2827 closes at T4.21 c3."
      - "A single named operator kill-switch is documented (disable the EventBridge trigger AND set state-machine concurrency to 0) with its authority, and is covered by a test proving an in-flight execution stops cleanly (Decision 55) and no new execution starts. OPS-4 -- the switch must reach EVERY control plane the loop actually runs on: an orchestration-side switch has no reach into compute that executes outside AWS, so closing it needs a flag checked at the start of every persona invocation plus a cancel-and-disable path on that plane wired into the same control. Known and closeable, but it means the stop button lives in two places and the criterion is met only when both work"
      - "MECH-2 -- no verdict-wait state can hang on a lost worker. Every dispatched unit reports terminally through an always-run reporting step, so a cancellation, a lost host or a duration-ceiling hit fails the task token instead of leaving it to time out silently, and every wait state carries HeartbeatSeconds. The token-success/token-failure grant on the reporting identity is IAM-sensitive, so it routes through the tf-gated-apply Environment rather than a routine apply (CD.35 / Decision 92)"
