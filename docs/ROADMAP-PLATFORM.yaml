          digest-pinned image the thin shell runs; laptop uses the CLI's own saved login, a local container
          takes a claude setup-token token by env file, the end user's own Actions takes it as their
          repository secret for Decision 205 clause 1 verdict personas only, and the end user's own AWS runs
          on Fargate with native secret injection, never Lambda
          [Amendment 2026-10-23, Decision 234 clause 3 -- on the local adapter the laptop row's saved login gives way to per-run state signed in by a claude setup-token passed by name, which T4.34 c8 owns (this criterion keeps no laptop leg); a subscription-backed verdict job runs only when the pull request's author and both the verdict run attempt's triggering actor and, on the workflow_run chain, the upstream run's are the subscription owner: a collaborator's push or a maintainer's re-run fails the check while the owner's own re-run passes, and any other pull request runs on a team API key (byok) through LiteLLM or the verdict fails, never skips (Decision 205 clause 2)]
        status: open
        blocked_by: [{ref: T4.24, until: complete}]
      - id: c12
        text: >-
          Outcome parity -- verification-gate pass rate and cost-per-verified-merge per (persona, backend) are
          read from Decision 199 events, compared in turns and tokens per verified merge (the unit both
          billing shapes share) with dollars for metered_marginal only, and the record states the tolerance
          and sample over which claude_cli holds parity with litellm; failing it fires Decision 206's
          parity-unheld reversal condition
        status: open
      - id: c13
        text: >-
