  - id: T4.34
    tier: T4
    name: 'Local sandboxed persona host -- a per-run git clone under sandbox-runtime around the whole persona process (Decision 234)'
    intent: >-
      Per Decision 234 clauses 1-3, the default local persona_compute_host adapters on a user's own machine: a per-run
      git clone plus Anthropic's sandbox-runtime (srt) wrapping the whole persona process for any persona_backend, so
      Decision 206 clause 5's OS sandbox sits outside the persona. sandbox_runtime (macOS Seatbelt; Linux and WSL2
      bubblewrap) is supported and sandbox_runtime_windows (a dedicated local user, a write-restricted token and Windows
      Filtering Platform filters; one-time elevation; alpha upstream) experimental (Decision 212 clause 7).
