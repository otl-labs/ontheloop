    notes: T2.2 covers ops + decisions only. Telemetry tables (7) are pre-live throwaway per topology principle; not migrating saves work. If pre-migration telemetry has post-hoc analytical value, file a rec to extend T2.2.
  - id: KG.6
    gap: Sibling-branch hand-off — PROMOTED to CD.18
    status: promoted
    resolution_ref: "CD.18"
  - id: KG.7
    gap: Anthropic Tier-2 escape-hatch availability (post-CD.28)
    notes: |
      [Rewritten 2026-05-27 per CD.28 -- Bedrock retired]: original gap concerned Bedrock partial-denial.
      Bedrock is no longer in the LLM substrate per CD.28; the partial-denial scenario no longer applies.

      Current Tier-2 availability gap (much smaller blast radius): Anthropic-direct via LiteLLM is the
      Tier-2 escape hatch funded by the user's Claude Code Max x5 subscription programmatic-pool credit
      (~$100/month, no rollover, spillover at API rates per Anthropic's June 2026 billing model). Two
      availability concerns to monitor:

        1. Programmatic-pool exhaustion. If executor volume sustains > 70% of Max x5 programmatic pool
           over a 30-day window, spillover bills at API rates and may exceed the cost envelope. Mitigation
           per CD.28 discipline point: file rec to provision an org-billed Anthropic API key as an
           overflow credential. [Built 2026-07-02]: machine-evaluated by PLAN-cost-reconciliation-job's
           monthly monitor (scripts/cost_reconciliation.py trigger key anthropic_pool_utilisation, same
           70% threshold) -- see CD.28 follow-on plan inventory.
        2. Anthropic-direct outage or rate-limit during a DeepSeek outage simultaneously. Currently
           Tier 3 (OpenRouter) is deferred -- there is no warm third tier. If both Tier 1 and Tier 2
           are simultaneously unavailable, T4.2's autonomous loop blocks until either provider recovers
           or a hotfix activates OpenRouter as a hot escape hatch. NOT invoice-reconcilable (an
           availability gap, not a cost-envelope breach) -- stays owned by the deferred
           Tier-3/OpenRouter work, not the cost-reconciliation monitor.

      T0.4 is rewritten (per the same pivot) for Anthropic-direct + DeepSeek API key provisioning. The
      original Bedrock-model-access-request critical path is moot.
  - id: KG.8
    gap: CLOSED -- Self-hosted runner SPOF during T2.1 re-deploy (superseded by CD.21)
    status: closed
    resolution_ref: "CD.21"
  - id: KG.9
    gap: CC-on-web deprecation contingency
    notes: |
      CD.4 accepts vendor lock-in to Claude Code on the web as the primary dev surface. If Anthropic
      deprecates CC-on-web, AGENTS.md (T0.9) gives partial portability to other harnesses, but T0.2-T0.5
      env setup + session-start hooks are CC-on-web specific. Rollback path: fall back to Windows VM
      until equivalent harness configured. Not urgent now; reassess if Anthropic announces deprecation.
  - id: KG.10
    gap: SCD2 timestamp preservation policy — PROMOTED to CD.19
    status: promoted
    resolution_ref: "CD.19"
  - id: KG.11
    gap: YAML file-size split policy -- RESOLVED (ceiling raised, deterministic guard added)
    status: resolved
    resolution_ref: "Decision 114"
  - id: KG.12
    gap: PLAN-platform-roadmap.md verification plan refresh cadence
    notes: |
      Round-2 adversarial LOW-9: the PLAN's verification plan was written against the initial YAML and
      needs updates whenever the YAML grows new top-level sections (cost_projection, gate_helpers),
      new CDs, or new tier items. Manual sync is fragile. Future improvement: the PLAN VP becomes a
      thin wrapper that delegates to T-1.5's RoadmapDocument schema check rather than re-asserting
      structural properties inline. Not blocking for this session; address in the T-1.5 implementation
      plan.
  - id: KG.13
    gap: Test Impact Analysis + result caching deferred to executor scale
    notes: |
      Coverage-based Test Impact Analysis (run only tests whose input closure intersects the diff; e.g.
      pytest-testmon) + content-addressed result caching is the scalability mechanism that lets "every
      verification stays confirmed" hold without re-running everything. It is NOT a pre-executor blocker:
      T4.1 sets executor concurrency = 1 and at ~100 recs/month a cached-full suite is tolerable. It becomes
      load-bearing when T4.4 raises concurrency above 1. Preconditions: T3.6 hermeticity (caching requires
      hermetic tests) AND the T3.1 graduation registry's per-check guard-target / input-closure metadata (TIA
      selects by input closure, which only the registry records). Cross-references Decision 73's existing Known
      Gap note that `pytest --picked` may upgrade to pytest-testmon. File a tier_item (T4.4-era) when executor
      concurrency rises.

      T3.6 hermeticity precondition [SATISFIED 2026-06-25: c1-c4 met via PLAN-t3-6-hermeticity-closeout; c5 rehomed to T1.6]; remaining precondition is the T3.1 graduation registry.

      Near-term wall-clock wins are DISTINCT from this deferred TIA/caching gap and are available now (no
      executor-scale / hermeticity precondition): the big structural win is T1.6 (live-reader DQ leaves the
      blocking gate); the lighter levers are dependency slimming +
      parallel execution (pytest-xdist) + validate_requirements hygiene. Per Decision 80 the build-orchestrator
      / TIA revisit trigger is a recurring measured `_FAST_TIER_BUDGET_SECONDS` breach (the ~30-min run is one);
      the near-term levers are filed as recs, not roadmap items (tactical, not direction).
  - id: KG.14
    gap: Multi-product enforcement substrate is unbuilt (project_id mechanism, egress gate, COALESCE gate, day-job interlock, rollback/freeze).
    notes: |
      The platform can serve N products conceptually (one DuckLake ops data plane keyed by project_id)
      but the enforcement machinery is not built. Unbuilt components: project_id as a ratified
      discriminator in the ops schema (OD-1); egress gate preventing cross-product data leakage (OD-2);
      COALESCE gate at T0.15; day-job onboarding interlock; rollback/freeze path (OD-4).

      Tracked in CD.32 and the Build-state reality section of docs/INTENT-multi-product-platform.md.
      Do not treat as active roadmap work; gated by OD-1/OD-2 ratification + the unbuilt project_id
      stack (T0.12a / T0.7a-c / T0.15 / config/project_registry.yaml).
