    intent: |
      Decision 173 makes tier MEMBERSHIP configuration rather than architecture; this item is where the
      consequence the operator named -- providers become a VARIABLE whose performance is measured --
      gets an owner. It builds the measurement surface, not a swap: per-call telemetry dimensioned by
      provider and model so two tier-1 candidates can be compared on one workload, plus the comparative
      record naming the current selection for each ROLE and the evidence behind it. It SELECTS no
      provider and changes no tier: a selection made against this item's evidence is a contract edit
      under Decision 173 clause 2 and needs no Decision amendment. c5 additionally carries the
      transport-side config-resolution requirement that Decision 173 clause 2 places on T4.2's
      LiteLLM transport -- it is homed here, in structured form, because T4.2's own exit_criteria are
      bare strings.
    depends_on: [T4.2]
    files_in_scope: []
    exit_criteria:
      - id: c1
        text: >-
          Every executor inference call emits provider AND model_id as telemetry dimensions alongside
          tokens, cost and latency, so a per-provider comparison is a query rather than a re-run. A
          record that cannot separate the provider dimension measures nothing about provider choice
        status: open
      - id: c2
        text: >-
          The comparative record scores at least two candidate primary-tier providers on the SAME
