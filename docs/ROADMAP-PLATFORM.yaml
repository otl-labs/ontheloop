    strategic: false
    status: deferred_post_mvp
    note: "Owned by PLAN-cli-persona-backend (a separate plan); created as a placeholder so the clause-4 forward reference resolves. Authored by PLAN-cli-persona-backend (Decision 206); sized at about one L or three to four M plans -- adapter; conformance suite; usage window and credential preflight; packaging and docs."
