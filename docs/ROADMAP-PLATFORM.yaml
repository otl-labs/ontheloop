  - id: T2.51
    tier: T2
    name: Private variable-cost visibility dashboard (Cloudflare-Access front, in-AWS data)
    intent: |
      A private, unified view of variable operational vendor spend (AWS + Anthropic API + DeepSeek
      API + Neon) so the platform's cost structure stays legible as it scales. Confidential cost
      data RESTS in the personal AWS account (private S3); the dashboard is a read-only PROJECTION.
      The bookmarkable experience (open a private Access-gated subdomain of onthelooplabs.com ->
      authenticate -> view) uses Cloudflare Access ONLY for auth: an in-AWS Lambda verifies the Access token and mints a
      <=5-min presigned GET (its own execution-role creds), and the browser loads the artifact
      DIRECTLY from S3 -- no AWS credential leaves AWS and the payload never transits Cloudflare
      (the CD.41 invariant). The public onthelooplabs.com / Semanto surface stays public and never
      carries cost figures (Decisions 73/83/101). Complements the monthly cost_reconciliation alarm
      (answers "did a threshold trip?"); this answers "where is variable spend going, and in what
      proportion, over time?". Subscription out of scope (variable-only) -> all USD, no currency
      conversion. Design rationale + architecture: docs/plans/reports/REPORT-cost-visibility-dashboard.md.
    depends_on: []
    files_in_scope:
      - terraform/personal/cost_read_role.tf    # new -- read-only ce:GetCostAndUsage IAM role (gated apply)
      - terraform/personal/cost_dashboard_auth.tf    # new -- in-AWS presign Lambda (Access-JWT verify) + private subdomain wiring
      - scripts/cost/    # new subpackage -- daily pull + snapshot (grain: one row per vendor per day) + render projection
      - config/agent/cost_sources.yaml    # new -- provider/source registry (list-price refs only; no measured actuals)
      - .github/workflows/cost-dashboard.yml    # new -- daily scheduler (or a Lambda + EventBridge equivalent)
      - scripts/cost_reconciliation.py    # touch -- optional AWS auto-pull via the new role (retires manual invoice export)
    exit_criteria:
      - id: c1
        text: >-
          A net-new read-only AWS cost role granting ce:GetCostAndUsage is provisioned in
          terraform/personal (gated apply; IAM-sensitive, Decision 98/144) and can read the
          month-to-date bill by service; no measured cost figure is ever committed to the repo
          (Decisions 73/83/101). A fresh source Decision records the programmatic AWS-infra Cost
          Explorer read (a new source choice, NOT a CD.28 reversal). Open question at build: whether
          the ce: role falls under the Decision 129/144 read-coverage verifier.
        status: open
      - id: c2
        text: >-
          A scheduled daily job pulls AWS Cost Explorer plus the per-vendor billing/usage APIs
          (Anthropic usage API; DeepSeek; Neon via its billing/management HTTPS API, NEVER a
          DuckLake catalog query -- Decision 88) into a GOVERNED DUCKLAKE TABLE at grain one row per
          vendor per cost-date per as-of/pull-date (append-only, event-time-partitioned; CE
          current-month figures are provisional and get restated). [Amended by
          PLAN-evidence-dashboarding-poc: the original text specified a bespoke private-S3 snapshot
          file. DuckLake IS Parquet-in-S3 with catalog metadata in Neon, so the stated grain was
          already DuckLake-shaped -- this is a routing amendment, not a re-scope. Writes transit
          ducklake_writer; reads transit ducklake_reader named verbs, so the same governed dataset
          serves agents and any human-facing projection (CD.42(a)/(c)). Confidential figures still
          rest only in the personal AWS account and are never committed.] A stale/absent snapshot or
          an unparseable source fails loud / files a rec, never silently shows stale-as-current
          (Decision 55/62)
        status: open
      - id: c3
        text: >-
          A rendered static projection (spend by vendor AND its trend over time), sourced from c2's
          governed table via ducklake_reader named verbs (never caller SQL, never direct catalog or
          object-store access -- CD.42(c)), is served via the CD.41 pattern: Cloudflare Access
          authenticates a private Access-gated subdomain of onthelooplabs.com; an in-AWS Lambda
          verifies the Access JWT (JWKS/iss/aud/exp) and mints a <=5-min single-object presigned GET
          (a TTL-bounded bearer capability -- S3 does not check the JWT). The browser loads directly
          from S3. No AWS credential leaves AWS; the payload never transits Cloudflare (only the
          short-lived capability pointer does, once). The renderer is unconstrained (static
          pre-rendered is the MVP instance, not a pattern constraint). [Amended by
          PLAN-evidence-dashboarding-poc: the renderer CHOICE and the unresolved multi-file-static-
          site vs CD.41-invariant-(b) serving question (REPORT-cost-visibility-dashboard section
          5.4) are REHOMED to tier item T2.53 and are no longer decided by this item. If T2.53
          rejects a multi-file renderer, this criterion is satisfiable by the single-object MVP
          instance as originally written.]
        status: open
      - id: c4
        text: >-
          CD.41 (the invariant-fenced private-dashboard hosting pattern) is ratified as a Decision
          before the dashboard is served, with its discipline points and reversal conditions
        status: open
      - id: c5
        text: >-
          The existing monthly cost_reconciliation job auto-pulls the AWS leg via the new cost-read
          role (assumable by its OIDC principal, or ce: added to agent-platform-github-ci-branch),
          retiring the manual cost-invoices/<month>.json AWS export
        status: open
    related_candidate_decisions: [CD.28, CD.41]
    related_decisions: [55, 67, 73, 83, 88, 93, 98, 100, 101, 111, 144]
    effort: L
    strategic: false    # freeze override (AGENTS.md / CD.17): author as atomic IMPLEMENTATION plan(s) at reactivation
    status: deferred_post_mvp
    progress_note: "Scoped deferred_post_mvp (Decision 93) via PLAN-cost-visibility-dashboard / REPORT-cost-visibility-dashboard (2b architecture; Fable advice-consulted). Value scales with spend; today variable spend is noise vs the (out-of-scope) fixed subscription -- the two future cost 'whales' are inference (activity-driven, near-term) and S3 storage (data-driven, long-term). Activation trigger: the frozen executor (Decision 67) unfreezes and LLM-API spend is non-trivial, OR the monthly cost_reconciliation begins tripping thresholds regularly. Precedes the Semanto marketing surface (ROADMAP-SEMANTO S1.x) in priority but has NO dependency on it (private-AWS + Cloudflare-Access vs public-Cloudflare-Pages surfaces). Transitive active dependents: none. Reactivate by restoring status -> not_started; ratify CD.41 and re-ground the stale anthropic_pool_size_usd baseline against the owner's current subscription tier at that time. AMENDED 2026-07-26 (PLAN-evidence-dashboarding-poc, REPORT-evidence-dashboarding-poc): c2 routes the cost snapshot into a GOVERNED DUCKLAKE TABLE served by named verbs rather than a bespoke private-S3 snapshot file (routing amendment, not a re-scope -- DuckLake is Parquet-in-S3 and the stated grain was already DuckLake-shaped), so one governed dataset serves agents and any human projection; c3's RENDERER CHOICE and the unresolved multi-file-static-site vs CD.41-invariant-(b) serving question (REPORT-cost-visibility-dashboard section 5.4) are REHOMED to T2.53. All five criteria were status:open at amendment time, so no met_by provenance was re-pointed (Decision 136/CD.39)."

  - id: T2.52
    tier: T2
    name: Analytical/semantic layer -- aggregate named-verb class + derived-asset materialization mode
    intent: |
      The prerequisite that must exist before any human-facing analytical presentation layer is
      worth testing. Two halves:

      (1) A NET-NEW CLASS of analytical-aggregate `named_read` verbs. Today's NAMED_READS registry
      (src/common/ducklake_scd2_schema.py, NAMED_READS_VERSION 3) is 12 verbs over 3 tables
      (ops_recommendations, ops_decisions, ops_priority_queue). Three of them DO use aggregate SQL
      (count_by_status GROUP BY status; forward_fix_recursion GROUP BY file HAVING COUNT(*) >= 3;
      decisions_max_updated max(...)) -- but all three are single-table OPERATIONAL COUNTERS feeding
      preflight gauges, with no time bucketing, no dimensional breakdown, no cross-table join, no
      actual-vs-estimated classification and no versioned analytical response schema. What is absent
      is the ANALYTICAL GRAIN, not aggregate SQL -- so this item EXTENDS a proven registry pattern
      rather than inventing one. Aggregate verbs own business aggregation,
      join semantics, dataset grain, actual-vs-estimated classification, authorized columns,
      date/cardinality bounds, stable ordering, and a versioned response schema, so that agents and
      any human projection consume the SAME governed dataset (CD.42(a)). Named verbs are SERVING
      LEAVES: a verb never invokes another verb (that would compound Lambda latency and failure,
      obscure lineage, complicate backfills, and prevent atomic publication).

      (2) A REBUILDABLE-DERIVED-ASSET write mode in docs/contracts/data-modeling-standard.yaml,
      which today defines scd2, append_only, and control (T2.26 control-table-class-and-counter-
      conformance) and has no mode for derived aggregates. Derived
      aggregates must NOT be force-fitted into SCD2 (they are not mutable entities): admissible
      shapes are append-only aggregate snapshots, incrementally replaced time partitions, versioned
      materialization runs with a current pointer, or complete atomic rebuilds. A logical asset must
      be able to move from a virtual query to a persisted materialization WITHOUT changing its
      named-verb contract or any downstream consumer.

      Asset-oriented, not verb-oriented: the DAG connects data assets (source facts -> canonical
      domain assets -> reusable aggregates -> semantic projections) and named verbs sit at the edge
      as serving leaves. Design rationale: docs/plans/reports/REPORT-evidence-dashboarding-poc.md
      section 9.
    depends_on: []
    files_in_scope:
      - docs/contracts/data-modeling-standard.yaml    # touch -- add the rebuildable-derived-asset write mode
      - docs/contracts/storage-substrate.yaml    # touch -- per-asset substrate/grain/write-mode entries
      - src/common/ducklake_scd2_schema.py    # touch -- analytical-aggregate NamedRead entries (registry version bump)
      - src/lambdas/ducklake_reader/handler.py    # touch -- serve the new verb class (no new action; named_read dispatch)
      - docs/contracts/ducklake_reader.yaml    # touch -- document the aggregate verb surface
    exit_criteria:
      - id: c1
        text: >-
          docs/contracts/data-modeling-standard.yaml declares a rebuildable-derived-asset write mode
          alongside scd2/append_only/control (control added by T2.26 control-table-class-and-
          counter-conformance, 2026-09-13 -- a fourth, unrelated write mode: writer-internal
          bookkeeping, never a derived/rebuildable aggregate), enumerating the admissible
          materialization shapes (append-only aggregate snapshot, incrementally replaced time
          partition, versioned run with a current pointer, complete atomic rebuild) and, per asset,
          the required declarations: asset id, one-row-per grain, input assets, output schema
          contract, virtual-vs-persisted materialization, incremental watermark and lookback,
          late-arrival/correction behaviour, partitioning, backfill behaviour, atomic publication
          method, freshness expectation, DQ checks, and code+input lineage
        status: open
      - id: c2
        text: >-
          The new write mode opens NO unpartitioned-table path -- every derived asset declares a
          partition column, and any per-table exception is named explicitly rather than expressed as
          a loosened uniform rule (Decision 137 / CD.9, which is absolute)
        status: open
      - id: c3
        text: >-
          At least one analytical-aggregate verb is registered in NAMED_READS and served by
          ducklake_reader over a real governed table, with a declared response schema, bounded
          results, stable ordering, and the registry_version stamp usable for build-time
          compatibility checking. The verb is a SERVING LEAF: it invokes no other verb
        status: open
      - id: c7
        text: >-
          The named_read response-size ceiling for ANALYTICAL EXTRACTS is measured (only 2 of the 12
          current verbs -- open_recs, recs_by_title_prefix -- are paginable, and named_read returns
          JSON rows over a Lambda Function URL), and the verb design accommodates it: either the
          analytical grain fits within the ceiling, or a paginated/streamed BULK-EXTRACT verb class
          is designed alongside the aggregate verbs. Measure before designing -- a build-time-
          materializing consumer pulls whole datasets, and if the boundary cannot physically carry
          them then the named-verbs-only invariant (CD.42(c)) is unsatisfiable for that consumer.
          Weigh the result against the Decision 88 egress budget
        status: open
      - id: c4
        text: >-
          A logical asset is demonstrated to move from a virtual query to a persisted
          materialization WITHOUT any change to its named-verb response contract (the property that
          makes downstream consumers, human or agent, insensitive to materialization decisions)
        status: open
      - id: c5
        text: >-
          Aggregate-verb serving honours the Decision 88 Neon egress budget -- warm-connection reuse
          and no re-query of data already held in the local read cache. A per-build or per-page full
          catalog read is the amplification shape that produced the 2026-06-15 free-tier breach and
          is explicitly out of bounds
        status: open
      - id: c6
        text: >-
          docs/contracts/ducklake_reader.yaml documents the aggregate verb surface, and the verbs are
          reachable via the existing `named_read` action -- no new caller-SQL path is introduced and
          `query_ops` gains no new tenant (Decision 84 I-3 retains it for the DQ harness only and
          marks it for restriction/retirement)
        status: open
    related_candidate_decisions: [CD.9, CD.42]
    related_decisions: [78, 81, 84, 86, 87, 88, 93, 96, 97, 118, 127, 137, 141]
    effort: L
    strategic: false    # freeze override (AGENTS.md / CD.17): author as atomic IMPLEMENTATION plan(s) at reactivation
    status: deferred_post_mvp
    progress_note: "Scoped deferred_post_mvp (Decision 93 conscious-deferral rule) via PLAN-evidence-dashboarding-poc / REPORT-evidence-dashboarding-poc. DEFERRAL RATIONALE: an analytical aggregate layer serves human-facing reporting and cross-table analysis, both outside the rec -> implement -> validate -> merge -> deploy -> observe -> next rec loop that defines the Platform-MVP boundary; and no consumer exists for it today -- cost data is unbuilt (T2.51 deferred), telemetry is unmigrated (T2.36 / Decision 84 Phase 4), and data-quality coverage is 0 tables / 0 checks. Building it now is the build-ahead-of-need shape Decision 87 consciously refused. ACTIVATION TRIGGER: a governed dataset exists that a human or an analysis agent actually needs to read in aggregate -- concretely T2.51 reactivates, OR telemetry lands on DuckLake (T2.36), OR data-quality coverage becomes non-zero. Triggered by a real tenant, never scheduled ahead of one. Note docs/contracts/data-modeling-standard.yaml carries no top-level contract:/class: key, so validate_contract_drift skips it and the CD.25 pre-codegen ratification ritual (Decision 118) does NOT apply to the write-mode amendment. Transitive active dependents: none (T2.53 is itself deferred). Reactivate by restoring status -> not_started."

  - id: T2.53
    tier: T2
    name: Human-facing analytical presentation layer -- bounded three-way proof of concept (adopt/constrain/reject)
    intent: |
      Test whether a code-defined, Git-governed presentation layer -- backed EXCLUSIVELY by
      versioned ducklake_reader named datasets -- can serve as this repository's standard
      agent-authored, human-facing analytical surface WITHOUT introducing a second semantic
      authority or disproportionate frontend infrastructure. Bounded proof of concept, NOT
      platform-wide adoption; its output is an adopt / constrain / reject verdict against criteria
      committed BEFORE the experiment runs (REPORT-evidence-dashboarding-poc section 11).

      THREE-WAY, not a referendum on one tool: Evidence (evidence.dev) vs Astro-with-a-charting-
      library vs Observable Framework. Evaluating Evidence alone cannot answer the question that
      actually matters -- whether the data-aware component library is worth a second Node stack,
      given Decision 101(e) already ratifies Astro + Starlight for the public marketing surface.

      DEPENDS ON T2.52 EVEN THOUGH IT USES NO LIVE DATA. The agent development loop is
      fixture-driven for determinism and to avoid credentials and egress -- but the fixtures are
