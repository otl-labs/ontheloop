  - id: T3.9
    tier: T3
    name: Post-merge recommendation reconciliation
    intent: |
      The continuous-hygiene complement to the T3.8 relevance gate: the gate prevents STARTING stale work,
      reconciliation prevents stale work ACCUMULATING after sibling recs land. Per CD.36, after a PR merges
      and main full-validate passes, re-evaluate open recs whose target overlaps the changed artefacts:
      deterministically close recs whose `acceptance` now passes (proof recorded), and move semantic
      supersession / obsolete-target findings to close_proposed with evidence. ci_rca recs are never
      auto-closed without their specific failure fingerprint resolved (Decision 72). MVP overlap signal is
      FILE-LEVEL (the rec `file` field intersected with the merge's changed files) -- the cheap signal that
      exists today; the richer semantic-lock overlap (T4.8) is a post-MVP enhancement, cross-referenced not
      depended-on, so this item does not block on deferred parallel-execution machinery. Example: rec-A
      lands a schema change that incidentally satisfies rec-B's acceptance; reconciliation sees rec-B's
      acceptance now passes and closes it with proof, with no human noticing.
    depends_on: [T3.8]
    files_in_scope:
      - .github/workflows/post-merge-reconcile.yml    # new -- runs after main full-validate PASS
      - scripts/rec_reconcile.py    # new -- maps the merge's changed files to overlapping open recs, re-runs relevance
      - scripts/rec_relevance.py    # reused evaluator (T3.8)
      - scripts/ops_data_portal.py
    exit_criteria:
      - "Post-merge reconciliation runs after main full-validate PASS and maps the merge's changed files to overlapping open recs by the rec `file` field (file-level overlap is the MVP signal)"
      - "Only open recs with overlapping targets are re-checked (not the whole queue); surfacing serves the warmed read-cache / a named verb, never a per-run warehouse re-fetch (Decision 88)"
      - "Deterministically-satisfied recs are closed with a recorded closure proof; semantic supersession / obsolete findings become close_proposed with evidence (CD.36)"
      - "ci_rca recs are not auto-closed unless their specific failure fingerprint is resolved (Decision 72)"
      - "Semantic-lock-based overlap (T4.8) is documented as a post-MVP enhancement to the file-level signal (cross-reference, not a dependency)"
      - "Unit tests cover overlap mapping, deterministic close, close_proposed, and the ci_rca exclusion"
    related_candidate_decisions: [CD.36]
    effort: M
    strategic: false
    status: not_started
    note: "MVP (not deferred) per operator scoping 2026-06-24. Decoupled from T4.8 (semantic locks, deferred_post_mvp): MVP reconciliation uses file-level overlap (the signal available today); semantic-lock overlap is an additive post-MVP enhancement. depends_on T3.8 only -- no live->deferred edge (Decision 93). COMPLETION is gated on CD.36 (pending), same path as T3.8."
