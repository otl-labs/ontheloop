      - "The executor's workspace backing store for prepare_workspace's workspace_uri output is selected by CD.43's ratification alongside the CD.27 layer-2 spike, not implied by prepare_workspace's implementation -- against CD.43's criteria W1 substrate portability, W2 foreclosure disclosure, W3 recomputed standing cost, W4 egress-profile validity, W5 re-materialization cost, W6 scale basis, W7 coverage-case completeness, and W8 managed-primitive preference"
