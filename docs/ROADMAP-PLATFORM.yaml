  - id: T4.1
    tier: T4
    name: Executor Step Functions state machine + per-step Lambda scaffolding + IAM
    intent: |
      Per CD.27 as amended by Decision 185, the executor loop's DEFINITION is repo-owned (T4.19: a
      committed ASL-subset document rendered from a typed builder) and Step Functions is its
      cloud-tier HOST. T4.1 lands that host: it renders and deploys the committed ASL through the
      terraform/** provision intent (Decision 126; aws_sfn_state_machine is unclassified by the
      deterministic guard until T4.2 c7 lands), the deterministic-glue Lambdas (pick_rec,
      prepare_workspace, critique_gate aggregator, file_pr, emit_telemetry) through the governed
      code-deploy channel, per-Lambda IAM execution roles, observability wiring, and the ECS Run
      Task escape-hatch integration. The deployed execution must emit the same transition trace the
      T4.20 oracle produces for the fixture. Agent personas (T4.2) and the T4.15 spike consume this
      host.

      State-machine shape (per CD.27 boundary diagram):
        - pick_rec [Lambda]                          : poll priority queue; ADMISSION PREDICATE gates the return -- admit a rec only when its T3.8 relevance verdict == relevant (CD.36 / Decision 103), automatable == true, and risk is within the current T4.4 autonomy-gate ceiling (Decision 92 ratchet), AND its targets do NOT match Decision 117 boundary_patterns (config/agent/executor/capabilities.yaml); a refused pick emits a typed telemetry event and a boundary_patterns hit re-routes the rec to the human path (Decision 55), never auto-executed; returns rec_id + branch_slug
        - prepare_workspace [Lambda]                 : clone repo, create agent/{slug} branch, set up worktree, return workspace_uri
        - plan_agent [resumable persona (CD.27 P1/P2/P3), T4.2]        : iterative read-code -> LLM -> tool-use -> commit the plan file in the workspace (no push; the persona holds no GitHub credential). The plan artifact is the git file at the plan PR's head SHA (Decision 205 clause 5) -- a plan document in S3 stays considered-and-rejected, and the ops_execution_plans row is a projection, never the artifact. The node returns IDENTIFIERS ONLY -- (rec_id, PR number, head SHA); no payload crosses the state machine, and an LLM-authored plan summary is a payload, not an identifier
        - file_plan_pr [Lambda]                      : push the agent branch and open an idempotent DRAFT plan PR under the executor App (T4.21 c3), touching only docs/plans/PLAN-<slug>.yaml (T4.21 c9)
        - await_scout [Lambda, waitForTaskToken]     : await_verdict on the decision-scout Actions verdict job (Decision 205 clause 1 -- plan PR opened as draft); flags route back to plan_agent before mark_plan_ready
        - mark_plan_ready [Lambda]                   : flip the plan PR to ready for review, which triggers plan-critique
        - await_critique [Lambda, waitForTaskToken]  : await_verdict on the plan-critique Actions verdict job; every revision commit re-triggers it
        - critique_gate [Lambda]                     : read the SHA-bound critique check run through the Checks API (T4.9a c7); REVISE routes back to plan_agent, whose revision commit file_plan_pr pushes to the same PR, and the loop re-enters await_critique (the scout does not re-run on a ready PR); PROCEED forwards
        - await_plan_verdict [Lambda, waitForTaskToken] : await the plan PR's CI --pre verdict callback (T4.9a) on the same head SHA the critique attested
        - merge_plan_pr [Lambda]                     : squash-merge by SHA (T4.9a c8) once CI --pre and the critique verdict are green on the same head SHA; the plan merge writes no work-item edges
        - implement_agent [resumable persona (CD.27 P1/P2/P3), T4.2]   : on an implementation branch cut from main at the merged plan SHA (the workspace re-bases onto it after merge_plan_pr): iterative read-plan -> edit-files -> run-tests -> commit in the workspace (no push)
        - file_pr [Lambda]                           : push the implementation branch and open an idempotent DRAFT implementation PR (adding no plan file) under the executor App
        - await_review [Lambda, waitForTaskToken]    : await_verdict on the code-review Actions verdict job (a PR adding no plan file, opened as draft); REVISE routes back to implement_agent
        - mark_ready [Lambda]                        : flip the implementation PR to ready for review
        - await_verdict [Lambda, waitForTaskToken]   : wait on the GitHub Actions verdict callback (T4.9a); Step Functions stores correlation ids incl. head SHA
        - merge [Lambda]                             : callback-gated squash-merge by SHA (T4.9a) -- PRE_PASS permits merge only when the callback head SHA equals the PR head; this merge consumes the exact merged plan and writes its declared edges (Decision 197)
        - deploy_dispatch [Lambda, waitForTaskToken]  : dispatch merged-change application to the CD.35 / Decision 92 GitHub-Actions gated-apply pipeline and wait on its server-side convergence-record verdict, exactly as the verify leg waits on a CI verdict (CD.38 sole-runner authority; the executor holds NO apply authority and never runs terraform apply in-cloud). PRECONDITION for running this leg unattended: rec-2523 guard-BLOCK red-convergence-record deadlock (a red record clearable by neither automated path, requiring an out-of-band admin apply) must have a designed exception path -- fixing that deadlock stays with rec-2523, out of scope here
        - emit_telemetry [Lambda]                    : final session-close emission
        - ESCAPE [ECS Run Task synchronous integration] : for deterministic steps that exceed 15 min (e.g. full pytest, large data migration); terraform apply is NOT an in-executor escape-hatch task -- see deploy_dispatch (dispatched to the CD.35 / Decision 92 GitHub-Actions gated-apply pipeline, per CD.38)

      [Annotation 2026-10-19, Decision 229 -- personas ship first to an interim coordinator, and this host later becomes the persona_compute_host port's second caller; the T4.15 halves deferred here are the DEFERRED HALVES criterion, and the file_pr Lambda wraps T4.21 c11's push verb. await_scout re-enters when the plan's scout-input fingerprint changes (T4.32 c4); a refinement that leaves it unchanged does not.]

