      trajectory parity; the conformance suite is the anti-drift gate. codex_cli stays reserved
      until its OpenAI-terms start gate passes. deferred_post_mvp -- a free-tier feature, not this
      repository's MVP (Decision 93). c1, c2 and c4 are discharged by PLAN-cli-persona-backend; c3
      binds the adapter.
