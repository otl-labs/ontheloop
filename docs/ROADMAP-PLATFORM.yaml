  - id: T3.7
    tier: T3
    name: Validation-suite meta-validation (mutation testing + deterministic dead-test detection + diff-coverage ratchet)
    intent: |
      Keep the validation suite's PURPOSE honest -- it must guard functionality, not merely exist (CD.29).
      Three mechanisms:

        1. Scheduled mutation testing (mutmut), ALARM-NOT-GATE (CD.12). Runs on a GitHub Actions schedule, NOT a
           Lambda -- avoids the Decision 67 / CD.16 Lambda-deploy freeze and touches no Lambda-packaged file.
           Aimed NARROWLY: when a verification graduates (T3.1 registry), mutate only the lines that check claims
           to guard and confirm it kills the mutants; a graduated check that kills nothing on-target is a
           tautology and is flagged. Surviving mutants file a rec with source='mutation_survivor' (Decision 61 --
           via the source field; no new findings table). An equivalent-mutant allowlist (governed file) suppresses
           known-unkillable mutants so the scheduled run files recs only on NEW survivors (no resurrection-loop
           noise). Distinct from the Session E DQ-freshness routine Decision 62 retired (cron agent ->
           EC2 -> commit dq-latest.json -> auto-merge): mutation here is GitHub-Actions-scheduled,
           advisory, and not a merge gate, so it is not that routine. (Separately, Decision 62's
           no-separate-routine conclusion for LIVE-READER DQ is being revisited under T1.6 -- its
           cheap-DQ-on-the-credentialed-gate premise no longer holds; that revisit does not bear on
           mutation testing.)

        2. Deterministic dead/redundant-test detection (NEVER an LLM scan -- expensive and non-deterministic for a
           deterministic job). Layered, cheapest-first: (a) AST assertion-free lint (a test with no assert /
           pytest.raises / mock.assert_* / self.assert* asserts nothing) -- cheap enough to be a BLOCKING
           validate.py check; (b) registry orphan detection -- a graduated check whose recorded guard target no
           longer exists in the tree is flagged (deterministic by construction once the T3.1 registry records guard
           targets); (c) coverage-uniqueness -- a test contributing zero unique covered lines is a redundancy
           candidate; (d) mutation-on-target -- the rigorous confirmation, reserved for flagged candidates.
           Detection files recs; RETIREMENT follows the CD.12 mark-then-drop discipline (mark deprecated in the
           registry; a follow-on plan deletes), never auto-delete -- deleting a load-bearing test on a misjudgement
           is unacceptable in a human-out-of-loop system.
           [Amendment 2026-10-23, Decision 235: at the lane's earned rung an evidence-gated drop of a shadowed check
           is admitted (c8); below that rung this stands.]

        3. Diff-line-coverage ratchet (CD.30): replace the per-changed-file 100% floor (test_coverage_checker.py
           is already diff-scoped) with require-coverage-on-changed-LINES + upward-only global ratchet, enforced
           in validate.py; retarget scripts/test_coverage_checker.py.

           [VTS-07 correction, 2026-07-25] The "already diff-scoped" premise above describes intent,
           not CI reality: the gate is structurally inert in every CI context today --
           full_sequence-only (Decision 124) so its merge-base diff against origin/main is empty on
           every origin/main checkout, and its per-file leg additionally no-opped via a slash-form
           --cov argument that silently skipped coverage collection instead of measuring anything
           (rec-2791 cluster; fixed as VTS-07's buildable half). Safe sequencing: land the
           slash->dotted --cov fix first, then this CD.30 diff-line ratchet, then promote to --pre --
           never reorder (promoting the current per-file 100%-floor form straight to --pre would be
           a breaking strictness jump). map_source_to_test also relocates out of this coverage-named
           module at the CD.30 rewrite (VTS-21 deferred half, Decisions 104/131) -- not performed
           here. Annotation only per Decision 93 -- this mechanism stays deferred_post_mvp.

      Freeze override (AGENTS.md): the three mechanisms decompose into separate atomic IMPLEMENTATION plans
      (mutation runner, dead-test detector, diff-coverage ratchet + the meta-validation workflow) at /implement
      time -- effort M is the umbrella estimate, not a single-plan commitment.
    depends_on: [T3.1]
    files_in_scope:
      - .github/workflows/meta-validation.yml    # new -- scheduled mutation + dead-test scan (GH Actions, not Lambda)
      - scripts/mutation_runner.py    # new -- mutmut wrapper; on-target scoping; equivalent-mutant allowlist; files recs
      - scripts/dead_test_detector.py    # new -- AST assertion-free + coverage-uniqueness + registry-orphan + mutation-on-target
      - scripts/test_coverage_checker.py    # retarget from 100% floor to diff-coverage + ratchet (CD.30)
      - scripts/checks/verification/validate_red_case_floor.py    # c2's assertion-free predicate joins its existing walk (rec-3719); checks register via manifests, never scripts/validate.py (Decision 169)
      - config/agent/mutation_allowlist.yaml    # new -- governed equivalent-mutant allowlist
    exit_criteria:
      - id: c1
        text: "Scheduled GH Actions workflow runs mutation testing on graduated-check targets and files recs with source='mutation_survivor' on NEW surviving mutants only (allowlist suppresses known-equivalent)"
        status: open
      - id: c2
        text: "AST assertion-free lint runs in validate.py and blocks a test function that contains no assertion. Adjacency (rec-3719): validate_red_case_floor already walks every mirror test's AST for a DISCRIMINATION predicate (an assertion expecting a failing outcome); this SHAPE predicate (any assertion at all) is satisfied by 'assert not failed', so extend that check's existing walk with one predicate rather than adding a second scanner."
        status: open
      - id: c3
        text: "Registry orphan detection flags graduated checks whose guard target no longer exists; coverage-uniqueness flags zero-unique-coverage tests; both file recs"
        status: open
      - id: c4
        text: "Retirement path is mark-then-drop: flagged checks are marked deprecated in the registry, never auto-deleted; a follow-on plan performs deletion (CD.12 discipline) [Amendment 2026-10-23, Decision 235: at the lane's earned rung an evidence-gated drop of a shadowed check needs no follow-on plan (c8); below that rung this criterion stands unchanged.]"
        status: open
      - id: c5
        text: "Diff-line-coverage ratchet enforced in validate.py: changed lines require coverage + global coverage non-regression; the per-changed-file 100% floor in test_coverage_checker.py is retargeted to diff-line-coverage + ratchet (CD.30)"
        status: open
      - id: c6
        text: "Workflow touches no Lambda-packaged file (Decision 67 / CD.16 not triggered); distinguished in a code comment from the Session E DQ-freshness routine Decision 62 retired (GH-Actions-scheduled + advisory + not a merge gate, so not that routine; the separate live-reader-DQ revisit of 62 is owned by T1.6)"
        status: open
      - id: c7
        text: "Forward work (audit 9d25d918 CSF-07, high): post-admission decay of a graduated check is detected on a bounded clock -- a graduated shard whose guard target is deleted, or whose check survives every on-target mutant, is flagged within one schedule period with no edit to the shard. Method: discharged by c1's scheduled mutation leg and c3's registry orphan detection; CD.29 mutation plus CD.12 mark-then-drop stay the adequacy mechanism, and a periodic PASS/FAIL standing run is not the remedy (it cannot see permanent-TRUE decay). Evidence: the observed 14-day and 32-day admission-to-retirement intervals are the residual this bounds."
        status: open
      - id: c8
        text: "Decision 235 removal rung (forward work): the scheduled meta-validation run also writes a redundancy evidence record per shadowed check -- mutation-on-target subsumption by a retained blocking check, computed by deterministic code from paths in Decision 117 boundary_patterns at the base ref, never an LLM; an empty kill set is never evidence, and a target mutation does not reach stays at the per-change human gate while this item's per-hunk or per-key revert operator at the base ref (from the covered_changed revert in run_verifier_differential) is unbuilt -- and a shadowed check is dropped only with that record and a live, examined shadow window at the lane's earned rung; a shadowed check that fails where every blocking check passed is restored and the lane returns to read_all."
        status: open
    related_candidate_decisions: [CD.29, CD.30]
    related_decisions: [235]
    effort: M
    strategic: false
    status: deferred_post_mvp
    progress_note: "Parked deferred_post_mvp (Decision 93; MVP-triage audit 7d57a0d / RMAP-21): Validation meta-validation is hardening. Compensating controls for its failure class already landed: T1.13 c8/c10/c11 vacuous-pass detection spine + the main-validate canary/forward-fix posture (Decision 73). Transitive active dependents: none. Deferral valid. Reactivate as autonomy scales merge volume."

