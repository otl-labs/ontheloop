    notes: |
      No hosted product is sequenced in this repository. Prospective products (reaper-tools,
      dbt-daywork) would own their own product roadmaps, in their own repositories, when real.

      The platform/product boundary -- platform-tier concerns here, product sequencing elsewhere --
      is the boundary Decision 78 (CD.31) references; the platform's own operational tables are
      DuckLake end to end, and a product's storage choices are that product's to make.

      Enacts OD-5 from the multi-product-platform exploratory record. See also CD.32 (multi-product
      platform topology candidate decision) and KG.14 (multi-product enforcement substrate unbuilt).
