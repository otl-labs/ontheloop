          output or the Decision 111 README portal) carries the substrate-by-credential table, that no GitHub
          App is needed, the setup-token expiry and rotation, and the usage-window caveat -- unattended queue
          use is not ordinary, individual usage and is the end user's account risk
        status: open
        blocked_by: [{ref: T4.24, until: complete}]
      - id: c14
        text: >-
          codex_cli leaves RESERVED only after an OpenAI-terms equivalency check is recorded as passed; a
          failed check drops it (Decision 206 reversal condition openai-terms-fail)
        status: open
