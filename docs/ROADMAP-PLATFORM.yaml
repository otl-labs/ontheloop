# docs/ROADMAP-PLATFORM.yaml
#
# Canonical platform roadmap. Agent-first artefact. Consumed by
# scripts/session/preflight.py (platform_roadmap state computation),
# .claude/skills/planning/SKILL.md (eligibility check at intent clarification),
# .claude/commands/plan.md (orientation surface),
# scripts/validate.py (RoadmapDocument Pydantic schema check).
# Items carrying archived: true are stubs; their full records live in docs/ROADMAP-PLATFORM-ARCHIVE.yaml.
#
# This file is the sole source of truth for platform sequencing. Hosted-product
# sequencing is out of scope for this repository -- see KG.1.

document:
  id: ROADMAP-PLATFORM
  version: 1
  status: ratified
  filed_via: ops_decisions:dec-108    # union type: "pending_log_decision_lambda" (pre-ratification) or "ops_decisions:dec-NNN" (post-ratification). T-1.5 schema enforces. Flipped on CD.1 ratification (Decision 108, close-audit-ulf-02).
  description: |
    The On The Loop platform roadmap. Names the automation, governance, and control-plane
    infrastructure that any hosted product would sit on top of. Sequenced as
    tiers T-1..T5 with named cross-tier gates. Replaces and inlines the content of
    the retired docs/INTENT-compute-and-account-topology.md (per CD.14).
  agent_instructions: |
    - Work is discoverable via tier_items[]. An item is eligible when status ==
      "not_started" AND all depends_on entries have status == "complete".
    - depends_on entries are EITHER specific tier_item ids (e.g. T0.1) OR
      tier-name shortcuts (e.g. T0, T2). A tier-name shortcut means "all
      tier_items with that tier value are complete." Both forms are valid.
    - Always reference items by id (e.g. T0.1), never by title. Titles change;
      ids do not.
    - Decision references resolve to candidate_decisions[].id (pre-ratification)
      or ops_decisions.decision_id (post-ratification).
    - candidate_decisions[].gates lists tier_items whose IMPLEMENTATION semantics
      this decision governs. A CD must be ratified before its gated tier_items
      can be marked status == "complete". A tier_item is eligible to START
      regardless of CD ratification (bootstrap allowance — see Bootstrap clause).
    - candidate_decisions[].decision_required_before (optional field) names a
      tier_item state transition that CANNOT proceed until this CD is ratified.
      Value is a gate-rule expression using gate_helpers grammar. Distinct from
      .gates in that .gates governs COMPLETION while .decision_required_before
      governs START (or another named state transition). T-1.5 schema enforces
      both fields STRUCTURALLY (helper grammar + arity; prose entries are
      no-ops). Blocked-on-CD surfacing is implemented in compute_state_dict /
      to_preflight_dict (T-1.20): the full/orient preflight projection includes
      blocked_on_cd[] for eligible items with pending gating CDs (relationship:
      gates|related|decision_required_before). The slim/plan projection omits
      blocked_on_cd; planning sessions use the Tier Item Freshness Gate (T-1.21)
      for per-item gating-decision adjudication.
    - Cross-tier gates in cross_tier_gates[] are MUST hold, not advisory.
      Gate rules are evaluated by GateRuleEvaluator (no eval/exec; Kleene
      tri-state with proper short-circuit: false AND deferred = false, not
      deferred-poisoning). Gate verdicts (pass|fail|deferred) are surfaced in
      the full/orient preflight projection under gate_evaluations[]. The slim/plan
      projection omits gate_evaluations. Static fields: 'status' (resolved from
      YAML). Runtime fields (latest_run.verdict, uptime_days, and item_field_eq
      usages) resolve to 'deferred'. The deferred verdict with a non-driving
      operand short-circuits to pass or fail rather than deferred.
      Gate rule strings use the mini-grammar:
        - item field comparisons: T0.1.status == "complete"
        - helper functions: tier_complete(tier), all_in_tier_with_status(tier, status),
          grace_period_elapsed(item, days) [static]; item_field_eq(item, field, value) [deferred]
        - boolean operators: and, or, not (Kleene three-valued)
      Unknown helpers MUST be rejected by the T-1.5 RoadmapDocument schema check.
    - Effort markers (XS/S/M/L/XL) indicate decomposition need, not wall-clock.
      L and XL items are tagged strategic: true and require their own STRATEGIC
      plan tree before implementation -- SUSPENDED while the CD.17 STRATEGIC
      freeze holds (AGENTS.md Temporary Operational Constraints): during the
      freeze every plan is IMPLEMENTATION type, strategic: true marks
      decomposition need only, and L items deliberately authored as trees of
      atomic IMPLEMENTATION plans carry strategic: false with a freeze-override
      note (T1.13 / T2.19 / T2.22 / T2.23 / T3.1 pattern).
    - Id grammar: tier prefix (T-1, T0..T5) + dotted item number. Letter
      suffixes (T2.11a/T2.11b, T2.16b) mark sibling/follow-on items; decimal
      children (T0.12.5/.6/.7) mark decomposed sub-items. Beware the hyphen:
      T-1.8 (tier T-1, manifest mechanism, complete) and T1.8 (tier T1,
      reserved tombstone) are DISTINCT ids differing only by the hyphen.
    - Bootstrap clause (START eligibility): T-1 tier_items AND T0 tier_items
      with depends_on:[] are eligible to START even when document.status ==
      "draft" and document.filed_via == "pending_log_decision_lambda" and
      candidate_decisions are all state == "pending". The covered set is
      COMPUTED from the graph (items in tiers T-1/T0 whose depends_on is
      empty), not enumerated here -- a prior inline enumeration drifted as
      depends_on edges changed (2026-06-09 audit F-002) and was removed.
    - Bootstrap clause (COMPLETION exemption): the ratification-prerequisite
      set MAY reach status == "complete" with their gating CDs still state ==
      "pending". The exempt set is now enumerated per-item via the
      tier_items[].bootstrap_completion_exempt boolean flag (the document-level
      prose enumeration is documentation; the per-item flag is the single source
      of truth). Two scopes operate in parallel after PLAN-cd25-platform-gap-sequencing:
        (a) Legacy CD.1-scoped subset: {T-1.0..T-1.6, T0.6, T0.7a..c, T0.8, T0.9,
            T0.11, T0.12, T0.13, T0.14}. Without this exemption, ratification
            deadlocks at two layers: (i) T-1.1 depends on T0.7b; T0.7b's gating CDs
            (CD.10/CD.12) only ratify inside T-1.1; (ii) CD.1.gates == [T-1]
            requires every T-1 sibling complete, including ones whose
            related_candidate_decisions reference CD.1/CD.13 -- also circular.
            Exemption ends at CD.1 ratification (i.e. the moment T-1.1 completes).
            [DISCHARGED 2026-07-03, close-audit-ulf-02, Decisions 108/110]: CD.1 AND
            CD.13 both ratified; T-1.1 completed. The CD.1/CD.13-gated members of this
            subset -- {T-1.0, T-1.1, T-1.2, T-1.3, T-1.4, T-1.5, T-1.6, T0.11, T0.14} --
            had bootstrap_completion_exempt stripped in the same edit (T-1.1 was
            rescoped off the T0.7b dependency; see the ratification-vehicle note below).
            T0.6, T0.7a..c, T0.8, T0.9, T0.12, T0.13 STAY exempt -- still gated by
            pending CD.10/CD.12/CD.4 respectively; do not strip their flag.
        (b) CD.25-scoped subset (T-1.12 expansion): {T-1.11..T-1.19, T0.12.5,
            T0.12.6, T0.12.7}. Historical rationale: this scope was authored when
            CD.25 was believed unable to ratify until T0.7b deployed; the
            ratification-vehicle note below supersedes that premise (the portal
            ratifies CDs today), but the exemption is RETAINED so contract-wave
            items can complete ahead of CD.25's portal ratification. Exemption
            ends at CD.25 ratification. Round-3 M2: atomic decomposition children
            of a parent inherit the parent's bootstrap_completion_exempt value
            automatically; the bookkeeping rule reads decomposition_hints at
            plan-filing time (.claude/skills/implement/SKILL.md amendment lands in
            a T-1.12 follow-on plan).
            [DISCHARGED 2026-07-03, dec-118 (Decision 118 ratifies CD.25 via the
            Decision 105 lane)]: CD.25 ratified. Its termination event ("Exemption
            ends at CD.25 ratification") fired; bootstrap_completion_exempt
            stripped in the same edit for the members gated SOLELY by CD.25 --
            {T-1.11, T-1.12, T-1.13, T-1.14, T-1.15, T-1.16, T-1.17, T-1.18,
            T-1.19, T0.12.6}. RETAINED (flag kept) on T0.12.5 (also gated by
            pending CD.29) and T0.12.7 (also gated by pending CD.10) per the
            flag-strip safety rule (strip only when ALL gating CDs are ratified);
            each ends when its remaining CD ratifies.
        (c) Realized-ahead-of-ratification set (2026-06-09 audit reconciliation,
            F-002): items completed under the operating convention that a gating
            CD may ratify AFTER the gated work lands, with ratification via the
            ops portal. Members carry the flag with a note citing this scope;
            at reconciliation time: {T0.2, T0.3, T0.5, T0.10, T2.1, T2.2, T2.3,
            T2.5, T2.10, T2.12, T2.13, T2.16b, T2.17}. Each exemption ends when
            its gating CD ratifies (CD.2/CD.5/CD.6/CD.8+CD.15/CD.20/CD.21/
            CD.26/CD.34 respectively; per-item notes name the binding CD).
            New completions under a pending gating CD MUST add
            the flag + a scope-(c) note in the same edit (implement skill
            bookkeeping enforces this; T-1.22).
            [EXPIRED 2026-07-03, close-audit-ulf-02, Decisions 109/111/112/113]:
            the CD.2/CD.20/CD.21/CD.26 slices of this scope are discharged --
            T0.2 (CD.2), T0.5 (CD.2 + CD.26, both ratified), T2.12/T2.13 (CD.20),
            and T2.10 (CD.21) had bootstrap_completion_exempt stripped in the same
            edit. T2.3 and T2.16b were ALREADY discharged earlier by CD.6
            (Decision 106, dec-106) and CD.34 (Decision 107, dec-107) respectively
            -- their strip here is bonus cleanup, not a consequence of this batch.
            T0.3 (also CD.26-gated) STAYS exempt despite CD.26 ratifying -- it is
            ALSO gated by CD.10 (still pending), so its flag is retained per the
            flag-strip safety rule (strip only when ALL gating CDs are ratified).
            [DISCHARGED 2026-07-17, dec-137/dec-138/dec-139/dec-141 (Decisions
            137/138/139 ratify CD.9/CD.5/CD.4; Decision 141 ratifies CD.19 -- all
            via the Decision 105 lane) + dec-140 (CD.8)]: bootstrap_completion_exempt
            stripped in the same edit for the items whose gating CDs are now ALL
            ratified -- T0.9 (CD.4), T0.10 (CD.5), T2.4 (CD.9 + already-ratified
            CD.31), T2.2 (CD.6 + CD.19, both now ratified). RETAINED per the
            strip-safety rule: T2.5 (co-gating CD.15 pending), T0.13 (CD.12
            pending), T2.1 (pending CD.17 gates it), T0.12.5 (CD.29), T0.12.7/T0.3
            (CD.10). CD.8 (dec-140) clears completion gates on T1.2 and T2.5 (both
            complete); it strips no flag (T1.2 carries none; T2.5 retained).
    - Ratification vehicle (single source of truth; supersedes earlier "T0.7b
      is the first ratification vehicle" phrasing -- 2026-06-09 audit F-001;
      re-described as the shared /orient->/plan->/implement lane by Decision
      105): until T0.7b (log-decision Lambda) is deployed, candidate decisions
      are ratified via a first-class lane shared across /orient (surfaces
      pending CDs carrying realization_evidence via
      PlatformRoadmapState.ratifiable_cds()), /plan (drafts the ratifying
      Decision text, incl. any reversal conditions, as a plan step -- the plan
      confirmation + plan-critique gates are the human sign-off), and
      /implement (executes: author the DECISIONS.md entry -> ETL via
      scripts.ops_data_portal --backfill-decisions-md (file_decision is the
      single-row alternative) -> flip the CD to the canonical ratified shape
      -> re-run preflight to confirm the gate cleared, behind an
      execution-time human confirmation gate). Canonical ratified-CD shape
      (contract: docs/contracts/candidate-decision-ratification.yaml):
      state: ratified + ratified_as: dec-NNN + filed_via: ops_decisions:dec-NNN
      (same 3-digit DECISIONS.md number), enforced by the
      validate_candidate_decision_ratification referential guard against the
      `## Decision NNN:` headers in DECISIONS.md/DECISIONS_ARCHIVE.md. Working
      precedents: CD.16/CD.24 (Decision 79, dec-079), CD.31 (Decision 78,
      dec-078), CD.33 (Decision 81, dec-081), CD.22 (Decision 85, dec-085),
      CD.35 (Decision 92, dec-092), CD.36 (Decision 103, dec-103). T0.7b
      assumes the vehicle role once deployed; the portal path retires with
      T1.5's import-site sweep. During the pending window, candidate_decisions
      with state == "pending" MUST still be treated as binding by any agent
      reading the roadmap.
    - deferred_post_mvp status (Decision 93 -- Platform-MVP boundary): The
      defer-by-exception convention governs platform scope: new platform work
      is MVP-critical by default; items leave MVP scope only by conscious
      deferral, never by enumerating the MVP set. A parked post-MVP item
      carries status: deferred_post_mvp -- the living cousin of reserved.
      Semantics: excluded from next_eligible + tier-completion math (a tier
      of [complete, deferred_post_mvp] counts as complete and does not wedge
      active_tier); absent from the lean preflight/orient digest; recorded in
      the deferred_post_mvp bucket of the FULL compute_state (queryable on
      demand); reactivatable per-item by restoring status -> not_started.
      No live item (not_started or in_progress) may depend_on a
      deferred_post_mvp item -- the platform_roadmap.py model_validator
      enforces this at load time (fail loud; no silent blocking).
      Cross-roadmap product deps on deferred platform items are permitted
      (platform-internal restriction only) and are revisited when product
      work begins. Platform MVP boundary (Decision 93): "the autonomous loop
      closes end-to-end with no human in the critical path of one iteration."
    - This document is self-contained. No outbound substantive references to
      retired INTENT-compute-and-account-topology.md are valid. Mentions in
      retirement metadata (CD.14, T5.5, KG.4) are not references.
    - A tier_item carrying archived: true is a stub (id, tier, name, depends_on, status, completed_at; intent for
      reserved). Its full record is byte-for-byte in docs/ROADMAP-PLATFORM-ARCHIVE.yaml and load() hydrates it.

  gate_helpers:
    # Formal grammar for the gate-rule mini-language. T-1.5 RoadmapDocument
    # schema rejects unknown helpers; arity-mismatched calls are rejected.
    - name: tier_complete
      arity: 1
      params:
        - name: tier_name
          type: str
      returns: bool
      semantics: True iff all tier_items with item.tier == tier_name have status == "complete".
    - name: all_in_tier_with_status
      arity: 2
      params:
        - name: tier_name
          type: str
        - name: status
          type: str
      returns: bool
      semantics: True iff all tier_items with item.tier == tier_name have status == status.
    - name: grace_period_elapsed
      arity: 2
      params:
        - name: item
          type: tier_item_id
        - name: days
          type: int
      returns: bool
      semantics: True iff item.status == "complete" AND now() - item.completed_at >= timedelta(days=days). The named days argument removes the round-1 helper-name ambiguity ("thirty_day_grace_elapsed" used inconsistently for both 14d and 30d windows).
    - name: item_field_eq
      arity: 3
      params:
        - name: item
          type: tier_item_id
        - name: field_path
          type: str
        - name: expected
          type: scalar
      returns: bool
      semantics: |
        True iff the dotted field_path resolved against the tier_item equals expected.
        Used for runtime aggregates like item.latest_run.verdict == "PASS" that depend on
        external state (verifier outputs) not encoded in tier_items themselves. The
        validator does not statically check field_path resolution — runtime evaluation is
        owned by T-1.20 (gate evaluation; item_field_eq stays runtime-deferred there until
        a verifier-output source exists). T-1.4's shipped preflight computes eligibility
        only. (Ownership re-pointed 2026-06-09; previously cited T-1.4.)

north_star:
  principles:
    - id: NS.1
      principle: Storage is durable; compute is interchangeable.
      detail: S3 + open table format at every scale from GB to PB (DuckLake for ops/telemetry per Decision 78). Engines are swappable per workload; data is not migrated to swap engines.
    - id: NS.2
      principle: Account ownership reflects IP ownership.
      detail: "Personal AWS account, not shared work account. AUP, IP, and business-continuity reasons; cost is a tiebreaker. [Amendment 2026-09-17, Decision 195 -- On The Loop Labs Limited, the company formed as platform owner, is distinct from the founder's former employer's shared work account that T5.2 tears down; it may become the account holder once Decision 195's AWS account-ownership consequence is executed. Today's personal-account fact is otherwise unchanged.] [Amendment 2026-10-21, rec-3924: the former employer's retired AWS profile name is replaced by a plain description; meaning unchanged.]"
    - id: NS.3
      principle: Compute lives where it economically belongs.
      detail: "Hybrid by design. Cloud for orchestration and state; local rig for CPU-bound batch where home hardware otherwise idles. [Amendment 2026-09-04, Decision 184 clause 2 -- this detail describes the operator's cloud tier; the free tier runs orchestration and state on user-owned substrate. The principle is unchanged.]"
    - id: NS.4
      principle: The repo is for agents.
      detail: Documentation, configuration, and tooling are optimised for agent consumption. Narrative prose is a side effect, not an output.
    - id: NS.5
      principle: Self-describing typed tools over HTTPS, schema-as-code.
      detail: "Agent surface is verbs (log, update, query, describe) exposed via Lambda Function URLs with AWS_IAM auth. Schema is Pydantic; YAML is generated where needed. [Amendment 2026-09-04, Decision 184 clause 2 -- the Function URL and AWS_IAM transport is the cloud-tier adapter; the free tier reaches the same named verbs in-process. The typed-verb surface and schema-as-code are what both tiers keep.] [Amendment 2026-10-04, rec-4158, Decision 210 cl.3 -- schema and write-time rules live in the owning Class A contract (Decisions 118 and 199); field_semantics.yaml is generated from it and Pydantic models are consumer projections. Schema-as-code stands, with the contract as the code.]"

