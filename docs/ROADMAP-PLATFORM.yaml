  - id: CD.27
    title: Executor compute substrate = Step Functions orchestration + resumable persona execution (layer-2 substrate pinned at ratification) + Lambda deterministic glue (per-step decomposition)
    detail: |
      Replaces the Fargate-as-single-executor-substrate decision (CD.11 Fargate-as-executor clause). The
      per-rec plan->critique->implement->review loop is natively a state machine, not a single long-running
      process. Substrate decomposes into three cleanly-separated layers:

        1. Loop definition (repo-owned ASL subset; Step Functions is the cloud-tier host)
           [Amended 2026-09-04, Decision 185 -- this layer was "Step Functions (workflow orchestration
           substrate)"; the orchestration primitive is unchanged, the DEFINITION moved into the
           repository.] One execution per rec of a committed Amazon States Language document restricted
           to a named subset, rendered from a typed builder in the repository (T4.19) and executed
           natively by Step Functions in the cloud tier; the free tier executes the same document with a
           repo-owned interpreter (T4.22). The state machine carries rec_id, branch_slug, a plan
           identifier (rec_id, revision, ulid-or-hash) and per-step verdicts as execution state. The
           original plan_s3_uri payload contract is considered-and-rejected: the plans table already
           carries plan_text, so the warehouse row is the sole plan artifact and every persona
           fetches it by named verb. Native Parallel state fans out critic personas. Native
           Choice state routes critique aggregation (back to plan_agent on block; forward to implement_agent
           on pass). Native retry policies are deterministic-only -- LLM-judgment failures escalate via the
           rec/RCA path per Decision 55 (RCA-first executor). Step Functions Standard Workflows support
           executions up to 1 year, so the umbrella per-rec lifecycle is durable end-to-end.

        2. Lambda Durable Functions (agent-persona execution substrate; the INCUMBENT layer-2
           candidate -- the T4.15 spike may re-point it)
           Each agent persona (plan_agent, plan_critic, decision_scout, implement_agent, code_reviewer)
           runs, on the incumbent, as a Lambda Durable Function. Iterative read-code -> call-LLM -> tool-use -> emit-output
           loops are checkpointed step-by-step inside the Lambda; on timeout, the next invocation replays
           from the last completed checkpoint and skips completed tool calls. This eliminates the 15-minute
           Lambda ceiling that originally drove the Fargate decision -- per-persona loops can now run
           arbitrarily long via checkpointed replay without losing in-flight state. On the incumbent,
           each Durable Function writes its substantive artefact (plan markdown, critique verdict, diff) to S3 and returns the
           S3 URI to the Step Functions state, keeping payload under the 256 KB transition limit.

        3. Lambda (deterministic glue)
           Regular Lambdas handle cheap deterministic tasks: pick_rec (poll priority queue), prepare_workspace
           (clone + branch + worktree), critique_gate (aggregate parallel critic verdicts; route), file_pr
           (idempotent PR creation), emit_telemetry (final session-close emission). Each invocation is
           sub-15-minute by construction.

      Long-running deterministic steps that genuinely exceed 15 minutes (e.g. a full pytest suite,
      a large data migration) use the Step Functions ECS Run
      Task synchronous integration -- arn:aws:states:::ecs:runTask.sync -- as an escape hatch. terraform
      apply is NOT an in-executor escape-hatch task (EXR-07): merged-change application is dispatched to
      the GitHub-Actions gated-apply pipeline (CD.35 / Decision 92) behind the server-side convergence
      record, per CD.38 sole-runner authority; the executor never runs terraform apply in-cloud. Fargate is
      not eliminated from the architecture; it is demoted from "the executor's primary substrate" to "the
      long-step escape hatch within the executor's Step Functions orchestrator."

      Industry precedent and substrate-existence verification:
        - The incumbent layer-2 candidate, AWS Lambda Durable Functions, launched at re:Invent 2025 (December 2025); GA in US-East (Ohio)
          + 13 additional regions December 2025; expanded to 16 additional regions including eu-west-2
          (London) April 2026; documented at https://docs.aws.amazon.com/lambda/latest/dg/durable-functions.html.
          Supported runtimes: Python 3.13/3.14, Node.js 22/24, Java 17+, .NET/C# 8/10. Max execution duration: 1 year.
          Checkpoint-replay model: on Lambda timeout, next invocation replays the event handler from start
          and skips completed durable operations (Steps/Waits). Verified availability in eu-west-2 (the
          project's region) as of 2026-05-27.
        - Step Functions has been the ratified workflow orchestrator in this codebase since Decision 39
          (April 2026). This CD extends the Decision 39 primitive to the executor's per-rec loop, not
          introducing a new substrate.

      Relationship to existing decisions:
        - Cites Decision 39 (Step Functions over Airflow) as precedent. The orchestrator choice is already ratified.
        - Preserves Decision 55 (RCA-first executor) verbatim. Step Functions retry policies are deterministic-only.
        - Replaces CD.11's Fargate-as-executor-substrate clause. Fargate-via-ECS-Run-Task retained as escape hatch.
        - T4.12 (scheduled-agent loop; renamed off T4.3 by the 2026-07-06 producer-repoint rewrite) decides
          its own substrate at its own exit criterion cD (Step Functions scheduled execution vs
          GitHub-hosted Actions schedule, still open, documented with rationale there); the CD.21 /
          Decision 112 retirement already removed the sole alternative execution mechanism that used to
          sit outside that pair, so cD's still-open choice is exactly between those two -- this CD does
          not pre-empt it.

      [Amendment 2026-09-28, Decision 205 -- (a) clause 1 moves the critic personas (plan_critic, decision_scout, code_reviewer) out of the executor into Actions verdict jobs, so layer 1's Parallel critic fan-out and layer 3's critique_gate aggregation read as await_verdict states over SHA-bound check runs (T4.1); (b) clause 5 makes the plan artifact the git file at the plan PR's head SHA and the plans-table row a projection, so the plan identifier becomes (rec_id, PR number, head SHA); (c) clause 6 limits layer 2 to planning and implementation, with long_running_container presumptive and ratification on T4.15's record; (d) clause 3 resolves T4.12 cD -- repo-scoped agents on push-to-main Actions triggers, non-repo-data agents on a scheduler port. The layer text above is left literal for traceability.]
    gates: [T4.1, T4.2, T4.3, T4.4]
    state: pending
    filed_via: pending_log_decision_lambda
    narrowly_supersedes:
      decision_id: "CD.11"
      clause: |
        Fargate-as-executor-substrate clause. Step Functions orchestration + resumable persona execution
        (layer-2 substrate pinned at ratification) + Lambda deterministic glue is the new executor
        substrate. Fargate retained for ECS Run Task escape-hatch integration within Step
        Functions for steps that genuinely exceed 15 minutes (full pytest, large data migration, etc.;
        terraform apply is NOT an in-executor task -- it rides the CD.35 / Decision 92 gated-apply pipeline).
    discipline_points:
      - One Step Functions execution per rec (clean lifecycle scoping).
      - Large artefacts (plans, diffs, transcripts) pass via S3 pointer pattern in Step Functions state. Payload stays well under the 256 KB transition limit.
      - Step Functions retry policies are deterministic-only. LLM-judgment failure escalates via the rec/RCA path (Decision 55), never via automatic LLM-call retry-on-bad-output.
      - Lambda Durable Functions maturity monitoring -- the service is ~5 months in GA at the time of CD.27 ratification. If API semantics regress within the first 12 months after ratification, the fallback specified in fallback_spec below (self-checkpointed Lambda with state in DynamoDB) applies, re-evaluated by the instantiated carrier validate_fallback_reevaluation on every net-new atomic plan naming any of this CD's own gated tier items -- T4.1, T4.2, T4.3 or T4.4 (widened from the original T4.2-only cadence so the obligation this text states and the control that enforces it agree). Track via T4.2 exit criterion c1 (persona deployments satisfy this CD's resume_properties P1, P2 and P3) and the stability_definition_14d unplanned_resume_rate Health Signal (INTENT line :352 surfaces the alarm threshold).
      - fallback_spec:
          trigger: "Lambda Durable Functions API semantics regress within the first 12 months after CD.27 ratifies, as evaluated by validate_fallback_reevaluation at each net-new atomic plan naming a CD.27-gated tier item (T4.1, T4.2, T4.3 or T4.4)."
          substrate: "Self-checkpointed Lambda with explicit state persisted in DynamoDB, replacing the Lambda Durable Functions checkpoint-replay primitive; Step Functions orchestration is unaffected (Decision 39 precedent stays in force)."
          state_schema:
            grain: "one item per persona-node checkpoint event"
            identity: "checkpoint_id, a ULID minted at the write boundary (never client-side), per the data-modeling-standard.yaml identity rule"
            partition_key: "rec_id (groups all checkpoints for one executor run)"
            sort_key: "checkpoint_id (ULID sorts lexicographically by mint time, giving natural replay order)"
            attributes: "persona, step_name, tool_calls_completed, workspace_state_pointer (S3 URI), created_at"
            write_mode: "append_only -- checkpoints are insert-once event-journal rows per docs/contracts/data-modeling-standard.yaml, never mutated in place"
          checkpoint_granularity: "Per completed tool-call inside a persona's read-code -> call-LLM -> tool-use -> emit-output loop, mirroring the granularity Lambda Durable Functions checkpoints at today."
          driver: "The unplanned_resume_rate signal in this CD's stability_definition_14d breaching its 5 percent threshold, or a documented Lambda Durable Functions API-semantics regression discovered independently of that signal."
          cutover: "Swap the persona-node's checkpoint/replay calls for explicit DynamoDB reads/writes behind the same resume_properties P1/P2/P3 contract; Step Functions state shape and the S3 artefact-pointer pattern are unaffected."
          effort: "Estimated M (single-sprint): one new DynamoDB table, a checkpoint read/write helper module, and a resume-path swap inside the persona-node Lambda -- no orchestration-layer change."
          reevaluation_carrier: "validate_fallback_reevaluation (scripts/checks/roadmap/validate_fallback_reevaluation.py), registered in both validate --pre and full tiers -- see that module's own docstring for the carrier's full lifecycle (persistence past ratification, the in-band obligation_lapsed exit, and its three disclosed residuals); not restated here."
          lapse_condition: "LAPSES if wave 5's Q5 spike (ESB-04 comparative record) pins a layer-2 substrate for which a DynamoDB self-checkpoint fallback is inapplicable -- e.g. long_running_container or hosted_cli_runner, which carry no Lambda-checkpoint-replay dependency to fall back from -- mirroring ESB-06's existing LAPSE precedent in shape, so hardening this non-managed candidate ahead of the comparative record cannot silently pre-commit the choice. [Amendment 2026-09-04, Decision 184 clause 3 -- hosted_cli_runner is eliminated as persona compute; long_running_container remains the live example.]"
      - Cross-reference correction (H1, code-review round 1, 2026-08-02) on the maturity-monitoring point above, applied in place by wave 3 (ESB-02 remediation) -- the stale "checkpoint-replay verified" tracking pointer this note flagged has now been replaced in the maturity-monitoring point itself. The live, resolving references are T4.2 exit criterion c1 (persona deployments satisfy CD.27 resume_properties P1, P2 and P3) and this CD's stability_definition_14d unplanned_resume_rate signal (INTENT line :352 surfaces the alarm threshold).
      - T4.x atomic-plan template -- each T4.x atomic plan must declare Plan Type IMPLEMENTATION (STRATEGIC remains suspended per AGENTS.md Temporary Operational Constraints) and must include CD.16 per-Lambda build/deploy/smoke-test steps for the Lambdas it touches (Decision 79 lifted the blanket Decision-67 deploy freeze; only the dispatcher smoke-test deferral survives until T4.3 -- audit F-009). T4.2 in particular splits per-persona; not all personas need to land in the same window.
      - "[Amended 2026-07-07, EXR-07 / audit 7d57a0d; extends nothing, overturns nothing:] terraform apply is removed from the ECS Run-Task escape-hatch examples -- apply authority is the GitHub-Actions CD.35 / Decision 92 gated-apply pipeline (CD.38 sole-runner), never an in-executor task. Reconciles a stale example with the ratified apply authority."
      - resume_properties:
          P1: A resumed persona execution completes remaining work without re-doing operations already completed before the interruption.
          P2: A resumed persona execution continues from the same workspace state (files, branch, in-progress edits) it held before the interruption, without losing that state.
          P3: An interruption bounds the amount of lost work to a small, characterizable slice of the persona's operations, never the whole run.
      - Agent personas run as resumable persona nodes satisfying P1/P2/P3 (resume-without-redo, workspace continuity, bounded loss per this CD's resume_properties), not as regular Lambdas -- the layer-2 substrate providing that resumability is pinned at ratification. The deterministic-only rule for regular Lambdas is scoped to the executor's ITERATIVE persona loops, co-citing Decision 39's managed-orchestration precedent for the `agent` state type it continues to govern outside that scope.
      - ECS Run Task escape hatch is the ONLY remaining Fargate path. Long-running agent loops are NOT a Fargate use case under CD.27 -- they run as resumable persona nodes satisfying P1/P2/P3, with the layer-2 substrate pinned at ratification.
      - stability_definition_14d:
          purpose: T4.2 operational definition of "stable for 14 days", required for the CD.17 reversal trigger. This is the explicit semantic definition replacing the pre-CD.27 "Fargate handler runs the loop end-to-end without recovery agent" implicit definition.
          signals:
            unplanned_resume_rate:
              denominator: persona-node executions STARTED in the 14-day window
              exempt: scheduled duration-ceiling continuations -- routine resumes triggered by a persona hitting its max-invocation-duration ceiling, not by an unplanned interruption
              threshold: less than 5 percent
            per_rec_success_rate:
              threshold: at or above the rolling 7-day baseline
            unrecovered_failures:
              threshold: zero (the Decision 55 stop-clean-and-RCA path counts as recovered if a rec was filed)
            cost_per_rec:
              threshold: rolling average within 1.5x the rolling 7-day baseline
          baseline_window: the scored evaluation span is days 8-14 of the grace window; days 1-7 establish the in-window baseline only and are never themselves scored against the thresholds above -- this is what stops the gate self-delaying on its own bootstrap data
          days_1_7_absolute_thresholds: TBD_at_T4.2_atomic_plan
          worked_example:
            scenario: a 2-hour implement_agent run
            inputs:
              persona_node_executions: 25
              unplanned_resumes: 1
              scheduled_continuations: 15
            computed:
              unplanned_resume_rate: 0.04
            verdict:
              signal_passes: true
              rationale: 0.04 is under the 5 percent threshold for this signal, so signal_passes is true for unplanned_resume_rate on this persona; the 14-day trigger overall fires only when ALL personas satisfy every per-signal threshold above across days 8-14 -- this worked example demonstrates one persona's unplanned_resume_rate signal passing, not the whole 14-day trigger alone
          trigger_semantics: fires only when ALL personas' executions satisfy every per-signal threshold above across days 8-14 of the grace window (see baseline_window)
      - Layer-2 ratification precondition (ESB-04). Before this CD ratifies, the ratifying plan must carry a comparative record over the pinned candidate substrate set (durable_functions, sfn_over_stateless_workers, self_checkpointed_lambda_dynamodb, long_running_container, hosted_cli_runner) plus the Q5 spike outcome (decision_scout as the spike vehicle). T4.15 is the tier item that OWNS that spike and that comparative record, so this precondition discharges against T4.15 and against nothing else. The selected layer-2 substrate must be a MANAGED orchestration primitive unless the selecting plan authors an explicit Decision 39 supersession -- this CD does not by itself widen the admissible substrate set beyond what Decision 39 ratified. [Annotation 2026-08-19, PLAN-executor-two-plane-roadmap-encoding -- the surviving literal wording above, MANAGED orchestration primitive, is the clause CD.44's GOV-1 rules on. It is left VERBATIM and unamended here on purpose, because whether a given candidate satisfies it is a READING of this clause, and the reading belongs in the ratifying record T4.15 produces rather than in a quiet rewrite of the clause being read.] [Amendment 2026-09-04, Decision 184 clause 3 -- hosted_cli_runner is eliminated from the T4.15 arms -- GitHub-hosted runners are the verdict plane, never persona compute; the pinned set above is left literal for traceability and the comparative record scores the four remaining candidates.] [Amendment 2026-09-28, Decision 205 clause 6 -- the spike vehicle moves from decision_scout, now an Actions verdict job under clause 1, to the planning and implementation personas; long_running_container is the presumptive arm, confirmed live by T4.15, and the comparative record desk-scores durable_functions, sfn_over_stateless_workers and self_checkpointed_lambda_dynamodb against P1/P2/P3, so this precondition still discharges against T4.15 and against nothing else.] [Amendment 2026-10-19, Decision 229 clause 3 -- T4.15 is now the implement_agent-on-Fargate T4.2 child; the confirmation's live vehicle is implement_agent, the workspace-mutating leg T4.15 c3 names, so this precondition still discharges against T4.15. plan_agent's mid-loop kill (T4.31 c1) is a post-confirmation conformance leg on the confirmed substrate, not a ratification precondition.]
      - "Free-tier host (Decision 185 clause 2): the repo-owned interpreter (T4.22) is admitted as the loop's host ONLY where no managed orchestrator exists, as a scoped supersession of Decision 39 recorded in Decision 185; Step Functions remains the sole cloud-tier engine, and the ESB-04 MANAGED orchestration primitive clause stays verbatim, its reading for the free-tier host recorded in Decision 185 rather than rewritten here."
      - Layer-2 ratification precondition (ESB-06), discharged against T4.15, which owns the Q5 spike. If the Q5 spike selects a substrate whose resume model is replay-based (re-runs handler code from the start on resume, as durable_functions and sfn_over_stateless_workers do), the ratifying plan must also carry the determinism rules for step-wrapped code plus a validate.py static check enforcing them, before ratification. If the spike instead selects a non-replay substrate (self_checkpointed_lambda_dynamodb, long_running_container, hosted_cli_runner), this determinism-rules-plus-static-check obligation LAPSES -- it does not carry forward as dead weight onto a substrate the rules do not apply to.
      - Layer-2 ratification precondition (ESB-01), discharged against T4.15. Before this CD ratifies, the ratifying plan (the CD.27 layer-2 spike, wave 5, owned by tier item T4.15) must select the executor's workspace backing store against CD.43's criteria and record the choice in CD.43's workspace_store_selection.selected_store, replacing the TBD_at_CD.43_ratification deferral marker. The store discriminates directly between substrates -- container-local disk erases the workspace half of the resumability gap this CD exists to close; an EFS-backed store imposes a standing VPC/NAT term and forecloses the hosted_cli_runner candidate outright; S3-sync is the only fully portable option across the candidate set but commits every interruption to a re-materialization cost. CD.43 holds the full criteria set; this precondition does not restate them.
      - Precondition-discharge rule -- a ratified candidate decision must record a non-empty precondition_discharge entry for every ratification precondition id its own text declares, per rule R4 of docs/contracts/candidate-decision-ratification.yaml, enforced by validate_candidate_decision_ratification.

  - id: CD.28
    title: LLM inference = DeepSeek-direct via LiteLLM (Tier 1); Anthropic-direct (Tier 2); Bedrock retired from architecture
