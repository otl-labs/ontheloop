# docs/ROADMAP-SEMANTO.yaml
#
# Sibling roadmap: external-facing marketing, brand identity and comms for On The Loop.
# Anchored by Decision 101 as amended (Decisions 171, 198, 202, 209). Decision 198: On The Loop is
# the sole external brand; Semanto is this roadmap's internal name only, never a public-facing mark.
# Sibling: docs/ROADMAP-PLATFORM.yaml (platform infrastructure).
#
# ALL tier_items carry status: deferred_post_mvp (Decision 93 -- Platform-MVP boundary).
# No item is eligible until reactivated post-MVP. Validation wired in S1.5.
# Tier prefix: S. Id grammar: S1.x.

document:
  id: ROADMAP-SEMANTO
  version: 1
  status: draft
  filed_via: pending_log_decision_lambda
  description: |
    The Semanto marketing/comms roadmap. Semanto is this roadmap's internal name only, never a
    public-facing mark (Decision 198 clause 1). Governs the external-facing brand presence of On The
    Loop -- the single external mark for the platform and its products -- owned by On The Loop Labs
    Limited (Decisions 195, 198). All items are parked deferred_post_mvp (Decision 93) and none are
    eligible until the Platform MVP boundary is crossed and items are individually reactivated ->
    not_started.
    Decision 101 as amended (Decisions 171, 198, 202, 209) anchors the presentation-layer-only
    constraint, the marketing-prose exception, the public-content boundary, hosting and positioning.
    This file points at those clauses; it never restates or amends them.
  agent_instructions: |
    - ALL items in this roadmap carry status: deferred_post_mvp (Decision 93).
      None are eligible to start. Do not surface them in next_eligible or eligible
      item lists until individually reactivated -> not_started post-MVP.
    - Reactivation requires an explicit operator edit: status: not_started on the
      specific item. Do not auto-reactivate.
    - depends_on edges in this roadmap are intra-SEMANTO only (no live item may
      depend on a deferred item -- Decision 93 no-live-dep invariant; satisfied
      because the entire tier is deferred and nothing in ROADMAP-PLATFORM.yaml
      depends on any S1.x id).
    - Tier prefix is S. Id grammar: S1.x.
    - Decision 101 as amended (Decisions 171, 198, 202, 209) is the anchoring decision for all items
      in this roadmap. Point at its clauses, never restate them, and never amend Decision 101 from
      this roadmap: rec-4389 owns its full supersession.
    - S1.5 (deferred) wires ROADMAP-SEMANTO.yaml into validate.py and session_preflight.
      Until S1.5 ships, this file is not schema-validated by validate.py.
    - Marketing content lives in top-level marketing/ (never docs/). It is NOT an
      agent source-of-truth (Decision 86 scoped exception, Decision 101 clause c).
    - Brand values are PROVISIONAL placeholders: every colour, palette and typeface value named in S1.11
      and S1.12 indicates broad direction only, pending the commissioned illustration (S1.10,
      user_action_required), and the palette is entirely open to change. Never treat one as confirmed
      before S1.10 completes.
    - Brand tokens (palette, typefaces) and the colour rule are NAMED here and DEFINED once in the
      visual-grammar contract (docs/contracts/visual-grammar.yaml) -- one source for the dependency map and
      for marketing. These rows feed that contract inputs and conform to it; they are never a second
      definition.
    - The brand's visual language is inspired by intuitive relationship mapping and schematic network
      diagrams. Never name a transit operator or a transit mark, as a source or as the reason for a rule.
    - Brand art is outside the code licence: the logo marks, illustrations, brand art and
      the visual identity as embodied in the commissioned works belong to On The Loop Labs Limited,
      all rights reserved, and are covered neither by BUSL-1.1 now nor by Apache-2.0 after the
      Decision 194 flip. Every brand-art asset landing in marketing/ carries its own notice saying so;
      third-party fonts keep their own licence (S1.12 c2), and site code and prose ship under the
      repository licence (Decision 209 clause 3(1)). LICENSE
      and LICENSE-APACHE section 6 withhold only trademark and logo rights; rec-4557 owns the explicit
      licence-surface exclusion, which lands before the first commissioned asset or the flip, whichever
      comes first.
    - The external illustrator's identity, the commission terms and any trademark-filing
      particulars stay off-repo. Never record them in this file or on any public surface.

candidate_decisions: []

cross_tier_gates: []

tier_items:
  - id: S1.1
    tier: S1
    name: Apply On The Loop external branding to public-facing surfaces
    intent: |
      Update the repository README wording and the repository description to the external brand On
      The Loop (Decision 198 clause 1). Presentation only: which identifiers are presentation-layer
      and which stay frozen is Decision 101 clause (b) as amended (Decisions 171, 202; the repository
      move is Decision 218), pointed at and never restated here. README is a curated portal
      (Decision 111). Badge and description updates only.
    depends_on: []
    effort: XS
    strategic: false
    status: deferred_post_mvp
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Re-grounded by
      PLAN-semanto-brand-identity (rec-3986): README's H1 already reads On The Loop (Decision 198
      clause 5). Re-measured 2026-10-24 by PLAN-documentation-refresh (rec-4574): README.md carries no
      retired-brand text and the repository description is empty, so the remaining scope is setting
      the repository description, an operator settings action.
      Reactivate -> not_started post-MVP.

  - id: S1.2
    tier: S1
    name: Register the public-site domain DNS/TLS + Cloudflare Pages project
    intent: |
      Human-gated step: operator wires the DNS records for the public site's domain
      (onthelooplabs.com -- Decision 101 clause (e) as amended by Decision 198 clause 2; identifier
      map Decision 198 clause 3) and creates the Cloudflare Pages project via the Cloudflare
      console. No automation possible until the Pages project exists and DNS is live. TLS is managed
      by Cloudflare (auto-provisioned). Prerequisite for the Astro/Starlight scaffold (S1.3).
    depends_on: []
    effort: XS
    strategic: false
    status: deferred_post_mvp
    user_action_required: true
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). The domain follows Decision 101 clause (e)
      as amended; rec-4389 may re-decide hosting, and this row is re-grounded if it does. This item
      requires a human console action to wire DNS and create the Pages project.
      user_action_required: true. Reactivate post-MVP.

  - id: S1.3
    tier: S1
    name: Astro + Starlight static-site scaffold in top-level marketing/ + Cloudflare Pages build
    intent: |
      Scaffold the Astro + Starlight site in top-level marketing/ (not docs/; per Decision 101
      clause c scoped exception). Includes content collections with Zod-validated frontmatter,
      Cloudflare Pages build pipeline, and the one-way rendering pipeline from internal artefacts
      to marketing prose. Marketing content is never a warehouse write source (Decision 84).
    depends_on: [S1.2]
    effort: M
    strategic: false
    status: deferred_post_mvp
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Astro + Starlight (free/MIT);
      Cloudflare Pages is the native managed primitive (Decision 100). depends_on S1.2
      (DNS/Pages project registration). Reactivate post-MVP.

  - id: S1.4
    tier: S1
    name: Public-content boundary review gate + validate.py marketing/ exclusion guard
    intent: |
      Pre-publish checklist enforcing Decision 101 clause d (no AWS account specifics;
      market the platform engineering, never confidential operational data). Adds a
      validate.py guard that excludes top-level marketing/ from the agent-first /
      intent-doc-freeze corpus so the Decision 86 freeze guard does not false-positive
      on marketing prose.
    depends_on: [S1.3]
    effort: S
    strategic: false
    status: deferred_post_mvp
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Depends on S1.3 (scaffold).
      Adds boundary enforcement so no AWS account specifics or confidential figures
      can be published. Also adds marketing/ exclusion to validate.py's intent-doc-freeze
      guard. Reactivate post-MVP.

  - id: S1.5
    tier: S1
    name: Wire ROADMAP-SEMANTO into tooling
    intent: |
      Add a validator over docs/ROADMAP-SEMANTO.yaml reusing the RoadmapDocument Pydantic
      schema (scripts/roadmap/platform_roadmap.py), surfaced in validate.py as a new check and in
      session_preflight via the platform_roadmap compute_state path. Keeps both sibling
      roadmaps on the same validation footing. No new schema changes required -- RoadmapDocument
      already supports the S1.x id grammar and deferred_post_mvp status.
    depends_on: []
    effort: S
    strategic: false
    status: deferred_post_mvp
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Until this ships, ROADMAP-SEMANTO.yaml
      is authored to conform to RoadmapDocument but is not schema-validated by validate.py
      (validate_platform_roadmap targets a fixed path). Reactivate
      post-MVP to wire the second roadmap into CI and session_preflight.

  - id: S1.6
    tier: S1
    name: Initial content -- landing page + first engineering write-up
    intent: |
      The first published content on the public site (domain per Decision 101 clause (e) as amended):
      a landing page and the foundational engineering write-up on the self-improving / agent-first
      platform story. Markets the platform engineering and architecture; never publishes
      confidential operational data (Decision 101 clause d). Content lives in top-level marketing/
      (Decision 101 clause c scoped exception; never in docs/).
    depends_on: [S1.3, S1.4]
    effort: M
    strategic: false
    status: deferred_post_mvp
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). First-publish content gate:
      depends on S1.3 (scaffold) and S1.4 (boundary review gate). Audience, licensing posture and
      any paid offering follow Decision 101 clause (f) as amended (Decisions 171, 198, 209), pointed
      at and not restated here. Reactivate post-MVP.

  - id: S1.7
    tier: S1
    name: Pre-registered experiment protocol -- operational-memory ablation, long-horizon maintenance, model matrix
    intent: |
      Author the experiment protocol BEFORE any run, as the exit criteria below or a Class D contract under
      docs/contracts/ that they point at -- never in marketing/, which only summarises it (Decision 101 clause c:
      marketing never feeds back into agent context). Three parts, every claim a hypothesis: (1) a three-arm
      operational-memory ablation on one model -- no memory, memory as CLAUDE.md prose, memory with enforcement
      and liveness; (2) a long-horizon maintenance proof on an external subject (selected by S1.8); (3) a
      two-by-two matrix, cheap versus frontier model crossed with brute force versus On The Loop. Platform
      engineering only: no commercial or operational data (Decision 101 clause d).
    depends_on: []
    effort: M
    strategic: false
    status: deferred_post_mvp
    exit_criteria:
      - id: c1
        text: Each arm's metrics, stop rules and inference budget are pre-registered and committed before any run, so results cannot be selected after the fact
        status: open
      - id: c2
        text: The protocol lives in this item or a docs/contracts/ file it names; marketing/ never specifies it (Decision 101 clause c), and any public rendering stays inside Decision 101 clause d -- it publishes no docs/ content, only marketing's own summary of the protocol
        status: open
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Filed by PLAN-brownfield-adoption-port-conformance as a
      deferred item rather than an open rec (decision-entry.yaml routing.work_item: a deliberate deferral is a
      deferred_post_mvp item). Reactivate post-MVP.

  - id: S1.8
    tier: S1
    name: Select a maintenance-fork subject by live data against four properties
    intent: |
      S1.7's long-horizon maintenance proof needs an external subject. Select it from live data (package-index
      and repository activity), scoring candidates against four properties: an exogenous change stream (upstream
      releases, dependency churn), health measurable without reading code (test pass rate, issue latency,
      dependent breakage), a multi-month horizon, and low blast radius. Record the adoption levers for the chosen
      subject: PyPI name transfer via PEP 541, successor naming in the original repository, and dependents already
      asking for a maintained fork. Creating the fork repository first needs a Decision 209 clause 3
      placement or an amendment of that clause (its repository set is closed: no other repository is created
      speculatively), and waits until S1.7's protocol is committed.
    depends_on: [S1.7]
    effort: S
    strategic: false
    status: deferred_post_mvp
    exit_criteria:
      - id: c1
        text: Candidates are scored from live data against the four properties and the chosen subject's adoption levers are recorded, with the selection rule fixed before scoring
        status: open
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Filed by PLAN-brownfield-adoption-port-conformance in
      place of a recommendation. Reactivate post-MVP, after S1.7.

  - id: S1.9
    tier: S1
    name: Positioning note -- dependency mapping at the level of milestones and gates
    intent: |
      A positioning note under marketing/ (Decision 101 clause c). Headline: On The Loop maps dependencies at the
      level of milestones and gates -- what must hold before work may proceed -- not code dependencies. Human
      comprehension moves from code to intent, contracts and evidence (not that humans need not comprehend
      anything), under altitude control: an engineer can always drop down to the code. Models are interchangeable
      inputs (Decision 221, Intent): the framework's contribution is model-agnostic and compounds over the horizon
      of a codebase, and no claim is framed against a named model vendor. The cost-tier result (a cheaper model
      under On The Loop matching a frontier model without it) is a corollary, stated only as a hypothesis until
      S1.7's experiments report (Decision 221 clause 4). The first user archetype is the Signaller, as
      Decision 232 defines it (pointed at, not restated here). The visual language (S1.11) is inspired by
      intuitive relationship mapping and schematic network diagrams. Platform engineering only (Decision 101
      clause d).
    depends_on: []
    effort: S
    strategic: false
    status: deferred_post_mvp
    exit_criteria:
      - id: c1
        text: The headline is dependency mapping at the level of milestones and gates, not code dependencies, and the note states that comprehension moves from code to intent, contracts and evidence under altitude control (an engineer can always drop down to code)
        status: open
      - id: c2
        text: No claim is framed against a named model vendor, and every cost-tier claim is a hypothesis until S1.7 reports (Decision 221 clause 4), stated in tokens or GB-seconds, never dollars (Decision 221 clauses 1 and 5)
        status: open
      - id: c3
        text: The note introduces the first user archetype, the Signaller, in marketing's own words consistent with Decision 232 -- never quoting or publishing decision-log text (Decision 101 clause (d)) -- and takes its audience from Decision 101 clause (f) as amended by pointer; it amends no Decision
        status: open
      - id: c4
        text: The dependency-mapping claim never blurs the open-core boundary as currently decided (Decision 209 clause 1 as amended), which this roadmap points at and never restates
        status: open
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Filed by PLAN-brownfield-adoption-port-conformance in
      place of a recommendation; positioning re-grounded by PLAN-semanto-brand-identity. Reactivate post-MVP.

  - id: S1.10
    tier: S1
    name: Commission the brand illustration -- an external illustrator brings their style to the brand concepts
    intent: |
      Commission an external illustrator to bring their own style to the brand concepts of S1.11 (the OTL
      monogram) and S1.12 (typography). The commissioned works and their IP are assigned to
      On The Loop Labs Limited (Decision 195 clause 1). Human-gated: the illustrator's identity and the
      commission terms stay off-repo. The brief states that every brand value is open: the placeholder
      red/green/yellow trio carries no intent beyond distinct line identities, and as a trio it reads as
      red/amber/green status, which the colour rule forbids, so the illustrator chooses the palette. The
      commissioned work is the operator's input for confirming or replacing each provisional brand value;
      confirmed values are written into the visual-grammar contract, never into a marketing/ file
      first, because marketing is one-way downstream (Decision 101 clause c). The commissioned works and the
      visual identity they embody stay outside the repository's code licence (agent_instructions).
    depends_on: []
    effort: XS
    strategic: false
    status: deferred_post_mvp
    user_action_required: true
    exit_criteria:
      - id: c1
        text: The commission's IP assignment to On The Loop Labs Limited is executed off-repo; the repository records only that it is done, never the illustrator's identity or the terms
        status: open
      - id: c2
        text: The operator has confirmed or replaced each provisional brand value of S1.11 and S1.12 from the commissioned work, with the illustrator's judgement deciding the look, and the confirmed values are written into the visual-grammar contract (docs/contracts/visual-grammar.yaml) and meet its firm rules
        status: open
      - id: c3
        text: Before any commissioned asset lands in marketing/, the licence-surface exclusion (rec-4557) has landed and the asset carries its own notice beside it -- owned by On The Loop Labs Limited, all rights reserved, covered neither by the repository's BUSL-1.1 nor by Apache-2.0 after the Decision 194 flip (Decision 171 clause 5; Decision 195 clause 2)
        status: open
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Filed by PLAN-semanto-brand-identity. Its output
      confirms or replaces the provisional values S1.11 and S1.12 name. user_action_required: true. Reactivate
      post-MVP.

  - id: S1.11
    tier: S1
    name: OTL monogram logo system
    intent: |
      The On The Loop logo system. Its visual language is inspired by intuitive relationship mapping and schematic
      network diagrams. In the OTL monogram the O is a double ring (the loop), a
      jointed arm forms the T and an L completes it, so together they read as a mechanical arm picking up a loop;
      in the schematic-diagram idiom the arm's pin joints double as interchange rings. The palette is entirely open
      to change: the current red O, green T arm and yellow L are poorly chosen placeholders carrying no intent
      beyond a distinct line identity per element, and the illustrator chooses the palette (S1.10). The palette and
      the colour rule (colour carries line identity, never status, so the marks never read as red/amber/green
      status; every meaning is carried by shape as well) are inputs to the visual-grammar contract, which
      defines them; this row conforms to it. Rendered assets and vector sources live in top-level marketing/
      (Decision 101 clause c); marketing never feeds agent context. Downstream uses, with no depends_on edge (each
      picks the mark up once both exist): the site favicon (S1.3) and the GitHub organisation and repository
      avatar, an operator settings action outside S1.1's text-only scope.
    depends_on: [S1.10]
    effort: M
    strategic: false
    status: deferred_post_mvp
    exit_criteria:
      - id: c1
        text: Vector sources exist under marketing/ for a detailed hero mark, a flat small-size mark legible at about 32px (favicon, avatar) and a one-colour version
        status: open
      - id: c2
        text: The one-colour version and the small mark read without colour -- the double ring, the jointed arm and the L are distinguishable by shape alone, so a colour-blind reader loses nothing
        status: open
      - id: c3
        text: Usage rules (clear space, minimum size, permitted colour variants, misuse) are published under marketing/, and the marks' colours are the visual-grammar contract's palette tokens (docs/contracts/visual-grammar.yaml), never a second definition
        status: open
      - id: c4
        text: The mark borrows the schematic network-diagram idiom only and reproduces no third-party mark or proprietary typeface -- the loop (the O) is never bisected or symmetrically intersected by a bar or band
        status: open
      - id: c5
        text: The structural-size classification of the asset files lands with them -- a class row or exclusion for marketing/ brand assets, so they do not fall to the residual row by default (Decision 166)
        status: open
      - id: c6
        text: Every logo asset under marketing/ carries S1.10 c3's notice -- the marks, the brand art and the visual identity as embodied in the commissioned works are On The Loop Labs Limited's, all rights reserved, outside the repository's code licence
        status: open
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Filed by PLAN-semanto-brand-identity; every colour
      value here is a placeholder until S1.10 completes. Reactivate post-MVP.

  - id: S1.12
    tier: S1
    name: Brand typography -- a typewriter display face and a legible companion face
    intent: |
      Two faces. A typewriter display face for headings and the wordmark only, chosen so the brand reads as human
      rather than sterile; Special Elite is the current candidate (provisional, pending S1.10). A legible companion
      face for body text and dependency-map labels (provisional, not yet chosen). Both are inputs to the
      visual-grammar contract, which defines the typeface tokens for the map and for marketing; this row conforms
      to it. Every vendored font file carries its licence text.
    depends_on: [S1.10]
    effort: S
    strategic: false
    status: deferred_post_mvp
    exit_criteria:
      - id: c1
        text: The display face sets headings and the wordmark only and the companion face sets body text and map labels, both as the visual-grammar contract's typeface tokens (docs/contracts/visual-grammar.yaml), never a second definition
        status: open
      - id: c2
        text: Every vendored font file ships with its own licence text beside it -- a third-party face is governed by that licence alone -- and each licence permits self-hosting and redistribution from this public repository; wordmark artwork set in the display face is brand art under S1.10 c3's notice
        status: open
      - id: c3
        text: The structural-size classification of vendored font files lands with them, so they do not fall to the residual row by default (Decision 166)
        status: open
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Filed by PLAN-semanto-brand-identity; every typeface
      value here is provisional until S1.10 completes. Reactivate post-MVP.

  - id: S1.13
    tier: S1
    name: Trademark filing for the OTL monogram
    intent: |
      Human-gated: the operator files, or declines to file, a trademark for the final OTL monogram (S1.11), off-repo.
      Clearance before filing covers resemblance to existing marks, ring-and-bar marks in particular (S1.11 c4).
      Decision 198's trademark-conflict-found reversal condition watches classes 9 and 42,
      and class coverage for a data service is rec-4385's question (Decision 220 clause 7); this row does not
      re-decide classes. Filing particulars stay off-repo; only the outcome is recorded, as a dated annotation on
      Decision 198 (the convention rec-4385 uses).
    depends_on: [S1.11]
    effort: XS
    strategic: false
    status: deferred_post_mvp
    user_action_required: true
    exit_criteria:
      - id: c1
        text: Clearance before any filing covers resemblance to existing marks, ring-and-bar marks in particular; a resemblance found sends the mark back to S1.11 before filing
        status: open
      - id: c2
        text: The filing is made or declined off-repo, and its outcome (filed or declined, and the classes) is recorded as a dated annotation on Decision 198; filing particulars stay off-repo
        status: open
    progress_note: |
      Parked deferred_post_mvp (Decision 93, Decision 101). Filed by PLAN-semanto-brand-identity.
      user_action_required: true. Reactivate post-MVP, after S1.11.
