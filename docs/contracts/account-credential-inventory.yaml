# Account and credential inventory (Decision 195; the company-cutover programme).
# One row per account, credential or identifier the platform depends on that sits on, or was minted from, a
# personal identity of the founder, plus the company-owned ones they move to: where each lives, who owns it
# today, where it is going and its status. Each stage plan of the programme flips its rows' status with an
# evidence_ledger entry. Names and locations only (publication_rule; Decision 101).
contract:
  id: account-credential-inventory
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "PLAN-account-credential-inventory"
  description: >-
    The register of every account, credential and identifier the platform depends on, its owning side
    today, its company target and its status, with an append-only evidence ledger. Standing: it outlives
    the company-cutover programme as the company's identifier map. Executes nothing itself.
  subject: account-credential-inventory
  evaluator:
    check: validate_account_credential_inventory
