publication_rule: >-
  This file is public. A row may name: the provider and that an account exists there; an item's name as it
  appears in Terraform, a workflow, a Secrets Manager entry or a registry; its kind; the repository path or
  console that holds it; the owning side (owner_values); the target; rec ids; a status; an expiry date already
  public; a closed rec as "rec-NNNN closed <date>". A row never carries: a value or fragment of one; an
  account, organisation, project, installation or numeric user id; an ARN; a mailbox, phone or postal address
  (a role alias is named by its role, never by its address); a card, invoice or tax detail beyond payer
  personal, company or none; a login identity (username, signing-in mailbox, 2FA method, recovery channel);
  an open weakness (for example missing MFA or mail authentication, a dormant key, console use). A weakness
  is a warehouse recommendation until closed, and the row then cites only its closure. A fact this rule
  excludes stays in the operator's private copy (outside the repository) and the cell reads operator-held.
  validate_account_credential_inventory rejects an at-sign, a 12-digit run, an ARN prefix and the Neon id shapes
  anywhere in this file; the rest of this rule is enforced by review.

programme:
  name: company-cutover
  phase: open
  phase_values: [open, closed]
  stages: [github_transfer, aws_account, neon, anthropic, everything_else, close_out, none]
  closed_requires: >-
    Every row and billing row is terminal: its status is in terminal_statuses, or it follows a row that is.
    The close-out plan flips phase to closed; from then the check fails on any row that is not terminal.

status_values:
  personal: On the founder's personal identity; nothing moved yet.
  pre-staged: The company successor exists alongside the personal one.
  moved: On the company identity, not yet proven live.
  proven: Proven live on the company identity.
  retired: The personal predecessor, or the item itself, is removed.
  stays: Remains with the founder by a recorded ruling.
  company: Company-owned already.
  follows: >-
    Bound to another row (follows), not to a person; takes that row's outcome while the item survives
    that row's move. A plan that re-creates the item instead (for example an AWS rebuild) gives the row its own
    status.
  unknown: Owning side not yet read back by the operator.
  out-of-scope: The operator ruled it is not migrated by this programme.
evidence_required: [pre-staged, moved, proven, retired, stays, company, out-of-scope]
terminal_statuses: [proven, retired, stays, company, out-of-scope]
owner_values: [founder, company, account, none, unknown]
payer_values: [personal, company, none]

maintenance:
  stage_rule: >-
    A plan that moves, proves or retires an item flips the row's status, updates its owner_today (or a billing
    row's payer) and appends one evidence_ledger entry in the same PR, citing the PR, plan, rec or Decision that
    proves it. Owning side agrees with status: proven rows are the company's, company rows the company's (a
    billing row's payer may be none), retired rows the company's or none, stays rows the founder's. Rows are
    never reordered or deleted; an item that is gone is retired.
  forward_rule: >-
    A new account, credential or identifier the platform depends on gets a row in the PR that first consumes
    it (a precedent, not mechanised).
  minted_for_transfer: >-
    The successors minted broad for the GitHub transfer are registered in github-org-transfer.yaml
    (transfer_credentials, rec-4537). Rows here track their personal predecessors and flip to retired as
    rec-4538 proves each removal.
  single_home: >-
    This contract is the only home of every column it publishes. The operator's private copy (outside the
    repository) holds only the cells the publication_rule excludes, keyed by row id. A row's location says
    where to find the item for ownership tracking; where docs/contracts/project-configuration.yaml has a row
    for the setting, that contract owns the setting's home (Decision 224) and a row here may carry a ref to it.
  review:
    last_full_review: "2026-10-21"
    cadence: >-
      Each stage plan re-reads its rows. Once programme.phase is closed, a full review at least quarterly
      (CIS Controls v8 safeguard 5.1).

