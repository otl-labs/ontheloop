version: 1
contract_version: 1
status: ratified
ratified_at: "2026-06-29"
ratified_via: "PLAN-build-lambda-yaml (T-1.16)"
last_verified: "2026-06-29"
decisions_cited:
  - Decision-79  # build_lambda.py is not Lambda-packaged; reads-YAML at build time is safe
  - Decision-80  # equivalence check lives in pytest only, not a bespoke validate.py check
  - Decision-86  # prose->contract extract-and-retire routing
  - Decision-99  # DuckDB version pin stays SSOT'd in config/lambda/ducklake/version.yaml
  - CD.24        # manifest-driven artifact bundling
  - CD.25        # pre-codegen contract ratification series
note: >-
  Authored fresh from live build_lambda.py (2026-06-29). DuckDB version pin omitted -- SSOT
  in config/lambda/ducklake/version.yaml per Decision 99. PROD_DEPS/DUCKLAKE_DEPS omitted as
  volatile implementation detail. CLI flag defaults (--profile, --region) are OUT of registry
  scope; the equivalence test compares flag-name sets only.
tool: scripts/build_lambda.py

size_limit_bytes: 262144000  # 262 MB hard ceiling; exceeding fails the build (not a warn)

pipelines:
  prod:
    invocation: "python -m scripts.build_lambda"
    artifacts:
      - data-pipeline.zip
      - data-pipeline-deps-layer.zip
  ducklake:
    invocation: "python -m scripts.build_lambda --ducklake-only"
    artifacts:
      - ducklake-writer.zip
      - ducklake-reader.zip
      - ducklake-maintenance.zip
      - ducklake-maintenance-smoke.zip
      - ducklake-catalog-dr.zip
      - ducklake-telemetry-writer.zip
      - ducklake-telemetry-reader.zip
      - ducklake-deps-layer.zip
      - ducklake-extensions-layer.zip
      - ducklake-pgclient-layer.zip

deploy_targets:
  prod_functions:  # each deploys data-pipeline.zip
    - agent-platform-scheduled-agent-dispatcher
    - agent-platform-findings-processor
  ducklake_function_zip_keys:
    agent-platform-ducklake-writer: lambda-packages/ducklake-writer.zip
    agent-platform-ducklake-reader: lambda-packages/ducklake-reader.zip
    agent-platform-ducklake-maintenance: lambda-packages/ducklake-maintenance.zip
    agent-platform-ducklake-maintenance-smoke: lambda-packages/ducklake-maintenance-smoke.zip
    agent-platform-ducklake-catalog-dr: lambda-packages/ducklake-catalog-dr.zip
    agent-platform-ducklake-telemetry-writer: lambda-packages/ducklake-telemetry-writer.zip
    agent-platform-ducklake-telemetry-writer-smoke: lambda-packages/ducklake-telemetry-writer.zip
    agent-platform-ducklake-telemetry-reader: lambda-packages/ducklake-telemetry-reader.zip
  ducklake_layer_names:
    - ducklake-deps-layer
    - ducklake-extensions-layer
    - ducklake-pgclient-layer

# deploy_record field semantics (Decision 103 reachability oracle; PLAN-convergence-health-prod-
# drift-red). The JSON blob write_deploy_record() (scripts/build_lambda_deploy.py) writes to
# deploy-records/<channel>/<function>.json and read_deploy_record() reads back, consumed by
# scripts.convergence_health.detect_ducklake_code_drift / detect_prod_code_drift.
deploy_record:
  shape:
    function: "str -- the deployed Lambda function name"
    code_sha256: "str -- CodeSha256 from the update-function-code response"
    source_git_sha: "str | null -- os.environ.get(GITHUB_SHA) at deploy time; null for a break-glass local deploy (no GITHUB_SHA set)"
    deployed_at: "str -- ISO8601 UTC timestamp of the deploy"
  freshness_semantics: >-
    Freshness is REACHABILITY, not equality: a deploy record is fresh iff the latest
    watched-source commit reachable FROM its recorded source_git_sha equals the latest
    watched-source commit on HEAD (git log -1 --format=%H <recorded_sha> -- <pathspecs>). A
    push-triggered deploy sets source_git_sha to the exact commit that touched source; a
    workflow_dispatch recovery deploy can set it to a LATER commit that never itself touches
    source -- both are correctly fresh under this oracle. Bare equality (the pre-fix defect)
    reported the latter as stale, which is what let a correct workflow_dispatch recovery deploy
    look drifted.
  null_source_git_sha: >-
    A null source_git_sha (break-glass local deploy, scripts.build_lambda [--ducklake-only]
    --deploy run outside CI with no GITHUB_SHA set) is deliberately treated as STALE, never
    fresh -- fail closed on uncertainty. write_deploy_record's GITHUB_SHA semantics are never
    changed to work around this; the record stays an honest statement of which commit was
    deployed, and the sensor's comparison is what changed.

# Flag DEFAULTS (--profile: $AWS_PROFILE else agent_platform via scripts.aws_profile.resolve_aws_profile; --region=eu-west-2) are OUT of registry scope.
# The equivalence test compares flag-name sets only.
cli_flags:
  - --skip-upload
  - --bucket
  - --profile
  - --region
  - --deploy
  - --ducklake-only
  - --list-bundle
  - --ducklake-functions
  - --ducklake-deploy-only
  - --ducklake-publish-canary-layers

verified_against:
  - "scripts/build_lambda.py (LAMBDA_SIZE_LIMIT_BYTES, _LAMBDA_FUNCTION_NAMES, _DUCKLAKE_FUNCTION_ZIP_KEYS, DUCKLAKE_LAYER_NAMES, build_parser() flags)"

# Deploy CHANNEL per build-artifact class (Decision 125). Pointer-only: the authoritative
# apply-model / guard classification lives SOLELY in docs/contracts/environment-taxonomy.yaml
# section 5 (Decision 92 point 5 sole-SoT) -- this section names which channel-class each
# artifact belongs to, it does not restate the classification itself.
deploy_channels:
  ducklake_functions:  # ducklake_function_zip_keys targets above
    root: terraform/personal
    channel_class: terraform_personal_ignore_changes_decoupled  # #544 landed the decoupling (Decision 125/126)
    see: docs/contracts/environment-taxonomy.yaml (conformance)
    governed_channel: .github/workflows/deploy-ducklake-lambdas.yml  # Decision 236 nine-job topology (supersedes the T2.38 five-job split): the DEFAULT channel -- push-to-main (ducklake source paths) or workflow_dispatch; assumes the merged agent-platform-github-ci-deploy role (T2.49 / DEP-12, UpdateFunctionCode-only on function:agent-platform-*). deploy-maintenance builds+uploads ALL artifacts once and deploys maintenance + maintenance-smoke (ungated) -> maintenance-smoke + reconcile-gate (the latter invoking validate_reconcile_pending_gate --deploy-gate, refusing the serving and telemetry legs while any reconcile_scope=ducklake table has a non-empty pending_reconcile) -> deploy-serving (--ducklake-deploy-only for writer, reader and catalog-dr) -> smoke (--lambda-attach/--lambda-reader); deploy-telemetry-twin (the smoke-pinned telemetry writer twin, ungated) -> telemetry-twin-smoke (--lambda-telemetry-smoke, after maintenance-smoke and deploy-serving) -> deploy-telemetry (telemetry-writer and telemetry-reader, success-only behind reconcile-gate and telemetry-twin-smoke, and skipped while a reconcile_scope=telemetry_catalog table has a pending column (validate_reconcile_pending_gate --telemetry-hold)) -> telemetry-smoke (--lambda-telemetry-production, the production writer's light gate, then --lambda-telemetry-reader)
    break_glass_only: "bin/venv-python -m scripts.build_lambda --ducklake-only --deploy"  # genuinely NON-DEFAULT now that governed_channel exists (T2.38) -- retained as a fallback for when the governed channel cannot run (mirrors the agent_platform_admin human-gated IAM-apply precedent), not the routine agent path
  prod_functions:  # data-pipeline.zip targets above
    root: terraform/personal  # T2.43: provisioned in terraform/personal/prod_lambdas.tf
    channel_class: decoupled_build_pipeline
    see: src/data/handlers/CLAUDE.md
    governed_channel: .github/workflows/deploy-prod-lambdas.yml  # T2.43: the DEFAULT channel -- push-to-main (prod source paths) or workflow_dispatch; assumes the merged agent-platform-github-ci-deploy role (T2.49 / DEP-12, UpdateFunctionCode-only on function:agent-platform-*, shared with deploy-ducklake-lambdas.yml), runs build_lambda --deploy, gates on a per-function smoke invocation
    break_glass_only: "bin/venv-python -m scripts.build_lambda --deploy"  # genuinely NON-DEFAULT now that governed_channel exists (T2.43) -- retained as a fallback for when the governed channel cannot run (mirrors the agent_platform_admin human-gated IAM-apply precedent), not the routine agent path
