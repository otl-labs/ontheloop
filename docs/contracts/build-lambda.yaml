version: 1
contract_version: 1
status: ratified
ratified_at: "2026-06-29"
ratified_via: "PLAN-build-lambda-yaml (T-1.16)"
last_verified: "2026-06-29"
decisions_cited:
  - Decision-79  # build_lambda.py is not Lambda-packaged; reads-YAML at build time is safe
  - Decision-80  # equivalence check lives in pytest only, not a bespoke validate.py check
  - Decision-86  # prose->contract extract-and-retire routing
  - Decision-99  # DuckDB version pin stays SSOT'd in config/lambda/ducklake/version.yaml
  - CD.24        # manifest-driven artifact bundling
  - CD.25        # pre-codegen contract ratification series
note: >-
  Authored fresh from live build_lambda.py (2026-06-29). DuckDB version pin omitted -- SSOT
  in config/lambda/ducklake/version.yaml per Decision 99. PROD_DEPS/DUCKLAKE_DEPS omitted as
  volatile implementation detail. CLI flag defaults (--profile, --region) are OUT of registry
  scope; the equivalence test compares flag-name sets only.
tool: scripts/build_lambda.py

size_limit_bytes: 262144000  # 262 MB hard ceiling; exceeding fails the build (not a warn)

pipelines:
  prod:
    invocation: "python -m scripts.build_lambda"
    artifacts:
      - data-pipeline.zip
      - data-pipeline-deps-layer.zip
  ducklake:
    invocation: "python -m scripts.build_lambda --ducklake-only"
    artifacts:
      - ducklake-writer.zip
      - ducklake-reader.zip
      - ducklake-maintenance.zip
      - ducklake-maintenance-smoke.zip
      - ducklake-catalog-dr.zip
      - ducklake-telemetry-writer.zip
      - ducklake-telemetry-reader.zip
      - ducklake-deps-layer.zip
      - ducklake-extensions-layer.zip
      - ducklake-pgclient-layer.zip

deploy_targets:
  prod_functions:  # each deploys data-pipeline.zip
    - agent-platform-scheduled-agent-dispatcher
    - agent-platform-findings-processor
    - agent-platform-workflow-dispatcher
  ducklake_function_zip_keys:
    agent-platform-ducklake-writer: lambda-packages/ducklake-writer.zip
    agent-platform-ducklake-reader: lambda-packages/ducklake-reader.zip
    agent-platform-ducklake-maintenance: lambda-packages/ducklake-maintenance.zip
    agent-platform-ducklake-maintenance-smoke: lambda-packages/ducklake-maintenance-smoke.zip
    agent-platform-ducklake-catalog-dr: lambda-packages/ducklake-catalog-dr.zip
    agent-platform-ducklake-telemetry-writer: lambda-packages/ducklake-telemetry-writer.zip
    agent-platform-ducklake-telemetry-writer-smoke: lambda-packages/ducklake-telemetry-writer.zip
    agent-platform-ducklake-telemetry-reader: lambda-packages/ducklake-telemetry-reader.zip
  ducklake_layer_names:
    - ducklake-deps-layer
    - ducklake-extensions-layer
    - ducklake-pgclient-layer

# deploy_record field semantics (Decision 103 reachability oracle; PLAN-convergence-health-prod-
# drift-red). The JSON blob write_deploy_record() (scripts/build_lambda_deploy.py) writes to
# deploy-records/<channel>/<function>.json and read_deploy_record() reads back, consumed by
# scripts.convergence_health.detect_ducklake_code_drift / detect_prod_code_drift.
deploy_record:
  shape:
    function: "str -- the deployed Lambda function name"
    code_sha256: "str -- CodeSha256 from the update-function-code response"
    source_git_sha: "str | null -- LAMBDA_ARTIFACT_SHA (the commit the deploy gate chose), else GITHUB_SHA, at deploy time; null for a break-glass local deploy (neither set)"
    deployed_at: "str -- ISO8601 UTC timestamp of the deploy"
    schema_version: "int -- 2 for a record carrying the four keys below; a record without it is version 1 (the four keys above only)"
    run_id: "str | null -- GITHUB_RUN_ID of the deploying workflow run; null for a break-glass local deploy"
    run_attempt: "str | null -- GITHUB_RUN_ATTEMPT of that run; null for a break-glass local deploy"
    trigger: "str -- GITHUB_EVENT_NAME of that run (e.g. workflow_run, workflow_dispatch); break_glass when unset"
    workflow: "str | null -- GITHUB_WORKFLOW of that run; null for a break-glass local deploy"
  freshness_semantics: >-
    Freshness is REACHABILITY against the newest green commit (Decision 249): the sensor's target is the newest main
    commit whose full tier passed and whose CI run settled 45 minutes ago (scripts.ci.deploy_gate.newest_green_sha). A
    record is fresh iff the latest watched-source commit reachable FROM its source_git_sha (git log -1 --format=%H
    <recorded_sha> -- <pathspecs>) equals the latest watched-source commit at the target, or the record is ahead of the
    target (git merge-base prints the target's). An independent 6 h ceiling applies the same rule against HEAD, so a
    resolver defect cannot silence the alarm; a resolver failure falls back to HEAD. A workflow_dispatch recovery deploy
    can set the record to a LATER commit that never touches source; that is fresh, where bare equality reported it stale.
  null_source_git_sha: >-
    A null source_git_sha (break-glass local deploy, scripts.build_lambda [--ducklake-only]
    --deploy run outside CI with neither LAMBDA_ARTIFACT_SHA nor GITHUB_SHA set) is deliberately treated as STALE, never
    fresh -- fail closed on uncertainty. write_deploy_record never fabricates a sha: it records LAMBDA_ARTIFACT_SHA, then
    GITHUB_SHA (Decision 249; under workflow_run GITHUB_SHA is main HEAD and cannot be overridden), else null.
  history: >-
    The data_lake bucket's versioning (terraform/personal/main.tf aws_s3_bucket_versioning.data_lake, Enabled) keeps
    every overwritten record as a noncurrent version, so a record's version list is the append-only deploy history,
    keyed by channel and function in the record's key (deploy-records/<channel>/<function>.json): one version per write,
    and the governed channels write one per successful function deploy (grain: function x deploy; a failed update writes
    no record and stays in its run's log). Other principals that can write the bucket could add a version, so the run
    facts are self-asserted: a schema_version 2 version a governed run writes names that run (run_id, run_attempt,
    workflow), which a reader confirms against the Actions run before trusting the version, and a break-glass version
    carries trigger break_glass and null run facts. Versions written before schema_version 2 carry only the four
    original keys; on 2026-11-17 the earliest surviving version was dated 2026-07-13. Append-only holds while no
    lifecycle rule expires noncurrent versions under deploy-records/ and no principal deletes object versions there (no
    IAM deny enforces the second yet); no lifecycle rule may expire them
    (tests/checks/iam_tf/test_ducklake_maintenance_tf_invariants.py::TestDataLakeLifecycleGoverned::test_no_rule_reclaims_deploy_record_history).
    Consumer: the fix-proof effective day of the fix-attempt stamp (rec-5078), the earliest version per function whose
    source_git_sha has the fix commit as an ancestor; source_git_sha is evidence of what shipped, never the last-green
    authority (Decision 254 cl.2). Readers list versions with a role that can list them: the deploy role is
    PutObject-only on deploy-records/ and agent sessions have no S3 read (Decision 256), so no named verb serves the
    history until a journal load copies it (rec-5077 designs that journal's writer). The history is per account: when
    SIT stands, the effective day re-keys to the SIT deploy (Decision 252 cl.6, Decision 254 sit-stood-up; rec-5028,
    rec-5033), and replicating deploy-records/ into SIT is out of scope here.

# Flag DEFAULTS (--profile: $AWS_PROFILE else agent_platform via scripts.aws_profile.resolve_aws_profile; --region=eu-west-2) are OUT of registry scope.
# The equivalence test compares flag-name sets only.
cli_flags:
  - --skip-upload
  - --bucket
  - --profile
  - --region
  - --deploy
  - --ducklake-only
  - --list-bundle
  - --ducklake-functions
  - --ducklake-deploy-only
  - --ducklake-publish-canary-layers

verified_against:
  - "scripts/build_lambda.py (LAMBDA_SIZE_LIMIT_BYTES, _LAMBDA_FUNCTION_NAMES, _DUCKLAKE_FUNCTION_ZIP_KEYS, DUCKLAKE_LAYER_NAMES, build_parser() flags)"

# Deploy CHANNEL per build-artifact class (Decision 125). Pointer-only: the authoritative
# apply-model / guard classification lives SOLELY in docs/contracts/environment-taxonomy.yaml
# section 5 (Decision 92 point 5 sole-SoT) -- this section names which channel-class each
# artifact belongs to, it does not restate the classification itself.
deploy_channels:
  ducklake_functions:  # ducklake_function_zip_keys targets above
    root: terraform/personal
    channel_class: terraform_personal_ignore_changes_decoupled  # #544 landed the decoupling (Decision 125/126)
    see: docs/contracts/environment-taxonomy.yaml (conformance)
    governed_channel: .github/workflows/deploy-ducklake-lambdas.yml  # Decision 236 nine-job topology (supersedes the T2.38 five-job split): the DEFAULT channel -- wakes on each completed CI push run on main and deploys the newest main commit whose full tier passed (Decision 249; .github/workflows/deploy-gate.yml, scripts/ci/deploy_gate.py; watched paths = scripts.convergence_health *_SOURCE_PATHSPECS), or workflow_dispatch (same target, force redeploys it); the workflow files and `deploy_gate resolve` run at main HEAD, `deploy_gate freshness` and the build at the gate sha; assumes the merged agent-platform-github-ci-deploy role (T2.49 / DEP-12, UpdateFunctionCode-only on function:agent-platform-*). deploy-maintenance builds+uploads ALL artifacts once and deploys maintenance + maintenance-smoke (ungated) -> maintenance-smoke + reconcile-gate (the latter invoking validate_reconcile_pending_gate --deploy-gate, refusing the serving and telemetry legs while any reconcile_scope=ducklake table has a non-empty pending_reconcile) -> deploy-serving (--ducklake-deploy-only for writer, reader and catalog-dr) -> smoke (--lambda-attach/--lambda-reader); deploy-telemetry-twin (the smoke-pinned telemetry writer twin, ungated) -> telemetry-twin-smoke (--lambda-telemetry-smoke, after maintenance-smoke and deploy-serving) -> deploy-telemetry (telemetry-writer and telemetry-reader, success-only behind reconcile-gate and telemetry-twin-smoke, and skipped while a reconcile_scope=telemetry_catalog table has a pending column (validate_reconcile_pending_gate --telemetry-hold)) -> telemetry-smoke (--lambda-telemetry-production, the production writer's light gate, then --lambda-telemetry-reader)
    break_glass_only: "bin/venv-python -m scripts.build_lambda --ducklake-only --deploy"  # genuinely NON-DEFAULT now that governed_channel exists (T2.38) -- retained as a fallback for when the governed channel cannot run (mirrors the agent_platform_admin human-gated IAM-apply precedent), not the routine agent path
  prod_functions:  # data-pipeline.zip targets above
    root: terraform/personal  # T2.43: provisioned in terraform/personal/prod_lambdas.tf and scheduled_workflow_dispatch.tf
    channel_class: decoupled_build_pipeline
    see: src/data/handlers/CLAUDE.md
    governed_channel: .github/workflows/deploy-prod-lambdas.yml  # T2.43: the DEFAULT channel -- wakes on each completed CI push run on main and deploys the newest main commit whose full tier passed (Decision 249; .github/workflows/deploy-gate.yml, scripts/ci/deploy_gate.py; watched paths = scripts.convergence_health *_SOURCE_PATHSPECS), or workflow_dispatch (same target, force redeploys it); the workflow files and `deploy_gate resolve` run at main HEAD, `deploy_gate freshness` and the build at the gate sha; assumes the merged agent-platform-github-ci-deploy role (T2.49 / DEP-12, UpdateFunctionCode-only on function:agent-platform-*, shared with deploy-ducklake-lambdas.yml), runs build_lambda --deploy, gates on a per-function smoke invocation
    break_glass_only: "bin/venv-python -m scripts.build_lambda --deploy"  # genuinely NON-DEFAULT now that governed_channel exists (T2.43) -- retained as a fallback for when the governed channel cannot run (mirrors the agent_platform_admin human-gated IAM-apply precedent), not the routine agent path
