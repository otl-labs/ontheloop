version: 1
last_updated: "2026-07-24"
decisions_cited:
  - Decision-76
  - Decision-84
  - Decision-86
  - Decision-90
  - Decision-92
  - Decision-102
  - Decision-103
  - Decision-104
  - Decision-105
  - Decision-150
summary: >-
  A candidate_decision (CD.NN) whose gated work is realized needs a lane that RATIFIES it --
  distinct from AUTHORING a fresh Decision (ops_data_portal file_decision) or CITING one
  (decision-scout). This contract defines the canonical ratified-CD shape, the surfacing
  signal that flags a CD as ready, the R1/R2/R3 referential guard that enforces the shape,
  and the shared lane steps across /orient, /plan, and /implement (no new top-level command).
  This file is intentionally non-ritual (Class D mechanism contract, migration-step-3-grandfathering
  T2.56 migration step 3 -- see the `contract:` block above), never a Class A/B/C ritual contract.

canonical_ratified_shape:
  description: >-
    The required field combination on a candidate_decisions[] entry once it ratifies.
    Enforced by scripts/checks/roadmap/validate_candidate_decision_ratification.py.
  state:
    value: "ratified"
  ratified_as:
    type: "str"
    semantics: "'dec-NNN' -- the 3-digit DECISIONS.md decision number. Authoritative referential key (R1)."
  filed_via:
    type: "str"
    semantics: >-
      'ops_decisions:dec-NNN' -- same NNN as ratified_as. This is the vehicle-note format
      already enforced by DocumentMeta.filed_via's field_validator; CandidateDecision.filed_via
      has no such validator today, which is why this guard exists.
  precedents: >-
    CD.16/CD.24 -> Decision 79 (dec-079); CD.31 -> Decision 78 (dec-078); CD.33 -> Decision 81
    (dec-081); CD.22 -> Decision 85 (dec-085); CD.35 -> Decision 92 (dec-092); CD.36 -> Decision
    103 (dec-103). Five of these seven pre-existing ratified CDs pointed at retired 4-digit
    warehouse ids (dec-1085/1086/1089/1091) before Decision 105 reconciled them onto the real
    3-digit DECISIONS.md numbers.

affects_field:
  field: affects
  type: "list[str]"
  location: "CandidateDecision.affects (scripts/platform_roadmap_models.py)"
  semantics: >-
    In-scope-of, never completion-blocking (PLAN-roadmap-blocking-edge-semantics -- splits the
    former overloaded gates field into two edge types: gates stays completion-blocking, affects
    is the non-gating "this CD's work touches these items" relationship, e.g. CD.17's freeze
    scope). A tier_item named in a CD's affects is within that CD's scope of impact but its
    completion is NOT gated on the CD ratifying -- gate derivation (see necessary_not_sufficient
    below) keys on gates only, which affects deliberately does not populate.
    realization_candidates() and blocked_on_cd() (scripts/platform_roadmap_state.py) both treat
    an empty-gates CD carrying affects as non-gating: no vacuous-True realization surfacing, no
    completion_blocked_on_cd entry.
  computed_by: "Read directly off CandidateDecision.affects; no dedicated projection helper."

surfacing_signal:
  field: realization_evidence
  type: "str | None"
  location: "CandidateDecision.realization_evidence (scripts/platform_roadmap_models.py)"
  semantics: >-
    Free-text evidence that a pending CD's gated work is realized/live, set by whoever notices
    (audit, /orient session, planning). Truthy realization_evidence on a state==pending CD makes
    it eligible for the ratification lane. A pending CD with no realization_evidence is NOT
    surfaced -- forward-intent CDs (e.g. CD.29) stay invisible to the lane until evidence exists.
  computed_by: "PlatformRoadmapState.ratifiable_cds() -> included in to_preflight_dict['ratifiable_cds']"

second_signal_realized_but_pending:
  amendment_note: >-
    close-audit-ulf-02 amendment (2026-07-03), building on the Decision 105 lane -- adds a SECOND,
    lower-confidence surfacing signal, distinct from the deliberate realization_evidence signal above.
  field: detail
  type: "str"
  location: "CandidateDecision.detail (scripts/platform_roadmap_models.py)"
  semantics: >-
    A pending CD whose free-text detail carries a '[Realized' prose marker but has NOT (yet) been
    given structured realization_evidence is flagged for corroboration/ratification-review -- a
    weaker signal than ratifiable_cds() (Decision 55: a prose annotation is not the same as a
    deliberate corroboration decision). Ratification of such a CD promotes the prose marker into
    structured realization_evidence at ratify time (folding it into the canonical ratified_as/
    filed_via shape above), rather than leaving both a prose note and a separate evidence field.
    A pending CD that already carries realization_evidence belongs to ratifiable_cds(), never to
    this list -- the two lists are disjoint by construction.
  computed_by: >-
    PlatformRoadmapState.realized_but_pending_cds() -> included in
    to_preflight_dict['realized_but_pending_cds'] (full /orient projection only).

referential_guard:
  name: validate_candidate_decision_ratification
  owner: platform
  registered_in: "scripts/checks/registry.py pre_sequence() AND full_sequence() (governance writes gate pre-merge)"
  target: >-
    The `## Decision NNN:` headers in BOTH docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md
    (union; archive read only if present) -- git-tracked and hermetic. NOT the gitignored
    ops_decisions cache (CI PR roles lack reader access) and NOT a live warehouse read.
    Reading both files matters because resolved Decisions sweep from DECISIONS.md to
    DECISIONS_ARCHIVE.md over time; a DECISIONS.md-only guard would redden main on the first
    archival sweep of a ratified CD's Decision.
  rules:
    R1:
      applies_to: "state == ratified"
      rule: >-
        dec-NNN (from ratified_as, else the dec-NNN inside filed_via) MUST resolve to a
        '## Decision NNN:' header. If both ratified_as and filed_via are present, their
        NNN MUST agree.
    R2:
      applies_to: "state == pending"
      rule: >-
        MUST NOT carry ratified_as. filed_via MUST be absent or the literal
        'pending_log_decision_lambda' -- never a dec-NNN pointer.
      note: >-
        'pending_log_decision_lambda' is historical vocabulary meaning pending ratification via
        the live vehicle (the portal path) -- Decision 92 superseded the Lambda-based filing
        mechanism the literal originally named, but the literal itself is retained in R2.rule,
        not renamed (below-threshold cosmetic vocabulary drift; audit Q5). Load-time backstop for
        the sibling marking-convention failure mode (a pending CD that should have flipped):
        scripts/checks/roadmap/validate_candidate_decision_supersession.py (registered in both
        pre_sequence() and full_sequence()) fails a state==pending CD whose detail records
        "fully superseded by CD.NN" once CD.NN itself reaches state==ratified.
    R3:
      applies_to: "state == superseded"
      rule: "Exempt from R1 (a superseded CD's historical dec pointer, if any, is not re-verified)."
    R4:
      applies_to: "state == ratified"
      amendment_note: >-
        ESB-02 remediation wave 3 (audits/executor-substrate-and-billing-shape-ad02653.yaml),
        2026-08-02. No numbered Decision: R4 sits beside R1/R2/R3 on the same object in the same
        lane, and none of R1-R3 was minted as a numbered Decision either.
      rule: >-
        A ratified CD's own string discipline_points may declare ratification precondition ids via
        the `ratification precondition (XX-NN)` pattern. If it declares any, the CD's
        discipline_points list MUST also carry exactly one `{precondition_discharge: {...}}` DICT
        entry (the same shape as the existing `fallback_spec` / `resume_properties` /
        `stability_definition_14d` dict discipline_points -- discipline_points is the only legal
        home; a top-level `precondition_discharge` key on the CD object itself, sibling to
        discipline_points, does NOT satisfy this rule and is read as zero blocks) recording a
        non-empty entry for EVERY declared id (an entry may record an in-band lapse; a
        present-but-empty or missing entry for a declared id fails). A ratified CD declaring no
        precondition ids is a clean no-op -- R4 does not require a precondition_discharge block to
        exist at all in that case. Enforced by
        validate_candidate_decision_ratification, the same guard that already owns R1/R2/R3 and
        already loads the roadmap.

batch_wave_ratified_form:
  # Decision 150 (DCG-04 realization; audits/decision-consolidation-growth-f79d6b5.yaml Q2):
  # artifact rescope of THIS lane, not lane deletion -- the many-CDs -> one-shared-dec-NNN shape
  # was already exercised (CD.16/CD.24 -> dec-079 under Decision 79; Decision 105's own 5-CD
  # reconciliation) and is codified forward here as a first-class, citable form.
  shape: >-
    Same-session PURE gate-clear CD ratifications (no content beyond "this CD's gated work is
    realized") MAY land as ONE `## Decision N` wave entry instead of one entry per CD. Each
    bundled CD gets its own clause inside the shared entry, and each CD's ratified_as/filed_via
    points at the SAME shared dec-NNN.
  content_bearing_exception: >-
    A ratification that carries independent content -- a fresh architectural commitment, a
    narrowing/amendment of another Decision, anything beyond "this CD's work is realized" -- keeps
    its own entry and is never folded into a wave.
  r1_r3_compatibility: >-
    R1-R3 tolerate the wave form BY CONSTRUCTION, not by a special case: each CD is checked
    independently against the header-number population (see referential_guard.rules above), and
    R1 has no cross-CD ratified_as-uniqueness bar, so N CDs pointing at the same dec-NNN header
    all resolve individually. Live precedent: CD.16 and CD.24 both carry ratified_as=dec-079 /
    filed_via=ops_decisions:dec-079 against the single `## Decision 79:` header, ratified together
    under Decision 79.

lane_steps:
  orient:
    surface: >-
      /orient reads platform_roadmap.ratifiable_cds() (pending CDs with realization_evidence)
      as a distinct surfacing lane from item-centric parked-gated handling, and points any
      parked-gated item at the ratification lane instead of a dead-end note.
  plan:
    draft: >-
      A /plan session that realizes/ratifies a CD includes a ratification block: the drafted
      Decision text (including any reversal conditions) plus the exact portal + roadmap-flip
      commands to run at /implement time. The plan confirmation step + plan-critique are the
      human sign-off on the drafted Decision text -- ratification is the user's call, never
      unilateral. Fires when the plan's scope realizes the work a pending candidate_decision
      (CD.NN) gates, OR the CD was surfaced by /orient's "Ratifiable CDs" subsection
      (platform_roadmap.ratifiable_cds -- pending CDs carrying realization_evidence).

      Protocol (relocated from the planning skill's Candidate Decision Ratification section,
      PLAN-skills-layer-prose-relocation): (1) Confirm the CD's realization_evidence (or
      equivalent corroborating evidence gathered this session) actually establishes the gated
      work is realized/live -- do not draft a ratification for a forward-intent CD (Decision 55:
      no unilateral judgement calls; no evidence, no candidacy). (2) Add a ratification block to
      the plan (own section, distinct from scope/execution_steps) containing: the full drafted
      Decision text (title, body, any amendments to other Decisions/CDs it narrows or
      supersedes) -- including explicit reversal conditions if the ratified state could later be
      undone (e.g. a swap-back to a prior architecture); a ratification with no reversal
      conditions when the realized state is reversible is incomplete. The exact
      `bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md` (or --file-decision
      single-row alternative) command sequence /implement will run. The exact roadmap-flip diff:
      state: ratified + ratified_as: dec-NNN + filed_via: ops_decisions:dec-NNN (canonical shape;
      same NNN in both fields) on the target CD entry. Wave bundling: when >=2 same-session PURE
      gate-clear CDs realize together (no content beyond "this CD's work is realized"), draft ONE
      wave ## Decision N entry with a per-CD clause each, all pointing at the shared dec-NNN
      (batch_wave_ratified_form above) -- a content-bearing ratification keeps its own entry. (3)
      This is a DRAFT only. Do not run the portal write or the roadmap flip during /plan --
      Decision 105 / the plan's own constraints reserve execution for /implement behind an
      execution-time human confirmation gate. Planning-time writes would make the alignment
      sign-off meaningless (the write already done before the human signs off). (4) The
      alignment sign-off and the Critique Gate (plan-critique) ARE the human sign-off on
      the drafted Decision text -- do not add a separate approval step. If Decision-Scout flags a
      contradiction with the drafted text, resolve it before presenting. Numbering-race note:
      decision numbers are not reserved at draft time. Re-check the current max ## Decision NNN:
      header in docs/DECISIONS.md at /implement execution time -- a concurrent PR may have
      claimed the drafted number. The referential guard (validate_candidate_decision_ratification)
      catches any resulting header mismatch, so shifting to the next free number at execution
      time is safe.
  implement:
    execute: >-
      After explicit execution-time human confirmation (never before), /implement: (1) authors
      the DECISIONS.md entry, (2) ETLs it via `scripts.ops_data_portal --backfill-decisions-md`
      (`--file-decision` is the single-row alternative; Single Portal Invariant, Decision 84),
      (3) flips the CD to the canonical ratified shape in docs/ROADMAP-PLATFORM.yaml, (4)
      re-runs session_preflight to confirm the completion/blocking gate cleared. (5) Marking-
      convention obligation (audit PCD-03): if ratifying this CD makes any OTHER state==pending
      CD's detail read "fully superseded by CD.NN" against the now-ratified CD.NN, flip that
      other CD to state=superseded in the same edit (CD.14 canonical superseded shape --
      ratified_as/filed_via stay absent, R3 exempts it from R1);
      validate_candidate_decision_supersession is the load-time backstop that fails the PR if this
      is missed. (6) Pending-window prose sweep (audit PCD-05): sweep any pending-tense
      discipline_points/detail prose on CDs touched by this ratification that assumed the CD was
      still pending, so stale pending-tense assertions do not survive the flip.

      Full protocol (relocated from the implement skill's CD Ratification Bookkeeping section,
      PLAN-skills-layer-prose-relocation): this step fires ONLY when the approved plan carries a
      ratification block, and NEVER runs without the explicit execution-time human confirmation
      in step 2 below. (1) Locate the ratification block in the approved plan (drafted Decision
      text, reversal conditions if applicable, and the exact portal + roadmap-flip commands). (2)
      STOP and obtain explicit execution-time human confirmation of the Decision text before any
      write. Plan approval (the planning skill's alignment sign-off + Critique Gate) is sign-off on the
      drafted text; it is NOT authorization to execute the write. Re-present the drafted Decision
      text verbatim and wait for an explicit go-ahead in THIS session. Do not proceed on an
      assumed or inferred yes. (3) Author the DECISIONS.md entry using the confirmed text. Before
      assigning the number, re-check the current max ## Decision NNN: header (numbering-race
      note: a concurrent PR may have claimed the drafted number since /plan ran -- shift to the
      next free number if so, and update the ratified_as/filed_via targets in the same edit). (4)
      ETL via the Single Portal Invariant (Decision 84):
      `bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md` (the --file-decision
      single-row form is the alternative for a single entry). Confirm the new dec-NNN row(s) are
      present in logs/.decisions-index.jsonl after the sync. NEVER edit the JSONL cache directly.
      (5) Flip the CD in docs/ROADMAP-PLATFORM.yaml to the canonical shape: state: ratified +
      ratified_as: dec-NNN + filed_via: ops_decisions:dec-NNN (same NNN in both fields). If the
      plan's ratification block calls for truth-maintenance edits to the CD's body (e.g. a stale
      mechanism description contradicted by the ratified reality), apply them in the SAME edit --
      do not leave the body describing a superseded mechanism after the flip (mirrors the
      exit-criteria realized-differently rule, docs/contracts/exit-criteria-ledger.yaml's
      fields.status semantics). (6) Re-run `bin/venv-python -m scripts.session.preflight` (or
      `-m scripts.roadmap.platform_roadmap` for the full dict if the slim preflight payload omits
      the field you need) and confirm the ratified CD no longer appears in blocked_on_cd /
      completion_blocked_on_cd for any item it was gating. (7) Run
      `bin/venv-python -m scripts.validate --pre` -- the diff selects
      validate_candidate_decision_ratification, which must pass against the new dec-NNN header.
      (8) Do NOT flip any tier_item status as part of this step. An item that fully unparks
      (every gating CD ratified AND zero open criteria) is a separate Tier_item bookkeeping
      decision (docs/contracts/tier-item-lifecycle.yaml#bookkeeping_walk) -- note in the PR body
      which items became unpark-eligible, if any, but let the normal bookkeeping walk decide
      status flips (Decision 90). Batch-wave bundling (Decision 150, >=2 same-session PURE
      gate-clear CDs): when the ratification block bundles >=2 same-session PURE gate-clear CDs
      (no content beyond "this CD's work is realized"; a content-bearing ratification is never
      bundled), steps 3 (author ONE ## Decision N wave entry, one clause per CD) and 4 (ETL)
      above run ONCE FOR THE WHOLE WAVE, but the three PER-CD sub-steps -- step 5's roadmap-flip
      (each CD's own ratified_as/filed_via pointing at the SHARED dec-NNN), the marking-convention
      obligation, and the pending-window prose sweep (sub-steps 5-6 above) -- REPEAT ONCE PER
      BUNDLED CD. Steps 6 (preflight) and 7 (validate) run once over all bundled CDs. Step 8
      (tier_item status flips stay a separate bookkeeping step) is unchanged. Rejection handling:
      if the human declines to confirm the Decision text in step 2 (asks for edits, defers, or
      says no), do NOT proceed to steps 3-8. Either incorporate the requested edits and
      re-present, or stop the ratification portion of the plan entirely and report which steps
      were skipped. A plan whose non-ratification scope is otherwise complete may still
      commit/merge without the ratification having executed -- ratification is additive, not a
      blocking prerequisite for the rest of the plan.

necessary_not_sufficient: >-
  Ratifying a CD clears the COMPLETION gate on items named in its gates field (gate derivation
  keys on gates, together with cd.state == 'pending' -- affects deliberately does NOT populate
  gate derivation; see affects_field above). scripts/platform_roadmap_state.py's blocked_on_cd
  / to_preflight_dict compute this. It does NOT close those items' open CODE exit criteria, and
  does NOT cascade to unrelated items whose own gating CDs remain pending. Tier_item status
  flips (Decision 90 bookkeeping) are a separate /implement step from the ratification itself.
