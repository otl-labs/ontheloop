projection_id: ci-rca-lifecycle
version: 1
status: active
ratified_via: >-
  PLAN-ci-rca-identity-lifecycle merge to main (Decision 142)
description: >-
  Fingerprint v2 + status-aware chain lifecycle fields for source=ci_rca recommendations. All
  fields ride in context_v2_json (CiRcaContext, scripts/ops_portal/ci_rca_schema.py) -- NO new
  Class A columns are added to ops_recommendations (Decision 84/103/63); fix-state is not
  denormalized onto the rec row.

# PLAN-pr-ci-red-ownership: the single home for the per-branch CI-red disposition. AGENTS.md's
# Merge protocol and the implement skill's red-CI branch both point here rather than restate it
# (Decision 86 anti-duplication) -- this is the source of truth for which branch's CI failure
# gets a ci-rca rec, and what happens on the other branch.
trigger_scope:
  gate: >-
    ci-rca.yml's job-level `if:` requires github.event.workflow_run.head_branch ==
    github.event.repository.default_branch (alongside the failure and same-repo conditions).
    Every completed run of a watched workflow (config/ci_rca_taxonomy.yaml's `workflows:` filter,
    e.g. "CI") emits a workflow_run event regardless of what triggered that run underneath --
    push or pull_request alike -- and it is THIS job-level condition, not the workflow_run
    trigger itself, that rejects a PR/feature-branch run's completion. No PR/feature-branch run's
    completion satisfies this condition regardless of its conclusion (T1.13 c6, already met).
  narrowing_authority: >-
    Decision 73 point 3 is the authority behind the gate, not the gate alone: "On full-tier
    failure on `main`, `ci-rca` files a `priority="critical"`, `source="ci_rca"` rec; the rec
    hard-blocks the planning queue (L5) and pauses PR auto-merge (L6) until a forward-fix
    lands." Decision 73 point 2 sends the full tier to push-to-main and the hourly L8 drift
    canary -- both produce workflow_run events whose head_branch is main, which is exactly what
    the gate above mechanises. Decision 226 amends that clause: see default_branch_disposition.
  default_branch_disposition: >-
    A post-merge full-tier failure on main: ci-rca diagnoses and files the rec (Decision 72 + Decision
    73 point 3, as amended by Decision 226); recovery follows docs/contracts/red-main-recovery.yaml --
    the track sets the priority, a Track A repair takes its fast_lane_repair procedure, a Track B
    repair goes through /plan or a manual revert PR, and the plan-time block is red_overlap's verdict
    (Decision 55 RCA-first: never auto-revert, never an inline workaround outside these routes).
  pr_branch_disposition: >-
    A PR-branch `--pre` (fast-tier) failure is UNCOVERED BY CONSTRUCTION, not by omission --
    though a workflow_run event IS emitted for it. ci-rca.yml subscribes to workflow_run on the
    "CI" workflow; ci.yml is `name: CI` and runs on both `push` (main) and `pull_request` (main), so a
    PR's CI run DOES emit workflow_run:completed when it finishes. The job-level `if:` (the gate
    field above) then REJECTS that event because head_branch is the PR branch, not the repository
    default branch -- the sibling head_repository.full_name fork check on that same `if:` exists
    precisely because PR runs reach it and must be filtered there, not upstream. So no ci-rca rec
    is filed and the planning-queue hard-block never engages, but the reason is the job-level
    condition, not an absent event. The implementing agent diagnoses and fixes on the PR branch
    directly (the existing 3-fix-attempt STOP and VF-08 nondeterminism rules in the implement
    skill govern that loop), then re-pushes to re-trigger PR CI -- never a wait on a rec that
    structurally cannot arrive.

fingerprint_v2:
  formula: >-
    sha256("v2" \0 workflow_slug \0 failure_category \0 error_signature) -- the literal "v2"
    salt guarantees disjointness from any v1 (CIRCA-03(a), workflow_slug/failed_check/
    failure_category) fingerprint for the same logical failure; no warehouse migration required.
  error_signature_structure: >-
    "{exception_type}::{deepest_in_app_frame}::{normalized_message_head}" where
    deepest_in_app_frame is itself "{module}::{function}" (repo-relative, NO line number) --
    the first traceback frame, walked bottom-up, that is not in site-packages/pytest-internals/
    conftest.py. A plain assertion failure inside a test resolves to the test function itself
    (anti-masking: distinct tests never collide); an error raised inside a shared src/ helper
    resolves to that helper (cause grouping: distinct tests sharing one cause collapse together).
  special_cases:
    collection_error: >-
      Keys on the failing MODULE PATH (recovered from the log's own "ERROR collecting <path>"
      headers), never a traceback frame -- there is no test body to attribute a collection
      failure to. failure_category=collection_error (config/ci_rca_taxonomy.yaml).
    non_pytest_fallback: >-
      For a check that declared registry.failure_detail() this run (PLAN-coverage-failure-
      attribution, surfaced via failed_check_details / scripts.ci_rca.taxonomy._load_check_
      details), scripts.ci_rca.evidence._resolve_error_signatures prefers
      scripts.ci_rca.fingerprint.signature_for_declared_detail(check, detail) -- a deterministic,
      PATH-PRESERVING signature derived from the check's own declared per-failure detail (e.g.
      validate_test_coverage's per-file coverage_errors), never routed through
      normalize_message_head (whose _PATH_RE would collapse any multi-segment path to the literal
      token "<path>" and re-collide two distinct failing files). Detail-free checks (and every
      check before this plan) fall back to error_signature_from_log_tail(log_text, tool) --
      "{tool}::{normalized-representative-line}", preferring a terraform-style "Error: ..." line
      when present (covers terraform-apply-sandbox apply failures, Decision 92) -- unchanged.
    mass_failure_collapse: >-
      collapse_mass_failure(signatures, threshold=5) -- when a run produces more than ~5 distinct
      NEW signatures, ALL bundles collapse into ONE run-level record instead of fanning out.

status_aware_chain:
  resolve_chain: >-
    Every source=ci_rca record whose context_v2_json.fingerprint matches, ordered NEWEST FIRST
    (last_updated_timestamp, falling back to created_timestamp).
  bump_rule: >-
    Only the NEWEST record in a fingerprint's chain, and only while status=open, is ever bumped
    (occurrence_count/last_seen). A CLOSED head is never mutated -- no closed->open status flip
    exists anywhere in this system (the rec-2644 reopen_ci_rca_rec /
    find_recent_ci_rca_rec_by_fingerprint revive path is retired).
  regression_vs_drop:
    ancestry_check: >-
      git merge-base --is-ancestor <failing-commit-sha> <closed-head.fixed_by_sha>.
    drop: >-
      failing-commit IS an ancestor of the closed head's fixed_by_sha -- a stale-code rerun of an
      already-fixed commit. No insert, no bump, no reopen; a no-op note is logged.
    regression: >-
      failing-commit is NOT an ancestor (or the closed head carries NO fixed_by_sha -- Decision 55
      fail-closed default for every rec closed before this change / any manual closure) -- files a
      brand-new record with regression_of=<head_id> set, a "REGRESSION: " title prefix, and
      priority=Critical. Never a closed->open flip.
  closure_proof_citation: >-
    The closed->open prohibition is a fresh forward rule CITING Decision 103's closure-proof
    clause (a closed ci_rca rec carries a fixed_by_sha proof; reopening would discard it without
    contrary evidence) -- it does NOT amend a closed->open clause in Decision 103 (no such clause
    exists there). Do not cite Decision 70 for this (Decision 70 governs bootstrap-record deletion).

auto_close:
  fix_linked:
    trigger: >-
      ci.yml's trailer-closure job (Decision 201 relocation; formerly rec-autoclose.yml), on
      closing a source=ci_rca rec from a Resolves: trailer, calls
      scripts.ops_portal.ci_rca_lifecycle.stamp_fixed_by_sha(rec_id, <merge-commit-sha>).
    effect: "context_v2_json.fixed_by_sha is set to the merge commit -- powers the ancestry check above."
  timestamp_inactivity:
    type: deterministic
    predicate: >-
      last_seen (falling back to created_timestamp) is older than the inactivity window (30 days)
      AND the rec's created-age is >= 14 days. BOTH bounds must hold. Purely timestamp-based --
      no run-history data source -- so it stays inside Decision 103's deterministic-satisfaction
      boundary (a recorded proof licenses a direct close, no close_proposed needed).
    action: >-
      scripts.ci_rca.inactivity_sweep closes via update_rec(status=closed, resolution=stale_no_recurrence, closure_waiver_category=stale_no_recurrence, closure_waiver_reason=<last_seen/age proof>) -- Decision 186's programmatic waiver, so an escape-classified inactive rec still closes rather than wedging this workflow.
    read_path: >-
      scripts.ops_portal.ci_rca_lifecycle.list_open_ci_rca_recs -- DuckLake reader NAMED VERBS only
      (Decision 84 I-3 / Decision 88); no ad-hoc warehouse re-fetch; never re-stages from a cache.
  flake_escalation:
    trigger: "A fingerprint's chain reaches (>=) 3 records."
    action: "Tagged flaky=true and quarantined instead of filing another fresh critical."

escape_attribution:
  source: "Decision 135's --pre affected-set selection manifest (logs/debug/selection-manifest.json)."
  classes:
    no-edge: >-
      The failed test's file is absent from manifest.selected -- no reverse-dependency edge
      connected it to the diff, so --pre had no way to know it might be affected.
    capped: >-
      The failed test's file is present in manifest.deferred -- --pre identified it as affected
      but deferred it over the transitive-residue cap (Decision affected-set-selection).
    unknown-data-edge: >-
      The failed test's file WAS in manifest.selected (should have run under --pre) but still
      failed post-merge -- an escape --pre's channels could not explain; flagged for manual
      review, never silently assumed benign.

# PLAN-ci-rca-evidence-scope-declaration: completes GAL-01's bounded retrieval envelope on the
# SCOPE axis (which steps were shown to the agent) rather than the VOLUME axis (how much of a
# shown step's log survived truncation) -- the two are orthogonal and both live in
# retrieval_evidence, never conflated.
evidence_scope:
  scope_field: >-
    retrieval_evidence.scope (scripts/ci_rca/log_evidence.py SCHEMA ci-rca-log-evidence/v2) is a
    list keyed BY JOB, one entry per FAILED job: {job_id, steps: [{step_index, conclusion,
    log_retrieved}, ...]}. It is a second per-job structure parallel to
    failed_jobs[].failed_steps, kept separate rather than nested inside failed_jobs because
    failed_jobs' shape is pinned by _validate_jobs and downstream consumers -- widening it would
    move the blast radius well past this contract. `scope` lists EVERY step the job executed, not
    just the failed ones; the validator can only enforce a superset of failed_steps (it cannot see
    producer-side totality), so totality is a producer-side test obligation
    (tests/test_ci_rca_fetch_logs.py::TestScopeStepTableTotality), not a validator guarantee.
  conclusion_domain: >-
    A scope step's conclusion admits {failure, timed_out, cancelled, success, skipped, null} --
    strictly wider than failed_steps' closed {failure, timed_out, cancelled}. null covers a
    step with no conclusion: not started (routine in a cancelled job, which _failed_jobs selects)
    or unfinalized by GitHub (gh emits "", fetch_logs records null).
    Copying failed_steps' narrower enum into the scope validator would reject every real
    envelope: publish_envelope's ValueError propagates out of fetch_run_log to
    fetch_logs.main(), which converts it to rc=1 -- the whole CI-RCA job fails and NO rec is filed.
  log_retrieved_derivation: >-
    Derived STRUCTURALLY in scripts/ci_rca/fetch_logs.py, never by searching `body`.
    retrieval_path="primary" (gh run view --log-failed, which returns only failed steps' logs):
    true exactly for steps whose conclusion is in {failure, timed_out, cancelled}.
    retrieval_path="fallback" (a queried job's WHOLE log: gh run view --job <id> --log, or the raw
    job log, gh api repos/<repo>/actions/jobs/<id>/logs, for a job with no failed step or a null
    conclusion, whose unfinalized step the step-split log drops; such a job routes the whole run
    here): true for every step of a job in fallback_selection.queried_job_ids, false for every step
    of a job in unqueried_job_ids.
  volume_orthogonality: >-
    log_retrieved means "this step's log was within the retrieval request's scope", not "every
    line of it is present in body". No validation rule couples log_retrieved to
    limits.complete/truncation_reason -- a truncated body can never reject a valid envelope, and a
    step marked log_retrieved=true can still have had its log volume-truncated; `limits` remains
    the sole reporter of that separate axis.
  stamp_versus_echo: >-
    Two distinct CiRcaContext keys, never one. unobserved_steps_authoritative is portal-derived:
    stamped in code at scripts/ops_portal/ci_rca_runtime.py (beside fingerprint/failure_category/
    affected_nodeids/escape_class) from the VERIFIED evidence bundle's retrieval_evidence.scope,
    computed as every {job_id, step_index} pair with log_retrieved=false. unobserved_steps is
    agent-authored: the agent's own comprehension echo, derived (per the ci-rca.md Step 4
    template) from the same bundle field, ideally identical to the stamp but authored
    independently. A shared key would let the code stamp overwrite the agent's echo before the
    cross-check compares them, making the check vacuous -- this applies ci-rca-lifecycle's
    in-code principle (constraints, below) BY ANALOGY: an evidence-scope fact is not literally one
    of "the fingerprint and every dedup/regression/inactivity/escape decision", so the rule did not
    previously bind it; this contract extends that enumeration to cover it. The echo itself stays
    agent-authored and that is correct -- its semantics are "what the agent believed it did not
    observe", a claim about the agent that only the agent can author.
  cross_check_5: >-
    scripts/ops_portal/ci_rca_runtime.py's _run_ci_rca_cross_check compares unobserved_steps
    against unobserved_steps_authoritative as SETS of {job_id, step_index} pairs (order- and
    duplicate-insensitive). Absent, subset, superset, wrong-set, and a flat-index (non-pair) echo
    all stamp cross_check_check_5 onto warn_mode_reject in warn mode and raise in strict mode; an
    exact-pair-set match stamps nothing. A bundle carrying no scope block (pre-dating this plan)
    degrades silently -- no stamp is written and check-5 does not run.
  honesty_bounds: >-
    Three bounds, stated rather than implied. (i) PROSE: check-5 enforces DISCLOSURE, not honesty
    -- an agent that echoes correctly and then still narrates about those steps as if observed is
    compliant with check-5. (ii) VOLUME: the set enumerates scope-axis blind spots only; a step
    marked log_retrieved=true whose log was cut by `limits` truncation is a real blind spot this
    field will never contain -- `limits` remains the sole reporter of that axis (see
    volume_orthogonality above). (iii) MODE: CI_RCA_STRICT_MODE defaults to warn, so check-5 tags
    rather than blocks on landing -- this is instrumentation that becomes enforcement if and when
    strict mode is enabled, not a preventive gate today.
  bypass_chain: >-
    check-5's non-effective paths, named rather than left implicit. UNREACHABLE:
    _run_ci_rca_cross_check runs only when source=='ci_rca' and context_v2_json is not None and
    not migration_mode (ops_data_portal.py); within it, returns early when evidence_bundle_ref is
    absent (including the rca_confidence='undetermined' branch, which returns with no stamp even
    in strict mode) and when the bundle file is not found locally -- the bundle-absent route is
    what the agent instructions explicitly endorse for graceful degradation, and its accepted
    mitigation is that it already forces mandatory human review via rca_confidence='undetermined'.
    REACHED-BUT-DISCARDED, the structurally larger case: the cross-check runs, then on an
    open-fingerprint match the write-time dedup backstop calls bump_ci_rca_occurrence and returns
    the existing rec id WITHOUT inserting -- the freshly computed stamp and any
    cross_check_check_5 tag are thrown away. That is the dominant path for a RECURRING failure --
    precisely the class this machinery exists for. Accepted consequence: check-5 is effective on
    first occurrence only; recurrences are covered by the occurrence bump and the existing chain
    lifecycle (status_aware_chain above), not by this check.
  gh_json_degradation: >-
    scripts/ci_rca/fetch_logs.py builds the step table by positional index
    (enumerate(steps, 1)), deliberately NOT the GitHub payload's own step `number`, because the
    existing failed_steps entries already use the positional convention and the two must agree.
    If `steps` is absent for a job in the `gh run view --json jobs` payload, that job's scope
    entry has an empty steps list, contributes nothing to unobserved_steps_authoritative, and
    check-5 silently no-ops for that job -- a fixture cannot exercise this GitHub-payload-shape
    edge, so it is recorded here as a known, accepted degradation rather than tested.
  consumer_statement: >-
    AC12: check-5 consumes the COMPUTED authoritative set at cross-check time, not the persisted
    unobserved_steps_authoritative field -- if the field were never written, check-5 would behave
    identically. Until a typed-epistemic-anchoring follow-on lands (named, not scheduled: see
    docs/plans/PLAN-ci-rca-evidence-scope-declaration.yaml context), the persisted field is a
    durable record for human and successor review and nothing else reads it programmatically. The
    stamp is also FIRST-OCCURRENCE-SCOPED: bump_ci_rca_occurrence round-trips the prior context
    unchanged, so a rec with occurrence_count > 1 retains occurrence-1's stamp while last_seen
    advances -- a later recurrence's own unobserved-step set is never recomputed onto the rec.

projection_fields:
  regression_of:
    type: "Optional[str]"
    pattern: "^rec-\\d+$"
    home: context_v2_json (CiRcaContext)
  fixed_by_sha:
    type: "Optional[str]"
    pattern: "^[0-9a-fA-F]{7,40}$"
    home: context_v2_json (CiRcaContext)
  affected_nodeids:
    type: "Optional[list[str]]"
    home: context_v2_json (CiRcaContext)
  flaky:
    type: "Optional[bool]"
    home: context_v2_json (CiRcaContext)
  escape_class:
    type: "Optional[str]"
    enum: [no-edge, capped, unknown-data-edge]
    home: context_v2_json (CiRcaContext)
  unobserved_steps:
    type: "Optional[list[{job_id: int, step_index: int}]]"
    home: context_v2_json (CiRcaContext)
    authored_by: agent (comprehension echo; see evidence_scope.stamp_versus_echo)
  unobserved_steps_authoritative:
    type: "Optional[list[{job_id: int, step_index: int}]]"
    home: context_v2_json (CiRcaContext)
    authored_by: portal (stamped in code from the verified evidence bundle; see evidence_scope.stamp_versus_echo)
  detection_gap.escape_mode:
    type: "Optional[str]"
    enum: [check_ran_vacuously, tier_misplaced, no_premerge_gate_by_design, undetermined]
    home: context_v2_json.detection_gap (CiRcaContext._DetectionGap)
    authored_by: >-
      agent (echoes the evidence bundle's own escape_mode); cross-checked by
      scripts/ops_portal/ci_rca_runtime.py check-3 (abstention-mirror + bundle-wins), never
      overwritten in place -- a disagreement raises an issue rather than silently correcting it.
  closure_artifact:
    type: "Optional[str]"
    pattern: "<kind>:<ref>, kind in {shard, pytest, check, fixture}"
    home: context_v2_json (CiRcaContext)
    authored_by: closer (supplied at update_rec closure time via --closure-artifact / the kwarg)
  closure_waiver_category:
    type: "Optional[str]"
    enum: [stale_no_recurrence, environment_only, no_premerge_gate_by_design, risk_accepted]
    home: context_v2_json (CiRcaContext)
    authored_by: closer (supplied at update_rec closure time via --closure-waiver-category / the kwarg)
  closure_waiver_reason:
    type: "Optional[str]"
    home: context_v2_json (CiRcaContext)
    authored_by: closer (free-text proof, supplied alongside closure_waiver_category)
  repair_track: {type: "Optional[str]", enum: [test_defect, product_regression], home: context_v2_json (CiRcaContext), authored_by: agent}
  repair_track_confirmed: {type: "Optional[str]", enum: [test_defect, product_regression], home: context_v2_json (CiRcaContext), authored_by: "portal (red-main-recovery.yaml confirmed_track)"}
  workflow_tier: {type: "Optional[str]", home: context_v2_json (CiRcaContext), authored_by: "portal (the verified bundle's workflow_to_tier_resolution)"}

# Decision 186: closure-time artifact obligation for escape-classified recs. Field semantics
# route here (Decision 86/127); rationale and per-ruling evidence live in the Decision and in
# PLAN-escape-closure-obligation's context, never restated below.
closure_obligation:
  artifact_kinds: [shard, pytest, check, fixture]
  kind_strength: [shard, pytest, check, fixture]  # strongest first; only shard: is still-red-on-reintroduction (residual rec filed)
  fix_commit_binding: >-
    A `<kind>:<ref>` token resolves only when its kind-specific fact holds AND its defining file was added or modified in the closing write's fixed_by_sha (one read-only local `git diff-tree`, no reader egress). check:<name> resolves against the entry's Entry.pre TIER fact, NEVER bare registry._ALL_ENTRIES membership (vacuous for tier_misplaced escapes). No fixed_by_sha, or an unresolvable one, REFUSES (fail closed, Decision 55).
  per_kind_defining_file:
    "check:<name>": "The registering scripts/checks/<domain>/_manifest.py line, or the check module -- either satisfies."
    "shard:<id>": "config/agent/verification_registry/entries/<id>.yaml"
    "pytest:<nodeid>": "The test file named by the node id."
    "fixture:<path>": "The fixture path itself."
  fixture_root_constraint: >-
    fixture:<path> must be under tests/fixtures/ -- unconstrained, fixture:README.md would resolve while proving nothing and would depress reversal condition (a)'s waiver rate.
  waiver_categories: [stale_no_recurrence, environment_only, no_premerge_gate_by_design, risk_accepted]
  waiver_categories_reason: >-
    Ratified seed set (point 5/8; a new member is a numbered-Decision event). duplicate_of is DELIBERATELY ABSENT -- a waiver asserts no artifact is FEASIBLE, a duplicate asserts one is OWED (cites the class artifact, fix-bound like any other, no promise transfer). Never re-add it.
  bound_statuses: [closed, declined, superseded]
  terminal_definition: >-
    Defined on the FROM side: fires on a transition INTO a bound status FROM one not already bound -- gates open->declined (closing the two-step bypass) while declined->superseded and status-preserving writes stay ungated. `failed` is deliberately NOT bound.
  refusal_contract: >-
    Raises ClosureArtifactRequired (ValueError), writing nothing (Decision 55/72). ci.yml's trailer-closure job (Decision 201 relocation; formerly rec-autoclose.yml) catches it, prints a Decision-155 marker, skips the rec (left OPEN), exits 0 -- never a propagated exception on this ci_rca:watched workflow.
  stamp_precondition:
    predicate: "scripts.ops_portal.closure_gate.closure_stamps_applicable(raw) -> bool(parse_context_json(raw))"
    domain: "PARSED-DICT -- evaluated over closure_gate.parse_context_json(raw), never a bare bool() on the raw context_v2_json cell (an empty-object \"{}\" cell is truthy, {} is not); the STAMPABILITY precondition for a closure_* kwarg, explicitly NOT Decision 186 point 1's escape-class predicate (is_escape_classified), and kept out of assert_closure_obligation's call path so it never reads as a second gate."
    call_sites:
      - scripts/ops_data_portal.py
      - scripts/ops_portal/ci_rca_lifecycle.py
      - scripts/ci_rca/inactivity_sweep.py

constraints:
  - "Decision 84/103/63: these fields are a context_v2_json projection only -- ops_recommendations' Class A schema is untouched."
  - "Decision 55: the fingerprint, every dedup/regression/inactivity/escape decision, and (by analogy, see evidence_scope.stamp_versus_echo) the unobserved_steps_authoritative evidence-scope fact are computed IN CODE, never by the LLM RCA agent."
  - "All new CiRcaContext fields are Optional[...]=None -- no schema_version ceiling raise (backward-compatible additions)."
  - "The inactivity sweep reads via DuckLake reader named verbs only; never re-stages from logs/.recommendations-log.jsonl."
  - "All rec writes (fix-link stamp, regression filing, inactivity close) transit the ops portal (file_rec/update_rec) -- Decision 84 single-portal invariant."

# PLAN-ci-rca-abstention-and-citation: the abstention-review surface (session_preflight's
# "CI-RCA Abstention Review" section) and the probe-health gauge (scripts/ci_rca/probe_health.py)
# both key on the SAME set, which is wider than a literal probe abstention.
abstention_surface:
  scope: >-
    rca_confidence in {low, undetermined} -- not undetermined alone. A self-rated `low` RCA
    confidence is not sound either, even though the deterministic evidence bundle did classify it
    (undetermined is the probe's own abstention; low is the agent's own confidence rating). Both
    the preflight abstention-review section (scripts/preflight/ci_rca_signals.py) and the
    probe-health rate gauge (scripts/ci_rca/probe_health.py compute_abstention_rate /
    scripts/preflight/ci_rca_gauges.py's `low_or_undetermined_count` gauge key) widen together --
    moving one without the other relocates the one-word-two-sets defect instead of fixing it.
  advisory_not_gating: >-
    This surface is advisory visibility only, not a new gate. print_ci_rca_recs' SOFT/HARD open-rec
    split (the actual /plan block) is untouched by this widening -- a rec can appear in the
    abstention-review section while also being HARD BLOCK, SOFT, or neither, independently.
  back_validate_reclassification: >-
    The citation-pattern widening (_WHY_CHAIN_CITATION_RE now accepts `.yml`, not just `.yaml`) has
    a benign second-order effect on back_validate_ci_rca (scripts/ops_portal/ci_rca_runtime.py):
    any warn-period rec whose sole non-conformance was a `.yml` file:line citation the old pattern
    rejected reclassifies non_conformant -> conformant the next time back-validation recomputes
    against the current schema, since back-validation always re-checks against the schema live at
    read time (docstring, ci_rca_runtime.py:264), never the schema live when the rec was filed.
  escape_mode_gauge: >-
    T1.13:c9 repair (2026-09-06): detection_gap.escape_mode's own abstention gauge
    (scripts/ci_rca/probe_health.py compute_escape_mode_abstention_rate; surfaced via
    scripts/preflight/ci_rca_gauges.py's ci_rca_escape_mode_gauge report key,
    `undetermined_count`/`total_count`/`rate` shape) is a SEPARATE, ADDITIVE gauge from the
    rca_confidence widening described in `scope` above -- it counts
    context_v2_json.detection_gap.escape_mode == 'undetermined' and never reads rca_confidence.
    It must never be merged into, or substituted for, the rca_confidence gauge: the two measure
    different failure modes (the agent's self-rated confidence vs. the deterministic probe's own
    classifier), at materially different rates over the same cache. escape_mode read 100%
    'undetermined' from 2026-08-02 to 2026-09-06 with no gauge pointed at the field at all --
    moving this gauge onto rca_confidence's existing key, or widening that gauge's set instead of
    adding this one, would relocate that dead-field defect rather than fix it.

procedure:
  correct_rec_context: >-
    scripts.ops_portal.ci_rca_lifecycle.correct_rec_context(rec_id, context_updates,
    row_updates=None, profile=None) -- the tested, portal-only route for correcting a
    factually-wrong context_v2_json narrative on an OPEN ci_rca rec (never a closed head; bump_rule
    above forbids mutating one). Shallow-merges context_updates into the FULL existing blob
    (preserving fingerprint/evidence_bundle_ref/etc, never a partial-column overwrite), refuses to
    write unless the read blob already carries a fingerprint, and refuses when the merged context
    fails _validate_ci_rca_context_v2 -- both refusals raise before any write. row_updates carries
    row-level fields (e.g. title) that update_rec content-gates in the same call. Example (rec-2923,
    PLAN-ci-rca-abstention-and-citation step 6):
    `bin/venv-python -c "from scripts.ops_portal.ci_rca_lifecycle import correct_rec_context;
    correct_rec_context('rec-2923', {...}, row_updates={'title': '...'})"`. It also drops a caller's
    portal-owned keys, re-derives priority and refuses a preventive-deficient merge
    (docs/contracts/red-main-recovery.yaml).

# PLAN-ci-rca-adjudication-guard: this contract used to carry a second, hand-maintained
# watched:/excluded: enumeration in parallel with config/ci_rca_taxonomy.yaml's own exhaustive
# per-workflow map -- the drift-by-design anti-pattern Decision 86 and AGENTS.md forbid (the
# taxonomy file already enumerated all 19 workflows and was already gated by
# validate_ci_rca_taxonomy). The fold below retires this as a second registry: the taxonomy file
# is now the SOLE source of truth for per-workflow ci_rca adjudication, machine-enforced by a
# dedicated evaluator rather than left to the honor system.
watched_workflow_set:
  source_of_truth: config/ci_rca_taxonomy.yaml
  source_of_truth_field: "workflows: (each entry: tier, ci_rca [watched|excluded], owner, rationale, agent_loop_caps [optional])"
  evaluator: validate_ci_rca_adjudication
  evaluator_module: scripts/checks/ci_guards/validate_ci_rca_adjudication.py
  note: >-
    validate_ci_rca_adjudication asserts, in both directions, that (a) the taxonomy's `workflows:`
    key set equals .github/workflows/*.yml's display names, and (b) ci-rca.yml's
    on.workflow_run.workflows filter equals exactly the set of entries marked `ci_rca: watched` --
    replacing the floor-only membership test scripts/verify_ci_workflow.py's _check_ci_rca_filter
    still separately asserts (a five-entry FLOOR that must never shrink; retained deliberately, see
    PLAN-ci-rca-adjudication-guard's constraints -- this is not a second registry, both read the
    same single source of truth). Every entry must also declare a non-empty owner and rationale.
    (d) each entry's OPTIONAL agent_loop_caps list declares an agentic-loop iteration cap for that
    workflow: kind (a governed vocabulary, currently max_turns only), value (an int,
    DERIVED-AND-ASSERTED equal to the live --max-turns literal in the workflow file the row names
    -- never satisfiable by editing the declaration alone), and on_exhaustion/rationale (prose
    clearing a shared non-triviality floor: at least 40 stripped characters, not equal to the kind
    name, and not equal to each other). A row names no site or pattern of its own -- the row KEY
    already is the site, resolved to its workflow file through scripts/ci_rca/taxonomy.py's
    enumerate_workflow_name_paths. validate_ci_rca_adjudication's fourth assertion group derives
    the live census (scripts/checks/ci_guards/_agent_loop_caps.py) and compares it against this
    declared map in both directions.

# The fail-closed predicate (scripts/ci_rca/designed_refusal.py) that lets deploy-ducklake-lambdas
# be watched without the STANDING reconcile-gate refusal minting a fresh critical on every push.
designed_refusal:
  module: scripts/ci_rca/designed_refusal.py
  rule: >-
    Consumed by a ci-rca.yml step ("Designed-refusal check") that gates the "Run ci-rca agent"
    step via a step output, mirroring the existing fp_dedup / convergence-dedup skip shape.
    Returns skip=true ONLY when the run's resolved failing-job set is non-empty AND every member
    is a DECLARED designed-refusal job for that workflow slug. Any uncertainty -- an empty
    failing-job set, an unparseable/`{}` jobs file, or an undeclared failing job (even alongside a
    declared one) -- returns skip=false, so the agent still runs and files (Decision 55: no loose
    suppression).
  declared_jobs:
    deploy-ducklake-lambdas: ["reconcile-gate"]

# CLOSURE TRAP (Decision 142 point 3 + cl.4(a); Decision 201 widened the caller from
# rec-autoclose.yml to ci.yml): ci.yml's trailer-closure job (formerly rec-autoclose.yml) is the
# SOLE caller of ci_rca_lifecycle.stamp_fixed_by_sha, and a closed ci_rca head with no
# fixed_by_sha FAILS CLOSED to a REGRESSION / priority=Critical rec on the next fingerprint
# match. So when a CI failure files a ci_rca rec, that rec's own fix PR's Resolves trailer must be
# processed by the very workflow that is broken -- fixed_by_sha may never get stamped
# automatically, manufacturing a spurious critical from a real fix.
closure_dependency:
  trap: >-
    Watching CI (the trailer-closure job's workflow) is still correct (the alternative is the
    2026-07-24 silence), but a CI-sourced ci_rca rec cannot assume its own closure will
    auto-stamp fixed_by_sha -- widened from rec-autoclose.yml (Decision 201 relocation) to the
    workflow that now actually processes the trailer.
  manual_route: >-
    Close via `bin/venv-python -m scripts.ops_data_portal --update-rec <rec-id> --status closed --resolution "..." --closure-artifact <kind:ref> --closure-fix-sha <merge-sha>` (Decision 186: both closure flags must land in the SAME call -- the gate reads fixed_by_sha from the write it evaluates, so close-then-stamp-separately no longer satisfies the artifact route). --closure-fix-sha stamps the same fixed_by_sha key a separate `stamp_fixed_by_sha('<rec-id>', '<merge-sha>')` call would -- needed only for a non-escape rec or an unsupplied sha. This is the closure route for a CI-sourced ci_rca rec whenever ci.yml's trailer-closure job cannot be trusted to process the Resolves trailer. Decision 201: this manual route supplies no acceptance_verdict record, so `assert_acceptance_verdict` never re-arms here -- it is sanctioned only after a transport failure or the merge-leg gate's own refusal, never after a Decision 201 acceptance-verdict refusal (see docs/contracts/git-ops.yaml::resolves_trailer).
  rec_2923_precedent: >-
    PLAN-ci-rca-starved-surface (Decision 162) applies this exact manual_route to close rec-2923:
    `--status closed --resolution "<live closure proof, Decision 103>"` then
    `stamp_fixed_by_sha('rec-2923', '<full 0726593 commit sha>')` -- the commit that actually
    fixed the reviewer path (PR #812), NOT this plan's own merge sha. A Resolves trailer naming
    rec-2923 is deliberately NOT used: rec-autoclose stamps context_v2_json.fixed_by_sha to the
    MERGE sha, which would make the status_aware_chain.regression_vs_drop ancestry check lie for
    any genuine recurrence of the reviewer defect occurring between 0726593 and this plan's merge
    (it would be misclassified drop, not regression). bundled_recommendations therefore carries
    only rec-2664 (the observability-gap rec this plan's own preventive action satisfies).

starved_review_observability: >-
  Decision 162 / rec-2923 preventive action. review.sh (subagent-plan-review) prints a distinct
  greppable marker on each STARVED exit path -- "[SUBAGENT-REVIEW] STARVED: <reason>" -- mirrored
  to $GITHUB_STEP_SUMMARY when set, using the Decision 155 marker shape (mirrors the DCG-03
  orphan-guard skip marker). archive_transcripts.sh (a second, always-run composite step) then
  best-effort-archives review.json / review_retry.json (whichever exist) to
  s3://agent-platform-data-lake/ci-rca-evidence/review-transcripts/<run_id>/ -- TOTAL by
  construction (always exits 0, so it can never change the review outcome); its own failure path
  prints a distinct "[SUBAGENT-REVIEW] transcript archival FAILED: <reason>" marker, also mirrored
  to $GITHUB_STEP_SUMMARY, never a bare `|| true`. On the Reconcile heal-button path specifically,
  a starved episode additionally files a durable `source=reconcile_starved` rec (the
  file-reconcile-starved-rec job in reconcile.yml, rec-2664) -- the routine sandbox push path has
  no equivalent filing job because ci-rca already watches terraform-apply-sandbox.yml directly
  (Decision 142); reconcile.yml is marked `ci_rca: excluded` in config/ci_rca_taxonomy.yaml
  (Decision 154 point 6), so this job is Reconcile's own substitute observability path for the
  same episode class.
