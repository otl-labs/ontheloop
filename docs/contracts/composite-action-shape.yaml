# Machine-readable home for the R1/R2/R3 composite-action shell-body field semantics (Decision
# 162 / rec-2923 preventive action). Rationale lives in Decision 162, not here (Decision 86/127
# routing: field semantics live collocated with their enforcement counterpart). A Class D
# mechanism contract (migration-step-3-grandfathering, T2.56 migration step 3) as of the
# `contract:` block below.
contract:
  id: composite-action-shape
  class: D
  contract_version: 1
  status: active
  description: >-
    Class D mechanism-contract envelope for this file (migration-step-3-grandfathering, T2.56
    migration step 3). The R1/R2/R3 rule body itself is unchanged by this envelope.
  subject: composite-action-shape
  evaluator:
    check: validate_composite_action_shape_rosters

amendment_log:
  - date: "2026-10-27"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      PLAN-values-stripped-plan-review (rec-4639): the review.sh agent_loop_caps rationale now says the reviewer reads a names-only plan digest on stdin with no tools. Rationale text only; no cap value or shape changes.
  - date: "2026-09-11"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-declared-caps (audit finding LSA-05): added the top-level agent_loop_caps section, one
      entry for .github/actions/subagent-plan-review/review.sh (kind max_turns, value 5), enforced
      by validate_composite_action_shape_rosters' new assertion group 5 against the live MAX_TURNS
      assignment feeding both invocations. Nothing else in this contract changes.
  - date: "2026-08-16"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      rec-3059 wave 2 (PLAN-class-d-enforcers-wave-2): flipped evaluator from none_grandfathered
      to {check: validate_composite_action_shape_rosters}. DELIBERATE DEVIATION from this
      contract's own retired enforcement route, which proposed having the R1/R2/R3 guard read
      known_r1_violators FROM this contract instead of its hardcoded _R1_KNOWN_VIOLATORS copy in
      scripts/checks/ci_guards/validate_composite_action_shell_bodies.py. Decision 162's R1
      MEMBERSHIP clause makes that route MANDATORY to deviate from: "a config-file edit alone can
      never admit a third violator; growing the set requires editing the guard's own source in a
      reviewed change" -- collapsing to one contract-side copy would demote a reviewed-code-change
      bar to a YAML doc edit. ACCEPTED COST: the new check builds a THREE-WAY parity assertion
      (this contract's known_r1_violators, the guard's frozen _R1_KNOWN_VIOLATORS constant, and
      config/composite_action_body_baseline.yaml's r1: section) over what was already an
      unverified copy -- known_r1_violators already declared keys+pinned_lines 13/9 today,
      unasserted; the check makes an existing latent duplication machine-checked rather than
      creating a new one. A future extraction PR now FAILS CI if it misses any of the three
      surfaces, instead of silently drifting. All three surfaces agreed at implement time.

projection_id: composite-action-shape
version: 1
status: active
ratified_via: "Decision 162 / PLAN-ci-rca-starved-surface merge to main"
description: >-
  Three authoring rules for every .github/actions/**/action.yml composite `shell: bash`/`sh` step
  body, enforced by scripts/checks/ci_guards/validate_composite_action_shell_bodies.py in both
  presubmit tiers, filesystem-only (no network, no subprocess -- Decision 153 fast-tier budget).

rules:
  r1:
    name: thin_adapter_required
    scope: >-
      Any composite `shell: bash`/`sh` step body that PRODUCES a consumed `outputs.<id>.value`
      binding -- i.e. its step `id` is referenced by a `steps.<id>.outputs.<key>` expression
      inside the manifest's top-level `outputs:` block.
    requirement: >-
      Must delegate to a `.sh` script under the action directory. The delegate line is FULLY
      ANCHORED to one of exactly two shapes -- `bash "${{ github.action_path }}/<script>.sh"` or
      `if ! bash "$GITHUB_ACTION_PATH/<script>.sh"; then` -- and every OTHER effective line must be
      a BARE scaffolding token (`then`, `else`, `fi`, `exit`, or `exit N`). Deliberately no
      `if <anything>` wildcard: a one-line `if OUT=$(...); then echo "k=$OUT" >> "$GITHUB_OUTPUT";
      fi` would otherwise ride alongside a delegation while computing and publishing a step output,
      which is the rec-2923 shape itself. Anchoring the delegate line likewise rejects a compound
      line such as `rm -rf x; bash "$GITHUB_ACTION_PATH/x.sh"`.
    escape: >-
      NONE, in either direction. (a) MEMBERSHIP: the known-violator set (deterministic-guard,
      fetch-saved-plan) is pinned in config/composite_action_body_baseline.yaml's r1: section AND
      cross-checked against a frozen constant (_R1_KNOWN_VIOLATORS) in the guard module itself --
      a config-file edit alone can never admit a third entry; growing the set requires editing the
      guard's own source in a reviewed change. (b) SIZE: each pinned entry's declared line count is
      an ENFORCED ceiling, not a record -- a pinned body that grows FAILS, and no
      `# raise-approved:` marker rescues it (that escape is r3-only). The set is strictly
      shrinking on both axes: extract or reduce, never grow.
    rationale_pointer: Decision 162 point 1.
  r2:
    name: literal_argv_test_coverage
    scope: Each `.sh` script an R1-conformant step delegates to.
    requirement: >-
      A test under tests/**/*.py must reference the script AND drive something under the literal
      GitHub composite-step argv `("bash", "--noprofile", "--norc", "-e", "-o", "pipefail")` --
      the exact invocation GitHub uses for a composite `shell: bash` step body, and the exact
      argv whose inherited errexit was rec-2923's root cause.
    escape: None -- a script with no such test always fails.
    rationale_pointer: Decision 162 point 2.
  r3:
    name: ratcheted_inline_body_ceiling
    scope: >-
      TWO SURFACES, ONE RULE (widened by audit finding SGE-03; R3 only). (a) COMPOSITE ACTIONS,
      `.github/actions/**/action.yml` -- every OTHER inline `shell: bash`/`sh` body:
      non-output-producing bodies, and output-producing bodies that already fail R1 (an R1
      violation is checked against R1's own baseline section, never double-counted against r3). A
      non-output-producing body that IS already a thin adapter (the R1-conformant shape) is
      excluded entirely -- never ratcheted, never penalized for being conformant. (b) WORKFLOWS,
      `.github/workflows/*.yml` and `*.yaml` -- every inline `run:` body on a
      `jobs.<job>.steps[]` entry whose EFFECTIVE shell (the step's own `shell`, else the job's,
      else the workflow's `defaults.run.shell`) is absent or begins with bash/sh. The dual glob is
      prophylactic: the directory holds only .yml today, and the .yaml spelling is covered on the
      Decision 166 precedent rather than because a .yaml workflow exists.
    surface_split_rationale: >-
      R1 and R2 remain COMPOSITE-ONLY and are never evaluated against a workflow step, because
      each keys on a construct with no workflow analogue: R1 on a manifest's top-level
      `outputs.<id>.value` binding (a workflow job's `outputs:` are expressions over step outputs,
      not a composite-step output contract, and no `outputs.<id>.value` block exists to classify
      against), and R2 on a `.sh` delegate living under the action directory (a workflow has no
      action directory; its extraction target is scripts/ci/, already exercised -- reconcile.yml
      invokes reconcile_target.py, ducklake_artifacts.py and review_verdict.py). Widening either
      to workflows would be a rule without a referent. R3 is the one rule whose referent -- an
      inline bash body measured by size -- exists identically on both surfaces, which is why it is
      the only one that widened, and why this is one rule gaining scope rather than a second rule:
      no second registered check name is minted and no second Decision is required.
    naming_residual: >-
      One registered check name (validate_composite_action_shell_bodies) now enforces two
      surfaces, so the name under-describes its own scope (Decision 104 debt, accepted knowingly
      and carried by a follow-on recommendation rather than a 17-file rename inside an
      incident-class ratchet install). Mitigated in-band: every violation the workflow leg emits
      is prefixed `R3-workflow:` and names the `.github/workflows` surface, so CI failure text is
      never ambiguous. The check's `failed.append` label is deliberately UNCHANGED -- it is the
      sole such value (see marker-grammar.yaml's RegistrySpec.label semantics), and existing
      consumer-test substring assertions match on it.
    measurement: >-
      Effective (non-blank, non-comment) line count, identical counting rule to
      scripts/checks/sloc/sloc_limits.py's SLOC measurement -- shared verbatim by both surfaces.
    requirement: >-
      A live body's measured line count must not exceed the declared ceiling of its entry in the
      baseline section owning its surface (composite bodies -> `r3:`, workflow bodies ->
      `r3_workflows:`). The comparison is strict `>` on both surfaces: a body sitting at EXACTLY
      its declared ceiling passes, which is what lets an install-time seeding be green by
      construction. A live body with no entry in its section fails outright.
    escape: >-
      An inline `# raise-approved: dec-NNN <reason>` marker (Decision 128 grammar, reused
      verbatim) on the baseline entry's own line, naming a real `## Decision N:` header in
      docs/DECISIONS.md whose body actually AUTHORIZES the entry (Decision 165 marker-guard
      consolidation upgraded this from existence to authorization -- see
      docs/contracts/marker-grammar.yaml for the mechanics, never restated here). A
      present-but-nonexistent marker, or one citing a Decision that never authorizes this key,
      both fail. A bare, non-marker comment never exempts an entry -- only the exact grammar does.
    rationale_pointer: Decision 162 point 3; authorization upgrade Decision 165.

baseline_file:
  path: config/composite_action_body_baseline.yaml
  name_note: >-
    The filename names ONE surface and the file governs TWO. Retained deliberately -- renaming
    would churn the guard's baseline path constant, both contracts and Decision 162's named
    artifact for no functional gain. The file's own header comment, not its name, is the
    authoritative description.
  section_allowlist:
    sections: [r1, r3, r3_workflows]
    rule: >-
      ENFORCED, not documented: an unrecognised top-level section in this file FAILS the guard.
      Admitting a fourth grandfather roster HERE requires editing `_KNOWN_BASELINE_SECTIONS` in
      scripts/checks/ci_guards/_workflow_shell_bodies.py in a reviewed code change -- never a
      config drop-in. Same frozen-constant-in-source shape as `_R1_KNOWN_VIOLATORS` (Decision 162)
      and `_marker_guard.RETRO_SCAN_GRANDFATHER` (Decision 165), and deliberately NOT the weaker
      config-edit shape of `generated_pinned` in config/structural_size_budgets.yaml. Scope stated
      precisely: it bars a roster smuggled into THIS file; it cannot bar one minted elsewhere, and
      it does not gate new ENTRIES within `r3_workflows:`, which is the ratchet's ordinary
      registration path.
  sections:
    - key: r1
      surface: .github/actions/**
      rule: R1
      key_form: '"<action-relative-dir>::<step-id>"' # positional "#<index>" fallback when a step declares no id.
      marker_escape: false
      seeded_at: >-
        The state PLAN-ci-rca-starved-surface (Decision 162) leaves the repo in (2026-08-02) -- a
        ONE-TIME grandfather in the sense of Decision 130 clause 2, explicitly not a precedent.
    - key: r3
      surface: .github/actions/**
      rule: R3
      key_form: '"<action-relative-dir>::<step-id>"' # positional "#<index>" fallback when a step declares no id.
      marker_escape: true
      seeded_at: >-
        The state PLAN-ci-rca-starved-surface (Decision 162) leaves the repo in (2026-08-02) -- a
        ONE-TIME grandfather in the sense of Decision 130 clause 2, explicitly not a precedent.
    - key: r3_workflows
      surface: .github/workflows/*.yml + *.yaml
      rule: R3
      key_form: '"<workflow-rel-path>::<job-id>::<step-identity>"'
      key_form_detail: >-
        step-identity is the step's own `id`; else a slug of its `name` (lowercased, every run of
        non-alphanumerics collapsed to a single hyphen, so no YAML-unsafe character survives into a
        key); else a positional "#<index>" over the job's FULL steps list, never over the
        run-bearing subset -- an index counted over a filtered subset would shift whenever an
        unrelated `uses:` step was inserted. Collisions inside one job (two id-less steps sharing a
        name) take a deterministic "~N" suffix in step order; without it the two bodies would
        collide on one key and the smaller body's ceiling would silently govern the larger.
      key_form_divergence_rationale: >-
        The extra job-id segment and the name-slug tier are a deliberate divergence from the
        composite grammar, justified by measured population shape rather than taste: composite
        actions carry at most 4 steps each, while reconcile.yml's apply-reconcile job alone carries
        26 and 83 of the 128 seeded workflow bodies declare no `id`. Under a purely positional
        scheme, inserting one unrelated step would renumber every subsequent key in that job and
        red the build on bodies nobody touched.
      marker_escape: true
      seeded_at: >-
        The state PLAN-workflow-body-ratchet (audit finding SGE-03) leaves the repo in
        (2026-08-04): 128 bodies across 17 workflow files, 1,220 effective lines, re-censused by
        structural YAML parse at implement HEAD, each entry at its exactly-measured count with no
        padding and no markers -- the same seeding shape Decision 162 used for `r3:`. No new
        numbered Decision was minted: Decision 130 clause 2 glosses its own "ONE-TIME grandfather"
        as barring a grandfathered ENTRY from growing, not as barring a further seeding, and
        Decision 166's Related section already names SGE-03 as post-landing implementation work.

known_r1_violators:
  # `pinned_lines` is an ENFORCED CEILING, not a record of the current size: exceeding it fails
  # the build with no marker escape (see rules.r1.escape clause (b)).
  - key: ".github/actions/deterministic-guard::guard"
    pinned_lines: 13
    status: pending_extraction
  - key: ".github/actions/fetch-saved-plan::resolve"
    pinned_lines: 9
    status: pending_extraction

known_r1_conformant:
  - key: ".github/actions/subagent-plan-review::review"
    delegate: review.sh
    note: "Extracted at rec-2924; the shape R1/R2 generalise."

closing_instance:
  script: .github/actions/write-convergence-record/assert_review_outcome.sh
  note: >-
    The strict consumer that closes rec-2923 itself -- the concrete instance R1's rule
    generalises. See Decision 162 point 4.

# Declared agent-loop iteration caps for shared composite actions (audit finding LSA-05). Field
# semantics (kind vocabulary, the DERIVED-AND-ASSERTED int value, the on_exhaustion/rationale
# non-triviality floor) are owned by docs/contracts/ci-rca-lifecycle.yaml's watched_workflow_set
# note: (d) clause, shared verbatim with the taxonomy-side declaration -- not restated here.
# Deliberately no `consumers:` field: it would be derivable from the live `uses:` edges and so
# either a second unasserted surface or extra assertion cost for no acceptance-criteria value.
agent_loop_caps:
  - site: .github/actions/subagent-plan-review/review.sh
    kind: max_turns
    value: 5
    on_exhaustion: >-
      A STARVED first verdict retries ONCE at the SAME turn budget (never larger, T2.39 c2); if
      the retry is also non-PROCEED/non-REVISE the action exits 1 and blocks the apply WITHOUT
      overwriting the convergence record (Decision 55 anti-masking) -- it stays whatever it
      already was, never forced green by a starved reviewer.
    rationale: >-
      5 is enough because this reviewer's job is narrow and read-only: read a pre-guarded, names-only plan
      digest on stdin with no tools and reply with a single PROCEED/REVISE
      token -- no grepping, no filing, unlike CI RCA's 30-turn multi-bundle read-write agent.
