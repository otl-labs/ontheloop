contract:
  id: contract-population
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "Decision 168 / PLAN-contracts-first-class-migration"
  description: >-
    The Class D mechanism-contract population gate (T2.56, migration step 3 of
    audits/contract-first-governance-33c8667.yaml). Self-hosting: this file is itself the first
    Class D contract, and its own evaluator (validate_contract_drift) is the gate that enforces
    every rule this document declares -- the file defining the obligation satisfies it, rather
    than merely asserting it. The population sweep (seeding the 21 free-form files as Class D
    contracts, 20 seedable + exit-criteria-ledger.yaml, exempted from Class D seeding at the
    time) landed under migration-step-3-grandfathering, firing Decision 167 clause 3's dated
    pre-commitment (per-entry decision-size cap WARN -> hard-fail). PLAN-cfg-migration-closeout
    later converted exit-criteria-ledger.yaml to a Class A ritual contract (see amendment_log).
  subject: contract-population
  evaluator:
    check: validate_contract_drift

# Top-level, sibling of `contract:` -- same convention as a ritual document's amendment_log.
amendment_log:
  - {date: "2026-11-02", semantic_break: false, change_class: prose_improvement, summary: "PLAN-glossary-sweep (rec-4676): relative words replaced by glossary names (Decision 240); no field or rule meaning changes."}
  - date: "2026-09-01"
    semantic_break: true
    change_class: accepted_values_narrow
    summary: >-
      PLAN-cfg-migration-closeout: docs/contracts/exit-criteria-ledger.yaml converted from
      free-form to a Class A ritual contract (ratified_via dec-136), moving it out of the
      grandfathered bucket into ritual -- ratchet.grandfathered_max lowered 17 -> 16
      (status_active_max unchanged at 16). Retired subject_namespace.non_seedable_exception
      (the exemption it recorded no longer applies) and swept its surviving prose references
      in contract.description and honesty_clauses.step_3_completion; corrected the false claim
      that scripts/roadmap/platform_roadmap.py parses this ledger (that module has no
      docs/contracts reference at all -- it only implements the shape the ledger documents).
      Also records the CFG-05 duplicate-subject recall sweep outcome in
      honesty_clauses.subject_uniqueness_is_precision_not_recall (32 contracts compared across
      12 adjacent clusters; one overlap filed as rec-3354; the Decision-body-vs-contract
      instance scoped out).
  - date: "2026-08-26"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      Platform cleanse: shape_grammar.extension_and_depth no longer names delegate-cli.md as the
      sole grandfathered non-.yaml member (the file was deleted with the retired delegate-CLI
      boundary contract). Ratchet pins are UNCHANGED at grandfathered_max 17 / status_active_max
      16 -- verified against the live census, which scans depth-1 *.yaml/*.yml only, so no .md
      file was ever in a counted bucket.
  - date: "2026-08-13"
    semantic_break: false
    change_class: field_add
    summary: >-
      migration-step-3-grandfathering: widened evaluator_kinds.check to admit path-shaped
      literals; widened agent_surface to Layer-1 ambient instruction files; replaced
      none_grandfathered's free-text form with the required EnforcementRoute grammar; added the
      status_active_max / evaluator_none_grandfathered_max counter pins + the census-binding
      equality rule; ratcheted grandfathered_max 21 -> 19; recorded exit-criteria-ledger as the
      single named non-seedable exception with its route.
  - date: "2026-08-13"
    semantic_break: false
    change_class: accepted_values_narrow
    summary: >-
      CFG-11 conversion: shape_grammar.extension_and_depth now names delegate-cli.md as the sole
      remaining baseline-present grandfathered .md member -- the environment-taxonomy contract was
      converted from markdown to the declared Class D contract environment-taxonomy.yaml.
  - date: "2026-08-14"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      rec-3059 first-wave enforcer build (PLAN-class-d-contract-enforcers): six Class D contracts
      (read-engine, marker-grammar, log-storage, telemetry-lexicon, ci-rca-lifecycle,
      inference-provider) flipped their evaluator from none_grandfathered to a resolving {check:
      <name>}. Ratchet pins lowered to match the live census: evaluator_none_grandfathered_max
      8 -> 2 (all six lose their none_grandfathered claim), grandfathered_max 19 -> 17 (only
      log-storage and inference-provider move buckets -- they are status:ratified; the other
      four are status:active and stay grandfathered by status regardless of evaluator quality).
      status_active_max stays 16 -- no contract's status changed.
  - date: "2026-08-16"
    semantic_break: false
    change_class: accepted_values_narrow
    summary: >-
      rec-3059 wave 2 (PLAN-class-d-enforcers-wave-2), the FINAL enforcer wave: converted the last
      two evaluator.none_grandfathered contracts (composite-action-shape, iam-simulate-fixture) to
      resolving {check: <name>} evaluators, then RETIRED the none_grandfathered kind itself --
      evaluator_kinds narrows from three declarable kinds to two (check, agent_surface); the
      EnforcementRoute model and EvaluatorSpec.none_grandfathered field no longer exist, so the
      retired kind is unrepresentable, not merely unused. grandfather_only_forms.
      evaluator_none_grandfathered, change_detection.evaluator_kind_change and
      census.fields.evaluator_none_grandfathered are removed as dead prose describing a deleted
      rule. Ratchet pins: evaluator_none_grandfathered_max deleted outright (its bucket no longer
      exists); grandfathered_max and status_active_max stay 17/16 -- neither contract's status
      changed. See retirement_notes.evaluator_none_grandfathered below for the full record.

retirement_notes:
  evaluator_none_grandfathered:
    date: "2026-08-16"
    what: >-
      The evaluator.none_grandfathered kind and its EnforcementRoute structured debt record are
      retired. It is no longer a declarable evaluator kind at all: scripts.contracts_schema.
      EvaluatorSpec carries only `check` and `agent_surface`, and its `extra="forbid"` makes the
      old `{none_grandfathered: <route>}` form raise a pydantic ValidationError at load time.
      scripts.checks.contracts._population.check_evaluator_kind_change (the kind-change rule) and
      its Pass 2 call site in validate_contract_drift.py are deleted; the Census.
      evaluator_none_grandfathered bucket and the evaluator_none_grandfathered_max ratchet pin are
      deleted; _ratchet.PIN_KEYS now carries exactly (grandfathered_max, status_active_max).
    why: >-
      rec-3059 opened because 21 free-form docs/contracts files were seeded as Class D with a form
      that never resolves by design -- nothing enforced their CONTENT, only the kind-change rule
      stopped regression. Wave 1 (#905) converted six of the eight files then carrying the form to
      genuinely-resolving evaluators. This wave converts the last two
      (composite-action-shape.yaml, iam-simulate-fixture.yaml). With zero referents left, the form
      itself is deleted rather than left dormant and unused, so the debt class this contract
      exists to police cannot be re-entered by a future Class D landing.
    reversal_path: >-
      Re-add the EnforcementRoute model and the EvaluatorSpec.none_grandfathered field in
      scripts/contracts_schema.py (restoring the three-kind union and its extra="forbid"
      rejection boundary), restore _population.check_evaluator_kind_change and its Pass 2 call
      site in validate_contract_drift.py, restore the Census.evaluator_none_grandfathered bucket
      and its render() segment, and re-add the evaluator_none_grandfathered_max ratchet pin in
      scripts/checks/contracts/_ratchet.py at the then-current census count (0, since no contract
      would carry the form at time of reversal).
    no_decision_minted: >-
      This is a field-semantics narrowing of the evaluator-kind union this contract itself owns --
      Decision 168's own words: "the full shape grammar, evaluator-kind union, and
      change-detection rules live in docs/contracts/contract-population.yaml per Decision 86/127
      routing, not restated here." decision-entry.yaml's significance.routing.field_semantics
      routes a field-semantics change to a governance note in the owning contract, explicitly
      "Never a numbered Decision" -- this note, plus the amendment_log entry above, is that
      governance note. Deletion VACATES a permission ("absent -> none_grandfathered is permitted")
      rather than contradicting a guarantee, so no active Decision requires amendment. Decision
      168's body carries a dated, number-free amendment_forms annotation (docs/DECISIONS.md)
      pointing here as the live record, per decision-entry.yaml's ratified `trailing_bracket` /
      `blockquote_update` amendment_forms.

honesty_clauses:
  not_a_new_bar: >-
    The evaluator obligation makes an already-implicit assertion explicit (the audit's CFG-03
    finding: "a rule with no evaluator is not a rule") rather than adding a new bar. Every Class D
    contract that predates this plan is grandfathered, never retroactively failed.
  step_3_completion: >-
    migration-step-3-grandfathering IS migration-step-3 completion for the MECHANISM half of
    audits/contract-first-governance-33c8667.yaml, and DOES fire Decision 167 clause 3. The
    completing act is the population sweep: seeding 20 of the 21 free-form files as Class D
    contracts (12 with a genuinely-resolving evaluator, 8 with a routed debt record) and
    recording exit-criteria-ledger.yaml's exemption from Class D seeding (later converted to a
    Class A ritual contract by PLAN-cfg-migration-closeout; see amendment_log) -- forward-only
    in the sense that no BUILDING of the 9 unenforced evaluators happens here (rec-3059's
    scope), but the population itself is fully seeded.
  subject_uniqueness_is_precision_not_recall: >-
    Subject uniqueness PREVENTS future duplicate-subject claims and DETECTS NONE of CFG-05's
    existing named instances (a precision-optimal, recall-poor detector by design -- it has no
    population to check uniqueness against until the sweep lands). CFG-05 recall sweep
    (2026-09-01, PLAN-cfg-migration-closeout): answers CFG-05's ideal_behavior clause (a review
    lane for the non-mechanically-decidable contradictory case), not its already-shipped
    mechanical acceptance. Adjudicated 32 contracts across the 12 named adjacent clusters,
    contract-vs-contract axis only -- the Decision-body-vs-contract instance CFG-05 also names
    (Decision 162's body vs composite-action-shape.yaml's R1/R2/R3) is scoped OUT of this pass.
    One genuine overlap found and filed: rec-3354 (storage-substrate.yaml's ops_priority_queue
    entry states dormant/Decision-70-current-state; log-storage.yaml's priority_queue block
    names a live canonical_producer/current_state_read for the same table). No overlap found in
    the other 11 clusters.

shape_grammar:
  declared_shape_obligation: >-
    A NEW (absent from the merge-base baseline) depth-1 docs/contracts/*.yaml or *.yml file must
    carry either a ritual (Class A/B/C) `contract:` block or a valid Class D `contract:` block
    (class D, non-empty `subject`, non-empty `evaluator` resolving per evaluator_kinds below).
    Neither -> FAIL, naming the file and the missing shape. A baseline-present file carrying
    neither is grandfathered (the 21 free-form files this plan does not touch).
  extension_and_depth: >-
    A NEW tracked file under docs/contracts that is not depth-1 with a `.yaml` or `.yml`
    extension FAILS unless it is baseline-present. Case-sensitive by construction (mirrors
    `Path.glob("*.yaml")`): a `.YAML` file is not governed and is treated as ungoverned-extension,
    not as a silently-scanned contract. No grandfathered non-.yaml member remains: the
    environment-taxonomy contract was converted from markdown to the declared Class D contract
    environment-taxonomy.yaml (CFG-11 conversion), and the last .md member (delegate-cli.md) was
    deleted by the Decision 178 cleanse. The file-router prose_allowlist carries no docs/contracts
    glob, so no guard advertises a permission this gate revokes. NOTE: the ratchet pins below are
    unaffected -- the census scans depth-1 *.yaml/*.yml only, so a .md member never entered a
    counted bucket.
  smuggling_detection: >-
    A Class D body may never smuggle Class A (field-shaped) or Class B (verb-shaped) content
    under a Class D label -- Class D exists for heterogeneous MECHANISM content, not as an
    escape hatch from Class A/B's per-field obligations. Two independent detectors, both
    retained: (1) a literal top-level `fields:` or `verbs:` key is rejected by name; (2) any
    top-level key whose value is a mapping of mappings, where every leaf mapping carries at
    least two of a class's descriptor keys, is rejected by shape -- Class A's
    type/nullable/description/semantics/populated_by/dq_intent, or Class B's
    payload_schema_ref/response_codes/typed_errors. This closes the renamed-key evasion (e.g.
    `columns:` standing in for `fields:`) that a name-only rule cannot catch.

evaluator_kinds:
  check: >-
    `{check: <name>}`. Resolves iff `<name>` is a member of registry.all_checks() AND of
    pre_sequence()/full_sequence() (registration alone is insufficient), AND the check's own
    module -- or a one-hop scripts/ module it imports -- contains the contract's BASENAME as an
    exact string-literal match, OR as the final `/`-delimited segment of a PATH-SHAPED
    string-literal (migration-step-3-grandfathering), in EXECUTABLE context. Docstrings and `#`
    comments are excluded. The genuine idiom is segmented (validate_placement.py:19 builds
    `_common.ROOT / "docs" / "contracts" / "file-router.yaml"` piecewise, matched on the bare
    basename segment) -- but a single joined literal (e.g.
    `_CONTRACT_REL_PATH = "docs/contracts/decision-entry.yaml"`) is admitted too, because a
    full-path literal is STRONGER evidence of reading than a bare basename (Decision 168's own
    Significance clause names this contract the SoT for the evaluator grammar; landed under
    Decision 168 reversal (a), "extend the union, never bypass the resolution bar"). MATCHER TRAP
    GUARD: a path-shaped literal containing ANY whitespace is REJECTED even when its final segment
    equals the basename -- a prose sentence that merely ENDS with a contract's basename (verified
    live instance: scripts/checks/iam_tf/_write_companions.py's annotation string ending in
    "...iam-simulate-fixture.yaml") must never certify as a reading.
  agent_surface: >-
    `{agent_surface: <repo-relative-path>}`. Resolves iff the named path exists and its text
    contains the contract's basename -- the non-Python analogue of the check AST scan. Widened
    (migration-step-3-grandfathering) beyond skills/slash-commands to admit Layer-1 ambient
    instruction files (AGENTS.md, CLAUDE.md) as legitimate agent_surface targets -- an ambient
    rule an agent reads on every turn is at least as strong evidence of a genuine evaluator as a
    skill loaded on demand.
  none_grandfathered: >-
    RETIRED (rec-3059 wave 2, see retirement_notes.evaluator_none_grandfathered below). This kind
    is no longer declarable at all -- EvaluatorSpec carries only `check` and `agent_surface`, and
    its `extra="forbid"` makes the old `{none_grandfathered: <route>}` form raise at validation.
    Every Class D contract's evaluator must genuinely resolve; there is no grandfather-only form
    left for a new or existing file to fall back on.

grandfather_only_forms:
  status_active: >-
    `contract.status: active` is grandfather-only. A NEW Class D file may never declare it
    (closed at birth by the gate's new-vs-baseline check); a baseline-present file legitimately
    carrying it loads successfully at the schema layer (scripts/contracts_schema.py has no
    baseline-dependent rule) so the sweep is never blocked by this plan's own substrate. There is
    no transition rule producing `active` -- scripts/contracts.py's _ALLOWED_TRANSITIONS carries
    three OUTBOUND edges (active->ratified, active->deprecated, active->superseded) and
    deliberately no inbound edge.
  evaluator_none_grandfathered: >-
    RETIRED (rec-3059 wave 2) -- see evaluator_kinds.none_grandfathered above and
    retirement_notes.evaluator_none_grandfathered below. No Class D file, new or baseline-present,
    may carry this form any longer; there is no kind-change rule left to enforce because there is
    no kind left to change into.
  counters_open_at_zero: >-
    SUPERSEDED by the two ratchet pins below (migration-step-3-grandfathering, narrowed to two by
    rec-3059 wave 2) -- this section's original claim (both counters open at ZERO, deliberately
    unpinned so the sweep could raise them once) described the PRE-SWEEP state. Post-sweep, the
    grandfather-only counter is pinned by ratchet.status_active_max and bound to the live census
    by EQUALITY (see the ratchet block and census section below) -- the one-time "raise it once"
    latitude was exactly the original sweep, and is now spent.

subject_namespace:
  uniqueness: >-
    Every Class D `subject` must be unique over the union of all declared Class D subjects and
    all ritual (Class A/B/C) contract ids in the current population, deduped per file (a file
    never collides with itself). Two Class D files sharing a subject FAILS; a Class D subject
    colliding with a ritual contract's own id FAILS; a ritual contract merely declaring its own
    id is never itself a failure of this rule.
  topic_equals_subject: >-
    A Class D file registered in docs/contracts/file-router.yaml's `routes:` must have its
    `subject` equal that route's `topic` -- the file-router topic BECOMES the file's subject.
    Mismatch FAILS. A Class D file with no matching route is outside this rule's scope (router
    registration completeness is validate_placement's concern, not this gate's).

change_detection:
  amendment_log: >-
    A Class D file's canonical dump (every top-level key except `amendment_log`) changing with
    no new `amendment_log[]` entry FAILS. A comment-only or formatting-only edit never changes
    the parsed dict, so it always passes.
  base_resolution: >-
    Base content for Pass 2 is resolved as a UNION, in order: (1) the file's own path present at
    the merge-base baseline, (2) the `-M` rename map (a path git detects as a rename past its
    ~50% similarity default), (3) `contract.id` matched against every baseline Class D envelope.
    A file is genuinely NEW only if all three miss -- path alone is defeated by a rename, `-M`
    alone is defeated by a rewrite past the similarity threshold, id alone is defeated by editing
    the id (a one-line, cheaper-than-either evasion).
  conformance_loss: >-
    FAILS iff the base carried a valid shape (ritual or Class D) and the head does not -- this,
    not the ratchet pin's exact value, is the primary defence against a delete-the-contract-block
    fallback: identity-based, so it fires regardless of what the resulting non-ritual population
    count happens to be.

census:
  fields: [scanned, ritual, declared, grandfathered, status_active, skipped]
  discriminating_assertions: >-
    scanned > 0, ritual > 0, and skipped == 0 against the real tree. The bucket identity
    (scanned == ritual + declared + grandfathered + skipped) is retained only as a
    forgot-a-bucket guard with independently computed counters -- it is true by construction over
    a mutually exclusive partition and is explicitly NOT claimed as evidence against a vacuous
    pass. Counts are always derived from the scan, never hardcoded.
  pin_binding: >-
    (migration-step-3-grandfathering, narrowed to two pins by rec-3059 wave 2) Both ratchet.*_max
    pins below are bound to their matching census bucket by EQUALITY, not a ceiling --
    validate_contract_drift fails when a pin does NOT EQUAL its live bucket, in EITHER direction.
    This binding is SUPPRESSED when census.skipped > 0 (rec-3101): a skipped contract's own bucket
    never increments, so without the suppression the equality check would emit a second, misleading
    error whose obvious reading is "lower the pin" -- the correct fix is always to fix the skipped
    contract, never to shrink the debt ratchet.

ratchet:
  # The gate-visible non-ritual population BEFORE this sweep: 40 depth-1 *.yaml files = 16 ritual
  # + 3 declared + 21 grandfathered (all 21 non-ritual, since none had yet seeded a Class D
  # envelope), plus 2 grandfathered .md members (verified independently four times). AFTER this
  # sweep (migration-step-3-grandfathering): 40 = 16 ritual + 5 declared + 19 grandfathered -- the
  # headline ratchet moves only 21 -> 19 because the gate buckets status:active as grandfathered
  # REGARDLESS of evaluator quality (Decision 168 created `active` expressly so the sweep would
  # not assert ratifications that never happened); the substantive result is 12 of 20 seeded files
  # carrying a genuinely-resolving evaluator, 8 carrying a routed debt record, and
  # exit-criteria-ledger.yaml exempted from Class D seeding (see amendment_log for its later
  # Class A conversion, PLAN-cfg-migration-closeout, which moves it into the ritual bucket and
  # lowers this pin 17 -> 16).
  # ZERO SLACK BY DESIGN -- do not round up. An increase is gated through the RATIFIED
  # raise-approved mechanism (docs/contracts/marker-grammar.yaml tokens.raise-approved), never a
  # private existence-only marker; a decrease always passes; a base in which this file does not
  # exist, or carries no entry for a given pin (both new pins below, on this landing), skips the
  # direction comparison for that pin.
  grandfathered_max: 16
  status_active_max: 16
  raise_mechanism: >-
    An inline `# raise-approved: dec-NNN <reason>` comment on a pin's entry line, routed through
    scripts.checks._marker_guard.authorization_failure via the RegistrySpec
    scripts/checks/contracts/_ratchet.py constructs per pin -- rel_path
    docs/contracts/contract-population.yaml, token raise-approved, gated_direction up, flat
    extractor on the pin's own key. Registered in docs/contracts/marker-grammar.yaml
    tokens.raise-approved.used_by. No edit to scripts/checks/_marker_guard.py itself was required.
  raisability_asymmetry: >-
    Verified via _marker_guard.authorization_failure: dec-168's body contains the literal
    substring `ratchet.grandfathered_max`, so THAT pin can be raised straight back by any future
    PR citing dec-168 -- the same Decision 166 point 6 KEY-not-VALUE weakness this plan calls out
    for config/structural_size_budgets.yaml (authorization_failure matches the entry KEY, never
    its VALUE, so one marker permanently authorizes every future bump of that entry). By contrast
    `status_active_max` is a single-segment key (no `/`, so `_expand_ancestor_candidates`
    generates no ancestor beyond the bare key itself) named in NO existing Decision body --
    dec-168 predates this plan and cannot mention a key this plan invents, so a future
    `# raise-approved: dec-168 ...` marker on it would FAIL authorization; raising it requires a
    NEW numbered Decision that names the key. Practical risk is low: the one surviving grandfather
    form (status: active) is closed at birth (grandfather_only_forms above), so the census cannot
    grow to exploit a raised ceiling without a new baseline-present file, which does not exist.
