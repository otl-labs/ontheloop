# Claude projects harness profile for docs/contracts/coordinator.yaml: the contract's terms in one hosted harness
# (a multi-session workspace, in beta), observed facts about it, each dated when last verified, and the
# Claude-projects form of the contract's day_one template. Facts only; rules stay in the contract. The operator made
# this exception to keeping harness facts out of the repository because every workspace that uses the contract on
# this harness shares it (2026-11-08). Re-verify a fact when a rule built on it fails, and correct it here through
# the contract's memory batch (tag [harness]). The copy in the shared store is generated beside the contract's by
# scripts/session/coordinator_copy.py and never hand-edited. Holds no ids, names or operational data (Decision 101).
contract:
  id: coordinator-harness-claude-projects
  class: D
  contract_version: 1
  status: draft
  description: >-
    Class D profile: how docs/contracts/coordinator.yaml's terms map onto the Claude projects harness, the observed
    facts about that harness, and the Claude-projects form of the contract's day_one template.
  subject: coordinator-harness-claude-projects
  evaluator:
    agent_surface: docs/contracts/coordinator.yaml

amendment_log:
  - {date: "2026-11-08", semantic_break: false, change_class: field_add, summary: "Initial authoring (PLAN-coordinator-harness-profile; operator ruling 2026-11-08, a cross-workspace exception to keeping harness facts out of the repository): the harness facts a coordinated workspace kept in its standing instructions and shared store move here."}

terms:  # docs/contracts/coordinator.yaml terms and surfaces -> this harness
  operator: The glossary's operator, writing in the workspace chat (the harness's project chat).
  coordinator: The workspace's coordinator session, which talks to the operator in the workspace chat.
  worker: A workspace thread; one per plan or build.
  standing_instructions: The workspace instructions field (the harness's project instructions).
  memory: The workspace memory store (a MEMORY.md index plus one file per subject).
  shared_store: The workspace's shared folder, /mnt/project-files/ (a network mount).
  self_wake: send_later.
  decision_prompt: A decision card.
  worker_list: list_threads and read_thread.

facts:
  - {id: coordinator-surfaces, verified: "2026-10-31", fact: "The coordinator sees only the workspace instructions, memory and Read on the shared folder: no repository, no plugin skills, no send_later, no triggers, and on GitHub only the PR list. Threads have all of these plus list_threads, read_thread and message_thread."}
  - {id: self-wake, verified: "2026-10-31", fact: "send_later fires; ScheduleWakeup returns success in a thread but never fires. Where send_later asks for permission, treat it as a permission-prompt block."}
  - {id: check-in-warning, verified: "2026-10-31", fact: "The harness warns when self check-ins pass 8 h without a user message; harmless when the operator asked for them."}
  - {id: attachments, verified: "2026-10-31", fact: "A thread holds about 24 attachments; long-running threads keep their files in the shared folder."}
  - {id: safety-check, verified: "2026-10-31", fact: "Once a thread's automatic safety check trips it stays tripped for that conversation; only a fresh thread clears it, started when the operator chooses."}
  - {id: settings-loading, verified: "2026-10-31", fact: "Threads load user settings only: the repository's .claude/settings.json hooks, permissions, skills and agents never load, while CLAUDE.md does. Repo hooks and skills reach threads through a plugin; add both the marketplace and the plugin, and gate each plugin hook to skip where project settings already load it. Plugin settings drop permissions, env and model."}
  - {id: plugin-updates, verified: "2026-11-03", fact: "Plugin updates reach threads automatically; the operator never updates the plugin by hand."}
  - {id: hook-output-timing, verified: "2026-11-02", fact: "Plugin SessionStart output does not reach a thread's first turn; UserPromptSubmit output does, so a hook canary prints there."}
  - {id: model-pins, verified: "2026-10-31", fact: "Threads ignore skill model pins and cannot switch model; set model and effort when the thread starts."}
  - {id: coordinator-address, verified: "2026-10-31", fact: "The coordinator's session id changes when it is recycled; threads re-fetch it before messaging."}
  - {id: environment-pinning, verified: "2026-10-31", fact: "One environment per workspace, which threads cannot choose; a thread started before an environment change keeps the old environment and is replaced."}
  - {id: setup-script, verified: "2026-10-29", fact: "The coordinator has no repository checkout, so an unguarded repo step in the environment setup script stops it starting; guard every repo step."}
  - {id: auto-mode-refusals, verified: "2026-10-30", fact: "Auto-mode refusals have three sources: a classifier verdict that only the operator's own in-thread words naming the action clear; a separate safety check on earlier conversation content that only a fresh thread clears; and relayed approvals, which are never credited."}
  - {id: git-push, verified: "2026-11-05", fact: "Auto mode denies force-with-lease and a push runs as its own command; GitHub deletes the head branch after a squash merge, so follow-up work restarts the session branch from main and pushes plainly."}
  - {id: proxy-admin-paths, verified: "2026-11-06", fact: "The session proxy refuses GitHub admin API paths (environments, vulnerability alerts) whatever the token's rights, so work that needs them runs in CI."}
  - {id: startup-context, verified: "2026-10-29", fact: "Each thread pays about 86k tokens of startup context before any work; keep memory, recalled files and agent-instruction files lean."}
  - {id: memory-saves, verified: "2026-10-29", fact: "Memory saves can be refused while a memory setting is off; tell the operator the first time one fails."}

day_one:  # the Claude-projects form of docs/contracts/coordinator.yaml templates.day_one
  - "Operator: set the workspace's default environment, with every repo step in its setup script guarded (facts setup-script, environment-pinning)."
  - "Operator: add the repository's plugin marketplace and its plugin on claude.ai (fact settings-loading)."
  - "Operator: paste templates.goal into the workspace goal and templates.standing_instructions into the workspace instructions, with 'Harness facts: <shared_store>/coordinator/coordinator-harness-claude-projects.yaml'; seed memory from templates.memory_seed; and give the coordinator the contract's day_one steps 3-4 in its first message."
  - "Coordinator: start one thread that runs coordinator_copy write and confirms its first turn shows the hook canary (fact hook-output-timing)."
