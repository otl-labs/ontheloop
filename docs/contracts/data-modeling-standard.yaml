# Data-modeling standard -- non-ritual index (Decision 86/127). A Class D mechanism contract
# (migration-step-3-grandfathering, T2.56 migration step 3) as of the `contract:` block below.
#
# Generalizes Precision Context Injection (Decision 66) to the data-modeling layer: surface this
# standard at agent reasoning/design time (AGENTS.md ambient rule + planning skill's Data-Model
# Assessment), not as a post-rejection error. Root-caused from the T2.26 execution_plans planning
# session, where a CRUD "one row per rec-revision, mutate in place" model nearly shipped before any
# SCD2 decision loaded.
#
# This file ENUMERATES the standard's rules and a write-mode table, ABSORBS the design-time walk
# relocated from the planning skill's Data-Model Assessment (PLAN-skills-layer-prose-relocation,
# see `design_time_walk` below), and INDEXES the other existing detailed sources rather than
# absorbing them -- see `indexes` below.
#
# Enforcement: scripts/checks/contracts/validate_data_model_standard.py (diff-aware backstop --
# fires when this file or docs/contracts/storage-substrate.yaml changes).
contract:
  id: data-modeling-standard
  class: D
  contract_version: 1
  status: active
  description: >-
    Class D mechanism-contract envelope for this file (migration-step-3-grandfathering, T2.56
    migration step 3). The rules/write-mode-table body itself is unchanged by this envelope.
  subject: data-modeling-standard
  evaluator:
    check: validate_data_model_standard

