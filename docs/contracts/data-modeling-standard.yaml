# Vocabulary reservation (environment-taxonomy.yaml's reserved_meaning / do_not_use_for row
# shape): disambiguates a cluster of "smoke"-adjacent terms that Decision 191's amendment
# (PLAN-ducklake-smoke-harness-classification, rec-3864) proved are easy to conflate. The
# anti_patterns entry below names the specific inference failure rec-3864 root-caused; it carries
# no mechanical check yet -- an unenforced residual owned by follow-on rec-4116 (Decision 181
# cl.2).
vocabulary:
  write_mode:
    reserved_meaning: >-
      An ops_tables entry's declared column, `write_mode: scd2 | append_only | control` -- the
      SOLE class source for every ops_tables physical table (Decision 191).
    do_not_use_for: a maintenance-scope class; a table's catalog residency
  maintenance_class:
    reserved_meaning: >-
      The class ducklake_maintenance_scope.build_registry resolves per physical table --
      write_mode for ops_tables entries, `smoke_harness` for the pair declared under
      field_semantics' `tables:` block (Decision 191 amendment). Governs which maintenance_policy
      cell a verb (merge_ops / reconcile_partitions / rewrite_partition_layout) consults.
    do_not_use_for: catalog residency; a table's lifecycle `status`
  smoke_harness:
    reserved_meaning: >-
      The maintenance class of the PRODUCTION-resident pair ducklake_smoke_history /
      ducklake_smoke_current (declared under field_semantics' `tables:` block, never inferred
      from a name pattern) -- merge_ops applies to it; reconcile_partitions and
      rewrite_partition_layout report it read-only. Move-out of production is follow-on
      rec-4116.
    do_not_use_for: >-
      the ducklake_smoke CATALOG (a separate, isolated meta_schema); a production ops table's
      `status: smoke` lifecycle tag
  ducklake_smoke_catalog:
    reserved_meaning: >-
      The ISOLATED meta_schema (ducklake_smoke) the CI smoke-Lambda kernel-proof harness writes
      to via scripts/ducklake_smoke/core.py and the maintenance-smoke Lambda
      (DUCKLAKE_META_SCHEMA=ducklake_smoke) -- distinct from the production ducklake_ops catalog
      the smoke_harness pair physically resides in.
    do_not_use_for: the smoke_harness pair's production residency; any production table
  status_smoke:
    reserved_meaning: >-
      A production ops_tables entry's lifecycle `status: smoke` tag (e.g. ops_smoke_events) -- an
      append-only kernel-proof table, unrelated to catalog residency or maintenance class.
    do_not_use_for: the smoke_harness maintenance class; the ducklake_smoke catalog
  status_pre_production:
    reserved_meaning: >-
      An ops_tables entry registered in the generated registry and not yet provisioned in production
      ducklake_ops -- flipped to live by the plan that provisions it there (the four telemetry event tables, ops_tenants and
      ops_projects until slice 2c).
    do_not_use_for: >-
      a kernel-proof table (status_smoke); a statement of which catalog holds the table (registration says what a table is,
      never where)
  registry_table_class:
    reserved_meaning: >-
      The `table_class` key of an ops_tables entry in the generated registry, naming the contract class (event) -- the
      marker ducklake_scd2_schema.is_event_table reads.
    do_not_use_for: >-
      the write_mode-derived maintenance class that ducklake_partition_layout and ducklake_maintenance_scope also call
      table_class
  deploy_smoke_gates:
    reserved_meaning: >-
      deploy-ducklake-lambdas.yml's smoke job (scripts/ducklake_smoke/lambda_ec_gates.py) -- reads
      production ducklake_smoke_current via the reader's read_current(table=None) and requires
      row_count >= 1 before promoting a deploy.
    do_not_use_for: a maintenance verb; the smoke_harness classification
  writer_smoke_probes:
    reserved_meaning: >-
      The writer's operator-run EC (existence-check) probes against the smoke-harness pair
      (src/lambdas/ducklake_writer/smoke_actions.py) -- churn that force_recreates the pair from
      its declared spec, load-bearing for the deploy smoke gate.
    do_not_use_for: a maintenance verb; a production write path
  maintenance_smoke_lambda:
    reserved_meaning: >-
      The CI-only ducklake_maintenance_smoke Lambda (DUCKLAKE_META_SCHEMA=ducklake_smoke) that
      runs maintenance verbs against the ISOLATED smoke catalog for kernel-proof coverage --
      distinct from ducklake_maintenance (production) and the smoke_harness pair it never
      touches.
    do_not_use_for: the production ducklake_maintenance Lambda; the smoke_harness class
  anti_patterns:
    - >-
      inferring catalog residency (which META_SCHEMA a table's CREATING caller attached under)
      from a field_semantics key or a "smoke" token anywhere in a table's declared name --
      residency is the META_SCHEMA, never a lexical signal (rec-3864's root cause).

rules:
  - id: grain-first
    statement: >-
      Name the table's grain -- "one row per ___" -- before choosing a write mode or a schema. If the
      grain cannot be stated in one sentence, the design is not ready.
  - id: grain-enforced-at-write
    statement: >-
      Decision 207: every INSERT-GRAIN table (an append_only journal or an SCD2 history table)
      declares a grain key and enforces it AT THE WRITE BOUNDARY -- for an SCD2 history table its
      write ULID (one row per write), for an append_only table its declared merge/dedupe key
      (telemetry: producer, event_id, parser_version). "Content" is every stored column except the
      write-time stamp and declared provenance-only columns (telemetry: created_timestamp and
      producer_version). For an append_only table, declared REPRESENTATION-ONLY columns -- columns whose
      value is a pure function of compared payload-identity columns, declared by dq_intent
      representation_of -- are also excluded, because the identity they represent is compared
      instead (still an equality compare that rejects loudly, never a tiebreak). An identical re-send
      under an existing grain key is a no-op; a row whose
      content differs under an existing grain key is REJECTED LOUDLY (the write fails, naming the
      key) -- never silently dropped, never first-wins or last-wins. Where the engine offers it,
      the reject is the native single-statement primitive (no second catalog read, Decision 88
      cl.1 egress budget). Reader rule: an append_only reader returns one row per grain key; a
      differing pair (only reachable through the concurrent-append race) is reported as
      conflicted, never resolved silently -- DQ owns the race window. SCD2 history readers are
      exempt (a duplicate write ULID is DQ-detected, not reader-detected). Enforcement is bounded
      to the batch's partitions, so the partition column is part of the enforced physical grain. A
      stored whole-row content hash as tiebreak was considered and rejected -- it hides the
      defect. OUT OF SCOPE: Type-1 current projections, control-class tables, and
      replacement-shaped derived materializations (T2.52 c1).
  - id: write-time-enforcement
    statement: >-
      Decision 210: every data rule a write can decide is enforced at the write boundary; DQ
      monitors own only what a write cannot. ROW-LOCAL rules (decidable from one row's own values
      plus static contract data and the writer's clock: type, not-null, accepted values,
      required_when, exactly-one-of, format/bounds, in-row orderings) are always enforced at
      write, rejecting loudly and writing nothing for the whole request (Decision 55, Decision 207
      reject semantics). CROSS-ROW rules are write-owned only when BOTH hold: (a) decidable inside
      the write's own transaction, bounded to the batch's partitions, with no extra catalog
      round-trip, AND (b) its truth does not depend on the arrival order of independent
      producers. Write-owned under this test: the Decision 207 grain MERGE, the ops writer's
      in-transaction referential check (Decision 81 cl.8), the rec status DAG (Decision 103) and
      Decision 84 I-2 id allocation; the ops instances' Decision 207 residuals stay with rec-4121
      items 1-3. DQ-owned remainder: references across independent producers (telemetry parent
      existence, R3), concurrent-append race duplicates, pending generations, cardinalities.
      Single source: write-time checks derive from the table's ONE declared rule source, never
      hand-restated in writer code -- for telemetry the owning Class A contract; for the ops
      tables the owning Class A contract too (rec-4158 plan A):
      docs/contracts/ops_recommendations.yaml declares every rule, field_semantics.yaml is its
      generated projection, and config/agent/data_quality/ops.yaml and the CD.12 Pydantic models
      are DQ-side artefacts, never a write-time rule source. An exemption sits beside the rule
      under write_time_exemptions {class, reason, owner}: class cross_row or temporary names its
      owning rec; class repository_state, a rule no write can ever decide, names the producer
      that enforces it. The class is bound to the exempted kind (cross_row only on
      array_element_reference, repository_state only on acceptance_lint and glossary_lint, either
      becoming temporary as the mark before its removal; temporary, with a review_by date the full
      tier fails once past, on every row-local kind and content leg); the engine records an exemption on any
      row-local rule and never enforces it. DECLARATIONS: a declared rule is an enforced rule, so
      no enforced key exists; staging is only an exclude_before date or an owned exemption;
      not_null is true or {exclude_before}; a nullable false column carries not_null: true; a new
      SCD2 leg carries its own exclude_before, so a new field on an existing SCD2 contract is
      nullable with a dated not_null. OLDER ROWS: a rule binds every column of a row created on or after its
      exclude_before, and any column a write changes, decided from the existing-row fetch the
      writer already makes; on insert every rule binds; on ops_recommendations no exclude_before
      is earlier than the Decision 64 anchor 2026-05-01, a later date is that rule's own
      effective date, never a moved anchor, and a date never moves later or is removed. RATCHET
      (validate_ops_rule_source, against the merge-base): a leg leaves only after a prior temporary
      exemption; a removed value needs an accepted_values_narrow entry naming it, and any other
      params narrowing or an earlier date a semantic-break entry, each carrying `census: 0
      violators (<date>)`; a new or re-classed exemption or a later review_by needs an entry; a
      date is never added to a live leg; a registry id is never removed. COVERAGE (Decision 181
      cl.2), scoped to row-local rules: declarations -> validate_ops_rule_source over every
      contract-backed writer table; writer enforcement -> the ops writer (src/common/ducklake_write_rules.py over
      src/row_rules/rules.py, rules projected into field_semantics.yaml), proven per table by
      validate_write_time_enforcement_conformance (declared equals enforced) and its adapter test, whose action
      set is read from every Lambda manifest's handlers so a new write verb or writer function fails until
      classified, and on every deploy by the --lambda-row-rules smoke gate; narrowing and new exemptions -> the
      ratchet; contract-less tables -> dormant, refused by the writer until their Class A contract lands (owners
      T4.3 c6 and T4.5 c2); adding a source to the registry regenerates field_semantics.yaml, so it ships
      through the DuckLake deploy before any producer emits it (Decision 210 cl.4); the writer-owned cross-row
      rules (grain MERGE, status DAG, id allocation, referential) stay named residuals with rec-4121 and the
      dependency-reference monitor with rec-4166; ops_decisions rules beyond not_null -> rec-4167 (after T1.5
      Phase 2); the portal -> write_validators.py gate_write, the writer's own gate run as a derived pre-check (inserts every rule, updates and upserts undated rules only), never authoritative; ops.yaml -> DQ backstops only, held never stricter than the contract by validate_ops_rule_source.
      A clock-dependent rule is
      monotone (an identical re-send stays a no-op, Decision 207). An in-row ordering between
      values minted by different producers' clocks (e.g. a transcript-less producer's
      event_timestamp against a handed-off session_started_at, rec-4028) crosses a clock domain
      and is enforced only with a declared skew bound in the owning contract, never as an exact
      comparison. A transcript-derived producer can re-emit a rejected row after a fix (re-parse
      under a parser_version bump) but a transcript-less producer (rec-4028) cannot, so the
      write-time-rejects-block-valid-capture reversal condition weighs most for those. Fix at the
      source, never demote to DQ; a new accepted value ships contract amendment plus writer deploy
      before any producer emits it. The writer check is primary on every adapter; engine
      constraints (e.g. NOT NULL) are declared as defence in depth (Decision 100).
  - id: identity-ulid-at-boundary
    statement: >-
      Identity is a ULID (Crockford base32), minted once at the write boundary (the writer Lambda /
      module that owns the insert), never client-side and never a natural-key primary key. Propagated
      to child rows as foreign keys, never re-derived downstream (mirrors Decision 97 / CD.33 clause 2).
      EVENT-TABLE CARVE-OUT (Decision 199): the append_only telemetry tables derive their entity/FK
      keys at the write boundary from a caller-supplied ref, using a normative hash spec
      (telemetry-event-envelope.yaml), rather than minting once and propagating -- still boundary-side,
      never client-side, but a FK equals its parent's key by construction instead of by copying a
      value forward. This carve-out is scoped to telemetry; every other table keeps the plain
      mint-once-and-propagate statement above.
  - id: merge-on-business-key
    statement: >-
      SCD2 merge/upsert logic keys off the table's business key (e.g. rec_id, session_id), not a
      surrogate row id. The business key identifies "the same real-world entity across revisions";
      the surrogate/ULID identifies "this one row."
  - id: partition-every-table
    statement: >-
      Every table is partitioned (CD.9) -- event-time for append_only tables, the appropriate
      mutation/event time column for SCD2 history and current tables. No unpartitioned table. A
      time partition's grain is one partition per UTC calendar day of that column, spelled as the
      DuckLake calendar-prefix triple year(c), month(c), day(c) -- never day(c) alone (rec-4068,
      Decision 137): DuckLake's day()/month()/hour() are day-of-month/month-of-year/hour-of-day,
      not the Iceberg-v2 days-since-epoch semantics the bare spelling was carried over from.
      Verify a partition spec against the pinned engine, not by name -- a transform name is not
      portable between engines (the engine false-friend rule).
  - id: read-cache-never-write-source
    statement: >-
      A local read cache (e.g. logs/*.jsonl) is a derivative projection, never upstream of the
      warehouse. Reading a cache and writing it back through a writer boundary is the CRUD
      anti-pattern in lakehouse clothing (see AGENTS.md Warehouse-as-source-of-truth invariant).
  - id: append-only-default-not-ban
    statement: >-
      append_only / SCD2 as a family is the design default and prior -- this is explicitly NOT a ban
      on sanctioned exceptional physical deletes (Decision 70), lifecycle-closure paths (Decision
      103), or a row-preserving partition-layout rewrite (Decision 204). Those remain legitimate,
      narrowly-scoped exceptions to the insert-only norm, not violations of it.
  - id: derived-state
    statement: >-
      SCOPED to append_only telemetry (Decision 199): a fact that is a function of other rows --
      entity state, duration, roll-up counts, friction classification, cost -- is DERIVED AT READ by
      a named reader verb, never a stored, mutated-in-place column. Such a field is still declared in
      the Class A contract (one schema for readers) with derivation.timing: read, and gets NO physical
      column. Materialization of a derived field (caching it back to a physical column for query
      performance) is a distinct, separately-gated decision owned by tier_item T2.52 clause 1 -- never
      a default a table falls into silently.

design_time_walk: >-
  Walk order (relocated from the planning skill's Data-Model Assessment,
  PLAN-skills-layer-prose-relocation). Conduct this assessment if a table (DDL/schema), a
  field_semantics entry, or a warehouse write path is in scope. 1. Grain: state "one row per ___"
  in one sentence. If it cannot be stated, the design is not ready for the remaining steps.
  Declare the grain key and enforce it at the write boundary per rule grain-enforced-at-write
  (Decision 207). 2.
  merge_key + history/current split: identify the business key the table merges on, and whether
  the table needs a Type-1 current projection alongside its history table (SCD2) or history-only
  (append_only). 3. Identity: ULID, minted once at the write boundary -- never client-side, never
  a natural-key primary key (rule identity-ulid-at-boundary's event-table carve-out, Decision 199,
  applies only to the append_only telemetry tables: boundary-derived from a caller ref via the
  normative hash spec, not minted-once-and-propagated -- still never client-side). 4. Join / correlation keys: identify session/trace FKs and
  cross-table join keys the new table participates in; consult docs/contracts/_joins.yaml (see
  this file's own `indexes` entry below). 5. Write mode: SCD2 (mutable-entity ops tables) vs
  append_only (insert-once event/telemetry tables) -- grain-first, NOT "default to SCD2"
  (telemetry/event tables are insert-once append_only with no SCD2 envelope, Decision 96). 6.
  Partitioning (CD.9): every table is partitioned; name the partition column. 7. Reject-CRUD
  checklist: no in-place UPDATE/DELETE as the default write path, no one-row-per-entity mutation
  model, a read cache is never a write source (AGENTS.md Warehouse-as-source-of-truth invariant). Also classify every
  declared data rule as write-decidable (enforce at write per rule write-time-enforcement,
  Decision 210) or DQ-owned.
  8. Fable escalation: for load-bearing/novel calls only -- a NEW table, a NEW identity scheme, or
  a merge_key change -- dispatch a model:"fable" advice-consult per the overseer skill's Fable
  Advice-Consult Protocol before committing the design. Routine, already-settled calls (an
  additional column on an existing SCD2 table, a grain that matches an existing sibling table) do
  not need escalation. Framing reminder: append-only/SCD2 as a family is the design default/prior,
  explicitly NOT a ban on sanctioned exceptional physical deletes (Decision 70) or
  lifecycle-closure paths (Decision 103).

  6 (expanded, rec-4068). Partitioning (CD.9): every table is partitioned; name the partition
  column AND its grain -- one partition per UTC calendar day of the table's creation/event column,
  spelled as the full calendar prefix (year(c), month(c), day(c) -- never day(c) alone; DuckLake's
  day()/month()/hour() transforms are day-of-month/month-of-year/hour-of-day, not the Iceberg-v2
  days-since-epoch semantics the day() spelling was carried over from). Verify a partition spec
  against the PINNED engine, not by name: a transform name is not portable between engines (the
  engine false-friend rule) -- confirm the actual semantics on the connection's pinned engine
  version before trusting a spec that merely looks familiar.

write_modes:
  scd2:
    shape: history table (every revision, append-only) + a Type-1 current table (one row per business key)
    when_to_use: mutable-entity ops tables -- rows that get updated over their lifetime
    example_tables: [ops_priority_queue, ops_execution_plans]
  append_only:
    shape: history-only event journal; no current-table projection
    when_to_use: insert-once event / telemetry data that is never mutated after the initial write
    example_tables: [ops_smoke_events, telemetry_sessions, telemetry_observations, telemetry_transcripts, telemetry_agents]
  control:
    shape: >-
      a SINGLE physical table -- no history/current SCD2 pair -- partitioned on its own key
      column. Never an append-only journal either: rows are mutated in place (the allocation
      counter), but the mutation is a bounded, no-op-free UPDATE serving the writer's own
      bookkeeping, never an application record.
    when_to_use: >-
      writer-internal control state that exists to support the writer's own operation (e.g. the
      entity-id allocation counter, Decision 84 I-2), never reachable through the generic
      application read/write verbs. The narrow exception to append-only/SCD2-as-default (rule
      append-only-default-not-ban above) -- not a template for ordinary application tables.
    example_tables: [ops_entity_counters]
    invariants:
      - >-
        hard row ceiling per table (e.g. exactly one row per writer-keyspace ops table) -- the
        owning maintenance_binding health verb asserts it as a failing condition, never a report.
      - >-
        partition-on-key (rule partition-every-table, CD.9): partitioned on the table's own key
        column before first write, same as every other table -- the per-table exception this
        implies to CD.9's default day(last_updated_timestamp)/day(trade_date) partitioning is
        named explicitly here, per Decision 137's reversal-conditions clause, rather than
        expressed as a loosened uniform rule.
      - >-
        no-op-free writes: a write that would not change a row's value issues NO UPDATE at all
        (Decision 55) -- an unconditional write turns a bookkeeping row into a serialization
        point / file-churn source even when nothing needs to change (the 2026-09-12 3,418-live-
        file-for-one-row incident this write mode's landing fixes).
      - >-
        mandatory maintenance_binding: every control-class table names, in its Class A contract's
        dq_scope exemption, the maintenance verb that periodically asserts its invariants against
        the live catalog.
      - >-
        dq_scope rule: a control-class table is either DQ-checked like any other table, or
        declares an EXPLICIT `exempt` naming its maintenance_binding health verb -- the DQ runner
        having no reachable read path (read_boundary: none) is not itself sufficient; the
        exemption and its substitute binding must be named, so "forgot" and "deliberately exempt"
        stay distinguishable (docs/contracts/ops_entity_counters.yaml is the worked example).

