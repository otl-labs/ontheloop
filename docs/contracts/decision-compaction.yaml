# Decision 149's number-preserving compaction lifecycle for superseded decision entries, moved from
# docs/contracts/decision-entry.yaml by Decision 276 (split by subject, for that contract's line budget); words
# unchanged except marker_spelling's pointer to decision-entry.yaml's supersession_marker.
contract:
  id: decision-compaction
  class: D
  contract_version: 2
  status: ratified
  ratified_via: "Decision 149 / Decision 175 / Decision 278; moved by Decision 276 / PLAN-decision-delegation-and-cap-measure"
  description: >-
    The compaction lifecycle for a fully superseded decision entry: eligibility, the compacted stub's grammar and the
    archive-or-compact procedure.
  subject: decision-compaction
  evaluator:
    check: validate_decision_entry_conformance

amendment_log:
  - {date: "2026-11-19", semantic_break: true, change_class: field_add, summary: "PLAN-decision-chain-consolidation-rule (Decision 278, amends Decision 149; rec-5265): eligibility_criterion counts a delegated clause as subsumed under three conditions; stub_grammar's Decision marker carries a consolidation victim's point map; consolidation added (threshold, nomination, victims, manifest, abort, procedure). contract_version 1 -> 2."}
  - {date: "2026-11-17", semantic_break: false, change_class: field_add, summary: "PLAN-decision-delegation-and-cap-measure (Decision 276): created; compaction moved from docs/contracts/decision-entry.yaml, words unchanged except marker_spelling's cross-file pointer."}

compaction:
  # Number-preserving decision-compaction lifecycle (audit findings DCG-02/DCG-03,
  # audits/decision-consolidation-growth-f79d6b5.yaml; PLAN-dcg-compaction-lifecycle). The named
  # relief valve for live-file size pressure alongside archival (Decision 146) -- for entries
  # that cannot archive because live code/contracts still cite the number by name. First
  # exercised on Decision 44 (its boundary-pattern table now lives in
  # config/agent/executor/capabilities.yaml per Decision 117, but capabilities.yaml and
  # scripts/checks/executor/validate_executor_boundary.py still cite "Decision 44" by name, so
  # the entry cannot move to the archive).
  eligibility_criterion: >-
    An entry compacts only when its ENTIRE body is superseded/inert AND every live clause is
    restated/subsumed by the superseder OR migrated to a check-backed rehoming destination (a
    mechanism contract with a resolving evaluator; migrate_then_rehome branch below) -- a partial
    supersession with NO destination is never eligible; any unaccounted clause keeps the entry
    full-bodied. Subsumed includes delegated (Decision 278 clause 1): the superseder states the
    clause's ruling and bounds and a key its envelope delegates holds the values; a clause that sets
    a human gate or a commitment is restated or delegated under operator_approval, and a
    contract_amendment key carries a machine-checked bound or names the check that holds it; text
    moved word for word into a key at or under one the superseder delegates counts as delegated,
    and a clause another live entry states, or a key one delegates holds under the same
    conditions, is held there (neither compacted nor a victim).
    Direction-consistency: only the SUPERSEDED VICTIM compacts, never the superseder
    (audits/decision-consolidation-growth-f79d6b5.yaml Q4's archived-52-supersedes-live-37/40
    inversion: an inert superseder beside a full-bodied live victim inverts who holds authority).
  stub_grammar:
    # Non-negotiable shape for a compacted stub. A compaction is a FULL body replacement, never
    # a partial edit -- verify no pre-compaction marker line (e.g. an old non-conforming fused
    # "Decision status: Decided -- <date>" line) survives the edit for a first-match regex to
    # latch onto.
    header: >-
      The '## Decision N: <original title>' header line is UNCHANGED, INCLUDING its original
      parenthetical (e.g. '(Decided)'). Do NOT adopt the DECISIONS_ARCHIVE.md move suffix
      '(Superseded by Decision NN)' (Decision 146) on a live-file stub: a second, silently-diverging
      live convention (the Decision 128/145 silent-trade anti-pattern). scripts.decisions_md's
      parse_decisions_md() prefers the body '**Status:**' marker over the header parenthetical, so
      '(Decided)' never contradicts a body saying Superseded.
    body_markers:
      - "**Status:** Superseded"
      - "**Date:** <ISO YYYY-MM or YYYY-MM-DD>"
      - "**Decision:** <non-empty one-line pointer to the superseding Decision N and, where
        applicable, the code-level artefact that now carries the content; a consolidation victim's
        line also carries its manifest's point map (consolidation.manifest.point_map)>"
      - "**Superseded by: Decision N**"
    marker_spelling: >-
      Uses the EXACT supersession_marker spelling in docs/contracts/decision-entry.yaml -- never the historical '**Superseded
      by:** Decision N' fallback form on a newly-compacted stub.
    never_remove_headers: >-
      A compaction NEVER removes the '## Decision N:' heading, and never retires or reuses the
      number; number retirement and destructive merges (deleting/rewriting a header, hand-merging
      two entries) are permanently out of this mechanism's vocabulary. ~12,103 unguarded inbound
      'Decision N' citations need every number to resolve to a header in one of the two files.
      A vanished header would leave its ops_decisions CURRENT row stale forever (DCG-03);
      scripts/ops_portal/decisions.py::_assert_no_orphaned_current_rows fails that loudly
      (Decision 55), but is a backstop, not a license.
  procedure:
    description: >-
      Operator/agent steps for retiring a fully-superseded decision body: either archive it
      whole (when nothing live still cites the number by name) or compact it in place to a stub
      (when it cannot archive). Both branches are number-preserving; neither is a substitute for
      the other.
    steps:
      - "Confirm eligibility per eligibility_criterion above. If it fails, do not compact or
        archive -- leave the entry full-bodied."
      - "Archive-vs-compact branch: if nothing outside DECISIONS.md/DECISIONS_ARCHIVE.md still
        cites the entry's number by name in a live, non-historical context (code comments,
        docstrings, other contracts), move the whole entry to docs/DECISIONS_ARCHIVE.md per
        Decision 146's archival policy -- this is the preferred, lower-effort path. If live
        code/contracts still cite the number by name (e.g. a code comment reading '(Decision
        N)'), archiving would strand that citation pointing at a file most agents don't read by
        default -- compact in place instead (stay in DECISIONS.md, follow stub_grammar above)."
      - "migrate_then_rehome branch (Decision 175): when eligibility fails ONLY because the
        superseder omits some live clauses, and those clauses are check-backed DERIVED patterns
        (not the entry's original subject), author or extend a mechanism contract with a
        resolving evaluator to own them, repoint their live citers, and record the migration in a
        self-retiring manifest before re-testing eligibility against the widened criterion above.
        Never invoked against a LIVE (non-superseded) entry -- rehoming reaches only a superseded
        victim's derived content, never live-entry extraction."
      - "Compacting in place: replace the entry's ENTIRE body (everything between the header
        line and the closing '---') with the stub_grammar shape above. This is a full-body
        replacement, not a partial edit -- verify no pre-compaction marker line survives."
      - "Run bin/venv-python -m scripts.validate --pre and confirm the DECISIONS size,
        decision-entry conformance, and supersession-annotation guards all pass."
      - "Run bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md so the
        content_hash change writes a terminal Superseded SCD2 version to ops_decisions; the prior
        full-body version stays as history in the warehouse (and git)."

consolidation:
  # Decision 278: retiring a long amendment chain through one consolidating entry (rec-5265; pilot Decision 277,
  # whose accounting stays in tests/checks/decisions/test_consolidation_decision_92.py).
  threshold: 5
  threshold_counts: >-
    Distinct amenders of a root that is not itself superseded_compacted, among docs/decisions-index.json rows that are
    live and not superseded_compacted, read from amends edges; a compacted root is never a candidate. Chain bytes and
    the entries a reader opens are context only; bytes are never apportioned across an amender of several roots.
  nomination: >-
    A root at or over threshold is a candidate, never an obligation. scripts/roadmap/plan_decision_drafts.py prints a
    NOMINATION line (never an INFO line) for each drafted entry that amends a root whose live amenders, the draft
    counted once, reach the threshold (count, chain bytes, entries opened); validate_supersession_annotations prints
    one aggregate WARN line naming the candidate count and the largest by count. Neither fails or files a rec; the
    operator names each subject, which gets its own rec and plan.
  flips_to_hard_fail_when: Never by count alone; a ratified Decision citing a consolidation the nomination missed.
  victims: >-
    The consolidating entry's envelope supersedes the root and each amender whose whole body it carries. An amender
    with live clauses on another subject keeps amends and is named in a clause that restates only the part it amended.
  manifest:
    home: docs/decision-migration/consolidations/<plan slug>.yaml
    shape: >-
      {supersedes: [numbers, equal to the consolidating entry's envelope supersedes], carried_forward: [numbers],
      base_sha: <origin/main sha the units were derived at, recorded for audit>, units: [{id, restated?, delegated?,
      moved?, held?, stanza?, retired?, token?, check?}]}. Each unit carries at least one of restated (clause numbers
      of the consolidating entry), delegated (keys its envelope delegates, whose bounds state the ruling), moved (keys
      the change adds, each at or under a key its envelope delegates), held (a key at or under one another entry
      delegates, or "Decision N" for an entry that states it; that entry is neither superseded_compacted nor a victim
      of this manifest), stanza (ids in its reversal-conditions) or retired (a reason of at least ten words, alone,
      and only for a unit that sets no live ruling: history, rationale, a superseded fact or wording another key
      governs). A unit naming a moved or held target carries a token that target's text (the key's value, or the
      entry's body) contains. A delegated, moved or held key that changes by contract_amendment under a text bound
      names check: the test node id that holds the bound.
    units: >-
      scripts/checks/decisions/consolidation.py partitions each victim body (header, the closing ---, blank lines, the
      metadata envelope and the Status, Date, Warehouse ID, Related and Superseded by markers left out) into units:
      '<N> pt<k>' for a numbered point with its continuation lines, '<N> note <k>' for the k-th annotation paragraph
      (decision-entry.yaml amendment_forms general_rule or a trailing [Amendment), '<N> stanza <id>' for each
      reversal-conditions item, '<N> reversal <letter>' for each lettered item of a prose Reversal conditions
      paragraph, and '<N> <section> p<k>' for the k-th remaining paragraph under the last bold section marker (lines
      before point 1 in its paragraph form one such unit; a marker alone on its line opens the next paragraph). Units
      come only from superseded victims, so moved text comes only from them. In a body with a second numbered list,
      that list's points are '<N> <section> pt<k>'. No unit is hand-listed, and a duplicate unit id is a problem.
    freeze: >-
      A manifest new against origin/main must list exactly the units of its victims' bodies at origin/main, and the
      base text of each unit moved alone (its point number dropped; *, ` and whitespace runs normalised on both sides)
      must sit inside its target's text. A manifest already on origin/main is never re-partitioned, so a later parser
      change never reopens a merged consolidation, and may not drop a unit or a victim. With origin/main unreachable
      the freeze skips with a marker and resolve still runs.
    resolve: >-
      validate_delegated_key_changes, on every run while a manifest exists and before its diff-based early returns,
      fails when a target does not resolve (clause number present, key resolving, stanza id present, Decision header
      present, check's test file defining the function), a token is absent from its target's text, a victim is not a
      compacted stub pointing at the consolidating entry, or a carried_forward number is superseded, has no header or
      is not named in the consolidating entry. A manifest whose consolidating entry is itself superseded at head is
      history: the check skips it, and it stays. Every compacted stub whose Decision line carries 'Point map: ' and
      points at an entry other than Decision 277 that is not itself superseded and whose envelope supersedes the stub
      is a victim in a head manifest, so deleting a live manifest fails.
    point_map: >-
      A victim with numbered points carries, on its stub's Decision line, 'Point map: ' and the map consolidation.py
      renders from its pt units ('pt<k> -> ' and its targets joined by ' and ', units by '; ', ending at the first '.
      '); the check compares them. The same line names each amender of the root, victim or carried forward.
  abort: >-
    If the rulings, once the values are delegated, exceed size_governance.measured_size_norm.cap_bytes, the chain
    holds more than one subject: split into one consolidation per subject or stop. Nothing compacts in part; a rec
    records why.
  procedure:
    - >-
      Confirm the operator named the subject and that its rec exists; take at most four whole victims, the pilot's
      count, so one change stays reviewable; other whole amenders are carried forward: named in a clause, not
      restated, and left live; and once the root compacts it is never nominated again, so the operator names any later
      consolidation of them.
    - >-
      Move each mechanism passage the victims state word for word, in the same change and only from entries it
      supersedes, into a key at or under one the consolidating entry delegates, and give each moved unit a token.
    - >-
      Draft the consolidating entry: rulings and bounds as clauses, values delegated, every victim reversal condition
      re-homed into its stanza, carried-forward amenders named.
    - >-
      Write the manifest, render each stub's point map, then follow the compaction procedure above.
    - >-
      Rollback after merge is a newer superseding entry (Decision 177); the stubs stay.
