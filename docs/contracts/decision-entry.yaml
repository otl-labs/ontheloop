# Decision-entry authoring grammar (audit finding DAF-03 / Decision 134 clause 3 / Plan 3
# PLAN-daf-authoring-grammar). A Class D mechanism contract (migration-step-3-grandfathering,
# T2.56 migration step 3) as of the `contract:` block below -- see
# docs/contracts/contract-population.yaml for the population gate this envelope satisfies.
#
# Purpose: name the ONE canonical shape a docs/DECISIONS.md / docs/DECISIONS_ARCHIVE.md entry
# must take, so authors stop imitating the previous entry (folklore) and every structural
# consumer (the R1 ratification guard, the preflight open-decisions counter, the forward
# conformance check below, any future index generator) can import ONE shared parser --
# scripts/decisions_md.py -- instead of hand-rolling its own regex. This file is the source of
# truth for required_markers/optional_markers; scripts/checks/decisions/
# validate_decision_entry_conformance.py reads required_markers from here at check time (never
# hardcodes its own copy).
#
# Scope: forward-enforced on genuinely-NEW decision entries only (a header number absent from
# the origin/main baseline). The historical band (every entry that exists at origin/main) is
# grandfathered -- imitation-folklore entries do not retroactively fail a contract that postdates
# them (see docs/DECISIONS_ARCHIVE.md's Decisions 52/53/54, promoted from h3 to h2 by this same
# plan, which lack a separate Date marker and would fail Required markers if retro-enforced).
contract:
  id: decision-entry
  class: D
  contract_version: 1
  status: active
  description: >-
    Class D mechanism-contract envelope (migration-step-3-grandfathering, T2.56 migration step 3)
    for the decision-entry authoring grammar that the sections below carry.
  subject: decision-entry-contract
  evaluator:
    check: validate_decision_entry_conformance

amendment_log:
  - date: "2026-08-24"
    semantic_break: false
    change_class: field_add
    summary: "PLAN-decision-37-migrate-then-rehome (Decision 175): added the migrate_then_rehome compaction.procedure branch and widened compaction.eligibility_criterion to admit a check-backed rehoming destination as an alternate restater, for a superseded entry whose superseder restates none of its live (derived-pattern) content."
  - date: "2026-08-19"
    semantic_break: false
    change_class: field_add
    summary: "PLAN-executor-two-plane-roadmap-encoding: added the fifth significance.routing row, work_item (routed by CAPABILITY, \"Never a numbered Decision\"); routing_rule's QUESTION (3) now names it, and the five routing-COUNT statements were made count-free."
  - date: "2026-08-31"
    semantic_break: false
    change_class: accepted_values_narrow
    summary: "PLAN-decision-corpus-stock-ceiling-retirement (Decision 179): dropped size_governance.live_max_h2_headers, .combined_max_bytes, .index_max_bytes and the whole lever_by_ceiling_matrix block; per_entry_size_norm is retained unchanged. Audit finding CFG-07's lever_by_ceiling_matrix is discharged by the retirement -- three of its four rows (live_max_h2_headers, combined_max_bytes, index_max_bytes) lose their subject, and the surviving accrual_rate distinction (\"bends the RATE, not the existing stock\") is not reproduced by per_entry_size_norm."
  - date: "2026-09-01"
    semantic_break: false
    change_class: field_add
    summary: "PLAN-cfg-migration-closeout (rec-3243): added size_governance.accretion_signal -- a WARN-tier-only amendment-delta leg and standing-pressure leg, plus a Decision-163 flips_to_hard_fail_when trigger. intent_accretion_note is deliberately untouched (constraint 4): this signal meters whole-entry bytes, not Intent-section clarifications, so the two coexist rather than contradict."
  - date: "2026-10-27"
    semantic_break: false
    change_class: prose_improvement
    summary: "PLAN-decision-entry-compaction: prose-only compaction (the contracts class relief valve) that retires the dec-175 size raise; no key or value changed. Provenance narrative became citations (the unnamed follow-on recs are now rec-3048, rec-3049 and rec-3050), statements made twice are made once, and compaction.procedure step 1 now points at eligibility_criterion instead of restating its pre-Decision-175 form. The 2026-08-18 row is compacted away: the 2026-08-31 row retired the two keys it added, and its two comment-only corrections stand in git history."

schema_version: 1

header_form: "## Decision NNN: <title> (<status>)"

header_grammar_note: >-
  '## Decision NNN:' (h2) is the sole authoring convention for docs/DECISIONS.md and
  docs/DECISIONS_ARCHIVE.md; no entry may be AUTHORED at h3 (the archive's h3 Decisions 52/53/54
  were promoted to h2 by DPI-07). scripts/decisions_md.py's shared _DECISION_HEADING_RE grammar
  (r"^#{2,3}\s+Decision\s+(\d+):\s*(.+)$") still tolerates h3 for pre-promote git history.

# Every marker below is a bold, colon-terminated line prefix: "**<Marker>:**". Multiline bodies
# (the common case) put the marker on its own line with the body on the following line(s);
# a single-line inline body ("**Marker:** text") is also accepted (see
# scripts.decisions_md._extract_by_marker_pattern, which tries both forms).

required_markers:
  # Every entry -- new or historical -- carries these three. Forward-enforced (new entries
  # only) by validate_decision_entry_conformance; the historical band is grandfathered.
  - Status
  - Date
  - Decision

optional_markers_fixed_spelling:
  # Not required, but WHEN PRESENT must use exactly this spelling so the shared parser's
  # exact-marker extraction (scripts.decisions_md._extract_multiline_section /
  # _extract_related_decisions) recognizes them. A synonym (e.g. "Trigger" for "Problem",
  # "Key details" for "Rationale") is tolerated by the parser as a fallback alias but the
  # canonical spelling below is preferred for new entries.
  - Problem
  - Intent
  - Rationale
  - Reversal conditions
  - Related
  - Warehouse ID

decision_marker_tolerance: >-
  The "Decision" required marker tolerates a decorated form -- "**Decision (four
  invariants):**", "**Decision (single-writer numbering):**" -- as long as the marker's inner
  text starts with the literal word "Decision" (scripts.decisions_md._DECISION_MARKER_BODY:
  r"Decision\b[^:]*"). Plain "**Decision:**" is the preferred spelling for new entries; the
  decorated form is tolerated for continuity with the historical band (e.g. dec-084), never
  widened past the leading word "Decision" (so "**Decision Required By:**", an unrelated field
  used in unheaded candidate-decision sections, never collides).

amendment_forms:
  # GENERAL form, not a closed list of observed openers (CFG-06 class fix,
  # audits/contract-first-governance-33c8667.yaml) -- kept as a LIST (not restructured to a
  # dict) so any downstream pin on the blockquote_update entry's exact "example" prefix keeps
  # working unchanged. The first entry
  # (form: general_rule) states the mechanical rule scripts.decisions_md._TYPED_ID_LIST_TERMINATOR
  # actually enforces; every entry after it is an ILLUSTRATIVE, NON-EXHAUSTIVE example, not a
  # closed enumeration. Enumerating spellings failed TWICE during CFG-06 planning -- a
  # two-opener list missed rows 89/105 ("> **Amended by Decision N (DATE):**"); a three-opener
  # list still missed rows 60/62/68/71 ("> **DATE amendment (...):**") -- and is rejected as a
  # design: the next unlisted annotation spelling is covered automatically by the general rule,
  # with no contract edit required. trailing_bracket and blockquote_update remain the two PINNED
  # spellings for a NEW trailer (blockquote_update's exact prefix is load-bearing); the
  # remaining entries are additional OBSERVED spellings recorded for illustration
  # only, never individually enforced.
  - form: general_rule
    example: "> **...:** ... (any blockquote-bold-prefixed line; see illustrative entries below)"
    description: >-
      A blockquote-bold annotation line ("> **...:**") terminates a typed id-list field (e.g.
      Related); the one NON-blockquote form, a trailing "[Amendment DATE: ...]", needs its own
      "[Amendment " opener. This vocabulary is also the Decision 151 clause 3(ii) in-Intent
      accretion vocabulary (intent_accretion_note), which field_grammar.prose_terminator never
      truncates.
  - form: trailing_bracket
    example: "[Amendment 2026-07-03: ...]"
    description: >-
      A trailing bracketed annotation appended after the entry's original body, dated, prefixed
      "[Amendment ". PINNED spelling for a new non-blockquote trailer.
  - form: blockquote_update
    example: "> **Update (2026-05-01):** ..."
    description: >-
      A blockquote-prefixed dated update line, prefixed "> **Update (". PINNED spelling for a
      new blockquote trailer.
  - form: amended_by_decision
    example: "> **Amended by Decision N (DATE):** ..."
    description: "Illustrative only, matches general_rule above -- not individually enforced."
  - form: dated_amendment
    example: "> **DATE amendment (...):** ..."
    description: "Illustrative only, matches general_rule above -- not individually enforced."
  - form: supersession_note
    example: "> **Supersession note:** ..."
    description: "Illustrative only, matches general_rule above -- not individually enforced."

intent_accretion_note: >-
  The optional Intent marker (Decision 151, DCG-06) is draft-until-merge; after ratification the
  original Intent text is never rewritten -- clarifications, caveats, and exceptions accrue as
  dated, `<source>`-cited, append-only annotations inside the Intent section, in any
  amendment_forms.general_rule shape (or the "[Amendment " form), capped at roughly 3
  clarifications or ~120-150 words before escalating to a superseding Decision plus a Decision 149
  compaction of the superseded entry. Convention-only (Decision 146 operator-disposed stance; no
  validator, no stored guard). Load-bearing on the PARSER side (Decision 151 clause 3(ii)):
  field_grammar.prose_terminator keeps this accretion in the typed intent value
  (tests/test_decision_field_grammar.py::test_intent_retains_dated_in_section_accretion).

supersession_marker: "**Superseded by: Decision N**"
supersession_marker_note: >-
  MUST be spelled EXACTLY as above for a NEW entry (scripts.decisions_md._SUPERSEDED_BY_RE's
  primary form, byte-identical). The historical band's "**Superseded by:** Decision N" (colon
  after "by") is tolerated read-side by the same regex's fallback but is NOT valid for a new entry.

related_decisions_form: >-
  "**Related:** Decision N (...), Decisions M/P (...)" -- both the singular "Decision N" form and
  the plural "Decisions M/P" (slash- or comma-separated) form are accepted; the shared parser
  dedupes by first occurrence (scripts.decisions_md._extract_related_decisions).

decided_date_form: >-
  Prefer an explicit "**Date:**" marker with an ISO-shaped value (YYYY-MM or YYYY-MM-DD). When
  absent, the parser falls back to the "**Status:**" line's " -- <suffix>" clause ONLY when that
  suffix is itself ISO-shaped -- a non-date clause (e.g. "Status: Active -- remove when reversal
  condition is met") is never harvested as a date (DAF-01 fix). New entries should always carry
  an explicit "**Date:**" marker rather than relying on the fallback.

block_separator:
  # rec-2991 (CFG-06 class fix): the contract was previously silent on the trailing "---" block
  # separator, so two authoring sessions for the same remediation resolved the ambiguity in
  # opposite directions by imitating different neighbours -- exactly the folklore this contract
  # exists to eliminate. Forward-enforced on new-in-diff entries only by
  # scripts/checks/decisions/validate_decision_entry_conformance.py's block_separator sub-check,
  # reading this section at check time; the historical band is grandfathered (same posture as
  # required_markers above).
  form: "---"
  required_on: new-in-diff entries only (a header number absent from the origin/main baseline)
  historical_band: >-
    Grandfathered, not retro-enforced: 21 of 146 entries at CFG-06 plan time lack it (23, 48, 64,
    65, 76, 94, 102, 103, 118 and 152-163); rec-3049 tracks retro-standardisation.
  reason: >-
    Majority convention (125/146) and current practice (Decisions 164-166) agree, so forward
    enforcement is low-risk; nothing mechanical depends on the separator (blocks are
    heading-delimited by _iter_decision_sections; end-of-block covers the no-separator case in
    every terminator lookahead) -- purely an authoring-consistency gap.

field_grammar:
  # CFG-06 class fix (audits/contract-first-governance-33c8667.yaml): states each typed
  # extractor's continuation forms and terminator set explicitly, per-extractor, so the next
  # divergence between this contract and scripts/decisions_md.py fails
  # tests/test_decision_field_grammar.py instead of silently corrupting a warehouse column. This
  # section governs the FIELD extractors; header_form / header_grammar_note above governs the
  # header grammar (see shared_parser_note for how the mandate spans both).
  title_relation_continuation:
    # extract_amends_edges() / _extract_title_borne_supersedes(), both built on
    # scripts.decisions_md._extract_title_relation_targets.
    extractor: extract_amends_edges
    relation_word: amends
    accepted_forms:
      - example: "amends Decision 145, Decision 134 clause 2, and Decision 146"
        expected: [145, 134, 146]
        reason: "dec-160's real title: a ', Decision N' and an 'and Decision N' continuation together."
      - example: "amends Decision 122, 116"
        expected: [122, 116]
        reason: "comma continuation accepts a bare number (no repeated 'Decision' token)."
      - example: "amends Decision 122 and Decision 116"
        expected: [122, 116]
        reason: "'and' continuation accepts a repeated 'Decision' token."
      - example: "amends Decision 122 and 116"
        expected: [122, 116]
        reason: "'and' continuation also accepts a bare number (CFG-06 widening)."
      - example: "amends Decision 116 and 117 clause 2"
        expected: [116, 117]
        reason: >-
          a bare-number continuation followed by a recognized qualifier (clause N / point N /
          cl.N) stays admitted; the boundary excludes only open-ended prose.
    rejected_forms:
      - example: "amends Decision 104, mirrors Decision 132"
        expected: [104]
        reason: "a different relation word ('mirrors') after a comma is not a plural-list continuation."
      - example: "amends Decision 73, 2nd amendment; builds on 80/104/124/131"
        expected: [73]
        reason: >-
          an ordinal ('2nd') fails the \b word-boundary digit check; 'builds on' names no 'Decision' token.
      - example: "as amended by Decision 116"
        expected: []
        reason: "'amended' is a different whole word from 'amends' -- the inverse direction never matches."
      - example: "amends CD.28 clause 3"
        expected: []
        reason: "CD.28 is not 'Decision N' -- the seed regex requires an immediately-adjacent Decision(s) N token."
      - example: "amends Decision 116 and 2027 planning cycle"
        expected: [116]
        reason: >-
          a bare-number 'and' continuation followed by open-ended prose is REJECTED (2027 is
          incidental prose, not a citation): only the bare-number branch of the comma/and
          continuations requires _BARE_NUMBER_BOUNDARY_RE (closing punctuation, another 'and', or
          a point/cl./clause qualifier) immediately afterward; a repeated 'Decision' token does not.
      - example: "amends Decision 116, 2027 planning cycle"
        expected: [116]
        reason: >-
          the same false-positive shape for the comma continuation, closed by the same
          _BARE_NUMBER_BOUNDARY_RE (both continuations share one grammar and one risk class).
  prose_terminator:
    used_by:
      - _extract_by_marker_pattern
      - _extract_section
    regex: '(?=\n\*\*\w|\n---|\Z)'
    justification: >-
      Stops at a following bold marker, a --- block separator, or end-of-block/file --
      DELIBERATELY does not stop at an amendment_forms opener (Decision 151 clause 3(ii)): a
      dated in-section accretion inside Problem/Intent/Rationale must remain part of the typed
      value, so a future clarification is never silently truncated out of the corpus. See
      intent_accretion_note above.
  typed_id_list_terminator:
    used_by:
      - _extract_related_decisions
    regex: '(?=\n\*\*\w|\n---|\n\[Amendment |\n> \*\*|\Z)'
    justification: >-
      The prose_terminator set PLUS both amendment_forms openers ("[Amendment " and the GENERAL
      "\n> **" rule, never a closed list), so a trailer after a typed id-list field (e.g. Related)
      never contributes its cited ids. Live regression case: Decision 146's trailer naming
      Decision 160 (rec-2990).
    accepted_forms:
      - example: "**Related:** Decision 60 (...).\n\n> **Amended by Decision 164 (2026-07-01):** ...\n\n---"
        expected: [60]
        reason: "the general blockquote-bold-annotation rule stops the capture before the trailer."
      - example: "**Related:** Decision 84 (...).\n\n[Amendment 2026-08-07: Decision 160 ...]\n\n---"
        expected: [84]
        reason: "the non-blockquote '[Amendment ' opener also stops the capture."
    rejected_forms:
      - example: "**Related:** Decision 60 (...).\n\n**Superseded by: Decision 164**\n\n---"
        expected: [60]
        reason: "a following bold marker already terminates via the shared prose_terminator set."
      - example: "**Related:** Decision 60 (see the blockquote '> style' convention).\n\n---"
        expected: [60]
        reason: >-
          an inline '>' is NOT the blockquote opener: the terminator requires the exact '\n> **'
          prefix, so this near-miss does not truncate the Related capture.
      - example: "**Related:** Decision 60 (informal note: [not an amendment here]).\n\n---"
        expected: [60]
        reason: >-
          '[not an amendment' is not the exact '\n[Amendment ' opener (different text, not at a
          line start), so this near-miss does not truncate the Related capture.
  projection_residue:
    # Decision 134 clause 5(b) forward-note (Decision 55 spirit-flag, accepted during CFG-06
    # planning): recorded machine-readably here, not only in plan prose, so a future
    # content-parity gate inherits the exact set.
    description: >-
      The typed_id_list_terminator's GENERAL "\n> **" rule drops trailer-borne ids the
      PRE-CFG-06 parser included in related_decisions on these eleven entries. The ops_decisions
      backfill is content-hash gated on sha256(raw_block) (Decision 84), so these rows re-project
      only when each raw_block next changes: a fidelity lag, not a source-of-truth inversion.
      rec-3050 tracks reconciliation.
    row_count: 11
    rows: [60, 62, 68, 71, 74, 87, 89, 103, 105, 116, 122]
  known_divergent_grammars:
    - grammar: scripts.checks.decisions.validate_supersession_annotations._EDGE_RE
      description: >-
        A third, deliberately-unaligned whole-block grammar (verb + immediately-adjacent
        "Decision N", scanning the ENTIRE block, not just the title) that reads only the first
        citation per relation word; CFG-06 left it unaligned (rec-3048).

metadata_envelope:
  # Typed metadata carried as a fenced ```yaml block, forward-only (new-in-diff entries only --
  # PLAN-decision-entry-flow-governance, Decision 167). Enforced by
  # scripts/checks/decisions/validate_decision_entry_conformance.py; read by
  # scripts/decisions_md.py's parse_decisions_md, which prefers envelope values over the legacy
  # bold-marker/title grammar -- retained permanently as the fallback for every entry with no
  # envelope (additive, never a cutover). The Significance obligation below lives here as a
  # required_fields entry, NEVER as a fifth top-level required_markers bold marker -- the audit's
  # own f2 is explicit the claim is carried in the envelope, "not as a fifth bold marker".
  fence: "```yaml"
  fence_note: >-
    A BARE `yaml` info string -- never `yaml reversal-conditions` (Decision 133's monitored
    stanza, matched by scripts/preflight/decision_conditions.py on that exact info string) and
    never a `---` fence (already overloaded as block_separator and as a field terminator in both
    parser terminator constants above).
  placement: >-
    Immediately after the '## Decision N:' heading line (the conventional single blank line
    between heading and fence is tolerated).
  scope: >-
    Forward-only -- required on new-in-diff entries only (a header number absent from the
    origin/main baseline). The historical band is never retro-enforced; none of it carries one.
  required_fields: [number, significance]
  optional_fields: [status, decided_date, amends, supersedes]
  field_shapes:
    number: The heading's own decision number -- disagreement fails the entry.
    status: Overrides the legacy **Status:** bold marker when present; must not conflict with it.
    decided_date: Overrides the legacy **Date:** bold marker when present; must not conflict.
    amends: A list of decision numbers, overriding the legacy title-relation "amends" extraction.
    supersedes: A list of decision numbers, overriding the legacy title-borne "Supersedes" extraction.
    significance:
      value: One of significance.routing's keys below.
      justification: A non-empty one-line reason the claimed routing row applies.
  compacted_stub_exemption: >-
    A Decision 149 compacted stub (compaction.stub_grammar's fixed body, including the literal
    "**Status:** Superseded" marker and a live "**Superseded by: Decision N**" pointer) is exempt
    from this obligation -- a compaction replaces a body it never authored, and stub_grammar's
    fixed Status value would otherwise trip the envelope/body conflict rule.

significance:
  # Decision-log growth DIRECTION mechanism (audit finding DCG-05, Decision 150; upstream sibling
  # of the compaction: shape-after-the-fact mechanism below). Gates what MAY become a numbered
  # Decision in the first place, so growth stays bounded in SHAPE, not just size (Decision
  # 134/145's byte ceilings). Cited by the planning skill's decision-authoring step (Decision
  # Significance Gate, just before Candidate Decision Ratification); the routing rows below are a
  # citable classification vocabulary in their own right.
  bar: >-
    A numbered `## Decision NNN:` entry is reserved for a durable architectural commitment with
    reversal-relevant consequences. Content that does not clear this bar routes per one of the
    rows below instead of minting a new number.
  routing:
    numbered_decision: >-
      A durable architectural commitment with reversal-relevant consequences -> a numbered
      `## Decision NNN:` entry in docs/DECISIONS.md (restates the bar above as a routing row, for
      symmetry with the other rows).
    cd_state_flip: >-
      A candidate_decision (CD.NN) status transition / gate-clear -> the batch-wave ratified form
      in docs/contracts/candidate-decision-ratification.yaml (same-session PURE gate-clears may
      share one wave `## Decision N` entry with per-CD clauses); a content-bearing ratification
      keeps its own entry.
    operational_fact: >-
      A transient/operational statement -- what-is-currently-true, or a point-fix with no
      forward-standing architectural commitment -> a recommendation via
      `scripts.ops_data_portal file_rec`, or a tier_item progress_note when it is roadmap status.
      Never a numbered Decision.
    field_semantics: >-
      The meaning or constraints of a data field or config key -> a governance/semantics note in
      the OWNING contract (Decision 86/127 routing), collocated with the field it describes.
      Never a numbered Decision.
    work_item: >-
      Durable SEQUENCING work -- something that must be done, in some order, against some gate --
      rather than a commitment about how the system is shaped. Never a numbered Decision.
      MIGRATION DIRECTION, so this row cannot freeze: recs are the DESTINATION form and the roadmap
      the BOOTSTRAP that recs supersede (ops_recommendations already carries `dependencies
      VARCHAR[]`). Route by CAPABILITY, never topic: work needing something only the ROADMAP
      supplies today -- cross_tier_gate evaluation, MVP-boundary classification
      (`deferred_post_mvp`), per-criterion `exit_criteria` lifecycle -- goes to a tier_item or an
      exit criterion; everything else defaults to `file_rec`, and the boundary moves as recs gain
      those capabilities. DELIBERATE DEFERRAL resolves here: a not-now that CLASSIFIES work against
      the MVP boundary, or needs gate/criterion lifecycle, is roadmap work; a one-off not-now is a
      `declined` rec saying why-not-now and what reopens it -- never a `deferred` status, which the
      portal rejects.
  routing_rule: >-
    Three questions gate whether new prose becomes a numbered Decision (Decision 167 clause 1):
    (1) Is this a durable architectural commitment, not a transient operational fact? (2) Does it
    carry reversal-relevant consequences if it later proves wrong? (3) Does no existing routing
    row (cd_state_flip / operational_fact / field_semantics / work_item) already own this content? All three
    "yes" routes to numbered_decision; any "no" routes per the matching row above. The vocabulary
    bound is on WHAT MAY APPEAR in significance.value (one of the routing keys), never an
    acceptance mandate that a specific row must be claimed.
  standing_commitment: >-
    This routing rule is forward-standing, not a one-time gate exercised only at Decision 167's
    own authoring -- every future candidate entry re-applies all three questions before minting a
    number, for as long as this significance section is in force.

compaction:
  # Number-preserving decision-compaction lifecycle (audit findings DCG-02/DCG-03,
  # audits/decision-consolidation-growth-f79d6b5.yaml; PLAN-dcg-compaction-lifecycle). The named
  # relief valve for live-file size pressure alongside archival (Decision 146) -- for entries
  # that cannot archive because live code/contracts still cite the number by name. First
  # exercised on Decision 44 (its boundary-pattern table now lives in
  # config/agent/executor/capabilities.yaml per Decision 117, but capabilities.yaml and
  # scripts/checks/executor/validate_executor_boundary.py still cite "Decision 44" by name, so
  # the entry cannot move to the archive).
  eligibility_criterion: >-
    An entry compacts only when its ENTIRE body is superseded/inert AND every live clause is
    restated/subsumed by the superseder OR migrated to a check-backed rehoming destination (a
    mechanism contract with a resolving evaluator; migrate_then_rehome branch below) -- a partial
    supersession with NO destination is never eligible; any unaccounted clause keeps the entry
    full-bodied. Direction-consistency: only the SUPERSEDED VICTIM compacts, never the superseder
    (audits/decision-consolidation-growth-f79d6b5.yaml Q4's archived-52-supersedes-live-37/40
    inversion: an inert superseder beside a full-bodied live victim inverts who holds authority).
  stub_grammar:
    # Non-negotiable shape for a compacted stub. A compaction is a FULL body replacement, never
    # a partial edit -- verify no pre-compaction marker line (e.g. an old non-conforming fused
    # "Decision status: Decided -- <date>" line) survives the edit for a first-match regex to
    # latch onto.
    header: >-
      The '## Decision N: <original title>' header line is UNCHANGED, INCLUDING its original
      parenthetical (e.g. '(Decided)'). Do NOT adopt the DECISIONS_ARCHIVE.md move suffix
      '(Superseded by Decision NN)' (Decision 146) on a live-file stub: a second, silently-diverging
      live convention (the Decision 128/145 silent-trade anti-pattern). scripts.decisions_md's
      parse_decisions_md() prefers the body '**Status:**' marker over the header parenthetical, so
      '(Decided)' never contradicts a body saying Superseded.
    body_markers:
      - "**Status:** Superseded"
      - "**Date:** <ISO YYYY-MM or YYYY-MM-DD>"
      - "**Decision:** <non-empty one-line pointer to the superseding Decision N and, where
        applicable, the code-level artefact that now carries the content>"
      - "**Superseded by: Decision N**"
    marker_spelling: >-
      Uses the EXACT supersession_marker spelling above -- never the historical '**Superseded
      by:** Decision N' fallback form on a newly-compacted stub.
    never_remove_headers: >-
      A compaction NEVER removes the '## Decision N:' heading, and never retires or reuses the
      number; number retirement and destructive merges (deleting/rewriting a header, hand-merging
      two entries) are permanently out of this mechanism's vocabulary. ~12,103 unguarded inbound
      'Decision N' citations need every number to resolve to a header in one of the two files.
      A vanished header would leave its ops_decisions CURRENT row stale forever (DCG-03);
      scripts/ops_portal/decisions.py::_assert_no_orphaned_current_rows fails that loudly
      (Decision 55), but is a backstop, not a license.
  procedure:
    description: >-
      Operator/agent steps for retiring a fully-superseded decision body: either archive it
      whole (when nothing live still cites the number by name) or compact it in place to a stub
      (when it cannot archive). Both branches are number-preserving; neither is a substitute for
      the other.
    steps:
      - "Confirm eligibility per eligibility_criterion above. If it fails, do not compact or
        archive -- leave the entry full-bodied."
      - "Archive-vs-compact branch: if nothing outside DECISIONS.md/DECISIONS_ARCHIVE.md still
        cites the entry's number by name in a live, non-historical context (code comments,
        docstrings, other contracts), move the whole entry to docs/DECISIONS_ARCHIVE.md per
        Decision 146's archival policy -- this is the preferred, lower-effort path. If live
        code/contracts still cite the number by name (e.g. a code comment reading '(Decision
        N)'), archiving would strand that citation pointing at a file most agents don't read by
        default -- compact in place instead (stay in DECISIONS.md, follow stub_grammar above)."
      - "migrate_then_rehome branch (Decision 175): when eligibility fails ONLY because the
        superseder omits some live clauses, and those clauses are check-backed DERIVED patterns
        (not the entry's original subject), author or extend a mechanism contract with a
        resolving evaluator to own them, repoint their live citers, and record the migration in a
        self-retiring manifest before re-testing eligibility against the widened criterion above.
        Never invoked against a LIVE (non-superseded) entry -- rehoming reaches only a superseded
        victim's derived content, never live-entry extraction."
      - "Compacting in place: replace the entry's ENTIRE body (everything between the header
        line and the closing '---') with the stub_grammar shape above. This is a full-body
        replacement, not a partial edit -- verify no pre-compaction marker line survives."
      - "Run bin/venv-python -m scripts.validate --pre and confirm the DECISIONS size,
        decision-entry conformance, and supersession-annotation guards all pass."
      - "Run bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md so the
        content_hash change writes a terminal Superseded SCD2 version to ops_decisions; the prior
        full-body version stays as history in the warehouse (and git)."

currency:
  # Decision-corpus currency projection (PLAN-decision-corpus-currency, rec-3055/rec-3056). A
  # derived, per-live-entry classification of how directly an entry's content still governs,
  # projected onto docs/decisions-index.json by scripts.decisions_index and enforced by the
  # registered check scripts/checks/decisions/validate_decision_currency.py. Archive rows never
  # carry this key -- projection-only on live rows. rec-3012 (migration step 5) landed:
  # scripts.decisions_index now skeletonizes every live:false row to eight stable keys, so an
  # archive row was never at risk of carrying currency in the first place.
  values: [current, amended, superseded_pointer, superseded_compacted]
  derivation:
    # Precedence order (first match wins). scripts.decisions_md.derive_currency is the single
    # implementation -- this restates it for the contract reader, never a second regex.
    superseded_compacted: >-
      A Decision 149 compacted stub (compaction.stub_grammar above;
      scripts.decisions_md.is_compacted_stub): its body was wholly replaced with a '**Status:**
      Superseded' marker and a live '**Superseded by: Decision N**' pointer.
    superseded_pointer: >-
      The entry carries a victim-side '**Superseded by: Decision N**' pointer, OR its number is
      the target of an inbound supersedes edge (another entry's title or envelope declares it
      supersedes this one) -- without being a compacted stub. Example: Decision 80, superseded
      only by Decision 104's inbound title edge, body untouched.
    amended: >-
      The entry's number is the target of an inbound amends edge (another entry's title or
      envelope declares it amends this one), OR its bold '**Status:**' marker begins with
      'Amended' (the residual historical status-prose band, e.g. Decision 67).
    current: "None of the above."
  consumer_contract: >-
    ONLY 'superseded_compacted' may remove an entry from a consumer's active set (e.g.
    decision-scout demoting CITE/CONTRADICT to RELATED). 'superseded_pointer' and 'amended'
    annotate and NEVER filter, and NEVER reduce severity -- a supersession pointer or an amends
    edge cannot by itself distinguish full from partial supersession/amendment (see
    scripts.checks.decisions.validate_supersession_annotations._EDGE_RE, which matches
    "supersedes"/"amends"/"partially supersedes" identically), so treating either as a filter
    signal would silently demote a still-governing entry.
  reversal_conditions: >-
    Reconsider this token set if a live entry is ever authored with a Reversed or Deferred bold
    Status marker (today's live census is zero such entries; invariant I4 fails the build the
    day one appears, via an explicit, empty-at-install grandfather hook that lives as a
    module-level constant in scripts/checks/decisions/validate_decision_currency.py -- never a
    contract key, per Decision 165 clause 4's "growing the hook later is a reviewed code edit,
    never a config edit"). Reconsider consumer_contract's non-filtering rule for
    superseded_pointer/amended if a future authoring change makes full-vs-partial
    supersession/amendment mechanically distinguishable at the edge level.
  accepted_cost: >-
    reversal_conditions above is documentation only: scripts/preflight/decision_conditions.py
    watches only a fenced ```yaml reversal-conditions stanza in a numbered DECISIONS.md entry, and
    this content routes here by Decision 150's field_semantics row (Decision 167 clause 2 rejects
    a number for it). No claim is made that it reproduces a monitored stanza.

size_governance:
  per_entry_size_norm:
    cap_bytes: 6144
    measured_as: >-
      Heading-to-next-heading UTF-8 byte span -- the same span
      scripts/checks/decisions/validate_decisions_size.py measures.
    tier: >-
      hard-fail -- appends to `failed` (scripts/checks/decisions/validate_decisions_size.py's
      `_per_entry_cap_failures`) for a new-in-diff entry over the cap; Decision 167 clause 3
      pre-authorized the flip at migration step 3 (migration-step-3-grandfathering, T2.56).
    scope: Forward-only -- new-in-diff entries only; historical entries are never measured.
  accretion_signal:
    tier: >-
      WARN-only, never appends to `failed` (rec-3243; annotations are sanctioned per Decision
      151, so this meters the channel rather than banning it).
    amendment_delta_leg: >-
      A BASELINE entry (present at origin/main and head) WARNs when its body byte-span changed
      (delta != 0, not delta > 0 -- Decision 178 retired validate_live_entry_immutability, so a
      rewrite can shrink or hold span flat) AND the new span exceeds per_entry_size_norm.cap_bytes.
    standing_pressure_leg: >-
      One aggregate WARN line naming the count of live entries (new or historical) over 1.2x
      per_entry_size_norm.cap_bytes and the largest offender -- never one line per entry.
    scope_boundary: >-
      Meters WHOLE-ENTRY byte deltas only; intent_accretion_note's Intent-section convention
      above is neither metered nor superseded by it -- the two coexist.
    flips_to_hard_fail_when: >-
      Decision 163's named staged-lever trigger: a future ratified Decision citing sustained
      standing pressure or a repeated undetected in-place rewrite, mirroring
      per_entry_size_norm's own migration-step-gated WARN-to-hard-fail flip.

shared_parser: scripts/decisions_md.py
shared_parser_note: >-
  The single importable grammar every structural consumer must use: iter_decision_headings(content)
  (raw heading-match iterator) and decision_header_numbers(paths=None) (decision numbers across
  files), both built on the module's single _DECISION_HEADING_RE ('#{2,3}'); a hand-rolled header
  regex is the divergence this contract exists to close (DAF-03). CFG-06 extends the mandate to
  every typed FIELD extractor -- _extract_by_marker_pattern, _extract_section (no production
  caller; tests/decisions_md/test_parse.py exercises it) and _extract_related_decisions -- each
  must use one of field_grammar's two terminator constants (_MARKER_SECTION_TERMINATOR for prose
  sections, _TYPED_ID_LIST_TERMINATOR for the typed id-list), never a hand-rolled lookahead.
  tests/test_decision_field_grammar.py pins both constants to field_grammar's regexes (CI fails
  on divergence).
