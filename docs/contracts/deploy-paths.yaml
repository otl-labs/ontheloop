# Deployment-model navigation index (Decision 126). A Class D mechanism contract
# (migration-step-3-grandfathering, T2.56 migration step 3) as of the `contract:` block below.
#
# Purpose: for each of the three agent intents (provision / deploy_code / reconcile), the
# operator-only admin tier, and the operator-only publish_artifacts registry-publication channel,
# name the trigger, the actor role, and a recovery pointer -- PLUS
# the operator-tier procedure (admin_out_of_band.procedure below): the quarantined break-glass
# recovery steps, moved out of terraform/CLAUDE.md's ambient dev-loop doc per Decision 127 /
# tier_item T2.41. It is a POINTER for the other tiers and a PROCEDURE for the operator tier --
# never a second source of truth: the apply-model / guard-classification rules (what blocks an
# apply, in-budget vs out-of-budget IAM, guard exit codes) live SOLELY in
# docs/contracts/environment-taxonomy.yaml (Decision 92 point 5 sole-SoT; Decision 86 no-drift) --
# this file never restates them, including inside admin_out_of_band.procedure.
#
# Roles below are logical names only. No confidential AWS identifiers of any kind (account
# numbers, resource names, cross-account trust tokens) appear in this file (Decision 101
# public-content boundary) -- this repository is PUBLIC.
contract:
  id: deploy-paths
  class: D
  contract_version: 1
  status: active
  description: >-
    Class D mechanism-contract envelope for this file (migration-step-3-grandfathering, T2.56
    migration step 3). The intent -> trigger -> recovery index body itself is unchanged by this
    envelope.
  subject: deploy-paths-navigation
  evaluator:
    agent_surface: AGENTS.md

