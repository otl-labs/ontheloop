schema_version: 1
decision: Decision-126

provision:
  description: "Infra changes: anything under terraform/**."
  trigger: "Open a PR touching terraform/**; CI plans and applies."
  actor_role: agent
  blocks_ref: "environment-taxonomy.yaml (axis_a apply gating + guard_classification)"
  recovery: "If the guard blocks the change (IAM/trust/destroy or out-of-budget), see reconcile below; do not fall back to a local apply."
  note: "Agents never run terraform apply as a self-directed, routine action -- the sole exception is the human-gated break-glass admin tier (see admin_out_of_band below)."

deploy_code:
  description: "Code-only deploys for artifacts on a governed code-deploy channel (e.g. the DuckLake Lambdas, or the three prod-class Lambdas)."
  trigger: "The governed code-deploy channel named in docs/contracts/build-lambda.yaml's deploy_channels. Terraform is not involved."
  actor_role: agent
  blocks_ref: "build-lambda.yaml#deploy_channels"
  recovery: >-
    Governed channel unavailable/not yet built for a given artifact: docs/contracts/build-lambda.yaml
    names the interim break_glass_only command for that artifact (operator-only, see admin_out_of_band
    below). DUCKLAKE COLUMN-RECONCILE RED STATE (hotfix follow-up to the 2026-07-24 ops_decisions
    incident -- NOT the same thing as the `reconcile:` key below, which is the TERRAFORM infra-drift
    Reconcile action; this is a DuckLake physical-schema reconcile, unrelated): if
    deploy-ducklake-lambdas.yml's reconcile-gate job is red, a reconcile_scope=ducklake ops table in
    config/lambda/ducklake/field_semantics.static.yaml has a non-empty pending_reconcile and the
    serving deploy (writer/reader/catalog-dr) and the production telemetry deploy (telemetry-writer/telemetry-reader)
    are refused by design -- the maintenance deploy and the ungated smoke telemetry twin still ship; a red
    maintenance gate (maintenance-smoke) also blocks the production telemetry deploy, by intent (Decision 236). The remedy is the admin-tier `reconcile_columns` action against the deployed
    ducklake_maintenance function (Decision 143 cl.2 / Decision 151 cl.2: never autonomous, never
    reachable from PlatformDev or CI) followed by clearing pending_reconcile in the sidecar (moving
    the column into `reconciled` with the response body as evidence) -- see
    scripts/checks/ops_governance/validate_reconcile_pending_gate.py. The Decision 125 break-glass
    command (build_lambda --ducklake-only --deploy, above) bypasses this refusal entirely and is the
    only escape hatch while the reconcile is outstanding; use it only under the same operator-directed
    conditions as any other break-glass invocation.
    TELEMETRY PRODUCTION COLUMN HOLD: while a reconcile_scope=telemetry_catalog table in the same sidecar has a
    non-empty pending_reconcile, deploy-telemetry skips the production telemetry writer and reader (a GREEN run with a
    TELEMETRY_PRODUCTION_HOLD notice; telemetry-smoke skips) and the ducklake_code_drift sensor may file a High rec for
    them; a redeploy or workflow_dispatch holds again. The remedy is the human-directed provision_telemetry_catalog
    re-run (Decision 230 cl.4), then a sidecar PR moving the column into `reconciled` with the response as evidence;
    break-glass stays the only bypass.
  status: "Two governed channels landed, now sharing ONE merged deploy role (T2.49 / DEP-12, Decision 144): (1) tier_item T2.38: .github/workflows/deploy-ducklake-lambdas.yml (eight DuckLake Lambdas). (2) tier_item T2.43: .github/workflows/deploy-prod-lambdas.yml (the decoupled_build_pipeline class -- scheduled-agent-dispatcher, findings-processor; provisioned by terraform/personal/prod_lambdas.tf). Both assume the merged role agent-platform-github-ci-deploy (UpdateFunctionCode-only on the function:agent-platform-* prefix, covering all 10 functions; replaces the two retired per-class deploy roles). The role is IAM-sensitive and lands via the tf-gated-apply Environment (Decision 92/126), not admin-create. Both workflows tolerate its bootstrap-window absence via a SCOPED continue-on-error (not blanket, Decision 55): the tolerance applies only while the operator-owned repo variable DEPLOY_ROLE_PROVISIONED (one shared variable, reconciled from the retired per-class DUCKLAKE_DEPLOY_ROLE_PROVISIONED / PROD_DEPLOY_ROLE_PROVISIONED) is not 'true'. The operator sets that variable to 'true' as part of the gated-apply step that creates the role; from then on a failed assume-role fails loud instead of a silent green no-op. break-glass remains available as a genuinely non-default fallback for both channels (see build-lambda.yaml#deploy_channels)."

reconcile:
  description: "The apply pipeline is red or the convergence record is drifted."
  trigger: "One input-free Reconcile action (tier_item T2.37): reads the red commit from the convergence record and re-applies it. No operator-supplied SHA."
  actor_role: agent
  blocks_ref: "environment-taxonomy.yaml (guard_classification determines whether Reconcile can auto-apply or must route to gated-apply)"
  recovery: "If Reconcile itself cannot proceed (e.g. an out-of-budget IAM delta needs human approval), it routes to the existing gated-apply Environment; see admin_out_of_band for the human action."
  status: "Landed (tier_item T2.37): .github/workflows/reconcile.yml."
  heal_verb_selection: >-
    Red commit's HCL still the desired state -> Reconcile (re-applies the reviewed plan.bin, or
    re-plans AT the red commit); the fix for the red failure merged AFTER the red commit -> the
    terraform-apply-sandbox workflow_dispatch acknowledge-and-retry dispatch
    (acknowledge_red_commit=<red sha>, plans fresh at main HEAD; guard-PASS applies behind the
    subagent review, guard-ROUTE waits for the tf-gated-apply approval in the same run). Either
    way one dispatch, at most one approval, and EITHER verb is dispatched only AFTER the ci-rca rec
    for the red failure has been reviewed (Decision 55/72 anti-masking -- nothing auto-remediates;
    this precondition moved here from terraform/CLAUDE.md's recovery row when that row shrank to a
    pointer).
    Operator dispatch decision (Decision 190): the CONVERGENCE_RED refusal and the
    terraform-converged advisory status both name the MEASURED red_cause
    (environment-taxonomy.yaml's convergence_marker_vocabulary / red_cause discriminator) --
    red_cause=out_of_band_drift means an actual infra change needs review before either verb
    re-applies over it; red_cause=apply_failure means the prior apply's own failure (build,
    tfvars, init) is what needs fixing before dispatching. Read the named cause from evidence,
    never re-derive it by hand.
    Navigation only (Decision 126/86 -- never apply-model content): what a guard-routed dispatch
    REACHES is stated solely in environment-taxonomy.yaml axis_a.sandbox_gated_apply (Decision
    183).

publish_artifacts:
  description: "Registry namespace publication: PyPI/npm/crates.io placeholder or release publish for a claimed distribution namespace (e.g. rec-3941's ontheloop hold)."
  trigger: "An operator-approved workflow_dispatch of the registry's publish workflow (e.g. .github/workflows/publish-ontheloop.yml for PyPI), gated by a required-reviewer GitHub Environment; npm and crates.io publish locally by the operator (no CI toolchain -- see docs/contracts/package-registry-reservation.yaml)."
  actor_role: operator
  blocks_ref: "docs/contracts/package-registry-reservation.yaml (per-registry procedure, anti-squatting posture, pypi_trusted_publisher trust triple)"
  recovery: "If a dispatch is blocked or a publish fails, diagnose via the named contract's procedure before retrying -- never widen the publish workflow's credential surface or bypass the Environment's required reviewer."

admin_out_of_band:
  description: "Operator-only admin tier: bootstrap root, agent_platform_admin IAM/trust/destroy changes, and the Decision 120 local-apply escape hatch."
  trigger: "A human operator acting outside CI, per terraform/CLAUDE.md's operator-only / break-glass subsection."
  actor_role: operator
  blocks_ref: "environment-taxonomy.yaml (guard_classification); Decision 120 (the escape hatch this restored); Decision 98 (admin-create); Decision 77 (bootstrap)"
  recovery: "For bootstrap root and agent_platform_admin IAM/trust/destroy changes, an agent's only move is to file a rec describing what's needed and why -- those are human-only. The Decision 120 break-glass local-apply loop is a narrower carve-out: an agent may execute terraform apply there only after a human has reviewed the plan and explicitly directed it -- never self-directed."
  status: "Quarantined here (Decision 126 point 4 as amended by Decision 127; tier_item T2.41). T2.37 (the heal button) landed and was verified before this quarantine, per the Fable ordering invariant (Decision 126)."
  partition_layout_remediation:
    description: >-
      Decision 204's narrow carve-out (amends Decision 126): an ADMIN-container agent may invoke
      the ducklake_maintenance reconcile_partitions / rewrite_partition_layout verbs only under
      explicit human direction (never self-directed), confirming each mutation before it executes.
    procedure_ref: "docs/contracts/ducklake-partition-remediation.yaml -- the full ADMIN-container procedure lives there (navigation only; this file is never a second source of truth for it)."
  scoped_login_provisioning:
    description: >-
      Decision 213 cl.5's narrow carve-out (amends Decision 126 and, for this verb only, Decision 81
      cl.6; Decision 230 cl.3 widens it to one login per catalog binding): an ADMIN-container agent may
      write a closed-table login's parameter value ($LOGIN is one of the four names in catalog_logins.py's
      LOGINS) and invoke ducklake_maintenance's provision_telemetry_login only under explicit human direction
      (never self-directed), presenting each mutation and executing it only after the human accepts.
      The password is never displayed, logged or written to disk; no step prints a host, DSN or
      password. Until secrets-to-ssm-retire, mutation 1 writes the SSM parameter and then the same value to the old secret (so a revert stays valid); a failed second write is a STOP: re-run mutation 1 whole before mutation 2. This is the one home for the procedure (agent-led procedures are procedure blocks in the
      owning contract); ducklake_maintenance.yaml's verb entry points here. No container has TCP/5432
      egress, so the migration, the password set and the reach check all run inside the maintenance Lambda.
    procedure:
      mutation_1_write_secret: |-
        AWS_DEFAULT_REGION=eu-west-2 LOGIN=$LOGIN bin/venv-python -c "import json,os,secrets,boto3;from src.common import ducklake_runtime as rt;from src.lambdas.ducklake_maintenance import catalog_logins as cl;o=rt.fetch_dsn(profile='agent_platform_admin');L=os.environ['LOGIN'];v={'host':o['host'],'dbname':o['dbname'],'sslmode':'require','username':L};v['pass'+'word']=secrets.token_urlsafe(32);S=boto3.Session(profile_name='agent_platform_admin',region_name='eu-west-2');N=cl.LOGINS[L].parameter_name;S.client('ssm').put_parameter(Name=N,Value=json.dumps(v),Type='SecureString',Overwrite=True);S.client('secretsmanager').put_secret_value(SecretId=N.removeprefix('/secret/'),SecretString=json.dumps(v));print('SECRET_WRITTEN',L)"
      mutation_2_invoke: |-
        P="${TMPDIR:-/tmp}/provision.json" && AWS_MAX_ATTEMPTS=1 aws lambda invoke --profile agent_platform_admin --region eu-west-2 --cli-read-timeout 300 --function-name agent-platform-ducklake-maintenance --cli-binary-format raw-in-base64-out --payload '{"action":"provision_telemetry_login","confirm":"'$LOGIN'"}' "$P" > /dev/null
      check_result: |-
        LOGIN=$LOGIN bin/venv-python -c "import json,os,sys;from src.lambdas.ducklake_maintenance import catalog_logins as cl;L=os.environ['LOGIN'];r=json.load(open(sys.argv[1]));assert 'body' in r, 'FunctionError '+str(r.get('errorType'));b=json.loads(r['body']);print('PROVISION',r['statusCode'],b.get('error_type'),b.get('scope'),b.get('read_only_attach'),'neon_superuser_member=',b.get('owner_is_neon_superuser_member'));assert r['statusCode']==200 and b['ok'] is True, 'provision refused';assert b.get('migration_sha256')==cl.template_sha256(L), 'deployed SQL differs from the merged file';assert b['metadata_readable'] is True and b['scope']==cl.LOGINS[L].expected_scope;print('SCOPED_LOGIN_OK',L)" "$P"
      reruns: >-
        Quarterly rotation repeats mutation 1, mutation 2 and the check. The RDS swap repeats them after
        the maintenance function points at the RDS catalog, so mutation 1 copies the RDS host and dbname
        (it reads them from the owner DSN parameter). A failed check names its cause in the response
        (error_type / error carry only a class and SQLSTATE); a re-run is idempotent but happens only on
        the human's word. Three more triggers (Decision 230): after any catalog_reinit of ducklake_smoke,
        provision_catalog_owner(ducklake_smoke) and then every smoke login; after a DR restore, both owner verbs and then
        the logins; after a DuckLake extension bump, provision_catalog_owner for both catalogs (it re-owns any relation
        an extension migration created under the owner login), the logins, and the writer-grant re-measure (Decision 230
        measured-grants-drift).
  production_catalog_provisioning:
    description: >-
      Decision 230 cl.4's carve-out (amends Decision 126 and, for these verbs, Decision 81 cl.6) and the one home of the
      procedure that creates the production telemetry catalog (ducklake_telemetry) and moves ducklake_smoke to its owner
      role. An ADMIN-container agent (actor admin_agent) may write a login's secret and invoke provision_catalog_owner,
      provision_telemetry_catalog and provision_telemetry_login only under explicit human direction, presenting each
      mutation and running it only after the human accepts; catalog_stats and ensure_catalog_indexes stay actor operator
      and are never agent-invoked (the agent records their counts-only results). Two independent sittings, either first.
      No step prints a host, DSN, password or ARN; no step runs merge_ops or gc_ops on ducklake_telemetry
      (PLAN-telemetry-production-maintenance owns them once its MetaSchema series are live).
    record_file: /mnt/project-files/telemetry-slice2c/ADMIN-SESSION-RECORD.md
    measurement_file: /mnt/project-files/telemetry-slice2c/MEASUREMENT.md
    record_format: "one 'key: value' line per key, ISO-8601 UTC timestamps, counts and booleans only; a STOP on any step ends the sitting"
    record_keys: [bootstrap_applied_sha, bootstrap_plan_updates, simulate_triples, simulate_mismatches, production_catalog_tables, production_catalog_created, production_catalog_counters, production_catalog_owner, production_catalog_provisioned_at, login_ducklake_telemetry_writer_prod_connection_limit, login_ducklake_telemetry_reader_connection_limit, reader_read_only_attach_stage, reader_read_only_attach, stats_index_valid_ducklake_telemetry, smoke_adopted_relations_reowned, login_ducklake_smoke_maintainer_connection_limit, maintainer_current_user, switch_applied_sha, smoke_rerun_relations_reowned, login_ducklake_telemetry_writer_connection_limit, smoke_writer_narrowed_at, live_proof_run_conclusion]
    measurement_keys: [measured_at, window_start, window_end, smoke_capture_since, smoke_age_days, catalog_metadata_bytes, file_column_stats_rows_est, telemetry_data_files, telemetry_data_files_by_table, append_requests_7d, append_requests_per_day, files_per_commit, D_files_per_day, D_crosscheck_files_per_day, R_stats_rows_per_day, R_crosscheck_stats_rows_per_day, occ_retry_p95_7d, commit_latency_p50_ms_7d, commit_latency_p95_ms_7d, neon_storage_bytes, neon_data_transfer_bytes_7d, telemetry_attach_cold_ms]
    invoke: |-
      P="${TMPDIR:-/tmp}/out.json" && AWS_MAX_ATTEMPTS=1 aws lambda invoke --profile agent_platform_admin --region eu-west-2 --cli-read-timeout 900 --function-name agent-platform-ducklake-maintenance --cli-binary-format raw-in-base64-out --payload '<PAYLOAD>' "$P" > /dev/null
    login_steps_ref: "scoped_login_provisioning above (mutation_1, mutation_2, check_result with LOGIN set); a scope mismatch or a refused read_only_attach is a STOP, never widened"
    sitting_1:
      needs: "PR 1 merged and deployed"
      steps:
        - {id: bootstrap_apply_and_simulate, actor: admin_agent, command: "terraform/bootstrap apply at the merge sha (terraform/CLAUDE.md runbook), then bin/venv-python -m scripts.ci.iam_simulate --profile agent_platform_admin --fixture docs/contracts/iam-simulate-fixture.yaml", check: "plan shows the four updates only; BOOTSTRAP_LIVE_OK; record bootstrap_applied_sha, bootstrap_plan_updates, simulate_triples, simulate_mismatches (0)"}
        - {id: measurement, actor: operator, command: 'invoke with PAYLOAD={"action":"catalog_stats","meta_schema":"ducklake_smoke","ops_table_filter":"telemetry_%"} (emits nothing for a non-ops schema), the operator hands the agent the counts-only body', check: "the agent writes every measurement_keys line before any create; MEASUREMENT_OK; no identifier in the file"}
        - {id: provision_telemetry_catalog, actor: admin_agent, command: 'invoke with PAYLOAD={"action":"provision_telemetry_catalog","meta_schema":"ducklake_telemetry","data_path":"s3://agent-platform-data-lake/ducklake-telemetry/","confirm":"ducklake_telemetry"}', check: "PRODUCTION_CATALOG_OK: nine tables, two counters, foreign_owned 0, schema_owner ducklake_telemetry_owner held through membership; record production_catalog_* keys"}
        - {id: provision_writer_prod_login, actor: admin_agent, command: "login_steps_ref with LOGIN=ducklake_telemetry_writer_prod", check: "LOGIN_OK; record its connection limit (10)"}
        - {id: provision_reader_login, actor: admin_agent, command: "login_steps_ref with LOGIN=ducklake_telemetry_reader", check: "LOGIN_OK and read_only_attach accepted (else write reader_read_only_attach: refused and STOP); record reader_read_only_attach"}
        - {id: ensure_catalog_indexes, actor: operator, command: 'invoke with PAYLOAD={"action":"ensure_catalog_indexes","confirm":"ducklake_file_column_stats"}, run by the operator who hands the agent the ducklake_telemetry entry', check: "ok and valid_after true; the agent reads the next control_health StatsIndexValid (agent_platform_admin) and records stats_index_valid_ducklake_telemetry"}
    sitting_2:
      needs: "PR 1 merged and deployed and the switch PR CI-green; deploys held by the coordinator from adopt_smoke to release_hold, with the operator's word on the switch PR already given so the hold spans only its merge and apply"
      steps:
        - {id: adopt_smoke, actor: admin_agent, command: 'invoke with PAYLOAD={"action":"provision_catalog_owner","meta_schema":"ducklake_smoke","confirm":"ducklake_smoke","mode":"adopt"}', check: "SMOKE_OWNER_OK: member_inherit and member_set true; record smoke_adopted_relations_reowned; 55P03 or 40P01 rolled back whole, re-run"}
        - {id: maintainer_login, actor: admin_agent, command: "login_steps_ref with LOGIN=ducklake_smoke_maintainer", check: "MAINTAINER_LOGIN_OK: scope current_user is ducklake_smoke_owner, proven before the switch merges; record maintainer_current_user and its connection limit"}
        - {id: merge_switch_pr, actor: admin_agent, command: "mcp__github__merge_pull_request(squash) on the switch PR (exactly terraform/personal/ducklake_maintenance_smoke.tf), then wait for its terraform apply", check: "apply green and test_maintenance_smoke_reads_only_the_smoke_maintainer_secret passes; record switch_applied_sha"}
        - {id: clean_owner_rerun, actor: admin_agent, command: 'invoke with PAYLOAD={"action":"provision_catalog_owner","meta_schema":"ducklake_smoke","confirm":"ducklake_smoke","mode":"adopt"}', check: "SMOKE_STILL_CLEAN: relations_reowned 0, schema_adopted false; record smoke_rerun_relations_reowned"}
        - {id: narrow_smoke_writer, actor: admin_agent, command: "login_steps_ref with LOGIN=ducklake_telemetry_writer, then at once bin/venv-python -m scripts.ducklake_neon_smoke_test --lambda-telemetry-smoke as PlatformDev", check: "SMOKE_WRITER_NARROWED then NARROWED_WRITER_LIVE_OK; record smoke_writer_narrowed_at and its connection limit (20)"}
        - {id: release_hold, actor: coordinator, command: "release the deploy hold", check: "only after NARROWED_WRITER_LIVE_OK is recorded"}
        - {id: live_proof_deploy, actor: coordinator, command: "dispatch one deploy-ducklake-lambdas run", check: "SWITCH_LIVE_OK: the five maintenance-smoke gates and the telemetry gate pass; record live_proof_run_conclusion"}
      rollback:
        - {id: keep_hold, actor: coordinator, command: "re-impose or keep the deploy hold", check: "no DuckLake deploy runs until release"}
        - {id: revert_switch_pr, actor: admin_agent, command: "revert the switch PR (terraform-only; its apply restores the shared credential)", check: "apply green"}
        - {id: release_mode, actor: admin_agent, command: 'invoke with PAYLOAD={"action":"provision_catalog_owner","meta_schema":"ducklake_smoke","confirm":"ducklake_smoke","mode":"release"}', check: "ok; schema_released true; the role and its memberships stay"}
        - {id: green_deploy_run, actor: coordinator, command: "dispatch one deploy-ducklake-lambdas run", check: "MAINTENANCE_MERGE OK, MAINTENANCE_GC OK, MAINTENANCE_BREAKER OK, MAINTENANCE_HOT_MERGE OK and MAINTENANCE_CREATE_TELEMETRY OK, all five green"}
        - {id: release_hold_after_rollback, actor: coordinator, command: "release the deploy hold", check: "only after green_deploy_run; escalate the cause (53300 re-sizes forward, a privilege gap is owner-role-refused)"}
  pre_merge_live_plan:
    description: >-
      Standing rule (incident #1316, fixed by #1323) for any plan whose scope changes a non-Markdown
      file under a Terraform root whose environment-taxonomy.yaml axis_a apply_gating is admin-only
      (today terraform/bootstrap); a Markdown-only change is exempt. Static checks never reach a provider, so the root's first live contact
      must happen BEFORE merge. Rule and navigation only: apply-model and guard rules stay in
      environment-taxonomy.yaml.
    rule:
      - >-
        PRE-MERGE GATE (ADMIN): the plan carries a pre-deploy step that runs a read-only `terraform
        plan -lock=false` of the root in a throwaway git worktree at the CI-green $PR_HEAD_SHA, with
        a declared expected outcome (named counts, or failure only on named diagnostics). Plan files
        are deleted in the same step; counts-only evidence and the sha are posted on the PR; a new
        head re-runs the gate. The gate never applies or writes state, so it is not a bootstrap
        change under Decision 126; like every admin-tier action it runs on the operator's direction,
        and a standing operator authorisation for read-only admin calls counts.
      - >-
        ENVIRONMENT CHECK: before assuming any post-merge hand-off, the implementing session checks
        its own credentials with `bin/venv-python -m scripts.aws_identity caller-arn --profile
        agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo
        ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT` (the helper reads the identity from a second
        region's STS host, because the agent proxy re-signs every call to the project region's STS
        host as the IAM user). ADMIN_CHAIN_OK: the session runs the gate itself.
        ADMIN_CHAIN_ABSENT: the PR waits at CI-green, the gate steps go to an ADMIN session, and the
        merge is held until the evidence is on the PR.
      - >-
        V3 RESOLUTION: the plan's context carries a line starting "V3 resolution:" stating that the
        posted pre-merge gate evidence for the current head substitutes for the pre-merge
        post-deploy evidence the implement V3 Merge Gate and the code-review V3 check require; that
        the behavioural acceptance (Decision 48) is the plan's named post-merge, human-directed apply
        walk; and that the walk's evidence is a counts-only comment on the merged PR naming the
        applied sha (CloudWatch history ages out and is not the record).
      - "All posted evidence is counts-only: no account ids, ARNs, ExternalIds or hosts (Decision 101)."
    enforcement: >-
      validate_admin_root_premerge_gate (fast tier, net-new plans whose scope has a non-Markdown file
      under such a root) checks all three clauses
      structurally: a pre-deploy step running terraform plan -lock=false of the root at
      $PR_HEAD_SHA, a pre-deploy step running the ADMIN_CHAIN_OK check, and the "V3 resolution:"
      context line. It cannot judge the expected outcome or that evidence was posted; plan-critique
      and code-review judge those.
    precedent: "PLAN-platform-iam-bootstrap-adopt (steps 8-11), PLAN-platform-iam-personal-release, PLAN-heartbeat-canary-plan-time-grant (steps 9-12)."
  procedure:
    description: >-
      Operator-recovery steps for the human-gated interactive apply loop. Never self-directed
      by an agent; usable only after a human has reviewed the plan and explicitly directed the
      apply (Decision 77 / Decision 126). Carries recovery STEPS only -- apply-model / guard-
      classification rules stay solely in environment-taxonomy.yaml (Decision 92 point 5).
    steps:
      - "A human operator who wants to apply a change by hand directs the CC-web agent through the loop: terraform plan -> PRESENT the plan output -> the human explicitly accepts -> the agent runs terraform apply. Never apply without presenting the plan and getting explicit acceptance first."
      - "This loop requires local terraform init to have succeeded first."
      - "hashicorp/*-only roots (terraform/, terraform/github, terraform/bootstrap): local terraform init succeeds unconditionally, no proxy dependency."
      - "terraform/personal (third-party kislerdm/neon provider): a stock CC-web session cannot locally init it (Decision 119, direct github.com fetch 403s) -- use the CI-mediated speculative-plan + apply-the-saved-plan pipeline instead for routine changes. On an ADMIN container with the S3 filesystem_mirror synced (Decision 120 -- the session-start hook .claude/hooks/session_start_terraform_assets.sh synced it and wrote $HOME/.terraform-mirror.tfrc; prefix each terraform command with TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc), local init does succeed and this loop is available for terraform/personal."
      - "Recover the five no-default tfvars (account_id, alerts_email, owner_email, platform_dev_external_id, platform_admin_external_id) per docs/contracts/terraform-cc-web-operations.yaml's tfvars_and_remote_state_recovery section (per-variable declaring file and recovery source, the SSM materialisation path, and the owner_email/alerts_email non-interchangeability note); never paste their values into chat, a PR, or any committed file."
      - "terraform/personal also needs the ephemeral variable neon_api_key on every plan and every apply, including apply of a saved plan: set TF_VAR_neon_api_key from the /secret/neon-api-key SSM parameter (aws ssm get-parameter --with-decryption) under agent_platform_admin inside the same shell command that runs terraform; never write it to a file, a tfvars, chat, or a PR. The tfvars materialisation recovery does not supply it."
      - >-
        SPLIT-APPLY (PLAN-dispatch-gated-apply-unlatch, Decision 183): PlatformDev, PlatformAdmin
        and their inline policies live in terraform/bootstrap (Decision 223),
        so a change to them is a terraform/bootstrap admin apply through this loop, with no split
        and no -target. When a fresh terraform/personal plan carries an action the CI apply role
        cannot execute BY DESIGN, apply those addresses out-of-band first (terraform plan
        -target=... -> PRESENT -> explicit human acceptance -> terraform apply), then run the
        governed path for the remainder; never widen the CI role to avoid the split (Decision 143 clause 1, Decision 180 clause 3 and Decision 225 clause 1). Decision 98 point 1 is the precedented shape. After the
        out-of-band apply lands, reject (never approve) any pending gated-apply run covering the
        same targeted resource.
      - >-
        PRE-APPLY, before applying any terraform/bootstrap change that narrows the apply role's
        GRANT SURFACE (its inline policy, an attached customer-managed policy, or the permissions
        boundary), confirm no terraform/personal destroy or gated apply still in flight depends on
        the CURRENT (pre-narrowing) grant surface. Applying the narrowing first strips grants the
        in-flight operation needs mid-apply -- the same lockout shape Decision 156 point 2 names
        for a bare read-policy detach, generalized to any grant narrowing that races a dependent
        operation. Check the sandbox convergence record's unapplied backlog and any open
        destroy/gated-apply plan before proceeding; if one is pending, let it drain first.
      - >-
        SELF-ACCESS ISOLATION (PLAN-platform-iam-bootstrap-adopt, Decision 126 point 2): a
        terraform/bootstrap apply that changes BootstrapStateProvisioning's inline policy or
        AdminOps' IAMFull statement carries no other change in the same apply, and its presented
        plan must show no trust-document (assume_role_policy) diff on either aws_iam_role.platform_dev
        or aws_iam_role.platform_admin. These two statements are the self-access grants this root's
        own apply depends on (BootstrapStateProvisioning: the backend bucket and state object;
        IAMFull: the ability to manage IAM at all) -- bundling an unrelated change into the same
        apply risks losing the ability to apply the fix if the apply fails partway, and a trust-
        document diff risks locking the agent_static principal out of the assume-role chain this
        apply itself runs under.
      - >-
        POST-APPLY, after any terraform/bootstrap apply that changes the apply role's GRANT SURFACE
        (its inline policy, an attached customer-managed policy, or the permissions boundary), run
        the standing live-simulate gate:
        `bin/venv-python -m scripts.ci.iam_simulate --profile agent_platform_admin --fixture
        docs/contracts/iam-simulate-fixture.yaml`.
        Exit 0 with zero mismatches is the completion condition for the apply -- treat a mismatch on
        a newly granted verb as a wrong boundary ceiling or resource scope (fix in HCL, re-apply
        through this same human gate), and a mismatch on a `by_design` denial as a GRANT LEAK, i.e.
        a security regression rather than a fixture error. WHY IT CANNOT BE A PR-TIME CHECK: a
        static text check structurally cannot see condition-key evaluation (the
        iam:PermissionsBoundary / iam:PassedToService conditions) or the identity/boundary
        intersection -- a verb granted in the identity policy but absent from the boundary's
        DataPlaneAllow ceiling is SILENTLY denied, and nothing in validate.py can observe that. It
        is also deliberately not wired into `validate --pre`: between merge and this apply the code
        legitimately declares verbs the live policy lacks, so gating the PR on it would red the very
        PR that fixes the problem. RE-RUN IT ON ANY hashicorp/aws PROVIDER BUMP as well -- every
        companion-verb inference in the fixture is scoped to the pinned provider version, and a
        provider that migrates a call (e.g. logs:TagLogGroup -> logs:TagResource) silently changes
        which verbs are load-bearing.
