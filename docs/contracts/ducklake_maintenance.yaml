---
# Class B Lambda verb contract for the ducklake_maintenance Lambda (singleton catalog maintenance).
# Authored at status: provisional_v0 under the CD.25 pre-codegen contract ratification ritual
# (platform tier_item T1.12, Class B wave). CD.16 ratified (dec-1086); the Lambda is deployed (T2.18).
#
# This is the maintenance contract the T1.12 roadmap intent already re-grounded onto ducklake_maintenance
# (per T2.18). It is NOT a public AGENT surface: every verb is either EventBridge-scheduled or
# human-invoked over 443 via `aws lambda invoke` (an AWS_IAM Function URL exists for smoke-gate invokes
# but no scheduled/operational verb depends on it). Documented here so the closed-boundary maintenance
# verb surface carries the same ratified-contract guarantees as the writer/reader. CD.33 / Decision 81 /
# Decision 91 ratified the writer/reader/maintenance split.
#
# Authored against the shipped scripts/contracts_schema.py + scripts/contracts.py loader (NOT the
# INTENT worked examples). Verb surface read from src/lambdas/ducklake_maintenance/handler.py dispatch;
# the scheduled-vs-operational split is grounded in terraform/personal/ducklake_maintenance.tf
# EventBridge rules (all ENABLED).
contract:
  id: ducklake_maintenance
  class: B
  contract_version: 1
  status: provisional_v0
  description: >-
    Singleton DuckLake catalog-maintenance Lambda. SCHEDULED actions are EventBridge-triggered:
    merge (daily) / gc (weekly) / hot_merge (every 6h) run against the SMOKE catalog (ducklake_smoke),
    and merge_ops (every 6h) / gc_ops (weekly, ENABLED per gc-ops-baseline-gate-and-schedule-enable) run against the PRODUCTION catalogs
    (ducklake_ops, and ducklake_telemetry on its own rules; data_path + meta_schema supplied by the EventBridge target). OPERATIONAL actions
    (catalog_reinit, restore_drill, catalog_stats, reconcile_columns, reconcile_partitions,
    rewrite_partition_layout, provision_telemetry_login, provision_catalog_owner,
    provision_telemetry_catalog) are human-invoked over 443 via `aws lambda
    invoke`; all but the last three target the PRODUCTION catalog with explicit data_path + meta_schema
    event params (no-arg invokes refused), and the last three take only closed confirm tokens.
    The scheduled path is agent-free (CD.33 cl.5 / Decision 81 cl.6); an ADMIN-container
    agent may invoke reconcile_partitions / rewrite_partition_layout only under explicit human
    direction (Decision 204), per docs/contracts/ducklake-partition-remediation.yaml's procedure,
    and provision_telemetry_login likewise (Decision 213 cl.5), per docs/contracts/deploy-paths.yaml
    admin_out_of_band.scoped_login_provisioning; provision_catalog_owner and provision_telemetry_catalog
    likewise (Decision 230), per admin_out_of_band.production_catalog_provisioning.
    Singleton via reserved_concurrent_executions=1. This contract documents the
    SCHEDULED + OPERATIONAL verb surface only; the forced-trip guard-set test action breaker_probe
    is VP instrumentation (analogous to the writer/reader probes), NOT an operational verb, and is
    out of contract scope.
  governance:
    auth_type: >-
      NOT a public agent surface (an AWS_IAM Function URL exists for smoke-gate invokes, terraform
      line 192, but no scheduled or operational verb depends on it). SCHEDULED actions are
      EventBridge-triggered (merge daily 04:00 UTC -> smoke; gc weekly 05:00 UTC Sun -> smoke;
      hot_merge cron(0 */6 * * ? *) -> smoke; merge_ops cron(30 */6 * * ? *) -> PRODUCTION
      ducklake_ops, cron(50 */6 * * ? *) and gc_ops cron(5 4 ? * SUN *) -> PRODUCTION ducklake_telemetry). OPERATIONAL actions (catalog_reinit, restore_drill, catalog_stats,
      reconcile_columns, reconcile_partitions, rewrite_partition_layout, provision_telemetry_login,
      provision_catalog_owner, provision_telemetry_catalog)
      are human-invoked over 443 via `aws lambda invoke` (AWS_IAM); the two partition verbs
      (Decision 204), provision_telemetry_login (Decision 213 cl.5) and the two catalog verbs
      (Decision 230) are additionally invokable by
      an ADMIN-container agent only under explicit human direction. Singleton:
      reserved_concurrent_executions=1 (Decision 81 cl.6).
    principal_classes:
      - "events.amazonaws.com (EventBridge service principal; scheduled merge / gc / hot_merge -> smoke, merge_ops -> production)"
      - "PlatformAdmin (human-invoked operational actions: catalog_reinit / restore_drill / catalog_stats / reconcile_columns / reconcile_partitions / rewrite_partition_layout / provision_telemetry_login / provision_catalog_owner / provision_telemetry_catalog / ensure_catalog_indexes)"
      - "ADMIN-container agent, human-directed only (reconcile_partitions / rewrite_partition_layout, Decision 204; provision_telemetry_login, Decision 213 cl.5; provision_catalog_owner and provision_telemetry_catalog, Decision 230; never catalog_stats or ensure_catalog_indexes)"
    admin_only_features:
      - "Human-invoked operational actions are PlatformAdmin-only by invocation path (aws lambda invoke), not by an in-handler ARN check; the boundary is IAM-role scoping."
      - "catalog_reinit: the only CATALOG-STRUCTURE destructive action (meta-schema drop + reinit, IRREVERSIBLE); requires confirm=<meta_schema> and an explicit s3:// data_path (no production default). NB: gc is separately DATA-FILE destructive (see audit_invariants)."
      - "restore_drill: DR gate on an isolated scratch meta-schema (production-safe; non-destructive to live catalogs)."
      - "reconcile_columns: ALTER TABLE ADD COLUMN only (never DROP); non-destructive; requires explicit data_path + meta_schema."
      - "catalog_stats: read-only catalog-metadata footprint (psycopg2 metadata read; ATTACH-free; requires explicit meta_schema); human-invoked only, emits its metrics only for the ops catalog (Decision 230)."
      - "reconcile_partitions (Decision 204): no-op-free ALTER TABLE SET PARTITIONED BY on live-vs-declared partition drift; dry_run=true by default; requires explicit data_path + meta_schema."
      - "rewrite_partition_layout (Decision 204): row-preserving re-lay of a HISTORY table's legacy-scheme files, digest-proven before and after commit; requires confirm=<table> plus the table's own rewrite_partition_layout policy cell to apply (control refuses)."
      - "ensure_catalog_indexes (Decision 214): operator-only (Decision 81 cl.6), never agent-invoked; builds the catalog stats index CONCURRENTLY on every catalog schema; requires confirm=ducklake_file_column_stats; non-destructive to data."
      - "provision_telemetry_login (Decision 213, widened by Decision 230): applies one closed-table login's password-free migration and sets that login's password from its own secret, as the ducklake_ops owner login; requires confirm=<one of the four closed logins>, takes no other input (no caller-supplied SQL, role or secret name); non-destructive to data."
      - "provision_catalog_owner (Decision 230): creates or adopts a catalog's NOLOGIN owner role (ducklake_smoke and ducklake_telemetry only) and re-owns its relations; requires confirm=<meta_schema>; release mode (ducklake_smoke only) returns the schema to the shared owner login; drops nothing."
      - "provision_telemetry_catalog (Decision 230): ducklake_telemetry only; owner role, DuckLake initialisation, create_telemetry_tables, counter seed and ownership report; requires confirm=ducklake_telemetry; never builds the stats index, never merges or collects garbage."
    human_initiated_value: >-
      catalog_reinit / restore_drill / catalog_stats / reconcile_columns / reconcile_partitions /
      rewrite_partition_layout / provision_telemetry_login are human-invoked (aws lambda invoke) with
      explicit catalog params (provision_telemetry_login, provision_catalog_owner and provision_telemetry_catalog: closed confirm tokens);
      no-arg invokes are refused so they can never hit the smoke catalog by accident (Decision
      84/81 guard). The two partition verbs are additionally never autonomous when an ADMIN-agent
      invokes them -- each mutation (the ALTER, and each table's rewrite) is confirmed by the human
      first (Decision 204); provision_telemetry_login and the two catalog verbs are held to the same rule (Decision 213 cl.5, Decision 230). merge / gc / hot_merge / merge_ops are EventBridge-scheduled, NOT
      human-initiated (merge_ops hits PRODUCTION on the schedule with params supplied by the
      EventBridge target).
  provisional_v0:
    authored_at: "2026-06-22"
    authored_via: >-
      PLAN-ratify-class-b-lambda-verb-contracts (T1.12 Class B wave); Step 10 multi-perspective
      critique + merge to main.
    rationale: >-
      Class B contracts start provisional_v0 (INTENT Part 6A/6B). Maintenance is scheduled/low-volume,
      so an invocation-count trigger is not meaningful; the stagger is a 90-day clock only (INTENT
      Part 6B: lambda-maintenance trigger is "90 days only").
    first_production_invocation_date: "2026-06-22"
    surfacing_note: >-
      The time-based alarm is LIVE: session_preflight._scan_provisional_contracts computes
      days_since_first_production_invocation deterministically from first_production_invocation_date
      (via scripts.contracts_enforcement.default_provisional_metrics) and surfaces this contract in
      provisional_contracts_due once the threshold below is met -- no credentials, no warehouse reads.
      Maintenance has no traffic condition; it is fully live on the 90-day clock.
      check_re_ratification_trigger schema-validates this trigger block in CI.
    re_ratification_trigger:
      first_of:
        - "days_since_first_production_invocation >= 90"
    re_ratification_owner: "human + Step 10 multi-perspective critique"
verbs:
  merge:
    payload_schema_ref: >-
      event envelope {action: "merge", force_recreate_tables?}. SCHEDULED (EventBridge daily 04:00 UTC,
      smoke catalog). Daily non-destructive merge (flush_inlined_data + merge_adjacent_files).
    response_codes:
      200: "merged; body {ok, files_before, files_after_merge, elapsed_ms, ...}"
      500: "DuckLakeMaintenanceError (guard trip) / DuckLakeRuntimeError / VersionMismatchError"
    typed_errors:
      breaker: "guard-set trip; emits MaintenanceBreakerTrip=1; deletes nothing (500)"
      runtime: "runtime loud-fail (500)"
      version_mismatch: "DuckDB/extension version mismatch (500)"
  gc:
    payload_schema_ref: >-
      event envelope {action: "gc", force_recreate_tables?}.
      SCHEDULED (EventBridge weekly 05:00 UTC Sun, smoke catalog). Weekly guarded GC (five-step
      sequence); protected by the G1-G4 fail-closed guard set (reachability, retention floor,
      catalog sanity, an absolute per-pass deletion bound). run_gc's G4 sizing posture (Decision
      193): it builds a storage-derived {path: bytes} map via an injectable list_storage seam
      (defaults to a real ListObjectsV2 walk of the handler's DATA_PATH) and passes it as G4's
      REQUIRED candidate_size_source -- never the catalog live set, which structurally sizes every
      would-delete candidate to zero. Sizing is always STRICT on this destructive path: an unsized
      candidate raises rather than sizing to 0.
    response_codes:
      200: >-
        gc complete; body {ok, files_before, files_after, snapshots_expired, files_cleaned,
        orphans_deleted, guard_stats, elapsed_ms}. guard_stats carries the renamed/added keys (see
        the gc_ops verb below for the authoritative key list -- both verbs share run_guarded_gc's
        guard_stats shape).
      500: >-
        DuckLakeMaintenanceError (G1/G2/G3 guard-set trip, or a G4 strict-sizing raise naming an
        unsized would-delete candidate; deletes nothing) / DuckLakeRuntimeError / VersionMismatchError
    typed_errors:
      breaker: >-
        G1 reachability, G2 retention-floor, or G3 catalog-sanity guard trip, or a G4 strict-sizing
        raise; emits MaintenanceBreakerTrip=1; deletes nothing (500)
      runtime: "runtime loud-fail (500)"
      version_mismatch: "DuckDB/extension version mismatch (500)"
  hot_merge:
    payload_schema_ref: >-
      event envelope {action: "hot_merge", force_recreate_tables?}. SCHEDULED (EventBridge cron(0 */6 * * ? *),
      smoke catalog). Higher-frequency merge-only cadence (merge_adjacent_files) over the HOT table
      scope; no expiry, no deletion (T2.18 FP-B / CD.34).
    response_codes:
      200: "merged; body {ok, files_before, files_after, elapsed_ms}"
      500: "DuckLakeMaintenanceError (guard trip) / DuckLakeRuntimeError / VersionMismatchError"
    typed_errors:
      breaker: "guard-set trip (500)"
      runtime: "runtime loud-fail (500)"
      version_mismatch: "DuckDB/extension version mismatch (500)"
  merge_ops:
    payload_schema_ref: >-
      event envelope {action: "merge_ops", data_path (s3://), meta_schema}. SCHEDULED (EventBridge
      cron(30 */6 * * ? *) against PRODUCTION ducklake_ops, params supplied by the EventBridge target) AND
      human-invokable. Non-destructive merge scoped by catalog enumeration crossed with a declared
      per-class per-verb maintenance_policy matrix (config/lambda/ducklake/field_semantics.static.yaml,
      compaction-scope-policy-matrix / Decision 191) -- NOT a naming-convention predicate. For a non-ops
      catalog its metrics carry a MetaSchema dimension and only the CATALOG_METRICS names (the ops series stays
      undimensioned). Every table
      the catalog enumeration discovers (unfiltered information_schema, no LIKE filter) is classified
      (scd2 | append_only | control | smoke_harness -- the last declared from field_semantics'
      `tables:` block, Decision 191 amendment, never a name pattern) via the field_semantics
      registry and merged iff its class's
      merge_ops policy cell is apply=true; a table absent from the registry is unclassifiable and
      collected rather than silently skipped. No expire/cleanup/orphan.
    response_codes:
      200: >-
        merged; body {ok, tables, skipped, unclassified, reconciliation, files_before, files_after,
        elapsed_ms, per_table, count_unavailable}. `tables` lists only the tables actually merged
        (apply=true for their class); `skipped` lists classified tables whose policy cell is
        apply=false, each with its declared reason; `unclassified` lists catalog tables absent from
        the registry. `reconciliation` carries {registered_absent, catalog_unregistered} from
        comparing the enumerated catalog against the registry (registered_absent tables are
        dispositioned by their own registry `status`: a dormant/smoke table's physical absence from
        production is expected, not a defect). files_before/files_after and each per_table entry's
        files_before/files_after are null and count_unavailable is true when a file-count
        introspection read failed for either side of that table's pair -- BOTH sides are nulled
        together, never an asymmetric one-null-one-real pair (rec-3785); the merge itself still ran
        for every table with a readable count (guard vs observability split: a transient count
        failure degrades loudly rather than aborting this every-6h production cadence). Each
        per_table entry also carries `error` and `merge_unavailable` keys, but in a 200 response
        BOTH ARE ALWAYS null/false FOR EVERY ENTRY: a 200 is only ever returned when the whole
        pass had zero per-table merge failures (see 500 below) -- a non-null `error` is never an
        observable 200-response state; the keys exist for shape uniformity with the internal
        per-table record, not because a 200 caller ever sees a populated one. Every pass (200 or
        the 500 aggregate below) additionally emits, BEFORE the aggregate raise: MergeOpsDurationMs,
        MergeOpsFilesBeforeTotal/MergeOpsFilesAfterTotal (when no count was unavailable),
        MergeOpsTablesCount, MergeOpsUnclassifiedTables (the unclassified count), and
        MergeOpsPassFailed (1.0 when merge_failures OR unclassified is non-empty, else 0.0) --
        PLAN-ducklake-smoke-harness-classification (rec-3864): a scheduled async invoke's 500 body
        is discarded, so these two pass-outcome metrics are the only agent-readable signal of a
        scheduled pass's success or failure.
      500: >-
        DuckLakeRuntimeError: missing/non-s3 data_path, missing meta_schema, no tables discovered at
        all, OR the pass completed with one or more per-table merge failures and/or unclassified
        tables (the aggregate post-loop raise -- classified tables were still merged before it
        fires). This is the ONLY place a per-table merge failure's diagnostic detail is
        observable: the structured `per_table`/`reconciliation` objects are NOT returned on this
        path (the raise short-circuits the response body entirely), so the failure detail --
        which table, and the underlying merge_adjacent_files exception text for each -- is
        embedded directly in the `error` string message instead, alongside the unclassified table
        names. / VersionMismatchError
    typed_errors:
      runtime: >-
        missing s3:// data_path / meta_schema, no tables discovered at all, or a post-loop
        aggregate raise naming per-table merge failures (table + underlying error text) and/or
        unclassified tables (500)
      version_mismatch: "DuckDB/extension version mismatch (500)"
  gc_ops:
    payload_schema_ref: >-
      event envelope {action: "gc_ops", data_path (s3://), meta_schema, dry_run? (default false)}.
      SCHEDULED (EventBridge cron(45 3 ? * SUN *) against PRODUCTION ducklake_ops; rule ENABLED
      per gc-ops-baseline-gate-and-schedule-enable, after the pre-enablement baseline gate and the
      governed CD deploy both cleared -- a re-enabling after any future rollback to DISABLED is
      gated the same way) AND human-invokable. For a non-ops catalog its metrics and the breaker trip carry a
      MetaSchema dimension and only the CATALOG_METRICS names. Production destructive-GC pass
      (src/common/ducklake_gc_ops.py): a universal
      catalog live-set collection (every table, no policy input, never scope.resolve_scope), no
      per-table prelude (merge_ops already compacts every table 6-hourly), a PRE-PASS storage
      listing (taken here, in dry_run too, catalog-first/storage-second at both read pairs --
      Decision 192 pt 3) passed as G4's REQUIRED candidate_size_source, then run_guarded_gc
      UNMODIFIED (the G1-G4 fail-closed guard set, Decision 188, amended by Decision 193: G4 sizes
      STRICT from the declared source and bounds the POST-expiry candidate set, draining partially
      or deferring wholesale over budget) followed by an INDEPENDENT referenced-missing safety
      check against the same storage listing (re-taken post-pass) and a value-scanning read-path
      re-read at the pass-start catalog snapshot id. dry_run=true performs NO deletion and NO write
      of any kind (a LIST is a read) -- it still computes and emits GcReferencedMissing and
      GcWouldDeleteFiles (pre-expiry, from the same local probe as always) from the read-only
      dry-run primitives, plus reports would_delete_bytes (re-sourced from storage, never the dead
      catalog-live-set join), unsized_candidates, and drain_probe_counts (a read-only run of the
      same bracketing ladder G4's drain walk uses), so the baseline safety gate -- and now a
      byte-and-drain-aware pre-enablement canary -- can be taken without running the destructive
      pass it exists to gate.
    response_codes:
      200: >-
        pass complete (or dry-run measurement complete); body {ok, action, dry_run, tables,
        snapshot_id, would_delete_files, would_delete_bytes, unsized_candidates,
        drain_probe_counts, referenced_missing, snapshots_expired, files_cleaned, orphans_deleted,
        guard_stats, debt_ratio, storage_bytes, live_bytes, storage_objects, read_path}. guard_stats
        and read_path are null when dry_run=true (no destructive call and no post-pass read-path
        scan are issued in that mode); drain_probe_counts is null when dry_run=false (it is a
        dry-run-only measurement, a {days: {files, bytes}} map keyed by the drain ladder's rungs,
        PRE-expiry since dry_run runs no expire_snapshots -- a NECESSARY, not sufficient, signal
        that a real pass would drain). would_delete_bytes and unsized_candidates are populated in
        BOTH modes, sourced from the pre-pass storage listing via a non-strict size_candidates call
        (an unsized candidate is counted, never raised, at this top-level local probe -- see
        typed_errors for the destructive path's strict counterpart). guard_stats (non-null,
        dry_run=false) carries pre_expiry_would_delete_candidates (renamed from
        g1_would_delete_candidates -- no guard named G1 consumes the pre-expiry count once both G1
        checks moved to post-expiry/admitted sets), post_expiry_would_delete_candidates (new: the
        full post-expiry count, what G4 decided against), g4_drain_cutoff_days (new: the selected
        cutoff in days, null on a wholesale defer, equal to the configured grace when no drain was
        needed, always >= file_cleanup_grace_days otherwise), plus the existing
        g2_snapshots_remaining / g4_would_delete_files / g4_would_delete_bytes /
        g4_deferred_files / g4_deferred_bytes / g4_bounded (g4_bounded is true in BOTH a partial
        drain and a wholesale defer, false only when no walk was needed; g4_would_delete_* and
        g4_deferred_* now describe the ADMITTED post-drain set and its remainder, not the
        pre-drain whole-pass split).
      500: >-
        DuckLakeMaintenanceError: a G1/G2/G3 guard-set trip or a G4 STRICT-sizing raise naming an
        unsized would-delete candidate (run_guarded_gc, non-dry-run only -- the destructive path
        never sizes a candidate as 0 by omission), a non-empty referenced_missing set (over-reclaim
        signal -- raised in BOTH dry_run and non-dry_run modes, after GcReferencedMissing is
        emitted), gc_debt_ratio raising on live_bytes <= 0 (rec-3876: no longer silently reported
        as GcDebtRatio=0.0), or a verify_read_path scan failure (a referenced Parquet object
        missing from storage) / DuckLakeRuntimeError (missing or non-s3 data_path, missing
        meta_schema, no tables discovered) / VersionMismatchError.
    typed_errors:
      breaker: >-
        G1/G2/G3 guard-set trip, a G4 strict-sizing raise, a non-empty referenced_missing set, a
        zero-or-negative live_bytes debt-ratio raise (rec-3876), or a verify_read_path failure;
        emits MaintenanceBreakerTrip=1 for a guard-set trip or a G4 strict-sizing raise (500)
      runtime: "missing s3:// data_path / meta_schema, or no tables discovered (500)"
      version_mismatch: "DuckDB/extension version mismatch (500)"
  catalog_reinit:
    payload_schema_ref: >-
      event envelope {action: "catalog_reinit", data_path (s3://), meta_schema, confirm}. OPERATIONAL
      (human-invoked) break-glass: drop the squatting meta-schema + re-initialize at data_path.
      DESTRUCTIVE + IRREVERSIBLE; requires confirm == meta_schema.
    response_codes:
      200: "reinitialized; body {ok, meta_schema, data_path, dropped_existing, reinitialized}"
      500: "DuckLakeRuntimeError: missing/non-s3 data_path, missing meta_schema, or confirm mismatch / VersionMismatchError"
    typed_errors:
      runtime: "missing s3:// data_path, missing meta_schema, or confirm-guard mismatch (500)"
      version_mismatch: "DuckDB/extension version mismatch (500)"
  restore_drill:
    payload_schema_ref: >-
      event envelope {action: "restore_drill", scratch_meta?, scratch_data_path?, probe_id?}.
      OPERATIONAL (human-invoked) DR gate: pg_dump(custom)->pg_restore round-trip + read-your-write on
      an isolated scratch meta-schema. Requires the pgclient layer (pg_dump/pg_restore).
    response_codes:
      200: "restore verified; body {ok, scratch_meta, probe_id, restored, pg_version}"
      500: "CatalogDrError (pg_dump/pg_restore non-zero or read-your-write failed; Decision 55 stop) OR DuckLakeRuntimeError (e.g. invalid scratch_meta identifier)"
    typed_errors:
      catalog_dr: "pg_dump/pg_restore failure or read-your-write mismatch; stops the cutover (500)"
      runtime: "invalid scratch_meta identifier or runtime loud-fail (500)"
  catalog_stats:
    payload_schema_ref: >-
      event envelope {action: "catalog_stats", meta_schema, ops_table_filter?}. OPERATIONAL
      (human-invoked) read-only: catalog-metadata footprint of the production ops_* catalog (psycopg2
      metadata read; ATTACH-free; no data_path). Read-only -- no merge/expire/cleanup/orphan.
      Emits CatalogMetadataBytes and CatalogFileColumnStatsRows only when meta_schema is the ops catalog
      (ducklake_ops); any other schema returns the same body and emits nothing (Decision 230).
    response_codes:
      200: "stats; body {catalog_metadata_bytes, file_column_stats_rows_est, stats_index, ...}"
      500: "DuckLakeRuntimeError: missing meta_schema / VersionMismatchError"
    typed_errors:
      runtime: "missing meta_schema (no production default) (500)"
      version_mismatch: "DuckDB/extension version mismatch (500)"
  reconcile_columns:
    payload_schema_ref: >-
      event envelope {action: "reconcile_columns", data_path (s3://), meta_schema, table}. OPERATIONAL
      (human-invoked): ALTER TABLE ADD COLUMN (never DROP) to add any spec columns missing from the
      physical history + current tables. Idempotent. Requires explicit data_path + meta_schema (no-arg refused).
    response_codes:
      200: "reconciled; body {ok, table, meta_schema, data_path, added_history, added_current, columns_pre_existing}"
      500: "DuckLakeRuntimeError: missing/non-s3 data_path, missing meta_schema, or empty table / VersionMismatchError"
    typed_errors:
      runtime: "missing s3:// data_path / meta_schema / table (no-arg invokes refused) (500)"
      version_mismatch: "DuckDB/extension version mismatch (500)"
  reconcile_partitions:
    payload_schema_ref: >-
      event envelope {action: "reconcile_partitions", data_path (s3://), meta_schema, dry_run?
      (default true)}. OPERATIONAL (human-invoked, or an ADMIN-container agent under explicit
      human direction, Decision 204): reads every reconcile_partitions-scoped table's live vs
      declared partition spec (compaction-scope-policy-matrix, Decision 191/204) and, on
      dry_run=false, ALTERs only the mismatched physical tables (no-op-free), then RE-READS --
      the response's post-ALTER layout, never a stale pre-ALTER one. Requires explicit data_path +
      meta_schema (no-arg refused). `skipped` names every reconcile_partitions-scoped-out table
      (e.g. the smoke_harness pair, Decision 191 amendment) with its policy reason, READ-ONLY live
      layout, and compare_to_declared drift (or null) -- reported, never ALTERed, so the readout
      accounts for every discovered table (layouts + skipped == catalog).
    response_codes:
      200: >-
        dry_run=true: {layouts, drifts, skipped}; dry_run=false: {altered, layouts, drifts,
        skipped} (layouts/drifts are the post-ALTER readout; skipped is always read-only)
      500: "DuckLakeRuntimeError / PartitionLayoutError: missing/non-s3 data_path, missing meta_schema, or a maintenance-scope registry error / VersionMismatchError"
    typed_errors:
      runtime: "missing s3:// data_path / meta_schema (no-arg invokes refused), or a wrapped maintenance-scope registry error (500)"
      version_mismatch: "DuckDB/extension version mismatch (500)"
  rewrite_partition_layout:
    payload_schema_ref: >-
      event envelope {action: "rewrite_partition_layout", data_path (s3://), meta_schema, table,
      confirm}. OPERATIONAL (human-invoked, or an ADMIN-container agent under explicit human
      direction, Decision 204): re-lays `table`'s legacy-scheme files onto its already-declared
      calendar-day scheme in one row-preserving, digest-proven transaction. Refuses unless
      confirm == table (catalog_reinit's guard shape) and the table's class carries an
      apply=true rewrite_partition_layout policy cell (control refuses -- ops_entity_counters is
      the writer-internal entity-id counter, Decision 84 I-2); a non-history table, a table with
      zero legacy-scheme files, or a table whose live spec still drifts from declared is also
      refused (ALTER via reconcile_partitions first).
    response_codes:
      200: >-
        rewrite_legacy_layout's proof body verbatim: {physical, pre_snapshot_id,
        commit_snapshot_id, rows_pre, rows_commit, digest_pre, digest_commit, files_before,
        files_after, attempts}
      500: "DuckLakeRuntimeError / PartitionRewriteError / PartitionLayoutError: confirm mismatch, a refused precondition, OCC retry exhaustion, a pre-commit digest mismatch, or a post-commit proof failure (never auto-restores) / VersionMismatchError"
    typed_errors:
      runtime: "confirm mismatch, a refused precondition (non-history / zero legacy files / still drifted / not classified), OCC retry exhaustion, a digest mismatch, or a post-commit proof failure (500)"
      version_mismatch: "DuckDB/extension version mismatch (500)"
  provision_telemetry_login:
    payload_schema_ref: >-
      event envelope {action: "provision_telemetry_login", confirm: one of ducklake_telemetry_writer,
      ducklake_telemetry_writer_prod, ducklake_telemetry_reader, ducklake_smoke_maintainer} (the closed LOGINS
      table in catalog_logins.py, Decision 230 cl.3). OPERATIONAL (human-invoked, or an ADMIN-container agent
      under explicit human direction, Decision 213 cl.5): refuses unless the login's owner role and schema
      exist, then as the ducklake_ops owner login applies that login's password-free role migration (a
      versioned template bundled with the function), reads THAT login's own secret (refused unless its username
      is the login, its host and dbname match the owner DSN's and its sslmode is require), sets the role's
      password from it as a bound parameter, then connects AS the login to report its reach. No caller-supplied
      SQL, role or secret name; refuses without a closed confirm token before any connection. Idempotent
      (rotation, the RDS swap and every catalog_reinit or extension bump re-run it). Procedure:
      docs/contracts/deploy-paths.yaml admin_out_of_band.scoped_login_provisioning.
    response_codes:
      200: >-
        {ok, login, migration_applied, migration_sha256 (the template hash), password_set,
        owner_is_neon_superuser_member (boolean, null where no neon_superuser role exists), scope {current_user,
        session_user, usage and create on ducklake_ops, ducklake_smoke and ducklake_telemetry as current_user,
        public_create, database_create, connection_limit, member of each owner role, default_transaction_read_only,
        insert on the schema's ducklake_snapshot}, metadata_readable, read_only_attach (reader only: "accepted"
        or "refused", the error class only, never an exception)} -- booleans, counts and the template hash only;
        never a host, DSN or password
      500: "DuckLakeRuntimeError: missing/wrong confirm, a missing owner role or schema, a scoped secret that differs from the owner DSN, or a database error naming only its class and SQLSTATE"
    typed_errors:
      runtime: "missing/wrong confirm, a missing owner role or schema, a scoped secret that differs from the owner DSN, or a database error (class and SQLSTATE only) (500)"
  provision_catalog_owner:
    payload_schema_ref: >-
      event envelope {action: "provision_catalog_owner", meta_schema (ducklake_smoke or ducklake_telemetry),
      confirm == meta_schema, mode: adopt (default) | release} (Decision 230 cl.2 and cl.4). OPERATIONAL, human-invoked
      or an ADMIN-container agent under explicit human direction. As the ducklake_ops owner login, in one transaction
      (SET LOCAL lock_timeout 5s first): adopt creates the catalog's NOLOGIN owner role if absent (ducklake_smoke_owner,
      ducklake_telemetry_owner), makes the owner login a member of it with INHERIT and SET, creates or adopts the schema
      under it and re-owns every relation (r, p, S, v, m) not owned by the role. release (ducklake_smoke only, refused
      before any connection for any other schema) returns the schema and every relation to the owner login; the role and
      its memberships stay, nothing is dropped. Idempotent. Refuses before any connection unless its preconditions hold.
      Walk and rollback: docs/contracts/deploy-paths.yaml admin_out_of_band.production_catalog_provisioning.
    response_codes:
      200: >-
        {ok, meta_schema, owner_role, mode, schema_created, schema_adopted, schema_released, relations_reowned,
        owner_sql_sha256, member_inherit, member_set} -- booleans, counts and the template hash only
      500: "DuckLakeRuntimeError: a refused precondition, or a database error naming only its class and SQLSTATE (55P03 lock timeout and 40P01 deadlock roll the whole transaction back)"
    typed_errors:
      runtime: "refused precondition (unknown catalog, confirm mismatch, release outside ducklake_smoke) or a database error (class and SQLSTATE only) (500)"
  provision_telemetry_catalog:
    payload_schema_ref: >-
      event envelope {action: "provision_telemetry_catalog", meta_schema == ducklake_telemetry, data_path ==
      s3://agent-platform-data-lake/ducklake-telemetry/, confirm == meta_schema} (Decision 230 cl.4). OPERATIONAL,
      human-invoked or an ADMIN-container agent under explicit human direction. Runs the owner step in adopt mode,
      initialises the DuckLake metadata on first attach as the owner login, creates the telemetry tables if absent and adds
      any declared nullable column an existing table lacks (create_telemetry_tables, Decision 222; a re-run is the
      production column add), normalises ownership, verifies and seeds the counters, then reports ownership and refuses
      unless foreign_owned is 0, the schema owner is ducklake_telemetry_owner and held, and no scoped login holds CREATE.
      Never builds the stats index (Decision 214 cl.2) and never merges or collects garbage. Refuses any other catalog
      or data_path before any connection. Idempotent. Procedure: deploy-paths.yaml production_catalog_provisioning.
    response_codes:
      200: >-
        {ok, meta_schema, tables, created, added, counters, ownership, owner_sql_sha256, elapsed_ms} -- names, counts
        and booleans only
      500: "DuckLakeRuntimeError: a refused precondition, an ownership refusal, or a database error naming only its class and SQLSTATE"
    typed_errors:
      runtime: "refused precondition or ownership report (500); a psycopg2 or duckdb error is re-raised naming its class (and SQLSTATE) only"
  ensure_catalog_indexes:
    payload_schema_ref: >-
      event envelope {action: "ensure_catalog_indexes", confirm: "ducklake_file_column_stats"} (Decision 214, amending
      Decision 88 invariant v). OPERATIONAL, operator-only (Decision 81 cl.6): a Lambda console or aws lambda invoke
      event, never an agent. As the ducklake_ops owner login, under autocommit and statement_timeout 300s, it enumerates
      every catalog schema from pg_catalog and builds catalog_stats_index.sql (one CREATE INDEX CONCURRENTLY), rebuilding an
      INVALID index and leaving a valid or equivalent one alone. No caller-supplied SQL, schema or index name; refuses
      without the confirm token before any connection. Idempotent. catalog_reinit runs the same SQL file on a schema it
      re-initialises. The index is reported by control_health (StatsIndexValid, FileColumnStatsIdxScan, FileColumnStatsSeqScan, and CatalogFileColumnStatsRows for ducklake_telemetry only).
    response_codes:
      200: >-
        {ok, migration_sha256, schemas {name: {existed, valid_before, created, rebuilt, valid_after}}, pushdown_probe
        {idx_scan_before, idx_scan_after, engaged} or {engaged: null, error_class}} -- booleans, counts and the hash only;
        the probe is a fixed count-only read returning two idx_scan counters and no row data
      500: "DuckLakeRuntimeError: missing/wrong confirm, a post-build invalid index, or a database error naming only its class and SQLSTATE"
    typed_errors:
      runtime: "missing/wrong confirm, an invalid index after the build, or a database error (class and SQLSTATE only) (500)"
audit_invariants:
  - "Singleton: reserved_concurrent_executions=1 enforces a single concurrent maintenance run (Decision 81 cl.6)."
  - "The scheduled path is agent-free (CD.33 cl.5 / Decision 81 cl.6); an ADMIN-container agent may invoke reconcile_partitions / rewrite_partition_layout only under explicit human direction, confirming each mutation (Decision 204 -- see docs/contracts/ducklake-partition-remediation.yaml's procedure for the agent-led run), and provision_telemetry_login likewise (Decision 213 cl.5 -- deploy-paths.yaml admin_out_of_band.scoped_login_provisioning); provision_catalog_owner and provision_telemetry_catalog are the fourth and fifth carve-outs (Decision 230 -- admin_out_of_band.production_catalog_provisioning), while catalog_stats and ensure_catalog_indexes stay human-invoked only."
  - "Stats index (Decision 214 cl.2): only ensure_catalog_indexes and catalog_reinit build it; provision_telemetry_catalog never does."
  - "Scheduled merge/gc/hot_merge operate on the SMOKE catalog (ducklake_smoke); merge_ops and gc_ops are ALSO EventBridge-scheduled (every 6h / weekly respectively) but target the PRODUCTION catalog (ducklake_ops) with data_path+meta_schema supplied by the EventBridge target -- gc_ops's rule is ENABLED (gc-ops-baseline-gate-and-schedule-enable). The human-invoked operational actions (catalog_reinit/restore_drill/catalog_stats/reconcile_columns/reconcile_partitions/rewrite_partition_layout) target production via explicit params and refuse no-arg invokes; provision_telemetry_login, provision_catalog_owner and provision_telemetry_catalog take only closed confirm tokens and are non-destructive to data."
  - "GC (both gc and gc_ops) is guarded by the fail-closed G1-G4 guard set (reachability, retention floor, catalog sanity, an absolute per-pass deletion bound); a G1/G2/G3 trip raises DuckLakeMaintenanceError, emits MaintenanceBreakerTrip=1, and deletes nothing, while a G4 over-budget pass defers the whole destructive step instead. The forced-trip breaker_probe action (out of contract scope) exists to prove G1. gc_ops additionally runs an INDEPENDENT post-pass safety check (referenced_missing against a real storage listing, plus a value-scanning read-path re-read) that G1-G4 do not perform, because gc_ops's live set is UNIVERSAL (every table, no policy input) rather than scoped by maintenance_policy."
  - "Three destructive paths exist: catalog_reinit is CATALOG-STRUCTURE destructive (meta-schema drop + reinit; confirm=<meta_schema>-guarded; IRREVERSIBLE); gc / gc_ops are DATA-FILE destructive (snapshot expiry + orphan-file deletion on the happy path), guarded by the G1-G4 guard set, not a confirm token (gc_ops additionally supports dry_run=true); and rewrite_partition_layout is ROW-PRESERVING but DATA-FILE destructive until snapshot expiry (the legacy-scheme files are superseded, not deleted), confirm=<table>-guarded, history tables only (Decision 204)."
  - "maintenance_policy governs PER-TABLE-SCOPED verbs only -- its production consumers are merge_ops, reconcile_partitions and rewrite_partition_layout (Decision 204); gc_ops NEVER reads it or calls scope.resolve_scope, because a catalog-wide destructive verb takes no policy cell (filtering its live set would narrow what the guards can SEE, never what gets deleted)."
  - "Telemetry catalog maintenance (Decision 236 cl.5): ten alarms read only the MetaSchema=ducklake_telemetry series (eight maintenance, two writer); the ops series stays undimensioned and receives no telemetry datapoint. G4 headroom: weekly dead files are about 7 x D against G4_MAX_DELETE_FILES 20,000, and above about 2,850 files a day every pass drains partially (GcDeferredFiles, Decision 193). Neon storage growth is detected by the stats-rows alarm on the dominant catalog table and egress driver (Decision 88 cl.1(iii)); no compute cap is claimed for storage (Decision 214 cl.3 caps compute; its Terraform limit is pending under rec-4220)."
  - "An unknown `action` returns 400 with the sorted action allow-list (dispatcher-level; not a per-verb outcome)."
