---
# Class B Lambda verb contract for the ducklake_reader Lambda (the SOLE ops_* read authority).
# Authored at status: provisional_v0 under the CD.25 pre-codegen contract ratification ritual
# (platform tier_item T1.12, Class B wave). CD.16 ratified (dec-1086); the Lambda is deployed and
# serving live ops_* reads since the T2.19 recs cutover (2026-06-08/09), so the v0 clock is real.
#
# Re-grounded from the superseded six-Lambda model (lambda-query / lambda-list-tools) onto the
# consolidated DuckLake read boundary: CD.10's six-Lambda enumeration is illustrative not canonical
# (audit F-008, 2026-06-09); CD.33 / Decision 81 / Decision 91 ratified the writer/reader/maintenance
# split + closed boundary. The "list-tools" surface is the named-verb registry (named_read +
# src/common/ducklake_named_reads.py NAMED_READS), NOT a separate Lambda.
#
# Authored against the shipped scripts/contracts_schema.py + scripts/contracts.py loader (NOT the
# INTENT worked examples). Verb surface read from src/lambdas/ducklake_reader/handler.py dispatch.
contract:
  id: ducklake_reader
  class: B
  contract_version: 1
  status: provisional_v0
  description: >-
    Read-scoped DuckLake runtime Lambda invoked over an AWS_IAM (SigV4) Function URL. The SOLE read
    authority for the ops_* governance tables on DuckLake-on-Neon (CD.33 / Decision 81 cl.7): every
    ops read transits this URL; the closed boundary is the only read path. The read role is scoped read-only
    (S3 GetObject + the Neon catalog credential) so a write attempt is denied at the IAM/S3 layer
    (the closed read boundary). This contract documents the PRODUCTION verb surface only; the
    smoke/diagnostic actions (attach_check, read_current, partition_prune_check, write_probe,
    connect_probe, reset_warm_connection) are T2.17 gate instrumentation, NOT agent surfaces, and
    are out of contract scope.
  governance:
    auth_type: >-
      AWS_IAM SigV4-signed Function URL; read-only IAM role (S3 GetObject + Neon catalog credential
      only). A write attempt is denied at the IAM/S3 layer (the closed read boundary; write_probe).
    principal_classes:
      - PlatformDev
      - PlatformAdmin
    registry_path: >-
      src/common/ducklake_named_reads.py (the NAMED_READS registry, re-exported by ducklake_scd2_schema; named_read
      verb dispatch, Decision 84 I-3). The telemetry EVENT_READS registry (src/common/ducklake_event_read_verbs.py) is served
      by agent-platform-ducklake-telemetry-reader (ducklake_telemetry_reader.yaml), not by this function. The response stamps
      registry_version (the registry-format version) and the served verb's read_version (a per-verb compatibility stamp) for
      cache-coherence.
  provisional_v0:
    authored_at: "2026-06-22"
    authored_via: >-
      PLAN-ratify-class-b-lambda-verb-contracts (T1.12 Class B wave); Step 10 multi-perspective
      critique + merge to main.
    rationale: >-
      Class B contracts start provisional_v0 (INTENT Part 6A/6B): the verb set, error taxonomy, and
      payload shapes are validated against real agent traffic before ratification. The reader is the
      hottest ops path (every preflight sync + every rec/decision read), so a high invocation
      threshold reaches signal quickly.
    first_production_invocation_date: "2026-06-08"
    surfacing_note: >-
      The time-based alarm is LIVE: session_preflight._scan_provisional_contracts computes
      days_since_first_production_invocation deterministically from first_production_invocation_date
      (via scripts.contracts_enforcement.default_provisional_metrics) and surfaces this contract in
      provisional_contracts_due once the threshold below is met -- no credentials, no warehouse reads.
      The production_invocations condition stays dormant pending invocation telemetry (T2.36 /
      Decision 84 Phase 4); check_re_ratification_trigger schema-validates this trigger block in CI.
    re_ratification_trigger:
      first_of:
        - "production_invocations >= 2000"
        - "days_since_first_production_invocation >= 60"
    re_ratification_owner: "human + Step 10 multi-perspective critique"
verbs:
  read_ops_current:
    payload_schema_ref: >-
      event envelope {action: "read_ops_current", table, filter?: {column, value}, key?|id?, limit?}.
      Returns current-projection rows. `filter` is the structural form (column validated against the
      field-semantics contract, rec-2170); `key`/`id` is the legacy merge-key-equality form.
    response_codes:
      200: "rows returned; body {ok, table, rows, row_count}"
      413: "response_too_large: the Function-URL envelope exceeds MAX_RESPONSE_BYTES (6,000,000); body {ok: false, error_type, action, bytes, cap, hint}; never retried (Decision 215 cl.6)"
      500: "DuckLakeRuntimeError (unknown/missing table; malformed filter) / VersionMismatchError; unmapped: any other exception answers 500 {ok, error_type, error_class, request_id, action, elapsed_ms}, never its message"
      503: "catalog_unavailable: a dead catalog connection (retryable)"
    typed_errors:
      filter_validation: "malformed filter (must carry BOTH column and value) -- rejected loudly rather than degrading to an unfiltered full-table read, rec-2170 (DuckLakeRuntimeError -> 500)"
      runtime: "unknown/missing table or runtime loud-fail (500)"
      version_mismatch: "DuckDB/extension version mismatch (500)"
      response_too_large: "serialised response envelope above the 6,000,000-byte guard (413, typed, never retried); use a narrower named verb or the claim-check export (rec-4237)"
      unmapped: "an exception no row maps: 500 {error_class, request_id, action}, never the message; one ducklake_unmapped_error log line carries the redacted detail (500)"
      catalog_unavailable: "a dead catalog connection (also after the reopen-once where the handler reopens): retryable, 503 {error_class, request_id, action, reopened}"
  read_ops_history:
    payload_schema_ref: >-
      event envelope {action: "read_ops_history", table, key?, limit?}. Returns append-history
      (SCD2) rows for an ops_* table, optionally filtered to one merge key.
    response_codes:
      200: "rows returned; body {ok, table, rows, row_count}"
      413: "response_too_large: the Function-URL envelope exceeds MAX_RESPONSE_BYTES (6,000,000); body {ok: false, error_type, action, bytes, cap, hint}; never retried (Decision 215 cl.6)"
      500: "DuckLakeRuntimeError (unknown/missing table) / VersionMismatchError; unmapped: any other exception answers 500 {ok, error_type, error_class, request_id, action, elapsed_ms}, never its message"
      503: "catalog_unavailable: a dead catalog connection (retryable)"
    typed_errors:
      runtime: "unknown/missing table or runtime loud-fail (500)"
      version_mismatch: "DuckDB/extension version mismatch (500)"
      response_too_large: "serialised response envelope above the 6,000,000-byte guard (413, typed, never retried); use a narrower named verb or the claim-check export (rec-4237)"
      unmapped: "an exception no row maps: 500 {error_class, request_id, action}, never the message; one ducklake_unmapped_error log line carries the redacted detail (500)"
      catalog_unavailable: "a dead catalog connection (also after the reopen-once where the handler reopens): retryable, 503 {error_class, request_id, action, reopened}"
  named_read:
    payload_schema_ref: >-
      event envelope {action: "named_read", verb, params?: {..}, limit?}. `verb` names a
      pre-established read from the NAMED_READS registry (src/common/ducklake_named_reads.py);
      `params` binds named bind values. No caller SQL crosses the boundary on this path (Decision
      84 I-3). `limit` (T1.16 c1) is an optional server-side integer-cast trailing LIMIT, accepted
      ONLY for a `paginable` verb (e.g. open_recs, recs_by_title_prefix) -- rejected with a
      DuckLakeRuntimeError for a non-paginable verb. An event-journal verb name is not registered here and
      answers as any unregistered verb.
    response_codes:
      200: "rows returned; body {ok, verb, registry_version, read_version, rows, row_count}. read_version is an opaque per-verb digest (first 16 hex of sha256 over the verb's canonical definition, SELECT * verbs including their column projection), compared by equality only -- it implies no ordering; registry_version stays the registry-format stamp"
      400: "named_read_input: a bound value or a registry error() guard refused caller input; body {ok: false, error_type, verb, error_class, error} with the redacted DuckDB message (first line, 300 characters); never retried. BinderException, ParserException and every other DuckDB class stay 500 unmapped"
      413: "response_too_large: the Function-URL envelope exceeds MAX_RESPONSE_BYTES (6,000,000); body {ok: false, error_type, action, bytes, cap, hint}; never retried (Decision 215 cl.6)"
      500: "DuckLakeRuntimeError (empty/unknown verb, an event-journal verb name included; non-object params; limit on a non-paginable verb) / VersionMismatchError; unmapped: any other exception answers 500 {ok, error_type, error_class, request_id, action, elapsed_ms}, never its message"
      503: "catalog_unavailable: a dead catalog connection (retryable)"
    typed_errors:
      runtime: "missing/unknown verb (an event-journal verb name included), params not an object, or limit supplied for a non-paginable verb (500)"
      version_mismatch: "DuckDB/extension version mismatch (500)"
      response_too_large: "serialised response envelope above the 6,000,000-byte guard (413, typed, never retried); use a narrower named verb or the claim-check export (rec-4237)"
      named_read_input: "a named verb refused caller input (a bound value or an error() guard raised InvalidInputException, ConversionException, OutOfRangeException or TypeMismatchException): 400 {verb, error_class, error} carrying the redacted DuckDB message (first line, 300 characters); never retried"
      unmapped: "an exception no row maps: 500 {error_class, request_id, action}, never the message; one ducklake_unmapped_error log line carries the redacted detail (500)"
      catalog_unavailable: "a dead catalog connection (also after the reopen-once where the handler reopens): retryable, 503 {error_class, request_id, action, reopened}"
  describe:
    payload_schema_ref: >-
      event envelope {action: "describe"}. Agent-facing verb (CD.10 / CD.15): returns the per-verb
      parameter schema for every NAMED_READS entry (table, description, params, paginable, params_schema, read_version,
      agent_facing); no event-journal row is listed (the telemetry reader describes those). Connectionless -- pure metadata,
      no Neon connection (Decision 88 bounded egress).
    response_codes:
      200: "body {ok, verbs: {<verb>: {table, description, params, paginable, params_schema, read_version, agent_facing}, ...}}; agent_facing (bool, default true) marks whether the verb is projected as an agent tool and is excluded from read_version"
      413: "response_too_large: the Function-URL envelope exceeds MAX_RESPONSE_BYTES (6,000,000); body {ok: false, error_type, action, bytes, cap, hint}; never retried (Decision 215 cl.6)"
      500: "unmapped: an exception no row maps answers 500 {ok, error_type, error_class, request_id, action, elapsed_ms}, never its message"
    typed_errors:
      response_too_large: "serialised response envelope above the 6,000,000-byte guard (413, typed, never retried); use a narrower named verb or the claim-check export (rec-4237)"
      unmapped: "an exception no row maps: 500 {error_class, request_id, action}, never the message; one ducklake_unmapped_error log line carries the redacted detail (500)"

  dq_check:
    payload_schema_ref: >-
      event envelope {action: "dq_check", check, table, params?: {..}}. `check` names one kind of the closed vocabulary
      check_kinds=[row_count_min, recency_hours, not_null, accepted_values, min_length, pattern, array_element_format,
      not_before, min_value, unique, history_not_ahead_of_current, key_absent]; `table` is an ops table with the projection the
      kind needs; `params` binds the kind's declared parameters (a column is accepted only when the table's field-semantics
      contract names it; every value is a bound parameter, never SQL text). The SQL is server-owned
      (src/common/ducklake_dq_checks.py, reader-bundle only) and one call returns one integer violation count, never row
      data. The data-quality runner and the contract-rule census are its callers.
    response_codes:
      200: "count returned; body {ok, check, table, violation_count, check_version}. check_version is the first 16 hex of sha256 over the kind's template text and parameter names, compared by equality only"
      400: "dq_check_input: the request was refused before any connection; body {ok: false, error_type, check, param, reason} naming the kind and the parameter and never the value; never retried"
      413: "response_too_large: the Function-URL envelope exceeds MAX_RESPONSE_BYTES (6,000,000); body {ok: false, error_type, action, bytes, cap, hint}; never retried (Decision 215 cl.6)"
      500: "VersionMismatchError / DuckLakeRuntimeError; unmapped: any other exception answers 500 {ok, error_type, error_class, request_id, action, elapsed_ms}, never its message"
      503: "catalog_unavailable: a dead catalog connection (retryable)"
    typed_errors:
      dq_check_input: "an unknown kind, a refused table (control-class, telemetry_append, registration, unknown, or no current projection where the kind needs one), an unknown, missing or malformed parameter, or a column absent from the table's field-semantics contract: 400 {check, param, reason}, never the value; never retried"
      version_mismatch: "DuckDB/extension version mismatch (500)"
      response_too_large: "serialised response envelope above the 6,000,000-byte guard (413, typed, never retried)"
      unmapped: "an exception no row maps: 500 {error_class, request_id, action}, never the message; one ducklake_unmapped_error log line carries the redacted detail (500)"
      catalog_unavailable: "a dead catalog connection (also after the reopen-once where the handler reopens): retryable, 503 {error_class, request_id, action, reopened}"
audit_invariants:
  - "Closed boundary: the read role is S3 GetObject only; a write attempt is denied at IAM/S3 (no write path through the reader; write_probe gate)."
  - "named_read executes ONLY pre-established registry SQL keyed by verb name; no caller SQL crosses the boundary on this path (Decision 84 I-3)."
  - "No reader action accepts caller-supplied SQL; dq_check is the data-quality harness's read path (Decision 84 I-3 follow-up, PLAN-query-ops-retirement). The retired query_ops action answers 400 unknown action, and the dispatcher's allow-list omits it. Every statement the reader runs is registry content (NAMED_READS) or a dq_check template owned by src/common/ducklake_dq_checks.py, with values bound and column names drawn from the field-semantics contract."
  - "Event-journal verbs (rec-4291, registry v6; the reader half of rec-4024): named verbs in the EVENT_READS registry derive telemetry state, duration, roll-ups, friction, reported cost and a metadata-only health count at read (Decision 199 cl.1). They are served by agent-platform-ducklake-telemetry-reader (ducklake_telemetry_reader.yaml) on the production telemetry catalog, not by this function, which holds no telemetry slot and answers an event verb name as an unregistered verb (500 runtime, after the ops connection); the verb semantics below stay as the reference for that function (Decision 236 cl.2). as_of is required and timezone-aware (the boundary never substitutes server time); session_id must be a canonical 26-character ULID whose time prefix decodes the one calendar-day partition read; a window verb takes day_from and day_to within its declared max_window_days (7 for sessions_window and sessions_window_all_purposes). A refused value answers 400 named_read_input naming the parameter and never echoing the value, before any connection or SQL. Rows are derived, never raw, and carry generations (V* per producer), conflicted_grain_keys and derivation_conflicted: a grain conflict is reported, never resolved (Decision 207). sessions_window excludes drill and synthetic projects structurally; sessions_window_all_purposes and telemetry_health_count are not agent-facing."
  - "transcript_content is registered in EVENT_READS but served by no deployed function: this function serves no event verb and the telemetry reader excludes it, so no transcript content is served from production (Decision 236 cl.3; rec-4696 deploys the masked content reader, Decision 239). The transcript_content invariants below are the reference for that reader."
  - "transcript_content (rec-4291; not agent-facing; the content_blobs port's get_blob read): params session_id, producer, event_id, parser_version, offset, max_bytes name one stored transcript row by its full grain key and return one response row {storage, encoding, offset, length, content_bytes, content_sha256, data, omitted_reason}. data is standard base64 of at most MAX_CHUNK_BYTES = 3,145,728 raw bytes, so a split multi-byte character stays exact and the largest envelope stays under the 6,000,000-byte guard. For storage inline or object the caller loops while offset + length < content_bytes, concatenates the decoded pages, then checks the reassembled length and SHA-256 against the row; storage omitted carries no data (length 0, omitted_reason set) and its content_bytes is the raw source size (0 on a withheld_by_policy row), so the caller stops. An unknown key answers zero rows; a stored row of a non-current parser_version is still served. Each page re-resolves the row."
  - "transcript_content parameters: producer is a non-empty string of at most 200 characters, event_id and session_id are canonical ULIDs, parser_version, offset and max_bytes are JSON integers (parser_version at least 1, offset at least 0, max_bytes at least 1; max_bytes is then clamped to MAX_CHUNK_BYTES). A refused value answers 400 named_read_input naming the parameter and never echoing the value."
  - "transcript_content typed faults, each answering {ok: false, error_type, reason, request_id, action} and one compact ducklake_typed_fault log line carrying only the function, action, error_type, reason, request id and the upstream error's code and HTTP status: 500 blob_integrity {reason} with reason one of uri_malformed, checksum_absent, checksum_mismatch, length_mismatch, changed_during_read, forbidden_or_missing, missing; 500 blob_misconfigured {reason} (not_configured, root_invalid, store_access); 503 blob_unavailable (retryable). Before serving object bytes the reader HEADs the object (stored SHA-256 and length against the row) and reads the range with IfMatch on that ETag. No response or log line carries content_uri, the bucket, a key, a presigned URL, a digest other than the row's content_sha256, an ARN, an account id or an exception message (Decision 101)."
  - "Grain conflict rule (Decision 207): transcript_content refuses rows stored under one grain key that differ in any compared column, payload or not, with 500 grain_conflict {differing_rows} and never serves one of them as the row, because each page re-resolves the row and a per-page choice could splice two stored versions into one payload. Rows that agree on every compared column but store the payload two ways (one inline, one object) serve the inline row. grain_conflict is a catalog condition counted apart from object corruption."
  - "Exception to 'Rows are derived, never raw' above: transcript_content returns one stored row's payload bytes by its full grain key, never caller-chosen columns and never another row. It and session_tree_rows (the next exception) are the only event verbs that do, and neither is agent-facing."
  - "Exception to 'before any connection or SQL' above: transcript_content's offset-at-or-beyond-size refusal needs the row's content_bytes, so it answers 400 named_read_input after the resolve SQL, still naming the parameter and not echoing the value. Every other refusal happens before any connection."
  - "Verification verbs (telemetry slice 4, rec-4025; none agent-facing; served by agent-platform-ducklake-telemetry-reader, not by this function): session_tree_rows(session_id, offset, max_rows) returns every stored row of one tree, the rows sharing the root's tenant_id, project_id and session_started_at (all four tables, every parser_version, no dedupe), as table_name, row_json, total_rows and roots_in_tree, max_rows at most 2000; telemetry_orphan_counts(day_from, day_to, as_of) returns per day and telemetry join the child rows, the orphaned child rows split by whether their tree is quiescent past the idle threshold, the quiescent and pending tree counts and the conflicted grain-key count, over R4/R5-deduped rows of real-purpose projects; telemetry_root_sessions(day_from, day_to) returns each real-purpose root session's session_id, entity_ref, harness_session_key, branch, session_started_at, last_event_timestamp and its Decision 207 stamps. Windows span at most 7 days."
  - "Exception to 'Rows are derived, never raw' above: session_tree_rows returns the stored rows of exactly one tree, the compared columns plus created_timestamp and never content or content_uri, for verification callers only (the golden replay, the in-session source check and the daily verification monitor on the CI role), which hold the rows in memory for the comparison and never persist them; a page above the envelope guard answers 413 response_too_large and the caller halves max_rows (Decision 215 cl.6). Its callers print counts only."
  - "read_ops_current rejects a malformed `filter` (must carry BOTH column and value) loudly rather than degrading to an unfiltered full-table read (rec-2170 hardening)."
  - "An unknown `action` returns 400 with the sorted action allow-list, and a body that is not valid JSON or not a JSON object returns 400 bad_request (both dispatcher-level; not per-verb outcomes). Reads are idempotent and a dead Neon session is transparently reconnected once; a session that stays dead answers 503 catalog_unavailable."
  - "Reader client-input errors (unknown/missing table, malformed filter, empty/unknown named_read verb) surface as DuckLakeRuntimeError -> 500, not 4xx -- the reader's loud-fail taxonomy is server-error-coded (faithfully documented here; a finer 4xx split would be a code change, not a contract amendment). The 4xx outcomes of a verb are 413 response_too_large (Decision 215 cl.6), for dq_check only, 400 dq_check_input (a request refused before any connection, naming the parameter and not the value) and, for named_read only, 400 named_read_input (a bound value or a registry error() guard refused caller input: InvalidInputException, ConversionException, OutOfRangeException or TypeMismatchException from DuckDB, answered with the redacted DuckDB message); BinderException and ParserException mean registry-versus-schema drift (callers send no SQL) and stay 500 unmapped. The dispatcher-level 400s are separate."
  - "Response-size guard: every action measures the whole Function-URL envelope (len(json.dumps(response).encode('utf-8')), since the body string is escaped again inside it) and above MAX_RESPONSE_BYTES = 6,000,000 returns 413 {ok: false, error_type: response_too_large, action, bytes, cap, hint} instead of an opaque 502 from the runtime's 6,291,556-byte cap; the measured size is logged as response_bytes on every invocation (200 and 413). Clients never retry a 413."
  - "KNOWN GAP: the current_state single-key filter path has an open correctness rec (rec-2170) where a non-merge-key equality filter can bind against the merge key. The verb semantics here document the intended contract; the fix is a code amendment, not a contract change."
  - "T2.26: a control-class table (read_boundary: none, e.g. ops_entity_counters, docs/contracts/ops_entity_counters.yaml) is not reachable through read_ops_current, read_ops_history, dq_check, or named_read -- registering a table for governance does not by itself grant application read access. It is readable only in-transaction by its owning writer, or via the admin ducklake_maintenance control_health verb (outside this contract's boundary)."
  - "Generic-read refusal: read_ops_current and read_ops_history REFUSE (500, DuckLakeRuntimeError naming the write_boundary) and dq_check refuses (400 dq_check_input naming the table parameter) a `table` whose ops_tables entry has write_boundary telemetry_append or registration (the four telemetry event tables, ops_tenants, ops_projects); telemetry reads arrive as the event-journal named verbs (rec-4291) on the telemetry reader, and dimension reads as named verbs. This is a narrow refusal list keyed on write_boundary, not a read-capability model: rec-3771 owns that design. The ops warm slot never attaches the telemetry catalog (coverage: tests/lambdas/ducklake_reader/test_event_routing.py::test_dq_check_runs_on_the_ops_slot_only)."
  - "No request that reaches the handler answers the Function URL's 502 except through a process-level failure: an exception no row maps answers 500 unmapped {error_class, request_id, action}, never its message; a dead catalog connection that survives the reopen-once answers 503 catalog_unavailable. Enforced by the nodes of tests/test_ducklake_reader_handler.py named in the plan's verification step 3 (test_named_read_other_duckdb_error_is_unmapped_500, test_dead_connection_after_reopen_is_503, test_invocation_line_on_unparseable_body). Process-level failures (out of memory, Runtime.ExitError, an init failure) remain the runtime's 502 and count in Errors; rec-4296 owns the reader's process exits."
  - "Declared residual: the ducklake_unmapped_error and ducklake_named_read_input log lines carry the exception message redacted and truncated to 300 characters, so a request value inside an exception's message can reach the log (strictly less than the runtime traceback they replace). The async DuckLake handlers (maintenance, maintenance_smoke, catalog_dr) are EventBridge-invoked and keep Lambda's own retry behaviour; rec-4303 owns them."
amendment_log:
  - date: "2026-10-05"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-telemetry-table-registration (slice 2a-2 plan 1, review item C1): NAMED_READS location pointers move to
      src/common/ducklake_named_reads.py; the describe per-verb entry and the named_read 200 response gain read_version (an opaque
      per-verb digest compared by equality only; registry_version stays the registry-format stamp); the generic-read refusal of
      telemetry_append and registration tables is stated, with the query_ops FROM residual declared.
    migration_story: >-
      Additive: existing consumers ignore the new key. No consumer pins read_version yet.
  - date: "2026-10-29"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-telemetry-top-level-agent-run (rec-4416): the transcript_content audit invariant notes content_bytes is 0 on a withheld_by_policy
      omission row. Reference prose on an unserved verb; no verb, parameter or response changes.
    migration_story: Prose only.
  - date: "2026-10-15"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-telemetry-reader-verbs (rec-4291): the event-journal named-verb class (registry v6), the telemetry warm slot with its
      smoke-pin refusal (lifted by slice 2c with tenant-scoped reads, rec-4292, Decision 200 cl.2), required as_of, the per-row
      response stamps and the per-verb agent_facing flags are documented; the describe entry gains kind, tables, catalog, binding
      and max_window_days for event verbs. The query_ops declared residual (Decision 181 cl.2) is narrowed, not retired: the
      catalog-alias path is closed by construction, the object-store table-function path stays declared (owner rec-4292).
    migration_story: >-
      Additive: existing consumers ignore the new describe keys and the nine new verbs; ops verbs keep their read_version digests.
  - date: "2026-10-14"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-ducklake-typed-unmapped-errors (rec-4282): named_read gains 400 named_read_input for caller-input DuckDB classes;
      every verb gains the typed unmapped (500) answer and the connectionful verbs the typed catalog_unavailable (503) answer; an
      unparseable or non-object body answers 400 bad_request; the all-errors-are-500 invariant names named_read_input as the second
      4xx verb outcome and a no-502 invariant is added.
    migration_story: >-
      Additive for clients: an exception that used to surface as the runtime's untyped 502 is now a typed 500 or 503, and a
      caller-input error inside a named verb that used to be a 502 is now a 400. The client retries 503 catalog_unavailable and
      never the 400 or the 500 unmapped; the agent SDK maps named_read_input to ReaderInputError.
  - date: "2026-10-10"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-recs-full-cache-retirement (Decision 215 cl.6): every verb gains a 413 response_too_large
      response code and typed error (response-size guard at 6,000,000 envelope bytes, response_bytes
      logged on every invocation); the describe per-verb entry gains agent_facing (excluded from
