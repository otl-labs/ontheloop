    change_class: field_add
    summary: >-
      PLAN-telemetry-usage-reader-verbs (rec-4719, rec-4702, rec-4703): model_usage_rollup, tool_use_rollup and
      session_startup_baseline join the served set as agent-facing seven-day window verbs over per-tree and per-session
      derived rows.
    migration_story: >-
      New verbs only; no existing verb, payload or answer changes; describe lists three more agent-facing verbs.
