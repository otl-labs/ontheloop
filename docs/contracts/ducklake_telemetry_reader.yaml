    change_class: field_add
    summary: >-
      PLAN-telemetry-reader-and-smoke-twin (Decision 236): first authoring of the telemetry reader contract, with the describe
      and named_read verbs, the typed terminal answers and the audit invariants.
    migration_story: >-
      A new function, so no existing verb or response changes. It reads the empty production catalog until the flip.
  - date: "2026-10-27"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      PLAN-telemetry-production-flip PR cleanup (Decision 236 cl.2): the event read deadline and threads-and-spill invariants
      move here from ducklake_reader.yaml with the event verbs (they were written by PLAN-telemetry-cold-read-deadline,
      rec-4474, for the shared reader's telemetry slot); this function's deadline_ms, 504 read_deadline_exceeded and no-502
      wording already stood. The moved text keeps threads=1, the setting in force (an 8-thread trial was withdrawn on
      2026-10-19).
    migration_story: >-
      No answer changes: this function has run the same deadline, probe, thread and spill code since it was first deployed.
