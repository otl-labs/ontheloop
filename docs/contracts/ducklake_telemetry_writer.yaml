  ingestion_shape: per_request_commit -- recorded in storage-substrate.yaml tables.telemetry_tables.ingestion_shape (rec-4218),
  with the production column set beside it in tables.telemetry_tables.production_column_set. This contract holds only the pointer;
  contract.governance.principal_classes is unchanged.
