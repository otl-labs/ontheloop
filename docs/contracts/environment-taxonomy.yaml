rationale: >-
  Platform self-improvement changes infrastructure (Terraform, Lambdas, CI), and the risk question
  it answers is "does this break infrastructure". That question needs ONE reserved vocabulary --
  an environment is a platform tier (sandbox / SIT / PROD), a promotion is a gated deploy between
  tiers -- so that a doc, config, or workflow cannot quietly reuse those words for something else
  and re-open the conflation Decision 77 closed. Decisions 24/73 affirm the platform
  sandbox -> SIT -> PROD promotion train as future-state; this contract reserves the words that
  train runs on, and carries the apply-model / guard classification that governs it today.

# Axis A -- PLATFORM environment axis (infrastructure). Table keyed by environment name; each row
# uses the domain terms money_real / code_vs_infra / apply_gating / account (verified safe against
# the Class A/B smuggling detector -- none are Class A/B descriptor keys).
axis_a:
  bootstrap:
    money_real: "N/A (CI/CD own IAM + authority budget; PlatformDev and PlatformAdmin with their inline policies)"
    code_vs_infra: "terraform/bootstrap/ only"
    apply_gating: "admin-only (agent_platform_admin), NEVER auto-apply, out-of-band from CD pipeline (CD.35 Wave 4 / T2.23)"
    account: current personal account
  github:
    money_real: "N/A (GitHub repository settings: ruleset, Environments, Actions permissions, secret scanning)"
    code_vs_infra: "terraform/github/ only"
    apply_gating: >-
      operator hand apply only (classic admin PAT), NEVER auto-apply (Decision 77), a recorded
      carve-out from Decision 126's CI-applies infra trigger; not admin-only: its pre-merge live
      provider contact is the read-only PR-time CI plan (terraform-github-plan.yml, rec-4335), so
      deploy-paths.yaml admin_out_of_band.pre_merge_live_plan does not apply to it
    account: "GitHub repository settings; state in the current personal account"
  sandbox:
    money_real: "no (mocked)"
    code_vs_infra: same code path, mocked externals
    apply_gating: >-
      auto-apply on push to main behind the deterministic guard (Decision 77); fail-closed set
      (IAM/trust/destroy) routes to gated-apply job requiring tf-gated-apply Environment reviewer
      approval (CD.35 Wave 3 / T2.22)
    account: current personal account
  SIT:
    money_real: "no (system-integration, mocked capital)"
    code_vs_infra: same code path
    apply_gating: manual apply after review
    account: future dedicated account (not yet stood up)
  PROD:
    money_real: "yes (real capital)"
    code_vs_infra: same code path
    apply_gating: manual apply + second approver
    account: future dedicated account (not yet stood up)
  mock_vs_real_note: >-
    The platform split is mock-vs-real at ONE code version, not version-skew tiers. The same code
    path runs in each environment; only the externals (mocked vs real) and the apply gate differ.
  sandbox_gated_apply: >-
    Sandbox gated-apply path (CD.35 Wave 3 / T2.22 / Decision 92, trust corrected by Decision 94;
    reach widened by Decision 183): when the deterministic guard exits 2 (IAM/trust/destroy diff),
    the apply-sandbox job sets routed=true and exits green (routing is not a failure). This is
    reachable from EITHER heal verb: a push to main (T2.21 apply-the-saved-plan), or a
    workflow_dispatch acknowledge-and-retry (plans fresh at main HEAD) whose fresh plan the guard
    also routes. A gated-apply job (needs: apply-sandbox, environment: tf-gated-apply) then blocks
    until benjamin-blake approves in GitHub Actions -- the SOLE authorization boundary on BOTH
    routes, no second approval mechanism. On approval, it applies the SAME plan.bin the guard
    inspected (no re-plan, Decision 77 no-TOCTOU): on push, the digest-verified saved plan.bin
    fetched from S3 (DEP-07); on a routed workflow_dispatch, the run's own fresh plan.bin handed
    over as a run-scoped SANDBOX_FRESH_PLAN_ARTIFACT (GitHub-native artifact transport, workflow
    token only -- no new IAM, no S3 write) with a symmetric sha256 EMIT (apply-sandbox) / VERIFY
    (gated-apply) pair, mirroring reconcile.yml's RECONCILE_FRESH_PLAN_ARTIFACT hand-off (Decision
    158 route (ii)) verbatim -- Decision 77 artifact identity holds on every route. The saved-plan
    and artifact plan sources are mutually exclusive per run; a saved plan.bin is never fetched on
    a dispatch. It then writes the convergence record via the T2.20 always-run write, whose write
    semantics are THREE-BRANCH (Decision 154 / rec-2862, amends Decision 92 by forward reference):
    status=green on apply success; status=red on a genuine apply failure (an apply step ran and
    infrastructure may be in an unknown state); or, on a PRE-apply failure (artifact fetch / tfvars
    / terraform init / saved-plan fetch failed with NO apply step having run at all), a non-status
    infra_error MARKER merged via the same read-modify-write shape as the pending_gated marker --
    status is left UNCHANGED and the write verifies via read-back, so a pre-apply failure never
    latches the platform-halting red that only a genuine apply failure should latch. The
    pre-apply-failure input that selects the third branch is a caller-computed, closed-allow-list
    conjunction (never inferred from a positional "before apply" rule) -- see Decision 154 for the
    full derivation and its reversal conditions. The Environment is the authorization boundary --
    the required reviewer gates JOB EXECUTION. Because the gated-apply job declares
    environment: tf-gated-apply, GitHub sets its OIDC sub to
    repo:OWNER/REPO:environment:tf-gated-apply (the env claim REPLACES the ref claim), so
    github_ci_apply's trust lists BOTH refs/heads/main (routine path) and the environment sub
    (gated path); trusting the environment sub is safe (Decision 94 corrects the original "sub
    stays refs/heads/main" claim, which VP9 disproved). This gates the apply JOB, NOT a PR status
    check (adding it to required checks would wedge autonomous fix-merges, Decision 83). The
    bootstrap root (CD.35 Wave 4 / T2.23) owns github_ci_apply's own IAM + authority budget
    (permissions boundary + propagation condition keys) in terraform/bootstrap/. In-budget IAM
    auto-apply (guard-consumption) landed in T2.25 -- see guard_classification below.

# Convergence-record marker vocabulary (Decision 77 clause 1 / Decision 92 point 5 -- SOLE SoT;
# Decision 190 adds pending_codification). Table keyed by marker name; each row uses the domain
# terms meaning / status_effect / written_by (verified safe against the smuggling detector).
convergence_marker_vocabulary:
  pending_gated:
    meaning: a routed-pending gated-apply awaiting human review (DEP-11, Decision 183)
    status_effect: "none -- status is read-modify-written UNCHANGED (routed_at overwrites unconditionally)"
    written_by: write-convergence-record composite action (routed input)
  infra_error:
    meaning: a pre-apply failure (Decision 154) -- the apply never ran, so infrastructure is in its last-known state
    status_effect: "none -- status is read-modify-written UNCHANGED (routed_at overwrites unconditionally)"
    written_by: write-convergence-record composite action (pre-apply-failure input)
  pending_codification:
    meaning: >-
      a benign code-behind-state delta measured by scripts.ci.convergence_classify.classify_plan
      (resource_changes non-empty, resource_drift EMPTY) -- state ahead of code (e.g. an
      operator-sanctioned split-apply), never out-of-band infra drift
    status_effect: "none while fresh -- status is read-modify-written UNCHANGED; first_seen is WRITE-ONCE (never refreshed) so measured age keeps growing across repeated writes"
    written_by: terraform-drift.yml's Handle-drift step (plan_ec==2 branch)
    bounded_age_hours: 2.0
    escalation: >-
      a marker whose measured age (now - first_seen) reaches bounded_age_hours escalates to
      status=red on the NEXT drift tick (the marker is removed, never left to coexist with red) --
      a misclassified real drift must never sit indefinitely under a benign marker
    self_clear: >-
      a plan_ec==0 cycle (terraform-drift.yml's dedicated self-clear step) removes the marker and
      writes the additive benign_delta_resolved_at timestamp as a durable closure stamp (Decision
      55 anti-hiding) -- the marker is never silently dropped with no trace. The closure-stamp
      key deliberately does NOT contain "pending_codification" as a substring: every reader that
      checks for the marker's ABSENCE (terraform-drift.yml's self-clear read-back verify, both
      escalate.py rec-acceptance probes) greps that bare string, so a closure-stamp key
      containing it would make a genuine self-clear look permanently unresolved.

# red_cause: a DERIVED discriminator, never a stored record field (Decision 190 / Decision 142 one
# authority). scripts.ci.convergence_classify.derive_red_cause and its
# scripts.convergence_health.record.derive_red_cause mirror both read the SAME drift_run_url field
# scripts/ci_rca/convergence_dedup.py's cause-resolution already keys on: drift_run_url present ->
# out_of_band_drift; absent -> apply_failure. Consumed by the CONVERGENCE_RED refusal renderer and
# the terraform-converged advisory description so neither ever blames a drift-caused red's stale
# last-successful-apply commit_sha as the failing apply.

# Route-exhaustiveness (Decision 158 pattern): classify_plan()'s three-member VERDICTS set, fed by
# a `terraform show -json` plan. Precedence is FAIL-CLOSED and explicit -- evaluated in this order.
convergence_drift_route_exhaustiveness:
  - verdict: out_of_band_drift
    criteria: "resource_drift non-empty, WHATEVER resource_changes holds (drift wins on both-present)"
    record_effect: "status=red (unchanged from the pre-Decision-190 behaviour)"
  - verdict: pending_codification
    criteria: "resource_drift empty AND resource_changes non-empty"
    record_effect: "pending_codification marker merged; status unchanged"
  - verdict: converged
    criteria: "both resource_drift and resource_changes empty"
    record_effect: "no-op"
  - verdict: out_of_band_drift
    criteria: "unparseable / non-object plan JSON -- fail-closed, NEVER converged"
    record_effect: "status=red (an unreadable plan is never evidence of nothing having changed)"

# In-budget vs out-of-budget guard classification (T2.25 / Decision 92 point 5 -- SOLE SoT). Table
# keyed by classification name; each row uses the domain terms criteria / guard_verdict (verified
# safe against the smuggling detector).
guard_classification:
  description: >-
    The deterministic guard (scripts/terraform_apply_guard.py) narrows from blocking ALL IAM diffs
    to budget-based classification. Evaluation order: delete -> neon -> trust-diff -> IAM ->
    resource-policy.
  in_budget:
    criteria: >-
      resource type in in_budget_resource_types, every action in in_budget_actions
      (["create","update"], subset-matched), target role name matches
      in_budget_managed_role_prefix ("agent-platform-") with the apply role self-excluded
    guard_verdict: "exit 0 (auto-apply, still subject to subagent review)"
  out_of_budget:
    criteria: any IAM-sensitive type+action not matching all three in-budget criteria
    guard_verdict: "exit 2 -> tf-gated-apply Environment"
  trust_diff:
    criteria: "assume_role_policy differs on ANY resource (checked BEFORE IAM)"
    guard_verdict: exit 2 always, even on in-budget resource types
  destroy_replace:
    criteria: '"delete" in actions'
    guard_verdict: exit 2 always
  neon_update_delete:
    criteria: non-create neon_* action
    guard_verdict: exit 2 always
  resource_policy_safe_shape:
    criteria: >-
      aws_lambda_permission change whose principal == events.amazonaws.com (exact) AND action ==
      lambda:InvokeFunction (exact) AND function_name starts with agent-platform-, ALL THREE
      conjunctively -- the routine EventBridge-rule-invokes-Lambda wiring pattern
    guard_verdict: "exit 0 (auto-apply, still subject to subagent review)"
  resource_policy_blocked:
    criteria: >-
      any non-inert change on aws_lambda_permission, aws_s3_bucket_policy, aws_sns_topic_policy,
      aws_secretsmanager_secret_policy, aws_glue_resource_policy, or aws_lambda_function_url that
      does not match the safe shape above (evaluated LAST, after IAM, so a delete or trust diff on
      one of these types is still caught by the earlier rows)
    guard_verdict: "exit 2 -> tf-gated-apply Environment"
  budget_table: >-
    The machine-readable budget table lives at terraform/bootstrap/authority_budget.json (override
    via TF_AUTHORITY_BUDGET env var for testing). Missing or unparseable table = fail closed (all
    IAM treated as out-of-budget, Decision 77). scripts/validate.py:validate_authority_budget
    asserts the table stays in sync with the IAMRoleWriteBounded SCP in
    terraform/bootstrap/github_ci_apply.tf.
  budget_v2: >-
    Budget v2 (Decision 144 / T2.48): in_budget_actions is ["create","update"] (a NEW inline
    policy/attachment on a boundary-carrying agent-platform-* role now auto-applies; was
    update-only), and the managed-role set is the boundary-carrying agent-platform-* prefix
    (in_budget_managed_role_prefix), not the two-role enumeration -- extending Decision 129's
    per-service agent-platform-* read prefix to writes. The guard's in-budget predicate
    (_classify_iam_change) widens to READ the v2 budget shape (subset-match on actions;
    prefix-match on the target role) with an explicit apply-role self-exclusion (the widened
    prefix matches agent-platform-github-ci-apply itself, so a write on the apply role routes to
    gated -- the guard-side counterpart to DenySelfInlinePolicyWrite). This is a predicate
    widening only: NO new classification stage, and the CD.35 fail-closed control theory
    (saved-plan no-TOCTOU, evaluation order, missing-budget = fail-closed) is retained verbatim.
    Role CREATE (aws_iam_role type) stays gated (routes to tf-gated-apply -- a new trust surface)
    but is now EXECUTABLE by the gated job because new roles declare the mandatory boundary. The
    ratchet widens on track record (Decision 92 point 5): budget amendments via the bootstrap tier
    only; subagent review advises, never locks.
  resource_based_policy_note: >-
    Resource-based-policy classification (T2.45 / DEP-06): the six RESOURCE_POLICY_TYPES -- Lambda
    permissions and the S3/SNS/Secrets-Manager/Glue resource policies plus Lambda function URLs --
    attach a policy directly to a non-IAM resource, so a wildcard or external-principal grant on
    one of them could previously guard-PASS unreviewed without ever touching an aws_iam_* type. The
    guard now fails closed on all six except the one known-safe aws_lambda_permission shape.
    Intentional over-block, expected to be a steady-state no-op: a NEW S3-trigger
    aws_lambda_permission (principal s3.amazonaws.com) or a NEW aws_lambda_function_url now routes
    to tf-gated-apply on any non-inert change, since neither matches the EventBridge safe shape nor
    has an allowlisted shape of its own -- once such a resource is applied, the Lambda code/infra
    decoupling principle (see conformance below) means a routine code-only redeploy never produces
    a Terraform diff on it again, so in steady state this gate is a one-time review, not recurring
    friction. Known-incomplete allowlist: the six RESOURCE_POLICY_TYPES are the resource-based-policy
    types this repo has needed to date, not an exhaustive enumeration (e.g. aws_sqs_queue_policy and
    aws_kms_key_policy are outside this list today) -- introducing one requires a deliberate guard
    extension (add it to RESOURCE_POLICY_TYPES plus, if it needs one, its own allow-shape); until
    extended, an unclassified type fails open to whatever the pre-T2.45 posture was (auto-apply on
    a non-IAM, non-neon, non-trust-diff change).

# Vocabulary reservation (RESERVED -- enforced by lint). Table keyed by term; each row uses the
# domain terms reserved_meaning / do_not_use_for (verified safe against the smuggling detector).
vocabulary:
  environment:
    reserved_meaning: a PLATFORM tier (sandbox / SIT / PROD)
    do_not_use_for: anything that is not one of those three tiers
  phase:
    reserved_meaning: "NOT a platform-axis word -- it names no environment tier."
    do_not_use_for: a platform deploy tier
  promotion:
    reserved_meaning: a gated deploy from one platform tier to the next
    do_not_use_for: any movement that is not a deploy between platform tiers
  sandbox_sit_prod:
    reserved_meaning: platform environments
    do_not_use_for: any non-infrastructure lifecycle state
  staging:
    reserved_meaning: "RETIRED. Renamed to SIT on the platform axis."
    do_not_use_for: any new use as a live tier
  allowlisted_compound_tokens:
    - research_sandbox   # a telemetry destination, not the platform sandbox
    - production_ensemble  # a model name, not PROD
  anti_patterns:
    - >-
      a platform-tier token next to the word "phase" (e.g. "sandbox phase") -- platform tiers are
      environments, not phases.

single_account_rule: >-
  Single-account rule (load-bearing): the PLATFORM is SINGLE-ACCOUNT today -- the current personal
  account, sandbox environment only. SIT and PROD are reserved vocabulary and future-state
  infrastructure, not standing accounts: standing one up is a deliberate, separately-decided step,
  never an incidental consequence of a change that mentions the tier. Affirming the platform
  promotion train as future-state does NOT authorise authoring multi-account infrastructure now.
  The contract reserves the vocabulary so the train can be stood up later without re-litigating
  the taxonomy.

# Lambda code/infra decoupling principle (personal-account Lambdas). Typed conformance fields
# (ducklake_class / prod_class, values DECOUPLED|COUPLED) replace the superseded .md's prose
# "**Conformance status" paragraphs that scripts/checks/ops_governance/
# validate_deploy_channel_conformance.py used to regex-match.
conformance:
  description: >-
    When personal-account Lambdas are introduced under terraform/personal/, decouple code deploys
    from infra applies: set lifecycle { ignore_changes = [source_code_hash] } (or the equivalent
    filename/handler attributes) on the aws_lambda_function resource so that a code-only redeploy
    does not surface as a Terraform diff on the guarded auto-apply path. Code ships via the build
    pipeline; infra ships via Terraform. Keeping them decoupled means the deterministic apply guard
    sees only genuine infra changes, not routine code-hash churn.
    Terraform never reads a build artifact; function and layer code is addressed only by
    s3_bucket/s3_key, no resource sets source_code_hash (the ignore_changes block stays as the
    conformance marker and a backstop), and code ships through the code-deploy channel. Because
    Terraform re-evaluates file functions when it applies a saved plan, and nothing masks a create,
    no configuration file read may name a file a job builds or downloads (rec-4243). Coverage
    (Decision 181): validate_terraform_no_build_artifact_reads enforces it for every literal
    filesystem path in terraform/ (a prefixed literal anywhere, or a plain literal passed to a
    file-family function) and flags any source_code_hash argument; declared residuals: a path
    assembled from non-literal parts, and a job output written to an untracked but not ignored
    path (none exists today; rec-4246); job-materialised inputs that are not file reads (the tfvars
    fetched from Secrets Manager, the provider mirror) are recorded in plan.bin itself.
  ducklake_class: DECOUPLED
  ducklake_detail: >-
    Decision 125/126, #544: the DuckLake Lambdas (writer, reader, maintenance, catalog-dr,
    maintenance-smoke; T2.17/T2.18, Decision 81/82; plus the telemetry writer, Decision 213, its smoke twin and the telemetry reader, Decision 236, eight in all) are the first personal-account Lambdas and are
    DECOUPLED, conformant: every aws_lambda_function resource in terraform/personal/
    ducklake_lambdas.tf, ducklake_catalog_dr.tf, ducklake_maintenance.tf, and
    ducklake_maintenance_smoke.tf, ducklake_telemetry_writer.tf, ducklake_telemetry_writer_smoke.tf, and ducklake_telemetry_reader.tf carries a lifecycle { ignore_changes = [source_code_hash] }
    block, so a code-only redeploy no longer surfaces as a Terraform diff on the guarded auto-apply
    path. Layers (ducklake-deps-layer, ducklake-extensions-layer, ducklake-pgclient-layer) are ALSO
    decoupled, as of T2.42 c1: every aws_lambda_layer_version resource for the three layers carries
    the same lifecycle { ignore_changes = [source_code_hash] } block -- a routine rebuild's
    non-reproducible zip bytes no longer surface as a layer create+delete (replace) diff on the
    guarded auto-apply path. Decision 154 / rec-2862's fetch_reviewed() route
