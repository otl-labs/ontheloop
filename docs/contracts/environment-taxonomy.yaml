lockfile: >-
  Provider lock file consideration (apply-path supply chain): terraform/personal/
  .terraform.lock.hcl is git-tracked (committed) and load-bearing on the apply runner (T2.42 c2,
  DEP-03). .gitignore ignores .terraform.lock.hcl broadly (terraform/**/.terraform.lock.hcl) but
  carries an explicit un-ignore for this root (!terraform/personal/.terraform.lock.hcl) -- landed
  incidentally in commit 0fec964 / PR #605 (T2.16b/CD.34). The committed lock pins the two
  providers this root depends on (hashicorp/aws, kislerdm/neon) -- narrowed from three by
  PLAN-terraform-lock-coherence (2026-09-28) after #969 (7b67e21d) deleted the root's last
  provider-requiring resource and left an orphaned, undeclared lock entry undetected. The pin is
  load-bearing, not decorative: terraform init in all three workflows that touch this root
  (terraform-apply-sandbox.yml, reconcile.yml, terraform-drift.yml) carries no -upgrade flag, so
  every init -- on the highest-privilege sandbox auto-apply path included -- resolves provider
  versions from the committed lock rather than re-resolving fresh on every run. A provider version
  bump is therefore always an explicit, reviewed lock-file diff (terraform providers lock,
  committed in a PR), never silent drift picked up mid-run. Two guard layers keep the committed
  lock from drifting undetected again: `validate_terraform_lock_coherence` (hermetic, --pre and
  full tier) enforces that every locked provider is explicitly declared in that root's
  required_providers and vice versa; and every tracked-lock root's own init in the validator
  (scripts/checks/_terraform.py, both the creds-free gate and the informational backend init)
  carries `-lockfile=readonly`, so it can never again silently rewrite a committed lock -- this is
  authoritative wherever terraform actually runs, since it also catches hash-only drift the
  hermetic parser cannot see. The deterministic guard plus subagent review remain the compensating
  controls for what the lock does not cover (the plan content itself, not the provider binary
  supply chain).

