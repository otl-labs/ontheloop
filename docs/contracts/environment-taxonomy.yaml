# PLATFORM environment taxonomy contract (Decision 77). A Class D mechanism contract
# (migration-step-3-grandfathering, T2.56 migration step 3) as of the `contract:` block below.
# Converted from the superseded prior markdown form of this contract (CFG-11 conversion,
# audits/contract-first-governance-33c8667.yaml) -- deliberately not spelling out the retired
# basename here: this file's own text must never contain it as a contiguous substring, since
# the env-taxonomy-md-no-live-citations sweep (and AC-4) would then flag this file itself.
#
# This file is the single source of truth for the vocabulary reservation AND for the apply-model /
# guard-classification rules (Decision 92 point 5 -- SOLE SoT). Any doc, config, or workflow that
# uses the platform vocabulary below must conform. scripts/checks/iam_tf/
# validate_environment_taxonomy.py enforces the reservation on changed docs.
#
# Cross-references: Decisions 24, 73 (platform promotion train); Decision 35 (apply gating, scoped
# by Decision 77); Decision 125/126 (Lambda code/infra decoupling conformance ratification).
contract:
  id: environment-taxonomy
  class: D
  contract_version: 1
  status: ratified
  ratified_at: "2026-05-30"
  ratified_via: "Decision 77 (2026-05-30); conformance amended by Decision 125 (2026-07-10) / Decision 126"
  description: >-
    The PLATFORM environment axis (infrastructure risk). Sole SoT for the environment vocabulary
    reservation and the terraform apply-model / guard classification (Decision 92 point 5).
  subject: environment-taxonomy
  evaluator:
    check: validate_environment_taxonomy

