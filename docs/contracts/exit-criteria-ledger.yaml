contract:
  id: exit-criteria-ledger
  class: A
  contract_version: 1
  status: ratified
  ratified_at: "2026-07-16"
  ratified_via: "dec-136: Decision 136 ratifies CD.39 -- the exit-criteria ledger (per-criterion status) as the realized in_progress-resolution mechanism"
  description: >-
    Per-criterion status ledger on roadmap tier_items (docs/ROADMAP-PLATFORM.yaml
    TierItem.exit_criteria[]), plus the plan-linkage fields: closes_criteria (the plan->criterion
    link), followon_recs and its followon_recs_readiness projection (deferred halves), and the
    declared plan edges PlanDocument.amends / PlanDocument.introduces / PlanDocument.principal,
    with the roadmap_alignment_projection audit_invariant. Makes in_progress resolvable: remaining work == the set
    of open criteria (Decision 59). The ledger is git-authoritative (roadmap YAML), not an
    ops_* warehouse table (see governance_notes below).

fields:
  id:
    type: str
    description: >-
      Stable identifier for one TierItem.exit_criteria[] entry. Shape defined by
      scripts/platform_roadmap_models.py::ExitCriterion.
    semantics: >-
      Stable within the tier_item; the full cross-item ref is '<item-id>:<id>', e.g.
      'T2.19:c3'. Auto-assigned 'cN' when normalizing a bare string (lazy migration of
      not_started items).
    populated_by: >-
      scripts/platform_roadmap_models.py at load time -- auto-assigned when normalizing a
      bare-string criterion, or read verbatim when the entry is already structured.
    dq_intent:
      not_null: true
    amendment_log:
      - date: "2026-09-04"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-roadmap-blocking-edge-semantics: corrected the stale model-home pointer from
          scripts/roadmap/platform_roadmap.py (the Decision 124 facade) to
          scripts/platform_roadmap_models.py (ExitCriterion's actual defining module since the
          Decision 124 decomposition split the models out of the facade). No field shape or
          semantics changed.
  text:
    type: str
    description: The criterion prose for one exit_criteria[] entry.
    semantics: Verbatim from the bare string that predated this ledger's structured form.
    populated_by: Tier_item author, at roadmap-authoring time.
    dq_intent:
      not_null: true
  status:
    type: "enum: open | met | rehomed"
    description: Lifecycle status of one exit_criteria[] entry.
    semantics: >-
      open = remaining work. met = closed by an actioned plan or commit (met_by names the
      plan-slug or commit sha). rehomed = scope moved to another tier_item (met_by names the
      receiving item id). Default open.

      Exit-criteria truth maintenance (realized-differently rule, relocated from the implement
      skill's bookkeeping walk, PLAN-skills-layer-prose-relocation): when a session satisfies an
      item's INTENT via a different mechanism than its written criterion text describes
      (different filename, different substrate, a criterion superseded by a ratified decision),
      do NOT flip this field to met over text that no longer adjudicates true -- rewrite the
      criterion's text field to the realized mechanism in the SAME staged edit that flips this
      field. On a terminal (status: complete or status: reserved) item, the original wording goes
      to the commit/PR body per docs/contracts/tier-item-lifecycle.yaml#completion_compaction,
      never into a note; on a non-terminal item the original wording may go to the item's
      progress_note (stripped at completion, per the same completion_compaction form), so
      the criterion re-adjudicates true against the repo today. This rule applies identically when
      the bookkeeping walk (docs/contracts/tier-item-lifecycle.yaml#bookkeeping_walk) runs against
      items completed in EARLIER sessions: discovering a criteria-vs-reality mismatch on an
      already-met criterion stages a rewrite, never a silent pass. A met criterion whose text
      cannot be re-run is an audit finding (2026-06-09 audit, F-006/F-014), not a convenience.
    populated_by: >-
      /implement's bookkeeping walk flips open->met for each ref in plan.closes_criteria on a
      verified VP pass (Status-Trusted-Never-Inferred / T2.20). The flip happens BEFORE the
      parent tier_item's own whole-item Outcome rules evaluate
      (docs/contracts/tier-item-lifecycle.yaml#bookkeeping_walk), so those rules read the
      post-flip value, never a fresh prose re-adjudication.
    write_time_validation: >-
      met/rehomed REQUIRE a non-empty met_by. Never inferred from prose, file existence, or
      commit activity. validate.py forbids bare strings on a git-diff-touched item.
    dq_intent:
      not_null: true
      accepted_values:
        values: [open, met, rehomed]
    amendment_log:
      - date: "2026-09-25"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-roadmap-terminal-compaction: repointed the truth-maintenance rule so a terminal
          item's superseded criterion wording goes to the commit/PR body per
          docs/contracts/tier-item-lifecycle.yaml#completion_compaction, never into a note; a
          non-terminal item may still carry it in progress_note. Precedent: the 2026-09-12 entry
          below that first added this rule. No field shape or enum changed.
      - date: "2026-09-12"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-skills-layer-prose-relocation: added the exit-criteria truth-maintenance
          (realized-differently) rule, relocated out of the implement skill's Tier_item
          bookkeeping walk, and clarified that the closes_criteria flip precedes the parent
          item's Outcome rules. No field shape or enum changed.
  met_by:
    type: "str | null"
    description: Resolving pointer for a met or rehomed criterion.
    semantics: >-
      For met: a plan-slug (docs/plans/PLAN-<slug>.yaml exists) or a 40-hex commit sha. For
      rehomed: the receiving tier_item id (must resolve to a known item). Forward-compatible
      as a future ops_execution_plans foreign key (T4.5 / Decision 87).

      closes_criteria flip procedure (relocated from the implement skill's bookkeeping walk,
      PLAN-skills-layer-prose-relocation): /implement flips EXACTLY the criteria named in the
      plan's closes_criteria list, reading each "<item-id>:<crit-id>" ref and setting this field
      in the SAME staged YAML edit that flips the sibling status field to met or rehomed, BEFORE
      the parent tier_item's own whole-item Outcome rules evaluate
      (docs/contracts/tier-item-lifecycle.yaml#bookkeeping_walk). Never flip a criterion not named
      in closes_criteria; never infer this field from prose, file existence, or commit activity
      (Status-Trusted-Never-Inferred / T2.20).
    populated_by: /implement's bookkeeping walk, at the same time status flips to met or rehomed.
    dq_intent: {}
    amendment_log:
      - date: "2026-09-12"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-skills-layer-prose-relocation: added the closes_criteria flip procedure, relocated
          out of the implement skill's Tier_item bookkeeping walk. No field shape changed.
  blocked_by:
    type: "list[dict]"
    description: >-
      Blocking edges on one exit_criteria[] entry: this criterion cannot close until every
      listed ref reaches its named terminus. Shape defined by
      scripts/platform_roadmap_models.py::CriterionBlocker ({ref, until, note}).
    semantics: >-
      ref resolves to a known tier_item id, CD id, or tier shortcut; until is 'complete' (valid
      only on a tier_item/tier-shortcut ref) or 'ratified' (valid only on a CD ref) -- the
      schema validator rejects a ref/until kind mismatch, and an unresolvable ref, at load
      time. note is optional free text. Distinct from depends_on: blocked_by is transcribed
      ONLY from verbatim documentary evidence (never inferred from status, prose tone, or
      commit activity). Its runtime consumer is scripts/platform_roadmap_liveness.py (via
      scripts/checks/roadmap/validate_roadmap_liveness.py, PLAN-roadmap-blocking-liveness-
      detector) -- every blocked_by entry demands its own literal `until` value ('complete' or
      'ratified') as an edge into the roadmap blocking graph, and the toxic-SCC ratchet reads
      this field on every run. Default [] -- most criteria carry no blocked_by.
    populated_by: >-
      Tier_item author, transcribing a verbatim blocking citation found in roadmap prose at
      roadmap-authoring time.
    dq_intent: {}
    amendment_log:
      - date: "2026-09-10"
        semantic_break: false
        change_class: governance_note_add
        summary: >-
          PLAN-roadmap-liveness-t2-t3-core-drain (rec-3579): added the foreign-ratification
          anti-pattern to governance_notes -- never carry until: ratified on a CD whose gates
          do not name this criterion's own item. Declares coverage per Decision 181 clause 2
          (leg A's toxic-SCC ratchet is the mechanical arm; the authoring-time rule is an
          unenforced residual owned by rec-3715). No field shape changed.
      - date: "2026-09-07"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-roadmap-blocking-liveness-detector: corrected semantics -- the field no longer
          "carries no runtime consumer beyond the schema validator today". Names
          scripts/platform_roadmap_liveness.py (via scripts/checks/roadmap/
          validate_roadmap_liveness.py) as the field's runtime consumer, closing rec-3395. No
          field shape changed.
    governance_notes: >-
      Deliberately EXCLUDED from RoadmapDocument._validate_graph's step-(c) depends_on cycle
      DFS. The edges blocked_by carries close real rings (e.g. a criterion legitimately
      blocked_by the very item that rehomed part of its scope back onto it) -- folding them
      into the load-time cycle rejector would make the roadmap unloadable rather than reporting
      the deadlock it represents. depends_on remains the sole DFS-checked adjacency; blocked_by
      is validated independently (ref resolution + until/kind agreement only, no cycle check).

      Foreign-ratification anti-pattern (2026-09-10, rec-3579): never author a blocked_by entry
      with until: ratified on a CD whose own `gates` list does not name this criterion's owning
      item. Under Decision 105's reverse-evidence edge, a pending CD accrues realization
      evidence ONLY from the items it gates completing -- an item outside that gates list has
      no mechanism to advance the CD toward ratification, so a blocked_by entry naming it is a
      wait with no path to resolution (the exact T2.26-on-CD.40 shape rec-3579 found and
      re-sequenced). Coverage (Decision 181 clause 2): leg A's toxic-SCC ratchet is the
      MECHANICAL arm -- it catches the resulting ring once one exists -- but the authoring-time
      rule itself (reject the edge before it is ever written) is an UNENFORCED residual, owned
      by rec-3715.
  plan_closes_criteria:
    type: "list[str]"
    description: >-
      PlanDocument.closes_criteria field (scripts/roadmap/plan_document.py) -- lists which
      item criteria the plan commits to close on a verified VP pass.
    semantics: >-
      Each entry '<item-id>:<criterion-id>' (e.g. 'T-1.23:c2') names a criterion the plan will
      close. /implement flips exactly these open->met on VP pass. validate.py asserts each ref
      resolves to a real item:criterion in the roadmap. Default [] -- a plan that closes no
      item criteria (e.g. a not_started item's first plan) omits the field.
    populated_by: Plan author, at plan-authoring time (the planning skill's follow-on mode).
    write_time_validation: >-
      Each entry is a string "<item-id>:<crit-id>" matching exactly one ExitCriterion in the
      roadmap: item-id must be a real tier_item id in the roadmap; crit-id must be an id within
      that item's exit_criteria (e.g. c1, c2, ...). validate.py enforces referential integrity:
      a closes_criteria ref to a nonexistent item:criterion fails CI (check (iii) in
      validate_platform_roadmap).
    dq_intent: {}
  plan_followon_recs:
    type: "list[str]"
    description: >-
      PlanDocument.followon_recs field (scripts/roadmap/plan_document.py) -- names a plan's
      deferred halves by rec id, so committed work that was split off does not vanish into
      chat, PR bodies, or free-text context (PDB-01, B1-R5/B1-R1).
    semantics: >-
      Each entry is a "rec-NNNN" token (scripts/roadmap/plan_document.py::_REC_ID_RE),
      token-shape validated only -- rec existence is not checkable at write time (the rec
      cache is gitignored), and the deferred half's own intent lives on the rec (title,
      context, acceptance), never restated here. Default [] -- a plan that defers nothing
      omits the field. Deliberately NOT shared with bundled_recommendations' validation
      (Fork 2): exactly one merged legacy plan populates that sibling field with prose.
    populated_by: >-
      Two filing moments, both conditional on an actual deferral: /plan Step 8 (planning-time
      split -- the plan author files the other half and records its id here at authoring time)
      and /implement Step 7 closure, before implementation_declared is set true (implement-time
      split -- the implementer files the deferred half and writes the returned id back into
      this field, a permitted bookkeeping edit per docs/contracts/implement-scope-boundary.yaml
      sanction_rows.implementing_plan_bookkeeping.permitted_field_edits).
    governance_notes: >-
      Discovery-marker convention, one authoritative link: this field holds it. The filed
      rec's tag 'follow-on' plus its context prefix "Deferred half of PLAN-<parent-slug>" is
      the discovery marker for greps and portal filters only, never a second link -- readers
      join on this field, not the tag. Decision 181 declare-your-coverage, per surface: token
      shape is enforced by the validator in both tiers (validate_plan_documents); instruction
      presence (the filing steps exist and are correctly ordered/guarded) is pinned by the
      anti-drift tests; the closure write-back is sanctioned in implement-scope-boundary.yaml's
      permitted_field_edits. The residual, unenforced behavioural arm -- whether a session that
      actually deferred a half obeys the instruction and files it -- is an agent obligation with
      no mechanized check in this slice; rec-3524 owns closing that gap (mirroring the
      residual_owner pattern at docs/contracts/implement-scope-boundary.yaml). Naming an EXISTING rec
      defers to it only when that rec's acceptance fails while the deferred work is undone; otherwise
      file a new follow-on rec (no riders, ops_recommendations.yaml context). Decision 181: served
      as guidance and parity-tested; the unmechanised arm (write-time refusal) is rec-4603's, beside
      rec-3524.
    dq_intent: {}
  plan_amends:
    type: "list[str]"
    description: >-
      PlanDocument.amends field (scripts/roadmap/plan_document.py) -- the decision clauses a plan
      amends, declared as typed tokens so the plan-edge extractor reads a field instead of free text.
    semantics: >-
      Each entry is a "dec:<number>[#<clause-id>]" token (scripts/roadmap/plan_document.py::_DECISION_TOKEN_RE),
      token-shape validated only. The dec: prefix diverges from decision-entry.yaml field_shapes.amends
      (integers) and the dec-NNN warehouse id on purpose: a typed-namespace prefix plus a #clause
      fragment, so the extractor emits it verbatim as an edge target ref. A DECLARATION, never the
      durable record -- the implementation merge writes the edge (Decision 197 cl.5, Decision 205 cl.5).
      Consumer: T4.32 c4's single plan-edge extractor, not built and not claimed here. Decision 217
      cl.5-6 deferral (home T4.24 c7): numbers only until Decision 196 cl.8's split; a #clause is
      recorded but resolves to the whole decision until then; the slug form and Decision 196 cl.6
      prefixes arrive by amendment. Refused below schema_version 5 -- only current and future-version
      plans can assert edges. Default [].
    populated_by: >-
      The plan author at /plan time, when the plan amends a decision clause; omitted otherwise.
    governance_notes: >-
      Decision 181 cl.2 per-surface coverage: token shape and the version floor are enforced by
      validate_plan_documents in both tiers; existence of the named decision is UNENFORCED, owned by
      rec-4517.
    dq_intent: {}
  plan_introduces:
    type: "list[str]"
    description: >-
      PlanDocument.introduces field (scripts/roadmap/plan_document.py) -- the names a plan introduces,
      declared so the plan-edge extractor reads a typed source.
    semantics: >-
      Each entry is an opaque non-blank, whitespace-free name token, shape only. A bare un-namespaced
      token stays permanently valid (merged plans are immutable history), so any later namespacing is
      additive and never re-reads a bare token's kind by guesswork. Declaration only; same consumer
      (T4.32 c4) and same version floor as plan_amends -- only current and future-version plans can
      assert edges. Default [].
    populated_by: >-
      The plan author at /plan time, when the plan introduces a named artefact; omitted otherwise.
    dq_intent: {}
  plan_principal:
    type: "str | None"
    description: >-
      PlanDocument.principal field (scripts/roadmap/plan_document.py) -- the human of intent for the
      plan, declared so the plan-edge extractor reads a typed source.
    semantics: >-
      An opaque non-blank, whitespace-free token, shape only, with no hard-coded handle (operator data,
      Decision 197 cl.1/cl.4); constant today, so absence means the single operator. A public handle or
      role token, never an email address or other private identifier -- a value containing '@' is refused
      at schema time (coverage per Decision 181 cl.2: the '@' arm is enforced by validate_plan_documents
      in both tiers; other private identifiers remain an author obligation, public-repository boundary).
      Same version floor as plan_amends. Default None.
    populated_by: >-
      The plan author at /plan time, only when the plan's human of intent is not the single operator.
    dq_intent: {}
  followon_recs_readiness:
    type: "list[dict]"
    description: >-
      Preflight-derived readiness projection over the plan_followon_recs field above
      (PlanDocument.followon_recs) -- the /orient ad-hoc lane's followon_recs key
      (scripts/preflight/recs_cache.py::_derive_followon_recs). See `derivation` for the rule.
    semantics: >-
      Not persisted -- recomputed on every preflight run from the preflight_signal_rows
      verb's bounded rows and a docs/plans/PLAN-*.yaml disk walk (Decision 215; no warm-sync
      recs pull exists). See `derivation` for the population rule.
    populated_by: >-
      scripts/session/preflight.py, via scripts/preflight/recs_cache.py::_derive_followon_recs
      and its _landed_followon_rec_ids helper -- zero extra reader call (the followon ids ride
      the one preflight_signal_rows call).
    dq_intent: {}
    amendment_log:
      - date: "2026-10-10"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-recs-full-cache-retirement (Decision 215): semantics and populated_by now name the bounded
          preflight_signal_rows read model instead of the warm-sync ops_recommendations pull; the
          population rule and field shape are unchanged.
    derivation:
      rule: >-
        One entry per OPEN rec (status: open) named in the followon_recs list of a
        docs/plans/PLAN-*.yaml plan carrying implementation_declared: true.
      grain_note: >-
        Rec-grain (this field) is distinct from the tier-item-grain
        platform_roadmap.in_progress[].needs_followon_plan gauge carried in the same
        preflight report -- the two are separate keys answering different questions.

governance_notes: >-
  Ledger is git-authoritative (roadmap YAML), NOT an ops_* warehouse table. The
  warehouse-SoT invariant (Decision 84) does not apply to this ledger yet; T4.5 is the
  eventual warehouse home and this is the Decision-87 projection-until-T4.x stand-in.
  Converted to a Class A ritual contract by PLAN-cfg-migration-closeout (ratified_via
  dec-136) -- previously free-form, carrying a now-corrected false claim that
  validate_contract_drift "skips" a contract-less file: a baseline-present free-form file is
  bucketed as grandfathered DEBT (docs/contracts/contract-population.yaml's census), never
  silently skipped. `version`, `last_updated`, and `decisions_cited` (verified zero code
  consumers) were dropped rather than relocated -- ContractDocument's extra="forbid" admits
  no legacy top-level key, and none of the three had a live reader to preserve.

audit_invariants:
  - >-
    roadmap_alignment_projection: fields=[id, name, status, matched, intent, open_criteria,
    depends_on, related_candidate_decisions] (executable copy:
    scripts.roadmap.scope_projection.PROJECTED_FIELDS). Intersection key: files_in_scope
    only, matched bidirectionally -- an entry and a Scope path overlap when equal, or when
    either is a directory prefix of the other (segment-boundary, never a bare string prefix),
    so a directory-shaped Scope path (e.g. "scripts/") matches a file-shaped files_in_scope
    entry just as a directory-shaped entry matches a file-shaped Scope path. Criteria
    projected are this ledger's OPEN exit_criteria, each an {id, text} pair (e.g. id "c1") so
    a CITE/CONFLICT row can cite the criterion as <item id>:<criterion id>. Read-only (T2.20)
    -- never flips a status, never writes a file. A CONFLICT is WARN-severity, never BLOCK.
    Display cap: at most 5 rows, ordered CONFLICT > CITE > RELATED with in_progress/not_started
    items first; K, the CONFLICT count and the RELATED count always report FULL counts
    regardless of the display cap. Widen the field roster HERE first. KNOWN LIMITATION
    (corrected 2026-09-25, PLAN-roadmap-terminal-compaction -- completion_compaction emptied
    T2.56's files_in_scope, so the roadmap now carries exactly one .claude/skills/ entry, T3.19,
    deferred_post_mvp): a skills-only or commands-only Scope list does not unconditionally yield
    K=0 -- it still can, if T3.19's files_in_scope overlaps the Scope table by this projection's
    bidirectional directory-prefix match.

amendment_log:
  - date: "2026-10-10"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-recs-full-cache-retirement (Decision 215): followon_recs_readiness is computed from
      the bounded preflight_signal_rows rows, not the warm-sync ops_recommendations pull, which
      no longer exists. Population rule and field shape unchanged.
  - date: "2026-09-25"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-roadmap-terminal-compaction: corrected the roadmap_alignment_projection
      audit_invariants KNOWN LIMITATION again -- completion_compaction emptied T2.56's
      files_in_scope, so the roadmap now carries exactly one .claude/skills/ entry (T3.19,
      deferred_post_mvp), not "at least two". No field shape or enum changed.
  - date: "2026-09-12"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-skills-layer-prose-relocation (T2.56 c1 skills-layer conjunct): received the
      criterion-level FIELD SEMANTICS half of the implement skill's relocated Tier_item
      bookkeeping walk -- the closes_criteria flip procedure (fields.met_by) and the
      exit-criteria truth-maintenance realized-differently rule (fields.status), each with its
      own field-level amendment_log entry. Also corrected the roadmap_alignment_projection
      audit_invariants KNOWN LIMITATION, now false since T2.56's files_in_scope was re-grounded
      to name the skills layer. No new top-level key (Class A extra="forbid").
  - date: "2026-09-07"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-roadmap-blocking-liveness-detector: corrected blocked_by's semantics -- it no longer
      "carries no runtime consumer beyond the schema validator today". Names
      scripts/platform_roadmap_liveness.py (via scripts/checks/roadmap/
      validate_roadmap_liveness.py) as the field's runtime consumer, closing rec-3395. No field
      shape changed.
  - date: "2026-09-04"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-roadmap-blocking-edge-semantics: added the blocked_by field (per-criterion blocking
      edges, {ref, until, note}), split out of the overloaded gates/depends_on proxy so a
      criterion's blocking relationship is an authored field rather than an inferred side
      effect of depends_on or CandidateDecision.gates. Deliberately excluded from the
      depends_on cycle DFS (see the field's own governance_notes). Also corrected fields.id's
      stale model-home pointer (own amendment_log entry on that field).
  - date: "2026-09-03"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      PLAN-decision-scout-roadmap-projection (PDB-04, remedy B2-R5): added the
      roadmap_alignment_projection audit_invariants entry declaring the reader contract for
      scripts/roadmap/scope_projection.py's field roster. Audit trail only -- inert for the
      drift gate (no field description/semantics changed).
  - date: "2026-09-03"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-orient-followon-adhoc-lane (PDB-01, remedies B1-R4 + B4-O1): added the
      followon_recs_readiness field documenting the /orient ad-hoc lane's preflight-derived
      readiness projection over plan_followon_recs (PlanDocument.followon_recs).
  - date: "2026-10-15"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-rule-declarations-and-writer-conformance (rec-4158, Decision 210): the dq_intent `enforced` key is retired
      from every rule leg. not_null is declared by presence (`true`, or `{exclude_before: D}`); an optional column or a
      loosest-baseline field carries no not_null leg; the other legs lose the key. A declared rule is an enforced rule.
    migration_story: >-
      Declarations re-spelled only. No rule is added, removed or re-dated: the declared rule set, read through
      scripts.contract_rules, is identical before and after, and the generated field_semantics.yaml projection of
      this contract is unchanged.
  - date: "2026-10-20"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-plan-document-edge-fields (rec-4496): added the plan_amends, plan_introduces and plan_principal
      fields documenting PlanDocument.amends, PlanDocument.introduces and PlanDocument.principal.
  - date: "2026-10-20"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-plan-document-edge-fields (rec-3534): contract.description now names every plan-linkage field
      (closes_criteria, followon_recs, followon_recs_readiness, the declared edge fields and the
      roadmap_alignment_projection audit_invariant) instead of closes_criteria alone.
  - date: "2026-10-25"
