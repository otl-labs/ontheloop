# Class D mechanism contract for the full-tier range: what one main-validate run covers once runs are batched, how its
# prev is found, and how consumers read the range (Decision 254 cl.1, cl.2, cl.4). rec-4874's build plans extend this
# file rather than the capped git-ops.yaml and ci-rca-lifecycle.yaml. Rationale lives in Decision 254.
contract:
  id: full-tier-range
  class: D
  contract_version: 1
  status: draft
  description: >-
    The vocabulary and read rules every consumer of a main-validate full-tier run shares: prev, the range, the
    last-green ref, covered, the variables a job passes, the order a consumer reads a range in, and the workflows whose
    reds of one cause are one rec.
  subject: full-tier-range
  evaluator:
    check: validate_full_tier_range

amendment_log:
  - {date: "2026-11-17", semantic_break: false, change_class: field_add, summary: "PLAN-last-green-range-consumers (rec-4874 build plan 2a): first authoring."}

terms:
  full_tier: {workflow: ci.yml, job: main-validate, step: "Validate full tier (ruff, mypy, pytest, DQ runner, verifier harness)"}
  prev: >-
    The nearest first-parent ancestor of a run's head whose main-validate job started its full-tier step and did not
    end timed_out or cancelled; a job still running counts. A run whose full-tier step was skipped (a plans-only push
    that ran the fast tier alone) or never started is passed over. scripts/ci/last_green.py resolve_prev.
  range: The first-parent commits after prev up to and including the head, oldest first.
  last_green_ref: >-
    The newest first-parent main commit whose main-validate run, push or dispatch, passed the full-tier step on any
    attempt (environment-taxonomy.yaml last_green_ref). scripts/ci/last_green.py last_green_sha. The deploy gate keeps
    newest_green_sha (push runs, latest attempt; Decision 249 cl.2) until rec-5108.
  covered: The last-green ref or one of its first-parent ancestors. Coverage once earned is never withdrawn.

variables:
  FULL_TIER_PREV: >-
    Passed to the full-tier step by main-validate's prev step (rec-5107). push_context_base returns it when it resolves
    and is an ancestor of HEAD, else FULL_TIER_LAST_GREEN under the same test, else fails the run; never HEAD~1, and
    validate makes no API call. While it is unset, push_context_base keeps GITHUB_EVENT_BEFORE, then HEAD~1 (Decision
    159 cl.1).
  FULL_TIER_LAST_GREEN: Passed beside FULL_TIER_PREV by the same step; read only when FULL_TIER_PREV does not qualify.
  CI_RCA_RANGE_PREV: >-
    Set by ci-rca's range step for its evidence step. vacuous_pass diffs CI_RCA_RANGE_PREV..HEAD; set but empty (an
    unresolved range) it returns undetermined, never a HEAD^ diff; unset it diffs HEAD^..HEAD.

read_order: >-
  A consumer of a CI run's range reads, in order: the range the run recorded (rec-5107 adds the record); else
  resolve_prev(head); a prev that does not resolve or is not an ancestor of the head widens to the last-green ref; if
  neither resolves, the range is the head alone with range_status unresolved, and ci-rca still files. Other watched
  workflows anchor on their run's head as before. scripts/ci_rca/range_context.py.

ci_rca:
  prs: One pull request per range commit; the agent's prompt names the range and its pull requests.
  escape_attribution: >-
    The selection manifest stays the head commit's pull request until rec-5107's culprit job names a culprit (Decision
    142 cl.5, Decision 186).
  commit_status_dedup: Keyed on the run's head, as before.
  full_tier_siblings:
    slugs: [ci, main_canary]
    rule: >-
      Workflows that run the same full tier. A failure whose v2 fingerprint, recomputed for any sibling slug, matches
      an open rec is that rec's recurrence: the fingerprint lookup, the closed-head check and the write-time backstop
      all match on the sibling set. The fingerprint itself is unchanged (Decision 142 cl.1).

dormant_until_rec_5107: >-
  No job passes FULL_TIER_PREV or records a range until rec-5107, so until then Decision 254 cl.4's main-validate leg
  is not live and a CI run's range comes from resolve_prev.
