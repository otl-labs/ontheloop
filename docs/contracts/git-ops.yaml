branching_topology:
  containers:
    - name: DEV
      note: primary, this one
      aws_profiles: ["agent_platform"]
      use: All routine work on CC-web
    - name: ADMIN
      note: rarely used
      aws_profiles: ["agent_platform", "agent_platform_admin"]
      use: >-
        Advanced terraform IAM; ties to the human-gated apply loop (Decision 35 / CD.35 /
        Decision 77). Also human-directed operator maintenance actions -- the ducklake
        partition-layout verbs (Decision 204) and the telemetry scoped-login provisioning (Decision
        213 cl.5) -- under explicit human direction, never self-directed.
  development_surface: >-
    Claude Code on the web (CC-web) only. Executor frozen (Decision 67); hybrid executor + CC-web
    is the future state.
  branch_rule: >-
    Work on the harness-assigned session branch (see agent_branch_prefixes below for the declared
    set) -- agents never create their own branch, and never commit directly to `main`.
  agent_branch_prefixes: ["agent/", "claude/", "ccr-"]
  agent_branch_prefixes_rationale: >-
    PLAN-conflict-wake-prefix-realignment / Decision 191 discharge: prefix matching is retained as
    the wake-consumer discriminator because it is the only one the producer stamps today -- the PR
    author is the operator for every PR including harness-created ones, the harness applies no
    labels, and the base is always main. This declared set (consumed structurally by
    scripts/ci/pr_conflict_signal.sh's _WAKE_HEAD_PREFIXES/_WAKE_HEAD_PREFIXES_TRANSITIONAL, and by
    .github/workflows/ci.yml's signal-green head_ref predicate, and the Decision 203 handoff gate's
    destination rule in scripts/session/handoff_evidence.py, read from origin/main) plus a per-run unmatched-population
    tally is the substitute for an enumerated universe; the tally is what would have caught the
    outage that motivated this declaration on the first push after a harness prefix rename.
  agent_branch_prefixes_reversal: >-
    `agent/` is also the frozen executor's namespace (scripts/executor/branch_lifecycle.py creates
    `agent/{rec_id}`). On executor unfreeze a prefix can no longer separate the two populations;
    the migration at that point is repo-owned self-registration (a wake label or body token
    applied at PR creation via mcp__github__create_pull_request), which is immune to harness
    churn. Review trigger: the FIRST of (a) executor unfreeze, (b) any second measured miss of the
    prefix discriminator, or (c) the next change that would add a third consumer of this fact.
    2026-10-11 review: (b) and (c) have both fired. (b): the harness renamed session branches to
    ccr-<8hex>-<6alnum>, the second measured miss of the prefix discriminator, first measured
    2026-10-06 on ccr-43776a06-et0u4a (rec-4193) and re-measured 2026-10-10 (rec-4257). (c): it
    fired on 2026-09-26 when the Decision 203 handoff gate became the third structural consumer.
    Both were resolved at operator direction by extending the declared set with ccr-; the
    self-registration migration is owned by rec-4266. Re-armed: (b) as any further measured miss,
    (c) as the next change that would add a fourth consumer.

two_tier_presubmit_model:
  description: >-
    Google TAP style. AGENTS.md keeps the Full row of this table ambient verbatim (pinned by a
    graduated registry entry and a standing test); this restates both rows' full detail.
  fast:
    tier: "Fast (`--pre`)"
    when: PR / edit loop
    command: bin/venv-python -m scripts.validate --pre
    gate: >-
      Authoritative pre-merge gate when run by PR CI (Decision 73); advisory only when run
      outside CI.
  full:
    tier: Full
    when: "Pre-handoff (local) + post-merge on `main`"
    command: bin/venv-python -m scripts.validate
    gate: "See AGENTS.md's Merge protocol section (post-merge disposition)."
  single_source_of_truth: >-
    `scripts/validate.py` is the single source of truth -- never add a check to
    `.github/workflows/ci.yml` without adding it to `validate.py` first.
  full_tier_checkout_depth: >-
    A dated correction on Decision 159 clause 1 (D177 post-lock dialect -- mints no new Decision
    number, Decision 167 routing): every full-tier job the
    scripts.verify_ci_workflow fetch-depth guard reaches -- today ci.yml's main-validate and
    main-canary.yml's single job -- checks out fetch-depth 0 (full history), so
    history-dependent tests (e.g. the fast-tier corpus harness, scripts/checks/deps/) never
    starve on a bounded depth. Scoped to the jobs the guard reaches, not stated as a repo-wide
    invariant (Decision 163); subsumes the retired main-validate == 2 pin outright.

commit_message_conventions:
  prefixes:
    - prefix: "feat({slug}):"
      use_for: IMPLEMENTATION plan execution
    - prefix: "plan({slug}):"
      use_for: Plan document commit / approved plan
    - prefix: "roadmap({ids}):"
      use_for: Roadmap bookkeeping edits
    - prefix: "scope({slug}):"
      use_for: STRATEGIC plan scoping (currently suspended, Decision 67)
    - prefix: "audit({slug}):"
      use_for: Audit-prompt artifact commits (/audit workflow)
  change_record_content_rule: >-
    What changed, why now, acute state, and measurements belong in the squash-commit or PR body
    -- never in a Decision entry body. Whether content clears the bar for a numbered Decision at
    all, and where it routes when it does not, is governed by `docs/contracts/decision-entry.yaml`'s
    `significance.routing_rule` and its four routing rows (Decision 167 clause 4); this file
    points at that rule rather than restating it.
  dd_b_convention: >-
    When a drafted Decision is blocked on routing grounds -- redirected to one of
    `decision-entry.yaml`'s other three routing rows instead of `numbered_decision` -- the
    superseding PR body names the routing row applied in one line (e.g. "Routing:
    field_semantics -> docs/contracts/<file>.yaml").

commit_signing_note: >-
  AGENTS.md's '### Commit signing (CC-web: SSH-signed via harness signer)' subsection stays
  ambient verbatim (pinned: its heading is mirrored in terraform/github/repo.tf by the graduated
  check cc-web-signing-premise-corrected) -- not restated here. Covers: SSH signing via the
  harness-held key, why local `git log --format=%G?` reads N/B, `session_start_commit_signing.py`'s
  role, and why reset-author / amend -S must never be used to chase the signature flag.

handoff_sequence:
  description: >-
    PLAN-handoff-validates-committed-tree (a dated Update on Decision 163 point 3): the
    pre-handoff full tier now validates the COMMITTED tree that ships, never an uncommitted
    working tree. Per-push order: commit (a no-op when `git status --porcelain` is already
    empty) -> fetch + rebase onto origin/main per rebase_phase_distinction.commit_flow_time (now
    BEFORE the full tier, not after) -> the full tier on the resulting clean tree ->
    `bin/venv-python -m scripts.checks.validation_result --verify-head` -> push, as its own tool
    call. Cost basis is now per push (every rebase or fix commit needs a fresh full-tier run),
    NOT extended to the automated executor (Decision 163 point 3).
  evidence_schema_v4: >-
    logs/debug/validation-result.json schema_version 4 adds head_tree_at_start/end,
    tree_clean_at_start/end and worktree_toplevel (scripts/checks/validation_result.py), anchored
    at the invoking worktree. "Clean" is `git status --porcelain` empty (.gitignore respected) --
    this attests ORDERING and DRIFT, never gitignored-input identity.
  attests_head: >-
    scripts.checks.validation_result.attests_head (rule vocabulary: its module-level
    ATTEST_RULES) is the sole predicate: true only for scope "all", exit_code 0, empty
    failed_checks, both clean flags true, head_tree_at_start == head_tree_at_end == the checked
    HEAD's tree, and worktree_toplevel == the checking worktree.
  enforcement_coverage:
    - surface: "postflight --auto push"
      status: mechanical
      enforced_by: "tests/session/postflight/test_auto.py::TestAutoMode::test_auto_commits_before_full_tier_and_pushes_only_after_pass"
      note: >-
        The --auto remote leg is gh-CLI-based and dormant on CC-web; its non-fast-forward push
        after a rewriting rebase is owned by rec-4092.
    - {surface: "interactive /implement push", status: mechanical, enforced_by: "tests/test_session_handoff_evidence.py::TestPushDecision::test_denies_evidence_for_a_different_tree, tests/hooks/test_handoff_evidence_gate.py::test_git_push_denied_without_matching_evidence"}
    - {surface: "MCP create_pull_request / push_files / create_or_update_file / delete_file", status: mechanical, enforced_by: "tests/test_session_handoff_evidence.py::TestPrResolution, tests/test_session_handoff_evidence.py::TestRemoteWrites"}
    - {surface: "non-canonical push-shaped Bash and Monitor commands", status: mechanical, enforced_by: "tests/test_session_handoff_push_parse.py::TestPushShaped::test_push_shaped_classifier_catches_wrapper_and_newline_forms"}
    - {surface: "a push or remote write to main or outside the destination prefixes", status: mechanical, enforced_by: "tests/test_session_handoff_evidence.py::TestDestination::test_main_and_non_agent_destinations_denied"}
    - {surface: "a validated-but-red tree, including a check-level timeout", status: residual_agent_obligation, residual_owner: rec-4087}
    - {surface: "server-side merge on red", status: residual_agent_obligation, residual_owner: rec-4080}
    - {surface: "per-file coverage floor in PR CI", status: residual_agent_obligation, residual_owner: rec-3221}
    - {surface: "everything the harness cannot see or the evidence cannot prove", status: residual_agent_obligation, residual_owner: rec-4085, note: "see rec-4085 and handoff_push_parse's docstring"}
    - {surface: "deletes of non-agent branches", status: residual, residual_owner: rec-4085, note: human-only}
    - {surface: "GitHub Actions-hosted sessions", status: residual, residual_owner: rec-4086}

rebase_phase_distinction:
  assessment_time: >-
    (planning) do NOT auto-rebase. When main has diverged and scope files overlap, surface to the human with options (rebase now and re-enter `/plan` / proceed / abort); record any deferral in the plan's Context field. Rebasing mid-plan can silently invalidate scoping decisions.

    Main Divergence Assessment detection (relocated from the planning skill, PLAN-skills-layer-prose-relocation): after Scope is identified, intersect the prospective Scope file list with `main_freshness.main_files_changed_since_branch` from the preflight report. If any Scope file appears in that list, surface: "Main has changed [list of overlapping files] since this branch diverged. Planning against the stale branch view risks decisions that conflict with what is already on main (e.g., a Decision Record you cite has been amended, a tier_item you target has been retired). Recommend rebasing BEFORE writing the plan: `git fetch origin main && git rebase origin/main`. Options: (1) rebase now and re-enter `/plan`, (2) proceed and accept the risk, (3) abort." This is the assessment-time rule -- do NOT auto-rebase here (see above); auto-rebase happens only at commit_flow_time (below). If the human chooses (2), record the deferral as a line in the plan's Context section: "Branch was N commits behind main at planning time; overlapping files: [list]. Rebase deferred per human decision." If `main_freshness.status != "ok"`, this assessment cannot run -- note in the plan's Context section and continue.
  commit_flow_time: >-
    (implementing) DO auto-rebase before pushing. After the local commit: `git fetch origin main && bin/venv-python -m scripts.session.rebase_resolve` -- it rebases and resolves only the
    mechanical_conflict_classes below; STOP on any other conflict and surface it to the human. The rebase now precedes
    the full tier (handoff_sequence above), not the push directly -- the full tier and
    --verify-head run on the resulting clean tree before push. If the branch was already pushed,
    use `--force-with-lease` (never `--force`).

mechanical_conflict_classes: >-
  Decision 217 clause 2 (rec-4323): docs/contracts/mechanical-conflicts.yaml declares the conflict
  classes scripts.session.rebase_resolve resolves without a human -- derived files by regeneration,
  rosters by union, the Decision-numbering race by renumbering -- under the unchanged full tier.

local_main_sync: >-
  `session_start_sync_main.sh` syncs local main -> origin/main. `fresh_branch_base.py`
  refreshes/blocks branch cuts off stale main. origin/main is itself a cache (Decision 84); no
  signing hook, rebase is safe.

push_pr_ci_merge_flow:
  steps:
    - >-
      The full tier + `--verify-head` (handoff_sequence above) on the committed, rebased tree,
      then `git push -u origin HEAD` (harness-assigned branch; see
      branching_topology.agent_branch_prefixes).
    - >-
      mcp__github__create_pull_request(owner, repo, head=<branch>, base="main", title=<per the
      commit-message-conventions table above>, body=...).
    - >-
      mcp__github__subscribe_pr_activity(owner, repo, pullNumber) and end your turn -- do NOT
      busy-wait with sleep or polling; the harness forbids it.
    - >-
      On green confirmation: mcp__github__merge_pull_request(..., merge_method="squash") then
      mcp__github__unsubscribe_pr_activity(...). An IMPLEMENTATION merge first runs `scripts.session.merge_step
      premerge` on the squash message, merges with commit_message=<that message> and expectedHeadSha=<the head
      premerge checked>, then runs `scripts.session.merge_step readback` on the merge sha.
    - >-
      On red: diagnose, fix, re-run the full tier + --verify-head, then push again (re-triggers
      CI). Stay subscribed. End your turn.
  wake_signals:
    coverage_note: >-
      Two comment-based signals cover what subscribe_pr_activity cannot deliver natively -- CI
      success, and a merge-conflict transition from a push to main. send_later/trigger calls for
      CI-wait or merge-conflict-wait purposes are out of scope -- both gaps are closed by the two
      signals below, not by polling.
    ci_green_comment: >-
      ci.yml's signal-green job posts a "CI green" comment on PRs whose head ref matches a
      declared branch prefix (branching_topology.agent_branch_prefixes) on success
      (continue-on-error, retried up to 3 times). This exists because subscribe_pr_activity
      delivers failure events but NOT a CI-success webhook, and CC-web has no sleep/idle tool.
      Ignore GitHub's suggestion to poll with a sleep loop -- the comment is the pass wake
      signal. Unverified: confirm check runs via mcp__github__pull_request_read (get_status /
      get_check_runs) before merging.
    merge_conflict: >-
      .github/workflows/pr-conflict-signal.yml fires on every push to main, polls the
      mergeability of every open PR whose head ref matches a declared branch prefix
      (branching_topology.agent_branch_prefixes), and posts a wake comment (idempotent per head
      SHA, continue-on-error) on any PR now CONFLICTING. This exists because a push to main fires
      NO pull_request event on open PRs, so the pull_request-only signal-green job cannot deliver
      this wake -- a silently-conflicted PR would otherwise strand the watching session
      indefinitely. 2026-09-15 conflict-wake-probe (rec-3874, n=1): a live PR-activity
      subscription held across ~16 minutes of a blocked -> dirty mergeability transition with the
      control holding, and no native wake was observed for that transition (the harness documents
      its own notice as best-effort) -- confirming this sweep is the only reliable conflict path
      and must be retained.
    cc_web_permission_gotcha: >-
      Harness-gated tools, do NOT allowlist: the send_later / trigger tools
      (mcp__Claude_Code_Remote__*) prompt on EVERY call -- the CC-web dialog offers only Deny /
      Allow once, with no "don't ask again". They are gated by the harness, NOT by the settings
      allowlist: a permissions.allow entry for them is dead (an ask-tier rule outranks allow, and
      CC-web ignores bypassPermissions / dontAsk from settings files). Do NOT re-add
      mcp__Claude_Code_Remote__* (any spelling) to .claude/settings.json to silence them -- PRs
      #354 and #357 tried and could not. The only lever is the per-session UI permission-mode
      dropdown (Auto mode, if org-enabled); there is no committed-config fix.
    auto_merge_relationship: >-
      Auto-merge (enable_pr_auto_merge; Decision 83 / CD.20 / rec-940) retires the CI-green
      comment-wake once adopted, but does NOT subsume the merge-conflict wake -- a conflicted PR
      simply stalls auto-merge and wakes no one, so pr-conflict-signal.yml stays necessary even
      after auto-merge lands.
  terraform_personal_note: >-
    For terraform/personal PRs, see the "Hold subscription through apply" section of the
    implement skill (Decision 76 / CD.35 / T2.20).

resolves_trailer: >-
  When a plan's `bundled_recommendations` list is non-empty, the squash-merge commit body carries "Resolves:
  rec-NNNN[, rec-MMMM]". It triggers `.github/workflows/ci.yml`'s trailer-census / trailer-acceptance-evaluate /
  trailer-closure jobs (Decision 201), which close each named rec via the ops portal. CARRIER (rec-3901): the trailer
  belongs only on the IMPLEMENTATION merge -- the one whose diff carries the code the plan's recs claim is resolved; a
  plan-only merge carries no trailer. PLACEMENT (rec-2922): the trailer must sit in a block whose every line is
  `Key: value`-shaped (never mid-paragraph), and it may precede the mandated `Co-Authored-By:` / `Claude-Session:`
  footer; the space after the colon is REQUIRED (`Resolves:rec-NNNN` does not parse). Both rules are enforced by
  `validate_rec_autoclose_trailer_gate`. TRANSPORT (rec-2733, rec-3856, rec-4244): GitHub's default squash body is the
  branch's commit messages, not the PR body, so the implementation puts the trailer in a commit message on the branch
  (`validate_merge_step` fails a PR declaring a plan with bundled recs unless its branch commits' trailers name exactly
  those recs), and `merge_pull_request` is passed an explicit `commit_message` carrying it and the `expectedHeadSha`
  that `scripts.session.merge_step premerge` checked. premerge checks that the message parses to the plan's recs, that
  each approved-text block still anchors exactly once on main, and previews each rec's acceptance at the PR head
  (Decision 201's census and sandboxed probe; it writes nothing, and a red line blocks the merge); after the merge,
  `scripts.session.merge_step readback` confirms the trailer in the merge commit against the plan as merged. A merge
  whose diff is confined to `docs/plans/` (or is empty/unresolvable) is REFUSED by the merge-leg gate
  (scripts/ops_portal/trailer_closure_gate.py::merge_leg_refuses) and every named rec stays OPEN. FALLBACK IS
  CONDITIONAL (Decision 201): `bin/venv-python -m scripts.ops_data_portal --update-rec rec-NNNN --status closed
  --resolution "..."` is sanctioned ONLY after a transport failure or a merge-leg refusal; it supplies no verdict
  record. A trailer that readback finds missing goes to
  `scripts.session.merge_step recover` instead: at the merge sha it runs the census and the sandboxed evaluate and
  closes only that plan's missing recs, only with a verdict record; a junit-routed rec it never re-executes (Decision
  201 source_admission) and leaves open for the operator's decision. After an acceptance-verdict refusal (`trailer_acceptance_gate` below) any manual close is FORBIDDEN; the route is a
  fix-forward PR whose trailer names the rec or, when the acceptance itself is wrong or out of grammar, strengthening
  it with `update_rec` (never weakening it, Decision 181 clause 1; a weakening needs the operator's word, Decision
  235), confirming it holds at the merge sha with `scripts.rec_trailer_acceptance` census and evaluate, then
  re-running the merge commit's ci.yml push run (or `recover`, for a rec it handled) so the gate re-decides
  (rec-4443).

approved_text_binding: >-
  Operator-approved exact text for a plan lives in `docs/plans/approved/<slug>.yaml` (schema, placeholders and
  normalisation: scripts/roadmap/approved_text.py). Each block quotes the unique existing text it replaces (`before`)
  and its approved replacement (`after`); a placeholder (a number or a date) is the only allowed variance and must be
  filled. `validate_merge_step` reads the sidecar from the diff base, fails a PR that declares the plan while adding,
  changing or deleting it, and fails when any bound file's words at HEAD differ from its base words with the blocks
  applied (whitespace and line wrapping ignored; a YAML file must still parse). `scripts.roadmap.approved_text record`
  prints the digest the operator approves; the approving message id stays outside the repository. That the committed
  sidecar is the text the operator approved is procedural (the digest is compared outside the repository); rec-4769
  owns that residual (Decision 181 clause 2).

merge_step_coverage: >-
  Decision 181 clause 2 coverage: for the plan whose `implementation_declared` flips in a PR, the branch-commit trailer
  and the approved-text binding are mechanical (`validate_merge_step`, PR fast tier). The explicit commit_message and
  expectedHeadSha, premerge and readback are procedural (push_pr_ci_merge_flow and implement skill Commit Flow step 4,
  for every agent that merges, /overseer included), and a trailer on a PR that declares no plan (red-main-recovery
  fast_lane_repair, a remediation evidence PR) has no mechanical leg. recover runs the census,
  the sandboxed evaluate and the close in one operator session (outside Decision 143's CI credential split) and has no
  verdict-bound route for a junit-routed rec. These residuals are owned by rec-4755 (a merge-time gate on
  merge_pull_request, which prevents the lost trailer recover handles).

trailer_acceptance_gate:
  description: >-
    Decision 201: a closure-time acceptance-verdict precondition, asserted at
    `scripts.ops_data_portal::update_rec` beside the Decision 186 closure obligation
    (`scripts/ops_portal/closure_gate.py::assert_acceptance_verdict`). VOCABULARY: `{holds, fails,
    unmeasurable, out_of_grammar}` (`closure_gate.py::ACCEPTANCE_VERDICTS`) -- a SEPARATE axis from
    `docs/contracts/vp-red-before.yaml`'s `OUTCOME_CLASSES` (inverted polarity; intersection is
    exactly `unmeasurable`), classifying whether a rec's own acceptance oracle holds at the closing
    commit, never whether a VP step correctly failed before a fix existed. VERDICT RECORD FIELDS:
    `{rec_id, sha, acceptance_sha256, verdict, source, arm}`, produced by
    `scripts.rec_trailer_acceptance.evaluate` / `scripts.rec_trailer_acceptance_junit.junit_verdict`
    and rejoined (`scripts.rec_trailer_acceptance.rejoin`, mirroring
    `scripts.backlog_health.escalate.rejoin_probe_verdicts`) against the census's own entries on
    `rec_id` + `acceptance_sha256` before either reaches `update_rec`. REFUSAL SEMANTICS: the
    predicate raises `AcceptanceVerdictRefused` iff a record IS supplied and its verdict is not
    `holds`, or it is mis-keyed against the rec id, its current acceptance's sha256, or the closing
    sha; refusal is LOUD, NOT RED (`.github/workflows/ci.yml`'s trailer-closure job catches it,
    prints a distinct per-rec marker, leaves the rec OPEN, and exits 0). STRUCTURAL BINDING
    (Decision 163): the trailer-closure job passes `require_acceptance_verdict=True` to
    `close_recs_from_trailer`, so a trailer-named rec with NO verdict record is never passed to
    `update_rec` at all -- the predicate's own non-universality (an absent record is not itself
    refused) cannot be exploited on this path. TWO DECLARED RESIDUALS (Decision 181 clause 2): (i)
    non-trailer callers of `update_rec` fail open on this gate -- owned by rec-3999, which also
    names this clause's two live non-trailer instruction surfaces:
    `.claude/commands/orient.md`'s LIKELY-RESOLVED soft prompt, and
    `docs/contracts/ci-rca-lifecycle.yaml::closure_dependency.manual_route`; (ii) the
    `require_decidable` grammar ratchet is unenforced at the write boundary
    (`scripts/ops_portal/write_validators.py`) and in
    `scripts/checks/ops_governance/validate_acceptance_literals.py` -- owned by rec-4001.
  sources:
    static: >-
      `scripts.rec_trailer_acceptance.evaluate`, delegating to
      `scripts.backlog_health.probe.run_all`'s sandboxed re-execution (Decision 201 slice A).
      Claims every census entry whose route is NOT `junit` -- every non-`probeable` bucket, plus
      every `probeable` entry whose acceptance is not a pure single-segment `::node_id` command.
      Unchanged by slice B.
    junit: >-
      `scripts.rec_trailer_acceptance_junit.junit_verdict` (Decision 201 slice B), reading a
      verdict for a node id straight from the SAME push run's own authoritative pytest-junit
      report rather than re-running it. Claims exactly the census entries whose route is `junit`
      (a pure, parseable, single top-level segment naming one or more pytest `::node_id`
      targets). Admits ONLY on positive evidence -- a report entry present for the named node
      with no failure/error/skip; everything else (failed, errored, skipped, absent, or the
      report itself unavailable) resolves to `fails` or `unmeasurable`, never `holds`.
  source_admission: >-
    THE TAP RULE: no verdict source may execute a command whose outcome an authoritative record
    already carries -- what makes the junit route a RETRIEVAL of the rec's own oracle rather than
    a substitute for it, keeping Decision 103's "the deterministic probe is the rec's existing
    acceptance oracle" satisfied. Precisely: CI runs the node under
    `pytest tests/ -m "not integration" -n auto --timeout 120 --randomly-seed=<fixed> --cov=src
    --disable-socket`, with `tests/` as the sole root, while the rec's own acceptance is a bare
    `pytest <node>` -- the junit record is the outcome of running THE SAME NODE under a
    DIFFERENT FLAG SET, not a byte-identical re-execution of the rec's own argv (narrower than
    identity, and strictly more faithful to Decision 103 than the sandboxed probe, which diverges
    on the same axes AND adds `unshare -rmn`, no network, no credentials).

    The routing partition that decides which source claims a rec is a STATIC, three-arm
    classification of the acceptance TEXT ALONE (`scripts.rec_trailer_acceptance_junit.
    classify_grammar`) -- it reads no report, resolves nothing on disk, executes nothing, and
    therefore cannot fail open. Gating is on the command's GRAMMAR, never on whether the junit
    report exists: gating on report existence would make a missing artifact silently fall back to
    the probe, the absence-of-evidence shape this gate removed from slice A. Every shape lands in
    a NAMED arm carrying its own reason and declared route; an unrecognised shape falls to the
    `no_node_id` residual, routed to the probe path (slice A's existing behaviour, no regression),
    never through a silent absence (Decision 191 spirit). The declared arms:
      single_node_chain: {route: junit, reason: "a pure single-segment command naming one or more pytest ::node_id targets"}
      unparseable: {route: refuse, reason: "the command could not be tokenized (unbalanced quote or trailing backslash); a command whose segments cannot be enumerated must never reach an executor"}
      mixed_conjunction: {route: static, reason: "a multi-segment &&-only chain stays on the probe path; junit cannot attribute a chain's outcome to one segment"}
      mixed_other_operator: {route: static, reason: "a chain joined by || / | / ; stays on the probe path, unchanged"}
      negated_segment: {route: static, reason: "a negated segment stays on the probe path; junit has no negation semantics"}
      selector_flag: {route: static, reason: "a -k/-m/--deselect selector's selection cannot be keyed against the junit report"}
      no_node_id: {route: static, reason: "no pytest ::node_id target found in the segment; the residual default, stays on the probe path unchanged"}
    The parse-failure arm (`unparseable`) is deliberately fail-CLOSED where the residual default
    is not: an unrecognised-but-parseable shape is merely outside junit's competence, while an
    unparseable one is a command whose segments cannot be enumerated at all. Concrete divergence
    from slice A's own grammar check (`bash -n`): `pytest tests/x.py \` (trailing backslash) gives
    `bash -n` rc=0 (slice A ADMITS it as probeable), while `shlex.split` raises -- this arm catches
    exactly that class, in the fail-closed direction.

    PRECEDENCE: slice A's `lint_acceptance_command(require_decidable=True)` refusal WINS over this
    partition -- an entry it refuses is `out_of_grammar` regardless of what this partition's route
    would have been, computed before routing ever runs. Benign today (0 of the population is both
    lint-refused and junit-eligible), but load-bearing should that ever change. The census's own
    shape buckets (`scripts.backlog_health.census.classify_command`) also precede routing, with
    one exception: its `_MAX_SHAPE_LEN` length cap is not applied to a command this partition
    routes to `junit`, because the cap guards the probe's execution surface and a junit-routed
    command is never executed (rec-4384). A long multi-node `pytest <node ids>` list is decided
    from the report rather than resolving `out_of_grammar` for its length.

    PROVENANCE is STRUCTURAL, not content-keyed: a junit report carries no `sha`, so same-run
    binding is enforced by the artifact download step itself declaring no `run-id` input (the
    report can only be the current push run's, whose `head_sha` is the merge commit slice A's
    predicate already compares against) -- asserted by the registered evaluator
    (`validate_rec_autoclose_trailer_gate`), never by a content check on the report.
  rejoin_disjointness: >-
    `scripts.rec_trailer_acceptance.rejoin` REFUSES (raises) when a rec_id carries a clean record
    in BOTH the static and junit verdict documents -- two sources for one rec is the TAP hazard at
    the transport layer, and a routing defect must fail the closure rather than silently electing
    a winner. A junit verdict DOCUMENT that is entirely absent (as opposed to present-but-empty)
    is likewise a declared, distinct case: every census entry routed to `junit` resolves to a
    synthetic `report_unavailable` / `unmeasurable` record rather than carrying no verdict at all
    -- an absent document and an empty one are never indistinguishable.
  declared_residual: >-
    Decision 181 clause 2: 153 of the 468 pytest-carrying acceptances (66 mixed &&-only, 8 mixed
    with another operator, 8 negated, 73 bare-`pytest <path>`) stay on slice A's probe path and are
    therefore re-executed even though the same run's junit report already carries their pytest
    legs' outcome -- redundant execution, and two independently-computed verdicts for the node ids
    a junit-routed and a probe-routed rec both happen to name, NOT a refusal and NOT a closability
    gap: those 153 close exactly as they would under slice A alone. Owned by rec-4002, re-scoped to
    exactly this residue.

merge_protocol_note: >-
  AGENTS.md's '## Merge protocol' heading and its two ci-rca bullets (post-merge full-tier
  failure; PR-branch --pre failure) stay ambient verbatim -- pinned by
  tests/test_pr_ci_red_protocol_contract.py and the graduated registry entries
  agents-md-contradiction-resolved / agents-md-pr-branch-disposition-stated. Not restated here;
  AGENTS.md's '## Git-ops procedure' read-trigger is its pointer to this contract.

handoff_evidence_gate:
  description: >-
    Decision 203: a fail-closed PreToolUse harness hook refuses any non-exempt agent push or
    GitHub remote write unless schema-4 evidence (scripts.checks.validation_result) proves the
    pushed tree was validated from that worktree. IDENTITY gate, not a verdict gate: a
    validated-but-red tree passes with a warning. No agent override of any kind.
  exempt_path_globs: ["docs/plans/*", "docs/audit-prompts/*", "audits/*", "docs/ROADMAP-PLATFORM.yaml"]
  never_exempt_paths: [docs/contracts/git-ops.yaml, .claude/settings.json, .claude/settings.local.json, .claude/hooks/handoff_evidence_gate.py, .claude/hooks/handoff_evidence_gate.sh, scripts/session/handoff_evidence.py, scripts/session/handoff_push_parse.py, scripts/checks/validation_result.py]
  extra_destination_prefixes: ["audit/"]
  base_ref_read_rule: >-
    The exempt set and agent_branch_prefixes are read from `git show origin/main:...`, never the
    working tree; every unknown (no origin/main, unreadable clause, failed merge-base) means no
    exemptions and no extra prefixes -- fail closed.
  canonical_forms_and_destination: >-
    Only the canonical forms scripts/session/handoff_push_parse.py admits are evaluated (bare
    push, single agent-branch delete, dry run, option-order-insensitive literals); destination is
    always agent_branch_prefixes plus extra_destination_prefixes, never main or master.
  outcome_map: "ok -> pass; failed_run -> pass with a warning; every other rule -> deny."
  no_agent_override: "No env var, flag or marker lets an agent skip this gate (Decision 163 point 1)."

oauth_token_provisioning:
  description: >-
    Claude Code OAuth token (CI + scheduled agents) -- relocated from AGENTS.md's '## Operational
    runbooks' (rec-2984): a REFERENCE PROCEDURE, not a universal rule an agent needs on every
    turn.
  setup_one_time_from_cc_web_terminal:
    - "claude setup-token"
    - "# Copy the printed token -- it uses your Max plan subscription (no API billing)"
  github_secret_entry: >-
    In GitHub: repo -> Settings -> Secrets and variables -> Actions -> Repository secrets -> New
    secret. Name: CLAUDE_CODE_OAUTH_TOKEN. Paste the token. Rotation procedure and expiry
    tracking live in `.github/workflows/ghas-probe.yml`'s header.
  handling: Do not share this token or commit it to any file in the repository.
