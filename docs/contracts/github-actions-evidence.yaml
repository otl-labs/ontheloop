  artifact: selection-manifest
  retention_class: ordinary_ci
- workflow: .github/workflows/ci.yml
  job: main-validate
  step: Upload pytest junit report (v2 fingerprint substrate)
  artifact: pytest-junit
  retention_class: ordinary_ci
- workflow: .github/workflows/main-canary.yml
  job: canary
  step: Upload pytest junit report (v2 fingerprint substrate)
  artifact: pytest-junit
  retention_class: ordinary_ci
- workflow: .github/workflows/ci.yml
  job: main-validate
  step: Upload validation-result evidence (CI-RCA attribution substrate)
  artifact: validation-result
  retention_class: ordinary_ci
- workflow: .github/workflows/main-canary.yml
  job: canary
  step: Upload validation-result evidence (CI-RCA attribution substrate)
  artifact: validation-result
  retention_class: ordinary_ci
- workflow: .github/workflows/reconcile.yml
