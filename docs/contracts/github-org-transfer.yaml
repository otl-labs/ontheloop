    change_class: correction
    summary: >-
      PLAN-github-transfer-credential-prestage (rec-4537, with rec-4535): credential rows re-scoped
      from live probes and re-pointed off closed recs. Operator rule (2026-10-21): what is minted for
      the transfer is broad and listed in transfer_credentials (new) for clean-up. The GitHub MCP
