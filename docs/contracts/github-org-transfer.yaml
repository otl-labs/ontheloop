planned_evaluator: >-
    validate_github_org_transfer (rec-3902) enforces invariant (1): local.github_repos in
    terraform/personal/oidc.tf and terraform/bootstrap/github_ci_apply.tf are identical, every
    entry is OWNER@OWNER-ID/REPO@REPO-ID with one shared repository id, and the entries' owner and
    repository names equal, exact match, the trusted_segments of the phase whose exit_sets_phase
    equals identity.staged_phase when it is set, else identity.phase. staged_phase may only name
    the phase value immediately after identity.phase; the PR that stages a trust change ahead of
    its phase sets it, and the PR that flips identity.phase clears it. Names are matched, not the
    owner id, because the target id lives only in the two lists. Still planned, invariant (2):
    every other breakage_map row with detection: static matches its per-phase expected literal
    state, enforced by a check its owning plan (rec-3903, rec-4355) lands or extends; this check
    names each such row with its owning rec and fails on any static row it neither evaluates nor
    names. For rec-3903's rows (dependabot_repository_guard, owner_literal_defaults, codeowners,
    descriptive_literals) this check's row evaluators enforce it: outside historical records and the
    files of static rows owned by other recs, every tracked file naming the retired identity (the
    old full name, a quoted old owner, or a quoted old repository name bound to a repository
    identifier) is pinned to one of those rows or to a named permanent survivor, and a pin with no
    match fails; from pre_staged on, the dependabot gate accepts the target full name; at
    predecessor_removed no pin cites those rows. codeowners carries no repository literal: the
    person is retained (rec-3903). terraform_github_root stays pending for rec-4355. The old-slug
    pins in scripts/checks/hygiene/validate_licence_consistency.py guard the earlier rename only.

identity:
  current:
    owner: benjamin-blake
    owner_kind: personal_account
    repository: theseus
    trust_segment_ref: "terraform/personal/oidc.tf local.github_repos (the benjamin-blake entry)"
  target:
    owner: otl-labs
    owner_kind: organisation
    owner_numeric_id: >-
      Read by the operator from the GitHub API during the pre_stage phase and written only into
      the two local.github_repos lists, never here (GitHub numeric ids are public API values;
      Decision 172 precedent).
    repository: ontheloop
    decided_by: "Decision 218"
  durable: >-
    The repository numeric id survives transfer and rename; the OWNER half (login and numeric id)
    changes at transfer and the REPO name half changes at rename (Decision 172; GitHub mints the
    immutable subject repo:OWNER@OWNER-ID/REPO@REPO-ID for any repository renamed or transferred
    after 2026-07-15). Transfer and rename are ONE operation, so exactly one new segment is staged.
  phase: transferred
  phase_values: [pre_transfer, pre_staged, transferred, proven, predecessor_removed]

plan_tier:
  current: "GitHub Free for organisations"
  suffices_while: public repository
  why: >-
    Environment protection rules (required reviewers, the sole authorisation boundary of
    tf-gated-apply) and unmetered standard-runner Actions minutes are public-repository features on
    Free, Pro and Team.
  private_repo_consequence: >-
    The moment a PRIVATE repository needs required reviewers on an environment, the organisation
    needs GitHub Enterprise; Team adds private environments and secrets but not required reviewers.
  pages: GitHub Pages does not redirect after a transfer; this repository does not use Pages.

prerequisites:
  - id: repository-name-decided
    satisfied_by: "Decision 218"
    blocks: pre_staged
  - id: decision-172-owner-half
    satisfied_by: "Decision 218 clause 2 (rec-3915)"
    blocks: pre_staged
  - id: terraform-github-pr-time-plan
    satisfied_by: >-
      rec-4335: a CI job runs a read-only terraform plan of terraform/github on every PR touching it,
      authenticated by an otl-labs-owned GitHub App (Metadata, Administration and Actions read), and
      terraform/github is recorded in environment-taxonomy.yaml once live, so
      deploy-paths.yaml's pre_merge_live_plan root derivation stays correct.
    blocks: "terraform-github-state-reconciled, and every migration change under terraform/github"
    why: >-
      Today CI only validates terraform/github offline, so its first live provider contact is at
      apply time (the #1316 failure class). The App is public until the transfer so it can be
      installed on the personal account for this repository only.
  - id: terraform-github-state-reconciled
    satisfied_by: >-
      rec-3136: state rm + re-import of the five name-keyed addresses under the CURRENT name, proven
      by the CI plan: one run records the drift, a second after the re-import reads 0 to change except
      the ruleset's bypass_actors, which the plan App cannot read (visibility-gated; evidence_ledger).
    blocks: pre_staged
    why: A post-move plan diff is unattributable without a zero-diff baseline.
  - id: org-owner-access
    satisfied_by: "The operator is an owner of otl-labs (required to rename during transfer) and holds admin on the repository."
    blocks: transferred

carries_over:
  verified: >-
    Issues, pull requests, wiki, stars, watchers, webhooks, secrets, deploy keys, LFS objects,
    forks and history carry over; web and git URLs redirect until something is created at the old
    path (GitHub docs, read 2026-10-15). Repository secrets keep their values, so a value that
    names the old owner still needs replacing.
  unverified: >-
    GitHub docs do not state whether environments and their protection rules, rulesets and bypass
    actors, repository Actions settings or App installations carry over. Treat each as absent
    until a REST read on the new path proves it (phases.transfer).
  name_retirement: >-
    A repository with heavy clone or Actions traffic has its old owner/name path retired after a
    move, so benjamin-blake/theseus can never be recreated and its redirects persist.

breakage_map:
  # changes_on: which half of the identity change breaks it. timing: at_transfer (breaks the moment
  # the transfer lands), first_use (breaks when next exercised), silent (stops working with no error).
  # fix_phase: the phase whose exit requires the fix. actor: HUMAN (operator console, or an exact
  # command run on the operator's word) or AGENT-RUNNABLE (a PR through the governed path).
  - id: oidc_trust_segment
    binding: OIDC trust subject segment of every CI role
    locations: [terraform/personal/oidc.tf, terraform/bootstrap/github_ci_apply.tf, tests/checks/iam_tf/test_oidc_trust_slug_invariants.py]
    changes_on: [owner, name]
    timing: at_transfer
    failure_mode: >-
      All five CI roles become unassumable; ci-rca and convergence-health go dark with them, so the
      outage is self-masking (Decision 172). Recovery after the fact is circular (the fix routes to
      tf-gated-apply, which needs OIDC) and falls to the admin break-glass apply.
    fix: >-
      Add the target segment additively to BOTH lists before transfer: terraform/personal through
      the PR -> tf-gated-apply path for github_ci_branch and github_ci_pr, after an admin
      split-apply of github_ci_planner and github_ci_deploy, whose trust the CI apply role may not
      rewrite (Decision 143 clause 1; Decision 183 point 4); terraform/bootstrap by the operator's
      out-of-band admin apply. Exact match only, no wildcard (Decision 172 clause 3). Every sub
      site renders all five sub forms from the list, including environment:tf-gated-apply
      (Decision 94), so the one new entry covers them; the both-forms guard in the trust test
      stays intact.
    fix_phase: pre_staged
    actor: HUMAN
    rec: rec-3902
    detection: static
  - id: trusted_plan_workflow_ref
    binding: job_workflow_ref values in the trusted-plan role's trust
    locations: [terraform/personal/oidc_trusted_plan_role.tf]
    changes_on: [owner, name]
    timing: at_transfer
    failure_mode: "The values name the repository, not its ids, so a rename or transfer makes the trusted plan unassumable: PR plans stop, nothing else breaks (fails closed)."
    fix: "Add the target name's values additively before the move by an admin split-apply (Decision 223 cl.4); exact match only (Decision 172 cl.3); remove the old values after live proof."
    fix_phase: pre_staged
    actor: HUMAN
    rec: rec-4636
    detection: static
  - id: environment_fail_open
    binding: GitHub Environments tf-gated-apply and tf-trusted-plan (Terraform-managed) and pypi (not Terraform-managed)
    locations: [terraform/github/environments.tf, .github/workflows/terraform-apply-sandbox.yml, .github/workflows/reconcile.yml, .github/workflows/tf-gated-apply-prototype.yml, .github/workflows/publish-ontheloop.yml, .github/workflows/terraform-plan-trusted.yml]
    changes_on: [owner]
    timing: silent
    failure_mode: >-
      If an environment does not carry over, GitHub creates it WITHOUT protection rules on the first
      job that references it, while the OIDC environment sub still matches: every gated apply and
      every publish runs ungated (PLAN-repo-rename-relicense precedent). tf-trusted-plan would admit
      any branch, though its role's job_workflow_ref binding still refuses a non-main token.
    fix: >-
      The operator reads all three environments, their reviewers and branch policies in Settings on the new path BEFORE the
      first merge to main or any dispatch (the agent proxy blocks environment reads); recreate them from
      terraform/github (tf-gated-apply, tf-trusted-plan) or the console (pypi) before unfreezing. Proven live by a
      tf-gated-apply dispatch that waits for its reviewer.
    fix_phase: transferred
    actor: HUMAN
    rec: rec-4550
    detection: live
  - id: org_policy_override
    binding: Organisation-level Actions and token policies that override repository settings
    locations: [terraform/github/repo.tf]
    changes_on: [owner]
    timing: silent
    failure_mode: >-
      A restrictive organisation default for the GITHUB_TOKEN permission, the allowed-actions
      policy, the "Actions can create and approve pull requests" switch, fork-PR approval, the
      fine-grained PAT approval policy or a classic-PAT restriction can disable a repository setting
      with no error at transfer time; the first workflow or terraform/github call that needs it fails.
    fix: >-
      Before transfer the operator sets the organisation policies to match terraform/github/repo.tf
      (default token read-only; Actions may not approve pull requests; all actions allowed; fork-PR
      workflows from outside collaborators need approval; classic and fine-grained PATs allowed,
      org-owner tokens need no approval, fine-grained lifetime up to 366 days); require 2FA for
      members. One console visit, read back, one evidence_ledger row.
    fix_phase: pre_staged
    actor: HUMAN
    rec: rec-4537
    detection: live
  - id: ruleset_and_actions_settings
    binding: main ruleset (require_code_owner_review, admin bypass actor role 5), Actions and workflow permissions
    locations: [terraform/github/repo.tf, .github/CODEOWNERS]
    changes_on: [owner]
    timing: silent
    failure_mode: Not documented to carry; a missing ruleset lets unreviewed changes reach main.
    fix: >-
      In the window the agent diffs the ruleset against its pre-transfer snapshot; the operator reads
      Actions and workflow permissions in Settings (proxy-blocked) and ghas-probe confirms them;
      recreate from terraform/github if absent.
    fix_phase: transferred
    actor: HUMAN
    rec: rec-4550
    detection: live
  - id: terraform_github_root
    binding: terraform/github provider owner, repository name and name-keyed state
    locations: [terraform/github/variables.tf, terraform/github/main.tf, terraform/github/repo.tf, terraform/github/environments.tf]
    changes_on: [owner, name]
    timing: first_use
    failure_mode: >-
      The provider looks up the old owner/name and every name-keyed resource (repository, ruleset,
      environment, Actions and workflow permissions) misaddresses. Letting the provider perform the
      rename edits by the old id and fails once the repository is already renamed.
    fix: >-
      After transfer: change the github_owner and repository_name defaults, state rm every
      name-keyed address and re-import it with import blocks (inert while an address is in state),
      and prove a plan of N to import, 0 to change, 0 to destroy in the PR-time CI plan
      (prerequisites.terraform-github-pr-time-plan) before any apply. Apply stays by hand with the
      classic admin PAT, which works for org repositories its holder can reach unless the
      organisation restricts classic PATs (org_policy_override). Its successor is the
      terraform/github apply App (transfer_credentials), created before transfer; rec-4355 switches
      the provider to app_auth and re-keys with it, proven by that import apply (N imported, 0
      changed) and a No changes plan showing security_and_analysis and bypass_actors. The classic
      PAT and its entry stay as rollback until that ledger row exists. Until the plan App is proven
      to see security_and_analysis and ruleset bypass_actors, the operator's plan is authoritative
      for those two fields.
    fix_phase: proven
    actor: HUMAN
    rec: rec-4355
    detection: static
  - id: terraform_github_plan_app
    binding: The otl-labs GitHub App installation that authenticates the PR-time terraform/github plan
    locations: [operator console, repository secrets (App private key)]
    changes_on: [owner]
    timing: first_use
    failure_mode: >-
      Its installation is on the personal account, so after transfer the CI plan cannot read the
      repository until the App is installed on otl-labs and the job uses the new installation.
    fix: >-
      Before transfer an organisation owner installs the App on otl-labs with All repositories, so it
      picks the repository up on arrival; no workflow edit (create-github-app-token resolves the
      running repository's installation). Proven by the PR-time plan on rec-4355's re-key PR; then,
      each its own gated step: uninstall it from the personal account, make it private (refused while
      installed elsewhere), rotate its private key.
    fix_phase: proven
    actor: HUMAN
    rec: rec-4538
    detection: live
  - id: pypi_trusted_publisher
    binding: PyPI Trusted Publisher for project ontheloop (repository, workflow filename, environment)
    locations: [docs/contracts/package-registry-reservation.yaml, .github/workflows/publish-ontheloop.yml]
    changes_on: [owner, name]
    timing: first_use
    failure_mode: The next publish dispatch is rejected by PyPI's OIDC exchange.
    fix: >-
      Before transfer register a SECOND publisher for otl-labs/ontheloop with the same workflow
      filename and environment (a PyPI project may hold several; PyPI never checks the repository
      exists). Proven by a proof_only dispatch on the new path (the published version re-uploaded
      under skip-existing, no new file) or a release; only then remove the old one. The sweep
      updates package-registry-reservation.yaml's pypi_trusted_publisher block.
    fix_phase: pre_staged
    actor: HUMAN
    rec: rec-4537
    detection: live
  - id: claude_github_app
    binding: Claude GitHub App installation used by Claude Code cloud sessions, project threads and claude.yml (claude-code-action with no github_token)
    locations: [operator console, .github/workflows/claude.yml]
    changes_on: [owner]
    timing: at_transfer
    failure_mode: Cloud sessions and project threads lose clone and push access; @claude comments get no reply.
    fix: >-
      Before transfer an organisation owner installs the App on otl-labs with All repositories, so
      the repository is reachable the moment it lands; narrowed to ontheloop after phases.prove. The
      personal installation stays until proof.
    fix_phase: pre_staged
    actor: HUMAN
    rec: rec-4537
    detection: live
  - id: fine_grained_pat
    binding: GHAS_PROBE_TOKEN repository secret, a fine-grained PAT whose resource owner is the personal account
    locations: [.github/workflows/ghas-probe.yml, scripts/checks/misc/validate_ghas_probe.py, docs/DECISIONS.md (Decision 83 stanza)]
    changes_on: [owner]
    timing: first_use
    failure_mode: A fine-grained PAT reaches resources of ONE owner only, so the probe 403s against the moved repository.
    fix: >-
      Before transfer the operator mints the successor (resource owner otl-labs, All repositories,
      the same three read permissions, 366-day expiry) and holds it in the vault; in the window it is
      pasted into the secret and ghas-probe dispatched once, which also reads the Actions settings the
      agent proxy blocks. Then Decision 83's probe-token-expiry condition is re-armed by dated
      annotation and the predecessor revoked.
    fix_phase: transferred
    actor: HUMAN
    rec: rec-4538
    detection: live
  - id: claude_code_project_binding
    binding: Claude Code project repository binding, cloud environments and their setup scripts (clone path /home/user/<repository>)
    locations: [Claude Code project and environment settings (outside the repository)]
    changes_on: [owner, name]
    timing: at_transfer
    failure_mode: >-
      Sessions clone the redirect or nothing; a setup script that tests /home/user/theseus skips its
      repository steps silently once the clone directory is /home/user/ontheloop.
    fix: >-
      Before the window each setup script accepts /home/user/ontheloop or /home/user/theseus, proven by
      a fresh session in each environment; first in the window the operator re-points every Claude Code
      project bound to the repository and a fresh thread proves clone, push and PR; the old path is
      dropped after phases.prove.
    fix_phase: transferred
    actor: HUMAN
    rec: rec-4550
    detection: live
  - id: dependabot_repository_guard
    binding: dependabot-auto-merge job condition pinned to the repository full name
    locations: [.github/workflows/dependabot-auto-merge.yml, tests/checks/ci_guards/test_validate_dependabot_automation.py]
    changes_on: [owner, name]
    timing: silent
    failure_mode: Auto-merge stops with no error.
    fix: Accept both full names before transfer; drop the old one in the sweep.
    fix_phase: pre_staged
    actor: AGENT-RUNNABLE
    rec: rec-3903
    detection: static
  - id: owner_literal_defaults
    binding: Hard-coded owner or owner/repository defaults in scripts and terraform/github
    locations: [scripts/repo_identity.py, scripts/checks/misc/validate_ghas_probe.py, scripts/session/github_readiness.py, scripts/convergence_health/escalate.py, scripts/convergence_health/approvals.py, scripts/convergence_health/budget_ingest.py, scripts/convergence_health/sensor_liveness.py, scripts/ops/drain_glue_orphan/_github.py]
    changes_on: [owner, name]
    timing: first_use
    failure_mode: >-
      API calls lean on GitHub's redirect for the old path; writes and pagination through a redirect
      are fragile, and a retired path that is ever recreated breaks them outright.
    fix: >-
      Before transfer, every script that queries GitHub resolves the repository from GITHUB_REPOSITORY
      with one fallback constant (scripts/repo_identity.py), so CI callers follow the transfer at
      once; the sweep moves that constant and the remaining text literals to the new full name after
      transfer.
    fix_phase: predecessor_removed
    actor: AGENT-RUNNABLE
    rec: rec-3903
    detection: static
  - id: codeowners
    binding: .github/CODEOWNERS names a person
    locations: [.github/CODEOWNERS]
    changes_on: []
    timing: silent
    failure_mode: None while that person keeps write access in the organisation; code-owner review keeps working.
    fix: Retain, or convert to an otl-labs team in the sweep (rec-3903 decides).
    fix_phase: predecessor_removed
    actor: AGENT-RUNNABLE
    rec: rec-3903
    detection: static
  - id: descriptive_literals
    binding: Package metadata URLs, COMMERCIAL-LICENSE.md, docs and comments naming the old path
    locations: [packages/, COMMERCIAL-LICENSE.md, docs/, terraform/github/CLAUDE.md]
    changes_on: [owner, name]
    timing: first_use
    failure_mode: Redirects keep links working; text is stale. Historical records (DECISIONS, plans, audits, test fixtures) are never rewritten.
    fix: Sweep forward-standing text only.
    fix_phase: predecessor_removed
    actor: AGENT-RUNNABLE
    rec: rec-3903
    detection: static

unaffected_bindings:
  - "crates.io and npm ownership (GitHub-OAuth or registry accounts, not repository-bound)"
  - "AWS, Neon and Anthropic credentials stored as repository secrets (values carry over unchanged)"
  - "The handoff-evidence push gate (Decision 203) and .claude hooks: no repository-slug key found (checked 2026-10-15)"
  - "Decision 205's executor and verdict GitHub Apps do not exist yet; when created, they are created under otl-labs"
  - "The GitHub MCP token file in the DEV and ADMIN setup scripts: retired before transfer (rec-4537); the agent proxy substitutes the session's own GitHub credential on every api.github.com request, so the file holds the literal proxy-injected"
  - "agent-platform-github-pat (GitHub Models, Secrets Manager): account-bound, not repository-bound, and its API was retired 2026-07-30; revoked under rec-4539"

transfer_credentials:
  # Minted or installed broad for the transfer (operator rule, 2026-10-21) and cleaned up in phases.predecessor_removal
  # (rec-4538). Names, scope and dates only (Decision 101); the build fills minted and expires from the operator's read-back.
  - {name: GHAS_PROBE_TOKEN successor, kind: fine-grained PAT, owner: otl-labs, access: all repositories, permissions: "Administration, Secret scanning alerts, Metadata: read", held: "Secrets Manager entry (ghas-probe- prefix) until the window swap", minted: 2026-10-24, expires: 2027-10-22, cleanup: narrow to ontheloop or re-mint}
  - {name: terraform/github apply App, kind: private GitHub App, owner: otl-labs, access: all repositories, permissions: "Administration and Actions: read and write; Metadata: read", held: new Secrets Manager entry (key and ids), minted: 2026-10-22, expires: never, cleanup: "narrow to ontheloop; then delete its transfer-time private key from the App and from Secrets Manager, rotating to a new key first if the App stays in use"}
  - {name: terraform/github plan App installation, kind: GitHub App installation, owner: otl-labs, access: all repositories, permissions: "unchanged: read", held: existing repository secret, minted: 2026-10-22, expires: never, cleanup: narrow to ontheloop}
  - {name: Claude GitHub App installation, kind: GitHub App installation, owner: otl-labs, access: all repositories, permissions: "the App's own", held: none, minted: 2026-10-22, expires: never, cleanup: narrow to ontheloop}
  - {name: second PyPI Trusted Publisher, kind: Trusted Publisher, owner: otl-labs/ontheloop, access: project ontheloop, permissions: upload, held: none, minted: 2026-10-22, expires: never, cleanup: remove the old publisher}

phases:
  - id: settle
    exit_sets_phase: pre_transfer
    trusted_segments: [current]
    gates:
      - "This contract merged; Decision 218 recorded (repository name; owner half of Decision 172's playbook)."
  - id: pre_stage
    exit_sets_phase: pre_staged
    trusted_segments: [current, target]
    gates:
      - "breakage_map.oidc_trust_segment: target segment applied in BOTH roots; a CI run on the CURRENT path assumes every role (proof the additive edit broke nothing)."
      - "breakage_map.org_policy_override, claude_github_app, terraform_github_plan_app, pypi_trusted_publisher: console steps done and read back; a proof_only publish dispatch on the current path green."
      - "transfer_credentials: every entry minted or installed, minted date filled; the GHAS_PROBE_TOKEN successor not yet swapped. The GitHub MCP token file holds proxy-injected in DEV and ADMIN, proven by a fresh session in each. The old token's revocation waits for its last-used re-check (operator, 2026-10-22) and does not hold the go/no-go: no request presents it and a personal-owner token cannot reach the moved repository."
      - "breakage_map.dependabot_repository_guard: both full names accepted, merged green."
      - "prerequisites.terraform-github-pr-time-plan and terraform-github-state-reconciled satisfied."
      - "procedure.pre_stage 9 and 10: each setup script accepts both clone paths, proven by a fresh session in each environment; no Codespaces prebuild configuration remains; the personal claude.ai account lists an otl-labs repository; the pre-transfer snapshot is in the shared folder."
  - id: transfer
    exit_sets_phase: transferred
    trusted_segments: [current, target]
    gates:
      - "Go/no-go: every pre_stage gate green, recorded in evidence_ledger; the rehearsal (procedure.pre_stage 8) found the repository_owner_id claim of tokens from the GitHub OIDC issuer equal to the staged otl-labs owner id after its transfer, with its carry-over read recorded (rec-4356); this is the last reversible point."
      - "Freeze: no merge to main and no workflow dispatch from the go/no-go until unfreeze, with dependabot-auto-merge disabled; in-flight runs drain first."
      - "The operator transfers to otl-labs and renames to ontheloop in ONE operation (Settings > Transfer)."
      - "Unfreeze only after procedure.transfer_window_checklist passes in order."
  - id: prove
    exit_sets_phase: proven
    trusted_segments: [current, target]
    gates:
      - "Green CI on main; a converged convergence record; a speculative plan and a tf-gated-apply run on the new path; Dependabot auto-merge's job ran, not skipped, on a Dependabot PR under the new full name; code-owner review; a proof_only publish dispatch through the pypi environment on the new publisher (or a release; the environment's reviewer is rec-4549's); one @claude comment answered by claude.yml; a Claude Code thread clones, pushes and opens a PR; live RoleLastUsed for every CI role under the target segment."
      - "breakage_map.terraform_github_root: plan of N to import, 0 to change, 0 to destroy on the new owner and name, except the ruleset's bypass_actors while the plan App cannot read it (the operator's plan is authoritative for that field)."
  - id: predecessor_removal
    exit_sets_phase: predecessor_removed
    trusted_segments: [target]
    gates:
      - "Each removal is its own gated step with recorded evidence, in this order: old OIDC segment from both roots (gated and admin applies; rec-4551); old PyPI publisher; the classic terraform/github admin PAT revoked after its App successor proves one apply, then its Secrets Manager entry deleted; the plan App uninstalled from the personal account, made private and its key rotated; personal Claude App installation scoped off this repository; the old GitHub MCP token revoked if it still exists; every transfer_credentials entry cleaned up as it states; owner_literal_defaults, codeowners and descriptive_literals swept (rec-3903). Exception: the old GHAS_PROBE_TOKEN is inert from transferred and is revoked as soon as its successor's proof is in the ledger."

rollback:
  stance: >-
    Rollback is forward-fix on the new identity, never a transfer back. Every predecessor binding
    (old OIDC segment, old PyPI publisher, old tokens, personal App installation) stays live until
    phases.prove passes, so a straddling job or a missed binding fails safe. Transfer-back is not a
    rollback: the old path is likely retired and its OIDC subject cannot be minted again.
  last_reversible_point: phases.transfer go/no-go gate
  per_phase:
    pre_stage: "Each additive change is reverted by its own PR or console undo; nothing is removed in this phase except the retired MCP token, which no request presents (unaffected_bindings)."
    transfer: "If a checklist item fails, stay frozen and forward-fix it; if OIDC fails, the admin break-glass apply restores trust (Decision 172 recovery)."
    predecessor_removal: "Re-add the removed binding from its predecessor record before retrying."

procedure:
  pre_stage:
    - {step: 1, tag: HUMAN, action: "Read the otl-labs numeric id from the GitHub API and hand it to the OIDC pre-stage plan (rec-3902), which adds the target segment to both roots."}
    - {step: 2, tag: HUMAN, action: "Set the otl-labs organisation policies per breakage_map.org_policy_override; read them back."}
    - {step: 3, tag: HUMAN, action: "Install the Claude GitHub App and the terraform/github plan App on otl-labs with All repositories."}
    - {step: 4, tag: HUMAN, action: "Register the second PyPI Trusted Publisher for otl-labs/ontheloop (same workflow filename and environment); read the pypi environment's required reviewer in Settings, then dispatch publish-ontheloop with proof_only from main and approve it."}
    - {step: 5, tag: HUMAN, action: "Mint the GHAS_PROBE_TOKEN successor and create the terraform/github apply App per transfer_credentials (the App's key and ids into a new Secrets Manager entry); do not swap yet."}
    - {step: 6, tag: AGENT-RUNNABLE, action: "Land the dependabot guard and test that accept both full names."}
    - {step: 7, tag: HUMAN, action: "Write the literal proxy-injected into the GitHub MCP token file in the DEV and ADMIN setup scripts; a fresh session in each passes readiness and one authenticated read; revoke the old token once its last-used re-check clears it (not a go/no-go condition)."}
    - {step: 8, tag: HUMAN, action: "Rehearse on a throwaway public repository under the personal account, never named ontheloop: an OIDC workflow prints only ISS_OK or ISS_BAD, OWNER_ID MATCH or MISMATCH against the otl-labs entry of terraform/personal/oidc.tf, and SUB_FORMAT; transfer it into otl-labs with a rename, run it again, read what carried over, then delete it (rec-4356)."}
    - {step: 9, tag: HUMAN, action: "Make each environment setup script cd into the first of /home/user/ontheloop and /home/user/theseus that holds bin/setup-cloud-env.sh; a fresh session in each passes. Delete any Codespaces prebuild configuration. Confirm the personal claude.ai account's repository picker lists an otl-labs repository, reconnecting GitHub there if not."}
    - {step: 10, tag: AGENT-RUNNABLE, action: "Snapshot, as id-free projections in the shared folder, the repository GET with security_and_analysis, the main ruleset with bypass actors and the workflow states, for the window diff."}
  transfer_window_checklist:
    - {step: 1, tag: HUMAN, action: "Re-point every Claude Code project bound to the repository to otl-labs/ontheloop; a fresh thread continues the window from the shared-folder RESUME (breakage_map.claude_code_project_binding)."}
    - {step: 2, tag: AGENT-RUNNABLE, action: "Repository GET on the new path: new full name, same numeric id; the pre-transfer snapshot diffs clean apart from owner and name (security_and_analysis; main ruleset with code-owner review and the admin bypass role; workflow states)."}
    - {step: 3, tag: HUMAN, action: "tf-gated-apply exists with its required reviewer and pypi exists, read in Settings: the agent proxy blocks environment reads (breakage_map.environment_fail_open; pypi's reviewer is rec-4549's)."}
    - {step: 4, tag: HUMAN, action: "Actions and workflow permissions match terraform/github/repo.tf and secret and variable NAMES are present (values are never read), read in Settings: the agent proxy blocks both."}
    - {step: 5, tag: HUMAN, action: "Paste the pre-minted GHAS_PROBE_TOKEN successor into the secret and dispatch ghas-probe once (breakage_map.fine_grained_pat)."}
    - {step: 6, tag: AGENT-RUNNABLE, action: "The fresh thread pushes a branch and opens the window PR."}
    - {step: 7, tag: AGENT-RUNNABLE, action: "A read-only OIDC job (the drift plan, dispatched on the operator's word) assumes its role under the target segment."}
    - {step: 8, tag: HUMAN, action: "Merge the window PR; the post-merge apply run and CI on main are green. Re-enable dependabot-auto-merge. Unfreeze."}

evidence_ledger:
  - {date: "2026-10-17", phase: pre_stage, gate: prerequisites.terraform-github-state-reconciled, observation: "Drift recorded before the reconcile: the PR-time terraform/github plan read 0 to import, 0 to add, 5 to change, 0 to destroy, the five name-keyed resources still keyed on agent-platform.", evidence_path: "https://github.com/benjamin-blake/theseus/actions/runs/39051144313/attempts/1"}
  - {date: "2026-10-20", phase: pre_stage, gate: prerequisites.terraform-github-state-reconciled, observation: "Reconciled (rec-3136): state rm of the five addresses and an import-only apply from AWS CloudShell (5 imported, 0 added, 0 changed, 0 destroyed); the PR-time terraform/github plan then read 0 to import, 0 to add, 0 to destroy and 1 to change: the ruleset's bypass_actors, which the plan App cannot read (visibility-gated). The operator's CloudShell plan read No changes.", evidence_path: "https://github.com/benjamin-blake/theseus/actions/runs/39051144313/attempts/3"}
  - {date: "2026-10-24", phase: pre_stage, gate: "phases.pre_stage gates 1-6", observation: "Gate 1: #1599 staged the otl-labs segment in both roots and runs on the current path then assumed every CI role. Gates 2 and 3: #1607 (rec-4537) recorded the organisation policies, both App installs, the second PyPI publisher with a green proof_only publish on the current path, the GHAS successor and the apply App, and fresh DEV and ADMIN sessions on the MCP placeholder; the old MCP token waits for its re-check and does not hold the go/no-go. Gate 4: #1603 accepts both full names. Gate 5: the two prerequisite entries above (the PR-time terraform/github plan of rec-4335 ran in them; the state reconcile of rec-3136, #1601). Gate 6 (transfer runbook build, VP 3-6): fresh DEV and ADMIN sessions pass on the both-path setup snippet (proven on the theseus path; the ontheloop path is first used at checklist step 1), no Codespaces prebuild configuration, the personal claude.ai account lists an otl-labs repository, and the pre-stage snapshot is in the shared folder.", evidence_path: "transfer-runbook/EVIDENCE.md"}
  - {date: "2026-10-24", phase: transfer, gate: "go/no-go (rec-4356)", observation: "Rehearsal on a throwaway public repository (procedure.pre_stage 8): before its transfer a token from the GitHub OIDC issuer gave ISS_OK, OWNER_ID MATCH against the personal entry and SUB_FORMAT immutable; after its transfer and rename into otl-labs, ISS_OK, OWNER_LOGIN otl-labs, the repository_owner_id claim equal to the staged otl-labs entry (OWNER_ID MATCH), SUB_FORMAT immutable and SUB_OWNER_CONSISTENT yes. Carry-over: the environment and its required reviewer, the ruleset, the secret, the variable, the workflow permissions and the workflow enabled state arrived; the ruleset's admin bypass actor did not (its recreate step is in the window notes), the fork pull request approval policy became the organisation's stricter default, and two organisation rulesets are inherited with no rule on main. add_repo of the moved repository worked mid-session. The rehearsal repository was then deleted.", evidence_path: "transfer-runbook/EVIDENCE.md"}
  - {date: "2026-10-24", phase: transfer, gate: "procedure.transfer_window_checklist 1-7", observation: "Transferred and renamed to otl-labs/ontheloop in one operation at 14:51 UTC after the go/no-go (#1628). 1: both Claude Code projects re-pointed; a fresh thread cloned the new path. 2: the same repository id; the snapshot diff found secret scanning and push protection disabled by the move (re-enabled by the operator), then only one organisation-only ruleset key (the pull_request rule's dismissal restriction, disabled); the admin bypass role was recreated (it does not carry). 3 and 4: tf-gated-apply keeps its reviewer and pypi exists; Actions settings match apart from the organisation's stricter fork approval; every carried secret and variable name is present (two referenced names were already absent before the transfer). 5: the GHAS successor re-minted under otl-labs (the first copy was owned by the personal account) and ghas-probe green. 6: the window PR's speculative plan assumed the planner role under the otl-labs segment (no changes) and terraform-converged read success. 7: terraform-drift assumed the planner role under the otl-labs segment and succeeded.", evidence_path: "transfer-runbook/EVIDENCE.md"}
  - {date: "2026-10-24", phase: prove, gate: "procedure.transfer_window_checklist 8 and phases.prove gate 1 (live; rec-4355 pending)", observation: "8: the window PR (#1629) merged; its push run of terraform-apply-sandbox assumed the apply role under the otl-labs segment, applied the saved plan and wrote a converged convergence record (https://github.com/otl-labs/ontheloop/actions/runs/40111380759), and CI on main was green (https://github.com/otl-labs/ontheloop/actions/runs/40111380721); dependabot-auto-merge and Main Canary were re-enabled at unfreeze. Gate 1, live on the new path: the speculative plan on #1629 (no changes); tf-gated-apply-prototype waited on tf-gated-apply and ran after approval (https://github.com/otl-labs/ontheloop/actions/runs/40115703173); deploy-ducklake-lambdas deployed (no undeployed change) and both smoke legs passed (https://github.com/otl-labs/ontheloop/actions/runs/40116169113); publish-ontheloop proof_only passed the OIDC exchange with the new Trusted Publisher through the pypi environment and added no file (https://github.com/otl-labs/ontheloop/actions/runs/40115871822); claude.yml answered a mention on #1629 (https://github.com/otl-labs/ontheloop/actions/runs/40116833309); dependabot-auto-merge ran, not skipped, on a Dependabot PR under the new full name (auto-merge disarmed for the proof; https://github.com/otl-labs/ontheloop/actions/runs/40116325527); a fresh thread cloned the new path, pushed and opened #1629; RoleLastUsed after the transfer for all five CI roles. Code-owner review and the terraform_github_root plan (gate 2) stay with rec-4355.", evidence_path: "transfer-runbook/EVIDENCE.md"}
# Append-only. Entry shape: {date, phase, gate, observation, evidence_path}. evidence_path names a
# file under the project's shared folder or a CI run URL; never a value.

