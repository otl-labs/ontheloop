  - date: "2026-10-20"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-oidc-owner-segment-prestage (rec-3902): the evaluator becomes the registered check
      validate_github_org_transfer, landed with the target segment's staging. identity.staged_phase
      (new, pre_staged) records that the trust lists lead identity.phase by one phase, because the
      phase flip needs post-merge live proof and other plans' gates first; the check matches the
      lists exactly against it. Invariant (2) stays planned. breakage_map.oidc_trust_segment's fix
      names the admin split-apply for github_ci_planner and github_ci_deploy.
  - date: "2026-10-20"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      PLAN-repo-identity-transfer-readiness (rec-3903): validate_github_org_transfer evaluates
      rec-3903's four static rows (retired-identity pins; the dependabot gate accepts the target
      from pre_staged on); owner_literal_defaults resolves the repository from GITHUB_REPOSITORY
      with one fallback constant in scripts/repo_identity.py.
  - date: "2026-10-20"
    semantic_break: false
    change_class: correction
    summary: >-
      PLAN-terraform-github-state-reconcile: prerequisites.terraform-github-state-reconciled is
      satisfied (rec-3136 closed; two evidence_ledger rows); breakage_map.terraform_github_root's
      post-transfer re-key now points at rec-4355.
  - date: "2026-10-21"
