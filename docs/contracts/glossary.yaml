# The one home for the names where On The Loop meets its adopters (Decision 240). Rationale lives in Decision 240 (Decision 86);
# this file never restates it. Other vocabulary blocks keep their own axes: environment-taxonomy.yaml (deploy tiers),
# inference-provider.yaml (backends, credentials, persona, user archetype).
contract:
  id: glossary
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "Decision 240 / PLAN-glossary"
  description: >-
    Class D mechanism contract: the reserved names for On The Loop, the company, the upstream repository, releases
    and deployments, and the organisations and people around them; the two relative words new governed text never
    uses unqualified; and how text older than Decision 240 reads.
  subject: glossary
  evaluator:
    check: validate_glossary

amendment_log:
  - date: "2026-10-30"
    semantic_break: false
    change_class: field_add
    summary: "PLAN-glossary: created (Decision 240)."

terms:
  on_the_loop:
    written: On The Loop
    reserved_meaning: >-
      The framework made of the core, which adopters install from the ontheloop distribution namespace (CLI
      otl, Decision 198 clause 3), and the paid service, which customers pay for.
    do_not_use_for: "the company, this repository, or a deployment"
  on_the_loop_labs:
    written: On The Loop Labs
    reserved_meaning: "The company that owns, builds, sells and operates On The Loop (Decision 195)."
    do_not_use_for: "On The Loop (what adopters install)"
  core:
    written: core
    reserved_meaning: >-
      The free, source-available part of On The Loop that a release carries: the CLI, the governed loop, the ports and
      every adapter (Decision 209 clause 3(1)). Older text also calls it the free tier or the open core.
    do_not_use_for: "the paid service"
  paid_service:
    written: paid service
    reserved_meaning: >-
      What a customer pays On The Loop Labs for: the multi-tenant, metadata-only control plane and what it carries,
      and operating On The Loop for the customer (Decision 209 clause 2, Decision 233 clause 2).
    do_not_use_for: "the core, or the operator deployment"
  this_repository:
    written: this repository
    reserved_meaning: >-
      otl-labs/ontheloop, the upstream repository: On The Loop's source plus what only its maintainers use (its CI,
      Terraform, Decisions, plans and roadmap). Releases are cut from it.
    do_not_use_for: >-
      an adopter's repository; text a release ships says "the upstream repository", because there "this repository"
      reads as the adopter's
  release:
    written: release
    reserved_meaning: >-
      A versioned cut of this repository published under the ontheloop namespace, which adopters install; Tier B
      ships pinned to it (Decision 196 clause 4).
    do_not_use_for: "this repository's main branch, or a deployment"
  deployment:
    written: deployment
    reserved_meaning: "One running install of a release, with its own catalog, store and configured adapters."
    do_not_use_for: "a release (the artefact) or a project (the repository)"
  operator_deployment:
    written: operator deployment
    reserved_meaning: >-
      On The Loop Labs' own deployment, which governs this repository and runs its sandbox, SIT and PROD
      environments (environment-taxonomy.yaml).
    do_not_use_for: "an adopter's deployment, or a deployment On The Loop Labs runs for a customer"
  operator:
    written: operator
    reserved_meaning: "The human who directs this repository and the operator deployment."
    do_not_use_for: "an adopter's or customer's human (a user)"
  adopter:
    written: adopter
    reserved_meaning: >-
      An organisation or team that runs a release on its own repositories, free; On The Loop Labs is one. One
      organisation can be an adopter and a customer; the word follows the relationship the sentence is about.
    do_not_use_for: "a human (a user), or the relationship of paying (a customer)"
  customer:
    written: customer
    reserved_meaning: "An organisation that pays On The Loop Labs for the paid service."
    do_not_use_for: "an adopter running only the core, or a human"
  user:
    written: user
    reserved_meaning: >-
      A human who works with On The Loop at an adopter or customer; a human target-user type is a user archetype
      (inference-provider.yaml, Decision 232).
    do_not_use_for: "an organisation (an adopter or customer)"
  project:
    written: project
    reserved_meaning: >-
      One repository a deployment governs (project_id, Decision 200); this repository is the operator deployment's
      project.
    do_not_use_for: "a release, or what the repository builds (an adopter product)"
  adopter_product:
    written: adopter product
    reserved_meaning: >-
      What an adopter builds and ships from its projects; Tier A and Tier C describe it (Decision 196 clause 2).
      On The Loop Labs' trading and showcase systems are its adopter products.
    do_not_use_for: "On The Loop"

relative_words:
  rule: >-
    New governed text in this repository (contracts, Decisions, plans, skills, agent instruction files and recs)
    never uses platform or product unqualified; it uses a name from terms. It is house style (Decision 211 clause
    2), so it binds an adopter only through the optional profile. Each word is a platform to the layer above it and
    a product to the people who build it, so its meaning depends on the side a sentence is written from.
  platform:
    say_instead: "On The Loop, core, this repository, this repository's roadmap, release, operator deployment, or Tier B"
  product:
    say_instead: "On The Loop for ours, adopter product for an adopter's, or non-test code when the contrast is with tests"
  identifiers: >-
    Identifiers keep their spelling and are not uses of a relative word: agent-platform-*, platform-security-*
    (Decision 202), PlatformDev, the agent_platform profile, docs/ROADMAP-PLATFORM.yaml, the platform-roadmap route,
    ontheloop/platform.yaml and check owner platform. Renaming one is its own change.

read_as:
  rule: >-
    Text older than Decision 240 is never rewritten for wording (Decision 177); it reads through these rows. No
    clause's meaning changes. An unqualified "the platform" not listed below reads as On The Loop, or as this
    repository or the operator deployment where the sentence is about this repository's own files, CI or
    infrastructure.
  rows:
    - {phrase: "platform-only repository", where: "Decisions 178, 209 clause 3", reads_as: "this repository holds only On The Loop's source, never an adopter product"}
    - {phrase: "released platform versions; importing the platform", where: "Decisions 184, 209 clause 3", reads_as: "On The Loop releases"}
    - {phrase: "Tier B platform decisions", where: "Decision 196 clause 2", reads_as: "Tier B: the decisions a release ships"}
    - {phrase: "platform environment, platform tier, PLATFORM axis", where: "Decision 77, environment-taxonomy.yaml", reads_as: "the operator deployment's environments (sandbox, SIT, PROD)"}
    - {phrase: "platform roadmap", where: "docs/ROADMAP-PLATFORM.yaml and its citers", reads_as: "this repository's roadmap"}
    - {phrase: "owns the platform", where: "Decisions 195, 198", reads_as: "owns On The Loop and this repository"}
    - {phrase: "the external brand for both the platform and its products", where: "Decision 198 clause 1", reads_as: "the brand for On The Loop and for On The Loop Labs' adopter products"}
    - {phrase: "the product, meaning On The Loop", where: "Decisions 184, 196, 232", reads_as: "On The Loop"}
    - {phrase: "products, trading product, showcase product, products monorepo, PRODUCT phase axis", where: "Decisions 77, 178, 198, 209, 220", reads_as: "On The Loop Labs' adopter products"}
    - {phrase: "the product, product decisions, in Tiers A and C", where: "Decision 196 clause 2", reads_as: "the adopter product"}
    - {phrase: "product regression, merged product behaviour", where: "Decision 226, red-main-recovery.yaml", reads_as: "non-test code: what the tests exercise"}
    - {phrase: "user, meaning an organisation", where: "Decision 196", reads_as: "adopter"}
    - {phrase: "free tier, open core", where: "Decisions 184, 209, 233", reads_as: "core"}
    - {phrase: "paid management plane, paid plane", where: "Decisions 184, 205", reads_as: "the paid service's control plane"}
    - {phrase: "customer, where the sentence is about the free release", where: "Decision 184 as amended, Decision 233 clauses 1-2", reads_as: "adopter"}
    - {phrase: "customer/organisation boundary", where: "Decision 200 clause 1", reads_as: "the organisation boundary, adopter or customer"}
    - {phrase: "On The Loop charges, operates or hosts", where: "Decisions 205, 209, 233, inference-provider.yaml", reads_as: "On The Loop Labs"}
    - {phrase: "Theseus", where: "older text", reads_as: "On The Loop (rec-3925)"}

anti_patterns:
  - '"platform" or "product" unqualified in new governed text -- name the thing'
  - '"On The Loop" for the company -- say On The Loop Labs'
  - '"this repository" in text a release ships -- say the upstream repository'
  - '"user" for an organisation -- say adopter or customer'
