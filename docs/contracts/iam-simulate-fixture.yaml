    migration_story: "The repository became platform-only. Product surfaces (broker credentials, the product roadmap, the market-data pipeline) and the retired legacy query-engine path (staging outbox, ops compaction, legacy workgroup IAM) were deleted, and this contract's references to them were removed in the same change. No live DuckLake field or verb semantics changed."
