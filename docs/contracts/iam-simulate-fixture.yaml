# Standing live-simulate contract for the CD apply role (design (d), PLAN-iam-write-surface-completion).
#
# WHAT THIS IS: the machine-readable record of what the github_ci_apply identity/boundary
# intersection is EXPECTED to decide, verb by verb. Its runner is
# `bin/venv-python -m scripts.ci.iam_simulate` (scripts/ci/, POST-APPLY only -- see docs/contracts/
# deploy-paths.yaml#admin_out_of_band.procedure). It is deliberately NOT a validate.py check: a
# static PR-time check structurally cannot see condition-key evaluation or the identity/boundary
# intersection, and between merge and the human-gated bootstrap apply the code legitimately declares
# verbs the live policy does not yet have -- wiring this into --pre would red the very PR that fixes
# the problem.
#
# WHY IT EXISTS: three production AccessDenied incidents (rec-2831, rec-2842, rec-2882) shared one
# shape -- the headline verb was granted and a structurally-required companion verb was not. Every
# such verb, and every verb the gap sweep deliberately REFUSED to grant, is recorded here with its
# expected decision, so a later sweep re-derives nothing and a later auditor cannot mistake a
# by-design denial for an unnoticed gap. A `by_design: ...` field marks the deliberate refusals.
#
# NOT A RITUAL A/B/C CONTRACT (Decision 118 governs RATIFIED contracts): a Class D mechanism
# contract as of the `contract:` block below (migration-step-3-grandfathering, T2.56 migration
# step 3), enforced by {check: validate_iam_simulate_fixture_shape} -- a structural check over
# expected_decision_values / the per-verb placeholders shape, never the live
# condition-key/intersection semantics themselves, which stay a POST-APPLY-only concern owned by
# scripts/ci/iam_simulate.py's runner (see WHAT THIS IS above). Amend the body by editing it in
# the same PR as the grant change it records; amend the `contract:` envelope's own fields via a
# new amendment_log[] entry.
#
# PUBLIC REPO (Decision 101): ${account_id} and ${region} are PLACEHOLDERS, resolved at run time by
# the runner. A literal 12-digit account id must NEVER appear in this file -- the pre-commit
# never-commit hook blocks it.
#
# TARGET ARNS ARE REPRESENTATIVE, NOT ASSERTIONS OF EXISTENCE. iam:SimulatePrincipalPolicy evaluates
# policy against the ARN string supplied and happily simulates resources that do not exist, so
# `agent-platform-simulate-probe`-style names are used wherever a concrete ARN is needed only to
# exercise a prefix pattern. No wildcard inside a target ARN (only a bare "*", for actions IAM scopes to no resource
# type): the simulator matches the policy's pattern against this literal string, so a partial "*" proves nothing.
#
# PROVIDER-SCOPED: every call-set inference below is scoped to hashicorp/aws 5.100 (the version in
# .terraform.lock.hcl). RE-RUN THIS FIXTURE ON ANY PROVIDER BUMP -- a provider that migrates a call
# (e.g. logs:TagLogGroup -> logs:TagResource) changes which companion verbs are load-bearing.
#
# required_context_keys DEFAULTS TO {} WHEN ABSENT (rec-3325 compaction): a triple with no condition-key requirement simply omits the field --
# scripts.ci.iam_simulate.build_triples reads it via `row.get("required_context_keys") or {}`. The field stays a discoverable key for any triple
# that DOES need a context entry (the iam:PermissionsBoundary / iam:PassedToService pairs below); it is never required to be an empty mapping.
contract:
  id: iam-simulate-fixture
  class: D
  contract_version: 1
  status: active
  description: >-
    Class D mechanism-contract envelope for this file (migration-step-3-grandfathering, T2.56
    migration step 3). The standing live-simulate fixture body itself (expected_decision_values,
    the per-verb decision records) is unchanged by this envelope.
  subject: iam-simulate-fixture
  evaluator:
    check: validate_iam_simulate_fixture_shape

amendment_log:
  - {date: "2026-10-27", semantic_break: false, change_class: field_add, summary: "PLAN-secrets-to-ssm-grants (Decision 237, rec-4626): three secret-parameter rows for the apply role, and p0-6-update-secret-enumerated targets the deepseek fixture now that the PAT secret is gone."}
  - {date: "2026-10-19", semantic_break: false, change_class: field_add, summary: "PLAN-telemetry-production-catalog (Decision 230): six rows record the boundary's telemetry prefix fence (four denies, the ops prefix still allowed) and the telemetry-family URL-only pattern."}
