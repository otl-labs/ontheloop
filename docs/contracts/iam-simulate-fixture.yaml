  - id: anchor-relocated-read-get-role
    verb: "iam:GetRole"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-github-ci-branch"
    expected_decision: allowed
    why: >-
      RELOCATION ANCHOR: IAMRolesRead is one of the 11 Sids that MOVED into
      agent-platform-github-ci-apply-reads. Its decision must be unchanged by the move -- a customer-
