    target_arn_template: "arn:aws:secretsmanager:${region}:${account_id}:secret:agent-platform-terraform-personal-tfvars-fixture"
    expected_decision: allowed
    why: >-
      Second relocation anchor, on the Sid with the most at stake: SecretsManagerReadOnly's six
      enumerated ARNs moved VERBATIM (S1 -- no widening; Decision 129 pt 2 keeps Secrets Manager
      enumerated because secrets return VALUES).
  - id: anchor-secrets-read-non-enumerated-negative
    verb: "secretsmanager:GetSecretValue"
    target_arn_template: "arn:aws:secretsmanager:${region}:${account_id}:secret:agent-platform-simulate-probe-fixture"
    expected_decision: implicitDeny
    by_design: >-
      S1: the relocation moved SecretsManagerReadOnly's six enumerated ARNs verbatim and widened
      NOTHING. If a non-enumerated agent-platform-* secret ever reads as `allowed`, the enumeration was
      traded for a prefix during a byte-pressure edit -- the exact trade this plan refused to make.
    why: "Proves the read scope did not widen in transit."
  - id: anchor-lambda-create-function
    verb: "lambda:CreateFunction"
    target_arn_template: "arn:aws:lambda:${region}:${account_id}:function:agent-platform-simulate-probe"
    expected_decision: allowed
