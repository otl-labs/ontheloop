  # -- BY-DESIGN DENIALS: the sweep named these and deliberately refused them. --
  - id: by-design-s3-delete-bucket
    verb: "s3:DeleteBucket"
    target_arn_template: "arn:aws:s3:::agent-platform-data-lake"
    expected_decision: implicitDeny
    by_design: >-
      DENIED BY DESIGN, admin-tier only. This bucket holds the terraform state, the saved tfplan
      artifacts AND the convergence record, so a CD-executable bucket delete would let one approved
      apply destroy the platform's own integrity anchor. Bucket destruction stays out-of-band.
    why: "Recorded so a future sweep does not re-flag the s3:CreateBucket / s3:DeleteBucket asymmetry as a gap."
  - id: by-design-create-oidc-provider
    verb: "iam:CreateOpenIDConnectProvider"
    target_arn_template: "arn:aws:iam::${account_id}:oidc-provider/token.actions.githubusercontent.com"
    expected_decision: implicitDeny
    by_design: >-
      DENIED BY DESIGN. The OIDC provider is what the CI job assumed a role THROUGH; creating,
      replacing or destroying it from inside that job breaks the pipeline mid-apply. OIDCProviderReconcile
      grants only the non-lifecycle verbs (Get / UpdateThumbprint / AddClientID / Tag / Untag).
    why: "Provider lifecycle stays admin-tier and out-of-band."
  - id: by-design-delete-oidc-provider
    verb: "iam:DeleteOpenIDConnectProvider"
    target_arn_template: "arn:aws:iam::${account_id}:oidc-provider/token.actions.githubusercontent.com"
    expected_decision: implicitDeny
    by_design: "DENIED BY DESIGN -- same ordering hazard as the create verb: the pipeline would delete the identity provider authenticating itself."
    why: "Second of the three OIDC-provider lifecycle verbs the sweep refused."
  - id: by-design-remove-client-id-from-oidc-provider
    verb: "iam:RemoveClientIDFromOpenIDConnectProvider"
    target_arn_template: "arn:aws:iam::${account_id}:oidc-provider/token.actions.githubusercontent.com"
    expected_decision: implicitDeny
    by_design: >-
      DENIED BY DESIGN. Removing the sts.amazonaws.com audience is functionally equivalent to deleting
      the provider for this pipeline's purposes -- the additive AddClientIDToOpenIDConnectProvider is
      granted, its destructive inverse is not.
    why: "Third of the three OIDC-provider lifecycle verbs the sweep refused."
  - id: by-design-lambda-list-layers
    verb: "lambda:ListLayers"
    target_arn_template: "arn:aws:lambda:${region}:${account_id}:layer:agent-platform-simulate-probe"
    expected_decision: implicitDeny
    by_design: >-
      DENIED BY DESIGN. lambda:ListLayers / lambda:ListLayerVersions are account-level and
      unscopable -- granting them would require Resource:"*" -- and the provider does not call them
      for the resources this module declares.
    why: "Recorded so the account-level read absence is not re-flagged as a LambdaRead gap."

  # -- ESCALATION BREAKS: the Denies that must keep biting after the policy-architecture split. --
  - id: s5-create-policy-version-on-reads-policy
    verb: "iam:CreatePolicyVersion"
    target_arn_template: "arn:aws:iam::${account_id}:policy/agent-platform-github-ci-apply-reads"
    expected_decision: explicitDeny
    by_design: >-
      S5, THE LOAD-BEARING TRIPLE OF THE POLICY-ARCHITECTURE SPLIT. The 11 relocated read Sids now live
      in the customer-managed agent-platform-github-ci-apply-reads document, so
      DenyBoundaryPolicyModification's Resource list names that ARN alongside the boundary's. Without
      it the relocation would downgrade those grants' protection IN KIND -- from an explicit Deny to
      the mere ABSENCE of an iam:CreatePolicy* grant. explicitDeny (not implicitDeny) is the assertion:
      it proves the Deny statement matched, not merely that no Allow did.
    why: "Makes the acceptance criterion true by construction rather than by absence."
  - id: s5-create-policy-version-on-boundary-policy
    verb: "iam:CreatePolicyVersion"
    target_arn_template: "arn:aws:iam::${account_id}:policy/agent-platform-github-ci-apply-boundary"
    expected_decision: explicitDeny
    by_design: "The pipeline cannot rewrite the authority budget that constrains it (T2.23 non-strippable boundary)."
    why: "The pre-existing half of the S5 pair -- both ARNs asserted, so a partial edit to the Resource list fails loud."
  - id: deny-set-default-policy-version-on-reads-policy
    verb: "iam:SetDefaultPolicyVersion"
    target_arn_template: "arn:aws:iam::${account_id}:policy/agent-platform-github-ci-apply-reads"
    expected_decision: explicitDeny
    by_design: "Rolling the reads document back to an older version is the same capability as rewriting it; the Deny covers all four version verbs."
    why: "Guards the second escape hatch on the same document."
  - id: deny-self-inline-policy-write
    verb: "iam:PutRolePolicy"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-github-ci-apply"
    expected_decision: explicitDeny
    required_context_keys:
      "iam:PermissionsBoundary": "arn:aws:iam::${account_id}:policy/agent-platform-github-ci-apply-boundary"
    by_design: >-
      T2.23 self-grant break. The role/agent-platform-* write prefix MATCHES the apply role's own ARN,
      so DenySelfInlinePolicyWrite carves that ARN out explicitly. The context entry is supplied
      deliberately: the Deny must bite even on a fully in-budget request, which is the only case that
      would otherwise be allowed.
    why: "The pipeline cannot write its own inline policy -- the whole reason terraform/bootstrap is a separate root."
  - id: deny-self-detach-role-policy
    verb: "iam:DetachRolePolicy"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-github-ci-apply"
    expected_decision: explicitDeny
    by_design: >-
      This is what protects the NEW attachment. An inline policy cannot be detached, but a
      customer-managed one can -- and detaching agent-platform-github-ci-apply-reads from this role
      would strip its entire refresh-read surface, after which every subsequent CD plan fails
      AccessDenied BEFORE the guard runs. DenySelfInlinePolicyWrite's DetachRolePolicy carve-out on
      the role's own ARN is the control; this triple is its proof.
    why: "Self-DoS break, load-bearing for the policy-architecture split's rollback hazard."
  - id: deny-boundary-removal
    verb: "iam:DeleteRolePermissionsBoundary"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-simulate-probe"
    expected_decision: explicitDeny
    by_design: "The pipeline cannot strip the authority budget from itself or from any role it manages (DenyBoundaryRemoval, Resource \"*\")."
    why: "Non-strippable boundary -- unchanged by the relocation."
  - id: deny-iam-escalation-unbounded-create-role
    verb: "iam:CreateRole"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-simulate-probe"
    expected_decision: explicitDeny
    by_design: >-
      DenyIAMEscalation with NO iam:PermissionsBoundary context entry -- an unbounded role create. The
      StringNotEquals evaluates TRUE when the key is absent, so the Deny applies. See the
      deny-iam-escalation-permissions-boundary-context artifact note before "fixing" this.
    why: "The pipeline may only mint roles that carry the authority budget (T2.23 EC4)."
  - id: bounded-create-role-with-boundary-context
    verb: "iam:CreateRole"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-simulate-probe"
    expected_decision: allowed
    required_context_keys:
      "iam:PermissionsBoundary": "arn:aws:iam::${account_id}:policy/agent-platform-github-ci-apply-boundary"
    why: >-
      The same verb WITH the boundary context is allowed -- this is the pair that distinguishes the
      simulate artifact from a real gap. T2.48's allow-list inversion depends on this being allowed:
      a gated role create must EXECUTE after approval, not AccessDeny.
  - id: bounded-put-role-policy-with-boundary-context
    verb: "iam:PutRolePolicy"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-simulate-probe"
    expected_decision: allowed
    required_context_keys:
      "iam:PermissionsBoundary": "arn:aws:iam::${account_id}:policy/agent-platform-github-ci-apply-boundary"
    why: "IAMRoleWriteBounded on a NON-self agent-platform-* role; the self case is explicitDeny above."
  - id: bounded-put-role-permissions-boundary
    verb: "iam:PutRolePermissionsBoundary"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-simulate-probe"
    expected_decision: allowed
    required_context_keys:
      "iam:PermissionsBoundary": "arn:aws:iam::${account_id}:policy/agent-platform-github-ci-apply-boundary"
    why: "The fourth iam:PermissionsBoundary-conditioned verb -- boundary ATTACH is allowed, boundary REMOVE is denied."
  - id: passrole-to-lambda-allowed
    verb: "iam:PassRole"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-simulate-probe"
    expected_decision: allowed
    required_context_keys:
      "iam:PassedToService": "lambda.amazonaws.com"
    why: "rec-2831 regression anchor: AWS requires iam:PassRole on a Lambda's execution role for lambda:CreateFunction."
  - id: passrole-to-non-lambda-service-negative
    verb: "iam:PassRole"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-simulate-probe"
    expected_decision: implicitDeny
    by_design: >-
      The StringEquals on iam:PassedToService is the containment. This identity may pass an
      agent-platform-* role ONLY to the lambda service -- never to ecs, glue, or any other principal.
      If this returns `allowed`, the condition was dropped.
    required_context_keys:
      "iam:PassedToService": "ecs-tasks.amazonaws.com"
    why: "Proves the worst-verb Condition, not just the Resource scope."
  - id: trust-rewrite-outside-enumerated-roles-negative
    verb: "iam:UpdateAssumeRolePolicy"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-simulate-probe"
    expected_decision: implicitDeny
    by_design: >-
      IAMRoleReconcile keeps iam:UpdateAssumeRolePolicy at exactly two enumerated roles
      (agent-platform-github-ci-branch, agent-platform-github-ci-pr) and is deliberately NOT widened to
      role/agent-platform-*. A widened trust Resource would grant a fleet-wide trust rewrite, and
      DEP-05 (a dedicated trust-boundary control) is still open -- this narrow grant is the only
      control against it.
    why: "P1 disposition: trust is not widened by this change; the negative is what keeps that true."
  - id: trust-rewrite-on-enumerated-role
    verb: "iam:UpdateAssumeRolePolicy"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-github-ci-branch"
    expected_decision: allowed
    why: "Regression anchor for the two enumerated trust ARNs -- the narrow grant must still work."

