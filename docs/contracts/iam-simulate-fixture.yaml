  - {date: "2026-10-09", semantic_break: false, change_class: correction, summary: "PLAN-url-only-invoke-guard follow-up: the url-only-event-source-mapping-denied row now targets the bare '*' (CreateEventSourceMapping has no IAM resource type, so the Deny's Resource '*' is what the simulator must match); scripts/ci/iam_simulate.py accepts only that bare wildcard target."}
  - {date: "2026-10-09", semantic_break: false, change_class: field_add, summary: "PLAN-url-only-invoke-guard (Decision 213): six url-only rows record the boundary's URL-only Denies for the writer, reader and telemetry writer; a bool required_context_keys value is now sent as a boolean ContextKeyType by scripts/ci/iam_simulate.py. Structural budget raised 600 to 650 under Decision 213 cl.6."}
  - date: "2026-09-13"
