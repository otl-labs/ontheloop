    expected_decision: allowed
    why: >-
      aws_lambda_function's UPDATE path calls it whenever source_code_hash / s3_key / image_uri
      changes. The four DuckLake functions ignore_changes on source_code_hash (rec-2646/2654), which is
      the only reason this has not yet AccessDenied.
  - id: p1-3-publish-layer-version-prefix
    verb: "lambda:PublishLayerVersion"
    target_arn_template: "arn:aws:lambda:${region}:${account_id}:layer:agent-platform-simulate-probe"
    expected_decision: allowed
    why: >-
      P1-3: layer:agent-platform-* adopted as the layer-naming convention on BOTH the read and write
      Sids (the three ducklake-* literals are retained). Deliberately NOT layer:* (Decision 143).
  - id: p1-4-untag-oidc-provider
    verb: "iam:UntagOpenIDConnectProvider"
    target_arn_template: "arn:aws:iam::${account_id}:oidc-provider/token.actions.githubusercontent.com"
    expected_decision: allowed
    why: "iam:TagOpenIDConnectProvider was granted with no untag counterpart in either layer, so a tag-drift reconcile AccessDenied."
