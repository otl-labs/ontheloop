    why: "DenyDuckLakeDirectInvoke: a direct invoke (the key is false) is refused by the boundary whatever an identity grant says."
  - id: url-only-direct-invoke-absent-key-denied
    verb: "lambda:InvokeFunction"
    target_arn_template: "arn:aws:lambda:${region}:${account_id}:function:agent-platform-ducklake-writer"
