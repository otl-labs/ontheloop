    change_class: prose_improvement
    summary: "PLAN-agent-observability-read-axis: re-grounded the p0-4-logs-tag-resource why -- cloudtrail:LookupEvents is now granted to PlatformAdmin (rec-2906), so the prior 'AccessDenied to PlatformAdmin' premise no longer holds. The deliberate over-grant and its rationale (two tagging families, provider call ambiguous offline) are unchanged."
