schema_version: 1

principal:
  role_name: agent-platform-github-ci-apply
  arn_template: "arn:aws:iam::${account_id}:role/agent-platform-github-ci-apply"
  note: >-
    SimulatePrincipalPolicy on a role evaluates its identity policies (inline + the attached
    customer-managed agent-platform-github-ci-apply-reads document) AND its permissions boundary, so
    every decision below is the INTERSECTION verdict -- which is exactly the layer a static text
    check cannot reach. A verb granted in the identity policy but absent from the boundary's
    DataPlaneAllow ceiling shows up here as implicitDeny.

placeholders:
  account_id: "Resolved at run time from `aws sts get-caller-identity` under --profile."
  region: "Resolved at run time from the session (or --region); the platform region is eu-west-2."

expected_decision_values:
  - allowed
  - implicitDeny
  - explicitDeny

# rec-3325: verbs that authorize against MORE THAN ONE resource type -- a fixture row pinned
# against only one axis can pass and still miss a live drift on the others (this is exactly how
# the old p2-glue-delete-database row passed for the wrong reason: it pinned `database/<db>`, but
# the live grant it purported to cover was actually denied at `userDefinedFunction/<db>/*`).
# validate_iam_simulate_fixture_shape's multi-resource-type leg fails any verb below whose PRESENT
# fixture rows do not cover every listed type. glue:DeleteDatabase was armed-but-inert (zero rows)
# from rec-3325's seeding until PLAN-glue-delete-database-grant (2026-09-01) restored the
# destroy-path grant at both IAM layers and added the database + userDefinedFunction triples below
# -- per rec-3325's full 61-triple corpus sweep, it is the only genuinely multi-resource-type verb
# found.
multi_resource_type_verbs:
  glue:DeleteDatabase:
    - database
    - userDefinedFunction

# ---------------------------------------------------------------------------
# Simulate ARTIFACTS -- documented so a future auditor does not "fix" a false positive.
# ---------------------------------------------------------------------------
artifacts:
  - id: deny-iam-escalation-permissions-boundary-context
    statement: DenyIAMEscalation
    context_key: "iam:PermissionsBoundary"
    note: >-
      DenyIAMEscalation is a Deny on iam:CreateRole / iam:PutRolePolicy / iam:AttachRolePolicy with
      StringNotEquals on iam:PermissionsBoundary, and IAMRoleCreateBounded / IAMRoleWriteBounded are
      the matching conditional Allows (the same condition key also gates
      iam:PutRolePermissionsBoundary -- four verbs in total). A simulate that omits the
      iam:PermissionsBoundary context entry therefore returns explicitDeny for ALL FOUR: with the key
      absent from the request context, StringNotEquals evaluates TRUE and the Deny applies. THIS IS
      AN ARTIFACT OF THE SIMULATION, NOT A GAP. Terraform always sends PermissionsBoundary on these
      calls (every agent-platform-* role declares it in HCL, enforced by validate_boundary_attached).
      The triples below therefore supply the context entry explicitly and expect `allowed`; the
      matching no-context triples expect explicitDeny and prove the Deny still bites. Do not "fix"
      either by relaxing the Deny.
  - id: passrole-passed-to-service-context
    statement: IAMPassRoleForLambda
    context_key: "iam:PassedToService"
    note: >-
      iam:PassRole is worst-verb scoped (Decision 143) with StringEquals on
      iam:PassedToService=lambda.amazonaws.com. Simulated WITHOUT that context entry it returns
      implicitDeny -- again an artifact: lambda:CreateFunction always supplies it. The triples below
      cover both directions (with the key -> allowed; passing to a non-lambda service -> implicitDeny),
      which is what makes the containment claim testable rather than asserted.
  - id: boundary-intersection-is-invisible-to-static-checks
    note: >-
      A grant present in the identity policy but missing from the boundary's DataPlaneAllow ceiling is
      SILENTLY denied. Only this fixture observes that; scripts/checks/iam_tf/ can assert both layers
      mention a verb (VP step 1) but not that AWS actually intersects them the way we believe.

# ---------------------------------------------------------------------------
# Triples: (verb, target_arn_template, expected_decision, required_context_keys, why).
# ---------------------------------------------------------------------------
triples:
  # -- PLAN-glue-delete-database-grant (Decision 178 clause 4 drain, rec-3348/rec-3328): the two
  # live axes of the restored GlueCatalog destroy-path grant. Per multi_resource_type_verbs above,
  # glue:DeleteDatabase authorizes against BOTH the database ARN and its userDefinedFunction child
  # ARN -- a fixture row on only one axis would have passed for the wrong reason (exactly how the
  # old, removed p2-glue-delete-database row missed the userDefinedFunction gap that run
  # 33323201848 hit). --
  - id: p2-glue-delete-database-database-axis
    verb: "glue:DeleteDatabase"
    target_arn_template: "arn:aws:glue:${region}:${account_id}:database/agent_platform"
    expected_decision: allowed
    why: "Headline axis: DeleteDatabase authorizes directly against the database ARN -- granted in the GlueCatalog Sid, ceiling-covered by boundary glue:* -- both layers, or the intersection denies it."
  - id: p2-glue-delete-database-udf-axis
    verb: "glue:DeleteDatabase"
    target_arn_template: "arn:aws:glue:${region}:${account_id}:userDefinedFunction/agent_platform/simulate-probe"
    expected_decision: allowed
    why: 'The companion axis run 33323201848 AccessDenied on: DeleteDatabase also authorizes against the database''s child ARNs, not the database ARN alone -- missing this made the pre-restore grant insufficient. Wildcard-free probe name (build_triples rejects a literal "*" in a target).'

  # -- rec-2882 (P0-1): the third-instance destroy companions. THIS PAIR IS THE CLOSURE EVIDENCE. --
  - id: p0-1-list-instance-profiles-for-role
    verb: "iam:ListInstanceProfilesForRole"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-simulate-probe"
    expected_decision: allowed
    why: >-
      rec-2882. The provider's resourceAwsIamRoleDelete unconditionally calls
      deleteRoleInstanceProfiles() before DeleteRole, which calls this verb first. Its absence killed
      the live gated destroy (run 30264239445) and latched the sandbox convergence record red at
      99eb274. Granted in IAMRoleDeleteBounded AND in the boundary DataPlaneAllow -- both layers, or
      the intersection denies it.
  - id: p0-1-remove-role-from-instance-profile
    verb: "iam:RemoveRoleFromInstanceProfile"
    target_arn_template: "arn:aws:iam::${account_id}:instance-profile/agent-platform-simulate-probe"
    expected_decision: allowed
    why: >-
      rec-2882 companion #2: the SECOND call in the same provider loop. THE TARGET IS AN
      INSTANCE-PROFILE ARN, NOT A ROLE ARN, AND THAT IS THE WHOLE POINT -- this verb authorizes on
      the INSTANCE-PROFILE resource type. It shipped granted inside IAMRoleDeleteBounded at
      role/agent-platform-*, where it was INERT: present in the policy and structurally unable to
      authorize anything. The post-apply simulate sweep (3 mismatches / 63 triples) caught it, and
      simulate-custom-policy isolated the axis rather than the verb -- the same grant at
      instance-profile/agent-platform-* against an instance-profile ARN returns `allowed`, the
      role-scoped grant against a role ARN returns implicitDeny, while its former Sid siblings
      iam:DeleteRole and iam:ListInstanceProfilesForRole return `allowed` on that same role ARN. It
      now lives in its own Sid, IAMInstanceProfileDetach; the boundary DataPlaneAllow already carried
      it at Resource ["*"], so the ceiling was never the constraint. If this triple ever returns
      implicitDeny again, check the Sid's Resource axis before adding any verb.
  - id: iam-delete-role-bounded
    verb: "iam:DeleteRole"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-simulate-probe"
    expected_decision: allowed
    why: >-
      The headline verb of the rec-2882 triad. Guard classification is unchanged -- destroys still
      ROUTE to the gated Environment; this only means the approved destroy EXECUTES instead of
      AccessDenying after the human approval was spent.

  # -- P0-2: lambda function-URL config (a terraform/personal type with no write grant at all) --
  - id: p0-2-create-function-url-config
    verb: "lambda:CreateFunctionUrlConfig"
    target_arn_template: "arn:aws:lambda:${region}:${account_id}:function:agent-platform-ducklake-writer"
    expected_decision: allowed
    why: "aws_lambda_function_url create. The matching read was already covered by LambdaRead's lambda:Get* wildcard, which is why the write gap stayed invisible."
  - id: p0-2-update-function-url-config
    verb: "lambda:UpdateFunctionUrlConfig"
    target_arn_template: "arn:aws:lambda:${region}:${account_id}:function:agent-platform-ducklake-writer"
    expected_decision: allowed
    why: "aws_lambda_function_url update -- authorized on the FUNCTION ARN, not a separate resource."
  - id: p0-2-delete-function-url-config
    verb: "lambda:DeleteFunctionUrlConfig"
    target_arn_template: "arn:aws:lambda:${region}:${account_id}:function:agent-platform-ducklake-writer"
    expected_decision: allowed
    why: "aws_lambda_function_url destroy/replace."

  # -- P0-3: the SNS write surface (topic + subscription ARN axes) --
  - id: p0-3-sns-create-topic
    verb: "sns:CreateTopic"
    target_arn_template: "arn:aws:sns:${region}:${account_id}:agent-platform-alerts"
    expected_decision: allowed
    why: "aws_sns_topic create; the read side (SNSRead) already existed with no write counterpart."
  - id: p0-3-sns-set-topic-attributes
    verb: "sns:SetTopicAttributes"
    target_arn_template: "arn:aws:sns:${region}:${account_id}:agent-platform-alerts"
    expected_decision: allowed
    why: "aws_sns_topic update path."
  - id: p0-3-sns-tag-resource
    verb: "sns:TagResource"
    target_arn_template: "arn:aws:sns:${region}:${account_id}:agent-platform-alerts"
    expected_decision: allowed
    why: "default_tags forces a tag call on every taggable create -- the rec-2842 coupling, applied to SNS."
  - id: p0-3-sns-delete-topic
    verb: "sns:DeleteTopic"
    target_arn_template: "arn:aws:sns:${region}:${account_id}:agent-platform-alerts"
    expected_decision: allowed
    why: "destroy symmetry for aws_sns_topic."
  - id: p0-3-sns-subscribe
    verb: "sns:Subscribe"
    target_arn_template: "arn:aws:sns:${region}:${account_id}:agent-platform-alerts"
    expected_decision: allowed
    why: >-
      aws_sns_topic_subscription create -- authorized against the bare TOPIC arn, which is why this
      one verb of the three subscription-lifecycle verbs SURVIVES the by-design denial below:
      sns:Subscribe genuinely takes the topic resource type.
  - id: p0-3-sns-set-subscription-attributes
    verb: "sns:SetSubscriptionAttributes"
    target_arn_template: "arn:aws:sns:${region}:${account_id}:agent-platform-alerts:simulate-probe-subscription"
    expected_decision: implicitDeny
    by_design: >-
      UNSCOPEABLE, THEREFORE UNGRANTED. The superseded record here claimed a subscription's
      <topic-arn>:<uuid> ARN made this verb authorizable via SNSTopicWrite's agent-platform-alerts:*
      Resource entry. That is DISPROVEN: sns:SetSubscriptionAttributes has NO resource type in SNS's
      IAM model. Proof (simulate-custom-policy) -- a wildcard grant (Resource ["*"]) simulated
      against the target `*` returns `allowed`, while the SAME wildcard grant simulated against
      either the topic ARN or a subscription ARN returns implicitDeny; sibling verbs in the same Sid
      (sns:CreateTopic, sns:SetTopicAttributes, sns:Subscribe) return `allowed` at the topic ARN,
      which isolates the resource-type axis rather than the grant. Making it work therefore requires
      an account-wide Resource "*" grant, letting one approved CD apply reconfigure ANY subscription
      in the account -- refused under Decision 143 worst-verb enumeration. The verb and the now-inert
      agent-platform-alerts:* Resource entry were both removed from SNSTopicWrite.
      ACCEPTED CONSEQUENCE: a non-default raw_message_delivery / filter_policy change on
      aws_sns_topic_subscription.alerts_email AccessDenies through CD and needs an admin apply.
    why: "Subscription-mutation containment: topic-scopable verbs are granted, unscopeable ones are not."
  - id: p0-3-sns-unsubscribe
    verb: "sns:Unsubscribe"
    target_arn_template: "arn:aws:sns:${region}:${account_id}:agent-platform-alerts:simulate-probe-subscription"
    expected_decision: implicitDeny
    by_design: >-
      UNSCOPEABLE, THEREFORE UNGRANTED -- identical proof and identical refusal to
      p0-3-sns-set-subscription-attributes above (no resource type in SNS's IAM model; wildcard grant
      + wildcard target = allowed, any ARN target = implicitDeny; an account-wide Resource "*" would
      let one approved CD apply unsubscribe ANY subscription in the account).
      ACCEPTED CONSEQUENCE: destroying or REPLACING aws_sns_topic_subscription.alerts_email through
      CD AccessDenies and needs an admin apply. Note this is a REPLACE hazard too, not only an
      explicit destroy -- any diff that forces replacement of the subscription hits the destroy half.
    why: "Subscription-destroy containment: the create half (sns:Subscribe) is topic-scoped and stays granted."

  # -- P0-4: the CloudWatch Logs tagging families (deliberately over-granted, see why) --
  - id: p0-4-logs-untag-log-group
    verb: "logs:UntagLogGroup"
    target_arn_template: "arn:aws:logs:${region}:${account_id}:log-group:/aws/lambda/agent-platform-ducklake-writer"
    expected_decision: allowed
    why: "logs:TagLogGroup was granted with no untag counterpart, so a default_tags drift reconcile AccessDenied."
  - id: p0-4-logs-tag-resource
    verb: "logs:TagResource"
    target_arn_template: "arn:aws:logs:${region}:${account_id}:log-group:/aws/lambda/agent-platform-ducklake-writer"
    expected_decision: allowed
    why: "DELIBERATE OVER-GRANT. CloudWatch Logs has two tagging families (legacy TagLogGroup/UntagLogGroup and resource-generic TagResource/UntagResource); which one provider 5.100 calls on create was undetermined offline. Both are granted at the same non-escalating log-group prefix. cloudtrail:LookupEvents is now granted to PlatformAdmin (rec-2906) to resolve this; until run, both stay granted."
  - id: p0-4-logs-untag-resource
    verb: "logs:UntagResource"
    target_arn_template: "arn:aws:logs:${region}:${account_id}:log-group:/aws/lambda/agent-platform-ducklake-writer"
    expected_decision: allowed
    why: "Second half of the resource-generic tagging family; same over-grant rationale."

  # -- P0-5: S3 bucket-config writes --
  - id: p0-5-put-bucket-versioning
    verb: "s3:PutBucketVersioning"
    target_arn_template: "arn:aws:s3:::agent-platform-data-lake"
    expected_decision: allowed
    why: "aws_s3_bucket_versioning apply; the read half (DataLakeBucketManage) existed with no write counterpart."
  - id: p0-5-put-bucket-policy
    verb: "s3:PutBucketPolicy"
    target_arn_template: "arn:aws:s3:::agent-platform-data-lake"
    expected_decision: allowed
    why: "aws_s3_bucket_policy create/update."
  - id: p2-delete-bucket-policy
    verb: "s3:DeleteBucketPolicy"
    target_arn_template: "arn:aws:s3:::agent-platform-data-lake"
    expected_decision: allowed
    why: "P2 destroy/replace symmetry: the provider deletes then re-puts on a policy change."
  - id: p2-create-bucket
    verb: "s3:CreateBucket"
    target_arn_template: "arn:aws:s3:::agent-platform-ducklake-catalog-dr"
    expected_decision: allowed
    why: "Bucket re-create on a greenfield or replaced bucket, at the two literal bucket ARNs only."

  # -- P0-6: Secrets Manager, the two-Sid split (S2). METADATA prefix vs VALUE-CAPABLE enumeration. --
  - id: p0-6-create-secret-prefix
    verb: "secretsmanager:CreateSecret"
    target_arn_template: "arn:aws:secretsmanager:${region}:${account_id}:secret:agent-platform-simulate-probe-fixture"
    expected_decision: allowed
    why: "SecretsManagerMetadataWrite at secret:agent-platform-*. Metadata-only: cannot read or overwrite a VALUE."
  - id: p0-6-delete-secret-prefix
    verb: "secretsmanager:DeleteSecret"
    target_arn_template: "arn:aws:secretsmanager:${region}:${account_id}:secret:agent-platform-simulate-probe-fixture"
    expected_decision: allowed
    why: "Retirement of an agent-platform-* secret; AWS's 7-30 day recovery window bounds the blast radius."
  - {id: p0-6-update-secret-enumerated, verb: "secretsmanager:UpdateSecret", target_arn_template: "arn:aws:secretsmanager:${region}:${account_id}:secret:agent-platform-deepseek-api-key-fixture", expected_decision: allowed, why: "One of exactly two ENUMERATED terraform/personal secret ARNs (S2); UpdateSecret is value-capable with no metadata-only variant, a worst verb under Decision 143 clause 1."}
  - {id: secret-parameter-dsn-put, verb: "ssm:PutParameter", target_arn_template: "arn:aws:ssm:${region}:${account_id}:parameter/secret/ducklake-neon-catalog-dsn", expected_decision: allowed, why: "SecretParameterDsnWrite: the one Terraform-managed secret parameter (Decision 237 cl.3)."}
  - {id: secret-parameter-out-of-band-put-negative, verb: "ssm:PutParameter", target_arn_template: "arn:aws:ssm:${region}:${account_id}:parameter/secret/neon-api-key", expected_decision: implicitDeny, why: "CI never writes an out-of-band secret value (Decision 237 cl.3)."}
  - {id: secret-parameter-inference-read-negative, verb: "ssm:GetParameter", target_arn_template: "arn:aws:ssm:${region}:${account_id}:parameter/secret/agent-platform-deepseek-api-key", expected_decision: implicitDeny, why: "CI reads exactly three /secret/ parameters; the inference keys are consumed by the agent runtime, not CI (Decision 237 cl.2)."}
  - id: p0-6-update-secret-non-enumerated-negative
    verb: "secretsmanager:UpdateSecret"
    target_arn_template: "arn:aws:secretsmanager:${region}:${account_id}:secret:agent-platform-simulate-probe-fixture"
    expected_decision: implicitDeny
    why: >-
      THE LOAD-BEARING NEGATIVE for S2. There is NO boundary intersection available to narrow
      UpdateSecret -- DataPlaneAllow already carries secretsmanager:* -- so the identity policy is the
      SOLE control and a secret:agent-platform-* prefix here would be fully effective over every
      current AND future agent-platform-* secret with no review. If this triple ever returns
      `allowed`, the enumeration was replaced by a prefix: treat it as a security regression, not a
      fixture error.
  - id: p0-6-put-secret-value-negative
    verb: "secretsmanager:PutSecretValue"
    target_arn_template: "arn:aws:secretsmanager:${region}:${account_id}:secret:agent-platform-simulate-probe-fixture"
    expected_decision: implicitDeny
    by_design: >-
      secretsmanager:PutSecretValue is granted NOWHERE new by this change. It exists only on the
      pre-existing SecretsManagerDuckLakeNeonDSN Sid, at that single secret ARN, because the apply
      role assembles the Neon DSN. A prefix-wide PutSecretValue would let one approved apply overwrite
      the Anthropic/DeepSeek inference keys and the GitHub PAT.
    why: "Value-write containment: metadata verbs take the prefix, value verbs do not."
  - id: p2-delete-secret-ducklake-dsn
    verb: "secretsmanager:DeleteSecret"
    target_arn_template: "arn:aws:secretsmanager:${region}:${account_id}:secret:ducklake-neon-catalog-dsn-fixture"
    expected_decision: allowed
    why: "P2 destroy symmetry on the DSN secret's own Sid: CreateSecret was granted there with no delete counterpart."

  # -- P0-7: SSM parameter provisioning (rescoped from feature-flags/* to agent-platform/*) --
  - id: p0-7-put-parameter
    verb: "ssm:PutParameter"
    target_arn_template: "arn:aws:ssm:${region}:${account_id}:parameter/agent-platform/ducklake/writer-url"
    expected_decision: allowed
    why: >-
      The old Sid was pinned to /agent-platform/feature-flags/*, while terraform/personal now declares
      aws_ssm_parameter resources elsewhere under /agent-platform/ (the T2.19 endpoint-discovery
      parameters) -- those writes AccessDenied. Read and write scope are now at parity.
  - id: p0-7-delete-parameter
    verb: "ssm:DeleteParameter"
    target_arn_template: "arn:aws:ssm:${region}:${account_id}:parameter/agent-platform/ducklake/writer-url"
    expected_decision: allowed
    why: "Create/destroy asymmetry: PutParameter had no delete counterpart, so a retirement AccessDenied after approval."
  - id: p0-7-delete-parameters-plural-negative
    verb: "ssm:DeleteParameters"
    target_arn_template: "arn:aws:ssm:${region}:${account_id}:parameter/agent-platform/ducklake/writer-url"
    expected_decision: implicitDeny
    by_design: >-
      The PLURAL form is not granted: hashicorp/aws 5.100 uses the singular ssm:DeleteParameter for
      aws_ssm_parameter. Granting the batch verb would add a capability terraform never exercises. If
      a provider bump migrates to the plural form, this triple flips to `allowed` -- which is exactly
      the signal the provider-bump re-run exists to catch.
    why: "Recorded so a later sweep does not re-flag the singular/plural pair as an oversight."

  # -- P1/P2 granted judgement calls --
  - id: p1-2-update-function-code
