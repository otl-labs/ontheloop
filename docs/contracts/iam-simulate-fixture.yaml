  - id: anchor-logs-create-log-group
    verb: "logs:CreateLogGroup"
    target_arn_template: "arn:aws:logs:${region}:${account_id}:log-group:/aws/lambda/agent-platform-simulate-probe"
    expected_decision: allowed
    why: "DEP-01 grant; its tagging companions are the P0-4 triples above."
  - id: anchor-tag-role
    verb: "iam:TagRole"
    target_arn_template: "arn:aws:iam::${account_id}:role/agent-platform-simulate-probe"
    expected_decision: allowed
    why: >-
      rec-2842 regression anchor (instance 2 of the class): default_tags forces a TagRole call on
      every role create, so iam:CreateRole at role/agent-platform-* structurally requires iam:TagRole
      at the SAME prefix.

