invariants:
  location:
    statement: >-
      Every path touched by an implement-leg diff (a diff whose resolved plan's
      `implementation_declared` newly flipped true) must be a member of EITHER the resolved
      plan's declared `scope[].file` union, OR a path a `sanction_rows` entry derives for that
      plan because the row's trigger fired. A touched path outside both is never resolved by
      editing the plan's own `scope:` list to add it after the fact -- see
      sanction_rows.implementing_plan_bookkeeping.disposition_on_violation below.
    enforcement:
      check: validate_scope_boundary
      tiers: [pre, full]
    authority: >-
      Decision 59 (2026-05-01): "scope guard becomes a deterministic diff-vs-plan check." This
      contract discharges that commitment; it does not invent the rule.
    known_gaps:
      - >-
        Deleted paths: `_common.get_changed_files` existence-filters a deleted path out of its
        result entirely, so a check seeded from that primitive would never see a deletion at
        all; only `_common.get_status_aware_diff`'s "D" rows carry a deleted path. The seam
        choice therefore decides whether a deletion is even visible to this invariant --
        validate_scope_boundary is seeded from get_status_aware_diff specifically so a deletion
        outside declared scope is caught, not silently invisible.
  content:
    statement: >-
      No acceptance criterion, VP step, assertion, or budget is weakened to obtain green.
      Weakening is never resolved inline by softening the check, the test, or the plan describing
      it -- it routes to a recommendation via the ops portal, whatever file it happens to live in.
    authority: >-
      Decision 181 (standing prohibition, this plan). Decision 163 point 2 names the
      declared-vs-executed failure mode this coverage map exists to avoid repeating: a universal
      obligation stated only as prose, with nothing executable asserting it held.
    review_dispositions:
      refactor: "The same or a stronger check survives; cite where it now lives as file.py::name."
      planned-change: "The plan changes this behaviour; cite its acceptance_criteria[N] or test_obligations[N]."
      retirement: "The tested subject is deleted in the same diff; cite the deleted path or file.py::name."
      growth-safe-pin: "An exact pin became a growth-safe invariant (tests/CLAUDE.md test-count coupling); cite it as file.py::name."
      owned-skip: "A skip added to an existing test file, or gained by a test moved out of one, that cites a rec or carries an env: label; cite that rec-NNNN or env: label."
      weakening: "None of the above. Restore the check, or route it to a recommendation via the ops portal; never inline."
    enforcement_coverage:
      - surface: "plan-field edit (scope / acceptance_criteria / verification_plan command+expected)"
        status: mechanical
        enforced_by: validate_scope_boundary
        note: >-
          sanction_rows.implementing_plan_bookkeeping.prohibited_field_edits below -- a diff
          touching one of those fields on a resolved plan fails this check directly.
      - surface: "VP-step substitution (an easier command silently swapped in for a plan's declared step)"
        status: mechanical
        enforced_by: validate_scope_boundary
        note: >-
          Same prohibited_field_edits row as the plan-field arm above (verification_plan[].command
          / verification_plan[].expected) -- attribution is exact: validate_vp_replay replays only
          a plan's CURRENT steps and holds no base-version comparison, so it cannot catch a step
          that was quietly weakened before replay; its real contribution is catching a
          self-reported-but-false PASS against whatever text is currently declared. This check,
          not validate_vp_replay, is what catches the softening itself.
      - surface: "prose / SLOC / structural-size budget raise"
        status: mechanical
        enforced_by: "validate_prose_budget_raises, validate_sloc_budget_raises, validate_structural_size_budget_raises"
        note: "The three raise-gate guards (Decision 128/165) -- an unmarked budget increase fails the PR."
      - surface: "check-fleet tier membership (pre / full_segment / pre_globs narrowing on a manifest Entry)"
        status: mechanical
        enforced_by: validate_tier_demotion_markers
        note: >-
          PLAN-verifier-weakening-guards (LSA-01 leg a, Decision 187): a tier demotion is a
          direction-gated transition, derived from the git base ref, gated behind a
          `# tier-demotion-approved: dec-NNN <reason>` marker whose cited Decision body names the
          check by name; a still-sequenced Entry's removal has no marker escape at all.
      - surface: "pre_globs under-declaration (a gated check's globs failing to cover its own import closure)"
        status: mechanical
        enforced_by: validate_pre_glob_closure
        note: >-
          LSA-06 (PLAN-loop-spec-audit-tail): distinct from the tier-membership row above, which
          gates a NARROWING transition against the git base ref -- this check is base-ref-blind
          and BLOCKING on the current tree's own state: any gated Entry whose pre_globs do not
          cover its own transitive import closure (minus the derived inert-module floor) fails
          --pre outright, whether the gap was introduced today or has always been there. Also
          gates an unauthorized _PRUNED_EDGES row addition or target-count growth via the sibling
          `pruned-edge-approved` marker (rec-3558) -- see docs/contracts/marker-grammar.yaml.
      - surface: "a skip/xfail/importorskip site added in tests/** with neither a rec citation nor an env: label"
        status: mechanical
        enforced_by: validate_test_skip_citations
        note: >-
          Exceptionless, with no marker, waiver or grandfather (Decision 163 point 1): every site added against the
          diff base (a skip, skipif or xfail mark; a unittest skip or expectedFailure decorator; a pytest.skip,
          pytest.xfail or pytest.importorskip call) must cite a rec-NNNN in its reason, routing the weakening to a
          recommendation as this invariant requires, or label itself an environment guard with an "env: " prefix.
          The check proves the token's presence only; whether the rec is real and the env label honest is judged in
          code review, where validate_weakening_candidates lists every skip added to an existing test file or gained
          by a test moved out of one; any other added skip in a new test file is judged by this check alone.
      - surface: "a weakening candidate on an implement PR with no recorded disposition, one recorded as weakening, or one whose cite resolves to nothing"
        status: mechanical
        enforced_by: validate_weakening_dispositions
        note: >-
          On a diff that flips a plan's implementation_declared to true, every item validate_weakening_candidates
          lists must match exactly one entry in the resolved plans' weakening_dispositions (keyed "[category]
          path::node"), carrying one review_dispositions key other than weakening and a cite that resolves under that
          key's rule above (its referent must resolve -- for retirement, deleted by this diff; whether it justifies the
          label is review's judgement -- Decision 165's existence-versus-authorization distinction); no entry may name a candidate the diff no longer has. Exceptionless, with no marker or waiver. It proves that every candidate
          received a recorded disposition whose cite resolves -- not that the disposition is right, nor whether code
          review or the implementing agent wrote it. Diffs that flip no plan are not gated; the report still lists
          their candidates. That includes Decision 226's fast-lane repair PRs (red-main-recovery.yaml procedure.fast_lane_repair), which change only tests/** with no plan and record their dispositions in the PR body; making that structural is rec-4442.
      - surface: "an assertion or numeric tolerance weakened inside an in-scope source or test file"
        status: residual_agent_obligation
        residual_owner: "rec-4413"
        note: >-
          The DOMINANT form of weakening in practice, not one coverage row among peers. Narrowed from rec-3357: telling
          a corrected assertion or tolerance from a quietly loosened one is the test-oracle problem, which no
          deterministic check decides. validate_weakening_candidates (report-only, never fails) lists these syntactic
          candidates in a diff -- a removed or changed assertion, a removed or weaker-moved test, a deleted test file, a
          skip added to an existing test file, a widened tolerance, a changed numeric constant in scripts/ or src/ --
          code review gives each a disposition from
          review_dispositions above, raising High for a weakening or a missing one, and validate_weakening_dispositions
          makes recording every disposition, with a cite that resolves, mandatory on implement PRs. Whether a
          disposition is correct, and who wrote it, remains a reviewer obligation, not mechanical coverage. Measured 2026-09-01..2026-10-17: 66 of
          226 implement merges carried a pre-existing test that lost an assertion, and 0 of 24 sampled were quiet
          weakenings. This is the SOLE residual row in this map.
    known_residuals:
      - >-
        The R6 split's own residual: only the PRESENCE of Decision 181's pointer to this
        contract's CONTENT clause is pinnable (tests/test_scope_boundary_contract.py). A
        paraphrase re-inlined into Decision 181's own body, instead of citing this contract,
        stays an agent obligation -- deliberately OUTSIDE the CONTENT enforcement-coverage map
        above, since Decision-181-paraphrase drift is not one of CONTENT's own surfaces.
    earned_autonomy:
      # Decision 235 governance note: a SIBLING of enforcement_coverage, never a row in it. It carries only what the Decision cannot
      # -- check names, paths and derivation mechanics; Decision 235's clauses carry the rules and are never restated here.
      status: design_only
      authority: "Decision 235 (amends Decision 181 clause 1 and Decision 187 clauses 3-5)."
      change_class: >-
        Derived at the base ref, never enumerated: a change that weakens a surface of enforcement_coverage above; one that needs a
        down-direction or loosening token of docs/contracts/marker-grammar.yaml (at authoring: tier-demotion-approved,
        schedule-removal-approved, baseline-lowered, baseline-raised, pruned-edge-approved, and raise-approved's contract-population.yaml
        ratchet.grandfathered_max use through validate_contract_drift, a loosening rather than a size budget); or a
        validate_weakening_candidates item whose only truthful review_dispositions key is weakening. Outside it: raise-approved size budgets
        and the prohibited_field_edits below. Tokens carry only a direction today, so the loosening leg has no grammar field yet: the build
        adds one before that leg can be derived rather than enumerated.
      evidence: >-
        Producer paths join config/agent/executor/capabilities.yaml boundary_patterns. Mutation-on-target is T3.7's mutmut leg (Python
        only); a target it does not reach keeps the entry rung until a per-hunk or per-key revert operator exists at the base ref, built under
        T3.7 c8 from the nearest primitive, the covered_changed revert in scripts/verification_graduation.py run_verifier_differential (per
        file today). The whole-tree revert differential (run_differential) is never redundancy evidence.
      floor:
        - "judge: any check guarding a path a boundary_patterns entry matches"
        - "secret scanning: every hook .pre-commit-config.yaml declares, block-sensitive-identifiers and detect-secrets among them (over-inclusive by design)"
        - "the ladder's own checks: every used_by check of every marker-grammar.yaml token, every enforced_by check above, and the lane's controller, shadow recorder and evidence producer once built"
      build_surfaces:
        - "marker-grammar.yaml: an evidence-record authorization kind bound through scripts/checks/_marker_guard.py, accepted by validate_tier_demotion_markers"
        - "review_dispositions: an evidence-cited key whose cite resolves to a lane evidence record at the base ref, checked by validate_weakening_dispositions"
        - "check manifests (scripts/checks/<domain>/_manifest.py): a shadow tier state whose exits are restore (free) or drop (evidence-gated)"
      coverage: "none enforced (Decision 181 clause 2); homes T3.4 c3, T4.4 c7-c8, T3.7 c8; missing map rows: rec-4556."

# Evidence-derived (11 measured implement commits: diff files vs each commit's own declared
# scope). Dominant out-of-scope category was config/agent/verification_registry/entries/*.yaml
# graduated shards, then docs/decisions-index.json; the long tail was genuine undeclared
# deviation. Conditional trigger -> derived-path(+prohibited) rows -- never a flat path allowlist.
# `trigger.kind` is the sanction_kind validate_scope_boundary.py dispatches on; a row naming a
# kind the check does not implement FAILS loudly (never a silent pass).
sanction_rows:
  graduated_registry_shard:
    purpose: >-
      A GRADUATED verification_plan step (graduation: graduate) owes its own
      config/agent/verification_registry/entries/<graduation_check_id>.yaml shard, written by the
      Verification Graduation walk AFTER the VP Compliance Gate -- necessarily untracked/new at
      the point the plan itself declared the step, so it can never be a pre-declared scope row.
    trigger:
      kind: graduation_check_id_per_step
      description: >-
        Fires once per resolved plan's verification_plan step whose graduation == "graduate" and
        graduation_check_id is non-empty.
    sanctions:
      path_template: "config/agent/verification_registry/entries/{graduation_check_id}.yaml"
    prohibited_field_edits: []
  implementing_plan_bookkeeping:
    purpose: >-
      The resolved plan's own path is always touched (implementation_declared flips true in the
      same diff) plus whatever bookkeeping the implement workflow stages on it -- sanctioned, but
      only for a bounded field set.
    trigger:
      kind: resolved_plan_path
      description: "Fires once per resolved plan, sanctioning that plan's own path."
    sanctions:
      description: "The resolved plan's own repo-relative path."
    permitted_field_edits:
      - implementation_declared
      - "verification_plan[].graduation"
      - "verification_plan[].graduation_check_id"
      - "verification_plan[].graduation_waiver_reason"
      - closes_criteria
      - followon_recs
      - weakening_dispositions
    prohibited_field_edits:
      - acceptance_criteria
      - scope
      - "verification_plan[].command"
      - "verification_plan[].expected"
      - "verification_plan[].expected_literals"
    disposition_on_violation: >-
      STOP: an undeclared touched path is never resolved by editing the plan's own scope -- the
      escape is a human-directed plan amendment landed as its own reviewed act, never a unilateral
      append. A prohibited_field_edits hit is reported the same way: the field changed, not
      silently accepted because the diff happened to land on the plan file itself.
    amendment_procedure: >-
      When a plan's own scope is legitimately unsatisfiable in a single diff -- e.g. a scope
      amendment and the diff that depends on it being already-landed cannot both be true of the
      same commit -- the escape is two acts, never a unilateral single-diff append: first, the
      scope amendment lands on `main` as its own reviewed PR; second, the implement diff for the
      original plan is then read against that amended base ref, so its own declared scope already
      covers what would otherwise be an undeclared touched path. A single diff attempting both at
      once is unsatisfiable by construction -- that is the guard working as designed, not a defect
      to route around. The same two acts fix a prohibited_field_edits hit -- a VP command, expected or expected_literals
      authoring bug found during /implement: the build STOPs, a plan-text-only PR (commit subject
      `plan({slug}): scope amendment -- <reason>`, directed per deviation_trigger.escalation) lands first,
      then the build resumes on the amended base. The plan lint and wording check (planning Step 8b) exist to find both
      cases before handoff.
  decisions_index_regeneration:
    purpose: >-
      docs/decisions-index.json is a generated projection of docs/DECISIONS.md
      (scripts.decisions_index); any plan whose declared scope includes DECISIONS.md
      mechanically regenerates this companion, which can never be pre-declared as its own scope
      row without the plan author hand-tracking a derived artefact.
    trigger:
      kind: scope_contains_file
      file: docs/DECISIONS.md
      description: "Fires when the resolved plan's declared scope includes docs/DECISIONS.md."
    sanctions:
      path_template: "docs/decisions-index.json"
    prohibited_field_edits: []
  secrets_baseline_regeneration:
    purpose: >-
      The detect-secrets pre-commit hook rescans the whole repo and force-writes
      .secrets.baseline (line_number/generated_at churn, plus any newly-detected secret-shaped
      literal) whenever a commit touches a file the hook scans -- a mechanically-generated
      companion no plan author can avoid producing once their own scope files trip a hit.
    trigger:
      kind: scope_file_in_secrets_baseline
      baseline_path: .secrets.baseline
      description: >-
        Fires when the resolved plan's DECLARED scope (never the derived sanctioned set) contains
        at least one filename that is a results-map key of .secrets.baseline, computed as the
        union of the key set in the working tree and the key set at the diff base ref. Known
        residual: detect-secrets rescans the whole repo, so a regeneration can add baseline keys
        for files OUTSIDE the regenerating plan's own scope -- observed at 939eb789, whose
        baseline delta added a key for docs/plans/PLAN-terraform-state-triggers-restore.yaml, a
        file outside that change's own subject matter -- so this predicate is narrower than the
        condition that forces the write. An alternative framing was considered and rejected:
        intersecting the DIFF's changed files (rather than the plan's declared scope) with the
        baseline key set would match the forcing condition exactly and close this residual, but
        every other row in this map derives from plan properties, not diff properties, and
        sanctioning the diff from the diff is near-circular. Both residual shapes -- a scope file
        outside the baseline, and a baseline key reached only through another row's derived path
        -- still STOP, by design; all three measured occurrences are covered by the predicate as
        written, so this is a declaration gap, not a design refutation.
    sanctions:
      path_template: ".secrets.baseline"
    prohibited_field_edits: []
  roadmap_liveness_baseline_shrink:
    purpose: >-
      A plan whose declared scope includes docs/ROADMAP-PLATFORM.yaml and whose diff drains an id
      from the live toxic set forces a shrink edit to config/roadmap_liveness_baseline.yaml. Leg
      A(a) (every id in the live measured toxic set must appear in the baseline) and leg A(d) (a
      baselined id the live roadmap no longer reports toxic FAILS until removed) jointly pin
      baseline entries to exactly toxic_node_ids(live roadmap), so this row grants no
      entry-level freedom. Growth is refused independently by leg A(b)'s frozen _BASELINE_SEED
      cross-check and leg A(c)'s shrink-only base diff -- the in-PR procedure is leg A(d)'s own
      failure message, which names the exact ids to remove. The row covers only the drained-id
      removal and the header comment block's now-stale count/rec-list prose, never growth, and
      never the _BASELINE_SEED constant or algorithm edits validate_roadmap_liveness.py itself
      makes (docs/contracts/roadmap-liveness.yaml, scripts/platform_roadmap_liveness.py), which
      stay outside declared scope and STOP. Named _shrink, not _regeneration -- no tool
      regenerates this file.
    trigger:
      kind: scope_contains_file
      file: docs/ROADMAP-PLATFORM.yaml
      description: "Fires when the resolved plan's declared scope includes docs/ROADMAP-PLATFORM.yaml."
    sanctions:
      path_template: "config/roadmap_liveness_baseline.yaml"
    prohibited_field_edits: []
  prose_budgets_ratchet_down:
    purpose: >-
      validate_prose_limits fails an entry of config/prose_budgets.yaml measured below its budget, so a plan whose
      declared scope shrinks a prose-gated surface (an S1 root load-set member, or an S2/S4/S8 path key) must lower
      that entry. The grant is decrease-only and checked: any other byte change, a raise included, leaves the path
      unsanctioned and STOPs. Raises stay with validate_prose_budget_raises (Decision 128/165).
    trigger:
      kind: scope_file_is_prose_gated
      registry_path: config/prose_budgets.yaml
      description: "Fires when the resolved plan's declared scope contains a prose-gated surface."
    sanctions:
      path_template: "config/prose_budgets.yaml"
    prohibited_field_edits: []

# TOP-LEVEL, a sibling of sanction_rows -- never nested inside it, where validate_scope_boundary's
# row loop would read it as a row declaring no trigger.kind and fail loudly.
sanction_row_eligibility:
  eligible: >-
    A path a tool mechanically regenerates as a consequence of an in-scope edit, or a hand-edited registry whose every
    entry an independent check pins to measured state and whose grant that check or this row's evaluator limits to a
    shrink or decrease-only diff (roadmap_liveness_baseline_shrink, prose_budgets_ratchet_down); either way its content
    is independently governed (a schema, a check, or an upstream source of truth) rather than hand-authored assertions.
  ineligible: >-
    Hand-written test files. A sanction row grants "may be touched without declaration"; widening
    that over tests/** conflicts with the CONTENT enforcement-coverage map's dominant residual
    (residual_owner rec-4413, narrowed from rec-3357: an assertion or numeric tolerance weakened inside an in-scope source
    or test file) -- a hand-written test is not a mechanically-generated companion, so a row
    covering one would grant undeclared-edit cover to exactly the surface that residual already
    names as CONTENT's hardest-to-catch weakening vector. Precedent:
    tests/docs/test_project_context.py, whose hardcoded roadmap_tier_id_set fingerprint literal
    coupled every legitimate stamp refresh to an out-of-scope test edit; the remedy was fixing the
    hardcoded derived value at its source (replacing the literal with the stamp grammar its
    consumer actually reads), never a sanction row. rec-3586 was narrowed to its one surviving
    item accordingly -- its remaining hardcoded-count mirror-test companion stays permanently
    ineligible under this rule. Two further companions are declared at plan time, never sanctioned:
    tests/test_session_preflight_decomposition.py's frozen_report_key set (a hand-written freeze, rec-3545) and
    config/structural_size_budgets.yaml (a raise is a planned, Decision-cited exception, Decisions 128/165/166; rec-3586's
    surviving item). The plan lint (scripts.roadmap.plan_obligations) surfaces both before handoff.

# Companions this file deliberately does NOT model as a sanction row -- each appeared in only 1 of
# the 11 measured commits, below the evidence bar for a trigger rule. A STOP on either today is
# deliberate, not an oversight; widen sanction_rows in a reviewed edit if traffic grows.
unmodelled_companions:
  - path: config/composite_action_body_baseline.yaml
    reason: "Regenerated by the R3 ratchet (Decision 162) when an inline composite-action body's line count baseline shifts; too rare (1/11) to derive a trigger from yet."

deviation_trigger:
  branches:
    - id: a
      name: in_scope_under_specification
      description: >-
        The plan's scope is right but a detail is under-specified. Decide inline; consult
        model:"fable" per .claude/skills/overseer/SKILL.md's Fable Advice-Consult Protocol when
        the call is load-bearing or novel. Record the decision either way.
    - id: b
      name: scope_or_contract_deviation
      description: >-
        A touched path is outside the declared scope union sanctioned companions, or any other
        always-ask surface is implicated. STOP: an undeclared touched path is never resolved by
        editing the plan's own scope -- the escape is a human-directed plan amendment landed as
        its own reviewed act, never a unilateral append. No Fable consult proceeds past this
        branch.
    - id: c
      name: repeated_failure
      description: >-
        A VP step has failed repeatedly. Defer to the existing 3-fix-attempt STOP and VF-08
        nondeterminism rules in .claude/skills/implement/SKILL.md -- cited, not restated here.
        T3.19's auto-file-a-rec path stays deferred; this branch adds no such path.
  escalation: >-
    Branches b and c in a coordinated session (a project coordinator now, a Decision 185 engine later): the build parks and
    sends the coordinator one plan-defect report -- plan, branch, failing_check (check name or VP step), evidence (command,
    exit code, first failing lines), defect_class (scope_companion | vp_text | approved_text | contract | repeated_failure)
    and proposed_amendment. The coordinator routes it to the plan's owning planning session, never build to planner
    directly (Decision 229 cl.2). That session lands a re-critiqued amendment per amendment_procedure under the human's
    standing direction; an approved_text or contract fix, or any loosened assertion, still needs the human's own approval,
    and nothing is loosened to obtain green (Decisions 181, 235). The build resumes on the amended base. A defect the
    session finds is not the plan's, and any report without a coordinator, goes to the human.
