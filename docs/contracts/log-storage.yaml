# Registry YAML for JSONL log-storage patterns. A Class D mechanism contract
# (migration-step-3-grandfathering, T2.56 migration step 3) as of the `contract:` block below.
#
# Purpose: machine-readable registry of JSONL log-storage patterns and the routing block
# consumed by scripts/s3_log_store.py. Supersedes the prose boundary contract (Decision 86).
contract:
  id: log-storage
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "PLAN-t115-log-storage-yaml (T-1.15)"
  description: >-
    Class D mechanism-contract envelope for this file (migration-step-3-grandfathering, T2.56
    migration step 3). The pattern/routing body itself is unchanged by this envelope.
  subject: log-storage
  evaluator:
    check: validate_log_storage_registry

amendment_log:
