      patterns.locally_produced.examples -- the full recommendations cache is retired and no longer
      produced. Corrected the locally_produced consumer line, which called a git-tracked local
      file the source of truth; for ops_* tables the warehouse is.
  - date: "2026-09-22"
    semantic_break: false
    change_class: accepted_values_narrow
    summary: >-
      PLAN-t2-26-retire-ops-session-log (T2.26): removed routing.ops_table_routing -- the map's
      sole entry (.session-telemetry.jsonl -> ops_session_log) routed to a table CD.40 retired
      (never provisioned in the personal account). scripts/s3_log_store.py's parallel
      _OPS_TABLE_ROUTING / FALLBACK_OPS_TABLE_ROUTING / get_ops_table_routing() were deleted in
      the same plan, so the routing-map parity arm this contract fed is retired, not relaxed
      (Decision 181; Decision 170 examined()/skipped() channel unaffected). Retired both
      death-dated sentinel sentences naming the table: the top-level `note`'s "remaining
      ops_session_log sentinel is death-dated" clause, and priority_queue.legacy_producer.note's
      "the s3_log_store sentinel repoints at T2.26" clause. patterns.locally_produced.examples is
      deliberately untouched -- .session-telemetry.jsonl still resolves via the gitignored arm
      (.gitignore:134) and dropping it would shrink test_log_storage_examples_resolve.py's
      enforced domain with no criterion requiring it (Decision 181).
  - date: "2026-08-26"
    semantic_break: false
    change_class: accepted_values_narrow
    summary: >-
      Platform cleanse: dropped .retro-lite-log.jsonl, .execution-step-telemetry.jsonl and
      .north-star-log.jsonl from patterns.locally_produced.examples -- none resolves to a tracked,
      gitignored, or runtime-routed target any more (the first two were deleted by the sweep; the
      third lost its only arm when logs/ stopped carrying any git-tracked file and the file-router
      logs/ runtime routes were removed with it). Also removed the OpsWriter write-through wording
      from `note` and priority_queue.legacy_producer.note -- OpsWriter no longer exists. The routing
      block is unchanged (it stays parity-bound to s3_log_store.py's FALLBACK constants).
  - date: "2026-08-14"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      rec-3059 enforcer build: flipped the evaluator from the routed none_grandfathered debt
      record to {check: validate_log_storage_registry}, promoting
      tests/s3_log_store/test_write_through_registry.py::TestLogStorageRegistry::test_anti_drift
      (now deleted) to a registered check. No change to the pattern/routing body itself.
  - date: "2026-08-24"
    semantic_break: false
    change_class: accepted_values_narrow
    summary: >-
      PLAN-dead-file-cleanup (Decision 174): removed .friction-analysis-log.jsonl from
      patterns.locally_produced.examples -- the file it names was a decommissioned,
      zero-inbound-reference dead artefact deleted by the sweep, so the example no longer
      resolves to a tracked, gitignored, or runtime-routed target
      (tests/contracts_enforcement/test_log_storage_examples_resolve.py guards this
