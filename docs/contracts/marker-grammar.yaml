projection_id: marker-grammar
version: 1
status: active
ratified_via: "Decision 165 / PLAN-size-gov-marker-guard merge to main"
description: >-
  The single shared authorization mechanism scripts/checks/_marker_guard.py implements and all
  five raise-marker guards (validate_sloc_budget_raises, validate_prose_budget_raises,
  validate_coverage_baseline_edits, validate_mypy_baseline_edits, and R3 of
  validate_composite_action_shell_bodies) bind to. Upgrades marker validation from EXISTENCE
  ("a `## Decision NNN:` header for the cited number exists") to AUTHORIZATION ("that Decision's
  body actually names the governed entry key").

tokens:
  # Three registries, three direction-correct tokens -- a marker copy-pasted from one registry
  # can never silently authorize an edit in another.
  raise-approved:
    direction: up
    # The composite entry covers BOTH of R3's surfaces -- one registered check name, two
    # RegistrySpecs (r3: composite manifests, r3_workflows: workflow bodies), one shared token.
    # validate_contract_drift (T2.56 / contracts-first-class-migration) is the ratchet guardrail
    # over docs/contracts/contract-population.yaml's ratchet.grandfathered_max entry -- a sixth
    # binding of this SAME shared mechanism (scripts/checks/_marker_guard.py), never a sixth copy
    # of it; see docs/contracts/contract-population.yaml's ratchet section for the RegistrySpec.
    used_by: [validate_sloc_budget_raises, validate_prose_budget_raises, "validate_composite_action_shell_bodies (R3 only)", validate_contract_drift]
  baseline-lowered:
    direction: down
    used_by: [validate_coverage_baseline_edits]
  baseline-raised:
    direction: up
    used_by: [validate_mypy_baseline_edits]
  tier-demotion-approved:
    direction: down
    reason_required: true
    # A check-fleet MANIFEST ENTRY key (a bare check name, no "/"), never a file path -- so
    # authorization is CHECK-NAME level: _expand_ancestor_candidates on a name with no segments
    # yields only the name itself, and a Decision naming `scripts/checks` generically can never
    # authorize a specific check's demotion. See state_diff_mechanics below for what "down" means
    # here (a direction-gated tier transition, not a scalar decrease).
    used_by: [validate_tier_demotion_markers]
    # NEW BOUND (LSA-06, PLAN-loop-spec-audit-tail): since validate_pre_glob_closure became a
    # BLOCKING, exceptionless closure floor (Decision 163 point 1), this token can no longer
    # authorize narrowing a gated Entry's pre_globs BELOW that Entry's own import closure -- only
    # DOWN TO it. A marker citing a Decision that tried to authorize going narrower would still
    # pass THIS gate (it only judges coverage-superset direction against git ls-files, never
    # closure membership) but the now-blocking auditor would immediately red the same PR, so the
    # floor is the real enforcement point for this sub-bound, not a second check here. Some gated
    # Entries' pre_globs already sit exactly at that floor (no directory-glob slack beyond their
    # own closure) -- the count drifts as the fleet's globs change and is deliberately not pinned
    # as a literal in this file.
  schedule-removal-approved:
    direction: down
    reason_required: true
    # A bare WORKFLOW FILENAME (e.g. `reconcile.yml`), never a path -- authorization is
    # filename-level: a Decision naming `.github/workflows` generically can never authorize a
    # specific workflow's schedule removal. Bound via check_state_diff, one RegistrySpec call per
    # `.github/workflows/*.yml` file (each spec's single governed key is that file's own bare
    # name), declared in scripts/checks/ci_guards/validate_schedule_removal_markers.py -- a new
    # binding of the shared mechanism, adding no export to scripts/checks/_marker_guard.py.
    used_by: [validate_schedule_removal_markers]
  pruned-edge-approved:
    direction: up
    reason_required: true
    # An import-graph MODULE DOTTED NAME (a validate_pre_glob_closure._PRUNED_EDGES row's own
    # key), never a file path. Bound via check_diff (not check_state_diff -- see rec-3558): the
    # governed "value" is the row's TARGET COUNT, so a brand-new row (gates_new_entry always
    # True) or an existing row's target count growing is gated; a row or target REMOVED shrinks
    # the count (or vanishes the key entirely, which check_diff never visits) and is always free.
    # RegistrySpec declared in scripts/checks/deps/validate_pre_glob_closure.py itself -- a second
    # new binding of the shared mechanism, also adding no export to _marker_guard.py.
    used_by: [validate_pre_glob_closure]
  detector-loosening-approved:
    direction: down
    reason_required: true
    # A sensitive-value registry CASE KEY ("<profile>.<CLASS>.<case_id>@<8 hex>"), never a path and
    # deliberately "/"-free so _expand_ancestor_candidates yields only the key itself: a Decision
    # authorizes one case, never a whole class (the tier-demotion-approved bare-key precedent,
    # Decision 187 cl.4). Bound via check_state_diff, a RegistrySpec declared in
    # scripts/checks/misc/sensitive_value_detectors.py (adds no export to _marker_guard.py). Detector
    # loosening is in Decision 235 cl.1's class by that clause's own wording.
    used_by: [validate_detector_registry_edits]

authorization_mechanics:
  computation: >-
    KEY-SIDE ONLY. The governed entry key's own ancestor prefixes are generated, then
    substring-matched against the cited Decision's body. The body is NEVER tokenized to extract
    path-like strings -- this is what makes markdown `**bold**` markup a non-issue (a token
    extractor would see `**`, `**Date`, `**Decision` as apparent path-like fragments; a
    substring-containment check against a key-generated candidate does not) and what makes a
    bare single-segment root mention insufficient to authorize a deeper file, rather than a
    universal wildcard.
  candidate_generation: >-
    The full key is always a candidate, regardless of its segment count (this is what lets a
    non-path bare key, e.g. prose's `root_ambient_load_set`, be authorized by its own literal
    mention). Additionally, every "/"-delimited ANCESTOR prefix of the key with >=2 segments is
    a candidate. A single-segment prefix (e.g. a bare `scripts/` or `tests/` root, produced by
    truncating a deeper key) is NEVER generated -- this is the floor that keeps a root-directory
    mention from becoming a permanent skeleton key. Example: key `scripts/checks/foo.py`
    generates candidates `scripts/checks/foo.py` (full) and `scripts/checks` (2-segment
    ancestor) -- never bare `scripts`.
  band_width_measured_at_ratification: >-
    `.claude/skills/` appears in 12 live Decisions and `scripts/checks/` in 22 -- within prose
    surface class S4 the upgrade narrows "any of 116 Decisions" to "one of 12" for a marker
    citing that prefix, not per-file proof. 45 of 57 mypy-baseline entries at ratification time
    are authorizable by at least one existing Decision, 34 by directory prefix alone. The band
    is real and bounded, not zero -- SGE-07 frames this as upgrade-not-proof: mention is not
    proof of authorization, only a stronger signal than bare existence.
  supersession_hop: >-
    ONE hop only. When the cited Decision's own body does not authorize, and that body carries
    the Decision 149 compact-in-place `**Superseded by: Decision N**` marker, Decision N's body
    is also consulted. Closes the Decision 149 compaction interaction: a compacted stub's body
    is reduced to `**Status:** Superseded` / `**Date:**` / a one-line `**Decision:**` pointer /
    the supersession marker, with no path mentions of its own -- without the hop, compacting a
    cited Decision would silently un-authorize every live marker citing it, and because the scan
    is retroactive (see below), that would red every subsequent PR, not just the compacting one.
    The one-hop bound is deliberate, not a claim that chains cannot exceed length 1: Decision 149
    evaluates direction-consistency per compaction EVENT and its stub grammar never re-points an
    inbound A->B stub to a later C, so a two-generation A->B(stub)->C chain is structurally
    reachable. What actually bounds the risk is fail-loud: the five guards run unconditionally in
    `--pre` with no diff-gating, so the PR that compacts B re-runs the retroactive scan against
    the freshly-stubbed corpus and reds THERE -- remediation in that PR is to retarget the
    marker, or add the key to the grandfather hook (never to chase a second hop).
  archive_corpus: >-
    Decisions in docs/DECISIONS_ARCHIVE.md count as authorizing, matching
    scripts.decisions_md's own `_DECISIONS_MD_PATHS` convention (both files are always parsed
    together) -- archiving a cited Decision cannot retroactively red an unrelated PR.

composite_r3_mention_candidates: >-
  Composite R3's registry keys are `"<action-relative-dir>::<step-id>"`, not file paths, so
  neither verbatim nor ancestor path-matching applies without an explicit
  `mention_candidates` function. The candidates offered are the full key and the
  action-relative directory (the text before `::`); the >=2-segment ancestor rule is then
  applied to the directory. Example: key `.github/actions/materialise-tfvars::#0` generates
  candidates including the bare directory `.github/actions/materialise-tfvars` -- a Decision
  naming that directory authorizes the entry, one naming only `.github/` does not.

workflow_r3_mention_candidates: >-
  R3's `.github/workflows/` leg (audit finding SGE-03) is the SECOND RegistrySpec
  scripts/checks/ci_guards/_workflow_shell_bodies.py binds to this module -- a second binding of
  the shared mechanism, never a sixth copy of it, and the eight-name export surface above is
  unchanged. Its registry keys are `"<workflow-rel-path>::<job-id>::<step-identity>"`, so like
  composite R3 it supplies an explicit `mention_candidates` function; the candidates offered are
  the full key and the WORKFLOW FILE PATH (the text before the first `::`), with the >=2-segment
  ancestor rule then applied to each. Example: key
  `.github/workflows/reconcile.yml::apply-reconcile::plan` generates the full key,
  `.github/workflows/reconcile.yml` and `.github/workflows` -- a Decision naming the workflow file
  authorizes the entry, one naming only `.github` does not. The extractor is
  make_section_extractor("r3_workflows", token="raise-approved", value_type=int,
  require_reason=True): same token and same non-empty-reason requirement as the composite leg, so
  a reasonless marker parses as NO marker and can never rescue an entry from its ceiling.
  MEASURED AUTHORIZATION BAND, recorded here for the same reason
  band_width_measured_at_ratification above records the incumbents' -- so a reader does not
  over-read the strength of what this leg grants. Measured across the 146-entry corpus at install
  time (119 live plus 27 archived): 15 Decision entries contain the 2-segment string
  `.github/workflows` (live 72, 73, 74, 77, 83, 120, 125, 142, 143, 153, 155, 166; archived 21,
  36, 71), against exactly ONE containing `.github/actions` (Decision 162, the incumbent leg's own
  Decision). A marker citing any of those 15 therefore authorizes ANY workflow entry, making this
  the WIDEST band in the file at roughly 15x the incumbent's -- real and bounded, but a weaker
  signal than the composite leg's, and disclosed rather than assumed equivalent. The narrowing it
  buys is still real: "any of 146 Decisions" becomes "one of 15", and a marker citing the specific
  workflow file path narrows to that file.

moved_from_same_diff_proof: >-
  Decision 161 clause 4's `# baseline-raised: dec-NNN moved from <old-path>` form (a pure
  structural move needs no new Decision) is a SAME-DIFF PROOF, not a free-form exemption: it
  passes ONLY when `<old-path>` is present in the diff's BASE entry map and absent from the
  CURRENT one. The retroactive (present-markers) scan has no base map to prove against, so it
  SKIPS (does not fail) a marker whose reason text matches `moved from <old-path>` rather than
  treating the absence of proof as a violation. Gated behind `RegistrySpec.moved_from_relief`,
  default False; enabled on the mypy spec alone -- Decision 161 clause 4 is the only Decision
  naming the form.

retroactive_scan:
  scope: >-
    Every marker line bearing a guard's OWN token, across all five registries, is
    authorization-checked on every `--pre`/full run regardless of whether it changed in the
    current diff -- not just markers touched by the diff being validated. This is what makes a
    persisted marker load-bearing (Decision 128 clause 3, amended by Decision 165) and is the
    mechanism that catches an already-merged, never-re-diffed unbacked marker (SGE-07's own
    acceptance clause: "rec-2974's instance is caught retroactively").
  token_scoping: >-
    The scan is scoped to lines bearing the guard's own token specifically -- a free-form
    comment using different wording (e.g. coverage's `# grandfathered dec-159` roster comments,
    which carry no `baseline-lowered` token) is never treated as a marker.
  grandfather_hook: >-
    `RETRO_SCAN_GRANDFATHER` (scripts/checks/_marker_guard.py) is a frozenset, EMPTY at install
    -- the measured install-state population (3 markers total) is already authorization-clean,
    so no entry is justified on day one. Growing it later is a reviewed code edit, mirroring the
    composite guard's `_R1_KNOWN_VIOLATORS` shape -- never a config-file edit. This is the entire
    bound on the Decision 151 forward-conformance departure the retroactive scope represents.

binding_surface:
  # The stable contract Slice B (the structural-size class engine, audit findings SGE-01..06)
  # binds to instead of minting a sixth copy of this guard.
  module: scripts/checks/_marker_guard.py
  exports:
    - RegistrySpec
    - make_flat_extractor
    - make_section_extractor
    - default_base_reader
    - load_decision_bodies
    - authorization_failure
    - check_diff
    - check_state_diff
    - check_present_markers
  extractor_shapes: >-
    make_flat_extractor(token, value_type) scans every non-blank, non-full-line-comment line
    regardless of nesting depth (sloc/prose/coverage/mypy's shape -- safe when a registry's keys
    are globally unique across its surface groups). make_section_extractor(section_key, token,
    value_type) anchors on a top-level `<section_key>:` line and ends the section at the next
    column-0 NON-COMMENT line -- comment-immune (a column-0 comment mid-section does not end it,
    closing the defect rec-2954 finding 3 recorded in the incumbent `_parse_raw_r3_markers`) and
    section-scoped (does not leak a sibling top-level section's scalar, e.g. a `classes:` block's
    `limit: 500`, into a `budgets:`-scoped extraction -- the seam Slice B's mixed class-table +
    flat-budgets registry needs). Both accept optionally-quoted keys, so composite's
    `"<dir>::<step-id>"` form parses without a second regex.

state_diff_mechanics: >-
  check_state_diff's field semantics (Decision 187 routes here rather than restating them, per
  Decision 86/127 and the Decision 165 point 1 precedent): (1) hook contract -- RegistrySpec.
  state_extractor(text) -> dict[str, StateEntry] replaces `extractor` for a registry whose value
  is a STRENGTH, not a number; weakened(base_state, head_state) -> bool and gates_deletion
  (base_state) -> bool are the two semantic hooks a state-shaped consumer supplies, and all three
  are set together or not at all. (2) marker placement -- a marker authorizing a weakening lives
  ON THE HEAD ENTRY'S OWN LINE SPAN (an AST call node's lineno..end_lineno, the
  validate_root_scoped_diff_base.py `_call_has_waiver` idiom), never on a module header or any
  other line; this is deliberately single-homed here rather than restated in the numbered
  Decision (Decision 165 point 1 set the precedent of pushing placement mechanics out of a
  Decision body). (3) stale-marker rule -- the value compared is the marker's normalized `dec-NNN`
  id, never its raw text, so a head marker CITING THE SAME DECISION as the base entry's never
  re-authorizes a NEW weakening however its reason text is reworded (that authorization was spent
  on a prior transition); check_state_diff requires the head marker to differ from the base one,
  not merely to be present. Deliberately dec-id-level rather than byte-level: a byte-level rule
  would let a spent authorization be refreshed by editing prose alone. (4) deletion has no marker
  path -- a removed entry has no head line to carry a marker, so check_state_diff's deletion
  branch (spec.gates_deletion(base_state) is True) never consults marker text at all; this is a
  structural absence, not a policy that could be relaxed by adding a lookup.
