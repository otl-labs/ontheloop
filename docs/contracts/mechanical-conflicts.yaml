# Mechanical rebase conflicts (PLAN-decision-renumber-at-merge, rec-4323, Decision 217 clause 2).
# A Class D mechanism contract: the declared files whose rebase conflicts an agent resolves without
# a human, and how. scripts.session.rebase_resolve reads this table at run time, so the table is the
# roster; validate_mechanical_conflicts checks it. Any conflict outside it stops for the human
# (git-ops.yaml rebase_phase_distinction.commit_flow_time).
contract:
  id: mechanical-conflicts
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "PLAN-decision-renumber-at-merge"
  description: >-
    Class D mechanism contract: the three mechanical rebase-conflict classes Decision 217 clause 2
    names, the files each covers, and what makes a run clean.
  subject: mechanical-conflicts
  evaluator:
    check: validate_mechanical_conflicts

amendment_log:
  - {date: "2026-10-31", semantic_break: false, change_class: field_add, summary: "PLAN-decision-renumber-at-merge: initial authoring."}

pure_insertion: >-
  The only conflict a class resolves: a hunk whose diff3 base is empty, so both sides inserted lines
  at the same point and neither changed or deleted a line. Any other hunk, in any file, aborts the
  rebase and stops for the human.

classes:
  derived:
    rule: >-
      Never merge the text: take main's copy, finish the rebase, then re-run the generator on the
      rebased tree, and again after any renumbering. A file whose generator needs network,
      credentials or the whole test suite is not listed.
    files:
      - {path: docs/decisions-index.json, generator: "bin/venv-python -m scripts.decisions_index --write"}
      - {path: config/lambda/ducklake/field_semantics.yaml, generator: "bin/venv-python -m scripts.schema_to_field_semantics"}
      - {path: .claude/hooks/hooks.json, generator: "bin/venv-python .claude/hooks/plugin_hooks.py render"}
  roster:
    rule: >-
      Keep both sides of a pure insertion, main's lines first, except in a newest-first list (a
      contract's amendment_log), where the branch's lines go first; the file must still parse and
      carry no duplicate key or entry.
    files:
      - config/ci_rca_taxonomy.yaml
      - scripts/checks/*/_manifest.py
      - {path: "docs/contracts/*.yaml", only_under: amendment_log}
  decision_numbering:
    rule: >-
      In docs/DECISIONS.md a pure insertion of whole Decision blocks puts the branch's blocks above
      main's (newest first); any other pure insertion there is a roster union. Then every Decision
      heading the branch adds whose number main already holds moves to MAX(DECISIONS.md,
      DECISIONS_ARCHIVE.md) + 1, in ascending order, and each recognised citation of the old number
      is rewritten only on lines the branch adds, so no line already on main changes (Decision 177).
      Recognised forms: the heading, the envelope `number:`, the Warehouse ID, `Decision N`,
      `Decisions N, M`, `N/M` and `N and M` runs, `dec-N` (raise markers included) and number keys in a
      Decision record. Headings are read through scripts.decisions_md's shared grammar (Decision 134
      clause 3).
    files: [docs/DECISIONS.md]

excluded:
  - {path: .secrets.baseline, reason: "Regenerating it could allow-list a leaked secret; a human resolves it."}
  - {path: .github/CODEOWNERS, reason: "Order is meaning (the last matching rule wins), so a union could change who reviews what."}
  - {path: "terraform/*/.terraform.lock.hcl", reason: "Its generator needs provider downloads a CC-web session cannot make (Decision 119)."}
  - {path: config/agent/fast_tier/module_costs.json, reason: "Its generator runs the whole test suite."}
  - {path: config/sloc_budgets.yaml, reason: "A ratchet registry: regenerating it could hide a budget raise (Decision 128)."}
  - {path: config/mypy_baseline.yaml, reason: "A ratchet baseline (Decision 161): regenerating it could hide a new error."}
  - {path: config/structural_size_budgets.yaml, reason: "A ratchet registry with raise markers, as sloc_budgets."}
  - {path: config/composite_action_body_baseline.yaml, reason: "A ratchet baseline, as mypy_baseline."}

clean_run: >-
  A run is clean when every conflict fell in a class, no old Decision number remains on an added line
  in an unrecognised form, and every approved-text sidecar still verifies (approved text writes a
  Decision number as scripts.roadmap.approved_text's number placeholder). The command prints RESOLVE CLEAN with each rewrite, and the
  merging agent posts that output on the pull request. After a clean run, approvals already given
  (approved wording, a merge word, a review PROCEED) stand once CI is green again (operator ruling
  2026-10-31). A run that is not clean aborts the rebase or leaves its rewrites uncommitted; the hand
  edit that follows is a new change and goes back through review.

validation: >-
  Unchanged: the rebased, resolved tree still gets the full tier and --verify-head before push
  (Decision 163 point 3, git-ops.yaml handoff_sequence). A carve-out for renumber-only pushes is
  revisited after ten clean renumbers (follow-on rec).
