# Tier A north stars for this repository (Decision 196 clauses 2-3, 7). Interim home under docs/contracts/;
# eventual home the tracked ontheloop/ root (Decision 211 clause 5, Decision 224 clause 7). Rationale lives in
# Decision 243 (Decision 86); this file never restates it. Every change to an entry needs explicit human
# confirmation (Decision 196 clause 3). validate_tier_a_amendment_guard refuses a change to the mission, an NS.n,
# partial_order or semantics (edited, added or retired) unless that key's own lines carry
# `# tier-a-amendment-approved: dec-NNN <reason> approval: <ref> <YYYY-MM-DD>` citing a Decision that carries the
# key (for the mission or an NS.n, one in its carried_by; for partial_order or semantics, the one ratified_via
# names) and whose text added in the same change names it, with an amendment_log row added in the same change
# naming it; a removed entry is refused outright (docs/contracts/marker-grammar.yaml).
contract:
  id: north-star
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "Decision 243 / PLAN-north-star-tier-a"
  description: >-
    Class D mechanism contract: this repository's Tier A entries -- the mission, the numbered north stars in the
    Decision 196 Tier A shape, and the partial order that settles a conflict between them. The roadmap's
    north_star key and the README's North Star section are projections of this file.
  subject: north-star
  evaluator:
    check: validate_north_star

amendment_log:
  - date: "2026-11-03"
    semantic_break: false
    change_class: governance_note_add
    summary: "PLAN-tier-a-amendment-guard (rec-3959): the header names the amendment guard; no entry changes."
  - date: "2026-11-02"
    semantic_break: false
    change_class: field_add
    summary: "PLAN-north-star-tier-a: created (Decision 243)."

semantics:
  binds: >-
    Who the entry binds, in the terms of docs/contracts/glossary.yaml. repository -- On The Loop Labs' own work in
    this repository and the operator deployment: how On The Loop is built, licensed, priced and run; a release does
    not carry it to adopters. release -- what every release carries to adopters, and so their deployments; not this
    repository's own practice. both -- this repository and every release.
  adopters: >-
    Present exactly when binds is release or both. bound -- adopters inherit the entry unchanged. may_override -- an
    adopter may override it through a Tier C supersedes record (Decision 196 clause 4, Decision 211 clause 2).
    set_scale -- the entry binds adopters, and each sets its scale for its own deployment.
  carried_by: >-
    The numbered Decisions whose clauses carry the entry; each is an existing "## Decision N:" header. An entry is
    carried by Decisions, never itself a Decision (Decision 243 clause 2).

mission:
  kind: north_star
  statement: >-
    On The Loop is an open-core agentic software-engineering framework. The governed harness is On The Loop;
    frontier models are replaceable inputs. The end-goal is governed recursive self-improvement of the operating
    process, its verifiers and the learned components the loop owns.
  detail: >-
    The harness is everything but the model: the decision tiers, the ports and adapters, the verification and
    verdict planes, the work-item queue and the plan, implement and verify loop. The labs improve the models; On
    The Loop improves how they are governed and put to work (Decision 221 Intent). NS.6 says what counts as
    reaching the end-goal.
  failure_signal: >-
    Work that improves a model integration while the loop's own process metrics (Decision 221 clause 1, PROCESS
    layer) stay flat, or a release that works with only one vendor's models.
  binds: repository
  carried_by: [57, 184, 221, 233]

principles:
  - id: NS.1
    kind: north_star
    principle: Every substitutable boundary is a port; the vendor is an adapter; table data and blobs never have to be migrated to swap one.
    detail: >-
      Why: to reach the widest audience within reason, and to stop any vendor locking adopters into its service.
      Services should compete to offer the best deal, and that is only possible when ports are frictionless.
      docs/contracts/ports.yaml is the sole port registry (Decision 212). Storage is three ports under the one
      DuckLake format -- catalog (a local file, Neon, or any Postgres; the catalog alone moves by dump and restore,
      Decision 214 clause 1), table data and content blobs (Decision 212 clause 4, Decision 233 clause 4); beside
      them sit the ops verbs and work-item storage. Model providers are roles reached through LiteLLM,
      configuration rather than a port (Decision 173, Decision 234 clause 4). The persona compute host (local
      sandbox, container, Actions shell), the orchestration host (Step Functions in the cloud, the repo-owned
      interpreter locally, Decision 185), secrets, scheduling and the verdict plane are ports. The change surface
      is verbs: GitHub first, then on demand a self-hosted forge, GitLab, bare git, with core surfaces carrying a
      generic change id (Decision 234 clause 4). Each port is proven by one conformance suite against a
      credential-free oracle or carries a recorded oracle gap, and cross-port coupling is a defect (Decision 212
      clauses 1-3).
    failure_signal: >-
      An adapter that needs another port's vendor to work (an open ports.yaml coupling_findings row no Decision
      holds), a swap that requires copying table data instead of repointing configuration, a port minted for a
      boundary Decision 212 clause 6 does not include, or an adapter built before work demands it (clause 7).
    binds: both
    adopters: bound
    carried_by: [78, 184, 212, 233, 234]

  - id: NS.2
    kind: north_star
    principle: Source-available now, open source on proof.
    detail: >-
      Why: to stop companies with more capital outcompeting On The Loop Labs before it is ready to compete. On The
      Loop Labs supports open-source principles but is not yet in a position to make On The Loop open source. The
      entry governs this repository's code; an adopter's own code never has to be open source. BUSL-1.1,
      forward-only (Decision 171); the conversion to Apache-2.0 is staged on two named conditions rather than left
      to the fixed Change Date (Decision 194), whose grant text this entry never fixes. What is paid is set by NS.7,
      and "free" is a price, never a licence term (Decision 233 clause 2). On The Loop Labs Limited owns On The Loop
      and this repository; the Licensor line follows the owner once the IP assignment executes (Decision 195
      clauses 1-3).
    failure_signal: >-
      A capability one team needs to run the governed loop appearing only in the paid service, Decision 194's
      conditions holding with no flip scheduled, or a licence term reaching an adopter's own code.
    binds: repository
    carried_by: [171, 194, 195, 233]

  - id: NS.3
    kind: north_star
    principle: Every adapter runs where it economically belongs.
    detail: >-
      Why: to avoid being locked into one design and to stay flexible in an uncertain future; placing every adapter
      where it belongs also holds NS.1 to a stricter standard. Local by default; a cloud adapter when the workload
      or its trigger earns it (verdict personas run where their trigger originates, Decision 205 clause 1); moving
      one is an edit to ontheloop/platform.yaml, never a second install (Decision 224 clause 4, Decision 233 clause
      1). Placement is measured, not assumed: the catalog moves only on measured triggers (Decision 214) and egress
      is a budget (Decision 88). The operator deployment is intended as one instance: cloud for orchestration and
      state, a home rig for CPU-bound batch where hardware otherwise idles.
    failure_signal: >-
      A cloud adapter selected in ontheloop/platform.yaml with no recorded workload or trigger reason beside it, a
      placement change that needed a second install, or a component kept in place past a measured trigger
      (Decision 214).
    binds: repository
    carried_by: [88, 184, 205, 214, 224, 233]

  - id: NS.4
    kind: north_star
    principle: The repo is for agents.
    detail: >-
      Why: maintaining anything for human comprehension is an anti-pattern. Humans are the arbiters of intent,
      taste and an acceptable level of cost and risk, so human comprehension is never a barrier, and design
      optimises agent comprehension: the balance between removing context an agent does not need and letting it
      retrieve only the context it does (this repository's 500-SLOC file limit serves it, Decision 128).
      Documentation, configuration and tooling are optimised for agent consumption; narrative prose is a side
      effect, not an output (Decisions 86, 127). The exceptions are the surfaces a person meets before any agent
      does -- a repository's description, its README, and the licence, contribution and security files at its
      root. They serve humans and agents equally, stay minimal, and may hand the person to an agent, for example by
      asking their agent to clone the repository and explain it. A new exception is an entry change. For an adopter
      it is the optional house-style profile, never an adoption precondition (Decision 211 clause 2).
    failure_signal: >-
      A human-readable companion document agents must keep in sync with a machine-readable source, a surface kept
      for human comprehension outside the exceptions this entry names, or an adopter refused at init because its
      repository is not agent-first.
    binds: both
    adopters: may_override
    carried_by: [86, 127, 128, 211]

  - id: NS.5
    kind: north_star
    principle: The agent surface is named, typed, self-describing verbs.
    detail: >-
      Why: to serve NS.4. History is always retained, every agent works from one source of truth, and agent
      judgement moves to semantics instead of measuring metrics; the append-only lakehouse behind the verbs is also
      the most cost-efficient architecture, which serves NS.3. Callers use named verbs, never caller SQL (Decision
      84 I-3). A data rule is enforced at the write boundary wherever the write can decide it, the schema lives in
      the owning Class A contract, and Pydantic models are consumer projections (Decision 210). The supervision UI
      reads and writes through the same verbs (Decision 232 clause 3). Transport is an adapter: Lambda Function
      URLs with AWS_IAM in the cloud tier, a module boundary in-process locally (Decision 184 clause 2).
    failure_signal: >-
      A caller reading the store with its own SQL, a verb whose rules live only in a client, or a view that needs
      data no named verb can serve.
    binds: both
    adopters: may_override
    carried_by: [84, 184, 210, 232]

  - id: NS.6
    kind: north_star
    principle: Improvement is proven, never asserted.
    detail: >-
      Why: to channel recursive self-improvement, to avoid work done for its own sake, and to direct growth towards
      measurable improvement over semantic judgement. Humans are the arbiters of taste and of what can only be
      asserted, and the system does the rest; the exception is a collective measure of human taste, which counts
      as a measure. Self-improvement is judged by a probe the loop cannot edit, against a frozen control arm, with
      metrics and stopping rules pre-registered and public receipts (Decision 221); persona evaluation is graded by
      code, real outcomes and blind human ratings, never an LLM judge (Decision 231). A signal is not proof, and
      a recommendation is not authority (docs/PROJECT_CONTEXT.md).
    failure_signal: >-
      An improvement claim with no pre-registered metric, a judge, gold set or grader whose paths the loop can
      edit, or a pre-registered metric moving while the other two layers stay flat (Decision 221 clause 1).
    binds: both
    adopters: bound
    carried_by: [221, 231]

  - id: NS.7
    kind: north_star
    principle: The core is adopter-owned, and scale is never blocked.
    detail: >-
      Why: it is On The Loop Labs' job to convince adopters to become customers, never to gate their growth.
      Capital should not be a gate only a few can pass, because who holds it follows the luck of birth, not merit;
      customers pay On The Loop Labs because it removes inconvenience, never because they have to. The core runs
      the governed loop on any number of repositories through the public adapters, free; the paid service is the
      tooling that makes scale painless -- the multi-tenant, metadata-only control plane, fleet views, SSO and
      RBAC -- and operating On The Loop for the customer, never capability (Decisions 209, 233). Tenant data and
      transcripts never leave the customer's data plane; what crosses is an explicit allow-list (Decision 209
      clause 2), and Decision 200's ids key every telemetry row.
      Attach, do not restructure: On The Loop attaches to a repository's code and history and replaces only the
      change process (Decision 211 clause 1).
    failure_signal: >-
      An adopter meeting a hard limit on repositories in the core, a field crossing to the control plane that is not on
      the allow-list, init needing a refactor of an adopter's code, or no paid capability left absent from the
      core (Decision 194 condition (b), Decision 233 clause 2).
    binds: repository
    carried_by: [200, 209, 211, 233]

  - id: NS.8
    kind: north_star
    principle: Autonomy is earned, never granted.
    detail: >-
      Why: an agent has no way to know whether what it builds matches human semantic intent, and often humans do
      not know their intent in detail either; earning autonomy leaves no room for miscommunication or drift in goal
      alignment. Authority rises on a ladder as measured verification coverage and evidence grow; every gate
      transition is human-ratified (T4.4), coverage is an input to the ladder and never a replacement for its
      thresholds (Decision 211 clause 4), and on the verification-weakening lane demotion is automatic and a
      human approves each promotion (Decision 235 clause 2). An irreducible floor never enters the ladder: the
      judge, the hooks and the ladder's own checks (Decision 235 clause 5). The executor cannot loosen its own
      leash (Decisions 117, 185 clause 3). Mechanism earns autonomy; direction and intent never do (Decision 243).
      An adopter sets the scale for its own deployment: how far up the ladder it climbs and how fast.
    failure_signal: >-
      A promotion with no evidence record, a rung above the lowest rung of the producers it relies on, or a lane
      held at read_all for two pre-registered windows while its evidence clears the next rung's threshold.
    binds: both
    adopters: set_scale
    carried_by: [117, 185, 211, 235]

  - id: NS.9
    kind: north_star
    principle: Humans hold approval authority outside the engine.
    detail: >-
      Why: to keep humans the arbiters of intent, taste and an acceptable level of cost and risk. A gate outside
      the engine guards against Goodhart manipulation, prompt injection into agents and plain bad performance: a
      bad agent run can happen, and the gates contain its risk. Approve or deny is never an engine verb; the forge
      holds it (branch protection, required reviewers, Environments) under the user's own identity (Decision 233
      clause 4, Decision 232 clause 3), and a gate card leads with intent and evidence, never a diff (Decision 232
      clause 4). Weakening verification is human-gated at entry (Decision 235 clause 1), a Tier A change needs
      explicit human confirmation (Decision 196 clause 3), and in this repository governed deploys keep their
      human-gated tiers (Decision 126). A rung earned under NS.8 moves the human gate from each change to each
      promotion; the promotion itself stays human-approved (Decision 235 clauses 2 and 6).
    failure_signal: >-
      An engine verb that approves, merges or deploys past a human gate its rung has not earned, or a gate
      approved so near-always that it no longer discriminates.
    binds: both
    adopters: bound
    carried_by: [126, 196, 232, 233, 235]

partial_order:
  rule: >-
    Groups are listed highest first. When two north stars conflict, an entry in a higher group prevails over an
    entry in a lower group. A conflict within one group, or involving an entry no group lists, routes to a numbered
    Decision; no agent settles it.
  groups:
    - [NS.6, NS.9]
    - [NS.1, NS.3]
