---
# Class C cross-system invariant: the telemetry observation node identity key.
# Ratified under the CD.25 pre-codegen contract ratification ritual (tier_item T0.12.6).
# Re-grounded to the write-boundary derivation model at contract_version 2 (Decision 199,
# amending Decision 97 clauses 1 and 2).
#
# Telemetry Class A contracts $ref into contract.fields.observation_id:
#   telemetry_observations.observation_id  -> observation_id  (PK)
#   telemetry_transcripts.observation_id   -> observation_id  (FK)
#   telemetry_agents.observation_id        -> observation_id  (FK)
contract:
  id: observation-id
  class: C
  contract_version: 2
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 199)"
  description: >-
    Canonical cross-system identity key for a single telemetry observation -- one node in a
    session's trace tree (Decision 95, event-journal re-model Decision 199). Primary key of
    telemetry_observations; foreign key on telemetry_transcripts (the blob's owning node) and
    telemetry_agents (the node an agent row annotates). Crockford-base32 ULID, derived at the write
    boundary per telemetry-event-envelope.yaml's normative identity spec -- lexicographically
    sortable and time-ordered on the ROOT session's start time, so calendar-day partition pruning and
    chronological ORDER BY fall out of the key itself.
fields:
  observation_id:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      ULID string identifying one observation. Primary key of telemetry_observations; foreign key on
      telemetry_transcripts.observation_id and telemetry_agents.observation_id.
    semantics: >-
      Format: Crockford-base32 ULID = ULID(48-bit ROOT session_started_at ms + the first 80 bits of
      H computed over the caller-supplied observation_ref with domain tag
      'telemetry_observations:observation_id'), per telemetry-event-envelope.yaml's identity spec.
      DERIVED at the write boundary, not minted-once-and-propagated: a child row referencing this
      observation as its FK computes the SAME value independently, using this domain tag over the
      same ref -- there is no propagation step to get wrong. Time-prefixed by the ROOT session's
      session_started_at (never the node's own open time), so every observation under one session
      -- however deep its sub-agent nesting -- sorts and partitions with its session. The Class C
      baseline nullability is the LOOSEST common value so per-table contracts TIGHTEN via
      dq_intent_local without violating Invariant 5. Per-table nullability: REQUIRED in
      telemetry_observations (PK) and telemetry_transcripts (every blob owns a node); OPTIONAL in
      telemetry_agents (a session-scoped agent row may carry no observation_id).
    populated_by: >-
      the write boundary (rec-4024's append_events verb), derived from the caller-supplied
      observation_ref per the identity spec. No current populator.
    write_time_validation: >-
      Structural, not central: PK-required in telemetry_observations; foreign key in the child tables.
      ULID format and value are generator-guaranteed at the boundary (no separate validator), mirroring
      the ops `ulid` SCD2 envelope (Decision 84).
    dq_intent: {}
    governance_notes: >-
      Loosest baseline (no not_null leg) by design: the owning/required tables tighten to a declared not_null via dq_intent_local; the optional-FK use (telemetry_agents) passes through. Population is
      future-state (rec-4024); ratifying the invariant now at status: ratified (NOT provisional_v0) is
      deliberate -- Class C cross-system invariants do not use the v0-provisional state.
    amendment_log:
      - date: "2026-09-24"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199, amending 97 cl.1/cl.2): replaced
          mint-once-at-open-and-propagate with write-boundary derivation from a caller-supplied
          observation_ref, time-prefixed by the ROOT session_started_at rather than the node's own
          open time. semantic_break=true: the derivation MECHANISM changed, not merely the prose.
        migration_story: >-
          No live populator existed under either scheme (population is future-state in both), so no
          runtime migration is required; rec-4024 builds directly to this contract_version 2 spec.
      - date: "2026-08-26"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          Platform cleanse: wording referencing removed product surfaces or the retired
          legacy query engine trimmed; field meaning unchanged.
joins_using_this_key:
  - observation_id_join_observations_to_transcripts
  - observation_id_join_observations_to_agents
governance_notes: >-
  Single-hop leaf invariant (no chained $ref; Class C contracts are leaf nodes, Invariant 5).
  telemetry_observations.observation_id is the canonical definition; parent-observation-id.yaml
  references this key (an observation's parent pointer is itself an observation_id) but is a SEPARATE
  Class C contract per the field-per-contract convention, NOT a chained $ref. The cross-contract join
  entries live in docs/contracts/_joins.yaml. The normative derivation formula lives ONCE in
  telemetry-event-envelope.yaml; this contract states its own domain tag and defers to that spec.
amendment_log:
  - date: "2026-09-25"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-telemetry-kernel-identity-append (rec-4065): contract.description reworded from
      "day()-partition pruning" to "calendar-day partition pruning" -- DuckLake evaluates a bare
      day() as day-of-month, not calendar day. Decision 199 always meant a calendar day.
  - date: "2026-09-24"
    semantic_break: true
    change_class: governance_note_add
    summary: >-
      PLAN-telemetry-event-journal-contracts (Decision 199): contract-level description re-grounded
      to the write-boundary derivation model and the identity-envelope pointer. Accompanies the
      field-level amendment_log entry above (CD.25 category-6 gate). semantic_break=true, mirroring
      the field-level entry.
    migration_story: Prose-only at the contract-description level; no runtime behaviour changes.
  - date: "2026-08-26"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      Platform cleanse: references to the removed trading-product surfaces and the retired
      pre-DuckLake query-engine estate were removed or reworded.
    migration_story: >-
      The repository became platform-only. Product surfaces (broker credentials, the product
      roadmap, the market-data pipeline) and the retired legacy query-engine path (staging
      outbox, ops compaction, legacy workgroup IAM) were deleted, and this contract's
      references to them were removed in the same change. No live DuckLake field or verb
      semantics changed.
  - date: "2026-10-15"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-rule-declarations-and-writer-conformance (rec-4158, Decision 210): the dq_intent `enforced` key is retired
      from every rule leg. not_null is declared by presence (`true`, or `{exclude_before: D}`); an optional column or a
      loosest-baseline field carries no not_null leg; the other legs lose the key. A declared rule is an enforced rule.
    migration_story: >-
      Declarations re-spelled only. No rule is added, removed or re-dated: the declared rule set, read through
      scripts.contract_rules, is identical before and after, and the generated field_semantics.yaml projection of
      this contract is unchanged.
previous_versions:
  - contract_version: 1
    ratified_at: "2026-06-24"
    ratified_via: "Step 10 multi-perspective critique + PLAN-ratify-class-a-telemetry-contracts merge to main (T0.12.6)"
    superseded_on: "2026-09-24"
    summary: >-
      Mint-once-at-open, propagated-to-children-as-FK observation_id (Decision 97 cl.1-3,
      original). Superseded by write-boundary derivation from a caller-supplied observation_ref,
      time-prefixed by the ROOT session_started_at (Decision 199).
