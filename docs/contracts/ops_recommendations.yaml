---
# Class A data contract for ops_recommendations (DuckLake SCD2 table).
# Ratified under the CD.25 pre-codegen contract ratification ritual (T0.12.5).
# Authored against the live DuckLake column inventory in
# config/lambda/ducklake/field_semantics.yaml (25 columns + _contract_version = 26 total).
#
# Decision 65 and Decision 210 cl.3 (rec-4158): this contract is the ONE declared source of every field-semantic and
# write-time data rule; ops.yaml and the Pydantic models are consumer projections. ops.yaml retires via T1.6.
# Decision 84: sole backend is DuckLake-on-Neon. id is writer/file_ops-allocated (I-2).
# Decision 63: execution_* fields (5) are DQ-EXCLUDED -- documented but not DQ-enforced.
contract:
  id: ops_recommendations
  class: A
  contract_version: 1
  status: ratified
  ratified_at: "2026-06-20"
  ratified_via: >-
    Step 11 smoke-test pass + PLAN-ratify-ops-class-a-contracts merge to main (T0.12.5)
  description: >-
    Class A schema contract for the ops_recommendations DuckLake SCD2 table. Canonical field-semantic authority per Decision 65 (supersedes ops.yaml, which retires via T1.6). 26 fields: 25 from the live DuckLake inventory in config/lambda/ducklake/field_semantics.yaml plus _contract_version (stamped at write time by the ducklake_writer Lambda, T0.12.5). Sole backend is DuckLake-on-Neon (Decision 84); reads transit the closed ducklake_reader boundary (NAMED VERBS only). id is allocated atomically by file_ops (Decision 84 I-2); ULID is derived by the runtime. Five execution_* fields are DQ-EXCLUDED (Decision 63).
  projects_to:
    artifact: config/lambda/ducklake/field_semantics.yaml
    table: ops_recommendations
    generator: scripts/schema_to_field_semantics.py
fields:
  ulid:
    type: str
    iceberg_type: string
    nullable: false
    description: >-
      Monotonic ULID minted once per write attempt by ducklake_runtime, outside the
      OCC-retry loop. Reused unchanged on retry. History table logical PK; idempotency
      dedup key in MERGE-on-ULID append.
    semantics: >-
      SCD2 envelope field; NOT caller-supplied. Collision-free across concurrent writes
      via python-ulid monotonic generation.
    populated_by: >-
      ducklake_runtime._derive_fields() -- minted once at op-start; NEVER caller-supplied.
    dq_intent: {not_null: true}
    derivation:
      formula: python-ulid monotonic generation; minted once at op-start by ducklake_runtime._derive_fields()
      inputs: []
      realized: true

  id:
    type: str
    iceberg_type: string
    nullable: false
    description: >-
      Stable natural key for the recommendation. Format: "rec-NNNN" (e.g. rec-0042). Allocated atomically by the ducklake_writer file_ops action (Decision 84 I-2); never pre-generated by the caller. update_ops and write_ops require the caller to supply an existing id.
    semantics: >-
      Natural key and MERGE key for the current projection (ops_recommendations_current).
      Partitioned as bucket(8, id) on the current table for efficient point lookups.
    populated_by: >-
      ducklake_writer/file_ops allocates atomically in-transaction. update_rec/write_ops require caller to supply an existing id.
    dq_intent: {not_null: true, pattern: '^(rec-[0-9]+|agent-[0-9]+|test-[a-z0-9-]+)$'}

  title:
    type: str
    iceberg_type: string
    nullable: false
    description: One-line human-readable title for the recommendation.
    semantics: >-
      Minimum 10 stripped characters (from 2026-09-01) and not-null, enforced by the DuckLake writer from this contract's
      projected rules (Decision 210) on every write; the portal's derived pre-check (write_validators.py gate_write)
      refuses an insert early and an update for undated rules only.
    populated_by: Caller-supplied on file_rec/write_ops payload.
    dq_intent: {not_null: true, min_length: {value: 10, exclude_before: "2026-09-01"}, glossary_lint: {}, write_time_exemptions: {glossary_lint: {class: repository_state, reason: "house style (Decision 211 clause 2) read from docs/contracts/glossary.yaml: whether it binds depends on this repository's profile, which no row-local write can decide", owner: scripts/ops_portal/write_validators.py}}}
    amendment_log:
      - date: "2026-09-01"
        semantic_break: false
        change_class: prose_improvement
        summary: Corrected title's semantics to describe the min_length 10 rule that now actually enforces (rec-3310).
        migration_story: Prose correction paired with the min_length write-time enforcement landing in the same change.
      - date: "2026-10-05"
        semantic_break: true
        change_class: not_null_tighten
        summary: title is nullable false (rec-4158 plan B, Decision 210 cl.5); the undated not_null leg already bound every row.
        migration_story: >-
          The census found no null or blank title. The live table keeps a nullable physical column (reconcile_columns only adds columns), so the constraint is declarative there (Decision 100); rec-4171 owns an admin-tier SET NOT NULL leg.
      - date: "2026-10-16"
        semantic_break: false
        change_class: prose_improvement
        summary: title semantics name the writer and the portal's derived pre-check, not the retired min_length builder.
        migration_story: Prose re-pointed only (rec-4158 portal row-rule gate); the rules and the projection are unchanged.
      - {date: "2026-10-30", semantic_break: true, change_class: accepted_values_narrow, summary: "PLAN-glossary (Decision 240): the portal now refuses new title text that uses either relative word unqualified (the glossary_lint leg).", migration_story: "Not retroactive: inserts are judged whole, updates only on sentences the stored value does not hold."}

  source:
    $ref: "docs/contracts/source-lineage.yaml#/contract/fields/registry_key"
    dq_intent_local: {not_null: {exclude_before: "2026-05-01"}}

  effort:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Effort estimate for the recommendation. Currently a free-text string (e.g. "S", "M",
      "L", "XL"). Target-state is a LOC-weighted integer encoding deferred to T2.31.
    semantics: >-
      DERIVED field (target-state). Currently stored as caller-supplied string; derivation
      is deferred to T2.31. The derivation block documents the target-state formula.
    populated_by: Caller-supplied until T2.31; derivation rewrites on T2.31 release.
    dq_intent: {not_null: {exclude_before: "2026-05-01"}, accepted_values: {values: [XS, S, M, L, XL], exclude_before: "2026-05-01"}}
    derivation:
      formula: >-
        LOC-weighted integer encoding. Target: estimate_effort(file, lines_of_code)
        returning int 1-5 (1=XS, 2=S, 3=M, 4=L, 5=XL). Deferred to T2.31.
      inputs:
        - file
        - lines_of_code_in_file
      recompute_trigger: file change or manual override
      degradation_policy: >-
        Absent radon/coverage data: retain caller-supplied string value unchanged.
        Null file: retain caller-supplied value. Derivation is best-effort until T2.31.
      realized: false

  priority:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Priority level of the recommendation. Encoding: 1=Critical, 2=High, 3=Medium, 4=Low.
      Derived from the recommendation source via source_priority_map; target-state with full
      derivation realization deferred to T2.30.
    semantics: >-
      DERIVED field (target-state). Currently stored as caller-supplied string. The
      derivation block documents the source_priority_map for all 30 registered sources.
      Full derivation realization deferred to T2.30.
    populated_by: Caller-supplied until T2.30; derivation rewrites on T2.30 release.
    dq_intent: {not_null: {exclude_before: "2026-05-01"}, accepted_values: {values: [Critical, High, Medium, Low], exclude_before: "2026-05-01"}}
    derivation:
      realized: false
      formula: >-
        source_priority_map[source] if source in source_priority_map else fallback_priority.
        Encoding: 1=Critical, 2=High, 3=Medium, 4=Low. Realization pointer: T2.30.
      inputs:
        - source
      recompute_trigger: source field change
      failure_policy: fallback_priority
      fallback_priority: 3
      source_rules:
        ci_rca: "Decision 226 cl.1: High iff is_track_a, else Critical (source_priority_map's 1); realized for this source only, by derive_ci_rca_priority in file_rec and correct_rec_context (docs/contracts/red-main-recovery.yaml). T2.29 c1 keeps this rule when it realizes the map."
      source_priority_map:
        ci_rca: 1
        budget_breach: 1
        executor-postmortem: 2
        executor-supervision: 2
        architectural-review: 2
        code-review: 3
        planning: 3
        implement-agent: 3
        brainstorm: 3
        telemetry-audit: 3
        workflow-audit: 3
        delegate-investigation: 3
        infra-recommendation-executor: 3
        executor-gap-analysis: 3
        scoping: 3
        cli-migration-analysis: 3
        tech-debt: 3
        manual: 3
        implement-session: 3
        budget_bypass: 3
        agent-cron: 3
        cc-scheduled-agent-test: 4
        doc-freshness: 4
        orphan-code: 4
        transcript-review: 4
        code-smell: 4
        prompt-quality: 4
        rec-curator: 4
        autonomous-postflight-cleanup: 4
        "Autonomous Postflight Cleanup": 4

  status:
    type: str
    iceberg_type: string
    nullable: false
    description: >-
      Recommendation lifecycle status. Valid values: open, closed, failed, declined, superseded.
    semantics: >-
      Status controls eligibility for the executor queue. Only "open" recs are eligible for
      execution. Closed recs retain their full history in the SCD2 history table. Closure via
      lifecycle state, not deletion (Decision 70).
    populated_by: Caller-supplied on file_rec (default=open); updated via update_rec.
    dq_intent: {not_null: true, accepted_values: {values: [open, closed, failed, declined, superseded]}}
    amendment_log:
      - date: "2026-10-04"
        semantic_break: false
        change_class: prose_improvement
        summary: status description and semantics name the five enforced values and drop the in_progress/deferred executor eligibility (rec-4158).
        migration_story: Prose correction only; the portal and the writer have enforced exactly these five values throughout.

  automatable:
    type: bool
    iceberg_type: boolean
    nullable: true
    description: >-
      Whether the autonomous executor can implement this recommendation without human
      intervention. Derived from capabilities.yaml maturity ceiling; overrideable by caller.
      Derivation deferred to T2.31.
    semantics: >-
      DERIVED field (target-state). Recomputed when capabilities.yaml maturity_ceiling
      changes (Decision 44/73 boundary file). Currently caller-supplied.
    populated_by: Caller-supplied until derivation is live at T2.31.
    dq_intent: {not_null: {exclude_before: "2026-05-01"}}
    derivation:
      formula: >-
        True if all risk/effort/dependency gates pass and executor capability covers the
        rec's domain per capabilities.yaml maturity_ceiling. False otherwise. Deferred to T2.31.
      inputs:
        - risk
        - effort
        - dependencies
        - file
      recompute_trigger: capabilities.yaml maturity_ceiling change (Decision 44/73)
      failure_policy: >-
        Capability mismatch or missing capabilities.yaml: set False (conservative -- do not
        automate what the capability map cannot confirm). Null file: set False.
      realized: false

  risk:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Qualitative risk assessment string (e.g. "low", "medium", "high"). Derived from
      radon complexity and coverage data for the target file. Derivation deferred to T2.31.
    semantics: >-
      DERIVED field (target-state). Currently caller-supplied string. The derivation block
      documents the target-state formula using radon and coverage.xml data.
    populated_by: Caller-supplied until T2.31.
    dq_intent: {not_null: {exclude_before: "2026-05-01"}, accepted_values: {values: [low, medium, high], exclude_before: "2026-05-01"}}
    derivation:
      formula: >-
        estimate_risk(file, radon_complexity, coverage_pct) returning 'low'|'medium'|'high'.
        Deferred to T2.31.
      inputs:
        - file
        - radon_complexity
        - coverage_pct
      recompute_trigger: radon or coverage.xml output change for the target file
      degradation_policy: >-
        Absent radon or coverage.xml: retain caller-supplied string value unchanged.
        Null file: retain caller-supplied value. Derivation is best-effort until T2.31.
      realized: false

  file:
    type: str
    iceberg_type: string
    nullable: true
    description: Primary target file path (relative to repo root) for this recommendation.
    semantics: >-
      The executor reads this field to determine which file to modify. Used as the dedup
      gate key in the scoping step. Required (non-null, repo-relative) since 2026-05-01.
    governance_notes: "file names the surface the acceptance probe checks: the probe's verdict depends on that file's content, directly or through a test that exercises it, so file-keyed discovery (recs_related) returns the rec. A probe whose verdict never depends on file means the rec is mis-keyed. Decision 181: served as guidance (get_rec_write_guidance) and parity-tested; write-time refusal unenforced, owned by rec-4603."
    populated_by: Caller-supplied on file_rec.
    dq_intent: {not_null: {exclude_before: "2026-05-01"}, min_length: {value: 1, exclude_before: "2026-05-01"}, pattern: {value: '^([^/\\A-Za-z][^\\]*|[A-Za-z]([^:\\][^\\]*)?|[A-Za-z]:([^/\\][^\\]*)?)$', exclude_before: "2026-05-01"}}
    amendment_log:
      - date: "2026-10-04"
        semantic_break: false
        change_class: prose_improvement
        summary: file semantics drops "Null for cross-cutting recs" (rec-4158).
        migration_story: Prose correction only; file has been required since 2026-05-01.
      - {date: "2026-10-25", semantic_break: false, change_class: prose_improvement, summary: "file governance_notes gains the probe-surface keying rule (PLAN-silent-failure-prevention).", migration_story: "Guidance only; no write-time rule changes."}

  context:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Human-readable context explaining WHY this recommendation is needed. Minimum 80
      characters enforced at write time by the JIT context injection rule (AGENTS.md).
    semantics: >-
      Context is the primary LLM-consumption field. The executor reads this to understand
      the problem before acting. Thin or generic context is the main cause of executor
      failure on first attempt.
    governance_notes: "Never append unrelated work to an existing rec (a rider): file a new rec and cite the first in its context; use dependencies only when the new work cannot start before the first is done. A context change through update_rec refines the rec's own problem only. Decision 181: served as guidance (get_rec_write_guidance) and parity-tested; write-time refusal unenforced, owned by rec-4603."
    populated_by: >-
      Caller-supplied on file_rec, and on update_rec for a context-changing update. The DuckLake writer enforces the >=80-stripped-char gate on every write from this contract's min_length rule, and the portal's derived pre-check (write_validators.py gate_write) refuses an insert early (Decision 66 Tier-B write-time rejection); rec_write_guidance.py is the Tier-A pre-write guidance surface, not the enforcement point.
    dq_intent: {not_null: {exclude_before: "2026-05-01"}, min_length: {value: 80, exclude_before: "2026-05-01"}, glossary_lint: {}, write_time_exemptions: {glossary_lint: {class: repository_state, reason: "house style (Decision 211 clause 2) read from docs/contracts/glossary.yaml: whether it binds depends on this repository's profile, which no row-local write can decide", owner: scripts/ops_portal/write_validators.py}}}
    amendment_log:
      - date: "2026-09-01"
        semantic_break: false
        change_class: prose_improvement
        summary: Corrected the description's context minimum from 50 to 80 stripped characters (rec-3310).
        migration_story: >-
          Prose-only correction; write_validators.py has enforced the 80-char floor unchanged throughout.
      - date: "2026-10-16"
        semantic_break: false
        change_class: prose_improvement
        summary: context populated_by names the writer and the portal's derived pre-check, not the deleted length helper.
        migration_story: Prose re-pointed only (rec-4158 portal row-rule gate); the rules and the projection are unchanged.
      - {date: "2026-10-25", semantic_break: false, change_class: prose_improvement, summary: "context governance_notes gains the no-rider rule (PLAN-silent-failure-prevention).", migration_story: "Guidance only; no write-time rule changes."}
      - {date: "2026-10-30", semantic_break: true, change_class: accepted_values_narrow, summary: "PLAN-glossary (Decision 240): the portal now refuses new context text that uses either relative word unqualified (the glossary_lint leg).", migration_story: "Not retroactive: inserts are judged whole, updates only on sentences the stored value does not hold."}

  acceptance:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Acceptance criterion for the recommendation. Shape: str | list[TypedCheck].
      Scalar-string form is a legacy acceptance command (backward compat). Typed-check
      form is list[TypedCheck] per CD.29 (TypedCheck = {type, severity, command?, ...}).
    semantics: >-
      The executor runs this as the acceptance test after implementing the recommendation.
      The consumer shim (step_runner.py, acceptance_lint.py) normalizes list[str] and
      list[dict] at T0.12.5. Full typed-check dispatch by type deferred to T3.6. file_rec
      requires a discriminating probe shape (require_discrimination=True); not retroactive.
    populated_by: Caller-supplied on file_rec.
    dq_intent: {not_null: {exclude_before: "2026-05-01"}, min_length: {value: 1, exclude_before: "2026-05-01"}, acceptance_lint: {require_discrimination: true}, write_time_exemptions: {acceptance_lint: {class: repository_state, reason: "the lint reads the repository tree, which no row-local evaluator can", owner: scripts/ops_portal/write_validators.py}}}
    amendment_log:
      - date: "2026-06-20"
        semantic_break: false
        change_class: type_widen
        summary: acceptance widened from str to str | list[TypedCheck] per CD.29
        migration_story: Field shape ratified as str | list[TypedCheck] at T0.12.5 (CD.29 kernel primitives); typed-check dispatch by type deferred to T3.6.
      - date: "2026-08-21"
        semantic_break: true
        change_class: accepted_values_narrow
        summary: file_rec acceptance lint now requires a discriminating probe shape (rec-3220).
        migration_story: >-
          lint_acceptance_command() gained a keyword-only require_discrimination parameter,
          wired True only at the file_rec boundary (ops_data_portal.py:358); not retroactive.
      - date: "2026-09-01"
        semantic_break: true
        change_class: accepted_values_narrow
        summary: update_rec acceptance lint now requires a discriminating probe shape too (rec-3306).
        migration_story: require_discrimination=True wired at write_validators.py's YAML-driven _check_acceptance closure (used by both file_rec and update_rec); not retroactive.
      - date: "2026-10-16"
        semantic_break: false
        change_class: prose_improvement
        summary: the acceptance lint is driven by this contract's declared acceptance_lint leg (require_discrimination read from it) through the portal's gate_write.
        migration_story: Prose re-pointed only (rec-4158 portal row-rule gate); the rules and the projection are unchanged.

  verification:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Verification plan description for the recommendation. Documents HOW the executor
      should verify the implementation beyond the acceptance command.
    semantics: >-
      Human-readable verification plan consumed by the executor to confirm end-to-end
      correctness beyond the acceptance command. Null for recs with no explicit VP step.
    populated_by: Caller-supplied on file_rec.
    dq_intent: {glossary_lint: {}, write_time_exemptions: {glossary_lint: {class: repository_state, reason: "house style (Decision 211 clause 2) read from docs/contracts/glossary.yaml: whether it binds depends on this repository's profile, which no row-local write can decide", owner: scripts/ops_portal/write_validators.py}}}
    amendment_log:
      - {date: "2026-10-30", semantic_break: true, change_class: accepted_values_narrow, summary: "PLAN-glossary (Decision 240): the portal now refuses new verification text that uses either relative word unqualified (the glossary_lint leg).", migration_story: "Not retroactive: inserts are judged whole, updates only on sentences the stored value does not hold."}

  verification_tier:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Verification tier identifier (V1, V2, V3). Controls the depth of live verification
      required: V1=static/format, V2=functional, V3=deploy+smoke-test.
    semantics: >-
      Executor routing signal: V3 requires build+deploy+smoke-test steps (Decision 79/CD.16).
      V2 requires functional end-to-end test. V1 requires only static/format checks.
      Null implies V1 (advisory default). Validated against the implement skill's VP protocol.
    populated_by: Caller-supplied on file_rec.
    dq_intent: {}

  dependencies:
    type: "list[str]"
    iceberg_type: "array<string>"
    nullable: true
    description: List of rec-IDs that must complete before this recommendation.
    semantics: >-
      Dependency gate: the executor checks that all listed rec-IDs are in status=closed before scheduling this rec. Each element must also reference an existing rec of any status (open, closed, or superseded alike) -- enforced write-time by the portal's gate_write (array_element_reference, run from the declared exemption) on an insert and on an update that changes the column. Null or empty list means no gate.
    populated_by: Caller-supplied on file_rec.
    dq_intent: {array_element_format: {pattern: '^rec-[0-9]+$'}, array_element_reference: {}, write_time_exemptions: {array_element_reference: {class: cross_row, reason: "an existence lookup outside the batch partitions (Decision 210 cl.2(a))", owner: rec-4166}}}
    amendment_log:
      - date: "2026-09-08"
        semantic_break: true
        change_class: accepted_values_narrow
        summary: Struck the stale "or tier-item IDs" claim (rec-3364) and added array_element_reference existence enforcement (rec-3307's referential half).
        migration_story: array_element_format already rejected non-rec- values; array_element_reference is new write-time enforcement through file_rec and update_rec, not retroactive.
      - date: "2026-10-16"
        semantic_break: false
        change_class: prose_improvement
        summary: dependencies existence is enforced by the portal's gate_write from the declared exemption.
        migration_story: Prose re-pointed only (rec-4158 portal row-rule gate); the rules and the projection are unchanged.

  tags:
    type: "list[str]"
    iceberg_type: "array<string>"
    nullable: true
    description: Free-form tags for categorization and filtering.
    semantics: >-
      Unstructured categorization signal with no registered consumer (no NAMED_READS verb, absent from src/schemas/rec.py, no skill/workflow/check reads it). No canonical vocabulary. DQ-enforced at the structural level only: each element must match ^[a-z][a-z0-9-]*$ (kebab-case) by the DuckLake writer from the array_element_format rule (dated; the portal's derived pre-check skips it on update).
    populated_by: Caller-supplied on file_rec.
    dq_intent: {array_element_format: {pattern: '^[a-z][a-z0-9-]*$', exclude_before: "2026-09-08"}}
    amendment_log:
      - date: "2026-09-08"
        semantic_break: true
        change_class: accepted_values_narrow
        summary: Corrected three false claims (portal filtering, rec-curator ranking, "Not DQ-enforced") and added array_element_format enforcement (rec-609 unblocked; tag_registry.yaml clause retired).
        migration_story: Structural gate only; the registry-backed semantic gate the 2026-05-07 decision proposed is retired outright, not deferred again -- tags has no consumer to justify it.
      - date: "2026-10-16"
        semantic_break: false
        change_class: prose_improvement
        summary: tags semantics name the writer's rule, not a portal builder.
        migration_story: Prose re-pointed only (rec-4158 portal row-rule gate); the rules and the projection are unchanged.

  resolution:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Human-readable explanation of how the recommendation was resolved (closed, declined,
      superseded). Populated at close time via update_rec.
    semantics: >-
      Closure narrative consumed by audit tooling and the /orient session summary. Empty
      resolution on closed/declined/superseded recs is a data-quality warning (not an error).
    populated_by: >-
      Caller-supplied on update_rec at close time (Decision 70 closure-via-lifecycle-state).
    dq_intent: {}

  execution_result:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Executor post-run result field. DQ-EXCLUDED (Decision 63): not DQ-enforced and not derived.
      Written by the executor after a run attempt.
    semantics: >-
      Executor-internal write-only signal. Not read by the planning or triage paths.
      DQ-EXCLUDED (Decision 63): the DQ runner does not enforce or derive this field.
    governance_notes: >-
      Decision 63 DQ-exclusion: execution_* fields are executor-internal write-only fields
      that the DQ runner does not enforce. They are NOT derived fields.
    populated_by: execute_recommendation.py writes this after run completion.
    dq_intent: {}

  execution_date:
    type: str
    iceberg_type: string
    nullable: true
    description: ISO date string of the last executor run attempt. DQ-EXCLUDED (Decision 63).
    semantics: >-
      Executor-internal timestamp for postmortem audit. DQ-EXCLUDED (Decision 63):
      not enforced or derived. See execution_result semantics.
    governance_notes: Decision 63 DQ-exclusion. See execution_result governance_notes.
    populated_by: execute_recommendation.py writes this after run completion.
    dq_intent: {}

  execution_branch:
    type: str
    iceberg_type: string
    nullable: true
    description: Git branch name used in the last executor run attempt. DQ-EXCLUDED (Decision 63).
    semantics: >-
      Executor-internal git-context field for postmortem audit. DQ-EXCLUDED (Decision 63):
