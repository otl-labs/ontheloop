  created_timestamp:
    type: datetime
    iceberg_type: timestamptz
    nullable: false
    description: >-
      UTC timestamp minted at first write (INSERT). Carried unchanged on all subsequent
      UPDATEs to preserve original creation time across SCD2 versions.
    semantics: "SCD2 envelope field. Minted once at op-start by ducklake_runtime, OUTSIDE the OCC-retry loop. For UPDATE: the existing value from the current projection is carried; it is NEVER re-stamped. Partitions the history table via year(created_timestamp), month(created_timestamp), day(created_timestamp)."
    populated_by: ducklake_runtime._derive_fields() -- NOT caller-supplied.
    dq_intent: {not_null: true}
    derivation:
      formula: high-precision now() minted ONCE at op-start by ducklake_runtime._derive_fields(); carried unchanged on UPDATE
      inputs: []
      realized: true
    amendment_log:
      - date: "2026-09-25"
        semantic_break: false
        change_class: prose_improvement
        summary: "Corrected the history partition spelling from day(created_timestamp) (day-of-month) to the calendar-day triple year(created_timestamp), month(created_timestamp), day(created_timestamp) (rec-4068); governance.partition_by carries the same correction."

  last_updated_timestamp:
    type: datetime
    iceberg_type: timestamptz
    nullable: false
    description: >-
      UTC timestamp of the most recent write to this record. Updated on every write.
      SCD2 ordering key.
    semantics: >-
      SCD2 envelope field. Minted once at op-start by ducklake_runtime, OUTSIDE the
      OCC-retry loop. Stable across all retry iterations of the same write attempt.
      Together with ulid, serves as the tiebreak for selecting the latest SCD2 version.
    populated_by: ducklake_runtime._derive_fields() -- NOT caller-supplied.
    dq_intent: {not_null: true, not_before: created_timestamp}
    derivation:
      formula: high-precision now() minted ONCE at op-start by ducklake_runtime._derive_fields(); stable across OCC retries
      inputs: []
      realized: true

  context_v2_json:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Structured JSON context blob. Supersedes the free-text context field for
      machine-parseable context. Additive migration column (post-initial-deploy).
    semantics: >-
      JSON-serialized structured context for machine consumption. When present, the executor
      preferentially reads this over the free-text context field. Schema is unvalidated at
      T0.12.5; validated shape is deferred to the context-v2 graduation milestone.
    populated_by: Caller-supplied on file_rec/write_ops for recs that populate v2 context.
    dq_intent: {}

  _contract_version:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Contract version string stamped by the ducklake_writer Lambda at write time.
      Value "1" for all rows written after T0.12.5 ratification. Historical rows
      written before T0.12.5 carry NULL (the pre-ratification sentinel).
    semantics: >-
      Handler-layer sentinel: the ducklake_writer handler stamps this on the write payload before passing it to ducklake_runtime (action_write_ops, action_file_ops, action_update_ops). Role is `input` in field_semantics.yaml so the schema gate accepts it from the handler layer. Callers SHOULD NOT supply it -- the handler default is "1"; a pre-supplied value is honoured (allows future version bumps without a handler redeploy). COALESCE("1") in read paths treats NULL historical rows (written before T0.12.5) as the pre-ratification "1" baseline.
    populated_by: >-
      ducklake_writer Lambda handler.py stamps record['_contract_version'] = record.get('_contract_version', '1')
      before rt.write_scd2 / rt.file_scd2. NOT on the smoke-table action_write path.
    dq_intent: {}

governance:
  table_class: SCD2
  partition_by: "history=year(created_timestamp), month(created_timestamp), day(created_timestamp); current=bucket(8, id)"
  dedup_view: ops_recommendations_current
  write_path: >-
    scripts/ops_data_portal.py (file_rec, update_rec) ->
    ducklake_writer Lambda (agent-platform-ducklake-writer) ->
    src/common/ducklake_runtime.py (write_scd2, file_scd2)
  id_allocator: >-
    ducklake_writer/file_ops allocates id atomically in-transaction (Decision 84 I-2).
    Client MUST NOT pre-generate ids.
  merge_key: id

governance_notes: >-
  Decision 65 and Decision 210 cl.3 (rec-4158): this contract is the ONE declared source of every field-semantic and write-time data rule for ops_recommendations (read by scripts/contract_rules.py); the Pydantic models are a consumer projection, and ops.yaml is a DQ-backstop file with no write-time role (validate_ops_rule_source keeps it never stricter than this contract) that retires via T1.6. The portal runs the writer's own gate over this contract's projection as a derived pre-check (write_validators.py gate_write), never authoritative: the writer enforces every rule on every write. Decision 84: sole backend is DuckLake-on-Neon, no second read/write path, no OPS_STORAGE_BACKEND env var; reads transit the closed ducklake_reader boundary (NAMED VERBS only, no caller SQL). Decision 63: execution_* fields (execution_result/date/branch/pr_url/steps) are DQ-EXCLUDED -- documented here, not enforced or derived. Decision 44: step_runner.py and acceptance_lint.py are executor boundary files; modifications require human-driven /implement only. _contract_version: nullable Lambda-handler sentinel; NULL pre-T0.12.5, "1" after.

