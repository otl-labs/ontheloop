# Contract: Overseer Dispatch Model (Design B -- uniform gate-request trampoline)
#
# Decision 86/127 relief valve: holds the detailed dispatch model for the /overseer
# orchestration meta-layer (Decision 90) so .claude/skills/overseer/SKILL.md stays inside its
# prose budget and loads this contract on demand instead of inlining the detail. A Class D
# mechanism contract (migration-step-3-grandfathering, T2.56 migration step 3) as of the
# `contract:` block below.
#
# Origin: three live overseer runs (agent-context-governance, decision-log-premise-integrity,
# terraform-deploy-redesign) surfaced 16 recommendations against the originally-filed Design A
# (subagents inline their own gates). A Fable advice-consult adopted Design B instead: the
# overseer dispatches ALL gates (decision-scout, plan-critique, code-review) as fresh sibling
# subagents; a dispatched author subagent NEVER runs a gate inline via the Skill tool. Same
# intent as the filed recs (remove nesting, preserve gate isolation) via a stronger mechanism.
#
# Transport-agnosticism (Fable Q4): subagent ids and SendMessage handles are transport metadata
# carried ALONGSIDE the schemas below, never fields inside them -- this keeps the schema stable
# across the future durable-Lambda migration, where "dispatch a subagent" stops meaning an
# in-session Agent-tool call.

contract:
  id: overseer-dispatch
  class: D
  contract_version: 1
  status: active
  description: >-
    Class D mechanism-contract envelope for this file (migration-step-3-grandfathering, T2.56
    migration step 3). The Design-B dispatch-model body itself is unchanged by this envelope.
  subject: overseer-dispatch-contract
  evaluator:
    agent_surface: .claude/skills/overseer/SKILL.md

amendment_log:
  - {date: "2026-09-03", semantic_break: false, change_class: field_add, summary: "PLAN-step-6b-fork-classification (B2-R4, PDB-03): added autonomy_tiers.plan_fork_classification (the four-criteria Autonomy-Boundary Policy at plan grain); a fourth GATE_REQUEST gate value with its trampoline_sequence stage, gate_run_id.not_applicable_to carve-out and pending_gates.write_ahead clause; and the corrected dispatch header and gate_run_id.provenance scoping. .claude/commands/plan.md and .claude/skills/planning/SKILL.md are named in applies_to."}
  - {date: "2026-10-18", semantic_break: false, change_class: field_add, summary: "PLAN-red-main-recovery-policy (Decision 226): autonomy_tiers.proceed_with_notice.never_overrides now names the red_overlap verdict instead of any open critical ci_rca rec."}
  - {date: "2026-10-24", semantic_break: true, change_class: accepted_values_narrow, summary: "PLAN-project-alignment: the fourth gate value step-6b-confirmation is retired and replaced by project-alignment (hard cut, no alias); the Step 6a/6b wording is repointed to the Decision Scout and the alignment sign-off defined in docs/contracts/project-alignment.yaml."}
  - {date: "2026-10-30", semantic_break: false, change_class: field_add, summary: "PLAN-critique-severity-convergence: adds gate_request_trampoline.escalation (a convergence escalation is relayed to the human, never dispatched as a round); the decision-scout and plan-critique stages defer to the planning skill's convergence rules instead of restating a retired round cap."}
  - {date: "2026-10-30", semantic_break: false, change_class: field_add, summary: "PLAN-plan-fork-line-check (rec-3530): record_grammar states what a consistency-only line's precedent must carry; enforcement_coverage gains the mechanical validate_plan_fork_lines row and the residual row narrows to classification judgement, owned by rec-4786 (rec-3530 superseded); the 2026-09-03 and 2026-10-18 entries are compacted to one line each (Decision 166 relief valve)."}

schema_version: 1
decision: Decision-90

division_of_labor:
  author_subagent:
    role: "The dispatched /plan or /implement subagent (Planning-Subagent Dispatch /
      Implementation-Subagent Dispatch in the overseer skill)."
    produces: "One merged artefact per slice: a merged PLAN-{slug}.yaml (planning subagent) or a
      merged implementation PR (implementation subagent)."
    responsibilities:
      - "Runs its own lifecycle (clarify, context, scope, write -- or implement, verify) exactly
        as /plan or /implement would standalone."
      - "Commits and pushes its own artefact."
      - "Opens its own PR (plan-approval PR or implementation PR)."
      - "Whenever its lifecycle reaches a gate (decision-scout, project-alignment,
        plan-critique, code-review), it NEVER invokes the gate skill inline via the Skill tool.
        It returns a GATE_REQUEST hand-back (see gate_request_trampoline below) and pauses."
      - "Stops at PR-open. It does not subscribe to PR activity, does not wait for CI, and does
        not merge -- it hands the PR back to the overseer via the Bounded Hand-Back schema
        (status PROCEED, artifacts=[PR URL])."
    stops_at: "PR-open. Everything from subscribe_pr_activity onward belongs to the overseer."
  overseer:
    role: "The orchestrating session (this skill)."
    owns:
      - "ALL gate dispatch: every decision-scout, plan-critique, and code-review invocation for
        every slice is a fresh sibling subagent the overseer itself dispatches -- gate ownership
        never lives with the author subagent."
      - "The full subscribe_pr_activity -> CI-green-wake -> confirm-check-runs ->
        squash-merge flow (Decision 76 event-driven flow; run_in_background: false is not
        relevant here -- the point is the overseer, not the author subagent, holds the
        subscription and does the waiting) for every slice's PR, in the foreground of its own
        turn, resuming the paused author subagent via SendMessage once each gate verdict or
        merge lands."
      - "The ledger (docs/plans/reports/OVERSEER-{slug}.yaml), the liveness watchdog, the
        safety-net trigger, and all human-gated checkpoints (G0/G1/G3)."
    never: "Never edits source code, terraform, or Python directly, and never runs a gate's own
      methodology itself (Skill tool) in the overseer's own context -- gates always run in a
      dispatched sibling, per the Read-Nothing Router Discipline this contract complements."

gate_request_trampoline:
  additional_status: "GATE_REQUEST -- a new value for the Bounded Hand-Back schema's `status`
    field, alongside the existing PROCEED | REVISE | BLOCKED | FAILED. A GATE_REQUEST hand-back
    is never terminal for a slice; the slice's ledger status stays planning/implementing through
    it."
  request_schema: "a GATE_REQUEST hand-back is the SAME six-field Bounded Hand-Back shape
    (status/summary/artifacts/evidence/decisions/open_questions) EXTENDED with three
    trampoline-specific fields -- it is a strict superset, never a replacement shape, so the
    overseer's existing malformed-hand-back re-dispatch rule still applies unchanged. The three
    extension fields:
    gate (decision-scout | plan-critique | code-review | project-alignment),
    round (1-based count of how many times this gate has been dispatched for this slice),
    inputs (gate-specific prompt inputs the overseer must relay verbatim into the fresh gate
    subagent's dispatch prompt -- e.g. for decision-scout: intent, proposed approach, scope
    files, verification tier, explicitly cited decisions; for plan-critique: the plan file path;
    for code-review: the branch and plan file path; for project-alignment: the alignment sign-off presentation and its design forks, carried in `open_questions`).
    The base shape's own `artifacts` field (NOT a separate `artifacts_written` field -- there is
    only one artifacts field, reused here) carries the paths already committed and pushed by the
    author subagent (plan file, branch head), so the gate subagent reads current on-disk/on-PR
    state, never a chat-pasted body; `summary`/`evidence`/`decisions`/`open_questions` may be
    minimal (e.g. summary: \"requesting <gate> gate\") since the substantive payload for a
    GATE_REQUEST is the three extension fields plus `artifacts`, not those four. The first three
    gate values dispatch a gate skill in a fresh sibling subagent; the fourth,
    project-alignment, dispatches no gate skill at all -- it is relayed by the overseer
    directly to the human, per autonomy_tiers.plan_fork_classification above."
  escalation: "a decision-scout or plan-critique GATE_REQUEST with non-empty `open_questions` is the planning skill's
    convergence escalation, not a round request (its `round` repeats the last round run): the overseer dispatches any
    Fable consult it requests (an `open_questions` item) first, relays both to the human verbatim, dispatches no gate
    round, and resumes the author with the answer. Like project-alignment it is write-ahead-recorded with its
    `open_questions` as `inputs` and mints no gate_run_id; on resume it is re-relayed, never re-dispatched as a round. A
    round request leaves `open_questions` empty."
  gate_run_id:
    minted_by: overseer
    when: "at write-ahead time (see pending_gates below), before the gate subagent is
      dispatched."
    format: "<slug>-<gate>-r<round>-<8hex>, e.g. terraform-deploy-redesign-decision-scout-r1-a1b2c3d4"
    provenance: "the overseer's dispatch prompt to the gate subagent has TWO parts, never merged:
      (1) the gate skill's own unmodified invocation instruction (verbatim per
      decision-scout/plan-critique/code-review's existing dispatch shape in
      planning/SKILL.md or implement/SKILL.md -- their `## Decision Scout Report` /
      plan-critique / code-review output formats are NOT extended with a gate_run_id or
      evidence field, preserving the bit-for-bit gate-contract constraint), PLUS (2) a
      trailing, out-of-band instruction appended by the overseer itself, outside the gate
      skill's own methodology: 'After producing that structured report, append one final
      line to your response: gate_run_id: <the exact value below>.' The overseer parses that
      trailing line from the subagent's raw response text -- it is never a field inside the
      gate skill's own report schema. For the three SKILL-DISPATCHED (literal token:
      skill-dispatched) gates, this is the ONE non-optional piece of the trampoline: it is the
      only check that a subagent did not silently run a bias gate inline instead of requesting
      it -- a gate response with no trailing gate_run_id line, or a mismatched one, is not
      trustworthy and must be re-dispatched properly rather than accepted. See
      not_applicable_to below for the one exempted gate value."
    not_applicable_to: "project-alignment. There is no gate subagent to echo the id, and a
      human turn cannot be inlined by the author, which is the only property the id proves --
      so minting one for a human-relayed hop would prove nothing. Exception: when the overseer
      instead dispatches a fresh sibling to stand in for the human under delegated authority
      recorded in autonomous_decision_log, the id IS minted and echoed exactly as for the three
      skill-dispatched gates."
  pending_gates:
    write_ahead: "the overseer appends {gate, round, gate_run_id, slice, requested_at, inputs} to
      the ledger's pending_gates list BEFORE dispatching the gate subagent -- never after. The
      `inputs` field is REQUIRED here (not merely in the request_schema payload): for
      decision-scout specifically, its inputs (intent, approach, scope, tier, cited_decisions) are
      free text with no artifact on disk yet at the Decision Scout (the plan file doesn't exist until Step
      8), so they are NOT recoverable via artifact_first_yield on a crash -- pending_gates is the
      only durable-enough-to-survive-resume copy. (plan-critique's and code-review's inputs are
      already artifact paths -- plan_path / branch -- so persisting them here is a consistency
      convenience, not a hard requirement, for those two gates.) This makes a mid-dispatch crash
      or compaction genuinely RE-DRIVABLE on resume, not merely observable: a pending_gates entry
      with no matching gate-verdict ledger update means re-dispatch the gate using this entry's
      own `inputs` verbatim, never re-deriving them from the (possibly-gone) author subagent. A
      project-alignment entry is write-ahead-recorded too, and its `inputs` (the alignment sign-off presentation and the open_questions, verbatim) is REQUIRED for the same reason
      decision-scout's is: neither exists on disk until Step 8 writes the plan, so neither is
      recoverable via artifact_first_yield."
    resolution: "on receiving the gate subagent's verdict (with matching gate_run_id), the
      overseer removes the entry from pending_gates and records the verdict against the slice."
  artifact_first_yield: "the gate-requesting author subagent's payload is the artifact path(s)
    it already committed and pushed, never a pasted-in-context body -- so the fresh gate
    subagent's own read (Skill-tool invocation of decision-scout/plan-critique/code-review)
    pulls current state directly, exactly as it would if dispatched standalone by /plan or
    /implement."
  resume_mechanism:
    sendmessage_resume: "once the overseer has the gate verdict, it resumes the ORIGINAL paused
      author subagent via SendMessage (not a fresh re-dispatch) so the author's context and
      working tree state carry forward untouched."
    fallback_is_optimization_not_requirement: "SendMessage-resume is an optimization over
      artifact re-dispatch, not a correctness requirement. If the author subagent is
      unrecoverable (dead per the liveness diagnostic, expired, or restarted), the overseer
      falls back to a FRESH dispatch seeded from the ledger's last hand-back `artifacts` + the
      gate verdict -- this works because the artifact-first yield already made all needed state
      durable on disk/PR, not trapped in the dead subagent's context."

subagent_detection:
  purpose: "the three-signal stack a dispatched author subagent uses to know it must
    GATE_REQUEST rather than run a gate inline."
  signals:
    - name: tool_roster_absence
      description: "the Agent tool is absent from the dispatched subagent's own available tool
        roster -- a fresh general-purpose subagent dispatched by the overseer cannot itself call
        Agent, so it structurally cannot nest a further dispatch. Cheapest signal to check;
        survives even if prompt content is lost to compaction."
    - name: injected_header
      description: "the overseer injects an exact SUBAGENT CONTEXT header as the first line(s)
        of every author-subagent dispatch prompt. Its presence is the primary declarative
        signal."
      exact_header: |
        SUBAGENT CONTEXT: You are a dispatched subagent running under /overseer orchestration.
        You do not have Agent tool access. Any gate you would normally run inline via the Skill
        tool (decision-scout, plan-critique, code-review) must instead be requested via a
        GATE_REQUEST hand-back to the orchestrator -- never run inline.
        The same hand-back rule applies to your /plan alignment sign-off and its design forks:
        you hold no AskUserQuestion tool, so they ride a post-verdict GATE_REQUEST
        (gate: project-alignment) the orchestrator relays; never decide an always-ask fork
        yourself and never skip the confirmation.
    - name: error_fallback
      description: "if a subagent nonetheless attempts a nested Agent-tool dispatch and receives
        a nesting error (or any error consistent with 'Agent tool unavailable' / 'nesting not
        permitted'), it treats this as an authoritative third signal and switches to
        gate-request mode for the remainder of its run, even if the injected header was somehow
        stripped or missed."
  precedence: "tool-roster absence first (no dependency on prompt content surviving
    compaction), then the injected header (primary declarative signal), then error-fallback
    (last-resort recovery for when both proactive checks failed to prevent an inline attempt)."

trampoline_sequence:
  description: "the COMPOSED end-to-end sequence, not merely the ingredient list -- where each
    GATE_REQUEST fires, how the overseer resumes the paused author, and how these mid-lifecycle
    pauses interleave with the terminal author-opens-PR / overseer-owns-merge division of
    labor."
  stages:
    - gate: decision-scout
      fires_at: "planning subagent's own /plan Decision Scout, before its alignment sign-off presentation."
      flow:
        - "1. Planning subagent completes Steps 1-5 (clarify, context, approach, scope,
          verification tier). Reaching the Decision Scout, subagent_detection fires; it returns
          GATE_REQUEST(gate=decision-scout, round=1, inputs={intent, approach, scope, tier,
          cited_decisions}) and pauses."
        - "2. Overseer write-ahead-records the pending_gates entry, mints gate_run_id, dispatches
          a fresh sibling subagent to run the Decision Scout Gate exactly per planning/SKILL.md
          (unmodified), plus the trailing gate_run_id-echo instruction per
          gate_request_trampoline.gate_run_id.provenance above."
        - "3. Overseer receives the scout verdict (NO_FLAGS | FLAGS_FOUND | BLOCK) with matching
          gate_run_id, resumes the paused planning subagent via SendMessage with the verdict and
          CITE list."
        - "4. Planning subagent applies its own existing Verdict handling (alignment sign-off presentation
          on NO_FLAGS/FLAGS_FOUND, or GATE_REQUEST round=N+1 after a BLOCK pivot, per the
          planning skill's Decision Scout convergence rule)."
    - gate: project-alignment
      fires_at: "planning subagent's own /plan alignment sign-off, after the decision-scout verdict is
        applied -- never before the decision-scout verdict (on BLOCK there is no hop at all; on
        FLAGS_FOUND the flags ride inside the presentation). Dispatches no gate skill."
      flow:
        - "1. The author composes its alignment sign-off presentation and returns a SECOND hand-back
          (status GATE_REQUEST, gate=project-alignment, round=1) carrying the presentation
          and its design forks in `open_questions`."
        - "2. The overseer write-ahead-records it, relays the presentation and questions to the
          human VERBATIM (gate bodies whole, never summarised by item number), and the human's
          answers and confirmation (or feedback) return on a SECOND SendMessage resume, which
          the author applies at the alignment sign-off before Step 7."
    - gate: plan-critique
      fires_at: "planning subagent's own /plan Step 9, after the alignment sign-off and the
        plan write."
      flow:
        - "1. Planning subagent writes the plan file, reaches Step 9, and returns
          GATE_REQUEST(gate=plan-critique, round=1, inputs={plan_path}) and pauses."
        - "2. Overseer write-ahead-records, mints gate_run_id, dispatches a fresh sibling per
          planning/SKILL.md's Critique Gate section (unmodified) plus the trailing
          gate_run_id-echo instruction (see provenance above)."
        - "3. Overseer resumes the planning subagent via SendMessage with the critique output and
          Recommendation (PROCEED | REVISE)."
        - "4. On a PROCEED that ends the planning skill's Step 9 loop (no nits, or the confirming round's): the planning
          subagent commits, pushes, opens the plan-approval PR itself, and hands back PROCEED with the PR URL -- this is
          the terminal author-side step; the overseer takes it from there (subscribe -> CI-green -> squash-merge). On
          REVISE, or any other PROCEED listing nits: the subagent fixes and re-requests (round=N+1) per that Step 9 rule."
    - gate: code-review
      fires_at: "implementation subagent's own /implement Step 5, immediately after the Live
        Verification Protocol passes."
      flow:
        - "1. Implementation subagent's VP Compliance Gate shows all-PASS; tier_item bookkeeping
          (implement/SKILL.md's parallel-with-code-review state machine) still runs to completion
          in the SAME author-subagent turn BEFORE the GATE_REQUEST is returned -- gate-request
          mode changes who dispatches the review, not the bookkeeping-before-dispatch ordering;
          it removes the concurrency (author and reviewer no longer run at the same time under
          Design B, since the author fully pauses on GATE_REQUEST). The author then returns
          GATE_REQUEST(gate=code-review, round=1, inputs={branch, plan_path}) and pauses."
        - "2. Overseer write-ahead-records, mints gate_run_id, dispatches a fresh sibling per
          implement/SKILL.md's Code Review Protocol section (unmodified) plus the trailing
          gate_run_id-echo instruction (see provenance above)."
        - "3. Overseer resumes the implementation subagent via SendMessage with the findings and
          Verdict (PROCEED | REVISE)."
        - "4. On PROCEED: the implementation subagent commits, pushes, opens the implementation PR
          itself, and hands back PROCEED with the PR URL -- terminal author-side step. On REVISE:
          it fixes Critical/High findings and re-requests (round=2)."
  interleave_with_pr_lifecycle: "these mid-lifecycle GATE_REQUEST pauses are orthogonal to, and
    precede, the terminal division-of-labor split. The author subagent still authors, commits,
    pushes, and opens the PR itself (post-plan-critique for planning; post-code-review for
    implementation), then hands back to the overseer at that single terminal point. The
    overseer's gate dispatches during Steps 6/9/5 never touch git state; only the terminal
    PR-open (author) and subscribe/merge (overseer) steps do. A GATE_REQUEST pause is never
    itself a hand-back terminus -- the ledger's slice status stays planning/implementing through
    it; only PROCEED/REVISE/BLOCKED/FAILED and the eventual merged state change slice status."

liveness:
  diagnostic: "ls -laL <transcript-symlink-path> reports the TARGET file's mtime (the -L flag
    dereferences the symlink; a plain ls -la on the symlink itself reports the symlink's own
    near-constant creation time, which is useless as a liveness signal)."
  death_signature: "a transcript target mtime older than the stall threshold AND no
    corresponding TaskOutput/notification arriving is the death signature -- the dispatched
    subagent's underlying process/container died or was reclaimed without emitting a terminal
    event."
  false_stall_warning: "a subagent that is merely slow (a long-running V3 deploy step, a long
    code-review pass) also shows an aging transcript mtime between its own writes. Do not treat
    a single stale-mtime read as death -- cross-check against the gate/stage the subagent last
    reported in its ledger hand_back and the expected duration for that stage before concluding
    death."
  restart_recovery: "on a confirmed death signature, the overseer re-dispatches a FRESH subagent
    seeded from the ledger's last known hand-back `artifacts` + status for that slice -- never a
    rescue-in-place resume of a dead session. This is the same re-dispatch mechanism as an
    ordinary GATE_REQUEST re-dispatch, just triggered by liveness failure instead of a returned
    verdict. TWO SEPARATE counters, never conflated: an AUTHOR restart-death counts as one of the
    plan's existing two BLOCKED/FAILED attempts (it is evidence about that slice's own
    difficulty) before executor-rca escalation. A GATE subagent restart-death is pure
    infrastructure flakiness, not a content-quality signal about the author's work -- it gets its
    own separate 2-attempt counter PER (gate, round); exhausting it escalates as an infra RCA
    (executor-rca with the liveness diagnostic as evidence) WITHOUT incrementing or affecting the
    author's own BLOCKED/FAILED count."
  stall_nudge: "on an ambiguous stall (transcript aging, no death signature, no new ledger update
    past the expected duration for the current stage) the overseer sends ONE SendMessage nudge
    (a cheap re-orientation, not new instructions) before considering it stalled further; if a
    second stall window elapses with no response, treat it as a death signature and restart."
  deterministic_recovery_framing: "restart-death re-dispatch and the stall-nudge are BOUNDED
    deterministic recovery for a well-understood failure class (Decision 55) -- never an
    LLM-judgement rescue loop. The bound: at most one nudge per stall episode; restart-death
    always counts against the existing two-attempt cap."

safety_net:
  trigger_lifecycle: "exactly one create_trigger call at G0 (intake) and exactly one
    delete_trigger call at G3 (completion) per overseer run -- never a per-interval polling
    trigger. Decision 76 / the AGENTS.md send_later/trigger retirement scopes that retirement to
    CI-wait/merge-conflict, both now event-covered surfaces; subagent DEATH emits no event of
    its own, which is the genuinely uncovered gap this one watchdog closes."
  carve_around_decision_76: "decision-scout flagged [WARN] that this re-introduces a self-bind
    trigger; accepted with the explicit carve-around above -- constrained to G0-create/G3-teardown
    only, no polling, the per-call approval prompt accepted as cost, and mcp__Claude_Code_Remote__*
    is never allowlisted (AGENTS.md: an ask-tier rule outranks allow; CC-web ignores
    bypassPermissions from settings for this tool family)."
  heartbeat_preamble: "pointer-not-payload: the trigger's fired-turn prompt is a short
    re-orientation preamble (ledger file path + 'read it and resume') plus a ledger pointer,
    never a full intent restatement -- keeps the fired turn cheap even after a compaction."
  cheap_path: "if the ledger shows the run already progressing normally (a slice updated more
    recently than the trigger interval), the fired turn replies HEARTBEAT-OK and takes no
    action -- the expected, common case, not an error path."
  fired_turn_connector_note: "the fired turn is a real conversational turn with full tool
    access (mcp__Claude_Code_Remote__* included) -- not a restricted/sandboxed callback; the
    per-run G0/G3 approval prompts are accepted by the human as the cost of this watchdog
    (plan-critique gate PROCEED note)."

nesting_depth_hook_deferral:
  decision: "Fable Q3: the nesting-depth PreToolUse hook is NOT built."
  reason: "CC-web exposes no reliable subagent-depth signal to hooks -- a depth-blind hook would
    block the overseer's own top-level dispatches indistinguishably from a genuine nested-dispatch
    attempt."
  preconditions_for_revisit:
    - "CC-web (or the underlying harness) exposes a reliable, hook-readable subagent-depth
      signal (e.g. an env var or context field a PreToolUse hook can read to distinguish depth-0
      overseer dispatch from depth-1+ nested dispatch)."
    - "A second, independent instance of accidental gate-inlining-via-nesting is observed in
      production (the three-signal subagent_detection stack plus error_fallback are judged
      sufficient absent that evidence)."

autonomy_tiers:
  proceed_with_notice:
    description: "a LOW-STAKES autonomy tier narrower than the existing four-criteria
      autonomy-boundary policy. For a decision that is reversible, settled-consensus, AND has no
      plausible negative externality even if wrong (e.g. cosmetic ledger formatting, choosing
      between two equally-valid prose orderings), the overseer proceeds WITHOUT waiting for a
      synchronous human reply, but ALWAYS posts an explicit notice to the ledger's
      autonomous_decision_log and to human-visible chat output describing what it did and why --
      so the human can override on their own schedule instead of blocking the run."
    distinguishing_test: "differs from the existing autonomy-boundary policy's silent-autonomous
      path by ALWAYS surfacing a notice (never silent), and from a human-gated decision by NOT
      blocking for a reply. Never applies to the hard always-ask list (IAM/security, spend
      impact, public-surface artefacts, governed-deploy actions) -- those stay synchronous
      regardless."
    never_overrides: "a red the red_overlap check blocks (Decision 226: overlapping, undeterminable,
      unreadable, or past its repair SLO) is never proceed-with-notice-eligible -- the halt stays a hard
      block even for a low-stakes-looking dispatch decision."
  plan_fork_classification:
    applies_to: >-
      alignment sign-off design forks; ports the four-criteria Autonomy-Boundary Policy to plan grain
      (the process is defined in docs/contracts/project-alignment.yaml).
      Reader surfaces named by path: .claude/commands/plan.md alignment sign-off and
      .claude/skills/planning/SKILL.md Alignment Sign-off carry the classification;
      .claude/skills/overseer/SKILL.md carries the dispatched carrier and relay hop; and this
      contract's own subagent_detection.signals[injected_header].exact_header is the verbatim
      text a dispatched author actually reads at dispatch time. The alignment sign-off
      itself is untouched -- decided-with-notice forks are part of what the human confirms,
      never a replacement for it.
    consistency_only_test: >-
      All FOUR autonomy-boundary criteria must hold -- settled-consensus (re-read per
      settled_consensus_reread below), convention-fit, reversible (worst case a plan revision),
      and no-credible-alternative (a fork weighing a credible alternative is never
      consistency-only) -- AND the fork must be off the always_ask list below. A fork that fails
      any criterion, or that is on always_ask, defers to always_ask and asks.
    settled_consensus_reread: >-
      A repo-internal fork has no external practice to consult, so 'settled' means settled by
      REPO PRECEDENT -- a Decision, a contract, or a fork the human ANSWERED in a prior plan. A
      decided-with-notice line is NEVER precedent, and a fork without precedent always asks; a
      Fable consult may inform the recommended option, never replace asking. The precedent corpus
      is thin BY MEASUREMENT, stated as TWO figures: the audit's pinned fork/option pattern
      (contract_notes 7c) matched 2 of 366 plans when B2-R4 was written (PLAN-dcg-decisions-index,
      PLAN-provisional-contract-alarm); re-measured by the implementer at origin/main f11c9bef,
      excluding this remediation run's own six slice plans from the evidentiary base (one of
      them, PLAN-ci-rca-deferral-instrumentation, does not match the pattern), it matches the
      SAME 2 of 376. Exactly ONE fork -- PLAN-dcg-decisions-index fork 1, committed JSON
      [recommended] vs Markdown -- survives this test as the exemplar; that handful is the whole
      evidentiary base, which is why this tier is bounded to consistency-only forks.
    always_ask: >-
      IAM/security; spend; any public-surface artefact (incl. the PUBLIC-repository boundary and
      AGENTS.md); any governed-deploy action; any Decision conflict or roadmap CONFLICT the
      decision-scout flagged; and any fork with no settled precedent.
    ask_shape_interactive: >-
      AskUserQuestion field mapping: question = the fork sentence; header = a short label;
      options = 2-4 choices with the recommended option first (the tool's own convention widens
      the ported Autonomy-Boundary Policy's "present 2-3 options and wait"
      (.claude/skills/overseer/SKILL.md:176) to AskUserQuestion's own 2-4 cap -- the two tiers are
      not in contradiction); description = consequences, reversibility, and where the choice is
      persisted.
    ask_shape_dispatched: >-
      The same shape rides a SECOND, post-verdict hand-back whose status stays GATE_REQUEST and
      whose gate is the fourth value project-alignment, carrying the alignment sign-off presentation plus
      the design forks in open_questions, relayed verbatim by the overseer -- see
      gate_request_trampoline.request_schema and trampoline_sequence below.
    record_grammar: >-
      One line per fork: 'fork: <sentence> | chosen: <X> | class: consistency-only|asked |
      precedent: <ref> | precedent_kind: decision|contract|answered-fork | reversible: yes|no |
      persisted: <where>'. precedent: none | precedent_kind: none is legal ONLY on a class: asked
      line. A fork answered by a delegate under recorded delegated authority carries that
      provenance in the precedent slot, so a later planner can judge whether it counts as an
      ANSWERED fork. An enum field carries its bare literal, with no note after it, and precedent: none
      pairs only with precedent_kind: none. On a class: consistency-only line, reversible is yes and
      precedent names at least one pointer of its precedent_kind, and every such pointer resolves:
      decision, 'Decision NNN' naming an entry that exists and is not superseded; contract, a file
      under docs/contracts/ by path or file name, with an optional '#dotted.key' anchor that exists in
      it; answered-fork, 'PLAN-<slug> fork <n>' naming another plan whose n-th context[] fork line is
      class: asked. Other text may follow the pointers.
    notice_tier: >-
      Decided forks are listed at the alignment sign-off as decided-with-notice -- the proceed_with_notice tier
      at plan grain: visible before confirmation, never silent, catchable by the confirmation
      itself, the plan-critique gate, or /implement's deviation trigger.
    enforcement_coverage:
      - surface: "this section's nine-field shape, the trampoline relay hop, and the corrected
          dispatch header/provenance"
        status: mechanical
        enforced_by: plan-fork-classification-contract-shape
        note: >-
          Runs unconditionally in the full tier (pre-handoff local + post-merge on main) and in
          --pre only when the diff-aware affected-set selection picks it (Decision 135) -- a
          documentation-only edit to one of the three instruction surfaces may therefore be
          caught post-merge rather than pre-merge; the registry shard adds a one-time
          differential admission at graduation, not a per-PR re-run.
      - surface: "a plan's context[] fork line that a diff adds or changes -- record_grammar shape, and on a
          consistency-only line reversible: yes and precedent pointers that resolve"
        status: mechanical
        enforced_by: validate_plan_fork_lines
        note: >-
          Both tiers. A line already on the diff base is never re-judged, with no waiver, marker or grandfather
          (Decision 163 point 1), so lines written before the check stand until an edit touches them. It proves shape
          and that each pointer resolves, not that the precedent settles the fork, and it cannot see a fork the plan
          never recorded. It retires with the context[] line when the operator_decision writer (staged CD.47) is built.
      - surface: "whether a consistency-only line's precedent settles that fork, whether the fork is convention-fit,
          has no credible alternative and is off always_ask, and whether a cited answered fork was the human's"
        status: residual_agent_obligation
        residual_owner: "rec-4786"
        note: >-
          Narrowed from rec-3530: judgement, so no check closes it. The alignment sign-off is where it is caught today,
          since the human sees every decided-with-notice line before confirming; plan-critique has no
          fork-classification item and /implement's deviation trigger does not read fork lines.

fable_triggers:
  existing: "before each major design decision (the G1 decomposition shape; any point where the
    overseer itself must choose an architecture rather than sequence already-known work)."
  broadened:
    workflow_adaptation: "whenever the overseer must adapt its OWN dispatch workflow to a
      situation the existing methodology does not explicitly cover (an unusual liveness-failure
      pattern, a slice whose overlap-matrix classification is genuinely ambiguous) -- consult
      Fable before improvising a one-off workaround."
    rec_synthesis: "whenever the overseer must synthesize or reconcile a cluster of related
      recommendations into a coherent slice boundary (as opposed to sequencing already-atomic,
      already-scoped work) -- this synthesis judgment gets the same settled-vs-contested
      treatment as a G1 decomposition-shape call."

ledger_persistence:
  working_copy: "the overseer maintains its live OVERSEER-{slug}.yaml working copy in the
    session scratchpad during the run (fast, no commit-per-update overhead) -- NOT durable
    across a full session loss."
  durable_resume_sot: "the durable, cross-session source of truth for 'where is this run' is NOT
    the scratchpad ledger -- it is the actual PR/merge state on GitHub (each slice's open PR and
    its review/CI state, or its merged commit), per Decision 115 (transient handoffs ride PR
    descriptions) and Decision 87. On a cold resume (new session, scratchpad lost), the overseer
    reconstructs slice status by querying each slice's PR state via the GitHub MCP tools, not by
    trusting a stale local ledger file. SCOPE CAVEAT: this SoT covers the POST-artifact-write
    portion of a slice's lifecycle only (once a plan file or branch exists to query against). A
    full session loss DURING the pre-PR-open gate-request sequence (interleave_with_pr_lifecycle
    -- decision-scout/plan-critique fire before the plan file is committed) has NO durable,
    PR-observable signal to distinguish progress among the four gates; only the (non-durable)
    scratchpad pending_gates entries covered that window, and they are gone too. Recovery in that
    specific case is to restart the slice's gate sequence from decision-scout round 1 -- bounded,
    non-destructive cost (no merged artefact to unwind), not a gap requiring a new mechanism."
  reconciliation: "if the scratchpad ledger and the GitHub PR state disagree (e.g. the ledger
    shows a slice 'implementing' but its PR is actually merged), GitHub PR state wins -- rewrite
    the ledger to match, never the reverse."

executor_rca_feed:
  when: "a slice comes back BLOCKED or FAILED twice (the plan's existing two-attempt cap)."
  artifact: "dispatch the executor-rca skill with ONE of: the dead/failed subagent's transcript
    (if recoverable), its last artifact output file, a fresh re-dispatch specifically to
    reproduce and capture the failure, or -- if none of those are available -- the SUBAGENT
    CONTEXT + prompt the overseer originally dispatched, so the RCA has SOME concrete evidence to
    diagnose against rather than a bare 'it failed twice' summary."
  escalation: "the overseer surfaces the RCA findings to the human alongside the slice's
    BLOCKED/FAILED status -- the existing Lifecycle-and-Gates escalation path; named here only to
    specify which artifact feeds it."

model_namespace_note:
  distinction: "the skill-frontmatter `model:` field (e.g. `opus[1m]` on the overseer skill
    itself, or `opus` / `sonnet` / `fable` used when describing which model a dispatch should
    run) is a DIFFERENT NAMESPACE from the Agent tool's `model` parameter, which is a fixed enum
    (sonnet | opus | haiku | fable). A frontmatter pin like `opus[1m]` is NOT a valid value for
    the Agent tool's model parameter -- there are no context-window-suffix variants in that
    enum. When dispatching, pass the Agent tool's own enum values; the frontmatter pin governs
    which model runs the CURRENT skill's own session, not what gets passed to a nested Agent
    call."

intake_headroom_check:
  when: "G0 intake, before confirming scope with the human."
  what: "read the LIVE roadmap ceiling/guard state (Decision 114) -- not a hardcoded number -- to
    confirm the targeted roadmap item or audit has headroom under the current ceiling before
    committing to a multi-slice run. A run that would push past the ceiling mid-flight is a G0
    finding to surface to the human, not a mid-run surprise."
  source: "the same preflight/platform_roadmap projection the Read-Nothing Router Discipline
    already loads at G0 -- no new read surface."

bounded_validation:
  what: "each dispatched implementation subagent already runs `bin/venv-python -m
    scripts.validate --pre` per implement/SKILL.md's Commit Flows section before opening its PR
    -- the overseer does not additionally run the FULL (unflagged) validate tier itself; that
    would duplicate work the author subagent already owns and would violate the Read-Nothing
    Router Discipline by pulling repo-wide state into the overseer's own context."
  why_bounded: "the overseer's own in-loop check, when it wants a cheap sanity read (e.g. before
    confirming a G1 wave plan against a possibly-stale branch), is limited to reading the
    preflight cache and PR/CI status -- never re-running the full validate suite locally in the
    overseer's own session."
