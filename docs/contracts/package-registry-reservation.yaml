# Package-registry namespace-reservation operator procedure (rec-3941, Decision 101/184/195/198).
# A Class D mechanism contract carrying the per-registry HUMAN / AGENT-RUNNABLE operator
# walkthrough for holding the `ontheloop` distribution namespace on PyPI, npm and crates.io
# before it is taken, plus the anti-squatting posture, the neutral-placeholder content
# constraint, and the identity/ownership rules. A claim made under this procedure is a DEFENSIVE
# NAMESPACE HOLD; "On The Loop" is the RATIFIED mark (Decision 198), which supersedes
# the retired external-brand hierarchy Decision 101 originally named. This contract itself
# claims no name, publishes no package, creates no account and stores no credential -- execution
# is operator-only by construction (registry publication needs 2FA-backed credentials no agent
# holds) and is tracked at rec-3941, which stays open until a claim actually lands.
contract:
  id: package-registry-reservation
  class: D
  contract_version: 2
  status: ratified
  ratified_via: "PLAN-ontheloop-package-registries"
  description: >-
    Per-registry operator procedure for reserving the `ontheloop` namespace on PyPI, npm and
    crates.io, plus the anti-squatting posture, the neutral-placeholder content constraint, and
    the identity/ownership rules. Claims nothing and publishes nothing itself; execution is
    operator-only (rec-3941).
  subject: package-registry-reservation
  evaluator:
    agent_surface: docs/CLAUDE.md

amendment_log:
  - {date: "2026-11-02", semantic_break: false, change_class: prose_improvement, summary: "PLAN-glossary-sweep (rec-4676): relative words replaced by glossary names (Decision 240); no field or rule meaning changes."}
  - date: "2026-09-22"
    semantic_break: false
    change_class: correction
    summary: >-
      PLAN-ontheloop-placeholder-packages (rec-3995, rec-3941): eleven corrections under one
      dated entry. Four are rec-3995's own (header comment; posture.installability_rationale;
      identity.security_contact; identity.crates_io_ownership) -- all still cited a pre-Decision-198
      framing (rec-3922 open, the retired Theseus/Guerdon/Semanto hierarchy ratified, the GitHub
      org handle undecided) that Decision 198 and PLAN-ontheloop-package-registries (#1239,
      merged 2026-09-21) had already falsified. Three more are the same stale rec-3922 framing in
      posture.disposition, posture.neutral_placeholder and tracking.note, which rec-3995's own
      acceptance oracle (a header-only grep) does not reach. Four are execution-discovered:
      posture.scope_anti_squatting still named the bare `@ontheloop` npm scope rather than the
      operator-decided `@onthelooplabs` organization; procedure.npm's org-availability step did
      not name "org creation" in checkable form; procedure.pypi described a manual token-upload
      flow rather than the PyPI Trusted Publishing (OIDC) dispatch this plan's
      publish-ontheloop.yml workflow actually implements, and did not state that a pending
      Trusted Publisher does not reserve the name; procedure.crates_io's token step did not name
      a scoped API token. Also added the pypi_trusted_publisher block recording the
      repository/workflow-filename/environment trust triple the live workflow is now guarded
      against (Decision 163/172), and bumped contract_version 1 -> 2.
  - date: "2026-09-21"
    semantic_break: false
    change_class: field_add
    summary: >-
      PLAN-ontheloop-package-registries: initial authoring. Records the per-registry operator
      procedure, the anti-squatting posture, the neutral-placeholder constraint, and the identity
      rules for reserving the `ontheloop` namespace. Live registry measurement 2026-09-21
      (CC-web): `ontheloop` unclaimed (HTTP 404) on PyPI, npm and crates.io; the RATIFIED brand
      `theseus` is already taken (HTTP 200) on all three -- stated here as NOT CONTESTED and NOT
      ACQUIRED by this contract or its execution.

posture:
  disposition: >-
    A claim made under this contract is a DEFENSIVE NAMESPACE HOLD, never a substitute for brand
    governance. Decision 195 records company ownership and IP assignment; Decision 198 ratifies
    On The Loop as the mark. The namespace is anchorable to both the ratified company
    name (Decision 195 clause 1) and the ratified mark (Decision 198).
  scope_anti_squatting: >-
    One claim per registry, per rec-3941. PyPI: `ontheloop` only. crates.io: `ontheloop` only,
    with real content -- publication is IMMUTABLE (yank, never delete), so the first version must
    carry a correct licence and description. npm: the bare `ontheloop` name PLUS the
    `@onthelooplabs` scope (npm's own sanctioned namespace mechanism; `@onthelooplabs` is the
    operator-decided npm organization, a separate registry-account identifier from Decision 198
    clause 3's GitHub org handle `otl-labs`). Hyphenated and other variants are deliberately NOT
    claimed -- bulk variant-grabbing beyond the ratified mark is the shape all three registries'
    anti-squatting policies actually target.
  neutral_placeholder: >-
    Decision 101(b). The placeholder is functionally real but editorially neutral: a working
    package whose description states the namespace is reserved for future development. No
    positioning or marketing copy ships in the placeholder itself -- Decision 101(c)'s
    marketing/** carve-out is the sanctioned home for that content, never this placeholder. This
    accepts slightly higher crates.io reclaim exposure than a fully-fleshed package would carry,
    as a deliberate trade.
  installability_rationale: >-
    Decision 184 -- On The Loop's core is cut from this repository and must be installable, an
    affirmative reason to own a distribution namespace regardless of external
    branding decisions. `theseus`, the pre-Decision-198 candidate, is already taken on all three
    registries (see registry_measurements), which is NOT contested or acquired here: it sharpens
    the same rationale, since On The Loop can never ship under `theseus` on any registry.
    `ontheloop` (Decision 198) is the mark this contract actually reserves. guerdon
    (trading brand) and semanto (presentation-layer-only) are out of frame by their own
    Decision-101 definitions.

identity:
  security_contact: >-
    The published contact is the role alias security@otl-labs.com, a public business address,
    never a personal mailbox (Decision 101(d) -- no personal identity in any committed file). The
    otl-labs.com domain derives from the GitHub org handle Decision 198 clause 3 settles as
    `otl-labs`. account_owner_address and crates_io_ownership below carry their own,
    separate npm/crates.io identity choices.
  account_owner_address: >-
    Recommended that the ACCOUNT-OWNER address be a distinct alias from the published security
    contact -- recovery mail wants a narrow unpublished inbox, a security contact wants the
    opposite. The operator's final choice is recorded at execution (rec-3941), not here.
  crates_io_ownership: >-
    crates.io has no separate account email -- it is GitHub OAuth only, so ownership inherits
    from the GitHub identity. The GitHub org handle is settled as `otl-labs` (Decision 198 clause
    3); claim under the personal account now and add an `otl-labs` GitHub Team as an additional
    owner once that team exists -- this work is not blocked on rec-3905, which tracks the
    remaining npm/crates.io org-identity work.
  probe_user_agent: >-
    scripts/package_registry_probe.py's crates.io User-Agent contact string is sourced from
    configuration with a neutral default, never a hardcoded personal address (crates.io's crawler
    policy requires a descriptive User-Agent naming a contact).

registry_measurements:
  - date: "2026-09-20"
    source: planning-session observation (context)
    ontheloop: "unclaimed (404) on PyPI, npm, crates.io"
    theseus: "taken (200) on PyPI, npm, crates.io"
    npm_at_ontheloop_scope: "unverified -- npm org endpoints returned 403/401 unauthenticated"
  - date: "2026-09-21"
    source: CC-web live re-measurement, this implementation session
    ontheloop: "unclaimed (404) on PyPI, npm, crates.io"
    theseus: "taken (200) on PyPI, npm, crates.io -- not contested, not acquired"
    npm_at_ontheloop_scope: >-
      still unverified -- an unauthenticated registry.npmjs.org package-level lookup under the
      scope returns 404 regardless of whether the scope itself is claimed, so it is uninformative;
      org/scope status is confirmed by the operator at signup (procedure.npm step 2)

pypi_trusted_publisher:
  repository: benjamin-blake/theseus
  workflow_filename: publish-ontheloop.yml
  environment: pypi
  restage_obligation: >-
    If the workflow is renamed or its environment changed, re-register the PyPI Trusted
    Publisher (pending or live) with the new filename/environment BEFORE the next dispatch --
    PyPI's OIDC exchange matches on the exact repository/workflow-filename/environment triple and
    silently rejects a stale registration (Decision 163/172).

procedure:
  pypi:
    - step: 1
      tag: HUMAN
      action: >-
        Create or use the company PyPI account (browser signup, email verification, 2FA
        enrolment -- credentials no agent holds).
    - step: 2
      tag: HUMAN
      action: >-
        Register a PENDING Trusted Publisher for project `ontheloop` on pypi.org (Your projects
        -> Publishing), naming this repository, the publish-ontheloop.yml workflow filename and
        the `pypi` GitHub Environment (see pypi_trusted_publisher above). A pending publisher
        does NOT reserve the name -- it is invalidated if another party registers the project
        first (PyPI docs, 2026-09-21), so this step must be followed promptly by step 5.
    - step: 3
      tag: AGENT-RUNNABLE
      action: "Confirm `ontheloop` is still unclaimed: bin/venv-python -m scripts.package_registry_probe ontheloop -- read the PyPI row."
    - step: 4
      tag: HUMAN
      action: >-
        Confirm the `pypi` GitHub Environment exists with a required-reviewer protection rule
        (non-destructive API read -- never probed by dispatching, since a missing Environment is
        auto-created UNPROTECTED on first use).
    - step: 5
      tag: HUMAN
      action: >-
        Dispatch .github/workflows/publish-ontheloop.yml (workflow_dispatch), approve the `pypi`
        Environment's required-reviewer gate, and let the job build and publish the placeholder
        distribution via PyPI Trusted Publishing (OIDC) -- no long-lived token is created or
        stored.
    - step: 6
      tag: AGENT-RUNNABLE
      action: "Confirm the claim landed: bin/venv-python -m scripts.package_registry_probe --require-claimed ontheloop (rec-3941's acceptance probe)."
  npm:
    - step: 1
      tag: HUMAN
      action: >-
        Create or use the company npm account (browser signup, email verification, 2FA
        enrolment).
    - step: 2
      tag: HUMAN
      action: >-
        Confirm availability of the bare `ontheloop` name and the `@onthelooplabs` organization
        scope by signing in and checking npm's own org creation flow -- both returned 403/401
        unauthenticated from CC-web (registry_measurements), so this cannot be confirmed ahead of
        time by the probe.
    - step: 3
      tag: HUMAN
      action: >-
        Publish a minimal neutral-placeholder package under the bare `ontheloop` name, then
        create the `@onthelooplabs` organization/scope (npm's sanctioned namespace mechanism) and
        publish under it (publishConfig.access: public is already declared in
        packages/ontheloop-js-scoped/package.json, since a scoped package's first publish
        otherwise defaults to restricted).
    - step: 4
      tag: AGENT-RUNNABLE
      action: "Confirm the claim landed: bin/venv-python -m scripts.package_registry_probe --require-claimed ontheloop -- read the npm row."
  crates_io:
    - step: 1
      tag: HUMAN
      action: "Sign in to crates.io with the GitHub account that will own it (personal account now; see identity.crates_io_ownership)."
    - step: 2
      tag: AGENT-RUNNABLE
      action: "Confirm `ontheloop` is still unclaimed: bin/venv-python -m scripts.package_registry_probe ontheloop -- read the crates.io row."
    - step: 3
      tag: HUMAN
      action: >-
        Generate a scoped API token (publish-new scope, crate pattern `ontheloop`, short-lived
        expiry), then `cargo publish` a minimal neutral-placeholder crate with a correct licence
        and description -- publication is IMMUTABLE (yank, never delete), so the first version
        must be right. Revoke the token immediately after publishing.
    - step: 4
      tag: HUMAN
      action: >-
        Once the org handle at rec-3905 settles, add a GitHub Team as an additional owner
        (`cargo owner --add github:<org>:<team>`) alongside the personal account.
    - step: 5
      tag: AGENT-RUNNABLE
      action: "Confirm the claim landed: bin/venv-python -m scripts.package_registry_probe --require-claimed ontheloop -- read the crates.io row."

tracking:
  recommendation: rec-3941
  note: >-
    rec-3941 holds the execution half (operator-only) and stays OPEN until the names are
    actually claimed -- this contract landing does not close it. Sibling: rec-3905 (npm/crates.io
    org-identity handle), independently open and not blocking this work.
