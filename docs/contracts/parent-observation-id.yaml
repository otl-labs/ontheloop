---
# Class C cross-system invariant: the telemetry observation TREE pointer (self-reference).
# Ratified under the CD.25 pre-codegen contract ratification ritual (tier_item T0.12.6).
# Re-grounded to the write-boundary derivation model at contract_version 2 (Decision 199).
#
# Telemetry Class A contracts $ref into contract.fields.parent_observation_id:
#   telemetry_observations.parent_observation_id -> parent_observation_id
contract:
  id: parent-observation-id
  class: C
  contract_version: 2
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 199)"
  description: >-
    Canonical cross-system tree pointer for telemetry observations. A nullable self-reference on
    telemetry_observations: a node's parent_observation_id is the observation_id of its enclosing node
    (a step's parent phase; a model_call's parent step), building the in-session trace tree
    (Decision 95 root-unification rule). NULL marks a top-level (root) observation directly under the
    session. Crockford-base32 ULID, derived at the write boundary per telemetry-event-envelope.yaml's
    identity spec, using the parent's OWN domain tag over the parent_observation_ref the caller supplies.
fields:
  parent_observation_id:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      ULID string referencing the observation_id of this observation's parent node, or NULL for a
      root-level observation rooted directly at the session. Together with session_id (root) and
      observation_id (self), it forms the connected per-run trace tree.
    semantics: >-
      A REFERENCE to an observation_id (parent-observation-id.yaml and observation-id.yaml are distinct
      Class C contracts, NOT a chained $ref -- Invariant 5 leaf rule). DERIVED at the write boundary
      from the caller-supplied parent_observation_ref, using domain tag
      'telemetry_observations:observation_id' (the PARENT's own domain tag, per
      telemetry-event-envelope.yaml's FK rule) -- the same computation the parent row performs for its
      own observation_id, so the two values are equal with no propagation step (replaces Decision 97's
      retired boundary-injection / never-re-mints rule). Genuinely nullable in EVERY table that carries
      it (null = root observation), so it is not tightened to not-null anywhere -- the loosest baseline
      is also the per-table value.
    populated_by: >-
      the write boundary (rec-4024's append_events verb), derived from the caller-supplied
      parent_observation_ref. No current populator.
    write_time_validation: >-
      Structural only: ULID format and value are generator-guaranteed. The write boundary NEVER checks
      that a non-null parent_observation_id references an existing telemetry_observations.observation_id
      in the same session -- Decision 199 tolerates concurrent and out-of-order producers by
      construction, so a child may land before its parent. Referential integrity is instead a DQ
      relationships check (a non-null parent_observation_id with no matching observation_id in the same
      session) run as a non-gating scheduled monitor over QUIESCENT trees only, so an in-flight child is
      never flagged as a violation; the monitor is the reader's telemetry_orphan_counts verb, alarmed daily by
      the telemetry-verification workflow (rec-4101), with the reader registry's IDLE_THRESHOLD_SECONDS as its
      quiescence window; it matches a parent within the tree, so a parent in another session of the same tree is
      a residual owned by rec-4439. Readers tolerate a dangling parent whether transient (still in-flight) or permanent (e.g.
      a producer crash, or an R7 deferral that never lands) -- never a read error.
    dq_intent: {}
    governance_notes: >-
      This field carries no not_null rule by DESIGN, not as a loosest-baseline placeholder: a root observation
      legitimately has no parent, so enforcing not-null would be incorrect in every consuming table.
      Referential integrity for a non-null parent is likewise never a write-time check (Decision 199
      tolerates out-of-order producers by construction); the appropriate future enforcement is a
      relationships/self-FK DQ check (parent_observation_id present -> exists as an observation_id) run
      as a non-gating scheduled monitor over quiescent trees, NOT not_null. That monitor is the reader's
      telemetry_orphan_counts verb over quiescent trees, alarmed daily by the telemetry-verification workflow
      (rec-4101, closed by PLAN-telemetry-verification-monitor), with the reader registry's IDLE_THRESHOLD_SECONDS
      as its quiescence window, because relationships checks SKIP on the DuckLake backend
      (scripts/data_quality_execute.py); it checks parent existence within the tree, and the same-session case is
      a residual owned by rec-4439. Population is future-state (rec-4024); ratified now (NOT
      provisional_v0) per the Class C foundational-invariant rule.
    amendment_log:
      - date: "2026-10-18"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-telemetry-verification-monitor: the notes that named rec-4101 as the monitor's owner now name the monitor
          (the reader's telemetry_orphan_counts verb, alarmed daily by the telemetry-verification workflow) and its
          same-session residual, owned by rec-4439. Pointer and provenance only; what the field means is unchanged.
      - date: "2026-09-26"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          rec-4058 (contract-risk review of slice 1, PLAN-telemetry-contract-risk-amendments): removed
          the write-time parent-existence check. Decision 199 tolerates concurrent and out-of-order
          producers by construction, so a child may land before its parent; write_time_validation now
          states positively that the write boundary never checks parent existence. Referential integrity
          moves to a DQ relationships check over QUIESCENT trees only (an in-flight child is not a
          violation), owned by follow-on rec-4101 (also owner of the quiescence window). Readers tolerate
          a dangling parent, transient or permanent. semantic_break=true: the ENFORCEMENT mechanism
          changed, not merely the prose.
        migration_story: >-
          No populator or table exists yet (population is future-state, rec-4024), so no runtime
          migration is required.
      - date: "2026-09-24"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199): replaced boundary-injection /
          never-re-mints propagation with write-boundary derivation from a caller-supplied
          parent_observation_ref, using the parent's own domain tag. semantic_break=true: the
          derivation MECHANISM changed, not merely the prose.
        migration_story: >-
          No live populator existed under either scheme (population is future-state in both), so no
          runtime migration is required; rec-4024 builds directly to this contract_version 2 spec.
joins_using_this_key:
  - parent_observation_id_join_observations_self_tree
governance_notes: >-
  Single-hop leaf invariant (Invariant 5). This key holds a value drawn from the observation_id
  keyspace (observation-id.yaml) but is defined as its OWN Class C contract because it carries distinct
  semantics (nullable tree pointer vs required node identity) and its own join; it does NOT $ref
  observation-id.yaml (chained Class-C refs are forbidden). The self-join is recorded in
  docs/contracts/_joins.yaml. The normative derivation formula lives ONCE in
  telemetry-event-envelope.yaml; this contract states its own domain tag and defers to that spec.
amendment_log:
  - date: "2026-09-24"
    semantic_break: true
    change_class: governance_note_add
    summary: >-
      PLAN-telemetry-event-journal-contracts (Decision 199): contract-level description re-grounded
      to the write-boundary derivation model. Accompanies the field-level amendment_log entry above
      (CD.25 category-6 gate). semantic_break=true, mirroring the field-level entry.
    migration_story: Prose-only at the contract-description level; no runtime behaviour changes.
  - date: "2026-10-15"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-rule-declarations-and-writer-conformance (rec-4158, Decision 210): the dq_intent `enforced` key is retired
      from every rule leg. not_null is declared by presence (`true`, or `{exclude_before: D}`); an optional column or a
      loosest-baseline field carries no not_null leg; the other legs lose the key. A declared rule is an enforced rule.
    migration_story: >-
      Declarations re-spelled only. No rule is added, removed or re-dated: the declared rule set, read through
      scripts.contract_rules, is identical before and after, and the generated field_semantics.yaml projection of
      this contract is unchanged.
previous_versions:
  - contract_version: 1
    ratified_at: "2026-06-24"
    ratified_via: "Step 10 multi-perspective critique + PLAN-ratify-class-a-telemetry-contracts merge to main (T0.12.6)"
    superseded_on: "2026-09-24"
    summary: >-
      Boundary-injected, never-re-minted parent_observation_id propagated from the parent as an FK
      (Decision 97 cl.3, original). Superseded by write-boundary derivation using the parent's own
      domain tag over a caller-supplied parent_observation_ref (Decision 199).
