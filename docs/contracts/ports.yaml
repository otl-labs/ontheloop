      - {id: codex_cli, tier: experimental, status: pending, owning_item: "T4.27:c14"}
    oracle: null
    oracle_gap: >-
      Backends are held to outcome parity, never trajectory parity (Decision 206 clause 4), so no
      backend is an oracle for another: the gating suite is T4.27 c7's anti-drift gate and parity
      evidence is read from Decision 199 events (T4.27 c12). Backend vocabulary home:
      docs/contracts/inference-provider.yaml.
