semantics:
  adapter_tiers: >-
    supported -- this platform's maintainers run it and its port's suite gates it; community --
    contributed and suite-tested, not maintainer-run; experimental -- registered for discovery,
    no support promise (Terraform provider labelling, Decision 212 clause 7).
  adapter_status: >-
    implemented -- a code location realises this adapter today (`location` names an existing repo
    path); verb conformance is UNPROVEN until the port's conformance_suite is present. pending --
    not built yet; `owning_item` names the tier item, criterion, rec or decision that owns it.
  verbs_status: >-
    settled -- the port's required_verbs are named by a ratified Decision (run_persona: Decision
    206 clause 7). provisional -- drafted from today's code or a criterion and amendable without
    re-deciding Decision 212 when the port's suite lands (the catalog, table_data and
    content_blobs verbs are provisional until T4.23's suites exist; DuckDB and the object store
    realise them today, so the suite tests this platform's adapter seam, not the upstream engine).
    work_item_storage's verbs (file_rec and update_rec, renamed with the work-item model by
    Decision 197 clause 7) stay provisional until a ratified Decision names the renamed verbs;
    the rename arrives here first as a provisional amendment, and no suite landing settles them.
  oracle: >-
    The credential-free reference every adapter of the port must match under its gating suite
    (Decision 212 clause 2). kind adapter -- `ref` names one of the port's adapters and `status`
    mirrors it (present iff that adapter is implemented); kind harness -- `ref` names the owning
    item of an emulator harness that is the standing oracle (orchestration_host: T4.20's moto
    harness, Decision 185 clause 1). status pending means NO oracle exists today.
  oracle_gap: >-
    Required exactly when `oracle` is null, never beside one: why the port has no credential-free
    oracle and what governs its conformance instead.
  conformance_suite: >-
    status present -- `path` is an existing test file or directory; status pending --
    `owning_item` names the item that writes the suite. One gating suite per port, never per
    bundle; optional credentialed live drift runs alarm and never gate (Decision 212 clause 2b).
  owning_item: >-
    A roadmap tier item id, optionally narrowed to one criterion as <item>:<criterion> (both must
    exist in docs/ROADMAP-PLATFORM.yaml); a rec-NNNN id (format only -- the cache is not
    consulted); or a dec-NNN id naming a header in docs/DECISIONS.md.
  coupling_findings: >-
    One row per cross-port coupling (Decision 212 clause 3): an adapter of one port assuming
    another port's adapter. status open -- a defect awaiting its owner; accepted -- held by a
    ratified Decision the owning_item names, removable only by re-deciding it; resolved -- the
    coupling no longer exists (keep the row; rows are never deleted). More than ten open rows
    fires Decision 212's coupling-findings-exceed-ten condition (predicate
    ports_open_coupling_findings_exceed, scripts/preflight/decision_conditions.py).
  structural_assumptions: >-
    One row per assumption the loop makes about the structure of the repository it runs on
    (paths, layout, house style, cloud identity), recorded as T2-T4 work meets it (Decision 211
    clause 2; T4.24 c9). status open -- not yet generalised; resolved -- otl init generalises or
    configures it; accepted -- kept as a stated adoption requirement.
  ambient_trigger: >-
    The Layer-1 instruction file that tells agents to record rows here; the check asserts it
    names this contract.

ambient_trigger: AGENTS.md

