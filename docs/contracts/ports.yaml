semantics:
  adapter_tiers: >-
    supported -- the upstream repository's maintainers run it and its port's suite gates it; community --
    contributed and suite-tested, not maintainer-run; experimental -- registered for discovery,
    no support promise (Terraform provider labelling, Decision 212 clause 7).
  adapter_status: >-
    implemented -- a code location realises this adapter today (`location` names an existing repo
    path); verb conformance is UNPROVEN until the port's conformance_suite is present. pending --
    not built yet; `owning_item` names the tier item, criterion, rec or decision that owns it.
  verbs_status: >-
    settled -- the port's required_verbs are named by a ratified Decision (run_persona: Decision 206 clause 7).
    provisional -- drafted from today's code or a criterion and amendable without re-deciding Decision 212 when the
    port's suite lands (the catalog, table_data and content_blobs verbs are provisional until T4.23's suites exist;
    DuckDB and the object store realise them today, so the suite tests On The Loop's adapter seam, not the upstream
    engine). work_item_storage's verbs (file_rec and update_rec, renamed with the work-item model by Decision 197 clause
    7) stay provisional until a ratified Decision names the renamed verbs; the rename arrives here first as a
    provisional amendment, and no suite landing settles them.
  oracle: >-
    The credential-free reference every adapter of the port must match under its gating suite
    (Decision 212 clause 2). kind adapter -- `ref` names one of the port's adapters and `status`
    mirrors it (present iff that adapter is implemented); kind harness -- `ref` names the owning
    item of an emulator harness that is the standing oracle (orchestration_host: T4.20's moto
    harness, Decision 185 clause 1). status pending means NO oracle exists today.
  oracle_gap: >-
    Required exactly when `oracle` is null, never beside one: why the port has no credential-free
    oracle and what governs its conformance instead.
  conformance_suite: >-
    status present -- `path` is an existing test file or directory; status pending --
    `owning_item` names the item that writes the suite. One gating suite per port, never per
    bundle; optional credentialed live drift runs alarm and never gate (Decision 212 clause 2b).
  owning_item: >-
    A roadmap tier item id, optionally narrowed to one criterion as <item>:<criterion> (both must
    exist in docs/ROADMAP-PLATFORM.yaml); a rec-NNNN id (format only -- the cache is not
    consulted); or a dec-NNN id naming a header in docs/DECISIONS.md.
  coupling_findings: >-
    One row per cross-port coupling (Decision 212 clause 3): an adapter of one port assuming another port's adapter. status open -- a defect awaiting its owner; accepted -- held by a ratified Decision the owning_item names, removable only by re-deciding it; resolved -- the coupling no longer exists (keep the row; rows are never deleted). More than ten open rows fires Decision 212's coupling-findings-exceed-ten condition (predicate ports_open_coupling_findings_exceed, scripts/preflight/decision_conditions.py).
  structural_assumptions: >-
    One row per assumption the loop makes about the structure of the repository it runs on (paths, layout, house style, cloud identity), recorded as T2-T4 work meets it (Decision 211 clause 2; T4.24 c9). status open -- not yet generalised; resolved -- otl init generalises or configures it; accepted -- kept as a stated adoption requirement.
  ambient_trigger: >-
    The Layer-1 instruction file that tells agents to record rows here; the check asserts it
    names this contract.

ambient_trigger: AGENTS.md

ports:
  - id: run_persona
    required_verbs: [run_persona]
    verbs_status: settled
    adapters:
      - {id: litellm, tier: supported, status: pending, owning_item: T4.2}
      - {id: claude_cli, tier: supported, status: pending, owning_item: T4.27}
      - {id: codex_cli, tier: experimental, status: pending, owning_item: "T4.27:c14"}
    oracle: null
    oracle_gap: >-
      Backends are held to outcome parity, never trajectory parity (Decision 206 clause 4), so no
      backend is an oracle for another: the gating suite is T4.27 c7's anti-drift gate and parity
      evidence is read from Decision 199 events (T4.27 c12). Backend vocabulary home:
      docs/contracts/inference-provider.yaml.
    conformance_suite: {status: pending, owning_item: "T4.27:c7"}
  - id: persona_compute_host
    required_verbs: [run_image]
    verbs_status: provisional
    adapters:
      - {id: local_container, tier: supported, status: implemented, location: src/persona_hosts/local_container/}
      - {id: github_actions_shell, tier: supported, status: pending, owning_item: "T4.2:c8"}
      - {id: fargate, tier: experimental, status: pending, owning_item: "T4.15:c12"}  # implement_agent on Fargate (Decision 229 clause 3); presumptive until T4.15's first live run / CD.27 (Decision 205 clause 6)
      - {id: sandbox_runtime, tier: supported, status: pending, owning_item: "T4.34:c1"}  # per-run git clone under sandbox-runtime (srt) around the whole persona process: macOS Seatbelt, Linux and WSL2 bubblewrap (Decision 234 cl.1); run_image generalises to a pinned runtime reference here (cl.2)
      - {id: sandbox_runtime_windows, tier: experimental, status: pending, owning_item: "T4.34:c1"}  # srt's Windows alpha (dedicated local user, write-restricted token, WFP filters); its confinement legs alarm-not-gate while experimental (Decision 234 cl.1-2)
    oracle: {kind: adapter, ref: local_container, status: present}
    conformance_suite: {status: present, path: tests/persona_hosts/conformance_suite.py}
  - id: ops_verbs
    required_verbs: [current_state, latest_snapshot, named, describe, write]
    verbs_status: provisional
    adapters:
      - {id: in_process, tier: supported, status: pending, owning_item: T4.23}
      - {id: function_url, tier: supported, status: implemented, location: src/common/ducklake_reader_client.py}
    oracle: {kind: adapter, ref: in_process, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.23:c4"}
  - id: work_item_storage
    required_verbs: [file_rec, update_rec, pick_work_item]
    verbs_status: provisional
    adapters:
      - {id: ducklake_local, tier: supported, status: pending, owning_item: "T4.23:c5"}  # DuckLake over the local catalog and table_data adapters
      - {id: ducklake, tier: supported, status: implemented, location: scripts/ops_data_portal.py}
    oracle: {kind: adapter, ref: ducklake_local, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.23:c16"}
  - id: catalog
    required_verbs: [attach_catalog, read_snapshot, commit_snapshot]
    verbs_status: provisional
    adapters:
      - {id: local_file, tier: supported, status: pending, owning_item: "T4.23:c2"}
      - {id: neon_postgres, tier: supported, status: implemented, location: src/common/ducklake_runtime.py}
    oracle: {kind: adapter, ref: local_file, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.23:c16"}
  - id: table_data
    required_verbs: [write_data_file, read_data_file, list_data_files, delete_data_file]
    verbs_status: provisional
    adapters:
      - {id: local_directory, tier: supported, status: pending, owning_item: "T4.23:c2"}
      - {id: s3, tier: supported, status: implemented, location: src/common/ducklake_runtime.py}
    oracle: {kind: adapter, ref: local_directory, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.23:c16"}
  - id: content_blobs
    required_verbs: [grant_put, verify, get_blob]
    verbs_status: provisional
    adapters:
      - {id: local_directory, tier: supported, status: pending, owning_item: "T4.23:c7"}
      - {id: s3, tier: supported, status: implemented, location: src/common/ducklake_telemetry_blobstore.py}
    oracle: {kind: adapter, ref: local_directory, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.23:c16"}
  - id: orchestration_host
    required_verbs: [start_execution, send_task_success, send_task_failure, send_task_heartbeat]
    verbs_status: provisional
    adapters:
      - {id: local_interpreter, tier: supported, status: pending, owning_item: T4.22}
      - {id: step_functions, tier: supported, status: pending, owning_item: T4.1}
    oracle: {kind: harness, ref: T4.20, status: pending}
    conformance_suite: {status: pending, owning_item: T4.20}
  - id: verdict_plane
    required_verbs: [post_check_run, read_check_runs]
    verbs_status: provisional
    adapters:
      - {id: github_actions, tier: supported, status: implemented, location: .github/workflows/ci.yml}
      - {id: verdict_app, tier: supported, status: pending, owning_item: "T4.2:c9"}
    oracle: null
    oracle_gap: >-
      Decision 184 clause 3 keeps GitHub Actions the verdict plane in all modes (CD.38), and
      Decision 205 clause 2's non-Actions host still posts its verdict as a check run under a
      dedicated verdict App -- both adapters report through the GitHub Checks API, so no
      credential-free local verdict adapter exists to act as oracle. Exempt from Decision 184
      clause 2's local-adapter item while those clauses stand (Decision 212 clause 6); coupling
      row PC-02. Conformance is governed instead by T4.24 c14's suite, run against recorded,
      credential-free Checks-API fixtures (check-run payloads replayed with no token).
    conformance_suite: {status: pending, owning_item: "T4.24:c14"}
  - id: change_surface
    required_verbs: [open_change, read_verdict, post_review_comment, merge]
    verbs_status: provisional
    adapters:
      - {id: github, tier: supported, status: pending, owning_item: T4.1}
    oracle: null
    oracle_gap: >-
      A bare-git local change surface needs a verdict surface other than the Checks API (Decision
      212 clause 5), which first requires re-deciding Decision 184 clause 3 and Decision 205
      clause 2; exempt from the local-adapter item meanwhile (Decision 212 clause 6). Conformance
      is governed instead by T4.24 c14's suite, run against recorded, credential-free GitHub API
      fixtures for the change-surface verbs (T4.19 c6 names them).
    conformance_suite: {status: pending, owning_item: "T4.24:c14"}
  - id: secrets
    required_verbs: [get_secret]
    verbs_status: provisional
    adapters:
      - {id: environment, tier: supported, status: pending, owning_item: "T4.24:c2"}
      - {id: aws_ssm_parameter_store, tier: supported, status: implemented, location: src/common/ducklake_runtime.py}
    oracle: {kind: adapter, ref: environment, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.24:c14"}
  - id: scheduling
    required_verbs: [register_schedule, remove_schedule]
    verbs_status: provisional
    adapters:
      - {id: local_cron, tier: supported, status: pending, owning_item: "T4.24:c4"}
      - {id: eventbridge, tier: supported, status: implemented, location: terraform/personal/ducklake_maintenance.tf}
    oracle: {kind: adapter, ref: local_cron, status: pending}
    conformance_suite: {status: pending, owning_item: "T4.24:c14"}

coupling_findings:
  - id: PC-01
    ports: [ops_verbs, persona_compute_host]
    location: scripts/ops_portal/writer_transport.py
    description: >-
      The function_url ops_verbs adapter authenticates every call by SigV4 against an AWS_IAM Function URL or, where
      OTL_OPS_VERBS_TRANSPORT=execute_api selects it (agent environments, whose proxy cannot sign the Function URL
      hosts), against its named route on the AWS_IAM REST API in front of it (terraform/bootstrap/agent_ducklake_api.tf),
      each signed for its own service and region (src/common/ducklake_reader_client.py,
      scripts/ops_portal/writer_transport.py), so its caller must run on a compute host holding an AWS identity. Held by
      Decision 84 I-1's closed reader/writer boundary as plan A amends it; Decision 200 clauses 1-2's tenancy
      enforcement (tenant_id from the caller's authenticated identity) is a property of the function_url adapter of
      ops_verbs, enforced at the telemetry writer's edge (src/lambdas/ducklake_telemetry_writer/handler.py builds the
      caller principal from the signed identity of whichever path delivered the call, Decision 213). CallerPrincipal is
      the internal type that edge hands the shared registration code; the in_process adapter supplies kind configured
      (Decision 184 cl.2, Decision 212 cl.3), so no port row is added (Decision 212 cl.6). The registration verbs are
      not in ops_verbs' provisional required_verbs today; whether they join the port is owed with T4.23:c4's
      in_process oracle. scripts/telemetry_capture/transport.py is a further function_url client of the telemetry writer
      (status-returning), verify.py of the telemetry reader's verification verbs (and through scripts.rec_episode the ops
      portal), capture_warning.py is a further function_url client of the ops reader and portal, the same module family's
      scripts/telemetry_capture/read_route.py of the telemetry reader (event-verb reads route by
      /agent-platform/ducklake/telemetry_catalog to the telemetry reader's own Function URL only, Decision 236 cl.2; its
      content route, Decision 239, has no API route), and scripts/telemetry_capture/ci_pass.py (through transport.py,
      under a CI role) of the telemetry writer, so no port row is added; scripts/telemetry_verify/compare.py takes its
      compared columns and roles from config/lambda/ducklake/field_semantics.yaml, presuming that projection equals the
      deployed reader's (the coupling PC-07 records for the portal). In agent environments the egress proxy refuses a signed
      body over 1 MiB without X-Amz-Content-Sha256 (502), so transport.py and writer_transport.py send that header. scripts/run_persona.py starts scripts/agent_sdk/mcp_server.py, a further function_url client of the ops and telemetry readers, for a litellm run whose contract names warehouse_read, and hands it the AWS_, DUCKLAKE_ and OTL_ variables and the proxy and CA-bundle variables, so such a run needs a host holding an AWS identity with a reader grant (Decision 263 clause 2 gives the persona-verdict role none today); no port row is added.
    status: accepted
    owning_item: dec-084
  - id: PC-02
    ports: [verdict_plane, change_surface]
    location: dec-184
    description: >-
      Decision 184 clause 3 fixes GitHub Actions as the verdict plane in all modes and Decision 205 clause 2 makes the verdict a check run read from the Checks API on any host, which presumes GitHub as the change surface; no non-GitHub change surface can carry a verdict.
    status: accepted
    owning_item: dec-184
  - id: PC-03
    ports: [persona_compute_host, change_surface]
    location: dec-205
    description: >-
      The github_actions_shell persona_compute_host adapter exists only because a GitHub-originated
      repository event triggers a verdict persona on Actions (Decision 205 clause 1), so it presumes
      change_surface's github adapter; no non-GitHub change surface can drive it.
    status: accepted
    owning_item: dec-205
  - id: PC-04
    ports: [work_item_storage, ops_verbs]
    location: scripts/ops_data_portal.py
    description: >-
      The implemented ducklake work_item_storage adapter (scripts/ops_data_portal.py) reads and
      writes work items only through the function_url ops_verbs adapter, so DuckLake-on-Neon
      work-item storage presumes the cloud ops_verbs transport. Held by Decision 84's Single
      Portal Invariant: every rec write transits the closed ducklake_writer boundary and every
      read the ducklake_reader's named verbs.
    status: accepted
    owning_item: dec-084
  - id: PC-05
    ports: [content_blobs, ops_verbs]
    location: src/telemetry_client/blob_delivery.py
    description: >-
      The claim-check grant protocol is realised for the s3 adapter only: the producer helper
      (src/telemetry_client/blob_delivery.py) consumes presigned_put grants alone and presumes the s3 adapter behind the
      function_url begin_blobs verb. Until the local_directory adapter adds its own grant kind, the free-tier local plane
      cannot store a payload above 64 KiB.
    status: open
    owning_item: "T4.23:c7"
  - id: PC-06
    ports: [content_blobs, ops_verbs]
    location: src/common/ducklake_event_content.py
    description: >-
      transcript_content is registered in EVENT_READS but served by no deployed function: no transcript content is served
      from production (Decision 236 cl.3), and rec-4696 deploys the masked content reader (Decision 239), whose masked.py
      consumes the same content_blobs s3 adapter through ducklake_event_content.BLOB_STORE, so the coupling covers the
      content reader too (Decision 212). Its code builds the s3 adapter directly from
      TELEMETRY_BLOB_ROOT, so the free-tier local plane cannot serve an object row's bytes until the local_directory adapter
      and an adapter selection exist. The s3 adapter's get_blob is implemented; the verbs stay provisional until T4.23:c16.
    status: open
    owning_item: "T4.23:c7"
  - id: PC-07
    ports: [work_item_storage, ops_verbs]
    location: scripts/ops_portal/write_validators.py
    description: >-
      The portal's pre-check (gate_write) imports the DuckLake writer's pure gate modules and reads the repository's
      field_semantics.yaml, so it presumes the repository projection equals the deployed one. Between a contract merge
      and its deploy the two differ in either direction: a narrowing makes the pre-check stricter (it refuses early what
      the deployed writer still accepts, which Decision 210 cl.4 intends), and an added accepted value or other widening
      makes it looser (the deployed writer still refuses, authoritatively, so no invalid row is written; the caller sees
      the writer's 422).
    status: accepted
    owning_item: dec-210
  - id: PC-08
    ports: [persona_compute_host, orchestration_host]
    location: dec-229
    description: >-
      The fargate persona_compute_host adapter's run_image assumes a launcher holding an AWS identity with ecs:RunTask
      and iam:PassRole on the executor task role. With no orchestration_host adapter present, the interim coordinator
      (an interactive CC-web session or the /overseer, Decision 229 clause 1) supplies it as the operator's PlatformDev,
      launcher only. That coordinator is not an orchestration_host adapter and executes no loop definition (Decision 185
      clause 1); the step_functions adapter later becomes the port's second caller under its own execution role (T4.1).
    status: accepted
    owning_item: dec-229
  - id: PC-09
    ports: [work_item_storage, orchestration_host, change_surface]
    location: docs/contracts/ops_recommendations.yaml
    description: >-
      The work-item record and the loop's identifiers name a GitHub pull request: the ducklake work_item_storage
      adapter's record carries execution_pr_url (docs/contracts/ops_recommendations.yaml); the persona and loop
      identifiers carry a pull-request number (T4.31 c2, T4.2's plan_agent tuple, T4.1's node identifiers, T4.9a c2, c7
      and c9, the correlation ids of T4.9 and CD.38, T4.16 c3); the plan projection keeps pr_number (T4.5 c4); and
      telemetry_sessions carries pr_url (docs/contracts/telemetry_sessions.yaml, named as a pointer only: that frozen
      contract is not edited here). T4.33 c6's Q&A receipts cite a pull request as a pointer, like pr_url.
      So work-item storage and the orchestration host presume change_surface's github
      adapter. Accepted while the repository bootstraps (Decision 234 clause 4): core surfaces specified after Decision
      234 reference a generic change id, never a pull request number (T4.19 c6 owns the rule for loop identifiers), and
      the work-item target model (T4.23 c6) is where that id lands; re-decided when fully local adopter work starts in
      earnest or demand forces local versioning (Decision 234's forge-or-local-versioning condition).
    status: accepted
    owning_item: dec-234
  - {id: PC-10, ports: [change_surface, verdict_plane], location: .claude/hooks/merge_gate.py, status: open, owning_item: "T4.2:c9", description: "The merge gate's persona leg (T4.32 c5) accepts a verdict persona's check only as a check run named persona-verdict/<persona> created on the exact head by the verdict GitHub App that gates.verdict_app.app_id names on origin/main (Decision 271), so the change_surface github adapter's merge seam presumes a GitHub App check identity on the verdict plane; a verdict plane off GitHub needs its own identity (T4.2 c9). The verdict jobs must post that check on every head of the persona's class (a pull request confined to docs/plans/ for decision_scout and plan_critic, every other pull request for code_reviewer), including a head a scout fingerprint covers (T4.32 c4)."}
  - {id: PC-11, ports: [scheduling, verdict_plane], location: dec-267, status: accepted, owning_item: dec-267, description: "The scheduling port's eventbridge adapter starts work through GitHub's workflow_dispatch API with a GitHub App token, so the scheduled workflow dispatcher (rec-4233) presumes verdict_plane's github_actions adapter runs the workflows its register (config/lambda/scheduled_workflow_dispatcher/schedules.yaml) names; a local_cron adapter or another verdict plane needs its own dispatch path. Accepted while those loops are GitHub Actions workflows; rec-5113 makes the register the scheduling port's declarative input."}
  - {id: PC-12, ports: [verdict_plane, persona_compute_host, secrets], location: .github/workflows/persona-verdict.yml, status: accepted, owning_item: dec-263, description: "Decision 263 clause 4: on the verdict_plane github_actions adapter the workflow shell (persona_compute_host's github_actions_shell adapter), not the persona process, reads the inference keys through the secrets port's aws_ssm_parameter_store adapter under the persona-verdict role and hands the values to the persona process, so run_persona's litellm adapter assumes no AWS identity (Decision 212 clause 3) and every compute host that runs a verdict persona must deliver its key the same way, or Decision 263 is re-decided. Accepted while Decision 263 holds."}

structural_assumptions:
  - id: SA-01
    assumption: >-
      The recs_related neighbourhood expansion assumes a src/scripts/tests Python layout (module names and the import
      graph), the tests/ mirror naming convention (test_<stem>.py) and first-parent squash-merge history on the
      default branch (change coupling and rename aliases), none of which an adopting repository is guaranteed to have.
    location: scripts/recs_related/
    status: open
    owning_item: "T4.24:c9"
  - id: SA-02
    assumption: >-
      The turn-capture runtime assumes Claude Code's hook stdin fields (session_id, transcript_path, hook_event_name,
      stop_hook_active) and output-channel semantics (an exit-0 stderr line is recorded as an invisible SessionStart
      attachment), its transcript layout (<transcript dir>/<session id>/ with subagents and tool-results, tolerating the
      foreign telemetry-capture/ state directory) and .claude/settings.json hook registration, the switch and pin hook's remote named origin with a default branch main, the
      remote_session_change attachment's url shape and the <task-notification> <status> token, an exit-0 Stop hook's stderr
      line recorded as a root hook_success attachment at every Stop, the API-error assistant record (isApiErrorMessage)
      written before StopFailure runs, UserPromptSubmit running before its prompt record is written with a payload prompt_id
      equal to that record's promptId (assumed; a mismatch only times the prompt wait out), every record of a root response
      being on disk before Stop hooks run (measured in 2.1.302: 224 of 224 root assistant records, 92 of 92 intermediate
      ones, carry a string stop_reason, so the usable-witness stop_reason test cannot detect a late root record; the order is
      what makes a response unable to straddle a usable witness) and the egress proxy stopping before SessionEnd hooks in
      cloud sessions, the Skill tool_use block shape ({name: Skill, input: {skill: <name>}}, written whether or not the skill is
      registered) and this repository's skill names behind WORKFLOW_SKILLS in src/turn_capture/sessions.py (orient, planning,
      implement, overseer, audit-prompt, plan-critique, decision-scout, code-review, executor-rca; an adopting repository with other
      skill names reads the fallback workflow values, never a wrong value, and an adopter-declared map is T4.24-era work), none of
      which an adopting repository on another agent runtime is guaranteed to have. It also assumes Claude Code may write a late-loaded
      plugin's SessionStart hook records after the first turn, records a stdout-printing hook run twice (a heldContent copy and a plain
      copy sharing toolUseID, hookEvent, hookName, command and durationMs), shares one toolUseID across all hooks of one event, and may
      write no SessionStart record at all on a resume with a queued prompt (envelope R7's declared exception). It also assumes a
      UserPromptSubmit hook's exit-0 stdout JSON reaches the agent's context through hookSpecificOutput.additionalContext and the
      user through systemMessage where the surface shows one, and that each transcript record carries the Claude Code release
      that wrote it in a version field (a capture warning names it and drops any value that is not d.d.d).
      It also assumes Claude Code records an exit-0 hook's stderr verbatim in its hook attachment, and that the attachment's
      command may be the registered line, the hook's statusMessage text or, from 2.1.317 in cloud sessions, a label ('command
      hook', 'command hook N', N not stable across surfaces), so capture identifies its own hook records by their stderr lines
      and reads the command only as a legacy form; and that a hook's block may survive only in the denied tool_result text. It also assumes a Skill call's input may carry args and a name with a leading / or this plugin's ontheloop: prefix (the name in .claude/.claude-plugin/plugin.json), and that Claude Code writes the loaded skill's text into the calling stream as one isMeta user record whose sourceToolUseID is the call's id, opening 'Base directory for this skill: <path>' and a blank line and, when args were given, ending with a blank line and 'ARGUMENTS: <args>'; PERSONA_SKILLS in src/turn_capture/persona_identity.py mirrors the verdict personas rows, and a test holds them equal.
    location: scripts/telemetry_capture/
    status: open
    owning_item: "T4.24:c9"
  - {id: SA-03, assumption: "The rec portal's glossary_lint rule reads docs/contracts/glossary.yaml at the repository root and enforces this repository's house style on rec text, which an adopting repository may lack or decline (Decision 211 clause 2), so a release must let the profile switch it off.", location: scripts/ops_portal/write_validators.py, status: open, owning_item: "T4.24:c9"}
  - id: SA-04
    assumption: >-
      The merge gate's GitHub adapter assumes a remote named origin with a branch main, GitHub's refs/pull/<N>/head namespace, the GitHub MCP merge tools' owner, repo, pullNumber, expectedHeadSha and merge_pull_request commit_message payload fields, and .claude/settings.json plus the rendered plugin hooks.json as its registration; for its required-checks leg (Decision 264) it also assumes GitHub's public REST endpoints at https://api.github.com for rules/branches/main and commits/<sha>/check-runs, read with no credential, a required_status_checks rule naming check contexts, check runs created by the app github-actions, and, for a file:// origin, JSON fixtures inside that bare repository in place of the API; the forge-neutral core takes refs, check names and conclusions only.
    location: .claude/hooks/merge_gate.py
    status: open
    owning_item: "T4.24:c9"
  - id: SA-05
    assumption: >-
      The approved-text approval's GitHub adapter assumes GitHub's repository-wide workflow-runs list, scanned to its
      1000 newest workflow_dispatch runs on main so an older approval reads MISSING and fails closed, the run-jobs and
      run-approvals APIs, the repository from scripts.repo_identity or --repo, can_admins_bypass false standing in for a
      reviewer read, a successful approve job as the decision's "successful run" (the run is still in progress while its
      wake job comments; the wake job reads the run's own approvals record and comments only when it names an approver
      for approved-text), the run-name grammar, a remote named origin with a branch main, and the path of
      approved-text-approval.yml.
    location: scripts/roadmap/approved_text_github.py
    status: open
    owning_item: "T4.24:c9"
  - id: SA-06
    assumption: >-
      The claude -p capture adapter assumes the Claude Code CLI's --session-id flag (a persisted session under the given id) and the
      <projects dir>/<cwd slug>/<session id>.jsonl layout, the wrapper manifest line shape (scripts/ci/claude_p_retry.sh), and the
      GitHub Actions run facts (workflow ref, run id and attempt, job id, event name, triggering sha). GITHUB_* is read only in
      .github/actions/telemetry-ci-capture/capture.sh (Decision 212); ci-pass takes every host fact as an argument, so another host
      (ecs, lambda, local) supplies the same arguments. It also writes a foreign file, host-run.json, into the CLI's own session
      directory, which a CLI layout change could collide with.
    location: scripts/telemetry_capture/ci_pass.py
    status: open
    owning_item: "T4.24:c9"
  - id: SA-07
    assumption: >-
      The arrival check assumes squash-merge first-parent history on main whose subject ends with a (#N) pull request number, the
      harness's Claude-Session trailer whose URL's last segment is the harness session key, GitHub's pulls/{n} created_at,
      GitHub's pulls/{n}/commits author dates (at most 250 commits listed, and an author date a rebase keeps), and the literal
      default repository slug otl-labs/ontheloop when GITHUB_REPOSITORY is unset.
    location: scripts/telemetry_verify/session_presence.py
    status: open
    owning_item: "T4.24:c9"
  - id: SA-08
    assumption: >-
      The protected-action gate assumes Claude Code's transcript record fields (promptId, sourceToolUseID, turnCompanion,
      isMeta, isCompactSummary, isSidechain, origin.kind), the claude.ai project wake grammar (wake, message from and trust
      attributes, relay, coordinator-relay and cited elements, the 'Chose "' card-tap prefix), the PreToolUse hook input
      fields (transcript_path, cwd, tool_name, tool_input, tool_use_id, and agent_id only from a subagent), hook feedback
      never arriving as a string user record (PreToolUse exit-2 stderr returns as a tool_result block; Stop-hook stderr is a
      root attachment record, SA-02), a remote named origin with a branch main, and .claude/settings.json plus the rendered
      plugin hooks.json as its registration.
    location: .claude/hooks/protected_action_gate.py
    status: open
    owning_item: "T4.24:c9"
  - id: SA-09
    assumption: >-
      The reviewer-gate preflight assumes GitHub's run-approvals API body (a list of entries with state, environments[].name
      and user.login, recorded per run rather than per attempt), the environments API body (protection_rules entries of type
      required_reviewers with a reviewers list, and a top-level can_admins_bypass), GITHUB_TOKEN reading both under actions
      read, the repository variable TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS as the reviewer set, and the GITHUB_API_URL,
      GITHUB_REPOSITORY and GITHUB_RUN_ID runner variables.
    location: scripts/ci/environment_reviewer_preflight.py
    status: open
    owning_item: "T4.24:c9"
  - id: SA-10
    assumption: >-
      The Claude-Session trailer attribution check assumes the harness exports CLAUDE_CODE_REMOTE_SESSION_ID as cse_ plus the
      same session key the harness's Claude-Session trailer URL ends in (session_ plus that key), that commands run from the
      session (git and its hooks) inherit it, and that a session without it (local CLI, CI runners) skips the commit check.
    location: scripts/session/session_trailer.py
    status: open
    owning_item: "T4.24:c9"
  - id: SA-11
    assumption: >-
      The persona contract mechanism assumes this repository's layout: the index docs/contracts/executor-personas.yaml,
      its rows' registry_key canonical_ids in config/agent/data_quality/source_registry.yaml, contracts and rendered
      prompts under docs/contracts/personas/, verdict skill tethers to .claude/skills/<skill>/SKILL.md files,
      compute-plane step maps keyed by the "## Step <id>:" headings of .claude/commands/plan.md or implement.md, and
      NAMED_READS in src/common/ducklake_named_reads.py as the warehouse_read parameter domain. Persona inputs are named
      by role and the verdict shell resolves each role to a path; an adopting repository is guaranteed none of them.
    location: docs/contracts/executor-personas.yaml
    status: open
    owning_item: "T4.24:c9"
  - id: SA-12
    assumption: >-
      The ontheloop plugin gate assumes three facts about the claude.ai cloud harness and one layout. Facts: a project
      thread may start in the parent of the checkout rather than in it; hook shells get CLAUDE_PROJECT_DIR equal to that
      start directory, wherever the session shell has moved; and hook shells get CLAUDE_PLUGIN_ROOT naming the synced
      plugin directory, which holds every file under .claude/hooks, the locator included. Layout: the checkout is the
      start directory or one level below it. A directory counts as the checkout when its
      .claude/.claude-plugin/plugin.json names ontheloop, so the plugin runs that directory's hooks and bin/venv-python;
      among several it uses the one whose .git is a directory (a linked worktree's is a file) when exactly one is, and
      otherwise runs no hook. A checkout two or more levels down, a second clone beside the first, or a missing or edited
      synced locator therefore switches every plugin hook off with exit 0 (rec-5060 owns the fail-closed witness; rec-5062
      owns guards that judge by the located checkout rather than the tool call's own directory).
    location: .claude/hooks/locate_checkout.bash
    status: open
    owning_item: "T4.24:c9"
  - id: SA-13
    assumption: >-
      The inference tier resolver in scripts/llm assumes this repository's two contract paths and their shapes:
      docs/contracts/inference-provider.yaml holds the tier rows, model_id_formats.litellm_tier_models (provider,
      models and default_model per tier) and model_id_formats.litellm_persona_selection, and
      docs/contracts/project-configuration.yaml holds one ports.run_persona.litellm.api_key.<role> row per committed
      tier role, whose variable names the environment variable that carries the key. A repository without these
      files resolves no selection, and the resolver fails loudly rather than guessing. Until ontheloop/platform.yaml
      exists (Decision 224 clause 7) the resolver reads these rows from this repository; T4.24 c16 moves them.
    location: scripts/llm
    status: open
    owning_item: "T4.24:c9"
  - {id: SA-14, assumption: "The verdict chain shell (scripts/personas/ with .github/workflows/persona-verdict-trigger.yml, persona-verdict.yml and persona-verdict-override.yml) assumes GitHub's workflow_run payload fields (event, head_sha, head_repository.full_name, head_branch), the pulls list filtered by head owner and branch, the compare, contents and tarball APIs, the run fields display_title and check_suite_id, the Checks API check-run shape (name, head_sha, conclusion, output, app) and its check suites, the issue-comments API with the github-actions[bot] login for its wake marker, the Actions artifact service between jobs, the run-name it sets and reads back, and this repository's docs/plans/ prefix for plan-PR routing, none of which a verdict plane off GitHub or an adopting repository with another plans directory is guaranteed to have.", location: scripts/personas/, status: open, owning_item: "T4.24:c9"}
  - {id: SA-15, assumption: "The persona container image (config/persona_image.yaml) assumes this repository's layout, copied under /app at the paths its build.copy entries list; a docker-compatible engine honouring docker run's --read-only, --tmpfs, --cap-drop, --security-opt, --user and --network flags (src/persona_hosts/local_container); and GHCR, a GitHub-specific registry, as its publish channel's store and record (Decision 234 clause 4's forge hedge).", location: dec-205, status: open, owning_item: "T4.24:c9"}
  - {id: SA-16, assumption: "The verdict chain shell's egress deny (config/persona_verdict_egress.yaml) assumes the SHA-pinned step-security/harden-runner and its agent v0.18.1 on ubuntu-latest with sudo at job start, the vendor's GitHub host list and its reachability at setup (it may switch the filter off), the agent alive all job, Azure's host addresses, the private ranges and the results-store wildcard as the only extra openings, no IPv6 route, and a public repository for the free tier; self-hosted, container or non-GitHub runners and private adopters need another mechanism.", location: scripts/personas/, status: open, owning_item: "T4.32:c7"}
