coupling_findings:
  - id: PC-01
    ports: [ops_verbs, persona_compute_host]
    location: scripts/ops_portal/writer_transport.py
    description: >-
      The function_url ops_verbs adapter authenticates every call by SigV4 against an AWS_IAM
      Function URL (src/common/ducklake_reader_client.py, scripts/ops_portal/writer_transport.py),
      so its caller must run on a compute host holding an AWS identity. Held by Decision 84 I-1's
      closed reader/writer Function-URL boundary; Decision 200 clauses 1-2's tenancy enforcement
      (tenant_id from the caller's authenticated identity) is a property of the function_url adapter of ops_verbs,
      enforced at the telemetry writer's edge (src/lambdas/ducklake_telemetry_writer/handler.py builds
      the caller principal from the Function URL's signed identity, Decision 213). CallerPrincipal is the
      internal type that edge hands the shared registration code; the in_process adapter supplies kind
      configured (Decision 184 cl.2, Decision 212 cl.3), so no port row is added (Decision 212 cl.6). The
      registration verbs are not in ops_verbs' provisional required_verbs today; whether they join the port
      is owed with T4.23:c4's in_process oracle. scripts/telemetry_capture/transport.py is a further function_url
      client of the telemetry writer (SigV4 over the same Function URL, status-returning), so no port row is added.
      scripts/telemetry_capture/verify.py is a further function_url client of the telemetry reader's verification verbs
      (session_tree_rows, telemetry_root_sessions) and, through scripts.rec_episode, of the ops portal; scripts/telemetry_verify/compare.py
      takes its compared columns and roles from the repository's config/lambda/ducklake/field_semantics.yaml, so it
      presumes that projection equals the deployed reader's (the coupling PC-07 records for the portal; the verification
      plan's read_version equality is its build-time check). No port row is added. Event-verb reads route by the
      writer's catalog deploy output (/agent-platform/ducklake/telemetry_catalog) through
      scripts/telemetry_capture/read_route.py to the telemetry reader's own Function URL only, a further function_url
      client of the same SigV4 boundary, so no port row is added (Decision 212 cl.6); the shared reader serves the ops
      reads and no event verb (Decision 236 cl.2), so on the smoke catalog an event read raises before any call.
      The same module's content route is a further function_url client of the telemetry content reader's own Function URL
      (Decision 239), so no port row is added either.
    status: accepted
    owning_item: dec-084
  - id: PC-02
    ports: [verdict_plane, change_surface]
    location: dec-184
    description: >-
      Decision 184 clause 3 fixes GitHub Actions as the verdict plane in all modes and Decision 205
      clause 2 makes the verdict a check run read from the Checks API on any host, which presumes
      GitHub as the change surface; no non-GitHub change surface can carry a verdict.
    status: accepted
    owning_item: dec-184
  - id: PC-03
    ports: [persona_compute_host, change_surface]
    location: dec-205
    description: >-
      The github_actions_shell persona_compute_host adapter exists only because a GitHub-originated
      repository event triggers a verdict persona on Actions (Decision 205 clause 1), so it presumes
      change_surface's github adapter; no non-GitHub change surface can drive it.
    status: accepted
    owning_item: dec-205
  - id: PC-04
    ports: [work_item_storage, ops_verbs]
    location: scripts/ops_data_portal.py
    description: >-
      The implemented ducklake work_item_storage adapter (scripts/ops_data_portal.py) reads and
      writes work items only through the function_url ops_verbs adapter, so DuckLake-on-Neon
      work-item storage presumes the cloud ops_verbs transport. Held by Decision 84's Single
      Portal Invariant: every rec write transits the closed ducklake_writer boundary and every
      read the ducklake_reader's named verbs.
    status: accepted
    owning_item: dec-084
  - id: PC-05
    ports: [content_blobs, ops_verbs]
    location: src/telemetry_client/blob_delivery.py
    description: >-
      The claim-check grant protocol is realised for the s3 adapter only: the producer helper
      (src/telemetry_client/blob_delivery.py) consumes presigned_put grants alone and presumes the s3 adapter behind the
      function_url begin_blobs verb. Until the local_directory adapter adds its own grant kind, the free-tier local plane
      cannot store a payload above 64 KiB.
    status: open
    owning_item: "T4.23:c7"
  - id: PC-06
    ports: [content_blobs, ops_verbs]
    location: src/common/ducklake_event_content.py
    description: >-
      transcript_content is registered in EVENT_READS but served by no deployed function: no transcript content is served
      from production (Decision 236 cl.3), and rec-4696 deploys the masked content reader (Decision 239), whose masked.py
      consumes the same content_blobs s3 adapter through ducklake_event_content.BLOB_STORE, so the coupling covers the
      content reader too (Decision 212). Its code builds the s3 adapter directly from
      TELEMETRY_BLOB_ROOT, so the free-tier local plane cannot serve an object row's bytes until the local_directory adapter
      and an adapter selection exist. The s3 adapter's get_blob is implemented; the verbs stay provisional until T4.23:c16.
    status: open
    owning_item: "T4.23:c7"
  - id: PC-07
    ports: [work_item_storage, ops_verbs]
    location: scripts/ops_portal/write_validators.py
    description: >-
      The portal's pre-check (gate_write) imports the DuckLake writer's pure gate modules and reads the repository's
      field_semantics.yaml, so it presumes the repository projection equals the deployed one. Between a contract merge
      and its deploy the two differ in either direction: a narrowing makes the pre-check stricter (it refuses early what
      the deployed writer still accepts, which Decision 210 cl.4 intends), and an added accepted value or other widening
      makes it looser (the deployed writer still refuses, authoritatively, so no invalid row is written; the caller sees
      the writer's 422).
    status: accepted
    owning_item: dec-210
  - id: PC-08
    ports: [persona_compute_host, orchestration_host]
    location: dec-229
    description: >-
      The fargate persona_compute_host adapter's run_image assumes a launcher holding an AWS identity with ecs:RunTask
      and iam:PassRole on the executor task role. With no orchestration_host adapter present, the interim coordinator
      (an interactive CC-web session or the /overseer, Decision 229 clause 1) supplies it as the operator's PlatformDev,
      launcher only. That coordinator is not an orchestration_host adapter and executes no loop definition (Decision 185
      clause 1); the step_functions adapter later becomes the port's second caller under its own execution role (T4.1).
    status: accepted
    owning_item: dec-229
  - id: PC-09
    ports: [work_item_storage, orchestration_host, change_surface]
    location: docs/contracts/ops_recommendations.yaml
    description: >-
      The work-item record and the loop's identifiers name a GitHub pull request: the ducklake work_item_storage
      adapter's record carries execution_pr_url (docs/contracts/ops_recommendations.yaml); the persona and loop
      identifiers carry a pull-request number (T4.31 c2, T4.2's plan_agent tuple, T4.1's node identifiers, T4.9a c2, c7
      and c9, the correlation ids of T4.9 and CD.38, T4.16 c3); the plan projection keeps pr_number (T4.5 c4); and
      telemetry_sessions carries pr_url (docs/contracts/telemetry_sessions.yaml, named as a pointer only: that frozen
      contract is not edited here). T4.33 c6's Q&A receipts cite a pull request as a pointer, like pr_url.
      So work-item storage and the orchestration host presume change_surface's github
      adapter. Accepted while the repository bootstraps (Decision 234 clause 4): core surfaces specified after Decision
      234 reference a generic change id, never a pull request number (T4.19 c6 owns the rule for loop identifiers), and
      the work-item target model (T4.23 c6) is where that id lands; re-decided when fully local product work starts in
      earnest or demand forces local versioning (Decision 234's forge-or-local-versioning condition).
    status: accepted
    owning_item: dec-234

structural_assumptions:
  - id: SA-01
    assumption: >-
      The recs_related neighbourhood expansion assumes a src/scripts/tests Python layout (module names and the import
      graph), the tests/ mirror naming convention (test_<stem>.py) and first-parent squash-merge history on the
      default branch (change coupling and rename aliases), none of which an adopting repository is guaranteed to have.
    location: scripts/recs_related/
    status: open
    owning_item: "T4.24:c9"
  - id: SA-02
    assumption: >-
      The turn-capture runtime assumes Claude Code's hook stdin fields (session_id, transcript_path, hook_event_name,
      stop_hook_active) and output-channel semantics (an exit-0 stderr line is recorded as an invisible SessionStart
      attachment), its transcript layout (<transcript dir>/<session id>/ with subagents and tool-results, tolerating the
      foreign telemetry-capture/ state directory) and .claude/settings.json hook registration, the switch and pin hook's remote named origin with a default branch main, the
      remote_session_change attachment's url shape and the <task-notification> <status> token, an exit-0 Stop hook's stderr
      line recorded as a root hook_success attachment at every Stop, the API-error assistant record (isApiErrorMessage)
      written before StopFailure runs, UserPromptSubmit running before its prompt record is written with a payload prompt_id
      equal to that record's promptId (assumed; a mismatch only times the prompt wait out), every record of a root response
      being on disk before Stop hooks run (measured in 2.1.302: 224 of 224 root assistant records, 92 of 92 intermediate
      ones, carry a string stop_reason, so the usable-witness stop_reason test cannot detect a late root record; the order is
      what makes a response unable to straddle a usable witness) and the egress proxy stopping before SessionEnd hooks in
      cloud sessions, the Skill tool_use block shape ({name: Skill, input: {skill: <name>}}, written whether or not the skill is
      registered) and this repository's skill names behind WORKFLOW_SKILLS in src/turn_capture/sessions.py (orient, planning,
      implement, overseer, audit-prompt, plan-critique, decision-scout, code-review, executor-rca; an adopting repository with other
      skill names reads the fallback workflow values, never a wrong value, and an adopter-declared map is T4.24-era work), none of
      which an adopting repository on another agent runtime is guaranteed to have. It also assumes Claude Code may write a late-loaded
      plugin's SessionStart hook records after the first turn, records a stdout-printing hook run twice (a heldContent copy and a plain
      copy sharing toolUseID, hookEvent, hookName, command and durationMs), shares one toolUseID across all hooks of one event, and may
      write no SessionStart record at all on a resume with a queued prompt (envelope R7's declared exception).
    location: scripts/telemetry_capture/
    status: open
    owning_item: "T4.24:c9"
  - id: SA-03
    assumption: >-
      The rec portal's glossary_lint rule reads docs/contracts/glossary.yaml at the repository root and enforces this
      repository's house style on rec text, which an adopting repository may lack or decline (Decision 211 clause 2), so
      a release must let the profile switch it off.
    location: scripts/ops_portal/write_validators.py
    status: open
    owning_item: "T4.24:c9"
