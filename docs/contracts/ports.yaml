# Port registry, conformance-suite pointers and cross-port coupling findings (Decision 212,
# amending Decision 184 clause 2 and Decision 197 clause 2), plus the repository-structure
# assumptions otl init must not make (Decision 211). The sole port registry: no other file
# restates these ports or verbs (Decision 212 clause 6). Every rule below is enforced by
# scripts/checks/contracts/validate_ports_contract.py unless marked advisory.
contract:
  id: ports
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "Decision 212 / PLAN-brownfield-adoption-port-conformance"
  description: >-
    Class D mechanism contract: On The Loop's named ports (Decision 184 clause 2 as amended by Decision 212), each with
    its required verbs, registered adapters and their tier, its credential-free oracle or recorded oracle gap, and its
    conformance-suite pointer; the cross-port coupling findings Decision 212 clause 3 calls defects; and the
    repository-structure assumptions Decision 211 requires the loop to record before otl init is specified.
  subject: ports
  evaluator:
    check: validate_ports_contract

