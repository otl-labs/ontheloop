      - {id: sandbox_runtime_windows, tier: experimental, status: pending, owning_item: "T4.34:c1"}  # srt's Windows alpha (dedicated local user, write-restricted token, WFP filters); its confinement legs alarm-not-gate while experimental (Decision 234 cl.1-2)
