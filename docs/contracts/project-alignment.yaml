# Project-alignment contract (PLAN-project-alignment): names /plan Step 6 and defines it once. Project alignment is the
# platform's defining planning step: the decision-scout recon of the active Decisions, then the human's sign-off on the
# plan draft refined from the scout's findings. This file owns the process definition, its carriers and its retired
# labels; the sequencing in the PR flow is owned by the Decisions and roadmap criteria it points at, and is never
# restated here (Decision 86).
contract:
  id: project-alignment
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "PLAN-project-alignment"
  description: >-
    Class D mechanism contract: the definition of project alignment (/plan Step 6) as one process of two agent tasks,
    its three carriers, the pointer to its autonomy tiering, and a documentation-only map of the labels it retired.
  subject: project-alignment
  evaluator:
    agent_surface: .claude/commands/plan.md

amendment_log:
  - {date: "2026-10-24", semantic_break: false, change_class: field_add, summary: "Initial authoring (PLAN-project-alignment, rec-3042, rec-3214): the process definition, two tasks, three carriers, autonomy pointer and legacy_labels map."}

definition:
  name: project alignment
  summary: >-
    One process at project level, run as /plan Step 6, that makes the draft plan agree with the project's active
    Decisions and then obtains the human's sign-off on it. It is the whole of Step 6; neither task alone is project
    alignment.
  distinct_from: >-
    The decision scout's intent-alignment (SPIRIT) lane of Decision 152, which is one check inside the first task, not
    the process.

tasks:
  - id: decision_scout_recon
    order: 1
    performed_by: a fresh-context decision-scout subagent (.claude/skills/decision-scout/SKILL.md)
    output: the scout verdict (NO_FLAGS | FLAGS_FOUND | BLOCK) and its CITE list
    owner_section: .claude/skills/planning/SKILL.md "Decision Scout Gate (Workflow Step 6, project alignment recon)"
  - id: alignment_sign_off
    order: 2
    performed_by: the planning agent presents; the human signs off
    input: the plan draft refined from the scout's findings
    output: the human's explicit 'write the plan' (or a clear equivalent)
    owner_section: .claude/skills/planning/SKILL.md "Alignment Sign-off (Workflow Step 6, project alignment)"

task_sequencing: >-
  decision_scout_recon completes first; alignment_sign_off is requested on the draft refined from its findings, and a
  material change after feedback re-runs the first task.

carriers:
  in_session:
    status: live
    mechanism: AskUserQuestion when the agent holds it, otherwise chat
  overseer_relay:
    status: live
    mechanism: >-
      A post-verdict GATE_REQUEST whose gate value is project-alignment, relayed verbatim to the human by the overseer;
      see docs/contracts/overseer-dispatch.yaml gate_request_trampoline.
  pr_flow:
    status: future
    mechanism: >-
      The persona-first PR flow. Pointer only: the sequencing is owned by docs/ROADMAP-PLATFORM.yaml T4.30 c5 and
      T4.29 c5, and by Decision 205 clause 1 and Decision 229 clause 4; this contract never restates it.

autonomy:
  pointer: docs/contracts/overseer-dispatch.yaml autonomy_tiers.plan_fork_classification
  provenance: "PLAN-step-6b-fork-classification, audit remedy B2-R4"
  frame: >-
    Decision 211 is the frame autonomy is earned under; Decision 235 is an analogous pattern only. This contract adds
    no autonomy behaviour: who signs off and what reaches the operator are unchanged.

legacy_labels:
  status: documentation_only
  rule: >-
    These retired labels are listed so a reader of an old plan, run ledger or Decision 152 can resolve them. They are
    never an accepted value anywhere (hard cut).
  map:
    - {retired: "Step 6a", now: "decision_scout_recon (the Decision Scout sub-step)"}
    - {retired: "Step 6b", now: "alignment_sign_off (the Alignment Sign-off sub-step)"}
    - {retired: "step-6b-confirmation", now: "the gate value project-alignment"}

decisions_cited: [86, 152, 167, 168, 177, 205, 211, 229, 235]
