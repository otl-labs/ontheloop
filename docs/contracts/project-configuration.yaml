# User-set configuration registry (Decision 224; rec-4403). One row per setting a user sets: its kind, its
# home on each substrate, who reads it and who sets it, its override and exported variables, its local and
# cloud defaults, and where this repository holds it today. Decision 224 carries the rule (kinds, homes,
# precedence); this file carries the rows and their field semantics, never the rule. No row holds a value:
# rows name homes and variables only. A docs/contracts/ports.yaml structural_assumptions row that otl init
# resolves by configuration names its setting's row id here; neither file restates the other. Enforced by
# scripts/checks/contracts/validate_project_configuration.py unless marked advisory.
contract:
  id: project-configuration
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "Decision 224 / PLAN-project-configuration-homes"
  description: >-
    Class D mechanism contract: the registry of user-set configuration (Decision 224) -- one row per
    setting with its kind, home per substrate, readers, setter, override and exported variables,
    local and cloud defaults, and this repository's current home and migration status.
  subject: project-configuration
  evaluator:
    check: validate_project_configuration

amendment_log:
  - date: "2026-10-30"
    semantic_break: false
    change_class: correction
    summary: "PLAN-secrets-to-ssm-cutover (Decision 237): homes.secrets_port names the SSM Parameter Store adapter fetched with GetParameter."
  - date: "2026-10-18"
    semantic_break: false
    change_class: field_add
    summary: "Initial authoring (Decision 224 / PLAN-project-configuration-homes; rec-4403)."

ambient_trigger: scripts/CLAUDE.md

kinds:
  project: "Not secret, shared by everyone on the repository; tracked."
  secret: "A credential; its value never enters a tracked file, a log, telemetry or a file under the working tree."
  private: "Not a credential, but never published from a public repository (an account id, an email, an ExternalId); homed like a secret."
  machine: "One clone's own choice (a profile name, a path override); untracked."

homes:
  platform_file: "ontheloop/platform.yaml, tracked; the setting sits under the adapter that reads it, or under clouds.<vendor> when one cloud's adapters share it, which no other cloud's or port's adapter reads (Decision 212 clauses 3 and 8), or under project when no adapter reads it."
  clone_file: ".ontheloop/config.yaml, gitignored, one per clone (Decision 211 clause 5 as amended)."
  user_env_file: "A user-level env file outside the working tree that otl init creates with variable names only and mode 0600; the user fills the values, and the secrets port's local adapter reads it after the process environment."
  vendor_store: "The vendor CLI's own credential store (Decision 206 clause 2: the Claude Code CLI's saved login)."
  actions_secret: "A GitHub Actions secret of the user's repository, mapped to the variable by name."
  supplied: "The substrate supplies the value itself (the Actions GITHUB_TOKEN, an OIDC sign-in, an execution role); nothing to set."
  secrets_port: "The secrets port's cloud adapter, aws_ssm_parameter_store (docs/contracts/ports.yaml), fetched at runtime with GetParameter (decryption on) (docs/contracts/secret-material-handling.yaml runtime_fetch)."
  container_env_file: "An env file the container runtime injects into a local container; On The Loop code never reads it (Decision 206 clause 2)."
  fargate_injection: "Fargate's native secret injection, never Lambda (Decision 206 clause 2)."

kind_homes:
  project: {local: [platform_file], ci: [platform_file], cloud: [platform_file]}
  machine: {local: [clone_file], ci: [], cloud: []}
  secret: {local: [user_env_file, vendor_store, container_env_file], ci: [actions_secret, supplied], cloud: [secrets_port, fargate_injection, supplied]}
  private: {local: [user_env_file], ci: [actions_secret], cloud: [secrets_port]}

precedence:
  project_and_machine: [flag, override_variable, clone_file, platform_file, built_in_default]
  secret_and_private: [process_environment, user_env_file]

clouds: [aws]

not_configuration:
  runtime_state: "Catalog, logs, transcripts and run state under .ontheloop/ (Decision 211 clause 5)."
  supplied_fact: "A value CI or a vendor runtime sets on its own, such as GITHUB_SHA or AWS_LAMBDA_FUNCTION_NAME."
  deploy_output: "A value a deploy writes for the runtime to discover, such as a Function URL or a provisioned flag; a GitHub repository variable may carry one."
  version_pin: "A platform-owned version pin, one tracked file behind one loader and a lockstep gate (Decision 99)."

semantics:
  id: "The setting's dotted key in ontheloop/platform.yaml, or in .ontheloop/config.yaml for a machine row; <port> stands for every port id in docs/contracts/ports.yaml."
  kind: "One key of kinds."
  basis: "The Decision, criterion or file that makes it a setting."
  applies_when: "always, {port, adapter} (both declared in docs/contracts/ports.yaml) or {cloud} (one of clouds): the setting is required only when that selection is made (Decision 224 clause 4)."
  homes: "The home on each substrate (local, ci, cloud): one home or a list, drawn from kind_homes for the row's kind; null where that substrate does not use the setting."
  variable: "secret and private rows: the default name of the variable that carries the value; ontheloop/platform.yaml names the one in use. project and machine rows: the declared OTL_ override variable, or null when there is none."
  exports: "Vendor variables the harness exports from the resolved value for child tools; never read as input (Decision 224 clause 3)."
  readers: "Repository paths that read the setting today, or the owning item that will build the reader."
  set_by: "init (otl init asks for or derives it) or user (the user sets it)."
  defaults: "{local, cloud}: the built-in default on each, or null when there is none or otl init must ask. Always null for secret and private rows."
  this_repository: "null when this repository does not use the setting; otherwise {current_home, note, status, owning_item}. current_home is the repository path that holds it today, or null with a note saying where it lives instead. status open -- held outside its home, owning_item moves it; resolved -- held in its home; accepted -- a stated exception, owning_item names the Decision that holds it."
  enforcement: "The registered check that guards the row, or advisory."

settings:
  - id: clouds.aws.region
    kind: project
    basis: "Decision 202 clause 4; rec-4067"
    applies_when: {cloud: aws}
    homes: {local: platform_file, ci: platform_file, cloud: platform_file}
    variable: null
    exports: [AWS_REGION, AWS_DEFAULT_REGION]
    readers: [.github/actions/aws-region/action.yml, terraform/bootstrap/CLAUDE.md, terraform/github/CLAUDE.md, src/common/config.py]
    set_by: init
    defaults: {local: null, cloud: null}
    this_repository: {current_home: config/aws-region, note: "the two Terraform aws_region defaults are copies validate_project_region pins equal to it; config/config.personal.yaml aws.region and the Python defaults (src/common/config.py) are unenforced copies, owned by rec-4404", status: open, owning_item: "T4.24:c16"}
    enforcement: validate_project_region
  - id: clouds.aws.profile
    kind: machine
    basis: "scripts/aws_profile.py"
    applies_when: {cloud: aws}
    homes: {local: clone_file, ci: null, cloud: null}
    variable: null
    exports: [AWS_PROFILE]
    readers: [scripts/aws_profile.py, src/common/ducklake_reader_client.py]
    set_by: user
    defaults: {local: null, cloud: null}
    this_repository: {current_home: scripts/aws_profile.py, note: "DEFAULT_SSO_PROFILE, overridden by an AWS_PROFILE input; config/config.personal.yaml's aws.profile key is unread", status: open, owning_item: "T4.24:c16"}
    enforcement: advisory
  - id: ports.<port>.adapter
    kind: project
    basis: "Decision 212 clause 8"
    applies_when: always
    homes: {local: platform_file, ci: platform_file, cloud: platform_file}
    variable: null
    exports: []
    readers: ["T4.24:c14"]
    set_by: init
    defaults: {local: "the port's local adapter; where ports.yaml registers none, its supported default (verdict_plane and change_surface: Decision 212 clause 6; run_persona: litellm, Decision 206 clause 8)", cloud: null}
    this_repository: {current_home: null, note: "no bundle file; the AWS adapters are wired in code", status: open, owning_item: "T4.24:c16"}
    enforcement: advisory
  - id: project.ref
    kind: project
    basis: "Decision 200 clause 1; docs/contracts/project-id.yaml"
    applies_when: always
    homes: {local: platform_file, ci: platform_file, cloud: platform_file}
    variable: null
    exports: []
    readers: [src/turn_capture/transcript.py, scripts/telemetry_capture/runner.py]
    set_by: init
    defaults: {local: null, cloud: null}
    this_repository: {current_home: .claude/settings.json, note: "the --project-ref flag of the SessionStart capture hook", status: open, owning_item: "T4.24:c16"}
    enforcement: advisory
  - id: ports.ops_verbs.in_process.tenant
    kind: project
    basis: "Decision 200 clause 1 (the local adapter's configured tenant constant)"
    applies_when: {port: ops_verbs, adapter: in_process}
    homes: {local: platform_file, ci: platform_file, cloud: null}
    variable: null
    exports: []
    readers: [T4.23]
    set_by: init
    defaults: {local: null, cloud: null}
    this_repository: null
    enforcement: advisory
  - id: ports.catalog.local_file.path
    kind: machine
    basis: "T4.24 c2; T4.23 c2"
    applies_when: {port: catalog, adapter: local_file}
    homes: {local: clone_file, ci: null, cloud: null}
    variable: null
    exports: []
    readers: ["T4.23:c2"]
    set_by: init
    defaults: {local: "under .ontheloop/ (Decision 211 clause 5)", cloud: null}
    this_repository: null
    enforcement: advisory
  - id: ports.run_persona.litellm.model
    kind: project
    basis: "Decision 173 clause 2; Decision 206 clause 3"
    applies_when: {port: run_persona, adapter: litellm}
    homes: {local: platform_file, ci: platform_file, cloud: platform_file}
    variable: null
    exports: []
    readers: [T4.2]
    set_by: init
    defaults: {local: null, cloud: null}
    this_repository: {current_home: docs/contracts/inference-provider.yaml, note: "provider and model per role, for deployments On The Loop operates", status: accepted, owning_item: dec-173}
    enforcement: advisory
  - id: ports.run_persona.litellm.api_key
    kind: secret
    basis: "T4.24 c2; docs/contracts/inference-provider.yaml (byok)"
    applies_when: {port: run_persona, adapter: litellm}
    homes: {local: user_env_file, ci: actions_secret, cloud: secrets_port}
    variable: ANTHROPIC_API_KEY
    exports: []
    readers: [T4.2]
    set_by: user
    defaults: {local: null, cloud: null}
    this_repository: null
    enforcement: advisory
  - id: ports.run_persona.claude_cli.credential
    kind: secret
    basis: "Decision 206 clause 2 (the Actions secret serves Decision 205 clause 1's verdict personas only)"
    applies_when: {port: run_persona, adapter: claude_cli}
    homes: {local: [vendor_store, container_env_file], ci: actions_secret, cloud: fargate_injection}
    variable: CLAUDE_CODE_OAUTH_TOKEN
    exports: []
    readers: [T4.27]
    set_by: user
    defaults: {local: null, cloud: null}
    this_repository: null
    enforcement: advisory
  - id: ports.change_surface.github.token
    kind: secret
    basis: "T4.24 c2; Decision 217 clause 3 (a repository-scoped fine-grained token in the free tier)"
    applies_when: {port: change_surface, adapter: github}
    homes: {local: user_env_file, ci: supplied, cloud: secrets_port}
    variable: GITHUB_TOKEN
    exports: []
    readers: [T4.1]
    set_by: user
    defaults: {local: null, cloud: null}
    this_repository: {current_home: null, note: "a Secrets Manager GitHub PAT, the Actions GITHUB_TOKEN and the cloud environment setup script", status: open, owning_item: "T4.24:c16"}
    enforcement: advisory
