---
# Class C cross-system invariant: the project partition id.
# Ratified under the CD.25 pre-codegen contract ratification ritual (tier_item T0.12.7).
# Re-grounded to the write-boundary registration model at contract_version 2 (Decision 199/200,
# telemetry event-journal re-model).
contract:
  id: project-id
  class: C
  contract_version: 2
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 199/200)"
  description: >-
    Canonical cross-system project partition identifier intended to span every ops +
    telemetry table and every Lambda invocation, identifying which project a row belongs
    to. project_id is repository identity, distinct from tenant_id (tenant-id.yaml, Decision
    200); both are always-present columns, with tenancy ENFORCEMENT staying a cloud-adapter
    property (Decision 197 clause 2, re-mapped by Decision 200).
fields:
  project_id:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Opaque, immutable ULID identifying the project (repository) a row belongs to. Minted by the
      writer's registration verb (rec-4024) with code committed in this repository, never a client-generated value.
      Ids are catalog-local and never persisted outside the minting catalog: producers hold only project_ref (a
      producer cursor stores project_ref, not project_id; declared coverage, residual owner rec-4026).
    semantics: >-
      The caller sends a natural project_ref (an opaque per-repository label, resolved by the
      caller's own configuration -- this contract names no particular derivation); the write
      boundary resolves it to the registered project_id, auto-registering an 'unregistered' row
      with a PERMANENT id on first sight of an unknown project_ref rather than rejecting the write.
      No default value: there is no implicit project when project_ref is absent, only the explicit
      unregistered-auto-registration path (see amendment_log for what this replaces). The Class C
      baseline nullability is the loosest common value; the four telemetry Class A contracts
      tighten it to not_null: true via dq_intent_local (Invariant 5) -- project_id is
      always present on a telemetry row. Non-telemetry (ops) consumers may keep the looser baseline
      until their own re-ratification.
      A registered (tenant_id, project_ref) -> project_id resolution is IMMUTABLE: a (tenant_id,
      project_ref) is never re-bound to a different project_id, 'unregistered' auto-registrations
      included (Decision 200 clause 1's 'permanent id'). Remapping to a canonical project via
      canonical_project_id on the SCD2 ops_projects dimension is read-side only and never changes
      what the write boundary resolves for that (tenant_id, project_ref) (Decision 200 clause 3:
      never by rewriting facts). Every producer of one trace tree supplies the ROOT session's
      project_ref (a transcript-less producer receives it alongside session_ref), so project_id --
      a hash input to every entity/FK key -- is constant across a tree: stated outright, a telemetry
      row's project_id is its trace tree's ROOT project, so a sub-agent acting in another repository
      is attributed to the root's project. The tree's project_ref is PINNED once, at the ROOT
      session's first record (the same pin point as session_started_at): every row of the tree, the
      root's own later turns included, carries that pinned value, never a per-turn or per-producer
      re-read of repository configuration. A producer that has not received the root's project_ref
      DEFERS emission (mirroring R7's session_started_at handoff) and never substitutes its own.
      Reserved namespace (Decision 200 clause 1 exception): a project_ref whose ops_projects purpose derivation yields
      anything other than real (the prefix_map in ops_projects.yaml's purpose derivation is the single source of the
      reserved prefixes, today 'drill:' and 'synthetic:') is NEVER auto-registered. It must be registered explicitly
      with register_project, and an append naming an unregistered reserved ref is rejected. This contract is that
      rule's single source; ops_projects.yaml points here (Decision 210 clause 3). Declared coverage: writer-enforced
      (tests/common/test_ducklake_telemetry_append.py::test_unregistered_reserved_ref_is_refused_before_any_transaction,
      Decision 181 cl.2). The telemetry write boundary also refuses a project_ref carrying U+0000 or a lone surrogate as an
      encoding-validity guard (400 invalid_unicode), not a label rule.
    populated_by: >-
      the write boundary's project-registration verb (rec-4024), resolving project_ref to
      project_id (auto-registering 'unregistered' on first sight). No current populator.
    write_time_validation: >-
      Registration is idempotent under concurrency by a counter-row lock on ops_entity_counters (operator decision
      2026-09-29): the way Decision 200's "unique constraint or advisory lock" lock arm is realised under DuckLake's
      optimistic concurrency, so two racing registrations of one (tenant_id, project_ref) serialise on the counter row
      and the loser replays to the winner's id. Evidence: plan 3's race test on the local file catalog (if that test
      fails, the reversal condition fires and the model returns to /plan). Built in plan 3 (rec-4024).
    dq_intent: {}
    governance_notes: >-
      Population is future-state (rec-4024). Ratifying the invariant now at status: ratified (NOT
      provisional_v0) is deliberate: Class C cross-system invariants do not use the v0-provisional
      state (INTENT Part 7). name and remote (repository-identity attributes an earlier draft of
      this contract once carried) are attributes of the SCD2 ops_projects dimension Decision 200
      forward-declares, authored as its own Class A contract in rec-4024, NOT columns of this
      opaque id -- an unregistered project is remapped to its canonical row via canonical_project_id
      on that dimension, never by rewriting facts on rows already written with the unregistered id.
    amendment_log:
      - date: "2026-10-15"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-rule-declarations-and-writer-conformance (rec-4158): the semantics text names the retired enforced flag no
          longer; it says not_null is declared (true) via dq_intent_local. Meaning unchanged.
        migration_story: >-
          Prose only: the declared rule set is identical before and after.
      - date: "2026-10-14"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-telemetry-append-inline (slice 2a-2 plan 3 part 2): the reserved-namespace rule's declared coverage becomes
          writer-enforced and names its enforcing test; one sentence states the write boundary's encoding-validity refusal
          (U+0000, lone surrogate) for project_ref, not a label rule.
        migration_story: No rule, value or behaviour of the reserved namespace changes; the append verb now enforces what the note declared.
      - date: "2026-10-05"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-table-registration (slice 2a-2 plan 1, review item C2): added the reserved project_ref namespace
          ('drill:' / 'synthetic:' refs are never auto-registered; explicit register_project only), named the counter-row
          lock as the registration idempotency mechanism, reworded the in-repo minting claim to "minted by code committed in this
          repository", and declared ids catalog-local. semantic_break=true: an append naming an unregistered reserved ref is
          now rejected rather than auto-registered.
        migration_story: >-
          No live populator or registration verb exists yet (rec-4024 builds in plan 3), so no runtime migration is required.
      - date: "2026-09-26"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          rec-4059 (contract-risk review of slice 1, PLAN-telemetry-contract-risk-amendments):
          added the immutable-resolution and root-project-pin rules. Decision 199's identity hash
          derives every entity/FK key from project_id as one of its inputs, so two producers of the
          same trace tree must agree on project_id byte-for-byte or their FK derivations diverge --
          this reads as field semantics of that identity requirement, not a re-decision of Decision
          200 clause 1 (which already made 'unregistered' registration permanent). semantic_break=
          true: a producer that previously re-read its own repository configuration per turn must
          now defer emission instead when it lacks the root's pinned project_ref.
        migration_story: >-
          No live populator or registration verb exists yet (population is future-state, rec-4024),
          so no runtime migration is required; rec-4024 builds directly to this pinning rule.
      - date: "2026-09-24"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199/200): re-grounded from a
          harness/Lambda-injected default-string field (default "theseus", the now-retired brand,
          Decision 198) to a writer-minted opaque ULID resolved from a caller-sent project_ref, with
          unknown-ref auto-registration. name/remote moved off this field entirely, onto the
          forward-declared SCD2 project dimension (rec-4024). semantic_break=true: the identity
          MECHANISM changed (string default -> registered opaque id), not merely the prose.
        migration_story: >-
          No live populator existed for either shape (population is future-state in both), so no
          runtime migration is required. The forward implementation (rec-4024) builds directly to
          this contract_version 2 spec.
      - date: "2026-08-26"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          Platform cleanse: wording referencing removed product surfaces or the retired
          legacy query engine trimmed; field meaning unchanged.
governance_notes: >-
  Single-hop leaf invariant (no chained $ref; Class C contracts are leaf nodes,
  Invariant 5). The four telemetry Class A contracts (T0.12.6, re-grounded at Decision
  199/200) $ref project_id, tightened not_null. The dimension join (each telemetry
  table's project_id -> ops_projects, and ops_projects.tenant_id -> ops_tenants) is declared in _joins.yaml.
amendment_log:
  - date: "2026-10-05"
    semantic_break: true
    change_class: governance_note_add
    summary: >-
      PLAN-telemetry-table-registration (review item C2): reserved project_ref namespace, counter-row lock, catalog-local ids;
      accompanies the field-level entry on project_id. The dimension join now exists in _joins.yaml.
    migration_story: No live populator exists yet (rec-4024, plan 3), so no runtime migration is required.
  - date: "2026-09-24"
    semantic_break: true
    change_class: governance_note_add
    summary: >-
      PLAN-telemetry-event-journal-contracts (Decision 199/200): contract-level description
      re-grounded to name tenant_id (tenant-id.yaml) as the distinct tenancy identifier and to
      drop the "theseus" default framing. Accompanies the field-level amendment_log entry above
      (CD.25 category-6 gate). semantic_break=true, mirroring the field-level entry.
    migration_story: >-
      Prose-only at the contract-description level; no runtime behaviour changes (no populator
      existed for either shape).
  - date: "2026-08-26"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      Platform cleanse: references to the removed trading-product surfaces and the retired
      pre-DuckLake query-engine estate were removed or reworded.
    migration_story: >-
      The repository became platform-only. Product surfaces (broker credentials, the product
      roadmap, the market-data pipeline) and the retired legacy query-engine path (staging
      outbox, ops compaction, legacy workgroup IAM) were deleted, and this contract's
      references to them were removed in the same change. No live DuckLake field or verb
      semantics changed.
  - date: "2026-10-15"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-rule-declarations-and-writer-conformance (rec-4158, Decision 210): the dq_intent `enforced` key is retired
      from every rule leg. not_null is declared by presence (`true`, or `{exclude_before: D}`); an optional column or a
      loosest-baseline field carries no not_null leg; the other legs lose the key. A declared rule is an enforced rule.
    migration_story: >-
      Declarations re-spelled only. No rule is added, removed or re-dated: the declared rule set, read through
      scripts.contract_rules, is identical before and after, and the generated field_semantics.yaml projection of
      this contract is unchanged.
previous_versions:
  - contract_version: 1
    ratified_at: "2026-06-19"
    ratified_via: "Step 10 multi-perspective critique + PLAN-class-c-cross-system-invariants merge to main"
    superseded_on: "2026-09-24"
    summary: >-
      Harness/Lambda-injected default-string project_id (Optional[str], default "theseus",
      two-phase T2.17 realization). Superseded by the write-boundary registration model
      (Decision 199/200): opaque writer-minted ULID, caller-sent project_ref, unregistered
      auto-registration, no default value.
