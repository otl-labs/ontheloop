---
# Named read-time projection contract for recommendation relevance (T3.8 / CD.36).
# NOT a Class A ops_recommendations column set (Decision 84) -- relevance is computed
# at read-time by scripts/rec_relevance.py, not stored in the warehouse. A Class D mechanism
# contract (migration-step-3-grandfathering, T2.56 migration step 3) as of the `contract:` block
# below.
# Machine-parseable contract (Decision 86). validate.py guards enum drift.
contract:
  id: recommendation-relevance
  class: D
  contract_version: 2
  status: active
  description: >-
    Class D mechanism-contract envelope for this file (migration-step-3-grandfathering, T2.56
    migration step 3). The verdict-enum body itself is unchanged by this envelope.
  subject: recommendation-relevance
  evaluator:
    check: validate_rec_relevance_contract

amendment_log:
  - {date: "2026-10-30", semantic_break: true, change_class: field_add, summary: "PLAN-merge-step-checks (rec-4592, rec-2437): added implement_gate (the /implement re-check never closes a bundled rec) and scoped deterministic_auto_close to the post-merge venue; close_proposed.verdicts lists satisfied for the semantic path. Narrows Decision 103 permissive may-auto-close at one venue; no verdict changed. contract_version 1 -> 2."}
  - date: "2026-10-10"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-recs-full-cache-retirement (Decision 215, amends Decision 103's warmed-read-cache
      clause): planning_gate_protocol reads the rec through fetch_recs_by_ids (the recs_by_ids
      named verb) instead of the retired local recs cache file, and the "never call
      _make_reader() (Decision 88: use read-cache only)" sentence is replaced by Decision 215's
      rule. No verdict set, signal definition, or constraint changed.
  - date: "2026-09-12"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-skills-layer-prose-relocation (T2.56 c1 skills-layer conjunct): added the
      planning_gate_protocol key, the planning-time relevance gate relocated out of the planning
      skill's Recommendation Relevance Gate section (which now carries a conditional-read stub
      pointing here). No rule changed -- unchanged prose, restated here.
  - date: "2026-09-07"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      PLAN-backlog-health-detection: corrected a mis-cite on both never-queue-wide clauses below
      (signal_definitions.acceptance_probe.signal and constraints[1]) -- each attributed the
      acceptance-probe "on-demand per-rec only, never queue-wide" constraint to Decision 88 (the
      Neon catalog-EGRESS budget), but the probe those clauses constrain is a LOCAL
      `subprocess.run(shell=True)` with no warehouse round-trip at all, so Decision 88 was never
      the real owner. The real owner is Decision 103 itself (this projection's ratifying
      decision), which now carries a dated amendment naming the correction and sanctioning a
      second venue: scripts/backlog_health's scheduled monitor (Decision 62 2026-06-16 amendment
      / CD.12, alarm-not-gate) composes this evaluator queue-wide for target_existence and
      open_duplicate ONLY (never acceptance_probe) via one structural DuckLake read per episode
      plus local evaluation -- a measured two-attach-per-episode pattern with zero incremental
      egress, distinct from the still-forbidden queue-wide acceptance-probe run. Also records that
      this monitor emits close-proposals for satisfied candidates and never auto-closes --
      deliberately stricter than closure_split's deterministic_auto_close permits for the
      interactive gate.

projection_id: recommendation-relevance
version: 1
status: active
ratified_via: >-
  PLAN-rec-relevance-freshness-gate merge to main (T3.8 / CD.36)
description: >-
  Relevance verdict contract for open recommendations. The verdict is a read-time signal
  computed deterministically-first, with semantic fallback. No new Class A columns are
  added to ops_recommendations (Decision 84); this projection is ephemeral and surfaced only.
planning_gate_protocol: >-
  Planning-time relevance gate (relocated from the planning skill's Recommendation Relevance
  Gate, PLAN-skills-layer-prose-relocation). Fires before bundling any rec. Before adding any open
  recommendation to the plan's bundled_recommendations list, re-check its relevance using
  scripts/rec_relevance.py. Recs can go stale between filing and the current session (target file
  deleted, decision ratified, sibling plan already fixed it). Protocol: for each candidate rec
  identified via the "Suggest Aligned Recommendations" step, run
  `bin/venv-python -c "from scripts.rec_relevance import evaluate_rec_relevance; from
  src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, missing =
  fetch_recs_by_ids(make_reader(), ['rec-NNNN']); rec = rows[0] if rows else None; verdict,
  evidence = evaluate_rec_relevance(rec, run_acceptance_probe=False); print(verdict, '|',
  evidence[:120])"` (one recs_by_ids call per batch of up to 50 ids; Decision 215). Verdict handling: relevant or unknown -- proceed; offer to
  bundle normally. satisfied -- do NOT bundle; surface the evidence and the proposal command from
  propose_or_close_rec(rec_id, 'satisfied', evidence, deterministic=False) (planning time: never
  deterministic); wait for operator to run the closure command, then proceed without bundling.
  superseded, duplicate, contradicted, stale_target, blocked_by_decision -- do NOT bundle; present
  the propose_or_close_rec output and wait for operator decision; remove from candidate list
  regardless of outcome. Constraints: run_acceptance_probe=False is mandatory at planning time
  (Decision 55: no auto-closure from semantic judgment); acceptance probes run only at /implement
  time. Read recs only through fetch_recs_by_ids (Decision 215: no local recs cache exists; one
  bounded named-verb call per batch, never a per-rec loop or a full-table read).

verdicts:
  - relevant
  - satisfied
  - superseded
  - duplicate
  - contradicted
  - stale_target
  - blocked_by_decision
  - unknown
closure_split:
  deterministic_auto_close:
    verdicts: [satisfied]
    condition: >-
      Acceptance probe passes on main (non-empty acceptance field, run_acceptance_probe=True).
      Auto-closes via update_rec(status=closed, resolution=<proof>). Decision 70 lifecycle.
      Post-merge venue only (T3.9); never at /implement time (implement_gate below).
    proof_required: true
  close_proposed:
    verdicts:
      - satisfied
      - superseded
      - duplicate
      - contradicted
      - stale_target
      - blocked_by_decision
    condition: >-
      Semantic signal (including a semantic satisfied, e.g. commit correlation) or deterministic
      non-satisfaction verdict.
      Emits a printed close_proposed command (--update-rec ... --status closed).
      Never auto-closes on semantic or LLM judgement (CD.36 / Decision 55).
  no_action:
    verdicts: [relevant, unknown]
    condition: >-
      No resolution signal detected, or insufficient data to assess.
      Surfaced for operator review; no action is taken automatically.
implement_gate: >-
  /implement Workflow Step 3 (`bin/venv-python -m scripts.rec_relevance --implement-recheck`) runs the acceptance
  probe on each bundled rec but never closes one (rec-4592): a probe that passes on the implementing tree does not
  prove the work merged (a non-discriminating probe, a drifted premise, or a resumed run's own edits all pass). A
  satisfied verdict is reported and the rec stays bundled; the Resolves trailer closes it after merge through
  Decision 201's gate. Every verdict other than relevant, unknown or satisfied prints the close_proposed command
  (deterministic=False).
signal_definitions:
  acceptance_probe:
    type: deterministic
    signal: >-
      Run rec.acceptance shell command with bounded timeout (default 10s). On-demand per-rec
      only -- never queue-wide (Decision 103; corrected 2026-09-07 from a Decision 88 mis-cite --
      Decision 88 is the Neon catalog-EGRESS budget, and this probe is a local subprocess call
      with no warehouse round-trip). Exit 0 => satisfied. No acceptance field => probe is
      skipped; rec cannot resolve to satisfied via this signal alone.
  target_existence:
    type: deterministic
    signal: >-
      Verify rec.file exists at repo root. Absent path => stale_target.
  decision_contradiction:
    type: deterministic
    signal: >-
      Extract Decision/CD IDs from rec context/acceptance/title. If any cited decision
      has status containing "superseded by" => contradicted; "pending" => blocked_by_decision.
  commit_correlation:
    type: semantic
    signal: >-
      If a recent main commit modified rec.file after rec.created_timestamp => satisfied
      (close_proposed only -- semantic signal, not auto-close).
  closed_sibling_jaccard:
    type: semantic
    signal: >-
      Closed rec on same file with title Jaccard >= 0.5 => superseded (close_proposed).
  open_duplicate:
    type: semantic
    signal: >-
      Open rec on same file with title Jaccard >= 0.7 => duplicate (close_proposed).
constraints:
  - "Decision 84: no new Class A columns added to ops_recommendations."
  - >-
    Decision 103: acceptance probe is on-demand per-rec only; never queue-wide (corrected
    2026-09-07 from a Decision 88 mis-cite -- Decision 88 is the Neon catalog-EGRESS budget, and
    this probe is a local subprocess call with no warehouse round-trip).
  - "Decision 55: semantic verdicts produce close_proposed only; no auto-action."
  - "Decision 70: verdict and lifecycle status are orthogonal; no new status enum value."
  - "CD.36: deterministic satisfied auto-closes with proof (post-merge venue; never at /implement, see implement_gate); all else is close_proposed."
