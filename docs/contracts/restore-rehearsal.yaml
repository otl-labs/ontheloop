# SIT restore rehearsal (rec-5023, Decision 251). Class D mechanism contract: the ephemeral-only rehearsal verb, its
# boundary, the human-directed ADMIN sitting, the consistency rule, the counts-only evidence and the verifier's exit
# criteria. PUBLIC repository (Decision 101): logical names only; no host, DSN, password, bucket name or ARN anywhere.
contract:
  id: restore-rehearsal
  class: D
  contract_version: 1
  status: draft
  description: >-
    Proves, in the single account and before any SIT resource exists, that a PROD catalog dump restores into an empty
    Neon target under its own role, that ducklake_metadata.data_path rewritten outside the production data path reads
    every table and takes writes there only, and records the timings, sizes and catalog format SIT's reset depends on.
    It also reports whether the restored catalog copies into a DuckDB-file catalog that reads identically, as
    evidence for the catalog-backend choice; that leg gates nothing here.
    A failed criterion is a result: SIT falls back to a fresh-init catalog with synthetic data (rec-5024 decides).
  subject: restore-rehearsal
  evaluator:
    agent_surface: docs/DECISIONS.md

amendment_log:
  - {date: "2026-11-09", semantic_break: false, change_class: field_add, summary: "PLAN-sit-restore-spike (rec-5023, Decision 251): created."}

boundary:
  binding: >-
    IAM bounds the rehearsal functions (Decision 143 cl.1). They run under existing execution roles: the restore
    function under the maintenance-smoke role (read, write and delete on the smoke prefix only, nothing under a
    production prefix), which also deletes the scratch prefix at teardown; the checksum function under the reader role
    (read-only at S3). Only PlatformAdmin can invoke or read the ephemeral functions: no CI or PlatformDev grant
    names them. Scratch lives only under
    ducklake-neon-smoke/restore-rehearsal/<run_id>/. The restore target is a Neon child branch of the catalog project
    holding a new role and a new database, both named restore_rehearsal_<run_id>, deleted whole with the branch.
  defence_in_depth: >-
    The verb's own refusals: the function name must end in -restore-rehearsal-ephemeral; env DUCKLAKE_RESTORE_REHEARSAL
    must equal the event's confirm; prod_checksum refuses when env DUCKLAKE_RESTORE_TARGET_DSN is set, and every other
    step refuses when it is absent or its username or dbname does not start with restore_rehearsal_, which binds each
    step to the function this contract names; every scratch path must sit under the rehearsal prefix; the dump URL
    must be an https S3 presigned GET. A refusal is RestoreRehearsalRefused (400) before any connection opens. A
    function whose name ends in -restore-rehearsal-ephemeral refuses every other maintenance action the same way.
  never:
    - A write or delete under ducklake/, ducklake-telemetry/ or telemetry-blobs/.
    - A maintenance verb (merge, gc, expire, cleanup, catalog_reinit) on a restored catalog.
    - A connection to the restore target with a PROD role, or a PROD catalog connection that is not READ_ONLY.
    - Terraform, an IAM change, a standing resource, or a /secret/ parameter. The target role's password lives only in
      the restore function's environment and on the branch, and dies with them; it is never printed, logged, returned
      or written to disk.
  residual: >-
    For the sitting's length, copied production ops data sits under the smoke prefix, which the CI-invokable
    maintenance-smoke function can also reach; its gc deletes only files older than FILE_CLEANUP_GRACE_DAYS (7), and
    CopyObject sets a fresh LastModified, so nothing copied is collected during a sitting. Teardown deletes the prefix;
    noncurrent versions expire after 30 days under the bucket's existing smoke-prefix lifecycle rule. Fenced by code, not IAM: the checksum function's
    catalog login is the shared owner login (Decision 230 cl.2), held to a READ_ONLY ATTACH and the refusal of every
    other action; PlatformDev holds write on the whole bucket, used here only through key builders that refuse a path
    outside the rehearsal prefix (copy_data's destination, probe_absent, version_recovery, and the teardown fallback
    below); the child branch is a
    copy-on-write copy of PROD whose PROD roles stay valid on its endpoint for the sitting, and only the target role's
    DSN is given to a function. That target role is minted by the Neon API, so it can likely read the branch's copy of
    the whole PROD database, telemetry catalog included (inferred); only PlatformAdmin can read its password, and
    PlatformAdmin already reads the PROD catalog DSN. The dump, telemetry catalog included, exists outside the DR
    bucket only in the restore function's /tmp. Decision 81 cl.7's closed read boundary admits, for a sitting only, the
    checksum reader, copy_data, the restore function's one presigned read of the dump and its reads of the restored
    copy (Decision 251 cl.3). The ephemeral functions write no CloudWatch logs, because each role's log grant names
    only its production log group: a step error surfaces only as its step, error class and code, which the
    orchestrator prints.

verb:
  action: restore_rehearsal
  host: >-
    src/lambdas/ducklake_maintenance/restore_rehearsal_actions.py, shipped in the maintenance zip through the governed
    code-deploy channel (Decision 249) and run only on ephemeral functions created from that CI-published zip. It
    refuses on the production maintenance function.
  event: "{action: restore_rehearsal, step, confirm, run_id, plus the step's fields below}"
  steps:
    restore: >-
      Downloads the dump to /tmp from the presigned URL in its event (never logged or returned), creates schema
      ducklake_ops as the target role (a schema-filtered restore does not create it), runs pg_restore
      --schema=ducklake_ops --no-owner --no-acl --exit-on-error (no --clean) into the target, and returns restore_ms,
      ducklake_ops's max snapshot_id, absolute_paths (schema, table, data file and delete file rows with
      path_is_relative false), foreign_owned (relations not owned by the target role) and foreign_acl (ACL entries
      naming any other role), with those role names as foreign_acl_grantees (role names only, no secrets).
    rewrite: >-
      Sets the global data_path row (scope IS NULL) of ducklake_ops's ducklake_metadata to its scratch location and
      nothing else, refusing a value outside the scratch prefix. When absolute_paths is not 0 it changes nothing.
      Returns rewritten and rewrite_ms.
    verify: >-
      Returns missing_files (referenced data and delete files absent from the scratch copy), attach_ok (ATTACH
      READ_ONLY at the new data_path without OVERRIDE_DATA_PATH) and, per table at the restored snapshot, read_ok, row
      count and checksum (count(*) and sum(hash(t)) over whole rows, one expression for every step). A failed ATTACH
      or table read is recorded, not raised.
    prod_checksum: >-
      Checksum function only: ATTACH the PROD ops catalog READ_ONLY with the function's own catalog DSN and return the
      same per-table count and checksum AT (VERSION => the restored snapshot_id).
    duckdb_copy: >-
      Restore function only, after prod_checksum: ATTACH the target READ_ONLY, initialise a DuckDB-file DuckLake
      catalog in the function's /tmp, copy every ducklake_ops catalog table into it, then ATTACH both READ_ONLY at
      the scratch data_path and compare each table's count and checksum at the restored snapshot and at the median
      snapshot_id. Returns copy_ms, catalog_rows, file_bytes and per-table match booleans. The file is never
      uploaded or returned: column statistics can hold text fragments, so it dies with the function.
    write_probe: >-
      ATTACH the target at the new data_path, create rehearsal_probe.t and insert 100 rows (data inlining disabled), and
      return the new file's relative key, whether it exists under the scratch prefix, and ducklake_metadata.version.
    teardown_scratch: >-
      Restore function only, in teardown: delete every object under the run's scratch prefix and return the count; the
      bucket's lifecycle expires the noncurrent versions after 30 days.
  responses: >-
    Counts, checksums, snapshot ids, booleans, durations, table and role names, the catalog format version and
    relative keys only. Every error, the verb's own or any raised beneath
    it, returns only the step, the exception class and a value-free code (a SQLSTATE, pg_restore's exit status or an errno),
    never its message.

sitting:
  where: An ADMIN cloud session (agent_platform_admin present); no cloud container has TCP/5432 egress, so all SQL runs in the functions.
  actor: >-
    An ADMIN-container agent, only under the operator's explicit direction in that session (Decision 251), each
    admin-profile command acknowledged per protected-actions.yaml. Never self-directed or scheduled. Calls that need no
    admin grant run as agent_platform (--dev-profile). The orchestrator redacts before it prints or writes evidence;
    on a step error it prints only the step, error class and code.
  orchestrator: "bin/venv-python -m scripts.ducklake_neon_smoke_test --restore-rehearsal --run-id <run_id> --project-id <project_id> --profile agent_platform_admin --dev-profile agent_platform --evidence-out <file>"
  order:
    - {id: present, principal: none, rule: "--dry-run prints every admin mutation the run will make, in order; the operator's approve line names that list before the run."}
    - {id: teardown_handles, principal: "agent_platform_admin (Neon key read, function and branch lookups, catalog-dr URL); agent_platform (scratch listing)", rule: "Resolve every teardown handle before anything is created; stop if one cannot be resolved or if a rehearsal function, branch or scratch prefix is left from an earlier run. Teardown never deletes what this run did not create."}
    - {id: dump, principal: agent_platform_admin, rule: "One on-demand dump through the catalog-dr Function URL; record its size and wall time (Decision 88 egress)."}
    - {id: neon_target, principal: agent_platform_admin, rule: "Child branch, role and empty database, all restore_rehearsal_<run_id>, each call made only once the branch's operations have finished."}
    - {id: functions, principal: agent_platform_admin, rule: "Create maintenance-restore-rehearsal-ephemeral (maintenance-smoke role) and reader-restore-rehearsal-ephemeral (reader role), both on the production maintenance function's layers, from lambda-packages/<sha>/ducklake-maintenance.zip where <sha> is the commit last deployed to the production maintenance function (Decision 249); before any step, each function's CodeSha256 must equal the production function's, else stop."}
    - {id: copy_data, principal: agent_platform, rule: "Server-side copy ducklake/ into <scratch>/ducklake/ after the dump, once the target and functions exist; record objects, bytes, wall time."}
    - {id: steps, principal: agent_platform_admin, rule: "Invoke restore, rewrite, verify, prod_checksum, duckdb_copy, write_probe in that order. Immediately before the restore invoke, presign a GET on the dump object, valid 15 minutes, passed only in that event and never printed or written. A step error stops the run and goes to teardown. rewritten false, missing_files above 0, or attach_ok or any read_ok false also stops the run, which writes its evidence and goes to teardown."}
    - {id: probe_absent, principal: agent_platform, rule: "The probe's relative key is absent under ducklake/ (head-object 404)."}
    - {id: teardown, principal: "maintenance-smoke role via the restore function (scratch prefix); agent_platform_admin (functions, branch)", rule: "In finally, whatever failed; the scratch prefix is deleted before the functions, by the restore function's teardown_scratch or, if that cannot run, by agent_platform through the scratch key builder; record each in torn_down; a false is cleaned by hand at once."}
  version_recovery: >-
    Separate subcommand, run as agent_platform with S3 calls only: put a scratch object under <scratch>/versioning/,
    delete it, list its versions, copy the noncurrent version back, read it and compare sha256, then delete it.

consistency_rule: >-
  Dump first, then copy. DuckLake data files are immutable and gc removes them only after FILE_CLEANUP_GRACE_DAYS, so a
  copy finished within that window after the dump holds every file the dump references; verify proves it
  (missing_files 0). Files written after the dump are harmless orphans in the copy. For SIT replication the same rule
  reads: the dump must postdate replication of every object it references, checked the same way.

evidence:
  schema_version: 1
  keys: [run_id, measured_at, maintenance_zip_sha256, dump_bytes, dump_ms, copy_objects, copy_bytes, copy_ms,
    restore_ms, rewrite_ms, restore_ok, restore_exit_status, rewritten, attach_ok, host_limit, meta_schemas,
    snapshot_ids, absolute_paths, foreign_owned, foreign_acl, foreign_acl_grantees, missing_files, ops_tables,
    write_probe_key, write_probe_in_scratch, write_probe_in_production, catalog_format_version, prefix_sizes,
    duckdb_copy_ms, duckdb_catalog_rows, duckdb_file_bytes, duckdb_copy_tables, torn_down]
  version_recovery_keys: [run_id, measured_at, object_under_versioning_prefix, noncurrent_versions, sha256_match, deleted_after]
  ops_tables: one row per table with read_ok, restored_count, restored_checksum, prod_count, prod_checksum.
  forbidden: >-
    any host, DSN, password, bucket name, account id, ARN, presigned URL or its credential parts (access key id,
    session token, signature); the verifier refuses a file that carries one.

exit_criteria:
  restored: "restore returned ok (restore_ok true); foreign_owned 0 and foreign_acl 0."
  rewritten: "rewritten true, absolute_paths 0 and attach_ok true."
  complete: "missing_files 0 and every ops table read_ok true."
  faithful: "every ops table's restored_count and restored_checksum equal prod_count and prod_checksum."
  one_way_writes: "write_probe_in_scratch true and write_probe_in_production false."
  measured: "dump, copy, restore and rewrite timings, dump_bytes and prefix_sizes present."
  format: "catalog_format_version recorded; the candidate-engine leg is rec-5036."
  file_catalog: "Evidence toward Decision 214 cl.5 only, not its version-copy restore drill. Reported, not gating: every duckdb_copy_tables row matches at both snapshots; the verifier prints DUCKDB_COPY_OK or names each mismatch."
  torn_down: "every torn_down flag true."
  version_recovery: "Its own evidence file: object_under_versioning_prefix true, noncurrent_versions at least 1, sha256_match true and deleted_after true."
  verifier: "bin/venv-python -m scripts.ducklake_smoke.restore_rehearsal verify-evidence <file> prints RESTORE_REHEARSAL_OK, or VERSION_RECOVERY_OK for a version_recovery file, or names each failed criterion and exits 1."
  result_rule: >-
    A run that completes, or stops on rewritten false, missing files or a failed ATTACH or table read, is a result:
    its evidence is committed as it stands, a failed criterion in it is the spike's answer, and that sends SIT to its
    fallback (rec-5024 decides). Any other step error or stop is a mechanical failure: fix it and
    run the sitting again, except as follows. pg_restore is the claim under test: if it exits non-zero again
    in the sitting after one fix, that run is a result with restore_ok false and pg_restore's exit status. A stop at
    a Lambda limit (the function timing out, or ENOSPC on /tmp) is a result recorded as host_limit with the step and
    limit: it shows this harness's limit, not that restore fails, so rec-5024 weighs it rather than taking the
    fallback.
