patterns:
  secret_value_out_of_band: >-  # pragma: allowlist secret -- describes a pattern, not a credential
    Terraform manages only the aws_secretsmanager_secret ENVELOPE (name, description, tags,
    rotation metadata); key material is set out-of-band via `aws secretsmanager put-secret-value`
    (CLI, human-run) and never enters Terraform state. This is the DEFAULT for every credential
    domain this contract governs unless a resource is a declared exception below. Secret tag
    values use the ASCII tag charset only -- no parentheses (a prior Purpose-tag parenthesis broke
    TagResource; see terraform/personal/inference_credentials.tf).
  secret_parameter_out_of_band: >-  # pragma: allowlist secret -- describes a pattern, not a credential
    An SSM secret parameter (/secret/<name>, Decision 237) is not Terraform-managed: the operator creates it with a
    value (put-parameter, SecureString, aws/ssm key) and Terraform holds only its name and the ARN it builds for
    grants, so the value never enters state, a plan file or a refresh. A SecureString aws_ssm_parameter resource is
    allowed only as a value_exceptions entry.
  runtime_fetch: >-
    Consumers (Lambdas, scripts, the smoke test) fetch secret material from Secrets Manager or SSM Parameter
    Store AT RUNTIME via the AWS SDK or CLI -- never via a Terraform output embedding the value, and never via a
    process environment variable populated from Terraform. The envelope's ARN or the parameter's name is the only
    Terraform-exported artefact; resolving it to a value is a runtime GetSecretValue or GetParameter call.
  provider_credential_ephemeral_input: >-
    Terraform receives a provider credential only as an ephemeral = true input variable. Trusted sessions fetch it at run time and pass it as TF_VAR_* to the one terraform process; The PR-time plan runs in main's trusted workflow (Decision 238) and receives the key the same way. The value is never in the tfvars secret, state, a saved plan, a file, GITHUB_ENV, or a PR. This is the Terraform-consumer counterpart of runtime_fetch.
  domains:
    - "inference API keys -- terraform/personal/inference_credentials.tf (CD.28 / T0.4)"
    - "DuckLake Neon catalog DSN -- terraform/personal/neon_ducklake_catalog.tf (CD.34)"
    - "Neon provider API key -- terraform/personal/providers.tf (ephemeral input variable neon_api_key; value out of band in the /secret/neon-api-key SSM parameter; never in state or saved plans)"
    - "CI/OIDC grants -- terraform/bootstrap/github_ci_apply_reads.tf"
    - "SSM secret parameters -- terraform/personal (names), values out of band (Decision 237)"
    - "terraform-personal tfvars -- the /secret/agent-platform-terraform-personal-tfvars SSM parameter (out of band, never Terraform-managed)"

value_exceptions:
  - resource: "aws_secretsmanager_secret_version.ducklake_neon_catalog_dsn"
    file: terraform/personal/neon_ducklake_catalog.tf
    reason: >-
      The Neon provider generates the database role password INSIDE Terraform (neon_role /
      neon_database resources); the DSN value does not exist before apply, so there is no
      out-of-band alternative. IN-BAND by construction, not a policy exception (CD.34).
  - resource: "aws_ssm_parameter.ducklake_neon_catalog_dsn"
    file: terraform/personal/neon_ducklake_catalog.tf
    reason: >-
      The same in-band DSN as aws_secretsmanager_secret_version.ducklake_neon_catalog_dsn, held as an SSM
      SecureString (Decision 237 cl.3) until that secret is retired. IN-BAND by construction (CD.34).

governance_notes: >-
  Class D mechanism contract (contract-population.yaml shape_grammar); no top-level `fields:` or
  `verbs:` key -- value_exceptions and domains are plain lists, not Class A/B field descriptors.
  The evaluator is credential-free (pure terraform-text + this contract's own YAML), eligible for
  --pre. This contract does NOT govern the IAM-VERB plane (Decision 157).
  The IAM-verb rule for /secret/ parameters is Decision 237 cl.2, enforced by
  validate_secret_parameter_grants; like Decision 157 it is not this contract's plane.
