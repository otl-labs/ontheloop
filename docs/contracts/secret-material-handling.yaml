# VALUE-MATERIAL plane for Secrets Manager and SSM SecureString credentials (T2.56 migration step 7, finding CFG-10;
# PLAN-decision-37-migrate-then-rehome). Rehoming destination for Decision 37's two still-live
# derived patterns (SECRET-VALUE-OUT-OF-BAND, RUNTIME-FETCH), minted via Decision 175's
# migrate_then_rehome branch (docs/contracts/decision-entry.yaml compaction.procedure) because
# Decision 37's superseder (Decision 116, scheduled-agent provider routing) restates neither
# pattern. Decision 37 itself is now a compacted stub pointing here and at Decision 116.
#
# ADJACENT PLANE (Decision 157): this contract governs WHICH SECRETS MANAGER ACTIONS TOUCH VALUE
# MATERIAL and how that material enters/leaves Terraform state -- the VALUE-MATERIAL plane.
# Decision 157 governs the IAM-VERB plane (which IAM actions are value-capable vs metadata-only,
# and which prefix an IAM statement may ride). The two are complementary, never overlapping: a
# reader must not conflate "does this write/read VALUE material" (here) with "which IAM verb class
# does that require" (Decision 157).
#
# PUBLIC REPOSITORY (Decision 101): this file names no AWS account ID, ARN, or ExternalId --
# resource identifiers below are Terraform-local names and Secrets Manager resource NAMES
# (public, non-secret strings), never account-scoped ARNs.
contract:
  id: secret-material-handling
  class: D
  contract_version: 1
  status: provisional_v0
  description: >-
    The VALUE-MATERIAL plane for credentials held in AWS Secrets Manager and SSM SecureString
    parameters: names the SECRET-VALUE-OUT-OF-BAND and RUNTIME-FETCH patterns and the closed set of declared
    exceptions where a secret's value legitimately enters Terraform state. validate_secret_material_handling
    reads value_exceptions below (never hardcoded resource names) to flag any undeclared
    aws_secretsmanager_secret_version or SecureString aws_ssm_parameter RESOURCE, and any data-source read of a secret, in the terraform tree.
  subject: secret-material-handling
  evaluator:
    check: validate_secret_material_handling
  provisional_v0:
    authored_at: "2026-08-24"
    authored_via: "PLAN-decision-37-migrate-then-rehome"
    rationale: >-
      First exercise of the migrate_then_rehome branch; the value_exceptions shape has been tested
      only against this repository's own terraform tree (five credential domains, two live
      exceptions), not against a second repository or a third exception case. provisional_v0 lets
      the shape settle before treating it as stable.
    re_ratification_trigger:
      first_of:
        - "value_exceptions entries count >= 5"
        - "days_since_authored_at >= 90"
    re_ratification_owner: "human + plan-critique gate"

