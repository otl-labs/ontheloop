---
# Class C cross-system invariant: the telemetry session correlation id.
# Ratified under the CD.25 pre-codegen contract ratification ritual (tier_item T0.12.7).
# Re-grounded to the write-boundary derivation model at contract_version 2 (Decision 199,
# amending Decision 97 clause 4).
#
# Telemetry Class A contracts $ref into contract.fields.session_id.
contract:
  id: session-id
  class: C
  contract_version: 2
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 199)"
  description: >-
    Canonical cross-system session correlation identifier, derived at the write boundary from a
    caller-supplied session_ref (Decision 199, event-journal re-model). The joining key across
    the canonical four-table telemetry trace/observation model (telemetry_sessions /
    telemetry_observations / telemetry_transcripts / telemetry_agents, Decision 95).
fields:
  session_id:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Session correlation id: Crockford-base32 ULID = ULID(48-bit ROOT session_started_at ms + the
      first 80 bits of H computed over the caller-supplied session_ref with domain tag
      'telemetry_sessions:session_id'), per telemetry-event-envelope.yaml's identity spec.
      Correlates all rows emitted within one session. Primary key of telemetry_sessions; foreign
      key on telemetry_observations, telemetry_transcripts, and telemetry_agents. Distinct from any
      external CLI's own `session_id`, which is not this telemetry session.
    semantics: >-
      DERIVED at the write boundary from session_ref, not mint-once-and-propagate: a child row
      references its session via the SAME domain-tag computation, so no propagation step can drift.
      The retired UUID4 grandfather (Decision 97 cl.4, original) is gone: no producer mints a
      session id, the UUID4 minter was retired rather than migrated (rec-4589). A sub-agent session's session_ref is '<sessionId>:<agentId>' (the parent
      CLI session id plus a deterministic per-agent id, stable across re-parse); its session_id
      still carries the ROOT session's own session_started_at, so a whole trace tree -- root plus
      every sub-agent session -- clusters in one calendar-day partition. The Class C baseline nullability
      is the LOOSEST common value so per-table contracts TIGHTEN via dq_intent_local without
      violating Invariant 5. Per-table nullability in the canonical four-table model: REQUIRED
      (not_null declared) in telemetry_sessions (PK), telemetry_observations (FK root),
      telemetry_transcripts (FK root), and telemetry_agents (FK root).
    populated_by: >-
      the write boundary (rec-4024's append_events verb), derived from the caller-supplied
      session_ref.
    write_time_validation: >-
      Structural, not central: PK-required in telemetry_sessions; foreign key in the
      child tables. ULID format and value are generator-guaranteed (no separate validator).
    dq_intent: {}
    governance_notes: >-
      Loosest baseline (no not_null leg) by design: the owning/required tables
      (telemetry_sessions PK, telemetry_observations, telemetry_transcripts, telemetry_agents -- the
      Decision 95 four-table model) tighten to a declared not_null via dq_intent_local.
      ops_execution_plans (T2.26 c9) consumes session_id via its planning_session_id
      column (opaque-VARCHAR carry, not a renamed session_id column) -- a soft/unenforced FK; its
      dangling-reference tolerance note keeps rec-4030 as the owner of re-grounding
      planning_session_id on the Decision 199 derivation, not merely "until telemetry (T2.36) lands".
    amendment_log:
      - {date: "2026-10-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-retire-session-cli (rec-4589): the claim that a live producer still mints a bare UUID4 pending rec-4030 is withdrawn; the minter was retired rather than migrated, so no producer mints a session id and rec-4030 keeps only the re-grounding of planning_session_id.", migration_story: "Prose only: the derivation and every declared rule are unchanged; the 2026-09-24 entry is history and is not edited."}
      - date: "2026-10-15"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-rule-declarations-and-writer-conformance (rec-4158): the semantics text names the retired enforced flag no
          longer; it says not_null is declared (true) via dq_intent_local. Meaning unchanged.
        migration_story: >-
          Prose only: the declared rule set is identical before and after.
      - date: "2026-09-25"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-telemetry-kernel-identity-append (rec-4065): semantics reworded from "clusters in
          one day() partition" to "clusters in one calendar-day partition" -- DuckLake evaluates a
          bare day() as day-of-month, not calendar day. Decision 199 always meant a calendar day.
      - date: "2026-09-24"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199, amending 97 cl.4): replaced the
          UUID4-grandfathered mint-once scheme with write-boundary derivation from a
          caller-supplied session_ref; named the live legacy producer
          (scripts/session/preflight.py open_telemetry_session) as pending migration rec-4030
          rather than an accepted second live format. semantic_break=true: the derivation MECHANISM
          changed, not merely the prose.
        migration_story: >-
          The live producer keeps minting bare UUID4 until rec-4030 lands; this contract now states
          that as an OPEN gap (pending rec-4030) rather than an accepted grandfather, so the
          discrepancy stays visible instead of silently tolerated.
      - date: "2026-09-22"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-t2-26-retire-ops-session-log (T2.26): removed the dormant ops_session_log carrier
          reference from the contract description and this field's governance_notes -- the table
          was retired (CD.40), never provisioned in the personal account. No field, type, or
          nullability change; the Decision 95 four-table telemetry model remains the sole live
          carrier of session_id.
      - date: "2026-08-26"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          Platform cleanse: wording referencing removed product surfaces or the retired
          legacy query engine trimmed; field meaning unchanged.
      - date: "2026-06-24"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          T0.12.6 additive amendment: re-ground the stale six-table star-schema description to the
          canonical four-table trace/observation model (telemetry_sessions / telemetry_observations /
          telemetry_transcripts / telemetry_agents), per Decision 95. Per-table nullability list and the
          joins_using_this_key entries re-grounded (telemetry_phases/_steps/_process_events/_model_calls
          collapsed into telemetry_observations; rootless telemetry_agent_invocations replaced by the
          rooted telemetry_agents).
        migration_story: >-
          Prose-only: no field, type, format, or nullability change to the session_id column. Only the
          contract's description of WHICH telemetry tables consume session_id is corrected from the draft
          seven-table model to the ratified four-table model. semantic_break=false.
      - date: "2026-06-24"
        semantic_break: false
        change_class: governance_note_add
        summary: >-
          T0.12.6 additive amendment: record ULID as the canonical TARGET format for session_id
          (Decision 97 cl.4); the live UUID4 format is grandfathered until open_session is migrated.
        migration_story: >-
          Governance note only: NO format flip in this contract. type stays str; the live format stays
          UUID4. The note forward-declares the ULID target so the per-table telemetry contracts and the
          future open_session migration ratify to one identity standard. semantic_break=false.
joins_using_this_key:
  # Landed in docs/contracts/_joins.yaml by T0.12.6 (the telemetry Class A contracts ratified in the
  # same wave). _phases collapsed into _observations (Decision 95 collapse rule).
  - session_id_join_telemetry_sessions_to_observations
  - session_id_join_telemetry_sessions_to_transcripts
  - session_id_join_telemetry_sessions_to_agents
  # Landed at T2.26 (c9): ops_execution_plans consumes session_id via its planning_session_id column
  # (opaque-VARCHAR soft-FK; the value is the executor CLI's opaque session id; rec-4030 owns its re-grounding).
  - planning_session_id_join_execution_plans_to_sessions
governance_notes: >-
  Single-hop leaf invariant (no chained $ref; Class C contracts are leaf nodes,
  Invariant 5). The telemetry Class A contracts (T0.12.6, re-grounded at Decision 199) reference
  contract.fields.session_id; the cross-contract join entries are recorded in
  docs/contracts/_joins.yaml. The normative derivation formula lives ONCE in
  telemetry-event-envelope.yaml; this contract states its own domain tag and defers to that spec.
amendment_log:
  - date: "2026-09-25"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-telemetry-kernel-identity-append (rec-4065): accompanies the field-level
      amendment_log entry above (CD.25 category-6 gate) for the day()-partition to
      calendar-day-partition rewording. No field, type, or nullability change.
  - date: "2026-09-24"
    semantic_break: true
    change_class: governance_note_add
    summary: >-
      PLAN-telemetry-event-journal-contracts (Decision 199): contract-level description re-grounded
      to the write-boundary derivation model. Accompanies the field-level amendment_log entry above
      (CD.25 category-6 gate). semantic_break=true, mirroring the field-level entry.
    migration_story: Prose-only at the contract-description level; no runtime behaviour changes.
  - date: "2026-09-22"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-t2-26-retire-ops-session-log (T2.26): re-grounded contract.description to drop the
      retired ops_session_log carrier reference (CD.40: the table was never provisioned in the
      personal account). This document-level entry accompanies the contract.description change
      (CD.25 category-6 gate); it mirrors the field-level prose_improvement on
      fields.session_id.amendment_log.
    migration_story: >-
      Prose-only: no field, type, format, or contract_version change. semantic_break=false.
  - date: "2026-08-26"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      Platform cleanse: references to the removed trading-product surfaces and the retired
      pre-DuckLake query-engine estate were removed or reworded.
    migration_story: >-
      The repository became platform-only. Product surfaces (broker credentials, the product
      roadmap, the market-data pipeline) and the retired legacy query-engine path (staging
      outbox, ops compaction, legacy workgroup IAM) were deleted, and this contract's
      references to them were removed in the same change. No live DuckLake field or verb
      semantics changed.
  - date: "2026-06-24"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      T0.12.6: the contract-level description was re-grounded from the stale six-table star-schema list
      to the canonical four-table trace/observation model (Decision 95). This contract-level entry
      accompanies the contract.description change (CD.25 category-6 gate requires a document-level
      amendment_log entry for a contract-level description change); it mirrors the field-level
      prose_improvement on fields.session_id.amendment_log.
    migration_story: >-
      Prose-only: no field, type, format, or contract_version change. semantic_break=false.
  - date: "2026-10-15"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-rule-declarations-and-writer-conformance (rec-4158, Decision 210): the dq_intent `enforced` key is retired
      from every rule leg. not_null is declared by presence (`true`, or `{exclude_before: D}`); an optional column or a
      loosest-baseline field carries no not_null leg; the other legs lose the key. A declared rule is an enforced rule.
    migration_story: >-
      Declarations re-spelled only. No rule is added, removed or re-dated: the declared rule set, read through
      scripts.contract_rules, is identical before and after, and the generated field_semantics.yaml projection of
      this contract is unchanged.
previous_versions:
  - contract_version: 1
    ratified_at: "2026-06-19"
    ratified_via: "Step 10 multi-perspective critique + PLAN-class-c-cross-system-invariants merge to main"
    superseded_on: "2026-09-24"
    summary: >-
      UUID4-minted-once-at-open_session session_id, ULID as a forward-declared target format
      grandfathering the live UUID4 (Decision 97 cl.4, original). Superseded by write-boundary
      derivation from a caller-supplied session_ref (Decision 199); the live UUID4 minter's own
      migration is tracked as pending rec-4030.
