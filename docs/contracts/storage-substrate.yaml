tables:
  # ---------------------------------------------------------------------------
  # Dormant DuckLake ops tables (schema-ready; not yet live-exercised)
  # ---------------------------------------------------------------------------
  ops_priority_queue:
    substrate: DuckLake-on-Neon
    status: dormant
    reason: executor paused (CD.17); current-state is the Decision-70 latest-queue_run set
    write_boundary: >-
      ducklake_writer Lambda (action_write_ops) -- when executor resumes. DORMANT: write_ops, file_ops and update_ops refuse
      this table (400 naming dormant) until docs/contracts/ops_priority_queue.yaml lands and its row rules project into
      field_semantics.yaml (owner T4.3 c6, Decision 210 cl.4); create_ops_tables still provisions it.
    read_boundary: ducklake_reader Lambda (NAMED VERBS only)
    merge_key: rec_id
    grain: one row per rec_id
    write_mode: scd2
    field_semantics: config/lambda/ducklake/field_semantics.yaml#ops_tables.ops_priority_queue
    read_engine_ref: docs/contracts/read-engine.yaml
    graduation_blocker: CD.17 reversal + executor resume

  ops_execution_plans:
    substrate: DuckLake-on-Neon
    status: live
    reason: >-
      T2.26 (c9): created fresh on the DuckLake closed writer/reader boundary -- no predecessor table
      ever existed for it in the personal account. The executor producer stays CD.17-frozen so the
      table lands empty until resume.
    write_boundary: >-
      ducklake_writer Lambda (action_write_ops, via scripts/ops_portal/execution_plans.py). DORMANT: write_ops, file_ops and
      update_ops refuse this table (400 naming dormant) until docs/contracts/ops_execution_plans.yaml lands and its row rules
      project into field_semantics.yaml (owner T4.5 c2, Decision 210 cl.4); create_ops_tables still provisions it.
    read_boundary: ducklake_reader Lambda (NAMED VERBS + dq_check)
    merge_key: rec_id
    grain: one row per plan revision (rec_id, revision); current = latest revision per rec_id
    write_mode: scd2
    field_semantics: config/lambda/ducklake/field_semantics.yaml#ops_tables.ops_execution_plans
    read_engine_ref: docs/contracts/read-engine.yaml
    graduation_blocker: CD.17 reversal + executor resume (table lands empty until then)

  # ---------------------------------------------------------------------------
  # DuckLake control-class table (T2.26 control-table-class-and-counter-conformance): writer-
  # internal bookkeeping, never an application table. See docs/contracts/ops_entity_counters.yaml
  # (Class A contract) and data-modeling-standard.yaml write_modes.control for the full invariant
  # set.
  # ---------------------------------------------------------------------------
  ops_entity_counters:
    substrate: DuckLake-on-Neon
    status: live
    reason: >-
      T2.26: the writer-owned entity-id allocation counter (Decision 84 I-2), registered and
      partitioned for the first time -- previously an ungoverned ad-hoc table (3,418 unpartitioned
      live files for ONE row, measured 2026-09-12).
    write_boundary: >-
      ducklake_writer Lambda, writer_internal ONLY -- create_ops_tables provisioning plus the
      writer's own in-transaction allocate/advance calls; NOT reachable through
      write_ops/file_ops/update_ops (ducklake_scd2_schema.resolve_table_spec refuses it). In the
      isolated ducklake_smoke catalog the telemetry writer function also takes a registration lock
      and seeds the ops_tenants / ops_projects rows (provision_telemetry).
    read_boundary: >-
      none -- writer-owned, in-transaction only. Periodic health assertion via the admin
      ducklake_maintenance control_health verb (maintenance_binding below); not an application
      read path (never reachable through dq_check/named_read/read_ops_current/read_ops_history).
    merge_key: counter_name
    grain: one row per writer-keyspace ops table (id_keyspace=writer; today ops_recommendations only)
    write_mode: control
    field_semantics: config/lambda/ducklake/field_semantics.yaml#ops_tables.ops_entity_counters
    maintenance_binding: control_health (ducklake_maintenance, every 6h)
    dq_scope: exempt -- see docs/contracts/ops_entity_counters.yaml's dq_scope rationale

  # ---------------------------------------------------------------------------
  # DuckLake append-only tables (event-journal write mode, T1.14)
  # ---------------------------------------------------------------------------
  ops_smoke_events:
    substrate: DuckLake-on-Neon
    status: smoke
    write_mode: append_only
    write_mode_invariant: "history table only; no current write-through projection (ScdTableSpec.current_table=None)"
    write_boundary: ducklake_writer Lambda (action_write_ops) -- append events only; require_exists=True illegal
    read_boundary: direct DuckDB ATTACH (ops_smoke_events_history) -- no reader Lambda verb for current
    merge_key: event_id
    grain: one row per event_id
    field_semantics: config/lambda/ducklake/field_semantics.yaml#ops_tables.ops_smoke_events
    note: platform-generic append_only kernel proof (T1.14); no current_table in ScdTableSpec

  # ---------------------------------------------------------------------------
  # smoke-harness pair (Decision 191 amendment, PLAN-ducklake-smoke-harness-classification,
  # rec-3864): production-resident, load-bearing for the deploy smoke gate. status: transitional
  # -- never `status: smoke`, which this contract's vocabulary companion
  # (data-modeling-standard.yaml's vocabulary block) reserves for a production ops table's
  # lifecycle tag (e.g. ops_smoke_events), not for catalog residency.
  # ---------------------------------------------------------------------------
  ducklake_smoke_harness_pair:
    substrate: DuckLake-on-Neon
    status: transitional
    physical_tables: [ducklake_smoke_history, ducklake_smoke_current]
    reason: >-
      rec-3864: physically resident inside the PRODUCTION ducklake_ops catalog (proven by the
      2026-09-17 gc_ops dry_run enumeration) even though field_semantics declares it under the
      `tables:` block, historically shared with the isolated ducklake_smoke CI kernel-proof
      catalog. Classified maintenance class smoke_harness (Decision 191 amendment) so a scheduled
      merge_ops pass no longer fails closed on it. Move-out of production is follow-on rec-4116.
    write_boundary: >-
      ducklake_writer Lambda's smoke actions (src/lambdas/ducklake_writer/smoke_actions.py) --
      operator-run EC (existence-check) probes force_recreate the pair from its declared spec via
      create_scd2_tables(table=None); never the generic write_ops/file_ops/update_ops verbs.
    read_boundary: >-
      ducklake_reader Lambda's read_current(table=None) -- deploy-ducklake-lambdas.yml's smoke job
      (scripts/ducklake_smoke/lambda_ec_gates.py --lambda-reader) reads production
      ducklake_smoke_current and requires row_count >= 1 before promoting a deploy; a DROP turns
      every deploy red.
    catalog_residency: ducklake_ops (production, load-bearing) AND ducklake_smoke (isolated CI harness)
    merge_key: rec_id
    grain: one row per logical smoke write attempt (history) / one row per rec_id (current)
    write_mode: scd2
    field_semantics: config/lambda/ducklake/field_semantics.yaml#tables
    maintenance_binding: >-
      maintenance class smoke_harness (src/common/ducklake_maintenance_scope.py) -- merge_ops
      apply=true; reconcile_partitions/rewrite_partition_layout apply=false (report-only, owned by
      create_scd2_tables force_recreate, never ALTERed or re-laid).
    graduation_blocker: follow-on rec-4116 (move the pair out of the production catalog)

  # ---------------------------------------------------------------------------
  # Telemetry tables -- canonical 4-table trace/observation model (Decision 95);
  # created in ducklake_telemetry, not yet written (Decision 84).
  # ---------------------------------------------------------------------------
  telemetry_tables:
    note: >-
      CANONICAL model (Decision 95, re-grounded to the event-journal shape by Decision 199): four
      tables -- telemetry_sessions, telemetry_observations, telemetry_transcripts, telemetry_agents --
      each with a ratified Class A contract at contract_version 2 (those four are indexed in the
      "Class A contracts (authoritative)" header above, NOT in this substrate table), $ref-ing the
      shared telemetry-event-envelope.yaml (Class C). The legacy draft schema and its emitters were deleted with the retired query-engine estate.
      The four tables are created and owned in the production telemetry catalog ducklake_telemetry (Decision 230,
      provision_telemetry_catalog) and written there by the production telemetry writer since the 2026-10-27 flip
      (PLAN-telemetry-production-flip, T2.36). They are also created in the
      isolated ducklake_smoke catalog, under the owner login by ducklake_maintenance_smoke's create_telemetry_tables
      (Decision 216), and verified and seeded by the telemetry writer's provision_telemetry.
    substrate: DuckLake-on-Neon (target state)
    status: live
    reason: >-
      Legacy draft schema and emitters deleted; the production writer appends to ducklake_telemetry since the 2026-10-27
      flip, and the disposable smoke canary keeps its own catalog (create_telemetry_tables, Decision 216). Status live is
      this contract's word for production rows written and served; field_semantics' vocabulary is rec-4483's.
    write_boundary: >-
      agent-platform-ducklake-telemetry-writer Lambda (Decision 213) -- provisioning, registration and the
      append_telemetry and begin_blobs verbs (inline rows and claim-check blobs) on ducklake_telemetry in production since the
      2026-10-27 flip, and on ducklake_smoke for the disposable canary. Never the shared ducklake_writer.
    read_boundary: >-
      agent-platform-ducklake-telemetry-reader (event verbs, no content, ducklake_telemetry_reader.yaml) and
      agent-platform-ducklake-telemetry-content (masked content only, Decision 239, ducklake_telemetry_content_reader.yaml;
      deployed by rec-4696). Never the shared ducklake_reader.
    contract_ref:
      - docs/contracts/telemetry_sessions.yaml
      - docs/contracts/telemetry_observations.yaml
      - docs/contracts/telemetry_transcripts.yaml
      - docs/contracts/telemetry_agents.yaml
      - docs/contracts/telemetry-event-envelope.yaml
    migration_ref: "tier_item T2.36 (complete 2026-10-29) + Decisions 95/96/97/199/200/239"
    disposition: >-
      Phase 4 consolidation (after T2.26): rebuild on the DuckLake telemetry substrate as the canonical
      EVENT-JOURNAL model per the Class A contracts (append-only, one row per lifecycle event);
      calendar-day partition year(session_started_at), month(session_started_at), day(session_started_at)
      for all four tables (Decision 199, realized at Phase 4 using
      the DuckLake partition-as-code mechanism T2.33 established for the ops tables); identity
      derived at the write boundary per telemetry-event-envelope.yaml's normative hash spec (Decision
      199, superseding Decision 97's mint-once rule); large payloads route through the content blob
      port (S3 cloud adapter / local-directory free-tier adapter, Decision 184 cl.2) by the claim-check route
      (telemetry-blobs/<meta_schema>/, writer-issued begin_blobs grants, writer HEAD-verify), inline for
      payloads <= 64 KiB.
    canonical_tables:
      - telemetry_sessions
      - telemetry_observations
      - telemetry_transcripts
      - telemetry_agents
    ingestion_shape:
      shape: per_request_commit
      rec: rec-4218
      basis: >-
        Smoke 2026-10-15..18: append_telemetry 181-502 requests a day, OccRetryCount never above 1 per request, CommitLatencyMs
        p50 572-855 ms, 4 data files per commit, never compacted; the 7-day figures are in
        /mnt/project-files/telemetry-slice2c/MEASUREMENT.md (counts only).
      rejected_alternatives:
        - "an S3 landing zone is staging under Decision 84 I-4"
        - "inlining stays off (Decision 107)"
      reversal_triggers:
        - {id: files_per_day, threshold: "data files a day on ducklake_telemetry above merge_ops' measured fold rate (MetaSchema=ducklake_telemetry MergeOpsFilesAfterTotal)", alternative_then: "producer batching, or inlining with a scheduled flush, never staging"}
        - {id: merge_pass_duration, threshold: "a telemetry merge_ops pass above 450 s (half its 900 s timeout), watched by the ducklake-telemetry-merge-duration alarm on MetaSchema=ducklake_telemetry MergeOpsDurationMs (it excludes the pass's ATTACH, about 21 s at p95; accepted)", alternative_then: "producer batching, or inlining with a scheduled flush, never staging"}
        - {id: stats_rows_growth, threshold: "ducklake_file_column_stats rows for ducklake_telemetry (MetaSchema=ducklake_telemetry CatalogFileColumnStatsRows) growing week over week for three weeks despite merge, counting only weeks starting at least 37 days (SNAPSHOT_RETAIN_DAYS + 7) after the first production event row, because superseded files' stats rows rise by construction through the retention ramp", alternative_then: "producer batching, or inlining with a scheduled flush, never staging"}
      writer_sizing:
        reserved_concurrency: 5
        connection_limit: 10
        resize_when: "Throttles > 0 or OccRetryCount p95 >= 2 over 7 days (MetaSchema=ducklake_telemetry series)"
    production_column_set:
      plan: PLAN-telemetry-production-catalog
      rule: >-
        ducklake_telemetry is created with the current typed column set of every telemetry table, every telemetry_observations
        model_call column included (cache_creation_1h_tokens and cache_creation_5m_tokens are typed by Decision 222). A later
        column reaches production only through the owner-login provision_telemetry_catalog re-run (Decision 222 cl.3); rec-4316's
        CI migrator is not designed here. Until that re-run's response lists the column under added, the column stays in its
        table's pending_reconcile (config/lambda/ducklake/field_semantics.static.yaml, reconcile_scope telemetry_catalog): the
        merge-time reconcile-pending gate fails a column added without that entry, and the governed deploy holds the production
        telemetry writer and reader (validate_reconcile_pending_gate --telemetry-hold), because the writer's MERGE names every
        declared column.
      typed_by_decision_222: [cache_creation_1h_tokens, cache_creation_5m_tokens]
      metadata_only: [prefix_hash]
      metadata_only_until: "a verb proves the query"
