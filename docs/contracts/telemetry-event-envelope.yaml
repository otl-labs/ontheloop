---
# Class C cross-system invariant: the shared telemetry event/identity envelope.
# Ratified as part of the telemetry event-journal re-model (Decision 199).
#
# Every telemetry Class A contract (telemetry_sessions, telemetry_observations,
# telemetry_transcripts, telemetry_agents) $refs EVERY field on this contract once, so the
# event-journal shape (event_kind discriminator, source-derived timestamps, the normative
# identity hash spec) is stated HERE ONCE and never re-derived per table (DRY; keeps every
# telemetry contract under the 500-effective-line structural cap, config/structural_size_budgets.yaml
# contracts class). tenant_id and project_id are their OWN Class C contracts (tenant-id.yaml,
# project-id.yaml) -- referenced alongside this envelope by every telemetry table, not folded in
# here, because they are cross-system identity concepts with their own SCD2-dimension future (rec-4024),
# not event-shaped fields.
contract:
  id: telemetry-event-envelope
  class: C
  contract_version: 1
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 199)"
  description: >-
    Canonical shared event/identity envelope for the telemetry event-journal model (Decision 199,
    amending Decisions 95, 96 clauses 1 and 3, and 97 clauses 1-4). Defines the event/identity
    fields every telemetry table carries -- event_id, event_kind, event_timestamp,
    session_started_at, source_ordinal, external_ref, entity_ref, producer, producer_version,
    parser_version, created_timestamp -- and the normative write-boundary identity hash spec that
    derives entity/FK keys and event_id from caller-supplied refs, replacing the retired
    mint-once-and-propagate scheme (Decision 97 clauses 1-3, original).
fields:
  event_id:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      ULID identifying this one event row. Format: ULID(48-bit event_timestamp ms + the first 80
      bits of H computed over external_ref with domain tag '<table>:event'), per this contract's
      identity spec below. Not a business/entity key -- see entity_ref for the row's FK-shaped
      identity when the row is itself referenced by a child.
    semantics: >-
      DuckLake enforces no row uniqueness, so a duplicate event_id (same logical event re-emitted,
      e.g. by a parser re-run) is resolved READ-SIDE, never by an engine constraint. The grain is
      (producer, event_id, parser_version), enforced at the WRITE boundary per Decision 207
      (grain-enforced-at-write; a conflicting re-send under the same grain key is rejected loudly,
      never silently dropped) -- see governance_notes' GENERATIONS AND READ-SIDE DEDUPE rule for
      how a reader then selects the authoritative row across generations and producers.
    populated_by: the write boundary, from external_ref (rec-4024's append_events verb).
    dq_intent: {}
    amendment_log:
      - date: "2026-09-28"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-grain-and-generations (Decision 207): semantics reworded from the retired
          highest-version-then-oldest-write-time write-then-read-side dedupe wording to the
          write-boundary grain (producer, event_id, parser_version) enforced at write, pointing at
          the GENERATIONS AND READ-SIDE DEDUPE rule for read-side selection.
  event_kind:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      The table-local lifecycle/point discriminator for this row: open | resume | compact | close |
      annotate for telemetry_sessions; open | close for the span-shaped telemetry_observations
      kinds (phase, step, turn, tool_call) and telemetry_agents; point for the instantaneous
      telemetry_observations kinds (model_call, process_event) and every telemetry_transcripts row.
      Each telemetry table's Class A contract tightens the accepted set for its own grain via
      dq_intent_local.accepted_values.
    semantics: >-
      Distinguishes a lifecycle-boundary row (open/resume/compact/close/annotate) from an
      instantaneous fact row (point). A span-shaped entity's start/end/duration are DERIVED at read
      by pairing its open and close rows (see data-modeling-standard.yaml's derived-state rule) --
      never stored on either row.
    populated_by: the emitting producer, per its own event grammar.
    dq_intent: {}
  event_timestamp:
    type: datetime
    iceberg_type: timestamptz
    nullable: true
    description: >-
      The event-time column: the timestamp of the ORIGINATING record (source-derived), never the
      write time. UTC, tz-aware, parsed and truncated (not rounded) to millisecond precision.
    semantics: >-
      Write-enforced (Decision 210 cl.1): the writer rejects an event_timestamp earlier than the
      row's own session_started_at (in-row ordering; a producer whose event_timestamp and
      session_started_at come from different clocks, e.g. a transcript-less producer, declares a
      skew allowance when it lands, never an exact comparison) and one later than created_timestamp
      by more than 300 s (the skew bound this field always declared). Distinct from created_timestamp
      (write time) and from session_started_at (the partition basis, the ROOT session's own pin).
    populated_by: the emitting producer, decoded from its own source record.
    dq_intent:
      not_before: session_started_at
      max_after_write_seconds: 300
    amendment_log:
      - date: "2026-10-04"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-write-conformance (slice 2a-1, Decision 210): the skew bound declared here gained its
          value (300 s) and a write-time enforcer, and the in-row ordering rule not_before session_started_at is
          declared with its cross-clock-domain allowance.
        migration_story: No live populator exists; the kernel enforces both rules before any SQL from this slice.
  session_started_at:
    type: datetime
    iceberg_type: timestamptz
    nullable: true
    description: >-
      The ROOT session's start time: source-derived from the EARLIEST parseable record timestamp in the
      root transcript at pin time (the first capture pass), UTC, truncated to ms -- never a warehouse
      lookup, never re-derived downstream. For a forked or copied Claude Code session, only the records it wrote itself count (see external_ref).
      Every row of a root session AND all its sub-agent sessions carries this SAME value, so a
      whole trace tree lands in one calendar-day partition regardless of how deep the sub-agent
      nesting goes or how much wall-clock time a long-running root session spans.
    semantics: >-
      The partition basis for all four telemetry tables (governance.partition_by "year(session_started_at),
      month(session_started_at), day(session_started_at)" -- rec-4065: DuckLake's day() alone is
      DAY-OF-MONTH, not calendar day, so the triple is required), and the 48-bit time prefix of
      every entity/FK ULID this contract's identity spec derives (see below) -- so a session's
      whole trace tree, and every row's FK back to it, cluster in the same partition and sort
      together. DuckLake evaluates the partition functions in the session's own TimeZone setting,
      so the write boundary (append_events, rec-4024) requires an explicit UTC connection TimeZone
      before it writes -- never a caller-set or default zone. A producer that cannot read the root
      transcript DEFERS emission rather than guessing this value (e.g. from a locally-observed
      timestamp). A producer with no transcript at all (LiteLLM, CI annotate) receives
      session_started_at from another producer of the same tree ONLY as an integer epoch-millisecond
      value, or as a held entity/FK key of the tree (e.g. the root session_id) decoded with
      src/telemetry/identity.py decode_time_prefix -- never an event_id, whose 48-bit prefix is its
      OWN event_timestamp, not the root's session_started_at; never seconds, a float, or a
      re-serialised string. An unusable handoff (neither form, or a decode failure) DEFERS emission,
      never coerces. This ban is scoped to the producer-to-producer handoff only: both sanctioned
      forms decode to the same tz-aware UTC value and the stored column is unchanged (Decision 96
      clause 4). Separately, one obligation spans EVERY hop, producer-to-writer included:
      session_started_at always carries its full millisecond value (e.g. an RFC 3339 string with a
      3-digit fraction at the writer edge) -- the pinned RFC 3339 profile accepts a fraction-less
      value and would silently pad it to .000, losing precision the identity hash depends on;
      timestamps.parse_wire_timestamp rejects every width but three digits, and applying it at the
      writer edge is rec-4024's to build. The pin is the EARLIEST timestamp, never the first record
      in file order: SessionStart hook records are written after an earlier queue-operation record yet
      carry earlier timestamps (probe: up to 9.87 s earlier). It is pinned once per tree; a record
      appended later with a timestamp earlier than the persisted pin RE-PINS only while the cursor
      has emitted no row under that pin (its consumed prefix builds zero rows, so no row carries the
      old value); once any row is emitted under the pin, such a record is a producer HALT, never
      re-pinned and never emitted. For a forked or copied Claude Code session, records the fork did not write (forkedFrom, or before its own SessionStart:fork hook group) take no part in the pin: it is the earliest timestamp among the records the session wrote itself.
    populated_by: the emitting producer, pinned once per session at the earliest root-transcript timestamp of the session's own records.
    dq_intent: {}
    amendment_log:
      - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): rec-4149: for a forked or copied Claude Code session only the records it wrote itself count toward the pin."}
      - date: "2026-09-26"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          rec-4060 (contract-risk review of slice 1, PLAN-telemetry-contract-risk-amendments):
          named the two sanctioned producer-to-producer handoff forms for a transcript-less producer
          (integer epoch-ms, or a held entity/FK key decoded via decode_time_prefix), banned an
          event_id or a lossy seconds/float/re-serialised-string handoff, and required deferral on an
          unusable handoff. Added the every-hop millisecond-precision obligation (Decision 96 clause
          4: the stored column and its RFC 3339 profile are unchanged -- this is a precision
          requirement on the value supplied at each hop, not a new format). semantic_break=true: a
          producer that previously coerced or guessed this value must now defer.
        migration_story: >-
          No live populator exists yet (population is future-state, rec-4024), so no runtime
          migration is required.
      - date: "2026-10-04"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-write-conformance (slice 2a-1): the pin is the EARLIEST parseable record timestamp, not the
          first record in file order, with the re-pin-while-nothing-emitted carve-out and the producer halt after
          a row is emitted.
        migration_story: >-
          Re-keys any session whose earliest timestamp is not its first record in file order; safe only because no
          v1 row and no persisted cursor exists anywhere.
      - date: "2026-09-25"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-telemetry-kernel-identity-append (rec-4065): description/semantics reworded from
          "day(session_started_at) partition" to "calendar-day partition", quoting
          governance.partition_by as the calendar-day triple and noting DuckLake's day() alone is
          day-of-month; added that DuckLake evaluates partition functions in the session TimeZone,
          so the write boundary requires an explicit UTC connection. Decision 199 always meant a
          calendar day; no table exists yet.
  source_ordinal:
    type: int
    iceberg_type: bigint
    nullable: true
    description: >-
      Orders rows within a session independently of event_timestamp precision (e.g. the source
      record's index in the originating transcript). Ties in event_timestamp (sub-millisecond
      originating events) still sort deterministically on source_ordinal.
    semantics: A read-side ordering aid only; never part of any identity hash.
    populated_by: the emitting producer, from its own source record's position.
    dq_intent: {}
  external_ref:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      The producer-supplied natural reference for THIS event, grammar
      '<source_record_id>#<block_index>/<row_role>'. Unique within (tenant, project, table,
      producer) -- rescoped from (tenant, project, table): the model_call ref is shared across
      producers by design. The hash input for event_id. Not a caller-facing FK -- entity_ref is
      the field a row uses to participate as (or reference) an entity/FK key.
    semantics: >-
      For a model_call row specifically, external_ref is '<provider_response_id>/model_call' for
      EVERY producer that observes that response id, and is owned by the LAST source record
      carrying it (final usage numbers win) -- see entity_ref below for how model_call rows still
      de-duplicate to one row per API response despite each producer's event_id differing. A forked or copied Claude Code session's copied records keep their uuids and are the parent session's events, never the fork's: the claude_code producer (parser version 3) emits a fork's rows only for the records it wrote, recognising copies by forkedFrom or by their position before the fork's own SessionStart:fork hook group, so no ref is re-scoped (R10 untouched). If neither signal is present, the fork's first pass collides with its source in the same partition and halts loudly (Decision 207); a pass that ran before the fork's own SessionStart:fork record existed makes the next pass halt on its moved session pin.
    populated_by: the emitting producer.
    dq_intent: {}
    amendment_log:
      - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): rec-4149: a fork's copied records are the parent's events; the claude_code producer emits a fork's rows only for the records it wrote."}
      - date: "2026-09-28"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-grain-and-generations (Decision 207): description rescoped the
          uniqueness scope to add producer to the (tenant, project, table) tuple -- the model_call
          ref is shared across producers by design.
  entity_ref:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      The producer-supplied natural reference this row's own entity/FK key derives from (input to
      the identity hash H, below), OR the reference a row uses to point at another entity's key when
      that row is itself the FK holder. Per-row semantics are table- and event_kind-specific and
      recorded in governance_notes_local by each telemetry table (e.g. a tool_call row's entity_ref
      is its toolUseId; a turn row's is '<session entity_ref>/<promptId>'; an agents row's is the
      spawning tool_call's toolUseId).
    semantics: >-
      Because entity/FK keys are DERIVED (see the identity spec below) rather than mint-once and
      propagated, two producers independently computing a key from the SAME domain tag + tenant +
      project + entity_ref arrive at the identical ULID with no coordination -- this is what lets a
      child row's FK equal its parent's own key without the parent propagating anything.
    populated_by: the emitting producer.
    dq_intent: {}
  producer:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Canonical id of the emitting producer, e.g. claude_code (the transcript parser), litellm, or
      ci_annotate. Open set; part of the telemetry grain key (Decision 207); used both as
      provenance and, on model_call rows, as the fixed precedence tiebreaker in read-side dedupe
      (claude_code over litellm, R5c).
    semantics: >-
      Tightened NOT NULL by each telemetry table's dq_intent_local (R2). parser_version is
      comparable only between rows sharing producer -- versions from different producers are
      incomparable and never sort against each other.
    populated_by: the emitting producer, self-identifying.
    dq_intent: {}
    amendment_log:
      - date: "2026-09-28"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-grain-and-generations (Decision 207, rec-4061 R2): named producer as part
          of the telemetry grain key and pointed at the R5c model_call precedence rule; semantics
          states parser_version is comparable only between rows sharing producer.
  producer_version:
    type: str
    iceberg_type: string
    nullable: true
    description: Version string of the emitting producer (distinct from parser_version below, which is integer and dedupe-authoritative).
    semantics: Provenance only; never consulted by the read-side dedupe rule.
    populated_by: the emitting producer.
    dq_intent: {}
  parser_version:
    type: int
    iceberg_type: bigint
    nullable: true
    description: >-
      A per-producer, hand-maintained INTEGER constant, applied to every row the producer emits in
      all four tables (R1). It increments iff the producer's normalised output (event_ids, entity
      keys, every stored column except created_timestamp and producer_version) for any golden
      input differs from the previous version; never for identical output or a build change alone;
      never decrements, never reused -- a revert ships as a NEW higher number. A change to a
      registry-recorded producer input constant (full_output_cap_bytes in
      config/telemetry/parser_versions.yaml) is an output change and bumps even when the golden
      digest repeats, because it changes the output for inputs the goldens do not hold. Part of the
      telemetry grain key (producer, event_id, parser_version), enforced at write (Decision 207).
      Comparable only between rows sharing producer (R2). An identity-spec change, or a change to
      ANY session entity_ref grammar (root or sub-agent), bumps EVERY producer and requires a
      Decision (R10) -- the generation unit is the session, so a re-keyed session escapes R5a
      retirement. The registry and golden-corpus check that enforce this are rec-4122.
    semantics: >-
      A replayable producer's bump obligation (R7): re-parse the whole root tree from the start,
      write data rows first and ONE telemetry_sessions batch of every tree session's rows LAST
      (the generation commit marker), bind its cursor to parser_version and reset it on mismatch,
      never emit v for a session after a v+1 marker for it, and reuse the pinned project_ref and
      session_started_at and the recorded finalization cuts persisted with its cursor across a reset (never re-reading config), so a
      re-emission cannot re-key the tree. A non-replayable producer (R8) emits no open marker,
      never re-emits, and a bump retires nothing.
    populated_by: the emitting producer, a hand-maintained per-producer constant (never a build identity).
    dq_intent: {}
    amendment_log:
      - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): the cursor's recorded finalization cuts persist across a reset like the pins."}
      - date: "2026-09-28"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-grain-and-generations (Decision 207, rec-4061 R1/R2/R3/R7/R10): replaced
          the retired build-provenance populated_by wording with the bump-iff-output-changes
          policy, the per-producer comparability scope, the never-reused/revert-is-new-version
          rule, the identity-spec/session-grammar Decision-R10 clause, and the R7
          replayable-producer write-order and cursor-reuse obligations.
      - date: "2026-10-04"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-write-conformance (slice 2a-1): R1 gains a clause -- a change to a registry-recorded producer
          input constant is an output change and bumps parser_version even when the golden digest repeats.
        migration_story: No live populator exists; the registry check accepts such a bump from this slice.
  created_timestamp:
    type: datetime
    iceberg_type: timestamptz
    nullable: true
    description: >-
      UTC tz-aware write-time timestamp -- when the row was appended, distinct from event_timestamp
      (source event time) and session_started_at (partition basis). Excluded from the grain's
      compared content (Decision 207); the read-side event-collapse tiebreak within a generation --
      see governance_notes' GENERATIONS AND READ-SIDE DEDUPE rule, R5b.
    semantics: >-
      Replaces the retired per-table ingested_at column (same concept, promoted to the shared
      envelope so every telemetry table carries one write-time field under one name).
    populated_by: the write boundary, at append time.
    dq_intent: {}
    amendment_log:
      - date: "2026-09-28"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-grain-and-generations (Decision 207): description now excludes
          created_timestamp from the grain's compared content and points at R5b for the read-side
          event-collapse tiebreak within a generation.
governance_notes: >-
  IDENTITY SPEC (Decision 199, normative -- stated ONCE here, referenced by session-id.yaml,
  observation-id.yaml, parent-observation-id.yaml, telemetry_transcripts (transcript_id),
  telemetry_agents (agent_run_id) and telemetry-lexicon.yaml; never restated). H = sha256 over
  4-byte big-endian length-prefixed UTF-8 (NFC-normalised) fields [domain tag '<table>:<id_role>',
  tenant_id, project_id, ref], with tenant_id/project_id encoded in their canonical uppercase ULID
  form. An ENTITY or FK key = ULID(48-bit ROOT session_started_at ms + the first 80 bits (bytes
  0-9, big-endian) of H). event_id = ULID(48-bit event_timestamp ms + the first 80 bits of H
  computed over external_ref with domain tag '<table>:event'). A FOREIGN KEY field is computed
  using the PARENT's own domain tag over the same ref the parent used, so the child's FK value
  equals the parent's key with no propagation step -- this is the write-boundary-derivation
  replacement for Decision 97's retired mint-once-and-propagate rule (95 cl.1/cl.2/cl.4, 96 cl.1/
  cl.3, 97 cl.1-4). Ids are NEVER caller-supplied: the caller supplies a natural _ref (session_ref,
  project_ref, observation_ref, entity_ref, external_ref, parent_session_ref, parent_observation_ref)
  and the write boundary derives the stored ULID deterministically from it.
  GENERATIONS AND READ-SIDE DEDUPE (Decision 207, rec-4061/rec-4062, normative -- layered, bounded
  to one session's calendar-day partition):
  R3 marker: producer P's telemetry_sessions open row for session S at parser_version v commits
  all of P's rows for S, in all four tables, as complete at v. Its event_id is stable across
  versions.
  R4: V*(P,S) = max parser_version of P's open rows for S within S's partition. If P has no open
  row for S, V* is undefined and R5 alone applies.
  R5 layered rule: (a) retire P's rows for S with parser_version != V*(P,S) when V* is defined
  (below V* is retired, above is pending, hidden from reads until committed); (b) event collapse
  per (producer, event_id): keep the highest parser_version remaining after (a) (V* when defined,
  else the highest version present -- a non-replayable producer), then created_timestamp
  ascending among rows at that version -- content-identical except in the concurrent-write
  race (Decision 81 cl.3), where the reader returns one row per grain key (which one is
  unspecified) and reports the key as conflicted; the conflict report is the normative output and
  the conflict is never resolved silently; (c) model_call entity collapse per observation_id:
  producer precedence claude_code, litellm, then others, then event_timestamp DESC (final usage
  wins, rec-4062), then created_timestamp asc, then producer asc, then event_id asc -- a total
  order.
  R6: a telemetry_agents row belongs to its own (child) session_id's generation, committed by the
  child's own open-row marker, never the spawning session's.
  R7 producer obligations: a producer never emits two different rows under one grain key (a
  model_call is emitted once its turn is closed (a later boundary, its stream's completion evidence, a resume boundary or a recorded finalization cut, which treats the tree as final); it carries its owner record's usage and declares in usage_final whether that usage is final and in usage_source whether a sync spawn result supplied it; a non-final row stays non-final until a parser_version bump re-parses it); every emitted column is
  a pure function of the source records plus the inputs pinned with the cursor, and incremental
  emission equals the emission set recomputed from the tree and its recorded finalization cuts for every row already emitted (with one carve-out: a record
  appended later with a timestamp earlier than the persisted session_started_at pin re-pins only while
  the cursor has emitted no row under that pin, and is otherwise a producer halt); a replayable producer on a bump
  re-parses the whole root tree from the start, writes data rows first and ONE telemetry_sessions
  batch of every tree session's rows LAST, binds its cursor to parser_version and resets it on
  mismatch, never emits v for a session after a v+1 marker for it, and REUSES the pinned
  project_ref and session_started_at and the recorded finalization cuts persisted with its cursor across a reset (never re-reading
  config), so a re-emission cannot re-key the tree. A replayable producer's emission set is a function of the tree and its recorded finalization cuts, and includes one session close per root resume boundary for the segment before it (SC-1), derived from the tree, so a resume records no finalization cut; a root background run is complete at a later resume boundary on the inference that background work does not survive a resume; every emitted column, the provenance columns included, is a function of the source records (the checkout reaches the tree only through the pin hook's recorded line); the cuts survive a parser_version reset like the pins, so a bump re-emits every finalization's close row. Two declared exceptions arise when a stream keeps writing after a finalization cut (a background sub-agent still running at its root's finalization, or a root session continued without a recorded SessionStart:resume boundary), counted in the producer's per-pass diagnostics (CaptureResult.diagnostics; not stored durably): a row first emitted at the cut whose content later differs (e.g. a model_call with partial usage) is kept as first emitted (cut_content_divergence); and a turn, and each of its tool_calls with no result at the cut, gains a second close under its later anchor; the cut-time tool_call close is synthetic (metadata.synthetic true, output_capture no_result, outcome interrupted) and is superseded, never retracted (reanchored_close); and a root background run completed at a resume boundary whose child keeps writing (the inference was wrong) has its rows kept as first emitted (notice_after_boundary and prior_content_divergence).
  PARSER_VERSION 5 (PLAN-telemetry-stop-turn-close): the emission set of a non-final pass reads an open root turn only up to its frontier (its last usable Stop witness or API-error record, else its first prompt record); a turn closes at each usable closing event (a witness is the capture shim's own hook_success attachment at a Stop, usable when the turn's last response has ended and no tool is pending; an API-error record closes its own turn) and, when none lies at or after its last assistant record, at its boundary; every turn close is keyed on the record that ends its window (its witness, its API-error record, or the turn's last uuid and timestamp record before the boundary or eof), so a key fixes its content and a blocked-and-continued turn carries one close per Stop by construction (counted multi_close_turns, never a declared exception).
  The declared reanchored_close now counts, over the prior and current emitted sets, the closes that exist because of a recorded cut, a record appended to a child file after its completion evidence (it re-keys that child turn's close) and a synthetic tool close at an API-error frontier later superseded by a real result; finalization cuts arise only at final passes (SessionEnd on /clear, interactive /resume and local exits).
  PARSER_VERSION 7 (PLAN-telemetry-late-hook-records, rec-4633): claude_code reads late and twinned SessionStart hook records by four rules. HG-1: hook records of one stream matching on toolUseID, hookEvent, hookName, command and durationMs are one hook run, and only the first in file order is a record; the rest are twins (no row, no boundary, no turn). HG-2: a SessionStart startup or clear hook record written after an own prompt record is late. HG-3: a SessionStart:resume group whose first record's hook started (its timestamp minus durationMs) before the latest prompt or assistant record already written is late. HG-4: every SessionStart startup, clear and resume hook record attaches to no turn; a late resume group closes no turn and takes the first prompt of the turn it was written into as its effective boundary, which its SC-1 close, the next segment's start and the background-completion boundary all use. Every verdict is a function of the record and the records before it in file order, so every prefix agrees (R7).
  R8: non-replayable producers emit no open marker, never re-emit, and a bump retires nothing.
  DQ intents (owner rec-4063): more than one distinct row per grain key (conflict); pending
  generations older than 2h; null producer.
  CONFORMANCE VECTORS: tests/telemetry/fixtures/dedupe_vectors.yaml is this rule's normative
  conformance-vector file, like identity_vectors.yaml is for the identity spec above.
  This spec ANSWERS Decision 81 clause 8's current-write-through-projection concern for telemetry,
  it does not amend Decision 81: state/friction/cost are derived at read (data-modeling-standard.yaml's
  derived-state rule), but every derivation is bounded to a session's single calendar-day
  partition, so it is never the unprunable full scan clause 8 exists to avoid.
  TIMESTAMP PRECISION (Decision 96 cl.4): every timestamp column carries its full millisecond value at
  the writer edge (exactly three fraction digits in the wire form), extending session_started_at's
  every-hop obligation to all of them, because event_id's 48-bit prefix depends on event_timestamp
  the same way the entity keys depend on session_started_at.
  CONFORMANCE VECTORS: tests/telemetry/fixtures/identity_vectors.yaml is the committed golden-vector
  file for this identity spec. Its POSITIVE vectors are the normative inputs -> exact-ids pins of
  the identity spec above; its NEGATIVE vectors pin the slice-1 kernel's own input policy (ref
  length/control-character rules, the closed domain-tag registry), which is implementation policy
  of src/telemetry/identity.py, not part of the ratified spec itself.
