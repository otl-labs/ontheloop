---
# Telemetry canonical lexicon -- the single vocabulary the telemetry trace/observation model
# ratifies against. A Class D mechanism contract (migration-step-3-grandfathering, T2.56
# migration step 3) as of the `contract:` block below.
#
# Authority boundary:
#   - Canonical TERMS + the model shape live HERE.
#   - Per-field DQ checks live in the Phase 4 telemetry DQ config.
#   - Per-field contract semantics live in the Class A telemetry_*.yaml contracts (authored at T0.12.6).
# Ratified by Decision 95 (model), Decision 96 (temporal/partition), Decision 97 (identity/determinism).

contract:
  id: telemetry-lexicon
  class: D
  contract_version: 1
  status: active
  description: >-
    Class D mechanism-contract envelope for this file (migration-step-3-grandfathering, T2.56
    migration step 3). The envelope itself (subject/evaluator) is unchanged; the vocabulary/model
    body was rewritten at Decision 199 (see amendment_log below).
  subject: telemetry-lexicon
  evaluator:
    check: validate_telemetry_lexicon_tables

amendment_log:
  - date: "2026-10-29"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      PLAN-telemetry-top-level-agent-run (rec-4416): terms added for top-level run, host run ref and surface; the agent
      and payload omission definitions name the top-level root session and the withheld_by_policy reason. Term-level
      only (Decision 95).
  - date: "2026-10-04"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      PLAN-telemetry-write-conformance (slice 2a-1): terms added for tool_output, output_capture, payload
      omission and reasoning visibility; the purpose value list gains tool_output; the transcript term's
      content line points at the model-visible rule. Term-level only (Decision 95).
  - date: "2026-09-26"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-telemetry-kernel-identity-append implement-time deviation (rec-4073, Class D):
      temporal.partition's four values respelled from the bare calendar-day triple to the
      role-prefixed "history=year(session_started_at), month(session_started_at),
      day(session_started_at)", mirroring the same respelling of governance.partition_by in the four
      telemetry_*.yaml contracts (see their own amendment_log entries for why).
  - date: "2026-09-25"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-telemetry-kernel-identity-append (rec-4065, Class D): temporal.partition's four values
      respelled from the bare day(session_started_at) to the calendar-day triple
      year(session_started_at), month(session_started_at), day(session_started_at) -- DuckLake
      evaluates a bare day() as DAY-OF-MONTH, not calendar day; the derived-at-read term's
      definition reworded to say calendar-day partition. Decision 199 always meant a calendar day.
  - date: "2026-09-24"
    semantic_break: true
    change_class: governance_note_add
    summary: >-
      PLAN-telemetry-event-journal-contracts (Decision 199): REWRITE. temporal re-grounded to
      event_time_column event_timestamp and partition day(session_started_at) for all four tables;
      identity re-grounded to the write-boundary-derived hash spec (ULID-shaped hash ids, not
      time-ordered across sessions; event_id remains a genuine k-sortable ULID); vocabulary added
      for event journal, event_kind, derived-at-read, turn, tool_call, purpose, origin, blob port,
      producer, session_started_at, source_ordinal. canonical_tables and collapses unchanged.
  - date: "2026-08-14"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      rec-3059 enforcer build: flipped the evaluator from the routed none_grandfathered debt
      record to {check: validate_telemetry_lexicon_tables}, which asserts
      lexicon.model.canonical_tables each resolve to an existing Class A contract and collapses
      targets name a canonical table. No change to the vocabulary/model body itself.

version: 2
last_updated: "2026-10-29"
decisions_cited: [Decision-95, Decision-96, Decision-97, Decision-199, Decision-200, Decision-67, Decision-84, CD.25, CD.9]

lexicon:
  model:
    name: session-rooted event-journal model
    shape: OpenTelemetry / Langfuse trace tree, re-grounded to an append-only event journal (Decision 199)
    canonical_tables: [telemetry_sessions, telemetry_observations, telemetry_transcripts, telemetry_agents]
    root_invariant: >-
      Every telemetry row is reachable from a telemetry_sessions row; there are no rootless entities.
    collapses:
      # The seven draft tables -> four canonical (Decision 95).
      telemetry_phases: telemetry_observations (observation_type=phase)
      telemetry_steps: telemetry_observations (observation_type=step)
      telemetry_process_events: telemetry_observations (observation_type=process_event)
      telemetry_model_calls: telemetry_observations (observation_type=model_call)
      telemetry_agent_invocations: telemetry_agents (rooted dimension + linked observations/sub-sessions)

  terms:
    - term: event journal
      definition: >-
        The Decision 199 write pattern every telemetry table uses: an append-only sequence of rows, one per
        lifecycle event (event_kind), never a row mutated in place. A span-shaped entity (a session, an
        observation phase/step/turn/tool_call, an agent run) is an open+close row PAIR sharing one derived
        entity key; a point-shaped entity (model_call, process_event, a transcript blob) is a single row.
      see_also: [event_kind, derived-at-read, session, observation, agent]

    - term: event_kind
      definition: >-
        The per-table lifecycle/point discriminator: open | resume | compact | close | annotate on
        telemetry_sessions; open | close for span-shaped telemetry_observations kinds and telemetry_agents;
        point for telemetry_observations' instantaneous kinds (model_call, process_event) and every
        telemetry_transcripts row. Declared once in telemetry-event-envelope.yaml.
      see_also: [event journal]

    - term: derived-at-read
      definition: >-
        Session/observation/agent-run state, duration, roll-up counts, friction classification and cost are
        NEVER stored columns -- they are computed by a named reader verb reading a session's own rows,
        bounded to its single calendar-day partition (data-modeling-standard.yaml's derived-state
        rule; answers, does not amend, Decision 81 clause 8). A stored fact carries derivation.timing: read
        and gets no physical column.
      see_also: [event journal, session_started_at]

    - term: session
      aka: [trace, run]
      definition: >-
        The root container of one telemetry trace. Rows in telemetry_sessions, keyed by session_id (shared
        across every lifecycle event of that session). The unit every other telemetry row roots to.
      see_also: [session_id, parent_session_id, telemetry_sessions]

    - term: trace
      definition: >-
        The connected tree of a session and all its observations and linked sub-sessions. "Trace" is the
        shape; "session" is the root row.
      see_also: [session, observation]

    - term: observation
      replaces: [phase, step, process_event, model_call]
      definition: >-
        A single node in a session's trace tree. Rows in telemetry_observations, keyed by observation_id,
        rooted by session_id, nested by parent_observation_id. The four draft event tables are NOT separate
        tables -- they are values of observation_type, extended (Decision 199 / T3.20) with turn and tool_call.
      see_also: [observation_type, observation_id, parent_observation_id, telemetry_observations]

    - term: observation_type
      definition: >-
        The node-KIND discriminator column on telemetry_observations (phase | step | turn | tool_call |
        process_event | model_call | ...), orthogonal to event_kind (the lifecycle/point discriminator).
        Accepted-value set ratified per-table.
      see_also: [observation, event_kind]

    - term: turn
      definition: >-
        An observation_type value: one agent turn (a prompt/response exchange). entity_ref grammar
        '<session entity_ref>/<promptId>'. Its own field additions are T3.20's build, not the event-journal
        re-model's.
      see_also: [observation_type, tool_call]

    - term: tool_call
      definition: >-
        An observation_type value: one tool invocation within a turn. entity_ref = its toolUseId; the one
        observation_type with a required close-row outcome (success | error | blocked | interrupted).
      see_also: [observation_type, turn]

    - term: transcript
      definition: >-
        A large text payload (prompt | response | thinking | tool_input | tool_result | tool_output | system)
        stored in telemetry_transcripts, linked by FK to its observation_id (and session_id). Kept OUT of
        telemetry_observations so the node table stays small and hot. Hybrid content tier (Decision 199):
        inline for payloads <= 64 KiB, else spilled to the content blob port. content is the payload AS THE
        MODEL SAW IT (a tool_result's in-context text, never the sidecar).
      see_also: [transcript_id, telemetry_transcripts, observation, blob port, purpose, origin, tool_output, payload omission]

    - term: purpose
      definition: >-
        telemetry_transcripts' kind discriminator for a blob: prompt | response | thinking | tool_input |
        tool_result | tool_output | system. "transcript" (a whole-session dump) is retired -- a session's
        transcript IS the set of its rows, not a single blob.
      see_also: [transcript]

    - term: tool_output
      definition: >-
        A purpose value: the FULL persisted output of a tool call as its own telemetry_transcripts row
        (external_ref '<source_record_id>#<block_index>/full'), emitted only when the harness persisted the
        output and the sidecar is readable. The tool_result row beside it holds only what the model saw.
      see_also: [purpose, output_capture, payload omission]

    - term: output_capture
      definition: >-
        telemetry_observations' tool_call close column recording whether and how the tool's output was
        captured: not_persisted | captured | omitted_oversize | unavailable | no_result, beside the raw
        output_bytes, output_sha256 and output_lines.
      see_also: [tool_call, tool_output]

    - term: payload omission
      definition: >-
        A telemetry_transcripts row with content_omitted_reason set and content and content_uri both NULL:
        the payload is stored nowhere. Reason oversize (a tool_output above the 8 MiB cap): content_sha256/content_bytes
        identify the raw source bytes. Reason withheld_by_policy (the producer's capture policy says the text is never
        stored): content_sha256 is the SHA-256 of the empty byte string and content_bytes is 0.
      see_also: [tool_output]

    - term: reasoning visibility
      definition: >-
        telemetry_observations' model_call column reasoning_visibility: the form in which the provider exposed the
        call's reasoning -- full | summarized | omitted | redacted | none -- so withheld reasoning is never read as
        absent. summarized can include Claude's user-facing progress-update thinking blocks, which carry no type
        difference. reasoning_tokens is the provider-reported count, a subset of tokens_output.
      see_also: [observation_type]

    - term: origin
      definition: >-
        telemetry_transcripts' provenance discriminator for a blob's content: human | harness | agent | tool.
        Hook/harness-generated tool_result TEXT is origin harness; the tool's own output is origin tool.
      see_also: [transcript]

    - term: blob port
      definition: >-
        The named port a spilled (> 64 KiB) transcript payload is written through: S3 in the cloud adapter,
        a local directory adapter in the free tier (Decision 184 clause 2). Content-addressed key
        'tenant/project/session_id/<content_sha256>'. Distinct from DuckLake data inlining, which stays
        disabled for telemetry (CD.34) regardless of which content tier a row uses.
      see_also: [transcript]

    - term: agent
      replaces: [agent_invocation]
      definition: >-
        The agent dimension/run surface (agent_type, model, version) a session belongs to, in
        telemetry_agents, keyed by the derived agent_run_id, joined by session_id (the CHILD session) /
        observation_id (the spawning tool_call, nullable). On a top-level run the session_id is the ROOT session and
        observation_id is NULL. Replaces the rootless telemetry_agent_invocations.
      see_also: [telemetry_agents, session, observation, top-level run]

    - term: top-level run
      definition: >-
        A root session an unattended host started (a CI job running claude -p, a Fargate task, a Lambda, a local run)
        plus its telemetry_agents open/close pair: session_id the root, observation_id NULL, entity_ref
        '<root session entity_ref>/run', host_run_ref set.
      see_also: [agent, host run ref, surface, telemetry_agents run_shapes]

    - term: host run ref
      definition: >-
        telemetry_agents.host_run_ref: the host's own identity for a top-level run under an open prefix registry
        (gha:, ecs:, lambda:, local:); NULL on a sub-agent run.
      see_also: [top-level run]

    - term: surface
      definition: >-
        telemetry_sessions.surface: the read-derived classification of how a session ran (interactive, subagent,
        ci_agent, ci_verdict, fargate_persona, lambda_agent, local_agent); no physical column.
      see_also: [top-level run, session]

    - term: root unification
      definition: >-
        The invariant that every telemetry entity roots at a session. Cross-agent linkage uses
        parent_session_id (sub-agent session -> spawning session); in-session structure uses
        parent_observation_id. Together they form one connected trace tree per top-level run.
      see_also: [session, parent_session_id, parent_observation_id]

    - term: producer
      definition: >-
        The emitting surface's canonical id on the shared envelope (e.g. claude_code, litellm,
        ci_annotate), used both as provenance and as the model_call dedupe precedence tiebreaker.
      see_also: [event journal]

    - term: session_started_at
      definition: >-
        The ROOT session's start time, source-derived and shared by every row of that session AND all its
        sub-agent sessions (never a warehouse lookup). The partition basis and the 48-bit time prefix of
        every entity/FK key.
      see_also: [derived-at-read]

    - term: source_ordinal
      definition: Orders rows within a session independently of event_timestamp precision. A read-side ordering aid; never part of an identity hash.
      see_also: [event journal]

    - term: span
      status: NOT_USED
      definition: >-
        Deliberately not part of this vocabulary. The OpenTelemetry "span" concept is expressed here as an
        observation. Use "observation", never "span", in telemetry contracts and prompts.
      see_also: [observation]

  identity:
    # Decision 199 (amending Decision 97): keys are DERIVED at the write boundary from caller-supplied
    # refs, never minted-once-and-propagated. The normative hash spec lives in
    # docs/contracts/telemetry-event-envelope.yaml; this entry restates only the per-key domain tags.
    scheme: ULID-shaped hash ids (Crockford base32), derived at the write boundary
    normative_spec: docs/contracts/telemetry-event-envelope.yaml    # Class C; identity hash spec
    keys:
      session_id:
        format: ULID-shaped hash id (48-bit ROOT session_started_at ms + 80 hash bits)
        contract: docs/contracts/session-id.yaml    # Class C; contract_version 2 at Decision 199
      observation_id:
        format: ULID-shaped hash id (48-bit ROOT session_started_at ms + 80 hash bits)
        contract: docs/contracts/observation-id.yaml    # Class C; contract_version 2 at Decision 199
      parent_observation_id:
        format: ULID-shaped hash id, same derivation as observation_id
        references: observation_id
        contract: docs/contracts/parent-observation-id.yaml    # Class C; contract_version 2 at Decision 199
      transcript_id:
        format: ULID-shaped hash id, table-local (telemetry_transcripts inline field)
      agent_run_id:
        format: ULID-shaped hash id, table-local (telemetry_agents inline field)
      parent_session_id:
        format: ULID-shaped hash id, same derivation as session_id
        references: session_id
      event_id:
        format: k-sortable ULID (48-bit event_timestamp ms + 80 hash bits over external_ref)
        contract: docs/contracts/telemetry-event-envelope.yaml    # Class C; row identity, not an entity key
    rule: >-
      Entity/FK keys are time-prefixed by the ROOT session's own session_started_at, NOT by when the
      individual row was created -- so they are NOT time-ordered across sessions the way a plain ULID is
      (only event_id, prefixed by its own event_timestamp, is genuinely k-sortable in that sense). A FK is
      computed using the PARENT's own domain tag over the same ref, so it equals the parent's key with no
      propagation step (Decision 199, superseding Decision 97's mint-once-and-propagate rule).

  temporal:
    # Decision 96 (re-grounded by Decision 199): telemetry is an append-only event journal; partition by
    # the ROOT session's own start time, not per-row event time and not mutation time.
    event_time_column: event_timestamp
    partition:
      # rec-4065: DuckLake evaluates a bare day() as DAY-OF-MONTH, not calendar day; the triple is required.
      telemetry_sessions: "history=year(session_started_at), month(session_started_at), day(session_started_at)"    # UTC
      telemetry_observations: "history=year(session_started_at), month(session_started_at), day(session_started_at)"    # UTC
      telemetry_transcripts: "history=year(session_started_at), month(session_started_at), day(session_started_at)"    # UTC
      telemetry_agents: "history=year(session_started_at), month(session_started_at), day(session_started_at)"    # UTC
    timestamps: timezone-aware UTC, ISO-8601; naive / local rejected at the boundary
    excluded: trade_date    # domain-partition concept; absent from telemetry
    not_applicable: last_updated_timestamp    # ops-SCD2 mutation envelope; telemetry is insert-once
