# Telemetry metadata keys (rec-4733, rec-5211; T3.3 prerequisite). Class D mechanism contract: the catalogue of keys the
# producers write into telemetry_observations.metadata, checked against each producer's golden corpus by
# validate_telemetry_metadata_keys.
contract:
  id: telemetry-metadata-keys
  class: D
  contract_version: 1
  status: draft
  description: >-
    One row per producer, observation_type, event_kind and key the producers write into the observations metadata bag,
    with its meaning and the first parser_version whose golden corpus carries it. This is Class D mechanism, not Class A
    fields: bag keys are not columns, the metadata column's Class A obligations stay in telemetry_observations.yaml, and
    this file is the producers' key catalogue checked against the golden corpus. Corpus coverage can lag producer
    behaviour, so since is the first corpus version, not proof of the first write. A key a producer stopped writing keeps
    its row with until set (stored rows are append-only, Decision 199), so the registry explains every key a stored row
    can carry. The check rejects any leaf that uses a Class A descriptor key (K5); the smuggling detector skips
    list-valued bodies, so K5 is this file's only shape guard.
  subject: telemetry-metadata-keys
  evaluator:
    check: validate_telemetry_metadata_keys

amendment_log:
  - {date: "2026-11-21", semantic_break: false, change_class: field_add, summary: "created with 31 key rows (PLAN-telemetry-metadata-keys, rec-4733)"}

procedure: >-
  A producer change that adds a key adds its row, and one that drops a key sets that row's until, in the same
  parser_version bump. The registry is not a write-time rule source: any bag-key rule a writer enforces is declared in
  telemetry_observations.yaml (Decision 210 cl.3).

keys:
  - {producer: claude_code, observation_type: tool_call, event_kind: open, key: caller_type, since: 1, meaning: "the tool_use block's caller.type, who issued the call (observations.py _tool_rows)."}
  - {producer: claude_code, observation_type: tool_call, event_kind: open, key: attribution_mcp_server, since: 1, meaning: "the record's attributionMcpServer, the MCP server a tool call is attributed to; read by the reader's tool_use_rollup."}
  - {producer: claude_code, observation_type: tool_call, event_kind: close, key: tool_denial_kind, since: 3, meaning: "the tool_result record's toolDenialKind identifier when the call was denied (_result_meta)."}
  - {producer: claude_code, observation_type: tool_call, event_kind: close, key: permission_decision_source, since: 3, meaning: "permissionDecision.source on the result record (hook, rule, user...), as an identifier."}
  - {producer: claude_code, observation_type: tool_call, event_kind: close, key: is_error, since: 1, meaning: "the tool_result block's is_error flag (true or false)."}
  - {producer: claude_code, observation_type: tool_call, event_kind: close, key: interrupted, since: 1, meaning: "toolUseResult.interrupted, whether the tool run was interrupted."}
  - {producer: claude_code, observation_type: tool_call, event_kind: close, key: persisted_output, since: 1, meaning: "file name of the harness-saved full output sidecar, when the output was persisted."}
  - {producer: claude_code, observation_type: tool_call, event_kind: close, key: persisted_output_size, since: 1, meaning: "toolUseResult.persistedOutputSize in bytes."}
  - {producer: claude_code, observation_type: tool_call, event_kind: close, key: agent_id, since: 1, meaning: "toolUseResult.agentId of a spawned sub-agent run."}
  - {producer: claude_code, observation_type: tool_call, event_kind: close, key: is_async, since: 1, meaning: "toolUseResult.isAsync, true when the harness ran the spawned agent in the background."}
  - {producer: claude_code, observation_type: tool_call, event_kind: close, key: status, since: 1, meaning: "toolUseResult.status string (for example async_launched)."}
  - {producer: claude_code, observation_type: tool_call, event_kind: close, key: synthetic, since: 1, meaning: "true on a close the producer synthesised for a tool call with no result (outcome interrupted, output_capture no_result)."}
  - {producer: claude_code, observation_type: turn, event_kind: open, key: is_meta, since: 1, meaning: "true when the turn's first record is a harness meta record (isMeta)."}
  - {producer: claude_code, observation_type: turn, event_kind: open, key: prompt_source, since: 1, meaning: "the first record's promptSource string."}
  - {producer: claude_code, observation_type: turn, event_kind: open, key: turn_origin, since: 1, meaning: "the first record's turnOrigin string."}
  - {producer: claude_code, observation_type: turn, event_kind: close, key: response_count, since: 1, meaning: "number of model responses in the turn window this close bounds."}
  - {producer: claude_code, observation_type: turn, event_kind: close, key: tool_call_count, since: 1, meaning: "number of tool calls in that window."}
  - {producer: claude_code, observation_type: model_call, event_kind: point, key: request_id, since: 1, meaning: "the API requestId of the response's owner record."}
  - {producer: claude_code, observation_type: model_call, event_kind: point, key: stop_reason, since: 1, meaning: "the response message's stop_reason."}
  - {producer: claude_code, observation_type: model_call, event_kind: point, key: block_count, since: 1, meaning: "total content blocks across the response's records."}
  - {producer: claude_code, observation_type: process_event, event_kind: point, key: hook_event, since: 1, meaning: "the hook event (PreToolUse, Stop...) of a hook attachment row, or the event taken from a hook denial's reasonCode (src/turn_capture/hook_denials.py); null when the reasonCode carries no hook: event."}
  - {producer: claude_code, observation_type: process_event, event_kind: point, key: hook_name, since: 1, meaning: "the hook attachment's hookName."}
  - {producer: claude_code, observation_type: process_event, event_kind: point, key: attachment_type, since: 1, meaning: "the hook attachment's type."}
  - {producer: claude_code, observation_type: process_event, event_kind: point, key: exit_code, since: 1, meaning: "a hook run's exit code from its attachment (severity derives from it)."}
  - {producer: claude_code, observation_type: process_event, event_kind: point, key: duration_ms, since: 1, meaning: "the hook run's durationMs."}
  - {producer: claude_code, observation_type: process_event, event_kind: point, key: tool_use_id, since: 1, meaning: "the tool_use id the event belongs to (hook attachment, hook denial, gate or status marker)."}
  - {producer: claude_code, observation_type: process_event, event_kind: point, key: command, since: 1, meaning: "the hook command, scrubbed."}
  - {producer: claude_code, observation_type: process_event, event_kind: point, key: stderr_head, since: 1, meaning: "the first 512 characters of the hook's stderr, scrubbed."}
  - {producer: claude_code, observation_type: process_event, event_kind: point, key: marker_version, since: 3, meaning: "the marker grammar version of a gate or status marker row (src/turn_capture/gate_events.py) or of a hook-denial name marker (src/turn_capture/hook_denials.py); null when the denial carried no marker."}
  - {producer: litellm, observation_type: model_call, event_kind: point, key: error, since: 1, meaning: "the provider attempt's outcome when usage was not recorded (litellm_producer.py)."}
  - {producer: litellm, observation_type: model_call, event_kind: point, key: loss, since: 1, meaning: "why a model_call is incomplete, envelope LL-4: cancelled | usage_not_recorded."}
