---
# Class A data contract for telemetry_agents -- the agent DIMENSION/run surface of the canonical
# session-rooted trace/observation model (docs/contracts/telemetry-lexicon.yaml), re-grounded to
# the event-journal model at contract_version 2 (Decision 199).
# Ratified under the CD.25 pre-codegen contract ratification ritual (tier_item T0.12.6).
#
# EVENT JOURNAL: an agent RUN is an open+close row pair sharing one derived agent_run_id. Two run shapes
# (run_shapes below): a SUB-AGENT run is keyed to the CHILD session it spawned (session_id) and the
# spawning tool_call's observation_id, with entity_ref the spawning toolUseId; a TOP-LEVEL run (a CI job,
# a Fargate task, a Lambda, a local unattended run) is keyed to its ROOT session (session_id), carries no
# observation_id, and has entity_ref '<root session entity_ref>/run' plus host_run_ref.
contract:
  id: telemetry_agents
  class: A
  contract_version: 2
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 199)"
  description: >-
    Class A schema contract for telemetry_agents: an append-only EVENT JOURNAL, one open+close row
    pair per agent run, keyed by agent_run_id (derived from entity_ref). On a sub-agent run entity_ref
    is the spawning tool call's toolUseId, session_id is the CHILD session the run belongs to (NOT NULL
    -- the fix for the rootless draft telemetry_agent_invocations) and observation_id (nullable) is the
    spawning tool_call. On a top-level run (run_shapes) entity_ref is '<root session entity_ref>/run',
    session_id is the ROOT session itself and observation_id is NULL. Token totals are DERIVED via the
    run session's own model_call observations, not stored on this table.
  projects_to:
    artifact: config/lambda/ducklake/field_semantics.yaml
    table: telemetry_agents
    generator: scripts/schema_to_field_semantics.py
    note: >-
      The event projection (scripts/field_semantics_event_projection.py) emits this table's entry from slice
      2a-2 plan 1's registration onward and runs in-process before then, so no later flip is owed.
fields:
  event_id:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_id
    dq_intent_local: {not_null: true}
    governance_notes_local: Row identity for this event-journal table. Domain tag 'telemetry_agents:event'.
  event_kind:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_kind
    dq_intent_local:
      not_null: true
      accepted_values: {values: [open, close]}
  event_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_timestamp
    dq_intent_local: {not_null: true}
  session_started_at:
    $ref: telemetry-event-envelope.yaml#/contract/fields/session_started_at
    dq_intent_local: {not_null: true}
    governance_notes_local: The ROOT session's start time -- carried even though session_id below points at the CHILD session, so the run still clusters with its whole trace tree.
  source_ordinal:
    $ref: telemetry-event-envelope.yaml#/contract/fields/source_ordinal
  external_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/external_ref
    dq_intent_local: {not_null: true}
  entity_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/entity_ref
    dq_intent_local:
      not_null: true
      pattern_when:
        - {when: {trigger: [workflow_run, workflow_dispatch, push, schedule, eventbridge, manual, smoke_test]}, pattern: "^.+/run$"}
    governance_notes_local: >-
      Two shapes (run_shapes): the spawning tool call's toolUseId on a sub-agent run, '<root session entity_ref>/run' on a
      top-level run (write-enforced by pattern_when on the top-level triggers). Either is the hash input for this row's own agent_run_id.
    amendment_log:
      - {date: "2026-10-29", semantic_break: false, change_class: governance_note_add, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): a top-level run's entity_ref is '<root session entity_ref>/run', write-enforced by pattern_when on the top-level trigger values; a sub-agent run's shape is unchanged.", migration_story: "No stored row changes: every stored row is a sub-agent row."}
  producer:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer
    dq_intent_local: {not_null: true}
    amendment_log:
      - {date: "2026-09-28", semantic_break: true, change_class: not_null_tighten, summary: "PLAN-telemetry-grain-and-generations (Decision 207, rec-4061 R2): producer is now NOT NULL enforced -- part of the telemetry grain key."}
  producer_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer_version
  parser_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/parser_version
    dq_intent_local: {not_null: true}
  created_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/created_timestamp
    dq_intent_local: {not_null: true}
  tenant_id:
    $ref: tenant-id.yaml#/contract/fields/tenant_id
    dq_intent_local: {not_null: true}
  project_id:
    $ref: project-id.yaml#/contract/fields/project_id
    dq_intent_local: {not_null: true}
  session_id:
    $ref: session-id.yaml#/contract/fields/session_id
    dq_intent_local: {not_null: true}
    governance_notes_local: >-
      FOREIGN KEY to the CHILD session this agent run belongs to -- the fix for the rootless
      telemetry_agent_invocations defect: a scheduled-agent or sub-agent invocation gets its own
      session, and this row roots to it. Tightened NOT NULL (Invariant 5). This row's generation
      is the CHILD session's own (Decision 207 R6): it commits with that child's open-row marker,
      not the spawning session's. On a TOP-LEVEL run (run_shapes) session_id is the ROOT session itself.
    joins:
      - session_id_join_telemetry_sessions_to_agents
    amendment_log:
      - {date: "2026-10-29", semantic_break: false, change_class: governance_note_add, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): on a top-level run session_id is the root session itself (the child on a sub-agent run).", migration_story: "No stored row changes: every stored row is a sub-agent row."}
      - {date: "2026-09-28", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-grain-and-generations (rec-4061 R6): named this row's generation as the child session's own, committed by the child's open-row marker."}
  observation_id:
    $ref: observation-id.yaml#/contract/fields/observation_id
    governance_notes_local: >-
      Optional FK to the SPAWNING tool_call's observation_id, when this run was spawned by one
      (vs. a top-level run, where it is NULL -- run_shapes). Stays nullable.
    amendment_log:
      - {date: "2026-10-29", semantic_break: false, change_class: governance_note_add, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): observation_id is NULL on a top-level run.", migration_story: "No stored row changes: every stored row is a sub-agent row."}
    joins:
      - observation_id_join_observations_to_agents
  agent_run_id:
    type: str
    iceberg_type: string
    nullable: false
    description: ULID string identifying one agent run. Primary key of telemetry_agents.
    semantics: >-
      Format: ULID(48-bit ROOT session_started_at ms + the first 80 bits of H computed over
      entity_ref with domain tag 'telemetry_agents:agent_run_id'), per
      telemetry-event-envelope.yaml's identity spec. Both the open and close row of a run share
      this SAME value. Table-local entity key (not a cross-system Class C key).
    populated_by: the write boundary (rec-4024's append_events verb), derived from entity_ref.
    write_time_validation: PK-required; ULID format and value are generator-guaranteed at the boundary.
    dq_intent: {not_null: true}
  agent_type:
    $ref: source-lineage.yaml#/contract/fields/registry_key
    dq_intent_local: {not_null: true}
    governance_notes_local: >-
      The agent-identity DIMENSION KEY: a canonical lineage key from
      config/agent/data_quality/source_registry.yaml (Decision 66), the SAME registry
      ops_recommendations.source draws from. Registry membership is validated at write time.
      On a PERSONA RUN it is that persona's registry_key from the personas rows of
      docs/contracts/executor-personas.yaml, on every producer and both run shapes, so one
      persona's runs share one key on every backend and the lineage join meets the recs filed
      under that key; on any other run it is the producer's or the agent's own key (run_shapes).
      A reader tells a persona run by agent_type being one of those registry_key values. The
      claude_code producer writes a persona's key from parser_version 10 (rec-4433); every
      sub-agent row it wrote before carries claude-code-subagent.
    joins:
      - lineage_join_source_to_agent_type
    amendment_log:
      - {date: "2026-11-12", semantic_break: true, change_class: governance_note_add, summary: "PLAN-persona-run-identity-contract (rec-4433, Decision 206 cl.4): on a persona run agent_type is that persona's registry_key from executor-personas.yaml, on every producer and both run shapes; the persona ids keep Decision 231 cl.4's spelling and the personas rows hold the map.", migration_story: "No stored row changes (append-only): every stored sub-agent row carries claude-code-subagent, so a read of rows before claude_code parser_version 10 cannot tell a persona run from another sub-agent run; top-level rows keep their agent's key (ci_rca)."}
  agent_name:
    type: str
    iceberg_type: string
    nullable: true
    description: The producer's own name for the agent instance as spawned; for claude_code, the Agent tool's subagent_type (e.g. general-purpose). NULL on a top-level run.
    semantics: >-
      A raw label for display and grouping (tool_use_rollup groups on it), never the identity key: agent_type stays the
      single authoritative key, and a persona run's persona is read from agent_type, not from this label (several
      personas spawn as general-purpose).
    populated_by: the claude_code producer, at the open event (the spawn's subagent_type); NULL on a top-level run row.
    dq_intent: {}
    amendment_log:
      - {date: "2026-11-12", semantic_break: true, change_class: governance_note_add, summary: "PLAN-persona-run-identity-contract (rec-4433): agent_name is re-described as what the claude_code producer writes, the spawn's subagent_type, and is never the persona key.", migration_story: "No stored row changes: every claude_code version writes the spawn's subagent_type here (src/turn_capture/sessions.py _agent_row) and leaves it NULL on a top-level row, so the old 'Null when identical to agent_type' text never matched a stored row."}
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the open event; field meaning unchanged."}
  model:
    type: str
    iceberg_type: string
    nullable: true
    description: The model the agent ran on (e.g. claude-haiku-4-5, gemini-3-pro-preview).
    semantics: A dimension attribute (docs/contracts/telemetry-lexicon.yaml `agent` term).
    populated_by: the claude_code producer, at the open event or record_model_call.
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the write-boundary model; field meaning unchanged."}
  provider:
    type: str
    iceberg_type: string
    nullable: true
    description: "The inference provider: copilot_sdk | github_models | anthropic_max."
    semantics: Dimension attribute. The set is open; a closed set would be declared here when ratified (Decision 210 cl.3), and the vocabulary stays rec-4135's.
    populated_by: "unproduced: T4.32:c1 (no producer writes it)"
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the open event; field meaning unchanged."}
      - {date: "2026-10-05", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-lifecycle-friction-amendment (fork 2 (a)): replaced 'enforcement deferred to the Phase 4 telemetry DQ config' with the open-set wording; vocabulary stays rec-4135's. Meaning unchanged."}
  version:
    type: str
    iceberg_type: string
    nullable: true
    description: Agent/model version string for the dimension.
    semantics: Dimension attribute (docs/contracts/telemetry-lexicon.yaml `agent` term).
    populated_by: the claude_code producer, at the open event.
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the open event; field meaning unchanged."}
  trigger:
    type: str
    iceberg_type: string
    nullable: true
    description: "How the agent run was triggered: subagent_sync | subagent_background | workflow_run | workflow_dispatch | push | schedule | eventbridge | manual | smoke_test."
    semantics: >-
      Run-provenance attribute; the set is CLOSED and write-enforced (Decision 210 cl.3), a new value is a contract widen. The sub-agent
      values are the claude_code producer's spawn modes; the GitHub Actions values are GITHUB_EVENT_NAME verbatim for the event types the
      capture allow-list admits; eventbridge, manual and smoke_test are the non-Actions host triggers. cron_workflow is retired (no producer
      ever wrote it; GitHub's own name is schedule). run_shapes partitions the values between the two run shapes.
    populated_by: the claude_code producer, at the open event.
    dq_intent: {accepted_values: {values: [subagent_sync, subagent_background, workflow_run, workflow_dispatch, push, schedule, eventbridge, manual, smoke_test]}}
    amendment_log:
      - {date: "2026-10-29", semantic_break: true, change_class: accepted_values_narrow, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): the trigger set is closed to nine values and write-enforced; cron_workflow leaves the documented set (GitHub's name is schedule).", migration_story: "census: 0 violators (2026-10-29): the only telemetry_agents writer is the claude_code producer, and every version since slice 3a (ffc761ee, src/turn_capture/sessions.py _agent_row) writes subagent_sync or subagent_background, so no stored row breaks the rule (source: producer history; no reader verb lists distinct trigger values)."}
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the open event; field meaning unchanged."}
      - {date: "2026-10-05", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-lifecycle-friction-amendment (fork 2 (a)): replaced 'enforcement deferred' with the open-set wording. Meaning unchanged."}
  outcome:
    type: str
    iceberg_type: string
    nullable: true
    description: "Terminal disposition of the agent run: success | failed | timeout | throttled."
    semantics: Stored once, on the close row.
    populated_by: the claude_code producer, at the close event.
    dq_intent:
      required_when: {event_kind: [close]}
      accepted_values: {values: [success, failed, timeout, throttled]}
    governance_notes_local: >-
      claude_code parser_version 4 (rec-4358): a background run's close rows are one per completion notice, outcome per its status (completed -> success, timeout -> timeout, any other token -> failed with error notice_status:<token>, a malformed or absent tag -> failed with notice_status:malformed or notice_status:absent); a root background run whose root resumed before any notice has no close row (it reads running then abandoned). "Stored once, on the close row" holds per notice: a run with several notices has several close rows and the reader takes the latest.
    amendment_log:
      - {date: "2026-10-17", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-capture-producer-fixes (rec-4358): claude_code background close outcome follows the notice status, one close row per notice; stored-once qualified for runs with several notices."}
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name this row as the close event and added dq_intent.required_when; accepted values unchanged."}
  tokens_input_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Total input tokens consumed across the agent run. DERIVED at read via the child session's own model_call observations -- replaces the contract_version 1 stored tokens_input.
    semantics: "A read-time aggregate over telemetry_observations rows sharing this run's session_id; no physical column. Uncached prompt tokens only (telemetry_observations.yaml tokens_input); disjoint from tokens_cache_read_total and tokens_cache_creation_total."
    populated_by: a named reader verb (rec-4024), bounded to this run's calendar-day partition.
    dq_intent: {}
    derivation: {timing: read, derived_by: "reader_verb:agent_run_token_rollup", formula: "sum(tokens_input) over telemetry_observations WHERE session_id = this.session_id AND observation_type = 'model_call'", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type, telemetry_observations.tokens_input], realized: false}
    amendment_log:
      - {date: "2026-10-16", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-cache-token-totals (rec-4333): the total sums uncached prompt tokens only.", migration_story: "No verb output changes: the rollup already sums tokens_input, which this plan defines as uncached."}
      - date: "2026-09-24"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199): renamed from tokens_input (stored)
          to tokens_input_total (derived at read via the child session's model_call observations,
          the *_total roll-up naming convention). semantic_break=true: the write pattern changed.
        migration_story: No live populator existed; rec-4024 builds directly to this derivation.
  tokens_output_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Total output tokens produced across the agent run. DERIVED at read, same mechanism as tokens_input_total -- replaces the contract_version 1 stored tokens_output.
    semantics: A read-time aggregate over telemetry_observations rows sharing this run's session_id; no physical column.
    populated_by: a named reader verb (rec-4024), bounded to this run's calendar-day partition.
    dq_intent: {}
    derivation: {timing: read, derived_by: "reader_verb:agent_run_token_rollup", formula: "sum(tokens_output) over telemetry_observations WHERE session_id = this.session_id AND observation_type = 'model_call'", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type, telemetry_observations.tokens_output], realized: false}
    amendment_log:
      - date: "2026-09-24"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199): renamed from tokens_output (stored)
          to tokens_output_total (derived at read), mirroring tokens_input_total.
          semantic_break=true: the write pattern changed.
        migration_story: No live populator existed; rec-4024 builds directly to this derivation.
  tokens_cache_read_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: "Total cache-read tokens across the agent run. DERIVED at read via the child session's own model_call observations, same mechanism as tokens_input_total."
    semantics: "A read-time aggregate over telemetry_observations rows sharing this run's session_id; no physical column. Disjoint from tokens_input_total and tokens_cache_creation_total (telemetry_observations.yaml tokens_input), so the run's total prompt is the sum of the three."
    populated_by: "a named reader verb (agent_run_token_rollup), bounded to this run's calendar-day partition."
    dq_intent: {}
    derivation: {timing: read, derived_by: "reader_verb:agent_run_token_rollup", formula: "sum(tokens_cache_read) over telemetry_observations WHERE session_id = this.session_id AND observation_type = 'model_call'", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type, telemetry_observations.tokens_cache_read], realized: false}
    amendment_log:
      - {date: "2026-10-16", semantic_break: false, change_class: field_add, summary: "PLAN-telemetry-cache-token-totals (rec-4333): read-derived total of the session's model_call tokens_cache_read, returned by agent_run_token_rollup."}
  tokens_cache_creation_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: "Total cache-creation tokens across the agent run. DERIVED at read via the child session's own model_call observations, same mechanism as tokens_input_total."
    semantics: "A read-time aggregate over telemetry_observations rows sharing this run's session_id; no physical column. Disjoint from tokens_input_total and tokens_cache_read_total (telemetry_observations.yaml tokens_input), so the run's total prompt is the sum of the three."
    populated_by: "a named reader verb (agent_run_token_rollup), bounded to this run's calendar-day partition."
    dq_intent: {}
    derivation: {timing: read, derived_by: "reader_verb:agent_run_token_rollup", formula: "sum(tokens_cache_creation) over telemetry_observations WHERE session_id = this.session_id AND observation_type = 'model_call'", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type, telemetry_observations.tokens_cache_creation], realized: false}
    amendment_log:
      - {date: "2026-10-16", semantic_break: false, change_class: field_add, summary: "PLAN-telemetry-cache-token-totals (rec-4333): read-derived total of the session's model_call tokens_cache_creation, returned by agent_run_token_rollup."}
  duration_seconds:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Wall-clock agent-run duration in seconds. DERIVED at read by pairing this run's open and close rows; NULL while the run has no close row yet.
    semantics: >-
      close.event_timestamp minus open.event_timestamp for this agent_run_id, truncated toward zero to whole seconds (rec-4405). The agent-run pair is also the state of the sub-agent's session
      (telemetry_sessions.state): running while open, abandoned past the same idle threshold, and at close success -> success, failed, timeout or throttled -> failed.
    populated_by: a named reader verb (rec-4024).
    dq_intent: {}
    derivation: {timing: read, derived_by: "reader_verb:agent_run_state_and_duration", formula: "truncate toward zero to whole seconds (close.event_timestamp - open.event_timestamp), paired on agent_run_id", inputs: [event_timestamp, event_kind, agent_run_id], realized: false}
    amendment_log:
      - {date: "2026-09-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded from a stored open/close-pair column to a read-derived field paired by agent_run_id; field meaning (wall-clock run duration) unchanged."}
      - {date: "2026-10-18", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-read-side-session-end (rec-4405): the duration is truncated toward zero to whole seconds, as the verbs already compute it."}
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C9): the agent-run pair is also the sub-agent session's state (telemetry_sessions.state), with the outcome mapping success -> success and failed, timeout or throttled -> failed."}
  findings_count:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Number of findings the agent produced in the run. Stored once, on the close row.
    semantics: Agent-run WORK metric (a scheduled-agent output), observed once at close -- not a roll-up over child rows, so it keeps its plain name (no *_total).
    populated_by: "unproduced: rec-4711 (no producer writes it)"
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name the close-event row this field is stored on; field meaning unchanged."}
  recs_created:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Number of recommendations the agent filed in the run. Stored once, on the close row.
    semantics: Agent-run WORK metric; cross-references ops_recommendations rows filed with this agent's source, joined tenant-locally.
    populated_by: "unproduced: rec-4711 (no producer writes it)"
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name tenant-local joining and the close-event row this field is stored on; field meaning unchanged."}
  queue_entries_written:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Number of priority-queue entries the agent wrote in the run. Stored once, on the close row.
    semantics: Agent-run WORK metric (rec-curator-style producers).
    populated_by: "unproduced: rec-4711 (no producer writes it)"
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name the close-event row this field is stored on; field meaning unchanged."}
  error:
    type: str
    iceberg_type: string
    nullable: true
    description: Error message when outcome is failed/timeout/throttled. NULL on success. Stored on the close row.
    semantics: Optional failure diagnostic for the agent run.
    populated_by: the claude_code producer, at the close event.
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name the close-event row this field is stored on; field meaning unchanged."}
  lambda_request_id:
    type: str
    iceberg_type: string
    nullable: true
    description: AWS Lambda request id of the invocation, when the agent ran as a Lambda. NULL otherwise.
    semantics: Run provenance (CloudWatch correlation). Null for non-Lambda runs.
    populated_by: "unproduced: rec-4711 (no producer writes it)"
    dq_intent: {}
  workflow_run_id:
    type: str
    iceberg_type: string
    nullable: true
    description: GitHub Actions workflow run id, when the agent ran from CI. NULL otherwise.
    semantics: Run provenance (GitHub Actions correlation). Null for non-CI runs. Filled, with host_run_ref, on the top-level run rows of a claude -p run in GitHub Actions (the run id; the host-run sidecar's host.run_id).
    populated_by: the claude_code producer from parser_version 8, on a top-level run row whose tree carries a host-run sidecar (a sub-agent row leaves it NULL).
    dq_intent: {}
    amendment_log:
      - {date: "2026-10-30", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-claude-p-capture-adapter (rec-4424): populated_by names the claude_code producer from parser_version 8 (the unproduced owner entry T3.20:c9 is retired for this column). Meaning unchanged."}
      - {date: "2026-10-29", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): semantics notes the CI capture producer fills it with host_run_ref (owner stays T3.20:c9). Meaning unchanged."}
  definition_sha256:
    type: str
    iceberg_type: string
    nullable: true
    description: "SHA-256 of the persona definition text a persona run loaded as its instructions, 64 lower-case hex characters; NULL on a run that is not a persona run."
    semantics: >-
      One meaning on every producer: the definition the run was given, never its inputs, its host or its run
      configuration. claude_code: the text of the persona's gate-skill definition that the harness injected into the
      run's own stream (the meta record answering the run's first persona Skill call), as UTF-8, with the leading
      "Base directory for this skill: <path>" line and the blank line after it removed and any trailing "ARGUMENTS:"
      block removed, so one definition hashes the same on every host. A run_persona producer: the rendered system
      prompt it sends, which equals the persona contract's rendered_prompt_sha256 (Decision 206 cl.7). The two
      producers hash different texts, so one persona's hashes are not expected to match across backends; within one
      producer a changed definition is a changed hash. Run configuration (model, thinking, effort;
      docs/contracts/inference-provider.yaml) and run inputs are outside the hash, so a reader that needs a
      configuration change reads it from its own column or contract (rec-5072 owns the dual-run reset rule for
      thinking and effort). Written on the run's open and close rows (Decision 199 cl.1).
    populated_by: "unproduced: rec-4433 (no producer writes it)"
    dq_intent:
      pattern: "^[0-9a-f]{64}$"
    amendment_log:
      - {date: "2026-11-12", semantic_break: false, change_class: field_add, summary: "PLAN-persona-run-identity-contract (rec-4433, Decisions 206 cl.7, 210 cl.1, 222): one nullable definition_sha256 column, 64 lower-case hex characters, write-enforced; the hash of the definition text a persona run loaded.", migration_story: "Additive nullable column; no stored row changes. Production add owed (provision_telemetry_catalog, Decision 230 cl.4); until then it is pending_reconcile and the governed deploy holds the production telemetry writer and reader."}
  host_run_ref:
    type: str
    iceberg_type: string
    nullable: true
    description: "The host's own identity for a top-level agent run, under an open prefix registry; NULL on a sub-agent run (its root's top-level row carries it)."
    semantics: >-
      Per-prefix grammar: gha:<run_id>/<run_attempt>/<job id>/<retry ordinal of the claude -p attempt, from 1>, ecs:<cluster>/<task id>,
      lambda:<request id>, local:<runtime>/<run id> (Decision 184: a free-tier local run fits). A new host is a new prefix and a contract
      widen (Decision 210 cl.3). No prefix's character class admits ':' after the prefix, so an ARN cannot match; it never carries an ARN,
      account id or hostname (Decision 101); the per-host typed columns (workflow_run_id, lambda_request_id) stay as typed join keys.
      A sub-agent row's host_run_ref is NULL at write (null_or_zero_when on the sub-agent triggers).
    populated_by: the claude_code producer from parser_version 8, on a top-level run row (open and close) whose tree carries a host-run sidecar; NULL on a sub-agent row.
    dq_intent:
      required_when: {trigger: [workflow_run, workflow_dispatch, push, schedule, eventbridge, manual, smoke_test]}
      pattern: "^(gha:[0-9]{1,20}/[0-9]{1,6}/[A-Za-z0-9_.-]{1,100}/[1-9][0-9]{0,2}|ecs:[A-Za-z0-9_.-]{1,255}/[A-Za-z0-9-]{1,64}|lambda:[A-Za-z0-9-]{1,64}|local:[A-Za-z0-9_.-]{1,64}/[A-Za-z0-9_.-]{1,128})$"
      null_or_zero_when: {trigger: [subagent_sync, subagent_background]}
    governance_notes_local: >-
      required_when {trigger: [the seven top-level values]} lands after the production column add (Decision 222 cl.1 refuses an additive add
      of a column that carries a rule), so a top-level run row must carry it. It is undated (required_when is not a dateable rule kind) and
      cannot trip older rows: no producer writes a top-level trigger before parser_version 8, a sub-agent row carries subagent_sync or
      subagent_background, and the deploy smoke vector carries no trigger. A gha value is built from the host-run sidecar the CI capture pass
      writes: gha:<run id>/<run attempt>/<job id>/<retry ordinal>, the ordinal being the claude -p attempt's rank by start time across the
      job's wrapper manifests (1 for a job that ran the agent once).
    amendment_log:
      - {date: "2026-10-30", semantic_break: true, change_class: not_null_tighten, summary: "PLAN-telemetry-claude-p-capture-adapter (rec-4424): host_run_ref is required when the row's trigger is one of the seven top-level values (write-enforced required_when, undated); populated_by names the claude_code producer from parser_version 8.", migration_story: "census: 0 violators (2026-10-30): no stored row carries a top-level trigger (every stored telemetry_agents row is a sub-agent row with subagent_sync or subagent_background), and the deploy smoke vector carries no trigger. The production column add (provision_telemetry_catalog, Decision 230 cl.4) precedes this rule (Decision 222 cl.1)."}
      - {date: "2026-10-29", semantic_break: false, change_class: field_add, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): one generic nullable host_run_ref column with a four-prefix pattern (gha, ecs, lambda, local), NULL on a sub-agent run.", migration_story: "Additive nullable column; no stored row changes. Production add owed (provision_telemetry_catalog, Decision 230 cl.4); until then it is pending_reconcile and the governed deploy holds the production telemetry writer and reader."}
realization:
  produced: {write_boundary: [event_id, created_timestamp, tenant_id, project_id, session_id, observation_id, agent_run_id], claude_code: [event_kind, event_timestamp, session_started_at, source_ordinal, external_ref, entity_ref, producer, producer_version, parser_version, agent_type, agent_name, model, version, trigger, outcome, error, workflow_run_id, host_run_ref]}
  unproduced: {T4.32:c1: [provider], rec-4711: [lambda_request_id, findings_count, recs_created, queue_entries_written], rec-4433: [definition_sha256]}
run_shapes:
  sub_agent:
    session_id: child
    observation_id: spawning_tool_call
    entity_ref: "<spawning tool call toolUseId>"
    external_ref: "the producer's spawn and close record refs"
    agent_type: "the persona's registry_key on a persona run (executor-personas.yaml personas rows), else the producer's registry key (claude-code-subagent for claude_code)"
    triggers: [subagent_sync, subagent_background]
    host_run_ref: "null"
    rows: "one open row per spawn; one close row per completion notice (rec-4358)"
  top_level:
    session_id: root
    observation_id: "null"
    entity_ref: "<root session entity_ref>/run"
    external_ref: "'<root session entity_ref>/run#0/open' for the open row; a close row is keyed by its closing record like the root's session close rows ('<closing record uuid>#0/run_close'), one per root session close row, so a growing tree never rebuilds a ref with other content (a run that is never resumed has exactly one)"
    agent_type: "the source_registry key of the agent (e.g. ci_rca); the persona's registry_key on a persona run"
    triggers: [workflow_run, workflow_dispatch, push, schedule, eventbridge, manual, smoke_test]
    host_run_ref: required
    rows: "one open row timed at the root's open row and, from the final pass, one close row per root session close row, timed and outcome-ed like it (C-3), an interrupted close (C-3 cancelled) stored as failed because outcome is the closed set success | failed | timeout | throttled"
    one_run_per: "root session (a claude -p retry attempt is a new session, so a new run with its own retry ordinal)"
    state: "root state stays derived from the root's own session rows (STATE_CTES, parent_session_id IS NULL); the pair is run provenance, and agent_run_state_and_duration and agent_run_token_rollup over the root return it"
governance:
  table_class: event
  partition_by: "history=year(session_started_at), month(session_started_at), day(session_started_at)"
  write_path: >-
    Provisioned in the production telemetry catalog (Decision 230); production writes begin at PLAN-telemetry-production-flip; the writer is rec-4024's append verb, the rooted agent writer
    (carrying session_id) on the append_events boundary. Append-only; no SCD2 merge, no in-place mutation.
governance_notes: >-
  PERSONA RUN: a run whose instructions are a registered persona's definition (the personas rows of
  docs/contracts/executor-personas.yaml) carries that persona's registry_key in agent_type and the definition's hash in
  definition_sha256, on its open and close rows and on either run shape; outcome-parity reads group by (agent_type,
  persona_backend) (telemetry_observations.yaml persona_backend). Declared residuals: a custom named sub-agent is not a
  persona run (its definition is not in the transcript), and the judgment personas ci-rca and the advice consult have no
  personas row yet, so their runs carry their agent's or the producer's key and a NULL definition_sha256 (rec-5071).
  TOP-LEVEL RUN: a CI job running claude -p, a Fargate task, a Lambda or a local unattended run is its root session plus one open/close
  pair here (run_shapes.top_level: session_id the root, observation_id NULL, entity_ref '<root session entity_ref>/run', host_run_ref
  required); telemetry_sessions.surface tells the five run surfaces apart at read. From parser_version 8 the claude_code producer writes these rows for a
  claude -p run in GitHub Actions: ci-pass writes a host-run sidecar beside the root transcript (project_ref, agent as the source_registry key, content
  policy and host facts), rule P-5 lets the sidecar pin the project when the hook pin is absent (a disagreement defers the pass), the open row carries
  agent_type, trigger (the host event name), workflow_run_id and host_run_ref, and the close rows mirror the root's session close rows. EVENT JOURNAL: telemetry_agents replaces the ROOTLESS telemetry_agent_invocations -- the
  canonical addition is session_id (+ optional observation_id), rooting every agent row to its
  session, now shaped as an open+close row pair keyed by the DERIVED agent_run_id (Decision 199,
  amending Decision 95 clause 4, Decision 96 clauses 1 and 3, and Decision 97 clauses 1-4). Token
  totals and duration are DERIVED at read (tokens_input_total, tokens_output_total, tokens_cache_read_total and tokens_cache_creation_total via the child
  session's own model_call observations; duration_seconds by pairing open/close rows) -- replacing
  the contract_version 1 stored tokens_input/tokens_output/duration_seconds. findings_count/
  recs_created/queue_entries_written stay STORED (observed once, at close, not aggregates over
  child rows). Identity (agent_run_id, session_id, observation_id) is derived at the write boundary
  per telemetry-event-envelope.yaml's normative hash spec. NULLABILITY AXES: a column is NOT NULL at write when `nullable` is false or dq_intent declares not_null, unless the field
  carries `required_when`, which then governs (scripts/field_semantics_event_projection.py _is_not_null); every declared rule is write-enforced (Decision 210); a staged rule is spelled with exclude_before or an owned exemption. Provisioned in the production telemetry catalog (Decision 230). KNOWN GAP: rec-2173 (preflight telemetry health) and
  the broader Phase 4 re-provisioning (rec-4024) are CODE follow-ons, not this contract.
