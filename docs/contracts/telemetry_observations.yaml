  persona_backend:
    type: str
    iceberg_type: string
    nullable: true
    description: "The run_persona backend that executed this model_call: litellm | claude_cli. NULL for non-model_call kinds."
    semantics: >-
      Decision 206 -- inference-provider.yaml vocabulary axis persona_backend: litellm is On The Loop's own harness calling a model through LiteLLM; claude_cli is the unmodified Claude Code CLI run as a subprocess (T4.27). codex_cli is reserved and not accepted until its start gate passes. NULL when
      the model_call was not made under run_persona (e.g. a routine scheduled agent). Independent of billing_shape; outcome-parity reads group by (telemetry_agents.agent_name, persona_backend) at read.
    populated_by: "unproduced: T4.32:c1 (no producer writes it)"
    dq_intent:
      accepted_values: {values: [litellm, claude_cli]}
    amendment_log:
      - {date: "2026-09-28", semantic_break: false, change_class: field_add, summary: "PLAN-cli-persona-backend (Decision 206): new model_call dimension naming the run_persona backend."}
  billing_shape:
    type: str
    iceberg_type: string
    nullable: true
    description: "Billing shape of the call behind this model_call: metered_marginal | fixed_non_rollover_allowance | local. NULL for non-model_call kinds."
    semantics: >-
      Decision 206 -- inference-provider.yaml billing_shape_vocabulary, never a property of the vendor or backend: metered_marginal and fixed_non_rollover_allowance are the credential's, and local (Decision 234 clause 4) marks a call a self-hosted model server served (inference-provider.yaml model_id_formats.litellm_local_servers), with no metered spend and no allowance. Dollars derive only for metered_marginal; a fixed_non_rollover_allowance or local row reports turns and tokens, and any cost_usd_reported it stores (e.g. a Claude Code
      total_cost_usd under subscription auth, or LiteLLM's computed cost for a self-hosted model) is a raw notional estimate kept per Decision 199, never a spend. Cross-backend parity compares turns and tokens per verified merge, the unit every shape shares.
    populated_by: >-
      the claude_code producer, at the model_call point event -- claude_cli rows are always fixed_non_rollover_allowance; litellm rows take the credential's declared billing_shape (a tier's in inference-provider.yaml, or the one otl init records for a BYOK key), or local when LiteLLM routes the call to a model_id_formats.litellm_local_servers row; a producer outside run_persona (T3.20 turn
      capture, a scheduled agent) records the billing_shape of the credential it used, a Claude Code session capture being fixed_non_rollover_allowance. Claude Code session captures (producer claude_code) are fixed_non_rollover_allowance; metered API-key Claude Code use is out of scope (CI runs on the subscription OAuth token), so the producer never emits metered_marginal (rec-4147).
    dq_intent:
      required_when: {event_kind: [point], observation_type: [model_call]}
      accepted_values: {values: [metered_marginal, fixed_non_rollover_allowance, local]}
    amendment_log:
      - {date: "2026-10-27", semantic_break: true, change_class: accepted_values_extend, summary: "PLAN-billing-shape-local (rec-4561, Decision 234 clause 4): accepted_values gains local, a call a self-hosted model server served; it derives no dollars.", migration_story: "Additive: every stored row stays valid, and no producer emits local before the writer deploy (Decision 210 clause 4); the claude_code producer still emits only fixed_non_rollover_allowance (rec-4147)."}
      - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): claude_code captures are fixed_non_rollover_allowance; the producer never emits metered_marginal (rec-4147)."}
      - {date: "2026-09-28", semantic_break: false, change_class: field_add, summary: "PLAN-cli-persona-backend (Decision 206): new model_call billing-shape dimension; fixed-allowance rows carry no dollars."}
  acceptance_passed:
    type: bool
    iceberg_type: boolean
    nullable: true
    description: Whether a step's acceptance check passed. NULL for non-step kinds (or steps with no acceptance).
    semantics: A first-class self-improvement / T3-verifier signal.
    populated_by: "unproduced: rec-4600 (no producer writes it)"
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to a step's close event; field meaning unchanged."}
  exit_code:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Process exit code for a model_call node. NULL for non-model_call kinds.
    semantics: Model-call success/failure analytics.
    populated_by: "unproduced: T4.32:c1 (no producer writes it)"
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the model_call point event; field meaning unchanged."}
  time_lost_seconds:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Seconds lost to a process_event, when the producer estimates one. NULL for non-process_event kinds or when unestimated.
    semantics: >-
      A raw observed FACT (stored once, at the point event), distinct from the DERIVED friction classification a reader assigns under its governed rules file.
    populated_by: "unproduced: rec-4600 (no producer writes it)"
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): distinguished this raw observed fact from the now-derived friction classification (retired `tier` column); field's own value unchanged."}
      - {date: "2026-10-05", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-lifecycle-friction-amendment (C10): the derived classification reads the reader's governed rules file, not the rec-4032 labels table. Meaning unchanged."}
  output_capture:
    type: str
    iceberg_type: string
    nullable: true
    description: "How a tool call's output was captured: not_persisted | captured | omitted_oversize | unavailable | no_result."
    semantics: "On a tool_call close. captured = the harness persisted it and a tool_output transcript row holds it; omitted_oversize = persisted above the cap (an omission row); unavailable = persisted but unreadable; no_result = the synthetic interrupted close."
    populated_by: the claude_code producer, at the tool_call close.
    dq_intent: {required_when: {event_kind: [close], observation_type: [tool_call]}, accepted_values: {values: [not_persisted, captured, omitted_oversize, unavailable, no_result]}}
  output_bytes:
    type: int
    iceberg_type: bigint
    nullable: true
    description: "Byte length of the tool's RAW full output (the sidecar bytes when persisted, else the model-visible text's UTF-8 bytes)."
    semantics: "Streamed, never decoded. Set whenever output_capture is not_persisted, captured or omitted_oversize."
    populated_by: the claude_code producer, at the tool_call close.
    dq_intent: {required_when: {output_capture: [not_persisted, captured, omitted_oversize]}}
  output_sha256:
    type: str
    iceberg_type: string
    nullable: true
    description: "SHA-256 (lowercase hex) of the tool's RAW full output; identifies unscrubbed bytes."
    semantics: "Streamed, never decoded. Set whenever output_capture is not_persisted, captured or omitted_oversize."
    populated_by: the claude_code producer, at the tool_call close.
    dq_intent: {pattern: "^[0-9a-f]{64}$", required_when: {output_capture: [not_persisted, captured, omitted_oversize]}}
  output_lines:
    type: int
    iceberg_type: bigint
    nullable: true
    description: "Line count of the tool's RAW full output: LF bytes plus one when the last byte is not LF and the output is non-empty."
    semantics: "Streamed. Set whenever output_capture is not_persisted, captured or omitted_oversize."
    populated_by: the claude_code producer, at the tool_call close.
    dq_intent: {required_when: {output_capture: [not_persisted, captured, omitted_oversize]}}
  reasoning_visibility:
    type: str
    iceberg_type: string
    nullable: true
    description: "Form in which the provider exposed a model_call's reasoning: full | summarized | omitted | redacted | none."
    semantics: "full = raw reasoning; summarized = a provider-written summary (Claude thinking text, which can include user-facing progress updates); omitted = reasoned but the text withheld; redacted = only encrypted blocks; none = no reasoning. One value per call, the first that applies in that order of full, summarized, redacted, omitted, none."
    populated_by: the claude_code producer, at the model_call point event.
    dq_intent: {required_when: {event_kind: [point], observation_type: [model_call]}, accepted_values: {values: [full, summarized, omitted, redacted, none]}}
  reasoning_tokens:
    type: int
    iceberg_type: bigint
    nullable: true
    description: "Provider-reported reasoning token count of a model_call: a subset of tokens_output, never a fifth billing class."
    semantics: "NULL when the provider did not report it; never a local estimate."
    populated_by: the claude_code producer, at the model_call point event.
    dq_intent: {at_most: tokens_output, null_or_zero_when: {reasoning_visibility: [none]}}
  usage_final:
    type: bool
    iceberg_type: boolean
    nullable: true
    description: "Whether this model_call's four token classes are the call's final usage."
    semantics: "true when the source recorded the call as finished (Claude Code: the response record carries a stop_reason) or a final source replaced the record's usage (usage_source spawn_result); false marks the four classes as a lower bound, a snapshot taken while the response was still streaming (rec-4354), so a sum over such rows undercounts. NULL when the producer does not say (claude_code before parser_version 4). Set on model_call points only. Coverage (Decision 181 cl.2): model_call-only is not write-enforced (the grammar's null_or_zero_when reads false as 0); the claude_code producer is pinned by its tests (PLAN-telemetry-capture-producer-fixes), every other producer is an unenforced residual owned by rec-4028, and the write-time leg is owned by rec-4408."
    populated_by: the claude_code producer, at the model_call point event.
    dq_intent: {}
  usage_source:
    type: str
    iceberg_type: string
    nullable: true
    description: "Where this model_call's token classes came from: record | spawn_result."
    semantics: "record: the call's own source record. spawn_result: a sync sub-agent's last call whose own record was not final, taken from the parent's spawn result, which carries that call's final usage; used only when its three input classes equal the record's. Set on model_call points only; NULL when the producer does not say."
    populated_by: the claude_code producer, at the model_call point event.
    dq_intent: {accepted_values: {values: [record, spawn_result]}}
  requested_model:
    type: str
    iceberg_type: string
    nullable: true
    description: "The model id the caller requested for this call, when the harness records it (Claude Code: requestedModel, e.g. claude-opus-5-5[1m])."
    semantics: "model stays the id that served the call (Claude Code: message.model). Claude Code's own per-model usage ledger is keyed by the requested id, so per-model reconciliation joins on this column. NULL when not recorded."
    populated_by: the claude_code producer, at the model_call point event.
    dq_intent: {}
  reasoning_effort:
    type: str
    iceberg_type: string
    nullable: true
    description: "The reasoning-effort setting in force for this call, when the harness records it (Claude Code: effort, e.g. xhigh)."
    semantics: "A confounder for any before/after comparison of model behaviour. The set is open; a closed set would be declared here (Decision 210 cl.3). NULL when not recorded."
    populated_by: the claude_code producer, at the model_call point event.
    dq_intent: {pattern: '^[a-z][a-z0-9_-]{0,31}$'}
  cache_creation_1h_tokens:
    type: int
    iceberg_type: bigint
    nullable: true
    description: "Provider-reported cache-write tokens of this model_call with a 1-hour cache lifetime: a subset of tokens_cache_creation, never a fifth billing class."
    semantics: "Cache writes are priced by lifetime, so cost at read needs the split. NULL when the provider did not report it; never a local estimate. The pair's sum is at most tokens_cache_creation; only each column's own bound is write-enforced, because the row-rule grammar has no sum leg. Coverage (Decision 181 cl.2): the claude_code producer is pinned by its tests (PLAN-telemetry-capture-producer-fixes); every other producer is an unenforced residual owned by rec-4028; the write-time sum leg is owned by rec-4408."
    populated_by: the claude_code producer, at the model_call point event.
    dq_intent: {at_most: tokens_cache_creation}
  cache_creation_5m_tokens:
    type: int
    iceberg_type: bigint
    nullable: true
    description: "Provider-reported cache-write tokens of this model_call with a 5-minute cache lifetime: a subset of tokens_cache_creation, never a fifth billing class."
    semantics: "Cache writes are priced by lifetime, so cost at read needs the split. NULL when the provider did not report it; never a local estimate. The pair's sum is at most tokens_cache_creation; only each column's own bound is write-enforced, because the row-rule grammar has no sum leg. Coverage (Decision 181 cl.2): the claude_code producer is pinned by its tests (PLAN-telemetry-capture-producer-fixes); every other producer is an unenforced residual owned by rec-4028; the write-time sum leg is owned by rec-4408."
    populated_by: the claude_code producer, at the model_call point event.
    dq_intent: {at_most: tokens_cache_creation}
  rec_id:
    type: str
    iceberg_type: string
    nullable: true
    description: Recommendation id this observation relates to (e.g. rec-2335). NULL when not applicable.
    semantics: Optional cross-reference to ops_recommendations.id, joined tenant-locally.
    populated_by: "unproduced: held:feedback-loop-gate (no producer writes it)"
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name tenant-local joining; field meaning unchanged."}
  metadata:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      JSON object holding the type-specific attribute long-tail not promoted to a typed column (the Langfuse `metadata` map). Stored as a JSON string for schema stability across observation_types.
    semantics: >-
      By observation_type: STEP -> target_file, action, acceptance_command, diff_stat, model_escalated_from, prompt_hash; PHASE -> max_attempts, revision_count, blocking_findings_count; PROCESS_EVENT -> description, root_cause, resolution, rec_filed, detected_by; MODEL_CALL -> purpose_detail,
      prompt_hash, error. The high-value analytic fields are PROMOTED to typed columns (provider, acceptance_passed, exit_code, time_lost_seconds, the four token classes) and are NOT in this bag.
    populated_by: the claude_code producer (serialised JSON of the type-specific facts).
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): dropped rec-id/rec_filed cross-references now covered by the typed rec_id column, and updated the promoted-fields list to name the four token classes; the JSON bag's role is otherwise unchanged."}
realization:
  produced: {write_boundary: [event_id, created_timestamp, tenant_id, project_id, session_id, parent_observation_id, observation_id], claude_code: [event_kind, event_timestamp, session_started_at, source_ordinal, external_ref, entity_ref, producer, producer_version, parser_version, observation_type, name, sequence, outcome, severity, model, tokens_input, tokens_output, tokens_cache_read, tokens_cache_creation, billing_shape, output_capture, output_bytes, output_sha256, output_lines, reasoning_visibility, reasoning_tokens, usage_final, usage_source, requested_model, reasoning_effort, cache_creation_1h_tokens, cache_creation_5m_tokens, metadata]}
  unproduced: {held:feedback-loop-gate: [rec_id], T4.32:c1: [provider, persona_backend, exit_code], rec-4600: [cost_usd_reported, attempt, acceptance_passed, time_lost_seconds]}
governance:
  table_class: event
  partition_by: "history=year(session_started_at), month(session_started_at), day(session_started_at)"
  write_path: >-
    Provisioned in the production telemetry catalog (Decision 230); production writes begin at PLAN-telemetry-production-flip; the writer is rec-4024's append verb, a single append_events boundary writing telemetry_observations. Append-only; no SCD2 merge, no in-place mutation.
governance_notes: >-
  EVENT JOURNAL (Decision 199, amending Decision 95 clause 2, Decision 96 clauses 1 and 3, and Decision 97 clauses 1-4): a span-shaped observation_type (phase/step/turn/tool_call) is an open+close row PAIR sharing one derived observation_id; a point-shaped kind (process_event, model_call) is a
  single row. start/end/duration are DERIVED at read by pairing the open/close rows (data-modeling-standard.yaml derived-state rule) -- no stored started_at/ended_at/ duration_seconds columns remain (superseding contract_version 1's stored open/close pair). Friction classification (rework/exception)
  is DERIVED at read from these facts under the reader's governed rules file -- the stored `tier` column (contract_version 1) is RETIRED, along with ingested_at (superseded by the envelope's created_timestamp). classifier_version is a reader response stamp, never a column. Identity (session_id,
  parent_observation_id, observation_id) is derived at the write boundary per telemetry-event-envelope.yaml's normative hash spec. NULLABILITY AXES: a column is NOT NULL at write when `nullable` is false or dq_intent declares not_null, unless the field carries `required_when`, which then
  governs (scripts/field_semantics_event_projection.py _is_not_null); every declared rule is write-enforced (Decision 210); a staged rule is spelled with exclude_before or an owned exemption. A PK/FK $ref'd
  from a Class C baseline keeps `nullable: true` at the column axis with a declared `not_null` at the DQ axis; the event projection emits NOT NULL from the DQ axis for such keys. Provisioned in the production telemetry catalog (Decision 230). KNOWN GAPS: rec-4032 (the later
  materialised friction-labels form of the reader's rules file), rec-4031 (the cost_usd effective-dated price-mapping reader).
amendment_log:
  - {date: "2026-10-27", semantic_break: true, change_class: accepted_values_extend, summary: "PLAN-billing-shape-local (rec-4561, Decision 234 clause 4): billing_shape admits local and cost_usd derives NULL for it, operator-approved 2026-10-27; per-field changes are on their own fields' logs."}
  - {date: "2026-10-25", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-production-catalog bookkeeping: the two not-provisioned-in-production statements now say provisioned in the production telemetry catalog (Decision 230); mechanical status edit, no meaning change."}
  - {date: "2026-10-24", semantic_break: false, change_class: governance_note_add, summary: "PLAN-telemetry-field-realization (T3.20 c7): realization block (who writes each stored column, or who owns its absence); populated_by names the real writer. No column, type or rule change."}
  - {date: "2026-10-17", semantic_break: false, change_class: field_add, summary: "PLAN-telemetry-column-additions: six nullable typed columns (usage_final, usage_source, requested_model, reasoning_effort, cache_creation_1h_tokens, cache_creation_5m_tokens).", migration_story: "Nullable additions: every stored row stays valid and reads NULL; no producer emits them before PLAN-telemetry-capture-producer-fixes; the smoke tables gain them through Decision 222's owner step."}
  - {date: "2026-10-16", semantic_break: false, change_class: prose_improvement, summary: "PLAN-reader-verbs-decision-notes (rec-4324): KNOWN GAPS drops rec-4024 (its writer and reader verbs are built; the reader verbs by PLAN-telemetry-reader-verbs, #1496)."}
  - {date: "2026-10-16", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-cache-token-totals (rec-4333): the four token classes are declared disjoint (tokens_input is uncached prompt tokens only). Per-field changes are on their own fields' logs.", migration_story: "No stored row changes; see the field entries."}
  - {date: "2026-10-05", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-lifecycle-friction-amendment (feedback-loop review C10, C11, C12): severity closed and required on process_event points, name required there with its grammar a declared residual (owner rec-4176), process_event parentage declared, cost_usd inputs effective-dated, friction pointers moved off the rec-4032 labels table to the reader's rules file, and the stale enforcement/provisioning premise reworded. Per-field changes are on their own fields' logs."}
  - {date: "2026-10-04", semantic_break: false, change_class: field_add, summary: "PLAN-telemetry-write-conformance (slice 2a-1): six typed columns -- tool_call close output_capture/output_bytes/output_sha256/output_lines and model_call reasoning_visibility/reasoning_tokens -- with their required_when, pattern, at_most and null_or_zero_when rules (operator-approved 2026-09-29)."}
  - {date: "2026-09-26", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-kernel-identity-append (rec-4073, rec-4065): governance.partition_by respelled to the role-prefixed form of the calendar-day triple 'history=year(session_started_at), month(session_started_at), day(session_started_at)' (the shared ops grammar; DuckLake's bare day() is day-of-month); the generator projection delegates to parse_partition_by. No runtime migration: no live telemetry writer."}
  - {date: "2026-09-25", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-kernel-identity-append (rec-4065): governance.partition_by respelled from the bare day(session_started_at) to the calendar-day triple year(), month(), day(); DuckLake evaluates a bare day() as day-of-month. No table exists yet."}
  - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): contract.description re-grounded to the event-journal shape with the shared envelope; per-field changes are on their own fields' logs. No live writer: Phase 4 (T2.36) builds to contract_version 2."}
  - {date: "2026-08-26", semantic_break: false, change_class: prose_improvement, summary: "Platform cleanse: references to the removed trading-product surfaces and the retired pre-DuckLake query-engine estate were removed or reworded; no live DuckLake field or verb semantics changed."}
  - {date: "2026-10-15", semantic_break: false, change_class: prose_improvement, summary: "PLAN-rule-declarations-and-writer-conformance (rec-4158, Decision 210): the dq_intent `enforced` key is retired from every rule leg. not_null is declared by presence (`true`, or `{exclude_before: D}`); an optional column or a loosest-baseline field carries no not_null leg; the other legs lose the key. A declared rule is an enforced rule.", migration_story: "Declarations re-spelled only. No rule is added, removed or re-dated: the declared rule set, read through scripts.contract_rules, is identical before and after, and the generated field_semantics.yaml projection of this contract is unchanged."}
