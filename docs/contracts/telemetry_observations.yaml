---
# Class A data contract for telemetry_observations -- the UNIFIED node table of the canonical
# session-rooted trace/observation model (Decision 95 clause 2), re-grounded to the event-journal
# model at contract_version 2 (Decision 199).
# Ratified under the CD.25 pre-codegen contract ratification ritual (tier_item T0.12.6).
#
# EVENT JOURNAL: a span-shaped node (phase | step | turn | tool_call) is TWO rows sharing one
# observation_id (an open row and a close row, distinguished by event_kind); a point-shaped node
# (process_event | model_call) is ONE row, event_kind=point, carrying its facts directly. Start/end/
# duration are derived at read by pairing a span's open+close rows -- never stored. Friction
# classification is derived at read from these facts under the reader's governed rules file,
# never stored as a `tier` column.
contract:
  id: telemetry_observations
  class: A
  contract_version: 2
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 199)"
  description: >-
    Class A schema contract for telemetry_observations: an append-only EVENT JOURNAL, one row per observation LIFECYCLE EVENT. A span-shaped kind (phase | step | turn | tool_call) gets an open row and a close row sharing one derived observation_id; a point-shaped kind (process_event | model_call)
    gets one row, event_kind=point. observation_type absorbs the collapsed draft sibling tables (Decision 95) plus the T3.20 turn/tool_call kinds. Cross-cutting facts (name, model, tokens, outcome, severity) are typed columns; the type-specific long tail lives in metadata (the Langfuse `metadata`
    shape); large blobs go to telemetry_transcripts.
  projects_to:
    artifact: config/lambda/ducklake/field_semantics.yaml
    table: telemetry_observations
    generator: scripts/schema_to_field_semantics.py
    note: >-
      The event projection (scripts/field_semantics_event_projection.py) emits this table's entry from slice 2a-2 plan 1's registration onward and runs in-process before then, so no later flip is owed.
fields:
  event_id:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_id
    dq_intent_local: {not_null: true}
    governance_notes_local: Row identity for this event-journal table. Domain tag 'telemetry_observations:event'.
  event_kind:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_kind
    dq_intent_local:
      not_null: true
      accepted_values:
        values: [open, close, point]
        note: >-
          open/close for span-shaped kinds (phase, step, turn, tool_call); point for the instantaneous kinds (model_call, process_event) -- exactly one row each.
    governance_notes_local: The lifecycle/point discriminator, orthogonal to observation_type (the node KIND discriminator, below).
  event_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_timestamp
    dq_intent_local: {not_null: true}
    governance_notes_local: For a point row this is the fact's own timestamp; for a span's open/close row it is that boundary's own time.
  session_started_at:
    $ref: telemetry-event-envelope.yaml#/contract/fields/session_started_at
    dq_intent_local: {not_null: true}
  source_ordinal:
    $ref: telemetry-event-envelope.yaml#/contract/fields/source_ordinal
  external_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/external_ref
    dq_intent_local: {not_null: true}
    governance_notes_local: >-
      The hash input for this row's event_id. A model_call's external_ref is '<provider_response_id>/model_call' for every producer that observes it (see telemetry-event-envelope.yaml's GENERATIONS AND READ-SIDE DEDUPE rule, R5c, for how this still de-duplicates to one row per API response, final
      usage wins).
    amendment_log:
      - {date: "2026-09-28", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-grain-and-generations (rec-4062): retargeted the retired model_call dedupe pointer to the envelope's R5c GENERATIONS AND READ-SIDE DEDUPE rule (final usage wins)."}
  entity_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/entity_ref
    dq_intent_local: {not_null: true}
    governance_notes_local: >-
      Per observation_type: tool_call entity_ref = its toolUseId; turn entity_ref = '<session entity_ref>/<promptId>' (a sub-agent record may reuse the parent's promptId); process_event entity_ref = its own external_ref; phase/step entity_ref = the producer's own stable label for that node.
      observation_ref (below) carries this row's OWN reference when the row is instead referencing (rather than defining) an observation.
  producer:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer
    dq_intent_local: {not_null: true}
    amendment_log:
      - {date: "2026-09-28", semantic_break: true, change_class: not_null_tighten, summary: "PLAN-telemetry-grain-and-generations (Decision 207, rec-4061 R2): producer is now NOT NULL enforced -- part of the telemetry grain key."}
  producer_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer_version
  parser_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/parser_version
    dq_intent_local: {not_null: true}
  created_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/created_timestamp
    dq_intent_local: {not_null: true}
  tenant_id:
    $ref: tenant-id.yaml#/contract/fields/tenant_id
    dq_intent_local: {not_null: true}
  project_id:
    $ref: project-id.yaml#/contract/fields/project_id
    dq_intent_local: {not_null: true}
  session_id:
    $ref: session-id.yaml#/contract/fields/session_id
    dq_intent_local: {not_null: true}
    governance_notes_local: >-
      FOREIGN KEY to telemetry_sessions.session_id (the trace root). Derived using the parent's own domain tag ('telemetry_sessions:session_id') over this row's session_ref -- no propagation step. Every observation roots to a session (Decision 95 root-unification).
    joins:
      - session_id_join_telemetry_sessions_to_observations
  parent_observation_id:
    $ref: parent-observation-id.yaml#/contract/fields/parent_observation_id
    governance_notes_local: >-
      FOREIGN KEY self-reference building the in-session tree: a step's parent is its phase; a tool_call's parent is its turn. NULL = a root observation directly under the session. Derived using the enclosing node's own domain tag over this row's parent_observation_ref. A process_event's parent is
      the tool_call the hook gated when that call is in the stream, else the enclosing turn, else NULL (a root). That parentage is a cross-row fact, so it is prose only here: its DQ intent belongs to rec-4101 (Decision 210 cl.2), whose monitor, the reader's telemetry_orphan_counts verb alarmed daily by the telemetry-verification workflow, checks that the parent exists in the tree; which node a process_event parents to is a residual owned by rec-4439. The claude_code producer's gate:<check> and precommit:<hook> process_events are not hook-gated: each parents to the Bash tool_call whose output carried its marker.
      From parser_version 7 a hook process_event is ONE row per hook RUN: the twin records Claude Code writes for a stdout-printing hook run (rule HG-1: a heldContent copy and a plain copy sharing toolUseID, hookEvent, hookName, command and durationMs) never become rows, and the first copy in file order is the row. A SessionStart startup, clear or resume hook record never has an enclosing turn, so its parent is NULL even when Claude Code wrote it after a prompt record (on any surface); the DQ intent for the process_event parentage is rec-4439's (PLAN-telemetry-late-hook-records, rec-4633).
    joins:
      - parent_observation_id_join_observations_self_tree
    amendment_log:
      - {date: "2026-10-26", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-late-hook-records (rec-4633, parser_version 7): a hook process_event is one row per hook run (twins collapse, rule HG-1), and a SessionStart startup, clear or resume hook record has no enclosing turn, so its parent is NULL even when written after a prompt record; the parentage DQ intent stays with rec-4439."}
      - {date: "2026-10-18", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-verification-monitor: the rec-4101 note names its monitor (telemetry_orphan_counts, alarmed daily) and the which-node residual owned by rec-4439."}
      - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): gate and precommit process_events parent to the Bash tool_call whose output carried their marker."}
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C11): declared a process_event's parent (the gated tool_call, else the enclosing turn, else NULL); cross-row, so prose only, DQ intent owned by rec-4101."}
  observation_id:
    $ref: observation-id.yaml#/contract/fields/observation_id
    dq_intent_local: {not_null: true}
    governance_notes_local: >-
      PRIMARY entity key of this node. Both the open and close row of a span-shaped observation carry the SAME observation_id (derived from the same observation_ref) -- pairing them is how a reader derives start/end/duration.
    joins:
      - observation_id_join_observations_to_transcripts
      - observation_id_join_observations_to_agents
  observation_type:
    type: str
    iceberg_type: string
    nullable: false
    description: >-
      The node-kind discriminator: phase | step | turn | tool_call | process_event | model_call (Decision 95 collapse rule, extended with the T3.20 turn/tool_call kinds -- their field additions are realized: turn open and close carry sequence; tool_call open carries name, sequence and model, its close name, sequence, outcome, output_capture, output_bytes, output_sha256 and output_lines. The writer enforces each column's type, outcome and output_capture as required on a tool_call close with closed value sets, output_bytes, output_sha256 (hex pattern) and output_lines as required whenever output_capture names a readable output, all from this contract (Decision 210 cl.1)).
    semantics: >-
      Required discriminator. Open to accepted_values_extend for new node kinds, never silently narrowed. "span" is deliberately NOT a value (lexicon: use "observation").
      TURN CLOSES (claude_code, parser_version 5): one close per usable Stop witness keyed on the witness record, an API-error record closes its own turn, and the boundary close is keyed on the turn's last uuid and timestamp record and emitted only when no usable closing event lies at or after the turn's last assistant record, each close keyed on the record that ends its window (a boundary close's timestamp now includes the turn's trailing records, such as Stop summaries and compaction groups before the next prompt, so turn open-to-close durations of re-emitted history shift). A turn's open row lands once its prompt is on disk.
    populated_by: the claude_code producer, per event_kind.
    dq_intent:
      not_null: true
      accepted_values:
        values: [phase, step, turn, tool_call, process_event, model_call]
        note: Open to accepted_values_extend, never silent narrowing.
    amendment_log:
      - {date: "2026-10-18", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-stop-turn-close (parser_version 5): turn closes per Stop witness, API-error self-close, boundary close rekeyed on the turn's last uuid and timestamp record, and the early turn open row.", migration_story: "Parser v5 re-parses every tree from the start; v4 rows are superseded by version, never rewritten."}
      - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): the realized turn/tool_call field set replaces the 'T3.20's build' residual."}
      - {date: "2026-09-24", semantic_break: true, change_class: accepted_values_extend, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): extended accepted_values with turn and tool_call (T3.20's own field additions for those kinds are out of this plan's scope)."}
  name:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Human-readable label for the node: the phase name, the step title, the model purpose (label only -- see telemetry_agents/model for the model dimension), or the process_event CATEGORY.
    semantics: >-
      For process_event, name follows the grammar '<source>:<signature>' (e.g. hook:never_on_main, gate:validate_scope_boundary) -- the stable signature the reader's friction rules match against (the governed rules file in its named-read registry, owned by 2b), replacing the retired stored `tier`
      column. name is required on process_event points. The grammar is write-enforced by dq_intent.pattern_when (Decision 210 cl.1), scoped to process_event rows so tool_call and model_call names stay unconstrained: the source is hook, gate, precommit or status, and a new source ships as a contract amendment plus a writer deploy before any producer emits it (cl.4). The claude_code producer emits gate:<check> and precommit:<hook> only from structured markers in a Bash tool_call's full output (validation markers, pre-commit's own per-hook failure lines), parented to that tool_call, with role gate_event.<n>; never from free text. From parser_version 6 the claude_code producer also emits status:<source>.skipped (severity warning) and status:<source>.failed (severity error) from STATUS v1 lines in the last 200 output lines of a Bash tool_call whose command names a repo CLI (-m scripts. or scripts/), with role gate_event.<n>; done emits nothing, the reason is never stored, and a source over 192 characters is dropped and counted (status_source_too_long). Known gaps, declared here: an echoed or printed whole STATUS line inside such a command's output mints a row; until the reader's friction rules gain a status row (rec-4605) r91 labels a status warning hook_fault and r90 a status error unmapped_block.
    populated_by: the claude_code producer.
    dq_intent: {required_when: {event_kind: [point], observation_type: [process_event]}, pattern_when: [{when: {observation_type: [process_event]}, pattern: '^(hook|gate|precommit|status):[A-Za-z0-9_][A-Za-z0-9_.-]{0,199}$'}]}
    amendment_log:
      - {date: "2026-10-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-retire-session-cli (rec-4589, Decision 210 cl.4): the process_event name source list gains status, so the writer accepts status:<source>.<result> before any producer emits it; the parser_version 6 rows and the two known gaps are named in semantics. The rule is widened, never narrowed.", migration_story: "census: 0 violators (2026-10-24); the widening has no violators by construction and the merge deploys the writer before any producer can emit the source."}
      - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): gate:<check> and precommit:<hook> derive from structured markers only, in a Bash tool_call's full output."}
      - {date: "2026-09-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): declared the process_event name grammar '<source>:<signature>' as the friction-classification read input, replacing the retired stored `tier` column. semantic_break=true: name now carries load-bearing derivation-input meaning it did not carry before.", migration_story: "No live populator existed; the Phase 4 rebuild (T2.36) and rec-4032's labels table build directly to this grammar."}
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C11): name is required on process_event points; the grammar stays in semantics with a declared residual (not write-enforced; owner rec-4176); the friction read input is the reader's rules file, not the rec-4032 labels table."}
      - {date: "2026-10-06", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-process-event-name-rule (rec-4176, Decision 210 cl.1): the process_event name grammar is now write-enforced through dq_intent.pattern_when, scoped to process_event rows, with the closed source list hook, gate and precommit; the C11 residual is closed. Operator approval 2026-10-06."}
  sequence:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Ordinal position of the node among its siblings under the same parent (0/1-based).
    semantics: Deterministic sibling ordering independent of ULID time-order. Null for kinds without an intrinsic order (process_event, model_call).
    populated_by: the claude_code producer.
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the write-boundary model; field meaning unchanged."}
  outcome:
    type: str
    iceberg_type: string
    nullable: true
    description: "Disposition of the node where applicable: success | error | blocked | interrupted."
    semantics: >-
      Required on a tool_call's close row (the one kind with a mandatory terminal disposition in this model); optional elsewhere. Stored on each close row that observes it. An observation's current disposition, and the close its duration pairs with, is its latest close by event_timestamp, then source_ordinal, then event_id (the telemetry_sessions state ordering). A sub-agent's synthetic close at a finalization cut is not evidence that its agent run ended; the run's state is telemetry_agents'. From parser_version 5 claude_code turn closes carry it (success | error | interrupted per rule WT-6; still optional at write, no new value and no required_when).
    populated_by: the claude_code producer, at close for span-shaped kinds.
    dq_intent:
      required_when: {event_kind: [close], observation_type: [tool_call]}
      accepted_values: {values: [success, error, blocked, interrupted]}
    amendment_log:
      - {date: "2026-10-18", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-stop-turn-close (parser_version 5): claude_code turn closes carry outcome (success | error | interrupted); optional at write, no value added, the writer unchanged (Decision 210).", migration_story: "Parser v5 re-parses every tree from the start; v4 turn closes without outcome are superseded by version, never rewritten."}
      - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): stored on each close row that observes it; the latest close is the current disposition (a re-anchored entity carries two closes). No outcome value is added."}
      - {date: "2026-09-24", semantic_break: true, change_class: accepted_values_narrow, summary: "PLAN-telemetry-event-journal-contracts: accepted_values narrowed from the open \"running | success | failed\" phase/step vocabulary to the closed {success, error, blocked, interrupted} set, required specifically on a tool_call's close row (dq_intent.required_when). semantic_break=true: the vocabulary and its enforcement scope both changed.", migration_story: "No live populator existed; rec-4024 builds directly to this shape."}
  severity:
    type: str
    iceberg_type: string
    nullable: true
    description: "Severity/level for kinds that carry one: info | warning | error | critical (process_event). NULL otherwise."
    semantics: The Langfuse `level` concept. A closed set [info, warning, error, critical], required on process_event points and write-enforced from this contract (Decision 210 cl.3); the reader's friction rules key on it.
    populated_by: the claude_code producer.
    dq_intent: {required_when: {event_kind: [point], observation_type: [process_event]}, accepted_values: {values: [info, warning, error, critical]}}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the write-boundary model; field meaning unchanged."}
      - {date: "2026-10-05", semantic_break: true, change_class: accepted_values_narrow, summary: "PLAN-telemetry-lifecycle-friction-amendment (C11): severity is now closed to [info, warning, error, critical] and required on process_event points, write-enforced; the open-set premise is dropped. The v2 producer emits only info, warning or error."}
  model:
    type: str
    iceberg_type: string
    nullable: true
    description: The model that produced this node, where applicable (e.g. claude-opus-4-8).
    semantics: >-
      Per-node model attribution; the session headline is telemetry_sessions.model_primary and the agent dimension is telemetry_agents.model.
    populated_by: the claude_code producer.
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the write-boundary model; field meaning unchanged."}
  tokens_input:
    type: int
    iceberg_type: bigint
    nullable: true
    description: "Uncached input (prompt) tokens for this model_call: the prompt tokens the provider reports as neither a cache read nor a cache write, stored once on its single point row."
    semantics: "One of the four token classes stored on model_call (Decision 199, replacing the phase/step roll-up path). bigint. The four token classes are disjoint. tokens_input excludes tokens_cache_read and tokens_cache_creation, so a model_call's total prompt is tokens_input + tokens_cache_read + tokens_cache_creation, derived at read and never stored. An inclusive export such as OpenTelemetry's gen_ai.usage.input_tokens is that sum. Anthropic's input_tokens already means this; a producer for a provider that reports an inclusive prompt total subtracts the cached tokens it reports (rec-4028 owns the per-provider mapping). Coverage (Decision 181 cl.2): the claude_code producer's one-to-one mapping is enforced by tests/turn_capture/test_observations.py; every other producer is an unenforced residual owned by rec-4028; the writer cannot decide disjointness from one row (Decision 210 cl.1)."
    populated_by: the claude_code producer, at the model_call point event.
    dq_intent:
      required_when: {event_kind: [point], observation_type: [model_call]}
    amendment_log:
      - {date: "2026-10-16", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-cache-token-totals (rec-4333): the four token classes are disjoint; tokens_input is uncached prompt tokens only and total prompt is the sum of the three, derived at read.", migration_story: "No stored row changes: the claude_code producer already copies Anthropic usage, whose input_tokens excludes cache reads and writes, and the only reader, agent_run_token_rollup, already sums tokens_input as stored, so no existing verb output value changes."}
      - {date: "2026-09-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): population narrowed from the retired phase/step token roll-up path to the model_call point row only; added dq_intent.required_when."}
  tokens_output:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Output/completion tokens for this model_call.
    semantics: One of the four token classes stored on model_call. bigint.
    populated_by: the claude_code producer, at the model_call point event.
    dq_intent:
      required_when: {event_kind: [point], observation_type: [model_call]}
    amendment_log:
      - {date: "2026-09-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): population narrowed from the retired phase/step token roll-up path to the model_call point row only; added dq_intent.required_when."}
  tokens_cache_read:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Cache-read tokens for this model_call.
    semantics: "NEW token class (Decision 199) -- one row per provider response id needs all four classes to reconcile provider-reported cost. bigint. Prompt tokens served from the provider's prompt cache; disjoint from tokens_input and tokens_cache_creation (see tokens_input). A provider with no cache-read class records 0."
    populated_by: the claude_code producer, at the model_call point event.
    dq_intent:
      required_when: {event_kind: [point], observation_type: [model_call]}
    amendment_log:
      - {date: "2026-10-16", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-cache-token-totals (rec-4333): the four token classes are disjoint; tokens_input is uncached prompt tokens only and total prompt is the sum of the three, derived at read.", migration_story: "No stored row changes: the claude_code producer already copies Anthropic usage, whose input_tokens excludes cache reads and writes, and the only reader, agent_run_token_rollup, already sums tokens_input as stored, so no existing verb output value changes."}
  tokens_cache_creation:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Cache-creation tokens for this model_call.
    semantics: "NEW token class (Decision 199), the fourth of the four classes stored once per model_call. bigint. Prompt tokens written to the provider's prompt cache; disjoint from tokens_input and tokens_cache_read (see tokens_input). A provider with no cache-write class records 0."
    populated_by: the claude_code producer, at the model_call point event.
    dq_intent:
      required_when: {event_kind: [point], observation_type: [model_call]}
    amendment_log:
      - {date: "2026-10-16", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-cache-token-totals (rec-4333): the four token classes are disjoint; tokens_input is uncached prompt tokens only and total prompt is the sum of the three, derived at read.", migration_story: "No stored row changes: the claude_code producer already copies Anthropic usage, whose input_tokens excludes cache reads and writes, and the only reader, agent_run_token_rollup, already sums tokens_input as stored, so no existing verb output value changes."}
  cost_usd_reported:
    type: float
    iceberg_type: double
    nullable: true
    description: Provider-reported cost in USD for this model_call, when the provider reports one. NULL otherwise.
    semantics: >-
      STORED only when a provider reports it (Decision 199); see cost_usd below for the derived, always-computable value this row also carries.
    populated_by: "unproduced: rec-4600 (no producer writes it)"
    dq_intent: {}
  cost_usd:
    type: float
    iceberg_type: double
    nullable: true
    description: >-
      Cost in USD for this model_call, DERIVED at read from a static price-per-token mapping (rec-4031) over the four stored token classes. NULL for non-model_call kinds.
    semantics: >-
      Preferred read: cost_usd_reported when the provider reported one (authoritative), else this derived value (MVP static price table, rec-4031) -- both are always available on a model_call point row so a reader can choose either without a second query. No physical column. A billing_shape
      fixed_non_rollover_allowance row (Decision 206) or local row (Decision 234 clause 4) derives NULL whatever cost_usd_reported it stores, never a 0: neither is a metered spend, and shadow dollars are never a spend (Decision 217 clause 4). The price table is effective-dated (rec-4031): the price applied is the one in force at the row's event_timestamp for its model and provider.
    populated_by: a named reader verb (rec-4031), applied to a model_call row's stored token classes.
    dq_intent: {}
    derivation: {timing: read, derived_by: "reader_verb:model_call_cost_estimate", formula: "CASE WHEN billing_shape IN ('fixed_non_rollover_allowance', 'local') THEN NULL ELSE COALESCE(cost_usd_reported, static_price_table(model, provider, effective at event_timestamp) applied to tokens_input/tokens_output/tokens_cache_read/tokens_cache_creation) END", inputs: [cost_usd_reported, model, provider, event_timestamp, tokens_input, tokens_output, tokens_cache_read, tokens_cache_creation, billing_shape], realized: false}
    amendment_log:
      - {date: "2026-10-27", semantic_break: true, change_class: governance_note_add, summary: "PLAN-billing-shape-local (rec-4561): a local model_call derives cost_usd NULL, as an allowance row does, ahead of any stored cost_usd_reported.", migration_story: "No stored row changes; the model_call_cost_estimate verb reports such a row with cost_source local."}
      - {date: "2026-09-28", semantic_break: true, change_class: governance_note_add, summary: "PLAN-cli-persona-backend (Decision 206): population narrowed -- a fixed_non_rollover_allowance model_call derives no dollar cost.", migration_story: "No live telemetry writer or rec-4031 reader exists (TARGET-STATE); both build to this shape."}
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C12, rec-4031): the price table is effective-dated; derivation inputs add event_timestamp and provider."}
  attempt:
    type: int
