---
# Class A data contract for telemetry_persona_findings: what a verdict persona run found (rec-4434).
# A DERIVED relation, computed at read from a persona run's result; no physical table holds it (Decision 199 cl.1,
# data-modeling-standard.yaml rule derived-state). Finding text stays content in telemetry_transcripts (CD.51).
contract:
  id: telemetry_persona_findings
  class: A
  contract_version: 2
  status: draft
  description: >-
    Class A schema contract for telemetry_persona_findings: one row per (lane, run_ref, finding_ordinal, projection_version) of a
    verdict persona run (code_reviewer, plan_critic, decision_scout), derived at read from the run's result. Ordinal 0 is the
    run's verdict row, present on every run, so a run with no findings keeps its verdict; ordinals 1..N are the run's
    findings in result order. The run's identity (agent_type, definition_sha256) is read from its telemetry_agents
    rows, never re-derived. Finding text is never a field. Consumers: the dual-run agreement measure (T4.28 c5, T4.29
    c4, T4.30 c4) and the offline persona-evaluation lane (T4.14, Decision 231 cl.2).
fields:
  tenant_id:
    $ref: tenant-id.yaml#/contract/fields/tenant_id
    dq_intent_local: {}
    governance_notes_local: >-
      The run's telemetry_agents.tenant_id, read, never re-derived (Decision 200). NULL is allowed on lane actions only: a
      row read from a check run carries none until rec-5551 sends the run's rows (dated deferral, see governance_notes).
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the run's telemetry_agents.tenant_id", inputs: [telemetry_agents.tenant_id], realized: false}
  project_id:
    $ref: project-id.yaml#/contract/fields/project_id
    dq_intent_local: {}
    governance_notes_local: >-
      The run's telemetry_agents.project_id, read, never re-derived (Decision 200). NULL is allowed on lane actions only
      (dated deferral, see governance_notes).
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the run's telemetry_agents.project_id", inputs: [telemetry_agents.project_id], realized: false}
  agent_run_id:
    type: str
    iceberg_type: string
    nullable: false
    description: The verdict persona run this row belongs to; telemetry_agents.agent_run_id. NULL on lane actions only.
    semantics: >-
      Foreign key to telemetry_agents.agent_run_id on lane in_session; NULL on lane actions until rec-5551 sends the run's
      rows (the writer derives it from tenant, project and entity_ref, so a client never can). The grain key is run_ref.
    populated_by: the projection (scripts/persona_contracts/findings.py), copied from the run's telemetry_agents rows.
    dq_intent: {}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the run's telemetry_agents.agent_run_id", inputs: [telemetry_agents.agent_run_id], realized: false}
    amendment_log:
      - {date: "2026-11-27", semantic_break: true, change_class: governance_note_add, summary: "PLAN-persona-findings-actions-lane (rec-5742): NULL on lane actions until rec-5551; the grain key is run_ref."}
  finding_ordinal:
    type: int
    iceberg_type: bigint
    nullable: false
    description: 0 for the run's verdict row; 1..N for its findings, in the order the result lists them.
    semantics: >-
      Findings are numbered from 1 across the persona's finding lists, in the order kind's semantics names them, then
      in list order. A run whose result cannot be parsed has only ordinal 0.
    populated_by: the projection (scripts/persona_contracts/findings.py).
    dq_intent: {not_null: true}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "0 for the verdict row, else the finding's 1-based position across the persona's finding lists", inputs: [telemetry_transcripts.content], realized: false}
  agent_type:
    type: str
    iceberg_type: string
    nullable: false
    description: The run's persona registry key (code-review, plan-critique, decision-scout); telemetry_agents.agent_type.
    semantics: The verdict persona's registry_key from docs/contracts/executor-personas.yaml, read from the run's rows (rec-4433).
    populated_by: the projection (scripts/persona_contracts/findings.py), copied from the run's telemetry_agents rows.
    dq_intent: {not_null: true, accepted_values: {values: [code-review, plan-critique, decision-scout]}}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the run's telemetry_agents.agent_type", inputs: [telemetry_agents.agent_type], realized: false}
  definition_sha256:
    type: str
    iceberg_type: string
    nullable: true
    description: The hash of the persona definition the run loaded; telemetry_agents.definition_sha256.
    semantics: >-
      Read from the run's rows (rec-4433), never recomputed. A change of value starts a new dual-run window (T4.28
      c5). NULL only where the run's own rows carry none.
    populated_by: the projection (scripts/persona_contracts/findings.py), copied from the run's telemetry_agents rows.
    dq_intent: {pattern: "^[0-9a-f]{64}$"}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the run's telemetry_agents.definition_sha256", inputs: [telemetry_agents.definition_sha256], realized: false}
  lane:
    type: str
    iceberg_type: string
    nullable: false
    description: "Which lane ran the persona: in_session (a sub-agent run) or actions (a top-level verdict job run)."
    semantics: in_session when the run is telemetry_agents run_shapes.sub_agent; actions when it is run_shapes.top_level.
    populated_by: the projection (scripts/persona_contracts/findings.py), from the run's shape.
    dq_intent: {not_null: true, accepted_values: {values: [in_session, actions]}}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "in_session when observation_id is set, else actions", inputs: [telemetry_agents.observation_id], realized: false}
  kind:
    type: str
    iceberg_type: string
    nullable: false
    description: "verdict on ordinal 0; otherwise which list of the result the finding came from: finding, contradiction, spirit, roadmap or cite."
    semantics: >-
      finding for code_reviewer and plan_critic findings; contradiction, spirit, roadmap and cite for decision_scout's
      contradictions, spirit, roadmap.rows and cite lists, in that order.
    populated_by: the projection (scripts/persona_contracts/findings.py).
    dq_intent: {not_null: true, accepted_values: {values: [verdict, finding, contradiction, spirit, roadmap, cite]}}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the result list the item came from", inputs: [telemetry_transcripts.content], realized: false}
  verdict:
    type: str
    iceberg_type: string
    nullable: true
    description: The run's verdict, repeated on every row of the run; the persona contract's verdict enum.
    semantics: >-
      The value of the result's verdict, which the persona's contract (docs/contracts/personas/<persona>.yaml
      output_schema.properties.verdict) enumerates; never normalised across personas. NULL when parse_status is not
      parsed or run_outcome is persona_failure.
    populated_by: the projection (scripts/persona_contracts/findings.py).
    dq_intent: {accepted_values: {values: [PROCEED, REVISE, NO_FLAGS, FLAGS_FOUND, BLOCK]}}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "result.verdict", inputs: [telemetry_transcripts.content], realized: false}
    amendment_log:
      - {date: "2026-11-27", semantic_break: true, change_class: governance_note_add, summary: "PLAN-persona-findings-actions-lane (rec-5742): NULL also when run_outcome is persona_failure."}
  finding_id:
    type: str
    iceberg_type: string
    nullable: true
    description: The finding's own id from the result; NULL on the verdict row.
    semantics: >-
      The item's id where the persona contract defines one (code_reviewer and plan_critic findings, decision_scout
      contradictions and spirit flags, roadmap rows); cite:<decision> for a cite entry. Matching across lanes uses it.
    populated_by: the projection (scripts/persona_contracts/findings.py).
    dq_intent: {}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the item's id as this field's semantics maps it", inputs: [telemetry_transcripts.content], realized: false}
  severity:
    type: str
    iceberg_type: string
    nullable: true
    description: The finding's persona-native severity; NULL on the verdict row and on a cite entry.
    semantics: >-
      Critical, High, Medium or Low for code_reviewer; blocking or nit for plan_critic; BLOCK, WARN or NOTE for a
      decision_scout contradiction, WARN or NOTE for a spirit flag; CONFLICT, CITE or RELATED (the lane) for a roadmap
      row. Never normalised: a cross-persona scale is the consumer's measure.
    populated_by: the projection (scripts/persona_contracts/findings.py).
    dq_intent: {accepted_values: {values: [Critical, High, Medium, Low, blocking, nit, BLOCK, WARN, NOTE, CONFLICT, CITE, RELATED]}}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the item's severity as this field's semantics maps it", inputs: [telemetry_transcripts.content], realized: false}
  origin:
    type: str
    iceberg_type: string
    nullable: true
    description: "mechanical or judgement, where the persona tags it (code_reviewer, plan_critic findings); else NULL."
    semantics: mechanical means a deterministic check could have caught the finding; judgement means it could not.
    populated_by: the projection (scripts/persona_contracts/findings.py).
    dq_intent: {accepted_values: {values: [mechanical, judgement]}}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the item's origin as this field's semantics maps it", inputs: [telemetry_transcripts.content], realized: false}
  anchor:
    type: str
    iceberg_type: string
    nullable: true
    description: Where the finding points; NULL on the verdict row.
    semantics: >-
      file:line for code_reviewer; a plan field path or verification step id for plan_critic; dec:<decision> for a
      decision_scout contradiction or cite, the target for a spirit flag, the roadmap item for a roadmap row.
    populated_by: the projection (scripts/persona_contracts/findings.py).
    dq_intent: {}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the item's anchor as this field's semantics maps it", inputs: [telemetry_transcripts.content], realized: false}
  subject_sha:
    type: str
    iceberg_type: string
    nullable: true
    description: The commit the run judged, as the result reports it; NULL when the result names none.
    semantics: >-
      actions lane: the persona input's head_sha. in_session lane: the HEAD the skill reports in its result block,
      which may sit under uncommitted changes (subject_dirty). Mapping a run to a pull request head belongs to the
      dual-run comparison tool (PLAN-code-reviewer-add-dual-run), not to this relation.
    populated_by: the projection (scripts/persona_contracts/findings.py).
    dq_intent: {pattern: "^[0-9a-f]{40}$"}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "result.subject_sha", inputs: [telemetry_transcripts.content], realized: false}
  subject_dirty:
    type: bool
    iceberg_type: boolean
    nullable: true
    description: True when the in-session run judged a working tree with uncommitted changes over subject_sha; NULL when unknown.
    semantics: Reported by the in-session skill's result block; false on the actions lane, which reads a commit.
    populated_by: the projection (scripts/persona_contracts/findings.py).
    dq_intent: {}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "result.subject_dirty", inputs: [telemetry_transcripts.content], realized: false}
  parse_status:
    type: str
    iceberg_type: string
    nullable: false
    description: "How the run's result was read: parsed, block_absent, block_invalid or content_unavailable."
    semantics: >-
      parsed: the result validated against the persona's projected schema. block_absent: the text holds no result
      block. block_invalid: a block is present but fails validation. content_unavailable: no text was readable (absent,
      withheld or outside the read window). Any status but parsed yields only the verdict row, with verdict NULL; a
      run is never dropped. A persona failure (run_outcome persona_failure) is parsed, ordinal 0 only, verdict NULL.
    populated_by: the projection (scripts/persona_contracts/findings.py).
    dq_intent: {not_null: true, accepted_values: {values: [parsed, block_absent, block_invalid, content_unavailable]}}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the outcome of reading the result", inputs: [telemetry_transcripts.content], realized: false}
    amendment_log:
      - {date: "2026-11-27", semantic_break: true, change_class: governance_note_add, summary: "PLAN-persona-findings-actions-lane (rec-5742): names the persona_failure case (parsed, ordinal 0 only, verdict NULL)."}
  projection_version:
    type: int
    iceberg_type: bigint
    nullable: false
    description: The version of the projection that produced the row; part of the grain key.
    semantics: >-
      Raised whenever the projection's output for the same input changes. Readers pin a version or take the latest;
      the persona's own format version is its definition_sha256.
    populated_by: the projection (scripts/persona_contracts/findings.py PROJECTION_VERSION).
    dq_intent: {not_null: true}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "PROJECTION_VERSION", inputs: [], realized: false}
  source_event_id:
    type: str
    iceberg_type: string
    nullable: true
    description: The telemetry_transcripts event_id of the row whose text the projection read; NULL when none was read.
    semantics: >-
      The way back to the finding text, which this relation never carries: a reader with the right grant fetches it
      through the masked content reader (Decision 239). NULL when the result came from a validated run_persona result
      rather than stored text.
    populated_by: the projection (scripts/persona_contracts/findings.py), from its caller.
    dq_intent: {}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the caller's transcript event_id", inputs: [telemetry_transcripts.event_id], realized: false}
  run_ref:
    type: str
    iceberg_type: string
    nullable: false
    description: The run's telemetry_agents.entity_ref, the same string on both lanes; with lane, finding_ordinal and projection_version the grain key.
    semantics: >-
      litellm:gha:<run_id>/<run_attempt>/<job>/<retry_ordinal>/run on an Actions run, equal to the run's telemetry_agents
      entity_ref and rendered by the same functions on both lanes; the in-session run's entity_ref otherwise.
    populated_by: the projection (scripts/persona_contracts/findings.py), from its caller (a run's rows, or the check run's findings line).
    dq_intent: {not_null: true}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the run's telemetry_agents.entity_ref", inputs: [telemetry_agents.entity_ref], realized: false}
  run_outcome:
    type: str
    iceberg_type: string
    nullable: false
    description: "How the run ended: verdict, persona_failure, host_failure or unreadable."
    semantics: >-
      verdict: the result parsed. persona_failure: the persona returned a schema-valid failure object (failure_id names it).
      host_failure: the run produced no usable result (no result, timeout, non-zero exit, unparseable or schema-invalid
      output). unreadable: an in-session block that could not be read.
    populated_by: the projection (scripts/persona_contracts/findings.py), from its caller.
    dq_intent: {not_null: true, accepted_values: {values: [verdict, persona_failure, host_failure, unreadable]}}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "how the result was read and how the run ended", inputs: [telemetry_transcripts.content], realized: false}
  failure_id:
    type: str
    iceberg_type: string
    nullable: true
    description: The failure the run reported; NULL unless run_outcome is persona_failure or host_failure.
    semantics: The persona contracts own the ids (the failure enum of each output_schema, the judge failure class); no accepted_values here.
    populated_by: the projection (scripts/persona_contracts/findings.py), from its caller.
    dq_intent: {}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the failure id the caller read", inputs: [telemetry_transcripts.content], realized: false}
  served_model:
    type: str
    iceberg_type: string
    nullable: true
    description: The model that served the run, as the run's close row records it.
    semantics: >-
      actions: the findings line's served_model, the run-close model (the last events turn's record model; served_models is the sorted set and is never read for it). in_session: NULL in v2 (model-call
      rows are not fetched; owner rec-5743).
    populated_by: the projection (scripts/persona_contracts/findings.py), from its caller.
    dq_intent: {}
    derivation: {timing: read, derived_by: "library:scripts.persona_contracts.findings.project_result", formula: "the run-close model", inputs: [telemetry_agents.model], realized: false}
governance_notes: >-
  DERIVED RELATION: no physical table holds these rows; every field is derived at read (Decision 199 cl.1) by the named
  library function scripts.persona_contracts.findings.project_result, which takes a run's identity and either its
  final response text or a run_persona result already validated against the persona's output_schema, and returns the
  rows. It reads the PERSONA_RESULT block (one line, block_marker then one JSON object) from text, validates it against
  the persona contract's output_schema restricted to the verdict and the finding-list fields these field semantics name, and never raises. The
  multi-run read is the client read path scripts.persona_contracts.findings_read (both lanes, read-only), a reader verb
  replacing it on the measured-read-cost trigger (Decision 199 cl.1 deferral); until then realized is false. ACTIONS LANE
  (rec-5742): the interim source is the findings line '<!-- persona-verdict-findings v1 {...} -->' in the verdict-App
  check run's text, read through the verdict_plane's Checks API with no named verb until rec-5551 moves actions rows onto
  the telemetry verbs (NS.5 deferral); a later warehouse copy is a rebuildable derived table (Decision 221). DEFERRAL
  2026-11-27 (Decision 200 cl.2, owner rec-5551): tenant_id, project_id and agent_run_id are NULL on rows read from a check
  run until rec-5551 sends the run's rows with writer-minted ids; never computed client-side, and consumers never join
  actions rows on those three fields. DEBTS: the finding-id check is loose (types and enums, not id patterns); decision_scout
  anchor forms vary by list; subject_dirty is NULL on actions; in-session served_model is NULL in v2 (owner rec-5743).
  The in-session read horizon is 90 days (Decision 239). MATERIALIZATION (T2.52 c1): a physical copy is built only
  on a named trigger: the offline evaluation lane T4.14 opening (it needs history beyond the content reader's 90
  days), or a measured read cost
  (Decision 199's derived-read-too-costly). A verdict workflow whose content_policy is withheld is no trigger: the check
  run's findings line is that workflow's interim actions source until rec-5551, so no physical copy falls due. Such a copy is a rebuildable derived table, keyed by this grain and
  projection_version, never a second journal (Decision 221). CAPTURE ONLY: no write-time filtering, no gating; never
  process_event rows. PERSONA FORMAT: the persona contracts own the result shape; a skill or contract change that
  alters it changes the run's definition_sha256, and the projection follows by a new projection_version.
amendment_log:
  - {date: "2026-11-17", semantic_break: false, change_class: field_add, summary: "PLAN-persona-findings-contract (rec-4434, Decisions 199, 200, 231): first authoring: the derived relation, its grain, fields and materialization triggers.", migration_story: "New derived relation; no stored row exists."}
  - {date: "2026-11-27", semantic_break: true, change_class: field_add, summary: "PLAN-persona-findings-actions-lane (rec-5742): grain now (lane, run_ref, finding_ordinal, projection_version); fields run_ref, run_outcome, failure_id, served_model added; tenant_id, project_id and agent_run_id NULL on lane actions (dated deferral, owner rec-5551); projection_version 2.", migration_story: "Derived relation with no stored row; readers pin projection_version 2."}
previous_versions: []
