---
# Class A data contract for telemetry_sessions -- the trace ROOT table of the canonical
# session-rooted trace/observation model (Decision 95 clause 1), re-grounded to the event-journal
# model at contract_version 2 (Decision 199).
# Ratified under the CD.25 pre-codegen contract ratification ritual (tier_item T0.12.6).
#
# EVENT JOURNAL (Decision 199): one row per session LIFECYCLE EVENT (open | resume | compact |
# close | annotate), not one mutated row per session. Session STATE (running, abandoned or a
# terminal outcome) and DURATION are derived at read by a named reader verb over a session's own
# rows -- never stored, never mutated in place. GREENFIELD: the tables are provisioned in the
# production telemetry catalog (Decision 230), empty; the write-time rules project from this contract (Decision 210).
contract:
  id: telemetry_sessions
  class: A
  contract_version: 2
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 199)"
  description: >-
    Class A schema contract for telemetry_sessions, the trace ROOT: an append-only EVENT JOURNAL, one row per session lifecycle event (open | resume | compact | close | annotate), keyed by the shared telemetry-event-envelope.yaml fields plus session_id. Root-unification anchor (Decision 95): every
    telemetry row traces back to a session via session_id; a spawned sub-agent gets its OWN session linked to the spawner via parent_session_id. Session state, duration and friction are DERIVED AT READ from a session's own event rows (Decision 199) -- never stored as a mutable column. Partitioned by
    the calendar-day triple year(session_started_at), month(session_started_at), day(session_started_at) (Decision 96 cl.1, re-grounded; rec-4065: DuckLake's day() alone is day-of-month).
  projects_to:
    artifact: config/lambda/ducklake/field_semantics.yaml
    table: telemetry_sessions
    generator: scripts/schema_to_field_semantics.py
    note: >-
      The event projection (scripts/field_semantics_event_projection.py) emits this table's entry from slice 2a-2 plan 1's registration onward and runs in-process before then, so no later flip is owed.
fields:
  event_id:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_id
    dq_intent_local:
      not_null: true
    governance_notes_local: Row identity for this event-journal table. Domain tag 'telemetry_sessions:event'.
  event_kind:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_kind
    dq_intent_local:
      not_null: true
      accepted_values:
        values: [open, resume, compact, close, annotate]
        note: >-
          The session lifecycle vocabulary. "running" is not a stored value anywhere -- it is derived (see `state` and the SESSION STATE paragraph of governance_notes): a root session's state is read from its turns and its latest lifecycle row (Decision 228, see `state`), and a resume after a close makes it running again.
    governance_notes_local: >-
      Tightened NOT NULL: every telemetry_sessions row states its lifecycle position. compact records a context-compaction event mid-session (a new capability this event-journal shape makes representable, where mint-once-and-mutate could not). The producer's open row is its GENERATION COMMIT MARKER
      (Decision 207, telemetry-event-envelope.yaml R3/R5). claude_code resume rows (parser_version 4, rule SC-3) are due once their SessionStart:resume hook group has ended (a later prompt or assistant record), so a session ending inside a resume hook group gets no row for that resume.
    amendment_log:
      - date: "2026-09-28"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-grain-and-generations (rec-4061 R3): named the open row as the producer's generation commit marker, pointing at the envelope's GENERATIONS AND READ-SIDE DEDUPE rule.
      - {date: "2026-10-18", semantic_break: false, change_class: governance_note_add, summary: "PLAN-telemetry-read-side-session-end (Decision 228): the vocabulary note points a root session's running or terminal state at its turns (see state)."}
  event_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_timestamp
    dq_intent_local:
      not_null: true
    governance_notes_local: >-
      For the open event this EQUALS session_started_at; for resume/compact/close/annotate it is that event's own source-derived time. A sub-agent session's open row carries the ROOT start (session_started_at is the tree's pin), so a child's own start is its telemetry_agents open row. A close row's
      event_timestamp is that of the last root-stream record carrying a uuid and a parseable timestamp at that finalization. duration_seconds (derived) is the latest close's event_timestamp (the later of the producer close and any root turn close) minus session_started_at, wall-clock. From parser_version 4 a segment close (SC-1) carries the anchor of the last root record before its resume boundary.
    amendment_log:
      - {date: "2026-10-18", semantic_break: false, change_class: governance_note_add, summary: "PLAN-telemetry-read-side-session-end (Decision 228): duration_seconds' latest close is the later of the producer close and any root turn close."}
      - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): the close anchor is the last root-stream record carrying a uuid and a parseable timestamp."}
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (rec-4146, C9): a sub-agent session's open row carries the ROOT start (session_started_at is the tree's pin); a close row's event_timestamp is the last root-stream uuid record's; duration reads the latest close, wall-clock."}
  session_started_at:
    $ref: telemetry-event-envelope.yaml#/contract/fields/session_started_at
    dq_intent_local:
      not_null: true
    governance_notes_local: >-
      The partition basis (governance.partition_by below) and the 48-bit time prefix of session_id's own ULID. Identical across every row of this session (open through its final annotate), by construction.
  source_ordinal:
    $ref: telemetry-event-envelope.yaml#/contract/fields/source_ordinal
    governance_notes_local: >-
      Orders a session's lifecycle events when two share an event_timestamp. A close row's source_ordinal is that of the last root-stream record carrying a uuid and a parseable timestamp at that finalization (the record its external_ref names); a segment close (SC-1, parser_version 4) takes that of the last such record before its resume boundary.
    amendment_log:
      - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): the close anchor is the last root-stream record carrying a uuid and a parseable timestamp."}
  external_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/external_ref
    dq_intent_local:
      not_null: true
    governance_notes_local: >-
      The hash input for this row's event_id; grammar '<source_record_id>#0/<event_kind>'. The open marker is '<session entity_ref>#0/open'. ONE close row is written per finalization at which the session's open row is due, unless an earlier finalization already wrote the same anchor: its external_ref is the role_ref '<uuid>#0/close' of the last root-stream record carrying a uuid and a parseable timestamp at that finalize. A segment close (SC-2) has the same shape, anchored before its resume boundary; identical keys dedupe, and when records were appended after a SessionEnd cut the segment has two closes with different anchors and the reader takes the latest.
    amendment_log:
      - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): one close row per finalization at which the open row is due, unless an earlier finalization already wrote the same anchor."}
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (rec-4146, C9): declared the open marker '<session entity_ref>#0/open' and the per-finalization close-row identity '<uuid>#0/close' (last root-stream record carrying a uuid)."}
  entity_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/entity_ref
    dq_intent_local:
      not_null: true
    governance_notes_local: >-
      The caller-supplied session_ref this row's own session_id derives from (domain tag 'telemetry_sessions:session_id'); a sub-agent session's entity_ref is '<sessionId>:<agentId>' (the parent CLI session id plus a deterministic per-agent id).
  producer:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer
    dq_intent_local:
      not_null: true
    governance_notes_local: e.g. claude_code, litellm, ci_annotate -- whichever surface emitted this lifecycle event.
    amendment_log:
      - date: "2026-09-28"
        semantic_break: true
        change_class: not_null_tighten
        summary: >-
          PLAN-telemetry-grain-and-generations (Decision 207, rec-4061 R2): producer is now NOT NULL enforced -- it is part of the telemetry grain key.
  producer_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer_version
  parser_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/parser_version
    dq_intent_local:
      not_null: true
  created_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/created_timestamp
    dq_intent_local:
      not_null: true
  tenant_id:
    $ref: tenant-id.yaml#/contract/fields/tenant_id
    dq_intent_local:
      not_null: true
  project_id:
    $ref: project-id.yaml#/contract/fields/project_id
    dq_intent_local:
      not_null: true
    governance_notes_local: >-
      Tightened NOT NULL over the project-id.yaml loosest baseline (Invariant 5): every telemetry row inherits a project partition, resolved at the write boundary from the caller-supplied project_ref, auto-registering an 'unregistered' row on first sight (no default, Decision 198).
  session_id:
    $ref: session-id.yaml#/contract/fields/session_id
    dq_intent_local:
      not_null: true
    governance_notes_local: >-
      The trace root's own entity key: every other telemetry row's session_id FK equals this value (write-boundary derivation, telemetry-event-envelope.yaml identity spec), no propagation needed. Every row of this session -- open through its final annotate -- shares this same id.
    joins:
      - session_id_join_telemetry_sessions_to_observations
  parent_session_id:
    $ref: session-id.yaml#/contract/fields/session_id
    governance_notes_local: >-
      Nullable self-reference: the session_id of the run that SPAWNED this session (sub-agent -> spawner), derived from parent_session_ref, or NULL for a top-level run. The cross-agent half of root-unification (Decision 95); parent_observation_id links in-session structure. Stays nullable (a
      top-level session has no parent).
    joins:
      - parent_session_id_join_sessions_self_spawn
  workflow:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      The workflow that opened the session (Decision 90 four-tier vocabulary): orient | plan | implement | develop-executor, plus operational runners (executor-supervision, scheduled-agent, ...).
    semantics: >-
      Required dimension; the primary grouping key for per-workflow analytics (duration, rework, outcome rates). accepted_values are NOT closed in the contract -- the workflow set evolves with Decision 90. The set is open; a closed set would
      be declared here and enforced at write (Decision 210 cl.3). From parser_version 6 the claude_code value is the workflow or gate skill the stream's first closed assistant-bearing turn invoked: a root stream's first-prompt command-name tag wins; else the first Skill tool call at or before the open bound whose skill names a workflow (planning reads plan, audit-prompt reads audit, orient, implement and overseer read themselves; plan-critique, decision-scout, code-review and executor-rca read under their own names), an errored call counting because the value is the session's intent; a child's command-name tag is never read; else subagent (a sub-agent) or claude_code (a root). Declared residuals: a workflow begun after the first turn reads the fallback (the price of the R3 open marker), a session running several workflows reads the first, and a final pass that cuts the first turn before its workflow Skill call, with the session then continuing, keeps the fallback already written. Roll-up to the spawning workflow is a read-time join on parent_session_id, never stored; the set stays open; a top-level run's root reads its agent's source_registry key (the run's telemetry_agents.agent_type, so one vocabulary names the agent everywhere), set by that run's producer.
    populated_by: the claude_code producer, at the open event.
    dq_intent: {required_when: {event_kind: [open]}}
    amendment_log:
      - {date: "2026-10-29", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): a top-level run's root reads its agent's source_registry key; the stale 'T3.22 c5 owns the top-level vocabulary' sentence is replaced.", migration_story: "Note only; no stored row changes."}
      - {date: "2026-10-24", semantic_break: true, change_class: governance_note_add, summary: "PLAN-retire-session-cli (rec-4589, parser_version 6): the claude_code workflow is attributed to sub-agent and relay-started streams from the first workflow Skill call within the open bound, gate skills under their own names; the stale REQUIRED_FIELDS sentence is dropped. The value set stays open and no column changes.", migration_story: "Parser v6 re-parses every tree from the start; v5 open rows are superseded by version, never rewritten."}
      - {date: "2026-08-26", semantic_break: false, change_class: prose_improvement, summary: "Platform cleanse: wording referencing removed product surfaces or the retired legacy query engine trimmed; field meaning unchanged."}
      - {date: "2026-10-04", semantic_break: false, change_class: type_widen, summary: "PLAN-telemetry-write-conformance (rec-4064 R1): nullable false -> true, matching dq_intent.required_when (open rows only); the projection already treated it as nullable."}
      - {date: "2026-10-05", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-lifecycle-friction-amendment (fork 2 (a)): dropped the stale 'Phase 4 telemetry DQ config' premise; the set is open and a closed set would be declared here and enforced at write. Meaning unchanged."}
  state:
    type: str
    iceberg_type: string
    nullable: true
    description: "Current disposition of the session: running | abandoned | success | failed | cancelled. DERIVED at read by the same reader verb as duration_seconds; never stored, no physical column (data-modeling-standard.yaml derived-state rule)."
    semantics: >-
      ROOT session: the state of its latest lifecycle row, ordered by event_timestamp, then source_ordinal, then close ranked last on a tie, then event_id, over every producer's rows after each producer's own R5 dedupe (the envelope's generation rule); annotate rows are excluded. That state is
      read from the session's turns (SE-1, Decision 228 (PLAN-telemetry-read-side-session-end)): a producer close that is the latest lifecycle row stands as that close's outcome (success | failed | cancelled) only while no turn opened after it; otherwise a latest root turn with a close carrying an outcome is at rest and, idle past the threshold, reads that outcome (success -> success, error -> failed, interrupted -> cancelled, blocked -> failed), else running; a latest turn with no close stopped mid-turn and reads abandoned past the threshold, else running; with no outcome-bearing turn close the session reads abandoned past the threshold, else running (the prior rule). A turn continued after a Stop that dies before its next Stop reads its earlier close's outcome, not abandoned (declared residual). abandoned: not terminal, and as_of minus the session's last event_timestamp across its rows in all four telemetry tables exceeds a governed idle threshold. The idle threshold
      lives in the reader's named-read registry as versioned data, seeded at 24 h and owned by 2b (PLAN-telemetry-reader-verbs, #1496); a later resume makes the session running again and nothing is stored. SUB-AGENT session (parent_session_id not NULL): state and duration come from its telemetry_agents agent-run open/close
      pair. An open with no close is running, or abandoned past the same idle threshold; a close maps its agent-run outcome into state as success -> success and failed, timeout or throttled -> failed (the detail stays on telemetry_agents.outcome).
    populated_by: a named reader verb (PLAN-telemetry-reader-verbs, #1496), bounded to this session's calendar-day partition; the idle threshold is reader registry data, never a column.
    dq_intent: {accepted_values: {values: [running, abandoned, success, failed, cancelled]}}
    derivation: {timing: read, derived_by: reader_verb:session_state_and_duration, formula: "ROOT (parent_session_id IS NULL), after R5 dedupe, orderings by event_timestamp, source_ordinal, event_id (NULL ordinal first); tip = the latest lifecycle row (annotate excluded, close last on a tie); idle = as_of - max(event_timestamp over this session's rows in the four telemetry tables) exceeds the governed idle threshold. (1) tip is a close and no root turn opened after the latest producer close (the turn open is not after it) -> its outcome; (2) else the latest root turn has a close with an outcome -> idle ? that outcome mapped (success, error -> failed, interrupted -> cancelled, blocked -> failed) : running; (3) else idle ? abandoned : running (a turn with no close, or the prior rule). SUB-AGENT: its telemetry_agents agent-run open/close pair; open with no close is running (abandoned past the idle threshold); at close success -> success, failed|timeout|throttled -> failed", inputs: [session_id, parent_session_id, event_kind, event_timestamp, source_ordinal, event_id, outcome, telemetry_agents.session_id, telemetry_agents.event_kind, telemetry_agents.event_timestamp, telemetry_agents.outcome, telemetry_observations.session_id, telemetry_observations.event_timestamp, telemetry_observations.observation_type, telemetry_observations.event_kind, telemetry_observations.observation_id, telemetry_observations.outcome, telemetry_observations.source_ordinal, telemetry_observations.event_id, telemetry_transcripts.session_id, telemetry_transcripts.event_timestamp], realized: false}
    amendment_log:
      - {date: "2026-10-18", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-read-side-session-end (Decision 228, amends Decision 199 cl.1): a root session's state is read from its turns (SE-1): the producer close stands only while no turn opened after it, else the latest turn's outcome once idle, abandoned only when stopped mid-turn.", migration_story: "Derived at read; no stored row changes. Sessions without turn outcomes keep the prior rule."}
      - {date: "2026-10-16", semantic_break: false, change_class: prose_improvement, summary: "PLAN-reader-verbs-decision-notes follow-up (rec-4324): reader-verb ownership pointer moved from rec-4024 to PLAN-telemetry-reader-verbs (#1496); no change in meaning."}
      - {date: "2026-10-05", semantic_break: true, change_class: field_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (feedback-loop review C9; W3 rulings reader-k1 (a), reader-k3 (a)): new read-derived state field (no column) with its ordering, close-last tie, governed idle threshold and sub-agent branch."}
  surface:
    type: str
    iceberg_type: string
    nullable: true
    description: "How the session ran: interactive | subagent | ci_agent | ci_verdict | fargate_persona | lambda_agent | local_agent. DERIVED at read; no physical column."
    semantics: >-
      subagent when parent_session_id is set; else interactive when no telemetry_agents row has session_id = this session and a NULL observation_id; else by the latest such row's host_run_ref prefix: gha -> ci_verdict when any model_call observation of the session carries persona_backend, else ci_agent; ecs -> fargate_persona; lambda -> lambda_agent; local -> local_agent. The value set maps the five run surfaces (CC-web interactive root, sub-agent, Fargate/LiteLLM persona, CI claude -p, Actions verdict job) plus the lambda and local hosts.
    populated_by: "a named reader verb (rec-4713)"
    dq_intent: {}
    derivation: {timing: read, derived_by: "reader_verb:session_surface", formula: "subagent when parent_session_id is set; else interactive when no telemetry_agents row has session_id = this session and a NULL observation_id; else by the latest such row's host_run_ref prefix: gha -> ci_verdict when any model_call observation of the session carries persona_backend, else ci_agent; ecs -> fargate_persona; lambda -> lambda_agent; local -> local_agent", inputs: [telemetry_sessions.parent_session_id, telemetry_agents.session_id, telemetry_agents.observation_id, telemetry_agents.host_run_ref, telemetry_observations.observation_type, telemetry_observations.persona_backend], realized: false}
    amendment_log: [{date: "2026-10-29", semantic_break: false, change_class: field_add, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): read-derived surface classification (no column), served by the reader verb rec-4713 owns.", migration_story: "Read-derived; no stored row changes."}]
  outcome:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Terminal disposition of the session, STORED on a close event's own row: success | failed | cancelled. There is no "running" value stored anywhere -- running is derived (see `state`).
    semantics: >-
      Observed at each finalization and recorded on that finalization's close row (STORED per the data-modeling-standard.yaml stored-vs-derived rule), derived from the transcript, never from SessionEnd hook input. SESSION STATE (a session's current disposition) is DERIVED at read by a named reader
      verb (see `state`): a resume after a close makes the session running again, so a close row's outcome is the terminal state only while it is the session's latest lifecycle row and no turn opened after it; the verb's outcome is SE-2 (the stored close outcome, or the mapped latest turn outcome once idle). This replaces the retired mutate-outcome-in-place model (contract_version 1), which had no room for the
      resume/compact events this shape now represents.
    governance_notes_local: >-
      claude_code parser_version 3 derives outcome per its close rule: cancelled when the last turn was interrupted (an interrupt sentinel, a user-rejected tool, an aborted stream or a tool_use with no result), failed when it ended in an API-error record (failure_reason carries that record's error kind identifier), otherwise success. A
      session or sub-agent stream with no closed turn holding an assistant record emits no row in any telemetry table until it has one. SEGMENT CLOSES (parser_version 4, rec-4382): one close row per root resume boundary for a segment holding an assistant-bearing turn, derived from the tree with no finalization cut and anchored as a cut there would anchor it (SC-1, SC-2), so a SessionEnd cut for the same segment usually dedupes; a segment without an assistant turn gets none.
      A TURN IS CLOSED (parser_version 5, rec-4407) when a later boundary exists, the pass is final or the turn holds a usable Stop witness (the capture shim's own hook_success attachment at a Stop, usable when the turn's last response has ended and no tool is pending) or an API-error record, and the open row's bound is the first closing event of the stream's first closed assistant-bearing turn, else that turn's last record when a boundary or a final pass closed it (WT-9), so the open row's content cannot move while that turn continues. A turn continued after a Stop that dies before its next Stop reads its earlier close's outcome.
    populated_by: the claude_code producer, at a close event (optional evidence, since Decision 228 cl.3 reads a root session's state from its turns); derived from the transcript at each finalization (rec-4026).
    dq_intent: {required_when: {event_kind: [close]}, accepted_values: {values: [success, failed, cancelled]}}
    amendment_log:
      - {date: "2026-10-18", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-read-side-session-end (Decision 228): a close row's outcome is terminal only while it is the latest lifecycle row and no turn opened after it; the verb's outcome is SE-2."}
      - {date: "2026-10-18", semantic_break: false, change_class: governance_note_add, summary: "PLAN-telemetry-stop-turn-close (parser_version 5): the no-reply rule names what a closed turn is (a later boundary, a final pass or a usable Stop witness / API-error record) and the open row's bound (WT-9). The v4 residual note on the last segment's close row is left for the read-side session-end plan."}
      - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): claude_code outcome rule on close rows (cancelled, failed with the API-error kind, else success) and the no-reply rule (a stream with no closed assistant turn emits no row in any table until it has one)."}
      - date: "2026-09-24"
        semantic_break: true
        change_class: accepted_values_narrow
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199): outcome is now STORED once on the close event's own row (event-journal shape) instead of a mutable column overwritten in-place at close; "running" dropped from accepted_values -- it is no longer a stored value, session state is derived
          at read from row presence instead.
        migration_story: No live populator existed under either scheme; the Phase 4 rebuild (T2.36) builds directly to this shape.
      - {date: "2026-10-05", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-lifecycle-friction-amendment (C9): one close row per finalization, outcome derived from the transcript (never SessionEnd hook input); a close row's outcome is the terminal state only while it is the latest lifecycle row; the legacy session_postflight populator is dropped."}
  process_event_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: >-
      Count of process_event observations in the session. DERIVED at read (roll-up naming: *_total) from telemetry_observations rows with observation_type=process_event sharing this session_id -- replaces the contract_version 1 stored tally process_event_count.
    semantics: A read-time aggregate; no physical column (data-modeling-standard.yaml derived-state rule).
    populated_by: a named reader verb (PLAN-telemetry-reader-verbs, #1496), bounded to this session's calendar-day partition.
    dq_intent: {}
    derivation: {timing: read, derived_by: reader_verb:session_process_event_rollup, formula: "count of telemetry_observations rows WHERE session_id = this.session_id AND observation_type = 'process_event'", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type], realized: false}
  rework_total:
    type: int
    iceberg_type: bigint
    nullable: true
    description: >-
      Count of rework runs in the session: at least repeat_threshold consecutive error closes of the same tool inside one turn. DERIVED at read from telemetry_observations facts classified by the reader's governed rules file -- replaces the stored `tier` column (contract_version 1), which is
      retired.
    semantics: >-
      A key self-improvement-loop friction signal; no physical column. The facts are process_events at severity error, warning or critical, plus tool_call closes with outcome error or blocked, read after R5 dedupe. rework_total counts runs: at least repeat_threshold consecutive error closes of the
      same tool inside one turn; a same-tool blocked close breaks a run. The rules (signatures, dispositions, labels, classes, repeat_threshold) live in a governed, versioned rules file bundled into the reader's named-read registry as data, owned by 2b (PLAN-telemetry-reader-verbs, #1496); classifier_version is stamped on
      every response and is never a column.
    populated_by: a named reader verb (PLAN-telemetry-reader-verbs, #1496), bounded to this session's calendar-day partition.
    dq_intent: {}
    derivation: {timing: read, derived_by: reader_verb:session_friction_rollup, formula: "count of runs of at least repeat_threshold consecutive tool_call closes with outcome error for the same tool (name) inside one turn (parent_observation_id), ordered by event_timestamp then source_ordinal, a same-tool blocked close breaking a run; repeat_threshold comes from the reader's rules file", inputs: [telemetry_observations.session_id, telemetry_observations.observation_type, telemetry_observations.event_kind, telemetry_observations.observation_id, telemetry_observations.name, telemetry_observations.severity, telemetry_observations.outcome, telemetry_observations.parent_observation_id, telemetry_observations.event_timestamp, telemetry_observations.source_ordinal], realized: false}
    amendment_log:
