    type: str
    iceberg_type: string
    nullable: true
    description: "The git commit (HEAD) the session's checkout was on when this session start or resume began, as the session's own start hook recorded it."
    semantics: "Per-segment provenance of the code that ran: an open row carries the startup checkout, each resume row its own. Read from the source transcript, never from a live git call, so it is a pure function of the source (envelope R7). NULL when the source does not record it (a checkout whose start hook predates it)."
    populated_by: the claude_code producer, at the open and resume events.
    dq_intent: {pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'}
  checkout_base_sha:
    type: str
    iceberg_type: string
    nullable: true
    description: "The merge-base of the checkout with the repository's default branch at that start: the main commit the session's code was cut from."
    semantics: "The back-validation key: a fix merged to main as commit C reaches this segment's code when C is an ancestor of checkout_base_sha. NULL when it could not be resolved at that moment (a shallow clone, or the default branch not yet fetched), never guessed. Same source and purity rule as checkout_sha."
    populated_by: the claude_code producer, at the open and resume events.
    dq_intent: {pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'}
  checkout_dirty:
    type: bool
    iceberg_type: boolean
    nullable: true
    description: "Whether tracked files differed from checkout_sha at that start."
    semantics: "true means the code that ran is not exactly checkout_sha. NULL when unknown. Same source and purity rule as checkout_sha."
    populated_by: the claude_code producer, at the open and resume events.
    dq_intent: {}
realization:
  produced: {write_boundary: [event_id, created_timestamp, tenant_id, project_id, session_id, parent_session_id], claude_code: [event_kind, event_timestamp, session_started_at, source_ordinal, external_ref, entity_ref, producer, producer_version, parser_version, workflow, outcome, execution_attempt, branch, failure_reason, model_primary, harness_session_key, checkout_sha, checkout_base_sha, checkout_dirty]}
  unproduced: {held:feedback-loop-gate: [rec_ids, plan_slug, pr_url, ci_outcome, files_changed, lines_added, lines_removed, scope_drift_files], rec-4599: [steps_total, failure_phase, coverage_before, coverage_after]}
governance:
  table_class: event
  partition_by: "history=year(session_started_at), month(session_started_at), day(session_started_at)"
  write_path: >-
    Provisioned in the production telemetry catalog (Decision 230); production writes begin at PLAN-telemetry-production-flip; the writer is rec-4024's append verb on the DuckLake telemetry writer boundary. Append-only event journal; no SCD2 merge, no in-place mutation.
governance_notes: >-
  EVENT JOURNAL (Decision 199, amending Decision 95 clause 1, Decision 96 clauses 1 and 3, and Decision 97 clauses 1-4): telemetry_sessions is the trace ROOT, now shaped as an append-only journal of lifecycle events rather than one row mutated in place. SESSION STATE: running, abandoned or a
  terminal outcome is DERIVED AT READ into `state` (never stored) by the named reader verb that also derives DURATION, reading this session's own rows bounded to its single calendar-day partition (answers Decision 81 clause 8 -- never an unprunable full scan). A root session's state is read
  from its turns (Decision 228): its latest lifecycle row (annotate excluded; close ranks last on a tie) stands only while no turn opened after it, so a resume after a close makes the session running again; one close row is written per finalization at which the session's open row is due (unless an earlier finalization already wrote the same anchor), its outcome derived from the transcript. claude_code also writes one close per root resume boundary for the segment before it (SC-1, SC-2: rec-4382, parser_version 4; a SessionEnd cut for the same segment usually dedupes; when records were appended after it the segment has two closes with different anchors and the reader takes the latest), and a resume row is due once its resume hook group has ended (SC-3), so a session ending inside a resume hook group gets no row for that resume. PROVENANCE (parser_version 4, PV-1..PV-4, claude_code): harness_session_key is the last URL path segment of the first remote_session_change attachment at or before the open row's bound, on every stream's open row; checkout_sha, checkout_base_sha and checkout_dirty are read from the SessionStart pin hook's recorded stderr line (open row: the last pin before the first prompt; resume row: the last pin inside its hook group), NULL for unknown or absent facts and never from a live git call. DECLARED RESIDUAL (owner rec-4407): a cloud session's LAST segment closes only through a SessionEnd pass that reaches the writer, which today stops before sending, so it reads running then abandoned; since Decision 228 it instead reads from its turns: its last turn's outcome once idle at rest, abandoned once idle mid-turn (rec-4407 closed). Identity (session_id, parent_session_id) is derived at the write boundary per
  telemetry-event-envelope.yaml's normative hash spec, not minted-once-and-propagated. ROLL-UP RECONCILIATION: process_event_total / rework_total / exception_total / steps_completed_total are DERIVED aggregates of telemetry_observations rows sharing this session_id (rework_total / exception_total
  from the facts classified by the reader's governed rules file, not a stored tier column). classifier_version is a reader response stamp, never a column. WINDOW VERBS (Decision 199 cl.1, CD.52): a verb over many sessions is a bounded window of per-session derivations, each reading only its own
  session's single calendar-day partition. Each window verb declares its own maximum window in the reader's named-read registry and stamps its read_version; there is no contract-wide day count, and each window is an egress line under Decision 88. NULLABILITY AXES: a column is NOT NULL at write when `nullable` is false or dq_intent declares not_null, unless the field carries `required_when`, which then governs (scripts/field_semantics_event_projection.py _is_not_null); every declared rule is write-enforced (Decision 210); a staged rule is spelled with exclude_before or an owned exemption. KNOWN GAPS (open recs, future CODE work, not this contract): rec-275 (failure-path step telemetry), rec-4030 (re-grounding planning_session_ref on this contract's derivation model; the UUID4 minter was retired, not migrated), rec-4032 (the later materialised friction-labels form of the reader's rules file that rework_total/exception_total read).
  LATE SESSIONSTART RECORDS (parser_version 7, rules HG-1..HG-4, rec-4633, claude_code): in a fresh project thread the pin hook's SessionStart record can be written after the first prompt, so a pin written after the first prompt never reaches the open row, whose checkout columns then read NULL (counted pin_after_first_prompt; read-time recovery is rec-4641). A SessionStart:resume group whose first hook started before the latest prompt or assistant record already written is still a resume (its resume row is due once the group ends, SC-3), but it closes no turn: its boundary is the first prompt of the turn it was written into, and its SC-1 close, the next segment's start and the background-completion boundary all sit at that position.
amendment_log:
  - {date: "2026-10-29", semantic_break: false, change_class: field_add, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): workflow names a top-level run's agent by its source_registry key; new read-derived surface field. Per-field changes are on their own logs."}
  - {date: "2026-10-26", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-late-hook-records (rec-4633, parser_version 7): governance_notes declare that a pin written after the first prompt never reaches the open row (counted pin_after_first_prompt; read-time recovery is rec-4641) and that a late SessionStart:resume group still counts as a resume but closes no turn, its SC-1 close and the background-completion boundary using the first prompt of the turn it was written into. Notes only; no column or type change."}
