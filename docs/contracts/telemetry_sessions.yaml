    nullable: true
    description: "The harness's own identifier for this session, as the harness spells it (Claude Code: the remote session id, session_<id>); the join key to the harness's own session lists."
    semantics: "Stored exactly as the source gives it, never normalised at write: Claude Code's environment spells the same session cse_<same suffix>, so a reader joins on the suffix. Set on open rows by a producer that reads it from its source; NULL otherwise. The claude_code producer sets it from parser_version 4 (PLAN-telemetry-capture-producer-fixes) on every stream's open row."
    populated_by: the claude_code producer, at the open event.
    dq_intent: {pattern: '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}
