---
# Class A data contract for telemetry_transcripts -- the large-payload SIDECAR of the canonical
# session-rooted trace/observation model (Decision 95 clause 3), re-grounded to the event-journal
# model + hybrid content tier at contract_version 2 (Decision 199).
# Ratified under the CD.25 pre-codegen contract ratification ritual (tier_item T0.12.6).
#
# HYBRID CONTENT MODEL: a payload <= 64 KiB is stored INLINE (content); a larger payload is spilled
# to the content blob port (S3 in the cloud adapter, a local directory in the free-tier adapter,
# Decision 184 cl.2) and referenced by content_uri. Exactly one of the two is ever set.
contract:
  id: telemetry_transcripts
  class: A
  contract_version: 2
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 199)"
  description: >-
    Class A schema contract for telemetry_transcripts: an append-only EVENT JOURNAL, one row per
    large text payload (prompt | response | thinking | tool_input | tool_result | system) produced
    by an observation, point-shaped (event_kind is always point -- a blob is created at a single
    instant, never opened-then-closed). PK transcript_id (derived); FK observation_id (the owning
    node) + session_id (the trace root). Hybrid content tier: inline for payloads <= 64 KiB, else a
    content-addressed blob-port key (Decision 199), so telemetry_observations stays hot without a
    hard-coded blob-or-die pointer scheme.
  projects_to:
    artifact: config/lambda/ducklake/field_semantics.yaml
    table: telemetry_transcripts
    generator: scripts/schema_to_field_semantics.py
    note: >-
      The event projection (scripts/field_semantics_event_projection.py) emits this table's entry from slice
      2a-2 plan 1's registration onward and runs in-process before then, so no later flip is owed.
fields:
  event_id:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_id
    dq_intent_local: {not_null: true}
    governance_notes_local: Row identity for this event-journal table. Domain tag 'telemetry_transcripts:event'.
  event_kind:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_kind
    dq_intent_local:
      not_null: true
      accepted_values: {values: [point], note: "A blob row is always point -- a payload is created at one instant."}
  event_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/event_timestamp
    dq_intent_local: {not_null: true}
    governance_notes_local: The blob's creation time. Replaces the retired created_at column (same event-time concept, promoted to the shared envelope).
  session_started_at:
    $ref: telemetry-event-envelope.yaml#/contract/fields/session_started_at
    dq_intent_local: {not_null: true}
  source_ordinal:
    $ref: telemetry-event-envelope.yaml#/contract/fields/source_ordinal
  external_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/external_ref
    dq_intent_local: {not_null: true}
    governance_notes_local: Grammar '<source_record_id>#<block_index>', or '<source_record_id>#<block_index>/full' for the tool_output row of a persisted tool result; the hash input for both event_id and this row's own transcript_id.
  entity_ref:
    $ref: telemetry-event-envelope.yaml#/contract/fields/entity_ref
    dq_intent_local: {not_null: true}
    governance_notes_local: >-
      Equals external_ref for a transcript row (its own entity/FK key input; a tool_output row's ends in '/full'). observation_ref (the
      turn for prompt/system content, the model_call for thinking/response/tool_input, the tool_call
      for tool_result) is the SEPARATE reference this row's observation_id FK derives from.
  producer:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer
    dq_intent_local: {not_null: true}
    amendment_log:
      - {date: "2026-09-28", semantic_break: true, change_class: not_null_tighten, summary: "PLAN-telemetry-grain-and-generations (Decision 207, rec-4061 R2): producer is now NOT NULL enforced -- part of the telemetry grain key."}
  producer_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/producer_version
  parser_version:
    $ref: telemetry-event-envelope.yaml#/contract/fields/parser_version
    dq_intent_local: {not_null: true}
  created_timestamp:
    $ref: telemetry-event-envelope.yaml#/contract/fields/created_timestamp
    dq_intent_local: {not_null: true}
    governance_notes_local: Replaces the retired ingested_at column.
  tenant_id:
    $ref: tenant-id.yaml#/contract/fields/tenant_id
    dq_intent_local: {not_null: true}
    governance_notes_local: The first path segment of a spilled blob's content_uri (tenant/project/session_id/<sha256>).
  project_id:
    $ref: project-id.yaml#/contract/fields/project_id
    dq_intent_local: {not_null: true}
  observation_id:
    $ref: observation-id.yaml#/contract/fields/observation_id
    dq_intent_local: {not_null: true}
    governance_notes_local: >-
      FOREIGN KEY to telemetry_observations.observation_id (the node that produced this blob):
      the turn (for prompt and system -- harness-injected content belongs to the turn it is
      injected into), the model_call (thinking, response, tool_input), or the tool_call
      (tool_result). Tightened NOT NULL (Invariant 5): every transcript owns a node.
    joins:
      - observation_id_join_observations_to_transcripts
  session_id:
    $ref: session-id.yaml#/contract/fields/session_id
    dq_intent_local: {not_null: true}
    governance_notes_local: FOREIGN KEY to telemetry_sessions.session_id (the trace root). A transcript is rooted (root-unification, Decision 95).
    joins:
      - session_id_join_telemetry_sessions_to_transcripts
  transcript_id:
    type: str
    iceberg_type: string
    nullable: false
    description: ULID string identifying one transcript blob row. Primary key of telemetry_transcripts.
    semantics: >-
      Format: ULID(48-bit ROOT session_started_at ms + the first 80 bits of H computed over
      external_ref with domain tag 'telemetry_transcripts:transcript_id'), per
      telemetry-event-envelope.yaml's identity spec. DERIVED at the write boundary, not
      minted-once. Table-local entity key (not a cross-system Class C key -- no other table
      references it as an FK by this name; children reach it via observation_id/session_id).
    populated_by: the write boundary (rec-4024's append_events verb), derived from external_ref.
    write_time_validation: PK-required; ULID format and value are generator-guaranteed at the boundary.
    dq_intent: {not_null: true}
    amendment_log:
      - date: "2026-09-24"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199): replaced mint-once-at-registration
          with write-boundary derivation from external_ref, per the shared identity spec.
          semantic_break=true: the derivation MECHANISM changed, not merely the prose.
        migration_story: No live populator existed; rec-4024 builds directly to this shape.
  purpose:
    type: str
    iceberg_type: string
    nullable: false
    description: "What the blob is: prompt | response | thinking | tool_input | tool_result | tool_output | system."
    semantics: >-
      Required kind discriminator. Extended (Decision 199) from the contract_version 1 set
      (prompt | response | transcript) to the per-block vocabulary a turn-shaped trace produces;
      "transcript" (a whole-session dump) is retired as a purpose value -- a session's transcript IS
      the set of its rows, not a single blob. tool_output is the FULL persisted output of a tool call as its
      own row (external_ref '<source_record_id>#<block_index>/full', same observation_ref as the tool_result
      row, origin tool), emitted only when the harness persisted the output and the sidecar is readable; a
      tool_result row holds only what the model saw.
    populated_by: the claude_code producer (purpose=...).
    dq_intent:
      not_null: true
      accepted_values: {values: [prompt, response, thinking, tool_input, tool_result, tool_output, system]}
    amendment_log:
      - date: "2026-09-24"
        semantic_break: true
        change_class: accepted_values_narrow
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199): purpose vocabulary replaced
          (prompt | response | transcript) -> (prompt | response | thinking | tool_input |
          tool_result | system); "transcript" retired as a value. semantic_break=true: the
          accepted-value set changed, not merely the prose.
        migration_story: No live populator existed; rec-4024 builds directly to this vocabulary.
      - date: "2026-10-04"
        semantic_break: true
        change_class: accepted_values_extend
        summary: >-
          PLAN-telemetry-write-conformance (slice 2a-1, operator-approved tool-result policy 2026-09-29): purpose gains
          tool_output, the full persisted tool output as its own bounded row.
        migration_story: No v1 row and no persisted cursor exists anywhere; the producer emits the value from parser_version 2.
  origin:
    type: str
    iceberg_type: string
    nullable: false
    description: "Who/what originated the content: human | harness | agent | tool."
    semantics: >-
      NEW field (Decision 199). hook/harness-generated tool_result TEXT is origin harness (the tool
      itself is origin tool; the harness's own injected wrapper text around a tool_result is
      harness) -- this distinction is what lets a reader separate genuine tool output from
      harness-injected framing without parsing content.
    populated_by: the claude_code producer (origin=...).
    dq_intent:
      not_null: true
      accepted_values: {values: [human, harness, agent, tool]}
  content:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      The payload as the model received/produced it, AFTER credential scrub (CD.40), stored INLINE
      when its size is <= the content_inline_threshold_bytes below. NULL when the payload was
      spilled to the blob port (content_uri set) or omitted as oversize (content_omitted_reason set).
    semantics: >-
      Exactly one of content / content_uri / content_omitted_reason is ever set. content is the payload AS THE
      MODEL SAW IT: for a tool_result, the in-context text (including a harness preview and note when the harness
      persisted the output), never the sidecar -- the full output is the tool_output row. A full output above
      full_output_cap_bytes is stored nowhere (content_omitted_reason). Write-enforced: content_sha256/content_bytes equal
      the sha256 and UTF-8 length of an inline content; content_uri set implies content_bytes > the threshold; content
      or content_uri set implies content_bytes <= full_output_cap_bytes; inline content above the threshold is the
      row rule inline_within_threshold (422). A payload above the threshold travels the claim-check route: the producer
      PUTs it under a writer-issued, checksum- and length-bound grant (begin_blobs) and sends a row with no content; the
      writer HEAD-verifies the object and sets content_uri before the row commits. content and content_uri are
      representation-only columns: the identity they carry is compared (content_sha256, content_bytes), not them.
    populated_by: the claude_code producer, after credential scrub, when size <= threshold.
    dq_intent:
      content_inline_threshold_bytes: 65536
      full_output_cap_bytes: 8388608
      integrity: true
      exactly_one_of: {fields: [content, content_uri, content_omitted_reason]}
      representation_of: [content_sha256, content_bytes]
    amendment_log:
      - date: "2026-09-24"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded from the sole payload
          field (contract_version 1 had no size tier) to the inline half of the hybrid inline/blob
          content model. semantic_break=true: the field's own presence is now conditional on a size
          threshold, not unconditional.
        migration_story: No live populator existed; rec-4024/rec-4026 build directly to this shape.
      - date: "2026-10-04"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-write-conformance (slice 2a-1): content is the model-visible payload (a tool_result's in-context
          text, never the sidecar); exactly-one-of widens to content_omitted_reason; the threshold, cap and integrity rules
          are write-enforced (the inline-size leg exempt until slice 2a-2); content is a representation-only column.
        migration_story: No v1 row and no persisted cursor exists anywhere; parser_version 2 emits the new semantics.
      - date: "2026-10-14"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-append-inline (slice 2a-2 plan 3 part 2): content.semantics states the interim edge refusal of inline
          content above the threshold while the inline_within_threshold exemption stands (413 payload_too_large, owner
          rec-4024). An interim refusal only: no rule, value or content tier changes.
        migration_story: No row above the threshold was ever stored; the blob route removes the refusal.
      - date: "2026-10-15"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-telemetry-blob-route (slice 2a-2 plan 4, closes rec-4024's route): the inline_within_threshold exemption
          is removed (inline content above the threshold is a 422 row rule) and content.semantics names the claim-check
          route. No threshold, cap, key grammar or content tier changes (Decision 199 cl.5).
        migration_story: No row above the threshold was ever stored inline; no runtime migration is required.
  content_uri:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Content-addressed blob-port key 'tenant/project/session_id/<content_sha256>', resolved by the
      blob-port adapter (S3 in the cloud adapter, a local directory adapter in the free tier,
      Decision 184 cl.2). NULL when the payload was small enough to store inline (content set).
    semantics: >-
      Replaces the retired local_path/s3_key pointer pair (contract_version 1): one port-relative
      key resolved by whichever adapter is configured, instead of two substrate-specific columns.
    populated_by: the write boundary, derived from the row's refs and content_sha256 after a HEAD proves the object, when size > threshold.
    dq_intent: {representation_of: [content_sha256, content_bytes]}
    amendment_log:
      - {date: "2026-10-15", semantic_break: false, change_class: governance_note_add, summary: "PLAN-telemetry-blob-route (slice 2a-2 plan 4): populated_by names the claim-check route; a caller-sent content_uri is refused (400 writer_derived) because the writer derives it after verifying the object. Key grammar unchanged."}
  content_omitted_reason:
    type: str
    iceberg_type: string
    nullable: true
    description: Why a payload is stored nowhere. oversize = the storable payload would exceed full_output_cap_bytes; withheld_by_policy = the producer's capture policy for this run says the text is never stored (Decision 238 cl.1 for plan review).
    semantics: >-
      Set, with content and content_uri both NULL, on a typed omission row. On an oversize omission row content_sha256/content_bytes are then
      the RAW source bytes' identity, streamed, never decoded or scrubbed (nothing is stored), and are not cap-bound; the
      reason can hold even when the raw size is within the cap, because decoding and scrubbing a non-UTF-8 source grows it.
      On a withheld_by_policy row nothing about the payload is stored: content_sha256 is the SHA-256 of the empty byte string and
      content_bytes is 0, because a raw digest of a short output confirms an exact guess.
    populated_by: the claude_code producer, when a persisted tool output is above the cap (oversize); a CI capture producer whose policy withholds the run's text (withheld_by_policy).
    dq_intent: {accepted_values: {values: [oversize, withheld_by_policy]}}
    amendment_log:
      - {date: "2026-10-29", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): description and semantics qualify the raw-source-bytes identity to an oversize omission row and add the withheld clause."}
      - {date: "2026-10-29", semantic_break: false, change_class: accepted_values_extend, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): withheld_by_policy joins the omission reasons; its rows store the empty digest and zero bytes.", migration_story: "Additive value; no stored row changes."}
      - {date: "2026-10-04", semantic_break: false, change_class: field_add, summary: "PLAN-telemetry-write-conformance (slice 2a-1): new field naming a typed omission."}
  content_sha256:
    type: str
    iceberg_type: string
    nullable: false
    description: SHA-256 of the ONE stored payload (whichever of content/content_uri is set), hex-encoded; of the raw source bytes on an oversize omission row, of the empty byte string on a withheld_by_policy row.
    semantics: >-
      Required regardless of tier: the content-addressing key for a spilled blob's content_uri, and
      an integrity check for an inline payload. On an oversize omission row it identifies the raw
      source bytes, which can confirm an exact guess of a short output; accepted, the rows stay in the customer-owned data plane. On a
      withheld_by_policy row it is the SHA-256 of the empty byte string (write-enforced), never a digest of the withheld text.
    populated_by: the claude_code producer, computed over the payload before storing it (the writer only verifies a blob against it).
    dq_intent:
      not_null: true
      pattern: "^[0-9a-f]{64}$"
      pattern_when:
        - {when: {content_omitted_reason: [withheld_by_policy]}, pattern: "^e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855$"}
    amendment_log:
      - {date: "2026-10-29", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): the raw-source-bytes identity is qualified to an oversize omission row; a withheld_by_policy row stores the empty-string digest (pattern_when, write-enforced).", migration_story: "No stored row changes."}
      - {date: "2026-10-04", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-write-conformance (slice 2a-1): an omission row's digest identifies the raw source bytes; the lowercase 64-hex pattern is write-enforced.", migration_story: "No v1 row exists; parser_version 2 emits the new semantics."}
  content_bytes:
    type: int
    iceberg_type: bigint
    nullable: false
    description: Size of the ONE stored payload in bytes. Replaces the retired size_bytes column (same concept, computed over the stored payload, not a separate draft field).
    semantics: Required; used to budget transcript storage and to spot anomalous (empty / huge) blobs, and is the threshold comparand for the inline/blob-port tier choice. On an oversize omission row it is the raw source size; 0 on a withheld_by_policy row (write-enforced).
    populated_by: the claude_code producer.
    dq_intent: {not_null: true, null_or_zero_when: {content_omitted_reason: [withheld_by_policy]}}
    amendment_log:
      - {date: "2026-10-29", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): content_bytes is 0 on a withheld_by_policy row (null_or_zero_when, write-enforced).", migration_story: "No stored row changes."}
  content_truncated:
    type: bool
    iceberg_type: boolean
    nullable: false
    description: >-
      True iff the stored payload is known to be an incomplete copy of the payload this row claims to hold (a damaged
      or partially readable source). Never set because the harness showed the model a preview or a pointer (that
      preview IS the complete model-visible payload), nor on a tool_output row (it holds the full output), nor on an
      omission row (content_omitted_reason says so).
    semantics: >-
      A defect detector: a healthy producer writes false on every row and DQ alerts on any true. Whether the harness
      persisted a tool's output is telemetry_observations.output_capture on the tool_call close.
    populated_by: the claude_code producer.
    dq_intent: {not_null: true}
    amendment_log:
      - {date: "2026-10-04", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-write-conformance (slice 2a-1): redefined from 'stored payload is a preview' to a defect detector, per the adopted tool-result consult; the persisted fact moved to output_capture.", migration_story: "No v1 row exists; parser_version 2 writes false on every row."}
  token_count:
    type: int
    iceberg_type: bigint
    nullable: true
    description: Token count of the blob, when computed. NULL if not tokenised.
    semantics: Optional; the blob's token size (distinct from a model_call's usage on telemetry_observations). bigint.
    populated_by: "unproduced: rec-4601 (no producer writes it)"
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the write-boundary model; field meaning unchanged."}
  model:
    type: str
    iceberg_type: string
    nullable: true
    description: The model associated with the blob (e.g. the model that produced the response).
    semantics: Optional attribution, mirroring telemetry_observations.model for this blob's own producing call.
    populated_by: the claude_code producer.
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded populated_by wording to the write-boundary model; field meaning unchanged."}
  rec_id:
    type: str
    iceberg_type: string
    nullable: true
    description: Recommendation id the blob relates to (e.g. rec-2335). NULL when not applicable.
    semantics: Optional cross-reference to ops_recommendations.id, joined tenant-locally.
    populated_by: "unproduced: held:feedback-loop-gate (no producer writes it)"
    dq_intent: {}
    amendment_log:
      - {date: "2026-09-24", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-event-journal-contracts (Decision 199): re-grounded semantics to name tenant-local joining; field meaning unchanged."}
realization:
  produced: {write_boundary: [event_id, created_timestamp, tenant_id, project_id, observation_id, session_id, transcript_id, content_uri], claude_code: [event_kind, event_timestamp, session_started_at, source_ordinal, external_ref, entity_ref, producer, producer_version, parser_version, purpose, origin, content, content_omitted_reason, content_sha256, content_bytes, content_truncated, model]}
  unproduced: {held:feedback-loop-gate: [rec_id], rec-4601: [token_count]}
governance:
  table_class: event
  partition_by: "history=year(session_started_at), month(session_started_at), day(session_started_at)"
  write_path: >-
    Provisioned in the production telemetry catalog (Decision 230); production writes begin at PLAN-telemetry-production-flip; the telemetry writer's claim-check route (slice 2a-2): the producer PUTs a
    payload above the threshold under a writer-issued grant (begin_blobs) BEFORE the row write; append_telemetry
    HEAD-verifies the object, sets content_uri and commits the row (orphan sweep for a PUT whose row never commits:
    rec-4033).
governance_notes: >-
  HYBRID CONTENT MODEL (Decision 199): the "inline content" tier here is a COLUMN-LEVEL choice
  (content vs content_uri), distinct from DuckLake data inlining, which stays DISABLED for
  telemetry (CD.34, OQ.11) regardless of which tier a given transcript row uses. Re-rooting
  (Decision 95 cl.3): a transcript hangs off exactly one observation_id (+ session_id), never the
  draft's ad-hoc phase_id/step_id/invocation_id mix. RETIRED: local_path, s3_key, size_bytes,
  created_at, ingested_at -- content_uri/content_bytes/event_timestamp/created_timestamp (the
  shared envelope) supersede them. Identity (transcript_id, observation_id, session_id) is derived
  at the write boundary per telemetry-event-envelope.yaml's normative hash spec. NULLABILITY AXES: a column is NOT NULL at write when `nullable` is false or dq_intent declares not_null, unless the field
  carries `required_when`, which then governs (scripts/field_semantics_event_projection.py _is_not_null); every declared rule is write-enforced (Decision 210); a staged rule is spelled with exclude_before or an owned exemption. Provisioned in the production telemetry catalog (Decision 230). KNOWN GAPS: rec-4026 (turn-capture producer), rec-4029 (PII
  scrubbing/erasure -- begin_blobs re-grants a missing object, so erasing a large payload by object delete is undone by
  the producer's next re-send: erasure must tombstone the key at the writer or erase at the source), rec-4033 (blob
  orphan sweep), rec-4291 (get_blob, slice 2b). claude_code parser_version 3
  emits prompt (human), response, thinking and tool_input (agent), tool_result (tool, or harness for denials and
  sentinels), tool_output (tool), system (harness: meta and companion records, interrupt sentinels, API-error text) and
  omission rows; attachment-derived system rows are not emitted; a fork's inherited records emit none.
amendment_log:
  - {date: "2026-10-29", semantic_break: false, change_class: accepted_values_extend, summary: "PLAN-telemetry-top-level-agent-run (rec-4416): withheld_by_policy omission reason with the empty digest and zero bytes. Per-field changes are on their own fields' logs."}
  - {date: "2026-10-25", semantic_break: false, change_class: prose_improvement, summary: "PLAN-telemetry-production-catalog bookkeeping: the two not-provisioned-in-production statements now say provisioned in the production telemetry catalog (Decision 230); mechanical status edit, no meaning change."}
  - {date: "2026-10-24", semantic_break: false, change_class: governance_note_add, summary: "PLAN-telemetry-field-realization (T3.20 c7): realization block (who writes each stored column, or who owns its absence); populated_by names the real writer. No column, type or rule change."}
  - {date: "2026-10-15", semantic_break: false, change_class: governance_note_add, summary: "PLAN-telemetry-blob-route (slice 2a-2 plan 4): write_path and the KNOWN GAPS note name the claim-check route and its owners (rec-4033, rec-4291); the content exemption is removed (field entries on content and content_uri)."}
  - {date: "2026-10-14", semantic_break: true, change_class: governance_note_add, summary: "PLAN-telemetry-parser-v3 (slice 3b plan P-B): governance note: the claude_code v3 turn-grain transcript row inventory; attachment-derived system rows are not emitted and a fork's inherited records emit none."}
