---
# Class C cross-system invariant: the tenant partition id.
# Ratified as part of the telemetry event-journal re-model (Decision 200, amending Decision 197
# clause 2).
#
# NEW contract (no predecessor): Decision 197 clause 2 named tenancy as a cloud-adapter property
# ("project_id" doing double duty as both repository and tenancy identity); Decision 200 splits
# that into two opaque ids -- tenant_id (WHO; a customer/organisation boundary) and project_id
# (WHICH REPOSITORY; unchanged identity, see project-id.yaml) -- because a single cloud tenant can
# own multiple repositories/projects. The SCD2 tenant dimension (mutable attributes: name, plan,
# ...) is modelled by Decision 200 but its Class A contract is authored WITH its registration in
# rec-4024, not here -- this Class C contract carries only the opaque id invariant.
contract:
  id: tenant-id
  class: C
  contract_version: 1
  status: ratified
  ratified_at: "2026-09-24"
  ratified_via: "PLAN-telemetry-event-journal-contracts merge to main (Decision 200)"
  description: >-
    Canonical cross-system tenant partition identifier (Decision 200, amending Decision 197 clause
    2). Every telemetry table $refs this field, tightened NOT NULL: tenancy is always present on a
    telemetry row, even though tenancy ENFORCEMENT (multi-tenant isolation) stays a cloud-adapter
    property (Decision 197 clause 2, unamended) -- the local adapter is single-tenant by
    construction and resolves a fixed configured tenant_id.
fields:
  tenant_id:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Opaque, immutable ULID identifying the tenant (customer/organisation boundary) a row belongs
      to. Included as a hash input to every entity/FK/event_id derivation (see
      telemetry-event-envelope.yaml's identity spec) so two tenants' rows can never collide even on
      an identical entity_ref.
    semantics: >-
      Resolved at the write boundary, NEVER caller-supplied: the local adapter uses a configured
      constant; the cloud adapter uses the caller's authenticated identity. Minted once at tenant
      registration (rec-4024's registration verb) and never re-derived. The Class C baseline
      nullability is the loosest common value; every telemetry table tightens it to
      not_null: true via dq_intent_local (Invariant 5).
    populated_by: the write boundary, from the deployment's tenant resolution (rec-4024).
    write_time_validation: >-
      Registration is idempotent under concurrency by a counter-row lock on ops_entity_counters (operator decision
      2026-09-29), the way Decision 200's "unique constraint or advisory lock" lock arm is realised under DuckLake's
      optimistic concurrency; evidence is plan 3's race test on the local file catalog (if it fails, the reversal condition
      fires and the model returns to /plan). Built in plan 3 (rec-4024). Tenant pin (deployment obligation): every producer
      of one trace tree signs from principals of one registered tenant. Declared coverage: not detectable by the writer;
      residual owned by the rec-4063 DQ family, slice 2b, as a monitor for trees with child rows and no root open row.
    dq_intent: {}
    amendment_log:
      - date: "2026-10-15"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-rule-declarations-and-writer-conformance (rec-4158): the semantics text names the retired enforced flag no
          longer; it says not_null is declared (true) via dq_intent_local. Meaning unchanged.
        migration_story: >-
          Prose only: the declared rule set is identical before and after.
      - date: "2026-10-05"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          PLAN-telemetry-table-registration (slice 2a-2 plan 1): named the counter-row lock as the registration idempotency
          mechanism and stated the one-tenant-per-trace-tree pin as a deployment obligation with its residual owner.
          semantic_break=true: a deployment that signs one tree from several tenants' principals now violates the contract.
        migration_story: No live populator exists yet (rec-4024, plan 3), so no runtime migration is required.
    governance_notes: >-
      Never loosened: a tenant_id is always present on every telemetry row in every deployment
      shape (single-tenant local included), because "always present, enforcement varies by
      adapter" is the whole point of Decision 200's split from Decision 197 clause 2's single
      project_id-as-tenancy overload.
governance_notes: >-
  Single-hop leaf invariant (no chained $ref; Class C contracts are leaf nodes, Invariant 5). The
  SCD2 ops_tenants dimension (mutable attributes: name, plan, canonical remaps) is Decision 200's
  forward-declared companion, authored as its own Class A contract in rec-4024, not here -- this
  contract fixes only the opaque-id invariant every telemetry table needs today. The dimension join
  (each telemetry table's tenant_id -> ops_tenants) is declared in _joins.yaml.
  Producer identity model (rec-4207): the cloud adapter's tenant is the signed caller's account, so every principal in the
  platform account is one house tenant. The production writer's invoke stays {github_ci_branch, PlatformDev}, URL-only
  (Decision 213), with github_ci_branch's agent/* trust owned by rec-4480; admitting any other producer identity, and
  per-tenant roles for a principal outside this account, follow rec-4420.
amendment_log:
  - date: "2026-10-05"
    semantic_break: true
    change_class: governance_note_add
    summary: >-
      PLAN-telemetry-table-registration: counter-row lock and tenant pin on tenant_id; accompanies the field-level entry.
      The dimension join now exists in _joins.yaml.
    migration_story: No live populator exists yet (rec-4024, plan 3), so no runtime migration is required.
  - date: "2026-10-15"
    semantic_break: false
    change_class: prose_improvement
    summary: >-
      PLAN-rule-declarations-and-writer-conformance (rec-4158, Decision 210): the dq_intent `enforced` key is retired
      from every rule leg. not_null is declared by presence (`true`, or `{exclude_before: D}`); an optional column or a
      loosest-baseline field carries no not_null leg; the other legs lose the key. A declared rule is an enforced rule.
    migration_story: >-
      Declarations re-spelled only. No rule is added, removed or re-dated: the declared rule set, read through
      scripts.contract_rules, is identical before and after, and the generated field_semantics.yaml projection of
      this contract is unchanged.
  - date: "2026-10-19"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      PLAN-telemetry-production-catalog (Decision 230, rec-4207): governance_notes records the producer identity model (the signed
      caller's account is the house tenant; the two production invoke principals; rec-4480 and rec-4420 own the rest).
    migration_story: No field meaning changes; prose only.
previous_versions: []
