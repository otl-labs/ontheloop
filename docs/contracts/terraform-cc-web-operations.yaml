# CC-web terraform operating-procedure contract (PLAN-ambient-prose-contract-relocation, T2.56
# c1; narrowed by PLAN-terraform-personal-cd-split). A Class D mechanism contract carrying what a
# CC-web session does BY HAND around terraform/personal -- provider-mirror init, remote-state
# variable recovery, and the operator-only break-glass loop -- relocated out of terraform/CLAUDE.md's
# ambient S2 prose-budget surface (Decision 110/127) per Decision 86/114 routing. terraform/CLAUDE.md
# keeps only what the ROUTINE (non-admin) loop needs unaided: Hard rules, AWS context, the
# deployment-model channel table, the never-self-directed-apply norm, and Lambda interaction
# (Decision 114 anti-fragmentation -- the relocation must not force two-file reassembly for the
# routine loop).
#
# Boundary with docs/contracts/terraform-personal-cd.yaml (split 2026-10-30, Decision 166 cap):
# this file holds what a CC-web or ADMIN session does by hand, plus where terraform/personal's
# inputs come from for every consumer -- so operator_only_break_glass.apply_posture (the CD
# apply's tfvars sourcing) stays here. That file holds how the GitHub Actions jobs plan, apply,
# detect drift and record convergence (speculative plan + apply-the-saved-plan, alarm-only drift
# detection, the convergence anchor).
#
# Declared subject is deliberately narrow and distinct from the sibling contracts this file must
# never duplicate: `environment-taxonomy.yaml` (sole SoT for the apply-model / guard
# classification -- what auto-applies vs what blocks), `deploy-paths.yaml`'s
# `admin_out_of_band.procedure` (the ratified T2.41 quarantine destination for the operator
# break-glass recovery STEPS, which declares itself never a second source of truth), and
# `terraform-personal-cd.yaml`. This file carries the CC-web-specific MECHANICS around those
# authorities (provider init, state recovery) -- never their classification rules.
contract:
  id: terraform-cc-web-operations
  class: D
  contract_version: 1
  status: ratified
  ratified_via: "PLAN-ambient-prose-contract-relocation"
  description: >-
    Class D mechanism contract for the CC-web terraform/personal hand-run procedure: provider-
    mirror init and its github.com-egress relaxation, remote-state variable recovery, and the
    operator-only break-glass loop. The CD pipeline's wiring is terraform-personal-cd.yaml's.
    terraform/CLAUDE.md's 'Running terraform/personal/ on CC-web' section points here rather
    than restate it.
  subject: terraform-cc-web-operations
  evaluator:
    check: validate_terraform_cc_web_operations

