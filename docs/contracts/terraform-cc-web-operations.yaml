provider_init_and_mirror:
  github_egress_relaxation: >-
    Third-party-provider init is github.com-egress-blocked by default (Decision 119),
    MIRROR-ENABLED on a synced admin container (Decision 120): the CC-web outbound proxy scopes
    github.com to repo-scoped API calls, so a stock CC-web session CANNOT `terraform init`
    `terraform/personal` via a direct fetch -- the `kislerdm/neon` provider's
    authentication-checksum fetch permanently 403s on github.com. `hashicorp/*` providers
    (releases.hashicorp.com) init fine regardless. Decision 119 named an S3-backed
    `provider_installation` `filesystem_mirror` as its reversal mechanism; Decision 120 realized
    it: `.github/workflows/terraform-provider-mirror-seed.yml` (the sole egress-having actor)
    seeds `s3://agent-platform-data-lake/tf-provider-mirror/`, and the every-session SessionStart hook `.claude/hooks/session_start_terraform_assets.sh` syncs it locally in ADMIN
    sessions (those whose `~/.aws/config` holds the `agent_platform_admin` profile), through `bin/sync-terraform-assets.sh`
    and as `agent_platform`, then resolves `config/terraform/cc-web.tfrc` into `$HOME/.terraform-mirror.tfrc` -- written
    only after a successful, non-empty sync and removed after a failed one, so no resolved config ever excludes
    `kislerdm/*` from `direct` with nothing in the mirror to serve. A terraform command uses it by prefixing
    `TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc`. The sync cannot run from `bin/setup-cloud-env.sh`: the agent proxy
    never signs setup-script requests. With that mirror synced, local `terraform
    init` of `terraform/personal` succeeds with no github.com fetch -- see
    `operator_only_break_glass` below for when this is used.
  ci_delegation_still_authoritative: >-
    This RELAXES but does NOT REMOVE the CI-delegation: routine (non-admin) `terraform
    validate`/`plan`/`apply` for `terraform/personal` remain CI-mediated and authoritative
    regardless of any given container's mirror state -- `validate` via the required
    `terraform-validate` job (Decision 83; NOT CC-web-only -- mirror-consuming, read-only,
    version-gated, fail-open, rec-2836); `plan`/`apply` via the speculative-plan +
    apply-the-saved-plan pipeline described in `docs/contracts/terraform-personal-cd.yaml` (`speculative_plan_and_apply_the_saved_plan`; Decision 77 / Decision 92). The mirror-enabled local-init path exists for the ADMIN
    container's interactive human-gated apply loop (IAM/trust/destroy changes that guard-BLOCK
    the CD pipeline, Decision 94 escape hatch) -- not a routine-change CI bypass. See Decision
    119 for the original constraint and Decision 120 for the realized reversal mechanism and its
    own reversal conditions (mirror sync ceasing to be maintained falls back to this section's
    original CI-delegated posture with no code change required).
  backend_region: >-
    No S3 backend block or backend file names a region (rec-4067): a hand-run init of
    terraform/bootstrap, terraform/github or terraform/personal takes it from config/aws-region,
    the project's one region, via `-backend-config="region=$(tr -d '[:space:]' < config/aws-region)"`,
    and later plan and apply runs reuse it; CI init reads AWS_REGION from the sign-in. A
    `.terraform` directory initialised before that change needs this init run once before its
    next plan or apply.

tfvars_and_remote_state_recovery:
  gitignored: >-
    `terraform/personal/terraform.personal.tfvars` is gitignored (`.gitignore`:
    `terraform/**/terraform.personal.tfvars`), so it is NOT in the fresh clone and there is no
    standalone `s3://.../terraform.personal.tfvars` object to fetch -- do not go looking for
    that file.
  recoverable_vars: >-
    Five no-default, non-ephemeral vars (`account_id`, `alerts_email`, `owner_email`,
    `platform_dev_external_id`, `platform_admin_external_id`) are recoverable; see
    `where_values_live` below for each variable's declaring file and per-variable recovery
    source. `validate_terraform_cc_web_operations` enforces this list bidirectionally against
    `terraform/personal/*.tf` -- it fails on a declared no-default, non-ephemeral variable missing from the
    table below (ephemeral no-default variables are checked against ephemeral_runtime_vars instead), and equally on a table entry for a variable the module no longer declares.
  state_location: >-
    State: `s3://agent-platform-data-lake/tfstate/personal/sandbox/terraform.tfstate` (region
    from `config/aws-region`), wired via `terraform -chdir=terraform/personal init
    -backend-config=backend-sandbox.hcl -backend-config="region=$(tr -d '[:space:]' <
    config/aws-region)"`.
  where_values_live:
    description: >-
      Per-variable recovery source. Prefer materialising the whole set at once from the same
      Secrets Manager entry CI sources from (see `recovery_procedure` below) over deriving values
      variable-by-variable; each entry's `source` below also names the state-parsing fallback and
      is the audit trail for where each value lives once recovered.
    account_id:
      declared_in: terraform/personal/variables.tf
      source: >-
        The `agent-platform-terraform-personal-tfvars` Secrets Manager entry (see
        `recovery_procedure`); also derivable from any resource ARN in the remote state, or from
        `aws sts get-caller-identity --profile agent_platform_admin`.
    owner_email:
      declared_in: terraform/personal/providers.tf
      source: >-
        The `agent-platform-terraform-personal-tfvars` Secrets Manager entry; also present as
        the `Owner` resource tag value in the remote state -- the GitHub no-reply role-alias
        identity (see `owner_vs_alerts_email` below; this is never the alerts mailbox).
    platform_dev_external_id:
      declared_in: terraform/personal/variables.tf
      source: >-
        The `agent-platform-terraform-personal-tfvars` Secrets Manager entry; also present as
        the PlatformDev IAM role's `assume_role_policy` trust document `sts:ExternalId`
        condition in the terraform/bootstrap remote state (`agent-platform-bootstrap-tfstate`,
        which among container profiles only PlatformAdmin can read; terraform/personal state no
        longer holds the role, rec-3838). Admin-tier only (see `admin_tier_only` below).
    platform_admin_external_id:
      declared_in: terraform/personal/variables.tf
      source: >-
        The `agent-platform-terraform-personal-tfvars` Secrets Manager entry; also present as
        the PlatformAdmin IAM role's `assume_role_policy` trust document `sts:ExternalId`
        condition in the terraform/bootstrap remote state (`agent-platform-bootstrap-tfstate`,
        which among container profiles only PlatformAdmin can read; terraform/personal state no
        longer holds the role, rec-3838). Admin-tier only (see `admin_tier_only` below).
    alerts_email:
      declared_in: terraform/personal/sns_alerts.tf
      source: >-
        The `agent-platform-terraform-personal-tfvars` Secrets Manager entry; also present as
        the SNS topic subscription `endpoint` attribute in the remote state -- the deliverable
        alerts-mailbox role-alias (see `owner_vs_alerts_email` below; this is never the Owner
        tag identity).
  ephemeral_runtime_vars:
    neon_api_key:
      declared_in: terraform/personal/providers.tf
      source: "Secrets Manager neon-api-key, fetched at run time by scripts/ci/neon_api_key.sh run inside each trusted terraform step; never in the tfvars secret"
  owner_vs_alerts_email: >-
    `owner_email` and `alerts_email` are two different role-alias identities that must never be
    reconciled to the same value: `owner_email` backs the GitHub no-reply identity used for
    resource `Owner` tags (a stable per-repo identifier, never a deliverable mailbox);
    `alerts_email` backs the SNS alerts subscription endpoint (a real, deliverable mailbox that
    must receive and confirm the page-out email). They differ BY DESIGN. Reading the tag-vs-
    subscription-endpoint diff as drift is a misdiagnosis -- the diff is a RECOVERY ARTEFACT of
    two intentionally distinct sources, and "fixing" it would either break alerting (routing
    pages to a no-reply address that cannot receive mail) or pollute the `Owner` tag with a real
    mailbox literal in a public repository (Decision 101).
  recovery_procedure: >-
    Materialise the whole tfvars set at once via the shared delegate the governed CI apply path
    also calls: `.github/actions/materialise-tfvars/materialise_tfvars.sh` (Decision 162 R2 extraction; in an ADMIN session, run it on demand through `bash bin/sync-terraform-assets.sh
    --tfvars`, which pins `AWS_PROFILE=agent_platform_admin` for that call and masks its error output -- see
    `operator_only_break_glass.scope` below). It fetches the
    `agent-platform-terraform-personal-tfvars` Secrets Manager entry under ambient credentials
    (profile-free by design -- see `admin_tier_only` below) and writes its body, via a fail-closed
    temp-file-then-mv, to the gitignored `terraform/personal/terraform.personal.tfvars`, ready to
    pass to `terraform plan`/`apply` via `-var-file` (or individual `-var` flags). The raw command
    is retained as a fallback for a container where running the delegate directly is inconvenient:
    `aws secretsmanager get-secret-value --secret-id agent-platform-terraform-personal-tfvars
    --profile agent_platform_admin --query SecretString --output text`, writing its body to the
    same destination. State-parsing (after `init`, `terraform state show` / a parse of the state
    JSON) remains a fallback per-variable path when the Secrets Manager entry itself is
    unavailable or stale -- see each `where_values_live` entry's `source` for that variable's
    state location.
  never_paste: >-
    Never paste these values into chat, a PR, or any committed file -- the ExternalIds are
    AssumeRole trust secrets and the account id is shape-blocked by the pre-commit
    `never-commit` hook.
  admin_tier_only: >-  # pragma: allowlist secret -- GetSecretValue is an IAM action name, not a credential
    Both recovery paths are admin-tier-only (DEP-13 / T2.44 / Decision 144 pt.3), never reachable
    from `PlatformDev` (the ambient `agent_platform` runtime identity used by every CC-web
    session). The Secrets Manager materialisation path above requires
    `secretsmanager:GetSecretValue` on the `agent-platform-terraform-personal-tfvars` secret,
    which only `PlatformAdmin` holds (AdminOps' wildcard-resource `SecretsManagerAdmin` Sid) --
    `PlatformDev`'s own `GetSecretValue` grant is scoped to the two inference-credential secret
    ARNs only (`InferenceCredentialsRead`), never this one. The state-parsing fallback requires
    reading remote state directly -- `tfstate/personal/*` for the personal variables and the
    terraform/bootstrap state for the two ExternalIds -- and among container profiles only
    `PlatformAdmin` (the `agent_platform_admin` profile) may do so: `PlatformDev` is explicitly
    denied `s3:GetObject` on `tfstate/personal/*` (the `DenyStateRead` statement in
    `terraform/bootstrap/platform_dev_policies.tf`'s DailyOps policy) and holds no grant on the
    bootstrap state bucket. Both procedures -- whether
    run as the raw command or via the shared `materialise_tfvars.sh` delegate, which stays
    profile-free and relies on the same ambient admin-tier credentials -- are therefore
    unreachable from the routine runtime identity by design -- either requires deliberately
    assuming the admin tier.

operator_only_break_glass:
  heading: "Operator-only / break-glass (Decision 120)"
  scope: >-
    NOT the default agent path. Retained -- not deleted -- for bootstrap, reversing a manual
    admin change, and the guard-BLOCK / out-of-budget-IAM cases the CD pipeline cannot yet apply
    on its own (Decision 94 escape hatch). Its danger is that it is ambient, not that it exists
    (Decision 126). Agents never self-direct a `terraform apply`; an agent may execute one here
    only after a human has reviewed the plan and explicitly directed it -- never self-directed,
    never the default path. The operator-recovery procedure itself is quarantined at
    `docs/contracts/deploy-paths.yaml#admin_out_of_band.procedure` (Decision 127 / tier_item
    T2.41) -- not surfaced here. The tfvars this loop needs are never fetched automatically: ADMIN sessions are routine (a project's default
    environment can be ADMIN), so fetching them as PlatformAdmin at every session start would make this loop's
    prerequisites ambient (Decision 126). Fetch them on demand with `bash bin/sync-terraform-assets.sh --tfvars` only
    when a human-directed step of this loop needs them; that command is the deliberate operator act Decision 126 asks
    for. The provider mirror holds no secret and syncs every ADMIN session as `agent_platform`
    (`provider_init_and_mirror` above).
  apply_posture: >-
    (record-backed sandbox CD, CD.35 / T2.20 Wave 1) Sandbox CD auto-apply
    (`.github/workflows/terraform-apply-sandbox.yml`; push-to-main touching
    `terraform/personal/**` auto-applies behind the guard + subagent plan review). It sources
    all no-default root-module variables except ephemeral variables (ephemeral_runtime_vars) from the `agent-platform-terraform-personal-tfvars`
    Secrets Manager entry -- the apply role's `SecretsManagerReadOnly` grant fetches its body
    to `terraform.personal.tfvars`, which is passed to `terraform plan` via `-var-file`.
    New no-default variables only require updating that secret -- no per-variable workflow edit -- except ephemeral variables (ephemeral_runtime_vars), which trusted jobs fetch at run time.
    `TF_VAR_aws_profile=""` is the sole job-level env override (blanks the named-profile default
    so the OIDC credential env vars take effect); `TF_VAR_neon_api_key` is set per terraform process only (ephemeral_runtime_vars).
