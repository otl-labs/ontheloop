---
# Class A data contract for the verification graduation registry.
# Ratified under the CD.25 pre-codegen contract ratification ritual (tier_item T3.1).
# Records every graduated verification check admitted by the differential admission gate.
# At least one field ($ref graduated_by) draws chain-depth-1 $ref into Class C source-lineage.
contract:
  id: verification-registry
  class: A
  contract_version: 6
  status: ratified
  ratified_at: "2026-06-29"
  ratified_via: "dec-102: PLAN-t3-1-verifier-harness merge to main (T3.1 CD.25 ritual)"
  description: >-
    Class A schema contract for the verification graduation registry: the cumulative
    record of deterministic checks that have been admitted by the differential admission
    gate (T3.1 / CD.29). Each row represents one graduated verification check and names
    the primitive slot it occupies (one of the six canonical CD.29 slots), the artefact
    it guards, and the plan that authored it. Indexed by guard_target + guard_symbol so
    downstream orphan detection (T3.7) is deterministic. Data files: one YAML mapping per
    check_id at config/agent/verification_registry/entries/<check_id>.yaml (Decision 176),
    read exclusively through scripts.verification_graduation's loader -- see
    governance_notes below for the full shard grammar.
fields:
  check_id:
    type: str
    iceberg_type: string
    nullable: false
    description: >-
      Unique, stable identifier for this graduated check. Human-readable slug, e.g.
      "kernel-slot-count-eq-6" or "same-pr-guard-verifier-not-in-diff".
    semantics: >-
      PRIMARY KEY of the registry. Stable across plan iterations; changing a check
      implementation requires a new check_id (immutable identity of the test, not the
      implementation). Must be unique within the data file. T3.21 ENFORCEMENT LINKAGE: when a
      PLAN-{slug}.yaml verification_plan step declares graduation: graduate, its
      graduation_check_id (scripts/roadmap/plan_document.py VerificationStep field) MUST equal
      this check_id verbatim -- validate_graduation_completeness's implement-PR leg matches a
      declared-graduate step to its registry row on the (plan_slug, check_id) pair below, and
      fails the PR when no row with that exact pair was newly added in the diff.
    populated_by: >-
      Plan author at graduation time. The implementing agent sets this when authoring
      the check definition and writing the row to
      config/agent/verification_registry/entries/<check_id>.yaml (shard_path_for), the
      filename derived from this same field (Decision 176).
    dq_intent:
      not_null: true
    amendment_log:
      - date: "2026-07-16"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          T3.21 amendment (verification-graduation-enforcement): documented the (plan_slug,
          check_id) enforcement linkage that validate_graduation_completeness's implement-PR
          leg relies on -- no type/nullability change to this field.
  primitive_slot:
    type: str
    iceberg_type: string
    nullable: false
    description: >-
      Which of the six canonical CD.29 primitive slots this check occupies. One of:
      command_exit_zero, command_output_matches, file_presence, grep_count,
      test_selector, metric_under_threshold.
    semantics: >-
      ENUM KEY into the closed CD.29 slot vocabulary. Exactly six values are legal
      (SLOT_COUNT == 6 in scripts/verification_checks.py). Adding a seventh slot
      requires a new CD; reject any value not in CANONICAL_SLOTS at registry load time.
    populated_by: >-
      Plan author at graduation time. Must match one of the six slot strings in
      scripts.verification_checks.CANONICAL_SLOTS; the registry validator enforces this.
    dq_intent:
      not_null: true
      accepted_values:
        values:
          - command_exit_zero
          - command_output_matches
          - file_presence
          - grep_count
          - test_selector
          - metric_under_threshold
  guard_target:
    type: str
    iceberg_type: string
    nullable: false
    description: >-
      The primary artefact this check guards -- a file path, module name, or logical
      subsystem identifier (e.g. "scripts/verification_checks.py",
      "scripts/verifiers/harness.py", "validate.py:same_pr_guard").
    semantics: >-
      GUARD SCOPE KEY. Used by T3.7 orphan detection to determine whether a
      guard_target that has been deleted or refactored still has live checks pointing
      at it. Values are relative paths from the repo root (no leading slash) or a
      dotted Python module name for in-process checks.
    populated_by: >-
      Plan author at graduation time. Set to the canonical relative path or module
      name of the artefact this check defends.
    dq_intent:
      not_null: true
  guard_symbol:
    type: str
    iceberg_type: string
    nullable: true
    description: >-
      Optional sub-symbol within guard_target that this check specifically guards,
      e.g. a function name, class name, or configuration key. Null when the check
      covers the entire guard_target.
    semantics: >-
      NARROWING KEY. When present, orphan detection (T3.7) uses guard_target +
      guard_symbol to pinpoint which symbol within a file is no longer present.
      Null means the check is file-level; non-null means the check would need
      re-authoring if the named symbol is renamed or removed.
    populated_by: >-
      Plan author at graduation time, or null if the check covers the full
      guard_target without drilling into a specific symbol.
    dq_intent: {}
  plan_slug:
    type: str
    iceberg_type: string
    nullable: false
    description: >-
      The plan slug that authored and graduated this check, e.g.
      "t3-1-verifier-harness". Links a graduated check back to its originating
      IMPLEMENTATION plan document in docs/plans/.
    semantics: >-
      PROVENANCE KEY. Not a FK enforced at write time but useful for audit trails.
      Matches the slug component of docs/plans/PLAN-{slug}.yaml. Future T3.7 orphan
      scans can use this to find the plan that would need updating if the check is
      invalidated. T3.21 ENFORCEMENT LINKAGE: paired with check_id (see check_id's semantics
      above), this is the join key validate_graduation_completeness's implement-PR leg uses to
      confirm a plan's declared graduate-disposition VP step produced its obligated registry row
      -- the row's plan_slug must equal the resolved PLAN-{slug}.yaml's own slug field.
    populated_by: >-
      Plan author at graduation time. Set to the slug of the IMPLEMENTATION plan
      executing the graduation (e.g. "t3-1-verifier-harness").
    dq_intent:
      not_null: true
    amendment_log:
      - date: "2026-07-16"
        semantic_break: true
        change_class: governance_note_add
        summary: >-
          T3.21 amendment (verification-graduation-enforcement): documented the (plan_slug,
          check_id) enforcement linkage that validate_graduation_completeness's implement-PR
          leg relies on -- no type/nullability change to this field.
  graduated_at:
    type: str
    iceberg_type: string
    nullable: false
    description: >-
      ISO-8601 date when this check was admitted by the differential admission gate
      and added to the registry (e.g. "2026-06-29").
    semantics: >-
      AUDIT TIMESTAMP. Calendar date (not datetime) to avoid timezone ambiguity in
      the filesystem-backed YAML data file. Populated at plan execution time; not
      updated on re-runs.
    populated_by: >-
      Plan author at graduation time. Set to the ISO date of the implementing session
      (today's date when the row is written).
    dq_intent:
      not_null: true
  graduated_by:
    $ref: source-lineage.yaml#/contract/fields/registry_key
    dq_intent_local: {}
    governance_notes_local: >-
      The agent type or author identity that ran the differential admission gate and
      inserted this row. Draws from the canonical source-lineage registry (Decision 66):
      values are canonical_id entries from config/agent/data_quality/source_registry.yaml.
      Nullable for bootstrap rows authored before the gate was live; all post-T3.1 rows
      should carry a value. Chain-depth-1 $ref satisfies the CD.25 cross-system $ref
      requirement for Class A graduation.
  check_spec:
    type: dict
    iceberg_type: string
    nullable: true
    description: >-
      Nested mapping of the kernel check's primitive parameters, keyed by the
      primitive_slot's constructor fields -- e.g. {"path": "...", "pattern": "...",
      "operator": "eq", "count": 1} for grep_count; {"command": [...], "expected": "...",
      "use_regex": false} for command_output_matches; {"path": "...", "mode":
      "exists"|"absent"} for file_presence; {"node_id": "tests/x.py::T::test_y"} for
      test_selector; {"command": [...], "threshold": 1.0} for metric_under_threshold;
      {"command": [...]} for command_exit_zero.
    semantics: >-
      MATERIALIZATION KEY (VF-06). Without this field a registry row records only the
      check's provenance, not its runnable definition -- scripts.verification_graduation
      cannot reconstruct a runnable check from the row, so the differential admission
      gate cannot re-execute the check against a reverted tree. Field shape is
      slot-dependent; validated structurally by the schema check (present + a mapping)
      rather than per-slot at the contract layer -- per-slot required-key validation
      happens in scripts.verification_graduation.materialize_check_in_tree at
      materialization time (fail-loud, GraduationError, on a missing required key for
      the row's slot).
    populated_by: >-
      The verification graduation producer (scripts.verification_graduation, invoked
      from the tier-item bookkeeping walk, docs/contracts/tier-item-lifecycle.yaml#bookkeeping_walk)
      at graduation time, from the concrete check object being graduated (e.g.
      GrepCountCheck(path=..., pattern=..., operator=..., count=...)).
    dq_intent: {}
    amendment_log:
      - date: "2026-09-12"
        semantic_break: false
        change_class: prose_improvement
        summary: >-
          PLAN-skills-layer-prose-relocation: re-pointed "the implement skill's Tier_item
          bookkeeping walk" to docs/contracts/tier-item-lifecycle.yaml#bookkeeping_walk, the
          walk's new home. No field shape changed.
governance_notes: >-
  RE-GRAIN (Decision 176, 2026-08-24): the data file under config/agent/verification_registry/
  is no longer a single flat registry.yaml -- one record now lives at
  entries/<check_id>.yaml (config/agent/verification_registry/entries/<check_id>.yaml in full),
  filename-equals-check_id enforced structurally by validate_verification_registry's placement
  leg (never a documented convention alone). scripts.verification_graduation's load_entries() / entries_at_ref() /
  shard_path_for() are the SOLE READ PATH -- no other module hand-rolls a path join to either
  layout. config/agent/verification_registry/entries/deprecated/ is a reserved, loader-excluded
  retirement subtree (a single-level, non-recursive directory glob structurally excludes it,
  not a documented convention): git mv a record there to retire it, no status column, no
  version key, no other lifecycle machinery. Any future orphan sweep (T3.7, the named successor
  lifecycle instrument for the retired size roster) must read entries/deprecated/ explicitly,
  since the live loader never does. Three anti-accretion commitments bind every future
  consumer: (1) no index or manifest listing the entry files -- the directory listing IS the
  index; (2) no cached aggregate (e.g. a stored corpus count) -- any count is computed from the
  glob, never read from a bumped number; (3) the differential gate's merged corpus (current
  tree union origin/main baseline) exists ONLY IN MEMORY, never materialized to disk, which
  would recreate the contended hot file this re-grain removes. The 6,000-effective-line /
  2,315-character CALIBRATED CEILING this file was seeded at under Decision 166 point 6 is
  RETIRED along with the flat file -- config/structural_size_budgets.yaml carries no roster
  entry (raised or otherwise) for the registry; each shard is governed implicitly by the config
  class's per-file default instead. Re-authoring: of the eight self-referential rows enumerated
  in Decision 176, six were re-pointed at the loader in place (check_id and claim preserved,
  only the internal reference to the deleted flat path changed); TWO retired into
  entries/deprecated/ instead -- the first exercisers of the retirement path this paragraph
  reserves. plan-obligations-enumeration-homed's one-shot migration-moment claim had already
  gone stale (permanently FAIL, unnoticed because graduated records are never re-executed as a
  standing suite). no-retired-ci-role-in-live-surfaces was DISCOVERED tautological by this same
  migration's own new modified-record differential rule (VP step 6): re-pointing its registry
  target from the deleted flat path to entries/ triggered its first re-differential since
  graduation, which revealed the retired CI role names it guards against have been absent from
  every one of its scanned surfaces on every reachable ref for long enough that no revertable
  counter-example remains -- permanently TRUE rather than permanently FALSE, the same
  un-provable-going-forward shape as its sibling, so it retires under the identical rule rather
  than being edited to force a fake admission.

  PLAN-vp-replay-rg-portability-guard (2026-09-18): vp-replay-coverage-survives-absent-ripgrep was
  modified in place. Its check_spec resolves the exit-2 arm by scanning a source file for the
  literal `_RG_GREP_ERROR_EXIT_CODE and`, and that line relocated from
  scripts/checks/verification/validate_vp_replay.py to the new sibling _vp_replay_classify.py when
  Decision 128 forced a decomposition. Only the `src=` literal and guard_target changed -- the
  `--cov` target already named the package directory, and the assertion is otherwise identical --
  so this is the same claim-preserving read-path repair the paragraph above settles, and the row
  keeps its check_id, plan_slug and graduated_at.

  DECLARED RESIDUAL from the same change: five sibling rows -- vp-red-before-classes-distinct,
  vp-replay-classifier-arms-do-not-alias, vp-red-before-tautological-fails,
  vp-red-before-unmeasurable-hard-fails (guard_symbol: _classify_outcome) and
  vp-red-before-classifier-self-test (guard_symbol: _run_classifier_self_test) -- now name symbols
  that live in _vp_replay_classify.py while their guard_target still reads validate_vp_replay.py.
  They were deliberately NOT repointed, and the reason is mechanical rather than cosmetic:
  _modified_entries compares the whole parsed mapping, so a metadata-only guard_target edit marks
  a row modified and re-submits it to run_differential -- and all five are test_selector rows whose
  node_ids exist and PASS at origin/main, so the revert would produce PASS, not FAIL, and each
  would be rejected as "not admitted -- revert did not produce FAIL (tautological)". Repointing
  them would redden CI on five rows to correct metadata that nothing reads: `grep -rn guard_symbol
  scripts/` returns zero hits, and T3.7 orphan detection is unbuilt. Recorded here so the staleness
  is visible rather than silent; a future change that gives guard_symbol an evaluator must repoint
  them in the same act that gives their assertions a reason to change.

  rec-3059 wave 2 (PLAN-class-d-enforcers-wave-2, 2026-08-16): three rows dispositioned for the
  evaluator.none_grandfathered retirement (full record:
  docs/contracts/contract-population.yaml's retirement_notes.evaluator_none_grandfathered).
  RETIRED: enforcement-route-required-on-none-grandfathered (guard_symbol EnforcementRoute,
  node_id in tests/test_contracts.py -- both deleted with the model). RE-AUTHORED, claim
  NARROWED: contracts-grandfather-only-forms-both-directions, whose node_id named a test this
  plan deletes; repointed at the surviving status:active leg, and its claim narrows --
  post-deletion "both directions" collapses to the birth direction alone, since
  _ALLOWED_TRANSITIONS carries no inbound edge to active. RE-AUTHORED, command edit only:
  contract-census-declared-includes-env-taxonomy, whose command asserted
  `meta.evaluator.none_grandfathered is None`; that assertion is dropped since the field no
  longer exists to assert against. Two rows ADDED: none-grandfathered-kind-unrepresentable (the
  plan's core unrepresentability claim) and composite-action-roster-parity-red-path (the
  composite-action-shape-rosters mirror test's roster-drift red-path exemplar). Net effect: +1
  row. This is an ordinary removal recorded as a governance note, not the CD.29 mark-then-drop
  archival lifecycle (Decision 166 point 6) -- that lifecycle is gated on an unratified
  candidate decision.

  PLAN-executor-substrate-guard-deferral (2026-08-25): t4x-persona-contracts-mechanism-word-free's
  check_spec was repaired IN PLACE -- its positional `c1=t42['exit_criteria'][0]` read repointed
  to `[0]['text']` once T4.2's exit_criteria converted to ledger-form ExitCriterion objects. This
  is a CLAIM-PRESERVING edit: the assertion it makes (all nine de-mechanised sites, including
  T4.2:c1, stay mechanism-free and property-bound) is unchanged, so the row keeps its check_id,
  plan_slug and graduated_at as-is, per the precedent contract-census-declared-includes-env-
  taxonomy (re-authored command-only, retaining plan_slug cfg-11-environment-taxonomy-conversion
  and graduated_at 2026-08-13). Decision 176 deleted every per-record lifecycle field, so this
  governance_notes block is now the only provenance surface an in-place modification can land on
  -- both prior modification waves above used it too. This also settles the question the
  check_id field's own semantics note raises above ("changing a check implementation requires a
  new check_id"): repairing a check's read path after its TARGET's shape changed underneath it,
  with the check's own assertion otherwise identical, is not "changing a check implementation" in
  the sense that clause guards against, and keeps its check_id.

  PLAN-verification-graduation-gate-fix (2026-08-31): the differential admission gate's revert
  leg no longer treats every FAIL as content discrimination. scripts.verification_graduation.
  git_worktree now provisions a scratch worktree's `.venv` as a symlink to repo_root's own
  `.venv` when one exists (keyed off the repo_root ARGUMENT, never the module-level ROOT, so a
  synthetic fixture repo stays unprovisioned); run_differential's revert leg, on a FAIL, first
  proves every allowlisted interpreter token (bin/venv-python, python3, python, bash, sh)
  referenced ANYWHERE in the check's command -- not only argv[0] -- can actually launch in that
  worktree, raising GraduationError (never a silent admission) if any cannot. Before this change,
  an unprovisioned worktree made a bin/venv-python-headed check FAIL for purely environmental
  reasons (no `.venv` to resolve), which the gate misread as the check discriminating between
  pre- and post-change content and silently admitted -- exempting 139 of 484 registry rows from
  real differential scrutiny. This is a LOCAL-ONLY defect: CI's own differential runs venv-less
  (validate.py invoked via a hosted interpreter with no `.venv` anywhere), so CI's admission
  decisions were always honest; the fix corrects the advisory signal an agent sees locally when
  choosing graduate vs waive.

  ci-rca-lifecycle-records-watched-set re-authoring (PLAN-verification-graduation-gate-fix,
  2026-08-31): the shard's check_spec asserted `'contract' not in d and 'class' not in d`, false
  since commit eaff8043 (PR #895) seeded this contract's Class D envelope -- contract.class ==
  'D' has held on both HEAD and origin/main ever since, so the assertion passed vacuously
  regardless of the row's named claim. Repaired to assert the envelope's presence
  (`d['contract']['class'] == 'D'`) instead, keeping all six existing keyword floor terms
  verbatim (each independently verified present on origin/main, so none is the discriminator)
  and adding one new raw.index() assertion keyed on a distinctive substring introduced by this
  same plan's docs/contracts/ci-rca-lifecycle.yaml correction (verified absent from
  origin/main). check_id RETENTION: per this file's check_id semantics ("changing a check
  implementation requires a new check_id") and the precedent paragraph above, this edit is
  claim-PRESERVING for the row's named claim (the six floor terms recording the watched set are
  unchanged) and claim-ADDITIVE in that it introduces one new discriminating assertion -- the
  dropped envelope-shape assertion was incidental scaffolding about the file's shape, never the
  row's named claim, so the check_id, plan_slug and graduated_at are kept as-is.

  PLAN-platform-role-iam-change-alarms (rec-4044, Decision 202, 2026-09-25):
  cloudtrail-read-only-no-write-verbs RETIRED by git mv into entries/deprecated/ (a 100% rename,
  content untouched). Its claim -- no CloudTrail write verb anywhere under terraform/ -- is
  deliberately NARROWED by Decision 202, which grants PlatformAdmin exactly six trail-management
  verbs on the one platform-security trail. This is a Decision-authorised re-decision of the claim
  (Decision 181), not a weakening to obtain green: an in-place edit is forbidden because check_id
  is immutable and the narrowed claim would pass at origin/main (tautological). The replacement,
  cloudtrail-write-grant-scoped-to-platform-trail, asserts LookupEvents is still granted, that every
  non-read cloudtrail verb sits in the single PlatformSecurityTrailManage statement (exactly six
  verbs on one trail ARN, attached only to PlatformAdmin), and that StopLogging, DeleteTrail and
  cloudtrail:* appear nowhere. It keys on the Sid rather than a path, so
  PLAN-platform-iam-bootstrap-adopt's move of PlatformAdmin into terraform/bootstrap needs no
  repoint.

  PLAN-ccr-branch-prefix (rec-4257, rec-4193, 2026-10-11): git-ops-branching-prefixes-match-sweep-
  declaration and ci-signal-green-predicate-matches-sweep-declaration were edited IN PLACE. Both
  are claim-PRESERVING (the set-parity claim across the contract, the sweep declaration and the
  signal-green predicate is unchanged) and claim-ADDITIVE: their slash-only token regexes become
  full-token extraction, which closes a vacuous pass once a hyphen-terminated prefix is declared
  (the old regexes were blind to ccr- on every side), and each gains the discriminating assertion
  that ccr- is a member. Both fail on origin/main and pass on HEAD. Per this file's check_id
  semantics and the ci-rca-lifecycle-records-watched-set precedent above, both keep check_id,
  plan_slug and graduated_at.

  PLAN-platform-iam-bootstrap-adopt (rec-3838 plan 1 of 2, 2026-10-15): three rows repointed
  CLAIM-PRESERVING (check_spec and guard_target only, assertion unchanged) from
  terraform/personal to terraform/bootstrap, keeping check_id, plan_slug and graduated_at --
  platformadmin-metric-read-verbs-present, personal-policies-carry-byte-preconditions and
  platformdev-bounded-platformadmin-excluded. A fourth row, platformdev-state-convergence-
  denies-intact, is a DECLARED RE-AUTHORING, check_id retained: its len(w)==2 DenyState-count
  assertion had been silently red since #1223 added two version-read/list Deny Sids (graduated
  rows re-run only on admission, so the drift went unnoticed); repointed to terraform/bootstrap
  and the assertion replaced with the exact four-Sid set (DenyStateAndConvergenceWrite,
  DenyStateRead, DenyStateAndConvergenceVersionRead, DenyStateAndConvergenceVersionList), a
  claim-preserving-and-strengthening narrowing under Decision 181 (a looser >=2 would be a
  weakening). All four are admitted by run_differential because the bootstrap paths are absent
  on origin/main. DECLARED RESIDUAL: the platform-dev-data-lake-read-fence shard keeps
  guard_target terraform/personal/platform_dev_policies.tf -- a metadata-only repoint there
  would be re-submitted and rejected as tautological (its node_id passes at origin/main);
  owner rec-4047, the same residual the sibling plan's step 2 sweep carries forward. Two new
  rows graduated: platform-iam-bootstrap-owns-roles-and-policies (the durable ownership claim)
  and deploy-paths-admin-self-access-isolation-step (the admin-procedure ordering claim).

  PLAN-persona-eval-lane (Decision 231, 2026-10-19): roadmap-exr050809-t4-13-14-t5-6-shape RETIRED by
  git mv into entries/deprecated/ (a 100% rename, content untouched). Its T4.14 leg (status
  not_started, depends_on [T4.2]) is a claim Decision 231 deliberately re-decides -- T4.14 is parked
  deferred_post_mvp and its edge re-pointed to T4.10a -- and check_id is immutable, so the row is
  retired rather than edited in place, as in the Decision 202 cloudtrail retirement above -- a
  Decision-authorised re-decision of that one leg, not a weakening to obtain green (Decision 181). The
  replacement, roadmap-exr050809-shape-t414-parked, keeps the T4.13, T5.6 and T4.4 legs verbatim and
  asserts T4.14's parked shape; it fails on origin/main and passes on HEAD, so run_differential admits
  it. DECLARED RESIDUAL: two resolved plans still name the retired id in waived historical steps --
  docs/plans/PLAN-persona-first-migration.yaml step 10 and
  docs/plans/PLAN-persona-event-origin-plans-in-git.yaml step 18 with its two test_obligations rows --
  never replayed (validate_vp_replay replays diff-present plans only) and never edited
  (implementing_plan_bookkeeping).

  PLAN-oidc-owner-segment-prestage (2026-10-20): github-org-transfer-contract's check_spec was
  edited IN PLACE -- its `grep -q 'agent_surface: docs/CLAUDE.md'` term now reads
  `grep -q 'check: validate_github_org_transfer'`, because the contract's evaluator became that
  registered check (rec-3902). The claim evolves with its target: the row still asserts the
  contract exists, names its evaluator and is pointed at from docs/CLAUDE.md, with the evaluator
  now the check rather than the agent surface. It fails on origin/main and passes on HEAD, so
  run_differential admits it. The row keeps its check_id, plan_slug and graduated_at, per the
  in-place precedents above.

  PLAN-project-alignment (rec-3214, 2026-10-25): plan-obligations-command-wired was edited IN PLACE --
  only its first assert's message changed (it now reads "Step 6 (alignment sign-off) does not invoke
  the obligation query": Step 4 no longer runs the obligation query, and the old sub-step label it
  named is retired). Both asserted conditions are byte-identical, so
  this is a CLAIM-PRESERVING, message-only edit and the row keeps its check_id, plan_slug and
  graduated_at, per the in-place precedents above. The edit re-entered run_differential, which
  rejected the unmodified shard because its second assertion ("split the plan" in plan.md) had been
  failing since PR #1050 reworded the Step 9 escalation menu; the repair is the gloss
  '; split means split the plan per Step 8's Planning-time split' added to plan.md Step 9, with the
  menu literal itself unchanged. The shard now fails on origin/main and passes on HEAD, so the
  differential admits it. The assertion was never repointed (Decision 181).
amendment_log:
  - {date: "2026-10-25", semantic_break: false, change_class: governance_note_add, summary: "PLAN-project-alignment (rec-3214): governance note recording the in-place, message-only edit of plan-obligations-command-wired and the plan.md gloss that repairs its guarded phrase. No field schema change."}
  - date: "2026-10-20"
    semantic_break: false
    change_class: governance_note_add
    summary: >-
      PLAN-oidc-owner-segment-prestage (rec-3902): governance note recording the in-place repoint
