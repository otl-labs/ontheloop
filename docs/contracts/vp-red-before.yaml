# The FOUR frozen outcome classes a dynamically-replayed graduate step's result is classified
# into (scripts.checks.verification.validate_vp_replay.OUTCOME_CLASSES derive-and-asserts equal
# to this list -- the contract and the code cannot drift on the vocabulary the contract exists to
# freeze). Only "tautological" and "unmeasurable" are hard failures; "target_absent" and
# "assertion_failed" are both legitimate red-before outcomes and pass.
outcome_classes:
  - tautological
  - target_absent
  - assertion_failed
  - unmeasurable

# The five arms "unmeasurable" subsumes -- never five separate top-level classes. Any one of
# these hard-fails the check; none is ever counted as a genuine red-before pass.
unmeasurable_arms:
  - exit_126_not_executable
  - exit_127_command_not_found
  - rg_or_grep_error_exit_2
  - credential_absence
  - subprocess_timeout

implement_leg_partition: >-
  scripts.checks.verification.validate_vp_replay._partition_steps' GREEN-AFTER implement leg
  (unrelated to the eligibility_predicate below, which governs the inverted plan-only leg): a
  hermetic pre-deploy step whose command is PR-relative (_is_pr_relative -- matches both
  `git diff origin/main -- <path>` and `git show origin/main:<path>`, the shape of
  PLAN-vp-red-before-gate.yaml step 16, the command behind rec-3845) is EXCLUDED from replay,
  with a printed reason, when the MEASURED base ref has collapsed: `git merge-base --is-ancestor
  HEAD origin/main` (ancestry, never strict SHA equality -- origin/main may advance past HEAD
  between merge and post-merge validation, and the step is still vacuous either way). This is the
  only condition that excludes it -- never `graduation`, which stays untouched (Decision 132
  freezes waive/not-applicable as "requiring no registry row"; it is never read as "replay-
  excluded"). A step that is PR-relative but whose base has NOT collapsed still replays normally
  at PR time -- no PR-time verification is lost (Decision 159/187).

eligibility_predicate: >-
  A plan is eligible for the inverted-polarity leg iff BOTH hold: (1) its path status in
  scripts.checks._common.get_status_aware_diff(root) is "A" or "??" (added or untracked-new --
  the same added-in-diff population
  scripts.checks.roadmap.validate_plan_documents._added_plan_names already derives), AND (2) its
  implementation_declared field reads falsy in the CURRENT working tree. A plan present in the
  diff with any other status (e.g. "M", modified) is exempt regardless of its declared state --
  that population is scripts.checks._common.resolve_declared_plans' edge-triggered implement leg
  (Decision 148), and the whole post-implementation-edit population besides. Never
  resolve_declared_plans' edge trigger, and never implementation_declared alone: that field
  landed 2026-08-17 and 335 of 422 plans do not carry it, so it reads falsy forever on every
  legacy plan -- keying on it alone would route every one of them into this leg.

negated_sweep_lint: >-
  A static, non-executing lint over EVERY pre-deploy step of an eligible plan (both dispositions
  -- not gated to graduate, since this defect is orthogonal to graduation and reaches the
  waive/not-applicable population the dynamic leg never touches): a `! rg PATTERN PATH` or
  `! grep PATTERN PATH` shell negation whose PATH argument does not exist on disk is flagged --
  shell negation maps rg/grep's exit 2 (missing path) to a false success, silently greening a
  sweep that should have failed. Fails OPEN on anything it cannot confidently parse (a
  multi-word or flag-bearing remainder, a quoted or shell-metacharacter-bearing path token, or
  more than one candidate path token) -- over-detection is the worse failure here, so an
  ambiguous parse is never flagged.

rg_portability_lint: >-
  A static, non-executing lint over every pre-deploy step of every diff-present plan that is ADDED
  or RESOLVED -- precisely the two populations whose steps are executed (the red-before leg replays
  an added plan's graduate steps; the implement leg replays a resolved plan's hermetic steps). It
  flags a command invoking `rg` (ripgrep), which is absent from the GitHub-hosted runner: such a
  step exits 127 wherever it is replayed, which the implement leg reports as an ordinary divergence
  and the red-before leg classifies `unmeasurable`, a hard failure. Catching it at authoring time
  is the point -- the failure is otherwise discovered only when a plan's own implement PR reddens.
  Detection is PROGRAM POSITION, never substring: the command is split on shell control operators,
  each segment is `shlex.split`, a leading `!`, an `env` wrapper and any directory prefix are
  stripped, and only the argv HEAD is tested. A substring rule would flag any command that merely
  NAMES ripgrep inside a quoted string -- including the commands that assert this very lint. Fails
  OPEN on a segment `shlex` cannot parse (over-detection is the worse failure, matching
  negated_sweep_lint's posture above). NEITHER under-inclusion arm is silent: the count of
  out-of-population plans and the count of unparseable segments are each printed, per this check's
  standing rule that anything outside a leg's set is EXCLUDED with a reason. Merely-MODIFIED plans
  are deliberately outside the population -- linting them would redden an unrelated PR that touches
  an old plan for unrelated reasons. Sited as a PRE-PASS ahead of both legs, never inside
  `_red_before_leg`, which `continue`s on a resolved plan before reaching its lint call site.
  Finding strings carry the `vp-rg-portability` prefix: `vp-red-before-lint` is asserted absent by
  the negated-sweep tests whose `! rg` fixtures this lint also flags, and a `vp-replay` prefix
  would suppress the implement leg's summary PASS line. A finding is never resolved by installing
  ripgrep on the runner -- the graduated shard vp-replay-coverage-survives-absent-ripgrep pins the
  absent-ripgrep condition -- nor by relabelling a creds-free step `hermetic: false` to dodge
  replay. The fix is POSIX `grep` in CANONICAL argument order (`grep -n -A 10 PATTERN PATH`): under
  POSIXLY_CORRECT=1 GNU grep stops permuting, treats `-A` and `10` as filenames, exits 2 and still
  prints its matches with the context window silently dropped -- so a negated probe reading a
  context line inverts to a false pass.

precedence: >-
  When BOTH the negated-sweep lint and the dynamic tautological classification fire on the SAME
  step (only possible on a graduate step, since only graduate steps are dynamically replayed),
  the dynamic tautological failure is reported and the lint finding on that step is suppressed --
  the two would otherwise double-report the identical underlying defect (a negated rg/grep
  silently exiting 0 on an absent path IS a tautological outcome under dynamic replay too).

recursion_refusal: >-
  A GRADUATE pre-deploy step whose command invokes scripts.validate is refused STATICALLY, before
  execution, on the same eligible-plan population the negated-sweep lint binds. Keyed on
  invocation SHAPE -- an argv head of `-m scripts.validate` (any interpreter) or a bare/prefixed
  `scripts/validate.py` path used as the executed program -- never a bare `scripts[/.]validate`
  substring match, which would refuse 11 of 11 merged occurrences as false positives (8 imports of
  the __main__-guarded module, 2 SLOC-counting reads, 1 grep for a function name). Binds the
  GRADUATE partition only -- a waive or not-applicable step may name scripts.validate freely,
  since nothing executes it. Measured empirically empty (0 of 775 merged graduate pre-deploy
  steps invoke scripts.validate today) -- the refusal is PROPHYLACTIC, not remedial: this very leg
  is what first makes a plan-only PR execute anything at all, and this plan's own steps 17 and 18
  are the first two commands that would trigger it, waived for exactly that reason.

hermetic_authoring: >-
  Relocated from .claude/skills/planning/SKILL.md's "Hermetic authoring" section (T3.15/VF-01,
  amended by Decision 148/plan-resolution-content-keyed; Decision 189). `hermetic: true` is the
  correct default for `pre-deploy` feature-verification steps -- narrow, deterministic,
  creds-free commands. A pre-deploy step is now replayed under TWO possible polarities,
  never one: the IMPLEMENT leg replays a resolved plan's hermetic steps GREEN-AFTER against the
  complete tree (unchanged from Decision 148); the PLAN-ONLY leg, when the plan is ELIGIBLE
  (added in this diff AND implementation_declared falsy), additionally replays its `graduate`
  pre-deploy steps RED-BEFORE against the un-implemented tree (Decision 189 -- this negates
  Decision 148 point 1's "no execution against an implementation-less tree" ruling for exactly
  this population). A MODIFIED (not added) plan-only PR still defers with a printed reason,
  whatever it declares. Advisory-SKIPs on unreachable origin/main. bin/venv-python is safe here --
  it falls back to a sentinel-dep-importing interpreter when .venv is absent, resolving in
  venv-less CI too. A pytest pre-deploy step is `hermetic: true` by default, and stays
  `hermetic: false` only when it (i) needs credentials, network or live infrastructure; (ii)
  invokes scripts.validate (recursion -- the graduate partition is refused statically at
  plan-PR time, see recursion_refusal above); (iii) targets tests that depend on a package
  absent from requirements-fast.txt (a module-level pytest.importorskip, today mostly duckdb) --
  venv-less pr-validate collects no tests there (pytest exit 4 "found no collectors" for a node
  or class selector, exit 5 for a whole-file selector) and the implementer cannot flip the flag
  later (implement-scope-boundary.yaml implementing_plan_bookkeeping) -- an interim workaround
  for an environment mismatch, enforced at plan-PR time by validate_hermetic_fast_tier_collectability
  for target files that exist (added by rec-2809); it
  covers direct module-level guards or imports in the target file and its conftest chain, while
  transitive first-party imports, an already-merged unbuilt plan's existing steps, and a later edit
  to one are not examined (residuals owned by rec-4763; the one live instance today is owned by
  rec-4765). A target the implementation creates or newly guards is caught before push by the
  CI-parity agent-container --pre (scripts/checks/deps/fast_tier_env.py), and its remaining
  plan-amendment cost is owned by rec-4757. The root-cause alternative (a replay environment
  carrying these packages) is closed by the keep-PR-CI-light ruling (Benjamin, 2026-10-18) (Decision
  181 point 2 / Decision 148 "fix at root cause"); (iv) is side-effectful or runs
  out-of-tree; or (v) is a whole-file or whole-directory pytest re-run of test files the plan's
  own scope creates or modifies (always inside the --pre pytest_diff affected set, so the author
  can check it at plan time), or a ruff check/format phase, so replay would spend the non-test
  half for no added independence. A pytest NODE or CLASS selector is never covered by (v) and
  stays `hermetic: true` -- it additionally proves the named node exists (a missing node exits
  4), which no tier phase checks. The rule points replay cost at replay_bound.

graduation_disposition_authoring: >-
  Relocated from .claude/skills/planning/SKILL.md's "Graduation disposition authoring" section
  (T3.21, enforced VF-05; Decision 189). Every `phase: pre-deploy` VP step must carry a
  `graduation` field -- one of `graduate`, `waive`, or `not-applicable`.
  validate_graduation_completeness's plan-PR leg (--pre and full tiers) fails a diff-added or
  diff-modified PLAN-*.yaml that leaves any pre-deploy step's disposition unset. Classify each
  pre-deploy step at plan-authoring time: `graduate` -- the step's command is expressible as one
  of the six canonical primitive slots in scripts.verification_checks.CANONICAL_SLOTS
  (command_exit_zero, command_output_matches, file_presence, grep_count, test_selector,
  metric_under_threshold) AND is hermetic-or-cheap enough to run as a standing regression guard;
  requires graduation_check_id, a stable slug the implementing session uses verbatim as the
  registry row's identity. `waive` -- kernel-expressible in principle but impractical to graduate
  now (e.g. it depends on this session's transient repo state, or duplicates an
  already-graduated check); requires graduation_waiver_reason, a substantive reason the
  plan-critique gate reviews for honesty. `not-applicable` -- NOT kernel-expressible: multiple
  commands, human/LLM judgement, live infrastructure (a V3 deploy/invoke), or wall-clock/
  credential state; no extra field required. Plan critique is the honesty check on this call,
  applied before the fix exists. WHEN UNSURE, prefer `waive` or `not-applicable` -- the two
  dispositions this gate never executes at plan-PR time. A false `graduate` is no longer merely a
  mandatory waive-with-reason detour at implement time (Decision 148's original framing) -- under
  this gate it is a HARD PLAN-PR FAILURE, since a graduate step that is green-by-construction on
  the un-implemented tree now reddens the plan's OWN PR before the fix exists (rec-3777 tracks the
  residual incentive this creates toward under-classifying as not-applicable; that monitoring is
  not this contract's concern).

carrier_rule: >-
  PLAN-vp-expected-literal-carrier: the assertion carrier a hermetic step's replayed
  stdout+stderr is checked against is SELECTED by the plan's own `schema_version`
  (scripts.roadmap.vp_literals.select_literals, delegated identically by both of
  validate_vp_replay's legs). schema_version 4-and-below keeps the pre-existing implicit carrier
  -- a backtick-delimited literal anywhere inside the free-prose `expected` field. schema_version
  5 REPLACES that implicit sigil with an explicit one: a hermetic step declares
  `verification_plan[].expected_literals` (a list of strings, empty or absent both PERMITTED --
  B1 dropped the non-empty requirement so the marker idiom and every plain exit-0-only step stay
  authorable) and a backtick literal inside that same step's `expected` field is refused at
  schema-validation time (scripts.roadmap.plan_document), naming `expected_literals` as the fix.
  Both new fields bind ONLY a hermetic step -- a non-hermetic step's `expected` is free prose no
  leg ever programmatically checks, so backticks there stay harmless markdown. Never accepted
  below schema_version 5 (refused outright, not silently ignored under extra=forbid's per-field
  blindness to cross-field version gating).

self_satisfying_lint: >-
  ADVISORY (scripts.roadmap.vp_literals.find_self_satisfying_literals, run by
  scripts.roadmap.plan_document at schema-validation time -- never raises, only WARNs): a
  schema_version 5 hermetic step's `expected_literals` entry that appears VERBATIM inside that
  same step's own `command` text is redundant with that command's exit-0 -- the command already
  names the token as one of its own arguments, so the assertion adds nothing a passing exit code
  did not already guarantee. Reported, never rejected: this is the repo's established marker
  idiom (`echo MARKER`, `grep -o -m1 TOKEN FILE`, including the PR #1202 shape below) and must
  stay authorable. Named `self_satisfying`, deliberately NEVER `tautological` -- that word is
  reserved above (outcome_classes) for the DYNAMIC replay outcome vocabulary; reusing it here for
  an unrelated STATIC property in the same contract file would be drift. Measured on the merged
  corpus at authoring time: roughly two-thirds of the enforced literal population is
  self-satisfying under this definition -- redundant, not defective, hence advisory rather than a
  gate.

unsat_guard: >-
  HARD-FAILING (scripts.roadmap.vp_literals.find_unsatisfiable_literals, run by
  scripts.roadmap.plan_document at schema-validation time -- raises, blocking commit): a
  schema_version 5 hermetic step's `expected_literals` entry is REJECTED when the step's own
  `command` is a chain of grep/rg invocations joined by shell control operators (`&&`, `||`,
  `;`, `|`) in which EVERY invocation is confidently silenced -- carries `-q`/`--quiet`,
  `-c`/`--count`, `-l`/`--files-with-matches`, or `-L`/`--files-without-match` without an
  overriding `-o`/`--only-matching`, or redirects to `/dev/null` -- so the chain can never print a
  matched literal to stdout+stderr no matter how correct the implementation is. This is the
  historical PLAN-g4-byte-source-and-post-expiry-bound VP1 shape (four `grep -q` calls chained
  with `&&`) that PR #1202 fixed by changing its fourth call to `grep -o -m1 "drain" FILE` --
  which this guard accepts (an `-o` call is never confidently silent) and the self_satisfying_lint
  above separately flags advisory (`drain` appears verbatim in that same command).

  The suppressor set this guard treats as confidently silencing is declared as real data in
  `unsat_guard_suppressor_flags` below (never restated here), asserted equal to the code's own
  tuple by TestContractSuppressorParity so the contract cannot drift from the code.

  Fails OPEN on anything it cannot confidently classify -- a non-grep/rg program, an unparseable
  shell segment, or a grep/rg call carrying `-o` -- is treated as satisfiable, never rejected.
  This is a NARROW regression guard for one historical shape, not a general emittability prover:
  it does not reason about `python -c` or module-invocation commands, which the carrying plan
  measured at 86% of the enforced literal population. That residual is UNENFORCED by design and
  owned by rec-3932 (evaluating a closed command-shape vocabulary broad enough to cover it) --
  never silently treated as "safe" by this guard's silence on it.

# The unsat_guard's suppressor set as real data (never restated as prose above) -- kept sorted so
# a diff shows exactly which flag changed. TestContractSuppressorParity asserts this list equal
# to scripts.roadmap.vp_literals.SUPPRESSOR_FLAGS.
unsat_guard_suppressor_flags:
  - "--count"
  - "--files-with-matches"
  - "--files-without-match"
  - "--quiet"
  - "-L"
  - "-c"
  - "-l"
  - "-q"

# PLAN-vp-replay-deadline-from-shared-budget: the shared-aggregate deadline model a replayed VP
# step's subprocess runs under (scripts.checks.verification._vp_replay_budget). The three
# fractions are derive-and-asserted equal to that module's own constants by
# TestContractPins::test_replay_bound_matches_the_contract -- the contract and the code cannot
# drift on the numbers this file exists to freeze.
replay_bound:
  per_step_warn_fraction: 0.5
  cumulative_warn_fraction: 0.8
  authoring_max_fraction: 0.25
  deadline: >-
    A replayed step's subprocess deadline is the REMAINING share of the shared
    MAX_AGGREGATE_SECONDS aggregate (validate_vp_replay._ReplayBudget.remaining()), never a flat
    per-step cap -- the deadline shrinks as prior steps in the same dispatch spend it. Replaces
    the retired flat PER_STEP_TIMEOUT_SECONDS (30s), which bound wherever replay ran regardless of
    how much of the aggregate remained (Decision 182 reversal condition (b)).
  kill: >-
    A step that reaches its deadline is killed by SIGKILL to its WHOLE process group
    (_vp_replay_budget.run_bounded -- never a bare process kill, which would orphan a descendant);
    its failure text carries TIMEOUT and "aggregate deadline". On the red-before leg the same kill
    sets the named TIMEOUT_OUTCOME directly (rec-3835), never consulting the classifier -- the
    four frozen outcome classes above are unchanged. One budget-exhaustion event yields EXACTLY
    ONE failure per dispatch (rec-3833): whichever leg first observes the exhausted budget reports
    it, and every later check across both legs sees it already reported and stops silently.
  authoring: >-
    Author a hermetic pre-deploy step to stay under authoring_max_fraction (25%) of the aggregate,
    measured before merge. A step that cannot be narrowed below that target states its measured
    duration and why in its own fix_if or the plan context, and stays hermetic -- the target is
    ADVISORY and surfaces after the fact through the terminal per-dispatch summary line; the
    deadline above and the per_step_warn_fraction/cumulative_warn_fraction band are what actually
    bind. The warn band never appends to a check's failed[] list -- it is drift visibility, never a
    gate.

# PLAN-vp-replay-authoring-and-diagnostics (rec-3920): GREEN-AFTER implement-leg divergence
# labels. A green-leg divergence keeps hard-failing exactly as before (the green verdict's
# authority is Decision 148 point 1) -- this key only adds a descriptor under the token below,
# deliberately NEVER the red-before leg's pinned "actual=<outcome>" form, so no grep-able
# substring is shared across polarities and no vocabulary is reused as the green axis's verdict
# (Decision 201 point 1's axis discipline). This is a LABEL-ONLY reuse of the red-before
# classifier on the second polarity (Decision 189: the check holds no second copy). The
# outcome_classes and unmeasurable_arms above are untouched, and tautological is unreachable on a
# green failure.
#
# The descriptor is the classifier's class for the exit: "raw outcome: unmeasurable (<arm
# name>[: <command>])" -- exit 127 also names the missing command, exit 126 reads "not
# executable", never "missing"; "raw outcome: target_absent" for any exit 4/5, with a hint only
# for a pytest invocation whose output matches one of the ordered hints below; or "raw outcome:
# assertion_failed" otherwise -- plus the step's own duration.
#
# token and hints are STRUCTURED data the detector consumes, not prose. hints is an ORDERED list
# -- the first entry whose `requires` all match and `forbids` none match wins; the whole list is
# gated once on a pytest invocation exiting 4/5. _vp_replay_classify.py's collection_hint()
# iterates a module-level copy of this exact ordered structure (collection_error, then
# module_level_skip, then missing_node); TestGreenLegLabelContractPins derive-asserts the two
# equal, so the contract and the check hold one copy.
green_leg_labels:
  token: "raw outcome:"
  hints:
    - name: collection_error
      requires:
        - "found no collectors"
        - "\\d+ errors?\\b"
      forbids: []
      text: "collection error -- see output tail"
    - name: module_level_skip
      requires:
        - "\\d+ skipped"
      forbids:
        - "\\d+ errors?\\b"
        - "\\d+ passed"
        - "\\d+ failed"
      text: "module-level skip -- e.g. a dependency absent from requirements-fast.txt (rec-2809)"
    - name: missing_node
      requires:
        - "not found:"
      forbids: []
      text: "named node or file missing or renamed"
