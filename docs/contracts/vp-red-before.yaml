# Class D contract for the plan-only red-before-gate (PLAN-vp-red-before-gate, rec-3770). Holds
# the outcome-class vocabulary, the eligibility predicate, the negated-rg/grep sweep lint's scope
# and precedence, and the graduate-partition scripts.validate recursion refusal that
# scripts/checks/verification/validate_vp_replay.py's inverted-polarity plan-only leg implements
# -- the check holds no second copy of what is declared here. Also holds the Hermetic authoring
# and Graduation disposition authoring rubrics relocated from .claude/skills/planning/SKILL.md --
# both rewritten, not copied verbatim, since each ended on a sentence this gate negates (see
# hermetic_authoring and graduation_disposition_authoring below). Class D because this
# is mechanism (a check plus its frozen classification vocabulary), not itself the
# reversal-relevant platform commitment -- that commitment (negating Decision 148 point 1's
# no-execution-against-an-implementation-less-tree ruling) is Decision 189, cited here, never
# restated. Authored at provisional_v0 because the negated-sweep lint's absent-path extraction
# and the recursion refusal are new and unexercised against real plan-authoring traffic beyond
# this plan's own fixtures -- the recursion refusal's own partition measures EMPTY across all 775
# merged graduate pre-deploy steps (see constraints[6] in the carrying plan), so it can be proven
# on fixtures only, never on the corpus.
contract:
  id: vp-red-before
  class: D
  contract_version: 7
  status: provisional_v0
  description: >-
    validate_vp_replay's two legs. Inverted-polarity plan-only leg: a graduate-disposition
    pre-deploy VP step of a diff-ADDED plan whose implementation_declared is falsy must genuinely
    fail against the un-implemented tree, under the four-class outcome vocabulary below. The
    eligibility predicate, the negated-sweep lint's scope and precedence against the dynamic leg,
    and the graduate-partition scripts.validate recursion refusal all live here; the
    hermetic-authoring and graduation-disposition-authoring rubrics (relocated from the planning
    skill) live here too. GREEN-AFTER implement leg: a hermetic pre-deploy step whose command is
    PR-relative (diffs/shows against origin/main) is excluded from replay when the measured base
    ref has collapsed onto HEAD -- see implement_leg_partition below.
  subject: vp-red-before
  evaluator:
    check: validate_vp_replay
  provisional_v0:
    authored_at: "2026-09-13"
    authored_via: "PLAN-vp-red-before-gate"
    rationale: >-
      The negated-sweep lint's absent-path extraction and the scripts.validate recursion refusal
      are exercised only against this plan's own fixtures. provisional_v0 lets both settle (a
      false-positive absent-path flag, or a recursion shape the argv-head rule misses) before
      either is treated as stable.
    re_ratification_trigger:
      first_of:
        - "negated_sweep_lint_false_positive_reports >= 3"
        - "recursion_refusal_false_positive_reports >= 1"
        - "days_since_authored_at >= 90"
    re_ratification_owner: "human + plan-critique gate"

