constraints:
- >-
  Never print, write into the repository, commit, or post the account ID or its role-ID part anywhere (PR, thread, rec,
  commit). The VP derives both at runtime from aws sts and only greps with them (Decision 101).
- >-
  Do not mask with ::add-mask:: from a variable (the masking step's own header prints the value first), do not store whole
  role ARNs as secrets (the runner masks exact values, so only a bare-ID secret masks the ID wherever it appears), and do
  not rely on the action's mask-aws-account-id input (it masks only after the action has logged).
- >-
  No step renamed, reordered or re-id'd and no new job, trigger or permission (validate_actions_evidence and
  validate_oidc_failopen_guards key on step names and ids). terraform-apply-sandbox.yml and reconcile.yml sit exactly at
  their structural-size pins (550 and 536 effective lines; the 550 pin carries a dec-183 raise marker under the Decision
  166 engine) and must not grow: there the role-ID-part reference goes in the
  existing top-level env block, offset by hoisting the identical job-level AWS_DEFAULT_REGION entries; never raise a pin.
- >-
  ci.yml keeps the reference per step, never at workflow level: its trailer evaluator jobs stay secretless (Decision 143
  credential split, Decision 201 cl.4). A workflow-level reference is used only where every job signs in to AWS.
- >-
  Test fixtures carry no 12-digit number and no real role ID; the never-commit pre-commit hook blocks the first.
- >-
  Three same-repo pull_request jobs (ci.yml terraform-validate, terraform-apply-sandbox.yml speculative-plan and
  advisory-status) gain secret references. Both values identify the account but are no credential, and masking them is log
  hygiene, not confidentiality: those jobs' own OIDC session can already read the account ID through sts
  get-caller-identity, so the exposure Decision 205 rejects adds nothing here. Decision 205's secretless pull_request rule
  binds persona verdict jobs and is not engaged; no persona verdict job may be added to terraform-apply-sandbox.yml while
  its workflow env carries a secret. Fork PRs read no secrets and are already excluded from those jobs.
- Do not merge until VP step 6 passes on the PR head; PR CI green alone proves neither secret.
- >-
  Out of scope: artifact contents (rec-4230), the speculative-plan PR comment's redaction of account-encoding unique IDs
  (rec-4231, scripts/ci/redaction_check.py), and deleting existing public logs.
- No rescue agents or workaround loops (Decision 55).
context:
- >-
  Decision-scout (rerun on the both-copies design): FLAGS_FOUND. CITE 101, 201 (cl.2/4/5), 181, 166, 169, 170, 132.
  WARN 187 (pre_globs must cover the module itself: they do, scope row for _manifest.py). NOTE 143 (workflow-level
  placement only where every job signs in: now rule R3). SPIRIT NOTE 205 (recorded in constraints). RELATED 158/183, 92/94,
  172, 154, 195, 162, 111, 176/189, 125/126, 128. Decisions triaged: 167 of 167. Roadmap items intersected: 7; CONFLICT:
  0; RELATED: 7.
- "gates: decision-scout=FLAGS_FOUND (resolved); plan-critique=PROCEED after 4 round(s); round 4 autonomous (r1-r3 REVISE, all findings fixed; r4 notes N1/N3 folded in as text-only)"
- >-
  Evidence, 2026-10-09: CI run 37981329942, job terraform-validate (PR #1433) prints role-to-assume with the account ID in its
  configure-aws-credentials header. Its "Authenticated as assumedRoleId AROA..." line also encodes it: the 8 characters
  after AROA carry 39 of the account ID's 40 bits in base32 (the 9th character mixes the last bit with role-specific
  bits), are fixed by the account ID alone, and are shared by every role in the account (checked against two roles).
  Masking those 8 leaves at most the last bit visible, so the ID cannot be recovered. Five CI roles sign in (pr, branch,
  apply, planner, deploy); the shared-part premise is proven pre-merge for the pr role (VP 6) and for the rest by the AROA
  pattern scans in VP 7-9. If one role's part differs, its logs keep today's leak and it needs its own secret.
- >-
  Runner masking: a secret referenced in a job is masked in every step header and every output line of that job from job
  start, by exact value; the same log shows checkout's token input as ***. Step summaries are masked the same way
  (inferred, not verified; a recorded residual that no VP step checks). Recorded residuals: the runner drops any job
  output whose value contains a masked secret (no sign-in job's outputs carry either value today, so a future output
  carrying an ARN would vanish silently), and masking never reaches text posted through the API (PR comments,
  check-run summaries, commit-status descriptions) beyond what rec-4230 and rec-4231 own. materialise_tfvars.sh already emits ::add-mask:: for account_id, but only after the
  sign-in header has printed.
- >-
  Existing public logs keep both copies until GitHub's log retention removes them (at most 90 days on a public repository).
  No control relies on the account ID being secret: the OIDC trust policies pin the GitHub subject (Decision 172). If the
  account ever moves (Decision 195 cl.3), both secrets change together; the guard cannot see their values.
- 'fork: mask the role-ID encoded copy in this plan or a follow-on | chosen: in this plan (Benjamin, decision card 2026-10-09) | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: this plan scope'
- 'fork: delete existing public logs or let them expire | chosen: let them expire (stated default 2026-10-09; deletion stays Benjamin''s call) | class: asked | precedent: none | precedent_kind: none | reversible: no | persisted: this plan context'
- >-
  Found during recon, filed separately: rec-4230 (raw plan.bin uploaded as a public-repo artifact on the guard-ROUTE path).
pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- 'Only the plan-cited decision sections read: 101, 166, 170, 201'
- Benjamin has confirmed both repository secrets exist (infrastructure_dependencies[0]) before the PR is pushed
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  Write the guard tests first, including test_real_tree_is_compliant as a module-level function (runs scan_repository on
  the real tree and asserts zero violations, and examined steps equal to the independent raw-text count of uses:
  aws-actions/configure-aws-credentials lines, which is above zero), and run VP step 1 to see them red.
- >-
  Write scripts/checks/ci_guards/validate_actions_account_id_masking.py, its manifest Entry, its taxonomy row and the step-1
  registry shard; run VP step 2 to see it red on the unedited workflows (31 steps examined; the violation lines can number
  more, since R1 reports per line and R3 per condition, so never tune the scan to emit exactly 31).
- >-
  Swap vars.AWS_ACCOUNT_ID for secrets.AWS_ACCOUNT_ID in the role-to-assume value of the 31 configure-aws-credentials steps
  in the 17 workflows, on the same line (including ci.yml's folded event-conditional form). In the 15 workflows other than
  terraform-apply-sandbox.yml and reconcile.yml, give each of those steps env MASK_AWS_ROLE_ID_ACCOUNT_PART:
  secrets.AWS_ROLE_ID_ACCOUNT_PART, inserted between the step's uses: and with: keys. In those two, add that entry and AWS_DEFAULT_REGION: eu-west-2 to the top-level env
  block, delete the job-level AWS_DEFAULT_REGION entries and any job env block left empty, and confirm with VP step 3
  that neither file grew. reconcile.yml's file-reconcile-starved-rec job gains AWS_DEFAULT_REGION from the hoist; that is
  harmless, since its sign-in step already sets aws-region eu-west-2 and exports the same value.
- >-
  Before the push, update rec-4211's acceptance through update_rec to pytest
  tests/checks/ci_guards/test_validate_actions_account_id_masking.py::test_real_tree_is_compliant, the bare form so that
  classify_grammar routes it junit rather than static (rec-4099) (equal or stronger than the
  original, Decision 181 cl.1: rule R1 scans the same vars.AWS_ACCOUNT_ID text over the same .github/workflows and
  .github/actions paths as the original grep, and R2-R5 add to it; it passes lint_acceptance_command with
  require_decidable=True). It must land before ci.yml's trailer closure runs, because the verdict keys on the current
  acceptance's sha256 (Decision 201 cl.2). In the same update_rec call, prepend a dated note to the rec's context: the
  acceptance changed because the original leading-! grep is not decidable under Decision 201, and the replacement node
  covers the same pattern and paths plus R2-R5. VP step 5 proves it landed and routes junit.
- Execute VP steps 1-5. Loop until they pass, never weakening an assertion. On an unrecoverable failure stop and RCA (Decision 55).
- >-
  Closure (implement skill Commit Flows; docs/contracts/git-ops.yaml), each a distinct state: a fresh-context code review
  through the code-review skill with its findings dispositioned; the readiness check, then implementation_declared true;
  rebase on origin/main; VP step 4's full tier on the committed clean tree, a completed exit 0 (a timeout is blocked: resume
  and rerun from the start); structured postflight evidence; push; PR with a Resolves: rec-4211 trailer in the squash body;
  CI green on the PR head. Then run VP step 6 on that head. The PR touches terraform-*.yml and reconcile.yml, which
  CODEOWNERS covers with require_code_owner_review, so the merge needs Benjamin's code-owner approval (or his admin
  bypass): ask him once, with step 6's result. Squash-merge only with CI green, step 6 passing and that approval.
- Run VP steps 7, 8 and 10 after the merge (step 8 within a day of it); run step 9 on the first terraform/personal PR after it.
- 'Report: the jobs scanned, the workflows not run in the window, whether step 9 is still pending, and that the variable can now be deleted.'
rollback: >-
  Revert the squash commit in a new PR; the workflows go back to the variable and the two secrets stay unused and harmless.
  Nothing outside the repository changes.
