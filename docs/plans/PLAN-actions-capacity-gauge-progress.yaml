schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: actions-capacity-gauge-progress
intent: >-
  Make the Actions capacity gauge see again and count only real runner time: every tick makes forward progress whatever
  an hour costs to read, and a job that never held a runner (waiting on an Environment approval, or cancelled while
  waiting) counts no minutes. Its readings drive the operator's capacity decisions and its green reading gates the first
  persona add and rec-5019.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-actions-capacity-gauge-progress.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category: rec-5473, filed by this planner 2026-11-20; no tier_item claimed, so the Tier
  Item Freshness Gate is skipped). T4.32's persona adds are a downstream beneficiary, not a follow-on: they cite a
  green reading (actions-capacity.yaml consumer_rule); this plan closes no T4.32 criterion. Code runs from the checkout in
  convergence-health.yml; no Lambda-packaged file and no deploy, so V2.
cites: [dec:279]
scope:
  - file: scripts/ci/actions_capacity_github.py
    action: Modify
    purpose: >-
      (1) fetch_runs_and_jobs gains keyword arguments evaluate_from (first evaluated hour) and cache (the previous
      reading's jobs_cache). A listed run created before evaluate_from whose status is completed and whose updated_at is
      earlier than evaluate_from minus LEAD_IN_MARGIN (5 min) is kept in runs but its jobs are not read (it cannot reach
      an evaluated hour). A completed run whose cache entry has the same run_attempt and updated_at reuses the cached
      jobs with no call. Every completed run whose jobs are read is cached as it is read, so a budget stop mid-hour keeps
      the work done. Both new arguments default to None (existing positional callers keep working). Fetched gains a
      defaulted last field cache: entries for runs created at or after since (carried ones included), each {created_at,
      run_attempt, updated_at, jobs}, jobs keeping only the job API keys normalize reads plus runner_id and runner_name;
      a reused job gets `_run` re-attached from the fresh run listing, as a read one does. (2) PREVIOUS_CALL_CAP becomes
      1 + 2 * PREVIOUS_RUNS (rec-5093: four runs whose artifacts download but do not parse spend 1 + 4 x 2 calls).
  - file: scripts/ci/actions_capacity_gauge.py
    action: Modify
    purpose: >-
      (1) Job gains runner: bool = True; normalize sets it true only when runner_id is an int above 0, or runner_id is
      absent and runner_name is non-empty. _span returns None for a job with no runner, and for a completed job with no
      completed_at. _blocks is unchanged (a queued job still blocks its hour). (2) start_hour takes holes only from rows
      starting at or after _floor(now) - bootstrap_hours: an older hole is given up (it stays not evaluated and ages out)
      and never pulls the start back; with no hole in that window the start is the newest evaluated hour + 1 h -
      overlap_hours as today; the result is never earlier than _floor(now) - bootstrap_hours - overlap_hours (rec-5091).
      (3) CONTRACT_VERSION 2; a previous reading whose contract_version differs supplies no table and no jobs_cache (a
      version-1 table was counted with the old rule, so the first tick bootstraps) but still supplies read_failed_ticks
      (a count of warehouse-read failures, not hours); the status line's chained=1 means a same-version table was
      chained. main passes evaluate_from = read_from + overlap_hours and the previous jobs_cache to
      fetch_runs_and_jobs and writes jobs_cache into the reading. Stays under the 500-SLOC limit (no budget raise).
  - file: docs/contracts/actions-capacity.yaml
    action: Modify
    purpose: >-
      Notice-class wording (not in approval-routing gated set). contract_version 1 -> 2; one terse amendment_log row
      (semantic_break true, change_class correction, PLAN-actions-capacity-gauge-progress (rec-5473)).
      trigger.slot_demand.definition: a job counts only while a runner held it (runner_id above 0); a job waiting on an
      Environment approval or cancelled before a runner took it counts nothing. window.chaining: a tick starts no
      earlier than bootstrap_hours plus overlap_hours before now and a hole older than bootstrap_hours is given up; lead-in runs completed
      before the first evaluated hour (5 min margin) are not expanded; completed runs' jobs carry in the reading's
      jobs_cache and are reused while run_attempt and updated_at are unchanged; a reading of another contract_version is
      not chained.
  - file: tests/ci/test_actions_capacity_github.py
    action: Modify
    purpose: >-
      New nodes, runs and jobs in the real Jobs API shapes probed 2026-11-20 (status, updated_at, run_attempt,
      runner_id, runner_name): test_lead_in_skips_runs_finished_before_first_evaluated_hour (completed lead-in run with
      updated_at before evaluate_from minus 5 min gets no jobs call; one inside the margin, an in_progress one and a
      re-run with a later updated_at do), test_jobs_cache_resumes_mid_hour_without_rereading (tick 1 stops on the
      request budget inside an hour; tick 2 with tick 1's cache finishes that hour and issues no jobs call for any cached
      run; a changed run_attempt or updated_at is re-read), test_chain_survives_artifactless_runs (rec-5093: 5 main runs
      whose first 4 each carry an artifact that downloads but does not parse and whose 5th is readable are chained, red
      at today's cap 8 (1 + 8 calls spent before the 5th listing) and green at 11; a second case with 4 artifact-less
      runs also chains). Existing nodes unchanged; graduated shard
      actions-capacity-budgets-and-episodes is kept unchanged.
  - file: tests/ci/test_actions_capacity_gauge.py
    action: Modify
    purpose: >-
      New nodes: test_runnerless_jobs_count_no_minutes (from real shapes: waiting approve job started_at == created_at
      with no runner fields, cancelled-while-waiting runner_id 0, skipped-by-cancel runner_id null, approved job
      runner_id above 0; only the last counts minutes and peak; the waiting job still does not block its hour),
      test_never_evaluable_hole_does_not_starve_newest_hours (rec-5091: with a hole 40 h old and every later hour
      evaluated, start_hour is the newest evaluated hour + 1 h - overlap, not 40 h back; with a second hole 10 h old it is
      that hole - overlap; six chained ticks keep the 40 h hole not evaluated and evaluate the newest closed hour, each
      tick starting later than now - 26 h), test_older_version_reading_is_not_chained (main with a version-1 previous
      reading bootstraps, prints chained=0 and still carries its read_failed_ticks; a version-2 one prints chained=1 and
      its jobs_cache reaches the fetch; and CONTRACT_VERSION equals load_contract().contract.contract_version). The cli
      fixture's fake fetch gains evaluate_from=None and cache=None keyword parameters it records (adds parameters,
      loosens no assertion). Existing nodes and their assertions unchanged; graduated shard
      actions-capacity-trigger-and-validity is kept unchanged.
bundled_recommendations: [rec-5473, rec-5091, rec-5093]
followon_recs: [rec-5478]
infrastructure_dependencies: []
acceptance_criteria:
  - A job with no runner (runner_id 0, null or absent with empty runner_name) adds no minutes and no concurrency; an approved job counts from its reset started_at.
  - A completed lead-in run that finished more than 5 min before the first evaluated hour costs no jobs call.
  - A tick stopped mid-hour keeps the completed runs it read; the next tick reuses them with no jobs call and gets further.
  - A tick never starts earlier than bootstrap_hours plus overlap_hours before now.
  - A previous reading of another contract_version supplies no table and no jobs_cache, still supplies read_failed_ticks, and the status line prints chained=0.
  - rec-5473, rec-5091 and rec-5093 acceptance commands pass; every existing actions-capacity node still passes unchanged.
  - Post-merge, the gauge's coverage reaches the last closed hour and rec-5368 (gauge_blind) is closed by the alarm.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      rec-5473's acceptance (red before: both nodes absent; the counting rule and lead-in skip are what they assert).
    command: >-
      bin/venv-python -m pytest tests/ci/test_actions_capacity_github.py::test_lead_in_skips_runs_finished_before_first_evaluated_hour
      tests/ci/test_actions_capacity_gauge.py::test_runnerless_jobs_count_no_minutes -q
    expected: exit 0, 2 passed
    fix_if: a jobs call for a skippable lead-in run, or minutes from a runner-less job
    hermetic: true
    expected_literals: ["2 passed"]
    graduation: graduate
    graduation_check_id: actions-capacity-runner-minutes-and-progress
  - step: 2
    phase: pre-deploy
    action: Progress guarantee and chaining nodes, including rec-5091's and rec-5093's acceptance nodes.
    command: >-
      bin/venv-python -m pytest tests/ci/test_actions_capacity_github.py::test_jobs_cache_resumes_mid_hour_without_rereading
      tests/ci/test_actions_capacity_gauge.py::test_never_evaluable_hole_does_not_starve_newest_hours
      tests/ci/test_actions_capacity_github.py::test_chain_survives_artifactless_runs
      tests/ci/test_actions_capacity_gauge.py::test_older_version_reading_is_not_chained -q
    expected: exit 0, 4 passed
    fix_if: tick 2 re-reads a cached run, start_hour reaches the 40 h hole, the 5th run's artifact is not reached, or a version-1 table is chained
    hermetic: true
    expected_literals: ["4 passed"]
    graduation: graduate
    graduation_check_id: actions-capacity-chain-progress
  - step: 3
    phase: pre-deploy
    action: Every existing actions-capacity node still passes (graduated shards included); no assertion is loosened.
    command: >-
      bin/venv-python -m pytest tests/ci/test_actions_capacity_contract.py tests/ci/test_actions_capacity_gauge.py
      tests/ci/test_actions_capacity_github.py tests/ci/test_actions_capacity_alarm.py tests/ci/test_actions_capacity_steps.py
      tests/checks/contracts/test_validate_actions_capacity.py -q
    expected: exit 0, no failures
    fix_if: an existing node fails (fix the code, never the assertion, Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file re-run of existing standing tests already graduated in four actions-capacity shards; it adds no new guard.
  - step: 4
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): bin/venv-python -m scripts.validate --pre in the
      foreground (exit 0), then this command as its own backgrounded run with a 2 h limit from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: "--pre exited 0 first; this command exits 0 for HEAD"
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun; a failure only in another project's open
      red goes to the operator as the implement skill's go/no-go
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: >-
      First tick on main after the merge: dispatch convergence-health.yml on main (mcp__github__actions_run_trigger, no
      inputs) or take the next hourly run, wait for completion, save the health-check job log
      (mcp__github__get_job_logs) to $CH_LOG.
    command: grep -E "\[actions_capacity\] verdict=[a-z_]+ evaluated_hours=[1-9][0-9]* chained=0 " "$CH_LOG"
    expected: >-
      One line, chained=0 (the version-1 table is dropped) and evaluated_hours of at least 1: the bootstrap advanced.
      Report calls and elapsed_s.
    fix_if: evaluated_hours 0 means the first tick still did not finish an hour; read fetch_error and coverage in the artifact
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: >-
      Within 24 h of the merge: download the newest convergence-health actions-capacity-reading artifact on main
      (mcp__github__actions_list list_workflow_run_artifacts, then actions_get download_workflow_run_artifact) and unzip
      it to $ACR_DIR.
    command: >-
      bin/venv-python -m scripts.ci.actions_capacity_gauge --assert-clear gauge_blind --reading
      "$ACR_DIR/actions-capacity-reading.json"
    expected: "assert-clear gauge_blind: clear, exit 0 (at least 12 evaluated hours in the trailing 24)"
    fix_if: not clear after 24 h means a tick still loses progress; read calls, elapsed_s, fetch_error and coverage across ticks
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      rec-5368 closed by the alarm (gauge_blind cleared), and the bundled recs closed by the merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      r=make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5368,rec-5473,rec-5091,rec-5093');
      s={x['id']:x['status'] for x in r}; print(s); assert all(v=='closed' for v in s.values()) and len(s)==4"
    expected: all four closed
    fix_if: rec-5368 open while step 6 is clear means the alarm's close write failed (read the tick log); a bundled rec open means the Resolves trailer was missing
    hermetic: false
    graduation: not-applicable
test_obligations:
