    behavior: Lead-in runs that cannot reach an evaluated hour are not expanded; cached completed runs are not re-read; a stopped tick keeps its work; the previous-table traversal can reach its 5th run.
    verification_step: 2
    test_selector: tests/ci/test_actions_capacity_github.py::test_jobs_cache_resumes_mid_hour_without_rereading
    red_green_expectation: red before (node absent; no cache argument), green after.
  - source: scripts/ci/actions_capacity_gauge.py
    behavior: Runner-less jobs count nothing; the start is clamped to the trailing bootstrap window; a reading of another version is not chained.
    verification_step: 1
    test_selector: tests/ci/test_actions_capacity_gauge.py::test_runnerless_jobs_count_no_minutes
