constraints:
  - >-
    The sidecar blocks are operator-approved governing contract text (Decision 246): the build places them exactly,
    fills only {{DATE}}, and never edits them; a needed change is an approved_text plan defect
    (implement-scope-boundary.yaml deviation_trigger.escalation).
  - >-
    Alarm, never gate (Decision 83 non-wedging): no required status check, no exit 1 on any verdict or read failure, no
    change to main-protection, no dispatch, and no consumer enforces the reading; later plans cite it.
  - >-
    convergence-health.yml (CI Reform's area; operator relayed their agreement 2026-11-11): additions only -- the header
    paragraph and two last steps. No edit to existing steps, inputs, permissions, timeout, triggers or to
    scripts/convergence_health/ (CI Reform's rec-4931 fix lands in sensor_liveness*.py).
  - >-
    No IAM, secret or Terraform change; the gauge uses the job's existing actions: read grant and GH_TOKEN, and the
    episode filing uses the role convergence-health already assumes. Never touch the convergence record (Decisions 154,
    190).
  - The DuckLake redeploy runs only through the governed code-deploy channel on merge; scripts.build_lambda --deploy is break-glass only (Decision 125/126).
  - No telemetry producer and no warehouse table; the hourly row lives in the artifact.
  - No rescue agents or workaround loops (Decision 55).
