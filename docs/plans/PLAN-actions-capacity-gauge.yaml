execution_steps:
  - >-
    Place the sidecar's three blocks exactly (contract-create, pc-amendment-log, pc-row),
    filling {{DATE}} with the build date; run approved_text verify.
  - >-
    Write scripts/ci/actions_capacity_contract.py and tests/ci/test_actions_capacity_contract.py (pre: contract placed;
    post: test_real_contract_loads passes).
  - >-
    Write scripts/ci/actions_capacity_github.py, then actions_capacity_gauge.py, then actions_capacity_alarm.py, each
    with its test file written first and seen red (pre: contract loader green; post: VP steps 2 and 3 pass).
  - >-
    Add to config/agent/data_quality/source_registry.yaml: canonical_id actions_capacity; description "GitHub Actions
    capacity gauge (rec-5022): a convergence-health.yml step that measures this repository's share of GitHub's
    concurrent-job cap per closed hour from the Actions API (slot demand and main-validate queue p90) against
    docs/contracts/actions-capacity.yaml's trigger, and whether the gauge itself can see enough hours."
    signal_interpretation "Alarm-not-gate (Decision 83) -- one deduped rec per alarm class and episode
    (capacity_breach, gauge_blind; update_rec only when the breaching hours change), closed automatically when the
    class clears. Volume tracks how often CI load nears the cap and should be near zero; the rec lists the levers for
    the operator and decides none. Priority High, not source=ci_rca -- does NOT hard-block the /plan queue."; then
    regenerate field_semantics.yaml with the generator and add the alarm module to SCANNED_PATHS and its test.
  - >-
    Write validate_actions_capacity.py and its tests; add the _manifest.py Entry, its test__manifest.py closure row and
    the ci_rca_taxonomy row (pre:
    contract and source registered; post: VP step 4 passes, validate_pre_glob_closure clean).
  - >-
    Edit convergence-health.yml: the header paragraph and the two last steps exactly as scope states, plus the
    composite_action_body_baseline.yaml row; write tests/ci/test_actions_capacity_steps.py first and see it red.
  - >-
    Create the three graduated registry shards config/agent/verification_registry/entries/actions-capacity-trigger-and-validity.yaml,
