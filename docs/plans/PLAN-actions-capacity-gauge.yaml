      tests/ci/test_actions_capacity_alarm.py::test_diagnose_writes_nothing
      tests/ci/test_actions_capacity_github.py::test_http_error_stops_without_retry -q
    expected: Exit 0, fifteen nodes pass; red before because the nodes are absent.
    expected_literals: [15 passed]
    fix_if: A budget overrun or duplicate filing is a code defect; never raise the contract's budgets to pass.
    hermetic: true
    graduation: graduate
    graduation_check_id: actions-capacity-budgets-and-episodes
  - step: 4
    phase: pre-deploy
    action: The contract evaluator, the workflow steps and the source registration.
    command: >-
      bin/venv-python -m pytest
      tests/checks/contracts/test_validate_actions_capacity.py::test_real_contract_passes_and_declares_examined
      tests/checks/contracts/test_validate_actions_capacity.py::test_rejects_missing_workflow_or_job
      tests/checks/contracts/test_validate_actions_capacity.py::test_rejects_unregistered_alarm_source
      tests/ci/test_actions_capacity_steps.py::test_capacity_steps_are_last_and_run_unless_cancelled
      tests/ci/test_actions_capacity_steps.py::test_existing_steps_permissions_and_inputs_unchanged
      tests/ci/test_actions_capacity_steps.py::test_upload_step_matches_evidence_contract
      tests/ci/test_actions_capacity_contract.py::test_real_contract_loads
      tests/ci/test_actions_capacity_contract.py::test_unknown_key_is_refused
      'tests/checks/contracts/test__manifest.py::TestPromotedGateClosures::test_a_diff_touching_only_this_closure_member_still_matches_the_gate[validate_actions_capacity-.github/workflows/ci.yml]'
      tests/checks/ops_governance/test_check_source_registry.py::TestScannedPaths::test_scanned_paths_includes_portal_and_producer_modules
      -q
    expected: >-
      Exit 0, ten nodes pass. Nine are red before because they are absent; the source-registry node is red before
      because SCANNED_PATHS lacks scripts/ci/actions_capacity_alarm.py.
    expected_literals: [10 passed]
    fix_if: Fix the check or the workflow edit; never widen the workflow test's pinned list of existing steps.
    hermetic: true
    graduation: graduate
    graduation_check_id: actions-capacity-evaluator-and-steps
  - step: 5
    phase: pre-deploy
    action: The contract files equal the approved sidecar, and field_semantics.yaml is the generator's output.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug actions-capacity-gauge --base origin/main && bin/venv-python
      -m scripts.schema_to_field_semantics --check && grep -c "^        - actions_capacity$" config/lambda/ducklake/field_semantics.yaml
    expected: Both commands exit 0 and the grep prints 2 (both accepted_values lists).
    fix_if: >-
      A verify difference is an edit to approved words: restore the sidecar text, and raise an approved_text plan defect
      if it cannot stand. A --check drift means a hand edit; regenerate. Graduation not-applicable: a chain of three
      commands, and CI already runs the approved-text check and the generator's --check on every PR.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      The fast tier over the change, then the full tier before handoff: start the full tier backgrounded with a 2 h limit
      from the top-level session (AGENTS.md), then read its verdict with --verify-head.
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      --pre exits 0, then the full tier (started backgrounded per AGENTS.md) verifies at HEAD; validate_actions_capacity,
      check_source_registry, validate_actions_evidence, validate_project_configuration and validate_pre_glob_closure
      report enforced.
    fix_if: Fix the failing check's cause in scope; never skip or loosen it (Decision 235).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      The governed deploy of the merge commit succeeded, every job included. Read with mcp__github__actions_list
      (list_workflow_runs, workflow deploy-ducklake-lambdas.yml) the run whose deploy gate resolved $MERGE_SHA (or the
      newest green commit after it), then list_workflow_jobs for that run, writing the jobs JSON to $DEPLOY_JOBS_JSON and the deploy-telemetry job's log (which carries any
      TELEMETRY_PRODUCTION_HOLD notice) to $DEPLOY_LOG (mcp__github__get_job_logs).
    command: >-
      test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
      jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
      want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke','deploy-telemetry-twin','telemetry-twin-smoke','deploy-telemetry'];
      ok=lambda w:jobs.get(w)=='success'; assert all(ok(w) for w in want),jobs;
      hold='TELEMETRY_PRODUCTION_HOLD' in open(os.environ['DEPLOY_LOG']).read(); assert hold or ok('telemetry-smoke'),jobs;
      print('DEPLOY_OK hold=%d'%hold)"
    expected: >-
      Every named job concluded success (a skipped job fails this step), and telemetry-smoke succeeded unless the log
      carries TELEMETRY_PRODUCTION_HOLD; then DEPLOY_OK hold=0 or hold=1. Under a hold the production telemetry writer
      keeps its old accepted values until the hold lifts; the gauge writes only through the ops writer
      (deploy-serving), so the hold does not block it. Report hold=1 to the operator.
    fix_if: >-
      A failed deploy or smoke is this plan's to root-cause and fix forward, never a re-run to green (Decision 55). If
      rec-5033 has made PROD promote-only (Decision 252 cl.6) before this build merges, read the promotion run that
      carries $MERGE_SHA's artifact, not the per-merge SIT run.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      A convergence-health run on main after the deploy: dispatch it (mcp__github__actions_run_trigger, workflow
      convergence-health.yml, ref main, no inputs), wait for completion, save the health-check job log
      (mcp__github__get_job_logs) to $CH_LOG, the run's JSON (get_workflow_run) to $CH_RUN and its artifact list
      (list_workflow_run_artifacts) to $CH_ARTS.
    command: >-
      grep -E "\[actions_capacity\] verdict=(green|red_measured|red_projected|insufficient_data|amber) evaluated_hours=[1-9][0-9]*
      chained=[01] calls=[0-9]+ elapsed_s=[0-9]+" "$CH_LOG" && bin/venv-python -c "import json,os;a=json.load(open(os.environ['CH_ARTS']));
      a=a.get('artifacts',a); assert any(x['name']=='actions-capacity-reading' for x in a),a;
      r=json.load(open(os.environ['CH_RUN'])); assert r['conclusion']=='success',r['conclusion']; print('ARTIFACT_OK')"
    expected: >-
      One matching line and ARTIFACT_OK, which also asserts the run concluded success. Report the line verbatim: its calls and elapsed_s
      are the first live measurement of the budgets in context.
    fix_if: >-
      A run cancelled while pending (the concurrency group) is re-dispatched. No line means the step did not run or
      crashed: read the log, fix forward. evaluated_hours 0 on the first run means
      every bootstrap hour was open or uncovered: read the coverage field. A red run with a portal error is a write
      failure to root-cause; never mark the step continue-on-error. If the run is red from another sensor's step, that is
      not this plan's defect: report it, and judge the gauge by its own two steps' conclusions in the job's steps list.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      The next convergence-health run (scheduled, or dispatched as in step 8) chains from step 8's artifact: save its log
      to $CH_LOG2.
    command: grep -E "\[actions_capacity\] verdict=[a-z_]+ evaluated_hours=[1-9][0-9]* chained=1 " "$CH_LOG2"
    expected: One line with chained=1.
    fix_if: chained=0 means the previous artifact was not found or not readable; check the artifact name, the redirect fetch and the run filter.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: rec-5022 is closed by the merge.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      r=make_reader(profile='agent_platform').named('recs_by_ids',ids='rec-5022'); print(r[0]['status']); assert
      r[0]['status']=='closed'"
    expected: Prints closed.
    fix_if: An open rec means the Resolves trailer was missing; close it through the portal with the merge SHA as evidence.
    hermetic: false
    graduation: not-applicable
