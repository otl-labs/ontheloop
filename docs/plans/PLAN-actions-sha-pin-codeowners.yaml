constraints:
  - "PR A changes only uses: lines under .github/workflows (pins on floating lines, comments on major-only lines) plus the baseline and the drain test; no step, permission, input, trigger or run: body changes; nothing under .github/actions changes."
  - "Each pin is the commit the replaced ref resolves to at build time (git ls-remote https://github.com/<owner>/<repo>, the peeled refs/tags/<tag>^{} line when present; pypa/gh-action-pypi-publish@release/v1 is the branch head); the comment is the newest exact vX.Y.Z tag at that commit. If a ref's commit carries no exact tag (for example the release/v1 branch moved past v1.14.3 to an untagged commit), stop and report it to the plan owner: that would be a version move."
  - "Two PRs, A then B, each merged only on the operator's word on its final diff (Decision 246 cl.4: both touch CODEOWNERS paths); B starts from main after A merges."
  - "PR A's merge triggers push runs of terraform-github-apply.yml and terraform-bootstrap-apply.yml; the expected outcome is a no-op preview. Any approval request those runs raise is not part of this plan and is never approved as part of it."
  - "PR B carries the implementation_declared flip (it lands with the last code; PR A leaves the field unset)."
  - "The shared predicate owns no ./ or docker:// exemption; every caller keeps today's exemption set, so no guard loosens (Decision 235 cl.1). The ratchet is removed only once the baseline is empty, so no floating reference is admitted at any point."
  - "PR B's test file uses the test names the weakening_dispositions rows cite (reference: /mnt/project-files/actions-sha-pinned/plan3-probe/PR-B-probe.diff); a candidate not listed here is a plan defect for the plan owner, never a new self-chosen disposition (Decision 235 cl.1, cl.5: .github/workflows is a Decision 117 boundary path)."
  - "Test fixtures build SHAs from repeated characters (for example 'a' * 40), never a literal 40-hex string: detect-secrets flagged a literal hex SHA in test__shared.py on the probe."
  - No rescue agents or workaround loops (Decision 55); never skip or loosen a test to get green (Decision 235).
