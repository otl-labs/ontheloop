slug: "actions-sha-pin-codeowners"
intent: >-
  Plan 3 of 4 for rec-5020: pin the last 45 floating remote uses: references (the six .github/CODEOWNERS-covered
  workflows) to the commit each tag resolves to at build time, give the 30 already-pinned lines that carry a major-only
  comment their exact release comment, then retire the now-empty grandfathering ratchet so validate_actions_sha_pinned
  is a plain form rule (exact vX.Y.Z comment) and every 40-hex pin test in scripts/checks/ci_guards reads one shared
  predicate. Third-party code in the deploy, apply and publish jobs then changes only through a visible pull request
  gated by required checks (NS.9), and no workflow runs different code than it runs today.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-actions-sha-pin-codeowners.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Itinerary item H1, follow-on plan 3 of PLAN-actions-sha-pinned. No Lambda-packaged file and no .tf file is in scope,
  so V2; closes no criterion.
closes_criteria: []
cites: [dec:235, dec:244, dec:246, dec:248]
