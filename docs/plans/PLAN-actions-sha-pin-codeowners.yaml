      `#` (a comment with no space before it, which YAML folds into the value) fails with a message naming that form
      (rec-5342). Docstring rewritten; Decision 170 examined() declaration kept on every exit.
    new_imports: [scripts.checks.ci_guards._shared]
  - file: tests/checks/ci_guards/test_validate_actions_sha_pinned.py
    action: Modify
