rollback: >-
  PR A: a misbehaving action is fixed by a forward PR re-pinning the line to a known-good commit with its exact comment.
  A whole revert of PR A re-adds floating references and 24 baseline keys, which the no-raise leg refuses; it needs the
  operator's approval (Decision 235 cl.1) and his merge past the red check. PR B: a revert restores the ratchet code and
  an empty baseline, which passes on the pinned tree (a loosening of the comment rule, so it also needs the operator's
  approval). Runtime behaviour is unchanged by either PR, since each pin is the commit its ref pointed to.
