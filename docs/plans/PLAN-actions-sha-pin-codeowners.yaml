    action: Every test file this plan touches.
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test_actions_sha_pin_drain.py tests/checks/ci_guards/test__shared.py
      tests/checks/ci_guards/test_validate_actions_sha_pinned.py tests/checks/ci_guards/test_validate_trusted_plan_environment.py
      tests/checks/ci_guards/test_validate_github_settings_apply.py tests/checks/ci_guards/test_validate_persona_verdict_chain.py
      tests/checks/ci_guards/test__manifest.py -q
    expected: All tests pass.
    fix_if: Any failure; fix the code or the pin, never loosen an assertion (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of test files this plan creates or modifies; the fast tier's pytest_diff selects them on every
      PR that touches them, so a standing copy adds no independence.
  - step: 5
    phase: pre-deploy
    action: "Online pin audit (PR A; network through the session proxy): every converted uses: line's SHA equals the commit its replaced ref resolves to now and the commit its comment's tag resolves to, and the comment is the newest exact vX.Y.Z tag at that commit; every normalised line keeps its SHA and gains that newest exact tag."
    command: >-
      bin/venv-python -c "import re,subprocess,yaml; d=subprocess.run(['git','diff','-U0','origin/main...HEAD','--','.github/workflows'],capture_output=True,text=True,check=True).stdout; n=sum(yaml.safe_load(subprocess.run(['git','show','origin/main:config/actions_sha_pin_baseline.yaml'],capture_output=True,text=True,check=True).stdout)['drains']['rec-5289'].values()); m=re.findall(r'^-(\s*(?:-\s+)?uses:\s*)([\w.-]+/[\w.-]+)([\w./-]*)@(\S+?)(?:\s+# (v\d+))?\s*$\n^\+\1\2\3@([0-9a-f]{40}) # (v\d+\.\d+\.\d+)$',d,re.M); R={}; ls=lambda r: R[r] if r in R else R.setdefault(r, dict(reversed(x.split('\t')) for x in subprocess.run(['git','ls-remote','https://github.com/'+r],capture_output=True,text=True,check=True).stdout.splitlines())); at=lambda r,t: ls(r).get('refs/tags/'+t+'^{}') or ls(r).get('refs/tags/'+t) or ls(r).get('refs/heads/'+t); V=lambda t: tuple(map(int,t[1:].split('.'))); top=lambda r,s: max((x[10:].removesuffix('^{}') for x in ls(r) if re.fullmatch(r'refs/tags/v\d+\.\d+\.\d+(\^\{\})?',x) and at(r,x[10:].removesuffix('^{}'))==s), key=V, default=None); fl=[x for x in m if not re.fullmatch('[0-9a-f]{40}',x[3])]; nm=[x for x in m if re.fullmatch('[0-9a-f]{40}',x[3])]; bad=[x for x in fl if at(x[1],x[3])!=x[5]]+[x for x in nm if x[3]!=x[5] or not x[4] or x[6].split('.')[0]!=x[4]]+[x for x in m if at(x[1],x[6])!=x[5] or top(x[1],x[5])!=x[6]]; assert not bad, bad; assert len(fl)==n, (len(fl), n); print('PIN_AUDIT_OK', len(fl), len(nm), len(R))"
    expected: Prints PIN_AUDIT_OK 45 30 7 (floating lines converted, major-only comments normalised, repositories; counts on the 2026-11-17 base, and the first must equal the base rec-5289 total).
    fix_if: A mismatch names the line; re-resolve with git ls-remote and re-pin. Run on the PR A branch before merge.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Network moment claim (Decision 244 cl.4): tags move and the pairs come from this PR's diff; the standing offline
      check proves form only by design.
  - step: 6
    phase: pre-deploy
    action: "Diff shape (PR A): every changed line under .github/workflows is a uses: line; same action, same major; SHA changes only on a floating line; the touched set equals the six bucket files plus the ten normalised files."
    command: >-
      bin/venv-python -c "import re,subprocess,yaml; g=lambda *a: subprocess.run(['git',*a],capture_output=True,text=True,check=True).stdout; d=g('diff','-U0','origin/main...HEAD','--','.github/workflows'); m=re.findall(r'^-(\s*(?:-\s+)?uses:\s*)([\w./-]+)@(\S+?)(?:\s+# (v\d+))?\s*$\n^\+\1\2@([0-9a-f]{40}) # v(\d+)\.\d+\.\d+$',d,re.M); rm=[l for l in d.splitlines() if l[:1] in '+-' and l[:3] not in ('+++','---')]; assert len(rm)==2*len(m), rm[:6]; assert all((x[3] or 'v'+x[5])=='v'+x[5] and (x[2][1:].split('.')[0]==x[5] if not re.fullmatch('[0-9a-f]{40}',x[2]) and x[2][:1]=='v' else True) for x in m), m; f=set(re.findall(r'^\+\+\+ b/(\S+)',d,re.M)); exp={k.split('::')[0] for k in yaml.safe_load(g('show','origin/main:config/actions_sha_pin_baseline.yaml'))['drains']['rec-5289']}|{l.split(':')[1] for l in g('grep','-E','@[0-9a-f]{40} # v[0-9]+$','origin/main','--','.github/workflows').splitlines()}; assert f==exp, f^exp; print('DIFF_SHAPE_OK', len(m), len(f))"
    expected: Prints DIFF_SHAPE_OK 75 16 (2026-11-17 base; the file set must equal the base bucket files plus the files with major-only comments).
    fix_if: "An unpaired line means a non-uses edit; keep edits to uses: lines only."
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Moment claim (Decision 244 cl.4); the diff shape holds for PR A only.
  - step: 7
    phase: pre-deploy
    action: "One predicate (PR B): no 40-hex uses: pin regex remains in scripts/checks/ci_guards outside _shared.py."
    command: >-
      bin/venv-python -c "import pathlib,re; p=pathlib.Path('scripts/checks/ci_guards'); h=[f.name for f in p.glob('*.py') if f.name!='_shared.py' and re.search(r'@\[(0-9a-f|a-f0-9)\]\{40\}', f.read_text(encoding='utf-8'))]; assert not h, h; print('ONE_PREDICATE_OK')"
    expected: Prints the ok marker.
    expected_literals: [ONE_PREDICATE_OK]
    fix_if: "A file still spells its own 40-hex uses: pin regex (an @ followed by a 40-hex class, either order); point it at _shared.is_sha_pinned."
    hermetic: true
    graduation: graduate
    graduation_check_id: ci-guards-one-sha-pin-predicate
  - step: 8
    phase: pre-deploy
    action: "Retired surface (PR B): the baseline file is gone and nothing outside the declared residual and the drain test's path constant names it; the removed baseline API is named nowhere in the check or its tests."
    command: >-
      bin/venv-python -c "import pathlib,subprocess; P=pathlib.Path; F=['scripts/checks/ci_guards/validate_actions_sha_pinned.py','tests/checks/ci_guards/test_actions_sha_pin_drain.py','tests/checks/ci_guards/test_validate_actions_sha_pinned.py']; assert all(P(f).is_file() for f in F), F; assert not P('config/actions_sha_pin_baseline.yaml').exists(), 'baseline file still present'; g=lambda p,*a: subprocess.run(['git','grep','-nE',p,'--',*a],capture_output=True,text=True).stdout; h=g('actions_sha_pin_baseline','scripts','.github','config','tests',':!config/agent/verification_registry/entries/actions-sha-pin-non-codeowners-drained.yaml',*[':!'+f for f in F[1:]])+g('parse_baseline|render_baseline|BASELINE_REL|_ratchet|_no_raise',*F); assert not h, h; print('BASELINE_RETIRED_OK')"
    expected: Prints the ok marker.
    expected_literals: [BASELINE_RETIRED_OK]
    fix_if: A hit names the stale reference; remove it. The registry shard is the declared residual (rec-5354), never edited here.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Retirement moment claim (Decision 244 cl.4): it proves PR B removed the surface. The standing guard against a
      floating reference coming back is the form rule itself, pinned by
      TestRefusals::test_leftover_baseline_grandfathers_nothing.
