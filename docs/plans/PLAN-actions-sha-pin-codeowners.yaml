    action: Modify
    purpose: "_common_problems reads _shared.is_sha_pinned in place of its own PINNED (same pattern; behaviour-neutral, no ./ exemption added)."
    new_imports: [scripts.checks.ci_guards._shared]
  - file: tests/checks/ci_guards/test_validate_persona_verdict_chain.py
    action: Modify
