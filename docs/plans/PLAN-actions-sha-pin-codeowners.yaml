acceptance_criteria:
  - "No remote uses: reference in .github/workflows or .github/actions is floating: each is <owner>/<repo>[/<path>]@<40-hex> # vX.Y.Z. On every line this plan converts or normalises, vX.Y.Z is the newest exact release tag at that commit and the commit is the one the replaced ref resolved to at build time (no version moves; VP 5 audits those lines only)."
  - "The 30 major-only comments carry the exact release tag at their unchanged commit; validate_actions_sha_pinned refuses a major-only or two-part comment."
  - "config/actions_sha_pin_baseline.yaml and the ratchet are gone; validate_actions_sha_pinned is a form rule that refuses every floating reference, even one a leftover baseline file lists."
  - "validate_actions_sha_pinned, validate_trusted_plan_environment, validate_github_settings_apply and validate_persona_verdict_chain decide 40-hex pin form with _shared.is_sha_pinned; no other 40-hex uses: pin regex remains in scripts/checks/ci_guards."
  - "The graduated record actions-sha-pin-non-codeowners-drained keeps its node id and claim and stays green through both PRs; rec-5289, rec-5341 and rec-5342 close through PR B's Resolves trailer; rec-5290 stays open."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5289's acceptance node (PR A).
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_actions_sha_pin_drain.py::test_baseline_is_empty -q
    expected: One test passes.
    expected_literals: [1 passed]
    fix_if: A floating reference or a baseline key remains; pin it and regenerate, never edit the test.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Split build: the node turns green on PR A, but implementation_declared flips on PR B, where
      validate_graduation_completeness needs a registry row new in PR B's diff and validate_verification_registry's
      differential against post-A main would refuse the row as tautological (route gap rec-5325; same waiver as
      PLAN-persona-verdict-override VP 1). The node stays in the suite: pytest_diff selects it when the check changes,
      the full tier runs it, and a floating reference added by a workflow-only PR is refused by
      validate_actions_sha_pinned itself, whose pre_globs cover .github/workflows/**.
  - step: 2
