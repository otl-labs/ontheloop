      "tests/checks/ci_guards/test_validate_actions_sha_pinned.py::TestCommentForms::test_comment_without_leading_space_has_a_defined_outcome" -q
    expected: Two tests pass.
    expected_literals: [2 passed]
    fix_if: Either fails; fix the check, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: actions-sha-pinned-defined-failure-forms
  - step: 3
    phase: pre-deploy
    action: The shared predicate's own tests and the repaired graduated node (PR B).
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test__shared.py
      tests/checks/ci_guards/test_actions_sha_pin_drain.py::test_no_baseline_entry_outside_codeowners_paths -q
    expected: All pass.
    fix_if: "A failure; fix the predicate, or the node's CODEOWNERS parsing, never the claim."
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of a test file this plan creates plus an already-graduated node it rewrites in place; pytest_diff
      selects both on every PR that touches them, and the node is already a standing record.
  - step: 4
