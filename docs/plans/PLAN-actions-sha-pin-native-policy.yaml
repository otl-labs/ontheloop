      "tests/checks/misc/test_validate_ghas_probe.py::TestValidateGhasProbe::test_check_fails_when_sha_pinning_field_absent"
      "tests/checks/misc/test_validate_ghas_probe.py::TestValidateGhasProbe::test_runner_nonzero_when_sha_pinning_not_required" -q
    expected: Three tests pass.
    expected_literals: [3 passed]
    fix_if: Any fails; fix the probe, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: ghas-probe-sha-pinning-required
  - step: 4
    phase: pre-deploy
    action: Every test file this plan touches, whole, plus test_terraform_github_import_blocks.py, which parses repo.tf (a regression run).
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_actions_sha_pinning_required.py
      tests/test_terraform_github_apply_gate.py tests/checks/misc/test_validate_ghas_probe.py
      tests/checks/iam_tf/test_terraform_github_import_blocks.py -q
    expected: All tests pass.
    fix_if: Any failure; fix the code, never loosen an assertion (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of test files this plan creates or modifies; pytest_diff selects them on every PR that touches
      them, and the behaviour nodes are graduated individually in VP 1-3.
  - step: 5
    phase: pre-deploy
    action: Provider-free format check of the terraform/github root (validate and plan are CI's, Decision 119).
    command: terraform fmt -check -recursive terraform/github
    expected: Exit 0, no file listed.
    fix_if: A file is listed; run terraform fmt on it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates CI's required terraform-validate check, which runs fmt -check on this root for every PR that touches
      it; a second standing record adds no independence.
  - step: 6
    phase: pre-deploy
    action: >-
      Nothing in use would break: every remote uses: on the branch is pinned (the presubmit check passes), and every
      nested remote uses: inside each third-party composite action, at the pinned commit, is a 40-hex pin. Moment
      claim at build time (network). Limit: one nesting level (a composite inside a composite is not followed;
      none exists today, the one second-level action, actions/attest, being node24).
    command: >-
      bin/venv-python -c "from scripts.checks.ci_guards.validate_actions_sha_pinned import validate_actions_sha_pinned as v; f=[]; v(f); assert not f, f" &&
      for p in $(grep -rhoE 'uses:\s*[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}' .github | sed -E 's/uses:\s*//' | sort -u);
      do r=${p%@*}; s=${p#*@}; repo=$(echo "$r" | cut -d/ -f1-2); sub=$(echo "$r" | cut -d/ -f3-);
      y=$(curl -fsS "https://raw.githubusercontent.com/$repo/$s/${sub:+$sub/}action.yml" || curl -fsS "https://raw.githubusercontent.com/$repo/$s/${sub:+$sub/}action.yaml") || { echo "FETCH_FAILED $r"; exit 1; };
      echo "$y" | grep -qE "using:\s*['\"]?composite" || continue;
      bad=$(echo "$y" | grep -E '^\s*-?\s*uses:' | grep -vE 'uses:\s*\./' | grep -vE '@[0-9a-f]{40}');
      [ -z "$bad" ] && echo "COMPOSITE_PINNED $r" || { echo "COMPOSITE_FLOATING $r: $bad"; exit 1; }; done; echo NESTED_OK
    expected: The check prints PASS; each composite action prints COMPOSITE_PINNED; the run ends NESTED_OK.
    fix_if: >-
      FETCH_FAILED: no network or proxy denial; the claim is unproven, so stop and report, never treat it as a pass.
      A floating nested ref (COMPOSITE_FLOATING) would fail that workflow once the policy is on; stop and report it
      to the plan owner (re-pin to a release whose nested refs are pinned, or keep the policy off), never apply first.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      The build PR's PR-time plan (terraform-github-plan.yml report comment) lists exactly one change, an in-place
      update of github_actions_repository_permissions.this whose changed attributes are sha_pinning_required only.
      Plan shape only: the resource is already in state, so any change plans as an update, and the provider may read an
      unserved field as false (inferred), so this step does not prove availability; VP 12's unknown branch and VP 15 do.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__issue_read(method=get_comments) on the build PR; the terraform-github-plan report comment lists one row: github_actions_repository_permissions.this, update, sha_pinning_required')"
    expected: One update row, changed attribute sha_pinning_required only; no other row.
    fix_if: >-
      Any other row, a create, or a provider error naming the field: stop and report to the plan owner (the setting
      may be unavailable on this plan; never apply around it).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Rec acceptance is decidable and the plan scopes stay closed.
    command: bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-actions-sha-pin-native-policy.yaml
    expected: No unmet registration obligation.
    fix_if: An obligation is reported; bring the plan owner a scope amendment.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim about this plan's scope against today's registry (Decision 244 cl.4); validate_plan_scope_closure
      enforces the same closure at gate time.
  - step: 9
    phase: pre-deploy
    action: Fast tier on the build branch before the PR.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Any failing check; fix the cause.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Diff-aware against origin/main, so it depends on this branch's transient state; the PR's own pr-validate runs the
      same tier authoritatively (Decision 73), and a validate run can never be a graduated record.
  - step: 10
    phase: pre-deploy
    action: >-
      Full tier on the ready head, started in the background from the top-level session with a 2 h limit, and its
      verdict, before the PR is opened (handoff_policy).
    command: >-
      bin/venv-python -c "print('start in the background, 2 h limit: bin/venv-python -m scripts.validate')" &&
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: verify-head reports ok for HEAD.
    fix_if: Any failure, or a timeout; the handoff is blocked; fix and re-run from the start (handoff_policy).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A validate run on this branch's transient tree, the same class as VP 9; the PR's own CI and the post-merge full
      tier re-run it authoritatively, and a validate run can never be a graduated record.
  - step: 11
    phase: post-deploy
    action: >-
      The merge's push run of terraform-github-apply.yml ends neutral with the unnamed-gate warning for
      github_actions_repository_permissions.this, and its preview row now shows sha_pinning_required=true (the
      merged extractor).
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_list(method=list_workflow_runs, resource_id=terraform-github-apply.yml) for the merge SHA; mcp__github__get_job_logs on its preview job: TF_GITHUB_APPLY_GATE_CHANGE_UNNAMED github_actions_repository_permissions.this and the row value sha_pinning_required=true')"
    expected: Conclusion success (neutral end), the warning names the address, the row shows sha_pinning_required=true.
    fix_if: The run applies, fails, or lists another change; stop and report, never dispatch over it.
    hermetic: false
  - step: 12
    phase: post-deploy
    action: Before the apply, a ghas-probe dispatch fails naming sha_pinning_required (the probe discriminates).
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_run_trigger(method=run_workflow, workflow_id=ghas-probe.yml, ref=main); then actions_get(get_workflow_run) conclusion failure and get_job_logs showing disabled control(s) with sha_pinning_required=false')"
    expected: Conclusion failure; the log names sha_pinning_required=false and no other disabled control.
    fix_if: >-
      It passes (the setting is already on, or the field reads true): stop and report. It names
      sha_pinning_required=unknown: the API does not serve the field here, so VP 15 could never pass; stop and report
      before the apply. It fails on another control or on auth: fix that first, never proceed blind.
    hermetic: false
  - step: 13
    phase: post-deploy
    action: >-
      Canary, before the apply. Restart the build's branch locally from main after the merge, with no push yet (git
      fetch origin main, git reset --hard origin/main, git fetch --prune origin). Commit the one-line codeql.yml change
      (analyze job checkout to actions/checkout@v7). The handoff evidence gate needs full-tier evidence for that exact
      tree (a zero-diff push is never exempt, so there is exactly one push): start the full tier in the background
      (2 h limit), then validation_result --verify-head, expecting failed_run (validate_actions_sha_pinned refuses the
      floating checkout; the gate passes failed_run with a warning). Push once, as its own call: git push -u origin
      HEAD (the squash merge deletes the head branch: delete_branch_on_merge read on 2026-11-12, cited in
      PLAN-github-environment-tidy, and the coordinator-harness-claude-projects.yaml git-push fact). If the remote
      branch still exists, first delete it with git push origin :<branch> as its own call (force-with-lease is denied
      in auto mode); the CC-web git proxy is expected to refuse it (branch-cleanup.yml header), so try the session
      delete first and, when it is refused, ask the operator to delete that one branch in the GitHub UI and wait, then
      push. The branch
      then holds merged history plus the canary, and no pull request is open from it. Dispatch CodeQL with ref set to
      the branch; its run succeeds (the policy is still off). Expected side effect: with security-events write, each
      branch dispatch uploads a code-scanning analysis for that branch ref; it goes stale when VP 16 deletes the
      branch and touches no main alert. Start this right after the merge so the apply is not delayed past Monday
      2026-11-23 07:00 UTC.
    command: >-
      bin/venv-python -c "print('start in the background, 2 h limit: bin/venv-python -m scripts.validate')"; bin/venv-python -m scripts.checks.validation_result --verify-head; bin/venv-python -c "print('expect failed_run; every failed_check_attributions entry in logs/debug/validation-result.json has check validate_actions_sha_pinned or a check an open red rec names, at least one validate_actions_sha_pinned; then git push -u origin HEAD as its own call; MCP: mcp__github__actions_run_trigger(method=run_workflow, workflow_id=codeql.yml, ref=<branch>); actions_get(get_workflow_run) conclusion success')"
    expected: verify-head reports failed_run, and every failed_check_attributions entry in logs/debug/validation-result.json has check validate_actions_sha_pinned or a check an open red rec names, and at least one has validate_actions_sha_pinned (the recs by id as bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-actions-sha-pin-native-policy.yaml reports them at that time; read each rec for its check); the branch CodeQL run concludes success.
    fix_if: >-
      The CodeQL run fails for another reason, or a failed_check_attributions entry names any other check: stop and
      report; never repair unrelated code on this throwaway branch, never touch the policy or main. Not a stop: the
      unit-tests scaffold failure (test_validate_actions_sha_pinned.py::test_real_tree_passes and
      test_actions_sha_pin_drain.py scan the real tree and see the floating checkout); scaffold failures are
      recorded in failed_checks only, never in failed_check_attributions.
    hermetic: false
  - step: 14
    phase: post-deploy
    action: >-
      ADMIN STEP (operator's words naming it). The build asks: "May I dispatch terraform-github-apply from main with
      gate_change github_actions_repository_permissions.this to turn on required SHA pinning?" On his words it
      dispatches; he reads the preview (one update row whose allowlisted values read allowed_actions="all", enabled=true, sha_pinning_required=true) and
      approves in Actions; the build reads the run's conclusion and its apply log.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_run_trigger(method=run_workflow, workflow_id=terraform-github-apply.yml, ref=main, inputs={gate_change: github_actions_repository_permissions.this}); actions_get(get_workflow_run) conclusion success; get_job_logs on the apply job: TF_GITHUB_APPLY_CHECKED change=1 and the clean re-plan')"
    expected: Conclusion success; the apply log shows one change applied and a clean re-plan.
    fix_if: >-
      The preview lists any other change, or the apply errors on the field: the operator rejects the run and the build
      reports it; never approve a change the preview did not list. The apply succeeds but its re-plan is not clean (the
      setting did not persist on this GitHub plan): stop and report; never re-dispatch over it (VP 15 also catches it).
    hermetic: false
  - step: 15
    phase: post-deploy
    action: Live read-back. A ghas-probe dispatch after the apply passes.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_run_trigger(method=run_workflow, workflow_id=ghas-probe.yml, ref=main); actions_get conclusion success; get_job_logs: the _run_cli line GHAS probe OK with sha_pinning_required=true')"
    expected: Conclusion success; the runner's GHAS probe OK line shows sha_pinning_required=true.
    fix_if: It fails naming sha_pinning_required; the apply did not take; stop and report to the plan owner and the operator (Decision 89 precedent). rec-5290 is already closed by the trailer, so the plan owner files a follow-on rec for the gap; never append a read-back that did not pass.
    hermetic: false
  - step: 16
    phase: post-deploy
    action: >-
      Enforcement proof. Dispatch CodeQL again with ref set to the branch (same commit as VP 13); its run fails with
      GitHub's refusal of an action not pinned to a full-length commit SHA. Record the run id and the message, then
      delete the branch from the remote as its own call, git push origin :<branch> (an agent-branch delete, which the
      handoff evidence gate passes), and read the remote back. The CC-web git proxy is expected to refuse remote ref
      deletes (branch-cleanup.yml header), so the expected path is that the build asks the operator to delete that
      one branch in the GitHub UI as soon as the session delete is refused. On every path, finish with git reset --hard
      origin/main locally, so no later push re-publishes the canary commit. The branch never opens a pull request
      carrying the change; no restore commit is pushed.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_run_trigger(method=run_workflow, workflow_id=codeql.yml, ref=<branch>); actions_get conclusion failure or startup_failure; get_job_logs or the run annotations naming full-length commit SHA pinning; then git push origin :<branch> as its own call')" && git ls-remote --exit-code origin "refs/heads/$(git branch --show-current)"; test $? -eq 2
    expected: The run fails with the pinning refusal message; after the delete, git ls-remote exits 2 (the branch is gone from the remote).
    fix_if: >-
      It succeeds: the stored setting does not enforce; stop and report to the plan owner and the operator (the
      native control is then a no-op; the presubmit check is the only control). The dispatch call is refused or no run
      appears: record the API response as the evidence, delete the branch all the same, and report. ls-remote still finds
      the branch: the delete was refused; re-run the ls-remote leg after the operator's delete (never dispatch
      branch-cleanup.yml for it: a non-dry run deletes every merged or ancestor-of-main branch, not only this one).
    hermetic: false
  - step: 17
    phase: post-deploy
    action: >-
      No breakage. Every workflow run created on the repository from the apply until handoff that failed is checked
      for the pinning refusal; the first ci.yml run on main after the apply concludes success. claude.yml
      (claude-code-action), publish-ontheloop.yml (gh-action-pypi-publish) and persona-image-publish.yml
      (attest-build-provenance) runs and Dependabot's GitHub-managed update runs, if any ran, concluded success; if
      none ran, they are named pending in the report.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_list(method=list_workflow_runs) created after the apply; for each failed run get_job_logs: no pinning refusal; first ci.yml run on main: conclusion success')"
    expected: Apart from the two branch CodeQL canary runs, no run failed on the pinning policy; the first main ci.yml run after the apply succeeded.
    fix_if: >-
      A run failed on the policy: report it at once; the operator may untick the setting (break-glass) while a revert
      PR is opened, or the ref is pinned forward.
    hermetic: false
  - step: 18
    phase: post-deploy
    action: >-
      rec-5290 reads closed (the build merge's Resolves trailer closed it through ci.yml's trailer jobs) and its
      resolution cites the VP 14, VP 15 and VP 16 run ids appended after the read-back.
    command: >-
      bin/venv-python -c "import src.common.ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(),['rec-5290']); print({x['id']: (x['status'], x.get('resolution')) for x in r})"
