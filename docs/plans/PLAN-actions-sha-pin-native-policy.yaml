execution_steps:
  - "Pre: rebase on origin/main; VP 6 (nothing in use would break). A floating ref anywhere stops the build before any edit."
  - "repo.tf: add sha_pinning_required = true and rewrite the block comment as the scope row says; create the static test; VP 1 red on the base, green on the branch; VP 5."
  - "Gate: add the extractor and the two test nodes; VP 2 red on the base, green on the branch. tests/test_terraform_github_apply_gate.py is at 446 of 500 SLOC (54 headroom, measured 2026-11-18): keep the two nodes compact and re-measure; past 500, decompose, never raise."
  - "Probe: add _pin_label, the state key, the disabled-control leg, the summary field and the docstring lines (examined stays 3); update _actions_body and add the three nodes; VP 3 red on the base, green on the branch."
  - "DECISIONS.md: append after Decision 83's last Update line exactly: '> **Update (<the build commit's UTC date, YYYY-MM-DD>, PLAN-actions-sha-pin-native-policy):** the ghas-probe's Actions-permissions control also checks sha_pinning_required, GitHub's required SHA pinning (rec-5290, Decision 100), so the three controls named in the reversal conditions include it. The first live read-back run is cited in rec-5290's closure.' Run the decisions-index generator and expect no diff (the index holds number, title, status and amends); a diff is a stop for the plan owner."
  - "VP 4, VP 8, VP 9; commit, with a branch commit message carrying the trailer line Resolves: rec-5290 in a Key: value block before the footer; git fetch origin main and bin/venv-python -m scripts.session.rebase_resolve; VP 10 (full tier in the background, 2 h limit, then verify-head ok; a timeout blocks the handoff and reruns from the start); push as its own call (git push -u origin HEAD); open the PR with the attribution header; VP 7 from its PR-time plan comment; code review PROCEED (the implement skill's review lane); post the final diff to the operator through the coordinator; merge (squash) only on his final-diff word with review PROCEED and green checks, through scripts.session.merge_step premerge (commit_message carrying Resolves: rec-5290, expectedHeadSha) and then merge_step readback on the merge sha."
  - "After merge: VP 11; VP 12; VP 13 (local branch restart, canary commit, its full tier, one push, dispatch); ask the operator for VP 14 in the words it gives and wait; on his words VP 14; VP 15; VP 16; VP 17."
  - "After VP 16: read rec-5290's current resolution (fetch_recs_by_ids), then append the run ids with a resolution-only update: bin/venv-python -m scripts.ops_data_portal --update-rec rec-5290 --resolution '<current resolution>; native SHA pinning applied (VP 14 run <id>), read back by ghas-probe (VP 15 run <id>), enforced (VP 16 canary run <id>)' (no --status: the trailer already closed it; no --closure-artifact or --closure-fix-sha); VP 18."
  - "Report: what was implemented, verification results with every run id, and any pending VP 17 workflow."
rollback: >-
  Primary: a revert PR (sha_pinning_required removed or false) applied by a terraform-github-apply dispatch whose
  gate_change names github_actions_repository_permissions.this, after the operator's approval; the gate extractor and
  the probe leg may stay (the probe then alarms until the revert is complete, a true signal, or its leg is reverted
  in the same PR). Break-glass: the operator unticks "Require actions to be pinned to a full-length commit SHA" in the
  repository's Actions settings, then the revert PR or a re-apply reconverges the root (Decision 126).
