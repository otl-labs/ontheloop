schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "actions-sha-pin-native-policy"
intent: >-
  Plan 4 of 4 for rec-5020 (rec-5290): turn on GitHub's native Actions policy that requires every action to be pinned
  to a full-length commit SHA, declared in terraform/github (Decision 100) and applied by an operator-approved
  terraform-github-apply dispatch (Decision 248). The forge then refuses an unpinned action at run time, outside any
  branch's edit reach (NS.9), while validate_actions_sha_pinned keeps what the native policy lacks: the PR-time
  signal and the exact version comment. The apply preview shows the setting's value, the weekly GHAS live probe
  reads it back and alarms if it is ever off, and a one-off canary run proves the forge enforces it.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-actions-sha-pin-native-policy.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Itinerary item H1, follow-on plan 4 of PLAN-actions-sha-pinned. terraform/github is in scope, so V3 with
  post-deploy steps; no Lambda-packaged file is in scope. Closes no criterion.
closes_criteria: []
cites: [dec:83, dec:100, dec:248]
scope:
  - file: terraform/github/repo.tf
    action: Modify
    purpose: >-
      github_actions_repository_permissions.this gains sha_pinning_required = true. The block comment is rewritten to
      say: the forge refuses any action not pinned to a full commit SHA (Decision 100; reusable workflows may still use
      a tag, per GitHub); validate_actions_sha_pinned stays for the PR-time signal and the exact version comment;
      rollback is a revert PR applied by a gate_change dispatch, and the operator's own untick in the repository's
      Actions settings is break-glass that a revert PR or re-apply must follow (Decision 126).
  - file: tests/checks/iam_tf/test_actions_sha_pinning_required.py
    action: Create
    purpose: >-
      test_repository_requires_sha_pinned_actions: the github_actions_repository_permissions.this block in
      terraform/github sets sha_pinning_required = true (tests/fixtures/terraform_hcl_blocks find_resource_block over
      tf_dir_file_texts). The predicate takes a {filename: text} mapping, so
      test_absent_or_false_attribute_is_refused runs it on synthetic HCL (attribute absent; set to false; set inside a
      comment only) and each is refused.
  - file: scripts/ci/terraform_github_apply_gate.py
    action: Modify
    purpose: >-
      ALLOWLIST gains a github_actions_repository_permissions extractor returning enabled, allowed_actions and
      sha_pinning_required (two booleans and an enum; no id), so the preview's Allowlisted values column shows the
      value being approved and check() binds the applied plan to it (Decision 248 cl.2, cl.3). The module docstring's
      ALLOWLIST sentence is unchanged; nothing else changes.
  - file: tests/test_terraform_github_apply_gate.py
    action: Modify
    purpose: >-
      TestRows::test_actions_permissions_row_carries_allowlisted_values (the row's values are exactly the three keys,
      and no id); TestCheck::test_actions_permissions_value_differing_from_review_is_unreviewed (a reviewed row with
      sha_pinning_required true against a plan with false is refused TF_GITHUB_APPLY_UNREVIEWED).
  - file: scripts/checks/misc/validate_ghas_probe.py
    action: Modify
    purpose: >-
      _probe reads actions/permissions sha_pinning_required through a data-free tri-state coercion (_pin_label:
      "true" for True, "false" for False, "unknown" otherwise, the _status_label pattern) into state key
      sha_pinning_required; _disabled_controls appends sha_pinning_required=<label> unless it is "true", so an absent
      or renamed field fails loud (Decision 55); _state_summary reports it; registry.examined goes from 3 to 4 and its
      comment names the fourth control. The module docstring names the control. No change to ghas-probe.yml.
  - file: tests/checks/misc/test_validate_ghas_probe.py
    action: Modify
    purpose: >-
      _actions_body carries sha_pinning_required (default True, so the existing all-enabled cases stay all-enabled);
      TestValidateGhasProbe::test_check_fails_when_sha_pinning_not_required and
      TestValidateGhasProbe::test_check_fails_when_sha_pinning_field_absent (the check appends a failure naming
      sha_pinning_required) and TestValidateGhasProbe::test_runner_nonzero_when_sha_pinning_not_required.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      One dated annotation (Decision 177 dialect) appended after Decision 83's last Update line, worded exactly as the
      execution step gives it: the probe checks a fourth control from this plan, so the reversal conditions' "the
      three controls" reads "the four controls" from that date. No other line of the entry changes.
bundled_recommendations: [rec-5290]
followon_recs: []
infrastructure_dependencies:
  - >-
    terraform/github: an in-place update of github_actions_repository_permissions.this (sha_pinning_required to
    true), applied by a terraform-github-apply.yml dispatch from main whose gate_change names
    github_actions_repository_permissions.this, after one operator approval in Actions (Decision 248 cl.1, cl.3). The
    merge's push run ends neutral naming the dispatch owed (VP 9). The dispatch is an admin step: it waits for the
    operator's own words naming it (VP 12).
  - >-
    Nothing else applies: no terraform/personal or terraform/bootstrap file, no IAM, no Lambda. The GHAS_PROBE_TOKEN
    (read-only Administration scope) already reads /repos/{repo}/actions/permissions.
acceptance_criteria:
  - terraform/github/repo.tf sets sha_pinning_required = true on github_actions_repository_permissions.this, guarded by a static test.
  - The apply preview's row for github_actions_repository_permissions.this shows sha_pinning_required=true among its allowlisted values.
  - After the approved apply, a ghas-probe dispatch passes and reports sha_pinning_required=true; a dispatch before the apply failed naming it.
  - A canary run using a tag-pinned action succeeds before the apply and fails after it with GitHub's pinning refusal.
  - No other workflow run fails on the pinning policy after the apply.
  - rec-5290 is closed through the portal after the post-apply read-back, citing the probe run.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5290's acceptance node; the declared attribute.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_actions_sha_pinning_required.py::test_repository_requires_sha_pinned_actions -q
    expected: One test passes.
    expected_literals: [1 passed]
    fix_if: The attribute is absent or false in repo.tf; fix repo.tf, never the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: actions-sha-pinning-required-declared
  - step: 2
    phase: pre-deploy
    action: The apply gate shows and binds the Actions-permissions values.
    command: >-
      bin/venv-python -m pytest
      "tests/test_terraform_github_apply_gate.py::TestRows::test_actions_permissions_row_carries_allowlisted_values"
      "tests/test_terraform_github_apply_gate.py::TestCheck::test_actions_permissions_value_differing_from_review_is_unreviewed" -q
    expected: Two tests pass.
    expected_literals: [2 passed]
    fix_if: Either fails; fix the extractor, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: terraform-github-apply-gate-actions-permission-values
  - step: 3
    phase: pre-deploy
    action: The GHAS probe fails loud unless the live setting is true.
    command: >-
      bin/venv-python -m pytest
      "tests/checks/misc/test_validate_ghas_probe.py::TestValidateGhasProbe::test_check_fails_when_sha_pinning_not_required"
      "tests/checks/misc/test_validate_ghas_probe.py::TestValidateGhasProbe::test_check_fails_when_sha_pinning_field_absent"
      "tests/checks/misc/test_validate_ghas_probe.py::TestValidateGhasProbe::test_runner_nonzero_when_sha_pinning_not_required" -q
    expected: Three tests pass.
    expected_literals: [3 passed]
    fix_if: Any fails; fix the probe, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: ghas-probe-sha-pinning-required
  - step: 4
    phase: pre-deploy
    action: Every test file this plan touches, whole.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_actions_sha_pinning_required.py
      tests/test_terraform_github_apply_gate.py tests/checks/misc/test_validate_ghas_probe.py
      tests/checks/iam_tf/test_terraform_github_import_blocks.py -q
    expected: All tests pass.
    fix_if: Any failure; fix the code, never loosen an assertion (Decision 235).
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Provider-free format check of the terraform/github root (validate and plan are CI's, Decision 119).
    command: terraform fmt -check -recursive terraform/github
    expected: Exit 0, no file listed.
    fix_if: A file is listed; run terraform fmt on it.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Nothing in use would break: every remote uses: on the branch is pinned (the presubmit check passes), and every
      nested remote uses: inside each third-party composite action, at the pinned commit, is a 40-hex pin. Moment
      claim at build time (network).
    command: >-
      bin/venv-python -c "from scripts.checks.ci_guards.validate_actions_sha_pinned import validate_actions_sha_pinned as v; f=[]; v(f); assert not f, f" &&
      for p in $(grep -rhoE 'uses:\s*[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}' .github | sed -E 's/uses:\s*//' | sort -u);
      do r=${p%@*}; s=${p#*@}; repo=$(echo "$r" | cut -d/ -f1-2); sub=$(echo "$r" | cut -d/ -f3-);
      y=$(curl -fsS "https://raw.githubusercontent.com/$repo/$s/${sub:+$sub/}action.yml" || curl -fsS "https://raw.githubusercontent.com/$repo/$s/${sub:+$sub/}action.yaml");
      echo "$y" | grep -qE "using:\s*['\"]?composite" || continue;
      bad=$(echo "$y" | grep -E '^\s*-?\s*uses:' | grep -vE 'uses:\s*\./' | grep -vE '@[0-9a-f]{40}');
      [ -z "$bad" ] && echo "COMPOSITE_PINNED $r" || { echo "COMPOSITE_FLOATING $r: $bad"; exit 1; }; done; echo NESTED_OK
    expected: The check prints PASS; each composite action prints COMPOSITE_PINNED; the run ends NESTED_OK.
    fix_if: >-
      A floating nested ref (COMPOSITE_FLOATING) would fail that workflow once the policy is on; stop and report it
      to the plan owner (re-pin to a release whose nested refs are pinned, or keep the policy off), never apply first.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      The build PR's PR-time plan (terraform-github-plan.yml report comment) lists exactly one change, an in-place
      update of github_actions_repository_permissions.this whose changed attributes are sha_pinning_required only.
      An update, not a create, shows the provider read the field from the live API, the first evidence the setting
      exists for this repository on this plan (Decision 89 precedent).
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__issue_read(method=get_comments) on the build PR; the terraform-github-plan report comment lists one row: github_actions_repository_permissions.this, update, sha_pinning_required')"
    expected: One update row, changed attribute sha_pinning_required only; no other row.
    fix_if: >-
      Any other row, a create, or a provider error naming the field: stop and report to the plan owner (the setting
      may be unavailable on this plan; never apply around it).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Rec acceptance is decidable and the plan scopes stay closed.
    command: bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-actions-sha-pin-native-policy.yaml
    expected: No unmet registration obligation.
    fix_if: An obligation is reported; bring the plan owner a scope amendment.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      The merge's push run of terraform-github-apply.yml ends neutral with the unnamed-gate warning for
      github_actions_repository_permissions.this, and its preview row now shows sha_pinning_required=true (the
      merged extractor).
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_list(method=list_workflow_runs, resource_id=terraform-github-apply.yml) for the merge SHA; mcp__github__get_job_logs on its preview job: TF_GITHUB_APPLY_GATE_CHANGE_UNNAMED github_actions_repository_permissions.this and the row value sha_pinning_required=true')"
    expected: Conclusion success (neutral end), the warning names the address, the row shows sha_pinning_required=true.
    fix_if: The run applies, fails, or lists another change; stop and report, never dispatch over it.
    hermetic: false
  - step: 10
    phase: post-deploy
    action: Before the apply, a ghas-probe dispatch fails naming sha_pinning_required (the probe discriminates).
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_run_trigger(method=run_workflow, workflow_id=ghas-probe.yml, ref=main); then actions_get(get_workflow_run) conclusion failure and get_job_logs showing disabled control(s) with sha_pinning_required=false')"
    expected: Conclusion failure; the log names sha_pinning_required=false and no other disabled control.
    fix_if: >-
      It passes (the setting is already on, or the field reads true): stop and report; it fails on another control or
      on auth: fix that first, never proceed blind.
    hermetic: false
  - step: 11
    phase: post-deploy
    action: >-
      Canary, before the apply: on the build's own branch with no pull request open (restarted from main after the
      merge), push one commit adding .github/workflows/sha-pin-canary.yml (on: push, paths: the file itself; one
      job running actions/checkout at its major tag, never on main). Its run succeeds.
    command: >-
      bin/venv-python -c "print('git push the canary commit; MCP: actions_list(list_workflow_runs, resource_id=sha-pin-canary.yml) for that commit; actions_get conclusion success')"
    expected: The canary run concludes success.
    fix_if: It fails for any other reason; fix the canary, not the policy.
    hermetic: false
  - step: 12
    phase: post-deploy
    action: >-
      ADMIN STEP (operator's words naming it). The build asks: "May I dispatch terraform-github-apply from main with
      gate_change github_actions_repository_permissions.this to turn on required SHA pinning?" On his words it
      dispatches; he reads the preview (one update: sha_pinning_required=true, enabled=true, allowed_actions=all) and
      approves in Actions; the build reads the run's conclusion and its apply log.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_run_trigger(method=run_workflow, workflow_id=terraform-github-apply.yml, ref=main, inputs={gate_change: github_actions_repository_permissions.this}); actions_get(get_workflow_run) conclusion success; get_job_logs on the apply job: TF_GITHUB_APPLY_CHECKED change=1 and the clean re-plan')"
    expected: Conclusion success; the apply log shows one change applied and a clean re-plan.
    fix_if: >-
      The preview lists any other change, or the apply errors on the field: the operator rejects the run and the build
      reports it; never approve a change the preview did not list.
    hermetic: false
  - step: 13
    phase: post-deploy
    action: Live read-back. A ghas-probe dispatch after the apply passes.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_run_trigger(method=run_workflow, workflow_id=ghas-probe.yml, ref=main); actions_get conclusion success; get_job_logs: GHAS probe passed with sha_pinning_required=true')"
    expected: Conclusion success; the summary line shows sha_pinning_required=true.
    fix_if: It fails naming sha_pinning_required; the apply did not take; stop and report (Decision 89 precedent), never mark the rec closed.
    hermetic: false
  - step: 14
    phase: post-deploy
    action: >-
      Enforcement proof. Push a second canary commit (a one-line change to the canary file); its run fails at job
      setup with GitHub's refusal of an action not pinned to a full-length commit SHA. Record the run id and the
      message, then push a commit deleting the canary file. The branch never opens a pull request with the canary.
    command: >-
      bin/venv-python -c "print('git push; MCP: actions_list(list_workflow_runs, resource_id=sha-pin-canary.yml) for that commit; actions_get conclusion failure; get_job_logs (or the run annotations) naming full-length commit SHA pinning; then git push the deletion')"
    expected: The run fails with the pinning refusal; the deletion commit leaves no canary file on the branch.
    fix_if: >-
      It succeeds: the stored setting does not enforce; stop and report to the plan owner and the operator (the
      native control is then a no-op; the presubmit check is the only control).
    hermetic: false
  - step: 15
    phase: post-deploy
    action: >-
      No breakage. Every workflow run created on the repository from the apply until handoff that failed is checked
      for the pinning refusal; the first ci.yml run on main after the apply concludes success. claude.yml
      (claude-code-action) and publish-ontheloop.yml (gh-action-pypi-publish) runs, if any ran, concluded success;
      if none ran, they are named pending in the report.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_list(method=list_workflow_runs) created after the apply; for each failed run get_job_logs: no pinning refusal; first ci.yml run on main: conclusion success')"
    expected: No run failed on the pinning policy; the first main ci.yml run after the apply succeeded.
    fix_if: >-
      A run failed on the policy: report it at once; the operator may untick the setting (break-glass) while a revert
      PR is opened, or the ref is pinned forward.
    hermetic: false
  - step: 16
    phase: post-deploy
    action: rec-5290 is closed through the portal with the probe run as its closure artifact.
    command: >-
      bin/venv-python -c "import src.common.ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(),['rec-5290']); print({x['id']: x['status'] for x in r})"
    expected: rec-5290 closed.
    fix_if: Still open; run the update_rec call in the execution steps again and read back its result.
    hermetic: false
test_obligations:
  - source: terraform/github/repo.tf
    behavior: github_actions_repository_permissions.this requires SHA-pinned actions
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_actions_sha_pinning_required.py::test_repository_requires_sha_pinned_actions
    red_green_expectation: red before (the node is absent and repo.tf has no sha_pinning_required), green after
  - source: scripts/ci/terraform_github_apply_gate.py
    behavior: the Actions-permissions row carries enabled, allowed_actions and sha_pinning_required, and check() binds them to the review
    verification_step: 2
    test_selector: tests/test_terraform_github_apply_gate.py::TestRows::test_actions_permissions_row_carries_allowlisted_values
    red_green_expectation: red before (the node is absent; the row's values are empty), green after
  - source: scripts/checks/misc/validate_ghas_probe.py
    behavior: the probe fails loud when the live sha_pinning_required is false or absent
    verification_step: 3
    test_selector: tests/checks/misc/test_validate_ghas_probe.py::TestValidateGhasProbe::test_check_fails_when_sha_pinning_field_absent
    red_green_expectation: red before (the node is absent; the probe ignores the field), green after
constraints:
  - "One build PR: repo.tf, the gate extractor, the probe, their tests and the Decision 83 annotation. ghas-probe.yml and terraform-github-apply.yml are not edited."
  - "Merge: on green checks once the plan is approved (operator ruling 2026-11-16); the operator's review point is the apply preview he approves in Actions (VP 12). No Resolves trailer: rec-5290 closes through the portal after VP 13, because the setting is not live at merge."
  - "The apply dispatch is an admin step: it waits for the operator's own words naming it in the build thread (Decision 248 cl.1); approval in this plan or from another thread does not carry over."
  - "The canary lives only on the build's harness branch with no open pull request and is deleted after VP 14; it never reaches main and is never pushed to any other branch."
  - "If, at build time, a check gates the Decision 83 annotation as approved wording (the unbuilt wording-approval-routing plan adds one), stop and return to the plan owner for a sidecar; never merge it around the gate."
  - "Test fixtures build SHAs from repeated characters, never a literal 40-hex string (detect-secrets)."
  - No rescue agents or workaround loops (Decision 55); never skip or loosen a test to get green (Decision 235).
