  - "The canary is a branch-only edit of codeql.yml (operator's choice 2026-11-18 16:03 UTC over a new canary file, which would need a ci_rca_taxonomy row in a file at its cap that then goes stale on main): it exists only in one post-merge commit on the build's harness branch while no pull request is open from it, the branch is deleted from the remote at VP 16, and it appears in no PR diff."
  - "Merge: on code review PROCEED, green checks and the operator's own word on the final diff. The build PR touches CODEOWNERS paths (terraform/github/ and the Decision 248 apply gate script, which is also security code), and Decision 246 cl.4 with docs/contracts/coordinator.yaml standing_authorisation keeps the final-diff word for them; the 2026-11-16 merge-on-green ruling does not lift it (the reading PLAN-actions-sha-pin-codeowners, the previous plan of this series, applied after that ruling). The build posts the final diff to the operator through the coordinator and merges only on his word; his second review point is the apply preview he approves in Actions (VP 14). rec-5290 closes through the Resolves trailer on the build merge (git-ops resolves_trailer: a plan with bundled recs carries it, and a bare portal close is sanctioned only after a transport failure or merge-leg refusal; validate_merge_step enforces it). Its acceptance is the static node test_repository_requires_sha_pinned_actions, decidable at merge; the apply, read-back and canary (VP 14-16) stay post-deploy verification of this plan, and their run ids are appended to rec-5290's resolution afterwards."
  - "The apply dispatch is an admin step: it waits for the operator's own words naming it in the build thread (Decision 248 cl.1); approval in this plan or from another thread does not carry over."
  - "The codeql.yml canary edit lives only on the build's harness branch with no open pull request, and that branch is deleted from the remote at VP 16; it never reaches main and is never pushed to any other branch. No other line of codeql.yml changes."
  - "If, at build time, a check gates the Decision 83 annotation as approved wording (the unbuilt wording-approval-routing plan adds one), stop and return to the plan owner for a sidecar; never merge it around the gate."
  - "Test fixtures build SHAs from repeated characters, never a literal 40-hex string (detect-secrets)."
  - No rescue agents or workaround loops (Decision 55); never skip or loosen a test to get green (Decision 235).
