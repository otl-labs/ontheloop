acceptance_criteria:
  - "No remote uses: reference in the 25 rec-5288 workflow files is floating: each is <owner>/<repo>[/<path>]@<40-hex> # vX.Y.Z, where vX.Y.Z is the newest exact release tag at that commit and the commit is the one the replaced tag resolved to at build time (same major version)."
  - "config/actions_sha_pin_baseline.yaml's rec-5288 bucket is empty and its rec-5289 bucket is unchanged; validate_actions_sha_pinned passes on the tree."
  - "Only uses: lines change in .github/workflows; the two tests that spelled the old floating literal check the same behaviour without depending on the ref."
  - "rec-5288 is closed through the squash commit's Resolves trailer; rec-5289 and rec-5290 stay open."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5288's acceptance node.
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_actions_sha_pin_drain.py::test_no_baseline_entry_outside_codeowners_paths -q
    expected: One test passes.
    expected_literals: [1 passed]
    fix_if: A rec-5288 key remains in the baseline or a floating reference remains in a non-CODEOWNERS file; pin it and regenerate the baseline, never edit the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: actions-sha-pin-non-codeowners-drained
  - step: 2
    phase: pre-deploy
    action: The drain test, the check's own tests (including test_real_tree_passes) and the two adjusted tests.
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test_actions_sha_pin_drain.py
      tests/checks/ci_guards/test_validate_actions_sha_pinned.py tests/ci/test_actions_capacity_steps.py
      tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py -q
    expected: All tests pass.
    fix_if: Any failure; fix the pin or the anchor, never loosen an assertion (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of test files this plan creates or modifies; the fast tier's pytest_diff selects them on every
      PR that touches them, so a standing copy adds no independence.
  - step: 3
    phase: pre-deploy
    action: The live tree passes the check, and the shipped baseline is exactly what render_baseline produces.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.checks import _common; from scripts.checks.ci_guards.validate_actions_sha_pinned import validate_actions_sha_pinned as v, render_baseline, BASELINE_REL;
      f=[]; v(f); assert not f, f; assert (Path(_common.ROOT)/BASELINE_REL).read_text(encoding='utf-8')==render_baseline(Path(_common.ROOT)); print('SHA_PIN_OK')"
    expected: Prints the ok marker.
    fix_if: A violation or a baseline that differs from the render; regenerate the baseline on the rebased base, never hand-edit a count.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the registered fast-tier check validate_actions_sha_pinned, which runs on every PR touching a workflow
      or the baseline, plus a one-time render equality that plan 3 changes by design.
  - step: 4
    phase: pre-deploy
    action: "Online pin audit (network, through the session proxy) -- for every converted uses: line in the PR diff, the pinned SHA equals the commit the replaced floating tag (v<major>) resolves to now, equals the commit its comment's exact tag resolves to, and the comment is the newest exact vX.Y.Z tag at that commit."
    command: >-
      bin/venv-python -c "import re,subprocess,yaml; d=subprocess.run(['git','diff','-U0','origin/main...HEAD','--','.github/workflows'],capture_output=True,text=True,check=True).stdout;
      n=sum(yaml.safe_load(subprocess.run(['git','show','origin/main:config/actions_sha_pin_baseline.yaml'],capture_output=True,text=True,check=True).stdout)['drains']['rec-5288'].values());
      m=re.findall(r'^-\s*(?:-\s+)?uses:\s*([\w.-]+/[\w.-]+)[\w./-]*@v(\d+)\s*$\n^\+\s*(?:-\s+)?uses:\s*\1[\w./-]*@([0-9a-f]{40}) # (v\d+\.\d+\.\d+)$',d,re.M); R={};
      ls=lambda r: R[r] if r in R else R.setdefault(r, dict(reversed(x.split('\t')) for x in subprocess.run(['git','ls-remote','--tags','https://github.com/'+r],capture_output=True,text=True,check=True).stdout.splitlines()));
      at=lambda r,t: ls(r).get('refs/tags/'+t+'^{}') or ls(r).get('refs/tags/'+t); V=lambda t: tuple(map(int,t[1:].split('.')));
      top=lambda r,s: max((n[10:].removesuffix('^{}') for n in ls(r) if re.fullmatch(r'refs/tags/v\d+\.\d+\.\d+(\^\{\})?',n) and at(r,n[10:].removesuffix('^{}'))==s), key=V);
      bad=[x for x in m if not (at(x[0],'v'+x[1])==x[2]==at(x[0],x[3]) and top(x[0],x[2])==x[3])]; assert not bad, bad; assert len(m)==n, (len(m), n); print('PIN_AUDIT_OK', len(m), len(R))"
    expected: Prints PIN_AUDIT_OK with the converted-line count (149 across 10 repositories on the 2026-11-17 probe; it must equal the base's rec-5288 total).
    fix_if: "A mismatch names (action, major, sha, tag): the floating tag moved since pinning or the wrong commit or comment was written; re-resolve with git ls-remote and re-pin. Run on the PR branch before merge (it pairs lines from the origin/main...HEAD diff). A negative probe (one setup-python pin set to v7.0.0's commit) failed as expected on 2026-11-17."
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Network moment claim (Decision 244 cl.4): tags move and the pairs come from this PR's diff; the standing offline
      check proves form only by design (imposter commits and stale pins need an online audit, PLAN-actions-sha-pinned).
  - step: 5
    phase: pre-deploy
    action: "Diff shape -- every changed line in .github/workflows is a uses: line whose floating @vN becomes @<40-hex> # vN.x.y with the same action and major, and the touched workflow set equals the rec-5288 file list."
    command: >-
      bin/venv-python -c "import re,subprocess,yaml; d=subprocess.run(['git','diff','-U0','origin/main...HEAD','--','.github/workflows'],capture_output=True,text=True,check=True).stdout;
      m=re.findall(r'^-(\s*(?:-\s+)?uses:\s*)([\w./-]+)@v(\d+)\s*$\n^\+\1\2@([0-9a-f]{40}) # v(\d+)\.\d+\.\d+$',d,re.M); rm=[l for l in d.splitlines() if l[:1] in '+-' and l[:3] not in ('+++','---')];
      assert len(rm)==2*len(m), rm[:6]; assert all(a==b for _,_,a,_,b in m), [x for x in m if x[2]!=x[4]]; f=set(re.findall(r'^\+\+\+ b/(\S+)',d,re.M));
      exp={k.split('::')[0] for k in yaml.safe_load(subprocess.run(['git','show','origin/main:config/actions_sha_pin_baseline.yaml'],capture_output=True,text=True,check=True).stdout)['drains']['rec-5288']}; assert f==exp, f^exp; print('DIFF_SHAPE_OK', len(m), len(f))"
    expected: Prints DIFF_SHAPE_OK 149 25 (counts on the 2026-11-17 base; the rebased base may differ, and the count must equal the base's rec-5288 total).
    fix_if: "An unpaired line means a non-uses edit or two adjacent changed lines; keep edits to uses: lines only, and if adjacency defeats the pairing, compare per hunk rather than editing more lines."
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim (Decision 244 cl.4): the diff shape holds for this PR only.
  - step: 6
    phase: pre-deploy
    action: Fast tier on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Any failing check; fix the cause. On the 2026-11-17 probe only the two tests this plan adjusts failed, and selection stayed within budget (94 modules, CI-predicted 143-485s).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Diff-aware against origin/main, so it depends on this branch's transient state; the PR's own pr-validate runs the
      same tier authoritatively (Decision 73), and a validate run can never be a graduated record.
  - step: 7
    phase: pre-deploy
    action: Full tier on the ready head (background, 2 h limit) and its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: verify-head reports ok for HEAD.
    fix_if: Any failure; fix and re-run from the start (handoff_policy).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: rec-5288 closed by the Resolves trailer; rec-5289 and rec-5290 stay open.
    command: >-
      bin/venv-python -c "import src.common.ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(),['rec-5288','rec-5289','rec-5290']); print({x['id']: x['status'] for x in r})"
    expected: rec-5288 closed; rec-5289 and rec-5290 open.
    fix_if: rec-5288 still open after ci.yml's closure job; close it through scripts.ops_data_portal --update-rec with the merge SHA as closure evidence.
    hermetic: false
