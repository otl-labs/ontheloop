slug: "actions-sha-pin-non-codeowners"
intent: >-
  Plan 2 of 4 for rec-5020: pin every floating remote uses: reference in the 25 workflow files no .github/CODEOWNERS
  pattern covers to the commit its tag resolves to at build time, with an exact release comment, and drain the
  rec-5288 bucket of config/actions_sha_pin_baseline.yaml. Third-party code in those secret-bearing and OIDC-holding
  jobs then changes only through a visible pull request gated by required checks (NS.9), never by a silent tag move,
  and no workflow runs different code than it runs today.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-actions-sha-pin-non-codeowners.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Itinerary item H1, follow-on plan 2 of PLAN-actions-sha-pinned. No Lambda-packaged file and no .tf file is in scope,
  so V2; closes no criterion.
