      steps[-1]["uses"]) with `import re` added: the same action, now required to be SHA-pinned, and immune to Dependabot bumps. No other line changes.
  - file: tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py
    action: Modify
    purpose: >-
      TestAcceptanceGateAssertions::test_evaluator_job_fails_when_it_gains_id_token mutates ci.yml by str.replace on an
      anchor that includes the line `- uses: actions/checkout@v7`; after the pin the anchor no longer matches, the
      mutation is a no-op and the red limb fails. The anchor becomes ref-independent: re.subn with the checkout value
      matched as actions/checkout@\S+[^\n]*, re-emitting the matched lines through group backreferences (no ref literal is
      typed), with an added assert that exactly one substitution happened. The failure
      assertion ("not credential-free") is unchanged. No other test in the file changes.
