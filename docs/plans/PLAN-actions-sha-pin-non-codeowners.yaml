rollback: >-
  Routine remedy for a misbehaving action: a forward PR that re-pins the affected uses: line(s) to a known-good commit
  with its exact release comment (still pinned, check green). A whole revert of the build re-adds the 74 rec-5288
  baseline keys, which validate_actions_sha_pinned's no-raise leg refuses (the baseline only shrinks), and re-adding
  grandfathered entries is a loosening Decision 235 cl.1 gates on the operator; so a full revert needs the operator's
  approval and his merge past the red check. Runtime behaviour is the same either way, since each pin is the commit its
  tag pointed to.
