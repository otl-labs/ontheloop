schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "actions-sha-pinned"
intent: >-
  Plan 1 of 4 for rec-5020: a registered fast-tier check refuses any remote uses: reference in .github/workflows or
  .github/actions that is not pinned to a 40-hex commit SHA with a trailing version comment (a docker:// reference needs
  a sha256 digest). Today's floating references are grandfathered in a baseline that may only shrink, and the
  github-actions Dependabot ecosystem gets a 7-day cooldown that a test enforces. Third-party code that runs in
  secret-bearing and OIDC-holding jobs then changes only through a pull request that the repository's gates check (NS.9).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-actions-sha-pinned.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Itinerary item H1 of the verdict-personas-on-Actions itinerary. Contributes repo-wide to the verdict chain's SHA-pinned-actions
  clause (see context); closes no criterion. No Lambda-packaged file and no .tf file is in scope,
  so V2.
closes_criteria: []
cites: [dec:100, dec:166, dec:169, dec:170, dec:246, dec:247, dec:248]
scope:
  - file: scripts/checks/ci_guards/validate_actions_sha_pinned.py
    action: Create
    purpose: >-
      Registered check validate_actions_sha_pinned (@registry.register with owner="platform", as its siblings). Walks every *.yml/*.yaml file
      directly under .github/workflows and every action.yml/action.yaml under .github/actions. References: a workflow's
      jobs.<id>.uses (reusable workflow) and jobs.<id>.steps[].uses, and a composite's runs.steps[].uses, read by
      yaml.safe_load. Cross-check: every raw line matching ^\s*(-\s+)?uses:\s* is scanned for its value (quotes
      stripped) and trailing comment, and the multiset of scanned values must equal the multiset of parsed values per
      file, else the file fails closed ("uses: form the line scan cannot read"). A value starting ./ is exempt. A
      docker:// value must end @sha256:<64 lowercase hex>. Any other value must end @<40 lowercase hex> and its line
      must carry a trailing comment matching #\s*v?\d+(\.\d+){0,2}\S*\s*$ (a version comment; Dependabot rewrites a
      comment holding the replaced version). Each violation is keyed "<repo-relative path>::<value>". Ratchet against
      config/actions_sha_pin_baseline.yaml: the live count of every key must equal its baseline count (an unlisted
      violation, a count above the baseline and a stale or over-counted entry all fail, each message naming the fix:
      pin the reference, or lower or delete the baseline line). No-raise leg (validate_known_red_shrinks precedent):
      the baseline at the merge base of HEAD and origin/main, read with git show <base>:<path>; when merge-base fails the
      fallback is a direct git show origin/main:<path> (no rev-parse probe), so at most two git calls run; a key absent at
      the base or a count above the base count fails; when no base ref resolves or the baseline is absent at the base
      (the introducing change) the no-raise leg is skipped with a printed SKIP line, never a registry.skipped
      declaration, because the HEAD equality ratchet still enforces; the reason also goes into the final PASS line so a
      shallow checkout shows in the run's summary. The last declaration on every reachable exit is
      registry.examined(n, unit="uses_references") (registry.py keeps one last-call-wins slot). End states the drain
      plans create: a missing, null or empty drains mapping, a null or empty bucket, and a baseline file absent at HEAD
      all mean an empty baseline (every live violation then fails); a baseline that is not a mapping, a bucket key not
      matching ^rec-\d+$, a key not shaped <path>::<value>, or a count that is not a positive int fails closed, at HEAD or
      at the base. Docstring: the check proves form only; a SHA that exists only in a fork network (an imposter commit) needs
      an online audit and is out of scope. A key listed under both drain recs fails (each key has one owner). Every ratchet failure message also says that a
      Dependabot bump of a baselined floating ref changes its key, so that PR pins the reference instead (the
      coordinator routes such a red Dependabot PR to the planner of whichever of rec-5288 or rec-5289 owns the key). No network;
      at most two git subprocess calls.
  - file: config/actions_sha_pin_baseline.yaml
    action: Create
    purpose: >-
      Shrink-only baseline. A header comment names the check, rec-5020 and the rule (entries only shrink; plans 2 and 3
      drain them). Body: a top-level mapping `drains:` whose keys are the draining rec ids (rec-5288 for files no
      .github/CODEOWNERS pattern covers, rec-5289 for files one does) and whose values are flat mappings
      "<path>::<value>": <count>, one line per key, sorted. Seeded by the build from the live tree on its rebased base
      by a module-level helper in the check, render_baseline(root) -> str, which runs the check's own scan and partitions
      keys by .github/CODEOWNERS (fnmatch on each pattern; a trailing-slash pattern matches its directory prefix). The
      check function itself never calls render_baseline or reads CODEOWNERS. The rendered text is written as the file,
      never typed by hand, so it holds exactly the violations present then; a test covers render_baseline on a tmp_path
      tree.
  - file: tests/checks/ci_guards/test_validate_actions_sha_pinned.py
    action: Create
    purpose: >-
      Mirror test on tmp_path trees (monkeypatch _common.ROOT as the sibling masking test does). Red cases, each its own
      test: test_refuses_tag_pinned_uses_reference (actions/checkout@v7 with no baseline), a branch ref, a 39-hex ref, a
      pinned ref with no comment, a pinned ref with a non-version comment, a docker:// tag, a job-level reusable-workflow
      tag ref, a composite action step, a flow-style step the line scan cannot read, an unlisted key beside a baselined
      one, a count above the baseline, a stale entry, a key listed under both drain recs, a key added relative to a base baseline and a count raised
      relative to it, a malformed baseline (not a mapping, a bad bucket key, a bad entry key, a zero or non-int count) at HEAD and at the
      base, merge-base failing while the direct origin/main fallback succeeds, the baseline absent at a resolvable base
      (SKIP line),
      and a baseline file absent at HEAD while live violations exist (base read through a git fixture repo in tmp_path). Green cases: ./ local refs, a 40-hex pin with
      `# v7`, `# v7.0.1` and `# 7.1.0`, a docker sha256 digest, an exactly matching baseline, empty end states (drains: {}, a
      null bucket, no drains key) with a clean tree, and a no-base run that prints the SKIP line and whose
      registry.pop_declaration() kind is examined. A TestAccountingDeclaration class mirrors
      test_validate_dependabot_config.py's: every exit path declares examined. Plus
      test_real_tree_passes (the shipped tree and baseline pass) and the ci_rca_taxonomy row lookup the sibling tests
      make.
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      One Entry(name="validate_actions_sha_pinned", module="scripts.checks.ci_guards.validate_actions_sha_pinned",
      attr="validate_actions_sha_pinned", pre=True, pre_globs=(".github/workflows/**", ".github/actions/**",
      "config/actions_sha_pin_baseline.yaml",
      "scripts/checks/ci_guards/validate_actions_sha_pinned.py", "scripts/checks/_common.py",
      "scripts/checks/registry.py"), full_segment="full_after_lint"), placed after validate_actions_account_id_masking.
      Bare string literals only (Decision 169). The check function never reads .github/CODEOWNERS; only
      render_baseline and VP 4 do.
  - file: tests/checks/ci_guards/test__manifest.py
    action: Modify
    purpose: >-
      test_actions_sha_pinned_entry_closes_over_its_inputs: the entry is pre=True and its pre_globs hold the six
      inputs above (red before: no entry).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      function_to_category gains validate_actions_sha_pinned: code_regression, beside validate_actions_account_id_masking.
      NEAR_CAP (492 of 500 effective lines at 73eef560 per plan_obligations; re-measure on the rebased base): if the row would take the file past 500 effective lines on the
      build's rebased base, fold one block-style workflows: entry (CI, Main Canary, CodeQL or rec-autoclose) into a
      single flow-style line with identical keys and values, the #2120 precedent; never drop a key or a word.
  - file: .github/dependabot.yml
    action: Modify
    purpose: >-
      The package-ecosystem github-actions entry gains `cooldown:` with `default-days: 7` (operator card 2026-11-17).
      The pip entry and its Decision 99 exclude-patterns block stay byte-identical.
  - file: scripts/checks/ci_guards/validate_dependabot_config.py
    action: Modify
    purpose: >-
      Second assertion, the cooldown leg, run only when updates is a list (a non-list updates value keeps today's
      behaviour: zero pip groups examined and no failure, since Dependabot itself rejects such a file). The leg fails
      when the list holds no entry whose package-ecosystem is github-actions, and fails each such entry whose
      cooldown.default-days is missing, not an int, or below 7. It reports its own PASS/FAIL line with prefix and fix.
      It cannot pass vacuously (absence fails), so the existing registry.examined(n, unit="dependabot_pip_groups")
      call, unit and count stay unchanged. The docstring gains a paragraph naming this leg, rec-5020 and why it lives
      here (the one Dependabot-config gate); the pip-group scoping paragraph is unchanged.
  - file: tests/checks/ci_guards/test_validate_dependabot_config.py
    action: Modify
    purpose: >-
      _VALID_CONFIG's github-actions entry gains the cooldown block. The inline config of
      test_pip_update_with_no_groups_key_is_skipped_not_examined gains a github-actions entry with the cooldown block
      (its assertion and docstring point unchanged); test_group_with_no_exclude_patterns_key_at_all_fails needs no edit
      (it asserts a specific failure is present); test_updates_key_not_a_list_yields_no_pip_updates is unchanged and
      still passes (the leg runs only on a list). New tests: test_github_actions_without_cooldown_fails,
      test_github_actions_cooldown_below_seven_days_fails, test_github_actions_cooldown_not_an_int_fails,
      test_config_without_github_actions_entry_fails and test_github_actions_cooldown_seven_days_passes. No existing
      assertion is changed or loosened.
bundled_recommendations: [rec-5020]
followon_recs: [rec-5288, rec-5289, rec-5290]
infrastructure_dependencies: []
acceptance_criteria:
  - "validate_actions_sha_pinned refuses a tag-pinned, branch-pinned or short-SHA remote uses: reference, a pinned reference without a version comment, and a docker:// reference without a sha256 digest, in workflow steps, job-level reusable-workflow calls and composite steps; ./ references pass."
  - "The baseline only shrinks: an unlisted violation, a count above the baseline, a stale entry, and a key or count added relative to the base all fail."
  - "The shipped tree passes with a baseline generated from it, and the check runs in --pre on any change under .github/workflows/**, .github/actions/** or the baseline."
  - ".github/dependabot.yml's github-actions entry carries cooldown default-days 7; validate_dependabot_config fails a list of updates with no github-actions entry, or one whose cooldown.default-days is missing, not an int or below 7."
  - "No file under .github/workflows or .github/actions changes."
  - "rec-5020 is closed through the squash commit's Resolves trailer, with rec-5288, rec-5289 and rec-5290 open to drain the baseline and turn on GitHub's native SHA-pinning policy."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The named red case for rec-5020's acceptance.
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_actions_sha_pinned.py::test_refuses_tag_pinned_uses_reference -q
    expected: One test passes.
    expected_literals: [1 passed]
    fix_if: The node is missing or fails; fix the check, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: actions-sha-pinned-refuses-tag
  - step: 2
    phase: pre-deploy
    action: Every red and green case of the new check, the dependabot cooldown tests and the manifest closure test.
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test_validate_actions_sha_pinned.py
      tests/checks/ci_guards/test_validate_dependabot_config.py tests/checks/ci_guards/test__manifest.py -q
    expected: All tests pass.
    fix_if: Any failure; fix the module or config, never loosen a test (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of test files this plan creates or modifies; the fast tier's pytest_diff selects them on every
      PR that touches them, so a standing copy adds no independence.
  - step: 3
    phase: pre-deploy
    action: The live tree passes both checks.
    command: >-
      bin/venv-python -c "from scripts.checks.ci_guards.validate_actions_sha_pinned import validate_actions_sha_pinned as v; f=[]; v(f); print('FAILED', f) if f else print('SHA_PIN_OK')"
      && bin/venv-python -c "from scripts.checks.ci_guards.validate_dependabot_config import validate_dependabot_config as v; f=[]; v(f); print('FAILED', f) if f else print('DEPENDABOT_OK')"
    expected: Prints both ok markers.
    expected_literals: [SHA_PIN_OK, DEPENDABOT_OK]
    fix_if: A violation on the live tree means the baseline was not regenerated on the rebased base; regenerate it, never hand-edit a count upward.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the registered fast-tier checks validate_actions_sha_pinned and validate_dependabot_config, which run
      on every PR touching their inputs.
  - step: 4
    phase: pre-deploy
    action: Baseline drains exactly the floating references, partitioned by CODEOWNERS, and no workflow or action file changed.
    command: >-
      bin/venv-python -c "import yaml,fnmatch,re,subprocess; b=yaml.safe_load(open('config/actions_sha_pin_baseline.yaml'))['drains'];
      assert set(b)=={'rec-5288','rec-5289'}, set(b); pats=[l.split()[0].lstrip('/') for l in open('.github/CODEOWNERS') if l.strip() and not l.startswith('#')];
      own=lambda p: any(fnmatch.fnmatch(p,x) or p.startswith(x.rstrip('*')) and x.endswith('/') for x in pats);
      assert all(own(k.split('::')[0]) for k in b['rec-5289']) and not any(own(k.split('::')[0]) for k in b['rec-5288']);
      n=sum(sum(v.values()) for v in b.values());
      d=subprocess.run(['git','diff','--name-only','origin/main...HEAD','--','.github/workflows','.github/actions'],capture_output=True,text=True).stdout.strip();
      assert not d, d; print('BASELINE_OK', n)"
    expected: Prints the BASELINE_OK marker and the total grandfathered count (194 on main at 97915110; the build's rebased base may differ).
    fix_if: A key under the wrong rec, a missing drain key, or a workflow/action diff; fix the generator or revert the workflow edit.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim (Decision 244 cl.4): the partition and the empty workflow diff hold for this PR only; plans 2 and 3
      change both by design.
  - step: 5
    phase: pre-deploy
    action: A floating reference added to a real workflow is refused (scratch worktree of HEAD, never committed).
    command: >-
      M="$PWD"; W=/tmp/sha-pin-probe; rm -rf "$W"; git worktree add -q --detach "$W" HEAD &&
      sed -i '0,/uses: actions\/checkout@[0-9a-f]\{40\}/s//uses: actions\/checkout@v7/' "$W/.github/workflows/persona-verdict.yml" &&
      (cd "$W" && "$M/bin/venv-python" -c "from scripts.checks import _common; from scripts.checks.ci_guards.validate_actions_sha_pinned import validate_actions_sha_pinned as v; assert str(_common.ROOT).startswith('/tmp/sha-pin-probe'), _common.ROOT; f=[]; v(f); print('PROBE_REFUSED' if f else 'PROBE_MISSED'); raise SystemExit(0 if f else 1)");
      rc=$?; git worktree remove --force "$W"; exit $rc
    expected: Prints PROBE_REFUSED and exits 0; PROBE_MISSED or any error exits non-zero.
    fix_if: PROBE_MISSED means the ratchet misses a new key in a file with no baseline entry; fix the check. An assertion error on ROOT means the probe imported the main checkout; fix the command, never the check.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Fast tier on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Any failing check; fix the cause.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Full tier on the ready head (background, 2 h limit, HOME an empty directory for tests/test_aws_profile.py) and its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: verify-head reports ok for HEAD.
    fix_if: Any failure; fix and re-run from the start (handoff_policy).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: rec-5020 closed by the Resolves trailer; the three follow-on recs stay open.
    command: >-
      bin/venv-python -c "import src.common.ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(),['rec-5020','rec-5288','rec-5289','rec-5290']); print({x['id']: x['status'] for x in r})"
    expected: rec-5020 closed; rec-5288, rec-5289 and rec-5290 open.
    fix_if: rec-5020 still open after ci.yml's closure job; close it through scripts.ops_data_portal --update-rec with the merge SHA as closure evidence.
    hermetic: false
  - step: 9
    phase: post-deploy
    action: Dependabot accepts the cooldown key (its next github_actions update run after the merge concludes success).
    command: >-
      curl -sS "https://api.github.com/repos/otl-labs/ontheloop/actions/runs?event=dynamic&per_page=10" | bin/venv-python -c
      "import json,sys; r=[x for x in json.load(sys.stdin)['workflow_runs'] if x['name'].startswith('github_actions')]; print([(x['created_at'], x['conclusion']) for x in r[:3]])"
    expected: The newest github_actions run created after the merge has conclusion success.
    fix_if: A failure or a config error; read the run log, fix the key in a follow-up PR through this plan's owner.
    hermetic: false
test_obligations:
  - source: scripts/checks/ci_guards/validate_actions_sha_pinned.py
    behavior: refuses tag, branch and short-SHA refs, missing version comments and undigested docker refs in every uses form, and holds the shrink-only baseline
    verification_step: 1
    test_selector: tests/checks/ci_guards/test_validate_actions_sha_pinned.py::test_refuses_tag_pinned_uses_reference
    red_green_expectation: red before (module and test absent), green after
  - source: config/actions_sha_pin_baseline.yaml
    behavior: the shipped tree's violations equal the baseline exactly, partitioned by draining rec
    verification_step: 3
    command: bin/venv-python -c "from scripts.checks.ci_guards.validate_actions_sha_pinned import validate_actions_sha_pinned as v; f=[]; v(f); print('FAILED', f) if f else print('SHA_PIN_OK')"
    red_green_expectation: red before (check and baseline absent), green after
  - source: scripts/checks/ci_guards/_manifest.py
    behavior: the entry is registered pre=True and closes over its inputs
    verification_step: 2
    test_selector: tests/checks/ci_guards/test__manifest.py::TestGatedEntryInputClosures::test_actions_sha_pinned_entry_closes_over_its_inputs
    red_green_expectation: red before (no entry), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: the new check has a ci-rca category
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_validate_actions_sha_pinned.py
    red_green_expectation: red before (no row), green after
  - source: .github/dependabot.yml
    behavior: the github-actions ecosystem carries a cooldown of at least 7 days
    verification_step: 3
    command: bin/venv-python -c "from scripts.checks.ci_guards.validate_dependabot_config import validate_dependabot_config as v; f=[]; v(f); print('FAILED', f) if f else print('DEPENDABOT_OK')"
    red_green_expectation: red before (no cooldown, so the new assertion fails), green after
  - source: scripts/checks/ci_guards/validate_dependabot_config.py
    behavior: fails a github-actions entry without cooldown.default-days >= 7
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_validate_dependabot_config.py
    red_green_expectation: red before (four of the five new tests fail on the old module; the seven-days pass case is green either way), green after
constraints:
  - "No file under .github/workflows or .github/actions is edited; the conversions are rec-5288 and rec-5289, each planned and signed off on its own (Decision 247 cl.3)."
  - "The baseline is generated from the live tree on the rebased base, never hand-typed, and never gains a key or a higher count; there is no raise marker or raise path."
  - "The check reads no network and runs at most two git subprocesses (Decision 208 fast-tier cost)."
  - "The pip entry of .github/dependabot.yml and its exclude-patterns stay byte-identical (Decision 99)."
  - "The three narrower pin regexes (validate_trusted_plan_environment, validate_github_settings_apply, validate_persona_verdict_chain) are not edited here; rec-5289 unifies them."
  - "Merge authority: Decision 246 cl.4 keeps the operator's final-diff word for security code, and this check is security code, so the build asks for it before merging unless the operator's standing ruling at build time explicitly classes this build otherwise (the coordinator states which when it starts the build). Dependabot auto-merge of action bumps outside CODEOWNERS paths is unchanged (CI plus the cooldown gate them)."
  - No rescue agents or workaround loops (Decision 55); never skip or loosen a test to get green (Decision 235).
context:
  - "Decision-scout verdict + CITE list: round 4 on the written plan NO_FLAGS (Decisions triaged: 218 of 218; Roadmap items intersected: 4; CONFLICT: 0; RELATED: 4; Serves: NS.9 3/5); round 3 NO_FLAGS. CITE: dec:100, dec:166, dec:169, dec:170, dec:246, dec:247, dec:248; no CONTRADICT. Round 2 on the draft NO_FLAGS. Round 1 FLAGS_FOUND: Decision 100 [WARN] (GitHub's native require-SHA-pinning Actions policy is the managed primitive); answered by rec-5290, which turns it on through terraform/github after rec-5288 and rec-5289 empty the baseline (turning it on first fails every floating reference). The repo check stays for the PR-time signal, the version comment and the docker digest."
  - "Split and design settled on a blind Fable consult: /mnt/project-files/actions-sha-pinned/advisor-brief/ADVICE.md (check plus shrink-only baseline first, conversions after; pin to each tag's current commit; YAML parse plus a fail-closed line scan; imposter commits out of scope). Adapted: two conversion plans (CODEOWNERS or not; 25 files and 6 files on today's tree, tf-gated-apply-prototype.yml included per #1917) rather than one per owning project, since the only real separation is the operator's final-diff word on CODEOWNERS paths (Decision 246 cl.4). Presentation: /mnt/project-files/actions-sha-pinned/PRESENTATION.md; operator 'write the plan' 2026-11-17 15:01 UTC."
  - "Changed from the presentation, settled with notice: the comment rule accepts any version-shaped comment (# v7, # v7.0.1), not only exact X.Y.Z. Merged-but-unbuilt PLAN-persona-verdict-wake, -override and -image-twin copy the existing `# v7` checkout comment into new lines, so an exact-only rule would turn their builds red; Dependabot rewrites either form."
  - "Counts on main at 97915110 (one-time evidence, Decision 244 cl.4): 40 workflow files, 318 uses: lines, 78 local, 194 floating in 31 files across 12 action@ref pairs, 46 pinned; no composite under .github/actions has a remote uses:; no docker:// or cross-repository reusable-workflow reference."
  - "Probe 2026-11-17: git ls-remote through the session proxy resolved all 12 floating refs to commits (e.g. checkout v7 = v7.0.1 = 3d3c42e5); the conversion plans rely on it. Dependabot cooldown: schemastore dependabot-2.0 and the GitHub options reference list cooldown.default-days as supported for GitHub Actions (semver-*-days not). The public runs API lists Dependabot's github_actions runs (VP 9 command, probed 2026-11-17)."
  - "Dependabot minor/patch auto-merge is armed for every ecosystem (scripts/ci/dependabot_auto_merge.sh:46-47), hence the cooldown (operator card 2026-11-17). Directory / scans .github/workflows only; .github/actions/* has no remote uses today, so directories is not added (rec-5288's brief says to add it if a composite gains one)."
  - "Overlap: no open PR touches the scope files. plan_obligations: config/ci_rca_taxonomy.yaml NEAR_CAP (492/500 at 73eef560) and scoped by about a dozen unbuilt plans; _manifest.py scoped by PLAN-bootstrap-ci-gated-apply, -environment-gates-fail-closed, -persona-verdict-chain (built #2120), -telemetry-content-reader-lock, -telemetry-producer-admission-plan-review-capture, -trusted-plan-cutover, -trusted-plan-identity, -persona-image-twin (which also scopes test__manifest.py, the taxonomy and .github/dependabot.yml, adding pip and docker entries only); whichever builds second rebases. After this merges, any build that adds a floating uses: line or a pinned one without a version comment goes red and must pin it (posted on coordinator log issue #1963)."
  - "Dependabot PR #1930 (setup-python 7.0.0 to 7.1.0) is open; if it merges before this build, the build's regenerated baseline simply reflects it."
