  action: Modify
  purpose: >-
    Item 12c gains one sentence pointing at the rule (verbatim in execution_steps), so a critic judges the gate step's
    declared expected outcome -- the coverage the contract's enforcement field names. +104 bytes against exactly 104 of
    headroom; no budget edit.
- file: scripts/checks/verification/validate_admin_root_premerge_gate.py
  action: Create
  purpose: >-
    @registry.register("validate_admin_root_premerge_gate", owner="platform") def validate_admin_root_premerge_gate(failed,
    plan_paths=None, taxonomy_path=None) -> None. Roots: read docs/contracts/environment-taxonomy.yaml (yaml.safe_load),
    take every value of the axis_a mapping that is itself a mapping (axis_a is keyed by environment and also holds string notes) whose apply_gating string starts with "admin-only", and extract the root with the
    regex terraform/[A-Za-z0-9_-]+ from its code_vs_infra string (today: terraform/bootstrap). Root derivation runs
    UNCONDITIONALLY, before plan discovery (the validate_plan_scope_closure grammar-leg pattern), so a taxonomy-only
    diff is examined too. Fail CLOSED: an unreadable taxonomy or zero derived roots is a finding, never a pass. Plans: plan_paths when given (unfiltered, the
    validate_plan_scope_closure convention for fixture callers), else
    scripts.roadmap.plan_obligations.net_new_v4_implementation_plan_paths() (git status A only; never a docs/plans glob).
    A plan is in scope when any scope[].file starts with root + "/" and does not end in ".md" (module constant
    EXEMPT_SUFFIXES = (".md",); fail-closed: any other file under the root triggers, because Terraform can load any file
    via file()/templatefile()). An in-scope plan must carry all
    three, each a separate finding naming the plan file, the clause label and
    "docs/contracts/deploy-paths.yaml admin_out_of_band.pre_merge_live_plan": (1) PRE-MERGE GATE (ADMIN) -- a
    verification_plan step with phase pre-deploy whose command contains "terraform", " plan", "-lock=false", the root
    string and "PR_HEAD_SHA"; (2) ENVIRONMENT CHECK -- a pre-deploy step whose command contains "get-caller-identity"
    and "ADMIN_CHAIN_OK"; (3) V3 RESOLUTION -- a context entry (string) whose stripped text starts with
    "V3 resolution:". Module constants: GATE_MARKERS = ("terraform", " plan", "-lock=false", "PR_HEAD_SHA") (plus the
    derived root), ENV_MARKERS = ("get-caller-identity", "ADMIN_CHAIN_OK"), V3_PREFIX = "V3 resolution:". An unparseable plan passed via plan_paths is one finding (on real dispatch net_new_v4_implementation_plan_paths drops it and validate_plan_documents reports it). Prints PASS/FAIL
    lines like its siblings and declares registry.examined(...) on every reachable exit (Decision 170). Module stays
    well under 500 SLOC.
- file: scripts/checks/verification/_manifest.py
  action: Modify
  purpose: >-
    Register the check: Entry(name="validate_admin_root_premerge_gate",
    module="scripts.checks.verification.validate_admin_root_premerge_gate", attr="validate_admin_root_premerge_gate",
    pre=True, pre_globs=("docs/plans/**", "docs/contracts/environment-taxonomy.yaml",
    "scripts/checks/verification/**", "scripts/roadmap/plan_obligations.py", "scripts/checks/_common.py",
    "scripts/checks/registry.py"), full_segment="full_after_lint").
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: Add the row validate_admin_root_premerge_gate schema_drift beside validate_plan_scope_closure.
- file: tests/checks/verification/test_validate_admin_root_premerge_gate.py
  action: Create
  purpose: >-
    rec-4140's acceptance file. Hermetic fixtures (tmp_path plan YAML + a tmp taxonomy) driving the check through
