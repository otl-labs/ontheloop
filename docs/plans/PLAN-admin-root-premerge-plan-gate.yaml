verification_plan:
- step: 1
  phase: pre-deploy
  action: The validator and its fixtures -- every clause flagged separately, compliant plan passes, fail-closed on the taxonomy, drift pin against the contract
  command: bin/venv-python -m pytest tests/checks/verification/test_validate_admin_root_premerge_gate.py -q
  expected: all tests pass; before the change the file and module do not exist (red)
  fix_if: a red case passes silently or the drift pin fails -- fix the check or the constant, never the contract text (approved verbatim)
  hermetic: false
  graduation: graduate
  graduation_check_id: admin-root-premerge-gate-validator-tests
- step: 2
  phase: pre-deploy
  action: The contract key, its amendment_log entry and the four skill pointers
  command: bin/venv-python -m pytest "tests/test_deploy_paths_admin_procedure.py::TestPreMergeLivePlan" -q
  expected: every test in the class passes; before the change the class does not exist (exit 4, red). The pre-existing PRE-APPLY test runs in steps 6 and 7
  fix_if: a pointer or key is missing or misnamed -- restore the approved text
  hermetic: true
  graduation: graduate
  graduation_check_id: deploy-paths-pre-merge-live-plan-pointers
- step: 3
  phase: pre-deploy
  action: Real input -- the check against a merged admin-root plan that carries the gate but predates the other two clauses
  command: |-
    bin/venv-python -c "from pathlib import Path; from scripts.checks.verification.validate_admin_root_premerge_gate import validate_admin_root_premerge_gate as v; f=[]; v(f, plan_paths=[Path('docs/plans/PLAN-heartbeat-canary-plan-time-grant.yaml')]); labels=sorted(l for l in ('PRE-MERGE GATE (ADMIN)','ENVIRONMENT CHECK','V3 RESOLUTION') if any(l in x for x in f)); print('FINDINGS', len(f), labels); assert labels==['ENVIRONMENT CHECK','V3 RESOLUTION'] and len(f)==2, f"
  expected: exactly two findings, labelled ENVIRONMENT CHECK and V3 RESOLUTION; no PRE-MERGE GATE finding, proving the gate detector matches a real gate command
  fix_if: a PRE-MERGE GATE finding appears -- the marker match is too strict for the real command shape; loosen the match, not the plan
  hermetic: true
  expected_literals:
  - "FINDINGS 2 ['ENVIRONMENT CHECK', 'V3 RESOLUTION']"
  graduation: waive
  graduation_waiver_reason: Step 1's fixture modelled on the same plan's step 10 command shape carries this regression permanently; the merged plan file is a historical input, not a fixture.
- step: 4
  phase: pre-deploy
  action: Prose budgets and the contract gate hold with no budget edit
  command: |-
    bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as a; from scripts.checks.prose.prose_budget_raises import validate_prose_budget_raises as b; from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as c; f=[]; a(f); b(f); c(f); print('GATE FAILURES', len(f)); assert not f, f" && git diff --quiet origin/main -- config/prose_budgets.yaml && echo "PROSE BUDGETS UNCHANGED"
  expected: zero failures from the three checks and config/prose_budgets.yaml unchanged
  fix_if: a skill exceeds its budget -- trim within the approved variance (none) by asking the planner; never raise the budget
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Re-runs three already-registered fast-tier checks plus a branch-relative diff; the checks themselves are the standing guard.
- step: 5
  phase: pre-deploy
  action: Approved contract key landed verbatim -- the APPROVED_KEY block parsed from this plan equals the landed key
  command: |-
    bin/venv-python -c "import yaml,textwrap; p=yaml.safe_load(open('docs/plans/PLAN-admin-root-premerge-plan-gate.yaml')); t=p['execution_steps'][0]; blk=t.split('APPROVED_KEY:\n',1)[1].split('\nThen prepend',1)[0]; want=yaml.safe_load(textwrap.dedent(blk))['pre_merge_live_plan']; got=yaml.safe_load(open('docs/contracts/deploy-paths.yaml'))['admin_out_of_band']['pre_merge_live_plan']; assert got==want, 'contract key differs from the approved text'; assert 'validate_admin_root_premerge_gate' in got['enforcement']; print('APPROVED KEY VERBATIM')"
  expected: APPROVED KEY VERBATIM printed, exit 0
  fix_if: any difference -- restore the approved text; a needed wording change goes back to Benjamin
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Binds to this plan's historical APPROVED_KEY text and a contract key that future amendment_log entries may legitimately change; step 2 graduates the key's structural shape.
- step: 6
  phase: pre-deploy
  action: Fast tier
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0, validate_admin_root_premerge_gate listed and PASS (this plan touches no admin-only root)
  fix_if: any failure -- fix on the branch
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole fast-tier run over diff-relative state; graduate steps may not invoke scripts.validate (recursion), and steps 1-2 carry the durable regressions.
- step: 7
  phase: pre-deploy
  action: Full tier, then HEAD attestation, before commit and push (handoff_policy)
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: the full tier exits 0 and the validation result attests the current HEAD's tree
  fix_if: any failure -- fix and rerun the full tier from the start; never push on a partial or timed-out run
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The full tier cannot graduate (recursion refusal) and depends on the whole tree at HEAD; it is the handoff gate, not a regression check.
- step: 8
  phase: post-deploy
  action: Closure -- rec-4140 closed by the squash merge
  command: |-
    AWS_PROFILE=agent_platform bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;r=f('rec-4140');assert r and r['status']=='closed',(r or {}).get('status');print('REC_4140_CLOSED')"
  expected: Exit 0 and REC_4140_CLOSED printed, after the ci.yml closure job runs on the squash merge carrying the Resolves trailer for rec-4140
  fix_if: still open -- check the closure job log; the acceptance pytest must pass at main
  hermetic: false
  graduation: not-applicable
