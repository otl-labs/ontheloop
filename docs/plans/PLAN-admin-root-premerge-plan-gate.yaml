  purpose: >-
    Graduation record for VP step 2: primitive_slot test_selector, guard_target docs/contracts/deploy-paths.yaml,
    guard_symbol null, plan_slug admin-root-premerge-plan-gate, graduated_at the implementation date, graduated_by
