schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: admin-root-premerge-plan-gate
intent: >-
  Make the #1323 practice a standing rule so an admin-only Terraform root never first touches AWS after merge (the #1316
  incident): any plan whose scope touches a root whose environment-taxonomy apply_gating is admin-only carries a
  pre-merge read-only ADMIN terraform plan step at the CI-green PR head, an implementing-session credential check before
  any post-merge hand-off, and an explicit V3 resolution in its context. The rule lives in deploy-paths.yaml
  (admin_out_of_band.pre_merge_live_plan), the planning, implement and code-review skills point at it, and a fast-tier
  validator enforces its three clauses structurally on net-new plans. Closes rec-4140.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-admin-root-premerge-plan-gate.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- resolves rec-4140 (High). No tier_item criterion claimed. Adjacent:
  T2.54 (clause-to-check traceability, not_started) -- the new contract key names its enforcing check in an
  `enforcement` field, so T2.54 can trace it later.
