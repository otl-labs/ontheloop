    PLAN-heartbeat-canary-plan-time-grant step 10's shape) yields no finding; a plan touching only terraform/personal
    yields none; a plan touching only terraform/bootstrap/CLAUDE.md yields none. A plan touching only
    terraform/bootstrap/authority_budget.json or terraform/bootstrap/.terraform.lock.hcl is in scope. Red, one finding each with the right clause label: no pre-deploy gate step; the gate step tagged
    post-deploy; gate command missing -lock=false; gate command missing PR_HEAD_SHA; gate command naming a different root;
    no ENVIRONMENT CHECK step; a pre-deploy step with get-caller-identity but no ADMIN_CHAIN_OK (the precedent's step 11 shape); no "V3 resolution:" context line. Fail-closed: a taxonomy with no admin-only row and an
    unreadable taxonomy each produce a finding, including with plan_paths=[] (no plan in the diff). Real data
    (growth-safe): the real taxonomy's derived roots include "terraform/bootstrap" and every derived root matches
    terraform/[A-Za-z0-9_-]+.
    Drift pin: every literal in GATE_MARKERS, ENV_MARKERS and V3_PREFIX (seven) appears in deploy-paths.yaml's
    pre_merge_live_plan rule text, whitespace-folded.
- file: tests/test_deploy_paths_admin_procedure.py
  action: Modify
  purpose: >-
    Add tests: admin_out_of_band.pre_merge_live_plan exists with description, rule (its first three entries start, in
    order, "PRE-MERGE GATE (ADMIN)", "ENVIRONMENT CHECK", "V3 RESOLUTION", and a counts-only entry naming Decision 101 is
    present; no exact length assertion, per the tests/CLAUDE.md count-coupling rule), enforcement naming validate_admin_root_premerge_gate,
    and precedent; an amendment_log entry naming pre_merge_live_plan is present (presence, never position: later plans
    prepend newer entries); each of the planning, implement,
    code-review and plan-critique SKILL.md files contains "admin_out_of_band.pre_merge_live_plan". All new tests live in
    one class, TestPreMergeLivePlan (VP step 2's selector and the registry entry's node_id). Existing PRE-APPLY test
    unchanged.
- file: config/agent/verification_registry/entries/admin-root-premerge-gate-validator-tests.yaml
  action: Create
  purpose: >-
    Graduation record for VP step 1 (filename == check_id == graduation_check_id, Decision 176): primitive_slot
    test_selector, guard_target scripts/checks/verification/validate_admin_root_premerge_gate.py, guard_symbol
    validate_admin_root_premerge_gate, plan_slug admin-root-premerge-plan-gate, graduated_at the implementation date,
    graduated_by implement-agent, check_spec.node_id tests/checks/verification/test_validate_admin_root_premerge_gate.py.
- file: config/agent/verification_registry/entries/deploy-paths-pre-merge-live-plan-pointers.yaml
