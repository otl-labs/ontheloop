    2026-10-15; text in context, allowed variance: none), and a new first amendment_log entry: date "2026-10-15",
    semantic_break false, change_class field_add, a summary naming the key, PLAN-admin-root-premerge-plan-gate, rec-4140
    and the #1316 -> #1323 incident. No other line of the file changes.
