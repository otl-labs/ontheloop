- validate_admin_root_premerge_gate is registered in the fast tier and flags each missing clause separately on a net-new plan touching terraform/bootstrap, passes a compliant plan, ignores plans not touching an admin-only root or touching only Markdown under it, and fails closed when no admin-only root can be derived.
- Run against the merged PLAN-heartbeat-canary-plan-time-grant.yaml, the check finds its pre-merge gate step and reports exactly the two clauses that plan predates (ENVIRONMENT CHECK, V3 RESOLUTION).
