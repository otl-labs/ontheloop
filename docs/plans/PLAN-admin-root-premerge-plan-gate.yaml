execution_steps:
- |-
  docs/contracts/deploy-paths.yaml -- insert APPROVED_KEY verbatim under admin_out_of_band, directly after the scoped_login_provisioning block and before procedure:. APPROVED_KEY:
    pre_merge_live_plan:
      description: >-
        Standing rule (incident #1316, fixed by #1323) for any plan whose scope changes a non-Markdown
        file under a Terraform root whose environment-taxonomy.yaml axis_a apply_gating is admin-only
        (today terraform/bootstrap); a Markdown-only change is exempt. Static checks never reach a provider, so the root's first live contact
        must happen BEFORE merge. Rule and navigation only: apply-model and guard rules stay in
        environment-taxonomy.yaml.
      rule:
        - >-
          PRE-MERGE GATE (ADMIN): the plan carries a pre-deploy step that runs a read-only `terraform
          plan -lock=false` of the root in a throwaway git worktree at the CI-green $PR_HEAD_SHA, with
