acceptance_criteria:
- deploy-paths.yaml carries admin_out_of_band.pre_merge_live_plan value-identical (parsed) to the approved APPROVED_KEY block, plus a 2026-10-15 field_add amendment_log entry; validate_contract_drift passes.
