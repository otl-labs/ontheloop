slug: "admin-terraform-assets-session-hook"
intent: >-
  Make the ADMIN container's local Terraform provider mirror reliably present by syncing it in an every-session
  SessionStart hook, and make the tfvars an explicit on-demand fetch. bin/setup-cloud-env.sh runs once per environment
  snapshot, before environment variables are set, and the agent proxy never signs setup-script requests, so its
  step-5b mirror sync and tfvars fetch can never authenticate (evidence: /mnt/project-files/credential-proxy/
  admin-setup-fetch/FINDINGS.md). Executes rec-4747.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-admin-terraform-assets-session-hook.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Follow-on to
  PLAN-agent-aws-proxy-credentials (rec-4510) VP 11, whose fix_if routes a setup-time signing failure to a rec.
  Closes no roadmap criterion.
closes_criteria: []
scope:
  - file: bin/sync-terraform-assets.sh
    action: Create
    purpose: >-
      Shared fetch script. Default mode syncs s3://agent-platform-data-lake/tf-provider-mirror/ to $HOME/.terraform-mirror
      with one command on ONE line, `aws s3 sync "s3://agent-platform-data-lake/tf-provider-mirror/" "$MIRROR_DIR"
      --exclude "*" --include "registry.terraform.io/kislerdm/*" --only-show-errors --delete --profile agent_platform`
      before any redirection (the registry grep in setup-cloud-env-mirror-hygiene reads that line). The include filter
      names exactly the namespaces config/terraform/cc-web.tfrc's filesystem_mirror block routes through the mirror
      (today only kislerdm/*: about 6.4 MB per cold sync instead of about 166 MB, since hashicorp/* resolves direct). Then
      it writes RESOLVED_TFRC="$HOME/.terraform-mirror.tfrc" (a sibling file, never inside the mirror dir, rec-2518) from
      config/terraform/cc-web.tfrc only after a successful non-empty sync, and removes any existing one after a failed or
      empty sync (EMPTY_MIRROR, exit 1). `--tfvars` mode runs the unchanged
      .github/actions/materialise-tfvars/materialise_tfvars.sh from the repo root with AWS_PROFILE=agent_platform_admin
      set and GITHUB_ACTIONS unset for that call only (so no ::add-mask:: line can carry a value into the session); it
      never runs in default mode. Each AWS call: two attempts, 3 s apart, each under `timeout 25`; NO_CREDENTIALS and
      NO_REGION are not retried. Output: one line per run, `mirror-sync: OK (<n>s)` or `mirror-sync: WARNING <CLASS>
      (<n>s)` (tfvars: `tfvars-fetch: ...`), plus on failure at most one error line. The class is read from the WHOLE
      captured stderr (and timeout's exit 124 for TIMEOUT). The error line is the first non-empty stderr line that is not
      the delegate's own `materialise-tfvars:` prefix line (that prefix line only when no other line is non-empty),
      SCRUBBED FIRST and only then truncated to 200 chars: sed replaces `arn:` tokens with [ARN] and AKIA/ASIA key ids
      with [KEY_ID], then the line passes through scripts.ci.redaction_check.mask_account_ids (the shared rec-4656
      session-output mask for 12-digit runs and AROA/AIDA unique ids) via bin/venv-python; when that import fails the
      line is withheld (`detail withheld: mask unavailable`) and only the class prints (fail closed; no second 12-digit
      mask). The same lines overwrite $HOME/.terraform-mirror.log (tfvars mode writes no log). Classes: NO_CREDENTIALS,
      NO_REGION, INVALID_TOKEN, EXPIRED_TOKEN, ACCESS_DENIED, NETWORK, TIMEOUT, EMPTY_MIRROR, OTHER. Exit 0 on success,
      1 on failure. Test-only knobs with these defaults: SYNC_TF_ASSETS_BACKOFF_SECONDS=3,
      SYNC_TF_ASSETS_ATTEMPT_TIMEOUT=25. set -uo pipefail with explicit checks (inherits no errexit assumption,
      Decision 162).
  - file: .claude/hooks/session_start_terraform_assets.sh
    action: Create
    purpose: >-
      Every-session hook in the session_start_sync_deps.sh shape. When ~/.aws/config has no
      `[profile agent_platform_admin]` line it prints one skip line and makes no AWS call. Otherwise it warns when neither PATH nor
      $HOME/.local/bin holds a terraform binary (and still syncs), runs bin/sync-terraform-assets.sh in default mode only, prefixes
      each output line with [session_start_terraform_assets], and always exits 0. Never gates on INSTALL_TERRAFORM.
  - file: .claude/settings.json
    action: Modify
    purpose: >-
      Register `bash .claude/hooks/session_start_terraform_assets.sh` at the END of the first SessionStart group with
      `"timeout": 60` (session_start_aws.sh stays first: test_capture_hook_registration's order test).
  - file: .claude/hooks/hooks.json
    action: Modify
    purpose: Re-render with `bin/venv-python .claude/hooks/plugin_hooks.py render` (test_plugin_hooks parity).
  - file: bin/setup-cloud-env.sh
    action: Modify
    purpose: >-
      Delete step 5b (the INSTALL_TERRAFORM=1 mirror-sync and tfvars block, including #1731's AWS_PROFILE default) and
      its else line; step 4's sync-deps still installs terraform when INSTALL_TERRAFORM=1. Header: the setup script runs
      before environment variables are set and the proxy never signs its requests (replaces the "harness is
      unreliable ... BEFORE or AFTER" sentence, and the ADMIN header block must contain the phrase "the agent proxy never
      signs its requests" on ONE comment line, since the test joins header lines with newlines); the responsibility split and "What it does" lists name the new hook; the ADMIN template is
      otherwise unchanged.
  - file: tests/test_sync_terraform_assets.py
    action: Create
    purpose: Behaviour tests for the script with a stub aws and a stub delegate on a temp repo copy (acceptance 1-2).
  - file: tests/hooks/test_session_start_terraform_assets.py
    action: Create
    purpose: Hook gating, exit 0, warnings and registration (acceptance 3).
  - file: tests/test_setup_cloud_env.py
    action: Modify
    purpose: >-
      Remove TestAdminTfvarsFetch (test_admin_branch_calls_shared_delegate, test_failed_fetch_does_not_abort),
      _extract_install_terraform_block, _run_admin_block_recording_profile, test_admin_block_defaults_aws_profile_when_unset
      and test_admin_block_keeps_an_explicit_aws_profile (their behaviour moves to steps 1-2 or is deleted with step 5b);
      test_placeholder_install_precedes_first_aws_call drops its `aws s3 sync` index; test_admin_template_sets_install_
      terraform_inline replaces its "BEFORE or AFTER" assertion with one on "the agent proxy never signs its requests".
      Each is a weakening candidate named here (Decision 235 clause 1) and gets a planned-change disposition citing
      acceptance_criteria[3]. Add test_setup_fetches_no_terraform_assets (acceptance 4).
  - file: config/agent/verification_registry/entries/setup-cloud-env-mirror-hygiene.yaml
    action: Modify
    purpose: >-
      guard_target becomes bin/sync-terraform-assets.sh. The command greps that file for
      `RESOLVED_TFRC="$HOME/.terraform-mirror.tfrc"` and, anchored so agent_platform_admin fails it,
      `grep -qE 'aws s3 sync "s3://agent-platform-data-lake/tf-provider-mirror/".*--delete --profile agent_platform( |$)'`.
      Fails on origin/main (file absent), passes on HEAD (Decision 132 VF-06).
  - file: docs/contracts/terraform-cc-web-operations.yaml
    action: Modify
    purpose: Texts T1-T5 in execution step 7, verbatim.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: Texts T5-T6 in execution step 7, verbatim.
  - file: config/terraform/cc-web.tfrc
    action: Modify
    purpose: Comment line 3 becomes text T7.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Decision 120 gains annotation T8 after its Related line; its body is unchanged (Decision 177).
  - file: docs/plans/PLAN-admin-terraform-assets-session-hook.yaml
    action: Create
    purpose: This plan.
