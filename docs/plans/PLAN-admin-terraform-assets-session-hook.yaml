acceptance_criteria:
  - >-
    Default mode: on success the mirror holds the stub's files, the resolved tfrc names the mirror dir, the output and
    log read `mirror-sync: OK`, exit 0; the aws call carries `--profile agent_platform` whatever AWS_PROFILE says; a
    first failure is retried once after the backoff; NO_CREDENTIALS and NO_REGION are not retried; a hung attempt
    reports TIMEOUT; all attempts failing removes a pre-existing resolved tfrc, prints a WARNING with the class, exits
    1; an empty sync writes no tfrc, removes a pre-existing one, reports EMPTY_MIRROR and exits 1; the sync carries
    `--exclude "*"` and one `--include` per namespace cc-web.tfrc routes through the mirror; default mode never runs
    the delegate.
  - >-
    --tfvars mode runs the delegate with AWS_PROFILE=agent_platform_admin even when the ambient profile is
    agent_platform, prints `tfvars-fetch: OK` on success, and on a delegate failure whose stderr carries an ARN, a
    12-digit run and an AROA id prints the class and the aws error line (not the delegate's prefix line), scrubbed of
    all three; same for default mode output and log. A 12-digit run straddling character 200 is still masked (scrub
    before truncate), and when the shared mask cannot be imported only the class prints.
  - >-
    The hook prints one skip line and calls no aws when ~/.aws/config lacks the agent_platform_admin profile; in an
    ADMIN config it runs default mode only; it exits 0 when the script fails or terraform is absent (with a WARNING);
    it is registered in .claude/settings.json SessionStart with timeout 60 and hooks.json is the render.
  - >-
    bin/setup-cloud-env.sh, outside comments, runs no `aws s3`, `aws secretsmanager`, `aws ssm` or `aws sts` command,
    no materialise_tfvars call and names no tf-provider-mirror, still runs bin/sync-deps.sh (which installs
    terraform when INSTALL_TERRAFORM=1), and its ADMIN header block says the agent proxy never signs its requests.
  - >-
    The repointed registry entry passes on HEAD and fails on origin/main; validate_terraform_cc_web_operations and the
    deploy-paths evaluator pass; texts T1-T8 are present verbatim (allowed variance: T5/T8 dates are the build's
    commit date; line wrapping). VP 5 checks key fragments; code review compares each text in full against execution
    step 7.
  - >-
    Live, in the build's ADMIN container at the CI-green head: the hook syncs the mirror; a scratch-copy terraform init
    through the mirror installs kislerdm/neon from it; PlatformDev can read the prefix; one on-demand --tfvars run
    writes a non-empty mode-600 tfvars with clean output, then the file is removed. After merge, in a NEW ADMIN
    session: the start-up output shows `[session_start_terraform_assets] mirror-sync: OK` and rec-4747 is closed.
