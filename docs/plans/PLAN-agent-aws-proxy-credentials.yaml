    fix_if: >-
      A test sees region_name eu-west-2 on the identity client or a region override on the profile session -- the
      helper is re-introducing the proxy re-sign; fix the helper, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: aws-identity-caller-arn
  - step: 2
