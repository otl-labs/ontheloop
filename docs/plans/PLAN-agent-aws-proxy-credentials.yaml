handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "agent-aws-proxy-credentials"
intent: >-
  Take the long-lived agent_static AWS key out of the DEV and ADMIN cloud containers. Each environment's agent proxy
  holds it as an AWS network secret and signs only the project region's STS host; the container holds placeholder
  credentials from a repo-owned credential_process script; and identity checks read the real assumed role from a second
  region's STS host, because the proxy re-signs every call to the allowed host as the IAM user. Executes rec-4510 and is
  Plan A of the four-plan credential-proxy split (B two IAM users and ExternalIds removed, C GitHub secret hardening,
  D Secrets Manager to SSM), so agents never hold a real AWS key while the Pattern-B role model stays unchanged.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V3
plan_path: docs/plans/PLAN-agent-aws-proxy-credentials.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4510.
scope:
  - file: scripts/aws_identity.py
    action: Create
    purpose: >-
      New container-only module (no Lambda manifest packages it; scripts/aws_profile.py is packaged by 7 active Lambdas,
      so it stays untouched). IDENTITY_PROBE_REGION = "eu-west-1", caller_arn(profile) and a `python -m
      scripts.aws_identity caller-arn [--profile P]` CLI. caller_arn builds
      boto3.Session(profile_name=scripts.aws_profile.resolve_aws_profile(profile)), takes its frozen credentials (the
      profile's own AssumeRole, on the profile's region, proxy-signed in a cloud session), then calls GetCallerIdentity
      from a SEPARATE boto3 STS client with region_name=IDENTITY_PROBE_REGION built from those credentials, and returns the
      Arn. It never overrides the profile's region (that would move the inner AssumeRole off the proxy-allowed host) and
      never prints or logs credential values. The CLI prints only the Arn (exit 0), or one stderr line with the
      exception type plus, for a botocore ClientError, response['Error']['Code'] -- never the message, which can embed the
      caller ARN and account id (exit 1). The module docstring carries the scoped rule: an STS call made with role credentials whose
      result depends on the caller identity, or that chains AssumeRole, must never target the project region's STS host;
      exit-code-only liveness probes and account-id reads are exempt (the identity is wrong but the account and the exit
      code are right). The identity client carries botocore Config(connect_timeout=5, read_timeout=10,
      retries={"max_attempts": 2}), because the SessionStart hook now calls it and a blocked eu-west-1 host must not stall
      session start. Nothing raises at import.
  - file: tests/test_aws_identity.py
    action: Create
    purpose: >-
      Credential-free tests (mocked boto3.Session / botocore Stubber, no network), including the node
      test_identity_call_uses_probe_region (rec-4510's acceptance names it): the identity client is created with
      region_name IDENTITY_PROBE_REGION and the resolved credentials, and the profile session is never given a region
      override; profile None (CI/Lambda) uses the default chain; the CLI prints the Arn and exits 0, and on a raised
      botocore ClientError prints one stderr line carrying the exception type and the error code (e.g. InvalidClientTokenId)
      and exits 1, with no message text, ARN or credential value; the identity client's config carries the bounded
      connect/read timeouts and max_attempts 2; IDENTITY_PROBE_REGION differs from the region in config/aws-region.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Scope amendment (implementation-time gap): validate_placement RS-01 requires every scripts/-root file to be listed,
      so add `aws_identity.py` to scripts_root_allowlist.allowed_files directly before its aws_profile.py sibling, plus
      one amendment_log field_add entry (repo_identity.py precedent). Additive only; no route or entry changes shape.
      Approved by Benjamin 2026-10-25 17:02 (cmsg_01Cqz6E4mzSv6kkGCSCub3WM7ddwcXweXV4rtFLCWugAVS).
  - file: bin/aws-proxy-placeholder-credentials
    action: Create
    purpose: >-
      Executable bash credential_process script printing exactly {"Version": 1, "AccessKeyId": "proxy-injected-key-id",
      "SecretAccessKey": "proxy-injected-secret"}, built through a printf format string with the values as arguments
      (detect-secrets' KeywordDetector flags a literal "SecretAccessKey": "<value>" pair; the printf form was probed clean). No Expiration (static, no refresh loop) and no SessionToken (a fake
      token adds X-Amz-Security-Token, which could break the proxy re-sign). Values are not key-shaped, so the never-commit
      shape hook (.pre-commit-config.yaml block-sensitive-identifiers) stays quiet.
  - file: tests/test_aws_proxy_placeholder_credentials.py
    action: Create
    purpose: >-
      Test constants are named without the secret keyword (e.g. PLACEHOLDER_VALUES) and the expected values are compared
      field by field, so detect-secrets stays clean without a baseline entry or allowlist pragma. Runs the script and asserts the exact JSON (Version 1, both fields, no Expiration, no SessionToken) and that no value
      matches the never-commit AKIA/ASIA/AIDA shape; then resolves a credential_process profile pointing at it through
      botocore with a temp AWS_CONFIG_FILE and empty AWS_SHARED_CREDENTIALS_FILE, asserting the placeholder access key id.
  - file: bin/setup-cloud-env.sh
    action: Modify
    purpose: >-
      Header: replace the DEV and ADMIN templates. Each environment now has (1) an AWS (SigV4) network secret in the
      environment settings holding the agent_static access key, allowed host sts.eu-west-2.amazonaws.com only, and (2) a
      private setup-field block that writes ~/.aws/config only and removes any stale ~/.aws/credentials. botocore does not
      expand $HOME or ~ in credential_process, so the block writes the [profile agent_static] section with printf and an
      expanded "$HOME/.local/bin/aws-proxy-placeholder-credentials" (expanded when the setup field runs), then appends the role
      profiles through a quoted heredoc: [profile agent_platform] (DEV and ADMIN) and [profile agent_platform_admin] (ADMIN
      only; every profile also sets `sts_regional_endpoints = regional`, so AssumeRole lands on the proxy-allowed host
      whatever an SDK's default is; ADMIN keeps both profiles, with AWS_PROFILE=agent_platform_admin and INSTALL_TERRAFORM=1 in the env-var field
      unchanged). It ends `cd /home/user/ontheloop && bash bin/setup-cloud-env.sh` (was the pre-transfer
      /home/user/agent-platform). Account id and ExternalIds stay <PLACEHOLDER> tokens. Body: a new step right after step
      2 (which exports $HOME/.local/bin) installs bin/aws-proxy-placeholder-credentials to $HOME/.local/bin with `install -m
      0755` only when the copy is missing or differs (cmp) -- before the first AWS call in the script (step 5b's `aws s3
      sync` and materialise_tfvars). Responsibility-split and "What it does" comments updated.
  - file: tests/test_setup_cloud_env.py
    action: Modify
    purpose: >-
      Header template has no aws_secret_access_key and no /home/user/agent-platform, and names the network-secret step and
      cd /home/user/ontheloop. Executes the DEV and the ADMIN template block (placeholders substituted, extracted from the
      header, stopping before the trailing `cd /home/user/ontheloop && bash bin/setup-cloud-env.sh` line so no networked
      installer runs) in a subprocess whose env pins HOME to a temp dir (the block's `rm -f ~/.aws/credentials` must never
      touch the real home) with the install block run, then resolves the agent_static profile through botocore to
      proxy-injected-key-id and asserts the ADMIN config carries both role profiles. The install step precedes the first
      `aws ` command in the script (inside the INSTALL_TERRAFORM block) and `bash .claude/hooks/session_start_aws.sh`;
      running the install block twice leaves one identical executable copy.
  - file: .claude/hooks/session_start_aws.sh
    action: Modify
    purpose: >-
      Report the identity from `bin/venv-python -m scripts.aws_identity caller-arn --profile "$PROFILE"` (repo root from
      CLAUDE_PROJECT_DIR, else the script's own location) instead of `aws sts get-caller-identity`. Gate on ~/.aws/config
      existing (a credentials file is no longer expected); skip with a message when bin/venv-python or the venv is absent;
      always exit 0 (advisory). Hint text names the environment's AWS network secret and the ExternalId in ~/.aws/config,
      not ~/.aws/credentials.
  - file: tests/hooks/test_session_start_aws.py
    action: Create
    purpose: >-
      Runs the real hook in a temp repo root with a stub bin/venv-python and a temp HOME: prints "OK: assumed <arn>" from
      the helper, warns and exits 0 when the helper exits 1, skips when ~/.aws/config is absent, and a stub `aws` on PATH
      that records its argv is never invoked with "sts".
  - file: tests/test_sts_call_sites.py
    action: Create
    purpose: >-
      Census guard for the proxy side effect. A scanner function takes a repo root, lists files under scripts/,
      src/, bin/, .claude/hooks/ and .github/actions/ with `git ls-files --cached --others --exclude-standard` (so new,
      not-yet-committed files are scanned) and finds STS usage (boto3 client("sts" ...), "sts" CLI argv lists, `aws
      sts`). The test asserts the matching set equals an explicit allow-list where every entry names its class:
      identity-reading via the helper (scripts/aws_identity.py), exit-code-only liveness (scripts/checks/_scaffolding.py,
      scripts/preflight/aws_infra.py, scripts/sync/ops.py), account-id-only (scripts/ci/iam_simulate.py,
      scripts/ci/security_detector_probe.py). A new file fails with a message pointing at the rule in
      scripts/aws_identity.py's docstring; an allow-listed file that no longer matches also fails (no stale entries). A
      second, permanent case builds a temp git repo fixture containing one extra file with boto3.client("sts") and asserts
      the scanner's finding names exactly that file (the discrimination proof). terraform/ is out of the census because no
      provider block chains assume_role today (CI applies use OIDC ambient credentials); the docstring rule says a future
      provider assume_role block, or an identity-dependent data source (aws_caller_identity arn or user_id,
      aws_iam_session_context) read in a local ADMIN plan, falls under the same rule.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      admin_out_of_band.pre_merge_live_plan rule[1] (ENVIRONMENT CHECK) becomes the approved text (context: approved
      texts, 4a); one amendment_log entry naming pre_merge_live_plan and this plan.
  - file: scripts/checks/verification/validate_admin_root_premerge_gate.py
    action: Modify
    purpose: >-
      ENV_MARKERS replaced (not OR-widened) from ("get-caller-identity", "ADMIN_CHAIN_OK") to ("caller-arn",
      "ADMIN_CHAIN_OK") to match the amended contract. Decision 235 clause 1: this plan is the human-confirmed plan
      naming the change (see context, approvals).
  - file: tests/checks/verification/test_validate_admin_root_premerge_gate.py
    action: Modify
    purpose: >-
      The fixture env-check command becomes the helper form; add a case where a net-new admin-root plan whose
      ENVIRONMENT CHECK step carries only the old get-caller-identity form is flagged; the existing partial-marker case
      (test_get_caller_identity_without_admin_chain_ok_flags_env_clause) is re-pointed and renamed
      test_caller_arn_without_admin_chain_ok_flags_env_clause: a pre-deploy command carrying `bin/venv-python -m
      scripts.aws_identity caller-arn --profile agent_platform_admin` without ADMIN_CHAIN_OK must still be flagged, so
      both ENV_MARKERS halves stay discriminated; the existing marker-literal parity test keeps every ENV_MARKERS literal
      present in deploy-paths.yaml.
  - file: tests/test_deploy_paths_admin_procedure.py
    action: Modify
    purpose: >-
      Assert rule[1] carries the caller-arn helper command and no longer the get-caller-identity form.
  - file: scripts/preflight/aws_infra.py
    action: Modify
    purpose: >-
      _handle_credentials_startup guidance names `bin/venv-python -m scripts.aws_identity caller-arn --profile <p>` and the
      environment's AWS network secret instead of "refresh ~/.aws/credentials"; the check_credentials docstring notes it
      is exit-code only and stays correct under the proxy. check_credentials behaviour is unchanged.
  - file: tests/session/preflight/test_aws_infra.py
    action: Modify
    purpose: Assert the new guidance text names the helper and the network secret and no longer says ~/.aws/credentials.
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: >-
      AWS-04 location and ANT-03 kind become the approved values (see context, approved texts, 4f); target, stage and status
      unchanged (rotation stays with Plan B); one amendment_log correction entry.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Append the approved dated Update annotation to Decision 113 after its 2026-10-21 Update (Decision 177 annotation
