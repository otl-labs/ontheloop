    command: >-
      test ! -e "$HOME/.aws/credentials" && ! grep -rq aws_secret_access_key "$HOME/.aws" && grep -q credential_process "$HOME/.aws/config" && echo NO_STATIC_KEY
      ; P="$HOME/.local/bin/aws-proxy-placeholder-credentials"; test -x "$P" && cmp -s "$P" /home/user/ontheloop/bin/aws-proxy-placeholder-credentials && test "$P" -nt "$HOME/.aws/config" && echo BODY_RAN || echo BODY_NOT_PROVEN
      ; test -n "$(ls -A "$HOME/.terraform-mirror" 2>/dev/null)" && test -s "$HOME/.terraform-mirror.tfrc" && test "$HOME/.terraform-mirror.tfrc" -nt "$HOME/.aws/config" && echo MIRROR_SYNCED || echo MIRROR_MISSING
      ; T=/home/user/ontheloop/terraform/personal/terraform.personal.tfvars; test -s "$T" && test "$T" -nt "$HOME/.aws/config" && echo TFVARS_PRESENT || echo TFVARS_MISSING
    expected: >-
      Prints NO_STATIC_KEY, BODY_RAN, MIRROR_SYNCED and TFVARS_PRESENT. BODY_RAN shows the setup body ran after the
      re-pasted setup field wrote ~/.aws/config (the first cut-over installs the placeholder fresh). Only with BODY_RAN and
      the matching VP 17 baseline token do MIRROR_SYNCED and TFVARS_PRESENT prove the network secret signed the setup
      script's own AWS calls, which the probe never covered; mirror evidence is read from $HOME, and the tfvars path is
      the setup field's cd target, not the session's working directory.
    fix_if: >-
      A credentials file remains -- the setup field was not re-pasted from the new header or the snapshot predates it;
      ask Benjamin to re-paste and start a new session. BODY_NOT_PROVEN -- the setup body did not run (today's setup field
      cds into a path that does not exist); record setup-time signing as unproven and tell Benjamin; it is not a
      network-secret failure. MIRROR_MISSING or TFVARS_MISSING with BODY_RAN and a positive VP 17 token -- the network
      secret is not applied while the setup script runs; record setup-time signing as failed, tell Benjamin (ADMIN
      terraform loses its mirror and tfvars on a fresh snapshot), and file a rec; do not work around it with a key. A
      MISSING whose VP 17 token was negative records "unproven (no baseline)".
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: In the new ADMIN session, the helper reports both roles through the proxy and the ENVIRONMENT CHECK prints ADMIN_CHAIN_OK (step 9's command).
    command: >-
      bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform | grep -o 'assumed-role/PlatformDev/'
      && bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin | grep -o 'assumed-role/PlatformAdmin/'
      && (bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT)
    expected: Prints assumed-role/PlatformDev/, assumed-role/PlatformAdmin/ and ADMIN_CHAIN_OK.
    fix_if: >-
      AssumeRole fails with InvalidClientTokenId -- the network secret's allowed host or key is wrong (Benjamin's console
      step); the role is right but the helper prints user/ -- the identity client is on eu-west-2; stop and RCA.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: >-
      Scope boundary in the new ADMIN session (read-only): role credentials work off the STS host as PlatformDev (DuckLake
      reader), PlatformDev is still denied its tfstate read, the IAM user cannot assume PlatformAdmin without an
      ExternalId, and the placeholder key is rejected on S3 (the proxy signs only STS). The known side effect is recorded:
      an unpinned get-caller-identity returns the IAM user.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; print('READER_OK', len(make_reader().named('count_by_status')) > 0)"
      ; aws s3api head-object --bucket agent-platform-data-lake --key tfstate/personal/sandbox/terraform.tfstate --profile agent_platform 2>&1 | grep -oE '403|Forbidden' | head -1
      ; acct=$(aws configure get role_arn --profile agent_platform | cut -d: -f5); aws sts assume-role --profile agent_static --role-arn "arn:aws:iam::${acct}:role/PlatformAdmin" --role-session-name boundary-probe 2>&1 | grep -o AccessDenied | head -1
      ; aws s3 ls --profile agent_static 2>&1 | grep -oE 'InvalidAccessKeyId|SignatureDoesNotMatch|AccessDenied' | head -1
      ; aws sts get-caller-identity --profile agent_platform --query Arn --output text 2>&1 | grep -o 'user/agent-service-account'
    expected: >-
      Prints READER_OK True, then 403 (or Forbidden), then AccessDenied, then a rejection code for the placeholder, then
      user/agent-service-account (the recorded side effect). Nothing else is printed.
    fix_if: >-
      The tfstate read succeeds -- the scope boundary did not hold; stop, do not retry, report to Benjamin (security). The
      admin AssumeRole succeeds without an ExternalId -- trust policy changed; stop and report. The side-effect line is
      absent -- the proxy behaviour changed; record it (not a failure) and tell the coordinator, since Plans B and D rely on it.
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: >-
      DEV, in a session in the DEV environment after Benjamin's DEV cut-over (paste-able probe prompt in the handoff):
      no static key; the helper reports PlatformDev; the IAM user cannot assume PlatformAdmin with DEV's own ExternalId or
      with none; PlatformDev's tfstate read is denied.
    command: >-
      test ! -e "$HOME/.aws/credentials" && ! grep -rq aws_secret_access_key "$HOME/.aws" && echo NO_STATIC_KEY
      ; bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform | grep -o 'assumed-role/PlatformDev/'
      ; acct=$(aws configure get role_arn --profile agent_platform | cut -d: -f5); aws sts assume-role --profile agent_static --role-arn "arn:aws:iam::${acct}:role/PlatformAdmin" --role-session-name boundary-probe --external-id "$(aws configure get external_id --profile agent_platform)" 2>&1 | grep -o AccessDenied | head -1
      ; aws sts assume-role --profile agent_static --role-arn "arn:aws:iam::${acct}:role/PlatformAdmin" --role-session-name boundary-probe 2>&1 | grep -o AccessDenied | head -1
      ; aws s3api head-object --bucket agent-platform-data-lake --key tfstate/personal/sandbox/terraform.tfstate --profile agent_platform 2>&1 | grep -oE '403|Forbidden' | head -1
    expected: >-
      Prints NO_STATIC_KEY, assumed-role/PlatformDev/, AccessDenied, AccessDenied, 403 (or Forbidden). This proves the
      ExternalId gate only, not principal separation (rec-4043 / Plan B).
    fix_if: >-
      Either AssumeRole into PlatformAdmin succeeds -- stop, report to Benjamin immediately (security). No DEV session is
      available -- record DEV as unproven in the PR comment; never substitute the ADMIN results.
    hermetic: false
    graduation: not-applicable
  - step: 15
    phase: post-deploy
    action: >-
      After squash-merge with "Resolves: rec-4510", confirm the trailer-closure job closed the rec (closure obligation).
    command: bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; r=make_reader().named('recs_by_ids', ids='rec-4510')[0]; print(r['status']); assert r['status']=='closed'"
    expected: Prints closed; exit 0.
    fix_if: >-
      Still open -- read the trailer-closure job log; on a transport or merge-leg refusal use the sanctioned --update-rec
      fallback; on an acceptance-verdict refusal use only the printed close_proposed command (git-ops.yaml
      resolves_trailer). Never edit a local cache.
    hermetic: false
    graduation: not-applicable
