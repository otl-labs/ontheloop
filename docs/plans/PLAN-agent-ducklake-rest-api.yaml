      tokens are printed, never the error text, which names the account. The request body is an empty JSON object, so
      a handler that were reached would answer 400.
    command: |-
      date -u +%Y-%m-%dT%H:%M:%SZ | sed 's/^/STARTED_AT /'
      bin/venv-python - <<'PY'
      import json, os
      import boto3, requests
      from botocore.auth import SigV4Auth
      from botocore.awsrequest import AWSRequest
      url = os.environ.get("DUCKLAKE_API_PROBE_URL", "")
      if not url.endswith("/ops/reader"):
          raise SystemExit("PROBE NO_URL")
      base = url[: -len("/ops/reader")]
      region = open("config/aws-region").read().strip()
      creds = boto3.Session(profile_name="agent_static").get_credentials().get_frozen_credentials()
      def token(text):
          t = text.lower()
          if "injection failed" in t:
              return "PROXY_REFUSED"
          if "explicit deny" in t:
              return "EXPLICIT_DENY_OLD_USER" if ":user/agent-service-account " in text else "EXPLICIT_DENY_OTHER"
          if "missing authentication token" in t:
              return "MISSING_AUTH_TOKEN"
          if "should be scoped" in t:
              return "SCOPE_WRONG"
          if "signature" in t:
              return "SIGNATURE_MISMATCH"
          if "security token" in t:
              return "TOKEN_INVALID"
          return "OTHER"
      for route in ("ops/reader", "ops/writer", "telemetry/reader", "telemetry/writer", "ops/absent"):
          body = json.dumps({})
          req = AWSRequest(method="POST", url=f"{base}/{route}", data=body, headers={"Content-Type": "application/json"})
          SigV4Auth(creds, "execute-api", region).add_auth(req)
          try:
              r = requests.post(f"{base}/{route}", data=body, headers=dict(req.headers), timeout=60)
              print("PROBE", route, r.status_code, token(r.text))
          except Exception as e:
              print("PROBE", route, "STOP_" + type(e).__name__)
      PY
    expected: >-
      STARTED_AT with a time; PROBE ops/reader 403 EXPLICIT_DENY_OLD_USER, the same for ops/writer, telemetry/reader and
      telemetry/writer; PROBE ops/absent 403 MISSING_AUTH_TOKEN. The build records them, labelled operator-environment,
      in a counts-only PR comment.
    fix_if: >-
      PROBE NO_URL: the variable is unset or not the ops/reader URL; the operator fixes it and the probe re-runs.
      PROXY_REFUSED or STOP_ProxyError: the host is not on the list (the operator adds it exactly) or the proxy refuses
      execute-api hosts (stop: reversal condition proxy-signs-function-urls' sibling, returned to planning as a vendor
      finding). SCOPE_WRONG, SIGNATURE_MISMATCH or TOKEN_INVALID: the proxy signs this host with the wrong service or
      not at all; stop and return to planning, nothing is widened. EXPLICIT_DENY_OTHER: another identity signed; check
      the environment's key. A 2xx or a handler's 4xx on a real route: the resource policy did not refuse the old
      identity; a security finding, reported to the operator at once (reversal condition resource-policy-semantics).
      Never retried with another identity.
