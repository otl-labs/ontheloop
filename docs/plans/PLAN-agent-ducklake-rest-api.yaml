      "length(RequestedQuotas[?Status=='PENDING' || Status=='CASE_OPENED'])" --output text | sed 's/^/OPEN_REQUESTS /';
      aws cloudwatch get-metric-statistics --namespace PlatformSecurity --metric-name DuckLakeApiChange --start-time "$S" --end-time
      "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --period 60 --statistics Sum --query 'sum(Datapoints[].Sum)' --output text | sed
      's/^/API_CHANGE_MATCHES /' )
    expected: >-
      APIS 1; TIMEOUT 120000 for each of the four routes; PERMISSION exact 1 wildcard 0 for each of the four functions;
      ACCESS_LOG_OK; QUOTA_VALUE 120000.0; OPEN_REQUESTS 0; API_CHANGE_MATCHES of 1 or more (and the alarm's email
      arrived).
    fix_if: >-
      TIMEOUT 29000 or another value: the integration did not take the quota; report it (a plan defect, fixed by a
      reviewed bootstrap PR). OPEN_REQUESTS above 0: the quota resource filed a request; the operator cancels it with
      AWS support and the build reports it (a plan defect: the resource is dropped from state by a reviewed PR).
      PERMISSION exact 0 or wildcard above 0: stop; the function policy is not what Decision
      {{N}} cl.1 allows; the operator removes the stray statement only through a reviewed bootstrap change.
      API_CHANGE_MATCHES 0 after 30 minutes: the filter missed the apply's own events; check them in CloudWatch with
      the build (VP 6's TMF lines first) and fix forward. A match with no email: read the alarm's history, then the
      topic and subscription; report it; it does not block VP 9.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      PROXY SIGNING PROBE through the API, with the agent environment's current (old) key and no new grant. Operator
      prep: in CloudShell, read the ops/reader route URL (aws ssm get-parameter --name
      /agent-platform/ducklake/api_url/ops/reader --query Parameter.Value --output text) and its host; in the current
      agent environment, make sure that exact host is on the AWS network secret's allowed hosts (add it if not), and set
      DUCKLAKE_API_PROBE_URL to the URL and AWS_PROFILE=agent_static in the env-var field. The coordinator starts a fresh
      thread in that environment on the operator's word; it runs only this block, through the placeholder agent_static
      profile (no role step, so no AssumeRole), and reports the lines to the build thread; the operator then clears
      both variables (the host may stay until plan B's cutover sets the final list: the resource policy refuses the old
      identity). API Gateway checks the signature before IAM, so an explicit deny naming the old user proves the proxy
      signed the execute-api host correctly; the absent route is the control showing what a wrong path answers. Only
      tokens are printed, never the error text, which names the account. The request body is an empty JSON object, so
      a handler that were reached would answer 400.
    command: |-
      date -u +%Y-%m-%dT%H:%M:%SZ | sed 's/^/STARTED_AT /'
      bin/venv-python - <<'PY'
      import json, os
      import boto3, requests
      from botocore.auth import SigV4Auth
      from botocore.awsrequest import AWSRequest
      url = os.environ.get("DUCKLAKE_API_PROBE_URL", "")
      if not url.endswith("/ops/reader"):
          raise SystemExit("PROBE NO_URL")
      base = url[: -len("/ops/reader")]
      region = open("config/aws-region").read().strip()
      creds = boto3.Session(profile_name="agent_static").get_credentials().get_frozen_credentials()
      def token(text):
          t = text.lower()
          if "injection failed" in t:
              return "PROXY_REFUSED"
          if "explicit deny" in t:
              return "EXPLICIT_DENY_OLD_USER" if ":user/agent-service-account " in text else "EXPLICIT_DENY_OTHER"
          if "missing authentication token" in t:
              return "MISSING_AUTH_TOKEN"
          if "should be scoped" in t:
              return "SCOPE_WRONG"
          if "signature" in t:
              return "SIGNATURE_MISMATCH"
          if "security token" in t:
              return "TOKEN_INVALID"
          return "OTHER"
      for route in ("ops/reader", "ops/writer", "telemetry/reader", "telemetry/writer", "ops/absent"):
          body = json.dumps({})
          req = AWSRequest(method="POST", url=f"{base}/{route}", data=body, headers={"Content-Type": "application/json"})
          SigV4Auth(creds, "execute-api", region).add_auth(req)
          try:
              r = requests.post(f"{base}/{route}", data=body, headers=dict(req.headers), timeout=60)
              print("PROBE", route, r.status_code, token(r.text))
          except Exception as e:
              print("PROBE", route, "STOP_" + type(e).__name__)
      PY
    expected: >-
      STARTED_AT with a time; PROBE ops/reader 403 EXPLICIT_DENY_OLD_USER, the same for ops/writer, telemetry/reader and
      telemetry/writer; PROBE ops/absent 403 MISSING_AUTH_TOKEN (inferred: API Gateway may instead apply the resource
      policy before route matching). The build records them, labelled operator-environment,
      in a counts-only PR comment.
    fix_if: >-
      PROBE NO_URL: the variable is unset or not the ops/reader URL; the operator fixes it and the probe re-runs.
      PROXY_REFUSED or STOP_ProxyError: the host is not on the list (the operator adds it exactly) or the proxy refuses
      execute-api hosts (stop: reversal condition proxy-signs-function-urls' sibling, returned to planning as a vendor
      finding). TOKEN_INVALID: first re-check that the host is on the list exactly (inferred: an unlisted host may pass
      through with the placeholder signature); if it is, as SIGNATURE_MISMATCH. SCOPE_WRONG or SIGNATURE_MISMATCH: the
      proxy signs this host with the wrong service or not at all; stop and return to planning, nothing is widened. EXPLICIT_DENY_OTHER: another identity signed; check
      the environment's key. A 2xx or a handler's 4xx on a real route: the resource policy did not refuse the old
      identity; a security finding, reported to the operator at once (reversal condition resource-policy-semantics).
      ops/absent EXPLICIT_DENY_OLD_USER: the resource policy answered before route matching; record it, not a failure.
      MISSING_AUTH_TOKEN or any other token on a real route: the call was unsigned or reached the wrong stage or route;
      stop and report; nothing is widened. Never retried with another identity.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      OPERATOR STEP, CloudShell, at least 5 minutes after VP 9: count the access-log events since VP 9's STARTED_AT
      (the build writes it into S), proving the log role works and the caller record is written. Only counts print.
    command: >-
      ( unset AWS_PROFILE; S=<VP 9's STARTED_AT>; G=/aws/apigateway/agent-platform-ducklake-api; s=$(($(date -u -d "$S"
      +%s) * 1000)); aws logs
      filter-log-events --log-group-name "$G" --start-time "$s" --filter-pattern '{ $.status = "403" }' --query
      'length(events)' --output text | sed 's/^/DENIED_LINES /'; aws logs filter-log-events --log-group-name "$G"
      --start-time "$s" --filter-pattern '{ ($.status = "403") && ($.caller = "*:user/agent-service-account") }' --query
      'length(events)' --output text | sed 's/^/OLD_USER_LINES /' )
    expected: >-
      DENIED_LINES 5 (four routes and the absent one) or 4 (inferred either way: whether an absent-route 403 is
      access-logged is unverified) and OLD_USER_LINES 4 or more.
    fix_if: >-
      DENIED_LINES 0: no access log reached the group; check the stage's log settings and the account role (UNPROVEN
      that the four scoped logs actions suffice); fix forward by a reviewed bootstrap PR. OLD_USER_LINES 0 with
      DENIED_LINES above 0: the caller variable is empty for a denied call; record it in the PR comment (the caller
      record for allowed calls is still checked after plan B's cutover).
    hermetic: false
    graduation: not-applicable
