schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "agent-ducklake-rest-api"
intent: >-
  Put one IAM-authorised Regional REST API in front of the four DuckLake verb Lambdas, declared in terraform/bootstrap
  and applied by the operator, so agent sessions can reach them on an amazonaws.com host the egress proxy signs (it
  refuses the on.aws Function URL hosts); a new Decision amends Decision 213 cl.1 so an identity-trusting handler's
  open paths are its Function URL and its named API route, each closed at its control points. Plan A of two:
  PLAN-agent-proxy-signed-access (plan B, amended separately) then grants the agent user execute-api:Invoke and moves
  the clients onto the routes.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-agent-ducklake-rest-api.yaml
phase: >-
  security_advisory (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  since 2026-11-12 no agent session reaches AWS, and plan B's build (draft PR #2023) stopped at its VP 4 when the
  proxy refused the Function URL host (proxy-generated 502, body naming the host as not under amazonaws.com). The
  operator chose this route on 2026-11-13 14:06Z and agreed the split and every presented fork 14:21Z. Closes no
  roadmap criterion; no rec exists because the recs store is unreachable until plan B's cutover.
scope:
  - file: terraform/bootstrap/agent_ducklake_api.tf
    action: Create
    purpose: >-
      The API, everything it needs, and nothing else; every regional ARN and host from var.aws_region (Decision 202
      cl.4), every account from var.account_id, no literal account, region, API id or host. Locals:
      ducklake_api_routes = { sandbox = { "ops/reader" = local.ducklake_reader_function, "ops/writer" =
      local.ducklake_writer_function, "telemetry/reader" = local.ducklake_telemetry_reader_function, "telemetry/writer"
      = local.ducklake_telemetry_writer_function }, sit = {} }[var.environment] (the function-name locals of
      platform_dev_policies.tf); ducklake_api_count = { sandbox = 1, sit = 0 }[var.environment] (SIT's functions do not
      exist when its bootstrap applies, so it gets its own API later; map index, no conditional operator, as
      account_names.tf); ducklake_api_stage = "live"; ducklake_api_timeout_ms = 120000;
      ducklake_api_session_user_arn = "arn:aws:iam::${var.account_id}:user/agent-platform-session" (plan B's user; a
      condition value may name a principal that does not exist yet). Singletons, each count = local.ducklake_api_count:
      aws_api_gateway_rest_api.agent_ducklake (name agent-platform-ducklake-api, endpoint_configuration REGIONAL, no
      body or binary media types); aws_api_gateway_rest_api_policy.agent_ducklake (one statement, Sid
      DenyAllButAgentSession, Effect Deny, Principal "*", Action execute-api:Invoke, Resource
      "${execution_arn}/*", Condition StringNotEquals aws:PrincipalArn = local.ducklake_api_session_user_arn; no Allow:
      a same-account caller is allowed by its identity policy unless a Deny matches); aws_cloudwatch_log_group.
      agent_ducklake_api_access (name /aws/apigateway/agent-platform-ducklake-api, retention 400 days, the trail bucket's, since it is the API path's caller record, and skip_destroy true, so a revert leaves the record in place);
      aws_iam_role.agent_ducklake_api_logs (name ducklake-api-access-logs, outside agent-platform-* so no CI IAM grant
      reaches it, the name the new Decision's cl.4 authorises as Decision 248 cl.4 did its two roles; Decision 144
      cl.3's mandatory boundary binds agent-platform-* roles, and a service role holding four logs actions gains nothing
      from one, so none; trust Service apigateway.amazonaws.com only: whether API Gateway supplies aws:SourceAccount when
      it assumes the account CloudWatch role is unverified, so no condition, a residual owed rec 19 closes) with
      aws_iam_role_policy.agent_ducklake_api_logs from a hoisted local with a lifecycle precondition at 10,240 B
      (validate_iam_policy_size): logs:CreateLogStream, logs:PutLogEvents and logs:DescribeLogStreams on the log group
      ARN and ":*", logs:DescribeLogGroups on "*"; aws_api_gateway_account.agent_ducklake (cloudwatch_role_arn = the
      role, depends_on the role policy; API Gateway needs the account role to write any CloudWatch log);
      aws_servicequotas_service_quota.apigateway_integration_timeout (service_code apigateway, quota_code L-E5AE38E3,
      value 120000, written only after VP 4 shows the grant: the resource files a duplicate request while one is
      pending); aws_api_gateway_deployment.agent_ducklake (triggers redeployment = sha1(jsonencode([...])) over the
      route map, the policy document, every method and every integration, so a policy or route change ships; lifecycle
      create_before_destroy; depends_on the integrations and the policy); aws_api_gateway_stage.agent_ducklake
      (stage_name local.ducklake_api_stage, depends_on the account resource, access_log_settings to the log group with
      a JSON format of exactly requestId, requestTime, caller $context.identity.userArn, resourcePath, httpMethod,
      status, errorType $context.error.responseType, integrationStatus, integrationLatency, integrationError
      $context.integrationErrorMessage, responseLatency and responseLength, every value a quoted string (so
      "status":"$context.status" and VP 10's { $.status = "403" } compare strings): no request or response body, no
      header);
      aws_api_gateway_method_settings.agent_ducklake (method_path "*/*": metrics_enabled false, logging_level "OFF",
      data_trace_enabled false, throttling_rate_limit 20, throttling_burst_limit 40, a runaway guard only).
      Per route, each for_each = local.ducklake_api_routes: aws_api_gateway_resource.agent_ducklake_domain (for_each
      toset of each route key's first path segment, so ops and telemetry, and none in SIT) and
      aws_api_gateway_resource.agent_ducklake_route (parent the domain resource, path_part the second segment);
      aws_api_gateway_method.agent_ducklake_route (POST, authorization AWS_IAM, no authorizer_id, no api_key_required);
      aws_api_gateway_integration.agent_ducklake_route (type AWS_PROXY, integration_http_method POST, uri
      "arn:aws:apigateway:${var.aws_region}:lambda:path/2015-03-31/functions/arn:aws:lambda:${var.aws_region}:${var.account_id}:function:${each.value}/invocations",
      timeout_milliseconds local.ducklake_api_timeout_ms, no credentials, so API Gateway invokes through the function
      policy alone); aws_lambda_permission.agent_ducklake_route (statement_id AgentDuckLakeApi, action
      lambda:InvokeFunction, principal apigateway.amazonaws.com, function_name each.value, no qualifier, source_arn
      "${execution_arn}/${local.ducklake_api_stage}/POST/${each.key}", never a wildcard);
      aws_ssm_parameter.agent_ducklake_route_url (name "/agent-platform/ducklake/api_url/${each.key}", type String,
      value "${stage invoke_url}/${each.key}", read by plan B's clients; never under /secret/, Decision 237).
      No module, provider, data source or provisioner (VP 6's screen refuses them).
  - file: tests/checks/iam_tf/test_agent_ducklake_api.py
    action: Create
    purpose: >-
      Credential-free text tests over the new file and the boundary in the iam_tf convention
      (test_url_only_invoke_guard.py:1-3, its _platform_security_hcl helpers): each check is a predicate returning a
      problem list. The module names the files it reads as quoted basename literals ("agent_ducklake_api.tf",
      "github_ci_apply_boundary.tf", "platform_dev_policies.tf"), so --pre's data-edge channel
      (scripts/checks/deps/affected_tests.py) selects it when they change, which VP 1's waiver relies on. Ten real-tree nodes, each asserting an empty list: test_api_routes_are_the_four_verbs (the sandbox
      map's keys are exactly ops/reader, ops/writer, telemetry/reader, telemetry/writer, each mapped to its function
      local; the sit map is empty; every singleton's count is local.ducklake_api_count);
      test_api_methods_are_iam_post (every method POST with authorization AWS_IAM, no authorizer or API key);
      test_api_integrations_are_proxy_without_credentials (AWS_PROXY, POST, no credentials attribute,
      timeout_milliseconds is local.ducklake_api_timeout_ms, which equals the service quota resource's value, and its
      quota_code is L-E5AE38E3); test_api_permissions_name_exact_routes (each permission's principal, action, unqualified
      function and source_arn ending /${local.ducklake_api_stage}/POST/${each.key}; no "*" or "?" in any source_arn; no other
      aws_lambda_permission under terraform/bootstrap, and none under terraform/ with principal apigateway.amazonaws.com
      names a DuckLake function); test_api_policy_admits_only_the_session_user (exactly one statement, the Deny of row 1
      with the aws:PrincipalArn exception equal to arn:aws:iam::${var.account_id}:user/agent-platform-session, no
      Allow); test_api_stage_logs_no_bodies (logging_level OFF, data_trace_enabled false, metrics_enabled false, both
      throttle fields set; the log group keeps retention_in_days 400 and skip_destroy true; the access-log format names $context.identity.userArn, $context.resourcePath and
      $context.status and no $input, body or header variable); test_api_redeploys_on_change (the deployment's
      redeployment trigger references the policy, the methods and the integrations, and create_before_destroy is set);
      test_api_log_role_is_scoped (the role's name is ducklake-api-access-logs and does not start agent-platform-; its
      trust names only apigateway.amazonaws.com; no permissions_boundary; the inline policy's Allows are exactly row
      1's four logs actions, three on the log group);
      test_api_route_urls_are_parameters (one String parameter per route under /agent-platform/ducklake/api_url/,
      never /secret/); test_boundary_denies_api_gateway_writes (the boundary holds Sid DenyApiGatewayWrite, Effect
      Deny, Action exactly apigateway:DELETE and apigateway:P*, Resource "*", no Condition, and the parsed
      DataPlaneAllow ceiling names no apigateway or execute-api action while holding at least iam:GetRole, so a
      truncated parse fails). The eleventh, test_api_predicates_are_red_on_each_mutation, is parametrized over
      (mutation, predicate, expected problem substring) on the real text: a fifth route, a route mapped to another
      function, a sit route, a literal count, authorization NONE, an added credentials attribute, a timeout above the
      quota value, a source_arn ending /*, a second permission, an apigateway-principal permission added to
      terraform/personal, an Allow added to the policy, a second exception principal, data_trace_enabled true,
      $context.requestBody in the format, the policy dropped from the trigger, a boundary on the log role, the log role
      renamed agent-platform-ducklake-api-logs, a fifth logs action, a /secret/ parameter name, DenyApiGatewayWrite dropped, apigateway:GET added to it, apigateway:P* narrowed to
      apigateway:POST, apigateway:* added to DataPlaneAllow, $context.identity.userArn dropped from the access-log format, logging_level
      INFO, create_before_destroy removed, a second trust principal on the log role, a qualifier on a permission,
      skip_destroy dropped from the log group, the policy's StringNotEquals flipped to StringEquals, its Principal "*"
      narrowed to the account and its Resource narrowed from "${execution_arn}/*" to one route. About 380 SLOC by
      the iam_tf files' density (ten predicates and about thirty-two mutation rows); the build measures it against 500 and, over budget, moves the
      predicates into a _agent_ducklake_api_predicates.py helper beside it (Decision 128; next row).
  - file: tests/checks/iam_tf/_agent_ducklake_api_predicates.py
    action: Create
    purpose: >-
      Conditional: created only if test_agent_ducklake_api.py measures over 500 SLOC at build. It then holds the ten
      predicates and their parsers (a helper module whose names never start with test_, so the cross-test-import guard
      passes), and test_agent_ducklake_api.py keeps every node, the mutation table and the quoted basename literals
      --pre's data-edge channel reads. Otherwise not created.
  - file: terraform/bootstrap/github_ci_apply_boundary.tf
    action: Modify
    purpose: >-
      One new statement after DenyDuckLakeEventSourceMapping: Sid DenyApiGatewayWrite, Effect Deny, Action
      apigateway:DELETE and apigateway:P* (PATCH, POST and PUT, every API Gateway write verb; GET stays outside),
      Resource "*", unconditioned, with a comment citing Decision {{N}} cl.2 (no bounded identity creates, changes,
      redeploys or deletes any API Gateway resource, the account's CloudWatch role setting included). The ceiling has no
      apigateway action today, so this changes no current permission; it keeps a later ceiling widening from reaching
      the API. API Gateway's few non-verb actions (SetWebACL, UpdateRestApiPolicy and the certificate and access
      association ones; inferred from memory) sit outside this Deny but also outside the ceiling, so they stay denied;
      the test's no-apigateway-Allow clause keeps them so. The compact action form keeps the statement to about 110 B: the boundary renders about 5,266 B minified
      today (estimated by rendering the HCL with a twelve-digit account id) and about 5,376 B after, against Decision
      230's 5,632 B boundary-headroom tripwire. PLAN-telemetry-content-reader-lock (unbuilt, Feedback Loop's) and
      PLAN-bootstrap-ci-gated-apply (unbuilt; an about 322 B Deny, its row 34) also add to the boundary: with the
      latter the two come to about 5,698 B, over the tripwire, so whichever builds second re-measures on its rebased
      main and, over 5,632 B, stops for the operator's Decision 230 and 239 re-decisions (both reversal conditions
      fire at 5,632 B) rather than compacting other statements. VP 6 measures the real rendering.
  - file: terraform/bootstrap/platform_security_alarms.tf
    action: Modify
    purpose: >-
      Decision 202's detector reaches the API (live from the apply that creates it). A sixth
      local.platform_security_filter_patterns entry, platform-security-ducklake-api-change (metric DuckLakeApiChange),
      plain literals under 1,024 characters: { (($.eventSource = "apigateway.amazonaws.com") && ($.readOnly IS FALSE))
      || (($.eventSource = "lambda.amazonaws.com") && ($.readOnly IS FALSE) && (($.eventName = "AddPermission*") ||
      ($.eventName = "RemovePermission*") || ($.eventName = "*ResourcePolicy*")) && (($.errorCode = "AccessDenied*") ||
      ($.requestParameters.functionName = "*agent-platform-ducklake-reader*") || ($.requestParameters.functionName =
      "*agent-platform-ducklake-writer*") || ($.requestParameters.functionName = "*agent-platform-ducklake-telemetry-*")))
      || (($.eventSource = "iam.amazonaws.com") && ($.readOnly IS FALSE) && ($.requestParameters.roleName =
      %<anchored character-class regex for ducklake-api-access-logs>%)) }. Any API Gateway write in the
      account matches (bounded identities hold none, so every one is an admin act or an attack); a Lambda permission or
      resource-policy edit matches when it names a DuckLake verb function or was denied (a denied call carries
      requestParameters null but keeps its eventName); the role regex is case-insensitive, as the role-change filter's regex is.
      A sixth aws_cloudwatch_metric_alarm, platform_security_ducklake_api_change, in the role-change alarm's exact shape
      (period 300, threshold 1, notBreaching, the alerts topic), its description naming the API, the four functions'
      permissions and the log role before the shared triage text. Header comment says six pairs. No existing pattern,
      alarm or the triage query changes. Accepted residuals: the shared triage query shows requestParameters.roleName,
      not the API or function, so the email names its target through the alarm description; a successful edit that
      names the function only in a field other than functionName (for example a resource ARN) is not matched, and only
      PlatformAdmin or root can make one.
  - file: tests/checks/iam_tf/_platform_security_patterns.py
    action: Modify
    purpose: >-
      ALARMS gains platform-security-ducklake-api-change; _REQUIRED_CLAUSES gains its row
      ('$.eventSource = "apigateway.amazonaws.com"', the compound '($.eventSource = "lambda.amazonaws.com") &&
      ($.readOnly IS FALSE)', so dropping the lambda readOnly clause is detected, '"AddPermission*"',
      '"RemovePermission*"', '"*ResourcePolicy*"', '$.errorCode = "AccessDenied*"' and the three function clauses);
      pattern_problems gains a log-role regex predicate in _role_regex_problems' shape (hits ducklake-api-access-logs,
      DUCKLAKE-API-ACCESS-LOGS, DuckLake-Api-Access-Logs; misses ducklake-api-access-logs-x, xducklake-api-access-logs,
      agent-platform-ducklake-reader, ducklake-api-access-log).
  - file: tests/checks/iam_tf/test_platform_role_iam_change_alarms.py
    action: Modify
    purpose: >-
      Module docstring says six alarms. _PATTERN_REDS gains five rows on the new filter, each detected: the apigateway
      clause dropped, the lambda readOnly clause dropped, the errorCode alternative dropped, the telemetry function
      clause dropped, and the role regex made exact-case; the existing "sixth alarm" red-case label is renamed for an
      extra alarm. Node names unchanged (the graduated shard platform-role-iam-change-detector-declared pins the
      class). The file's SLOC stays under 500 (the build measures it; over budget, the rows move into
      _platform_security_patterns.py).
  - file: tests/fixtures/platform_security_filter_events.yaml
    action: Modify
    purpose: >-
      Events naming the new filter in must_match, in the fixture's sanitised shape (literal ACCOUNT): CreateDeployment
      on apigateway (readOnly false); UpdateRestApi patching the policy; AddPermission20150331v2 on
      agent-platform-ducklake-reader by name; RemovePermission20150331v2 on the telemetry writer by ARN; a denied
      AddPermission20150331v2 (requestParameters null, errorCode AccessDenied, errorMessage naming
      lambda:AddPermission on resource: the writer's ARN); DeleteRolePolicy on role DUCKLAKE-API-ACCESS-LOGS
      (also naming the heartbeat, as every iam event does); and three that must not match it: GetRestApis (readOnly
      true), AddPermission20150331v2 on agent-platform-ducklake-maintenance and DeleteRolePolicy on
      agent-platform-ducklake-reader. Each must_match is the event's exact filter set. The tests read only shape,
      coverage and the account literal, and VP 6 evaluates inline copies against the new filter alone, so the new
      events' must_match sets for the other five filters rest on inspection: an accepted residual, since no live step
      evaluates the committed events against every filter.
  - file: scripts/ci/security_detector_probe.py
    action: Modify
    purpose: >-
      EXPECTED_ALARMS gains platform-security-ducklake-api-change (test_expected_alarms_match_the_hcl pins the set to
      the HCL's alarm names); the docstring says six alarms. The hourly liveness run reports it missing between merge
      and VP 7's apply; infrastructure_dependencies keeps that window to one sitting.
  - file: tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
    action: Modify
    purpose: >-
      Conditional: edited only if PLAN-bootstrap-ci-gated-apply's BUILD PR 1 is on the build's rebased main at any point
      before merge (it makes
      _SCANNED_BOOTSTRAP_FILES every terraform/bootstrap/*.tf outside an explicit _UNSCANNED_BOOTSTRAP_FILES mapping,
      and a node fails on a new file in neither). Then agent_ducklake_api.tf joins the scanned tuple, as that plan's
      coupling line says: it holds no iam Allow whose Resource matches PlatformDev or PlatformAdmin, so
      test_real_tree_has_no_leak stays green, and the fail-closed count check must agree on its jsonencode statements
      (a disagreement is a parser gap reported to the coordinator, never an unscanned entry). Otherwise no edit; that
      plan's build adds it. No assertion changes; registry shard platform-admin-absent-from-ci-write-patterns is kept
      (its nodes untouched).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Sidecar blocks decision-new, decision-213-note and decision-84-note, verbatim, {{N}} and {{DATE}} filled at build
      (docs/plans/approved/agent-ducklake-rest-api.yaml); {{N}} is also filled in row 3's boundary comment. The new
      entry measures 6,088 B against the 6,144 B per-entry cap with N = 255; the build re-measures. No Serves line
      (the scout scored NS.5 3/5).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - "terraform/bootstrap is admin-only (environment-taxonomy.yaml axis_a): the operator plans it pre-merge (VP 5-6) and applies it post-merge (VP 7) from AWS CloudShell as user/platform-breakglass, each block self-contained (public-repo fetch at a sha, pinned terraform checked against HashiCorp's SHA256SUMS, variables from SSM, account id from the caller), the shape plan B's operator blocks reuse. Applier authority: Decision 202 cl.1 says the root is applied only by PlatformAdmin under the human-gated admin tier; the operator ruled on 2026-11-13 15:56Z (decision card, critique r3 finding 1) that Decision 126 cl.2's 'operators may always invoke it directly' covers the operator's own CloudShell applies, so 202 cl.1 binds applies an agent executes; plan B's sidecar note decision-202-note later records the reading in DECISIONS.md, and this plan's sidecar is unchanged."
  - "Quota first: VP 4 shows quota L-E5AE38E3 granted at 120000 before the build writes the service quota resource or VP 6 plans; the operator filed the request 2026-11-13 14:32Z (PENDING, current value 29000)."
  - "One merged-unapplied bootstrap change at a time: this PR merges only when no other bootstrap change is merged and unapplied (today #1987, rec-5025, whose apply is 0/0/0 by design and paused). If #1987 is still unapplied at CI green, VP 6's exact plan carries its merged content and shows no pending delta from it; the coordinator puts that evidence to the operator, whose ruling the one-at-a-time rule is. Plan B's bootstrap change queues after this apply; rec-4233 PR 1 after both."
  - "Merge and VP 7 happen in one operator sitting: from merge, security_detector_probe.py expects the sixth alarm, so an hourly liveness run before the apply reports it missing; a security_detector_stale rec filed in that window is closed by plan B's VP 15 with VP 7's read-back (Overlaps obligation (g))."
  - "Cross-root dependency (Decision 223): the four permissions sit on functions terraform/personal owns. A personal-root replacement of a function drops its permission and the route returns 5XX until the operator re-applies this root; CI cannot re-create it (DenyDuckLakeResourcePolicyEdit). Code deploys change no function policy. No deploy-paths.yaml row indexes that heal yet (owed rec 20); owed rec 18's per-route 5XX alarms are its detection."
  - "Who can plan this root afterwards: PlatformAdmin's AdminOps grants no apigateway action, so once this lands only the break-glass user (the CloudShell lane VP 5 checks) can refresh terraform/bootstrap; terraform/bootstrap/CLAUDE.md's agent_platform_admin runbook already cannot run (the proxy refuses the role step). PLAN-bootstrap-ci-gated-apply's roles need API Gateway and Service Quotas refresh reads for this root; its planning thread is told, and its row 1 carries them. Accepted residual (critique r3): this plan gives PlatformAdmin no apigateway read, since no session can assume PlatformAdmin while the proxy refuses the role step, and the CloudShell lane and that plan's CI path are the root's refresh paths."
  - "No Lambda code changes and no client changes: no deploy channel runs. Until plan B deploys the telemetry writer's REST caller read, that route fails closed (its handler finds no requestContext.authorizer.iam and answers 403 missing_caller_identity); the resource policy refuses every caller before then anyway."
acceptance_criteria:
  - "terraform/bootstrap declares one Regional REST API with exactly four AWS_IAM POST routes (/ops/reader, /ops/writer, /telemetry/reader, /telemetry/writer) as AWS_PROXY integrations without credentials at 120000 ms, one stage with a body-free access log, a resource policy that denies every principal but agent-platform-session, one exact-route Lambda permission per function and one URL parameter per route, all gated to the sandbox environment; test_agent_ducklake_api.py's ten real-tree nodes pass and its red-case node shows each predicate failing on its mutations."
  - "The permissions boundary denies apigateway:DELETE and apigateway:P* (PATCH, POST, PUT) on every resource to every bounded identity, and its ceiling holds no apigateway or execute-api action (test_boundary_denies_api_gateway_writes); VP 6 measures the boundary at or below 5,632 B minified."
  - "Decision 202's detector gains platform-security-ducklake-api-change, matching any API Gateway write, any Lambda permission or resource-policy edit on a DuckLake verb function or denied, and any IAM write to the log role (fixture events, red cases, live logs:TestMetricFilter in VP 6; security_detector_probe.py expects six alarms); metric data shows it matching the apply's own API Gateway events (VP 8)."
  - "DECISIONS.md carries exactly the sidecar's words (approved_text verify passes)."
  - "After the operator's apply, a signed call from the agent environment's old identity to each route is refused by the resource policy's explicit deny, naming that identity, and a call to an absent route answers Missing Authentication Token, or the same explicit deny if API Gateway applies the policy before route matching (VP 9); the access log records the denied calls with status 403 (their caller field is informational: OLD_USER_LINES 0 is recorded, not a failure), and plan B's caller-record step (its VP 16) proves the field names the caller on allowed calls (VP 10); each integration reads 120000 ms (VP 8)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the changed and new tests, including every named node.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_agent_ducklake_api.py
      tests/checks/iam_tf/test_url_only_invoke_guard.py tests/checks/iam_tf/test_platform_role_iam_change_alarms.py
      tests/test_security_detector_probe.py tests/checks/iam_tf/test_platform_security_heartbeat_canary.py
      tests/checks/iam_tf/test_telemetry_prefix_fence.py tests/checks/iam_tf/test_ci_branch_boundary_state_fence.py
      tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py -q
    expected: >-
      All pass, including test_agent_ducklake_api.py's eleven nodes, the detector's pattern, fixture and five new
      red-case nodes, test_expected_alarms_match_the_hcl and test_platform_role_metadata_admin_scope.py (scanning
      agent_ducklake_api.tf once PLAN-bootstrap-ci-gated-apply's BUILD PR 1 is on main).
    fix_if: Any failure; fix the code or the Terraform, never an assertion's meaning (Decision 235).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates PR CI's diff-selected pytest of these files on every change; the named nodes in test_obligations pin
      the new behaviour. The detector's graduated shards (platform-role-iam-change-detector-declared,
      security-detector-probe-fails-closed) already cover its files; the new test_agent_ducklake_api.py has none, so
      only review and the full tier would notice its deletion, a gap this plan accepts until owed rec 5 graduates it
      as a test_selector shard with test_agent_session_user.py.
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the policy-size, secret-grant, account-portability and tag-charset checks accept the new file (VP 3's --pre
      runs the region check).
    command: >-
      bin/venv-python -m scripts.checks.iam_tf.validate_iam_policy_size && bin/venv-python -m
      scripts.checks.iam_tf.validate_secret_parameter_grants && bin/venv-python -m
      scripts.checks.iam_tf.validate_terraform_tag_charset && bin/venv-python -c "from
      scripts.checks.iam_tf.validate_account_portable_names import validate_account_portable_names as v; f = []; v(f);
