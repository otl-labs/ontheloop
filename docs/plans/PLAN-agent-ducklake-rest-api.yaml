      echo "INLINE_POLICIES $(aws iam list-role-policies --role-name ducklake-api-access-logs --query
      'length(PolicyNames)' --output text 2>> "$L")"; echo "ATTACHED_POLICIES $(aws iam list-attached-role-policies
      --role-name ducklake-api-access-logs --query 'length(AttachedPolicies)' --output text 2>> "$L")"; terraform
      -chdir="$B" plan -input=false -no-color -detailed-exitcode -var-file="$W/vars.tfvars" -var "account_id=$A" -var
      "aws_profile=" -out="$W/after.bin" > /dev/null 2>> "$L"; echo "BOOTSTRAP_PLAN_EXIT $?"; terraform -chdir="$B" show
      -json "$W/after.bin" | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions |
      join(",")) \(.address)"' | sed 's/^/AFTER /'; else echo PLAN_SHAPE_UNEXPECTED; echo APPLY_SKIPPED; fi; echo
      "MERGE_SHA $M" )
    expected: >-
      NOW with a time; SCREEN_OK; FIX_PLAN Plan: 8 to add, 2 to change, 2 to destroy. (1 if the deposed deployment is
      gone); VP 11's CHANGE lines; PLAN_SHAPE_OK; APPLY_EXIT 0; Apply complete! Resources: 8 added, 2 changed, 2 (or 1)
      destroyed.; ACCOUNT_ROLE_OK; ROLE_POLICY_ACTIONS naming exactly the seven logs actions; INLINE_POLICIES 1; ATTACHED_POLICIES 0;
      BOOTSTRAP_PLAN_EXIT 0 with no AFTER line; MERGE_SHA with the merge sha.
    fix_if: >-
      SCREEN_REFUSED, an UNEXPECTED line or APPLY_SKIPPED: nothing was applied; stop and report to the coordinator,
      never a second paste. ACCOUNT_ROLE_REFUSED with APPLY_EXIT 1: first rule out IAM propagation, since the policy
      update is seconds old: after 10 minutes the operator pastes the resume block the build posts (this block at the
      same M, its allowed set cut to the changes still pending: the account setting, the stage, the method settings,
      the four URL parameters and any deposed-deployment delete; every CHANGE line must be in that set and the summary
      exactly "Plan: 7 to add, 0 to change, d to destroy." with d its delete lines, which may be 2, since a failed
      apply can leave the replaced deployment deposed beside the old one; inferred). A second
      refusal: the account setting refused AWS's own actions too; stop and report; the planning thread re-plans (ADVICE-r7.md (d): access logs to Amazon Data Firehose under API
      Gateway's service-linked role), never a hand edit. BOOTSTRAP_PLAN_EXIT 2 whose only AFTER line is the deployment's
      replacement: the trigger still churns, a plan defect to report. Any other partial apply: report; the state is
      re-planned, never hand-edited.
    hermetic: false
    graduation: not-applicable
