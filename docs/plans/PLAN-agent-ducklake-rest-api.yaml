infrastructure_dependencies:
  - "terraform/bootstrap is admin-only (environment-taxonomy.yaml axis_a): the operator plans it pre-merge (VP 5-6) and applies it post-merge (VP 7) from AWS CloudShell as user/platform-breakglass, each block self-contained (public-repo fetch at a sha, pinned terraform checked against HashiCorp's SHA256SUMS, variables from SSM, account id from the caller), the shape plan B's operator blocks reuse. Applier authority: Decision 202 cl.1 says the root is applied only by PlatformAdmin under the human-gated admin tier; the operator ruled on 2026-11-13 15:56Z (decision card, critique r3 finding 1) that Decision 126 cl.2's 'operators may always invoke it directly' covers the operator's own CloudShell applies, so 202 cl.1 binds applies an agent executes; plan B's sidecar note decision-202-note later records the reading in DECISIONS.md, and this plan's sidecar is unchanged."
  - "Quota first: VP 4 shows quota L-E5AE38E3 granted at 120000 before the build writes the service quota resource or VP 6 plans; the operator filed the request 2026-11-13 14:32Z (PENDING, current value 29000)."
  - "One merged-unapplied bootstrap change at a time: this PR merges only when no other bootstrap change is merged and unapplied (today #1987, rec-5025, whose apply is 0/0/0 by design and paused). If #1987 is still unapplied at CI green, VP 6's exact plan carries its merged content and shows no pending delta from it; the coordinator puts that evidence to the operator, whose ruling the one-at-a-time rule is. Plan B's bootstrap change queues after this apply; rec-4233 PR 1 after both. Scope amendment 2026-11-13: #2028 is merged and half-applied, so it is still the one merged-unapplied change; the fix PR completes it rather than adding a second, and PLAN-bootstrap-ci-gated-apply's BUILD PR 1 (#2033) and plan B's bootstrap PR stay unmerged until VP 12 prints BOOTSTRAP_PLAN_EXIT 0."
  - "Merge and VP 7 happen in one operator sitting: from merge, security_detector_probe.py expects the sixth alarm, so an hourly liveness run before the apply reports it missing; a security_detector_stale rec filed in that window is closed by plan B's VP 15 with VP 7's read-back (Overlaps obligation (g))."
  - "Cross-root dependency (Decision 223): the four permissions sit on functions terraform/personal owns. A personal-root replacement of a function drops its permission and the route returns 5XX until the operator re-applies this root; CI cannot re-create it (DenyDuckLakeResourcePolicyEdit). Code deploys change no function policy. No deploy-paths.yaml row indexes that heal yet (owed rec 20); owed rec 18's per-route 5XX alarms are its detection."
  - "Who can plan this root afterwards: PlatformAdmin's AdminOps grants no apigateway action, so once this lands only the break-glass user (the CloudShell lane VP 5 checks) can refresh terraform/bootstrap; terraform/bootstrap/CLAUDE.md's agent_platform_admin runbook already cannot run (the proxy refuses the role step). PLAN-bootstrap-ci-gated-apply's roles need API Gateway and Service Quotas refresh reads for this root; its planning thread is told, and its row 1 carries them. Accepted residual (critique r3): this plan gives PlatformAdmin no apigateway read, since no session can assume PlatformAdmin while the proxy refuses the role step, and the CloudShell lane and that plan's CI path are the root's refresh paths."
  - "No Lambda code changes and no client changes: no deploy channel runs. Until plan B deploys the telemetry writer's REST caller read, that route fails closed (its handler finds no requestContext.authorizer.iam and answers 403 missing_caller_identity); the resource policy refuses every caller before then anyway."
acceptance_criteria:
  - "Scope amendment 2026-11-13: the API Gateway account setting names ducklake-api-access-logs, whose one inline policy holds the seven logs actions of AWS's API Gateway logging policy (VP 12's ACCOUNT_ROLE_OK, ROLE_POLICY_ACTIONS, INLINE_POLICIES 1 and ATTACHED_POLICIES 0), and a fresh bootstrap plan after VP 12 is empty, so the root has converged (BOOTSTRAP_PLAN_EXIT 0). The trigger's stability rests on test_api_redeploys_on_change and the provider keeping configured attributes stable (inferred), since VP 12 writes no method or integration."
  - "terraform/bootstrap declares one Regional REST API with exactly four AWS_IAM POST routes (/ops/reader, /ops/writer, /telemetry/reader, /telemetry/writer) as AWS_PROXY integrations without credentials at 120000 ms, one stage with a body-free access log, a resource policy that denies every principal but agent-platform-session, one exact-route Lambda permission per function and one URL parameter per route, all gated to the sandbox environment; test_agent_ducklake_api.py's ten real-tree nodes pass and its red-case node shows each predicate failing on its mutations."
  - "The permissions boundary denies apigateway:DELETE and apigateway:P* (PATCH, POST, PUT) on every resource to every bounded identity, and its ceiling holds no apigateway or execute-api action (test_boundary_denies_api_gateway_writes); VP 6 measures the boundary at or below 5,632 B minified."
  - "Decision 202's detector gains platform-security-ducklake-api-change, matching any API Gateway write, any Lambda permission or resource-policy edit on a DuckLake verb function or denied, and any IAM write to the log role (fixture events, red cases, live logs:TestMetricFilter in VP 6; security_detector_probe.py expects six alarms); metric data shows it matching the apply's own API Gateway events (VP 8)."
  - "DECISIONS.md carries exactly the sidecar's words (approved_text verify passes)."
  - "After the operator's apply, a signed call from the agent environment's old identity to each route is refused by the resource policy's explicit deny, naming that identity, and a call to an absent route answers Missing Authentication Token, or the same explicit deny if API Gateway applies the policy before route matching (VP 9); the access log records the denied calls with status 403 (their caller field is informational: OLD_USER_LINES 0 is recorded, not a failure), and plan B's caller-record step (its VP 16) proves the field names the caller on allowed calls (VP 10); each integration reads 120000 ms (VP 8)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the changed and new tests, including every named node.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_agent_ducklake_api.py
      tests/checks/iam_tf/test_url_only_invoke_guard.py tests/checks/iam_tf/test_platform_role_iam_change_alarms.py
      tests/test_security_detector_probe.py tests/checks/iam_tf/test_platform_security_heartbeat_canary.py
      tests/checks/iam_tf/test_telemetry_prefix_fence.py tests/checks/iam_tf/test_ci_branch_boundary_state_fence.py
      tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py -q
    expected: >-
      All pass, including test_agent_ducklake_api.py's twelve test functions, the detector's pattern, fixture and five new
      red-case nodes, test_expected_alarms_match_the_hcl and test_platform_role_metadata_admin_scope.py (scanning
      agent_ducklake_api.tf once PLAN-bootstrap-ci-gated-apply's BUILD PR 1 is on main).
    fix_if: Any failure; fix the code or the Terraform, never an assertion's meaning (Decision 235).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates PR CI's diff-selected pytest of these files on every change; the named nodes in test_obligations pin
      the new behaviour. The detector's graduated shards (platform-role-iam-change-detector-declared,
      security-detector-probe-fails-closed) already cover its files; the new test_agent_ducklake_api.py has none, so
      only review and the full tier would notice its deletion, a gap this plan accepts until owed rec 5 graduates it
      as a test_selector shard with test_agent_session_user.py.
  - step: 2
    phase: pre-deploy
    action: >-
      Prove the policy-size, secret-grant, account-portability and tag-charset checks accept the new file (VP 3's --pre
      runs the region check).
    command: >-
      bin/venv-python -m scripts.checks.iam_tf.validate_iam_policy_size && bin/venv-python -m
      scripts.checks.iam_tf.validate_secret_parameter_grants && bin/venv-python -m
      scripts.checks.iam_tf.validate_terraform_tag_charset && bin/venv-python -c "from
      scripts.checks.iam_tf.validate_account_portable_names import validate_account_portable_names as v; f = []; v(f);
      print(chr(10).join(f) or 'PORTABLE_OK'); raise SystemExit(1 if f else 0)"
    expected: >-
      The policy-size check's PASS line counts one more bootstrap policy resource than on main (at the scope
      amendment's fix PR, the same count as main: the log role keeps one inline policy), the secret-grant and
      tag-charset checks exit 0, and PORTABLE_OK prints.
    fix_if: A finding names the resource; fix the Terraform, never the check.
    hermetic: false
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: >-
      Bind the governed wording to the sidecar, then run the full tier before handoff. The scope amendment's fix PR runs
      only the tier commands: its base already holds the three blocks, so verify --base origin/main reports MISMATCH
      there.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug agent-ducklake-rest-api --base origin/main &&
      export AWS_PROFILE=agent-platform-unset && bin/venv-python -m scripts.validate --pre && bin/venv-python -m
      scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      verify reports DECISIONS.md equal to its base words with the three blocks applied; the fast and full tiers pass
      and validation_result verifies the head (the full tier is started in the background from the top-level session).
      The profile no config names stops the DQ refresh at ProfileNotFound ("AWS credentials not available --
      skipping") instead of reaching the refused role chain.
    fix_if: >-
      Any mismatch; re-apply the block verbatim (only {{N}} and {{DATE}} may differ). "unexpected credential-check
      error" means the inline AWS_PROFILE was dropped: re-run with it.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      QUOTA CHECK, operator-run in AWS CloudShell in the PROD account, before the build writes the service quota
      resource (the HCL may be written meanwhile with the resource last). It reads the applied value and the latest
      request's status; nothing changes. Re-run when the operator reports AWS's case closed.
    command: >-
      ( unset AWS_PROFILE; aws service-quotas get-service-quota --service-code apigateway --quota-code L-E5AE38E3
      --query 'Quota.Value' --output text | sed 's/^/QUOTA_VALUE /'; aws service-quotas
      list-requested-service-quota-change-history-by-quota --service-code apigateway --quota-code L-E5AE38E3 --query
      'sort_by(RequestedQuotas, &Created)[-1].[Status,DesiredValue]' --output text | sed 's/^/LATEST_REQUEST /' )
    expected: QUOTA_VALUE 120000.0 and LATEST_REQUEST APPROVED 120000.0 (or CASE_CLOSED with the value applied).
    fix_if: >-
      PENDING or CASE_OPENED: wait for AWS; the build pauses before VP 6 and says so, never re-files. DENIED, or a value
      below 120000: stop; reversal condition quota-below-deadline fires and the plan returns to planning (a lower
      timeout with 504 retries of slow reads is not this plan's design). A value above 120000: the quota resource is
      written at the granted value and the integration local stays 120000, and test_api_integrations_are_proxy_without_credentials'
      equality between them is re-scoped only on the operator's word (Decision 235); the build asks first.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: >-
      ENVIRONMENT CHECK (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan), operator-run in AWS CloudShell in the
      PROD account: the shell's caller is user/platform-breakglass, never an agent identity. The build posts this block
      after the operator's final-diff word; the operator returns the one line. Its "caller-arn check" label is the
      marker validate_admin_root_premerge_gate reads; no repo helper runs in CloudShell.
    command: >-
      ( printf 'caller-arn check: '; aws sts get-caller-identity --query Arn --output text 2> /dev/null | grep -q
      ':user/platform-breakglass$' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT )
    expected: caller-arn check, ADMIN_CHAIN_OK. The ARN itself is never printed.
    fix_if: >-
      ADMIN_CHAIN_ABSENT; the operator signs in as the break-glass user and re-runs, and VP 6 waits. If the operator
      uses another admin sign-in by choice, the build records that in the PR comment and asks before VP 6.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      PRE-MERGE GATE (ADMIN), operator-run in AWS CloudShell after VP 4 and VP 5, posted only after the operator's
      final-diff word on the PR at PR_HEAD_SHA: planning runs provider code under the operator's admin sign-in, so a
      human reads the HCL first. The block has the shape of plan B's pre-merge admin plan: before init it
      refuses (SCREEN_REFUSED) a head whose diff from main's tip touches any terraform/ file other than the three
      terraform scope rows, or the region or version file, or adds a provider, module, external or http data source or
      provisioner. It fetches this public repo's PR head (the build writes the full sha into PR_HEAD_SHA) into a
      scratch folder under /tmp, installs the pinned terraform checked against HashiCorp's SHA256SUMS, reads the
      bootstrap variable values from /secret/agent-platform-terraform-personal-tfvars and account_id from the caller,
      never printing either, and plans terraform/bootstrap read-only (-lock=false) on the sign-in's own credentials
      (aws_profile empty). It then evaluates the new filter live with logs:TestMetricFilter (changes nothing) against
      nine events in scope row 7's shapes, and prints BOUNDARY_BYTES, the planned boundary document's byte count after
      jq -c (AWS's whitespace-free measure). An EXIT trap deletes the scratch folder; terraform errors go to
      $HOME/aps-tf.err, read in CloudShell only. The build records the returned lines as a counts-only PR comment.
    command: >-
      ( set -o pipefail; PR_HEAD_SHA=<full PR head sha>; W="${TMPDIR:-/tmp}/aps-api-head"; L="$HOME/aps-tf.err"; rm -rf
      "$W"; mkdir -p "$W/bin"; : > "$L"; trap 'rm -rf "$W"' EXIT; unset AWS_PROFILE; { git init -q "$W/repo" && git -C
      "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git +refs/heads/main:refs/o/main && git -C
      "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git "$PR_HEAD_SHA" && git -C "$W/repo" checkout -q
      --detach FETCH_HEAD; } 2>> "$L" || { echo CLONE_FAILED; exit 1; }; F=$(git -C "$W/repo" diff --name-only refs/o/main
      HEAD -- terraform config/aws-region config/terraform-version 2>> "$L" | LC_ALL=C sort | tr '\n' ' '); X=$(git -C
      "$W/repo" diff refs/o/main HEAD -- terraform 2>> "$L" | grep -E '^\+' | grep -cE 'data "(external|http)"|provider
      "|required_providers|module "|provisioner|local-exec'); [ "$F" = "terraform/bootstrap/agent_ducklake_api.tf
      terraform/bootstrap/github_ci_apply_boundary.tf terraform/bootstrap/platform_security_alarms.tf " ] && [ "$X" = 0 ] ||
      { echo SCREEN_REFUSED; exit 1; }; echo SCREEN_OK; R=$(tr -d '[:space:]' < "$W/repo/config/aws-region"); export
      AWS_REGION="$R" AWS_DEFAULT_REGION="$R"; V=$(tr -d '[:space:]' < "$W/repo/config/terraform-version"); case "$(uname
      -m)" in aarch64) P=linux_arm64 ;; *) P=linux_amd64 ;; esac; Z="terraform_${V}_${P}.zip"; { curl -fsSL -o "$W/$Z"
      "https://releases.hashicorp.com/terraform/$V/$Z" && curl -fsSL -o "$W/sums"
      "https://releases.hashicorp.com/terraform/$V/terraform_${V}_SHA256SUMS" && ( cd "$W" && grep " $Z\$" sums | sha256sum
      -c --quiet - ) && unzip -qo "$W/$Z" -d "$W/bin"; } >> "$L" 2>&1 || { echo TERRAFORM_INSTALL_FAILED; exit 1; }; export
      PATH="$W/bin:$PATH"; command -v jq > /dev/null || { echo JQ_ABSENT; exit 1; }; aws ssm get-parameter --name
      /secret/agent-platform-terraform-personal-tfvars --with-decryption --query Parameter.Value --output text >
      "$W/vars.tfvars" 2>> "$L" && test -s "$W/vars.tfvars" || { echo TFVARS_ABSENT; exit 1; }; A=$(aws sts
      get-caller-identity --query Account --output text 2>> "$L"); test -n "$A" || { echo IDENTITY_FAILED; exit 1; };
      B="$W/repo/terraform/bootstrap"; terraform -chdir="$B" init -input=false -backend-config="region=$R" > /dev/null 2>>
