rollback: >-
  Before plan B's cutover nothing uses the API, so rollback is a revert PR the operator applies from CloudShell: it
  destroys the API, its stage, policy, log role, account setting, permissions, parameters and the sixth alarm pair
  (the log group, skip_destroy, stays as the caller record), and removes the boundary statement (the quota stays raised; the service quota resource is dropped from
  state by a removed block with destroy = false, since destroying it cannot lower a quota). After plan B's cutover,
  the agent user's execute-api grant is revoked first by plan B's rollback. Destroying aws_api_gateway_account under provider 5.x only drops it from state, so the account's CloudWatch role setting keeps naming the deleted role: the revert's CloudShell block clears it with one update-account call (patch op replace, path /cloudwatchRoleArn, empty value) and reads it back empty. The revert leaves docs/DECISIONS.md alone (Decision 177 cl.1's append-only rule forbids
  deleting an entry): the new Decision gets a dated note saying it is reversed instead. A later re-land imports the
  kept log group rather than creating it.
