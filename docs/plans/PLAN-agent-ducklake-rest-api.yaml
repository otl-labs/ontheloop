      "$W/plan.txt" 2>> "$L"; echo "HEAD_PLAN_EXIT $?"; grep -E '^Plan: ' "$W/plan.txt"; terraform -chdir="$B" show -json
      "$W/head.bin" | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions | join(","))
      \(.address)"' | LC_ALL=C sort; echo "PR_HEAD_SHA $PR_HEAD_SHA"; P=$(terraform -chdir="$B" show -json "$W/head.bin" |
      jq -r '.resource_changes[] | select(.address ==
      "aws_cloudwatch_log_metric_filter.platform_security[\"platform-security-ducklake-api-change\"]") |
      .change.after.pattern'); t() { printf 'TMF %s %s\n' "$1" "$(aws logs test-metric-filter --filter-pattern "$P"
      --log-event-messages "$2" --query 'length(matches)' --output text 2>> "$L")"; }; t create-deployment
      '{"eventSource":"apigateway.amazonaws.com","eventName":"CreateDeployment","readOnly":false,"requestParameters":{"restApiId":"apiid00000"}}';
      t update-policy
      '{"eventSource":"apigateway.amazonaws.com","eventName":"UpdateRestApi","readOnly":false,"requestParameters":{"restApiId":"apiid00000","patchOperations":[{"op":"replace","path":"/policy"}]}}';
      t permission-by-name
      '{"eventSource":"lambda.amazonaws.com","eventName":"AddPermission20150331v2","readOnly":false,"requestParameters":{"functionName":"agent-platform-ducklake-reader","principal":"apigateway.amazonaws.com"}}';
