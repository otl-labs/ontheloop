  command: 'bin/venv-python -c "import re,pathlib; n=sum(len(pathlib.Path(f).read_bytes()) for f in (''AGENTS.md'',''CLAUDE.md''));
    b=int(re.search(r''root_ambient_load_set: (\d+)'', pathlib.Path(''config/prose_budgets.yaml'').read_text()).group(1)); assert
