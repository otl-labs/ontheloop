schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: agent-instruction-rules
intent: 'Put four rules two finished projects showed were missing into the one surface every session loads (AGENTS.md): claims
  cite their read-back, deployment principles, a hook canary, and the full tier''s runtime and verdict; correct the false gh statement;
  let the never-on-main hook pass writes outside the repo; and pay for it by compacting AGENTS.md so the ambient load shrinks and
  the S1 budget ratchets down. Joint-review plan E.'
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-agent-instruction-rules.yaml
phase: ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4705, rec-3204
  and rec-813 and joint-review items J-07 (AGENTS.md part), J-09, J-12, J-17, J-20.
scope:
- file: AGENTS.md
  action: Modify
  purpose: Apply the nine verbatim blocks in execution_steps (operator-approved text) and delete the Git-ops procedure's '- **Branch
    rule**' bullet (duplicate of the Branching section). No other AGENTS.md line changes.
- file: .claude/hooks/never_on_main.py
  action: Modify
  purpose: 'On main, block Edit/Write/MultiEdit/NotebookEdit only when the target (tool_input file_path, or notebook_path) resolves
    via os.path.realpath inside the repo top-level (git rev-parse --show-toplevel, realpath''d, run in the hook''s cwd). Keep blocking
    when the target key is missing or the top-level cannot be determined. Bash git commit/push handling and the fail-open-on-malformed-JSON
    branch are unchanged; the module docstring states the path scope, and the file''s three em dashes (two in the docstring, one
    in a comment) become ASCII hyphens (AGENTS.md code style). Only computes the path when the branch is main. Deny message: the
    first line and the ''verify with: git branch --show-current'' and ''See docs/contracts/git-ops.yaml ...'' lines stay; the line
    naming ''a harness-assigned claude/ session branch'' becomes ''the harness-assigned session branch'' (rec-4267''s hook site);
    the two lines ''If the result is still main, create a new branch before retrying: git checkout -b claude/your-slug'' become
    one line telling the agent to stop and tell the operator, since agents never create their own branch (AGENTS.md Branching).
    The file must keep the literal git-ops.yaml and must not contain the literal AGENTS.md (graduated registry check hooks-name-git-ops-contract).'
- file: tests/hooks/test_never_on_main.py
  action: Create
  purpose: 'Subprocess tests of the hook with CLAUDE_HOOK_BRANCH_OVERRIDE: on main, Write/Edit/MultiEdit/NotebookEdit to a tmp_path
    file outside the repo exit 0; the same tools on a path inside the repo exit 2; a relative path and a ''..''-traversal resolving
    into the repo exit 2; a symlink outside the repo pointing into it exits 2; a missing file_path exits 2; cwd outside any git
    repo (top-level unknown) exits 2 for an outside path; a linked git worktree (git worktree add in tmp_path, hook cwd = the worktree)
    blocks a path inside that worktree (Decision 25/138 edge); off main every case exits 0; Bash git commit/push on main still
    exits 2 and git status exits 0; malformed JSON exits 0; the deny message matches neither ''assigned .?claude/'' nor ''checkout
    -b claude/'' (rec-4267''s own oracle; the kept first line names .claude/hooks/); a sibling-prefix path (<repo-root>-x/f, outside
    the repo though its string starts with the root) exits 0. Tmp-repo commits set commit.gpgsign=false (precedent: tests/hooks/test_session_start_log_turn.py
    GIT_ENV), since this container signs commits globally.'
- file: tests/test_agents_md_rules.py
  action: Create
  purpose: 'Drift guards for the new AGENTS.md rules: (a) AGENTS.md''s hook canary names the literal [session_start_; each of .claude/settings.json
    and .claude/hooks/hooks.json registers at least one SessionStart hook script named session_start_*, and every registered SessionStart
    script so named contains that literal, so the canary cannot drift from what the hooks print (scripts not so named, such as
    plugin_hooks.py or a hook another plan adds, are outside the assertion); (b) the full-tier verdict command AGENTS.md names
    (scripts.checks.validation_result --verify-head) exists as a CLI flag in scripts/checks/validation_result.py; (c) AGENTS.md
    no longer says gh is deliberately not installed.'
- file: config/prose_budgets.yaml
  action: Modify
  purpose: Lower S1 root_ambient_load_set from 18935 to the measured post-change AGENTS.md + CLAUDE.md total plus 300 B, headroom
    the operator reserved for plan D's AGENTS.md sentence (Benjamin 2026-10-30 14:40Z). A decrease, so no raise marker; the line
    carries an inline comment '# 300 B reserved for PLAN D (Decision numbers at merge), operator 2026-10-30'. Touch no other key.
bundled_recommendations:
- rec-4705
- rec-3204
- rec-813
followon_recs:
- rec-4756
- rec-4758
- rec-4759
- rec-4764
