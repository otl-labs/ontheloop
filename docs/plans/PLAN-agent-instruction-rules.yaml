  keeps the meaning is pre-approved (context: standing ruling); it is made by updating the matching execution_steps block (so VP
  3 stays the oracle), applying that block, and listing the amendment in the PR body and to Benjamin. The implementer never rewords
  on its own judgement: on a failing pin it stops and reports, and the lead session decides whether a meaning-preserving amendment
  fixes it. A change of meaning needs Benjamin''s word again.'
- 'Prose budget: decrease only; no raise marker (Decision 128/165 discipline).'
- Root CLAUDE.md stays exactly '@AGENTS.md' (Decision 139, validate_claude_md_pointer_invariant).
- Do not edit Decision 76's body for the gh correction (Decision 177 append-only).
- No rescue agents or workaround loops (Decision 55).
