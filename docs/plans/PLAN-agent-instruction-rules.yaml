- rec-2960
infrastructure_dependencies: []
acceptance_criteria:
- Each of the nine execution_steps verbatim blocks appears byte-for-byte in AGENTS.md and the Git-ops Branch rule bullet is gone
  (VP 3).
- AGENTS.md + CLAUDE.md total bytes are below 18902 (today) and the new S1 budget equals that total plus 300 (VP 4).
- never_on_main passes an outside-repo write on main and still blocks every in-repo write, commit and push on main (VP 1).
- The canary literal matches every registered session_start_* SessionStart hook script; the verdict command exists (VP 2).
- Every existing test that reads AGENTS.md passes unchanged (VP 5).
- The stored acceptance of rec-4705, rec-3204 (retargeted to AGENTS.md at planning, read back) and rec-813 passes on the finished
  tree (VP 6, VP 9); all three close at merge through the Resolves trailer (VP 8).
- Full tier exits 0 and --verify-head attests HEAD before push (VP 7).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Hook path-scoping tests (J-20, IAM-F04).
  command: bin/venv-python -m pytest tests/hooks/test_never_on_main.py -q
  expected: exit 0; every case passes. Before the change the file does not exist.
  expected_literals:
  - passed
  fix_if: An in-repo write, commit or push on main exits 0 -- the scoping widened the hole; fix the hook, never the case.
  hermetic: true
  graduation: graduate
  graduation_check_id: never-on-main-repo-scoped
- step: 2
  phase: pre-deploy
  action: AGENTS.md rule drift guards.
  command: bin/venv-python -m pytest tests/test_agents_md_rules.py -q
  expected: exit 0. Before the change the file does not exist.
  expected_literals:
  - passed
  fix_if: A SessionStart hook lacks the prefix -- report it (that hook is out of scope); the canary text is approved verbatim and
    does not change.
  hermetic: true
  graduation: graduate
  graduation_check_id: agents-md-hook-canary-marker
- step: 3
  phase: pre-deploy
  action: Approved text landed verbatim.
  command: bin/venv-python -c "import yaml,pathlib; p=yaml.safe_load(open('docs/plans/PLAN-agent-instruction-rules.yaml')); a=pathlib.Path('AGENTS.md').read_text(encoding='utf-8');
    b=[s.split(chr(10),1)[1].rstrip(chr(10)) for s in p['execution_steps'] if s.startswith('AGENTS.md verbatim block')]; miss=[i+1
    for i,x in enumerate(b) if x not in a]; old=['**Branch rule**','Other Bash commands (e.g.','surfaces eligible work, CI-RCA
    triage','Source-of-truth by table','CC-web commits ARE SSH-signed','Lambda-packaged','Do **not** write to the auto-memory system','deliberately
    not installed in either container','creating a new branch']; left=[o for o in old if o in a]; assert len(b)==9 and not miss,
    miss; assert not left, left; print('VERBATIM_OK', len(b))"
  expected: Prints VERBATIM_OK 9.
  expected_literals:
  - VERBATIM_OK 9
  fix_if: A block is missing or differs, or an old-text sentinel is left -- copy the block again from execution_steps and remove
    the replaced text; never reword approved text yourself (constraint 1's amendment path).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Bound to this plan's own execution_steps; once merged, step 2's guard, the AGENTS.md-reading tests
    and the registry shards VP 10 replays carry the regression role.
- step: 4
  phase: pre-deploy
  action: Net compaction and S1 ratchet-down.
  command: 'bin/venv-python -c "import re,pathlib; n=sum(len(pathlib.Path(f).read_bytes()) for f in (''AGENTS.md'',''CLAUDE.md''));
    b=int(re.search(r''root_ambient_load_set: (\d+)'', pathlib.Path(''config/prose_budgets.yaml'').read_text()).group(1)); assert
    n<18902 and b==n+300, (n,b); print(''S1_OK'', n, b)"'
  expected: Prints S1_OK, the new total (about 16955) and the budget (total plus 300, about 17255).
  expected_literals:
  - S1_OK
  fix_if: Budget is not the measured total plus 300 -- set it so (still a decrease from 18935); never raise above 18935.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_prose_limits already enforces current <= budget in every tier; the exact value is a one-time
    ratchet fact that plan D then spends.
- step: 5
  phase: pre-deploy
  action: Every existing test that reads AGENTS.md still passes (the registry's graduated pins are VP 10).
  command: bin/venv-python -m pytest -q $(grep -rl AGENTS tests --include=*.py | grep -v test_agents_md_rules.py)
  expected: exit 0 (686 passed, 1 skipped on the planning draft).
  fix_if: A pin fails -- stop and report; the lead session applies constraint 1's amendment path (meaning kept) or asks Benjamin
    (meaning changed); the implementer never rewords.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Existing suites; they run in the full tier and post-merge. Non-hermetic because it re-runs 35 existing
    files (about 50 s), beyond the replay budget's purpose.
- step: 6
  phase: pre-deploy
  action: Rec acceptance oracles hold at the closing commit (Decision 201).
  command: '! grep -q ''deliberately not installed in either container'' AGENTS.md && grep -q ''cloud image'' AGENTS.md && grep
    -q ''CI runner steps may use'' AGENTS.md && grep -q ''scripts.checks.validation_result --verify-head'' AGENTS.md && grep -q
    ''never a pipe'' AGENTS.md && ! grep -q ''Memory policy .* CLAUDE.md is canonical persistence'' AGENTS.md && grep -qE ''AGENTS[.]md
    is (the )?canonical'' AGENTS.md && echo ACCEPT_OK'
  expected: Prints ACCEPT_OK.
  expected_literals:
  - ACCEPT_OK
  fix_if: Fails -- the AGENTS.md blocks are not applied; re-run step 3.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates the three recs' own stored acceptance, which the closure job runs at merge.
- step: 7
  phase: pre-deploy
  action: Full tier and HEAD attestation (handoff_policy).
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Both exit 0. Run backgrounded from the top-level session with a 2 h limit (the rule this plan adds).
  fix_if: A failure -- fix and rerun from the start; a timeout is blocked, never skipped.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: 'Before merge: the three bundled recs'' STORED acceptance (read from the warehouse) passes on the finished tree.'
  command: bin/venv-python -c "import subprocess; from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
    rows,m=fetch_recs_by_ids(make_reader(),['rec-4705','rec-3204','rec-813']); assert not m and len(rows)==3, m; bad=[r['id'] for
    r in rows if subprocess.run(['bash','-c',r['acceptance']]).returncode!=0]; assert not bad, bad; print('STORED_ACCEPT_OK')"
  expected: Prints STORED_ACCEPT_OK.
  fix_if: A rec's stored acceptance fails -- read it back; if it differs from the plan's context, stop and report, never rewrite
    it to pass.
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: pre-deploy
  action: Replay every graduated registry shard guarding AGENTS.md, CLAUDE.md, config/prose_budgets.yaml or .claude/hooks/ (no
    validator replays unmodified shards).
  command: bin/venv-python -c "import glob,yaml; from scripts.verification_graduation import materialize_check_in_tree as m; T=('AGENTS.md','CLAUDE.md','config/prose_budgets.yaml','.claude/hooks/');
    A={'prose-budgets-reseeded-to-measured','prose-budgets-s4-entries-equal-measured-and-marker-free','agents-md-lambda-deploy-channel-rule-present'};
    R=[yaml.safe_load(open(f)) for f in sorted(glob.glob('config/agent/verification_registry/entries/*.yaml'))]; R=[r for r in
    R if str(r.get('guard_target','')).startswith(T)]; bad=[r['check_id'] for r in R if r['check_id'] not in A and m(r,None).run().status.name!='PASS'];
    assert len(R)>=20 and not bad, bad; print('REGISTRY_OK', len(R))"
  expected: Prints REGISTRY_OK and the shard count (20 at planning).
  fix_if: 'A shard outside the allowlist fails -- the change broke a pin: stop and report (approved text is fixed). Allowlist,
    all red on main before this plan: prose-budgets-reseeded-to-measured (stays red by the operator''s 300 B reserve until plan
    D spends it), prose-budgets-s4-entries-equal-measured-and-marker-free (unrelated S4 drift), agents-md-lambda-deploy-channel-rule-present
    (stale pattern, rec-3379).'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Re-runs existing graduated shards, including hook unit suites; the registry itself is the standing
    guard.
- step: 8
  phase: post-deploy
  action: 'Closure: all three recs closed by the Resolves trailer.'
  command: bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows,_=fetch_recs_by_ids(make_reader(),['rec-4705','rec-3204','rec-813']);
    s={r['id']:r['status'] for r in rows}; print(s); assert s=={'rec-4705':'closed','rec-3204':'closed','rec-813':'closed'}, s"
  expected: All three statuses closed (a missing row fails the assertion).
  fix_if: Open -- read the closure job log; an acceptance failure means rec-3204's retarget did not land before merge.
  hermetic: false
