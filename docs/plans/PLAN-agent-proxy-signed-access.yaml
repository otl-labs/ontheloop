  - Never write a key, account id, ExternalId, Function URL host or ARN containing an account id into the repo, a PR, a comment or the shared folder (AGENTS.md public boundary, Decision 101); probes print tokens, never AWS error text.
  - The governed files get exactly the sidecar's words (Decision 246); the operator's word on the final diff is still required for the IAM text under terraform/bootstrap and the session-start hook (coordinator always_ask).
