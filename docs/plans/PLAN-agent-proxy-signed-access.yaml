execution_steps:
  - "At build start, post VP 4's operator prep to the build thread; coding proceeds while it waits, and VP 4's result gates merge. Until cutover the build prefixes every repo command it runs (bin/venv-python, the fast and full tiers, preflight, postflight) with AWS_PROFILE=agent-platform-unset, so it stops at ProfileNotFound before any request and never tries the refused role chain; preflight then runs in its degraded mode with null recs fields, and the CI-RCA override is asked at build start."
  - "Tests first per the test scope rows (the five test files, the detector's pattern helper, red-case list and fixture), seen red on the unchanged tree (record the red run), except test_no_session_code_mints_credentials, which is green before and after (its synthetic red case proves it can fail), and test_expected_alarms_match_the_hcl, red only between the HCL edit and the EXPECTED_ALARMS edit. Post: the named nodes exist and fail."
  - "terraform/bootstrap/agent_session_user.tf per scope row 1, reusing platform_dev_policies.tf's function locals and Deny statements, then the sixth detector pair in platform_security_alarms.tf and EXPECTED_ALARMS in security_detector_probe.py. Post: VP 1-2 pass."
  - "scripts/aws_identity.py, .claude/hooks/session_start_aws.sh and the bin/setup-cloud-env.sh header per their rows. Post: VP 1 and VP 5 pass."
  - "Hand-apply the sidecar's ten blocks verbatim, {{N}} the next free Decision number at build time and {{DATE}} the build date; AGENTS.md shrinks, so lower config/prose_budgets.yaml's S1 root_ambient_load_set to the measured value (the prose_budgets_ratchet_down sanction). Post: VP 3 passes."
  - "Commit Flow (implement skill; git-ops.yaml handoff_sequence): full tier, push, PR. At CI green, with VP 4 passed, ask the operator's final-diff word on the head, naming its full sha (the terraform/bootstrap IAM text and the session-start hook first); only after that word post VP 6 and VP 7's blocks at that sha and record the returned lines; merge only the head both cover (any new head, a rebase for {{N}} included, needs the word and VP 6-7 again first), only after #1987 is applied, and only when the operator is ready to run VP 8 in the same sitting."
  - "After merge: post VP 8's block; on its lines, post VP 9's procedure; on 'cutover done', run VP 10-13 in a fresh session (the build thread itself if it was started after cutover, else a fresh one the coordinator starts)."
  - "Report: what was implemented, the operator-reported lines, VP 4 and VP 10-12 results, the filed rec ids and the merge SHA."
rollback: >-
  Before cutover: revert the squash commit and, if VP 8 ran, the operator applies the revert from CloudShell after a
  reviewed PR removes prevent_destroy (the user, its policies and the sixth alarm pair go); if VP 4 stopped, the
  operator removes the hosts it added. After cutover:
  deactivate the new key; sessions lose AWS again, which is today's state (the old chain stays refused), and threads
  fall back to operator blocks until a fix lands.
