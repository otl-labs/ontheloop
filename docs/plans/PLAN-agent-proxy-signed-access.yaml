    action: Bind the governed wording to the sidecar, then run the full tier before handoff.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug agent-proxy-signed-access --base origin/main &&
      export AWS_PROFILE=agent-platform-unset && bin/venv-python -m scripts.validate --pre && bin/venv-python -m
      scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      verify reports every bound file equal to its base words with the ten blocks applied; the fast and full tiers pass
      and validation_result verifies the head (the full tier is started in the background from the top-level session);
      within it validate_test_coverage keeps handler.py at 100% line coverage through test_handler.py.
      The full tier runs on a profile no config names, so its DQ refresh stops at ProfileNotFound and reports "AWS
      credentials not available -- skipping" instead of reaching the refused role chain.
    fix_if: >-
      Any mismatch; re-apply the block verbatim (only {{N}} and {{DATE}} may differ). "unexpected credential-check
      error" means the inline AWS_PROFILE was dropped and the old role chain was tried: re-run with it, never with a
