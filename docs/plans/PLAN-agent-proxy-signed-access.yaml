      report it. One AccessDenied line names the missing grant by its label: a plan defect (routing.plan_defect), never
      an ad-hoc widening. InvalidClientTokenId, UnrecognizedClientException, IncompleteSignature,
      SignatureDoesNotMatch, ResponseParserError or OTHER means the proxy did not sign that host with the new key: check
