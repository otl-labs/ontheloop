infrastructure_dependencies:
  - "Plan A first: PLAN-agent-ducklake-rest-api's build is merged and applied and its old-key probe returned EXPLICIT_DENY_OLD_USER on the four routes before the main build PR starts (VP 5); this plan's policy names plan A's API, stage and route map, and its clients read plan A's route parameters."
  - "terraform/bootstrap is admin-only (environment-taxonomy.yaml axis_a): the operator plans it pre-merge (VP 7-8) and applies it post-merge (VP 9) from AWS CloudShell as user/platform-breakglass. Each block is self-contained (public-repo fetch at a sha, pinned terraform whose zip is checked against HashiCorp's SHA256SUMS, an integrity check, not a signature check; variables from SSM; account id from the caller)."
  - "One merged-unapplied bootstrap change at a time: the main build PR merges only after plan A's bootstrap change and #1987 (rec-5025) are applied, and before rec-4233 PR 1 and rec-5026's bootstrap changes merge. If another bootstrap change is merged and unapplied at this build's CI green, VP 8's exact ten-create plan shows whether it has a pending delta, and the coordinator puts that evidence to the operator, whose ruling the one-at-a-time rule is."
  - "Apply precedes cutover: VP 11's key and network-secret edits need the user that VP 9 creates. Deploy precedes cutover (Decisions 249 and 254): the telemetry writer's REST caller read and the clients' switch ship through the governed channels (VP 10) before any environment sets OTL_OPS_VERBS_TRANSPORT, so until cutover every caller keeps today's Function URL path."
  - "Merge and VP 9 happen in one operator sitting: from merge, security_detector_probe.py expects the seventh alarm, so an hourly security-detector-liveness run before the apply reports it missing; a security_detector_stale rec filed in that window is closed in VP 15 with VP 9's read-back."
  - "Lambda code changes: src/lambdas/ducklake_telemetry_writer/handler.py (ducklake_telemetry_writer and its smoke twin) and src/common/ducklake_reader_client.py (bundled into data-pipeline; also a DuckLake watched path, so the DuckLake channel redeploys its functions). Both ship through their governed channels, .github/workflows/deploy-ducklake-lambdas.yml on its own and deploy-prod-lambdas.yml by one workflow_dispatch, since data-pipeline's watched paths omit the file (VP 10). Model-ID validation: not applicable, since neither changed file selects or calls a model."
acceptance_criteria:
  - "terraform/bootstrap declares agent-platform-session under its own boundary, whose ceiling is exactly its ducklake and observe statements, with exactly the three attached managed policies; test_agent_session_user.py's ten real-tree nodes pass, and its red-case node shows each predicate failing on one mutation per class: an extra verb, a Lambda invoke grant, a wildcard or extra route, an S3 grant, a secret grant, a missing PlatformDev Deny, an unlisted ExternalId trust, a missing escalation Deny, a missing temporary-credential Deny, an access-key resource, the shared boundary or a widened own boundary, a missing prevent_destroy, a non-default path or another user name, an API Gateway grant and a user-write verb in the shared boundary ceiling."
  - "Decision 202's detector gains platform-security-agent-session-iam-change, matching any IAM write, made or denied, that names agent-platform-session or an agent-platform-session-* policy (fixture events and red cases in the detector tests; security_detector_probe.py expects seven alarms); it is live from VP 9's apply, before the key exists, and metric data shows it matching the key creation (VP 11) and the denied write (VP 14, read in VP 15)."
  - "No session code calls a credential-returning STS API (test_no_session_code_mints_credentials), and a token minted from the user's key is denied every action IAM policy can deny, which is all but GetCallerIdentity (test_agent_session_temporary_credentials_denied)."
  - "With OTL_OPS_VERBS_TRANSPORT=execute_api the reader, writer, telemetry reader and telemetry writer clients resolve plan A's route parameters and sign for execute-api, with no Function URL fallback; unset, they behave as today (VP 2's named nodes), and the test suite deletes the variable, so it runs the same in a cut-over session (test_transport_selection_env_var_deleted, which fails in CI without the deletion). The telemetry writer accepts the REST caller identity, keeps the Function URL one and refuses any other or mixed shape (test_caller_shapes.py's four nodes)."
  - "scripts.aws_identity caller-arn reads the identity from the profile's own session; the session-start hook reports OK: user/agent-platform-session for that user, warns otherwise and warns when the transport variable is not execute_api."
  - "DECISIONS.md, AGENTS.md and deploy-paths.yaml carry exactly the sidecar's words (approved_text verify passes), ports.yaml and project-configuration.yaml pass their checks within budget, and the stale-reference sweep leaves only the residue owed rec 7 names (VP 6)."
  - "After the operator's apply, the governed deploys and cutover, a fresh session reads the ops store through the reader's API route, files recs through the writer's, answers describe from the telemetry reader and writer routes (the writer's 200 proves the REST caller read), reads endpoints, logs, metrics and role policies, and is denied PlatformDev's trust document, a /secret/ read, an IAM write and a log group outside its prefix (VP 12-15), and the API access log names it as the caller on all four routes (VP 16). The user holds no Lambda grant; S3 is unreachable because no S3 host is listed and no S3 action is granted."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the changed and new credential-free tests that need no DuckDB, including every named node.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_agent_session_user.py tests/test_aws_identity.py
      tests/test_sts_call_sites.py tests/hooks/test_session_start_aws.py tests/test_setup_cloud_env.py
      tests/checks/iam_tf/test_url_only_invoke_guard.py tests/checks/iam_tf/test_platform_role_iam_change_alarms.py
      tests/test_security_detector_probe.py tests/checks/iam_tf/test_platform_security_heartbeat_canary.py
      tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py -q
    expected: >-
      All pass, including test_agent_session_user.py's eleven nodes, test_no_session_code_mints_credentials and
      test_minting_scanner_flags_a_synthetic_call, test_warns_when_transport_is_not_execute_api, the detector's
      pattern, fixture and five new red-case nodes, test_expected_alarms_match_the_hcl and
      test_platform_role_metadata_admin_scope.py (whose file-set node, once PLAN-bootstrap-ci-gated-apply's BUILD PR 1
      is on main, counts agent_session_user.tf as unscanned).
    fix_if: Any failure; fix the code or the Terraform, never an assertion's meaning (Decision 235).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates PR CI's diff-selected pytest of these files on every change; the named nodes in test_obligations pin
      the new behaviour. Six graduated shards already cover the changed files (aws-identity-caller-arn,
      session-start-aws-caller-arn, sts-call-site-census, setup-cloud-env-proxy-template,
      platform-role-iam-change-detector-declared, security-detector-probe-fails-closed); the new
      test_agent_session_user.py has none, so only review and the full tier would notice its deletion, a gap this
      plan accepts (owed rec 5 graduates it).
  - step: 2
    phase: pre-deploy
    action: >-
      Run the transport-switch and caller-read tests with the variable exported, as a cut-over session runs them, so
      the existing Function URL nodes prove the suite deletes it. Not hermetic: test_writer_transport.py and the
      telemetry writer handler tests import DuckDB, which a venv-less replay lacks, so -rs shows any skip. The marker
      filter deselects test_conftest_hermeticity.py's integration-marked nodes, as the fast and full tiers do: they keep
      the session's AWS_PROFILE, which before cutover is the unresolvable prefix (ProfileNotFound); none is named here.
    command: >-
      OTL_OPS_VERBS_TRANSPORT=execute_api bin/venv-python -m pytest
      tests/common/ducklake_reader_client/test_transport_selection.py tests/common/ducklake_reader_client/test_ducklake_reader.py
      tests/ops_data_portal/test_writer_transport.py tests/telemetry_capture/test_transport.py
      tests/telemetry_capture/test_read_route.py tests/lambdas/ducklake_telemetry_writer/test_caller_shapes.py
      tests/lambdas/ducklake_telemetry_writer/test_handler.py tests/test_conftest_hermeticity.py -q -rs -m "not integration"
    expected: >-
      All pass with no skipped test: test_transport_selection.py's seven nodes, the two new writer-transport nodes, the
      four new telemetry transport nodes, the two new read-route nodes and test_caller_shapes.py's four nodes, with
      every existing node in those files, and test_handler.py, unchanged and green, the six Function URL nodes the
      tests/conftest.py row names included, and test_transport_selection_env_var_deleted green (the fixture PR is on main);
      the integration-marked nodes show as deselected, which is not a skip.
    fix_if: >-
      A skip naming duckdb: the venv lacks it, so the run proves nothing; sync the venv and re-run. Any failure: fix the
      code, never an assertion's meaning (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A session-environment check: it exports a variable CI never sets, so a registry replay in CI would prove only what
      PR CI's diff-selected run of these files proves; the named nodes in test_obligations pin the switch and the caller
      read, and test_transport_selection_env_var_deleted pins the deletion in CI. The telemetry writer's shard-registered tests (Feedback Loop's) stay as they are.
  - step: 3
    phase: pre-deploy
    action: Prove the IAM policy-size, secret-grant, account-portability, ports and project-configuration checks accept the change.
    command: >-
      bin/venv-python -m scripts.checks.iam_tf.validate_iam_policy_size && bin/venv-python -m
      scripts.checks.iam_tf.validate_secret_parameter_grants && bin/venv-python -c "from
      scripts.checks.iam_tf.validate_account_portable_names import validate_account_portable_names as a; from
      scripts.checks.contracts.validate_ports_contract import validate_ports_contract as p; from
      scripts.checks.contracts.validate_project_configuration import validate_project_configuration as c; f = []; a(f);
      p(f); c(f); print(chr(10).join(f) or 'CHECKS_OK'); raise SystemExit(1 if f else 0)"
    expected: >-
      The policy-size check's PASS line counts four more bootstrap policy resources than on main (ducklake, observe,
      guard and the boundary), the secret-grant check exits 0, and CHECKS_OK prints.
    fix_if: A finding names the resource or row; fix the Terraform or the contract row, never the check.
    hermetic: false
    graduation: not-applicable
