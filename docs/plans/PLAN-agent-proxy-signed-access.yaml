schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "agent-proxy-signed-access"
intent: >-
  Give agent sessions their AWS access back without any session minting or holding an AWS credential: one new IAM user,
  agent-platform-session, whose key only each environment's egress proxy holds, signs every call itself with grants
  narrowed to what sessions use, and admin work moves to operator-run CloudShell blocks until a follow-on admin
  environment lands (new Decision amending Decision 113).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-agent-proxy-signed-access.yaml
phase: >-
  security_advisory (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  since 2026-11-12 the agent proxy refuses sts:AssumeRole, so no session reaches AWS. The operator approved writing
  this plan with every presented recommendation on 2026-11-13 00:01Z. Closes no roadmap criterion; no rec exists
  because the recs store is unreachable until this plan's cutover (VP 11 files the owed recs).
scope:
  - file: terraform/bootstrap/agent_session_user.tf
    action: Create
    purpose: >-
      aws_iam_user.agent_session (name agent-platform-session, permissions_boundary =
      aws_iam_policy.github_ci_apply_boundary.arn, lifecycle prevent_destroy, no resource tags so the provider's
      default_tags apply) and three
      customer-managed policies, aws_iam_policy.agent_session_ducklake, .agent_session_observe and .agent_session_guard,
      attached by aws_iam_user_policy_attachment resources of the same three names (an IAM user's inline policies share
      a 2,048 character quota), each from a hoisted local with a lifecycle precondition at the 6,144 B managed-policy
      limit (validate_iam_policy_size). agent-platform-session-ducklake: Sids DuckLakeInvokeUrl and
      DuckLakeInvokeViaUrlOnly copied from platform_dev_policies.tf:54-88 over the same four function locals (the second
      with Bool lambda:InvokedViaFunctionUrl = "true"), and DuckLakeEndpointDiscovery ssm:GetParameter on
      parameter/agent-platform/ducklake/* (it holds the Function URLs and the telemetry catalog name, no SecureString
      [verified by reading terraform/personal]). agent-platform-session-observe: ObservabilityMetricRead and
      ObservabilityLogStreamRead copied from platform_dev_policies.tf:119-141, and IAMRoleRead iam:GetRole,
      iam:GetRolePolicy, iam:ListRolePolicies, iam:ListAttachedRolePolicies on arn:aws:iam::${var.account_id}:role/*
      (the boundary ceiling's read verbs; no ListRoles or GetAccountAuthorizationDetails, which return trust
      documents). agent-platform-session-guard, Deny statements only: the eight DailyOps Deny statements copied verbatim
      with their Sids (platform_dev_policies.tf:143-270: DenyStateAndConvergenceWrite, DenyStateRead,
      DenyTerraformArtifactRead, DenyTerraformArtifactWrite, DenyReviewTranscriptRead, DenyReviewTranscriptWrite,
      DenyStateAndConvergenceVersionRead, DenyStateAndConvergenceVersionList); DenyExternalIdTrustRead, iam:GetRole on
      aws_iam_role.platform_dev.arn and aws_iam_role.platform_admin.arn (their trust documents carry the ExternalIds;
      removed when owed rec 3 retires those trusts); DenySessionEscalation on "*": sts:AssumeRole*, sts:AssumeRoot,
      sts:GetFederationToken, iam:Create*, iam:Update*, iam:Put*, iam:Attach*, iam:Detach*,
      iam:Delete*, iam:Add*, iam:Remove*, iam:Tag*, iam:Untag*, iam:Set*, iam:Upload*, iam:Enable*, iam:Deactivate*,
      iam:Change*, iam:Reset*, iam:PassRole; DenyTemporaryCredentialUse, Action "*" on Resource "*" with the one
      condition Null aws:TokenIssueTime = "false": STS takes no policy on GetSessionToken, so the call cannot be denied,
      but every request signed with a token minted from the key (GetSessionToken or GetFederationToken) is, while the
      proxy's long-term-key signatures carry no token and pass. No S3 Allow (no convergence read: the S3 host stays off the proxy's list so
      presigned telemetry PUTs pass unsigned; owed rec 6 serves the record through the reader). No aws_iam_access_key
      (its secret would land in state), no inline policy, no literal account id, bucket name or region.
  - file: tests/checks/iam_tf/test_agent_session_user.py
    action: Create
    purpose: >-
      Credential-free text tests over the new file in the iam_tf convention (test_url_only_invoke_guard.py:1-3): each
      check is a predicate over the Terraform text that returns a problem list, so its red case drives the real
      predicate on mutated input. Eleven nodes. Ten assert an empty problem list on the real tree:
      test_agent_session_user_carries_boundary (the boundary reference and prevent_destroy);
      test_agent_session_invoke_is_url_only (every lambda:InvokeFunction Allow carries the Bool condition; the invoke
      Resources name exactly the reader, writer, telemetry reader and telemetry writer locals);
      test_agent_session_grants_are_closed (the union of Allow actions equals the declared set in row 1, so a new verb
      fails until this test names it); test_agent_session_never_reaches_state_or_secrets (no Allow names an s3 action,
      parameter/secret/, a secretsmanager ARN or an iam verb outside the four reads; Decision 238 cl.1);
      test_agent_session_carries_platform_dev_denies (every Deny Sid in local.platform_dev_runtime_policy_json appears in
      the guard policy with the same Action and Resource text, and the parsed Sid set holds at least the eight row 1
      names, so an empty parse fails); test_agent_session_cannot_read_externalid_trusts (the aws_iam_role resources
      under terraform/ whose trust mentions sts:ExternalId are exactly the roles DenyExternalIdTrustRead names, and that
      set holds at least PlatformDev and PlatformAdmin, so an empty parse fails); test_agent_session_escalation_denied
      (DenySessionEscalation's Action set equals row 1's twenty verbs exactly, as grants_are_closed pins the Allows);
      test_agent_session_temporary_credentials_denied (the guard holds a Deny of Action "*" on Resource "*" whose only
      condition is Null aws:TokenIssueTime = "false");
      test_agent_session_has_no_key_resource (no resource block of type aws_iam_access_key, aws_iam_user_policy,
      aws_iam_user_login_profile, aws_iam_service_specific_credential, aws_iam_signing_certificate or
      aws_iam_user_ssh_key, matched as whole resource types so aws_iam_user_policy_attachment does not count, anywhere
      under terraform/; none exists today [verified by grep]);
      test_agent_session_boundary_holds_no_user_write (the boundary's Allow ceiling in github_ci_apply_boundary.tf names
      no iam action containing User, AccessKey, LoginProfile, PolicyVersion, ServiceSpecificCredential, SSHPublicKey,
      SigningCertificate or MFA, and no iam wildcard, while the parsed ceiling holds at least iam:GetRole and
      iam:PassRole, so a parse truncated by a bracket in a comment fails: the premise context's Decision 144/225 note
      rests on).
      The eleventh, test_agent_session_predicates_are_red_on_each_mutation, is parametrized over one mutation of the real
      text per class and asserts each yields a problem: an extra Allow verb, an iam verb beyond the four reads, an
      InvokeFunction Allow without the Bool condition, a fifth function in the invoke Resources, an s3:GetObject
      Allow, a parameter/secret/ Resource, a secretsmanager ARN Resource, a dropped DailyOps Deny Sid, an extra aws_iam_role
      with an sts:ExternalId trust, iam:PassRole dropped from DenySessionEscalation, DenyTemporaryCredentialUse dropped, an
      added aws_iam_access_key resource, a
      dropped permissions_boundary, a dropped prevent_destroy and iam:CreateAccessKey added to the boundary ceiling.
  - file: scripts/aws_identity.py
    action: Modify
    purpose: >-
      caller_arn(profile) calls GetCallerIdentity from the profile's own session (its configured region, the
      proxy-signed host) with the existing bounded Config; IDENTITY_PROBE_REGION and the second-region client are
      removed. The module docstring's rule becomes: no session code calls sts:AssumeRole, GetSessionToken,
      GetFederationToken or any other API that returns credentials (Decision {{N}} cl.1); identity reads go through
      this helper; exit-code-only liveness probes and account-id reads stay exempt. CLI output and masking unchanged, and
      caller_arn keeps raising RuntimeError when the profile resolves no credentials.
  - file: tests/test_aws_identity.py
    action: Modify
    purpose: >-
      test_identity_call_uses_profile_session replaces test_identity_call_uses_probe_region (rewrite: the STS client
      comes from the profile session with no region override and no explicit credentials);
      test_probe_region_differs_from_project_region is retired with IDENTITY_PROBE_REGION (the constant it pins is
      deleted; the replacement node asserts the call shape, the STS client built from the profile session with no
      region_name, and never names IDENTITY_PROBE_REGION, so VP 5's residue stays as listed). The CLI still masks the account id and prints only
      exception type and error code on failure; profile None uses the default chain; test_no_credentials_raises stays
      (existing nodes unchanged).
  - file: tests/test_sts_call_sites.py
    action: Modify
    purpose: >-
      Docstring re-points at the new rule; adds test_no_session_code_mints_credentials: no non-comment line of any
      tracked text file, whatever its suffix (so the extensionless bin/ scripts the census's SCANNED_SUFFIXES skips are
      read), under scripts/, src/, bin/ or .claude/hooks/ (scripts/ci included: nothing there may mint either) matches the
      call-shaped patterns \.(assume_role\w*|assume_root|get_session_token|get_federation_token)\( or
      aws\s+sts\s+(assume-role[\w-]*|assume-root|get-session-token|get-federation-token)\b, so the web-identity and SAML variants
      match while assume_role_policy and prose mentions do not (zero hits today under those four roots [verified by grep]; only history under docs/plans matches); and
      test_minting_scanner_flags_a_synthetic_call, the red case in test_scanner_names_an_extra_sts_file's shape (a tmp
      git tree whose offender file calls assume_role_with_web_identity( and whose commented line does not count). The
      census ALLOWED map and scan_sts_call_sites are unchanged.
  - file: .claude/hooks/session_start_aws.sh
    action: Modify
    purpose: >-
      Reports the proxy-signed user: on a caller ARN ending :user/agent-platform-session it logs
      "OK: user/agent-platform-session"; on an assumed-role or any other identity it logs a WARNING naming
      bin/setup-cloud-env.sh's header (setup field and network secret) and deploy-paths.yaml
      admin_out_of_band.agent_session_identity; the OK branch's AccessDenied note points at
      terraform/bootstrap/agent_session_user.tf (a missing grant is a plan defect, never a local widening) instead of
      platform_dev_policies.tf; failure text drops the ExternalId hint. Header comment and the "Verifying AWS profile
      ... (assume-role chain)" log line describe the new model without the phrases VP 5 sweeps. Still advisory, always exit 0, never echoes the ARN or account id.
  - file: tests/hooks/test_session_start_aws.py
    action: Modify
    purpose: >-
      test_reports_role_name_only is rewritten as test_reports_session_user (the OK line, no arn: and no account id in
      output); new test_warns_on_assumed_role (a PlatformDev assumed-role ARN now warns); new
      test_warns_on_near_miss_user (user/agent-platform-session-x warns);
      test_output_never_contains_account_id_or_arn keeps its node name and its masking assertion, with its success
      parameter now the session user's ARN and its old assumed-role parameter now the warning case;
      test_warns_and_exits_zero_when_helper_fails asserts the new failure text. Each rewrite keeps or tightens what the
      node asserts.
  - file: bin/setup-cloud-env.sh
    action: Modify
    purpose: >-
      Header only: one template for every agent environment. The AWS network secret holds the agent-platform-session
      key with the exact host list (deploy-paths.yaml admin_out_of_band.agent_session_identity); the setup field
      writes [profile agent_platform] (and [profile agent_static], kept so scripts naming it still resolve) with
      credential_process placeholders, region, sts_regional_endpoints = regional and output only, no role_arn,
      source_profile, external_id or
      duration_seconds, no agent_platform_admin profile; no template line sets AWS_PROFILE. Markers the tests anchor on
      stay in order: "# DEV environment" opens the one template, "# boto3 then resolves" follows it (now: the proxy
      signs each call as the user, no role step), "# ADMIN environment" says that environment holds no admin identity
      (Decision {{N}} cl.3: the same session user, with terraform installed) and keeps the inline INSTALL_TERRAFORM=1
      line and its sentence "the agent proxy never signs its requests" (two tests assert it), and "# Identity checks" names
      caller-arn reading the proxy-signed user. The "# and set this" admin env-var note and the second role profile go.
      Avoids the phrases VP 5 sweeps. The script body is unchanged.
  - file: tests/test_setup_cloud_env.py
    action: Modify
    purpose: >-
      test_proxy_template_resolves_agent_static_through_credential_process keeps its name (its graduated shard
      setup-cloud-env-proxy-template pins it); it runs the one template once (its admin loop goes; the
      sts_regional_endpoints count becomes one per profile, 2) and asserts agent_static resolves the placeholder key with no role step and no
      agent_platform_admin profile; _template_block loses its admin branch. New
      test_proxy_template_profiles_are_placeholder_only (agent_platform resolves the same placeholder key; no role_arn,
      source_profile, external_id, duration_seconds or agent_platform_admin in the written config).
      test_header_template_has_no_static_key_and_current_path replaces its single-host "allowed host (\S+) ONLY"
      assertion with the exact host note (sts.eu-west-2.amazonaws.com among the named hosts, no S3 host, no wildcard)
      and asserts no template line sets AWS_PROFILE; its other assertions stay.
      test_template_duration_seconds_fit_each_roles_max_session_duration is retired (the template has no role profile
      left to fit; Decision {{N}} cl.1 removes the role step it guarded). test_admin_template_sets_install_terraform_inline
      and test_setup_fetches_no_terraform_assets are unchanged (row 8 keeps their four markers and the sentence they
      assert).
  - file: terraform/bootstrap/platform_security_alarms.tf
    action: Modify
    purpose: >-
      Decision 202's detector reaches the new user (ADVICE-r3 D1: live before the key exists). A sixth
      local.platform_security_filter_patterns entry, platform-security-agent-session-iam-change (metric
      AgentSessionIamChange), plain literals under 1,024 characters: { ($.eventSource = "iam.amazonaws.com") &&
      ($.readOnly IS FALSE) && (($.requestParameters.userName = %<anchored character-class regex for
      agent-platform-session>%) || ($.errorMessage = %user.<the same character classes>\s|policy.agent-platform-session-%)
      || ($.requestParameters.policyArn = "*:policy/agent-platform-session-*")) }. The userName regex is
      case-insensitive as the role regex is (IAM names are case-insensitive in API calls); the errorMessage span (one
      span, two alternatives) catches denied calls, which carry requestParameters null: on the user, by design any IAM
      write the user itself is denied ("User: ... user/agent-platform-session is not authorized"), and on its policies
      ("on resource: policy arn:...:policy/agent-platform-session-guard because" or "on resource:
      arn:...:policy/agent-platform-session-guard with an explicit deny"); the policyArn clause covers policy-version
      verbs and DeletePolicy on the three policies and any Attach or Detach of them. A sixth aws_cloudwatch_metric_alarm,
      platform_security_agent_session_iam_change, in the role-change alarm's exact shape (period 300, threshold 1,
      notBreaching, the alerts topic), its description naming the user and its policies before the shared triage
      text. Header comment says six pairs. No existing pattern, alarm or the triage query changes. Accepted residuals,
      owed rec 4: the shared triage query shows requestParameters.roleName, not userName or policyArn, so a successful
      write's email names its target only through the alarm description; the policyArn clause and the errorMessage
      policy alternative match lower case only, the residual the role filter's policyArn clause already carries.
  - file: tests/checks/iam_tf/_platform_security_patterns.py
    action: Modify
    purpose: >-
      ALARMS gains platform-security-agent-session-iam-change; _REQUIRED_CLAUSES gains its row (the iam eventSource,
      readOnly IS FALSE and "*:policy/agent-platform-session-*"); pattern_problems gains a user-regex predicate in
      _role_regex_problems' shape (hits agent-platform-session, AGENT-PLATFORM-SESSION, Agent-Platform-Session; misses
      agent-platform-session-x, xagent-platform-session, agent-service-account, agent-platform-sessio) and a denied
      predicate in _denied_role_regex_problems' shape over "on resource: user <name> because", "User:
      arn:aws:iam::ACCOUNT:user/<name> is not authorized" and both denied policy forms naming
      policy/agent-platform-session-guard (misses: user/agent-platform-session-x, user/agent-service-account,
      policy/agent-platform-github-ci-apply-boundary).
  - file: tests/checks/iam_tf/test_platform_role_iam_change_alarms.py
    action: Modify
    purpose: >-
      Module docstring says six alarms. _PATTERN_REDS gains five rows on the new filter, each detected: userName exact
      case, errorMessage clause dropped, the errorMessage policy alternative dropped, policyArn clause dropped, and
      readOnly clause dropped; the existing "sixth alarm" red-case label is renamed for an extra alarm. Node names unchanged
      (the graduated shard platform-role-iam-change-detector-declared pins the class). The file's SLOC stays under 500
      (the build measures it; over budget, the rows move into _platform_security_patterns.py).
  - file: tests/fixtures/platform_security_filter_events.yaml
    action: Modify
    purpose: >-
      Events naming the new filter in must_match, in the fixture's sanitised shape (literal ACCOUNT): CreateAccessKey
      with userName agent-platform-session; DeleteUserPermissionsBoundary with userName AGENT-PLATFORM-SESSION;
      CreatePolicyVersion on policy/agent-platform-session-guard; a denied CreateAccessKey (requestParameters null, the
      user named in errorMessage) and a denied CreatePolicyVersion by another principal (requestParameters null,
      errorMessage "on resource: policy arn:aws:iam::ACCOUNT:policy/agent-platform-session-guard because ..."), each
      also naming the denied-write filter; and two that must not match it:
      CreateAccessKey for agent-service-account and a GetUser read. Each must_match is the event's exact filter set,
      the heartbeat included for iam events.
  - file: scripts/ci/security_detector_probe.py
    action: Modify
    purpose: >-
      EXPECTED_ALARMS gains platform-security-agent-session-iam-change (test_expected_alarms_match_the_hcl pins the set
      to the HCL's alarm names); the docstring says six alarms. The hourly liveness run therefore reports it missing
      between merge and VP 8's apply;
      infrastructure_dependencies keeps that window to one sitting.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Sidecar blocks decision-new, decision-113-note, decision-202-note, decision-223-note, decision-248-note and
      decision-252-note,
      verbatim, {{N}} and {{DATE}} filled at build (docs/plans/approved/agent-proxy-signed-access.yaml). The new
      Decision's Serves line is not claimed (the scout scored NS.9 3/5).
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Sidecar block agents-portal-line, verbatim. The file shrinks, so config/prose_budgets.yaml's S1
      root_ambient_load_set is lowered to the measured value under implement-scope-boundary.yaml's
      prose_budgets_ratchet_down sanction (that edit needs no scope row of its own).
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Sidecar blocks deploy-paths-session-identity, deploy-paths-log (a new amendment_log entry) and
      deploy-paths-log-compaction, verbatim. The file is at its 500-effective-line cap (contracts class,
      config/structural_size_budgets.yaml): the new procedure and log entry add 13 lines and the compaction block writes
      four older multi-line amendment_log entries as one-line flow mappings with their words unchanged (-21), so the
      file nets -8 against today's main (about 492 effective lines); the build measures against main at build time and never raises the
      budget (Decision 128).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - "terraform/bootstrap is admin-only (environment-taxonomy.yaml axis_a): the operator plans it pre-merge (VP 6-7) and applies it post-merge (VP 8) from AWS CloudShell as user/platform-breakglass. Each block is self-contained (public-repo fetch at a sha, pinned terraform whose zip is checked against HashiCorp's SHA256SUMS, an integrity check, not a signature check; variables from SSM; account id from the caller), the same shape as PLAN-sit-portable-roots' paused CloudShell amendment, so this plan does not wait for that amendment."
  - "One merged-unapplied bootstrap change at a time: this PR merges only after #1987 (rec-5025) is applied, and before rec-4233 PR 1 and rec-5026's bootstrap changes merge. #1987's apply is 0/0/0 by design and its own operator block is paused; if it is still unapplied at this build's CI green, VP 7's exact nine-create plan (which carries #1987's merged content) shows it has no pending delta, and the coordinator puts that evidence to the operator, whose ruling the one-at-a-time rule is, instead of the build waiting silently."
  - "Proxy signing is proven before merge: VP 4 needs the operator to widen the current environment's allowed hosts (old key, no new grant) and set DUCKLAKE_READER_URL; a STOP there ends the build before anything is created."
  - "Apply precedes cutover: VP 9's key and network-secret edits need the user that VP 8 creates; the code changes merge with the PR and take effect at cutover."
  - "Merge and VP 8 happen in one operator sitting: from merge, security_detector_probe.py expects the sixth alarm, so an hourly security-detector-liveness run before the apply reports it missing; a security_detector_stale rec filed in that window is closed in VP 13 with VP 8's read-back."
  - "No Lambda code changes: no deploy channel runs."
acceptance_criteria:
  - "terraform/bootstrap declares agent-platform-session with the permissions boundary and exactly the three managed policies; test_agent_session_user.py's ten real-tree nodes pass, and its red-case node shows each predicate failing on one mutation per class: an extra verb, a non-URL invoke grant, an unlisted invoke target, an S3 grant, a secret grant, a missing PlatformDev Deny, an unlisted ExternalId trust, a missing escalation Deny, a missing temporary-credential Deny, an access-key resource, a missing boundary or prevent_destroy and a user-write verb in the boundary ceiling."
  - "Decision 202's detector gains platform-security-agent-session-iam-change, matching any IAM write, made or denied, that names agent-platform-session or an agent-platform-session-* policy (fixture events and red cases in the detector tests; security_detector_probe.py expects six alarms); it is live from VP 8's apply, before the key exists, and metric data shows it matching the key creation (VP 9) and the denied write (VP 12, read in VP 13)."
  - "No session code calls a credential-returning STS API (test_no_session_code_mints_credentials), and a token minted from the user's key is denied every action (test_agent_session_temporary_credentials_denied)."
  - "scripts.aws_identity caller-arn reads the identity from the profile's own session; the session-start hook reports OK: user/agent-platform-session for that user and warns otherwise."
  - "DECISIONS.md, AGENTS.md and deploy-paths.yaml carry exactly the sidecar's words (approved_text verify passes), and the stale-reference sweep leaves only the residue owed rec 7 names (VP 5)."
  - "Before merge, the proxy is shown to sign the ssm, logs, monitoring, iam and Function URL host classes (VP 4)."
  - "After the operator's apply and cutover, a fresh session reads the ops store through the reader Function URL and files recs through the writer, reads endpoints, logs, metrics and role policies, and is denied PlatformDev's trust document, a /secret/ read, an IAM write and a log group outside its prefix (VP 10-13). Direct Lambda invoke is denied by the URL-only grant (test_agent_session_invoke_is_url_only) and the boundary's DenyDuckLakeDirectInvoke, with no Lambda API host on the proxy's list; S3 is unreachable because no S3 host is listed and no S3 action is granted."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the changed and new tests, including every named node.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_agent_session_user.py tests/test_aws_identity.py
      tests/test_sts_call_sites.py tests/hooks/test_session_start_aws.py tests/test_setup_cloud_env.py
      tests/checks/iam_tf/test_url_only_invoke_guard.py tests/checks/iam_tf/test_platform_role_iam_change_alarms.py
      tests/test_security_detector_probe.py tests/checks/iam_tf/test_platform_security_heartbeat_canary.py -q
    expected: >-
      All pass, including test_agent_session_user.py's eleven nodes, test_no_session_code_mints_credentials and
      test_minting_scanner_flags_a_synthetic_call, the detector's pattern, fixture and five new red-case nodes, and
      test_expected_alarms_match_the_hcl.
    fix_if: Any failure; fix the code or the Terraform, never an assertion's meaning (Decision 235).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates PR CI's diff-selected pytest of these files on every change; the named nodes in test_obligations pin
      the new behaviour. Six graduated shards already cover the changed files (aws-identity-caller-arn,
      session-start-aws-caller-arn, sts-call-site-census, setup-cloud-env-proxy-template,
      platform-role-iam-change-detector-declared, security-detector-probe-fails-closed); the new
      test_agent_session_user.py has none, so only review and the full tier would notice its deletion, a gap this
      plan accepts.
  - step: 2
    phase: pre-deploy
    action: Prove the IAM policy-size, secret-grant and account-portability checks accept the new file.
    command: >-
      bin/venv-python -m scripts.checks.iam_tf.validate_iam_policy_size && bin/venv-python -m
      scripts.checks.iam_tf.validate_secret_parameter_grants && bin/venv-python -c "from
      scripts.checks.iam_tf.validate_account_portable_names import validate_account_portable_names as v; f = []; v(f);
      print(chr(10).join(f) or 'PORTABLE_OK'); raise SystemExit(1 if f else 0)"
    expected: >-
      The policy-size check's PASS line counts three more bootstrap policy resources than on main, the secret-grant check
      exits 0, and PORTABLE_OK prints.
    fix_if: A finding names the resource; fix the Terraform, never the check.
    hermetic: false
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: Bind the governed wording to the sidecar, then run the full tier before handoff.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug agent-proxy-signed-access --base origin/main &&
      export AWS_PROFILE=agent-platform-unset && bin/venv-python -m scripts.validate --pre && bin/venv-python -m
      scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      verify reports every bound file equal to its base words with the ten blocks applied; the fast and full tiers pass
      and validation_result verifies the head (the full tier is started in the background from the top-level session).
      The full tier runs on a profile no config names, so its DQ refresh stops at ProfileNotFound and reports "AWS
      credentials not available -- skipping" instead of reaching the refused role chain.
    fix_if: >-
