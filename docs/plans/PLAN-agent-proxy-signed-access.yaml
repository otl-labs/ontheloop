      scripts.aws_identity caller-arn --profile agent_platform | grep -o ':user/agent-platform-session$'
    expected: 1 and :user/agent-platform-session.
    fix_if: >-
      An assumed-role means the old setup field is still pasted; any other user means the old key is still in the
      network secret. A failure prints the error code only; fix the environment per the procedure.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      Positive reads in that session: a bounded by-id read of the ops store through the reader Function URL (an
      unfiltered table read exceeds the Lambda response cap, Decision 215), preflight (credentials and recs read; the
      convergence record is expected absent, quietly, until owed rec 6), endpoint lookup, a log stream listing, a
      metric listing and a role policy read.
    command: |-
      bin/venv-python - <<'PY'
      from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader
      try:
          r, m = fetch_recs_by_ids(make_reader(profile="agent_platform"), ["rec-4043"])
          print("RECS", len(r), "MISSING", len(m))
      except Exception as e:
          print("RECS", "STOP_" + type(e).__name__, getattr(e, "status", ""))
      PY
      bin/venv-python -m scripts.session.preflight > /dev/null 2> "${TMPDIR:-/tmp}/pf.err"; grep -c Traceback "${TMPDIR:-/tmp}/pf.err"
      bin/venv-python -c "import json; r = json.load(open('logs/.preflight-report.json')); print('PREFLIGHT', r['creds_status'], r['recs_read_status'])"
      E="${TMPDIR:-/tmp}/r.err"
      r() { l=$1; shift; o=$(aws "$@" --profile agent_platform 2> "$E"); if [ $? = 0 ]; then echo "$l OK $o"; elif grep -q 'explicit deny' "$E"; then echo "$l EXPLICIT_DENY"; else t=$(grep -oE 'AccessDenied[A-Za-z]*|InvalidClientTokenId|UnrecognizedClientException|IncompleteSignature|SignatureDoesNotMatch|ResponseParserError|blocked by policy' "$E" | head -1); echo "$l ${t:-OTHER}"; fi; }
      r SSM ssm get-parameter --name /agent-platform/ducklake/reader_url --query Parameter.Name --output text
      r LOGS logs describe-log-streams --log-group-name /aws/lambda/agent-platform-ducklake-reader --max-items 1 --query 'length(logStreams)'
      r METRICS cloudwatch list-metrics --namespace AWS/Lambda --max-items 1 --query 'length(Metrics)'
      r IAM iam list-role-policies --role-name PlatformDev --query 'length(PolicyNames)'
    expected: >-
      RECS 1 MISSING 0; 0 (no traceback); PREFLIGHT ok ok; SSM OK /agent-platform/ducklake/reader_url; LOGS OK 1;
      METRICS OK 1; IAM OK with a number of 1 or more (an out-of-band inline policy may still sit beside DailyOps,
      terraform/CLAUDE.md). Only labels and tokens print, never AWS error text, which names the account. VP 13's filing proves the writer
      Function URL.
    fix_if: >-
      EXPLICIT_DENY on all four labelled lines (with RECS STOP_ReaderInvokeError 403) means the proxy sends a session
      token (context UNPROVEN): stop, deactivate the new key per the rollback, and return to planning for
      DenyTemporaryCredentialUse. One AccessDenied line names the missing grant by its label: a plan defect
      (routing.plan_defect), never an ad-hoc widening. RECS STOP_ with 413 or ResponseTooLargeError is the read's size,
      not access: use a bounded verb. InvalidClientTokenId, UnrecognizedClientException, IncompleteSignature,
      SignatureDoesNotMatch, ResponseParserError or OTHER means
      the proxy did not sign that host with the new key: check the host list first; if it is right, stop and report
      under Decision {{N}}'s proxy-stops-signing condition.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: >-
      Negative checks in that session: PlatformDev's trust document, a /secret/ parameter read, an IAM write (TagRole on
      a role name that does not exist, so no role can change: IAM authorises before it looks the role up) and a log
      group outside the agent-platform prefix. No sts:AssumeRole is attempted; the proxy refuses it by design and it is
      never retried. The denied TagRole matches platform-security-denied-iam-write and the new agent-session filter
      (its errorMessage names the user as caller); VP 13 proves that from metric data, and any emails are expected.
    command: >-
      date -u +%Y-%m-%dT%H:%M:%SZ | sed 's/^/STARTED_AT /'; aws iam get-role --profile agent_platform --role-name
      PlatformDev --query Role.RoleName 2>&1 | grep -o
      AccessDenied | head -1; aws ssm get-parameter --profile agent_platform --name
      /secret/agent-platform-terraform-personal-tfvars --query Parameter.Name 2>&1 | grep -o AccessDenied | head -1; aws
      iam tag-role --profile agent_platform --role-name agent-session-probe-absent --tags Key=probe,Value=x 2>&1 | grep -o AccessDenied
      | head -1; aws logs describe-log-streams --profile agent_platform --log-group-name /aws/lambda/probe-outside-scope
      2>&1 | grep -o AccessDenied | head -1
    expected: >-
      A STARTED_AT line, then AccessDenied four times.
    fix_if: >-
      Any success is a security finding; report to the operator at once and deactivate the key per the procedure. A
      proxy refusal in place of AccessDenied proves nothing about IAM; fix the host list and re-run.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: >-
      At least 10 minutes after VP 12 (a scheduled wake, never a sleep), read the detector's per-minute metrics since
      VP 12's STARTED_AT as the session user (a fixed start, so a late read still sees them): every minute with a DeniedIamWrite datapoint also has an AgentSessionIamChange one,
      so VP 12's denied TagRole matched the new filter's denied-call clause live. Then file the ten owed follow-on recs
      in context's list through the portal (get_rec_write_guidance first), read them back by id, close any
      security_detector_stale rec filed between merge and VP 8 with VP 8's read-back, record rec-4043's disposition
      (read it; it stays open, since its acceptance needs the admin principal owed rec 2 builds; update its context to
      name this plan for the routine principal and owed rec 2 for the admin one), then post a coordinator log entry
      (issue #1963) naming the cutover and the residue owners.
    command: |-
      ( s=<VP 12's STARTED_AT>; e=$(date -u +%Y-%m-%dT%H:%M:%SZ); E="${TMPDIR:-/tmp}/m.err"; : > "$E"
      m() { aws cloudwatch get-metric-statistics --profile agent_platform --namespace PlatformSecurity --metric-name "$1" --start-time "$s" --end-time "$e" --period 60 --statistics Sum --query 'Datapoints[].Timestamp' --output text 2>> "$E" | tr '\t' '\n' | grep . | LC_ALL=C sort; }
      d=$(m DeniedIamWrite); a=$(m AgentSessionIamChange)
      echo "DENIED_MINUTES $(printf '%s\n' "$d" | grep -c .) MATCHED $(comm -12 <(printf '%s\n' "$a") <(printf '%s\n' "$d") | grep -c .)"
      t=$(grep -oE 'explicit deny|AccessDenied[A-Za-z]*|InvalidClientTokenId|UnrecognizedClientException|IncompleteSignature|SignatureDoesNotMatch|ResponseParserError|blocked by policy' "$E" | head -1); echo "READ_ERRORS $(grep -c . "$E") $t" )
      bin/venv-python - <the ten ids file_rec returned> <<'PY'
      import sys
      from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader
      try:
          rows, missing = fetch_recs_by_ids(make_reader(profile="agent_platform"), sys.argv[1:])
          print("RECS", len(rows), "MISSING", len(missing), sorted({r.get("status") for r in rows}))
      except Exception as e:
          print("RECS", "STOP_" + type(e).__name__, getattr(e, "status", ""))
      PY
    expected: >-
      DENIED_MINUTES n MATCHED n with n of 1 or more; READ_ERRORS 0; RECS 10 MISSING 0 ['open']; then the log comment id
      mcp__github__add_issue_comment returns.
    fix_if: >-
      READ_ERRORS above 0: the metric read failed (its token names why) and the counts mean nothing; fix the read
      first. DENIED_MINUTES 0 within 30 minutes of VP 12: the denied TagRole did not reach the log group; check the trail's
      delivery with the operator rather than waiting further. MATCHED below
      DENIED_MINUTES: the denied-call clause missed (or another principal's denied write shares the hour); check the
      events in CloudWatch with the operator before closing the build. A write that fails loudly is re-filed after the
      cause is fixed (Decision 84 I-4); never an offline outbox.
    hermetic: false
    graduation: not-applicable
