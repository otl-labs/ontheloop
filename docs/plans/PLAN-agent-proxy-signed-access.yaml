rollback: >-
  Before cutover: revert the squash commit and, if VP 8 ran, the operator destroys the user from CloudShell (remove
  prevent_destroy in a reviewed PR first); if VP 4 stopped, the operator removes the hosts it added. After cutover:
  deactivate the new key; sessions lose AWS again, which is today's state (the old chain stays refused), and threads
  fall back to operator blocks until a fix lands.
