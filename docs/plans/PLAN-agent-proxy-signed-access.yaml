pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (113, 213, 202, 144, 223, 237, 238, 248, 252, 143, 200, 212, 153, 208) and plan A's Decision
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - "Start condition for the main build PR: VP 5 passes (plan A merged, applied and probed) and the fixture, reader-client and
    read-route PRs are on main; until then nothing of the main build PR is written. The early PRs start when this plan
    merges (the read-route PR after the reader-client PR)."
  - "Start condition for the main build PR's merge (not for the build): #1987 (rec-5025) and plan A's bootstrap change are applied, so this is the only merged-unapplied bootstrap change; until then the build stops at CI green and tells the coordinator."
execution_steps:
  - "Four build PRs, split by measured selection (Decision 208 cl.1: the single PR's prediction, 326 modules at cost 744.8 s,
    breaches at the 1,110 s cap, so it splits until each clears; predictor run via selection_budget._report, since its
    CLI crashes, owed rec 23). Three early PRs start when this plan merges, change no behaviour before cutover and wait
    on no operator word: the fixture PR (tests/conftest.py, test_conftest_hermeticity.py and the project-configuration.yaml
    row; forced full suite, Decision 153); the reader-client PR (src/common/ducklake_reader_client.py and test_transport_selection.py; 167 modules, cost
    474.0 s, test half 283-1,099 s, breadth_waived); the read-route PR, after the reader-client PR is on main
    (scripts/telemetry_capture/read_route.py and test_read_route.py; 81 modules, cost 421.1 s, test half 249-973 s,
    breadth_waived). The main build PR is every other row (236 modules, cost 356.5 s, test half 218-831 s, breadth_waived). From
    the first PR until cutover the build prefixes every repo command it runs (bin/venv-python, the fast and full tiers,
    preflight, postflight) with AWS_PROFILE=agent-platform-unset, so it stops at ProfileNotFound before any request and
    never tries the refused role chain; preflight then runs in its degraded mode with null recs fields, and the CI-RCA
    override is asked once, before the first PR. Ask the coordinator to post the log notice of the Feedback Loop file
    edits (scripts/telemetry_capture/transport.py, read_route.py, the telemetry writer handler, their tests and the new
    test_caller_shapes.py) before the read-route PR opens."
  - "Each early PR: its tests first, seen red on the unchanged tree (record the red run), then its source rows; run its test
    files with -m 'not integration' (as VP 2) and the fast tier; Commit Flow without the declaration: an early PR leaves the plan file and
    implementation_declared untouched (only the main build PR declares, so validate_merge_step and the VP replay judge
    the whole build once); merge on green CI with merge_pull_request (squash, an explicit commit_message and
    expectedHeadSha, through the merge gate). merge_step premerge and readback run on the main build PR only: an early
    PR applies none of the sidecar's blocks, so premerge's approved-text leg would report the bound files as mismatched. The fixture PR's PR CI --pre is the forced full suite: on a ceiling breach
    or a timeout, follow the tests/conftest.py row, never a bypass. The reader-client PR's merge wakes
    deploy-ducklake-lambdas.yml (src/common/ducklake_* is a watched path): an inert redeploy, since the Lambdas never
    set OTL_OPS_VERBS_TRANSPORT; read that run green before the read-route PR merges, and a skipped or red run (Decision 254's batched full tier
    makes a gate skip the likelier) follows VP 10's fix_if."
  - "The main build PR, once the three early PRs are on main. At its start run VP 5; on any missing line stop and tell the
    coordinator."
  - "Tests first per the main build PR's test scope rows (the new test files, the changed ones, the detector's pattern helper, red-case list and fixture), seen red on the unchanged tree (record the red run), except test_no_session_code_mints_credentials, which is green before and after (its synthetic red case proves it can fail), and test_expected_alarms_match_the_hcl, red only between the HCL edit and the EXPECTED_ALARMS edit. Post: the named nodes exist and fail."
  - "terraform/bootstrap/agent_session_user.tf per scope row 1, reusing platform_dev_policies.tf's Deny statements and plan A's route locals (no added line, comments included, may carry a token VP 8's screen refuses: provider or module followed by a quote, required_providers, provisioner, local-exec, an external or http data source), then the seventh detector pair in platform_security_alarms.tf and EXPECTED_ALARMS in security_detector_probe.py, and, only if PLAN-bootstrap-ci-gated-apply's BUILD PR 1 is on the rebased main before merge, the _UNSCANNED_BOOTSTRAP_FILES entry per its row. Post: VP 1 and VP 3 pass."
  - "scripts/aws_identity.py, .claude/hooks/session_start_aws.sh and the bin/setup-cloud-env.sh header per their rows. Post: VP 1 and VP 6 pass."
  - "The transport switch (the fixture, reader-client and read-route PRs are on main): writer_transport.py, scripts/telemetry_capture/transport.py and the telemetry writer handler per their rows. Post: VP 2 passes."
  - "docs/contracts/ports.yaml per its row, measured against main (at or under 500 effective lines); project-configuration.yaml's row landed with the fixture PR. Post: VP 3 passes."
  - "Hand-apply the sidecar's ten blocks verbatim, {{N}} the next free Decision number at build time and {{DATE}} the build date, and fill {{N}} the same way in scripts/aws_identity.py's docstring and the bin/setup-cloud-env.sh header (a rebase that renumbers re-fills every site); AGENTS.md shrinks, so lower config/prose_budgets.yaml's S1 root_ambient_load_set to the measured value (the prose_budgets_ratchet_down sanction). Post: VP 4 passes."
  - "Commit Flow (implement skill; git-ops.yaml handoff_sequence): full tier, push, PR. At CI green ask the operator's final-diff word on the head, naming its full sha (the terraform/bootstrap IAM text, the session-start hook and the telemetry writer handler first); only after that word post VP 7 and VP 8's blocks at that sha and record the returned lines; merge only the head both cover (any new head, a rebase for {{N}} included, needs the word and VP 7-8 again first), only after #1987 and plan A's change are applied, and only when the operator is ready to run VP 9 in the same sitting. Just before merge, fetch main: if main's test_platform_role_metadata_admin_scope.py defines _UNSCANNED_BOOTSTRAP_FILES and the head lacks agent_session_user.tf's entry, rebase and add it per its row (a new head, so the word and VP 7-8 again)."
  - "After merge: post VP 9's block; on its lines, run VP 10; when both channels are green, post VP 11's procedure; on 'cutover done', run VP 12-15 in a fresh session (the build thread itself if it was started after cutover, else a fresh one the coordinator starts); then post VP 16's block."
  - "Report: what was implemented, each PR's validation_result --verify-head verdict, the postflight output, the operator-reported lines, VP 5, VP 10 and VP 12-16 results, the filed rec ids, each PR's merge SHA and recorded red run, and the fixture PR's PR CI forced-run outcome and elapsed."
rollback: >-
  The three early PRs stay (inert without the variable). Before cutover: revert the main build PR's squash commit and, if VP 9 ran, the operator applies the revert from CloudShell after a
  reviewed PR removes prevent_destroy (the user, its policies, its boundary and the seventh alarm pair go); the
  reverted clients and handler redeploy through their channels, and since no environment sets OTL_OPS_VERBS_TRANSPORT
  yet nothing used them. After cutover: deactivate the new key and clear OTL_OPS_VERBS_TRANSPORT from each env-var
  field; sessions lose AWS again, which is today's state (the old chain stays refused, and the Function URLs stay
  unsignable), and threads fall back to operator blocks until a fix lands. The handler change is backward compatible
  (it still accepts the Function URL shape), so it need not be reverted for CI callers. Plan A's API stays; its own
  rollback is separate and comes after this one.
