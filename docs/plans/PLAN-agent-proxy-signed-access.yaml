  - step: 13
    phase: post-deploy
    action: >-
      Positive reads in that session, through the API routes and with no profile argument, as preflight, sync and the
      portal call the clients (the env-var field sets no AWS_PROFILE): a bounded by-id read of the ops store through the
      reader route (an unfiltered table read exceeds the Lambda response cap, Decision 215), describe on the telemetry
      reader and telemetry writer routes (the writer's 200 proves the deployed REST caller read), preflight
      (credentials and recs read; the convergence record is expected absent, quietly, until owed rec 6), endpoint
      lookup, a log stream listing, a metric listing and a role policy read. The STARTED_AT line is VP 16's start.
    command: |-
      date -u +%Y-%m-%dT%H:%M:%SZ | sed 's/^/STARTED_AT /'
      bin/venv-python - <<'PY'
      import os
      from scripts.telemetry_capture.read_route import TelemetryReader
      from scripts.telemetry_capture.transport import Budget, make_client
      from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader
      def run(label, f):
          try:
              print(label, f())
          except Exception as e:
              print(label, "STOP_" + type(e).__name__, getattr(e, "status", ""))
      def recs():
          rows, missing = fetch_recs_by_ids(make_reader(), ["rec-4043"])
          return f"{len(rows)} MISSING {len(missing)}"
      def reader():
          TelemetryReader().binding()
          return "OK"
      run("RECS", recs)
      run("TELEMETRY_READER", reader)
      run("TELEMETRY_WRITER", lambda: make_client(os.environ, None, Budget.start(30)).invoke_once({"action": "describe"})[0])
      PY
      bin/venv-python -m scripts.session.preflight > /dev/null 2> "${TMPDIR:-/tmp}/pf.err"; grep -c Traceback "${TMPDIR:-/tmp}/pf.err"
      bin/venv-python -c "import json; r = json.load(open('logs/.preflight-report.json')); print('PREFLIGHT', r['creds_status'], r['recs_read_status'])"
      E="${TMPDIR:-/tmp}/r.err"
      r() { l=$1; shift; o=$(aws "$@" --profile agent_platform 2> "$E"); if [ $? = 0 ]; then echo "$l OK $o"; elif grep -q 'explicit deny' "$E"; then echo "$l EXPLICIT_DENY"; else t=$(grep -oE 'AccessDenied[A-Za-z]*|InvalidClientTokenId|UnrecognizedClientException|IncompleteSignature|SignatureDoesNotMatch|ResponseParserError|blocked by policy' "$E" | head -1); echo "$l ${t:-OTHER}"; fi; }
      r SSM ssm get-parameter --name /agent-platform/ducklake/api_url/ops/reader --query Parameter.Name --output text
      r LOGS logs describe-log-streams --log-group-name /aws/lambda/agent-platform-ducklake-reader --max-items 1 --query 'length(logStreams)'
      r METRICS cloudwatch list-metrics --namespace AWS/Lambda --max-items 1 --query 'length(Metrics)'
      r IAM iam list-role-policies --role-name PlatformDev --query 'length(PolicyNames)'
    expected: >-
      STARTED_AT with a time; RECS 1 MISSING 0; TELEMETRY_READER OK; TELEMETRY_WRITER 200; 0 (no traceback); PREFLIGHT
      ok ok; SSM OK /agent-platform/ducklake/api_url/ops/reader; LOGS OK 1; METRICS OK 1; IAM OK with a number of 1 or
      more (an out-of-band inline policy may still sit beside DailyOps, terraform/CLAUDE.md). Only labels, statuses and
      tokens print, never AWS error text, which names the account. VP 15's filing proves the writer route.
    fix_if: >-
      EXPLICIT_DENY on all four labelled lines (with RECS STOP_ReaderInvokeError 403) means the proxy sends a session
      token (context UNPROVEN): stop, deactivate the new key per the rollback, and return to planning for
      DenyTemporaryCredentialUse. RECS or TELEMETRY_READER STOP_ 403 with the labelled lines OK: the API refused the
      user (its resource policy's aws:PrincipalArn or this plan's invoke ARN template does not match the live API); a
      plan defect reported to the coordinator, never a widening. RECS or TELEMETRY_READER STOP_RuntimeError with the labelled lines OK: the route parameter
      read resolved no profile (scope row: api_route_url resolves None through resolve_aws_profile); a plan defect,
      never an AWS_PROFILE line in the env-var field. TELEMETRY_WRITER 403 with RECS 1: the deployed handler
      lacks the REST caller read; check VP 10's deploy record. RECS STOP_ with 413 or ResponseTooLargeError is the
