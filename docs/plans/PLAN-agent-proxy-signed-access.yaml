      trail's delivery with the operator rather than waiting further. MATCHED below DENIED_MINUTES: the denied-call
      clause missed (or another principal's denied write shares the hour); check the events in CloudWatch with the
      operator before closing the build. A refused closure of the security_detector_stale rec (its acceptance names
      agent_platform_admin, which no environment holds): record VP 9's read-back, or plan A's VP 7 read-back for a rec
