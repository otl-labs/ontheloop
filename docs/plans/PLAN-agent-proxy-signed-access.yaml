schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "agent-proxy-signed-access"
intent: >-
  Give agent sessions their AWS access back without any session minting or holding an AWS credential: one new IAM user,
  agent-platform-session, whose key only each environment's egress proxy holds, signs every call itself with grants
  narrowed to what sessions use, under its own boundary; the DuckLake clients reach the four verb functions over the
  named routes of the operator-applied REST API (PLAN-agent-ducklake-rest-api, plan A), because the proxy cannot sign
  the Function URL hosts, and admin work moves to operator-run CloudShell blocks (new Decision amending Decision 113).
  Amended 2026-11-13 after the first build stopped at its proxy probe: plan B of two, built only after plan A is applied
  and probed.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-agent-proxy-signed-access.yaml
phase: >-
  security_advisory (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  since 2026-11-12 the agent proxy refuses sts:AssumeRole, so no session reaches AWS. The operator approved writing
  this plan with every presented recommendation on 2026-11-13 00:01Z, chose the REST route at 14:06Z and agreed the
  split and its forks at 14:21Z (own boundary; this plan edits Feedback Loop's telemetry client and writer caller read
  with a log notice). Closes no roadmap criterion; no rec exists because the recs store is unreachable until this
  plan's cutover (VP 15 files the owed recs).
scope:
  - file: terraform/bootstrap/agent_session_user.tf
    action: Create
    purpose: >-
      aws_iam_user.agent_session (name exactly agent-platform-session and no path argument, so the user sits at the
      default path (/) whose ARN plan A's resource policy admits; permissions_boundary =
      aws_iam_policy.agent_session_boundary.arn, lifecycle prevent_destroy, no resource tags so the provider's
      default_tags apply) and four customer-managed policies, each from a hoisted local with a lifecycle precondition at
      the 6,144 B managed-policy limit (validate_iam_policy_size). Statement locals: agent_session_ducklake_statements is
      concat of one DuckLakeApiInvoke statement per instance of plan A's API, [for api in
      aws_api_gateway_rest_api.agent_ducklake : {Sid DuckLakeApiInvoke, Effect Allow, Action execute-api:Invoke,
      Resource [for route in sort(keys(local.ducklake_api_routes)) :
      "${api.execution_arn}/${local.ducklake_api_stage}/POST/${route}"]}] (one statement in sandbox, none in SIT, where
      plan A's count is 0; no conditional operator, no wildcard in the ARN template), and DuckLakeEndpointDiscovery
      ssm:GetParameter on parameter/agent-platform/ducklake/* (the Function URL and API route URLs and the telemetry
      catalog name, no SecureString [verified by reading terraform/personal and plan A]); no lambda action at all.
      agent_session_observe_statements: ObservabilityMetricRead and ObservabilityLogStreamRead copied from
      platform_dev_policies.tf:119-141, and IAMRoleRead iam:GetRole, iam:GetRolePolicy, iam:ListRolePolicies,
      iam:ListAttachedRolePolicies on arn:aws:iam::${var.account_id}:role/* (no ListRoles or
      GetAccountAuthorizationDetails, which return trust documents). Policies: aws_iam_policy.agent_session_ducklake
      and .agent_session_observe from those locals; aws_iam_policy.agent_session_guard, Deny statements only: the eight
      DailyOps Deny statements copied verbatim with their Sids (platform_dev_policies.tf:143-270:
      DenyStateAndConvergenceWrite, DenyStateRead, DenyTerraformArtifactRead, DenyTerraformArtifactWrite,
      DenyReviewTranscriptRead, DenyReviewTranscriptWrite, DenyStateAndConvergenceVersionRead,
      DenyStateAndConvergenceVersionList); DenyExternalIdTrustRead, iam:GetRole on aws_iam_role.platform_dev.arn and
      aws_iam_role.platform_admin.arn (their trust documents carry the ExternalIds; removed when owed rec 3 retires
      those trusts); DenySessionEscalation on "*": sts:AssumeRole*, sts:AssumeRoot, sts:GetFederationToken,
      iam:Create*, iam:Update*, iam:Put*, iam:Attach*, iam:Detach*, iam:Delete*, iam:Add*, iam:Remove*, iam:Tag*,
      iam:Untag*, iam:Set*, iam:Upload*, iam:Enable*, iam:Deactivate*, iam:Change*, iam:Reset*, iam:PassRole;
      DenyTemporaryCredentialUse, Action "*" on Resource "*" with the one condition Null aws:TokenIssueTime = "false":
      STS takes no policy on GetSessionToken, so the call cannot be denied, but every request signed with a token minted
      from the key (GetSessionToken or GetFederationToken) is, while the proxy's long-term-key signatures carry no token
      and pass; aws_iam_policy.agent_session_boundary (name agent-platform-session-boundary), Statement exactly
      concat(local.agent_session_ducklake_statements, local.agent_session_observe_statements), so the ceiling is the
      grant set by construction and the shared deployer boundary's s3, dynamodb and secretsmanager reach never applies;
      it therefore holds no apigateway action and no lambda action, AddPermission, RemovePermission and other
      resource-policy writes included (plan A's Overlaps obligation (a)), so the one identity plan A's API admits
      cannot rewrite the API or its permissions.
      aws_iam_user_policy_attachment resources agent_session_ducklake, agent_session_observe and agent_session_guard (an
      IAM user's inline policies share a 2,048 character quota); the boundary is attached only as the boundary. No S3
      Allow (no convergence read: the S3 host stays off the proxy's list so presigned telemetry PUTs pass unsigned; owed
      rec 6 serves the record through the reader). No aws_iam_access_key (its secret would land in state), no inline
      policy, no literal account id, API id, bucket name or region.
  - file: tests/checks/iam_tf/test_agent_session_user.py
    action: Create
    purpose: >-
      Credential-free text tests over the new file in the iam_tf convention (test_url_only_invoke_guard.py:1-3): each
      check is a predicate over the Terraform text that returns a problem list, so its red case drives the real
      predicate on mutated input. Eleven nodes. Ten assert an empty problem list on the real tree:
      test_agent_session_user_carries_own_boundary (the user's name is exactly agent-platform-session and its block sets
      no path, permissions_boundary is aws_iam_policy.agent_session_boundary.arn,
      prevent_destroy is set, and the boundary's Statement is exactly the concat of the ducklake and observe statement
      locals, nothing else); test_agent_session_invoke_is_api_only (the only invoke Allow is execute-api:Invoke, built
      over aws_api_gateway_rest_api.agent_ducklake with the exact template
      "${api.execution_arn}/${local.ducklake_api_stage}/POST/${route}" over keys(local.ducklake_api_routes), with no "*"
      in it, and no Allow names a lambda or apigateway action, so the boundary built from the same locals names
      neither); test_agent_session_grants_are_closed (the union of Allow actions
      equals the declared set in row 1, so a new verb fails until this test names it);
      test_agent_session_never_reaches_state_or_secrets (no Allow names an s3 action, parameter/secret/, a
      secretsmanager ARN or an iam verb outside the four reads; Decision 238 cl.1);
      test_agent_session_carries_platform_dev_denies (every Deny Sid in local.platform_dev_runtime_policy_json appears in
      the guard policy with the same Action, Resource and Condition text, and the parsed Sid set holds at least the
      eight row 1 names, so an empty parse fails); test_agent_session_cannot_read_externalid_trusts (the aws_iam_role
      resources under terraform/ whose trust mentions sts:ExternalId are exactly the roles DenyExternalIdTrustRead
      names, and that set holds at least PlatformDev and PlatformAdmin, so an empty parse fails);
      test_agent_session_escalation_denied (DenySessionEscalation's Action set equals row 1's twenty verbs exactly);
      test_agent_session_temporary_credentials_denied (the guard holds a Deny of Action "*" on Resource "*" whose only
      condition is Null aws:TokenIssueTime = "false"); test_agent_session_has_no_key_resource (no resource block of type
      aws_iam_access_key, aws_iam_user_policy, aws_iam_user_login_profile, aws_iam_service_specific_credential,
      aws_iam_signing_certificate or aws_iam_user_ssh_key, matched as whole resource types so
      aws_iam_user_policy_attachment does not count, anywhere under terraform/; none exists today [verified by grep]);
      test_agent_session_boundary_holds_no_user_write (the shared deployer boundary's Allow ceiling in
      github_ci_apply_boundary.tf names no iam action containing User, AccessKey, LoginProfile, PolicyVersion,
      ServiceSpecificCredential, SSHPublicKey, SigningCertificate or MFA, and no iam wildcard, while the parsed ceiling
      holds at least iam:GetRole and iam:PassRole, so a truncated parse fails: no bounded CI role can write the user,
      its boundary or its policies). The eleventh, test_agent_session_predicates_are_red_on_each_mutation, is
      parametrized over (mutation, predicate, expected problem substring) on the real text and asserts the named
      predicate reports that problem, so a mutation that fails for another reason cannot pass as red: an extra Allow
      verb, an iam verb beyond the four reads, a lambda:InvokeFunctionUrl Allow, an apigateway:PATCH Allow, a "*" stage or route in the invoke ARN
      template, an extra literal route ARN, an s3:GetObject Allow, a parameter/secret/ Resource, a secretsmanager ARN
      Resource, a dropped DailyOps Deny Sid, an extra aws_iam_role with an sts:ExternalId trust, iam:PassRole dropped
      from DenySessionEscalation, DenyTemporaryCredentialUse dropped, an added aws_iam_access_key resource, the boundary
      pointed at aws_iam_policy.github_ci_apply_boundary, a statement added to the boundary outside the two locals, a
      dropped prevent_destroy, a path argument on the user, another user name and iam:CreateAccessKey added to the
      shared boundary ceiling.
