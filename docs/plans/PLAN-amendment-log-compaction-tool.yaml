schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: amendment-log-compaction-tool
intent: >-
  Give contracts a deterministic, lossless way to turn old full amendment_log rows into terse rows (Decision 275 cl.4),
  so the contract budget's first relief valve is one reviewed command instead of hand or model rewrites that can
  silently drop a plan, rec or Decision pointer (rec-5452). It edits no contract; rec-5453 (decaying ratchet) and
  rec-5454 (near-cap compaction) use it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-amendment-log-compaction-tool.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5452 (Medium, M), a follow-on of the contract-first retrospective (CFR-05) and the standards-cleanup census row
  S8. Closes no roadmap criterion.
closes_criteria: []
cites: [dec:275]
amends: []
introduces: []
scope:
  - file: scripts/checks/contracts/_amendment_terse.py
    action: Create
    purpose: >-
      Pure helpers, never raising (Decision 55), imported by the tool now and by the retention check under rec-5453.
      (1) pointer_tokens(text) -> the normalised set of pointer tokens: PLAN-<slug>, rec-N, Decision N (each number of
      "Decisions N, M and K", "Decision N cl.M" -> Decision N, dec-N -> Decision N), tier ids (T4.32, T-1.24, T2.25a)
      and CD.N. PR numbers, SHAs, run ids and contract_version notes are not pointers (git blame on the row recovers
      them). (2) derive_terse(row, cfg) -> the terse summary or a Refusal(reason): the row's leading label (the text
      before the first ": " when it holds a pointer token, whitespace collapsed), then "; " and every pointer token of
      the full summary the label lacks, in first-seen order, comma separated; no prose tail. The label ends at the
      first ": " at parenthesis depth 0; with no pointer in the label the summary is the tokens alone, with no leading
      "; ". Refusal reasons, closed
      set: malformed (not a mapping, a terse key missing, or a summary that is not a string), extra_keys (any key outside the terse key set, e.g. migration_story), no_pointer (the summary holds no
      anchor token: PLAN-<slug>, rec-N or Decision N, the three Decision 275 cl.4 says a terse row names; tier ids and
      CD.N travel in the terse row and count in lossless but never anchor it alone), overflow (the result exceeds terse_row.summary_max_chars), not_full (already terse or
      semantic_break true). (3) lossless(old_row, new_row, cfg) -> None or the reason a compaction lost something:
      new is terse by _amendment_retention.is_terse; date, semantic_break and change_class equal; pointer_tokens(new)
      is a superset of pointer_tokens(old). It judges any terse rewrite, tool-made or hand-made; the module docstring
      says "lossless" means pointer tokens only (audit finding ids such as CFR-05 and NS ids may drop, as Decision 275
      cl.4 allows). (6) exempt_file(path, cfg) -> True when the path's basename equals an exempt_files entry's
      basename, the rule _amendment_retention._exempt_file applies (a public helper here so the tool imports no
      private name; a test holds the two equal). (4) compactable(row,
      cfg) -> derive_terse returns a summary. (5) compaction_order(log, cfg) -> indexes of compactable full rows past
      the newest keep_full full rows, oldest first (the rows the tool and its TOTAL compactable count select): full rows are ranked by date (string form); among equal dates the row later in the
      file counts as older (most logs descend); the keep_full rows with the latest dates are kept; logs are not date-ordered in either
      direction (24 files descend, 9 ascend, 34 mix), so position alone never defines "newest".
    new_imports: [scripts.checks.contracts._amendment_retention]
  - file: scripts/checks/contracts/amendment_compact.py
    action: Create
    purpose: >-
      The tool, run as bin/venv-python -m scripts.checks.contracts.amendment_compact [FILES...] (default: every
      docs/contracts/*.yaml; exempt_files and files with no top-level amendment_log are skipped and counted). It is
      not a registered check (precedent scripts/checks/decisions/standards_census.py). It locates each top-level
      amendment_log item with yaml.compose node marks (PyYAML only, no new dependency). A row's span is whole lines:
      from the line holding the item's "- " indicator to the item's last line that is neither blank nor a comment
      (a node's end_mark runs on over trailing blank lines and comments up to the next token, so it is never the span
      end; re-measured on main: 32 naive spans hold a blank line, 29 of them last rows, and 3 hold the next key's
      comment). It replaces the spans of the selected rows, each with one flow-mapping line at the item's indent:
      - {date: <original date scalar text>, semantic_break: <original>, change_class: <original>, summary: "<terse>"}
      (summary double-quoted with \ and " escaped). A row whose span holds a comment line or shares a line with
      another item is refused (reason span_comment). The selected rows are compaction_order's rows minus span
      refusals; proof (c), --check and the TOTAL compactable count all count this set, and a public
      selected_rows(text, cfg) returns it for rec-5453. Before writing it proves, per file, and refuses the whole
      file on any failure: (a) independent of the span computation, the output's lines equal the input's lines with
      each selected row's line range [first, last] replaced by exactly one line, in order (every other input line,
      blank and comment lines included, appears unchanged and in sequence), and the output line count equals the
      input's minus the lines freed; (b) safe_load of the output minus
      amendment_log equals the input's, the row count is equal, untouched rows are equal, and every replaced row
      passes lossless; (c) a second run over the output selects nothing. Input forms: an absent or malformed
      amendment_log_retention (load_retention returns None) prints config_unreadable, writes nothing and exits 1; a
      FILES path that is missing, unreadable or does not parse is reported unreadable; an exempt file is skipped
      whatever its path spelling (exempt_file); a file whose amendment_log is absent or not a list is skipped and counted; a file a proof
      refuses is reported proof_failed with its rows, never written. Modes: default dry run prints one line per file
      (rows compactable, i.e. selected by compaction_order, rows refused by reason, effective lines and bytes freed, using
      scripts.checks.structural._classify.effective_lines) and a final line "TOTAL files=N compactable=N refused=N
      lines_freed=N bytes_freed=N"; --write applies (files that pass are written even when another file fails);
      --rows N compacts at most the N oldest selected rows per file (the one-row decay rec-5453 needs); --check fails
      while any named file still has a compactable row past keep_full and lists refused rows without failing on
      them. Exit codes, every mode: 1 when any file is unreadable or proof_failed, or (--check only) a compactable
      row remains; 2 for a usage error; else 0. Judging hand-made compactions against a base ref is rec-5453's
      (advisor point 4). Output order and wording are deterministic (same input, same bytes), so two PRs compacting
      the same rows produce identical hunks. Under 500 SLOC (Decision 128); split the span/splice half into
      _amendment_splice.py if it crosses.
    new_imports: [scripts.checks.contracts._amendment_terse, scripts.checks.contracts._amendment_retention, scripts.checks.structural._classify]
  - file: tests/checks/contracts/test_amendment_compact.py
    action: Create
    purpose: >-
      rec-5452's acceptance file. Nodes over tmp_path contract files:
      test_block_and_flow_rows_compact_to_one_line (a block row with a folded summary and a long flow row become one
      terse line; is_terse holds; date, semantic_break and change_class bytes unchanged);
      test_non_log_bytes_and_row_count_unchanged (comments and hand layout outside the log survive byte for byte,
      including a block row with a folded summary as the last selected row of a log, followed by a blank line and a
      commented next top-level key: both stay);
      test_newest_keep_full_kept_by_date_not_position (a mixed-order log keeps the five latest dates);
      test_refusals_are_listed_not_applied (extra_keys, no_pointer, overflow, span_comment rows untouched and listed;
      semantic_break rows and exempt_files untouched); test_second_run_is_a_no_op; test_rows_caps_compactions;
      test_check_exits_1_while_compactable_rows_remain (and 0 when only refused rows remain past keep_full);
      test_unreadable_and_malformed_inputs (a file that does not parse exits 1 as unreadable; a non-list log is
      skipped; a non-mapping row, a row missing a terse key and a non-string summary are refused malformed; a missing
      FILES path is unreadable; a None retention config prints config_unreadable, exits 1 and writes nothing; an
      exempt file named by an absolute or scratch path is skipped);
      test_proof_failure_refuses_the_file (a monkeypatched
      splice that alters a neighbour byte leaves the file unwritten); test_dry_run_reports_lines_and_bytes_freed (per-file lines and the TOTAL line).
    new_imports: [scripts.checks.contracts.amendment_compact]
  - file: tests/checks/contracts/test__amendment_terse.py
    action: Create
    purpose: >-
      Coverage mirror for the helper module. Nodes: test_pointer_tokens_normalise (Decisions list, cl. suffix, dec-N,
      tier ids, CD.N; PR numbers and SHAs ignored); test_derive_terse_label_plus_missing_tokens;
      test_derive_terse_refusal_reasons (each closed reason, incl. a row whose only pointer is a tier id or CD.N); test_lossless_judges_any_rewrite (superset passes, a
      dropped token, a changed date or change_class, and a non-terse result fail); test_compaction_order_mixed_dates (equal dates: the later row is compacted first);
      test_malformed_input_never_raises; test_exempt_file_matches_retention_rule (agrees with
      _amendment_retention._exempt_file on repo-relative, absolute and scratch paths).
    new_imports: [scripts.checks.contracts._amendment_terse]
bundled_recommendations: [rec-5452]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "bin/venv-python -m pytest tests/checks/contracts/test_amendment_compact.py::test_non_log_bytes_and_row_count_unchanged -q passes (rec-5452's acceptance, updated 2026-11-24 to this node) and fails before the change (file absent); every other node of the file passes."
  - "Run over a scratch copy of every docs/contracts file, the tool compacts every row it selects with all three proofs passing, a second run selects nothing, --check then exits 0, and the real docs/contracts tree is unchanged (VP 3)."
  - "No contract file, Decision or governing contract text changes in this plan."
  - "rec-5452 is closed by the build's squash-merge Resolves trailer once its acceptance holds (Decision 201)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5452's acceptance nodes pass.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_amendment_compact.py::test_block_and_flow_rows_compact_to_one_line
      tests/checks/contracts/test_amendment_compact.py::test_non_log_bytes_and_row_count_unchanged
      tests/checks/contracts/test_amendment_compact.py::test_refusals_are_listed_not_applied
      tests/checks/contracts/test_amendment_compact.py::test_check_exits_1_while_compactable_rows_remain
      tests/checks/contracts/test__amendment_terse.py::test_lossless_judges_any_rewrite
      tests/checks/contracts/test__amendment_terse.py::test_compaction_order_mixed_dates
      tests/checks/contracts/test_amendment_compact.py::test_newest_keep_full_kept_by_date_not_position -q
    expected: exit 0 with 7 passed; before the change the file does not exist and pytest exits non-zero
    fix_if: a node fails; the splice touched a non-log byte, a pointer was lost, or a refused row was applied
    hermetic: true
    expected_literals: ["7 passed"]
    graduation: graduate
    graduation_check_id: amendment-log-compaction-lossless
  - step: 2
    phase: pre-deploy
    action: Every new node passes and the new modules stay under their SLOC caps.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_amendment_compact.py tests/checks/contracts/test__amendment_terse.py
      tests/checks/contracts/test__amendment_retention.py -q &&
      bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-amendment-log-compaction-tool.yaml
    expected: pytest exits 0 with no failure; plan_obligations reports no SLOC crossing for a scope file
    fix_if: a node fails, or a scope file crosses 500 SLOC (decompose, never a raise, Decision 128)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file re-run of in-scope suites (hermetic authoring rule (v)); the full tier runs them and step 1 graduates the acceptance nodes.
  - step: 3
    phase: pre-deploy
    action: End to end on the real contracts, in a scratch copy, leaving the tree untouched.
    command: >-
      set -o pipefail; d=$(mktemp -d) && cp docs/contracts/*.yaml "$d"/ &&
      bin/venv-python -m scripts.checks.contracts.amendment_compact --write "$d"/*.yaml &&
      bin/venv-python -m scripts.checks.contracts.amendment_compact --check "$d"/*.yaml &&
      bin/venv-python -m scripts.checks.contracts.amendment_compact "$d"/*.yaml | tail -1 &&
      git diff --quiet -- docs/contracts && echo "real tree unchanged"
    expected: >-
      --write exits 0 having compacted rows in every file over keep_full with a compactable row; --check exits 0; the
      dry run's TOTAL line reports compactable=0; prints real tree unchanged
    fix_if: a proof refuses a file, --check exits 1, the dry run still finds rows, or docs/contracts changed
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads the live contracts tree, whose row counts move with every merge; step 1 graduates the behaviour on fixed fixtures.
  - step: 4
    phase: pre-deploy
    action: Readers that pin amendment_log rows still pass on a compacted tree (evidence for rec-5453 and rec-5454; report-only).
    command: >-
      r=$(pwd) && w=$(mktemp -d)/wt && git worktree add --detach "$w" HEAD >/dev/null &&
      cp scripts/checks/contracts/_amendment_terse.py scripts/checks/contracts/amendment_compact.py "$w"/scripts/checks/contracts/ &&
      cp tests/checks/contracts/test_amendment_compact.py tests/checks/contracts/test__amendment_terse.py "$w"/tests/checks/contracts/ &&
      (cd "$w" && export OTL_VENV_PYTHON="$r/.venv/bin/python" && c=$(mktemp -d) &&
      f=$(git grep -l amendment_log -- 'tests/*.py') &&
      bin/venv-python -m pytest $f -q -o cache_dir="$c" -rfE > ../before.out; b=$?;
      bin/venv-python -m scripts.checks.contracts.amendment_compact --write > ../write.out; echo "write_exit=$?"; tail -1 ../write.out;
      bin/venv-python -m pytest $f -q -o cache_dir="$c" -rfE > ../after.out; a=$?;
      echo "pytest_exit before=$b after=$a";
      grep -E '^(FAILED|ERROR) ' ../before.out | cut -d' ' -f2 | sort -u > ../before.txt;
      grep -E '^(FAILED|ERROR) ' ../after.out | cut -d' ' -f2 | sort -u > ../after.txt;
      echo "newly failing:"; comm -13 ../before.txt ../after.txt; [ "$b" -le 1 ] && [ "$a" -le 1 ]); s=$?;
      git worktree remove --force "$w"; (exit $s)
    expected: >-
      write_exit=0 and the TOTAL line; pytest_exit before and after each 0 or 1 (2 or more is an interrupted or
      INTERNALERROR run, never a survey: the step exits non-zero); then "newly failing:" followed by nothing, or by nodes
      (FAILED or ERROR) that pass on HEAD and fail after compaction; each such node names a row a test pins by wording, which the
      build lists in its PR body and adds to rec-5454's context (the compaction plans then refuse or re-point that
      row); the tool is not changed to pass it
    fix_if: >-
      the worktree cannot be created, the interpreter is not found, the tool errors, or a pytest exit is 2 or more
      (OTL_VENV_PYTHON is the bin/venv-python override the CI-parity re-exec uses, borrowed deliberately for the
      venv-less worktree). pytest keeps its cache provider: pyproject.toml addopts carries --randomly-seed=last, which
      needs it (-p no:cacheprovider exits 3 with INTERNALERROR), and one scratch cache_dir for both runs makes "last"
      reuse the first run's seed, so both runs share one test order.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A one-off survey of the 66 amendment_log-reading test files on a scratch tree, not a regression guard; step 1 graduates the tool's behaviour.
  - step: 5
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 6
    phase: post-deploy
    action: rec-5452 reads back closed after the build's squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5452']); print(rows[0]['status'])"
    expected: prints closed
    fix_if: prints open; the Resolves trailer or the closure job did not run, or the acceptance node failed
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/contracts/_amendment_terse.py
    behavior: pointer tokens survive every terse rewrite or the row is refused
    verification_step: 1
    test_selector: tests/checks/contracts/test__amendment_terse.py::test_lossless_judges_any_rewrite
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/contracts/_amendment_terse.py
    behavior: newest is ranked by date, later file position older on equal dates
    verification_step: 1
    test_selector: tests/checks/contracts/test__amendment_terse.py::test_compaction_order_mixed_dates
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/contracts/amendment_compact.py
    behavior: only selected log rows change, and non-log bytes and row count hold
    verification_step: 1
    test_selector: tests/checks/contracts/test_amendment_compact.py::test_non_log_bytes_and_row_count_unchanged
    red_green_expectation: red before (module absent), green after
constraints:
  - Edits no file under docs/contracts and no Decision text; the retention rule and its count stay as Decision 275 cl.4 has them.
  - Never raise in import; no eval or exec; PyYAML only.
  - No rescue agents or workaround loops (Decision 55).
