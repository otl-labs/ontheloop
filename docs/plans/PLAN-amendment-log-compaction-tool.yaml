  - "Plan boundary (advisor 2026-11-24, /mnt/project-files/decision-growth/amendment-log/advisor-brief/ADVICE.md): three plans. This one (tool, mechanical); rec-5453 (decaying ratchet: new Decision amending Decision 275 cl.4, operator wording approval; it imports compactable and compaction_order, counts only compactable rows in the decay term, and may make the retention check call lossless on hand compactions); rec-5454 (the eight near-cap files, one plan and PR per owning project). Both depend only on this build."
  - "Measured on main 936bc4cf (prototype of this rule, after the scout pivot): 27 contracts over keep_full, 151 excess full rows: 107 compactable, 35 extra_keys (all migration_story, which _rule_ratchet.py:85-97 reads), 6 overflow, 3 no_pointer; the eight near-cap files: 46 compactable. VP 3 reports the built tool's counts. One-line flow rows free bytes, not lines (exit-criteria-ledger frees 0 lines)."
  - "Advisor adoption: adopted extractive rule with refusal, tokens incl. tier ids, span splice with three proofs, date ranking, per-change ratchet left to rec-5453, no CI autofix. Deferred to rec-5453: judging hand-made compactions and rebases against a base ref (critique r1 GIC-01 dropped --verify here), and ratifying the date ordering in Decision text."
  - "Critique round 3 escalated (third blocking finding on scope[1]); the operator chose one more round (decision card, 2026-11-24 16:42 UTC)."
  - "red_overlap (2026-11-24, after critique round 4): {\"verdict\": \"clear\", \"reds\": []}. selection_budget over the scope: within_budget, test half 1.7 s."
  - "Amendment 1 (2026-11-24, plan defect from the rec-5454 planning critique, reproduced here): VP 4 ran pytest with -p no:cacheprovider, which pyproject.toml's --randomly-seed=last turns into exit 3 INTERNALERROR, so the survey printed an empty list. Now a shared scratch cache_dir (same seed both runs), -rfE (folds the -rfE half of build note N-14; its run-backgrounded half stands), and the step fails on a pytest exit of 2 or more."
