schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: amendment-log-decaying-ratchet
intent: >-
  Make the 27 contracts over Decision 275's five full amendment_log rows shrink back on their own, so every agent that
  loads them reads less history (NS.4): a change that adds a top-level row also compacts one more row the compaction
  tool can select, an old full row changes only by a lossless terse compaction and stays compactable if it was, and a
  new non-break row is terse or compactable (rec-5453). A new Decision amends Decision 275 cl.4; drift Pass 2 enforces
  it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-amendment-log-decaying-ratchet.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5453 (Medium, M), a follow-on of the contract-first retrospective (CFR-05) and standards-cleanup census row S8.
  Closes no roadmap criterion.
closes_criteria: []
cites: [dec:275, dec:276, dec:177, dec:279]
amends: [dec:275]
introduces: []
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the approved-text sidecar docs/plans/approved/amendment-log-decaying-ratchet.yaml: block DECISIONS-1 adds
      the new Decision at the top of the file (kind direction, amends 275, delegates keep_full {min 3, max 5}; the decay
      step is one, fixed by the Decision); block DECISIONS-2 adds the dated "Amended by" note after Decision 275's
      Related line (Decision 177's annotation form). {{N}} is the next free number at build time and {{DATE}} the build
      date.
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      Text only, no value the check reads changes: amendment_log_retention's rule, exempt_rows and new_row_identity are
      rewritten, citing the new Decision, to state (a) the hold and the decay below, (b) newest by date with equal dates
      reading the later row in the file as older (the tool's compaction_order), (c) the pairing rule, (d) the new-row
      rule, (e) that "pointer" means _amendment_terse.pointer_tokens read over every string value of a row, and (f) that the
      trigger (genuinely_new) still compares rows with dates ignored while pairing compares them with dates included. One
      amendment_log row for this change; the build then satisfies the new rule on this file itself (gotcha in context).
  - file: scripts/checks/contracts/_amendment_retention.py
    action: Modify
    purpose: >-
      Pure helpers, never raising (Decision 55); each new leg returns None when the retention config is None (as
      retention_violation does today) or the file is exempt (exempt_file). "Selected" below is
      amendment_compact.selected_rows(text, cfg): log indexes, as compaction_order returns them (dependency plan
      scope[1]), or, when the text is None, _amendment_terse.compaction_order(log, cfg); "selectable" is membership of selected_rows(text, {**cfg, "keep_full": 0}), or, when the text is None,
      of _amendment_terse.compaction_order(log, {**cfg, "keep_full": 0}). A row is full when it is neither terse nor
      semantic_break is True (full_rows today), so a row whose semantic_break is absent, null or "false" is a non-break
      full row. (1) pair_rows(base_log, head_log, cfg) -> (matches, pairs, new_rows, unpaired_base): rows whose canonical dumps
      (dates included) are equal are matches, matched as a multiset, first unmatched in file order; then each remaining base row, in
      file order, pairs with the first remaining head row that is a lossless compaction of it (passes
      _amendment_terse.lossless and keeps row_pointers(base row)); only a base row left over after that pairs with the
      first remaining head row of equal date, semantic_break and change_class, so its failure names the right row;
      matches and pairs are lists of (base index, head index); unmatched head rows are new_rows. So a new row dated and classed like a compacted row never captures its pairing.
      (2) change_violation judges only pairs and unpaired_base, never matches: a paired or unpaired base row fails unless it is a non-break full row and its head row
      passes _amendment_terse.lossless and keeps row_pointers(base row) (pointer_tokens over every string value of the
      row, migration_story included) within pointer_tokens(head summary); the message names the row's date and
      change_class and the reason (not lossless, pointer lost, no pointer named, terse or semantic-break row changed,
      or "row dropped, re-dated or reclassified" for an unpaired base row, since both pairing passes need an equal date,
      semantic_break and change_class). "Anchored" means pointer_tokens(summary) holds a PLAN-<slug>, rec-N or Decision
      N token (the anchor the tool's no_pointer refusal tests; a tier id or CD.N alone is not one). A base row whose
      row_pointers hold no anchor also fails unless its head row is anchored, so a hand compaction names the row's plan,
      rec or Decision as Decision 275 cl.4's terse row does; the hand-compaction message says to find it from git blame
      of the row. (3) new_row_violation: each new row that is not a mapping fails; each new row whose semantic_break is
      not True must be an anchored terse row (is_terse and anchored, clause 4's "names its plan, rec or Decision") or
      selectable on the head. (4) selectability_violation(base_text, head_text): a
      base row selectable on the base whose identical head row (its pair_rows match) is not selectable on the head
      fails (a comment or shared line added to its span); skipped when either text is None. (5) retention_violation(name,
      base_data, head_data, cfg=None, head_text=None): the trigger stays genuinely_new > 0 and the dropped-row message
      stays; hold = max(keep_full, F_base) and decay_target = max(keep_full, F_base - 1) over full_rows counts; fail
      when F_head > hold, or when F_head > decay_target and the head's selected set is non-empty; the message names
      N = min(len(selected), F_head - decay_target) and bin/venv-python -m scripts.checks.contracts.amendment_compact
      --write --rows N docs/contracts/<name>, or, with an empty selected set, says the tool selects no row and to compact an older
      row by hand to a lossless terse row (the phrase "compact an older row" stays, as
      test_adding_a_row_past_keep_full_without_compacting_fails asserts it). (6) pass2_messages(name, base_data, head_data, both_class_d,
      base_text=None, head_text=None) runs retention, change, new-row and selectability legs (labels "Contract drift
      (retention|change|new-row|selectability)") and rewrite_violation unchanged. Import the two tool modules as
      modules (from scripts.checks.contracts import _amendment_terse, amendment_compact), never their names, since both
      import this module; if either imports names from this module (from ..._amendment_retention import x), import
      them inside the functions instead, and a fresh-interpreter import of each of the three modules first must pass. Under 500 SLOC (Decision 128).
    new_imports: [scripts.checks.contracts._amendment_terse, scripts.checks.contracts.amendment_compact]
  - file: scripts/checks/contracts/validate_contract_drift.py
    action: Modify
    purpose: >-
      Pass 2 (around :359-404) keeps the head file text it already reads at :365 and hands base_text and that head text
      to _amendment_retention.pass2_messages. No other behaviour change.
  - file: tests/checks/contracts/test__amendment_retention.py
    action: Modify
    purpose: >-
      Fixtures: add _plain(n) (the four keys, summary "PLAN-x-n: " plus over 160 characters, no migration_story: full and
      compactable). Existing nodes adjusted for the new legs, each a tightening, never a loosening; the build records in this plan's weakening_dispositions
      [assertion-changed] ...::TestPass2Messages::test_labels as planned-change (citing test_obligations) and
      [test-removed] ...::TestRetention::test_adding_a_terse_row_never_fails as refactor (citing its renamed node): TestPass2Messages::test_labels' first case adds _plain(9) as the new row (still one
      retention message); its reworded-row cases now expect the change message too (both_class_d True: rewrite and
      change messages; False: the change message alone, where it expected []); test_adding_a_terse_row_never_fails is
      renamed test_adding_a_terse_row_to_a_held_base_passes, its assertion unchanged. New nodes: test_decaying_ratchet
      (rec-5453's acceptance: a base of 7 _plain rows plus one new _plain row fails with one compaction and passes with
      two; two new rows need three; the message names --rows and the tool); test_decay_counts_only_selected_rows
      (compactable rows only inside the newest five, and newest rows refused: never asks more than selected offers);
      test_hold_binds_where_the_tool_selects_nothing; test_semantic_break_or_terse_new_row_still_triggers_decay;
      test_old_row_changes_only_by_lossless_compaction (reworded, pointer dropped, pointer held only in migration_story
      dropped, re-dated, semantic_break row changed, terse row changed and dropped row fail; a lossless compaction
      passes with and without a new row, including a same-date, same-change_class new row placed above the
      compacted row; a hand compaction of an anchorless row fails unless the terse row names a PLAN, rec or Decision); test_new_non_break_row_is_terse_or_compactable (migration_story, no
      pointer, overflow and non-mapping new rows fail; a terse row with no anchor, or with only a tier id or CD.N, fails; a migration_story row with semantic_break absent or "false"
      fails, since only True exempts; terse, _plain and semantic_break True rows pass); test_comment_in_span_cannot_make_a_row_unselectable (text fixtures: a comment
      added inside a selectable row in the newest five and one past them both fail; texts None skip the leg);
      test_none_config_and_exempt_file_skip_every_leg. The real-tree node lives in the wiring file (not this graduated
      whole-file shard, critique LIV-01).
  - file: tests/checks/contracts/validate_contract_drift/test_amendment_retention_wiring.py
    action: Modify
    purpose: >-
      _CFG gains contract-population.yaml's terse_row mapping (keys and summary_max_chars 160), so no node leans on a
      tool default. TestRetentionWiring::test_genuinely_new_row_with_a_compaction_passes takes a four-key new row (its _row(9) loses
      migration_story), assertion unchanged (tightened rule, same claim). A new class TestDecayWiring with two nodes, on four-key fixtures (_row carries migration_story, which the tool
      refuses):
      test_decay_failure_names_the_tool_command (a changed contract whose base holds compactable rows past keep_full
      fails Pass 2 with the amendment_compact command) and test_pass2_receives_file_texts (a comment added inside a
      selectable row's span fails through the real Pass 2 path). A new class TestRealTree with
      test_real_contracts_can_meet_the_ratchet (it undoes the module's load_retention stub and reads
      contract-population.yaml's live mapping; for every non-exempt docs/contracts file: adding one terse row naming a
      PLAN token, dated
      after every row, then applying the tool's compaction of the N rows the message names, leaves pass2_messages empty;
      adding one _plain row instead leaves it empty or holds only the hand-compaction message). Rows go in as text at the
      top of a block-sequence top-level log; a file with no top-level log or an empty or flow-sequence log (for example
      check-manifest.yaml's amendment_log: []) is skipped, since it has no row to decay; a tool error on a real file fails
      the node naming the file, since the rule must be meetable there). Measure its runtime at build (critique estimate
      about 45 s over 83 contracts); over 20 s, judge only files with F_base >= keep_full (the rest pass trivially).
  - file: audits/standards-cleanup-census.yaml
    action: Modify
    purpose: >-
      Row S8: source "Decision 275 cl.4, Decision <N> cl.1-4"; disposition conform; owner "Decision <N> cl.1"; reason
      "files over keep_full shrink by one selected row per row-adding change under the decaying ratchet; rows the
      compaction tool refuses are held, never grown, and new non-break rows are terse or compactable." The reason names
      no rec (file header), so rec-5453 leaves the file.
bundled_recommendations: [rec-5453]
