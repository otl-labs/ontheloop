    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test__amendment_retention.py::test_decaying_ratchet
      tests/checks/contracts/test__amendment_retention.py::test_decay_counts_only_selected_rows
      tests/checks/contracts/test__amendment_retention.py::test_hold_binds_where_the_tool_selects_nothing
      tests/checks/contracts/test__amendment_retention.py::test_semantic_break_or_terse_new_row_still_triggers_decay
      tests/checks/contracts/test__amendment_retention.py::test_old_row_changes_only_by_lossless_compaction
      tests/checks/contracts/test__amendment_retention.py::test_new_non_break_row_is_terse_or_compactable
      tests/checks/contracts/test__amendment_retention.py::test_comment_in_span_cannot_make_a_row_unselectable
      tests/checks/contracts/test__amendment_retention.py::test_none_config_and_exempt_file_skip_every_leg
      tests/checks/contracts/validate_contract_drift/test_amendment_retention_wiring.py::TestDecayWiring -q
    expected: exit 0 with 10 passed (TestDecayWiring holds the two wiring nodes); before the change the nodes do not exist and pytest exits non-zero
    fix_if: a node fails; the decay asks more than the tool selects, the hold no longer binds, a lossy or re-dated row passes, or Pass 2 drops the texts
    hermetic: true
    expected_literals: ["10 passed"]
    graduation: graduate
    graduation_check_id: amendment-log-decaying-ratchet
  - step: 2
    phase: pre-deploy
    action: Whole in-scope test files, the real-tree feasibility node and SLOC headroom.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test__amendment_retention.py
      tests/checks/contracts/validate_contract_drift/ tests/checks/contracts/test_amendment_compact.py
      tests/checks/decisions/test_standards_census.py -q &&
      bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-amendment-log-decaying-ratchet.yaml
    expected: pytest exits 0 with no failure (test_real_contracts_can_meet_the_ratchet and test_real_retention_mapping included); plan_obligations reports no SLOC crossing for a scope file
    fix_if: a node fails, or a scope file crosses 500 SLOC (decompose, never a raise, Decision 128)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file re-runs of in-scope suites (hermetic authoring rule (v)) and live-tree reads; step 1 graduates the behaviour on fixed fixtures and the full tier runs these files.
  - step: 3
    phase: pre-deploy
    action: Census row S8 re-disposed and rec-5453 gone from the census file.
    command: >-
      bin/venv-python -m scripts.checks.decisions.standards_census --verify audits/standards-cleanup-census.yaml --read-owners &&
      ! grep -q "rec-5453" audits/standards-cleanup-census.yaml && echo "census ok"
    expected: verify exits 0 with no defect and the command prints census ok
    fix_if: a defect names S8 (owner not a live Decision clause, guard unregistered) or rec-5453 is still in the file
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: The Decision text equals the approved sidecar and the entry is conformant.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug amendment-log-decaying-ratchet &&
      bin/venv-python -c "import sys; from scripts.checks.decisions.validate_decision_entry_conformance import validate_decision_entry_conformance as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: both exit 0; verify reports the two blocks applied with placeholders filled, and the conformance call prints []
    fix_if: verify names a block whose words differ (restore the sidecar's words, never edit them), or conformance names the new entry
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 (validate_contract_drift passes on the build's own contract-population.yaml change) and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 6
    phase: post-deploy
    action: rec-5453 reads back closed after the build's squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5453']); print(rows[0]['status'])"
    expected: prints closed
    fix_if: prints open; the Resolves trailer or the closure job did not run, or the acceptance node failed
    hermetic: false
    graduation: not-applicable
