acceptance_criteria:
  - "bin/venv-python -m pytest tests/checks/contracts/test__amendment_retention.py::test_decaying_ratchet -q passes, fails before the change (node absent), and audits/standards-cleanup-census.yaml no longer names rec-5453 (rec-5453's acceptance)."
  - "docs/DECISIONS.md differs from its base by exactly the sidecar's two blocks with {{N}} and {{DATE}} filled; validate_merge_step reads the operator's GitHub approval of the sidecar."
  - "Every real contract can meet the new rule for a terse new row by running the printed tool command alone, and for a full new row by that command or a lossless hand compaction (TestRealTree::test_real_contracts_can_meet_the_ratchet); the build's own contract-population.yaml change passes validate_contract_drift under it."
  - "bin/venv-python -m scripts.checks.decisions.standards_census --verify audits/standards-cleanup-census.yaml --read-owners exits 0 with S8 conform and owned by the new Decision."
  - "rec-5453 is closed by the build's squash-merge Resolves trailer once its acceptance holds (Decision 201)."
