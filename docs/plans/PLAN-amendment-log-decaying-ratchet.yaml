schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: amendment-log-decaying-ratchet
intent: >-
  Make the 27 contracts over Decision 275's five full amendment_log rows shrink back on their own, so every agent that
  loads them reads less history (NS.4): a change that adds a top-level row also compacts one more row the compaction
  tool can select, an old row changes only by a lossless terse compaction, and a new non-break row carries only the
  terse keys (rec-5453). A new Decision amends Decision 275 cl.4; drift Pass 2 enforces it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-amendment-log-decaying-ratchet.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5453 (Medium, M), a follow-on of the contract-first retrospective (CFR-05) and standards-cleanup census row S8.
  Closes no roadmap criterion.
closes_criteria: []
cites: [dec:275, dec:276, dec:177, dec:279]
amends: [dec:275]
introduces: []
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the approved-text sidecar docs/plans/approved/amendment-log-decaying-ratchet.yaml: block DECISIONS-1 adds
      the new Decision at the top of the file (kind direction, amends 275, delegates keep_full {min 3, max 5} and
      decay_per_change {min 1, max 3}); block DECISIONS-2 adds the dated "Amended by" note after Decision 275's Related
      line (Decision 177's annotation form). {{N}} is the next free number at build time and {{DATE}} the build date.
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      amendment_log_retention gains decay_per_change: 1 (the new Decision's delegated D), and its rule, exempt_rows and
      new_row_identity text restate, citing the new Decision: (a) when a change adds a new row (pairing below), head full
      rows may not exceed hold = max(keep_full, base full rows), nor decay_target = max(keep_full, base full rows -
      decay_per_change) while the tool's selected set on the head is non-empty; (b) newest ranks full rows by date,
      equal dates reading the later row in the file as older (the tool's compaction_order); (c) pairing: rows with
      identical dumps (dates included) match as a multiset in file order; every unmatched base row must be a full,
      non-break row paired, first unpaired in file order, with a head row of equal date, semantic_break and
      change_class that _amendment_terse.lossless accepts; unmatched head rows are the change's new rows; (d) a new row
      with semantic_break false carries exactly terse_row.keys; (e) the pointer set is the tool's pointer_tokens. One
      amendment_log row for this change; the build then satisfies the new rule on this file itself (gotcha in context).
  - file: scripts/checks/contracts/_amendment_retention.py
    action: Modify
    purpose: >-
      Pure helpers, never raising (Decision 55). decay_per_change(cfg) (absent, bool, non-int or below 1 reads as 1).
      pair_rows(base_log, head_log, cfg) -> (new_rows, unpaired_base) per the contract's pairing rule.
      change_violation(name, base_data, head_data, cfg): an unpaired base row fails, naming its date and change_class
      and why (changed but not a lossless terse compaction; a terse or semantic_break row changed; a row dropped).
      new_row_violation: a new row with semantic_break false and keys other than terse_row.keys fails.
      retention_violation(name, base_data, head_data, cfg=None, head_text=None, base_text=None): when new_rows is
      non-empty, F = full_rows counts, selected = amendment_compact.selected_rows(head_text, cfg) when head_text is
      given, else _amendment_terse.compaction_order(head_log, cfg); fail when F_head > hold, or when F_head >
      decay_target and selected is non-empty; the message names N = min(len(selected), F_head - decay_target) and the
      command bin/venv-python -m scripts.checks.contracts.amendment_compact --write --rows N docs/contracts/<name>, or,
      when selected is empty, says the tool selects no row and an older row needs a lossless hand compaction.
      unselectable_violation(base_text, head_text, cfg): a row in selected_rows(base_text) whose identical head row
      (pair_rows' matching) is neither in selected_rows(head_text) nor among the head's newest keep_full full rows
      fails (a comment or shared line added to its span). pass2_messages(name, base_data, head_data, both_class_d,
      base_text=None, head_text=None) runs all four, then rewrite_violation unchanged. Exempt files (exempt_file) skip
      every leg. Existing nodes keep passing: their full-row fixtures carry migration_story, so the tool selects none
      and the hold binds as today. Under 500 SLOC (Decision 128).
    new_imports: [scripts.checks.contracts._amendment_terse, scripts.checks.contracts.amendment_compact]
  - file: scripts/checks/contracts/validate_contract_drift.py
    action: Modify
    purpose: >-
      Pass 2 (around :365-404) keeps the head file text it already reads and hands base_text and head text to
      _amendment_retention.pass2_messages. No other behaviour change.
  - file: tests/checks/contracts/test__amendment_retention.py
    action: Modify
    purpose: >-
      New nodes with compactable fixtures (rows of the four keys whose summary names a PLAN-, rec- or Decision token, no
      migration_story): test_decaying_ratchet (rec-5453's acceptance: a base of 7 compactable full rows plus a new row
      fails with one compaction and passes with two; adding two rows needs three; the message names --rows and the
      tool); test_decay_counts_only_selected_rows (compactable rows only inside the newest five, and newest rows
      uncompactable: the rule never asks for more than selected_rows offers); test_hold_binds_where_the_tool_selects_nothing;
      test_semantic_break_or_terse_new_row_still_triggers_decay; test_old_row_changes_only_by_lossless_compaction
      (reworded, pointer dropped, re-dated, semantic_break row changed, terse row changed and dropped row fail; a lossless
      compaction passes, with and without a new row); test_new_non_break_row_carries_only_terse_keys;
      test_comment_in_span_cannot_make_a_row_unselectable (text fixtures); test_decay_per_change_reads_the_contract;
      test_real_contracts_can_meet_the_ratchet (for every non-exempt docs/contracts file: add one compactable row dated
      after every row, apply the tool's compaction of the N rows the message names to the text, and assert
      pass2_messages is empty). test_real_retention_mapping also asserts decay_per_change >= 1 and that terse_row.keys
      is the four keys.
  - file: tests/checks/contracts/validate_contract_drift/test_amendment_retention_wiring.py
    action: Modify
    purpose: >-
      A new class TestDecayWiring with two nodes: test_decay_failure_names_the_tool_command (a changed contract whose base holds compactable rows past keep_full
      fails Pass 2 with the amendment_compact command) and test_pass2_receives_file_texts (a comment added inside a
      selectable row's span fails through the real Pass 2 path).
  - file: audits/standards-cleanup-census.yaml
    action: Modify
    purpose: >-
      Row S8: source "Decision 275 cl.4, Decision <N> cl.1-4"; disposition conform; owner "Decision <N> cl.1"; reason
      "files over keep_full shrink by one selected row per row-adding change under the decaying ratchet; rows the
      compaction tool refuses are held, never grown, and new non-break rows carry only the terse keys." The reason
      names no rec (file header), so rec-5453 leaves the file.
bundled_recommendations: [rec-5453]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "bin/venv-python -m pytest tests/checks/contracts/test__amendment_retention.py::test_decaying_ratchet -q passes, fails before the change (node absent), and audits/standards-cleanup-census.yaml no longer names rec-5453 (rec-5453's acceptance)."
  - "docs/DECISIONS.md differs from its base by exactly the sidecar's two blocks with {{N}} and {{DATE}} filled; validate_merge_step reads the operator's GitHub approval of the sidecar."
  - "Every real contract can meet the new rule by running the printed tool command (test_real_contracts_can_meet_the_ratchet), and the build's own contract-population.yaml change passes validate_contract_drift under it."
  - "standards_census --verify --read-owners exits 0 with S8 conform and owned by the new Decision."
  - "rec-5453 is closed by the build's squash-merge Resolves trailer once its acceptance holds (Decision 201)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5453's acceptance and the rule's behaviour nodes pass.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test__amendment_retention.py::test_decaying_ratchet
      tests/checks/contracts/test__amendment_retention.py::test_decay_counts_only_selected_rows
      tests/checks/contracts/test__amendment_retention.py::test_hold_binds_where_the_tool_selects_nothing
      tests/checks/contracts/test__amendment_retention.py::test_old_row_changes_only_by_lossless_compaction
      tests/checks/contracts/test__amendment_retention.py::test_new_non_break_row_carries_only_terse_keys
      tests/checks/contracts/test__amendment_retention.py::test_comment_in_span_cannot_make_a_row_unselectable
      tests/checks/contracts/validate_contract_drift/test_amendment_retention_wiring.py::TestDecayWiring -q
    expected: exit 0 with 8 passed (TestDecayWiring holds the two wiring nodes); before the change the nodes do not exist and pytest exits non-zero
    fix_if: a node fails; the decay asks more than the tool selects, the hold no longer binds, a lossy or re-dated row passes, or Pass 2 drops the texts
    hermetic: true
    expected_literals: ["8 passed"]
    graduation: graduate
    graduation_check_id: amendment-log-decaying-ratchet
  - step: 2
    phase: pre-deploy
    action: Whole in-scope test files, the real-tree feasibility node and SLOC headroom.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test__amendment_retention.py
      tests/checks/contracts/validate_contract_drift/ tests/checks/contracts/test_amendment_compact.py
      tests/checks/decisions/test_standards_census.py -q &&
      bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-amendment-log-decaying-ratchet.yaml
    expected: pytest exits 0 with no failure (test_real_contracts_can_meet_the_ratchet and test_real_retention_mapping included); plan_obligations reports no SLOC crossing for a scope file
    fix_if: a node fails, or a scope file crosses 500 SLOC (decompose, never a raise, Decision 128)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file re-runs of in-scope suites (hermetic authoring rule (v)) and live-tree reads; step 1 graduates the behaviour on fixed fixtures and the full tier runs these files.
  - step: 3
    phase: pre-deploy
    action: Census row S8 re-disposed and rec-5453 gone from the census file.
    command: >-
      bin/venv-python -m scripts.checks.decisions.standards_census --verify --read-owners &&
      ! grep -q "rec-5453" audits/standards-cleanup-census.yaml && echo "census ok"
    expected: verify exits 0 with no defect and the command prints census ok
    fix_if: a defect names S8 (owner not a live Decision clause, guard unregistered) or rec-5453 is still in the file
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: The Decision text equals the approved sidecar and the entry is conformant.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug amendment-log-decaying-ratchet &&
      bin/venv-python -c "import sys; from scripts.checks.decisions.validate_decision_entry_conformance import validate_decision_entry_conformance as f; failed=[]; f(failed); print(failed); sys.exit(1 if failed else 0)"
    expected: both exit 0; verify reports the two blocks applied with placeholders filled, and the conformance call prints []
    fix_if: verify names a block whose words differ (restore the sidecar's words, never edit them), or conformance names the new entry
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 (validate_contract_drift passes on the build's own contract-population.yaml change) and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 6
    phase: post-deploy
    action: rec-5453 reads back closed after the build's squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5453']); print(rows[0]['status'])"
    expected: prints closed
    fix_if: prints open; the Resolves trailer or the closure job did not run, or the acceptance node failed
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/contracts/_amendment_retention.py
    behavior: a row-adding change decays by one selected row, never asking more than the tool selects
    verification_step: 1
    test_selector: tests/checks/contracts/test__amendment_retention.py::test_decaying_ratchet
    red_green_expectation: red before (node absent), green after
  - source: scripts/checks/contracts/_amendment_retention.py
    behavior: an old row changes only by a lossless terse compaction
    verification_step: 1
    test_selector: tests/checks/contracts/test__amendment_retention.py::test_old_row_changes_only_by_lossless_compaction
    red_green_expectation: red before (node absent), green after
  - source: scripts/checks/contracts/validate_contract_drift.py
    behavior: Pass 2 hands both file texts to the retention check
    verification_step: 1
    test_selector: tests/checks/contracts/validate_contract_drift/test_amendment_retention_wiring.py::TestDecayWiring
    red_green_expectation: red before (class absent), green after
  - source: docs/contracts/contract-population.yaml
    behavior: the delegated decay value is present and at least one
    verification_step: 2
    test_selector: tests/checks/contracts/test__amendment_retention.py::test_real_retention_mapping
    red_green_expectation: red before (decay_per_change absent), green after
constraints:
  - "Start only after the rec-5452 build (PLAN-amendment-log-compaction-tool) merges: this plan imports amendment_compact.selected_rows and _amendment_terse.lossless, compaction_order and pointer_tokens as that plan's scope rows define them. If their names or signatures differ on main, stop and report a plan defect (coordinator.yaml routing.plan_defect); never re-implement them here."
  - DECISIONS.md words come only from the approved sidecar; any other wording change needs a new approval run.
  - No CI autofix and no write to any contract other than contract-population.yaml; the eight near-cap files are rec-5454's.
  - Never raise in import; no eval or exec; PyYAML only. No rescue agents or workaround loops (Decision 55).
