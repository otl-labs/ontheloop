constraints:
  - "Start only after the rec-5452 build (PLAN-amendment-log-compaction-tool) merges: this plan imports amendment_compact.selected_rows and _amendment_terse.lossless, compaction_order and pointer_tokens as that plan's scope rows define them. If their names or signatures differ on main, stop and report a plan defect (coordinator.yaml routing.plan_defect); never re-implement them here."
  - DECISIONS.md words come only from the approved sidecar; any other wording change needs a new approval run.
  - No CI autofix and no write to any contract other than contract-population.yaml; the eight near-cap files are rec-5454's.
  - Never raise in import; no eval or exec; PyYAML only. No rescue agents or workaround loops (Decision 55).
