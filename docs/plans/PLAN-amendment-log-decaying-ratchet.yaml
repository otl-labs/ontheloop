  - "Decay step fixed at one in the Decision, not delegated: wording-check round 1 failed because a delegate key must resolve at head and contract-population.yaml is not a sidecar file; the step is the operator's ruling (max(5, base - 1))."
  - "Advisor (fresh Fable, 2026-11-24): /mnt/project-files/decision-growth/amendment-log/ratchet/advisor-brief/ADVICE.md. Adopted: head-floored decay with today's hold kept (the floated uncompactable + (compactable_base - 1) formula and a base-anchored one both demand impossible compactions), verification in drift Pass 2 only (no tool --verify mode: one judge), direction kind with a keep_full delegate, fail at once, S8 conform owned by the Decision, new-row key rule. Not adopted: a census query for refused rows by reason (clause 4 stops new ones; residual named in the Decision's Coverage)."
  - "Operator: 'write the plan' 2026-11-24 17:31 UTC; clause 4 (new non-break rows carry only the terse keys) chosen on a decision card 17:31 UTC; critique round 1 (GIC-01) widened it to 'terse or compactable' (a pointer and a fitting label too), shown in the approval run's wording. Wording approval: GitHub approval run of the sidecar (Decision 246), link in the handoff."
  - "Measured on main 30a7a678 with a prototype of the tool's rule (/mnt/project-files/decision-growth/amendment-log/ratchet/evidence/): 27 files over keep_full, 286 full rows, 107 selectable, 44 refused past the newest five; 4 files select nothing (hold only). 105 top-level non-break rows carry migration_story, 21 added in November; nothing reads it there (_rule_ratchet.py reads only field-level logs, :64-65, :85-86)."
