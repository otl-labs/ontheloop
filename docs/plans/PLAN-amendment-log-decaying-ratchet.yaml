pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decision 275 (clauses 3-5) and Decision 276 (clauses 1-2) read
  - The rec-5452 build is on main and its helper names match the constraints
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Apply the sidecar's two DECISIONS.md blocks, filling {{N}} with the next free Decision number and {{DATE}} with today.
  - Edit docs/contracts/contract-population.yaml amendment_log_retention, add its amendment_log row, and satisfy the new rule on that file (context gotcha).
  - Extend scripts/checks/contracts/_amendment_retention.py and thread the texts through validate_contract_drift.py Pass 2.
  - Add the test nodes, then re-dispose census row S8 with the new Decision's number and regenerate docs/decisions-index.json (sanctioned companion) before VP 3 (critique N-02).
  - Execute the Verification Plan; loop until each step passes; on an unrecoverable failure stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results, and the files whose next row-adding change now owes a decay.'
