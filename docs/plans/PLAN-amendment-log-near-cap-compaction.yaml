schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: amendment-log-near-cap-compaction
intent: >-
  Give the eight contracts nearest their line or byte budget real headroom by compacting their old full amendment_log
  rows to terse rows with the rec-5452 tool (Decision 275 cl.4), so their owners' next changes need no raise or split
  (rec-5454). Only top-level amendment_log rows change; every pointer token survives.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-amendment-log-near-cap-compaction.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5454 (Low, M), a follow-on of the contract-first retrospective (CFR-05) and the standards-cleanup census row S8.
  Closes no roadmap criterion.
closes_criteria: []
cites: [dec:275, dec:235]
amends: []
introduces: []
scope:
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log (bin/venv-python -m scripts.checks.contracts.amendment_compact --write); no other byte changes.
  - file: docs/contracts/implement-scope-boundary.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes. Its sloc_budgets roster entry (533, dec-250) is left as is.
  - file: docs/contracts/github-actions-evidence.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes.
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes (its rows are one-line flow rows, so it frees bytes, not lines).
  - file: docs/contracts/ci-rca-lifecycle.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes.
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes.
  - file: tests/test_scope_boundary_contract.py
    action: Modify
    purpose: >-
      TestContractShape::test_bookkeeping_row_documents_the_two_act_amendment_procedure selects the 2026-09-07 row by
      the "sanction_row_eligibility" wording and asserts "amendment_procedure" and "conscious-choice" in its summary;
      the tool compacts that row to its label plus tokens, so those words go (they stay in git history, Decision 275
      cl.4). Re-point: select by the surviving token PLAN-scope-boundary-test-coupling (exactly one row, as today) and
      keep the "Decision 75" assertion; drop the two history-wording assertions and say so in the docstring. The
      live-key assertions in the same test (amendment_procedure "lands on" main, "single diff"/"one diff") are
      unchanged. Code-review disposition planned-change (test_obligations[0]; Decision 275 cl.4-5 allow the row's
      rewrite), recorded as an operator-approved loosening under Decision 235 cl.1 (operator choice 2026-11-24); the
      only test edit this plan allows.
bundled_recommendations: [rec-5454]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "rec-5454's acceptance holds: bin/venv-python -m scripts.checks.contracts.amendment_compact --check over the eight files exits 0, and exits 1 on the base."
  - "For each of the eight files, safe_load minus amendment_log equals the base's, the row count equals the base's, and every changed row is terse and keeps every pointer token of its base row (VP 2)."
  - "No test that reads an amendment_log newly fails, except the one node re-pointed here, which passes after the change (VP 3, VP 4)."
  - "The diff touches only the nine scope files."
  - "rec-5454 is closed by the build's squash-merge Resolves trailer once its acceptance holds (Decision 201)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5454's acceptance, the tool's own gate over the eight files.
    command: >-
      bin/venv-python -m scripts.checks.contracts.amendment_compact --check docs/contracts/environment-taxonomy.yaml
      docs/contracts/implement-scope-boundary.yaml docs/contracts/data-modeling-standard.yaml
      docs/contracts/github-actions-evidence.yaml docs/contracts/exit-criteria-ledger.yaml
      docs/contracts/ci-rca-lifecycle.yaml docs/contracts/verification-registry.yaml docs/contracts/decision-entry.yaml
    expected: exit 0; before the change it exits 1 listing compactable rows past keep_full
    fix_if: exit 1 (a compactable row remains; re-run --write) or a file reported unreadable or proof_failed
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Every later row added to these logs moves the count; holding it on main is rec-5453's ratchet, not a graduated check.
  - step: 2
    phase: pre-deploy
    action: Independent proof against the base, per file, without the tool's code.
    command: >-
      bin/venv-python -c "import subprocess, yaml, re;
      fs=['environment-taxonomy','implement-scope-boundary','data-modeling-standard','github-actions-evidence','exit-criteria-ledger','ci-rca-lifecycle','verification-registry','decision-entry'];
      tok=lambda s: set(re.findall(r'PLAN-[a-z0-9-]*[a-z0-9]|rec-\d+|Decision \d+|T-?\d+\.\d+[a-z]?|CD\.\d+', s));
      bad=[];
      [bad.append(f) for f in fs
       for b,h in [(yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/'+f+'.yaml'],capture_output=True,text=True,check=True).stdout), yaml.safe_load(open('docs/contracts/'+f+'.yaml')))]
       if {k:v for k,v in b.items() if k!='amendment_log'}!={k:v for k,v in h.items() if k!='amendment_log'}
       or len(b['amendment_log'])!=len(h['amendment_log'])
       or any(o!=n and ((o['date'],o['semantic_break'],o['change_class'])!=(n['date'],n['semantic_break'],n['change_class']) or not tok(o['summary'])<=tok(n['summary'])) for o,n in zip(b['amendment_log'],h['amendment_log']))];
      print('BAD', bad) if bad else print('eight files proven')"
    expected: prints eight files proven
    fix_if: a file is listed; non-log content, the row count, a row's date, semantic_break or change_class, or a pointer token changed
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Compares against origin/main, which moves after merge; the tool's own proofs and step 1 carry the behaviour.
  - step: 3
    phase: pre-deploy
    action: The re-pointed test node passes on the compacted contract.
    command: bin/venv-python -m pytest "tests/test_scope_boundary_contract.py::TestContractShape::test_bookkeeping_row_documents_the_two_act_amendment_procedure" -q
    expected: exit 0 with 1 passed; with the compaction applied and the test unchanged it fails (no row names sanction_row_eligibility)
    fix_if: the node fails; the PLAN token no longer selects exactly one row, or Decision 75 was lost from the row
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: No other test that reads an amendment_log newly fails (base worktree versus the working tree).
    command: >-
      w=$(mktemp -d)/base && git worktree add --detach "$w" origin/main >/dev/null &&
      f=$(git grep -l amendment_log -- 'tests/*.py') &&
      (cd "$w" && export OTL_VENV_PYTHON="$OLDPWD/.venv/bin/python" && bin/venv-python -m pytest $f -q -p no:cacheprovider -rfE | grep -E '^(FAILED|ERROR)' | cut -d' ' -f2 | sort -u) > "$w/../before.txt";
      bin/venv-python -m pytest $f -q -p no:cacheprovider -rfE | grep -E '^(FAILED|ERROR)' | cut -d' ' -f2 | sort -u > "$w/../after.txt";
      echo "newly failing:"; comm -13 "$w/../before.txt" "$w/../after.txt"; git worktree remove --force "$w"
    expected: prints newly failing followed by nothing
    fix_if: >-
      a node is listed. It pins a row the tool compacted. Do not edit the test or the row: stop and send a plan-defect
      report to the coordinator (routing.plan_defect), naming the node and the row; the operator rules on each extra
      loosening (Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A one-off survey of the amendment_log-reading test files against the base, not a regression guard.
  - step: 5
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 6
    phase: post-deploy
    action: rec-5454 reads back closed after the build's squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5454']); print(rows[0]['status'])"
    expected: prints closed
    fix_if: prints open; the Resolves trailer or the closure job did not run, or the acceptance failed
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: tests/test_scope_boundary_contract.py
    behavior: the two-act amendment procedure row is still found by its plan token and still names Decision 75
    verification_step: 3
    test_selector: tests/test_scope_boundary_contract.py::TestContractShape::test_bookkeeping_row_documents_the_two_act_amendment_procedure
    red_green_expectation: red after compaction with the old selector, green after the re-point
constraints:
  - Contract bytes change only by the tool's --write; no hand edit of any contract line, and no row outside a top-level amendment_log.
  - No test edit beyond the one node in scope; a newly failing node is a plan defect, never a test change (Decision 235).
  - No Decision text and no governing contract text changes; Decision 275 cl.4 authorises terse compaction.
  - The build starts only after the rec-5452 tool build has merged; it runs the tool from main, never a copy.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout round 1 (draft, 2026-11-24): FLAGS_FOUND. Decisions triaged: 228 of 228. Roadmap items intersected: 4; CONFLICT: 0; RELATED: 4. Serves: NS.4 4/5. CITE: dec:275, dec:235. NOTE Decision 235 cl.1 (a check red on the change is never eligible for weakening): adapted -- the test pins history wording Decision 275 cl.4-5 allow to be rewritten, so the edit is the planned-change disposition, named here and operator-approved. RELATED 240, 279 (all eight files notice class, no approval run), 181, 168, 128/166, 245, 201, 163, 86/127."
  - "Operator choices (2026-11-24, this plan's thread): one plan and one PR for all eight files, covering edits to other projects' files; the one wording-pinned row is handled by re-pointing its test to surviving tokens."
  - "Ownership: no project claimed these files on the coordinator log (asks 16:20Z, 16:55Z; inferred owners posted 17:08Z). Before the build edits them it posts the file list there; another project's unbuilt plan adding rows to one of these logs rebases and re-runs the tool (deterministic hunks)."
  - "Order (advisor, /mnt/project-files/decision-growth/amendment-log/advisor-brief/ADVICE.md point 1): land before rec-5453's ratchet goes live; no edge needed, since the ratchet only reads row counts."
  - "Measured on main 936bc4cf (tool prototype): lines freed environment-taxonomy 85, implement-scope-boundary 73, github-actions-evidence 58, ci-rca-lifecycle 24, data-modeling-standard 17, decision-entry 16, verification-registry 9, exit-criteria-ledger 0 (bytes only). The build reports the tool's dry-run line per file in the PR body."
  - "Class D: six of the eight are Class D; no amendment_log row is added, since non-log content is unchanged (check_amendment_log_for_class_d in scripts/checks/contracts/_population.py passes) and a compacted row never counts as new (amendment_log_retention.new_row_identity)."
  - "Graduated shards naming tests/test_scope_boundary_contract.py are kept unchanged (none selects the re-pointed node): code-review-weakening-dispositions, followon-half-filing-step-pinned, scope-boundary-prose-surfaces-carry-the-rule, scope-boundary-weakening-surfacing-shape."
  - "Unbuilt plans on the same files (plan_obligations): PLAN-bootstrap-ci-gated-apply, PLAN-bootstrap-trusted-pr-plan (environment-taxonomy); PLAN-existence-step-and-tool-input-link, PLAN-litellm-claude-code-scoping (data-modeling-standard); PLAN-merge-annotate-producer, PLAN-trusted-plan-cutover (github-actions-evidence); PLAN-retire-ci-only-red-records (verification-registry). Whichever builds second rebases; this build re-runs the tool after any rebase rather than resolving log hunks by hand."
  - "red_overlap (2026-11-24, draft): {\"verdict\": \"clear\", \"reds\": []}. selection_budget over the scope: breadth_waived (test half 87.8-335.7 s, elapsed 144.2-493.8 s; the eight contracts are widely read). Declared, not split: one tool command, one revertible outcome."
  - "Refused rows (extra_keys/migration_story, no_pointer, overflow, span_comment) stay full and are listed in the PR body; --check does not fail on them."
  - "The tool build's VP 4 report (newly failing nodes after a whole-tree compaction) is read before this build starts; any node it names in these eight files other than the one in scope is a plan defect for this plan's thread."
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:af0a266c12bd70bc26643011623da1c0e69bbbbb8ac95518de11c262df046e63"}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decision 275 read (clause 4)
  - The rec-5452 tool build is merged on main
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Run the tool's dry run over the eight files and save its output for the PR body: bin/venv-python -m scripts.checks.contracts.amendment_compact <eight files>."
  - "Apply it: the same command with --write. Confirm git diff names only the eight contracts."
  - Re-point tests/test_scope_boundary_contract.py's one node as its scope row says.
  - Execute the Verification Plan; loop until each step passes; on an unrecoverable failure stop and RCA (Decision 55).
  - "Report: per-file rows compacted and refused, lines and bytes freed, the re-pointed node, VP 4's empty list."
