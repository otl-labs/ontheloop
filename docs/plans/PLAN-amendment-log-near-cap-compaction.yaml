schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: amendment-log-near-cap-compaction
intent: >-
  Give the eight contracts nearest their line or byte budget headroom by compacting their old full amendment_log rows
  to terse rows with the rec-5452 tool (Decision 275 cl.4), so their owners' next changes need no raise or split
  (rec-5454). Only top-level amendment_log rows change; every pointer token survives. Six files gain lines and bytes.
  verification-registry and exit-criteria-ledger are in rec-5454 by name; their compactable rows are already one-line
  flow rows, so they gain bytes only, and neither is near its byte budget.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-amendment-log-near-cap-compaction.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5454 (Low, M), a follow-on of the contract-first retrospective (CFR-05) and the standards-cleanup census row S8.
  Closes no roadmap criterion.
closes_criteria: []
cites: [dec:275, dec:235, dec:244]
amends: []
introduces: []
scope:
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log (bin/venv-python -m scripts.checks.contracts.amendment_compact --write); no other byte changes.
  - file: docs/contracts/implement-scope-boundary.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes. Its sloc_budgets roster entry (533, dec-250) is left as is.
  - file: docs/contracts/github-actions-evidence.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes.
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes (its rows are one-line flow rows, so it frees bytes, not lines).
  - file: docs/contracts/ci-rca-lifecycle.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes.
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: Tool-made compaction of the top-level amendment_log; no other byte changes.
  - file: tests/test_scope_boundary_contract.py
    action: Modify
    purpose: >-
      Two TestContractShape nodes pin history wording of rows the tool compacts to label plus tokens; those words stay in
      git history (Decision 275 cl.4-5). (1) test_bookkeeping_row_documents_the_two_act_amendment_procedure selects
      the 2026-09-07 row by "sanction_row_eligibility" and asserts "amendment_procedure" and "conscious-choice" in its
      summary. Re-point: select by the surviving token PLAN-scope-boundary-test-coupling (exactly one row, as today)
      and keep the "Decision 75" assertion; drop the two history-wording assertions. Its live-key assertions
      (amendment_procedure "lands on" main, "single diff"/"one diff") are unchanged. (2)
      test_roadmap_liveness_baseline_row_declared_and_argued selects the 2026-09-08 row by date and asserts "leg A(a)",
      "leg A(d)", "toxic_node_ids", "conscious-choice", "header"/"unpinned", "_BASELINE_SEED" and "a path a tool
      mechanically regenerates" in its summary. Re-point: keep the date selector (exactly one row), the
      "sanction_row_eligibility" not-in-summary assertion, and assert "PLAN-roadmap-liveness-baseline-companion" and
      "Decision 75" in it; drop the history-wording assertions. Its sanction_rows live-key assertions are unchanged.
      Each docstring says what moved to git history and why. Basis: the code-review disposition is planned-change for
      both (test_obligations[0] and [1]): this plan changes the pinned behaviour, history wording that Decision 275
      cl.4-5 authorise rewriting; it is not a weakening of a check red on the change. Because each edit removes
      assertions, the operator's approval (2026-11-24, this plan's thread) is recorded as Decision 235 cl.1's human gate
      for an in-class assertion change. The only test edits this plan allows.
  - file: config/agent/verification_registry/entries/d37-governance-surfaces-landed.yaml
    action: Delete
    purpose: >-
      Retired by git mv into entries/deprecated/ (Decision 244 cl.5, Decision 176's retirement path). This live
      command_exit_zero record greps docs/contracts/decision-entry.yaml for 'migrate_then_rehome' and 'rehoming
      destination', which survive there only in the 2026-08-24 amendment_log row the tool compacts (the Decision 175
      branch moved to docs/contracts/decision-compaction.yaml). An in-place re-point is refused:
      validate_verification_registry's modified-record differential requires the check to fail at origin/main, and the
      new target already passes there; a replacement record is equally tautological. Retiring a live claim is Decision
      235 cl.1's human-gated case; operator approval (2026-11-24, this plan's thread) is recorded as that gate. No
      replacement record.
  - file: config/agent/verification_registry/entries/deprecated/d37-governance-surfaces-landed.yaml
    action: Create
    purpose: The same record, moved by a 100% rename with content byte-identical.
bundled_recommendations: [rec-5454]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "rec-5454's acceptance (refined 2026-11-24 to be decidable) holds: the re-pointed node passes (VP 3) and bin/venv-python -m scripts.checks.contracts.amendment_compact --check over the eight files exits 0; --check exits 1 on the base."
  - "For each of the eight files, safe_load minus amendment_log equals the base's, the row count equals the base's, and every changed row is terse and keeps every pointer token of its base row (VP 2)."
  - "No test that reads an amendment_log newly fails, except the two nodes re-pointed here, which pass after the change (VP 3, VP 4)."
  - "Every live graduated record (not on known_red.yaml) whose check_spec names one of the eight contracts passes on the compacted tree, d37-governance-surfaces-landed is out of the live loader and byte-identical under entries/deprecated/, and validate_verification_registry passes (VP 5)."
  - "The diff touches only the eleven scope paths (the d37 retirement is one rename), plus this plan's own bookkeeping fields (implementation_declared, weakening_dispositions) under implement-scope-boundary.yaml sanction_rows.implementing_plan_bookkeeping."
  - "rec-5454 is closed by the build's squash-merge Resolves trailer once its acceptance holds (Decision 201)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5454's acceptance, the tool's own gate over the eight files.
    command: >-
      bin/venv-python -m scripts.checks.contracts.amendment_compact --check docs/contracts/environment-taxonomy.yaml
      docs/contracts/implement-scope-boundary.yaml docs/contracts/data-modeling-standard.yaml
      docs/contracts/github-actions-evidence.yaml docs/contracts/exit-criteria-ledger.yaml
      docs/contracts/ci-rca-lifecycle.yaml docs/contracts/verification-registry.yaml docs/contracts/decision-entry.yaml
    expected: exit 0; before the change it exits 1 listing compactable rows past keep_full
    fix_if: exit 1 (a compactable row remains; re-run --write) or a file reported unreadable or proof_failed
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Every later row added to these logs moves the count; holding it on main is rec-5453's ratchet, not a graduated check.
  - step: 2
    phase: pre-deploy
    action: >-
      Independent proof against the base, per file, without the tool's code: non-log content, row counts, row keys
      and the terse shape, and a superset of the PLAN-, rec-, single Decision N, tier and CD tokens (list forms and
      dec-N are left to the tool's own proof (b)).
    command: >-
      bin/venv-python -c "import subprocess, yaml, re;
      fs=['environment-taxonomy','implement-scope-boundary','data-modeling-standard','github-actions-evidence','exit-criteria-ledger','ci-rca-lifecycle','verification-registry','decision-entry'];
      tok=lambda s: set(re.findall(r'PLAN-[a-z0-9-]*[a-z0-9]|rec-\d+|Decision \d+|T-?\d+\.\d+[a-z]?|CD\.\d+', s));
      bad=[];
      [bad.append(f) for f in fs
       for b,h in [(yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/'+f+'.yaml'],capture_output=True,text=True,check=True).stdout), yaml.safe_load(open('docs/contracts/'+f+'.yaml')))]
       if {k:v for k,v in b.items() if k!='amendment_log'}!={k:v for k,v in h.items() if k!='amendment_log'}
       or len(b['amendment_log'])!=len(h['amendment_log'])
       or any(o!=n and (set(n)!={'date','semantic_break','change_class','summary'} or len(n['summary'])>160 or (o['date'],o['semantic_break'],o['change_class'])!=(n['date'],n['semantic_break'],n['change_class']) or not tok(o['summary'])<=tok(n['summary'])) for o,n in zip(b['amendment_log'],h['amendment_log']))];
      print('BAD', bad) if bad else print('eight files proven')"
    expected: prints eight files proven
    fix_if: a file is listed; non-log content, the row count, a row's date, semantic_break or change_class, or a pointer token changed, or a changed row is not terse (key set or 160-character summary)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Compares against origin/main, which moves after merge; the tool's own proofs and step 1 carry the behaviour.
  - step: 3
    phase: pre-deploy
    action: The two re-pointed test nodes pass on the compacted contract.
    command: >-
      bin/venv-python -m pytest
      "tests/test_scope_boundary_contract.py::TestContractShape::test_bookkeeping_row_documents_the_two_act_amendment_procedure"
      "tests/test_scope_boundary_contract.py::TestContractShape::test_roadmap_liveness_baseline_row_declared_and_argued" -q
    expected: exit 0 with 2 passed; with the compaction applied and the tests unchanged both fail
    fix_if: a node fails; a selector no longer finds exactly one row, or a kept token was lost from the row
    hermetic: true
    expected_literals: ["2 passed"]
    graduation: waive
    graduation_waiver_reason: Both nodes already run in the suite on every affected change; a registry shard would duplicate them.
  - step: 4
    phase: pre-deploy
    action: No other test that reads an amendment_log newly fails (base worktree versus the working tree). Run it backgrounded (two runs over about 66 files can pass the 10-minute foreground cap); both runs share one cache dir so --randomly-seed=last gives both the same seed.
    command: >-
      r=$(pwd) && t=$(mktemp -d) && w="$t/base" && git worktree add --detach "$w" origin/main >/dev/null &&
      f=$(git grep -l amendment_log -- 'tests/*.py') && [ -n "$f" ] &&
      (cd "$w" && export OTL_VENV_PYTHON="$r/.venv/bin/python" && bin/venv-python -m pytest $f -q -n 4 -o cache_dir="$t/c" --continue-on-collection-errors -rfE > "$t/before.out"; echo $? > "$t/before.rc");
      bin/venv-python -m pytest $f -q -n 4 -o cache_dir="$t/c" --continue-on-collection-errors -rfE > "$t/after.out"; echo $? > "$t/after.rc";
      git worktree remove --force "$w";
      { [ -s "$t/before.rc" ] && [ -s "$t/after.rc" ]; } || { echo "SURVEY BROKEN"; exit 1; };
      echo "rc before=$(cat "$t/before.rc") after=$(cat "$t/after.rc")";
      if [ "$(cat "$t/before.rc")" -gt 1 ] || [ "$(cat "$t/after.rc")" -gt 1 ]; then echo "SURVEY BROKEN"; exit 1; fi;
      grep -E '^(FAILED|ERROR)' "$t/before.out" | cut -d' ' -f2 | sort -u > "$t/before.txt";
      grep -E '^(FAILED|ERROR)' "$t/after.out" | cut -d' ' -f2 | sort -u > "$t/after.txt";
      echo "newly failing:"; comm -13 "$t/before.txt" "$t/after.txt"
    expected: both pytest exit codes are 0 or 1, then prints newly failing followed by nothing
    fix_if: >-
      SURVEY BROKEN (a pytest run errored before collecting: fix the invocation, never accept the step), or a node is
      listed. It pins a row the tool compacted. Do not edit the test or the row: stop and send a plan-defect
      report to the coordinator (routing.plan_defect), naming the node and the row; the operator rules on each extra
      loosening (Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A one-off survey of the amendment_log-reading test files against the base, not a regression guard.
  - step: 5
    phase: pre-deploy
    action: >-
      Graduated records: every live record naming one of the eight contracts passes on the compacted tree; the d37
      record is retired by a pure rename and no live surface names it; the registry gate admits the diff. Closure
      obligation for the Delete row.
    command: >-
      bin/venv-python -c "import json, yaml, subprocess;
      from scripts.verification_graduation import load_entries, materialize_check;
      E='config/agent/verification_registry/entries/'; cid='d37-governance-surfaces-landed';
      red={r['check_id'] for r in yaml.safe_load(open(E[:-8]+'known_red.yaml'))['entries']};
      fs=['environment-taxonomy','implement-scope-boundary','data-modeling-standard','github-actions-evidence','exit-criteria-ledger','ci-rca-lifecycle','verification-registry','decision-entry'];
      live=load_entries(); assert cid not in {e['check_id'] for e in live};
      assert subprocess.run(['git','show','origin/main:'+E+cid+'.yaml'],capture_output=True,text=True,check=True).stdout==open(E+'deprecated/'+cid+'.yaml').read();
      hits=subprocess.run(['git','grep','-lE',cid+'([^-a-z0-9]|$)','--',':!docs/plans/',':!'+E+'deprecated/'],capture_output=True,text=True).stdout.split(); assert not hits, hits;
      rows=[e for e in live if e['check_id'] not in red and 'node_id' not in (e.get('check_spec') or {}) and any(f+'.yaml' in json.dumps(e.get('check_spec')) for f in fs)];
      bad=[e['check_id'] for e in rows if materialize_check(e).run().status.value!='PASS'];
      print('RECORDS_RUN', len(rows), 'FAILED', bad); assert rows and not bad; print('REGISTRY_PROBES_OK')" &&
      bin/venv-python -m scripts.checks.verification.validate_verification_registry
    expected: >-
      prints RECORDS_RUN with an empty FAILED list (28 records: 29 on main 85ad623b less the retired one), then
      REGISTRY_PROBES_OK, and validate_verification_registry exits 0 with no not-admitted line
    fix_if: >-
      the retired record is still live, its bytes changed (redo as a pure git mv) or a live surface names it; or a
      record is listed: it pins wording of a row the tool compacted, so do not edit the record or the row: stop and
      send a plan-defect report to the coordinator naming the record and the row (the operator rules, Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A one-off sweep over the compacted tree plus a retirement check; validate_graduated_rerun and validate_verification_registry are the standing guards.
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: >-
      any failure; fix and rerun the full tier from the start, except a red test node or graduated record that pins
      compacted wording, which goes to the plan-defect report as in VP 4 and VP 5
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 7
    phase: post-deploy
    action: rec-5454 reads back closed after the build's squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5454']); print(rows[0]['status'])"
    expected: prints closed
    fix_if: prints open; the Resolves trailer or the closure job did not run, or the acceptance failed
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: tests/test_scope_boundary_contract.py
    behavior: the two-act amendment procedure row is still found by its plan token and still names Decision 75
    verification_step: 3
    test_selector: tests/test_scope_boundary_contract.py::TestContractShape::test_bookkeeping_row_documents_the_two_act_amendment_procedure
    red_green_expectation: red after compaction with the old selector, green after the re-point
  - source: tests/test_scope_boundary_contract.py
    behavior: the roadmap-liveness baseline row is still found by its date and still names its plan and Decision 75, never sanction_row_eligibility
    verification_step: 3
    test_selector: tests/test_scope_boundary_contract.py::TestContractShape::test_roadmap_liveness_baseline_row_declared_and_argued
    red_green_expectation: red after compaction with the old assertions, green after the re-point
  - source: config/agent/verification_registry/entries/d37-governance-surfaces-landed.yaml
    behavior: the retired record leaves the live loader by a pure rename and nothing live names it
    verification_step: 5
    command: bin/venv-python -m scripts.checks.verification.validate_verification_registry
    waiver_reason: A retirement removes a guard rather than adding behaviour; VP 5 proves the move and the registry gate admits it.
constraints:
  - Contract bytes change only by the tool's --write; no hand edit of any contract line, and no row outside a top-level amendment_log.
  - No test or graduated-record edit beyond the two nodes and the one retirement in scope; a newly failing node is a plan defect, never a test change (Decision 235).
  - No Decision text and no governing contract text changes; Decision 275 cl.4 authorises terse compaction.
  - The build starts only after the rec-5452 tool build has merged; it runs the tool from main, never a copy.
  - No rescue agents or workaround loops (Decision 55).
