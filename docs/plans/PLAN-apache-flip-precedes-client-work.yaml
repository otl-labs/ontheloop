schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "apache-flip-precedes-client-work"
intent: >-
  Record, as a direction Decision amending Decisions 184 and 194, that the early Apache-2.0 flip precedes the first services
  client of On The Loop Labs: its trigger moves from a finished local core and a serving paid service to the
  founder-to-company IP assignment and a clean dependency-licence audit, the flip is ordered before any engagement,
  and what it spends is named; NS.2 and its README line are rewritten to match. This reverses 194's reasoning
  honestly and lets client work become the demand signal for adapters and brownfield otl init.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-apache-flip-precedes-client-work.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5680 (High), filed this session from the operator's 2026-11-26 direction. Closes no roadmap criterion; T4.22,
  T4.23 and T4.24 stay deferred_post_mvp and are not edited (rec-5683 owns the release edge).
amends: [dec:184, dec:194]
cites: [dec:171, dec:177, dec:181, dec:184, dec:194, dec:195, dec:196, dec:209, dec:233, dec:240, dec:243, dec:246, dec:279, dec:286]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly three blocks of docs/plans/approved/apache-flip-precedes-client-work.yaml: decisions-new (the new
      direction Decision, inserted after the corpus intro paragraph, {{N}} = max decision number across DECISIONS.md
      and DECISIONS_ARCHIVE.md + 1 after rebasing, {{DATE}} = build date UTC), decision-194-note and
      decision-184-note (one dated Amended-by note after each entry's last line). Decision 194's body and stanza are otherwise untouched: the
      graduated check dec-194-stanza-monitored-predicate-wired pins the stanza. docs/decisions-index.json is
      regenerated by `bin/venv-python -m scripts.decisions_index --write` (generator-touched, no row).
  - file: docs/contracts/north-star.yaml
    action: Modify
    purpose: >-
      Sidecar blocks north-star-ns2 (NS.2 principle, detail, failure_signal and carried_by gain the new Decision,
      with the tier-a-amendment-approved marker on NS.2's lines) and north-star-log (one amendment_log row,
      semantic_break true, governance_note_add).
  - file: README.md
    action: Modify
    purpose: Sidecar block readme-ns2, the NS.2 bullet of the generated North Star block, so validate_north_star's README projection equals the contract.
  - file: tests/checks/contracts/test_validate_tier_a_amendment_guard.py
    action: Modify
    purpose: >-
      Sidecar blocks tier-a-test-anchor, tier-a-test-nonvacuous and tier-a-test-reflow. The fixture copies the live
      north-star.yaml; two nodes anchored on NS.2's old words (the reflow node's _sub raises in setup, and
      head-shape mutation 2's replace becomes a silent no-op). They now anchor on NS.2's id and kind lines and derive
      the reflow from the entry's own detail, and every head-shape mutation must change the text. The guard is not
      edited and no node's expectation moves.
bundled_recommendations: [rec-5680]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The committed DECISIONS.md, north-star.yaml, README.md and Tier A guard test text equals the approved sidecar with placeholders filled (approved_text verify exits 0 with the VP 1 digest).
  - "The new Decision is monitored: its stanza parses with conditions client-before-flip, preconditions-stalled, audit-blocks-flip and hosted-competitor, every stanza is well-formed, and Decision 194 stays monitored with its graduated check green."
  - The new Decision measures at or under decision-entry.yaml size_governance.measured_size_norm.cap_bytes and declares kind direction, amends [184, 194] and serves [NS.2].
  - "validate_north_star, validate_tier_a_amendment_guard, validate_glossary, validate_supersession_annotations and validate_licence_consistency pass; no licence artefact (LICENSE, LICENSE-APACHE, LICENSING.md, COMMERCIAL-LICENSE.md, CONTRIBUTING.md) or package metadata changes."
  - "The Tier A guard test module passes on the rewritten NS.2 with no node removed, skipped or loosened: mutation 2 anchors on NS.2's id and kind lines, the reflow node derives its reflow from NS.2's detail, and a head-shape mutation that no longer changes the text fails."
  - rec-5680's acceptance command exits 0, and after merge rec-5680 is closed by the Resolves trailer while rec-5681 to rec-5686 stay open.
  - docs/decisions-index.json is fresh, validate --pre passes and the full tier passes before hand-off.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed governed text is exactly the approved text.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug apache-flip-precedes-client-work --expect
      ba6a45c27d2580068c13369a048f149c278e56f87f547dcf4eee495490e9418f
    expected: Exit 0.
    fix_if: >-
      A difference is reported -- restore the approved words. The digest is the last wording-check row's; a sidecar
      change after it needs a new wording-check row and this digest updated before the plan merges.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier.
  - step: 2
    phase: pre-deploy
    action: Prove the new stanza is monitored, 194 still is, and nothing is malformed.
    command: >-
      bin/venv-python -c "import re; from scripts.preflight.decision_conditions import evaluate;
      t=open('docs/DECISIONS.md',encoding='utf-8').read();
      n=int(re.search(r'^## Decision (\d+): The early Apache-2.0 flip precedes the first services client',t,re.M).group(1));
      r={x.decision_id: x for x in evaluate(gate=True)};
      assert all(x.state != 'MALFORMED' for x in r.values()), [x.decision_id for x in r.values() if x.state == 'MALFORMED'];
      ids=[c.id for c in r[n].conditions];
      assert ids == ['client-before-flip','preconditions-stalled','audit-blocks-flip','hosted-competitor'], ids;
      assert 194 in r and r[194].state != 'MALFORMED'; print('FLIP_STANZA_OK', n)"
    expected: Prints the marker and the new number; exit 0.
    expected_literals: [FLIP_STANZA_OK]
    fix_if: No match for the heading or a different condition list -- the decisions-new block was applied wrongly; re-apply it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_reversal_stanzas already gates well-formedness in both tiers, and the condition list is a moment claim a later re-arm may change.
  - step: 3
    phase: pre-deploy
    action: Prove Decision 194's graduated stanza check still passes (its stanza is untouched).
    command: >-
      bin/venv-python -c "import scripts.preflight.decision_conditions as dc; r=[x for x in dc.evaluate() if
      x.decision_id==194]; s=r[0]; c={x.id:x for x in s.conditions}; assert c['free-core-complete'].predicate=='roadmap_items_complete';
      assert c['commercial-plane-operational'].kind=='manual'; print('DEC194_STANZA_INTACT')"
    expected: Prints the marker; exit 0.
    expected_literals: [DEC194_STANZA_INTACT]
    fix_if: A missing condition means 194's stanza was edited -- revert it; this plan never edits it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates the graduated check dec-194-stanza-monitored-predicate-wired.
  - step: 4
    phase: pre-deploy
    action: Prove the envelope, the size cap and the north-star projections.
    command: >-
      bin/venv-python -c "import re, yaml; from scripts.decisions_md import iter_decision_sections; from
      scripts.checks.decisions import entry_measure as m; cap=yaml.safe_load(open('docs/contracts/decision-entry.yaml'))['size_governance']['measured_size_norm']['cap_bytes'];
      t=open('docs/DECISIONS.md',encoding='utf-8').read(); b={int(re.search(r'Decision (\d+)', h.group(0)).group(1)): s for h, s in iter_decision_sections(t)};
      n=next(k for k, s in b.items() if 'precedes the first services client' in s.splitlines()[0]); s=b[n];
      size=m.measured_bytes(s, (m.METADATA_ENVELOPE, m.REVERSAL_CONDITIONS, m.OPTIONS_CONSIDERED));
      assert size <= cap, (size, cap); assert 'value: direction' in s and 'amends: [184, 194]' in s and 'serves: [NS.2]' in s;
      ns=yaml.safe_load(open('docs/contracts/north-star.yaml')); p={e['id']: e for e in ns['principles']}['NS.2'];
      assert p['principle'] == 'Open source before the first client depends on it.' and n in p['carried_by'], p;
      assert '- **NS.2** - Open source before the first client depends on it.' in open('README.md').read();
      print('FLIP_ENTRY_OK', n, size, cap)"
    expected: Prints the marker, the number, the measured size and the cap; exit 0.
    expected_literals: [FLIP_ENTRY_OK]
    fix_if: Over the cap -- stop and report; never trim approved words in the build. A projection mismatch means a sidecar block was skipped.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_decisions_size, validate_decision_entry_conformance and validate_north_star enforce these in the fast tier; this step records the figures.
  - step: 5
    phase: pre-deploy
    action: Seam guard -- no licence, contribution or package artefact changes, and rec-5680's acceptance holds.
    command: >-
      git fetch origin main --quiet && ! git diff --name-only origin/main...HEAD | grep -qE
      '^(LICENSE|LICENSE-APACHE|LICENSING\.md|COMMERCIAL-LICENSE\.md|CONTRIBUTING\.md|packages/.*)$' &&
      grep -qE '^## Decision [0-9]+: .*precedes the first services client.*amends Decisions 184 and 194' docs/DECISIONS.md &&
      ! grep -q 'Source-available now, open source on proof' docs/contracts/north-star.yaml && echo SEAM_AND_REC_OK
    expected: Prints the marker; exit 0.
    expected_literals: [SEAM_AND_REC_OK]
    fix_if: A licence artefact in the diff belongs to rec-5681 or rec-5682 -- revert it here. Measures origin/main...HEAD, so run it on the committed branch.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Green-before by construction for the seam half, and the rec half runs again at closure through the Resolves trailer.
  - step: 6
    phase: pre-deploy
    action: Prove the generated index matches the edited corpus.
    command: bin/venv-python -m scripts.decisions_index --check
    expected: Exit 0 (index fresh).
    fix_if: Stale -- run `bin/venv-python -m scripts.decisions_index --write` and commit the index.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_decisions_index_freshness, which runs in both tiers.
  - step: 7
    phase: pre-deploy
    action: Run the Tier A guard, north-star check and north-star model tests against the edited tree.
    command: >-
      bin/venv-python -m pytest -q tests/checks/contracts/test_validate_tier_a_amendment_guard.py
      tests/checks/contracts/test_validate_north_star.py tests/test_north_star_models.py
    expected: All pass, none skipped.
    fix_if: >-
      test_real_tree_is_clean red -- a north-star block lost its marker, carried_by entry or log row; re-apply it. A
      fixture node red -- a tier-a-test block was skipped. Never edit a node's expectation.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The fast tier's affected-set selection runs these modules on every PR touching their sources.
  - step: 8
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: vp-red-before.yaml refuses to graduate a scripts.validate step (recursion refusal), and PR CI runs this tier on every PR.
  - step: 9
    phase: pre-deploy
    action: Run the full tier before hand-off (backgrounded from the top-level session, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: >-
      A failure caused by this diff is fixed in scope. A failure that reproduces on origin/main stops the build BLOCKED
      (handoff_policy timeout_disposition blocked; red-main-recovery.yaml slo_clock); never push without a passing
      --verify-head.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: Prove the merge closed rec-5680, left the six sibling recs open and synced the new Decision.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "from src.common.ducklake_reader_client import
      fetch_recs_by_ids, make_reader; ids=['rec-5680','rec-5681','rec-5682','rec-5683','rec-5684','rec-5685','rec-5686'];
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ids); st={r['id']: r['status'] for r in rows};
      assert st.get('rec-5680') == 'closed' and all(st.get(i) == 'open' for i in ids[1:]), st; print('RECS_OK')"
    expected: The sync completes and RECS_OK prints.
    fix_if: rec-5680 open -- the Resolves trailer was missing; close it through update_rec with the merge sha. A sibling closed -- reopen it through update_rec.
    hermetic: false
test_obligations:
  - source: docs/contracts/north-star.yaml
    behavior: >-
      NS.2's rewrite lands authorized: the dec-N marker, the carried_by entry and the north-star-log row let the Tier A
      guard pass the real tree against origin/main.
    verification_step: 7
    test_selector: tests/checks/contracts/test_validate_tier_a_amendment_guard.py::test_real_tree_is_clean
    red_green_expectation: >-
      Red when north-star-ns2 lands without its marker, its carried_by entry or the north-star-log row (each proved red
      in a scratch tree of origin/main 32468722, 2026-11-26); green with all three.
  - source: tests/checks/contracts/test_validate_tier_a_amendment_guard.py
    behavior: >-
      The head-shape and reflow nodes anchor on NS.2's structure, not its prose, and a head-shape mutation that no
      longer matches the contract fails instead of passing vacuously.
    verification_step: 7
    test_selector: tests/checks/contracts/test_validate_tier_a_amendment_guard.py
    red_green_expectation: >-
      Red with the NS.2 rewrite and the old anchors (test_header_comment_amendment_log_and_reflow_are_free and
      test_head_shape_defects_fail_closed[<lambda>2] fail, 2 failed 60 passed); green after (62 passed on both the old
      and the new NS.2).
