pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    scripts/roadmap/review_page.py -- add the `tldr` keyword to render(); when truthy, insert `**TLDR:** <_escape(" ".join(tldr.split()))>`,
    a blank line, the context-only line and a blank line directly after the H1's blank line.
  - >-
    scripts/roadmap/approved_words.py -- add `tldr: str | None = None` to Sidecar; in _validate_render_inputs refuse a
    missing/blank tldr ("sidecar carries no tldr"), one over 600 characters, or one _unsafe_code_point flags; pass
    tldr=sidecar.tldr to review_page.render. Update the module docstring's sidecar line. digest()/approved_digest() untouched.
  - >-
    tests/test_review_page.py and tests/test_approved_words.py -- add TestTldr classes per the scope rows; give the
    test_approved_words `_page` helper a default tldr via sidecar.model_copy(update={"tldr": ...}) when absent, and
    append a `tldr:` line to OWN_TEXT in the three TestCli cases the scope row names (the refusal case asserts "differs").
  - >-
    Precondition: the plan and its sidecar are on origin/main and the branch contains origin/main; else stop.
    .claude/skills/planning/SKILL.md -- apply the sidecar's three blocks verbatim (VP step 7);
    config/prose_budgets.yaml -- set the planning skill entry to `wc -c < .claude/skills/planning/SKILL.md`.
  - >-
    tests/test_workflow_skill_antidrift.py -- add test_planning_skill_orders_the_wording_approval_after_critique.
  - Run VP steps 1-4 and 7 until green; on unrecoverable failure stop and RCA (Decision 55).
  - Code review via a fresh code-review subagent; fix blocking findings and rerun VP steps 1-4 and 7.
  - >-
    Commit (flip implementation_declared to true; carry "Resolves: rec-5044" as its own paragraph), rebase on origin/main,
    run VP step 5 on the committed clean HEAD, push, open the build PR; merge needs the operator's final-diff word
    (CODEOWNERS paths).
  - 'Report: what was implemented, verification results'
