schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: approval-run-tldr-and-order
intent: >-
  Make the operator's approved-text approval cheaper to give well: the approval run page opens with a TLDR of what the
  change is and why, and the operator approves the run only after plan-critique returns PROCEED, so a critique edit
  never spends an approval (rec-5044).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-approval-run-tldr-and-order.yaml
phase: >-
  ad_hoc_rec (soft-warn category; rec-5044, Medium, XS, plus the operator's TLDR request of 2026-11-09; no tier_item
  claimed, so the Tier Item Freshness Gate is skipped). Follows Decision 246 (rec-4769, #1876). No tier_item criterion
  is closed.
scope:
  - file: scripts/roadmap/approved_words.py
    action: Modify
    purpose: >-
      Sidecar gains `tldr: str | None = None` (schema_version stays 1, so every sidecar on main still parses). digest()
      and approved_digest() are unchanged: the TLDR is outside both digests. render_page refuses (RenderRefused) a
      sidecar whose tldr is missing or blank, longer than 600 characters, or carrying a control, bidi or zero-width
      code point (the existing _unsafe_code_point), and passes the tldr to review_page.render. No new import.
    new_imports: []
  - file: scripts/roadmap/review_page.py
    action: Modify
    purpose: >-
      render() gains a keyword `tldr: str | None = None`. When given, the page's first lines after the H1 are
      `**TLDR:** <tldr>` (whitespace collapsed to single spaces, Markdown-escaped with _escape) and the line
      `_Context only: the TLDR is not part of the approved words._`, before the fingerprint. Without it the page is
      byte-identical to today (the gated-apply reuse, rec-4905, is unaffected).
    new_imports: []
  - file: tests/test_review_page.py
    action: Modify
    purpose: >-
      New class TestTldr: the TLDR line follows the H1 directly and precedes the fingerprint; it is escaped and
      whitespace-collapsed; the context-only line is present; without tldr the page equals today's output.
  - file: tests/test_approved_words.py
    action: Modify
    purpose: >-
      The `_page` helper supplies a tldr (model_copy) so the existing render tests keep their meaning. New class
      TestTldr: a sidecar without tldr parses; render_page refuses a missing, blank, over-600-character or
      control/bidi/zero-width tldr; the rendered page carries it under the H1; digest() and approved_digest() are
      equal with and without a tldr; the render CLI exits 2 with `APPROVED-WORDS REFUSED` on a sidecar without one.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Step 8b, two exact replacements (measured at planning: SKILL.md 43028 -> 43022 bytes with the relief below).
      (a) "write it as the approved-text sidecar, place it in an uncommitted" becomes "write it as the approved-text
      sidecar (its `tldr` is the presentation's Summary), place it in an uncommitted". (b) "Then push it and get
      approval per Decision 246: dispatch the approval run and paste the wording with its link." becomes "Push it,
      dispatch the approval run (Decision 246) and paste the TLDR, the wording and the run link; the operator approves
      the run only after plan-critique returns PROCEED, and "write the plan" never waits on it. If critique changes
      approved words, cancel that run and dispatch one on the final sidecar." (the inner quotes are literal double
      quotes). Prose relief (zero headroom): delete the Decision Scout Gate's line starting "**Why a subagent and not
      inline grep, and the Lambda migration contract:**" and the blank line after it; the decision-scout skill carries
      that rationale itself (its sections "Why a subagent, and why bounded" and "Lambda / portal migration contract").
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Ratchet .claude/skills/planning/SKILL.md's budget down to its measured byte size after the edit (no raise; the
      prose_budgets_ratchet_down sanction).
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      New test test_planning_skill_orders_the_wording_approval_after_critique: the skill carries "after plan-critique
      returns PROCEED", "(its `tldr` is the presentation's Summary)" and "cancel that run and dispatch one on the final
      sidecar", and no longer carries "Then push it and get approval per Decision 246". Existing tests unchanged. Shards
      naming this file are kept: deleted-writer-caller-disposition, followon-half-filing-step-pinned,
      no-live-pointer-to-retired-git-ops-section.
bundled_recommendations:
  - rec-5044
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A sidecar without `tldr` still parses, and its digest and approved-words digest equal those of the same sidecar
    with a tldr.
  - >-
    render_page refuses a sidecar whose tldr is missing, blank, over 600 characters or carries a control, bidi or
    zero-width code point; the render CLI exits 2 with `APPROVED-WORDS REFUSED` for it.
  - >-
    A rendered page's first line after the H1 is `**TLDR:** ` followed by the escaped, whitespace-collapsed tldr, then
    the context-only line, then the fingerprint; review_page.render without tldr returns today's page.
  - >-
    The planning skill tells the agent to paste the TLDR, wording and run link at presentation, have the operator approve
    the run only after plan-critique returns PROCEED, and cancel and re-dispatch when critique changes approved words
    (rec-5044's acceptance holds).
  - >-
    validate_prose_limits passes with the planning skill's budget lowered to its new size.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The TLDR on the page and the render refusals, through the real render code.
    command: bin/venv-python -m pytest tests/test_review_page.py tests/test_approved_words.py -q
    expected: Exit 0, all pass. Before the change TestTldr fails (render has no tldr keyword; Sidecar forbids the key).
    expected_literals:
      - passed
    fix_if: A pre-existing render test fails -- the _page helper lost its tldr; a digest test fails -- tldr leaked into a
      digest payload; fix the code, never the assertion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The registry row approved-text-review-page already runs both files whole.
  - step: 2
    phase: pre-deploy
    action: The render CLI the workflow runs, end to end on a temp sidecar against this checkout.
    command: >-
      D=$(mktemp -d) && printf 'schema_version: 1\nslug: demo\ntldr: Lets the operator see why.\nblocks:\n- id: b\n  file: AGENTS.md\n  before: "# AGENTS.md - On The Loop"\n  after: "# AGENTS.md - On The Loop!"\n' > "$D/s.yaml"
      && A=$(bin/venv-python -c "import sys; from scripts.roadmap import approved_words as a; print(a.approved_digest(a.parse_sidecar(open(sys.argv[1]).read())))" "$D/s.yaml")
      && F=$(bin/venv-python -c "import sys; from scripts.roadmap import review_page as r; print(r.fingerprint(sys.argv[1]))" "$A")
      && bin/venv-python -m scripts.roadmap.approved_words render --sidecar-file "$D/s.yaml" --slug demo --base-file-dir . --expect-approved "$A" --fingerprint "$F" | sed -n 3p
      && sed -i '/^tldr:/d' "$D/s.yaml" && { bin/venv-python -m scripts.roadmap.approved_words render --sidecar-file "$D/s.yaml" --slug demo --base-file-dir . --expect-approved "$A" --fingerprint "$F"; echo "exit=$?"; }
    expected: Line 3 of the page is the TLDR line; the second render prints a refusal on stderr and exit=2.
    expected_literals:
      - "**TLDR:** Lets the operator see why."
      - exit=2
    fix_if: Line 3 is the fingerprint -- the TLDR is placed after it; exit=0 -- render_page does not refuse a missing tldr.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Step 1's TestTldr covers the same paths and is already a registry-run file.
  - step: 3
    phase: pre-deploy
    action: rec-5044's own acceptance and the skill antidrift pin.
    command: >-
      grep -q "after plan-critique returns PROCEED" .claude/skills/planning/SKILL.md && ! grep -q "Then push it and get
      approval per Decision 246: dispatch the approval run and paste the wording with its link." .claude/skills/planning/SKILL.md
      && bin/venv-python -m pytest tests/test_workflow_skill_antidrift.py -q && echo REC5044_OK
    expected: Pytest passes, then REC5044_OK.
    expected_literals: []
    fix_if: The grep fails -- the phrase wrapped or was reworded; keep it verbatim on one line.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: tests/test_workflow_skill_antidrift.py is a standing --pre-selected test file.
  - step: 4
    phase: pre-deploy
    action: The planning skill stays inside its prose budget and the budget equals its size.
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f); assert not f, f; print('PROSE_OK')"
    expected: PROSE_OK.
    expected_literals: []
    fix_if: current>budget -- trim the new Step 8b wording, never raise the budget; current<budget -- lower the entry.
    hermetic: true
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full validation before handoff, attested for the pushed HEAD (backgrounded, 2 h limit, top-level session).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Exit 0; --verify-head attests HEAD.
    expected_literals: []
    fix_if: A failure in scope -- fix on the branch and rerun from the start; a failure outside scope becomes a rec via
      scripts.ops_data_portal (Decisions 55, 59).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
  - step: 6
    phase: post-deploy
    action: rec-5044 closed by the merge's Resolves trailer.
    command: AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, missing = fetch_recs_by_ids(make_reader(), ['rec-5044']); print([(r['id'], r['status']) for r in
      rows], missing)"
    expected: rec-5044 shows a closed status and none are missing.
    fix_if: Still open -- run `bin/venv-python -m scripts.session.merge_step recover --slug approval-run-tldr-and-order
      --sha <merge sha>`; never close by hand without the operator.
    hermetic: false
test_obligations:
  - source: scripts/roadmap/approved_words.py
    behavior: A sidecar's tldr is outside both digests and render refuses a missing or unsafe one.
    verification_step: 1
    test_selector: tests/test_approved_words.py::TestTldr
    red_green_expectation: red before (Sidecar forbids the tldr key), green after.
  - source: scripts/roadmap/review_page.py
    behavior: The TLDR opens the page under the H1, escaped, labelled context only.
    verification_step: 1
    test_selector: tests/test_review_page.py::TestTldr
    red_green_expectation: red before (render has no tldr keyword), green after.
  - source: .claude/skills/planning/SKILL.md
    behavior: Approval of the run comes after plan-critique PROCEED; the paste opens with the TLDR.
    verification_step: 3
    test_selector: tests/test_workflow_skill_antidrift.py::test_planning_skill_orders_the_wording_approval_after_critique
    red_green_expectation: red before (old sentence present), green after.
  - source: config/prose_budgets.yaml
    behavior: The planning skill's budget equals its size.
    verification_step: 4
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f); assert not f, f; print('PROSE_OK')"
    waiver_reason: A ratchet value; validate_prose_limits is the standing guard on every tier.
constraints:
  - The TLDR never enters digest() or approved_digest(); Decision 246 cl.2's approved words are unchanged.
  - No change to .github/workflows/approved-text-approval.yml, Decision 246, git-ops.yaml or coordinator.yaml.
  - No new import in approved_words.py or review_page.py (CODEOWNERS closure, rec-4769).
  - No prose budget raise; relief is the named pointer-line deletion plus wording economy.
  - >-
    approved_words.py, review_page.py and tests/test_approved_words.py are CODEOWNERS; the build merges on code review
    PROCEED, green CI and the operator's final-diff word.
  - No rescue agents or workaround loops (Decision 55); out-of-scope defects become recs via scripts/ops_data_portal.
