schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: approved-text-landed-words
intent: >-
  rec-5057: let a plan whose approved-text sidecar words landed in an earlier merge be declared implemented. A new
  approved_text.verify_landed accepts a bound file the declaring PR leaves unchanged when one first-parent commit C
  after the sidecar was added applied that file's blocks exactly (found by content, no trailer needed), with guards;
  validate_merge_step and premerge use it, late closure stops excluding sidecar plans, and the strict verify used at
  build, rebase and wording-check time is unchanged. Removes the merge-step blocker for rec-5382's six late closures and
  PLAN-sit-restore-spike. Side effect, as the approved LATE CLOSURE words state: the registry differential now uses
  X^ for a sidecar plan's late-closure shards; the gap when X differs from the words commit (sit-restore-spike) and
  the weakening leg stay with rec-2837 and rec-5441.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-approved-text-landed-words.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-5057
  (High); rec-5382 depends on it. Closes no roadmap criterion.
cites: [dec:181, dec:235, dec:246, dec:275, dec:279]
scope:
  - file: scripts/roadmap/approved_text.py
    action: Modify
    purpose: >-
      Add verify_landed(sidecar, slug, root, base_ref) -> (messages, landed) beside verify, which stays byte-for-byte
      strict. verify_landed runs verify's per-file comparison (factor the loop body into a private per-file helper
      both share); a file that fails it and whose working-tree text equals its base text is a landed candidate. For
      the candidates it walks `git log --first-parent <adding commit>..<base_ref> -- <candidate files>` (adding
      commit = the oldest first-parent commit that added the sidecar, as find_implementation_merge finds the plan's)
      and keeps each commit C where, for EVERY candidate file, words(C:f) equals apply(words(C^:f), f's blocks), C's
      changed files intersect the plan's scope read at base_ref minus the sidecar's bound files, the plan file and the
      sidecar (as find_implementation_merge uses scope - {plan_rel}), the plan is not implementation_declared at C, and
      approved_digest of the sidecar at C equals the base sidecar's. Exactly one such C passes every candidate and
      returns landed = {file: C full sha}; zero keeps the strict messages, adding "no landing commit"; two or more
      fail with "competing landing commits <shas>". Reads git through its own _git_show and a new subprocess helper;
      must not import scripts.checks (no cycle with _implementation_merge, which imports this module).
  - file: scripts/checks/verification/validate_merge_step.py
    action: Modify
    purpose: >-
      _check_sidecar calls approved_text.verify_landed instead of verify and adds "LANDED <file> at <sha>" to
      notes.info for each landed file; the provenance leg still runs on the base sidecar whenever the words pass.
      Module docstring leg (A) gains one sentence naming the landed route.
  - file: scripts/checks/verification/_implementation_merge.py
    action: Modify
    purpose: >-
      late_closure_route drops the approved-text sidecar exclusion (the sidecar_state check and the now-unused
      approved_text import and _PLAN_RE match); leg A checks the words. Signature, ImplementationMerge(sha, parent),
      LateClosureError and find_implementation_merge stay as they are (the rec-5441 plan calls them).
  - file: scripts/session/merge_step.py
    action: Modify
    purpose: >-
      Delegation only, with no new branch or loop (validate_test_coverage measures this file against
      tests/test_session_merge_step.py alone, at 100% today): _approved_text gets (messages, landed) from
      merge_step_landed.verify in place of approved_text.verify, calls merge_step_landed.print_landed(landed), passes
      merge_step_landed.unlanded(sidecar, landed) to _sidecar_blocks_stale (signature and body unchanged), and ANDs
      merge_step_landed.report_stale(sidecar, slug, root, landed) into ok. Every added line runs unconditionally in the
      existing TestPremergeApprovedText nodes. Normal-route files keep today's lines.
    new_imports: [scripts.session.merge_step_landed]
  - file: scripts/session/merge_step_landed.py
    action: Create
    purpose: >-
      The premerge landed logic, mapped by map_source_to_test to tests/test_session_merge_step_landed.py: verify
      (approved_text.verify_landed against the merge-base), print_landed ("PREMERGE APPROVED-TEXT LANDED <file> <sha>"
      per landed file), unlanded (the sidecar without landed files' blocks), report_stale (re-resolves verify_landed
      against origin/main and prints "PREMERGE STALE BASE <file>: rebase and re-run CI" when the sha differs or no
      longer resolves; True when nothing is stale). Imports scripts.roadmap.approved_text only, inside functions as
      merge_step does.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar docs/plans/approved/approved-text-landed-words.yaml: approved_text_binding gains LANDED,
      resolves_trailer LATE CLOSURE and merge_step_coverage drop the sidecar exclusion, contract_version 16 -> 17, one
      amendment_log row, and five passages of history or detail cut to citations of their owners (Decision 275 cl.3
      relief, operator's choice 2026-11-20; no amendment_log row is compacted).
  - file: docs/plans/approved/approved-text-landed-words.yaml
    action: Create
    purpose: The operator-approved git-ops.yaml wording (Decision 246); lands in the plan PR, never edited by the build.
  - file: tests/test_approved_text.py
    action: Modify
    purpose: verify_landed unit tests over fixture repos; verify stays strict in the landed case.
  - file: tests/checks/verification/test_validate_merge_step.py
    action: Modify
    purpose: >-
      rec-5057 acceptance test test_sidecar_words_landed_in_earlier_pr_pass and the leg A landed cases; the
      sidecar-plan late-closure test replaced.
  - file: tests/checks/verification/test__implementation_merge.py
    action: Modify
    purpose: test_sidecar_plan_gets_no_route replaced by test_sidecar_plan_routes_to_x.
  - file: tests/test_session_merge_step.py
    action: Modify
    purpose: >-
      Remove only test_sidecar_plan_gets_no_late_premerge_route and test_readback_of_a_sidecar_plans_closure_is_not_ok
      (490 of 500 SLOC; their replacements live in the new file below). No other node changes.
  - file: tests/test_session_merge_step_landed.py
    action: Create
    purpose: >-
      premerge LANDED and STALE BASE cases (through merge_step premerge and merge_step_landed directly, so
      merge_step_landed.py is 100% covered by this file alone) and the two replacement late-closure tests; helpers it
      needs go in tests/fixtures/late_closure_repos.py (never imported from another test module).
  - file: tests/checks/verification/test_validate_verification_registry.py
    action: Modify
    purpose: >-
      Replace test_sidecar_plan_shard_stays_on_origin_main with test_sidecar_plan_shard_admitted_against_x_parent
      (a landed-words fixture; the shard is admitted with the late-closure base X^, as for any rec-bundling plan).
  - file: tests/fixtures/late_closure_repos.py
    action: Modify
    purpose: >-
      build_main gains a sidecar_landed option that writes doc.md's base words in the plan commit and the approved words
      in X, and plan_doc can put doc.md in the plan's scope (the realistic shape: real plans scope their bound files).
bundled_recommendations: [rec-5057]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    rec-5057's acceptance node tests/checks/verification/test_validate_merge_step.py::test_sidecar_words_landed_in_earlier_pr_pass
    exists and passes: a no-rec sidecar plan whose words landed in an earlier commit, later edited on main, is
    declared in a plans-only commit and validate_merge_step passes and prints LANDED naming that commit.
  - >-
    approved_text.verify is unchanged in behaviour: every existing tests/test_approved_text.py node passes unedited and
    a new node shows verify still fails where verify_landed passes; rebase_resolve, plan_wording_check and the
    approved_text verify CLI still call verify.
  - >-
    On real main, verify_landed resolves the landing commit of all seven blocked plans (VP 5), and a scratch flip of
    persona-verdict-wake (no recs) and plans-only-main-fast-tier (bundled recs, late closure) passes
    validate_merge_step (VP 6).
  - >-
    Decision 235 cl.1 confirmation (operator, 2026-11-20, in the planning thread: four tests with "write the plan", the
    fifth, test_validate_verification_registry.py::test_sidecar_plan_shard_stays_on_origin_main, with "confirm the
    fifth test"): the five tests pinning "a sidecar plan gets no late-closure route" are
    replaced; refusals stay pinned for words never landed, two landing commits,
    landing in different commits per file, sidecar approved words changed since C, a bound file the declaring PR
    touches, the plan declared at C, and C changing no scope file other than the bound files, plan and sidecar (its
    fixture puts the bound file inside the plan's scope).
  - >-
    docs/contracts/git-ops.yaml carries exactly the sidecar's words (validate_merge_step leg A at the build), stays at
    or under 54542 bytes and 500 effective lines, and passes validate_contract_drift's amendment retention.
  - >-
    late_closure_route(plan_rel, root, base, head), ImplementationMerge.sha/.parent and LateClosureError keep their
    names and signature.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: verify_landed unit tests.
    command: bin/venv-python -m pytest -q tests/test_approved_text.py
    expected: >-
      exit 0. New nodes fail before the change (no verify_landed): landed earlier passes and returns the commit; words
      edited after C still pass; never landed fails with "no landing commit"; two qualifying commits fail with
      "competing landing commits"; files landed in different commits fail; sidecar approved words changed after C
      give no C; plan declared at C gives no C; C changing only bound files (each in the plan's scope) gives no C; a working-tree edit to a bound
      file gets only the strict check; verify itself still fails in the landed case. Existing nodes pass unedited.
    fix_if: Fix verify_landed; never relax a refusal.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: Covered by the existing whole-file shard approved-text-tests (tests/test_approved_text.py).
  - step: 2
    phase: pre-deploy
    action: Merge-step leg A and the rec-5057 acceptance node.
    command: bin/venv-python -m pytest -q tests/checks/verification/test_validate_merge_step.py tests/checks/verification/test_validate_verification_registry.py
    expected: >-
      exit 0. test_sidecar_words_landed_in_earlier_pr_pass fails before the change. Also new: a landed bundled-rec
      sidecar plan's closure-only branch passes with LATE-CLOSURE and LANDED (replacing
      test_merge_step_sidecar_plan_fails_leg_t_as_today); a sidecar plan whose words never landed still fails, now in
      leg A; a declaring PR that edits a bound file and misses the words fails as today; provenance still runs (a
      MISSING approval on a landed sidecar fails in pull-request mode). In the registry file,
      test_sidecar_plan_shard_admitted_against_x_parent (replacing test_sidecar_plan_shard_stays_on_origin_main)
      fails before the change; every other registry node passes unedited.
    fix_if: Fix the wiring; never relax a refusal.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      Covered by the existing whole-file shard merge-step-check-tests; the registry node runs in that file's own
      fast-tier selection (the late-closure-gates-checks shard selects one other node, kept).
  - step: 3
    phase: pre-deploy
    action: Late-closure resolver.
    command: bin/venv-python -m pytest -q tests/checks/verification/test__implementation_merge.py
    expected: >-
      exit 0. test_sidecar_plan_routes_to_x (replacing test_sidecar_plan_gets_no_route) fails before the change; every
      other existing node passes unedited.
    fix_if: Fix late_closure_route.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: Covered by the existing whole-file shard late-closure-resolver.
  - step: 4
    phase: pre-deploy
    action: premerge and readback landed cases.
    command: bin/venv-python -m pytest -q tests/test_session_merge_step_landed.py
    expected: >-
      exit 0; every node fails before the change. premerge prints PREMERGE APPROVED-TEXT LANDED and no STALE BASE for
      a landed file; STALE BASE when origin/main resolves a different or no landing commit; a landed sidecar plan's
      late premerge passes when its rec is closed naming X (replacing test_sidecar_plan_gets_no_late_premerge_route)
      and fails when its words never landed; readback of a sidecar plan's closure merge prints late-closure
      satisfied-by=X (replacing test_readback_of_a_sidecar_plans_closure_is_not_ok); recover refuses a landed sidecar
      plan's closure merge as a late closure, as for any rec-bundling plan.
    fix_if: Fix merge_step; a reader failure never passes.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: approved-text-landed-premerge
  - step: 5
    phase: pre-deploy
    action: Real history resolves the seven blocked plans' landing commits, read in a detached worktree at origin/main.
    command: >-
      bash -c 'set -e; T=$(mktemp -d); trap "git worktree remove --force $T" EXIT; git worktree add -q --detach "$T"
      origin/main; bin/venv-python -c "import sys; from pathlib import Path; from scripts.roadmap import approved_text as at; r=Path(sys.argv[1]);
      [print(s, sorted({c[:10] for c in at.verify_landed(at.load_sidecar_at(\"origin/main\", s, r), s, r, \"origin/main\")[1].values()}))
      for s in sys.argv[2:]]" "$T" persona-verdict-chain persona-verdict-egress persona-verdict-wake
      planning-eligibility-start-edges graduated-rerun-plan-readers plans-only-main-fast-tier sit-restore-spike'
    expected: >-
      Seven lines, each one sha: chain 4aecbb4441, egress b12809afbb, wake 4ac3243e81, planning-eligibility
      7348574916, graduated-rerun 9352f40f31, plans-only 932622ff02, sit-restore 98e84cf09d (measured by the planning
      prototype on 878d6425; each C also changes 1 to 35 non-bound scope files, measured 2026-11-20). The worktree
      root matters: on the build branch git-ops.yaml differs from origin/main, so two plans would read no candidate.
      If rec-5382 has declared one of these plans by then, it still resolves (the guard reads the plan at C).
    fix_if: >-
      An empty list from the origin/main worktree means a guard is wrong for real history; fix verify_landed, never
      widen a guard silently. An empty list from any other root means this step was run wrong.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: End-to-end flip in a scratch worktree.
    command: >-
      bash -c 'set -e; for s in persona-verdict-wake plans-only-main-fast-tier; do P="docs/plans/PLAN-$s.yaml";
      if git show "origin/main:$P" | grep -q "^implementation_declared: true"; then echo "SKIP $s already declared"; continue; fi;
      T=$(mktemp -d); trap "git worktree remove --force $T" EXIT; git worktree add -q --detach "$T" origin/main;
      printf "implementation_declared: true\n" >> "$T/$P";
      git -C "$T" -c user.name=vp -c user.email=vp@example.invalid commit -qam "declare $s";
      bin/venv-python -c "import sys; from pathlib import Path; from scripts.checks.verification.validate_merge_step import validate_merge_step as v; f=[]; v(f, root=Path(sys.argv[1]), base=\"origin/main\", changed=[sys.argv[2]], push_base=None); sys.exit(1 if f else 0)" "$T" "$P";
      git worktree remove --force "$T"; trap - EXIT; done'
    expected: >-
      exit 0. The wake run prints LANDED for docs/contracts/git-ops.yaml at 4ac3243e; the plans-only run prints
      LATE-CLOSURE and LANDED at 932622ff (the PASS line may be absent when the
      provenance lookup prints an advisory line; exit 0 plus those lines is the evidence). If rec-5382 has declared one by
      then, it prints SKIP and is recorded as such. The approval lookup is advisory outside pull-request CI.
    fix_if: Fix the code; never edit the seven plans or their sidecars here.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: git-ops.yaml words, size and retention.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug approved-text-landed-words && wc -c
      docs/contracts/git-ops.yaml && grep -cvE '^\s*$|^\s*#' docs/contracts/git-ops.yaml && bin/venv-python -m
      scripts.validate --pre
    expected: >-
      APPROVED-TEXT OK, at most 54542 bytes, at most 500 effective lines, and --pre exit 0 (validate_merge_step,
      validate_contract_drift retention and the structural size budgets included). Wording-check measurement on
      d44b5b0c: 54468 bytes, 483 lines (54480 and 489 with the sidecar's own wrapping).
    fix_if: Re-place the words (wrapping is free); never edit the sidecar or raise a budget.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: rec-5057 closed by the merge trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c;
      print(c.fetch_recs_by_ids(c.make_reader(), ['rec-5057'])[0][0]['status'])"
    expected: closed (trailer-closure job on the merge commit).
    fix_if: Follow git-ops.yaml resolves_trailer (readback, then recover); never a manual close after an acceptance refusal.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Existing premerge and readback nodes.
    command: bin/venv-python -m pytest -q tests/test_session_merge_step.py
    expected: exit 0 with only the two named nodes removed and no other node edited (the STALE BASE nodes included).
    fix_if: A changed existing assertion is a weakening; fix the code.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: Covered by the existing whole-file shard merge-step-verb-tests.
  - step: 10
    phase: pre-deploy
    action: Full tier on the committed, rebased tree before handoff (git-ops.yaml handoff_sequence).
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The full tier completes and validation_result --verify-head attests HEAD's tree with exit 0. Start it
      backgrounded with a 2 h limit from the top-level session; tests/test_aws_profile.py needs HOME set to an empty
      directory.
    fix_if: Fix the failing check on the branch; never skip, disable or quarantine a test.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: Per-file coverage of the five changed modules from their mapped test files, before VP 10.
    command: >-
      bash -c 'set -e; for pair in session/merge_step:test_session_merge_step session/merge_step_landed:test_session_merge_step_landed
      roadmap/approved_text:test_approved_text checks/verification/validate_merge_step:checks/verification/test_validate_merge_step
      checks/verification/_implementation_merge:checks/verification/test__implementation_merge; do m=${pair%%:*}; t=${pair#*:};
      bin/venv-python -m pytest -q "tests/$t.py" --cov="scripts.${m//\//.}" --cov-report=term-missing --cov-fail-under=100
      -o addopts=""; done'
    expected: >-
      exit 0; each module 100% from its mapped test file alone (merge_step.py measured 100.0% on origin/main 24757464,
      60 passed; approved_text.py, validate_merge_step.py and _implementation_merge.py measured 100% at 30cd062e).
    fix_if: >-
      Move the uncovered branch out of merge_step.py into merge_step_landed.py, or add its node to the new test file;
      never a config/coverage_baseline.yaml entry.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/roadmap/approved_text.py
    behavior: verify_landed accepts exactly one guarded landing commit for unchanged bound files; verify stays strict
    verification_step: 1
    test_selector: tests/test_approved_text.py
    red_green_expectation: red before (verify_landed absent), green after
  - source: scripts/checks/verification/validate_merge_step.py
    behavior: leg A accepts landed words and prints LANDED; refusals unchanged
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_merge_step.py::test_sidecar_words_landed_in_earlier_pr_pass
    red_green_expectation: red before (APPROVED-TEXT mismatch), green after
  - source: scripts/checks/verification/_implementation_merge.py
    behavior: late_closure_route resolves X for a sidecar plan
    verification_step: 3
    test_selector: tests/checks/verification/test__implementation_merge.py::test_sidecar_plan_routes_to_x
    red_green_expectation: red before (None), green after
  - source: scripts/session/merge_step.py
    behavior: premerge prints LANDED and no false STALE BASE for landed files
    verification_step: 4
    test_selector: tests/test_session_merge_step_landed.py
    red_green_expectation: red before (STALE BASE and MISMATCH for a landed file), green after
  - source: scripts/session/merge_step_landed.py
    behavior: verify, print_landed, unlanded and report_stale per its scope row
    verification_step: 4
    test_selector: tests/test_session_merge_step_landed.py
    red_green_expectation: red before (module absent), green after
  - source: docs/contracts/git-ops.yaml
    behavior: carries exactly the sidecar's approved words over its base
    verification_step: 7
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug approved-text-landed-words
    red_green_expectation: red before (APPROVED-TEXT MISMATCH, the words are not placed), green after
weakening_dispositions:
  - candidate: "[test-removed] tests/checks/verification/test__implementation_merge.py::test_sidecar_plan_gets_no_route"
    disposition: planned-change
    cite: "acceptance_criteria[3]"
  - candidate: "[test-removed] tests/checks/verification/test_validate_merge_step.py::test_merge_step_sidecar_plan_fails_leg_t_as_today"
    disposition: planned-change
    cite: "acceptance_criteria[3]"
  - candidate: "[test-removed] tests/checks/verification/test_validate_verification_registry.py::test_sidecar_plan_shard_stays_on_origin_main"
    disposition: planned-change
    cite: "acceptance_criteria[3]"
  - candidate: "[test-removed] tests/test_session_merge_step.py::test_sidecar_plan_gets_no_late_premerge_route"
    disposition: planned-change
    cite: "acceptance_criteria[3]"
  - candidate: "[test-removed] tests/test_session_merge_step.py::test_readback_of_a_sidecar_plans_closure_is_not_ok"
    disposition: planned-change
    cite: "acceptance_criteria[3]"
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - approved_text.verify stays strict; only validate_merge_step leg A and premerge opt in to verify_landed.
  - git-ops.yaml changes are exactly the sidecar's words; never edit the sidecar in the build (Decision 246).
  - git-ops.yaml stays at or under 54542 bytes and 500 effective lines; do not lower or raise its byte_budgets entry.
  - Keep the trailer-range-closure sidecar's git-ops.yaml anchors intact (its first amendment_log row contiguity,
    "record. A trailer that readback finds missing goes to", trailer_acceptance_gate); the new row goes after the
    2026-11-17 persona-verdict-wake row.
  - Do not edit the code of validate_verification_registry or the graduation and weakening checks (rec-2837, rec-5441 own
    them); its sidecar-plan shard base moves to X^ through late_closure_route alone (scope row for its test).
  - The five replaced tests are named in weakening_dispositions; no other existing assertion changes.
context:
  - "Decision-scout verdict: NO_FLAGS (round 6, after Decision 279 landed: cited for cl.1 (git-ops.yaml approved_text_binding is gated text, so the sidecar binds the whole file), cl.3 (later notice-class edits need no new run, the basis of not rechecking words after C), cl.4 (validate_approval_routing passes on the bound build PR) and cl.7 (rollback). Round 4's Decision 275 NOTE closed by the operator's choice of clause 3 citation relief; round 1 Decision 246 spirit NOTE adopted). CITE: dec:246, dec:235, dec:181, dec:275, dec:279. Serves: NS.9 3/5. Decisions triaged: 228 of 228. Roadmap items intersected: 3; CONFLICT: 0; RELATED: 3"
  - "Evidence: rec-5057 context (rec-5382 measurements); project files approved-text-landed-words/ (PRESENTATION.md, advisor-brief/ADVICE.md, SCOUT-r1.md)."
  - "Fork settled with operator 2026-11-20: landing-commit rule, not rec-5057's original landed-at-base rule (that rescues 1 of 7)."
  - "The words-landing commit can differ from the trailer merge X (sit-restore-spike: words 98e84cf0, trailer ef631f28), so verify_landed never ties C to X."
  - "Five callers of verify exist (validate_merge_step, merge_step premerge, rebase_resolve.py, plan_wording_check.py, the CLI); only the first two move."
