execution_steps:
  - >-
    Re-measure red_overlap (#1855 merged since the plan's reading) and the NEAR_CAP rows; check PR #1806's state (if it
    has stalled, this build may go first, since its overlaps with this sidecar are anchor-only).
  - >-
    approved_words.py (the moved names, approved_digest, render with its refusals) and approved_text.py (re-exports,
    record's approved= and fingerprint= lines); confirm with scripts.dependency_graph that the render and wake jobs'
    closure is exactly the CODEOWNERS list.
  - approved_text_provenance.py and approved_text_github.py as scoped, with their tests and fixtures (copy the history fixtures from git, never hand-write them).
  - validate_merge_step.py and validate_plan_documents.py -- the provenance legs and seams, then their two test files.
  - >-
    approved-text-approval.yml, ci.yml, deployment-approval-probe.yml header, Terraform files, ports.yaml, taxonomy
    and baseline rows; measure ci_rca_taxonomy.yaml and git-ops.yaml against main and apply their NEAR_CAP rows
    (taxonomy: compact; git-ops: stop and report).
  - Apply the sidecar blocks exactly (git-ops.yaml, planning SKILL.md, DECISIONS.md); config/prose_budgets.yaml changes only if SKILL.md's measured size moves; pin GRANDFATHER_REF to the merge-base at the final rebase.
  - Execute the Verification Plan pre-deploy steps; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55).
  - >-
    Before code review, post on the build PR the V3 evidence for its CI-green head (see the V3 resolution context
    line): the terraform-github plan run URL with its TF_GITHUB_PLAN_REPORT line, and the pr-validate run URL with its
    `lookup (informational)` line (VP 9).
  - >-
    Merge only on code review PROCEED, green CI and the operator's final-diff word (the new Decision, clause 4): the
    build touches CODEOWNERS paths (terraform/github, .github/CODEOWNERS and the new workflow) and ci.yml's
    pr-validate permissions; sidecar-bound text needs no further word.
  - >-
    After merge, ask the coordinator to get the operator's hand apply of terraform/github (infrastructure_dependencies);
    run VP 11-12 only after it, VP 13-14 at once; then send the coordinator the merge sha and the note for
    PLAN-coordinator-approve-once.
  - >-
    Report: what was implemented and the evidence each claim cites (`validation_result --verify-head` output, the PR
    CI run ids, the merge sha from the merge-step read-back, VP 11's run id and approver), with the github_readiness
    state and the postflight evidence run reported apart from the push and PR outcomes (implement skill Commit Flow
    1 and 5).
