constraints:
  - Approval is GitHub's record, never an agent-written field (Decision 233 cl.4); no repo file may stand in for it except the git-derived grandfather.
  - "Public boundary (Decision 101): reviewer ids stay in var.gated_apply_reviewer_user_ids; the run page shows only public slug, digest and wording."
  - Never execute code from the dispatched sha (Decision 238 cl.3); inputs reach shell only via env.
  - The terraform/github root is operator hand-applied; agents never apply it (Decision 126, environment-taxonomy.yaml).
  - Sidecar-bound files change exactly as the sidecar says; a build that cannot reproduce it stops and reports to the coordinator.
  - No rescue agents or workaround loops (Decision 55).
