    purpose: Jobs response shape recorded from a real GET runs/{id}/jobs read (run 40115703173, whose one job is gate-smoke-test), with the job renamed approve and synthetic ids, so the APPROVED path is exercised.
  - file: tests/fixtures/approved_text/review_page_base.yaml
    action: Create
