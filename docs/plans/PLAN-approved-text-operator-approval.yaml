schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: approved-text-operator-approval
intent: >-
  Make operator-approved always-ask wording provable end to end: the operator approves a sidecar's approved words on a
  reviewer-gated GitHub Environment that no agent credential can approve, and CI reads GitHub's own record of that
  approval at the plan PR and at the build, so what the operator approves at planning ships word for word and the
  build never asks again (rec-4769).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-approved-text-operator-approval.yaml
phase: >-
  ad_hoc_rec (rec-4769, Medium, M; brought forward by the operator 2026-11-03). Closes the provenance residual that
  git-ops.yaml approved_text_binding declares under Decision 181 cl.2. No tier_item criterion is closed.
scope:
  - file: scripts/roadmap/approved_words.py
    action: Create
    purpose: >-
      The approval surface's small closure (critique r4 B4: render and wake must not import approved_text.py, whose
      verify CLI reaches scripts.checks._common and the plan schema). Moves here from approved_text.py unchanged: the
      Sidecar and Block models, words, sidecar_rel, parse_sidecar, ApprovedTextError, the _PLACEHOLDERS regexes, the
      placeholder-aware matcher (_token_matches, find_all) and digest() (the wording-check digest the page header also
      shows, critique r7 B1). Imports only the standard library, yaml, pydantic and
      review_page. Adds approved_digest(sidecar): per block, drop the longest common word suffix of `before` and
      `after` first, then the longest common prefix of what remains, and keep one row [file, removed words, added words]; hash the sorted
      rows (block order and ids do not count; each block's removal stays paired with its addition). In an equal-length
      replace run (difflib opcodes) a removed word that the aligned added placeholder's pattern matches (the _PLACEHOLDERS
      regexes: a number for {{N}}, an ISO date for {{DATE}}) is recorded as that placeholder, so a contract_version or
      Decision number that main moves keeps the digest. Only those and the shared anchor words drop out, so any other
      change to an added or a removed word changes the digest (sidecar clause 2; the B10 card recommends it, and the
      operator's pick is pending).
      CLI `python -m scripts.roadmap.approved_words render --sidecar-file F --slug S --base-file-dir D
      --expect-approved H --fingerprint W`: parses F as data; refuses a slug that is not [a-z0-9-]+, a digest that is
      not 64 hex or differs from approved_digest, a W that is not review_page.fingerprint(H), a block file that is
      absolute or holds `..` or `.git/`, and wording that carries a control, bidi-override or zero-width code point
      (Unicode category Cc other than newline and tab, or Cf), so the page cannot read differently from the bound
      words; locates each block in D with the matcher (by `before`, else by `after`, else "place not found at main
      <sha>"); prints review_page.render's Markdown for $GITHUB_STEP_SUMMARY, and refuses output over 1 MiB (the step
      summary cap, past which GitHub drops the page while the job still succeeds) so approve never waits on an empty
      page.
    new_imports: [scripts.roadmap.review_page]
  - file: scripts/roadmap/approved_text.py
    action: Modify
    purpose: >-
      Re-exports the moved names from approved_words unchanged, by explicit `from scripts.roadmap.approved_words
      import X as X` lines (ruff F401-safe, underscore names included: tests/decisions_md/test_envelope.py reads
      `approved_text._PLACEHOLDERS`), so every importer (_implementation_merge, merge_step, rebase_resolve,
      plan_wording_check, plan_decision_drafts, the checks, the tests) keeps working; also re-exports
      approved_digest and digest(). `record` also prints `approved=<hex>` and `fingerprint=<four words>`
      (review_page.fingerprint). verify, sidecar_state and the git helpers stay here; digest() moves unchanged
      (wording-check rows and --expect keep their meaning, and patches of `approved_text.digest`, such as
      test_validate_plan_documents.py's, still bind through `_changed_sidecar_digest`'s attribute call). The file
      shrinks, so its SLOC budget only falls.
    new_imports: [scripts.roadmap.approved_words, scripts.roadmap.review_page]
  - file: scripts/roadmap/review_page.py
    action: Create
    purpose: >-
      Reusable plain-reading review page (operator ruling 2026-11-04; rec-4905 reuses it for gated applies). Pure
      functions, no I/O, and no repository import (blocks are read by their file, before and after attributes), so
      approved_words imports it without a cycle. fingerprint(hex) -> four words from a fixed 256-word list, held as one
      triple-quoted string split on whitespace so ruff cannot spread it over 256 of the 500 SLOC (one word per byte of
      the first four bytes; for eyeballing only, the full digest stays the binding). render(blocks, locations) -> Markdown: a header
      with the slug, the fingerprint and both digests; then per block the location line its caller found (file, then
      the nearest preceding Markdown heading or top-level YAML key at the block's place, or "place not found at main
      <sha>"; the form never depends on the base, so a block renders even after main carries its `after`), and exactly one form
      chosen by machine from `before` and `after` alone: New text (pure
      insertion: the added words as clean prose, plus the anchor it follows or precedes), Deleted (pure deletion: the
      removed words in <del>), Edited in place (four or fewer changed runs: context words with <del>/<ins> marks), or
      Was / Becomes (more than four runs: both full paragraphs). Placeholders show as [N] and [date]; Markdown inside
      quoted wording is escaped so it cannot restyle the page.
  - file: scripts/roadmap/approved_text_provenance.py
    action: Create
    purpose: >-
      Forge-neutral core (Decision 234). GRANDFATHER_REF: a pinned main commit (the build's merge-base at its final
      rebase). Accepted window: Decision 245's merge gate keys on file overlap, so a sidecar plan PR can merge between
      the pin and this merge; that sidecar is then neither grandfathered nor approved, and its build fails closed
      until the operator approves it once on the new gate. Imports only the standard library, yaml and approved_words
      (it reads the sidecar and the plan at GRANDFATHER_REF with its own `git show`, and decides implementation_declared
      with _common._plan_declared_at_ref's semantics: a missing path or an unparsable file reads as not declared), so
      the wake job's closure stays small (critique r4 B4). provenance(slug, sidecar, root, lookup, mode) returns APPROVED (run id, approver) | GRANDFATHERED | MISSING |
      UNVERIFIED(reason): GRANDFATHERED when the sidecar exists at GRANDFATHER_REF with the same approved_digest and
      its plan is not implementation_declared there (git only, Decision 187); GRANDFATHER_REF missing from the clone
      (shallow) is UNVERIFIED, never a fall-through to MISSING; else the injected lookup's answer. mode(in_push,
      on_pr): each check passes its own push context (validate_merge_step its existing in_push; validate_plan_documents
      one _common.push_context_base call) and on_pr (GITHUB_EVENT_NAME is pull_request, the predicate
      validate_plan_documents' on_plan_pr already uses; the check reads it, the core reads no environment variable,
      Decision 234), so a main push and the on-main Main Canary schedule both skip (the post-merge full tier never
      re-runs the lookup, as decision-new clause 3 and git-ops-binding say); else enforce when on_pr (ci.yml has no
      merge_group trigger); else advisory. On skip the leg prints `SKIP: approval lookup (main push)` and the check
      keeps its one registry.examined declaration (Decision 170 keeps skipped() for a check that examined nothing).
      Both checks route the two non-passing answers alike, per clause 3's plain reading ("elsewhere the lookup is
      advisory and never reads as a pass", critique r5 N1): MISSING (the record was read and holds no approval) and
      UNVERIFIED fail under enforce, and otherwise print `MISSING (advisory)` or `UNVERIFIED (advisory)`, never a PASS
      line (a planner runs --pre between rounds before the tap).
  - file: scripts/roadmap/approved_text_github.py
    action: Create
    purpose: >-
      GitHub change-surface adapter (stdlib urllib through two module functions, `http_get(url, token, timeout)` for
      every read and `http_post(url, token, body, timeout)`, which only wake calls; tests monkeypatch both, since
      tests/conftest.py denies sockets; the deployment_approval_probe.py transport shape,
      not shared: that probe is session-only; token from APPROVED_TEXT_GH_TOKEN, a variable only this module reads,
      anonymous otherwise, since the repository is public). The repository is `--repo OWNER/NAME` when given, else
      scripts.repo_identity.full_name() (GITHUB_REPOSITORY in Actions); session commands always pass --repo, since the
      fallback constant is the pre-transfer name the session proxy refuses (critique r4 B2). So a session's --pre
      prints `UNVERIFIED (advisory)` for a changed sidecar; that is expected, and the session read is `check --repo
      otl-labs/ontheloop`. lookup(slug, approved_digest, root): root is the repository the ancestry check runs in (each
      seam passes its own, so TestSeams runs it in its tmp repository); list the repository's runs with event workflow_dispatch and branch main, any status (GET
      /repos/{owner}/{repo}/actions/runs, per_page 100, at most 10 pages, so the 1000 newest; not the per-workflow
      endpoint, which answers 404 until main carries the workflow, critique r4 B1); keep runs whose path is
      .github/workflows/approved-text-approval.yml, whose display_title equals `approved-text <slug> <fingerprint>
      <digest>` and whose head_sha is an ancestor of origin/main (`git merge-base --is-ancestor`); drop runs the list
      already shows cannot hold an approval (status waiting, or completed with a conclusion other than success; the
      wake job's continue-on-error keeps an approved run's conclusion success), so pending or rejected re-dispatches
      never hide an older approved run (critique r5 N6); for at most 5 of the rest, newest first, read GET
      /actions/runs/{id}/jobs and /approvals; APPROVED when the approve job
      concluded success and one approvals entry has state approved and lists environment approved-text. Keying on the
      approve job, not the run's status, means the wake comment the still-running wake job posts already finds it.
      No /environments read: the session proxy refuses that path (403, critique r1 live read), and with
      can_admins_bypass false GitHub records an approval only from a required reviewer, whose set Terraform owns
      (environments.tf, reviewers from var.gated_apply_reviewer_user_ids). Each request has a 10 s timeout and one
      30 s deadline is shared by every lookup in a check run, so a PR changing several sidecars stays inside the
      selection budget's non-test half (Decision 73 cl.1); any HTTP error, timeout, deadline, unparsable body or missing
      git object is UNVERIFIED with the reason; an answered query with no match is MISSING, including an approval
      older than the 1000 newest dispatch runs on main (fails closed; ports.yaml SA-05 records the bound; 179 such
      runs on 2026-11-04). Imports only the standard library, approved_words, approved_text_provenance and
      scripts.repo_identity. CLI (each subcommand takes `--repo`): `check --slug S [--digest H]` (H defaults to
      approved_digest of the sidecar in the working tree; prints both the grandfather and the lookup verdicts),
      `approvals --run-id N` (prints each approval's state, environments and login; the read-only probe of VP 6), and
      `wake --slug S --sha X --digest H --run-id R` (lists open PRs, GET /repos/{owner}/{repo}/pulls?state=open, and
      comments through http_post on each whose head.sha is X: a `<!-- approved-text-wake:H -->` marker plus one
      visible line naming the slug, the fingerprint, run R and "re-run pr-validate on this PR"; it prints `wake: <n>
      open PRs at <sha> auth=token|anonymous`; used only by the workflow's wake job).
    new_imports: [scripts.roadmap.approved_words, scripts.roadmap.approved_text_provenance, scripts.repo_identity]
  - file: scripts/checks/verification/validate_merge_step.py
    action: Modify
    purpose: >-
      _check_sidecar: after approved_text.verify passes on the base sidecar, call approved_text_provenance.provenance
      on it; under enforce append a failure for MISSING or UNVERIFIED naming the dispatch remedy (git-ops.yaml
      approved_text_binding), and otherwise print the advisory line. The leg calls a module function
      `_sidecar_provenance(slug, sidecar, root, in_push)` (the core over the base sidecar it is given, with the GitHub
      lookup and mode(in_push, GITHUB_EVENT_NAME == pull_request)). It returns (verdict, mode), and the leg routes on
      both, so the check-level tests monkeypatch it to any pair (APPROVED with enforce by default; MISSING or
      UNVERIFIED with enforce or advisory; skip) and TestSeams runs it for real. On skip it prints the SKIP line and still declares examined. When the base sidecar is GRANDFATHERED under enforce it still runs the lookup once and
      prints `lookup (informational): <verdict> auth=token|anonymous`, never failing on it, so a build PR's own CI log
      shows the token path working (VP 9; the repository is public, so an anonymous read also answers, and only
      auth=token proves the wiring, critique r7 N3). Its cost is bounded and ends by itself: only a build PR that declares a grandfathered
      sidecar plan runs it, once, within the 30 s deadline, and the grandfathered set is the sidecars on main at
      GRANDFATHER_REF, each built once (critique r4 N8). An advisory line suppresses the summary PASS line; the
      examined declaration still counts the plans verify checked (the printed line, not check accounting, carries the
      advisory outcome; off PR CI the whole run is advisory, Decision 73). The trailer leg is unchanged.
    new_imports: [scripts.roadmap.approved_text_provenance, scripts.roadmap.approved_text_github]
  - file: scripts/checks/roadmap/validate_plan_documents.py
    action: Modify
    purpose: >-
      Beside _wording_check_gaps: a plan whose sidecar the diff adds or changes needs provenance of the HEAD sidecar
      APPROVED or GRANDFATHERED; MISSING and UNVERIFIED fail under enforce (the plan PR) and otherwise print a WARN
      line. If the diff base does not resolve under enforce, the leg reads UNVERIFIED for every sidecar the tree holds
      rather than skipping (fail closed; pr-validate's fetch-depth 0 makes it unreachable today, critique r8 N3). The failure names the run to
      dispatch (slug, the PR head sha from $GITHUB_EVENT_PATH's pull_request.head.sha, else HEAD; approved digest;
      fingerprint), since pull-request CI checks out a merge commit the wake would never match. It also says: dispatch
      at the PR's final head; if the head moves before the tap, re-run pr-validate after it (the approval stands while
      the sidecar is unchanged; the wake comment only reaches a PR whose head is the dispatched sha). The push context
      comes from one `_common.push_context_base(_common.ROOT)` call in the check, which the leg tests monkeypatch
      (critique r4 B3). The leg calls a module function `_sidecar_provenance(slug, root, in_push)`: the core over the
      working-tree sidecar under root (the HEAD copy the PR proposes, never the diff base's; whether it changed is
      `_changed_sidecar_digest`'s call), with the GitHub lookup and mode(in_push, GITHUB_EVENT_NAME == pull_request),
      and returns (verdict, mode) like validate_merge_step's. The check-level tests monkeypatch it, as they already do `_changed_sidecar_digest`, and TestSeams runs it for
      real (critique r5 B1). On skip it prints the SKIP line and still declares examined. An advisory line suppresses
      the summary PASS line (accounting as for validate_merge_step).
    new_imports: [scripts.roadmap.approved_text_provenance, scripts.roadmap.approved_text_github]
  - file: tests/checks/verification/test_validate_merge_step.py
    action: Modify
    purpose: >-
      An autouse fixture monkeypatches `_sidecar_provenance` to APPROVED, so every existing node that reaches the leg
      (test_exact_sidecar_passes, test_real_tree_run_passes, the _late_merge nodes) keeps its meaning and never
      reaches the network or depends on GITHUB_ACTIONS; the graduated shard merge-step-check-tests (this whole file) is
      kept. New class TestProvenanceLeg overrides it: MISSING and UNVERIFIED fail under enforce, an advisory MISSING
      or UNVERIFIED prints no PASS line, and on a main push the lookup is skipped while examined is still declared.
  - file: tests/checks/roadmap/test_validate_plan_documents.py
    action: Modify
    purpose: >-
      An autouse fixture (about four lines) monkeypatches `_sidecar_provenance` to APPROVED, so
