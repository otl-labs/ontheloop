      git-ops-binding swapping their additions (not two pure insertions such as decision-new and decision-83-update,
      whose swap keeps the digest: the declared words-not-place residual, rec-4907), and git-ops-version's replaced
      number changed to a word; equal when that number moves
      12 to 13. `record` prints the approved= and fingerprint= lines. Grandfather true only at the pinned ref, same
      digest, plan undeclared, UNVERIFIED when the ref is missing; mode(in_push, on_pr) and is_failure per context:
      skip on in_push (a push and an on-main schedule), enforce on on_pr, advisory otherwise (workflow_dispatch,
      schedule off main, local runs). TestSidecarApprovalLeg (validate_plan_documents' new leg): every node
      monkeypatches the check's `_common.push_context_base` (to None, or to a sha for one node proving the skip with
      examined kept), so the graduated shard reads the same on main's branch-main checkout as on a session branch
      (critique r4 B3); a changed sidecar without approval fails on the plan PR and warns off it, GRANDFATHERED and
      APPROVED pass, UNVERIFIED fails on the plan PR, an advisory MISSING or UNVERIFIED warns without a PASS line,
      and the remedy names the PR head sha from a fixture event payload. TestSeams (critique r5 B1) runs both real
      `_sidecar_provenance` seams in a tmp git repository and monkeypatches only approved_text_github.http_get (a
      recorder answering from fixtures; the repository's refs/remotes/origin/main covers each fixture run's head_sha)
      and GRANDFATHER_REF (a fixture commit): (a) validate_plan_documents' seam, with pull_request, on a working tree
      that rewords a sidecar present and undeclared at the fixture ref, while the runs list holds one approved run
      titled with the old copy's approved digest, reads MISSING (it evaluates the HEAD copy, so the old approval and
      the grandfather do not carry over), and the unchanged copy reads GRANDFATHERED; (b) validate_merge_step's seam
      with in_push true never calls http_get, and with pull_request reads APPROVED from a run titled with the base
      sidecar's approved digest.
  - file: tests/test_review_page.py
    action: Create
    purpose: >-
      Each render form on this plan's own sidecar blocks (git-ops-binding renders Was / Becomes, planning-step-8b
      renders Edited in place, decision-83-update renders New text) plus a synthetic pure deletion; location lines;
      placeholder display; escaping (a block whose words carry ** or <del> cannot restyle the page); fingerprint is
      four words, stable, and changes with the digest; a block whose `before` is absent from the base renders from
      `after`'s place, and one found nowhere renders with "place not found at main"; base texts come from a pinned
      fixture copy, never the working tree; `approved_words render` refuses a bad slug, a digest mismatch, a
      fingerprint that does not match the digest, a block file that is absolute or holds `..` or `.git/`, and wording
      with a Cc (other than newline and tab) or Cf code point.
  - file: tests/test_approved_text_github.py
    action: Create
    purpose: >-
      Recorded-API oracle (Decision 212 cl.2, no credential): fixtures under tests/fixtures/approved_text_github/
      (runs list, jobs, approvals), each refusal path (wrong title, wrong path, branch not main, sha not on main,
      approve job not successful, rejected approval, wrong environment, HTTP error, timeout, deadline), a run still in
      progress whose approve job succeeded (APPROVED: the wake race), five newer waiting or rejected runs with the same
      title that do not hide an older approved one, and the wake comment target (pulls.json; http_post recorded, its
      body carrying the marker and the visible line); the list call is
      the repository-wide runs endpoint with the event and branch filters; `--repo` overrides repo_identity; `check
      --digest` overrides the working-tree digest; only APPROVED_TEXT_GH_TOKEN is read.
  - file: tests/test_approved_text_approval_workflow.py
    action: Create
    purpose: >-
      Static workflow and Terraform shape (the test_deployment_approval_probe_workflow.py pattern): dispatch-only,
      permissions per job, no secrets or id-token, the main-only guard, inputs only through env, environment name,
      render passes --expect-approved and --fingerprint, both jobs install exactly pyyaml and pydantic at
      requirements.txt's pins, run-name grammar equal to
      approved_text_github's parser, every `uses:` is SHA-pinned, both checkouts set persist-credentials false, the wake step sets
      APPROVED_TEXT_GH_TOKEN, the Terraform resource attributes, and each new address being EXEMPT or carrying an
      import block (so rec-4911 needs no edit here). In ci.yml, scoped to pr-validate so later ci.yml changes need no
      edit to this code-owned test: it holds `actions: read`, only its step whose name starts with "Validate fast
      tier" (the full name carries a parenthesised list) sets APPROVED_TEXT_GH_TOKEN, and that step sets no GH_TOKEN. CODEOWNERS lists the workflow and every path of the
      render and wake jobs' import closure (scripts.dependency_graph forward_closure of approved_words and
      approved_text_github), and that closure holds nothing under scripts/checks/ and neither approved_text.py nor
      plan_document.py.
  - file: tests/fixtures/approved_text_github/runs.json
    action: Create
    purpose: >-
      Runs-list response recorded from a real list_workflow_runs read (keys and nesting kept); user, actor and
