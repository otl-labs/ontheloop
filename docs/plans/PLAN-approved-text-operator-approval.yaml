schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: approved-text-operator-approval
intent: >-
  Make operator-approved always-ask wording provable end to end: the operator approves a sidecar's approved words on a
  reviewer-gated GitHub Environment that no agent credential can approve, and CI reads GitHub's own record of that
  approval at the plan PR and at the build, so what the operator approves at planning ships word for word and the
  build never asks again (rec-4769).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-approved-text-operator-approval.yaml
phase: >-
  ad_hoc_rec (rec-4769, Medium, M; brought forward by the operator 2026-11-03). Closes the provenance residual that
  git-ops.yaml approved_text_binding declares under Decision 181 cl.2. No tier_item criterion is closed.
scope:
  - file: scripts/roadmap/approved_text.py
    action: Modify
    purpose: >-
      Add approved_digest(sidecar): per block, drop the longest common word suffix of `before` and `after` first, then
      the longest common prefix of what remains, and keep one row [file, removed words, added words]; hash the sorted
      rows (block order and ids do not count; each block's removal stays paired with its addition). Only the shared
      anchor words drop out, so any change to an added or a removed word changes the digest (sidecar clause 2, the
      operator's 2026-11-04 choice). `record` also prints `approved=<hex>` and `fingerprint=<four words>`
      (review_page.fingerprint of the approved digest). New `render --sidecar-file F --slug S --base-file-dir D
      --expect-approved H --fingerprint W` subcommand: parses F as data, refuses a slug that is not [a-z0-9-]+, a digest
      that is not 64 hex or differs from approved_digest, or a W that is not review_page.fingerprint(H), and prints
      review_page.render's Markdown for $GITHUB_STEP_SUMMARY. digest() is unchanged (wording-check rows and --expect
      keep their meaning).
    new_imports: [scripts.roadmap.review_page]
  - file: scripts/roadmap/review_page.py
    action: Create
    purpose: >-
      Reusable plain-reading review page (operator ruling 2026-11-04; rec-4905 reuses it for gated applies). Pure
      functions, no I/O. fingerprint(hex) -> four words from a fixed 256-word list (one word per byte of the first four
      bytes; for eyeballing only, the full digest stays the binding). render(blocks, base_texts) -> Markdown: a header
      with the slug, the fingerprint and both digests; then per block a location line (file, then the nearest preceding
      Markdown heading or top-level YAML key in the base text), and exactly one form chosen by machine: New text (pure
      insertion: the added words as clean prose, plus the anchor it follows or precedes), Deleted (pure deletion: the
      removed words in <del>), Edited in place (four or fewer changed runs: context words with <del>/<ins> marks), or
      Was / Becomes (more than four runs: both full paragraphs). Placeholders show as [N] and [date]; Markdown inside
      quoted wording is escaped so it cannot restyle the page.
  - file: scripts/roadmap/approved_text_provenance.py
    action: Create
    purpose: >-
      Forge-neutral core (Decision 234). GRANDFATHER_REF: a pinned main commit (the build's merge-base at its final
      rebase; Decision 245 refuses an agent merge once main moves, so no sidecar lands between the pin and the merge).
      provenance(slug, sidecar, root, lookup, mode) returns APPROVED (run id, approver) | GRANDFATHERED | MISSING |
      UNVERIFIED(reason): GRANDFATHERED when the sidecar exists at GRANDFATHER_REF with the same approved_digest and
      its plan is not implementation_declared there (git only, Decision 187); else the injected lookup's answer.
      mode(): skip only when GITHUB_ACTIONS is true and GITHUB_EVENT_NAME is push (the post-merge full tier never
      re-runs the lookup; the caller records registry.skipped with that reason, Decision 170); enforce when
      GITHUB_ACTIONS is true for any other or no event (pull_request, merge_group, unset: fail closed); advisory when
      GITHUB_ACTIONS is not true. is_failure(verdict, mode): MISSING fails under enforce and advisory; UNVERIFIED
      fails only under enforce and otherwise prints `UNVERIFIED (advisory)`.
  - file: scripts/roadmap/approved_text_github.py
    action: Create
    purpose: >-
      GitHub change-surface adapter (stdlib urllib, injected caller, the deployment_approval_probe.py transport shape,
      not shared: that probe is session-only; token from GH_TOKEN or GITHUB_TOKEN when set, anonymous otherwise, since
      the repository is public). lookup(slug, approved_digest): list runs of .github/workflows/approved-text-approval.yml
      with event workflow_dispatch, branch main, status success (per_page 100, at most 10 pages); keep runs whose
      display_title equals `approved-text <slug> <fingerprint> <digest>`, whose path is that workflow and whose
      head_sha is an ancestor of origin/main (`git merge-base --is-ancestor`); for at most 5 of them, newest first, read
      GET /actions/runs/{id}/approvals; APPROVED when one entry has state approved and lists environment approved-text.
      No /environments read: the session proxy refuses that path (403, critique r1 live read), and with
      can_admins_bypass false GitHub records an approval only from a required reviewer, whose set Terraform owns
      (environments.tf, reviewers from var.gated_apply_reviewer_user_ids). Each request has a 10 s timeout and the
      whole lookup a 30 s deadline (Decision 73 cl.1); any HTTP error, timeout, deadline, unparsable body or missing
      git object is UNVERIFIED with the reason; an answered query with no match is MISSING. CLI: `check --slug S
      [--digest H]` (H defaults to approved_digest of the sidecar in the working tree; prints both the grandfather
      and the lookup verdicts), `approvals --run-id N` (prints each approval's state, environments and login; the
      read-only probe of VP 6), and `wake --slug S --sha X --digest H` (comments `<!-- approved-text-wake:H -->` on
      each open PR whose head is X; used only by the workflow's wake job).
  - file: scripts/checks/verification/validate_merge_step.py
    action: Modify
    purpose: >-
      _check_sidecar: after approved_text.verify passes on the base sidecar, call approved_text_provenance.provenance
      on it; append a failure for MISSING, and for UNVERIFIED under enforce, naming the dispatch remedy (git-ops.yaml
      approved_text_binding). New fixture seam `provenance` (default: the core with the GitHub lookup), beside root,
      base, changed and push_base. An advisory UNVERIFIED prints its line and suppresses the summary PASS line. The
      trailer leg is unchanged.
    new_imports: [scripts.roadmap.approved_text_provenance, scripts.roadmap.approved_text_github]
  - file: scripts/checks/roadmap/validate_plan_documents.py
    action: Modify
    purpose: >-
      Beside _wording_check_gaps: a plan whose sidecar the diff adds or changes fails unless provenance of the HEAD
      sidecar is APPROVED or GRANDFATHERED (UNVERIFIED fails under enforce only). The failure names the run to
      dispatch (slug, HEAD sha, approved digest, fingerprint). The leg calls a module function
      `_sidecar_provenance(slug, base)` (the core with the GitHub lookup), the seam tests monkeypatch, as they already
      do `_changed_sidecar_digest`. An advisory UNVERIFIED prints a WARN line and suppresses the summary PASS line.
    new_imports: [scripts.roadmap.approved_text_provenance, scripts.roadmap.approved_text_github]
  - file: tests/checks/verification/test_validate_merge_step.py
    action: Modify
    purpose: >-
      _run defaults the new `provenance` seam to an APPROVED stub (kwargs.setdefault), so test_exact_sidecar_passes
      and every other existing node keep their meaning and never reach the network or read the CI environment; the
      graduated shard merge-step-check-tests (this whole file) is kept. New class TestProvenanceLeg: MISSING fails,
      UNVERIFIED fails under enforce, an advisory UNVERIFIED prints no PASS line, and a push skips the lookup.
  - file: tests/checks/roadmap/test_validate_plan_documents.py
    action: Modify
    purpose: >-
      One line: TestWordingCheckRecord._run also monkeypatches `_sidecar_provenance` to APPROVED, so
      test_a_fresh_pass_row_satisfies_the_plan_pr and its siblings keep their meaning; the graduated shard
      wording-check-row-required-on-plan-pr (that class) is kept. The new nodes go in their own file (below). NEAR_CAP
      (489 of 500 SLOC on 2026-11-04): measure against main at build time; if the line would cross 500, move
      TestWordingCheckRecord into the new file whole (decompose) and point that shard's node_id at it.
  - file: tests/checks/roadmap/test_validate_plan_documents_sidecar_approval.py
    action: Create
    purpose: >-
      TestSidecarApprovalLeg: a changed sidecar without approval fails on the plan PR, GRANDFATHERED and APPROVED
      pass, UNVERIFIED fails on the plan PR, and an advisory UNVERIFIED warns without a PASS line.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      Close the --pre selector over the new imports (validate_pre_glob_closure.uncovered_after_edges over the
      declared new_imports, critique r1): add scripts/roadmap/approved_text_provenance.py,
      scripts/roadmap/approved_text_github.py and scripts/roadmap/review_page.py to Entry validate_merge_step's
      pre_globs, and scripts/roadmap/review_page.py to Entries validate_admin_root_premerge_gate and
      validate_verification_registry (both reach approved_text through _implementation_merge).
      validate_plan_documents already globs scripts/roadmap/**.
  - file: .github/workflows/approved-text-approval.yml
    action: Create
    purpose: >-
      name approved-text-approval; run-name `approved-text ${{ inputs.slug }} ${{ inputs.fingerprint }} ${{
      inputs.digest }}`, so the push notification and the run list show the fingerprint; on: workflow_dispatch only,
      inputs slug, sha, digest and fingerprint (string, required); top-level permissions {}. Job render: if github.ref
      == 'refs/heads/main', permissions {contents: read}, no secrets, no id-token; checkout main, setup Python 3.12,
      pip install -r requirements-fast.txt, `git fetch origin "$SHA"`, `git show "$SHA:docs/plans/approved/$SLUG.yaml"`
      into $RUNNER_TEMP (data only; nothing from $SHA is executed, Decision 238 cl.3) and the bound files at main into
      a base directory, then `approved_text render ... --expect-approved "$DIGEST" --fingerprint "$FINGERPRINT"` into
      $GITHUB_STEP_SUMMARY (the page the operator reads and approves on); a refused input fails render, so approve
      never waits. Inputs reach shell only through env (never ${{ }} inside run:). Job approve: needs render,
      environment approved-text, permissions {}, one echo step. Job wake: needs approve, continue-on-error true,
      permissions {contents: read, pull-requests: write}; checkout main, setup Python 3.12, pip install -r
      requirements-fast.txt (validate_workflow_dependency_install), then approved_text_github wake with GITHUB_TOKEN.
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      pr-validate gains `actions: read` beside `contents: read`, and its `Validate fast tier` step gets env GH_TOKEN:
      ${{ github.token }} so the provenance lookup reads GitHub's record. No other job changes.
  - file: .github/workflows/deployment-approval-probe.yml
    action: Modify
    purpose: Header comment only -- the re-run triggers also re-decide the approved-text gate (the new Decision, by its filled number).
  - file: terraform/github/environments.tf
    action: Modify
    purpose: >-
      Add github_repository_environment.approved_text ("approved-text", reviewers.users =
      var.gated_apply_reviewer_user_ids, prevent_self_review false, can_admins_bypass false, custom_branch_policies
      true with protected_branches false, lifecycle prevent_destroy) and
      github_repository_environment_deployment_policy.approved_text_main (branch_pattern main), the tf_trusted_plan
      shape (rec-4651's explicit main-only policy). Header comment: the operator-only approval gate for approved
      text (the new Decision, by its filled number), never in any OIDC trust, never a job holding id-token or secrets.
  - file: terraform/github/imports.tf
    action: Modify
    purpose: >-
      One import block for the Environment (`${var.repository_name}:approved-text`, the deployment_approval_probe
      shape), so the UI-created Environment is adopted on the operator's next apply of this root; the main-only
      deployment policy is created by that apply (no import, so no policy id is needed).
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks git-ops-version, git-ops-log and git-ops-binding (operator-approved): a new
      amendment_log entry, contract_version bump and the approved_text_binding provenance text. NEAR_CAP (489 of 500
      effective lines on 2026-11-04; about +5 here, +2 from PR #1806): measure against main at build time. The
      contracts class relief (compact amendment history) changes words outside the sidecar, which
      approved_text.verify refuses, so if the blocks would cross 500 the build stops and reports to the coordinator,
      who asks the operator to approve a compaction block in an amended sidecar.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Exactly the sidecar block planning-step-8b (operator-approved; 313 bytes out, 313 in, so it cannot cross the
      zero-headroom prose budget); config/prose_budgets.yaml ratchets to the measured size. If a re-anchor ever makes
      the block grow, the build stops and reports, as for git-ops.yaml (the words are bound).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Exactly the sidecar blocks decision-new and decision-83-update (operator-approved), numbered at merge.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      structural_assumptions gains SA-05 (approved_text_github assumes GitHub's workflow-runs and run-approvals APIs,
      can_admins_bypass false standing in for a reviewer read, the run-name grammar, a remote named origin with a
      branch main, and this workflow's path), location scripts/roadmap/approved_text_github.py, status open,
      owning_item "T4.24:c9" (the SA-03 and SA-04 convention), plus an amendment_log row. change_surface's
      required_verbs stay as they are: its verbs are provisional and T4.19 c6 names them (Decision 212 cl.6).
  - file: docs/plans/approved/approved-text-operator-approval.yaml
    action: Create
    purpose: >-
      The approved-text sidecar binding every always-ask edit above word for word. It lands with this plan PR only;
      the build never touches it (validate_merge_step fails a sidecar the build adds or changes).
  - file: tests/test_approved_text_provenance.py
    action: Create
    purpose: >-
      rec-4769's acceptance. TestSidecarProvenance, over the history fixture: approved_digest is equal within each
      anchor-only pair (retire-strategic 44d7d83d and 40252d08; t2-47 a7fb3bc9~1 and a7fb3bc9) and differs for
      retire-strategic 4e62d4b3 to 44d7d83d (main's glossary sweep removed one word inside two replaced spans),
      glossary-sweep 390379a1 to 4b76d804 (a deletion target and a dropped block), and three synthetic edits of this
      plan's sidecar: a widened removal, a removed word kept by moving it into the anchor, and two blocks in one file
      swapping their additions. Grandfather true only at the pinned ref, same digest, plan undeclared; mode and
      is_failure per event (push skips, pull_request, merge_group and unset events enforce under GITHUB_ACTIONS,
      advisory locally).
  - file: tests/test_review_page.py
    action: Create
    purpose: >-
      Each render form on this plan's own sidecar blocks (git-ops-binding renders Was / Becomes, planning-step-8b
      renders Edited in place, decision-83-update renders New text) plus a synthetic pure deletion; location lines;
      placeholder display; escaping (a block whose words carry ** or <del> cannot restyle the page); fingerprint is
      four words, stable, and changes with the digest; `approved_text render` refuses a bad slug, a digest mismatch
      and a fingerprint that does not match the digest.
  - file: tests/test_approved_text_github.py
    action: Create
    purpose: >-
      Recorded-API oracle (Decision 212 cl.2, no credential): fixtures under tests/fixtures/approved_text_github/
      (runs list, approvals), each refusal path (wrong title, wrong path, branch not main, sha not on main, rejected
      approval, wrong environment, HTTP error, timeout, deadline) and the wake comment target; `check --digest`
      overrides the working-tree digest.
  - file: tests/test_approved_text_approval_workflow.py
    action: Create
    purpose: >-
      Static workflow and Terraform shape (the test_deployment_approval_probe_workflow.py pattern): dispatch-only,
      permissions per job, no secrets or id-token, the main-only guard, inputs only through env, environment name,
      render passes --expect-approved and --fingerprint, the wake job installs dependencies, run-name grammar equal to
      approved_text_github's parser, the Terraform resource attributes and the imports.tf block. In ci.yml, pr-validate holds `actions:
      read` and its Validate fast tier step sets GH_TOKEN, and no other job gains a permission.
  - file: tests/fixtures/approved_text_github/runs.json
    action: Create
    purpose: >-
      Runs-list response recorded from a real list_workflow_runs read (keys and nesting kept); user, actor and
      environment ids replaced by synthetic values and logins by `operator-fixture` (constraint 2).
  - file: tests/fixtures/approved_text_github/approvals.json
    action: Create
    purpose: >-
      Approvals response recorded from VP 6's real read of run 40115703173 (the shape critique r1 also read live),
      with the same synthetic ids and login.
  - file: tests/fixtures/approved_text/sidecar-history.yaml
    action: Create
    purpose: >-
      The real sidecar versions retire-strategic 4e62d4b3, 44d7d83d and 40252d08, t2-47 a7fb3bc9~1 and a7fb3bc9, and
      glossary-sweep 390379a1 and 4b76d804, copied verbatim with `git show`, never hand-written.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      One row `approved-text-approval: {tier: not_a_gate, ci_rca: excluded, owner: platform, rationale: "Operator-gated
      approval of approved-text wording (rec-4769); dispatched from main only, so waiting, rejected and cancelled runs
      are expected states, not failures."}`. NEAR_CAP (490 of 500 effective lines on 2026-11-04; eight unbuilt plans
      also add rows): measure against main at build time, and if the row would cross 500, compact multi-line
      not_a_gate rows into the one-line flow form (config class valve: compact resolved rows) until it fits; the
      compaction changes no key or value (yaml.safe_load of the file equals the old load plus the new row).
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: r3_workflows rows for the new workflow's inline run bodies (Decision 162).
bundled_recommendations: [rec-4769]
followon_recs: [rec-4905]
infrastructure_dependencies:
  - >-
    BEFORE the build PR's terraform-github plan runs: the operator creates the approved-text Environment in the GitHub UI
    (Settings, Environments, New environment "approved-text"): required reviewer benjamin-blake, prevent self-review
    off, allow administrators to bypass off, deployment branches left at "No restriction" (Terraform adds the main-only
    rule). Why the UI first, a deliberate exception to "a console-created resource is never a planning input": if a
    workflow job names an Environment that does not exist, GitHub creates it unprotected (environments.tf header), so
    the protected one must exist before the workflow can merge; Terraform then adopts it by import, the
    deployment_approval_probe precedent (rec-4695). Check: the build PR's terraform-github plan shows one import, the
    Environment's branch-policy update and one deployment-policy create, nothing else.
  - >-
    After merge, the operator's next hand apply of terraform/github adopts the one import and creates the main-only
    deployment policy; until then later terraform/github PR plans show them. Meanwhile the render job's main-only
    guard and the lookup's head_branch and path filters keep a branch dispatch from ever counting.
acceptance_criteria:
  - >-
    approved_digest is equal for the two anchor-only pairs in the history fixture (retire-strategic 44d7d83d and
    40252d08; t2-47's #1818) and differs for retire-strategic's #1815 (a removed word changed), glossary-sweep's #1807
    and the three synthetic edits (widened removal, removed word kept, swapped additions) (VP 1).
  - The GitHub adapter returns APPROVED only for a successful main-dispatched run of the approval workflow with the matching title and an approved entry for approved-text, and UNVERIFIED on any transport, deadline or git failure (VP 3).
  - validate_merge_step and validate_plan_documents fail a sidecar without approval in pull-request CI, pass an approved or grandfathered one, skip the lookup on main pushes, and never print PASS on an advisory UNVERIFIED (VP 4).
  - The run page shows the wording in plain-reading form (new text, edited in place, was/becomes, deleted) with location lines and a four-word fingerprint that also appears in the run name (VP 2, VP 11).
  - The workflow runs main's code only, reads the sidecar at the given commit as data, and waits on approved-text before succeeding (VP 5, VP 11).
  - The real approvals endpoint returns the shape the adapter parses (VP 6).
  - After rollout, an operator-approved run is read back as APPROVED, and an unapproved digest reads MISSING (VP 11-12).
  - Always-ask surfaces change exactly as the sidecar says (VP 8).
  - rec-4769 closes through the squash trailer (VP 14).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run rec-4769's acceptance (provenance core, approved digest on real history and the synthetic edits).
    command: bin/venv-python -m pytest tests/test_approved_text_provenance.py -q
    expected: exit 0; red before (module absent).
    fix_if: an anchor-only fixture pair differs, a word-change pair matches, or mode() enforces or skips on the wrong event
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: approved-text-provenance
  - step: 2
    phase: pre-deploy
    action: Run the review-page renderer tests.
    command: bin/venv-python -m pytest tests/test_review_page.py -q
    expected: exit 0; red before (module absent).
    fix_if: a block renders in the wrong form, or quoted wording can inject Markdown
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: approved-text-review-page
  - step: 3
    phase: pre-deploy
    action: Run the adapter against the recorded-API oracle.
    command: bin/venv-python -m pytest tests/test_approved_text_github.py -q
    expected: exit 0; red before (module absent).
    fix_if: any refusal path returns APPROVED, or a transport failure returns MISSING
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: approved-text-github-adapter
  - step: 4
    phase: pre-deploy
    action: Run the approved-text, merge-step and plan-document suites, with the two checks' new provenance nodes.
    command: bin/venv-python -m pytest tests/test_approved_text.py tests/checks/verification/test_validate_merge_step.py tests/checks/roadmap/test_validate_plan_documents.py tests/checks/roadmap/test_validate_plan_documents_sidecar_approval.py -q
    expected: exit 0
    fix_if: >-
      a node fails; a pre-existing node may change only by the APPROVED provenance stub its scope row names, never by
      a weakened assertion
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: These three suites already run in the fast and full tiers (each sits under its check's pre_globs), so a registry row would re-run the same nodes.
  - step: 5
    phase: pre-deploy
    action: Static workflow and Terraform shape.
    command: bin/venv-python -m pytest tests/test_approved_text_approval_workflow.py -q
    expected: exit 0; red before (workflow absent).
    fix_if: a job holds secrets or id-token, an input is interpolated inside run:, or the guard is missing
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: approved-text-approval-workflow-shape
  - step: 6
    phase: pre-deploy
    action: Read the real approvals record of an operator-approved gated run (read-only; the tf-gated-apply-prototype run of 2026-10-24).
    command: bin/venv-python -m scripts.roadmap.approved_text_github approvals --run-id 40115703173
    expected: one line with state approved, environment tf-gated-apply and login benjamin-blake; exit 0.
    fix_if: the endpoint shape differs from the fixture (update the fixture and parser from this read), or the read is refused (record UNPROVEN and the reason in the PR body; VP 11 then proves the shape live)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Live GitHub read of one historical run; VP 3 graduates the parsing hermetically against the fixture this read confirms.
  - step: 7
    phase: pre-deploy
    action: Terraform format, provider-free (Decision 119); validate and plan are CI's terraform-github checks.
    command: terraform fmt -check -diff terraform/github
    expected: exit 0
    fix_if: any diff
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Needs the terraform binary; CI's terraform-validate is the authority.
  - step: 8
    phase: pre-deploy
    action: Bind the always-ask edits to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug approved-text-operator-approval --base origin/main
    expected: exit 0
    fix_if: any word differs from the sidecar; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces it on the PR declaring this plan.
  - step: 9
    phase: pre-deploy
    action: Read the build PR's terraform-github plan result (CI).
    command: "mcp__github__pull_request_read(method=get_check_runs) on the build PR, then get_job_logs for the terraform-github plan job"
    expected: one import (approved_text), its in-place deployment_branch_policy update, one create (approved_text_main), no destroy and nothing else.
    fix_if: the plan proposes a create (the Environment was not made in the UI first) or any other change
    hermetic: false
    graduation: waive
    graduation_waiver_reason: CI-delegated provider plan on a live PR.
  - step: 10
    phase: pre-deploy
    action: Full tier on the committed tree.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0 for both
    fix_if: any failure
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      Live approval: run `bin/venv-python -m scripts.roadmap.approved_text record --slug
      approved-text-operator-approval` on main, dispatch the workflow for this plan's own slug, the operator approves
      on the run page, then read it back.
    command: >-
