  - file: .github/workflows/approved-text-approval.yml
    action: Create
    purpose: >-
      name approved-text-approval; run-name `approved-text ${{ inputs.slug }} ${{ inputs.fingerprint }} ${{
      inputs.digest }}`, so the push notification and the run list show the fingerprint; on: workflow_dispatch only,
      inputs slug, sha, digest and fingerprint (string, required); top-level permissions {}. Job render: if github.ref
      == 'refs/heads/main', permissions {contents: read}, no secrets, no id-token; checkout main with
      persist-credentials false (the repository is public, so the fetch below needs no credential), setup Python
      3.12, `pip install pyyaml==6.0.3 pydantic==2.14.2` (requirements.txt's pins; the page's code imports nothing
      else, so the job executes no other requirement file, critique r7 N5); a shell guard refuses a SHA that is not ^[0-9a-f]{40}$ and a SLUG that is
      not ^[a-z0-9-]+$ before any git call; `git fetch --depth=1 origin --end-of-options "$SHA"`, `git show --end-of-options
      "$SHA:docs/plans/approved/$SLUG.yaml"` into $RUNNER_TEMP (data only; nothing from $SHA is executed, Decision 238 cl.3), then, with the checked-out
      main workspace as --base-file-dir (no shell loop over sidecar-named files), `python -m
      scripts.roadmap.approved_words render ... --expect-approved "$DIGEST" --fingerprint "$FINGERPRINT"` into
      $GITHUB_STEP_SUMMARY (the page the operator reads and approves on); a refused input fails render, so approve
      never waits. Inputs reach shell only through env (never ${{ }} inside run:). Job approve: needs render,
      environment approved-text, permissions {}, one echo step. Job wake: needs approve, continue-on-error true,
      permissions {contents: read, pull-requests: write}; checkout main with persist-credentials false, setup Python
      3.12, the same pinned `pip install pyyaml==6.0.3 pydantic==2.14.2` (validate_workflow_dependency_install's
      `pip install <pkgs>` shape), then `python -m
      scripts.roadmap.approved_text_github wake` with env APPROVED_TEXT_GH_TOKEN: ${{ github.token }}. Every action is
      pinned by 40-hex SHA with its version comment, the pins ghas-probe.yml and terraform-plan-trusted.yml already
      use (actions/checkout 3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, actions/setup-python
      5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; the Decision 238 trusted pattern, critique r5 N4), since the
      render page is what the operator approves.
