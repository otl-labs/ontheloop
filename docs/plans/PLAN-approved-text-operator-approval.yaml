  - file: tests/test_approved_text_provenance.py
    action: Create
    purpose: >-
      rec-4769's acceptance. TestSidecarProvenance, over the history fixture: approved_digest is equal within each
      anchor-only pair (retire-strategic 44d7d83d and 40252d08; t2-47 a7fb3bc9~1 and a7fb3bc9) and differs for
