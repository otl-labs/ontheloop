schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: approved-text-verify-cli-landed
intent: >-
  rec-5471: the approved-text verify CLI (`python -m scripts.roadmap.approved_text verify`) accepts approved wording
  that already landed on main, the way validate_merge_step and premerge do since rec-5057, by calling the existing
  approved_text.verify_landed and printing one LANDED line per landed file. Merged plans whose hermetic VP steps call
  the CLI then replay green when a later PR declares them, so rec-5382 can declare persona-verdict-chain and
  persona-verdict-egress without editing their approved commands.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-approved-text-verify-cli-landed.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-5471
  (Low); rec-5382 depends on it. Closes no roadmap criterion.
cites: [dec:235, dec:246]
scope:
  - file: scripts/roadmap/approved_text.py
    action: Modify
    purpose: >-
      _cmd_verify calls verify_landed(sidecar, args.slug, args.root, base) instead of verify(sidecar, args.root, base),
      prints `APPROVED-TEXT LANDED <file> <full sha>` for each landed file (in the returned dict's order) before the
      existing MISMATCH lines, and keeps everything else as is: the ERROR and SIDECAR refusals run first and unchanged,
      the --expect digest check, the `APPROVED-TEXT OK <digest>` line and the exit codes 0, 1 and 2. The module
      docstring's verify CLI line says landed words pass. verify, verify_landed and every other function keep their
      names, signatures, return shapes and behaviour (rebase_resolve and plan_wording_check call verify; the rec-5470
      plan calls verify_landed).
    new_imports: []
  - file: tests/roadmap/test_approved_text_verify_landed_cli.py
    action: Create
    purpose: >-
      rec-5471's acceptance file. Fixture repos built with tests/fixtures/merge_step_repos plus local helpers written in
      this file (a plan with a scope list, _commit, a _landed_repo-style builder; merge_step_repos.plan_text writes no
      scope and is not edited; no import from another test module), each node driving approved_text.main(["verify", ...]) and reading stdout. Nodes: (a)
      test_landed_words_pass_with_a_landed_line (rec-5471's acceptance node, by that exact name): words landed in an
      earlier first-parent commit C and the tree leaves the bound file unchanged: exit 0, the LANDED line names C's full
      sha, then APPROVED-TEXT OK (red before the change: MISMATCH, exit 1); (b) tree applies the words now (normal
      build): exit 0 and no LANDED line; (c) words never landed and the tree leaves the file unchanged: exit 1,
      MISMATCH naming no landing commit; (d) words landed but the tree edits the bound file again: exit 1, strict
      MISMATCH, no LANDED line; (e) two qualifying commits: exit 1, competing landing commits; (f) landed tree with a
      wrong --expect digest: the LANDED line prints, then the digest MISMATCH, exit 1; (g) landed tree with the sidecar changed in the tree: exit 1, SIDECAR changed,
      no LANDED line; (h) a two-file sidecar with one file landed earlier and the other applied in the tree: exit 0,
      one LANDED line for the landed file only.
  - file: tests/test_approved_text.py
    action: Modify
    purpose: >-
      Add one node, test_cli_verify_prints_landed, using the file's existing _landed_repo, _apply and _commit helpers:
      the CLI exits 0 and prints the LANDED line for a landed file. It keeps approved_text.py at 100% coverage from its
      mapped test file (map_source_to_test resolves scripts/roadmap/approved_text.py to this file). No existing node
      is edited.
bundled_recommendations: [rec-5471]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    `bin/venv-python -m scripts.roadmap.approved_text verify --slug S --base REF` exits 0 when every bound file either
    carries the approved result over REF or passes verify_landed, and prints one APPROVED-TEXT LANDED line naming the
    landing commit for each landed file.
  - >-
    Every refusal the CLI had stays: never-landed words, a re-edited bound file, competing landing commits, a sidecar
    added, changed or deleted in the tree, a wrong --expect digest and a missing or broken sidecar all exit non-zero.
  - >-
    The stored commands of persona-verdict-chain (VP 5) and persona-verdict-egress (VP 2) exit 0 on the build head
    rebased on origin/main, and a scratch commit that only declares either plan passes validate_vp_replay (or VP 5
    prints SKIP for a plan rec-5382 has already declared).
  - No existing test node is edited or removed; verify and verify_landed are unchanged.
  - >-
    Decision 235 cl.1 confirmation (operator, 2026-11-20 22:04 UTC, in the planning thread with "write the plan"): the verify CLI
    accepts landed words for every caller, including the stored VP steps of merged plans, superseding
    PLAN-approved-text-landed-words' criterion that the CLI still calls verify. The approval record, the SIDECAR
    refusals and the --expect digest are unchanged (Decision 246), and refusals stay pinned for never-landed words, a
    re-edited bound file, competing landing commits, a changed sidecar and a wrong digest.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5471 acceptance nodes for the CLI.
    command: bin/venv-python -m pytest tests/roadmap/test_approved_text_verify_landed_cli.py -q
    expected: >-
      exit 0, every node passes. Before the change node (a) and node (h) fail (MISMATCH, exit 1) and the file does not
      exist at the plan PR (target absent).
    fix_if: Fix _cmd_verify; never relax a refusal node or edit verify_landed.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: approved-text-verify-cli-landed
  - step: 2
    phase: pre-deploy
    action: Existing approved-text tests plus the new landed CLI node.
    command: bin/venv-python -m pytest tests/test_approved_text.py -q
    expected: exit 0; test_cli_verify_prints_landed fails before the change; every existing node passes unedited.
    fix_if: A changed existing assertion is a weakening; fix the code.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: Covered by the existing whole-file shard approved-text-tests (tests/test_approved_text.py).
  - step: 3
    phase: pre-deploy
    action: Per-file coverage of approved_text.py from its mapped test file.
    command: >-
      bin/venv-python -m pytest -q tests/test_approved_text.py --cov=scripts.roadmap.approved_text
      --cov-report=term-missing --cov-fail-under=100 -o addopts=""
    expected: >-
      exit 0, approved_text.py 100%. Measured on the planning prototype (origin/main 745ef91a plus the change): 99%,
      only the LANDED print line missed without the new node, hence step 2's node.
    fix_if: >-
      Add the missing branch to tests/test_approved_text.py; never a config/coverage_baseline.yaml entry. Not hermetic:
      a coverage run under replay repeats VP 2's tests at higher cost for no new assertion.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim (Decision 244 cl.4): a whole-file coverage ratio that unrelated later edits can move; the full
      tier's per-file coverage gate and the approved-text-tests shard guard it standing.
  - step: 4
    phase: pre-deploy
    action: The two blocked plans' stored CLI commands on real history, in a detached worktree of the build head, run after rebasing on origin/main.
    command: >-
      bash -c 'set -e; T=$(mktemp -d); trap "git worktree remove --force $T" EXIT; git worktree add -q --detach "$T"
      HEAD; ln -s "$PWD/.venv" "$T/.venv"; cd "$T";
      for s in persona-verdict-chain persona-verdict-egress; do bin/venv-python -m scripts.roadmap.approved_text verify
      --slug "$s" --base origin/main; done'
    expected: >-
      exit 0. Chain prints LANDED for docs/ROADMAP-PLATFORM.yaml and tests/roadmap/test_verdict_persona_criteria.py at
      4aecbb44 and APPROVED-TEXT OK; egress prints LANDED for docs/ROADMAP-PLATFORM.yaml, docs/DECISIONS.md and
      docs/contracts/ports.yaml at b12809af and APPROVED-TEXT OK (measured on the planning prototype at 745ef91a and re-measured by critique round 2 at 94ab6eec; the build records its own base).
    fix_if: >-
      A MISMATCH here means the CLI is not calling verify_landed or the worktree's docs differ from origin/main; fix
      the code or the run, never the plans or their sidecars.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim (Decision 244 cl.4): reads the current state of main and whether two other plans are declared;
      VP 1's fixture nodes guard the behaviour standing.
  - step: 5
    phase: pre-deploy
    action: End-to-end late closure, a scratch commit that only declares each plan, replayed by validate_vp_replay.
    command: >-
      bash -c 'set -e; for s in persona-verdict-chain persona-verdict-egress; do P="docs/plans/PLAN-$s.yaml";
      if git show "origin/main:$P" | grep -q "^implementation_declared: true"; then echo "SKIP $s already declared";
      continue; fi; T=$(mktemp -d); trap "git worktree remove --force $T" EXIT; git worktree add -q --detach "$T" HEAD;
      ln -s "$PWD/.venv" "$T/.venv"; printf "implementation_declared: true\n" >> "$T/$P";
      git -C "$T" -c user.name=vp -c user.email=vp@example.invalid commit -q --no-verify -am "declare $s";
      (cd "$T" && bin/venv-python -c "import sys; from pathlib import Path; from scripts.checks.verification.validate_vp_replay import validate_vp_replay as v; f=[]; v(f, changed_files=[sys.argv[1]], root=Path(\".\")); print(\"FAILED:\", f); sys.exit(1 if f else 0)" "$P");
      git worktree remove --force "$T"; trap - EXIT; done'
    expected: >-
      exit 0. Each run prints PASS for the approved_text verify step (chain step 5, egress step 2) and FAILED: [].
      Prototype on 745ef91a: chain 6 hermetic steps clean in 26 s, egress 3 in 3 s (re-measured clean at 94ab6eec; the build records its own base). A plan rec-5382 has already
      declared prints SKIP and is recorded as such.
    fix_if: >-
      A failing approved_text verify step is this plan's defect; a failing step of another kind is out of scope and
      becomes a rec for rec-5382's owner, never an edit to those plans here.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim (Decision 244 cl.4): reads the current state of main and whether two other plans are declared;
      VP 1's fixture nodes guard the behaviour standing.
  - step: 6
    phase: pre-deploy
    action: Full tier on the committed, rebased tree before handoff (git-ops.yaml handoff_sequence).
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The full tier completes and validation_result --verify-head attests HEAD's tree with exit 0. Start it
      backgrounded with a 2 h limit from the top-level session; tests/test_aws_profile.py needs HOME set to an empty
      directory.
    fix_if: Fix the failing check on the branch; never skip, disable or quarantine a test.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: rec-5471 closed by the merge trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c;
      print(c.fetch_recs_by_ids(c.make_reader(), ['rec-5471'])[0][0]['status'])"
    expected: closed (trailer-closure job on the merge commit).
    fix_if: Follow git-ops.yaml resolves_trailer (readback, then recover); never a manual close after an acceptance refusal.
    hermetic: false
  - step: 8
    phase: pre-deploy
    action: every top-level statement except the module docstring and _cmd_verify is unchanged against origin/main (acceptance_criteria[3]); run before merge.
    command: >-
      bin/venv-python -c "import ast, subprocess; old = subprocess.run(['git', 'show',
      'origin/main:scripts/roadmap/approved_text.py'], capture_output=True, text=True, check=True).stdout; new =
      open('scripts/roadmap/approved_text.py', encoding='utf-8').read(); body = lambda src: [(getattr(n, 'name', None),
      ast.dump(n)) for n in ast.parse(src).body[1:] if getattr(n, 'name', None) != '_cmd_verify']; a, b = body(old),
      body(new); bad = sorted({str(x[0]) for x in set(a) ^ set(b)}) or (['order'] if a != b else []); print('CHANGED',
      bad if bad else 'none'); raise SystemExit(1 if bad else 0)"
    expected: exit 0 and CHANGED none.
    fix_if: Restore the named function; only _cmd_verify and the module docstring may change.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim (Decision 244 cl.4): compares against origin/main, which this plan's own merge moves; VP 2's
      unedited existing nodes guard verify's behaviour standing.
test_obligations:
  - source: scripts/roadmap/approved_text.py
    behavior: the verify CLI passes landed words with a LANDED line and keeps every refusal
    verification_step: 1
    test_selector: tests/roadmap/test_approved_text_verify_landed_cli.py
    red_green_expectation: red before (file absent, then MISMATCH exit 1 for a landed tree), green after
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - Only _cmd_verify and the module docstring change in approved_text.py; verify and verify_landed stay byte-for-byte.
  - Do not edit any merged plan, sidecar, docs/contracts/git-ops.yaml or scripts/checks/verification/validate_vp_replay.py.
  - No existing test node is edited or removed.
  - Keep `APPROVED-TEXT OK <digest>` byte-stable; merged plans' expected text reads it.
