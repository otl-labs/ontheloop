pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decisions 235 and 246 read (only those sections)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-approved-text-verify-cli-landed.yaml; on blocked, stop and report."
  - tests/roadmap/test_approved_text_verify_landed_cli.py -- write the nodes per its scope row and see (a) and (h) fail.
  - scripts/roadmap/approved_text.py -- change _cmd_verify and the docstring per its scope row; VP 1.
  - tests/test_approved_text.py -- add test_cli_verify_prints_landed; VP 2, VP 3.
  - VP 4, VP 5 and VP 8 (real history, worktrees of the rebased build head); record their output, the origin/main SHA measured on and pr-validate's measured selection time in the PR body.
  - "Graduate VP 1 into config/agent/verification_registry/entries/approved-text-verify-cli-landed.yaml."
  - "CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true; commit; git fetch origin main && git rebase origin/main; re-run red_overlap (stop on blocked); bin/venv-python -m scripts.validate --pre; VP 4, VP 5 and VP 8; VP 6 (full tier backgrounded from the top-level session, then --verify-head; a timeout or incomplete run is BLOCKED, no push); push; open the PR; subscribe; code review in a fresh context; merge on green under standing authorisation with merge_pull_request(merge_method=squash), an explicit commit_message carrying 'Resolves: rec-5471' and expectedHeadSha; merge_step premerge before and readback after."
  - "Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state (bin/venv-python -m scripts.session.github_readiness; unknown is not PASS); parent validator evidence (VP 6 plus --verify-head for the pushed HEAD); structured postflight evidence (bin/venv-python -m scripts.session.postflight --evidence); the real outcome -- push, build PR number, pr-validate run id, CI green by event-driven wake, merge SHA."
  - "Report: what was implemented, verification results, merge SHA, each closure fact separately; VP 7 after the merge commit's trailer jobs conclude; tell the coordinator rec-5382's chain and egress closures can go."
rollback: >-
  Revert the build PR: the CLI is strict again and late closure of chain and egress fails as before; no other caller
  changes.
