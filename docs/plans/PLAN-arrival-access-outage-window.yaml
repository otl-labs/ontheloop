  - "Open PRs created inside the window (#2016, #2017, #2018, #2019, #2021, #2023) are judged lost_window if their sessions were not captured when they merge; posted on the coordinator log (#1963) 2026-11-14 14:40Z and 14:42Z."
  - "Precedents: PLAN-plugin-hooks-locate-checkout (rec-5055 lost window row and node), PLAN-arrival-reopened-outage-session (rec-5081 plan shape, acceptance swap), PLAN-arrival-lost-window-author-date (rec-5084)."
  - "Graduated shards kept unchanged (tests/telemetry_verify/test_session_presence.py gains one node, the claims hold): arrival-config-excuses-rec-5004-key, arrival-config-excuses-reopened-rec-5055-session, arrival-config-records-rec-5055-lost-window, telemetry-arrival-oracle."
  - "red_overlap --plan on the draft: verdict clear, rec-5144 rule repairs_this_red (track product_regression, age 21.95 h)."
  - "rec-5144 at plan write: open, Critical; context_v2 why_chain, corrective_action and preventive_action corrected via correct_rec_context and read back 2026-11-14 (the filed failure_category code_regression is not the cause). Acceptance swapped with the operator's approval (read back 2026-11-15T10:11:49Z): from the live probe (needs warehouse credentials the closure job lacks, and passes on skipped) to bin/venv-python -m pytest \"tests/telemetry_verify/test_session_presence.py::test_the_shipped_config_records_the_rec_5144_lost_window\" -q, with closure_artifact shard:arrival-config-records-rec-5144-lost-window stamped in context_v2_json; VP 5 reads both back again before the squash. The live end state stays proven by VP 4 and 7."
