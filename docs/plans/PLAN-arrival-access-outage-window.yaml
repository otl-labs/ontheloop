pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decisions 186, 226, 235, 246 and 250 sections read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Config: add the lost_windows row; the session_presence node; run VP 1 and 2."
  - "Add the graduated shard config/agent/verification_registry/entries/arrival-config-records-rec-5144-lost-window.yaml (VP 1's graduation, same shape as arrival-config-records-rec-5055-lost-window.yaml)."
  - "CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true; commit with Resolves: rec-5144 in the message; git fetch origin main && git rebase origin/main; VP 3; VP 4; VP 5; VP 6 (full tier backgrounded from the top-level session, then --verify-head; a timeout is BLOCKED, no push); push; open the PR (its body states the row's weakening disposition, planned-change citing acceptance_criteria[0], a denominator correction for a declared outage, and names rec-5144 as the authorising rec); subscribe; code review in a fresh context; squash-merge on green with Resolves: rec-5144 in the squash body; VP 7 and 8."
  - "Report: what was implemented, verification results"
rollback: Revert the build PR; arrival turns red again on the five shas until they leave the judge window (f43a1624 last, 2026-11-17T10:32Z).
