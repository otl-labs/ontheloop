schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: arrival-excused-session-rec-5194
intent: >-
  Clear the Critical telemetry-arrival red rec-5194 (squash dcc6a9f5, PR #2045) by excusing the one session key it
  names, which has no telemetry row in any session read, so the arrival oracle's denominator counts only sessions with
  a captured row. The excuse only clears the red; the cause (hooks not run, or a capture request that failed) is
  rec-5204's. No backfill and no oracle code change.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-arrival-excused-session-rec-5194.yaml
phase: >-
  ci_rca (soft-warn exception category): Track B repair of rec-5194 under docs/contracts/red-main-recovery.yaml
  (Decision 226). No tier_item is targeted and no exit criterion is closed, so closes_criteria is empty.
closes_criteria: []
scope:
  - file: config/telemetry/arrival.yaml
    action: Modify
    purpose: >-
      excused_sessions gains `- {key: 01XZubGyV1F33wmhDdqDwNYT, owner: rec-5194}` after the rec-5055 row, in the same
      flow-mapping shape, word for word as docs/plans/approved/arrival-excused-session-rec-5194.yaml binds it. Nothing
      else in the file changes. Evidence (/mnt/project-files/arrival-fix/DIAG-dcc6a9f5.md): PR #2045 was created
      2026-11-14T22:53:09Z and its commits authored 22:52:36Z and 2026-11-15T00:34:20Z, after the rec-5144 window's end
      (2026-11-14T12:24:48Z), so no lost window covers it; the key is absent from telemetry_root_sessions,
      sessions_window and sessions_window_all_purposes for 2026-11-13..16.
    new_imports: []
  - file: tests/telemetry_verify/test_session_presence.py
    action: Modify
    purpose: >-
      New node test_the_shipped_config_excuses_the_rec_5194_session after the reopened-rec-5055 node and in its shape:
      load_config(ROOT) passes check_config; with the shipped config a lone uncaptured commit carrying key
      01XZubGyV1F33wmhDdqDwNYT whose PR was created at 2026-11-14T22:53:09Z is excused=1 missing=0 lost_window=0 and not
      red, its excused row's owner is rec-5194, and pr_lookups=0. Negative control in the same node: the shipped config
      minus this one row, same commit and PR time, is missing=1 lost_window=0 excused=0, so the row alone greens it.
      Existing nodes byte-identical.
    new_imports: []
  - file: config/agent/verification_registry/entries/arrival-config-excuses-rec-5194-session.yaml
    action: Create
    purpose: Graduated shard for VP 1, same shape as arrival-config-excuses-reopened-rec-5055-session.yaml.
    new_imports: []
  - file: docs/plans/approved/arrival-excused-session-rec-5194.yaml
    action: Create
    purpose: Approved-text sidecar binding the one excused_sessions row (Decision 246).
    new_imports: []
bundled_recommendations: [rec-5194]
followon_recs: [rec-5204, rec-5176]
infrastructure_dependencies: []
acceptance_criteria:
  - "config/telemetry/arrival.yaml excuses 01XZubGyV1F33wmhDdqDwNYT owned by rec-5194, and the shipped config turns a lone uncaptured commit with that key into excused=1 missing=0."
  - "After the merge, telemetry-arrival on main no longer lists sha dcc6a9f5a2a9 in ARRIVAL_MISSING and reads excused at least 1 while dcc6a9f5 is inside judge_days, and rec-5194 is closed by the squash's Resolves trailer."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The shipped config excuses the rec-5194 session.
    command: bin/venv-python -m pytest "tests/telemetry_verify/test_session_presence.py::test_the_shipped_config_excuses_the_rec_5194_session" -q
    expected: exit 0; red before (node absent, and with the node but no config row, missing=1).
    fix_if: excused stays 0 (key typo, or the owner pattern refused by check_config)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: arrival-config-excuses-rec-5194-session
  - step: 2
    phase: pre-deploy
    action: The whole oracle suite still passes (no existing node edited).
    command: bin/venv-python -m pytest tests/telemetry_verify/test_session_presence.py -q
    expected: exit 0
    fix_if: an existing node fails; the edit touched more than the one row and the one node
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the file's already-graduated nodes and the full tier's run of the whole file; step 1 graduates the new
      node.
  - step: 3
    phase: pre-deploy
    action: Bind the config edit to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug arrival-excused-session-rec-5194 --base origin/main
    expected: exit 0; the one block matches word for word
    fix_if: any word differs; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar
      on every PR declaring this plan.
  - step: 4
    phase: pre-deploy
    action: On the build branch, the arrival check against the live warehouse with the new row.
    command: AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_verify arrival
    expected: >-
      the ARRIVAL line reads status=green (or skipped) with missing=0 and excused at least 1; record the line in the PR
      body.
    fix_if: >-
      status=unreadable is a reader or config problem (fix, re-run); a missing sha other than dcc6a9f5a2a9 is a new
      red: stop and report to the coordinator (ci-rca files it), never excuse it here
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and step 1 carries the durable regression.
  - step: 6
    phase: post-deploy
    action: The arrival oracle is no longer red on main.
    command: AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_verify arrival
    expected: >-
      no ARRIVAL_MISSING line names dcc6a9f5a2a9 and the ARRIVAL line reads excused at least 1 while dcc6a9f5 is inside
      judge_days (3 days from 2026-11-15T09:56Z), with missing=0 unless another sha is missing; also record the next
      telemetry-arrival workflow run id on main and its status (a workflow_dispatch run on main counts when the
      scheduled run is late).
    fix_if: "missing>0 on another sha is a new red: read the PR's creation time and the key's commit author dates against the windows before suspecting capture; ci-rca files it"
    hermetic: false
  - step: 7
    phase: post-deploy
    action: rec-5194 is closed by the merge's Resolves trailer, its closure_artifact shard resolving once the graduated shard is on main.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5194']); print(rows[0]['id'], rows[0]['status'])"
    expected: prints rec-5194 closed after the closure job runs on the merge commit; record that run id.
    fix_if: >-
      still open: read the closure job's log for a ClosureArtifactRequired or acceptance refusal marker. Leading causes:
      the squash body lacks Resolves for rec-5194, or the graduated shard is not on main. Never close it with a direct
      status write after a Decision 186 refusal; fix the cause and re-run the closure route.
    hermetic: false
test_obligations:
  - source: config/telemetry/arrival.yaml
    behavior: the rec-5194 session key is excused, owner-bound
    verification_step: 1
    test_selector: tests/telemetry_verify/test_session_presence.py::test_the_shipped_config_excuses_the_rec_5194_session
    red_green_expectation: red before (missing=1), green after
constraints:
  - "The arrival oracle's code and its missing semantics are unchanged (Decision 250 cl.5): scripts/telemetry_verify/** is not in scope."
  - "The excuse is one key, not a window: other sessions of the same family stay judged, and rec-5204 owns the cause."
  - "The excused_sessions row lands word for word as the approved-text sidecar binds it (Decision 246); rec-5194's replacement acceptance is operator-confirmed with the plan (Decisions 181, 235). A change to either is a plan amendment that goes to the operator first."
  - "No existing assertion is loosened beyond the one owner-bound excuse row (Decision 235); no existing test node is edited."
  - "No rescue agents or workaround loops (Decision 55)."
context:
  - "Decision-scout verdict FLAGS_FOUND (round 1). CITE: 250 (cl.5 the oracle left unchanged; cl.4 arrival gates no merge), 226 (Track B, 4 h SLO), 186 (cl.4 the shard lands in the Resolves commit), 201 (acceptance must classify holds), 181 and 235 (the row and the acceptance swap are operator-confirmed weakening candidates, disposition planned-change citing acceptance_criteria[0]), 244 (the shard is a standing guard), 246 (the row is bound by the sidecar and its approval run). CONTRADICT: none. SPIRIT NOTE 250 (silencing before the cause is known): adopted, the excuse is per-key and owner-bound and rec-5204 (open, read back 2026-11-16) carries the cause, with rec-5176 the alarm. SPIRIT NOTE 244 (time-bounded excuse pinned by a standing shard): adopted, the row and its shard retire together once dcc6a9f5 is out of judge_days (entries/deprecated/, Decision 235 cl.1 human approval). RELATED: 200, 228, 236, 62, 55, 247. Decisions triaged: 210 of 210. Roadmap items intersected: 1; CONFLICT: 0; RELATED: 1. Serves: NS.6 2/5 -- restores a trustworthy arrival oracle with an owner-bound, test-bound exception; it does not itself advance a measured improvement."
  - "Red: telemetry-arrival on main since 2026-11-15T11:27Z, status=red missing=1 ARRIVAL_MISSING sha=dcc6a9f5a2a9 (runs 43708987721 .. 43831710411 all show this sha; sampled two). rec-5194 (ci_rca, Critical, filed 2026-11-15T11:26:55Z) is past its 4 h SLO, so red_overlap rule 1 may block unrelated plans until it closes."
  - "Evidence and limits: /mnt/project-files/arrival-fix/DIAG-dcc6a9f5.md. The operator says the session had network access (2026-11-16); the cause is hooks not run or a capture request that failed, not separable with agent access (API gateway log AccessDenied, no session key in writer logs). rec-5204 carries it; rec-5176 is the alarm."
  - "Approvals: the operator asked to proceed on this thread 2026-11-16T12:25Z, then wrote 'approved, please proceed' 2026-11-16T13:21:59Z in reply to the request naming both the approval run and the rec-5194 acceptance swap, approving the plan and the swap (Decisions 181, 235). The row's wording is bound by the sidecar and approved on GitHub through approved-text run 43867535797 (dispatched on main at 4a487c7b, sidecar commit f35f0898; approved_text record: record digest bd591633, approved-words digest 21aba21d, fingerprint chalk-star-shell-candle); validate_merge_step reads that approval; the run concluded success (approve job passed) by 2026-11-16T13:22Z; the plan PR merges when gates pass (2026-11-12 plan-merge ruling)."
  - "rec-5194 at plan write (update_rec read back 2026-11-16T13:22:11Z): status open; acceptance replaced with bin/venv-python -m pytest \"tests/telemetry_verify/test_session_presence.py::test_the_shipped_config_excuses_the_rec_5194_session\" -q (the portal's acceptance lint accepted it), because the filed live probe needs warehouse credentials the closure job lacks; closure_artifact shard:arrival-config-excuses-rec-5194-session stamped in context_v2_json. The live end state stays proven by VP 4 and 6."
  - "Graduated shards kept unchanged (tests/telemetry_verify/test_session_presence.py gains one node, the claims hold): telemetry-arrival-oracle, arrival-config-excuses-rec-5004-key, arrival-config-excuses-reopened-rec-5055-session, arrival-config-records-rec-5055-lost-window, arrival-config-records-rec-5144-lost-window."
  - "fork: owner of the excused row | chosen: rec-5194, the rec the red is filed under | class: consistency-only | precedent: Decision 250 | precedent_kind: decision | reversible: yes | persisted: config/telemetry/arrival.yaml"
  - "fork: rec-5194 acceptance | chosen: the junit-routed pytest node of VP 1, live probe kept as VP 4 and 6 | class: asked | precedent: Decision 181; Decision 186; Decision 235 | precedent_kind: decision | reversible: yes | persisted: rec-5194 acceptance and closure_artifact (warehouse)"
  - "Decision 250 reversal counts at plan write: halt-cost, rec-5194 red since 2026-11-15T11:27Z (over 24 h) and rec-5144 before it, so two halts this quarter, possibly meeting the 'twice in a quarter' condition (passed to the coordinator, the operator's 2026-11-15 ruling not to revisit cl.4 stands); false-reds, rec-5194's data is genuinely missing, so it does not count."
  - "Retirement: the row and its shard retire together once dcc6a9f5 is out of judge_days, owned by rec-5204's closure (Decision 235 cl.1 human approval)."
  - "fork: repair shape | chosen: one per-key excuse now, cause under rec-5204 | class: consistency-only | precedent: Decision 247 | precedent_kind: decision | reversible: yes | persisted: followon_recs"
