  - "Add the graduated shard config/agent/verification_registry/entries/arrival-config-excuses-rec-5194-session.yaml (VP 1's graduation)."
  - "CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): commit with Resolves: rec-5194 in the message; git fetch origin main && git rebase origin/main; VP 3; VP 4; VP 5 (full tier backgrounded from the top-level session, then --verify-head; a timeout is BLOCKED, no push); push; open the PR (its body states the excuse row's weakening disposition, planned-change citing acceptance_criteria[0], a per-key denominator correction, and names rec-5194 as the authorising rec); subscribe; code review in a fresh context; merge on code review PROCEED and green CI with Resolves: rec-5194 in the squash body; then VP 6 and 7, reporting PR number, run ids, merge SHA, and that rec-5194's 4 h SLO was breached (filed 2026-11-15T11:26:55Z, SLO 15:26:55Z) with the merge time read back. If the merge lands after dcc6a9f5 leaves judge_days (about 2026-11-18T09:56Z), VP 6's substitute evidence is no ARRIVAL_MISSING line for dcc6a9f5 plus VP 1 green on main."
  - "Report: what was implemented, verification results"
rollback: Revert the build PR; arrival turns red again on dcc6a9f5 until it leaves the judge window (3 days after 2026-11-15T09:56Z).
