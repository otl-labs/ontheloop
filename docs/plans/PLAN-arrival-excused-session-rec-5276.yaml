schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: arrival-excused-session-rec-5276
intent: >-
  Clear the Critical telemetry-arrival red rec-5276 (squash 07cb0d3b, PR #2041) by excusing the one session key it
  names, a session created inside the rec-5144 access-outage window that never wrote a telemetry row, so the arrival
  oracle's denominator counts only sessions that could have been captured. No backfill and no oracle code change.
plan_type: IMPLEMENTATION
implementation_declared: false
verification_tier: V2
plan_path: docs/plans/PLAN-arrival-excused-session-rec-5276.yaml
phase: >-
  ci_rca (soft-warn exception category): Track B repair of rec-5276 under docs/contracts/red-main-recovery.yaml
  (Decision 226). No tier_item is targeted and no exit criterion is closed, so closes_criteria is empty.
closes_criteria: []
cites: [dec:181, dec:186, dec:201, dec:226, dec:235, dec:244, dec:246, dec:250]
scope:
  - file: config/telemetry/arrival.yaml
    action: Modify
    purpose: >-
      excused_sessions gains `- {key: 01G2j5RhJHzfcowduXUtmir5, owner: rec-5276}  # pragma: allowlist secret` after the rec-5194 row (the pinned detect-secrets hook reads the key as high entropy), in the same
      flow-mapping shape, word for word as docs/plans/approved/arrival-excused-session-rec-5276.yaml binds it. Nothing
      else in the file changes. Evidence: the session was created 2026-11-13T17:45:28Z, inside the rec-5144 window
      (2026-11-12T20:54:23Z to 2026-11-14T12:24:48Z), and its key is absent from telemetry_root_sessions for
      2026-11-10..17. PR #2041 was created 2026-11-14T14:28:28Z and its one commit authored 13:33:05Z, both after
      the window's end, so neither the window nor the rec-5084 author-date rule covers it.
    new_imports: []
  - file: tests/telemetry_verify/test_session_presence.py
    action: Modify
    purpose: >-
      New node test_the_shipped_config_excuses_the_07cb0d3b_session after the rec-5194 node and in its shape:
      load_config(ROOT) passes check_config; with the shipped config a lone uncaptured commit carrying key
      01G2j5RhJHzfcowduXUtmir5 whose PR was created at 2026-11-14T14:28:28Z is excused=1 missing=0 lost_window=0 and
      not red, its excused row's owner is rec-5276, and pr_lookups=0. Negative control in the same node: the shipped
      config minus this one row, same commit and PR time, is missing=1 lost_window=0 excused=0, so the row alone
      greens it. Existing nodes byte-identical.
    new_imports: []
bundled_recommendations: [rec-5276]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "config/telemetry/arrival.yaml excuses 01G2j5RhJHzfcowduXUtmir5 owned by rec-5276, and the shipped config turns a lone uncaptured commit with that key into excused=1 missing=0."
  - "After the merge, telemetry-arrival on main no longer lists sha 07cb0d3bcc6e in ARRIVAL_MISSING, and rec-5276 is closed by the squash's Resolves trailer."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The shipped config excuses the rec-5276 session.
    command: bin/venv-python -m pytest "tests/telemetry_verify/test_session_presence.py::test_the_shipped_config_excuses_the_07cb0d3b_session" -q
    expected: exit 0; red before (node absent, and with the node but no config row, missing=1).
    fix_if: excused stays 0 (key typo, or the owner pattern refused by check_config)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: arrival-config-excuses-07cb0d3b-session
  - step: 2
    phase: pre-deploy
    action: The whole oracle suite still passes (no existing node edited).
    command: bin/venv-python -m pytest tests/telemetry_verify/test_session_presence.py -q
    expected: exit 0
    fix_if: an existing node fails; the edit touched more than the one row and the one node
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the file's already-graduated nodes and the full tier's run of the whole file; step 1 graduates the new
      node.
  - step: 3
    phase: pre-deploy
    action: Bind the config edit to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug arrival-excused-session-rec-5276 --base origin/main
    expected: exit 0; the one block matches word for word
    fix_if: any word differs; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar
      on every PR declaring this plan.
  - step: 4
    phase: pre-deploy
    action: On the build branch, the arrival check against the live warehouse with the new row.
    command: AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_verify arrival
    expected: >-
      no ARRIVAL_MISSING line names 07cb0d3bcc6e; while 07cb0d3b is inside judge_days the ARRIVAL line reads excused at
      least 1; record the line in the PR body. A status=unreadable ReadDeadlineExceededError is rec-5248's open red:
      re-run once, and record it if it persists.
    fix_if: >-
      a missing sha other than 07cb0d3bcc6e is a new red: stop and report to the coordinator (ci-rca files it), never
      excuse it here
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and step 1 carries the durable regression.
  - step: 6
    phase: post-deploy
    action: The arrival oracle no longer names 07cb0d3b on main.
    command: AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_verify arrival
    expected: >-
      no ARRIVAL_MISSING line names 07cb0d3bcc6e, and while 07cb0d3b is inside judge_days (until about
      2026-11-18T10:29Z) the ARRIVAL line reads excused at least 1; also record the next telemetry-arrival workflow run
      id on main and its status. After that time the substitute evidence is no ARRIVAL_MISSING line for 07cb0d3bcc6e
      plus VP 1 green on main.
    fix_if: "missing>0 on another sha is a new red: read the PR's creation time and the key's commit author dates against the windows before suspecting capture; ci-rca files it"
    hermetic: false
  - step: 7
    phase: post-deploy
    action: rec-5276 is closed by the merge's Resolves trailer, its closure_artifact shard resolving once the graduated shard is on main.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5276']); print(rows[0]['id'], rows[0]['status'])"
    expected: prints rec-5276 closed after the closure job runs on the merge commit; record that run id.
    fix_if: >-
      still open: read the closure job's log for a ClosureArtifactRequired or acceptance refusal marker. Leading causes:
      the squash body lacks Resolves for rec-5276, or the graduated shard is not on main. Never close it with a direct
      status write after a Decision 186 refusal; fix the cause and re-run the closure route.
    hermetic: false
test_obligations:
  - source: config/telemetry/arrival.yaml
    behavior: the rec-5276 session key is excused, owner-bound
    verification_step: 1
    test_selector: tests/telemetry_verify/test_session_presence.py::test_the_shipped_config_excuses_the_07cb0d3b_session
    red_green_expectation: red before (missing=1), green after
