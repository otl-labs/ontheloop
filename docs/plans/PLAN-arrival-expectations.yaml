  - "Build-start check: Decision numbers are assigned at build as max+1 (246 is claimed by two open PRs today); re-measure red_overlap and plan_obligations against main; check the unbuilt plans on shared files that plan_obligations names."
  - "Blind Fable consult on the writing-time forks (2026-11-06, operator's standing lean): F1 12-hourly cron, F2 judge_days 3, F3 one lost-window mechanism with an open-start pre-production window, F4 schema admits a mapping and the validator owns the grammar with unknown-key and absent-grammar failures, F5 day-keyed missing fingerprint (no flaky quarantine of a third outage), junit file name pytest-junit.xml. Adopted all. Not adopted: a per-session fingerprint (one Critical per missing session in an outage) and a lookback bound relative to PR created_at (max_lookback_days 56 already exceeds the measured 9.4-day tail)."
