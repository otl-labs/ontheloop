schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: arrival-expectations
intent: >-
  Make missing data a detected failure: every registered warehouse table declares what should arrive, from an
  independent source and by when (rec-4949), a fast-tier validator refuses a table that declares nothing, and the first
  live check, the telemetry-arrival workflow, alarms through ci-rca when a merged session never reached the warehouse
  (rec-4940). Motivated by the 2026-11-03 capture outage, which no check saw for 2.8 days (its fix is owned elsewhere).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-arrival-expectations.yaml
phase: >-
  ad_hoc_rec: capture-pin-outage postmortem follow-up (rec-4949 High, rec-4940 High; operator approved both
  2026-11-05). Targets no tier_item and closes no criterion. Decision 62's 2026-06-16 live-reader revisit, which the
  new Decision amends for arrival checks, keeps its existing roadmap owner; no roadmap criterion moves.
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the sidecar blocks decision-new (the new Decision, newest first) and decision-62-update (an Update note
      after Decision 62's 2026-09-25 correction, referring to the 2026-06-16 amendment above it). Number and date are assigned at build (max+1, Decision 84 backfill).
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated after the DECISIONS.md edit (implement-scope-boundary decisions_index_regeneration row).
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks standard-log (a new amendment_log entry), standard-version, standard-rule,
      standard-walk and standard-grammar: rule arrival-expectation, design_time_walk step 9, and the new top-level
      arrival_expectations block (home, kinds with required and optional fields, fields, mechanical, and tables: one
      flow-style declaration per registry table, all 12). Grammar and declarations sit in one file, beside the other
      per-table Class D block (storage-substrate.yaml's tables: precedent). No code restates the kinds or the
      telemetry_sessions SLA.
  - file: scripts/checks/contracts/validate_data_model_standard.py
    action: Modify
    purpose: >-
      _REQUIRED_STANDARD_SECTIONS gains arrival_expectations, so deleting the block fails the existing diff-aware
      check (blind Fable consult, declaration home).
  - file: tests/checks/contracts/test_validate_data_model_standard.py
    action: Modify
    purpose: >-
      A standard without arrival_expectations fails as missing a required section; the real file passes. The fourth
      required section updates the _COMPLETE_STANDARD fixture (lines 20-25, used by the nodes at 104-149 and 159-177)
      and the hard-coded section counts at lines 256, 263, 271 and 293 (critique r2 N1).
  - file: scripts/checks/contracts/validate_arrival_expectations.py
    action: Create
    purpose: >-
      Two registered checks over one pure core. judge(root, today=None) -> (failures, examined): the population is
      ops_table_names() | control_table_names() (src.common.ducklake_scd2_schema and ducklake_control_tables, the
      generated registry; never a glob of docs/contracts, scout NOTE on Decision 191). Both directions against the standard's
      arrival_expectations.tables: a registry table with no entry fails, and an entry naming no registry table fails
      (the universe is the live registry, never the block's own keys; Decision 191). Per entry: fail on an unknown kind,
      a missing required field, or a field outside kinds.<kind>.required plus .optional (plus kind); an absent or
      malformed grammar fails loud, never a vacuous pass (Fable F4). The registry modules are imported inside the
      function (validate_table_registration's _live_registry precedent); the check is ungated in both tiers (its
      _manifest.py row). Shapes: sla ^[1-9][0-9]*[mhd]$; semantics in
      {set_inclusion, count}; alarm_route in {ci_rca, self_filed}; owner ^rec-[0-9]{4,}$; review_by an ISO date;
      authorized_by ^(Decision [0-9]+|rec-[0-9]{4,})$; parent a registered table whose own kind is enforced or
      residual. enforced: check is a mapping {workflow, module}; .github/workflows/<workflow>.yml exists and parses;
      its on.schedule (PyYAML loads the on: key as True, so read doc.get("on", doc.get(True)) as sensor_liveness does; critique r4 N6) has at least one cron and every cron passes sensor_liveness.cron_period_seconds (the sweep's own
      admission, never a restated shape list); the module path exists; for ci_rca the workflow's name: field is a
      config/ci_rca_taxonomy.yaml workflows key with ci_rca watched and appears in ci-rca.yml's
      on.workflow_run.workflows list; for self_filed it is a taxonomy key with ci_rca excluded. derived:
      cardinality_check names a workflow file with an on.schedule cron the sweep accepts. Reads no warehouse and no
      network. validate_arrival_expectations (pre and full) reports every failure except an overdue review_by and
      declares registry.examined(len(population)). validate_arrival_residual_review (full tier only, never --pre, so no
      PR's merge depends on the calendar; validate_temporary_exemption_review precedent) fails a residual whose
      review_by is before today (UTC) naming the table and owner, and declares examined(count of residuals).
    new_imports:
      - scripts.checks._common
      - scripts.checks.registry
      - scripts.convergence_health.sensor_liveness
      - src.common.ducklake_scd2_schema
      - src.common.ducklake_control_tables
  - file: tests/checks/contracts/test_validate_arrival_expectations.py
    action: Create
    purpose: >-
      rec-4949's acceptance nodes test_table_contract_without_expectation_fails (a registry table with no entry) and
      test_named_waiver_passes, over a tmp repository built from fixtures (the population passed through a known_tables keyword override on judge(), the validate_table_registration precedent, since the registry modules resolve from sys.modules, never the tmp root; critique r5 N2; the standard with its grammar
      and tables, workflow files, a taxonomy and a ci-rca.yml). Plus: an entry naming no registry table fails; an unknown kind and an extra field fail; an
      enforced check whose workflow is missing, has no schedule, has a cron the sweep rejects, is not watched or not
      listed in ci-rca.yml fails; self_filed against a watched row fails; a residual with a past review_by passes the
      fast check and fails validate_arrival_residual_review with today pinned past it; derived with a waived parent
      fails; an absent or malformed grammar block fails loud; the real repository passes validate_arrival_expectations
      with examined == len(ops_table_names() | control_table_names()) and examined > 0 (never a literal count, so a
      new registration edits no test; critique r2 B2), and passes the residual review only with today pinned to 2026-11-06 (critique r1 B4: this
      file is in --pre selection and re-run as a graduated record, so no node may read the calendar). Wiring nodes on
      the TestWiring precedent (test_validate_data_model_standard.py:179-191): validate_arrival_expectations is in
      registry.pre_sequence() and full_sequence(), validate_arrival_residual_review is in full_sequence() and absent
      from pre_sequence() (its calendar read never gates a PR), and both resolve through registry.resolve (critique r2
      B5). 100% line coverage of the module from this mirror alone.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      Two Entries. validate_arrival_expectations: pre=True, pre_globs=None (ungated, so it runs on every --pre; the
      validate_data_model_standard precedent; critique r1 B1: sensor_liveness's import closure reaches about 68 paths
      a glob list would miss, lazy imports included, and the check also asserts that session_presence.py exists),
      full_segment full_after_lint. validate_arrival_residual_review: pre=False, full_segment full_after_lint.
  - file: scripts/telemetry_verify/session_presence.py
    action: Create
    purpose: >-
      The arrival oracle for telemetry_sessions, inside the oracle package's import boundary
      (tests/telemetry_verify/test_package_boundary.py: stdlib, yaml, read_route and completeness only). Pure core
      judge(commits, roots_for, now, expectation, config, pr_created_at) -> ArrivalResult. Expectation: read from
      docs/contracts/data-modeling-standard.yaml arrival_expectations.tables.telemetry_sessions as data; the module refuses to judge
      (status unreadable) unless kind is enforced, check.module is its own path and sla parses, so the SLA is never
      restated in code (AGENTS.md's collocation rule; the new Decision's cl.1 disclaims Decision 210 cl.3 for expectations; critique r5 N3). Denominator: first-parent commits on origin/main (`git log --first-parent`
      with committer time and full message, read once) merged in [now - judge_days, now - sla]; each commit's
      Claude-Session trailer values (every one, a squash can carry several) map through completeness.normalise_key to
      the URL's last path segment; distinct keys are judged once, at their earliest merge. Counted, never red: a commit
      with no trailer (untrailered), a key merged less than sla ago (pending). Denominator collapse (critique r2 B3):
      when no key is judged and at least collapse_min_commits commits fell in the judged range untrailered, the
      source has changed shape or stopped, so the status is unreadable (cause DenominatorCollapse), never skipped; a
      range with no commits at all is skipped. Lookup: roots_for(day_from, day_to)
      calls telemetry_root_sessions in windows of window_days (at most the verb's 7, counted inclusively: day_to = day_from + window_days - 1, src/common/ducklake_event_reads.py; the fake reader in the tests refuses a longer span; critique r4 N8), newest first, from the newest
      judged merge's day back, dropping found keys and stopping when none remain or max_lookback_days is reached.
      Each window read gets one retry; a second failure, a git failure or an unparsable expectation is status
      unreadable (red, never a pass, the new Decision cl.2). Classification of a key still unfound: lost_window when the
      PR number in its commit subject's trailing "(#N)" names a PR whose created_at lies inside a config lost window
      (one mechanism for the pre-production gap and the 2026-11-03 outage; blind Fable consult F3); excused when the key is in config excused_sessions; else missing. pr_created_at is looked up only for unfound
      keys (at most max_pr_lookups; beyond it, or on a lookup failure, the key stays missing), so a healthy run makes
      no GitHub call. Status: unreadable (including denominator collapse) > red (missing > 0) > skipped (no commit in the judged range, or fewer untrailered commits than collapse_min_commits; never a pass) > green.
      Output (Decision 101): one line `ARRIVAL status=S judged=N captured=N missing=N lost_window=N excused=N pending=N untrailered=N windows_read=N pr_lookups=N pr_lookup_failed=N elapsed_s=F` (pr_lookup_failed separates a failed lookup from a real miss; critique r3 N6), then one `ARRIVAL_MISSING sha=<12
      hex>` line per missing commit; never a session key, branch, URL host or error body (the exception class only).
      write_junit(path, result): one testsuite with testcases file="scripts/telemetry_verify/session_presence.py"
      name arrival_missing and arrival_unreadable. A missing <failure> has type ArrivalMissing_YYYY_MM_DD (the UTC day
      of the earliest missing merge) and a constant message head; an unreadable one has type ArrivalUnreadable and a
      head naming the exception class (or DenominatorCollapse) only. error_signature_from_junit groups by (type, frame, scrubbed head), so one
      outage is one fingerprint while its first missing merge stays in the horizon (at most one new rec per outage day,
      never one per session), and separate outages never share a fingerprint, so ci-rca's flake escalation (a chain of
      3 is quarantined flaky, ci-rca-lifecycle.yaml flake_escalation) cannot silence the third outage (blind Fable
      consult F5.3). The file attribute gives red_overlap its file, so the halt is overlap-scoped inside the SLO; skipped writes a <skipped>
      testcase; green writes passing testcases. The GitHub adapter is a module function using urllib (GET
      /repos/{repo}/pulls/{n}, 10 s timeout, token from GITHUB_TOKEN when set) that tests monkeypatch
      (tests/conftest.py denies sockets).
    new_imports:
      - scripts.telemetry_verify.completeness
      - scripts.telemetry_capture.read_route
  - file: tests/telemetry_verify/test_session_presence.py
    action: Create
    purpose: >-
      rec-4940's acceptance nodes test_merged_session_absent_after_sla_fails and test_unreadable_reader_fails_not_skips,
      plus: a captured key passes; a key merged inside the SLA is pending; an untrailered commit is counted, not red; a
      squash with two trailers judges both; distinct keys judged once; a key found only in an older window is captured
      and the walk stops early; a key unfound after max_lookback_days is missing; lost_window (both window shapes) and
      excused classify by PR created_at and config; a PR lookup failure leaves the key missing; a second window
      failure, a git failure and a malformed or mismatched expectation are unreadable;
      test_trailerless_denominator_is_unreadable_not_skipped (collapse_min_commits untrailered commits and no trailer
      is unreadable with exit 1, one fewer is skipped); a range with no commits is skipped with exit 0 and never
      prints status=green; through scripts.ci_rca.fingerprint's own parser, two runs whose
      missing sets differ but share the earliest missing day give one signature, two outages on different days give two,
      and the nodeid's file is session_presence.py; the open-start lost window in config/telemetry/arrival.yaml ends on
      completeness.PRODUCTION_FIRST_JUDGED_DAY (collocated guard, Fable F3); the output line never contains a session key. Fixtures: a tmp git repository with squash-shaped commits; a fake
      reader. 100% line coverage of the module from this mirror alone.
  - file: scripts/telemetry_verify/__main__.py
    action: Modify
    purpose: >-
      Subcommand `arrival [--junit-xml PATH] [--as-of ISO] [--no-lost-windows] [--repo OWNER/NAME]`: builds the routed reader, reads the
      expectation and config/telemetry/arrival.yaml, runs session_presence, prints its lines, writes the junit when
      asked, exits 0 for green or skipped and 1 for red or unreadable. --as-of judges as at a past instant (commits
      merged before it; roots read as now), --as-of and --no-lost-windows are used only by the live replay VP. --no-lost-windows also skips every PR lookup (no window can match), so the replay spends none of GitHub's unauthenticated budget (critique r4 N1). --repo defaults to GITHUB_REPOSITORY,
      else otl-labs/ontheloop. Stays under its SLOC budget (231 of 500 SLOC today, 268 physical lines).
  - file: tests/telemetry_verify/test_main.py
    action: Modify
    purpose: >-
      The arrival subcommand's exit codes per status, the junit flag, --as-of and --no-lost-windows parsing, the --repo
      default (GITHUB_REPOSITORY when set, else otl-labs/ontheloop; critique r3 N10), and that logging stays disabled. The graduated shards telemetry-read-clients-use-the-route and
      telemetry-verify-commands-counts-only name this file and keep running unchanged (the new subcommand also builds
      its reader through read_route and prints counts only).
  - file: config/telemetry/arrival.yaml
    action: Create
    purpose: >-
      Operating parameters, data only: judge_days 3, window_days 7, max_lookback_days 56, max_pr_lookups 60 (re-sized
      at build to at least twice the live count of distinct keys merged inside the outage window, 41 on 2026-11-06,
      since each is looked up until it ages out of judge_days; critique r2 N7), collapse_min_commits 3;
      lost_windows: [{to: "2026-10-28T00:00:00Z", owner: <the new Decision, "Decision NNN">, reason: before production
      capture; no from, an open start}, {from: "2026-11-03T00:49:00Z", to: <the verified capture-restoration instant,
      read back from the capture quick-fix's live proof at build>, owner: rec-4939, reason: capture pin outage, no
      backfill}]; excused_sessions [] ({key, owner} rows; keys are already public in main's trailers).
      session_presence refuses (unreadable) a window whose to is not after from, a lost_windows owner not matching
      ^(rec-[0-9]{4,}|Decision [0-9]+)$, an excused_sessions owner not matching ^rec-[0-9]{4,}$ (shape only; that the
      rec is open is the reviewer's check, not a hermetic one; critique r2 N3), or an unknown key.
  - file: .github/workflows/telemetry-arrival.yml
    action: Create
    purpose: >-
      name telemetry-arrival. on: workflow_run (workflows [CI], types [completed], branches [main]); schedule cron
      '17 */12 * * *' (see the cron context line); workflow_dispatch. Job if: schedule; or workflow_run whose
      event is push, head_branch is main and head_repository.full_name equals github.repository (a fork PR's branch
      named main must never start this id-token job; ci-rca.yml's fork-PR privilege gate precedent, critique r1 B3);
      or workflow_dispatch on refs/heads/main. permissions: contents read, id-token write,
      pull-requests read. concurrency group telemetry-arrival, cancel-in-progress false. timeout-minutes 30. Steps on
      the telemetry-verification.yml pattern: checkout@v7 with fetch-depth 0 (the denominator is main's history),
      aws-region action, setup-python 3.12, venv install, configure-aws-credentials@v6 for the existing
      agent-platform-github-ci-branch role (secrets-only ARN parts, MASK_AWS_ROLE_ID_ACCOUNT_PART), resolve and
      ::add-mask:: the telemetry_reader Function URL and host only, then `.venv/bin/python -m scripts.telemetry_verify
      arrival --junit-xml reports/pytest-junit.xml` with GITHUB_TOKEN in env, then upload-artifact named pytest-junit
      holding reports/pytest-junit.xml (the artifact and file names ci-rca.yml downloads and reads) with if: always(),
      job id arrival, step name "Upload pytest junit report (v2 fingerprint substrate)" and retention-days: 14 (the
      main-canary.yml precedent; validate_actions_evidence needs an integer inside ordinary_ci's 7-14 bounds; critique
      r4 B1). No step files a rec. Depth: CI -> telemetry-arrival -> ci-rca is
      three workflow_run levels, GitHub's limit.
  - file: tests/test_telemetry_arrival_workflow.py
    action: Create
    purpose: >-
      Static shape (the test_telemetry_verification_workflow.py precedent): the three triggers and the job guard,
      including its push-event and same-repository legs for workflow_run; the cron passes sensor_liveness.cron_period_seconds; permissions exactly as scoped; the reader URL and host
      are masked; the run step invokes the arrival subcommand with --junit-xml; the artifact is named pytest-junit,
      uploads always with retention-days 14, and has its github-actions-evidence.yaml artifact_uploads row; no secret reaches a run body except through env; rec-4940's acceptance line holds:
      telemetry-arrival is in ci-rca.yml's workflows list; and, through scripts.ci_rca.taxonomy.load_taxonomy and
      classify_failure, the workflows row is watched and sample "ARRIVAL status=red ..." and "ARRIVAL
      status=unreadable ..." log lines classify to code_regression/arrival_missing and environment/arrival_unreadable
      via log_pattern_to_category (critique r2 B5).
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: Add "telemetry-arrival" to on.workflow_run.workflows (rec-4940 acceptance `grep -q telemetry-arrival .github/workflows/ci-rca.yml`).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      workflows row telemetry-arrival {tier: not_a_gate, ci_rca: watched, owner: platform, rationale: the new Decision
      cl.4 arrival check; files no rec itself}; function_to_category rows validate_arrival_expectations and
      validate_arrival_residual_review -> schema_drift; log_pattern_to_category rows "ARRIVAL status=red" ->
      code_regression (check_name arrival_missing) and "ARRIVAL status=unreadable" -> environment (check_name
      arrival_unreadable), inserted ahead of every generic pattern, since priority 5 scans the list in order
      (scripts/ci_rca/taxonomy.py); the workflow test classifies a realistic full job log, not only a sample line
      (critique r3 N7). Measured against its budget at build (plan_obligations reports headroom).
  - file: docs/contracts/github-actions-evidence.yaml
    action: Modify
    purpose: >-
      One artifact_uploads row {workflow: .github/workflows/telemetry-arrival.yml, job: arrival, step: "Upload pytest
      junit report (v2 fingerprint substrate)", artifact: pytest-junit, retention_class: ordinary_ci} beside the
      ci.yml and main-canary.yml pytest-junit rows, plus its amendment_log field_add line. validate_actions_evidence
      (--pre, gated on .github/workflows/**) requires the upload set to equal this list exactly (critique r4 B1;
      430 of 500 effective lines, re-measured at build).
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: r3_workflows rows for the new workflow's inline run bodies (validate_composite_action_shell_bodies fails the tier for an unlisted body).
  - file: config/structural_size_budgets.yaml
    action: Modify
    purpose: >-
      One cited raise (the contracts class's relief valve "loud cited raise"; the new Decision's cl.1 names the path,
      so _marker_guard's authorization holds): docs/contracts/data-modeling-standard.yaml 533 with `# raise-approved:
      dec-NNN` (the new number). Declarations are flow-style one-liners. Compacting the standard's 138-line
      amendment_log instead would reword history the operator has not seen. Re-measured at build: the raise rises
      only to the measured count.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      One structural_assumptions row (id: the next free SA-NN at build; SA-05 is claimed by the unbuilt
      approved-text-operator-approval plan) plus its amendment_log line: the arrival check assumes squash-merge
      first-parent history on main with a "(#N)" PR subject, the harness's Claude-Session trailer whose URL's last
      segment is the harness session key, GitHub's pulls/{n} created_at, and the literal default repository slug
      otl-labs/ontheloop when GITHUB_REPOSITORY is unset. location
      scripts/telemetry_verify/session_presence.py, status open, owning_item "T4.24:c9". Prose only; no port.
bundled_recommendations: [rec-4949, rec-4940]
followon_recs: [rec-4950, rec-4951, rec-4952, rec-4953]
closes_criteria: []
infrastructure_dependencies:
  - >-
    None new. The workflow reuses the agent-platform-github-ci-branch OIDC role that telemetry-verification.yml already
    uses to invoke the telemetry reader (Decision 236 cl.2). Its trust needs no change: terraform/personal/oidc_ci_roles.tf
    trusts repo:<slug>:ref:refs/heads/main, the sub that schedule and workflow_run runs on the default branch present,
    and ci-rca.yml already assumes it under workflow_run; the reader invoke grant is the one telemetry-verification.yml
    uses (critique r3 N4). VP 10 proves it on the first run after merge; if the run fails on AssumeRole or
    invoke, the build stops, files a rec and does not widen IAM itself.
  - >-
    Precondition to START the build: telemetry capture restored on production (the capture quick-fix thread's live
    proof) and its restoration instant known, so lost_windows can be closed and the check does not land red.
acceptance_criteria:
  - A registered table with no declaration and no waiver fails validate_arrival_expectations; a named waiver passes (VP 1).
  - An enforced declaration whose workflow is unscheduled, uses a cron the liveness sweep rejects, or is not wired to its alarm route fails (VP 1).
  - The real repository passes validate_arrival_expectations and validate_arrival_residual_review with every registry table examined (12 today; VP 1, VP 6).
  - A merged session absent after its SLA is red; an unreadable reader is red and never skipped; an empty denominator is skipped, never green; a denominator that collapses (commits but no trailers) is unreadable (VP 2).
  - The red's junit attributes it to scripts/telemetry_verify/session_presence.py with one fingerprint per cause (VP 2).
  - telemetry-arrival is wired to ci-rca, triggered by main CI completion and a schedule the liveness sweep watches (VP 3, VP 5).
  - Against production, the check is green now (outage merges still inside judge_days count lost_window) and red when replayed as at 2026-11-04T12:00Z with no lost windows (VP 8, VP 9).
  - Always-ask text lands exactly as the sidecar says (VP 7).
  - The first post-merge run on main concludes success through the OIDC role (VP 10); rec-4949 and rec-4940 close through the squash trailer (VP 11).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run rec-4949's acceptance and the validator suite.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_arrival_expectations.py -q
    expected: exit 0; red before (module absent).
    fix_if: a node fails, or the real-repository node needs a fixture to pass
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: arrival-expectations-validator
  - step: 2
    phase: pre-deploy
    action: Run rec-4940's acceptance, the oracle suite and the CLI suite.
    command: bin/venv-python -m pytest tests/telemetry_verify/test_session_presence.py tests/telemetry_verify/test_main.py tests/telemetry_verify/test_package_boundary.py -q
    expected: exit 0; red before (module absent).
    fix_if: any status mis-ranks, a junit head varies with the missing set, or a session key reaches the output
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: telemetry-arrival-oracle
  - step: 3
    phase: pre-deploy
    action: Static workflow shape and the ci-rca wiring.
    command: bin/venv-python -m pytest tests/test_telemetry_arrival_workflow.py -q
    expected: exit 0; red before (workflow absent).
    fix_if: a trigger, guard, permission, mask or artifact name differs from scope
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: telemetry-arrival-workflow-structure
  - step: 4
    phase: pre-deploy
    action: Data-model standard suite (the required arrival_expectations section).
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_data_model_standard.py -q
    expected: exit 0
    fix_if: a standard without arrival_expectations passes
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Graduating the whole pre-existing file would be green before the change (only its new node is red-before); the suite already runs in both tiers and the new node rides it (critique r4 N4).
  - step: 5
    phase: pre-deploy
    action: rec-4940's grep acceptance and the liveness sweep's peer set.
    command: grep -q telemetry-arrival .github/workflows/ci-rca.yml && bin/venv-python -c "from scripts.convergence_health.sensor_liveness import derive_scheduled_peers as d; p=d(); assert 'telemetry-arrival.yml' in p, sorted(p); print('peer', p['telemetry-arrival.yml'])"
    expected: exit 0; prints the workflow's cron.
    fix_if: the workflow is absent from either list
    hermetic: true
    expected_literals: ["peer "]
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Both new checks on the real tree, with the examined count.
    command: bin/venv-python -c "from pathlib import Path; from scripts.checks.contracts.validate_arrival_expectations import judge, validate_arrival_residual_review as b; f, n = judge(Path('.')); b(f); print('examined', n, 'failures', f); raise SystemExit(1 if f else 0)"
    expected: "exit 0; prints examined 12 failures []."
    fix_if: any failure, or examined is not the registry size; fix the declaration or the wiring, never the check
    hermetic: true
    expected_literals: ["examined 12 failures []"]
    graduation: waive
    graduation_waiver_reason: "moment claim: the exact registry count (12) changes with any later table registration; VP 1's real-tree node holds the lasting rule examined == len(ops_table_names() | control_table_names()) (critique r5 B1)"
  - step: 7
    phase: pre-deploy
    action: Bind the always-ask text to the approved sidecar.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug arrival-expectations --base origin/main
    expected: exit 0, no mismatch.
    fix_if: any block differs; re-apply the sidecar, never reword
    hermetic: false
    graduation: waive
    graduation_waiver_reason: "depends on this session's transient repo state (the --base origin/main ref); validate_plan_documents and the build PR's approved_text check bind the same text (critique r5 N1)"
  - step: 8
    phase: pre-deploy
    action: Live read against production, read-only (session PlatformDev profile), after capture is restored.
    command: git fetch origin main --quiet && AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_verify arrival --repo otl-labs/ontheloop --junit-xml logs/debug/arrival-now.xml 2>&1 | tee logs/debug/arrival-now.txt; grep -Eq "^ARRIVAL status=green judged=[1-9]" logs/debug/arrival-now.txt
    expected: >-
      exit 0 (the grep): an ARRIVAL status=green line with judged above 0, so missing=0 (lost_window may be above 0);
      skipped, red and unreadable all fail the grep (critique r2 B4).
    fix_if: >-
      missing above 0: inspect the shas; a straggler of the outage goes on excused_sessions with owner rec-4939, any
      other miss stops the build and is reported (a real capture gap, including a fresh merge read missing on a healthy
      day, which means the 60 min SLA needs re-measuring). unreadable: record the class and retry once later; a
      persistent cold-read timeout is rec-4474's, reported, not worked around. pr_lookups equal to max_pr_lookups:
      stop, re-size the cap from this run's count and re-run, since keys past the cap stay missing (critique r2 N7).
      pr_lookup_failed above 0: not a defect; the session has no GITHUB_TOKEN, so GitHub's 60/h unauthenticated
      limit applies; wait for the limit to reset (or export a read token) and re-run before judging (critique r4 N1).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Live production read; VP 2 graduates the logic hermetically and the workflow itself re-runs it after merge.
  - step: 9
    phase: pre-deploy
    action: Prove it would have caught the outage, replayed with no lost windows.
    command: git fetch origin main --quiet && AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_verify arrival --repo otl-labs/ontheloop --as-of 2026-11-04T12:00:00Z --no-lost-windows 2>&1 | tee logs/debug/arrival-replay.txt; grep -Eq "^ARRIVAL status=red judged=[1-9][0-9]* captured=[0-9]+ missing=[1-9]" logs/debug/arrival-replay.txt
    expected: >-
      exit 0 (the grep): an ARRIVAL status=red line with missing above 0. unreadable also exits 1 but fails the grep,
      so it can never pass for red (critique r2 B4).
    fix_if: green or skipped, which means the check is blind to the motivating outage; stop and RCA
    hermetic: false
    graduation: waive
    graduation_waiver_reason: One historical replay against production; VP 2's absent-after-SLA node graduates the same logic.
  - step: 10
    phase: post-deploy
    action: >-
      First completed telemetry-arrival run on main after merge (triggered by the merge's CI completion), read back;
      then its job log through mcp__github__get_job_logs (AGENTS.md's MCP preference for session-side reads). Run with
      MERGE_SHA set to the build's squash-merge sha, so the run read is the one that merge triggered (critique r4 N3);
      mcp__github__actions_list is the equivalent MCP read.
    command: bin/venv-python -c "import json,urllib.request as u; r=json.load(u.urlopen('https://api.github.com/repos/otl-labs/ontheloop/actions/workflows/telemetry-arrival.yml/runs?branch=main&event=workflow_run&status=completed&per_page=20', timeout=20)); import os; x=[w for w in r['workflow_runs'] if w['head_sha'] == os.environ['MERGE_SHA']][0]; print(x['event'], x['status'], x['conclusion'], x['id']); raise SystemExit(0 if x['conclusion'] == 'success' else 1)"
    expected: >-
      exit 0, printing workflow_run completed success <run id> (status=completed, so an in-progress run is never
      read); the run's job log, read with mcp__github__get_job_logs for that run id, has an ARRIVAL status=green line
      with judged above 0 (critique r2 N5).
    fix_if: >-
      no matching run (another merge landed before this merge's CI completed, so the run's head_sha is a later tip):
      re-run with MERGE_SHA set to the first main commit after the merge whose run exists, a descendant of the merge
      (critique r5 N4). failure on credentials or invoke: file a rec (IAM, operator's call) and report; red on missing: as VP 8; never
      disable the workflow.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: Read rec-4949 and rec-4940 back after the squash merge.
    command: bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows, missing = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4949', 'rec-4940']); s = sorted((x['id'], x['status']) for x in rows); print(s, missing); raise SystemExit(0 if not missing and len(s) == 2 and all(v == 'closed' for _, v in s) else 1)"
    expected: both closed
    fix_if: still open after the trailer-closure job concludes; follow git-ops.yaml resolves_trailer's fallback
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: pre-deploy
    action: Full tier, backgrounded from the top-level session.
    command: bin/venv-python -m scripts.validate
    expected: "green; verdict read by bin/venv-python -m scripts.checks.validation_result --verify-head."
    fix_if: any red; fix on the branch
    hermetic: false
    graduation: not-applicable
