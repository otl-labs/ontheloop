execution_steps:
  - Confirm capture is restored (the quick-fix thread's live proof) and record the restoration instant; re-measure red_overlap and plan_obligations.
  - Apply the sidecar blocks exactly (DECISIONS.md and the standard) with the next Decision number and today's date, and regenerate docs/decisions-index.json.
  - validate_arrival_expectations.py with its tests and manifest Entries; the schema test node.
  - session_presence.py, the arrival subcommand, config/telemetry/arrival.yaml and their tests.
  - telemetry-arrival.yml and its test; ci-rca.yml, the taxonomy, baseline and ports.yaml rows.
  - Run VP 1-7 until green; then VP 8 and VP 9 live (their logs/debug output files are posted on the build PR).
  - Commit, then run VP 12 (full tier, backgrounded) on the committed clean HEAD, since --verify-head fails on a dirty tree; then push.
  - >-
    Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows; PLAN-capture-hook-status-message
    precedent): GitHub readiness state (bin/venv-python -m scripts.session.github_readiness); parent validator
    evidence (VP 12 full-tier exit 0 plus bin/venv-python -m scripts.checks.validation_result --verify-head for the
    pushed HEAD); structured postflight evidence (write the scripts.session.postflight_evidence.CATEGORIES JSON in
    the scratchpad, then bin/venv-python -m scripts.session.postflight --evidence <file>); the real outcome - push,
    build PR, CI green by event-driven wake (never polled), merge SHA.
  - Merge on code review PROCEED and green CI (the sidecar-bound text needs no further word); then VP 10-11 and report to the coordinator with the merge sha and the first run id.
rollback: >-
  Revert the squash commit. The workflow files no rec itself; an open ci-rca rec from it is closed with the revert's
  sha as evidence.
