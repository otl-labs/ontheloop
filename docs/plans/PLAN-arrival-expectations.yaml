  - "Alarm route mechanics (Decision 226, red-main-recovery.yaml): a watched workflow's red is Track B Critical (is_track_a needs workflow_tier CI); the junit artifact gives ci-rca a deterministic file (session_presence.py) for red_overlap's overlap scoping and the day-keyed fingerprint (a ci_rca rec always carries a file, so red_overlap's undeterminable rule is not the reason; critique r3 N3). A real miss keeps each run red for judge_days (3, past the 24 h liveness threshold plus a reader-failure streak), one ci-rca rec by fingerprint; when it ages out the workflow turns green and the rec stays open for its repair plan."
  - "Declaration home (changed after sign-off, blind Fable consult 2026-11-06): declarations live in one arrival_expectations.tables block of data-modeling-standard.yaml beside the grammar, not in each Class A contract. Reasons: per-contract blocks need a ContractGovernance (extra=forbid) schema line that must itself be approved text, and contracts_schema.py's import closure caps the fast tier's test selection (affected_tests CAP 35), which the plan-PR check refuses (wording-check rounds 1-2, selection degraded); one subject in one file matches AGENTS.md's collocation rule and storage-substrate.yaml's per-table tables: precedent; the universe stays the live registry (Decision 191). The Decision's Options considered records the per-contract alternative."
  - "Outage tail: lost_windows opens at 2026-11-03T00:49Z (capture-pin-outage postmortem) and closes at the restoration instant read back from the capture quick-fix thread at build. A session whose PR was created inside the window counts lost_window; a straggler started inside it whose PR is created later goes on excused_sessions (owner rec-4939). Outside both, a miss is red."
