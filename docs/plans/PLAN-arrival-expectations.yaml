  - "Unreadable fingerprint (critique r1 N7): ArrivalUnreadable keys on the exception class, so repeated reader outages share one fingerprint and ci-rca's flake escalation quarantines the third as flaky; the success-leg liveness rec stays the backstop. A recurring transport flake being quarantined is the intended ci-rca behaviour; missing-data reds are day-keyed and never share a chain."
