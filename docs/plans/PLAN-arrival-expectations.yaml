constraints:
  - Arrival checks are never a merge gate, a required check, or in the fast or full tier (operator ruling 2026-11-05; the new Decision cl.4); only the validator is in the tiers.
  - "Public boundary (Decision 101): output prints counts and commit shas only; no session key, branch, URL host, ARN or error body."
  - No IAM, Terraform or Lambda change; src/** and config/lambda/** are out of scope (the governed deploy channel is not triggered).
  - Sidecar-bound files change exactly as the sidecar says; a build that cannot reproduce it stops and reports to the coordinator.
  - The build starts only after capture is restored; it never lands the workflow red to be fixed later.
  - No rescue agents or workaround loops (Decision 55).
