schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: arrival-lost-window-author-date
intent: >-
  Stop the arrival oracle turning main red when a session that ran inside a recorded lost window has its work merged
  through a pull request opened after the window closed (rec-5084; first instance rec-5081): when the PR's creation
  time misses every window, the oracle reads the PR's commits and counts the key as lost_window when the earliest commit
  carrying that key's own Claude-Session trailer was authored inside a window. The denominator then keeps judging only
  sessions that could have been captured, without a hand-written row per re-opened session (NS.6).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-arrival-lost-window-author-date.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): rec-5084, the preventive_action of the Track B red rec-5081 (Decision
  226 cl.5). No tier_item is targeted and no exit criterion is closed, so closes_criteria is empty.
closes_criteria: []
scope:
  - file: scripts/telemetry_verify/session_presence.py
    action: Modify
    purpose: >-
      (1) New adapter github_pr_key_authored_at(repo, number, key) -> datetime | None: GET
      /repos/{repo}/pulls/{number}/commits?per_page=100&page=P for P = 1, 2, 3 (GitHub lists at most 250 commits),
      stopping at a short page, with the same headers, token rule and 10 s timeout as github_pr_created_at; when the
      listing holds 250 or more commits it raises (GitHub truncates silently and lists in history order, so a partial list's
      minimum is unreadable evidence); a key-carrying commit without a readable commit.author.date raises, and so does any page that is not a JSON list,
      any item that is not an object, or any commit whose commit.message is not a string (each is unreadable evidence,
      which leaves the key missing); otherwise it
      returns the minimum commit.author.date over commits whose message carries key, None when none does
      (commit.author.date is read even when the top-level author is null). A new _keys_in(text) helper holds _session_keys' trailer parsing
      and _session_keys calls it on commit.body, so existing behaviour is unchanged and the adapter calls _keys_in on
      each commit.message. (2) Config: authored_grace_days joins check_config's allowed-key set but not _PARAMS (every
      _PARAMS key is required, and existing configs lack this one); a separate present-only check refuses a value that
      is not an int, is a bool, or is below 1. Absent, the author-date rule is off and the oracle behaves exactly as
      today.
      (3) judge/_judge gain a keyword-only pr_key_authored_at: Callable[[int, str], datetime | None] | None = None.
      In the classify loop, after the existing created_at lookup returned a time outside every window (never after
      it raised), the rule runs only when pr_key_authored_at is set, authored_grace_days is set and r.pr_lookups <
      max_pr_lookups (the authored lookup is one lookup per key, not per HTTP page, counted against max_pr_lookups together with the
      created_at lookup): r.pr_lookups += 1; the key counts
      lost_window and lost_window_authored, and its sha is listed, only when the authored time lies inside a window
      that has a from (start <= authored < end) and the PR's created_at is at or after that window's end and before
      that end plus authored_grace_days; an open-start window, a None or outside time, a PR created before the window began, or a PR
      created past the grace leaves the key missing; a raised lookup adds authored_lookup_failed and leaves it missing (fail closed, Decision 250 cl.2).
      (4) ArrivalResult gains lost_window_authored and authored_lookup_failed (ints, default 0) and
      lost_window_authored_shas; the ARRIVAL head line appends lost_window_authored=N authored_lookup_failed=N after
      elapsed_s, and one ARRIVAL_LOST_WINDOW_AUTHORED sha=<12> line per such commit follows the missing lines.
      (5) run() gains a keyword-only pr_key_authored_at: Callable[[int, str], datetime | None] | None = None and passes
      judge pr_key_authored_at if it is not None, else lambda n, k: github_pr_key_authored_at(repo, n, k) (the
      production path from scripts/telemetry_verify/__main__.py). (6) The module docstring names the rule. excused_sessions, the created_at rule, the walk and the junit
      shape are unchanged.
    new_imports: []
  - file: tests/telemetry_verify/test_session_presence_authored.py
    action: Create
    purpose: >-
      A new test module, so tests/telemetry_verify/test_session_presence.py (319 of 500 SLOC) stays unchanged; it
      imports nothing from another test_* module (validate_no_cross_test_imports, --pre and full tiers) and defines
      its own small copies: NOW, a CONFIG dict with the same seven keys, ROOT = Path(__file__).resolve().parents[2],
      a commit(n, key, hours_ago=10, *, pr=None, extra="") helper and an empty-roots callable, plus compact fakes. New nodes, each with a config that adds authored_grace_days to the module's CONFIG and a bounded window:
      test_a_key_whose_own_commit_was_authored_in_a_lost_window_is_lost_window (PR created after the window and inside
      the grace, key authored inside it: lost_window=1 lost_window_authored=1 missing=0 pr_lookups=2, and an
      ARRIVAL_LOST_WINDOW_AUTHORED line names the sha); test_the_author_date_rule_holds_its_approved_bounds (parametrized with an explicit expected outcome per case;
      the negative cases each read missing=1: authored after the
      end, at exactly the end, inside only an open-start window, None, authored inside with the PR created at the
      window end plus the grace, and authored inside with the PR created before the window's from, authored 1 s before a bounded window's from (after the module CONFIG's open-start to, inside no other window) with
      the PR created within the grace after that window's end, and the same-window case: two bounded windows A and
      B, authored inside A, the PR created outside both, past A's end plus the grace but within B's end plus the grace); test_an_authored_lookup_failure_is_missing_and_the_cap_bounds_both_lookups (a raising lookup:
      authored_lookup_failed=1 missing=1; with max_pr_lookups=1 the second lookup is not made; when the created_at lookup raises the authored callable is
      never called and pr_lookups=1);
      test_the_author_date_rule_is_off_without_its_config_key_or_callable (CONFIG unchanged, or no callable: the
      callable is never called and missing=1); test_a_created_in_window_pr_makes_no_authored_lookup;
      test_a_bad_authored_grace_days_is_unreadable (0, a bool, a string); test_github_adapter_reads_the_earliest_own_commit_author_date
      (urlopen monkeypatched: two pages, the first full of 100 and the second short; page 1 lists a later-authored own-trailer
      commit ahead of the earliest one, the earliest own-trailer commit sits on page 2, and another key's commit authored
      earlier than both sits on page 1, each fake commit with a commit.committer.date differing from its author date, and
      the node asserts the page-2 author time; so the URLs carry per_page=100&page=1
      and page=2 and no third request is made; other keys and a later own commit ignored; a commit whose top-level
      author is null still read from commit.author.date; token header asserted with the existing fake token "tok"; None when no commit carries the key; pages of 100, 100
      and 50 raise with no fourth request; a key-carrying commit with no commit.author.date raises; a page whose first item has no commit.message raises; an earlier commit naming the key only in prose, outside a
      Claude-Session trailer, is ignored);
      test_run_wires_the_github_authored_lookup_by_default (times are window-relative only, since the classifier
      never compares them with NOW or the squash time: times read from the shipped rec-5055 lost_windows row, as the
      existing shipped-window node does: sp.github_pr_created_at monkeypatched to return the row's to plus 1 h,
      sp.github_pr_key_authored_at monkeypatched to record (repo, n, key) and return the row's from plus 1 h; a local Reader whose
      named() returns []; sp.run(ROOT, Reader(), NOW, repo="o/r", commits=[commit(1, "KKK", pr=5)]) with the shipped
      config records ("o/r", 5, "KKK") and reads lost_window_authored=1; a second call passing an explicit
      pr_key_authored_at uses it and leaves the module adapter uncalled);
      test_the_shipped_config_enables_the_author_date_rule (load_config(ROOT) passes check_config and carries
      authored_grace_days 7). The lost-window node also asserts re.search(r" elapsed_s=\S+
      lost_window_authored=1 authored_lookup_failed=0$", sp.lines(result)[0]) (field order pinned, elapsed_s value not) and that the ARRIVAL_LOST_WINDOW_AUTHORED output
      carries no session key (Decision 101, as the existing missing-line node does), and the bounds node's two positive edge cases (authored exactly at a
      window's from, start inclusive; a PR created exactly at the window's end) each read lost_window=1 missing=0. Keep the fakes
      compact (one shared response class; parametrize the bound cases). Existing nodes in test_session_presence.py are untouched. If this module would pass 500 SLOC, stop
      BLOCKED.
    new_imports: []
  - file: config/telemetry/arrival.yaml
    action: Modify
    purpose: >-
      One new line after collapse_min_commits, exactly as the approved-text sidecar
      docs/plans/approved/arrival-lost-window-author-date.yaml binds it: "authored_grace_days: 7". Nothing else
      changes; the 01G2j5ReQ5S6d1QP6Rv4GJRi excused row (owner rec-5055, added for rec-5081) stays.
    new_imports: []
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      SA-07's assumption gains the second GitHub read, exactly as the sidecar binds it: "The arrival check
      assumes squash-merge first-parent history on main whose subject ends with a (#N) pull request number, the
      harness's Claude-Session trailer whose URL's last segment is the harness session key, GitHub's pulls/{n}
      created_at, GitHub's pulls/{n}/commits author dates (at most 250 commits listed, and an author date a rebase
      keeps), and the literal default repository slug otl-labs/ontheloop when GITHUB_REPOSITORY is unset." One
      amendment_log row (semantic_break false, change_class field_add, naming this plan and rec-5084).
    new_imports: []
bundled_recommendations: [rec-5084]
followon_recs: []
