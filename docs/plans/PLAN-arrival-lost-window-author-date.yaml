schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: arrival-lost-window-author-date
intent: >-
  Stop the arrival oracle turning main red when a session that ran inside a recorded lost window has its work merged
  through a pull request opened after the window closed (rec-5084; first instance rec-5081): when the PR's creation
  time misses every window, the oracle reads the PR's commits and counts the key as lost_window when the earliest commit
  carrying that key's own Claude-Session trailer was authored inside a window. The denominator then keeps judging only
  sessions that could have been captured, without a hand-written row per re-opened session (NS.6).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-arrival-lost-window-author-date.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): rec-5084, the preventive_action of the Track B red rec-5081 (Decision
  226 cl.5). No tier_item is targeted and no exit criterion is closed, so closes_criteria is empty.
closes_criteria: []
scope:
  - file: scripts/telemetry_verify/session_presence.py
    action: Modify
    purpose: >-
      (1) New adapter github_pr_key_authored_at(repo, number, key) -> datetime | None: GET
      /repos/{repo}/pulls/{number}/commits?per_page=100&page=P for P = 1, 2, 3 (GitHub lists at most 250 commits),
      stopping at a short page, with the same headers, token rule and 10 s timeout as github_pr_created_at; returns the
      minimum commit.author.date over commits whose message's _session_keys contains key, None when none does.
      (2) Config: authored_grace_days becomes an optional integer parameter (at least 1 when present; check_config
      refuses any other value); absent, the author-date rule is off and the oracle behaves exactly as today.
      (3) judge/_judge gain a keyword-only pr_key_authored_at: Callable[[int, str], datetime | None] | None = None.
      In the classify loop, after the existing created_at lookup returned a time outside every window (never after
      it raised), the rule runs only when pr_key_authored_at is set, authored_grace_days is set and r.pr_lookups <
      max_pr_lookups (the cap counts lookups, one per key, not HTTP pages): r.pr_lookups += 1; the key counts
      lost_window and lost_window_authored, and its sha is listed, only when the authored time lies inside a window
      that has a from (start <= authored < end) and the PR's created_at is before that window's end plus
      authored_grace_days; an open-start window, a None or outside time, or a PR created later leaves the key
      missing; a raised lookup adds authored_lookup_failed and leaves it missing (fail closed, Decision 250 cl.2).
      (4) ArrivalResult gains lost_window_authored and authored_lookup_failed (ints, default 0) and
      lost_window_authored_shas; the ARRIVAL head line appends lost_window_authored=N authored_lookup_failed=N after
      elapsed_s, and one ARRIVAL_LOST_WINDOW_AUTHORED sha=<12> line per such commit follows the missing lines.
      (5) run() passes pr_key_authored_at=lambda n, k: github_pr_key_authored_at(repo, n, k) unless a caller supplies
      one. (6) The module docstring names the rule. excused_sessions, the created_at rule, the walk and the junit
      shape are unchanged.
    new_imports: []
  - file: tests/telemetry_verify/test_session_presence.py
    action: Modify
    purpose: >-
      New nodes, each with a config that adds authored_grace_days to the module's CONFIG and a bounded window:
      test_a_key_whose_own_commit_was_authored_in_a_lost_window_is_lost_window (PR created after the window and inside
      the grace, key authored inside it: lost_window=1 lost_window_authored=1 missing=0 pr_lookups=2, and an
      ARRIVAL_LOST_WINDOW_AUTHORED line names the sha); test_an_authored_time_outside_every_window_stays_missing
      (authored after the end, at exactly the end, inside only an open-start window, and None: each missing=1);
      test_a_pr_created_after_the_grace_stays_missing (authored inside, PR created at the window end plus the grace:
      missing=1); test_an_authored_lookup_failure_is_missing_and_the_cap_bounds_both_lookups (a raising lookup:
      authored_lookup_failed=1 missing=1; with max_pr_lookups=1 the second lookup is not made);
      test_the_author_date_rule_is_off_without_its_config_key_or_callable (CONFIG unchanged, or no callable: the
      callable is never called and missing=1); test_a_created_in_window_pr_makes_no_authored_lookup;
      test_a_bad_authored_grace_days_is_unreadable (0, a bool, a string); test_github_adapter_reads_the_earliest_own_commit_author_date
      (urlopen monkeypatched: two pages, the first full, other keys and a later own commit ignored, token header and
      URL shape asserted, None when no commit carries the key); test_the_shipped_config_enables_the_author_date_rule
      (load_config(ROOT) passes check_config and carries authored_grace_days 7). Existing nodes byte-identical.
    new_imports: []
  - file: config/telemetry/arrival.yaml
    action: Modify
    purpose: >-
      One new line after collapse_min_commits, exactly as the approved-text sidecar
      docs/plans/approved/arrival-lost-window-author-date.yaml binds it: "authored_grace_days: 7". Nothing else
      changes; the rec-5081 excused row stays.
    new_imports: []
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      SA-07's assumption gains the second GitHub read, exactly as the sidecar binds it: "The arrival check
      assumes squash-merge first-parent history on main whose subject ends with a (#N) pull request number, the
      harness's Claude-Session trailer whose URL's last segment is the harness session key, GitHub's pulls/{n}
      created_at, GitHub's pulls/{n}/commits author dates (at most 250 commits listed, and an author date a rebase
      keeps), and the literal default repository slug otl-labs/ontheloop when GITHUB_REPOSITORY is unset." One
      amendment_log row (semantic_break false, change_class field_add, naming this plan and rec-5084).
    new_imports: []
bundled_recommendations: [rec-5084]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "An uncaptured key whose PR was created after every lost window but whose earliest own-trailer commit was authored inside one is counted lost_window (and lost_window_authored), not missing."
  - "A key whose earliest own-trailer commit was authored outside every window, whose PR lists no commit carrying it, or whose commit lookup fails stays missing; a PR created inside a window makes no commit lookup."
  - "Against the live warehouse with the rec-5081 excused row removed in memory, 6f71e367's outage-era key is lost_window and the ARRIVAL line reads missing=0."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The author-date rule counts an outage-era key lost_window.
    command: bin/venv-python -m pytest "tests/telemetry_verify/test_session_presence.py::test_a_key_whose_own_commit_was_authored_in_a_lost_window_is_lost_window" -q
    expected: exit 0; red before (node absent, and with the node but no rule, missing=1).
    fix_if: missing stays 1 (the second lookup is not wired, or the window test is wrong)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: arrival-author-date-lost-window
  - step: 2
    phase: pre-deploy
    action: The rule fails closed (outside, at the end, none, failure, cap) and makes no lookup when created_at already decides.
    command: >-
      bin/venv-python -m pytest "tests/telemetry_verify/test_session_presence.py::test_an_authored_time_outside_every_window_stays_missing"
      "tests/telemetry_verify/test_session_presence.py::test_a_pr_created_after_the_grace_stays_missing"
      "tests/telemetry_verify/test_session_presence.py::test_an_authored_lookup_failure_is_missing_and_the_cap_bounds_both_lookups"
      "tests/telemetry_verify/test_session_presence.py::test_the_author_date_rule_is_off_without_its_config_key_or_callable"
      "tests/telemetry_verify/test_session_presence.py::test_a_created_in_window_pr_makes_no_authored_lookup"
      "tests/telemetry_verify/test_session_presence.py::test_a_bad_authored_grace_days_is_unreadable"
      "tests/telemetry_verify/test_session_presence.py::test_the_shipped_config_enables_the_author_date_rule" -q
    expected: exit 0; red before (nodes absent).
    fix_if: an end-edge, open-start, past-grace or failure case counts lost_window (the rule is looser than approved), or the shipped key is absent
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: arrival-author-date-fails-closed
  - step: 3
    phase: pre-deploy
    action: The GitHub adapter reads the earliest own-trailer author date across pages.
    command: bin/venv-python -m pytest "tests/telemetry_verify/test_session_presence.py::test_github_adapter_reads_the_earliest_own_commit_author_date" -q
    expected: exit 0; red before (adapter absent).
    fix_if: a later own commit or another key's commit wins, or the second page is not read
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: arrival-author-date-adapter
  - step: 4
    phase: pre-deploy
    action: The whole oracle suite and the ports contract still pass.
    command: >-
      bin/venv-python -m pytest tests/telemetry_verify/test_session_presence.py -q && bin/venv-python -c "from
      scripts.checks.contracts.validate_ports_contract import validate_ports_contract as f; failed=[]; f(failed); raise
      SystemExit(1 if failed else 0)"
    expected: exit 0
    fix_if: an existing node fails (the default path changed) or SA-07 no longer validates
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Duplicates the file's graduated nodes and the registered validate_ports_contract; steps 1-3 graduate the new behaviour.
  - step: 5
    phase: pre-deploy
    action: Bind the config line and SA-07 to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug arrival-lost-window-author-date --base origin/main
    expected: exit 0; every block matches with only {{DATE}} filled
    fix_if: any word differs; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar
      on every PR declaring this plan.
  - step: 6
    phase: pre-deploy
    action: Live, on the build branch, with the rec-5081 row removed in memory, the rule alone classifies 6f71e367's outage-era key.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_verify arrival; AWS_PROFILE=agent_platform
      bin/venv-python -c "from datetime import datetime, timezone; from pathlib import Path; from scripts.telemetry_verify
      import session_presence as sp; from scripts.telemetry_capture import read_route; root = Path('.').resolve(); now =
      datetime.now(timezone.utc); repo = sp.DEFAULT_REPO; c = sp.load_config(root); c['excused_sessions'] = [r for r in
      c['excused_sessions'] if r['key'] != '01G2j5ReQ5S6d1QP6Rv4GJRi']; rd = read_route.make_routed_reader(); res =
      sp.judge(lambda: sp._recent_commits(root, now, c), lambda a, b: rd.named('telemetry_root_sessions', day_from=a,
      day_to=b), now, sp.load_expectation(root), c, lambda n: sp.github_pr_created_at(repo, n), pr_key_authored_at=lambda
      n, k: sp.github_pr_key_authored_at(repo, n, k)); print(*sp.lines(res), sep=chr(10))"
    expected: >-
      the shipped run reads missing=0 (or skipped); the in-memory run (the shipped config with the
      01G2j5ReQ5S6d1QP6Rv4GJRi row, the same reader and now) reads missing=0 with lost_window_authored at least 1 while
      6f71e367 is inside judge_days (to 2026-11-14T13:12Z); after that, record skipped-by-age instead. Record both lines
      in the PR body.
    fix_if: >-
      missing=1 on 6f71e367 in the in-memory run: the adapter or the window test is wrong; a missing sha with no
      outage-era commit is a real capture failure: stop and report to the coordinator, never excuse it
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
  - step: 8
    phase: post-deploy
    action: telemetry-arrival on main after the merge.
    command: AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_verify arrival
    expected: >-
      the ARRIVAL line carries lost_window_authored=N and reads status green or skipped; record the next
      telemetry-arrival run id on main (a workflow_dispatch run on main counts when the scheduled run is late).
    fix_if: "missing>0: read the sha's PR commits' author dates against the windows; a key with no outage-era commit is a real red for ci-rca"
    hermetic: false
  - step: 9
    phase: post-deploy
    action: rec-5084 is closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5084']); print(rows[0]['id'], rows[0]['status'])"
    expected: prints rec-5084 closed after the closure job runs on the merge commit; record that run id.
    fix_if: still open -- read the closure job's log for an acceptance refusal; fix the cause and re-run the closure route, never a direct status write
    hermetic: false
