  - "The arrival.yaml line and SA-07 land word for word as the approved-text sidecar docs/plans/approved/arrival-lost-window-author-date.yaml binds them (Decision 246)."
  - "Fail closed (Decision 250 cl.2): a failed, capped or empty commit lookup leaves the key missing; nothing the new read returns can make an otherwise-red run unreadable or green except an own-trailer author date inside a recorded window."
  - "lost_windows, excused_sessions and their grammar are unchanged; the rec-5081 excused row stays as a standing guard (Decision 244); retiring it later is its own operator-approved change."
  - "The default of the new judge keyword is no lookup and an absent authored_grace_days turns the rule off, so every existing caller and node keeps today's behaviour."
  - "No rescue agents or workaround loops (Decision 55)."
