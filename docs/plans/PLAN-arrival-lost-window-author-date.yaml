constraints:
  - "Loosened assertion (Decision 235 cl.1): the only widening is the author-date rule as worded in scope[0] (3), operator-confirmed with this plan, and the operator's word on the build's final diff is still needed for the code (the sidecar binds only the arrival.yaml line and SA-07); any looser variant (any commit in the PR, a commit date, a later own commit, an open-start window, no grace bound) is a plan amendment that goes to the operator first."
  - "The arrival.yaml line and SA-07 land word for word as the approved-text sidecar docs/plans/approved/arrival-lost-window-author-date.yaml binds them (Decision 246)."
  - "Fail closed (Decision 250 cl.2): a failed, truncated (250 commits) or empty commit lookup, or an unreadable own author date, an unreadable page or commit message, leaves the key missing; nothing the new read returns can make an otherwise-red run unreadable or green except an own-trailer author date inside a recorded window with a from, on a PR opened within the grace after that same window's end."
  - "lost_windows, excused_sessions and their grammar are unchanged; the 01G2j5ReQ5S6d1QP6Rv4GJRi excused row (owner rec-5055, added for rec-5081) stays as a standing guard (Decision 244); retiring it later is its own operator-approved change."
  - "The default of the new judge keyword is no lookup and an absent authored_grace_days turns the rule off, so every existing caller and node keeps today's behaviour."
