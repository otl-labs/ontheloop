      t = chr(10).join(sp.lines(res)); print(t); raise SystemExit(0 if res.missing == 0 and res.lost_window_authored >= 1
      and 'ARRIVAL_LOST_WINDOW_AUTHORED sha=6f71e3679d7a' in t else 1)"
    expected: >-
      the shipped run reads missing=0 (or skipped); the in-memory run (the shipped config without the
      01G2j5ReQ5S6d1QP6Rv4GJRi row, through run() so the production wiring is exercised, now capped at
      2026-11-12T12:00Z so 6f71e367 stays inside judge_days whenever the build runs while merges in the last real hour
      stay pending) reads missing=0 with lost_window_authored at least 1 and prints ARRIVAL_LOST_WINDOW_AUTHORED
      sha=6f71e3679d7a; exit 0. Red before (current code): missing=1 with ARRIVAL_MISSING sha=6f71e3679d7a, exit 1.
      Record both outputs in the PR body.
    fix_if: >-
      missing=1 on 6f71e367 in the in-memory run: the adapter, the wiring or the window test is wrong; a missing sha
      with no outage-era commit is a real capture failure: stop and report to the coordinator, never excuse it
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-6 carry the durable regressions.
  - step: 11
    phase: post-deploy
    action: telemetry-arrival on main after the merge.
    command: >-
      set -o pipefail; AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_verify arrival | tee /dev/stderr |
      grep ' lost_window_authored=[0-9]* authored_lookup_failed=' >/dev/null
    expected: >-
      run from an up-to-date main checkout after the merge; exit 0; the ARRIVAL line carries lost_window_authored=N and reads status green or skipped; record the next
      telemetry-arrival run id on main (a workflow_dispatch run on main counts when the scheduled run is late).
    fix_if: "missing>0: read the sha's PR commits' author dates against the windows; a key with no outage-era commit is a real red for ci-rca"
    hermetic: false
  - step: 12
    phase: post-deploy
    action: rec-5084 is closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5084']); print(rows[0]['id'], rows[0]['status']) if rows else print('absent'); raise
      SystemExit(0 if rows and rows[0]['status'] == 'closed' else 1)"
    expected: prints rec-5084 closed and exits 0 after the closure job runs on the merge commit; record that run id.
    fix_if: still open -- read the closure job's log for an acceptance refusal; fix the cause and re-run the closure route, never a direct status write
    hermetic: false
