  - {gate: wording-check, round: 1, verdict: PASS, digest: fd5bda644de51f583179d5bb7cdcc88452db294a8f35b9318b8ec8038457969d, base: 6d01c076304fbbac0c3c34d8548474a7eecdf0c1, selection: complete}  # pragma: allowlist secret
