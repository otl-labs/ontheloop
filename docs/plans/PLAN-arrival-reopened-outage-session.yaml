  - "Add the graduated shard config/agent/verification_registry/entries/arrival-config-excuses-reopened-rec-5055-session.yaml (VP 1's graduation, same shape as arrival-config-excuses-rec-5004-key.yaml)."
  - "CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true; commit with Resolves: rec-5081 in the message; git fetch origin main && git rebase origin/main; VP 3; VP 4; VP 5 (full tier backgrounded from the top-level session, then --verify-head; a timeout is BLOCKED, no push); push; open the PR; subscribe; code review in a fresh context; merge on code review PROCEED and green CI with Resolves: rec-5081 in the squash body; then VP 6 and 7, reporting PR number, run ids and merge SHA."
