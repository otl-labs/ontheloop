schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: arrival-trailer-attribution
intent: >-
  Clear the Critical telemetry-arrival red rec-5004 (squash 6d1d1f14, PR #1909, carries a Claude-Session trailer naming
  the never-captured Project Review coordinator session instead of the build thread that made it) by excusing that one
  misattributed key, and stop the class recurring: the trailer is stamped from the session's own identity at commit
  time instead of typed (verified by a commit-msg backstop), and a squash merge must carry exactly the trailers the PR's
  own commits carry, so the arrival oracle's denominator stays a list of sessions
  that really did the work (NS.6: telemetry evidence proven, not assumed).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-arrival-trailer-attribution.yaml
phase: >-
  ci_rca (soft-warn exception category): Track B repair of rec-5004 under docs/contracts/red-main-recovery.yaml
  (Decision 226). No tier_item is targeted and no exit criterion is closed, so closes_criteria is empty.
closes_criteria: []
scope:
  - file: config/telemetry/arrival.yaml
    action: Modify
    purpose: >-
      excused_sessions gains `- {key: 01XZubGwhX1EcdnXkxC6BKfL, owner: rec-5004}` after the rec-4939 row, in the same
      flow-mapping shape. A denominator correction, not a softening (Decision 235 cl.1): the session that built #1909
      (01XZubGz16F8B1WK9XX9uyEZ) is a captured root (parser v9, 952 rows), and the trailer named its parent coordinator,
      a hearth channel session that is never captured. Nothing else in the file changes.
    new_imports: []
  - file: scripts/session/session_trailer.py
    action: Create
    purpose: >-
      Leaf module: standard library only (re, os, subprocess, sys, pathlib, typing), never importing
      scripts.telemetry_verify (its package __init__ pulls alarms, compare, monitor and dedupe ->
      src.common.ducklake_event_reads, far too heavy for a commit-msg hook or the merge-gate fixture project).
      Import never raises. Public surface:
      (1) TRAILER, the oracle's own pattern, byte-identical to session_presence._TRAILER:
      re.compile(r"^Claude-Session:[ \t]*(\S+)[ \t]*$", re.MULTILINE).
      (2) normalise(value) -> str | None: strips one leading session_ or cse_ prefix, None for a non-str or an empty
      result (the same rule as completeness.normalise_key; the parity test pins it).
      (3) trailer_keys(message) -> list[str]: for each TRAILER match, normalise(url.rstrip("/").rsplit("/", 1)[-1]),
      Nones dropped, in match order, duplicates kept (the same list session_presence._session_keys returns for a
      commit whose body is `message`).
      (4) own_key(environ) -> str | None: normalise(environ.get("CLAUDE_CODE_REMOTE_SESSION_ID", "").strip()).
      (5) trailer_line(key) -> "Claude-Session: https://claude.ai/code/session_<key>".
      (6) foreign_to_session(message, environ) -> list[str] | None: None when own_key is None (the check skips:
      local CLI, CI runners); else the distinct trailer keys, first-seen order, that are not own_key.
      (7) branch_keys(root, base, head) -> set[str]: the trailer keys of every commit in base..head, read by one
      `git log --format=%B%x1e base..head` (subprocess, encoding utf-8, errors replace); raises TrailerReadError on a
      non-zero git exit.
      (8) mismatch(message, branch: set[str]) -> tuple[list[str], list[str]]: (extra, missing) -- the distinct trailer
      keys of `message` not in `branch`, and the keys of `branch` the message lacks; set EQUALITY passes when both are
      empty (an empty branch set means the squash must carry no trailer). Equality, not subset: dropping a key would
      hide a session the oracle should judge (Fable advice, rec. 2).
      (8a) stamp(path, environ, root) for `prepare-commit-msg <file>`: when own_key is None, or a sequencer
      operation is in progress (any of `git rev-parse --git-path` rebase-merge, rebase-apply (dirs), CHERRY_PICK_HEAD,
      REVERT_HEAD exists: probed 2026-11-08 on git 2.43.0, a rebase pick and a cherry-pick both run prepare-commit-msg
      with source "message", so a naive stamp would re-attribute another session's rebased commits), the file is left
      byte-identical; otherwise every line of the file matching TRAILER (anywhere in the message, not only the trailer
      block) is removed, then `git interpret-trailers --in-place --trailer "<trailer_line(own_key)>" <file>` adds the
      own line (git's own trailer-block and comment handling). Never `--if-exists replace`: probed by the round-1
      critic on git 2.43.0, it deletes only the closest same-key trailer, so a second typed session_A survives beside
      the own line. The only Claude-Session key in the result is own_key. The commit-msg check (11) stays as the
      backstop for any path where the stamp did not run. prepare-commit-msg is not skipped by --no-verify, so a
      bypassed commit is still stamped. `git commit --amend` (source "commit") is restamped with the amending
      session's key (it made the new commit); a single `git revert` writes no REVERT_HEAD before the hook (critic
      probe), so it is stamped too, which is harmless because a revert message carries no original trailer.
      (9) premerge_attribution(*, root, base, message) -> bool (keyword-only), the whole premerge leg, printing its own lines: branch =
      branch_keys(root, base, "HEAD"); both sets empty -> True, silent; a mismatch prints `PREMERGE ATTRIBUTION
      MISMATCH extra=[...] missing=[...]`, `  remedy: the squash message must carry exactly these lines:` and one
      `  <trailer_line(key)>` per branch key (or `  (none)`), -> False; a TrailerReadError prints `PREMERGE ATTRIBUTION
      UNAVAILABLE <reason>` -> False; else `PREMERGE ATTRIBUTION OK` -> True.
      (10) gate_denial(*, root, base_ref, head_ref, message) -> str | None (keyword-only), the merge-gate core (Decision 203: the
      adapter is plumbing): None when the trailer keys of `message` equal the branch keys of
      merge-base(base_ref, head_ref)..head_ref (both empty included); else the denial text "attribution:
      commit_message Claude-Session trailers must equal the PR branch commits' (extra <keys>, missing <keys>); use
      exactly: <lines or none>" (deny with the expected block, never a silent rewrite); an unresolvable merge-base or a TrailerReadError returns "attribution UNAVAILABLE: <reason>" (the
      adapter denies either way).
      Neither (9) nor (10) reads an environment variable: a coordinator merging a thread's PR keeps the thread's own
      trailer (decision-scout Decision 250 SPIRIT WARN), and neither calls the reader or warehouse (Decision 250
      cl.4).
      (11) main(argv): `prepare-commit-msg <file> [source] [sha]` runs (8a), exit 0 (a git failure prints its reason
      and exits 1, so the commit stops rather than landing unstamped); `commit-msg <file>` (the file pre-commit passes) exits 0, silent, while the same sequencer probe as (8a) is true
      (round-3 critic probe on git 2.43.0: `git cherry-pick --continue` after a conflict, and a `git commit` during a
      stopped rebase, both run commit-msg, and the stamp has rightly skipped, so the picked commit keeps another
      session's trailer; only `git rebase --continue` skips commit-msg); otherwise it reads the message;
      foreign_to_session None or empty -> exit 0, silent; otherwise stderr names the foreign keys, prints "replace the trailer with:" and
      trailer_line(own_key), exit 1. An unreadable file -> stderr reason, exit 1. A missing or unknown verb -> usage,
      exit 2.
      A commit with no trailer passes: the oracle counts untrailered commits and never judges them, and requiring a
      trailer is out of scope.
    new_imports: []
  - file: .pre-commit-config.yaml
    action: Modify
    purpose: >-
      Two top-level keys before repos:, `default_install_hook_types: [pre-commit, prepare-commit-msg, commit-msg]` (so
      the per-session `.venv/bin/pre-commit install` in .claude/hooks/session_start_precommit.sh also writes
      .git/hooks/prepare-commit-msg and .git/hooks/commit-msg, with no change to that hook) and `default_stages: [pre-commit]` (so every existing hook keeps running only at the
      pre-commit stage: probed 2026-11-08 with pre-commit 4.7.0, `pre-commit run --hook-stage commit-msg` on today's
      config runs check-added-large-files, check-merge-conflict, no-commit-to-branch, detect-secrets and
      block-sensitive-identifiers against the message file). The repo: local block gains two hooks: id
      claude-session-stamp, name "Stamp this session's Claude-Session trailer", language system, entry
      `bin/venv-python -m scripts.session.session_trailer prepare-commit-msg`, stages [prepare-commit-msg]; and id
      claude-session-trailer, name "Claude-Session trailer names this session", language system, entry
      `bin/venv-python -m scripts.session.session_trailer commit-msg`, stages [commit-msg]. No hook is removed or
      restaged away from pre-commit (Decision 235 cl.5 floor), and default_stages narrows nothing any hook runs at
      today: rg finds no `--hook-stage` or pre-push install outside docs/plans, and session_start_precommit.sh runs a
      bare `pre-commit install`, which today installs only the pre-commit type.
    new_imports: []
  - file: scripts/session/merge_step.py
    action: Modify
    purpose: >-
      cmd_premerge gains exactly one line and no branch, after the Resolves trailer check and before _preview: `ok =
      session_trailer.premerge_attribution(root=root, base=base, message=message_text) and ok`, where base is the merge-base cmd_premerge
      already computes and message_text is the message file's text, read once into a local and reused by
      _parsed_trailer (today it is read inline). The import is local to cmd_premerge like its siblings. Every premerge
      test already runs this line, so the mirror suite tests/test_session_merge_step.py (490 of 500 SLOC, NEAR_CAP)
      keeps 100% coverage with no new node; the leg's behaviour is tested from the session_trailer suite through
      ms.main.
    new_imports:
      - scripts.session.session_trailer
  - file: .claude/hooks/merge_gate.py
    action: Modify
    purpose: >-
      A second predicate on the Decision 245 seam, keyed on refs plus the payload's commit_message, after the overlap
      verdict is CLEAR (so the existing shallow-clone deepen has run and both refs are fetched): when tool_input carries
      a str commit_message (merge_pull_request; enable_pr_auto_merge has no message field and is unchanged),
      session_trailer.gate_denial(root=root, base_ref="refs/remotes/origin/main", head_ref=<the private PR ref>,
      message=commit_message), with _judge gaining the commit_message argument from run(); a non-None
      result denies through _deny (exit 2, fail closed, no override, Decision 245 cl.3, Decision 203). A non-str commit_message (present but not a string) denies as malformed. No
      commit_message, or one with no trailer, behaves exactly as today. The private ref cleanup in run()'s finally is
      unchanged. Docstring names this predicate beside the overlap one.
    new_imports:
      - scripts.session.session_trailer
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Decision 212 / AGENTS.md: SA-04 (merge gate adapter) adds the merge_pull_request commit_message payload field to
      the fields it assumes. A new structural_assumptions row, the next free SA id at build time (SA-10 if #1917's
      SA-09 has merged, else SA-09): the trailer attribution check assumes the harness exports
      CLAUDE_CODE_REMOTE_SESSION_ID as cse_ plus the same session key the harness's Claude-Session trailer URL ends in
      (session_ plus that key), that commands run from the session (git and its hooks) inherit it, and that a session
      without it (local CLI, CI runners) skips the commit check; location scripts/session/session_trailer.py, status
      open, owning_item "T4.24:c9". One amendment_log row at the top (date, semantic_break false, change_class
      field_add, summary naming PLAN-arrival-trailer-attribution and rec-5004, migration_story "Prose only; no code or
      contract consumer reads it.").
    new_imports: []
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Decision 245 cl.6 (the contract records the gate mechanism). push_pr_ci_merge_flow's merge sentence names the
      attribution predicate beside the overlap one: the merge gate also refuses a merge_pull_request whose
      commit_message's Claude-Session key set differs from the PR branch commits' (remedy: use the printed lines),
      and premerge carries the same check as its ATTRIBUTION leg. resolves_trailer's PLACEMENT sentence (the one that
      names the mandated Co-Authored-By / Claude-Session footer) adds that in a CC-web session the prepare-commit-msg
      hook stamps the Claude-Session line from CLAUDE_CODE_REMOTE_SESSION_ID and a commit-msg hook verifies it, so a
      typed line is replaced. merge_step_coverage appends: attribution (rec-5004): the commit stamp and check are client hooks
      (bypass residuals: GitHub API commits, sessions outside CC-web, commit_title; owners rec-5009, rec-5011); the
      merge-time equality is mechanical at the merge gate for merges that pass a commit_message and procedural at
      premerge; merges without a commit_message rely on the repository squash default (rec-5010); SKIP= on the two
      hook ids bypasses both client hooks (owner rec-5011) and is also the operator's release valve if the stamp
      breaks commits. referenced_repo_paths gains scripts/session/session_trailer.py only. contract_version 13 -> 14
      and one amendment_log row at the top (semantic_break true, change_class field_add, summary naming
      PLAN-arrival-trailer-attribution and rec-5004). validate_git_ops_contract stays green.
      SIZE (NEAR_CAP: plan_obligations measured 497 of 500 effective lines, headroom 3): every prose addition is
      folded into an existing line (the PLACEMENT line, the push_pr_ci_merge_flow merge line, the final line of
      the merge_step_coverage folded scalar) and no new key or sub-key is added, so the net change is +2 lines (one path, one
      amendment row) to 499. Measured at build with plan_obligations before commit; a result over 500 stops the build
      BLOCKED for a plan amendment, never a budget raise.
    new_imports: []
  - file: tests/test_session_session_trailer.py
    action: Create
    purpose: >-
      The mirror suite for session_trailer.py (map_source_to_test). Every test pins the variable with monkeypatch
      (setenv or delenv), never inheriting the session's own. Nodes:
      test_a_foreign_key_fails (variable cse_OWN, message trailer session_OTHER -> ["OTHER"], and main(commit-msg)
      exits 1 printing the line for OWN);
      test_the_own_key_passes (trailer session_OWN, either prefix in the variable -> [] and exit 0);
      test_an_unset_or_empty_variable_skips (delenv and setenv "" -> None and exit 0 on a foreign trailer);
      test_an_untrailered_message_passes;
      test_parity_with_the_arrival_oracle (for a corpus of bodies -- none, one, two, duplicate, trailing slash,
      cse_ and session_ prefixes, a bare key, a mid-paragraph line, an indented line, a trailer with trailing spaces --
      trailer_keys(body) == session_presence._session_keys(Commit(..., body)), normalise(v) ==
      completeness.normalise_key(v) for each value incl. "", "session_", None and an int, and TRAILER.pattern ==
      session_presence._TRAILER.pattern; the test may import the oracle, the module may not);
      test_parity_over_main_history (the same list equality over every first-parent commit body on HEAD's history,
      at least 20 bodies, skipped only when git is unavailable);
      test_branch_keys_reads_only_the_range (tmp repo: a base commit trailered A, branch commits B and none ->
      {"B"}; a bad ref raises TrailerReadError);
      test_mismatch_is_set_equality (extra and missing both reported; equal sets, duplicates and prefixes pass; empty
      branch set with an untrailered message passes, with a trailered one fails);
      TestStamp (variable set: a typed foreign trailer is replaced by the own line; no trailer -> the own line is added
      as a trailer; two typed keys (session_A, session_B, then a Co-Authored-By line) and a mid-body line -> the only
      Claude-Session key in the result, by trailer_keys, is OWN, and Co-Authored-By survives; the file is byte-identical when the variable is unset and
      when each of rebase-merge, rebase-apply, CHERRY_PICK_HEAD and REVERT_HEAD exists in a tmp repo's git dir);
      test_stamp_then_check_on_a_real_commit and test_rebase_keeps_another_sessions_trailer (tmp repo whose
      .git/hooks prepare-commit-msg and commit-msg run `<sys.executable> -m scripts.session.session_trailer <verb>
      "$@"` with the repo root on PYTHONPATH and the variable cse_OWN: `git commit -m x -m "Claude-Session:
      .../session_OTHER"` lands carrying only session_OWN; a mid-body foreign line outside the trailer block is
      stamped away (only OWN remains); a commit-msg run on a message the stamp did not touch (a foreign line, variable
      set) refuses with HEAD unchanged; a branch commit made with the variable cse_A, rebased onto a new main
      commit under cse_B, still carries session_A; a --no-verify commit with two typed foreign keys lands carrying only
      session_OWN; a cse_A commit cherry-picked with a conflict under cse_B, resolved and finished with
      `GIT_EDITOR=true git cherry-pick --continue`, lands carrying session_A, and so does a `git commit` made under cse_B
      during a stopped rebase of a cse_A commit, both with commit-msg exiting 0); test_pre_commit_runs_the_hooks
      (hermetic, no network: a tmp repo holding a copy of this .pre-commit-config.yaml reduced to its repo: local
      hooks, with the repo root on PYTHONPATH and the variable pinned to cse_OWN, `bin/venv-python -m pre_commit run
      --hook-stage commit-msg --commit-msg-filename <tmp>` fails on a session_OTHER message and passes on session_OWN,
      and `--hook-stage prepare-commit-msg` rewrites session_OTHER to session_OWN). The file stays at or under 450 SLOC, measured at build; a crossing is a decomposition, never a
      raise.
      TestPremergeAttribution through ms.main premerge on tests/fixtures/merge_step_repos.make_pr_branch with a branch
      commit message carrying `Claude-Session: https://claude.ai/code/session_BUILD` beside the Resolves trailer: a
      squash message naming session_COORD exits 1 with PREMERGE ATTRIBUTION MISMATCH extra=[COORD] missing=[BUILD]
      and BUILD's line under the remedy; one naming session_BUILD (or cse_BUILD) prints PREMERGE ATTRIBUTION OK; an
      untrailered message exits 1 with missing=[BUILD] (dropping a key is refused); a branch with no trailered commit
      and an untrailered message prints no ATTRIBUTION line; each verdict is the same with CLAUDE_CODE_REMOTE_SESSION_ID set to cse_COORD and unset; an
      unreadable range (base not a commit) prints ATTRIBUTION UNAVAILABLE;
      test_gate_denial (tmp repo: None for equal sets, including both empty; the attribution text for an extra key and
      for a missing key; the UNAVAILABLE text for a bad ref);
      test_the_commit_msg_hook_is_declared (yaml-load .pre-commit-config.yaml: default_install_hook_types holds
      pre-commit, prepare-commit-msg and commit-msg, default_stages == ["pre-commit"], hooks claude-session-stamp
      (stages ["prepare-commit-msg"]) and claude-session-trailer (stages ["commit-msg"]) carry the entries above).
  - file: tests/telemetry_verify/test_session_presence.py
    action: Modify
    purpose: >-
      New node test_the_shipped_config_excuses_the_rec_5004_key: load_config(ROOT) passes check_config, and
      run([commit(1, "01XZubGwhX1EcdnXkxC6BKfL")], Roots([]), load_config(ROOT)) has excused 1, missing 0, status not
      red. Red before (the key is not excused). Existing nodes byte-identical.
  - file: tests/hooks/test_merge_gate.py
    action: Modify
    purpose: >-
      New nodes, through the real shim: test_foreign_trailer_in_commit_message_denies (a PR whose branch commit carries
      session_BUILD, payload commit_message naming session_COORD: exit 2, stderr carries "attribution" and BUILD's
      line); test_branch_trailer_in_commit_message_allows (commit_message naming exactly session_BUILD);
      test_dropped_branch_trailer_denies (an untrailered commit_message on that PR: exit 2, missing BUILD);
      test_no_commit_message_or_no_trailer_unchanged (no commit_message on that PR, and an untrailered commit_message
      on the existing untrailered clear PR, both allow); test_non_string_commit_message_denies. Existing nodes unchanged.
  - file: tests/fixtures/merge_overlap_repos.py
    action: Modify
    purpose: >-
      install_project also copies scripts/session/session_trailer.py (the adapter now imports it); branch_pr gains an
      optional `message` keyword (default f"pr {number}", so every existing caller is unchanged) passed to commit().
bundled_recommendations: [rec-5004]
followon_recs: [rec-5009, rec-5010, rec-5011]
infrastructure_dependencies: []
acceptance_criteria:
  - "config/telemetry/arrival.yaml excuses 01XZubGwhX1EcdnXkxC6BKfL owned by rec-5004, and the shipped config turns a lone uncaptured commit with that key into excused=1 missing=0."
  - "In a session with CLAUDE_CODE_REMOTE_SESSION_ID set, every git commit lands carrying exactly one Claude-Session key, this session's, whatever the agent typed (stamped by prepare-commit-msg, even under --no-verify), except a pick inside a rebase or cherry-pick sequence, which keeps its original trailer; the commit-msg backstop refuses a foreign key on any path the stamp did not run and prints the correct line; with the variable unset both hooks leave the commit untouched."
  - "scripts.session.merge_step premerge refuses a squash message whose Claude-Session key set differs from the branch commits' set (an extra or a dropped key), prints the exact expected lines, and passes equal sets, whatever the merging session's own id."
  - "The merge gate denies mcp__github__merge_pull_request when commit_message's Claude-Session key set differs from the PR branch commits' set, fail closed, and is unchanged for merges without a commit_message."
  - "The new parser equals the arrival oracle's on a fixed corpus and on main's first-parent history; the oracle's code and missing semantics (Decision 250 cl.5) are unchanged."
  - "After merge, telemetry-arrival on main reports status=green with missing=0 (or skipped, never red), and rec-5004 closes from the build's Resolves trailer through the Decision 186 closure obligation, resolving the closure_artifact shard:session-trailer-commit-check recorded at plan write against the merge sha."
