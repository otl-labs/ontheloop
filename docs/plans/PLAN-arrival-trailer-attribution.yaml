    command: >-
      bin/venv-python -m pytest "tests/hooks/test_merge_gate.py::test_foreign_trailer_in_commit_message_denies"
      "tests/hooks/test_merge_gate.py::test_branch_trailer_in_commit_message_allows"
      "tests/hooks/test_merge_gate.py::test_dropped_branch_trailer_denies"
      "tests/hooks/test_merge_gate.py::test_no_commit_message_or_no_trailer_unchanged"
      "tests/hooks/test_merge_gate.py::test_non_string_commit_message_denies" -q
    expected: exit 0; red before (nodes absent).
    fix_if: the foreign case exits 0, or a payload without commit_message changes verdict
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: merge-gate-trailer-attribution
  - step: 6
    phase: pre-deploy
    action: Every touched suite in full, the oracle's included.
    command: >-
      bin/venv-python -m pytest tests/test_session_session_trailer.py tests/telemetry_verify/test_session_presence.py
      tests/test_session_merge_step.py tests/hooks/test_merge_gate.py tests/hooks/test_merge_gate_shim.py -q &&
      bin/venv-python -c "from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as f; failed=[]; f(failed); raise SystemExit(1 if failed else 0)" &&
      bin/venv-python -c "from scripts.checks.contracts.validate_git_ops_contract import validate_git_ops_contract as f; failed=[]; f(failed); raise SystemExit(1 if failed else 0)"
    expected: exit 0
    fix_if: a pre-existing node fails (fix the code, never the node; Decision 235)
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Whole-file re-runs of suites already in the --pre pytest_diff set; steps 1-5 carry the durable regressions.
  - step: 7
    phase: pre-deploy
    action: >-
      Run AFTER the build commit (the worktree is built from HEAD, so HEAD must already carry the new config and module;
      before it, the hooks read the old config and the probe is red) and before the rebase and VP 8.
      The installed hooks stamp this session's trailer over two typed foreign ones in a detached throwaway worktree of
      this checkout (its .venv symlinked in, the scripts/verification_graduation.py worktree pattern; a worktree with no
      .venv now stops every commit loudly, because bin/venv-python refuses a non-venv interpreter, which is accepted),
      and no existing hook runs at the commit-msg or prepare-commit-msg stage. Run in the implementing CC-web session
      (CLAUDE_CODE_REMOTE_SESSION_ID set, which also proves hook processes inherit it) after `.venv/bin/pre-commit
      install`; the worktree is removed afterwards and no branch is created.
    command: >-
      .venv/bin/pre-commit install && test -x .git/hooks/commit-msg && test -x .git/hooks/prepare-commit-msg &&
      own=${CLAUDE_CODE_REMOTE_SESSION_ID#cse_} && test -n "$own" && T=$(mktemp -d) &&
      git worktree add -q --detach "$T/w" HEAD && ln -s "$PWD/.venv" "$T/w/.venv" && (cd "$T/w" &&
      git commit --allow-empty -q -m probe -m "Claude-Session: https://claude.ai/code/session_PROBEA" -m
      "Claude-Session: https://claude.ai/code/session_PROBEB" && test "$(git log -1 --format=%B | grep -c
      '^Claude-Session:')" = 1 && git log -1 --format=%B | grep -qx "Claude-Session: https://claude.ai/code/session_$own");
      rc=$?; git worktree remove --force "$T/w"; test $rc -eq 0 && printf 'p\n\nClaude-Session:
      https://claude.ai/code/session_%s\n' "$own" > "$T/m" && out=$(for st in commit-msg prepare-commit-msg; do
      .venv/bin/pre-commit run --hook-stage $st --commit-msg-filename "$T/m" 2>&1; done); echo "$out" | grep -qE
      '^Claude-Session trailer names this session[.]+Passed$' && echo "$out" | grep -qE "^Stamp this session's
      Claude-Session trailer[.]+Passed$" && test "$(echo "$out" | grep -E '[.]{3,}.*(Passed|Failed|Skipped)$' | grep -v
      "^Claude-Session trailer names this session\|^Stamp this session's" | wc -l)" -eq 0
    expected: >-
      exit 0: both hooks are installed, the probe commit carries exactly one Claude-Session line, this session's, the
      probe worktree is gone, both new hooks print a Passed status line at their stages (a pre-commit error or an
      unstaged config cannot pass vacuously), and no other hook's status line appears at either stage.
    fix_if: the probe commit keeps PROBEA or PROBEB (hook not wired, the variable not inherited by hooks, or the step ran before the build commit), a new hook prints no Passed line, or another hook runs at those stages (default_stages missing)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Needs the live session variable and the installed .git hook, which CI lacks; steps 2 and 6 carry the durable regressions.
  - step: 8
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-5 carry the durable regressions.
  - step: 9
    phase: post-deploy
    action: The arrival oracle is no longer red on main.
    command: AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_verify arrival
    expected: >-
      the ARRIVAL line reads status=green (or skipped) with missing=0 and excused>=1 (the rec-5004 key, while 6d1d1f14
      is inside judge_days, to 2026-11-11T01:09Z; excused is 2 only while the rec-4939 key's 9a4fd4bd,
      2026-11-06T01:01:27Z, is still judged, to 2026-11-09T01:01Z); also record the next telemetry-arrival workflow run id on main and its status.
    fix_if: "missing>0 on another sha is a new red: run the rec-5004 RCA method (get_session on the key) before suspecting capture"
    hermetic: false
  - step: 10
    phase: post-deploy
    action: >-
      rec-5004 is closed by the merge's Resolves trailer through the Decision 186 closure obligation: rec-5004 is
      escape-classified (escape_class no-edge), and its closure_artifact shard:session-trailer-commit-check was recorded
      at plan write, so the trailer closure's closure_fix_sha resolves it once the shard (VP 2's graduation) is on main.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5004']); print(rows[0]['id'], rows[0]['status'])"
    expected: prints rec-5004 closed after the closure job runs on the merge commit; record that run id.
    fix_if: >-
      still open: read the closure job's log for a ClosureArtifactRequired or acceptance refusal marker (it exits 0 and
      leaves the rec open). Leading causes: the squash body lacks Resolves for rec-5004, or the
      session-trailer-commit-check shard is not on main. Never close it with a direct status write after a Decision 186
      refusal (implement.md); fix the cause and re-run the closure route.
    hermetic: false
