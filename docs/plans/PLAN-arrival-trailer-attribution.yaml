    command: bin/venv-python -m pytest "tests/telemetry_verify/test_session_presence.py::test_the_shipped_config_excuses_the_rec_5004_key" -q
    expected: exit 0; red before (node absent, and with the node but no config row, missing=1).
    fix_if: excused stays 0 (key typo or owner pattern refused by check_config)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: arrival-config-excuses-rec-5004-key
  - step: 2
