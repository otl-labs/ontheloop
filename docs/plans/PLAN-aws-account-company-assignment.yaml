schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: aws-account-company-assignment
intent: 'Move the platform''s AWS account to On The Loop Labs Limited without rebuilding anything: the operator assigns the
  existing account in place (root e-mail, contacts, tax, payment) and deletes the leftover one-account Organization and its
  unused Identity Center, the choice is recorded as a numbered Decision amending Decision 106 and discharging Decision 195''s
  account-move-decided condition, and NS.2 states the company fact once the platform is proven.'
implementation_declared: false
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-aws-account-company-assignment.yaml
phase: user_explicit_out_of_scope (soft-warn exception category) -- executes Decision 195 clause 3, the AWS stage of the company
  ownership move (project goal). No tier_item criterion claimed.
closes_criteria: []
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: 'Record PR: the new Decision (execution_steps step 5, verbatim) and dated annotations on Decisions 106 and 195
    (step 6). Closing PR: the Decision''s realised Update (step 16). No existing line is edited (Decision 177).'
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: 'Closing PR only: NS.2''s detail replaced by the approved text (step 15) once the platform proof passes.'
- file: docs/contracts/account-credential-inventory.yaml
  action: Modify
  purpose: 'Closing PR only, and only if the inventory contract (rec-4542) is on main: the AWS-01 and BILL-01 flips, the new
    AWS-02 row and three evidence_ledger entries (step 17). Otherwise untouched.'
bundled_recommendations: []
followon_recs:
- rec-4545
- rec-4546
infrastructure_dependencies:
- 'LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition. compute_affected_artifacts(<this plan''s
  scope>) returns {''data-pipeline'': [''docs/ROADMAP-PLATFORM.yaml'']}: the live roadmap is a packaged asset of the active
  data-pipeline artifact. No build, deploy or smoke test is owed: the closing PR''s change to that asset is data only (NS.2''s
  detail text; no packaged code), the artifact''s schedule stays disabled (its manifest; Decisions 61/37/116), a roadmap edit
  triggers no deploy, and the asset refreshes with the artifact''s next governed deploy. No other scope file is Lambda-packaged
  and no .tf file is in scope. Standing gap: rec-3990 (no new rec). Precedents: PLAN-retired-repo-identity-sweep, PLAN-work-graph-edge-model.'
acceptance_criteria:
- The new Decision, its annotations on Decisions 106 and 195, its realised Update and NS.2 match the operator-approved texts,
  varying only where execution_steps steps 4 and 14 allow (VP 4, 5, 14); neither PR deletes a line of docs/DECISIONS.md (VP
  5, 14).
- Console check C0 confirms the leftover Organization and Identity Center before the record PR merges (VP 3), and the Decision
  is in ops_decisions after it (VP 7).
- Identity Center and the leftover Organization are deleted after the billing export, verified from CloudTrail across all
  pages, with no new alarm (VP 8, 9, 10).
- The account's root e-mail, contacts (primary and all three alternates), tax settings and default payment method are the
  company's, verified from CloudTrail and the operator's screenshots (VP 11).
- 'The platform runs unchanged after the move: green CI on main (row P1), a green convergence record, CI''s assume-role into
  AWS after the move, DuckLake maintenance and maintenance-smoke runs without error, a live recommendation write, and a Claude
  Code thread''s merged PR (VP 12, 13, 15).'
- EVIDENCE.md carries every step by kind, with no id, e-mail, phone, tax or company number or amount (VP 3, 8, 15).
- When the inventory contract is on main at the closing PR, AWS-01 is proven, AWS-02 is retired and BILL-01 is moved, each
  with its ledger entry; otherwise the handoff names those moves (VP 14).
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'Start gate: the GitHub transfer is proven (docs/contracts/github-org-transfer.yaml identity.phase reads proven
    or predecessor_removed on origin/main; Decision 218; project stage order) and Decision 226''s red-main overlap check is
    clear for this plan.'
  command: git fetch -q origin main && git show origin/main:docs/contracts/github-org-transfer.yaml | bin/venv-python -c "import
    sys,yaml; ph=yaml.safe_load(sys.stdin)['identity']['phase']; assert ph in ('proven','predecessor_removed'), ph; print('TRANSFER_PROVEN',
    ph)" && bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-aws-account-company-assignment.yaml
  expected: Prints TRANSFER_PROVEN with the phase, then a JSON line whose verdict is clear (exit 0).
  fix_if: 'Phase not yet proven: stop and wait; the coordinator wakes this thread when the transfer is proven. A blocked or
    unavailable overlap verdict: hold and tell the coordinator (Decision 226).'
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: 'Baseline before any console step: T0 and the names of the alarms already in ALARM go into the durable state file
    in the project folder (no id or value in it). Written once: a later run keeps the existing baseline, so a deletion can
    never be re-baselined away.'
  command: "AWS_PROFILE=agent_platform_admin bin/venv-python - <<'PY'\nimport json, os, re, subprocess, datetime as dt\nS\
    \ = '/mnt/project-files/aws-account-path/build-state.json'\nE = '/mnt/project-files/aws-account-path/EVIDENCE.md'\nREDACT\
    \ = r'[0-9]{12}|@|\\u00a3|\\$[0-9]|GB ?[0-9]{9}|(?<![0-9])[0-9]{8}(?![0-9])|\\+[0-9]|(?<![0-9])0[0-9]{10}(?![0-9])|(?<![0-9])[0-9]{4}-[0-9]{4}-[0-9]{4}(?![0-9])|(?<![0-9])\\\
    (?0[0-9]{2,4}\\)?[ -][0-9]{3,4}[ -]?[0-9]{3,4}(?![0-9])|GB ?[0-9]{3} [0-9]{4} [0-9]{2}(?![0-9])'\ndef aws(*a):\n    return\
    \ json.loads(subprocess.run(['aws', *a, '--output', 'json'], check=True, capture_output=True, text=True).stdout)\ndef\
    \ ct(region, key, value, start):\n    out = aws('cloudtrail', 'lookup-events', '--region', region, '--start-time', start,\
    \ '--lookup-attributes', f'AttributeKey={key},AttributeValue={value}')\n    return [json.loads(e['CloudTrailEvent']) for\
    \ e in out['Events']]\ndef ok(evs):\n    return [e for e in evs if 'errorCode' not in e]\ndef alarms():\n    return sorted(aws('cloudwatch',\
    \ 'describe-alarms', '--region', 'eu-west-2', '--state-value', 'ALARM', '--query', 'MetricAlarms[].AlarmName'))\ndef no_new_alarm(s):\n\
    \    new = sorted(set(alarms()) - set(s['alarms_before']))\n    assert not new, ('new alarm', new)\nif os.path.exists(S):\n\
    \    s = json.load(open(S))\n    print('BASELINE_KEPT', s['t0'], 'alarms', len(s['alarms_before']))\n    raise SystemExit(0)\n\
    t0 = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat()\ns = {'t0': t0, 'alarms_before': alarms()}\n\
    json.dump(s, open(S, 'w'), indent=1)\nprint('BASELINE', t0, 'alarms', len(s['alarms_before']))\nPY"
  expected: Prints BASELINE with T0 and the count of alarms already in ALARM, or BASELINE_KEPT on a re-run.
  fix_if: 'An AWS error means the admin profile is unreachable: fix the session credentials, never proceed blind. Never delete
    the state file to re-baseline once C1 has started.'
  hermetic: false
  graduation: not-applicable
- step: 3
  phase: pre-deploy
  action: 'C0 gate, before the record PR: EVIDENCE.md row C0 reads pass, the file passes the redaction pattern, the state
    file carries the Identity Center home region the operator read in C0, and CloudTrail corroborates the leftover Organization
    (successful management-account ListDelegatedAdministrators calls in the last 7 days).'
  command: "AWS_PROFILE=agent_platform_admin bin/venv-python - <<'PY'\nimport json, os, re, subprocess, datetime as dt\nS\
    \ = '/mnt/project-files/aws-account-path/build-state.json'\nE = '/mnt/project-files/aws-account-path/EVIDENCE.md'\nREDACT\
    \ = r'[0-9]{12}|@|\\u00a3|\\$[0-9]|GB ?[0-9]{9}|(?<![0-9])[0-9]{8}(?![0-9])|\\+[0-9]|(?<![0-9])0[0-9]{10}(?![0-9])|(?<![0-9])[0-9]{4}-[0-9]{4}-[0-9]{4}(?![0-9])|(?<![0-9])\\\
    (?0[0-9]{2,4}\\)?[ -][0-9]{3,4}[ -]?[0-9]{3,4}(?![0-9])|GB ?[0-9]{3} [0-9]{4} [0-9]{2}(?![0-9])'\ndef aws(*a):\n    return\
    \ json.loads(subprocess.run(['aws', *a, '--output', 'json'], check=True, capture_output=True, text=True).stdout)\ndef\
    \ ct(region, key, value, start):\n    out = aws('cloudtrail', 'lookup-events', '--region', region, '--start-time', start,\
    \ '--lookup-attributes', f'AttributeKey={key},AttributeValue={value}')\n    return [json.loads(e['CloudTrailEvent']) for\
    \ e in out['Events']]\ndef ok(evs):\n    return [e for e in evs if 'errorCode' not in e]\ndef alarms():\n    return sorted(aws('cloudwatch',\
    \ 'describe-alarms', '--region', 'eu-west-2', '--state-value', 'ALARM', '--query', 'MetricAlarms[].AlarmName'))\ndef no_new_alarm(s):\n\
    \    new = sorted(set(alarms()) - set(s['alarms_before']))\n    assert not new, ('new alarm', new)\ns = json.load(open(S))\n\
    assert re.fullmatch(r'[a-z]{2}(-[a-z]+)+-[0-9]', s.get('idc_region', '')), 'C0 must record idc_region'\ne = open(E, encoding='utf-8').read()\n\
    assert re.search(r'^\\| C0 \\|.*\\| pass \\|', e, re.M), 'row C0 missing or not pass'\nassert not re.search(REDACT, e),\
    \ 'EVIDENCE.md redaction hit'\nweek = (dt.datetime.now(dt.timezone.utc) - dt.timedelta(days=7)).replace(microsecond=0).isoformat()\n\
