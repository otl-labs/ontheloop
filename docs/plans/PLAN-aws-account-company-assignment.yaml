constraints:
- 'Approved texts are verbatim (context gives the approval message). Allowed variance: the Decision number, the dates, the
  follow-on rec ids, the NS.2 parenthetical term the registry entry pins, and the bracketed IP sentence''s presence. Any other
  wording change, including one critique or code review asks for, goes to the coordinator, then the operator, before merge.'
- Every account-level action is the operator's, in the AWS console (Decision 126; project always-ask list). The agent runs
  only read-only AWS calls (CloudTrail, CloudWatch, S3 reads) and ops-portal writes. No IAM, Terraform, Organizations or billing
  API mutation by an agent.
- 'Order is fixed: baseline and C0 before the record PR; C1 before C2; C2 before C3; C4 last; the closing PR only after VP
  12 and 13 pass. The baseline is written once and never re-taken.'
- No account id, organization id, e-mail, phone, address, tax or company number, card detail, invoice amount or screenshot
  enters the repository, a PR, memory or the shared folder (Decision 101). Evidence is recorded by kind and UTC time.
- No new AWS account and no AWS Organization are created (Decision 77 cl.5, Decision 144 cl.6). The personal card is not removed
  in this plan.
- A failed or drifted console step halts this workstream until root-caused; never a silent retry.
- No rescue agents or workaround loops (Decision 55).
