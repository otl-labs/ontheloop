    assert n > 0, 'no successful ListDelegatedAdministrators in 7 days'\nprint('C0_GATE_OK', s['idc_region'], n)\nPY"
  expected: Prints C0_GATE_OK with the Identity Center region and a positive call count.
  fix_if: 'C0 not pass, no Organization or no Identity Center instance, or no corroborating calls: stop before the record
    PR and send the finding to the coordinator (the Decision text names both, so its wording returns to the operator). Identity
    Center users, groups, permission sets or applications, more than one account, a balance owed, a Seller of Record that
    is not the UK one, or credits that deletion would expire: escalate; never delete over a finding. A redaction hit: rewrite
    the row.'
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: pre-deploy
  action: 'Record PR only: the new Decision entry is exactly the approved text (execution_steps step 5) with only the number
    and the date substituted, sits above the previous newest entry, and is under the 6,144-byte cap.'
  command: 'bin/venv-python -c "import re,yaml; from pathlib import Path; md=Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    p=yaml.safe_load(open(''docs/plans/PLAN-aws-account-company-assignment.yaml'',encoding=''utf-8'')); steps=p[''execution_steps''];
    m=re.search(r''^## Decision (\d+): The platform AWS account is assigned in place'',''\n''+md,re.M) or re.search(r''^##
    Decision (\d+): The platform AWS account is assigned in place'',md,re.M); assert m, ''Decision entry absent''; n=m.group(1);
    want=[s for s in steps if s.startswith(''APPROVED DECISION TEXT'')][0].split(chr(10),1)[1]; d=re.search(r''\*\*Date:\*\*
    (\d{4}-\d{2}-\d{2})'',md[m.start():]).group(1); want=want.replace(''NNN'',n).replace(''2026-MM-DD'',d).rstrip(); start=md.index(want.split(chr(10),1)[0]);
    end=md.index(chr(10)+''---''+chr(10),start); got=md[start:end].rstrip(); assert got==want, ''entry differs from the approved
    text''; size=len(md[start:md.index(chr(10)+''## Decision '',start+5)].encode()); assert size<=6144, size; first=re.search(r''^##
    Decision (\d+):'',md,re.M).group(1); assert first==n, (first,n); print(''DECISION_TEXT_APPROVED'', n, size)"'
  expected: Prints DECISION_TEXT_APPROVED with the number and the entry's byte size (6,144 or less).
  fix_if: 'Any difference is an unapproved wording change: restore the approved text. Critique or code review asking for a
    wording change goes to the coordinator and the operator before merge; never re-word to fit.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A one-time binding of the record PR to operator-approved text that goes red by design once the
    closing PR appends the realised Update; the decision-entry conformance and size checks guard the entry's shape as standing
    checks.
- step: 5
  phase: pre-deploy
  action: 'Record PR only: the annotations on Decisions 106 and 195 (execution_steps step 6) are present verbatim, each inside
    its own entry; Decision 195''s reversal-conditions stanza survives; and the PR deletes no line of docs/DECISIONS.md (Decision
    177: bodies are append-only; no standing check enforces this since Decision 178).'
  command: 'bin/venv-python -c "import re,yaml; from pathlib import Path; md=Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    p=yaml.safe_load(open(''docs/plans/PLAN-aws-account-company-assignment.yaml'',encoding=''utf-8'')); steps=p[''execution_steps''];
    m=re.search(r''^## Decision (\d+): The platform AWS account is assigned in place'',''\n''+md,re.M) or re.search(r''^##
    Decision (\d+): The platform AWS account is assigned in place'',md,re.M); assert m, ''Decision entry absent''; n=m.group(1);
    a=[s for s in steps if s.startswith(''APPROVED ANNOTATIONS'')][0]; d=re.search(r''\*\*Date:\*\* (\d{4}-\d{2}-\d{2})'',md[m.start():]).group(1);
    parts=[x.split(chr(10),1)[1].strip().replace(''NNN'',n).replace(''2026-MM-DD'',d) for x in a.split(''@@'')[1:]]; sec=lambda
    k: md[md.index(''## Decision ''+k+'':''):md.index(chr(10)+''---''+chr(10),md.index(''## Decision ''+k+'':''))]; assert
    parts[0] in sec(''106''), ''106 annotation''; assert parts[1] in sec(''195''), ''195 annotation''; assert ''id: account-move-decided''
    in sec(''195''); print(''ANNOTATIONS_APPROVED'')" && git fetch -q origin main && test "$(git diff --numstat origin/main...HEAD
    -- docs/DECISIONS.md | cut -f2)" = 0 && echo NO_DECISION_LINE_DELETED'
  expected: Prints ANNOTATIONS_APPROVED, then NO_DECISION_LINE_DELETED.
  fix_if: 'A missing or altered annotation: re-apply step 6 verbatim. A deleted line: restore it; never edit an existing line
    of any body (Decision 177).'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A one-time binding of the record PR to operator-approved annotation text plus a per-PR diff check;
    a standing append-only guard is outside this plan's scope (Decision 178 retired the last one).
- step: 6
  phase: pre-deploy
  action: 'Record PR and closing PR: the decision-entry checks pass on the tree (envelope, size, reversal stanzas), then the
    full tier on the committed clean tree and --verify-head (docs/contracts/git-ops.yaml handoff_sequence). The full tier
    runs for about ten minutes: run it in the background with a timeout of 30 minutes or more; a timeout blocks, it never
    passes. Every fix or rebase commit needs a fresh run.'
  command: bin/venv-python -c "from scripts.checks.decisions.validate_decisions_size import validate_decisions_size; from
    scripts.checks.decisions.validate_decision_entry_conformance import validate_decision_entry_conformance; f=[]; validate_decisions_size(f);
    validate_decision_entry_conformance(f); assert not f, f; print('DECISION_CHECKS_OK')" && bin/venv-python -m scripts.validate
    && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Prints DECISION_CHECKS_OK, the full tier exits 0 with an empty failed-checks list, then --verify-head attests
    HEAD's tree.
  fix_if: Fix the entry's envelope or size within the approved text's variance; any wording change needs the operator.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Both decision checks are standing checks in the validate tiers and the full tier is structurally
    enforced by validate_handoff_full_tier; graduating them would duplicate.
- step: 7
  phase: post-deploy
  action: After the record PR's squash-merge, ETL the Decision to the warehouse and prove its row exists.
  command: 'bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md && bin/venv-python -c "import re; from pathlib
