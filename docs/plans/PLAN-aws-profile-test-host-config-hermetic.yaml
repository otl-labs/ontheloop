    Edit tests/test_aws_profile.py -- edits (a), (b) and (c) from the scope row, nothing else. Then run VP steps 1-7
    on the working tree; loop until pass; on an unrecoverable failure stop and RCA (Decision 55). Step 1's graduate
    disposition writes the registry shard config/agent/verification_registry/entries/aws-profile-test-ignores-host-shared-config.yaml
    (sanction-row covered, no scope row).
  - >-
    CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true in this plan
    after the step 1 shard is written; commit; git fetch origin main && git rebase origin/main (stop on conflict);
    re-run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-aws-profile-test-host-config-hermetic.yaml
    (deferral as in context); re-run VP 1-7 if the rebase moved a file they read; VP 8 on the committed, rebased,
