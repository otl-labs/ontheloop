    behavior: probe commands and the availability probe share the PID-namespace prefix; scratch removal retries a bounded number of times, then raises
    verification_step: 1
    command: bin/venv-python -m pytest tests/test_backlog_health_probe.py -q -k "pid_namespace or scratch_removal or bash_as_init"
    red_green_expectation: red before (prefix -rmn, no removal helper), green after
  - source: scripts/backlog_health/probe.py
    behavior: a timed-out probe command leaves no live descendant and run_one returns TIMEOUT without raising
    verification_step: 2
    test_selector: tests/test_backlog_health_probe.py::TestRunOne::test_timeout_kills_descendants
    red_green_expectation: red before (one survivor under -rmn), green after
  - source: scripts/backlog_health/probe.py
    behavior: "the inner program keeps bash as the namespace init (leading trap : EXIT && segment)"
    verification_step: 1
    test_selector: tests/test_backlog_health_probe.py::TestRunOne::test_inner_program_keeps_bash_as_init
    red_green_expectation: red before (no trap segment), green after
constraints:
  - "No verdict semantics change: PASS/FAIL/TIMEOUT/BUDGET_EXHAUSTED/ISOLATION_UNAVAILABLE and the timeouts are untouched (Decision 235: nothing loosened)."
  - "Local measurements ran as uid 0, which bypasses RLIMIT_NPROC, so the ulimit -u 64 interplay (one extra bash init process; zombie reaping) is exercised only on the runner, by VP 9 and VP 5."
  - "Bash stays the namespace init (leading trap : EXIT && segment), so the probed command is never PID 1: default-disposition signals keep working and orphans are reaped, so zombies do not accumulate against ulimit -u 64."
  - "The sandbox only tightens: the PID namespace is added to the existing user, mount and net namespaces, read-only bind and pid cap."
  - ".github/workflows/backlog-health.yml is not edited; its header comment's unshare -rmn wording is left for the next edit of that file."
  - "No rescue agents or workaround loops (Decision 55)."
