schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: backlog-health-probe-reaps-descendants
intent: >-
  Clear the backlog-health scheduled red (rec-5094; no scheduled success since 2026-10-26) by making each probe run in its
  own PID namespace, so a timed-out acceptance command leaves no descendant behind to write into the scratch dir while
  it is removed, and by retrying scratch removal so a lagging namespace teardown cannot crash the probe job (a real escape still does). Restores the backlog-health loop's
  weekly signal without changing any verdict.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-backlog-health-probe-reaps-descendants.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): repair of the backlog-health scheduled red the operator handed to CI
  Reform on 2026-11-17 (rec-5094, rec-3691). No tier_item is claimed and no exit criterion is closed.
closes_criteria: []
cites: [dec:55, dec:201, dec:235]
scope:
  - file: scripts/backlog_health/probe.py
    action: Modify
    purpose: >-
      (1) One module constant holds the namespace prefix, unshare -rpmn --fork --kill-child --mount-proc --, and both _isolated_argv
      and isolation_available build their argv from it, so the availability probe tests the exact primitive run_one
      uses. With a new PID namespace whose init is unshare's forked child, killing unshare on TimeoutExpired kills the
      namespace init (PR_SET_PDEATHSIG via --kill-child) and the kernel kills every process left in the namespace.
      --mount-proc gives the namespace its own /proc, so in-sandbox PIDs and /proc agree; without it (measured
      2026-11-17) tests/checks/test__process_group.py goes from 12 passed to 1 or 2 failed, a false FAIL verdict.
      _isolated_argv's inner program also starts with a leading trap : EXIT && segment, which turns off bash's exec
      optimisation of the last && member, so bash stays the namespace's PID 1 and reaps orphans while the probed
      command runs as an ordinary child (measured: sh -c 'read p _ < /proc/self/stat; test "$p" != 1' exits 1
      without the trap and 0 with it; exit status passes through, 3 -> 3).
      (2) run_one makes its scratch dir with tempfile.TemporaryDirectory(delete=False) (Python 3.12) and, in a finally,
      calls a private helper that retries td.cleanup() (re-callable after a failure; it keeps stdlib's own handling of
      read-only entries, so no hand-written onexc) on OSError up to 10 attempts 0.5 s apart (about 4.5 s, spent only on
      the failure path). The helper's sleep is a keyword-only parameter resolved at call time (sleep=None means
      time.sleep), never a run_one parameter, so no public signature changes. The namespace teardown is asynchronous to
      unshare's exit, so a just-killed descendant can lag by milliseconds; after the last attempt the helper re-raises
      the last OSError, so a real escape (the namespace did not engage) still fails the job loudly as today (Decision 55:
      no hidden workaround). A successful removal never changes a verdict; a final raise fails the job as today. (3) The module docstring, the isolation_available
      docstring (line 58) and the _isolated_argv comment (line 85) name unshare -rpmn --fork --kill-child --mount-proc and the
      descendant guarantee.
    new_imports: []
  - file: tests/test_backlog_health_probe.py
    action: Modify
    purpose: >-
      New nodes (TestRunOne::test_argv_uses_pid_namespace_prefix, TestIsolationAvailable::test_probes_pid_namespace_prefix,
      TestRunOne::test_scratch_removal_retries_then_succeeds, TestRunOne::test_scratch_removal_raises_after_bounded_retries,
      TestRunOne::test_timeout_kills_descendants, TestRunOne::test_proc_agrees_with_sandbox_pids, TestRunOne::test_inner_program_keeps_bash_as_init,
      TestRunOne::test_probed_command_is_not_namespace_init): run_one's argv starts with the shared PID-namespace prefix; isolation_available's argv starts with the
      same prefix; a scratch removal that fails once then succeeds leaves no dir and keeps the verdict (sleep patched); a removal that
      fails on every attempt raises OSError after exactly 10 attempts (sleep injected, so the node takes no wall time); and one live node (skipped only when
      the real primitive is unavailable) where a timed-out command whose descendant keeps writing into
      PYTHONPYCACHEPREFIX returns TIMEOUT with no surviving descendant and no OSError. test_uses_isolated_argv's -rmn
      membership assertion moves to the new prefix, and test_compound_command_runs_every_segment's prefix literal gains
      the leading trap : EXIT && segment (its command_portion == cmd assertion is unchanged). test_inner_program_keeps_bash_as_init
      (hermetic) asserts the inner program starts with trap : EXIT && ; test_probed_command_is_not_namespace_init (live,
      same skip) runs sh -c 'read p _ < /proc/self/stat; test "$p" != 1' through run_one and expects PASS (a forward guard
      against dropping the trap, not a red-before node).
      The prefix nodes assert the literal tokens -rpmn, --fork, --kill-child and --mount-proc in order before --, never equality with
      probe's own constant. The live nodes create repo_root = tmp_path / "repo" (mkdir before isolation_available, so the bind can succeed) and skip only when probe.isolation_available(repo_root) is false, with a skip
      reason starting "env: " (validate_test_skip_citations); its command has the shape { X & }; sleep 100, so only X is
      backgrounded and stays under the trap, mount and ulimit segments; X is a descendant carrying a unique argv
      marker that appends a heartbeat to a file outside the bind (in tmp_path) and writes into
      PYTHONPYCACHEPREFIX; the descendant heartbeats every 0.05 s; after run_one returns TIMEOUT (timeout=2, margin for a loaded host) it waits 1 s, asserts the
      heartbeat file exists and is non-empty (so the check is not vacuous), then asserts no /proc/*/cmdline holds
      the marker and the heartbeat file's size is unchanged across two reads 0.5 s apart; a finally pkills the marker so a red-before run leaves nothing
      behind. test_proc_agrees_with_sandbox_pids (live, same skip) runs read p _ < /proc/self/stat; test "$p" = "$BASHPID" through
      run_one and expects PASS (a forward guard, not a red-before node: it also passes on today's flags; measured: exit 1 under -rpmn --fork --kill-child, whose host /proc disagrees; exit 0 with
      --mount-proc). The module docstring's "Hermetic: never depends on a real unshare" sentence is rewritten to say every node
      is hermetic except test_timeout_kills_descendants, test_proc_agrees_with_sandbox_pids and
      test_probed_command_is_not_namespace_init, which need the real primitive and skip without it, including in every
      CI job that does not run the AppArmor sysctl; so the kill guarantee has no recurring CI regression beyond the
      argv-token nodes.
    new_imports: []
bundled_recommendations: [rec-3691]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "Every probe command and the availability probe run under unshare -rpmn --fork --kill-child --mount-proc, built from one shared prefix, and /proc inside agrees with the sandbox's own PIDs."
  - "A probe command that times out leaves no live descendant, and run_one returns TIMEOUT without raising."
  - "Scratch removal retries a lagging teardown (10 attempts, 0.5 s apart), never changes a verdict, and still raises if a directory cannot be removed."
  - "After merge, a dispatched backlog-health run on main (dry_run) and the next scheduled run both finish with the probe job green."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The new hermetic nodes pass (prefix shared by both argv builders; scratch removal retries and never raises).
    command: bin/venv-python -m pytest tests/test_backlog_health_probe.py -q -k "pid_namespace or scratch_removal or bash_as_init"
    expected: exit 0; red before (the prefix is -rmn and probe has no removal helper)
    fix_if: an argv lacks --fork or --kill-child, or a removal failure propagates
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: backlog-probe-reaps-descendants
  - step: 2
    phase: pre-deploy
    action: Live proof of the primitive in this container (real unshare); the node must run, not skip.
    command: bin/venv-python -m pytest "tests/test_backlog_health_probe.py::TestRunOne::test_timeout_kills_descendants" -q -rs
    expected: exit 0 with 1 passed and 0 skipped; red before (a descendant survives the timeout)
    fix_if: skipped (the container lacks user namespaces; record UNPROVEN-locally and rely on VP 9, then VP 5) or a survivor is found
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Depends on the host allowing unprivileged user and PID namespaces; VP 1 carries the durable regression.
  - step: 3
    phase: pre-deploy
    action: The whole probe suite still passes, including the graduated backlog-probe-* nodes.
    command: bin/venv-python -m pytest tests/test_backlog_health_probe.py tests/test_backlog_health___main__.py tests/test_backlog_health_workflow.py -q
    expected: exit 0
    fix_if: an existing node fails; the change touched verdict logic
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: The probe file is graduated whole (backlog-probe-never-false-pass) and the package suite by backlog-health-package-suite; the workflow test file is already run by the full tier, and step 1 carries the new regression.
  - step: 4
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 9
    phase: pre-deploy
    action: >-
      (Listed out of numeric order on purpose: it runs before merge, between VP 4 and VP 5.) Before merge, prove the
      primitive on a GitHub runner: dispatch backlog-health on the build PR's branch with
      dry_run=true (writes no rec) as a person or session identity, never otl-workflow-dispatcher[bot] (its runs skip
      census and so probe), so a -p failure never reaches the Decision 201 closure gate.
    command: gh workflow run backlog-health.yml --repo otl-labs/ontheloop --ref "$(git branch --show-current)" -f dry_run=true
    expected: >-
      the probe job concludes success, its log has no OSError, and it shows [backlog_health probe] ...
      isolation_available=True with a non-empty verdict count; record the run id in the PR body (from a session use mcp__github__actions_run_trigger with ref set to the branch).
    fix_if: >-
      probe is skipped (not proven: re-dispatch as another identity), or probe fails with OSError or every verdict is isolation_unavailable: -p or --mount-proc did not engage on the runner; stop
      and report, do not merge. Before dispatching, read whether the agent-platform-github-ci-branch role trusts non-main refs; if census fails on
      credentials, record that, tell the operator the merge then rests on VP 8's revert path alone (probeable trailer
      closures are refused until a revert, which fails safe), and rely on VP 5 and VP 8 after merge.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Remote dispatch on a branch ref; its exit code proves only that the dispatch happened, and the run outcome is read by hand.
  - step: 5
    phase: post-deploy
    action: Dispatch backlog-health on main with dry_run=true (writes no rec) and read its jobs.
    command: gh workflow run backlog-health.yml --repo otl-labs/ontheloop --ref main -f dry_run=true
    expected: >-
      the run's census, probe and escalate jobs conclude success and the probe log shows [backlog_health probe] ...
      isolation_available=True with a non-empty verdict count (job success alone is not proof: an empty payload with
      isolation off still exits 0) (a skipped probe is not success: dispatch as a person or session identity, never otl-workflow-dispatcher[bot], whose runs skip census); record the run id. (From a session, use the
      mcp__github__actions_run_trigger equivalent and read jobs with actions_list list_workflow_jobs.)
    fix_if: >-
      probe fails with the same OSError: the namespace flags did not engage on the runner; any other failure in census
      or escalate is a newly exposed red behind three dark weeks: report it to the coordinator, do not patch it here
    hermetic: false
  - step: 6
    phase: post-deploy
    action: >-
      The next scheduled run (Monday 2026-11-23 10:00Z) succeeds and the liveness probe agrees; then close rec-5094 with the operator's word, since its source says a human closes it: bin/venv-python -m scripts.ops_data_portal --update-rec rec-5094 --status closed --resolution naming the run id.
    command: bin/venv-python -m scripts.convergence_health --liveness-probe backlog-health.yml success
    expected: the probe reports a scheduled success within threshold; record the run id
    fix_if: still stale; read the scheduled run's failed job before anything else
    hermetic: false
  - step: 7
    phase: post-deploy
    action: rec-3691 is closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-3691', 'rec-5094']); print([(r['id'], r['status']) for r in rows])"
    expected: rec-3691 closed after the closure job runs on the merge commit; rec-5094 closed after VP 6
    fix_if: rec-3691 still open; read the closure job log for a refusal marker and fix its cause, never a direct status write
    hermetic: false
  - step: 8
    phase: post-deploy
    action: >-
      The Decision 201 closure gate's sandbox (ci.yml trailer-acceptance-evaluate calls this same run_all, which runs
      isolation_check even on an empty payload) still engages on the merge commit.
    command: >-
      SHA=$(git fetch -q origin main && git log origin/main -1 --format=%H -E --grep='^(build|fix|feat)\(backlog-health-probe-reaps-descendants\)') && test -n "$SHA" &&
      gh run list --repo otl-labs/ontheloop --workflow ci.yml --commit "$SHA" --json databaseId,conclusion
    expected: >-
      that run's trailer-acceptance-evaluate job log shows the line [rec_trailer_acceptance evaluate] sha=<merge sha>
      isolation_available=True (equivalently acceptance_verdict.json top-level isolation_available true); record the run
      id. rec-3691's acceptance is a single pytest node, so its holds verdict comes from trailer-junit-verdict's
      junit_verdict.json, not acceptance_verdict.json (cmd_evaluate always exits 0, so job success alone proves
      nothing). From a session, use mcp__github__actions_list list_workflow_runs / list_workflow_jobs and get_job_logs.
    fix_if: >-
      isolation_available=False: -p or --mount-proc does not engage on that runner; revert the build PR (probeable closures are refused
      until it is) and report to the coordinator
    hermetic: false
