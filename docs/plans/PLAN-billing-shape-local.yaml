      reported. Drives both the SQL verb test and the derive.py oracle test.
  - file: tests/provider_agnostic_tier_model/test_role_based_tier_model.py
    action: Modify
    purpose: >-
      test_tier_rows_are_role_keyed_with_billing_shape (graduated, node id unchanged): the vocabulary is exactly the three
      values, and every tier row's billing_shape is metered_marginal or fixed_non_rollover_allowance (no tier carries
