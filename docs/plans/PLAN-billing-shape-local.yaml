      (reserved_meaning, do_not_use_for), vocabulary.axes.credential_holder.reserved_meaning and the litellm_local_servers
      ollama and vllm notes take the verbatim text of execution step 2; one amendment_log row. Keeps every graduated
      shard green: end_user stays on both rows, the notes keep "no tier role" and "billing_shape local", the
      credential_holder meaning keeps "T4.26", and the new row never names PLAN-cli-persona-backend.
  - file: docs/contracts/telemetry_observations.yaml
    action: Modify
    purpose: >-
      Class A (Benjamin's word before the build merges, exact text pasted inline). billing_shape (description, semantics,
      populated_by, accepted_values) and cost_usd (semantics, derivation formula) take the verbatim text of execution
      step 3; two field amendment rows and one contract row. New text goes onto existing folded lines: the file ends at
      or under 500 effective lines (493 today, Decision 166).
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: >-
      Regenerated by bin/venv-python -m scripts.schema_to_field_semantics, never hand-edited (Decision 210 cl.3): the
      telemetry_observations.billing_shape accepted_values gains local. This is the telemetry writer's gate.
  - file: src/common/ducklake_event_read_sql.py
    action: Modify
    purpose: >-
      MODEL_CALL_COST_SQL: a local row derives cost_usd NULL and cost_source local, ahead of the reported branch, so a
      stored cost_usd_reported (LiteLLM may compute 0.0 or a list price for a self-hosted model) never reaches the read.
      The comment above it names local.
  - file: src/common/ducklake_event_read_verbs.py
    action: Modify
    purpose: The model_call_cost_estimate description lists cost_source as reported, allowance, local or unpriced.
  - file: scripts/telemetry_verify/derive.py
    action: Modify
    purpose: >-
      The shadow oracle's model_call_cost_estimate mirrors the SQL (a local row gives None and "local" before the reported
      branch); the module docstring names local and case c15b.
