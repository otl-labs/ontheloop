acceptance_criteria:
  - inference-provider.yaml's billing_shape_vocabulary is [metered_marginal, fixed_non_rollover_allowance, local], no tier row carries local, and the axis, credential_holder and row texts are execution step 2's verbatim.
  - telemetry_observations.yaml billing_shape admits local and cost_usd's formula derives NULL for it, with execution step 3's verbatim text, and the file is at or under 500 effective lines.
  - field_semantics.yaml is the generator's output (schema_to_field_semantics --check exits 0) and its only diff is billing_shape's accepted_values gaining local, one added line (VP 4).
  - Decision 234 carries a dated Update annotation re-pointing its billing_shape local coverage to its four graduated checks, and DECISIONS.md loses no line (VP 4, VP 8).
  - A model_call row carrying billing_shape local passes the writer's gate built from the bundled projection; an unknown value is refused (VP 3).
  - model_call_cost_estimate (SQL verb and derive.py oracle) gives every local row cost_usd NULL and cost_source local, whatever cost_usd_reported it stores, and never a 0 (VP 5, VP 6).
  - record_turn.py is unchanged (BILLING_SHAPES stays the claude_code producer's one value, rec-4147).
  - rec-4561's acceptance command exits 0 (VP 7) and rec-4561 is closed through the Resolves trailer (VP 11).
  - After the governed deploy, the production telemetry writer advertises local, and both readers serve the new model_call_cost_estimate read_version (VP 9, VP 10).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The new credential_holder mirror test.
    command: >-
      bin/venv-python -m pytest
      tests/checks/contracts/test_validate_inference_provider_registry.py::test_local_server_rows_state_how_credential_holder_applies -q
    expected: Exit 0, one test passes. Red before because the node is absent.
    fix_if: A row or axis text is missing a phrase the test names; fix the contract text to the plan's verbatim text, never the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: inference-local-server-credential-holder
  - step: 2
    phase: pre-deploy
    action: The tier tests read three values and refuse a tier carrying local.
    command: >-
      bin/venv-python -m pytest
      tests/provider_agnostic_tier_model/test_role_based_tier_model.py::test_tier_rows_are_role_keyed_with_billing_shape
      tests/provider_agnostic_tier_model/test_role_based_tier_model.py::test_fixed_allowance_tier_requires_remaining_allowance_assertion -q
    expected: Exit 0, both pass.
    fix_if: A two-value pin remains, or a tier row carries local.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the already-graduated inference-tier-rows-role-and-billing-shape row, whose node id this plan keeps; the
      test is edited in place, so it is green on the plan tree and a new row would add nothing.
  - step: 3
    phase: pre-deploy
    action: The writer's gate, built from the bundled projection, admits local.
    command: bin/venv-python -m pytest tests/telemetry/test_prepare.py::test_bundled_projection_admits_billing_shape_local -q
    expected: Exit 0, one test passes. Red before because the node is absent (and the bundled projection refuses local).
    fix_if: >-
      local is refused: field_semantics.yaml was not regenerated or the contract's accepted_values lacks it. Regenerate;
      never hand-edit the projection.
    hermetic: true
    graduation: graduate
    graduation_check_id: telemetry-writer-admits-billing-shape-local
  - step: 4
    phase: pre-deploy
    action: >-
      Contract pins, the projection drift gate, and the PR-relative legs: the projection's one-line diff, the Decision
      234 annotation with no DECISIONS.md line removed, and src/turn_capture/ unchanged.
    command: >-
      bin/venv-python -m pytest
      tests/checks/contracts/test_telemetry_event_journal_contracts.py::TestObservationsPersonaBackend
      tests/telemetry/test_contract_amendments.py::test_claude_code_capture_billing_shape_source_declared -q &&
      bin/venv-python -m scripts.schema_to_field_semantics --check && B="$(git merge-base origin/main HEAD)" &&
      test "$(git diff --numstat "$B" -- config/lambda/ducklake/field_semantics.yaml | cut -f1,2)" = "$(printf '1\t0')" &&
      grep -qF 'billing_shape local (rec-4561) is now held by inference-tier-rows-role-and-billing-shape' docs/DECISIONS.md &&
      test "$(git diff --numstat "$B" -- docs/DECISIONS.md | cut -f2)" = 0 &&
      git diff --quiet "$B" -- src/turn_capture/ && echo PROJECTION_OK
    expected: Exit 0, every node passes, then PROJECTION_OK.
    fix_if: >-
      The rec-4147 populated_by sentence changed (restore it verbatim); the committed projection drifts from the
      contract (regenerate); the projection diff is more than local's one line (an unrelated contract edit leaked in);
      the Decision 234 annotation is missing or a DECISIONS.md line was removed (Decision 177: append only); or
      src/turn_capture/ changed (revert it; rec-4147, producer_fingerprint).
    hermetic: true
    expected_literals: [PROJECTION_OK]
    graduation: waive
    graduation_waiver_reason: >-
      Existing tests edited in place (green on the plan tree); the drift gate already runs as
      validate_field_semantics_drift in both tiers; the diff, annotation and unchanged-file legs are PR-relative
      (against the merge base with origin/main), so they mean nothing once merged, and Decision 177's append-only
      dialect holds the annotation from then on.
  - step: 5
    phase: pre-deploy
    action: The shadow oracle derives local cost as NULL with cost_source local.
    command: >-
      bin/venv-python -m pytest
      "tests/telemetry_verify/test_derive.py::test_oracle_matches_every_committed_derivation_case[c15b_local_cost_is_null_whatever_is_reported-model_call_cost_estimate-0]"
      -q
    expected: >-
      Exit 0, one test passes. Red before because the node is absent (pytest exit 4), and without the derive.py branch
      the oracle reports a stored 0.0 as reported.
    fix_if: A local row reads reported; the local branch must precede the reported branch.
    hermetic: true
    graduation: graduate
    graduation_check_id: telemetry-local-cost-derives-null
  - step: 6
    phase: pre-deploy
    action: The SQL verb agrees on the same case and never returns a 0.
    command: >-
      bin/venv-python -m pytest
      "tests/common/test_ducklake_event_read_verbs.py::test_cost_source_never_a_false_zero[c15b_local_cost_is_null_whatever_is_reported-model_call_cost_estimate-0]"
      tests/common/test_ducklake_event_read_verbs.py tests/telemetry/test_derived_layer_reconciliation.py -q
    expected: Exit 0, every node passes (duckdb installed).
    fix_if: The verb returns 0.0 with cost_source reported for a local row, or the oracle and the verb disagree.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Needs duckdb, absent from requirements-fast.txt (vp-red-before.yaml hermetic_authoring (iii)). PR CI runs only
      --pre, where the file skips itself (importorskip duckdb); it runs in VP 8's blocking pre-handoff full tier and in
      main's full tier (ci.yml main-validate, push-only). VP 5 graduates the same case through the oracle.
  - step: 7
    phase: pre-deploy
    action: rec-4561's own acceptance command.
    command: >-
      grep -qE 'billing_shape_vocabulary: \[[^]]*local' docs/contracts/inference-provider.yaml && bin/venv-python -m pytest
      tests/provider_agnostic_tier_model/test_role_based_tier_model.py::test_tier_rows_are_role_keyed_with_billing_shape -q
      && bin/venv-python -m pytest
      tests/checks/contracts/test_validate_inference_provider_registry.py::test_local_server_rows_state_how_credential_holder_applies
      -q && echo REC_4561_ACCEPTANCE_OK
    expected: Exit 0, then REC_4561_ACCEPTANCE_OK.
    fix_if: Any leg fails; fix the contract or test named.
    hermetic: true
    expected_literals: [REC_4561_ACCEPTANCE_OK]
    graduation: waive
    graduation_waiver_reason: Duplicates VP 1 (graduated here) and VP 2 (already graduated); it exists to prove the rec's acceptance before closure.
  - step: 8
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier on the clean, rebased tree the implement skill's Commit Flow names (handoff_policy),
      so validation_result --verify-head can attest the pushed HEAD.
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
    expected: Both exit 0.
    fix_if: A failure names its check; fix the cause in scope, never weaken a check.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      The governed deploy ran every job green. Save the jobs of the first deploy-ducklake-lambdas.yml run on main whose
      head is the merge commit (mcp__github__actions_list: list_workflow_runs then list_workflow_jobs) as one JSON list of
      {name, conclusion} to a file; set JOBS_FILE to it.
    command: >-
      export JOBS_FILE && test -s "$JOBS_FILE" && bin/venv-python -c "import json,os;j={r['name']:r['conclusion'] for r in
      json.load(open(os.environ['JOBS_FILE']))};need={'deploy-maintenance','maintenance-smoke','reconcile-gate',
      'deploy-serving','deploy-telemetry-twin','telemetry-twin-smoke','smoke','deploy-telemetry','telemetry-smoke'};
      bad={n:j.get(n) for n in need if j.get(n)!='success'};assert not bad, bad;print('DEPLOY_JOBS_OK',len(j))"
    expected: DEPLOY_JOBS_OK (all six affected functions deployed and their smoke gates passed).
    fix_if: >-
      A red job: read its log. Never re-run the deploy from a laptop (break-glass only, Decision 125); a reconcile-gate
      refusal is not this plan's (no column changes).
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      Read-only on production (Decision 236 cl.1): the production telemetry writer's describe advertises local, and the
      telemetry reader and the shared reader both serve model_call_cost_estimate at the read_version merged main
      computes.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "import os;from scripts.telemetry_capture.transport import
      make_client,Budget;from scripts.telemetry_capture.read_route import TelemetryReader;from
      src.common.ducklake_reader_client import make_reader;from src.common.ducklake_event_reads import
      event_read_version as erv;s,b=make_client(os.environ,None,Budget.start(30.0)).invoke({'action':'describe'});
      assert s==200 and b['catalog']['meta_schema']=='ducklake_telemetry', b.get('catalog');
      v=b['schema']['telemetry_observations']['accepted_values']['billing_shape'];assert 'local' in v, v;
      want=erv('model_call_cost_estimate');assert want!='794fb33846bd7f06', want;
      got={TelemetryReader().describe()['model_call_cost_estimate']['read_version'],
      make_reader(profile='agent_platform').describe()['model_call_cost_estimate']['read_version']};
      assert got=={want}, (got,want);print('LOCAL_LIVE_OK',want)"
    expected: LOCAL_LIVE_OK with the new read_version. Red before because the writer advertises two values and both readers serve 794fb33846bd7f06.
    fix_if: >-
      An old value means the deploy has not landed (VP 9). Never write a test row to production; a write proof belongs
      to the smoke twin.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: rec-4561 closed by the squash commit's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import
      fetch_recs_by_ids,make_reader;r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-4561']);
      assert not m and r[0]['status']=='closed', r;print('REC_CLOSED')"
    expected: REC_CLOSED.
    fix_if: Still open after ci.yml's closure job ran -- read the job log; never close it by hand without its evidence.
    hermetic: false
    graduation: not-applicable
