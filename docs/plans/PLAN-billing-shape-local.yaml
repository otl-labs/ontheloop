execution_steps:
  - Read the cited Decision sections and the three graduated shards (inference-provider-local-model-servers, inference-provider-backend-vocabulary, inference-tier-rows-role-and-billing-shape).
  - >-
    docs/contracts/inference-provider.yaml, verbatim. (a) tier_model.billing_shape_vocabulary: [metered_marginal,
    fixed_non_rollover_allowance, local]. (b) cold_start_assertion_rule appends: "billing_shape local is no tier's today:
    it marks a call a model_id_formats.litellm_local_servers row serves, and those rows fill no tier role, so neither limb
    applies and no tier row carries it. A role filled by a self-hosted server would first need a Decision under Decision
    173 and its own cold-start limb (for example endpoint liveness)." (c) vocabulary.axes.billing_shape.reserved_meaning
    becomes: "how the means of access behind a call is billed, recorded per call at the write boundary --
    metered_marginal and fixed_non_rollover_allowance are properties of the credential; local is a self-hosted model
    server's (model_id_formats.litellm_local_servers): no metered spend and no allowance, whether or not the server takes
    a key (Decision 234 clause 4); never a property of a vendor or backend; dollars derive only for metered_marginal", and
    its do_not_use_for becomes: "which harness ran the persona, which vendor served it, or where the call ran -- local
    never names a local adapter, the free tier or a laptop; a metered API call made from a laptop is metered_marginal".
    (d) vocabulary.axes.credential_holder.reserved_meaning appends: "For a self-hosted model server
    (model_id_formats.litellm_local_servers) it names who holds the means of access: the server's operator, end_user,
    whether or not the server takes a key". (e) ollama notes become: "Fills no tier role and is never named in
    litellm_tier_models, the sole provider-identity home (Decision 173). A model call it serves carries billing_shape
    local (Decision 234 clause 4): tokens are the stored fact, and cost derives at read as no dollar spend
    (telemetry_observations.cost_usd). Ollama takes no key by default; credential_holder end_user names the server's
    operator, who controls its api_base." (f) vllm notes become: "Fills no tier role, as ollama; its calls carry
    billing_shape local under the same rule. A vLLM server may take an API key (its --api-key); end_user, the server's
    operator, sets and holds it, and holds the access when there is none." (g) amendment_log gains, first: {date: "<build
    date>", semantic_break: true, change_class: accepted_values_extend, summary: "PLAN-billing-shape-local (rec-4561,
    Decision 234 clause 4): tier_model.billing_shape_vocabulary gains local, which no tier carries today
    (cold_start_assertion_rule); vocabulary.axes.billing_shape and credential_holder state how they read for a
    self-hosted model server, so billing_shape is no longer only a property of the credential; the litellm_local_servers
    notes follow. Decision 173 clause 2(c) does not fire: no role's billing shape changes."}
  - >-
    docs/contracts/telemetry_observations.yaml, verbatim. billing_shape: description "Billing shape of the call behind
    this model_call: metered_marginal | fixed_non_rollover_allowance | local. NULL for non-model_call kinds."; semantics
    "Decision 206 -- inference-provider.yaml billing_shape_vocabulary, never a property of the vendor or backend:
    metered_marginal and fixed_non_rollover_allowance are the credential's, and local (Decision 234 clause 4) marks a
    call a self-hosted model server served (inference-provider.yaml model_id_formats.litellm_local_servers), with no
    metered spend and no allowance. Dollars derive only for metered_marginal; a fixed_non_rollover_allowance or local row
    reports turns and tokens, and any cost_usd_reported it stores (e.g. a Claude Code total_cost_usd under subscription
    auth, or LiteLLM's computed cost for a self-hosted model) is a raw notional estimate kept per Decision 199, never a
    spend. Cross-backend parity compares turns and tokens per verified merge, the unit every shape shares."; populated_by
    keeps its text and inserts, after "the one otl init records for a BYOK key)": ", or local when LiteLLM routes the
    call to a model_id_formats.litellm_local_servers row" (the rec-4147 sentence stays verbatim); dq_intent
    accepted_values [metered_marginal, fixed_non_rollover_allowance, local]; amendment_log gains {date: "<build date>",
    semantic_break: true, change_class: accepted_values_extend, summary: "PLAN-billing-shape-local (rec-4561, Decision 234
    clause 4): accepted_values gains local, a call a self-hosted model server served; it derives no dollars.",
    migration_story: "Additive: every stored row stays valid, and no producer emits local before the writer deploy
    (Decision 210 clause 4); the claude_code producer still emits only fixed_non_rollover_allowance (rec-4147)."}.
    cost_usd: in semantics, "A billing_shape fixed_non_rollover_allowance row derives NULL (Decision 206)." becomes "A
    billing_shape fixed_non_rollover_allowance row (Decision 206) or local row (Decision 234 clause 4) derives NULL
    whatever cost_usd_reported it stores, never a 0: neither is a metered spend, and shadow dollars are never a spend
    (Decision 217 clause 4)."; the derivation formula's head becomes "CASE WHEN billing_shape IN
    ('fixed_non_rollover_allowance', 'local') THEN NULL ELSE" (the rest unchanged, realized: false); amendment_log gains
    {date: "<build date>", semantic_break: true, change_class: governance_note_add, summary: "PLAN-billing-shape-local
    (rec-4561): a local model_call derives cost_usd NULL, as an allowance row does, ahead of any stored
    cost_usd_reported.", migration_story: "No stored row changes; the model_call_cost_estimate verb reports such a row
    with cost_source local."}. The contract amendment_log gains {date: "<build date>", semantic_break: true,
    change_class: accepted_values_extend, summary: "PLAN-billing-shape-local (rec-4561, Decision 234 clause 4):
    billing_shape admits local and cost_usd derives NULL for it, operator-approved <date of Benjamin's word>; per-field
    changes are on their own fields' logs."}. Each amendment row is one flow-form line.
  - Regenerate config/lambda/ducklake/field_semantics.yaml with bin/venv-python -m scripts.schema_to_field_semantics; confirm the diff is only billing_shape's accepted_values gaining local.
  - >-
    src/common/ducklake_event_read_sql.py MODEL_CALL_COST_SQL: cost_usd is CASE WHEN o.billing_shape IN
    ('fixed_non_rollover_allowance', 'local') THEN NULL ELSE o.cost_usd_reported END; cost_source is CASE WHEN
    o.billing_shape = 'fixed_non_rollover_allowance' THEN 'allowance' WHEN o.billing_shape = 'local' THEN 'local' WHEN
    o.cost_usd_reported IS NOT NULL THEN 'reported' ELSE 'unpriced' END. The comment above names local (Decision 234
    clause 4). src/common/ducklake_event_read_verbs.py's description reads "(reported, allowance, local or unpriced)".
    scripts/telemetry_verify/derive.py mirrors the branch order and its docstring names local and c15b.
  - Add case c15b to tests/telemetry/fixtures/derivation_cases.yaml (scope row) after c15; write the four test edits named in scope.
  - docs/PROJECT_CONTEXT.md drops "(vocabulary pending, rec-4561)".
  - >-
    docs/DECISIONS.md, verbatim, as its own paragraph after Decision 234's "**Related:**" line and before the entry's
    closing rule: "> **Update (<build date>):** the Coverage line's billing_shape local (rec-4561) is now held by
    inference-tier-rows-role-and-billing-shape, inference-local-server-credential-holder,
    telemetry-writer-admits-billing-shape-local and telemetry-local-cost-derives-null. No clause changes." Nothing else
    in the entry changes (Decision 177). The entry then passes its 6,144-byte cap (6,122 today), so the full tier prints
    validate_decisions_size's amendment-delta WARN (rec-3243); it never fails, and the PR body names it.
  - Write the three registry rows from VP 1, VP 3 and VP 5's commands (test_selector slot).
  - Execute the pre-deploy Verification Plan (VP 1-8); loop until pass; on unrecoverable failure stop and RCA (Decision 55).
  - >-
    Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): (1) GitHub readiness state from
    bin/venv-python -m scripts.session.github_readiness (unknown is unproven, never ready); (2) parent validator
    evidence: VP 8's full tier exits 0 with a final "Validation Summary (scope: all)" PASS, then bin/venv-python -m
    scripts.checks.validation_result --verify-head exits 0 for the pushed HEAD; (3) structured postflight evidence:
    write the scripts.session.postflight_evidence.CATEGORIES JSON in the scratchpad, then bin/venv-python -m
    scripts.session.postflight --evidence <file>; (4) the real outcome: push, PR, CI green by event-driven wake (never
    polled).
  - >-
    Merge gate: paste the final text of both contract diffs and the Decision 234 annotation inline in the thread and get
    Benjamin's word (Class A, and he reviews every deployment); then squash-merge with "Resolves: rec-4561" in the body.
  - >-
    Post-merge: once the deploy-ducklake-lambdas.yml run for the merge commit finishes, run VP 9-11, then post one
    counts-only comment on the merged PR naming the deploy run URL and the DEPLOY_JOBS_OK, LOCAL_LIVE_OK and REC_CLOSED
    literals (no ARNs, account ids or row data: the repository is public). This channel deploys only after merge, so the
    comment is where the V3 proof lives.
  - >-
    Report: what was implemented; VP 1-8 results; each of the four closure facts stated separately; the merge commit; VP
    9-11 results with a link to the evidence comment.
rollback: >-
  Revert the squash commit; the governed deploy ships the revert. No stored row changes either way, and no producer emits
  local, so a revert strands nothing.
