schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: billing-shape-local
intent: >-
  Admit billing_shape local for model calls a self-hosted model server serves (Ollama, or vLLM through LiteLLM), as
  Decision 234 clause 4 rules: the vocabulary, the telemetry writer's gate and the read-time cost derivation all learn
  the value, and the contracts say how billing_shape and credential_holder read for a server that may hold no
  credential. Without it the first local persona run's model calls are refused at the writer, so the learning loop
  (PROJECT_CONTEXT) stays blind to the lane it most needs to compare on tokens.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-billing-shape-local.yaml
phase: >-
  ad_hoc_rec (rec-4561, Medium, the coverage home Decision 234 clause 4 names; Benjamin's handover of 2026-10-27,
  cmsg_012XgaFy8VaDQbxP5D8nC958EAuVTf5nE1SjJ68FHVCqBm). Closes no roadmap exit criterion: no tier_item criterion names
  billing_shape local (T4.34 owns the adapters, not the vocabulary), so closes_criteria is empty by design. V3 because
  config/lambda/ducklake/field_semantics.yaml and src/common/ducklake_event_read_*.py are bundled into six active
  DuckLake Lambdas (compute_affected_artifacts: ducklake_writer, ducklake_reader, ducklake_maintenance,
  ducklake_maintenance_smoke, ducklake_telemetry_writer, ducklake_telemetry_reader).
closes_criteria: []
scope:
