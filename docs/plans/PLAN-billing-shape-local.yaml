      Text in execution step 8.
  - file: config/agent/verification_registry/entries/inference-local-server-credential-holder.yaml
    action: Create
    purpose: Registry row for VP 1 (graduate), check_spec from the step's command; guard_target docs/contracts/inference-provider.yaml.
  - file: config/agent/verification_registry/entries/telemetry-writer-admits-billing-shape-local.yaml
    action: Create
    purpose: Registry row for VP 3 (graduate); guard_target config/lambda/ducklake/field_semantics.yaml.
  - file: config/agent/verification_registry/entries/telemetry-local-cost-derives-null.yaml
    action: Create
    purpose: Registry row for VP 5 (graduate); guard_target scripts/telemetry_verify/derive.py.
