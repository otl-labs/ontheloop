pre_implementation_checklist:
  - Branch confirmed not on main (harness-assigned session branch)
  - docs/PROJECT_CONTEXT.md read
  - Decisions 234 cl.4, 199 cl.1, 206, 173 cl.4, 210 cl.4, 217 cl.4 and 236 cl.1 read (only the cited sections)
  - All files in scope located and readable; telemetry_observations.yaml (493 of 500) and inference-provider.yaml (473 of 500) effective-line headroom checked
