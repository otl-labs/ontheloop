  - file: scripts/ci/terraform_bootstrap_apply_gate.py
    action: Create
    purpose: >-
      BUILD PR 2. Standard-library-only gate, shaped like terraform_github_apply_gate.py (reuse plan_names_core.py
      where it fits). classify(row): CI-writable only when actions are ["create"] or ["update"] (never delete, replace,
      read, forget, importing or a previous_address from a moved block), the type is aws_iam_role, aws_iam_role_policy, aws_iam_role_policy_attachment or
      aws_iam_policy, and the target name (role name, the policy's role, the attachment's role and policy name, or the
      policy name) starts agent-platform- and is not agent-platform-github-ci-apply-boundary or agent-platform-session-*,
      and an aws_iam_role's permissions_boundary ends with :policy/agent-platform-github-ci-apply-boundary; an unknown
      value the plan's configuration references cannot resolve, or any other type, is protected (fail closed). A
      role or policy_arn unknown at plan time is resolved through the plan JSON's configuration references to a
      resource in the same plan (a new role's planned name, a new policy's planned name), so a new role with its own
      policy and attachments stays CI-writable. An update to an agent-platform-* managed policy is protected when any
      attachment in prior state or the plan attaches it to a principal other than a boundary-carrying agent-platform-*
      role. An aws_iam_role row that sets or changes inline_policy or managed_policy_arns is protected (those grants
      would bypass the GRANT flag). An update to an existing role's assume_role_policy is CI-writable only for a role in
      TRUST_WRITABLE_ROLES (one module constant equal to IAMRoleTrustWrite's list); a new role's trust is set by its
      create. A row whose policy document gains an Allow (an action, resource and condition triple absent from the
      prior document) is protected when that Allow uses NotAction or NotResource, or when any of its action entries,
      lower-cased and read as an fnmatch pattern (so "*", "iam:*", "IAM:PutRolePolicy", a secretsmanager Get* pattern and
      "ssm:*" all count), covers: an iam: verb other than Get*, List*, Simulate* or Generate* on "*" or on any resource
      outside role/agent-platform-* and policy/agent-platform-*; Secrets Manager's GetSecretValue (lower-cased, as every
      pattern here) or an ssm:getparameter* verb; s3:getobject on a resource covering the bootstrap state object; or any verb not starting get, list or
      describe on a resource whose lower-cased pattern fnmatch-matches a protected ARN. The protected ARNs are the arn
      and execution_arn of every resource in prior state or the plan that the rule above keeps from CI (so the
      platform-security-* detector, its trail, trail bucket and objects, PlatformAdmin, PlatformDev, github-settings-*,
      both bootstrap roles and their policies, the boundary, agent-platform-session-* and every non-IAM resource of the
      root), the bootstrap state object and its .tflock, the App key secret, and one synthetic user, group,
      oidc-provider and saml-provider ARN; "*" matches each, so a write on "*" is protected. This keeps the detector
      (Decision 202 cl.1 and cl.3) out of a CI role's reach through logs:, cloudwatch:, s3: or any other service, not
      IAM alone: a bounded role must not reach the protected set or a secret through a names-only review (row 34's
      boundary Deny is the IAM backstop). A row whose configuration carries a provisioner is protected. No-op rows are
      dropped first; a row with a for_each or count instance key is protected (Decision 248's fail-closed rule for
      keys), and rows are grouped by plan_names_core.normalise_address(), so no output prints an instance key
      (Decision 238 cl.4): a keyed group prints its normalised address and its instance count, and two rows sharing
      one normalised address never make the plan unreadable. Names are read from plan values and never printed
