schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "bootstrap-ci-gated-apply"
intent: >-
  Move terraform/bootstrap applies from operator CloudShell pastes to CI behind one operator approval: a gated
  delegated-admin role applies only boundary-carrying agent-platform-* CI roles and their policies, everything else in
  the root (the protected set) and the root of trust stay the operator's, and no CI run can change who may approve or
  assume the applying role (new Decision amending Decisions 92, 126, 144, 223, 225 and 238), and, by the operator's 2026-11-13 ruling, a second short Decision re-anchoring the boundary-headroom trigger of Decisions 230 and 239 to the boundary's size once this plan's and PLAN-agent-ducklake-rest-api's Denies are on main, only to restore agent AWS access during the critical workflow failure and never as a precedent.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-bootstrap-ci-gated-apply.yaml
phase: >-
  security_advisory (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  phase two of the agent AWS access fix after the 2026-11-12 proxy change (owed rec 2 of
  PLAN-agent-proxy-signed-access, superseded in direction by this plan). The operator chose CI-first and said "write
  the plan" on 2026-11-13 12:26Z. Closes no roadmap criterion; no rec exists because the recs store is unreachable
  while the session proxy fails to sign its Function URL calls.
scope:
  - file: terraform/bootstrap/bootstrap_ci_apply.tf
    action: Create
    purpose: >-
      BUILD PR 1. Two roles for .github/workflows/terraform-bootstrap-apply.yml, named outside agent-platform-* so no CI
      role's prefix-keyed IAM grant can write them, each with NO permissions_boundary and a header comment stating the
      explicit exclusion (Decision 144 cl.3 style: the boundary denies iam:GetPolicy/GetPolicyVersion/GetUser,
      cloudtrail, scheduler and states reads and CreatePolicyVersion on agent-platform-github-ci-apply-reads, all of
      which these roles need). Trust, copied in shape from github_settings_apply.tf:103-129: ONE statement, Federated
      "arn:aws:iam::${var.account_id}:oidc-provider/token.actions.githubusercontent.com", sts:AssumeRoleWithWebIdentity,
      StringEquals only on aud = sts.amazonaws.com, sub = flatten([for repo in local.github_repos :
      ["repo:${repo}:environment:<env>"]]) (Decision 172 immutable segments, reusing github_ci_apply.tf's local), and
      job_workflow_ref = local.bootstrap_ci_workflow_refs = ["otl-labs/ontheloop/.github/workflows/terraform-bootstrap-apply.yml@refs/heads/main"].
      aws_iam_role.bootstrap_apply (name bootstrap-apply, <env> tf-bootstrap-apply) and aws_iam_role.bootstrap_preview
      (name bootstrap-preview, <env> tf-trusted-plan), both lifecycle prevent_destroy. Four customer-managed policies
      (aws_iam_policy, each from a hoisted local with a lifecycle precondition at the 6,144 B managed-policy limit,
      whitespace-stripped measure, validate_iam_policy_size) and five aws_iam_role_policy_attachment resources:
      bootstrap_apply_reads, bootstrap_apply_write, bootstrap_apply_guard, bootstrap_preview_reads,
      bootstrap_preview_guard. (1) bootstrap-plan-reads (attached to both): IAMRead iam:Get*, iam:List* on "*";
      CloudTrailRead cloudtrail:DescribeTrails, GetTrail, GetTrailStatus, GetEventSelectors, GetInsightSelectors,
      ListTags on "*"; LogsConfigRead logs:Describe*, logs:ListTagsLogGroup, logs:ListTagsForResource on "*" (no
      GetLogEvents, FilterLogEvents or StartQuery); AlarmRead cloudwatch:DescribeAlarms, ListTagsForResource on "*";
      SchedulerRead scheduler:GetSchedule, GetScheduleGroup, ListTagsForResource on "*"; StatesRead states:Describe*,
      states:List* and states:ValidateStateMachineDefinition on "*" (non-mutating; the AWS provider calls it at plan time
      whenever the heartbeat state machine's definition changes, platform_security_admin_policy.tf
      PlatformSecurityHeartbeatDefinitionValidate, so such a plan reaches CLOUDSHELL_REQUIRED instead of an
      AccessDenied abort; the preview guard's NotAction carries it because it equals this policy's actions); SecretMetadataRead secretsmanager:DescribeSecret, GetResourcePolicy, ListSecrets on "*";
      TrailBucketConfigRead s3:GetBucket*, GetAccelerateConfiguration, GetLifecycleConfiguration,
      GetReplicationConfiguration, GetEncryptionConfiguration, ListBucket on the trail bucket ARN built the way
      platform_security_trail.tf:30 names it; BootstrapStateRead s3:GetObject on
      "${local.bootstrap_state_bucket_arn}/terraform.tfstate" (or the account_names.tf local
      validate_account_portable_names accepts); TfvarsRead ssm:GetParameter on the literal
      parameter/secret/agent-platform-terraform-personal-tfvars ARN (Decision 237 cl.2: these two roles are its declared
      consumers); and, for PLAN-agent-ducklake-rest-api's agent_ducklake_api.tf (unbuilt; covered now so either build
      order keeps the preview's refresh green), ApiGatewayRead apigateway:GET on the regional ::/restapis,
      ::/restapis/*, ::/account and ::/tags/* ARNs (never ::/apikeys*, whose GET can return key values);
      LambdaPolicyRead lambda:GetPolicy on function:agent-platform-ducklake-*; QuotaRead servicequotas:Get* and
      servicequotas:List* on "*"; ApiUrlParamRead ssm:GetParameter, GetParameters and ListTagsForResource on
      parameter/agent-platform/ducklake/api_url/* (String values, never under /secret/) and ssm:DescribeParameters on
      "*". (2) bootstrap-apply-write (apply only): BootstrapStateWrite s3:PutObject on the state object and
      s3:GetObject, s3:PutObject, s3:DeleteObject on its .tflock; and, copied from github_ci_apply_policy.tf with the same
      Sids and conditions, IAMRoleCreateBounded (iam:CreateRole on role/agent-platform-* with StringEquals
      iam:PermissionsBoundary = the boundary ARN) and IAMRoleWriteBounded (iam:PutRolePolicy and
      PutRolePermissionsBoundary, same Resource and condition) and, split from the precedent's IAMRoleWriteBounded,
      IAMRoleAttachBounded (iam:AttachRolePolicy, same Resource and condition plus ArnLike iam:PolicyARN
      arn:aws:iam::*:policy/agent-platform-*, so no AWS-managed or other-prefix policy can be attached); IAMRoleMetadataWrite iam:TagRole, UntagRole, UpdateRole,
      UpdateRoleDescription on role/agent-platform-* (the precedent's four verbs); IAMRoleTrustWrite
      iam:UpdateAssumeRolePolicy on the enumerated agent-platform-* roles terraform/bootstrap declares, today exactly
      role/agent-platform-github-ci-apply (UpdateAssumeRolePolicy takes no iam:PermissionsBoundary condition, so a
      prefix would reach terraform/personal's roles; Decision 143 cl.1); IAMManagedPolicyWrite iam:CreatePolicy,
      CreatePolicyVersion, DeletePolicyVersion, TagPolicy, UntagPolicy on policy/agent-platform-*. No DeleteRole,
      DeletePolicy, DetachRolePolicy or DeleteRolePolicy (destroys are refused before apply), no iam:PassRole, no user,
      group or provider verb, no write outside IAM and the state. (3) bootstrap-apply-guard, Deny only:
      DenyProtectedRoleWrite iam:Create*, Put*, Attach*, Detach*, Delete*, Update*, Tag*, Untag*, PassRole on
      role/PlatformAdmin, role/PlatformDev, role/github-settings-*, role/bootstrap-*, role/platform-security-*,
      role/ducklake-api-* (PLAN-agent-ducklake-rest-api's service role, named before it exists, which IAM accepts);
      DenyUserAndGroupWrite the same verb families plus iam:Add*, Remove*, Enable*, Deactivate*, Resync*, Upload*,
      Change*, Reset*, Set* on user/*, group/* and mfa/*; DenyProtectedPolicyWrite iam:CreatePolicy, CreatePolicyVersion,
      DeletePolicy, DeletePolicyVersion, SetDefaultPolicyVersion, TagPolicy, UntagPolicy on
      policy/agent-platform-github-ci-apply-boundary, policy/agent-platform-session-*, policy/platform-security-* and
      policy/bootstrap-*; DenyBoundaryRemoval iam:DeleteRolePermissionsBoundary, DeleteUserPermissionsBoundary,
      PutUserPermissionsBoundary on "*"; DenyProviderAndAccountWrite iam:CreateOpenIDConnectProvider,
      DeleteOpenIDConnectProvider, UpdateOpenIDConnectProviderThumbprint, AddClientIDToOpenIDConnectProvider,
      RemoveClientIDFromOpenIDConnectProvider, TagOpenIDConnectProvider, UntagOpenIDConnectProvider, CreateSAMLProvider,
      UpdateSAMLProvider, DeleteSAMLProvider, TagSAMLProvider, UntagSAMLProvider, CreateServiceLinkedRole,
      DeleteServiceLinkedRole, CreateAccountAlias, DeleteAccountAlias, UpdateAccountPasswordPolicy,
      DeleteAccountPasswordPolicy and SetSecurityTokenServicePreferences on "*"; DenyDetectorWrite with NotAction equal to bootstrap-plan-reads' read
      actions on every platform-security-* resource (roles, policies, the log group and its metric filters, the alarms,
      the trail, the trail bucket and its objects, the state machine, the schedule group and schedule; Decision 202
      cl.1: the detector statements are left out of the Allows, not allowed and denied); DenyGithubSettingsKey every
      secretsmanager write verb and GetSecretValue on the agent-platform-terraform-github-apply-app secret (Decision 248
      cl.5); DenySecretValues secretsmanager:GetSecretValue on "*" and ssm:GetParameter* with NotResource the tfvars
      ARN and parameter/agent-platform/ducklake/api_url/*; DenyObjectIOOutsideState s3 object verbs with NotResource the state object and its .tflock (the trail
      bucket's config reads are not object verbs); DenyCredentialMinting sts:AssumeRole, AssumeRoleWithWebIdentity,
      AssumeRoleWithSAML, AssumeRoot, GetFederationToken on "*"; DenyAccountIAMDump iam:GetAccountAuthorizationDetails,
      GetCredentialReport and GenerateCredentialReport on "*" (account-wide dumps no refresh needs, which IAMRead's
      iam:Get* would otherwise allow). (4) bootstrap-preview-guard, Deny only:
      DenyAllButReads with NotAction equal to bootstrap-plan-reads' actions plus sts:GetCallerIdentity, on "*", with
      Condition BoolIfExists aws:ViaAWSService "false", so a call a service makes on the role's behalf (the aws/ssm key decrypt
      behind materialise-tfvars' get-parameter --with-decryption, inferred, not probed) is not denied by it, while a
      direct call is (the key policy's kms:ViaService still bounds the forwarded one); DenyObjectReadOutsideState s3:GetObject* with NotResource the state object; DenyParameterReadOutsideTfvars
      ssm:GetParameter* with NotResource the tfvars ARN and parameter/agent-platform/ducklake/api_url/*; DenyAccountIAMDump as in (3). No literal account id, bucket
      name or region; no
      aws_iam_access_key, inline aws_iam_role_policy or import block. Before VP 4 the build measures each rendered
      document, bootstrap-apply-guard (the largest, estimated about 5,620 B at plan time, so about 500 B of margin) first (minified JSON rendered by bin/venv-python with a twelve-digit
      placeholder account id, the method that measured the boundary; a hook refuses terraform console in sessions); one
      over 6,144 B is a plan amendment, because a split changes the addresses VP 5 and VP 6 pin.
