  - "Coupling: both jobs' materialise-tfvars reads /secret/agent-platform-terraform-personal-tfvars, which carries the account id, owner e-mail and both ExternalIds this root's variables need. A change that moves one of them out of that parameter (rec-4048 plans to move the ExternalIds; inferred, the recs store is unreachable) must give this workflow the same value in the same PR, or the preview goes red before any apply (fails closed)."
  - "Inferred, not probed: registry.terraform.io serves hashicorp/aws to GitHub runners, so no provider mirror grant is needed; on a registry outage a run fails red and is re-run."
  - "V3 resolution: VP 5's operator-run pre-merge plan at PR 1's head substitutes for pre-merge post-deploy evidence for PR 1; PR 2 changes no non-Markdown bootstrap file. Behavioural acceptance is VP 6 (apply and IAM simulation), VP 7 (the Environment), VP 10 (first preview) and VP 11 (approved no-op run), with the operator's returned lines labelled operator-reported in counts-only PR comments naming the applied sha."
  - "Approvals at build start: the operator's CI-RCA override while the recs reader is unreachable (Decision 215 fails closed; this plan PR's override does not carry over), nothing else. The build session holds no AWS identity; VP 4-6 are the operator's CloudShell blocks and VP 7 and VP 11 are the operator's GitHub approvals. The operator's final-diff words (constraints) are asked at each PR's CI green."
  - "red_overlap: the recs reader is unreachable (Decision 215 fails closed; scripts.ci_rca.red_overlap exits 2 and its reader lookup goes through the refused profile chain, so it is not re-run); main's GitHub CI state is the substitute evidence and the operator's override is asked before the plan PR merges."
  - "Overlaps: PLAN-agent-proxy-signed-access (merged #2022; its build is back with its planner) edits DECISIONS.md after the same 223 anchor and the same deploy-paths anchors (amendment_log, pre_merge_live_plan) and compacts other log entries; whichever builds second re-anchors (VP 9 fix_if). rec-4638 PR 5 (#2021) edits the HCL screen policy file this plan does not touch. PLAN-telemetry-content-reader-lock (unbuilt, Feedback Loop's) also edits the boundary and pins its rendered size at most 5,632 B; after the two Denies land, its 197 B passes both its own pin and the re-anchored trigger, so its build stops for its own operator re-decision, which the boundary-trigger Decision's clause 3 requires; this plan never edits it. iam-simulate-fixture.yaml sits 3 lines under its cap and this plan adds one; PLAN-persona-verdict-credential and that plan also scope it, so the second to build compacts. rec-4233 PR 1 and rec-5026 carry their own CloudShell bootstrap blocks; after PR 2 lands their CI-writable parts may ride this pipeline instead, by their planners' amendment, never silently."
  - "Coupling with PLAN-agent-ducklake-rest-api (approved on main at 1fb6ff15, #2025; unbuilt): it adds agent_ducklake_api.tf (a count-indexed Regional REST API with per-route for_each resources, four aws_lambda_permission, four String parameters under /agent-platform/ducklake/api_url/, a log group, the ducklake-api-access-logs role with an inline policy, aws_api_gateway_account and an aws_servicequotas_service_quota) and DenyApiGatewayWrite (about 110 B) to the boundary. Row 1's ApiGatewayRead, LambdaPolicyRead, QuotaRead and ApiUrlParamRead, the guards' api_url NotResource and row 1's and row 34's role/ducklake-api-* cover it in either build order. Every row of it is protected here (a type outside the four IAM types, a keyed row, a role outside agent-platform-*), so CI never applies it and it stays the operator's CloudShell apply, as that plan intends; its file holds no token the screen refuses. Whichever builds second adds agent_ducklake_api.tf to _SCANNED_BOOTSTRAP_FILES (scanned, so a grant it made on PlatformDev or PlatformAdmin would fail the guard), and PLAN-agent-proxy-signed-access's agent_session_user.tf (an aws_iam_user, which this gate always protects) to _UNSCANNED_BOOTSTRAP_FILES with the reason 'a routine agent identity, not a CI identity: its IAMRoleRead on role/* reads PlatformDev and PlatformAdmin by design, pinned by test_agent_session_user.py', as that plan's own conditional row says and re-measures the boundary (row 34). With row 34 its Deny takes the boundary to about 5,696 B, over the 5,632 B trigger; the operator's 2026-11-13 re-decision (the sidecar's second Decision) lets both land (row 34). PLAN-ci-branch-boundary-state-fence is already built (its Deny is in the 5,266 B base), so it is not a contender. A resource of it that never re-plans clean would refuse every CI run in this root until a CloudShell apply converges it."
  - "Decision scout for the amendment (critique r9 N7): the round-9 critique's Decision sweep stands in for a scout re-run on the boundary-trigger Decision; it found no conflict (Decision 177 cl.4 allows re-arming a reversal stanza; the raise-approved marker of Decisions 128 and 165 governs file budgets, not Decision triggers)."
  - "Boundary-trigger amendment (operator, 2026-11-13 17:57Z and 18:05Z): re-anchor the trigger with a new Decision that says it is explicitly to restore agent AWS access in a critical workflow failure (all agent work stopped, warehouse interactions down, recs and telemetry included), that fixes no number in the plan (the cap is the boundary's size once both builds finish) and that future agents cannot cite as an example of when circumventing a size limit is acceptable. The cap is the minified rendered size the 5,632 B trigger already measures, in PROD (SIT's rendering is 36 B longer for its bucket names; critique r9 B2), not the .tf file's bytes, and it stays a manual trigger as in Decisions 230 and 239; the 6,144 B precondition stays the hard ceiling. It lands with the other governed words in PR 2 because validate_merge_step binds the sidecar only in the PR that flips implementation_declared. It renders 3,684 B (validate_decisions_size's own section split; critique r10), inside the per-entry cap. The 230 and 239 blocks only re-arm each stanza's boundary condition to name the new Decision's clause 2 (Decision 239 goes 6,135 to 6,133 B, so it stays under the cap; 230, already 6,336 B on main, goes to 6,349 B, which validate_decisions_size only warns on); no dated note is added, because each re-armed condition names the amending Decision and its amends list carries both edges."
  - "Refusal set and governed text (critique r5 B1, N8): clause 2 lists sufficient refusal conditions, not the whole set. The gate refuses more (row 12: a write on the protected set through any service, wildcard and case forms, keyed, moved and imported rows, provisioners), and those refusals are what make the Intent's 'no CI run can change ... what watches it' true. Decision {{N}} renders 6,135 of its 6,144 B, so the full list lives in the gate, its fixtures and this plan, not in the governed words. The Decision 126 note no longer says 'only' (critique r6 N3). Not changed (r6): N4, because the 225 note already records bootstrap-plan-under-ci-identity firing and answered, with clause 1 standing for writes; N8, because the interim actor in Decisions 248 cl.6 and 252 cl.7 is re-decided by PLAN-agent-proxy-signed-access's Decision, which amends both, and clause 7 only confirms it. That Decision (branch claude/project-thread-ahs3q7 at 3e88b705) has the operator run admin steps from CloudShell until a later Decision moves a step, and carries admin-path-lands ('a Decision gives admin applies a path other than the operator's CloudShell ... re-decide clause 3'); this Decision fires it by moving the non-protected terraform/bootstrap applies, and its answer is clause 7: that Decision's clause 3 stands for every other admin step. Whichever of the two builds second reports the firing and that answer to the coordinator, so the operator's dated note on it is not missed."
  - "Owed follow-on recs, filed in VP 13 (exactly eight): 1 PR-time screened trusted plan for terraform/bootstrap (a terraform_hcl_screen policy row, the trusted-plan role's reads, the plan reviewer on a values-stripped bootstrap digest in a credential-free job), which retires clause 5's CloudShell pre-merge plan (L, High). 2 Decision 202's detector watches the gate's root of trust: any IAM write to bootstrap-* roles and policies, and any write made by bootstrap-apply (CreateRole and UpdateAssumeRolePolicy above all, since an approved run can create a role any principal may assume), alarms (S, High). 3 gated CI admin runbook (fixed menu: login provisioning invokes, IAM simulation, named secret uses) on its own role and Environment, retiring the remaining ADMIN-session carve-outs (213 cl.5, 230 cl.4, 237 cl.6, 251 cl.1, 204 cl.2) one by one (L, Medium). 4 broad SIT-only agent user once SIT exists, capped by an SCP (M, Low). 5 SIT's bootstrap root (Decision 252 cl.7) and the Organization root on the same pattern after the organization trail lands, plus any live stale instruction VP 12 lists (M, Low). 6 graduate test_bootstrap_ci_roles.py and the gate tests as registry shards (S, Low). 7 run the POST-APPLY simulate in CI after a grant-surface change, so SIMULATE_OWED needs no CloudShell paste, and carry VP 6's 32 cases as fixture rows (bootstrap-apply's under a second principal) so each simulate re-proves the guard and the boundary Deny, compacting the fixture to fit its cap (the trusted-plan fence forbids third-party Python in a tf-trusted-plan job, so it needs a stdlib simulate or a separate gated job; M, High); 8 owner of the boundary-trigger Decision's unenforced residuals (clause 1's no-headroom rule and clause 3's no-citation rule): a check or review step that refuses a plan, Decision or rec citing that Decision as authority for exceeding, re-anchoring or circumventing a size limit (S, Low). Drafts: /mnt/project-files/admin-environment/OWED-RECS.md."
