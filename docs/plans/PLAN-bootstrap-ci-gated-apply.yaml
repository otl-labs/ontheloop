      Every other Allow in the file that can reach either ARN still fails, and two red nodes prove it: an iam:Put* added
      to IAMRead, and IAMRoleMetadataWrite widened to role/*. No existing node or assertion changes (Decision 235).
  - file: .github/workflows/terraform-bootstrap-apply.yml
    action: Create
    purpose: >-
      BUILD PR 2. Copied in structure from terraform-github-apply.yml, with no GitHub App, mirror or gate_change.
      Header comment per that file's. on: push to main with paths terraform/bootstrap/**,
      .github/workflows/terraform-bootstrap-apply.yml and scripts/ci/terraform_bootstrap_apply*; workflow_dispatch with
      one boolean input prove_gate (default false). permissions contents read; concurrency group
      terraform-bootstrap-apply, cancel-in-progress false. preview job: if github.ref == 'refs/heads/main';
      environment {name: tf-trusted-plan, deployment: false}; permissions id-token write, contents read, actions read;
      outputs reviewed, has_changes, verdict; env TF_IN_AUTOMATION 1, TF_INPUT 0 and MASK_AWS_ROLE_ID_ACCOUNT_PART.
      Steps: checkout (persist-credentials false, pinned sha as the precedent); ./.github/actions/aws-region;
      configure-aws-credentials (pinned) with role arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/bootstrap-preview;
      ./.github/actions/materialise-tfvars; read config/terraform-version; setup-terraform (pinned, wrapper off);
      setup-python 3.12; read-only plan through scripts/ci/quiet_run.sh: init -input=false -lockfile=readonly, then plan
      -lock=false -input=false -no-color -detailed-exitcode -var-file=$GITHUB_WORKSPACE/terraform/personal/terraform.personal.tfvars
      -var aws_profile= -out=plan.bin (exit 0 or 2 else TF_BOOTSTRAP_PREVIEW_FAILED), show -json to $RUNNER_TEMP;
      python3 -I scripts/ci/terraform_bootstrap_apply_gate.py preview (writes the step summary and outputs); when
      has_changes or inputs.prove_gate, python3 -I scripts/ci/environment_reviewer_preflight.py environment
      --environment tf-bootstrap-apply; always: delete plan.bin, plan.json and the tfvars file. apply job: needs preview;
      if main and (needs.preview.outputs.has_changes == 'true' or inputs.prove_gate); environment tf-bootstrap-apply;
      same permissions; first step after checkout python3 -I scripts/ci/environment_reviewer_preflight.py approvals
      --environment tf-bootstrap-apply; then aws-region, credentials for role/bootstrap-apply, materialise-tfvars,
      terraform and python setup, and one step bash scripts/ci/terraform_bootstrap_apply.sh with REVIEWED and
      PROVE_GATE in env; always delete the tfvars file. Never uploads an artifact or prints plan text.
  - file: scripts/ci/terraform_bootstrap_apply_gate.py
    action: Create
    purpose: >-
      BUILD PR 2. Standard-library-only gate, shaped like terraform_github_apply_gate.py (reuse plan_names_core.py
      where it fits). classify(row): CI-writable only when actions are ["create"] or ["update"] (never delete, replace,
      read, forget or importing), the type is aws_iam_role, aws_iam_role_policy, aws_iam_role_policy_attachment or
      aws_iam_policy, and the target name (role name, the policy's role, the attachment's role and policy name, or the
      policy name) starts agent-platform- and is not agent-platform-github-ci-apply-boundary or agent-platform-session-*,
      and an aws_iam_role's permissions_boundary ends with :policy/agent-platform-github-ci-apply-boundary; an unknown
      value or any other type is protected (fail closed). Names are read from plan values and never printed beyond the
      address. preview: rows of address, action, changed attribute names and flags (NEW_ROLE, TRUST for a changed or new
      assume_role_policy, GRANT for a new or changed policy document or a new attachment, with the IAM action names an
      Allow statement gains, which are public HCL and contain no ARN), a first line "N changes; K privilege-affecting",
      verdict NO_CHANGES, REVIEWABLE or CLOUDSHELL_REQUIRED (any protected row, which the table marks), outputs
      has_changes (true only for REVIEWABLE), reviewed (JSON rows) and verdict; a push run with CLOUDSHELL_REQUIRED
      exits 0 with ::warning::CLOUDSHELL_REQUIRED and the count, a dispatch run exits 1; an unreadable plan exits 1.
      check: exit 0 only when every change is CI-writable and matches a reviewed row (same address and actions, changed
      names within the reviewed names); prove: exit 0 only when the plan has no change. PROTECTED_NAME_PATTERNS is one
      module constant the tests compare with the HCL guard.
  - file: scripts/ci/terraform_bootstrap_apply.sh
    action: Create
    purpose: >-
      BUILD PR 2. The apply job body, shaped like terraform_github_apply.sh: terraform text only through quiet_run.sh,
      init -lockfile=readonly, plan (locking) with the same -var-file and -var aws_profile= -out=apply.bin, show -json;
      PROVE_GATE true: gate prove, print PROVE_OK and stop without applying; else gate check against REVIEWED, apply
      apply.bin, then plan -detailed-exitcode and fail unless 0. Prints counts and tokens only (APPLY_REFUSED,
      APPLY_DONE, REPLAN_CLEAN, PROVE_OK), deletes plan files on exit, and never logs a value.
