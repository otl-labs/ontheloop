constraints:
  - "No rescue agents or workaround loops (Decision 55); never attempt or retry sts:AssumeRole or any other credential-minting call from a session. Until phase one's cutover, prefix every repo command with AWS_PROFILE=agent-platform-unset."
  - Never write a key, account id, ExternalId or ARN containing an account id into the repo, a PR, a comment, a job log or the shared folder (AGENTS.md public boundary, Decision 101); CI output is names and tokens only.
  - The governed files get exactly the sidecar's words (Decision 246). The operator's word on the final diff is required for PR 1's IAM and Environment text before VP 4-5, and for PR 2's workflow and both scripts before merge (coordinator always_ask; CODEOWNERS does not bind agent PRs, rec-2827).
  - No grant beyond scope row 1; a missing refresh read found in VP 10 or a SIM mismatch in VP 6 is a plan defect handled by amendment, never a build-time widening.
  - Loosens no assertion (Decision 235); the Decision 225 guard gains exactly the named reads allowance. Never adds terraform/bootstrap to terraform-apply-sandbox.yml or terraform_apply_guard.py.
  - Files other projects own are not edited; in terraform/github/environments.tf only the new resource pair is added.
