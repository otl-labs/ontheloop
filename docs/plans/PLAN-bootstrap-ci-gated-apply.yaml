  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (126, 144, 223, 225, 238, 248, 202, 237, 92, 77)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - "Start condition (infrastructure_dependencies): this plan merged and the operator's CI-RCA override given; no wait on PLAN-agent-proxy-signed-access."
execution_steps:
  - "BUILD PR 1. Tests first (scope rows 4 and 8-10), seen red on the unchanged tree; then terraform/bootstrap/bootstrap_ci_apply.tf, the boundary's Deny and the fixture rows (rows 34-35), the lock file (copy terraform/personal's hashicorp/aws block), the main.tf header and the environments.tf pair. Post: VP 1-2 pass."
  - "PR 1 Commit Flow (implement skill; git-ops.yaml handoff_sequence): VP 3, push, PR. At CI green ask the operator's final-diff word naming the full head sha; then post VP 4 and VP 5 at that sha and record the lines; merge only the head both cover, only after #2028 (PLAN-agent-ducklake-rest-api's build) has merged and been applied (infrastructure_dependencies; row 34), only when no other bootstrap change is merged and unapplied, and only when the operator is ready to run VP 6 in the same sitting. After merge run VP 6's PRE-APPLY drain check, post VP 6 expanded in full, then run VP 7."
  - "BUILD PR 2, from main after VP 6 and VP 7 pass. Tests first (rows 19-24), then the gate, the shell script, the workflow, the fence and manifest entry, the two fence edits, CODEOWNERS and the two ci_rca_taxonomy rows. Post: VP 8 passes."
  - "Hand-apply the sidecar's seventeen blocks verbatim, {{N}} filled three ways as the DECISIONS.md row says (the next free Decision number, a second distinct free number for the boundary-trigger Decision's sites (a rebase renumber may reorder the two) and the 230 and 239 blocks, and clause 2's measured byte count from VP 9) and {{DATE}} the build date, and fill {{N}} the same way in the ENV_WORKFLOWS and CODEOWNERS comments (PR 1's comments cite PLAN-bootstrap-ci-gated-apply, so PR 2 edits no PR 1 file); edit both CLAUDE.md files net-shrinking and lower the three prose budgets to the measured bytes. Post: VP 9 and VP 12 pass."
  - "PR 2 Commit Flow: full tier, push, PR, the operator's final-diff word at CI green (the workflow and both scripts), merge. Then VP 10, VP 11 and VP 13."
  - "Execute Verification Plan: run each step; loop until pass; on an unrecoverable V3 failure stop and RCA (Decision 55)."
  - "Report: what was implemented, the validation_result --verify-head verdicts, the operator-reported lines of VP 4-6, the run ids of VP 7, VP 10 and VP 11, the filed rec ids and both merge SHAs."
rollback: >-
  PR 2: a revert PR removes its workflow, scripts, fences and the sidecar words outside DECISIONS.md but keeps every
  DECISIONS.md block (append-only, Decision 177), adding a dated note to the CI apply Decision that bootstrap applies are
  back in CloudShell; the boundary-trigger Decision stands while PR 1's boundary is on main. CloudShell needs no
  other change. PR 1: the roles are harmless without the workflow, and the boundary's added Deny only denies; to remove them, a reviewed PR drops prevent_destroy
  and the resources and the operator applies it from CloudShell; the Environment goes by a terraform-github-apply.yml
  run that names it, after its prevent_destroy is removed in a reviewed PR.
