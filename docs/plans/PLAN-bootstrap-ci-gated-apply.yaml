bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - "terraform/bootstrap is admin-only (environment-taxonomy.yaml axis_a): BUILD PR 1 gets the operator's pre-merge screened CloudShell plan (VP 4-5) and the operator's post-merge CloudShell apply (VP 6), in phase one's VP 6-8 shape, so the roles exist before the workflow does. BUILD PR 2 changes no non-Markdown bootstrap file, so it needs no CloudShell plan; its first live contact is the merge push's preview (VP 10)."
  - "One merged-unapplied bootstrap change at a time: PR 1 merges only when no other bootstrap change is merged and unapplied (phase one's and #1987 included) and when the operator can run VP 6 in the same sitting."
  - "Order: PR 1 merged and applied (VP 6), then the Environment created (VP 7), then PR 2 merges. If PR 2 merged first its preview would fail to assume a missing role (a red main run); if the Environment were missing, GitHub would auto-create it unprotected and the approvals check would refuse the run."
  - "Start condition: PLAN-agent-proxy-signed-access's build is merged (this plan's Decision names its Decision and both edit DECISIONS.md, AGENTS.md and deploy-paths.yaml; this build rebases second) and its bootstrap apply is done."
  - "No Lambda code changes: no deploy channel runs. No new repository secret or variable: the workflow reuses AWS_ACCOUNT_ID, AWS_ROLE_ID_ACCOUNT_PART and TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS (no project-configuration.yaml row)."
acceptance_criteria:
  - "terraform/bootstrap declares bootstrap-apply and bootstrap-preview with one gated trust statement each, no boundary, and exactly row 1's four policies; test_bootstrap_ci_roles.py's real-tree nodes pass and its red node shows each predicate failing on its mutation; the Decision 225 guard admits only the reads allowance."
  - "After PR 1's apply, live IAM simulation of the applied policies returns allowed for the CI-writable cases and explicitDeny for each protected case, and implicitDeny or explicitDeny for every write by the preview role (VP 6)."
  - "tf-bootstrap-apply exists with a required reviewer, a main-only deployment policy and no admin bypass, created by one approved terraform-github-apply.yml run (VP 7) and read back by the preview's Environment check (VP 11)."
  - "terraform-bootstrap-apply.yml's preview runs on PR 2's merge push and reports NO_CHANGES (VP 10); a prove_gate dispatch waits for the operator's approval, its apply job passes the approvals check, assumes bootstrap-apply, plans no change and prints PROVE_OK (VP 11)."
  - "The gate refuses every protected, destroy, replace and import case in fixtures and the workflow fence, trusted-plan fence and reviewer-preflight fence pass with their red cases (VP 8)."
  - "DECISIONS.md, AGENTS.md, deploy-paths.yaml and environment-taxonomy.yaml carry exactly the sidecar's words (approved_text verify passes), and the stale-reference sweep finds no live 'bootstrap is never CI-applied' instruction (VP 12)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: BUILD PR 1. Run the new and changed tests.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_bootstrap_ci_roles.py
      tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
      tests/checks/ci_guards/test_validate_environment_reviewer_preflight.py -q
    expected: >-
      All pass, including every real-tree node and each parametrized mutation case of
      test_bootstrap_ci_predicates_are_red_on_each_mutation and the two new red nodes of the Decision 225 guard.
    fix_if: Any failure; fix the Terraform or the test's parsing, never an assertion's meaning (Decision 235).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates PR CI's diff-selected pytest of these files on every change; the named nodes in test_obligations pin
      the behaviour. The new test file has no registry shard yet, so only review and the full tier would notice its
      deletion; owed rec 6 graduates it.
  - step: 2
    phase: pre-deploy
    action: BUILD PR 1. Prove the standing IAM checks and provider-free formatting accept the new files.
    command: >-
      bin/venv-python -m scripts.checks.iam_tf.validate_iam_policy_size && bin/venv-python -m
      scripts.checks.iam_tf.validate_secret_parameter_grants && bin/venv-python -m
      scripts.checks.iam_tf.validate_boundary_attached && bin/venv-python -c "from
      scripts.checks.iam_tf.validate_account_portable_names import validate_account_portable_names as v; f = []; v(f);
      print(chr(10).join(f) or 'PORTABLE_OK'); raise SystemExit(1 if f else 0)" && terraform fmt -check -recursive
      terraform/bootstrap terraform/github && echo FMT_OK
    expected: >-
      The policy-size PASS line counts four more bootstrap policy resources than on main; the secret-grant and boundary
      checks exit 0; PORTABLE_OK and FMT_OK print.
    fix_if: A finding names the resource; fix the Terraform, never the check.
    hermetic: false
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: BUILD PR 1. Fast and full tiers before handoff.
    command: >-
      export AWS_PROFILE=agent-platform-unset && bin/venv-python -m scripts.validate --pre && bin/venv-python -m
      scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and validation_result verifies the head (the full tier is started in the background from the
      top-level session); the DQ refresh stops at ProfileNotFound and reports "AWS credentials not available --
      skipping".
    fix_if: Any failure; fix on the branch. A credential-check error means the AWS_PROFILE prefix was dropped.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      BUILD PR 1. ENVIRONMENT CHECK (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan), operator-run in AWS
      CloudShell in the PROD account as user/platform-breakglass, posted after the operator's final-diff word on PR 1.
      The "caller-arn check" label is the marker validate_admin_root_premerge_gate reads; no repo helper runs in
      CloudShell.
    command: >-
      ( printf 'caller-arn check: '; aws sts get-caller-identity --query Arn --output text 2> /dev/null | grep -q
      ':user/platform-breakglass$' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT )
    expected: caller-arn check, ADMIN_CHAIN_OK. The ARN itself is never printed.
    fix_if: >-
      ADMIN_CHAIN_ABSENT; the operator signs in as the break-glass user and re-runs, and VP 5 waits. Another admin
      sign-in by the operator's choice is recorded in the PR comment and asked about before VP 5.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: >-
      BUILD PR 1. PRE-MERGE GATE (ADMIN), operator-run in AWS CloudShell after VP 4, at the CI-green head the operator
      gave the final-diff word on (the build writes the full sha into PR_HEAD_SHA). The block is phase one's VP 7 shape:
      fetch the public repo's head into a scratch folder, screen it before init, install the pinned terraform checked
      against HashiCorp's SHA256SUMS, read the variable values from /secret/agent-platform-terraform-personal-tfvars and
      account_id from the caller without printing either, init with the new lock file and plan terraform/bootstrap
      read-only (-lock=false) on the sign-in's own credentials. The screen refuses (SCREEN_REFUSED) a head whose
      terraform/ and config diff from main's tip names any file but the four PR 1 terraform rows, or whose added .tf
      lines carry a provider, module, required_providers, provisioner, local-exec, external or http data source token,
      or whose lock file holds any provider but hashicorp/aws. An EXIT trap deletes the folder; errors go to
      $HOME/bca-tf.err, read in CloudShell only. The build records the returned lines as a counts-only PR comment.
    command: >-
      ( set -o pipefail; PR_HEAD_SHA=<full PR head sha>; W="${TMPDIR:-/tmp}/bca-head"; L="$HOME/bca-tf.err"; rm -rf "$W";
      mkdir -p "$W/bin"; : > "$L"; trap 'rm -rf "$W"' EXIT; unset AWS_PROFILE; { git init -q "$W/repo" && git -C
      "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git +refs/heads/main:refs/o/main && git -C
      "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git "$PR_HEAD_SHA" && git -C "$W/repo" checkout
      -q --detach FETCH_HEAD; } 2>> "$L" || { echo CLONE_FAILED; exit 1; }; F=$(git -C "$W/repo" diff --name-only
      refs/o/main HEAD -- terraform config/aws-region config/terraform-version 2>> "$L" | LC_ALL=C sort | tr '\n' ' ');
      X=$(git -C "$W/repo" diff refs/o/main HEAD -- 'terraform/*.tf' 2>> "$L" | grep -E '^\+' | grep -cE
      'data "(external|http)"|provider "|required_providers|module "|provisioner|local-exec'); K=$(grep -cE '^provider '
      "$W/repo/terraform/bootstrap/.terraform.lock.hcl" 2>> "$L"); H=$(grep -cE '^provider
      "registry.terraform.io/hashicorp/aws" ' "$W/repo/terraform/bootstrap/.terraform.lock.hcl" 2>> "$L"); [ "$F" =
      "terraform/bootstrap/.terraform.lock.hcl terraform/bootstrap/bootstrap_ci_apply.tf terraform/bootstrap/main.tf terraform/github/environments.tf " ]
      && [ "$X" = 0 ] && [ "$K" = 1 ] && [ "$H" = 1 ] || { echo SCREEN_REFUSED; exit 1; }; echo SCREEN_OK; R=$(tr -d
      '[:space:]' < "$W/repo/config/aws-region"); export AWS_REGION="$R" AWS_DEFAULT_REGION="$R"; V=$(tr -d '[:space:]' <
      "$W/repo/config/terraform-version"); case "$(uname -m)" in aarch64) P=linux_arm64 ;; *) P=linux_amd64 ;; esac;
      Z="terraform_${V}_${P}.zip"; { curl -fsSL -o "$W/$Z" "https://releases.hashicorp.com/terraform/$V/$Z" && curl -fsSL
      -o "$W/sums" "https://releases.hashicorp.com/terraform/$V/terraform_${V}_SHA256SUMS" && ( cd "$W" && grep " $Z\$"
      sums | sha256sum -c --quiet - ) && unzip -qo "$W/$Z" -d "$W/bin"; } >> "$L" 2>&1 || { echo TERRAFORM_INSTALL_FAILED;
      exit 1; }; export PATH="$W/bin:$PATH"; command -v jq > /dev/null || { echo JQ_ABSENT; exit 1; }; aws ssm
      get-parameter --name /secret/agent-platform-terraform-personal-tfvars --with-decryption --query Parameter.Value
      --output text > "$W/vars.tfvars" 2>> "$L" && test -s "$W/vars.tfvars" || { echo TFVARS_ABSENT; exit 1; }; A=$(aws
      sts get-caller-identity --query Account --output text 2>> "$L"); test -n "$A" || { echo IDENTITY_FAILED; exit 1; };
      B="$W/repo/terraform/bootstrap"; terraform -chdir="$B" init -input=false -lockfile=readonly
      -backend-config="region=$R" > /dev/null 2>> "$L" || { echo INIT_FAILED; exit 1; }; terraform -chdir="$B" plan
      -lock=false -input=false -no-color -detailed-exitcode -var-file="$W/vars.tfvars" -var "account_id=$A" -var
      "aws_profile=" -out="$W/head.bin" > "$W/plan.txt" 2>> "$L"; echo "HEAD_PLAN_EXIT $?"; grep -E '^Plan: '
      "$W/plan.txt"; terraform -chdir="$B" show -json "$W/head.bin" | jq -r '.resource_changes[] |
      select(.change.actions != ["no-op"]) | "\(.change.actions | join(",")) \(.address)"' | LC_ALL=C sort; echo
      "PR_HEAD_SHA $PR_HEAD_SHA" )
    expected: >-
      SCREEN_OK; HEAD_PLAN_EXIT 2; Plan: 11 to add, 0 to change, 0 to destroy.; exactly eleven create lines, for
      aws_iam_policy.bootstrap_apply_guard, aws_iam_policy.bootstrap_apply_write, aws_iam_policy.bootstrap_plan_reads,
      aws_iam_policy.bootstrap_preview_guard, aws_iam_role.bootstrap_apply, aws_iam_role.bootstrap_preview and
      aws_iam_role_policy_attachment.bootstrap_apply_guard, .bootstrap_apply_reads, .bootstrap_apply_write,
      .bootstrap_preview_guard and .bootstrap_preview_reads; PR_HEAD_SHA with the sha the build wrote.
    fix_if: >-
      SCREEN_REFUSED: nothing was initialised; if main moved under terraform/ the build rebases and asks the word again,
      else the head carries files beyond scope and the build stops and reports; the screen is never widened. A setup
      failure line: the operator reads $HOME/bca-tf.err in CloudShell and re-pastes. INIT_FAILED with a lock checksum
      error: the lock is wrong; fix it before merge. Any other address, an update or a destroy (for example another
      merged-unapplied bootstrap change): stop, do not merge, report to the coordinator. A precondition failure names
      the oversized policy: split it.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: >-
      BUILD PR 1. OPERATOR STEP, AWS CloudShell in the PROD account, in the same sitting as the merge. VP 5's fetch,
      screen, install, variable and init lines at the merge sha M (the screen on the merge commit's own diff), then a
      saved plan applied only when its summary is exactly 11 to add, 0 to change, 0 to destroy and its addresses are
      exactly VP 5's, a fresh plan, and IAM simulation of the applied policies (read-only; the ARNs are built from the
      caller's account in-shell and never printed). The operator's paste is the direction for the apply (Decision 126
      cl.1). No detector email is expected: no filter matches bootstrap-* names.
    command: >-
      ( set -o pipefail; M=<full merge sha>; <VP 5's lines from W= through the init line, with W="${TMPDIR:-/tmp}/bca-merge",
      a --depth 2 fetch of "$M" and the screen diffing HEAD^ HEAD>; terraform -chdir="$B" plan -input=false -no-color
      -var-file="$W/vars.tfvars" -var "account_id=$A" -var "aws_profile=" -out="$W/merge.bin" > "$W/plan.txt" 2>> "$L";
      s=$(grep -E '^Plan: ' "$W/plan.txt"); echo "MERGE_PLAN $s"; a=$(terraform -chdir="$B" show -json "$W/merge.bin" | jq
      -r '.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions | join(",")) \(.address)"' |
      LC_ALL=C sort | tr '\n' ' '); e='<the eleven "create <address> " pairs of VP 5, sorted>'; if [ "$s" = "Plan: 11 to
      add, 0 to change, 0 to destroy." ] && [ "$a" = "$e" ]; then terraform -chdir="$B" apply -input=false -no-color
      "$W/merge.bin" 2>> "$L" | grep -E '^Apply complete!'; terraform -chdir="$B" plan -input=false -no-color
      -detailed-exitcode -var-file="$W/vars.tfvars" -var "account_id=$A" -var "aws_profile=" > /dev/null 2>> "$L"; echo
      "BOOTSTRAP_PLAN_EXIT $?"; else echo APPLY_SKIPPED; exit 1; fi; r() { aws iam simulate-principal-policy
      --policy-source-arn "arn:aws:iam::$A:role/$1" --action-names "$2" --resource-arns "$3" ${4:+--context-entries "$4"}
      --query 'EvaluationResults[0].EvalDecision' --output text 2>> "$L"; }; Q="ContextKeyName=iam:PermissionsBoundary,ContextKeyType=string,ContextKeyValues=arn:aws:iam::$A:policy/agent-platform-github-ci-apply-boundary";
      I="arn:aws:iam::$A"; for c in "ci-inline bootstrap-apply iam:PutRolePolicy $I:role/agent-platform-github-ci-apply
      $Q" "ci-reads-version bootstrap-apply iam:CreatePolicyVersion $I:policy/agent-platform-github-ci-apply-reads"
      "admin-inline bootstrap-apply iam:PutRolePolicy $I:role/PlatformAdmin $Q" "dev-trust bootstrap-apply
      iam:UpdateAssumeRolePolicy $I:role/PlatformDev" "self-trust bootstrap-apply iam:UpdateAssumeRolePolicy
      $I:role/bootstrap-apply" "settings-inline bootstrap-apply iam:PutRolePolicy $I:role/github-settings-apply $Q"
      "user-key bootstrap-apply iam:CreateAccessKey $I:user/agent-platform-session" "boundary-version bootstrap-apply
      iam:CreatePolicyVersion $I:policy/agent-platform-github-ci-apply-boundary" "session-policy bootstrap-apply
      iam:CreatePolicyVersion $I:policy/agent-platform-session-guard" "oidc bootstrap-apply
      iam:UpdateOpenIDConnectProviderThumbprint $I:oidc-provider/token.actions.githubusercontent.com" "secret
      bootstrap-apply secretsmanager:GetSecretValue *" "assume bootstrap-apply sts:AssumeRole $I:role/PlatformAdmin"
      "preview-write bootstrap-preview iam:PutRolePolicy $I:role/agent-platform-github-ci-apply $Q" "preview-state
      bootstrap-preview s3:GetObject arn:aws:s3:::agent-platform-bootstrap-tfstate/terraform.tfstate"; do set -- $c; echo
      "SIM $1 $(r "$2" "$3" "$4" "$5")"; done; echo "MERGE_SHA $M" )
    expected: >-
      SCREEN_OK; MERGE_PLAN Plan: 11 to add, 0 to change, 0 to destroy.; Apply complete! Resources: 11 added, 0 changed,
      0 destroyed.; BOOTSTRAP_PLAN_EXIT 0; SIM ci-inline allowed, SIM ci-reads-version allowed, SIM admin-inline
      explicitDeny, SIM dev-trust explicitDeny, SIM self-trust explicitDeny, SIM settings-inline explicitDeny, SIM
      user-key explicitDeny, SIM boundary-version explicitDeny, SIM session-policy explicitDeny, SIM oidc explicitDeny,
      SIM secret explicitDeny, SIM assume explicitDeny, SIM preview-write explicitDeny, SIM preview-state allowed;
      MERGE_SHA with the merge sha.
    fix_if: >-
      SCREEN_REFUSED, APPLY_SKIPPED or any other count: nothing was applied; stop and report to the coordinator as a plan
      defect, never a second paste. BOOTSTRAP_PLAN_EXIT 2 after the apply: stop and report; a half-applied state is
      re-planned, never hand-edited. A SIM line other than expected is a policy defect: PR 2 does not start until a
      fix (a protected-set change, so a CloudShell apply again) makes it match; the build expands the block's
      placeholders into the full paste before posting it.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      BUILD PR 1. Create tf-bootstrap-apply. PR 1's merge push runs terraform-github-apply.yml, whose preview ends
      neutral naming the dispatch owed for the two new Environment addresses. The build dispatches it from main with
      gate_change naming exactly those two; the operator reads the preview and approves in tf-gated-apply; the build
      reads back the run.
    command: >-
      mcp__github__actions_run_trigger(owner="otl-labs", repo="ontheloop", workflow_id="terraform-github-apply.yml",
      ref="main", inputs={"gate_change":
      "github_repository_environment.tf_bootstrap_apply,github_repository_environment_deployment_policy.tf_bootstrap_apply_main"}),
      then after the operator's approval mcp__github__actions_get on the run and get_job_logs for the apply job
    expected: >-
      The push run's preview concluded success with the ::warning:: naming the owed dispatch; the dispatched run's
      preview lists exactly two creates, the apply job concludes success after the approval, and its log shows the two
      creates applied and a clean re-plan.
    fix_if: >-
      Any other change in the preview (for example another merged terraform/github change): stop and report; never widen
      gate_change. An apply failure: read the job log's token lines and report; the Environment is never created by hand.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: BUILD PR 2. Run the new and changed tests.
    command: >-
      bin/venv-python -m pytest tests/test_terraform_bootstrap_apply_gate.py tests/test_terraform_bootstrap_apply_sh.py
      tests/checks/ci_guards/test_validate_bootstrap_apply.py
      tests/checks/ci_guards/test_validate_trusted_plan_environment.py
      tests/checks/ci_guards/test_validate_environment_reviewer_preflight.py tests/checks/ci_guards/test__manifest.py
      tests/checks/iam_tf/test_bootstrap_ci_roles.py -q
    expected: >-
      All pass, including test_protected_patterns_match_hcl_denies, every refusal fixture, each predicate's red node,
      test_bootstrap_apply_preview_is_governed and test_bootstrap_apply_jobs_check_their_environment.
    fix_if: Any failure; fix the code, never an assertion's meaning (Decision 235).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates PR CI's diff-selected pytest and the registered fast-tier fence validate_bootstrap_apply, which runs on
      every PR touching its globs; owed rec 6 graduates the gate tests.
  - step: 9
    phase: pre-deploy
    action: BUILD PR 2. Bind the governed wording to the sidecar, then the fast and full tiers.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug bootstrap-ci-gated-apply --base origin/main &&
      export AWS_PROFILE=agent-platform-unset && bin/venv-python -m scripts.validate --pre && bin/venv-python -m
      scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      verify reports every bound file equal to its base words with the fourteen blocks applied; both tiers pass and
      validation_result verifies the head.
    fix_if: >-
      A mismatch: re-apply the block verbatim (only {{N}} and {{DATE}} may differ); an anchor that phase one's build
      moved is re-anchored only, which keeps the approval. A prose-budget failure: lower the entry to the measured
      bytes; a surface that grew is a plan defect, never a raise.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      BUILD PR 2. First live run: PR 2's merge push starts terraform-bootstrap-apply.yml; the build reads the run back.
    command: >-
      mcp__github__actions_list(owner="otl-labs", repo="ontheloop", method="list_workflow_runs",
      resource_id="terraform-bootstrap-apply.yml") for the merge sha, then mcp__github__actions_get and get_job_logs for
      its preview job
    expected: >-
      The preview job concludes success with verdict NO_CHANGES (no bootstrap change is pending) and has_changes false;
      the apply job is skipped.
    fix_if: >-
      An AccessDenied refresh read or another plan failure is a red main run: report it to the coordinator with the
      job's token lines; the fix is a bootstrap-plan-reads change, a protected-set change applied from CloudShell after
      a plan amendment, never a widening of anything else. A pending change (verdict REVIEWABLE or CLOUDSHELL_REQUIRED)
      means another bootstrap change landed unapplied: stop and report.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      BUILD PR 2. Prove the gate: the build dispatches the workflow from main with prove_gate true; the operator approves
      the apply job in tf-bootstrap-apply after the preview shows NO_CHANGES; the build reads the run back.
    command: >-
      mcp__github__actions_run_trigger(owner="otl-labs", repo="ontheloop", workflow_id="terraform-bootstrap-apply.yml",
      ref="main", inputs={"prove_gate": "true"}), then after the approval mcp__github__actions_get and get_job_logs for
      both jobs
    expected: >-
      The preview reports NO_CHANGES and its "Check the apply Environment has reviewers" step passes; the apply job
      starts only after the approval, its approvals check passes, it assumes bootstrap-apply, initialises, plans no
      change and prints PROVE_OK; both jobs conclude success.
    fix_if: >-
      An assume failure: compare the role's sub and job_workflow_ref with the run's OIDC claims (names only) and report;
      the trust is never loosened to StringLike. An approvals-check refusal: the Environment's reviewers are wrong; fix
      through terraform-github-apply.yml.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: pre-deploy
    action: BUILD PR 2. Stale-reference sweep for the retired "bootstrap is never CI-applied" instruction.
    command: >-
      rg -n -i "never be added to any auto-apply workflow|bootstrap root is admin-only out-of-band|applied only manually
      under agent_platform_admin|which CI never applies" AGENTS.md terraform/ docs/contracts/ .claude/ scripts/ || echo
      SWEEP_CLEAN
    expected: >-
      SWEEP_CLEAN, or only lines inside dated history (amendment_log entries, DECISIONS.md text the notes amend) and
      the terraform/bootstrap/CLAUDE.md sentence that still forbids adding the root to terraform-apply-sandbox.yml or
      any auto-apply path, which stays true.
    fix_if: A live instruction elsewhere is listed in the PR body and becomes owed rec 5's item, owner asked first.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: >-
      File the owed follow-on recs through the portal once the recs store answers (after phase one's cutover), with
      get_rec_write_guidance first; record the returned ids in the build PR comment.
    command: >-
      bin/venv-python -c "from scripts.ops_data_portal import get_rec_write_guidance; print(get_rec_write_guidance())"
      && bin/venv-python -m scripts.ops_data_portal --help > /dev/null && echo PORTAL_READY
    expected: PORTAL_READY, then six file_rec calls returning six rec ids, recorded on the PR.
    fix_if: >-
      The reader or writer does not answer: the drafts stay in /mnt/project-files/admin-environment/OWED-RECS.md and the
      coordinator files them after cutover.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: terraform/bootstrap/bootstrap_ci_apply.tf
    behavior: Gated trusts; no boundary; closed Allow set limited to boundary-carrying agent-platform-* IAM and the state; every protected Deny; a read-only preview.
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_bootstrap_ci_roles.py
    red_green_expectation: red before (file absent), green after
  - source: terraform/bootstrap/.terraform.lock.hcl
    behavior: One provider, hashicorp/aws, pinned with terraform/personal's version and hashes.
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_bootstrap_ci_roles.py::test_bootstrap_lock_pins_aws
    red_green_expectation: red before (lock absent), green after
  - source: terraform/bootstrap/main.tf
    behavior: Header comment only.
    verification_step: 3
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Comment text only; no resource, provider or backend line changes, which VP 5's plan count shows and its screen
      guards.
  - source: terraform/github/environments.tf
    behavior: tf-bootstrap-apply is reviewer-gated, main-only, without admin bypass and never destroyed.
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_bootstrap_ci_roles.py::test_bootstrap_apply_environment_declared
    red_green_expectation: red before (Environment absent), green after
  - source: tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
    behavior: Decision 225's guard admits only bootstrap-plan-reads' iam reads on PlatformDev and PlatformAdmin.
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
    red_green_expectation: red before (the new file's IAMRead matches both ARNs), green after the allowance
  - source: .github/workflows/terraform-bootstrap-apply.yml
    behavior: Triggers, jobs, Environments, role partition, approvals-first and no plan output are fenced.
    verification_step: 8
    test_selector: tests/checks/ci_guards/test_validate_bootstrap_apply.py
    red_green_expectation: red before (workflow and check absent), green after
  - source: scripts/ci/terraform_bootstrap_apply_gate.py
    behavior: Protected, destroy, replace, import and unknown rows never apply; names-only output; matching against the reviewed set.
    verification_step: 8
    test_selector: tests/test_terraform_bootstrap_apply_gate.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/ci/terraform_bootstrap_apply.sh
    behavior: Exact terraform argv, prove mode stops before apply, refusal and dirty re-plan fail, plan files removed.
    verification_step: 8
