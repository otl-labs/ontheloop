  - "BUILD PR 2, from main after VP 6 and VP 7 pass. Tests first (rows 15-19), then the gate, the shell script, the workflow, the fence and manifest entry, the two fence edits, CODEOWNERS and the two ci_rca_taxonomy rows. Post: VP 8 passes."
