constraints:
  - "No rescue agents or workaround loops (Decision 55); never attempt or retry sts:AssumeRole or any other credential-minting call from a session. Until phase one's cutover, prefix every repo command with AWS_PROFILE=agent-platform-unset."
  - Never write a key, account id, ExternalId or ARN containing an account id into the repo, a PR, a comment, a job log or the shared folder (AGENTS.md public boundary, Decision 101); CI output is names and tokens only.
  - The governed files get exactly the sidecar's words (Decision 246). The operator's word on the final diff is required for PR 1's IAM and Environment text before VP 4-5, and for PR 2's workflow and both scripts before merge (coordinator always_ask; CODEOWNERS does not bind agent PRs, rec-2827).
  - No grant beyond scope row 1 and no boundary change beyond row 34's Deny; a missing refresh read found in VP 10 or a SIM mismatch in VP 6 is a plan defect handled by amendment, never a build-time widening.
  - Loosens no assertion (Decision 235); the Decision 225 guard gains exactly the named reads allowance. Never adds terraform/bootstrap to terraform-apply-sandbox.yml or terraform_apply_guard.py.
  - Files other projects own are not edited; in terraform/github/environments.tf only the new resource pair is added.
context:
  - "Decision-scout r2 FLAGS_FOUND (/mnt/project-files/admin-environment/SCOUT-r2.md; r1 for the earlier admin-user direction: SCOUT-r1.md). Decisions triaged: 206 of 206. Roadmap items intersected: 5; CONFLICT: 0; RELATED: 4. Serves: NS.9 4/5. CITE: 126, 77, 92, 94, 113, 143, 233, 237, 246, 205, 167/177. Dispositions: 92 pt 4, 126 cl.1, 144 cl.3-4, 223 cl.1, 225 cl.6 and 238 cl.2 amended by sidecar notes (92 added after critique round 1) (225's bootstrap-plan-under-ci-identity and ci-root-declares-platform-role answered there; 223's ci-writable-again does not fire because PlatformDev and PlatformAdmin stay unwritable by any CI identity); 248 held (its roles and key policy are in the protected set, so cl.6 stays true); 172 held (local.github_repos immutable segments); 202 held (detector left out of the Allows, every platform-security-* resource denied); 237 held (the tfvars parameter by literal ARN to these two consumers; no copy of PlatformAdmin's pattern grant); 180 held (every IAM write on PlatformAdmin denied); 252 cl.7 held (PROD backend only); NS.9 met by the flags; T4.15 c13's launcher grant is a PlatformDev change, so it stays in the protected set (CloudShell); only a CI-role half of it could ride this pipeline."
  - "Design evidence: blind Fable consults ADVICE-r2.md (CI-first) and ADVICE-r3.md (principal, pre-merge plan, split) in /mnt/project-files/admin-environment/; the operator chose CI-first (card, 2026-11-13) and said 'write the plan' 12:26Z. Taken from r3: a dedicated gated role, not PlatformAdmin's trust; keep the operator's pre-merge plan until a PR-time plan (r3's option a); explicit Denies as the real control; privilege flags; reviewer and Environment main-only. Changed from r3 and from the 12:39Z message, and chosen by the operator on a card 13:23Z: no separate anchor root; the two roles sit in terraform/bootstrap under explicit self-Denies, because a new root would escape the bootstrap-scoped standing checks (validate_iam_policy_size, validate_secret_parameter_grants, validate_account_portable_names) and the Deny already stops any CI run changing them."
  - "Split: one plan, two build PRs with disjoint files and a fixed order (infrastructure_dependencies). PR 1: roles, lock file, header, Environment and their tests (CloudShell plan and apply, one tap). PR 2: workflow, gate, fences, docs and the sidecar's governed words (no CloudShell plan; one tap for the proof run). The governed words ride PR 2 because approved_text binds all fifteen blocks in one PR."
  - "Operator flow after this lands, until a PR-time trusted plan covers the root: a bootstrap PR gets the operator's screened CloudShell plan before merge (pre_merge_live_plan, unchanged), then one tap after merge; a CLOUDSHELL_REQUIRED plan gets the operator's CloudShell apply instead, as today."
  - "UNPROVEN until VP 6: that IAM simulation evaluates each guard Deny as written (fixtures only before), and that CloudShell's python3 runs scripts.ci.iam_simulate (boto3, PyYAML, version). UNPROVEN until VP 10: that bootstrap-plan-reads covers every refresh read the provider makes for this root's 21 resource types (per-service read families chosen so no iterative discovery is expected). UNPROVEN until VP 11: that the OIDC claims of a tf-bootstrap-apply job match the trust exactly. UNPROVEN until the first CI-writable bootstrap change: the apply path's write grants end to end (copied from github_ci_apply's proven Sids). UNPROVEN, never probed live: that a job outside tf-bootstrap-apply cannot assume bootstrap-apply (static tests only; IAM StringEquals)."
  - "Graduated shards kept unchanged (their test files are only extended, no node renamed or removed): dependabot-config-guard-is-pre-tier-on-config-edits, platform-admin-absent-from-ci-write-patterns, terraform-gate-lock-readonly (whole-file node, so the renamed exact-set test stays in it), terraform-github-import-blocks, trusted-plan-deployment-false, trusted-plan-environment-fence. validate_bootstrap_apply declares examined()/skipped() (Decision 170) and its graduation is waived in VP 8 (owed rec 6)."
  - "Proxy independence (2026-11-13: proxy signing of Function URLs fails, IAM signs): nothing in either build PR or the pipeline is signed by the session proxy; only VP 13's rec filing uses the recs store, and it falls back to the drafts."
  - "SIT (Decision 252): like the github-settings roles, the two roles also land in SIT's bootstrap state when the operator applies SIT, unused there until SIT's bootstrap gets its own pipeline (owed rec 5); this workflow plans and applies the PROD backend only. PROD bootstrap is thus CI-applied from main while SIT bootstrap stays admin-applied, a deliberate gap in 252's promote-only intent until rec 5."
