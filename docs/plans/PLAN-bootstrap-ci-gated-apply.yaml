  - file: tests/checks/iam_tf/test_bootstrap_ci_roles.py
    action: Create
    purpose: >-
      BUILD PR 1. Credential-free text tests in the iam_tf predicate convention (each predicate returns a problem list;
      red cases drive the real predicate on mutated text). Real-tree nodes: test_bootstrap_roles_trust_one_gated_subject
      (each role has exactly one trust statement, StringEquals only, aud, the sub built from local.github_repos for its
      one Environment, and job_workflow_ref exactly the workflow at refs/heads/main; no StringLike, no ref subject);
      test_bootstrap_roles_are_boundary_free_by_name (neither carries permissions_boundary, both names are outside
      agent-platform-*, both prevent_destroy); test_bootstrap_apply_grants_are_closed (the union of Allow actions over
      the apply role's attached policies equals row 1's set, and every IAM write Allow's Resource starts role/agent-platform-*
      or policy/agent-platform-*); test_bootstrap_apply_create_and_write_carry_boundary_condition;
      test_bootstrap_preview_has_no_write (every Allow action is a read family or the two object and parameter reads,
      and DenyAllButReads' NotAction equals the reads policy's actions plus sts:GetCallerIdentity);
      test_bootstrap_apply_guard_covers_protected_set (each Deny Sid in row 1 is present with its Action and Resource
      sets, and every IAM role, user and policy terraform/bootstrap declares whose name is not agent-platform-* or is
      agent-platform-github-ci-apply-boundary or agent-platform-session-* is matched by a Deny resource pattern, with a
      parsed set of at least PlatformAdmin, PlatformDev, github-settings-apply, bootstrap-apply and the boundary, so an
      empty parse fails); test_bootstrap_detector_resources_denied (every platform-security-* resource type the root
      declares has an ARN pattern in DenyDetectorWrite); test_bootstrap_lock_pins_aws (the lock holds one provider,
      hashicorp/aws, with the version and hash list of terraform/personal's lock); test_bootstrap_apply_environment_declared
      (environments.tf declares tf-bootstrap-apply with reviewers, can_admins_bypass false, custom branch policies, a
      main deployment policy and prevent_destroy). test_bootstrap_ci_predicates_are_red_on_each_mutation is
      parametrized over one mutation per class: an extra Allow verb, an IAM write on a non-prefixed resource, a missing
      boundary condition, a ref subject, a StringLike trust, a second trust statement, a boundary added to a role, a
      write Allow on the preview, a dropped protected Deny resource, a new non-prefixed role in another bootstrap file
      without a Deny, a missing detector pattern, a lock with a second provider, an Environment with admin bypass.
  - file: tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
    action: Modify
    purpose: >-
      BUILD PR 1. Decision 225 cl.5's guard scans terraform/bootstrap/bootstrap_ci_apply.tf too and gains exactly one
      allowance, named for Decision {{N}} (225's bootstrap-plan-under-ci-identity answer): Allow statements of
