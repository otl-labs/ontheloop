    fix_if: >-
      Any other change in the preview (for example another merged terraform/github change): stop and report; never widen
      gate_change. An apply failure: read the job log's token lines and report; the Environment is never created by hand.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: BUILD PR 2. Run the new and changed tests.
    command: >-
      bin/venv-python -m pytest tests/test_terraform_bootstrap_apply_gate.py tests/test_terraform_bootstrap_apply_sh.py
      tests/checks/ci_guards/test_validate_bootstrap_apply.py
      tests/checks/ci_guards/test_validate_trusted_plan_environment.py
      tests/checks/ci_guards/test_validate_environment_reviewer_preflight.py tests/checks/ci_guards/test__manifest.py
      tests/checks/iam_tf/test_bootstrap_ci_roles.py -q
    expected: >-
      All pass, including test_protected_patterns_match_hcl_denies, every refusal and screen fixture, each predicate's
      red node,
      test_bootstrap_apply_preview_is_governed and test_bootstrap_apply_jobs_check_their_environment.
    fix_if: Any failure; fix the code, never an assertion's meaning (Decision 235).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates PR CI's diff-selected pytest and the registered fast-tier fence validate_bootstrap_apply, which runs on
      every PR touching its globs; owed rec 6 graduates the gate tests.
  - step: 9
    phase: pre-deploy
    action: >-
      BUILD PR 2. Measure the boundary, bind the governed wording to the sidecar, then the fast and full tiers. Before
      verify, the build renders github_ci_apply_boundary.tf's policy on PR 2's rebased main by row 34's method (the
      minified document the boundary's precondition measures, with a twelve-digit placeholder account id and the
      real region; the command's script renders PROD and SIT), confirms
      its statement Sids are exactly those at 1fb6ff15 plus DenyApiGatewayWrite and DenyBoundedWriteOnProtectedRoles
      (the script compares the rendered Sid sets), and writes the PROD byte count, digits only,
      as the boundary-trigger Decision's clause 2 number before running the command; the PR body states the count and the method.
    command: |-
      bin/venv-python -I - terraform/bootstrap/github_ci_apply_boundary.tf docs/DECISIONS.md \
        <(git show 1fb6ff15:terraform/bootstrap/github_ci_apply_boundary.tf) > "$HOME/bca-bytes.txt" <<'PY'
      import json, re, sys
      tf, dec, base = sys.argv[1], sys.argv[2], sys.argv[3]
      region = open("config/aws-region").read().strip()
      key = "github_ci_apply_boundary_policy_json = jsonencode("
      def render(t, suffix):
          s = t.index(key) + len(key); d = 0
          for i in range(s, len(t)):
              d += {"{": 1, "}": -1}.get(t[i], 0)
              if d == 0:
                  break
          keep = []
          for line in t[s:i + 1].splitlines():
              if not line.strip() or line.strip().startswith("#"):
                  continue
              keep.append(line.rstrip() if line.strip().startswith('"') and "#" in line else line.split("#", 1)[0].rstrip())
          b = "\n".join(keep)
          b = re.sub(r'^(\s*)([A-Za-z_]\w*)\s*=', r'\1"\2":', b, flags=re.M)
          b = re.sub(r'^(\s*)("[^"]+")\s*=', r'\1\2:', b, flags=re.M)
          b = re.sub(r'(["\]\}])\s*\n(\s*["\{])', r'\1,\n\2', b)
          b = re.sub(r",(\s*[\]\}])", r"\1", b)
          b = b.replace("${var.account_id}", "0" * 12).replace("${var.aws_region}", region)
          b = b.replace("${local.data_lake_bucket_arn}", "arn:aws:s3:::agent-platform-data-lake" + suffix)
          return json.loads(b)
      def sids(doc):
          return {s.get("Sid", "") for s in doc["Statement"]}
      t = open(tf, encoding="utf-8").read()
      size = lambda suffix: len(json.dumps(render(t, suffix), separators=(",", ":")))
      prod, sit = size(""), size("-sit")
      denies = {"DenyApiGatewayWrite", "DenyBoundedWriteOnProtectedRoles"}
      head = sids(render(t, ""))
      extra = sorted(head - sids(render(open(base, encoding="utf-8").read(), "")) - denies)
      both = denies <= head
      m = re.findall(r"PROD rendering passes (\d+) bytes", open(dec, encoding="utf-8").read())
      c2 = int(m[0]) if len(m) == 1 else -1
      ok = both and not extra and c2 == prod and prod <= 6144 and sit <= 6144
      print(f"BOUNDARY_BYTES prod={prod} sit={sit} clause2={c2} both_denies={both} extra_sids={','.join(extra) or 'none'}",
            "BOUNDARY_CAP_OK" if ok else "BOUNDARY_CAP_FAIL")
      PY
      cat "$HOME/bca-bytes.txt" && grep -q BOUNDARY_CAP_OK "$HOME/bca-bytes.txt" &&
        bin/venv-python -m scripts.roadmap.approved_text verify --slug bootstrap-ci-gated-apply --base origin/main &&
        export AWS_PROFILE=agent-platform-unset && bin/venv-python -m scripts.validate --pre &&
        bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      One line BOUNDARY_BYTES prod=P sit=S clause2=P both_denies=True extra_sids=none BOUNDARY_CAP_OK, with P the PROD rendering
      (about 5,696) and S the SIT rendering (P plus 36 for its longer bucket names), both at most 6,144; then verify
      reports every bound file equal to its base words with the seventeen blocks applied; both tiers pass and
      validation_result verifies the head.
    fix_if: >-
      BOUNDARY_CAP_FAIL with both_denies=False: PLAN-agent-ducklake-rest-api's Deny is not on main (PR 1 should not have merged before it), so stop and report to the coordinator. If that plan is withdrawn or re-planned, the boundary needs no re-anchor (5,588 B) and a sidecar-only PR drops the boundary-trigger Decision and the 230 and 239 blocks, with a fresh operator approval, before PR 2. extra_sids other than none: a statement beyond the two Denies reached the boundary; stop and report (row 34; clause 1 grants it no headroom). clause2=-1 or a clause2 mismatch: write the measured PROD count into clause 2. An empty bca-bytes.txt or a traceback: fetch 1fb6ff15 or fix the renderer for a changed layout, never skip the measurement. A measured size over 6,144 B cannot occur (the precondition fails the apply first). A verify mismatch: re-apply the block verbatim (only {{N}} and {{DATE}} may differ). An anchor another merged change
      moved, or a note that would land out of date order (phase one's 223 note shares this anchor), is re-anchored in a
      sidecar-only PR merged before this build PR (approved_digest drops anchor words, so the approval holds); the build
      PR never edits the sidecar. A prose-budget failure: lower the entry to the measured
      bytes; a surface that grew is a plan defect, never a raise.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      BUILD PR 2. First live run: PR 2's merge push starts terraform-bootstrap-apply.yml; the build reads the run back.
    command: >-
      mcp__github__actions_list(owner="otl-labs", repo="ontheloop", method="list_workflow_runs",
      resource_id="terraform-bootstrap-apply.yml") for the merge sha, then mcp__github__actions_get and get_job_logs for
      its preview job
    expected: >-
      The preview job concludes success with verdict NO_CHANGES (no bootstrap change is pending) and has_changes false,
      its materialise-tfvars step having read the parameter (the forwarded decrypt row 1's Condition allows); the apply
      job is skipped.
    fix_if: >-
      materialise-tfvars fails with a KMS AccessDenied: row 1's Condition is wrong, a protected-set fix applied from
      CloudShell after a plan amendment. An AccessDenied refresh read or another plan failure is a red main run: report it to the coordinator with the
      job's token lines; the fix is a bootstrap-plan-reads change, a protected-set change applied from CloudShell after
      a plan amendment, never a widening of anything else. A pending change (verdict REVIEWABLE or CLOUDSHELL_REQUIRED)
      means another bootstrap change landed unapplied: stop and report.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      BUILD PR 2. Prove the gate: the build dispatches the workflow from main with prove_gate true; the operator approves
      the apply job in tf-bootstrap-apply after the preview shows NO_CHANGES; the build reads the run back.
    command: >-
      mcp__github__actions_run_trigger(owner="otl-labs", repo="ontheloop", workflow_id="terraform-bootstrap-apply.yml",
      ref="main", inputs={"prove_gate": "true"}), then after the approval mcp__github__actions_get and get_job_logs for
      both jobs
    expected: >-
      The preview reports NO_CHANGES and its "Check the apply Environment has reviewers" step passes; the apply job
      starts only after the approval, its approvals check passes, it assumes bootstrap-apply, initialises, plans no
      change and prints PROVE_OK; both jobs conclude success.
    fix_if: >-
      An assume failure: compare the role's sub and job_workflow_ref with the run's OIDC claims (names only) and report;
      the trust is never loosened to StringLike. An approvals-check refusal: the Environment's reviewers are wrong; fix
      through terraform-github-apply.yml.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: pre-deploy
    action: BUILD PR 2. Stale-reference sweep for the retired "bootstrap is never CI-applied" instruction.
    command: >-
      P='never be added to any auto-apply|bootstrap root is admin-only out-of-band|only be applied manually|applied
      manually under|applied only manually under agent_platform_admin|Apply this module manually|Apply `terraform/bootstrap`[^|]*[|] Operator
      action only|which CI never applies'; for f in AGENTS.md terraform/bootstrap/main.tf terraform/bootstrap/CLAUDE.md
      terraform/CLAUDE.md; do git show "75e6a7382ab202cb904f997895cb600b4d17b3b7:$f" | grep -q -i -E "$P" && echo
      "RED_BEFORE_HIT $f" || echo "RED_BEFORE_MISS $f"; done; grep -r -I -n -i -E "$P" AGENTS.md terraform/
      docs/contracts/ .claude/ scripts/ || echo SWEEP_CLEAN
    expected: >-
      Four RED_BEFORE_HIT lines (AGENTS.md:46, terraform/bootstrap/main.tf:8, terraform/bootstrap/CLAUDE.md:16-17 and 99, and
      terraform/CLAUDE.md:48 at this plan's base commit, the red-before run measured at plan time), then SWEEP_CLEAN.
    fix_if: >-
      A RED_BEFORE_MISS line: the pattern set no longer matches the base text; fix the pattern, never drop the file. A
      sweep hit in a file this plan edits: reword it. A live instruction elsewhere is listed in the PR body and becomes
      owed rec 5's item, owner asked first.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A one-off sweep of a retired phrase set over the build's tree; a standing check would pin wording rather than
      behaviour, and the red-before run against the plan's base commit proves the patterns hit all four sites.
  - step: 13
    phase: post-deploy
    action: >-
      File the owed follow-on recs through the portal once the recs store answers, with get_rec_write_guidance first;
      record the returned ids in the build PR comment. Each file_rec call is composed from its draft under that
      guidance, so the command is the readiness probe and the eight returned ids are the evidence.
    command: >-
      bin/venv-python -c "from scripts.ops_data_portal import get_rec_write_guidance; print(get_rec_write_guidance())"
      && bin/venv-python -m scripts.ops_data_portal --help > /dev/null && echo PORTAL_READY
    expected: PORTAL_READY (an import and help check that passes offline, so it does not prove the store answers), then eight file_rec calls returning eight rec ids, recorded on the PR; the returned ids are the reachability evidence.
    fix_if: >-
      The reader or writer does not answer (the recs store needs the session proxy to sign Function URL calls, which
      is failing at plan time): the drafts stay in /mnt/project-files/admin-environment/OWED-RECS.md and the coordinator
      files them when it answers.
    hermetic: false
    graduation: not-applicable
