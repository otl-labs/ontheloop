  - "Never write an account id, ARN with an account, ExternalId, key or host into the repo, a PR, a comment or the shared folder (Decision 101). Analyzer output is finding type and issue code only."
  - "No change to any statement but the two named; Sid names stay; no grant changes. PlatformDev's S3List (unconditioned s3:ListBucket on the bucket) is out of scope: filed as rec-5240 (2026-11-16)."
  - "No assertion is loosened (Decision 235): the fence test's list-deny assertion is re-authored to a strictly broader deny, approved with this plan (operator, 2026-11-16)."
