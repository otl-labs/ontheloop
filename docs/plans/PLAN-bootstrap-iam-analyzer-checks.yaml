infrastructure_dependencies:
  - "terraform/bootstrap is admin-only and bootstrap_ci_apply.tf is in Decision 257 cl.3's protected set: BUILD PR 1 gets the operator's ENVIRONMENT CHECK and screened pre-merge CloudShell plan (VP 6-7) and the operator's CloudShell apply in the same sitting as its merge (VP 8). Its own merge push runs the workflow, whose preview ends CLOUDSHELL_REQUIRED neutral (expected). BUILD PR 2 changes no file under terraform/, so it needs no CloudShell plan; its first live contact is its merge push's preview (VP 9). No unmerged PR code runs under the operator's credentials (Decision 238 cl.3's principle): VP 7 and VP 8 run only terraform at screened heads and inline aws CLI probes written in this plan."
  - "Order: PR 1 built to CI green; one sitting runs VP 6, VP 7 (PR 1's head plan and the live API probes) and, after PR 1 merges, VP 8. PR 2 may be built in parallel and merges only after VP 8 passes: before that its preview would call Access Analyzer without the grant and exit ANALYZER_UNREADABLE (a red main run). PR 2's first full sweep is its merge push (VP 9); a FAIL there on an existing document makes that run red, applies nothing (PR 2 changes no Terraform) and routes per VP 9's fix_if."
  - "One merged-unapplied bootstrap change at a time: PR 1 merges only when no other bootstrap change is merged and unapplied and the operator can run VP 8 in the same sitting."
  - "Spend: Access Analyzer custom checks, about $0.002 per paid call (third-party figure; unconfirmed until VP 7's probe and the first billing line). Measured 2026-11-16: 18 terraform/bootstrap .tf commits in 30 days, 23 policy documents. Changed-only, one or two documents per apply, at most fifteen paid calls each (a session-class document is in both classes: thirteen never rows, one CheckNoNewAccess): about 550 calls, $1.10 a month; each full sweep about 140 paid calls, $0.30; worst case every run a sweep about $7. ValidatePolicy is free. No other running cost."
  - "No Lambda code changes and no deploy channel. No new repository secret or variable (GH_TOKEN is the job token; the compare API needs contents read, which the preview job holds), so no project-configuration.yaml row."
acceptance_criteria:
  - "bootstrap-preview alone may call the four Access Analyzer checks (one Allow on '*', attached only to it), its DenyAllButReads NotAction is exactly reads plus those four plus sts:GetCallerIdentity, bootstrap-apply and the shared reads list hold no access-analyzer action, and test_bootstrap_ci_roles.py and test_bootstrap_preview_analyzer.py pass with each red case red (VP 1); after PR 1's apply, live simulation allows the four for bootstrap-preview and denies them to bootstrap-apply (VP 8)."
  - "config/iam-invariants.json holds exactly the two classes and thirteen never rows named in scope, test_iam_invariants.py pins every class's globs, the ceilings and every row's actions and resources exactly, checks their drift against the classifier's protected names and finds no session Allow granting a never action on a never resource (VP 4)."
  - "The analyzer checks, in changed mode (every dispatch, and every push that changes none of the sweep triggers), exactly the documents classify.checked_document selects (created, updated, replaced, imported or moved policies, created, imported or moved attachments' policies, and new, changed, imported or moved trusts), and sweeps every kept and unchanged document when a push changes config/iam-invariants.json, an analyzer, classify or plan_names_core file, has an empty or zero before, or has an unreadable or truncated compare, classes each document by its name and the principals it grants (a ci_writable boundary skipping the never rows), refuses on a ValidatePolicy ERROR, on a SECURITY_WARNING in classes session and ci_writable, on a granted never row or on a public trust, flags widening without refusing, prints names only, and the gate refuses the CI apply on its REFUSED verdict and refuses at apply time any document whose digest differs from the previewed one (VP 4; the existing gate tests unchanged in assertion)."
  - "PR 1's head plans exactly its three changes, and the live probes, with the operator's credentials and no PR code, return FAIL for a document granting s3:GetObject against the s3_objects row, FAIL for one granting ssm:GetParameter on a parameter/secret/ name against the secret_values_ssm row, PASS for a CloudWatch read against the s3_objects row and FAIL for a trust open to every principal (VP 7)."
  - "PR 2's merge push preview runs a full sweep that ends ANALYZER_SUMMARY verdict=PASS mode=full and BOOTSTRAP_APPLY_PREVIEW verdict=NO_CHANGES; a prove_gate dispatch runs in changed mode (ANALYZER_SUMMARY verdict=PASS mode=changed documents=0), and its approved apply job prints PROVE_OK without calling Access Analyzer (VP 9-10)."
  - "DECISIONS.md and deploy-paths.yaml carry exactly the sidecar's words (approved_text verify passes, VP 5)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: BUILD PR 1. Run the changed and new IAM text tests.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_bootstrap_ci_roles.py
      tests/checks/iam_tf/test_bootstrap_preview_analyzer.py
      tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py -q
    expected: >-
      All pass, including each parametrized red case of test_bootstrap_preview_analyzer.py and every existing
      test_bootstrap_ci_roles.py and test_platform_role_metadata_admin_scope.py node.
    fix_if: Any failure; fix the Terraform or the test's parsing, never an assertion's meaning (Decision 235).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates PR CI's diff-selected pytest of these files; the test_obligations nodes pin the behaviour, and rec-5149
      owns graduating the bootstrap IAM text tests as registry shards.
  - step: 2
    phase: pre-deploy
    action: BUILD PR 1. Standing IAM checks and provider-free formatting accept the changed root.
    command: >-
      bin/venv-python -m scripts.checks.iam_tf.validate_iam_policy_size && bin/venv-python -c "from
      scripts.checks.iam_tf.validate_account_portable_names import validate_account_portable_names as v; f = []; v(f);
      print(chr(10).join(f) or 'PORTABLE_OK'); raise SystemExit(1 if f else 0)" && terraform fmt -check -recursive
      terraform/bootstrap && echo FMT_OK
    expected: >-
      The policy-size check passes counting one more bootstrap policy than main; PORTABLE_OK and FMT_OK print;
      bootstrap_ci_apply.tf's effective line count is unchanged (500), which VP 3's SLOC check enforces.
    fix_if: A finding names the resource; fix the Terraform, never the check.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      validate_iam_policy_size and validate_account_portable_names are registered --pre checks that VP 3 runs on the
      same tree, and terraform fmt is CI's terraform-fmt job; a shard would run each twice.
  - step: 3
    phase: pre-deploy
    action: BUILD PR 1 and BUILD PR 2, each before handoff. Fast and full tiers.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and validation_result verifies the head (the full tier is started in the background from the
      top-level session).
    fix_if: Any failure; fix on the branch.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: BUILD PR 2. Run the analyzer, gate, invariants and fence tests.
    command: >-
      bin/venv-python -m pytest tests/test_terraform_bootstrap_apply_analyzer.py
      tests/test_terraform_bootstrap_apply_gate_analyzer.py tests/test_terraform_bootstrap_apply_gate.py
      tests/test_terraform_bootstrap_apply_sh.py tests/checks/iam_tf/test_iam_invariants.py
      tests/checks/ci_guards/test_validate_bootstrap_apply.py
      tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py -q && bin/venv-python -m
      scripts.checks.ci_guards.validate_bootstrap_apply && bin/venv-python -m
      scripts.checks.ci_guards.validate_trusted_plan_environment
    expected: >-
      All tests pass, including every red case named in scope; both fences exit 0 on the real tree (the trusted-plan
      fence's predicate h accepts the analyzer as a code-owned, python3 -I, stdlib-closure script).
    fix_if: Any failure; fix the code or the test's parsing, never an assertion's meaning (Decision 235).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates PR CI's diff-selected pytest and the registered --pre fences; the test_obligations nodes pin the
      behaviour. The new test files have no registry shard; rec-5149 owns graduating bootstrap IAM tests.
  - step: 5
    phase: pre-deploy
    action: BUILD PR 2. The governed files carry exactly the sidecar's words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug bootstrap-iam-analyzer-checks --base origin/main
    expected: >-
      The verify passes for docs/DECISIONS.md and docs/contracts/deploy-paths.yaml (the {{DATE}} placeholder, if any,
      filled with the build date).
    fix_if: A word differs; restore the sidecar's words. A needed wording change is a plan amendment and a new approval run.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      validate_merge_step runs the same approved_text verify in PR CI against the base sidecar; after merge the
      check is vacuous, so a registry shard would never go red.
  - step: 6
    phase: pre-deploy
    action: >-
      BUILD PR 1. ENVIRONMENT CHECK (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan), operator-run in AWS
      CloudShell in the PROD account as user/platform-breakglass, posted once PR 1 is CI green. The "caller-arn
      check" label is the marker validate_admin_root_premerge_gate reads; no repo helper runs in CloudShell.
    command: >-
      ( printf 'caller-arn check: '; aws sts get-caller-identity --query Arn --output text 2> /dev/null | grep -q
      ':user/platform-breakglass$' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT )
    expected: caller-arn check, ADMIN_CHAIN_OK. The ARN itself is never printed.
    fix_if: ADMIN_CHAIN_ABSENT; the operator signs in as the break-glass user and re-runs, and VP 7 waits.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      BUILD PR 1. PRE-MERGE GATE (ADMIN), operator-run in AWS CloudShell after VP 6. The build writes PR 1's full
      CI-green head into PR_HEAD_SHA. The block (PLAN-bootstrap-ci-gated-apply VP 5's shape): fetches main and PR 1's
      head into a scratch folder; screens PR 1's head (its terraform/ and config diff from main's tip names only
      terraform/bootstrap/bootstrap_ci_apply.tf and terraform/bootstrap/bootstrap_preview_analyzer.tf, and its added .tf
      lines carry no provider, module, required_providers, provisioner, local-exec, external or http data source
      token, and no line opening a data, import, removed, check or terraform block); installs the pinned terraform checked against HashiCorp's SHA256SUMS; reads the variables from
      /secret/agent-platform-terraform-personal-tfvars and the account from the caller, printing neither; inits with
      the committed lock and plans terraform/bootstrap read-only (-lock=false) to a saved plan and its show -json; then
      four live probes through the aws CLI on synthetic documents with placeholder-free ARNs built in-shell, written in
      this plan and running no repository code: check-access-not-granted with the session class's s3_objects row (all
      five actions) on a document allowing s3:GetObject on "*", with its secret_values_ssm row (all five verbs, on
      parameter/secret/*) on a document allowing ssm:GetParameter on parameter/secret/x, with the s3_objects row on a
      document allowing cloudwatch:GetMetricData, a check-no-new-access probe (an s3:GetObject grant on one bucket
      widened to "*", expecting FAIL), two wildcard-overlap probes for the ci_writable rows (a document
      allowing iam:PutRolePolicy on role/agent-platform-* against access iam:PutRolePolicy on role/bootstrap-*, then
      the same document on role/*), and check-no-public-access on a trust allowing sts:AssumeRole to Principal AWS
      "*"; then a free validate-policy pass over every policy document in the head plan's prior state, printing per
      address only the counts of ERROR and SECURITY_WARNING findings. PR 2's analyzer never runs here (no unmerged code under admin credentials). An EXIT trap
      deletes the folder; errors go to $HOME/bia-tf.err, read in CloudShell only. The build records the returned lines
      as a counts-only PR comment on PR 1.
    command: >-
      ( set -o pipefail; PR_HEAD_SHA=<full PR 1 head sha>; W="${TMPDIR:-/tmp}/bia"; L="$HOME/bia-tf.err"; rm -rf "$W";
      mkdir -p "$W/bin"; : > "$L"; trap 'rm -rf "$W"' EXIT; unset AWS_PROFILE; git init -q "$W/repo" 2>> "$L"; { git -C
      "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git +refs/heads/main:refs/o/main && git -C
      "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git "$PR_HEAD_SHA" && git -C "$W/repo" checkout
      -q --detach FETCH_HEAD; } 2>> "$L" || { echo CLONE_FAILED; exit 1; }; F=$(git -C "$W/repo" diff --name-only
      refs/o/main HEAD -- terraform config/aws-region config/terraform-version 2>> "$L" | LC_ALL=C sort | tr '\n' ' ');
      X=$(git -C "$W/repo" diff refs/o/main HEAD -- 'terraform/*.tf' 2>> "$L" | grep -E '^\+' | grep -cE 'data "(external|http)"|provider
      "|required_providers|module "|provisioner|local-exec|^\+\s*(data|import|removed|check|terraform)\b');
      [ "$F" = "terraform/bootstrap/bootstrap_ci_apply.tf terraform/bootstrap/bootstrap_preview_analyzer.tf " ] && [ "$X" = 0 ] || { echo SCREEN_REFUSED; exit 1; }; echo SCREEN_OK; R=$(tr -d '[:space:]' < "$W/repo/config/aws-region");
      export AWS_REGION="$R" AWS_DEFAULT_REGION="$R"; V=$(tr -d '[:space:]' < "$W/repo/config/terraform-version"); case
      "$(uname -m)" in aarch64) P=linux_arm64 ;; *) P=linux_amd64 ;; esac; Z="terraform_${V}_${P}.zip"; { curl -fsSL -o
      "$W/$Z" "https://releases.hashicorp.com/terraform/$V/$Z" && curl -fsSL -o "$W/sums"
      "https://releases.hashicorp.com/terraform/$V/terraform_${V}_SHA256SUMS" && ( cd "$W" && grep " $Z\$" sums | sha256sum
      -c --quiet - ) && unzip -qo "$W/$Z" -d "$W/bin"; } >> "$L" 2>&1 || { echo TERRAFORM_INSTALL_FAILED; exit 1; }; export
      PATH="$W/bin:$PATH"; command -v jq > /dev/null || { echo JQ_ABSENT; exit 1; }; aws ssm get-parameter --name
      /secret/agent-platform-terraform-personal-tfvars --with-decryption --query Parameter.Value --output text >
      "$W/vars.tfvars" 2>> "$L" && test -s "$W/vars.tfvars" || { echo TFVARS_ABSENT; exit 1; }; A=$(aws sts
      get-caller-identity --query Account --output text 2>> "$L"); test -n "$A" || { echo IDENTITY_FAILED; exit 1; };
      B="$W/repo/terraform/bootstrap"; terraform -chdir="$B" init -input=false -lockfile=readonly -backend-config="region=$R"
      > /dev/null 2>> "$L" || { echo INIT_FAILED; exit 1; }; terraform -chdir="$B" plan -lock=false -input=false -no-color
      -detailed-exitcode -var-file="$W/vars.tfvars" -var "account_id=$A" -var "aws_profile=" -out="$W/head.bin" >
      "$W/plan.txt" 2>> "$L"; echo "HEAD_PLAN_EXIT $?"; grep -E '^Plan: ' "$W/plan.txt"; terraform -chdir="$B" show -json
      "$W/head.bin" > "$W/plan.json" 2>> "$L"; jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) |
      "\(.change.actions | join(",")) \(.address)"' "$W/plan.json" | LC_ALL=C sort;
      D='{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":"%s","Resource":"%s"}]}';
      T0=$SECONDS; S3='[{"actions":["s3:GetObject*","s3:PutObject*","s3:DeleteObject*","s3:ListBucket"]}]';
      probe() { aws accessanalyzer check-access-not-granted --policy-type IDENTITY_POLICY --policy-document "$(printf "$D"
      "$2" "$3")" --access "$4" --query result --output text 2>> "$L" | sed "s/^/PROBE $1 /" || echo "PROBE $1 ERROR"; };
      probe s3_objects s3:GetObject '*' "$S3"; probe iam_wildcard iam:DetachUserPolicy '*'
      '[{"actions":["iam:Detach*"]}]'; probe secret_ssm ssm:GetParameter "arn:aws:ssm:$R:$A:parameter/secret/x"
      "[{\"actions\":[\"ssm:GetParameter\",\"ssm:GetParameters\",\"ssm:GetParametersByPath\",\"ssm:GetParameterHistory\",\"ssm:PutParameter\"],\"resources\":[\"arn:aws:ssm:$R:$A:parameter/secret/*\"]}]";
      probe metric_read cloudwatch:GetMetricData '*' "$S3"; P1='[{"actions":["iam:PutRolePolicy"],"resources":["arn:aws:iam::'"$A"':role/bootstrap-*"]}]';
      probe role_prefix_disjoint iam:PutRolePolicy "arn:aws:iam::$A:role/agent-platform-*" "$P1"; probe role_star_overlap
      iam:PutRolePolicy "arn:aws:iam::$A:role/*" "$P1"; aws accessanalyzer check-no-new-access --policy-type
      IDENTITY_POLICY --existing-policy-document "$(printf "$D" s3:GetObject "arn:aws:s3:::bia-probe-x/*")"
      --new-policy-document "$(printf "$D" s3:GetObject '*')" --query result --output text 2>> "$L" | sed 's/^/PROBE
      no_new_access /' || echo "PROBE no_new_access ERROR"; aws accessanalyzer check-no-public-access --resource-type
      AWS::IAM::AssumeRolePolicyDocument --policy-document
      '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"AWS":"*"},"Action":"sts:AssumeRole"}]}' --query
      result --output text 2>> "$L" | sed 's/^/PROBE public_trust /' || echo "PROBE public_trust ERROR"; jq -c
      '.prior_state.values.root_module.resources[]? | select(.type == "aws_iam_policy" or .type == "aws_iam_role_policy" or
      .type == "aws_iam_user_policy") | {a: .address, p: .values.policy}' "$W/plan.json" > "$W/docs.jsonl" 2>> "$L";
      echo "VALIDATE_DOCS $(wc -l < "$W/docs.jsonl")"; K=0; while IFS= read -r J; do K=$((K + 1)); N=$(jq -r .a <<<
      "$J"); T=$(aws accessanalyzer validate-policy --policy-type IDENTITY_POLICY --policy-document "$(jq -r .p <<<
      "$J")" --query 'findings[].findingType' --output text 2>> "$L" < /dev/null) || T=CALL_ERROR; E=$(tr '\t' '\n' <<< "$T" | grep -c '^ERROR$');
      SW=$(tr '\t' '\n' <<< "$T" | grep -c '^SECURITY_WARNING$'); C=$(tr '\t' '\n' <<< "$T" | grep -c '^CALL_ERROR$'); [
      "$E$SW$C" = 000 ] || echo "VALIDATE $N error=$E security_warning=$SW call_error=$C"; done < "$W/docs.jsonl"; echo
      "VALIDATED $K"; echo "PROBE_SECONDS $((SECONDS - T0))"; echo "PR_HEAD_SHA $PR_HEAD_SHA" )
    expected: >-
      SCREEN_OK; HEAD_PLAN_EXIT 2; Plan: 2 to add, 1 to change, 0 to destroy.; exactly three lines: create
      aws_iam_policy.bootstrap_preview_analyzer, create aws_iam_role_policy_attachment.bootstrap_preview_analyzer, update
      aws_iam_policy.bootstrap_preview_guard; PROBE s3_objects FAIL; PROBE iam_wildcard FAIL; PROBE secret_ssm FAIL; PROBE metric_read PASS;
      PROBE role_prefix_disjoint PASS; PROBE role_star_overlap FAIL; PROBE no_new_access FAIL; PROBE public_trust FAIL;
      VALIDATE_DOCS n (at least 23) and VALIDATED the same n; no VALIDATE line with error above 0 or call_error above 0, and no VALIDATE line
      with security_warning above 0 on an agent_session or github_ci_apply address other than
      aws_iam_policy.github_ci_apply_boundary (the ceiling, which validate_policy_block holds to errors only; class
      other may show warnings too: they are shown, not refused);
      PROBE_SECONDS s (the build scales it to the first sweep's call count against the preview job's 15-minute
      timeout); the sha.
    fix_if: >-
      SCREEN_REFUSED: nothing was initialised; if main moved under terraform/ the build rebases and re-posts, else the
      head carries files beyond scope and the build stops. A setup line: the operator reads $HOME/bia-tf.err in
      CloudShell and re-pastes. Any other plan address, or an update or destroy (another merged-unapplied bootstrap
      change): stop, do not merge, report to the coordinator. A PROBE ERROR: the aws CLI rejected a parameter shape
      (for example a wildcard in --access resources, or the AssumeRolePolicyDocument resource type); the build reads
      the error class from the operator in words, never the text, and this is a plan amendment before PR 2 merges
      (PROBE iam_wildcard ERROR or PASS: --access takes no wildcard actions, so the build enumerates the families'
      actions, splitting a row at the 100-action limit). PROBE_SECONDS that scales past ten minutes for the first
      sweep: the build raises the preview job's timeout in PR 2 (a workflow line, in scope row 10). A
      probe with the opposite result: the API semantics differ from the plan's assumption; plan amendment before PR 2
      merges. A VALIDATE line the expected line excludes: that existing document would refuse every bootstrap run once
      PR 2 merges; file a rec and fix the document through a reviewed bootstrap change (or, with the operator's word, a
      plan amendment) before PR 2 merges, never by narrowing a row. VALIDATE_DOCS 0: the plan JSON lacked prior state;
      report it.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      BUILD PR 1. OPERATOR STEP, AWS CloudShell in the PROD account, in the same sitting as PR 1's merge. VP 7's fetch,
      screen, install, variable and init lines, written out in full, at the merge sha M (a depth-2 fetch of M, screened
      on the merge commit's own diff, HEAD^..HEAD),
      then a saved plan applied only when its summary is exactly 2 to add, 1 to change, 0 to destroy and its addresses
      are exactly VP 7's, a fresh plan, and IAM simulation, all with ARNs built in-shell from the caller's account and
      never printed. The operator's paste is the direction for the apply (Decision 126 cl.1). No detector filter matches
      a bootstrap-preview policy or role write (platform_security_alarms.tf), so no detector email is expected; any
      email is reported and triaged before PR 2 merges.
    command: >-
      ( set -o pipefail; M=<full merge sha>; W="${TMPDIR:-/tmp}/bia"; L="$HOME/bia-tf.err"; rm -rf "$W"; mkdir -p
      "$W/bin"; : > "$L"; trap 'rm -rf "$W"' EXIT; unset AWS_PROFILE; git init -q "$W/repo" 2>> "$L"; { git -C "$W/repo"
      fetch -q --depth 2 https://github.com/otl-labs/ontheloop.git "$M" && git -C "$W/repo" checkout -q --detach
      FETCH_HEAD; } 2>> "$L" || { echo CLONE_FAILED; exit 1; }; F=$(git -C "$W/repo" diff --name-only HEAD^ HEAD --
      terraform config/aws-region config/terraform-version 2>> "$L" | LC_ALL=C sort | tr '\n' ' '); X=$(git -C "$W/repo"
      diff HEAD^ HEAD -- 'terraform/*.tf' 2>> "$L" | grep -E '^\+' | grep -cE 'data "(external|http)"|provider
      "|required_providers|module "|provisioner|local-exec|^\+\s*(data|import|removed|check|terraform)\b'); [ "$F" =
      "terraform/bootstrap/bootstrap_ci_apply.tf terraform/bootstrap/bootstrap_preview_analyzer.tf " ] && [ "$X" = 0 ] || { echo SCREEN_REFUSED; exit 1; }; echo SCREEN_OK; R=$(tr -d '[:space:]' < "$W/repo/config/aws-region");
      export AWS_REGION="$R" AWS_DEFAULT_REGION="$R"; V=$(tr -d '[:space:]' < "$W/repo/config/terraform-version"); case
      "$(uname -m)" in aarch64) P=linux_arm64 ;; *) P=linux_amd64 ;; esac; Z="terraform_${V}_${P}.zip"; { curl -fsSL -o
      "$W/$Z" "https://releases.hashicorp.com/terraform/$V/$Z" && curl -fsSL -o "$W/sums"
      "https://releases.hashicorp.com/terraform/$V/terraform_${V}_SHA256SUMS" && ( cd "$W" && grep " $Z\$" sums | sha256sum
      -c --quiet - ) && unzip -qo "$W/$Z" -d "$W/bin"; } >> "$L" 2>&1 || { echo TERRAFORM_INSTALL_FAILED; exit 1; }; export
      PATH="$W/bin:$PATH"; command -v jq > /dev/null || { echo JQ_ABSENT; exit 1; }; aws ssm get-parameter --name
      /secret/agent-platform-terraform-personal-tfvars --with-decryption --query Parameter.Value --output text >
      "$W/vars.tfvars" 2>> "$L" && test -s "$W/vars.tfvars" || { echo TFVARS_ABSENT; exit 1; }; A=$(aws sts
      get-caller-identity --query Account --output text 2>> "$L"); test -n "$A" || { echo IDENTITY_FAILED; exit 1; };
      B="$W/repo/terraform/bootstrap"; terraform -chdir="$B" init -input=false -lockfile=readonly -backend-config="region=$R"
      > /dev/null 2>> "$L" || { echo INIT_FAILED; exit 1; }; terraform -chdir="$B" plan
      -input=false -no-color -var-file="$W/vars.tfvars" -var "account_id=$A" -var "aws_profile=" -out="$W/apply.bin" >
      "$W/plan.txt" 2>> "$L"; S=$(grep -E '^Plan: ' "$W/plan.txt"); echo "$S"; G=$(terraform -chdir="$B" show -json
      "$W/apply.bin" | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | .address' | LC_ALL=C sort | tr
      '\n' ' '); [ "$S" = "Plan: 2 to add, 1 to change, 0 to destroy." ] && [ "$G" =
      "aws_iam_policy.bootstrap_preview_analyzer aws_iam_policy.bootstrap_preview_guard
      aws_iam_role_policy_attachment.bootstrap_preview_analyzer " ] || { echo APPLY_SKIPPED; exit 1; }; terraform
      -chdir="$B" apply -input=false -no-color "$W/apply.bin" > /dev/null 2>> "$L" && echo APPLY_DONE || { echo
      APPLY_FAILED; exit 1; }; terraform -chdir="$B" plan -lock=false -input=false -no-color -detailed-exitcode
      -var-file="$W/vars.tfvars" -var "account_id=$A" -var "aws_profile=" > /dev/null 2>> "$L"; echo "REPLAN_EXIT $?";
      for r in bootstrap-preview bootstrap-apply; do aws iam simulate-principal-policy --policy-source-arn
      "arn:aws:iam::$A:role/$r" --action-names access-analyzer:ValidatePolicy access-analyzer:CheckAccessNotGranted
      access-analyzer:CheckNoNewAccess access-analyzer:CheckNoPublicAccess --query
      'EvaluationResults[].[EvalActionName,EvalDecision]' --output text 2>> "$L" | sed "s/^/SIM $r /"; aws iam
      simulate-principal-policy --policy-source-arn "arn:aws:iam::$A:role/$r" --action-names iam:CreatePolicy
      --resource-arns "arn:aws:iam::$A:policy/agent-platform-sim-probe" --query
      'EvaluationResults[].[EvalActionName,EvalDecision]' --output text 2>> "$L" | sed "s/^/SIM $r /"; done; echo "M $M" )
    expected: >-
      SCREEN_OK; Plan: 2 to add, 1 to change, 0 to destroy.; APPLY_DONE; REPLAN_EXIT 0; SIM bootstrap-preview allowed for the four
      access-analyzer actions and explicitDeny for iam:CreatePolicy; SIM bootstrap-apply not allowed (implicitDeny or
      explicitDeny, its DenyDetectorWrite may match on resource "*") for the four
      access-analyzer actions and allowed for iam:CreatePolicy on an agent-platform-* policy (its
      IAMManagedPolicyWrite); M.
    fix_if: >-
      SCREEN_REFUSED or a setup line: nothing initialised; as VP 7. APPLY_SKIPPED: nothing applied; stop and report the
      summary. APPLY_FAILED or REPLAN_EXIT 2: report the error
      class in words; a partial apply is finished by a plan amendment's CloudShell block, never by -target. A SIM
      mismatch on an access-analyzer row: the grant or the guard's NotAction is wrong; plan amendment. PR 2 does not
      merge until this step passes.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      BUILD PR 2. First live run: PR 2's merge push starts terraform-bootstrap-apply.yml (config/iam-invariants.json is
      new in the push, so the analyzer sweeps every document); the build reads the run back.
    command: >-
      mcp__github__actions_list(owner="otl-labs", repo="ontheloop", method="list_workflow_runs",
      resource_id="terraform-bootstrap-apply.yml") for the merge sha, then mcp__github__actions_get and get_job_logs for
      its preview job
    expected: >-
      The preview job concludes success; its analyzer step prints ANALYZER_SUMMARY verdict=PASS mode=full with fail=0
      and documents at least 24 (the 23 policy documents measured on 2026-11-16 plus VP 8's new policy, and the
      trusts); the gate prints
      BOOTSTRAP_APPLY_PREVIEW verdict=NO_CHANGES; the apply job is skipped; no line of the analyzer step, the gate step
      or the step summary holds a twelve-digit run or "arn:" (the credentials step's masked role-to-assume echo is
      outside this check).
    fix_if: >-
      ANALYZER_UNREADABLE with an AccessDenied class: VP 8's grant is missing or wrong; a protected-set fix applied from
      CloudShell after a plan amendment. A FAIL: as VP 7's fix_if. A digit run or ARN in the analyzer or gate lines or the summary: a Decision 101 leak;
      revert PR 2 at once and file a rec. A pending change (REVIEWABLE or CLOUDSHELL_REQUIRED): another bootstrap change
      landed unapplied; stop and report. A FAIL on an existing document: either a real grant the never-list forbids
      (file a rec and fix the grant through a reviewed bootstrap change) or a reading of a row the operator disputes
      (his word, then a plan amendment); never a silent narrowing of a row (Decision 235). Until then every bootstrap
      run refuses, which is the intended fail-closed state; ANALYZER_UNREADABLE with a parameter-shape class: the
      analyzer's CLI call differs from VP 7's probes; fix on a branch.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      BUILD PR 2. Prove the dispatch path: the build dispatches the workflow from main with prove_gate true; the
      operator approves the apply job in tf-bootstrap-apply after the preview passes; the build reads the run back.
    command: >-
      mcp__github__actions_run_trigger(owner="otl-labs", repo="ontheloop", workflow_id="terraform-bootstrap-apply.yml",
      ref="main", inputs={"prove_gate": "true"}), then after the approval mcp__github__actions_get and get_job_logs for
      both jobs
    expected: >-
      The preview's analyzer step prints ANALYZER_SUMMARY verdict=PASS mode=changed documents=0; the preview reports
      NO_CHANGES; the
      apply job passes its approvals check, plans no change and prints PROVE_OK, and its log names no Access Analyzer
      call.
    fix_if: >-
      Any refusal; report the token lines to the coordinator. An apply-job Access Analyzer call: fence predicate (j) is
      wrong; fix on a branch.
    hermetic: false
    graduation: not-applicable
