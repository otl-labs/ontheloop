constraints:
  - "No rescue agents or workaround loops (Decision 55). Never attempt or retry sts:AssumeRole or any other credential-minting call from a session; the session user has no Access Analyzer grant, so the build never calls Access Analyzer itself: live calls run only in CI (bootstrap-preview) and in the operator's CloudShell (VP 7-8)."
  - "Never write an account id, ARN with an account, ExternalId, key or host into the repo, a PR, a comment, a job log or the shared folder (Decision 101). Analyzer output is names and verdicts only; an Access Analyzer description, message or reason text is never printed (Decision 238 cl.4)."
  - "The governed files get exactly the sidecar's words (Decision 246). The operator approved this work on 2026-11-16 and asked not to be asked again for final-diff words on approved work; the operator's GitHub approval of the sidecar's run and the operator's own CloudShell pastes (VP 6-8) and the VP 10 approval are the only operator actions."
  - "No grant beyond scope row 2 and no change to bootstrap-apply, the CI apply boundary, the session user or any Deny other than DenyAllButReads' NotAction. A never row is never removed or narrowed to obtain green (Decision 235); a FAIL on an existing document routes per VP 7's fix_if."
  - "A PASS is evidence for the operator's review, never a substitute for the tf-bootstrap-apply approval (Decision 92 pt 1); no code path lets a FAIL be waived or skipped."
context:
  - "Decision-scout r1 FLAGS_FOUND (/mnt/project-files/ceilings-grants/SCOUT-r1.md). Decisions triaged: 210 of 210. Roadmap items intersected: 6; CONFLICT: 0; RELATED: 6. Serves: NS.9 4/5. CITE: 257, 256, 238, 237, 101, 126, 181, 235, 168, 247. Dispositions: 257 WARN adopted as the sidecar's dated Update covering cl.2, 3 and 8 (precedent 248's 2026-11-08 Update); (b) adopted as a preview-only policy and a separate local, not the shared reads list; (c) adopted as digest binding: the gate requires the analyzer checked each row's exact document and the apply's check refuses a differing one, so the gated job needs no grant; (d) adopted: protected-set plans still show the Analyzer column and a FAIL turns the run red before any CloudShell apply. 235: adapted, the never rows are pinned by test_iam_invariants.py instead of a scope-boundary map entry (the CONTENT map lists surface kinds, not files). 168: n/a, the never-list is config read by stdlib json, not a docs/contracts file. 247 cl.3: one plan, two PRs with VP 8 as the explicit ordering gate."
  - "Design evidence: /mnt/project-files/ceilings-grants/ADVICE.md (blind Fable consult, two rounds, and the operator's 2026-11-16 direction: changed documents only, digest reuse, attachments count, a never-list change sweeps once). The operator chose 'Access Analyzer checks first' over the originally agreed ceiling/grant split after the recon showed a new API route is a CloudShell sitting whatever the IAM shape (terraform_bootstrap_apply_classify.py protected_reasons 'type') and no access incident involved the session user."
  - "Follow-on recs filed at planning time (the deferred halves): rec-5207 the session ceiling/grant split (amends Decisions 256 cl.1 and 257 cl.3), rec-5208 enumerated AWS-managed service-role policies, rec-5209 the same checks on terraform/personal's trusted plan (amends Decision 238), rec-5210 read-class grants for the CI apply role, then service-level writes behind these checks."
  - "Split: one plan, two build PRs, disjoint files. PR 1 (bootstrap_ci_apply.tf's one line, the new bootstrap_preview_analyzer.tf and three tests) is protected-set, so CloudShell plan and apply. PR 2 (everything else) touches nothing under terraform/. PR 2's head is proven against PR 1's live plan in the same sitting (VP 7), then merges after VP 8."
  - "UNPROVEN until VP 7: the aws CLI's accessanalyzer commands accept wildcard actions and resources in --access and the AWS::IAM::AssumeRolePolicyDocument resource type for check-no-public-access, one access entry per call, and return statementId or statementIndex in reasons (recalled from AWS docs, not fetched); the price per paid call; that every current document passes the never-list and ValidatePolicy. UNPROVEN until VP 9: that the GitHub runner's preinstalled aws CLI carries the accessanalyzer commands and that the compare API answers with the job token."
  - "Residuals (in the Update): each check reads one document, never its boundary or its principal's other policies (conservative: a grant a boundary would block still fails); an AWS-managed attachment is UNCHECKED; trust policies are checked only for public access, not for which principals they admit."
  - "V3 resolution: VP 7's operator-run pre-merge plan at PR 1's head substitutes for pre-merge post-deploy evidence for PR 1; PR 2 changes no non-Markdown bootstrap file. Behavioural acceptance is VP 8 (apply and simulation), VP 9 (first preview sweep) and VP 10 (dispatch and approved no-op), with the operator's returned lines labelled operator-reported in counts-only PR comments naming the applied sha."
