schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "bootstrap-iam-analyzer-checks"
intent: >-
  Before the operator taps approve on a terraform/bootstrap CI apply, AWS IAM Access Analyzer checks every IAM policy
  document the plan creates or changes against a per-class never-list (secret values, Terraform state, IAM writes,
  credential minting for the agent session user; writes reaching the protected set for CI-writable roles) and every
  changed role trust for public access, so a grant an agent PR slips past the text-based classifier is refused with
  AWS's own policy reasoning, checked once per changed document and bound to the applied plan by digest (a dated Update
  to Decision 257 cl.2, 3 and 8).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-bootstrap-iam-analyzer-checks.yaml
phase: >-
  security_advisory (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  the follow-on PLAN-agent-proxy-signed-access's planning thread owed (split agent permission ceilings from grants),
  re-scoped on blind-consult evidence and the operator's choice of 2026-11-16 to its first step, the invariant checks;
  the split itself and the other halves are filed follow-on recs. Closes no roadmap criterion.
scope:
  - file: terraform/bootstrap/bootstrap_ci_apply.tf
    action: Modify
    purpose: >-
      BUILD PR 1 (protected set: the operator's CloudShell plan and apply). One line only: bootstrap_preview_guard_json's
      DenyAllButReads NotAction becomes exactly concat(local.bootstrap_plan_read_actions,
      local.bootstrap_preview_analyzer_actions, ["sts:GetCallerIdentity"]) on its existing single line, its
      BoolIfExists condition unchanged. The file is at 500 of 500 effective lines (plan_obligations, 2026-11-16), so it
      gains no line: every new resource and local goes in scope row 2. bootstrap-apply gains nothing: the gated job
      never calls Access Analyzer (it binds the preview's verdict by digest). No other resource, role, trust or Deny
      changes.
  - file: terraform/bootstrap/bootstrap_preview_analyzer.tf
    action: Create
    purpose: >-
      BUILD PR 1. One header comment line naming the preview's analyzer grant (Decision 257 Update 2026-11-16); local
      bootstrap_preview_analyzer_actions = ["access-analyzer:ValidatePolicy", "access-analyzer:CheckAccessNotGranted",
      "access-analyzer:CheckNoNewAccess", "access-analyzer:CheckNoPublicAccess"] (never appended to
      bootstrap_plan_read_actions, which is also DenyDetectorWrite's NotAction on the apply role); local
      bootstrap_preview_analyzer_json, one statement Sid AccessAnalyzerPolicyChecks, Allow, those four actions on "*"
      (they read no account resource and return only verdicts); aws_iam_policy.bootstrap_preview_analyzer (name
      bootstrap-preview-analyzer, the same 6,144 B lifecycle precondition as its siblings in bootstrap_ci_apply.tf) and
      aws_iam_role_policy_attachment.bootstrap_preview_analyzer on aws_iam_role.bootstrap_preview only. Nothing else.
      Its name matches the protected bootstrap-* pattern, so any later change to it is a CloudShell sitting.
  - file: tests/checks/iam_tf/test_bootstrap_ci_roles.py
    action: Modify
    purpose: >-
      BUILD PR 1. preview_problems' exact NotAction expression becomes the three-part concat above (an exact string
      replaced by the new exact string, never a looser match; planned-change disposition citing acceptance_criteria[0]).
      No other node changes.
  - file: tests/checks/iam_tf/test_bootstrap_preview_analyzer.py
    action: Create
    purpose: >-
      BUILD PR 1. Text tests in the iam_tf predicate convention over every terraform/bootstrap/*.tf text, globbed
      in this module (no import from another test_* module, tests/CLAUDE.md): analyzer_problems(texts) returns problems unless
      bootstrap_preview_analyzer_actions is exactly the four actions, the analyzer policy holds exactly one Allow
      statement with those actions on "*", exactly one attachment of it exists and names aws_iam_role.bootstrap_preview,
      no bootstrap-apply attachment or bootstrap_apply_* local names an access-analyzer action, and
      bootstrap_plan_read_actions names none. Real-tree node asserts []; a parametrized red node drives one mutation
      each (a fifth action, a resource other than "*", an attachment to bootstrap_apply, the actions appended to
      bootstrap_plan_read_actions, a dropped attachment).
  - file: tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
    action: Modify
    purpose: >-
      BUILD PR 1. Add _BOOTSTRAP_DIR / "bootstrap_preview_analyzer.tf" to _SCANNED_BOOTSTRAP_FILES (a bootstrap CI
      identity's grant, scanned for IAM leaks like bootstrap_ci_apply.tf). Without it
      test_scanned_tuple_is_every_bootstrap_file_outside_the_unscanned_mapping goes red on the new file. No other node
      changes. Kept graduated record (asserts unchanged): platform-admin-absent-from-ci-write-patterns, whose node
      runs this file and now also scans the new file. Size: 497 of 500 SLOC (plan_obligations 2026-11-16); the one
      tuple line makes 498, so no relief step; any further growth decomposes per Decision 128.
  - file: config/iam-invariants.json
    action: Create
    purpose: >- # pragma: allowlist secret
      BUILD PR 2. The never-list, read by the analyzer (stdlib json) and the static tests. Exactly: {"schema_version":
      1, "validate_policy_block": {"session": ["ERROR", "SECURITY_WARNING"], "ci_writable": ["ERROR",
      "SECURITY_WARNING"], "other": ["ERROR"], "boundary": ["ERROR"]}, "classes": [session, ci_writable]} where each
      class is {id, role_names, policy_names, user_names, never} with fnmatch name globs and never a list of {id,
      actions, resources?} (resources omitted = any resource; "{account}" and "{region}" are the only placeholders,
      filled at run time and never printed). session: role_names [], policy_names ["agent-platform-session-*"],
      user_names ["agent-platform-session"]; never rows iam_write (Decision 256 cl.2's "any IAM write", as the
      session guard's DenySessionEscalation families: iam:Create*, Update*, Put*, Attach*, Detach*, Delete*, Add*,
      Remove*, Tag*, Untag*, Set*, Upload*, Enable*, Deactivate*, Change*, Reset*, PassRole), credential_minting
      (sts:AssumeRole*, AssumeRoot, GetFederationToken; the IAM credential writes such as CreateAccessKey,
      CreateServiceSpecificCredential and UploadSigningCertificate fall in iam_write's families),
      secret_values_secretsmanager (secretsmanager:GetSecretValue, BatchGetSecretValue, PutSecretValue, UpdateSecret;
      Decision 256 cl.2 bars any Secrets Manager value), secret_values_ssm (ssm:GetParameter, GetParameters, GetParametersByPath,
      GetParameterHistory, PutParameter on arn:aws:ssm:{region}:{account}:parameter/secret/*, Decision 237 cl.2's five
      value verbs), s3_objects (s3:GetObject*, PutObject*, DeleteObject*, ListBucket; Decision 256 cl.2 bars every
      direct S3 read or write), lambda_direct (lambda:InvokeFunction, InvokeFunctionUrl,
      GetFunction, GetFunctionConfiguration), kms_decrypt (kms:Decrypt). ci_writable: role_names ["agent-platform-*"],
      policy_names ["agent-platform-*"], user_names []; never rows protected_role_write (iam:PutRolePolicy,
      AttachRolePolicy, DeleteRolePolicy, DetachRolePolicy, UpdateAssumeRolePolicy, DeleteRole,
      PutRolePermissionsBoundary, DeleteRolePermissionsBoundary, PassRole on arn:aws:iam::{account}:role/ PlatformAdmin,
      PlatformDev, bootstrap-*, github-settings-*, platform-security-* and ducklake-api-*), protected_policy_write
      (iam:CreatePolicyVersion, DeletePolicyVersion, SetDefaultPolicyVersion, DeletePolicy on
      arn:aws:iam::{account}:policy/ agent-platform-github-ci-apply-boundary, agent-platform-session-*, bootstrap-* and
      platform-security-*), user_write (iam:CreateUser, CreateAccessKey, PutUserPolicy, AttachUserPolicy,
      PutUserPermissionsBoundary, DeleteUserPermissionsBoundary, AddUserToGroup, CreateLoginProfile),
      credential_minting (sts:AssumeRoot, GetFederationToken), github_settings_key (secretsmanager:GetSecretValue,
      PutSecretValue on arn:aws:secretsmanager:{region}:{account}:secret:agent-platform-terraform-github-apply-app*),
      bootstrap_state_write (s3:PutObject, DeleteObject on arn:aws:s3:::agent-platform-bootstrap-tfstate/*). Class
      membership is a union, never first-match: a document is in every class whose glob matches its own policy name
      or a principal it grants (the role of an aws_iam_role_policy, the user of an aws_iam_user_policy, the role or
      user of each attachment of an aws_iam_policy in prior state or the plan's after values, and for an attachment row
      both its policy's name and its principal), each name resolved from a known value or, when unknown at plan time,
      through the plan's configuration references to a same-plan resource's planned name (the classifier's _resolve,
      extended to "user"); a document with a principal or attached policy that resolves to no name is checked against
      every class's never rows (fail toward checking). A document in no class is class other (ValidatePolicy at
      "other" and CheckNoNewAccess only). The file also holds "ceilings": ["agent-platform-github-ci-apply-boundary"]
      (the classifier's BOUNDARY_NAME, a protected name only the operator changes, Decision 257 cl.3): a policy so
      named that is attached or inline nowhere in prior state or the plan is a ceiling, not a grant, skips the never
      rows and takes ValidatePolicy at "boundary" and CheckNoNewAccess only (it allows s3:* and secretsmanager:* on "*"
      by design, github_ci_apply_boundary.tf DataPlaneAllow); a ceiling-named policy that is attached anywhere, and
      every other policy whatever role or user names it as permissions_boundary, is a grant (so a decoy
      permissions_boundary reference buys nothing; the session boundary is checked as a grant, Decision 256 cl.1).
      Each class's validate_policy_block list applies to its documents, a document in several classes taking the
      union. This file stays at config/ root beside sloc_budgets.yaml and sensitive_value_detectors.yaml, the CI-read
      precedents; config/agent/ holds agent-consumed config. No account digits, ARN with an account, ExternalId or
      host.
  - file: scripts/ci/terraform_bootstrap_apply_analyzer.py
    action: Create
    purpose: >-
      BUILD PR 2. Stdlib only, run with python3 -I by path (Decision 238 cl.3; the trusted-plan fence's predicate h);
      loads terraform_bootstrap_apply_classify.py the way the gate does (its Plan, target_names, checked_document,
      document_digest and group_digest, and plan_names_core.normalise_address), never reimplementing them. CLI:
      --plan-json P --invariants F --out R --event-name E [--before SHA] [--full-sweep]. Selection (changed mode, the
      default on every event): exactly the rows classify.checked_document returns a document for (scope row 8), so
      every row that carries a digest has a result, plus every attachment row whose policy is AWS-managed; that covers policy and trust rows that are created, updated,
      replaced, imported or moved, and attachment rows (aws_iam_role_policy_attachment,
      aws_iam_user_policy_attachment) whose actions include create (create or replace) or that are imported or moved,
      whose document is the attached customer policy's. An AWS-managed attachment has no document and is UNCHECKED,
      except that one whose principal is in class session FAILs (managed_on_session: Decision 256 cl.1 gives the
      session user only customer-managed policies); an attachment whose policy resolves to no document is
      UNCHECKED, protected by the classifier's name reason and named with the unknown-document residual.
      Not selected, a named residual: IAM group policies, attachments and membership (bootstrap-apply's Denies refuse
      every group write, Decision 257 cl.3), resource policies (aws_api_gateway_rest_api_policy,
      aws_secretsmanager_secret_policy, aws_s3_bucket_policy), aws_iam_policy_attachment and inline_policy or
      managed_policy_arns blocks inside an aws_iam_role (the root declares none), and documents or trusts unknown at
      plan time (the classifier protects an unknown policy document; an unknown trust is unprotected, the residual the
      Update names). Full sweep only when --full-sweep is given or, on a push, when --before is empty or all zeros, or the push's changed
      files (GitHub compare API, GH_TOKEN, GITHUB_REPOSITORY and GITHUB_SHA (the compare's head) from the environment, the gate's urllib pattern)
      include config/iam-invariants.json, any scripts/ci/terraform_bootstrap_apply_analyzer* file,
      scripts/ci/terraform_bootstrap_apply_classify.py or scripts/ci/plan_names_core.py, cannot be read, or are
      truncated (300 or more files): fail toward checking. In full mode every row build_rows keeps takes its result
      exactly as in changed mode (checked_document, and group_digest over the changed instances), and the sweep adds
      one result per unchanged address (a normalised address none of whose instances changes) from prior state; the
      unchanged instances of a keyed group that has a changed instance, and the unchanged trust of a kept
      aws_iam_role row (a tag-only or description update), are checked too, their checks folded into that row's
      result without changing its digest, so the gate's binding is as in changed mode; a destroyed row is never checked, so a
      push removing a bad grant is not refused by it. Checks are deduplicated by (document digest, class set), each
      verdict copied to every address that shares the pair. A dispatch runs in changed mode. Classes, ceilings and
      principal resolution per scope row 6. Checks, by document kind, through the aws CLI by subprocess (no SDK: the
      job forbids third-party Python), each document written to a private temp file deleted after the call, --region
      from AWS_REGION and the account from aws sts get-caller-identity, neither ever printed. An identity document (a
      policy, inline policy or attached policy): validate-policy --policy-type IDENTITY_POLICY (FAIL on any finding
      whose findingType is in the document's validate_policy_block list); one check-access-not-granted --policy-type
      IDENTITY_POLICY per never row of each class it is in (a ceiling none), --access holding that row's actions and
      filled resources (FAIL on result FAIL); for an update with a known prior document, check-no-new-access
      --policy-type IDENTITY_POLICY (WIDENS on FAIL, never refusing). A trust: check-no-public-access --resource-type
      AWS::IAM::AssumeRolePolicyDocument only (FAIL on FAIL); a trust is never sent to an IDENTITY_POLICY call.
      Results are keyed by the normalised address, as the gate's rows are; a keyed group (count or for_each instances,
      a single [0] instance included) is one result whose digest is classify.group_digest of its instances' digests
      and whose checks are each instance's, the worst verdict shown. Output, names only (Decisions 101, 238 cl.4): one
      line per check "ANALYZER <address> <check> <PASS|FAIL|WIDENS|NEW|UNCHECKED>" with "sid=<statementId>" on a FAIL
      when the Sid matches [A-Za-z0-9]{1,64} and holds no run of twelve or more digits, else "index=<statementIndex>", never a document, ARN, account, finding
      description, message or CLI stderr (stderr is captured and dropped); then "ANALYZER_SUMMARY
      verdict=<PASS|REFUSED> mode=<changed|full> documents=<n> fail=<n> widens=<n> unchecked=<n>". R holds
      {schema_version, mode, verdict, results: [{address, classes, digest, checks}]} with the same names-only content.
      Exit 0 PASS, 1 REFUSED, 2 ANALYZER_UNREADABLE (a CLI error, a malformed response, an unreadable plan or
      invariants file), printed as "ANALYZER_UNREADABLE <code>" where code is the AWS error code matched in the
      captured stderr by [A-Za-z]+(Exception|Error) (it carries no value), else cli_error, plan or invariants. Under 500 SLOC; if it would pass that, the selection and class logic moves to a sibling
      scripts/ci/terraform_bootstrap_apply_analyzer_select.py loaded by path (as classify loads plan_names_core), added
      to the fence's OWNED and already under the CODEOWNERS glob and the sweep trigger.
    new_imports: []
  - file: scripts/ci/terraform_bootstrap_apply_classify.py
    action: Modify
    purpose: >-
      BUILD PR 2. Add document_digest(doc) -> str: sha256 hex of json.dumps(parsed document, sort_keys=True,
      separators=(",", ":")), "" for an absent or unknown document. Add checked_document(plan, rc) -> the document the
      analyzer checks for that resource_change, or None: for aws_iam_policy, aws_iam_role_policy and
      aws_iam_user_policy, the known after policy document of any row build_rows keeps (create, update, replace,
      import and moved rows alike); for aws_iam_role, the known after trust when the trust is new or differs from
      before (create, replace, import, moved or update; an import or a pure move with an unchanged trust also gets
      its after trust, as for policies, and the analyzer test covers a moved role); for aws_iam_role_policy_attachment and
      aws_iam_user_policy_attachment rows whose actions include create, or that are imported or moved, the attached
      customer policy's known document (from the plan's after values or prior state, through _resolve); None for a
      no-op row with neither previous_address nor importing set (a pure move or import has actions ["no-op"] and
      gets a document), and for delete-only, unknown-after and AWS-managed rows. Add group_digest(digests) -> "" when every digest is "",
      else document_digest of the sorted non-empty digests. build_rows adds "digest" to each row:
      document_digest(checked_document(plan, rc)) for a single instance, group_digest over the instances for a keyed
      group (a single [0] instance included). This one predicate is the analyzer's selection (scope row 7), so every
      digest has a result and an attachment's pulled-in policy is bound by digest too. Extend _resolve and
      target_names to aws_iam_user_policy and aws_iam_user_policy_attachment ("user"); no classification or reason
      changes.
  - file: scripts/ci/terraform_bootstrap_apply_gate.py
    action: Modify
    purpose: >-
      BUILD PR 2. preview gains a required analyzer argument (CLI --analyzer-json, required; unreadable is
      BOOTSTRAP_APPLY_UNREADABLE, exit 1). The table gains an Analyzer column (a row's check verdicts, FAIL with its sid
      or index) and, below it, a full-sweep section listing mode, document count and each FAIL address outside the
      changed rows. Every row with a non-empty digest must have an analyzer result with the same normalised address and digest,
      else unreadable (the verdict covers exactly the reviewed document). An analyzer verdict REFUSED makes the run exit
      1 on every event with has_changes=false and a ::error::ANALYZER_REFUSED line; the verdict is ANALYZER_REFUSED,
      or CLOUDSHELL_REQUIRED when a protected row is also present (then the operator reads the Analyzer column before
      any CloudShell apply). _CHECK_KEYS gains "digest", so check refuses as unreviewed any applied row whose document
      differs from the previewed one. Docstring updated, noting that a reviewed digest is sha256 hex and may hold a
      twelve-digit decimal run (not an account id), so a later digit-run scanner of the apply log excludes it. No other behaviour changes.
  - file: .github/workflows/terraform-bootstrap-apply.yml
    action: Modify
    purpose: >-
      BUILD PR 2. push paths gain 'config/iam-invariants.json'. The preview job gains, between "Read-only plan" and
      "Preview", a step "IAM Access Analyzer checks (names and verdicts only)" with env GH_TOKEN (github.token),
      EVENT_NAME and BEFORE_SHA (github.event.before) running python3 -I
      scripts/ci/terraform_bootstrap_apply_analyzer.py --plan-json "$RUNNER_TEMP/plan.json" --invariants
      config/iam-invariants.json --event-name "$EVENT_NAME" --before "$BEFORE_SHA" --out "$RUNNER_TEMP/analyzer.json",
      failing the step only on exit 2. Its run body is the analyzer invocation writing its lines to a file, then cat
      of that file to the log and to $GITHUB_STEP_SUMMARY on lines of their own (never tee, and never cat on a line
      naming plan.json, fence predicate (e)'s _PLAN_LEAK_RE), at most four lines, registered in scope row 20. The
      Preview step passes --analyzer-json "$RUNNER_TEMP/analyzer.json" on an existing line and the delete step
      removes the analyzer files on its existing line, so their bodies keep 6 and 1 lines. The header comment gains
      one sentence. The apply job is unchanged.
  - file: scripts/checks/ci_guards/validate_bootstrap_apply.py
    action: Modify
    purpose: >-
      BUILD PR 2. PUSH_PATHS gains config/iam-invariants.json; OWNED gains scripts/ci/terraform_bootstrap_apply_analyzer.py
      and config/iam-invariants.json (predicate g). New predicate (i): the preview job runs the analyzer script after the
      read-only plan step and before the gate's preview step, which passes --analyzer-json. New predicate (j): no step of
      the apply job and no line of scripts/ci/terraform_bootstrap_apply.sh names accessanalyzer or access-analyzer.
      Docstring lists both. It adds no import (its existing re, yaml, _common, registry,
      validate_trusted_plan_environment and verify_ci_workflow imports suffice).
    new_imports: []
  - file: tests/checks/ci_guards/test_validate_bootstrap_apply.py
    action: Modify
    purpose: >-
      BUILD PR 2. Red cases for (i) (analyzer step missing, after the preview step, or --analyzer-json dropped) and (j)
      (an accessanalyzer call added to the apply job or the shell script); the real-tree node
      test_registered_check_passes_on_the_real_tree stays green, its "PASS: predicates (a)-(h)" becoming "(a)-(j)"
      (planned-change disposition citing acceptance_criteria[2]: the predicate list grows, never loosens). PUSH_PATHS
      itself lives in validate_bootstrap_apply.py (scope row 11).
  - file: tests/test_terraform_bootstrap_apply_analyzer.py
    action: Create
    purpose: >-
      BUILD PR 2. Hermetic tests with an injected fake runner for the aws CLI and the compare fetch (Decision 212 cl.2),
      on synthetic plan JSON: changed-only selection (create and update documents sent, no-op skipped, a new attachment
      pulls its customer policy, an AWS-managed attachment is UNCHECKED, a changed trust sent to check-no-public-access);
      full sweep on an empty or zero --before, on a compare listing config/iam-invariants.json and on an
      unreadable compare; class union (an agent-platform-session-* policy is checked against both session and
      ci_writable rows) and class other; red cases for the principal rule: a policy named outside every glob attached
      to user agent-platform-session (an attachment row) and an update to such a policy already attached to it in
      prior state are both checked against the session rows and FAIL on an s3:GetObject grant; boundaries: a
      ci_writable boundary allowing s3:* on "*" skips the never rows and passes, a session boundary granting
      ssm:GetParameter on parameter/secret/* FAILs; ValidatePolicy: a SECURITY_WARNING refuses in session and
      ci_writable and not in other or a ceiling, an ERROR refuses everywhere; a keyed group yields one normalised
      result with the sorted-digest rule; unknown-at-plan references: a policy created in the same plan (policy_arn
      unknown, a configuration reference) attached to user agent-platform-session, and an inline policy whose role is
      a same-plan agent-platform-* role, are classed by the resolved principal and FAIL on a never grant, and an
      unresolvable principal is checked against every class; a decoy role naming an agent-platform-* grant as its
      permissions_boundary does not exempt that grant, and the ceiling-named policy attached to a role is checked as a
      grant; an AWS-managed policy attached to the session user FAILs managed_on_session, and a replaced, imported or
      moved attachment to the session user is selected (customer-managed: checked against the session rows;
      AWS-managed: managed_on_session); a moved or imported aws_iam_role with an unchanged trust is selected and
      sent only to check-no-public-access, its digest equal to classify's; a trust is sent only to check-no-public-access and never to an
      IDENTITY_POLICY call; a dispatch runs in changed mode; a compare listing config/iam-invariants.json, the
      analyzer script, an analyzer_select sibling, classify.py or plan_names_core.py, or 300 files, sweeps; a Sid holding a newline, "::" or a space prints
      as index= (workflow-command injection, precedent test_policy_strings_cannot_inject_workflow_commands_into_the_table);
      placeholders filled with the faked account and region; one check-access-not-granted call per never row; a FAIL
      refuses (exit 1) and prints its sid or index; WIDENS never refuses; a CLI error or malformed response exits 2;
      digests equal classify.document_digest; full mode on a plan holding an update and a keyed group gives each
      changed row its changed-mode digest, adds unchanged prior-state addresses, skips destroyed rows, and fed to
      gate.preview is not unreadable; dedupe by (digest, class set) makes one call set per pair; ANALYZER_UNREADABLE
      prints an error code and no stderr text; and no output line, and no results-file field other than digest,
      holds twelve digits, "arn:", a description or message the fake returned, or document text. If the file would
      pass 500 SLOC, the plan builders and fake runner go in tests/fixtures/ (never imported from another test_*
      module, tests/CLAUDE.md) or the selection nodes split into a second test module, never a budget raise.
  - file: tests/test_terraform_bootstrap_apply_gate_analyzer.py
    action: Create
    purpose: >-
      BUILD PR 2. The gate with analyzer results: PASS keeps today's verdicts; REFUSED gives ANALYZER_REFUSED and exit 1
      on push and dispatch; REFUSED plus a protected row gives CLOUDSHELL_REQUIRED, exit 1 and the ::error:: line; a
      missing or digest-mismatched result is unreadable; reviewed rows carry digest; check refuses a row whose digest
      differs from the reviewed one and passes an identical one; the CLI refuses without --analyzer-json. Classifier
      nodes: build_rows gives a digest to create, update, replace, import and moved policy rows with a known after
      document and none to no-op, delete-only or unknown-after rows; an attachment row's digest is its attached
      policy's; group_digest is "" for an all-empty group (a tag-only update of keyed roles, a keyed delete) and the
      sorted value for single-instance [0] and mixed groups, and the gate demands no result for an empty digest; and a
      plan holding an imported, a moved and a replaced policy with matching analyzer results still ends
      CLOUDSHELL_REQUIRED (today's verdict) and not unreadable.
  - file: tests/test_terraform_bootstrap_apply_gate.py
    action: Modify
    purpose: >-
      BUILD PR 2. Existing preview call sites pass a PASS analyzer fixture built from the plan's rows (preview's new
      required argument); hand-built reviewed sets gain the digest their rows now carry. Assertions are unchanged
      (planned-change disposition citing acceptance_criteria[2]). If the file would pass its SLOC budget the fixture
      helper goes in tests/fixtures/ (never imported from another test_* module, tests/CLAUDE.md), never a budget
      raise.
  - file: tests/checks/iam_tf/test_iam_invariants.py
    action: Create
    purpose: >- # pragma: allowlist secret
      BUILD PR 2. The static, credential-free layer over config/iam-invariants.json: (1) pin: the parsed file equals,
      field for field, one expected mapping written out in the test from scope row 6 (every class's role_names,
      policy_names and user_names globs, ceilings == [classify.BOUNDARY_NAME], every never row's id, actions and
      resources exactly, and validate_policy_block's four lists), so removing, narrowing or widening any field fails
      a test (Decision 235), with red cases for a narrowed session glob, a dropped secretsmanager:GetSecretValue, an
      added ceiling and an emptied ci_writable policy_names; (2) drift: every role/ and policy/ pattern in terraform_bootstrap_apply_classify.py's
      PROTECTED_NAME_PATTERNS appears in a ci_writable resource; (3) offline, resource-aware: no Allow statement in
      agent_session_user.tf grants a session never action on a never resource, an action matching when the two
      fnmatch case-insensitively in either direction and a resource matching when a row's resource (placeholders read
      as "*") and the statement's resource fnmatch in either direction, a row without resources matching any resource
      (DuckLakeEndpointDiscovery's ssm:GetParameter on /agent-platform/ducklake/* therefore passes), with red cases
      for an added ssm:GetParameter on parameter/secret/* and an added s3:GetObject; (4) hygiene: only {account} and
      {region} placeholders, no twelve-digit run, every action has a service prefix; (5) drift: every action of
      agent_session_user.tf's DenySessionEscalation statement appears in the session class's iam_write or
      credential_minting row, with a red case for a family added to the guard and not to the row.
  - file: .github/CODEOWNERS
    action: Modify
