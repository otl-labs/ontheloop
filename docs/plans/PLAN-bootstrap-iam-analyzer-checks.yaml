constraints:
  - "No rescue agents or workaround loops (Decision 55). Never attempt or retry sts:AssumeRole or any other credential-minting call from a session; the session user has no Access Analyzer grant, so the build never calls Access Analyzer itself: live calls run only in CI (bootstrap-preview) and in the operator's CloudShell (VP 7-8)."
  - "Never write an account id, ARN with an account, ExternalId, key or host into the repo, a PR, a comment, a job log or the shared folder (Decision 101). Analyzer output is names and verdicts only; an Access Analyzer description, message or reason text is never printed (Decision 238 cl.4)."
  - "The governed files get exactly the sidecar's words (Decision 246). The operator approved this work on 2026-11-16 and asked not to be asked again for final-diff words on approved work; the operator's GitHub approval of the sidecar's run and the operator's own CloudShell pastes (VP 6-8) and the VP 10 approval are the only operator actions."
  - "No grant beyond scope row 2 and no change to bootstrap-apply, the CI apply boundary, the session user or any Deny other than DenyAllButReads' NotAction. A never row is never removed or narrowed to obtain green (Decision 235); a FAIL on an existing document routes per VP 7's fix_if."
  - "A PASS is evidence for the operator's review, never a substitute for the tf-bootstrap-apply approval (Decision 92 pt 1); no code path lets a FAIL be waived or skipped."
