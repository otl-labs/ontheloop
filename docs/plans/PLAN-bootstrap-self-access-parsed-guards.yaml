  test_selector: tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py::TestBootstrapOwnsPlatformIam
  red_green_expectation: red before -- with the new detection, test_real_tree_is_clean fails on origin/main's strcontains
    guard; green after the HCL change. Red cases -- Condition clause removed, alltrue turned into anytrue, bucket ARN
    corrupted, strcontains form restored. Live red (step 11) on the object statement without s3:PutObject and on the object ARN moved.
constraints:
- No IAM grant, policy statement, policy local, resource or import block changes; the change is confined to the two
  self-access precondition blocks (condition, comment, error_message) and the static test.
- terraform/bootstrap is never applied by this plan; agents never apply it (Decision 126). The pre-merge and post-merge
  plans are read-only with -lock=false.
- Public repo (Decision 101) -- no account ids, ARNs carrying an account id, or ExternalIds in commits, PR text,
  comments or evidence; plan files and JSON stay in the scratch directory and are deleted in the step that makes them.
- Keep one length(jsonencode(jsondecode(local. byte measure per policy; personal-policies-carry-byte-preconditions
  requires exactly one per file in platform_admin_policies.tf (the data file carries three, one per policy, and that
  shard does not scan it).
- Every behaviour-changing edit carries a test that fails without it; never skip, disable or quarantine a test.
- No rescue agents or workaround loops (Decision 55).
