pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
- rec-4346's acceptance reads as step 2's command without the echo (recs_by_ids); if not, stop and ask the planning
  thread
- rec-4372 is closed, or the project's CI-halt rule otherwise permits this build (the coordinator says so); if not,
  stop
execution_steps:
- STEP 1 -- Modify terraform/bootstrap/platform_admin_policies.tf per its scope row; touch nothing outside the
  self-access precondition block.
- STEP 2 -- Modify terraform/bootstrap/platform_admin_data_policies.tf per its scope row; touch nothing outside the
  self-access precondition block.
- STEP 3 -- Modify tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py per its scope row (each guard's
  normalised condition must exactly equal its canonical string; no strcontains(; the error_message checks; seven red
  cases as positive asserts).
- STEP 4 -- Run VP steps 1-5; loop until green (Decision 55).
- >-
  STEP 5 -- Run the implement skill's code review on the diff. Then follow its Commit Flow in order:
  bin/venv-python -m scripts.session.github_readiness (each state reported on its own; unknown is not a pass); set
  implementation_declared: true in this plan; bin/venv-python -m scripts.validate --pre; postflight evidence
  (/tmp/implementation-retrospective.json carrying every scripts.session.postflight_evidence.CATEGORIES key, then
  bin/venv-python -m scripts.session.postflight --evidence /tmp/implementation-retrospective.json); commit; git
  fetch origin main and git rebase origin/main; VP 1-5 again on the rebased tree; VP 6 (full tier, then
  bin/venv-python -m scripts.checks.validation_result --verify-head) on the committed, rebased, clean tree immediately
  before push (docs/contracts/git-ops.yaml handoff_sequence); push as its own tool call; open the PR with the
  repository's PR conventions. The PR body says in words that the effective IAM policy is unchanged (no statement,
  grant or resource changes; the plan shows no resource diff) and carries "Resolves: rec-4346" for the squash body.
  Subscribe to PR activity. Any fix commit or re-rebase restarts from the rebase and produces a new head.
- >-
  STEP 6 -- Once CI is green on the head, run VP 7-12 at that head (or hand them to an ADMIN session per VP 7) and post
  the two counts-only JSON lines with PR_HEAD_SHA on the PR. Every new head (fix commit or rebase) re-runs VP 8-12
  before merge.
- >-
  STEP 7 -- Merge per the merge rule in context: squash, passing the PR body as the commit message so the Resolves
  trailer survives (implement skill Commit Flows).
- STEP 8 -- After merge, run VP 13 and post its counts-only comment on the merged PR naming MERGE_SHA; run VP 14.
- >-
  STEP 9 -- Report each item separately: github_readiness's states; each VP result, with VP 6's full-tier verdict and its
  --verify-head verdict as two items; the postflight evidence; the code-review verdict; the VP 10 and VP 11 JSON lines
  with PR_HEAD_SHA; the push, PR and merge outcome with MERGE_SHA; VP 13's JSON line; and VP 14's result.
rollback: >-
  git revert of the squash commit restores the substring guards; nothing was applied, so no infrastructure rollback
  exists or is needed.
