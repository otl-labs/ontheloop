  - "With PR 1 CI green: post VP 7 and VP 8 to the operator with the PR 1 link and its full head sha (the operator's VP 8 paste at that head is the final-diff word for PR 1's IAM diff); record the lines on PR 1; merge PR 1 (squash) at the head VP 8 covered; post VP 9 at the merge sha in the same sitting and record its lines."
  - "Rebase PR 2 onto main after VP 9, re-run VP 3-6 on the new head, ask the operator once for the final-diff word with the PR 2 link (Decision 246 cl.4), merge (squash) with Resolves: rec-5168, rec-5195, rec-4349; then VP 10, VP 11 and VP 12."
