rollback: >-
  PR 2: a revert PR removes the workflow, the report, the row and the rules (the post-merge preview and the gate's
  screen do not depend on them) and keeps the Decision (append-only, Decision 177) with a dated note that the PR-time
  plan is off, so deploy-paths' CloudShell clauses apply again to every bootstrap PR; the revert restores the old
  contract words. A faster stop is disabling the workflow from the Actions tab. PR 1: the role is harmless without the
  workflow (its trust names a workflow file that would not exist); to remove it a reviewed PR drops scope row 1's file
  and the operator applies it from CloudShell.
constraints:
  - "No rescue agents or workaround loops (Decision 55). Never attempt or retry sts:AssumeRole or any other credential-minting call from a session; the build session holds no AWS identity for VP 7-9 (the operator's CloudShell blocks) and never calls Access Analyzer."
  - "Never write an account id, ARN with an account, ExternalId, key, email or host into the repo, a PR, a comment, a job log or the shared folder (Decision 101). The job's output is names, verdicts and counts only; a refusal names rules and file:line only."
  - "The governed files get exactly the sidecar's words (Decision 246). The operator approved this plan (write the plan, 2026-11-18); the operator's actions are the GitHub approval of the sidecar's run, the CloudShell pastes (VP 7-9) and one final-diff word on PR 2 (Decision 246 cl.4: CODEOWNERS and security code; rec-5206 would narrow it), asked once with the PR link."
  - "No change to bootstrap-preview, bootstrap-apply, the CI apply boundary, the session user, the post-merge workflow or the gate's verdict logic. A screen rule is never loosened to obtain green (Decision 235): a construct main needs that the Decision refuses moves its file to main-only, a plan amendment."
  - "The job is advisory: never a required check, and a PASS is evidence for the operator, never a substitute for the tf-bootstrap-apply approval (Decision 277 cl.1)."
