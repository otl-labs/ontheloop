followon_recs: []
infrastructure_dependencies:
  - "terraform/bootstrap is admin-only and every name in scope row 1 is in Decision 257 cl.3's protected set: BUILD PR 1 gets the operator's ENVIRONMENT CHECK and screened pre-merge CloudShell plan (VP 7-8) and the operator's CloudShell apply in the same sitting as its merge (VP 9). Its merge push runs terraform-bootstrap-apply.yml, whose preview ends CLOUDSHELL_REQUIRED neutral for the six creates if the sitting has not applied yet, else NO_CHANGES (both expected). No unmerged PR code runs under the operator's credentials: VP 8 and VP 9 run only terraform at screened heads and aws CLI lines written in this plan."
  - "BUILD PR 2 changes no file under terraform/, so it needs no CloudShell plan; it merges only after VP 9 passes (before that the new workflow's assume step would fail on every bootstrap PR). Its merge push re-runs terraform-bootstrap-apply.yml's preview (the workflow's push paths name terraform_hcl_screen.py and terraform_hcl_screen_policy.py, which PR 2 changes; they do not name the new rules module, so a later rules-only change re-runs the preview at the next bootstrap push), VP 10. Its first live run of the new workflow is the probe PR, VP 11."
  - "One merged-unapplied bootstrap change at a time: PR 1 merges only when no other bootstrap change is merged and unapplied and the operator can run VP 9 in the same sitting."
  - "No Lambda code changes and no deploy channel. No new repository secret or variable: the job uses the tf-trusted-plan Environment's existing AWS_ACCOUNT_ID and AWS_ROLE_ID_ACCOUNT_PART secrets and the job token, so no project-configuration.yaml row. Spend: a few Access Analyzer paid checks per bootstrap PR head (changed documents only), about $0.002 each (Decision 257 Update 2026-11-16's figure)."
acceptance_criteria:
  - "bootstrap-pr-plan exists as scope row 1 declares: one trust statement for the tf-trusted-plan subjects and terraform-bootstrap-plan.yml at refs/heads/main only, no permissions boundary, exactly the shared reads policy, its own reads policy (the four analyzer checks and the hashicorp/aws mirror prefix) and its guard; test_bootstrap_pr_plan_role.py passes with each red case red (VP 1); after PR 1's apply live simulation allows the mirror read, the mirror listing under its prefix, the state read, the tfvars read and ValidatePolicy, denies a listing outside the mirror prefix, and explicitly denies a state write, an object read outside the state and the mirror, and an IAM write, and the trust's job_workflow_ref is the one ref (VP 9)."
  - "The terraform/bootstrap screen row accepts main's tree as it is on the build day (VP 5, and validate_trusted_plan_screen on --pre) and refuses each construct Decision {{N}} cl.3 names, while the personal and github rows give the same findings as before (VP 4)."
  - "terraform-bootstrap-plan.yml passes validate_trusted_plan_environment's predicates and the role partition; on a probe PR it posts, before merge and with no operator step, a names-only comment ending BOOTSTRAP_PR_PLAN category=OK with the gate's verdict and rows for a screenable change, OVERLAY_REFUSED for a variables.tf change and SCREEN_REFUSED confidential_reference for an owner_email reference, with no account-id-shaped run (redaction_check.ACCOUNT_ID_SHAPE) or arn: in any comment and no Allow actions, Resources, Sid or analyzer loc value reaching any comment, the job log or the step summary (VP 4, VP 11)."
  - "validate_admin_root_premerge_gate accepts a trusted-plan verdict step in place of the CloudShell pair only for screenable terraform/bootstrap scope, and still demands the pair otherwise (VP 4)."
  - "The governed files carry exactly the sidecar's words: the new Decision, deploy-paths pre_merge_live_plan (terraform/github's plan named, the trusted PR plan as bootstrap's gate, the ENVIRONMENT CHECK for operator CloudShell sittings), the taxonomy line and the planning-skill line (VP 6); rec-5168, rec-5195 and rec-4349 close on PR 2's merge (VP 12)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: BUILD PR 1. Run the new and changed IAM text tests.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_bootstrap_pr_plan_role.py tests/checks/iam_tf/test_bootstrap_ci_roles.py
      tests/checks/iam_tf/test_bootstrap_preview_analyzer.py tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py -q
    expected: >-
      All pass, including each parametrized red case of test_bootstrap_pr_plan_role.py and every existing node of the
      other three files (bootstrap-preview's and bootstrap-apply's predicates are unchanged and stay green).
    fix_if: Any failure; fix the Terraform or the test's parsing, never an assertion's meaning (Decision 235).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates PR CI's diff-selected pytest of these files; the test_obligations nodes pin the behaviour, and rec-5149
      owns graduating the bootstrap IAM text tests as registry shards.
  - step: 2
    phase: pre-deploy
    action: BUILD PR 1. Standing IAM checks and provider-free formatting accept the changed root.
    command: >-
      bin/venv-python -m scripts.checks.iam_tf.validate_iam_policy_size && bin/venv-python -c "from
      scripts.checks.iam_tf.validate_account_portable_names import validate_account_portable_names as v; f = []; v(f);
      print(chr(10).join(f) or 'PORTABLE_OK'); raise SystemExit(1 if f else 0)" && terraform fmt -check -recursive
      terraform/bootstrap && echo FMT_OK
    expected: >-
      The policy-size check passes counting two more bootstrap policies than main; PORTABLE_OK and FMT_OK print.
    fix_if: A finding names the resource; fix the Terraform, never the check.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      validate_iam_policy_size and validate_account_portable_names are registered --pre checks that VP 3 runs on the same
      tree, and terraform fmt is CI's terraform-fmt job; a shard would run each twice.
  - step: 3
    phase: pre-deploy
    action: BUILD PR 1 and BUILD PR 2, each before handoff. Fast and full tiers.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and validation_result verifies the head (the full tier is started in the background from the
      top-level session).
    fix_if: Any failure; fix on the branch.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: BUILD PR 2. Run the screen, overlay, report, workflow, mirror, fence and gate-check tests and the fences.
    command: >-
      bin/venv-python -m pytest tests/checks/test_bootstrap_trusted_plan_screen.py tests/test_terraform_hcl_screen.py
      tests/test_trusted_plan_overlay.py tests/test_terraform_bootstrap_plan_report.py
      tests/test_terraform_bootstrap_plan_workflow.py tests/test_provider_mirror_seed.py
      tests/checks/ci_guards/test_validate_trusted_plan_environment.py tests/checks/ci_guards/test__trusted_plan_role_partition.py
      tests/checks/ci_guards/test_validate_trusted_plan_screen.py tests/checks/ci_guards/test__manifest.py
      tests/checks/verification/test__manifest.py tests/checks/iam_tf/test_trusted_plan_identity.py
      tests/checks/contracts/test_validate_github_org_transfer.py
      tests/checks/ci_guards/test_validate_bootstrap_apply.py tests/test_terraform_bootstrap_apply_gate.py
      tests/checks/verification/test_validate_admin_root_premerge_gate.py
      tests/checks/verification/test_validate_admin_root_premerge_gate_trusted.py tests/test_deploy_paths_admin_procedure.py
      tests/checks/ci_guards/test_validate_ci_rca_taxonomy_accounting.py tests/checks/prose/test_prose_limits.py -q &&
      bin/venv-python -m
      scripts.checks.ci_guards.validate_trusted_plan_environment && bin/venv-python -m
      scripts.checks.ci_guards.validate_bootstrap_apply
    expected: >-
