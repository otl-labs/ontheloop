schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "bootstrap-trusted-pr-plan"
intent: >-
  Every terraform/bootstrap PR gets its first live provider contact from a screened, trusted CI plan at PR time (main's
  terraform-bootstrap-plan.yml on pull_request_target under a new dedicated protected-set role, bootstrap-pr-plan, with
  a names-only comment carrying the bootstrap gate's predicted verdict and rows and the Access Analyzer verdicts), so the
  operator's CloudShell pre-merge plan and caller check stop being needed for every PR the screen accepts (Decision 257
  cl.5, reversal condition pr-time-plan-lands; rec-5168). Post-merge apply routing (CI apply on one approval, the
  protected set in CloudShell) is unchanged.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-bootstrap-trusted-pr-plan.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5168,
  owed rec 1 of PLAN-bootstrap-ci-gated-apply, with rec-5195 and rec-4349 bundled. Closes no roadmap criterion.
scope:
  - file: terraform/bootstrap/bootstrap_pr_plan.tf
    action: Create
    purpose: >-
      BUILD PR 1 (protected set: the operator's CloudShell pre-merge plan and apply, VP 7-9; the last bootstrap PR under
      the old rule). bootstrap_ci_apply.tf is at 500 of 500 effective lines, so nothing there changes. A header comment
      naming Decision {{N}} cl.2. Locals: bootstrap_pr_plan_workflow_refs =
      ["otl-labs/ontheloop/.github/workflows/terraform-bootstrap-plan.yml@refs/heads/main"] (its own list, never
      bootstrap_ci_workflow_refs, which both existing roles share); bootstrap_pr_plan_mirror_prefix =
      "tf-provider-mirror/registry.terraform.io/hashicorp/aws/"; bootstrap_pr_plan_reads_json with three statements:
      AccessAnalyzerPolicyChecks (Allow local.bootstrap_preview_analyzer_actions on "*"), ProviderMirrorRead (Allow
      s3:GetObject on "${local.data_lake_bucket_arn}/${local.bootstrap_pr_plan_mirror_prefix}*") and ProviderMirrorList
      (Allow s3:ListBucket on local.data_lake_bucket_arn with StringLike s3:prefix
      "${local.bootstrap_pr_plan_mirror_prefix}*"); bootstrap_pr_plan_guard_json with four Deny statements:
      DenyAllButReads (NotAction exactly concat(local.bootstrap_plan_read_actions, local.bootstrap_preview_analyzer_actions,
      ["sts:GetCallerIdentity"]) on "*" with BoolIfExists aws:ViaAWSService "false", as bootstrap-preview's guard),
      DenyObjectReadOutsideStateAndMirror (s3:GetObject* with NotResource the bootstrap state object and the mirror
      prefix), DenyParameterReadOutsideTfvars (ssm:GetParameter* with the same two NotResource ARNs as
      bootstrap-preview's guard) and DenyAccountIAMDump (the same three actions). Resources: aws_iam_role.bootstrap_pr_plan
      (name bootstrap-pr-plan, no permissions_boundary, prevent_destroy, one trust statement: Federated the GitHub OIDC
      provider, sts:AssumeRoleWithWebIdentity, StringEquals aud sts.amazonaws.com, sub flatten([for repo in
      local.github_repos : ["repo:${repo}:environment:${local.bootstrap_ci_preview_env}"]]) and job_workflow_ref
      local.bootstrap_pr_plan_workflow_refs); aws_iam_policy.bootstrap_pr_plan_reads and aws_iam_policy.bootstrap_pr_plan_guard
      (names bootstrap-pr-plan-reads and bootstrap-pr-plan-guard, each with the 6,144 B lifecycle precondition its
      siblings carry); attachments aws_iam_role_policy_attachment.bootstrap_pr_plan_shared_reads (the existing
      aws_iam_policy.bootstrap_plan_reads, so both plan roles read through one policy and cannot drift),
      bootstrap_pr_plan_reads and bootstrap_pr_plan_guard. Six creates, every name inside the bootstrap-* pattern that
      the CI apply boundary, bootstrap-apply's guard, terraform_bootstrap_apply_classify.py and config/iam-invariants.json
      already protect. No data, import, moved, provider or terraform block. bootstrap-preview and bootstrap-apply are
      unchanged.
  - file: tests/checks/iam_tf/test_bootstrap_pr_plan_role.py
    action: Create
    purpose: >-
      BUILD PR 1. Text tests in the iam_tf predicate convention over every terraform/bootstrap/*.tf text, globbed in this
      module (no import from another test_* module): pr_plan_problems(texts) is empty only when the role's one trust
      statement holds exactly the aud, the tf-trusted-plan subjects and local.bootstrap_pr_plan_workflow_refs, that local
      is exactly the one terraform-bootstrap-plan.yml ref at refs/heads/main and no other trust names it; the role carries
      no permissions_boundary and its name starts bootstrap-; exactly three attachments name it (the shared
      bootstrap_plan_reads, bootstrap_pr_plan_reads, bootstrap_pr_plan_guard) and no other role attaches the two new
      policies; the reads policy's Allow actions are exactly the four analyzer actions, s3:GetObject and s3:ListBucket, and
      its S3 resources are only the mirror prefix; the guard's DenyAllButReads NotAction is the exact concat string and
      the guard has no Allow. Real-tree node asserts []; a parametrized red node drives one mutation each (a second trust
      statement, the apply workflow's ref added, a permissions_boundary-free rename outside bootstrap-*, a fourth
      attachment, s3:PutObject in the reads policy, a mirror resource widened to the bucket, the NotAction extended).
  - file: tests/fixtures/bootstrap_leak_scan.py
    action: Create
    purpose: >-
      BUILD PR 1 (SLOC relief for scope row 4, measured 2026-11-18 at 500 of 500): UNSCANNED_BOOTSTRAP_FILES, moved
      verbatim (keys and reasons unchanged) from test_platform_role_metadata_admin_scope.py's _UNSCANNED_BOOTSTRAP_FILES.
      tests/fixtures is the shared-helper package tests/CLAUDE.md names; the scanned tuple of literal paths stays in the
      test module, so --pre selection is unchanged.
  - file: tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
    action: Modify
    purpose: >-
      BUILD PR 1. _SCANNED_BOOTSTRAP_FILES gains _BOOTSTRAP_DIR / "bootstrap_pr_plan.tf" (the new CI identity is scanned
      for IAM leaks, Decision 225 cl.5); the unscanned mapping is imported from tests/fixtures/bootstrap_leak_scan.py
      under its old local name. No assertion changes. Net SLOC at most 491. Kept graduated record (asserts unchanged):
      platform-admin-absent-from-ci-write-patterns, whose node is this file.
  - file: .github/workflows/terraform-bootstrap-plan.yml
    action: Create
    purpose: >-
      BUILD PR 2. Header comment (Decision {{N}}, Decision 238; the PR is data, never steps; it never names the other two
      bootstrap roles in role/ form, which validate_bootstrap_apply.check_roles reserves for their workflows; advisory, never a required
      check; never workflow_call; validate_trusted_plan_environment polices it). on: pull_request_target types [opened,
      synchronize, reopened], paths terraform/bootstrap/**; permissions: {}; concurrency per PR number with
      cancel-in-progress; defaults: run: shell: bash (GitHub then runs each step as bash --noprofile --norc -eo pipefail,
      so a refused overlay or screen fails its tee'd step instead of passing through tee). One job plan: if same-repo head, base main and github.event.pull_request.user.login not
      dependabot[bot]; ubuntu-latest; timeout 20; environment {name: tf-trusted-plan, deployment: false}; permissions
      contents read, id-token write, pull-requests write; env PR_NUMBER, HEAD_SHA, TF_VAR_aws_profile "", TF_IN_AUTOMATION
      1, TF_INPUT 0, MASK_AWS_ROLE_ID_ACCOUNT_PART. Steps, every action SHA-pinned to the pin terraform-plan-trusted.yml
      uses: checkout (persist-credentials false); ./.github/actions/aws-region; overlay (OVERLAY_ROOT=terraform/bootstrap
      python3 -I scripts/ci/trusted_plan_overlay.py, tee overlay.txt); the generic screen (python3 -I
      scripts/ci/terraform_hcl_screen.py screen --root terraform/bootstrap --policy terraform/bootstrap, tee screen.txt,
      since a root with a row of its own is refused as root_policy_mismatch under the default row); the bootstrap gate's own
      screen (python3 -I scripts/ci/terraform_bootstrap_apply_gate.py screen, appended to screen.txt); only then assume
      role/bootstrap-pr-plan (configure-aws-credentials, role-session-name tf-bootstrap-pr-plan); pinned terraform
      version and setup-terraform (wrapper off); mirror sync of the hashicorp/aws prefix only (aws s3 sync --only-show-errors of
      s3://agent-platform-data-lake/tf-provider-mirror/registry.terraform.io/hashicorp/aws/ to
      "$RUNNER_TEMP/tf-mirror/registry.terraform.io/hashicorp/aws", with no --exclude or --include: the CLI lists with the
      source key as its prefix, which the role's s3:prefix condition admits, while the terraform/github form lists
      tf-provider-mirror/ and filters client-side); hermetic init inline through quiet_run.sh (terraform -chdir=terraform/bootstrap
      init -input=false -plugin-dir="$RUNNER_TEMP/tf-mirror" -get=false -lockfile=readonly
      -backend-config="region=$AWS_REGION"; terraform-init-retry is not used: its default backend file is
      terraform/personal's and its second step is the Neon key preflight this root does not need); plan through
      trusted_plan_env.sh and quiet_run.sh (terraform -chdir=terraform/bootstrap plan -lock=false -input=false -no-color
      -out=plan.bin); show -json to a private file through quiet_run.sh; rm plan.bin in the same step; backstop
      (terraform_hcl_screen.py backstop --plan-json, --policy terraform/bootstrap); the analyzer (--plan-json, --invariants
      config/iam-invariants.json, --event-name pull_request_target, --out analyzer.json, stdout to analyzer.txt; exit 1, its
      REFUSED verdict, recorded as ANALYZER_REFUSED whatever the gate's verdict, so a protected change the analyzer
      refuses still fails the job; exit 2 recorded as ANALYZER_FAILED); the gate preview (--plan-json, --analyzer-json, --github-output
      "$RUNNER_TEMP/gate.out", --event-name pull_request_target, stdout to preview.md; exit 0, or exit 1 with
      verdict=CLOUDSHELL_REQUIRED or ANALYZER_REFUSED in gate.out, is a planned verdict; any other exit 1 is
      GATE_FAILED); two comment steps, as terraform-plan-trusted.yml splits them. The refusal
      comment (if !cancelled(), the overlay step not skipped and the assume step not success): category ASSUME_FAILED,
      or OVERLAY_REFUSED when the overlay failed, else SCREEN_REFUSED when a screen failed; the body from the report's
      --refusal-file mode run with no wrapper (no credential or tfvars exists yet, and trusted_plan_env.sh would fail
      fetching them); then gh pr comment. The plan comment (if !cancelled() and the assume step succeeded): the category
      is the first failure in the map tfver, setup_tf, mirror and init to INIT_FAILED, plan and show to PLAN_FAILED,
      backstop to BACKSTOP_REFUSED, analyzer exit 2 to ANALYZER_FAILED, analyzer exit 1 to ANALYZER_REFUSED, gate to
      GATE_FAILED; OK only when every mapped step's outcome is exactly success and the recorded analyzer and gate codes
      are each in their declared sets ({0, 1, 2} and {0, 1}), so a skipped step, an empty code or any other value is the
      category of the first such step, never OK (Decision 162's strict consumer); the body from terraform_bootstrap_plan_report.py run under trusted_plan_env.sh --scrub-only,
      redaction_check.py assert-clean under the same wrapper, then gh pr comment. The gate preview's and the report's
      stderr, and the backstop's, go to "$RUNNER_TEMP/tools.err", which no step prints, so a traceback never reaches the PR-visible log; a final step fails the job unless the category is OK; an always() step deletes plan.bin, plan.json, analyzer.*, gate.out and preview.md. No step writes
      $GITHUB_STEP_SUMMARY or prints preview.md, analyzer.txt, gate.out or plan.json to the log: every tool's stdout goes
      to its file and only the report's names-only text reaches the comment (Decision 238 cl.4; the post-merge preview
      prints its table because its HCL is reviewed). No step
      persists or uploads a plan, plan JSON or log, no LLM step, no workflow_call, and no run body interpolates a
      PR-controlled expression (PR_NUMBER and HEAD_SHA reach run bodies as env only).
  - file: scripts/ci/terraform_hcl_screen_policy.py
    action: Modify
    purpose: >-
      BUILD PR 2. Policy gains six fields, each defaulted so the personal and github rows and the bootstrap gate's
      dataclasses.replace(default(), ...) are unchanged: secret_metadata_names (frozenset[str], default empty),
      refused_references (frozenset[str], default empty), allowed_imports (frozenset of (to, id) string pairs, default empty, meaning no restriction),
      refused_attributes (frozenset[str], default empty), data_attributes (a mapping of data type to admitted attribute
      names, default empty, meaning unrestricted) and meta_argument_locals (bool, default False). A third row
      _BOOTSTRAP: root terraform/bootstrap; main_only_files main.tf, .terraform.lock.hcl, backend-sit.hcl,
      authority_budget.json, variables.tf, platform_roles.tf, platform_admin_policies.tf, platform_admin_data_policies.tf,
      platform_security_heartbeat_canary.tf (today's try() forms and the heredoc are in the last three); data_types
      aws_iam_policy_document and aws_secretsmanager_secret; secret_metadata_names agent-platform-terraform-github-apply-app,
      agent-platform-deepseek-api-key and agent-platform-anthropic-api-key (the lookups outside main-only files today);
      resource_types today's 34 (aws_api_gateway_account, _deployment, _integration, _method, _method_settings, _resource,
      _rest_api, _rest_api_policy, _stage, aws_cloudtrail, aws_cloudwatch_log_group, aws_cloudwatch_log_metric_filter,
      aws_cloudwatch_metric_alarm, aws_iam_policy, aws_iam_role, aws_iam_role_policy, aws_iam_role_policy_attachment,
      aws_iam_user, aws_iam_user_policy_attachment, aws_lambda_function, aws_lambda_permission, aws_s3_bucket and its
      _lifecycle_configuration, _ownership_controls, _policy, _public_access_block, _server_side_encryption_configuration
      and _versioning, aws_scheduler_schedule, aws_scheduler_schedule_group, aws_secretsmanager_secret_policy,
      aws_servicequotas_service_quota, aws_sfn_state_machine, aws_ssm_parameter); functions the eleven used outside main-only
      files today (concat, flatten, jsondecode, jsonencode, keys, length, one, sha1, sort, split, toset) plus regex and
      can, which validation_only_functions confines to validation blocks; no try and no file; validation_only_functions regex and can; file_paths empty; top_level_blocks
      resource, data, locals, output, moved, removed, import (no variable: all eight bootstrap variables live in the
      main-only variables.tf, and a PR-declared variable would read any other tfvars key trusted_plan_env.sh exports,
      such as alerts_email); backstop_providers aws; imports_allowed true with
      import_id_vars empty (quoted string literal ids only: scope row 7's rule 2b, since the existing _import_id_ok also
      admits a bare var.repository_name); refused_references var.platform_dev_external_id,
      var.platform_admin_external_id, var.owner_email, aws_iam_role.platform_dev and aws_iam_role.platform_admin (the role
      roots admitting only .arn, .name and .id); allowed_imports exactly the three (to, id) pairs in screenable files on
      main today (aws_iam_role.github_ci_apply and aws_iam_role_policy.github_ci_apply in github_ci_apply.tf,
      aws_iam_role_policy.platform_dev_runtime with PlatformDev:DailyOps in platform_dev_policies.tf): any other import
      reads an existing object's state into evaluation (an aws_ssm_parameter import of the personal tfvars parameter,
      which the shared reads grant, would carry both ExternalIds and the owner address as .value; an import of either
      break-glass role, in any case, would carry its trust document, Decision 225 cl.1), and a new import ends
      CLOUDSHELL_REQUIRED after merge anyway (Decision 257 cl.2), so an adoption import goes in a main-only file, where the job
      refuses the PR and the CloudShell pre-merge plan covers it (an unlisted import in a screenable file also turns
      validate_trusted_plan_screen red on --pre), and adding a pair to allowed_imports is reviewed as admitting that
      object's state to the PR-time read; refused_attributes tags and tags_all (main.tf's
      default_tags put the owner address on every resource, and terraform/personal's default_tags put it on the two
      inference secrets the row's data sources describe); data_attributes {aws_secretsmanager_secret: [arn],
      aws_iam_policy_document: [json]} (the only data attributes main reads); meta_argument_locals true; config_files empty. The build re-derives each
      list from main's tree on its day and records any difference in the PR body.
    new_imports: []
  - file: scripts/ci/terraform_hcl_screen.py
    action: Modify
    purpose: >-  # pragma: allowlist secret
      BUILD PR 2. The four row-gated rules below live in the new sibling scripts/ci/terraform_hcl_screen_rules.py (the
      next scope row; this file is at 369 of 500 SLOC and the rules with their for-expression analysis would not fit);
      this file imports the rules module lazily, inside screen_tree and only for a row that sets one of the new fields, and keeps the backstop change. Four rules, active only for a row that sets the field, so the personal and github screens behave as
      today. (1) secret_data_shape: a data "aws_secretsmanager_secret" block whose body is anything but one line name =
      "<literal>" with the literal in secret_metadata_names. (2) confidential_reference: a traversal var.X or
      resource.name.attr in a screened file whose root is in refused_references, except .arn, .name and .id on the two
      role roots; any resource or data traversal whose attribute, named or string-indexed, is in refused_attributes
      (tags, tags_all); a data traversal whose attribute is not in data_attributes for its type; every self traversal
      (self.tags_all in a postcondition would reach the owner address); an index or splat on a resource or data
      address, or a for-expression over one, unless that address declares count or for_each in the tree (on a
      single-instance resource a dynamic index can act as an attribute lookup, so aws_iam_role.x[local.k].Owner is
      refused; all fifteen indexed addresses on main declare one); the legacy attribute splat (aws_iam_role.x.*); and,
      for a row that sets refused_attributes, any resource or data traversal that does not continue,
      after its optional instance key or splat, to a named attribute (a whole-object, bare-instance or splat-only
      reference such as jsonencode(aws_lambda_function.x), aws_iam_role.x[0], one(aws_iam_role.x[*]) or
      aws_iam_role.x["tags_all"]), except inside depends_on, replace_triggered_by and the to or from of import, moved
      and removed blocks, and except as the source of a for-expression whose value iterator is used only as
      <iterator>.<named attribute> outside refused_attributes (main's agent_ducklake_api.tf:207-208 and
      agent_session_user.tf:10 iterate resource collections that way). No allowance (instance key, for source,
      depends_on, block address) ever admits a refused_references root. All of it applies inside a string interpolation
      too. Before the rules land, the build re-runs the simulation (dataclasses.replace(policies.default(), ...) with
      scope row 6's lists, then screen_tree over terraform/bootstrap) and records that only meta_argument findings remain
      before rule 3 and none after. (2b) unlisted_import: for a row that
      sets allowed_imports, an import block whose id is not a quoted string literal without interpolation (the existing
      _import_id_ok also admits a bare var.repository_name) or whose (to, id) pair is not in allowed_imports. (3) meta_argument (amended for meta_argument_locals rows): count or
      for_each in a resource or data block is allowed when every traversal on its right side is local.<n> with n a
      literal local or (for for_each only) a literal-keyed local, or a for-expression's own iterator; a literal-keyed
      local is a map literal, or a map literal of map literals indexed by var.environment, whose keys are all literal
      strings and whose values rule 2 already governs (agent_ducklake_api.tf's ducklake_api_routes, whose
      telemetry/content value is a resource attribute, is one); a literal local is defined exactly once in the tree (main-only
      files included, since their text is main's) by an expression whose only traversals are var.environment and other
      literal locals (fixpoint), with no resource, data, path, each, count or self reference; the existing rule
      stays for other rows. backstop: for a meta_argument_locals row, a resource whose count_expression or
      for_each_expression references only local.* traversals is not refused (the text rule is the real gate; plan JSON
      carries no locals). Measured at build, each file under 500 SLOC.
    new_imports: [scripts.ci.terraform_hcl_screen_rules]
  - file: scripts/ci/terraform_hcl_screen_rules.py
    action: Create
    purpose: >-
      BUILD PR 2. Stdlib only, imported as scripts.ci.terraform_hcl_screen_rules through the same _ROOT sys.path line the screen
      uses for the lexer and the policy module. The four
      row-gated rules the previous row specifies (secret_data_shape, confidential_reference with its refused-attribute,
      data-attribute, self, index and splat parts, unlisted_import, the literal-local and literal-keyed meta_argument
      rule), each a pure function over the lexed tree and the Policy row returning findings in the existing
      (rule, file, line) shape. Under 400 SLOC.
    new_imports: [scripts.ci.terraform_hcl_lexer, scripts.ci.terraform_hcl_screen_policy]
  - file: scripts/ci/terraform_bootstrap_plan_report.py
    action: Create
    purpose: >-
      BUILD PR 2. Stdlib only, python3 -I, no network. CLI: --category, --head-sha, --run-url and either --refusal-file
      (overlay.txt or screen.txt; for ASSUME_FAILED neither is read) or --preview-file, --analyzer-file, --analyzer-json and --gate-output. Prints a Markdown comment: a header
      naming terraform/bootstrap, the head sha and the run; for a refusal only the rule and file:line tokens of OVERLAY_REFUSED, REFUSED and the gate screen's
      SCREEN_REFUSED <rule> <file>:<line> lines, and the bare rule of a token-less REFUSED root_policy_mismatch or
      unknown_root line (never text from the PR beyond those tokens' file names); the ANALYZER_SUMMARY verdict and mode words
      when the analyzer ran; else a names-only table rebuilt from the
      gate's preview table: Resource, Action, Changed attributes, Flags (the bracketed Sid list dropped), Analyzer (the
      verdict word or FAIL and the check name, the loc token dropped) and Protected; the Allow actions gained and
      Resources cells are never printed, since unreviewed HCL authors those values (Decision 238 cl.4); a cell whose text
      fails its name grammar (the normalised, key-free Terraform address form plan_names_core.normalise_address yields,
      with the gate's optional " (xN)" group-count suffix, so any [..] instance key prints as "?", Decision 238 cl.4; lower-snake attribute names; the fixed flag,
      verdict and protected-reason words) prints as "?"; then the BOOTSTRAP_APPLY_PREVIEW line and the analyzer's
      ANALYZER lines reduced to address, check and verdict, each address rebuilt through plan_names_core.normalise_address
      from analyzer.json's address field, never the stdout token (the analyzer's _safe() form keeps a literal instance
      key, which 238 cl.4 keeps out of PR-visible output), with every line starting "::" dropped; a one-line note that
      CLOUDSHELL_REQUIRED means the merged change goes to the operator's CloudShell apply and is not a refusal of the PR;
      last line exactly "BOOTSTRAP_PR_PLAN category=<C> verdict=<V> rows=<N> head=<sha>" (V NONE and N 0 when no preview
      ran; V and N from gate.out and the preview line). For INIT_FAILED, PLAN_FAILED, BACKSTOP_REFUSED, ANALYZER_FAILED
      and GATE_FAILED it reads no preview, analyzer-json or gate file at all, present or absent, and at most the
      ANALYZER_SUMMARY line of analyzer.txt (other lines ignored); it prints V NONE and N 0 and exits 0, as
      terraform_personal_plan_report.py renders its failure categories without the plan. It exits 2, printing only the
      file's role, only for OK or ANALYZER_REFUSED with a preview, analyzer or gate file missing or malformed; the
      workflow maps ANALYZER_REFUSED with gate.out absent (the gate crashed after a refusal) to GATE_FAILED before calling
      it, so that exit 2 never suppresses a comment. plan_names_core is loaded as
      terraform_personal_plan_report.py loads it (the _ROOT sys.path append, never an insert at 0, with its is_relative_to
      check), so validate_trusted_plan_environment's import-closure rule covers it. Under 200 SLOC.
    new_imports: [scripts.ci.plan_names_core]
  - file: scripts/ci/provider_mirror_seed.sh
    action: Modify
    purpose: >-
      BUILD PR 2. Also init terraform/bootstrap with -backend=false -input=false -lockfile=readonly and mirror its
