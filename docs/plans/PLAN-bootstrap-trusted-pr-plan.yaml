      on TRUSTED_WORKFLOWS unless it polices pull_request_target workflows. Measured at most
      456 SLOC.
    new_imports: []
  - file: scripts/checks/ci_guards/_trusted_plan_role_partition.py
    action: Modify
    purpose: >-
      BUILD PR 2. BOOTSTRAP_WORKFLOW = "terraform-bootstrap-plan.yml" and BOOTSTRAP_ROLE = "bootstrap-pr-plan": the
      bootstrap workflow assumes only BOOTSTRAP_ROLE, and no other workflow assumes it (the module compares the
      role-to-assume's last path segment exactly, so bootstrap-preview stays validate_bootstrap_apply's).
    new_imports: []
  - file: scripts/checks/verification/validate_admin_root_premerge_gate.py
    action: Modify
    purpose: >-
      BUILD PR 2. TRUSTED_MARKERS = ("terraform-bootstrap-plan.yml", "BOOTSTRAP_PR_PLAN"). When every in-scope admin-root
      file is under terraform/bootstrap and its basename is outside the bootstrap screen row's main_only_files (read from
