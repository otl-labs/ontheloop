      test module, so --pre selection is unchanged.
  - file: tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
    action: Modify
    purpose: >-
      BUILD PR 1. _SCANNED_BOOTSTRAP_FILES gains _BOOTSTRAP_DIR / "bootstrap_pr_plan.tf" (the new CI identity is scanned
      for IAM leaks, Decision 225 cl.5); the unscanned mapping is imported from tests/fixtures/bootstrap_leak_scan.py
      under its old local name. No assertion changes. Net SLOC at most 491. Kept graduated record (asserts unchanged):
      platform-admin-absent-from-ci-write-patterns, whose node is this file.
  - file: .github/workflows/terraform-bootstrap-plan.yml
    action: Create
    purpose: >-
      BUILD PR 2. Header comment (Decision {{N}}, Decision 238; the PR is data, never steps; advisory, never a required
      check; never workflow_call; validate_trusted_plan_environment polices it). on: pull_request_target types [opened,
      synchronize, reopened], paths terraform/bootstrap/**; permissions: {}; concurrency per PR number with
      cancel-in-progress. One job plan: if same-repo head, base main and github.event.pull_request.user.login not
      dependabot[bot]; ubuntu-latest; timeout 20; environment {name: tf-trusted-plan, deployment: false}; permissions
      contents read, id-token write, pull-requests write; env PR_NUMBER, HEAD_SHA, TF_VAR_aws_profile "", TF_IN_AUTOMATION
      1, TF_INPUT 0, MASK_AWS_ROLE_ID_ACCOUNT_PART. Steps, every action SHA-pinned to the pin terraform-plan-trusted.yml
      uses: checkout (persist-credentials false); ./.github/actions/aws-region; overlay (OVERLAY_ROOT=terraform/bootstrap
      python3 -I scripts/ci/trusted_plan_overlay.py, tee overlay.txt); the generic screen (python3 -I
      scripts/ci/terraform_hcl_screen.py screen --root terraform/bootstrap --policy terraform/bootstrap, tee screen.txt,
      since a root with a row of its own is refused as root_policy_mismatch under the default row); the bootstrap gate's own
      screen (python3 -I scripts/ci/terraform_bootstrap_apply_gate.py screen, appended to screen.txt); only then assume
      role/bootstrap-pr-plan (configure-aws-credentials, role-session-name tf-bootstrap-pr-plan); pinned terraform
      version and setup-terraform (wrapper off); mirror sync of the hashicorp/aws prefix only (aws s3 sync of
      s3://agent-platform-data-lake/tf-provider-mirror/registry.terraform.io/hashicorp/aws/ to
      "$RUNNER_TEMP/tf-mirror/registry.terraform.io/hashicorp/aws", with no --exclude or --include: the CLI lists with the
      source key as its prefix, which the role's s3:prefix condition admits, while the terraform/github form lists
      tf-provider-mirror/ and filters client-side); hermetic init inline through quiet_run.sh (terraform -chdir=terraform/bootstrap
      init -input=false -plugin-dir="$RUNNER_TEMP/tf-mirror" -get=false -lockfile=readonly
      -backend-config="region=$AWS_REGION"; terraform-init-retry is not used: its default backend file is
      terraform/personal's and its second step is the Neon key preflight this root does not need); plan through
      trusted_plan_env.sh and quiet_run.sh (terraform -chdir=terraform/bootstrap plan -lock=false -input=false -no-color
      -out=plan.bin); show -json to a private file through quiet_run.sh; rm plan.bin in the same step; backstop
      (terraform_hcl_screen.py backstop --plan-json, --policy terraform/bootstrap); the analyzer (--plan-json, --invariants
      config/iam-invariants.json, --event-name pull_request_target, --out analyzer.json, stdout to analyzer.txt; exit 1, its
      REFUSED verdict, recorded as ANALYZER_REFUSED whatever the gate's verdict, so a protected change the analyzer
      refuses still fails the job; exit 2 recorded as ANALYZER_FAILED); the gate preview (--plan-json, --analyzer-json, --github-output
      "$RUNNER_TEMP/gate.out", --event-name pull_request_target, stdout to preview.md; exit 0, or exit 1 with
      verdict=CLOUDSHELL_REQUIRED or ANALYZER_REFUSED in gate.out, is a planned verdict; any other exit 1 is
      GATE_FAILED); the category is the first of OVERLAY_REFUSED, SCREEN_REFUSED, INIT_FAILED, PLAN_FAILED,
      BACKSTOP_REFUSED, ANALYZER_FAILED, ANALYZER_REFUSED and GATE_FAILED that applies, else OK; the comment step
      (if !cancelled() and the overlay step ran): the category from the step outcomes, the body from
      terraform_bootstrap_plan_report.py run under trusted_plan_env.sh --scrub-only, redaction_check.py assert-clean
      under the same wrapper, then gh pr comment; a final step fails the job unless the category is OK; an always() step deletes plan.bin, plan.json, analyzer.*, gate.out and preview.md. No step
      persists or uploads a plan, plan JSON or log, no LLM step, no workflow_call, and no run body interpolates a
      PR-controlled expression (PR_NUMBER and HEAD_SHA reach run bodies as env only).
  - file: scripts/ci/terraform_hcl_screen_policy.py
    action: Modify
    purpose: >-
      BUILD PR 2. Policy gains five fields, each defaulted so the personal and github rows and the bootstrap gate's
      dataclasses.replace(default(), ...) are unchanged: secret_metadata_names (frozenset[str], default empty),
      refused_references (frozenset[str], default empty), refused_import_ids (frozenset[str], default empty),
      refused_attributes (frozenset[str], default empty) and meta_argument_locals (bool, default False). A third row
      _BOOTSTRAP: root terraform/bootstrap; main_only_files main.tf, .terraform.lock.hcl, backend-sit.hcl,
      authority_budget.json, variables.tf, platform_roles.tf, platform_admin_policies.tf, platform_admin_data_policies.tf,
      platform_security_heartbeat_canary.tf (today's try() forms and the heredoc are in the last three); data_types
      aws_iam_policy_document and aws_secretsmanager_secret; secret_metadata_names agent-platform-terraform-github-apply-app,
      agent-platform-deepseek-api-key and agent-platform-anthropic-api-key (the lookups outside main-only files today);
      resource_types today's 34 (aws_api_gateway_account, _deployment, _integration, _method, _method_settings, _resource,
      _rest_api, _rest_api_policy, _stage, aws_cloudtrail, aws_cloudwatch_log_group, aws_cloudwatch_log_metric_filter,
      aws_cloudwatch_metric_alarm, aws_iam_policy, aws_iam_role, aws_iam_role_policy, aws_iam_role_policy_attachment,
      aws_iam_user, aws_iam_user_policy_attachment, aws_lambda_function, aws_lambda_permission, aws_s3_bucket and its
      _lifecycle_configuration, _ownership_controls, _policy, _public_access_block, _server_side_encryption_configuration
      and _versioning, aws_scheduler_schedule, aws_scheduler_schedule_group, aws_secretsmanager_secret_policy,
      aws_servicequotas_service_quota, aws_sfn_state_machine, aws_ssm_parameter); functions the eleven used outside main-only
      files today (concat, flatten, jsondecode, jsonencode, keys, length, one, sha1, sort, split, toset) plus regex and
      can, which validation_only_functions confines to validation blocks; no try and no file; validation_only_functions regex and can; file_paths empty; top_level_blocks
      resource, data, locals, variable, output, moved, removed, import; backstop_providers aws; imports_allowed true with
      import_id_vars empty (quoted string literal ids only: scope row 7's rule 2b, since the existing _import_id_ok also admits a bare var.X); refused_references var.platform_dev_external_id,
      var.platform_admin_external_id, var.owner_email, aws_iam_role.platform_dev and aws_iam_role.platform_admin (the role
      roots admitting only .arn, .name and .id); refused_import_ids PlatformDev and PlatformAdmin, compared casefolded since IAM
      role names are case-insensitive (an import of either role to a second address would carry its trust document, Decision 225 cl.1; their inline-policy ids such as
      PlatformDev:DailyOps stay allowed, that text is already public HCL); refused_attributes tags_all (main.tf's
      default_tags put the owner address on every resource); meta_argument_locals true; config_files empty. The build re-derives each
      list from main's tree on its day and records any difference in the PR body.
  - file: scripts/ci/terraform_hcl_screen.py
    action: Modify
    purpose: >-  # pragma: allowlist secret
      BUILD PR 2. Four rules, active only for a row that sets the field, so the personal and github screens behave as
      today. (1) secret_data_shape: a data "aws_secretsmanager_secret" block whose body is anything but one line name =
      "<literal>" with the literal in secret_metadata_names. (2) confidential_reference: a traversal var.X or
      resource.name.attr in a screened file whose root is in refused_references, except .arn, .name and .id on the two
      role roots; any resource or data traversal whose attribute, named or string-indexed, is in refused_attributes
      (tags_all); and, for a row that sets refused_attributes, any resource or data traversal that does not continue,
      after its optional instance key or splat, to a named attribute (a whole-object, bare-instance or splat-only
      reference such as jsonencode(aws_lambda_function.x), aws_iam_role.x[0], one(aws_iam_role.x[*]) or
      aws_iam_role.x["tags_all"]), except inside depends_on, replace_triggered_by and the to or from of import, moved
      and removed blocks, and except as the source of a for-expression whose value iterator is used only as
      <iterator>.<named attribute> outside refused_attributes (main's agent_ducklake_api.tf:207-208 and
      agent_session_user.tf:10 iterate resource collections that way); inside a string interpolation too. (2b) refused_import_id: for a row that
      sets refused_import_ids, an import id that is not a quoted string literal without interpolation (the existing
      _import_id_ok also admits a bare var.X, which would carry any default) and a literal id that, casefolded, equals a
      casefolded refused_import_ids entry. (3) meta_argument (amended for meta_argument_locals rows): count or
      for_each in a resource or data block is allowed when every traversal on its right side is local.<n> with n a
      literal local or (for for_each only) a literal-keyed local, or a for-expression's own iterator; a literal-keyed
      local is a map literal, or a map literal of map literals indexed by var.environment, whose keys are all literal
      strings and whose values rule 2 already governs (agent_ducklake_api.tf's ducklake_api_routes, whose
      telemetry/content value is a resource attribute, is one); a literal local is defined exactly once in the tree (main-only
      files included, since their text is main's) by an expression whose only traversals are var.environment and other
      literal locals (fixpoint), with no resource, data, path, each, count or self reference; the existing rule
      stays for other rows. backstop: for a meta_argument_locals row, a resource whose count_expression or
      for_each_expression references only local.* traversals is not refused (the text rule is the real gate; plan JSON
      carries no locals). Measured at build; if the file passes 500 SLOC the four rules move to a sibling
      scripts/ci/terraform_hcl_screen_rules.py by a scope amendment.
