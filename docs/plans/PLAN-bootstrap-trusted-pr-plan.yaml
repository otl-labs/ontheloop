      terraform config/aws-region config/terraform-version 2>> "$L" | LC_ALL=C sort | tr '\n' ' '); X=$(git -C "$W/repo"
      diff HEAD^ HEAD -- 'terraform/*.tf' 2>> "$L" | grep -E '^\+' | grep -cE 'data "(external|http)"|provider
      "|required_providers|module "|provisioner|local-exec|^\+\s*(data|import|removed|check|terraform)\b'); [ "$F" =
      "terraform/bootstrap/bootstrap_pr_plan.tf " ] && [ "$X" = 0 ] || { echo SCREEN_REFUSED; exit 1; }; echo SCREEN_OK;
      R=$(tr -d '[:space:]' < "$W/repo/config/aws-region"); export AWS_REGION="$R" AWS_DEFAULT_REGION="$R"; V=$(tr -d
      '[:space:]' < "$W/repo/config/terraform-version"); case "$(uname -m)" in aarch64) P=linux_arm64 ;; *)
      P=linux_amd64 ;; esac; Z="terraform_${V}_${P}.zip"; { curl -fsSL -o "$W/$Z"
      "https://releases.hashicorp.com/terraform/$V/$Z" && curl -fsSL -o "$W/sums"
      "https://releases.hashicorp.com/terraform/$V/terraform_${V}_SHA256SUMS" && ( cd "$W" && grep " $Z\$" sums |
      sha256sum -c --quiet - ) && unzip -qo "$W/$Z" -d "$W/bin"; } >> "$L" 2>&1 || { echo TERRAFORM_INSTALL_FAILED; exit
      1; }; export PATH="$W/bin:$PATH"; command -v jq > /dev/null || { echo JQ_ABSENT; exit 1; }; aws ssm get-parameter
      --name /secret/agent-platform-terraform-personal-tfvars --with-decryption --query Parameter.Value --output text >
      "$W/vars.tfvars" 2>> "$L" && test -s "$W/vars.tfvars" || { echo TFVARS_ABSENT; exit 1; }; A=$(aws sts
      get-caller-identity --query Account --output text 2>> "$L"); test -n "$A" || { echo IDENTITY_FAILED; exit 1; };
      B="$W/repo/terraform/bootstrap"; terraform -chdir="$B" init -input=false -lockfile=readonly
      -backend-config="region=$R" > /dev/null 2>> "$L" || { echo INIT_FAILED; exit 1; }; terraform -chdir="$B" plan
      -input=false -no-color -var-file="$W/vars.tfvars" -var "account_id=$A" -var "aws_profile=" -out="$W/apply.bin" >
      "$W/plan.txt" 2>> "$L"; S=$(grep -E '^Plan: ' "$W/plan.txt"); echo "$S"; G=$(terraform -chdir="$B" show -json
      "$W/apply.bin" 2>> "$L" | jq -r '.resource_changes[] | select(.change.actions != ["no-op"]) | .address' | LC_ALL=C sort |
      tr '\n' ' '); [ "$S" = "Plan: 6 to add, 0 to change, 0 to destroy." ] && [ "$G" = "aws_iam_policy.bootstrap_pr_plan_guard
      aws_iam_policy.bootstrap_pr_plan_reads aws_iam_role.bootstrap_pr_plan aws_iam_role_policy_attachment.bootstrap_pr_plan_guard
      aws_iam_role_policy_attachment.bootstrap_pr_plan_reads aws_iam_role_policy_attachment.bootstrap_pr_plan_shared_reads " ]
      || { echo APPLY_SKIPPED; exit 1; }; terraform -chdir="$B" apply -input=false -no-color "$W/apply.bin" > /dev/null
      2>> "$L" && echo APPLY_DONE || { echo APPLY_FAILED; exit 1; }; terraform -chdir="$B" plan -lock=false -input=false
      -no-color -detailed-exitcode -var-file="$W/vars.tfvars" -var "account_id=$A" -var "aws_profile=" > /dev/null 2>>
      "$L"; echo "REPLAN_EXIT $?"; P="arn:aws:iam::$A:role/bootstrap-pr-plan"; sim() { aws iam
      simulate-principal-policy --policy-source-arn "$P" --action-names "$2" --resource-arns "$3" "${@:4}" --query
      'EvaluationResults[0].EvalDecision' --output text 2>> "$L" | sed "s/^/SIM $1 /" || echo "SIM $1 ERROR"; }; sim
      mirror_read s3:GetObject "arn:aws:s3:::agent-platform-data-lake/tf-provider-mirror/registry.terraform.io/hashicorp/aws/x";
      sim state_read s3:GetObject "arn:aws:s3:::agent-platform-bootstrap-tfstate/terraform.tfstate"; sim tfvars_read
      ssm:GetParameter "arn:aws:ssm:$R:$A:parameter/secret/agent-platform-terraform-personal-tfvars"; sim analyzer
      access-analyzer:ValidatePolicy '*'; sim mirror_list s3:ListBucket "arn:aws:s3:::agent-platform-data-lake"
      --context-entries
      "ContextKeyName=s3:prefix,ContextKeyValues=tf-provider-mirror/registry.terraform.io/hashicorp/aws/,ContextKeyType=string";
      sim other_list s3:ListBucket "arn:aws:s3:::agent-platform-data-lake" --context-entries
      "ContextKeyName=s3:prefix,ContextKeyValues=tfstate/,ContextKeyType=string"; sim state_write s3:PutObject
      "arn:aws:s3:::agent-platform-bootstrap-tfstate/terraform.tfstate"; sim other_object s3:GetObject
      "arn:aws:s3:::agent-platform-data-lake/tfstate/x"; sim iam_write iam:CreatePolicy
      "arn:aws:iam::$A:policy/agent-platform-sim-probe"; aws iam get-role --role-name bootstrap-pr-plan --query
      'Role.AssumeRolePolicyDocument.Statement[0].Condition.StringEquals."token.actions.githubusercontent.com:job_workflow_ref"'
      --output text 2>> "$L" | sed 's/^/TRUST_REF /'; aws iam get-role --role-name bootstrap-pr-plan --query
      'Role.PermissionsBoundary' --output text 2>> "$L" | sed 's/^/BOUNDARY /'; echo "M $M" )
    expected: >-
      SCREEN_OK; Plan: 6 to add, 0 to change, 0 to destroy.; APPLY_DONE; REPLAN_EXIT 0; SIM mirror_read allowed; SIM
      state_read allowed; SIM tfvars_read allowed; SIM analyzer allowed; SIM mirror_list allowed; SIM other_list implicitDeny; SIM state_write explicitDeny; SIM other_object
      explicitDeny; SIM iam_write explicitDeny; TRUST_REF
      otl-labs/ontheloop/.github/workflows/terraform-bootstrap-plan.yml@refs/heads/main; BOUNDARY None; M.
    fix_if: >-
      SCREEN_REFUSED or a setup line: nothing initialised; as VP 8. APPLY_SKIPPED: nothing applied; stop and report the
      summary. APPLY_FAILED or REPLAN_EXIT 2: report the error class in words; a partial apply is finished by a plan
      amendment's CloudShell block, never by -target. A SIM line other than expected: the reads policy or the guard is
      wrong; a plan amendment and a reviewed bootstrap change before PR 2 merges. A SIM ERROR: the aws CLI rejected the
      call shape; the operator gives the error class in words and the build amends the block. PR 2 does not merge until
      this step passes.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      BUILD PR 2. PR 2's merge push starts terraform-bootstrap-apply.yml (its push paths include
      scripts/ci/terraform_hcl_screen.py and terraform_hcl_screen_policy.py); the build reads the run back to show the
      post-merge preview and the gate's own screen are unchanged by the new Policy fields.
    command: >-
      mcp__github__actions_list(owner="otl-labs", repo="ontheloop", method="list_workflow_runs",
      resource_id="terraform-bootstrap-apply.yml") for the merge sha, then mcp__github__actions_get and get_job_logs for
      its preview job
    expected: >-
      The preview job concludes success; its screen step exits 0; its analyzer step prints ANALYZER_SUMMARY verdict=PASS
      mode=changed; BOOTSTRAP_APPLY_PREVIEW prints NO_CHANGES, or the verdict and rows of whatever bootstrap change is
      merged and unapplied at the time (named in the build's report); the apply job is skipped unless a REVIEWABLE change
      is pending.
    fix_if: >-
      A screen refusal on main's tree: the Policy defaults changed the gate's screen; fix on a branch at once (PR 2's
      revert if the fix is not immediate) and file a rec. Any other failure: read the step's token lines and report to
      the coordinator; a digit run or ARN in the logs is a Decision 101 leak: revert PR 2 and file a rec.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      BUILD PR 2. First live run of terraform-bootstrap-plan.yml on a probe PR. After PR 2 merges the build restarts its
      branch from main and opens a PR with three commits pushed one at a time, each after the previous run's comment
      appears: (a) one comment line added to terraform/bootstrap/github_ci_apply_reads.tf; (b) one comment line added to
      terraform/bootstrap/variables.tf; (c) commit (b) reverted and a locals block probe_owner = var.owner_email added to
      github_ci_apply_reads.tf. The build reads each run and comment back, then closes the PR unmerged. The probe changes
      no live resource: the job only plans.
    command: >-
      mcp__github__actions_list(owner="otl-labs", repo="ontheloop", method="list_workflow_runs",
      resource_id="terraform-bootstrap-plan.yml") for each head sha, mcp__github__get_job_logs for its plan job, and
      mcp__github__pull_request_read(method="get_comments") on the probe PR; then mcp__github__update_pull_request(state="closed")
    expected: >-
      (a) the job passes; its overlay, both screens, init, plan, backstop (BACKSTOP_OK), analyzer and gate steps succeed;
      the comment's last line is BOOTSTRAP_PR_PLAN category=OK verdict=V rows=N head=<sha of (a)> where V and N equal the
      most recent main preview's BOOTSTRAP_APPLY_PREVIEW verdict and rows (NO_CHANGES rows=0 when nothing is pending), and
      the analyzer lines include ANALYZER_SUMMARY verdict=PASS mode=changed. (b) the comment ends BOOTSTRAP_PR_PLAN
      category=OVERLAY_REFUSED verdict=NONE rows=0 and names main_only_file_changed variables.tf; the credentials step
      did not run; the job fails. (c) the comment ends BOOTSTRAP_PR_PLAN category=SCREEN_REFUSED verdict=NONE rows=0 and
      names confidential_reference github_ci_apply_reads.tf; the credentials step did not run; the job fails. No comment
      or analyzer, gate or report log line matches redaction_check.ACCOUNT_ID_SHAPE or holds "arn:" (the head sha is
      token-bounded hex, so no false positive). The PR is closed unmerged.
    fix_if: >-
      (a) INIT_FAILED: the mirror lacks the locked hashicorp/aws package or the role cannot read it; dispatch
      terraform-provider-mirror-seed.yml (scope row 9) and re-push, or a plan amendment if the read is denied. PLAN_FAILED (the
      job prints no diagnostic by design, quiet_run.sh keeps it in the runner's never-printed log): the operator runs
      deploy-paths' CloudShell pre-merge plan at the same head, and an AccessDenied there is a plan-time read the shared
      policy lacks (the same gap would fail the post-merge
      preview); file a rec and fix both roles through the shared policy, a protected CloudShell change. BACKSTOP_REFUSED
      provisioner_or_meta_argument: the plan JSON's meta-argument references differ from the backstop's reading; a plan
      amendment, never a weaker text rule. (b) or (c) passing: the overlay or the screen did not refuse; revert PR 2's
      workflow (disable it) at once, file a rec and re-decide (Decision {{N}} reversal condition screen-miss). A digit run
      or ARN in any comment: delete the comment, disable the workflow, file a rec (Decision 101).
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: BUILD PR 2. The bundled recs closed on PR 2's merge (Resolves trailer).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows,_=fetch_recs_by_ids(make_reader(),['rec-5168','rec-5195','rec-4349']);
      s={r['id']:r['status'] for r in rows}; print(s); assert s=={'rec-5168':'closed','rec-5195':'closed','rec-4349':'closed'}, s"
    expected: All three statuses closed (a missing row fails the assertion).
    fix_if: >-
      Open: read the closure job log; an acceptance failure means the governed words or the screen test's node name
      differ from the stored acceptance; fix forward, never rewrite a rec's acceptance to pass.
    hermetic: false
    graduation: not-applicable
