execution_steps:
  - "BUILD PR 1. Tests first (rows 2-4), seen red on the unchanged tree; then bootstrap_pr_plan.tf (row 1). Post: VP 1-2 pass; VP 3; push; PR."
  - "BUILD PR 2, on its own branch from main (no dependency on PR 1's files). Tests first (rows 15, 25-34 and 35), seen red; then the policy row, the screen and the rules (rows 6-8), the report (row 9), the workflow (row 5), the seed script, the fences, the gate check and the manifests (rows 10-14, 16-17), the taxonomy row and CODEOWNERS (rows 18-19); the r3_workflows entries (row 36), measured after row 5 is final and
