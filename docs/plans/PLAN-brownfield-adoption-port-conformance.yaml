    E1 -- file_rec({title: Seed ports.yaml structural_assumptions from hard-coded repo-path and AWS-identity assumptions in scripts/executor and src, file: docs/contracts/ports.yaml, status: open, effort: S, priority: Medium, tags: [ports, decision-211, decision-212, t4-24], context: 'Bounded one-shot sweep owed by Decisions 211 clause 2 and 212 (PLAN-brownfield-adoption-port-conformance). The otl init specification (T4.24 c9) is derived from docs/contracts/ports.yaml structural_assumptions, which ships empty. Search scripts/executor/ and src/ for assumptions the loop makes about the repository it runs on -- hard-coded repository paths (docs/ROADMAP-PLATFORM.yaml, docs/DECISIONS.md, docs/plans/, the logs/ read caches, config/agent/ prompt roots) and AWS identity (a named profile such as agent_platform, a fixed region, the SigV4 Function URL transport) -- and record each distinct assumption as one SA-NN row (assumption, location naming an existing repo path, status open, owning_item T4.24) that validate_ports_contract accepts. A plan-time survey found about twenty files with repo-path literals and twelve with AWS-identity assumptions; group by assumption, not by file. The eight example categories above are a floor, not the target: record every distinct assumption found, and keep the real contract passing validate_ports_contract. Standing recording stays with T4.23 c15, T4.24 c9 and the AGENTS.md trigger; this rec is the seed only.', acceptance: 'test "$(grep -c ''^  - id: SA-'' docs/contracts/ports.yaml)" -ge 8 && bin/venv-python -m pytest tests/checks/contracts/test_validate_ports_contract.py::test_real_contract_passes -q'})
