schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: brownfield-adoption-port-conformance
intent: Persist the operator-approved brownfield adoption model and port-conformance model as Decisions 211 and 212, give the port
  model a schema-checked sole registry (docs/contracts/ports.yaml, evaluated by a new validate_ports_contract check, its coupling
  threshold a registered Decision 133 predicate), add the exit criteria that carry both into T4.2, T4.19, T4.23 and T4.24, park the
  marketing follow-ons as deferred SEMANTO items, and file three owning recommendations -- so the free-tier and init work (Decision
  184 clause 2, T4.22-T4.24) is built against recorded, enforced commitments rather than this repository's implicit structure.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-brownfield-adoption-port-conformance.yaml
phase: 'user_explicit_out_of_scope (soft-warn category): no tier_item is claimed and no exit criterion is closed. The plan ADDS open
  criteria to T4.19 and to T4.2''s new c14 (both live, not_started; ROADMAP-PLATFORM.yaml scope row) and to T4.23/T4.24
  (deferred_post_mvp), adds three deferred_post_mvp SEMANTO items, and adds no depends_on edge from a live item, so Decision 93''s
  no-live-dependency-on-a-parked-item rule is untouched. T4.2 is CD.27-gated, so this plan carries the fallback_reevaluation block
  below. Freshness gate run against every touched item (T4.2/T4.19/T4.23/T4.24): no silent completion (every criterion open), no
  stale reference in the criteria touched (docs/contracts/executor-loop-definition.yaml is T4.19''s own # new file); nothing to
  close out.'
fallback_reevaluation:
  reevaluated_on: '2026-10-06'
  substrate_status: CD.27 pending; layer 2 unratified; T4.15 unrun; long_running_container presumptive per Decision 205 cl.6
  verdict: continue_on_current_substrate
  basis: criteria text and registry rows only; T4.2 c14 binds identically under every pinned candidate; fargate registered
    experimental/pending under T4.15; forms no substrate evidence and pre-empts no T4.15 ruling
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: 'Insert Decision 212 then Decision 211 (verbatim, execution step 3, the E5 rec id substituted) above Decision 210, and
    append the dated ''Amended by Decision 212'' blockquotes to Decision 184 and Decision 197 that validate_supersession_annotations
    requires for the envelope amends: [184, 197] edges.'
- file: docs/contracts/ports.yaml
  action: Create
  purpose: 'Class D contract (ratified via Decision 212), the sole port registry: twelve ports with required verbs and their settled/provisional
    status, adapters and tiers, oracle or recorded oracle gap, conformance-suite owner; coupling_findings seeded PC-01..PC-04 (all
    accepted); empty structural_assumptions; ambient_trigger AGENTS.md. Evaluator {check: validate_ports_contract}.'
- file: scripts/checks/contracts/validate_ports_contract.py
  action: Create
  purpose: Schema and cross-reference evaluator for ports.yaml (execution step 6), incl. the run_persona / inference-provider.yaml
    persona_backend cross-check (rule h); the contract's resolving evaluator.
- file: scripts/checks/contracts/_manifest.py
  action: Modify
  purpose: Register validate_ports_contract as a pre=True Entry with diff-gated pre_globs (execution step 7).
- file: tests/checks/contracts/test_validate_ports_contract.py
  action: Create
  purpose: 'Mirror test: real-tree positive plus one negative fixture per rule (execution step 8).'
- file: scripts/preflight/decision_conditions.py
  action: Modify
  purpose: 'Register the ports_open_coupling_findings_exceed predicate so Decision 212''s coupling-findings-exceed-ten condition
    is a mechanical kind: repo_state condition (F12; execution step 9).'
- file: tests/test_decision_condition_predicates.py
  action: Modify
  purpose: Add TestPortsOpenCouplingFindings for the new predicate (execution step 9).
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: 'Classify the new check (validate_ports_contract: schema_drift, beside validate_inference_provider_registry) so validate_ci_rca_taxonomy''s
    every-registered-check-classified rule holds.'
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: Add the `ports` route (topic equals the contract subject) and the one-line amendment_log entry validate_contract_drift
    requires; 490 + 3 + 1 = 494 effective lines, under the 500 contracts limit.
- file: AGENTS.md
  action: Modify
  purpose: Add the one-line Safety trigger naming docs/contracts/ports.yaml, paid for by deleting the Merge-protocol 'Canonical authority'
    line that duplicates the Git-ops procedure pointer (net -6 bytes; S1 headroom is 1 byte).
- file: docs/contracts/git-ops.yaml
  action: Modify
  purpose: Re-point merge_protocol_note and contract.description, which name the deleted AGENTS.md line, with a one-line amendment_log
    entry (496 -> 497 effective lines, under 500).
- file: config/prose_budgets.yaml
  action: Modify
  purpose: Ratchet S1 root_ambient_load_set DOWN to the measured post-edit size (a decrease is always permitted).
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: Add open criteria T4.2 c14, T4.19 c6, T4.23 c15-c16 and T4.24 c9-c14; append 212 (T4.2, T4.19, T4.23) and 211, 212 (T4.24)
    to related_decisions; reword T4.19's executor-loop-definition.yaml files_in_scope comment so it names no second port registry
    (the one named exception to 'touch nothing else'). No status, depends_on or existing-criterion change.
- file: docs/ROADMAP-SEMANTO.yaml
  action: Modify
  purpose: Add deferred_post_mvp items S1.7-S1.9 (experiment protocol, maintenance-fork subject, positioning note) in RoadmapDocument
    shape -- the deliberate-deferral routing for the former recs E2-E4.
- file: docs/plans/PLAN-brownfield-adoption-port-conformance.yaml
  action: Create
  purpose: This plan artefact.
bundled_recommendations: []
followon_recs: [rec-4191, rec-4192, rec-4193]
closes_criteria: []
infrastructure_dependencies:
- 'LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition: scripts.lambda_manifest.compute_affected_artifacts(<this
  plan''s scope>) returns {''data-pipeline'': [''docs/ROADMAP-PLATFORM.yaml'']} because the roadmap is a packaged asset of the active
  data-pipeline artifact (src/lambdas/data-pipeline/manifest.yaml). No build, deploy or smoke-test is owed: the edit is asset-only
  criteria bookkeeping with no packaged code change, and the asset refreshes with the artifact''s next governed deploy. V2 stands,
  following PLAN-work-item-pilot-candidate-decision.yaml and PLAN-terraform-cicd-drift-detection.yaml. No other scope file is Lambda-packaged.
  Operator sign-off 2026-10-06 (round-2 scout NOTE on Decision 79): this precedent-based asset-only disposition is accepted; codifying
  an asset-only exemption in Decision 79''s gating is a candidate follow-on, not filed and not widened here.'
acceptance_criteria:
- Decisions 211 and 212 exist in docs/DECISIONS.md with the verbatim text of execution step 3 (E5's rec id the only substitution),
  each under the 6144-byte per-entry cap (plan-time 5140 and 6105 bytes), conformant to decision-entry.yaml (envelope with significance),
  with reversal-conditions stanzas that scripts.preflight.decision_conditions parses and 212's coupling condition bound to a registered
  predicate (VP steps 6, 7 and 12).
- Decisions 184 and 197 carry the dated 'Amended by Decision 212' blockquotes and validate_supersession_annotations passes; docs/decisions-index.json
  is regenerated and fresh (VP step 7).
- docs/contracts/ports.yaml exists as a ratified Class D contract and the sole port registry, whose evaluator validate_ports_contract
  resolves and passes on the real tree (VP steps 1 and 4).
- validate_ports_contract rejects each defect class it claims to catch -- unknown tier or verbs_status, missing implemented location
  or present-suite path, pending adapter without owner, unresolvable tier-item, criterion, rec or dec owning item, an adapter oracle
  that is not among the port's adapters or misstates its status, an unresolvable harness oracle, a run_persona adapter id that is
  no inference-provider.yaml persona_backend value, a persona_backend value with no registered run_persona adapter, an oracle and
  an oracle_gap together or neither, coupling rows naming an undeclared or a single port, a finding location that is neither a path nor a decision, a semantics
  key naming no field, duplicate ids, unknown keys, and an ambient trigger file that no longer names the contract (VP steps 2 and
  3).
- The file-router carries the `ports` route and the population gate (validate_contract_drift) and validate_placement pass (VP steps
  4 and 5).
- AGENTS.md carries the one-line ports trigger, neither AGENTS.md nor docs/contracts/git-ops.yaml still names the removed 'Canonical
  authority' line, the S1 ambient load-set stays within its (ratcheted) budget, and the AGENTS.md contract tests still pass (VP steps
  10 and 11).
- T4.2 c14, T4.19 c6, T4.23 c15-c16 and T4.24 c9-c14 exist with the execution-step text; related_decisions carry 211/212 as specified;
  T4.19's files_in_scope comment no longer calls executor-loop-definition.yaml a port registry; item statuses are unchanged; S1.7-S1.9
  exist deferred_post_mvp in a RoadmapDocument-valid ROADMAP-SEMANTO.yaml; validate_platform_roadmap plus validate_roadmap_liveness
  pass (VP steps 8 and 9).
- The three recommendations E1, E5 and E6 are filed through the ops portal with the stated payloads (VP step 13) and their allocated
  ids are written into this plan's followon_recs, and dec-211 and dec-212 are present in the warehouse after the post-merge backfill
  (VP step 15).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Prove the ports contract exists and its own evaluator passes on the real tree.
  command: bin/venv-python -c "from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as v; f=[]; v(f);
    assert not f, f; print('PORTS_CONTRACT_OK')"
  expected: 'Exit 0 with the PASS line (which also reports the open coupling_findings count, 0 at landing) and the marker. RED BEFORE,
    verified by reasoning on this tree: the module does not exist, so the import raises ModuleNotFoundError and the interpreter exits
    1.'
  fix_if: A printed finding names the ports.yaml row or rule that fails; fix the contract row (or, if the row is right, the rule),
    never by loosening a rule to obtain green (implement-scope-boundary.yaml CONTENT invariant).
  hermetic: true
  expected_literals:
  - PORTS_CONTRACT_OK
  graduation: waive
  graduation_waiver_reason: validate_ports_contract is itself registered (execution step 7) and runs on every --pre diff touching
    its pre_globs and on every full run; a shard re-running it would re-assert what the registered gate already owns -- the same
    reason step 4 waives validate_contract_drift.
- step: 2
  phase: pre-deploy
  action: Prove the check rejects a coupling finding that names an undeclared port -- the rule that keeps findings tied to the registered
    ports.
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_ports_contract.py::test_rejects_coupling_finding_naming_undeclared_port
    -q
  expected: 'Exit 0, one test passed. RED BEFORE: the test file does not exist, so pytest exits 4 (target_absent).'
  fix_if: A failure means rule (a) is missing or the finding is appended without the label; restore the cross-reference rule.
  hermetic: true
  expected_literals:
  - 1 passed
  graduation: graduate
  graduation_check_id: ports-contract-rejects-undeclared-port-coupling
- step: 3
  phase: pre-deploy
  action: Run the full new test module, the predicate test module and the contracts manifest mirror test.
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_ports_contract.py tests/test_decision_condition_predicates.py
    tests/checks/contracts/test__manifest.py -q
  expected: Exit 0, every test passing, including the twenty-five named tests of execution step 8, the four TestPortsOpenCouplingFindings
    tests of execution step 9 and the manifest parametrisations for the new Entry. The new module is held to the 100 percent default
    coverage threshold by test_coverage_checker.
  fix_if: A coverage shortfall names the uncovered branch -- add the negative fixture; never lower a threshold.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'Whole-file re-runs of two test files this plan creates or extends plus an existing manifest test: all
    sit inside the --pre pytest_diff affected set and the full tier''s whole-suite run, and steps 2 and 12 already graduate the behavioural
    nodes that warrant standing shards.'
- step: 4
  phase: pre-deploy
  action: 'Prove the contract-population gate accepts the new Class D file: ratified status with ratified_via, resolving check evaluator,
    subject equal to the router topic, no smuggled shape, ratchet pins unchanged.'
  command: bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v; f=[]; v(f);
    assert not f, f; print('CONTRACT_DRIFT_OK')"
  expected: Exit 0 and the marker; the census line shows the declared bucket one higher than on origin/main and grandfathered / status_active
    unchanged at 16/16; the git-ops.yaml and file-router.yaml edits carry their amendment_log entries.
  fix_if: '''evaluator does not resolve'' means the check module lacks the executable ''ports.yaml'' literal or is not sequenced;
    ''topic_equals_subject'' means the router topic differs from `ports`.'
  hermetic: true
  expected_literals:
  - CONTRACT_DRIFT_OK
  graduation: waive
  graduation_waiver_reason: validate_contract_drift is itself registered in both tiers and evaluates every docs/contracts file on
    every run; a per-file shard would re-assert what the registered gate already owns.
- step: 5
  phase: pre-deploy
  action: Prove the file-router route for the new contract exists (no registered check enforces route PRESENCE for a new contract).
  command: 'grep -n -x ''  - topic: ports'' docs/contracts/file-router.yaml'
  expected: 'Exit 0 printing the matching route line. RED BEFORE: no such route exists on this tree, so grep exits 1.'
  fix_if: 'Exit 1 means the route is absent or indented differently from the other routes; add it under routes: with targets [docs/contracts/ports.yaml].'
  hermetic: true
  expected_literals:
  - 'topic: ports'
  graduation: graduate
  graduation_check_id: router-route-ports
- step: 6
  phase: pre-deploy
  action: 'Prove Decisions 211 and 212 exist, their reversal-conditions stanzas parse, and 212''s coupling condition is bound to
    the registered predicate. Whether it fires is never asserted: Decision 133 monitoring surfaces fired conditions and never gates
    on them.'
  command: 'bin/venv-python -c "import scripts.preflight.decision_conditions as dc; r={x.decision_id: x for x in dc.evaluate() if
    x.decision_id in (211, 212)}; assert set(r) == {211, 212}, sorted(r); assert all(s.state != ''MALFORMED'' and s.error is None
    for s in r.values()), r; p=[c for c in r[212].conditions if c.predicate]; assert [c.predicate for c in p] == [''ports_open_coupling_findings_exceed''],
    p; print(''STANZAS'', sorted(r))"'
  expected: 'Exit 0 printing STANZAS [211, 212] (no condition count and no fired state is pinned). RED BEFORE: neither entry exists,
    the set comparison fails and the interpreter exits 1 (assertion_failed).'
  fix_if: MALFORMED means the ```yaml reversal-conditions fence or a condition's id/kind/predicate/params is malformed, or the predicate
    is unregistered or raised (ports.yaml missing); copy the execution-step-3 text verbatim.
  hermetic: true
  expected_literals:
  - STANZAS [211, 212]
  graduation: graduate
  graduation_check_id: decisions-211-212-stanzas-parse
- step: 7
  phase: pre-deploy
  action: 'Run the decision-corpus gates the two entries and the Decision 184/197 annotations touch: entry conformance (envelope,
    significance, markers), per-entry size cap, supersession annotation, index freshness.'
  command: bin/venv-python -c "from scripts.checks.decisions.validate_decision_entry_conformance import validate_decision_entry_conformance
    as a; from scripts.checks.decisions.validate_decisions_size import validate_decisions_size as b; from scripts.checks.decisions.validate_supersession_annotations
    import validate_supersession_annotations as c; from scripts.checks.decisions.validate_decisions_index_freshness import validate_decisions_index_freshness
    as d; f=[]; [g(f) for g in (a, b, c, d)]; assert not f, f; print('DECISION_GATES_OK')"
  expected: 'Exit 0 and the marker; the conformance check reports 2 new entries ([211, 212]); the size check reports no per-entry
    cap failure (measured at plan time with the 4-digit E5 rec id: 211 = 5140 bytes, 212 = 6105 bytes, cap 6144) and prints WARN-only
    amendment-delta lines for Decisions 184 and 197, whose annotated spans exceed 6144 bytes (184 = 6375, 197 = 7703; accepted: rec-3243''s
    accretion signal never fails).'
  fix_if: A size failure means wording was added -- restore the verbatim text; a supersession failure means a 184 or 197 blockquote
    is missing; an index failure means `bin/venv-python -m scripts.decisions_index --write` was not re-run.
  hermetic: true
  expected_literals:
  - DECISION_GATES_OK
  graduation: waive
  graduation_waiver_reason: All four are registered decision-corpus checks that run on every --pre or full invocation; step 6 graduates
    the one property specific to these two entries.
- step: 8
  phase: pre-deploy
  action: 'Prove the ten new criteria, the T4.19 comment reword and the related_decisions back-references landed (durable properties
    only: criterion text and back-references, never lifecycle status).'
  command: 'bin/venv-python -c "from pathlib import Path; from scripts.platform_roadmap_state import load; m={t.id: t for t in load(Path(''docs/ROADMAP-PLATFORM.yaml'')).tier_items};
    c=lambda i, k: {x.id: x for x in m[i].exit_criteria}[k]; assert ''change-surface verbs'' in c(''T4.19'', ''c6'').text; assert
    ''run_image'' in c(''T4.2'', ''c14'').text and ''local_container'' in c(''T4.2'', ''c14'').text; assert ''coupling_findings''
    in c(''T4.23'', ''c15'').text; assert ''T4.23:c16'' in c(''T4.23'', ''c16'').text; assert ''structural_assumptions'' in c(''T4.24'',
    ''c9'').text; assert ''three repositories'' in c(''T4.24'', ''c10'').text; assert ''OS sandbox'' in c(''T4.24'', ''c11'').text;
    assert ''.ontheloop/'' in c(''T4.24'', ''c12'').text; assert ''stop at any level'' in c(''T4.24'', ''c13'').text; assert ''T4.24:c14''
    in c(''T4.24'', ''c14'').text; assert all(212 in m[i].related_decisions for i in (''T4.2'', ''T4.19'', ''T4.23'')); assert {211,
    212} <= set(m[''T4.24''].related_decisions); assert ''port registry + trace schema'' not in Path(''docs/ROADMAP-PLATFORM.yaml'').read_text();
    print(''ROADMAP_CRITERIA_OK'')"'
  expected: 'Exit 0 and the marker. RED BEFORE: T4.19 has no c6 and T4.2 no c14, so the dict lookup raises KeyError and the interpreter
    exits 1.'
  fix_if: A KeyError names the missing criterion id; an AssertionError names the text phrase or back-reference.
  hermetic: true
  expected_literals:
  - ROADMAP_CRITERIA_OK
  graduation: graduate
  graduation_check_id: roadmap-port-adoption-criteria
- step: 9
  phase: pre-deploy
  action: Run the roadmap schema/integrity check and the liveness detector over the edited roadmap, prove no item status moved, and
    validate ROADMAP-SEMANTO.yaml against RoadmapDocument (S1.5 has not wired it into validate.py yet).
  command: 'bin/venv-python -c "import yaml; from pathlib import Path; from scripts.checks.roadmap.validate_platform_roadmap import
    validate_platform_roadmap as a; from scripts.checks.roadmap.validate_roadmap_liveness import validate_roadmap_liveness as b;
    from scripts.platform_roadmap_state import load; from scripts.roadmap.platform_roadmap import RoadmapDocument; f=[]; a(f); b(f);
    assert not f, f; m={t.id: t for t in load(Path(''docs/ROADMAP-PLATFORM.yaml'')).tier_items}; assert m[''T4.2''].status == m[''T4.19''].status
    == ''not_started'' and m[''T4.23''].status == m[''T4.24''].status == ''deferred_post_mvp''; s={t.id: t for t in RoadmapDocument.model_validate(yaml.safe_load(Path(''docs/ROADMAP-SEMANTO.yaml'').read_text())).tier_items};
    assert all(s[i].status == ''deferred_post_mvp'' for i in (''S1.7'', ''S1.8'', ''S1.9'')), sorted(s); print(''ROADMAP_GATES_OK'')"'
  expected: 'Exit 0 and the marker: RoadmapDocument validates both roadmaps (no live item depends on a deferred_post_mvp item), the
    touched items carry only structured criteria, statuses are unchanged and liveness reports no new blocking finding.'
  fix_if: A liveness finding about the new T4.19 criterion means a structural rule was tripped -- read its message; never edit config/roadmap_liveness_baseline.yaml
    upward to silence it. A SEMANTO ValidationError names the malformed field.
  hermetic: true
  expected_literals:
  - ROADMAP_GATES_OK
  graduation: waive
  graduation_waiver_reason: The two roadmap checks are registered in the --pre tier on every roadmap diff, and the status and SEMANTO
    assertions are transient (statuses move as T4.19 starts; SEMANTO validation becomes standing when S1.5 wires it); step 8 graduates
    the durable plan-specific property.
- step: 10
  phase: pre-deploy
  action: Prove the AGENTS.md trigger line landed, the duplicate line is gone from AGENTS.md and from its git-ops.yaml referrer,
    and the ambient prose budget holds after the ratchet.
  command: 'grep -c -F ''Executor/adapter/port code: record cross-port couplings'' AGENTS.md && ! grep -q -F ''**Canonical authority:''
    AGENTS.md && ! grep -q ''Canonical authority'' docs/contracts/git-ops.yaml && bin/venv-python -c "from scripts.checks.prose.prose_limits
    import validate_prose_limits as v; f=[]; v(f); assert not f, f; print(''PROSE_OK'')"'
  expected: Exit 0 printing the count 1 then the marker, with no S1 below-budget advisory (the budget equals the measured size).
  fix_if: An over-budget S1 means the trigger line grew; shorten it to the execution-step-10 text rather than raising the budget.
    A git-ops.yaml hit means merge_protocol_note was not re-pointed.
  hermetic: true
  expected_literals:
  - PROSE_OK
  graduation: waive
  graduation_waiver_reason: validate_prose_limits is registered in both tiers, step 1's validate_ports_contract guards the trigger's
    presence through rule (f), and the two negated greps are a one-off retirement sweep of a removed line, not a standing property.
- step: 11
  phase: pre-deploy
  action: Prove the AGENTS.md and git-ops.yaml edits break none of the existing ambient-instruction pins.
  command: bin/venv-python -m pytest tests/test_pr_ci_red_protocol_contract.py tests/checks/contracts/test_validate_instruction_architecture_layers.py
    tests/checks/contracts/test_validate_claude_md_pointer_invariant.py -q
  expected: Exit 0, all tests passing.
  fix_if: A failure names the AGENTS.md phrase a test pins; keep that phrase and pay for the trigger line elsewhere in AGENTS.md.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Whole-file re-runs of existing test modules already inside the --pre pytest_diff affected set for an
    AGENTS.md diff; no new behaviour to shard.
- step: 12
  phase: pre-deploy
  action: Prove the coupling-threshold predicate fires strictly above its threshold and not at it.
  command: bin/venv-python -m pytest tests/test_decision_condition_predicates.py::TestPortsOpenCouplingFindings::test_fires_only_above_threshold
    -q
  expected: 'Exit 0, one test passed. RED BEFORE: the node does not exist in tests/test_decision_condition_predicates.py, so pytest
    exits 4 (target_absent).'
  fix_if: A failure at threshold 2 with two open rows means the comparison is >= rather than >; an accepted row counted means the
    status filter is missing.
  hermetic: true
  expected_literals:
  - 1 passed
  graduation: graduate
  graduation_check_id: ports-coupling-threshold-predicate
- step: 13
  phase: pre-deploy
  action: Prove the three recommendations were filed with their payloads (reader query by exact title prefix, then by id).
  command: bin/venv-python -c "from typing import cast; from src.common.ducklake_reader_client import DuckLakeReader, make_reader;
    from scripts.ops_data_portal import _fetch_rec_from_reader as g; r=cast(DuckLakeReader, make_reader()); T=['Seed ports.yaml structural_assumptions',
    'Carry Decision 211 clause 4', 'Plan the agent-branch prefix migration']; ids=[[x['id'] for x in r.named('recs_by_title_prefix',
    title_prefix=t + '%') if x['status'] == 'open'] for t in T]; assert all(len(i) == 1 for i in ids), ids; recs=[g(i[0]) for i in
    ids]; assert all('decision-211' in (x.get('tags') or []) for x in recs[:2]), recs; print('RECS', [i[0] for i in ids])"
  expected: Exit 0 printing the three allocated rec ids; exactly one open rec per title, E1 and E5 tagged decision-211.
  fix_if: A count of 0 means a filing failed loudly (Decision 84 I-4) -- re-file after restoring reader/writer connectivity; a count
    of 2 means a duplicate filing -- supersede the later one via update_rec. If the pre-merge numbering re-check (execution step
    16) shifted 211/212, update_rec E1/E5's tags and context and E5's title and acceptance text to the new numbers, and fix this
    step's 'Carry Decision 211 clause 4' title-prefix literal, its decision-211 tag literal and VP step 6's ids in the same change.
  hermetic: false
  graduation: not-applicable
- step: 14
  phase: pre-deploy
  action: Run the full validation tier before the implementation commit (handoff_policy).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0 with 'All checks passed.' in the full scope summary.
  fix_if: Any failure blocks the commit; on timeout the disposition is blocked -- resume later and rerun from the start.
  hermetic: false
  graduation: not-applicable
- step: 15
  phase: post-deploy
