  - "Graduated shards kept (nodes only added beside them, none renamed or dropped): persona-guidance-chain-guards, persona-guidance-slot-schema, persona-guidance-slot-seam (test_persona_guidance_slots.py); persona-registry-key-check, persona-run-identity-contract, verdict-consistency-contract-rules (test_validate_persona_contracts.py). rec-5659's build (unbuilt plan) also scopes guidance_eval.py, the manifest and test_guidance_eval.py; this build starts after it merges and rebases on it."
