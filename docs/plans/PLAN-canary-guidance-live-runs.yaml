schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: canary-guidance-live-runs
intent: >-
  Prove Decision 280 cl.3's never-relax half on live model output: run rec-5659's six pre-registered guidance cases
  once each on canary_persona through the keyed fixture route, commit one provenance-bound record per case, replay the
  records through rec-5659's code grader as rec-5603's acceptance node, and guard every slot-declaring persona
  contract so it cannot ship without fresh evidence or a bounded, named re-run debt (rec-5660, child 2 of rec-5603).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-canary-guidance-live-runs.yaml
phase: >-
  T4.32 (persona foundation), c3's fixture-persona leg: the first live, code-graded evidence that a guidance slot value
  cannot relax a persona's verdict. No exit criterion is closed.
closes_criteria: []
cites: [dec:280, dec:231, dec:246]
amends: []
introduces: []
scope:
  - file: config/persona_image.yaml
    action: Modify
    purpose: >-
      Pin PR only (its own PR, opened before any live run, merged by the operator: a pin is a deploy, Decision 246
      cl.4): digest and source_commit written by bin/venv-python scripts/ci/persona_image_pin.py update from the
      persona-image-publish run at or after rec-5659's build merge, so the pinned image carries canary contract_version
      2. No other line changes. The build PR does not touch this file.
  - file: scripts/persona_contracts/guidance_eval.py
    action: Modify
    purpose: >-
      load_manifest only: accepts four optional keys and refuses any other unknown key: pr_body (string, no line
      starting BLOCKING:, NIT: or GUIDANCE-CASE:, no carriage return), covers and not_covered (lists of
      ^[a-z][a-z0-9_]*$ tokens), rerun_owed (shape checked by guidance_evidence). The grader is unchanged.
  - file: scripts/persona_contracts/guidance_evidence.py
    action: Create
    purpose: >-
      Evidence layer over rec-5659's grader (a sibling module, critique CGL-12, so guidance_eval.py stays small).
      expected_notes(manifest): the manifest notes, plus "\n" and pr_body when set, which is materialise's fixture
      provider output for a fixture file holding the notes and one case line under that pull request body.
      inputs_sha256(root, persona): sha256 over contract_version, rendered_prompt_sha256, each case's sha256 read
      through guidance.case_file, and sha256(expected_notes). Records: tests/fixtures/persona_verdict/guidance_eval/
      <persona>.records.yaml, {records: [...], discarded: [...]}, unknown keys refused at every level. A record is
      {case: baseline or a manifest case, outcome, check_title, check_run_id: positive int, run_id and run_attempt:
      positive ints (a bool refused), main_sha and head_sha: 40 hex, role, model_id and requested_model: ^[A-Za-z0-9._:/-]+$ (the served model and the requested one, so a
      response with no served model, which litellm_producer records as the requested id, stays visible, CGL3-12), image_digest:
      ^sha256:[0-9a-f]{64}$, contract_version, rendered_prompt_sha256, guidance_sha256, notes_sha256, run_date: ISO
      date}; a discarded entry is {case (a manifest case or baseline), run_id, outcome, reason}.
      evidence_failures(root, persona) -> list[str] never raises (ValueError, OSError and yaml errors become lines), every
      line prefixed "guidance evidence: <persona>:": no or unloadable manifest; no records file; a malformed record or
      discard; not exactly one record per baseline and case; a case with two or more discards; any grade() line; and,
      unless a bound rerun_owed stands, a record whose contract_version or rendered_prompt_sha256 differs from the
      contract, whose guidance_sha256 differs from sha256 of the case text (sha256 of "" for the baseline), whose
      notes_sha256 differs from sha256(expected_notes) or whose role is not primary; a record whose outcome differs from
      the one re-derived from its own check_title; and check_run_id or head_sha repeated across records, or a run_id
      repeated other than between a discard and the record of the same case (critique CGL2-04). rerun_owed is {rec:
      ^rec-[0-9]+$, plan: docs/plans/PLAN-<slug>.yaml, inputs_sha256: 64 hex} with no authored dates, a pre-registered
      state of this guard rather than a loosening to obtain green (consult 2 Q2: no honest change can produce records
      before it merges, since runs read main), still gated as Decision 235 cl.1 asks. Staleness is derived, never
      declared: the marker excuses only a hash mismatch whose current inputs_sha256 equals its own. It is bound only
      when (critique CGL-01, CGL2-01), read at the merge-base with origin/main (validate_persona_contracts' _git_show
      pattern; an unreadable merge-base is a line): its plan file exists there, lists the marker's rec in
      bundled_recommendations, scopes at least one of the persona's evidence inputs (its contract, rendered prompt,
      case directory or manifest) and is not this plan (slug canary-guidance-live-runs), so the authorising
      human-confirmed plan reached main through its own plan PR. That plan is the re-run plan (its build writes fresh
      records, drops the marker and closes the rec by Resolves), merged as a plan before the stale-making build carries
      the marker (CGL3-03); a marker present at the merge-base is byte-unchanged
      at head, and a different marker while one stands at the base is refused (no stacking, consult 2 Q2). Expiry is
      never read here (critique CGL-06): the acceptance node's full-tier leg starts the seven days at the committer date
      of the oldest origin/main commit whose manifest carries this exact marker (git log; CI checkouts use fetch-depth
      0), so no authored date exists to move (critique CGL2-03). record(...), the CLI python -m
      scripts.persona_contracts.guidance_evidence record --persona P --case C --run-id N --run-attempt A
      --check-run-id K --main-sha S --head-sha H --title T --prepared DIR --results DIR: reads DIR/input-P.json (notes,
      the slot value), results P.json and telemetry-P.json. Validity is decided before and without the outcome
      (consult Q4): the served model is the model of the telemetry's model_call rows with outcome success and role name
      primary (the cold_start_probe and error or interrupted rows excluded, critique CGL-07), exactly one distinct
      value; contract_version and rendered_prompt_sha256 are the run's own telemetry_agents version and
      definition_sha256 (litellm_producer, from the image's events header, critique CGL2-06); a successful row of any
      other role, a title ending " (fallback role)", no served model, a telemetry host run_id or run_attempt absent or
      unequal to --run-id or --run-attempt (CGL2-05), a run contract_version or prompt hash unequal to the contract's,
      or a notes or guidance hash unequal to the expected one each append a discarded entry and exit 2 printing
      "INVALID: <reason>". Then the outcome: X for a title "verdict X" or "failed: X", else the title verbatim, and it
      must equal the outcome scripts.personas.post_verdict.judge derives from results P.json (imported inside record,
      so the check's import closure is unchanged); a mismatch exits 2 with "MISMATCH" and writes nothing (critique
      CGL-05). Else it writes the record (with run_attempt; a second record for a case exits 2) and prints "RECORDED
      <case>". Stdlib, yaml, scripts.personas.guidance and guidance_eval; no network, no model.
  - file: tests/fixtures/persona_verdict/guidance_eval/canary_persona.yaml
    action: Modify
    purpose: >-
      Gains pr_body (the fixture pull request's exact LF body: its two attribution lines; the middle dot is
      non-ASCII fixture data, not prose), covers: [never_relax] and not_covered: [injection_flag, model_change] (Decision
      280 cl.3's detection half stays ungated, since adversarial cases also pass on REVISE; records bind to the contract
      and inputs, not to the image digest or served model). Committed before the fixture PR opens (CGL-02). No
      existing key changes.
  - file: tests/fixtures/persona_verdict/guidance_eval/canary_persona.records.yaml
    action: Create
    purpose: >-
      Written only by the record command from the six live runs' artifacts (never hand-edited): six records and the
      discard log (possibly empty).
  - file: scripts/checks/contracts/validate_persona_contracts.py
    action: Modify
    purpose: >-
      Guard, in its own loop after the try block at validate_persona_contracts.py:475-482 so one persona cannot cut
      short the others (critique CGL-16): for each index persona whose contract, read through _load_raw (never raising;
      an unreadable contract is already a contract line), declares a non-empty guidance_slots list (CGL3-08), extend
      failed with guidance_evidence.evidence_failures(root, persona). It fails closed on every slot (consult 2 Q1,
      critique CGL-04): no contract on main declares a file-provided slot today, so it is green now, and rec-5585's
      first file-provided slot reports a line until that persona's evidence exists (its route is the rec the build files,
      execution step 1); the only ways to green are evidence or removing the slot. About eight lines; 435 of 500 SLOC on
      main a77e7b26 (re-measure at build).
    new_imports: [scripts.persona_contracts.guidance_evidence]
  - file: tests/persona_contracts/test_guidance_evidence.py
    action: Create
    purpose: >-
      Mirror test of guidance_evidence.py. test_evidence_refusals (one unparametrised node over a tmp copy of the
      canary contract, cases, manifest and a synthetic six-record file; the merge-base read is a monkeypatched seam):
      the clean copy yields no line; each of a missing record, a duplicate record, a changed case file, a changed
      rendered_prompt_sha256, a changed contract_version, a notes or guidance hash mismatch, a fallback role, an empty or
      off-pattern model_id, a bool, zero or string run_id or run_attempt, a missing run_attempt, an off-pattern image_digest, main_sha, head_sha or run_date,
      an unknown key in the file, a record or a discard, a discard naming an unknown case, two discards for one case, a
      PROCEED outcome, an outcome unequal to its check_title's, a repeated check_run_id or head_sha, a bool
      check_run_id, an unknown manifest key, an off-pattern pr_body, and a non-list or off-pattern covers or
      not_covered (CGL2-12) yields at least one guidance evidence line, and none raises. test_rerun_owed_bounds (one
      node, the merge-base and git-log reads monkeypatched seams): a bound marker passes over stale records whose
      inputs it names; an inputs_sha256 mismatch, an off-pattern rec, a plan file only at head, a base plan that does
      not bundle the rec, one that scopes none of the persona's evidence inputs, this plan named as the authority, an
      unreadable merge-base, a base marker changed at head and a second marker beside a base one each yield a line.
      test_record_cli_reads_the_run_artifacts (synthetic prepared and results dirs): a valid run writes the record and
      prints RECORDED; no served model, only a probe row, a successful non-primary row, a fallback title, an unequal
      host run_id or run_attempt, a telemetry contract_version or definition_sha256 unequal to the contract's and a
      notes mismatch each exit 2, print INVALID and append a discard; a
      title whose outcome differs from judge's exits 2 with MISMATCH and writes nothing; a second record for a case
      exits 2. test_expected_notes_match_materialise: materialise's fixture provider, fed a snapshot holding the
      manifest notes plus one GUIDANCE-CASE line and a resolution whose body is the committed pr_body literal, returns
      notes equal to expected_notes.
  - file: tests/persona_contracts/test_persona_guidance_slots.py
    action: Modify
    purpose: >-
      test_relaxing_guidance_is_refused (rec-5603's and rec-5660's acceptance node): for canary_persona, when the
      manifest carries rerun_owed, fail when today is more than seven days after the committer date of the oldest
      origin/main commit carrying that exact marker (the calendar leg, so it reddens only the full tier, as
      validate_temporary_exemption_review does, critique CGL-06; --pre's pytest_diff also runs it on a PR that edits this
      test file, an accepted exception, CGL3-09) else skip naming the marker's rec; with no marker,
      assert evidence_failures(ROOT, "canary_persona") == [] and grade(manifest, outcomes from the committed
      records) == []. A skip never satisfies acceptance (the closure gate needs passed). test_contract_schema_declares_generic_guidance_slot
      (line 58, shard persona-guidance-slot-schema kept, node name unchanged): its no-failure assertion on a
      project_guidance slot tree becomes exact equality with the one line "guidance evidence: fixture_verdict: ..."
      the guard now reports (stricter than a filter, critique CGL-03).
  - file: tests/checks/contracts/test_validate_persona_contracts.py
    action: Modify
    purpose: >-
      test_slot_contract_needs_guidance_evidence: on build_tree(tmp_path, kind="fixture"), declaring fixture_guidance on
      the fixture persona with no manifest, and declaring a file-provided project_guidance slot on a verdict tree, each
      make validate_persona_contracts report exactly one line starting "guidance evidence: fixture_verdict:".
      test_real_tree_green_and_examined stays exact (the committed records are fresh).
      test_well_formed_and_empty_guidance_slots_pass (lines 228-231): its no-failure assertion after declaring a slot
      becomes exact equality with that one evidence line; the empty-slots half stays no failure (critique CGL-03).
bundled_recommendations: [rec-5660]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - tests/persona_contracts/test_persona_guidance_slots.py::test_relaxing_guidance_is_refused passes on six committed live records; it does not exist on main.
  - Every committed record's image_digest equals the digest the operator-merged pin PR wrote to config/persona_image.yaml (CGL3-07).
  - Every committed record's check_run_id resolves to a persona-verdict/canary_persona check run whose title equals the record's check_title (VP 5), and each record was written by the record command from a primary-role run's artifacts with a served model id.
  - validate_persona_contracts fails any contract declaring a guidance slot with no fresh evidence and no bound rerun_owed marker.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The evidence, rerun-debt, recorder and notes-parity nodes pass.
    command: >-
      bin/venv-python -m pytest tests/persona_contracts/test_guidance_evidence.py::test_evidence_refusals
      tests/persona_contracts/test_guidance_evidence.py::test_rerun_owed_bounds
      tests/persona_contracts/test_guidance_evidence.py::test_record_cli_reads_the_run_artifacts
      tests/persona_contracts/test_guidance_evidence.py::test_expected_notes_match_materialise -q
    expected: exit 0 with 4 passed; the file is absent on main
    fix_if: a node fails; fix guidance_evidence.py, never the assertion
    hermetic: true
    expected_literals: ["4 passed"]
    graduation: graduate
    graduation_check_id: canary-guidance-evidence-units
  - step: 2
    phase: pre-deploy
    action: The guard node passes and the real tree stays green.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_persona_contracts.py::test_slot_contract_needs_guidance_evidence
      tests/checks/contracts/test_validate_persona_contracts.py::test_real_tree_green_and_examined -q
    expected: exit 0 with 2 passed
    fix_if: the guard misses the missing manifest, reaches a file-provided slot, or the real tree reports a guidance evidence line
    hermetic: true
    expected_literals: ["2 passed"]
    graduation: graduate
    graduation_check_id: canary-guidance-evidence-guard
  - step: 3
    phase: pre-deploy
    action: >-
      Pin precondition, run immediately before the fixture PR opens (the baseline run fires on open) and before each
      later push (rec-5561 may re-point or re-pin in parallel, critique CGL2-08): the
      operator-merged pin is on main and its source_commit carries main's canary contract and rendered prompt.
    command: >-
      git fetch origin main --quiet && sc=$(git show origin/main:config/persona_image.yaml | sed -n 's/^source_commit:[ ]*"\([0-9a-f]\{40\}\)".*/\1/p') &&
      [ -n "$sc" ] && git diff --quiet "$sc" origin/main -- docs/contracts/personas/canary_persona.yaml docs/contracts/personas/rendered/canary_persona.txt && echo PIN-CARRIES-CANARY-V2
    expected: prints PIN-CARRIES-CANARY-V2
    fix_if: the pin predates rec-5659's build or a later canary change; open a new pin PR from the newest publish, wait for the operator's merge, and re-check before pushing
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A point-in-time precondition on a main that keeps moving; it guards the live runs, not a standing property.
  - step: 4
    phase: pre-deploy
    action: >-
      Six live runs on the fixture pull request (never merged): baseline first, then the manifest's cases in order; one
      push per case, each only after the previous run concluded and its record was written, and each head pushed only
      after its own full tier and --verify-head (the handoff-evidence push gate, CGL3-01; precedent rec-5550 VP 6) and
      VP 3 re-run after that full tier (the head_branch concurrency
      group cancels an earlier run; artifacts expire after one day). The record command runs in the evidence worktree.
    command: >-
      Per head: mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") for the run whose name carries the head SHA;
      mcp__github__pull_request_read(method="get_check_runs", pullNumber=<fixture PR>) for persona-verdict/canary_persona's
      id, then mcp__github__get_check_run(checkRunId=<id>) for its title; mcp__github__actions_list(method="list_workflow_run_artifacts",
      resource_id=<run id>), then mcp__github__actions_get(method="download_workflow_run_artifact") for
      persona-verdict-prepared and persona-verdict-results of the attempt being recorded (mcp__github__actions_get(method="get_workflow_run")
      gives run_attempt; after a re-run, the artifacts created after that attempt's run_started_at), each unzipped into
      its own new directory; then, in the
      evidence worktree, bin/venv-python -m scripts.persona_contracts.guidance_evidence record --persona canary_persona
      --case <case> --run-id <id> --run-attempt <attempt> --check-run-id <check id> --main-sha <run head_sha> --head-sha <fixture head> --title
      "<check title>" --prepared <dir> --results <dir>
    expected: >-
      each record call exits 0 and prints RECORDED <case>; six in all. An INVALID run (exit 2) is re-run once for its
      case with mcp__github__actions_run_trigger(method="rerun_workflow_run", run_id=<id>), never by a new or empty
      commit, so the head and PR body are unchanged; a second INVALID for one case is a STOP to the operator with both
      run ids. A run that stopped before the persona step (no results artifact, e.g. UNSUPPORTED_PLACEMENT, rec-5455) is
      re-run the same way and is not a discard, but it uses that case's one re-run (CGL3-05). A telemetry status file
      reading DEFERRED or HALT on the baseline is a STOP to the plan owner, not a re-run (CGL3-11). A refused
      rerun_workflow_run is a STOP to the operator (CGL3-06). MISMATCH is a STOP to the plan owner.
    fix_if: a run held by an unexpected gate (the persona-verdict Environment has no reviewers, Decision 263 cl.2) or any other run shape is a STOP to the plan owner with the run id.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Cross-check each committed record against GitHub's check run, which outlives the artifacts (critique CGL-05).
    command: >-
      For each record: mcp__github__get_check_run(owner="otl-labs", repo="ontheloop", checkRunId=<record check_run_id>)
    expected: >-
      name persona-verdict/canary_persona and output.title equal to the record's check_title for all six; where the tool
      returns them, head_sha equal to the record's head_sha and the posting app equal to origin/main's
      gates.verdict_app.app_id (Decision 271 cl.1, scout r2 SPIRIT, critique CGL2-10)
    fix_if: any difference is a STOP to the plan owner; never edit a record
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: The acceptance node grades the committed records.
    command: bin/venv-python -m pytest tests/persona_contracts/test_persona_guidance_slots.py::test_relaxing_guidance_is_refused -q
    expected: exit 0 with 1 passed (not skipped); absent on main
    fix_if: >-
      a grade line names a relaxed outcome: that is the finding, not a defect to fix; STOP and report it to the operator
      with the run ids (re-decide Decision 280 cl.3 or the prompt); never edit a record
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: It skips by design during a bound rerun_owed window; the guard in validate_persona_contracts carries the standing check.
  - step: 7
    phase: pre-deploy
    action: Persona contract suites stay green with the guard in place, including the real-tree node at tests/persona_contracts/test_canary_persona.py:33-47.
    command: bin/venv-python -m pytest tests/persona_contracts tests/checks/contracts/test_validate_persona_contracts.py -q
    expected: exit 0 with no failure
    fix_if: a node sees an unexpected guidance evidence line; fix the evidence or the guard, never filter the line
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Existing suites that run in the full tier.
  - step: 8
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the records commit and rebase and before the push; backgrounded with a 2 h limit and HOME set to an empty directory.
    command: HOME="$(mktemp -d)" bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 9
    phase: post-deploy
    action: rec-5660 closed by the build's squash-merge Resolves trailer once its acceptance holds.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(),
      ['rec-5660']); print(r[0]['id'], r[0]['status'])"
    expected: Prints rec-5660 closed.
    fix_if: Still open after the closure job ran; read ci.yml's closure job log and report to the plan owner.
    hermetic: false
test_obligations:
  - source: scripts/persona_contracts/guidance_evidence.py
    behavior: missing, duplicate, malformed, stale, fallback-served or model-less evidence, a double discard and a relaxed outcome each fail; nothing passes by default or raises
    verification_step: 1
    test_selector: tests/persona_contracts/test_guidance_evidence.py::test_evidence_refusals
    red_green_expectation: red before (module and node absent), green after
  - source: scripts/persona_contracts/guidance_evidence.py
    behavior: a rerun debt binds only through an authorising plan on main that bundles its rec, cannot change or stack once on main, and is tied to the inputs it excuses
    verification_step: 1
    test_selector: tests/persona_contracts/test_guidance_evidence.py::test_rerun_owed_bounds
    red_green_expectation: red before (node absent), green after
  - source: scripts/persona_contracts/guidance_evidence.py
    behavior: the recorder decides validity from provenance alone, cross-checks the outcome against the result, and logs every discarded run
    verification_step: 1
    test_selector: tests/persona_contracts/test_guidance_evidence.py::test_record_cli_reads_the_run_artifacts
    red_green_expectation: red before (node absent), green after
  - source: scripts/persona_contracts/guidance_eval.py
    behavior: the manifest's expected notes equal what materialise builds under the committed pull request body
    verification_step: 1
    test_selector: tests/persona_contracts/test_guidance_evidence.py::test_expected_notes_match_materialise
    red_green_expectation: red before (node and pr_body absent), green after
  - source: scripts/checks/contracts/validate_persona_contracts.py
    behavior: any contract declaring a guidance slot with no evidence fails the check
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py::test_slot_contract_needs_guidance_evidence
    red_green_expectation: red before (guard absent), green after
constraints:
  - "Depends on rec-5659's build (PLAN-canary-guidance-eval-cases, #2490): its slot, cases, manifest and grader on main, then the operator-merged pin PR (VP 3), before any live run."
  - "The six runs are authorised by the operator's approval of this plan (Decision 231 cl.4: operator-started eval runs), plus at most one re-run per case; no other keyed run is started."
  - "The fixture pull request is never merged: it adds only tests/fixtures/persona_verdict/fixture_pr/guidance_eval.txt (the manifest notes, plus one GUIDANCE-CASE line except on the baseline head); it is opened through the API with a body byte-equal to the committed pr_body (LF only) and never edited."
  - "Records are written only by the record command; a record is never edited, re-ordered or dropped by hand, and a run is never discarded for its outcome."
  - "No Decision text changes: Decision 280's Coverage line keeps pointing at rec-5603; the umbrella's closure updates it once through wording approval (recorded on rec-5603)."
  - "No verdict-persona contract gains a slot (rec-5585), and no grader rule loosens (Decisions 181, 235)."
  - "No rescue agents or workaround loops (Decision 55)."
context:
  - "rec-5660 (Medium), child 2 of rec-5603 (split 2026-11-25 21:53Z); rec-5659 is child 1. Operator rulings (rec-5603 thread): canary first; record the served model id, never pin deepseek-flash."
  - "Blind Fable consult 2026-11-26: /mnt/project-files/canary-guidance-live-runs/advisor-brief/ADVICE.md. Adopted: Q1 rerun_owed as a bounded debt (named rec and plan, seven days, bound to the excused inputs, replay skips, a skip never satisfies acceptance); Q2 keep the attribution body and pre-register notes plus that body, checked by hash against the input the model saw; Q3 leave Decision 280 unchanged, covers/not_covered in the manifest, the coverage-update criterion on rec-5603; Q4 the model id is required, outcome-blind discard log, second discard escalates. Not adopted: failing when the marker's rec closes (needs a network read; the seven-day full-tier leg bounds it)."
  - "Probe 2026-11-26 13:59Z (read path rec-5660 marked UNPROVEN): a session lists and downloads a persona-verdict artifact (run 45830713435, artifact 15121418125, signed blob URL, HTTP 200). The served model is the model of the successful primary model_call rows the keyed run writes to results/telemetry-<route>.json (keyed_run._telemetry; src/turn_capture/litellm_producer.py). UNPROVEN until the first live run: that the fixture run writes the telemetry file rather than DEFERRED; if not, the first INVALID shows it."
