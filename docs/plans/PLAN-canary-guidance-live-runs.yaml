  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Confirm rec-5659's build is merged (guidance_eval.py and the canary manifest on main); stop and report to the plan owner if not. With update_rec, append to rec-5603's context: 'Closure criterion (rec-5660 plan, consult Q3): Decision 280's Coverage line is updated once, through wording approval, naming the gated half (never_relax, test_relaxing_guidance_is_refused) and the ungated half (injection_flag)'; and to rec-5585's context: 'Evidence duty (rec-5660 plan, CGL-04, consult 2): validate_persona_contracts fails each contract that declares a guidance slot until its relaxation evidence exists or the slot is removed; the route is the rec filed below'. Also file (get_rec_write_guidance first) one rec for a file-provided guidance evidence route for verdict personas (consult 2 Q1 shape: fixed seeded-defect inputs, verdict with the current guidance file no weaker than with none, records bound to prompt hash, contract_version, guidance file hash and model id) and add it to rec-5585's dependencies;. Append to rec-5561's context the same evidence duty and the re-run sequence (a re-run plan merged first, its rec bundled; the stale-making build carries rerun_owed naming that plan; the re-run build repays it, CGL3-04). Read every write back."
  - "Pin PR: read the newest successful persona-image-publish run at or after rec-5659's merge, run scripts/ci/persona_image_pin.py update, run the full tier and --verify-head, push, open the pin PR (config/persona_image.yaml only) and ask the operator to merge it. After the squash-merge, restart the session branch at main and run VP 3."
  - "Code commit per the scope rows (all but the records file; measure guidance_evidence.py and its test against 500 SLOC and decompose into a facade package if needed, CGL3-10), with pr_body equal to the LF body the fixture PR will be opened with; confirm VP 1 and VP 2's guard node red with the code absent, then green. Record the commit SHA and create the evidence worktree from it."
  - "Fixture PR: restart the session branch at main, add guidance_eval.txt with the manifest notes, full tier and --verify-head, VP 3, force-with-lease push, open the PR through the API with the pr_body body (the baseline run fires on open), then VP 4 for the baseline; for each case in order, commit the case line, full tier and --verify-head, VP 3, push, VP 4. Close the fixture PR after the sixth record."
  - "Build PR: rebuild the session branch from the code commit plus one commit adding the records file from the worktree, run VP 2, 5, 6, 7 and 8, then open the build PR (Resolves: rec-5660)."
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - "Report: what was implemented, the six outcomes with run ids and model ids, verification results"
