  - "Plan owner: the planner thread 'Plan canary guidance live runs rec-5660'; build problems go back to it (2026-11-10 ruling)."
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:ef03e74f1ca0aa624bf6ad706dbb74dfdc17eac9341f3c1e95ff701c71e77fce"}  # pragma: allowlist secret
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Confirm rec-5659's build is merged (guidance_eval.py and the canary manifest on main); stop and report to the plan owner if not. Append to rec-5603's context with update_rec: 'Closure criterion (rec-5660 plan, consult Q3): Decision 280's Coverage line is updated once, through wording approval, naming the gated half (never_relax, test_relaxing_guidance_is_refused) and the ungated half (injection_flag)'; read it back."
  - "Pin PR: read the newest successful persona-image-publish run at or after rec-5659's merge, run scripts/ci/persona_image_pin.py update, open the pin PR (config/persona_image.yaml only), and ask the operator to merge it. After it merges, run VP 3."
  - "guidance_eval.py, the guard and the tests per their scope rows; confirm VP 1 and 2 nodes red with the code absent, then green (VP 2's real-tree node goes green only once records exist)."
  - "Fixture PR from the session branch restarted at main: add guidance_eval.txt with the manifest notes, open the PR with only the attribution body, then VP 4 for the baseline and each case in order. Close the fixture PR after the sixth record."
  - "Restart the session branch at main, cherry-pick the code commits, add pr_body/covers/not_covered and the records file, run VP 1, 2, 5, 6 and 7, then open the build PR (Resolves: rec-5660)."
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - "Report: what was implemented, the six outcomes with run ids and model ids, verification results"
