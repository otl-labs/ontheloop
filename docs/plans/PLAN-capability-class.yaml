schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "capability-class"
intent: >-
  Let a release choose a model and effort per persona for performance per cost (rec-5646): a capability_class axis
  (consult, reason, build, recall) assigns every persona and agent job a class, the class settings are user-set
  configuration homed in ontheloop/platform.yaml, the LiteLLM resolver reads each verdict persona's thinking and effort
  from its class, and no skill or contract hard-codes the consult's model.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-capability-class.yaml
phase: T4.32
cites: [dec:173, dec:224, dec:275, dec:282]
scope:
  - file: docs/contracts/inference-provider.yaml
    action: Modify
    purpose: >-
      Mechanism only, no values. (1) New top-level capability_class block: classes [consult, reason, build, recall] in
      rank order (recall lowest), each with a one-line qualifies text taken from rec-5646 (consult: frontier, paid for
      creativity and best-practice judgement, never hands-on work; reason: planning, critique, strategic judgement;
      build: precise instruction following bounded by deterministic checks; recall: facts, citations, completeness);
      claude_code_model_values [fable, opus, sonnet, haiku] (the Claude Code Agent tool's model enum; a harness adapter's
      value, not the class's identity); settings_rows naming the two project-configuration.yaml rows that hold the values;
      rules: (a) decision_scout may be in recall only while plan_critic is reason or above (enforced, the critic's
      conflict sweep is the backstop); (b) plan_critic preferably on a different model family from plan_agent
      (preference, unenforced); (c) per-item step-up of code_reviewer and implement_agent for terraform, IAM, secrets,
      governance contracts and scripts/checks, and of implement_agent on a repeated fix-up round, a stalled continuation
      or an L/XL plan (UNENFORCED, owned by rec-5657; precedent model_routing effort_bands and file_pattern_floors);
      (d) canary_persona runs on a release check at the class of the persona whose path it tests (UNENFORCED, owned by
      rec-5662; its member row is build meanwhile), and the AI coordinator's class is undecided (Decision 241). One line
      says the axis is orthogonal to kind and to the failover role and is never called a tier; one line says
      model_routing.executor.roles is the gemini-era interim executor mechanism (T4.2), which capability_class neither
      reads nor replaces. (2) vocabulary.axes gains capability_class: values_ref capability_class.classes,
      reserved_meaning, and do_not_use_for (a failover role, a deploy tier, a persona kind, or executor-personas.yaml
      capability_vocabulary, a persona's tool capabilities). (3) litellm_persona_selection.personas becomes the list of
      persona names the LiteLLM lane serves [decision_scout, plan_critic, code_reviewer, canary_persona]; the
      per-persona role settings leave; its note says thinking and effort come from the persona's class row and that the
      2026-11-11 setting of effort high for every persona is replaced by the class settings (operator decision card
      2026-11-25 21:36 UTC). (4) One amendment_log row at the top (schema_reshape, semantic_break true), and in the same
      change bin/venv-python -m scripts.checks.contracts.amendment_compact --rows 1 --write
      docs/contracts/inference-provider.yaml (Decision 282 cl.1). NEAR_CAP (490 of 500 effective lines; the block, axis
      entry and row add about 20 and the personas list saves 11): write the block as flow mappings, one line per class and
      rule; if the file still passes 500, relief follows Decision 275 cl.3 order, deferring rule (c) and (d) detail to
      rec-5657 and rec-5662 by citation; never line-joining existing notes and never a budget raise.
  - file: docs/contracts/project-configuration.yaml
    action: Modify
    purpose: >-
      Two project rows after the gates rows (Decision 224; ids outside clause 2's placements until T4.24 c16 places
      them, as the gates rows say): capability_class.members, defaults local and cloud the same flow mapping {consult:
      consult, audit_executor: consult, plan_agent: reason, plan_critic: reason, implement_agent: build, code_reviewer:
      build, ci_rca: build, canary_persona: build, decision_scout: recall, recon: recall}; capability_class.classes,
      defaults local and cloud the same flow mapping {consult: {claude_code_model: fable, primary: {thinking: enabled,
      effort: max}, warm_fetched_escape_hatch: {thinking: enabled, effort: max}}, reason: {claude_code_model: opus,
      primary: {thinking: enabled, effort: max}, warm_fetched_escape_hatch: {thinking: enabled, effort: high}}, build:
      {claude_code_model: sonnet, primary: {thinking: enabled, effort: high}, warm_fetched_escape_hatch: {thinking:
      enabled, effort: high}}, recall: {claude_code_model: haiku, primary: {thinking: enabled, effort: low},
      warm_fetched_escape_hatch: {thinking: enabled, effort: low}}}. Each row: kind project, applies_when always, homes
      platform_file on local, ci and cloud, variable null, exports [], readers [scripts/llm/tier_selection.py,
      scripts/checks/contracts/validate_inference_provider_registry.py, .claude/skills/consult/SKILL.md], set_by user,
      this_repository {current_home: null, note, status open, owning_item T4.24:c16}, enforcement
      validate_inference_provider_registry. The members note: "no ontheloop/platform.yaml: this repository's value is
      this row's default, which scripts/llm/tier_selection.py reads for the LiteLLM personas; members with no LiteLLM
      persona (consult, audit_executor, plan_agent, implement_agent, ci_rca, recon) are read by nothing yet". The classes
      note: "... read today: the consult class's claude_code_model (the consult skill) and the reason, build and recall
      primary and warm_fetched_escape_hatch settings (the LiteLLM verdict and fixture personas); unread: the reason,
      build and recall claude_code_model (skill model pins, rec-5661) and the consult class's role settings (no LiteLLM
      consult persona yet, rec-5645)". The header's "No row holds a value" sentence adds the two capability_class rows to
      its exceptions. One terse amendment_log row at the top (field_add), and in the same change bin/venv-python -m
      scripts.checks.contracts.amendment_compact --rows 1 --write docs/contracts/project-configuration.yaml (Decision 282
      cl.1; the scout's dry run reports compactable=2).
  - file: scripts/llm/tier_selection.py
    action: Modify
    purpose: >-
      resolve() takes thinking and effort from capability_class.classes[members[persona]][role] (the two rows'
      defaults.local); refuses with rule capability_class when either row is missing or not a mapping, the persona has no
      member row, its class has no classes entry, or the role's settings are not a mapping; vocabulary refusals keep rule
      persona_settings. resolve_all() iterates the litellm_persona_selection.personas list. New pure
      capability_class_findings(inference_provider, project_configuration, registry_personas) never raises: it returns
      one string per breach, and any non-mapping or non-string shape (a row's defaults, a classes entry or role, a
      member value) is itself a finding. Breaches: a row missing or with defaults.local unequal to defaults.cloud; a
      member whose class is not in capability_class.classes; a classes key outside the vocabulary; a claude_code_model
      value outside claude_code_model_values; a registry persona or a litellm_persona_selection persona with no member
      row; rule (a) (decision_scout recall while plan_critic ranks below reason). Under 500 SLOC.
  - file: scripts/checks/contracts/validate_inference_provider_registry.py
    action: Modify
    purpose: >-
      A capability_class leg that runs whether or not the tier-selection leg refused: reads executor-personas.yaml from
      the same contracts directory (absent, unparseable, or without a personas list is a finding naming the file: fail
      closed, never a skip), appends capability_class_findings, and fails when ontheloop/platform.yaml (beside docs/)
      carries a capability_class key while the rows' current_home is null (the reader reads the row default; T4.24 c16
      moves the reader first, as the gates rows' guard does).
  - file: .claude/skills/consult/SKILL.md
    action: Modify
    purpose: >-
      Created by rec-5644. Every model: "fable" in the description and the Dispatch section becomes "the consult class's
      model (project-configuration.yaml row capability_class.classes)"; no model literal remains. No other change.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      The consult skill's S4 entry (registered by rec-5644 at its measured bytes, zero headroom) rises to the measured
      bytes after this edit, keeping rec-5644's "# raise-approved: dec-229 ..." marker on the line
      (validate_prose_budget_raises); measure with wc -c on the rec-5644-built file before and after. The planning and
      implement entries drop to their measured bytes (ratchet; a decrease is unrestricted). If the marker is refused,
      stop: plan defect.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Contested-residue consult line only (not a gated section): "consult `model: "fable"` per the `consult` skill"
      becomes "dispatch a consult per the `consult` skill"; the rest of the line unchanged. The prose_budgets entry
      ratchets down only if the measured-size rule requires it.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Deviation branch (a): "dispatch a `model:"fable"` consult per `.claude/skills/consult/SKILL.md`" becomes "dispatch
      a consult per `.claude/skills/consult/SKILL.md`". Nothing else.
  - file: tests/test_llm_tier_selection.py
    action: Modify
    purpose: >-
      Real-tree test asserts each selection's effort equals its class row's (decision_scout low, plan_critic primary max,
      code_reviewer high); new tests for the capability_class refusals and every capability_class_findings breach,
      including rule (a); the two persona_settings tests mutate the classes row.
  - file: tests/test_llm_litellm_transport.py
    action: Modify
    purpose: The thinking-disabled helper mutates the classes row of the last persona's class instead of the persona block.
  - file: tests/checks/contracts/test_validate_inference_provider_registry.py
    action: Modify
    purpose: >-
      _copy_real_contracts also copies executor-personas.yaml. TestCapabilityClass over copies of the real contracts:
      real tree passes; a registry persona with no member fails; rule (a) breach fails; a platform.yaml capability_class
      key fails while current_home is null; executor-personas.yaml absent, unparseable or without a personas list each
      fails naming the file; a non-mapping defaults, classes entry or role and a non-string member value each become a
      finding, not an exception; the leg still reports when the tier-selection leg refused.
  - file: tests/test_consult_skill_contract.py
    action: Modify
    purpose: >-
      New test_no_skill_or_contract_hard_codes_the_consult_model: under .claude/skills and docs/contracts, no file holds
      model: "fable" or model:"fable" (whitespace collapsed); the consult skill names capability_class.classes. The
      rec-5644 description assert that pins model: "fable" becomes the class phrase.
  - file: tests/test_scope_boundary_contract.py
    action: Modify
    purpose: >-
      test_implement_skill_deviation_trigger_has_three_branches_and_pointers: the 'model:"fable"' pointer assert becomes
      an assert that consult/SKILL.md is named and no model literal is; every other assertion unchanged.
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      test_contested_residue_consult_names_its_dispatch_carrier: the 'model: "fable"' in-consult assert becomes an assert
      that the line names the consult skill; the dispatched-carrier and no-'model:"fable"' asserts stay.
bundled_recommendations: [rec-5646]
followon_recs: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - Each verdict persona resolves thinking and effort from its class row (tests/test_llm_tier_selection.py::test_settings_come_from_capability_class).
  - The registry check enforces membership, vocabulary and rule (a) (tests/checks/contracts/test_validate_inference_provider_registry.py::TestCapabilityClass).
  - No skill or contract hard-codes the consult's model (tests/test_consult_skill_contract.py::test_no_skill_or_contract_hard_codes_the_consult_model).
  - Contract drift, size, project-configuration and prose checks pass; tests/test_llm_litellm_transport.py is NEAR_CAP (479 of 500 SLOC), so the helper edit must not grow it past 500; validate --pre passes and the full tier passes before hand-off.
  - rec-5646 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the acceptance and retargeted test nodes.
    command: bin/venv-python -m pytest tests/test_llm_tier_selection.py::test_settings_come_from_capability_class tests/test_llm_tier_selection.py::test_real_tree_resolves_every_persona_and_role tests/checks/contracts/test_validate_inference_provider_registry.py::TestCapabilityClass tests/test_consult_skill_contract.py::test_no_skill_or_contract_hard_codes_the_consult_model tests/test_scope_boundary_contract.py::TestProseSurfacesPointAtContract tests/test_workflow_skill_antidrift.py::test_contested_residue_consult_names_its_dispatch_carrier -q
    expected: All pass; the summary reads passed with no failed or error.
    fix_if: A failure names the persona, row or phrase; fix the source, never loosen an assertion (Decision 181).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Default-collected test files that every full tier already runs; a registry row would duplicate them.
  - step: 2
    phase: pre-deploy
    action: Resolve every persona and role on the real tree and print the class-derived settings.
    command: bin/venv-python -m scripts.llm.tier_selection --check
    expected: Exit 0; decision_scout lines show effort low, plan_critic primary shows effort max, code_reviewer shows effort high.
    expected_literals: ["decision_scout primary deepseek/deepseek-flash thinking=enabled effort=low", "plan_critic primary deepseek/deepseek-flash thinking=enabled effort=max"]
    fix_if: A refusal names the rule; fix the row or the resolver.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The registry check's tier-selection leg already resolves every pair in every tier; step 1's real-tree test pins the values.
  - step: 3
    phase: pre-deploy
    action: After the build commit, the registered checks the edits touch.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as d;from
      scripts.checks.contracts.validate_inference_provider_registry import validate_inference_provider_registry as v;from
      scripts.checks.contracts.validate_project_configuration import validate_project_configuration as c;from
      scripts.checks.structural.size_limits import validate_structural_size_limits as h;from
      scripts.checks.prose.prose_limits import validate_prose_limits as j;from scripts.checks.prose.prose_budget_raises
      import validate_prose_budget_raises as i;f=[];[g(f) for g in (d,v,c,h,j,i)];assert not
      f,f;print('CAPABILITY-CHECKS OK')"
    expected: Exit 0 and the marker line.
    fix_if: A failing check names its row; fix it (size relief per the inference-provider scope row).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The six checks are registered and run in every tier.
  - step: 4
    phase: pre-deploy
    action: Full tier then HEAD attestation, after the build commit and rebase and before the push; started backgrounded from the top-level session with a 2 h limit (tests/test_aws_profile.py needs HOME as an empty dir).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The full tier exits 0 and --verify-head confirms the attestation names HEAD.
    fix_if: A failing check is fixed on the branch; a timeout is BLOCKED, never a push.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole-suite run, not a guard.
  - step: 5
    phase: post-deploy
    action: rec-5646 closed by the merge commit Resolves trailer.
    command: bin/venv-python -c "from src.common import ducklake_reader_client as rc;rows,m=rc.fetch_recs_by_ids(rc.make_reader(profile='agent_platform'),['rec-5646']);print(rows[0]['id'],rows[0]['status'])"
    expected: The line reads rec-5646 closed.
    fix_if: Still open after the closure job ran; read the trailer-acceptance verdict artifact for the node id.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Run every touched suite and the resolver's other consumers whole.
    command: bin/venv-python -m pytest tests/test_llm_tier_selection.py tests/test_llm_litellm_transport.py tests/test_llm_litellm_cold_start.py tests/checks/contracts/test_validate_inference_provider_registry.py tests/checks/contracts/test_validate_project_configuration.py tests/test_consult_skill_contract.py tests/test_scope_boundary_contract.py::TestProseSurfacesPointAtContract tests/test_workflow_skill_antidrift.py tests/persona_contracts/test_canary_persona.py tests/test_smoke_test_inference_credentials.py tests/checks/ci_guards/test__persona_verdict_keyed.py -q
    expected: All pass; the summary reads passed with no failed or error.
    fix_if: A failure names the persona, row or phrase; fix the source, never loosen an assertion (Decision 181).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Default-collected test files that every full tier already runs.
test_obligations:
