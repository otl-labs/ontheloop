schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "capability-class"
intent: >-
  Let a release choose a model and effort per persona for performance per cost (rec-5646): a capability_class axis
  (consult, reason, build, recall) assigns every persona and agent job a class, the class settings are user-set
  configuration homed in ontheloop/platform.yaml, the LiteLLM resolver reads each verdict persona's thinking and effort
  from its class, and no skill or contract hard-codes the consult's model.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-capability-class.yaml
phase: >-
  T4.32 (advances c1, the LiteLLM resolver's per-persona settings; closes no T4.32 criterion)
cites: [dec:173, dec:224, dec:275, dec:282]
scope:
  - file: docs/contracts/inference-provider.yaml
    action: Modify
    purpose: >-
      Mechanism only, no values. (1) New top-level capability_class block before vocabulary, one line per entry: a
      comment naming the two project-configuration.yaml rows that hold the values (project.capability_class.members and
      project.capability_class.classes); values [consult, reason, build, recall] in rank order (recall lowest);
      qualifies, one line per class, taken from rec-5646 (consult: frontier, paid for creativity and best-practice
      judgement, never hands-on work; reason: planning, critique, strategic judgement; build: precise instruction
      following bounded by deterministic checks; recall: facts, citations, completeness); claude_code_model_values
      [fable, opus, sonnet, haiku] with a trailing comment (the Claude Code Agent tool's model enum, a harness adapter's
      value, not the class's identity); effort_per_role, one line: a class is a level of judgement, and effort is set
      per failover role because each role's model needs its own effort to reach it (values in the classes row, never
      here); a model change on a role should revisit these efforts (UNENFORCED, no owner yet: the operator's long-term
      single config file holds model and effort together, 2026-11-26; tier_2's exact id moves only by a reviewed version
      bump, rec-5069; tier_1's alias can change release under one id, seen in the per-call served-model record); rec-5072
      owns the dual-run reset rule. rules, each rule and its why on ONE line
      ("...; why: ..."): (a) plan_critic ranks strictly above decision_scout, always (enforced; why: the critic's sweep
      for Decisions the scout missed is what keeps a cheap scout safe, operator 2026-11-26); (b) plan_critic preferably
      on a different model family from plan_agent (preference, unenforced; why: their blind spots then do not
      correlate); (c) step-up of code_reviewer and implement_agent for terraform, IAM, secrets, governance contracts and
      scripts/checks, and of implement_agent on a repeated fix-up round, a stalled continuation or an L/XL plan
      (UNENFORCED, rec-5657; why: a mistake there costs more and deterministic checks bound less; precedent model_routing
      effort_bands and file_pattern_floors); (d) canary_persona runs a release check at the class of the persona whose
      path it tests (UNENFORCED, rec-5662; its member row is build meanwhile; why: a drill proves only the settings it
      ran at), and the AI coordinator's class is undecided (Decision 241). One note line: model_routing.executor.roles
      is the gemini-era interim executor mechanism (T4.2), which capability_class neither reads nor replaces. (2)
      vocabulary.axes gains capability_class: values_ref capability_class.values, a one-line reserved_meaning, and a
      one-line do_not_use_for that also carries the orthogonality (a failover role or deploy tier, so never called a
      tier; a persona kind, to which it is orthogonal; or executor-personas.yaml capability_vocabulary, a persona's tool
      capabilities). (3) litellm_persona_selection.personas becomes the one-line list of persona names the LiteLLM lane
      serves [decision_scout, plan_critic, code_reviewer, canary_persona], and the trailing comment on
      litellm_persona_selection: is reworded to match (personas the LiteLLM lane serves; settings from their class row);
      the per-persona role settings leave; its note
      says thinking and effort come from the persona's class row and that the 2026-11-11 setting of effort high for
      every persona is replaced by the class settings (operator decision card 2026-11-25 21:36 UTC), within the note's
      current line count. (4) One amendment_log row at the top (schema_reshape, semantic_break true), and in the same
      change bin/venv-python -m scripts.checks.contracts.amendment_compact --rows 1 --write
      docs/contracts/inference-provider.yaml (Decision 282 cl.1). Size: NEAR_CAP (490 of 500 effective lines, 36,925 of
      49,152 bytes). A scratch draft of exactly this shape, spliced into a copy and measured with
      scripts.checks.structural._classify.effective_lines, is 498 lines and 38,890 bytes (critique r4 R4-02). Re-measure
      with plan_obligations on the edited file. If it passes 500, relief that keeps every rule's why: first shorten
      wording inside the new lines (never dropping a why, a rule or an owner); if still over, stop: plan defect (a
      sibling split is never improvised; never line-joining existing notes; never a budget raise).
  - file: docs/contracts/project-configuration.yaml
    action: Modify
    purpose: >-
      Two project rows after the gates rows, placed under project because no single adapter reads them (Decision 224
      cl.2: the LiteLLM resolver and the consult skill both do): project.capability_class.members, defaults local and cloud the same flow mapping {consult:
      consult, audit_executor: consult, plan_agent: reason, plan_critic: reason, implement_agent: build, code_reviewer:
      build, ci_rca: build, canary_persona: build, decision_scout: recall, recon: recall}; project.capability_class.classes,
      defaults local and cloud the same flow mapping of per-class settings: consult {claude_code_model: fable, primary {thinking enabled, effort max},
      warm_fetched_escape_hatch {thinking enabled, effort max}}; reason {claude_code_model: opus, primary {effort max},
      warm_fetched_escape_hatch {effort high}}; build {claude_code_model: sonnet, primary {effort high},
      warm_fetched_escape_hatch {effort high}}; recall {claude_code_model: haiku, primary {effort low},
      warm_fetched_escape_hatch {effort low}}; thinking enabled throughout; no model id (litellm_tier_models stays the
      sole home, Decision 173). Each row: kind project, basis "rec-5646; operator decision cards 2026-11-25 21:36 and 21:37 UTC; Decision 224 cl.6; under project
      because no single adapter reads it (the run_persona litellm resolver and the consult skill both do), until T4.24 c16
      places it",
      applies_when always, homes
      platform_file on local, ci and cloud, variable null, exports [], readers [scripts/llm/tier_selection.py,
      scripts/checks/contracts/validate_inference_provider_registry.py, .claude/skills/consult/SKILL.md], set_by user,
      this_repository {current_home: null, note, status open, owning_item T4.24:c16}, enforcement
      validate_inference_provider_registry. The members note: "no ontheloop/platform.yaml: this repository's value is
      this row's default, which scripts/llm/tier_selection.py reads for the LiteLLM personas; members with no LiteLLM
      persona (consult, audit_executor, plan_agent, implement_agent, ci_rca, recon) are read by nothing yet". The classes
      note: "... read today: the consult class's claude_code_model (the consult skill) and the reason, build and recall
      primary and warm_fetched_escape_hatch settings (the LiteLLM verdict and fixture personas); unread: the reason,
      build and recall claude_code_model (skill model pins, rec-5661) and the consult class's role settings (no LiteLLM
      consult persona yet, rec-5645)". The header's "No row holds a value" sentence adds the two capability_class rows to
      its exceptions. One terse amendment_log row at the top (field_add), and in the same change bin/venv-python -m
      scripts.checks.contracts.amendment_compact --rows 1 --write docs/contracts/project-configuration.yaml (Decision 282
      cl.1; the scout's dry run reports compactable=2).
  - file: scripts/llm/tier_selection.py
    action: Modify
    purpose: >-
      resolve() takes thinking and effort from the project.capability_class.classes row's
      defaults.local[members[persona]][role], members being the project.capability_class.members row's defaults.local;
      unknown_persona still means a name outside the litellm_persona_selection.personas list (a member row alone does
      not admit a persona); refuses with rule capability_class when either row is missing or not a mapping, the persona has no
      member row or a non-string one, a personas element is not a string, its class has no classes entry, or the role's settings are not a mapping; vocabulary refusals keep rule
      persona_settings. resolve_all() iterates the litellm_persona_selection.personas list. New pure
      capability_class_findings(inference_provider, project_configuration, registry_personas) never raises: it returns
      one string per breach, and any non-mapping or non-string shape (a row's defaults, a classes entry or role, a
      member value) is itself a finding. Breaches: a row missing or with defaults.local unequal to defaults.cloud; a
      member whose class is not a key of the classes row; a classes-row key outside inference-provider's
      capability_class.values; a classes entry whose role keys are not exactly primary and warm_fetched_escape_hatch,
      or whose role setting holds a key other than thinking and effort, or whose thinking or effort is outside
      litellm_persona_selection.vocabulary (every class, read or not); a claude_code_model
      value outside claude_code_model_values; a registry persona or a litellm_persona_selection persona with no member
      row; rule (a) (plan_critic's class does not rank strictly above decision_scout's). Under 500 SLOC.
  - file: scripts/checks/contracts/validate_inference_provider_registry.py
    action: Modify
    purpose: >-
      A capability_class leg with the tier-selection leg's gate: it runs whenever tier_model is a mapping (so the
      provider-defaults fixtures of TestGreenPath::test_matching_registry_passes,
      TestPassLineOutput::test_clean_fixture_prints_the_pass_line and
      TestTierSelectionLeg::test_fixture_without_tier_model_prints_no_second_line, which carry no tier_model, stay green
      unchanged), and runs whether or not the tier-selection leg refused. With tier_model present every breach is a
      finding naming the key or file, never a skip or an exception: an absent or non-mapping capability_class block; a
      values or claude_code_model_values that is absent, not a list, holds a non-string or a duplicate;
      executor-personas.yaml absent, unparseable, without a personas list, or with a personas entry that is not a
      mapping carrying a string persona (the key _verdict_personas reads). A member naming no persona passes by design (members include agent jobs such as
      ci_rca and recon). project-configuration.yaml absent or unparseable is reported naming the file (the tier leg's
      report is reused), never raised. It then appends capability_class_findings.
      platform.yaml is resolved as contracts_dir.parent.parent / "ontheloop" / "platform.yaml" (the repo root for the
      real tree); unparseable or non-mapping is a finding (as validate_project_configuration rule (l) does), and a
      project.capability_class key there while the rows' current_home is null is a finding (T4.24 c16 moves the reader
      first, as the gates rows' guard does).
  - file: .claude/skills/consult/SKILL.md
    action: Modify
    purpose: >-
      Created by rec-5644. Every model: "fable" in the description and the Dispatch section becomes "the consult class's
      model (project-configuration.yaml row project.capability_class.classes, defaults.local.consult.claude_code_model;
      ontheloop/platform.yaml once it exists)", with a one-line read command beside it (bin/venv-python -c that prints
      that key from the row) so a caller does not skip the lookup and inherit its parent's model; no model literal
      remains. No other change.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      The consult skill's S4 entry (registered by rec-5644 at its measured bytes, zero headroom) rises to the measured
      bytes after this edit, keeping rec-5644's "# raise-approved: dec-229 ..." marker on the line
      (validate_prose_budget_raises); measure with wc -c on the rec-5644-built file before and after. The planning and
      implement entries drop to their measured bytes (ratchet; a decrease is unrestricted). If the marker is refused,
      stop: plan defect.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Contested-residue consult line only (not a gated section): "consult `model: "fable"` per the `consult` skill"
      becomes "dispatch a consult per the `consult` skill"; the rest of the line unchanged. The prose_budgets entry
      ratchets down only if the measured-size rule requires it.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Deviation branch (a): "dispatch a `model:"fable"` consult per `.claude/skills/consult/SKILL.md`" becomes "dispatch
      a consult per `.claude/skills/consult/SKILL.md`". Nothing else.
  - file: tests/test_llm_tier_selection.py
    action: Modify
    purpose: >-
      Real-tree test asserts each selection's effort equals its class row's (decision_scout low, plan_critic primary max,
      code_reviewer high); new tests for the capability_class refusals and every capability_class_findings breach,
      including rule (a); a non-string member value is refused, not a TypeError; the two persona_settings tests mutate
      the classes row.
  - file: tests/test_llm_litellm_transport.py
    action: Modify
    purpose: The thinking-disabled helper mutates the classes row of the last persona's class instead of the persona block.
  - file: tests/checks/contracts/test_validate_inference_provider_registry.py
    action: Modify
    purpose: >-
      _copy_real_contracts builds tmp/docs/contracts and also copies executor-personas.yaml (its four existing callers,
      lines 196, 204, 224 and 233, pass that directory; their assertions are unchanged). TestCapabilityClass over copies of the real contracts:
      real tree passes; a registry persona with no member fails; rule (a) breach fails; a platform.yaml capability_class
      key fails while current_home is null; executor-personas.yaml absent, unparseable or without a personas list each
      fails naming the file; a non-mapping defaults, classes entry or role and a non-string member value each become a
      finding, not an exception; an absent capability_class block, a duplicate in values and an unparseable platform.yaml
      each fail; the leg still reports when the tier-selection leg refused; rule (a) fails for critic and scout in the same
      class and for the scout above the critic; an extra key in a role setting fails; a malformed executor-personas
      entry fails naming the file.
  - file: tests/test_consult_skill_contract.py
    action: Modify
    purpose: >-
      New test_no_skill_or_contract_hard_codes_the_consult_model: under .claude/skills and docs/contracts, no file holds
      a model literal for the consult, matched as (?<![\w])model:\s*"?fable (whitespace collapsed, so
      claude_code_model never matches); the consult skill names project.capability_class.classes. The
      rec-5644 description assert that pins model: "fable" becomes the class phrase.
  - file: tests/test_scope_boundary_contract.py
    action: Modify
    purpose: >-
      test_implement_skill_deviation_trigger_has_three_branches_and_pointers: the 'model:"fable"' pointer assert becomes
      an assert that consult/SKILL.md is named and no model literal is; every other assertion unchanged.
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      test_contested_residue_consult_names_its_dispatch_carrier: the 'model: "fable"' in-consult assert becomes an assert
      that the line names the consult skill; the dispatched-carrier and no-'model:"fable"' asserts stay.
bundled_recommendations: [rec-5646]
followon_recs: []
closes_criteria: []
infrastructure_dependencies: []
acceptance_criteria:
  - Each verdict persona resolves thinking and effort from its class row (tests/test_llm_tier_selection.py::test_settings_come_from_capability_class).
  - The registry check enforces membership, vocabulary and rule (a) (tests/checks/contracts/test_validate_inference_provider_registry.py::TestCapabilityClass).
  - No skill or contract hard-codes the consult's model (tests/test_consult_skill_contract.py::test_no_skill_or_contract_hard_codes_the_consult_model).
  - Contract drift, size, project-configuration and prose checks pass; tests/test_llm_litellm_transport.py is NEAR_CAP (479 of 500 SLOC), so the helper edit must not grow it past 500; validate --pre passes and the full tier passes before hand-off.
  - rec-5646 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the acceptance and retargeted test nodes.
    command: bin/venv-python -m pytest tests/test_llm_tier_selection.py::test_settings_come_from_capability_class tests/test_llm_tier_selection.py::test_real_tree_resolves_every_persona_and_role tests/checks/contracts/test_validate_inference_provider_registry.py::TestCapabilityClass tests/test_consult_skill_contract.py::test_no_skill_or_contract_hard_codes_the_consult_model tests/test_scope_boundary_contract.py::TestProseSurfacesPointAtContract tests/test_workflow_skill_antidrift.py::test_contested_residue_consult_names_its_dispatch_carrier -q
    expected: All pass; the summary reads passed with no failed or error.
    fix_if: A failure names the persona, row or phrase; fix the source, never loosen an assertion (Decision 181).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Default-collected test files that every full tier already runs; a registry row would duplicate them.
  - step: 2
    phase: pre-deploy
    action: Resolve every persona and role on the real tree and print the class-derived settings.
    command: bin/venv-python -m scripts.llm.tier_selection --check
    expected: Exit 0; decision_scout lines show effort low, plan_critic primary shows effort max, code_reviewer shows effort high.
    expected_literals: ["decision_scout primary deepseek/deepseek-flash thinking=enabled effort=low", "plan_critic primary deepseek/deepseek-flash thinking=enabled effort=max"]
    fix_if: A refusal names the rule; fix the row or the resolver.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The registry check's tier-selection leg already resolves every pair in every tier; step 1's real-tree test pins the values.
  - step: 3
    phase: pre-deploy
    action: After the build commit, the registered checks the edits touch.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as d;from
      scripts.checks.contracts.validate_inference_provider_registry import validate_inference_provider_registry as v;from
      scripts.checks.contracts.validate_project_configuration import validate_project_configuration as c;from
      scripts.checks.structural.size_limits import validate_structural_size_limits as h;from
      scripts.checks.prose.prose_limits import validate_prose_limits as j;from scripts.checks.prose.prose_budget_raises
      import validate_prose_budget_raises as i;f=[];[g(f) for g in (d,v,c,h,j,i)];assert not
      f,f;print('CAPABILITY-CHECKS OK')"
    expected: Exit 0 and the marker line.
    fix_if: A failing check names its row; fix it (size relief per the inference-provider scope row).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The six checks are registered and run in every tier.
  - step: 4
    phase: pre-deploy
    action: Full tier then HEAD attestation, after the build commit and rebase and before the push; started backgrounded from the top-level session with a 2 h limit (tests/test_aws_profile.py needs HOME as an empty dir).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The full tier exits 0 and --verify-head confirms the attestation names HEAD.
    fix_if: A failing check is fixed on the branch; a timeout is BLOCKED, never a push.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole-suite run, not a guard.
  - step: 5
    phase: post-deploy
    action: rec-5646 closed by the merge commit Resolves trailer.
    command: bin/venv-python -c "from src.common import ducklake_reader_client as rc;rows,m=rc.fetch_recs_by_ids(rc.make_reader(profile='agent_platform'),['rec-5646']);print(rows[0]['id'],rows[0]['status'])"
    expected: The line reads rec-5646 closed.
    fix_if: Still open after the closure job ran; read the trailer-acceptance verdict artifact for the node id.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Run every touched suite and the resolver's other consumers whole.
    command: bin/venv-python -m pytest tests/test_llm_tier_selection.py tests/test_llm_litellm_transport.py tests/test_llm_litellm_cold_start.py tests/checks/contracts/test_validate_inference_provider_registry.py tests/checks/contracts/test_validate_project_configuration.py tests/test_consult_skill_contract.py tests/test_scope_boundary_contract.py::TestProseSurfacesPointAtContract tests/test_workflow_skill_antidrift.py tests/persona_contracts/test_canary_persona.py tests/test_smoke_test_inference_credentials.py tests/checks/ci_guards/test__persona_verdict_keyed.py -q
    expected: All pass; the summary reads passed with no failed or error.
    fix_if: A failure names the persona, row or phrase; fix the source, never loosen an assertion (Decision 181).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Default-collected test files that every full tier already runs.
  - step: 7
    phase: pre-deploy
    action: Stale-reader sweep for the reshaped litellm_persona_selection block.
    command: grep -rln --include=*.py --include=*.yml --include=*.yaml litellm_persona_selection scripts src tests .github
    expected: Lists only scripts/llm/tier_selection.py, scripts/llm/litellm_cold_start.py, tests/test_llm_tier_selection.py and tests/test_llm_litellm_transport.py; any other reader is read and fixed or reported as a plan defect.
    fix_if: An unlisted reader indexes per-persona role settings.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A one-time sweep for this reshape (moment claim); the registry check and the full tier hold the readers after it.
test_obligations:
  - source: docs/contracts/inference-provider.yaml
    behavior: the capability_class mechanism (vocabulary, rank, rule a) and the personas list
    verification_step: 1
    test_selector: tests/checks/contracts/test_validate_inference_provider_registry.py::TestCapabilityClass
    red_green_expectation: red before (no capability_class block), green after
  - source: docs/contracts/project-configuration.yaml
    behavior: the members and classes rows hold the release's class settings
    verification_step: 1
    test_selector: tests/test_llm_tier_selection.py::test_settings_come_from_capability_class
    red_green_expectation: red before (no rows; decision_scout resolves high), green after
  - source: scripts/llm/tier_selection.py
    behavior: settings come from the persona's class; breaches are refused or reported
    verification_step: 1
    test_selector: tests/test_llm_tier_selection.py::test_settings_come_from_capability_class
    red_green_expectation: red before (settings read per persona), green after
  - source: scripts/checks/contracts/validate_inference_provider_registry.py
    behavior: the capability_class leg fails on a missing member, rule (a) or an unread platform.yaml key
    verification_step: 1
    test_selector: tests/checks/contracts/test_validate_inference_provider_registry.py::TestCapabilityClass
    red_green_expectation: red before (no leg), green after
  - source: .claude/skills/consult/SKILL.md
