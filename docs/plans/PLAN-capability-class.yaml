    verification_step: 3
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as d;from
      scripts.checks.contracts.validate_inference_provider_registry import validate_inference_provider_registry as v;from
      scripts.checks.contracts.validate_project_configuration import validate_project_configuration as c;from
      scripts.checks.structural.size_limits import validate_structural_size_limits as h;from
      scripts.checks.prose.prose_limits import validate_prose_limits as j;from scripts.checks.prose.prose_budget_raises
      import validate_prose_budget_raises as i;f=[];[g(f) for g in (d,v,c,h,j,i)];assert not
      f,f;print('CAPABILITY-CHECKS OK')"
    red_green_expectation: red before (the grown skill exceeds its entry), green after
  - source: .claude/skills/planning/SKILL.md
    behavior: the contested-residue consult names no model literal
    verification_step: 1
    test_selector: tests/test_consult_skill_contract.py::test_no_skill_or_contract_hard_codes_the_consult_model
    red_green_expectation: red before (model "fable" literal), green after
  - source: .claude/skills/implement/SKILL.md
    behavior: deviation branch (a) names no model literal
    verification_step: 1
    test_selector: tests/test_consult_skill_contract.py::test_no_skill_or_contract_hard_codes_the_consult_model
    red_green_expectation: red before (model:"fable" literal), green after
constraints:
