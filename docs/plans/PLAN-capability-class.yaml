gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:bc4c20ebf22ed7a3bc43c7d7893c758ec61afd440af0dd2320ef51326927685c"}
  - {gate: decision-scout, round: 2, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:5b44b803e640a5567102f578932e382483ba02de576f4944f2743c3c4f87dfbb"}
pre_implementation_checklist:
  - Branch confirmed not on main
  - rec-5644's build PR is merged and the branch is rebased on it
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - docs/contracts/inference-provider.yaml and docs/contracts/project-configuration.yaml per their rows, then amendment_compact --rows 1 --write on each of the two contracts.
  - scripts/llm/tier_selection.py, scripts/llm/litellm_cold_start.py and the registry check per their rows.
  - The three skills per their rows; re-grep .claude/skills and docs/contracts for model literals.
  - The five test files per their rows.
  - Execute the Verification Plan; loop until each step passes; on an unrecoverable failure stop and report (Decision 55).
  - 'Report: what was implemented, verification results'
rollback: Revert the squash commit; the per-persona settings and the 2026-11-11 effort return with it.
