schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: capture-pin-live-main-base
intent: >-
  Record each cloud session's start commit (telemetry_sessions.checkout_base_sha, the back-validation key) from now on.
  The SessionStart capture pin hook resolves the merge-base against the default branch's live tip instead of a
  remote-tracking ref that, in a fresh cloud container, is days stale and sits in a shallow history, so the line no
  longer reads base=unknown (rec-4426). Every day without it is lost baseline for proving fixes (operator, 2026-11-17).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-capture-pin-live-main-base.yaml
phase: >-
  T3.4 prerequisite capture (c1, "telemetry delta proves fix"): starts recording the session start commit the
  fix-proof exposure test keys on. Closes no exit criterion, so closes_criteria is empty.
closes_criteria: []
cites: [dec:163, dec:176, dec:189, dec:244]
scope:
  - file: .claude/hooks/session_start_log_turn.sh
    action: Modify
    purpose: >-
      Rule PV-1's base resolution changes; the line grammar, checkout, dirty, the project_ref line, stdout, exit code
      and the no-index-refresh rule do not. One wall-clock deadline (bash SECONDS) of B seconds from the hook's start
      bounds the whole base resolution, including every git call in it; each of those calls runs under
      timeout min(5, remaining) and none starts once the deadline has passed. New order: (1) read the default
      branch's live tip with one `git -C "$repo" ls-remote --exit-code origin refs/heads/main` (read-only, no local
      write); (2) when it yields a sha S, base is `git merge-base HEAD S`, accepted at once when it equals HEAD or S (a
      direct ancestry fact, exact even in a shallow history) and otherwise only when `git rev-parse
      --is-shallow-repository` prints false; (3) WAIT TRIGGER: only when that first attempt is unresolved AND the
      repository was shallow at the hook's start (the fresh-container state, while session_start_deepen_history and
      session_start_sync_main are fetching) AND GITHUB_ACTIONS is not "true", it re-tries once a second until the
      deadline, then prints base=unknown, never the tracking ref; otherwise (a full clone, a test run, CI) it prints
      unknown at once, so tests/hooks/test_session_start_log_turn.py's in-place runs never wait; (4) only when the
      live read fails (no origin remote, offline) does it keep today's `git -C "$repo" merge-base HEAD origin/main`.
      B is 10 by default (deepen_history measured --unshallow at 2.9 s; in this thread's start every sibling hook had
      finished 6.9 s after the pin hook ran); a --base-wait-seconds=<0..60> argument overrides it for tests, any other
      value reads as 10; settings.json does not pass it, so no user-set setting is added (Decision 224). Worst case:
      base resolution ends by B plus at most one second, plus the existing 5 s status call, so the hook ends within
      about 16 s. Shape limits from the existing structural test: no `read `, no `cat`, no `<<` in non-comment lines,
      exactly one `>&2`, and the literal fallback line kept (parse ls-remote with parameter expansion,
      e.g. "${out%%[[:space:]]*}"). Header comment updated to say all of this and to name rec-4426.
    new_imports: []
  - file: tests/telemetry/test_session_start_log_turn_base.py
    action: Create
    purpose: >-
      rec-4426's named acceptance file. Builds a bare origin and a clone in tmp_path (no network) and runs a copy of
      the hook. Nodes: test_base_resolved_when_origin_main_fetched_late (the cloud case: origin/main tracking ref
      stale at an older commit, HEAD at the live tip, so today's script prints the stale commit or unknown; the new
      one prints the live tip); test_base_waits_for_a_late_fetch_of_the_live_tip (HEAD on a work branch, the live tip
      one commit ahead and absent locally, a background `git fetch origin main` after about 1 s; prints the fork
      commit within the bound; the clone starts shallow so the wait trigger holds); test_unresolvable_live_tip_prints_
      unknown_not_the_tracking_ref (shallow clone, the live tip never arrives, --base-wait-seconds=1; base=unknown
      although origin/main resolves, elapsed at least 1 s); test_full_clone_does_not_wait (same but a full clone and
      --base-wait-seconds=5: unknown in under 3 s); test_ci_does_not_wait (shallow, GITHUB_ACTIONS=true,
      --base-wait-seconds=5: unknown in under 3 s); test_no_origin_remote_keeps_the_tracking_ref (the existing local
      behaviour); test_invalid_wait_values_keep_a_well_formed_line (61, -1, "x" with S local: the line is well formed,
      exit 0, base is S). Every node sets its subprocess environment explicitly (GITHUB_ACTIONS removed unless the node
      sets it). The existing one-ref-flag rule for --project-ref is unaffected by the new argument.
    new_imports: []
bundled_recommendations: [rec-4426]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    With a stale origin/main tracking ref and HEAD at the default branch's live tip, the hook prints base=<live tip>;
    with the live tip unreachable it prints base=unknown, never the stale ref; with no origin remote it prints what
    it prints today.
  - "tests/hooks/test_session_start_log_turn.py passes unedited (pin line grammar, one stderr write, no index refresh)."
  - >-
    After the merge, the first session started on the merged main has a pin line whose base is a sha equal to
    `git merge-base HEAD origin/main` read later in that session, and rec-4426 is closed by the squash's Resolves
    trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The cloud case resolves the live tip (rec-4426 acceptance).
    command: bin/venv-python -m pytest "tests/telemetry/test_session_start_log_turn_base.py::test_base_resolved_when_origin_main_fetched_late" -q
    expected: >-
      exit 0. Red before: at plan-PR replay (Decision 189) the file is absent (target_absent); against the unchanged
      hook the node fails on the stale tracking commit.
    fix_if: base reads the tracking ref (step order wrong) or unknown (ls-remote parse or the ancestry shortcut)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: capture-pin-base-from-live-main
  - step: 2
    phase: pre-deploy
    action: The whole new file passes (late fetch, unknown not tracking ref, shallow, no remote, bound values).
    command: bin/venv-python -m pytest tests/telemetry/test_session_start_log_turn_base.py -q
    expected: exit 0
    fix_if: a node fails; fix the hook, never the node's expectation
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Step 1 graduates the acceptance node; the full tier runs this whole file on every main run.
  - step: 3
    phase: pre-deploy
    action: >-
      The existing hook suite still passes unedited, and stays fast: its in-place runs of the real hook now make one
      live ls-remote each (about 0.3-0.8 s measured) but never wait, because this checkout is not shallow and CI sets
      GITHUB_ACTIONS.
    command: bin/venv-python -m pytest tests/hooks/test_session_start_log_turn.py -q --durations=5
    expected: exit 0, and no single test duration above 10 s in the durations report (record the slowest in the PR body)
    fix_if: >-
      a duration near the 30 s subprocess timeout means the wait trigger fired outside a shallow fresh start; the
      grammar, the single stderr write or the literal origin/main fallback line changed
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Existing nodes already guarded by the turn-capture-hook-labels shard and the full tier; the run needs the live origin.
  - step: 4
    phase: pre-deploy
    action: >-
      In this real cloud container, the edited hook against a scratch shallow clone whose tracking ref is stale prints
      the live merge-base, not the stale ref.
    command: >-
      D="$(mktemp -d)" && git clone -q --depth 50 "file://$PWD" "$D/r" && OLD="$(git -C "$D/r" rev-parse HEAD~40)" &&
      git -C "$D/r" update-ref refs/remotes/origin/main "$OLD" &&
      git -C "$D/r" remote set-url origin "$(git remote get-url origin)" && mkdir -p "$D/r/.claude/hooks" &&
      cp .claude/hooks/session_start_log_turn.sh "$D/r/.claude/hooks/" &&
      L="$(bash "$D/r/.claude/hooks/session_start_log_turn.sh" 2>&1 >/dev/null | head -1)" && echo "$L" &&
      B="${L#*base=}" && B="${B%% *}" && test "$B" != "$OLD" &&
      { test "$B" = unknown || test "$B" = "$(git merge-base HEAD "$(git ls-remote origin refs/heads/main | cut -f1)")"; }
    expected: >-
      prints the pin line and exits 0: base is the build branch's merge-base with main's live tip (or unknown when that
      tip is newer than this container's objects), never the HEAD~40 commit; record the line in the PR body.
    fix_if: exit 1 with base equal to the HEAD~40 commit (the tracking ref was used despite a live tip)
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and step 1 carries the durable regression.
  - step: 6
    phase: post-deploy
    action: >-
      The first session STARTED on the merged main (a new thread, not the build session, whose hooks loaded from the
      older checkout) reads its own pin line and compares it with the merge-base read later in that session.
    command: >-
      T="$(ls -t ~/.claude/projects/*/*.jsonl | head -1)" && L="$(grep -o 'capture pin checkout=[0-9a-f]* base=[0-9a-z]*' "$T" | head -1)" &&
      echo "$L" && test "${L##*base=}" = "$(git merge-base HEAD origin/main)"
    expected: >-
      prints the line and exits 0 (base is a sha equal to the merge-base); the coordinator relays the line from the
      next new thread's first status.
    fix_if: base=unknown in a session started on the merged main; read the hook's timing against sync_main and file a rec, fix forward
    hermetic: false
  - step: 7
    phase: post-deploy
    action: rec-4426 is closed by the merge's Resolves trailer, its closure_artifact shard resolving once the graduated shard is on main.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-4426']); print(rows[0]['id'], rows[0]['status'])"
    expected: prints rec-4426 closed after the closure job runs on the merge commit; record that run id.
    fix_if: >-
      still open: read the closure job's log for a refusal marker; never close it with a direct status write after a
      Decision 186 refusal.
    hermetic: false
test_obligations:
  - source: .claude/hooks/session_start_log_turn.sh
    behavior: base comes from the live default-branch tip, waits boundedly, never falls back to a tracking ref once a live tip is known
    verification_step: 1
    test_selector: tests/telemetry/test_session_start_log_turn_base.py::test_base_resolved_when_origin_main_fetched_late
    red_green_expectation: red before (stale tracking commit printed), green after
constraints:
  - "Offline fallback tension (stated, not hidden): when the live read fails the hook keeps today's tracking-ref merge-base, which can be older than main at that start (a false negative for back-validation, never a false positive); the contract's 'never guessed' is fully met only on the live path. Kept because it is today's behaviour, operator-approved with this plan, and the cloud path no longer uses it."
  - "The pin line grammar is unchanged, so src/turn_capture/provenance.py, PARSER_VERSION and every contract stay untouched; checkout_base_sha's contract text (telemetry_sessions.yaml) already reads 'the merge-base of the checkout with the repository's default branch at that start ... NULL when it could not be resolved, never guessed'."
  - "The hook writes nothing locally: ls-remote and merge-base only; no fetch, no ref update, no index refresh (it runs beside session_start_sync_main and session_start_deepen_history, which do write)."
  - "No existing assertion is loosened (Decision 235); tests/hooks/test_session_start_log_turn.py is not edited."
  - "No rescue agents or workaround loops (Decision 55)."
