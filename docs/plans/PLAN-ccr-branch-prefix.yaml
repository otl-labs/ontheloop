- source: scripts/checks/ci_guards/validate_pr_conflict_signal.py
  behavior: The shape rule admits a hyphen-terminated token and still rejects a token with no trailing separator.
  verification_step: 3
  test_selector: tests/checks/ci_guards/test_validate_pr_conflict_signal.py::TestBranchPrefixDeclaration::test_declaration_hyphen_terminated_token_passes
  red_green_expectation: >-
    Red before: the old rule fails ccr- with 'missing trailing /'. Green after, while the bare-token node stays red-case
