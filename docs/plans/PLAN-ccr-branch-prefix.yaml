- source: scripts/ci/pr_conflict_signal.sh
  behavior: A ccr-*-headed PR is in the declared sweep population; it is polled, woken when CONFLICTING, and tallied.
  verification_step: 2
  test_selector: tests/test_pr_conflict_signal_wiring.py::TestDeclaredPrefixSelection::test_declared_prefixes_admit_a_ccr_harness_branch
  red_green_expectation: >-
    Red before: the node is absent (pytest exit 4); on the old declaration the head is unmatched and never polled. Green
