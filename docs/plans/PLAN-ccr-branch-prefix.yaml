- source: config/agent/verification_registry/entries/ci-signal-green-predicate-matches-sweep-declaration.yaml
  behavior: ci.yml's predicate and the sweep declaration name the same full-token prefix set, which includes ccr-.
  verification_step: 7
  command: bin/venv-python -m scripts.validate
  waiver_reason: >-
    A registry row is itself a standing check. Its own test is validate_verification_registry's differential admission
    gate, which the full tier runs and step 6 runs directly, proving the row fails on origin/main and passes on HEAD.
- source: docs/contracts/verification-registry.yaml
  behavior: governance_notes records the two in-place row edits as claim-preserving and claim-additive, keeping their check_ids.
  verification_step: 7
  command: bin/venv-python -m scripts.validate
  waiver_reason: >-
    A prose-only governance note plus an amendment_log entry, with no executable behavior. The contract's schema and
    amendment ritual are guarded by the full tier's contract checks. The row edits it documents are proven by step 6's
    differential admission run.
- source: config/agent/verification_registry/entries/handoff-gate-admits-ccr-session-branch.yaml
  behavior: Registry row for the graduated step-1 check.
  verification_step: 7
  command: bin/venv-python -m scripts.validate
  waiver_reason: >-
    Verification-registry metadata for step 1's graduation. Its standing checks are validate_verification_registry's
    differential admission gate (the node is absent on origin/main) and validate_graduation_completeness.
- source: config/agent/verification_registry/entries/conflict-sweep-wakes-ccr-session-branch.yaml
  behavior: Registry row for the graduated step-2 check.
  verification_step: 7
  command: bin/venv-python -m scripts.validate
  waiver_reason: >-
    Verification-registry metadata for step 2's graduation. Its standing checks are validate_verification_registry's
