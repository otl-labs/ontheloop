schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ccr-branch-prefix
intent: >-
  Let agents push again from the harness's renamed session branches. The CC-web harness now names session branches
  ccr-<8hex>-<6alnum> (e.g. ccr-679d754f-m99ugp), outside git-ops.yaml's declared agent_branch_prefixes, so the
  Decision 203 handoff gate denies every push and PR from them, and neither PR wake signal (CI green, merge conflict)
  would fire for them. Add ccr- to the declared set and to both wake consumers, and repair the three slash-only shape
  rules that a hyphen-terminated prefix trips. Operator-directed simplest fix (rec-4257, rec-4193); the self-registration
  migration is deferred to owned follow-on rec-4266.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-ccr-branch-prefix.yaml
phase: >-
  Operator-directed fix for rec-4257 and rec-4193 (Benjamin, 2026-10-11). No tier_item: an ad_hoc_rec soft-warn exception that claims,
  moves and closes no tier_item criterion.
scope:
- file: docs/contracts/git-ops.yaml
  action: Modify
  purpose: >-
    branching_topology.agent_branch_prefixes becomes ["agent/", "claude/", "ccr-"]. agent_branch_prefixes_reversal keeps
    trigger (a) verbatim and records that triggers (b) and (c) have both fired and are reviewed here. (b): the harness's
    ccr- rename is the second measured miss of the prefix discriminator, first measured 2026-10-06 on ccr-43776a06-et0u4a
    (rec-4193) and re-measured 2026-10-10 (rec-4257). The literal ccr-43776a06 must appear in this clause, because
    rec-4193's acceptance greps git-ops.yaml for it. (c): it fired on 2026-09-26, when the Decision 203 handoff gate
    became the set's third structural consumer. Both were resolved 2026-10-11 at operator direction by extending the
    declared set, with the self-registration migration owned by rec-4266. Both are re-armed: (b) as any further measured
    miss, (c) as the next change that would add a fourth consumer. agent_branch_prefixes_rationale's consumer list gains
    the Decision 203 handoff gate's destination rule (scripts/session/handoff_evidence.py, read from origin/main).
    contract.contract_version goes 6 -> 7. Add a new one-line flow-mapping amendment_log entry at the head: date, semantic_break
    true, change_class accepted_values_extend, a summary naming PLAN-ccr-branch-prefix, rec-4257 and rec-4193. The file is at 498
    of the contracts class's 500 effective lines (Decision 166), so compact older amendment_log entries until the file is
    at or under 500, starting with the 2026-09-26 PLAN-ducklake-partition-layout-remediation entry. Turn it into a
    one-line flow mapping with the same date/semantic_break/change_class and a shortened summary, never a budget raise.
    Only strings under agent_branch_prefixes* keys may contain the literal claude-slash token (registry row
    git-ops-carries-no-stale-prefix-premise), so the new amendment summary and reversal clause must not spell it.
- file: scripts/ci/pr_conflict_signal.sh
  action: Modify
  purpose: >-
    _WAKE_HEAD_PREFIXES=("agent/" "claude/" "ccr-"). _WAKE_HEAD_PREFIXES_TRANSITIONAL stays ("claude/"). ccr- is the
    live harness prefix, not a retirement candidate. No logic change: the case "$prefix"* match, the per-prefix tally
    and the unmatched-heads summary already handle a hyphen-terminated prefix.
- file: .github/workflows/ci.yml
  action: Modify
  purpose: >-
    signal-green's if: gains "|| startsWith(github.head_ref, 'ccr-')" inside the existing parenthesised disjunction. Its
    comment already points at the declared set and is left unchanged.
- file: scripts/checks/ci_guards/validate_pr_conflict_signal.py
  action: Modify
  purpose: >-
    The declared-prefix shape rule accepts a token ending in either separator, through a module constant
    _PREFIX_TERMINATORS = ("/", "-") used as token.endswith(_PREFIX_TERMINATORS). Empty, duplicate, unconsumed, prose-only
    and bare (no trailing separator) declarations still fail. The failed-list text becomes "pr-conflict-signal:
    branch-prefix declaration malformed (token missing trailing / or -)", which keeps the substring the existing
    test_declaration_malformed_missing_slash_fails matches. Comments and the _assert_prefix_declaration docstring say
    separator-terminated instead of slash-terminated. The module stays value-agnostic: no agent-slash, claude-slash or ccr-
    literal (registry row conflict-signal-guard-asserts-shape-not-value).
- file: config/agent/verification_registry/entries/git-ops-branching-prefixes-match-sweep-declaration.yaml
  action: Modify
  purpose: >-
    check_spec.command switches the script-side extraction to every double-quoted token of the _WAKE_HEAD_PREFIXES
    declaration (re.findall(r'"([^"]+)"', body)). Today's slash-only regex drops ccr-, so the contract==script equality
    would go red after this change. The equality and the reversal-clause assertions are kept, and one assertion is added:
    'ccr-' in the script set. Differential admission gate (Decision 132): this fails on origin/main (no ccr-) and passes
    on HEAD. check_id, guard_target, plan_slug, graduated_at and graduated_by are unchanged.
- file: config/agent/verification_registry/entries/ci-signal-green-predicate-matches-sweep-declaration.yaml
  action: Modify
  purpose: >-
    Same full-token extraction for the script side. The ci.yml side becomes re.findall("head_ref, *'([^']+)'", ...),
    which is blind to no token shape. The ci==script equality is kept and 'ccr-' in the ci set is added. Today's
    slash-only regexes would pass vacuously after this change, because they are blind to ccr- on both sides. It fails on
    origin/main and passes on HEAD; identity fields are unchanged.
- file: docs/contracts/verification-registry.yaml
  action: Modify
  purpose: >-
    governance_notes gains one paragraph covering the two in-place row edits above. Each is claim-PRESERVING (the set-parity
    claim is unchanged) and claim-ADDITIVE: full-token extraction closes the slash-only vacuous pass, and ccr- membership
    is the discriminating assertion. Per this file's check_id semantics and the ci-rca-lifecycle-records-watched-set
    precedent, both keep check_id, plan_slug and graduated_at. Add a newest-first amendment_log entry: change_class
    governance_note_add, semantic_break false (the 2026-09-25 precedent shape). The file is at 404 effective lines.
- file: tests/test_session_handoff_evidence.py
  action: Modify
  purpose: >-
    Add a MODULE-LEVEL node test_a_ccr_harness_session_branch_is_an_allowed_destination, not inside a class, because
    rec-4257's acceptance is that exact id. It builds a repo with _make_repo(tmp_path), commits the REAL working-tree
    docs/contracts/git-ops.yaml over the seeded one with _commit_file and pushes main, so origin/main carries the real
    contract. It opens a ccr-679d754f-m99ugp worktree with _new_branch_worktree, commits docs/plans/PLAN-probe.yaml, and
    asserts handoff_evidence.decide_bash(parse_canonical("git push -u origin HEAD"), wt) returns kind pass, rule exempt.
    It also asserts handoff_evidence._dst_allowed("random-branch", handoff_evidence.destination_prefixes(wt)) is False,
    so undeclared heads stay denied against the real contract. On the old contract the push returns deny/destination.
    The file is 490 SLOC and must stay at or under 500. The node is about 10 SLOC with a # comment rather than a
    docstring, and _common joins the existing "from scripts.checks import validation_result" line. Critique round 1
    simulated the base node under ruff format and measured 499. Hoisting test_real_contract_exempt_clause_parses' two
    function-local imports into the module import block (net -1) pays for the denial assertion (+1). If the file would
    still exceed 500, STOP and amend this plan's scope: the Decision 128 route is moving TestCli to a sibling test module,
    and that module is not in this scope. Never raise a budget.
- file: tests/test_pr_conflict_signal_wiring.py
  action: Modify
  purpose: >-
    (a) TestDeclaredPrefixSelection::test_declared_prefixes_admit_a_ccr_harness_branch, parametrized over ARGVS. gh pr
    list returns one ccr-679d754f-m99ugp head at sha241 with CONFLICTING mergeability and empty comments. It asserts
    the head is polled once, the wake comment is posted, the head is absent from the unmatched-heads summary, and the
    stdout tally names ccr-=1. (b) New class TestSignalGreenPredicate::test_signal_green_admits_every_declared_prefix.
    It yaml.safe_load-s the real .github/workflows/ci.yml and extracts the startsWith(github.head_ref, '...') tokens from
    jobs['signal-green']['if']. It parses the real script's declaration with
    scripts.checks.ci_guards.validate_pr_conflict_signal's _join_continuations, _parse_prefix_array and
    _PREFIX_DECLARATION_RE. It asserts the two sets are equal and that ccr-679d754f-m99ugp starts with one ci token. 377
    SLOC at plan time; stays at or under 500.
- file: tests/checks/ci_guards/test_validate_pr_conflict_signal.py
  action: Modify
  purpose: >-
    TestBranchPrefixDeclaration gains two nodes. test_declaration_hyphen_terminated_token_passes: _VALID_SCRIPT with the
    declaration ("agent/" "claude/" "ccr-") yields no failure, and the validator module's own source text carries no
    'ccr-' literal, so the harness token is admitted by shape and never special-cased (acceptance criterion 4). test_declaration_bare_harness_token_fails: ("agent/" "ccr")
    still fails with 'missing trailing'. These are the red cases Decision 181's note asks for. Existing nodes are unchanged.
- file: config/agent/verification_registry/entries/handoff-gate-admits-ccr-session-branch.yaml
  action: Create
  purpose: >-
    Verification-registry row for graduated VP step 1. check_id handoff-gate-admits-ccr-session-branch (filename equals
    check_id, Decision 176), primitive_slot command_exit_zero, check_spec.command is step 1's pytest node.
    guard_target is docs/contracts/git-ops.yaml (scalar), guard_symbol null, plan_slug ccr-branch-prefix, graduated_by
    implement-agent.
- file: config/agent/verification_registry/entries/conflict-sweep-wakes-ccr-session-branch.yaml
  action: Create
  purpose: >-
    Verification-registry row for graduated VP step 2. check_id conflict-sweep-wakes-ccr-session-branch,
    primitive_slot command_exit_zero, check_spec.command is step 2's pytest node. guard_target is
    scripts/ci/pr_conflict_signal.sh, guard_symbol null, plan_slug ccr-branch-prefix, graduated_by implement-agent.
bundled_recommendations:
- rec-4257
- rec-4193
followon_recs:
- rec-4266
- rec-4267
infrastructure_dependencies: []
acceptance_criteria:
- >-
  Once this is on main, a push or PR from a ccr-* harness session branch passes the handoff gate's destination rule.
  main, master and undeclared heads are still denied, and no gate code, override or exemption changed.
- >-
  The conflict sweep polls and wakes a ccr-*-headed PR and counts it in its prefix tally, and ci.yml's signal-green
  predicate admits a ccr-* head.
- >-
  The contract, the sweep declaration and the signal-green predicate name one prefix set. The two modified registry rows
  assert this over every quoted token, and both pass the differential admission gate (fail on origin/main, pass on HEAD).
- >-
  validate_pr_conflict_signal accepts a hyphen-terminated token, still rejects a token with no trailing separator, and
  carries no prefix literal.
- >-
  git-ops.yaml records that triggers (b) and (c) fired and were reviewed: (b) with both measurements (ccr-43776a06,
  rec-4193; rec-4257), and (c) with the handoff gate as the third consumer. It re-arms both, names the gate in the
  rationale's consumer list, and names rec-4266 as owner of the self-registration migration. It bumps contract_version 6 -> 7 with an accepted_values_extend entry and ends at or under 500 effective
  lines with no budget raise.
- >-
  rec-4257's acceptance node exists at exactly
  tests/test_session_handoff_evidence.py::test_a_ccr_harness_session_branch_is_an_allowed_destination. rec-4193's
  acceptance (grep for ccr-43776a06 in git-ops.yaml, plus a PLAN-*branch-prefix*.yaml file) passes. Both recs close
  through the squash commit's Resolves trailer.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Run rec-4257's acceptance node: the real contract, seeded as origin/main, admits a ccr-* worktree push through the
    real gate.
  command: >-
    bin/venv-python -m pytest tests/test_session_handoff_evidence.py::test_a_ccr_harness_session_branch_is_an_allowed_destination
    -q
  expected: >-
    Exit 0, 1 passed. Red before: the node is absent from the plan-PR tree (pytest exit 4, target_absent). With the node
    and the old contract the gate returns deny/destination (assertion_failed).
  fix_if: >-
    deny/destination: the working-tree contract lacks ccr-, or the test seeded the synthetic contract rather than the
    real one. deny/missing: the probe commit touched a non-exempt path; commit only under docs/plans/.
  hermetic: true
  graduation: graduate
  graduation_check_id: handoff-gate-admits-ccr-session-branch
  expected_literals:
  - 1 passed
- step: 2
  phase: pre-deploy
  action: >-
    Run the sweep node: a ccr-*-headed CONFLICTING PR is polled, woken and tallied under both argv forms.
  command: >-
    bin/venv-python -m pytest "tests/test_pr_conflict_signal_wiring.py::TestDeclaredPrefixSelection::test_declared_prefixes_admit_a_ccr_harness_branch"
    -q
  expected: >-
    Exit 0, 2 passed (production and hostile argv). Red before: the node is absent (pytest exit 4, target_absent). On the
    old script the head lands in the unmatched population and no wake is posted.
  fix_if: >-
    No mergeable poll: the declaration lacks ccr-, or a typo breaks the case match. The tally lacks ccr-=1: the
    prefix is missing from _WAKE_HEAD_PREFIXES itself.
  hermetic: true
  graduation: graduate
  graduation_check_id: conflict-sweep-wakes-ccr-session-branch
  expected_literals:
  - 2 passed
- step: 3
  phase: pre-deploy
  action: >-
    Run the ci.yml predicate parity node and the validator's shape nodes (the new hyphen-terminated pass, the new
    bare-token fail, the existing missing-separator fail).
  command: >-
    bin/venv-python -m pytest tests/test_pr_conflict_signal_wiring.py::TestSignalGreenPredicate::test_signal_green_admits_every_declared_prefix
    tests/checks/ci_guards/test_validate_pr_conflict_signal.py::TestBranchPrefixDeclaration::test_declaration_hyphen_terminated_token_passes
    tests/checks/ci_guards/test_validate_pr_conflict_signal.py::TestBranchPrefixDeclaration::test_declaration_bare_harness_token_fails
    tests/checks/ci_guards/test_validate_pr_conflict_signal.py::TestBranchPrefixDeclaration::test_declaration_malformed_missing_slash_fails
    -q
  expected: Exit 0, 4 passed.
  fix_if: >-
    The predicate node fails: ci.yml and the script declaration diverge; make the two sets equal. The hyphen node fails:
    _PREFIX_TERMINATORS is unused or lacks '-'. A bare-token node passes vacuously: the rule was dropped, not widened.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The ci.yml parity and ccr- membership are already guarded by the modified ci-signal-green-predicate-matches-sweep-declaration
    row, and the validator's live run on the real script by conflict-signal-guard-asserts-shape-not-value. Graduating
    these nodes would register duplicate guards.
  expected_literals:
  - 4 passed
- step: 4
  phase: pre-deploy
  action: >-
    Run every registry row that reads the prefix surfaces on HEAD: the two modified rows plus the three untouched rows
    that pin prefix literals and guard shape.
  command: >-
    bin/venv-python -c "import subprocess, yaml; ids = ['git-ops-branching-prefixes-match-sweep-declaration',
    'ci-signal-green-predicate-matches-sweep-declaration', 'git-ops-carries-no-stale-prefix-premise',
    'conflict-signal-guard-asserts-shape-not-value', 'no-surface-describes-sweep-as-claude-only']; rc = {i:
    subprocess.run(yaml.safe_load(open(f'config/agent/verification_registry/entries/{i}.yaml',
    encoding='utf-8'))['check_spec']['command']).returncode for i in ids}; assert set(rc.values()) == {0}, rc;
    print('PREFIX_ROWS_GREEN')"
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    git-ops-carries-no-stale-prefix-premise red: the new amendment summary or reversal clause spells the claude-slash
    token; reword it. conflict-signal-guard-asserts-shape-not-value red: the validator still rejects ccr- or gained a
    prefix literal. A modified row red: its extraction regex still drops hyphen tokens.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Runs five rows that are already registered standing checks; registering this aggregate would duplicate them.
  expected_literals:
  - PREFIX_ROWS_GREEN
- step: 5
  phase: pre-deploy
  action: >-
    rec-4193's acceptance passes verbatim, and the amended contract stays within the contracts class budget and keeps
    its version-bump and amendment conventions.
  command: >-
    grep -q 'ccr-43776a06' docs/contracts/git-ops.yaml && ls docs/plans/PLAN-*branch-prefix*.yaml && bin/venv-python -c
    "from pathlib import Path; import yaml; from scripts.checks.structural._classify import
    effective_lines; t = Path('docs/contracts/git-ops.yaml').read_text(encoding='utf-8'); d = yaml.safe_load(t); n =
    effective_lines(t); assert n <= 500, n; assert d['contract']['contract_version'] == 7, d['contract'];
    assert d['branching_topology']['agent_branch_prefixes'] == ['agent/', 'claude/', 'ccr-'];
    assert d['amendment_log'][0]['change_class'] == 'accepted_values_extend', d['amendment_log'][0];
    print('GIT_OPS_AMENDED_WITHIN_BUDGET')"
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    No ccr-43776a06 in the contract: the reversal clause dropped rec-4193's measurement. Over 500: compact another older
    amendment_log entry to one line (Decision 166 relief valve); never raise the budget.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    A one-time amendment-shape check. The structural size gate and validate_git_ops_contract already guard the budget
    and contract shape, pinning contract_version 7 would go red on the next legitimate bump, and rec-4193's acceptance
    is closed by this plan's own trailer evaluation.
  expected_literals:
  - docs/plans/PLAN-ccr-branch-prefix.yaml
  - GIT_OPS_AMENDED_WITHIN_BUDGET
- step: 6
  phase: pre-deploy
  action: >-
    Prove both modified registry rows pass the real differential admission gate (fail on an origin/main worktree, pass on
    HEAD) before CI's validate_verification_registry runs it.
  command: >-
    git fetch origin main --quiet && bin/venv-python -c "import yaml; from scripts import verification_graduation as g;
    ids = ['git-ops-branching-prefixes-match-sweep-declaration', 'ci-signal-green-predicate-matches-sweep-declaration'];
    out = {i: g.run_differential(yaml.safe_load(open(f'config/agent/verification_registry/entries/{i}.yaml',
    encoding='utf-8'))) for i in ids}; assert all(o.admitted for o in out.values()), {i: o.reason for i, o in
    out.items()}; print('MODIFIED_ROWS_ADMITTED')"
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    "revert did not produce FAIL (tautological)": the row lost its ccr- membership assertion. "does not pass on HEAD":
    fix the row or the surface it reads, never the gate.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: >-
    Full validation tier before handoff (Decision 163), on the committed, rebased, clean tree, followed by
    bin/venv-python -m scripts.checks.validation_result --verify-head exit 0 (git-ops.yaml handoff_sequence).
  command: bin/venv-python -m scripts.validate
  expected: >-
    Exit 0 and a final 'Validation Summary (scope: all)' PASS.
  fix_if: >-
    Fix the named check and rerun the full tier from the start; never raise a budget, skip a check or weaken an
    assertion. A timed-out or incomplete run is BLOCKED: resume and rerun from the start, never hand it to CI.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: >-
    After merge, the live gate reads the new prefix set from origin/main and admits a ccr-* destination.
  command: >-
    git fetch origin main --quiet && bin/venv-python -c "from pathlib import Path; from scripts.session import
    handoff_evidence as h; p = h.destination_prefixes(Path.cwd()); assert p is not None and
    h._dst_allowed('ccr-679d754f-m99ugp', p), p; assert not h._dst_allowed('main', p); print('LIVE_GATE_ADMITS_CCR', p)"
  expected: Exit 0; prints the marker and a prefix list that includes ccr- and audit/.
  fix_if: >-
    ccr- absent: origin/main does not carry the merged contract; confirm the squash merge landed and re-fetch.
- step: 9
  phase: post-deploy
  action: >-
    rec-4257 and rec-4193 are closed by the squash commit's Resolves trailer; follow-on rec-4266 stays open.
  command: >-
    bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f; st = {k: (f(k) or
    {}).get('status') for k in ('rec-4257', 'rec-4193', 'rec-4266')}; print(st); assert st == {'rec-4257': 'closed',
    'rec-4193': 'closed', 'rec-4266': 'open'}, st"
  expected: Prints the three statuses (closed, closed, open), exit 0.
  fix_if: >-
    A bundled rec is still open: confirm the squash body carries 'Resolves: rec-4257, rec-4193' and inspect ci.yml's closure job run on the merge
    commit.
test_obligations:
- source: docs/contracts/git-ops.yaml
  behavior: >-
    origin/main's agent_branch_prefixes admits the harness's ccr-* session branch as a gate destination, and main and
    undeclared heads stay denied.
  verification_step: 1
  test_selector: tests/test_session_handoff_evidence.py::test_a_ccr_harness_session_branch_is_an_allowed_destination
  red_green_expectation: >-
    Red before: the node is absent (pytest exit 4), and on the old contract the gate denies with rule destination. Green
