constraints:
- >-
  Scope is the files above. scripts/session/handoff_evidence.py, handoff_push_parse.py and both handoff_evidence_gate
  hooks stay untouched: the gate is data-driven from origin/main's contract (Decision 203), and git-ops.yaml stays
  never-exempt. No override, flag, env var or exemption is added (Decision 163 point 1, Decision 203 cl.3).
- >-
  Extend, do not migrate (operator direction, 2026-10-11). The repo-owned self-registration migration (wake label or
  body token) is owned by follow-on rec-4266 and is not started here. rec-4266 was filed at plan-write time and its
  start conditions were aligned to the re-armed triggers after critique round 1.
- >-
  claude-slash stays declared and transitional, since the bootstrap pushes use it and open PRs may carry it. agent-slash
  is unchanged (the frozen executor's namespace, Decision 67).
- >-
  ccr- is matched by plain prefix (startswith / case glob), consistent with every other declared prefix. No regex
  matcher is introduced on any consumer.
- >-
  The shape-rule change is a plan-time re-specification, not a softening to get green (Decision 181). It admits exactly
  one new terminator and keeps every existing red case, and step 3 adds a new bare-token red case.
- >-
  No SLOC or contracts budget raise (Decision 128, Decision 166). tests/test_session_handoff_evidence.py stays at or
  under 500 SLOC, and git-ops.yaml at or under 500 effective lines by amendment_log compaction.
- >-
  Never weaken (implement-scope-boundary CONTENT clause). No rescue agents or workaround loops (Decision 55).
context:
- >-
  Decision-scout verdict FLAGS_FOUND, all resolved in this plan. NOTE 76: the bootstrap pushes to a claude-slash
  destination are operator-authorized, one-time, and end at merge (next item). NOTE 181: the shape relaxation is a
  plan-time re-spec with a new bare-token red case. SPIRIT 191: the migration deferral is owned by a follow-on rec
  named in the reversal clause, and the per-run unmatched-head tally is asserted for a ccr- head (step 2). CITE 132
  (row edits keep check_ids): recorded in verification-registry.yaml governance_notes. CITE: 203, 132, 189, 166, 201.
  RELATED: 163, 67, 191, 167, 150, 168, 176, 187, 139, 76, 181. Decisions triaged: 167 of 167. Roadmap items
  intersected: 3; CONFLICT: 0; RELATED: 3
- "gates: decision-scout=FLAGS_FOUND (all resolved); plan-critique=PROCEED after 2 rounds (r1 REVISE: F1-F5 fixed, none disputed; r2 confirming PROCEED, optional N1 applied, N2 filed as rec-4267)"
- >-
  Bootstrap. Until this merges, origin/main's contract has no ccr-, so the gate denies every push and PR from a ccr-*
  branch, including exempt plan-only pushes, because the destination rule runs before the exemption rule. This plan's
  PR and the implementing PR are therefore each pushed as git push -u origin HEAD:claude/ccr-branch-prefix (plan) and
  HEAD:claude/ccr-branch-prefix-impl (implementation), on the operator's explicit authorization (Benjamin, 2026-10-11, this planning session). The
  src:dst refspec is a canonical form, so each push stays an ordinary gated push carrying evidence. Reuse the
  explicit refspec for later pushes: push.default=simple refuses a bare push to a differently-named upstream. If the
  implementing session is already on a declared-prefix branch, push normally.
- >-
  Hidden coupling: ccr- is the first hyphen-terminated prefix. Three slash-only rules trip on it: the validator's shape
  check, and the two registry rows' token regexes. The first row goes red; the second passes vacuously, blind to
  ccr-.
- >-
  No numbered Decision: an accepted_values_extend amendment plus the reversal-review record is contract field semantics
  (decision-entry.yaml significance routing; Decision 167/150).
- >-
  Related-Work check: no CI-RCA rec is open (ci_rca_open returned 0 rows on 2026-10-11). rec-4243, deferred at Step 6,
  has since closed (#1446).
- >-
  Preflight ran degraded: the recs reader returned 502 for bulk reads, so the aligned-rec search missed rec-4193 (the
  same ccr- rename, first measured 2026-10-06). Critique round 1 surfaced it, and it is bundled. The relevance gate,
  fed rows from the named rec_by_id read because the cache was unavailable, returned unknown (proceed) for both
  rec-4193 and rec-4257. Out-of-scope prose that still names the claude-slash prefix as the harness branch (the
  never_on_main.py deny message, audit.md, the implement skill) is owned by follow-on rec-4267.
pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- Only the plan-cited decision sections read
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  docs/contracts/git-ops.yaml: apply the scope row. Then measure with bin/venv-python -c "from pathlib import Path; from
  scripts.checks.structural._classify import effective_lines; print(effective_lines(Path('docs/contracts/git-ops.yaml').read_text()))"
  and compact amendment_log entries until the result is at most 500.
- >-
  scripts/ci/pr_conflict_signal.sh and .github/workflows/ci.yml: apply their scope rows.
- >-
  scripts/checks/ci_guards/validate_pr_conflict_signal.py and tests/checks/ci_guards/test_validate_pr_conflict_signal.py:
  apply both scope rows. Confirm 100% line coverage of the module with bin/venv-python -m pytest
  tests/checks/ci_guards/test_validate_pr_conflict_signal.py --cov=scripts/checks/ci_guards --cov-report=term-missing.
- >-
  The two modified registry rows and docs/contracts/verification-registry.yaml: apply their scope rows.
- >-
  tests/test_session_handoff_evidence.py and tests/test_pr_conflict_signal_wiring.py: apply their scope rows. Confirm
  each touched Python file is at or under 500 SLOC.
- >-
  config/agent/verification_registry/entries/handoff-gate-admits-ccr-session-branch.yaml and
  conflict-sweep-wakes-ccr-session-branch.yaml: create both rows per their scope rows (graduated_at = implement date).
- Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
- >-
  Code-review gate (implement skill), then the closure sequence, in order. (1) bin/venv-python -m
  scripts.session.github_readiness, reporting each state on its own. (2) Set implementation_declared: true. (3)
  Postflight evidence. (4) VP step 7's full tier on the committed, rebased, clean tree, then bin/venv-python -m
  scripts.checks.validation_result --verify-head exit 0. (5) Push per the Bootstrap context item, as its own call. (6) A
  PR with head = the pushed destination, whose squash body carries 'Resolves: rec-4257, rec-4193'. (7) CI green. (8)
  Squash-merge. Then VP steps 8 and 9 post-merge.
- >-
  Report readiness states, the validator verdict, the postflight evidence and the real push, PR and CI outcomes
  separately, plus what was implemented and each VP step's result.
work_areas: []
rollback: >-
  Revert the squash commit. Sessions on ccr-* branches are then denied again (the pre-change state); claude-slash
  bootstrap pushes remain available. No data, schema or deploy state is involved.
