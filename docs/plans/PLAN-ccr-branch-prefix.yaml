- source: .github/workflows/ci.yml
  behavior: signal-green's head_ref predicate names exactly the declared prefix set, including ccr-.
  verification_step: 3
  test_selector: tests/test_pr_conflict_signal_wiring.py::TestSignalGreenPredicate::test_signal_green_admits_every_declared_prefix
  red_green_expectation: >-
    Red before: on the old ci.yml (and old script) no token prefixes ccr-679d754f-m99ugp, so the assertion fails. Green
