        ("planner-read-tfstate", "agent-platform-github-ci-planner", "s3:GetObject", "tfstate/personal/sandbox/terraform.tfstate", "allowed"),
    ]
    got = {n: sim(r, v, k) for n, r, v, k, _ in rows}
    print(json.dumps(got))
    bad = [n for n, r, v, k, want in rows if got[n] != want]
    print("LIVE ROLES OK") if not bad else sys.exit("LIVE ROLES STOP " + ",".join(bad))
    EOF
