schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ci-claude-p-explicit-permissions
intent: >-
  CI's headless claude -p agents take their whole permission surface from their own command line, never from the
  repository's interactive-session .claude/settings.json, so a CLI bump or a workspace-trust change cannot silently widen,
  narrow or break what the CI RCA agent may do. The CI RCA agent is granted the read-only warehouse verbs and listing
  commands its instructions need, and its instructions and allow list are tested to agree. Keeps CI RCA, the alarm for
  every red on main, diagnosing with the evidence it needs.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ci-claude-p-explicit-permissions.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; operator ruling 2026-11-21 21:41Z that this project fixes the CI RCA
  problems from the CLI bump #2311, and his "write the plan" 22:39Z). No tier_item is claimed, so the Tier Item
  Freshness Gate is skipped; closes_criteria is empty.
closes_criteria: []
cites: [dec:72, dec:84, dec:162, dec:205, dec:215]
scope:
  - file: scripts/ci/claude_p_retry.sh
    action: Modify
    purpose: >-
      Every attempt runs claude -p with --setting-sources user, placed after the --session-id args and before the
      caller's args, so .claude/settings.json and .claude/settings.local.json (interactive-session permissions, hooks,
      env) never load in CI and CLI 2.1.323's untrusted-workspace warning has no source. The existing caller-flag
      refusal loop also refuses --setting-sources and --setting-sources=* (usage exit 1, same message shape), so no
      caller can re-enable project settings. Header comment gains one line naming the rule. The sessions.jsonl manifest
      lines are unchanged (T3.20 c9 capture reads them).
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: >-
      Run ci-rca agent step only, no line added or removed (Decision 162 ratchet, baseline rca_agent 29). The
      `--max-turns 30 \` line becomes `--max-turns 30 --mcp-config "${GITHUB_WORKSPACE}/.mcp.json" --strict-mcp-config \`.
      The --allowedTools value becomes "Read,Glob,Grep,Bash(grep:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(wc:*),Bash(git
      log:*),Bash(bin/venv-python -m scripts.ops_data_portal:*),mcp__ducklake-reads". Nothing else in the file changes.
  - file: .claude/agents/scheduled/ci-rca.md
    action: Modify
    purpose: >-
      Tools Allowed lists exactly the --allowedTools set above, one bullet per entry, in the backticked form the
      allowlist test parses. One added sentence: use the ducklake-reads ci_rca_since and ci_rca_open verbs as
      evidence for recurrence_class (never the deprecated recs_for_files, removed by rec-4240); if a verb errors or is missing, the evidence is unavailable, which never means
      novel (Decision 215 cl.2), and say so in the why_chain.
  - file: tests/ci_rca/test_agent_permissions_untrusted_workspace.py
    action: Create
    purpose: >-
      rec-5494 acceptance. Own stub claude on PATH recording argv (no import from other test modules, Decision 131):
      the wrapper passes --setting-sources user on every attempt, including a transient retry; --setting-sources and
      --setting-sources=project are refused with exit 1 and claude never runs. Parsing ci-rca.yml's Run ci-rca agent
      step: --mcp-config names .mcp.json, --strict-mcp-config is present, --allowedTools contains mcp__ducklake-reads,
      and no --setting-sources or --settings flag is passed by the step.
  - file: tests/ci_rca/test_agent_tool_allowlist.py
    action: Create
    purpose: >-
      rec-4677 acceptance, node test_ci_rca_prompt_commands_are_all_permitted_by_allowed_tools: the set of backticked
      entries under ci-rca.md's Tools Allowed equals the ci-rca step's --allowedTools set, and the first word of every
      command line in ci-rca.md's fenced bash blocks is permitted by a Bash(<prefix>:*) entry or is bin/venv-python -m
      scripts.ops_data_portal. A second node asserts every ducklake-reads verb ci-rca.md names is an agent_facing
      NAMED_READS verb with no deprecation marker, so a verb removal fails here instead of silently starving the agent.
bundled_recommendations: [rec-4677]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - bin/venv-python -m pytest tests/ci_rca/test_agent_permissions_untrusted_workspace.py -q passes, and fails on main (file absent; with it on main, the wrapper sends no --setting-sources and the step lacks the MCP flags)
  - bin/venv-python -m pytest tests/ci_rca/test_agent_tool_allowlist.py::test_ci_rca_prompt_commands_are_all_permitted_by_allowed_tools -q passes, and fails on main
  - The existing wrapper, reviewer-wiring, wrapper-enforcement and agent-safety tests stay green, and the rca_agent body ceiling (29 lines) holds
  - A subagent-review-smoke run on main after merge is green (the no-tools plan reviewer still works through the changed wrapper)
  - The operator-fired CI RCA run after rec-5492 and this plan merge shows no "Ignoring ... permissions.allow" line, no permission_denials on mcp__ducklake-reads or ls, and a FILED marker the filing check reads
  - rec-5494 and rec-4677 are closed by the merge's Resolves trailer
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5494 acceptance test (wrapper never loads project settings; ci-rca step names its MCP config and read verbs).
    command: bin/venv-python -m pytest tests/ci_rca/test_agent_permissions_untrusted_workspace.py -q
    expected: exit 0; red before (the file is absent; with it on main, no --setting-sources in the stub argv and no MCP flags on the step)
    fix_if: the flag is missing from an attempt, a caller override is accepted, or the step lacks a flag; fix the wrapper or step, never the test
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: ci-claude-p-no-project-settings
  - step: 2
    phase: pre-deploy
    action: rec-4677 acceptance test (ci-rca.md Tools Allowed and the step's --allowedTools agree; every prompt command is permitted).
    command: bin/venv-python -m pytest tests/ci_rca/test_agent_tool_allowlist.py::test_ci_rca_prompt_commands_are_all_permitted_by_allowed_tools -q
    expected: exit 0; red before (the file is absent; with it on main, ls, head and wc are named by the prompt but denied)
    fix_if: a set difference; make ci-rca.md and the step agree, never widen to a write-capable command
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: ci-rca-prompt-allowlist-agree
  - step: 3
    phase: pre-deploy
    action: Existing wrapper, reviewer-wiring, wrapper-enforcement and agent-safety suites still pass.
    command: >-
      bin/venv-python -m pytest tests/test_ci_claude_p_retry.py tests/test_subagent_review_wiring.py
      tests/checks/ci_guards/test_validate_claude_p_retry_wrapper.py tests/checks/ci_guards/test_validate_workflow_agent_safety.py -q
    expected: exit 0
    fix_if: an existing node fails; the flag placement broke an argv expectation (session-id args stay first)
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Already-collected suites the fast and full tiers re-run; steps 1 and 2 graduate the new guards.
  - step: 4
    phase: pre-deploy
    action: The inline-body line ceilings are unchanged.
    command: >-
      bin/venv-python -c "from scripts.checks.ci_guards.validate_composite_action_shell_bodies import
      validate_composite_action_shell_bodies as v; f=[]; v(f); assert not f, f; print('BODIES_OK')"
    expected: exit 0
    fix_if: a flag landed on a new line; move it onto the existing argument line
    hermetic: true
    expected_literals: ["BODIES_OK"]
    graduation: waive
    graduation_waiver_reason: The Decision 162 ratchet itself is the standing guard.
  - step: 5
    phase: pre-deploy
    action: Full tier then HEAD attestation, after the build commit and rebase and before the push; started backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the attestation matches HEAD
    fix_if: any failure; fix and rerun from the start (HOME must be an empty dir for tests/test_aws_profile.py)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 6
    phase: post-deploy
    action: Dispatch subagent-review-smoke on main after the merge (an admitted maintainer dispatch, Decision 205 cl.1).
    command: >-
      mcp__github__actions_run_trigger(method=run_workflow, owner=otl-labs, repo=ontheloop,
      workflow_id=subagent-review-smoke.yml, ref=main); then mcp__github__actions_get(get_workflow_run) on the new run
    expected: conclusion success; the reviewer job log has no "Ignoring" permissions line; record the run id
    fix_if: a CLI usage error naming --setting-sources, or a red run; stop and report to the planner (forward-fix, no rescue loop). PERSONA_DISPATCH_REFUSED means the dispatch was not a maintainer's own, so ask the operator to dispatch it.
    hermetic: false
  - step: 7
    phase: post-deploy
    action: >-
      One live CI RCA agent run on main after rec-5492 and this plan have both merged. Fork F1, decided by the operator
      2026-11-21 22:39Z: the operator fires it himself from GitHub (ci-rca.yml workflow_dispatch, run_id 44945189064,
      force_rca true; Decision 74 escape hatch, Decision 205 cl.1). The build session asks him for it by name and reads
      the run; it never dispatches ci-rca.yml itself. The duplicate rec the run files is closed as a duplicate through
      update_rec, naming rec-5491.
    command: >-
      mcp__github__actions_list(method=list_workflow_runs, resource_id=ci-rca.yml, branch=main, event=workflow_dispatch)
      for the operator's run; mcp__github__get_job_logs(owner=otl-labs, repo=ontheloop, job_id=<its rca job id>,
      return_content=true), reading the Run ci-rca agent step output and its printed /tmp/ci-rca-output.json
      permission_denials
    expected: >-
      no line containing "permissions.allow entries"; permission_denials has no mcp__ducklake-reads or ls entry; the
      Mark failure as RCA'd step ran (FILED marker parsed); record the run id and the duplicate rec id
    fix_if: >-
      a warning line (the flag did not reach claude), an MCP denial (allow-list entry wrong) or an MCP server start
      failure in the log (reader unreachable from the ci-rca role); stop and report to the planner (forward-fix)
    hermetic: false
  - step: 8
    phase: post-deploy
    action: Both recs are closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows,_=fetch_recs_by_ids(make_reader(),['rec-5494','rec-4677']); print([(r['id'],r['status']) for r in
      rows])"
    expected: both closed; record the closure job run id
    fix_if: still open; read the closure job's log for an acceptance refusal, fix the cause, never a direct status write
    hermetic: false
test_obligations:
  - source: scripts/ci/claude_p_retry.sh
    behavior: every attempt passes --setting-sources user; a caller --setting-sources is refused before claude runs
    verification_step: 1
    test_selector: tests/ci_rca/test_agent_permissions_untrusted_workspace.py
    red_green_expectation: red before (no flag in the stub argv; override accepted), green after
  - source: .github/workflows/ci-rca.yml
    behavior: the agent step names --mcp-config .mcp.json, --strict-mcp-config and mcp__ducklake-reads, and its allow list equals ci-rca.md's
    verification_step: 1
    test_selector: tests/ci_rca/test_agent_permissions_untrusted_workspace.py
    red_green_expectation: red before (flags and entry absent), green after
  - source: .claude/agents/scheduled/ci-rca.md
    behavior: Tools Allowed equals the step's --allowedTools, and every command its bash blocks run is permitted
    verification_step: 2
    test_selector: tests/ci_rca/test_agent_tool_allowlist.py::test_ci_rca_prompt_commands_are_all_permitted_by_allowed_tools
    red_green_expectation: red before (Tools Allowed omits entries the step must carry; prompt implies ls), green after
constraints:
  - "Never mark the runner workspace trusted (no ~/.claude.json hasTrustDialogAccepted write, no CLAUDE_CODE trust env): trusting re-grants settings.json's Edit, Write, git push, merge-PR and bin/venv-python:* entries to a read-only agent and runs repo hooks from the commit under diagnosis (Decision 72)."
  - "Every added tool is read-only (Decision 72 cl.1): no find (it has -exec/-delete), no Edit, Write or write MCP verb; mcp__ducklake-reads projects named read verbs only (Decision 84 I-3, scripts/agent_sdk/mcp_server.py)."
  - "No flag goes on a new line in the rca_agent body (Decision 162; baseline 29). No other ci-rca.yml change; review.sh is untouched (it inherits the wrapper flag)."
  - "The build session never dispatches ci-rca.yml (Decision 205 cl.1); VP 7's run is the operator's own."
  - "No rescue agents or workaround loops (Decision 55)."
