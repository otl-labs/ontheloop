constraints:
  - "Never mark the runner workspace trusted (no ~/.claude.json hasTrustDialogAccepted write, no CLAUDE_CODE trust env): trusting re-grants settings.json's Edit, Write, git push, merge-PR and bin/venv-python:* entries to a read-only agent and runs repo hooks from the commit under diagnosis (extends Decision 72's Consequences: the agent runs against the failing commit's own files)."
  - "Every added tool is read-only (Decision 72): no find (it has -exec/-delete), no Edit, Write or write MCP verb, no --add-dir (keeps /tmp, where the step's trusted inputs live, outside redirect reach); the granted mcp__ducklake-reads verbs are named read verbs (per-verb grants, never the whole server) (Decision 84 I-3, scripts/agent_sdk/mcp_server.py). Pre-existing grant breadth (git log --output, portal flags beyond --guidance and --file-rec) is rec-5499 (filed and read back 2026-11-22), out of scope."
  - "No flag or text goes on a new line in the rca_agent body (Decision 162; baseline 29). No other ci-rca.yml change; review.sh is untouched (it inherits the wrapper flag)."
  - "The build session never dispatches ci-rca.yml (Decision 205 cl.1); VP 7's run is the operator's own."
  - "No rescue agents or workaround loops (Decision 55)."
