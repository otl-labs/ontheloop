schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ci-claude-p-explicit-permissions
intent: >-
  CI's headless claude -p agents take their whole permission surface from their own command line, never from the
  repository's interactive-session .claude/settings.json, so a CLI bump or a workspace-trust change cannot silently widen,
  narrow or break what the CI RCA agent may do. The CI RCA agent is granted the read-only warehouse verbs and listing
  commands its instructions need, and its instructions and allow list are tested to agree. Keeps CI RCA, the alarm for
  every red on main, diagnosing with the evidence it needs. Covers the two scripts/ci/claude_p_retry.sh callers
  (ci-rca.yml, subagent-plan-review); claude.yml's claude-code-action is outside it by design.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ci-claude-p-explicit-permissions.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; operator ruling 2026-11-21 21:41Z that this project fixes the CI RCA
  problems from the CLI bump #2311, and his "write the plan" 22:39Z). No tier_item is claimed, so the Tier Item
  Freshness Gate is skipped; closes_criteria is empty.
closes_criteria: []
cites: [dec:72, dec:84, dec:162, dec:205, dec:215]
scope:
  - file: scripts/ci/claude_p_retry.sh
    action: Modify
    purpose: >-
      Every attempt runs claude -p with --setting-sources user, placed after the --session-id args and before the
      caller's args, so .claude/settings.json and .claude/settings.local.json (interactive-session permissions, hooks,
      env) never load in CI and CLI 2.1.323's untrusted-workspace warning has no source. The existing caller-flag
      refusal loop also refuses --setting-sources, --setting-sources=*, --settings and --settings=* (usage exit 1,
      own message "CI never loads project settings"; no current caller passes either), so no caller can re-inject
      project settings. Header comment gains one line naming the rule. The sessions.jsonl manifest
      lines are unchanged (T3.20 c9 capture reads them).
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: >-
      Run ci-rca agent step only, no line added or removed (Decision 162 ratchet, baseline rca_agent 29). (1) The
      `--max-turns 30 \` line becomes `--max-turns 30 --mcp-config "${GITHUB_WORKSPACE}/.mcp.json" --strict-mcp-config \`.
      (2) The --allowedTools value becomes "Read,Glob,Grep,Bash(grep:*),Bash(cat:*),Bash(ls:*),Bash(head:*),Bash(wc:*),
      Bash(git log:*),Bash(bin/venv-python -m scripts.ops_data_portal:*),mcp__ducklake-reads__ci_rca_since,
      mcp__ducklake-reads__ci_rca_open,mcp__ducklake-reads__recs_by_ids" (one line as today; per-verb entries, never the
      server-wide name, so the deprecated recs_for_files, still agent_facing until rec-4240, stays denied). (3) rec-4677's
      preferred fix: the EVIDENCE_CONTEXT assignment line replaces "-- enumerate *.json for multi-failure runs (one JSON
      per failed check)" with "-- bundle files (one JSON per failed check): $(ls /tmp/ci-rca-bundles/*.json | tr '\n' '
      ')", so the step, which already globs the dir on the line above, hands the agent the file list and the agent
      never lists /tmp. The three comment lines above it are reworded in place to match, so none still says the agent enumerates (no line added). No --add-dir: the
      agent's Read and cat of /tmp paths succeeded in job 136971171676 without one, and a /tmp working directory would
      bring the trusted step inputs there (/tmp/ci-rca-output.json, the sessions manifest, the bundles) into
      redirect reach. Nothing else in the file changes.
  - file: .claude/agents/scheduled/ci-rca.md
    action: Modify
    purpose: >-
      Tools Allowed lists exactly the --allowedTools set above: one top-level bullet per entry, the entry as the
      bullet's first backticked token (the parse rule both tests use; the Never line is not a bullet; nested bullets
      are ignored). A new "## Read Verbs" section directly after Tools Allowed (outside it, so it never enters the
      Tools Allowed set) has one top-level bullet per verb, first backticked token the bare verb: `ci_rca_since`,
      `ci_rca_open`, `recs_by_ids` (follow-up body read; ci_rca_since returns ids only), used as recurrence_class
      evidence, with a fixed bound: call ci_rca_since with since_ts 14 days before the current UTC date, then
      ci_rca_open, then recs_by_ids on any id that looks related. The section requires one why_chain entry that starts "Recurrence evidence:" and names each verb it
      called and the rec ids it returned (or "none"); if a verb errors or is missing, that entry says the evidence is
      unavailable, which never means novel (Decision 215 cl.2). One sentence in Step 5: run --file-rec as one simple command with
      --context-v2-json inline, no shell variable or heredoc, and keep apostrophes out of its prose fields (job
      136971171676 lost a turn to a denied compound form).
  - file: tests/ci_rca/test_agent_permissions_untrusted_workspace.py
    action: Create
    purpose: >-
      rec-5494 acceptance. Own stub claude on PATH recording argv (no import from other test modules, Decision 131).
      Node test_wrapper_never_loads_project_settings (rec-5494's acceptance, updated and read back 2026-11-21): the
      wrapper passes --setting-sources user on every attempt, including a transient retry. Node
      test_wrapper_refuses_settings_overrides, parametrized over --setting-sources, --setting-sources=project, --settings
      and --settings=x: exit 1 and claude never runs. Node test_ci_rca_step_declares_its_own_mcp_and_read_verbs,
      parsing ci-rca.yml's Run ci-rca agent step: --mcp-config names .mcp.json, --strict-mcp-config is present, no
      --add-dir, every mcp__ducklake-reads entry in --allowedTools is per-verb (no bare server name), at least one is
      present, and the step passes no --setting-sources or --settings flag.
  - file: tests/ci_rca/test_agent_tool_allowlist.py
    action: Create
    purpose: >-
      rec-4677 acceptance, node test_ci_rca_prompt_commands_are_all_permitted_by_allowed_tools. (a) The first
      backticked token of each top-level Tools Allowed bullet in ci-rca.md, as a set, equals the ci-rca step's
      --allowedTools set. (b) No non-comment line of the step's run text tells the agent to "enumerate"
      (case-insensitive), and the EVIDENCE_CONTEXT assignment that names /tmp/ci-rca-bundles carries a $(ls
      /tmp/ci-rca-bundles/*.json ...) substitution, so the bundle list reaches the prompt deterministically. (c) For each
      fenced bash block in ci-rca.md, backslash continuations are joined first; each resulting command must equal the
      prefix of some Bash(<prefix>:*) entry or start with that prefix plus a space (token boundary, so cat never
      matches category; multi-word prefixes such as git log included). Second node
      test_ci_rca_read_verbs_are_registered_agent_facing (the in-repo NAMED_READS registry; VP 7 is the live proof
      against the deployed reader's describe()): the verbs from the "## Read Verbs" section's first backticked tokens
      (registry-independent, never an intersection with NAMED_READS) equal the set of mcp__ducklake-reads__<verb>
      entries in --allowedTools, there is at least one, and each is an agent_facing NAMED_READS verb whose description
      carries no "deprecated" marker; and the Read Verbs section text contains "since_ts" and "14 days".
bundled_recommendations: [rec-5494, rec-4677]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - bin/venv-python -m pytest tests/ci_rca/test_agent_permissions_untrusted_workspace.py::test_wrapper_never_loads_project_settings -q (rec-5494's acceptance) passes with the file's other two nodes, and fails on main (file absent; with it on main, the wrapper sends no --setting-sources, accepts overrides, and the step lacks the MCP flags)
  - bin/venv-python -m pytest tests/ci_rca/test_agent_tool_allowlist.py::test_ci_rca_prompt_commands_are_all_permitted_by_allowed_tools -q passes, and fails on main (Tools Allowed omits Read; the prompt says enumerate the bundle dir and carries no file list)
  - The existing wrapper, reviewer-wiring, wrapper-enforcement and agent-safety tests stay green, and the rca_agent body ceiling (29 lines) holds
  - A subagent-review-smoke run on main after merge is green (the CLI accepts --setting-sources user through review.sh)
  - The operator-fired CI RCA run after rec-5492 and this plan merge shows no "Ignoring ... permissions.allow" line, no denial of a granted MCP verb, a FILED marker the filing check reads, a why_chain "Recurrence evidence:" entry naming a read verb and returned ids including rec-5491, and the bundle file named in the result (VP 7)
  - rec-5494 and rec-4677 are closed by the merge's Resolves trailer
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5494 acceptance nodes (wrapper never loads project settings and refuses overrides; ci-rca step names its own MCP config and per-verb grants).
    command: >-
      bin/venv-python -m pytest
      tests/ci_rca/test_agent_permissions_untrusted_workspace.py::test_wrapper_never_loads_project_settings
      tests/ci_rca/test_agent_permissions_untrusted_workspace.py::test_wrapper_refuses_settings_overrides
      tests/ci_rca/test_agent_permissions_untrusted_workspace.py::test_ci_rca_step_declares_its_own_mcp_and_read_verbs -q
    expected: exit 0; red before (the file is absent; with it on main, no --setting-sources in the stub argv, overrides accepted, and no MCP flags on the step)
    fix_if: the flag is missing from an attempt, an override is accepted, or the step lacks a flag; fix the wrapper or step, never the test
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: ci-claude-p-no-project-settings
  - step: 2
    phase: pre-deploy
    action: >-
      rec-4677 acceptance node and the registered-verb node (Tools Allowed and --allowedTools agree; the prompt carries
      the bundle file list instead of an enumerate instruction; every named read verb is registered, agent_facing and
      not deprecated).
    command: >-
      bin/venv-python -m pytest
      tests/ci_rca/test_agent_tool_allowlist.py::test_ci_rca_prompt_commands_are_all_permitted_by_allowed_tools
      tests/ci_rca/test_agent_tool_allowlist.py::test_ci_rca_read_verbs_are_registered_agent_facing -q
    expected: >-
      exit 0; red before (the file is absent; with it on main, Tools Allowed omits Read, the EVIDENCE_CONTEXT line says
      enumerate with no file list, and ci-rca.md has no Read Verbs section)
    fix_if: a set difference; make ci-rca.md and the step agree, never widen to a write-capable command
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: ci-rca-prompt-allowlist-agree
  - step: 3
    phase: pre-deploy
    action: Existing wrapper, reviewer-wiring, wrapper-enforcement and agent-safety suites still pass.
    command: >-
      bin/venv-python -m pytest tests/test_ci_claude_p_retry.py tests/test_subagent_review_wiring.py
      tests/checks/ci_guards/test_validate_claude_p_retry_wrapper.py tests/checks/ci_guards/test_validate_workflow_agent_safety.py -q
    expected: exit 0
    fix_if: an existing node fails; the flag placement broke an argv expectation (session-id args stay first)
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Already-collected suites the fast and full tiers re-run; steps 1 and 2 graduate the new guards.
  - step: 4
    phase: pre-deploy
    action: The inline-body line ceilings are unchanged.
    command: >-
      bin/venv-python -c "from scripts.checks.ci_guards.validate_composite_action_shell_bodies import
      validate_composite_action_shell_bodies as v; f=[]; v(f); assert not f, f; print('BODIES_OK')"
    expected: exit 0
    fix_if: a flag or the file list landed on a new line; move it onto the existing line
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: The Decision 162 ratchet itself is the standing guard.
  - step: 5
    phase: pre-deploy
    action: Full tier then HEAD attestation, after the build commit and rebase and before the push; started backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the attestation matches HEAD
    fix_if: any failure; fix and rerun from the start (HOME must be an empty dir for tests/test_aws_profile.py)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 6
    phase: post-deploy
    action: Dispatch subagent-review-smoke on main after the merge (an admitted maintainer dispatch, Decision 205 cl.1).
    command: >-
      mcp__github__actions_run_trigger(method=run_workflow, owner=otl-labs, repo=ontheloop,
      workflow_id=subagent-review-smoke.yml, ref=main); then mcp__github__actions_get(get_workflow_run) on the new run
    expected: conclusion success, proving the CLI accepts --setting-sources user through review.sh (the reviewer runs from a temp dir outside the checkout, so it never loaded project settings); record the run id
    fix_if: a CLI usage error naming --setting-sources, or a red run; stop and report to the planner (forward-fix, no rescue loop). PERSONA_DISPATCH_REFUSED means the dispatch was not a maintainer's own, so ask the operator to dispatch it.
    hermetic: false
  - step: 7
    phase: post-deploy
    action: >-
      One live CI RCA agent run on main after rec-5492 and this plan have both merged. Fork F1, decided by the operator
      2026-11-21 22:39Z: the operator fires it himself from GitHub (ci-rca.yml workflow_dispatch, run_id 44945189064,
      force_rca true; Decision 74 escape hatch, Decision 205 cl.1). The build session asks him for it by name and reads
      the run; it never dispatches ci-rca.yml itself. The duplicate rec the run files is then set --status superseded
      with --resolution naming rec-5491 through update_rec.
    command: >-
      mcp__github__actions_list(method=list_workflow_runs, resource_id=ci-rca.yml, branch=main, event=workflow_dispatch)
      for the operator's run; mcp__github__get_job_logs(owner=otl-labs, repo=ontheloop, job_id=<its rca job id>,
      return_content=true), reading the Run ci-rca agent step output and its printed /tmp/ci-rca-output.json
      (permission_denials, result); then AWS_PROFILE=agent_platform bin/venv-python -c "from
      src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows,_=fetch_recs_by_ids(make_reader(),
      ['<duplicate rec id>']); print(rows[0]['context_v2_json'])"
    expected: >-
      Absence checks: no line containing "permissions.allow entries"; no permission_denials entry for any granted
      mcp__ducklake-reads verb; no ls or Glob denial on a /tmp path. Positive checks: the Mark failure as RCA'd step ran
      (FILED marker parsed); the duplicate rec's why_chain has a "Recurrence evidence:" entry that names ci_rca_since
      and lists returned ids including rec-5491 (filed 2026-11-21T20:18Z, inside the 14-day bound while VP 7 runs
      before 2026-12-05), not "unavailable"; num_turns below 30;
      and the result text names the bundle file it diagnosed rather than an inability to list /tmp/ci-rca-bundles. Also
      absent: any permission_denials entry whose command contains --file-rec (the Step 5 simple-command rule). Record
      the run id and the duplicate rec id.
    fix_if: >-
      a warning line (the flag did not reach claude), an MCP denial (allow-list entry wrong), an MCP server start failure
      or "evidence unavailable" in the why_chain (reader unreachable from the ci-rca role), or a bundle-listing failure
      (the file list did not reach the prompt), or error_max_turns / num_turns at 30 (the recurrence calls exhausted
      the budget; job 136971171676 used 24 of 30, 5 of them denied); stop and report to the planner (forward-fix)
    hermetic: false
  - step: 8
    phase: post-deploy
    action: Both recs are closed by the merge's Resolves trailer, and VP 7's duplicate reads back superseded.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows,_=fetch_recs_by_ids(make_reader(),['rec-5494','rec-4677','<VP 7 duplicate rec id>']);
      print([(r['id'],r['status']) for r in rows])"
    expected: rec-5494 and rec-4677 closed, the VP 7 duplicate superseded; record the closure job run id
    fix_if: still open; read the closure job's log for an acceptance refusal, fix the cause, never a direct status write
    hermetic: false
