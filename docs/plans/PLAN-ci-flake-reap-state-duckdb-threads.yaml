  - source: tests/common/ducklake_reader_client/test_verb_fields_parity.py
    behavior: The verb-fields parity nodes pass on a seam connection.
    verification_step: 6
    test_selector: tests/common/ducklake_reader_client/test_verb_fields_parity.py
    waiver_reason: A test module whose only change is its connection opener; step 5 checks the rewire, step 6 runs it.
  - source: tests/test_session_preflight_cache_serving.py
    behavior: The cache-serving nodes pass on a seam connection.
    verification_step: 6
    test_selector: tests/test_session_preflight_cache_serving.py
    waiver_reason: A test module whose only change is its connection opener; step 5 checks the rewire, step 6 runs it.
constraints:
  - "Test-only change: no file outside tests/ is edited, so repair_track_confirmed resolves to test_defect and no Lambda is affected."
  - Do not bump DuckDB; that is rec-3791's work under config/lambda/ducklake/version.yaml's lockstep policy.
  - Never skip, xfail, retry or quarantine a test to get green, and never change the runtime to match a test (Decision 55).
  - No module-scope duckdb import in tests/fixtures/duckdb_connect.py or tests/fixtures/telemetry_read_db.py.
  - No cross-test imports; shared helpers come from tests/fixtures/ (tests/CLAUDE.md).
  - Python 3.12, type hints, ruff, line length 127, ASCII only, no new comments unless the why is non-obvious.
