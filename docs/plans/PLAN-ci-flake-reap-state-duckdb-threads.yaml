execution_steps:
  - >-
    tests/fixtures/process_probes.py: add DEAD_STATES = frozenset({"Z", "X"}); pid_is_dead(pid, proc_root=Path("/proc"))
    reads proc_root / str(pid) / "stat", returns True on FileNotFoundError or ProcessLookupError and otherwise state in
    DEAD_STATES; update its docstring to name X (EXIT_DEAD, mid-reap) and rec-4872.
  - >-
    tests/checks/test__process_group.py: in test_kills_the_detached_childs_whole_group, set dead = pid_is_dead(...) before
    the loop, loop while not dead and before the deadline (sleep, then re-probe into dead), and assert dead; add
    TestPidIsDeadStates with
    test_exit_dead_counts_as_dead (a tmp_path/<pid>/stat file in state X) and a parametrised table (Z and X dead, R, S and D
    alive, absent dead, and a comm containing a space and a parenthesis).
  - >-
    Create tests/fixtures/duckdb_connect.py: RUNTIME_THREADS = 1; connect() imports duckdb, opens duckdb.connect(), executes
    f"SET threads={RUNTIME_THREADS}" and returns the connection. Module docstring: why (the runtime issues SET threads=1;
    duckdb/duckdb#22846 races at threads >= 2; rec-4890).
  - >-
    tests/fixtures/telemetry_read_db.py: open_memory_catalog and open_local_lake call duckdb_connect.connect() in place of
    duckdb.connect(); keep the lazy import discipline (import the seam module at top level is fine: it imports no duckdb).
  - >-
    The four test files: replace each duckdb.connect() named in scope with duckdb_connect.connect(); add
    test_fixture_connections_run_with_the_runtime_thread_count to tests/common/test_ducklake_event_read_verbs.py per its scope
    row (patch rt.ducklake_spike._require_duckdb and _set_s3_credentials as tests/common/test_ducklake_runtime.py:124 does).
  - Execute Verification Plan steps 1-9 -- loop until pass; on unrecoverable failure stop and RCA (Decision 55).
  - >-
    Commit flow per the implement skill; the squash commit body carries "Resolves: rec-4872, rec-4890" (git-ops.yaml
    resolves_trailer). After merge run step 10.
  - 'Report: what was implemented, verification results, and the closure read-back.'
weakening_dispositions:
  - candidate: "[assertion-changed] tests/checks/test__process_group.py::TestKillAndReapSignalTargeting::test_kills_the_detached_childs_whole_group"
    disposition: planned-change
    cite: "acceptance_criteria[1]"
rollback: Revert the squash commit; the change is test-only and touches no runtime path.
