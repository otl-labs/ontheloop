schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ci-flake-reap-state-duckdb-threads
intent: >-
  Repair two CI-RCA flakes at their measured causes so main's full tier stops reddening on them: the process probe counts a
  process mid-reap (state X) as dead, and every test DuckDB connection that runs production read-verb SQL opens at the
  runtime's thread count, guarded by a parity node and a sweep node, so DuckDB 1.5.4's parallel-window race cannot fire in
  tests either.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-ci-flake-reap-state-duckdb-threads.yaml
phase: >-
  Red-main repair (Decision 226) of the ci_rca recs rec-4872 (Track A) and rec-4890 (Track B); no tier_item criterion is
  closed. Soft-warn exception category ci_rca, so the Tier Item Freshness Gate is skipped.
scope:
  - file: tests/fixtures/process_probes.py
    action: Modify
    purpose: >-
      pid_is_dead counts state X (EXIT_DEAD, shown while the reaper collects the child) as dead alongside Z and an absent
      stat file, through an exported DEAD_STATES; an optional proc_root parameter (default Path("/proc")) lets a unit test
      point it at a fake stat file. pid_state and read_published_pid are unchanged.
  - file: tests/checks/test__process_group.py
    action: Modify
    purpose: >-
      test_kills_the_detached_childs_whole_group asserts on the loop's latched observation instead of probing again; new
      class TestPidIsDeadStates (including test_exit_dead_counts_as_dead, the rec-4872 closure artifact) pins the probe's
      state table over fake stat files. test_reap_timeout_closes_pipes_and_reaps_the_shell is untouched: it already asserts
      its single latched pid_state and polls past X until the stat file is gone. Graduated shard process-group-kill-and-reap
      is kept: it is a suite-covered command record whose seven pinned node ids validate_graduated_rerun resolves statically
      (the test suite runs the nodes), and none of those ids changes.
  - file: tests/fixtures/duckdb_connect.py
    action: Create
    purpose: >-
      The single test-side seam for DuckDB connections that run production read-verb SQL: RUNTIME_THREADS = 1 and connect(),
      which opens an in-memory connection and issues SET threads=RUNTIME_THREADS. duckdb is imported inside connect(), never
      at module scope (fast-tier importers must not pay for it).
  - file: tests/fixtures/telemetry_read_db.py
    action: Modify
    purpose: >-
      open_memory_catalog and open_local_lake take their connection from duckdb_connect.connect(), called through the module
      attribute (from tests.fixtures import duckdb_connect) so the parity node's spy reaches it, and the module docstring's
      lazy-import sentence says duckdb is now imported by the seam; nothing else changes.
  - file: tests/common/test_ducklake_event_read_verbs.py
    action: Modify
    purpose: >-
      test_health_count_reads_metadata_only takes its connection from the seam, and the module docstring names the two new
      nodes. (1) test_fixture_connections_run_with_the_runtime_thread_count (the rec-4890 closure artifact) captures the one
      SET threads statement ducklake_runtime.open_connection issues (FakeCon from tests/fixtures/ducklake_fakes.py and the
      patches tests/common/test_ducklake_runtime.py:125-128 applies, with that file's _DSN shape), derives the runtime's
      thread count from it, and asserts the seam and open_memory_catalog each report that derived count through
      current_setting('threads') -- the expectation comes from the runtime, never from RUNTIME_THREADS. open_local_lake is
      proven to route through the seam without a network fetch: a spy on telemetry_read_db's duckdb_connect.connect raises a
      sentinel, and the call must raise it before any INSTALL (this module is not integration-marked, and every real
      open_local_lake caller today is). (2)
      test_verb_sql_modules_open_duckdb_only_through_the_seam parses every tests/**/*.py with ast. A module is verb-SQL when
      an ast.Name id, an ast.Attribute attr or an ImportFrom alias is NAMED_READS, EVENT_READS or render_sql, or when an
      Import or ImportFrom names one of src.common's ducklake_event_read_verbs, ducklake_event_reads, ducklake_event_read_sql,
      ducklake_named_reads or ducklake_content_read_verbs; a verb-SQL module must contain no call to <m>.connect where <m> is
      duckdb or an alias bound by import duckdb as <m> or <m> = pytest.importorskip("duckdb"), nor to a name bound by from
      duckdb import connect [as <name>] (call nodes only, so docstrings and the node's own literals never match; measured at
      planning, alias tracking adds no file). An opener reached through a helper call is out of its reach: the one known
      instance, tests/common/test_ducklake_read_deadline.py's _duckdb().connect(), runs ad hoc range/sort SQL, not verb SQL. Measured at planning: exactly the five rewired files plus
      tests/test_ducklake_reader_handler.py match, and that file (its real-DuckDB node runs ad hoc SQL only) is the one
      named exclusion, a constant carrying that reason. Home beside the parity node: --pre's diff-aware selection would not
      select a fast-tier sweep for an edit to another test file, so the full tier (pre-handoff and main) gates it either way.
      Non-vacuity floor: the node also asserts that this module and the five rewired files classify as verb-SQL, so a rename
      of the names or modules it keys on fails rather than passing on zero matches. Size: about +60-75 SLOC (392 -> about
      455-465 of 500, re-measured at build time); if the build would cross 500, stop and amend the plan, never raise the
      budget.
  - file: tests/common/test_ducklake_event_read_dedupe.py
    action: Modify
    purpose: _load takes its connection from the seam.
  - file: tests/common/ducklake_reader_client/test_verb_fields_parity.py
    action: Modify
    purpose: >-
      _con takes its connection from the seam, and the module docstring's description of the copied _con harness says so.
      Graduated shards recs-read-model-parity, verb-fields-match-registry-sql and verb-fields-version-pin-matches are kept:
      their node ids are unchanged.
  - file: tests/test_session_preflight_cache_serving.py
    action: Modify
    purpose: _con takes its connection from the seam.
  - file: tests/recs_related/test_verb_sql.py
    action: Modify
    purpose: >-
      _con takes its connection from the seam: it runs NAMED_READS["recs_related"], the one named read with window functions
      (count(*) OVER ()), so it carries the same duckdb/duckdb#22846 exposure.
bundled_recommendations:
  - rec-4872
  - rec-4890
followon_recs:
  - rec-3791
infrastructure_dependencies: []
acceptance_criteria:
  - pid_is_dead returns True for a stat file in state X or Z and for an absent stat file, and False for R, S and D.
  - test_kills_the_detached_childs_whole_group asserts on the observation that ended its poll loop, never on a fresh probe.
  - >-
    The seam and open_memory_catalog each report the thread count ducklake_runtime.open_connection issues (1 today) and
    open_local_lake opens through the seam; a change on either side fails
    test_fixture_connections_run_with_the_runtime_thread_count.
  - >-
    No test module that runs production read-verb SQL calls duckdb.connect itself: the five rewired test files open through
    the seam, tests/test_ducklake_reader_handler.py is the one named exclusion, and
    test_verb_sql_modules_open_duckdb_only_through_the_seam fails on any new direct duckdb opener (duckdb or an alias of it;
    an opener behind a helper call is out of its reach).
  - >-
    rec-4872 and rec-4890 close on the squash merge's Resolves trailer with fixed_by_sha equal to the merge commit and
    repair_track_confirmed test_defect.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The probe's state table, including X, over fake stat files.
    command: bin/venv-python -m pytest -q tests/checks/test__process_group.py::TestPidIsDeadStates
    expected: >-
      Exit 0. Red before: the class does not exist on origin/main; against the unmodified probe its nodes fail (the old
      pid_is_dead takes no proc_root and reads X as alive).
    fix_if: X or Z reads as alive, or R, S or D reads as dead -- fix DEAD_STATES or the stat parse; never edit the table.
    hermetic: true
    graduation: graduate
    graduation_check_id: process-probe-dead-states
    expected_literals: []
  - step: 2
    phase: pre-deploy
    action: >-
      The latch. The kill test's assert reads the observation that ended its poll loop, not a fresh probe of the grandchild.
    command: "test -f tests/checks/test__process_group.py && ! grep -n 'assert pid_is_dead(grandchild_pid)' tests/checks/test__process_group.py"
    expected: Exit 0 with no output. Red before (line 40 on origin/main asserts a fresh probe).
    fix_if: A line still asserts a fresh pid_is_dead probe -- assert the latched variable the loop set instead.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      One-time claim over one file that complements step 1; with X counted as dead a re-introduced re-probe is harmless, and
      the kill node itself stays pinned by the process-group-kill-and-reap record and run by the suite.
    expected_literals: []
  - step: 3
    phase: pre-deploy
    action: The process-group classes, including the repaired node, still pass against real processes.
    command: >-
      bin/venv-python -m pytest -q tests/checks/test__process_group.py::TestKillAndReapSignalTargeting
      tests/checks/test__process_group.py::TestKillAndReapBoundedWait
      tests/checks/verification/test__vp_replay_budget.py::TestRunBoundedTimeoutKillsTheProcessGroup
    expected: Exit 0.
    fix_if: A node fails -- read its assertion; never add a retry, skip or xfail (Decision 55).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The process-group-kill-and-reap record pins the seven test__process_group.py node ids, none of which changes, and the
      suite runs them on every main push; the test__vp_replay_budget.py class is pinned by no record and is suite-run only.
    expected_literals: []
  - step: 4
    phase: pre-deploy
    action: >-
      The class guards: thread parity with the runtime, and the sweep that no verb-SQL test module opens DuckDB outside the
      seam.
    command: >-
      bin/venv-python -m pytest -q
      tests/common/test_ducklake_event_read_verbs.py::test_fixture_connections_run_with_the_runtime_thread_count
      tests/common/test_ducklake_event_read_verbs.py::test_verb_sql_modules_open_duckdb_only_through_the_seam
    expected: >-
      Exit 0. Red before: neither node exists on origin/main; with the seam present but the fixtures and test files not yet
      rewired, the parity node fails with assert 4 == 1 (measured on a prototype at 211f307c: DuckDB defaults to 4 threads
      here and on the runner) and the sweep names the five unrewired files.
    fix_if: >-
      A connection reports a thread count other than the runtime's, or the sweep names a file -- route it through
      duckdb_connect.connect(); never change the runtime to match the test and never widen the exclusion to pass.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      duckdb is absent from the fast tier (requirements-fast.txt heavy-exclusion), so the nodes cannot replay in venv-less
      pr-validate; the full tier runs them before handoff and on every main push, which is the standing guard.
    expected_literals: []
  - step: 5
    phase: pre-deploy
    action: >-
      No bare connection opener remains at the rewired sites, and the seam is the one place the remaining files connect.
    command: >-
      F="tests/fixtures/telemetry_read_db.py tests/common/test_ducklake_event_read_verbs.py
      tests/common/test_ducklake_event_read_dedupe.py tests/common/ducklake_reader_client/test_verb_fields_parity.py
      tests/test_session_preflight_cache_serving.py tests/recs_related/test_verb_sql.py"; for f in $F; do test -f "$f" ||
      exit 1; done; ! grep -n 'duckdb\.connect(' $F && test "$(grep -c 'duckdb\.connect(' tests/fixtures/duckdb_connect.py)" = 1
    expected: Exit 0 with no grep output. Red before (seven openers on origin/main, and the seam file is absent).
    fix_if: >-
      A real opener remains -- replace it with duckdb_connect.connect(); a message, comment or docstring literal matched --
      reword it (the AST sweep ignores literals, this grep does not).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim over a fixed file list (Decision 244 cl.4); step 4's sweep node is the standing guard for the class.
    expected_literals: []
  - step: 6
    phase: pre-deploy
    action: >-
      Every test module that imports telemetry_read_db directly or through tests/fixtures/telemetry_golden_chain.py, plus the
      four rewired files that do not, passes on the new connections. The list is derived, not restated.
    command: >-
      bin/venv-python -m pytest -q -n 4 $(grep -rlE 'telemetry_read_db|telemetry_golden_chain' tests/ --include='test_*.py')
      tests/common/test_ducklake_event_read_dedupe.py tests/common/ducklake_reader_client/test_verb_fields_parity.py
      tests/test_session_preflight_cache_serving.py tests/recs_related/test_verb_sql.py
    expected: >-
      Exit 0 (16 importer modules at planning, plus the four; measured on main 34c25c58 before the change: 1031 passed, 1
      skipped in about 6 minutes at -n 4). Time the run the same way after the change and report it; more than double the
      baseline is reported as a threads=1 cost, not hidden.
    fix_if: >-
      A node fails -- if it needed the default thread count, that is a test-side parity defect to fix in the test; never
      special-case the seam.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Not hermetic: open_local_lake fetches the ducklake extension over the network, and the command's file list is derived
      at run time; the full tier runs the non-integration nodes of every one of these modules before handoff and on every
      main push (its -m "not integration" filter skips the integration-marked ones this step runs).
  - step: 7
    phase: pre-deploy
    action: >-
      Merge-time readiness without running warehouse text: both recs hold exactly this plan's acceptance strings and a
      closure_artifact that resolves to an existing node, and the plan's own literal acceptance commands pass. The sandboxed
      preview of the warehouse acceptance is merge_step premerge at merge time (execution_steps[7]).
    command: >-
      bin/venv-python -c "import json; from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; from
      scripts.ops_portal.closure_gate import artifact_exists; want = {'rec-4872': 'bin/venv-python -m pytest -q
      tests/checks/test__process_group.py::TestPidIsDeadStates
      tests/checks/test__process_group.py::TestKillAndReapSignalTargeting::test_kills_the_detached_childs_whole_group',
      'rec-4890': 'bin/venv-python -m pytest -q
      tests/common/test_ducklake_event_read_verbs.py::test_fixture_connections_run_with_the_runtime_thread_count
      tests/common/test_ducklake_event_read_verbs.py::test_verb_sql_modules_open_duckdb_only_through_the_seam
      tests/common/test_ducklake_event_read_verbs.py::test_verb_fields_match_event_verb_output_columns'}; rows, _ =
      fetch_recs_by_ids(make_reader(), list(want)); got = {r['id']: (r['acceptance'],
      json.loads(r['context_v2_json']).get('closure_artifact')) for r in rows}; print(got); assert all(got[k][0] == v for k,
      v in want.items()), got; assert all(artifact_exists(a) for _, a in got.values()), got" && bin/venv-python -m pytest -q
      tests/checks/test__process_group.py::TestPidIsDeadStates
      tests/checks/test__process_group.py::TestKillAndReapSignalTargeting::test_kills_the_detached_childs_whole_group
      tests/common/test_ducklake_event_read_verbs.py::test_fixture_connections_run_with_the_runtime_thread_count
      tests/common/test_ducklake_event_read_verbs.py::test_verb_sql_modules_open_duckdb_only_through_the_seam
      tests/common/test_ducklake_event_read_verbs.py::test_verb_fields_match_event_verb_output_columns
    expected: >-
      Prints both recs' acceptance and closure_artifact, the string and artifact assertions hold, and the five literal nodes
      pass; exit 0. The folded command joins with spaces, matching the stored strings.
    fix_if: >-
      An acceptance string differs or an artifact does not resolve (a node was renamed) -- restamp with correct_rec_context
      before merge, never edit a test to fit; a node fails -- fix the code, never the acceptance.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the reported check on the branch (Git-ops step 6).
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Full tier on the rebased head, with the handoff verdict.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The verdict check exits 0 for HEAD. Start the full tier backgrounded with a 2 h limit from the top-level session; its
      verdict is the verify-head exit, never a pipe's status.
    fix_if: >-
      A failure in this plan's files -- fix and rerun from the start (timeout_disposition blocked); one only in another open
      red's tests -- follow the implement skill's go/no-go.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      The first main-validate run on the merge commit is green (trailer-closure runs after it, and its junit feeds the
      acceptance verdict).
    command: >-
      mcp__github__actions_list(method=list_workflow_runs, owner=otl-labs, repo=ontheloop, resource_id=ci.yml,
      workflow_runs_filter={branch: main, event: push}), pick the run whose head_sha is MERGE_SHA, then
      mcp__github__get_job_logs(owner=otl-labs, repo=ontheloop, job_id=<its main-validate job>, return_content=true) and
      read the Validation Summary.
    expected: The run's conclusion is success and its Validation Summary reads All checks passed; record the run id.
    fix_if: >-
      Red in this plan's files -- forward-fix on a new branch (Decision 226); red only in another open red's tests -- record
      it, and step 11 may still pass since trailer-closure keys on the acceptance verdict.
    hermetic: false
  - step: 11
    phase: post-deploy
    action: >-
      The squash merge's "Resolves: rec-4872, rec-4890" trailer closed both recs, fix-bound to the merge commit. First export
      MERGE_SHA as the sha the merge_pull_request result returned; run after ci.yml's trailer-closure job on that commit
      finishes (it follows main-validate, about 16-20 minutes after the merge).
    command: >-
      test -n "$MERGE_SHA" && bin/venv-python -c "import json, os; from src.common.ducklake_reader_client import
      fetch_recs_by_ids, make_reader; m = os.environ['MERGE_SHA']; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-4872',
      'rec-4890']); st = {x['id']: (x['status'], json.loads(x['context_v2_json']).get('fixed_by_sha'),
      json.loads(x['context_v2_json']).get('repair_track_confirmed')) for x in rows}; print(st); assert len(st) == 2 and
      all(v == ('closed', m, 'test_defect') for v in st.values()), st"
    expected: Both rows print as closed, the merge sha and test_defect; exit 0.
    fix_if: >-
      Still open: read the trailer-closure job log. ClosureArtifactRequired despite the stamp -- confirm the acceptance verdict
      holds, then close through ci-rca-lifecycle closure_dependency.manual_route with the stamped --closure-artifact and
      --closure-fix-sha "$MERGE_SHA" in one call. An AcceptanceVerdictRefused is never closed by hand: fix the code and let a
      trailer close it. A report_unavailable verdict (main-validate emitted no junit) routes the same manual way.
    hermetic: false
test_obligations:
