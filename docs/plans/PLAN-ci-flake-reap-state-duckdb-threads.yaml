    verification_step: 4
    test_selector: tests/common/test_ducklake_event_read_verbs.py::test_verb_sql_modules_open_duckdb_only_through_the_seam
    red_green_expectation: Red before (the sweep names the five unrewired files). Green after.
  - source: tests/common/test_ducklake_event_read_dedupe.py
