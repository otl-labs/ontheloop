schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ci-rca-coverage-table
intent: >-
  One source of truth for what CI RCA depends on and how each part of it is proven (rec-5537). Today nothing in the
  repository says which files a ci-rca.yml step runs or reads; a hand-kept path list for rec-5493's smoke failed review
  nine times. scripts/ci_rca/coverage.py derives each step's inputs from the workflow itself plus their static import
  closure, and a one-row-per-step table records how the step is proven and the non-code inputs no derivation sees. A
  fast-tier check keeps the table and the workflow in step. No workflow changes; rec-5493's post-merge smoke and
  rec-5510's pre-merge gate read this table instead of a list of their own.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ci-rca-coverage-table.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; operator rulings 2026-11-23: "watchdog first, rework smoke" card 11:22Z
  after the blind Fable consult he asked for at 11:17Z, and "avoids bundling too much" 11:24Z). No tier_item is
  claimed, so the Tier Item Freshness Gate is skipped; closes_criteria is empty.
closes_criteria: []
cites: [dec:72, dec:86, dec:162, dec:166, dec:169, dec:170, dec:181]
scope:
  - file: scripts/ci_rca/coverage.py
    action: Create
    purpose: >-
      The deriver and its CLI. load(workflow, table) parses .github/workflows/ci-rca.yml with yaml.safe_load.
      STEP KEY: job id + '::' + _workflow_shell_bodies._step_identity(step, index) (the step's id, else its name
      slug, else #index; the repository's existing grammar, imported, not copied); a duplicate key in one job fails.
      SCANNED FIELDS: the comment-blanked run: body (validate_workflow_dependency_install's _blank_shell_comments,
      imported), with:, env: and if: values, and every scanned script's own body. MODULES: every -m X token is
      resolved by validate_workflow_dependency_install's _MODULE_AFTER_RE and _module_to_path (imported; no second
      module parser; it matches -m scripts.X, which is every repository -m in the real tree, and a test pins that no
      scanned field holds a -m src.X token the regex would miss); -m of a package yields both pkg/__init__.py and pkg/__main__.py. PATHS, normalized before
      matching: an action-relative prefix ($(dirname "$0"), $(dirname "${BASH_SOURCE[0]}"), $GITHUB_ACTION_PATH,
      ${GITHUB_ACTION_PATH}, ${{ github.action_path }}) resolves to the action or script directory and the result is
      normalized, so ../../../config/aws-region becomes config/aws-region; any other leading $NAME/ or ${NAME}/ prefix
      (GITHUB_WORKSPACE, ROOT, REPO_ROOT, ${{ github.workspace }}) is dropped. A path token then matches
      (?<![\w./$}-])(scripts|src|config|bin|tests|\.claude|\.github)/[\w./-]+ or is exactly a top-level file named
      in the table's known_top_level list; .venv/ paths, /tmp paths, absolute paths and remaining ${{ }} expressions are
      ignored. hashFiles('...') arguments are paths. For uses: ./<dir>, that directory's action.yml joins the inputs and
      its run: steps are scanned the same way (recursively); a scanned shell script is scanned the same way.
      known_top_level files that are JSON (.mcp.json) are scanned too: their string values are joined and read as a
      command line, so .mcp.json's bin/venv-python -m scripts.agent_sdk.mcp_server is a direct input of the step
      that names .mcp.json. Third-party uses: values are recorded as external pins, not files. FAIL CLOSED: a token
      that matches a path or module shape but resolves to no file is an error, never a skip. CLOSURE: closure(step)
      seeds scripts.dependency_graph's forward_closure over import_subgraph (module granularity, mapped back to files)
      from every direct AND declared Python module or .py path, including __main__ for a package. inputs(step) =
      direct inputs + closure + the row's declared_inputs. check() is direct-only (keys, rows, values, declared
      inputs exist, direct references resolve) and builds no import graph. CLI: derive [--step KEY] (JSON: per step,
      direct, closure, declared, proven_by), paths --proven-by VALUE (the sorted union of inputs(step) over steps with
      that proven_by, one path per line; rec-5493 reads it for main_smoke), check (exit 1 on any problem). Standard
      library plus yaml and the repository's own modules; no network.
    new_imports: [scripts.dependency_graph, scripts.checks.ci_guards.validate_workflow_dependency_install, scripts.checks.ci_guards._workflow_shell_bodies]
  - file: config/agent/ci_rca/coverage.yaml
    action: Create
    purpose: >-
      The table (agent/CI zone, never Lambda-bundled). schema_version 1; workflow .github/workflows/ci-rca.yml;
      proven_by_values with one line each: main_smoke (the post-merge smoke on main runs this step, rec-5493),
      pr_smoke (a pre-merge smoke runs it, rec-5510), seam_contract (the seam contract test covers it, rec-5509),
      watchdog_only (only a real run exercises it; the watchdog, rec-5504, reports when it fails); known_top_level
      [.mcp.json, requirements.txt]; steps: one row per step key with proven_by, declared_inputs (repository paths a step reads that no
      derivation sees, for example config/ci_rca_taxonomy.yaml for Generate evidence bundle) and an optional note.
      Today every row is watchdog_only, which is the true state on main: no smoke or seam test exists yet. Each later
      plan flips its own rows in the same change that makes them true.
  - file: scripts/checks/misc/validate_ci_rca_coverage.py
    action: Create
    purpose: >-
      Fast-tier gate over coverage.check(): every step key in ci-rca.yml has exactly one row; no row names a step
      that no longer exists; every proven_by is in proven_by_values; every declared input exists; every direct
      reference resolves (fail closed). examined() reports the step count (Decision 170). It never calls the network.
  - file: scripts/checks/misc/_manifest.py
    action: Modify
    purpose: >-
      One Entry for validate_ci_rca_coverage with pre=True and pre_globs=None (ungated: it runs on every PR, so a rename
      of any referenced file, for example .mcp.json, the agent prompt or a declared input, fails the PR rather than
      main, and validate_pre_glob_closure has no closure to cover); full_segment="full_after_lint" so the post-merge
      full tier repeats it. name, module and attr are bare string literals (Decision 169). Cheap because check() is
      direct-only (one YAML parse and a few dozen file-existence checks).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      One function_to_category row for validate_ci_rca_coverage. NEAR_CAP (495 of 500 on 2026-11-23, and other
      unbuilt plans add rows): measure against main at build; if the row does not fit, retire or compact a resolved
      row, else a loud raise marked with a Decision 166 citation (the config class's own relief valve); never fold
      block rows into flow style to dodge the count.
  - file: tests/test_ci_rca_coverage.py
    action: Create
    purpose: >-
      rec-5537's acceptance file (map_source_to_test's home for scripts/ci_rca/coverage.py). In process, against small
      workflow fixtures under tmp_path and the real tree: step keys (id, name, uses fallback; a duplicate fails);
      direct inputs for each token shape (-m module, script path, hashFiles, with:/env:, a local action recursing into
      its run steps, ${{ github.action_path }}/X resolving to the action's own script, a top-level dotfile); comment text and /tmp and ${{ }} tokens ignored; an unresolved path or
      module fails closed; a ${GITHUB_WORKSPACE}/x token, a .venv/bin/pip token (ignored, never bin/pip), an action-relative ../../../config/x
      token and a $(dirname "$0")/.. token each resolve as specified; if: hashFiles arguments; -m of a package seeds
      the closure from __main__ (a fixture package whose __main__ imports a module __init__ does not); a JSON
      known_top_level file's command and args; closure from a declared .py input; closure pulls a module's imports
      from a tiny package; requirements.txt as a known_top_level input; check() never builds the graph; declared inputs join; paths
      --proven-by unions only matching rows; CLI derive, paths and check (argv monkeypatched, 100% line coverage);
      the real tree checks clean.
  - file: tests/checks/misc/test_validate_ci_rca_coverage.py
    action: Create
    purpose: Mirror test of the gate (missing row, stale row, bad proven_by, missing declared input, unresolved reference, clean real tree, examined count) and of its manifest Entry (pre=True, pre_globs None, full_segment full_after_lint).
bundled_recommendations: [rec-5537]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - bin/venv-python -m pytest tests/test_ci_rca_coverage.py::test_real_tree_checks_clean -q (rec-5537's stored acceptance, read back 2026-11-23) passes, and fails on main (file absent; with it on main, scripts/ci_rca/coverage.py and the table do not exist)
  - bin/venv-python -m scripts.ci_rca.coverage check exits 0 on the real tree, and derive lists every ci-rca.yml step with its direct inputs and closure
  - validate_ci_rca_coverage fails a PR that adds a ci-rca.yml step without a row, removes one leaving a stale row, or references a path that does not exist
  - rec-5537 is closed by the merge's Resolves trailer
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5537 acceptance (deriver, table and CLI).
    command: bin/venv-python -m pytest tests/test_ci_rca_coverage.py -q
    expected: exit 0; red before (file absent)
    fix_if: a derivation or fail-closed case fails; fix the deriver, never the test
    hermetic: true
    expected_literals:
      - ' passed'
    graduation: graduate
    graduation_check_id: ci-rca-coverage-derive
  - step: 2
    phase: pre-deploy
    action: The gate's mirror test.
    command: bin/venv-python -m pytest tests/checks/misc/test_validate_ci_rca_coverage.py -q
    expected: exit 0; red before (file absent)
    fix_if: the gate passes a missing, stale or unresolved row
    hermetic: true
    expected_literals:
      - ' passed'
    graduation: graduate
    graduation_check_id: ci-rca-coverage-gate
  - step: 3
    phase: pre-deploy
    action: The real tree, through the CLI.
    command: bin/venv-python -m scripts.ci_rca.coverage check && bin/venv-python -m scripts.ci_rca.coverage derive --step 'rca::rca_agent'
    expected: check exits 0; derive --step 'rca::rca_agent' (the step's id is rca_agent) names scripts/ci/claude_p_retry.sh, .claude/agents/scheduled/ci-rca.md, .mcp.json, scripts/agent_sdk/mcp_server.py and scripts/ci_rca/filing.py among the step's inputs
    fix_if: a real reference does not resolve (fix the deriver's token rule or add a declared input; never drop the fail-closed rule)
    hermetic: true
    expected_literals:
      - claude_p_retry.sh
    graduation: waive
    graduation_waiver_reason: A real-tree read of the same code steps 1-2 graduate; the gate repeats it on every PR touching the surface.
  - step: 4
    phase: pre-deploy
    action: Existing suites the new entry and row touch, then rec-5537's stored acceptance node.
    command: bin/venv-python -m pytest tests/checks/misc/test__manifest.py tests/checks/ci_guards/test_validate_ci_rca_taxonomy_accounting.py -q && bin/venv-python -m pytest tests/test_ci_rca_coverage.py::test_real_tree_checks_clean -q
    expected: exit 0; the second command is rec-5537's stored acceptance verbatim, so the node id the closure job runs exists and passes
    fix_if: the manifest grammar or the taxonomy accounting rejects the new check (fix the entry or row), or the acceptance node is missing (name the test test_real_tree_checks_clean)
    hermetic: true
    expected_literals:
      - ' passed'
    graduation: waive
    graduation_waiver_reason: Existing suites the fast and full tiers already run; steps 1-2 graduate the new guards.
  - step: 5
    phase: pre-deploy
    action: Full tier then HEAD attestation, after the build commit and rebase and before the push; started backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and --verify-head confirms the attestation names HEAD
    fix_if: a failing check; a timeout is BLOCKED, never a push
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole-suite run, not a guard; steps 1-2 graduate the new guards.
  - step: 6
    phase: post-deploy
    action: Closure read-back.
    command: bin/venv-python -c "import src.common.ducklake_reader_client as rc; rows,_=rc.fetch_recs_by_ids(rc.make_reader(profile='agent_platform'),['rec-5537']); print([(r['id'],r['status']) for r in rows])"
    expected: rec-5537 closed
    fix_if: still open; the trailer closure job did not run or its acceptance failed
    hermetic: false
test_obligations:
  - source: scripts/ci_rca/coverage.py
    behavior: step keys, each direct-input token shape, fail-closed resolution, import closure, declared inputs, paths and the CLI
    verification_step: 1
    test_selector: tests/test_ci_rca_coverage.py
    red_green_expectation: red before (file absent), green after
  - source: config/agent/ci_rca/coverage.yaml
    behavior: one row per real ci-rca.yml step, every row watchdog_only, the real tree checks clean
    verification_step: 1
    test_selector: tests/test_ci_rca_coverage.py
    red_green_expectation: red before (file absent), green after
  - source: scripts/checks/misc/validate_ci_rca_coverage.py
    behavior: fails a missing, stale, unknown-proven_by, missing-declared or unresolved row; passes the real tree
    verification_step: 2
    test_selector: tests/checks/misc/test_validate_ci_rca_coverage.py
    red_green_expectation: red before (file absent), green after
  - source: scripts/checks/misc/_manifest.py
    behavior: the gate is registered pre=True, pre_globs None, full_segment full_after_lint; the gate's mirror test asserts those three Entry fields
    verification_step: 2
    test_selector: tests/checks/misc/test_validate_ci_rca_coverage.py
    red_green_expectation: red before (no entry), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: validate_ci_rca_coverage maps to a ci-rca failure category
    verification_step: 4
    test_selector: tests/checks/ci_guards/test_validate_ci_rca_taxonomy_accounting.py::TestCiRcaTaxonomyAccountingDeclaration::test_real_tree_declares_every_taxonomy_subject
    waiver_reason: One taxonomy row; the real-tree accounting node fails on a registered check with no category row, so the row is proven by that existing node.
constraints:
  - No change to any workflow, action or CI RCA runtime file; this plan only reads them.
  - The table never lists a file a derivation can see; declared_inputs holds only what no derivation sees (non-code reads).
  - Fail closed - an unresolved reference is an error, never a skip or a warning.
  - Every row says watchdog_only until the plan that adds a smoke or seam test flips its own rows in the same change.
