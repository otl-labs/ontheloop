  - 'config/agent/ci_rca/coverage.yaml: generate the rows from derive on the real tree (every step watchdog_only), then add declared_inputs for the non-code reads you find while reading each step''s scripts.'
  - 'scripts/checks/misc/validate_ci_rca_coverage.py, its _manifest.py Entry, the taxonomy row and the mirror test.'
