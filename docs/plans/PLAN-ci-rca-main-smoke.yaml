pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - rec-5500's build merged (BUILD PRECONDITION)
execution_steps:
  - 'Sink, marker and --no-upload (writer_transport.py, filing.py, evidence/__init__.py) with their nodes.'
  - 'Fixtures, scripts/ci_rca/smoke.py and tests/test_ci_rca_smoke.py.'
  - '.github/workflows/ci-rca-smoke.yml, the capture.yaml entry and the baseline rows.'
  - 'coverage.py smoke_step rules, then the table flips (derive the smoke keys on the real tree), the ci-rca.yml watched line and the taxonomy row; then tests/ci_rca/test_ci_rca_smoke_wiring.py.'
  - Execute Verification Plan steps 1-5; loop until pass
  - 'CLOSURE: commit; rebase; VP 5; push; open the PR with the trailer ''Resolves: rec-5493''; subscribe; merge on green (2026-11-16 ruling) with expectedHeadSha; read back the merge SHA; VP 6-8.'
  - 'Report: what was implemented, verification results, merge SHA, the smoke run id, closure read-back'
rollback: Revert the squash commit; the smoke workflow, sink and flips go, CI RCA stops watching CI RCA Smoke, and the rows return to watchdog_only. A revert never runs while a red smoke is open (forward-fix, Decision 226).
