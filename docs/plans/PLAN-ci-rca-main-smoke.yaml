    behavior: the smoke workflow's bodies are registered at measured counts
    verification_step: 3
    test_selector: tests/checks/ci_guards/test__workflow_shell_bodies.py
    waiver_reason: Registration rows; the existing ceiling-equals-measured test fails an unregistered or mismatched body.
constraints:
  - Push to main only; no schedule, no dispatch, no pull_request (Decision 205 cl.1). The smoke rides ci-rca's Decision 205 cl.4 carve-out for CLAUDE_CODE_OAUTH_TOKEN and retires with it at T4.26; the wiring test forces the lane swap to change both workflows.
  - The sink never reaches the writer, and refuses anything but a smoke file_ops on ops_recommendations; ci-rca.yml never sets its variables.
  - The smoke posts nothing outside its run - no status, comment, mark, issue or S3 object.
