constraints:
  - Push to main only; no schedule, no dispatch, no pull_request (Decision 205 cl.1). The smoke rides ci-rca's Decision 205 cl.4 carve-out for CLAUDE_CODE_OAUTH_TOKEN and retires with it at T4.26; the wiring test forces the lane swap to change both workflows.
  - The sink never reaches the writer, and refuses anything but a smoke file_ops on ops_recommendations; ci-rca.yml never sets its variables.
  - The smoke posts nothing outside its run - no status, comment, mark, issue, S3 object or warehouse rec; the one exception is its telemetry capture, a Decision 236 cl.1 residual until rec-5508.
  - Only rows the smoke really runs flip to main_smoke; the rest stay watchdog_only.
context:
  - "Operator rulings 2026-11-23: blind Fable consult and 'watchdog first, rework smoke' (11:22Z); the 18:29Z card chose 'Auto after CI RCA changes; write it' over dispatch-only. Design note: /mnt/project-files/ci-rca-smoke-run/PRESENTATION-rec-5493.md. Decided with notice there: a separate workflow (no trigger-policy change, one ci-rca.yml line, CI RCA can watch it) and the file-open check as its own rec, rec-5544 (filed and read back, depends on rec-5493)."
  - "BUILD PRECONDITION: rec-5500's build has merged (scripts/ci/ci_rca_steps.sh exists on main and ci-rca.yml's rca_agent body calls it). If not, stop and report; rec-5493 lists rec-5500 and rec-5537 as dependencies (read back 2026-11-23)."
  - "Decision scout r3 FLAGS_FOUND. Decisions triaged: 228 of 228. Roadmap items intersected: 6; CONFLICT: 1; RELATED: 4. Serves: NS.6 3/5. Added cite 236 (SPIRIT NOTE: smoke capture rows are a cl.1 residual owned by rec-5508); no new contradiction."
  - "Decision scout r2 FLAGS_FOUND. Decisions triaged: 228 of 228. Roadmap items intersected: 5; CONFLICT: 1; RELATED: 3. Serves: NS.6 3/5. Added cites 100 (WARN: select vs native paths filter; note below) and 212 (cl.3 host-neutral sink, cl.2(b) cost cap); 165 NOTE: taxonomy fallback is never an unauthorized raise; T4.26 CONFLICT unchanged (wiring test)."
  - "Decision scout r1 FLAGS_FOUND. Decisions triaged: 228 of 228. Roadmap items intersected: 5; CONFLICT: 1; RELATED: 3. Serves: NS.6 3/5. CITE 72, 74, 84, 162, 181, 205, 226. CONTRADICT NOTE 205 cl.4 (a second unattended token consumer) put to the operator as the trigger choice; he chose the automatic smoke. T4.26 CONFLICT resolved by the wiring test pinning identical claude calls."
  - "red_overlap: rec-5536 (Critical, scripts/ci/claude_p_retry.sh) is open but its acceptance passes on main (checked 2026-11-23); deferred under the standing accept-with-deferral ruling. The smoke would have caught it."
  - "Decision 100 note (scout r2 WARN): the select job deliberately does not use GitHub's native on.push.paths filter. The smoke's input set is derived and moves with imports, so a static paths list would be a second, hand-regenerated list of about 150 paths that every unrelated import change must touch (the frame rec-5537 removed); the native filter also sees only the first 300 changed files and skips silently, where select fails toward run=true."
  - "Residuals: smoke telemetry mixes with real ci_rca sessions until rec-5508 (Decision 236 cl.1; its context updated to this design and read back 2026-11-23); files the smoke opens are not yet checked against the derived inputs (rec-5544); pre-merge proof stays rec-5510; the sink stops before the writer, so writer-side write-boundary rules (Decision 210) are not proven by the smoke."
  - "Selection breadth: breadth_waived (selection_budget on the scope 2026-11-23: CI test half 121.5-458.6s, elapsed 177.8-616.6s; writer_transport.py is widely imported). Declared, one plan, not split."
  - "Cost: select is a short job (pyyaml and networkx) per push to main; the smoke job runs only on a CI RCA input change, capped at 30 turns and a 35-minute job timeout (Decision 212 cl.2(b)). Frequency (measured 2026-11-23 over the last 100 first-parent merges, 2026-11-20 to 11-23, a CI RCA-heavy window): 15 would have run it (about 5 a day), mostly ci_rca_taxonomy rows and CI RCA work; expect fewer in a normal week. An agent miss on the fixture is a red on main and costs one real CI RCA run."
