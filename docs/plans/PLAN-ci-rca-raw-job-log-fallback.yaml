- No rescue agents or workaround loops (Decision 55); out-of-scope defects become recs via scripts/ops_data_portal.
context:
- "Incident: main CI run 41098287859 and Main Canary run 41099728690; CI RCA runs 41104216026 and 41105095743 refused. GitHub
  later finalized the metadata (step 9 of job 124209654871 now reads completed/failure), so the state is a transient lag that
  cannot be reproduced on demand; the tests carry the recorded shape."
- "Measured 2026-10-30 on job 124209654871: the raw job log is 6,798,475 B / 41,827 lines; bound_text_windowed at the default
  256 KB / 4000-line cap keeps the 'short test summary', the FAILED line, 'Failed checks:' and the ##[error] line in its tail."
- "gh api follows the 302 to the log blob (inferred: gh run view --log downloads the same blob store through the same client;
  not reproducible here, gh is unauthenticated in CC-web). If it ever does not, the empty raw fetch fails the attempt loudly
  (acceptance_criteria[4]) -- never a false-complete envelope."
- "Body format: a raw job log has no 'job<TAB>step<TAB>' prefixes, which no downstream reader parses (taxonomy's Failed checks
  match is exact-line). A whole-job body (raw route, and today's step-split fallback alike) ends in post-job cleanup lines, so
  fingerprint.py's last-line signature for a detail-free non-pytest failure is weak on both routes; not made worse here,
  evidence bundle out of scope (round 2 N2)."
- "fetch_run_log is at 18 of 20 branches today; the routing must land in helpers (VP step 5)."
- "Not in scope: counts for a primary window whose head and tail do not meet are still derived from the joined text (existing
  behaviour, not made worse); rec-4678 (no fallback when the RCA agent fails) stays separate."
- "red_overlap 2026-10-31: {\"verdict\": \"clear\", \"slo_hours\": 4, \"reds\": []}"
- "Decision-scout verdict FLAGS_FOUND -- Decision 166 WARN (contract at 495/500: in-place rewrites plus a one-line row, 499, VP step 5); Decision 43 NOTE (fetch_run_log and _run_log at 18/20: helpers, no waiver, VP step 5); Decision 72 NOTE (the raw route is mechanism detail, recorded in log_retrieved_derivation, no new Decision); Decision 48 SPIRIT (live check of the raw endpoint, VP step 7; the gh-specific redirect stays inferred). CITE: 55, 128, 132, 176, 181, 189, 201; RELATED 102, 130, 131, 142, 168, 86/127, 186, 226, 163, 100; roadmap T2.54, T4.23 RELATED. Decisions triaged: 191 of 191. Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2"
- "Contract wording: docs/plans/approved/ci-rca-raw-job-log-fallback.yaml, 3 blocks, digest 31f6f836619f988f... (full value in VP step 6), approved by the operator 2026-10-31."
- "Query order stays job_id under one shared budget (round 1 N3): reordering would move the body away from failed_jobs order for a rare multi-job case; the envelope already reports unqueried jobs honestly."
