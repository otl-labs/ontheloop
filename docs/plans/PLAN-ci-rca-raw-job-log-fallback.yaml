    rows, missing = fetch_recs_by_ids(make_reader(), ['rec-4776','rec-3002']); print([(r['id'], r['status']) for r in rows], missing)"
  expected: Both recs show a closed status and none are missing.
  fix_if: A rec is still open -- run `bin/venv-python -m scripts.session.merge_step recover --slug ci-rca-raw-job-log-fallback
