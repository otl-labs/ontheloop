  evidence_input.py or the evidence bundle.
- No "external cause / no rec" CI-RCA outcome (operator ruling 2026-10-30).
- The bounded transport strings _check_ci_rca_fetch_classification pins stay verbatim; no workflow edit.
- No complexity waiver, SLOC or structural-size budget raise (Decisions 43, 128, 166) -- decompose instead.
- docs/contracts/ci-rca-lifecycle.yaml changes only by the sidecar's blocks; any other wording needs Benjamin's new approval
