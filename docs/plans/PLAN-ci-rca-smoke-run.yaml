schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ci-rca-smoke-run
intent: >-
  Every change to CI RCA's runtime (the pinned CLI, scripts/ci/claude_p_retry.sh, the agent entrypoint and prompt,
  scripts/ci_rca/, the portal's file_rec path, ci-rca.yml) proves itself with a real end-to-end CI RCA run before it
  merges, and again on main right after, so the alarm for every red on main can no longer break silently (rec-5493;
  #2311's CLI bump broke the FILED-marker check, rec-5492, and nothing ran CI RCA until a real red a day later).
  Bundles rec-5500: the agent step's body moves into one tested entrypoint that the real job and the smoke both call.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ci-rca-smoke-run.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; operator ruling 2026-11-21 21:41Z that this project prevents a repeat of
  the CI RCA break, his option A card answer 2026-11-23 09:30:15Z and "write the plan" 09:30:35Z). No tier_item is
  claimed, so the Tier Item Freshness Gate is skipped; closes_criteria is empty.
closes_criteria: []
cites: [dec:72, dec:73, dec:74, dec:83, dec:84, dec:162, dec:170, dec:181, dec:205, dec:212, dec:229, dec:235, dec:246, dec:264, dec:267, dec:271, dec:279]
scope:
  - file: scripts/ci/ci_rca_agent.py
    action: Create
    purpose: >-
      rec-5500's extracted entrypoint for the Run ci-rca agent step. It holds everything the step body held after
      rec-5494's build: the prompt assembly (failed log path, bundle file list, bundle-absent and range notes), the
      claude_p_retry.sh call with the step's exact claude arguments as module constants (output format, model, effort,
      max turns, --mcp-config/--strict-mcp-config, the --allowedTools list), the cat of the output file, the filing
      --all check (exit 1 with the same ::error:: line when no pair) and the rec_id line written to GITHUB_OUTPUT.
      Inputs arrive as flags (run id, bundle sha, S3 uri, pending path, local path, bundle_absent, range note) whose
      values the step passes from its env ("$RCA_RUN_ID" and so on), never by ${{ }} interpolation in the run text.
      Standard library only (it imports nothing from the repository), because the rca job runs a copy taken from the
      workflow's own commit (ci-rca.yml row (1)); it calls ${GITHUB_WORKSPACE}/scripts/ci/claude_p_retry.sh and
      bin/venv-python -m scripts.ci_rca.filing from the workspace, as the step does today. Behaviour is the step's:
      same argv to the wrapper, same prompt text, proven against goldens recorded from main's own step body (VP 2).
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: >-
      (1) Run ci-rca agent's body becomes two lines: git show "$GITHUB_WORKFLOW_SHA:scripts/ci/ci_rca_agent.py" >
      "$RUNNER_TEMP/ci_rca_agent.py", then python3 "$RUNNER_TEMP/ci_rca_agent.py" with the inputs as flags. The
      workspace is the failing commit (Checkout at failing commit), which may predate the entrypoint, so the
      entrypoint always comes from the workflow's own commit (fetch-depth 0 already holds it), the same guard the
      range step's hashFiles and the capture step use. Its id, if: and timeout are unchanged; its env keeps every
      entry and gains one per step output it passes (RCA_RUN_ID: ${{ steps.meta.outputs.run_id }}, RCA_BUNDLE_SHA,
      RCA_BUNDLE_S3_URI, RCA_BUNDLE_PATH, RCA_BUNDLE_LOCAL, RCA_BUNDLE_ABSENT from steps.evidence). (2) on: gains push
      to main with paths equal to scripts/ci_rca/smoke.py SURFACE; workflow_dispatch gains smoke (boolean, default
      false) and surface_digest (string) inputs, and run_id becomes required: false. run-name is "ci-rca smoke
      <surface_digest>" for a smoke dispatch, "ci-rca smoke push" for a push, and otherwise "CI RCA", the workflow
      name, which is today's default display title for workflow_run and dispatch runs (the build reads one recent
      real run's display_title through the Actions API first and uses that value if it differs). (3) The concurrency group gives a smoke run its own key (github.sha
      plus "smoke"), so a smoke never queues behind a real diagnosis or shares its group. (4) The rca job's if: gains
      conjuncts so it never runs on push or on a smoke dispatch, and a non-smoke dispatch needs a non-empty run_id.
      (5) A new smoke job (runs on push to main, or a dispatch with smoke true; the rca job's fork and
      otl-workflow-dispatcher[bot] exclusions, Decision 267; timeout-minutes 25, as rca): checkout, aws-region,
      setup-python, venv install, the Install Claude Code CLI step with text identical to the rca job's, the
      Configure AWS credentials step with text identical to the rca job's (including MASK_AWS_ROLE_ID_ACCOUNT_PART,
      Decision 101) plus an if: so it runs only when github.ref is refs/heads/main, the persona dispatch gate (dispatch only, Decision 205
      cl.1, validate_persona_trigger_policy's shape), "Stage smoke fixture" (scripts.ci_rca.smoke stage), "Run ci-rca
      agent (smoke)" running the entrypoint the same two-line way with the staged outputs and step env CI_RCA_SMOKE_SINK and
      CI_RCA_FORCE_RCA=true, "Verify smoke" (scripts.ci_rca.smoke verify), and an upload of /tmp/ci-rca-output.json
      as artifact ci-rca-smoke-output (pinned action SHA), and the same Capture agent telemetry step as the rca job
      (if: always(), continue-on-error; capture.sh records --job smoke, so smoke sessions stay distinguishable from
      real ones, T3.20 c9). The smoke job sets CI_RCA_SMOKE_SINK and CI_RCA_SMOKE_ID (smoke-<run id>) on its agent
      step, has no dedup, mark or PR-comment step, and holds permissions contents: read and id-token: write only.
      (6) A wake job, mirroring approved-text-approval.yml's (Decision 246): needs smoke; its if: leads with the
      Decision 267 cl.3 conjunct (github.event_name != 'workflow_dispatch' || github.actor !=
      'otl-workflow-dispatcher[bot]') && then always() on a smoke dispatch only, so tests/verify_ci_workflow/
      test_dispatch_bot_guard.py's guard_problems holds; continue-on-error, timeout-minutes 5, permissions contents: read and pull-requests: write, no
      secrets and no id-token; it runs python -m scripts.ci_rca.smoke wake --branch "$GITHUB_REF_NAME" --run-id
      "$GITHUB_RUN_ID" --result "${{ needs.smoke.result }}" (values through env), which comments once on each open
      pull request whose head ref is the branch, so the session subscribed to that PR wakes (VP 7). The smoke job
      itself never comments. (7) Budget: ci-rca.yml is 414 of 500 effective lines (2026-11-23); measure after the
      edit, and if it no longer fits, stop and return to planning, never a raise.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      r3_workflows: ci-rca.yml::rca::rca_agent drops from 29 to its new measured count (a decrease, unrestricted);
      one entry per new smoke-job inline body at its measured count (each a one-line script call except venv
      install, which mirrors rca's 3-line Activate venv body).
  - file: scripts/ci_rca/smoke.py
    action: Create
    purpose: >-
      The smoke's data and verbs. SURFACE (globs) holds exactly the files the smoke job executes or reads on its path
      from CLI install to the filing check, so a SURFACE change is one the smoke proves: .github/workflows/ci-rca.yml,
      scripts/ci/claude_p_retry.sh, scripts/ci/ci_rca_agent.py, scripts/ci/persona_dispatch_gate.py,
      .claude/agents/scheduled/ci-rca.md, .mcp.json, scripts/ci_rca/smoke.py, scripts/ci_rca/filing.py,
      scripts/ci_rca/evidence/**, scripts/ci_rca/log_evidence.py, scripts/ops_data_portal.py,
      scripts/ops_portal/writer_transport.py, scripts/ops_portal/write_validators.py,
      scripts/ops_portal/ci_rca_runtime.py, scripts/ops_portal/ci_rca_schema.py, tests/fixtures/ci_rca/smoke/**.
      Left out by that rule: rca-only modules the smoke never runs (fetch_logs, designed_refusal, dedup,
      convergence_dedup, range_context, red_overlap and the rest of scripts/ci_rca/), the telemetry capture action
      (continue-on-error, off the filing path), config/ci_rca_taxonomy.yaml rows, and requirements.txt and transitive
      imports. A change to those alone triggers no smoke, before or after merge: it is proven only by the next
      SURFACE change's smoke or by a real red (rec-4678's fallback and rec-5504's alarm record it), the residual the
      sidecar's cl.5 names. The build adds or drops a path only by this rule.
      It is the one list the push paths filter, the gate and T4.26 read. CLI verbs: digest(rev) (sha256 over the
      sorted lines of git ls-tree -r <rev> whose path matches a SURFACE glob; one function, used by stage at HEAD
      and by the gate at pull_request.head.sha, so the same tree always gives the same digest); dispatch-inputs (prints the JSON inputs for a smoke dispatch: smoke true and the
      digest); stage (on a dispatch, refuses when the surface_digest input differs from the computed digest; copies the
      fixture to /tmp/ci-rca-failed.log, /tmp/ci-rca-jobs.json and /tmp/ci-rca-log-evidence.json; runs
      scripts.ci_rca.evidence with the rca job's evidence-step flags plus --no-upload into /tmp/ci-rca-bundles; writes the agent
      entrypoint's inputs to GITHUB_OUTPUT); verify (exactly one filing --all pair, whose id is the sink's smoke-N id
      and whose category is in config/ci_rca_taxonomy.yaml failure_categories; the sink holds exactly one line, a
      file_ops ops_recommendations record with source ci_rca and context_v2_json that Recommendation validates; prints
      SMOKE_OK); proof (the gate's lookup from a session, for the current branch and digest(HEAD) by default, or
      --event push --sha <sha> for the push smoke whose head_sha is that sha; anonymous on the public repository
      unless APPROVED_TEXT_GH_TOKEN is set; prints PROOF_FOUND run=<id> or PROOF_MISSING); wake (the wake job's
      comment: lists open pull requests with head otl-labs:<branch> and posts one comment naming the run id and
      result; no PR, no comment).
  - file: tests/fixtures/ci_rca/smoke/failed.log
    action: Create
    purpose: >-
      A small, fixed failed-run log (a CI main-validate job whose failure is unambiguous, about 60 lines) the
      evidence generator and the agent read. Fictional run ids; no real hostnames, account ids or secrets.
  - file: tests/fixtures/ci_rca/smoke/jobs.json
    action: Create
    purpose: The jobs JSON matching failed.log (one failed job), as gh run view --json jobs prints it.
  - file: tests/fixtures/ci_rca/smoke/log-evidence.json
    action: Create
    purpose: The retrieval envelope fetch_logs would write for failed.log; scripts.ci_rca.log_evidence --validate accepts it.
  - file: scripts/ci_rca/evidence/__init__.py
    action: Modify
    purpose: >-
      --no-upload flag: the bundle is written to --emit-dir as today but neither uploaded nor written to the pending
      dir, and BUNDLE_S3_URI and BUNDLE_PATH print empty, so a smoke leaves no fixture bundle in the data-lake bucket.
      Without the flag nothing changes; the rca job never passes it.
  - file: tests/ci_rca/evidence/test_main_emit.py
    action: Modify
    purpose: A --no-upload node (upload_and_persist never called, S3 uri and pending path empty, emit file written). New node only; the graduated shard ci-rca-scope-reaches-emitted-bundle is kept.
  - file: scripts/ops_portal/writer_transport.py
    action: Modify
    purpose: >-
      Dry-run sink at the top of _ducklake_write, host-neutral (Decision 212 cl.3: it reads no compute-host variable).
      When CI_RCA_SMOKE_SINK or CI_RCA_SMOKE_ID is set: refuse (RuntimeError) unless both are set, CI_RCA_SMOKE_ID
      matches ^smoke-[0-9]+$, action is file_ops and table is ops_recommendations, so a stray variable never silently
      drops a real write or an update; otherwise append one JSON line {action, table, record} (record =
      _project_ops_record's projection, the same body the writer would get) to the sink file and return {"key":
      CI_RCA_SMOKE_ID}, with no URL resolution, credential or network call. Both unset, the function is unchanged.
      Only the smoke job's agent step sets them.
    new_imports: []
  - file: scripts/ci_rca/filing.py
    action: Modify
    purpose: >-
      _MARKER_PATTERN also matches a smoke-N id. extract_filed_recs and extract_filed_rec_id return a smoke-N id only
      when CI_RCA_SMOKE_SINK is set; unset, a smoke-N marker is ignored as if absent, so a real run can never count one
      as filed. Applied on top of rec-5492's build of this file.
  - file: .claude/agents/scheduled/ci-rca.md
    action: Modify
    purpose: >-
      Where it tells the agent to emit "FILED: rec-NNN <category>", it says to emit the id the portal printed, which in
      a smoke run is smoke-N. One sentence; Tools Allowed and Read Verbs (rec-5494's build) are untouched.
  - file: scripts/checks/misc/validate_ci_rca_smoke_proof.py
    action: Create
    purpose: >-
      The pr-validate gate (Decision {{N}} cl.3 in the sidecar). The diff from the merge base touches no SURFACE path:
      skipped() (Decision 170). It does: computes the digest at the event payload's pull_request.head.sha (the merge
      ref's second parent; pr-validate checks out with fetch-depth 0), never at the merge commit, and in PR CI (GITHUB_EVENT_NAME pull_request) lists
      ci-rca.yml's workflow_dispatch runs filtered by branch (one page, per_page 20, newest first, at most 5
      candidates checked, under a prov.Deadline like approved_text_github's) through the Actions API with
      scripts.roadmap.approved_text_github's GET helper and token (APPROVED_TEXT_GH_TOKEN, already set on pr-validate,
      which holds actions: read; ci.yml's comment on it stays true, since the name is still one no GH_TOKEN reader
      sees, so ci.yml is not edited) and passes only
      on a run whose path is .github/workflows/ci-rca.yml, head_branch the PR's head ref (from the event payload),
      conclusion success and display_title "ci-rca smoke <digest>", whose actor and triggering_actor are not
      otl-workflow-dispatcher[bot] (Decision 267), and whose job named smoke concluded success (read through the
      run's jobs endpoint with the same GET helper; a run whose jobs all skipped never counts, whatever the run-level
      conclusion says); a commit status never counts (Decision 271's reasoning). None: fail, with the remedy (dispatch
      ci-rca.yml on this branch with the dispatch-inputs JSON, then re-run pr-validate). An unreadable lookup fails
      in PR CI; outside PR CI the result is advisory and never a pass (Decision 246 cl.3).
    new_imports: [scripts.ci_rca.smoke, scripts.roadmap.approved_text_github]
  - file: scripts/checks/misc/_manifest.py
    action: Modify
    purpose: One Entry (misc, not ci_guards, whose manifest is at 497 of 500 SLOC) for validate_ci_rca_smoke_proof with pre=True and pre_globs equal to SURFACE (no full_segment; the post-merge full tier does not repeat the lookup, Decision 246 cl.3).
  - file: scripts/checks/ci_guards/validate_claude_p_retry_wrapper.py
    action: Modify
    purpose: >-
      A run body calling scripts/ci/ci_rca_agent.py counts as a wrapper call site (an ENTRYPOINTS tuple), and the check
      also fails if that entrypoint stops invoking claude_p_retry.sh, so the rca and smoke jobs each stay paired with
      one capture step and ci-rca.yml stays a valid ci_workflows entry. A strengthening: no call site leaves the check
      (Decision 181 cl.1; scout round 3).
  - file: scripts/checks/ci_guards/validate_persona_trigger_policy.py
    action: Modify
    purpose: >-
      Policy.upstream_problems computes gated over every LLM step of the file, so the push-triggered smoke step (never
      failure-gated) would make every workflow_run upstream of ci-rca.yml fail to qualify (critique round 1 measured 7
      problems). Refinement: an LLM step whose job if: or step if: has the top-level && conjunct
      github.event_name != 'workflow_run' cannot run on workflow_run, so it does not count toward gated; every other
      LLM step, the rca job's included, still must be failure-gated or the upstreams must qualify. No other rule
      changes. Decision 181: precision, not a weakening; an LLM step that can run on workflow_run is judged as before.
  - file: tests/checks/ci_guards/test_validate_persona_trigger_policy.py
    action: Modify
    purpose: >-
      New nodes: a file with a failure-gated workflow_run LLM step plus a push-only LLM step carrying the exclusion
      conjunct passes (red before: today's code flags its upstreams); the same push step without the conjunct still
      fails; a workflow_run LLM step whose conjunct sits inside an || disjunct still counts; an excluded step is still held to gate_problems (the dispatch gate) and the trigger rules, so the exclusion touches only the gated computation (Decision 235 cl.1: judged precision, and named in the sidecar's cl.5 so a human approves it). Existing nodes unchanged;
      the graduated shard persona-trigger-policy is kept.
  - file: tests/checks/ci_guards/test_validate_claude_p_retry_wrapper.py
    action: Modify
    purpose: An entrypoint-calling job without a capture step fails; with one it pairs; an entrypoint that no longer calls the wrapper fails. New nodes only; the graduated shard claude-p-retry-wrapper-appends-on-unwrapped-invocation is kept (its node is unchanged).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: One function_to_category row for validate_ci_rca_smoke_proof. NEAR_CAP (494 of 500 on 2026-11-23, and other unbuilt plans add rows) -- relief step at build, measured against main then. If the row does not fit, join this row onto an existing flow-style line or compact a comment, and never raise the budget.
  - file: tests/ci_rca/test_ci_rca_smoke_wiring.py
    action: Create
    purpose: >-
      rec-5493's acceptance file. Parses ci-rca.yml: push paths equal SURFACE; the smoke job's CLI install step text
      equals the rca job's; both agent steps call scripts/ci/ci_rca_agent.py; CI_RCA_SMOKE_SINK appears only in the smoke
      job; the rca job's if: excludes push and smoke dispatch; the smoke job's AWS step runs only on main; the smoke job
      has no dedup, status or comment step and one capture step; no schedule trigger; run-name carries the digest and
      falls back to the workflow name; both agent steps run the entrypoint copied from $GITHUB_WORKFLOW_SHA, never
      the workspace file; the smoke job's AWS step text equals the rca job's apart from its if:; the smoke agent step
      carries the github.event_name != 'workflow_run' conjunct; the wake job holds no secret or id-token and its if:
      leads with the dispatcher-bot conjunct.
  - file: tests/ci_rca/test_rca_agent_entrypoint.py
    action: Create
    purpose: >-
      rec-5500's acceptance file. test_rca_agent_step_calls_extracted_entrypoint (the step body is the two-line
      copy-and-run call) plus entrypoint behaviour under a stub claude on PATH, in process (the module loaded by path,
      argv monkeypatched): the recorded wrapper argv and stdin equal the committed goldens for bundle-present (two
      bundle files), bundle-absent and range-note inputs; no FILED pair exits 1 with the ::error:: line; a pair writes
      rec_id.
  - file: tests/fixtures/ci_rca/agent_parity/
    action: Create
    purpose: >-
      Goldens recorded from main's own step body, not from the entrypoint: execution step 1 takes the post-rec-5494
      Run ci-rca agent run text from git show origin/main:.github/workflows/ci-rca.yml, replaces each ${{ ... }}
      with the case's fixture value, runs it under bash with a stub claude on PATH that records its argv and stdin
      (and prints one FILED marker), and commits one argv file and one stdin file per case (bundle-present,
      bundle-absent, range-note). Fictional run ids and paths only.
  - file: tests/test_ci_rca_smoke.py
    action: Create
    purpose: >-
      smoke.py's home per map_source_to_test (siblings: tests/test_ci_rca_range_context.py and the rest). digest(rev)
      moves only with a SURFACE blob and is equal at HEAD and at a named sha of the same tree; stage (digest mismatch
      refuses; fixture staged; evidence run with --no-upload); verify (each failure shape refuses); proof and wake
      (mocked GET and POST). Every path runs in process (argv monkeypatched, subprocess and HTTP mocked), because
      validate_test_coverage needs 100% line coverage and does not trace a subprocess; the same holds for the gate's
      and filing.py's tests.
  - file: tests/ops_data_portal/test_writer_smoke_sink.py
    action: Create
    purpose: >-
      The sink: file_rec through the CLI with both variables set writes one projected line, prints the smoke id and
      makes no network call (requests.post and boto3 patched to raise); one variable alone, a malformed id, update_ops
      or another table raises; both unset, the writer path is called as before.
  - file: tests/checks/misc/test_validate_ci_rca_smoke_proof.py
    action: Create
    purpose: Mirror test of the gate (skipped, pass, missing, wrong title, failed run, all jobs skipped under a run-level success, dispatcher-App actor or triggering_actor, unreadable in and out of PR CI).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Place the approved-text sidecar's three blocks verbatim (the new Decision entry after the intro paragraph, the
      dated Update note on Decision 83, the Amended-by note on Decision 205), filling {{N}} with the next free number
      and {{DATE}} with the build date; docs/decisions-index.json follows as the derived companion.
  - file: tests/test_ci_rca_filing.py
    action: Modify
    purpose: A smoke-N marker parses only with CI_RCA_SMOKE_SINK set and is ignored without it.
  - file: tests/ci_rca/test_agent_tool_allowlist.py
    action: Modify
    purpose: >-
      rec-5494's build creates it reading --allowedTools and the run text from the ci-rca.yml step; it now reads
      ALLOWED_TOOLS from scripts/ci/ci_rca_agent.py and the prompt from the entrypoint's builder. Assertions (a) and
      (c) unchanged. (b)'s "$(ls /tmp/ci-rca-bundles/*.json ...) substitution" check has no shell text left to read,
      so it becomes: no line of the entrypoint source says enumerate (case-insensitive), and the prompt built for a
      bundle dir holding two .json files names both paths. Recorded in the build plan's weakening_dispositions
      (Decision 235) as replaced by a behavioural check of the same property.
  - file: tests/ci_rca/test_agent_permissions_untrusted_workspace.py
    action: Modify
    purpose: rec-5494's build creates it; its step-declares-MCP node now reads the entrypoint's constants. Assertions unchanged.
bundled_recommendations: [rec-5493, rec-5500]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - bin/venv-python -m pytest tests/ci_rca/test_ci_rca_smoke_wiring.py -q (rec-5493's acceptance) passes, and fails on main (file absent; with it on main, ci-rca.yml has no push trigger, no smoke job and no entrypoint call)
  - bin/venv-python -m pytest tests/ci_rca/test_rca_agent_entrypoint.py::test_rca_agent_step_calls_extracted_entrypoint -q (rec-5500's acceptance) passes, and fails on main (inline body)
  - The sink, smoke.py, evidence --no-upload, filing and gate tests pass; the persona trigger policy's new nodes pass; the rec-5494 allowlist tests (with (b) replaced as its scope row says), workflow agent safety and body ratchet stay green
  - On the build PR, pr-validate first fails with validate_ci_rca_smoke_proof's remedy (no smoke yet), then a smoke dispatch on the build branch concludes success with SMOKE_OK, and the re-run pr-validate passes (VP 6-8)
  - After merge, the push smoke on main concludes success, and its job log shows the AWS step succeeded and no MCP read verb was denied (VP 9)
  - rec-5493 and rec-5500 are closed by the merge's Resolves trailer
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5493 acceptance (smoke wiring in ci-rca.yml).
    command: bin/venv-python -m pytest tests/ci_rca/test_ci_rca_smoke_wiring.py -q
    expected: exit 0; red before (file absent; with it on main, no push trigger, no smoke job, no entrypoint call)
    fix_if: a wiring assertion fails; fix the workflow, never the test
    hermetic: true
    expected_literals:
      - ' passed'
    graduation: graduate
    graduation_check_id: ci-rca-smoke-wiring
  - step: 2
    phase: pre-deploy
    action: rec-5500 acceptance and entrypoint parity (same wrapper argv and prompt text as the old step body).
    command: bin/venv-python -m pytest tests/ci_rca/test_rca_agent_entrypoint.py -q
    expected: exit 0; red before (file absent; with it on main, the step body is inline)
    fix_if: an argv or prompt difference; the entrypoint must reproduce the step exactly
    hermetic: true
    expected_literals:
      - ' passed'
    graduation: graduate
    graduation_check_id: ci-rca-agent-entrypoint
  - step: 3
    phase: pre-deploy
    action: Sink, smoke verbs, smoke-id filing and the pr-validate gate.
    command: bin/venv-python -m pytest tests/test_ci_rca_smoke.py tests/ops_data_portal/test_writer_smoke_sink.py tests/checks/misc/test_validate_ci_rca_smoke_proof.py tests/test_ci_rca_filing.py tests/ci_rca/evidence/test_main_emit.py -q
    expected: exit 0; red before (three files absent; the filing smoke-id and --no-upload nodes fail on main)
    fix_if: the sink touches the network or accepts a non-smoke write, or the gate passes without a matching run
    hermetic: true
    expected_literals:
      - ' passed'
    graduation: graduate
    graduation_check_id: ci-rca-smoke-sink-and-gate
  - step: 4
    phase: pre-deploy
    action: Existing suites that read ci-rca.yml or its agent step stay green.
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_claude_p_retry_wrapper.py tests/ci_rca/test_agent_tool_allowlist.py tests/ci_rca/test_agent_permissions_untrusted_workspace.py tests/checks/ci_guards/test_validate_persona_trigger_policy.py tests/checks/ci_guards/test_validate_workflow_agent_safety.py tests/checks/ci_guards/test__workflow_shell_bodies.py tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py tests/checks/ci_guards/test_validate_ci_rca_taxonomy_accounting.py tests/verify_ci_workflow/test_dispatch_bot_guard.py -q
    expected: exit 0; the wrapper check's and the persona trigger policy's new nodes red before
    fix_if: the smoke job breaks the persona gate shape, the capture pairing or an allowlist read; fix the workflow or the read seam, never loosen a check
    hermetic: true
    expected_literals:
      - ' passed'
    graduation: waive
    graduation_waiver_reason: Collected suites the fast and full tiers re-run (the wrapper check's new nodes run there too); steps 1-3 graduate the new guards.
  - step: 5
    phase: pre-deploy
    action: Full tier then HEAD attestation, after the build commit and rebase and before the push; started backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and --verify-head confirms the attestation names HEAD
    fix_if: a failing check; a timeout is BLOCKED, never a push
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The full tier and its HEAD attestation are a whole-suite run, not a guard; steps 1-3 graduate the new guards.
  - step: 6
    phase: pre-deploy
    action: >-
      The gate refuses the build PR before any smoke (live red-before). Run the command on the build branch, then read
      the PR's first pr-validate run (mcp__github__actions_list for ci.yml at the PR head, then mcp__github__get_job_logs
      for its failed job).
    command: bin/venv-python -m scripts.ci_rca.smoke proof --repo otl-labs/ontheloop
    expected: PROOF_MISSING, and that pr-validate job log names validate_ci_rca_smoke_proof and the dispatch remedy
    fix_if: the gate passes with no smoke run; the lookup is wrong
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Live read of the build PR's own gate against GitHub; the gate's logic graduates through step 3's mirror test.
  - step: 7
    phase: pre-deploy
    action: >-
      Dispatch the smoke on the build branch: print the inputs with bin/venv-python -m scripts.ci_rca.smoke
      dispatch-inputs, dispatch ci-rca.yml at the branch ref through mcp__github__actions_run_trigger (Decision
      {{N}} cl.2 admits a session under the maintainer's account), end the turn and wake on the wake job's comment on
      the build PR (subscribe_pr_activity delivers it; never sleep or poll), then read the Verify smoke step's log.
    command: bin/venv-python -m scripts.ci_rca.smoke proof --repo otl-labs/ontheloop
    expected: PROOF_FOUND run=<id>; that run's Verify smoke step printed SMOKE_OK and its upload holds the raw CLI output
    fix_if: a red smoke; RCA from its log (a runtime defect is fixed on the branch, never the smoke weakened); a vendor outage or expired token goes to the operator (UI merge is the valve)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Live smoke dispatch against GitHub and the vendor CLI; after merge the push smoke on main repeats it on every runtime change.
  - step: 8
    phase: pre-deploy
    action: Re-run the build PR's pr-validate after the smoke.
    command: bin/venv-python -m scripts.ci_rca.smoke proof --repo otl-labs/ontheloop
    expected: PROOF_FOUND, and the re-run pr-validate on the same head concludes success
    fix_if: the gate still fails; the digest the gate computes differs from the dispatch input
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Live pr-validate re-run on the build PR; step 3's mirror test graduates the pass path.
  - step: 9
    phase: post-deploy
    action: >-
      The push smoke on main after the merge: the command with the merge SHA, then that run's smoke job log
      (mcp__github__get_job_logs) for the Configure AWS credentials step and the agent's MCP read-verb results.
    command: bin/venv-python -m scripts.ci_rca.smoke proof --repo otl-labs/ontheloop --event push --sha <merge sha>
    expected: PROOF_FOUND run=<id> titled "ci-rca smoke push"; the job log shows the AWS step succeeded, Verify smoke printed SMOKE_OK and no MCP read verb was denied
    fix_if: red on main; RCA from its log; rec-4678's fallback records it once built
    hermetic: false
  - step: 10
    phase: post-deploy
    action: Closure read-back.
    command: bin/venv-python -c "import src.common.ducklake_reader_client as rc; rows,_=rc.fetch_recs_by_ids(rc.make_reader(profile='agent_platform'),['rec-5493','rec-5500']); print([(r['id'],r['status']) for r in rows])"
    expected: both closed
    fix_if: a rec still open; the trailer closure job did not run or its acceptance failed
    hermetic: false
