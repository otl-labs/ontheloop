execution_steps:
  - >-
    Run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-ci-rca-watchdog.yaml; on blocked by reds
    other than rec-5491/rec-5497 or by a shared path, stop and report; blocked only by those two, log the deferral and
    proceed.
  - Implement scripts/ci_rca/watchdog.py, ci-rca-watchdog.yml, the two ci-rca.yml lines, the taxonomy row (with the relief if needed) and the baseline rows per their scope rows.
  - Write tests/test_ci_rca_watchdog.py per test_obligations.
  - Commit, then run VP 1-3; loop until pass; on an unrecoverable failure stop and report (Decision 55).
  - Code review via a fresh code-review subagent; fix blocking findings; rerun VP 1-2.
  - >-
    CLOSURE per the implement skill Commit Flows; VP 4 on the committed clean HEAD; push; PR; squash-merge on green
    with "Resolves: rec-5504"; merge_step readback; VP 5-7.
  - 'Report: what was implemented, verification results, PR and merge SHA, the VP 6 issue number, VP 7 read-back.'
rollback: >-
  Revert the build's squash commit: the watchdog workflow and the run-name go; nothing else depended on
  them. Watchdog issues already opened stay (they record real orphans).
