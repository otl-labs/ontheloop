  - 'One build PR. "Resolves: rec-5504" goes in a branch commit message and in the squash commit body.'
  - >-
    The watchdog never calls an LLM, never assumes an AWS role, never reads or writes the portal and never reads a
    secret: it must not share CI RCA's failure modes. It writes only to GitHub issues, with fixed templates over run
    facts (Decision 101: public repo).
