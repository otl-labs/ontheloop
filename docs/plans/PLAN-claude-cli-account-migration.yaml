schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: claude-cli-account-migration
intent: >-
  Account-migration quick fix the operator asked for on 2026-11-19. CI's two claude -p agents (ci-rca and the
  subagent-plan-review terraform plan reviewer) move from Claude Code CLI 2.1.148, whose aliases resolve to Opus 4.7,
  to CLI 2.1.323, with the model named by alias and effort high at each call site, so both run the latest Opus. The
  repository's records of CLAUDE_CODE_OAUTH_TOKEN follow the operator's own re-mint of that secret on his current
  (company) Claude account, so CI no longer draws on his personal subscription. Interim on the Decision 205 cl.4
  subscription lane; T4.26 and rec-4506 are unchanged.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-claude-cli-account-migration.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; operator request 2026-11-19 bundling rec-5426 and rec-5428). No tier_item
  is claimed, so the Tier Item Freshness Gate is skipped; T4.26 (deferred_post_mvp) only has its note's watch-signal
  date updated, and closes_criteria is empty.
closes_criteria: []
cites: [dec:74, dec:162, dec:195, dec:205, dec:244, dec:246]
scope:
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: >-
      Install Claude Code CLI step: @anthropic-ai/claude-code@2.1.148 becomes @2.1.323 on the same line. Run ci-rca agent
      step: the existing argument line `--output-format json \` becomes `--output-format json --model "opus[1m]" --effort
      high \`. No line is added or removed in either body, so the composite_action_body_baseline r3_workflows ceilings
      (install-claude-code-cli 4, rca_agent 29) hold untouched. Nothing else in the file changes.
    new_imports: []
  - file: .github/actions/subagent-plan-review/review.sh
    action: Modify
    purpose: >-
      The guarded install line pins @2.1.323. In _review, the claude_p_retry.sh argument line becomes
      `--output-format json --model opus --effort high --tools "" --strict-mcp-config --max-turns "$MAX_TURNS" "$PROMPT" <
      "${STEP_DIR}/plan_digest.txt"` (same line). Nothing else changes.
    new_imports: []
  - file: tests/test_claude_cli_model_pin.py
    action: Create
    purpose: >-
      (a) Every @anthropic-ai/claude-code@<version> under .github/ is 2.1.323, and ci-rca.yml and review.sh are among
      the sites found (no exact site count, so a later install site does not turn the record red; Decision 244 cl.4).
      The exact pin is deliberate: each future bump edits this test as an explicit plan change (Decision 74), and T4.26
      c1 retires it with the claude -p lane. (b) Each install sits under `if ! command -v claude`, and every job that reaches one runs on
      ubuntu-latest: ci-rca.yml's rca job, every job in terraform-apply-sandbox.yml and reconcile.yml whose steps use
      ./.github/actions/subagent-plan-review, and subagent-review-smoke.yml's smoke job. The jobs are found by parsing
      the workflow YAML, never a hard-coded list. (c) ci-rca's Run ci-rca agent step body (parsed from the workflow
      YAML) passes --model "opus[1m]" and --effort high to claude_p_retry.sh. No import from any test_* module
      (Decision 131, validate_no_cross_test_imports).
    new_imports: []
  - file: tests/test_subagent_review_wiring.py
    action: Modify
    purpose: >-
      One new node in TestProceed, test_model_and_effort_reach_the_cli, in the shape of
      test_retry_keeps_the_same_turn_budget: on a PROCEED verdict the harness's CLAUDE_INVOCATION_LOG contains
      --model opus and --effort high. Existing nodes byte-identical.
    new_imports: []
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: >-
      ANT-04 gets owner_today company and status proven. Its target records the re-mint on the company Claude account
      within Decision 205 clause 4 lanes until T4.26 (the re-mint does not extend T4.26's horizon). It gains `expires`
      set to the new token's date. One evidence_ledger entry is appended (row ANT-04, status proven), citing the
      operator's green subagent-review-smoke run on main after the re-mint. One amendment_log correction row names this
      plan. The words are bound by the approved-text sidecar docs/plans/approved/claude-cli-account-migration.yaml.
    new_imports: []
  - file: .github/workflows/ghas-probe.yml
    action: Modify
    purpose: >-
      Credential header comment only: the CLAUDE_CODE_OAUTH_TOKEN lines name the company Claude account subscription
      (no API billing) and the new expiry. The GHAS_PROBE_TOKEN lines and the rotation-procedure lines are unchanged.
      Sidecar-bound.
    new_imports: []
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      T4.26's note: its watch-signal names the new expiry (re-minted on the company Claude account). No other T4.26 field
      and no other item changes. Sidecar-bound.
    new_imports: []
  - file: config/agent/verification_registry/entries/t425-t427-followon-items.yaml
    action: Modify
    purpose: >-
      The shard's token-expiry assertion literal '2027-05-31' becomes the new expiry date and nothing else changes: it
      still asserts a dated watch-signal in T4.26's note at the same strength. This is the Decision 244 cl.5 repair with
      the claim unchanged, and a planned change (Decision 235) approved through the sidecar.
    new_imports: []
bundled_recommendations: [rec-5426, rec-5428]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - Both CLI installs pin 2.1.323. ci-rca passes --model "opus[1m]" --effort high and the plan reviewer passes --model opus --effort high, and the stub-harness argv proves the reviewer's flags reach the CLI.
  - ANT-04 reads owner_today company and status proven, with a latest evidence_ledger entry naming the post-re-mint green smoke run. ghas-probe.yml's header, T4.26's note and the t425-t427-followon-items shard carry the new expiry, word for word as the sidecar binds them.
  - After the merge, subagent-review-smoke on main is green on CLI 2.1.323 and the new token, and the squash's Resolves trailer closes rec-5426 and rec-5428.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Pin, guard, model and effort tests.
    command: bin/venv-python -m pytest tests/test_claude_cli_model_pin.py "tests/test_subagent_review_wiring.py::TestProceed::test_model_and_effort_reach_the_cli" -q
    expected: exit 0; red before (the file and node are absent; with them on the old tree, the 2.1.148 pin and the missing flags fail)
    fix_if: a third install site, a stale pin, or a flag that does not reach the stub argv
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: claude-cli-pin-and-model-alias
  - step: 2
    phase: pre-deploy
    action: The existing reviewer, smoke and retry suites still pass.
    command: >-
      bin/venv-python -m pytest tests/test_subagent_review_wiring.py tests/test_subagent_review_smoke.py
      tests/test_subagent_plan_review_values_stripped.py tests/test_subagent_review_overflow_and_reason.py
      tests/test_ci_claude_p_retry.py -q
    expected: exit 0
    fix_if: an existing node fails; the argument-line edit broke the stub contract
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Already-graduated suites the full tier re-runs; step 1 graduates the new guard.
  - step: 3
    phase: pre-deploy
    action: The inventory check passes, and the re-pinned T4.26 shard passes on the edited roadmap.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_account_credential_inventory.py -q &&
      bin/venv-python -c "from scripts.verification_graduation import load_entries, materialize_check; from
      scripts.verification_checks import CheckStatus; r=[x for x in load_entries() if
      x['check_id']=='t425-t427-followon-items'][0]; res=materialize_check(r).run(); assert res.status==CheckStatus.PASS,
      res.message; print('SHARD_T425_OK')"
    expected: exit 0
    fix_if: ANT-04 proven without a matching latest evidence entry, or the note's date and the shard's literal differ
    hermetic: true
    expected_literals: ["SHARD_T425_OK"]
    graduation: waive
    graduation_waiver_reason: The inventory check and the shard are the standing guards for these claims.
  - step: 4
    phase: pre-deploy
    action: The inline-body line ceilings are unchanged.
    command: >-
      bin/venv-python -c "from scripts.checks.ci_guards.validate_composite_action_shell_bodies import
      validate_composite_action_shell_bodies as v; f=[]; v(f); assert not f, f; print('BODIES_OK')"
    expected: exit 0
    fix_if: a flag landed on a new line; move it onto the existing argument line
    hermetic: true
    expected_literals: ["BODIES_OK"]
    graduation: waive
    graduation_waiver_reason: The ratchet itself is the standing guard.
  - step: 5
    phase: pre-deploy
    action: Bind the edits to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug claude-cli-account-migration --base origin/main
    expected: exit 0; every block matches word for word
    fix_if: any word differs; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: PR-relative to origin/main; validate_merge_step's approved-text leg enforces the sidecar on every PR declaring this plan.
  - step: 6
    phase: pre-deploy
    action: Full tier then HEAD attestation, after the build commit and rebase and before the push; started backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the attestation matches HEAD
    fix_if: any failure; fix and rerun from the start (HOME must be an empty dir for tests/test_aws_profile.py)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 7
    phase: post-deploy
    action: Dispatch subagent-review-smoke on main after the merge (an admitted maintainer dispatch, Decision 205 cl.1).
    command: >-
      mcp__github__actions_run_trigger(method=run_workflow, owner=otl-labs, repo=ontheloop,
      workflow_id=subagent-review-smoke.yml, ref=main); then mcp__github__actions_get(get_workflow_run) on the new run
    expected: conclusion success, with SMOKE outcome=proceed in the job log; record the run id
    fix_if: a CLI usage error (a flag 2.1.323 rejects) or an auth error; stop and report to the planner (forward-fix, no rescue loop)
    hermetic: false
  - step: 8
    phase: post-deploy
    action: >-
      The first ci-rca run on main after the merge. It is event-driven: report it when it happens, and it does not block
      the merge or the build report.
    command: >-
      read that run's Install Claude Code CLI log line; then AWS_PROFILE=agent_platform bin/venv-python -m
      scripts.telemetry_usage models --from <run date> --to <run date> --by-agent
    expected: the log line reads 2.1.323 (Claude Code) and the ci-rca row's model is claude-opus-5-5
    fix_if: another version or model; read the installed CLI's alias table and report to the planner
    hermetic: false
  - step: 9
    phase: post-deploy
    action: Both recs are closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows,_=fetch_recs_by_ids(make_reader(),['rec-5426','rec-5428']); print([(r['id'],r['status']) for r in
      rows])"
    expected: both closed; record the closure job run id
    fix_if: still open; read the closure job's log for an acceptance refusal, fix the cause, never a direct status write
    hermetic: false
test_obligations:
  - source: .github/workflows/ci-rca.yml
    behavior: pinned CLI 2.1.323 and --model "opus[1m]" --effort high at the claude_p_retry call site
    verification_step: 1
    test_selector: tests/test_claude_cli_model_pin.py
    red_green_expectation: red before (2.1.148, no flags), green after
  - source: .github/actions/subagent-plan-review/review.sh
    behavior: pinned CLI 2.1.323, and --model opus --effort high reach the claude argv
    verification_step: 1
    test_selector: tests/test_subagent_review_wiring.py::TestProceed::test_model_and_effort_reach_the_cli
    red_green_expectation: red before (no flags in the stub argv), green after
  - source: config/agent/verification_registry/entries/t425-t427-followon-items.yaml
    behavior: the T4.26 note carries the dated token-expiry watch-signal
    verification_step: 3
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_account_credential_inventory.py -q && bin/venv-python -c "from scripts.verification_graduation import load_entries, materialize_check; from scripts.verification_checks import CheckStatus; r=[x for x in load_entries() if x['check_id']=='t425-t427-followon-items'][0]; res=materialize_check(r).run(); assert res.status==CheckStatus.PASS, res.message; print('SHARD_T425_OK')"
    red_green_expectation: red if the note and the shard disagree on the date, green after both carry the new one
constraints:
  - "Rotating CLAUDE_CODE_OAUTH_TOKEN is the operator's own step (git-ops.yaml oauth_token_provisioning), done before the sidecar is written. Agents never see or handle its value, and only names, dates and run ids are written (Decision 101; inventory publication_rule)."
  - "No flag goes on a new line in either inline body (Decision 162 r3 ceilings). No other ci-rca.yml or review.sh change: claude_p_retry.sh, the prompt, --allowedTools and the curated environment are untouched."
  - "Decision 205 cl.4 interim lane only: the re-mint and bump do not extend T4.26's horizon, and rec-4506 still picks the long-term ci-rca model."
  - "The shard re-pin keeps the claim unchanged (Decision 244 cl.5); no assertion is loosened (Decision 235)."
  - "No rescue agents or workaround loops (Decision 55)."
context:
  - "Decision-scout verdict FLAGS_FOUND (rounds 1-2; round 2 added WARN 131, fixed by moving the argv node into the wiring file, and NOTE 244 cl.4, fixed by dropping the exact site count). CITE: 74 (pin bumps are explicit plan changes; its body still names 2.1.148 as history and is not annotated, to keep this light), 162 (r3 ceilings; R2 argv harness), 195 (company-cutover programme, ANT-04), 205 (cl.4 interim subscription lane until T4.26), 244 (cl.5 shard repaired with its claim unchanged), 246 (sidecar approved on GitHub). CONTRADICT: none. SPIRIT NOTE 205/206 cl.1: the token must come from the operator's own single seat, which was asked at sign-off and is confirmed at the operator's re-mint. Decisions triaged: 227 of 227. Roadmap items intersected: 6; CONFLICT: 0; RELATED: 6. Serves: mission 2/5 -- keeps the two unattended verdict agents on the newest model and a company-owned credential; maintenance, not improvement."
  - "Probe 2026-11-19 (scratch install, no auth): CLI 2.1.323 (published 2026-11-12, after a 7-day wait that mirrors dependabot's actions cooldown) maps aliases opus and opus[1m] to claude-opus-5-5. It accepts --output-format json, --tools \"\", --strict-mcp-config, --max-turns, --session-id, --allowedTools, --model and --effort. The result JSON keeps type, num_turns, permission_denials and session_id. Transcripts land under HOME/.claude/projects/<cwd>/<session>.jsonl (the telemetry capture adapter's tree). A dummy token returns 401, not a usage error. Live authenticated behaviour is UNPROVEN until VP 7."
  - "ubuntu-latest has no claude preinstalled: inferred, not read from the runner image list; ci-rca's existing `claude --version` line and VP 8 read it back."
  - "claude.yml is unchanged: claude-code-action v1.0.279 depends on @anthropic-ai/claude-agent-sdk ^0.3.326 and runs in the checkout under .claude/settings.json model opus[1m] (inferred to be Opus 5.5)."
  - "Order: (1) the operator re-mints the token from his own seat, updates the secret, dispatches subagent-review-smoke on main (green) and reports the expiry setup-token showed; (2) the planner writes the sidecar with those values, runs the wording check and the approval run; (3) the plan PR merges on green; (4) build. The plan PR merges only once the sidecar is approved."
  - "rec acceptances replaced 2026-11-20 with operator sign-off ('write the plan' on the presentation that proposed them): rec-5426 now greps the 2.1.323 pin and '--model opus --effort high' (it was the exact id claude-opus-5-5); rec-5428 now greps 'id: ANT-04, .*status: proven' (its negative-only form was UNDECIDABLE to plan_obligations)."
  - "Overlaps (plan_obligations): unbuilt plans also scope ci-rca.yml (actions-sha-pin-non-codeowners, ci-rca-adjudication-guard, merge-annotate-producer, pr-conflict-signal-exit-status, scheduled-workflow-dispatch, telemetry-claude-p-capture-adapter, wording-approval-routing), review.sh (plan-review-digest-actionable-first), the inventory (several) and ROADMAP-PLATFORM.yaml (many); whichever builds second rebases. ROADMAP-PLATFORM.yaml NEAR_CAP is the roadmap class; this edit is line-neutral (the note gains a few words)."
  - "LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition. compute_affected_artifacts(<this plan's scope>) returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']}: the live roadmap is a packaged asset of the active data-pipeline artifact. No build, deploy or smoke test is owed: the change is data only (T4.26's note text; no packaged code), and the asset refreshes with the artifact's next governed deploy. No other scope file is Lambda-packaged and no .tf file is in scope. Precedent: PLAN-work-graph-edge-model."
  - "Left as is: ANT-01 (the founder's claude.ai account; target 'Retained and downgraded at period end, never cancelled') and BILL-03 (payer personal; evidence wanted is the company subscription page) are the operator's account and billing rows, not this token; any change to them is the operator's own ruling, outside this plan. git-ops.yaml oauth_token_provisioning L528 ('uses your Max plan subscription') is generic runbook text and stays (file near its 500-line cap)."
  - "Residual (critique r1 F7): the plan reviewer has no version or model read-back after deploy (review.sh prints neither, and adding a claude call would break the wiring suite's invocation counts). Its model rests on the 2.1.323 alias-table probe plus the pin test; VP 7 proves the CLI, flags and token run. ci-rca's opus[1m] on the company token is first exercised by VP 8 (event-driven); a 1M-context entitlement refusal would surface there. Mitigation read: this planning session itself runs claude-opus-5-5[1m] on the operator's current account, so the 1M variant is entitled on that account (inferred for the setup-token path)."
  - "fork: CLI version | chosen: 2.1.323, newest release at least 7 days old at plan time | class: consistency-only | precedent: .github/dependabot.yml | precedent_kind: contract | reversible: yes | persisted: ci-rca.yml and review.sh install lines"
  - "fork: model naming | chosen: aliases opus[1m] (ci-rca, matching .claude/settings.json) and opus (reviewer) | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: ci-rca.yml and review.sh argument lines"
  - "fork: effort level for both CI agents | chosen: high | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: ci-rca.yml and review.sh argument lines"
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:d870e85d3aa699f39e089ffcbda17fa395bf1a587f50761ad6924b2aba79bfcd"}  # pragma: allowlist secret
  - {gate: decision-scout, round: 2, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:baf1b1936fd724332a1ca73b9a5c7fe95a541c46964b676b06ef15e3e2137c87"}  # pragma: allowlist secret
  - {gate: plan-critique, round: 1, verdict: REVISE, blocking: 2, nits: 7}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decisions 162, 205, 244 and 246 sections read
  - The operator's re-mint smoke run id and new expiry are in the approved sidecar
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "ci-rca.yml and review.sh: the pin and the same-line flags (scope rows 1-2); then the new test (row 3) and the wiring node (row 4); VP 1, 2, 4."
  - "Records: the inventory, ghas-probe.yml header, T4.26 note and the shard literal, word for word from the sidecar; VP 3."
  - "Add the graduated shard config/agent/verification_registry/entries/claude-cli-pin-and-model-alias.yaml (VP 1's graduation)."
  - "CLOSURE (implement skill Commit Flows; git-ops.yaml): set implementation_declared: true; commit with Resolves: rec-5426, rec-5428; git fetch origin main && git merge or rebase per git-ops; VP 5; VP 6 (full tier backgrounded from the top-level session, then --verify-head; a timeout is BLOCKED, no push); push; open the PR; subscribe; code review in a fresh context; merge on green (2026-11-16 build ruling) with Resolves: rec-5426, rec-5428 in the squash body; then VP 7 and 9, reporting the PR number, run ids and merge SHA. VP 8 is reported when the first ci-rca run happens."
  - "Report: what was implemented, verification results"
rollback: >-
  Revert only the CLI and flag rows (ci-rca.yml, review.sh, the new test and the wiring node) in a forward PR; ci-rca
  then returns to 2.1.148 at its settings model. Keep the record rows (inventory, ghas-probe header, T4.26 note and its
  shard): the live token stays the company re-mint either way.
