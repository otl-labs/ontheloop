schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: claude-cli-seam-contract
intent: >-
  Prove the seam between the pinned claude CLI, scripts/ci/claude_p_retry.sh and CI RCA's FILED parser
  (scripts/ci_rca/filing.py) with one contract probe that runs two ways, both before merge where an agent is watching:
  in --pre on every PR that touches a seam input, against golden envelopes captured from the real pinned CLI; and live
  at every pin bump, because the bump fails --pre until its goldens are recaptured and recapture is the probe run
  against the real new CLI in the implementing session. The CLI pin moves into one file that one validated installer
  reads for every install site (rec-5509), so a CLI bump like #2311 can no longer break CI RCA with every unit test
  green.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-claude-cli-seam-contract.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category: rec-5509, High, split from rec-5493 after the operator chose "watchdog
  first, rework smoke" 2026-11-23 11:22Z; no tier_item claimed, so the Tier Item Freshness Gate is skipped; closes no
  criterion). CI scripts, two install sites, a config row and tests change; no Lambda, Terraform or new workflow, so V2
  with live reads of the two changed install sites after merge.
cites: [dec:74, dec:162, dec:205, dec:206, dec:224]
scope:
  - file: config/claude-cli-version
    action: Create
    purpose: >-
      The single home of the claude CLI version for CI: one line, the bare version (2.1.323 today), trailing newline,
      nothing else. Only scripts/ci/install_claude_cli.sh and tests read it; a bump is a one-line edit plus a golden
      recapture.
  - file: scripts/ci/install_claude_cli.sh
    action: Create
    purpose: >-
      The one installer every site calls: `install_claude_cli.sh <repo_root>`. Reads <repo_root>/config/claude-cli-version
      and validates it against ^[0-9]+\.[0-9]+\.[0-9]+$ before anything else; a missing, unreadable or malformed file
      prints one stderr line naming the cause and exits 2 with no npm call (fails closed, never an unpinned install).
      If `command -v claude` succeeds it prints that path (never invoking `claude`, so a logging shim on PATH, as in
      tests/test_subagent_review_wiring.py, sees no extra call) and exits 0 (today's guard semantics). Otherwise
      it runs `sudo npm install -g "@anthropic-ai/claude-code@${version}" --omit=dev --omit=optional && sudo npm cache
      clean --force` (Decision 74's flags), then requires `claude --version` to contain the pin, else exits 1. Bash,
      `set -euo pipefail`, no other side effects.
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: >-
      Only the rca job's Install Claude Code CLI step changes: it moves to just after the first (default-branch)
      checkout, before "Checkout at failing commit", so the pin and installer are read from the trusted main tree, and
      its body becomes `bash scripts/ci/install_claude_cli.sh "$GITHUB_WORKSPACE"` then `claude --version` (no more
      effective lines than today). The CLI is a global install, so the later checkout does not remove it. No trigger,
      job, concurrency or other step changes.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      validate_composite_action_shell_bodies R3 row (r3_workflows section, key "<workflow>::<job>::<step-id>") for the
      rca job's install step, re-measured after the change (it may only decrease). No raise marker.
  - file: .github/actions/subagent-plan-review/review.sh
    action: Modify
    purpose: >-
      The guarded literal install becomes `if ! bash "${WORKSPACE_ROOT}/scripts/ci/install_claude_cli.sh"
      "${WORKSPACE_ROOT}"; then` _starved_marker naming the installer failure, outcome=starved, exit 1. It runs
      unconditionally (the installer holds the `command -v claude` guard). Nothing else changes.
  - file: scripts/ci/claude_p_seam_contract.py
    action: Create
    purpose: >-
      Stdlib-only contract probe. main(argv) -> int. Module constant SEAM_FILES names its non-Python inputs
      (config/claude-cli-version, scripts/ci/claude_p_retry.sh, scripts/ci/install_claude_cli.sh); the selection node
      reads them from here, never from a list in the test, and the test file also spells each SEAM_FILES basename and
      golden basename literally (the data-edge and mention channels read only test text). The CLI runs with cwd an
      empty mktemp directory, as review.sh does, so repo CLAUDE.md/AGENTS.md cannot steer the reply. Default mode: pipes the fixed prompt "Reply with exactly this line
      and nothing else: FILED: rec-0 seam_contract" into WRAPPER (ROOT/scripts/ci/claude_p_retry.sh) with
      `<out> -- --output-format json --model haiku --max-turns 1`, then asserts, each with its own FAIL line naming
      the broken contract: wrapper exit 0; the output file is exactly one JSON object (json.loads of the whole file);
      its is_error is false and its result is a string; <out>.stderr exists; and
      scripts.ci_rca.filing.extract_filed_recs(out) == [("rec-0", "seam_contract")]. Prints one PASS line and returns 0,
      else returns 1. A failing marker check with a valid envelope says "envelope ok, marker missing (model reply)" so
      a model wording slip is told apart from a broken seam; no retry beyond the wrapper's (Decision 55).
      `--capture <dir>` is the pin-bump live check: it first requires `claude --version` to contain the pin (else exit
      2), runs the same probe against the real CLI and, only on PASS, writes <dir>/success.stdout.json, <dir>/success.stderr.txt and
      <dir>/version.txt (the `claude --version` output); a FAIL writes nothing, so a CLI that breaks the seam cannot
      get goldens. Scrub at capture (public repo): session_id and uuid values become fixed zero UUIDs; any absolute
      path in either stream becomes <WORKDIR> or <HOME>; any key matching account, email, org or user (case
      insensitive) has its value replaced by "<redacted>"; key sets and every other value are unchanged. The
      capture refuses to write (exit 2) if the scrubbed text still matches the never-commit hook's secret shapes.
      `--out` defaults to a temp path.
  - file: tests/ci/test_claude_p_seam_contract.py
    action: Create
    purpose: >-
      rec-5509's acceptance. Nodes: test_golden_envelope_passes_real_wrapper_and_parser (a stub `claude` on PATH replays
      tests/fixtures/claude_cli_envelopes/<pin>/success.stdout.json on stdout and success.stderr.txt on stderr, exit 0;
      main() returns 0); test_stderr_in_envelope_fails_the_probe (stub writes the golden stderr then the envelope to
      stdout, the #2311 shape; main() returns 1 and names the envelope); test_marker_missing_is_named;
      test_golden_matches_pin (the directory named by config/claude-cli-version exists with all three files, its
      version.txt contains the pin, and no other version directory exists; on failure its message is the pin-bump
      procedure: the exact --capture command for the new pin and the instruction to delete the old directory);
      test_fast_tier_selects_the_probe_for_every_seam_input (for each SEAM_FILES entry, each golden file and the repo
      file of every module in the probe's forward import closure from scripts.dependency_graph's
      import_subgraph/forward_closure, scripts.checks.deps.affected_tests.derive_affected_tests([("M", path)]) selects
      this test file, so --pre runs the probe whenever a seam input changes; tests/test_plan_decision_projection.py is
      the precedent for calling it; about 0.3 s per input measured 2026-11-23); test_capture_normalises_ids (capture
      mode against the stub writes the three files with zero UUIDs and an otherwise identical key set);
      test_capture_scrubs_private_fields (a stub envelope carrying an absolute path, an email-keyed field and an
      account id comes out with those values replaced and its key set unchanged); test_capture_writes_nothing_on_fail (a stub CLI with the #2311 shape leaves the capture directory empty);
      test_capture_refuses_a_cli_off_pin (exit 2).
      Covers claude_p_seam_contract.py at 100% lines in-process (main() called directly with a monkeypatched PATH).
  - file: tests/ci/test_install_claude_cli.py
    action: Create
    purpose: >-
      Decision 162 R2: every node runs the installer under the literal composite argv
      (bash --noprofile --norc -e -o pipefail <script> <root>) with PATH limited to a stub directory plus /usr/bin and
      /bin, whose stub sudo and npm record their argv: missing pin file -> exit 2, no npm call; "latest" -> exit 2, no
      npm call; valid pin, no claude -> npm called with exactly "@anthropic-ai/claude-code@<pin>" and the --omit flags;
      claude already present -> exit 0, no npm call; post-install `claude --version` not containing the pin -> exit 1.
  - file: tests/ci/test_review_sh_cli_pin.py
    action: Create
    purpose: >-
      Decision 162 R2 for review.sh's starve branch, in its own file because tests/test_subagent_review_wiring.py is at
      470 of 500 SLOC: runs review.sh under the literal composite argv with a minimal env (WORKSPACE_ROOT pointing at a
      tmp root holding the real installer and a missing or malformed pin, CLAUDE_CODE_OAUTH_TOKEN set, GITHUB_OUTPUT a
      tmp file, stub sudo and npm on a limited PATH) and asserts outcome=starved, exit 1 and no npm call. Its own
      minimal harness (no import from another test module).
  - file: tests/fixtures/claude_cli_envelopes/2.1.323/success.stdout.json
    action: Create
    purpose: >-
      Golden: the real stdout of the pinned CLI for the probe prompt, captured by the build with
      `bin/venv-python -m scripts.ci.claude_p_seam_contract --capture tests/fixtures/claude_cli_envelopes/2.1.323` after
      `npm install --prefix <scratch> @anthropic-ai/claude-code@2.1.323` with <scratch>/node_modules/.bin first on PATH.
      Only the capture-mode scrub (ids, paths, account-like fields) changes it; no hand edits.
  - file: tests/fixtures/claude_cli_envelopes/2.1.323/success.stderr.txt
    action: Create
    purpose: Golden stderr from the same capture (the untrusted-workspace warning if the CLI prints it, else empty).
  - file: tests/fixtures/claude_cli_envelopes/2.1.323/version.txt
    action: Create
    purpose: The captured CLI's `claude --version` output, so a golden copied forward under a new version name fails.
  - file: tests/test_claude_cli_model_pin.py
    action: Modify
    purpose: >-
      PIN is read from config/claude-cli-version. The assertions move with the install line, never weakened
      (Decision 235): the only "@anthropic-ai/claude-code@" install line under .github/, scripts/ and tests/ is the installer's, and it is
      sudo-prefixed with the --omit flags and behind the `command -v claude` guard; no file under .github/, scripts/ or
      tests/ (outside the fixture directory names and version.txt) holds a literal x.y.z claude-code version; every job
      that reaches the installer (ci-rca.yml rca and the subagent-plan-review users) runs on
      ubuntu-latest; ci-rca.yml's install step comes before "Checkout at failing commit". The model/effort node is
      unchanged.
bundled_recommendations: [rec-5509]
followon_recs: [rec-5520]
infrastructure_dependencies: []
acceptance_criteria:
  - config/claude-cli-version is the only place a claude CLI version is written for CI, and scripts/ci/install_claude_cli.sh is the only install line; ci-rca.yml and review.sh call it.
  - A missing or malformed pin fails closed in the installer and in review.sh, with no npm call.
  - On a PR, the probe passes against golden envelopes from the pinned CLI through the real wrapper and FILED parser, and fails on the #2311 shape.
  - A pin bump without a matching golden directory (version.txt included) fails --pre, and the sanctioned way to make goldens is a live --capture PASS against the real CLI at the new pin, in an operator-owned session before merge (hand-written goldens are barred by constraint; rec-5520's canary is the mechanical backstop).
  - --pre selects the probe test whenever any seam input changes, checked by a node that derives the inputs; the new tests add about 5 s, only on PRs touching the seam.
  - After merge, an operator-fired ci-rca.yml run and the first natural subagent-plan-review run (apply-sandbox push or operator reconcile) install the pinned CLI through the installer and succeed.
  - rec-5509 closes on the build's merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Golden replay through the real wrapper and parser passes (red before: file absent)."
    command: bin/venv-python -m pytest "tests/ci/test_claude_p_seam_contract.py::test_golden_envelope_passes_real_wrapper_and_parser" -q
    expected: exit 0, 1 passed
    fix_if: the probe fails on a real envelope (read its FAIL line; a capture defect is recaptured, never hand-edited)
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: claude-cli-seam-golden-replay
  - step: 2
    phase: pre-deploy
    action: "The #2311 shape (stderr inside the envelope file) fails the probe (red before: file absent)."
    command: bin/venv-python -m pytest "tests/ci/test_claude_p_seam_contract.py::test_stderr_in_envelope_fails_the_probe" -q
    expected: exit 0, 1 passed
    fix_if: the probe passes a corrupted envelope
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: claude-cli-seam-detects-2311-shape
  - step: 3
    phase: pre-deploy
    action: "The golden directory matches the pin (red before: file absent)."
    command: bin/venv-python -m pytest "tests/ci/test_claude_p_seam_contract.py::test_golden_matches_pin" -q
    expected: exit 0, 1 passed
    fix_if: a missing or extra version directory, or version.txt not naming the pin
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: claude-cli-seam-golden-pin
  - step: 4
    phase: pre-deploy
    action: "--pre selects the probe for every seam input (red before: file absent)."
    command: bin/venv-python -m pytest "tests/ci/test_claude_p_seam_contract.py::test_fast_tier_selects_the_probe_for_every_seam_input" -q
    expected: exit 0, 1 passed
    fix_if: a seam input does not select the test (make the test name that input's basename so the data-edge channel sees it; never shrink the derived set)
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: claude-cli-seam-fast-tier-selected
  - step: 5
    phase: pre-deploy
    action: "A bad pin fails closed in the installer and in review.sh, under the literal composite argv (red before: files absent)."
    command: bin/venv-python -m pytest tests/ci/test_install_claude_cli.py tests/ci/test_review_sh_cli_pin.py -q
    expected: exit 0, no failures
    fix_if: npm is called for a missing or malformed pin, or review.sh does not write outcome=starved
    hermetic: true
    graduation: graduate
    graduation_check_id: claude-cli-installer-fails-closed
  - step: 6
    phase: pre-deploy
    action: "No literal CLI version outside the pin file; one install line (red before: the assertion fails on the three literals)."
    command: bin/venv-python -m pytest "tests/test_claude_cli_model_pin.py::test_every_install_pins_the_current_version" -q
    expected: exit 0, 1 passed
    fix_if: a literal version remains, or an install line outside the installer
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: The node lives in a file the fast tier selects whenever these surfaces change; VP 3 and VP 5 graduate the pin binding and the fail-closed installer.
  - step: 7
    phase: pre-deploy
    action: Whole-file runs of every test that drives the wrapper, parser, pin, installer or the workflow guards the changed install sites meet.
    command: >-
      bin/venv-python -m pytest tests/ci/test_claude_p_seam_contract.py tests/ci/test_install_claude_cli.py
      tests/ci/test_review_sh_cli_pin.py tests/test_claude_cli_model_pin.py tests/test_ci_claude_p_retry.py
      tests/ci_rca/test_filing_stderr_preamble.py tests/test_ci_rca_filing.py tests/test_subagent_review_wiring.py
      tests/checks/ci_guards/test_validate_claude_p_retry_wrapper.py tests/checks/ci_guards/test_validate_workflow_agent_safety.py
      tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py tests/checks/ci_guards/test_validate_persona_trigger_policy.py -q
    expected: exit 0, no failures
    fix_if: an existing case fails (fix the code, never loosen an assertion, Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file regression run; VP 1-5 graduate the new guards.
  - step: 8
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): bin/venv-python -m scripts.validate --pre in the
      foreground (exit 0), then this command backgrounded with a 2 h limit from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: "--pre exited 0 first; this command exits 0 for HEAD"
    fix_if: a failure in this plan's files is fixed at root and the full tier rerun
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: >-
      Live seam check at the pin, before merge (the same act a future pin bump performs): with
      @anthropic-ai/claude-code@<pin> npm-installed into a scratch prefix and first on PATH, run the probe in default
      mode against the real CLI. The goldens in scope come from this CLI's --capture run.
    command: >-
      d="$(mktemp -d)" && npm install --silent --prefix "$d" "@anthropic-ai/claude-code@$(cat config/claude-cli-version)"
      && PATH="$d/node_modules/.bin:$PATH" bin/venv-python -m scripts.ci.claude_p_seam_contract
    expected: one PASS line, exit 0
    fix_if: >-
      FAIL with "envelope ok, marker missing (model reply)" is a model wording slip: re-run once; any other FAIL names a
      broken seam contract and blocks the build (report to the planner; no retry loop, Decision 55)
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      Live proof of the ci-rca.yml install site (a CI RCA runtime change is proven by a real run): the operator fires
      one workflow_dispatch of ci-rca.yml on main himself (Decision 205 cl.1: an agent-fired dispatch does not
      qualify) against a real failed run id he names, and the build reads that run and saves the rca job log to
      $RCA_LOG.
    command: >-
      grep -q "$(cat config/claude-cli-version)" "$RCA_LOG" && grep -q 'install_claude_cli.sh' "$RCA_LOG" && echo RCA_INSTALL_OK
    expected: RCA_INSTALL_OK, and the rca job's install step concluded success (read via mcp__github__actions_get)
    fix_if: the install step fails (read the installer's stderr line; a pin or installer defect is a rec naming the run id, routed to this planner)
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      Live proof of the review.sh install site without a dispatch made for it: the build reads the first
      terraform-apply-sandbox.yml push run on main after the merge whose 'Subagent plan review' step executed (the
      subagent-plan-review user; no pull_request job holds the token, Decision 205 cl.2), or the first reconcile.yml
      run the operator dispatches for his own reason, whichever comes first, and saves the review step's log to
      $REVIEW_LOG. If neither runs within 7 days of the merge, the build files a follow-on rec naming this pending
      proof and stops waiting.
    command: >-
      grep -q "$(cat config/claude-cli-version)" "$REVIEW_LOG" && ! grep -q 'outcome=starved' "$REVIEW_LOG" && echo REVIEW_INSTALL_OK
    expected: REVIEW_INSTALL_OK, or after 7 days with no such run, the follow-on rec id read back open
    fix_if: the review step starves on the installer (a pin or installer defect is a rec naming the run id, routed to this planner)
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: Confirm rec-5509 closed after the squash merge (Resolves trailer).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      r=make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5509')[0]; print(r['status']); assert r['status']=='closed'"
    expected: rec-5509 status closed
    fix_if: still open after ci.yml's closure job ran; close it with update_rec citing the merge SHA
    hermetic: false
test_obligations:
  - source: config/claude-cli-version
    behavior: The pin names a version whose golden envelopes exist.
    verification_step: 3
    test_selector: tests/ci/test_claude_p_seam_contract.py::test_golden_matches_pin
    red_green_expectation: red before (no pin file, no goldens), green after.
  - source: scripts/ci/install_claude_cli.sh
    behavior: A missing or malformed pin exits 2 with no npm call; a valid pin installs exactly that version.
    verification_step: 5
    test_selector: tests/ci/test_install_claude_cli.py
    red_green_expectation: red before (installer and tests absent), green after.
  - source: scripts/ci/claude_p_seam_contract.py
    behavior: The probe passes a real pinned-CLI envelope through the wrapper and parser and fails the #2311 shape.
    verification_step: 2
    test_selector: tests/ci/test_claude_p_seam_contract.py::test_stderr_in_envelope_fails_the_probe
    red_green_expectation: red before (module and node absent), green after.
  - source: .github/workflows/ci-rca.yml
    behavior: The rca job installs through the installer, before the failing-commit checkout, with no literal version.
    verification_step: 6
    test_selector: tests/test_claude_cli_model_pin.py::test_every_install_pins_the_current_version
    red_green_expectation: red before (ci-rca.yml holds the literal 2.1.323), green after.
  - source: .github/actions/subagent-plan-review/review.sh
    behavior: A missing or malformed pin file fails closed (outcome=starved) before any install, under the literal composite argv.
    verification_step: 5
    test_selector: tests/ci/test_review_sh_cli_pin.py
    red_green_expectation: red before (review.sh installs its literal and never reads the file), green after.
  - source: config/composite_action_body_baseline.yaml
    behavior: The rca install step's row matches its re-measured body.
    verification_step: 7
    test_selector: tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py
    waiver_reason: Data rows only; validate_composite_action_shell_bodies enforces them in --pre (VP 8) and its own tests cover the rule.
constraints:
  - "No GitHub job gains a secret or a new LLM call: the PR lane replays goldens only (Decision 205 cl.2), and the live call runs in the implementing session at capture time and in VP 9."
  - "No new workflow and no ci_rca_taxonomy.yaml row (operator 2026-11-23 12:33Z: push to main has no watcher; --pre does)."
  - Golden files are captured, never hand-written; only the capture-mode scrub changes them.
  - Every existing assertion stays or moves with the code it guards (Decision 235). No rescue agents or workaround loops (Decision 55).
