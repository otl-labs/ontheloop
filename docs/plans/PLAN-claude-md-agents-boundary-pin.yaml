acceptance_criteria:
  - "Every tracked CLAUDE.md and every tracked file under .claude/agents/ matches a boundary_patterns entry by substring."
  - "Removing the CLAUDE.md entry or the .claude/agents/ entry from the list makes the new node fail (leg 2 proves it on a copy)."
  - "compute_automatable derives False for scripts/CLAUDE.md and .claude/agents/scheduled/ci-rca.md and True for an unrelated control path."
  - "config/agent/executor/capabilities.yaml is byte-identical to main."
  - "rec-5620 is closed by the merge's Resolves trailer, its acceptance node passing."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The new node passes, including its discrimination legs.
    command: >-
      bin/venv-python -m pytest
      tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py::test_claude_md_and_agent_definitions_are_boundary_paths
      -q
    expected: exit 0 with 1 passed; on main the node does not exist
    fix_if: a leg fails; read which path is uncovered or which removal stayed green
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: The graduated shard instruction-surface-boundary already runs every node in this file (file-level node_id), so a second shard would duplicate it.
  - step: 2
    phase: pre-deploy
    action: The rest of the file still passes and capabilities.yaml is unchanged.
    command: >-
      bin/venv-python -m pytest tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py -q &&
      git diff --exit-code origin/main -- config/agent/executor/capabilities.yaml
    expected: exit 0, 5 passed, and an empty diff
    fix_if: an existing node fails, or capabilities.yaml differs from main
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads origin/main, so it is not hermetic; the file-level shard already guards the nodes.
  - step: 3
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 4
    phase: post-deploy
    action: rec-5620 is closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5620']); print([(r['id'], r['status']) for r in rows])"
    expected: rec-5620 closed, after the closure job runs on the merge commit
    fix_if: rec-5620 still open; read the closure job log for the refusal marker and fix its cause, never a direct status write
    hermetic: false
