  Pin the per-directory CLAUDE.md files and the .claude/agents/ definitions as Decision 117 boundary paths (rec-5620).
  Both entries have been in boundary_patterns since 4bd5850d, so they are already classified correctly; what is missing
  is a test that fails if a later PR drops either entry. Test-only: capabilities.yaml is not edited.
