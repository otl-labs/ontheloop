  exit criterion is closed.
closes_criteria: []
cites: [dec:117]
scope:
  - file: tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py
    action: Modify
    purpose: >-
      Add one node, test_claude_md_and_agent_definitions_are_boundary_paths (rec-5620's acceptance node), using the
      file's existing _patterns, _tracked and _covered helpers (the consumers' substring rule). Leg 1: every git-tracked
      file whose basename is CLAUDE.md (git ls-files with the pathspec "*CLAUDE.md", filtered to basename CLAUDE.md) and
      every git-tracked file under .claude/agents/ is covered; floors: the root CLAUDE.md and at least one nested
      CLAUDE.md are in the set, and the .claude/agents/ set is non-empty. Leg 2 (discrimination): with the CLAUDE.md
      entry removed from a copy of the list, some nested CLAUDE.md is uncovered, and with the .claude/agents/ entry
      removed, some .claude/agents/ file is uncovered, so the node goes red if either entry is dropped and is not held
      green by another entry. Leg 3: with risk_scoring._compute_risk_score monkeypatched to 0.0 and
      risk_scoring._capabilities_cache monkeypatched to None, compute_automatable returns False for scripts/CLAUDE.md
      and .claude/agents/scheduled/ci-rca.md and True for scripts/unrelated_helper.py. No other node changes.
    new_imports: []
bundled_recommendations: [rec-5620]
followon_recs: []
