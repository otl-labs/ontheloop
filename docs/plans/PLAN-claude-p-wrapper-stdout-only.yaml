schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: claude-p-wrapper-stdout-only
intent: >-
  Fix CI RCA's filing check at the root (rec-5492): scripts/ci/claude_p_retry.sh writes only claude's stdout into the
  output file and keeps stderr apart, so a CLI stderr line (such as CLI 2.1.323's untrusted-workspace warning) can
  never again corrupt the JSON envelope that scripts/ci_rca/filing.py and scripts/ci/review_verdict.py parse, and CI
  RCA's mark-RCA'd and PR-comment steps run whenever the agent files.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-claude-p-wrapper-stdout-only.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category: rec-5492, High, a regression from #2311; no tier_item claimed, so the
  Tier Item Freshness Gate is skipped; closes no criterion). Only CI scripts and tests change; nothing is deployed, so
  V2.
cites: [dec:55, dec:72, dec:74, dec:201]
scope:
  - file: scripts/ci/claude_p_retry.sh
    action: Modify
    purpose: >-
      Each attempt runs claude -p with stdout to "$OUTPUT_FILE" and stderr to a new STDERR_FILE="${OUTPUT_FILE}.stderr"
      (both truncated per attempt) instead of "> $OUTPUT_FILE 2>&1". After each attempt the wrapper copies STDERR_FILE to
      its own stderr (cat >&2, failure ignored), before the exit 0 path, so the job log still shows every CLI
      diagnostic. The combined read for _is_transient is guarded (OUTPUT_CONTENT="$(cat "$OUTPUT_FILE" "$STDERR_FILE"
      2>/dev/null || true)") so a missing file never aborts under set -euo pipefail; a failed stderr redirection makes
      bash skip claude with exit 1, which stays non-transient (no retry), as an unwritable output file does today. _is_transient reads
      stdout and stderr content together (the same bytes the merged file held), so retry behaviour is unchanged
      (Decision 55, 73, 92 parity with _TRANSIENT_CLAUDE_SIGNATURES). Header comment states the new output contract:
      the output file holds stdout only. Session-id, manifest and exit-code behaviour are unchanged.
  - file: scripts/ci_rca/filing.py
    action: Modify
    purpose: >-
      Parsing is unchanged: a file that is not one JSON envelope still falls back to a raw-text scan and still yields no
      marker from inside an escaped JSON string (no tolerant envelope search is added). New: main() (both the single and
      --all modes; never the library functions, which stay side-effect free) prints one stderr line "ci_rca.filing:
      <path> is not a single claude -p JSON envelope (<JSONDecodeError msg>); scanning raw text" only when a line of
      the file text starts with "{" and json.loads fails, i.e. an envelope was evidently meant but is corrupted. A plain-text transcript
      (no line starting with "{", e.g. "FILED: rec-42") stays silent on stderr, so test_cli_exits_0_and_prints_id's stderr == "" holds.
      Return values and stdout output are unchanged. The docstring line claiming stderr-polluted output "is still
      searchable" is corrected.
  - file: tests/test_ci_claude_p_retry.py
    action: Modify
    purpose: >-
      Two stub behaviours added to _STUB_CLAUDE (existing ones unchanged): stderr_warning_json (prints the exact CLI
      2.1.323 warning line to stderr and a result envelope to stdout, exit 0) and stderr_transient_then_proceed (attempt
      1 prints "API Error: 500 Internal server error" to stderr only and exits 1; attempt 2 prints PROCEED, exit 0). New
      node test_stderr_never_enters_output_file: the output file json.loads cleanly and holds no warning text; the
      .stderr file and the wrapper's stderr both hold the warning. New node
      test_transient_signature_on_stderr_still_retries: exactly 2 attempts, exit 0.
  - file: tests/ci_rca/test_filing_stderr_preamble.py
    action: Create
    purpose: >-
      rec-5492's acceptance. Node test_ci_rca_filing_finds_marker_behind_cli_stderr_warning runs the real wrapper with a
      stub claude that replays the real CLI 2.1.323 output of job 136971171676: the warning line verbatim on stderr, and
      on stdout a one-line envelope with that run's full top-level key set (all 26 keys, duration_api_ms through
      result_index, in the run's order) whose result keeps the run's real final lines ending "FILED: rec-5491
      environment" (long values trimmed, nested objects emptied), then runs [sys.executable, "-m", "scripts.ci_rca.filing"] with --all and the single
      form on the output file (as TestCLI._run does), asserting "rec-5491,environment" and "rec-5491".
  - file: tests/test_ci_rca_filing.py
    action: Modify
    purpose: >-
      New class TestMainInProcess (adds import pytest) calls scripts.ci_rca.filing.main() in-process with
      monkeypatch.setattr(sys, "argv", [...]) and capsys, pytest.raises(SystemExit) on exit paths, because the existing
      TestCLI subprocess nodes are not traced by the full tier's per-file coverage gate (validate_test_coverage: filing.py
      maps to this file, no coverage_baseline entry, threshold 100%; today 72.4%, missing main() and _extract_text's
      empty-result fallback). Nodes: test_usage_error (exit 1, Usage on stderr); test_all_prints_pairs;
      test_single_prints_id (plain "FILED: rec-42" prints rec-42 and nothing on stderr); test_single_no_marker_exits_1;
      test_non_envelope_output_names_the_cause_on_stderr (a non-JSON line before an envelope: no pairs on stdout and the
      "is not a single claude -p JSON envelope" line on stderr; a clean envelope prints nothing on stderr);
      test_missing_file_is_silent (--all mode on an absent file: no output and nothing on stderr); test_non_string_result_falls_back_to_raw (envelope with empty result yields no
      pairs). Together they bring filing.py to 100% line coverage. Existing nodes unchanged.
bundled_recommendations: [rec-5492]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - claude_p_retry.sh's output file holds claude's stdout only; a stderr line is kept in <output_file>.stderr and shown on the wrapper's stderr.
  - A transient signature printed only on stderr still triggers the bounded retry; a substantive verdict still runs once.
  - With CLI 2.1.323's warning on stderr, scripts.ci_rca.filing --all finds "rec-5491,environment" in the wrapper's output file.
  - filing.py's CLI names an output file on stderr when a line of it starts with "{" but it is not one JSON envelope; a clean envelope or a plain-text transcript prints nothing on stderr; parse results are unchanged.
  - Every existing test of the wrapper, the plan reviewer wiring, review_verdict and filing stays green unchanged.
  - rec-5492 closes on the build's merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Wrapper keeps stderr out of the output file (red before: the node does not exist; with it but the old wrapper, the output file starts with the warning and json.loads fails)."
    command: bin/venv-python -m pytest "tests/test_ci_claude_p_retry.py::test_stderr_never_enters_output_file" -q
    expected: exit 0, 1 passed
    fix_if: the output file holds the warning, or the .stderr file or wrapper stderr lacks it
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: claude-p-retry-stdout-only-output
  - step: 2
    phase: pre-deploy
    action: "A stderr-only transient error still retries (red before: node absent)."
    command: bin/venv-python -m pytest "tests/test_ci_claude_p_retry.py::test_transient_signature_on_stderr_still_retries" -q
    expected: exit 0, 1 passed
    fix_if: one attempt only (transient check no longer sees stderr) or three attempts
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: claude-p-retry-stderr-transient-retry
  - step: 3
    phase: pre-deploy
    action: "rec-5492's acceptance end to end through the real wrapper and filing CLI (red before: file absent; with it but the old wrapper, --all prints nothing)."
    command: bin/venv-python -m pytest "tests/ci_rca/test_filing_stderr_preamble.py::test_ci_rca_filing_finds_marker_behind_cli_stderr_warning" -q
    expected: exit 0, 1 passed
    fix_if: filing prints no pair or a different pair
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: ci-rca-filing-behind-cli-stderr
  - step: 4
    phase: pre-deploy
    action: "filing.py's CLI names a corrupted envelope file on stderr and stays silent for a clean envelope and a plain-text marker file (red before: node absent)."
    command: bin/venv-python -m pytest "tests/test_ci_rca_filing.py::TestMainInProcess::test_non_envelope_output_names_the_cause_on_stderr" -q
    expected: exit 0, 1 passed
    fix_if: no stderr line for the corrupted file, a stderr line for the clean or plain-text file, or pairs now found in the corrupted file (no tolerant parsing is in scope)
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: Diagnostic wording, not a correctness guard; the parse result it also checks is already pinned by the existing filing nodes and by VP 3's graduated end-to-end node.
  - step: 5
    phase: pre-deploy
    action: >-
      Whole-file re-runs of every test file that drives the wrapper or parses its output, existing cases unchanged; then
      the full tier's per-file coverage gate for filing.py, run directly so a gap shows before VP 6.
    command: >-
      bin/venv-python -m pytest tests/test_ci_claude_p_retry.py tests/test_subagent_review_wiring.py tests/test_review_verdict.py tests/test_ci_rca_filing.py tests/ci_rca/test_filing_stderr_preamble.py -q
      && bin/venv-python -c "from scripts.test_coverage_checker import check_per_file_coverage, ROOT; r=check_per_file_coverage([ROOT/'scripts/ci_rca/filing.py']); print(r); assert r == []"
    expected: pytest exit 0 with no failures, then the coverage check prints an empty list and exits 0
    fix_if: an existing case fails (fix the code, never loosen an assertion, Decision 235), or filing.py is below 100% (add an in-process TestMainInProcess node for the missing lines)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file re-run of files this plan modifies or that already run in the --pre affected set; VP 1-3 graduate the new guards.
  - step: 6
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): bin/venv-python -m scripts.validate --pre in the
      foreground (exit 0), then this command as its own backgrounded run with a 2 h limit from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: "--pre exited 0 first; this command exits 0 for HEAD"
    fix_if: a failure in this plan's files is fixed at root and the full tier rerun; a failure only in another project's open red goes to the operator as the implement skill's go/no-go
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Confirm rec-5492 closed after the squash merge (Resolves trailer).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      r=make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5492')[0]; print(r['status']); assert r['status']=='closed'"
    expected: rec-5492 status closed
    fix_if: still open after ci.yml's closure job ran; close it with update_rec citing the merge SHA
    hermetic: false
  - step: 8
    phase: post-deploy
    action: >-
      Live proof on main. The operator fires the dispatch himself from the Actions page (Decision 205 cl.1: a
      workflow_dispatch qualifies only when a maintainer's own identity issues it, so the build never fires it):
      ci-rca.yml on main, run_id 44945189064 (the telemetry-arrival red the failed run diagnosed), force_rca true. When
      rec-5494's build has also merged, this one run proves both fixes. The build then reads the run: it must conclude
      success with the Run ci-rca agent and Mark failure as RCA'd steps both success, which also posts the
      ci-rca/telemetry-arrival/<category> status on 3ba93b00 that run 44945298668 skipped. The rec it files duplicates
      rec-5491; the build marks it superseded by rec-5491 with update_rec and reads it back.
    command: >-
      echo 'READ VIA MCP after the operator dispatch: mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs",
      repo="ontheloop", resource_id="ci-rca.yml") for the workflow_dispatch run, then mcp__github__actions_get(method="list_workflow_jobs")
      for its step conclusions'
    expected: run conclusion success; job rca steps "Run ci-rca agent" and "Mark failure as RCA'd" each conclusion success; the duplicate rec reads back status superseded
    fix_if: >-
      the run fails at the filing check (read the log via mcp__github__get_job_logs; a stderr line in the output file
      means the fix did not take; report to the planner) or fails elsewhere (file a rec naming the run id; this plan's
      fix is proven only if the filing check passed)
    hermetic: false
