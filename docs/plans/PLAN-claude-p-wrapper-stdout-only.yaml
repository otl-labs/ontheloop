    behavior: The output file holds claude's stdout only; stderr is kept apart and shown.
    verification_step: 1
    test_selector: tests/test_ci_claude_p_retry.py::test_stderr_never_enters_output_file
    red_green_expectation: red before (node absent; with the node but the old wrapper, json.loads of the output file fails on the warning line), green after.
  - source: scripts/ci/claude_p_retry.sh
    behavior: A transient signature printed only on stderr still triggers the bounded retry.
    verification_step: 2
    test_selector: tests/test_ci_claude_p_retry.py::test_transient_signature_on_stderr_still_retries
    red_green_expectation: red before (node absent), green after (exactly 2 attempts, exit 0). It would also pass on the old merged wrapper; it is a parity guard against a split that drops stderr from _is_transient.
  - source: scripts/ci_rca/filing.py
    behavior: The CLI names a corrupted envelope file (a line starts with "{" but json.loads fails) on stderr, stays silent otherwise; parse results are unchanged.
    verification_step: 4
    test_selector: tests/test_ci_rca_filing.py::TestMainInProcess::test_non_envelope_output_names_the_cause_on_stderr
    red_green_expectation: red before (node absent; with the node but old filing.py, stderr has no diagnostic line), green after.
