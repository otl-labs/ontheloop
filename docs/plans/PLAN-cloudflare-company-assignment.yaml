  reader verbs, scripts.ops_data_portal writes (rec-4541 closure, rec-3148 refinement) and the closing PR. One operator
  word per console step (C1, C2, C4a, C4b, C5, C6, C7, R1a, R1b, R1c), typed in the build thread; C0 is a read.
- >-
  Order is fixed: VP 1, 2, C0, C1 and P1, C2, C4a, C4b, C5, C6, C7, R1a, R1b, R1c, VP 11, 12, closing PR. The personal
  card and login leave only after the company login, billing and registrant changes are proven (successor first, as
  Decision 218 cl.3); C7 precedes R1 so the personal login is still a fallback during the only DNS edit.
- >-
  No DNS record changes except C7's six TXT additions; the MX record, nameservers and DNSSEC setting stay as they are.
  An MX or nameserver difference at any step is a stop and a restore from the VP 2 baseline.
- >-
  Approved texts are verbatim; allowed variance: {{DATE}} only. Any other wording change, including one critique or
  code review asks for, goes to the plan owner and the operator before merge (Decision 246 cl.2).
- >-
  No Cloudflare account or zone id, e-mail address, phone, postal address, card or invoice detail, or screenshot enters
  the repository, a PR, memory, the coordinator log or the shared folder (Decision 101, the inventory's
  publication_rule). Screenshots are cropped by the operator and checked in the thread; EVIDENCE.md records kind and
  UTC time only.
- >-
  The closing PR is never reverted by deleting ledger entries (the validator's append-only invariant): a correction is
  a forward ledger entry under its own approved wording.
- >-
  Size: the inventory is 275 of 500 effective lines and 41,098 of 49,152 bytes on main add02122; the four blocks add
  about 2.4 kB. Seven other unbuilt plans scope the same file (plan_obligations); whichever builds second rebases, and
  the ledger block re-anchors to the then-last entry (VP 13); any other sidecar anchor that no longer matches exactly
  once is a STOP to the plan owner (an anchor-only re-anchor keeps the approved-words digest).
- >-
  A failed or drifted step halts this workstream until root-caused; never a silent retry; no rescue agents or
  workaround loops (Decision 55). Never skip or loosen a test or check to get green (Decision 235).
