schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: cloudflare-company-assignment
intent: >-
  Assign the Cloudflare account that is registrar and authoritative DNS for the company's domains to On The Loop Labs
  Limited in place (operator ruling 2026-11-19), with no domain or zone moved: the company's Google Workspace identity
  joins as a Super Administrator, the company's billing details and card replace the founder's, the company becomes
  the registrant of onthelooplabs.com and otl-labs.com, theseus.support (retired brand, Decision 198) is left to lapse
  at its 2027-06-27 expiry, and otl-labs.com gains SPF and DMARC (rec-4541; DKIM and DMARC enforcement follow in
  rec-5429). The founder's personal card and login
  leave only after the company login, billing and registrant changes are proven. Every Cloudflare change is an
  operator console step; the repository change is the inventory flips of DNS-01..DNS-04 and BILL-05, bound to
  operator-approved wording. Serves NS.2: the company owns every account On The Loop depends on.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-cloudflare-company-assignment.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn exception category) -- the everything_else stage of the company ownership move
  (Decision 195). No tier_item criterion claimed.
cites: [dec:101, dec:195, dec:198, dec:201, dec:246, dec:275]
closes_criteria: []
scope:
- file: docs/contracts/account-credential-inventory.yaml
  action: Modify
  purpose: >-
    Closing PR only, after VP 3-12 pass: place the four blocks of docs/plans/approved/cloudflare-company-assignment.yaml
    word for word (the DNS-01..DNS-04 rows, the BILL-05 row, five evidence_ledger entries after the last entry, one
    terse amendment_log row at the top of the log), with {{DATE}} filled. No other line changes.
bundled_recommendations: [rec-5424]
followon_recs: [rec-5425, rec-5429]
infrastructure_dependencies:
- >-
  None. No Terraform root, workflow or Lambda-packaged file is in scope (compute_affected_artifacts over the scope
  returns {}). Cloudflare is not managed in IaC and this plan does not bring it there: the account stays operator
  console only, and C7's TXT records join the existing MX as undeclared operator state (an observation; Decision 126
  governs terraform/** and the AWS admin tier, not Cloudflare). Nothing in the repository or CI consumes a Cloudflare
  credential (grep of the tree, 2026-11-19).
acceptance_criteria:
- >-
  The company's Google Workspace identity is a Super Administrator of the account, signed in with Google or through
  VP 4's fallback, and the founder's personal login has left the account; its Cloudflare user is deleted, or kept
  only on the operator's recorded word (VP 4, 10).
- >-
  The billing profile carries the company's details, invoices go to the billing alias, and the company card is the
  only payment method; BILL-05 is moved, proven on the card's first charge in 2027 (rec-5425) (VP 5, 10).
- >-
  The company is the registrant organisation of onthelooplabs.com and otl-labs.com, both changes applied, with no
  hold status and unchanged nameservers and MX (VP 6, 7, 11).
- theseus.support has auto-renew off and nothing uses it; it still runs to its 2027-06-27 expiry (VP 3, 8, 11).
- >-
  otl-labs.com publishes SPF and a p=none DMARC record with its Google MX unchanged, onthelooplabs.com and
  theseus.support publish send-nothing SPF and p=reject DMARC, rec-4541 is closed, and rec-5429 owns DKIM and DMARC
  enforcement (VP 9, 16).
- >-
  The closing PR places exactly the approved wording and the inventory validator passes; rec-5424 closes through the
  merge's Resolves trailer; rec-3148's title, context and acceptance no longer depend on theseus.support (VP 12-16).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Start gate: this plan and its sidecar are on main, the five rows are still personal on main, rec-5424 is open, and
    Decision 226's red-main overlap check is clear for this plan.
  command: >-
    git fetch -q origin main && git cat-file -e origin/main:docs/plans/PLAN-cloudflare-company-assignment.yaml &&
    git cat-file -e origin/main:docs/plans/approved/cloudflare-company-assignment.yaml &&
    git show origin/main:docs/contracts/account-credential-inventory.yaml | bin/venv-python -c "import sys,yaml;
    d=yaml.safe_load(sys.stdin); r={x['id']:x['status'] for x in d['rows']+d['billing']};
    bad=[k for k in ('DNS-01','DNS-02','DNS-03','DNS-04','BILL-05') if r[k]!='personal']; assert not bad, bad;
    print('START_GATE_OK')" && bin/venv-python -c "from src.common import ducklake_reader_client as rc;
    rows,_=rc.fetch_recs_by_ids(rc.make_reader(), ['rec-5424']); assert rows[0]['status']=='open'; print('REC_OPEN')" &&
    bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-cloudflare-company-assignment.yaml
  expected: Prints START_GATE_OK and REC_OPEN, then a JSON line whose verdict is clear (exit 0).
  fix_if: >-
    A row already moved: another thread acted; stop and ask the coordinator. A blocked or unavailable overlap verdict:
    hold and tell the coordinator (Decision 226).
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    Baseline, written once before any console step: build-state.json in the project folder gets t0 and the public
    registration and DNS facts of the three domains (registrar RDAP status, last-changed event, expiry and nameservers;
    the .com registry expiry and registrar id; otl-labs.com MX, TXT and DMARC; onthelooplabs.com TXT and DMARC), and
    EVIDENCE.md gets its header. A re-run keeps the existing baseline.
  command: |-
    bin/venv-python - <<'PY'
    import datetime as dt, json, os, time, urllib.request, urllib.error
    F = '/mnt/project-files/cloudflare-company-assignment/'; S, E = F + 'build-state.json', F + 'EVIDENCE.md'
    if os.path.exists(S):
        print('BASELINE_KEPT', json.load(open(S))['t0']); raise SystemExit(0)
    def get(u):
        for i in range(2):
            try:
                q = urllib.request.Request(u, headers={'Accept': 'application/rdap+json, application/json', 'User-Agent': 'rdap-probe/1.0'})
                with urllib.request.urlopen(q, timeout=30) as f: return json.loads(f.read())
            except urllib.error.HTTPError as e:
                if e.code != 429 or i: raise
                time.sleep(30)
    ev = lambda d, a: next((e['eventDate'] for e in d.get('events', []) if e['eventAction'] == a), None)
    dns = lambda n, t: sorted(a['data'] for a in get(f'https://dns.google/resolve?name={n}&type={t}').get('Answer', []) if a.get('type') == {'MX': 15, 'TXT': 16, 'NS': 2}[t])
    s = {'t0': dt.datetime.now(dt.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'domains': {}}
    for d in ('onthelooplabs.com', 'otl-labs.com', 'theseus.support'):
        c = get('https://rdap.cloudflare.com/rdap/v1/domain/' + d.upper())
        s['domains'][d] = {'status': sorted(c.get('status', [])), 'changed': ev(c, 'last changed'), 'expiry': ev(c, 'expiration')[:10], 'ns': dns(d, 'NS')}
        if d.endswith('.com'):
            g = get('https://rdap.verisign.com/com/v1/domain/' + d)
            iana = [p['identifier'] for e in g.get('entities', []) if 'registrar' in e.get('roles', []) for p in e.get('publicIds', [])]
            s['domains'][d].update(registry_expiry=ev(g, 'expiration')[:10], registrar_iana=iana)
    for n in ('otl-labs.com', 'onthelooplabs.com'):
        s[n] = {'mx': dns(n, 'MX'), 'txt': dns(n, 'TXT'), 'dmarc': dns('_dmarc.' + n, 'TXT')}
    x = s['domains']
    assert all(v['registrar_iana'] == ['1910'] for k, v in x.items() if k.endswith('.com')), 'registrar is not Cloudflare'
    assert [x[d]['expiry'] for d in ('onthelooplabs.com', 'otl-labs.com', 'theseus.support')] == ['2027-09-17', '2027-09-17', '2027-06-27'], 'expiry moved'
    assert not any('hold' in st for v in x.values() for st in v['status']), 'a hold status is present'
    assert s['otl-labs.com']['mx'] == ['1 smtp.google.com.'], s['otl-labs.com']['mx']
    json.dump(s, open(S, 'w'), indent=1)
    if not os.path.exists(E):
        open(E, 'w', encoding='utf-8').write('# Cloudflare hand-over evidence (kinds and UTC times only)\n\n| step | what | UTC time | evidence kind | result |\n|---|---|---|---|---|\n')
    print('BASELINE', s['t0'], {k: (v['expiry'], v['changed']) for k, v in x.items()})
    PY
  expected: >-
    Prints BASELINE with t0 and each domain's expiry and last-changed time, or BASELINE_KEPT on a re-run. Probed
    2026-11-19: expiries 2027-09-17, 2027-09-17 and 2027-06-27, registrar IANA id 1910, no hold, otl-labs.com MX the
    single Google record, no SPF or DMARC.
  fix_if: >-
    A 403 or a second 429 from an RDAP server: wait an hour and run once more; never loop. Registrar not Cloudflare or
    an expiry already moved: stop and tell the coordinator (another hand acted). A hold status: stop; the operator reads
    the domain's page in the console before anything else. Never delete the state file once VP 3 has run.
  hermetic: false
  graduation: not-applicable
- step: 3
  phase: pre-deploy
  action: >-
    C0, the read-back (no change). The build asks the operator in these words, waits for the reply, and writes EVIDENCE
    row C0 by kind only.
  command: >-
    echo 'ASK THE OPERATOR: "Please sign in to Cloudflare with your personal login and reply with counts and yes/no only,
    no ids or addresses: (1) Manage Account > Members: how many members, their roles, any pending invitation, and is
    Invite offered? (2) My Profile > API Tokens: how many user tokens, and the most recent Last used date; Manage
    Account > Account API Tokens: how many. (3) Is two-factor authentication on for your login? (4) Notifications: how
    many policies, and do they mail your personal mailbox? (5) For each of the three domains, are Email Routing,
    Workers routes or a Pages project attached? Any Workers or Pages project in the account? (6) Is there a GitHub or
    GitLab connection (Pages or Workers builds)? (7) Does the account name contain your personal address? (8) Manage
    Account > Audit Log, last 90 days: any actor other than you? (9) Billing: how many payment methods, can you add a
    second one, and does the billing profile have a company name field? Where do invoices go today? (10) Domain
    Registration > Manage domains: for onthelooplabs.com and otl-labs.com, is the registrant e-mail shown as verified,
    is auto-renew on, and is there one contact or several (registrant, admin, technical, billing)? (11) Does any
    account anywhere (registry, bank, Companies House, a SaaS) use an address on theseus.support, or has it ever had
    mail routing? (12) For your company Google identity: is 2-Step Verification on, and do you hold a way back in that
    needs neither otl-labs.com mail nor this Cloudflare account (printed Google backup codes kept with the company
    records, or a recovery phone)? (13) Does anything send mail as an onthelooplabs.com address (a Google Workspace
    secondary or alias domain, or a From address in any tool)?"'
  expected: >-
    One member (you, Super Administrator), no pending invitation, Invite offered; user tokens either none or none used
    in the last 30 days; nothing attached to any domain and no Workers, Pages or Git connection; no other actor in the
    audit log; both registrant e-mails verified; nothing uses theseus.support; the company Google identity has 2-Step
    Verification and an off-domain recovery route; nothing sends as onthelooplabs.com.
  fix_if: >-
    Another member, a pending invitation or an unknown actor: stop and ask the operator; never proceed past an unknown
    access. A token used in the last 30 days, anything attached to a zone, or a Git connection: stop and report to the
    coordinator for a plan amendment (something depends on the account that this plan did not see). Invite not
    offered: stop; the plan is amended to the in-place e-mail change (ADVICE.md section 1), never improvised. A
    registrant e-mail not verified: the operator verifies it first. Something uses theseus.support: stop before VP 8;
    the operator moves that account off the domain first or re-rules the lapse. 2FA off on the personal login: the
    operator turns it on before VP 4. Several contacts: VP 6 and 7 set every contact to the same company values. Item
    12 not both yes: the operator sets it up before VP 10, and R1 never starts without it (after R1 the company Google
    identity is the only login, and this account hosts its own domain's DNS: ADVICE.md section 2). Item 13 yes: stop
    before VP 9; onthelooplabs.com needs a real SPF record through a plan amendment, not v=spf1 -all.
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: pre-deploy
  action: >-
    C1, the company login, on the operator's word on this step: the personal login invites the company Google identity
    as Super Administrator and the operator accepts it with Sign in with Google; then P1, the company user's view proves
    it. Writes t_c1 and EVIDENCE rows C1 and P1.
  command: >-
    echo 'ASK THE OPERATOR: "Step C1. (a) Signed in with your personal login: Manage Account > Members > Invite, your
    company Google address, role Super Administrator - All Privileges, send. (b) In a private window, open the invitation
    mail in your company mailbox, follow the link and choose Sign in with Google with your company identity; accept.
    If Cloudflare does not offer Google for the invitation: at the Cloudflare login page choose Sign in with Google with
    the company identity (this creates a user with its own empty account, which is harmless), then accept the invitation
    from that user'"'"'s dashboard. If neither works: accept with your company address and a new password, add two
    second factors (a security key or passkey, and an authenticator app), print the backup codes and keep them with the
    company records, not in a mailbox. (c) As the company user, screenshot Members (two Super Administrators, nothing
    pending), Billing, and Domain Registration > Manage domains listing the three domains, cropped of ids, addresses
    and card digits. Reply with the screenshots and which sign-in path you used."'
  expected: >-
    Screenshots show two Super Administrators and no pending invitation, and the company user sees Billing and the
    three domains; the reply names the sign-in path (Google, or the password-and-two-factor fallback).
  fix_if: >-
    The invitation cannot be accepted by any of the three paths: stop and report; the personal login is untouched, so
    nothing is lost. A role other than Super Administrator: the personal login edits the role. Billing or Registrar not
    visible to the company user: stop; the role is wrong or the account plan restricts members.
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: pre-deploy
  action: >-
    C2, the billing details and card, as the company user, on the operator's word on this step. No test charge (operator
    ruling 2026-11-19): the billing page is BILL-05's evidence_wanted, so BILL-05 is recorded moved (as BILL-01 and
    BILL-02 were) and rec-5425 flips it to proven on the first charge. Writes EVIDENCE row C2.
  command: >-
    echo 'ASK THE OPERATOR: "Step C2, as the company user. Billing > Billing profile: bill-to address = the registered
    office, the company name wherever a field allows it, VAT left blank; Billing email preference = the billing alias.
    Billing > Payment methods: add the company card and make it the default (primary). Do not delete the personal card
    yet. If Cloudflare only lets you replace the card, replace it and tell me. Screenshot the billing profile and the
    payment methods page, cropped of addresses and all but the card brand and last four digits."'
  expected: >-
    The billing profile shows the company's address (and name where offered) and the billing alias for invoices; the
    company card is the default and Cloudflare accepted it; the personal card is still present unless Cloudflare allows
    one card only.
  fix_if: >-
    One-card account (replace only): record C2 as a replacement; R1a then has nothing to delete. A declined card: stop;
    the personal card is still the default, so nothing lapses.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: >-
    C4a, onthelooplabs.com's registrant (first, because it carries no mail), as the company user, on the operator's word
    on this step: one contact edit, approved from both mailboxes the same day; the contacts screenshot is the evidence
    of record, and the registrar RDAP shows no hold and unchanged nameservers (its last-changed event is printed for
    the record, not asserted: whether a contact-only edit moves it is unproven). Writes t_c4a and EVIDENCE row C4a.
  command: |-
    echo 'ASK THE OPERATOR: "Step C4a, as the company user: Manage domains > onthelooplabs.com > Contacts > Edit, in one
    save: Organisation = the company'"'"'s exact Companies House name; first and last name = yours, as director; e-mail
    = the admin alias; address = the registered office; phone = the company or director number. Every contact role the
    page shows gets the same values. Approve the change from your personal mailbox (the current registrant) and from the
    admin alias, the same day; leave the 60-day transfer lock on (do not tick the opt-out). Click any registrant e-mail
    verification link too. Screenshot the contacts page showing the organisation and a verified e-mail, cropped of
    addresses and phone."' && bin/venv-python - <<'PY'
    import json, time, urllib.request, urllib.error
    def get(u):
        for i in range(2):
            try:
                q = urllib.request.Request(u, headers={'Accept': 'application/rdap+json, application/json', 'User-Agent': 'rdap-probe/1.0'})
                with urllib.request.urlopen(q, timeout=30) as f: return json.loads(f.read())
            except urllib.error.HTTPError as e:
                if e.code != 429 or i: raise
                time.sleep(30)
    S = '/mnt/project-files/cloudflare-company-assignment/build-state.json'; s = json.load(open(S)); b = s['domains']['onthelooplabs.com']
    c = get('https://rdap.cloudflare.com/rdap/v1/domain/ONTHELOOPLABS.COM')
    changed = next(e['eventDate'] for e in c['events'] if e['eventAction'] == 'last changed')
    ns = sorted(a['data'] for a in get('https://dns.google/resolve?name=onthelooplabs.com&type=NS').get('Answer', []) if a.get('type') == 2)
    print('C4A_LAST_CHANGED_MOVED', changed > b['changed'])
    got = (not any('hold' in x for x in c.get('status', [])), ns == b['ns'])
    print('C4A', got); assert got == (True, True), got; print('C4A_OK')
    PY
  expected: >-
    The contacts screenshot shows the company as organisation, a verified e-mail and no pending change; then
    C4A_LAST_CHANGED_MOVED (True or False), C4A (True, True) and C4A_OK.
  fix_if: >-
    No approval mail at either mailbox within an hour: the operator checks spam, then cancels and re-submits once; the
    request cancels itself after 7 days. The screenshot shows a pending change: wait for the approvals; last-changed
    not moving is not a failure on its own. Cloudflare applies the edit with no approval mail at all: record it; the
    screenshot stays the evidence (the sidecar does not claim approvals). A hold status:
    stop everything and have the operator open the domain's page (an unverified registrant e-mail suspends a domain);
    VP 7 does not start.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: >-
    C4b, otl-labs.com's registrant, the same edit and approvals on the operator's word on this step, only after VP 6
    passed; then, as VP 6, the screenshot of record, no hold, unchanged nameservers and the unchanged Google MX
    (last-changed printed, not asserted). Writes t_c4b and EVIDENCE row C4b.
  command: |-
    echo 'ASK THE OPERATOR: "Step C4b: the same edit as C4a on otl-labs.com, the same values, one save, both approvals the
    same day, the lock left on, any verification link clicked. Screenshot the contacts page as before."' && bin/venv-python - <<'PY'
    import json, time, urllib.request, urllib.error
    def get(u):
        for i in range(2):
            try:
                q = urllib.request.Request(u, headers={'Accept': 'application/rdap+json, application/json', 'User-Agent': 'rdap-probe/1.0'})
                with urllib.request.urlopen(q, timeout=30) as f: return json.loads(f.read())
            except urllib.error.HTTPError as e:
                if e.code != 429 or i: raise
                time.sleep(30)
    S = '/mnt/project-files/cloudflare-company-assignment/build-state.json'; s = json.load(open(S)); b = s['domains']['otl-labs.com']
    c = get('https://rdap.cloudflare.com/rdap/v1/domain/OTL-LABS.COM')
    changed = next(e['eventDate'] for e in c['events'] if e['eventAction'] == 'last changed')
    dns = lambda n, t: sorted(a['data'] for a in get(f'https://dns.google/resolve?name={n}&type={t}').get('Answer', []) if a.get('type') == {'MX': 15, 'NS': 2}[t])
    print('C4B_LAST_CHANGED_MOVED', changed > b['changed'])
    got = (not any('hold' in x for x in c.get('status', [])), dns('otl-labs.com', 'NS') == b['ns'], dns('otl-labs.com', 'MX') == s['otl-labs.com']['mx'])
    print('C4B', got); assert got == (True, True, True), got; print('C4B_OK')
    PY
  expected: The contacts screenshot as in VP 6; then C4B_LAST_CHANGED_MOVED (True or False), C4B (True, True, True) and C4B_OK.
  fix_if: >-
    As VP 6. An MX difference: stop at once and have the operator restore the Google MX record from the VP 2 baseline
    before anything else; company mail and every reset path depend on it.
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: pre-deploy
  action: >-
    C5 and C6, on the operator's word on each: theseus.support's auto-renew off (C0 found nothing using it), Cloudflare
    notifications to the alerts alias, and the account renamed to the company. Writes EVIDENCE rows C5 and C6.
  command: >-
    echo 'ASK THE OPERATOR: "Step C5, as the company user: Manage domains > theseus.support > Configuration (or
    Registration) > Auto-renew: off. Screenshot it. Step C6: Notifications > each policy and destination: replace your
    personal mailbox with the alerts alias; Manage Account > Configurations > account name = the company name. If C1
    used the second sign-in path, the company user also has an empty account of its own: delete it if Cloudflare
    offers that, otherwise tell me it remains (it holds no domain and no card). Screenshot both, cropped of ids and
    addresses."'
  expected: >-
    Auto-renew reads off for theseus.support only (on for the two company domains); no notification goes to the
    personal mailbox; the account name is the company's.
  fix_if: >-
    Auto-renew cannot be turned off: stop and report (Cloudflare would charge the company card in 2027). A notification
    that cannot be re-addressed: record it; R1b removes the personal user's own notifications.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: >-
    C7 (rec-4541), on the operator's word on this step, after VP 7: SPF and a monitor-only DMARC record on otl-labs.com,
    send-nothing SPF and DMARC on onthelooplabs.com and on theseus.support (it resolves until it lapses); then public DNS
    shows each record, one SPF record on otl-labs.com and the Google MX unchanged, which is rec-4541's own acceptance and
    more. The build then closes rec-4541 through scripts.ops_data_portal --update-rec (get_rec_write_guidance first),
    its resolution naming rec-5429 as the owner of DKIM and DMARC enforcement, and reads it back closed (VP 16). Writes
    EVIDENCE row C7.
  command: |-
    echo 'ASK THE OPERATOR: "Step C7, as the company user, DNS > Records, adding TXT records only; each value is the text
    between the single quotes, without the quotes. On otl-labs.com: name @, value '"'"'v=spf1 include:_spf.google.com ~all'"'"';
    name _dmarc, value '"'"'v=DMARC1; p=none; rua=mailto:'"'"' followed straight away by the security alias. On
    onthelooplabs.com and again on theseus.support: name @, value '"'"'v=spf1 -all'"'"'; name _dmarc, value
    '"'"'v=DMARC1; p=reject;'"'"'. Change nothing else, and screenshot the three record lists."' &&
    q() { curl -s "https://dns.google/resolve?name=$1&type=$2"; } &&
    q _dmarc.otl-labs.com TXT | grep -q 'v=DMARC1; p=none' &&
    q otl-labs.com TXT | grep -q 'v=spf1 include:_spf.google.com' &&
    test "$(q otl-labs.com TXT | grep -o 'v=spf1' | wc -l)" -eq 1 &&
    q otl-labs.com MX | grep -q 'smtp.google.com' &&
    q onthelooplabs.com TXT | grep -q 'v=spf1 -all' && q _dmarc.onthelooplabs.com TXT | grep -q 'v=DMARC1; p=reject' &&
    q theseus.support TXT | grep -q 'v=spf1 -all' && q _dmarc.theseus.support TXT | grep -q 'v=DMARC1; p=reject' &&
    echo C7_OK
  expected: Prints C7_OK.
  fix_if: >-
    A record missing: DNS caches lag the TTL; run once more after five minutes. Two SPF records (invalid): the operator
    deletes the extra one. MX missing: stop at once; the operator restores it from the VP 2 baseline. A rec-4541 write
    refused: it fails loud (Decision 84 I-4); restore connectivity and write once more.
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: pre-deploy
  action: >-
    R1, the predecessor removal, only after VP 4-9 pass and C0 item 12 holds (2-Step Verification and an off-domain
    recovery route on the company Google identity), as three steps with the operator's word on each: R1a the
