    bin/venv-python - <<'PY'
    import json, re, time, urllib.request, urllib.error
    def get(u):
        for i in range(2):
            try:
                q = urllib.request.Request(u, headers={'Accept': 'application/rdap+json, application/json', 'User-Agent': 'rdap-probe/1.0'})
                with urllib.request.urlopen(q, timeout=30) as f: return json.loads(f.read())
            except urllib.error.HTTPError as e:
                if e.code != 429 or i: raise
                time.sleep(30)
    F = '/mnt/project-files/cloudflare-company-assignment/'; s = json.load(open(F + 'build-state.json')); ev = open(F + 'EVIDENCE.md', encoding='utf-8').read()
    dns = lambda n, t: sorted(a['data'] for a in get(f'https://dns.google/resolve?name={n}&type={t}').get('Answer', []) if a.get('type') == {'MX': 15, 'NS': 2}[t])
    for d, b in s['domains'].items():
        c = get('https://rdap.cloudflare.com/rdap/v1/domain/' + d.upper())
        exp = next(e['eventDate'] for e in c['events'] if e['eventAction'] == 'expiration')[:10]
        got = (exp == b['expiry'], not any('hold' in st for st in c.get('status', [])), dns(d, 'NS') == b['ns'])
        print(d, got); assert got == (True, True, True), (d, got)
    assert dns('otl-labs.com', 'MX') == s['otl-labs.com']['mx'], 'MX changed'
    rows = ['C0', 'C1', 'P1', 'C2', 'C4a', 'C4b', 'C5', 'C6', 'C7', 'R1a', 'R1b', 'R1c']
    miss = [r for r in rows if not re.search(rf'^\| {r} \|.*\| pass \|$', ev, re.M)]; assert not miss, miss
    REDACT = r'@|(?<![0-9])[0-9]{12}(?![0-9])|\barn:|\b[0-9a-f]{32}\b|£|\$[0-9]|(?<![0-9])[0-9]{4}[ -]?[0-9]{4}[ -]?[0-9]{4}'
    assert not re.search(REDACT, ev), 'EVIDENCE.md redaction hit'
    print('CONTINUITY_OK')
    PY
