  graduation: waive
  graduation_waiver_reason: existing suites already in the fast tier by path; the one new node is a mirror-test node of a changed
    file, run by --pre pytest_diff
- step: 3
  phase: pre-deploy
  action: code_reviewer is implemented and bound to its contract.
  command: 'grep -n -A4 ''persona: code_reviewer'' docs/contracts/executor-personas.yaml | grep -c ''status: implemented, location:
    scripts/personas/review_input.py'''
  expected: prints 1
  fix_if: 'prints 0: set the row; the binding check needs the location to name the contract path'
  hermetic: true
  expected_literals:
  - '1'
  graduation: waive
  graduation_waiver_reason: validate_persona_contract_binding already enforces the binding on every tree
- step: 4
  phase: post-deploy
  action: The squash commit carries the Resolves trailer for rec-5696 and rec-5708, and merge_step readback's own recs_by_ids
    leg reads both recs' status (it reads bundled_recommendations).
  command: bin/venv-python -m scripts.session.merge_step readback --slug code-reviewer-add --sha <merge_sha>
  expected: readback OK naming rec-5696 and rec-5708, then (after ci.yml's closure job) both status legs read closed
  fix_if: 'MISSING: follow merge_step recover'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a per-merge read-back, not a repository property
- step: 5
  phase: post-deploy
  action: 'Live read-back: on the first code PR from an allow-listed author after merge (a draft PR the build opens from the operator''s
    account if none arrives within a day, so the author is allow-listed), read the head''s CI run and check runs. A session without
    gh makes the same two reads through mcp__github__ (actions_list for the runs, pull_request_read get_check_runs) and applies
    the same comparison.'
  command: ci=$(gh api "repos/otl-labs/ontheloop/actions/runs?head_sha=<head_sha>" --jq '[.workflow_runs[] | select(.path==".github/workflows/ci.yml"
    and .status=="completed") | .updated_at] | max'); gh api repos/otl-labs/ontheloop/commits/<head_sha>/check-runs | jq -r --arg
    ci "$ci" '.check_runs[] | select(.name=="persona-verdict/code_reviewer") | [.app.id, (.output.title | startswith("verdict ")),
    (.started_at > $ci)] | @tsv'
  expected: one row '<gates.verdict_app.app_id> true true'
  fix_if: 'no row, false in either column, or an empty ci value: read the persona-verdict run for that head and STOP to the plan
    owner with its run id and the check title'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a one-time live proof of the add step
