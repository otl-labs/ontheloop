    tests/checks/ci_guards/test__persona_verdict_fallback.py tests/checks/ci_guards/test_validate_persona_verdict_chain.py tests/checks/ci_guards/test_validate_persona_verdict_chain_upstreams.py
    tests/checks/contracts/test_validate_project_configuration.py tests/checks/contracts/test_validate_persona_contract_binding.py
    tests/personas/test_egress_launcher.py tests/persona_contracts/test_verdict_persona_contracts.py tests/checks/misc/test__persona_verdict_container.py
    -q
  expected: exit 0, no failures
  fix_if: 'test_run.py''s closure node fails: review_input''s closure left {yaml, pydantic}; import narrower helpers, never widen
