execution_steps:
- Read code_reviewer.yaml input_schema, materialise.py, route.py, keyed_run.py, execute.py, run.py, persona-verdict.yml and the
  three ci_guards modules with their tests.
- Write the fixtures and the new and modified test nodes; confirm they fail.
- Write review_input.py and review_context.py; register the provider and the ctx extension in materialise.py; add the run.py verb;
  route.py upstream split, kill switch, re-run skip and keyed output; execute.keyed_personas and keyed_run acceptance.
- Edit persona-verdict.yml and the guards together; edit executor-personas.yaml (implemented) and project-configuration.yaml (readers,
  advisory_runs, amendment_log).
- Run VP 1-3, then validate --pre; then the full tier and --verify-head as a tracked background run (run_in_background, timeout
  7200000, never a shell &).
- 'Open the build PR, merge on green (Resolves: rec-5696, rec-5708), declare implementation; then VP 4 and VP 5 on the first code
  PR.'
