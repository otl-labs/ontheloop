schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: code-reviewer-add
intent: 'Switch the code_reviewer verdict persona on as an advisory GitHub check (T4.28 c4 ADD; rec-5696 and rec-5708, merged by
  the operator 2026-11-27 because the persona binding guard refuses a provider for a pending persona): materialise builds all 14
  contract fields from the pull request (head snapshot read only as data, rule text from main), a shell verb fetches the GitHub-shaped
  context, the verdict chain runs code_reviewer once per head after that head''s CI completes, and the keyed run job widens from
  fixture-only PRs to that one route (operator approval 2026-11-27 11:41 UTC). The check gates nothing while gates.code_reviewer.verdict_source
  reads in_session; a project-configuration row switches the runs off.'
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-code-reviewer-add.yaml
phase: 'T4.28 (code_reviewer persona) c4 ADD: provider, switch-on and advisory check. c4 itself is not closed here (T4.28 cannot
  start before T4.32 completes); the live read-back is recorded for the plan that closes it.'
closes_criteria: []
cites:
- dec:128
- dec:187
- dec:205
- dec:224
- dec:229
- dec:235
- dec:263
- dec:271
- dec:280
amends: []
introduces: []
scope:
- file: scripts/personas/review_input.py
  action: Create
  purpose: 'The code_reviewer provider, registered in materialise.PROVIDERS. Pure: no network, no GITHUB_TOKEN. Lives in the shell
    package scripts/personas/, outside persona_image.yaml build.copy, so validate_persona_github_agnosticism does not scan it (Decision
    205 cl.2). Its GitHub-shaped inputs come from one shell-prepared file, prepared/review-context.json, whose shape this module
    owns (written by review_context.py''s fetch verb): {merge_base_sha, truncated: bool, files: [{filename, status, previous_filename?}],
    diff, merge_base_texts: {path: text} (the merge-base text of each changed or removed .py under tests/, scripts/ or src/, and
    of a renamed file''s previous_filename), check_runs: [{name, status, conclusion, summary, app_id, app_slug}], body_author_association,
    comments: [{body, author_association}], head_ref}; the provider reads it through its own constant REVIEW_CONTEXT = Path(''prepared'')
    / ''review-context.json'', relative to materialise''s cwd, like route.ROUTES. A missing or malformed file, or truncated true,
    raises Unusable(input_incomplete). Fields beyond the shared three: change_files (one ''status path'' line per file, ''renamed
    old -> new'' for a rename) and diff; review_scope (JSON: changed files, the plan''s scope files, and the one-level src imports
    of every changed .py file and every plan scope file, found by ast-parsing the snapshot copy (resolver helper chosen at build),
    each with why; plan path = ctx plan_paths, else find_plan''s agent/<slug> rule applied to head_ref, else none); review_scope_files
    (only clean repo-relative paths to regular files are read; a review_scope entry that is absent at head, a directory or not
    UTF-8 gets its header line plus one placeholder line naming why, and an unclean token (''..'', absolute) is skipped, never
    a raised failure; contents: each review_scope file, the documents changed files reference by path, meaning repo-relative path
    tokens in a changed file that exist in the snapshot, and pyproject.toml, requirements*.txt and .github/workflows/*, read from
    the snapshot after a header line naming the path); project_context (docs/PROJECT_CONTEXT.md at base_root); review_exemptions
    (the ''## Code Review Exemptions'' section of docs/DECISIONS_ARCHIVE.md at base_root, up to the next ''## '' header, or empty);
    review_dispositions (implement-scope-boundary.yaml review_dispositions at base_root); weakening_candidates (validate_weakening_candidates.find_candidates
    with read_base from merge_base_texts, never main''s tip, and read_head from the snapshot; statuses map added->A, unchanged->skipped,
    modified/changed->M, removed->D, renamed->D of previous_filename plus A of filename, copied->A of filename only, as the module''s
    own --no-renames read does; rendered directly in _print_report''s line format (not by calling it: it reads dispositions through
    _common.ROOT, not base_root), or the single line ''no weakening candidates'' so the minLength-1 field is never empty); ci_results
    (JSON {state computed after the drops: absent when no run is kept, incomplete when any kept run''s status is not completed,
    else completed; checks: [{name, status, conclusion, summary, app_slug}]}: a run is dropped when its name starts with ''persona-verdict/''
    or its app_id equals merge_checks.verdict_app_id read from base_root''s project-configuration.yaml (Decision 271 cl.1-2); when
    that read returns None or a reason string, drop by name only and add one ''verdict_app_id unavailable: <reason>'' note to the
    field; each kept check carries its app_slug so a non-CI source is visible); change_evidence (resolution[''body''] with the
    body author''s association from review-context.json body_author_association, or the line ''description withheld: over the size
    cap'' when resolve_pr set body_oversized; then each comment with author_association; all as quoted data); review_guidance (deploy-paths.yaml
    admin_out_of_band and tests/CLAUDE.md''s Mock exhaustion and Test-count coupling sections, at base_root). Never imports, installs
    or executes a head file. Failure mapping: an absent or unreadable base_root file, or RecursionError or MemoryError from ast.parse
    or find_candidates on a head file, maps to Unusable(input_unusable); a head file raising SyntaxError is listed without its
    imports; each path read catches SnapshotRefused itself (absent, directory, a path through a regular file such as pyproject.toml/x,
    '''', ''.'', ''..'', absolute), giving a placeholder or skip, never a whole-route failure; an unclean head_ref slug (agent/x/../../y)
    means no plan. If review_input.py nears 500 SLOC, decompose it into a scripts/personas/review_input/ facade package (Decision
    128), never raise a budget. The module holds the contract path literal docs/contracts/personas/code_reviewer.yaml, so the implemented
    row''s location names its contract (implementation_binding).'
- file: scripts/personas/materialise.py
  action: Modify
  purpose: 'Register the provider in PROVIDERS; extend the provider ctx with plan_paths and base_root (build_input already holds
    both) so main-side reads go through base_root, never execute.ROOT or routes.json directly; print one ''PERSONA-VERDICT input
    <route> bytes=N'' line per materialised input (the size rec-5708''s per-PR handling reads). review_input registers itself at
    its own end (materialise.PROVIDERS[''code_reviewer''] = build); materialise''s last line is ''from scripts.personas import
    review_input  # noqa: E402,F401'', so either import order works.'
- file: scripts/personas/review_context.py
  action: Create
  purpose: 'The shell fetch verb (run.py review-context), run in the prepare job with GH_TOKEN only when routes.json routes code_reviewer,
    else a no-op line. Through resolve_pr.request (the one stdlib client) it writes prepared/review-context.json in review_input''s
    shape: compare from the resolution''s merge base to head (files, diff, truncated at route.COMPARE_LIMIT), merge_base_texts
    from the contents API at merge_base_sha for each changed or removed .py under tests/, scripts/ or src/ (and a rename''s previous_filename),
    the head''s check runs with app id and slug (paged), the issue comments with author_association, the PR author''s association
    and head_ref. Any API error writes failure-code_reviewer.json input_incomplete instead, never a partial file. Reads no secret
    but GH_TOKEN.'
- file: scripts/personas/run.py
  action: Modify
  purpose: Adds the review-context verb to the dispatch table (review_context.main).
- file: scripts/personas/route.py
  action: Modify
  purpose: 'Upstream-aware routing from the GitHub-set workflow_run.path: the CI upstream (.github/workflows/ci.yml) routes only
    code-class personas (merge_checks.PERSONA_CLASSES) and never fixture personas; the trigger upstream routes plan-class and fixture
    personas as today; a CI run whose conclusion is cancelled routes nothing (a newer head brings its own). gates.code_reviewer.advisory_runs
    (read at main through the project-configuration row) set off drops code_reviewer with a ''PERSONA-VERDICT skip code_reviewer:
    advisory_runs off'' line. A head that already carries a completed persona-verdict/code_reviewer check from the verdict App
    (a CI re-run) is skipped with a line. New output keyed=true when exactly one route remains and it is a fixture persona or an
    implemented verdict persona.'
- file: scripts/personas/keyed_run.py
  action: Modify
  purpose: prepared_request accepts a route that is a fixture persona or an implemented verdict persona (execute.keyed_personas);
    every other refusal is unchanged.
- file: scripts/personas/execute.py
  action: Modify
  purpose: 'keyed_personas(root): fixture_kind personas plus verdict rows with implementation status implemented; _contract (schema_for,
    failure_schema_for) serves exactly that set.'
- file: .github/workflows/persona-verdict.yml
  action: Modify
  purpose: 'workflow_run.workflows gains CI; the concurrency group gains github.event.workflow_run.path so a CI-upstream run never
    cancels a trigger-upstream run for the same branch; prepare gains output keyed and a ''Fetch the review context'' step (GH_TOKEN,
    after materialise inputs are routed, before materialise); run and run-fallback read needs.prepare.outputs.keyed == ''true''
    in place of fixture; smoke and refusal keep fixture == ''true''; the step ''Run the fixture persona'' is renamed ''Run the
    persona''; the header comment''s ''fixture PRs only'' becomes ''fixture PRs and implemented verdict routes''. 481 of 500 effective
    lines (NEAR_CAP): the new step is about 7 lines; if the edit crosses 500, fold the fetch into the existing route step''s command
    rather than raising a budget.'
- file: scripts/checks/ci_guards/validate_persona_verdict_chain.py
  action: Modify
  purpose: 'UPSTREAMS gains CI; VERDICT_GROUP gains the workflow_run.path term; the prepare step pins gain the review-context step.
    At about 498 of 500 SLOC: if the edit crosses 500, move the trigger and upstream pins into a sibling module (Decision 128),
    never raise a budget.'
- file: scripts/checks/ci_guards/_persona_verdict_keyed.py
  action: Modify
  purpose: 'KEYED_IF splits: smoke and refusal keep the fixture term; run uses needs.prepare.outputs.keyed == ''true''; the run
    step''s pinned name becomes ''Run the persona''.'
- file: scripts/checks/ci_guards/_persona_verdict_fallback.py
  action: Modify
  purpose: run-fallback's derived condition uses the keyed term; the drill stays fixture-only (fallback_drill output); the step-name
    lookup follows the rename.
- file: docs/contracts/executor-personas.yaml
  action: Modify
  purpose: 'code_reviewer implementation becomes {status: implemented, location: scripts/personas/review_input.py}; fixture_kind
    rule (3b)''s run wording gains implemented verdict routes. Plus one new amendment_log entry {semantic_break: false, change_class:
    field_add, summary: ''PLAN-code-reviewer-add (rec-5696, rec-5708): code_reviewer implemented at scripts/personas/review_input.py;
    fixture_kind rule (3b) names implemented verdict routes''} as the Class D drift check requires. Nothing else.'
- file: tests/personas/test_review_input.py
  action: Create
  purpose: 'Mirror test, each node through materialise.build_input(..., ''code_reviewer'', ...) with a synthetic base_root. test_code_reviewer_input_validates_against_contract
    (rec-5696 acceptance): the input validates against code_reviewer''s input_schema with every minLength-1 field non-empty, a
    changed fixture module''s one-level import and a plan scope file''s one-level import appear in review_scope, and a renamed
    file''s change_files line reads ''renamed old -> new''. test_head_code_never_executes: .py files generated in tmp_path that
    write a marker on import or execution leave no marker. test_ci_results_states: completed, incomplete and absent sets, state
    computed after the drops (a queued persona run does not make it incomplete); a run carrying the verdict App id dropped; a ''persona-verdict/code_reviewer''
    run from another app dropped; a None and a reason-string app id each drop by name and carry the note; kept checks carry app_slug.
    test_weakening_reads_the_merge_base: a test file changed on main but not in the PR reports nothing; a renamed and weakened
    test reports a candidate; a copied test reports no removal; no candidates renders the single line. test_untrusted_text_is_data:
    a PR body carrying prompt-like text appears only inside change_evidence. test_missing_or_truncated_context_is_input_incomplete.
    test_review_exemptions_reads_the_archive: the real docs/DECISIONS_ARCHIVE.md at the repo root yields a non-empty section starting
    ''## Code Review Exemptions''. test_plan_falls_back_to_head_ref: no plan_paths and head_ref agent/<slug> with that plan in
    the snapshot fills plan. test_unreadable_paths_do_not_fail_the_input: a directory token, a ''..'' token, a ''pyproject.toml/x''
    token, a removed file, a non-UTF-8 changed file and a changed .py that does not parse yield header plus placeholder lines or
    skips, never an Unusable. test_rule_text_reads_base_root: the snapshot carries planted divergent copies of docs/PROJECT_CONTEXT.md,
    docs/DECISIONS_ARCHIVE.md, docs/contracts/implement-scope-boundary.yaml, docs/contracts/deploy-paths.yaml, tests/CLAUDE.md
    and docs/contracts/project-configuration.yaml (another app id); every rule field equals the base_root text, no planted marker
    appears, and the base app id is the one dropped.'
- file: tests/personas/test_materialise.py
  action: Modify
  purpose: 'Adds test_materialise_prints_input_bytes_per_route: materialise prints one ''PERSONA-VERDICT input <route> bytes=N''
    line per materialised input, N equal to the written file''s size. No existing node changes. Graduated shards persona-guidance-chain-fill,
    persona-guidance-chain-guards and persona-verdict-fixture-run-units are kept: no node they select changes.'
- file: tests/personas/test_review_context.py
  action: Create
  purpose: 'Mirror test with a fake resolve_pr.request: test_fetch_writes_the_review_context (shape, paging, merge-base texts,
    rename previous text); test_fetch_error_is_input_incomplete; test_fetch_is_a_noop_without_the_route.'
- file: tests/personas/test_route.py
  action: Modify
  purpose: 'Adds test_code_reviewer_routes_on_code_pr_once_implemented (rec-5708 acceptance: CI upstream, code PR, implemented
    row -> routes [code_reviewer], keyed true; trigger upstream -> no code_reviewer), test_cancelled_ci_routes_nothing, test_advisory_runs_off_skips_with_a_line,
    test_rerun_with_existing_check_skips, test_fixture_routes_only_from_the_trigger_upstream. Existing nodes unchanged. Graduated
    shard(s) persona-verdict-scout-carry-units kept: their selected nodes stay and pass (any pinned literal they assert is updated
    in the same node, never dropped).'
- file: tests/personas/test_keyed_run.py
  action: Modify
  purpose: 'Adds test_implemented_verdict_route_is_accepted_and_pending_refused. Graduated shard(s) keyed-run-registry-key kept:
    their selected nodes stay and pass (any pinned literal they assert is updated in the same node, never dropped).'
- file: tests/personas/test_execute.py
  action: Modify
  purpose: 'Adds test_keyed_personas_are_fixtures_and_implemented_verdicts. Graduated shard(s) persona-record-telemetry-first,
    persona-verdict-fallback-run-units kept: their selected nodes stay and pass (any pinned literal they assert is updated in the
    same node, never dropped).'
- file: tests/personas/test_run.py
  action: Modify
  purpose: ALLOWED gains review-context with {yaml, pydantic} (or narrower); the closure node covers it.
- file: tests/checks/ci_guards/test__persona_verdict_keyed.py
  action: Modify
  purpose: 'The run job''s pinned condition reads keyed; smoke and refusal still need fixture; a run job reading fixture, or smoke
    reading keyed, is refused. Graduated shard(s) persona-verdict-fallback-run-guards, persona-verdict-fixture-run-guards kept:
    their selected nodes stay and pass (any pinned literal they assert is updated in the same node, never dropped).'
- file: tests/checks/ci_guards/test_validate_persona_verdict_chain.py
  action: Modify
  purpose: 'Three upstreams and the path-bearing group are required; a missing CI upstream or the old group is refused. Graduated
    shard(s) persona-verdict-chain-shape, persona-verdict-wake-shape kept: their selected nodes stay and pass (any pinned literal
    they assert is updated in the same node, never dropped).'
- file: docs/contracts/project-configuration.yaml
  action: Modify
  purpose: 'gates.verdict_app.app_id readers gains scripts/personas/review_input.py (Decision 224); a new row gates.code_reviewer.advisory_runs
    (kind project, values on|off, default on, reader scripts/personas/route.py, basis this plan and the 2026-11-26 consult''s kill
    switch); and one amendment_log entry {semantic_break: false, change_class: field_add} naming both, as the Class D drift check
    requires. No other line changes.'
- file: tests/fixtures/persona_verdict/review_input/
  action: Create
  purpose: Synthetic head snapshot (one plan, one changed src module with an import, one non-collectable test-shaped file named
    sample_case.py.txt or generated in tmp_path) and review-context.json variants; no executable-on-import module is committed
    and no test_*.py is placed under tests/fixtures.
bundled_recommendations:
- rec-5696
- rec-5708
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- tests/personas/test_review_input.py::test_code_reviewer_input_validates_against_contract passes; the test file is new in this
  change.
- tests/personas/test_route.py::test_code_reviewer_routes_on_code_pr_once_implemented passes (rec-5708 acceptance).
- After merge, the first code PR from an allow-listed author shows a persona-verdict/code_reviewer check from the verdict App on
  its head, posted after that head's CI completed, and gates.code_reviewer.verdict_source still reads in_session.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The provider nodes pass.
  command: bin/venv-python -m pytest tests/personas/test_review_input.py::test_code_reviewer_input_validates_against_contract tests/personas/test_review_input.py::test_head_code_never_executes
    tests/personas/test_review_input.py::test_ci_results_states tests/personas/test_review_input.py::test_weakening_reads_the_merge_base
    tests/personas/test_review_input.py::test_untrusted_text_is_data tests/personas/test_review_input.py::test_missing_or_truncated_context_is_input_incomplete
    tests/personas/test_review_input.py::test_review_exemptions_reads_the_archive tests/personas/test_review_input.py::test_plan_falls_back_to_head_ref
    tests/personas/test_review_input.py::test_unreadable_paths_do_not_fail_the_input tests/personas/test_review_input.py::test_rule_text_reads_base_root
    -q
  expected: exit 0 with 10 passed
  fix_if: a node fails; fix review_input.py or the materialise ctx, never the assertion
  hermetic: true
  expected_literals:
  - 10 passed
  graduation: graduate
  graduation_check_id: code-reviewer-add-units
- step: 2
  phase: pre-deploy
  action: The chain suites, the keyed and chain guards, the configuration and binding checks pass with the widened run.
  command: bin/venv-python -m pytest tests/personas/test_materialise.py tests/personas/test_route.py tests/personas/test_run.py
    tests/personas/test_keyed_run.py tests/personas/test_execute.py tests/personas/test_review_context.py tests/checks/ci_guards/test__persona_verdict_keyed.py
    tests/checks/ci_guards/test__persona_verdict_fallback.py tests/checks/ci_guards/test_validate_persona_verdict_chain.py tests/checks/contracts/test_validate_project_configuration.py
    tests/checks/contracts/test_validate_persona_contract_binding.py -q
  expected: exit 0, no failures
  fix_if: 'test_run.py''s closure node fails: review_input''s closure left {yaml, pydantic}; import narrower helpers, never widen
    ALLOWED'
  hermetic: true
  expected_literals:
  - passed
  graduation: waive
  graduation_waiver_reason: existing suites already in the fast tier by path; the one new node is a mirror-test node of a changed
    file, run by --pre pytest_diff
- step: 3
  phase: pre-deploy
  action: code_reviewer is implemented and bound to its contract.
  command: 'grep -n -A4 ''persona: code_reviewer'' docs/contracts/executor-personas.yaml | grep -c ''status: implemented, location:
    scripts/personas/review_input.py'''
  expected: prints 1
  fix_if: 'prints 0: set the row; the binding check needs the location to name the contract path'
  hermetic: true
  expected_literals:
  - '1'
  graduation: waive
  graduation_waiver_reason: validate_persona_contract_binding already enforces the binding on every tree
- step: 4
  phase: post-deploy
  action: The squash commit carries the Resolves trailer for rec-5696 and merge_step readback's own recs_by_ids leg reads rec-5696's
    status.
  command: bin/venv-python -m scripts.session.merge_step readback --slug code-reviewer-add --sha <merge_sha>
  expected: readback OK naming rec-5696, then (after ci.yml's closure job) its status leg reads closed
  fix_if: 'MISSING: follow merge_step recover'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a per-merge read-back, not a repository property
- step: 5
  phase: post-deploy
  action: 'Live read-back: on the first code PR from an allow-listed author after merge (a draft PR the build opens if none arrives
    within a day), read the head''s check runs; persona-verdict/code_reviewer comes from the verdict App and its started_at is
    after the CI run''s completed_at.'
  command: gh api repos/otl-labs/ontheloop/commits/<head_sha>/check-runs --jq '.check_runs[] | select(.name=="persona-verdict/code_reviewer")
    | [.app.id, .conclusion, .started_at] | @tsv'
  expected: one row whose app id is gates.verdict_app.app_id; any conclusion (advisory)
  fix_if: 'no row: read the persona-verdict run for that head and STOP to the plan owner with its run id'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a one-time live proof of the add step
