  action: Modify
  purpose: 'run-fallback''s derived condition uses the keyed term; the drill stays fixture-only (fallback_drill output); PREPARE_OUTPUTS
    (lines 19-23) gains keyed (CRI5-08); a run-fallback whose condition reads fixture in place of keyed is refused.'
  new_imports: []
