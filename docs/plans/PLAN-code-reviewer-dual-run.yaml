    expected: exit 0, no failures
    fix_if: a node fails; fix the code, never the assertion
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a regression sweep over existing suites, already run by CI's own selection
  - step: 3
    phase: pre-deploy
    action: Live in-session read over a past window carries served models (rec-5743; read-only, agent_platform profile).
    command: >-
      bin/venv-python -m scripts.persona_contracts.findings_read --day-from 2026-11-25 --day-to 2026-11-25 --lane in_session
      --profile agent_platform
      | grep '"lane": "in_session"' | grep -vc '"served_model": null'
    expected: a count of at least 1 (an in-session row whose served_model is filled)
    fix_if: >-
      zero rows with a model; fix the model_call join against the live rows; an unreachable reader is a STOP. Run it
      as a Bash run_in_background task if it nears the foreground cap (CDR1-12)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a live read of production telemetry, not a repository property
  - step: 4
    phase: pre-deploy
    action: The full tier passes on the committed tree (handoff_policy).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0 and a verified head
    fix_if: a failure; fix forward on the branch, never skip a check
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: >-
      After merge the read-back reads the registration from main: its digest equals the merged file's sha256, the row
      is calibrating and nothing counts (old step 4 folded here, CDR1-13).
    command: >-
      git fetch origin main && bin/venv-python -m scripts.personas.dual_run --persona code_reviewer --day-from <merge_day>
      --day-to <merge_day> --profile agent_platform > /tmp/dual_run.json
      && grep -c "\"registration_sha256\": \"$(git show origin/main:docs/contracts/persona-dual-run.yaml | sha256sum | cut -d' ' -f1)\"" /tmp/dual_run.json
      && grep -c '"status": "calibrating"' /tmp/dual_run.json && grep -c '"streak": 0' /tmp/dual_run.json
    expected: three counts of 1; run as a Bash run_in_background task if it nears the foreground cap (CDR1-12)
    fix_if: 0; the tool read the working tree or hashed other bytes; fix forward on a new branch
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a live post-merge observation
  - step: 6
    phase: post-deploy
    action: >-
      Live pairing on this plan's own build PR (CDR1-03): before merge the build session runs the trial head review by
      hand on its clean pushed head, as the implement.md subsection says, and waits for that head's persona-verdict
      run to conclude; after merge the read-back over the merge day reads this PR as uncounted with at least one
      paired head (CDR2-04).
    command: >-
      bin/venv-python -m scripts.personas.dual_run --persona code_reviewer --day-from <day of the PR's first pushed head>
      --day-to <merge_day> --profile agent_platform | bin/venv-python -c "import json,sys; d=json.load(sys.stdin);
      e=[p for p in d['prs'] if p['change_id']=='<this_pr_number>'];
      print([(p['mark'], p['skip_reason'], p['uncounted_reason']) for p in e]);
      raise SystemExit(0 if len(e)==1 and e[0]['mark']=='uncounted' and any(h['in_session_run_ref'] and h['actions_run_ref'] for h in e[0]['heads']) else 1)"
    expected: >-
      exit 0. A skip fails the step, with one exception: actions_failure or in_session_failure, reported with the
      failing run_ref as gap evidence, is a pass-with-gap the report names; no_pair or any other skip is a FAIL
    fix_if: >-
      exit 1 with no_pair or the PR absent; fix the pairing key, the subject_sha match, the day window or the code-PR
      classifier forward on a new branch
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a live post-merge observation of this plan's own build PR
  - step: 7
    phase: post-deploy
    action: The bundled recs and the primary rec read back closed after the squash merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; rows = list(c.make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5710,rec-5072,rec-5743'));
      raise SystemExit(0 if len(rows) == 3 and all(r['status'] == 'closed' for r in rows) else 1)"
    expected: exit 0 (all three recs read back closed)
    fix_if: a rec stays open; read the trailer-closure job and close it through ops_data_portal once its acceptance passes on main
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a live warehouse read-back
