constraints:
  - No workflow, job, permission, secret, IAM, image or spend change; persona-verdict.yml is untouched, so this plan runs in parallel with rec-5551.
  - "The tool is read-only (Decision 84 I-3, Decision 284): findings_read and its existing verbs, the GitHub REST GET API and git show; no warehouse write, no new reader verb, no caller SQL."
  - The registration and records are read from origin/main, never the working tree; the read-back prints the registration's sha256 (Decision 221 cl.4).
  - The Actions lane counts only check runs from gates.verdict_app.app_id (Decision 271), as findings_read already filters.
  - gates.code_reviewer.verdict_source stays in_session; the Actions check stays advisory (CD.12, Decision 229 cl.4, Decision 264).
  - Records carry no finding text, title or summary; check_sketch is at most 200 characters.
  - No model id in docs/ROADMAP-PLATFORM.yaml (Decision 173; MODEL_ID test).
  - Every new module stays under 500 SLOC (Decision 128); split a module inside the package before crossing it.
  - No rescue agents or workaround loops (Decision 55); never loosen a test to get green (Decision 235).
