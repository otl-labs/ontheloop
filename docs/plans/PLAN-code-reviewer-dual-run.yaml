schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: code-reviewer-dual-run
intent: >-
  Pre-register the code_reviewer dual-run (T4.28 c5) in a machine-read contract and build the read-only comparison tool
  that pairs the advisory Actions code_reviewer verdict with an in-session code-review of the same clean pushed PR head,
  counts consecutive PRs on which the Actions lane misses no Critical or High finding the in-session lane reports, with
  typed skips, reset events, a run-to-run variance read and a window-validity rule, and lists every disagreement for an
  append-only disposition record that later mining for deterministic checks reads, so the flip plan (T4.28 c6) cites a
  read-back, not a judgement (NS.6).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-code-reviewer-dual-run.yaml
phase: >-
  T4.28 c5 (DUAL-RUN), first of three recs: this plan (rec-5710) lands the registration, the comparison tool, the
  trial's in-session head review and the c5 amendment; rec-5751 builds the seeded-defect bank; rec-5753 runs the
  uncounted calibration and locks N. c5 stays open: it flips only when the flip plan reads N consecutive counted PRs.
closes_criteria: []
cites: [dec:84, dec:117, dec:168, dec:173, dec:199, dec:205, dec:221, dec:224, dec:229, dec:234, dec:235, dec:247, dec:271, dec:284]
amends: []
introduces: []
scope:
  - file: docs/contracts/persona-dual-run.yaml
    action: Create
    purpose: >-
      Class D contract (Decision 168 envelope: id persona-dual-run, class D, contract_version 1, status draft, subject
      persona-dual-run, evaluator agent_surface .claude/commands/implement.md, Decision 168 basename rule) holding the pre-registration, one row under personas
      per verdict persona, code_reviewer only now. code_reviewer row: status calibrating (vocabulary calibrating,
      counting, closed); n null (rec-5753 sets an integer of at least 20 together with status counting); lanes
      {reference: in_session, candidate: actions}; pairing: a pair is one in-session code-review row with subject_dirty
      false whose subject_sha equals the head_sha of one Actions code_reviewer run from the verdict App (Decision 271),
      every paired head of a PR is judged and the PR is one counted unit that breaks if any of its paired heads breaks
      (CDR1-01: the trial fix loop ends on an in-session PROCEED, so judging only the last head could never break);
      a PR enters the count once merged or closed, in merge or close time order, and an open PR is pending; a PR
      counts only when all its paired heads follow counting_starts and the last reset, else it reads uncounted with
      uncounted_reason straddle (CDR2-01);
      blocking_severities [Critical, High]; nit_severities [Medium, Low];
      match_rule {same_file: true, line_tolerance: 5}; break_rule: the in-session verdict is REVISE and the Actions
      verdict on the same head is PROCEED (an in-session Critical or High the Actions lane missed or graded below High,
      with no Critical or High of its own); not_a_break: an Actions-only finding, an Actions REVISE on an in-session
      PROCEED, any nit, and a head where both lanes reach REVISE on different Critical or High findings
      (divergent_high); a head is a PR commit that has a persona-verdict workflow run, or the PR's last tip, never a
      non-tip commit (CDR3-02); skip_reasons [no_pair, actions_failure, in_session_failure, unstable, cancelled_by_push,
      pr_closed_before_verdict, advisory_disabled, not_routed, no_in_session_lane] (no_in_session_lane: a PR whose
      branch is not a claude/ session branch, or whose changed paths are confined to docs/audit-prompts/, the pairing
      rule as registered, CDR3-06; not_routed: the head's persona-verdict run concluded success with no code_reviewer
      route, which is no failure);
      mark precedence per PR (CDR3-04): pending while open; else uncounted (uncounted_reason calibrating,
      before_counting_starts, straddle or window_edge); else break if any paired head breaks; else skipped (the
      first head's skip_reason) when no head paired; else counted, its skipped heads listed per head;
      retry: a failed Actions run is replaced by a later run_ref on the same head when one already exists, else it is
      an actions_failure skip (nobody is asked to re-run; CDR2-07); ceilings {unpaired_share: 0.30, no_verdict_share:
      0.10, divergent_high_share: 0.20} over the heads of the window's code PRs other than no_in_session_lane PRs
      (unpaired_share counts no_pair and in_session_failure heads; no_verdict_share counts actions_failure,
      cancelled_by_push and pr_closed_before_verdict heads; unstable, advisory_disabled and not_routed heads count
      toward neither; divergent_high_share is divergent_high heads over paired heads; CDR3-05) (a PR is in the window
      when a persona-verdict workflow run on one of its heads was created inside it, as read_actions lists them by
      run-name, so a head with no code_reviewer run still counts toward the shares; CDR2-09, CDR3-07), above any of
      which the window is invalid; actions_only_revise_share (an Actions REVISE on
      an in-session PROCEED) is printed with no ceiling, for the flip plan and the operator (CDR1-08);
      validity_min_in_session_revise: 5 (same-code pairs, seeds included); variance {heads: 20, actions_attempts: 3,
      in_session_runs_on_seeds: 2, max_changed_heads: 1} (how a second Actions attempt is obtained is rec-5753's to
      settle before n is set, since route.py:255-302 skips code_reviewer on a head that already carries a verdict
      check; a row edit before n is set is not a reset; until then the read uses only the attempts that exist,
      CDR3-03); reset_sources (each a change restarts the count at the first
      counted pair after it): actions definition_sha256, actions served_model, in-session definition_sha256, in-session
      served_model, the code_reviewer selection that scripts/llm/tier_selection.resolve returns from
      docs/contracts/project-configuration.yaml and docs/contracts/inference-provider.yaml (litellm_persona_selection:
      thinking or effort), config/persona_image.yaml digest, scripts/persona_contracts/findings.py PROJECTION_VERSION,
      the sha256 of the "Dual-run head review (T4.28 c5 trial)" subsection of .claude/commands/implement.md (the
      reference arm's protocol, scout r2 SPIRIT 221), the git tree hash of scripts/personas/dual_run/ on origin/main
      (the judge's own code, CDR2-06), and this row itself after n is set; seed_key_sha256 null (rec-5751 fills it); counting_starts: heads whose
      Actions run was created after the main commit that first sets status counting; disposition schema (fields of
      the records below); records_epoch 0. amendment_log row 2026-11-28.
  - file: audits/dual-run/code_reviewer/.gitkeep
    action: Create
    purpose: >-
      Home of the disposition records (scout WARN 275: one record per file, outside docs/contracts, so no contract
      size cap and no list-tail conflict; Decision 176 precedent). A record is audits/dual-run/<persona>/<head_sha
      first 12>-<first 12 hex of sha256 of the subject>.yaml (subject: a finding id such as
      scripts/x.py:12:testing, a seed id, or verdict; the digest keeps '/' and ':' out of the name, CDR1-05) with
      fields persona,
      head_sha, change_id (on GitHub the PR number; Decision 234 cl.4 forge-neutral key), in_session_run_ref, actions_run_ref, subject, kind (break, divergent_high,
      actions_only_high, under_graded, unstable), erring_lane (actions_miss, actions_false_alarm, in_session_miss,
      in_session_false_alarm, both_defensible, unstable, subject_mismatch), cause_class (out_of_reach,
      severity_grading, repo_rule_knowledge, plan_conformance, test_gap, wrong_anchor), deterministic_candidate
      (bool), check_sketch (at most 200 characters, no finding text), disposed_on (date), registration_sha256. The
      build creates only the directory; records are written later, one per disagreement, never edited or deleted.
  - file: scripts/personas/dual_run/__init__.py
    action: Create
    purpose: >-
      Facade re-exporting the package's public surface (load_registration, pair_window, judge, count_window,
      load_records, read_back, main). Read-only: imports no writer, opens no file for writing, performs no network
      write.
  - file: scripts/personas/dual_run/__main__.py
    action: Create
    purpose: >-
      CLI: python -m scripts.personas.dual_run --persona code_reviewer --day-from D --day-to D [--profile P]. Lists
      the window's PRs from the persona-verdict runs that read_actions finds over D..D, then reads each such PR whole
      (CDR3-02): the Actions lane from the creation day of its earliest head's run and the in-session lane from two
      days before that, each through day_to, so earlier heads and sessions that began on an earlier UTC day still
      pair (CDR2-04); a PR whose read would exceed findings_read's 7-day window reads uncounted with uncounted_reason
      window_edge; the window's PRs and their changed paths through the GitHub REST API
      (GH_TOKEN, as findings_read does); the registration and records from origin/main (git show). Prints one JSON
      object with the keys registration_sha256, judge_tree_sha, persona, status, n, window, prs, resets, streak,
      validity, ceilings, actions_only_revise_share, variance, divergent_high and undisposed (disagreements with no
      record). prs lists every code PR (scripts/ci/push_scope.py confined_to_plans false) as
      {change_id (the PR number as a string), mark (counted, uncounted, pending, skipped or break), skip_reason (from
      skip_reasons, null unless skipped), uncounted_reason (calibrating, before_counting_starts, straddle or
      window_edge, null unless uncounted), heads: [{head_sha, actions_run_ref, in_session_run_ref, outcome}]} (CDR2-03). Exit 0 on
      success, 1 on a typed error line naming a class word only, never a body, token or value.
  - file: scripts/personas/dual_run/registration.py
    action: Create
    purpose: >-
      Pydantic model of docs/contracts/persona-dual-run.yaml (extra forbid; status counting requires an integer n of
      at least 20 and a 64-hex seed_key_sha256, else registration_invalid), loaded from origin/main by git show,
      never the working tree; sha256 of the exact bytes; the main commit that first set status counting and every
      later commit touching the row (git log over the file), for counting_starts and the row reset source; a shallow
      clone (git rev-parse --is-shallow-repository true) is the typed error shallow_clone, since it would silently
      truncate that history (CDR2-12).
  - file: scripts/personas/dual_run/pairing.py
    action: Create
    purpose: >-
      Builds every pair of each code PR from findings_read rows and the PR list (heads are the PR's commits that have
      a persona-verdict run, plus its last tip, from the PR's commits listing so a merged or closed PR keeps them;
      a non-tip commit with no run is never a head, CDR3-02): in-session rows with subject_dirty false and subject_sha equal to an
      Actions head of that PR, one pair per such head; a PR with none is a no_pair skip; a head whose Actions run was
      cancelled is cancelled_by_push, a head with no Actions run because the PR closed first is
      pr_closed_before_verdict, a head when gates.code_reviewer.advisory_runs (git show of
      docs/contracts/project-configuration.yaml at the main commit current when the head's persona-verdict run was
      created, parsed by the same rule as scripts/personas/route.advisory_state) read other than enabled is
      advisory_disabled, a head whose run concluded success with no code_reviewer route is not_routed, and a PR whose
      branch is not a claude/ session branch, or whose changed paths are confined to docs/audit-prompts/, is
      no_in_session_lane;
      a failed Actions run is replaced by a later run_ref on the same head when one exists, else an actions_failure
      skip; an
      in-session row whose parse_status is not parsed is an in_session_failure skip.
  - file: scripts/personas/dual_run/judge.py
    action: Create
    purpose: >-
      Pure judgement of one pair against the registration: matches findings by same file and line within the
      tolerance; returns agree, break or divergent_high plus the unmatched blocking findings of each lane and any
      under_graded match; nits never change the outcome. When both lanes reach REVISE, the head is agree only if every
      in-session Critical or High is matched by an Actions Critical or High, and any unmatched in-session blocking
      finding makes it divergent_high (CDR2-11).
  - file: scripts/personas/dual_run/count.py
    action: Create
    purpose: >-
      Pure count over judged PRs, not pairs (CDR2-01): a PR's outcome is break if any of its paired heads breaks,
      else agree (divergent_high heads included), and each merged or closed PR adds one, in merge or close time
      order; an open PR is pending and adds nothing; a PR with a paired head before counting_starts or before the
      last reset reads uncounted (straddle). The streak is the run of consecutive agreeing PRs since the last break
      or reset; resets come from row-field changes between consecutive pairs and from watched-source changes on main
      (git log plus git show of each reset source at each commit; the selection read through
      tier_selection.resolve with role primary, where a raise is the typed value selection_error and is itself a
      change, CDR2-08); nothing counts while status is not counting; window validity (in-session REVISE pairs,
      ceilings); variance (heads with more than one Actions attempt or in-session run whose verdicts differ, over
      max_changed_heads makes the count untrusted); undisposed disagreements.
  - file: scripts/personas/dual_run/records.py
    action: Create
    purpose: >-
      Pydantic model of one disposition record (extra forbid), the loader of audits/dual-run/<persona>/ from
      origin/main, the name rule (a file is named by its own head_sha prefix and subject), and tamper evidence: any
      main commit that modified or deleted a record (git log --diff-filter=MDR over the directory) is listed in the
      read-back as records_tampered and invalidates every window that ends at or after that commit's time, until
      the registration row's records_epoch is raised (a row edit, itself a reset event), after which only records
      written after the epoch commit are read (CDR1-14 recovery route); an unparseable record is listed as
      records_invalid and makes the window invalid.
  - file: tests/personas/test_dual_run.py
    action: Create
    purpose: >-
      Unit tests over fixture rows, PR lists and git-history stubs (no network, no warehouse): pairing, judgement,
      count (one per merged or closed PR, every paired head judged), resets, ceilings, validity, variance, the read-back shape, the n lock, the read-only import rule and the
      implement command's trial step.
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      evaluator_coverage row persona-dual-run.yaml {triggers: [the implement.md sentence that sends the session to
      docs/contracts/persona-dual-run.yaml#personas]}; one amendment_log row. No new validate check: the CI-RCA taxonomy
      sits at 494 of 500 lines with six unbuilt plans adding rows, so schema and append-only checks live in the tool
      and its tests instead.
  - file: scripts/persona_contracts/findings_read.py
    action: Modify
    purpose: >-
      rec-5743: read_in_session sets served_model on each in-session row from the child session's telemetry_observations
      model_call rows already present in the session tree rows (the last model_call's model, else null), through the
      existing session_tree_rows read; no new reader verb and no caller SQL (Decision 284). model_call rows, not
      telemetry_agents.model, because the agent row's model is written at the open event from the spawn request
      (telemetry_agents.yaml model populated_by), while a model_call row names the model that answered (CDR1-11).
  - file: tests/persona_contracts/test_findings_read.py
    action: Modify
    purpose: Adds test_in_session_rows_carry_the_served_model_of_their_model_calls (rec-5743 acceptance).
  - file: docs/contracts/telemetry_persona_findings.yaml
    action: Modify
    purpose: >-
      rec-5743 removes the in-session served_model NULL debt note and states the in-session rule in served_model's
      semantics (the model of the child session's last model_call row, NULL when it has none; scout r2 Decision 210),
      so the rule does not live only in the client, and adds telemetry_observations.model to served_model's
      derivation inputs (CDR1-11); one field-level amendment_log row {semantic_break: true, change_class:
      governance_note_add}, the rec-5742 precedent: projection_version stays 2 because findings.py's projection is
      untouched and v2 declared the in-session NULL as owned debt (rec-5743), so a v2 reader now sees the value
      (CDR2-10).
  - file: .claude/commands/implement.md
    action: Modify
    purpose: >-
      Step 7 gains a subsection "Dual-run head review (T4.28 c5 trial)": when docs/contracts/persona-dual-run.yaml on
      origin/main has the code_reviewer row at status calibrating or counting, after the PR head is pushed and before
      anything else is written, dispatch one more code-review subagent exactly as Step 5 does, unbriefed, on the clean
      pushed head (git status clean, HEAD equal to the pushed head); do not read the persona-verdict/code_reviewer
      check run or its wake comment before it returns; its Critical or High findings are fixed as Step 5's are (a new
      commit, the full tier again, a push, and a fresh head review of the new head); Medium and Low become recs as in
      Step 5. Before any further push or merge of that PR, read that head's persona-verdict runs once (mcp__github__actions_list
      on persona-verdict.yml, matched by the run-name's head sha, and that run's jobs) (CDR3-01): if no run is in
      progress, go ahead; if one is in progress and its persona run job has started, wait for that head's wake or
      fault comment, the same comment-wake reliance as the CI-green comment (docs/contracts/git-ops.yaml
      wake_signals), because the wake job's silent skips are all decided before a persona run job starts
      (scripts/personas/wake.py:145-175) and only cancellation, which this hold prevents, skips the wake job
      (persona-verdict.yml if !cancelled()); if it is in progress but no persona run job has started, read once more
      at the session's next wake of any kind and go ahead after that second read whatever it shows. A head lost
      this way reads as cancelled_by_push or pr_closed_before_verdict and counts toward no_verdict_share. Skip the
      read when gates.code_reviewer.advisory_runs on origin/main reads other than "enabled". No sleep, poll loop or
      timer is used; only then may the check's status be read, and its findings are never acted on while the row is not closed.
      Guards (CDR1-16): run git fetch origin main first; an unparseable file or an unknown status means no head review,
      and the session files a rec; a wake comment that arrives before the head review returns is ignored and never
      put in the subagent's prompt.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      T4.28 c5 gains one dated bracket "[Amendment 2026-11-28, PLAN-code-reviewer-dual-run: ...]" (operator sign-off
      2026-11-28): the pre-registration is docs/contracts/persona-dual-run.yaml, read from main, its sha256 in every
      read-back; a pair is the in-session review of the clean pushed head and the Actions run on that head; the count
      is of consecutive code PRs on which the Actions lane misses no Critical or High finding the in-session lane
      reports (break only when the in-session verdict is REVISE and the Actions verdict is PROCEED); Medium and Low are
      nits that never break; an Actions-only finding and a head where both lanes reach REVISE on different findings
      never break, the latter capped as a share of the window; N is fixed after an uncounted calibration (rec-5753)
      and before the first counted PR, and calibration runs never count; reset events add a change to the persona's
      litellm_persona_selection thinking or effort setting (rec-5072), the image digest, the projection version, the
      in-session skill's definition or model and an edit to the registration row after N is fixed; window validity
      counts in-session REVISE verdicts on same-code pairs, seeds (rec-5751) included; the dual-run starts, for c3's
      "rec-4434 before dual-run starts", at the first counted pair, and calibration pairs before it are uncounted
      measurement. No model id in the text
      (tests/roadmap/test_verdict_persona_criteria.py MODEL_ID).
  - file: tests/roadmap/test_verdict_persona_criteria.py
    action: Modify
    purpose: Adds test_t4_28_c5_names_the_dual_run_registration (the new bracket's phrases, including litellm_persona_selection and thinking or effort).
  - file: docs/contracts/project-configuration.yaml
    action: Modify
    purpose: >-
      gates.code_reviewer.advisory_runs readers gains scripts/personas/dual_run/pairing.py (it reads the row's history
      for the advisory_disabled skip, CDR2-13), with one amendment_log row; no value, default or enforcement change.
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      Appends to boundary_patterns docs/contracts/persona-dual-run.yaml, audits/dual-run/, and the grader's one-hop
      imports outside it (CDR2-05, Decision 221 cl.2, Decision 235 cl.4): scripts/session/merge_checks.py (which Actions
      runs count), scripts/ci/push_scope.py (which PRs count), scripts/llm/tier_selection.py (a reset source),
      scripts/telemetry_verify/rows.py, scripts/telemetry_capture/read_route.py and scripts/telemetry_content.py (the
      in-session lane's rows). scripts/personas/ and tests/personas/ already cover the package, its test and
      route.py, and scripts/persona_contracts/ covers findings_read and findings (capabilities.yaml, CDR1-07). Deeper
      hops (src/common reader client, ops portal, check registry) stay outside: they are repo-wide transport and
      infrastructure, and listing them would bar the loop from the whole data layer. The loop cannot edit its own
      grader (scout NOTE NS.6); appending only tightens and is exempt in approval-routing.yaml.
  - file: tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py
    action: Modify
    purpose: >-
      Adds test_dual_run_grader_paths_are_boundary_paths, which derives its path set by an ast walk of the
      repo-local imports (module- and function-level) of every scripts/personas/dual_run/ module and of
      scripts/persona_contracts/findings_read.py and findings.py, plus the registration and records paths, and asserts
      each is covered by boundary_patterns, so a new grader import fails it (CDR2-05).
bundled_recommendations: [rec-5710, rec-5072, rec-5743]
followon_recs: []
infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition: compute_affected_artifacts(<this
    plan's scope>) returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']} because the roadmap is a packaged asset of
    the active data-pipeline artifact. This plan runs no build, deploy or smoke test: the edit is exit-criterion
    bracket text with no packaged code, and the asset refreshes at the next deploy a watched path starts; nothing is
    deployed by hand. Precedent: PLAN-loop-candidate-decisions, PLAN-verdict-persona-roadmap-regrounding (CDR1-06).
acceptance_criteria:
  - tests/personas/test_dual_run.py::test_agreement_count_restarts_on_definition_or_model_change passes (rec-5710 acceptance).
  - tests/persona_contracts/test_findings_read.py::test_in_session_rows_carry_the_served_model_of_their_model_calls passes (rec-5743 acceptance).
  - "rec-5072's acceptance holds: docs/ROADMAP-PLATFORM.yaml names litellm_persona_selection and thinking or effort in T4.28 c5's new bracket."
  - The count breaks only on an in-session REVISE paired with an Actions PROCEED on the same head; nits, Actions-only findings and divergent_high heads never break it.
  - Nothing counts while the registration row is calibrating; the read-back prints the registration sha256 of origin/main and lists every code PR in the window as counted, uncounted, skipped with a reason, or break.
  - A PR whose first paired head breaks and whose last paired head agrees reads as a break.
  - "This plan's own build PR is the first live pair: the build session runs the trial head review by hand on its clean pushed head before merge, and after merge the read-back over the merge day reads that PR as uncounted with at least one paired head; only an actions_failure or in_session_failure skip with its failing run_ref is an accepted gap, and no_pair fails."
  - A PR with three agreeing paired heads adds one to the streak, and an open PR is pending.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The new and changed nodes pass.
    command: >-
      bin/venv-python -m pytest
      tests/personas/test_dual_run.py::test_agreement_count_restarts_on_definition_or_model_change
      tests/personas/test_dual_run.py::test_count_breaks_only_when_actions_proceeds_on_an_in_session_revise
      tests/personas/test_dual_run.py::test_nits_and_actions_only_findings_never_break
      tests/personas/test_dual_run.py::test_both_revise_on_different_highs_is_divergent_high_not_a_break
      tests/personas/test_dual_run.py::test_a_pr_whose_first_paired_head_breaks_reads_as_a_break
      tests/personas/test_dual_run.py::test_a_pr_with_three_agreeing_heads_adds_one_to_the_streak
      tests/personas/test_dual_run.py::test_a_pr_with_a_head_before_day_from_is_read_whole_or_uncounted
      tests/personas/test_dual_run.py::test_pairs_need_a_clean_in_session_review_of_the_same_head
      tests/personas/test_dual_run.py::test_skips_are_typed_and_ceilings_invalidate_the_window
      tests/personas/test_dual_run.py::test_registration_counts_only_after_n_lock
      tests/personas/test_dual_run.py::test_watched_source_changes_on_main_reset_the_count
      tests/personas/test_dual_run.py::test_window_validity_needs_the_minimum_in_session_revise_pairs
      tests/personas/test_dual_run.py::test_run_to_run_variance_flags_heads_whose_verdict_changed
      tests/personas/test_dual_run.py::test_read_back_lists_every_code_pr_and_prints_the_registration_digest
      tests/personas/test_dual_run.py::test_tool_imports_no_writer_and_writes_nothing
      tests/personas/test_dual_run.py::test_implement_command_dispatches_the_trial_head_review
      tests/personas/test_dual_run.py::test_registration_schema_refuses_counting_without_n_and_seed_key
      tests/personas/test_dual_run.py::test_modified_or_deleted_records_invalidate_the_window
      tests/personas/test_dual_run.py::test_committed_registration_and_records_parse
      tests/persona_contracts/test_findings_read.py::test_in_session_rows_carry_the_served_model_of_their_model_calls
      tests/roadmap/test_verdict_persona_criteria.py::test_t4_28_c5_names_the_dual_run_registration
      tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py::test_dual_run_grader_paths_are_boundary_paths
      -q
    expected: exit 0, every node passes
    fix_if: a node fails or is missing; fix the module or create the node, never the assertion
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: code-reviewer-dual-run-units
  - step: 2
    phase: pre-deploy
    action: The whole touched test files and the neighbouring persona and roadmap suites pass.
    command: >-
      bin/venv-python -m pytest tests/personas/test_dual_run.py tests/checks/contracts/test__population.py tests/checks/contracts/test__evaluator_coverage.py tests/checks/contracts/validate_contract_drift tests/persona_contracts tests/personas/test_findings_record.py
      tests/telemetry/test_persona_findings.py tests/roadmap/test_verdict_persona_criteria.py
