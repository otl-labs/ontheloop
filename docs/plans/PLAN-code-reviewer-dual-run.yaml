schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: code-reviewer-dual-run
intent: >-
  Pre-register the code_reviewer dual-run (T4.28 c5) in a machine-read contract and build the read-only comparison tool
  that pairs the advisory Actions code_reviewer verdict with an in-session code-review of the same clean pushed PR head,
  counts consecutive PRs on which the Actions lane misses no Critical or High finding the in-session lane reports, with
  typed skips, reset events, a run-to-run variance read and a window-validity rule, and lists every disagreement for an
  append-only disposition record that later mining for deterministic checks reads, so the flip plan (T4.28 c6) cites a
  read-back, not a judgement (NS.6).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-code-reviewer-dual-run.yaml
phase: >-
  T4.28 c5 (DUAL-RUN), first of three recs: this plan (rec-5710) lands the registration, the comparison tool, the
  trial's in-session head review and the c5 amendment; rec-5751 builds the seeded-defect bank; rec-5753 runs the
  uncounted calibration and locks N. c5 stays open: it flips only when the flip plan reads N consecutive counted PRs.
closes_criteria: []
cites: [dec:84, dec:117, dec:168, dec:173, dec:199, dec:205, dec:221, dec:224, dec:229, dec:235, dec:247, dec:271]
amends: []
introduces: []
scope:
  - file: docs/contracts/persona-dual-run.yaml
    action: Create
    purpose: >-
      Class D contract (Decision 168 envelope: id persona-dual-run, class D, contract_version 1, status draft, subject
      persona-dual-run, evaluator agent_surface .claude/commands/implement.md, Decision 168 basename rule) holding the pre-registration, one row under personas
      per verdict persona, code_reviewer only now. code_reviewer row: status calibrating (vocabulary calibrating,
      counting, closed); n null (rec-5753 sets an integer of at least 20 together with status counting); lanes
      {reference: in_session, candidate: actions}; pairing: a pair is one in-session code-review row with subject_dirty
      false whose subject_sha equals the head_sha of one Actions code_reviewer run from the verdict App (Decision 271),
      one pair per PR, the PR's latest paired head; blocking_severities [Critical, High]; nit_severities [Medium, Low];
      match_rule {same_file: true, line_tolerance: 5}; break_rule: the in-session verdict is REVISE and the Actions
      verdict on the same head is PROCEED (an in-session Critical or High the Actions lane missed or graded below High,
      with no Critical or High of its own); not_a_break: an Actions-only finding, an Actions REVISE on an in-session
      PROCEED, any nit, and a head where both lanes reach REVISE on different Critical or High findings
      (divergent_high); skip_reasons [no_pair, actions_failure, in_session_failure, unstable, superseded_head];
      retry: one re-run of a failed Actions run before it is a skip; ceilings {unpaired_share: 0.30, no_verdict_share:
      0.10, divergent_high_share: 0.20} over the window's code PRs, above any of which the window is invalid;
      validity_min_in_session_revise: 5 (same-code pairs, seeds included); variance {heads: 20, actions_attempts: 3,
      in_session_runs_on_seeds: 2, max_changed_heads: 1}; reset_sources (each a change restarts the count at the first
      counted pair after it): actions definition_sha256, actions served_model, in-session definition_sha256, in-session
      served_model, the code_reviewer selection that scripts/llm/tier_selection.resolve returns from
      docs/contracts/project-configuration.yaml and docs/contracts/inference-provider.yaml (litellm_persona_selection:
      thinking or effort), config/persona_image.yaml digest, scripts/persona_contracts/findings.py PROJECTION_VERSION,
      the sha256 of the "Dual-run head review (T4.28 c5 trial)" subsection of .claude/commands/implement.md (the
      reference arm's protocol, scout r2 SPIRIT 221), and this row itself after n is set; seed_key_sha256 null (rec-5751 fills it); counting_starts: heads whose
      Actions run was created after the main commit that first sets status counting; disposition schema (fields of
      the records below). amendment_log row 2026-11-28.
  - file: audits/dual-run/code_reviewer/.gitkeep
    action: Create
    purpose: >-
      Home of the disposition records (scout WARN 275: one record per file, outside docs/contracts, so no contract
      size cap and no list-tail conflict; Decision 176 precedent). A record is audits/dual-run/<persona>/<head_sha
      first 12>-<subject>.yaml (subject: a finding id with ':' as '_', a seed id, or verdict) with fields persona,
      head_sha, change_id (on GitHub the PR number; Decision 234 cl.4 forge-neutral key), in_session_run_ref, actions_run_ref, subject, kind (break, divergent_high,
      actions_only_high, under_graded, unstable), erring_lane (actions_miss, actions_false_alarm, in_session_miss,
      in_session_false_alarm, both_defensible, unstable, subject_mismatch), cause_class (out_of_reach,
      severity_grading, repo_rule_knowledge, plan_conformance, test_gap, wrong_anchor), deterministic_candidate
      (bool), check_sketch (at most 200 characters, no finding text), disposed_on (date), registration_sha256. The
      build creates only the directory; records are written later, one per disagreement, never edited or deleted.
  - file: scripts/personas/dual_run/__init__.py
    action: Create
    purpose: >-
      Facade re-exporting the package's public surface (load_registration, pair_window, judge, count_window,
      load_records, read_back, main). Read-only: imports no writer, opens no file for writing, performs no network
      write.
  - file: scripts/personas/dual_run/__main__.py
    action: Create
    purpose: >-
      CLI: python -m scripts.personas.dual_run --persona code_reviewer --day-from D --day-to D [--profile P]. Reads
      both lanes through scripts.persona_contracts.findings_read (read_in_session, read_actions), the window's PRs and
      their changed paths through the GitHub REST API (GH_TOKEN, as findings_read does), the registration and records
      from origin/main (git show), and prints one JSON object: registration_sha256, persona, status, n, window, and
      per code PR (scripts/ci/push_scope.py confined_to_plans false) one entry keyed change_id (the PR number as a string) marked counted, skipped (reason) or break, then
      resets, streak, validity, ceilings, variance, divergent_high and undisposed (disagreements with no record). Exit
      0 on success, 1 on a typed error line naming a class word only, never a body, token or value.
  - file: scripts/personas/dual_run/registration.py
    action: Create
    purpose: >-
      Pydantic model of docs/contracts/persona-dual-run.yaml (extra forbid; status counting requires an integer n of
      at least 20 and a 64-hex seed_key_sha256, else registration_invalid), loaded from origin/main by git show,
      never the working tree; sha256 of the exact bytes; the main commit that first set status counting and every
      later commit touching the row (git log over the file), for counting_starts and the row reset source.
  - file: scripts/personas/dual_run/pairing.py
    action: Create
    purpose: >-
      Builds one pair per code PR from findings_read rows and the PR list: in-session rows with subject_dirty false
      and subject_sha equal to an Actions head of that PR; the latest such head wins; a PR with none is a no_pair skip;
      a failed Actions run is retried once (a later run_ref on the same head counts) before an actions_failure skip; an
      in-session row whose parse_status is not parsed is an in_session_failure skip.
  - file: scripts/personas/dual_run/judge.py
    action: Create
    purpose: >-
      Pure judgement of one pair against the registration: matches findings by same file and line within the
      tolerance; returns agree, break or divergent_high plus the unmatched blocking findings of each lane and any
      under_graded match; nits never change the outcome.
  - file: scripts/personas/dual_run/count.py
    action: Create
    purpose: >-
      Pure count over judged pairs in Actions run time order: the streak of consecutive agree or divergent_high pairs
      since the last break or reset; resets from row-field changes between consecutive pairs and from watched-source
      changes on main (git log plus git show of each reset source at each commit, the selection read through
      tier_selection.resolve); nothing counts while status is not counting or before counting_starts; window validity
      (in-session REVISE pairs, ceilings); variance (heads with more than one Actions attempt or in-session run whose
      verdicts differ, over max_changed_heads makes the count untrusted); undisposed disagreements.
  - file: scripts/personas/dual_run/records.py
    action: Create
    purpose: >-
      Pydantic model of one disposition record (extra forbid), the loader of audits/dual-run/<persona>/ from
      origin/main, the name rule (a file is named by its own head_sha prefix and subject), and tamper evidence: any
      main commit that modified or deleted a record (git log --diff-filter=MDR over the directory) is listed in the
      read-back as records_tampered and makes the window invalid; an unparseable record is listed as
      records_invalid and makes the window invalid.
  - file: tests/personas/test_dual_run.py
    action: Create
    purpose: >-
      Unit tests over fixture rows, PR lists and git-history stubs (no network, no warehouse): pairing, judgement,
      count, resets, ceilings, validity, variance, the read-back shape, the n lock, the read-only import rule and the
      implement command's trial step.
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      evaluator_coverage row persona-dual-run.yaml {triggers: [the implement.md sentence that sends the session to
      docs/contracts/persona-dual-run.yaml#personas]}; one amendment_log row. No new validate check: the CI-RCA taxonomy
      sits at 494 of 500 lines with six unbuilt plans adding rows, so schema and append-only checks live in the tool
      and its tests instead.
  - file: scripts/persona_contracts/findings_read.py
    action: Modify
    purpose: >-
      rec-5743: read_in_session sets served_model on each in-session row from the child session's telemetry_observations
      model_call rows already present in the session tree rows (the last model_call's model, else null), through the
      existing session_tree_rows read; no new reader verb and no caller SQL (Decision 284).
  - file: tests/persona_contracts/test_findings_read.py
    action: Modify
    purpose: Adds test_in_session_rows_carry_the_served_model_of_their_model_calls (rec-5743 acceptance).
  - file: docs/contracts/telemetry_persona_findings.yaml
    action: Modify
    purpose: >-
      rec-5743 removes the in-session served_model NULL debt note and states the in-session rule in served_model's
      semantics (the model of the child session's last model_call row, NULL when it has none; scout r2 Decision 210),
      so the rule does not live only in the client; one amendment_log row.
  - file: .claude/commands/implement.md
    action: Modify
    purpose: >-
      Step 7 gains a subsection "Dual-run head review (T4.28 c5 trial)": when docs/contracts/persona-dual-run.yaml on
      origin/main has the code_reviewer row at status calibrating or counting, after the PR head is pushed and before
      anything else is written, dispatch one more code-review subagent exactly as Step 5 does, unbriefed, on the clean
      pushed head (git status clean, HEAD equal to the pushed head); do not read the persona-verdict/code_reviewer
      check run or its wake comment before it returns; its Critical or High findings are fixed as Step 5's are (a new
      commit, the full tier again, a push, and a fresh head review of the new head); Medium and Low become recs as in
      Step 5. Only the in-session lane's findings are acted on while that row is not closed.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      T4.28 c5 gains one dated bracket "[Amendment 2026-11-28, PLAN-code-reviewer-dual-run: ...]" (operator sign-off
      2026-11-28): the pre-registration is docs/contracts/persona-dual-run.yaml, read from main, its sha256 in every
      read-back; a pair is the in-session review of the clean pushed head and the Actions run on that head; the count
      is of consecutive code PRs on which the Actions lane misses no Critical or High finding the in-session lane
      reports (break only when the in-session verdict is REVISE and the Actions verdict is PROCEED); Medium and Low are
      nits that never break; an Actions-only finding and a head where both lanes reach REVISE on different findings
      never break, the latter capped as a share of the window; N is fixed after an uncounted calibration (rec-5753)
      and before the first counted PR, and calibration runs never count; reset events add a change to the persona's
      litellm_persona_selection thinking or effort setting (rec-5072), the image digest, the projection version, the
      in-session skill's definition or model and an edit to the registration row after N is fixed; window validity
      counts in-session REVISE verdicts on same-code pairs, seeds (rec-5751) included; the dual-run starts, for c3's
      "rec-4434 before dual-run starts", at the first counted pair, and calibration pairs before it are uncounted
      measurement. No model id in the text
      (tests/roadmap/test_verdict_persona_criteria.py MODEL_ID).
  - file: tests/roadmap/test_verdict_persona_criteria.py
    action: Modify
    purpose: Adds test_t4_28_c5_names_the_dual_run_registration (the new bracket's phrases, including litellm_persona_selection and thinking or effort).
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      Appends scripts/personas/dual_run/, docs/contracts/persona-dual-run.yaml, audits/dual-run/ and
      tests/personas/test_dual_run.py to boundary_patterns (scout NOTE NS.6: the loop cannot edit
      its own grader; appending only tightens and is exempt in approval-routing.yaml).
  - file: tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py
    action: Modify
    purpose: Adds test_dual_run_grader_paths_are_boundary_paths.
bundled_recommendations: [rec-5072, rec-5743]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - tests/personas/test_dual_run.py::test_agreement_count_restarts_on_definition_or_model_change passes (rec-5710 acceptance).
  - tests/persona_contracts/test_findings_read.py::test_in_session_rows_carry_the_served_model_of_their_model_calls passes (rec-5743 acceptance).
  - "rec-5072's acceptance holds: docs/ROADMAP-PLATFORM.yaml names litellm_persona_selection and thinking or effort in T4.28 c5's new bracket."
  - The count breaks only on an in-session REVISE paired with an Actions PROCEED on the same head; nits, Actions-only findings and divergent_high heads never break it.
  - Nothing counts while the registration row is calibrating; the read-back prints the registration sha256 of origin/main and lists every code PR in the window as counted, skipped with a reason, or break.
  - After merge, the first build PR whose session ran the trial head review appears in the live read-back as a pair (or as a typed skip naming why).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The new and changed nodes pass.
    command: >-
      bin/venv-python -m pytest
      tests/personas/test_dual_run.py::test_agreement_count_restarts_on_definition_or_model_change
      tests/personas/test_dual_run.py::test_count_breaks_only_when_actions_proceeds_on_an_in_session_revise
      tests/personas/test_dual_run.py::test_nits_and_actions_only_findings_never_break
      tests/personas/test_dual_run.py::test_both_revise_on_different_highs_is_divergent_high_not_a_break
      tests/personas/test_dual_run.py::test_pairs_need_a_clean_in_session_review_of_the_same_head
      tests/personas/test_dual_run.py::test_skips_are_typed_and_ceilings_invalidate_the_window
      tests/personas/test_dual_run.py::test_registration_counts_only_after_n_lock
      tests/personas/test_dual_run.py::test_watched_source_changes_on_main_reset_the_count
      tests/personas/test_dual_run.py::test_window_validity_needs_the_minimum_in_session_revise_pairs
      tests/personas/test_dual_run.py::test_run_to_run_variance_flags_heads_whose_verdict_changed
      tests/personas/test_dual_run.py::test_read_back_lists_every_code_pr_and_prints_the_registration_digest
      tests/personas/test_dual_run.py::test_tool_imports_no_writer_and_writes_nothing
      tests/personas/test_dual_run.py::test_implement_command_dispatches_the_trial_head_review
      tests/personas/test_dual_run.py::test_registration_schema_refuses_counting_without_n_and_seed_key
      tests/personas/test_dual_run.py::test_modified_or_deleted_records_invalidate_the_window
      tests/personas/test_dual_run.py::test_committed_registration_and_records_parse
      tests/persona_contracts/test_findings_read.py::test_in_session_rows_carry_the_served_model_of_their_model_calls
      tests/roadmap/test_verdict_persona_criteria.py::test_t4_28_c5_names_the_dual_run_registration
      tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py::test_dual_run_grader_paths_are_boundary_paths
      -q
    expected: exit 0, every node passes
    fix_if: a node fails or is missing; fix the module or create the node, never the assertion
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: code-reviewer-dual-run-units
  - step: 2
    phase: pre-deploy
    action: The whole touched test files and the neighbouring persona and roadmap suites pass.
    command: >-
      bin/venv-python -m pytest tests/personas/test_dual_run.py tests/checks/contracts/test__population.py tests/checks/contracts/test__evaluator_coverage.py tests/checks/contracts/validate_contract_drift tests/persona_contracts tests/personas/test_findings_record.py
      tests/telemetry/test_persona_findings.py tests/roadmap/test_verdict_persona_criteria.py
      tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py -q
    expected: exit 0, no failures
    fix_if: a node fails; fix the code, never the assertion
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a regression sweep over existing suites, already run by CI's own selection
  - step: 3
    phase: pre-deploy
    action: Live in-session read over a past window carries served models (rec-5743; read-only, agent_platform profile).
    command: >-
      bin/venv-python -m scripts.persona_contracts.findings_read --day-from 2026-11-25 --day-to 2026-11-25 --lane in_session
      | grep '"lane": "in_session"' | grep -vc '"served_model": null'
    expected: a count of at least 1 (an in-session row whose served_model is filled)
    fix_if: zero rows with a model; fix the model_call join against the live rows; an unreachable reader is a STOP
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a live read of production telemetry, not a repository property
  - step: 4
    phase: pre-deploy
    action: Live read-back over the last two days while the row is calibrating counts nothing and lists the window's code PRs.
    command: >-
      bin/venv-python -m scripts.personas.dual_run --persona code_reviewer --day-from 2026-11-27 --day-to 2026-11-28
      > /tmp/dual_run.json && grep -c '"status": "calibrating"' /tmp/dual_run.json && grep -c '"streak": 0' /tmp/dual_run.json
      && grep -c '"registration_sha256": "' /tmp/dual_run.json
    expected: three counts of 1; the branch's registration is not yet on origin/main, so run it after rebasing on a main that carries it or read the error line registration_missing as the expected pre-merge result and repeat at step 6
    fix_if: a count of 0 with the registration on main; fix the read-back
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a live read of GitHub and production telemetry
  - step: 5
    phase: pre-deploy
    action: The full tier passes on the committed tree (handoff_policy).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0 and a verified head
    fix_if: a failure; fix forward on the branch, never skip a check
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: After merge the read-back reads the registration from main and its digest equals the merged file's sha256.
    command: >-
      git fetch origin main && bin/venv-python -m scripts.personas.dual_run --persona code_reviewer --day-from <merge_day>
      --day-to <merge_day> | grep -c "\"registration_sha256\": \"$(git show origin/main:docs/contracts/persona-dual-run.yaml | sha256sum | cut -d' ' -f1)\""
    expected: a count of 1
    fix_if: 0; the tool read the working tree or hashed other bytes; fix forward on a new branch
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a live post-merge observation
  - step: 7
    phase: post-deploy
    action: >-
      Live pairing: on the first build PR merged after this plan whose session ran the trial head review, the
      read-back lists that PR as counted-eligible pair or a typed skip (status is calibrating, so nothing counts).
    command: >-
      bin/venv-python -m scripts.personas.dual_run --persona code_reviewer --day-from <pr_day> --day-to <pr_day_plus_1>
      | grep -c '"change_id": "<pr_number>"'
    expected: a count of at least 1, its entry paired or skipped with a reason from skip_reasons
    fix_if: the PR is absent; fix the PR listing or the code-PR classifier forward on a new branch
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a live post-merge observation of a later PR
  - step: 8
    phase: post-deploy
    action: The bundled recs and the primary rec read back closed after the squash merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; rows = list(c.make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5710,rec-5072,rec-5743'));
      raise SystemExit(0 if len(rows) == 3 and all(r['status'] == 'closed' for r in rows) else 1)"
    expected: exit 0 (all three recs read back closed)
    fix_if: a rec stays open; read the trailer-closure job and close it through ops_data_portal once its acceptance passes on main
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a live warehouse read-back
