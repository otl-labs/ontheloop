schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: code-reviewer-input-provider
intent: 'Give the verdict chain an input provider for code_reviewer (rec-5696): materialise builds all 14 fields of docs/contracts/personas/code_reviewer.yaml''s
  input_schema from a pull request, reading the head snapshot only as data (parsed, never imported or executed) and every rule
  text from main''s checkout, so the later run-job unit can open the keyed run to code_reviewer without new input work. Hermetic:
  no key, no model call, no routing change.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-code-reviewer-input-provider.yaml
phase: 'T4.28 (code_reviewer persona) c4 ADD, unit 1 of the split (input provider). No exit criterion closes: c4 closes with the
  run-job unit.'
closes_criteria: []
cites:
- dec:229
- dec:205
amends: []
introduces: []
scope:
- file: scripts/personas/review_input.py
  action: Create
  purpose: 'The code_reviewer provider, registered in materialise.PROVIDERS. Pure: no network, no GITHUB_TOKEN. Lives in the shell
    package scripts/personas/, outside persona_image.yaml build.copy, so validate_persona_github_agnosticism does not scan it (Decision
    205 cl.2). Its GitHub-shaped inputs come from one shell-prepared file, prepared/review-context.json, whose shape this module
    owns (the run-job step rec-5708 adds the fetch verb and workflow step that write it): {merge_base_sha, truncated: bool, files:
    [{filename, status, previous_filename?}], diff, merge_base_texts: {path: text} (the merge-base text of each changed or removed
    .py under tests/, scripts/ or src/, and of a renamed file''s previous_filename), check_runs: [{name, status, conclusion, summary,
    app_id, app_slug}], comments: [{body, author_association}], head_ref}. A missing or malformed file, or truncated true, raises
    Unusable(input_incomplete). Fields beyond the shared three: change_files (one ''status path'' line per file) and diff; review_scope
    (JSON: changed files, the plan''s scope files and their one-level src imports found by ast-parsing the snapshot copy, each
    with why; plan path = ctx plan_paths, else find_plan''s agent/<slug> rule applied to head_ref, else none); review_scope_files
    (each review_scope file, the documents changed files reference by path, meaning repo-relative path tokens in a changed file
    that exist in the snapshot, and pyproject.toml, requirements*.txt and .github/workflows/*, read from the snapshot after a header
    line naming the path); project_context (docs/PROJECT_CONTEXT.md at base_root); review_exemptions (the ''## Code Review Exemptions''
    section of docs/DECISIONS_ARCHIVE.md at base_root, up to the next ''## '' header, or empty); review_dispositions (implement-scope-boundary.yaml
    review_dispositions at base_root); weakening_candidates (validate_weakening_candidates.find_candidates with read_base from
    merge_base_texts, never main''s tip, and read_head from the snapshot; statuses map added->A, modified/changed->M, removed->D,
    renamed and copied->D of previous_filename plus A of filename, as the module''s own --no-renames read does; rendered in _print_report''s
    line format, or the single line ''no weakening candidates'' so the minLength-1 field is never empty); ci_results (JSON {state:
    completed|incomplete|absent, checks: [{name, status, conclusion, summary, app_slug}]}: a run is dropped when its name starts
    with ''persona-verdict/'' or its app_id equals merge_checks.verdict_app_id read from base_root''s project-configuration.yaml
    (Decision 271 cl.1-2); when that read returns None or a reason string, drop by name only and add one ''verdict_app_id unavailable:
    <reason>'' note to the field; each kept check carries its app_slug so a non-CI source is visible); change_evidence (resolution[''body''],
    which carries resolve_pr''s oversize cap, then each comment with author_association, as quoted data); review_guidance (deploy-paths.yaml
    admin_out_of_band and tests/CLAUDE.md''s Mock exhaustion and Test-count coupling sections, at base_root). Never imports, installs
    or executes a head file.'
- file: scripts/personas/materialise.py
  action: Modify
  purpose: Register the provider in PROVIDERS; extend the provider ctx with plan_paths and base_root (build_input already holds
    both) so main-side reads go through base_root, never execute.ROOT or routes.json directly; print one 'PERSONA-VERDICT input
    <route> bytes=N' line per materialised input (the size rec-5708's per-PR handling reads).
- file: tests/personas/test_review_input.py
  action: Create
  purpose: 'Mirror test, each node through materialise.build_input(..., ''code_reviewer'', ...) with a synthetic base_root. test_code_reviewer_input_validates_against_contract
    (rec-5696 acceptance): the input validates against code_reviewer''s input_schema with every minLength-1 field non-empty. test_head_code_never_executes:
    .py files generated in tmp_path that write a marker on import or execution leave no marker. test_ci_results_states: completed,
    incomplete and absent sets; a run carrying the verdict App id dropped; a ''persona-verdict/code_reviewer'' run from another
    app dropped; a None and a reason-string app id each drop by name and carry the note; kept checks carry app_slug. test_weakening_reads_the_merge_base:
    a test file changed on main but not in the PR reports nothing; a renamed and weakened test reports a candidate; no candidates
    renders the single line. test_untrusted_text_is_data: a PR body carrying prompt-like text appears only inside change_evidence.
    test_missing_or_truncated_context_is_input_incomplete. test_review_exemptions_reads_the_archive: the real docs/DECISIONS_ARCHIVE.md
    at the repo root yields a non-empty section starting ''## Code Review Exemptions''. test_plan_falls_back_to_head_ref: no plan_paths
    and head_ref agent/<slug> with that plan in the snapshot fills plan.'
- file: tests/fixtures/persona_verdict/review_input/
  action: Create
  purpose: Synthetic head snapshot (one plan, one src module with an import, one test) and review-context.json variants (no executable-on-import
    module is committed; those are generated in tmp_path).
