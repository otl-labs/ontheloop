schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: code-reviewer-input-provider
intent: 'Give the verdict chain an input provider for code_reviewer (rec-5696): materialise builds all 14 fields of docs/contracts/personas/code_reviewer.yaml''s
  input_schema from a pull request, reading the head snapshot only as data (parsed, never imported or executed) and every rule
  text from main''s checkout, so the later run-job unit can open the keyed run to code_reviewer without new input work. Hermetic:
  no key, no model call, no routing change.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-code-reviewer-input-provider.yaml
phase: 'T4.28 (code_reviewer persona) c4 ADD, unit 1 of the split (input provider). No exit criterion closes: c4 closes with the
  run-job unit.'
closes_criteria: []
cites:
- dec:229
- dec:205
amends: []
introduces: []
scope:
- file: scripts/personas/review_input.py
  action: Create
  purpose: 'The code_reviewer provider, registered in materialise.PROVIDERS; pure (no network, no GITHUB_TOKEN): its GitHub-shaped
    inputs come from one shell-prepared file, prepared/review-context.json ({compare: {files, diff}, check_runs: [{name, status,
    conclusion, summary, app_id}], pr: {body, comments: [{body, author_association}]}}), whose shape this module owns and whose
    fetch verb and workflow step are the run-job unit''s. Fields beyond the shared three: change_files and diff (from compare);
    review_scope (JSON: changed files, the plan''s scope files and their one-level src imports found by ast-parsing the snapshot
    copy, each with why, and the plan path route.py found (routes.json plan_paths), since find_plan''s git read has no branch in
    the prepare job); review_scope_files (each review_scope file, the documents changed files reference by path, and pyproject.toml,
    requirements files and .github/workflows/*, read from the snapshot after a header line naming the path); project_context (docs/PROJECT_CONTEXT.md
    at main); review_exemptions (the Code Review Exemptions section of main''s DECISIONS.md, or empty); review_dispositions (implement-scope-boundary.yaml
    review_dispositions at main); weakening_candidates (main''s validate_weakening_candidates.find_candidates, read_base from main''s
    checkout, read_head from the snapshot); ci_results (JSON {state: completed|incomplete|absent, checks: [{name, status, conclusion,
    summary}]}, dropping every check run whose app_id equals main''s gates.verdict_app.app_id, Decision 271 cl.1, so the reviewer
    never reads its own or a sibling persona''s check); change_evidence (PR body and comments with author_association, as data);
    review_guidance (deploy-paths.yaml admin_out_of_band and tests/CLAUDE.md''s Mock exhaustion and Test-count coupling sections,
    at main). A missing or malformed review-context.json raises Unusable(input_incomplete). Never imports, installs or executes
    a head file. Lives in the shell package scripts/personas/, outside persona_image.yaml build.copy, so validate_persona_github_agnosticism
    does not scan it (Decision 205 cl.2).'
- file: scripts/personas/materialise.py
  action: Modify
  purpose: Register the provider in PROVIDERS and print one 'PERSONA-VERDICT input <route> bytes=N' line per materialised input,
    the size the run-job unit's per-PR bound reads.
- file: tests/personas/test_review_input.py
  action: Create
  purpose: 'Mirror test. test_code_reviewer_input_validates_against_contract (rec-5696 acceptance): a synthetic snapshot and review-context.json
    yield an input that validates against code_reviewer''s input_schema with every minLength-1 field non-empty. test_head_code_never_executes:
    snapshot files that would write a marker on import or execution leave no marker. test_ci_results_states: completed, incomplete
    and absent sets, and a check run carrying the verdict App id dropped. test_untrusted_text_is_data: a PR body carrying prompt-like
    text appears only inside change_evidence. test_missing_context_is_input_incomplete. test_import_closure_is_prepare_safe: walking
    review_input''s first-party imports transitively (ast, no import) finds no third-party top-level module outside yaml and pydantic,
    the prepare job''s install line.'
- file: tests/fixtures/persona_verdict/review_input/
  action: Create
  purpose: Synthetic head snapshot (one plan, one src module with an import, one test) and a review-context.json.
