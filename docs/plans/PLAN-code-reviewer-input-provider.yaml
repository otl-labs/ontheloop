    -q
  expected: exit 0 with 8 passed; the file is absent on main
  fix_if: a node fails; fix review_input.py or the materialise ctx, never the assertion
  hermetic: true
  expected_literals:
  - 8 passed
  graduation: graduate
  graduation_check_id: code-reviewer-input-provider-units
- step: 2
  phase: pre-deploy
  action: materialise registration, its bytes line and the prepare-job import closure (which now includes review_input) stay green.
  command: bin/venv-python -m pytest tests/personas/test_materialise.py::test_materialise_prints_input_bytes_per_route tests/personas/test_materialise.py
    tests/personas/test_route.py tests/personas/test_run.py -q
  expected: exit 0, no failures
  fix_if: 'test_run.py''s closure node fails: review_input''s closure left {yaml, pydantic}; import narrower helpers, never widen
    ALLOWED'
  hermetic: true
  expected_literals:
  - passed
  graduation: waive
  graduation_waiver_reason: existing suites already in the fast tier by path; the one new node is a mirror-test node of a changed
    file, run by --pre pytest_diff
- step: 3
  phase: pre-deploy
  action: code_reviewer is still not routed (implementation pending).
  command: 'grep -n -A4 ''persona: code_reviewer'' docs/contracts/executor-personas.yaml | grep -c ''status: pending'''
  expected: prints 1
  fix_if: 'prints 0: the status changed; revert it, rec-5708 flips it'
  hermetic: true
  expected_literals:
  - '1'
  graduation: waive
  graduation_waiver_reason: 'a one-plan guard: rec-5708 flips this status on purpose, so a standing check would fail that plan'
- step: 4
  phase: post-deploy
  action: The squash commit carries the Resolves trailer for rec-5696, so ci.yml closure closes it.
  command: bin/venv-python -m scripts.session.merge_step readback --slug code-reviewer-input-provider --sha <merge_sha>
  expected: readback OK naming rec-5696
  fix_if: 'MISSING: follow merge_step recover'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a per-merge read-back, not a repository property
