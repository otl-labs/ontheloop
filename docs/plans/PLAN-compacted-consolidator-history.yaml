pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decision 278 read (clause 4 and its manifest delegation) and Decision 149's stub grammar
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    scripts/checks/decisions/consolidation.py: add, directly above _manifest_problems, _compacted_history(supersedes,
    entries, rows) -> bool: False unless supersedes is non-empty and every victim has a header and is_compacted_stub;
    the set of the victims' extract_superseded_by targets (dec- prefix removed) has exactly one member, numeric, with a
    header that is_compacted_stub and _superseded(rows, that number, its block) hold for; then return
    _declared(that block) == set(supersedes). In _manifest_problems, where cons is None, return [] when
    _compacted_history holds, else the existing "no entry's envelope supersedes exactly" line. After the existing
    superseded-cons return, start problems with "{tag}: Decision {cons}'s heading title does not declare (supersedes
    {sorted(supersedes)})" when set(_extract_title_borne_supersedes(first line of entries[cons])) != set(supersedes).
  - >-
    tests/checks/decisions/test_consolidation.py: ENTRY_4's heading becomes "## Decision 4: Consolidating (supersedes
    Decisions 1 and 2) (Decided)" and _to_consolidator's replace keeps its intent ("(supersedes Decisions 1 and 2)" ->
    "(supersedes Decisions 1, 2 and 7)"). tests/checks/decisions/test_validate_delegated_key_changes.py: in
    _manifest_root, the entry's heading gains "(supersedes Decision 1)".
  - >-
    In test_consolidation.py add _compacted_cons(title="(supersedes Decisions 1 and 2)",
    currency="superseded_compacted"), which makes entry 4 an envelope-less stub with that title pointing at a successor
    5 (_successor(5, 4), row current supersedes [4]), sets row 4's currency and drops unit 1 pt1 so a non-skip shows;
    a COMPACTED table and test_a_manifest_whose_consolidating_entry_compacted_is_history over it, in the RESOLVED
    test's loop shape. Pass row: the default. Fail rows expecting "no entry's envelope supersedes exactly [1, 2]":
    title empty; title (supersedes Decisions 1, 2 and 7); title (supersedes Decision 1); victim 2's marker names a
    second such stub 6; victim 2's Status Decided with its marker kept; row 4 current; entry 4 is ENTRY_4 with
    envelope supersedes [1] and row superseded_pointer. Fail row expecting "Decision 4's heading title does not
    declare (supersedes [1, 2])": live ENTRY_4 without its title declaration. Each of these mutants of the checker
    must fail the node: no _compacted_history call; markers only (return True in place of the title test); <= and >=
    in place of ==; first victim's target only; victims need not be compacted stubs; the entry need not be superseded;
    the entry need not be a compacted stub; no live title rule.
  - >-
    Relief (NEAR_CAP, measured at build time): test_consolidation.py rehearsed at 492 SLOC. If main has grown so the
    build crosses 500, move the RESOLVED and COMPACTED tables, their helpers and their two tests to a new
    tests/checks/decisions/test_consolidation_resolve.py importing the fixture helpers, never a budget raise
    (Decision 128); that is a plan defect report first, since it adds a scope file.
  - >-
    docs/contracts/decision-compaction.yaml consolidation.manifest.shape: replace "{supersedes: [numbers, equal to the
    consolidating entry's envelope supersedes]," with "{supersedes: [numbers, equal to the consolidating entry's
    envelope supersedes and to the numbers its heading title declares as '(supersedes Decision(s) ...)', which a stub
    keeps],". In consolidation.manifest.resolve, after "history: the check skips it, and it stays." insert "Once that
    entry is compacted, so no envelope matches, it is the one entry every victim's Superseded by marker names, provided
    each victim and that entry are compacted stubs and that entry is superseded and its heading title declares exactly
    the manifest's supersedes; any other state with no matching envelope fails, and a live consolidating entry whose
    title does not declare them fails." Add an amendment_log row at the top: {date: <build date>, semantic_break:
    false, change_class: field_add, summary: "PLAN-compacted-consolidator-history (rec-5728): manifest shape and
    resolve: the consolidating entry's heading title declares the victims, and a manifest whose consolidating entry
    has compacted is found through its victims' markers and that title and is history; every existing consolidating
    entry already declares its victims, so semantic_break stays false."}. Keep contract_version.
  - Execute the Verification Plan; loop until each step passes; on an unrecoverable failure stop and RCA (Decision 55).
  - >-
    Squash-merge with "Resolves: rec-5728" in the commit body (git-ops.yaml Resolves trailer); VP 7 reads it back.
  - >-
    Report: the diff summary and VP 1-5 outputs. On merge, give the coordinator the merge SHA for rec-5668, whose plan
    re-runs its wording check; note that a new consolidating entry's heading must now declare its victims.
rollback: Revert the squash commit; the checker returns to failing a manifest whose consolidating entry compacted, and no data changes.
