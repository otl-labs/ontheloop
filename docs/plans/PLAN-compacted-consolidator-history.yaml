      - {id: CCH-02, severity: nit, origin: judgement, anchor: "execution_steps[4]", subject: "leave consolidation.procedure unchanged; the shape clause carries the title rule and the report step names it for drafters", disposition: build-note}
      - {id: CCH-03, severity: nit, origin: judgement, anchor: "execution_steps[4]", subject: "amendment_log summary says why semantic_break stays false", disposition: applied-wording}
