schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: compacted-consolidator-history
intent: >-
  Let a merged consolidation manifest whose consolidating entry has itself been compacted read as history, as
  decision-compaction.yaml already says, by finding that entry through its victims' markers and its heading title, so
  a later supersession of a consolidating entry (Decision 286 under rec-5668) never fails a merged manifest
  (rec-5728).
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-compacted-consolidator-history.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5728 (High), a prerequisite of rec-5668 (the Decision 286 re-decide). Closes no roadmap criterion.
closes_criteria: []
cites: [dec:128, dec:149, dec:235, dec:278]
amends: []
introduces: []
scope:
  - file: scripts/checks/decisions/consolidation.py
    action: Modify
    purpose: >-
      Add _compacted_history (victims' markers name one compacted, superseded entry whose heading title declares
      exactly the victims); _manifest_problems returns no problem on it where it now reports "no entry's envelope
      supersedes exactly", and a live consolidating entry whose heading title does not declare the victims fails.
    new_imports: []
  - file: tests/checks/decisions/test_consolidation.py
    action: Modify
    purpose: >-
      The fixture's consolidating entry declares its victims in its title; add the COMPACTED table and
      test_a_manifest_whose_consolidating_entry_compacted_is_history (rec-5728's acceptance node).
  - file: tests/checks/decisions/test_validate_delegated_key_changes.py
    action: Modify
    purpose: The manifest fixture's consolidating entry declares its victim in its title (the new live rule).
  - file: docs/contracts/decision-compaction.yaml
    action: Modify
    purpose: >-
      consolidation.manifest.shape and resolve state the title rule and how a compacted consolidating entry is found;
      one amendment_log row (contract_amendment under Decision 278's manifest bound).
bundled_recommendations: [rec-5728]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A manifest with no matching envelope reports no problem when every victim is a compacted stub whose Superseded by
    marker names one entry, and that entry is a compacted stub, is superseded and declares exactly the manifest's
    supersedes in its heading title.
  - >-
    It still fails with "no entry's envelope supersedes exactly" when that title declares nothing, more or fewer
    numbers; when the victims' markers name two entries; when a victim is not a compacted stub; when that entry's
    index row is live; or when that entry is superseded but not compacted.
  - >-
    A live consolidating entry whose heading title does not declare exactly the manifest's supersedes fails with
    "heading title does not declare"; every existing DEFECTS and RESOLVED row still passes.
  - >-
    With Decision 286 compacted in memory to a stub pointing at a new successor, the real repository's manifests report
    no problem; with "(supersedes Decision 101)" dropped from its heading, exactly one problem, for the 101 manifest.
  - decision-compaction.yaml's shape and resolve keys state the rule; no merged manifest changes.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5728's acceptance node.
    command: bin/venv-python -m pytest "tests/checks/decisions/test_consolidation.py::test_a_manifest_whose_consolidating_entry_compacted_is_history" -q
    expected: >-
      exit 0 with 1 passed; on the base the node is absent, against the base checker its pass row fails, and each
      mutant named in execution step 3 fails it
    fix_if: a row fails; read its name and the problems it printed, and fix the checker, never the row
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: The node runs in the suite on every change to the checker; a registry row would duplicate it.
  - step: 2
    phase: pre-deploy
    action: The checker's mirror test files and the decision checks they serve still pass.
    command: bin/venv-python -m pytest tests/checks/decisions tests/decisions_md -q -n 4
    expected: exit 0, no failures (978 passed at planning with the rehearsed change applied)
    fix_if: an existing row or another decisions test fails; a fixture consolidating entry lacks its title declaration or a guard regressed
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole-directory re-run of tests the scope modifies; the suite already runs them on every change.
  - step: 3
    phase: pre-deploy
    action: >-
      Real-repository rehearsal of rec-5668's shape without its drafts: in memory, Decision 286 becomes a compacted stub
      keeping its heading and pointing at a new successor whose envelope supersedes [286]; every merged manifest is
      then scanned with the heading kept and with "(supersedes Decision 101)" dropped from it.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.checks.decisions import consolidation as c; r=Path('.'); e=c._entries(r); rows=c.load_rows(r); n=max(e)+1; head=e[286].split(chr(10), 1)[0]; stub=lambda h: h + '\n\n**Status:** Superseded\n**Date:** 2026-11-27\n\n**Decision:** x.\n\n**Superseded by: Decision %d**\n\n---\n\n' % n; succ='## Decision %d: s (Decided)\n\n\x60\x60\x60yaml\nnumber: %d\nsupersedes: [286]\n\x60\x60\x60\n\nbody\n\n---\n\n' % (n, n); rows=[dict(x, currency='superseded_compacted') if x.get('number')==286 else x for x in rows]+[{'number': n, 'live': True, 'currency': 'current', 'amends': [], 'supersedes': [286]}]; c.load_rows=lambda root: rows; scan=lambda h: (setattr(c, '_entries', lambda root: {**e, 286: stub(h), n: succ}), c.manifest_problems(r, lambda root, rel: None))[1]; kept=scan(head); bare=scan(head.replace(' (supersedes Decision 101)', '')); print('KEPT', kept); print('BARE', len(bare)); assert kept==[] and len(bare)==1 and 'supersedes exactly [101]' in bare[0], bare; print('REHEARSAL_OK')"
    expected: >-
      prints KEPT with an empty list, then BARE 1, then REHEARSAL_OK; against the base checker the assertion fails with
      KEPT listing the 101 manifest's "no entry's envelope supersedes exactly [101]"
    fix_if: KEPT lists a problem (the identification rule misses the real stub shape) or BARE is not 1
    hermetic: true
    expected_literals: ["KEPT []", "BARE 1"]
    graduation: waive
    graduation_waiver_reason: Moment claim about today's Decision 286 and its manifest; step 1's node is the standing guard.
  - step: 4
    phase: pre-deploy
    action: The contract states the rule, and no merged manifest changed.
    command: >-
      bin/venv-python -c "import yaml; m=yaml.safe_load(open('docs/contracts/decision-compaction.yaml'))['consolidation']['manifest'];
      assert 'heading title declares' in m['shape'] and 'which a stub keeps' in m['shape'];
      assert all(s in m['resolve'] for s in ('Once that entry is compacted', 'declares exactly the manifest', 'whose title does not declare them fails')); print('CONTRACT_OK')"
      && git diff --quiet origin/main -- docs/decision-migration/consolidations/ && echo MANIFESTS_UNCHANGED
    expected: prints CONTRACT_OK then MANIFESTS_UNCHANGED
    fix_if: an assertion fails (the shape or resolve wording drifted from execution step 5) or a manifest differs from origin/main
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Wording presence and a diff against origin/main, which moves after merge; step 1 guards the behaviour.
  - step: 5
    phase: pre-deploy
    action: Size and complexity headroom, and the fast tier, on the complete tree.
    command: >-
      bin/venv-python -c "import ast; from scripts.checks.sloc._shared import _BRANCH_TYPES as B;
      t=ast.parse(open('scripts/checks/decisions/consolidation.py').read());
      cc={n.name: sum(isinstance(s, B) for s in ast.walk(n)) for n in ast.walk(t) if isinstance(n, ast.FunctionDef)};
      sl=[sum(1 for l in open(f) if l.strip() and not l.strip().startswith('#')) for f in ('scripts/checks/decisions/consolidation.py', 'tests/checks/decisions/test_consolidation.py')];
      print('MAXCC', max(cc.values()), 'SLOC', sl); assert max(cc.values()) <= 19 and max(sl) <= 500" && bin/venv-python -m scripts.validate --pre
    expected: >-
      prints MAXCC at most 19 and both SLOC at most 500 (rehearsed 17, 460 and 492), then validate --pre exits 0 with
      validate_delegated_key_changes printing its PASS line for the consolidation units
    fix_if: >-
      a function above 19 branches or a file above 500 SLOC (execution step 4's relief, never a raise), or a --pre
      failure (fix on the branch)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_sloc_limits and validate_cc_limits are the standing guards; this step only pins headroom for the build.
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 7
    phase: post-deploy
    action: rec-5728 reads back closed after the build's squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5728']); print(rows[0]['status'])"
    expected: prints closed
    fix_if: prints open; close it through scripts.ops_data_portal --update-rec after confirming its acceptance node passes on main
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/decisions/consolidation.py
    behavior: a compacted consolidating entry is found through its victims' markers and its title, and the live title rule holds
    verification_step: 1
    test_selector: tests/checks/decisions/test_consolidation.py::test_a_manifest_whose_consolidating_entry_compacted_is_history
    red_green_expectation: red before (the pass row fails on the base checker), green after
  - source: tests/checks/decisions/test_consolidation.py
    behavior: the COMPACTED table holds each pass and fail case of the identification rule
    verification_step: 1
    test_selector: tests/checks/decisions/test_consolidation.py::test_a_manifest_whose_consolidating_entry_compacted_is_history
    red_green_expectation: absent before, green after
  - source: tests/checks/decisions/test_validate_delegated_key_changes.py
    behavior: a resolving manifest still passes and counts its units under the live title rule
    verification_step: 2
    test_selector: tests/checks/decisions/test_validate_delegated_key_changes.py::test_a_resolving_manifest_passes_and_counts_its_units
    red_green_expectation: red with the checker change and the old fixture, green with the fixture's title declaration
  - source: docs/contracts/decision-compaction.yaml
    behavior: consolidation.manifest shape and resolve state the title rule and the compacted-entry identification
    verification_step: 4
    command: >-
      bin/venv-python -c "import yaml; m=yaml.safe_load(open('docs/contracts/decision-compaction.yaml'))['consolidation']['manifest'];
      assert 'heading title declares' in m['shape'] and 'which a stub keeps' in m['shape'];
      assert all(s in m['resolve'] for s in ('Once that entry is compacted', 'declares exactly the manifest', 'whose title does not declare them fails')); print('CONTRACT_OK')"
      && git diff --quiet origin/main -- docs/decision-migration/consolidations/ && echo MANIFESTS_UNCHANGED
    waiver_reason: Prose read by agents, not by the checker (which reads only consolidation.threshold); step 4 pins the wording and step 1 the behaviour.
constraints:
  - Merged manifests are never edited (operator ruling 2026-11-27); only the checker, two test fixtures and the contract change.
  - No existing test row is loosened or removed (Decision 235); DEFECTS, RESOLVED and the history assertion stay; fixture titles gain a declaration only.
  - Each file at most 500 SLOC and each function at most 20 branches (Decision 128, Decision 43); decompose, never raise.
  - No new dependency or first-party module; consolidation.py already imports _extract_title_borne_supersedes and has _declared.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "rec-5728 (acceptance is VP 1's node). Prerequisite of rec-5668, whose wording check passes only once this merges."
  - "Operator decision card 2026-11-27 14:40Z: markers plus title, and a live title rule (option A of three: markers and title only; markers only)."
  - "Operator 'write the plan' 2026-11-27 14:40Z on the sign-off that asked him to accept the Decision 235 reading in the next line; taken as that acceptance; the plan PR's review is where the operator confirms it explicitly."
  - "Advisor (blind, facts-only): /mnt/project-files/decision-growth/consolidation/compacted-consolidator/advisor-brief/ADVICE.md. Adopted: markers plus title reciprocity (exact equality), reject markers alone and the index row (partly the inverse of the markers); fail closed on every ambiguity with the existing message; full skip once identified, as the existing superseded-consolidator branch does; live title rule; contract text."
  - "Why the title: a stub keeps its heading unchanged (compaction.stub_grammar.header) and loses its envelope, so the title is the only declaration the consolidating entry still makes; _declared already reads it for resolve hops (PR #2531). All five consolidating entries (281, 283, 284, 285, 286) and the chain 6 and rec-5668 drafts declare exactly their victims in their titles today."
  - "Not a weakening (Decision 235 cl.1): the new no-problem path applies only to a state the contract already calls history, and its identification conditions are stricter than the envelope branch's; a live consolidating entry still fails (COMPACTED rows), and the live title rule tightens."
  - "Rehearsed on main f156dc2e (drafts beside the advice, build-drafts/): VP 1 green and red on the base checker; all nine execution step 3 mutants fail the node; VP 2 978 passed; VP 3 green and red on the base; 405 other tests naming consolidation pass."
  - "Parallel plan on consolidation.py: rec-5720 (resolver follow-ups) moves _superseded/_live/_declared to scripts/checks/_decision_chain.py and keeps _superseded and _declared callable in consolidation.py; its rehearsed diff applies cleanly on top of this change and the tests pass. Whichever merges second rebases; if _declared leaves the module, import it from scripts/checks/_decision_chain.py."
  - "Open recs on consolidation.py not bundled (neither closed whole here): rec-5427 (harden scans), rec-5422 (judgement residuals). The history skip also skips the freeze, as the existing superseded branch already does; running the freeze on both history branches is rec-5733 (Low, filed at critique r1, CCH-04, deps rec-5728, read back open)."
  - "Registry shard decision-delegated-key-rules is kept: it runs the whole test_validate_delegated_key_changes.py, which stays green with the fixture's title declaration (VP 2). PLAN-manifest-supersession-resolver, which plan_obligations lists as unbuilt on the same files, was built in #2531 (ee9c5fa1)."
  - "Decision 278 cl.4 bound (scout NOTE): the history skip predates this change under the same contract_amendment bound (resolve already skips a manifest whose consolidating entry is superseded); a compacted consolidating entry is the supersession state cl.6 anticipates, and a live one keeps full target resolution."
  - "Decision-scout r1 FLAGS_FOUND (one NOTE, Decision 278 cl.4 bound; answered by the line above). CITE: dec:278, dec:149, dec:235, dec:128. Decisions triaged: 238 of 238. Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2. Serves: NS.4 2/5."
  - "red_overlap 2026-11-27: verdict clear, reds [] (slo_hours 4)."
  - "Approval class: decision-compaction.yaml is notice class (approval-routing.yaml gated set excludes it), so no sidecar or approval run; the change stays inside Decision 278's manifest text bound (every target resolves at head)."
