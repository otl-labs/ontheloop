schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: company-licensor
intent: >-
  The founder-to-company IP assignment executed on 2026-11-19, discharging Decision 195's assignment-executes
  condition: On The Loop Labs Limited replaces the founder as Licensor, copyright holder and published contact
  across the repository's licence and attribution surfaces, and the licence check pins the company name (rec-3906).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-company-licensor.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- resolves rec-3906 (Medium), the company-attribution sweep of the
  company ownership move (Decision 195), stage everything_else of docs/contracts/account-credential-inventory.yaml.
  No tier_item criterion claimed.
cites: [dec:195, dec:194, dec:171, dec:198, dec:177, dec:246, dec:244]
scope:
  - file: LICENSE
    action: Modify
    purpose: Licensor parameter and the Licensed Work copyright line name On The Loop Labs Limited (Decision 195 cl.2).
  - file: packages/ontheloop-py/LICENSE
    action: Modify
    purpose: Byte-identical copy of LICENSE (tests/test_ontheloop_placeholder_packages.py).
  - file: packages/ontheloop-js/LICENSE
    action: Modify
    purpose: Byte-identical copy of LICENSE.
  - file: packages/ontheloop-js-scoped/LICENSE
    action: Modify
    purpose: Byte-identical copy of LICENSE.
  - file: packages/ontheloop-rs/LICENSE
    action: Modify
    purpose: Byte-identical copy of LICENSE.
  - file: scripts/checks/hygiene/validate_licence_consistency.py
    action: Modify
    purpose: >-
      The Licensor regex pins On The Loop Labs Limited in the same commit as LICENSE (Decision 195 cl.2); the
      Licensed Work copyright line and README's copyright line must name the same holder.
  - file: tests/checks/hygiene/test_validate_licence_consistency.py
    action: Modify
    purpose: Fixture names the company; new tests reject the former Licensor and a mismatched copyright holder.
  - file: config/agent/verification_registry/entries/licensed-work-mark-and-historical-split.yaml
    action: Modify
    purpose: The graduated oracle's Licensor grep names the company (it hard-pins the founder today).
  - file: README.md
    action: Modify
    purpose: Copyright line names On The Loop Labs Limited (rec-3906 acceptance).
  - file: CONTRIBUTING.md
    action: Modify
    purpose: >-
      The licensor and the assignee of contributions become On The Loop Labs Limited; two provenance sentences
      record the signed assignment and its date.
  - file: COMMERCIAL-LICENSE.md
    action: Modify
    purpose: The party arranging a private licensing channel becomes On The Loop Labs.
  - file: SECURITY.md
    action: Modify
    purpose: The out-of-band contact becomes the company security role alias (inventory MAIL-02).
  - file: docs/PROJECT_CONTEXT.md
    action: Modify
    purpose: The thesis names On The Loop Labs as the builder, byte-neutral at its zero-headroom budget (rec-3906).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Dated Updates: Decision 195 (assignment-executes discharged) and Decision 194 (assumption A2's precondition
      met). Append-only trailers only (Decision 177).
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: >-
      IP-01, IP-02 and MAIL-02 become company/proven with one evidence_ledger row each, and one amendment_log row
      (Decision 168).
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      Governance note and amendment_log row recording the claim-preserving in-place edit of the graduated oracle's
      Licensor grep (Decision 244 cl.5; the 2026-10-20 in-place precedent).
bundled_recommendations: [rec-3906]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - No forward-standing file names the founder as Licensor, copyright holder or contact; only Decision text, plans
    and the licence check's negative test keep the name.
  - LICENSE and its four package copies name On The Loop Labs Limited as Licensor and copyright holder, stay
    byte-identical, and validate_licence_consistency passes on the real tree and fails on the former Licensor.
  - SECURITY.md carries exactly one e-mail address, the company security role alias.
  - Decisions 195 and 194 carry dated 2026-11-19 Updates; IP-01, IP-02 and MAIL-02 are terminal with ledger rows.
  - rec-3906 closes on merge; rec-3154 records the operator's deferral ruling in the Decision 195 Update's words.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Licence check unit tests, including the new rejection tests, and the package-copy identity test.
    command: >-
      bin/venv-python -m pytest tests/checks/hygiene/test_validate_licence_consistency.py
      tests/test_ontheloop_placeholder_packages.py -q
    expected: Exit 0; the new tests fail on origin/main's check and pass after the change.
    fix_if: A failure names the file or regex that disagrees; fix the artefact, never loosen the test.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the test suite the full tier already re-runs (tests/checks/hygiene and the placeholder-package test).
  - step: 2
    phase: pre-deploy
    action: The registered check passes on the real tree.
    command: >-
      bin/venv-python -c "from scripts.checks.hygiene.validate_licence_consistency import validate_licence_consistency as v;
      f=[]; v(f); print('LICENCE_FAILED', f); assert not f"
    expected: Exit 0 and LICENCE_FAILED [] printed.
    fix_if: Any message names the surface out of step with LICENSE.
    hermetic: true
    expected_literals: ["LICENCE_FAILED []"]
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the registered check validate_licence_consistency, which every tier runs, and its real-tree test
      TestRealTree::test_shipped_artefacts_satisfy_the_check.
  - step: 3
    phase: pre-deploy
    action: The graduated oracle passes with its updated Licensor grep.
    command: >-
      bin/venv-python -c "import subprocess,yaml; c=yaml.safe_load(open('config/agent/verification_registry/entries/licensed-work-mark-and-historical-split.yaml',encoding='utf-8'))['check_spec']['command'];
      assert 'On The Loop Labs Limited' in c[-1] and 'Benjamin Blake' not in c[-1]; subprocess.run(c,check=True); print('ORACLE_OK')"
    expected: Exit 0 and ORACLE_OK printed.
    fix_if: A grep in the oracle fails; reconcile the oracle with the edited files.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Runs the graduated record licensed-work-mark-and-historical-split, which the full tier already re-runs as a
      standing guard (Decision 244 cl.1).
  - step: 4
    phase: pre-deploy
    action: >-
      Sweep: no forward-standing founder name remains outside historical records, and SECURITY.md's only address is
      the company security alias.
    command: >-
      bash -c "! git grep -n 'Benjamin Blake' -- . ':!docs/DECISIONS.md' ':!docs/DECISIONS_ARCHIVE.md' ':!docs/plans/**'
      ':!docs/decisions-index.json' ':!tests/checks/hygiene/test_validate_licence_consistency.py' &&
      test \"$(grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+([.][A-Za-z0-9-]+)+' SECURITY.md | sort -u)\" = 'security@otl-labs.com' && echo SWEEP_OK"
    expected: Exit 0 and SWEEP_OK printed.
    fix_if: A hit names a file this plan missed; route a scope amendment, never edit an unscoped file.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      One-time evidence for this merge (Decision 244 cl.4): its exclusion list is this change's own historical set, and
      the standing guard is validate_licence_consistency, which pins the company as Licensor and copyright holder in
      LICENSE and README.
  - step: 5
    phase: pre-deploy
    action: Records -- inventory rows terminal with ledger rows, and the dated Updates sit inside Decisions 195 and 194.
    command: >-
      bin/venv-python -c "import re,yaml,pathlib; c=yaml.safe_load(open('docs/contracts/account-credential-inventory.yaml',encoding='utf-8'));
      rows={r['id']:r for r in c['rows']}; assert all(rows[i]['status']=='proven' and rows[i]['owner_today']=='company' for i in ('IP-01','IP-02','MAIL-02'));
      led={(e['row'],e['date']) for e in c['evidence_ledger']}; assert all((i,'2026-11-19') in led for i in ('IP-01','IP-02','MAIL-02'));
      assert c['amendment_log'][0]['date']=='2026-11-19';
      d=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); s={m.group(1):m.group(0) for m in re.finditer(r'(?ms)^## Decision (\d+):.*?(?=^## Decision \d+:|\Z)',d)};
      assert all('> **Update (2026-11-19):**' in s[k] for k in ('195','194')); print('RECORDS_OK')"
    expected: Exit 0 and RECORDS_OK printed.
    fix_if: A missing row or Update; add it from the approved-text sidecar.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A moment claim (Decision 244 cl.4): it asserts amendment_log[0] is this change's row and the Updates are dated
      today, which a later amendment legitimately makes false.
  - step: 6
    phase: pre-deploy
    action: Run the full tier before handoff (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure -- fix in scope and re-run; a failure outside scope is a plan defect, never a handoff to PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: rec-3906 closed by the merge's Resolves trailer; rec-3154 carries the deferral ruling.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; r=make_reader(profile='agent_platform');
      rows={x['id']:x for x in r.named('recs_by_ids', ids='rec-3906,rec-3154')}; print(rows['rec-3906']['status'], rows['rec-3154']['status']);
      c=rows['rec-3154']['context']; assert rows['rec-3906']['status']=='closed' and 'first outside contribution' in c
      and 'first commercial licence sale' in c and 'whichever comes first' in c"
    expected: Exit 0; rec-3906 closed and rec-3154's context carries the Decision 195 Update's deferral wording.
    fix_if: rec-3906 open means its acceptance failed at closure; read the closure job log.
    hermetic: false
    graduation: not-applicable
