constraints:
  - Never write the signed assignment, any postal address or any personal e-mail address into the repository, a PR or
    a commit; SECURITY.md's old line is replaced by the implementer's edit and quoted nowhere.
  - Old-repository URLs (COMMERCIAL-LICENSE.md, LICENSING.md) stay for the rec-3903 sweep.
  - Decision 195 cl.2 -- LICENSE's Licensor line and the check's regex move in the same commit.
  - Decision 177 -- Decision bodies are append-only; only dated Update trailers are added.
  - No rescue agents or workaround loops (Decision 55).
