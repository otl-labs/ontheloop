pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decisions 194, 195 (Updates only), 171 cl.5 and 198 read
  - docs/plans/approved/company-licensor.yaml read; every bound edit applied verbatim
  - All files in scope located and readable
execution_steps:
  - Apply every block of docs/plans/approved/company-licensor.yaml verbatim; the build adds no other words to a bound
    file.
  - LICENSE and packages/{ontheloop-py,ontheloop-js,ontheloop-js-scoped,ontheloop-rs}/LICENSE -- the Licensor
    parameter becomes "On The Loop Labs Limited" and the Licensed Work line becomes "The Licensed Work is (c) 2026
    On The Loop Labs Limited"; nothing else in those files changes.
  - validate_licence_consistency.py -- a module constant _LICENSOR = "On The Loop Labs Limited"; _BUSL_REQUIRED's
    Licensor pattern pins re.escape(_LICENSOR) and gains a Licensed Work copyright-line pattern naming it; the README
    check requires a "Copyright 20NN <_LICENSOR>." line; the module docstring says so (Decision 195 cl.2).
  - test_validate_licence_consistency.py -- fixtures carry the company Licensor, its copyright line and the README
    copyright line; add test_former_licensor_is_rejected, test_licence_copyright_line_must_name_the_licensor and
    test_readme_copyright_must_name_the_licensor.
  - licensed-work-mark-and-historical-split.yaml -- the Licensor grep names On The Loop Labs Limited in place of the
    founder; nothing else in the shard changes (the bound governance note records it).
  - SECURITY.md -- the out-of-band contact line becomes "For urgent or out-of-band contact, email On The Loop Labs at
    security@otl-labs.com."
  - Before committing, show the operator one final diff of every unbound file above and wait for their own word
    (Decision 246 cl.4). Record that word's date and message id in the handoff note only, never in the repository
    (coordinator.yaml approvals); the PR body cites rec-5430 as the owner of the mechanism gap.
  - Regenerate docs/decisions-index.json with the repository's generator.
  - Execute Verification Plan steps 1-5 -- run each step; loop until pass; on unrecoverable failure stop and RCA
    (Decision 55).
  - >-
    CLOSURE -- separate facts, in order, each reported on its own (implement skill Commit Flows; docs/contracts/git-ops.yaml
    handoff_sequence and resolves_trailer). (a) READINESS -- bin/venv-python -m scripts.session.github_readiness (unknown
    is never PASS). (b) Set implementation_declared true in this plan; commit with a "Resolves: rec-3906" trailer in the
    body; git fetch origin main and git rebase origin/main (STOP on conflict), then measure
    docs/contracts/verification-registry.yaml against its 500-effective-line cap (over it, stop and amend the plan; the
    file is sidecar-bound, so the build cannot compact it). (c) VP 6 on the committed, rebased, clean
    tree. (d) Write a scratchpad JSON holding exactly the scripts.session.postflight_evidence.CATEGORIES keys and run
    bin/venv-python -m scripts.session.postflight --evidence on it. (e) Push, open the PR, then the merge step with the
    trailer in the squash commit body; report the push and the PR outcome apart from (a)-(d).
  - After merge -- call get_rec_write_guidance(), then update_rec rec-3154's context only, in the Decision 195 Update's
    words -- deferred "until the first outside contribution or the first commercial licence sale, whichever comes
    first" (operator ruling 2026-11-19) -- adding that on the sale leg Decision 171 reversal condition (a) needs the
    audit settled before that sale concludes. Leave its priority and status unchanged (no ruling covers them); run VP 7.
  - 'Report: what was implemented, verification results'
