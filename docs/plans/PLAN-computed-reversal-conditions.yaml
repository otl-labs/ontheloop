  - source: scripts/preflight/decision_conditions.py
    behavior: the gate-exempt predicate set is pinned, so no existing predicate leaves the PR gate silently.
    verification_step: 2
    test_selector: tests/test_decision_conditions_computed.py::test_gate_exempt_predicates_are_pinned
    red_green_expectation: red before (no gate flag, node absent), green after
  - source: scripts/preflight/review_dates.py
