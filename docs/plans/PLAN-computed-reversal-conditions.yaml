schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "computed-reversal-conditions"
intent: >-
  Make the reversal-condition monitor compute what can be computed and give every due review an owner: register
  repository-only predicates for Decision 179's index-read and inflow-per-plan measures with a fires-at-review key
  (rec-5366 wires the stanza to them once this is on main), have a scheduled sensor file exactly one recommendation
  per overdue or fired stanza, spread the bunched month-end review dates, and keep history-reading predicates out of
  the fast-tier stanza gate.
plan_type: IMPLEMENTATION
implementation_declared: false
verification_tier: V3
plan_path: docs/plans/PLAN-computed-reversal-conditions.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5264
  (Medium), the contract-first retrospective's CFR-06. Closes no roadmap criterion. Remit: Decision Growth.
cites: [dec:61, dec:62, dec:79, dec:84, dec:126, dec:128, dec:133, dec:177, dec:179, dec:194, dec:215, dec:246, dec:249, dec:272]
amends: []
introduces: []
closes_criteria: []
scope:
  - file: scripts/preflight/decision_conditions.py
    action: Modify
    purpose: >-
      (1) Optional condition key `fires` (on_true, the default, or at_review), valid on kind repo_state only; a
      condition carries `holds` (the predicate's value, None when not run) apart from `fired`; an at_review condition
      fires only when holds and review_by <= today; a condition naming a gate=False predicate without fires: at_review
      is MALFORMED, so the gate and --assert-not-surfaced can never miss a fire the sensor sees. (2) register_predicate(name, *, gate=True); _PREDICATE_REGISTRY
      stays name -> bare function and gate=False adds the name to a module set _GATE_EXEMPT, which evaluate(gate=True)
      consults by name for injected predicates= dicts too; evaluate(gate=False), the default:
      with gate=True a predicate registered gate=False is checked for registration and that the stanza's params bind
      to its signature (inspect.signature(fn).bind) but is not called; every other predicate runs as today, so
      Decision 194 clause 2's raising roadmap predicate still reddens the PR gate. A
      predicate that declares an `as_of` parameter receives min(today, review_by), so an at-review window ends at
      review_by and the result reproduces. (3) Register decision_index_bytes_exceed(max_bytes,
      index_path="docs/decisions-index.json") and decision_entries_per_plan_exceed(window_days, max_entries_per_plan,
      as_of=None meaning today when called directly, registered gate=False: it reads git history) as thin wrappers
      over corpus_measures. A raising predicate under the default evaluate() makes the stanza MALFORMED, as today; a
      shallow clone therefore surfaces Decision 179 MALFORMED once rec-5366 wires it (handoff to rec-5366, which must
      choose MALFORMED or holds None and the acceptance of a history-raise rec, since --assert-not-surfaced runs gate=True and
      would pass a rec filed for a gate=False raise; convergence-health has fetch-depth 0).
      (4) preflight_bucket's keys are unchanged (no new bucket key, so tests/test_decision_conditions.py's shape test
      stands); the sensor reads holds from evaluate() directly. (5) CLI flag
      --assert-not-surfaced N: evaluates with gate=True, so the verdict never depends on clone depth (a gate=False
      predicate's holds is None and its at_review condition is decided by review_by alone); exit 0 iff Decision N
      has no stanza or is not-due, 1 when fired, review-due or MALFORMED. The CLI keeps its positional path arguments
      (tests/test_decision_conditions.py calls _cli([path])). The module docstring's "only on stanza WELL-FORMEDNESS"
      line is updated to name the ceiling. The review-date code lives in scripts/preflight/review_dates.py (size
      relief, below), not here.
  - file: scripts/preflight/review_dates.py
    action: Create
    purpose: >-
      Split out of decision_conditions.py for SLOC headroom (329 of 500 today, Decision 128): the constants
      REVIEW_DATE_TARGET = 3 and REVIEW_DATE_CEILING = 10, review_date_load(results) -> {date: [decision ids]}, and
      next_review_date(target, results, today), the latest date on or before target and after today carrying fewer
      than REVIEW_DATE_TARGET stanzas (ValueError when target <= today, so a re-arm never lands on a past date). CLI `python -m scripts.preflight.review_dates --next YYYY-MM-DD` prints that date.
  - file: scripts/preflight/corpus_measures.py
    action: Create
    purpose: >-
      Pure repository measures, no reader: index_bytes(path) and entries_per_plan(window_days, as_of, root) -> (entries,
      plans). The window is base..end, both first-parent commits resolved from as_of: end is `git rev-list -1
      --first-parent --before=<as_of + 1 day>T00:00:00Z HEAD` and base the same with --before=<as_of - window_days + 1
      day>T00:00:00Z (so window_days 90 at as_of 2026-11-17 counts 2026-08-20..2026-11-17 inclusive), so a
      window anchored at a past review_by stays fixed as main moves on; new entries are the `## Decision N:` ids in
      docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md at end absent at base; plans are the distinct
      docs/plans/PLAN-*.yaml paths added (diff-filter A, first-parent) in base..end. Raises
      ValueError naming the window when no base commit exists (shallow or short history), never returns a guess.
  - file: scripts/preflight/reversal_reviews.py
    action: Create
    purpose: >-
      The overdue-review sensor. For each stanza evaluate() reports fired, manual-review-due or MALFORMED (on main
      only a raising predicate can make one, since the gate refuses unparseable stanzas), find an owning rec. Owners
      are read once per run by two fixed recs_by_title_prefix sweeps, "Review Decision %" and "Supersede Decision %"
      (no limit, so every row; status open or in_progress), and matched client-side by
      `^(?:Review|Supersede) Decision (\d+)\b`, so reader calls stay at two however many stanzas are due and 17 never
      matches 173. If none, file one rec through scripts.ops_data_portal.file_rec in rec-5082's form: title "Review
      Decision N before <review_by>: reversal review due" (or "...: reversal condition fired (<ids>)", or "Review
      Decision N stanza unreadable: <first line of the error, cut to 120 characters>", the full text in context),
      every form matching its own sweep; file the stanza's own source file (DECISIONS.md or DECISIONS_ARCHIVE.md), source
      reversal_review, status open, priority High, risk Low, effort S, acceptance `bin/venv-python -m scripts.preflight.decision_conditions
      --assert-not-surfaced N`, context naming the on_trigger text, each condition's kind and computed holds, and the
      command `python -m scripts.preflight.review_dates --next <your new review date>` for the reviewer to run;
      condition ids and on_trigger text are backtick-quoted in title and context (the advisory glossary_lint reads
      a bare condition id with a relative word in it as that word). It never closes or edits a rec: a filed rec closes through its acceptance when
      the review re-arms or supersedes the stanza, and a closed owner on a still-due stanza gets a new rec (never
      silently renew). Prints one line per due stanza, exactly `[reversal_review] Decision N <state> owned by rec-X`,
      `... filed rec-X`, `... would-file` (dry-run) or `... owned by rec-X, rec-Y (warning: more than one owner)`, a MALFORMED owned line ending ` (error: <message>)`
      so a predicate raise behind an existing review rec still shows,
      with <state> fired, manual-review-due or MALFORMED, and a summary line `[reversal_review]
      summary due=<n> filed=<n> owned=<n> malformed=<n>`. CLI `python -m scripts.preflight.reversal_reviews [--dry-run]
      [--profile P]`; in both modes exit 0 unless a reader or portal call fails, which raises and exits 1 (Decision 84
      I-4, no outbox); --dry-run reads but never files, so a would-file line is not a failure. The two sweeps run
      only when evaluate() reports a due stanza, so a quiet tick costs no reader call; with Decision 133 overdue that
      is 2 x 24 = 48 reads a day, floor and ceiling, to set against Decision 215's reader-invocations-doubled
      condition; the 7-day log_invocation baseline is not measured here (unmeasured comparison: the build's report records it). Home: scripts/preflight beside decision_conditions, whose results
      it files (ci_rca_gauges precedent), not scripts/convergence_health. The file_rec payload carries the literal
      `"source": "reversal_review"`, which check_source_registry's scan matches. scripts.rec_episode.find_recs is not
      used because it scopes by source, and today's owners (rec-5273, rec-5082) are source planning. Any open or
      in_progress rec titled "Review Decision N ..." or "Supersede Decision N ..." owns the stanza by design (the
      module docstring says so).
  - file: scripts/checks/ops_governance/validate_reversal_stanzas.py
    action: Modify
    purpose: >-
      Call evaluate(gate=True): the two predicates the gate runs today and the new file-size one still run (Decision
      194 clause 2); the history-reading inflow predicate does not (a local or worktree --pre may be shallow, and it
      would make the PR verdict depend on history depth). Fail any review date carrying more than REVIEW_DATE_CEILING
      stanzas (scripts.preflight.review_dates), naming the date, its decisions and the review_dates --next command.
      Its docstring's "Gate stanza WELL-FORMEDNESS only" line is updated to name the ceiling.
  - file: .github/workflows/convergence-health.yml
    action: Modify
    purpose: >-
      One step "File reversal reviews (rec-5264)" after "Assert scheduled loop liveness (LSA-02)" and before the two
      capacity steps, `if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}`, GH_TOKEN not needed, run `set -euo
      pipefail` then `.venv/bin/python -m scripts.preflight.reversal_reviews`, adding --dry-run when the dispatch's
      diagnose input is set (CONVERGENCE_HEALTH_DIAGNOSE, as the sibling steps receive it), plus one header paragraph in the
      file's existing style (alarm-only: files and never closes, red only on a portal or reader failure, never a
      required check). The job already has fetch-depth 0, the OIDC branch role that files recs, and
      reads recs_by_title_prefix (sensor_liveness).
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: Register canonical_id reversal_review (description, alarm-not-gate signal_interpretation, added_date).
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: >-
      Regenerated by bin/venv-python -m scripts.schema_to_field_semantics, never hand-edited: reversal_review joins
      both registry-sourced accepted_values lists (ops_recommendations.source and telemetry_agents.agent_type), so
      validate_field_semantics_drift, validate_write_time_enforcement_conformance and the deployed writer accept the
      sensor's recs. Redeploys every DuckLake function through the governed code-deploy channel on merge (the
      PLAN-actions-capacity-gauge precedent).
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      One r3_workflows entry for the new inline body,
      ".github/workflows/convergence-health.yml::health-check::file-reversal-reviews-rec-5264", at its measured
      effective line count (validate_composite_action_shell_bodies fails an unregistered body; the
      measure-actions-capacity-rec-5022 precedent).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the 60 blocks of docs/plans/approved/computed-reversal-conditions.yaml: two-line review_by moves inside
      stanzas, each earlier, none later, no note (Decision 177 clause 4 keeps review_by bumps legal in the stanza
      interior). Decision 179's stanza is not edited here (rec-5366). docs/decisions-index.json is regenerated
      (generator-touched, no row).
  - file: scripts/checks/ops_governance/check_source_registry.py
    action: Modify
    purpose: Add scripts/preflight/reversal_reviews.py to SCANNED_PATHS, as every rec-filing sensor is (dispatch_integrity precedent).
  - file: tests/checks/ops_governance/test_check_source_registry.py
    action: Modify
    purpose: test_scanned_paths_includes_portal_and_producer_modules also expects the new sensor module.
  - file: tests/test_decision_conditions_computed.py
    action: Create
    purpose: >-
      fires semantics (on_true unchanged, at_review gated on review_by, fires on a manual condition MALFORMED, unknown
      value MALFORMED, a gate=False predicate without at_review MALFORMED), holds vs fired, as_of injection, gate=True skipping only gate=False predicates while still
      calling the others, --assert-not-surfaced deciding a gate=False at_review condition by review_by alone, the two new predicates registered
      with signatures that bind Decision 179's params, and test_gate_exempt_predicates_are_pinned (the set of
      gate=False predicates equals exactly {decision_entries_per_plan_exceed}, so demoting roadmap_items_complete or the
      ports predicate out of the PR gate fails a test, Decisions 187 and 194). A new file because
      tests/test_decision_conditions.py has 12 SLOC of headroom; that file is not edited.
  - file: tests/test_corpus_measures.py
    action: Create
    purpose: >-
      entries_per_plan and index_bytes on a throwaway git repository built in tmp_path (hermetic, no network),
      including test_window_ends_at_as_of (as_of in the past, commits after it, the count unchanged).
  - file: tests/test_review_dates.py
    action: Create
    purpose: review_date_load, next_review_date (skips a full date, never returns a later date, refuses a target at or before today) and the --next CLI.
  - file: tests/test_reversal_reviews.py
    action: Create
    purpose: >-
      test_overdue_stanza_yields_exactly_one_rec (rec-5264's acceptance selector: two sensor runs over a fixture with
      one overdue stanza and an in-memory reader and portal file exactly one rec; an owned stanza files none), rec
      fields, both owner prefixes, the prefix boundary (17 never matches 173), dry-run, a MALFORMED stanza filed once
      across two runs, the two-owner warning, fail-loud reads, test_no_due_stanza_makes_no_reader_call, and the source
      registered. The in-memory reader applies
      SQL LIKE semantics (% and _), and test_every_filed_title_matches_its_owner_sweep composes each title form
      and finds it with the sensor's own sweep.
  - file: tests/checks/ops_governance/test_validate_reversal_stanzas.py
    action: Modify
    purpose: The gate still calls gate-safe predicates (a raising one fails it), never calls a gate=False one, and fails a date over the ceiling.
  - file: tests/ci/test_actions_capacity_steps.py
    action: Modify
    purpose: >-
      Its order test names the step before the capacity steps; it now expects the reversal-review step there and loop
      liveness one earlier (same strength: the capacity steps stay last).
  - file: tests/ci/test_reversal_review_step.py
    action: Create
    purpose: The workflow step exists, sits before the capacity steps, is gated on main and unless-cancelled, and runs the module.
bundled_recommendations: [rec-5264]
followon_recs: [rec-5365, rec-5366]
infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY (Decisions 79, 125, 126): field_semantics.yaml ships in seven active artifacts. Six redeploy on the governed
    deploy-ducklake-lambdas run on the merge commit (after main's full tier, Decision 249) redeploys them; VP step 7
    asserts each job and smoke: ducklake_maintenance and ducklake_maintenance_smoke by deploy-maintenance and
    maintenance-smoke; ducklake_reader and ducklake_writer by deploy-serving and smoke; ducklake_telemetry_reader and
    ducklake_telemetry_writer by deploy-telemetry-twin, telemetry-twin-smoke, deploy-telemetry and telemetry-smoke.
    Only two accepted_values lists widen by one value; no function gains behaviour. No Terraform or IAM. Until the
    deploy lands, a live filing is refused by the writer, so VP 8 and VP 9 run only after VP 7. The seventh,
    ducklake_telemetry_content_reader (active since Decision 272), deploys only through the operator-gated
    deploy-telemetry-content channel, which this file does not wake (Decision 272 cl.1); per Decision 272's residual
    (rec-5333) the build owes its deploy step, VP 10, which asks the operator. It never validates rec source or
    agent_type, so the sensor does not wait on it.
acceptance_criteria:
  - docs/DECISIONS.md equals main's text with the 60 approved sidecar blocks applied (approved_text verify exits 0).
  - On the real tree the two new predicates compute from the repository with no reader and Decision 179's params (index holds today; inflow per plan reads under 0.30), and no stanza is MALFORMED.
  - Among the stanzas present at base 4197aa93, no review date carries more than 3 on the built tree (stanzas other approved sidecars add are bound only by the ceiling); validate_reversal_stanzas fails a fixture date carrying 11.
  - validate_reversal_stanzas still runs every predicate it runs today and never runs a gate=False one.
  - An overdue stanza yields exactly one open rec across repeated sensor runs, and a stanza already owned by a "Review Decision N" or "Supersede Decision N" rec yields none (rec-5264's acceptance test).
  - After merge, the governed DuckLake deploy of the merge commit succeeds, and a convergence-health run on main after it concludes the reversal-review step successfully and files nothing for Decisions 133 and 173 (owned by rec-5273 and rec-5082) unless their owners closed.
  - rec-5264 is closed by the merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed Decision text is exactly the approved text.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug computed-reversal-conditions --expect
      469c3b8f51121c9616d32d82386c9050f2bc7f6422778cb7668a3f59640b5640  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier.
  - step: 2
    phase: pre-deploy
    action: Run the unit and workflow tests this plan adds or changes.
    command: >-
      bin/venv-python -m pytest -q tests/test_decision_conditions.py tests/test_decision_condition_predicates.py
      tests/test_decision_conditions_computed.py tests/test_corpus_measures.py tests/test_reversal_reviews.py
      tests/checks/ops_governance/test_validate_reversal_stanzas.py tests/checks/ops_governance/test_check_source_registry.py
      tests/ci/test_actions_capacity_steps.py tests/ci/test_reversal_review_step.py tests/test_review_dates.py
      tests/test_field_semantics_event_projection.py && bin/venv-python -m scripts.schema_to_field_semantics --check
    expected: All pass and the generator reports no drift.
    fix_if: A failure in a new test is fixed in the code under test, never by weakening the assertion (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      These selectors are already standing guards in the suite both tiers run; a registry shard would only duplicate
      them and add a fresh-worktree replay to the fast tier's non-test budget, which PR #2198 found over its 270 s limit
      whenever a PR touches the verification registry.
  - step: 3
    phase: pre-deploy
    action: On the real tree, the two new predicates compute Decision 179's measures from the repository with its params.
    command: >-
      bin/venv-python -c "from scripts.preflight import decision_conditions as dc;
      r=dc.evaluate(); bad=[x.decision_id for x in r if x.state == 'MALFORMED']; assert not bad, bad;
      reg=dc._PREDICATE_REGISTRY;
      i=reg['decision_index_bytes_exceed'](max_bytes=110608);
      f=reg['decision_entries_per_plan_exceed'](window_days=90, max_entries_per_plan=0.30);
      assert (i, f) == (True, False), (i, f); print('D179_MEASURES_OK')"
    expected: Prints the marker and exits 0.
    fix_if: >-
      A history error means the clone is shallow (git fetch --unshallow) -- never default the predicate to False. If
      rec-3250 has landed and the index is under 110,608 bytes, index False is correct: record the measured size
      instead; an inflow True means the measured ratio passed 0.30, which is real news to report, not a fix.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Moment claim (the index size and the inflow ratio move with every merge); the unit tests guard the semantics.
  - step: 4
    phase: pre-deploy
    action: >-
      Among the stanzas present at base 4197aa93 the spread holds on the built tree, and the gate passes, running
      every gate-safe predicate and skipping only the gate=False one.
    command: >-
      BASE_MD=$(mktemp) && export BASE_MD && git show 4197aa9366bb8cb824f5bcd9d3f55b71a383b550:docs/DECISIONS.md >
      "$BASE_MD" &&
      bin/venv-python -c "import collections, os; from pathlib import Path; from scripts.preflight.decision_conditions import evaluate;
      base={x.decision_id for x in evaluate(paths=[Path(os.environ['BASE_MD'])], gate=True)};
      n=collections.Counter(x.review_by for x in evaluate(gate=True) if x.decision_id in base);
      top=max(n.values()); assert top <= 3, n.most_common(3);
      from scripts.checks.ops_governance.validate_reversal_stanzas import validate_reversal_stanzas;
      f=[]; validate_reversal_stanzas(f); assert not f, f; print('SPREAD_OK max=%d' % top)"
    expected: Prints the gate's PASS line, then SPREAD_OK with max at most 3.
    fix_if: >-
      A base stanza's date over 3 means an approved block was applied wrongly: re-apply the sidecar verbatim. A gate
      failure on a date over the ceiling of 10 is a plan defect to report; never re-date outside the sidecar.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Moment claim (later Decisions add stanzas); the standing guard is the gate's ceiling, tested in VP 2.
  - step: 5
    phase: pre-deploy
    action: Dry-run the sensor against the live reader (read-only; files nothing).
    command: >-
      out=$(AWS_PROFILE=agent_platform bin/venv-python -m scripts.preflight.reversal_reviews --dry-run --profile
      agent_platform) && echo "$out" && echo "$out" | grep -qE "^\[reversal_review\] summary due=[0-9]+" && echo "$out"
      | grep -qE "^\[reversal_review\] Decision 133 [a-zA-Z-]+ owned by rec-5273" && ! echo "$out" | grep -qE
      "^\[reversal_review\] Decision (133|173) .*would-file"
    expected: >-
      Exit 0: the summary line, Decision 133 owned by rec-5273, and no would-file line for 133 or 173 (173, once due,
      shows owned by rec-5082).
    fix_if: >-
      First read rec-5273 and rec-5082 with recs_by_ids: if one has closed, the would-file line is correct and the
      report names the change. Otherwise a would-file line for an owned stanza means the sweep or its regex is wrong;
      a reader error is surfaced, never swallowed.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Fast and full tiers before handoff; the full tier runs backgrounded (2 h limit) from the top-level session, never
      in the 10-minute foreground.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and validation_result verifies the head sha. Amendment-delta WARN lines for edited Decisions are
      expected.
    fix_if: >-
      A failure caused by this diff is fixed on the branch. A failure that reproduces on origin/main: the build stops
      BLOCKED (handoff_policy timeout_disposition blocked), cites or files its rec and surfaces a go/no-go to the
      operator per the implement skill.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      The governed deploy of the merge commit succeeded, every job included. Read with mcp__github__actions_list
      (list_workflow_runs, workflow deploy-ducklake-lambdas.yml) the run whose deploy gate resolved $MERGE_SHA (or the
      newest green commit after it), then list_workflow_jobs for that run, writing the jobs JSON to $DEPLOY_JOBS_JSON
      and the deploy-telemetry job's log (which carries any TELEMETRY_PRODUCTION_HOLD notice) to $DEPLOY_LOG
      (mcp__github__get_job_logs).
    command: >-
      test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
      jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
      want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke','deploy-telemetry-twin','telemetry-twin-smoke','deploy-telemetry'];
      ok=lambda w:jobs.get(w)=='success'; assert all(ok(w) for w in want),jobs;
      hold='TELEMETRY_PRODUCTION_HOLD' in open(os.environ['DEPLOY_LOG']).read(); assert hold or ok('telemetry-smoke'),jobs;
      print('DEPLOY_OK hold=%d'%hold)"
    expected: >-
      Every named job concluded success (a skipped job fails this step), and telemetry-smoke succeeded unless the log
      carries TELEMETRY_PRODUCTION_HOLD; then DEPLOY_OK hold=0 or hold=1. The sensor writes only through the ops writer
      (deploy-serving), so a hold does not block it; report hold=1 to the operator.
    fix_if: >-
      A failed deploy or smoke is this plan's to root-cause and fix forward, never a re-run to green (Decision 55). If
      PROD has become promote-only (Decision 252 cl.6) before this build merges, read the promotion run that carries
      $MERGE_SHA's artifact, not the per-merge SIT run.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      A convergence-health run on main after VP 7's deploy: dispatch it (mcp__github__actions_run_trigger, workflow
      convergence-health.yml, ref main, no inputs), wait for completion, save the health-check job log
      (mcp__github__get_job_logs) to $CH_LOG and the run's jobs (mcp__github__actions_list, method list_workflow_jobs, with steps) to $CH_JOBS.
    command: >-
      grep -E "\[reversal_review\] summary due=[0-9]+ filed=[0-9]+ owned=[0-9]+ malformed=[0-9]+" "$CH_LOG" && !
      grep -qE "\[reversal_review\] Decision (133|173) .*filed rec-" "$CH_LOG" && bin/venv-python -c "import json,os; j=json.load(open(os.environ['CH_JOBS'])); j=j.get('jobs',j) if isinstance(j,dict) else j;
      st={x['name']: x.get('conclusion') for y in j for x in y.get('steps',[])};
      assert st.get('File reversal reviews (rec-5264)') == 'success', st; print('STEP_OK')"
    expected: >-
      One summary line, then STEP_OK. Report the summary line verbatim; malformed above 0 means a predicate raised on
      main, and the line names the rec filed for it.
    fix_if: >-
      No line means the step did not run (check the main gate) or crashed: read the log and fix forward. A filed line
      for 133 or 173 is correct only if recs_by_ids shows its owner closed; otherwise it is a duplicate to root-cause. A red step
      with a portal error is a write failure to root-cause; never mark the step continue-on-error. A run red from
      another sensor's step is not this plan's defect: report it.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Re-run the sensor in dry-run on main after VP 8 and prove rec-5264 closed. With 133 and 173 owned this proves
      owned-stanza dedup live; sensor-filed dedup is proved hermetically (test_overdue_stanza_yields_exactly_one_rec), and
      the report says filed=0 when VP 8 filed nothing.
    command: >-
      out=$(AWS_PROFILE=agent_platform bin/venv-python -m scripts.preflight.reversal_reviews --dry-run --profile
      agent_platform) && echo "$out" | grep -qE "\[reversal_review\] summary due=[0-9]+" && ! echo "$out" | grep -q
      "would-file" && AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      r=make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5264'); assert r[0]['status']=='closed', r; print('REC_5264_CLOSED')"
    expected: >-
      The sensor exits 0 and prints its summary line with no would-file line after VP 8's run (every due stanza now
      has its one owner), then REC_5264_CLOSED. A crash or missing summary fails the step.
    fix_if: >-
      A would-file line after a live run means the filed rec is not found by its own prefix: fix the title or lookup.
      An open rec-5264 means the Resolves trailer was missing; close it through the portal with the merge SHA.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      The content reader's leg (Decision 79, Decision 272 residual, rec-5333). After VP 7, dispatch
      deploy-telemetry-content.yml from main with force true (mcp__github__actions_run_trigger), tell the operator in
      the thread that its deploy job waits on the telemetry-content-deploy Environment, and once it completes write the
      run's jobs (mcp__github__actions_list, method list_workflow_jobs) to $CONTENT_JOBS_JSON.
    command: >-
      test -s "$CONTENT_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['CONTENT_JOBS_JSON']));
      jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
      assert all(jobs.get(w)=='success' for w in ['gate','build','deploy','record']),jobs; print('CONTENT_DEPLOY_OK')"
    expected: The gate, build, deploy and record jobs concluded success, then CONTENT_DEPLOY_OK.
    fix_if: >-
      If the operator declines or defers the approval, record that in the report with the run link: the reader keeps
      the older field_semantics.yaml (it reads no rec source or agent_type) until the channel's next approved deploy,
      Decision 272's accepted residual. A BASELINE_UNPROVEN follows deploy-paths.yaml's code-deploy recovery, never a
      rebaseline without the operator.
    hermetic: false
    graduation: not-applicable
