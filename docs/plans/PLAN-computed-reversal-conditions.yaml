    red_green_expectation: red before (path not scanned), green after
  - source: config/agent/data_quality/source_registry.yaml
    behavior: reversal_review is a registered source, so the portal accepts the sensor's rec.
    verification_step: 2
    test_selector: tests/test_reversal_reviews.py::test_source_is_registered
    red_green_expectation: red before (unregistered), green after
constraints:
  - "No rescue agents or workaround loops (Decision 55)."
  - "Only the 60 approved blocks change docs/DECISIONS.md; no other entry, clause or line is edited. A wording change needs a new approval run through the plan owner, never an in-build edit."
  - "Review dates only ever move earlier; this plan postpones no review (Decision 133's stanza: never silently renew)."
  - "Surfacing, not gating: nothing here blocks a merge on a review date or a fired condition; the gate fails only a malformed stanza or a date over the ceiling, which only a stanza-editing PR can cause."
  - "The fast tier gets no dearer: the gate runs the predicates it runs today plus one file stat, no new --pre check, no verification-registry shard."
  - "Abort (audit step 1): a registered predicate that misfires on two consecutive sessions reverts to predicate null by a new approval run."
  - "No assertion is loosened (Decision 235): the gate keeps every predicate it runs today (a raising one still fails it); the only predicate it does not call is the new history-reading one, which it never ran; the capacity-steps order test keeps the capacity steps last."
context:
  - "Decision-scout: round 1 FLAGS_FOUND on Decision 194 (a parse-only gate would stop a raising roadmap predicate reddening the PR, clause 2). Pivot taken: register_predicate(gate=False) marks only the new history-reading predicate; the gate keeps calling every predicate it calls today. Round 2 FLAGS_FOUND, NOTE only: the pivot resolves the 194 WARN; three lines still said parse-only (reworded) and Decision 187's spirit (a later gate=False flip would demote a predicate silently) is met by test_gate_exempt_predicates_are_pinned. Round 3 (after critique round 1 moved review dates to review_dates.py) FLAGS_FOUND, NOTE only: adds Decision 128; Decision 187 spirit only partly met, since the pin is a same-PR-editable literal. Deferred with note: the pin catches an accidental gate=False flip; a deliberate demotion edits that literal in a reviewed diff and is a verification weakening under Decision 235 cl.1's human gate, which is the backstop; a base-ref-derived check is not built here, to keep the fast tier no dearer. Decisions triaged: 220 of 220. Roadmap items intersected: 6; CONFLICT: 0; RELATED: 6. Serves: NS.6 3/5. CITE: dec:61, dec:62, dec:84, dec:128, dec:133, dec:177, dec:179, dec:194, dec:215, dec:246."
