    verification_step: 2
    test_selector: tests/test_review_dates.py::test_next_review_date_skips_a_full_date_and_never_moves_later
    red_green_expectation: red before (module absent), green after
  - source: scripts/preflight/corpus_measures.py
    behavior: new-entry and added-plan counts over a first-parent window, and the loud failure on a short history.
    verification_step: 2
    test_selector: tests/test_corpus_measures.py::test_entries_per_plan_counts_new_ids_and_added_plans
    red_green_expectation: red before (module absent), green after
  - source: scripts/preflight/reversal_reviews.py
    behavior: one rec per due stanza, owner lookup by both prefixes, rec-5082-form fields, dry-run, fail-loud reads.
    verification_step: 2
    test_selector: tests/test_reversal_reviews.py::test_overdue_stanza_yields_exactly_one_rec
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/ops_governance/validate_reversal_stanzas.py
    behavior: the gate keeps running gate-safe predicates, skips gate=False ones, and fails a date over the ceiling.
    verification_step: 2
    test_selector: tests/checks/ops_governance/test_validate_reversal_stanzas.py::test_gate_skips_history_predicates_and_runs_the_rest
