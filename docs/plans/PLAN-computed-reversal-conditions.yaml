  - "decision_conditions.py: fires key, holds, the gate flag, the two predicate wrappers, --assert-not-surfaced (preflight_bucket unchanged). Post: its tests in VP 2 pass, and `bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-computed-reversal-conditions.yaml` shows it under 500 SLOC; if it is not, move the predicate wrappers into a sibling module or decompose into a facade package (Decision 80/104/124), never a budget raise (Decision 128)."
  - "review_dates.py and tests/test_review_dates.py. Post: VP 2's review-date tests pass."
  - "corpus_measures.py and its hermetic tests. Post: VP 2's corpus tests pass."
  - "reversal_reviews.py, the source_registry row, field_semantics.yaml regenerated (bin/venv-python -m scripts.schema_to_field_semantics), the SCANNED_PATHS entry and their tests (including test_overdue_stanza_yields_exactly_one_rec). Post: VP 2 and VP 5 pass."
  - "validate_reversal_stanzas.py: evaluate(gate=True), which runs every gate-safe predicate and skips only gate=False ones, plus the ceiling. Post: VP 2's gate tests pass."
  - "convergence-health.yml step, its composite_action_body_baseline.yaml r3_workflows row at the measured count, and the two workflow tests. Post: VP 2's workflow tests pass and validate --pre's validate_composite_action_shell_bodies passes."
  - "Apply the 60 sidecar blocks verbatim and regenerate docs/decisions-index.json (`bin/venv-python -m scripts.decisions_index --write`). Post: VP 1, 3 and 4 pass."
  - "CLOSURE, each outcome reported separately (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence): (a) readiness: bin/venv-python -m scripts.session.github_readiness; (b) set implementation_declared: true in this plan; (c) postflight evidence via bin/venv-python -m scripts.session.postflight --evidence <path>; (d) commit with `Resolves: rec-5264`; git fetch origin main && bin/venv-python -m scripts.session.rebase_resolve; (e) VP 6 on the committed clean tree, the full tier backgrounded with a 2 h limit; (f) post the #1963 line, push, open the PR, CI green, merge (squash) under standing_authorisation, and report PR, CI conclusion and merge SHA on their own line."
  - "Execute Verification Plan: run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55)."
  - "Report: what changed; the readiness, postflight, --verify-head and merge lines; then VP 7's deploy line, VP 8's summary line, VP 9's result, VP 10's content-deploy line or the operator's deferral, and the 7-day log_invocation reader baseline against which the sensor's 48 reads a day sit (Decision 215 reader-invocations-doubled)."
