schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "condition-reviews-167-177-179"
intent: >-
  Dispose of the eight reversal-condition reviews on Decisions 167, 177 and 179 (the first due 2026-11-17) so the
  condition monitor watches only conditions that can still fire and that a review can check: re-arm three with
  evaluable wording, retire two foreclosed conditions and 167's closed-set prose condition (a), keep and watch 167's
  same-PR split condition, correct 179's portal-read note, and re-decide 179's fired inflow condition as bound the
  read with no stock guard.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-condition-reviews-167-177-179.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5255
  (High), the contract-first retrospective's condition_reviews. Closes no roadmap criterion.
cites: [dec:167, dec:177, dec:178, dec:179, dec:196, dec:246]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the six blocks of docs/plans/approved/condition-reviews-167-177-179.yaml: the reversal stanza interiors
      of Decisions 167, 177 and 179 (Decision 177 clause 4) and one dated Update note after each entry's last line
      (amendment_forms blockquote_update), {{DATE}} filled with the build date (UTC) in all four places. Nothing else.
      docs/decisions-index.json is regenerated by `bin/venv-python -m scripts.decisions_index --write` (generator-touched,
      no row).
bundled_recommendations: [rec-5255]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - docs/DECISIONS.md equals main's text with the six approved sidecar blocks applied and {{DATE}} filled (scripts.roadmap.approved_text verify exits 0 with the digest in VP 1).
  - The condition monitor reads Decision 167 as not-due with review_by 2027-02-17 and conditions mis-routed-past-both-gates and same-pr-split-to-evade-cap; 177 not-due, 2027-05-25, legitimate-shape-blocked-twice only; 179 not-due, 2027-03-01, index-read-context-cost, inflow-per-plan and t15-portal-read; every stanza well-formed.
  - rec-5255's acceptance command exits 0, and after merge rec-5255 is closed with a resolution naming this plan.
  - docs/decisions-index.json is fresh (validate_decisions_index_freshness passes).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed Decision text is exactly the approved text.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug condition-reviews-167-177-179 --expect
      37a3454ce41b148eae2cb49e7874dcb87b80ec3f6f5dc22dd1769cfeee22ff1a  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier (git-ops.yaml
      merge_step_coverage).
  - step: 2
    phase: pre-deploy
    action: Prove the condition monitor reads the three re-armed stanzas as decided, all well-formed.
    command: >-
      bin/venv-python -c "from scripts.preflight.decision_conditions import evaluate;
      r={str(x.decision_id): x for x in evaluate()};
      assert all(x.state != 'MALFORMED' for x in r.values()), [x.decision_id for x in r.values() if x.state == 'MALFORMED'];
      want={'167': ('2027-02-17', ['mis-routed-past-both-gates', 'same-pr-split-to-evade-cap']),
      '177': ('2027-05-25', ['legitimate-shape-blocked-twice']),
      '179': ('2027-03-01', ['index-read-context-cost', 'inflow-per-plan', 't15-portal-read'])};
      got={d: (r[d].review_by, [c.id for c in r[d].conditions]) for d in want};
      assert all(r[d].state == 'not-due' for d in want), {d: r[d].state for d in want};
      assert got == want, got; print('STANZAS_OK')"
    expected: Prints the marker and exits 0.
    expected_literals: [STANZAS_OK]
    fix_if: >-
      A MALFORMED stanza or a different date or condition list -- the sidecar was applied wrongly; re-apply it. Never
      edit the expected values here.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim: the dates and condition lists change at the next review, and validate_reversal_stanzas already
      guards well-formedness in both tiers.
  - step: 3
    phase: pre-deploy
    action: Run rec-5255's own acceptance command.
    command: >-
      ! awk '/^## Decision 167:/{f=1;print;next} /^## Decision /{f=0} f' docs/DECISIONS.md | grep -q 'review_by: 2026-11-17'
      && ! awk '/^## Decision 177:/{f=1;print;next} /^## Decision /{f=0} f' docs/DECISIONS.md | grep -q 'review_by: 2026-11-25'
      && ! awk '/^## Decision 179:/{f=1;print;next} /^## Decision /{f=0} f' docs/DECISIONS.md | grep -q 'review_by: 2026-12-01'
      && echo REC_5255_ACCEPT_OK
    expected: Prints the marker and exits 0.
    expected_literals: [REC_5255_ACCEPT_OK]
    fix_if: An old review date survives -- the stanza block was not applied.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Moment claim tied to these three review dates; the merge step runs the rec's own acceptance.
  - step: 4
    phase: pre-deploy
    action: Prove the generated index matches the edited corpus.
    command: bin/venv-python -m scripts.decisions_index --check
    expected: Exit 0 (index fresh).
    fix_if: Stale -- run `bin/venv-python -m scripts.decisions_index --write` and commit the index.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_decisions_index_freshness, which runs in both tiers.
  - step: 5
    phase: pre-deploy
    action: >-
      Fast and full tiers before handoff; the full tier runs backgrounded (2 h limit) from the top-level session, never
      in the 10-minute foreground.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and validation_result verifies the head sha. The full tier is started in the background with a
      2 h limit from the top-level session; its verdict is --verify-head's, never a pipe's exit status. Amendment-delta
      WARN lines for Decisions 167, 177 and 179 are expected.
    fix_if: >-
      A failure caused by this diff is fixed on the branch. A failure that reproduces on origin/main: the build stops
      BLOCKED (handoff_policy timeout_disposition blocked; red-main-recovery.yaml slo_clock), cites or files its rec,
      surfaces a go/no-go to the operator per the implement skill, and never pushes or opens the PR without a passing
      --verify-head.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: Prove rec-5255 closed after the merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5255']); print(rows[0]['status'], rows[0]['resolution'])"
    expected: Prints closed and a resolution naming PLAN-condition-reviews-167-177-179 and the merge SHA.
    fix_if: Still open -- run the merge_step recover route in git-ops.yaml merge_step_coverage; never close it by hand without the merge SHA.
    hermetic: false
test_obligations: []
constraints:
  - "No rescue agents or workaround loops (Decision 55)."
  - "Only the six approved blocks change docs/DECISIONS.md; no other entry, clause or line is edited (Decision 177 append-only policy; Decision 246 binding). A wording change needs a new approval run through the plan owner, never an in-build edit."
  - "No assertion is loosened (Decision 235); the size check's amendment-delta WARN lines for Decisions 167, 177 and 179 are expected and never silenced."
context:
  - "Decision-scout r4 NO_FLAGS on the written plan after critique r2 (fingerprint in gate_rounds). Decisions triaged: 217 of 217. Roadmap items intersected: 3; CONFLICT: 0; RELATED: 3 (T1.5, T1.17, T2.48; file-level only). Serves: NS.6 2/5. CITE: 167, 177, 178, 179, 196, 246. r1 was FLAGS_FOUND: the first draft retired 179's t15-portal-read as foreclosed, but T1.5 c1 still plans a decisions read portal the scout would read; r2 to r4 keep it and correct the note (Decision 196 cl.1 forecloses only git retirement)."
  - "Operator dispositions 2026-11-17 (in the plan thread): all eight as recommended except t15-portal-read, kept with its note corrected per scout r1; 179's fired inflow condition re-decided as bound the read (rec-3250), no stock guard, inflow-per-plan in its place. Source: audits/contract-first-retrospective-177c8f37.yaml condition_reviews; a blind advisor consult endorsed thresholds 110,608 bytes and 0.30 entries per plan and the review dates."
  - "Decision 133's overdue review (2026-09-30) is not edited here: the operator chose to supersede it; rec-5273 owns that, outside this plan and the audit remit."
  - "Measured 2026-11-17: docs/decisions-index.json 187,040 bytes, so index-read-context-cost would fire today; it is judged at review (2027-03-01) and rec-3250 owns the bound. The two repo_state conditions ship predicate null until rec-5264 registers predicates."
  - "Sizes after the blocks (scratch apply of the round-2 sidecar, 2026-11-17): Decision 167 8,942 bytes, 177 7,049, 179 7,996; validate_decisions_size prints amendment-delta WARN lines (rec-3243 leg), never a failure. Decision 167 already exceeds its own cap (rec-3179)."
  - "Ordering: this build merges before the Decision 167 amendment build (rec-3023, rec-5260), which also edits Decision 167; whichever rebases re-anchors only."
  - "Cross-project: editing Decisions 167, 177 and 179 changes the scout-input fingerprint of any in-flight plan that cites them (Agents in GitHub's re-scout barrier, Decision 262). Before merge, the build posts one line on issue #1963 naming the three Decisions."
  - "Red-overlap 2026-11-17 13:40Z: verdict blocked by rec-5247 (telemetry-reader smoke 504; rule slo_breached, shared none; Feedback Loop owns its repair). Deferral rationale: this plan shares no file or path with that red (docs/DECISIONS.md and its generated index only) and does not repair it, so rec-5247 is deferred to its owning repair, not bundled here."
  - "plan_obligations 2026-11-17: 14 unbuilt plans also scope docs/DECISIONS.md; none binds the three stanzas or the three anchor lines here, so whichever builds second rebases (sidecar blocks re-anchor on unique text)."
  - "Sidecar digests (round 2): wording 37a3454ce41b148eae2cb49e7874dcb87b80ec3f6f5dc22dd1769cfeee22ff1a, approved words 9775bb776f2f9576bb027cabae27cfe0ec3731bc66c65f8c9a003ebeb8bad960 (the approval run looks up the latter, Decision 246 cl.3)."  # pragma: allowlist secret
  - "Approvals at build start: the Decision wording only, bound by the sidecar and its approved-text approval run (Decision 246); the build merges under standing_authorisation once validate_merge_step is green."
