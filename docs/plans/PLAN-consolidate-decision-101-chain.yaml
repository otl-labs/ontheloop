pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Rebase onto origin/main; confirm the sidecar's base_sha is an ancestor of HEAD and Decision 101's body is unchanged since base_sha (else the manifest's units differ; stop and report a plan defect); run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-consolidate-decision-101-chain.yaml and stop on a verdict other than clear, except a blocked verdict whose reds are only rec-5664, rec-5665 and rec-5666 with no shared path (operator deferral, context).
  - Apply every sidecar block's after-text verbatim (scripts.roadmap.approved_text has only record and verify; VP 1 proves the result), filling {{N}} with the next free number and {{DATE}} with the build date; regenerate docs/decisions-index.json with scripts.decisions_index --write.
  - Remove census row S5-101.
  - Execute Verification Plan steps 1-5 -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55).
  - >-
    CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true in the
    implementation commit, which carries 'Resolves: rec-4389'; git fetch origin main && git rebase origin/main (refill
    {{N}} if main gained a Decision, and re-check step 1's precondition); re-run red_overlap under step 1's stop rule and its deferral exception; re-run verification steps
    1-5 on the closure commit and run step 6 last on that same commit, backgrounded from the top-level session with a
    2 h limit; push.
  - >-
    Handoff: open the PR ready for review only after steps 1-6 pass; subscribe to its activity; post the #1963 entry
    naming DECISIONS.md (the new entry and the 101 body), the manifest, glossary.yaml, the census row and the five
    carried-forward amenders, and that citations of Decision 101 now resolve through the stub; merge per
    docs/contracts/git-ops.yaml resolves_trailer and merge_step (merge_step premerge, explicit squash commit_message
    carrying 'Resolves: rec-4389' and never naming rec-5668, expectedHeadSha, merge_step readback); then run
    step 7.
  - >-
    Report, as separate facts: what was implemented; the readiness state (bin/venv-python -m
    scripts.session.github_readiness; unknown is unproven, never ready); the full-tier exit plus validation_result
    --verify-head for the pushed HEAD; structured postflight evidence (bin/venv-python -m scripts.session.postflight
    --evidence); the push, PR number, CI result and read-back merge SHA; step 7's read-back.
rollback: >-
  Before merge, drop the branch. After merge, roll forward, never revert: a new Decision supersedes the consolidating
  entry and restates what is to be restored; the stub stays (Decision 177). The re-decision is that new entry.
