schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: consolidate-decision-101-chain
intent: >-
  Retire Decision 101 (rec-4389, operator-named consolidation 5 of 6, step 1 of its full supersession): one new
  Decision restates 101's current rule unchanged -- external marks on external surfaces, internal identifiers frozen
  behind a separate explicit decision, the marketing-prose exception, the public site's content boundary with the
  2026-10-17 financial-figures reading, Cloudflare Pages hosting and the positioning -- and supersedes 101, which
  compacts to a stub, so a reader needs one entry instead of six; the five amenders are carried forward and the
  clause-by-clause re-decision moves to rec-5668.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-consolidate-decision-101-chain.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-4389
  (Medium), the fifth of the six consolidations the operator named on 2026-11-20 (census row S5-101,
  audits/standards-cleanup-census.yaml). Closes no roadmap criterion.
cites: [dec:75, dec:84, dec:86, dec:100, dec:101, dec:127, dec:149, dec:171, dec:177, dec:181, dec:198, dec:200, dec:202, dec:209, dec:218, dec:220, dec:221, dec:232, dec:237, dec:240, dec:242, dec:246, dec:247, dec:270, dec:276, dec:278, dec:279]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Sidecar blocks DECISIONS-1 (the consolidating Decision: supersedes 101 only, amends nothing, delegates nothing)
      and DECISIONS-101 (a compacted-stub-v2 stub whose Decision line names every amender and carries a clause-only
      letter map; 101's points are lettered, so the manifest renders no Point map).
  - file: docs/decision-migration/consolidations/consolidate-decision-101-chain.yaml
    action: Create
    purpose: >-
      Sidecar block consolidation-manifest: all 17 units of 101 at base_sha disposed (restated, held or retired);
      carried_forward 171, 198, 202, 209 and 237.
  - file: docs/contracts/glossary.yaml
    action: Modify
    purpose: Sidecar blocks glossary-noted and glossary-log drop 101 from read_as.noted_decisions with an amendment_log row (the 144, 126 and 92 chain precedent).
  - file: audits/standards-cleanup-census.yaml
    action: Modify
    purpose: Remove row S5-101, whose owner rec-4389 this change closes.
bundled_recommendations: [rec-4389]
followon_recs: [rec-5668]
infrastructure_dependencies: []
acceptance_criteria:
  - The committed Decision, stub, manifest and glossary text equals the approved sidecar (approved_text verify exits 0).
  - Decision 101 derives currency superseded_compacted, superseded by the new Decision, whose title says it supersedes Decision 101; rec-4389's acceptance command passes.
  - The new Decision measures at or under decision-entry.yaml size_governance.measured_size_norm.cap_bytes, and docs/DECISIONS.md shrinks.
  - consolidation.manifest_problems reports nothing, so every unit of 101 is disposed and every target resolves; 171, 198, 202, 209 and 237 stay live.
  - Census row S5-101 is gone and the census verifies with its owners read.
  - validate --pre passes, the decisions index is fresh and the full tier passes before hand-off.
  - rec-4389 is closed by the merge's Resolves trailer, and rec-5668 stays open.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed governed text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug consolidate-decision-101-chain --expect ab09ad548fb3a3dc6cdeb2c422fb712b17b2b14d18f849d82bb18f9d63846428
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier.
  - step: 2
    phase: pre-deploy
    action: Prove rec-4389's acceptance, that the manifest resolves and that 101 compacted onto the new Decision.
    command: >-
      grep -qE '^## Decision [0-9]+: .*[Ss]upersedes Decision 101([^0-9]|$)' docs/DECISIONS.md &&
      bin/venv-python -m scripts.decisions_index --check &&
      bin/venv-python -c "import json, subprocess; from pathlib import Path; from scripts.checks.decisions import
      consolidation as c; rd=lambda root, rel: (lambda r: r.stdout if r.returncode == 0 else None)(subprocess.run(['git',
      'show', 'origin/main:' + rel], capture_output=True, text=True)); p=c.manifest_problems(Path('.'), rd); assert not p,
      p; rows={r['number']: r for r in json.load(open('docs/decisions-index.json'))['decisions']}; new=[n for n, r in
      rows.items() if (r.get('supersedes') or []) == [101]]; assert len(new) == 1, new; r=rows[101]; assert
      r.get('currency') == 'superseded_compacted' and r.get('superseded_by') == new[0], r; live={n: rows[n].get('currency')
      for n in (171, 198, 202, 209, 237) if rows[n].get('currency') == 'superseded_compacted'}; assert not live, live;
      print('CHAIN_101_COMPACTED_OK')"
    expected: Exit 0 and the marker.
    expected_literals: [CHAIN_101_COMPACTED_OK]
    fix_if: A manifest problem, 101 not superseded_compacted or a carried-forward entry compacted -- a sidecar block was applied wrongly; re-apply it. Never edit the manifest to match a wrong tree.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_delegated_key_changes (manifest resolve) and validate_decisions_index_freshness, both in the fast tier; the rec grep runs once more at closure through the Resolves trailer.
  - step: 3
    phase: pre-deploy
    action: Run the consolidation, supersession, census, index, glossary, decision-entry and size tests.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions tests/checks/contracts tests/decisions_md
      tests/test_decisions_index.py -q
    expected: All pass.
    fix_if: A failure -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The fast tier's affected-set selection runs these modules on every PR touching their sources.
  - step: 4
    phase: pre-deploy
    action: Record the measurement for the PR body.
    command: >-
      bin/venv-python -c "import re, subprocess, yaml; from scripts.decisions_md import iter_decision_sections; from
      scripts.checks.decisions import entry_measure as m; cap=yaml.safe_load(open('docs/contracts/decision-entry.yaml'))['size_governance']['measured_size_norm']['cap_bytes'];
      t=open('docs/DECISIONS.md').read(); base=len(subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True).stdout);
      b={int(re.search(r'Decision (\d+)', h.group(0)).group(1)): s for h, s in iter_decision_sections(t)}; n=next(k for k, s in
      b.items() if 'supersedes: [101]' in s); size=m.measured_bytes(b[n], (m.METADATA_ENVELOPE, m.REVERSAL_CONDITIONS,
      m.OPTIONS_CONSIDERED)); print('measured', size, 'cap', cap, 'whole', len(b[n].encode()), 'file_delta', len(t.encode()) - base);
      assert size <= cap and len(t.encode()) < base; print('CHAIN_101_FITS')"
    expected: The four figures and the marker; measured at or under cap, file_delta negative.
    expected_literals: [CHAIN_101_FITS]
    fix_if: Over the cap -- Decision 278 cl.5's abort fired; stop and report (a rec records why); never trim approved words.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_decisions_size enforces the cap in the fast tier; this step only records the figures.
  - step: 5
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: vp-red-before.yaml refuses to graduate a scripts.validate step (the recursion refusal), and PR CI runs this tier on every PR.
  - step: 6
    phase: pre-deploy
    action: Run the full tier before hand-off (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure -- fix in scope and re-run; outside scope is a plan defect, never a hand-off to PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Prove the merge synced the stub and the new Decision to ops_decisions, closed rec-4389 and left rec-5668 open, and that the census reads clean with its owners.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json; rows={r['id']: r for r in
      map(json.loads, open('logs/.decisions-index.jsonl'))}; assert rows['dec-101']['status'] == 'Superseded',
      rows['dec-101']; new=[r for r in rows.values() if 'public identity in one entry' in (r.get('title') or '')]; assert
      len(new) == 1 and new[0]['status'] == 'Decided', new; print('OPS_DECISIONS_OK')" && bin/venv-python -c "from
      src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
      fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4389', 'rec-5668']); st={r['id']:
      r['status'] for r in rows}; assert st.get('rec-4389') == 'closed' and st.get('rec-5668') == 'open', st;
      print('RECS_OK')" && bin/venv-python -m scripts.checks.decisions.standards_census --verify
      audits/standards-cleanup-census.yaml --read-owners
    expected: OPS_DECISIONS_OK, RECS_OK and a census verify with no defect line.
    fix_if: dec-101 still Decided or the new row missing -- the rec-autoclose backfill failed; read its run and re-run the backfill through the portal. rec-4389 open -- the Resolves trailer was missing; close it through update_rec with the merge sha. The re-decision rec closed -- reopen it through update_rec.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/DECISIONS.md
    behavior: Decision 101 stays compacted and every unit stays accounted for.
    verification_step: 3
    test_selector: tests/checks/decisions/test_consolidation.py
    waiver_reason: test_consolidation.py tests the manifest machinery on fixtures; this chain's own accounting is held by validate_delegated_key_changes over the manifest on every run (step 2), so no chain-specific module is added.
  - source: docs/decision-migration/consolidations/consolidate-decision-101-chain.yaml
    behavior: Every unit is disposed and every target resolves.
    verification_step: 5
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: validate_delegated_key_changes already fails any manifest problem on every run while a manifest exists; a new test would duplicate it.
  - source: docs/contracts/glossary.yaml
    behavior: read_as.noted_decisions names no compacted entry.
    verification_step: 5
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: validate_glossary already checks the noted list against the corpus on every run (the 144, 126 and 92 chain precedent), so a new test would duplicate it.
  - source: audits/standards-cleanup-census.yaml
    behavior: The census names no exception whose owner rec is closed.
    verification_step: 7
    command: bin/venv-python -m scripts.checks.decisions.standards_census --verify audits/standards-cleanup-census.yaml --read-owners
    waiver_reason: The census verify reads owners after merge (step 7); a row whose owner closed is a census defect line, which the removal prevents; a unit test cannot see the live owner state.
constraints:
  - Approved words are copied from docs/plans/approved/consolidate-decision-101-chain.yaml verbatim; {{N}} and {{DATE}} are filled at build (Decision 217 cl.5).
  - Compaction is not reversible once merged (Decision 149); headers and numbers stay.
  - Edits no other Decision; the carried-forward amenders 171, 198, 202, 209 and 237 keep their bodies and edges.
  - Restates only; no clause re-decides Decision 101 (the operator decides each clause in rec-5668's plan).
  - No test, graduated record, AGENTS.md text or citation changes; no contract key is delegated, and only glossary.yaml's noted list and log change.
  - No rescue agents or workaround loops (Decision 55).
