execution_steps:
  - Rebase onto origin/main; confirm #2428 has merged, the sidecar's base_sha is an ancestor of HEAD, and the bodies of Decisions 126 and 183 are unchanged since base_sha (else the manifest's units differ; stop and report a plan defect); run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-consolidate-decision-126-chain.yaml and stop on a verdict other than clear.
  - Apply every sidecar block's after-text verbatim (scripts.roadmap.approved_text has only record and verify; VP 1 proves the result), filling {{N}} with the next free number and {{DATE}} with the Decision 246 approval run's date (the Tier A marker's approval pointer names that run, so the date is the run's, not the build's); regenerate docs/decisions-index.json with scripts.decisions_index --write.
  - Remove census row S5-126, and delete the stale 126->125 waiver from config/decision_supersession_waivers.yaml.
  - "Precondition: context records the operator's Decision 235 cl.1 approval of the retirement (else stop and ask the coordinator). Retire the record exactly as its sidecar blocks bind it, by git mv of config/agent/verification_registry/entries/decision-north-star-promoted-appends.yaml into config/agent/verification_registry/entries/deprecated/ (content untouched). Graduate VP step 5 through the implement skill's graduation flow: config/agent/verification_registry/entries/decision-north-star-promoted-appends-126-compacted.yaml (primitive_slot command_exit_zero, guard_target docs/DECISIONS.md, guard_symbol null, plan_slug consolidate-decision-126-chain, the step's python -c argument as its argv); the differential admission gate must see it fail at origin/main."
  - Execute Verification Plan steps 1-8 -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55).
  - >-
    CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true in the
    implementation commit, which carries 'Resolves: rec-5446, rec-3298'; git fetch origin main && git rebase origin/main
    (refill {{N}} if main gained a Decision, and re-check step 1's precondition); re-run red_overlap; re-run
    verification steps 1-8 on the closure commit and run step 9 last on that same commit, backgrounded from the
    top-level session with a 2 h limit; push.
  - >-
    Handoff: open the PR ready for review only after steps 1-9 pass; subscribe to its activity; post the #1963 entry
    naming DECISIONS.md, AGENTS.md, terraform/CLAUDE.md, north-star.yaml, the four test files and their owners, the
    retired record from PLAN-north-star-tier-a and the ten carried-forward amenders; file the two follow-on recs;
    merge per docs/contracts/git-ops.yaml resolves_trailer and merge_step (merge_step premerge, explicit squash
    commit_message carrying 'Resolves: rec-5446, rec-3298', expectedHeadSha, merge_step readback); then run step 10.
  - >-
    Report, as separate facts: what was implemented; the readiness state (bin/venv-python -m
    scripts.session.github_readiness; unknown is unproven, never ready); the full-tier exit plus validation_result
    --verify-head for the pushed HEAD; structured postflight evidence (bin/venv-python -m scripts.session.postflight
    --evidence); the push, PR number, CI result and read-back merge SHA; step 10's read-back.
rollback: >-
  Before merge, drop the branch. After merge, roll forward, never revert: a new Decision supersedes the consolidating
  entry and restates what is to be restored; the stubs stay (Decision 177).
