schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: consolidate-decision-126-chain
intent: >-
  Retire Decision 126's amendment chain (rec-5446, operator-named consolidation 2 of 6): one new Decision states the
  deployment model's standing rules -- three agent intents with one trigger each, two heal verbs under one routing rule,
  and an admin tier where an agent prepares and the operator runs -- and supersedes Decisions 126 and 183, which compact
  to stubs, so a reader needs one entry instead of eleven; the four surfaces that still say an agent runs the admin apply
  are brought into line with Decision 256 cl.3, settling rec-3298.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-consolidate-decision-126-chain.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5446
  (Medium), the second of the six consolidations the operator named on 2026-11-20 (census row S5-126,
  audits/standards-cleanup-census.yaml), bundling rec-3298. Closes no roadmap criterion.
cites: [dec:101, dec:120, dec:126, dec:149, dec:177, dec:183, dec:196, dec:204, dec:213, dec:223, dec:230, dec:235, dec:239, dec:240, dec:243, dec:244, dec:246, dec:248, dec:251, dec:252, dec:256, dec:257, dec:265, dec:275, dec:276, dec:277, dec:278, dec:279]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Insert the consolidating Decision (block DECISIONS-1) and replace the bodies of Decisions 126 and 183 with compacted stubs carrying their point maps (blocks DECISIONS-126, DECISIONS-183), exactly as the approved-text sidecar binds them.
  - file: docs/decision-migration/consolidations/consolidate-decision-126-chain.yaml
    action: Create
    purpose: "The consolidation manifest (Decision 278 cl.4): one disposition per unit of Decisions 126 and 183 at base_sha, the ten carried-forward amenders and base_sha (block consolidation-manifest)."
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: "admin_out_of_band.recovery (a key the new Decision delegates) and the procedure's description and first step say the operator runs admin steps an agent prepares (Decision 256 cl.3); decision points at the new Decision; one amendment_log row, and the 2026-11-16 row compacts to a terse row (Decision 275 cl.3-4) so the file stays under its byte budget (blocks deploy-paths-*)."
  - file: docs/contracts/terraform-cc-web-operations.yaml
    action: Modify
    purpose: operator_only_break_glass.scope says the operator runs the apply an agent prepares; one amendment_log row (blocks cc-web-operations-*).
  - file: AGENTS.md
    action: Modify
    purpose: The deployment-model line points at the new Decision and says the operator runs the admin-tier apply an agent prepares (blocks agents-pointer, agents-admin-tier).
  - file: terraform/CLAUDE.md
    action: Modify
    purpose: The bold apply rule says the operator runs the admin-tier apply an agent prepares (block terraform-claude-admin-tier).
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: The S1 aggregate and terraform/CLAUDE.md budgets ratchet down to the two surfaces' new sizes (zero headroom both ways; blocks prose-budget-*).
  - file: docs/contracts/north-star.yaml
    action: Modify
    purpose: "NS.9's carried_by and detail name the new Decision in place of 126, under the Tier A guard: one marker citing the new Decision with the operator's approval pointer and one amendment_log row (Decision 243 cl.5-6; blocks north-star-*)."
  - file: tests/checks/contracts/test_validate_tier_a_amendment_guard.py
    action: Modify
    purpose: "The fixture copies the real north-star.yaml beside a fixture corpus; it strips the file's own markers, whose cited Decisions that corpus lacks, so the first real marker does not red 15 nodes (blocks tier-a-test-*)."
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated by scripts.decisions_index --write (126 and 183 superseded_compacted, the new Decision current).
  - file: docs/contracts/glossary.yaml
    action: Modify
    purpose: read_as.noted_decisions drops 126, compacted to a stub, with one amendment_log row (blocks glossary-*), as the Decision 277 build did for 154 and 190.
  - file: tests/checks/decisions/test_sit_decision_records.py
    action: Modify
    purpose: "126 joins the compacted set, so its SIT note retires with its body and its stub must name the SIT Decision (block sit-test-compacted)."
  - file: tests/checks/decisions/test_revise_route_decision_records.py
    action: Modify
    purpose: "183 compacts, so the note test becomes a stub test: 183 is Superseded and its stub names the REVISE-route Decision (block revise-route-test-183)."
  - file: tests/checks/decisions/test_telemetry_production_catalog_decision.py
    action: Modify
    purpose: "The annotation loop keeps 216, 213 and 81 and asserts 126's stub names the telemetry catalog Decision (block telemetry-catalog-test-126)."
  - file: tests/test_decisions_index.py
    action: Modify
    purpose: "The category-tag pin follows the deployment model to 126's successor, since a compacted stub carries no category_tags (block decisions-index-test-126)."
  - file: audits/standards-cleanup-census.yaml
    action: Modify
    purpose: Remove exception row S5-126, whose root is no longer a candidate once 126 compacts.
  - file: config/decision_supersession_waivers.yaml
    action: Modify
    purpose: Delete the 126->125 waiver, stale once 126's body no longer amends Decision 125 (validate_supersession_annotations WARNs a stale waiver).
  - file: config/agent/verification_registry/entries/decision-north-star-promoted-appends.yaml
    action: Delete
    purpose: "Retired by git mv into entries/deprecated/: it pins a Promoted note in 14 entries including 126, whose body compacts to a stub, so it would fail permanently (block retire-decision-north-star-promoted-appends); VP step 5 graduates its replacement."
  - file: config/agent/verification_registry/entries/deprecated/decision-north-star-promoted-appends.yaml
    action: Create
    purpose: The same record, moved by a 100% rename with content byte-identical (block retired-decision-north-star-promoted-appends).
bundled_recommendations: [rec-5446, rec-3298]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The committed Decision, stub, manifest, contract, surface, test and retired-record text equals the approved sidecar (approved_text verify exits 0).
  - Decisions 126 and 183 derive currency superseded_compacted, each superseded by the new Decision; rec-5446's and rec-3298's acceptance commands pass.
  - The new Decision measures at or under decision-entry.yaml size_governance.measured_size_norm.cap_bytes.
  - consolidation.manifest_problems reports nothing, so every unit of 126 and 183 is disposed, every target resolves and each stub's point map matches.
  - NS.9's carried_by names the new Decision in place of 126 under a Tier A marker citing it, and validate_tier_a_amendment_guard and validate_north_star pass on the real tree.
  - The graduated record that pinned 126's NS.9 note is retired by a 100% rename into entries/deprecated/, and its replacement passes at head and fails at origin/main.
  - validate --pre passes, the decisions index is fresh and the full tier passes before hand-off.
  - rec-5446 and rec-3298 are closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed governed text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug consolidate-decision-126-chain --expect 112a3ccb16e0cf4b066c20a1bca59c90a6fd3187d6598b9056b7a0c4ddbadacf
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier.
  - step: 2
    phase: pre-deploy
    action: Prove rec-5446's and rec-3298's own acceptance, that the manifest resolves and that the chain compacted onto the new Decision.
    command: >-
      awk '/^## Decision 126:/{f=1;next} /^## Decision [0-9]+:/{f=0} f' docs/DECISIONS.md | grep -q '^\*\*Superseded by:
      Decision [0-9]' && awk '/^## Decision 126:/{f=1;next} /^## Decision [0-9]+:/{f=0} f' docs/DECISIONS.md | grep -q
      '^\*\*Status:\*\* Superseded' && ! grep -qE 'explicitly direct(s|ed) (the apply|it)' AGENTS.md terraform/CLAUDE.md
      docs/contracts/deploy-paths.yaml docs/contracts/terraform-cc-web-operations.yaml && grep -qE 'operator (reviews it
      and )?runs' docs/contracts/deploy-paths.yaml && grep -q 'runs every admin apply, write and secret read'
      docs/contracts/deploy-paths.yaml && bin/venv-python -m scripts.decisions_index --check &&
      bin/venv-python -c "import json, subprocess; from pathlib import Path; from scripts.checks.decisions import
      consolidation as c; rd=lambda root, rel: (lambda r: r.stdout if r.returncode == 0 else None)(subprocess.run(['git',
      'show', 'origin/main:' + rel], capture_output=True, text=True)); p=c.manifest_problems(Path('.'), rd); assert not p,
      p; rows={r['number']: r for r in json.load(open('docs/decisions-index.json'))['decisions']}; new=[n for n, r in
      rows.items() if sorted(r.get('supersedes') or []) == [126, 183]]; assert len(new) == 1, new; bad={n:
      (rows[n].get('currency'), rows[n].get('superseded_by')) for n in (126, 183) if rows[n].get('currency') !=
      'superseded_compacted' or rows[n].get('superseded_by') != new[0]}; assert not bad, bad; print('CHAIN_126_COMPACTED_OK')"
    expected: Exit 0 and the marker.
    expected_literals: [CHAIN_126_COMPACTED_OK]
    fix_if: A manifest problem, a victim not superseded_compacted or a surface still naming the old reading -- a sidecar block was applied wrongly; re-apply it. Never edit the manifest to match a wrong tree.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_delegated_key_changes (manifest resolve) and validate_decisions_index_freshness, both in the fast tier; the rec greps run once more at closure through the Resolves trailer.
  - step: 3
    phase: pre-deploy
    action: Run the edited tests, the Tier A guard and north-star tests and the consolidation, supersession and census tests.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions/test_sit_decision_records.py
      tests/checks/decisions/test_revise_route_decision_records.py
      tests/checks/decisions/test_telemetry_production_catalog_decision.py tests/test_decisions_index.py
      tests/checks/contracts/test_validate_tier_a_amendment_guard.py tests/checks/contracts/test_validate_north_star.py
      tests/test_north_star_shortlist.py tests/checks/decisions/test_consolidation.py
      tests/checks/decisions/test_standards_census.py tests/checks/decisions/test_validate_supersession_annotations.py
      tests/checks/contracts/test_validate_glossary.py -q
    expected: All pass.
    fix_if: A failure -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The fast tier's affected-set selection runs these modules on every PR touching their sources.
  - step: 4
    phase: pre-deploy
    action: Record the measurement for the PR body.
    command: >-
      bin/venv-python -c "import re, subprocess, yaml; from scripts.decisions_md import iter_decision_sections; from
      scripts.checks.decisions import entry_measure as m; cap=yaml.safe_load(open('docs/contracts/decision-entry.yaml'))['size_governance']['measured_size_norm']['cap_bytes'];
      t=open('docs/DECISIONS.md').read(); base=len(subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True).stdout);
      b={int(re.search(r'Decision (\d+)', h.group(0)).group(1)): s for h, s in iter_decision_sections(t)}; n=next(k for k, s in
      b.items() if 'supersedes: [126, 183]' in s); size=m.measured_bytes(b[n], (m.METADATA_ENVELOPE, m.REVERSAL_CONDITIONS,
      m.OPTIONS_CONSIDERED)); print('measured', size, 'cap', cap, 'whole', len(b[n].encode()), 'file_delta', len(t.encode()) - base);
      assert size <= cap and len(t.encode()) < base; print('CHAIN_126_FITS')"
    expected: The four figures and the marker; measured at or under cap, file_delta negative.
    expected_literals: [CHAIN_126_FITS]
    fix_if: Over the cap -- Decision 278 cl.5's abort fired; stop and report (a rec records why); never trim approved words.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_decisions_size enforces the cap in the fast tier; this step only records the figures.
  - step: 5
    phase: pre-deploy
    action: >-
      THE RETIRED NORTH-STAR RECORD'S REPLACEMENT. decision-north-star-promoted-appends' leg for the other 13 promoted
      entries is kept verbatim; its Decision 126 leg becomes: 126 is Superseded, and its successor serves NS.9 and
      carries the "**Promoted:** this entry's intent is carried as NS.9 in docs/contracts/north-star.yaml" line.
    command: 'bin/venv-python -c "from pathlib import Path; import re; from scripts.decisions_md import iter_decision_headings as h; t=Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); m=h(t); s={int(x.group(1)): t[x.start():(m[i + 1].start() if i + 1 < len(m) else len(t))] for i, x in enumerate(m)}; q=(''> **Update ('', ''Promoted: this entry'', ''intent is carried as'', ''docs/contracts/north-star.yaml''); bad=[n for n in (57, 117, 184, 185, 196, 200, 209, 211, 221, 231, 232, 233, 235) if not any(all(p in l for p in q) for l in s[n].splitlines())]; assert not bad, bad; assert ''**Status:** Superseded'' in s[126], ''126 compacted''; k=int(re.search(r''\*\*Superseded by: Decision (\d+)\*\*'', s[126]).group(1)); assert re.search(r''^serves: \[[^]]*NS\.9[^]]*\]$'', s[k], re.M), (k, ''successor serves NS.9''); assert re.search(r''^\*\*Promoted:\*\* this entry.s intent is carried as NS\.9 in docs/contracts/north-star\.yaml'', s[k], re.M), (k, ''successor carries the NS.9 promotion''); print(''APPENDS_126_COMPACTED_OK'', k)"'
    expected: Exit 0 and the marker.
    expected_literals: [APPENDS_126_COMPACTED_OK]
    fix_if: >-
      One of the 13 legs fails -- the build touched a note it must not; restore it. The 126 or successor leg fails --
      re-apply blocks DECISIONS-1 and DECISIONS-126 verbatim.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-north-star-promoted-appends-126-compacted
  - step: 6
    phase: pre-deploy
    action: >-
      Retirement sweep (closure obligation for the Delete row): the retired record is out of the live loader,
      byte-identical under entries/deprecated/, named by no live surface outside docs/plans/ and entries/deprecated/,
      and its replacement is live.
    command: |-
      bin/venv-python -c "
      import subprocess
      from scripts.verification_graduation import load_entries
      E='config/agent/verification_registry/entries/'
      live={e['check_id'] for e in load_entries()}
      cid='decision-north-star-promoted-appends'
      assert cid not in live, cid
      base=subprocess.run(['git','show','origin/main:'+E+cid+'.yaml'],capture_output=True,text=True,check=True).stdout
      assert base==open(E+'deprecated/'+cid+'.yaml',encoding='utf-8').read(), cid
      hits=subprocess.run(['git','grep','-lE',cid+'([^-a-z0-9]|$)','--',':!docs/plans/',':!'+E+'deprecated/'],capture_output=True,text=True).stdout.split()
      assert not hits, (cid, hits)
      assert cid+'-126-compacted' in live
      print('RETIREMENT_126_OK')
      "
    expected: Prints RETIREMENT_126_OK.
    expected_literals: [RETIREMENT_126_OK]
    fix_if: >-
      The record is still live or its content changed -- redo the move as a pure git mv. A live surface names it --
      repoint or remove that reference. The replacement is missing -- graduate step 5.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: A one-time retirement sweep over this diff against origin/main; once merged the deprecated subtree is loader-excluded and step 5's graduated record is the standing guard.
  - step: 7
    phase: pre-deploy
    action: Prove the Tier A guard accepts the NS.9 change on the real tree and refuses it without the marker.
    command: |-
      bin/venv-python -c "
      import re
      from pathlib import Path
      from scripts.checks import _marker_guard
      from scripts.checks.contracts.validate_tier_a_amendment_guard import validate_tier_a_amendment_guard as g
      from scripts.checks.contracts.validate_north_star import validate_north_star as v
      f=[]; g(f); v(f); assert not f, f
      p=Path('docs/contracts/north-star.yaml'); t=p.read_text(encoding='utf-8')
      assert re.search(r'^    carried_by: \[196, 232, 233, 235, \d+\]$', t, re.M), 'NS.9 carried_by'
      try:
          p.write_text(re.sub(r'^ *# tier-a-amendment-approved: .*\n', '', t, flags=re.M), encoding='utf-8')
          _marker_guard._decision_bodies_cache.clear()
          f2=[]; g(f2)
      finally:
          p.write_text(t, encoding='utf-8')
      assert f2, 'guard passed without the marker'
      print('TIER_A_NS9_OK')
      "
    expected: The guard and north-star checks pass, the guard fails with the marker stripped, the file is restored (always, by finally), and the marker prints.
    fix_if: The guard fails on the real tree -- re-apply blocks north-star-* and DECISIONS-1 verbatim (the Decision must name NS.9). It passes without the marker -- stop; the guard did not see the change (a plan defect).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_tier_a_amendment_guard runs in the fast tier on every PR touching north-star.yaml; this step proves once that it engaged on this change.
  - step: 8
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: vp-red-before.yaml refuses to graduate a scripts.validate step (the recursion refusal), and PR CI runs this tier on every PR.
  - step: 9
    phase: pre-deploy
    action: Run the full tier before hand-off (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure -- fix in scope and re-run; outside scope is a plan defect, never a hand-off to PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: Prove the merge synced the stubs to ops_decisions and closed both recs, and that the census reads clean with its owners.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json; rows={r['id']: r for r in
      map(json.loads, open('logs/.decisions-index.jsonl'))}; bad={k: rows[k]['status'] for k in ('dec-126', 'dec-183')
      if rows[k]['status'] != 'Superseded'}; assert not bad, bad; print('OPS_DECISIONS_OK')" && bin/venv-python -c "from
      src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
      fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5446', 'rec-3298']); bad=[r['id'] for r in rows if
      r['status'] != 'closed']; assert len(rows) == 2 and not bad, bad; print('RECS_CLOSED')" && bin/venv-python -m
      scripts.checks.decisions.standards_census --verify audits/standards-cleanup-census.yaml --read-owners
    expected: OPS_DECISIONS_OK, RECS_CLOSED and a census verify with no defect line.
    fix_if: A row still Decided -- the rec-autoclose backfill failed; read its run and re-run the backfill through the portal. A rec open -- the Resolves trailer was missing; close it through update_rec with the merge sha.
    hermetic: false
    graduation: not-applicable
