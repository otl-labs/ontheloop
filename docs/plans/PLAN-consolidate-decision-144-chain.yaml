schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: consolidate-decision-144-chain
intent: >-
  Retire Decision 144's amendment chain (rec-5448, operator-named consolidation 4 of 6): one new Decision states the
  CI deployer's standing authority -- broad prefix-scoped grants under the mandatory permissions boundary, a
  boundary-free role only by a named exclusion, PlatformAdmin outside every CI-writable pattern, and role creation
  only in a reviewer-approved Environment apply -- and supersedes Decisions 144 and 180, which compact to stubs,
  so a reader needs one entry instead of ten; it amends Decision 98 by a note, and seven amenders are carried forward.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-consolidate-decision-144-chain.yaml
implementation_declared: false
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5448
  (Medium), the fourth of the six consolidations the operator named on 2026-11-20 (census row S5-144,
  audits/standards-cleanup-census.yaml). Closes no roadmap criterion.
cites: [dec:77, dec:84, dec:92, dec:98, dec:113, dec:129, dec:143, dec:144, dec:149, dec:157, dec:177, dec:180, dec:202, dec:223, dec:225, dec:237, dec:238, dec:240, dec:246, dec:248, dec:252, dec:255, dec:256, dec:257, dec:270, dec:276, dec:277, dec:278, dec:279, dec:283]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Sidecar blocks DECISIONS-1 (the consolidating Decision: supersedes 144 and 180, amends 98, delegates nothing),
      DECISIONS-144 and DECISIONS-180 (compacted-stub-v2 stubs whose Decision lines carry the rendered point maps and
      name every amender) and DECISIONS-98 (one appended Amended-by note; no other word of Decision 98 changes).
  - file: docs/decision-migration/consolidations/consolidate-decision-144-chain.yaml
    action: Create
    purpose: >-
      Sidecar block consolidation-manifest: every unit of 144 and 180 at base_sha disposed (restated, held, stanza or
      retired); carried_forward 202, 223, 225, 238, 252, 257 and 270.
  - file: config/decision_supersession_waivers.yaml
    action: Modify
    purpose: Sidecar blocks waiver-144-98 and waiver-180-144 delete the two waivers whose superseders compact to stubs.
  - file: docs/contracts/glossary.yaml
    action: Modify
    purpose: Sidecar blocks glossary-noted and glossary-log drop 144 from read_as.noted_decisions with an amendment_log row (the 126 and 92 chain precedent).
  - file: audits/standards-cleanup-census.yaml
    action: Modify
    purpose: Remove row S5-144, whose owner rec-5448 this change closes.
bundled_recommendations: [rec-5448]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The committed Decision, stubs, Decision 98 note, manifest, waiver and glossary text equals the approved sidecar (approved_text verify exits 0).
  - Decisions 144 and 180 derive currency superseded_compacted, each superseded by the new Decision, which amends Decision 98; rec-5448's acceptance command passes.
  - The new Decision measures at or under decision-entry.yaml size_governance.measured_size_norm.cap_bytes, and docs/DECISIONS.md shrinks.
  - consolidation.manifest_problems reports nothing, so every unit of 144 and 180 is disposed, every target resolves and each stub's point map matches.
  - Census row S5-144 is gone and the census verifies with its owners read.
  - validate --pre passes, the decisions index is fresh and the full tier passes before hand-off.
  - rec-5448 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed governed text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug consolidate-decision-144-chain --expect ac06aa027a7004da44a6a05ae50668e5503238caecc419a35639a19f5bdace84
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier.
  - step: 2
    phase: pre-deploy
    action: Prove rec-5448's acceptance, that the manifest resolves and that the chain compacted onto the new Decision.
    command: >-
      awk '/^## Decision 144:/{f=1;next} /^## Decision [0-9]+:/{f=0} f' docs/DECISIONS.md | grep -q '^\*\*Superseded by:
      Decision [0-9]' && awk '/^## Decision 144:/{f=1;next} /^## Decision [0-9]+:/{f=0} f' docs/DECISIONS.md | grep -q
      '^\*\*Status:\*\* Superseded' && bin/venv-python -m scripts.decisions_index --check &&
      bin/venv-python -c "import json, subprocess; from pathlib import Path; from scripts.checks.decisions import
      consolidation as c; rd=lambda root, rel: (lambda r: r.stdout if r.returncode == 0 else None)(subprocess.run(['git',
      'show', 'origin/main:' + rel], capture_output=True, text=True)); p=c.manifest_problems(Path('.'), rd); assert not p,
      p; rows={r['number']: r for r in json.load(open('docs/decisions-index.json'))['decisions']}; new=[n for n, r in
      rows.items() if sorted(r.get('supersedes') or []) == [144, 180]]; assert len(new) == 1, new; assert 98 in
      (rows[new[0]].get('amends') or []), rows[new[0]]; bad={n: (rows[n].get('currency'), rows[n].get('superseded_by'))
      for n in (144, 180) if rows[n].get('currency') != 'superseded_compacted' or rows[n].get('superseded_by') != new[0]};
      assert not bad, bad; live={n: rows[n].get('currency') for n in (98, 202, 223, 225, 238, 252, 257, 270) if
      rows[n].get('currency') == 'superseded_compacted'}; assert not live, live; print('CHAIN_144_COMPACTED_OK')"
    expected: Exit 0 and the marker.
    expected_literals: [CHAIN_144_COMPACTED_OK]
    fix_if: A manifest problem, a victim not superseded_compacted, the 98 edge missing or a carried-forward entry compacted -- a sidecar block was applied wrongly; re-apply it. Never edit the manifest to match a wrong tree.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_delegated_key_changes (manifest resolve) and validate_decisions_index_freshness, both in the fast tier; the rec grep runs once more at closure through the Resolves trailer.
  - step: 3
    phase: pre-deploy
    action: Run the consolidation, supersession, census, index, glossary and decision-entry tests, and the IAM checks whose subject is the deployer.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions/test_consolidation.py
      tests/checks/decisions/test_validate_supersession_annotations.py tests/checks/decisions/test_standards_census.py
      tests/checks/decisions/validate_decision_entry_conformance tests/test_decisions_index.py
      tests/test_decisions_index_corpus.py tests/decisions_md tests/checks/iam_tf tests/checks/contracts/test_validate_glossary.py -q
    expected: All pass.
    fix_if: A failure -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The fast tier's affected-set selection runs these modules on every PR touching their sources.
  - step: 4
    phase: pre-deploy
    action: Record the measurement for the PR body.
    command: >-
      bin/venv-python -c "import re, subprocess, yaml; from scripts.decisions_md import iter_decision_sections; from
      scripts.checks.decisions import entry_measure as m; cap=yaml.safe_load(open('docs/contracts/decision-entry.yaml'))['size_governance']['measured_size_norm']['cap_bytes'];
      t=open('docs/DECISIONS.md').read(); base=len(subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True).stdout);
      b={int(re.search(r'Decision (\d+)', h.group(0)).group(1)): s for h, s in iter_decision_sections(t)}; n=next(k for k, s in
      b.items() if 'supersedes: [144, 180]' in s); size=m.measured_bytes(b[n], (m.METADATA_ENVELOPE, m.REVERSAL_CONDITIONS,
      m.OPTIONS_CONSIDERED)); print('measured', size, 'cap', cap, 'whole', len(b[n].encode()), 'file_delta', len(t.encode()) - base);
      assert size <= cap and len(t.encode()) < base; print('CHAIN_144_FITS')"
    expected: The four figures and the marker; measured at or under cap, file_delta negative.
    expected_literals: [CHAIN_144_FITS]
    fix_if: Over the cap -- Decision 278 cl.5's abort fired; stop and report (a rec records why); never trim approved words.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_decisions_size enforces the cap in the fast tier; this step only records the figures.
  - step: 5
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: vp-red-before.yaml refuses to graduate a scripts.validate step (the recursion refusal), and PR CI runs this tier on every PR.
  - step: 6
    phase: pre-deploy
    action: Run the full tier before hand-off (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure -- fix in scope and re-run; outside scope is a plan defect, never a hand-off to PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Prove the merge synced the stubs and the new Decision to ops_decisions and closed rec-5448, and that the census reads clean with its owners.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json; rows={r['id']: r for r in
      map(json.loads, open('logs/.decisions-index.jsonl'))}; bad={k: rows[k]['status'] for k in ('dec-144', 'dec-180')
      if rows[k]['status'] != 'Superseded'}; assert not bad, bad; new=[r for r in rows.values() if 'authority in one entry
      -- broad prefix-scoped' in (r.get('title') or '')]; assert len(new) == 1 and new[0]['status'] == 'Decided', new;
      print('OPS_DECISIONS_OK')" && bin/venv-python -c "from
      src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
      fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5448']); bad=[r['id'] for r in rows if
      r['status'] != 'closed']; assert len(rows) == 1 and not bad, bad; print('RECS_CLOSED')" && bin/venv-python -m
      scripts.checks.decisions.standards_census --verify audits/standards-cleanup-census.yaml --read-owners
    expected: OPS_DECISIONS_OK, RECS_CLOSED and a census verify with no defect line.
    fix_if: A victim row still Decided or the new row missing -- the rec-autoclose backfill failed; read its run and re-run the backfill through the portal. The rec open -- the Resolves trailer was missing; close it through update_rec with the merge sha.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/DECISIONS.md
    behavior: The chain stays compacted and every victim unit stays accounted for.
    verification_step: 3
    test_selector: tests/checks/decisions/test_consolidation.py
    waiver_reason: test_consolidation.py tests the manifest machinery on fixtures; this chain's own accounting is held by validate_delegated_key_changes over the manifest on every run (step 2), so no chain-specific module is added.
  - source: docs/decision-migration/consolidations/consolidate-decision-144-chain.yaml
    behavior: Every unit is disposed and every target resolves.
    verification_step: 5
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: validate_delegated_key_changes already fails any manifest problem on every run while a manifest exists; a new test would duplicate it.
  - source: config/decision_supersession_waivers.yaml
    behavior: No waiver names an edge whose superseder is a compacted stub.
    verification_step: 3
    test_selector: tests/checks/decisions/test_validate_supersession_annotations.py
    waiver_reason: validate_supersession_annotations already reads the waivers on every run; the two deletions remove rows whose superseders become stubs, so a new test would duplicate it.
  - source: docs/contracts/glossary.yaml
    behavior: read_as.noted_decisions names no compacted entry.
    verification_step: 5
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: validate_glossary already checks the noted list against the corpus on every run (the 126 and 92 chain precedent), so a new test would duplicate it.
  - source: audits/standards-cleanup-census.yaml
    behavior: The census names no exception whose owner rec is closed.
    verification_step: 7
    command: bin/venv-python -m scripts.checks.decisions.standards_census --verify audits/standards-cleanup-census.yaml --read-owners
    waiver_reason: The census verify reads owners after merge (step 7); a row whose owner closed is a census defect line, which the removal prevents; a unit test cannot see the live owner state.
constraints:
  - Approved words are copied from docs/plans/approved/consolidate-decision-144-chain.yaml verbatim; {{N}} and {{DATE}} are filled at build (Decision 217 cl.5).
  - Compaction is not reversible once merged (Decision 149); headers and numbers stay.
  - Edits no other Decision except the one appended note on Decision 98; the carried-forward amenders 202, 223, 225, 238, 252, 257 and 270 keep their bodies and edges.
  - At most four whole victims (decision-compaction.yaml consolidation.procedure); this plan takes two.
  - No test or graduated record changes; no contract key is delegated, and only glossary.yaml's noted list and log change.
  - No rescue agents or workaround loops (Decision 55).
