  - Acceptance criteria understood and verifiable
execution_steps:
  - Rebase onto origin/main; confirm the sidecar's base_sha is an ancestor of HEAD and the bodies of Decisions 144, 180 and 98 are unchanged since base_sha (else the manifest's units or the DECISIONS-98 before-text differ; stop and report a plan defect); run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-consolidate-decision-144-chain.yaml and stop on a verdict other than clear.
  - Apply every sidecar block's after-text verbatim (scripts.roadmap.approved_text has only record and verify; VP 1 proves the result), filling {{N}} with the next free number and {{DATE}} with the build date; stage the two waiver deletions with the rest; regenerate docs/decisions-index.json with scripts.decisions_index --write.
  - Remove census row S5-144 (the two orphan waivers go with the sidecar blocks waiver-144-98 and waiver-180-144).
  - Execute Verification Plan steps 1-5 -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55).
  - >-
    CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true in the
    implementation commit, which carries 'Resolves: rec-5448'; git fetch origin main && git rebase origin/main (refill
    {{N}} if main gained a Decision, and re-check step 1's precondition); re-run red_overlap; re-run verification steps
    1-5 on the closure commit and run step 6 last on that same commit, backgrounded from the top-level session with a
    2 h limit; push.
  - >-
    Handoff: open the PR ready for review only after steps 1-6 pass; subscribe to its activity; post the #1963 entry
    naming DECISIONS.md (the 144, 180 and 98 bodies), the manifest, the waiver file, glossary.yaml and the seven
    carried-forward amenders; file the follow-on rec named in context; merge per docs/contracts/git-ops.yaml
    resolves_trailer and merge_step (merge_step premerge, explicit squash commit_message carrying 'Resolves: rec-5448',
    expectedHeadSha, merge_step readback); then run step 7.
  - >-
    Report, as separate facts: what was implemented; the readiness state (bin/venv-python -m
    scripts.session.github_readiness; unknown is unproven, never ready); the full-tier exit plus validation_result
    --verify-head for the pushed HEAD; structured postflight evidence (bin/venv-python -m scripts.session.postflight
    --evidence); the push, PR number, CI result and read-back merge SHA; step 7's read-back.
rollback: >-
  Before merge, drop the branch. After merge, roll forward, never revert: a new Decision supersedes the consolidating
  entry and restates what is to be restored; the stubs stay (Decision 177).
