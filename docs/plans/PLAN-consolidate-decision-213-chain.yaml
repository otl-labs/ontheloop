schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: consolidate-decision-213-chain
intent: >-
  Retire Decision 213's amendment chain (rec-5449, operator-named consolidation 6 of 6): one new Decision restates the
  current rule for identity-trusting DuckLake Lambdas -- reachable only through their AWS_IAM Function URL or named API
  route under three permissions-boundary Denies, telemetry writes on their own function with a scoped DML-only catalog
  login, the login step only under explicit human direction and run by the operator, and the iam-simulate-fixture
  budget authorization -- and supersedes Decision 213, which compacts to a stub with a point map; it amends Decision 91
  by an appended note, and 216, 230, 237, 255 and 270 are carried forward unchanged.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-consolidate-decision-213-chain.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5449
  (Medium), the sixth of the six consolidations the operator named on 2026-11-20 (census row S5-213,
  audits/standards-cleanup-census.yaml). Closes no roadmap criterion.
amends: [dec:91]
cites: [dec:91, dec:149, dec:165, dec:213, dec:216, dec:230, dec:237, dec:255, dec:246, dec:256, dec:270, dec:278, dec:279, dec:283, dec:284]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Sidecar blocks DECISIONS-1 (the consolidating Decision: supersedes 213, amends 91, delegates nothing),
      DECISIONS-213 (compacted-stub-v2 stub whose Decision line carries the rendered point map and names every amender)
      and DECISIONS-91 (one appended Amended-by note; no other word of Decision 91 changes).
  - file: docs/decision-migration/consolidations/consolidate-decision-213-chain.yaml
    action: Create
    purpose: >-
      Sidecar block consolidation-manifest: every unit of 213 at base_sha disposed (restated, held, stanza or retired);
      carried_forward 216, 230, 237, 255 and 270.
  - file: audits/standards-cleanup-census.yaml
    action: Modify
    purpose: Remove row S5-213, whose owner rec-5449 this change closes.
bundled_recommendations: [rec-5449]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The committed Decision, stub, Decision 91 note and manifest equal the approved sidecar (approved_text verify exits 0).
  - Decision 213 derives currency superseded_compacted, superseded by the new Decision, which amends Decision 91 only; rec-5449's acceptance command passes.
  - The new Decision measures at or under decision-entry.yaml size_governance.measured_size_norm.cap_bytes, and docs/DECISIONS.md shrinks.
  - consolidation.manifest_problems reports nothing, including for the merged 81 and 126 manifests that carry 213 forward; 216, 230, 237, 255 and 270 stay live.
  - Census row S5-213 is gone and the census verifies with its owners read.
  - validate --pre passes, the decisions index is fresh and the full tier passes before hand-off.
  - rec-5449 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed governed text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug consolidate-decision-213-chain --expect 4fc95803394a01ecf5335cfa97a7d57ebad9de6e305fa3478ad22271d21655e7
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier.
  - step: 2
    phase: pre-deploy
    action: Prove rec-5449's acceptance, that every manifest resolves (the 81 and 126 ones through 213's successor) and that the chain compacted onto the new Decision.
    command: >-
      awk '/^## Decision 213:/{f=1;next} /^## Decision [0-9]+:/{f=0} f' docs/DECISIONS.md | grep -q '^\*\*Superseded by:
      Decision [0-9]' && awk '/^## Decision 213:/{f=1;next} /^## Decision [0-9]+:/{f=0} f' docs/DECISIONS.md | grep -q
      '^\*\*Status:\*\* Superseded' && bin/venv-python -m scripts.decisions_index --check &&
      bin/venv-python -c "import json, subprocess; from pathlib import Path; from scripts.checks.decisions import
      consolidation as c; rd=lambda root, rel: (lambda r: r.stdout if r.returncode == 0 else None)(subprocess.run(['git',
      'show', 'origin/main:' + rel], capture_output=True, text=True)); p=c.manifest_problems(Path('.'), rd); assert not p,
      p; rows={r['number']: r for r in json.load(open('docs/decisions-index.json'))['decisions']}; new=[n for n, r in
      rows.items() if (r.get('supersedes') or []) == [213]]; assert len(new) == 1, new; assert (rows[new[0]].get('amends')
      or []) == [91], rows[new[0]]; assert rows[213].get('currency') == 'superseded_compacted' and
      rows[213].get('superseded_by') == new[0], rows[213]; live={n: rows[n].get('currency') for n in (91, 216, 230, 237,
      255, 270, 283, 284) if rows[n].get('currency') == 'superseded_compacted'}; assert not live, live;
      print('CHAIN_213_COMPACTED_OK')"
    expected: Exit 0 and the marker.
    expected_literals: [CHAIN_213_COMPACTED_OK]
    fix_if: A problem naming the 81 or 126 manifest -- rec-5717's resolver has not landed; stop (execution step 1). Any other manifest problem, 213 not superseded_compacted, an amends edge other than 91, or a carried-forward entry compacted -- a sidecar block was applied wrongly; re-apply it. Never edit a manifest to match a wrong tree.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_delegated_key_changes (manifest resolve) and validate_decisions_index_freshness, both in the fast tier; the rec grep runs once more at closure through the Resolves trailer.
  - step: 3
    phase: pre-deploy
    action: Run the consolidation, supersession, marker, census, index and decision-entry tests, and the IAM checks whose subject is the URL-only guard (backgrounded; about 10 minutes).
    command: >-
      bin/venv-python -m pytest tests/checks/decisions tests/checks/contracts tests/decisions_md
      tests/test_decisions_index.py tests/test_decisions_index_corpus.py tests/checks/iam_tf tests/checks/structural -q
    expected: All pass.
    fix_if: A failure -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The fast tier's affected-set selection runs these modules on every PR touching their sources.
  - step: 4
    phase: pre-deploy
    action: Record the measurement for the PR body, and prove the budget marker dec-213 still authorizes its row through the stub.
    command: >-
      bin/venv-python -c "import re, subprocess, yaml; from scripts.decisions_md import iter_decision_sections; from
      scripts.checks.decisions import entry_measure as m; from scripts.checks import _marker_guard as g;
      cap=yaml.safe_load(open('docs/contracts/decision-entry.yaml'))['size_governance']['measured_size_norm']['cap_bytes'];
      t=open('docs/DECISIONS.md').read(); base=len(subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True).stdout);
      b={int(re.search(r'Decision (\d+)', h.group(0)).group(1)): s for h, s in iter_decision_sections(t)}; n=next(k for k, s in
      b.items() if 'supersedes: [213]' in s); size=m.measured_bytes(b[n], (m.METADATA_ENVELOPE, m.REVERSAL_CONDITIONS,
      m.OPTIONS_CONSIDERED)); print('measured', size, 'cap', cap, 'whole', len(b[n].encode()), 'file_delta', len(t.encode()) - base);
      assert size <= cap and len(t.encode()) < base; assert not g.authorization_failure('dec-213',
      'docs/contracts/iam-simulate-fixture.yaml', g.load_decision_bodies()); print('CHAIN_213_FITS')"
    expected: The four figures and the marker; measured at or under cap, file_delta negative.
    expected_literals: [CHAIN_213_FITS]
    fix_if: Over the cap -- Decision 278 cl.5's abort fired; stop and report (a rec records why); never trim approved words. The marker assertion fails -- the successor's cl.6 lost the path or the stub lost its Superseded-by line; re-apply the sidecar.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_decisions_size enforces the cap and validate_structural_budget_raises the marker in the fast tier; this step only records the figures.
  - step: 5
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: vp-red-before.yaml refuses to graduate a scripts.validate step (the recursion refusal), and PR CI runs this tier on every PR.
  - step: 6
    phase: pre-deploy
    action: Run the full tier before hand-off (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure -- fix in scope and re-run; outside scope is a plan defect, never a hand-off to PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Prove the merge synced the stub and the new Decision to ops_decisions and closed rec-5449, and that the census reads clean with its owners.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json; rows={r['id']: r for r in
      map(json.loads, open('logs/.decisions-index.jsonl'))}; assert rows['dec-213']['status'] == 'Superseded',
      rows['dec-213']; new=[r for r in rows.values() if 'Identity-trusting DuckLake Lambdas in one entry' in (r.get('title')
      or '')]; assert len(new) == 1 and new[0]['status'] == 'Decided', new; print('OPS_DECISIONS_OK')" && bin/venv-python
      -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
      fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5449']); bad=[r['id'] for r in rows if
      r['status'] != 'closed']; assert len(rows) == 1 and not bad, bad; print('RECS_CLOSED')" && bin/venv-python -m
      scripts.checks.decisions.standards_census --verify audits/standards-cleanup-census.yaml --read-owners
    expected: OPS_DECISIONS_OK, RECS_CLOSED and a census verify with no defect line.
    fix_if: dec-213 still Decided or the new row missing -- the rec-autoclose backfill failed; read its run and re-run the backfill through the portal. The rec open -- the Resolves trailer was missing; close it through update_rec with the merge sha.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/DECISIONS.md
    behavior: Decision 213 stays compacted and every unit stays accounted for.
    verification_step: 3
    test_selector: tests/checks/decisions/test_consolidation.py
    waiver_reason: test_consolidation.py tests the manifest machinery on fixtures (rec-5717 adds the supersession-resolve case); this chain's own accounting is held by validate_delegated_key_changes over the manifest on every run (step 2), so no chain-specific module is added.
  - source: docs/decision-migration/consolidations/consolidate-decision-213-chain.yaml
    behavior: Every unit is disposed and every target resolves.
    verification_step: 5
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: validate_delegated_key_changes already fails any manifest problem on every run while a manifest exists; a new test would duplicate it.
  - source: audits/standards-cleanup-census.yaml
    behavior: The census names no exception whose owner rec is closed.
    verification_step: 3
    test_selector: tests/checks/decisions/test_standards_census.py::TestCommittedCensus
    waiver_reason: TestCommittedCensus turns red when a root compacts while its row remains, so the removal is held before merge; step 7's census verify reads the live owner state after merge.
constraints:
  - Approved words are copied from docs/plans/approved/consolidate-decision-213-chain.yaml verbatim; {{N}} and {{DATE}} are filled at build (Decision 217 cl.5).
  - Compaction is not reversible once merged (Decision 149); headers and numbers stay.
  - Edits no other Decision except the one appended note on Decision 91; the carried-forward amenders 216, 230, 237, 255 and 270 keep their bodies and edges, and Decisions 283 and 284 are not edited.
  - Merged manifests (consolidate-decision-81-chain.yaml, consolidate-decision-126-chain.yaml) are never edited; they resolve through rec-5717's resolver.
  - Restates only; no clause re-decides Decision 213. No test, graduated record, contract key, citation or config/structural_size_budgets.yaml marker changes.
  - No rescue agents or workaround loops (Decision 55).
