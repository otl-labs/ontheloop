schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: consolidate-decision-73-chain
intent: >-
  Retire Decision 73's amendment chain (rec-5445, operator-named consolidation 1 of 6): one new Decision states the
  two-tier CI model's standing rules and supersedes Decisions 73, 135 and 153, which compact to stubs, so a reader
  needs one entry instead of twelve; the selection mechanism moves into a new docs/contracts/fast-tier.yaml, and the
  first checked consolidation manifest accounts for every unit of the three bodies (Decision 278).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-consolidate-decision-73-chain.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5445
  (Medium), the first of the six consolidations the operator named on 2026-11-20 (census row S5-73,
  audits/standards-cleanup-census.yaml). Closes no roadmap criterion.
cites: [dec:60, dec:73, dec:135, dec:149, dec:153, dec:168, dec:177, dec:182, dec:205, dec:208, dec:217, dec:226, dec:246, dec:247, dec:249, dec:252, dec:254, dec:276, dec:278, dec:279]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Insert the consolidating Decision (block DECISIONS-1) and replace the bodies of Decisions 73, 135 and 153 with
      compacted stubs carrying their point maps (blocks DECISIONS-73/135/153), exactly as the approved-text sidecar
      binds them.
  - file: docs/contracts/fast-tier.yaml
    action: Create
    purpose: >-
      New Class D contract the consolidating Decision delegates to: Decision 135's selection mechanism moved word for
      word (selection.*, selection_manifest), the forced-scope waiver and the ceiling's current derivation
      (forced_scope.*), with cap_modules and ceiling_seconds as values its evaluator checks; exactly as the sidecar
      binds it (block fast-tier-contract).
  - file: docs/decision-migration/consolidations/consolidate-decision-73-chain.yaml
    action: Create
    purpose: >-
      The consolidation manifest (Decision 278 cl.4): one disposition per unit of Decisions 73, 135 and 153 at the
      build's origin/main, the carried-forward amenders and base_sha; exactly as the sidecar binds it (block consolidation-manifest).
  - file: scripts/checks/deps/validate_fast_tier.py
    action: Create
    purpose: >-
      The contract's evaluator check (Decision 168): fails when selection.cap_modules differs from
      affected_tests.CAP, or forced_scope.ceiling_seconds differs from selection_budget.CEILING_SECONDS or from
      ci.yml's derivation (pr-validate timeout-minutes less every other bounded step's timeout-minutes, the
      scripts.validate step excepted, less 5, in seconds; 50 - 15 - 5 - 5 on main at 5070cb63). It reads CAP and CEILING_SECONDS from their modules' source with ast rather than importing
      them, so its import closure stays within its pre_globs (validate_pre_glob_closure), and it declares examined().
  - file: tests/checks/deps/test_validate_fast_tier.py
    action: Create
    purpose: >-
      Mirror test for the new check (real tree agrees; cap drift, ceiling constant drift, timeout drift and a new
      bounded step each fail; the fast tier step's own timeout is not subtracted).
  - file: scripts/checks/deps/_manifest.py
    action: Modify
    purpose: >-
      Register validate_fast_tier (pre=True, pre_globs naming the contract, ci.yml, affected_tests.py,
      selection_budget.py, the check module, scripts/checks/_common.py and scripts/checks/registry.py; full_segment
      full_after_lint).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Add the function_to_category row validate_fast_tier -> schema_drift (a new check module's registration). If the
      file is at its budget at build time (493 of 500 today, NEAR_CAP), relief is flow-style compaction of existing
      rows in this file only, measured against main then, never a raise.
  - file: tests/checks/decisions/test_sit_decision_records.py
    action: Modify
    purpose: >-
      Decision 73 compacts, so its SIT note retires with its body: the note loop skips the compacted set {73} and
      asserts instead that 73's stub names the SIT Decision; the envelope amends assertion is unchanged (sidecar
      blocks sit-test-compacted, sit-test-notes).
  - file: tests/checks/decisions/test_last_green_decision_records.py
    action: Modify
    purpose: >-
      The same for Decision 254's note on 73: the loop skips {73} and asserts 73's stub names the batching Decision
      (sidecar blocks last-green-test-compacted, last-green-test-notes).
  - file: tests/ci_rca/test_recovery_policy_surfaces.py
    action: Modify
    purpose: >-
      The same for Decision 226's note on 73: the annotation loop keeps 72 and 217 and asserts 73's stub names
      Decision 226 (sidecar block recovery-policy-test-notes). Registry shard red-main-recovery-surfaces is kept: its
      node and command are unchanged.
  - file: audits/standards-cleanup-census.yaml
    action: Modify
    purpose: Remove exception row S5-73, whose root is no longer a candidate once 73 compacts (rec-5445 closes).
bundled_recommendations: [rec-5445]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The committed Decision, stub, contract, manifest and test text equals the approved sidecar (approved_text verify exits 0).
  - Decisions 73, 135 and 153 derive currency superseded_compacted, each superseded by the new Decision; rec-5445's acceptance greps pass.
  - The new Decision measures at or under decision-entry.yaml size_governance.measured_size_norm.cap_bytes.
  - consolidation.manifest_problems reports nothing, so every unit is disposed, every target resolves and each stub's point map matches.
  - validate_fast_tier passes on the real tree and its mirror test proves cap and timeout drift fail.
  - validate --pre passes, the decisions index is fresh and the full tier passes before hand-off.
  - rec-5445 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed governed text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug consolidate-decision-73-chain --expect a8eebf24ab4589ebf0e00df91f639ca5ffff1ef912ead3fbee4414405b637a76
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier.
  - step: 2
    phase: pre-deploy
    action: Prove the manifest resolves and the chain compacted onto the new Decision.
    command: >-
      bin/venv-python -m scripts.decisions_index --check && bin/venv-python -c "import json, subprocess; from pathlib
      import Path; from scripts.checks.decisions import consolidation as c; rd=lambda root, rel: (lambda r: r.stdout
      if r.returncode == 0 else None)(subprocess.run(['git', 'show', 'origin/main:' + rel], capture_output=True,
      text=True)); p=c.manifest_problems(Path('.'), rd); assert not p, p; rows={r['number']: r for r in
      json.load(open('docs/decisions-index.json'))['decisions']}; new=[n for n, r in rows.items() if
      sorted(r.get('supersedes') or []) == [73, 135, 153]]; assert len(new) == 1, new; bad={n:
      (rows[n].get('currency'), rows[n].get('superseded_by')) for n in (73, 135, 153) if rows[n].get('currency') !=
      'superseded_compacted'}; assert not bad, bad; print('CHAIN_73_COMPACTED_OK')"
    expected: Exit 0 and the marker.
    expected_literals: [CHAIN_73_COMPACTED_OK]
    fix_if: A manifest problem or a victim not superseded_compacted -- a sidecar block was applied wrongly; re-apply it. Never edit the manifest to match a wrong tree.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_delegated_key_changes (manifest resolve) and validate_decisions_index_freshness, both in the fast tier.
  - step: 3
    phase: pre-deploy
    action: Run the new check's mirror test, the three edited tests and the consolidation and census tests.
    command: >-
      bin/venv-python -m pytest tests/checks/deps/test_validate_fast_tier.py
      tests/checks/decisions/test_sit_decision_records.py tests/checks/decisions/test_last_green_decision_records.py
      tests/ci_rca/test_recovery_policy_surfaces.py tests/checks/decisions/test_consolidation.py tests/checks/decisions/test_standards_census.py
      tests/checks/deps/test__manifest.py -q
    expected: All pass.
    fix_if: A failure -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The fast tier's affected-set selection runs these modules on every PR touching their sources.
  - step: 4
    phase: pre-deploy
    action: Record the measurement for the PR body.
    command: >-
      bin/venv-python -c "import re, subprocess, yaml; from scripts.decisions_md import iter_decision_sections; from
      scripts.checks.decisions import entry_measure as m; cap=yaml.safe_load(open('docs/contracts/decision-entry.yaml'))['size_governance']['measured_size_norm']['cap_bytes'];
      t=open('docs/DECISIONS.md').read(); base=len(subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True).stdout);
      b={int(re.search(r'Decision (\d+)', h.group(0)).group(1)): s for h, s in iter_decision_sections(t)}; n=next(k for k, s in
      b.items() if 'supersedes: [73, 135, 153]' in s); size=m.measured_bytes(b[n], (m.METADATA_ENVELOPE, m.REVERSAL_CONDITIONS,
      m.OPTIONS_CONSIDERED)); print('measured', size, 'cap', cap, 'whole', len(b[n].encode()), 'file_delta', len(t.encode()) - base);
      assert size <= cap and len(t.encode()) < base; print('CHAIN_73_FITS')"
    expected: The four figures and the marker; measured at or under cap, file_delta negative.
    expected_literals: [CHAIN_73_FITS]
    fix_if: Over the cap -- Decision 278 cl.5's abort fired; stop and report (a rec records why); never trim approved words.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_decisions_size enforces the cap in the fast tier; this step only records the figures.
  - step: 5
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Run the full tier before hand-off (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure -- fix in scope and re-run; outside scope is a plan defect, never a hand-off to PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Prove the merge synced the stubs to ops_decisions and closed rec-5445.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json; rows={r['id']: r for r in
      map(json.loads, open('logs/.decisions-index.jsonl'))}; bad={k: rows[k]['status'] for k in ('dec-073', 'dec-135',
      'dec-153') if rows[k]['status'] != 'Superseded'}; assert not bad, bad; print('OPS_DECISIONS_OK')" &&
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
      fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5445']); assert rows and rows[0]['status'] ==
      'closed', rows; print('REC_5445_CLOSED')"
    expected: OPS_DECISIONS_OK and REC_5445_CLOSED.
    fix_if: A row still Decided -- the rec-autoclose backfill failed; read its run and re-run the backfill through the portal. rec-5445 open -- the Resolves trailer was missing; close it through update_rec with the merge sha.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/DECISIONS.md
    behavior: The chain stays compacted and every victim unit stays accounted for.
    verification_step: 3
    test_selector: tests/checks/decisions/test_consolidation.py
    waiver_reason: test_consolidation.py tests the manifest machinery on fixtures; this chain's own accounting is held by validate_delegated_key_changes over the manifest on every run (step 2), so no chain-specific module is added.
  - source: docs/contracts/fast-tier.yaml
    behavior: The contract's cap and ceiling agree with the selector, the budget and ci.yml.
    verification_step: 3
    test_selector: tests/checks/deps/test_validate_fast_tier.py::test_real_contract_and_workflow_agree
    red_green_expectation: red before (the contract is absent), green after.
  - source: docs/decision-migration/consolidations/consolidate-decision-73-chain.yaml
    behavior: Every unit is disposed and every target resolves.
    verification_step: 5
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: validate_delegated_key_changes already fails any manifest problem on every run while a manifest exists; a new test would duplicate it.
  - source: scripts/checks/deps/validate_fast_tier.py
    behavior: Cap drift, timeout drift and a new bounded step each fail the check; the fast tier's own step timeout is never subtracted.
    verification_step: 3
    test_selector: tests/checks/deps/test_validate_fast_tier.py
    red_green_expectation: red before (the module does not exist), green after.
  - source: scripts/checks/deps/_manifest.py
    behavior: validate_fast_tier is registered in the fast and full tiers.
    verification_step: 3
    test_selector: tests/checks/deps/test__manifest.py
    red_green_expectation: red before (no Entry), green after.
  - source: tests/checks/decisions/test_sit_decision_records.py
    behavior: A compacted noted entry's stub names the SIT Decision.
    verification_step: 3
    test_selector: tests/checks/decisions/test_sit_decision_records.py::test_sit_and_rds_decisions_and_notes
    red_green_expectation: red before (73's body lost its note), green after.
  - source: tests/checks/decisions/test_last_green_decision_records.py
    behavior: A compacted amended entry's stub names the batching Decision.
    verification_step: 3
    test_selector: tests/checks/decisions/test_last_green_decision_records.py::test_each_amended_entry_carries_one_dated_note
    red_green_expectation: red before (73's body lost its note), green after.
  - source: tests/ci_rca/test_recovery_policy_surfaces.py
    behavior: A compacted amended entry's stub names the red-recovery Decision.
    verification_step: 3
    test_selector: tests/ci_rca/test_recovery_policy_surfaces.py::TestDecisionEntry::test_amended_decisions_carry_the_annotation
    red_green_expectation: red before (73's body lost its note), green after.
  - source: audits/standards-cleanup-census.yaml
    behavior: The census names no exception whose root is no longer a candidate.
    verification_step: 3
    test_selector: tests/checks/decisions/test_standards_census.py
    waiver_reason: A stale exception row is only a census note, never a defect; the removal is bookkeeping a test cannot discriminate.
constraints:
  - Approved words are copied from docs/plans/approved/consolidate-decision-73-chain.yaml verbatim; {{N}} and {{DATE}} are filled at build (Decision 217 cl.5).
  - Compaction is not reversible once merged (Decision 149); headers and numbers stay.
  - Edits no other Decision; the carried-forward amenders 182, 205, 217, 226, 247, 249, 252 and 254 keep their bodies and edges.
  - At most four whole victims (decision-compaction.yaml consolidation.procedure); this plan takes three.
  - No size budget raise.
  - No rescue agents or workaround loops (Decision 55).
