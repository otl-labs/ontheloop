  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Rebase onto origin/main; confirm the bodies of Decisions 73, 135 and 153 are unchanged since base_sha (else the manifest's units differ; stop and report a plan defect); run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-consolidate-decision-73-chain.yaml and stop on a verdict other than clear.
  - Apply every sidecar block verbatim with scripts.roadmap.approved_text, filling {{N}} with the next free number and {{DATE}} with the build date; regenerate docs/decisions-index.json with scripts.decisions_index --write.
  - Create scripts/checks/deps/validate_fast_tier.py and its mirror test, and register the Entry in scripts/checks/deps/_manifest.py, as scope says.
  - "Add the taxonomy row validate_fast_tier: schema_drift. Measure config/ci_rca_taxonomy.yaml against its budget after the rebase; if the row takes it over, compact existing rows of this file to flow style, words unchanged, until it fits, and never raise the budget."
  - Remove census row S5-73, and delete the four stale waivers (135->73, 153->73, 153->135, 182->153) from config/decision_supersession_waivers.yaml.
  - "Precondition: context records the operator's Decision 235 cl.1 approval of the two retirements (else stop and ask the coordinator). Retire the two records exactly as their sidecar blocks bind them, by git mv of config/agent/verification_registry/entries/event-origin-amended-by-annotations.yaml and config/agent/verification_registry/entries/scale-readiness-annotations.yaml into config/agent/verification_registry/entries/deprecated/ (content untouched). Graduate VP steps 5 and 6 through the implement skill's graduation flow: one config/agent/verification_registry/entries/<graduation_check_id>.yaml each (primitive_slot command_exit_zero, guard_target docs/DECISIONS.md, guard_symbol null, plan_slug consolidate-decision-73-chain, the step's command as its argv); the differential admission gate must see each fail at origin/main."
  - Execute Verification Plan steps 1-8 -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55).
  - >-
    CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true in the
    implementation commit, which carries 'Resolves: rec-5445'; git fetch origin main && git rebase origin/main
    (refill {{N}} if main gained a Decision, and re-check step 1's precondition); re-run red_overlap; re-run
    verification steps 1-8 on the closure commit and run step 9 last on that same commit, backgrounded from the
    top-level session with a 2 h limit; push.
  - >-
    Handoff: open the PR ready for review only after steps 1-9 pass; subscribe to its activity; post the #1963 entry
    naming DECISIONS.md, the three test files owned by CI Reform, Agents in GitHub and Decision 226's build, the two
    retired records from Decision 205's and Decision 217's builds, and the held 252 cl.6 token; merge per
    docs/contracts/git-ops.yaml resolves_trailer and merge_step (merge_step premerge, explicit squash commit_message
    carrying 'Resolves: rec-5445', expectedHeadSha, merge_step readback); then run step 10.
  - >-
    Report, as separate facts: what was implemented; the readiness state (bin/venv-python -m
    scripts.session.github_readiness; unknown is unproven, never ready); the full-tier exit plus validation_result
    --verify-head for the pushed HEAD; structured postflight evidence (bin/venv-python -m scripts.session.postflight
    --evidence); the push, PR number, CI result and read-back merge SHA; step 10's read-back.
rollback: >-
  Before merge, drop the branch. After merge, roll forward, never revert: a new Decision supersedes the consolidating
  entry and restates what is to be restored; the stubs stay (Decision 177).
