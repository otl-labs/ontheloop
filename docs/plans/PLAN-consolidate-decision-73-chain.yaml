schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: consolidate-decision-73-chain
intent: >-
  Retire Decision 73's amendment chain (rec-5445, operator-named consolidation 1 of 6): one new Decision states the
  two-tier CI model's standing rules and supersedes Decisions 73, 135 and 153, which compact to stubs, so a reader
  needs one entry instead of twelve; the selection mechanism moves into a new docs/contracts/fast-tier.yaml, and the
  first checked consolidation manifest accounts for every unit of the three bodies (Decision 278).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-consolidate-decision-73-chain.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5445
  (Medium), the first of the six consolidations the operator named on 2026-11-20 (census row S5-73,
  audits/standards-cleanup-census.yaml). Closes no roadmap criterion.
cites: [dec:60, dec:73, dec:135, dec:149, dec:153, dec:159, dec:163, dec:168, dec:177, dec:182, dec:205, dec:208, dec:217, dec:226, dec:235, dec:244, dec:246, dec:247, dec:249, dec:252, dec:254, dec:276, dec:278, dec:279]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Insert the consolidating Decision (block DECISIONS-1) and replace the bodies of Decisions 73, 135 and 153 with
      compacted stubs carrying their point maps (blocks DECISIONS-73/135/153), exactly as the approved-text sidecar
      binds them.
  - file: docs/contracts/fast-tier.yaml
    action: Create
    purpose: >-
      New Class D contract the consolidating Decision delegates to: Decision 135's selection mechanism moved word for
      word (selection.*, selection_manifest), the forced-scope waiver and the ceiling's current derivation
      (forced_scope.*), with cap_modules and ceiling_seconds as values its evaluator checks; exactly as the sidecar
      binds it (block fast-tier-contract).
  - file: docs/decision-migration/consolidations/consolidate-decision-73-chain.yaml
    action: Create
    purpose: >-
      The consolidation manifest (Decision 278 cl.4): one disposition per unit of Decisions 73, 135 and 153 at the
      build's origin/main, the carried-forward amenders and base_sha; exactly as the sidecar binds it (block consolidation-manifest).
  - file: scripts/checks/deps/validate_fast_tier.py
    action: Create
    purpose: >-
      The contract's evaluator check (Decision 168): fails when selection.cap_modules differs from
      affected_tests.CAP, or forced_scope.ceiling_seconds differs from selection_budget.CEILING_SECONDS or from
      ci.yml's derivation (pr-validate timeout-minutes less every other bounded step's timeout-minutes, the fast
      tier's own validate --pre step excepted, less 5, in seconds; 50 - 15 - 5 - 5 on main at 5070cb63). It reads
      CAP and CEILING_SECONDS from their modules' source with ast rather than importing them, so its import closure
      stays within its pre_globs (validate_pre_glob_closure); it takes an optional root for tests, declares
      examined(3) when it ran and skipped() when an input cannot be read, and fails loudly in both cases of drift or
      unreadable input.
  - file: tests/checks/deps/test_validate_fast_tier.py
    action: Create
    purpose: >-
      Mirror test for the new check at 100% line coverage (real tree agrees; cap drift, ceiling constant drift,
      timeout drift and a new bounded step each fail; the fast tier step's own timeout is not subtracted; an
      unreadable input fails loudly; the check is in both tier sequences).
  - file: scripts/checks/deps/_manifest.py
    action: Modify
    purpose: >-
      Register validate_fast_tier (pre=True, pre_globs naming the contract, ci.yml, affected_tests.py,
      selection_budget.py, the check module, scripts/checks/_common.py and scripts/checks/registry.py; full_segment
      full_after_lint).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Add the function_to_category row validate_fast_tier -> schema_drift (a new check module's registration). If the
      file is at its budget at build time (493 of 500 today, NEAR_CAP), relief is flow-style compaction of existing
      rows in this file only, measured against main then, never a raise.
  - file: tests/checks/decisions/test_sit_decision_records.py
    action: Modify
    purpose: >-
      Decision 73 compacts, so its SIT note retires with its body: the note loop skips the compacted set {73} and
      asserts instead that 73's stub names the SIT Decision; the envelope amends assertion is unchanged (sidecar
      blocks sit-test-compacted, sit-test-notes).
  - file: tests/checks/decisions/test_last_green_decision_records.py
    action: Modify
    purpose: >-
      The same for Decision 254's note on 73: the loop skips {73} and asserts 73's stub names the batching Decision
      (sidecar blocks last-green-test-compacted, last-green-test-notes).
  - file: tests/ci_rca/test_recovery_policy_surfaces.py
    action: Modify
    purpose: >-
      The same for Decision 226's note on 73: the annotation loop keeps 72 and 217 and asserts 73's stub names
      Decision 226 (sidecar block recovery-policy-test-notes). Registry shard red-main-recovery-surfaces is kept: its
      node and command are unchanged.
  - file: audits/standards-cleanup-census.yaml
    action: Modify
    purpose: Remove exception row S5-73, whose root is no longer a candidate once 73 compacts (rec-5445 closes).
  - file: config/decision_supersession_waivers.yaml
    action: Modify
    purpose: >-
      Delete the four waivers that go stale once the stubs point back at their superseders (135->73, 153->73,
      153->135 and 182->153); validate_supersession_annotations WARNs each stale waiver, and the Decision 277 build
      pruned its own the same way.
  - file: config/agent/verification_registry/entries/event-origin-amended-by-annotations.yaml
    action: Delete
    purpose: >-
      Retired by git mv into entries/deprecated/ (Decision 176's retirement path): its 73 legs pin key words and an
      unedited sentence in Decision 73's body, which compacts to a stub, so it would fail permanently, and an
      in-place edit is refused (check_id is immutable). Bound as a whole-file delete (sidecar block
      retire-event-origin-amended-by-annotations); VP step 5 graduates its replacement.
  - file: config/agent/verification_registry/entries/deprecated/event-origin-amended-by-annotations.yaml
    action: Create
    purpose: The same record, moved by a 100% rename with content byte-identical (sidecar block retired-event-origin-amended-by-annotations).
  - file: config/agent/verification_registry/entries/scale-readiness-annotations.yaml
    action: Delete
    purpose: >-
      Retired the same way: its 73 leg pins Decision 217's dated note in 73's body and that note's place after the
      Decision 205 line. Bound as a whole-file delete (sidecar block retire-scale-readiness-annotations); VP step 6
      graduates its replacement.
  - file: config/agent/verification_registry/entries/deprecated/scale-readiness-annotations.yaml
    action: Create
    purpose: The same record, moved by a 100% rename with content byte-identical (sidecar block retired-scale-readiness-annotations).
bundled_recommendations: [rec-5445]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The committed Decision, stub, contract, manifest, test and retired-record text equals the approved sidecar (approved_text verify exits 0).
  - Decisions 73, 135 and 153 derive currency superseded_compacted, each superseded by the new Decision; rec-5445's acceptance greps pass.
  - The new Decision measures at or under decision-entry.yaml size_governance.measured_size_norm.cap_bytes.
  - consolidation.manifest_problems reports nothing, so every unit is disposed, every target resolves and each stub's point map matches.
  - validate_fast_tier passes on the real tree and its mirror test proves cap and timeout drift fail.
  - The two graduated records that pinned Decision 73's notes are retired by 100% renames into entries/deprecated/, and their replacements pass at head and fail at origin/main.
  - validate --pre passes, the decisions index is fresh and the full tier passes before hand-off.
  - rec-5445 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed governed text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug consolidate-decision-73-chain --expect 8a53c94c07ba79fdc90a6fed5c1ceccdaf5ef042f17ef3a7c5ca0dc31240dbb8
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier.
  - step: 2
    phase: pre-deploy
    action: Prove rec-5445's own acceptance, that the manifest resolves and that the chain compacted onto the new Decision.
    command: >-
      awk '/^## Decision 73:/{f=1;next} /^## Decision [0-9]+:/{f=0} f' docs/DECISIONS.md | grep -q '^\*\*Superseded by:
      Decision [0-9]' && awk '/^## Decision 73:/{f=1;next} /^## Decision [0-9]+:/{f=0} f' docs/DECISIONS.md | grep -q
      '^\*\*Status:\*\* Superseded' && bin/venv-python -m scripts.decisions_index --check && bin/venv-python -c "import json, subprocess; from pathlib
      import Path; from scripts.checks.decisions import consolidation as c; rd=lambda root, rel: (lambda r: r.stdout
      if r.returncode == 0 else None)(subprocess.run(['git', 'show', 'origin/main:' + rel], capture_output=True,
      text=True)); p=c.manifest_problems(Path('.'), rd); assert not p, p; rows={r['number']: r for r in
      json.load(open('docs/decisions-index.json'))['decisions']}; new=[n for n, r in rows.items() if
      sorted(r.get('supersedes') or []) == [73, 135, 153]]; assert len(new) == 1, new; bad={n:
      (rows[n].get('currency'), rows[n].get('superseded_by')) for n in (73, 135, 153) if rows[n].get('currency') !=
      'superseded_compacted'}; assert not bad, bad; print('CHAIN_73_COMPACTED_OK')"
    expected: Exit 0 and the marker.
    expected_literals: [CHAIN_73_COMPACTED_OK]
    fix_if: A manifest problem or a victim not superseded_compacted -- a sidecar block was applied wrongly; re-apply it. Never edit the manifest to match a wrong tree.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_delegated_key_changes (manifest resolve) and validate_decisions_index_freshness, both in the fast tier.
  - step: 3
    phase: pre-deploy
    action: Run the new check's mirror test, the three edited tests and the consolidation and census tests.
    command: >-
      bin/venv-python -m pytest tests/checks/deps/test_validate_fast_tier.py
      tests/checks/decisions/test_sit_decision_records.py tests/checks/decisions/test_last_green_decision_records.py
      tests/ci_rca/test_recovery_policy_surfaces.py tests/checks/decisions/test_consolidation.py tests/checks/decisions/test_standards_census.py
      tests/checks/decisions/test_validate_supersession_annotations.py tests/checks/deps/test__manifest.py -q
    expected: All pass.
    fix_if: A failure -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The fast tier's affected-set selection runs these modules on every PR touching their sources.
  - step: 4
    phase: pre-deploy
    action: Record the measurement for the PR body.
    command: >-
      bin/venv-python -c "import re, subprocess, yaml; from scripts.decisions_md import iter_decision_sections; from
      scripts.checks.decisions import entry_measure as m; cap=yaml.safe_load(open('docs/contracts/decision-entry.yaml'))['size_governance']['measured_size_norm']['cap_bytes'];
      t=open('docs/DECISIONS.md').read(); base=len(subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True).stdout);
      b={int(re.search(r'Decision (\d+)', h.group(0)).group(1)): s for h, s in iter_decision_sections(t)}; n=next(k for k, s in
      b.items() if 'supersedes: [73, 135, 153]' in s); size=m.measured_bytes(b[n], (m.METADATA_ENVELOPE, m.REVERSAL_CONDITIONS,
      m.OPTIONS_CONSIDERED)); print('measured', size, 'cap', cap, 'whole', len(b[n].encode()), 'file_delta', len(t.encode()) - base);
      assert size <= cap and len(t.encode()) < base; print('CHAIN_73_FITS')"
    expected: The four figures and the marker; measured at or under cap, file_delta negative.
    expected_literals: [CHAIN_73_FITS]
    fix_if: Over the cap -- Decision 278 cl.5's abort fired; stop and report (a rec records why); never trim approved words.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_decisions_size enforces the cap in the fast tier; this step only records the figures.
  - step: 5
    phase: pre-deploy
    action: >-
      THE RETIRED EVENT-ORIGIN RECORD'S REPLACEMENT. event-origin-amended-by-annotations' legs for Decisions 184, 87
      and 116 are kept verbatim; its two Decision 73 legs (the dated note's key words and the unedited "Full tier runs
      on push to" sentence) become one stub leg: 73 is Superseded and its stub names the event-origin Decision.
    command: 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''keys on GitHub event origin'' in m.group(2)]; assert len(es)==1, (''expected exactly one event-origin Decision entry'', [m.group(1) for m in es]); n=es[0].group(1); b=es[0].group(0); want={''184'':[''event-origin'',''rec-3386'',''never a credential On The Loop holds or intermediates'',''user-owned CLI backend'',''sole inference lane On The Loop holds'',''actions-policy'',''stays live'',''deployment'',''not a product-credential ruling''],''87'':[''git'',''clause 1'',''clause 2'',''forward note'',''warehouse-native'',''(plan_path, head_sha)'',''GitHub identit'',''check-run output'',''clause 6''],''116'':[''unattended'',''LiteLLM API-key lane'',''user-owned CLI backend'',''T4.12'',''T4.26'',''copilot-sdk'']}; keep={''184'':''scheduled-agent lane is unchanged'',''87'':''never had a git life'',''116'':''Routine/non-agentic agents''}; probs=[]; [probs.append(k+'': entry missing'') for k in want if not re.search(r''^## Decision ''+k+r'':'', t, re.M)]; assert not probs, probs; blocks={k:re.search(r''^## Decision ''+k+r'':.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0) for k in want}; anns={k:[l for l in blocks[k].splitlines() if re.match(r''> \*\*Amended by Decision ''+n+r'' \(\d{4}-\d{2}-\d{2}\):\*\*'', l)] for k in want}; [probs.append(k+'': no dated Amended-by-Decision-''+n+'' annotation'') for k in want if not anns[k]]; assert not probs, probs; [probs.append((k, ''no Amended-by line carries every key word'', want[k])) for k in want if not any(all(w in l for w in want[k]) for l in anns[k])]; [probs.append(k+'': original body text edited, not annotated (Decision 177)'') for k in keep if keep[k] not in blocks[k]]; assert not probs, probs; s73=re.search(r''^## Decision 73:.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0); assert ''**Status:** Superseded'' in s73 and ''Decision ''+n in s73, (''73 is compacted and its stub names Decision'', n); s184=len(blocks[''184''].encode(''utf-8'')); print(''AMENDED_BY_EVENT_ORIGIN_73_COMPACTED_OK'', n, s184)"'
    expected: Exit 0 and the marker.
    expected_literals: [AMENDED_BY_EVENT_ORIGIN_73_COMPACTED_OK]
    fix_if: >-
      A 184, 87 or 116 leg fails -- the build touched a note it must not; restore it. The stub leg fails -- re-apply
      block DECISIONS-73 verbatim.
    hermetic: true
    graduation: graduate
    graduation_check_id: event-origin-amended-by-annotations-73-compacted
  - step: 6
    phase: pre-deploy
    action: >-
      THE RETIRED SCALE-READINESS RECORD'S REPLACEMENT. scale-readiness-annotations' legs for its other annotated
      Decisions and their placement are kept verbatim; its Decision 73 leg (the dated note's key words and its place
      after the Decision 205 line) becomes the same stub leg, naming the scale-readiness Decision.
    command: 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''Scale-readiness commitments gated on executor concurrency above 1'' in m.group(2)]; assert len(es)==1, (''expected exactly one scale-readiness Decision'', [e.group(1) for e in es]); n=es[0].group(1); b=es[0].group(0); blk=lambda k: re.search(r''^## Decision ''+k+r'':.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0); A=r''> \*\*Amended by Decision ''+n+r'' \(\d{4}-\d{2}-\d{2}\):\*\* ''; ann={''196'': [''file slug is the decision identity'', ''existing numbers freeze'', ''first-parent merge order'', ''gitignored runtime root'', ''Decision {n} clauses 5-7'', ''clause 6 prefixes are unchanged''], ''205'': [''ONE non-bypass App'', ''measured rate-limit breach'', ''Decision {n} clause 3'', ''push-to-main decision-scout pass'', ''files a rec on a hit'', ''pre-merge scout on every plan PR is unchanged'', ''Decision {n} clause 8''], ''206'': [''plan-limit pause'', ''shadow dollars are never a spend'', ''cost per verified merge'', ''Decision {n} clause 4'']}; got={k: [l for l in blk(k).splitlines() if re.match(A, l)] for k in ann}; one=[(k, len(got[k])) for k in ann if len(got[k])!=1]; assert not one, (''expected exactly one Amended-by line citing ''+n+'' per entry'', one); miss=[(k,p) for k,ps in ann.items() for p in ps if p.replace(''{n}'',n) not in got[k][0]]; assert not miss, (''Amended-by line text missing'', miss); lo={k: blk(k).find(''**Related:**'') for k in ann}; bad=[k for k in ann if lo[k] < 0 or not lo[k] < blk(k).find(got[k][0])]; assert not bad, (''Amended-by line misplaced (must follow the Related marker)'', bad); s73=re.search(r''^## Decision 73:.*?(?=^## Decision |\Z)'', t, re.M|re.S).group(0); assert ''**Status:** Superseded'' in s73 and ''Decision ''+n in s73, (''73 is compacted and its stub names Decision'', n); print(''DEC_ANNOTATIONS_73_COMPACTED_OK'', n, {k: len(blk(k).encode(''utf-8'')) for k in ann})"'
    expected: Exit 0 and the marker.
    expected_literals: [DEC_ANNOTATIONS_73_COMPACTED_OK]
    fix_if: >-
      Another Decision's leg fails -- the build touched a note it must not; restore it. The stub leg fails --
      re-apply block DECISIONS-73 verbatim.
    hermetic: true
    graduation: graduate
    graduation_check_id: scale-readiness-annotations-73-compacted
  - step: 7
    phase: pre-deploy
    action: >-
      Retirement sweep (closure obligation for the two Delete rows): both retired records are out of the live loader,
      byte-identical under entries/deprecated/, named by no live surface outside docs/plans/ and entries/deprecated/,
      and both replacements are live.
    command: |-
      bin/venv-python -c "
      import subprocess
      from scripts.verification_graduation import load_entries
      E='config/agent/verification_registry/entries/'
      live={e['check_id'] for e in load_entries()}
      for cid in ('event-origin-amended-by-annotations','scale-readiness-annotations'):
          assert cid not in live, cid
          base=subprocess.run(['git','show','origin/main:'+E+cid+'.yaml'],capture_output=True,text=True,check=True).stdout
          assert base==open(E+'deprecated/'+cid+'.yaml',encoding='utf-8').read(), cid
          hits=subprocess.run(['git','grep','-lE',cid+'([^-a-z0-9]|$)','--',':!docs/plans/',':!'+E+'deprecated/'],capture_output=True,text=True).stdout.split()
          assert not hits, (cid, hits)
      assert {'event-origin-amended-by-annotations-73-compacted','scale-readiness-annotations-73-compacted'} <= live
      print('RETIREMENT_73_OK')
      "
    expected: Prints RETIREMENT_73_OK.
    expected_literals: [RETIREMENT_73_OK]
    fix_if: >-
      A record is still live or its content changed -- redo the move as a pure git mv. A live surface names it --
      repoint or remove that reference. A replacement is missing -- graduate steps 5 and 6.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: A one-time retirement sweep over this diff against origin/main; once merged the deprecated subtree is loader-excluded and steps 5 and 6's graduated records are the standing guards.
  - step: 8
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: vp-red-before.yaml refuses to graduate a scripts.validate step (the recursion refusal), and PR CI runs this tier on every PR.
  - step: 9
    phase: pre-deploy
    action: Run the full tier before hand-off (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure -- fix in scope and re-run; outside scope is a plan defect, never a hand-off to PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: Prove the merge synced the stubs to ops_decisions and closed rec-5445, and that the census reads clean with its owners.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json; rows={r['id']: r for r in
      map(json.loads, open('logs/.decisions-index.jsonl'))}; bad={k: rows[k]['status'] for k in ('dec-073', 'dec-135',
      'dec-153') if rows[k]['status'] != 'Superseded'}; assert not bad, bad; print('OPS_DECISIONS_OK')" &&
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
      fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5445']); assert rows and rows[0]['status'] ==
      'closed', rows; print('REC_5445_CLOSED')" && bin/venv-python -m scripts.checks.decisions.standards_census --verify
      audits/standards-cleanup-census.yaml --read-owners
    expected: OPS_DECISIONS_OK, REC_5445_CLOSED and a census verify with no defect line.
    fix_if: A row still Decided -- the rec-autoclose backfill failed; read its run and re-run the backfill through the portal. rec-5445 open -- the Resolves trailer was missing; close it through update_rec with the merge sha.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/DECISIONS.md
    behavior: The chain stays compacted and every victim unit stays accounted for.
    verification_step: 3
    test_selector: tests/checks/decisions/test_consolidation.py
    waiver_reason: test_consolidation.py tests the manifest machinery on fixtures; this chain's own accounting is held by validate_delegated_key_changes over the manifest on every run (step 2), so no chain-specific module is added.
  - source: docs/contracts/fast-tier.yaml
    behavior: The contract's cap and ceiling agree with the selector, the budget and ci.yml.
    verification_step: 3
    test_selector: tests/checks/deps/test_validate_fast_tier.py::test_real_contract_and_workflow_agree
    red_green_expectation: red before (the contract is absent), green after.
  - source: docs/decision-migration/consolidations/consolidate-decision-73-chain.yaml
    behavior: Every unit is disposed and every target resolves.
    verification_step: 8
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: validate_delegated_key_changes already fails any manifest problem on every run while a manifest exists; a new test would duplicate it.
  - source: scripts/checks/deps/validate_fast_tier.py
    behavior: Cap drift, timeout drift and a new bounded step each fail the check; the fast tier's own step timeout is never subtracted.
    verification_step: 3
    test_selector: tests/checks/deps/test_validate_fast_tier.py
    red_green_expectation: red before (the module does not exist), green after.
  - source: scripts/checks/deps/_manifest.py
    behavior: validate_fast_tier is registered in the fast and full tiers.
    verification_step: 3
    test_selector: tests/checks/deps/test_validate_fast_tier.py::test_registered_in_both_tiers
    red_green_expectation: red before (no Entry, so the check is in neither sequence), green after.
  - source: config/ci_rca_taxonomy.yaml
    behavior: The new check maps to a ci-rca category.
    verification_step: 8
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: One mapping row guarded by the existing taxonomy completeness check, which fails an unmapped registered check.
  - source: tests/checks/decisions/test_sit_decision_records.py
    behavior: A compacted noted entry's stub names the SIT Decision.
    verification_step: 3
    test_selector: tests/checks/decisions/test_sit_decision_records.py::test_sit_and_rds_decisions_and_notes
    red_green_expectation: red before (73's body lost its note), green after.
  - source: tests/checks/decisions/test_last_green_decision_records.py
