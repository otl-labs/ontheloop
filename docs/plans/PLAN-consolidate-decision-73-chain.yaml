gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:42178138a4a30ccd95d6daa67f1f7af06068b1aa3d28398a7d1e59c7b59bf3f2"}
  - {gate: decision-scout, round: 2, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:0a77833be5b2f2dd1f46b409c653fd72894579d12e6adf60c77ecf1bb9eae107"}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Rebase onto origin/main; confirm the bodies of Decisions 73, 135 and 153 are unchanged since base_sha (else the manifest's units differ; stop and report a plan defect).
  - Apply every sidecar block verbatim with scripts.roadmap.approved_text, filling {{N}} with the next free number and {{DATE}} with the build date; regenerate docs/decisions-index.json with scripts.decisions_index --write.
  - Create scripts/checks/deps/validate_fast_tier.py and its mirror test, and register the Entry in scripts/checks/deps/_manifest.py, as scope says.
  - Remove census row S5-73.
  - Post on issue #1963 before merge (files taken, the held 252 token).
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results; squash commit body carries Resolves: rec-5445.'
rollback: >-
  Before merge, drop the branch. After merge, roll forward, never revert: a new Decision supersedes the consolidating
  entry and restates what is to be restored; the stubs stay (Decision 177).
