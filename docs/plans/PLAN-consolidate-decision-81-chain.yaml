schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: consolidate-decision-81-chain
intent: >-
  Retire Decision 81's amendment chain (rec-5447, operator-named consolidation 3 of 6): one new Decision states the
  DuckLake ops runtime's standing rules -- functions split by access pattern behind a closed read/write boundary,
  concurrent idempotent writes through one chokepoint per table onto an append-only history with a same-transaction
  current projection, and agent-free maintenance whose garbage collection fails closed -- and supersedes Decisions 81
  and 188, which compact to stubs, so a reader needs one entry instead of twelve; Decisions 143, 210 and eight other
  amenders are carried forward.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-consolidate-decision-81-chain.yaml
implementation_declared: true
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5447
  (Medium), the third of the six consolidations the operator named on 2026-11-20 (census row S5-81,
  audits/standards-cleanup-census.yaml). Closes no roadmap criterion.
cites: [dec:81, dec:84, dec:88, dec:143, dec:149, dec:177, dec:188, dec:191, dec:193, dec:204, dec:207, dec:210, dec:213, dec:230, dec:236, dec:239, dec:246, dec:251, dec:266, dec:276, dec:278, dec:279, dec:283]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Sidecar blocks DECISIONS-1 (the consolidating Decision, supersedes 81 and 188, delegates two existing keys under
      operator_approval), DECISIONS-81 and DECISIONS-188 (compacted-stub-v2 stubs whose Decision lines carry the
      rendered point maps and name every amender).
  - file: docs/decision-migration/consolidations/consolidate-decision-81-chain.yaml
    action: Create
    purpose: >-
      Sidecar block consolidation-manifest: every unit of 81 and 188 at base_sha disposed (restated, delegated, held
      or retired); carried_forward 143, 193, 204, 210, 213, 230, 236, 239, 251 and 266.
  - file: config/decision_supersession_waivers.yaml
    action: Modify
    purpose: Sidecar block waiver-143-81 deletes the 143->81 waiver, which turns stale once the 81 stub names Decision 143 (load-bearing on origin/main, so it goes in the same change).
  - file: audits/standards-cleanup-census.yaml
    action: Modify
    purpose: Remove row S5-81, whose owner rec-5447 this change closes.
bundled_recommendations: [rec-5447]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The committed Decision, stubs, manifest and waiver text equals the approved sidecar (approved_text verify exits 0).
  - Decisions 81 and 188 derive currency superseded_compacted, each superseded by the new Decision; rec-5447's acceptance command passes.
  - The new Decision measures at or under decision-entry.yaml size_governance.measured_size_norm.cap_bytes, and docs/DECISIONS.md shrinks.
  - consolidation.manifest_problems reports nothing, so every unit of 81 and 188 is disposed, every target resolves and each stub's point map matches.
  - Census row S5-81 is gone and the census verifies with its owners read.
  - validate --pre passes, the decisions index is fresh and the full tier passes before hand-off.
  - rec-5447 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed governed text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug consolidate-decision-81-chain --expect e9834b764d8fc7bd3a37d972bbf26768341dc05e1dcf3e5f6c9ff0fd1bded3e9
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier.
  - step: 2
    phase: pre-deploy
    action: Prove rec-5447's acceptance, that the manifest resolves and that the chain compacted onto the new Decision.
    command: >-
      awk '/^## Decision 81:/{f=1;next} /^## Decision [0-9]+:/{f=0} f' docs/DECISIONS.md | grep -q '^\*\*Superseded by:
      Decision [0-9]' && awk '/^## Decision 81:/{f=1;next} /^## Decision [0-9]+:/{f=0} f' docs/DECISIONS.md | grep -q
      '^\*\*Status:\*\* Superseded' && bin/venv-python -m scripts.decisions_index --check &&
      bin/venv-python -c "import json, subprocess; from pathlib import Path; from scripts.checks.decisions import
      consolidation as c; rd=lambda root, rel: (lambda r: r.stdout if r.returncode == 0 else None)(subprocess.run(['git',
      'show', 'origin/main:' + rel], capture_output=True, text=True)); p=c.manifest_problems(Path('.'), rd); assert not p,
      p; rows={r['number']: r for r in json.load(open('docs/decisions-index.json'))['decisions']}; new=[n for n, r in
      rows.items() if sorted(r.get('supersedes') or []) == [81, 188]]; assert len(new) == 1, new; bad={n:
      (rows[n].get('currency'), rows[n].get('superseded_by')) for n in (81, 188) if rows[n].get('currency') !=
      'superseded_compacted' or rows[n].get('superseded_by') != new[0]}; assert not bad, bad; live={n: rows[n].get('currency')
      for n in (143, 193, 204, 210, 213, 230, 236, 239, 251, 266) if rows[n].get('currency') == 'superseded_compacted'};
      assert not live, live; print('CHAIN_81_COMPACTED_OK')"
    expected: Exit 0 and the marker.
    expected_literals: [CHAIN_81_COMPACTED_OK]
    fix_if: A manifest problem, a victim not superseded_compacted or a carried-forward entry compacted -- a sidecar block was applied wrongly; re-apply it. Never edit the manifest to match a wrong tree.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_delegated_key_changes (manifest resolve) and validate_decisions_index_freshness, both in the fast tier; the rec grep runs once more at closure through the Resolves trailer.
  - step: 3
    phase: pre-deploy
    action: Run the consolidation, supersession, census, index and decision-entry tests, and the tests whose subject is a carried-forward amender.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions/test_consolidation.py
      tests/checks/decisions/test_validate_supersession_annotations.py tests/checks/decisions/test_standards_census.py
      tests/checks/decisions/validate_decision_entry_conformance tests/test_decisions_index.py
      tests/test_decisions_index_corpus.py tests/decisions_md tests/checks/contracts/test_write_time_enforcement_decision.py
      tests/checks/contracts/test_ops_rule_source_records.py tests/checks/decisions/test_telemetry_production_catalog_decision.py
      tests/checks/decisions/test_owner_provisioning_decision.py -q
    expected: All pass.
    fix_if: A failure -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The fast tier's affected-set selection runs these modules on every PR touching their sources.
  - step: 4
    phase: pre-deploy
    action: Record the measurement for the PR body.
    command: >-
      bin/venv-python -c "import re, subprocess, yaml; from scripts.decisions_md import iter_decision_sections; from
      scripts.checks.decisions import entry_measure as m; cap=yaml.safe_load(open('docs/contracts/decision-entry.yaml'))['size_governance']['measured_size_norm']['cap_bytes'];
      t=open('docs/DECISIONS.md').read(); base=len(subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True).stdout);
      b={int(re.search(r'Decision (\d+)', h.group(0)).group(1)): s for h, s in iter_decision_sections(t)}; n=next(k for k, s in
      b.items() if 'supersedes: [81, 188]' in s); size=m.measured_bytes(b[n], (m.METADATA_ENVELOPE, m.REVERSAL_CONDITIONS,
      m.OPTIONS_CONSIDERED)); print('measured', size, 'cap', cap, 'whole', len(b[n].encode()), 'file_delta', len(t.encode()) - base);
      assert size <= cap and len(t.encode()) < base; print('CHAIN_81_FITS')"
    expected: The four figures and the marker; measured at or under cap, file_delta negative.
    expected_literals: [CHAIN_81_FITS]
    fix_if: Over the cap -- Decision 278 cl.5's abort fired; stop and report (a rec records why); never trim approved words.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_decisions_size enforces the cap in the fast tier; this step only records the figures.
  - step: 5
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: vp-red-before.yaml refuses to graduate a scripts.validate step (the recursion refusal), and PR CI runs this tier on every PR.
  - step: 6
    phase: pre-deploy
    action: Run the full tier before hand-off (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure -- fix in scope and re-run; outside scope is a plan defect, never a hand-off to PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Prove the merge synced the stubs and the new Decision to ops_decisions and closed rec-5447, and that the census reads clean with its owners.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json; rows={r['id']: r for r in
      map(json.loads, open('logs/.decisions-index.jsonl'))}; bad={k: rows[k]['status'] for k in ('dec-081', 'dec-188')
      if rows[k]['status'] != 'Superseded'}; assert not bad, bad; new=[r for r in rows.values() if 'DuckLake ops runtime in
      one entry' in (r.get('title') or '')]; assert len(new) == 1 and new[0]['status'] == 'Decided', new;
      print('OPS_DECISIONS_OK')" && bin/venv-python -c "from
      src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
      fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5447']); bad=[r['id'] for r in rows if
      r['status'] != 'closed']; assert len(rows) == 1 and not bad, bad; print('RECS_CLOSED')" && bin/venv-python -m
      scripts.checks.decisions.standards_census --verify audits/standards-cleanup-census.yaml --read-owners
    expected: OPS_DECISIONS_OK, RECS_CLOSED and a census verify with no defect line.
    fix_if: A victim row still Decided or the new row missing -- the rec-autoclose backfill failed; read its run and re-run the backfill through the portal. The rec open -- the Resolves trailer was missing; close it through update_rec with the merge sha.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/DECISIONS.md
    behavior: The chain stays compacted and every victim unit stays accounted for.
    verification_step: 3
    test_selector: tests/checks/decisions/test_consolidation.py
    waiver_reason: test_consolidation.py tests the manifest machinery on fixtures; this chain's own accounting is held by validate_delegated_key_changes over the manifest on every run (step 2), so no chain-specific module is added.
  - source: docs/decision-migration/consolidations/consolidate-decision-81-chain.yaml
    behavior: Every unit is disposed and every target resolves.
    verification_step: 5
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: validate_delegated_key_changes already fails any manifest problem on every run while a manifest exists; a new test would duplicate it.
  - source: config/decision_supersession_waivers.yaml
    behavior: No waiver names an edge the annotation check already finds annotated.
    verification_step: 3
    test_selector: tests/checks/decisions/test_validate_supersession_annotations.py
    waiver_reason: validate_supersession_annotations already discriminates the edit on every run -- on origin/main the 81 body does not name Decision 143, so deleting the waiver alone FAILs the unannotated 143->81 edge; with the stub (which names Decision 143) the waiver would be a stale WARN -- so a new test would duplicate it.
  - source: audits/standards-cleanup-census.yaml
    behavior: The census names no exception whose owner rec is closed.
    verification_step: 7
    command: bin/venv-python -m scripts.checks.decisions.standards_census --verify audits/standards-cleanup-census.yaml --read-owners
    waiver_reason: The census verify reads owners after merge (step 7); a row whose owner closed is a census defect line, which the removal prevents; a unit test cannot see the live owner state.
constraints:
  - Approved words are copied from docs/plans/approved/consolidate-decision-81-chain.yaml verbatim; {{N}} and {{DATE}} are filled at build (Decision 217 cl.5).
  - Compaction is not reversible once merged (Decision 149); headers and numbers stay.
  - Edits no other Decision; the carried-forward amenders 143, 193, 204, 210, 213, 230, 236, 239, 251 and 266 keep their bodies and edges.
  - At most four whole victims (decision-compaction.yaml consolidation.procedure); this plan takes two, the operator's choice.
  - No contract, test or graduated record changes; the two delegated keys keep their text.
  - No rescue agents or workaround loops (Decision 55).
