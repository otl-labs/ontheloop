schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "consolidate-decision-92-chain"
intent: >-
  Pilot retiring a long Decision amendment chain (rec-5373, for rec-5265): one new Decision restates the Terraform
  pipeline's standing rules and supersedes Decisions 92, 94, 154 and 190, which compact to stubs, so a reader needs one
  entry instead of nine and the audit's abort test (does a chain fit the entry cap?) gets a measured answer before the
  general rule is planned.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-consolidate-decision-92-chain.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5373
  (Low), the pilot for the contract-first retrospective's optional step 8 (rec-5265). Closes no roadmap criterion.
cites: [dec:77, dec:92, dec:94, dec:126, dec:144, dec:149, dec:150, dec:154, dec:167, dec:175, dec:177, dec:183, dec:190, dec:238, dec:243, dec:246, dec:257, dec:265]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Insert the consolidating Decision (block DECISIONS-1) and replace the bodies of Decisions 92, 94, 154 and 190 with
      compacted stubs (blocks DECISIONS-92/94/154/190), all exactly as the approved-text sidecar binds them.
  - file: docs/contracts/terraform-personal-cd.yaml
    action: Modify
    purpose: >-
      Add convergence_write_mechanism (the mechanism of Decisions 154 and 190 that no key held), its amendment_log row
      and its referenced_repo_paths, exactly as the sidecar binds them.
  - file: config/decision_supersession_waivers.yaml
    action: Modify
    purpose: >-
      Remove the 144->92 waiver, which goes stale once Decision 92's stub names Decision 144 (the guard WARNs on a stale
      waiver). Removal only.
  - file: tests/checks/decisions/test_consolidation_decision_92.py
    action: Create
    purpose: >-
      rec-5373's acceptance: pins the four stubs, the consolidator's supersedes list, measured size and delegated keys,
      the re-homed mechanism, and the clause accounting (every victim clause restated, delegated, moved or retired).
bundled_recommendations: [rec-5373]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The committed Decision text, stubs and contract text equal the approved sidecar (approved_text verify exits 0).
  - Decisions 92, 94, 154 and 190 derive currency superseded_compacted, each superseded by the new Decision.
  - The new Decision's measured size is at or under decision-entry.yaml size_governance.measured_size_norm.cap_bytes.
  - Every key the new Decision delegates resolves at head, and convergence_write_mechanism holds its five subkeys.
  - The clause accounting covers every numbered clause, update note and reversal condition of the four victims.
  - The supersession, entry-conformance, size, currency and terraform-personal-cd guards pass; the index is fresh.
  - rec-5373 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed Decision and contract text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug consolidate-decision-92-chain --expect d48740b57c7f9447c0a6812a3258aa7cade173e2aa48e74cc55582c34066a981
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier (git-ops.yaml
      merge_step_coverage).
  - step: 2
    phase: pre-deploy
    action: Run the pilot's test module, which is rec-5373's acceptance.
    command: bin/venv-python -m pytest tests/checks/decisions/test_consolidation_decision_92.py -q
    expected: All tests pass, including test_victims_are_compacted_stubs (rec-5373's acceptance node).
    fix_if: >-
      A stub, delegated key, re-homed subkey or accounting row is missing -- the sidecar was applied wrongly or a block
      was skipped; re-apply it. Never edit the accounting to match a wrong tree.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The step runs this plan's own pytest module, which the fast tier's affected-test selection runs on every PR that
      touches docs/DECISIONS.md or the two contracts.
  - step: 3
    phase: pre-deploy
    action: Prove the stubs read as compacted and the generated index is fresh.
    command: >-
      bin/venv-python -m scripts.decisions_index --check && bin/venv-python -c "import json;
      rows={r['number']: r for r in json.load(open('docs/decisions-index.json'))['decisions']};
      new=[n for n, r in rows.items() if sorted(int(x) for x in (r.get('supersedes') or [])) == [92, 94, 154, 190]];
      assert len(new) == 1, new;
      bad={n: (rows[n].get('currency'), rows[n].get('superseded_by')) for n in (92, 94, 154, 190)
      if rows[n].get('currency') != 'superseded_compacted' or int(rows[n].get('superseded_by') or 0) != new[0]};
      assert not bad, bad; print('CHAIN_COMPACTED_OK')"
    expected: Exit 0 and the marker.
    expected_literals: [CHAIN_COMPACTED_OK]
    fix_if: A victim is not superseded_compacted or points elsewhere -- the stub block was not applied verbatim.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates step 2's stub test and validate_decisions_index_freshness, both in the fast tier.
  - step: 4
    phase: pre-deploy
    action: Record the pilot's measurement (the audit's abort test) for the PR body and rec-5265.
    command: >-
      bin/venv-python -c "import re, subprocess, yaml;
      from scripts.decisions_md import iter_decision_sections;
      from scripts.checks.decisions import entry_measure as m, decisions_size_measure as d;
      cap=yaml.safe_load(open('docs/contracts/decision-entry.yaml'))['size_governance']['measured_size_norm']['cap_bytes'];
      t=open('docs/DECISIONS.md').read();
      base=len(subprocess.run(['git','show','origin/main:docs/DECISIONS.md'],capture_output=True).stdout);
      b={int(re.search(r'Decision (\d+)', h.group(0)).group(1)): s for h, s in iter_decision_sections(t)};
      n=max(b); size=m.measured_bytes(b[n], d._MEASURED_EXCLUDED);
      print('measured', size, 'cap', cap, 'whole', len(b[n].encode()), 'file_delta', len(t.encode()) - base);
      assert size <= cap; print('PILOT_FITS')"
    expected: Prints the four figures and the marker; measured is at or under cap and file_delta is negative.
    fix_if: >-
      Over the cap -- the audit's abort condition fired: stop, report to rec-5265 that the subject belongs in a
      contract, and do not trim approved words to fit.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A one-time measurement for the pilot's report; validate_decisions_size enforces the cap.
  - step: 5
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Run the full tier before handoff (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure -- fix in scope; a sandbox-only failure follows the operator's 2026-11-17 ruling to rely on PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Prove the merge synced the stubs to ops_decisions and closed rec-5373.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json;
      rows={r['id']: r for r in map(json.loads, open('logs/.decisions-index.jsonl'))};
      bad={k: rows[k]['status'] for k in ('dec-092', 'dec-094', 'dec-154', 'dec-190') if rows[k]['status'] != 'Superseded'};
      assert not bad, bad; print('OPS_DECISIONS_OK')" && bin/venv-python -m scripts.recs_related --terms rec-5373 --table --limit 1
    expected: The marker, and rec-5373 no longer listed as open.
    fix_if: >-
      A row still Decided -- the rec-autoclose backfill step failed; read its run and re-run the backfill through the
      portal. rec-5373 open -- the Resolves trailer was missing; close it through update_rec with the merge sha.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: tests/checks/decisions/test_consolidation_decision_92.py
    behavior: The chain stays compacted, its delegated keys resolve and every victim clause stays accounted for.
    verification_step: 2
    test_selector: tests/checks/decisions/test_consolidation_decision_92.py
    red_green_expectation: red before (the module does not exist and the stubs are absent), green after.
constraints:
  - Approved words are copied from docs/plans/approved/consolidate-decision-92-chain.yaml verbatim; {{N}} and {{DATE}} are filled at build (Decision 217 cl.5).
  - Compaction is not reversible once merged (Decision 149); headers and numbers stay (never_remove_headers).
  - Edits no other Decision; amenders 144, 238, 257 and 265 keep their bodies and edges.
  - No contract line budget raise; terraform-personal-cd.yaml stays under 500 effective lines.
  - No rescue agents or workaround loops (Decision 55).
