  - "Operator choice 2026-11-18 (decision card in this plan's thread): pilot on Decision 92 before the rule; reds rec-5353 and rec-5355 deferred. Ruling R1 (2026-11-17) is in rec-5265 and rec-5373."
  - "Depends on PR #2198 (Decision 273, rec-3023): the envelope delegates field, measured_size_norm and docs/contracts/decision-compaction.yaml. Do not start the build before it merges; rebase the sidecar anchors then."
  - "Census and advisor consult: rec-5373 context; the plan PR body carries the clause accounting summary."
  - "Draft measured on PR #2198's tree (48da77d2), after scout r2: consolidator 3,519 measured bytes (7,080 whole) against a 5,120 cap; DECISIONS.md -24,640 bytes; supersession, conformance, size, currency and terraform-personal-cd guards pass with the 144->92 waiver removed."
  - "Decision-scout r1 FLAGS_FOUND; CITE 77, 92, 94, 126, 144, 149, 150, 154, 167, 175, 177, 190, 238, 243, 246, 257, 265. Decisions triaged: 221 of 221. Roadmap items intersected: 5; CONFLICT: 0; RELATED: 5. Serves: NS.4. Flags: 183 WARN (clause 2 named one heal verb) -> fixed, both heal verbs named; 175 WARN (citers, manifest) -> not migrate_then_rehome, see Branch line; 158 NOTE -> clause 4 scoped to DuckLake artifacts; 149 NOTE (94 VP10 unaccounted) -> accounting row and anti_masking sentence added. The contract's own stale ONLY-way wording in convergence_anchor.dispatch_ack_unlatch is rec-3351's."
  - "Decision-scout r2 FLAGS_FOUND; CITE 77, 92, 94, 126, 144, 149, 150, 154, 167, 177, 190, 238, 243, 246, 257, 265. Decisions triaged: 220 of 220. Roadmap items intersected: 5; CONFLICT: 0; RELATED: 5. Serves: NS.4 4/5. Flags: 183 WARN (the operator ruling of 2026-11-02 lets an approved gated apply clear a stale_gated_approval red) -> named in cl.2 and the convergence_anchor bound, dec:183 cited; 149 WARN (about 220 clause-level citations of the victims land on stubs) -> each stub carries a point map; 175 NOTE (first delegation-as-subsumption reading) -> stated on the Branch line, the PR body and rec-5265; 94 stub names convergence_write_mechanism; 92 ratification-path sentence held by Decisions 84 I-2 and 105; 181 NOTE (cl.5 coverage) -> Coverage row added. Wording slip an/a heal-verb fixed."
  - "Red overlap 2026-11-18: blocked, slo_breached rec-5353, rec-5355, rec-5364 (no shared paths). Operator deferred rec-5353 and rec-5355 for this plan (card, 2026-11-18) and rec-5353, rec-5355 and rec-5364 project-wide (ruling 2026-11-18 12:49Z, logged on #1963)."
  - "Shared files (plan_obligations): unbuilt plans also scope terraform-personal-cd.yaml (secrets-to-ssm-retire, trusted-plan-cutover, pr-plan-opaque-iam-policy-check) and DECISIONS.md (several); whichever builds second rebases and re-applies the sidecar anchors."
  - "Merge order: after PR #2198; merge_serial with the reviews, delegation-and-cap and consolidation builds on docs/DECISIONS.md (WORK-ORDER.md)."
