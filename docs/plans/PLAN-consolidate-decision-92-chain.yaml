  - {gate: decision-scout, round: 2, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:1874762cab5cc3170f52988bca1c9757b1078dfd60ce892dbc8e5cf76e0713b1"}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - PR #2198 merged; sidecar anchors still match main
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Confirm PR #2198 has merged (docs/contracts/decision-compaction.yaml exists on main) and rebase; if not, stop."
  - "Apply every sidecar block verbatim, filling {{N}} with the next free number and {{DATE}} with the merge date (scripts.roadmap.approved_text); regenerate docs/decisions-index.json with scripts.decisions_index --write."
  - "Remove the 144->92 row from config/decision_supersession_waivers.yaml."
  - "Create tests/checks/decisions/test_consolidation_decision_92.py with ACCOUNTING (below) and tests that: each of 92, 94, 154, 190 is_compacted_stub and points at the consolidator; the consolidator's envelope supersedes exactly [92, 94, 154, 190]; its measured bytes <= measured_size_norm.cap_bytes; every delegates key resolves; convergence_write_mechanism has pre_apply_failure, reviewed_bytes, anti_masking, health_signals, record_schema; every ACCOUNTING row's target resolves (a restated cl.N exists in the consolidator's Decision section, a key resolves, a moved subkey exists, a retired row has a reason)."
  - "ACCOUNTING: 92 pt1 -> cl.1; pt2 -> cl.2 + terraform-personal-cd.yaml#convergence_anchor; pt3 -> cl.1, cl.3 + environment-taxonomy.yaml#axis_a.sandbox_gated_apply; pt4 -> cl.3; pt5 -> cl.3 + environment-taxonomy.yaml#guard_classification; pt6 -> cl.5; waves-2-5 direction -> cl.1-3; CD.35 filing clause -> retired (historical: CD.35 is filed_via ops_decisions:dec-092); problem and rationale -> retired (history in git and ops_decisions SCD2), except the ratification-path sentence -> held by Decision 84 I-2 and Decision 105. 94 correction -> cl.1; 94 VP10 secondary correction -> cl.5 + moved anti_masking. 154 pt1 -> cl.4 + moved reviewed_bytes; pt2 -> moved reviewed_bytes; pt3 -> moved reviewed_bytes; pt4 -> cl.2 + moved pre_apply_failure; pt5 -> moved pre_apply_failure + stanza marker-hid-mutation; pt6 -> cl.5 + moved anti_masking; pt7 -> moved health_signals; update 2026-10-17 -> held environment-taxonomy.yaml#conformance.ducklake_detail; update 2026-11-02 -> retired (glossary read_as rows govern); update 2026-11-16 -> cl.1, cl.2 + held axis_a.sandbox_gated_apply; reversal (a) -> marker-hid-mutation, (b) -> ci-rca-independence-lapses, (c) -> markers-unactioned. 190 pt1 -> cl.2 + environment-taxonomy.yaml#convergence_drift_route_exhaustiveness; pt2, pt3 -> environment-taxonomy.yaml#convergence_marker_vocabulary; pt4 -> moved health_signals; pt5, pt6 -> moved health_signals; pt7 -> moved record_schema; reversal (a) -> marker-hid-mutation, (b) -> markers-unactioned, (c) -> drift-semantics-move. 144 pt5 (92 part) -> cl.3; 238 cl.6 (92 part) -> cl.6 + held terraform-personal-cd.yaml#speculative_plan_and_apply_the_saved_plan; 257 (92 pt4 part) -> cl.3; 265 cl.1-2 (154 part) -> cl.1, cl.2."
  - "Execute the Verification Plan; loop until pass; on an unrecoverable failure stop and RCA (Decision 55)."
