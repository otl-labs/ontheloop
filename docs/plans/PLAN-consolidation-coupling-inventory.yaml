verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5627's acceptance node and the core fixture nodes pass.
    command: >-
      bin/venv-python -m pytest
      tests/checks/decisions/consolidation_inventory/test_inventory.py::test_planted_couplings_found_per_kind
      tests/checks/decisions/consolidation_inventory/test_inventory.py::test_false_positives_stay_possible
      tests/checks/decisions/consolidation_inventory/test_inventory.py::test_renumbered_victim_moves_its_hits
      tests/checks/decisions/consolidation_inventory/test__probe.py::test_body_pin_breaks_number_pin_survives -q
    expected: exit 0 with 4 passed; before the change the files do not exist and pytest exits non-zero
    fix_if: a kind is missed, a false positive is promoted above possible, or the probe mislabels a pin
    hermetic: true
    expected_literals: ["4 passed"]
    graduation: graduate
    graduation_check_id: consolidation-inventory-planted-couplings
  - step: 2
    phase: pre-deploy
    action: Every new node passes and each new module stays under 500 SLOC.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions/consolidation_inventory -q &&
      bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-consolidation-coupling-inventory.yaml
    expected: pytest exits 0 with no failure; plan_obligations reports no SLOC crossing for a scope file
    fix_if: a node fails, or a module crosses 500 SLOC (split it inside the package, never a raise, Decision 128)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-directory re-run of the in-scope suite (hermetic rule (v)); step 1 graduates the acceptance nodes and the full tier runs the rest.
  - step: 3
    phase: pre-deploy
    action: >-
      Recall on chain 1's real couplings: on the commit before the Decision 73 chain build, the probe confirms the
      three test nodes and two records that build had to change.
    command: >-
      r=$(pwd) && w=$(mktemp -d)/wt && git worktree add --detach "$w" b71b98f1^ >/dev/null &&
      cp -r scripts/checks/decisions/consolidation_inventory "$w"/scripts/checks/decisions/ &&
      (cd "$w" && export OTL_VENV_PYTHON="$r/.venv/bin/python" &&
      bin/venv-python -m scripts.checks.decisions.consolidation_inventory 73 135 153 --probe --json > ../inv73.json; echo "cli_exit=$?";
      bin/venv-python -c "import json,sys; h=json.load(open('../inv73.json'))['hits']; b={x['locator'] for x in h if x['probe']=='breaks'}; c={x['locator'] for x in h if x['tier']=='confirmed'}; want=['tests/checks/decisions/test_last_green_decision_records.py::test_each_amended_entry_carries_one_dated_note','tests/checks/decisions/test_sit_decision_records.py::test_sit_and_rds_decisions_and_notes','tests/ci_rca/test_recovery_policy_surfaces.py::TestDecisionEntry::test_amended_decisions_carry_the_annotation']; recs=['event-origin-amended-by-annotations','scale-readiness-annotations']; miss=[x for x in want if x not in b]+[x for x in recs if not any(x in l for l in b)]; print('missing', miss); print('confirmed', len(c)); sys.exit(1 if miss else 0)"); s=$?;
      git worktree remove --force "$w"; rm -rf "$(dirname "$w")"; (exit $s)
    expected: cli_exit=0, then "missing []" and a confirmed count; exit 0
    fix_if: >-
      a listed node or record is missing from probe breaks (a recall gap: fix the scan or the stub template, never the
      expected list), or the worktree cannot be created (the step needs full git history: run it in a full clone).
      Expected runtime: a few minutes (about 20 candidate nodes run twice, plus the records); if it nears the
      10-minute foreground cap, run it backgrounded
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Needs full git history and a worktree of a historical commit, which shallow CI clones lack; steps 1 and 2 hold the behaviour on fixtures.
  - step: 4
    phase: pre-deploy
    action: >-
      Recall on chain 2's real couplings: on main before the Decision 126 chain build, the inventory confirms the
      couplings that plan's sidecar edits.
    command: >-
      r=$(pwd) && w=$(mktemp -d)/wt && git worktree add --detach "$w" 2822dd1f >/dev/null &&
      cp -r scripts/checks/decisions/consolidation_inventory "$w"/scripts/checks/decisions/ &&
      (cd "$w" && export OTL_VENV_PYTHON="$r/.venv/bin/python" &&
      bin/venv-python -m scripts.checks.decisions.consolidation_inventory 126 183 --probe --json > ../inv126.json; echo "cli_exit=$?";
      bin/venv-python -c "import json,sys; h=json.load(open('../inv126.json'))['hits']; b={x['locator'] for x in h if x['probe']=='breaks'}; k={(x['kind'],x['victim']) for x in h if x['tier']=='confirmed'}; files=['tests/checks/decisions/test_sit_decision_records.py','tests/checks/decisions/test_revise_route_decision_records.py','tests/checks/decisions/test_telemetry_production_catalog_decision.py','tests/test_decisions_index.py']; miss=[f for f in files if not any(l.startswith(f+'::') for l in b)]; miss+=[] if any('decision-north-star-promoted-appends' in l for l in b) else ['record']; miss+=[x for x in [('supersession_waiver',126),('census_row',126),('north_star_carrier',126)] if x not in k]; print('missing', miss); sys.exit(1 if miss else 0)"); s=$?;
      git worktree remove --force "$w"; rm -rf "$(dirname "$w")"; (exit $s)
    expected: cli_exit=0, then "missing []"; exit 0
    fix_if: a listed file, the record, the waiver, the census row or the carrier is missing (a recall gap in that kind)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Needs a worktree of a fixed historical commit (full git history); steps 1 and 2 hold the behaviour on fixtures.
  - step: 5
    phase: pre-deploy
    action: >-
      Read-only on the live tree, for chain 3's root and two amenders (evidence for rec-5628 and rec-5447; report-only).
    command: >-
      set -o pipefail; wt=$(git worktree list | wc -l) && st=$(git status --porcelain) &&
      bin/venv-python -m scripts.checks.decisions.consolidation_inventory 81 143 188 --probe | tail -1 &&
      test "$(git status --porcelain)" = "$st" && test "$(git worktree list | wc -l)" = "$wt" && echo "tree untouched"
    expected: the TOTAL line, then "tree untouched"; the build pastes the text output into its PR body and rec-5628's context
    fix_if: the CLI errors, the tree changed, or a worktree was left behind (expected runtime a few minutes; background it near the 10-minute cap)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads the live log, whose couplings move with every merge (a moment claim); steps 1 and 2 hold the behaviour.
  - step: 6
    phase: pre-deploy
    action: The consolidation procedure names the inventory, and the contract still loads and validates.
    command: >-
      bin/venv-python -c "import yaml; p=yaml.safe_load(open('docs/contracts/decision-compaction.yaml'))['consolidation']['procedure']; assert 'scripts.checks.decisions.consolidation_inventory' in p[0], p[0][:120]; print('POINTER_OK')"
      && bin/venv-python -m pytest tests/checks/decisions/consolidation_inventory/test___main__.py::test_real_repo_smoke_invariants -q
    expected: prints POINTER_OK, then 1 passed
    fix_if: the pointer is missing from the first procedure step, or the smoke node fails on the live tree
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: The pointer check is a wording-presence check and the smoke node reads the live tree; the node runs in the fast tier as a test.
  - step: 7
    phase: post-deploy
    action: rec-5627 reads back closed after the build's squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5627']); print(rows[0]['status'])"
    expected: prints closed
