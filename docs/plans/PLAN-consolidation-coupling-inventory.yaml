  - "On the commit before the Decision 73 chain build (b71b98f1^), the CLI for victims 73 135 153 with --probe reports probe_breaks for every node of tests/checks/decisions/test_last_green_decision_records.py, tests/checks/decisions/test_sit_decision_records.py and tests/ci_rca/test_recovery_policy_surfaces.py that the build edited, and for the records event-origin-amended-by-annotations and scale-readiness-annotations (VP 3)."
