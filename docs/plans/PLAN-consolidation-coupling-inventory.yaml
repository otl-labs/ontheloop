slug: consolidation-coupling-inventory
intent: >-
  Give every Decision chain consolidation a day-one list of what reads its victims, so the plan is scoped from one
  read-only command instead of being discovered one gate round at a time (rec-5627; 10 wording rounds on chain 1, 6
  scout and 3 critique rounds on chain 2). The same hit model is the library the decoupling change (rec-5628) builds its
  guard on, before chain 3 (rec-5447).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-consolidation-coupling-inventory.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5627 (High, M), operator direction 2026-11-24 21:09Z ("fix harness; decouple before chain 3"). Closes no roadmap
  criterion.
closes_criteria: []
cites: [dec:278, dec:276, dec:279]
amends: []
introduces: []
scope:
  - file: scripts/checks/decisions/consolidation_inventory/__init__.py
    action: Create
    purpose: >-
      Facade (Decision 80/104/124 pattern) re-exporting the public surface: Hit, Evidence, Inventory, RULES,
      STUB_TEMPLATE, inventory(root, victims, *, include_citations=False) and probe(root, inv). Not a registered check
      (precedent scripts/checks/decisions/standards_census.py and scripts/checks/contracts/amendment_compact.py).
  - file: scripts/checks/decisions/consolidation_inventory/_model.py
    action: Create
    purpose: >-
      The hit schema and the fixed rule table. Hit = {kind, victim, locator ("path::node" or "file:key"), evidence:
      [Evidence{type, detail}], tier, effect, rule_id, needs_disposition, probe}. Evidence types, closed set:
      structured_key (an exact field match in YAML/JSON), probe_breaks, probe_survives, probe_red_before (the node or
      record already fails on the unstubbed tree), dataflow_literal (the victim literal sits in a node whose closure
      also opens a decisions source), cooccurrence (the literal sits in a node of a file that names a decisions source).
      tier is derived, never set: confirmed (structured_key or probe_breaks), probable (dataflow_literal), possible
      (cooccurrence, or probe_survives alone). RULES maps kind -> (rule_id, effect, needs_disposition), one row per
      kind below; a probe result overrides the rule's effect (breaks -> its rule effect; survives -> effect
      "survives"), and "unknown" is legal. probe is one of breaks, survives, red_before, not_run. Pure, never raises.
  - file: scripts/checks/decisions/consolidation_inventory/_pytest_scan.py
    action: Create
    purpose: >-
      kind test_node. Candidate files: tests/**/*.py whose text names a decisions source (docs/DECISIONS.md,
      docs/DECISIONS_ARCHIVE.md, docs/decisions-index.json, or an import of scripts.decisions_md or
      scripts.decisions_index). Per test node (module test_* functions and Test* class methods, ids as pytest prints
      them; parametrize ids not expanded), the node's literal closure is the int constants and the numbers in
      "Decision N" / "Decisions N, M" / "dec-NNN" / "## Decision N" string constants of the node body, its decorators
      (parametrize arguments), and, transitively, every module-level assignment, module function or class attribute it
      names. A victim in the closure is a hit: dataflow_literal when the closure also names a decisions source,
      cooccurrence otherwise. Syntax errors skip the file with a note, never raise.
  - file: scripts/checks/decisions/consolidation_inventory/_structured.py
    action: Create
    purpose: >-
      Exact structured surfaces, each evidence structured_key, each its own kind and RULES row (effect in brackets):
      graduated_record (config/agent/verification_registry/entries/*.yaml, not deprecated/, whose guard_target or
      command names a decisions source and whose command holds the victim as a bare number token; evidence
      cooccurrence, since the command is code) [retire_and_replace, Decision 235 cl.1]; north_star_carrier
      (docs/contracts/north-star.yaml carried_by or ratified_via naming the victim) [move_carrier];
      supersession_waiver (config/decision_supersession_waivers.yaml superseder or victim) [delete_orphan_waiver];
      census_row (audits/standards-cleanup-census.yaml rows whose root or victim is the victim) [remove_row];
      manifest_reference (docs/decision-migration/consolidations/*.yaml supersedes, carried_forward, or a unit's held
      "Decision N") [fails_resolve]; chain_edge (a live entry whose envelope amends or supersedes, or whose title-borne
      amends edge, names the victim; read from docs/decisions-index.json and the envelopes) [victim_or_carry_forward];
      delegated_key (each key the victim's envelope delegates) [redelegate]; authorizing_marker (a "<token>: dec-NNN"
      marker in a tracked config, script or workflow file naming the victim; the marker guard follows the stub to its
      successor, whose body must then mention the marker's path) [successor_must_mention]; roadmap_citation
      (docs/ROADMAP-PLATFORM.yaml tier_items not complete whose exit criteria cite the victim) [restate_not_retire];
      size_budget (config/prose_budgets.yaml and config/structural_size_budgets.yaml rows for each file holding a hit
      whose effect edits that file, plus the DECISIONS.md size ceiling line, always) [ratchet_after_edit].
  - file: scripts/checks/decisions/consolidation_inventory/_citations.py
    action: Create
    purpose: >-
      anchored_citation, always on: "Decision N point k", "Decision N pt k", "Decision N cl.k", "Decision N clause(s)
      k" and "N pt k" forms in docs/contracts/*.yaml, AGENTS.md, **/CLAUDE.md, .claude/skills/**/*.md, docs/DECISIONS.md
      outside the victims, and string constants of scripts/**/*.py and src/**/*.py [stale_anchor: the point map must
      cover the clause]. citation (bare "Decision N" / "dec-NNN" in the same files): counts per file by default, one hit
      per occurrence with --include-citations [stale_citation: the number resolves to the stub].
  - file: scripts/checks/decisions/consolidation_inventory/_probe.py
    action: Create
    purpose: >-
      probe(root, inv): in a detached git worktree of HEAD under a temp dir (removed in finally), first run every
      candidate test_node and graduated_record unstubbed (failures become probe_red_before), then replace each victim's
      section in docs/DECISIONS.md with the STUB_TEMPLATE stub (header line unchanged, Status Superseded, Date kept,
      a Decision line and a Superseded by line naming a placeholder successor one above the highest number; no
      successor entry is written), regenerate docs/decisions-index.json with scripts.decisions_index --write, and run
      them again: a node or record red only after stubbing is probe_breaks, green after is probe_survives. All victims
      are stubbed together (the consolidation case). Test nodes run in one pytest subprocess with a junit report;
      records run their check_spec command with cwd at the worktree; both set OTL_VENV_PYTHON to the caller's
      interpreter (the venv-less worktree) and keep the cache provider with one scratch cache_dir per run pair
      (addopts carries --randomly-seed=last). Output carries the stub template id. A worktree or subprocess failure
      leaves every hit probe not_run with the reason, exits non-zero, and never raises out of the CLI.
  - file: scripts/checks/decisions/consolidation_inventory/__main__.py
    action: Create
    purpose: >-
      CLI: bin/venv-python -m scripts.checks.decisions.consolidation_inventory VICTIM [VICTIM ...] [--root DIR]
      [--probe] [--include-citations] [--json] [--tier confirmed|probable|possible]. Text mode groups hits by kind
      with one line each (tier, effect, locator, victim, short evidence) and ends with a "TOTAL" line counting hits per
      kind and needs_disposition; JSON mode prints the Inventory as one sorted object with schema_version and
      stub_template. Output is deterministic (sorted, no timestamps). Exit 0 on success; 1 when a victim has no header
      or the probe failed; 2 on usage error.
  - file: tests/checks/decisions/consolidation_inventory/test_inventory.py
    action: Create
    purpose: >-
      rec-5627's acceptance node and the hermetic fixture suite. A tmp_path repo (git init, one commit) with a tiny
      DECISIONS.md whose numbers are 9001 and up, and one planted coupling per kind and evidence type, plus planted
      false positives: test_planted_couplings_found_per_kind (every kind, its tier, effect and rule_id);
      test_false_positives_stay_possible (a fixture number in a file that never opens the log is not reported; one
      in a node with no decisions source is cooccurrence only); test_unrelated_entry_leaves_output_unchanged;
      test_renumbered_victim_moves_its_hits; test_output_is_byte_identical_across_runs; test_unknown_victim_exits_1;
      test_citations_counted_unless_included.
  - file: tests/checks/decisions/consolidation_inventory/test__pytest_scan.py
    action: Create
    purpose: >-
      Closure rules on synthetic sources: module tuple constants, parametrize lists, helper calls, class attributes,
      "Decisions N, M" strings, dec-NNN, transitive names, a syntax error skipped, ids as pytest prints them.
  - file: tests/checks/decisions/consolidation_inventory/test__structured.py
    action: Create
    purpose: Each structured kind on fixtures, including deprecated records ignored and complete tier_items ignored.
  - file: tests/checks/decisions/consolidation_inventory/test__probe.py
    action: Create
    purpose: >-
      On the tmp_path repo: a planted body-pinning test is probe_breaks, a number-only test probe_survives, a test
      failing before stubbing probe_red_before, a body-pinning record probe_breaks; the worktree is removed afterwards
      (git worktree list unchanged); a failing git command leaves hits not_run and exits 1.
  - file: tests/checks/decisions/consolidation_inventory/test__main__.py
    action: Create
    purpose: >-
      CLI over the fixture repo (text and JSON shape, --tier filter, exit codes) plus one real-repo smoke node,
      invariants only: the CLI over the live tree for a live victim exits 0, its JSON round-trips, every locator path
      exists, and two runs are byte-identical. No count or named location of the live log is asserted.
  - file: docs/contracts/decision-compaction.yaml
    action: Modify
    purpose: >-
      consolidation.procedure's first step gains, after its operator-naming sentence (which holds Decision 278 cl.2),
      the pointer: then run bin/venv-python -m scripts.checks.decisions.consolidation_inventory <victims> --probe and
      scope the plan from its output before drafting; plus one terse amendment_log row. No new step is inserted. Notice class (approval-routing.yaml gates neither the
      file nor the key).
