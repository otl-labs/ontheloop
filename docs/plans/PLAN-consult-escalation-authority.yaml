pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Confirm rec-5644's build has merged; rebase onto origin/main; confirm each sidecar block's before-text is present; run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-consult-escalation-authority.yaml and stop on a verdict other than clear.
  - Place sidecar block decision-new in docs/DECISIONS.md with the next free number and today's date; regenerate docs/decisions-index.json with its generator.
  - Apply the coordinator.yaml sidecar blocks verbatim; run bin/venv-python -m scripts.checks.contracts.amendment_compact --check docs/contracts/coordinator.yaml and stop if it reports a compactable row (plan defect).
  - Edit the planning skill, plan.md and the consult skill per their rows, filling {{N}}.
  - Edit scripts/roadmap/plan_gate_rounds.py and add the tests per their rows; create tests/test_consult_escalation_contract.py with the build's Decision number.
  - Add T4.39 to docs/ROADMAP-PLATFORM.yaml per its row.
  - Measure the planning and consult skill bytes (wc -c) and set their S4 entries in config/prose_budgets.yaml with the marker.
  - Execute the Verification Plan -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results; the squash-merge body carries Resolves: rec-5645.'
rollback: Before merge, drop the branch. After merge, revert the squash commit; nothing is deployed. Planners then send every escalation to the operator again.
