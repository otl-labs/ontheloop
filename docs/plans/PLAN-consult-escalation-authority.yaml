schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: consult-escalation-authority
intent: >-
  Let a plan critique that fails to converge be settled by the advice consult instead of waiting for the operator,
  while every question of intent, taste, cost or approved scope still reaches the operator: a new Decision makes the
  consult a compute-plane persona that decides convergence escalations, and the planning workflow, the gate_rounds
  record and the coordinator contract follow it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-consult-escalation-authority.yaml
implementation_declared: false
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5645
  (Medium). Adds tier item T4.39 (the consult persona contract, deferred_post_mvp); closes no roadmap criterion.
cites: [dec:229, dec:231, dec:247, dec:205, dec:235, dec:279, dec:246, dec:165, dec:93, dec:167, dec:181, dec:282, dec:241]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Gated: exactly sidecar block decision-new (docs/plans/approved/consult-escalation-authority.yaml), the new
      Decision placed at the top of the corpus; {{N}} is the next free number at build, {{DATE}} the build date (UTC).
  - file: docs/contracts/coordinator.yaml
    action: Modify
    purpose: >-
      Gated (routing): exactly the sidecar's blocks -- roles.advisor names its one exception (a convergence escalation
      routed to it), routing.table gains the convergence-escalation row after the "taste, IAM or infrastructure fork"
      row, and one amendment_log row ({{N}}, {{DATE}} filled). amendment_compact --check finds nothing to compact
      (simulated on origin/main with the edits), so no compaction (Decision 282 cl.1); re-run it at build. Nothing
      else in the file changes: a gated change binds the whole file (approval-routing.yaml selectors), so
      advisor_consults stays as it is (CEA-32).
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Notice class (the Critique Gate section is not gated). In the Escalate paragraph, the text from "Carrier:
      AskUserQuestion if held" through "(accept-with-deferral is human-authored only)." becomes: "Route (Decision
      {{N}}), for this gate alone (the Decision Scout and Report Critique gates escalate to the human): a convergence
      escalation (any trigger but the last) goes to a consult per the `consult` skill, which may only rule whether
      each disputed finding holds (where it holds: fix it, disposition fixed; where it does not: write its evidence at the
      finding's anchor; it stays disputed) and choose one more round, once per plan. Its brief gives each disputed
      finding (for a trigger with none, the findings at the escalation's anchors) verbatim with its tag and anchor,
      quotes each anchor's field text, and gives both positions unattributed, with their cited evidence; it withholds
      the round history, the trigger and every recommendation; the consult does not read `gate_rounds` or `context`. A consult that errors, returns no ruling or cannot
      verify a finding hands the escalation back to the human. It decides once per finding: a later escalation at an
      anchor it decided, any escalation after its one more round, the last trigger, a fork on taste, cost or intent, a finding that the plan weakens
      verification (Decision 235 cl.1), and every other choice go to the human. Carrier: AskUserQuestion if held, else
      chat; dispatched, GATE_REQUEST `open_questions`. An open escalation is a stop: no round, no plan edit, until the
      human answers it, or the consult a convergence one; record the answer as the row's `escalation_choice` and
      `escalation_decider` (accept-with-deferral is human-authored only). Tell the human of a consult's choice at once
      and list each in the plan PR body; they may override it until the plan PR merges, recorded on the consult's row as
      `overrides_consult: true` with their `override_choice`, which then counts as the row's choice. An override made
      after a later round is also the human's answer on the latest plan-critique row (`escalated: true`, that
      `escalation_choice`, `escalation_decider: operator`), and the loop follows it from there; after the series' final PROCEED, record it on the consult's row alone, and an override there other than
      accept-with-deferral reopens the loop under that choice." In the
      Contested-residue line (as rec-5644 leaves it), "It recommends a disposition and decides nothing. Revisit after 10
      contested escalations; demote if it changed nothing in 8 or more." becomes "On a second blocking finding on one
      plan row it only advises; on a disputed one it decides per the Escalate rule. Revisit after 10 contested
      escalations a consult decided (every row with `escalation_decider: consult`): return them to the human if the human
      overrode (`overrides_consult`) or re-escalated (a later escalated row in that plan that the human decided) 4 or
      more." The old "changed nothing in 8 or more" measure is dropped: it graded an adviser, and the advisory
      second-finding consult is counted by rec-4435. {{N}} is the build's number.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Step 9: "offers accept-with-deferral / re-scope / split / abandon / one more round;" gains, before its semicolon,
      " (the human's menu; a routed consult chooses only one more round)", and "An open escalation stops the loop
      until the human answers." becomes "An open escalation stops the loop
      until the human answers, or the consult a convergence escalation (the planning skill's Escalate rule)."
  - file: .claude/skills/consult/SKILL.md
    action: Modify
    purpose: >-
      Created by rec-5644. (1) Its Protocol sentence carrying "decides nothing" gains ", except a convergence
      escalation the planning skill's Escalate rule routes to it, where it chooses only as that rule allows and its
      caller records the choice without rejecting it (Decision {{N}})" before its full stop. (2) Its trigger list's
      disputed-blocking-finding trigger gains "; or any convergence escalation the planning skill's Escalate rule routes
      to it (oscillation, a third blocking finding on one plan row, a sixth-round REVISE)". (3) CEA-28: the frontmatter
      description's one-line trigger list gains "or a convergence escalation the planning skill's Escalate rule
      routes to it". (4) A new Ruling paragraph after the Protocol (blind consult 2026-11-26): "On a routed convergence
      escalation, answer each disputed finding holds, does not hold or cannot determine, citing file:line for each
      premise you read; apply plan-critique's blocking test (what reaches main if left unfixed, and which control fails
      first); do not read the plan's `gate_rounds` or `context`. Hand back unruled, as "No ruling: <reason>; missing: <what would
      settle it>" (on a sign-off fork, add your recommendation), when the anchor or its cited evidence is unreadable, the finding turns on live state, runtime
      behaviour or cost the repo does not show, ruling needs a sign-off fork, the brief discloses a preferred outcome,
      or the finding is a guard-input (5c) or category-consistency (12p) finding." Nothing else changes.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      The S4 entries for .claude/skills/planning/SKILL.md and .claude/skills/consult/SKILL.md rise to their measured
      bytes (wc -c after the edits) with the inline marker "# raise-approved: dec-{{N}} consult escalation routing"
      (validate_prose_budget_raises, Decision 165: the new Decision is direction and above kind_floor, and its Coverage
      names both paths). If the marker is refused, stop: plan defect.
  - file: scripts/roadmap/plan_gate_rounds.py
    action: Modify
    purpose: >-
      GateRound gains escalation_decider (Literal["operator", "consult"] | None; absent reads operator, so existing rows
      stay valid at schema_version 7), overrides_consult (StrictBool, default False), override_choice (the five-choice
      Literal | None) and a read-only property effective_choice (override_choice when overrides_consult, else
      escalation_choice). New validator _check_decider, called from _verdict_matches_gate: escalation_decider consult,
      overrides_consult or override_choice on a row whose gate is not plan-critique is refused ("the consult route is
      the plan-critique gate's alone (Decision {{N}})"; escalation_decider operator stays allowed on any escalated row);
      a decider needs an escalation_choice; decider consult needs escalation_choice "one more round" ("a consult decides
      only one more round; any other choice is the operator's (Decision {{N}} cl.4)"); overrides_consult needs decider
      consult and an override_choice ("an override is written on the consult's row with the operator's choice"), and
      override_choice needs overrides_consult and must differ from escalation_choice ("an override names a different
      choice"; CEA-34). _check_findings' deferrable set and version_errors' PROCEED check read
      effective_choice instead of escalation_choice. version_errors (list-level) also refuses a second plan-critique
      row with escalation_decider consult in one plan: "a consult decides once per plan (Decision {{N}} cl.3)" (CEA-46). The existing message "escalation_choice records the human's
      answer to an escalation; set escalated: true" becomes "escalation_choice records the decider's answer to an
      escalation; set escalated: true". The class docstring names the four.
    new_imports: []
  - file: scripts/checks/roadmap/_plan_critique_end.py
    action: Modify
    purpose: >-
      ended() reads last.effective_choice in place of last.escalation_choice, so an operator override to
      accept-with-deferral on the consult's row ends the series. Nothing else changes.
    new_imports: []
  - file: tests/checks/roadmap/test__plan_critique_end.py
    action: Modify
    purpose: >-
      The _row helper's SimpleNamespace gains effective_choice=choice (the attribute ended now reads; no assertion
      changes). Adds test_an_override_to_deferral_on_a_consult_row_ends_the_series: a real GateRound REVISE row with
      escalation_decider consult, escalation_choice one more round, overrides_consult true, override_choice
      accept-with-deferral ends the series at schema 7; the same row without the override does not. Adds
      test_a_late_override_ends_the_series_on_the_latest_row (CEA-22): that overridden consult row followed by a later
      real GateRound REVISE row the operator escalated (escalated true, escalation_choice accept-with-deferral,
      escalation_decider operator) with a deferred blocking finding validates and ends the series; the same pair
      without the later row's answer does not end it. Adds test_a_late_override_after_the_final_proceed_ends_the_series (CEA-27):
      an overridden consult row followed by a final PROCEED row validates and the series ends.
  - file: tests/test_plan_gate_rounds.py
    action: Modify
    purpose: >-
      Adds test_consult_decides_only_one_more_round (consult + one more round validates; consult + re-scope, split,
      abandon or accept-with-deferral each refused), test_override_is_written_on_the_consults_row (overrides_consult true
      + override_choice re-scope on a consult row validates, keeps decider consult and reads effective_choice re-scope;
      overrides_consult on an operator or decider-less row refused; overrides_consult without override_choice refused;
      override_choice without overrides_consult refused; overrides_consult "yes" or 1 refused, StrictBool; an
      override_choice equal to the row's escalation_choice refused, "an override names a different choice"),
      test_an_override_to_deferral_allows_deferred_blocking_findings (a consult row overridden to accept-with-deferral
      validates with a deferred blocking finding; the same row without the override is refused; a PROCEED consult
      row overridden to accept-with-deferral yields version_errors' schema-7 message),
      test_consult_route_is_plan_critique_only (escalation_decider consult on an escalated decision-scout BLOCK row
      refused; overrides_consult on a wording-check row refused; escalation_decider operator on an escalated
      decision-scout row validates) test_decider_needs_an_escalation_choice and test_consult_decides_once_per_plan (CEA-46: version_errors over two
      consult-decided plan-critique rows returns the once-per-plan message; one such row returns none). Existing tests
      unchanged.
  - file: tests/test_consult_escalation_contract.py
    action: Create
    purpose: >-
      The rec acceptance, whitespace collapsed. test_decision_records_consult_escalation_authority: via
      tests/fixtures/decision_entry.py decision_entry(text, N) (N literal, the build's number), the entry's kind is
      direction and it holds "compute_plane persona", "weakens verification (Decision 235 cl.1)", "choose one more
      round", "accept-with-deferral, re-scope, split and abandon stay the operator's", "hands such an escalation back", "both positions unattributed", "hands back unruled, with the reason" and
      "escalation_decider consult". test_planning_skill_routes_convergence_escalations_to_consult: the planning
      skill holds "for this gate alone (the Decision Scout and Report Critique gates escalate to the human)", "a
      convergence escalation (any trigger but the last) goes to a consult per the `consult` skill", "It decides once per finding", "any escalation after its one more round", "once per plan", "a finding that the plan weakens verification (Decision
      235 cl.1)", "`escalation_decider`", "recorded on the consult's row as `overrides_consult: true` with their
      `override_choice`, which then counts as the row's choice", "An override made after a later round is also the
      human's answer on the latest plan-critique row",  "after the series' final
      PROCEED, record it on the consult's row alone", "both positions unattributed", "the consult does not read `gate_rounds` or `context`", "quotes each anchor's field text", "where it holds: fix
      it", "hands the escalation back to the
      human", "reopens the loop under that choice", "(every row with `escalation_decider: consult`)" and "(a
      later escalated row in that plan that the human decided)" and lacks "It recommends a disposition and decides
      nothing"; plan.md holds "or the consult a convergence escalation"; the consult skill holds "except a convergence
      escalation the planning skill's Escalate rule routes to it", "records the choice without rejecting it", "holds, does not hold or cannot determine", "No ruling: <reason>;
      missing: <what would settle it>", "guard-input (5c) or category-consistency (12p)" and "or any
      convergence escalation the planning skill's Escalate rule routes to it".
      test_coordinator_routes_convergence_escalations_to_consult: yaml-parsed coordinator.yaml has one routing.table row
      whose situation starts "convergence escalation in plan critique" and whose route holds "choosing only one more
      round" and "weakens verification", and roles.advisor holds "except a convergence escalation routed to it".
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      New tier item T4.39 after T4.38, every field T4.38 carries except completed_at: tier T4; name "The consult persona -- its contract, its
      index row and its dispatch (Decision {{N}})"; intent "Decision {{N}} cl.1, cl.2 and cl.6: the advice consult ships
      as a compute_plane persona that reads and never edits, dispatched (Decision 241's engine) after a plan_agent
      consult-requested outcome; until then a planning session runs it as a subagent."; depends_on [T4.32, T4.31];
      files_in_scope []; exit_criteria c1 "docs/contracts/personas/consult.yaml declares kind compute_plane, no
      edit_repo or run_tests capability and an output separating settled consensus from contested points, and
      executor-personas.yaml indexes it" (status open) and c2 "plan_agent's contract declares a consult-requested outcome
      naming the escalation, and the coordinator (Decision 241's engine, cl.1-2) dispatches the consult and re-runs
      plan_agent with its answer as a named input (Decision 229 cl.2)" (status open); related_decisions [229, 231, 205,
      241, {{N}}]; effort M; strategic false; status deferred_post_mvp; progress_note "Parked deferred_post_mvp (Decision
      93): the operator said on 2026-11-25 that consults stay interactive for a long time; the in-session subagent
      serves until then (Decision {{N}} cl.2)."
bundled_recommendations: [rec-5645]
followon_recs: [rec-5667]
infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY DEFERRED: docs/ROADMAP-PLATFORM.yaml is a data-pipeline asset (compute_affected_artifacts); the new
    T4.39 item is read only by the rec-curator prompt, which is off until T4.12, so no build, deploy or smoke step; the
    next routine data-pipeline deploy refreshes it.
acceptance_criteria:
  - The Decision, the planning skill, plan.md, the consult skill and coordinator.yaml carry the route (tests/test_consult_escalation_contract.py's three node ids).
  - gate_rounds refuses a consult choice other than one more round, an override not written on the consult's row, and the consult route on any gate but plan-critique (tests/test_plan_gate_rounds.py's six new node ids, one refusing a second consult-decided row in a plan), and an override to accept-with-deferral ends the series wherever the planning skill records it, keeping every consult row's decider (tests/checks/roadmap/test__plan_critique_end.py's three new node ids).
  - The committed gated text equals the approved sidecar (approved_text verify exits 0).
  - Decision, roadmap, prose budget and contract checks pass; validate --pre passes and the full tier passes before hand-off.
  - rec-5645 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the acceptance tests and the pinned workflow-skill tests.
    command: >-
      bin/venv-python -m pytest -rs tests/test_consult_escalation_contract.py::test_decision_records_consult_escalation_authority
      tests/test_consult_escalation_contract.py::test_planning_skill_routes_convergence_escalations_to_consult
      tests/test_consult_escalation_contract.py::test_coordinator_routes_convergence_escalations_to_consult
      tests/test_plan_gate_rounds.py::test_consult_decides_only_one_more_round
      tests/test_plan_gate_rounds.py::test_override_is_written_on_the_consults_row
      tests/test_plan_gate_rounds.py::test_consult_route_is_plan_critique_only
      tests/test_plan_gate_rounds.py::test_an_override_to_deferral_allows_deferred_blocking_findings
      tests/checks/roadmap/test__plan_critique_end.py::test_an_override_to_deferral_on_a_consult_row_ends_the_series
      tests/checks/roadmap/test__plan_critique_end.py::test_a_late_override_ends_the_series_on_the_latest_row
      tests/checks/roadmap/test__plan_critique_end.py::test_a_late_override_after_the_final_proceed_ends_the_series
      tests/test_plan_gate_rounds.py::test_consult_decides_once_per_plan
      tests/checks/roadmap/test__plan_critique_end.py::test_clean_proceed_confirming_round_and_deferral_end_at_both_versions
      tests/test_plan_gate_rounds.py::test_decider_needs_an_escalation_choice
      tests/test_plan_gate_rounds.py::test_escalation_choice_requires_an_escalation
      tests/test_workflow_skill_antidrift.py::test_open_escalation_stops_the_loop_and_records_the_answer
      tests/test_workflow_skill_antidrift.py::test_oscillation_revisit_condition_is_countable
      tests/test_workflow_skill_antidrift.py::test_contested_residue_consult_names_its_dispatch_carrier
      tests/test_workflow_skill_antidrift.py::test_plan_command_and_overseer_contract_defer_to_the_skill_rule
      tests/test_consult_skill_contract.py::test_consult_skill_holds_protocol_and_triggers
      tests/test_consult_skill_contract.py::test_live_surfaces_point_at_the_consult_skill -q
    expected: All pass with no skip.
    fix_if: A failure names the surface or phrase; fix the surface, never loosen an assertion (Decision 181).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Default-collected test files that every full tier already runs; a registry row would duplicate them.
  - step: 2
    phase: pre-deploy
    action: After the build commit (validate_contract_drift reads committed changes), run the registered checks the edits touch.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as a;from
      scripts.checks.prose.prose_budget_raises import validate_prose_budget_raises as b;from
      scripts.checks.prose.prose_limits import validate_prose_limits as c;from
      scripts.checks.roadmap.validate_platform_roadmap import validate_platform_roadmap as d;from
      scripts.checks.roadmap.validate_roadmap_liveness import validate_roadmap_liveness as e;from
      scripts.checks.decisions.validate_decisions_size import validate_decisions_size as f;from
      scripts.checks.decisions.validate_decision_entry_conformance import validate_decision_entry_conformance as g;from
      scripts.checks.structural.size_limits import validate_structural_size_limits as h;x=[];[k(x) for k in
      (a,b,c,d,e,f,g,h)];assert not x,x;print('ESCALATION-CHECKS OK')"
    expected: The checks report no failure and the command exits 0.
    fix_if: A check names a row, entry or budget; fix that surface.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The eight checks are registered and run in every tier.
  - step: 3
    phase: pre-deploy
    action: Prove the committed gated text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug consult-escalation-authority --expect 1f30fe3da8a69cc5908aeb1a7bf14118b013809f67c66aae2608e6307a0e1974
    expected: Exit 0.
    fix_if: A difference is reported; restore the approved words. Any other change is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier.
  - step: 4
    phase: pre-deploy
    action: Full tier then HEAD attestation, after the build commit and rebase and before the push; started backgrounded from the top-level session with a 2 h limit (tests/test_aws_profile.py needs HOME as an empty dir).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The full tier exits 0 and --verify-head confirms the attestation names HEAD.
    fix_if: A failing check is fixed on the branch; a timeout is BLOCKED, never a push.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole-suite run, not a guard.
  - step: 5
    phase: post-deploy
    action: rec-5645 closed by the merge commit's Resolves trailer.
    command: bin/venv-python -c "from src.common import ducklake_reader_client as rc;rows,m=rc.fetch_recs_by_ids(rc.make_reader(profile='agent_platform'),['rec-5645']);print(rows[0]['id'],rows[0]['status'])"
    expected: The line reads rec-5645 closed.
    fix_if: Still open after the closure job ran; read the trailer-acceptance verdict artifact for the node id.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: Refresh the coordinator's shared-store copy, since coordinator.yaml changed (coordinator.yaml delivery rule).
    command: bin/venv-python -m scripts.session.coordinator_copy write /mnt/project-files/coordinator/ && bin/venv-python -m scripts.session.coordinator_copy check /mnt/project-files/coordinator/
    expected: The check exits 0 against main's merge commit.
    fix_if: The check reports stale; re-run write after fetching main.
    hermetic: false
    graduation: not-applicable
