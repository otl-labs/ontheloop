execution_steps:
  - Rebase onto origin/main; confirm each sidecar block's before-text is still present in implement-scope-boundary.yaml (else stop, plan defect); run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-consult-skill.yaml and stop on a verdict other than clear.
  - Create .claude/skills/consult/SKILL.md per its scope row.
  - Edit the overseer skill and command, the planning and implement skills, data-modeling-standard.yaml, read_sets.yaml and file-router.yaml per their rows; apply every sidecar block's after-text to implement-scope-boundary.yaml verbatim.
  - Run bin/venv-python -m scripts.checks.contracts.amendment_compact --rows 1 --write docs/contracts/file-router.yaml after adding its row.
  - Measure the consult, overseer, planning and implement skill bytes (wc -c) and set their four S4 entries in config/prose_budgets.yaml per its row.
  - Recompute the implementing run's stored baselines in config/agent/read_sets.yaml per its row (read_set_report.band_totals over file_sizes(ref) for each boundary and reading).
  - Create tests/test_consult_skill_contract.py and update tests/test_scope_boundary_contract.py per their rows.
  - Execute the Verification Plan -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results; squash-merge body carries Resolves: rec-5644.'
rollback: Before merge, drop the branch. After merge, revert the squash commit; nothing is deployed.
