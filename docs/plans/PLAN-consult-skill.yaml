schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: consult-skill
intent: >-
  Give the advice consult its own home before the overseer skill is retired (Decision 247): a consult skill holds the
  protocol and every trigger in one list, and every live surface that pointed at the overseer skill's section points
  at it, so the practice survives the retirement and a later producer change can attribute its runs.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-consult-skill.yaml
implementation_declared: false
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5644
  (High). Closes no roadmap criterion.
cites: [dec:247, dec:229, dec:279, dec:246, dec:181]
scope:
  - file: .claude/skills/consult/SKILL.md
    action: Create
    purpose: >-
      The consult's single home. Frontmatter name consult and a description that starts "Use when: you were dispatched
      as a consult" and says a caller never invokes it in its own session but dispatches a fresh-context subagent
      (Agent, model: "fable") whose first action is to invoke this skill. Body, under 2.5 KB: (1) the protocol carried
      over from the overseer skill's "## Fable Advice-Consult Protocol" -- reads (Read, Grep, Glob and
      read-only commands) and edits nothing; verifies the facts it relies on; separates settled consensus from
      contested (where practice diverges from this repo's convention or Decisions); gives one recommendation per
      question with its main consequence; decides nothing; (2) the caller reconciles each recommendation as adopt,
      adapt or reject and records it where it records the decision (the overseer ledger it was logged to retires with
      the overseer); (3) one numbered trigger list: a major design
      decision or design fork in a plan; a disputed blocking critique finding (the planning skill's contested residue);
      a second blocking finding on one plan row; a NEW table, a NEW identity scheme or a merge_key change
      (data-modeling-standard.yaml design_time_walk step 8); a load-bearing or novel in-scope under-specification in
      /implement (implement-scope-boundary.yaml deviation_trigger branch a); workflow adaptation (adapting your own
      workflow to a situation the methodology does not cover, before improvising a one-off workaround); rec synthesis
      (reconciling a cluster of related recs into one plan boundary, not sequencing already-atomic work). No other
      rule, model or authority is added.
  - file: .claude/skills/overseer/SKILL.md
    action: Modify
    purpose: Delete the "## Fable Advice-Consult Protocol" section (heading through the line before "## Model Namespace Note"). Nothing else changes.
  - file: .claude/commands/overseer.md
    action: Modify
    purpose: >-
      The skill-note list drops "the Fable advice-consult protocol,"; Step 3's first sentence becomes "Dispatch a
      consult per `.claude/skills/consult/SKILL.md`" in place of "Apply the skill's Fable Advice-Consult Protocol:
      dispatch a fresh-context `model: "fable"` subagent", the rest of the sentence unchanged.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Critique Gate's Contested-residue consult line only: "On a disputed blocking finding only, consult `model:
      "fable"` per the overseer skill's Fable Advice-Consult Protocol" (116 B) becomes "On a disputed blocking finding,
      or a second on one plan row, consult `model: "fable"` per the `consult` skill" (109 B); the dispatched-carrier
      parenthesis and the rest of the paragraph are unchanged (tests/test_workflow_skill_antidrift.py pins both). The
      file is at its S4 budget (NEAR_CAP), so the edit must not grow it; its entry drops to the measured bytes.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Deviation trigger branch (a): "consult `model:"fable"` per `.claude/skills/overseer/SKILL.md` "## Fable
      Advice-Consult Protocol" when load-bearing or novel," (125 B) becomes "dispatch a `model:"fable"` consult per
      `.claude/skills/consult/SKILL.md` when load-bearing or novel," (100 B); "recorded either way" stays. At its S4
      budget (NEAR_CAP): the edit shrinks it and its entry drops to the measured bytes.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      design_time_walk step 8: "dispatch a model:"fable" advice-consult per the overseer skill's Fable Advice-Consult
      Protocol" becomes "dispatch a consult per .claude/skills/consult/SKILL.md"; the "Fable escalation: for
      load-bearing/novel calls only" marker stays (validate_skill_prose_relocation reads it). One new terse
      amendment_log row at the top (validate_contract_drift: Class D), prose_improvement, semantic_break false.
  - file: docs/contracts/implement-scope-boundary.yaml
    action: Modify
    purpose: >-
      Gated (approval-routing.yaml yaml_keys deviation_trigger): both edits are the approved sidecar's after-text
      verbatim (docs/plans/approved/consult-skill.yaml) -- deviation_trigger branch a's pointer moves to
      .claude/skills/consult/SKILL.md, and one amendment_log row is appended after the 2026-11-20 row.
  - file: config/agent/read_sets.yaml
    action: Modify
    purpose: >-
      The implement read set's on_demand row for .claude/skills/overseer/SKILL.md (basis "implement SKILL.md: Fable
      Advice-Consult Protocol") becomes path .claude/skills/consult/SKILL.md, basis "implement SKILL.md: deviation
      branch (a) consult".
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      The overseer-skill route description drops ", and the Fable advice-consult protocol" and re-wraps to two lines;
      one new terse amendment_log row at the top (prose_improvement, semantic_break false), and in the same change
      bin/venv-python -m scripts.checks.contracts.amendment_compact --rows 1 --write docs/contracts/file-router.yaml
      (Decision 282 cl.1: the log is over its full-row limit, so adding a row must compact one; lines_freed 0). No new
      route: the file is NEAR_CAP (498 of 500 effective lines), and these edits keep it at 498.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      S4 gains .claude/skills/consult/SKILL.md at its measured bytes with the inline marker "# raise-approved: dec-229
      consult skill, the read-only advice consult a session runs as a subagent (Decision 229 cl.2 note 2026-11-02)"
      (validate_prose_budget_raises, Decision 165: the cited body must name the key or an ancestor of at least two
      segments; Decision 229's names .claude/skills/code-review and its cl.2 note names the advice consult; 229 is below
      approval-routing.yaml kind_floor; precedent: the canary-persona entry). The overseer entry drops to its measured
      bytes, and so do the planning and implement entries (the ratchet pins each entry to its measured size; a decrease
      is unrestricted). If the marker is refused, stop: plan defect, never another Decision.
  - file: tests/test_consult_skill_contract.py
    action: Create
    purpose: >-
      The rec acceptance. test_consult_skill_holds_protocol_and_triggers: the skill parses with frontmatter name
      consult; its description names the dispatch (model: "fable" and the first action invoking this skill) and says a
      caller never invokes it in its own session; the body carries "edits nothing", "settled consensus", "contested",
      adopt, adapt and reject, and one anchor phrase per trigger (design fork, disputed blocking finding, second blocking
      finding on one plan row, merge_key, deviation_trigger, workflow adaptation, rec synthesis).
      test_live_surfaces_point_at_the_consult_skill: no file among the overseer skill, the overseer command, the
      planning and implement skills, data-modeling-standard.yaml, implement-scope-boundary.yaml and read_sets.yaml
      contains "Fable Advice-Consult Protocol"; the planning skill names the `consult` skill in its Contested-residue
      consult line with the second-blocking-finding trigger; the implement skill and the two contracts each name
      .claude/skills/consult/SKILL.md; read_sets.yaml lists it; file-router.yaml no longer says "Fable advice-consult protocol".
  - file: tests/test_scope_boundary_contract.py
    action: Modify
    purpose: >-
      test_implement_skill_deviation_trigger_has_three_branches_and_pointers asserts "consult/SKILL.md" in the section
      in place of "Fable Advice-Consult Protocol" and "overseer/SKILL.md"; every other assertion unchanged.
bundled_recommendations: [rec-5644]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The consult skill holds the protocol, the dispatch shape and all seven triggers (tests/test_consult_skill_contract.py::test_consult_skill_holds_protocol_and_triggers).
  - No live surface points at the overseer skill's consult section and each caller names the consult skill (tests/test_consult_skill_contract.py::test_live_surfaces_point_at_the_consult_skill).
  - The committed implement-scope-boundary.yaml text equals the approved sidecar (approved_text verify exits 0).
  - Contract drift, size, prose budget, placement and relocation checks pass with the new S4 registration.
  - validate --pre passes and the full tier passes before hand-off.
  - rec-5644 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the acceptance file and the pinned skill and contract tests.
    command: bin/venv-python -m pytest tests/test_consult_skill_contract.py tests/test_scope_boundary_contract.py tests/test_workflow_skill_antidrift.py tests/checks/contracts/test_validate_skill_prose_relocation.py -q
    expected: All pass; the summary reads passed with no failed or error.
    fix_if: A failure names the surface or phrase; fix the surface, never loosen an assertion (Decision 181).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Default-collected test files that every full tier already runs; a registry row would duplicate them.
  - step: 2
    phase: pre-deploy
    action: Stale-reference sweep and the registered checks the edits touch.
    command: >-
      ! grep -rln "Fable Advice-Consult Protocol" .claude docs/contracts config && bin/venv-python -c "from
      scripts.checks.contracts.validate_contract_drift import validate_contract_drift as d;from
      scripts.checks.prose.prose_budget_raises import validate_prose_budget_raises as i;from
      scripts.checks.prose.prose_limits import validate_prose_limits as j;from
      scripts.checks.contracts.validate_skill_prose_relocation import validate_skill_prose_relocation as r;from
      scripts.checks.hygiene.validate_placement import validate_placement as p;from
      scripts.checks.structural.size_limits import validate_structural_size_limits as h;f=[];[g(f) for g in
      (d,h,i,j,p,r)];assert not f,f;print('CONSULT-CHECKS OK')"
    expected: The grep finds nothing and the checks report no failure; exit 0.
    fix_if: A file still names the overseer's section, or a check fails; fix the named surface or row.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The six checks are registered and run in every tier; the sweep is held by step 1's live-surfaces test.
  - step: 3
    phase: pre-deploy
    action: Prove the committed gated text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug consult-skill --expect e941a1bab990da37ba68e416b75a819012f970dd7749f800318e7bdad5f3291d
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier.
  - step: 4
    phase: pre-deploy
    action: Full tier then HEAD attestation, after the build commit and rebase and before the push; started backgrounded from the top-level session with a 2 h limit (tests/test_aws_profile.py needs HOME as an empty dir).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The full tier exits 0 and --verify-head confirms the attestation names HEAD.
    fix_if: A failing check is fixed on the branch; a timeout is BLOCKED, never a push.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole-suite run, not a guard.
  - step: 5
    phase: post-deploy
    action: rec-5644 closed by the merge commit Resolves trailer.
    command: bin/venv-python -c "from src.common import ducklake_reader_client as rc;rows,m=rc.fetch_recs_by_ids(rc.make_reader(profile='agent_platform'),['rec-5644']);print(rows[0]['id'],rows[0]['status'])"
    expected: The line reads rec-5644 closed.
    fix_if: Still open after the closure job ran; read the trailer-acceptance verdict artifact for the node id.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: .claude/skills/consult/SKILL.md
    behavior: the consult protocol, dispatch shape and seven triggers live in one skill
    verification_step: 1
    test_selector: tests/test_consult_skill_contract.py::test_consult_skill_holds_protocol_and_triggers
    red_green_expectation: red before (the skill is absent), green after
  - source: .claude/skills/overseer/SKILL.md
    behavior: the retiring skill no longer carries the consult section
    verification_step: 1
    test_selector: tests/test_consult_skill_contract.py::test_live_surfaces_point_at_the_consult_skill
    red_green_expectation: red before (the section is present), green after
  - source: .claude/commands/overseer.md
    behavior: the retiring command points at the consult skill
    verification_step: 1
    test_selector: tests/test_consult_skill_contract.py::test_live_surfaces_point_at_the_consult_skill
    red_green_expectation: red before (it names the overseer protocol), green after
  - source: .claude/skills/planning/SKILL.md
    behavior: the contested-residue consult dispatches the consult skill, and the second-blocking-finding trigger is named
    verification_step: 1
    test_selector: tests/test_consult_skill_contract.py::test_live_surfaces_point_at_the_consult_skill
    red_green_expectation: red before (it names the overseer protocol), green after
  - source: .claude/skills/implement/SKILL.md
    behavior: deviation branch (a) dispatches the consult skill
    verification_step: 1
    test_selector: tests/test_scope_boundary_contract.py::TestProseSurfacesPointAtContract::test_implement_skill_deviation_trigger_has_three_branches_and_pointers
    red_green_expectation: red before (the section names overseer/SKILL.md), green after
  - source: docs/contracts/data-modeling-standard.yaml
    behavior: step 8 points at the consult skill
    verification_step: 1
    test_selector: tests/test_consult_skill_contract.py::test_live_surfaces_point_at_the_consult_skill
    red_green_expectation: red before (it names the overseer protocol), green after
  - source: docs/contracts/implement-scope-boundary.yaml
    behavior: deviation branch a points at the consult skill
    verification_step: 1
    test_selector: tests/test_consult_skill_contract.py::test_live_surfaces_point_at_the_consult_skill
    red_green_expectation: red before (it names the overseer protocol), green after
  - source: config/agent/read_sets.yaml
    behavior: the implement read set loads the consult skill, not the overseer skill, for the consult
    verification_step: 1
    test_selector: tests/test_consult_skill_contract.py::test_live_surfaces_point_at_the_consult_skill
    red_green_expectation: red before (the row names the overseer skill), green after
  - source: docs/contracts/file-router.yaml
    behavior: the overseer route no longer claims the consult protocol
    verification_step: 1
    test_selector: tests/test_consult_skill_contract.py::test_live_surfaces_point_at_the_consult_skill
    red_green_expectation: red before (the overseer route names the protocol), green after
  - source: config/prose_budgets.yaml
    behavior: the new skill is registered under its budget with an authorizing marker
    verification_step: 2
    command: >-
      ! grep -rln "Fable Advice-Consult Protocol" .claude docs/contracts config && bin/venv-python -c "from
      scripts.checks.contracts.validate_contract_drift import validate_contract_drift as d;from
      scripts.checks.prose.prose_budget_raises import validate_prose_budget_raises as i;from
      scripts.checks.prose.prose_limits import validate_prose_limits as j;from
      scripts.checks.contracts.validate_skill_prose_relocation import validate_skill_prose_relocation as r;from
      scripts.checks.hygiene.validate_placement import validate_placement as p;from
      scripts.checks.structural.size_limits import validate_structural_size_limits as h;f=[];[g(f) for g in
      (d,h,i,j,p,r)];assert not f,f;print('CONSULT-CHECKS OK')"
    waiver_reason: validate_prose_budget_raises and validate_prose_limits already fail an unmarked or missing S4 registration on every run; a new test would duplicate them.
constraints:
  - Semantics unchanged (rec-5644 out of scope) -- the consult stays advisory and read-only; who decides an escalation (rec-5645), the persona contract and the hard-coded model "fable" (rec-5646) do not change.
  - No source_registry key, field_semantics regeneration or Lambda deploy -- the consult key ships with the producer change in rec-5071.
  - docs/contracts/overseer-dispatch.yaml is not edited; fable_triggers stays for rec-5286.
  - Approved words for implement-scope-boundary.yaml are copied from docs/plans/approved/consult-skill.yaml verbatim.
  - No assertion is weakened (Decision 181) -- the one retargeted pointer assertion (tests/test_scope_boundary_contract.py) checks the new pointer at the same strength, and the code-review weakening disposition records it so.
  - No rescue agents or workaround loops (Decision 55).
