  - "Decision-scout r2 FLAGS_FOUND. Decisions triaged: 217 of 217. Roadmap items intersected: 10; CONFLICT: 0; RELATED: 10. Serves: NS.4 4/5. CITE: 86, 128, 150, 165, 166, 167, 168, 181, 243, 246. Round-1 flags resolved. CONTRADICT 240 WARN (compaction rewrites records): Decision {{N}} amends 240 cl.4 for top-level rows, glossary.yaml read_as.rule in scope; put to the operator. SPIRIT 128 WARN (a seed marker authorizes every later raise by key): adopted, budget_raises binds byte_budgets with exact-key mentions and a fresh-mention state-diff spec. Notes adopted: execution step names no _population.py edit; cl.4 states max(N, base)."
  - "Operator choices (thread, 2026-11-17): blind Fable consult requested (brief and advice: /mnt/project-files/decision-growth/contract-bytes/advisor-brief/); 48 KiB limit with a one-time compaction of the files over it; write the plan 14:07Z."
