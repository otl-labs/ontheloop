  - "red_overlap (2026-11-17 14:2xZ): blocked. Deferral: rec-5247 (slo_breached; Feedback Loop's telemetry-reader timeout, operator ruling 2026-11-17: plan merges defer to it and proceed) and rec-5276 (overlap, filed 13:51Z; telemetry arrival excuse row for PR #2041 in config/telemetry/arrival.yaml; shared paths are transitive test selections only, no shared scope file). Neither is repaired here; the build waits for green main per the normal rules."
