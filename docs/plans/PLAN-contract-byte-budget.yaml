execution_steps:
  - 1. Run VP 1 on the base; any False stops the build (plan-defect report).
  - 2. Write the new tests (VP 2-4 selections) and confirm each fails on the base for the reason its test_obligations row names (red before).
  - 3. Implement _amendment_retention.py (with rewrite_violation) and its drift wiring; then size_limits.py, budget_raises.py (legs a-c and the path-scoped base reader) and headroom.py.
  - 4. Add amendment_log_retention to contract-population.yaml and the read_as.rule exception to glossary.yaml (each with its own terse amendment_log row), and max_bytes, relief_valve and the header note to the contracts row.
  - 5. Compact the nine contracts' amendment_logs per the constraints; run VP 6 and restore word for word any row a test reads.
  - 6. Measure the nine on the head; seed byte_budgets by bare file name with each still over 49,152 at its exact size and the marker; place the sidecar words with the assigned {{N}} and {{DATE}}.
  - "7. Execute Verification Plan steps 2-7; loop until pass. On an unrecoverable failure stop and RCA (Decision 55)."
  - >-
    8. Commit Flow (implement skill, git-ops.yaml handoff_sequence and resolves_trailer, in order). Readiness:
    bin/venv-python -m scripts.session.github_readiness; copy code review's weakening_dispositions entries into this
    plan if they differ, set implementation_declared: true, steps 2-7 pass and validate --pre is green. The commit body
    carries Resolves: rec-5262, rec-4119. Rebase onto origin/main (scripts.session.rebase_resolve); if the rebase moved
    any sidecar before-text or another Decision took {{N}}, stop and re-run the wording check and a new approval run
    unless the change is anchor-only or number-only (Decision 246 cl.2); re-run VP 1's over-set premise and VP 5 on the
    rebased tree. Step 8 full tier and --verify-head on the rebased clean HEAD. Postflight evidence, push, PR
    (Resolves block and the VP table in the body), subscribe. Post the #1963 entry. Merge under standing_authorisation
    (code review PROCEED, green CI, validate_merge_step green; the only always_ask content is sidecar-bound text):
    merge_step premerge --slug contract-byte-budget --expect <the approved= value of the recorded approval run>,
    merge_pull_request squash with expectedHeadSha, then merge_step readback.
  - 9. Post-merge step 9 once the rec-autoclose job has run.
  - 'Report: what was implemented, verification results, the merge SHA and the rec closure read-back.'
rollback: >-
  Revert the squash commit: the byte leg, roster, retention rule and Decision leave together; compacted rows return from
  the revert. A partial revert that keeps byte_budgets without its Decision fails the marker scan.
