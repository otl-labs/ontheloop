schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: contract-byte-budget
intent: >-
  Make the contracts class's size budget track what an agent pays to read a contract (audit finding CFR-05): keep the
  500-effective-line budget and add a 49,152-byte per-file companion with a marker-gated grandfather roster, compact old
  amendment_log rows to one-line terse rows under a stated retention rule (rec-4119), name the relief valves in order
  (compact, defer detail by citation, split a second subject, raise last), and report each contract's bytes and 30-day
  growth in the planner's headroom line. One new direction Decision amending Decision 166 authorizes the roster; its
  words are bound by the approved-text sidecar.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-contract-byte-budget.yaml
phase: >-
  user_explicit_out_of_scope (operator remit 2026-11-17: the contract-first retrospective's findings,
  audits/contract-first-retrospective-177c8f37.yaml CFR-05; recs only, no roadmap item). Closes no tier_item criterion.
cites: [dec:86, dec:128, dec:150, dec:165, dec:166, dec:167, dec:168, dec:177, dec:179, dec:181, dec:210, dec:240, dec:243, dec:246]
scope:
  # ------------------------------------------------- bound words (docs/plans/approved/contract-byte-budget.yaml)
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Sidecar blocks DECISIONS-1 (new Decision {{N}}, inserted after the preamble), DECISIONS-2 (dated trailer after
      Decision 166's 2026-08-24 amendment line) and DECISIONS-3 (dated note after Decision 240's 2026-11-02 Update), word
      for word; fill only {{N}} (next free number at build) and {{DATE}}.
  # ------------------------------------------------- field semantics
  - file: config/structural_size_budgets.yaml
    action: Modify
    purpose: >-
      contracts row gains `max_bytes: 49152` (raw UTF-8 bytes of the whole file) and a relief_valve text naming, in order:
      compact amendment_log rows (contract-population.yaml amendment_log_retention); defer detail to the owning plan or
      Decision by citation; split a second subject into a sibling contract (own evaluator, own reader, references the
      rest only by one pointer; Decision 168); loud cited raise last; splitting one subject across files and history or
      prose companions forbidden (Decision 86); pointer keys (status, residual_owner, flips_to_hard_fail_when) never
      compacted away. Header comment documents the byte unit next to the long-line companion. New column-0
      `byte_budgets:` roster after `long_line_budgets:`, keyed by the contract's bare file name (e.g. `git-ops.yaml`;
      "/"-free keys, as marker-grammar.yaml's precedent, so _marker_guard's ancestor expansion can never widen a mention
      to every contract), seeded with each contracts file still over 49,152 bytes after the compaction rows below, at its
      measured size, each line `# raise-approved: dec-{{N}} byte companion install seed (PLAN-contract-byte-budget)`.
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      New top-level `amendment_log_retention` mapping: keep_full 5; terse_row (keys exactly date, semantic_break,
      change_class, summary; summary at most 160 characters naming the plan slug, rec or Decision); exempt_rows
      (semantic_break true); scope (top-level amendment_log only; field-level logs untouched, Decision 210);
      exempt_files [docs/contracts/north-star.yaml] (its Tier A guard treats a removed row as no new row);
      rule (when a change adds a genuinely new top-level row, the head's full-row count may not exceed max(keep_full,
      base full-row count)); new_row_identity (rows compared as multisets of their canonical dumps, dates ignored:
      genuinely new rows = max(0, head-not-base count minus base-not-head count), so a reworded or re-dated old row is
      a rewrite, never new). change_detection.amendment_log names the identity rule. One terse
      amendment_log row of its own.
  - file: docs/contracts/glossary.yaml
    action: Modify
    purpose: >-
      read_as.rule: amendment_log rows keep their wording except that a top-level row may be compacted to a terse row
      under Decision {{N}} cl.4 (full wording in git history); plus one terse amendment_log row (Decision 240 cl.4 as
      amended).
  # ------------------------------------------------- one-time compaction (Decision {{N}} cl.2): amendment_log text only
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Compact amendment_log rows older than the newest 5 by date (not by position: several logs are not ordered) to terse rows (semantic_break rows and test-pinned rows stay
      full); no new amendment_log entry, since only the log changes and the canonical dump is unchanged.
  - file: docs/contracts/ducklake_telemetry_writer.yaml
    action: Modify
    purpose: amendment_log compaction only, as for deploy-paths.yaml; no new amendment_log entry (the canonical dump is unchanged).
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: amendment_log compaction only, as for deploy-paths.yaml; no new amendment_log entry (the canonical dump is unchanged).
  - file: docs/contracts/github-org-transfer.yaml
    action: Modify
    purpose: amendment_log compaction only, as for deploy-paths.yaml; no new amendment_log entry (the canonical dump is unchanged).
  - file: docs/contracts/iam-simulate-fixture.yaml
    action: Modify
    purpose: amendment_log compaction only, as for deploy-paths.yaml; no new amendment_log entry (the canonical dump is unchanged).
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: amendment_log compaction only, as for deploy-paths.yaml; no new amendment_log entry (the canonical dump is unchanged).
  - file: docs/contracts/telemetry_agents.yaml
    action: Modify
    purpose: amendment_log compaction only, as for deploy-paths.yaml; no new amendment_log entry (the canonical dump is unchanged).
  - file: docs/contracts/telemetry_observations.yaml
    action: Modify
    purpose: amendment_log compaction only, as for deploy-paths.yaml; no new amendment_log entry (the canonical dump is unchanged).
  - file: docs/contracts/telemetry_sessions.yaml
    action: Modify
    purpose: amendment_log compaction only, as for deploy-paths.yaml; no new amendment_log entry (the canonical dump is unchanged).
  # ------------------------------------------------- checks (new logic in mapped helper modules, so the full tier's
  # validate_test_coverage measures each against its own mapped test; call sites stay branch-free)
  - file: scripts/checks/structural/_byte_budget.py
    action: Create
    purpose: >-
      The byte leg, as pure functions over the parsed registry and file sizes: for any governed row carrying max_bytes,
      limit = the byte_budgets entry keyed by the file's bare name, else the row's max_bytes; failure text names the
      class relief valves. A roster entry applies only where the file's path equals "docs/contracts/" + key (the class
      glob also covers nested files such as docs/contracts/personas/*.yaml, which never inherit a depth-1 contract's
      entry); a byte_budgets key that names no depth-1 docs/contracts file fails as stale. E2 leg:
      `_PERMITTED_MAX_BYTES = {"contracts": 49152}` in code; a non-integer max_bytes, a max_bytes on a slug absent from
      the map, or a value above it fails, leg-labelled.
  - file: scripts/checks/structural/size_limits.py
    action: Modify
    purpose: >-
      Branch-free call sites: the per-file loop and E2 extend their violations with _byte_budget's results (no new
      conditional here, so test_size_limits.py, its mapped test, still covers every line).
    new_imports: [scripts.checks.structural._byte_budget]
  - file: scripts/checks/structural/_byte_raises.py
    action: Create
    purpose: >-
      Three legs over the `byte_budgets` section (keys are bare file names, so the guard's ancestor expansion adds
      nothing and a mention of another contract or of docs/contracts never authorizes; a full-path mention still
      authorizes, since "/" is a boundary under boundary_match), all bound to scripts/checks/_marker_guard.py (Decision
      165), _marker_guard.py itself unchanged: (a) a check_diff RegistrySpec (token raise-approved, gated up,
      gates_new_entry) plus check_present_markers, the retroactive scan; (b) a check_state_diff RegistrySpec (state =
      the integer budget, weakened = head above base, gates_deletion false, fresh_mention true), so a raise needs a
      marker citing a Decision other than the base marker's whose text added in the same change names the contract
      (marker-grammar.yaml state_diff_mechanics (3) and (5)); (c) a new-entry leg: every key absent from the base
      (including one dropped earlier and re-added) needs a marker whose cited Decision passes
      _marker_guard_state_options' base_corpus/_fresh test, i.e. its text added in this change names the contract
      (check_state_diff treats new entries as free, so (b) alone would let a stale mention admit one). Legs (b) and (c)
      read the base through `lambda rel: base_text if rel == _REGISTRY_REL_PATH else (base_reader or
      _marker_guard.default_base_reader)(rel)` (the registry is still read once; base_corpus reads docs/DECISIONS.md and
      the archive through the injected reader, so fixtures can supply them; the existing `lambda _rel: base_text` would
      feed it the registry and make every mention look fresh). When base_corpus cannot read the base corpus, legs (b)
      and (c) follow its existing behaviour: one loud SKIP, advisory locally (PR CI always reaches origin/main). Exposes
      violations(base_text, current_text, base_reader) and entry_count(current_text). A seed marker therefore never
      authorizes a later raise or re-registration (scout r2, Decision 128).
  - file: scripts/checks/structural/budget_raises.py
    action: Modify
    purpose: >-
      Branch-free call sites: the violations sum adds _byte_raises.violations(...) and the examined declaration adds
      _byte_raises.entry_count(current_text), so test_budget_raises.py, its mapped test, still covers every line.
    new_imports: [scripts.checks.structural._byte_raises]
  - file: scripts/checks/contracts/_amendment_retention.py
    action: Create
    purpose: >-
      Pure helpers: load the retention mapping from contract-population.yaml; is_terse(row); full_rows(log);
      genuinely_new(base_log, head_log) (multiset count: head-not-base minus base-not-head over canonical row dumps,
      floor 0, dates ignored); rows_dropped (the head log holds fewer rows than the base: Decision {{N}} compacts rows,
      never drops them); rewrite_violation(base_data, head_data) (fails when the non-log content changed, the head
      holds at least one row absent from the base, and genuinely_new is 0, whatever the dates: closes the
      reworded-old-row loophole that _population.check_amendment_log_for_class_d's set membership leaves, and stays
      silent when no row was offered at all, which _population already reports; _population.py is untouched at 496 of
      500 SLOC, its import graph reaching two gated --pre entries); retention_violation(rel, base_data, head_data)
      (also fails rows_dropped); pass2_messages(rel, base_data, head_data, both_class_d) returning the labelled
      "Contract drift (amendment)" / "Contract drift (retention)" lines (rewrite only when both_class_d). Each returns a
      message, a list or None and never raises on malformed input (Decision 55).
  - file: scripts/checks/contracts/validate_contract_drift.py
    action: Modify
    purpose: >-
      Branch-free call site in Pass 2: for every changed depth-1 contract with a base, extend the failures with
      _amendment_retention.pass2_messages(rel, base, head, both_class_d) (both_class_d is the value the existing
      check_amendment_log_for_class_d branch already computes; ritual contracts log field edits in field-level rows,
      contracts_enforcement, so the rewrite check never runs on them).
    new_imports: [scripts.checks.contracts._amendment_retention]
  - file: scripts/roadmap/plan_lint/headroom.py
    action: Modify
    purpose: >-
      size_headroom adds, for a structural row carrying max_bytes, the file's bytes against its byte limit, bytes per
      effective line and the 30-day byte delta (size at the newest origin/main commit at least 30 days old; "new" when
      that commit exists without the file; "history unavailable" when no commit that old is reachable, e.g. a shallow CI
      clone); NEAR_CAP on either unit names the relief valves. No new first-party import (it already imports
      scripts.checks.structural._classify; git runs through its existing subprocess use).
    new_imports: []
  # ------------------------------------------------- tests (each new helper's mapped test: map_source_to_test)
  - file: tests/checks/structural/test__byte_budget.py
    action: Create
    purpose: >-
      Full line coverage of _byte_budget.py: byte leg, E2 max_bytes legs, a stale roster key, a nested docs/contracts
      file not inheriting a depth-1 entry, test_real_registry_contracts_byte_companion (lasting rule on the real
      registry), and test_contract_byte_companion_fails_growth_at_line_limit driven end to end through
      validate_structural_size_limits (rec-5262 acceptance).
  - file: tests/checks/structural/test__byte_raises.py
    action: Create
    purpose: >-
      Full line coverage of _byte_raises.py, class TestByteBudgets: an unmarked raise, a raise citing the seed's
      Decision again, a raise citing a Decision whose mention of the path is not new in the change, an unmarked new
      registration, a new registration citing a Decision whose mention predates the change, an entry dropped and
      re-added citing the seed Decision, a mention of only docs/contracts, and a fresh mention of a different
      contract's path all fail; a raise or new registration with a freshly added naming Decision (full path or bare
      name) passes; a shrink passes; the retroactive scan fails a present byte_budgets marker whose Decision no longer
      names the contract; an unreadable base corpus SKIPs. Freshness fixtures supply a base docs/DECISIONS.md through
      the injected base reader.
  - file: tests/checks/structural/test_budget_raises.py
    action: Modify
    purpose: >-
      test_base_is_read_once_for_every_leg keeps asserting the registry is read exactly once and now also admits the
      freshness legs' reads of docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md through the injected reader (the B3 base
      reader; the old exact-list assertion predates fresh_mention legs on this registry), and
      test_live_registry_examines_every_entry's expected count adds _byte_raises.entry_count. No other change here
      (381 of 500 SLOC).
  - file: tests/checks/contracts/test__amendment_retention.py
    action: Create
    purpose: >-
      Full line coverage of _amendment_retention.py: retention rule, exemptions, multiset rewrite identity (including a
      reworded old row with a changed date, and duplicate dates), rows_dropped, rewrite silence when no row was
      offered, test_real_retention_mapping, and test_adding_a_row_past_keep_full_without_compacting_fails (rec-4119
      acceptance).
  - file: tests/checks/contracts/validate_contract_drift/test_amendment_retention_wiring.py
    action: Create
    purpose: >-
      Pass 2 wiring in the drift package (validate_contract_drift.py's mapped test): a retention violation and a dropped
      row on a changed contract, a reworded old row offered as the new row on a class_d contract, and a ritual
      contract's field edit carrying only a field-level row passing.
  - file: tests/roadmap/plan_lint/test_derivations.py
    action: Modify
    purpose: TestHeadroom::test_size_headroom_reports_bytes_for_contracts (a method in the existing TestHeadroom class).
bundled_recommendations: [rec-5262, rec-4119]
followon_recs: []
infrastructure_dependencies:
  - "None. No .tf file and no Lambda-packaged file is in scope (config, contracts, scripts/checks, scripts/roadmap, tests)."
acceptance_criteria:
  - Decision {{N}} and the Decision 166 trailer are in docs/DECISIONS.md word for word as the sidecar binds them.
  - A fixture contract at 500 effective lines that grows by 2,000 bytes with no roster marker fails validate_structural_size_limits; a max_bytes above the code-pinned maximum fails E2.
  - A byte_budgets raise or new entry fails validate_structural_size_budget_raises unless its marker cites a Decision whose text added in that change names the contract; a shrink passes.
  - A change adding a top-level amendment_log row that leaves more full rows than max(5, base count), or dropping a top-level row, fails validate_contract_drift; semantic_break rows, field-level logs and north-star.yaml are exempt; a reworded old row, re-dated or not, never counts as a new row for retention, and on a class_d contract it cannot stand in for the required new row (ritual contracts' description changes keep contracts_enforcement's existing rule).
  - Every docs/contracts file is within its byte limit on the build's head, byte_budgets holds exactly the four contracts Decision {{N}} cl.2 names, and no compacted contract's non-log content changed; glossary.yaml's read_as rule states the compaction exception.
  - plan_obligations' headroom line for a contract shows bytes, bytes per effective line and the 30-day delta.
  - rec-5262 and rec-4119 close through the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Premises on the build's base, before any edit.
    command: >-
      bin/venv-python -c "import yaml, glob, os; r=yaml.safe_load(open('config/structural_size_budgets.yaml'));
      row=[c for c in r['classes'] if c['slug']=='contracts'][0];
      p=yaml.safe_load(open('docs/contracts/contract-population.yaml'));
      over=sorted(os.path.basename(f) for f in glob.glob('docs/contracts/*.y*ml') if os.path.getsize(f) > 49152);
      nine=sorted(['deploy-paths.yaml','ducklake_telemetry_writer.yaml','git-ops.yaml','github-org-transfer.yaml','iam-simulate-fixture.yaml','ports.yaml','telemetry_agents.yaml','telemetry_observations.yaml','telemetry_sessions.yaml']);
      print('no_max_bytes=' + str('max_bytes' not in row) + ' no_roster=' + str('byte_budgets' not in r) + ' no_retention='
      + str('amendment_log_retention' not in p) + ' over_set_is_nine=' + str(over == nine) + ' over=' + ','.join(over))"
    expected: One line; the four named fields are True.
    fix_if: >-
      A False means another change landed first. over_set_is_nine False: a contract crossed or left 49,152 bytes, so the
      compaction scope is wrong; stop and send a plan-defect report (scope amendment), never compact an unlisted file.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Red-before premise evidence that this build makes false; steps 2-4 are the standing guards.
  - step: 2
    phase: pre-deploy
    action: Byte companion and its raise guard (red before, green after).
    command: >-
      bin/venv-python -m pytest -q tests/checks/structural/test__byte_budget.py
      tests/checks/structural/test__byte_raises.py
      tests/checks/structural/test_budget_raises.py::TestExaminedDeclaration::test_base_is_read_once_for_every_leg
      tests/checks/structural/test_budget_raises.py::TestExaminedDeclaration::test_live_registry_examines_every_entry
    expected: >-
      All selected tests pass; before the build the step is red (the two new modules are absent; the two existing
      read-once and examined-count tests pass on the base and guard the edits to them).
    fix_if: A failure names the leg; fix the code, never the fixture's expectation.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: contract-byte-companion
  - step: 3
    phase: pre-deploy
    action: amendment_log retention and new-row identity (red before, green after).
    command: >-
      bin/venv-python -m pytest -q tests/checks/contracts/test__amendment_retention.py
      tests/checks/contracts/validate_contract_drift/test_amendment_retention_wiring.py
    expected: All tests pass; before the build the module is absent.
    fix_if: A failure names the rule; fix _amendment_retention.py or its wiring.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: contract-amendment-log-retention
  - step: 4
    phase: pre-deploy
    action: Headroom line reports bytes and growth (red before, green after).
    command: bin/venv-python -m pytest -q tests/roadmap/plan_lint/test_derivations.py::TestHeadroom::test_size_headroom_reports_bytes_for_contracts
    expected: The test passes; before the build it does not exist.
    fix_if: A failure names the missing column; fix headroom.py.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: headroom-contract-bytes
  - step: 5
    phase: pre-deploy
    action: Live state after the compaction and seed.
    command: >-
      bin/venv-python -c "import yaml, glob, os; r=yaml.safe_load(open('config/structural_size_budgets.yaml'));
      bb=r.get('byte_budgets') or {}; files=glob.glob('docs/contracts/*.y*ml');
      over=sorted(os.path.basename(f) for f in files if os.path.getsize(f) > 49152);
      within=all(os.path.getsize(f) <= bb.get(os.path.basename(f), 49152) for f in files);
      four=sorted(['git-ops.yaml','iam-simulate-fixture.yaml','telemetry_observations.yaml','telemetry_sessions.yaml']);
      print('roster_is_over_set=' + str(sorted(bb) == over) + ' all_within=' + str(within) + ' roster_is_named_four=' + str(sorted(bb) == four))"
    expected: One line; every field True.
    fix_if: >-
      roster_is_named_four False means the post-compaction over-limit set differs from the four the bound words name:
      stop and send a plan-defect report (the sidecar and its approval run must change), never seed an unnamed path or
      leave a file over the limit. Otherwise re-measure and re-seed from the head, never round up.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Install-time premise that later edits are expected to change (contracts shrink and cross the limit); the byte
      leg and its raise guard (step 2) are the standing checks.
  - step: 6
    phase: pre-deploy
    action: Tests that pin amendment_log rows of the compacted contracts still pass.
    command: >-
      bin/venv-python -m pytest -q $(grep -rlE
      'deploy-paths|ducklake_telemetry_writer|git-ops|github-org-transfer|iam-simulate-fixture|"ports"|ports\.yaml|telemetry_agents|telemetry_observations|telemetry_sessions'
      tests --include='test_*.py' | sort -u)
    expected: All pass (every test file that names one of the nine compacted contracts by file name or stem, e.g. test_late_hook_records_contract_notes.py loading "ports").
    fix_if: A failing test that reads a compacted row means that row stays full; restore it word for word, never edit the test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates the existing suites it selects; they run in every full tier.
  - step: 7
    phase: pre-deploy
    action: The bound words equal the sidecar, and the tree passes the fast tier.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug contract-byte-budget --base origin/main
      && bin/venv-python -m scripts.validate --pre
    expected: approved_text prints its OK line and validate --pre exits 0 (size limits, budget raises, contract drift, decision conformance and size green on the real tree).
    fix_if: A word mismatch is a build error (re-place the sidecar words); a check failure on Decision {{N}} is a plan defect (report it, never edit bound words).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-tree gate run; its parts are graduated by steps 2-4 and the registered checks themselves.
  - step: 8
    phase: pre-deploy
    action: >-
      Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start
      it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The full tier exits 0 and the validation result attests the current HEAD's tree.
    fix_if: Any failure -- fix and rerun the full tier from the start.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 2-4 carry the durable regressions.
  - step: 9
    phase: post-deploy
    action: Recs closed after merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows,_=fetch_recs_by_ids(make_reader(), ['rec-5262','rec-4119']); print(sorted((r['id'], r['status']) for r in rows))"
    expected: Both closed.
    fix_if: An open rec means the Resolves trailer did not land; follow git-ops.yaml resolves_trailer's recovery route.
    hermetic: false
test_obligations:
  - source: scripts/checks/structural/_byte_budget.py
    behavior: Byte leg, roster lookup by exact depth-1 path, stale roster key and the E2 max_bytes legs.
    verification_step: 2
    test_selector: tests/checks/structural/test__byte_budget.py
    red_green_expectation: red before (module absent), green after.
  - source: scripts/checks/structural/_byte_raises.py
    behavior: byte_budgets raises and new or re-added registrations need a marker whose Decision text added in the change names the contract; the retroactive scan; shrinks pass.
    verification_step: 2
    test_selector: tests/checks/structural/test__byte_raises.py
    red_green_expectation: red before (module absent), green after.
  - source: scripts/checks/structural/size_limits.py
    behavior: A file over its byte limit fails naming the relief valves; E2 refuses an unpinned, non-integer or over-maximum max_bytes.
    verification_step: 2
    test_selector: tests/checks/structural/test__byte_budget.py
    red_green_expectation: red before (module absent), green after.
  - source: scripts/checks/structural/budget_raises.py
    behavior: byte_budgets raises and new registrations need an authorizing marker; shrinks pass.
    verification_step: 2
    test_selector: tests/checks/structural/test__byte_raises.py
    red_green_expectation: red before (module absent), green after.
  - source: config/structural_size_budgets.yaml
    behavior: >-
      Lasting rule on the real registry: the contracts row carries an integer max_bytes within the code-pinned maximum,
      and every byte_budgets key names an existing depth-1 contract with a raise-approved marker (no exact-set claim,
      so a seeded contract shrinking under the limit never turns main red; VP 5 is the install-time set evidence).
    verification_step: 2
    test_selector: tests/checks/structural/test__byte_budget.py::test_real_registry_contracts_byte_companion
    red_green_expectation: red before (no max_bytes), green after.
  - source: scripts/checks/contracts/_amendment_retention.py
    behavior: Full-row ratchet, terse-row test, exemptions, multiset rewrite identity (dates ignored) and the dropped-row guard.
    verification_step: 3
    test_selector: tests/checks/contracts/test__amendment_retention.py
    red_green_expectation: red before (module absent), green after.
  - source: scripts/checks/contracts/validate_contract_drift.py
