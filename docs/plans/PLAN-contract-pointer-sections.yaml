schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: contract-pointer-sections
intent: >-
  Stop sending every planning and implementing run to read git-ops.yaml (55 KB) and file-router.yaml (45 KB) whole:
  every always-read pointer to git-ops.yaml names the key a run needs, file look-ups go through a new route lookup that
  prints only the matching file-router rows, and the git-ops check fails a pointer whose key no longer exists. The
  read-set table's planning always-read band falls from 194,715 to about 94,700 bytes and the implementing one from
  128,241 to about 73,300 (94,725 and 73,276 measured on the placed wording at 4197aa93), a table reading in which a section read counts as zero and partial reading is inferred, not
  observed (rec-5259; contract-first retrospective CFR-04).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-contract-pointer-sections.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes
  rec-5259 from the contract-first retrospective (audits/contract-first-retrospective-177c8f37.yaml, #2093). No
  Lambda-packaged file, no Terraform, no table or warehouse write path.
closes_criteria: []
cites: [dec:127, dec:226, dec:246, dec:254]
scope:
  - file: scripts/session/file_router.py
    action: Create
    purpose: >-
      New CLI `bin/venv-python -m scripts.session.file_router <term> [<term> ...]`. Loads docs/contracts/file-router.yaml
      through scripts.checks.hygiene.validate_placement's _load_router and _validate_routes_shape (no second parser; a private cross-module import, as scripts/session/merge_step.py does, recorded in the module docstring) and
      prints one line per valid route whose topic, targets and description combined contain every term, case-insensitive (an absent or non-string
      description reads as empty):
      `<topic>: <target>, <target> -- <description, whitespace collapsed>`, in file order, then `<n> route(s)`. Exit 0
      on at least one match. Exit 1 with one line on stderr and no traceback when the router is missing or malformed
      (the loader's message) or no route matches all terms (`file_router: no route matches all of: <terms>`).
      `--router PATH` overrides the file for tests. main(argv) -> int; no import-time work.
    new_imports: [scripts.checks.hygiene.validate_placement]
  - file: tests/test_session_file_router.py
    action: Create
    purpose: >-
      The module's test home (scripts/test_coverage_checker.py maps scripts/session/<name>.py to
      tests/test_session_<name>.py). tmp-path router fixtures: test_route_terms_match_all_fields (a term that occurs only
      in a topic, only in a target and only in a description each matches; two terms AND, case-insensitive; output line
      shape and count line), test_no_match_exits_one, test_missing_router_exits_one, test_malformed_router_exits_one
      (non-list routes). Real repo: test_real_router_finds_platform_roadmap (term "roadmap" prints the
      platform-roadmap row with docs/ROADMAP-PLATFORM.yaml). 100 percent line coverage of the new module.
  - file: scripts/checks/contracts/validate_git_ops_contract.py
    action: Modify
    purpose: >-
      Leg 1 tightens and a pointer-key leg is added. AGENTS.md must carry at least one `git-ops.yaml#<key>` anchor (not
      only the bare path). Every match of the regex `git-ops\.yaml#([A-Za-z_][A-Za-z0-9_]*(?:\.[A-Za-z_][A-Za-z0-9_]*)*)`
      in AGENTS.md, .claude/commands/*.md and .claude/skills/*/SKILL.md (any path prefix) must resolve by walking
      mapping keys of the parsed contract; a miss appends `git-ops contract: <surface> anchor git-ops.yaml#<key> does
      not resolve`; an AGENTS.md with no anchor appends `git-ops contract: AGENTS.md points at docs/contracts/git-ops.yaml
      without a #<key> anchor` (only when the bare path is present; a missing path keeps today's single "no longer
      points at" line). A surface glob that matches no file is not an error. registry.examined counts named paths plus
      anchors with unit "named paths and anchors"; the PASS line becomes `PASS: AGENTS.md points at docs/contracts/git-ops.yaml#<key>; <n> anchor(s) resolve;
      all <m> named path(s) exist.`, <key> being the first AGENTS.md anchor. Docstring names the new leg.
  - file: tests/checks/contracts/test_validate_git_ops_contract.py
    action: Modify
    purpose: >-
      _write_repo's default AGENTS.md text gains an anchor to a key its contract fixture holds, and the fixture can
      write extra surfaces. New class TestAnchorResolution: test_unanchored_agents_md_pointer_fails,
      test_anchor_to_missing_key_in_skill_fails, test_dotted_anchor_in_command_resolves,
      test_anchor_to_missing_nested_key_fails, test_sentence_final_period_is_not_part_of_the_key. Existing cases keep
      passing; the graduated shard contract-pointer-evaluators-mirror-tests, which runs this file, is kept unchanged.
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Sidecar block agents-git-ops-pointer: the Git-ops procedure pointer names git-ops.yaml#push_pr_ci_merge_flow and
      the keys it names, and lists the other keys' subjects so the OAuth-token runbook stays findable (12 bytes shorter). The greps of graduated record
      agents-md-retains-enforced-norms-and-pointer still hold.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Sidecar blocks plan-git-ops-note (the opening note names branching_topology, rebase_phase_distinction and
      push_pr_ci_merge_flow) and plan-file-router-step (Step 4 item 1 names the route lookup and
      file-router.yaml#routes). The Step 8 change-record pointer keeps its pinned wording (tests/test_workflow_skill_antidrift.py). The project-alignment sentence (an evaluator trigger) is untouched.
  - file: .claude/commands/implement.md
    action: Modify
    purpose: >-
      Sidecar block implement-git-ops-note: the opening note names handoff_sequence,
      rebase_phase_distinction.commit_flow_time, push_pr_ci_merge_flow and resolves_trailer.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: Sidecar block planning-branch-pointer (git-ops.yaml#branching_topology; 4 bytes shorter).
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Sidecar blocks implement-skill-authority, implement-skill-handoff, implement-skill-wake, implement-skill-rebase
      and implement-skill-trailer: the whole-file authority sentence and the "steps 3-5" pointer name
      push_pr_ci_merge_flow, and the three half-anchored forms (a space or `::` before the key) take the `#` form the
      check reads (9 bytes shorter).
  - file: docs/PROJECT_CONTEXT.md
    action: Modify
    purpose: Sidecar block project-context-router (the file-router line names the route lookup; 2 bytes shorter).
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Ratchet down to the measured sizes after the sidecar edits: S1 root_ambient_load_set, S4
      .claude/skills/planning/SKILL.md and .claude/skills/implement/SKILL.md, S8 docs/PROJECT_CONTEXT.md (keeping its
      raise-approved marker). Values are measured at build against the rebased tree, never typed from this plan.
  - file: config/agent/read_sets.yaml
    action: Modify
    purpose: >-
      planning: docs/contracts/git-ops.yaml and docs/contracts/file-router.yaml become `band: on_demand, alt_band:
      always_read`, basis naming the anchored pointers (git-ops: "AGENTS.md, plan.md and planning SKILL name keys; read
      in part; instruction-only, no mechanical bound until the key-printer follow-on"; file-router: "plan.md Step 4 and PROJECT_CONTEXT.md name the route lookup; read in part").
      implementing: git-ops.yaml the same (basis "AGENTS.md, implement.md and implement SKILL name keys"), and a new row
      docs/contracts/file-router.yaml `band: on_demand` with no alt_band (basis "PROJECT_CONTEXT.md names the route
      lookup; no implementing instruction reads it whole"), which the table lacked. project-alignment.yaml is unchanged. Header: alt_band reads "the other
      reading of a judgment-banded file (whole when banded on_demand, in part when banded always_read)". Every stored
      baseline is recomputed by the module at build and pasted (test_stored_baselines_match_recompute enforces it);
      expected 2026-08-07 planning primary always_read 113,782 and alternative 137,615.
bundled_recommendations: [rec-5259]
followon_recs: [rec-5370, rec-5371]
infrastructure_dependencies: []
acceptance_criteria:
  - rec-5259's acceptance command exits 0 on the build head.
  - No always-read surface of either run points at git-ops.yaml or file-router.yaml without naming a key or the lookup (VP 7).
  - validate_git_ops_contract fails a git-ops.yaml anchor whose key is missing, in AGENTS.md, a command or a skill (VP 4).
  - The route lookup prints only matching file-router rows and exits 1 when nothing matches (VP 1-3).
  - "read_set_report on the build head: planning primary always_read at or below 113,782 and implementing at or below 102,845 (the like-for-like 2026-08-07 figures under the new table, VP 8); the closing report also states the module's alternative planning reading (git-ops and file-router whole), about 189,500, against the audit's 137,615 and labels partial reading inferred, not observed."
  - The sidecar's words are the only edits to the six instruction files (approved_text verify).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The route lookup's behaviour tests
    command: >-
      bin/venv-python -m pytest -q tests/test_session_file_router.py::test_route_terms_match_all_fields
      tests/test_session_file_router.py::test_no_match_exits_one tests/test_session_file_router.py::test_missing_router_exits_one
      tests/test_session_file_router.py::test_malformed_router_exits_one
    expected: exit 0, four tests passed
    fix_if: the node is missing or fails
    hermetic: true
    graduation: graduate
    graduation_check_id: file-router-lookup-matches-all-terms
    expected_literals: [4 passed]
  - step: 2
    phase: pre-deploy
    action: The route lookup on the real router
    command: bin/venv-python -m scripts.session.file_router roadmap
    expected: exit 0; the platform-roadmap row with its two targets, and a count line
    fix_if: no row, a traceback, or the whole file printed
    hermetic: true
    graduation: waive
    graduation_waiver_reason: duplicates test_real_router_finds_platform_roadmap, which runs in the full tier and on any PR whose diff selects the test file
    expected_literals: ["platform-roadmap: docs/ROADMAP-PLATFORM.yaml", route(s)]
  - step: 3
    phase: pre-deploy
    action: The route lookup's no-match exit
    command: bin/venv-python -m scripts.session.file_router zz-no-such-route-zz; test $? -eq 1 && echo LOOKUP-EXIT-1
    expected: the no-match line and the marker
    fix_if: exit 0, or a traceback
    hermetic: true
    graduation: waive
    graduation_waiver_reason: duplicates test_no_match_exits_one, which runs in the full tier and on any PR whose diff selects the test file
    expected_literals: [no route matches all of, LOOKUP-EXIT-1]
  - step: 4
    phase: pre-deploy
    action: The git-ops check's anchor leg
    command: >-
      bin/venv-python -m pytest -q tests/checks/contracts/test_validate_git_ops_contract.py::TestAnchorResolution::test_unanchored_agents_md_pointer_fails
      tests/checks/contracts/test_validate_git_ops_contract.py::TestAnchorResolution::test_anchor_to_missing_key_in_skill_fails
      tests/checks/contracts/test_validate_git_ops_contract.py::TestAnchorResolution::test_dotted_anchor_in_command_resolves
      tests/checks/contracts/test_validate_git_ops_contract.py::TestAnchorResolution::test_anchor_to_missing_nested_key_fails
      tests/checks/contracts/test_validate_git_ops_contract.py::TestAnchorResolution::test_sentence_final_period_is_not_part_of_the_key
    expected: exit 0, five tests passed (node ids named, so a later test added to the class cannot redden the record; Decision 244 cl.4)
    fix_if: a node is missing or fails
    hermetic: true
    graduation: graduate
    graduation_check_id: git-ops-pointer-keys-resolve
    expected_literals: [5 passed]
  - step: 5
    phase: pre-deploy
    action: The git-ops check on the real repo
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_git_ops_contract import validate_git_ops_contract as v;
      f=[]; v(f); print('FAILED', f) if f else print('CHECK-CLEAN')"
    expected: the PASS line naming the anchor count, then the clean marker
    fix_if: a failure line, or a PASS line without the anchor count
    hermetic: true
    graduation: waive
    graduation_waiver_reason: the check itself is registered with pre=True and pre_globs None, so it already runs on every fast tier
    expected_literals: ["anchor(s) resolve", CHECK-CLEAN]
  - step: 6
    phase: pre-deploy
    action: rec-5259's acceptance
    command: >-
      grep -Eq 'git-ops\.yaml#[a-z_]+' AGENTS.md && grep -Eq 'file-router\.yaml#[a-z_]+|scripts\.file_router'
      .claude/commands/plan.md && echo REC-5259-ACCEPTANCE
    expected: the marker
    fix_if: no marker
    hermetic: true
    graduation: waive
    graduation_waiver_reason: the rec's own acceptance, which the trailer gate evaluates at merge; VP 4 and VP 7 are the standing guards (its multi-word grep warning is accepted, the command being the rec's acceptance verbatim)
    expected_literals: [REC-5259-ACCEPTANCE]
  - step: 7
    phase: pre-deploy
    action: Stale-pointer sweep over the always-read surfaces of both runs
    command: >-
      ! grep -nE 'contracts/(git-ops|file-router)\.yaml`( |\.|,|;|\))' AGENTS.md .claude/commands/plan.md
      .claude/commands/implement.md .claude/skills/planning/SKILL.md .claude/skills/implement/SKILL.md
      docs/PROJECT_CONTEXT.md && ! grep -n 'Use the File Router' .claude/commands/plan.md && grep -q
      'scripts.session.file_router' .claude/commands/plan.md && grep -q 'git-ops.yaml#branching_topology'
      .claude/skills/planning/SKILL.md && ! grep -nE 'git-ops\.yaml(` |::)' .claude/skills/implement/SKILL.md && grep -q
      'scripts.session.file_router' docs/PROJECT_CONTEXT.md && echo NO-WHOLE-FILE-POINTER
    expected: no line printed before the marker
    fix_if: a whole-file pointer line is printed
    hermetic: true
    graduation: graduate
    graduation_check_id: no-whole-file-git-ops-or-router-pointer
    expected_literals: [NO-WHOLE-FILE-POINTER]
  - step: 8
    phase: pre-deploy
    action: The read-set report's planning and implementing figures
    command: >-
      bin/venv-python -m scripts.roadmap.read_set_report | awk '$2=="@worktree" && $3=="primary" {split($4,a,"=");
      if ($1=="planning") print (a[2] <= 113782 ? "PLANNING-IN-PART-MET" : "PLANNING-IN-PART-MISSED"), a[2];
      if ($1=="implementing") print (a[2] <= 102845 ? "IMPLEMENTING-IN-PART-MET" : "IMPLEMENTING-IN-PART-MISSED"), a[2]}'
    expected: both met markers and their figures (about 94,700 and 73,300)
    fix_if: a missed marker (a band, row or pointer edit did not land in that run)
    hermetic: true
    graduation: waive
    graduation_waiver_reason: moment claim (Decision 244 cl.4); lawful growth of an always-read file can cross it, and the report is measure-only by design (rec-5256)
    expected_literals: [PLANNING-IN-PART-MET, IMPLEMENTING-IN-PART-MET]
  - step: 9
    phase: pre-deploy
    action: Stored baselines match the new table
    command: bin/venv-python -m pytest -q tests/test_read_set_report.py::test_stored_baselines_match_recompute
    expected: exit 0
    fix_if: a baseline mismatch (recompute and paste the module's figures); a skip means a shallow clone, so run it in the full clone
    hermetic: true
    graduation: waive
    graduation_waiver_reason: an existing standing test, green before and after by design; it is not this plan's new guard
    expected_literals: [1 passed]
  - step: 10
    phase: pre-deploy
    action: Prose budgets equal the new sizes
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f);
      print('FAILED', f) if f else print('PROSE-BUDGETS-OK')"
    expected: the marker
    fix_if: a current-below-budget or over-budget line
    hermetic: true
    graduation: waive
    graduation_waiver_reason: already a standing check in both tiers and inside graduated record agents-md-retains-enforced-norms-and-pointer
    expected_literals: [PROSE-BUDGETS-OK]
  - step: 11
    phase: pre-deploy
    action: The approved words are the only edits to the bound files
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug contract-pointer-sections --base origin/main
    expected: exit 0, every block verified
    fix_if: a block mismatch (restore the sidecar's words exactly)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: PR-relative to origin/main, so vacuous once merged (rec-5364's failure shape); validate_merge_step's approved-text leg enforces the sidecar on the build PR
  - step: 12
    phase: pre-deploy
    action: Full tier on the committed, rebased tree
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Validation Summary (scope all) PASS and verify-head exit 0
    fix_if: any failure
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: rec-5259 closed by the merge trailer
    command: >-
      bin/venv-python -c "import src.common.ducklake_reader_client as m; r,_=m.fetch_recs_by_ids(m.make_reader(),
      ['rec-5259']); print(r[0]['status'], r[0]['resolution'])"
    expected: closed, with a resolution naming the merge sha
    fix_if: open after the trailer job concluded (follow git-ops.yaml#resolves_trailer)
    hermetic: false
