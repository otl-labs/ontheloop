schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: coordination-model
intent: >-
  Record the target coordination model for the governed loop (rec-4823) so loop-host planning starts aligned: one
  design-now Decision (a deterministic engine runs the work graph, a bounded coordinator step handles only what the
  graph cannot at a desk scope first and an epic scope in shadow, context travels as notes, streams are epics, and
  concurrency and WIP climb under human ceilings), a dated amendment line on Decision 229, forward intent on the tier
  items that will build it, and one new deferred tier item for the coordinator step. Nothing is built (Decision 197
  cl.8 precedent).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-coordination-model.yaml
phase: >-
  Forward intent on T4.1, T4.3, T4.4 and T4.30 (live: dated progress_note lines only, Decision 93), forward-work
  criteria on deferred T4.8, T4.23 (c20, c21) and T4.33 (c9), and a new deferred_post_mvp item T4.37. Closes no exit
  criterion. Names no CD.27-gated item for re-evaluation, so no fallback_reevaluation block is owed.
amends:
  - dec:229#2
scope:
  - file: docs/plans/approved/coordination-model.yaml
    action: Create
    purpose: >-
      Lands WITH THIS PLAN (plan PR), never in the build: the approved-text sidecar binding the operator-approved
      words of every docs/DECISIONS.md and docs/ROADMAP-PLATFORM.yaml edit below (ten blocks; placeholders {{N}} for the
      Decision number and {{DATE}} for the build date).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly sidecar blocks decision-entry (the new entry, placed directly under the file's intro paragraph, so newest
      first) and decision-229-annotation (one "> **Amended by Decision N (DATE):**" line after Decision 229's
      2026-10-31 update; Decision 177, never a body rewrite). {{N}} = the next free number at build time (241 when
      this plan was written), {{DATE}} = the build date (UTC).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Exactly sidecar blocks t4-1-note, t4-3-note, t4-4-note, t4-30-note (dated progress_note lines on live items),
      t4-8-criterion, t4-23-criteria (c20, c21), t4-33-criterion (c9) and t4-37-item (new deferred item before the T5
      header), with {{N}} and {{DATE}} filled as above.
  - file: tests/decisions/__init__.py
    action: Create
    purpose: Empty package marker; tests/decisions/ is the shared home rec-4478's acceptance test also names, and every test directory carries an __init__.py (tests/CLAUDE.md). rec-4478's plan may create the same empty file.
  - file: tests/decisions/test_coordination_model_decision.py
    action: Create
    purpose: >-
      test_coordination_model_decision_recorded (the rec's acceptance): parse docs/DECISIONS.md with
      scripts.decisions_md.parse_decisions_md, find exactly one entry whose title starts "The coordination model -- a
      deterministic engine runs the work graph", take its number N from the row (never a literal), and assert its
      envelope amends (read with scripts.decisions_md.extract_entry_envelope, never the row's string form) equals
      [229] and status is Decided; Decision 229's block (scripts.decisions_md.iter_decision_sections)
      contains "Amended by Decision N"; every T4.x id named on the entry's Coverage line exists in
      docs/ROADMAP-PLATFORM.yaml (yaml.safe_load) and its item text (every string the item holds, walked recursively, so no dump folding splits "Decision N") contains "Decision N";
      T4.37 has status deferred_post_mvp and no item whose status is not deferred_post_mvp lists T4.37 in depends_on
      (Decision 93). A second test, test_live_items_gain_no_open_criteria, asserts T4.1, T4.3, T4.4 and T4.30 cite
      "Decision N" only in progress_note and none of their exit_criteria text contains it.
bundled_recommendations:
  - rec-4823
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/DECISIONS.md and docs/ROADMAP-PLATFORM.yaml equal main plus the approved sidecar (scripts.roadmap.approved_text
    verify --slug coordination-model exits 0).
  - >-
    The new entry passes the fast tier's decision checks (entry conformance, envelope, 6,144-byte per-entry cap,
    glossary relative words) and docs/decisions-index.json is regenerated and fresh.
  - >-
    tests/decisions/test_coordination_model_decision.py passes, so every Coverage owner cites the entry by its
    final number after any renumbering.
  - rec-4823 is closed by the squash merge's Resolves trailer (recs_by_ids shows status closed).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the Decision, the Decision 229 line and every Coverage owner cross-reference by the entry's own number.
    command: bin/venv-python -m pytest tests/decisions/test_coordination_model_decision.py -q
    expected: Exit 0, 2 passed. Red before (file absent), pytest exit 4.
    fix_if: >-
      An owner lacks "Decision N": a block was not placed or the renumber missed a line; restore the sidecar's words.
      Never edit an assertion to fit.
    hermetic: true
    expected_literals:
      - 2 passed
    graduation: waive
    graduation_waiver_reason: >-
      A content test over two governed files; the --pre pytest diff selection and the full tier run it whenever either
      file or the test changes.
  - step: 2
    phase: pre-deploy
    action: Prove the committed words are the approved words.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug coordination-model --expect
      66ccfb59b7fc4ee1a5fdbe6aaa67c738cb2e9afbe71916c337e764e499fb3ffb  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; never edit the sidecar (a needed change is a new operator ask).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier on every PR that declares
      this plan.
  - step: 3
    phase: pre-deploy
    action: Prove the decisions index is regenerated for the new entry and its amends edge.
    command: bin/venv-python -m scripts.decisions_index --write && bin/venv-python -m scripts.decisions_index --check
    expected: Both exit 0; git diff shows docs/decisions-index.json gaining the new number with amends [229].
    fix_if: --check exits 1 after --write -- the entry's envelope or heading does not parse; fix the placement, not the words.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The fast tier's decisions-index freshness check already gates every PR touching docs/DECISIONS.md.
  - step: 4
    phase: pre-deploy
    action: Lint and run the full tier, as the handoff policy requires before commit.
    command: >-
      bin/venv-python -m ruff check tests/decisions/ && bin/venv-python -m ruff format --check tests/decisions/; then,
      as its own backgrounded run (2 h limit), bin/venv-python -m scripts.validate; then bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      ruff exit 0; validation_result --verify-head exit 0 for HEAD (the verdict, never the backgrounded run's own exit
      status).
    fix_if: >-
      A failure in this plan's files: fix at root and rerun the full tier from the start (handoff_policy). A failure
      only in another open red's tests is not this build's to fix: wait for that repair per the implement skill.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: Confirm rec-4823 closed after the squash merge (closure job reads the Resolves trailer).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows, _ = fetch_recs_by_ids(make_reader(), ['rec-4823']); print(rows[0]['id'], rows[0]['status'])"
    expected: Prints rec-4823 closed.
    fix_if: >-
      Still open: check the squash body carries "Resolves: rec-4823" and ci.yml's closure job ran; re-run that job,
      never close the rec by hand without the acceptance passing.
    hermetic: false
test_obligations:
  - source: docs/DECISIONS.md
    behavior: >-
      The entry exists once, amends 229, Decision 229 carries the amendment line, and every Coverage owner cites the
      entry's final number.
    verification_step: 1
    test_selector: tests/decisions/test_coordination_model_decision.py::test_coordination_model_decision_recorded
    red_green_expectation: red before (file absent), green after
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: >-
      Live items carry the Decision only in progress_note (no open criteria, Decision 93); T4.37 is deferred and no
      live item depends on it.
    verification_step: 1
    test_selector: tests/decisions/test_coordination_model_decision.py::test_live_items_gain_no_open_criteria
    red_green_expectation: red before (file absent), green after
  - source: docs/plans/approved/coordination-model.yaml
    behavior: The sidecar is the plan-time approved text; it lands with the plan and the build never edits it.
    verification_step: 2
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug coordination-model --expect
      66ccfb59b7fc4ee1a5fdbe6aaa67c738cb2e9afbe71916c337e764e499fb3ffb  # pragma: allowlist secret
    waiver_reason: Not a behavior-capable source; validate_merge_step guards the sidecar on every PR declaring this plan.
constraints:
  - >-
    Every docs/DECISIONS.md and docs/ROADMAP-PLATFORM.yaml edit is operator-approved text: the build places the
    sidecar's words exactly, fills only {{N}} and {{DATE}}, and never edits them; a needed change is an approved_text
    plan defect (implement-scope-boundary.yaml deviation_trigger.escalation) routed to this plan's owning planning
    session, "Plan the target coordination model".
  - >-
    No contract, skill, AGENTS.md, CLAUDE.md or docs/contracts/coordinator.yaml edit: the interim Claude-projects
    coordination is unchanged (rec-4825 edits coordinator.yaml in parallel), and field semantics for work_item_notes
    land with T4.23's build, not now (Decision 197 cl.8).
  - No rescue agents or workaround loops (Decision 55); no thread, session or message ids in any repository file (Decision 101).
context:
  - >-
    Decision-scout r1 FLAGS_FOUND (WARN 55, 167, 93; NOTE 90, 217; SPIRIT 221), each resolved in the sidecar text
    (route-only failures, 5.7 KB entry, progress_note on live items, /orient stands, cl.2 rec stands, one transition
    log). CITE: 229, 185, 197, 232, 233, 235, 226, 206, 205, 212, 207, 177, 150, 86, 240. Decisions triaged: 192 of
    192. Roadmap items intersected: 4; CONFLICT: 0; RELATED: 3.
  - >-
    Alignment: operator agreed the model (rec-4823, 2026-11-02 13:22Z), chose "Desk first, epic in shadow" after a
    blind Fable consult (13:40Z), said "write the plan" (13:40Z) and approved the pasted wording on all counts
    (14:34Z), standing for later mechanical refinements that keep its semantics; approving ids stay outside the repo.
    Decomposition and inherited approval are rec-4478's Decision, not this plan's.
  - >-
    Races: rec-4478's Decision renumbers via rebase_resolve ({{N}} absorbs it). rec-4825's line and this plan's both
    insert directly after Decision 229's 2026-10-31 update, so the second builder's lands first (accepted; it is the
    third note there, at intent_accretion_note's soft cap). T4.23 uses c20-c21 (edge-model plan #1596 reserves c17-c19;
    if it builds first, c20-c21 sit before c17, valid but non-monotone). serves and related_to come from that plan's
    edge vocabulary (part_of too), not yet a ratified Decision; nothing breaks if this builds first. If north-star-tier-a builds T4.36 after this, the order reads T4.35, T4.37, T4.36 (valid). T4.37,
    not T4.36 (claimed by PLAN-north-star-tier-a; critique r1 B1): no tool renumbers tier ids, so re-check it is free on
    main at build time and raise a plan defect if not.
  - >-
    Lambda gating disposition: data-pipeline is flagged only because the roadmap is a packaged asset; the edit is
    data-only and deploy-prod-lambdas.yml's paths exclude it, so no build, deploy or smoke step is owed; the standing
    gap is rec-3846 (as in PLAN-work-graph-edge-model).
  - >-
    Size: roadmap 8,797 lines placed (ceiling 10,000, Decision 114; NEAR_CAP is the 500-line class default it is exempt
    from; relief is Decision 147 compaction, never a raise). New T4.37 shows in preflight's advisory tier-id drift note.
  - >-
    Unbuilt plans also scoping DECISIONS.md or the roadmap: aws-account-company-assignment, billing-shape-local,
    github-org-transfer-contract, telemetry-content-reader-lock, telemetry-owner-provisioning, trusted-plan-identity,
    retired-repo-identity-sweep, telemetry-capture-hooks, telemetry-producer-admission-plan-review-capture,
    work-graph-edge-model; every block here is a pure insertion. red_overlap: clear (2026-11-02). Freshness gate:
    no scoped item is silently complete; forward intent only, no closeout.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - docs/plans/approved/coordination-model.yaml read
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Pick {{N}}: the highest "## Decision" number on origin/main plus one. Place every sidecar block's after-text in
    docs/DECISIONS.md and docs/ROADMAP-PLATFORM.yaml with {{N}} and {{DATE}} (build date, UTC) filled, keeping each
    block's indentation; run VP step 2.
  - Regenerate the decisions index (VP step 3).
  - Write tests/decisions/__init__.py and tests/decisions/test_coordination_model_decision.py per the scope row; run VP step 1.
  - >-
    Closure per the implement skill: code review, implementation_declared true, rebase (renumber if a Decision landed
    meanwhile, then re-run VP 1-3), full tier and --verify-head (VP 4), push, PR with "Resolves: rec-4823" in the squash
    body, squash-merge on PROCEED plus green CI; then VP step 5 and tell the coordinator the final Decision number.
work_areas: []
rollback: >-
  Revert the squash commit and reopen rec-4823. No production, infrastructure or warehouse state changes.
