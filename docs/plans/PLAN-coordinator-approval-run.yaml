schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: coordinator-approval-run
intent: >-
  Align docs/contracts/coordinator.yaml with PLAN-approved-text-operator-approval's Decision (rec-4769): governing
  wording is approved on GitHub through an approval run the planning worker dispatches, never by a chat word alone.
  The write_the_plan step, the approve-once standing_authorisation item (whose interim unchanged-sidecar check
  validate_merge_step's GitHub read replaces), the paste rule and the handoff template's Approved text line change to
  match.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-coordinator-approval-run.yaml
implementation_declared: false
phase: >-
  Project Review plan H follow-on (second amendment to the coordinator contract). No tier item; closes no exit
  criterion. Lean by operator direction (2026-11-01).
scope:
  - file: docs/contracts/coordinator.yaml
    action: Modify
    purpose: >-
      Exactly the nine sidecar blocks (docs/plans/approved/coordinator-approval-run.yaml): contract-version, a new
      amendment_log entry (block amendment-log), write-the-plan, standing-authorisation, approvals-definition,
      approvals-acting-worker, paste-rule, approvals-record and handoff-approved-text, with {{DATE}} filled with the build date (UTC) and every {{N}} with 246 (the Decision
      PLAN-approved-text-operator-approval's build added, #1876).
  - file: tests/checks/contracts/test_coordinator_contract.py
    action: Modify
    purpose: >-
      Replace test_build_merge_skips_second_word_only_for_bound_text with test_build_merge_reads_the_github_approval:
      the bound standing_authorisation item names "validate_merge_step, which reads the operator's GitHub approval of
      that sidecar", the final-diff carve-outs, "overrides always_ask handling" and "a loosened test or assertion",
      and no longer "has no commit after that plan merge"; write_the_plan says "never by a chat word alone"; the paste
      rule carries "approval run's link"; the approvals definition names "its run on GitHub"; the acting-worker
      exception ends "whose approval is the operator's GitHub approval of its sidecar."; the record rule names
      "approval run link"; the handoff template has "Approved text:
      <sidecar path and approval run link;"; contract_version is 3; the new amendment_log entry is dated and a
      semantic break; the build rule and the acting-worker exception's opening clause keep their assertions. The
      replacement is the sidecar's tenth block (test-github-approval), placed exactly like the other nine.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/contracts/coordinator.yaml and the test file equal the approved sidecar with {{DATE}} and {{N}} filled
    (scripts.roadmap.approved_text verify --slug coordinator-approval-run exits 0) and pass the fast tier.
  - >-
    tests/checks/contracts/test_coordinator_contract.py passes, and the replaced test fails on the pre-amendment
    contract.
  - After merge, VP 4's coordinator_copy check exits 0 on the refreshed shared-store copy.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the amended contract carries the GitHub approval rule and drops the interim check.
    command: bin/venv-python -m pytest tests/checks/contracts/test_coordinator_contract.py -q
    expected: Exit 0, all passed. Red before (the replaced test fails on the pre-amendment contract).
    fix_if: >-
      The test fails after placing the words: the test or the placement is wrong; restore the sidecar's words, never
      edit them (approved_text plan defect).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Content test of one contract file; the --pre pytest_diff runs it whenever the contract or the test changes.
  - step: 2
    phase: pre-deploy
    action: Prove the committed contract text is the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug coordinator-approval-run --expect 41d6c9f72e240cc577b4c8e47c7eb14b0e2a544e8613bdeb3c32795a3219efbc  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier
      (git-ops.yaml merge_step_coverage).
  - step: 3
    phase: pre-deploy
    action: >-
      Lint the test file and run the full tier, as the handoff policy requires before commit; start
      scripts.validate as its own backgrounded run (2 h limit) and read its verdict with --verify-head.
    command: >-
      bin/venv-python -m ruff check tests/checks/contracts/test_coordinator_contract.py && bin/venv-python -m ruff
      format --check tests/checks/contracts/test_coordinator_contract.py; bin/venv-python -m scripts.validate;
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      ruff exit 0; validation_result --verify-head exit 0 for HEAD (the verdict, never the backgrounded run's own
      exit status).
    fix_if: >-
      A failure in this plan's files: fix at root and rerun the full tier from the start (handoff_policy). A failure
      only in another open red's tests is not this build's to fix: wait for that repair per the implement skill's
      go/no-go.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: post-deploy
    action: After the squash merge, refresh the coordinator's shared-store copy and confirm it is fresh.
    command: >-
      git fetch -q origin main && bin/venv-python -m scripts.session.coordinator_copy write /mnt/project-files/coordinator/
      && bin/venv-python -m scripts.session.coordinator_copy check /mnt/project-files/coordinator/
    expected: Both exit 0; head -1 of the copy names the merge's contract commit.
    fix_if: >-
      check exits 1 right after write: this shared store is a network mount; re-read after about ten seconds and rerun
      check once before reporting.
    hermetic: false
test_obligations:
  - source: docs/contracts/coordinator.yaml
    behavior: >-
      Governing wording is approved on GitHub, never by a chat word alone; the approve-once item rests on
      validate_merge_step's GitHub read and keeps the final-diff carve-outs; the interim check is gone.
    verification_step: 1
    test_selector: tests/checks/contracts/test_coordinator_contract.py::test_build_merge_reads_the_github_approval
    red_green_expectation: red before (the pre-amendment contract still carries the interim check), green after
constraints:
  - >-
    The sidecar's ten blocks (nine in coordinator.yaml, one replacing the test) are operator-approved text, approved
    on GitHub through the approval run: the build places the sidecar's words exactly, fills
    only {{DATE}} and {{N}}, and never edits them; a needed change is an approved_text plan defect
    (implement-scope-boundary.yaml deviation_trigger.escalation).
  - >-
    PLAN-approved-text-operator-approval's build (#1876) landed before this plan PR, so this sidecar is not
    grandfathered (Decision 246 cl.3): at the PR's final head the planning worker dispatches the approval run for
    slug coordinator-approval-run and the operator approves it on GitHub before this plan PR merges (cl.1, cl.5).
  - >-
    The build starts after this plan merges; PLAN-approved-text-operator-approval's build (#1876), which adds
    Decision 246 and the GitHub checks the new item relies on, is already on main.
  - >-
    This build merges under the approve-once rule then on main (the standing_authorisation item this build
    replaces): its only always_ask content is the sidecar-bound text, so it merges on code review PROCEED + green CI
    with no second operator word once the handoff records the sidecar path, digest 41d6c9f7... and this plan's
    merge commit, VP 2 passes with that digest, validate_merge_step is green, and after `git fetch -q origin main`,
    `git log --oneline <plan-merge>..origin/main -- docs/plans/approved/coordinator-approval-run.yaml` prints
    nothing. Neither scope file is a CODEOWNERS path.
  - No other contract, skill, AGENTS.md or CLAUDE.md change.
  - No thread, session or message ids, emails or account ids in any repository file (Decision 101).
context:
  - >-
    Decision-scout verdict: FLAGS_FOUND (NOTE on the rec-4769 Decision: three approvals entries read against its
    clause 1 -- resolved by blocks approvals-definition, approvals-acting-worker and approvals-record; the plan PR's
    own approval route is stated in constraint 2). CITE: 229, 233, 181, 101 and the rec-4769 Decision. Decisions
    triaged: 197 of 197. Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2. The rec-4769 Decision is Decision
    246 (#1876); the test block also rests on Decision 235 cl.1. No Serves line was returned.
  - >-
    Alignment: PLAN-approved-text-operator-approval (#1863) adds a Decision whose clause 1 says "A chat word alone no
    longer binds wording" and whose clause 6 says the coordinator's standing authorisation carries clause 4 (no
    re-ask). coordinator.yaml's write_the_plan step ("It approves the exact wording pasted at presentation") and the
    approve-once item's interim check then contradict it. The coordinator relayed that plan's handoff ask
    (2026-11-05); the operator said "write the plan" on the pasted wording (2026-11-05 14:22Z); the three approvals
    blocks the scout asked for were then pasted and the operator said "approve" (2026-11-05 14:41Z). Approving
    message ids stay outside the repository.
  - >-
    Sequencing: PLAN-coordinator-approve-once's build landed unchanged (#1848, 93ce8135); amending that merged plan's
    sidecar would have failed its own build's approved-text check. This plan's sidecar anchors on the contract as
    #1848 left it. plan_obligations lists PLAN-decision-229-subagent-scope as unbuilt on both scope files; its edits
    landed in #1796 (roles.structure and its test), so neither build rebases on the other.
  - >-
    Test block: #1848's test asserts the interim check, "rec-4769" and contract_version 2, which the approved words
    remove, so the wording check's fast tier is red unless the replacement ships with them. The sidecar therefore
    binds the replacement (block test-github-approval): the dropped assertions are named in the approved text
    (Decision 235 cl.1), and every assertion on unchanged contract text is kept.
  - >-
    The planning worker, not the coordinator, dispatches the approval run: the coordinator cannot reach GitHub
    (surfaces.assumes), and PLAN-approved-text-operator-approval's planning-skill change says "dispatch the approval
    run and paste the wording with its link".
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - docs/plans/approved/coordinator-approval-run.yaml read
  - PLAN-approved-text-operator-approval's build is merged (#1876) and {{N}} is 246
  - Acceptance criteria understood and verifiable
execution_steps:
  - Place the sidecar's test-github-approval block and see the new test fail on the current contract (VP 1 red).
  - >-
    Apply the sidecar's ten blocks, filling {{DATE}} (UTC) and {{N}} (246). Run VP 1
    (green) and VP 2.
  - >-
    Closure per the implement skill (code review, implementation_declared true, rebase, full tier + --verify-head,
    push, PR, squash-merge on PROCEED + green CI), then VP 4 and tell the coordinator the copy is refreshed. The
    replaced test's dropped assertions take weakening disposition planned-change, each entry citing
    test_obligations[0].
work_areas: []
rollback: Revert the squash commit and rerun coordinator_copy write. No production, infrastructure or warehouse state.
gate_rounds:
  - {gate: wording-check, round: 1, verdict: PASS, digest: 41d6c9f72e240cc577b4c8e47c7eb14b0e2a544e8613bdeb3c32795a3219efbc, base: 93ce81353d1b4f4eac029ab319480a55cec17a47, selection: complete}  # pragma: allowlist secret
  - gate: decision-scout
    round: 1
    verdict: FLAGS_FOUND
  - gate: plan-critique
    round: 1
    verdict: REVISE
    blocking: 1
    nits: 6
  - gate: plan-critique
    round: 2
    verdict: PROCEED
    blocking: 0
    nits: 4
  - gate: plan-critique
    round: 3
    verdict: REVISE
    blocking: 1
    nits: 3
  - gate: plan-critique
    round: 4
    verdict: PROCEED
    blocking: 0
    nits: 2
