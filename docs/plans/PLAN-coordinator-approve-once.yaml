schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: coordinator-approve-once
intent: >-
  The operator approves always-ask wording once, at planning; a build that only places that wording should not ask
  again. Amend docs/contracts/coordinator.yaml so a build whose only always_ask content is sidecar-bound approved text
  merges on code review PROCEED + green CI, once approved_text verify and validate_merge_step pass and the sidecar is
  unchanged since the approved plan merge. The operator's word on the final diff stays for CODEOWNERS paths, hook and
  other security code, IAM, spend and deploys outside the reviewed CI channel.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-coordinator-approve-once.yaml
implementation_declared: false
phase: >-
  Project Review plan H follow-on (amendment to the merged coordinator contract). No tier item; closes no exit
  criterion. Lean by operator direction (2026-11-01).
scope:
  - file: docs/contracts/coordinator.yaml
    action: Modify
    purpose: >-
      Exactly the three sidecar blocks (docs/plans/approved/coordinator-approve-once.yaml): a new amendment_log entry
      (block amendment-log), build-step and standing-authorisation, with {{DATE}} filled with the build date (UTC).
  - file: tests/checks/contracts/test_coordinator_contract.py
    action: Modify
    purpose: >-
      Add test_build_merge_skips_second_word_only_for_bound_text: standing_authorisation has an item naming
      "approved_text verify", "validate_merge_step", "CODEOWNERS" and "rec-4769", and the lifecycle build rule ends
      with "that standing_authorisation does not already cover.".
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/contracts/coordinator.yaml equals the approved sidecar (scripts.roadmap.approved_text verify --slug
    coordinator-approve-once exits 0) and passes the fast tier.
  - >-
    tests/checks/contracts/test_coordinator_contract.py passes, including the new test, which fails on the
    pre-amendment contract.
  - >-
    After merge, VP 4's coordinator_copy check exits 0 on the refreshed shared-store copy.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the amended contract carries the approve-once rule and its carve-outs.
    command: bin/venv-python -m pytest tests/checks/contracts/test_coordinator_contract.py -q
    expected: Exit 0, all passed. Red before (the new test fails on the pre-amendment contract).
    fix_if: >-
      The new test fails after placing the words: the test is wrong or the words were mis-placed; restore the
      sidecar's words, never edit them (approved_text plan defect).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Content test of one contract file; the --pre pytest_diff runs it whenever the contract or the test changes.
  - step: 2
    phase: pre-deploy
    action: Prove the committed contract text is the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug coordinator-approve-once --expect 4da3360a7b6e249108cecd5b115a065d4f94b29c8066e281d5b8090575cae1da  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier
      (git-ops.yaml merge_step_coverage).
  - step: 3
    phase: pre-deploy
    action: Lint the test file and run the full tier, as the handoff policy requires before commit.
    command: >-
      bin/venv-python -m ruff check tests/checks/contracts/test_coordinator_contract.py && bin/venv-python -m ruff
      format --check tests/checks/contracts/test_coordinator_contract.py; then, as its own backgrounded run (2 h
      limit), bin/venv-python -m scripts.validate; then bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      ruff exit 0; validation_result --verify-head exit 0 for HEAD (the verdict, never the backgrounded run's own
      exit status).
    fix_if: >-
      A failure in this plan's files: fix at root and rerun the full tier from the start (handoff_policy). A failure
      only in another open red's tests is not this build's to fix: wait for that repair per the implement skill's
      go/no-go.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: post-deploy
    action: After the squash merge, refresh the coordinator's shared-store copy and confirm it is fresh.
    command: >-
      git fetch -q origin main && bin/venv-python -m scripts.session.coordinator_copy write /mnt/project-files/coordinator/
      && bin/venv-python -m scripts.session.coordinator_copy check /mnt/project-files/coordinator/
    expected: Both exit 0; head -1 of the copy names the merge's contract commit.
    fix_if: >-
      check exits 1 right after write: this shared store is a network mount; re-read after about ten seconds and rerun
      check once before reporting.
    hermetic: false
test_obligations:
  - source: docs/contracts/coordinator.yaml
    behavior: >-
      standing_authorisation lets a sidecar-bound approved-text build merge without a second operator word and keeps
      the final-diff word for CODEOWNERS, security, IAM, spend and deploys.
    verification_step: 1
    test_selector: tests/checks/contracts/test_coordinator_contract.py::test_build_merge_skips_second_word_only_for_bound_text
    red_green_expectation: red before (the pre-amendment contract lacks the item), green after
constraints:
  - >-
    The three coordinator.yaml blocks are operator-approved text: the build places the sidecar's words exactly, fills
    only {{DATE}}, and never edits them; a needed change is an approved_text plan defect
    (implement-scope-boundary.yaml deviation_trigger.escalation).
  - >-
    This build's own merge follows the amended rule before it exists, by the operator's own 2026-11-03 ruling that a
    build must not re-ask for wording approved at planning (coordinator.yaml precedence: operator's messages > this
    contract; the handoff note records the message): its only always_ask content is the bound text, so it merges on
    code review PROCEED + green CI once the sidecar is unchanged since this plan's merge (VP 2's --expect digest,
    which equals the digest the handoff records, discharges that condition).
  - No other contract, skill, AGENTS.md or CLAUDE.md change; rec-4769 is planned separately.
  - No thread, session or message ids, emails or account ids in any repository file (Decision 101).
context:
  - >-
    Decision-scout verdict: FLAGS_FOUND (NOTE 229: this build applies the rule to its own merge -- resolved by the
    operator's ruling recorded in the handoff (constraint 2); NOTE 181 cl.2: coverage declared below). CITE: 229, 181,
    235, 238, 239, 144, 101. Decisions triaged: 197 of 197. Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2.
  - >-
    Coverage (Decision 181 cl.2): the sidecar-to-approval match is procedural, owned by rec-4769, and the interim
    sidecar-unchanged check is procedural and retires with it. The CODEOWNERS carve-out's hard block is rec-2827's
    non-bypass merge identity (Decisions 238 cl.2, 239 cl.5); classifying the other carve-outs (hook and security
    code, IAM, spend, off-channel deploys) is procedural under the contract's unenforced_rules line. Bound text that
    loosens an assertion qualifies only when the approved sidecar names the loosening (Decision 235 cl.1).
  - >-
    Alignment: the operator asked that wording approved at planning not be re-asked at build (2026-11-03 23:10Z,
    relayed by the coordinator), then chose the interim check (card) and said "write the plan" on the pasted
    wording in the planning thread (2026-11-03 23:16Z). Approving message ids stay outside the repository (git-ops.yaml approved_text_binding).
  - >-
    Evidence: the final-diff word came from plans, not the harness. Each always-ask build plan wrote its own merge
    line, and a build placing already-approved, mechanically bound text still waited for a second word. That word
    is still needed where it stands in for a code-owner review the operator cannot give on PRs authored under the operator's
    identity (CODEOWNERS from Decision 144; the stand-in per Decisions 238 cl.2 and 239 cl.5; rec-2827).
  - >-
    Interim check: validate_merge_step binds the build to the sidecar at the diff base, but that the sidecar holds the
    operator's approved words is procedural (rec-4769). The build therefore also confirms the sidecar has not changed
    since the merge the handoff records with the approval, so an unapproved sidecar rewrite cannot skip the word.
  - >-
    Not in this plan: rec-4769 (a mechanical sidecar-to-approval check); the operator asked to bring it forward, and
    the coordinator routes it to its own planning thread.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - docs/plans/approved/coordinator-approve-once.yaml read
  - Acceptance criteria understood and verifiable
execution_steps:
  - Write the new test and see it fail on the current contract (VP 1 red).
  - >-
    Apply the sidecar's three blocks to docs/contracts/coordinator.yaml, filling {{DATE}} with the build date (UTC).
    Run VP 1 (green) and VP 2.
  - >-
    Closure per the implement skill (code review, implementation_declared true, rebase, full tier + --verify-head,
    push, PR, squash-merge on PROCEED + green CI), then VP 4 and tell the coordinator the copy is refreshed.
work_areas: []
rollback: Revert the squash commit and rerun coordinator_copy write. No production, infrastructure or warehouse state.
gate_rounds:
  - {gate: wording-check, round: 1, verdict: PASS, digest: 4da3360a7b6e249108cecd5b115a065d4f94b29c8066e281d5b8090575cae1da, base: d1177d77b077d3e0d5eb2cf9206f8ea97c7e6680, selection: complete}  # pragma: allowlist secret
  - gate: decision-scout
    round: 1
    verdict: FLAGS_FOUND
  - gate: plan-critique
    round: 1
    verdict: REVISE
    blocking: 1
    nits: 3
  - gate: plan-critique
    round: 2
    verdict: PROCEED
    blocking: 0
    nits: 4
  - gate: plan-critique
    round: 3
    verdict: PROCEED
    blocking: 0
    nits: 3
