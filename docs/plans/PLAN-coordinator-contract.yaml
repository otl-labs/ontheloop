schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: coordinator-contract
intent: >-
  Give a coordinator that cannot read this repository a reviewed, versioned rule set it can actually load. Such a
  coordinator sees only its standing instructions, memory and a shared store (first met in a Claude project, verified
  2026-10-31), so the coordinator playbook becomes the harness-neutral Class D contract docs/contracts/coordinator.yaml,
  delivered as a generated, commit-stamped copy in the shared store. The contract carries the coordinator's routing of
  plan-defect reports (Decision 229 cl.2), the worker-deadline and watcher liveness rules, and points at repo rules
  instead of restating them.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-coordinator-contract.yaml
implementation_declared: false
phase: >-
  Project Review plan H (joint review area F/D). No tier item; closes no exit criterion. The hosting harness changes
  every few weeks (operator, 2026-11-01): build lean, no edge-case machinery; the contract names no harness tools
  (operator, 2026-11-01).
scope:
  - file: docs/contracts/coordinator.yaml
    action: Create
    purpose: >-
      Exactly the sidecar block coordinator-contract (docs/plans/approved/coordinator-contract.yaml), with {{DATE}}
      filled with the build date (UTC). Class D, evaluator agent_surface docs/contracts/instruction-architecture.yaml.
  - file: docs/contracts/instruction-architecture.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks instruction-architecture-amendment-log and instruction-architecture-consumers
      (a new amendment_log entry, plus the repo_less_coordinator and coordinated_worker consumer rows),
      {{DATE}} filled.
  - file: scripts/session/coordinator_copy.py
    action: Create
    purpose: >-
      CLI `write DIR [--ref R]` and `check DIR [--ref R]` (R defaults to origin/main; the caller fetches first).
      write puts DIR/coordinator.yaml = one header line `# GENERATED from docs/contracts/coordinator.yaml at <sha> --
      DO NOT EDIT` (sha = git log -1 --format=%H R -- docs/contracts/coordinator.yaml) followed by the bytes of
      `git show R:docs/contracts/coordinator.yaml`, creating DIR if absent. check exits 0 when the copy equals what write would produce, 1
      when it differs (prints copy sha and current sha), 2 when the copy or the ref's file is missing. No other mode.
  - file: tests/test_session_coordinator_copy.py
    action: Create
    purpose: >-
      Against a temporary git repo: write then check exits 0; an edited body, a stale header sha, or a newer commit of
      the contract exits 1; a missing copy exits 2; the copy's body is byte-identical to the ref's file.
  - file: tests/checks/contracts/test_coordinator_contract.py
    action: Create
    purpose: >-
      The committed contract parses; every `see:` value resolves (path exists; a .yaml anchor is a dotted key path in
      that file, a .md anchor a literal substring); surfaces.pointer_line names coordinator/coordinator.yaml; the text
      carries no id shape (regexes cmsg_[A-Za-z0-9]{6,}, session_[A-Za-z0-9]{10,}, trig_[A-Za-z0-9]{6,},
      chan_[A-Za-z0-9]{6,}, [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}) and no 12-digit number; instruction-architecture.yaml's
      repo_less_coordinator consumer notes name coordinator.yaml (the evaluator's evidence).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/contracts/coordinator.yaml and the instruction-architecture.yaml rows equal the approved sidecar
    (scripts.roadmap.approved_text verify --slug coordinator-contract exits 0) and pass the fast tier (contract
    population, glossary, structural size).
  - >-
    scripts.session.coordinator_copy write then check round-trips with exit 0, and check reports stale (1) or
    missing (2) correctly.
  - >-
    Every pointer in the contract resolves (tests/checks/contracts/test_coordinator_contract.py).
  - >-
    After merge, a worker writes the first copy to the coordinator's shared store and VP 5's check exits 0 with the
    header naming the merge's contract commit (the read-back); the coordinator's reply confirming it read the copy
    is a secondary confirmation.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the copy tool's write/check modes.
    command: bin/venv-python -m pytest tests/test_session_coordinator_copy.py -q
    expected: Exit 0, all passed. Red before (file absent), pytest exit 4.
    fix_if: A node fails; fix the tool, never the assertion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Unit tests of a small operator-run CLI; the --pre pytest_diff and the full tier's unit-test scaffold run them on
      every change.
  - step: 2
    phase: pre-deploy
    action: Prove the contract's pointers resolve and it carries no ids.
    command: bin/venv-python -m pytest tests/checks/contracts/test_coordinator_contract.py -q
    expected: Exit 0, all passed. Red before (file absent), pytest exit 4.
    fix_if: >-
      A pointer does not resolve: the target moved; that is an approved_text defect (raise the plan-defect alarm),
      never an edit to the approved text.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Content test of one contract file; runs in the unit tiers whenever the contract or the test changes.
  - step: 3
    phase: pre-deploy
    action: Prove the committed contract text is the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug coordinator-contract --expect df5a2ffd5b0a8066e327361c4cfcc1d94285bd89de80ed70eefb1dadec77a1e6  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier
      (git-ops.yaml merge_step_coverage).
  - step: 4
    phase: pre-deploy
    action: Lint and run the full tier, as the handoff policy requires before commit.
    command: >-
      bin/venv-python -m ruff check scripts/session/coordinator_copy.py tests/test_session_coordinator_copy.py
      tests/checks/contracts/test_coordinator_contract.py && bin/venv-python -m ruff format --check
      scripts/session/coordinator_copy.py tests/test_session_coordinator_copy.py
      tests/checks/contracts/test_coordinator_contract.py; then, as its own backgrounded run (2 h limit),
      bin/venv-python -m scripts.validate; then bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      ruff exit 0; validation_result --verify-head exit 0 for HEAD (the verdict, never the backgrounded run's own
      exit status).
    fix_if: >-
      A failure in this plan's files: fix at root and rerun the full tier from the start (handoff_policy). A failure
      only in another open red's tests (for example rec-4797) is not this build's to fix: wait for that repair per the
      implement skill's go/no-go.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: >-
      After the squash merge, write the first copy into the shared store (in this deployment, a Claude project's
      shared folder at /mnt/project-files/) and confirm it is fresh.
    command: >-
      git fetch -q origin main && bin/venv-python -m scripts.session.coordinator_copy write /mnt/project-files/coordinator/
      && bin/venv-python -m scripts.session.coordinator_copy check /mnt/project-files/coordinator/
    expected: Both exit 0; head -1 of the copy names the merge's contract commit.
    fix_if: >-
      check exits 1 right after write: this shared store is a network mount; re-read after about ten seconds and rerun
      check once before reporting.
    hermetic: false
test_obligations:
  - source: scripts/session/coordinator_copy.py
    behavior: write produces header + byte-identical body; check returns 0 fresh, 1 stale, 2 missing.
    verification_step: 1
    test_selector: tests/test_session_coordinator_copy.py
    red_green_expectation: red before (file absent), green after
  - source: docs/contracts/coordinator.yaml
    behavior: every see pointer resolves and the text carries no id shapes.
    verification_step: 2
    test_selector: tests/checks/contracts/test_coordinator_contract.py
    red_green_expectation: red before (file absent), green after
  - source: docs/contracts/instruction-architecture.yaml
    behavior: the repo_less_coordinator consumer row names coordinator.yaml, so the contract's agent_surface evaluator resolves.
    verification_step: 2
    test_selector: tests/checks/contracts/test_coordinator_contract.py
    red_green_expectation: red before (file absent), green after
constraints:
  - >-
    docs/contracts/coordinator.yaml and the two instruction-architecture.yaml blocks are operator-approved text: the
    build places the sidecar's words exactly, fills only {{DATE}}, and never edits them; a needed change is an
    approved_text plan defect (implement-scope-boundary.yaml deviation_trigger.escalation).
  - No AGENTS.md, CLAUDE.md, skill or overseer surface changes; no new validate check (lean, operator 2026-11-01).
  - No thread, session or message ids, emails or account ids in any repository file (Decision 101).
context:
  - >-
    Decision-scout verdict: FLAGS_FOUND (WARN 76 cl.4 resolved by liveness.scope's carve-around: no CI waits, lost
    webhook the sole PR-state exception; NOTE 168 resolved by the agent_surface evaluator; SPIRIT 86 resolved by the
    generated copy plus the watcher's staleness check). CITE: 229, 226, 86, 101, 166, 240. Decisions triaged: 192 of
    192. Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2.
  - >-
    Alignment: operator chose "Repo contract + shared copy" and "Watcher 2h day / 6h night" (cards, 2026-11-01
    23:01Z), then approved both recommendations and said "write the plan", keeping it lean (2026-11-01 23:03Z), and
    asked for a harness-neutral contract naming Claude projects only as its origin (2026-11-01 23:31Z). The contract
    text is pending the operator's word (pasted inline); approving message ids stay outside the repository
    (git-ops.yaml approved_text_binding).
  - >-
    red_overlap: blocked by rec-4797 (slo_breached, product_regression, preflight cache test). Deferral rationale: this
    plan touches only a new contract, instruction-architecture.yaml rows, a new session script and two new test files,
    none shared with rec-4797's tests/test_session_preflight_cache_serving.py or the preflight code; it neither repairs
    nor depends on that red.
  - >-
    Why a contract, not a skill: the coordinator loads no repository skill and no repository file; a new SKILL.md also
    needs a Decision-marked prose-budget raise. Contracts carry no prose budget (config/prose_budgets.yaml).
  - >-
    Evaluator: agent_surface docs/contracts/instruction-architecture.yaml, whose new consumer rows name
    coordinator.yaml (contract-population.yaml evaluator_kinds.agent_surface). A dedicated check was dropped as finer
    detail for a beta surface.
  - >-
    Not in this plan: retiring the overseer skill and overseer-dispatch.yaml (21 open recs point at them; the planning
    workflow reads its plan_fork_classification key) -- a later plan with its own Decision. Starting the watcher worker
    is a coordinator action after merge, under the operator's card answer above.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - docs/plans/approved/coordinator-contract.yaml read
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Place the sidecar's three blocks: create docs/contracts/coordinator.yaml from block coordinator-contract and apply
    the two instruction-architecture.yaml blocks; fill each {{DATE}} with the build date (UTC). Run VP step 3.
  - Write tests/test_session_coordinator_copy.py, see it fail, then write scripts/session/coordinator_copy.py (VP 1).
  - Write tests/checks/contracts/test_coordinator_contract.py (VP 2).
  - >-
    Closure per the implement skill (code review, implementation_declared true, rebase, full tier + --verify-head,
    push, PR, squash-merge on PROCEED + green CI), then VP step 5 and tell the coordinator the copy is in place.
work_areas: []
rollback: >-
  Revert the squash commit and delete the shared-store copy. No production, infrastructure or warehouse state.
