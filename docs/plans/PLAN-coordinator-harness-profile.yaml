schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: coordinator-harness-profile
intent: >-
  Give every Claude projects workspace on this repository that uses docs/contracts/coordinator.yaml one reviewed,
  dated record of that harness's facts, so a new workspace does not start from another workspace's standing
  instructions and shared folder. The facts move into a Class D harness profile beside the contract (operator ruling 2026-11-08: an exception
  to keeping harness facts out of the repository, because the profile is a cross-workspace artifact); the contract
  names the profile, coordinator_copy delivers it with the contract, and [harness] memory lines land there in the
  contract's existing batches.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-coordinator-harness-profile.yaml
implementation_declared: true
phase: >-
  Project Review playbook (operator end goal 2026-10-30, a ways of working every project can adopt), second of two
  plans after PLAN-coordinator-playbook-kit (merged build #1925). No tier item; closes no exit criterion.
scope:
  - file: docs/contracts/coordinator-harness-claude-projects.yaml
    action: Create
    purpose: >-
      Exactly the sidecar block harness-profile (docs/plans/approved/coordinator-harness-profile.yaml), with {{DATE}}
      filled with the build date (UTC). Class D, subject coordinator-harness-claude-projects, evaluator agent_surface
      docs/contracts/coordinator.yaml (which names this file's basename).
  - file: docs/contracts/coordinator.yaml
    action: Modify
    purpose: >-
      Exactly the seven coordinator.yaml sidecar blocks: contract-header (names the harness profile beside the file),
      amendment-log (a new amendment_log entry, semantic_break false, so contract_version stays 4), delivery, watcher-beat,
      memory-harness-tag, memory-batch and standing-harness-line, with {{DATE}} filled with the build date (UTC).
  - file: tests/checks/contracts/test_coordinator_playbook_kit.py
    action: Modify
    purpose: >-
      Only the sidecar block kit-test-beat (the watcher-beat selector now names "[contract], [harness] or
      [repo:<path>]"); the sidecar binds this whole file, so nothing else in it changes.
  - file: scripts/session/coordinator_copy.py
    action: Modify
    purpose: >-
      Copy the contract and every harness profile. Keep CONTRACT; add PROFILE_GLOB =
      "docs/contracts/coordinator-harness-*.yaml"; HEADER becomes "# GENERATED from {path} at {sha} -- DO NOT EDIT\n"
      (unchanged text for the contract). The sources at a ref are CONTRACT plus the names `git ls-tree --name-only
      <ref> docs/contracts/` lists that match PROFILE_GLOB (fnmatch), sorted. Each copy is DIR/<basename>: the header
      (sha = git log -1 --format=%H <ref> -- <path>) followed by the raw bytes of `git show <ref>:<path>`, read as
      bytes and written with write_bytes, never text-decoded (rec-4814: a CRLF file stays byte-identical). check
      compares bytes: exit 0 when every expected copy equals what write would produce; 1 when any differs (print the
      file, copy sha and current sha); 2 when the contract is missing at the ref or any expected copy is missing (2 takes precedence over 1). check also
      exits 1 when DIR holds a coordinator-harness-*.yaml copy the ref no longer has (a deleted or renamed profile).
      write creates DIR if absent, deletes any coordinator-harness-*.yaml in DIR that the ref lacks (it owns that name
      pattern), and leaves every other file in DIR alone, so rewriting a stale copy always clears check. The CLI and its defaults are unchanged.
  - file: tests/test_session_coordinator_copy.py
    action: Modify
    purpose: >-
      Existing tests unchanged; add, against the temporary git repo: test_harness_profiles_are_copied_beside_the_contract
      (a committed docs/contracts/coordinator-harness-x.yaml is written beside the contract with its own header, body
      byte-identical, check exits 0, and an unmatched docs/contracts/other.yaml is not copied);
      test_stale_profile_copy_is_stale (an edited profile copy exits 1); test_missing_profile_copy_exits_2 (a deleted
      profile copy exits 2 even when the contract copy is also edited, so 2 takes precedence over 1); test_orphan_profile_copy_is_stale (a profile copy whose source the ref no longer has
      exits 1, and write then removes it so check exits 0, while an unrelated file in DIR survives); test_crlf_contract_round_trips_byte_identical (a contract committed as raw CRLF bytes, with
      core.autocrlf=false, writes a copy whose bytes after the header equal the committed bytes, check exits 0, and the
      same copy rewritten with LF line ends exits 1).
  - file: tests/checks/contracts/test_coordinator_harness_profile.py
    action: Create
    purpose: >-
      Loads both contract files itself (yaml.safe_load). test_harness_profile_shape: contract.class is D, id and
      subject are coordinator-harness-claude-projects, evaluator.agent_surface is docs/contracts/coordinator.yaml;
      every key of coordinator.yaml's terms is a key of the profile's terms; facts is non-empty, each fact has exactly
      the keys id, verified and fact, ids are unique kebab-case, verified is a YYYY-MM-DD date; every fact id a
      day_one line cites ("fact <id>" or "facts <id>, <id>") exists; the profile text carries none of
      test_coordinator_contract.py's id shapes (copied, not imported) and no 12-digit number.
      test_contract_points_at_the_profile: coordinator.yaml's text names coordinator-harness-claude-projects.yaml;
      surfaces.delivery names docs/contracts/coordinator-harness-*.yaml; the memory batch item and the watcher beat
      name "[contract], [harness] or [repo:<path>]"; templates.standing_instructions carries "Harness facts:
      <shared_store>/coordinator/"; the last coordinator.yaml amendment_log entry names
      PLAN-coordinator-harness-profile with semantic_break false; coordinator_copy.PROFILE_GLOB matches the profile's
      repo path (fnmatch).
bundled_recommendations: [rec-4814]
followon_recs: [rec-4999]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The profile, coordinator.yaml and the kit test equal the approved sidecar with {{DATE}} filled
    (scripts.roadmap.approved_text verify --slug coordinator-harness-profile exits 0) and pass the fast tier.
  - >-
    The five new coordinator_copy tests and both tests in test_coordinator_harness_profile.py pass and fail before
    the change; every existing test in test_session_coordinator_copy.py, test_coordinator_contract.py and
    test_coordinator_playbook_kit.py passes.
  - "rec-4814's acceptance command exits 0: bin/venv-python -m pytest tests/test_session_coordinator_copy.py::test_crlf_contract_round_trips_byte_identical -q."
  - After merge, VP 5's coordinator_copy check exits 0 with both copies in the shared store, VP 6 reads rec-4814 as closed, and VP 7 finds both pointer stubs.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove coordinator_copy copies every harness profile and keeps bytes (rec-4814).
    command: bin/venv-python -m pytest tests/test_session_coordinator_copy.py -q
    expected: Exit 0, all passed. Red before (the five new tests fail on the current tool).
    fix_if: A new test fails after the change -- fix the tool at root; never loosen an existing test.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Unit tests of one script; the --pre pytest_diff runs them whenever the script or its test changes.
  - step: 2
    phase: pre-deploy
    action: Prove the profile's shape and the contract's pointers to it.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_coordinator_harness_profile.py
      tests/checks/contracts/test_coordinator_playbook_kit.py tests/checks/contracts/test_coordinator_contract.py -q
    expected: Exit 0, all passed. Red before (the profile is absent and the beat lacks [harness]).
    fix_if: >-
      A test fails after placing the words: the test or the placement is wrong; restore the sidecar's words, never
      edit them (approved_text plan defect).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Content tests of two contract files; the --pre pytest_diff runs them whenever either contract or a test changes.
  - step: 3
    phase: pre-deploy
    action: Prove the committed contract and test text is the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug coordinator-harness-profile --expect 231d12a8a8b572b465d7494ccb1b1b948a2e562ca64da24aec450c9d6699e157  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier
      (git-ops.yaml merge_step_coverage).
  - step: 4
    phase: pre-deploy
    action: >-
      Lint the changed Python files and run the full tier, as the handoff policy requires before commit; start
      scripts.validate as its own backgrounded run (2 h limit) and read its verdict with --verify-head.
    command: >-
      bin/venv-python -m ruff check scripts/session/coordinator_copy.py tests/test_session_coordinator_copy.py
      tests/checks/contracts/test_coordinator_harness_profile.py tests/checks/contracts/test_coordinator_playbook_kit.py
      && bin/venv-python -m ruff format --check scripts/session/coordinator_copy.py tests/test_session_coordinator_copy.py
      tests/checks/contracts/test_coordinator_harness_profile.py tests/checks/contracts/test_coordinator_playbook_kit.py
      && bin/venv-python -m scripts.validate;
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      ruff exit 0, and validation_result --verify-head exit 0 for HEAD; scripts.validate runs as its own backgrounded
      run (2 h limit), and the verdict is --verify-head, never that run's own exit status.
    fix_if: >-
      A failure in this plan's files: fix at root and rerun the full tier from the start (handoff_policy). A failure
      only in another open red's tests is not this build's to fix: wait for that repair per the implement skill's
      go/no-go.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: After the squash merge, refresh the shared-store copies and confirm both are fresh.
    command: >-
      git fetch -q origin main && bin/venv-python -m scripts.session.coordinator_copy write /mnt/project-files/coordinator/
      && bin/venv-python -m scripts.session.coordinator_copy check /mnt/project-files/coordinator/
      && head -1 /mnt/project-files/coordinator/coordinator.yaml
      /mnt/project-files/coordinator/coordinator-harness-claude-projects.yaml
    expected: >-
      Both exit 0; head -1 of each copy names its file and the merge's commit for it.
    fix_if: >-
      check exits 1 right after write: this shared store is a network mount; re-read after about ten seconds and rerun
      check once before reporting.
    hermetic: false
  - step: 6
    phase: post-deploy
    action: Confirm the bundled rec closed after the squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; r=make_reader(profile='agent_platform');
      s=r.named('recs_by_ids', ids='rec-4814')[0]['status']; print(s); assert s == 'closed'"
    expected: Prints closed, exit 0.
    fix_if: >-
      Still open: wait until the merge commit's ci.yml trailer-closure job has concluded, read its log and follow
      git-ops.yaml resolves_trailer's conditional fallback: a lost trailer runs `bin/venv-python -m scripts.session.merge_step recover --slug
      coordinator-harness-profile --sha <merge sha>` (a junit-routed rec it leaves open goes to the operator); an
      acceptance-verdict refusal is fixed forward, never closed by hand; a Decision 186 refusal stays open and is
      reported; `bin/venv-python -m scripts.ops_data_portal --update-rec rec-4814 --status closed --resolution
      "<merge sha>"` only after a transport failure or a merge-leg refusal.
    hermetic: false
  - step: 7
    phase: post-deploy
    action: Confirm the shared store's prose playbook and harness-facts file are pointer stubs with saved originals (execution step 4).
    command: >-
      A=/mnt/project-files/plan-h/HARNESS-FACTS.md; B=/mnt/project-files/joint-review/inputs/playbook/WAYS-OF-WORKING.md;
      test "$(grep -l 'coordinator/coordinator-harness-claude-projects.yaml' "$A" "$B" | wc -l)" -eq 2
      && test "$(grep -lF 'coordinator/coordinator.yaml' "$A" "$B" | wc -l)" -eq 2
      && test "$(wc -l < "$A")" -le 3 && test "$(wc -l < "$B")" -le 3
      && ls "$(dirname "$A")"/superseded-*/HARNESS-FACTS.md "$(dirname "$B")"/superseded-*/WAYS-OF-WORKING.md >/dev/null
      && echo stubs-ok
    expected: Prints stubs-ok, exit 0.
    fix_if: >-
      A file is missing the pointer or is longer: rewrite the stub, re-read after about ten seconds (network mount),
      and rerun. Its superseded-<date>/ original is missing: report it to the coordinator; never put a stub there.
    hermetic: false
test_obligations:
  - source: scripts/session/coordinator_copy.py
    behavior: write and check cover every docs/contracts/coordinator-harness-*.yaml beside the contract.
    verification_step: 1
    test_selector: tests/test_session_coordinator_copy.py::test_harness_profiles_are_copied_beside_the_contract
    red_green_expectation: red before (the current tool copies only the contract), green after
  - source: scripts/session/coordinator_copy.py
    behavior: A CRLF contract's copy is byte-identical and a line-end edit is stale (rec-4814).
    verification_step: 1
    test_selector: tests/test_session_coordinator_copy.py::test_crlf_contract_round_trips_byte_identical
    red_green_expectation: red before (text mode normalises CRLF), green after
  - source: scripts/session/coordinator_copy.py
    behavior: A profile copy the ref no longer has is stale, and write removes it.
    verification_step: 1
    test_selector: tests/test_session_coordinator_copy.py::test_orphan_profile_copy_is_stale
    red_green_expectation: red before (the current tool ignores profile copies), green after
  - source: scripts/session/coordinator_copy.py
    behavior: A missing profile copy exits 2, even when another copy is stale.
    verification_step: 1
    test_selector: tests/test_session_coordinator_copy.py::test_missing_profile_copy_exits_2
    red_green_expectation: red before (the current tool expects no profile copy), green after
  - source: docs/contracts/coordinator-harness-claude-projects.yaml
    behavior: >-
      The profile maps every contract term, its facts are dated and uniquely named, day_one cites only real facts, it
      carries no ids, and the contract names it, delivers it and batches [harness] lines to it.
    verification_step: 2
    test_selector: tests/checks/contracts/test_coordinator_harness_profile.py::test_harness_profile_shape
    red_green_expectation: red before (the profile does not exist), green after
  - source: docs/contracts/coordinator.yaml
    behavior: >-
      The contract names the profile (resolving its agent_surface evaluator), delivers every harness profile, batches
      [harness] lines with [contract] ones, and logs the change without a version bump.
    verification_step: 2
    test_selector: tests/checks/contracts/test_coordinator_harness_profile.py::test_contract_points_at_the_profile
    red_green_expectation: red before (the contract names no profile), green after
  - source: tests/checks/contracts/test_coordinator_playbook_kit.py
    behavior: >-
      The watcher-beat selector follows the beat's new tag list; every other assertion of the existing test is
      unchanged.
    verification_step: 2
    test_selector: tests/checks/contracts/test_coordinator_playbook_kit.py::test_playbook_kit_rules_and_templates
    red_green_expectation: red before (the new selector finds no beat item in the current contract), green after
constraints:
  - >-
    The sidecar's nine blocks (one creating the profile, seven in coordinator.yaml, one in
    tests/checks/contracts/test_coordinator_playbook_kit.py) are operator-approved text, approved on GitHub through
    the approval run (Decision 246): the build places the sidecar's words exactly, fills only {{DATE}}, and never edits
    them; a needed change is an approved_text plan defect (implement-scope-boundary.yaml deviation_trigger.escalation).
  - >-
    The sidecar is not grandfathered (Decision 246 cl.3): at the plan PR's final head the planning worker dispatches
    the approval run for slug coordinator-harness-profile and the operator approves it on GitHub before the plan PR
    merges.
  - >-
    This build merges under the approve-once standing_authorisation item: its only always_ask content is the
    sidecar-bound text, so it merges on code review PROCEED + green CI with no second operator word once
    validate_merge_step is green. No scope file is a CODEOWNERS path, and coordinator_copy is not hook or security
    code.
  - >-
    The only changed existing assertion is the kit test's beat selector, bound by the sidecar's kit-test-beat block,
    so its change is approved text (Decision 235 cl.1); the build's new tests live in their own file
    (tests/checks/contracts/test_coordinator_harness_profile.py) or are added to tests/test_session_coordinator_copy.py
    without changing its existing tests.
  - >-
    The profile holds facts only: no rule, and nothing specific to one project (no names, ids, hostnames or account
    data; Decision 101). Rules stay in coordinator.yaml, which stays harness-neutral apart from naming its profiles.
  - No other contract, skill, AGENTS.md or CLAUDE.md change; instruction-architecture.yaml's consumer notes stay true as written.
context:
  - >-
    Decision-scout verdict: FLAGS_FOUND. Serves: NS.4 3/5 (engaged NS.4, NS.1, mission). CITE: 86, 168, 167, 229,
    246, 101. Decisions triaged: 202 of 202. Roadmap items intersected: 2 (T2.54, T4.23); CONFLICT: 0. Flags taken:
    Decision 240 WARN (glossary "project", "operator", "adopter") -> the profile says "workspace" except in the
    harness's proper names and maps operator to the glossary's operator; NS.4 NOTE (second surfaces) -> execution
    step 4 replaces the shared store's prose playbook and harness-facts file with pointer stubs and the coordinator
    drops the moved facts from standing instructions and memory; Decision 168 -> test_contract_points_at_the_profile
    asserts the basename that resolves the profile's agent_surface evaluator; Decision 241 RELATED -> the profile
    serves the Decision 229 cl.1 interim coordinator, and Decision 241's engine remains the end state.
  - >-
    No numbered Decision (Decision 150, decision-entry.yaml routing_rule): (1) a dated record of a beta harness's
    observed behaviour, not a durable architectural commitment; (2) reversal is a file deletion plus a contract edit;
    (3) the contract's own amendment_log and the operator ruling below carry the rationale. The blind advisor's
    answer to the same question (the shared store's playbook/advisor-brief/ADVICE.md Q5) agreed.
  - >-
    Operator rulings: 2026-11-01 (planning of PLAN-coordinator-contract) harness facts live outside the repository and
    the contract is harness-neutral; 2026-11-08, answering this planning thread's question, "yes, this can be an
    exception as it is a cross project artifact" -- this one profile lives in the repository, and the contract stays
    harness-neutral apart from naming its profiles. The 2026-11-08 operator direction (write the plan after taking a
    blind advisor consult's recommendations) covers this plan's forks: home = a repository profile beside the contract
    delivered by coordinator_copy (advice Q1), scope = workspaces on this repository (Q2; other repositories ->
    rec-4999), the shared store's 2026-10-29 prose playbook and harness-facts file become pointer stubs (Q3, post-merge
    execution step), tag-and-batch for keeping it current (Q6), two plans (Q7).
  - >-
    Facts come from the shared store's plan-h/HARNESS-FACTS.md, the standing instructions and memory (2026-10-29 to
    11-06), each with its last-verified date; none re-verified here (UNPROVEN beyond those dates).
  - >-
    Settled with notice: no contract_version bump (every change is additive: a new file the delivery also copies, a
    tag joining an existing batch, which can make a batch offer come sooner but asks nothing new of a reader of
    version 4, and a pointer line), so test_coordinator_contract.py's pin stays at 4 and that file is
    untouched; coordinator_copy globs coordinator-harness-*.yaml rather than naming this harness, so the tool stays
    harness-neutral; coordinator_operations.setup still records a load gap in standing instructions (it binds workers
    at once), and its memory line takes the [harness] tag under the memory rule; instruction-architecture.yaml's
    repo_less_coordinator note ("a worker keeps the generated copy of docs/contracts/coordinator.yaml") stays true and
    is not amended.
  - >-
    rec-4814 (Low, XS) is bundled: coordinator_copy is rewritten here anyway and its acceptance test is one of this
    plan's tests; a branch commit and the squash body carry "Resolves: rec-4814".
  - "red_overlap: clear (no reds) at 069f4f2d; plan rebased on 56fda436 (#1924, no scope file). plan_obligations: no unmet obligations; rec-4814 acceptance decidable; PLAN-decision-229-subagent-scope (listed unbuilt) landed in #1796."
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - docs/plans/approved/coordinator-harness-profile.yaml read
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Write the five new tests in tests/test_session_coordinator_copy.py and see them fail on the current tool (VP 1
    red); change scripts/session/coordinator_copy.py until VP 1 is green.
  - >-
    Write tests/checks/contracts/test_coordinator_harness_profile.py and see it fail (VP 2 red). Apply the sidecar's
    nine blocks, filling {{DATE}} (UTC). Run VP 2 (green) and VP 3.
  - >-
    Closure per the implement skill (code review, implementation_declared true, rebase, full tier + --verify-head,
    push, PR, `merge_step premerge --slug coordinator-harness-profile --message-file <f> --expect
    231d12a8a8b572b465d7494ccb1b1b948a2e562ca64da24aec450c9d6699e157`, squash-merge on PROCEED + green CI with
    merge_pull_request's expectedHeadSha set to the HEAD premerge printed; a branch commit message and
    merge_pull_request's commit_message both carry "Resolves: rec-4814", per git-ops.yaml resolves_trailer; then
    `merge_step readback --slug coordinator-harness-profile --sha <merge sha>`), then VP 5.
  - >-
    After VP 5, copy the shared store's 2026-10-29 prose playbook (joint-review/inputs/playbook/WAYS-OF-WORKING.md)
    and plan-h/HARNESS-FACTS.md into a superseded-<date>/ folder beside each, then replace each with a three-line
    pointer stub naming coordinator/coordinator.yaml and
    coordinator/coordinator-harness-claude-projects.yaml as the generated copies of their repository sources, and
    re-read each after about ten seconds; then VP 6 and VP 7. Report to the coordinator the merge SHA, the --verify-head verdict, the VP 5
    headers, and that the moved facts now leave the other surfaces: the standing instructions' harness block shrinks
    to the template's "Harness facts:" line, and memory's harness-fact lines are marked landed.
work_areas: []
rollback: >-
  Revert the squash commit; after the revert merges, git fetch origin main, rerun coordinator_copy write, and delete
  <shared_store>/coordinator/coordinator-harness-claude-projects.yaml by hand (the reverted tool does not manage it);
  restore the two
  shared-store files from their superseded-<date>/ folders and the standing instructions' harness block. No
  production, infrastructure or warehouse state.
