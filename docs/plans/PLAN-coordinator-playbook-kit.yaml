schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: coordinator-playbook-kit
intent: >-
  Make docs/contracts/coordinator.yaml the ways of working a new Claude project on this repository can adopt
  (operator goal 2026-10-30): its templates gain the adoption kit the 2026-10-29 prose playbook alone still held
  (goal, standing instructions, memory seed, day one), three generic rulings from this project join the lifecycle,
  planning and operations rules, and memory rulings carry a routing tag so generic ones land in batches.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-coordinator-playbook-kit.yaml
implementation_declared: false
phase: >-
  Project Review playbook (operator end goal 2026-10-30, a ways of working every project can adopt). No tier item;
  closes no exit criterion.
scope:
  - file: docs/contracts/coordinator.yaml
    action: Modify
    purpose: >-
      Exactly the seven sidecar blocks (docs/plans/approved/coordinator-playbook-kit.yaml): a new amendment_log
      entry (block amendment-log), split-rule, planning-deterministic-proof, operator-side-work, memory-routing-tag, watcher-ruling-batch and
      templates-adoption-kit, with {{DATE}} filled with the build date (UTC). contract_version stays 3 (field_add,
      no semantic break).
  - file: tests/checks/contracts/test_coordinator_contract.py
    action: Modify
    purpose: >-
      Add test_playbook_kit_rules_and_templates: templates holds goal, standing_instructions, memory_seed and
      day_one; standing_instructions carries "<pointer_line>"; day_one names coordinator_operations.setup,
      surfaces.delivery and liveness.watcher; lifecycle.split_rule names "new planning worker" and
      routing.plan_defect; planning_conventions has exactly one item starting "Prove a plan with deterministic
      checks"; coordinator_operations.operator_side_work names "leaves its remit"; one memory item names the four
      routing tags [contract], [harness], [local] and [repo:<path>]; the watcher beat has one item naming "[contract] or [repo:<path>]"; the newest amendment_log
      entry names PLAN-coordinator-playbook-kit with a YYYY-MM-DD date and semantic_break false. Every existing test
      is unchanged.
bundled_recommendations: []
followon_recs: [rec-4999, rec-5000]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/contracts/coordinator.yaml equals the approved sidecar with {{DATE}} filled (scripts.roadmap.approved_text
    verify --slug coordinator-playbook-kit exits 0) and passes the fast tier.
  - >-
    tests/checks/contracts/test_coordinator_contract.py::test_playbook_kit_rules_and_templates passes, and fails on
    the pre-amendment contract; every other test in the file passes unchanged.
  - After merge, VP 4's coordinator_copy check exits 0 on the refreshed shared-store copy.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the amended contract carries the kit templates, the three rules and the routing-tag batch rule.
    command: bin/venv-python -m pytest tests/checks/contracts/test_coordinator_contract.py -q
    expected: Exit 0, all passed. Red before (the new test fails on the pre-amendment contract).
    fix_if: >-
      The new test fails after placing the words: the test or the placement is wrong; restore the sidecar's words,
      never edit them (approved_text plan defect).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Content test of one contract file; the --pre pytest_diff runs it whenever the contract or the test changes.
  - step: 2
    phase: pre-deploy
    action: Prove the committed contract text is the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug coordinator-playbook-kit --expect 634f78ee4766d46840f021e9b82b2c4017dcc279362e59fbb9c3171f84e2af4e  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier
      (git-ops.yaml merge_step_coverage).
  - step: 3
    phase: pre-deploy
    action: >-
      Lint the test file and run the full tier, as the handoff policy requires before commit; start
      scripts.validate as its own backgrounded run (2 h limit) and read its verdict with --verify-head.
    command: >-
      bin/venv-python -m ruff check tests/checks/contracts/test_coordinator_contract.py && bin/venv-python -m ruff
      format --check tests/checks/contracts/test_coordinator_contract.py; bin/venv-python -m scripts.validate;
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      ruff exit 0; validation_result --verify-head exit 0 for HEAD (the verdict, never the backgrounded run's own
      exit status).
    fix_if: >-
      A failure in this plan's files: fix at root and rerun the full tier from the start (handoff_policy). A failure
      only in another open red's tests is not this build's to fix: wait for that repair per the implement skill's
      go/no-go.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: post-deploy
    action: After the squash merge, refresh the coordinator's shared-store copy and confirm it is fresh.
    command: >-
      git fetch -q origin main && bin/venv-python -m scripts.session.coordinator_copy write /mnt/project-files/coordinator/
      && bin/venv-python -m scripts.session.coordinator_copy check /mnt/project-files/coordinator/
    expected: Both exit 0; head -1 of the copy names the merge's contract commit.
    fix_if: >-
      check exits 1 right after write: this shared store is a network mount; re-read after about ten seconds and rerun
      check once before reporting.
    hermetic: false
test_obligations:
  - source: docs/contracts/coordinator.yaml
    behavior: >-
      The contract carries the adoption-kit templates, the CI-blocker routing in split_rule, the deterministic-proof
      planning convention, the outside-remit operator rule, and the memory routing-tag batch rule with its watcher
      beat.
    verification_step: 1
    test_selector: tests/checks/contracts/test_coordinator_contract.py::test_playbook_kit_rules_and_templates
    red_green_expectation: red before (the pre-amendment contract lacks the templates and rules), green after
constraints:
  - >-
    The sidecar's seven blocks are operator-approved text, approved on GitHub through the approval run (Decision
    246): the build places the sidecar's words exactly, fills only {{DATE}}, and never edits them; a needed change is
    an approved_text plan defect (implement-scope-boundary.yaml deviation_trigger.escalation).
  - >-
    The sidecar is not grandfathered (Decision 246 cl.3): at the plan PR's final head the planning worker dispatches
    the approval run for slug coordinator-playbook-kit and the operator approves it on GitHub before the plan PR
    merges.
  - >-
    This build merges under the approve-once standing_authorisation item: its only always_ask content is the
    sidecar-bound text, so it merges on code review PROCEED + green CI with no second operator word once
    validate_merge_step is green. Neither scope file is a CODEOWNERS path.
  - >-
    The new test only adds assertions; no existing assertion is removed or loosened (Decision 235), so the test file
    is outside the sidecar.
  - No other contract, skill, AGENTS.md or CLAUDE.md change; harness facts stay out of coordinator.yaml.
  - No thread, session or message ids, emails or account ids in any repository file (Decision 101).
context:
  - >-
    Decision-scout verdict: FLAGS_FOUND. CITE: 86, 127, 150, 246, 101. Decisions triaged: 202 of 202. Roadmap items
    intersected: 2 (T2.54, T4.23); CONFLICT: 0. Flags taken (operator direction: take the recommendations): Decision
    240 WARN (glossary "project" and "deployment") -> the template says "Workspace: <name>" and the tag is [local];
    placement_rule's existing "this deployment of the coordinator" is a pre-existing residual left as is. Decision 229
    NOTE (cl.1 operator-chosen item) -> the batch starts only on the operator's yes to a decision_prompt. NS.4 NOTE
    (goal restated the lifecycle) -> the goal template points at lifecycle, halts and always_ask. Decision 226
    RELATED (PR-branch CI vs the routing row "CI red on a worker's own PR") -> split_rule covers only a blocker the
    build cannot fix inside its own plan.
  - >-
    No numbered Decision (Decision 150, decision-entry.yaml routing_rule): (1) operating rules of the interim
    coordinator, not a durable architectural commitment; (2) reversal is a contract edit; (3) the field_semantics row
    owns contract text. The templates hold placeholders only, no names, ids or hostnames (Decision 101).
  - >-
    Operator direction 2026-11-08 01:10Z: write the plan after taking a blind Fable consult's recommendations (no
    separate sign-off). Brief and advice: the shared store's playbook/advisor-brief/ (BRIEF.md, ADVICE.md). Taken:
    two plans (this generic amendment; a Claude-projects harness profile planned separately, pending the operator's
    answer on moving harness facts into the repo, which reverses his 2026-11-01 ruling), scope = projects on this
    repository (other repositories -> rec-4999), no new numbered Decision (decision-entry.yaml routing_rule: the
    content is field_semantics), lessons other contracts own -> rec-5000 (git-ops, presubmit-tool-pin) and the open
    rec-4961/rec-4979 (Environment bootstrap).
  - >-
    Sources harvested: the 2026-10-29 prose playbook (shared store joint-review/inputs/playbook/WAYS-OF-WORKING.md;
    Section 0 goal template and day-one list -> templates goal, day_one) and project rulings 2026-10-30 (no throwaway
    builds), 2026-11-02 (unpassable build CI -> new planning thread), 2026-11-04 and 2026-11-07 (work taken outside
    the project leaves its remit).
  - >-
    Settled with notice: the critique-escalation skeleton is not copied (the planning skill's escalation rule owns
    the five choices); the anchor-only re-anchor ruling (2026-11-03) stays with git-ops.yaml's approved-words digest,
    which already drops anchor words; deployment-only rulings (no thread cap, threads apply Terraform with admin
    credentials) stay in standing instructions per surfaces.placement_rule; rec-4948 (second-model opinion) is not
    bundled (different test path and a separate nudge).
  - "Related-work check: scripts.ci_rca.red_overlap verdict clear (no reds) at 6d1d1f14."
  - >-
    plan_obligations lists PLAN-decision-229-subagent-scope as unbuilt on both scope files; its edits landed in #1796
    (roles.structure and its test), so no rebase between the two builds is owed.
  - >-
    Routing tags: this plan defines them; the coordinator tags existing memory ruling lines after the merge. This
    plan is itself the first batch (it lands the generic rulings gathered to date).
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - docs/plans/approved/coordinator-playbook-kit.yaml read
  - Acceptance criteria understood and verifiable
execution_steps:
  - Write test_playbook_kit_rules_and_templates and see it fail on the current contract (VP 1 red).
  - Apply the sidecar's seven blocks, filling {{DATE}} (UTC). Run VP 1 (green) and VP 2.
  - >-
    Closure per the implement skill (code review, implementation_declared true, rebase, full tier + --verify-head,
    push, PR, squash-merge on PROCEED + green CI), then VP 4 and tell the coordinator the copy is refreshed and
    memory ruling lines can now be tagged.
work_areas: []
rollback: Revert the squash commit and rerun coordinator_copy write. No production, infrastructure or warehouse state.
gate_rounds:
  - {gate: wording-check, round: 1, verdict: PASS, digest: 634f78ee4766d46840f021e9b82b2c4017dcc279362e59fbb9c3171f84e2af4e, base: 6d1d1f146c7f85f5eb3c1edddf1bf66b1b072894, selection: complete}  # pragma: allowlist secret
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
