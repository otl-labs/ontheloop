schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: coverage-child-tier-parity
intent: >-
  Clear the Critical CI-RCA hard block at root cause: rec-4273 (post-merge main-validate run 38171425451) and its duplicate
  rec-4275 (main-canary run 38175699974) both record validate_test_coverage red after #1452 (c792924d, the rec-4232 fix). The per-file coverage child is the only CI pytest
  invocation that does not deselect integration tests, so a live-boundary test ran inside a CI coverage measurement and was
  the sole coverage of mcp_server.create_server. Separately, #1452 added an unstubbed plan-corpus walk to preflight main(),
  doubling every main()-level test and pushing the preflight.py coverage child past its 300s cap. Selection parity, hermetic
  coverage, a repaired live test and one conftest stub fix both, with no cap raise, no skip and no baseline lowering. This
  also releases the stranded #1452 implementer, whose rec closures wait on a green main.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V3
plan_path: docs/plans/PLAN-coverage-child-tier-parity.yaml
phase: >-
  ci_rca (rec-4273, Critical; soft-warn category, no tier_item claimed, so the Tier Item Freshness Gate is skipped). Forward
  fix (Decision 73 cl.3) for PLAN-recs-full-cache-retirement's post-merge full tier. Claims, moves and closes no tier_item
  criterion.
scope:
- file: scripts/checks/misc/coverage_baseline.py
  action: Modify
  purpose: >-
    measure_and_check: the coverage child's pytest argv gains "-m", "not integration" immediately after the test path, so
    the child selects tests exactly as scripts/checks/_scaffolding.py::_build_unit_test_cmd and
    scripts/checks/_pytest_diff.py already do. An integration-marked test never runs inside a coverage measurement; it still
    runs, and still fails loudly without credentials, when invoked explicitly. The module docstring gains one sentence
    naming the selection rule and rec-4273. No new marker, no other flag change, COVERAGE_TIMEOUT_SECONDS unchanged.
- file: tests/checks/misc/test_coverage_baseline.py
  action: Modify
  purpose: >-
    New node TestMeasureAndCheck::test_child_selects_the_full_tier_marker_expression. It derives the expected expression
    from scripts.checks._scaffolding._build_unit_test_cmd(): the token after the "-m" that FOLLOWS "pytest", never the first
    "-m" (the interpreter's own "python -m", the rec-4099 misread). It asserts the mocked Popen argv carries "-m" plus that
    same expression after its own "pytest" token, so drift in either builder fails it. The file is 480 SLOC at plan time and
    must stay at or under 500: first extract the repeated source/test_file/mock-proc scaffolding into one module-level
    helper in this file (Decision 128); never raise a budget. Keep every node id an existing registry shard pins
    (coverage-timeout-process-group, coverage-baseline-reports-diagnostics, coverage-baseline-gate-tests). The new node path
    is fixed before execution step 6 names it.
- file: tests/test_agent_sdk_mcp_server.py
  action: Modify
  purpose: >-
    (1) New hermetic class TestCreateServer driving create_server(reader=<stub>) through the existing
    _list_tools_via_server / _call_tool_via_server helpers, five nodes: test_lists_only_agent_facing_verbs;
    test_call_forwards_arguments_and_returns_rows (reader.named receives the arguments; structuredContent is {"rows": ...,
    "row_count": ...}); test_unknown_tool_returns_an_error_result (a name absent from the projection, including an
    agent_facing false verb, yields isError); test_run_stdio_serves_over_the_stdio_streams (stdio_server patched with an
    async context manager, server.run an AsyncMock awaited once); test_main_builds_the_server_and_runs_stdio (create_server
    and anyio.run patched; anyio.run receives _run_stdio and the built server). Together they cover mcp_server.py at 100%
    with integration deselected (prototyped at plan time: 100.0%, no missing lines). (2) Repair the stale live test, kept in
    TestEndToEnd with @integration + @aws and NO credentials-skip guard (its existing docstring stance): rename the node
    test_recs_by_ids_tool_returns_exactly_one_row_against_live_boundary; assert recs_by_ids is projected and open_recs and
    preflight_signal_rows are NOT (Decision 215 cl.3); call recs_by_ids (cl.7; rec_by_id is deprecated, rec-4240) with
    ids="rec-100", an append-only historical row, and assert exactly one row whose id is rec-100 (prototyped against the
    live reader at plan time: 1 passed). The module docstring says TestEndToEnd runs only when invoked explicitly, never
    inside a CI tier or a coverage measurement.
- file: scripts/agent_sdk/mcp_server.py
  action: Modify
  purpose: >-
    Docstring only (rec-4134), no behaviour change. The WRITE LEG DEFERRED paragraph's misreading ("weaker than the
    in-handler guard Decision 143 requires") is rewritten to say: that module-level literal, like any guard in this
    agent-editable module, is the in-handler kind Decision 143 cl.1/cl.3 rejects; Decision 143 requires the write leg's
    identity boundary to be enforced by IAM and resource shape, outside the agent merge loop, and T4.10a c7 gates the write
    leg on it (never attribute that gate to Decision 206); so the module projects reads only until that boundary exists.
    rec-4134's acceptance is line-based and case-sensitive: the exact phrase 'outside the agent merge loop' sits on ONE
    docstring line (never wrapped at 127), and no text contains 'in-handler guard Decision 143 requires'. This also puts
    mcp_server.py in the merge diff, so the post-merge CI full tier re-measures it under the new selection in the
    environment that failed (Decision 159 cl.1 push-context base).
- file: config/coverage_baseline.yaml
  action: Modify
  purpose: >-
    Delete the scripts/agent_sdk/mcp_server.py 88.4 entry. Removal is unrestricted (Decision 159 cl.2, Decision 165 marker
    guard); the file returns to the 100% default now that hermetic tests cover it (Decision 178 cl.6 paydown, rec-2914
    lane). No other entry changes; scheduled_agent_handler.py's 80.3 is held.
- file: tests/data/handlers/scheduled_agent_handler/test_helpers.py
  action: Modify
  purpose: >-
    Remove the misapplied @pytest.mark.integration from TestGetGithubPat::test_fetches_from_secrets_manager_when_arn_set and
    ::test_returns_empty_on_secrets_manager_failure. Both patch boto3.client and touch no network. Under the new selection
    they would otherwise be deselected and src/data/handlers/scheduled_agent_handler.py would drop from its 80.3 baseline to
    74.8 (measured at plan time). They then run in every tier, as hermetic unit tests should.
- file: tests/session/preflight/conftest.py
  action: Modify
  purpose: >-
    The autouse _disable_reader_and_git_fetch fixture also patches scripts.preflight.recs_cache._landed_followon_rec_ids
    with return_value={}, beside the existing fetch_recs_signal_inputs stub, with an escape hatch when request.cls is
    TestAdHocLaneDerivations (it owns the real function and reaches it with a tmp plans_dir, also through
    _derive_followon_recs), mirroring the TestCheckMainFreshness and test_dependabot hatches (Decision 131 cl.3: package
    autouse fixtures live in the sub-conftest). #1452 added this walk to main() unstubbed. Plan time: package 96-100s to 58s
    on 4 workers; each main()-level test about 10s to about 5s. The docstring names the stub and its escape hatch.
- file: tests/session/preflight/test_recs_cache_adhoc_lane.py
  action: Modify
  purpose: >-
    New class TestPlanWalkStub, node test_main_level_tests_see_a_stubbed_plan_walk: under the package fixture,
    recs_cache._landed_followon_rec_ids is a mock and returns {} when called with no argument. It does not call main(), so
    it fits the probe sandbox's 30s pytest cap (a main()-level node measured about 20s there at plan time). Red before: it
    is the real function. TestAdHocLaneDerivations stays unchanged and green, proving the escape hatch.
- file: config/agent/verification_registry/entries/coverage-child-integration-deselect.yaml
  action: Create
  purpose: >-
    Registry shard for graduated VP step 1 and rec-4273's closure artifact. check_id coverage-child-integration-deselect
    (filename equals check_id, Decision 176), primitive_slot command_exit_zero, check_spec.command step 1's pytest node,
    guard_target scripts/checks/misc/coverage_baseline.py, guard_symbol measure_and_check, plan_slug
    coverage-child-tier-parity, graduated_by implement-agent.
- file: config/agent/verification_registry/entries/mcp-server-hermetic-coverage.yaml
  action: Create
  purpose: >-
    Registry shard for graduated VP step 2. check_id mcp-server-hermetic-coverage, primitive_slot command_exit_zero,
    check_spec.command step 2's class selector, guard_target scripts/agent_sdk/mcp_server.py, guard_symbol create_server,
    plan_slug coverage-child-tier-parity, graduated_by implement-agent.
- file: config/agent/verification_registry/entries/preflight-plan-walk-stubbed.yaml
  action: Create
  purpose: >-
    Registry shard for graduated VP step 3. check_id preflight-plan-walk-stubbed, primitive_slot command_exit_zero,
    check_spec.command step 3's node, guard_target tests/session/preflight/conftest.py, guard_symbol
    _disable_reader_and_git_fetch, plan_slug coverage-child-tier-parity, graduated_by implement-agent.
bundled_recommendations:
- rec-4273
- rec-4275
- rec-4134
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  The per-file coverage child passes the same -m marker expression as the full-tier unit-test command; an
  integration-marked test never executes inside a coverage measurement.
- >-
  scripts/agent_sdk/mcp_server.py measures 100% with integration deselected (diagnostic step 4; authoritative in step 9's
  full tier and post-merge CI, since this merge changes the file), and
  config/coverage_baseline.yaml carries no entry for it.
- >-
  Run with credentials, the repaired live test passes against the deployed reader and still carries no credentials-skip
  guard.
- >-
  src/data/handlers/scheduled_agent_handler.py measures at or above its 80.3 baseline (diagnostic step 4; an accepted
  residual until a merge changes that file).
- >-
  Every tests/session/preflight main()-level test runs with the follow-on plan walk stubbed; only TestAdHocLaneDerivations
  sees the real function; scripts/session/preflight.py still measures 100%. COVERAGE_TIMEOUT_SECONDS is unchanged at 300.
- >-
  Before merge, rec-4273's and rec-4275's stored acceptance is VP step 8's decidable node list, it passes inside the probe
  sandbox, and each context carries the pre-stamped closure_artifact shard:coverage-child-integration-deselect. After merge
  the Resolves trailer closes rec-4273, rec-4275 and rec-4134.
- >-
  The post-merge main-validate run on the merge commit is green and re-measured mcp_server.py in CI under the new
  selection; no open ci_rca rec remains for this failure (rec-4273, rec-4275) and none was filed since the merge.
- >-
  rec-4232, rec-2863 and rec-2639 are closed under the operator's recorded authorization, each resolution embedding its
  acceptance command re-run on the green main and that output (Decision 103 proof) and citing c792924d.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The coverage child selects tests with the full tier's marker expression.
  command: >-
    bin/venv-python -m pytest tests/checks/misc/test_coverage_baseline.py::TestMeasureAndCheck::test_child_selects_the_full_tier_marker_expression
    -q
  expected: Exit 0, 1 passed. Red before, the node is absent (pytest exit 4, target_absent).
  fix_if: >-
    The argv lacks the marker, or the derivation read the interpreter's -m. Never hardcode the expected expression; it is
    always read from _build_unit_test_cmd().
  hermetic: true
  graduation: graduate
  graduation_check_id: coverage-child-integration-deselect
  expected_literals:
  - 1 passed
- step: 2
  phase: pre-deploy
  action: Hermetic create_server coverage nodes.
  command: bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::TestCreateServer -q
  expected: Exit 0, 5 passed in a few seconds. Red before, the class is absent (pytest exit 4, target_absent).
  fix_if: >-
    A node reaches the network or make_reader(): every node injects a stub reader or patches the seam it exercises. Never
    mark one integration.
  hermetic: true
  graduation: graduate
  graduation_check_id: mcp-server-hermetic-coverage
  expected_literals:
  - 5 passed
- step: 3
  phase: pre-deploy
  action: Preflight main()-level tests see a stubbed plan walk.
  command: >-
    bin/venv-python -m pytest tests/session/preflight/test_recs_cache_adhoc_lane.py::TestPlanWalkStub::test_main_level_tests_see_a_stubbed_plan_walk
    -q
  expected: Exit 0, 1 passed. Red before, the node is absent (pytest exit 4, target_absent).
  fix_if: >-
    The fixture patches a name main() does not call through (main() calls recs_cache._landed_followon_rec_ids()), or the
    escape hatch also matched this class.
  hermetic: true
  graduation: graduate
  graduation_check_id: preflight-plan-walk-stubbed
  expected_literals:
  - 1 passed
- step: 4
  phase: pre-deploy
  action: >-
    DIAGNOSTIC evidence (the checker labels its own verdict non-authoritative) through scripts.test_coverage_checker's
    measurement path, on the two sources whose measured value this plan changes. The authoritative gates are step 9's full
    tier and post-merge CI, which measure only files in the diff (mcp_server.py, coverage_baseline.py). Plan-time evidence for the other three sources whose mapped tests hold integration tests, measured
    with -m "not integration": ops_data_portal.py 100.0, ducklake_maintenance_ops.py 100.0, ducklake_spike.py 29.7
    (baseline 29.7).
  command: >-
    bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files scripts/agent_sdk/mcp_server.py
    src/data/handlers/scheduled_agent_handler.py
  expected: >-
    Exit 0 and 'DIAGNOSTIC VERDICT: PASS'. With the selection change alone, the same command reads mcp_server.py 60.5 and
    scheduled_agent_handler.py 74.8.
  fix_if: >-
    mcp_server.py below 100: a TestCreateServer node misses a line. scheduled_agent_handler.py below 80.3: the marker removal
    is incomplete. Never restore or add a baseline entry.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Duplicates the full tier's per-file validate_test_coverage gate, which re-measures each of these files whenever a merge
    changes it (Decision 159 cl.1), and costs coverage subprocesses that run for minutes on CC-web. Steps 1-2's graduated
    nodes guard the selection rule and mcp_server.py's hermetic coverage as standing checks.
- step: 5
  phase: pre-deploy
  action: >-
    Repaired live-boundary test against the deployed reader (read-only, one bounded recs_by_ids call; agent_platform
    credentials).
  command: >-
    bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::TestEndToEnd::test_recs_by_ids_tool_returns_exactly_one_row_against_live_boundary
    -q
  expected: Exit 0, 1 passed.
  fix_if: >-
    A credentials error: restore the static-key chain (aws sts get-caller-identity --profile agent_platform) and rerun;
    never add a skip. A projection assertion: re-read the live describe() and fix the test, never the reader.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: >-
    Relative timing in one container, SERIAL like the coverage child (no -n): tests/session/preflight on an origin/main
    worktree, then on HEAD. CC-web runs this package several times slower than CI, so this is a ratio, not CI's absolute
    figure; CI reached 84% of the package in 300s on c792924d. Run in the background; each leg takes minutes.
  command: >-
    R=$PWD && D=$(mktemp -d) && git worktree add -q --detach $D/wt origin/main && trap 'git -C "$R" worktree remove --force
    "$D/wt"' EXIT && cd $D/wt && t0=$(date +%s) && $R/bin/venv-python -m pytest tests/session/preflight -q && base=$((
    $(date +%s) - t0 )) && cd $R && t1=$(date +%s) && bin/venv-python -m pytest tests/session/preflight -q && head=$(( $(date
    +%s) - t1 )) && echo "base=${base}s head=${head}s" && test $(( head * 100 )) -le $(( base * 65 )) && echo TIMING_OK
  expected: >-
    Both runs all-passed, then the two durations and TIMING_OK (plan time, 4 workers: 100s on origin/main, 58s with the stub
    prototyped; the serial sum of per-test durations fell from about 340s to about 190s).
  fix_if: >-
    No improvement: the stub does not intercept main()'s call. Never relax the ratio, and never raise
    COVERAGE_TIMEOUT_SECONDS.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: >-
    DIAGNOSTIC measurement of scripts/session/preflight.py (Decision 163: neither step 9 nor post-merge CI re-measures it,
    since it is not in this merge's diff). The cap is raised IN THIS PROBE ONLY, so the local run completes; it records local wall time against
    the 300s cap and proves coverage is unchanged by the stub.
  command: >-
    bin/venv-python -c "import time; from pathlib import Path; import scripts.test_coverage_checker as t; from
    scripts.checks.misc import coverage_baseline as cb; cb.COVERAGE_TIMEOUT_SECONDS = 3600; t0 = time.time(); e =
    t.check_per_file_coverage([Path('scripts/session/preflight.py').resolve()]); print(f'wall={time.time() - t0:.0f}s
    cap=300s (local; CI runs this package several times faster)'); assert e == [], e; print('PREFLIGHT_COVERAGE_OK')"
  expected: Exit 0, a wall=Ns line and PREFLIGHT_COVERAGE_OK. Run it in the background; locally it takes minutes.
  fix_if: >-
    A coverage error: the stub removed a covered path from preflight.py's own lines; check main()'s call site. Never keep
    the raised cap outside this probe.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A minutes-long, one-time probe that overrides the cap in-process; as a standing check it would duplicate the full
    tier's own preflight.py measurement, which runs whenever a merge changes that file. Step 3's graduated node guards the
    stub that this probe exercises.
- step: 8
  phase: pre-deploy
  action: >-
    rec-4273's and rec-4275's amended acceptance and pre-stamped closure artifact are stored, the acceptance lints
    decidable, and it passes inside the same isolation the trailer evaluator uses (scripts.backlog_health.probe.run_one: unshare -rmn, read-only bind,
    30s pytest cap). Plan time: the CURRENT acceptance returns fail there.
  command: >-
    bin/venv-python -c "import json; from pathlib import Path; from scripts.backlog_health import probe; from
    scripts.executor.acceptance_lint import lint_acceptance_command as lint; from src.common.ducklake_reader_client import
    fetch_recs_by_ids, make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-4273', 'rec-4275']); assert
    len(rows) == 2, rows; want = 'bin/venv-python -m pytest
    tests/checks/misc/test_coverage_baseline.py::TestMeasureAndCheck::test_child_selects_the_full_tier_marker_expression
    tests/test_agent_sdk_mcp_server.py::TestCreateServer
    tests/session/preflight/test_recs_cache_adhoc_lane.py::TestPlanWalkStub::test_main_level_tests_see_a_stubbed_plan_walk
    -q'; assert all(r['acceptance'] == want for r in rows), rows; assert lint(want, require_decidable=True)[0], want; assert
    all(json.loads(r['context_v2_json']).get('closure_artifact') == 'shard:coverage-child-integration-deselect' for r in
    rows), rows; v = probe.run_one(want, repo_root=Path('.').resolve()); assert v == probe.PASS, v; print('ACCEPTANCE_HOLDS')"
  expected: Exit 0 and ACCEPTANCE_HOLDS.
  fix_if: >-
    An old acceptance or no closure_artifact is stored: run execution step 6's update_rec calls, then rerun. probe
    timeout: a named node exceeds the 30s sandbox cap; keep main() calls out of the acceptance. Never push the trailer while
    this step is red (Decision 201: the closing verdict is keyed to the current acceptance's sha256).
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: >-
    Full validation tier before handoff (Decision 163) on the committed, rebased, clean tree, then bin/venv-python -m
    scripts.checks.validation_result --verify-head exit 0 (git-ops.yaml handoff_sequence).
  command: bin/venv-python -m scripts.validate
  expected: "Exit 0 and a final 'Validation Summary (scope: all)' PASS."
  fix_if: >-
    Fix the named check and rerun the full tier from the start; never raise a budget, skip a check or weaken an assertion. A
    timed-out or incomplete full run is BLOCKED: resume and rerun from the start, never hand it to CI.
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: post-deploy
  action: >-
    Post-merge, in this order. PRECONDITION: read main-validate's run for the merge commit with mcp__github__actions_list
    (list_workflow_runs, resource_id ci.yml, branch main, matching head_sha) and proceed only once it reports status
    completed and conclusion success; its log shows validate_test_coverage mapping scripts/agent_sdk/mcp_server.py. Only
    then run the command, which proves no ci_rca rec was filed since the merge (it would pass vacuously before the run
    concludes).
  command: >-
    bin/venv-python -c "import sys; from src.common.ducklake_reader_client import make_reader; rows =
    make_reader().named('ci_rca_since', since_ts=sys.argv[1]); print(rows); assert rows == [], rows" "$(git fetch -q origin
    main && git log -1 --format=%cI origin/main)"
  expected: Prints [] and the workflow run's conclusion is success.
  fix_if: >-
    The run has not concluded: wait for its completion event, never run the command early. origin/main moved past the
    merge: pass the merge commit's own %cI instead. A new ci_rca rec or a red run: the
    merge-protocol forward-fix path applies (Decision 73); do not patch main inline before /plan reviews it.
- step: 11
  phase: post-deploy
  action: rec-4273, rec-4275 and rec-4134 are closed by the squash commit's Resolves trailer.
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
    fetch_recs_by_ids(make_reader(), ['rec-4273', 'rec-4275', 'rec-4134']); st = {r['id']: r['status'] for r in rows};
    print(st); assert st == {'rec-4273': 'closed', 'rec-4275': 'closed', 'rec-4134': 'closed'}, st"
  expected: Prints all three statuses as closed, exit 0.
  fix_if: >-
    Still open: confirm the squash body carries 'Resolves: rec-4273, rec-4275, rec-4134' in a Key: value block, then read the
    trailer-closure job's verdict artifact. ClosureArtifactRequired despite the pre-stamp: confirm the verdict says holds,
    then close via ci-rca-lifecycle closure_dependency.manual_route with the same --closure-artifact and --closure-fix-sha
    <merge sha> in one call. An AcceptanceVerdictRefused is never closed manually: fix the acceptance or the code and let a
    trailer close it.
- step: 12
  phase: post-deploy
  action: >-
    The planning hard block is actually cleared: ci_rca_open (the preflight hard-block surface) returns neither rec-4273
    nor rec-4275. Steps 10-11 alone would pass with a pre-existing duplicate still open.
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; rows = make_reader().named('ci_rca_open');
    ids = {r['id'] for r in rows}; print(ids); assert len(rows) < 5, 'LIMIT 5 reached: absence unprovable'; assert not ids &
    {'rec-4273', 'rec-4275'}, ids"
  expected: >-
    Prints the open ci_rca ids (fewer than five, neither rec-4273 nor rec-4275), exit 0. ci_rca_open is LIMIT 5, so five
    rows make the absence check inconclusive and the command fails rather than pass vacuously.
  fix_if: >-
    'LIMIT 5 reached': other ci_rca recs are open; step 11's per-rec statuses are then the authoritative proof, and the
    extra recs go to /orient triage. One is still open: return to step 11's fix_if for that rec. A different open ci_rca rec for this same failure filed
    before the merge is a further duplicate: close it like rec-4275, citing the same shard.
- step: 13
  phase: post-deploy
  action: >-
    Operator-authorized closure of the #1452 recs (Benjamin, 2026-10-11, Step 6b) once step 10 is green. For each of
    rec-4232, rec-2863, rec-2639: re-run its stored acceptance on main, then close it with bin/venv-python -m
    scripts.ops_data_portal --update-rec <id> --status closed --resolution "<the acceptance command and its output; fixed by
    c792924d (#1452), whose squash omitted the Resolves trailer (rec-4244); closed under the operator authorization recorded
    in PLAN-coverage-child-tier-parity>". No --closure-fix-sha: none carries context_v2_json and none is escape-classified.
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
    fetch_recs_by_ids(make_reader(), ['rec-4232', 'rec-2863', 'rec-2639']); st = {r['id']: r['status'] for r in rows};
    print(st); assert set(st.values()) == {'closed'} and len(st) == 3, st; assert all('c792924d' in (r.get('resolution') or
    '') for r in rows), [r.get('resolution') for r in rows]"
  expected: Prints all three statuses as closed, each resolution citing c792924d, exit 0.
  fix_if: >-
    A resolution lacks the proof or the c792924d citation: append it with a status-preserving update_rec. An acceptance
    fails on main: do not close that rec; report it to the operator. A portal write fails: it fails loudly
    (Decision 84 I-4); re-run after restoring connectivity.
test_obligations:
- source: scripts/checks/misc/coverage_baseline.py
