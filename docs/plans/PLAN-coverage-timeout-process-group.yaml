    for k in ('rec-4252', 'rec-4185')}; print(st); assert set(st.values()) == {'closed'}, st"
  expected: Prints both statuses as closed, exit 0.
  fix_if: >-
    Still open: confirm the squash body carries 'Resolves: rec-4252, rec-4185' and inspect ci.yml's closure job run on the
    merge commit.
test_obligations:
- source: scripts/checks/_process_group.py
  behavior: >-
    kill_and_reap SIGKILLs the child's whole process group, never the caller's own group (it falls back to the child's
    pid there), tolerates an already-reaped child, and bounds the reap, closing both pipes when it times out.
  verification_step: 1
  test_selector: tests/checks/test__process_group.py::TestKillAndReapSignalTargeting::test_never_signals_the_callers_own_group
  red_green_expectation: >-
    Red before: the module and its mirror test are absent (pytest exit 4). Without the guard, the spy records os.getpgrp()
    and the assertion fails without killing the runner. Green after.
- source: scripts/checks/misc/coverage_baseline.py
  behavior: >-
    The coverage child starts in its own session. On timeout it is killed through _process_group.kill_and_reap and the
    cap-named failure is recorded from COVERAGE_TIMEOUT_SECONDS. An interrupt while waiting kills the child, then re-raises.
  verification_step: 2
  test_selector: tests/checks/misc/test_coverage_baseline.py::TestMeasureAndCheck::test_timeout_kills_the_child_group_and_records_the_cap
  red_green_expectation: >-
    Red before: the node is absent (pytest exit 4), and on a tree without the constant monkeypatch.setattr raises at once.
    Green after.
- source: scripts/checks/verification/_vp_replay_budget.py
  behavior: >-
    run_bounded still kills the timed-out step's whole process group and bounded-reaps it on TimeoutExpired and on any
    BaseException, now through the shared helper.
  verification_step: 4
  test_selector: tests/checks/verification/test__vp_replay_budget.py::TestRunBoundedTimeoutKillsTheProcessGroup::test_the_orphaned_grandchild_is_dead
