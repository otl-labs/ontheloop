gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND, scout_input_fingerprint: 'v1:165d3c7fa531e53c2b74306f23e7832f9700f2233fb07bf8fa7286b05e7ac4a4'}  # pragma: allowlist secret
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Write the new tests (VP 1-2 selections) and confirm they fail on the base (red before).
  - Edit plan_gate_rounds.py, plan_decision_drafts.py, validate_plan_documents.py and create _plan_category_verdicts.py per their scope rows.
  - Apply the two skill edits exactly as worded and lower the planning SKILL.md budget to its measured size.
  - Execute the Verification Plan -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
  - "Report: what was implemented, verification results"
