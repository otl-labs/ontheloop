  - "Residual (Decision 87 cl.4 spirit): the planner, not the critic, writes the per-entry verdict; the check proves every drafted title is named, not that the critic issued it. Same residual as Decision 262 cl.4's rec-5129 (a row recorded without its run); critic-authored recording arrives with T4.29's plan_critic check run, whose 12p row would carry the entries (proposed to Agents in GitHub on #1963)."
