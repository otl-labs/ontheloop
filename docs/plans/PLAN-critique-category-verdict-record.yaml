  - No raise of any size budget (Decisions 128, 166); the skill edits are byte-neutral or shrinking.
  - No edit to another project's files (docs/contracts/personas/plan_critic.yaml, telemetry contracts).
  - No rescue agents or workaround loops (Decision 55).
