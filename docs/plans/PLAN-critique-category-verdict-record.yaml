schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "critique-category-verdict-record"
intent: >-
  Record plan-critique's step 12p category-consistency verdict once per drafted Decision entry on the plan's own
  plan-critique gate row (CFR-01 part 4, rec-5261), and fail a plan PR whose last critique row does not name every
  drafted entry. The record is what lets Decision 167's mis-routed-past-both-gates condition be evaluated and shows
  whether 12p ever changed an outcome. Serves NS.6 (touches NS.4): a gate's verdict on record lets a later review test
  whether the gate changed outcomes, instead of resting on convention.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-critique-category-verdict-record.yaml
phase: >-
  user_explicit_out_of_scope (operator remit 2026-11-17: the contract-first retrospective's findings,
  audits/contract-first-retrospective-177c8f37.yaml; recs only, no roadmap item, WORK-ORDER question 7). Closes no
  tier_item criterion.
cites: [dec:167, dec:205]
amends: []
introduces: []
closes_criteria: []
scope:
  - file: scripts/roadmap/plan_gate_rounds.py
    action: Modify
    purpose: >-
      Add CategoryVerdict (pydantic, extra=forbid): entry (str, min_length 1; the drafted entry's heading title as
      plan_decision_drafts.drafted_titles returns it) and verdict (Literal PASS, REVISE). GateRound gains
      category_consistency: list[CategoryVerdict] | None = None. Row rules: allowed only on a plan-critique row; an
      empty list is the explicit N/A of a round at which the plan drafted nothing; entries unique and non-empty after strip; any
      REVISE entry requires the row's verdict REVISE and blocking >= the number of REVISE entries (12p is blocking on
      its own). No quote or note is stored. Docstring: per entry this is a verdict, not a finding or a directive
      (findings stay with rec-4434's telemetry_persona_findings; directives in check-run output, Decision 205 cl.5);
      the title is stored raw.
    new_imports: []
  - file: scripts/roadmap/plan_decision_drafts.py
    action: Modify
    purpose: >-
      Add drafted_titles(plan_path, root=None) -> list[str]: the title of every drafted entry _scan_plan counts, in
      its order (plan-text drafts, then each sidecar block), total and never raising ([] on an unreadable plan).
      Factor the skip-and-count loop of _draft_findings into one private generator both use, so the count and the
      titles cannot diverge. The list may hold a title twice (the same draft in plan text and sidecar); consumers
      compare it as a set.
    new_imports: []
  - file: scripts/checks/roadmap/_plan_category_verdicts.py
    action: Create
    purpose: >-
      category_gaps(path, doc, root) -> (gaps, advisories). For a plan of schema_version >= 5 that drafts at least one
      Decision (drafted_titles non-empty) and has at least one plan-critique row: a gap when the last plan-critique
      row has no category_consistency, names a drafted title zero times, or names an entry that is not a drafted
      title (each message lists the titles verbatim and teaches the shape:
      "category_consistency: [{entry: \"<title>\", verdict: PASS|REVISE}] (plan-critique SKILL.md step 12p)"; the
      title is quoted because Decision titles carry commas, which break a YAML flow mapping); an advisory for each earlier plan-critique row with no
      category_consistency. Compares against set(drafted_titles), so a title drafted in both plan text and sidecar
      needs one entry. Docstring notes the trigger (drafted_titles non-empty) is broader than 12p's own (a
      DECISIONS.md scope row or ratification block); 0 of 31 drafting plans differ today. Imports
      plan_decision_drafts lazily; never raises at import.
    new_imports: [scripts.roadmap.plan_decision_drafts]
  - file: scripts/checks/roadmap/validate_plan_documents.py
    action: Modify
    purpose: >-
      Call category_gaps for a plan added in the diff or whose docs/plans/approved/<slug>.yaml the status-aware diff
      adds or modifies (one diff read, already taken for added names; no extra git call per plan). Route its gaps
      with _gate_round_gaps (FAIL on the plan PR, WARN locally and on the push to main) and its advisories as WARN.
      New seam changed_sidecar_slugs: set[str] | None for tests; when plans_dir is given it defaults to an empty set
      (mirroring modified_plan_names), so plans_dir fixtures never consult the real repo diff.
    new_imports: [scripts.checks.roadmap._plan_category_verdicts]
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      validate_plan_documents' pre_globs gain scripts/checks/decisions/envelope_rules.py,
      scripts/north_star_models.py (imported through plan_decision_drafts) and docs/DECISIONS_ARCHIVE.md (read by
      drafted_titles' skip set). If PR #2198 has merged first, also
      scripts/checks/decisions/decisions_size_measure.py; the build re-runs plan_obligations and adds exactly the
      paths it names.
    new_imports: []
  - file: tests/checks/roadmap/test__manifest.py
    action: Modify
    purpose: The validate_plan_documents Entry's pre_globs cover the three paths the _manifest.py row adds.
  - file: tests/test_plan_gate_rounds.py
    action: Modify
    purpose: >-
      test_step_12p_verdict_recorded_per_drafted_entry (rec-5261's acceptance node): a two-entry fixture plan whose
      last critique row names both titles has no gap; dropping one, misspelling one, or omitting the field each
      yields a gap naming the title; plus the row rules (wrong gate, duplicate entry, REVISE entry on a PROCEED row,
      empty list accepted; a title drafted in both plan text and sidecar needs one entry).
  - file: tests/test_plan_decision_drafts.py
    action: Modify
    purpose: drafted_titles returns plan-text and sidecar titles in order and its length equals _scan_plan's drafted count.
  - file: tests/checks/roadmap/test__plan_category_verdicts.py
    action: Create
    purpose: Mirror test for the helper (gap and advisory cases, no-draft and pre-v5 plans exempt).
  - file: tests/checks/roadmap/test_validate_plan_documents_category_verdicts.py
    action: Create
    purpose: >-
      Routing through validate_plan_documents (FAIL with GITHUB_EVENT_NAME=pull_request, WARN otherwise), the
      changed-sidecar trigger for a modified plan, and a plan outside the diff never examined. A new file because
      test_validate_plan_documents.py is at 498 of 500 SLOC.
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Byte-neutral rewrite of the Phase 3 output line only (never the 12p. list item): "**Category Consistency (12p,
      Decision 167 clause 2):** N/A -- plan drafts no numbered Decision text / PASS" becomes "**Category Consistency
      (12p):** one line per drafted entry, title first: N/A -- no drafted Decision / PASS" (0 bytes net; file stays
      18,025 B).
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Template row comment "# critique rows add blocking, nits; escalated: true + escalation_choice when asked"
      becomes "# critique rows add blocking, nits, category_consistency (12p per drafted entry); escalated +
      escalation_choice when asked" (+40 B), paid for by deleting the Critique Gate section's last sentence "This gate
      reviews the PLAN artefact, not the report deliverable. For REPORT-ONLY plans, the deliverable gets its own
      critique in Step 10." (-139 B), which .claude/commands/plan.md:102 already carries.
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      test_plan_template_records_gate_rounds_not_a_gates_line pins the template comment this plan rewrites: update the
      pinned string to the new comment, and add one assertion pinning the plan-critique output line's new words
      ("**Category Consistency (12p):** one line per drafted entry, title first:").
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: Lower .claude/skills/planning/SKILL.md's budget to the measured size after the edit (a decrease, always allowed).
bundled_recommendations: [rec-5261]
followon_recs: []
infrastructure_dependencies:
  - "None. No .tf file and no Lambda-packaged file is in scope."
acceptance_criteria:
  - A plan-critique gate row accepts category_consistency with one PASS or REVISE per drafted entry and refuses it on any other gate, with a duplicate entry, or with a REVISE entry on a PROCEED row.
  - A plan added in the diff (or whose sidecar the diff adds or changes) that drafts a Decision fails validate_plan_documents on the plan PR unless its last plan-critique row names every drafted title exactly once and nothing else; locally and on push it is a WARN.
  - The plan-critique output line asks for one 12p line per drafted entry, title first, and both skills stay within their prose budgets.
  - rec-5261 closes through the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Row model and per-entry coverage (rec-5261's acceptance; red before, green after).
    command: bin/venv-python -m pytest tests/test_plan_gate_rounds.py::test_step_12p_verdict_recorded_per_drafted_entry -q
    expected: The test passes; before the build it fails (the field and helper are absent).
    fix_if: A failure names the rule; fix the code, never the fixture's expectation.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: critique-category-verdict-row
  - step: 2
    phase: pre-deploy
    action: Helper, drafts titles and check routing.
    command: >-
      bin/venv-python -m pytest -q tests/checks/roadmap/test__plan_category_verdicts.py tests/test_plan_decision_drafts.py
      tests/checks/roadmap/test_validate_plan_documents_category_verdicts.py tests/test_plan_gate_rounds.py
      tests/checks/roadmap/test__manifest.py
      tests/test_workflow_skill_antidrift.py::test_plan_template_records_gate_rounds_not_a_gates_line
    expected: All selected tests pass.
    fix_if: Fix the code named by the failing test.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: critique-category-verdict-gap
  - step: 3
    phase: pre-deploy
    action: Skill text and budgets.
    command: >-
      bin/venv-python -c "import pathlib; c=pathlib.Path('.claude/skills/plan-critique/SKILL.md').read_text(encoding='utf-8');
      p=pathlib.Path('.claude/skills/planning/SKILL.md').read_text(encoding='utf-8');
      print('critique_line=' + str('**Category Consistency (12p):** one line per drafted entry, title first:' in c),
      'template=' + str('category_consistency (12p per drafted entry)' in p))" && bin/venv-python -m scripts.validate --pre
    expected: Prints critique_line=True template=True, then validate --pre exits 0.
    fix_if: A False means the wording drifted; a prose-budget failure means the trim was not applied.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      recursion_refusal: the step invokes scripts.validate, which the graduate partition refuses (vp-red-before.yaml);
      the antidrift pins in VP 2 are the standing guard of the words.
  - step: 4
    phase: pre-deploy
    action: Live corpus is quiet (no plan outside the build's diff is examined or flagged).
    command: >-
      env -u GITHUB_EVENT_NAME bin/venv-python -c "from scripts.checks.roadmap.validate_plan_documents import
      validate_plan_documents as v; f=[]; v(f); print('RESULT', 'FAILED' if f else 'OK')" 2>&1 | grep -E
      '^RESULT|category_consistency'
    expected: >-
      Exactly one line, RESULT OK. No FAIL or WARN line names category_consistency (the build's diff drafts no
      Decision, so any such line is a plan outside the diff).
    fix_if: A line naming category_consistency means the trigger reached a plan outside the diff; fix the trigger.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Its result depends on this session's diff state (which plans and sidecars the diff adds), which a registry
      replay cannot reproduce; VP 2's routing tests are the standing guard.
  - step: 5
    phase: pre-deploy
    action: Full tier on the committed, rebased tree before handoff (handoff_policy).
    command: bin/venv-python -m scripts.validate
    expected: Exit 0; its verdict read with bin/venv-python -m scripts.checks.validation_result --verify-head.
    fix_if: Any failing check; fix it on the branch, never skip it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      recursion_refusal: the graduate partition refuses a step that invokes scripts.validate (vp-red-before.yaml).
  - step: 6
    phase: post-deploy
    action: rec-5261 reads back closed after the squash merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as rc; r,_=rc.fetch_recs_by_ids(rc.make_reader(),
      ['rec-5261']); print('REC', r[0]['id'], r[0]['status'])"
    expected: Prints REC rec-5261 closed.
    fix_if: Still open; run the git-ops.yaml resolves_trailer recovery route, never a manual status write.
    hermetic: false
test_obligations:
  - source: scripts/roadmap/plan_gate_rounds.py
    behavior: category_consistency row rules.
    verification_step: 1
    test_selector: tests/test_plan_gate_rounds.py::test_step_12p_verdict_recorded_per_drafted_entry
    red_green_expectation: red before (field absent), green after.
  - source: scripts/roadmap/plan_decision_drafts.py
    behavior: drafted_titles matches _scan_plan's count and order.
    verification_step: 2
    test_selector: tests/test_plan_decision_drafts.py
    red_green_expectation: red before (function absent), green after.
  - source: scripts/checks/roadmap/_plan_category_verdicts.py
    behavior: gaps and advisories per drafted entry.
    verification_step: 2
    test_selector: tests/checks/roadmap/test__plan_category_verdicts.py
    red_green_expectation: red before (module absent), green after.
  - source: scripts/checks/roadmap/validate_plan_documents.py
    behavior: gaps routed FAIL on the plan PR and WARN elsewhere; sidecar-change trigger.
    verification_step: 2
    test_selector: tests/checks/roadmap/test_validate_plan_documents_category_verdicts.py
    red_green_expectation: red before (no category gap emitted), green after.
  - source: scripts/checks/roadmap/_manifest.py
    behavior: validate_plan_documents' pre_globs cover the modules and file drafted_titles reads.
    verification_step: 2
    test_selector: tests/checks/roadmap/test__manifest.py
    red_green_expectation: red before (globs absent), green after.
  - source: .claude/skills/plan-critique/SKILL.md
    behavior: output line asks for one 12p line per drafted entry.
    verification_step: 2
    test_selector: tests/test_workflow_skill_antidrift.py::test_plan_template_records_gate_rounds_not_a_gates_line
    red_green_expectation: red before (old words), green after.
  - source: .claude/skills/planning/SKILL.md
    behavior: template comment names category_consistency.
    verification_step: 2
    test_selector: tests/test_workflow_skill_antidrift.py::test_plan_template_records_gate_rounds_not_a_gates_line
    red_green_expectation: red before (old comment), green after.
  - source: config/prose_budgets.yaml
    behavior: planning SKILL.md budget equals its measured size.
    verification_step: 3
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: A budget value; validate_prose_budgets inside validate --pre is its guard.
constraints:
