schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "critique-findings-record"
intent: >-
  Make each plan-critique gate row carry its per-finding list (id, blocking or nit, mechanical or judgement, anchor,
  one-line subject, disposition) and let the plan-PR gate end a critique series on a PROCEED whose nits all carry a
  disposition, with no confirming round and no accept-with-deferral workaround (operator-approved plan-critique rule 5,
  2026-11-23, audit #2387 finding PCL-04). Serves NS.6: the next audit measures critique yield from the record instead
  of inferring it from diffs, and planning stops paying for confirming rounds.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-critique-findings-record.yaml
phase: >-
  user_explicit_out_of_scope (operator remit 2026-11-23: the six plan-critique rules from audit #2387,
  audits/plan-critique-late-findings-ea25b5bb4; recs only, no roadmap item). Closes no tier_item criterion.
cites: [dec:205, dec:235]
amends: []
introduces: []
closes_criteria: []
scope:
  - file: scripts/roadmap/plan_gate_rounds.py
    action: Modify
    purpose: >-
      Add CritiqueFinding (pydantic, extra=forbid): id (str, non-empty after strip), severity (Literal blocking, nit),
      origin (Literal mechanical, judgement), anchor (str, non-empty after strip; a plan field path or VP step id),
      subject (str, non-empty after strip, at most 200 characters, no newline), disposition (Literal fixed, disputed,
      deferred, applied-wording, build-note). GateRound gains findings: list[CritiqueFinding] | None = None. Row rules:
      findings only on a plan-critique row; ids unique within the row; the count of blocking entries equals blocking
      and the count of nit entries equals nits; a blocking entry's disposition is fixed or disputed, or deferred only
      on a row whose escalation_choice is accept-with-deferral (the operator deferred it; the record stays true); a nit
      entry's disposition is fixed, disputed, applied-wording or build-note on any row (rec-5527's own list). A
      build-note entry's subject is the note the build reads from the last
      critique row. Add version_errors(schema_version, rows) -> list[str]: at schema_version 7 and above every
      plan-critique row carries findings and no plan-critique PROCEED row carries escalation_choice accept-with-deferral
      (the workaround is closed; Step 9's other escalation answers stay recordable on a PROCEED and never pass ended()); below 7 no row carries findings. Each version_errors message teaches the shape (findings:
      [{id, severity, origin, anchor, subject, disposition}] with the allowed values, and for an accept-with-deferral PROCEED:
      record nit dispositions instead), so a plan rebasing to 7 learns it at load. Reword the module docstring ("Counts and run facts
      only"), GateRound's "never a per-finding record" sentence and CategoryVerdict's docstring: plan-critique rows now
      carry the planner's recorded per-finding gate history (tags and dispositions); critique directives stay in
      check-run output (Decision 205 cl.5) and persona per-finding rows with rec-4434 (T4.29 c2). CritiqueFinding's
      docstring maps its fields to docs/contracts/personas/plan_critic.yaml's findings item (subject = title; id is the critic's
      short id, not plan_critic.yaml's derived <check>:<anchor>; check, detail and suggestion not carried) so T4.29 c3-c5 can map one to one.
    new_imports: []
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      _SUPPORTED_VERSIONS gains 7; _validate_handoff_policy's version set gains 7 (and its message names 7);
      _validate_gate_rounds raises ValueError on any plan_gate_rounds.version_errors(...) message. Net growth at most
      6 SLOC (file is 479 of 500); if it would exceed that, decompose (Decision 128), never raise the budget.
    new_imports: []
  - file: scripts/checks/roadmap/_plan_critique_end.py
    action: Create
    purpose: >-
      Holds the critique-ended rule so its own mirror test covers every branch (the _plan_rescout_wiring pattern;
      test_validate_plan_documents.py is at 498 of 500 SLOC). ended(critique, schema_version) -> bool: at 7 and above
      the series ends when the last plan-critique row is a PROCEED whose every nit is applied-wording or build-note
      (rule 5's text; a disputed or fixed nit on the last PROCEED needs the next round), or a PROCEED that follows a PROCEED listing nits (the current Step 9
      confirming round stays a valid ending until rec-5528 rewrites Step 9), or the last row carries escalation_choice
      accept-with-deferral (deliberately narrower than rec-5527's "an operator escalation answer": re-scope, split,
      abandon and one more round continue or end the plan, never pass it).
      Below 7 the current rule, moved verbatim (confirming round after a PROCEED listing nits, or accept-with-deferral).
      gap_message(name) -> str: keeps verbatim the substrings test_validate_plan_documents.py pins ("must end with a
      plan-critique PROCEED that ends Step 9" and "or the confirming round after a PROCEED listing nits") and adds the
      v7 rule. Never raises at import.
    new_imports: []
  - file: scripts/checks/roadmap/validate_plan_documents.py
    action: Modify
    purpose: >-
      Branchless wiring only: _gate_round_gaps calls _plan_critique_end.ended(critique, doc.schema_version) and
      appends _plan_critique_end.gap_message(path.name); the local _critique_ended function is deleted (its only
      caller is _gate_round_gaps; the build greps for other callers and rewires any to the helper).
    new_imports: [scripts.checks.roadmap._plan_critique_end]
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Template only (file is at its 42,777 B prose budget): "schema_version: 6 # NEW plans: the newest version on
      main; versions 1-5 stay valid" becomes "schema_version: 7 ... versions 1-6 stay valid", and the gate_rounds row
      comment "# critique rows add blocking, nits, category_consistency (12p per drafted entry); escalated +
      escalation_choice when asked" becomes "# critique rows add blocking, nits, findings list, category_consistency
      (12p); escalated + escalation_choice when asked" (-3 B). The Step 9 convergence text is rec-5528's and stays
      untouched here.
    new_imports: []
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: Lower .claude/skills/planning/SKILL.md's budget to the measured size after the edit (a decrease, always allowed).
  - file: tests/test_plan_gate_rounds.py
    action: Modify
    purpose: >-
      Mirror test for plan_gate_rounds.py (validate_test_coverage's mapping): every CritiqueFinding and GateRound
      findings rule (wrong gate, duplicate id, count mismatch either way, each disposition per severity, deferred
      accepted only with accept-with-deferral, disputed nit accepted, subject with newline or over 200
      characters, empty list on a 0/0 row accepted) and version_errors at 6 and 7.
  - file: tests/roadmap/plan_document/test_gate_rounds.py
    action: Modify
    purpose: >-
      Mirror tests for plan_document.py: a v7 plan loads with findings; fails to load when a plan-critique row lacks
      findings or a plan-critique PROCEED row carries escalation_choice accept-with-deferral, and loads with an escalated
      re-scope PROCEED; a v6 plan with findings fails to load; handoff_policy
      required at v7.
  - file: tests/checks/roadmap/test__plan_critique_end.py
    action: Create
    purpose: >-
      Mirror test for _plan_critique_end.py, every branch of ended() at 6 and 7 (PROCEED with nits and no confirming
      round, confirming round, last REVISE, REVISE with accept-with-deferral) and gap_message naming the plan.
  - file: tests/checks/roadmap/test_validate_plan_documents_critique_findings.py
    action: Create
    purpose: >-
      rec-5527's acceptance file, routed through validate_plan_documents with a plans_dir fixture and
      GITHUB_EVENT_NAME=pull_request, stubbing the re-scout barrier and pinning status_diff_base and push_context_base
      as test_validate_plan_documents_latest_format.py does (a v7 added plan is above the fingerprint floor). Node test_v7_proceed_with_disposed_nits_ends_series (the rec's acceptance): a
      v7 plan ending on a PROCEED with build-note and applied-wording nits and no confirming round passes the gate.
      Also: a v7 plan whose last PROCEED has a fixed or disputed nit fails; a v7 confirming round after a PROCEED with nits
      passes; a v7 plan whose last row is a REVISE fails; a v7 escalated REVISE with accept-with-deferral and deferred
      blocking entries passes; a v6 plan keeps the old rule (PROCEED with nits and no confirming round fails, and the output carries the gap text
      "or the confirming round after a PROCEED listing nits", since an added v6 plan also fails the newest-version rule).
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      test_plan_template_records_gate_rounds_not_a_gates_line pins the template comment this plan rewrites; update the
      pinned string to the new comment (a changed assertion: record it as planned-change citing test_obligations[5] in this plan's
      weakening dispositions in the same PR, as validate_weakening_candidates asks).
  - file: tests/checks/roadmap/test_validate_plan_documents_latest_format.py
    action: Modify
    purpose: >-
      Fixture only: the shared _plan(version) helper adds findings to plan-critique rows only when version >= 7
      (mirroring its version >= 6 cites guard), matching their counts. No assertion is loosened.
  - file: tests/checks/roadmap/test__plan_rescout_wiring.py
    action: Modify
    purpose: >-
      Fixture only: _doc(6) hardcoded as the newest version becomes newest_schema_version(), so the bump does not
      break test_seam_names_are_used_and_the_barrier_is_called_with_seam_true and
      test_real_barrier_over_a_fixture_tree_fails_a_stale_row. No assertion is loosened.
  - file: tests/checks/roadmap/test_validate_plan_documents_scout_fingerprint.py
    action: Modify
    purpose: >-
      Fixture only: the default _plan(version=6) added plan tracks newest_schema_version(), and the shared helper adds
      findings to plan-critique rows only when version >= 7, so test_matching_row_passes_and_prints_the_counts and
      test_stale_row_fails_on_a_pull_request_and_locally stay green. No assertion is loosened.
bundled_recommendations: [rec-5527]
followon_recs: []
infrastructure_dependencies:
  - "None. No .tf file and no Lambda-packaged file is in scope."
acceptance_criteria:
  - A plan-critique gate row accepts a findings list whose blocking and nit entries match its counts, with blocking dispositions fixed, disputed or (only under accept-with-deferral) deferred and nit dispositions fixed, disputed, applied-wording or build-note, and refuses it on any other gate or with any mismatch.
  - A schema_version 7 plan fails to load when a plan-critique row lacks findings or a plan-critique PROCEED row carries escalation_choice accept-with-deferral; plans of versions 1-6 on main still load unchanged.
  - On the plan PR, a newly-added schema_version 7 plan passes the critique-ended gate on its first PROCEED whose nits are all applied-wording or build-note with no confirming round, and fails while its last PROCEED holds a fixed or disputed nit (a confirming round also still ends it), and fails when its last critique row is a REVISE without an accept-with-deferral answer.
  - The planning template declares schema_version 7 and names the findings list, within the prose budget.
  - rec-5527 closes through the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5527's acceptance through the check (red before, green after).
    command: bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_documents_critique_findings.py -q
    expected: The tests pass; before the build the file does not exist and the findings field is absent.
    fix_if: A failure names the rule; fix the code, never the fixture's expectation.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: critique-findings-record
  - step: 2
    phase: pre-deploy
    action: Mirror tests and the existing plan, gate-row and skill-pin suites after the version bump.
    command: >-
      bin/venv-python -m pytest -q tests/test_plan_gate_rounds.py tests/roadmap/plan_document
      tests/checks/roadmap/test__plan_critique_end.py tests/checks/roadmap/test_validate_plan_documents.py
      tests/checks/roadmap/test_validate_plan_documents_latest_format.py tests/checks/roadmap/test__plan_rescout_barrier.py
      tests/checks/roadmap/test__plan_rescout_wiring.py tests/checks/roadmap/test_validate_plan_documents_scout_fingerprint.py
      tests/checks/roadmap/test_validate_plan_documents_category_verdicts.py tests/test_planning_skill_scout_fingerprint.py
      tests/test_plan_fingerprint.py tests/test_workflow_skill_antidrift.py
    expected: All selected tests pass.
    fix_if: Fix the code named by the failing test; a fixture may gain a findings list or track the newest version, never a loosened assertion.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      A regression sweep of suites that already run in --pre; VP 1's graduated node is the new standing guard.
  - step: 3
    phase: pre-deploy
    action: Every plan on main still loads (no historical plan is touched by the v7 rules).
    command: bin/venv-python -m scripts.roadmap.plan_document | grep -c '^FAIL' || true
    expected: Prints 0.
    fix_if: A FAIL line means a version-7 rule reached an older plan; fix the version gate.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Reads the live plan corpus, which grows with every merge; the version gate's tests in VP 1 are the standing guard.
  - step: 4
    phase: pre-deploy
    action: Full tier on the committed, rebased tree before handoff (handoff_policy).
    command: bin/venv-python -m scripts.validate
    expected: Exit 0; its verdict read with bin/venv-python -m scripts.checks.validation_result --verify-head.
    fix_if: Any failing check; fix it on the branch, never skip it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      recursion_refusal: the graduate partition refuses a step that invokes scripts.validate (vp-red-before.yaml).
  - step: 5
    phase: post-deploy
    action: rec-5527 reads back closed after the squash merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as rc; r,_=rc.fetch_recs_by_ids(rc.make_reader(),
      ['rec-5527']); print('REC', r[0]['id'], r[0]['status'])"
    expected: Prints REC rec-5527 closed.
    fix_if: Still open; run the git-ops.yaml resolves_trailer recovery route, never a manual status write.
    hermetic: false
test_obligations:
  - source: scripts/roadmap/plan_gate_rounds.py
    behavior: CritiqueFinding and GateRound findings rules; version_errors.
    verification_step: 2
    test_selector: tests/test_plan_gate_rounds.py
    red_green_expectation: red before (field and helper absent), green after.
  - source: scripts/roadmap/plan_document.py
    behavior: schema_version 7 accepted and the v7 gate-row rules raised at load.
    verification_step: 2
    test_selector: tests/roadmap/plan_document/test_gate_rounds.py
    red_green_expectation: red before (version 7 unsupported), green after.
  - source: scripts/checks/roadmap/_plan_critique_end.py
    behavior: v7 series ends on a PROCEED with disposed nits or accept-with-deferral; v6 rule unchanged.
    verification_step: 2
    test_selector: tests/checks/roadmap/test__plan_critique_end.py
    red_green_expectation: red before (module absent), green after.
  - source: scripts/checks/roadmap/validate_plan_documents.py
    behavior: the plan PR gate uses the version-aware rule.
    verification_step: 1
    test_selector: tests/checks/roadmap/test_validate_plan_documents_critique_findings.py
    red_green_expectation: red before (PROCEED with nits needs a confirming round), green after.
  - source: config/prose_budgets.yaml
    behavior: the planning SKILL.md entry equals its measured size after the edit.
    verification_step: 4
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      A budget number, not behaviour; validate_prose_limits in the full tier (VP 4) fails on any gap between the entry
      and the measured file size, so a dedicated test would restate that check.
  - source: .claude/skills/planning/SKILL.md
    behavior: template declares schema_version 7 and names the findings list.
    verification_step: 2
    test_selector: tests/test_workflow_skill_antidrift.py::test_plan_template_records_gate_rounds_not_a_gates_line
    red_green_expectation: red before (old comment), green after.
