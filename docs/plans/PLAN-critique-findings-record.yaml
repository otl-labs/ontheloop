gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:abea193ca5ac35214ecf584f29d0d62729023fe399d29b2bdb391068ef0e852c"}
  - {gate: plan-critique, round: 1, verdict: REVISE, blocking: 3, nits: 5} # B1 mirror-test coverage, B2 fixture rows, B3 deferred disposition: fixed; N1 prose budget, N2 docstrings, N3 forward intent wording, N4 build-note carrier: applied; N5 disputed nit: disputed (rule 5 fixes nit dispositions to applied-wording or build-note on a PROCEED)
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - scripts/roadmap/plan_gate_rounds.py -- CritiqueFinding, GateRound.findings and its row rules, version_errors.
  - scripts/roadmap/plan_document.py -- version 7 and the version_errors call.
  - .claude/skills/planning/SKILL.md and tests/test_workflow_skill_antidrift.py -- template lines and pin.
  - scripts/checks/roadmap/_plan_critique_end.py and the validate_plan_documents.py wiring.
  - config/prose_budgets.yaml -- lower the planning SKILL.md entry to its measured size.
  - tests -- mirror tests, the acceptance file, fixture-only updates named in scope.
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - 'Report: what was implemented, verification results'
rollback: Revert the squash commit; v7 plans added after it would need re-declaring as 6 without findings.
