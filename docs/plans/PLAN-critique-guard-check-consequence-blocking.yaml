schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "critique-guard-check-consequence-blocking"
intent: >-
  Make the plan critic, in both lanes (the in-session plan-critique skill and the plan_critic verdict persona), run a
  guard-input check from round 1 and grade each finding blocking by its consequence rather than its class
  (operator-approved standing rules 1 and 2 of 2026-11-23, audit #2387 findings PCL-01 and PCL-02, rec-5526). Fail-open
  guard holes should surface in round 1 instead of rounds 5-7, and findings that change nothing should stop forcing
  extra rounds; this is audit #2387's hypothesis, measured once rec-5527's per-finding gate rows exist (round of first
  appearance and blocking count per plan, read at rule 6's 20-plan revisit). Serves mission 3/5 (NS.4, NS.6, NS.9).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-critique-guard-check-consequence-blocking.yaml
phase: >-
  user_explicit_out_of_scope (operator ruling 2026-11-23 13:29 UTC approving the six plan-critique rules from audit
  #2387, audits/plan-critique-late-findings-ea25b5bb4; recs only, no roadmap item). Closes no tier_item criterion.
cites: [dec:75, dec:235, dec:279]
amends: []
introduces: []
closes_criteria: []
scope:
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Four rule edits and six relief edits, worded exactly as execution_steps[1] and [2] give them. Rule edits: (E1)
      Phase 1 intro drops the closure-steps completeness clause (PCL-02b); (E2) new item 5c, guard input check (rule
      1); (E3) new Phase 3 output line for 5c; (E4) the Finding-Origin severity clause becomes the consequence rule
      (rule 2), "when unsure" goes. Relief edits (operator direction 2026-11-23 13:49 UTC: find the bytes in less
      important areas and leave Phase 2b, the frame-lock analysis, untouched): (R1) drop the retired .md-plan fallbacks;
      (R2) merge item 12 (constraint contradictions) into item 6 and delete 12; (R3) drop "IMPLEMENTATION plans only"
      from item 11 and its output line; (R4) delete the retired 12d item (the plan schema enforces it); (R5) tighten
      12c's parenthetical; (R6) tighten 12o and the Quality Gate list without dropping a sub-check. Phase 2b (12e-12j)
      and the 12p. item stay byte-identical. The planner's scratch render of all ten edits measures 17,768 B against
      the 18,025 B budget.
    new_imports: []
  - file: docs/contracts/personas/plan_critic.yaml
    action: Modify
    purpose: >-
      Mirror E1, E2, E4, R2 and R3 in prompt_template so the persona lane stays comparable with the skill lane (its
      own comment: the bracketed ids keep the two lanes comparable): drop the closure-steps clause of the handoff
      sentence; add a "[step 5c]" paragraph after [step 5b]; fold "[step 12]" into "[step 6]" (decision and
      constraint conflicts) and delete [step 12]; drop "(IMPLEMENTATION only)" from [step 11]; replace the step 13
      sentence "A finding is blocking when it concerns correctness, safety, scope, a decision conflict or a failed
      check (and when unsure); a nit concerns wording, citation form or ordering, and a frame-challenge contradiction
      is never a nit." with the consequence rule. output_schema checks.check enum gains "5c" and loses "12".
      contract_version 2 -> 3 (a rendered byte change needs a raised version, executor-personas.yaml
      rendered_prompt.rule); rendered_prompt_sha256 set to the hash render --write prints.
    new_imports: []
  - file: docs/contracts/personas/rendered/plan_critic.txt
    action: Modify
    purpose: Regenerated by bin/venv-python -m scripts.persona_contracts.render --write plan_critic; never hand-edited.
    new_imports: []
  - file: tests/test_plan_critique_guard_consequence_rules.py
    action: Create
    purpose: >-
      rec-5526's acceptance file. Pins, in both the skill and the persona prompt_template: the 5c trigger list (hook,
      scripts/checks check, IAM or boundary statement, sandbox, governance cap), the five input forms, the live VP
      step identity-and-limits clause and "is blocking"; the three consequence branches (a), (b), (c) and the
      "what reaches main" / "which control fails first" clause; that "when unsure" appears in neither; that the
      closure-steps clause is gone from both; that the persona checks enum holds "5c"; and that the skill's Phase 3
      block carries the "**Guard Input Check (5c):**" line; that skill item 6 and persona [step 6] name constraint
      conflicts and neither has an item 12 / [step 12]; and that the skill's Phase 2b section (from "### Phase 2b" to
      "### Phase 3") is byte-identical to its text at the plan's merge base, pinned by a sha256 of that section held as
      a literal in the test (the frame-lock analysis is protected from size-relief edits). Each assertion normalises whitespace (the template wraps
      at 120 columns).
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      test_critic_tags_severity_and_states_figures_as_hypotheses pins the old severity clause ("blocking (correctness,
      safety, scope, a Decision conflict or failed check above; when unsure)" and "nit (wording, citation form,
      ordering; never a Frame Challenge contradiction)"); re-pin to the new clause's opening ("blocking only when the
      finding states what reaches main if left unfixed and which control fails first") and its frame-challenge
      sentence ("a Frame Challenge contradiction is never a nit"); every other assertion in it is kept.
  - file: tests/persona_contracts/test_verdict_persona_contracts.py
    action: Modify
    purpose: >-
      STEP_MAP["plan_critic"] gains "5c" (disposition "template") and loses "12" and "12d" (both deleted from the
      skill), so the skill/template step-id parity test holds.
  - file: tests/test_implementation_retrospective_skill_contract.py
    action: Modify
    purpose: >-
      test_planning_and_critique_lock_handoff_semantics asserts "real push/PR outcomes" in the critique skill, the
      clause E1 removes: replace that line with an assertion that the clause is absent (PCL-02b); the
      "mapped coverage or readiness as authoritative" assertion stays.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Lower .claude/skills/plan-critique/SKILL.md's budget to its measured size after the edit (a decrease, always
      allowed; keep the existing raise-approved marker text). If the measured size exceeds 18,025 B, stop and report;
      never raise, never touch Phase 2b.
bundled_recommendations: [rec-5526]
followon_recs: []
infrastructure_dependencies:
  - "None. No .tf file and no Lambda-packaged file is in scope."
acceptance_criteria:
  - The skill (step 5c) and the persona template ([step 5c]) both require, when a plan adds or changes a hook, a scripts/checks check, an IAM or boundary statement, a sandbox or a governance cap, a list of every guard input form with its outcome and each live VP step's identity and limits, and both make an unexamined path or an unrunnable live step blocking.
  - The skill and the persona template both grade a finding blocking only by consequence branches (a), (b) or (c), name what reaches main and which control fails first, and carry neither "when unsure" nor the closure-steps completeness clause.
  - The persona contract is at contract_version 3 with "5c" in and "12" out of its checks enum, its rendered prompt equals a fresh render, and the skill/template step-id parity test passes.
  - The plan-critique SKILL.md stays at or under 18,025 B with Phase 2b and the 12p. item byte-identical, item 12 merged into item 6, and its prose budget equal to its measured size.
  - rec-5526 closes through the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5526's acceptance (red before, green after).
    command: bin/venv-python -m pytest tests/test_plan_critique_guard_consequence_rules.py -q
    expected: All tests pass; before the build the file is absent and then fails on the base texts.
    fix_if: A failure names the missing or stale wording; fix the skill or template, never the test's expectation.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: critique-guard-consequence-rules
  - step: 2
    phase: pre-deploy
    action: Persona contract parity, render and the re-pinned antidrift and other skill-reading tests.
    command: >-
      bin/venv-python -m pytest -q tests/persona_contracts/ tests/test_workflow_skill_antidrift.py
      tests/test_planning_skill_split_test.py tests/test_serves_claim_verification.py
      tests/test_implementation_retrospective_skill_contract.py tests/test_deploy_paths_admin_procedure.py
    expected: All selected tests pass.
    fix_if: Fix the text or STEP_MAP named by the failing test; a render-hash failure means render --write was not re-run after the last template edit.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: critique-persona-skill-parity
  - step: 3
    phase: pre-deploy
    action: Rendered prompt equals a fresh render and the skill is within its prose budget.
    command: >-
      bin/venv-python -m scripts.persona_contracts.render --check && bin/venv-python -c "from
      scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f); print('PROSE_FAILED', len(f))"
    expected: Prints a RENDER-CHECK OK line, then PROSE_FAILED 0.
    fix_if: RENDER-CHECK FAIL -> re-run render --write plan_critic and update the sha; a prose failure -> set the budget to the measured bytes (over 18,025 B, stop and report).
    hermetic: true
    expected_literals: ["RENDER-CHECK OK", "PROSE_FAILED 0"]
    graduation: graduate
    graduation_check_id: critique-render-and-prose-budget
  - step: 4
    phase: pre-deploy
    action: Full tier on the committed, rebased tree before handoff (handoff_policy).
    command: bin/venv-python -m scripts.validate
    expected: Exit 0; its verdict read with bin/venv-python -m scripts.checks.validation_result --verify-head.
    fix_if: Any failing check; fix it on the branch, never skip it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      recursion_refusal: the graduate partition refuses a step that invokes scripts.validate (vp-red-before.yaml).
  - step: 5
    phase: post-deploy
    action: rec-5526 reads back closed after the squash merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as rc; r,_=rc.fetch_recs_by_ids(rc.make_reader(),
      ['rec-5526']); print('REC', r[0]['id'], r[0]['status'])"
    expected: Prints REC rec-5526 closed.
    fix_if: Still open; run the git-ops.yaml resolves_trailer recovery route, never a manual status write.
    hermetic: false
test_obligations:
  - source: .claude/skills/plan-critique/SKILL.md
    behavior: step 5c guard input check, consequence-based severity, no closure-steps clause, 5c output line.
    verification_step: 1
    test_selector: tests/test_plan_critique_guard_consequence_rules.py
    red_green_expectation: red before (file absent, then old wording), green after.
  - source: docs/contracts/personas/plan_critic.yaml
    behavior: template mirrors 5c and the consequence rule; checks enum holds 5c; step-id parity with the skill.
    verification_step: 2
    test_selector: tests/persona_contracts/test_verdict_persona_contracts.py
    red_green_expectation: red before (skill gains 5c with no [step 5c] in the template), green after.
  - source: docs/contracts/personas/rendered/plan_critic.txt
    behavior: equals a fresh render of contract_version 3 and hashes to rendered_prompt_sha256.
    verification_step: 3
    command: bin/venv-python -m scripts.persona_contracts.render --check
    red_green_expectation: red after a template edit without re-render, green after render --write.
  - source: config/prose_budgets.yaml
    behavior: plan-critique SKILL.md budget equals its measured size.
    verification_step: 3
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f);
      print('PROSE_FAILED', len(f))"
    waiver_reason: A budget value; validate_prose_limits (also inside validate --pre) is its guard.
