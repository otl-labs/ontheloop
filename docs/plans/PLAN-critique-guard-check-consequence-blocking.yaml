  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Write tests/test_plan_critique_guard_consequence_rules.py, update STEP_MAP (add "5c", drop "12" and "12d"; remove _OMITTED and the omitted branch only if nothing else uses them) and re-pin the antidrift and retrospective assertions; confirm VP 1 and VP 2 fail on the base (red before).
  - |-
    Apply the skill edits with exactly these words.
    E1: delete " and its closure steps must distinguish readiness states, parent validator evidence, structured postflight evidence, and real push/PR outcomes" (the sentence keeps its final period).
    E2, inserted as its own paragraph after item 5b and before "### Phase 2: Strategic Analysis":
    "5c. **Guard input check (PCL-01, from round 1):** if the plan adds or changes a hook, a `scripts/checks` check, an IAM or boundary statement, a sandbox or a governance cap, list every input form the guard decides on (unknown, malformed, substituted, grouped or indirect, a present key with a bad value) with its outcome, and for each live VP step the identity and limits it runs under. A path that passes unexamined, or a live step that cannot run as written, is blocking."
    E3, a new Phase 3 output line before "**Closure Obligation (12k)":
    "**Guard Input Check (5c):** N/A -- no guard in scope / each input form -> outcome; each live VP step -> identity, limits / REVISE -- [unexamined path or unrunnable step]"
    E4, replacing "blocking (correctness, safety, scope, a Decision conflict or failed check above; when unsure) or nit (wording, citation form, ordering; never a Frame Challenge contradiction);" in the Finding-Origin line:
    "blocking only when the finding states what reaches main if left unfixed and which control fails first, and (a) wrong behaviour, a wrong guarantee or a wrong operator-read instruction would reach main, or the first control that could catch it runs only after merge; (b) the build could not finish inside the plan's scope, approved text or VP commands without a plan amendment; or (c) it needs an operator decision. A check above that says REVISE or FAIL raises a finding this rule grades; 5c and 12p findings stay blocking. Every other finding is a nit carried to the build as a note (closure-step restatement of the build skill is never blocking); a Frame Challenge contradiction is never a nit;"
  - |-
    Apply the relief edits with exactly these words (old -> new; each old string occurs once).
    R1: "Challenge plans independently; accept deprecated `.md` inputs." -> "Challenge plans independently."; item 1 "Read the ENTIRE plan file provided by the caller -- never default to `docs/plans/PLAN.md`. Absent a path, use the newest `PLAN-*.yaml` in `docs/plans/` (fall back to `PLAN-*.md` only if none exists, and note the deprecation)." -> "Read the ENTIRE plan file provided by the caller; absent a path, use the newest `PLAN-*.yaml` in `docs/plans/`."; delete " (the `## Scope` table in legacy .md plans)" from item 5.
    R2: item 6 becomes "6. **Check for decision and constraint conflicts:** Does the plan, its Constraints included, contradict or re-decide anything resolved in `docs/DECISIONS.md` or a rule in `docs/PROJECT_CONTEXT.md`? Cite the decision or rule and the conflicting plan section."; delete item 12 ("12. **Check Constraints for contradictions:** ...") and its following blank line.
    R3: "11. **Check Acceptance Criteria (IMPLEMENTATION plans only):**" -> "11. **Check Acceptance Criteria:**"; "**Acceptance Criteria Issues (IMPLEMENTATION only):**" -> "**Acceptance Criteria Issues:**".
    R4: delete the item "12d. **Retired (Decision 247):** ..." and its following blank line.
    R5: in 12c, " (the `PlanDocument` schema rejects empty commands; your job is to judge whether the command actually exercises the feature rather than being a structural-only check). FAIL if any VP step is prose-only with no executable command." -> "; judge whether it exercises the feature rather than checking structure. FAIL any prose-only step."
    R6: item 12o (heading line, three bullets and closing line) becomes one paragraph: "12o. **Graduation-classification honesty (T3.21, VF-05):** each `phase: pre-deploy` VP step's `graduation` (three-way classification: docs/contracts/vp-red-before.yaml) is REVISE-worthy when **missing** (exempt only for a pre-T3.21 plan declaring no disposition anywhere); **suspect `not-applicable`** on a plainly single command_exit_zero / grep_count / file_presence / test_selector / command_output_matches / metric_under_threshold shape (`scripts.verification_checks.CANONICAL_SLOTS`), the gaming shape, since `not-applicable` carries no registry obligation; or a **thin waiver** whose `graduation_waiver_reason` is generic ("not needed", "skip", "later") rather than a concrete reason. Cite the step and sub-check; else report "graduation dispositions complete and honest."". The Quality Gate section body becomes: "Before output, confirm you read EVERY scope file (not just .md), can cite line numbers for the call sites and mocks your findings name, and your Files Read count matches the scope entry count; else read the missing files first."
    Never edit Phase 2b (12e-12j) or the 12p. item.
  - Mirror E1, E2, E4, R2 and R3 in plan_critic.yaml prompt_template (plain persona prose, step marker "[step 5c]", wrapped at 120 columns), add "5c" to and remove "12" from the checks enum, raise contract_version to 3, run bin/venv-python -m scripts.persona_contracts.render --write plan_critic and set rendered_prompt_sha256 to the printed hash.
  - Lower the plan-critique SKILL.md entry in config/prose_budgets.yaml to its measured byte size.
  - Execute the Verification Plan -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
  - "Report: what was implemented, verification results"
