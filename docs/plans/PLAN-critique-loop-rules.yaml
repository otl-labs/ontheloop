schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "critique-loop-rules"
intent: >-
  Make the planning skill's critique loop stop at the first PROCEED with no confirming round, send material nits to
  the build as notes that /implement reads, escalate on serial discovery (a third blocking finding on one plan row,
  or a REVISE at round 6), and revisit these rules after 20 plans carry finding lists (operator-approved plan-critique
  rules 3, 4 and 6, 2026-11-23, audit #2387 finding PCL-05). Serves NS.6: planning stops paying for confirming
  rounds without letting unread nit edits reach a merged plan.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-critique-loop-rules.yaml
phase: >-
  user_explicit_out_of_scope (operator remit 2026-11-23: the six plan-critique rules from audit #2387,
  audits/plan-critique-late-findings-ea25b5bb4; recs only, no roadmap item). Closes no tier_item criterion.
cites: [dec:235]
amends: []
introduces: []
closes_criteria: []
scope:
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Critique Gate (Step 9) section only, exact replacements (each old string occurs once on main 64eec17c); the
      Report Critique Gate (Step 10) keeps its confirming round (rule 3 covers the plan loop; a report has no build to
      carry notes). (1) Example prompt body: insert "Give each finding a short unique id. " before "Return the
      skill's structured critique output verbatim". (2) Convergence rule: "Fix every finding, record one disposition
      each (fixed, or disputed with evidence -- re-measure a figure before applying it), and run `bin/venv-python -m
      scripts.validate --pre` before EVERY re-dispatch (a pre-check; Decision 73 makes `--pre` authoritative only via
      PR CI). REVISE -> re-dispatch. Clean PROCEED -> done. PROCEED listing nits -> apply them and dispatch ONE fresh
      confirming round, no card; it ends the loop unless it returns a blocking finding (its own nits are applied, not
      re-read). Write each round to `gate_rounds`." becomes "On REVISE fix every finding, record one disposition each
      (fixed, or disputed with evidence -- re-measure a figure before applying it), run `bin/venv-python -m
      scripts.validate --pre` (advisory, Decision 73) and re-dispatch. The first PROCEED ends the loop, no confirming
      round: apply a nit that changes only wording, citation or ordering (applied-wording); every other nit (a scope
      file, a command, a selector, an expected literal, a number or more) is never edited in unread but recorded
      build-note, its subject the instruction /implement reads. Write each round to `gate_rounds` with its findings
      list." (3) Escalate triggers: "(oscillation interrupts, not the count); a disputed blocking finding;" becomes
      "(oscillation interrupts, not the count); a third blocking finding on one plan row (the anchor's top-level
      element) or sidecar block, or a REVISE at round 6, in one series; a disputed blocking finding;" (an escalation
      answer starts a new series per the existing re-escalation clause, so round numbers restart). (4) "your
      recommendation; and, when re-escalating," becomes "your recommendation (one more round when plan-critique 5c
      applies); and, when re-escalating,". (5) "Revisit when 20 plans carry `gate_rounds`: did a confirming round
      ever find a blocking finding, and were findings after round 5 real?" becomes "Revisit when 20 plans carry
      findings lists: a 5c-class finding first raised at round 4 or later, or a plan amendment caused by a build-note
      nit, reopens this rule and plan-critique's blocking rule." Byte trims to stay inside the budget: (6) "Fresh
      context is non-negotiable: it removes the author's bias. Do NOT invoke the `plan-critique` skill in the current
      session via the `Skill` tool (same context = same bias). Never use `scripts.agent_development.run_skill`
      (broken, rec-568)." becomes "Fresh context removes the author's bias: never invoke `plan-critique` here via the
      `Skill` tool, nor `run_skill` (rec-568)."; (7) delete the two lines "Read the critique output returned by the
      subagent." and "If it suggests revisions, update the plan with these fixes and re-launch the same subagent
      invocation against the revised plan. Each Agent call is a fresh window, so the re-launch genuinely
      re-evaluates." (the Convergence rule already says it). Net -23 B against main's 42,774 B (measured on a scratch
      copy); no other line changes.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: Lower .claude/skills/planning/SKILL.md's entry to the file's measured size after the edit (a decrease).
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Step 9 only: "a PROCEED that lists nits gets them applied and ONE fresh confirming round, with no card." becomes
      "the first PROCEED ends the loop with no confirming round, its wording nits applied and its other nits recorded
      as build notes; after applying them, recompute `plan_fingerprint` and re-run the Decision Scout if it moved."
      The escalation parenthesis "(an oscillation interrupt, a disputed blocking finding, or a fix that changes
      approved scope, tier or a cited Decision)" becomes "(an oscillation interrupt, a third blocking finding on one
      plan row or sidecar block or a REVISE at round 6 in one series, a disputed blocking finding, or a fix that
      changes approved scope, tier or a cited Decision)". The escalation menu stays verbatim (pinned by two tests).
  - file: .claude/commands/implement.md
    action: Modify
    purpose: >-
      Step 2, after "Extract Intent, Plan Type, Verification Tier, Execution Steps, Verification Plan, and
      Constraints.": add one paragraph: "Build notes: each `findings` entry with `disposition: build-note` on any
      `gate: plan-critique` row of `gate_rounds` is a build instruction (its `subject`, at its `anchor`). Apply it
      inside the plan's scope, approved text and VP commands; one that cannot be applied there is skipped and named in
      the handoff, and becomes a plan defect for the planner (amendment) only when the build cannot finish without
      it." Lives in the command, not the implement skill (that skill is at its 33,207 B budget; commands are
      measured-only, Decision 127).
  - file: docs/contracts/overseer-dispatch.yaml
    action: Modify
    purpose: >-
      plan-critique trampoline_sequence item "4. On a PROCEED that ends the planning skill's Step 9 loop": "(no nits,
      or the confirming round's)" becomes "(the first PROCEED, its nits disposed)" and "On REVISE, or any other
      PROCEED listing nits: the subagent fixes and re-requests" (raw text breaks the line after "On"; match the raw
      text) becomes "On REVISE: the subagent fixes and re-requests". Add one terse amendment_log row at the top of the
      list (validate_contract_drift requires it): {date: <build date>, semantic_break: false, change_class: field_add,
      summary: "PLAN-critique-loop-rules (rec-5528): plan-critique stage item 4 ends on the first PROCEED with its
      nits disposed; no confirming round."} Keeps the retiring overseer contract from contradicting Step 9.
  - file: tests/test_planning_skill_convergence_rules.py
    action: Create
    purpose: >-
      rec-5528's acceptance, pinned text read with whitespace collapsed; the Step 9 slice is from "**Convergence rule
      -- findings, not rounds:**\n\nEvery round" to "## Report Critique Gate". Nodes:
      test_first_proceed_ends_the_loop_with_nit_dispositions (the Step 9 slice carries "The first PROCEED ends the
      loop, no confirming round", "(applied-wording)", "every other nit (a scope file, a command, a selector, an
      expected literal, a number or more) is never edited in unread but recorded build-note, its subject the
      instruction /implement reads", and no "confirming round" other than "no confirming round");
      test_serial_discovery_and_round_six_escalate ("a third blocking finding on one plan row (the anchor's top-level
      element) or sidecar block, or a REVISE at round 6, in one series", "(one more round when plan-critique 5c
      applies)"); test_revisit_clause_counts_finding_lists (new clause present, "did a confirming round ever find"
      absent); test_critique_dispatch_asks_for_finding_ids ("Give each finding a short unique id." inside the Example
      prompt body); test_plan_command_and_dispatch_contract_mirror_the_first_proceed_rule (plan.md Step 9 and
      overseer-dispatch.yaml carry the new text, plan.md the re-scout clause, and neither a "confirming round"
      ending); test_implement_reads_build_notes (implement.md Step 2 carries "`disposition: build-note`", "any `gate:
      plan-critique` row", "skipped and named in the handoff" and "only when the build cannot finish without it").
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      Re-pin the strings this plan rewrites: test_critique_gate_convergence_is_finding_shaped (drop the two
      confirming-round asserts; assert "The first PROCEED ends the loop, no confirming round"),
      test_oscillation_revisit_condition_is_countable ("Revisit when 20 plans carry findings lists"),
      test_plan_command_and_overseer_contract_defer_to_the_skill_rule (the plan.md and overseer-dispatch.yaml strings
      above). Each is a planned-change weakening disposition citing its test_obligations row.
bundled_recommendations: [rec-5528]
implementation_declared: true
followon_recs: []
infrastructure_dependencies:
  - "None. No .tf file and no Lambda-packaged file is in scope."
acceptance_criteria:
  - The planning skill's Step 9 (not the Step 10 report gate) ends the critique loop at the first PROCEED with no confirming round, applies only wording, citation or ordering nits, and records every other nit as build-note with its subject as the instruction.
  - Step 9 escalates on a third blocking finding on one plan row (the anchor's top-level element) or sidecar block, or a REVISE at round 6, in one series, recommending one more round when plan-critique 5c applies.
  - The revisit clause counts plans with finding lists and names its two reopening triggers.
  - /implement reads every plan-critique row's build-note findings as build instructions inside the plan's scope, skipping and naming in the handoff one that does not fit, and amends only when the build cannot finish without it.
  - plan.md and overseer-dispatch.yaml no longer describe a confirming-round ending; plan.md re-scouts after applying ending-PROCEED nits when the fingerprint moved.
  - The planning skill stays within its prose budget (validate_prose_limits green).
  - rec-5528 closes through the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5528's acceptance nodes (red before, green after).
    command: >-
      bin/venv-python -m pytest -q
      tests/test_planning_skill_convergence_rules.py::test_first_proceed_ends_the_loop_with_nit_dispositions
      tests/test_planning_skill_convergence_rules.py::test_serial_discovery_and_round_six_escalate
      tests/test_planning_skill_convergence_rules.py::test_revisit_clause_counts_finding_lists
      tests/test_planning_skill_convergence_rules.py::test_critique_dispatch_asks_for_finding_ids
      tests/test_planning_skill_convergence_rules.py::test_plan_command_and_dispatch_contract_mirror_the_first_proceed_rule
      tests/test_planning_skill_convergence_rules.py::test_implement_reads_build_notes
    expected: Six tests pass; before the build the file does not exist.
    fix_if: A failure names the missing text; fix the surface, never the pinned string.
    hermetic: true
    expected_literals: ["6 passed"]
    graduation: graduate
    graduation_check_id: planning-skill-convergence-rules
  - step: 2
    phase: pre-deploy
    action: Existing skill and command pin suites after the rewrite.
    command: >-
      bin/venv-python -m pytest -q tests/test_workflow_skill_antidrift.py tests/test_project_alignment_contract.py
      tests/test_planning_skill_scout_fingerprint.py tests/test_planning_skill_split_test.py
      tests/test_planning_skill_start_order.py tests/test_implement_skill_decomposition_hints.py
    expected: All selected tests pass.
    fix_if: Re-pin only a string this plan rewrote (scope row for test_workflow_skill_antidrift.py); restore any other text.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      A regression sweep of suites that already run in --pre; VP 1's graduated nodes are the new standing guard.
  - step: 3
    phase: pre-deploy
    action: Full tier on the committed, rebased tree before handoff (handoff_policy); covers validate_prose_limits.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0; its verdict read with bin/venv-python -m scripts.checks.validation_result --verify-head.
    fix_if: Any failing check; fix it on the branch, never skip it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      recursion_refusal: the graduate partition refuses a step that invokes scripts.validate (vp-red-before.yaml).
  - step: 4
    phase: post-deploy
    action: rec-5528 reads back closed after the squash merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as rc; r,_=rc.fetch_recs_by_ids(rc.make_reader(),
      ['rec-5528']); print('REC', r[0]['id'], r[0]['status'])"
    expected: Prints REC rec-5528 closed.
    fix_if: Still open; run the git-ops.yaml resolves_trailer recovery route, never a manual status write.
    hermetic: false
