acceptance_criteria:
  - >-
    plan-critique tags every finding blocking or nit beside its origin tag and anchor, a Frame Challenge contradiction is
    never a nit, REVISE means at least one blocking finding, and measured figures are stated as hypotheses the reviser
    re-measures (rec-3742); the 600KB literal is gone (rec-2775). The planning skill spells the consult `model: "fable"` only (rec-3520), its
    stray-paren gates string is gone (rec-2480), and it stays under rec-3518's 55,485 B line. VP steps 1 and 6.
  - >-
    planning Step 9: every round a full fresh read with no count cap; a PROCEED listing nits gets the nits applied and
    ONE dispatched fresh confirming round with no card; escalation only on recurrence, a disputed blocking finding or a
    change to approved scope, tier or a cited Decision; an open escalation is a stop and its answer is recorded;
    carriers named for both dispatch modes, including the Fable consult, and overseer-dispatch.yaml's
    gate_request_trampoline.escalation key receives a dispatched escalation by relaying it to the human without
    dispatching a round (rec-2802, rec-3515; the overseer skill's matching text is deferred to rec-4774); the 20-plan revisit
    counts gate_rounds (rec-3514); the antidrift test pins all of it (rec-3517). VP step 1.
  - >-
    The Decision Scout gate's convergence rule is finding-shaped, anchored on the BLOCKing decision id, with no count
    cap; "findings, not rounds" appears at least three times (rec-3526). VP step 1.
  - >-
    plan.md Step 9 and overseer-dispatch.yaml restate no round cap and defer to the skill (the contract opens the plan
    PR only on a PROCEED that ends the Step 9 loop), plan.md Step 8 no longer
    requires the gates line, and the alignment-contract sweep and menu pins stay green. VP steps 1 and 3.
  - >-
    PlanDocument accepts a gate_rounds list with the GateRound rules in scope, and the template carries it in place of
    the free-text gates line (rec-3041). VP steps 1 and 2.
  - >-
    validate_plan_documents fails a newly-added v5 plan on its plan PR whose gate_rounds has no decision-scout row, ends
    neither in a plan-critique PROCEED that ends Step 9 (no nits, or the confirming round after a PROCEED listing nits)
    nor in an escalation answered accept-with-deferral, or has an unanswered escalation; it warns locally and on the push to main, and ignores
    existing plans. VP step 2.
  - >-
    Neither skill grows: planning <= 43,522 B and plan-critique <= 18,684 B, both under their unchanged budgets;
    plan_document.py <= 500 SLOC; every graduated registry guard on the scope files, whatever its slot, still passes. VP steps 4 and 5.
  - Every bundled rec's own acceptance command exits 0 (VP step 6), and each is closed after merge (VP step 9).
