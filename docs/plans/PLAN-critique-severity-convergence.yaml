weakening_dispositions: []
constraints:
  - >-
    The skill, command and contract text in execution_steps[1]-[3] is the operator-approved text (alignment sign-off
    2026-10-30): apply it verbatim. A change to it, beyond a compaction that keeps every pinned literal, goes back to the
    operator before merge.
  - >-
    No prose budget changes in config/prose_budgets.yaml (another wave-1 plan lowers the AGENTS.md entry there); both
    skills must end no larger than on main (Decision 127).
  - >-
    gate_rounds is a planner-reported, counts-only record: never an approval or plan-status input, and never per-finding
    rows (Decision 87 as amended by 205; T4.29 c2, rec-4434). The plan-PR check enforces only that the record is
    complete (Decision 163); approval stays the human's alignment sign-off and the merge rule.
  - >-
    Verdicts stay PROCEED | REVISE: docs/contracts/overseer-dispatch.yaml's trampoline parses only those. The confirming
    round is always a dispatched fresh subagent or a GATE_REQUEST, never inline (Decision 229 cl.2).
  - No rescue agents or workaround loops (Decision 55).
context:
