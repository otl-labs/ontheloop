schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "critique-severity-convergence"
intent: >-
  Make plan critique converge without operator cards while every round stays a full fresh read and no count caps the
  rounds: the critic tags each finding blocking or nit, a nits-only round is applied and re-read once by a dispatched
  fresh critic, the human is asked only on a recurring finding, a disputed blocking finding or a change to approved
  scope, an open escalation stops the thread, and every gate round is recorded in a typed `gate_rounds` field the
  plan-PR check holds new plans to. Removes operator load and adds measurement (joint review J-01; operator ruling
  2026-10-29 "measure twice, cut once": no critique round is cut).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-critique-severity-convergence.yaml
implementation_declared: true
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Workflow
  methodology from the Project Review joint review (area A); closes no roadmap criterion. T4.29 (plan_critic persona)
  is RELATED: its c5 flip inherits this rule unchanged, and gate_rounds stays at round grain (per-finding rows are
  rec-4434's, T4.29 c2).
closes_criteria: []
scope:
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Decision Scout convergence rule rewritten finding-shaped (rec-3526, rec-2802); NO_FLAGS bullet's free-text gates
      restatement dropped and a gate_rounds pointer added to the Verdict-handling lead-in (rec-3041); template gates line replaced by the gate_rounds field;
      Step 9 convergence rule rewritten (severity, nits get ONE dispatched confirming round, escalation triggers, open
      escalation is a stop, countable revisit, consult carrier; rec-3514, rec-3515); Step 9's "Loop if REVISE. Proceed if PROCEED." defers to the
      rule; the template example row is a decision-scout row; Step 10 mirror line, and a duplicate rationale sentence in
      Step 10 item 7 dropped (its anti-pattern bullet keeps the point). Exact text in execution_steps[1]. Measured on the
      dry build: 43,522 -> 43,483 B (budget 44,097, Decision 127; no raise).
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Severity tags (blocking/nit beside the existing origin tag; a Frame Challenge contradiction is never a nit) under a label that keeps
      "Finding-Origin Attribution", which the graduated guard plan-obligations-critic-consumes-report asserts;
      Recommendation semantics (REVISE iff a blocking finding), step 14 figures-as-hypotheses (rec-3742); funded by
      four compactions and the rotting 600KB literal (rec-2775). Exact text in execution_steps[2]. Measured: 18,684 ->
      18,663 B (budget 18,693).
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Step 9 summary sentence re-pointed at the new rule (the round-4 wording goes); keeps the verbatim escalation menu
      and the split gloss that tests/test_project_alignment_contract.py pins. "Proceed on PROCEED" becomes "Proceed on a PROCEED that ends the loop". Step 8's
      context-block discipline stops requiring the free-text gates line (its history moves to gate_rounds; no dual record). S3, measured only
      (Decision 127).
  - file: docs/contracts/overseer-dispatch.yaml
    action: Modify
    purpose: >-
      The two trampoline_sequence lines that restate a retired 3-round cap defer to the planning skill's rules, and
      plan-critique flow 4 opens the PR only on a PROCEED that ends the Step 9 loop; a new
      gate_request_trampoline.escalation key gives a dispatched escalation and its Fable consult a receiver that relays
      to the human, dispatches no round, is write-ahead-recorded like project-alignment and is re-relayed (never re-dispatched)
      on resume (rec-2802, rec-3515); the stale `round` gloss goes; one amendment_log row
      (field_add, Decision 168 Class D). 492 -> 498 effective lines against the 500 contracts-class limit (Decision 166). Never writes the retired label "Step 6a" (tests/test_project_alignment_contract.py sweep).
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      GateRound model and optional PlanDocument.gate_rounds: gate enum decision-scout | plan-critique (report-critique is
      left out: Step 10 runs two parallel critics per round, which 1..N numbering cannot hold), verdict per gate, plan-critique REVISE iff
      blocking > 0, escalation_choice only on an escalated row (the five-choice menu), rounds numbered 1..N per gate,
      schema_version >= 5. Planner-reported counts only, never a status or approval input (Decision 87 as amended by
      205). 450 -> 486 SLOC on the dry build (unregistered; 500 limit, Decision 128 -- decompose if it crosses).
  - file: scripts/checks/roadmap/validate_plan_documents.py
    action: Modify
    purpose: >-
      Newly-added schema_version >= 5 plans must carry a gate_rounds record with a decision-scout row, whose last
      plan-critique row is a PROCEED that ends Step 9 (no nits, or the confirming round after a PROCEED listing nits)
      or an escalation answered accept-with-deferral, with every escalated row answered: FAIL only on the plan PR (GITHUB_EVENT_NAME == "pull_request"; the PR opens
      only after PROCEED), WARN elsewhere -- in a local run (the planner runs --pre between rounds, before the record can
      be complete) and on the push to main (a plan PR that went green before this check existed must not turn main red;
      push runs diff the merge, so the plan counts as added there). Decision 163 structural enforcement. 130 -> 162 SLOC.
  - file: tests/roadmap/plan_document/test_gate_rounds.py
    action: Create
    purpose: Schema obligations for GateRound and gate_rounds.
  - file: tests/checks/roadmap/test_validate_plan_documents.py
    action: Modify
    purpose: >-
      TestGateRoundRecord (fail on the plan PR; warn, even with CI=true, when GITHUB_EVENT_NAME is unset, push or any
      other event; no scout row, a PROCEED listing nits with no confirming round, answered escalation then a confirmed
      PROCEED, accepted deferral, existing plans exempt); the two added-plan fixtures that
      assert a clean pass gain a complete gate_rounds record so the fixtures reflect a complete record.
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      Pins every clause above on the skill, command and contract surfaces, including the contract's escalation receiver
      (rec-3517: the convergence clauses get the
      standing assertions PR #1050 claimed), including the rec-3514 and rec-3515 node names their acceptance runs.
