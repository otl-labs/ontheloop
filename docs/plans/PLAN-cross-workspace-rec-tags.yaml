  - "docs/contracts/ops_recommendations.yaml: the tags.semantics re-point and its amendment_log row, as scope[1] says."
  - "tests/checks/contracts/test_coordinator_contract.py: the acceptance node, as scope[2] says."
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55).
  - "Commit with the Resolves trailer for rec-5711; run VP 4; push, open the PR, merge on green; run VP 5 and VP 6."
  - >-
    After VP 5 and VP 6 pass, post one comment on the coordinator log issue #1963 (operator ask 2026-11-27 11:18 UTC)
    with mcp__github__add_issue_comment, first line "Agents in GitHub | <UTC timestamp>", ending with the repo's
    comment footer. It says: from now on rec claims, handoffs and offers between workspaces are tag moves on the recs
    themselves (overlap found with recs_related) under docs/contracts/coordinator.yaml cross_workspace (makeshift until rec-5713 lands ownership on the
    T4.23 work-item tables), and this issue keeps only notices that are not about a rec; more detail in
    docs/plans/PLAN-cross-workspace-rec-tags.yaml, rec-5711 (this change, with its reasoning), rec-5712 (ci-rca
    tagging, next) and rec-5713, rec-5714, rec-5715 (the deferred design); each workspace should tag the open recs
    it owns and read its own with recs_by_tag. It allocates the four workspaces' tags, the only workspaces for now
    (the operator adds any others ad hoc): Agents in GitHub = ws-agents-in-github, CI Reform = ws-ci-reform,
    Feedback Loop = ws-feedback-loop, Decision Growth = ws-decision-growth. No ids, emails or account numbers.
    Report the returned comment id as the read-back.
