schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "cross-workspace-rec-tags"
intent: >-
  Makeshift, by operator ruling 2026-11-27 (rec-5711): give coordinators of different workspaces one shared,
  filterable way to claim, hand over and offer recs, using one tag per workspace on the rec and the recs_by_tag
  read, so the public issue log stops being the cross-project coordinator log. The rules live in the coordinator
  contract because that file's shared copy is the only repo text a coordinator can read.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-cross-workspace-rec-tags.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5711 (Medium, S), an interim standing in for T4.23 c6 (work_items) and c20 (work_item_notes) until rec-5713
  lands ownership on the work-item tables (Decision 197). Closes no roadmap criterion.
closes_criteria: []
cites: [dec:65, dec:197, dec:229, dec:279]
amends: []
introduces: []
scope:
  - file: docs/contracts/coordinator.yaml
    action: Modify
    purpose: >-
      rec-5711. (1) terms gains workspace: one coordinator's scope of work, its coordinator and workers, named by
      the standing instructions' Workspace line; "project" means a repository elsewhere (Decision 240 glossary,
      ops_projects.yaml). (2) A new top-level key cross_workspace, outside the approval-gated keys (Decision 279;
      docs/contracts/approval-routing.yaml lists lifecycle, routing, standing_authorisation, always_ask, approvals,
      halts), holding agent instructions only, no deployment data: makeshift (interim, do not harden it; successor
      rec-5713 on the T4.23 work-item tables, Decision 197 cl.3 and cl.8; reasoning on rec-5711); tag (a
      workspace's tag is ws- plus its Workspace name in lower kebab case, for example ws-docs-team; it marks
      ownership only, and dispatch stays operator-chosen, Decision 229 cl.1); tags_only (every move below is a
      tags edit and nothing else: never write ownership into context or file, whose rules in ops_recommendations.yaml
      reserve them for the rec's own problem and probe surface; who moved a tag and when comes from the rec_history
      read); edit (read the rec, then write its whole tags list with only your change, because update_rec replaces
      the list); claim (add your tag, then read the rec back once; another workspace's tag already there means it is
      theirs); offer (add the receiver's tag and the tag offered, keeping your own, so you stay owner until it is
      taken; ci-rca, which owns nothing, adds only the receiver's tag and offered); take (the receiver removes offered
      and the offerer's tag); decline (the receiver removes its own tag and offered); read (a worker runs recs_by_tag
      with all seven params, empty strings for unused filters and max_rows set, for its tag, newest first; status
      all with since_ts for a catch-up window; tag offered finds offers awaiting an answer; context and history come
      from recs_by_ids and rec_history); overlap (before starting a claimed rec, run recs_related over the plan's
      scope files to find other workspaces' recs on the same files); non_rec_notices (an outage or other notice not about a rec goes to the notice channel the standing
      instructions name); limits (tags are checked by eye, two simultaneous claims can overwrite each other, hence
      the read-back, and nothing checks the moves; the write-time rule is rec-5713's); see
      docs/contracts/read-engine.yaml#read_surface.named_verbs.verbs.ops_recommendations. (3)
      coordinator_operations.other_coordinators gains one clause: rec claims, handoffs and offers between
      workspaces follow cross_workspace. (4) One terse amendment_log row (field_add, semantic_break false, summary
      of 160 characters or fewer; Decision 275/282 compaction selects nothing today). About +25 lines.
  - file: docs/contracts/ops_recommendations.yaml
    action: Modify
    purpose: >-
      tags.semantics is stale since rec-5700 (it says no NAMED_READS verb reads tags). Re-point it (Decision 65):
      recs_by_tag reads tags, and ws- tags carry the coordinator contract's cross_workspace convention; still no
      vocabulary enforced at write time. One tags.amendment_log row (prose_improvement, semantic_break false). No
      rule, dq_intent or projection change. NEAR_CAP (551 of 556 effective lines on main 2026-11-27): the re-point is
      in place and the row is one flow-style line, net +1; the build re-measures against main and, if over, compacts
      one older amendment_log row to a terse row (relief valve), never a raise. The dated decided_action in
      config/agent/data_quality/decisions/ops_recommendations.yaml that repeats the old claim is a historical record
      and stays unedited.
  - file: tests/checks/contracts/test_coordinator_contract.py
    action: Modify
    purpose: >-
      rec-5711's acceptance node test_cross_workspace_key_lists_tags_and_marks_makeshift: cross_workspace carries
      makeshift naming rec-5713 and Decision 197; tag names the ws- prefix, and every ws- example token in it
      matches ^[a-z][a-z0-9-]*$ (the rec tags rule in ops_recommendations.yaml); tags_only, edit, claim, offer, take,
      decline, read, overlap, non_rec_notices and limits are non-empty strings; limits names rec-5713; terms carries workspace;
      cross_workspace is not in approval-routing.yaml's gated list for coordinator.yaml; tags_only forbids context
      and file writes and names rec_history; coordinator_operations.other_coordinators names cross_workspace;
      ops_recommendations.yaml tags.semantics names recs_by_tag and no longer says no NAMED_READS verb. The existing see-pointer
      and no-ids nodes cover the new key unchanged. About +20 SLOC.
bundled_recommendations: [rec-5711]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - rec-5711's acceptance node passes (VP 1) and the coordinator and rec contract suites still pass (VP 2).
  - The shared copy matches main after merge (VP 5) and rec-5711 is closed (VP 6).
  - The full tier passes on the build head (VP 4).
  - >-
    The migration notice with the four tag allocations is posted on issue #1963; its read-back is the comment id the
    post returns (execution step), reported in the build report.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5711's acceptance node.
    command: bin/venv-python -m pytest -q tests/checks/contracts/test_coordinator_contract.py::test_cross_workspace_key_lists_tags_and_marks_makeshift
    expected: exit 0. Red before (cross_workspace is absent on main).
    fix_if: Fix the contract text, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: coordinator-cross-workspace-key
  - step: 2
    phase: pre-deploy
    action: The coordinator and rec contract suites.
    command: >-
      bin/venv-python -m pytest -q tests/checks/contracts/test_coordinator_contract.py
      tests/checks/contracts/test_approval_routing_contract.py tests/checks/contracts/test_coordinator_harness_profile.py
      tests/checks/contracts/test_coordinator_playbook_kit.py tests/test_session_coordinator_copy.py &&
      bin/venv-python -m scripts.validate --pre
    expected: exit 0; every test passes (the count is not pinned) and the fast tier is green.
    fix_if: Fix the contract text, never an assertion.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-suite re-run of existing nodes plus the fast tier; VP 1 carries the one new node.
  - step: 3
    phase: pre-deploy
    action: Lint and format the test file.
    command: >-
      bin/venv-python -m ruff check tests/checks/contracts/test_coordinator_contract.py &&
      bin/venv-python -m ruff format --check tests/checks/contracts/test_coordinator_contract.py
    expected: exit 0.
    fix_if: Apply ruff's fix.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Style lint only; it makes no behaviour claim to graduate.
  - step: 4
    phase: pre-deploy
    action: >-
      Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy).
      Launch it from the top-level session as a Bash call with run_in_background true and timeout 7200000, the
      validate command itself, no shell detachment; say it started and end the turn.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 5
    phase: post-deploy
    action: Refresh the shared copy from main and check it (coordinator.yaml surfaces.delivery).
    command: >-
      git fetch -q origin main &&
      bin/venv-python -m scripts.session.coordinator_copy write /mnt/project-files/coordinator/ &&
      bin/venv-python -m scripts.session.coordinator_copy check /mnt/project-files/coordinator/
    expected: exit 0; the check reports the copy current at the merge commit.
    fix_if: Re-run write; never hand-edit the copy.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: rec-5711 closed by the merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      print(make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5711')[0]['status'])"
    expected: closed
    fix_if: >-
      Check the squash body carries the Resolves trailer for rec-5711 and the closure job's run.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/contracts/coordinator.yaml
    behavior: cross_workspace stays marked makeshift with its successor rec, and its tag rule yields valid rec tags.
    verification_step: 1
    test_selector: tests/checks/contracts/test_coordinator_contract.py::test_cross_workspace_key_lists_tags_and_marks_makeshift
    red_green_expectation: red before, green after
  - source: docs/contracts/ops_recommendations.yaml
    behavior: tags.semantics names its reader recs_by_tag and drops the stale no-verb claim.
    verification_step: 1
    test_selector: tests/checks/contracts/test_coordinator_contract.py::test_cross_workspace_key_lists_tags_and_marks_makeshift
    red_green_expectation: red before, green after
constraints:
  - Makeshift and minimal (operator 2026-11-27). No portal, writer, schema or reader change; no tag check in code.
  - No deployment data (workspace names or tags) in the shipped contract (Decision 196, Decision 224); the tag is derived from the standing instructions' Workspace line.
  - No edit to the approval-gated keys of coordinator.yaml (Decision 279), so no approved-text sidecar; the CI notice line still posts on merge.
  - No rescue agents or workaround loops (Decision 55).
