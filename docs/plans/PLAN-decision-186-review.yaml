  - "No rule of Decision 186 changes: no predicate, bound status, waiver category, fix-commit binding or category pattern is touched (Decision 186 point 8)."
  - "No assertion is loosened (Decision 235); the size check's amendment-delta WARN line for Decision 186 is expected and never silenced."
