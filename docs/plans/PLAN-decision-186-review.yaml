schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-186-review"
intent: >-
  Dispose of Decision 186's reversal review (due 2026-12-07) so the closure-time artifact gate is kept on measured
  evidence and its five conditions stay ones a review can check: record the keep verdict with the measurements, point
  (c) at the job that now catches refusals, give (d) and (e) checkable wording (reading (e) from regression_of, which
  back_validation cannot see), and carry (a), (b) and (e)'s measurement recipe until predicates are registered.
plan_type: IMPLEMENTATION
verification_tier: V1
implementation_declared: true
plan_path: docs/plans/PLAN-decision-186-review.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5421
  (Medium), the Decision 186 reversal review. Closes no roadmap criterion.
cites: [dec:186, dec:177, dec:201, dec:246, dec:279]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the two blocks of docs/plans/approved/decision-186-review.yaml: Decision 186's reversal stanza interior
      (Decision 177 clause 4) and one dated Update note after the entry's last line (amendment_forms blockquote_update),
      {{DATE}} filled with the build date (UTC). Nothing else. docs/decisions-index.json is regenerated by
      `bin/venv-python -m scripts.decisions_index --write` (generator-touched, no row).
bundled_recommendations: [rec-5421]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - docs/DECISIONS.md equals main's text with the two approved sidecar blocks applied and {{DATE}} filled (scripts.roadmap.approved_text verify exits 0 with the digest in VP 1).
  - The condition monitor reads Decision 186 as not-due with review_by 2027-03-07 and the five condition ids unchanged and in order; every stanza well-formed.
  - rec-5421's acceptance command exits 0, and after merge rec-5421 is closed with a resolution naming this plan.
  - docs/decisions-index.json is fresh (validate_decisions_index_freshness passes).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed Decision text is exactly the approved text.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-186-review --expect
      b878a502be5d3c9c1b3baeab43a24a2b5e9cd9b07e5521e84cc0489f3cd5881b  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier (git-ops.yaml
      merge_step_coverage).
  - step: 2
    phase: pre-deploy
    action: Prove the condition monitor reads the re-armed stanza as decided, every stanza well-formed.
    command: >-
      bin/venv-python -c "from scripts.preflight.decision_conditions import evaluate;
      r={str(x.decision_id): x for x in evaluate(gate=True)};
      assert all(x.state != 'MALFORMED' for x in r.values()), [x.decision_id for x in r.values() if x.state == 'MALFORMED'];
      d=r['186']; ids=[c.id for c in d.conditions];
      assert (d.state, d.review_by) == ('not-due', '2027-03-07'), (d.state, d.review_by);
      assert ids == ['waiver-majority', 'sweep-launders', 'refused-then-swept', 'client-side-bypass',
      'artifact-did-not-discriminate'], ids; print('STANZA_186_OK')"
    expected: Prints the marker and exits 0.
    expected_literals: [STANZA_186_OK]
    fix_if: >-
      A MALFORMED stanza or a different date or condition list -- the sidecar was applied wrongly; re-apply it. Never
      edit the expected values here.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim: the date changes at the next review, and validate_reversal_stanzas already guards well-formedness
      in both tiers.
  - step: 3
    phase: pre-deploy
    action: Run rec-5421's own acceptance command, plus the old review date's absence.
    command: >-
      test "$(grep -c 'Decision 186 review verdict' docs/DECISIONS.md)" -ge 1
      && ! awk '/^## Decision 186:/{f=1;print;next} /^## Decision /{f=0} f' docs/DECISIONS.md | grep -q 'review_by: 2026-12-07'
      && echo REC_5421_ACCEPT_OK
    expected: Prints the marker and exits 0.
    expected_literals: [REC_5421_ACCEPT_OK]
    fix_if: The verdict note or the stanza block was not applied.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Moment claim tied to this review date; the merge step runs the rec's own acceptance.
  - step: 4
    phase: pre-deploy
    action: Prove the generated index matches the edited corpus.
    command: bin/venv-python -m scripts.decisions_index --check
    expected: Exit 0 (index fresh).
    fix_if: Stale -- run `bin/venv-python -m scripts.decisions_index --write` and commit the index.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_decisions_index_freshness, which runs in both tiers.
  - step: 5
    phase: pre-deploy
    action: >-
      Fast and full tiers before handoff; the full tier runs backgrounded (2 h limit) from the top-level session, never
      in the 10-minute foreground.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and validation_result verifies the head sha. The full tier is started in the background with a
      2 h limit from the top-level session; its verdict is --verify-head's, never a pipe's exit status. An
      amendment-delta WARN line for Decision 186 is expected.
    fix_if: >-
      A failure caused by this diff is fixed on the branch. A failure that reproduces on origin/main: the build stops
      BLOCKED (handoff_policy timeout_disposition blocked; red-main-recovery.yaml slo_clock), cites or files its rec,
      surfaces a go/no-go to the operator per the implement skill, and never pushes or opens the PR without a passing
      --verify-head.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: Prove rec-5421 closed after the merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5421']); print(rows[0]['status'], rows[0]['resolution'])"
    expected: Prints closed and a resolution naming PLAN-decision-186-review and the merge SHA.
    fix_if: Still open -- run the merge_step recover route in git-ops.yaml merge_step_coverage; never close it by hand without the merge SHA.
    hermetic: false
test_obligations: []
