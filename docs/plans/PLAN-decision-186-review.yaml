pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (177, 186, 201, 246, 279)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - "Start condition: this plan and its sidecar merged with the approved-text run approved; no other unbuilt plan's sidecar binds the same lines (check plan_obligations)."
execution_steps:
  - "Apply the two sidecar blocks to docs/DECISIONS.md verbatim, {{DATE}} = build date (UTC). Post: VP 1-3 pass."
  - "Regenerate docs/decisions-index.json (`bin/venv-python -m scripts.decisions_index --write`). Post: VP 4 passes."
  - "Execute Verification Plan before CLOSURE: run VP 1-4 (pre-deploy) on the edited tree; loop until pass; on an unrecoverable failure stop and RCA (Decision 55). VP 5 runs inside CLOSURE (e); VP 6 runs after merge."
  - "CLOSURE, each outcome reported separately (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence): (a) readiness: bin/venv-python -m scripts.session.github_readiness (unknown is never PASS); (b) set implementation_declared: true in this plan; (c) postflight evidence, before the commit: write a scratch JSON with the ten scripts.session.postflight_evidence.CATEGORIES keys and run bin/venv-python -m scripts.session.postflight --evidence <path>; (d) commit with `Resolves: rec-5421`; git fetch origin main && bin/venv-python -m scripts.session.rebase_resolve (git-ops.yaml rebase_phase_distinction.commit_flow_time); (e) parent-validator evidence: VP 5 on the committed clean tree, the full tier started in the background with a 2 h limit (--pre, full tier, validation_result --verify-head); (f) post the #1963 line, push, open the PR, CI green, merge (squash) under standing_authorisation, and report the PR number, CI conclusion and merge SHA as their own line, apart from VP 6."
  - "Report: what changed; (a) readiness, (c) the postflight result, (e) the --verify-head verdict and (f) PR, CI and merge SHA, each on its own line; then VP 6's line."
rollback: >-
  A revert PR restores the stanza and drops the note; the review then shows as due again on 2026-12-07.
