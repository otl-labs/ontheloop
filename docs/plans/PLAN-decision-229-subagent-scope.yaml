  - "Placement: after the 2026-10-31 Update note at the end of Decision 229 (the precedent; amendment_forms), not inside the numbered clause list; the note names cl.2 itself."
  - "Owning planning thread: 'Plan Decision 229 subagent clarification' (Project Review). Plan defects go to the coordinator, which forwards them here."
  - "Parallel plans also editing docs/DECISIONS.md: rec-4478 and rec-4823. This plan adds no Decision number, so merge-time renumbering does not touch it; a textual conflict is a rebase. plan_obligations also lists 7 unbuilt plans scoping docs/DECISIONS.md (aws-account-company-assignment, billing-shape-local, github-org-transfer-contract, telemetry-content-reader-lock, telemetry-owner-provisioning, trusted-plan-identity, work-graph-edge-model): whichever builds second rebases."
