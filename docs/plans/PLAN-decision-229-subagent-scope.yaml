  - "docs/contracts/coordinator.yaml: place sidecar blocks coordinator-structure and coordinator-amendment-log exactly, {{DATE}} = build date UTC."
  - "tests/checks/contracts/test_coordinator_contract.py: add the test named in scope; confirm it fails against main's contract first."
  - "Execute Verification Plan steps 1-4; loop until pass; on an unrecoverable failure stop and send a plan-defect report (Decision 55)."
  - "Open the PR; squash-merge body carries 'Resolves: rec-4825'. After merge run steps 5-6."
  - "Report: what was implemented, verification results, merge SHA, copy header SHA."
