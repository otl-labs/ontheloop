schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-229-subagent-scope
intent: >-
  Make Decision 229 cl.2 ("Personas never invoke personas") say what the operator meant, so no session reads it as a
  ban on reviewer subagents: no session, worker or persona starts a planning or implementation agent of its own (the
  coordinator dispatches each), while the repo's in-session verdict gates and read-only advice consults stay allowed as
  subagents until each verdict persona flips (cl.4). The coordinator contract's worker rule says the same.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-229-subagent-scope.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4825,
  from the Project Review consult on repo hooks and Decision 229 (operator, 2026-11-02).
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly sidecar block decision-229-update (docs/plans/approved/decision-229-subagent-scope.yaml): a dated
      blockquote Update note appended to Decision 229 directly after its 2026-10-31 Update note. The note's date is the
      literal 2026-11-02 (the operator's clarification date), not the build date. No new Decision number.
  - file: docs/contracts/coordinator.yaml
    action: Modify
    purpose: >-
      Exactly sidecar blocks coordinator-structure (roles.structure rewritten) and coordinator-amendment-log (one new
      amendment_log row, {{DATE}} = build date UTC; required by the Class D drift rule
      scripts/checks/contracts/_population.py check_amendment_log_for_class_d).
  - file: tests/checks/contracts/test_coordinator_contract.py
    action: Modify
    purpose: >-
      Add test_structure_bars_nested_doing_agents_but_allows_gates: roles.structure (whitespace-normalised) contains
      "starts no planning or implementation agent of its own (Decision 229 cl.2)" and "may run the repo's verdict gates
      and advisor consults as subagents".
bundled_recommendations:
  - rec-4825
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The build tree holds exactly the sidecar's words in docs/DECISIONS.md and docs/contracts/coordinator.yaml (approved_text verify exits 0).
  - rec-4825's acceptance command exits 0.
  - The new coordinator contract test fails on main's contract and passes on the built one.
  - After merge, the shared coordinator copy is regenerated and coordinator_copy check exits 0.
  - rec-4825 reads closed after the squash merge (Resolves trailer).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Pin the new worker rule in the coordinator contract test.
    command: bin/venv-python -m pytest tests/checks/contracts/test_coordinator_contract.py::test_structure_bars_nested_doing_agents_but_allows_gates -q
    expected: exit 0, 1 passed
    fix_if: the node is missing (exit 4) or the assertion fails because roles.structure does not carry the sidecar words
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: >-
      The test node is itself the standing guard and runs in every --pre pytest selection that touches the contract; a
      registry row would duplicate it.
  - step: 2
    phase: pre-deploy
    action: Run rec-4825's own acceptance command.
    command: >-
      grep -c "operator clarification of cl.2's scope" docs/DECISIONS.md | grep -qx 1 && grep -q "starts no planning or
      implementation agent of its own" docs/contracts/coordinator.yaml
    expected: >-
      exit 0. This is rec-4825's own acceptance, kept verbatim; its coordinator.yaml leg matches the new amendment_log
      row, not the wrapped roles.structure rule, so step 1 and step 3 are the proof the rule landed.
    fix_if: the note is absent or duplicated in DECISIONS.md, or the contract line is missing
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      Step 1's test and the approved-text binding already guard these words; a grep registry row would be a third copy
      of the same check.
  - step: 3
    phase: pre-deploy
    action: Bind the edits to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-229-subagent-scope --base origin/main
    expected: exit 0; every block matches with only the {{DATE}} placeholder filled
    fix_if: any word differs from the sidecar; fix the edit, never the sidecar (the sidecar is operator-approved text)
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Fast tier, then the full tier before handoff (handoff_policy).
    command: >-
      bin/venv-python -m scripts.validate --pre; then, as its own backgrounded run (2 h limit), bin/venv-python -m
      scripts.validate; then bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      --pre exit 0; validation_result --verify-head exit 0 for HEAD (the verdict, never the backgrounded run's own exit
      status).
    fix_if: >-
      A failure in this plan's files: fix at root and rerun the full tier from the start; a Contract drift (amendment)
      failure means the amendment_log row is missing. A failure only in another open red's tests (for example rec-4797,
      owned outside this project) is not this build's to fix: log the deferral and wait per the implement skill's go/no-go.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: Regenerate the shared coordinator copy after merge (coordinator.yaml surfaces.delivery) and check it.
    command: >-
      git fetch origin main --quiet && bin/venv-python -m scripts.session.coordinator_copy write
      /mnt/project-files/coordinator/ && bin/venv-python -m scripts.session.coordinator_copy check
      /mnt/project-files/coordinator/
    expected: exit 0; the copy header names the merge commit
    fix_if: check exits 1 or 2; re-run write after a fresh fetch
    hermetic: false
  - step: 6
    phase: post-deploy
    action: Confirm rec-4825 closed.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      print(fetch_recs_by_ids(make_reader(), ['rec-4825'])[0][0]['status'])"
    expected: prints closed
    fix_if: still open after the closure job; read the ci.yml closure job log and close it through update_rec with the merge SHA
    hermetic: false
test_obligations:
  - source: docs/contracts/coordinator.yaml
    behavior: roles.structure bars a worker's own planning or implementation agents and allows verdict gates and advisor consults.
    verification_step: 1
    test_selector: tests/checks/contracts/test_coordinator_contract.py::test_structure_bars_nested_doing_agents_but_allows_gates
    red_green_expectation: red before (main says "no planning subagents"), green after.
constraints:
  - The DECISIONS.md and coordinator.yaml words are operator-approved; place them exactly (sidecar), never re-word. Any other change to Decision or contract text is always-ask.
  - No new numbered Decision; the note is amendment_forms blockquote_update on Decision 229.
  - No rescue agents or workaround loops (Decision 55).
