  - file: tests/checks/iam_tf/test_persona_verdict_role.py
    action: Modify
    purpose: >-
      Add a pure parser and evaluator and one node, test_pull_request_claims_fail_the_trust_conditions (rec-5558's
      acceptance). trust_conditions(role_text, oidc_text) reads the role's one StringEquals block with the module's
      existing helpers (_block, _jsonencode_statement_blocks, _block_body, _mask) into {claim key: allowed values}:
      aud and job_workflow_ref as their literals, sub expanded over every entry of local.github_repos read from
      terraform/personal/oidc.tf. trust_admits(claims, conditions) is true only when every condition key is present in
      the claims with an allowed value (StringEquals semantics). The node asserts: (a) control, so the test is not
      vacuous: for each repo entry, claims {aud sts.amazonaws.com, sub repo:<repo>:environment:persona-verdict,
      job_workflow_ref otl-labs/ontheloop/.github/workflows/persona-verdict.yml@refs/heads/main} are admitted; (b) for
      each repo entry and the plain otl-labs/ontheloop form, none of these is admitted: GitHub's pull_request claims
      (sub repo:<repo>:pull_request, job_workflow_ref persona-verdict.yml@refs/pull/1/merge); a pull_request job that
      names the Environment (the Environment sub with the refs/pull/1/merge ref); the Environment sub with another
      workflow at main (ci.yml@refs/heads/main); and the pull_request sub with the main ref; (c) red: a role text with
      "repo:${repo}:pull_request" added to the sub list and the job_workflow_ref literal changed to the refs/pull/1/merge
      ref admits the pull_request claims, and a role text with the job_workflow_ref line removed admits the
      Environment-sub-plus-refs/pull claims. Existing nodes and helpers are unchanged. The file is unregistered in
      config/sloc_budgets.yaml (500 cap); the addition keeps it under 500 SLOC (the build measures it, VP 2).
    new_imports: []
