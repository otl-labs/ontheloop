schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-append-only-census
intent: >-
  Give the Decision record's append-only dialect (Decision 177) a detector again, as a report rather than a merge gate
  (rec-5266, contract-first retrospective step 9). The census replays every main merge since the post-cleanse commit
  that touched the corpus files and applies Decision 177 clauses 1-4 with each merge's parent as baseline, so it sees a
  rewrite of a line added after any pin, which the audit's pin-to-today method could not. It runs on every push to main
  that touches the corpus, daily and on dispatch; a fast-tier WARN applies the same rule to a pull request's diff. A
  finding is cleared only by a post-hoc acknowledgement keyed to the merged commit and pointing at the dated annotation
  that disposes of it. The one finding on main today, #1568, is acknowledged and annotated forward.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-append-only-census.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5266
  (Low), contract-first retrospective improvement_sequence step 9, capacity wave of the Decision Growth itinerary.
  Closes no roadmap criterion.
closes_criteria: []
cites: [dec:177, dec:178, dec:246]
scope:
  - file: scripts/checks/decisions/_baseline.py
    action: Modify
    purpose: >-
      Add decision_bodies_at(root, rev) -> Optional[BaselineBodies]: the per-corpus-file {number -> heading-inclusive
      block} at any git revision through the same iter_decision_sections grammar, unmemoized; a corpus file absent at rev
      yields {} for that path; an unresolvable rev returns None. baseline_decision_bodies keeps its memo and its
      origin/main reachability sentinel and delegates its read to decision_bodies_at(root, "origin/main"), so its two
      --pre consumers see no change. No new first-party import.
    new_imports: []
  - file: scripts/checks/decisions/append_only_census.py
    action: Create
    purpose: >-
      (1) RULE. Re-lands the retired guard's comparison (validate_live_entry_immutability at a50ee8de, Decision 177
      cl.1-4) as compare(baseline_live, baseline_archive, current_live, current_archive) -> list of (decision, first
      unmatched baseline line): exact-line injective ordered embedding; a newly superseded body must match the strict
      stub shape; an archive move embeds with the header and Status exemptions; closed reversal-stanza interiors carved
      out with _FENCE_OPEN_RE/_FENCE_CLOSE_RE imported from scripts/preflight/decision_conditions.py, an unterminated
      fence exempting nothing; stanza existence locked; a number absent from both files flagged; a body already
      superseded at baseline skipped. (2) REPLAY. ANCHOR is a module constant,
      7b67e21d70f733f7137875195a16e71f59822a9c (Decision 178 cl.3, the post-cleanse corpus), never read from config.
      census(root, head) lists `git log --first-parent --reverse --format=%H ANCHOR..head -- docs/DECISIONS.md
      docs/DECISIONS_ARCHIVE.md` and compares each commit with its first parent through _baseline.decision_bodies_at. A
      finding is (merge sha, decision, digest, first unmatched line, PR number parsed from the subject's trailing
      '(#N)' when present); digest is the first 16 hex of sha256 over the parent's prepared block, a NUL line and the
      merge's prepared block. (3) LEDGER. Reads config/agent/decision_census.yaml rows {merge, decision, digest}. A row
      acknowledges a finding when all three match. A row that matches no finding (stale or never flagged), or whose
      decision body at head holds no line beginning '> **Update (' that contains the merge's first 8 hex characters
      (the disposition annotation), is a ledger defect. (4) SELF-TEST. Every run asserts that, with acknowledgements
      ignored, 660d5b54 is flagged for Decisions 65 and 210; if not, the detector is blind. (5) CLI. `python -m
      scripts.checks.decisions.append_only_census [--head REV] [--summary PATH]` prints one line per finding, then
      'CENSUS merges=<n> findings=<f> acknowledged=<a> open=<o> self_test=ok'; --summary appends the same as Markdown.
      Exit 0 when open is 0 and the ledger is clean; exit 1 on an open finding or a ledger defect; exit 2, never a pass,
      when the anchor is not an ancestor of head (a shallow clone), git fails or the self-test fails (Decision 55). (6)
      WARN CHECK. @registry.register("validate_decision_append_only") validate_decision_append_only(failed, root=None,
      baseline_body_reader=None): compare(origin/main baseline via _baseline.baseline_decision_bodies, working tree) and
      print one 'WARN:' line per flagged decision; it never appends to failed; advisory SKIP when origin/main is
      unreachable; registry.examined(n, unit="baseline_decision_bodies"). Under 500 SLOC.
    new_imports: [scripts.checks._common, scripts.checks.registry, scripts.checks.decisions._baseline, scripts.decisions_md, scripts.preflight.decision_conditions]
  - file: scripts/checks/decisions/_manifest.py
    action: Modify
    purpose: >-
      One Entry: name and attr validate_decision_append_only, module scripts.checks.decisions.append_only_census,
      pre=True, pre_globs (docs/DECISIONS.md, docs/DECISIONS_ARCHIVE.md, scripts/decisions_md.py,
      scripts/preflight/decision_conditions.py, scripts/checks/decisions/**, scripts/checks/_common.py,
      scripts/checks/registry.py), no full_segment: a WARN has no post-merge reader, and the census owns main.
  - file: tests/checks/decisions/test_append_only_census.py
    action: Create
    purpose: >-
      rec-5266's acceptance file. TestRule ports every classification case of the retired guard's tests (a50ee8de
      tests/checks/decisions/test_validate_live_entry_immutability.py, each FAIL paired with its nearest PASS, the
      fence-grammar agreement and unterminated-fence cases included; the no-waiver-vocabulary cases are not ported) onto
      compare. TestReplay (rec-5266's acceptance node) builds throwaway git repos with ANCHOR monkeypatched to their
      first commit: an append-only history gives open=0 and exit 0; an in-place rewrite of a line added by an earlier
      merge is flagged at the rewriting merge, with its digest and PR number, while a comparison of the anchor with head
      alone does not flag it; a matching ledger row plus its annotation acknowledges it (exit 0); the same row without
      the annotation, with a wrong digest, or naming an unflagged merge exits 1; an anchor that is not an ancestor exits
      2; the self-test exits 2 when the fixture is not flagged (ANCHOR and the fixture sha monkeypatched). TestWarnCheck
      runs validate_decision_append_only through an injected baseline reader: a rewritten ratified line prints WARN and
      leaves failed empty; an append-only edit prints no WARN; an unreachable baseline skips. TestWiring reads
      .github/workflows/decision-census.yml (triggers exactly push with the four paths, schedule and workflow_dispatch;
      no pull_request; permissions contents: read only; no id-token anywhere; checkout fetch-depth 0 and
      persist-credentials false; the run line invokes the module with --summary), config/ci_rca_taxonomy.yaml (the
      decision-census row is not_a_gate and excluded; function_to_category maps validate_decision_append_only), the
      decisions _manifest Entry (pre, no full_segment) and config/agent/decision_census.yaml (the two #1568 rows).
  - file: tests/checks/decisions/test__baseline.py
    action: Modify
    purpose: >-
      New cases for decision_bodies_at on the existing throwaway-repo helpers: bodies at a named older commit differ from
      HEAD's; an absent archive file yields {}; an unknown rev returns None. Existing cases unchanged, so the graduated
      shard decisions-baseline-reader-single-read is kept as is.
  - file: config/agent/decision_census.yaml
    action: Create
    purpose: >-
      The acknowledgement ledger. A header comment names Decision 177's 2026 Update from this plan as its rule: rows
      are post-hoc acknowledgements of merges already on main, one per (merge, decision), each with its digest, and each
      needs a dated annotation on that Decision naming the merge. Seeded with two rows, merge
      660d5b54cb841110a1ae375a66f26cd3bf67a50d (#1568) for Decisions 65 and 210, digests as the census prints them at
      build time.
  - file: .github/workflows/decision-census.yml
    action: Create
    purpose: >-
      Alarm, not gate (Decision 83 non-wedging). on: push to main with paths docs/DECISIONS.md,
      docs/DECISIONS_ARCHIVE.md, config/agent/decision_census.yaml and scripts/checks/decisions/append_only_census.py;
      schedule '43 11 * * *' (daily, the self-test heartbeat the liveness sensor watches); workflow_dispatch. Never
      pull_request; not a required check. concurrency group decision-census, cancel-in-progress false. permissions
      contents: read, no id-token; the dispatcher-bot refusal `if:` its peers carry. Steps: actions/checkout pinned as in
      backlog-health.yml with persist-credentials: false and fetch-depth: 0; setup-python 3.12 pinned the same way; pip
      install pyyaml (the module's whole dependency set, measured 2026-11-18); python -m
      scripts.checks.decisions.append_only_census --summary "$GITHUB_STEP_SUMMARY". Every remote uses: SHA-pinned with
      its version comment. Header comment: invariants, and that rec-5410 adds rec filing.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Two flow-style lines: workflows gains decision-census {tier: not_a_gate, ci_rca: excluded, owner: platform,
      rationale in the ghas-probe form: a red run is its own alarm and loop liveness backstops it, so a ci-rca watch would
      double-record and could halt work over a report}; function_to_category gains validate_decision_append_only:
      schema_drift beside validate_decisions_size. NEAR_CAP (492 of 500 effective lines at planning; 13 unbuilt plans
      scope it): re-measure at build; relief is flow-style compaction of existing rows in this file only, never a raise.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the three blocks of docs/plans/approved/decision-append-only-census.yaml, placeholders filled: a dated
      Update on Decision 210 and on Decision 65 (merge 660d5b54 shortened ratified text in place; where the original
      is; the shortened text stands, with two restorations on 210), and a dated Update on Decision 177 (the census is a
      report plus a fast-tier WARN; its ledger is post-hoc, not a waiver route). No clause changes; no other line moves.
      docs/decisions-index.json is regenerated (generator-touched).
bundled_recommendations: [rec-5266]
followon_recs: [rec-5410]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The census applies Decision 177 cl.1-4 to every corpus-touching main merge since 7b67e21d against its parent; on main
    it reports exactly the #1568 finding (Decisions 65 and 210), acknowledged, with open=0 and self_test=ok (VP 2), and
    with the ledger emptied it flags that merge and exits 1 (VP 3).
  - >-
    rec-5266's acceptance node passes (VP 1) and rec-5266 closes through the Resolves trailer (VP 8).
  - >-
    validate_decision_append_only runs in --pre on a corpus diff, WARNs on a rewritten ratified line and never fails a
    PR (VP 1).
  - >-
    docs/DECISIONS.md equals main's text with the sidecar's three blocks applied (VP 4), approved by Benjamin through an
    approved-text-approval run before the plan merges.
  - >-
    The workflow holds no credential, never gates a PR, and its first dispatched run on main is green with the CENSUS
    line in its summary (VP 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Rule, replay, ledger, self-test, exit codes, WARN check and wiring.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions/test_append_only_census.py tests/checks/decisions/test__baseline.py
      -q
    expected: Exit 0, every node passes. Red before (target_absent on the plan-only tree, Decision 189).
    expected_literals:
      - ' passed'
    fix_if: Fix the module, workflow or config; never weaken a ported guard case.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-append-only-census
  - step: 2
    phase: pre-deploy
    action: Live census over real main history, after the build's own DECISIONS.md commit.
    command: bin/venv-python -m scripts.checks.decisions.append_only_census --head HEAD
    expected: >-
      Exit 0; 'acknowledged=2 open=0 self_test=ok'; merges at least 146 (the count at planning time); the only findings
      named are 660d5b54 for Decisions 65 and 210.
    fix_if: >-
      Another finding: a merge after planning rewrote a ratified line, or the build's own annotations moved a line; stop
      and tell the coordinator, never add a ledger row unasked.
    hermetic: false
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: Red polarity on real history, ledger emptied in a scratch worktree.
    command: >-
      D="$(mktemp -d)" && git worktree add -q --detach "$D" HEAD && printf 'acknowledged: []\n' >
      "$D/config/agent/decision_census.yaml" && (cd "$D" && bin/venv-python -m scripts.checks.decisions.append_only_census
      --head HEAD); rc=$?; git worktree remove --force "$D"; test "$rc" = 1
    expected: Exit 0 (the census exited 1), its output naming 660d5b54 and Decisions 65 and 210.
    fix_if: The census passes with an empty ledger, so the replay misses an annotation-line rewrite. Fix the replay.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: The committed Decision text is exactly the approved text.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-append-only-census --expect <digest from the
      plan's last passing wording-check row>
    expected: Exit 0.
    fix_if: A difference is reported; restore the approved words. Any other change is an approved_text plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier (git-ops.yaml
      merge_step_coverage).
  - step: 5
    phase: pre-deploy
    action: rec-5266's acceptance is the node this plan creates, and passes.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader,
      fetch_recs_by_ids;rows,missing=fetch_recs_by_ids(make_reader(),['rec-5266']);a=rows[0];want='bin/venv-python -m
      pytest tests/checks/decisions/test_append_only_census.py::TestReplay -q';assert not missing and
      a['status']=='open' and a['acceptance'].strip()==want, a['acceptance'];print('REC_OK')" && bin/venv-python -m pytest
      tests/checks/decisions/test_append_only_census.py::TestReplay -q
    expected: REC_OK, then exit 0.
    fix_if: 'A reader refused by the proxy: stop and tell the coordinator; never work around it.'
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Fast tier, then the full tier on the committed, rebased tree, backgrounded with a 2 h limit.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: Exit 0 on a completed full run with the head verified; a timeout is not a pass.
    fix_if: Fix the named check at root cause; never raise a budget or skip a check.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
  - step: 7
    phase: post-deploy
    action: The merge's own push run, or one dispatch on main, reads green with the census line.
    command: >-
      Read the decision-census run for the merge commit (mcp__github__actions_list on the workflow, filtered to the merge
      sha), or dispatch it on main with mcp__github__actions_run_trigger; read it with mcp__github__actions_get and its
      log with mcp__github__get_job_logs.
    expected: Conclusion success; the log holds the CENSUS line with acknowledged=2 open=0 self_test=ok.
    fix_if: 'Red after a clean local run: check the checkout depth and Python version first; never add a ledger row to pass.'
    hermetic: false
  - step: 8
    phase: post-deploy
    action: 'After the squash merge carries "Resolves: rec-5266", the closure job closed it.'
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader,
      fetch_recs_by_ids;rows,missing=fetch_recs_by_ids(make_reader(),['rec-5266']);assert not missing and
      rows[0]['status']=='closed';print('REC_CLOSED')"
    expected: REC_CLOSED
    fix_if: Open after the closure job, so check the ci.yml closure job on the squash commit.
    hermetic: false
test_obligations:
  - source: scripts/checks/decisions/append_only_census.py
    behavior: Decision 177 cl.1-4 per merge since the anchor, ledger matching and annotation check, self-test, exit codes, WARN check.
    verification_step: 1
    test_selector: tests/checks/decisions/test_append_only_census.py
    red_green_expectation: red before (absent), green after
  - source: scripts/checks/decisions/_baseline.py
    behavior: decision_bodies_at reads any revision; baseline_decision_bodies unchanged.
    verification_step: 1
    test_selector: tests/checks/decisions/test__baseline.py
    red_green_expectation: red before (new cases fail on the missing function), green after
  - source: scripts/checks/decisions/_manifest.py
    behavior: validate_decision_append_only is a pre-only Entry.
    verification_step: 1
    test_selector: tests/checks/decisions/test_append_only_census.py::TestWiring
    red_green_expectation: red before (absent), green after
  - source: .github/workflows/decision-census.yml
    behavior: Push, daily and dispatch; credential-free; non-gating; full-history checkout; runs the census.
    verification_step: 1
    test_selector: tests/checks/decisions/test_append_only_census.py::TestWiring
    red_green_expectation: red before (absent), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: decision-census is not_a_gate and excluded; the WARN check has a category.
    verification_step: 1
    test_selector: tests/checks/decisions/test_append_only_census.py::TestWiring
    red_green_expectation: red before (rows absent), green after
  - source: config/agent/decision_census.yaml
    behavior: The two seeded rows acknowledge the one finding on main.
    verification_step: 2
    command: bin/venv-python -m scripts.checks.decisions.append_only_census --head HEAD
    red_green_expectation: red before (file absent), green after
constraints:
  - 'A report, not a merge gate: the WARN check never appends to failed; no full-tier membership; no required status check.'
  - 'The anchor is a code constant citing Decision 178 cl.3; config holds acknowledgements of merges already on main only.'
  - 'Decision text: exactly the approved sidecar blocks. No edit to docs/DECISIONS_ARCHIVE.md or docs/contracts/decision-entry.yaml.'
  - 'Public repository (Decision 101): output names commits, PR numbers, Decision numbers and line text already public.'
  - No rescue agents or workaround loops (Decision 55).
context:
  - >-
    Decision-scout r2: FLAGS_FOUND. NOTE 177 (cl.5 and its re-armed remedy: only the report-not-guard reading keeps a
    config-reading re-landing outside cl.5's letter; approving the 177 Update's words is that ruling; fallback if
    rejected: annotation-only acknowledgement with no ledger file, or a Decision amending cl.5). r1's NS.9 NOTE resolved by
    the approved-text run. CITE 177, 178, 246. RELATED 151, 163, 55, 83, 146, 149, 150, 167, 181, 61, 169, 170, 187, 132,
    189, 244, 72, 226, 128, 166, 210, 65, 268, 101, 75, 233, 235. Decisions triaged: 224 of 224. Roadmap items
    intersected: 6; CONFLICT: 0; RELATED: 6. Serves: NS.9 3/5.
  - >-
    Evidence (prototype, main 4bbb09b9, 2026-11-18): replaying the retired guard over 146 corpus-touching merges since
    7b67e21d takes 6.5 s and flags one merge, #1568 (660d5b54, 2026-10-18), which shortened in place Decision 210's
    2026-10-04 and 2026-10-15 amendment paragraphs and Decision 65's 2026-10-04 Update. Pin-to-today (the audit's
    method, rejected_candidates C6) finds nothing: the rewritten lines were added after the pin. Decision 210 went 6,102
    to 6,142 B in that merge, 2 B under the 6,144 cap (inferred incentive; the PR body does not say).
  - >-
    Design source: Benjamin asked (2026-11-18) for a blind Fable consult on industry practice and a plan on its advice.
    Brief and advice: /mnt/project-files/decision-growth/append-only-census/advisor-brief/{BRIEF,ADVICE}.md. Adopted:
    pairwise replay from a fixed anchor; accept #1568 and annotate forward; a SHA-and-digest-keyed post-hoc ledger
    whose rows must point at an annotation; push-plus-daily cadence; a fast-tier WARN; a self-test in place of the
    silence-based abort criterion; a dated annotation on Decision 177, no numbered Decision.
  - >-
    Planning-time split: rec-5410 makes the census file its own deduplicated rec per finding (the consult's alerting
    advice). It needs a new rec source, the regenerated field_semantics.yaml and a governed DuckLake redeploy (V3), so it
    is planned on its own. Until it lands, an open finding reds the workflow, the WARN shows on the PR that makes it, and
    loop liveness files a rec after a persistent red.
  - >-
    Sequencing: build after the D167 amendment build #2198 merges; it scopes _baseline.py, test__baseline.py,
    scripts/checks/decisions/*, config/ci_rca_taxonomy.yaml and docs/DECISIONS.md. docs/DECISIONS.md merges follow the
    Decision Growth merge_serial chain (reviews, delegation-and-cap, consolidation): whichever builds second rebases and
    re-anchors the sidecar (an anchor-only re-anchor keeps the approval).
  - 'LAMBDA-DEPLOY none: no scope file is in a Lambda manifest (compute_affected_artifacts at build).'
