  - {gate: decision-scout, round: 2, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:25455f1f4964691cef696b1b050e70de4899ff26f8c65fb17abb5050abd0e443"}  # pragma: allowlist secret
