pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - '#2198 merged; no open PR edits the scope files (list_pull_requests, files)'
execution_steps:
  - 1. Precondition, rebase onto main; #2198 merged; re-measure config/ci_rca_taxonomy.yaml headroom; VP 5's rec read.
  - 2. Tests red-first; then _baseline.decision_bodies_at; then the census module; VP 1 until green.
  - >-
    3. Apply the sidecar's three blocks to docs/DECISIONS.md with today's date, regenerate docs/decisions-index.json;
    write the ledger with the digests the census prints; workflow and taxonomy rows; VP 2, VP 3, VP 4.
  - >-
    4. Commit flow (implement skill; git-ops.yaml push_pr_ci_merge_flow): 'Resolves: rec-5266' in the squash body; VP 6
    before handoff; merge on green CI.
  - 5. After merge, VP 7 and VP 8. Report what was implemented, VP results, merge SHA and rec-5266's status.
rollback: >-
  Revert the squash commit. The three annotations then leave the record by a revert, which the census, if it stayed,
  would flag; a revert removes the census too.
