constraints:
  - 'Alarm, not gate (Decisions 55, 62, 83): nothing here blocks a merge; the workflow stays off required checks and pull_request.'
  - The credential lives only in the file-recs job; the census job and the merge-time WARN module stay credential-free and config-free.
  - A rec is never an acknowledgement; only a ledger row plus its annotation clears a finding (Decision 177). Closing a rec early re-files it.
  - No Decision text changes; no edit to docs/DECISIONS.md or the ledger.
  - 'The one loosened-looking edit is TestWiring''s whole-file id-token check becoming per-job checks plus an exact count (Decision 235 cl.1): the build makes it only as scoped above, never weaker.'
  - The census-run step stays one line; no baseline raise.
  - 'Public repository (Decision 101): rec text names commits, PR numbers, Decision numbers and line text already public; no account id or URL host beyond github.com.'
  - No rescue agents or workaround loops (Decision 55).
