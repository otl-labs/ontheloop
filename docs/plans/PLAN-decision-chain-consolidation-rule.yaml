schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-chain-consolidation-rule"
intent: >-
  Make retiring a long Decision amendment chain a standing, checked method (rec-5265): one new Decision amends
  Decision 149 so a consolidating entry may count a delegated value as restated, nominates any Decision at the
  consolidation threshold without forcing it, and requires a manifest that accounts for every paragraph of each
  retired entry; decision-compaction.yaml gains the consolidation key, the fast tier fails a manifest whose targets
  stop resolving, and planning names the candidates, so a reader needs one entry per subject instead of six to ten.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-chain-consolidation-rule.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5265
  (Low), the contract-first retrospective's optional step 8. Closes no roadmap criterion.
cites: [dec:149, dec:163, dec:167, dec:175, dec:177, dec:246, dec:276, dec:277]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Insert the rule's Decision (block DECISIONS-1) and add its dated amendment note to Decision 149 (block
      DECISIONS-149), exactly as the approved-text sidecar binds them.
  - file: docs/contracts/decision-compaction.yaml
    action: Modify
    purpose: >-
      Widen compaction.eligibility_criterion with delegation as subsumption, widen stub_grammar's Decision marker for
      the point map, add the consolidation key, bump contract_version and add a new amendment_log entry (blocks
      compaction-head, compaction-log, compaction-eligibility, compaction-stub-marker, consolidation-key), exactly as
      the sidecar binds them.
  - file: scripts/checks/decisions/consolidation.py
    action: Create
    purpose: >-
      Shared helpers: threshold read, live amender counts and candidates from the index, the paragraph partition of a
      victim body into unit ids, manifest load, manifest_problems (freeze against origin/main for a new manifest;
      victims compacted and pointing at the consolidating entry; every target, token and check resolving; point maps
      equal; origin/main text comes through an injected base reader, so the module imports no git helper),
      render_point_map and the nomination INFO and WARN line text.
    new_imports: [scripts.checks.decisions.envelope_rules, scripts.decisions_md]
  - file: scripts/checks/decisions/validate_delegated_key_changes.py
    action: Modify
    purpose: Append consolidation.manifest_problems to its failures, so a manifest target that stops resolving fails --pre.
    new_imports: [scripts.checks.decisions.consolidation]
  - file: scripts/checks/decisions/validate_supersession_annotations.py
    action: Modify
    purpose: Print the one aggregate nomination WARN line from consolidation.candidates; it never appends to failed.
    new_imports: [scripts.checks.decisions.consolidation]
  - file: scripts/roadmap/plan_decision_drafts.py
    action: Modify
    purpose: >-
      Add a nomination INFO line for each drafted entry that amends a candidate root, independent of serves; never a
      finding.
    new_imports: [scripts.checks.decisions.consolidation]
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      Add scripts/checks/decisions/consolidation.py to the pre_globs of validate_plan_documents and
      validate_plan_scope_closure, which reach plan_decision_drafts.py and so its new import.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: Add scripts/checks/decisions/consolidation.py to validate_admin_root_premerge_gate's pre_globs, for the same reason.
  - file: tests/checks/decisions/test_consolidating_entry.py
    action: Create
    purpose: >-
      rec-5265's acceptance (test_fixture_consolidation_is_accepted_and_each_defect_is_caught) plus partition, count,
      threshold-bounds, point-map and real-repository tests, and the three wiring tests: an unresolved manifest target
      fails validate_delegated_key_changes, the WARN line prints once without failing, and a drafted entry amending a
      candidate gets the INFO line and no finding. Kept in one new module because
      test_validate_supersession_annotations.py is at 450 of 500 SLOC.
bundled_recommendations: [rec-5265]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The committed Decision and contract text equal the approved sidecar (approved_text verify exits 0).
  - "rec-5265's acceptance node passes: a fixture consolidation is accepted and each seeded defect (missing or extra unit, unresolved key, absent token, absent stanza id, short retirement reason, unchecked text-bound key, victim not a stub, point-map mismatch, freeze mismatch) is reported."
  - A manifest whose target stops resolving fails validate_delegated_key_changes; with no manifests it passes unchanged.
  - A drafted entry amending a root at or over the threshold gets the nomination INFO line; the fast tier prints one aggregate WARN line and neither fails.
  - The new Decision amends 149 and delegates the threshold within bounds 3 to 9; the index is fresh; validate --pre and the full tier pass.
  - rec-5265 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed Decision and contract text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-chain-consolidation-rule --expect d64fd3ad002dc8a40fb2460ae5fa7a710367598fe3b4f4d244bb747be483aad0
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier (git-ops.yaml
      merge_step_coverage).
  - step: 2
    phase: pre-deploy
    action: Run the new module and the three test files the change edits.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions/test_consolidating_entry.py
      tests/checks/decisions/test_validate_delegated_key_changes.py
      tests/checks/decisions/test_validate_supersession_annotations.py tests/test_plan_decision_drafts.py
      tests/checks/roadmap/test__manifest.py tests/checks/verification/test__manifest.py -q
    expected: All tests pass, including test_fixture_consolidation_is_accepted_and_each_defect_is_caught; the existing files pass unchanged.
    fix_if: A seeded defect is not reported, or a clean fixture reports one -- fix consolidation.py, never the fixture.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The step runs this plan's own pytest modules, which the fast tier's affected-test selection runs on every PR
      touching the edited check modules or docs/DECISIONS.md.
  - step: 3
    phase: pre-deploy
    action: Exercise the nomination on the real index for a candidate root (Decision 126) and a non-candidate (Decision 277).
    command: >-
      bin/venv-python -c "import json;
      from pathlib import Path;
      from scripts.checks.decisions import consolidation as c;
      rows=json.load(open('docs/decisions-index.json'))['decisions']; th=c.load_threshold(Path('.'));
      hit=c.nomination_info('N', [126], rows, th); miss=c.nomination_info('N', [277], rows, th);
      assert hit and 'consolidation candidate' in ' '.join(hit), hit; assert not miss, miss;
      print('NOMINATION_OK', th)"
    expected: Exit 0 and the marker with threshold 5.
    expected_literals: [NOMINATION_OK]
    fix_if: No line for 126, or one for 277 -- the amends-edge count or the threshold read is wrong.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates test_amending_a_candidate_root_prints_nomination, which step 2 runs.
  - step: 4
    phase: pre-deploy
    action: Prove the fast-tier nomination WARN prints and never fails, and that manifests (none today) pass.
    command: >-
      bin/venv-python -c "import io, contextlib;
      from scripts.checks.decisions.validate_supersession_annotations import validate_supersession_annotations;
      from scripts.checks.decisions.validate_delegated_key_changes import validate_delegated_key_changes;
      buf=io.StringIO(); f=[]; g=[];
      with contextlib.redirect_stdout(buf): validate_supersession_annotations(f); validate_delegated_key_changes(g)
      ; out=buf.getvalue(); assert not f and not g, (f, g);
      assert sum('consolidation threshold' in ln and 'WARN' in ln for ln in out.splitlines()) == 1, out;
      print('WARN_LINE_OK')"
    expected: Exit 0 and the marker.
    expected_literals: [WARN_LINE_OK]
    fix_if: No WARN line, more than one, or a failure entry -- the aggregate line is wired wrong.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates test_consolidation_candidates_warn_once_and_never_fail, which step 2 runs.
  - step: 5
    phase: pre-deploy
    action: Prove the index is fresh and the new entry amends 149 and delegates the threshold within its bounds.
    command: >-
      bin/venv-python -m scripts.decisions_index --check && bin/venv-python -c "import yaml, re;
      from scripts.decisions_md import extract_entry_envelope, iter_decision_sections;
      t=open('docs/DECISIONS.md').read();
      new=[(int(m.group(1)), extract_entry_envelope(b)) for m, b in iter_decision_sections(t)
      if 'consolidation.threshold' in b and (extract_entry_envelope(b) or {}).get('amends') == [149]];
      assert len(new) == 1, new; env=new[0][1];
      d={x['key'].split('#')[1]: x for x in env['delegates']};
      assert d['consolidation.threshold']['bounds'] == {'min': 3, 'max': 9}, d;
      th=yaml.safe_load(open('docs/contracts/decision-compaction.yaml'))['consolidation']['threshold'];
      assert 3 <= th <= 9 and env['kind']['value'] == 'direction'; print('RULE_ENTRY_OK', new[0][0], th)"
    expected: Exit 0 and the marker with the entry's number and threshold 5.
    expected_literals: [RULE_ENTRY_OK]
    fix_if: The entry or the key is missing or malformed -- the sidecar was applied wrongly; re-apply it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_delegated_key_changes and test_threshold_is_delegated_within_bounds (step 2).
  - step: 6
    phase: pre-deploy
    action: Run rec-5265's acceptance exactly as the rec stores it.
    command: bin/venv-python -m pytest "tests/checks/decisions/test_consolidating_entry.py::test_fixture_consolidation_is_accepted_and_each_defect_is_caught" -q
    expected: 1 passed.
    fix_if: The node is missing or renamed -- keep the acceptance node name.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Step 2 runs the same node in the fast tier.
  - step: 7
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the full tier before handoff (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure -- fix in scope and re-run; a failure outside scope is a plan defect, never a handoff to PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: Prove the merge synced the new entry to ops_decisions and closed rec-5265.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json, re;
      t=open('docs/DECISIONS.md').read();
      n=int(re.search(r'^## Decision (\d+): A long amendment chain retires', t, re.M).group(1));
      rows={r['id']: r for r in map(json.loads, open('logs/.decisions-index.jsonl'))};
      assert rows[f'dec-{n:03d}']['status'] == 'Decided', rows.get(f'dec-{n:03d}'); print('OPS_DECISIONS_OK', n)"
      && bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5265']);
      assert rows and rows[0]['status'] == 'closed', rows; print('REC_5265_CLOSED')"
    expected: OPS_DECISIONS_OK and REC_5265_CLOSED.
    fix_if: >-
      The row is absent -- the rec-autoclose backfill step failed; read its run and re-run the backfill through the
      portal. rec-5265 open -- the Resolves trailer was missing; close it through update_rec with the merge sha.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/DECISIONS.md
    behavior: The rule's entry amends 149, delegates the threshold within 3 to 9 and fits the measured cap.
    verification_step: 2
    test_selector: tests/checks/decisions/test_consolidating_entry.py::test_threshold_is_delegated_within_bounds
    red_green_expectation: red before (no entry delegates consolidation.threshold), green after.
  - source: docs/contracts/decision-compaction.yaml
    behavior: consolidation.threshold sits inside the delegating entry's bounds and the manifest, abort and procedure keys exist.
    verification_step: 2
    test_selector: tests/checks/decisions/test_consolidating_entry.py::test_threshold_is_delegated_within_bounds
    red_green_expectation: red before (the consolidation key is absent), green after.
  - source: scripts/checks/decisions/consolidation.py
    behavior: A clean fixture consolidation passes and each seeded defect is reported.
    verification_step: 2
    test_selector: tests/checks/decisions/test_consolidating_entry.py::test_fixture_consolidation_is_accepted_and_each_defect_is_caught
    red_green_expectation: red before (the module does not exist), green after.
  - source: scripts/checks/decisions/validate_delegated_key_changes.py
    behavior: A manifest with an unresolved target fails the check.
    verification_step: 2
    test_selector: tests/checks/decisions/test_consolidating_entry.py::test_unresolved_manifest_target_fails_the_check
    red_green_expectation: red before (the check reads no manifest), green after.
  - source: scripts/checks/decisions/validate_supersession_annotations.py
    behavior: One aggregate nomination WARN line prints and nothing is appended to failed.
    verification_step: 2
    test_selector: tests/checks/decisions/test_consolidating_entry.py::test_consolidation_candidates_warn_once_and_never_fail
    red_green_expectation: red before (no such line), green after.
  - source: scripts/roadmap/plan_decision_drafts.py
    behavior: A drafted entry amending a candidate root yields the nomination INFO line and no finding.
    verification_step: 2
    test_selector: tests/checks/decisions/test_consolidating_entry.py::test_amending_a_candidate_root_prints_nomination
    red_green_expectation: red before (no nomination line), green after.
constraints:
  - Approved words are copied from docs/plans/approved/decision-chain-consolidation-rule.yaml verbatim; {{N}} and {{DATE}} are filled at build (Decision 217 cl.5).
  - Edits no Decision body other than the one dated note on Decision 149; Decision 277 and tests/checks/decisions/test_consolidation_decision_92.py stay as they are.
  - No hard fail on chain length (Decision 163); the nomination never files a rec.
  - consolidation.py, plan_decision_drafts.py and both checks stay under 500 SLOC; no budget raise.
  - No new validate.py Entry; validate_delegated_key_changes (pre, no pre_globs) carries the manifest check.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Operator: approach signed off 2026-11-19 (decision card \"Yes to all, write the plan\" and \"write the plan\" in this plan's thread). Ruling R1 (2026-11-17) is in rec-5265. Wording is approved through the sidecar's approval run (Decision 246), not by the sign-off."
  - "Evidence: /mnt/project-files/decision-growth/consolidation/general-rule/ (PRESENTATION.md, advisor-brief/ADVICE.md, SCOUT-r1.md, sidecar/gen_sidecar.py regenerates the sidecar from a tree). Pilot: PLAN-consolidate-decision-92-chain.yaml (#2252), build #2255 (ae78ae43), Decision 277."
  - "Advisor reconciliation: home, delegation conditions, nomination, manifest form, freeze and abort adopted; the advisor's earlier separate mechanism-move change adapted to the same change, because an earlier change copies text out of live entries (Decision 175 cl.3, scout r1 NOTE); always_ask vs change_rule precedence and a lighter path for tightening edits left to rec-5137."
  - "Decision-scout r1 FLAGS_FOUND (scratch draft); fingerprint v1:d999fd91bde81ee3ccf328f3433d0e875b0107aa240086ecca248d6780afbe79. Decisions triaged: 226 of 226. Roadmap items intersected: 5; CONFLICT: 0; RELATED: 5. Serves: NS.4 4/5 -- Reading one entry per subject instead of six to ten directly cuts agent retrieval cost, and the manifest keeps the result machine-checkable. CITE 149, 175, 276, 277, 177, 167, 246, 163. Flags: 276 SPIRIT WARN (consolidating entries' whole span in its excluded-blocks-absorb median) -> disputed: a median of 20 moves at most a rank or two per consolidation and consolidations run only when the operator names one; the sentence pre-judging that review was dropped from the draft and 276 is not amended (operator saw the dispute in the presentation). 175 SPIRIT NOTE (moving mechanism out of live entries) -> cl.6 and procedure step 2 move text only in the same change, from entries it supersedes; rec-3246 stays separate. 149 CITE (stub_grammar) -> block compaction-stub-marker widens the Decision marker for the point map. 168 RELATED -> the consolidation key is read by validate_delegated_key_changes, validate_supersession_annotations and plan_decision_drafts."
  - "Sidecar dry run on origin/main 20d11182 (N=278): all 7 blocks apply; validate_decision_entry_conformance, validate_decisions_size, validate_delegated_key_changes, validate_supersession_annotations (after block DECISIONS-149 added 149's forward pointer), validate_decision_currency, validate_decisions_index_freshness and the append-only rule pass. Draft measured 3,475 of 5,120 bytes (whole 6,202); review_by 2027-05-23 holds one other stanza."
  - "plan_obligations decision_drafts: three WARNs that consolidation.threshold, .manifest and .procedure do not resolve at head are expected; block consolidation-key adds them, and validate_delegated_key_changes passed on the applied tree."
  - "Dependency rec-3250 is open only for its index-size target; the part rec-5265 needs, skeleton rows for compacted stubs, merged in #2188."
  - "rec-5265's acceptance was a whole-file pytest the lint calls undecidable; it now names the node test_fixture_consolidation_is_accepted_and_each_defect_is_caught (update_rec 2026-11-19)."
  - "Gotchas: the partition leaves out the envelope fence, header, closing ---, blank lines and the Status, Date, Warehouse ID, Related and Superseded by markers; '<N> note <k>' counts annotation paragraphs in order. The freeze compares a manifest absent at origin/main with its victims' bodies at origin/main via _baseline.base_file_text; a manifest already on main is never re-partitioned. With no manifest under docs/decision-migration/consolidations/ (true at merge) manifest_problems returns [] without reading git."
  - "Shared files (plan_obligations): unbuilt plans also scope DECISIONS.md (several) and plan_decision_drafts.py (PLAN-wording-approval-routing, CI Reform); whichever builds second rebases and re-applies the sidecar anchors. T1.17 c4 owns validate_supersession_annotations' edge extraction; this plan only appends a print."
  - "Merge order: merge_serial with other DECISIONS.md builds (WORK-ORDER.md); post the #1963 entry before merge."
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:d999fd91bde81ee3ccf328f3433d0e875b0107aa240086ecca248d6780afbe79"}  # pragma: allowlist secret
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Rebase on origin/main; apply every sidecar block verbatim with scripts.roadmap.approved_text conventions, filling {{N}} with MAX(decision number)+1 and {{DATE}} with the build date; regenerate docs/decisions-index.json with scripts.decisions_index --write."
  - "Create scripts/checks/decisions/consolidation.py: load_threshold(root) reads decision-compaction.yaml consolidation.threshold; live_amender_counts(rows) and candidates(rows, threshold) from docs/decisions-index.json (amends edges, currency != superseded_compacted); partition(number, block) per consolidation.manifest.units; load_manifests(root) over docs/decision-migration/consolidations/*.yaml (missing dir -> []); manifest_problems(root, base_reader=base_file_text) per manifest.freeze, resolve and point_map (consolidating entry found by envelope supersedes equal to the manifest's; delegated units must name a key the envelope delegates; a text-bound contract_amendment delegated or moved unit needs check: a tests/... ::name whose file defines that function); render_point_map(units, number) giving 'pt<k> -> <targets>' joined by '; ' (restated -> cl.X, key -> its last dotted segment, Decision N, stanza <id>, retired); nomination_info(number, amends, rows, threshold) -> list[str] (empty when no amended root is a candidate) and candidates_warn_line(rows, threshold) -> str | None returning the line texts with 'consolidation candidate' and 'consolidation threshold' respectively. Under 500 SLOC."
  - "validate_delegated_key_changes: after its own loop, failed-append one line per consolidation.manifest_problems item (prefix 'consolidation manifest'), printing PASS with the manifest count when clean."
  - "validate_supersession_annotations: print candidates_warn_line once per run when any root is a candidate; never append to failed."
  - "plan_decision_drafts: add _nomination_lines(number, title, block) beside _info_lines (envelope amends plus title amends edges, placeholder envelopes allowed) and append its lines wherever _info_lines' are; total on an unreadable index or contract (returns [])."
  - "Pre_globs: add scripts/checks/decisions/consolidation.py to validate_plan_documents and validate_plan_scope_closure (scripts/checks/roadmap/_manifest.py) and validate_admin_root_premerge_gate (scripts/checks/verification/_manifest.py); run their test__manifest.py mirrors."
  - "Tests: test_consolidating_entry.py builds a tmp-root fixture (DECISIONS.md with a root of two numbered points, a prose Problem, a dated annotation and a reversal-conditions stanza, one full amender, the consolidating entry with delegates and a stanza, compacted stubs carrying point maps; a contract with the delegated and moved keys; a manifest; origin/main text supplied through a base_reader stub) and asserts no problems, then one seeded defect per acceptance criterion 2 item, each reported; partition ids for the fixture body; live counts exclude stubs; test_threshold_is_delegated_within_bounds on the real repository; manifest_problems(ROOT) == [] on the real repository; test_unresolved_manifest_target_fails_the_check (tmp root, validate_delegated_key_changes with root and readers injected), test_consolidation_candidates_warn_once_and_never_fail (fixture index at the threshold, validate_supersession_annotations or the line helper it calls) and test_amending_a_candidate_root_prints_nomination (report_for_draft on a tmp draft amending a candidate). No existing test file is edited, so no verification-registry shard changes."
  - "Execute the Verification Plan; loop until pass; on an unrecoverable failure stop and RCA (Decision 55)."
  - "CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true in the implementation commit, which carries 'Resolves: rec-5265'; git fetch origin main && git rebase origin/main (refill {{N}} if main gained a Decision); then re-run verification steps 1-7 on the closure commit."
  - "Handoff: open the PR ready for review only after steps 1-8 pass; post the #1963 entry naming DECISIONS.md, decision-compaction.yaml and the three edited scripts; merge per docs/contracts/git-ops.yaml resolves_trailer and merge_step (explicit squash commit_message carrying 'Resolves: rec-5265', expectedHeadSha, merge_step premerge and readback); then run step 9."
  - "Report: what was implemented and the verification results."
rollback: >-
  Before merge, drop the branch. After merge, roll forward, never revert: a revert would remove the new entry's header,
  which never_remove_headers forbids and Decision 177's census reports as a vanished number. A newer Decision
  supersedes this one and its code paths are removed or rewired in that change; the nomination lines are advisory and
  can be removed in a plain code PR once that Decision lands.
