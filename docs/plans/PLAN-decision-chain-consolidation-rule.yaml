schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-chain-consolidation-rule"
intent: >-
  Make retiring a long Decision amendment chain a standing, checked method (rec-5265): one new Decision amends
  Decision 149 so a consolidating entry may count a delegated value as restated, nominates any Decision at the
  consolidation threshold without forcing it, and requires a manifest that accounts for every paragraph of each
  retired entry; decision-compaction.yaml gains the consolidation key, the fast tier fails a manifest whose targets
  stop resolving, and planning names the candidates, so a reader needs one entry per subject instead of six to ten.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-chain-consolidation-rule.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5265
  (Low), the contract-first retrospective's optional step 8. Closes no roadmap criterion.
cites: [dec:149, dec:163, dec:167, dec:175, dec:177, dec:181, dec:246, dec:276, dec:277]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Insert the rule's Decision (block DECISIONS-1) and add its dated amendment note to Decision 149 (block
      DECISIONS-149), exactly as the approved-text sidecar binds them.
  - file: docs/contracts/decision-compaction.yaml
    action: Modify
    purpose: >-
      Widen compaction.eligibility_criterion with delegation as subsumption, widen stub_grammar's Decision marker for
      the point map, add the consolidation key, bump contract_version and add a new amendment_log entry (blocks
      compaction-head, compaction-log, compaction-eligibility, compaction-stub-marker, consolidation-key), exactly as
      the sidecar binds them.
  - file: scripts/checks/decisions/consolidation.py
    action: Create
    purpose: >-
      Shared helpers: threshold read, live amender counts and candidates from the index, the paragraph partition of a
      victim body into unit ids, manifest load, manifest_problems (freeze against origin/main for a new manifest;
      victims compacted and pointing at the consolidating entry; every target, token and check resolving; point maps
      equal; origin/main text comes through a required base_reader argument, so the module imports no git helper),
      render_point_map and the nomination INFO and WARN line text.
    new_imports: [scripts.checks.decisions.envelope_rules, scripts.decisions_md]
  - file: scripts/checks/decisions/validate_delegated_key_changes.py
    action: Modify
    purpose: Append consolidation.manifest_problems to its failures, so a manifest target that stops resolving fails --pre.
    new_imports: [scripts.checks.decisions.consolidation]
  - file: scripts/checks/decisions/validate_supersession_annotations.py
    action: Modify
    purpose: Print the one aggregate nomination WARN line from consolidation.candidates; it never appends to failed.
    new_imports: [scripts.checks.decisions.consolidation]
  - file: scripts/roadmap/plan_decision_drafts.py
    action: Modify
    purpose: >-
      Add a nomination INFO line for each drafted entry that amends a candidate root, independent of serves; never a
      finding.
    new_imports: [scripts.checks.decisions.consolidation]
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      Add scripts/checks/decisions/consolidation.py to the pre_globs of validate_plan_documents and
      validate_plan_scope_closure, which reach plan_decision_drafts.py and so its new import.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: Add scripts/checks/decisions/consolidation.py to validate_admin_root_premerge_gate's pre_globs, for the same reason.
  - file: tests/checks/decisions/test_consolidation.py
    action: Create
    purpose: >-
      The mirror test of consolidation.py (Decision 131): rec-5265's acceptance
      (test_fixture_consolidation_is_accepted_and_each_defect_is_caught) plus partition, live-count, multi-target unit,
      carried_forward, point-map, nomination-text, threshold-bounds and real-repository tests; 100% line coverage of the
      module.
  - file: tests/checks/decisions/test_validate_delegated_key_changes.py
    action: Modify
    purpose: >-
      Wiring tests: an unresolved manifest target fails the check on a run whose diff touches only a .py file, and on
      one where the target's file was deleted; with no manifest directory the check passes as before.
  - file: tests/checks/decisions/test_validate_supersession_annotations.py
    action: Modify
    purpose: Wiring test that the aggregate nomination WARN line prints once and nothing is appended to failed.
  - file: tests/test_plan_decision_drafts.py
    action: Modify
    purpose: Wiring test that a drafted entry amending a candidate root gets the nomination INFO line and no finding.
bundled_recommendations: [rec-5265]
followon_recs: [rec-5422]
infrastructure_dependencies: []
acceptance_criteria:
  - The committed Decision and contract text equal the approved sidecar (approved_text verify exits 0).
  - "rec-5265's acceptance node passes: a fixture consolidation is accepted and each seeded defect (missing or extra unit, unresolved key, absent token, absent stanza id, short retirement reason, unchecked text-bound key, victim not a stub, point-map mismatch, freeze mismatch, moved key outside every delegated key, unit moved alone whose base text is not in its target, merged manifest dropping a unit) is reported."
  - A manifest whose target stops resolving fails validate_delegated_key_changes on every run, including one whose diff touches only a .py file and one where the target's file was deleted; with no manifests it passes unchanged.
  - A drafted entry amending a root at or over the threshold gets the nomination INFO line; the fast tier prints one aggregate WARN line and neither fails; a compacted root is never a candidate.
  - The new Decision amends 149 and delegates the threshold within bounds 3 to 9; the index is fresh; validate --pre and the full tier pass.
  - rec-5265 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed Decision and contract text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-chain-consolidation-rule --expect 268fb3d8b84ebfcbfcec8fa3468319600643603a6cfc210bf0a58d854d57c897
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier (git-ops.yaml
      merge_step_coverage).
  - step: 2
    phase: pre-deploy
    action: Run the new mirror test, the three test files the change edits and the two manifest mirrors.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions/test_consolidation.py
      tests/checks/decisions/test_validate_delegated_key_changes.py
      tests/checks/decisions/test_validate_supersession_annotations.py tests/test_plan_decision_drafts.py
      tests/checks/roadmap/test__manifest.py tests/checks/verification/test__manifest.py -q
    expected: All tests pass, including test_fixture_consolidation_is_accepted_and_each_defect_is_caught and the three new wiring tests.
    fix_if: A seeded defect is not reported, or a clean fixture reports one -- fix consolidation.py, never the fixture.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The step runs this plan's own pytest modules, which the fast tier's affected-test selection runs on every PR
      touching the edited check modules or docs/DECISIONS.md.
  - step: 3
    phase: pre-deploy
    action: Exercise the nomination on the real index for a candidate root (Decision 126) and a non-candidate (Decision 277).
    command: >-
      bin/venv-python -c "import json;
      from pathlib import Path;
      from scripts.checks.decisions import consolidation as c;
      rows=json.load(open('docs/decisions-index.json'))['decisions']; th=c.load_threshold(Path('.'));
      hit=c.nomination_info('N', [126], rows, th); miss=c.nomination_info('N', [277], rows, th);
      assert hit and 'consolidation candidate' in ' '.join(hit), hit; assert not miss, miss;
      print('NOMINATION_OK', th)"
    expected: Exit 0 and the marker with threshold 5.
    expected_literals: [NOMINATION_OK]
    fix_if: No line for 126, or one for 277 -- the amends-edge count or the threshold read is wrong.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates tests/test_plan_decision_drafts.py's nomination wiring test, which step 2 runs.
  - step: 4
    phase: pre-deploy
    action: Prove the fast-tier nomination WARN prints and never fails, and that manifests (none today) pass.
    command: >-
      bin/venv-python -c "import io, sys;
      from scripts.checks.decisions.validate_supersession_annotations import validate_supersession_annotations;
      from scripts.checks.decisions.validate_delegated_key_changes import validate_delegated_key_changes;
      buf=io.StringIO(); f=[]; g=[]; old=sys.stdout; sys.stdout=buf;
      validate_supersession_annotations(f); validate_delegated_key_changes(g); sys.stdout=old;
      out=buf.getvalue(); assert not f and not g, (f, g);
      assert sum('consolidation threshold' in ln and 'WARN' in ln for ln in out.splitlines()) == 1, out;
      print('WARN_LINE_OK')"
    expected: Exit 0 and the marker.
    expected_literals: [WARN_LINE_OK]
    fix_if: No WARN line, more than one, or a failure entry -- the aggregate line is wired wrong.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates test_validate_supersession_annotations.py's nomination WARN test, which step 2 runs.
  - step: 5
    phase: pre-deploy
    action: Prove the index is fresh and the new entry amends 149 and delegates the threshold within its bounds.
    command: >-
      bin/venv-python -m scripts.decisions_index --check && bin/venv-python -c "import yaml, re;
      from scripts.decisions_md import extract_entry_envelope, iter_decision_sections;
      t=open('docs/DECISIONS.md').read();
      new=[(int(m.group(1)), extract_entry_envelope(b)) for m, b in iter_decision_sections(t)
      if 'consolidation.threshold' in b and (extract_entry_envelope(b) or {}).get('amends') == [149]];
      assert len(new) == 1, new; env=new[0][1];
      d={x['key'].split('#')[1]: x for x in env['delegates']};
      assert d['consolidation.threshold']['bounds'] == {'min': 3, 'max': 9}, d;
      th=yaml.safe_load(open('docs/contracts/decision-compaction.yaml'))['consolidation']['threshold'];
      assert 3 <= th <= 9 and env['kind']['value'] == 'direction'; print('RULE_ENTRY_OK', new[0][0], th)"
    expected: Exit 0 and the marker with the entry's number and threshold 5.
    expected_literals: [RULE_ENTRY_OK]
    fix_if: The entry or the key is missing or malformed -- the sidecar was applied wrongly; re-apply it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_delegated_key_changes and test_consolidation.py::test_threshold_is_delegated_within_bounds (step 2).
  - step: 6
    phase: pre-deploy
    action: Run rec-5265's acceptance exactly as the rec stores it.
    command: bin/venv-python -m pytest "tests/checks/decisions/test_consolidation.py::test_fixture_consolidation_is_accepted_and_each_defect_is_caught" -q
    expected: 1 passed.
    fix_if: The node is missing or renamed -- keep the acceptance node name.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Step 2 runs the same node in the fast tier.
  - step: 7
    phase: pre-deploy
    action: Prove the mirror tests exist and cover the four edited sources fully (Decision 131; the full tier's validate_test_coverage).
    command: >-
      bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files
      scripts/checks/decisions/consolidation.py scripts/checks/decisions/validate_delegated_key_changes.py
      scripts/checks/decisions/validate_supersession_annotations.py scripts/roadmap/plan_decision_drafts.py
    expected: Exit 0; every file has its mirror test and 100% line coverage.
    fix_if: A missing mirror or an uncovered line -- add the test in the mirror file, never a pragma.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates the full tier's validate_test_coverage, which step 9 runs.
  - step: 8
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates the PR fast tier, which runs the same command on every push.
  - step: 9
    phase: pre-deploy
    action: Run the full tier before handoff (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure -- fix in scope and re-run; a failure outside scope is a plan defect, never a handoff to PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: Prove the merge synced the new entry to ops_decisions and closed rec-5265.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json, re;
      t=open('docs/DECISIONS.md').read();
      n=int(re.search(r'^## Decision (\d+): A long amendment chain retires', t, re.M).group(1));
      rows={r['id']: r for r in map(json.loads, open('logs/.decisions-index.jsonl'))};
      assert rows[f'dec-{n:03d}']['status'] == 'Decided', rows.get(f'dec-{n:03d}'); print('OPS_DECISIONS_OK', n)"
      && bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5265']);
      assert rows and rows[0]['status'] == 'closed', rows; print('REC_5265_CLOSED')"
    expected: OPS_DECISIONS_OK and REC_5265_CLOSED.
    fix_if: >-
      The row is absent -- the rec-autoclose backfill step failed; read its run and re-run the backfill through the
      portal. rec-5265 open -- the Resolves trailer was missing; close it through update_rec with the merge sha.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/DECISIONS.md
    behavior: The rule's entry amends 149 and delegates the threshold within 3 to 9.
    verification_step: 2
    test_selector: tests/checks/decisions/test_consolidation.py::test_threshold_is_delegated_within_bounds
    red_green_expectation: red before (no entry delegates consolidation.threshold), green after.
  - source: docs/contracts/decision-compaction.yaml
    behavior: consolidation.threshold sits inside the delegating entry's bounds and the manifest, abort and procedure keys exist.
    verification_step: 2
    test_selector: tests/checks/decisions/test_consolidation.py::test_threshold_is_delegated_within_bounds
    red_green_expectation: red before (the consolidation key is absent), green after.
  - source: scripts/checks/decisions/consolidation.py
    behavior: A clean fixture consolidation passes and each seeded defect is reported.
    verification_step: 2
    test_selector: tests/checks/decisions/test_consolidation.py::test_fixture_consolidation_is_accepted_and_each_defect_is_caught
    red_green_expectation: red before (the module does not exist), green after.
  - source: scripts/checks/decisions/validate_delegated_key_changes.py
    behavior: A manifest with an unresolved target fails the check past each of the three early returns (a .py-only diff, no delegates in base, origin/main unreachable) and when the target file was deleted.
    verification_step: 2
    test_selector: tests/checks/decisions/test_validate_delegated_key_changes.py::test_unresolved_manifest_target_fails_on_any_diff
    red_green_expectation: red before (the check reads no manifest and returns early on a .py-only diff), green after.
  - source: scripts/checks/decisions/validate_supersession_annotations.py
    behavior: One aggregate nomination WARN line prints, a compacted root never counts, and nothing is appended to failed.
    verification_step: 2
    test_selector: tests/checks/decisions/test_validate_supersession_annotations.py::test_consolidation_candidates_warn_once_and_never_fail
    red_green_expectation: red before (no such line), green after.
  - source: scripts/roadmap/plan_decision_drafts.py
    behavior: A drafted entry amending a candidate root yields the nomination INFO line and no finding.
    verification_step: 2
    test_selector: tests/test_plan_decision_drafts.py::test_amending_a_candidate_root_prints_nomination
    red_green_expectation: red before (no nomination line), green after.
  - source: scripts/checks/roadmap/_manifest.py
    behavior: validate_plan_documents and validate_plan_scope_closure re-run when consolidation.py changes.
    verification_step: 2
    test_selector: tests/checks/roadmap/test__manifest.py
    waiver_reason: >-
      A pre_globs data row; its mirror test asserts the manifest's shape generically, and a per-row test would restate
      the row (the same treatment earlier pre_globs additions took).
  - source: scripts/checks/verification/_manifest.py
    behavior: validate_admin_root_premerge_gate re-runs when consolidation.py changes.
    verification_step: 2
    test_selector: tests/checks/verification/test__manifest.py
    waiver_reason: >-
      A pre_globs data row; its mirror test asserts the manifest's shape generically, and a per-row test would restate
      the row.
constraints:
  - Approved words are copied from docs/plans/approved/decision-chain-consolidation-rule.yaml verbatim; {{N}} and {{DATE}} are filled at build (Decision 217 cl.5).
  - Edits no Decision body other than the one dated note on Decision 149; Decision 277 and tests/checks/decisions/test_consolidation_decision_92.py stay as they are.
  - No hard fail on chain length (Decision 163); the nomination never files a rec.
  - consolidation.py, plan_decision_drafts.py and both checks stay under 500 SLOC; no budget raise.
  - No new validate.py Entry; validate_delegated_key_changes (pre, no pre_globs) carries the manifest check.
  - No rescue agents or workaround loops (Decision 55).
