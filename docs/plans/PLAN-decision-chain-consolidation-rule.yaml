pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Rebase on origin/main; apply every sidecar block verbatim with scripts.roadmap.approved_text conventions, filling {{N}} with MAX(decision number)+1 and {{DATE}} with the build date; regenerate docs/decisions-index.json with scripts.decisions_index --write."
  - "Create scripts/checks/decisions/consolidation.py: load_threshold(root) reads decision-compaction.yaml consolidation.threshold; live_amender_counts(rows) and candidates(rows, threshold) from docs/decisions-index.json (amends edges, currency != superseded_compacted for amender and root alike, so a compacted root is never a candidate); partition(number, block) per consolidation.manifest.units; load_manifests(root) over docs/decision-migration/consolidations/*.yaml (missing dir -> []); manifest_problems(root, base_reader) with base_reader a required argument, per manifest.freeze, resolve and point_map (consolidating entry found by envelope supersedes equal to the manifest's; units come only from superseded victims; a unit takes one or more of restated, delegated, moved, held, stanza, and retired only alone and only for a unit that sets no live ruling; delegated targets must be keys the envelope delegates and moved targets keys at or under one; a held key sits at or under a key a live entry delegates or in a contract whose contract.evaluator resolves to a registered check; for a manifest new against origin/main, each unit moved alone has its base text (point number dropped, *, ` and whitespace runs normalised on both sides) inside its target key's text, flattened; a manifest present at origin/main may not lose a unit id or a victim, and may be deleted only when its consolidating entry is superseded at head; when base_reader returns None for DECISIONS.md the freeze and base-text checks are skipped with a printed SKIP marker and the resolve checks still run; a text-bound contract_amendment delegated or moved unit needs check: a tests/... ::name whose file defines that function; each carried_forward number keeps its amends edge and is named in a clause of the consolidating entry; a target whose file is absent at head is unresolved); render_point_map(units, number) giving 'pt<k> -> <targets>' with a unit's targets joined by ' and ' and units by '; ' (restated -> cl.X, key -> its last dotted segment, Decision N, stanza <id>, retired); nomination_info(number, amends, rows, threshold, sizes) -> list[str], where sizes maps a Decision number to its whole-span bytes (from decisions_md over DECISIONS.md), giving count, chain bytes (root plus its live amenders) and entries opened, counting the draft itself as one more live amender (empty when no amended root reaches the threshold) and candidates_warn_line(rows, threshold) -> str | None (the largest by count) returning the line texts with 'consolidation candidate' and 'consolidation threshold' respectively. Under 500 SLOC."
  - "validate_delegated_key_changes: run consolidation.manifest_problems(root, base_text_reader) first, on every run while a manifest exists and before the changed-file, no-delegates and baseline early returns, so a .py-only diff or a deleted target file still fails; print one FAIL line per problem (prefix 'consolidation manifest') and append 'Consolidation manifests' to failed; print PASS with the manifest count when clean. With no manifest directory it reads no git and behaves exactly as today."
  - "validate_supersession_annotations: print candidates_warn_line once per run when any root is a candidate; never append to failed."
  - "plan_decision_drafts: add _nomination_lines(number, title, block) beside _info_lines (envelope amends plus title amends edges, placeholder envelopes allowed) and append its lines wherever _info_lines' are; total on an unreadable index or contract (returns [])."
  - "Pre_globs: add scripts/checks/decisions/consolidation.py to validate_plan_documents and validate_plan_scope_closure (scripts/checks/roadmap/_manifest.py) and validate_admin_root_premerge_gate (scripts/checks/verification/_manifest.py); run their test__manifest.py mirrors."
  - "Tests: tests/checks/decisions/test_consolidation.py (the mirror, 100% coverage) builds a tmp-root fixture (DECISIONS.md with a root of two numbered points, a prose Problem, a dated annotation and a reversal-conditions stanza, one full amender and one carried-forward amender, the consolidating entry with delegates and a stanza, compacted stubs carrying point maps; a contract with the delegated and moved keys; a manifest with one multi-target unit; origin/main text through a base_reader stub) and asserts no problems, then one seeded defect per acceptance criterion 2 item plus a retired unit beside another disposition and a carried_forward number without its clause, each reported; partition ids for a fixture body that has a lead-in sentence sharing point 1's paragraph and a section marker alone on its line; live counts exclude stubs and a compacted root with five carried-forward amenders is no candidate; the freeze SKIP path with base_reader returning None; nomination counts the draft; test_threshold_is_delegated_within_bounds and manifest_problems(ROOT, stub) == [] on the real repository. Wiring tests go in the existing mirrors: test_validate_delegated_key_changes.py::test_unresolved_manifest_target_fails_on_any_diff (the production-root pattern of that file's lines 180-191: root=None with _common.ROOT and get_changed_files patched, since an explicit root skips the changed-file return; parametrised over a .py-only diff, a base with no delegates, a baseline_reader returning None and a deleted target file), test_validate_supersession_annotations.py::test_consolidation_candidates_warn_once_and_never_fail (fixture index at the threshold) and test_plan_decision_drafts.py::test_amending_a_candidate_root_prints_nomination (report_for_draft on a tmp draft). test_validate_supersession_annotations.py stays under 500 SLOC. The verification-registry shards that pin these files whole (decision-delegated-key-rules, plan-decision-drafts-report, serves-claim-verification-pins, supersession-duplicate-number-tests, supersession-envelope-borne-edges) keep passing unchanged; no shard is edited."
  - "Execute the Verification Plan; loop until pass; on an unrecoverable failure stop and RCA (Decision 55)."
  - "CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true in the implementation commit, which carries 'Resolves: rec-5265'; git fetch origin main && git rebase origin/main (refill {{N}} if main gained a Decision); then re-run verification steps 1-8 on the closure commit."
  - "Handoff: open the PR ready for review only after steps 1-9 pass; post the #1963 entry naming DECISIONS.md, decision-compaction.yaml and the three edited scripts; merge per docs/contracts/git-ops.yaml resolves_trailer and merge_step (explicit squash commit_message carrying 'Resolves: rec-5265', expectedHeadSha, merge_step premerge and readback); then run step 10."
  - "Report: what was implemented and the verification results."
rollback: >-
  Before merge, drop the branch. After merge, roll forward, never revert: a revert would remove the new entry's header,
  which never_remove_headers forbids and Decision 177's census reports as a vanished number. A newer Decision
  supersedes this one and its code paths are removed or rewired in that change; the nomination lines are advisory and
  can be removed in a plain code PR once that Decision lands.
