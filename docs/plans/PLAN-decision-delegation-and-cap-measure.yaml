schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-delegation-and-cap-measure
intent: >-
  Amend Decision 167 so the decision corpus stops growing by amendment and stops paying for its size cap in rationale
  (audit findings CFR-01 and CFR-02): a new Decision may delegate its values to a named contract or config key with a
  change rule and bounds, mechanism specification gains its own routing row, a new mechanism entry that only re-sets a
  delegated key fails, the per-entry cap measures the entry without its envelope, reversal stanza and options-considered
  block, every new entry names the options it rejected, and in-body growth past the cap fails. One new direction
  Decision, its contract text and its checks land in one build PR, all bound words under one approved-text sidecar.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-delegation-and-cap-measure.yaml
phase: >-
  user_explicit_out_of_scope (operator remit 2026-11-17: the contract-first retrospective's findings,
  audits/contract-first-retrospective-177c8f37.yaml; recs only, no roadmap item, WORK-ORDER question 7). Closes no
  tier_item criterion; T2.56 is complete.
cites: [dec:150, dec:151, dec:166, dec:167, dec:168, dec:177, dec:181, dec:243, dec:246]
scope:
  # ------------------------------------------------- bound words (docs/plans/approved/decision-delegation-and-cap-measure.yaml)
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Sidecar blocks DECISIONS-1 and DECISIONS-2 only: insert Decision {{N}} (direction, amends 167) after the file's
      header paragraph, and append the dated "Amended by Decision {{N}}" forward pointer as the last paragraph of
      Decision 167's block (validate_supersession_annotations; Decision 177's dated-annotation form), filling {{N}} with
      MAX + 1 and {{DATE}} at build time (decision-entry.yaml metadata_envelope.number_assignment). No other edit.
      DECISIONS-2 anchors on the separator and Decision 166's heading, so it applies before or after the
      condition-reviews build's own note on Decision 167 (rec-5255; its plan merged in #2116); if a before still fails to match, stop and hand
      back for a sidecar refresh and a new approval run, never a hand-merged edit.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      Sidecar blocks decision-entry-1..11 only: contract_version 2 and one amendment_log row; optional_fields gains
      delegates and plan with their field_shapes; significance.routing gains mechanism_specification and routing_rule
      question (3) names it; compaction becomes a one-line pointer and the two prose pointers to it name the new file;
      size_governance keeps per_entry_size_norm as the norm earlier entries landed under and gains measured_size_norm
      (cap_bytes, measured_as, tier, in_place_growth) and options_considered (marker, none_form, cap_bytes, rule,
      exempt);
      accretion_signal.flips_to_hard_fail_when records the in-body flip. No other edit.
  - file: docs/contracts/decision-compaction.yaml
    action: Create
    purpose: >-
      Sidecar block decision-compaction-new only: a ratified Class D contract (subject decision-compaction, evaluator
      validate_decision_entry_conformance) holding decision-entry.yaml's compaction section, words unchanged except
      marker_spelling's cross-file pointer. Split by subject so decision-entry.yaml has headroom (493 -> 476 of
      500 effective lines).
  # ------------------------------------------------- code
  - file: scripts/checks/decisions/entry_measure.py
    action: Create
    purpose: >-
      Pure measure functions on scripts.decisions_md's grammar (no file reads, never raises on text): authored(entry)
      and authored_bytes(entry) moved verbatim from tests/fixtures/decision_entry.py; envelope_span(entry) and
      stanza_span(entry) (the bare ```yaml fence after the heading; the ```yaml reversal-conditions fence);
      options_block(entry, marker) -> the text from the marker to the next line starting with "**", a fence or a
      heading, or None; dated_annotation_spans(entry) (every paragraph matching amendment_forms general_rule, anywhere
      in the body: a paragraph whose first line starts "> **" with a ":**" label and whose every line starts ">"
      (continuation lines included, as tests/fixtures/decision_entry.py _is_trailer reads it), dated or not (a "Supersession note" counts), or
      a bracketed "[Amendment DATE" paragraph (its docstring says amendment_forms general_rule governs, so undated
      labelled paragraphs count although measured_as says "dated annotation paragraphs"); it is deliberately wider than authored's trailing dated run, which the
      pins keep, and its docstring says so);
      measured_bytes(entry, excluded) where excluded is a subset of {metadata_envelope, reversal_conditions,
      options_considered, dated_annotations} (UTF-8 bytes of the entry with those spans removed).
    new_imports: [scripts.decisions_md]
  - file: scripts/checks/decisions/decisions_size_measure.py
    action: Create
    purpose: >-
      The new size legs as pure functions over injected texts (no file or git reads, never raises on text), so their
      mirror test (tests/checks/decisions/test_decisions_size_measure.py) is the one validate_test_coverage runs for
      them (coverage_baseline.py runs only a source's mirror). size_governance(contract_text) -> the parsed section or
      an "unreadable" finding (unparseable; no per_entry_size_norm.cap_bytes; or measured_size_norm or
      options_considered present without a positive integer cap_bytes, bool excluded, so deleting only a sub-key
      cannot lift a delegated cap without a Decision). title_key(heading) -> the text after
      "## Decision <N or {{N}}>: " with one trailing status parenthetical (" (Decided)") removed. Options rule
      (size_governance.options_considered present): a new-in-diff entry fails when the marker is absent, the block is
      empty, the block starts with "none considered" without " -- " and a reason, or the block exceeds its cap_bytes;
      an entry whose title_key equals a listed row's title is exempt. Exemption-list legs: a listed slug with no
      sidecar under the given approved-slug set is a WARN whose text says this is expected while that slug's PR is
      open and to remove the row if the PR closed unmerged; shrink-only (Decision 170 cl.3, Decision 244 cl.2
      precedent): with a base list, FAIL a head row (slug, title) absent from it; with no base list, FAIL the list
      appearing only if the base contract already carries options_considered (so only the build PR creates it).
      Fail-closed leg: FAIL when the base contract carries measured_size_norm or options_considered and head's does
      not, unless a new-in-diff kind-direction entry lists Decision {{N}} in its envelope amends or supersedes; the code
      finds Decision {{N}} as the base entry whose delegates carry size_governance.measured_size_norm.cap_bytes, never
      by a literal number (deleting a delegated cap would otherwise
      lift it without a Decision, against cl.4 and Decision 128). Measured cap (measured_size_norm present): a
      new-in-diff entry fails when measured_bytes(entry, {metadata_envelope, reversal_conditions, options_considered})
      exceeds its cap_bytes; a baseline entry fails when measured_bytes(.., + dated_annotations) at head is greater
      than at base and greater than cap_bytes (in_place_growth), and growth confined to undated "> **Label:**"
      paragraphs passes with a WARN naming them; growth compares per (file, decision number), so an entry absent from that file at head (archived, Decision 146, whose move retitles the heading) is never growth.
      Clause 6 error text names the lawful remedies: a "> **...:**" annotation, a compacted stub, or archival. Error
      text cites the contract key and Decision {{N}}'s clause.
    new_imports: [scripts.checks.decisions.entry_measure, scripts.decisions_md]
  - file: scripts/checks/decisions/validate_decisions_size.py
    action: Modify
    purpose: >-
      Wiring only, so every new line is covered by its mirror test_validate_decisions_size.py alone: read root /
      docs/contracts/decision-entry.yaml (root is the check's injected root, the repo root in production), root /
      config/decision_options_exemptions.yaml and the approved-slug set (docs/plans/approved/*.yaml stems), and pass
      them, with base texts from base_text_reader, to decisions_size_measure's legs. Contract absent under root
      (every existing tmp-root test) -> today's behaviour exactly: _PER_ENTRY_CAP_BYTES (6144) whole-span, no new
      legs, so the existing classes need no edit; an "unreadable" finding FAILs "decision-entry.yaml unreadable",
      never a silent pass. When measured_size_norm is present the whole-span hard cap is off (the measured cap
      governs); the WARN accretion legs are unchanged. The changed-files cost gate (today examined(0) unless a
      DECISIONS file is in the diff) widens to docs/DECISIONS.md, docs/DECISIONS_ARCHIVE.md,
      config/decision_options_exemptions.yaml and docs/contracts/decision-entry.yaml (a contract-only diff dropping a
      cap key must reach the fail-closed leg). Seam: base_text_reader(root, rel) defaulting to
      _baseline.base_file_text, so tests inject a base list and base contract. origin/main unreachable -> the
      base-dependent legs add nothing and the run's single terminal declaration stays the other legs' examined(n)
      (Decision 170); with every leg unable to run, skipped(). Stays under 500 SLOC (203 now).
    new_imports: [scripts.checks.decisions.decisions_size_measure, scripts.checks.decisions._baseline]
  - file: scripts/checks/decisions/_baseline.py
    action: Modify
    purpose: >-
      Add base_file_text(root, rel) -> the file's text at origin/main, or None when git fails or the path is absent
      there (one git show, memoized per (root, rel) as the module's other readers are); baseline_decision_bodies is
      rebuilt on it, so validate_decisions_size and validate_delegated_key_changes share one read per file per run. It is the default base_text_reader for both
      validate_decisions_size and validate_delegated_key_changes, so one module owns the git read.
    new_imports: []
  - file: scripts/checks/decisions/envelope_rules.py
    action: Modify
    purpose: >-
      Add delegates_issues(envelope, change_rules, resolve) (FAIL: not a non-empty list; an item not a mapping with
      exactly key, change_rule, bounds; key not matching <path>.(yaml|yml)#<dotted>; change_rule outside change_rules;
      bounds not exactly one of {min, max} with numeric min <= max, {one_of} non-empty list, {text} non-empty one-line
      string; resolve(key) False) and plan_issues(envelope, plan_exists) (FAIL when plan is not a slug string
      ^[a-z0-9][a-z0-9-]*$; WARN text when plan_exists(slug) is False). _shape_detail names delegates and plan shape
      faults. Also add the one shared pure key helper, split_delegated_key(key) -> (path, dotted) or None and
      dotted_value(parsed, dotted) -> (found, value), which the conformance resolve, validate_delegated_key_changes'
      value read and plan_decision_drafts' resolve all call (Decision 134 cl.3; file reads stay in the callers).
      resolve and plan_exists are injected callables, so the module stays file-read-free.
    new_imports: []
  - file: scripts/checks/decisions/validate_decision_entry_conformance.py
    action: Modify
    purpose: >-
      Call delegates_issues (change_rules read from metadata_envelope.field_shapes.delegates.change_rules; resolve =
      the head file at the key's path parses and the dotted path exists) and plan_issues (plan_exists = the head file
      docs/plans/PLAN-<slug>.yaml exists; its WARN prints, never fails) inside _new_entry_conformance_issues, only when
      the envelope carries the field. The two compaction.stub_grammar messages name docs/contracts/decision-compaction.yaml
      through a module constant _COMPACTION_CONTRACT_REL_PATH (the new contract's evaluator literal). Stays under 500
      SLOC (406 now): if the build crosses it, move the new calls into a helper in envelope_rules.py.
    new_imports: []
  - file: scripts/checks/decisions/validate_delegated_key_changes.py
    action: Create
    purpose: >-
      Registered check validate_delegated_key_changes (its manifest Entry mirrors validate_decisions_size's; its
      docstring says rule (a) exempts a mechanism entry that carries its own delegates, as decision-entry.yaml
      field_shapes.delegates states). Delegations come from origin/main, never head, so an in-place envelope edit
      cannot move them: every entry whose envelope at base (base_text_reader on docs/DECISIONS.md and
      docs/DECISIONS_ARCHIVE.md, scripts.decisions_md's envelope extraction) carries delegates, keyed by decision
      number across both files (an archive move is the same entry). Cost gates, each before any YAML parse: on the
      production root, if no file in _common.get_changed_files is docs/DECISIONS.md, docs/DECISIONS_ARCHIVE.md or a
      .yaml/.yml file (the key grammar's only file types), examined(0); then, if neither base file contains the
      substring "delegates:", examined(0) (the check is inert until Decision {{N}} merges). The unit is one base
      delegation; a run that compares declares examined(number compared). Default base_text_reader:
      _baseline.base_file_text. Rules, each waived when a new-in-diff entry with kind.value direction lists the
      delegating Decision in its envelope amends or supersedes: (c) FAIL when a base delegating entry's delegates (key,
      change_rule, bounds) differs at head, including a delegates block or the entry removed from both files (a head
      Decision 149 compacted stub whose "**Superseded by: Decision M**" target lists it in amends or supersedes at
      base is exempt, since its superseder landed earlier); then,
      for each base delegated key whose parsed value differs between origin/main and head, (a) FAIL each new-in-diff
      entry whose kind.value is mechanism, whose envelope has no delegates, and whose text outside its envelope names
      the key's file basename and either the full dotted key or its last two segments joined by "." (the last
      segment for a one-segment key), and (b) when the base bounds are {min, max} or {one_of}, FAIL a head value
      outside them (a non-numeric value under {min, max} is outside). {text} bounds are never evaluated. A base
      delegated key that no longer resolves at head is a WARN. origin/main unreachable -> skipped(). Seams: root,
      baseline_reader (decision numbers), base_text_reader(root, rel) -> text at origin/main or None.
    new_imports: [scripts.checks._common, scripts.checks.registry, scripts.checks.decisions._baseline, scripts.checks.decisions.envelope_rules, scripts.decisions_md]
  - file: scripts/checks/decisions/_manifest.py
    action: Modify
    purpose: >-
      One Entry for validate_delegated_key_changes: pre=True with no pre_globs (a delegated key may live in any file,
      so it is ungated like validate_decisions_size and cost-gates itself), full_segment full_after_lint. The
      validate_decision_entry_conformance Entry's pre_globs gain docs/contracts/decision-compaction.yaml.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      validate_admin_root_premerge_gate's pre_globs gain scripts/checks/decisions/entry_measure.py and
      scripts/checks/decisions/decisions_size_measure.py (plan_decision_drafts imports both; plan_obligations
      pre_globs closure).
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      validate_plan_scope_closure's pre_globs gain scripts/checks/decisions/entry_measure.py and
      scripts/checks/decisions/decisions_size_measure.py (same closure).
  - file: config/decision_options_exemptions.yaml
    action: Create
    purpose: >-
      The options rule's exemption list (decision-entry.yaml options_considered.exempt): `exempt_sidecars:` a list
      sorted by slug of {slug, title} rows, title being the drafted heading after "## Decision {{N}}: " with its one trailing status parenthetical
      (" (Decided)") removed; the matcher strips the same suffix from a landed heading before comparing. The build
      writes it after its final rebase and refreshes it immediately before merge, listing every approved sidecar whose
      DECISIONS.md block drafts a "## Decision {{N}}" entry lacking "**Options considered:**" and whose title is not
      yet in docs/DECISIONS.md, from two sources: (1) docs/plans/approved/*.yaml on that base (at planning:
      persona-check-origin, wording-approval-routing; telemetry-content-reader-api-lock landed as Decision 270 in #2135, so its title is now in docs/DECISIONS.md and it drops out); (2) the sidecar on each open
      PR's head (mcp__github__list_pull_requests, then get_file_contents) whose approval run has an approver
      (bin/venv-python -m scripts.roadmap.approved_text_github check --slug SLUG; at planning, supersede-decision-133
      on #2134, whose lookup then read MISSING). A lookup error or unverified lookup stops the derivation and is
      reported, never silently excluded. The derivation also prints each listed or open-PR approved draft's measured
      span (whole span less envelope, stanza and options block) against measured_size_norm.cap_bytes and stops
      before merge if any exceeds it, since clause 5 exempts such a draft from the options rule only. A sidecar approved after this build merges is not listed (clause 5: "approved before this Decision
      merged"). Later edits only remove slugs.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      One row, validate_delegated_key_changes -> schema_drift, beside validate_decisions_size's row. The file is 500 of
      500 effective lines on main dfcd98df (Decision 166), so the same edit folds the five-line block-style CI: entry
      under workflows: into one flow-style line with the same keys and the same quoted rationale (the #2120 precedent
      on the Claude Code: entry): 496, then 497 with the row. Never fold the CodeQL: entry (PLAN-persona-verdict-shell-deny's
      build folds it, and tests/checks/ci_guards/test_validate_full_tier_range.py pins Main Canary:'s block text). If
      the file still exceeds 500 after the CI: fold and the row, STOP to the plan owner; fold nothing else. The parsed file must equal main's plus the one new row (yaml.safe_load compare at build
      time); never drop a key or a word, and never raise or shard here (rec-5275 owns a real relief valve).
  - file: scripts/roadmap/plan_decision_drafts.py
    action: Modify
    purpose: >-
      Apply the same rules to drafted entries at planning time: delegates_issues and plan_issues (FAIL / WARN as at
      the gate, except that a delegates key which does not resolve at head but whose file the plan's own sidecar binds
      is a WARN, since the sidecar creates it), a FAIL when a drafted entry lacks the options_considered marker or
      breaks its rule (unless config/decision_options_exemptions.yaml lists its plan's slug and title), and a FAIL when measured_bytes exceeds measured_size_norm.cap_bytes, each read from
      decision-entry.yaml and skipped when the key is absent; the options rule, title_key and the measured-cap
      comparison are decisions_size_measure's functions, so planning and the gate apply one rule. The new options and
      measured-cap findings run after _rule_findings' malformed-envelope early return, so
      test_both_folded_scalar_shapes_report_the_one_envelope_fail keeps its one finding.
    new_imports: [scripts.checks.decisions.entry_measure, scripts.checks.decisions.decisions_size_measure]
  - file: tests/fixtures/decision_entry.py
    action: Modify
    purpose: >-
      authored and authored_bytes re-export scripts.checks.decisions.entry_measure's (one classifier, rec-4744);
      cap_bytes() keeps reading size_governance.per_entry_size_norm.cap_bytes, the norm the pinned entries landed
      under, and its docstring says an entry landed after Decision {{N}} is pinned against measured_size_norm instead
      (a whole-span pin against 6,144 can false-fail such an entry).
  # ------------------------------------------------- tests
  - file: tests/checks/decisions/test_entry_measure.py
    action: Create
    purpose: >-
      Mirror test for entry_measure.py (every span, each exclusion, measured_bytes arithmetic, no-span entries, an
      undated "> **Supersession note:**" paragraph counted as an annotation, a multi-line "> **Note (DATE):**"
      paragraph with "> " continuation lines counted whole).
  - file: tests/checks/decisions/test_validate_decisions_size.py
    action: Modify
    purpose: >-
      The wiring's mirror; additions at most 55 SLOC (444 now, so under 500; if more is needed, parametrize the two drop cases and the unreadable case into one test before adding any), the rule cases living in
      test_decisions_size_measure.py. Class TestRejectedAlternativesRequired (rec-5260's acceptance), one
      parametrized test writing a tmp-root contract: an entry missing the marker fails; an entry listed through
      config/decision_options_exemptions.yaml (persona-check-origin's real drafted heading, trailing " (Decided)"
      included) passes without one; with no contract under root nothing is required; an unparseable contract
      FAILs "decision-entry.yaml unreadable". Class TestProductionCostGate (as TestDeclarationAdoption: patch
      scripts.checks._common.ROOT to tmp_path, root=None, get_changed_files returning only
      docs/contracts/decision-entry.yaml, base contract injected through base_text_reader): one parametrized test in
      which head dropping options_considered, head dropping measured_size_norm, and head dropping only
      measured_size_norm.cap_bytes each fail; origin/main unreachable
      keeps the other legs' examined(n). Together they cover every new line of validate_decisions_size.py (the
      coverage gate runs only this file for it). Existing classes are unchanged (no contract under their tmp roots),
      so the graduated shards decisions-per-entry-cap-hard-fails, decisions-size-per-entry-cap-warn-tier,
      decisions-size-standing-pressure-single-line, decisions-size-warn-never-fails, decisions-stock-ceilings-retired
      and root-scoped-diff-base-declaration-adoption are kept: their nodes and commands are unchanged.
  - file: tests/checks/decisions/test_decisions_size_measure.py
    action: Create
    purpose: >-
      Mirror test for decisions_size_measure.py, covering every function and branch: size_governance (parsed,
      unparseable, cap missing); title_key (filled and {{N}} headings, with and without " (Decided)"); the options
      rule (missing marker, empty, "none considered" without a reason, over the block cap fail; a conforming block
      and an exempt title pass); the exemption legs (a head row absent from the base list fails, the list appearing
      when the base contract carries options_considered fails, the build PR's own case passes, a slug without a
      sidecar WARNs with the open-PR wording); the fail-closed leg (each cap key dropped fails, a direction amender
      passes); the measured cap (an entry over the whole-span cap but under measured_size_norm passes; one over it
      fails; the excluded blocks are excluded); size_governance's unreadable cases (measured_size_norm, and separately
      options_considered, present with cap_bytes missing, zero, a string or a bool); class TestInPlaceGrowth (a baseline entry whose measured span grows
      past the cap fails; one growing only by a dated annotation, single- or multi-line, or shrinking, or growing
      while under the cap, or moved to the archive, passes; growth only through an undated "> **Label:**" paragraph
      passes with a WARN; a bare "**Superseded by: Decision N**" line added to an entry already over the cap fails
      and the message names the remedies); and TestLiveContractSwitch (the live contract carries measured_size_norm
      and options_considered, and the live DECISIONS.md entry whose envelope delegates
      size_governance.measured_size_norm.cap_bytes, found by that key and never by number, has both delegated keys
      resolving to numbers inside its own bounds).
  - file: tests/checks/decisions/test__baseline.py
    action: Modify
    purpose: >-
      base_file_text cases: text returned at origin/main, None when the path is absent there, None when git fails
      (subprocess patched, as the existing baseline cases do). Existing cases are unchanged, so the graduated shard
      decisions-baseline-reader-single-read is kept: its nodes and command are unchanged.
  - file: tests/checks/decisions/test_envelope_rules.py
    action: Modify
    purpose: delegates_issues and plan_issues cases, each FAIL branch and the passing shapes; split_delegated_key and dotted_value (yaml and yml paths, malformed keys, missing and present dotted paths).
  - file: tests/checks/decisions/test_validate_delegated_key_changes.py
    action: Create
    purpose: >-
      Mirror test, tmp-root fixtures with a fake baseline: class TestDelegatedKeyOnlyEntryFails (rec-3023's acceptance:
      a baseline entry delegates a key, the diff changes it inside bounds and adds a mechanism entry citing it ->
      FAIL), the same diff without the entry passes, a direction entry amending the delegator lets an out-of-bounds
      change pass and its absence fails it, {one_of} bounds and a non-numeric value under {min, max} fail outside
      them, {text} bounds are never evaluated, an unresolvable key WARNs, no "delegates:" substring in the
      base files -> examined(0) before any parse, the production root (root=None, get_changed_files patched) with no
      DECISIONS or yaml file changed -> examined(0), unreachable baseline -> skipped(); class TestBaseBoundsGovern
      (red before): bounds widened in place on the delegating entry plus a value outside the base bounds fails, the
      delegates block removed at head plus an out-of-bounds value fails, either change with a direction amender
      passes, and an archive move with delegates unchanged passes.
  - file: tests/checks/decisions/test_pinned_entry_size_policy.py
    action: Create
    purpose: >-
      Class TestPinnedEntryPolicy (rec-4744's acceptance file): the fixture's authored is entry_measure.authored,
      cap_bytes() equals size_governance.per_entry_size_norm.cap_bytes, and measured_size_norm is a distinct key (the
      pins never read it). test_decision_pin_measure.py is unchanged (its test_cap_is_the_contract_cap keeps 6144).
  - file: tests/checks/decisions/test__manifest.py
    action: Modify
    purpose: >-
      _REQUIRED_ENTRY_NAMES gains validate_delegated_key_changes, and one test asserts the
      validate_decision_entry_conformance Entry's pre_globs include docs/contracts/decision-compaction.yaml and both
      gated Entries' pre_globs include scripts/checks/decisions/entry_measure.py and
      scripts/checks/decisions/decisions_size_measure.py (red before: names and globs absent).
  - file: tests/checks/decisions/validate_decision_entry_conformance/test_delegates_plan.py
    action: Create
    purpose: >-
      The conformance check end to end on tmp roots: a new entry with a well-formed delegates passes, a malformed or
      unresolvable one fails, an unknown plan slug WARNs without failing; and the compaction message names
      docs/contracts/decision-compaction.yaml. (test_entry_rules.py is at 500 SLOC.)
  - file: tests/fixtures/decision_drafts/placeholder_conforming.txt
    action: Modify
    purpose: >-
      Gains a conforming "**Options considered:**" block within the measured cap, so the clean-draft fixture stays
      clean once plan_decision_drafts reads options_considered from the live contract. tests/test_plan_obligations.py
      (test_cli_decision_draft_prints_the_clean_line_and_exits_zero) is unchanged and keeps its "0 findings"
      expectation; VP 3 runs it.
  - file: tests/test_plan_decision_drafts.py
    action: Modify
    purpose: >-
      The _draft() helper emits a conforming options block, so every existing "0 findings" assertion (and the
      graduated nodes) stays green. A drafted entry missing the options block, over the measured cap, or with a malformed delegates is a FAIL
      finding; a delegates key its plan's sidecar creates is a WARN; a draft listed in
      config/decision_options_exemptions.yaml passes without an options block; plan_issues' unknown-slug case WARNs. The graduated shards plan-decision-drafts-report
      and serves-claim-verification-pins are kept: their nodes and commands are unchanged.
bundled_recommendations: [rec-3023, rec-5260, rec-4744, rec-3179]
followon_recs: [rec-5277, rec-5307]
infrastructure_dependencies:
  - "None. No .tf file and no Lambda-packaged file is in scope (scripts/checks and scripts/roadmap only)."
acceptance_criteria:
  - Decision {{N}} is in docs/DECISIONS.md word for word as the sidecar binds it, with kind direction, amends [167] and two delegates items, and its own measured span is under measured_size_norm.cap_bytes.
  - docs/contracts/decision-entry.yaml carries the mechanism_specification routing row, the delegates and plan field shapes, measured_size_norm and options_considered, and stays at or under 500 effective lines; decision-compaction.yaml is a resolving Class D contract.
  - A new mechanism entry that cites a key a baseline entry delegates, in a diff that changes that key, fails validate_delegated_key_changes; an out-of-bounds change fails unless a new direction entry amends the delegator.
  - A new entry without an options-considered block, or over the measured cap, fails validate_decisions_size; a baseline entry whose measured body grows past the cap fails; a dated annotation alone does not.
  - Every pin test that imports tests.fixtures.decision_entry still passes against the norm its entry landed under.
  - rec-3023, rec-5260, rec-4744 and rec-3179 close through the merge's Resolves trailer; rec-3682 (not bundled) is set superseded through the portal with Decision {{N}} as its closure artefact.
  - config/decision_options_exemptions.yaml is written by the derivation its scope row names, re-derived immediately before merge, and the build report prints the derived set beside the file's rows (they match).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Premises on the build's base, before any edit.
    command: >-
      bin/venv-python -c "import yaml, pathlib; c=yaml.safe_load(open('docs/contracts/decision-entry.yaml', encoding='utf-8'));
      print('compaction_mapping=' + str(isinstance(c.get('compaction'), dict)) + ' no_measured=' +
      str('measured_size_norm' not in c['size_governance']) + ' cap6144=' +
      str(c['size_governance']['per_entry_size_norm']['cap_bytes'] == 6144) + ' no_compaction_contract=' +
      str(not pathlib.Path('docs/contracts/decision-compaction.yaml').exists()) + ' no_new_check=' +
      str(not pathlib.Path('scripts/checks/decisions/validate_delegated_key_changes.py').exists()))"
    expected: One line, every field True.
    fix_if: A False means another plan changed these files first; stop and send a plan-defect report.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Red-before premise evidence that this build itself makes false; steps 2-7 are the standing guards.
  - step: 2
    phase: pre-deploy
    action: The measure, the size rules and the options rule (red before, green after).
    command: >-
      bin/venv-python -m pytest -q tests/checks/decisions/test_entry_measure.py
      tests/checks/decisions/test_decisions_size_measure.py
      tests/checks/decisions/test_validate_decisions_size.py::TestRejectedAlternativesRequired
      tests/checks/decisions/test_validate_decisions_size.py::TestProductionCostGate
      tests/checks/decisions/test__baseline.py
    expected: All selected tests pass; before the build they fail (modules and classes absent).
    fix_if: A failure names the rule; fix the code, never the fixture's expectation.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: decision-measured-cap-and-options
  - step: 3
    phase: pre-deploy
    action: Delegation grammar and the delegated-key check (red before, green after).
    command: >-
      bin/venv-python -m pytest -q tests/checks/decisions/test_validate_delegated_key_changes.py
      tests/checks/decisions/test_envelope_rules.py
      tests/checks/decisions/validate_decision_entry_conformance/test_delegates_plan.py tests/test_plan_decision_drafts.py
      tests/test_plan_obligations.py::TestMainCli::test_cli_decision_draft_prints_the_clean_line_and_exits_zero
    expected: All selected tests pass; before the build the new files and cases fail.
    fix_if: A failure names the rule; fix the code.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: decision-delegated-key-rules
  - step: 4
    phase: pre-deploy
    action: The pinned-entry policy and the manifest floor hold.
    command: >-
      bin/venv-python -m pytest -q tests/checks/decisions/test_pinned_entry_size_policy.py
      tests/checks/decisions/test__manifest.py
    expected: Both files pass; before the build test_pinned_entry_size_policy.py does not exist.
    fix_if: A pin failing means the fixture moved off the landed-under norm; restore cap_bytes() to per_entry_size_norm. The command equals the graduated shard decision-pinned-entry-policy. The modules that import tests.fixtures.decision_entry are run by the fast tier's affected-set test half and the full tier (VP 8), not replayed here.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: decision-pinned-entry-policy
  - step: 5
    phase: pre-deploy
    action: The bound words equal the sidecar, and the new Decision passes its own rules.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-delegation-and-cap-measure --base origin/main
      && bin/venv-python -m scripts.validate --pre
    expected: approved_text prints its OK line and validate --pre exits 0 (conformance, size, delegated-key and contract drift checks green on the real corpus).
    fix_if: A word mismatch is a build error (re-place the sidecar words); a check failure on Decision {{N}} is a plan defect (report it, never edit bound words).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-tree gate run; its parts are graduated by steps 2-4 and the registered checks themselves.
  - step: 6
    phase: pre-deploy
    action: Live corpus measures after the switch.
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.structural._classify import effective_lines; import
      pathlib; t=pathlib.Path('docs/contracts/decision-entry.yaml').read_text(encoding='utf-8'); c=yaml.safe_load(t);
      print('lines_ok=' + str(effective_lines(t) <= 500) + ' routing=' + str('mechanism_specification' in
      c['significance']['routing']) + ' pointer=' + str(isinstance(c['compaction'], str)))"
    expected: One line, every field True.
    fix_if: A False names the missing switch.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Each field already has a standing guard: the line budget is validate_structural_size's, and the routing row and
      the compaction pointer are sidecar-bound words that approved_text verify and validate_contract_drift hold.
  - step: 7
    phase: pre-deploy
    action: Each bundled rec's acceptance, run verbatim as merge_step's premerge preview runs it.
    command: >-
      grep -q 'mechanism_specification' docs/contracts/decision-entry.yaml && bin/venv-python -m pytest
      tests/checks/decisions/test_validate_delegated_key_changes.py::TestDelegatedKeyOnlyEntryFails -q && bin/venv-python
      -m pytest tests/checks/decisions/test_validate_decisions_size.py::TestRejectedAlternativesRequired -q &&
      bin/venv-python -m pytest -q tests/checks/decisions/test_pinned_entry_size_policy.py::TestPinnedEntryPolicy && bin/venv-python -m pytest
      tests/checks/decisions/test_decisions_size_measure.py::TestInPlaceGrowth -q
    expected: Exit 0; each pytest prints passed. Re-read each rec's acceptance with recs_by_ids first; a mismatch is a plan defect.
    fix_if: A failing acceptance means its test or file is missing; build it, never edit the acceptance.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Every pytest node in the chain is graduated by steps 2-4; the grep is a bound word that approved_text verify holds.
  - step: 8
    phase: pre-deploy
    action: >-
      Full tier, then HEAD attestation, after the build commit and final rebase and before the push (handoff_policy);
      start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The full tier exits 0 and the validation result attests the current HEAD's tree.
    fix_if: "Any failure; fix and rerun the full tier from the start. An out-of-scope red blocks the handoff (handoff_policy.timeout_disposition: blocked); report it and hand back."
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-tree handoff gate; it graduates nothing of its own and steps 2-4 carry the graduated checks.
  - step: 9
    phase: post-deploy
    action: Recs closed after merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows,_=fetch_recs_by_ids(make_reader(), ['rec-3023','rec-5260','rec-4744','rec-3179','rec-3682']);
      print(sorted((r['id'], r['status']) for r in rows))"
    expected: rec-3023, rec-5260, rec-4744 and rec-3179 closed; rec-3682 superseded.
    fix_if: An open bundled rec means the Resolves trailer did not land (git-ops.yaml resolves_trailer recovery route); rec-3682 open means the supersede write did not land, so re-run it.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/contracts/decision-entry.yaml
    behavior: The live contract carries measured_size_norm, options_considered and the delegated keys inside Decision {{N}}'s bounds.
    verification_step: 2
    test_selector: tests/checks/decisions/test_decisions_size_measure.py::TestLiveContractSwitch
    red_green_expectation: red before (keys absent), green after.
  - source: docs/contracts/decision-compaction.yaml
    behavior: The moved compaction contract resolves to its evaluator.
    verification_step: 5
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: validate_contract_drift's evaluator-resolution leg inside validate --pre fails without the file's evaluator literal; the words are sidecar-bound.
  - source: scripts/checks/decisions/entry_measure.py
    behavior: Each excluded span is located and removed exactly; authored is unchanged from the fixture's.
    verification_step: 2
    test_selector: tests/checks/decisions/test_entry_measure.py
    red_green_expectation: red before (module absent), green after.
  - source: scripts/checks/decisions/decisions_size_measure.py
    behavior: Measured cap, options-considered rule, exemption legs, in-place growth and the fail-closed leg fail or warn as specified.
    verification_step: 2
    test_selector: tests/checks/decisions/test_decisions_size_measure.py
    red_green_expectation: red before (module absent), green after.
  - source: scripts/checks/decisions/validate_decisions_size.py
    behavior: The wiring reads the contract and lists, a contract-only diff reaches the fail-closed leg, and an absent contract keeps today's behaviour.
    verification_step: 2
    test_selector: tests/checks/decisions/test_validate_decisions_size.py::TestProductionCostGate
    red_green_expectation: red before (a contract-only diff returns examined(0)), green after.
  - source: scripts/checks/decisions/_baseline.py
    behavior: base_file_text returns origin/main's text or None.
    verification_step: 2
    test_selector: tests/checks/decisions/test__baseline.py
    red_green_expectation: red before (function absent), green after.
  - source: scripts/checks/decisions/envelope_rules.py
    behavior: delegates and plan shape rules fail or warn as specified.
    verification_step: 3
    test_selector: tests/checks/decisions/test_envelope_rules.py
    red_green_expectation: red before (functions absent), green after.
  - source: scripts/checks/decisions/validate_decision_entry_conformance.py
    behavior: The gate applies the delegates and plan rules to new entries and names the compaction contract.
    verification_step: 3
    test_selector: tests/checks/decisions/validate_decision_entry_conformance/test_delegates_plan.py
    red_green_expectation: red before, green after.
  - source: scripts/checks/decisions/validate_delegated_key_changes.py
    behavior: A mechanism entry re-setting a delegated key fails; out-of-bounds changes and in-place changes to a delegation need a direction amender; bounds come from origin/main.
    verification_step: 3
    test_selector: tests/checks/decisions/test_validate_delegated_key_changes.py
    red_green_expectation: red before (module absent), green after.
  - source: scripts/checks/decisions/_manifest.py
    behavior: The new check is registered in both tiers and resolves; the conformance Entry globs the new contract.
    verification_step: 4
    test_selector: tests/checks/decisions/test__manifest.py
    red_green_expectation: red before (_REQUIRED_ENTRY_NAMES and the pre_globs assertion fail), green after.
  - source: scripts/checks/verification/_manifest.py
    behavior: validate_admin_root_premerge_gate's pre_globs cover entry_measure.py and decisions_size_measure.py.
    verification_step: 4
    test_selector: tests/checks/decisions/test__manifest.py
    red_green_expectation: red before (glob absent), green after.
  - source: scripts/checks/roadmap/_manifest.py
    behavior: validate_plan_scope_closure's pre_globs cover entry_measure.py and decisions_size_measure.py.
    verification_step: 4
    test_selector: tests/checks/decisions/test__manifest.py
    red_green_expectation: red before (glob absent), green after.
  - source: config/decision_options_exemptions.yaml
    behavior: A listed sidecar's drafted entry is exempt from the options rule only (the shrink-only legs are decisions_size_measure.py's obligation).
    verification_step: 2
    test_selector: tests/checks/decisions/test_validate_decisions_size.py::TestRejectedAlternativesRequired
    red_green_expectation: red before (no options rule, no exemption read), green after.
  - source: scripts/roadmap/plan_decision_drafts.py
    behavior: Drafts get the same delegates, plan, options and measured-size findings as the gate.
    verification_step: 3
    test_selector: tests/test_plan_decision_drafts.py
    red_green_expectation: red before, green after.
  - source: tests/fixtures/decision_entry.py
    behavior: Pins measure with the shared classifier against the landed-under norm.
    verification_step: 4
    test_selector: tests/checks/decisions/test_pinned_entry_size_policy.py::TestPinnedEntryPolicy
    red_green_expectation: red before (file absent; the fixture holds its own classifier), green after.
  - source: config/ci_rca_taxonomy.yaml
    behavior: The new check has a taxonomy row.
    verification_step: 5
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: The taxonomy coverage check inside validate --pre is the existing guard that fails without the row.
constraints:
  - "Every edit to docs/DECISIONS.md, docs/contracts/decision-entry.yaml and docs/contracts/decision-compaction.yaml is a sidecar block, word for word (approved_text_binding); fill only {{N}} and {{DATE}}."
  - Forward-only except clause 6's in-place growth leg; never edit an existing entry's body or envelope (Decision 177).
  - No raise of any file size budget (Decisions 128, 145, 166 point 6); decompose instead. The per-entry cap's re-measure is Decision {{N}} cl.4's stated retune.
  - Merge after the condition-reviews build (rec-5255) merges (the itinerary's order, since both edit Decision 167); this is sequencing, not a technical tie, as DECISIONS-2 applies in either order. If this build is ready first, hold its PR open (green) and hand the order back to the coordinator.
  - No rescue agents or workaround loops (Decision 55).
