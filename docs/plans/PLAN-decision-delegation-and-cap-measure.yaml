schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-delegation-and-cap-measure
intent: >-
  Amend Decision 167 so the decision corpus stops growing by amendment and stops paying for its size cap in rationale
  (audit findings CFR-01 and CFR-02): a new Decision may delegate its values to a named contract or config key with a
  change rule and bounds, mechanism specification gains its own routing row, a new mechanism entry that only re-sets a
  delegated key fails, the per-entry cap measures the entry without its envelope, reversal stanza and options-considered
  block, every new entry names the options it rejected, and in-body growth past the cap fails. One new direction
  Decision, its contract text and its checks land in one build PR, all bound words under one approved-text sidecar.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-delegation-and-cap-measure.yaml
phase: >-
  user_explicit_out_of_scope (operator remit 2026-11-17: the contract-first retrospective's findings,
  audits/contract-first-retrospective-177c8f37.yaml; recs only, no roadmap item, WORK-ORDER question 7). Closes no
  tier_item criterion; T2.56 is complete.
cites: [dec:150, dec:151, dec:166, dec:167, dec:168, dec:177, dec:181, dec:243, dec:246]
scope:
  # ------------------------------------------------- bound words (docs/plans/approved/decision-delegation-and-cap-measure.yaml)
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Sidecar blocks DECISIONS-1 and DECISIONS-2 only: insert Decision {{N}} (direction, amends 167) after the file's
      header paragraph, and append the dated "Amended by Decision {{N}}" forward pointer as the last paragraph of
      Decision 167's block (validate_supersession_annotations; Decision 177's dated-annotation form), filling {{N}} with
      MAX + 1 and {{DATE}} at build time (decision-entry.yaml metadata_envelope.number_assignment). No other edit.
      DECISIONS-2 anchors on the separator and Decision 166's heading, so it applies before or after the
      condition-reviews build's own note on Decision 167 (PR #2116); if a before still fails to match, stop and hand
      back for a sidecar refresh and a new approval run, never a hand-merged edit.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      Sidecar blocks decision-entry-1..11 only: contract_version 2 and one amendment_log row; optional_fields gains
      delegates and plan with their field_shapes; significance.routing gains mechanism_specification and routing_rule
      question (3) names it; compaction becomes a one-line pointer and the two prose pointers to it name the new file;
      size_governance keeps per_entry_size_norm as the norm earlier entries landed under and gains measured_size_norm
      (cap_bytes, measured_as, tier, in_place_growth) and options_considered (marker, none_form, cap_bytes, rule,
      exempt);
      accretion_signal.flips_to_hard_fail_when records the in-body flip. No other edit.
  - file: docs/contracts/decision-compaction.yaml
    action: Create
    purpose: >-
      Sidecar block decision-compaction-new only: a ratified Class D contract (subject decision-compaction, evaluator
      validate_decision_entry_conformance) holding decision-entry.yaml's compaction section, words unchanged except
      marker_spelling's cross-file pointer. Split by subject so decision-entry.yaml has headroom (493 -> about 472 of
      500 effective lines).
  # ------------------------------------------------- code
  - file: scripts/checks/decisions/entry_measure.py
    action: Create
    purpose: >-
      Pure measure functions on scripts.decisions_md's grammar (no file reads, never raises on text): authored(entry)
      and authored_bytes(entry) moved verbatim from tests/fixtures/decision_entry.py; envelope_span(entry) and
      stanza_span(entry) (the bare ```yaml fence after the heading; the ```yaml reversal-conditions fence);
      options_block(entry, marker) -> the text from the marker to the next line starting with "**", a fence or a
      heading, or None; dated_annotation_spans(entry) (every paragraph matching amendment_forms general_rule, anywhere
      in the body: a run of lines starting "> **" with a ":**" label, dated or not (a "Supersession note" counts), or
      a bracketed "[Amendment DATE" paragraph; it is deliberately wider than authored's trailing dated run, which the
      pins keep, and its docstring says so);
      measured_bytes(entry, excluded) where excluded is a subset of {metadata_envelope, reversal_conditions,
      options_considered, dated_annotations} (UTF-8 bytes of the entry with those spans removed).
    new_imports: [scripts.decisions_md]
  - file: scripts/checks/decisions/validate_decisions_size.py
    action: Modify
    purpose: >-
      Contract seam: read size_governance from root / docs/contracts/decision-entry.yaml (root is the check's injected
      root, the repo root in production). File absent under root (every existing tmp-root test) -> today's behaviour
      exactly: _PER_ENTRY_CAP_BYTES (6144) whole-span, no measured, options or growth legs, so the existing classes
      need no edit. File present but unparseable, or without size_governance.per_entry_size_norm.cap_bytes -> FAIL
      "decision-entry.yaml unreadable", never a silent pass. Exemptions: root / config/decision_options_exemptions.yaml
      (absent -> none); a new entry whose heading title equals a listed row's title (after {{N}} is filled) is exempt
      from the options rule only; a listed slug whose sidecar file is gone is a WARN. Shrink-only leg (Decision 170
      cl.3, Decision 244 cl.2 precedent): FAIL a head row (slug, title) absent from origin/main's list, and FAIL the
      file appearing at head when origin/main already carries size_governance.options_considered (so only the build
      PR creates it). The changed-files cost gate (today examined(0) unless a DECISIONS file is in the diff) widens to
      docs/DECISIONS.md, docs/DECISIONS_ARCHIVE.md and config/decision_options_exemptions.yaml. Seam:
      base_text_reader(root, rel) -> the file's text at origin/main or None (as validate_delegated_key_changes), so
      tests inject a base list and base contract. origin/main unreachable -> the shrink-only leg adds nothing and the
      run's single terminal declaration stays the other legs' examined(n) (Decision 170); with every leg unable to
      run, skipped(). When size_governance.measured_size_norm is present: a new-in-diff entry fails
      when measured_bytes(entry, {metadata_envelope, reversal_conditions, options_considered}) exceeds its cap_bytes;
      a baseline entry fails when measured_bytes(.., + dated_annotations) at head is greater than at base and greater
      than cap_bytes (in_place_growth); an entry absent at head (archived, Decision 146) is never growth. When size_governance.options_considered is present: a new-in-diff entry fails
      when the marker is absent, the block is empty, the block starts with "none considered" without " -- " and a
      reason, or the block exceeds its cap_bytes. When either key is absent that leg is off (whole-span cap from
      per_entry_size_norm, no options rule). The WARN accretion legs are unchanged. Error text cites the contract key
      and Decision {{N}}'s clause.
    new_imports: [scripts.checks.decisions.entry_measure]
  - file: scripts/checks/decisions/envelope_rules.py
    action: Modify
    purpose: >-
      Add delegates_issues(envelope, change_rules, resolve) (FAIL: not a non-empty list; an item not a mapping with
      exactly key, change_rule, bounds; key not matching <path>.(yaml|yml)#<dotted>; change_rule outside change_rules;
      bounds not exactly one of {min, max} with numeric min <= max, {one_of} non-empty list, {text} non-empty one-line
      string; resolve(key) False) and plan_issues(envelope, plan_exists) (FAIL when plan is not a slug string
      ^[a-z0-9][a-z0-9-]*$; WARN text when plan_exists(slug) is False). _shape_detail names delegates and plan shape
      faults. resolve and plan_exists are injected callables, so the module stays file-read-free.
    new_imports: []
  - file: scripts/checks/decisions/validate_decision_entry_conformance.py
    action: Modify
    purpose: >-
      Call delegates_issues (change_rules read from metadata_envelope.field_shapes.delegates.change_rules; resolve =
      the head file at the key's path parses and the dotted path exists) and plan_issues (plan_exists = the head file
      docs/plans/PLAN-<slug>.yaml exists; its WARN prints, never fails) inside _new_entry_conformance_issues, only when
      the envelope carries the field. The two compaction.stub_grammar messages name docs/contracts/decision-compaction.yaml
      through a module constant _COMPACTION_CONTRACT_REL_PATH (the new contract's evaluator literal). Stays under 500
      SLOC (406 now): if the build crosses it, move the new calls into a helper in envelope_rules.py.
    new_imports: []
  - file: scripts/checks/decisions/validate_delegated_key_changes.py
    action: Create
    purpose: >-
      Registered check validate_delegated_key_changes (owner platform). Cost gate first: if no head envelope in
      docs/DECISIONS.md or docs/DECISIONS_ARCHIVE.md carries a delegates key, examined(0) and return before any
      baseline or git read. Delegations = every such head entry whose number is in the origin/main baseline (the
      check is inert until Decision {{N}} merges). For each
      delegated key whose file is in the diff (_common.get_changed_files) and whose parsed value differs between
      origin/main and head: (a) FAIL each new-in-diff entry whose kind.value is mechanism, whose envelope has no
      delegates, and whose text outside its envelope names the key's file basename and either the full dotted key or
      its last two segments joined by "." (the last segment for a one-segment key); (b) when bounds is {min, max} or
      {one_of}, FAIL a head value outside them (a non-numeric value under {min, max} is outside) unless a new-in-diff
      entry with kind.value direction lists the delegating Decision in its envelope amends. {text} bounds are never
      evaluated. A delegated key that no longer resolves at head is a WARN. origin/main unreachable -> skipped().
      Seams: root, baseline_reader (decision numbers), base_text_reader(root, rel) -> text at origin/main or None.
    new_imports: [scripts.checks._common, scripts.checks.registry, scripts.checks.decisions._baseline, scripts.decisions_md]
  - file: scripts/checks/decisions/_manifest.py
    action: Modify
    purpose: >-
      One Entry for validate_delegated_key_changes: pre=True with no pre_globs (a delegated key may live in any file,
      so it is ungated like validate_decisions_size and cost-gates itself), full_segment full_after_lint. The
      validate_decision_entry_conformance Entry's pre_globs gain docs/contracts/decision-compaction.yaml.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      validate_admin_root_premerge_gate's pre_globs gain scripts/checks/decisions/entry_measure.py (plan_decision_drafts
      imports it; plan_obligations pre_globs closure).
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      validate_plan_scope_closure's pre_globs gain scripts/checks/decisions/entry_measure.py (same closure).
  - file: config/decision_options_exemptions.yaml
    action: Create
    purpose: >-
      The options rule's exemption list (decision-entry.yaml options_considered.exempt): `exempt_sidecars:` a list
      sorted by slug of {slug, title} rows, title being the drafted heading after "## Decision {{N}}: ". The build
      writes it once, after its final rebase, with every docs/plans/approved/*.yaml on that
      base whose DECISIONS.md block drafts a "## Decision {{N}}" entry lacking "**Options considered:**" and whose
      title is not yet in docs/DECISIONS.md (at planning: persona-check-origin, telemetry-content-reader-api-lock, wording-approval-routing).
      Later edits only remove slugs.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      One row, validate_delegated_key_changes -> schema_drift, beside validate_decisions_size's row. The file is at
      492 of 500 effective lines and other unbuilt plans add rows: measure at build time, and if the row does not fit,
      relieve by compacting rows (words unchanged), never a raise.
  - file: scripts/roadmap/plan_decision_drafts.py
    action: Modify
    purpose: >-
      Apply the same rules to drafted entries at planning time: delegates_issues and plan_issues (FAIL / WARN as at
      the gate, except that a delegates key which does not resolve at head but whose file the plan's own sidecar binds
      is a WARN, since the sidecar creates it), a FAIL when a drafted entry lacks the options_considered marker or
      breaks its rule (unless config/decision_options_exemptions.yaml lists its plan's slug and title), and a FAIL when measured_bytes exceeds measured_size_norm.cap_bytes, each read from
      decision-entry.yaml and skipped when the key is absent.
    new_imports: [scripts.checks.decisions.entry_measure]
  - file: tests/fixtures/decision_entry.py
    action: Modify
    purpose: >-
      authored and authored_bytes re-export scripts.checks.decisions.entry_measure's (one classifier, rec-4744);
      cap_bytes() keeps reading size_governance.per_entry_size_norm.cap_bytes, the norm the pinned entries landed
      under.
  # ------------------------------------------------- tests
  - file: tests/checks/decisions/test_entry_measure.py
    action: Create
    purpose: >-
      Mirror test for entry_measure.py (every span, each exclusion, measured_bytes arithmetic, no-span entries, an
      undated "> **Supersession note:**" paragraph counted as an annotation).
  - file: tests/checks/decisions/test_validate_decisions_size.py
    action: Modify
    purpose: >-
      Add class TestRejectedAlternativesRequired (rec-5260's acceptance), one parametrized test of at most 45 SLOC
      writing a tmp-root contract: entries missing the marker, empty, "none considered" without a reason, and over
      the block cap fail; a conforming block passes; an entry listed through config/decision_options_exemptions.yaml
      passes without one; a head row absent from the injected base list fails, including in a diff that touches only
      config/decision_options_exemptions.yaml, as does the file appearing when the base contract already carries
      options_considered; with no contract under root nothing is required. Existing classes are unchanged (no contract
      under their tmp roots), so the graduated shards decisions-per-entry-cap-hard-fails,
      decisions-size-per-entry-cap-warn-tier, decisions-size-standing-pressure-single-line,
      decisions-size-warn-never-fails, decisions-stock-ceilings-retired and root-scoped-diff-base-declaration-adoption
      are kept: their nodes and commands are unchanged. The file stays under 500 SLOC (444 now).
  - file: tests/checks/decisions/test_decisions_size_measure.py
    action: Create
    purpose: >-
      The measured cap (an entry over the whole-span cap but under measured_size_norm passes; one over it fails; the
      excluded blocks are excluded), class TestInPlaceGrowth (a baseline entry whose measured span grows past the cap
      fails; one growing only by a dated annotation, or shrinking, or growing while under the cap, or moved to the
      archive, passes), the
      fallback to today's behaviour when the keys are absent, and TestLiveContractSwitch (the live contract carries
      measured_size_norm, options_considered and Decision {{N}}'s delegated keys resolve to numbers inside the
      Decision's own bounds).
  - file: tests/checks/decisions/test_envelope_rules.py
    action: Modify
    purpose: delegates_issues and plan_issues cases, each FAIL branch and the passing shapes.
  - file: tests/checks/decisions/test_validate_delegated_key_changes.py
    action: Create
    purpose: >-
      Mirror test, tmp-root fixtures with a fake baseline: class TestDelegatedKeyOnlyEntryFails (rec-3023's acceptance:
      a baseline entry delegates a key, the diff changes it inside bounds and adds a mechanism entry citing it ->
      FAIL), the same diff without the entry passes, a direction entry amending the delegator lets an out-of-bounds
      change pass and its absence fails it, {text} bounds are never evaluated, an unresolvable key WARNs, no
      delegations -> examined(0), unreachable baseline -> skipped().
  - file: tests/checks/decisions/test_pinned_entry_size_policy.py
    action: Create
    purpose: >-
      Class TestPinnedEntryPolicy (rec-4744's acceptance file): the fixture's authored is entry_measure.authored,
      cap_bytes() equals size_governance.per_entry_size_norm.cap_bytes, and measured_size_norm is a distinct key (the
      pins never read it). test_decision_pin_measure.py is unchanged (its test_cap_is_the_contract_cap keeps 6144).
  - file: tests/checks/decisions/test__manifest.py
    action: Modify
    purpose: >-
      _REQUIRED_ENTRY_NAMES gains validate_delegated_key_changes, and one test asserts the
      validate_decision_entry_conformance Entry's pre_globs include docs/contracts/decision-compaction.yaml and both
      gated Entries' pre_globs include scripts/checks/decisions/entry_measure.py (red before: names and globs absent).
  - file: tests/checks/decisions/validate_decision_entry_conformance/test_delegates_plan.py
    action: Create
    purpose: >-
      The conformance check end to end on tmp roots: a new entry with a well-formed delegates passes, a malformed or
      unresolvable one fails, an unknown plan slug WARNs without failing; and the compaction message names
      docs/contracts/decision-compaction.yaml. (test_entry_rules.py is at 500 SLOC.)
  - file: tests/fixtures/decision_drafts/placeholder_conforming.txt
    action: Modify
    purpose: >-
      Gains a conforming "**Options considered:**" block within the measured cap, so the clean-draft fixture stays
      clean once plan_decision_drafts reads options_considered from the live contract. tests/test_plan_obligations.py
      (test_cli_decision_draft_prints_the_clean_line_and_exits_zero) is unchanged and keeps its "0 findings"
      expectation; VP 3 runs it.
  - file: tests/test_plan_decision_drafts.py
    action: Modify
    purpose: >-
      The _draft() helper emits a conforming options block, so every existing "0 findings" assertion (and the
      graduated nodes) stays green. A drafted entry missing the options block, over the measured cap, or with a malformed delegates is a FAIL
      finding; a delegates key its plan's sidecar creates is a WARN. The graduated shards plan-decision-drafts-report
      and serves-claim-verification-pins are kept: their nodes and commands are unchanged.
bundled_recommendations: [rec-3023, rec-5260, rec-4744, rec-3179]
followon_recs: [rec-5277]
infrastructure_dependencies:
  - "None. No .tf file and no Lambda-packaged file is in scope (scripts/checks and scripts/roadmap only)."
acceptance_criteria:
  - Decision {{N}} is in docs/DECISIONS.md word for word as the sidecar binds it, with kind direction, amends [167] and two delegates items, and its own measured span is under measured_size_norm.cap_bytes.
  - docs/contracts/decision-entry.yaml carries the mechanism_specification routing row, the delegates and plan field shapes, measured_size_norm and options_considered, and stays at or under 500 effective lines; decision-compaction.yaml is a resolving Class D contract.
  - A new mechanism entry that cites a key a baseline entry delegates, in a diff that changes that key, fails validate_delegated_key_changes; an out-of-bounds change fails unless a new direction entry amends the delegator.
  - A new entry without an options-considered block, or over the measured cap, fails validate_decisions_size; a baseline entry whose measured body grows past the cap fails; a dated annotation alone does not.
  - Every pin test that imports tests.fixtures.decision_entry still passes against the norm its entry landed under.
  - rec-3023, rec-5260, rec-4744 and rec-3179 close through the merge's Resolves trailer; rec-3682 (not bundled) is set superseded through the portal with Decision {{N}} as its closure artefact.
  - config/decision_options_exemptions.yaml lists exactly the approved, unbuilt sidecars on the final base whose drafted Decision lacks an options block.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Premises on the build's base, before any edit.
    command: >-
      bin/venv-python -c "import yaml, pathlib; c=yaml.safe_load(open('docs/contracts/decision-entry.yaml', encoding='utf-8'));
      print('compaction_mapping=' + str(isinstance(c.get('compaction'), dict)) + ' no_measured=' +
      str('measured_size_norm' not in c['size_governance']) + ' cap6144=' +
      str(c['size_governance']['per_entry_size_norm']['cap_bytes'] == 6144) + ' no_compaction_contract=' +
      str(not pathlib.Path('docs/contracts/decision-compaction.yaml').exists()) + ' no_new_check=' +
      str(not pathlib.Path('scripts/checks/decisions/validate_delegated_key_changes.py').exists()))"
    expected: One line, every field True.
    fix_if: A False means another plan changed these files first; stop and send a plan-defect report.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Red-before premise evidence that this build itself makes false; steps 2-7 are the standing guards.
  - step: 2
    phase: pre-deploy
    action: The measure, the size rules and the options rule (red before, green after).
    command: >-
      bin/venv-python -m pytest -q tests/checks/decisions/test_entry_measure.py
      tests/checks/decisions/test_decisions_size_measure.py
      tests/checks/decisions/test_validate_decisions_size.py::TestRejectedAlternativesRequired
    expected: All selected tests pass; before the build they fail (modules and classes absent).
    fix_if: A failure names the rule; fix the code, never the fixture's expectation.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: decision-measured-cap-and-options
  - step: 3
    phase: pre-deploy
    action: Delegation grammar and the delegated-key check (red before, green after).
    command: >-
      bin/venv-python -m pytest -q tests/checks/decisions/test_validate_delegated_key_changes.py
      tests/checks/decisions/test_envelope_rules.py
      tests/checks/decisions/validate_decision_entry_conformance/test_delegates_plan.py tests/test_plan_decision_drafts.py
      tests/test_plan_obligations.py
    expected: All selected tests pass; before the build the new files and cases fail.
    fix_if: A failure names the rule; fix the code.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: decision-delegated-key-rules
  - step: 4
    phase: pre-deploy
    action: The pinned-entry policy, the manifest floor and every Decision pin hold.
    command: >-
      bin/venv-python -m pytest -q tests/checks/decisions/test_pinned_entry_size_policy.py
      tests/checks/decisions/test__manifest.py && bin/venv-python -m pytest -q tests/checks/decisions/
      tests/checks/contracts/test_ops_rule_source_records.py tests/ci_rca/test_recovery_policy_surfaces.py
      tests/decisions/test_decision_67_supersession.py
    expected: All pass, including every module that imports tests.fixtures.decision_entry and test__manifest.py.
    fix_if: A pin failing means the fixture moved off the landed-under norm; restore cap_bytes() to per_entry_size_norm. The graduated shard decision-pinned-entry-policy names only the first pytest command (the two files); the second is a whole-directory regression run.
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: decision-pinned-entry-policy
  - step: 5
    phase: pre-deploy
    action: The bound words equal the sidecar, and the new Decision passes its own rules.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-delegation-and-cap-measure --base origin/main
      && bin/venv-python -m scripts.validate --pre
    expected: approved_text prints its OK line and validate --pre exits 0 (conformance, size, delegated-key and contract drift checks green on the real corpus).
    fix_if: A word mismatch is a build error (re-place the sidecar words); a check failure on Decision {{N}} is a plan defect (report it, never edit bound words).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-tree gate run; its parts are graduated by steps 2-4 and the registered checks themselves.
  - step: 6
    phase: pre-deploy
    action: Live corpus measures after the switch.
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.structural._classify import effective_lines; import
      pathlib; t=pathlib.Path('docs/contracts/decision-entry.yaml').read_text(encoding='utf-8'); c=yaml.safe_load(t);
      print('lines_ok=' + str(effective_lines(t) <= 500) + ' routing=' + str('mechanism_specification' in
      c['significance']['routing']) + ' pointer=' + str(isinstance(c['compaction'], str)))"
    expected: One line, every field True.
    fix_if: A False names the missing switch.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Each field already has a standing guard: the line budget is validate_structural_size's, and the routing row and
      the compaction pointer are sidecar-bound words that approved_text verify and validate_contract_drift hold.
  - step: 7
    phase: pre-deploy
    action: Each bundled rec's acceptance, run verbatim as merge_step's premerge preview runs it.
    command: >-
      grep -q 'mechanism_specification' docs/contracts/decision-entry.yaml && bin/venv-python -m pytest
      tests/checks/decisions/test_validate_delegated_key_changes.py::TestDelegatedKeyOnlyEntryFails -q && bin/venv-python
      -m pytest tests/checks/decisions/test_validate_decisions_size.py::TestRejectedAlternativesRequired -q &&
      bin/venv-python -m pytest -q tests/checks/decisions/test_pinned_entry_size_policy.py::TestPinnedEntryPolicy && bin/venv-python -m pytest
      tests/checks/decisions/test_decisions_size_measure.py::TestInPlaceGrowth -q
    expected: Exit 0; each pytest prints passed. Re-read each rec's acceptance with recs_by_ids first; a mismatch is a plan defect.
    fix_if: A failing acceptance means its test or file is missing; build it, never edit the acceptance.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Every pytest node in the chain is graduated by steps 2-4; the grep is a bound word that approved_text verify holds.
  - step: 8
    phase: pre-deploy
    action: >-
      Full tier, then HEAD attestation, after the build commit and final rebase and before the push (handoff_policy);
      start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The full tier exits 0 and the validation result attests the current HEAD's tree.
    fix_if: Any failure; fix and rerun the full tier from the start. A red on main outside this scope follows the operator's 2026-11-17 override (context).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-tree handoff gate; it graduates nothing of its own and steps 2-4 carry the graduated checks.
  - step: 9
    phase: post-deploy
    action: Recs closed after merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows,_=fetch_recs_by_ids(make_reader(), ['rec-3023','rec-5260','rec-4744','rec-3179','rec-3682']);
      print(sorted((r['id'], r['status']) for r in rows))"
    expected: rec-3023, rec-5260, rec-4744 and rec-3179 closed; rec-3682 superseded.
