pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Run VP 1 on the base; any False stops the build (plan-defect report).
  - Write the new tests (VP 2-4 selections) and confirm they fail on the base (red before).
  - Create entry_measure.py and validate_delegated_key_changes.py; edit validate_decisions_size.py, envelope_rules.py, validate_decision_entry_conformance.py, _manifest.py, ci_rca_taxonomy.yaml, plan_decision_drafts.py and the fixture, each per its scope row.
  - Place the sidecar's words in docs/DECISIONS.md, decision-entry.yaml and decision-compaction.yaml; fill {{N}} (MAX + 1 after rebasing) and {{DATE}}.
  - Execute the Verification Plan -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
  - "Commit with Resolves: rec-3023, rec-5260, rec-4744, rec-3179 in the body; after merge, close rec-3682 as superseded through the portal (closure artefact: Decision {{N}}) and run VP 7."
  - "Report: what was implemented, verification results"
rollback: >-
  Revert the build PR whole: the Decision, its contract keys and its checks go together, and the checks fall back to
  today's behaviour when the keys are absent. A revert of DECISIONS.md text is itself sidecar-bound wording, so it is a
  new plan with its own sidecar, or an operator merge in the GitHub UI.
