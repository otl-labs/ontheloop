pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Run VP 1 on the base; any False stops the build (plan-defect report).
  - Write the new tests (VP 2-4 selections) and confirm they fail on the base (red before).
  - Create entry_measure.py, decisions_size_measure.py and validate_delegated_key_changes.py; edit validate_decisions_size.py, _baseline.py, envelope_rules.py, validate_decision_entry_conformance.py, _manifest.py, ci_rca_taxonomy.yaml, plan_decision_drafts.py and the fixture, each per its scope row.
  - Place the sidecar's words in docs/DECISIONS.md, decision-entry.yaml and decision-compaction.yaml; fill {{N}} (MAX + 1 after rebasing) and {{DATE}}.
  - Execute the Verification Plan -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
  - "After the final rebase, write config/decision_options_exemptions.yaml per its scope row (both sources) and re-run VP 2 and VP 5. Immediately before merge, re-derive it; if a row is missing, commit the refreshed list, let CI re-run, and only then merge."
  - "CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true; the graduation walk writes the registry shards decision-measured-cap-and-options, decision-delegated-key-rules and decision-pinned-entry-policy; commit with Resolves: rec-3023, rec-5260, rec-4744, rec-3179; git fetch origin main && git rebase origin/main (refill {{N}} if main gained a Decision, re-derive the exemption list); VP 7; VP 8 (full tier backgrounded from the top-level session, then --verify-head); push; open the PR; subscribe; code review in a fresh context; merge on code review PROCEED and green CI with the same Resolves trailer in the squash body; report each outcome separately (readiness, validator evidence, push, PR, review, merge_step premerge and readback) and attach the structured postflight evidence the handoff policy requires."
  - "After merge: set rec-3682 superseded through the portal (closure artefact Decision {{N}}; resolution names Decision {{N}} for the citation-lint and dense-measurement halves, since measurements route to contract keys under its routing row, and rec-5255's build for condition (a)); run VP 9."
  - "Report: what was implemented, verification results"
rollback: >-
  Before merge: close the PR. After merge, never delete Decision {{N}}'s heading or its annotation on Decision 167
  (Decision 149 never_remove_headers, Decision 177's correction dialect; a vanished heading also trips
  _assert_no_orphaned_current_rows after the decisions backfill). Reversal is a new kind-direction Decision that amends
  or supersedes Decision {{N}} through its reversal stanza, planned with its own sidecar, landing in the same PR that
  removes or relaxes measured_size_norm, options_considered and validate_delegated_key_changes; the fail-closed leg
  admits exactly that, and the checks fall back to today's behaviour once the keys are absent. Code-only defects in
  the new checks are forward-fixed (Decision 226).
