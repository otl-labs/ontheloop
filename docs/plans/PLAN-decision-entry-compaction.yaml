pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - decision-entry.yaml on origin/main still measures 505 effective lines (else stop and escalate through the coordinator)
execution_steps:
  - >-
    Rebase onto origin/main. Confirm docs/contracts/decision-entry.yaml and config/structural_size_budgets.yaml are
    unchanged since this plan merged (git log); if either changed, stop and escalate to the planning thread through the
    coordinator -- never re-derive the wording.
  - |-
    APPROVED TEXT (decision-entry.yaml leaves, as parsed; dotted paths index lists from 0; VP step 2 reads this block)
      contract.description: >-
        Class D mechanism-contract envelope (migration-step-3-grandfathering, T2.56 migration step 3)
        for the decision-entry authoring grammar that the sections below carry.
      header_grammar_note: >-
        '## Decision NNN:' (h2) is the sole authoring convention for docs/DECISIONS.md and
        docs/DECISIONS_ARCHIVE.md; no entry may be AUTHORED at h3 (the archive's h3 Decisions 52/53/54
        were promoted to h2 by DPI-07). scripts/decisions_md.py's shared _DECISION_HEADING_RE grammar
        (r"^#{2,3}\s+Decision\s+(\d+):\s*(.+)$") still tolerates h3 for pre-promote git history.
      amendment_forms.0.description: >-
        A blockquote-bold annotation line ("> **...:**") terminates a typed id-list field (e.g.
        Related); the one NON-blockquote form, a trailing "[Amendment DATE: ...]", needs its own
        "[Amendment " opener. This vocabulary is also the Decision 151 clause 3(ii) in-Intent accretion
        vocabulary (intent_accretion_note), which field_grammar.prose_terminator never truncates.
      intent_accretion_note: >-
        The optional Intent marker (Decision 151, DCG-06) is draft-until-merge; after ratification the
        original Intent text is never rewritten -- clarifications, caveats, and exceptions accrue as
        dated, `<source>`-cited, append-only annotations inside the Intent section, in any
        amendment_forms.general_rule shape (or the "[Amendment " form), capped at roughly 3
        clarifications or ~120-150 words before escalating to a superseding Decision plus a Decision 149
        compaction of the superseded entry. Convention-only (Decision 146 operator-disposed stance; no
        validator, no stored guard). Load-bearing on the PARSER side (Decision 151 clause 3(ii)):
        field_grammar.prose_terminator keeps this accretion in the typed intent value
        (tests/test_decision_field_grammar.py::test_intent_retains_dated_in_section_accretion).
      supersession_marker_note: >-
        MUST be spelled EXACTLY as above for a NEW entry (scripts.decisions_md._SUPERSEDED_BY_RE's
        primary form, byte-identical). The historical band's "**Superseded by:** Decision N" (colon
        after "by") is tolerated read-side by the same regex's fallback but is NOT valid for a new
        entry.
      block_separator.historical_band: >-
        Grandfathered, not retro-enforced: 21 of 146 entries at CFG-06 plan time lack it (23, 48, 64,
        65, 76, 94, 102, 103, 118 and 152-163); rec-3049 tracks retro-standardisation.
      block_separator.reason: >-
        Majority convention (125/146) and current practice (Decisions 164-166) agree, so forward
        enforcement is low-risk; nothing mechanical depends on the separator (blocks are
        heading-delimited by _iter_decision_sections; end-of-block covers the no-separator case in every
        terminator lookahead) -- purely an authoring-consistency gap.
      field_grammar.title_relation_continuation.accepted_forms.0.reason: >-
        dec-160's real title: a ', Decision N' and an 'and Decision N' continuation together.
      field_grammar.title_relation_continuation.accepted_forms.4.reason: >-
        a bare-number continuation followed by a recognized qualifier (clause N / point N / cl.N) stays
        admitted; the boundary excludes only open-ended prose.
      field_grammar.title_relation_continuation.rejected_forms.1.reason: >-
        an ordinal ('2nd') fails the \b word-boundary digit check; 'builds on' names no 'Decision'
        token.
      field_grammar.title_relation_continuation.rejected_forms.4.reason: >-
        a bare-number 'and' continuation followed by open-ended prose is REJECTED (2027 is incidental
        prose, not a citation): only the bare-number branch of the comma/and continuations requires
        _BARE_NUMBER_BOUNDARY_RE (closing punctuation, another 'and', or a point/cl./clause qualifier)
        immediately afterward; a repeated 'Decision' token does not.
      field_grammar.title_relation_continuation.rejected_forms.5.reason: >-
        the same false-positive shape for the comma continuation, closed by the same
        _BARE_NUMBER_BOUNDARY_RE (both continuations share one grammar and one risk class).
      field_grammar.typed_id_list_terminator.justification: >-
        The prose_terminator set PLUS both amendment_forms openers ("[Amendment " and the GENERAL "\n>
        **" rule, never a closed list), so a trailer after a typed id-list field (e.g. Related) never
        contributes its cited ids. Live regression case: Decision 146's trailer naming Decision 160
        (rec-2990).
      field_grammar.typed_id_list_terminator.rejected_forms.0.reason: >-
        a following bold marker already terminates via the shared prose_terminator set.
      field_grammar.typed_id_list_terminator.rejected_forms.1.reason: >-
        an inline '>' is NOT the blockquote opener: the terminator requires the exact '\n> **' prefix,
        so this near-miss does not truncate the Related capture.
      field_grammar.typed_id_list_terminator.rejected_forms.2.reason: >-
        '[not an amendment' is not the exact '\n[Amendment ' opener (different text, not at a line
        start), so this near-miss does not truncate the Related capture.
      field_grammar.projection_residue.description: >-
        The typed_id_list_terminator's GENERAL "\n> **" rule drops trailer-borne ids the PRE-CFG-06
        parser included in related_decisions on these eleven entries. The ops_decisions backfill is
        content-hash gated on sha256(raw_block) (Decision 84), so these rows re-project only when each
        raw_block next changes: a fidelity lag, not a source-of-truth inversion. rec-3050 tracks
        reconciliation.
      field_grammar.known_divergent_grammars.0.description: >-
        A third, deliberately-unaligned whole-block grammar (verb + immediately-adjacent "Decision N",
        scanning the ENTIRE block, not just the title) that reads only the first citation per relation
        word; CFG-06 left it unaligned (rec-3048).
      compaction.eligibility_criterion: >-
        An entry compacts only when its ENTIRE body is superseded/inert AND every live clause is
        restated/subsumed by the superseder OR migrated to a check-backed rehoming destination (a
        mechanism contract with a resolving evaluator; migrate_then_rehome branch below) -- a partial
        supersession with NO destination is never eligible; any unaccounted clause keeps the entry
