    contract wording approved verbatim (Benjamin, 2026-10-27, msg cmsg_01PCtd8o8287wUrLv1SCjZEuEUjXtwyHUq98fm2yVvKKLs,
    on the step 6b presentation msg cmsg_01PCtd8o8287wUrLv1SCjZEu4fqEK68K1UCs2hVgsnotpi).
  - >-
    Consumer of this build: PLAN-decision-serves-kind-grammar (adds 30 effective lines; needs at most 465 after this
    build, so it lands near 479 under 500). Its planning thread is woken through the coordinator when this merges.
  - >-
    decision-scout: NO_FLAGS; CITE 175, 166, 128, 176, 181, 168, 189; RELATED 165, 235, 132, 86, 127, 147, 114, 179,
    149, 146, 150, 151, 152, 167, 134, 215, 37. Decisions triaged: 188 of 188. Roadmap items intersected: 1; CONFLICT:
