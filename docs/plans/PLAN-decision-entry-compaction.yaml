schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: true
slug: "decision-entry-compaction"
intent: >-
  Compact the prose of docs/contracts/decision-entry.yaml from 505 to about 449 effective lines without changing any
  key, value or rule, and retire its Decision 175 size raise (the 508 budgets entry and its frozen note) together, so
  the file returns to the contracts class default of 500. Prerequisite of PLAN-decision-serves-kind-grammar, which adds
  30 lines for the north-star rework (T4.36 c4) and was ruled to fit by compaction, never by a raise.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-entry-compaction.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn category: an operator-directed prerequisite of PLAN-decision-serves-kind-grammar;
  no tier_item claimed, so the Tier Item Freshness Gate is skipped). Closes no exit criterion.
scope:
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      Replace the 29 prose leaves listed in the APPROVED TEXT execution step with their approved wording; drop the
      2026-08-18 amendment_log row; append one prose_improvement row. Every key path and every non-prose value
      (lists, numbers, regexes, worked examples, expected values) stays byte-identical, and metadata_envelope,
      significance and the migrate_then_rehome step are untouched.
  - file: config/structural_size_budgets.yaml
    action: Modify
    purpose: >-
      Remove the `docs/contracts/decision-entry.yaml: 508` budgets line and its frozen budget_notes entry together
      (the note's own retires_when), leaving `budget_notes: {}` as the column-0 section terminator; the roster comment
      "(7 entries)" becomes "(6 entries)". No other line changes. Never re-pin the file at its compacted size.
  - file: tests/checks/structural/test_size_limits.py
    action: Modify
    purpose: >-
      TestLiveTreeFreezeState: add test_decision_entry_freeze_is_retired_to_its_class_default (red on origin/main,
      green after); in test_frozen_entries_are_recorded_at_their_measured_pin remove only the `assert frozen`
      non-emptiness line, whose sole subject (the decision-entry freeze) this plan retires. The per-entry loop stays.
  - file: config/agent/verification_registry/entries/structural-frozen-base-side-legs.yaml
    action: Delete
    purpose: >-
      Retired by git mv (Decision 176 retirement path): its live anchor, the frozen 508 line, is deleted by this plan,
      so it would fail permanently, and an in-place re-anchor would pass on origin/main and be rejected by the
      differential admission gate as tautological. Every leg it probed stays covered by
      tests/checks/structural/test_budget_raises.py's synthetic-fixture frozen-leg tests.
  - file: config/agent/verification_registry/entries/deprecated/structural-frozen-base-side-legs.yaml
    action: Create
    purpose: The same record, moved by a 100% rename with content byte-identical.
  - file: config/agent/verification_registry/entries/decision-entry-size-freeze-retired.yaml
    action: Create
    purpose: Graduated test_selector row for VP step 1 (check_id decision-entry-size-freeze-retired).
  - file: docs/plans/PLAN-decision-entry-compaction.yaml
    action: Modify
    purpose: Implement-time bookkeeping only (implementation_declared, weakening_dispositions).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    decision-entry.yaml: outside amendment_log, the key-path set and every non-prose leaf equal origin/main's; exactly
    the 29 leaves in the APPROVED TEXT execution step differ, each equal (as parsed) to its approved wording; no parsed
    string carries a control character other than a newline.
  - >-
    decision-entry.yaml amendment_log: the 2026-08-18 row is removed, the other four rows are unchanged and in order,
    and one row is appended with an ISO date, semantic_break false, change_class prose_improvement and the approved
    summary.
  - >-
    decision-entry.yaml measures at most 455 effective lines (draft: 449), its comment-line count and its count of
    lines over 100 characters are no higher than origin/main's (97 and 14), and its non-comment bytes are at least 10%
    below origin/main's -- relief comes from removed words, never from line-joining or moving prose into comments.
  - >-
    config/structural_size_budgets.yaml: the decision-entry budgets line and its frozen budget_notes entry are both
    gone in one commit, budget_notes is the empty mapping, budgets has six entries and its comment says "(6 entries)".
  - >-
    tests/checks/structural/test_size_limits.py: test_decision_entry_freeze_is_retired_to_its_class_default fails on
    origin/main and passes after; test_frozen_entries_are_recorded_at_their_measured_pin loses only its `assert frozen`
    line.
  - >-
    structural-frozen-base-side-legs is under entries/deprecated/ with byte-identical content, absent from
    scripts.verification_graduation.load_entries(), and named by no live surface outside docs/plans/ and
    entries/deprecated/.
  - >-
    Every consumer of the contract stays green: tests/test_decision_field_grammar.py, the real-contract conformance
    tests, the size and currency check tests, and the three graduated probes that read the contract's text
    (d37-governance-surfaces-landed, decision-entry-contract-surfaces-present, decision-entry-tier-matches-validator).
  - The graduated row decision-entry-size-freeze-retired is admitted by the differential gate (fails on origin/main, passes on HEAD).
  - bin/venv-python -m scripts.validate (full tier) exits 0.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The pin-retirement test (AC 3 and 4) -- the file has no roster entry or note and fits its class limit.
    command: bin/venv-python -m pytest -q "tests/checks/structural/test_size_limits.py::TestLiveTreeFreezeState::test_decision_entry_freeze_is_retired_to_its_class_default"
    expected: exit 0, one test passed. On origin/main the node does not exist (pytest exit 4).
    fix_if: >-
      The roster still names the file -- finish the config edit. The limit assertion fails -- the compaction is short
      of the class limit; compact further within the approved wording, never re-pin or raise.
    hermetic: true
    expected_literals:
      - 1 passed
    graduation: graduate
    graduation_check_id: decision-entry-size-freeze-retired
  - step: 2
    phase: pre-deploy
    action: >-
      Approved-wording and structure fidelity (AC 0, 1, 2) against origin/main and this plan's APPROVED TEXT step.
    command: |-
      bin/venv-python -c "
      import re,subprocess,yaml
      C='docs/contracts/decision-entry.yaml'; P='docs/plans/PLAN-decision-entry-compaction.yaml'
      bt=subprocess.run(['git','show','origin/main:'+C],capture_output=True,text=True,check=True).stdout; ht=open(C,encoding='utf-8').read()
      b=yaml.safe_load(bt); h=yaml.safe_load(ht)
      want=yaml.safe_load([s for s in yaml.safe_load(open(P))['execution_steps'] if s.startswith('APPROVED TEXT')][0].split(chr(10),1)[1])
      def lv(n,p):
        if isinstance(n,dict): o={p:'{}'}; [o.update(lv(v,p+'.'+str(k))) for k,v in n.items()]; return o
        if isinstance(n,list): o={p:len(n)}; [o.update(lv(v,p+'.'+str(i))) for i,v in enumerate(n)]; return o
        return {p:n}
      ba=b.pop('amendment_log'); ha=h.pop('amendment_log'); B=lv(b,''); H=lv(h,'')
      W={'.'+k:v for k,v in want.items() if not k.startswith('amendment_log')}
      assert len(W)==29 and B.keys()==H.keys(), sorted(B.keys()^H.keys())
      bad=[k for k in H if (H[k]!=W[k] if k in W else H[k]!=B[k])]; assert not bad, bad
      assert all(B[k]!=W[k] for k in W)
      keep=[r for r in ba if r['date']!='2026-08-18']; assert len(keep)==4 and ha[:4]==keep and len(ha)==5, ha
      r=ha[4]; assert re.fullmatch(r'\d{4}-\d{2}-\d{2}',str(r['date'])) and r['semantic_break'] is False and r['change_class']=='prose_improvement' and r['summary']==want['amendment_log.new_row.summary'], r
      assert not [k for k,v in H.items() if isinstance(v,str) and re.search(r'[\x00-\x09\x0b-\x1f]',v)]
      eff=lambda t:[l for l in t.splitlines() if l.strip() and not l.strip().startswith('#')]
      com=lambda t:sum(l.strip().startswith('#') for l in t.splitlines()); wide=lambda t:sum(len(l)>100 for l in t.splitlines())
      eb=lambda t:sum(len(l.encode()) for l in eff(t)); n=len(eff(ht))
      assert n<=455 and com(ht)<=com(bt) and wide(ht)<=wide(bt) and eb(ht)<=0.9*eb(bt), (n,com(ht),wide(ht),eb(ht),eb(bt))
      print('COMPACTION_FIDELITY_OK', n)
      "
    expected: Prints COMPACTION_FIDELITY_OK and the effective-line count (about 449).
    fix_if: >-
      A listed leaf differs -- copy the approved wording exactly (a backslash inside a double-quoted YAML scalar is an
      escape; keep such text in a folded scalar). An unlisted leaf or key path differs -- revert it. A size bound fails
      -- re-wrap at 100 columns; never join lines, move prose into comments, or change wording without a new approval.
    hermetic: true
    expected_literals:
      - COMPACTION_FIDELITY_OK
    graduation: waive
    graduation_waiver_reason: >-
      Compares HEAD against origin/main and this plan's own approved text, so it is meaningless once merged, and a
      standing copy would freeze contract prose against future approved edits; step 4's probes and the existing
      contract tests are the standing guards.
  - step: 3
    phase: pre-deploy
    action: Contract consumers (AC 6) -- worked-example grammar, real-contract conformance, size and currency tests.
    command: bin/venv-python -m pytest -q tests/test_decision_field_grammar.py "tests/checks/decisions/test_validate_decision_entry_conformance.py::TestRealContractIntegration" tests/checks/decisions/test_validate_decisions_size.py tests/checks/decisions/test_validate_decision_currency.py
    expected: exit 0, all passed (77 at planning time).
    fix_if: >-
      A worked example fails -- an example or expected value was edited; restore it byte-identically. A real-contract
      test fails -- a key or a read value changed; restore it.
    hermetic: true
    expected_literals:
      - passed
    graduation: waive
    graduation_waiver_reason: These files already run as graduated selectors (decision-field-grammar-contract-pin and siblings); this is their replay on the compacted text.
  - step: 4
    phase: pre-deploy
    action: >-
      Re-run the three graduated probes that read the contract's text (AC 6); graduated records never re-run as a
      standing suite, so a broken substring would otherwise go unnoticed.
    command: |-
      bin/venv-python -c "
      import subprocess,yaml
      for c in ['d37-governance-surfaces-landed','decision-entry-contract-surfaces-present','decision-entry-tier-matches-validator']:
        cmd=yaml.safe_load(open('config/agent/verification_registry/entries/'+c+'.yaml'))['check_spec']['command']
        r=subprocess.run(cmd,capture_output=True,text=True); assert r.returncode==0,(c,r.stdout[-300:],r.stderr[-300:])
      print('CONTRACT_PROBES_OK')
      "
    expected: Prints CONTRACT_PROBES_OK.
    fix_if: >-
      A probe fails -- a substring it needs was lost (migrate_then_rehome, rehoming destination, the amendment_forms
      openers, the shared_parser_note terms, projection_residue rows, the hard-fail tier with no WARN); restore it.
    hermetic: true
    expected_literals:
      - CONTRACT_PROBES_OK
    graduation: waive
    graduation_waiver_reason: Replays three already-graduated registry rows; graduating a wrapper would duplicate them.
  - step: 5
    phase: pre-deploy
    action: Pin retirement and stale-reference sweep for the retired probe (AC 3, 5; closure obligation for the Delete row).
    command: |-
      bin/venv-python -c "
      import subprocess,yaml
      from scripts.verification_graduation import load_entries
      S='config/structural_size_budgets.yaml'; t=open(S,encoding='utf-8').read(); r=yaml.safe_load(t); cid='structural-frozen-base-side-legs'
      assert 'docs/contracts/decision-entry.yaml' not in r['budgets'] and r['budget_notes']=={} and len(r['budgets'])==6 and '(6 entries)' in t
      bl=subprocess.run(['git','show','origin/main:'+S],capture_output=True,text=True,check=True).stdout.splitlines(); hl=t.splitlines()
      assert [l for l in hl if l not in bl]==['# Flat per-file effective-line grandfather roster (6 entries). Registered ONLY when a','budget_notes: {}'], [l for l in hl if l not in bl]
      assert len([l for l in bl if l not in hl])==15, [l for l in bl if l not in hl]
      assert cid not in {e['check_id'] for e in load_entries()}
      git=lambda *a: subprocess.run(['git',*a],capture_output=True,text=True,check=True).stdout.strip()
      assert git('rev-parse','origin/main:config/agent/verification_registry/entries/'+cid+'.yaml')==git('hash-object','config/agent/verification_registry/entries/deprecated/'+cid+'.yaml')
      hits=subprocess.run(['git','grep','-l',cid,'--',':!docs/plans/',':!config/agent/verification_registry/entries/deprecated/'],capture_output=True,text=True).stdout.split()
      assert not hits, hits
      print('RETIREMENT_OK')
      "
    expected: Prints RETIREMENT_OK.
    fix_if: >-
      A roster or note line survives, or another line changed -- restore the exact edit. The probe is still live or
      its content changed -- redo the move as a pure git mv. A live surface names it -- repoint or remove that reference.
    hermetic: true
    expected_literals:
      - RETIREMENT_OK
    graduation: waive
    graduation_waiver_reason: One-time retirement sweep against origin/main; step 1's graduated test is the standing guard on the retired pin.
  - step: 6
    phase: pre-deploy
    action: Discharge the handoff obligation with a full-tier run to completion.
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test, relax an assertion, or add a baseline, allowlist or
      budget entry. A failure outside scope becomes a rec via scripts.ops_data_portal (Decision 59, 55) AND the
      handoff stays blocked (handoff_policy) until the full tier exits 0.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: config/structural_size_budgets.yaml
    behavior: decision-entry.yaml carries no roster entry or note and fits the contracts class limit.
    verification_step: 1
    test_selector: tests/checks/structural/test_size_limits.py::TestLiveTreeFreezeState::test_decision_entry_freeze_is_retired_to_its_class_default
    red_green_expectation: red on origin/main (the node does not exist; the roster still names the file), green after.
  - source: docs/contracts/decision-entry.yaml
    behavior: Only the approved prose leaves change; every key path and machine-read value is unchanged.
    verification_step: 2
    command: print('COMPACTION_FIDELITY_OK', n)
    red_green_expectation: red on origin/main (the approved leaves differ), green after.
  - source: config/agent/verification_registry/entries/deprecated/structural-frozen-base-side-legs.yaml
    behavior: The retired probe is out of the live registry, byte-identical under deprecated/, and named by no live surface.
    verification_step: 5
    command: print('RETIREMENT_OK')
    red_green_expectation: red on origin/main (the record is still live and absent from deprecated/), green after.
  - source: config/agent/verification_registry/entries/decision-entry-size-freeze-retired.yaml
    behavior: The graduated row guards the retired decision-entry freeze.
    verification_step: 1
    test_selector: tests/checks/structural/test_size_limits.py::TestLiveTreeFreezeState::test_decision_entry_freeze_is_retired_to_its_class_default
    red_green_expectation: red on origin/main (the node does not exist), green after.
weakening_dispositions:
  - candidate: "[assertion-removed] tests/checks/structural/test_size_limits.py::TestLiveTreeFreezeState::test_frozen_entries_are_recorded_at_their_measured_pin"
    disposition: planned-change
    cite: "acceptance_criteria[4]"
constraints:
  - >-
    Contract wording lands exactly as Benjamin approved it (message id in context); the only allowed variance is DATE
    in the new amendment_log row. Any other wording change needs a new approval through the planning thread.
  - >-
    No raise and no re-pin: never add a budgets entry or note for decision-entry.yaml at its compacted size -- the
    grammar plan's 30 lines need the class-default headroom (Benjamin's ruling).
  - >-
    Relief comes from removed words only: no line-joining, no wider wrap, no prose moved into comments (VP step 2
    bounds all three). Never edit metadata_envelope, significance or any key name; the grammar plan inserts beside them.
  - >-
    Never weaken a test (Decision 181/235): the `assert frozen` removal is a planned-change disposition (AC 4); the
    probe retirement is a retirement (its subject is deleted) with every leg still covered by test_budget_raises.py.
  - No verification-registry.yaml note for the retirement (Decision 176's note prescribes git mv only; the file sits at 493 of 500).
  - No rescue agents or workaround loops (Decision 55).
context:
