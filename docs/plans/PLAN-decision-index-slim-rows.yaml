  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - "Start condition: this plan merged and its amended sidecar's NEW approval run approved (digest changed with the 2026-11-18 amendment; the 2026-11-17 run does not cover it; validate_merge_step reads it)."
execution_steps:
  - "Read the merged sidecar docs/plans/approved/decision-index-slim-rows.yaml; check its approval run is approved before starting (validate_merge_step needs it at merge)."
  - "Tests first (scope rows tests/test_decisions_index.py, tests/test_decisions_index_corpus.py, the emergent fixture), each new class seen red on the unchanged tree. Post: VP 1-3, 8 red."
  - "scripts/decisions_index.py, then --write; scripts/preflight/emergent_north_star.py; the two registry records. Post: VP 1-8 green."
  - "Apply the sidecar's blocks to SKILL.md and instruction-architecture.yaml verbatim ({{DATE}} filled with the build date); lower the prose pin. Post: VP 10-11 green."
  - "Commit; VP 12 on the committed head before any push (full tier backgrounded, 2 h limit; a timeout is blocked); VP 15; push; open the PR."
  - >-
    Historical (ran once on 2026-11-18, ABORT; not re-run, see the amendment context lines): replay rule (operator-chosen 1A, 2026-11-17; pre-registered, Decision 221 cl.4; Fable consult), used by the next step and VP 13. Ten plans from
    `scout_replay plans`. Baseline arm: 3 runs per plan of decision-scout steps 0-3 on the BASE export (old index and
    skill), output each non-IRRELEVANT entry with its lane. Slim arm: 5 runs per plan of steps 0-3 on the HEAD export,
    output its approach tag set and the north-star ids it passed to north_star_shortlist, the first-stage set (tag
    shortlist, north-star carriers and title-screen keeps), the discards, the ids whose excerpts it fetched and each non-IRRELEVANT entry with its lane. Labels per plan: its cites at BASE minus ids cited
    by at least half the ten plans, plus every entry all three baseline runs class CITE, CONTRADICT or SPIRIT (no LLM
    grader, Decision 231 cl.2), restricted to ids live at both BASE and HEAD. Measured at the screen, the only changed stage (classification after it is unchanged,
    and the baseline has no screen, so its screen recall is 1 by construction): screen recall per slim run = labelled
    ids in its first stage / labelled ids. ABORT if (a) the 95 percent bootstrap lower bound (10,000 resamples over
    plans, seed 0) of the mean per-plan screen recall (each plan's mean over its 5 runs) is below 0.95; or (b) any
    labelled id is in no slim run's first stage and in at least two baseline runs' sets. Report only: the paired
    end-to-end difference (slim lanes vs baseline lanes, same labels), the share of entries every baseline run kept
    that no slim run kept, each slim run's fetched excerpt bytes (the on-demand cost Decision 179's condition nets
    against the whole-load saving), and Decision 100's screen outcome per run. Plans with no labels after exclusion
    count for the report only.
  - >-
    Amendment (2026-11-18) on the existing build branch (PR #2188). (1) Rebase onto main; on the plan-file conflict take
    main's amended plan, then re-flip implementation_declared and re-derive weakening_dispositions from
    validate_weakening_candidates over the final diff, each planned-change citing its scope row. (2) Rewrite the build
    commit so the branch's only Resolves trailer is `Resolves: rec-5258` (bb064611 carries rec-3250 too;
    validate_merge_step's remedy: git reset --soft to the merge base, recommit, push with --force-with-lease); never
    rec-3250. (3) build_index keeps triage_excerpt on every live non-stub row. (4) Remove from the branch:
    scripts/roadmap/scout_replay.py, tests/test_scout_replay.py and the scout-replay-abort-rule record (critique r7 B2;
    the scorer, preserved before this rebase at /mnt/project-files/decision-growth/slim-index/replay/scorer-e0515c9a/ with a README, goes to rec-5310), and
    tests/persona_contracts/test_decision_scout_excerpt_coupling.py with its record
    decision-scout-persona-excerpt-coupling. (5) TestSlimIndex, TestDeterminism, the retrieval probes and the archive
    record follow the amended scope rows (the 60 percent ratio test goes). (6) Restore SKILL.md step 3 and
    bounded_retrieval to main's text and apply the amended sidecar's four blocks; lower the prose pin; regenerate the
    index. Re-run VP 1-8, 10-13 and 15 on the new head. The replay run files stay under replay/ as evidence; no replay
    runs.
