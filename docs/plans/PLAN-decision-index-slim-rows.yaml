    verification_step: 9
    test_selector: tests/test_scout_replay.py::TestAbortRule
    red_green_expectation: red before (module absent), green after
constraints:
  - >-
    No absolute byte ceiling on the index in any test, check or graduated record: Decision 179 retired stock ceilings
    and the operator chose to bound the read, not re-mint a guard (2026-11-17).
  - "Excerpts are derived through scripts.decisions_md's shared parser only; no second parser, no committed excerpt file."
  - "The bound wording (sidecar) is applied verbatim; the skill's other text is untouched."
  - "Repaired registry records keep every assertion (Decisions 235, 244); nothing is loosened."
  - "No rescue agents or workaround loops (Decision 55)."
context:
  - "Decision-scout r1 FLAGS_FOUND (fingerprint in gate_rounds). Decisions triaged: 217 of 217. Roadmap items intersected: 3; CONFLICT: 1; RELATED: 2. Serves: NS.4 4/5. CITE: 160, 179, 244, 246. Dispositions: next three lines."
  - "Decision 231 cl.3-4 NOTE, T4.14 CONFLICT (c2, c4, c6): the replay is a one-shot pre-merge abort check, not a T4.14 lane run; no runner ships (scout_replay selects, briefs and scores only). Deferral note: arms read git-archive exports with docs/plans/ removed and no .git (file-level isolation); the operator started it by choosing replay option A (2026-11-17 18:25Z); the ten-plan set is T4.14 seed data (rec-5310)."
  - "Decision 160 SPIRIT NOTE: the replay measures the title screen itself, its tripwire covers adjudicated-relevant entries as well as cites, and the graded fallback removes the judgment for untagged entries; rec-5309 widens tag coverage."
  - "Decision 179: index-read-context-cost is re-armed by PLAN-condition-reviews-167-177-179 (rec-5255, PR 2116) on the slim rows; this plan adds no ceiling and edits no Decision."
  - "Replay rule (operator-chosen 1A, pre-registered per Decision 221 cl.4): execution step 6. At-risk set found deterministically (main 97915110): 7 of 151 non-universal cites in the 18 schema_version 6 plans are untagged with no title word shared with the plan (Decisions 55, 177, 186, 201, 226)."
  - "Replay subagents run on opus (the model /plan's scout runs on), passed explicitly whatever model the build uses."
  - "Consults: /mnt/project-files/decision-growth/slim-index/advisor-brief/ (ADVICE.md blind advisor; ADVICE-fable.md, operator-requested). Adapted: excerpts by command, not a committed file (persona gets --excerpts all as a pre-computation; a file adds seven companion edits incl. file-router.yaml at 500 of 500). Rejected: dropping status (4.5 KB, read on superseded paths); the stronger persona tripwire (forces editing their file)."
  - "Measured at 97915110: 244 rows, 217 live, 4 superseded_compacted, 27 archived; index 187,040 B; slim prototype 73,971 B; untagged live 106; their excerpts 38,565 B (the fallback's added cost)."
  - "Persona: docs/contracts/personas/decision_scout.yaml (Agents in GitHub, T4.30) handed over by rec-5308 (operator-chosen 2A); verdict_source in_session in both defaults (2026-11-17). rec-3264 would add an index projection: any new projected field now carries a whole-load cost."
  - "Graduated shards kept unchanged: decision-scout-retrieval-probes, decisions-index-envelope-borne-edges, decisions-index-live-count-matches-file, emergent-north-star-bucket, emergent-north-star-coverage."
  - "Merge serial with pointer-sections (config/prose_budgets.yaml). Unbuilt plans also scoping prose_budgets.yaml or docs/decisions-index.json (plan_obligations): whichever builds second rebases; the index is regenerated, never hand-merged (mechanical-conflicts.yaml derived)."
  - "Post on coordinator log #1963 before merge: index shape changed, rec-5308 filed for Agents in GitHub."
  - "Red-overlap 2026-11-17 ~14:40Z: verdict blocked by rec-5247 (telemetry-reader smoke 504; slo_breached, shared none) and rec-5276 (telemetry-arrival red on config/telemetry/arrival.yaml; overlap only through transitive test modules of the pytest affected set, no shared scope file). Deferral rationale: both are Feedback Loop's telemetry reds; this plan shares no file with either and repairs neither, so both are deferred to their owners (operator ruling 2026-11-17 for rec-5247: defer and proceed for plan merges). The build re-runs red_overlap at its own start under the normal green-main rules."
gate_rounds: []
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (160, 179, 244, 246)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - "Start condition: this plan merged and its sidecar's approval run approved (validate_merge_step reads it)."
execution_steps:
  - "Read the merged sidecar docs/plans/approved/decision-index-slim-rows.yaml; check its approval run is approved before starting (validate_merge_step needs it at merge)."
  - "Tests first (scope rows tests/test_decisions_index.py, tests/test_decision_excerpts.py, tests/test_scout_replay.py, the emergent fixture), each new class seen red on the unchanged tree. Post: VP 1-3, 7-9 red."
  - "scripts/decisions_index.py, then --write; scripts/preflight/emergent_north_star.py; the two registry records. Post: VP 1-8 green."
  - "Apply the sidecar's blocks to SKILL.md and instruction-architecture.yaml verbatim ({{DATE}} filled with the build date); lower the prose pin. Post: VP 10-11 green."
  - "scripts/roadmap/scout_replay.py. Post: VP 9 green. Commit; VP 12 (full tier backgrounded, 2 h limit); push; open the PR."
  - >-
    Replay rule (operator-chosen 1A, 2026-11-17; pre-registered, Decision 221 cl.4; Fable consult), used by the next step and VP 13. Ten plans from
    `scout_replay plans`. Baseline arm: 3 runs per plan of decision-scout steps 0-3 on the BASE export (old index and
    skill), output the shortlist. Slim arm: 5 runs per plan of steps 0-3 up to the title screen on the HEAD export,
    output the first-stage set (tag shortlist, north-star carriers and title-screen keeps) and the discards. Labels per
    plan: its cites at BASE minus ids cited by at least half the ten plans, plus every entry in some baseline shortlist
    and in no slim first stage that a fresh full-text adjudicator (brief plus that Decision's section) marks relevant
    (CITE, CONTRADICT or SPIRIT-worthy). Recall per run = labelled ids kept / labelled ids. ABORT if (a) the 95 percent
    bootstrap lower bound (10,000 resamples over plans, seed 0) of the mean per-plan difference (slim mean recall minus
    baseline mean recall) is below -0.05; or (b) any labelled id is in no slim run's first stage and in at least two
    baseline runs. Report only: the share of entries every baseline run kept that no slim run kept. Plans with no
    labels after exclusion count for the report only.
  - >-
    Replay (VP 13), once CI is green: write origin/main's sha at build start to replay/BASE; run `scout_replay plans`;
    export BASE and HEAD with `git archive <sha> | tar -x -C <dir>` into two scratch directories and delete
    docs/plans/ in each; check `bin/venv-python -m scripts.decisions_index --excerpts 100` runs in the HEAD export.
    For each plan, dispatch fresh general-purpose subagents with model opus (the model /plan's scout runs on), arms
    interleaved and in parallel: 3 baseline runs (steps 0-3 in the BASE export, write {"shortlist": [...]}) and 5 slim
    runs (steps 0-3 up to the title screen in the HEAD export, write {"first_stage": [...], "discarded": [...]}), each
    given `scout_replay brief` output only, into replay/<slug>/<arm>-<k>.json; then one fresh adjudicator subagent per
