    command: >-
      bin/venv-python -c "import os, yaml; f = '.claude/skills/decision-scout/SKILL.md'; n = os.path.getsize(f); b =
      yaml.safe_load(open('config/prose_budgets.yaml'))['S4'][f]; assert n == b < 11285, (n, b);
      print('SCOUT_SKILL_SHRUNK', n)"
    red_green_expectation: red before (11,285 is not below 11,285), green after
  - source: .claude/skills/decision-scout/SKILL.md
