  - >-
    Replay rule (operator-chosen 1A, 2026-11-17; pre-registered, Decision 221 cl.4; Fable consult), used by the next step and VP 13. Ten plans from
    `scout_replay plans`. Baseline arm: 3 runs per plan of decision-scout steps 0-3 on the BASE export (old index and
    skill), output each non-IRRELEVANT entry with its lane. Slim arm: 5 runs per plan of steps 0-3 on the HEAD export,
    output the first-stage set (tag shortlist, north-star carriers and title-screen keeps), the discards, the ids whose
    excerpts it fetched and each non-IRRELEVANT entry with its lane. Labels per plan: its cites at BASE minus ids cited
    by at least half the ten plans, plus every entry all three baseline runs class CITE, CONTRADICT or SPIRIT (no LLM
    grader, Decision 231 cl.2). Measured at the screen, the only changed stage (classification after it is unchanged,
    and the baseline has no screen, so its screen recall is 1 by construction): screen recall per slim run = labelled
    ids in its first stage / labelled ids. ABORT if (a) the 95 percent bootstrap lower bound (10,000 resamples over
    plans, seed 0) of the mean per-plan screen recall (each plan's mean over its 5 runs) is below 0.95; or (b) any
    labelled id is in no slim run's first stage and in at least two baseline runs' sets. Report only: the paired
    end-to-end difference (slim lanes vs baseline lanes, same labels), the share of entries every baseline run kept
    that no slim run kept, each slim run's fetched excerpt bytes (the on-demand cost Decision 179's condition nets
    against the whole-load saving), and Decision 100's screen outcome per run. Plans with no labels after exclusion
    count for the report only.
  - >-
    Replay (VP 13), once CI is green: write origin/main's sha at build start to replay/BASE; run `scout_replay plans`;
    export BASE and HEAD with `git archive <sha> | tar -x -C <dir>` into two scratch directories and delete
    docs/plans/ in each; check `bin/venv-python -m scripts.decisions_index --excerpts 100` runs in the HEAD export.
    For each plan, dispatch fresh general-purpose subagents with model opus (the model /plan's scout runs on), arms
    interleaved and in parallel: 3 baseline runs (steps 0-3 in the BASE export, write {"model": "<serving model version>", "shortlist": {"<id>": "<lane>"}}) and 5 slim
    runs (steps 0-3 in the HEAD export, write {"model": "<serving model version>", "first_stage": [...], "discarded": [...], "fetched": [...],
    "shortlist": {"<id>": "<lane>"}}), each
    given `scout_replay brief` output only, into replay/<slug>/<arm>-<k>.json; then, once code review confirms scout_replay.py implements step 6 as written, VP 13. Record subagent run ids and the replay's token spend in the
    PR body. ABORT follows VP 13's fix_if.
