schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-index-slim-rows"
intent: >-
  Bound what the decision scout loads whole on every /plan round (contract-first retrospective CFR-03): the committed
  docs/decisions-index.json is written one compact row per line, keeps every live entry's triage_excerpt text but
  drops its source and truncation markers (served on demand by `scripts.decisions_index --excerpts`), and compacted
  stubs get skeleton rows like archived ones (rec-5258; part of rec-3250). What the scout sees per live entry is
  unchanged. Amended 2026-11-18 (operator choice after the recall replay aborted and a rescore showed the
  pre-registered graded fallback would abort too): no title screen; 139,234 bytes on the build tree against 189,569
  at its base, which misses the audit's 110,608 target, so rec-3250 stays open for the rest.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-index-slim-rows.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): the
  contract-first retrospective's CFR-03 (rec-3250, rec-5258), wave 2 of the operator's 2026-11-17 itinerary, ahead of
  T4.24 (deferred post-MVP). Bounds Decision 179 clause 5(i)'s index-read residual; closes no roadmap criterion
  (T4.24 c7 also carries Decision 196's execution).
cites: [dec:160, dec:179, dec:231, dec:244, dec:246]
scope:
  - file: scripts/decisions_index.py
    action: Modify
    purpose: >-
      build_index drops triage_excerpt_source and triage_excerpt_truncated from every row and keeps triage_excerpt
      (text, unchanged) on every live row that is not a superseded_compacted stub (category_tags
      are still derived from title + build_triage_excerpt's 320-char excerpt, unchanged); a live row whose currency is superseded_compacted is the
      archive skeleton plus currency (no category_tags, serves or kind); --write serialises {"decisions": [...],
      "metadata": {...}} with one compact sort_keys row per line (separators (",", ":")), the same parsed object;
      _build_triage_excerpt becomes public build_triage_excerpt; new public build_excerpts(numbers: list[int] | None; None is every live id) and CLI
      `--excerpts <ids | all>` (ids comma- or whitespace-separated, the forms the skill text invites) print one JSON line per live id, sorted keys {number, triage_excerpt,
      triage_excerpt_source, triage_excerpt_truncated}, from the same shared parser, and exit 2 naming every id that is
      not a live decision. Nothing new is committed or freshness-checked; check_index_freshness is unchanged. The module docstring is
      rewritten to the slim-row and --excerpts shape.
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated by `bin/venv-python -m scripts.decisions_index --write` only; never hand-edited.
  - file: tests/test_decisions_index.py
    action: Modify
    purpose: >-
      Add TestSlimIndex (exact key sets for live, stub and archive rows; every live non-stub row carries triage_excerpt
      equal to build_excerpts' text for its id; no row carries triage_excerpt_source or triage_excerpt_truncated, and
      stub and archive rows carry no excerpt key; the --write output
      and the committed docs/decisions-index.json have one row per line and parse to build_index(); no byte ratio or
      absolute byte ceiling),
      TestSkeletonCompactedStubRows (every superseded_compacted row's keys equal the archive skeleton plus currency; no
      existence leg, TestCurrencyProjection already pins 37, 44, 58 and 67), and TestExcerptsCli (--excerpts for named
      ids, comma- and space-separated, and for all, one line per live id each beginning {"number":N,; exit 2 naming an archived and an unknown id).
      The coverage checker measures scripts/decisions_index.py through this file only, so every new branch
      (build_excerpts, the --excerpts CLI, all, exit 2) is tested here and TestTriageExcerptUnit stays here, renamed to
      build_triage_excerpt. Update TestDeterminism and TestSkeletonArchiveRows key sets, and its ratio test as the
      archive record's repair states, and TestCategoryTagsIntegration's three every-row tests to iterate rows that
      carry category_tags (stubs no longer do). Relief (458 of 500 SLOC on 2026-11-17): move TestTypedEdgeSpotChecks
      and TestTriageExcerptIntegration (corpus-data checks whose decisions_index lines other tests here already
      execute) to tests/test_decisions_index_corpus.py; TestEnvelopeSourcedEdges and TestLiveField stay (graduated
      records pin their node ids); re-measure with plan_obligations.
  - file: tests/test_decisions_index_corpus.py
    action: Create
    purpose: >-
      The two moved corpus classes unchanged in claim; TestTriageExcerptIntegration reads build_excerpts(None) joined
      on number instead of index rows.
  - file: tests/test_decision_scout_retrieval.py
    action: Modify
    purpose: >-
      Probes score title + the excerpt from build_excerpts joined on number (the same text the index row carries); the excerpt-only pg_dump -> Decision 100 probe keeps its
      zero-title-overlap assertion and Decision 100 is a replay watch id; no probe is removed; the module docstring's
      "a triage pass over the index alone" claim is rewritten to the new path (planned change).
  - file: .claude/skills/decision-scout/SKILL.md
    action: Modify
    purpose: >-
      Steps 1 and 2 (input bullets) exactly as docs/plans/approved/decision-index-slim-rows.yaml binds; step 3 is
      unchanged; the file shrinks (11,285 -> 11,157 bytes, measured); nothing else changes.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: Lower the S4 entry for .claude/skills/decision-scout/SKILL.md to the new measured size (ratchet down only).
  - file: docs/contracts/instruction-architecture.yaml
    action: Modify
    purpose: >-
      gate_subagent_retrieval.triage_source_provenance (bounded_retrieval is unchanged) and a new amendment_log entry
      (governance_note_add, semantic_break false), exactly as the sidecar binds.
  - file: scripts/preflight/emergent_north_star.py
    action: Modify
    purpose: >-
      load_entries' fallback text, used when a parsed row has no Intent or Problem, is build_triage_excerpt over the
      parsed row (same derivation) instead of the index row's triage_excerpt, so it no longer depends on what the index
      projects (built before the 2026-11-18 amendment; kept, since the text is identical).
  - file: tests/session/preflight/test_emergent_north_star.py
    action: Modify
    purpose: >-
      test_load_entries_text_related_dates_and_fallbacks drops the index fixture's triage_excerpt and asserts the
      fallback text comes from the parsed row's Context or Decision field; 100 percent line coverage holds.
  - file: config/agent/verification_registry/entries/dec-164-index-triage-discoverable.yaml
    action: Modify
    purpose: >-
      Repair (Decision 244 cl.5, claim unchanged): the same assertions on Decision 164 (live, amends [116, 122], lambda
      tag, Intent-sourced excerpt of at most 320 chars containing "CLI-hosting class"), with the excerpt fields read
      from scripts.decisions_index.build_excerpts([164]); guard_target follows to scripts/decisions_index.py.
  - file: config/agent/verification_registry/entries/decisions-index-archive-rows-are-skeletons.yaml
    action: Modify
    purpose: >-
      Repair (Decision 244 cl.5, claim unchanged: archive rows carry none of a live entry's triage signal): archive key
      set unchanged; the live key set loses triage_excerpt_source and triage_excerpt_truncated and keeps
      triage_excerpt; superseded_compacted rows equal the skeleton plus
      currency; the ratio keeps its 0.5 bound against the live entry's whole signal, the row plus its build_excerpts
      fields (0.323 at ddb28a40, today's value). Not a loosening (Decision 235): the bound and the measured value are
      unchanged.
  - file: scripts/roadmap/scout_replay.py
    action: Create
    purpose: >-
      The scorer for this build's one-shot recall replay (the audit's abort test; not the T4.14 lane and not a
      standing runner: it dispatches nothing). It scored the replay that aborted on 2026-11-18 and is kept as the
      scorer of that evidence and of the T4.14 seed data (rec-5310); this plan runs no further replay. `plans --ref R --count 10 --exclude SLUG` lists the newest
      schema_version 6 plans at R with non-empty cites, by the commit that added them; `brief --plan P --ref R` prints
      the scout input (intent, approach from scope purposes and constraints, scope files, tier; never cites, context,
      gate_rounds or bundled recs) with every decision reference redacted to "Decision [ref]" (`Decision N`,
      `Decisions N, M and K`, `dec-N`, `dec:N`; measured 24 of 53 cites named in those fields across the 10 newest
      plans); `score --runs D --base R --head H --baseline-runs 3 --slim-runs 5` applies the
      pre-registered rule (execution step 6) to the run files under D, prints the per-plan screen-recall table, the
      bootstrap interval, both refs' whole-load index bytes and the report-only figures, and ends with
      REPLAY PASS or REPLAY ABORT: <rule> (exit 1); exit 2 when a run file is missing or malformed, or a slim run's
      first_stage does not contain its recomputed mechanical set: the HEAD-export live entries whose category_tags
      intersect the run's recorded tags, unioned with the carried_by ids of north_star_shortlist over its recorded
      north_stars (title-screen keeps = first_stage minus that set), or its keeps are not a subset of its fetched ids, or
      a shortlist lane is outside CITE | CONTRADICT | RELATED | SPIRIT (SPIRIT = step 3's SPIRIT candidate).
  - file: tests/test_scout_replay.py
    action: Create
    purpose: >-
      TestBrief (no cites, context, gate_rounds or bundled ids leak into a brief, and no label id survives as a decision
      reference in any reference form), TestFirstStage (exit 2 when a run's first stage omits a recomputed tag-shortlist member,
      and separately when it omits a recomputed north-star carrier), TestPlanSelection, and TestAbortRule
      (the bootstrap rule and the hard tripwire each fire on a crafted fixture and stay quiet one step short of it, the
      bootstrap is seeded and reproducible, no report-only figure aborts, and incomplete runs exit 2).
bundled_recommendations: [rec-5258]
followon_recs: [rec-5308, rec-5309, rec-5310]
infrastructure_dependencies: []
acceptance_criteria:
  - "TestSlimIndex and rec-5258's acceptance node TestSkeletonCompactedStubRows pass (VP 1, 2)."
  - "The committed index is smaller than at the build's merge base, measured once (VP 5; 139,234 against 189,569 B on the build tree); the audit's 110,608 target is not met and rec-3250 stays open for it (operator choice 2026-11-18); no test, check or graduated record this build adds or repairs pins an absolute index size (code review reads the diff)."
  - "The excerpt command serves every live id and refuses others (VP 3); the retrieval probes pass through it (VP 4)."
  - "The skill shrinks and its prose pin is lowered; the bound wording matches the approved sidecar (VP 10, 11)."
  - "Every live non-stub entry's title, triage_excerpt, category_tags and currency equal the merge base's, so what the scout triages from is unchanged and no recall replay is needed (VP 13)."
  - "rec-5258 reads closed after merge and rec-3250 stays open with the replay evidence noted (VP 14)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Compacted rows (rec-3250, partial).
    command: bin/venv-python -m pytest tests/test_decisions_index.py::TestSlimIndex -q
    expected: The class passes; on the unchanged tree it does not exist (pytest exit 4).
    fix_if: Any failure; fix the generator, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: decisions-index-slim-rows
  - step: 2
    phase: pre-deploy
    action: rec-5258 acceptance, compacted-stub skeleton rows.
    command: bin/venv-python -m pytest tests/test_decisions_index.py::TestSkeletonCompactedStubRows -q
    expected: The class passes; absent on the unchanged tree.
    fix_if: Any failure; fix the generator.
    hermetic: true
    graduation: graduate
    graduation_check_id: decisions-index-compacted-stub-skeletons
  - step: 3
    phase: pre-deploy
    action: The on-demand excerpt command.
    command: bin/venv-python -m pytest tests/test_decisions_index.py::TestExcerptsCli -q
    expected: The class passes; absent on the unchanged tree.
    fix_if: Any failure.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-excerpts-cli
  - step: 4
    phase: pre-deploy
    action: Curated retrieval probes through the excerpt command, and the moved corpus classes.
    command: bin/venv-python -m pytest tests/test_decision_scout_retrieval.py tests/test_decisions_index_corpus.py -q
    expected: All pass.
    fix_if: A probe fails; the excerpt join is wrong, never the probe.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of files this plan creates or modifies (hermetic rule v); the probes file is already the
      graduated record decision-scout-retrieval-probes and VP 3 graduates the excerpt command.
  - step: 5
    phase: pre-deploy
    action: Measure the whole-load bytes once against the build's merge base (the audit target is reported, not asserted).
    command: >-
      bin/venv-python -c "import json, os, subprocess; p = 'docs/decisions-index.json'; g = lambda *a: subprocess.run(['git',
      *a], capture_output=True, text=True, check=True).stdout; n = os.path.getsize(p); b = len(g('show', g('merge-base',
      'HEAD', 'origin/main').strip() + ':' + p).encode()); m = sum(1 for r in json.load(open(p))['decisions'] if r['live']);
      assert n < b, (n, b); print('INDEX_SMALLER_THAN_BASE', n, b, m, 'audit target 110608')"
    expected: >-
      Prints the marker with both byte counts and the live count (139,234 and 189,569 B on the build tree); the unchanged
      tree fails the assertion (equal sizes).
    fix_if: The assertion fails; a row still carries a source or truncation marker or the serialiser is not one compact row per line.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim (Decision 244 cl.4): a standing absolute byte bound would be the stock ceiling Decision 179 retired;
      Decision 179's re-armed index-read-context-cost condition watches the figure at review.
  - step: 6
    phase: pre-deploy
    action: The committed index is fresh.
    command: bin/venv-python -m scripts.decisions_index --check
    expected: Exit 0 with the current-index line.
    expected_literals: [Decisions index is current.]
    fix_if: Regenerate with --write and commit the generator output.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates the registered validate_decisions_index_freshness check.
  - step: 7
    phase: pre-deploy
    action: >-
      The Actions persona's index reads still resolve (amendment 2026-11-18): its step 1 names title, triage_excerpt,
      currency and category_tags, and every live non-stub row carries all four, so its contract needs no change.
    command: >-
      bin/venv-python -c "import json; rows = [r for r in json.load(open('docs/decisions-index.json'))['decisions'] if
      r['live'] and r['currency'] != 'superseded_compacted']; t = open('docs/contracts/personas/decision_scout.yaml').read();
      f = ('title', 'triage_excerpt', 'currency', 'category_tags'); assert all(k in t for k in f); bad = [r['number'] for r
      in rows if any(k not in r for k in f)]; assert rows and not bad, bad; print('PERSONA_INDEX_FIELDS_PRESENT', len(rows))"
    expected: Prints the marker; it also passes on the unchanged tree (the claim is that nothing the persona reads is removed).
    expected_literals: [PERSONA_INDEX_FIELDS_PRESENT]
    fix_if: A row lacks a field the persona reads; the generator dropped it, never the persona text.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim; VP 1's exact live key sets are the standing guard that every live non-stub row keeps these fields.
  - step: 8
    phase: pre-deploy
    action: Emergent north-star fallback reads the parsed row.
    command: bin/venv-python -m pytest tests/session/preflight/test_emergent_north_star.py::test_load_entries_text_related_dates_and_fallbacks -q
    expected: Passes.
    fix_if: Any failure; also re-run the file under coverage (graduated emergent-north-star-coverage, 100 percent).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The file is already the graduated records emergent-north-star-bucket and emergent-north-star-coverage.
  - step: 9
    phase: pre-deploy
    action: The replay harness and its abort rule (graduates as one command_exit_zero record over this four-class command).
    command: >-
      bin/venv-python -m pytest tests/test_scout_replay.py::TestAbortRule tests/test_scout_replay.py::TestBrief
      tests/test_scout_replay.py::TestFirstStage tests/test_scout_replay.py::TestPlanSelection -q
    expected: All four classes pass; absent on the unchanged tree.
    fix_if: Any failure.
    hermetic: true
    graduation: graduate
    graduation_check_id: scout-replay-abort-rule
  - step: 10
    phase: pre-deploy
    action: The skill shrank and its pin follows.
    command: >-
      bin/venv-python -c "import os, yaml; f = '.claude/skills/decision-scout/SKILL.md'; n = os.path.getsize(f); b =
      yaml.safe_load(open('config/prose_budgets.yaml'))['S4'][f]; assert n == b < 11285, (n, b);
      print('SCOUT_SKILL_SHRUNK', n)"
    expected: Prints the marker; the unchanged tree fails (11,285 is not below 11,285).
    expected_literals: [SCOUT_SKILL_SHRUNK]
    fix_if: Lower the pin to the measured size; the skill's other text stays untouched (constraint).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Moment claim; validate_prose_limits already holds the size equal to its pin.
  - step: 11
    phase: pre-deploy
    action: The bound wording matches the approved sidecar.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-index-slim-rows --base origin/main
    expected: Exit 0.
    fix_if: Restore the sidecar's exact words; a change of wording needs a new approval run (Decision 246).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_merge_step runs the same verification at merge.
  - step: 12
    phase: pre-deploy
    action: Fast and full tiers, including the repaired registry records' differential admission.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and validation_result verifies the head sha. The full tier is started in the background with a
      2 h limit from the top-level session; its verdict is --verify-head's.
    fix_if: >-
      A failure this diff causes is fixed on the branch; one that reproduces on origin/main is cited by its rec in the
      PR body, never fixed inline.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: pre-deploy
    action: >-
      What the scout triages from is unchanged (amendment 2026-11-18, replacing the recall replay): every live non-stub
      row's title, triage_excerpt, category_tags and currency equal the merge base's row for the same id. The replay ran
      once (execution step 6) and aborted; a rescore of its run files showed the pre-registered graded fallback would
      abort too, so it was stopped for futility before any new data and is not re-run (context).
    command: >-
      bin/venv-python -c "import json, subprocess; g = lambda *a: subprocess.run(['git', *a], capture_output=True,
      text=True, check=True).stdout; p = 'docs/decisions-index.json'; b = {r['number']: r for r in json.loads(g('show',
      g('merge-base', 'HEAD', 'origin/main').strip() + ':' + p))['decisions']}; rows = [r for r in json.load(open(p))['decisions']
      if r['live'] and r['currency'] != 'superseded_compacted']; f = ('title', 'triage_excerpt', 'category_tags',
      'currency'); bad = [r['number'] for r in rows if r['number'] not in b or any(r.get(k) != b[r['number']].get(k) for k
      in f)]; assert rows and not bad, bad; print('SCOUT_SIGNAL_UNCHANGED', len(rows))"
    expected: >-
      Prints the marker with the live non-stub count (216 on the build tree). The plan does not edit docs/DECISIONS.md,
      so a difference means the generator changed what the scout sees. It also passes on the unchanged tree.
    fix_if: A listed row differs; fix the generator, never the comparison.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim against the merge base, true only before merge; VP 1's TestSlimIndex (every live non-stub row's
      triage_excerpt equals build_excerpts' text) is the standing guard.
  - step: 14
    phase: post-deploy
    action: The bundled rec closed on merge (Resolves trailer); rec-3250 stays open.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, missing =
      fetch_recs_by_ids(make_reader(), ['rec-3250', 'rec-5258']); s = {r['id']: r['status'] for r in rows}; assert not
      missing and s['rec-5258'] == 'closed' and s['rec-3250'] != 'closed', (s, missing); print('RECS_AS_PLANNED', s)"
    expected: RECS_AS_PLANNED with rec-5258 closed and rec-3250 not closed.
    fix_if: >-
      rec-5258 open: the closure job did not run; check the squash body's Resolves line and re-run per git-ops.yaml.
      rec-3250 closed: the Resolves line named it; reopen it with update_rec.
    hermetic: false
  - step: 15
    phase: pre-deploy
    action: >-
      Stale-reference sweep for the retired index fields (12k cond.2): no reader of an index row's triage_excerpt_source
      or triage_excerpt_truncated remains (triage_excerpt itself stays in the index).
    command: >-
      bin/venv-python -c "import subprocess; out = subprocess.run(['git', 'grep', '-l', '-w', '-E', 'triage_excerpt_(source|truncated)', '--',
      '.', ':!docs/plans/', ':!audits/', ':!docs/audit-prompts/', ':!docs/DECISIONS.md', ':!docs/DECISIONS_ARCHIVE.md'],
      capture_output=True, text=True).stdout.split(); allowed = {'scripts/decisions_index.py',
      'tests/test_decisions_index.py', 'tests/test_decisions_index_corpus.py', 'tests/test_decision_scout_retrieval.py',
      'docs/contracts/instruction-architecture.yaml',
      'config/agent/verification_registry/entries/dec-164-index-triage-discoverable.yaml',
      'config/agent/verification_registry/entries/decisions-index-archive-rows-are-skeletons.yaml',
      'scripts/roadmap/scout_replay.py', 'tests/test_scout_replay.py'}; extra =
      sorted(set(out) - allowed); assert not extra, extra; print('NO_STALE_EXCERPT_READERS', len(out))"
    expected: >-
      Prints the marker; the unchanged tree fails, naming docs/decisions-index.json and the skill.
    expected_literals: [NO_STALE_EXCERPT_READERS]
    fix_if: A named file still reads a retired field from an index row; move it to build_excerpts.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Moment sweep at the build head; VP 1's exact key sets are the standing guard that no index row carries the fields.
