schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "decision-index-slim-rows"
intent: >-
  Bound what the decision scout loads whole on every /plan round (contract-first retrospective CFR-03): the committed
  docs/decisions-index.json keeps slim rows written one compact row per line, triage excerpts leave it and are
  derived on demand only for the entries the scout's title screen keeps, and compacted stubs get skeleton rows like
  archived ones (rec-3250, rec-5258). At 97915110 the whole load is 187,040 bytes; the same rows slim are 73,971.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-index-slim-rows.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): the
  contract-first retrospective's CFR-03 (rec-3250, rec-5258), wave 2 of the operator's 2026-11-17 itinerary, ahead of
  T4.24 (deferred post-MVP). Bounds Decision 179 clause 5(i)'s index-read residual; closes no roadmap criterion
  (T4.24 c7 also carries Decision 196's execution).
cites: [dec:160, dec:179, dec:244, dec:246]
scope:
  - file: scripts/decisions_index.py
    action: Modify
    purpose: >-
      build_index drops triage_excerpt, triage_excerpt_source and triage_excerpt_truncated from every row (category_tags
      are still derived from title + the full excerpt); a live row whose currency is superseded_compacted is the
      archive skeleton plus currency (no category_tags, serves or kind); --write serialises {"decisions": [...],
      "metadata": {...}} with one compact sort_keys row per line (separators (",", ":")), the same parsed object;
      _build_triage_excerpt becomes public build_triage_excerpt; new public build_excerpts(numbers) and CLI
      `--excerpts <comma-separated ids | all>` print one JSON line per live id, sorted keys {number, triage_excerpt,
      triage_excerpt_source, triage_excerpt_truncated}, from the same shared parser, and exit 2 naming every id that is
      not a live decision. Nothing new is committed or freshness-checked; check_index_freshness is unchanged.
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated by `bin/venv-python -m scripts.decisions_index --write` only; never hand-edited.
  - file: tests/test_decisions_index.py
    action: Modify
    purpose: >-
      Add TestSlimIndex (exact key sets for live, stub and archive rows; no excerpt key on any row; the --write output
      has one row per line and parses to build_index(); the mean live row is at most 60 percent of the bytes it carries
      with build_excerpts' three fields added back, a shape ratio and never an absolute byte ceiling),
      TestSkeletonCompactedStubRows (every superseded_compacted row's keys equal the archive skeleton plus currency,
      and the corpus has at least one such row), and TestPersonaExcerptCoupling (fails when either default of
      gates.decision_scout.verdict_source in docs/contracts/project-configuration.yaml is actions while
      docs/contracts/personas/decision_scout.yaml's input_schema has no decision_excerpts property). Update
      TestDeterminism and TestSkeletonArchiveRows key sets; move TestTriageExcerptUnit and TestTriageExcerptIntegration
      to tests/test_decision_excerpts.py (relief: 458 of 500 SLOC on 2026-11-17).
  - file: tests/test_decision_excerpts.py
    action: Create
    purpose: >-
      The moved excerpt classes, now over build_triage_excerpt and build_excerpts, plus TestExcerptsCli: --excerpts
      for named ids and for all (one line per live id, each beginning {"number":N,), and exit 2 naming an archived and
      an unknown id.
  - file: tests/test_decision_scout_retrieval.py
    action: Modify
    purpose: >-
      Probes score title + the excerpt from build_excerpts joined on number (the scout's new read path); the
      excerpt-only pg_dump -> Decision 100 probe keeps its zero-title-overlap assertion; no probe is removed.
  - file: .claude/skills/decision-scout/SKILL.md
    action: Modify
    purpose: >-
      Steps 1, 2 (input bullets) and 3 exactly as docs/plans/approved/decision-index-slim-rows.yaml binds; the file
      shrinks (11,285 -> about 11,270 bytes); nothing else changes.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: Lower the S4 entry for .claude/skills/decision-scout/SKILL.md to the new measured size (ratchet down only).
  - file: docs/contracts/instruction-architecture.yaml
    action: Modify
    purpose: >-
      gate_subagent_retrieval.bounded_retrieval and .triage_source_provenance, and a new amendment_log entry
      (governance_note_add, semantic_break false), exactly as the sidecar binds.
  - file: scripts/preflight/emergent_north_star.py
    action: Modify
    purpose: >-
      load_entries' fallback text, used when a parsed row has no Intent or Problem, is build_triage_excerpt over the
      parsed row (same derivation) instead of the index row's removed triage_excerpt.
  - file: tests/session/preflight/test_emergent_north_star.py
    action: Modify
    purpose: >-
      test_load_entries_text_related_dates_and_fallbacks drops the index fixture's triage_excerpt and asserts the
      fallback text comes from the parsed row's Context or Decision field; 100 percent line coverage holds.
  - file: config/agent/verification_registry/entries/dec-164-index-triage-discoverable.yaml
    action: Modify
    purpose: >-
      Repair (Decision 244 cl.5, claim unchanged): the same assertions on Decision 164 (live, amends [116, 122], lambda
      tag, Intent-sourced excerpt of at most 320 chars containing "CLI-hosting class"), with the excerpt fields read
      from scripts.decisions_index.build_excerpts([164]); guard_target follows to scripts/decisions_index.py.
  - file: config/agent/verification_registry/entries/decisions-index-archive-rows-are-skeletons.yaml
    action: Modify
    purpose: >-
      Repair (Decision 244 cl.5): archive-row assertion and thinness ratio unchanged; the live key set loses the
      excerpt trio; superseded_compacted rows must equal the skeleton plus currency.
  - file: scripts/roadmap/scout_replay.py
    action: Create
    purpose: >-
      The scorer for this build's one-shot recall replay (the audit's abort test; not the T4.14 lane and not a
      standing runner: it dispatches nothing). `plans --ref R --count 10 --exclude SLUG` lists the newest
      schema_version 6 plans at R with non-empty cites, by the commit that added them; `brief --plan P --ref R` prints
      the scout input (intent, approach from scope purposes and constraints, scope files, tier; never cites, context,
      gate_rounds or bundled recs); `score --runs D --base R --head H --baseline-runs 3 --slim-runs 5` applies the
      pre-registered rule in context to the run files and adjudication under D, prints the per-plan recall table, the
      bootstrap interval, both refs' whole-load index bytes and a report-only stable-keep drop share, and ends with
      REPLAY PASS or REPLAY ABORT: <rule> (exit 1); exit 2 when a run or adjudication file is missing or malformed.
  - file: tests/test_scout_replay.py
    action: Create
    purpose: >-
      TestBrief (no cites, context, gate_rounds or bundled ids leak into a brief), TestPlanSelection, and TestAbortRule
      (the bootstrap rule and the hard tripwire each fire on a crafted fixture and stay quiet one step short of it, the
      bootstrap is seeded and reproducible, the stable-keep share never aborts, and incomplete runs exit 2).
bundled_recommendations: [rec-3250, rec-5258]
followon_recs: [rec-5308, rec-5309, rec-5310]
infrastructure_dependencies: []
acceptance_criteria:
  - "rec-3250 and rec-5258 acceptance nodes pass: TestSlimIndex and TestSkeletonCompactedStubRows (VP 1, 2)."
  - "The committed index is under 110,608 bytes at the build's head, measured once (VP 5), and no test, check or graduated record pins an absolute index size."
  - "The excerpt command serves every live id and refuses others (VP 3); the retrieval probes pass through it (VP 4)."
  - "The skill shrinks and its prose pin is lowered; the bound wording matches the approved sidecar (VP 10, 11)."
  - "The recall replay prints REPLAY PASS (VP 13), or the graded fallback lands by plan amendment and its re-run passes."
  - "rec-3250 and rec-5258 read closed after merge (VP 14)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-3250 acceptance, slim rows.
    command: bin/venv-python -m pytest tests/test_decisions_index.py::TestSlimIndex -q
    expected: The class passes; on the unchanged tree it does not exist (pytest exit 4).
    fix_if: Any failure; fix the generator, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: decisions-index-slim-rows
  - step: 2
    phase: pre-deploy
    action: rec-5258 acceptance, compacted-stub skeleton rows.
    command: bin/venv-python -m pytest tests/test_decisions_index.py::TestSkeletonCompactedStubRows -q
    expected: The class passes; absent on the unchanged tree.
    fix_if: Any failure; fix the generator.
    hermetic: true
    graduation: graduate
    graduation_check_id: decisions-index-compacted-stub-skeletons
  - step: 3
    phase: pre-deploy
    action: The on-demand excerpt command.
    command: bin/venv-python -m pytest tests/test_decision_excerpts.py::TestExcerptsCli -q
    expected: The class passes; absent on the unchanged tree.
    fix_if: Any failure.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-excerpts-cli
  - step: 4
    phase: pre-deploy
    action: Curated retrieval probes through the new read path, and the moved excerpt classes.
    command: bin/venv-python -m pytest tests/test_decision_scout_retrieval.py tests/test_decision_excerpts.py -q
    expected: All pass.
    fix_if: A probe fails; the excerpt join is wrong, never the probe.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of files this plan creates or modifies (hermetic rule v); the probes file is already the
      graduated record decision-scout-retrieval-probes and VP 3 graduates the excerpt command.
  - step: 5
    phase: pre-deploy
    action: Measure the whole-load bytes once against the audit target.
    command: >-
      bin/venv-python -c "import json, os; p = 'docs/decisions-index.json'; n = os.path.getsize(p); m = sum(1 for r in
      json.load(open(p))['decisions'] if r['live']); assert n < 110608, n; print('INDEX_UNDER_AUDIT_TARGET', n, m)"
    expected: Prints the marker with the byte count and live count; the unchanged tree fails the assertion (187,040).
    expected_literals: [INDEX_UNDER_AUDIT_TARGET]
    fix_if: The assertion fails; a row still carries an excerpt field or the serialiser is not one compact row per line.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim (Decision 244 cl.4): a standing absolute byte bound would be the stock ceiling Decision 179 retired;
      Decision 179's re-armed index-read-context-cost condition watches the figure at review.
  - step: 6
    phase: pre-deploy
    action: The committed index is fresh.
    command: bin/venv-python -m scripts.decisions_index --check
    expected: Exit 0 with the current-index line.
    expected_literals: [Decisions index is current.]
    fix_if: Regenerate with --write and commit the generator output.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates the registered validate_decisions_index_freshness check.
  - step: 7
    phase: pre-deploy
    action: The Actions persona cannot be switched on while it lacks the excerpt input.
    command: bin/venv-python -m pytest tests/test_decisions_index.py::TestPersonaExcerptCoupling -q
    expected: The class passes; absent on the unchanged tree.
    fix_if: Any failure.
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-scout-persona-excerpt-coupling
  - step: 8
    phase: pre-deploy
    action: Emergent north-star fallback reads the parsed row.
    command: bin/venv-python -m pytest tests/session/preflight/test_emergent_north_star.py::test_load_entries_text_related_dates_and_fallbacks -q
    expected: Passes.
    fix_if: Any failure; also re-run the file under coverage (graduated emergent-north-star-coverage, 100 percent).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The file is already the graduated records emergent-north-star-bucket and emergent-north-star-coverage.
  - step: 9
    phase: pre-deploy
    action: The replay harness and its abort rule.
    command: bin/venv-python -m pytest tests/test_scout_replay.py::TestAbortRule tests/test_scout_replay.py::TestBrief -q
    expected: Both classes pass; absent on the unchanged tree.
    fix_if: Any failure.
    hermetic: true
    graduation: graduate
    graduation_check_id: scout-replay-abort-rule
  - step: 10
    phase: pre-deploy
    action: The skill shrank and its pin follows.
    command: >-
      bin/venv-python -c "import os, yaml; f = '.claude/skills/decision-scout/SKILL.md'; n = os.path.getsize(f); b =
      yaml.safe_load(open('config/prose_budgets.yaml'))['S4'][f]; assert n == b < 11285, (n, b);
      print('SCOUT_SKILL_SHRUNK', n)"
    expected: Prints the marker; the unchanged tree fails (11,285 is not below 11,285).
    expected_literals: [SCOUT_SKILL_SHRUNK]
    fix_if: Lower the pin to the measured size, or tighten the unbound text, never the bound wording.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Moment claim; validate_prose_limits already holds the size equal to its pin.
  - step: 11
    phase: pre-deploy
    action: The bound wording matches the approved sidecar.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-index-slim-rows --base origin/main
    expected: Exit 0.
    fix_if: Restore the sidecar's exact words; a change of wording needs a new approval run (Decision 246).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_merge_step runs the same verification at merge.
  - step: 12
    phase: pre-deploy
    action: Fast and full tiers, including the repaired registry records' differential admission.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and validation_result verifies the head sha. The full tier is started in the background with a
      2 h limit from the top-level session; its verdict is --verify-head's.
    fix_if: >-
      A failure this diff causes is fixed on the branch; one that reproduces on origin/main is cited by its rec in the
      PR body, never fixed inline.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: pre-deploy
    action: >-
      The recall replay (the audit's abort test), once, after VP 1-12 pass and before merge, run as execution step 6
      describes; its run files are written under /mnt/project-files/decision-growth/slim-index/replay/.
    command: >-
      bin/venv-python -m scripts.roadmap.scout_replay score --runs /mnt/project-files/decision-growth/slim-index/replay/
      --base "$(cat /mnt/project-files/decision-growth/slim-index/replay/BASE)" --head HEAD --baseline-runs 3
      --slim-runs 5
    expected: >-
      Per-plan recall table, the bootstrap interval, both refs' whole-load bytes and the report-only stable-keep share,
      then REPLAY PASS.
    fix_if: >-
      REPLAY ABORT: do not merge; send the table to the coordinator as a plan defect for the owning planner, whose
      amendment is the pre-registered graded fallback (untagged live rows keep their excerpt fields in the index; the
      title screen then covers only tagged entries the plan's tags miss), after which the build re-runs the replay
      once. Exit 2: re-run only the missing runs.
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: The bundled recs closed on merge (Resolves trailer).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, missing =
      fetch_recs_by_ids(make_reader(), ['rec-3250', 'rec-5258']); s = {r['id']: r['status'] for r in rows}; assert not
      missing and set(s.values()) == {'closed'}, (s, missing); print('RECS_CLOSED', s)"
    expected: RECS_CLOSED with both ids closed.
    fix_if: The closure job did not run; check the squash body's Resolves line and re-run per git-ops.yaml.
    hermetic: false
