  every Decision PR for a race with zero recorded renumbers in ten merges -- and rec-4793 is rewritten to a fill tool;
  rec-4795, rec-4796 and rec-4794 stay separate. Adapted: the tool is its own module (Decision 131 mirror test), and
  the command is named in number_assignment and the two FAIL lines instead of the implement skill, whose prose budget
  has zero headroom (33216 = 33216 on 6d1d1f14); rec-4664's sentence keeps only claims true today."
- "Approved text: the sidecar's words are approved on GitHub through the approved-text-approval run (Decision 246);
  the run link and approval are recorded in the PR body and the handoff, and the plan PR does not merge before it."
- "No numbered Decision is drafted: this is tooling and contract alignment under Decision 217 clause 5 and
  decision-entry.yaml number_assignment (decision-entry.yaml significance routing)."
- "Lessons carried from PLAN-decision-renumber-at-merge's build: graduate rows name new nodes or new files (a whole
  pre-existing test file is tautological to the differential gate, rec-4802); real-corpus cases run on a local clone
  with the new module committed there, OTL_VENV_PYTHON and a git identity."
pre_implementation_checklist:
- >-
  Branch confirmed not on main
- >-
  docs/PROJECT_CONTEXT.md read
- >-
  Decisions 217 (clauses 2 and 5), 246, 134 (clause 3) and 128 sections read
- >-
  docs/plans/approved/decision-number-fill.yaml read; every block's before found once in its file
- >-
  The build branch's base carries the merged sidecar (`git cat-file -e $(git merge-base origin/main
  HEAD):docs/plans/approved/decision-number-fill.yaml` exits 0); otherwise rebase onto origin/main first
- >-
  All files in scope located and readable
execution_steps:
- >-
  scripts/session/decision_fill.py and tests/test_session_decision_fill.py, including the real_corpus case (VP 1 red,
  then green; VP 5).
- >-
  The two FAIL lines and their new test nodes (VP 2).
- >-
  docs/contracts/decision-entry.yaml and docs/contracts/candidate-decision-ratification.yaml from the sidecar blocks
  verbatim (`{{DATE}}` = landing date) (VP 3, 4).
- >-
  Graduate VP 1 into its registry row; set implementation_declared true in this plan.
- >-
  Execute the Verification Plan; loop until pass; on unrecoverable failure stop and RCA (Decision 55).
- 'Commit Flow: the implementation commit carries `Resolves: rec-4793, rec-4664, rec-4659`; full tier + --verify-head
  (VP 7); push; PR; premerge with --expect 96837195fae32afffb5c1441ea895f1985230e0756244539542a65e6da840444; merge
  with that commit message; readback (VP 8-9).'
- 'Report: what was implemented, verification results.'
rollback: >-
  Revert the PR. Nothing persists outside git: the tool writes only the working tree and never commits, and the
  contract wording reverts with it.
gate_rounds:
