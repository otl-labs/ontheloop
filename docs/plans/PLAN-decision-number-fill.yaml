schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-number-fill
intent: >-
  Replace the implementer's hand fill of a new Decision's number placeholder with one command,
  scripts.session.decision_fill, that assigns MAX + 1 through the shared placeholder grammar and rewrites the
  heading, the envelope number and the entry's citations of itself, and name that command wherever an unfilled
  placeholder is reported or the number rule is stated. Plan D2 of the joint review: numbering stays at
  implementation (Decision 217 clause 5), and the two contract notes that still restate the old race rule point at
  decision-entry.yaml number_assignment.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-number-fill.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-4793 (rewritten 2026-11-08 to this scope), rec-4664 and rec-4659,
  the Decision-numbering follow-ons of PLAN-decision-renumber-at-merge and PLAN-decision-serves-kind-grammar.
scope:
- file: docs/plans/approved/decision-number-fill.yaml
  action: Create
  purpose: >-
    Lands WITH THIS PLAN (plan PR), never in the build. The approved-text sidecar (git-ops.yaml approved_text_binding):
    six blocks -- three on docs/contracts/decision-entry.yaml (entry-number-assignment, entry-parser-note,
    entry-amendment) and three on docs/contracts/candidate-decision-ratification.yaml (ratification-plan-note,
    ratification-implement-note, ratification-amendment). `{{DATE}}` (the landing date) is the only placeholder.
    Digest 96837195fae32afffb5c1441ea895f1985230e0756244539542a65e6da840444 (VP step 3).
- file: scripts/session/decision_fill.py
  action: Create
  purpose: >-
    CLI `bin/venv-python -m scripts.session.decision_fill` (no arguments; it acts on `git rev-parse --show-toplevel`
    of the cwd) plus importable fill(root, onto="origin/main") -> Result(assigned, rewrites, bare, errors), side-effect
    free at import. Placeholder headings are read only through scripts.decisions_md.iter_placeholder_headings (match
    group(1) == scripts.decisions_md.PLACEHOLDER_NUMBER) and each entry's envelope through
    extract_entry_envelope(block, placeholder=True) (Decision 134 clause 3); no heading regex in the module. Base =
    MAX(decision numbers in docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md in the working tree, through
    scripts.decisions_md.decision_header_numbers(paths=...), and at `onto`, through
    scripts.session.decision_renumber.numbers_at). Placeholder entries are numbered base + 1, + 2, ... from the
    bottom-most placeholder heading upward, so the file stays newest first. An entry's block runs from its heading to
    the next Decision heading of either grammar; inside it every placeholder token becomes the number. Outside the
    blocks: on every line added since merge-base(onto, HEAD), working-tree changes included (`git diff -U0
    <merge-base> --`, plus untracked files read whole as added), in every file except those under docs/plans/**
    (plans and approved-text sidecars keep the placeholder), a placeholder is filled when exactly one entry was
    numbered and is a bare hit otherwise; this covers a dated annotation added to an older entry's body (Decision
    177) and roadmap ratified_as/filed_via targets. An entry whose envelope number is neither the placeholder nor
    absent is an error. Clean (no bare hit, no error): write every file, regenerate docs/decisions-index.json with
    `bin/venv-python -m scripts.decisions_index --write` (shlex.split, no shell), print one `FILL <placeholder> -> N:
    <title>` line per entry, one `REWRITE <file>:<line>` per outside-block fill, `REGENERATED
    docs/decisions-index.json`, then `FILL CLEAN`, exit 0. No placeholder heading: `FILL NONE`, exit 0, nothing
    written. Not clean: print each `BARE <file>:<line>` and `ERROR <reason>`, then `FILL NOT CLEAN -- surface it to
    the human`, exit 1, nothing written. Never commits, never pushes, never edits docs/plans/**; a second run is
    FILL NONE. Never raises at import. Under 500 SLOC (Decision 128).
- file: tests/test_session_decision_fill.py
  action: Create
  purpose: >-
    Real temporary git repos (tests/fixtures/merge_step_repos.py helpers make_repo, commit_file, branch): one
    placeholder entry fills to MAX + 1 across both corpus files and origin/main (main's own max wins when it is
    higher), with heading, envelope number and in-block self-citations filled; two placeholder entries number from the
    bottom up and leave a placeholder outside both blocks as BARE with nothing written; with one entry, a placeholder
    on a branch-added line of another file and in a dated annotation inside an older entry is filled, while the same
    token on a line already on main is left alone; a docs/plans/ plan and sidecar keep their placeholder; an
    envelope number that is a concrete number on a placeholder heading is an ERROR; no placeholder prints FILL NONE
    and a second run after a fill is FILL NONE; docs/decisions-index.json is regenerated (a fixture generator); the
    module imports iter_placeholder_headings and carries no heading regex; nothing is committed. Every subprocess
    gets a git identity and no signing through the environment (GIT_AUTHOR_*/GIT_COMMITTER_* and GIT_CONFIG_COUNT=1,
    GIT_CONFIG_KEY_0=commit.gpgsign, GIT_CONFIG_VALUE_0=false). The real_corpus case (VP 5) runs on `git clone
    --local` of this repo into tmp_path: copy the working-tree scripts/session/decision_fill.py in and commit it as
    the clone's base only when `git status --porcelain` is non-empty; insert a placeholder entry (heading and
    envelope as decision-entry.yaml requires) at the top of the clone's docs/DECISIONS.md; run
    `[sys.executable, "-m", "scripts.session.decision_fill"]` with the clone as cwd and
    OTL_VENV_PYTHON=sys.executable (no .venv in the clone); assert FILL CLEAN with the real MAX + 1, that
    validate_decision_entry_conformance's placeholder FAIL is gone in the clone, and that the real repo's
    docs/DECISIONS.md and docs/decisions-index.json hash the same before and after.
- file: scripts/checks/decisions/validate_decision_entry_conformance.py
  action: Modify
  purpose: >-
    The unfilled-placeholder-heading FAIL line (line 226 on main 6d1d1f14) appends `-- run bin/venv-python -m
    scripts.session.decision_fill`. No other change and no new import (new_imports: none).
- file: scripts/checks/decisions/envelope_rules.py
  action: Modify
  purpose: >-
    number_issues' unfilled-number message (line 90) names the same command after "fill MAX + 1". No other change
    and no new import (new_imports: none).
- file: tests/checks/decisions/validate_decision_entry_conformance/test_serves_kind.py
  action: Modify
  purpose: >-
    New TestFailRules::test_unfilled_heading_names_the_fill_command: the FAIL line carries `scripts.session.decision_fill`.
    Existing nodes unchanged, so graduated shard decision-entry-serves-kind-enforced is kept as it is.
- file: tests/checks/decisions/test_envelope_rules.py
  action: Modify
  purpose: >-
    New TestKeysAndNumber::test_unfilled_number_names_the_fill_command. Existing nodes unchanged.
- file: docs/contracts/decision-entry.yaml
  action: Modify
  purpose: >-
    Sidecar blocks entry-number-assignment, entry-parser-note and entry-amendment verbatim (`{{DATE}}` filled):
    number_assignment names the command (rec-4793), shared_parser_note names the placeholder grammar (rec-4664), and
    a new amendment_log entry records both. The only other edit: rewrap number_assignment's folded scalar to lines
    of at most 120 characters, words unchanged (the sidecar's word-level verify passes a rewrap), so effective lines
    go 493 -> 495 instead of 496 (NEAR_CAP relief; the wording check ran on that tree).
- file: docs/contracts/candidate-decision-ratification.yaml
  action: Modify
  purpose: >-
    Sidecar blocks ratification-plan-note, ratification-implement-note and ratification-amendment verbatim
    (`{{DATE}}` filled): both numbering-race notes point at decision-entry.yaml number_assignment (rec-4659), and a
    new amendment_log entry at the top of the log records it.
bundled_recommendations: [rec-4793, rec-4664, rec-4659]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  One command numbers every placeholder Decision entry at MAX + 1, fills its heading, envelope and citations of
  itself, regenerates the decisions index and prints FILL CLEAN; an ambiguous placeholder or a mismatched envelope
  writes nothing (VP steps 1, 5).
- >-
  Both unfilled-placeholder FAILs name the command (VP step 2).
- >-
  decision-entry.yaml and candidate-decision-ratification.yaml carry exactly the approved words, and the three
  bundled recs' acceptances hold (VP steps 3-4).
verification_plan:
- step: 1
  phase: pre-deploy
  action: decision_fill fixture-repo tests.
  command: bin/venv-python -m pytest tests/test_session_decision_fill.py -q
  expected: All tests pass.
  fix_if: Any failure.
  hermetic: true
  graduation: graduate
  graduation_check_id: decision-fill-tests
- step: 2
  phase: pre-deploy
  action: The two FAIL lines name the fill command.
  command: >-
    bin/venv-python -m pytest
    "tests/checks/decisions/validate_decision_entry_conformance/test_serves_kind.py::TestFailRules::test_unfilled_heading_names_the_fill_command"
    "tests/checks/decisions/test_envelope_rules.py::TestKeysAndNumber::test_unfilled_number_names_the_fill_command" -q
  expected: Both tests pass.
  fix_if: Any failure.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Two message-text assertions inside files the fast tier already runs on every change to these modules; a
    standing registry row would guard only a string.
- step: 3
  phase: pre-deploy
  action: Approved text binds both contracts, digest as recorded.
  command: >-
    bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-number-fill --expect
    96837195fae32afffb5c1441ea895f1985230e0756244539542a65e6da840444
  expected: APPROVED-TEXT OK with the digest.
  expected_literals: [APPROVED-TEXT OK 96837195fae32afffb5c1441ea895f1985230e0756244539542a65e6da840444]
  fix_if: A MISMATCH line -- restore the approved words; never edit the sidecar (a needed change is a new operator ask).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_merge_step already enforces the sidecar on every PR that declares this plan.
- step: 4
  phase: pre-deploy
  action: The three bundled recs' stored acceptances at the PR head.
  command: >-
    bin/venv-python -m pytest tests/test_session_decision_fill.py -q && grep -q 'iter_placeholder_headings'
    scripts/session/decision_fill.py && grep -q 'iter_placeholder_headings' docs/contracts/decision-entry.yaml && grep
    -q 'placeholder=True' docs/contracts/decision-entry.yaml && grep -q 'number_assignment'
    docs/contracts/candidate-decision-ratification.yaml && ! grep -q 'claimed the drafted number'
    docs/contracts/candidate-decision-ratification.yaml
  expected: Exit 0.
  fix_if: Read the recs with fetch_recs_by_ids; never edit an acceptance to pass.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Its pytest half is VP step 1's graduated file; the greps are bound by VP step 3's sidecar.
- step: 5
  phase: pre-deploy
  action: Real-corpus smoke on a local clone -- a placeholder entry at the top of the real DECISIONS.md.
  command: bin/venv-python -m pytest tests/test_session_decision_fill.py -q -k "real_corpus"
  expected: >-
    The real-corpus case fills the entry at the real MAX + 1 with FILL CLEAN, the conformance placeholder FAIL is
    gone in the clone, and the real repo's DECISIONS.md and decisions-index.json are unchanged.
  fix_if: Any failure.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A subset of VP step 1's graduated file.
- step: 6
  phase: pre-deploy
  action: Fast tier.
  command: bin/venv-python -m scripts.validate --pre
  expected: Exit 0.
  fix_if: Any failure.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole fast-tier run; graduate steps may not invoke scripts.validate (recursion).
- step: 7
  phase: pre-deploy
  action: Commit Flow full tier and HEAD attestation before each push (handoff_policy).
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: The full tier exits 0 and the validation result attests the current HEAD's tree.
  fix_if: Any failure -- fix and rerun the full tier from the start.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
- step: 8
  phase: post-deploy
  action: Read the merge commit back (MERGE_SHA is the sha merge_pull_request returned).
  command: bin/venv-python -m scripts.session.merge_step readback --slug decision-number-fill --sha "$MERGE_SHA"
  expected: READBACK OK naming rec-4793, rec-4664 and rec-4659.
  fix_if: READBACK MISSING -- run `bin/venv-python -m scripts.session.merge_step recover --slug decision-number-fill --sha "$MERGE_SHA"`.
- step: 9
  phase: post-deploy
  action: After the merge push run's trailer-closure job concludes, the three recs are closed through the Decision 201 gate.
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows, m =
    fetch_recs_by_ids(make_reader(), ['rec-4793', 'rec-4664', 'rec-4659']); print([(r['id'], r['status']) for r in
    rows], m)"
  expected: All three closed, none missing.
  fix_if: Follow git-ops.yaml resolves_trailer's route for the marker in the trailer-closure job log; never close by hand.
test_obligations:
- source: scripts/session/decision_fill.py
  behavior: Placeholder entries number at MAX + 1 bottom up through the shared grammar; ambiguous or mismatched input writes nothing.
  verification_step: 1
  test_selector: tests/test_session_decision_fill.py
  red_green_expectation: red before (file absent), green after
- source: scripts/checks/decisions/validate_decision_entry_conformance.py
  behavior: The unfilled-heading FAIL names the fill command.
  verification_step: 2
  test_selector: tests/checks/decisions/validate_decision_entry_conformance/test_serves_kind.py::TestFailRules::test_unfilled_heading_names_the_fill_command
  red_green_expectation: red before (the line names no command; the node is new), green after
- source: scripts/checks/decisions/envelope_rules.py
  behavior: The unfilled-number message names the fill command.
  verification_step: 2
  test_selector: tests/checks/decisions/test_envelope_rules.py::TestKeysAndNumber::test_unfilled_number_names_the_fill_command
  red_green_expectation: red before (the message names no command; the node is new), green after
- source: docs/contracts/decision-entry.yaml
  behavior: number_assignment, shared_parser_note and the amendment line are exactly the approved text.
  verification_step: 3
  command: bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-number-fill --expect 96837195fae32afffb5c1441ea895f1985230e0756244539542a65e6da840444
  red_green_expectation: >-
    red before (verify prints APPROVED-TEXT MISMATCH naming the unedited file), green after;
    validate_decision_entry_conformance's real-contract tests run in VP 6
- source: docs/contracts/candidate-decision-ratification.yaml
  behavior: Both numbering-race notes and the amendment line are exactly the approved text.
  verification_step: 3
  command: bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-number-fill --expect 96837195fae32afffb5c1441ea895f1985230e0756244539542a65e6da840444
  red_green_expectation: red before (verify prints APPROVED-TEXT MISMATCH naming the unedited file), green after
constraints:
- >-
  Approved text is binding. Copy every sidecar `after` verbatim into its file, line breaks included; never edit the
  sidecar. Any other change to a bound file is a new operator ask: stop and report.
- >-
  Numbering stays at implementation (Decision 217 clause 5): never relax the unfilled-placeholder gates, never
  carry a placeholder in docs/DECISIONS.md to merge.
- >-
  No AGENTS.md, CLAUDE.md, skill or command text (the implement skill's prose budget has zero headroom); no CI
  workflow, IAM, Terraform or Lambda change; scripts/session/decision_renumber.py and rebase_resolve.py are imported
  from, never edited.
- >-
  Never weaken a check or an acceptance to obtain green (Decision 181; implement-scope-boundary.yaml CONTENT).
- >-
  500 SLOC per file (Decision 128): decompose, never raise.
- >-
  No rescue agents or workaround loops (Decision 55).
- >-
  No file under scripts/session/ may contain the tokens `rec_relevance` or `run_acceptance_probe` (graduated row
  preflight-never-runs-acceptance-probes).
context:
- "Decision-scout NO_FLAGS. Decisions triaged: 202 of 202. Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2.
  Serves: NS.4 3/5. CITE 217 (cl.5 max-plus-one with the re-check; cl.2 the renumber D1 built), 246 (cl.2 the
  approved-words digest ignores a filled placeholder; cl.1 the approval run), 134 (cl.3 shared parser). RELATED 177
  (a placeholder in a dated annotation on an older entry -- covered by the outside-block rule), 167, 105
  (ratified_as/filed_via kept in the implement note), 146 (MAX includes the archive), 245, 168, 128, 66, 196;
  T2.54, T4.23. Folded in: docs/decisions-index.json is regenerated by the tool."
- "gates: decision-scout=NO_FLAGS; wording-check=PASS (round 2, after shortening the parser-note sentence for line headroom); plan-critique=pending"
- "Operator direction 2026-11-08 01:08Z and 01:10Z (Benjamin, project chat): start D2 now, take the
  recommendations of a blind Fable consult, then write the plan. Consult: /mnt/project-files/plan-d/d2/advisor-brief/BRIEF.md
  and /mnt/project-files/plan-d/d2/ADVICE.md (with the reconciliation). Adopted: rec-4793's original ask (carry the
