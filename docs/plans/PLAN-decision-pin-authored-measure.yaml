execution_steps:
  - >-
    Rebase onto origin/main first. Create tests/fixtures/decision_entry.py as scoped (the dry-build diff in context is a
    reference, not a mandate; never apply it wholesale).
  - Create tests/checks/decisions/test_decision_pin_measure.py covering acceptance_criteria[1], [3] and [4], with the node names VP step 1 selects.
  - >-
    Before rerouting the pins, run the guard node (test_no_test_pins_a_decision_by_its_whole_span) and record in the PR
    body that it fails naming the seven pin files (acceptance_criteria[3] red before).
  - Route the seven pins through the fixture as scoped; change nothing else in those files.
  - Run VP steps 1-6; loop until pass; on an unrecoverable failure stop and RCA (Decision 55). Reconcile weakening_dispositions keys with validate_weakening_candidates output if they differ.
  - >-
    Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state; parent
    validator evidence (VP step 6 full-tier exit 0 plus bin/venv-python -m scripts.checks.validation_result --verify-head
    for the pushed HEAD); structured postflight evidence (write the scripts.session.postflight_evidence.CATEGORIES JSON
    in the scratchpad, then bin/venv-python -m scripts.session.postflight --evidence <file>); the real outcome -- push,
    PR (body carries the red-before guard output and the headroom table), CI green by event-driven wake (never polled),
    code review PROCEED, squash-merge, then VP step 7.
  - >-
    Merge under the project's standing rule (code review PROCEED and CI green; tests only, nothing on the always-ask
    list). Squash with mcp__github__merge_pull_request(merge_method="squash") and an explicit commit_message whose body
    ends with its own key-value block -- the line "Resolves: rec-4730" directly above the Co-Authored-By and
    Claude-Session attribution lines (git-ops.yaml resolves_trailer); the PR body alone does not reach the squash commit.
  - 'Report: what was implemented, verification results, headroom per pinned Decision, the four closure facts.'
rollback: Revert the PR; the pins return to whole-span measures. No runtime, data or Decision change.
