constraints:
  - Tests only. No Decision text, contract, parser or validator edit; a needed one stops the build and returns to planning.
  - >-
    Decision 235 cl.1: the seven pins stop counting trailing dated annotations. This plan names that loosening for human
    confirmation; no pin is red today (measured 2026-10-29), so it is not a weakening to obtain green. In-place growth of
    an entry's own text stays hard-fail.
  - Shared helper lives in tests/fixtures/ (tests/CLAUDE.md, Decision 131); no test_* module imports another.
  - No rescue agents or workaround loops (Decision 55).
