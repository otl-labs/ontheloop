  that the number of ad-hoc Decision-entry reads in each changed test file that reads the real docs/DECISIONS.md never rises
  against the base ref, so new tests read entries through the shared fixture (tests/fixtures/decision_entry.py: decision_entry
  for the test''s own subject, live_block for another entry) and a later chain consolidation changes data, not tests. It freezes
  today''s reads, loosens nothing and blocks no consolidation (rec-5638).'
