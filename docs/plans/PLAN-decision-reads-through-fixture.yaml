scope:
- file: scripts/checks/decisions/decision_reads_through_fixture.py
  action: Create
  purpose: 'The check. Pure detector ad_hoc_sites(text) -> tuple[list[tuple[int, str]], bool] (counted (line, shape) sites,
    and whether the module reads the real log) over one test module''s AST. Reads the real log: a `/` join whose right side
    holds a log name (a str constant ending DECISIONS.md, or a module-global name bound to one, e.g. test_consolidation.py:16
    DEC) and whose leftmost operand, walking through attributes, subscripts and method calls (Path(__file__).resolve().parents[2]),
    is a module-global name (a root built from __file__ or an imported name, never a function parameter such as tmp_path)
    or Path(__file__...); a .joinpath(...) call holding a log name on such a root; a Path(<log name>) call; or a call to a module-global name (assigned,
    imported, or a module-level def or class, e.g. test_recovery_policy_surfaces.py:19-28 _read) whose positional args are
    all constants or log names and one is a log name. Shapes counted (entry isolation only): a str-method call (index, rindex,
    find, rfind, split, rsplit, count, partition, rpartition, startswith, endswith) whose receiver is not an imported name
    (so a module function such as consolidation.partition(5, ''## Decision 5: ...'') is not counted, test_consolidation.py:387-405)
    and whose argument holds an entry marker or a module or local name assigned one; a re.* call (compile, search, match, fullmatch,
    findall, finditer, split, sub, subn) whose first argument does. An entry marker names one entry: a ''## Decision'' str
    constant followed by a literal number or by title words (two or more letters once backslash escapes are dropped), or
    a ''## Decision'' constant inside an f-string with a placeholder, a % or + expression or a .format call. A header-only
    pattern (r''^## Decision (\d+):'', ''\n## Decision '' used to find the next heading) is not counted: it walks or bounds
    every entry, so the start half of an isolation carries the count (critique r2 B3); an iter_decision_sections / _iter_decision_sections
    call used as the iterable of a loop or comprehension that filters on one entry number (an == or in comparison over an
    expression holding match.group(...), wrapped or not, e.g. int(match.group(1)) == 72) or of a dict comprehension keyed
    by such an expression. A whole-log walk with no number filter, parse_decisions_md rows and extract_entry_envelope fields
    are not counted (corpus-wide invariants have no single-entry route, scout r1 Decision 163 note). tests/fixtures/decision_entry.py
    (the sanctioned reader) is never scanned. validate_decision_reads_through_fixture(failed, root=None): base = _common.status_diff_base(root)
    (Decision 159: no second resolver); skipped(reason) when None; a RuntimeError from it (Decision 254 prev not an ancestor)
    appends a failure naming it. Changed files = `git diff --name-status -M <base> -- ''tests/*.py''` (git pathspec * crosses
    /, so nested and root-level test modules are both listed and data files under tests/ never are; A, M, R; R compares against
    the old path; D ignored; any other letter (T, C, U) compares like M on the new path, never ignored) plus untracked tests/ files ending .py; a non-zero git diff exit appends a failure, never a pass. Texts
    are decoded utf-8 with errors=''replace''; base text by `git show <base>:<path>` (absent, or unparseable: base count 0,
    fail-closed); an unparseable head file appends a failure naming it. A file is counted when it reads the real log at head
    OR at base, so rewriting its path expression cannot zero its count. Fails per file whose head count exceeds its base count,
    naming the file, both counts, the new sites'' lines and the fix (''read the entry through tests.fixtures.decision_entry:
    decision_entry for this test''s own Decision, live_block or resolve_entry for another entry; live_block returns None once
    the entry is a stub, so assert that branch, never skip on it; a whole-log walk iterates iter_decision_sections without
    a number filter''); failure_detail(files). examined(n, unit=''test_files'') on a normal exit. Docstring: the per-chain
    probe (decision-compaction.yaml procedure step 1) stays the real guard; this check guards the reading discipline only;
    the real-log gate misses os.path.join with open() and a root imported at function scope;
    a rename that rewrites more than half the file falls below git''s -M similarity and reads as a delete plus an add, so its
    reads count as new. stdlib + scripts.checks._common + registry; under 250 SLOC.'
  new_imports:
  - scripts.checks._common
  - scripts.checks.registry
- file: scripts/checks/decisions/_manifest.py
  action: Modify
  purpose: Entry validate_decision_reads_through_fixture, pre=True, pre_globs ("tests/**", "scripts/checks/decisions/decision_reads_through_fixture.py",
    "scripts/checks/_common.py", "scripts/checks/registry.py"), full_segment "full_after_lint". "tests/**" because the fast tier's matcher
    (scripts/validate.py _pre_glob_match, plain fnmatch; tested replica scripts.checks.registry._pre_glob_match) does not match tests/test_x.py against "tests/**/*.py" (critique
    r2 B1; precedent scripts/checks/hygiene/_manifest.py:32).
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: 'function_to_category row validate_decision_reads_through_fixture: code_regression.'
- file: tests/checks/decisions/test_decision_reads_through_fixture.py
  action: Create
  purpose: 'Mirror test on synthetic two-commit git repos under tmp_path (git init, a base commit pushed to a local bare origin
    as main, a branch commit), with exactly these nodes: test_ad_hoc_entry_reads_never_rise_against_base, test_fixture_reads_are_not_counted,
    test_synthetic_log_reader_is_not_counted, test_whole_log_walk_is_not_counted, test_wrapped_group_filter_is_counted, test_module_constant_path_is_a_real_read,
    test_def_helper_read_is_a_real_read, test_gate_true_at_base_still_counts_after_a_path_rewrite, test_imported_module_receiver_is_not_counted,
    test_rename_compares_against_the_old_path, test_new_file_with_ad_hoc_read_fails, test_unparseable_head_fails_naming_the_file,
    test_diff_failure_fails_never_passes, test_no_base_is_skipped_never_passed, test_fixture_module_is_never_scanned, test_header_only_pattern_is_not_counted,
    test_non_python_test_data_is_ignored, test_manifest_runs_on_any_test_change.
    The first is a real-log reader gaining one ad-hoc read (fails naming the file and both counts); fixture reads (decision_entry,
    live_block) and a pure rename pass; the module-constant path (DEC = ''docs/DECISIONS.md''; ROOT / DEC), the def helper,
    the wrapped int(match.group(1)) filter and the base-only gate each count; an imported-module receiver and a tmp_path-only
    log do not; a new file with an ad-hoc read and an unparseable head fail; a failing git diff fails; no origin/main is skipped(),
    never passed; a header-only re.findall(r''^## Decision (\d+):'') walk and a ''\n## Decision '' next-heading find do
    not count while a titled heading regex does; a changed .json and .txt under tests/ are ignored (no failure, not examined);
    the manifest node asserts the Entry''s pre=True and full_segment, and through scripts.checks.registry._pre_glob_match
    that both tests/test_x.py and tests/a/test_x.py match one of its pre_globs (never import scripts.validate in-process:
    tests/checks/registry/test_manifest_contracts.py:135 asserts it is not loaded; critique r3 B1). Legs carried inside named
    nodes: test_diff_failure_fails_never_passes also patches status_diff_base to raise RuntimeError; test_new_file_with_ad_hoc_read_fails
    leaves the file untracked; test_rename_compares_against_the_old_path also deletes a counted file (ignored); test_unparseable_head_fails_naming_the_file
    also shows an unparseable base counts 0; test_module_constant_path_is_a_real_read also covers Path(__file__).resolve().parents[2]
    / ''docs'' / ''DECISIONS.md'' and ROOT.joinpath(''docs'', ''DECISIONS.md''); test_ad_hoc_entry_reads_never_rise_against_base
    also asserts the examined declaration on a passing run. Each synthetic repo sets a local user.name, user.email and commit.gpgsign=false
    (precedent tests/hooks/test_handoff_evidence_gate.py). It must itself score zero.'
