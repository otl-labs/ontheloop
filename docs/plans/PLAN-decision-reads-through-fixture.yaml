  - "config/ci_rca_taxonomy.yaml is at 500 of 500 effective lines (NEAR_CAP, 2026-11-25; no orphan row to retire) and eight unbuilt plans add rows. Relief (operator card 2026-11-25 16:15Z, 'Fold one long entry'): rewrite the workflows entry cost-reconciliation as one flow-style line with the same four keys and the same rationale words (frees 6 lines; the PLAN-persona-verdict-chain precedent), then add the row. No raise: a raise marker needs a Decision whose body names this file (Decision 165 cl.1, scout r2). rec-5275 (split the taxonomy) is the lasting relief and stays out of scope."
  - Tests only; graduated records and scripts/ are out of scope.
