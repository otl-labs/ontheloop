schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-reads-through-fixture
intent: >-
  Part 2 of the operator's two-part ruling (2026-11-25 11:04Z) on rec-5628: a static, millisecond fast-tier check that
  the number of ad-hoc Decision-entry reads in each changed test file that reads the real docs/DECISIONS.md never rises
  against the base ref, so new tests read entries through the shared fixture (tests/fixtures/decision_entry.py:
  decision_entry for the test's own subject, live_block for another entry) and a later chain consolidation changes
  data, not tests. It freezes today's reads, loosens nothing and blocks no consolidation (rec-5638).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-reads-through-fixture.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5638 (Medium, M), child of the operator's two-part ruling on rec-5628. Closes no roadmap criterion.
closes_criteria: []
cites: [dec:159, dec:166, dec:170, dec:187, dec:235, dec:278]
amends: []
introduces: []
scope:
  - file: scripts/checks/decisions/decision_reads_through_fixture.py
    action: Create
    purpose: >-
      The check. Pure detector ad_hoc_sites(text) -> list[tuple[int, str]] (line, shape) over one test module's AST,
      empty when the module does not read the real log. Reads the real log: a `/` path join whose right side holds a
      string constant ending DECISIONS.md and whose leftmost operand is a module-global name (a root built from
      __file__ or an imported REPO/ROOT name, never a function parameter such as tmp_path), a Path("...DECISIONS.md")
      literal, or a call to a module-global helper whose positional args are all constants and one ends DECISIONS.md.
      Shapes counted (entry isolation only): a str-method call (index, rindex, find, rfind, split, rsplit, count,
      partition, rpartition, startswith, endswith) or a re.* call (compile, search, match, fullmatch, findall, finditer,
      split, sub, subn) whose argument holds a "## Decision" constant or a name assigned one; an
      iter_decision_sections / _iter_decision_sections call used as the iterable of a loop or comprehension that
      filters on one entry number (an == or in comparison over match.group(...)) or of a dict comprehension keyed by
      it. A whole-log walk with no number filter, parse_decisions_md rows and extract_entry_envelope fields are not
      counted (corpus-wide invariants have no single-entry route, scout r1 Decision 163 note). tests/fixtures/decision_entry.py (the
      sanctioned reader) is never scanned. validate_decision_reads_through_fixture(failed, root=None): base =
      _common.status_diff_base(root) (Decision 159: no second resolver); skipped() when None. Changed files = `git diff
      --name-status -M <base> -- tests/` (A, M, R; R compares against the old path) plus untracked tests/**/*.py;
      base text by `git show <base>:<path>` (absent = 0). Fails per file whose head count exceeds its base count, naming
      the file, both counts, the new sites' lines and the fix ("read the entry through tests.fixtures.decision_entry:
      decision_entry for this test's own Decision, live_block for another entry"). examined(n, unit="test_files").
      Docstring: the per-chain probe (decision-compaction.yaml procedure step 1) stays the real guard; this check
      guards the reading discipline only. stdlib + scripts.checks._common + registry; under 200 SLOC.
    new_imports: [scripts.checks._common, scripts.checks.registry]
  - file: scripts/checks/decisions/_manifest.py
    action: Modify
    purpose: >-
      Entry validate_decision_reads_through_fixture, pre=True, pre_globs ("tests/**/*.py",
      "scripts/checks/decisions/decision_reads_through_fixture.py", "scripts/checks/_common.py",
      "scripts/checks/registry.py"), full_segment "full_after_lint".
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: "function_to_category row validate_decision_reads_through_fixture: code_regression."
  - file: tests/checks/decisions/test_decision_reads_through_fixture.py
    action: Create
    purpose: >-
      Mirror test on synthetic two-commit git repos under tmp_path (base on a local origin/main): a real-log reader
      that gains an ad-hoc read fails naming the file and counts (test_ad_hoc_entry_reads_never_rise_against_base); a
      new read through decision_entry or live_block passes; a tmp_path-only log reader with parser calls is not
      counted; a pure rename passes; a new file with an ad-hoc read fails; no origin/main is skipped, never passed;
      each shape is detected and the fixture module is never scanned. It must itself score zero.
bundled_recommendations: [rec-5638]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "rec-5638's acceptance, reworded to the mirror node (bin/venv-python -m pytest tests/checks/decisions/test_decision_reads_through_fixture.py::test_ad_hoc_entry_reads_never_rise_against_base -q), passes on the build head and fails before it (file absent)."
  - "On the build head the check passes and adding one ad-hoc read to a real-log reader in a scratch worktree makes it fail naming that file; the same read through decision_entry passes."
  - "No existing test, Decision, contract or graduated record changes; nothing is loosened (Decision 235)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The mirror tests pass.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions/test_decision_reads_through_fixture.py
      tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py::TestValidateCiRcaTaxonomy::test_complete_map_passes -q
    expected: exit 0, all passed; before the change the mirror file does not exist
    fix_if: a node fails; fix the check, never the synthetic repo
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-reads-through-fixture-ratchet
  - step: 2
    phase: pre-deploy
    action: The check passes on the committed head (the new test file itself scores zero) within the fast-tier cost.
    command: >-
      timeout 60 bin/venv-python -c "import time; from scripts.checks.decisions.decision_reads_through_fixture import
      validate_decision_reads_through_fixture as v; t=time.monotonic(); f=[]; v(f); d=time.monotonic()-t;
      print('RATCHET_OK' if not f and d < 5 else (f, round(d, 2)))"
    expected: RATCHET_OK (no failure, under 5 s)
    fix_if: a file is named; if it is this plan's new test, remove its ad-hoc read; if 5 s or more, profile the scan (the fast-tier budget, Decision 208)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A claim over the live diff at HEAD; the check itself runs in every fast and full tier.
  - step: 3
    phase: pre-deploy
    action: >-
      Live discrimination in a scratch worktree of HEAD: one ad-hoc read appended to a real-log reader
      (tests/test_pr_ci_red_protocol_contract.py) makes the check fail naming that file; the same read through
      decision_entry passes.
    command: >-
      W=$(mktemp -d) && git worktree add -q --detach "$W" HEAD &&
      R='import sys,pathlib; from scripts.checks.decisions.decision_reads_through_fixture import validate_decision_reads_through_fixture as v; f=[]; v(f, root=pathlib.Path(sys.argv[1])); print("RISE" if any("test_pr_ci_red_protocol_contract.py" in x for x in f) else "NO_RISE")' &&
      printf '\n_PROBE = DECISIONS_PATH.read_text(encoding="utf-8").split("## Decision 72:")\n' >> "$W/tests/test_pr_ci_red_protocol_contract.py" &&
      bin/venv-python -c "$R" "$W" && git -C "$W" checkout -q -- tests/test_pr_ci_red_protocol_contract.py &&
      printf '\nfrom tests.fixtures.decision_entry import decision_entry\n_PROBE = decision_entry(DECISIONS_PATH.read_text(encoding="utf-8"), 72)\n' >> "$W/tests/test_pr_ci_red_protocol_contract.py" &&
      bin/venv-python -c "$R" "$W"; rc=$?; git worktree remove --force "$W"; exit $rc
    expected: RISE then NO_RISE, exit 0
    fix_if: >-
      NO_RISE first: the real-log gate or the split shape missed; fix the detector. RISE second: the fixture read was
      counted; fix the detector, never the probe.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Needs a git worktree of the live tree; the mirror tests in step 1 carry the same red and green cases on synthetic repos.
  - step: 4
    phase: pre-deploy
    action: Registration surfaces hold (manifest grammar and mirror, taxonomy totality, accounting, size caps) in the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: a registration check fails; add the missing companion; if config/ci_rca_taxonomy.yaml is over its cap, apply the taxonomy relief in constraints; if that does not fit, stop and report (no raise)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The fast tier itself; graduating it would re-run validate inside validate.
  - step: 5
    phase: post-deploy
    action: rec-5638 closed after merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; r,_=fetch_recs_by_ids(make_reader(),['rec-5638']); print(r[0]['status'])"
    expected: closed
    fix_if: still open; close it through ops_data_portal --update-rec after checking its acceptance passes on main
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/decisions/decision_reads_through_fixture.py
    behavior: Ad-hoc Decision-entry reads in a real-log reader never rise against the base; fixture reads, synthetic logs and renames pass; no base is a skip.
    verification_step: 1
    test_selector: tests/checks/decisions/test_decision_reads_through_fixture.py::test_ad_hoc_entry_reads_never_rise_against_base
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/decisions/_manifest.py
    behavior: The check is in the fast tier with tests/**/*.py in its pre_globs and in the full tier.
    verification_step: 1
    test_selector: tests/checks/decisions/test_decision_reads_through_fixture.py::test_manifest_runs_on_any_test_change
    red_green_expectation: red before (no Entry), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: The check name resolves to code_regression.
    verification_step: 1
    test_selector: tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py::TestValidateCiRcaTaxonomy::test_complete_map_passes
    red_green_expectation: red once the Entry exists without the row (registry totality), green after
