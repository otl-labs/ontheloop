execution_steps:
- 'Create scripts/checks/decisions/decision_reads_through_fixture.py per its scope row, decorated with @register(...) (registration
  surface 2 in scripts/checks/registry.py): ad_hoc_sites(text), the real-log gate,
  the per-file base comparison over the status_diff_base diff (-M) plus untracked files, failure lines naming file, counts,
  new lines and the fixture fix, examined/skipped on every exit path, docstring naming the per-chain probe as the real guard.'
- Add the Entry to scripts/checks/decisions/_manifest.py and the function_to_category row to config/ci_rca_taxonomy.yaml;
  first fold the cost-reconciliation workflows entry into one flow-style line with the same keys and words (operator card
  2026-11-25 16:15Z), then confirm the file is at or under 500 effective lines.
- Create the mirror test per its scope row; it builds each synthetic repo with git init, a base commit pushed to a local bare
  origin as main, and a branch commit; it must itself score zero.
- Graduate VP step 1 through the implement skill's graduation flow (check_id decision-reads-through-fixture-ratchet, primitive_slot
  command_exit_zero).
- Execute the Verification Plan; on unrecoverable failure stop and RCA (Decision 55).
- 'Report: what was implemented, verification results, the census figure the check examined on the build head.'
rollback: Revert the squash commit; nothing else reads the check, and the taxonomy fold is word-identical.
