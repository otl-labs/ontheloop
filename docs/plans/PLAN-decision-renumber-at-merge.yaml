schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-renumber-at-merge
intent: >-
  Stop Decision-number collisions and the other mechanical rebase conflicts from stalling a merge. One repo command,
  scripts.session.rebase_resolve, rebases onto origin/main and resolves only the three classes Decision 217 clause 2
  names (derived files by regeneration, rosters by union, the Decision-numbering race by renumbering to MAX + 1 with
  every recognised citation rewritten on the branch's own lines), printing each change and stopping on anything else.
  A clean run keeps prior approvals (operator ruling 2026-10-31); the full tier still runs. The live/archive
  duplicate-number WARN becomes a FAIL.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-renumber-at-merge.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4323
  and Project Review joint review area G (IAM-F07, TEL-F07) as split D1 (operator ruling 2026-10-30). D2, the NNN
  placeholder resolved at merge, waits for PR #1683's build and is rec-4793.
scope:
- file: docs/plans/approved/decision-renumber-at-merge.yaml
  action: Create
  purpose: >-
    Lands WITH THIS PLAN (plan PR), never in the build. The approved-text sidecar (git-ops.yaml approved_text_binding):
    six blocks binding the operator-approved wording of 2026-10-31 -- five on docs/contracts/git-ops.yaml
    (gitops-commit-flow, gitops-version, gitops-amendment, gitops-paths, gitops-key) and contract-new, the whole of
    docs/contracts/mechanical-conflicts.yaml. `{{DATE}}` (the landing date) is the only placeholder. Digest
    7bc3cb43007eeb61bb326b02c1cf543577dbdc4603692ce2f9d28e12163dbe7b (VP step 7).
- file: docs/contracts/mechanical-conflicts.yaml
  action: Create
  purpose: >-
    New Class D contract, copied verbatim from sidecar block contract-new with `{{DATE}}` filled: the pure_insertion
    rule, classes (derived, roster, decision_numbering) with their files, excluded files with reasons, clean_run and
    validation. scripts.session.rebase_resolve reads it at run time, so this table is the roster.
- file: docs/contracts/git-ops.yaml
  action: Modify
  purpose: >-
    Sidecar blocks gitops-* applied verbatim (`{{DATE}}` filled). The only other edit: rewrap
    rebase_phase_distinction.assessment_time's two paragraphs to one line each, words unchanged (the sidecar's
    word-level verify passes a rewrap), so effective lines go 478 -> 470 and PR #1570 keeps its headroom (VP step 8).
- file: scripts/session/decision_renumber.py
  action: Create
  purpose: >-
    The decision_numbering class, importable and side-effect free at import. Headings are read only through
    scripts.decisions_md.iter_decision_headings (Decision 134 clause 3); file text at a ref via `git show`.
    numbers_at(root, ref) -> set[int] over DECISIONS.md and DECISIONS_ARCHIVE.md at ref. branch_added(root, base) ->
    list[int]: numbers of heading lines added in `git diff -U0 <base>...HEAD -- docs/DECISIONS.md`.
    collisions(root, onto="origin/main") -> dict[int, int]: branch_added against merge-base(onto, HEAD) intersected
    with numbers_at(onto), mapped in ascending order to MAX(numbers_at(onto) | set(branch_added)) + 1, + 2, ...
    (used by merge_step premerge; writes nothing). renumber(root, onto) -> Result(mapping, rewrites, bare): on the
    rebased working tree, the same mapping with MAX over the working-tree files, applied in ONE simultaneous pass per
    line (a dict lookup, so 240->242 and 241->243 never chain) and only on lines `git diff -U0 <onto>...HEAD` reports
    added, in every changed file. Recognised forms, each anchored so a longer number never matches: the heading;
    envelope `number: N`; `**Warehouse ID:** dec-0NN` (rewritten zero-padded to 3); `Decision N`; a `Decisions` run
    of numbers joined by `,`, `/`, `and` or `+`; `dec-N` and `dec-0NN` (raise-approved markers included); and the
    keys `number`, `decision`, `decision_id` as `key: N` or `"key": N`. Any other whole-token occurrence of an old
    number on an added line is a bare hit (file, line, token); `rec-4239`, dates and longer digit runs never match.
    After the rewrite the branch-added Decision blocks at the insertion point are re-emitted in descending number
    order (all branch lines). No CLI. Under 500 SLOC (Decision 128); if it would exceed, split a sibling
    scripts/session/decision_renumber_forms.py and stop to report the scope amendment.
- file: tests/test_session_decision_renumber.py
  action: Create
  purpose: >-
    Real temporary git repos (tests/fixtures/merge_step_repos.py helpers): collisions() reports a branch Decision whose
    number main took, with the ascending mapping, and is empty when the branch number is above main's maximum or the
    branch adds none; renumber() rewrites each recognised form on added lines, leaves a pre-existing line citing
    main's N untouched, maps two colliding numbers without chaining, re-orders blocks newest first, zero-pads the
    Warehouse ID, rewrites a sloc_budgets raise marker, reports a bare token (and never rec-4239 or a date), and
    imports the heading grammar from scripts.decisions_md (no heading regex in the module).
- file: scripts/session/rebase_resolve.py
  action: Create
  purpose: >-
    CLI `bin/venv-python -m scripts.session.rebase_resolve` (no arguments; the caller fetches first, per git-ops
    commit_flow_time). load_classes(root) parses docs/contracts/mechanical-conflicts.yaml (the literal basename lives
    here; validate_mechanical_conflicts imports this loader). Refuses (exit 2, `RESOLVE REFUSED <reason>`) a dirty
    tree or a rebase already in progress. Runs `git -c merge.conflictStyle=diff3 rebase origin/main`; at each stop,
    for every unmerged path: a derived file takes the onto side (`git checkout --ours`, recorded for regeneration);
    a roster or DECISIONS.md file is resolved hunk by hunk only when every hunk is a pure insertion (empty diff3 base;
    for an `only_under` roster the hunk's enclosing top-level key must be that key); DECISIONS.md hunks whose two
    sides each begin with a Decision heading put the branch side first, a contract amendment_log hunk puts the
    branch side first, every other roster hunk puts the onto side first; then `git add` and
    `GIT_EDITOR=true git rebase --continue`. Any other unmerged path or hunk: `git rebase --abort`, print
    `RESOLVE STOP <path>: <reason>`, exit 2. After the rebase: decision_renumber.renumber; every recorded derived file,
    plus docs/decisions-index.json whenever a renumber happened, is regenerated by its contract generator
    (shlex.split, no shell) and printed `REGENERATED <path>`; each resolved roster must still parse (YAML through a
    duplicate-key-refusing SafeLoader; `_manifest.py` through ast with unique Entry names). For every plan whose
    implementation_declared is true at HEAD and not at origin/main (scripts.checks._common._plan_declared_at_ref) and
    has a sidecar, scripts.roadmap.approved_text.verify(sidecar, root, "origin/main") must return no message. Clean
    (no bare hit, no parse failure, no approved-text message): commit any change as `chore(rebase): resolve
    mechanical conflicts` (plus ` and renumber Decision A -> B` per mapping entry), print one line per resolution,
    renumber and rewrite, then `RESOLVE CLEAN`, exit 0. Not clean: leave the rewrites uncommitted, print each
    `BARE <file>:<line> <token>`, `PARSE <path>: <error>` or `APPROVED-TEXT <message>` line, then `RESOLVE NOT CLEAN`,
    exit 1. Never pushes, never runs the full tier. Never raises at import. Under 500 SLOC.
- file: tests/test_session_rebase_resolve.py
  action: Create
  purpose: >-
    Fixture repos with a copy of the contract and bin/venv-python (install_venv_python): two branches both inserting
    a Decision at the top of DECISIONS.md resolve with the branch block above and renumbered, and RESOLVE CLEAN with
    the commit; both appending to config/ci_rca_taxonomy.yaml and a contract amendment_log union in the declared
    order; a derived file (a fixture generator) takes the onto side and is regenerated; a non-insertion hunk, an
    undeclared file and an excluded file each abort with RESOLVE STOP and leave the branch exactly as before; a
    duplicate key after union prints PARSE and NOT CLEAN; a bare token prints NOT CLEAN with nothing committed; a
    literal old number in a declared plan's sidecar prints APPROVED-TEXT and NOT CLEAN; a dirty tree is refused; no
    conflict is a clean no-op; nothing is pushed.
- file: scripts/session/merge_step.py
  action: Modify
  purpose: >-
    cmd_premerge gains a Decision-collision arm after the approved-text arm: decision_renumber.collisions(root) (the
    fetch already ran); each entry prints `PREMERGE DECISION COLLISION <old> -> <new>: run git fetch origin main &&
    bin/venv-python -m scripts.session.rebase_resolve, then the full tier, push and wait for CI` and fails the
    premerge (exit 1). Module docstring names the arm.
- file: tests/test_session_merge_step.py
  action: Modify
  purpose: >-
    New class TestPremergeDecisionCollision: a branch whose Decision number main took fails premerge with the
    COLLISION line; a non-colliding branch Decision and a branch without one pass that arm.
- file: scripts/checks/contracts/validate_mechanical_conflicts.py
  action: Create
  purpose: >-
    @registry.register("validate_mechanical_conflicts", owner="platform"), the contract's evaluator (basename literal
    via rebase_resolve.load_classes). FAILs when: the contract does not parse or its top-level keys are not exactly
    contract, amendment_log, pure_insertion, classes, excluded, clean_run, validation, or classes are not exactly
    derived, roster, decision_numbering; a derived path is not a tracked file or its generator is not `bin/venv-python
    -m <module>` / `bin/venv-python <path>` resolving to an existing file; a roster path or glob matches no tracked
    file, or only_under is not a string; a decision_numbering file is missing; an excluded path matches a classified
    file; git-ops.yaml lacks the mechanical_conflict_classes key naming docs/contracts/mechanical-conflicts.yaml or
    its commit_flow_time does not name scripts.session.rebase_resolve. Prints one line per failure, else a PASS
    line. Declares its examined() accounting (Decision 170, validate_check_accounting). Never raises at import.
- file: tests/checks/contracts/test_validate_mechanical_conflicts.py
  action: Create
  purpose: >-
    Each FAIL arm on a tmp root, the PASS on the real repo, and class TestGitOpsPointer (rec-4323's acceptance node):
    the real git-ops.yaml carries the key and commit_flow_time names the command; dropping either fails.
- file: scripts/checks/contracts/_manifest.py
  action: Modify
  purpose: Entry for validate_mechanical_conflicts (pre=True, pre_globs=None, full_segment="full_after_lint").
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: "function_to_category row `validate_mechanical_conflicts: schema_drift`."
- file: scripts/checks/decisions/validate_supersession_annotations.py
  action: Modify
  purpose: >-
    A number present in both DECISIONS.md and DECISIONS_ARCHIVE.md FAILs (was WARN). The live_archive_pair_allowlist
    exception route is retired (Decision 163: a universal rule takes no waiver; the list is empty on main): its loader
    arm is removed and a waiver file that still carries the key FAILs naming the retirement. Docstring updated.
- file: tests/checks/decisions/test_validate_supersession_annotations.py
  action: Modify
  purpose: >-
    TestDuplicateNumberSubCheck: the WARN test becomes test_live_archive_pair_fails; the allowlist test becomes
    test_retired_allowlist_key_fails; _write_waivers stops writing the key.
- file: config/decision_supersession_waivers.yaml
  action: Modify
  purpose: "Remove the `live_archive_pair_allowlist: []` line (line 216 on main 91b84e55)."
- file: config/agent/verification_registry/entries/decision-renumber-tests.yaml
  action: Create
  purpose: Graduated registry row for VP step 1 (test_selector, guard_target scripts/session/decision_renumber.py).
- file: config/agent/verification_registry/entries/rebase-resolve-tests.yaml
  action: Create
  purpose: Graduated registry row for VP step 2 (test_selector, guard_target scripts/session/rebase_resolve.py).
- file: config/agent/verification_registry/entries/mechanical-conflicts-check-tests.yaml
  action: Create
  purpose: Graduated registry row for VP step 3 (test_selector, guard_target the new check).
bundled_recommendations: [rec-4323]
followon_recs: [rec-4793, rec-4794]
infrastructure_dependencies: []
acceptance_criteria:
- >-
  One command resolves a concurrent-Decision rebase end to end -- branch block above, number moved to MAX + 1, every
  recognised citation rewritten only on branch lines, decisions index regenerated -- and prints RESOLVE CLEAN with
  each change (VP steps 1-2).
- >-
  Any conflict outside the declared classes, any bare old number, a broken roster or an approved-text mismatch stops
  the run without committing or aborts the rebase (VP step 2).
- >-
  premerge refuses a merge whose Decision number main took, naming the command (VP step 4).
- >-
  validate_mechanical_conflicts guards the contract table and the git-ops pointer; rec-4323's acceptance holds (VP
  steps 3, 6).
- >-
  A live/archive duplicate number fails and the retired allowlist key fails (VP step 5).
- >-
  Every bound file matches the approved sidecar and git-ops.yaml stays at or below 470 effective lines (VP steps
  7-8).
verification_plan:
- step: 1
  phase: pre-deploy
  action: decision_renumber unit and fixture-repo tests.
  command: bin/venv-python -m pytest tests/test_session_decision_renumber.py -q
  expected: All tests pass.
  fix_if: Any failure.
  hermetic: true
  graduation: graduate
  graduation_check_id: decision-renumber-tests
- step: 2
  phase: pre-deploy
  action: rebase_resolve fixture-repo tests (every class, every stop path, clean commit, no push).
  command: bin/venv-python -m pytest tests/test_session_rebase_resolve.py -q
  expected: All tests pass.
  fix_if: Any failure.
  hermetic: true
  graduation: graduate
  graduation_check_id: rebase-resolve-tests
- step: 3
  phase: pre-deploy
  action: validate_mechanical_conflicts arms, real-repo PASS and the git-ops pointer.
  command: bin/venv-python -m pytest tests/checks/contracts/test_validate_mechanical_conflicts.py -q
  expected: All tests pass.
  fix_if: Any failure.
  hermetic: true
  graduation: graduate
  graduation_check_id: mechanical-conflicts-check-tests
- step: 4
  phase: pre-deploy
  action: premerge Decision-collision arm.
  command: bin/venv-python -m pytest "tests/test_session_merge_step.py::TestPremergeDecisionCollision" -q
  expected: All tests pass.
  fix_if: Any failure.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    tests/test_session_merge_step.py is already graduated whole as merge-step-verb-tests, so this class is guarded by
    that row from the day it lands; a second row would duplicate it.
- step: 5
  phase: pre-deploy
  action: Cross-file duplicate FAIL and retired allowlist key, plus the guard on the real corpus.
  command: >-
    bin/venv-python -m pytest "tests/checks/decisions/test_validate_supersession_annotations.py::TestDuplicateNumberSubCheck"
    -q && bin/venv-python -c "from scripts.checks.decisions.validate_supersession_annotations import
    validate_supersession_annotations as v; f = []; v(f); assert f == [], f; print('supersession-guard-ok')"
  expected: All tests pass and the real corpus passes.
  fix_if: A duplicate on main (none on 91b84e55) or a failing test.
  hermetic: true
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: rec-4323's stored acceptance at the PR head.
  command: >-
    test "$(grep -c 'mechanical_conflict_classes' docs/contracts/git-ops.yaml)" -ge 1 && bin/venv-python -m pytest
    "tests/checks/contracts/test_validate_mechanical_conflicts.py::TestGitOpsPointer" -q
  expected: Exit 0.
  fix_if: Read the rec with fetch_recs_by_ids; never edit the acceptance to pass.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates VP step 3's graduated row (TestGitOpsPointer is inside that file).
- step: 7
  phase: pre-deploy
  action: Approved text binds every bound file, digest as approved.
  command: >-
    bin/venv-python -m scripts.roadmap.approved_text verify --slug decision-renumber-at-merge --expect
    7bc3cb43007eeb61bb326b02c1cf543577dbdc4603692ce2f9d28e12163dbe7b
  expected: APPROVED-TEXT OK with the digest.
  expected_literals: [APPROVED-TEXT OK 7bc3cb43007eeb61bb326b02c1cf543577dbdc4603692ce2f9d28e12163dbe7b]
  fix_if: A MISMATCH line -- restore the approved words; never edit the sidecar (a needed change is a new operator ask).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_merge_step already enforces the sidecar on every PR that declares this plan.
- step: 8
  phase: pre-deploy
  action: git-ops.yaml keeps PR #1570's headroom and the new contract parses.
  command: >-
    bin/venv-python -c "import yaml; from scripts.checks.structural._classify import effective_lines as e; n =
    e(open('docs/contracts/git-ops.yaml').read()); yaml.safe_load(open('docs/contracts/mechanical-conflicts.yaml'));
    assert n <= 470, n; print('git-ops-lines-ok', n)"
  expected: Prints the marker and a count at or below 470.
  fix_if: Over 470 -- the rewrap was not applied; never drop approved words.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_structural_size_limits already guards the 500 ceiling; 470 is this build's own target.
- step: 9
  phase: pre-deploy
  action: Real-repo smoke on a scratch worktree -- two branches each adding a Decision with the same next number.
  command: >-
    bin/venv-python -m pytest tests/test_session_rebase_resolve.py -q -k "real_corpus"
  expected: The real-corpus case (a scratch clone of this repo's DECISIONS.md, decisions-index.json and contract)
    resolves CLEAN with the branch Decision at MAX + 1 and decisions_index --check current.
  fix_if: Any failure.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A subset of VP step 2's graduated file.
- step: 10
  phase: pre-deploy
  action: Fast tier.
  command: bin/venv-python -m scripts.validate --pre
  expected: Exit 0.
  fix_if: Any failure.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole fast-tier run; graduate steps may not invoke scripts.validate (recursion).
- step: 11
  phase: pre-deploy
  action: Commit Flow full tier and HEAD attestation before each push (handoff_policy).
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: The full tier exits 0 and the validation result attests the current HEAD's tree.
  fix_if: Any failure -- fix and rerun the full tier from the start.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
- step: 12
  phase: post-deploy
  action: Read the merge commit back (MERGE_SHA is the sha merge_pull_request returned).
  command: bin/venv-python -m scripts.session.merge_step readback --slug decision-renumber-at-merge --sha "$MERGE_SHA"
  expected: READBACK OK naming rec-4323.
  fix_if: READBACK MISSING -- run `bin/venv-python -m scripts.session.merge_step recover --slug decision-renumber-at-merge --sha "$MERGE_SHA"`.
- step: 13
  phase: post-deploy
  action: After the merge push run's trailer-closure job concludes, rec-4323 is closed through the Decision 201 gate.
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows, m =
    fetch_recs_by_ids(make_reader(), ['rec-4323']); print([(r['id'], r['status']) for r in rows], m)"
  expected: rec-4323 closed, none missing.
  fix_if: Follow git-ops.yaml resolves_trailer's route for the marker in the trailer-closure job log; never close by hand.
test_obligations:
- source: scripts/session/decision_renumber.py
  behavior: Only colliding branch-added numbers move, in one non-chaining pass, only on branch-added lines, with bare hits reported.
  verification_step: 1
  test_selector: tests/test_session_decision_renumber.py
  red_green_expectation: red before (file absent), green after
- source: scripts/session/rebase_resolve.py
  behavior: Only pure insertions in declared files resolve; everything else aborts or stays uncommitted; a clean run commits and never pushes.
  verification_step: 2
  test_selector: tests/test_session_rebase_resolve.py
  red_green_expectation: red before (file absent), green after
- source: scripts/checks/contracts/validate_mechanical_conflicts.py
  behavior: The contract table and the git-ops pointer are checked.
  verification_step: 3
  test_selector: tests/checks/contracts/test_validate_mechanical_conflicts.py
  red_green_expectation: red before (file absent), green after
- source: scripts/session/merge_step.py
  behavior: premerge refuses a Decision collision with the remedy.
  verification_step: 4
  test_selector: tests/test_session_merge_step.py::TestPremergeDecisionCollision
  red_green_expectation: red before (class absent), green after
- source: scripts/checks/decisions/validate_supersession_annotations.py
  behavior: A live/archive duplicate fails and the retired allowlist key fails.
  verification_step: 5
  test_selector: tests/checks/decisions/test_validate_supersession_annotations.py::TestDuplicateNumberSubCheck
  red_green_expectation: red before (the WARN passes, the new tests absent), green after
constraints:
- >-
  Approved text is binding. Copy every sidecar `after` verbatim into its file, line breaks included; never edit the
  sidecar. The only other git-ops.yaml edit is the word-preserving rewrap of assessment_time. Any other change to a
  bound file is a new operator ask: stop and report.
- >-
  Never touch scripts/decisions_md.py or docs/contracts/decision-entry.yaml (PR #1683 owns them); import from
  decisions_md only.
- >-
  No AGENTS.md, CLAUDE.md, skill or command text; no CI workflow, IAM, Terraform or Lambda change.
- >-
  The full tier stays before every push, including after a rebase_resolve run (operator ruling 2026-10-31; rec-4794
  owns the revisit).
- >-
  Never weaken a check or an acceptance to obtain green (Decision 181; implement-scope-boundary.yaml CONTENT).
- >-
  500 SLOC per file (Decision 128): decompose, never raise.
- >-
  No rescue agents or workaround loops (Decision 55).
- >-
  No file under scripts/session/ may contain the tokens `rec_relevance` or `run_acceptance_probe` (graduated row
  preflight-never-runs-acceptance-probes).
