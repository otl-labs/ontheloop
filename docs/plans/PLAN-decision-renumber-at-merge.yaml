constraints:
- >-
  Approved text is binding. Copy every sidecar `after` verbatim into its file, line breaks included; never edit the
  sidecar. The only other git-ops.yaml edit is the word-preserving rewrap of assessment_time. Any other change to a
  bound file is a new operator ask: stop and report.
- >-
  Never touch scripts/decisions_md.py or docs/contracts/decision-entry.yaml (PR #1683 owns them); import from
  decisions_md only.
- >-
  No AGENTS.md, CLAUDE.md or command text, and no skill text beyond the two approved implement-skill blocks; no CI
  workflow, IAM, Terraform or Lambda change. .claude/commands/plan.md, audit.md and postflight.run_rebase keep their
  plain rebase (rec-4795).
- >-
  The full tier stays before every push, including after a rebase_resolve run (operator ruling 2026-10-31; rec-4794
  owns the revisit).
- >-
  Never weaken a check or an acceptance to obtain green (Decision 181; implement-scope-boundary.yaml CONTENT).
- >-
  500 SLOC per file (Decision 128): decompose, never raise.
- >-
  No rescue agents or workaround loops (Decision 55).
- >-
  No file under scripts/session/ may contain the tokens `rec_relevance` or `run_acceptance_probe` (graduated row
  preflight-never-runs-acceptance-probes).
