acceptance_criteria:
- >-
  One command resolves a concurrent-Decision rebase end to end -- branch block above, number moved to MAX + 1, every
  recognised citation rewritten only on branch lines, decisions index regenerated -- and prints RESOLVE CLEAN with
  each change (VP steps 1-2).
- >-
  The implement skill's Commit Flow runs rebase_resolve, in the approved words, with the prose budget lowered to
  match (VP steps 7, 10).
- >-
  Any conflict outside the declared classes, any bare old number, a broken roster or an approved-text mismatch stops
  the run without committing or aborts the rebase (VP step 2).
- >-
  premerge refuses a merge whose Decision number main took, naming the command (VP step 4).
- >-
  validate_mechanical_conflicts guards the contract table and the git-ops pointer; rec-4323's acceptance holds (VP
  steps 3, 6).
- >-
  A live/archive duplicate number fails, the retired allowlist key fails, and the check now declares its accounting
  and has left the grandfather baseline (VP steps 5, 10).
- >-
  Every bound file matches the approved sidecar and git-ops.yaml stays at or below 470 effective lines (VP steps
  7-8).
