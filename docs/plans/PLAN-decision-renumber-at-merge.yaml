schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-renumber-at-merge
intent: >-
  Stop Decision-number collisions and the other mechanical rebase conflicts from stalling a merge. One repo command,
  scripts.session.rebase_resolve, rebases onto origin/main and resolves only the three classes Decision 217 clause 2
  names (derived files by regeneration, rosters by union, the Decision-numbering race by renumbering to MAX + 1 with
  every recognised citation rewritten on the branch's own lines), printing each change and stopping on anything else.
  A clean run keeps prior approvals (operator ruling 2026-10-31); the full tier still runs. The live/archive
  duplicate-number WARN becomes a FAIL.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-renumber-at-merge.yaml
implementation_declared: true
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4323
  and Project Review joint review area G (IAM-F07, TEL-F07) as split D1 (operator ruling 2026-10-30). D2, the NNN
  placeholder resolved at merge, waits for PR #1683's build and is rec-4793.
scope:
- file: docs/plans/approved/decision-renumber-at-merge.yaml
  action: Create
  purpose: >-
    Lands WITH THIS PLAN (plan PR), never in the build. The approved-text sidecar (git-ops.yaml approved_text_binding):
    eight blocks binding the operator-approved wording of 2026-10-31 -- five on docs/contracts/git-ops.yaml
    (gitops-commit-flow, gitops-version, gitops-amendment, gitops-paths, gitops-key), contract-new (the whole of
    docs/contracts/mechanical-conflicts.yaml) and two on .claude/skills/implement/SKILL.md (skill-prepush,
    skill-commit-flow). `{{DATE}}` (the landing date) is the only placeholder. Digest
    7b652e5ab869170d3a8217439fa4383bfe886cea76fda496bbf3392b52d60261 (VP step 7).
- file: docs/contracts/mechanical-conflicts.yaml
  action: Create
  purpose: >-
    New Class D contract, copied verbatim from sidecar block contract-new with `{{DATE}}` filled: the pure_insertion
    rule, classes (derived, roster, decision_numbering) with their files, excluded files with reasons, clean_run and
    validation. scripts.session.rebase_resolve reads it at run time, so this table is the roster.
- file: docs/contracts/git-ops.yaml
  action: Modify
  purpose: >-
    Sidecar blocks gitops-* applied verbatim (`{{DATE}}` filled). The only other edit: rewrap
    rebase_phase_distinction.assessment_time's two paragraphs to one line each, words unchanged (the sidecar's
    word-level verify passes a rewrap), so effective lines go 478 -> 470 and PR #1570 keeps its headroom (VP step 8).
- file: scripts/session/decision_renumber.py
  action: Create
  purpose: >-
    The decision_numbering class, importable and side-effect free at import. Headings are read only through
    scripts.decisions_md.iter_decision_headings (Decision 134 clause 3); file text at a ref via `git show`.
    numbers_at(root, ref) -> set[int] over DECISIONS.md and DECISIONS_ARCHIVE.md at ref. branch_added(root, base) ->
    list[int]: numbers with a heading in DECISIONS.md at HEAD that are in neither corpus file at base, so a
    retitled, compacted or superseded heading of an existing Decision (Decision 177 point 2 stubs) is never "added".
    collisions(root, onto="origin/main") -> dict[int, int]: branch_added against merge-base(onto, HEAD) intersected
    with numbers_at(onto), mapped in ascending order to MAX(numbers_at(onto) | set(branch_added)) + 1, + 2, ...
    (used by merge_step premerge; writes nothing). renumber(root, onto) -> Result(mapping, rewrites, bare): on the
    rebased working tree a collision is a branch_added number (base = the pre-rebase merge-base, recorded by
    rebase_resolve) that has two headings across the working-tree corpus; the branch's heading is the one on a line
    `git diff -U0 <onto>...HEAD` reports added. Same ascending mapping with MAX over the working-tree files, applied in ONE simultaneous pass per
    line (a dict lookup, so 240->242 and 241->243 never chain) and only on lines `git diff -U0 <onto>...HEAD` reports
    added, in every changed file. Recognised forms, each anchored so a longer number never matches: the heading;
    envelope `number: N`; `**Warehouse ID:** dec-0NN` (rewritten zero-padded to 3); `Decision N`; a `Decisions` run
    of numbers joined by `,`, `/` or `and`; `dec-N` and `dec-0NN` (raise-approved markers included); and, in
    docs/DECISIONS.md only (a Decision record), the keys `number`, `decision`, `decision_id` as `key: N` or
    `"key": N`. The same key form in any other file, a `+`-joined run, and any other whole-token occurrence of an old
    number on an added line is a bare hit (file, line, token); `rec-4239`, dates and longer digit runs never match.
    After the rewrite the branch-added Decision blocks at the insertion point are re-emitted in descending number
    order (all branch lines). No CLI. Under 500 SLOC (Decision 128); if it would exceed, split a sibling
    scripts/session/decision_renumber_forms.py and stop to report the scope amendment.
- file: tests/test_session_decision_renumber.py
  action: Create
  purpose: >-
    Real temporary git repos (tests/fixtures/merge_step_repos.py helpers): collisions() reports a branch Decision whose
    number main took, with the ascending mapping, and is empty when the branch number is above main's maximum or the
    branch adds none; renumber() rewrites each recognised form on added lines, leaves a pre-existing line citing
    main's N untouched, maps two colliding numbers without chaining, re-orders blocks newest first, zero-pads the
    Warehouse ID, rewrites a sloc_budgets raise marker, reports a bare token (and never rec-4239 or a date), reports a
    branch-added `"number": <old>` in a non-Decision file (a JSON fixture) and a `+`-joined run as bare and leaves
    them unrewritten, and
    imports the heading grammar from scripts.decisions_md (no heading regex in the module). A branch that retitles an
    existing Decision's heading, or turns it into a `(Superseded by Decision Y)` stub, gets no collision and no
    renumber (critique round 2, finding 1).
- file: scripts/session/rebase_resolve.py
  action: Create
  purpose: >-
    CLI `bin/venv-python -m scripts.session.rebase_resolve` (no arguments; it acts on `git rev-parse --show-toplevel`
    of the cwd, never a root derived from __file__; the caller fetches first, per git-ops
    commit_flow_time). load_classes(root) parses docs/contracts/mechanical-conflicts.yaml (the literal basename lives
    here; validate_mechanical_conflicts imports this loader). Refuses (exit 2, `RESOLVE REFUSED <reason>`) a dirty
    tree or a rebase already in progress. Runs `git -c merge.conflictStyle=diff3 rebase origin/main`; at each stop,
    for every unmerged path: a derived file takes the onto side (`git checkout --ours`, recorded for regeneration);
    a roster or DECISIONS.md file is resolved hunk by hunk only when every hunk is a pure insertion (empty diff3 base;
    for an `only_under` roster the hunk's enclosing top-level key must be that key); DECISIONS.md hunks whose two
    sides each begin with a Decision heading put the branch side first, a contract amendment_log hunk puts the
    branch side first, every other roster hunk puts the onto side first; then `git add` and
    `GIT_EDITOR=true git rebase --continue`. Any other unmerged path or hunk: `git rebase --abort`, print
    `RESOLVE STOP <path>: <reason> -- surface it to the human`, exit 2. After the rebase: decision_renumber.renumber; every recorded derived file,
    plus docs/decisions-index.json whenever a renumber happened, is regenerated by its contract generator
    (shlex.split, no shell) and printed `REGENERATED <path>`; each resolved roster must still parse (YAML through a
    duplicate-key-refusing SafeLoader; `_manifest.py` through ast with unique Entry names). For every plan whose
    implementation_declared is true at HEAD and not at origin/main (scripts.checks._common._plan_declared_at_ref) and
    has a sidecar, scripts.roadmap.approved_text.verify(sidecar, root, "origin/main") must return no message. Clean
    (no bare hit, no parse failure, no approved-text message): commit any change as one branch-only commit
    whose subject is `rebase_resolve: mechanical conflicts` (the squash title stays the plan's feat({slug}), so git-ops
    commit_message_conventions are unaffected) and whose body carries the printed lines; print one line per
    resolution, renumber and rewrite, then `RESOLVE CLEAN`, exit 0. Not clean: leave the rewrites uncommitted, print each
    `BARE <file>:<line> <token>`, `PARSE <path>: <error>` or `APPROVED-TEXT <message>` line, then `RESOLVE NOT CLEAN`,
    exit 1. Never pushes, never runs the full tier. Never raises at import. Under 500 SLOC; if it would exceed, the
    per-hunk resolution moves to a sibling scripts/session/rebase_resolve_hunks.py (with
    tests/test_session_rebase_resolve_hunks.py, Decision 131) -- stop and report the scope amendment.
- file: tests/test_session_rebase_resolve.py
  action: Create
  purpose: >-
    Fixture repos with a copy of the contract and bin/venv-python (install_venv_python): two branches both inserting
    a Decision at the top of DECISIONS.md resolve with the branch block above and renumbered, and RESOLVE CLEAN with
    the commit; both appending to config/ci_rca_taxonomy.yaml and a contract amendment_log union in the declared
    order; a derived file (a fixture generator) takes the onto side and is regenerated; a non-insertion hunk, an
    undeclared file and an excluded file each abort with RESOLVE STOP and leave the branch exactly as before; a
    duplicate key after union prints PARSE and NOT CLEAN; a bare token prints NOT CLEAN with nothing committed; a
    literal old number in a declared plan's sidecar prints APPROVED-TEXT and NOT CLEAN; a dirty tree is refused; no
    conflict is a clean no-op; nothing is pushed. Every rebase_resolve subprocess gets a git identity and no signing
    through the environment (GIT_AUTHOR_*/GIT_COMMITTER_* and GIT_CONFIG_COUNT=1, GIT_CONFIG_KEY_0=commit.gpgsign,
    GIT_CONFIG_VALUE_0=false), since CI has no identity and CC-web signs by default. The real_corpus case (VP 9) runs
    on `git clone --local` of this repo into tmp_path, a full repo with its own refs (a `git worktree` shares refs,
    and the case must set origin/main). Setup in the clone: copy the working-tree scripts/session/rebase_resolve.py,
    scripts/session/decision_renumber.py and docs/contracts/mechanical-conflicts.yaml in and commit them as the
    clone's base only when `git status --porcelain` is non-empty (the clone holds committed HEAD only, and the VP loop
    runs before the Commit Flow; after the implementation commit, or in CI, the copy changes nothing, so no base
    commit is made); no .venv in the clone and no
    install_venv_python (it rewrites the tracked .gitignore and would trip the dirty-tree refusal): rebase_resolve
    runs as `[sys.executable, "-m", "scripts.session.rebase_resolve"]` with the clone as cwd, and the environment sets
    OTL_VENV_PYTHON=sys.executable so the clone's bin/venv-python generators use this interpreter (bin/venv-python's
    override; its header comment names only the fast-tier re-exec as a setter, so the PR body notes this second,
    test-only setter); then move origin/main with `git update-ref` to a
    commit adding Decision MAX + 1, and branch from the base adding the same number. rebase_resolve prints RESOLVE CLEAN with the branch Decision at MAX + 2 and `scripts.decisions_index --check`
    current in the clone. The test asserts the real repo's docs/DECISIONS.md and docs/decisions-index.json hash the
    same before and after and its refs/remotes/origin/main is unchanged.
