schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-scout-add
intent: >-
  Switch the decision_scout verdict persona on as an advisory GitHub check on plan pull requests (T4.30 c1 and c3 ADD;
  rec-5749): materialise builds the scout's ten contract fields (the plan and its approved-text sidecar at the head as
  data; the north star, decisions index and decision corpus at main; tag shortlist, north-star carriers and roadmap
  projection computed at main), decision_scout is marked implemented, and the keyed run job widens from fixture PRs to
  that one route on the secretless trigger upstream through a closed list, merge_checks.TRIGGER_KEYED_PERSONAS
  (Decision 235 entry, operator approval 2026-11-28 15:08 UTC). The trigger upstream gains the per-persona
  advisory_runs kill switch and one-verdict-per-head skip the CI upstream already has. The check gates nothing while
  gates.decision_scout.verdict_source reads in_session. No persona contract change, so the pinned persona image
  (source 329e626b, which already carries decision_scout contract 2) needs no re-pin.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-scout-add.yaml
phase: >-
  T4.30 (decision_scout persona) c1 SCOUT TRIGGER and c3 ADD: provider, switch-on and advisory check. Neither criterion
  is closed here (T4.30 cannot start before T4.32 completes); the live read-back is recorded for the plan that closes
  them.
closes_criteria: []
cites: [dec:205, dec:217, dec:224, dec:229, dec:235, dec:262, dec:263, dec:264, dec:271, dec:288]
amends: []
introduces: []
scope:
  - file: scripts/personas/scout_input.py
    action: Create
    purpose: >-
      The decision_scout provider, registered in materialise.PROVIDERS (CONTRACT names
      docs/contracts/personas/decision_scout.yaml, so validate_persona_contract_binding binds it). Pure: no network, no
      token; lives in the shell package outside the persona image's build.copy (Decision 205 cl.2). change_id, head_sha
      and plan come from materialise.shared_fields (the one plan path, read from the head snapshot). approved_text: the
      plan parsed as data with route.parse_plan (None or a slug outside rescout.SLUG_RE is input_unusable), then the
      head snapshot's approved_words.sidecar_rel(slug) read as text, empty when absent. Read at base_root as text:
      north_star (docs/contracts/north-star.yaml), decisions_index (docs/decisions-index.json), decisions
      (docs/DECISIONS.md). Computed at base_root, each a sort_keys JSON string: tag_shortlist ({"tags": {tag: [live ids
      carrying it, sorted]}, "live_count": live rows}); north_star_carriers ({id: {"carried_by": [...], "serves_only":
      [...]}} for mission and every active principle, from north_star_shortlist.shortlist([id], doc, rows));
      roadmap_projection ({"status": "available", "rows": scope_projection.project(scope paths, base_root roadmap)}, the
      scope paths being the plan's scope[].file strings; any exception gives {"status": "unavailable", "reason":
      "<ExceptionType>"}). A missing plan path or empty plan is input_incomplete; an unreadable or non-UTF-8 main file,
      or an index or north-star file that does not load, is input_unusable naming the file.
  - file: scripts/personas/materialise.py
    action: Modify
    purpose: >-
      Register the scout provider with a second bottom-of-file import beside review_input's (rec-5731 owns replacing
      both with an explicit registry load).
  - file: scripts/personas/route.py
    action: Modify
    purpose: >-
      filter_upstream, trigger branch: routes that are not fixture personas (execute.fixture_personas) pass through the
      same per-persona gate the CI branch uses (rename _gate_ci_routes to _gate_routes; it names no persona): the
      advisory_runs kill switch (disabled or bad value skips with its line) and the one-verdict-per-head skip; fixture
      routes return unchanged, so fixture and drill PRs behave exactly as today. is_keyed: on the trigger upstream a
      single route keys when it is a fixture persona or in merge_checks.TRIGGER_KEYED_PERSONAS; the CI branch is
      unchanged. Holds no persona-id literal.
  - file: scripts/session/merge_checks.py
    action: Modify
    purpose: >-
      TRIGGER_KEYED_PERSONAS = frozenset({"decision_scout"}) beside READY_HEAD_PERSONAS and FINGERPRINT_PERSONAS: the
      closed set of model personas the keyed run job may run from the trigger upstream. A later persona joins only by
      its own approved edit that flips the pinning assertion (Decision 235 entry per persona; scout r1 WARN 235).
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      decision_scout implementation becomes {status: implemented, location: scripts/personas/scout_input.py}; one terse
      amendment_log row (keep_full limit, Decision 282: compact the oldest full row if the check asks).
  - file: docs/contracts/project-configuration.yaml
    action: Modify
    purpose: >-
      settings gains gates.decision_scout.advisory_runs, a copy of gates.code_reviewer.advisory_runs's shape (kind
      project, quoted enabled or disabled, defaults local and cloud "enabled", reader scripts/personas/route.py);
      one terse amendment_log row (same keep_full rule).
  - file: tests/personas/test_scout_input.py
    action: Create
    purpose: >-
      Provider nodes over a synthetic head snapshot and a base_root that copies the real north-star.yaml,
      decisions-index.json, DECISIONS.md, ROADMAP-PLATFORM.yaml, executor-personas.yaml and decision_scout contract
      (VP step 1 names them).
  - file: tests/personas/test_route_trigger.py
    action: Create
    purpose: >-
      Trigger-upstream nodes (VP step 2 names them); new file because tests/personas/test_route.py has 59 SLOC of
      headroom and the plan_critic add (rec-5750) also edits it.
  - file: tests/personas/test_route.py
    action: Modify
    purpose: >-
      In place only: test_live_tree_binds_no_verdict_persona reads {code_reviewer, decision_scout} and a plan PR routes
      decision_scout on the live tree; test_fixture_only_diff_routes_the_fixture_personas's mixed-diff rows use a code
      file only (a fixture file plus scripts/x.py still routes code_reviewer alone); test_keyed_is_false_outside_the_two_admitted_forms
      becomes the closed allowlist (fixture on trigger, decision_scout on trigger, code-class on ci; plan_critic,
      code_reviewer and canary_persona refused on the other upstream) and its trigger drive expects keyed=true for the
      lone decision_scout route; test_main_writes_carried_and_rescout_and_keeps_routes_to_run writes an enabled config
      into its workspace so the gate passes, assertions unchanged.
  - file: tests/personas/test_execute.py
    action: Modify
    purpose: >-
      The pending-persona example moves from decision_scout to plan_critic in test_a_non_fixture_route_has_no_schema and
      test_keyed_personas_are_fixtures_and_implemented_verdicts (decision_scout joins the implemented side); the
      route_kind case of test_bad_requests_are_refused uses plan_critic.
  - file: tests/personas/test_keyed_run.py
    action: Modify
    purpose: test_implemented_verdict_route_is_accepted_and_pending_refused's pending route becomes plan_critic.
  - file: tests/persona_contracts/test_verdict_persona_contracts.py
    action: Modify
    purpose: >-
      test_three_verdict_personas_registered_pending reads decision_scout's row as implemented at
      scripts/personas/scout_input.py beside code_reviewer's; plan_critic stays pending.
  - file: tests/test_session_merge_checks.py
    action: Modify
    purpose: >-
      New node pinning TRIGGER_KEYED_PERSONAS == {"decision_scout"} (count-coupling-ok: a closed allowlist, not a
      growing collection) and that every member is a plan-class persona outside READY_HEAD_PERSONAS.
bundled_recommendations: [rec-5749]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - tests/personas/test_scout_input.py::test_decision_scout_input_validates_against_contract passes; the test file is new in this change.
  - tests/personas/test_route_trigger.py::test_decision_scout_keyed_on_trigger_upstream_once_implemented passes; the test file is new in this change.
  - tests/test_session_merge_checks.py::test_trigger_keyed_personas_are_a_closed_plan_class_list passes.
  - After merge, the first plan PR from an allow-listed author shows a persona-verdict/decision_scout check from the verdict App on its head whose title starts 'verdict ', and gates.decision_scout.verdict_source still reads in_session.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The provider nodes pass.
    command: >-
      bin/venv-python -m pytest tests/personas/test_scout_input.py::test_decision_scout_input_validates_against_contract
      tests/personas/test_scout_input.py::test_head_plan_is_read_as_data_never_executed
      tests/personas/test_scout_input.py::test_main_side_fields_read_from_base_root
      tests/personas/test_scout_input.py::test_approved_text_is_the_head_sidecar_or_empty
      tests/personas/test_scout_input.py::test_tag_shortlist_and_carriers_follow_the_index
      tests/personas/test_scout_input.py::test_roadmap_projection_unavailable_names_the_reason
      tests/personas/test_scout_input.py::test_missing_plan_or_main_file_fails_by_name
      tests/personas/test_scout_input.py::test_both_providers_register_through_materialise -q
    expected: exit 0 with 8 passed
    expected_literals:
      - 8 passed
    fix_if: a node fails; fix scout_input.py or the registration, never the assertion
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-scout-add-units
  - step: 2
    phase: pre-deploy
    action: The trigger-upstream and closed-list nodes pass.
    command: >-
      bin/venv-python -m pytest tests/personas/test_route_trigger.py::test_decision_scout_keyed_on_trigger_upstream_once_implemented
      tests/personas/test_route_trigger.py::test_plan_critic_not_keyed_on_trigger_even_when_implemented
      tests/personas/test_route_trigger.py::test_trigger_advisory_runs_off_or_bad_skips_a_model_route
      tests/personas/test_route_trigger.py::test_trigger_rerun_with_existing_check_skips
      tests/personas/test_route_trigger.py::test_trigger_fixture_routes_bypass_the_gate
      tests/test_session_merge_checks.py::test_trigger_keyed_personas_are_a_closed_plan_class_list -q
    expected: exit 0 with 6 passed
    expected_literals:
      - 6 passed
    fix_if: a node fails; fix route.py or merge_checks.py, never the assertion
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-scout-add-route-units
  - step: 3
    phase: pre-deploy
    action: The persona chain suites, contract registry, binding and configuration checks pass with decision_scout implemented.
    command: >-
      bin/venv-python -m pytest tests/personas/ tests/persona_contracts/ tests/test_session_merge_checks.py
      tests/checks/contracts/test_validate_project_configuration.py tests/checks/contracts/test_validate_persona_contract_binding.py
      tests/checks/ci_guards/test__persona_verdict_keyed.py tests/checks/ci_guards/test_validate_persona_verdict_chain.py
      tests/checks/ci_guards/test_validate_persona_verdict_chain_upstreams.py -q
    expected: exit 0, no failures
    fix_if: >-
      tests/personas/test_run.py's import-closure node fails: scout_input left {yaml, pydantic}; import the narrower
      helpers, never widen the allowed set. Any other failure: fix the source or the in-place test edits named in scope,
      never loosen an assertion beyond weakening_dispositions.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: the same suites run in the fast tier on every PR touching these files
  - step: 4
    phase: pre-deploy
    action: decision_scout is implemented and bound to its provider.
    command: "grep -n -A4 'persona: decision_scout' docs/contracts/executor-personas.yaml | grep -c 'status: implemented, location: scripts/personas/scout_input.py'"
    expected: prints 1
    expected_literals:
      - '1'
    fix_if: 'prints 0: set the row; the binding check needs the location to name the contract path'
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_persona_contract_binding already enforces the binding on every tree
  - step: 5
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      Full tier passes and --verify-head confirms it for the head. Start it as a harness-tracked background run (Bash
      run_in_background, timeout 7200000) from the top-level session with HOME set to an empty directory.
    fix_if: a failure in scope is fixed; one outside scope is a STOP to the plan owner; never loosen a check (Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: is the full tier itself
  - step: 6
    phase: post-deploy
    action: >-
      The squash commit carries the Resolves trailer for rec-5749, and merge_step readback's recs_by_ids leg reads its
      status.
    command: bin/venv-python -m scripts.session.merge_step readback --slug decision-scout-add --sha <merge_sha>
    expected: readback OK naming rec-5749, then (after ci.yml's closure job) its status leg reads closed
    fix_if: 'MISSING: follow merge_step recover'
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a per-merge read-back, not a repository property
  - step: 7
    phase: post-deploy
    action: >-
      Live read-back on the first plan PR from an allow-listed author after merge (the plan_critic add's plan PR is the
      likely first; if none arrives within a day the build asks the coordinator for one). A session without gh makes the
      same read through mcp__github__ pull_request_read get_check_runs and applies the same comparison.
    command: >-
      gh api repos/otl-labs/ontheloop/commits/<head_sha>/check-runs | jq -r '.check_runs[] |
      select(.name=="persona-verdict/decision_scout") | [.app.id, (.output.title | startswith("verdict "))] | @tsv'
      && grep -n -A3 'id: gates.decision_scout.verdict_source' docs/contracts/project-configuration.yaml | grep -c in_session
    expected: one row '<gates.verdict_app.app_id> true', then a count of at least 1
    fix_if: 'no row, false, or a failed: title: read the persona-verdict run for that head and STOP to the plan owner with its run id and the check title'
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a one-time live proof of the add step
