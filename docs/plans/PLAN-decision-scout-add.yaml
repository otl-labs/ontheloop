constraints:
  - >-
    Operator approvals 2026-11-28 15:08 UTC ("write the plan"): the approach; the Decision 235 entry that keys
    decision_scout on the trigger upstream (decision_scout only, through TRIGGER_KEYED_PERSONAS; plan_critic and later
    personas carry their own); T4.30 work ahead of T4.32's completion edge under Decision 229 cl.1; the read_tree
    opt-in as its own step (rec-5759); the Decision 262 keep (rec-5758).
  - The check is advisory; gates.decision_scout.verdict_source stays in_session; no gate reads the check (Decision 264 cl.4).
  - Head content is data; parse with route.parse_plan or read as text, never import, exec, install or run it (Decision 263 cl.2).
  - No persona contract change, no read_tree opt-in, no image re-pin, no workflow change (persona-verdict.yml is near its cap).
  - No spend mechanism (operator ruling 2026-11-27, rec-5707).
  - The keyed run, smoke, refusal and fallback jobs, the Environment, OIDC and the egress floor are unchanged; keyed_run.prepared_request already accepts any implemented verdict persona.
