pre_implementation_checklist:
- Branch confirmed not on main and rebased on origin/main; VP step 1 passes
- docs/PROJECT_CONTEXT.md read
- Decisions 66, 84, 128, 134 (cl.3), 166, 167, 168 (cl.1-2), 177, 217 (cl.5) and 243 (cl.2, cl.8) read, only the cited clauses
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- Before any edit -- run VP step 1. If it fails, stop and send the coordinator a plan-defect report.
- >-
  Contracts and skills -- apply every block of docs/plans/approved/decision-serves-kind-grammar.yaml to its file
  (kind-contract creates docs/contracts/decision-kind.yaml), filling only the date placeholder with the implementation
  date, the same in every block. Copy each after text; never retype it. Lower the two skills' config/prose_budgets.yaml
  entries to their measured sizes, changing only the number (keep the dec-75 raise-approved comment). Run VP step 2.
- Parser -- scripts/decisions_md.py placeholder constants, iterator, placeholder envelope parsing, shape check and row keys, with tests/decisions_md/test_envelope.py (red, then green). Measure SLOC; past 500, STOP -- a facade package (Decision 128) adds undeclared paths, so a plan(decision-serves-kind-grammar) scope amendment PR declaring them lands first (implement-scope-boundary.yaml deviation escalation), then decompose; never raise.
- Index -- scripts/decisions_index.py band projection, its new test module and the widened key set in tests/test_decisions_index.py; regenerate docs/decisions-index.json.
- Rules and check -- envelope_rules.py and its tests first, then wire into the conformance check (path constant, north_star_models loader, each rule gated on its contract declaration) with its test package (git mv the legacy module to test_entry_rules.py, changing only parents[3] to parents[4]; the new serves/kind module beside it with the REAL-CONTRACT node, the _CONCERN_SPLIT_TEST_PACKAGES line and its map node, and the five shards' node_id paths); move the required-field and significance rules into envelope_rules; widen the decisions, roadmap and verification _manifest.py pre_globs (validate_pre_glob_closure measures the closure) with their test__manifest.py rows; rec-3260 unit fix and its node. Measure SLOC.
- Planning-time report -- plan_decision_drafts.py (plan text, sidecar, draft file), the .txt fixture and its tests, then the plan_obligations section and flag with its tests/test_plan_obligations.py node.
- Registry shards for VP 4, 5 and 6; widen decisions-index-archive-rows-are-skeletons' live-row assertion and move c4 to met in roadmap-t436-north-star-item, as their scope rows say.
- Bookkeeping -- T4.36 c4 met (met_by decision-serves-kind-grammar).
- Execute Verification Plan steps 2-10 after the edits -- loop until steps 2-9 pass (VP 10 stops and escalates per its fix_if, never loops); on unrecoverable failure stop and RCA (Decision 55).
- >-
  Closure evidence recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state; parent
  validator evidence (VP 8 full-tier exit 0 plus bin/venv-python -m scripts.checks.validation_result --verify-head for
  the pushed HEAD); structured postflight evidence (write the scripts.session.postflight_evidence.CATEGORIES JSON in the
  scratchpad, then bin/venv-python -m scripts.session.postflight --evidence <file>); the real outcome -- push, PR, CI
  green by event-driven wake (never polled), merge, then VP step 11.
- >-
  Open the PR. The implementation commit carries `Resolves: rec-3260` (git-ops.yaml resolves_trailer TRANSPORT
  clause). Merge needs Benjamin's word on the final diff in the build thread (governing contract text); re-run VP 10
  immediately before merge; then merge per
  push_pr_ci_merge_flow (premerge, explicit commit_message and expectedHeadSha, readback) on code review PROCEED and
  green CI.
- 'Report: what was implemented, verification results, measured SLOC, effective lines and bytes.'
