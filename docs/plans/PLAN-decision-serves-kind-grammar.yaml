bundled_recommendations: [rec-3260]
followon_recs: [rec-4659, rec-4660, rec-4664]
infrastructure_dependencies: []
acceptance_criteria:
- A new Decision without kind, with a value outside decision-kind.yaml's values, or with an empty justification fails validate_decision_entry_conformance with a message naming the field.
- serves is optional; a malformed, duplicate or unresolved id fails a new entry; unknown envelope keys fail a new entry.
- A new Decision number must exceed the baseline maximum, and an unfilled placeholder heading fails on every run.
- plan_obligations reports a decision_drafts section for a plan and its approved-text sidecar (--plan) or a draft file (--decision-draft) through the shared parser's placeholder grammar, quoting the kind test when kind is missing, and still exits 0.
- docs/contracts/decision-kind.yaml is the single definition of kind; decision-entry.yaml, the planning skill and plan-critique point at it.
- The build's edits to the five bound files equal docs/plans/approved/decision-serves-kind-grammar.yaml exactly (approved_text verify; validate_merge_step at merge), with only the date placeholder filled.
- docs/decisions-index.json carries serves and kind on live enveloped rows only and is fresh; neither reaches a warehouse surface (backfill columns, DecisionPayload, DQ config -- VP 8).
- decision-entry.yaml stays within the 500-effective-line contracts limit, this plan does not touch config/structural_size_budgets.yaml, and neither skill grows.
- rec-3260 is closed (VP 11).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Precondition, run once before the first edit -- the branch is rebased; the north-star file, its model module,
    Decision 243 and an open T4.36 c4 exist; decision-entry.yaml has no budgets entry or frozen size note; and every
    sidecar block still applies to this tree (each before occurs exactly once in its file, so no sibling plan has
    reworded an anchor since approval).
  command: >-
    git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && test -f
    docs/contracts/north-star.yaml && test -f scripts/north_star_models.py && grep -qE "^## Decision 243: North stars
    are a Tier A file" docs/DECISIONS.md && bin/venv-python -c "import yaml; from scripts.roadmap import approved_text
