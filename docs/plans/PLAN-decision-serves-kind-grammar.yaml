- file: scripts/roadmap/plan_decision_drafts.py
  action: Create
  purpose: >-
    Finds drafted Decision blocks in three places: headings from iter_placeholder_headings inside a plan's string
    values, skipping a heading whose number and title already head an entry in DECISIONS.md or DECISIONS_ARCHIVE.md
    (a quoted existing entry is never a draft); the plan's approved-text sidecar (docs/plans/approved/<slug>.yaml, read with approved_text.load_sidecar),
    taking only blocks whose file is docs/DECISIONS.md and only headings in a block's after text that are not in its
    before text, so a quoted anchor of an existing entry is never a draft; and a draft file (--decision-draft). Parses
    each with extract_entry_envelope(block, placeholder=True), reads the same contracts the check reads (north-star ids
    through scripts/north_star_models.py), and applies every envelope_rules rule -- required fields, significance,
    kind, serves, closed keys, number -- with the placeholder accepted as the number. A concrete number, whatever its
    value, is that one WARN-class finding ("assign at implementation: Decision 217 cl.5") and never a number FAIL; the
    baseline-maximum rule judges committed entries only. When kind is missing or invalid, the finding quotes
    decision-kind.yaml's test so the drafter has the definition in hand (Decision 66). Public API: findings_for_plan(path)
    (the plan and its sidecar when one exists) and findings_for_draft(path), each taking str or Path and returning
    finding objects with attributes number, title (the heading text after "Decision <number>: ", always a str: "" when
    the finding has no heading, such as an unparseable sidecar), severity (FAIL or WARN), field and detail. A block with no well-formed envelope yields exactly one FAIL with field "envelope" and no
    per-field findings. The folded-scalar rule is judged on the parsed string by envelope_rules.malformed_envelope_detail:
    a block whose first ```yaml occurrence (the envelope opener; a later ```yaml reversal-conditions stanza is never
    judged) is not alone on its line is that one envelope FAIL, with detail "folded scalar: put the draft in a literal
    (|) block"; literal, single-quoted and double-quoted scalars are all accepted. Report lines, exactly:
    "decision_drafts: none" when no drafted Decision is found, otherwise "decision_drafts: <d> drafted, <f> findings"
    followed by one "  FAIL <number> <field>: <detail>" or "  WARN <number> <field>: <detail>" line per finding. Never
    raises; an unreadable path or an unparseable sidecar is a finding.
  new_imports:
  - scripts.decisions_md
  - scripts.checks.decisions.envelope_rules
  - scripts.north_star_models
  - scripts.roadmap.approved_text
