schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-serves-kind-grammar
intent: >-
  Separate direction from mechanism in the decision record, in a form every agent reads the same way. Every new
  Decision declares kind {value: direction | mechanism, justification} in its typed envelope, classified by one
  persisted test and rubric (docs/contracts/decision-kind.yaml); new Decisions may also declare which north stars they
  serve (serves: [NS.n]). Both are forward-only and index-projected, so the emergent-north-star detector and any later
  per-kind autonomy ceiling read a typed input. The planning agent's deterministic report
  (scripts.roadmap.plan_obligations) applies the same rules to drafted Decisions before their wording is approved, and
  the operator's ruling that a Decision number is assigned at implementation (MAX + 1, Decision 217 clause 5) is
  persisted and checked. kind grants and gates nothing yet (Decision 235 is the ladder pattern only). Bound by
  Decision 243 clause 8.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-serves-kind-grammar.yaml
phase: >-
  T4.36 (North stars as a Tier A file), created by PLAN-north-star-tier-a (built 2026-11-03, PR #1810, Decision 243).
  Closes T4.36 c4 only. Both prerequisite builds have merged: north-star Tier A and the decision-entry.yaml compaction
  (PR #1684, 449 effective lines, frozen size note retired). VP step 1 re-checks both before the first edit.
closes_criteria: [T4.36:c4]
scope:
- file: docs/contracts/decision-entry.yaml
  action: Modify
  purpose: >-
    Sidecar blocks entry-amendment-row, entry-fields and entry-field-shapes, applied exactly: required_fields gains
    kind; optional_fields gains serves; closed_key_set, number_assignment and draft_check follow optional_fields;
    field_shapes.kind (a one-line pointer to decision-kind.yaml) and field_shapes.serves follow
    field_shapes.significance; one new amendment_log entry. 490 effective lines with the blocks applied on main
    a7fb3bc9, under the 500-line contracts limit with no budgets entry.
- file: docs/contracts/decision-kind.yaml
  action: Create
  purpose: >-
    Class D contract, the single definition of kind (sidecar block kind-contract, 55 effective lines): shape, values,
    test, own_clauses, direction_when, human_gate, mechanism_when, tie_break, semantics, consumer_contract,
    enforcement. Evaluator validate_decision_entry_conformance, which reads values from it at check time and names its
    path as a module constant (validate_contract_drift resolves the evaluator on that basename). Born ratified
    (ratified_via Decision 243 clause 8), so no contract-population.yaml ratchet pin moves. Pointed at by
    decision-entry.yaml, the planning skill and plan-critique, and later by the operator_decision journal row and any
    autonomy ladder.
- file: scripts/decisions_md.py
  action: Modify
  purpose: >-
    The one shared parser gains the placeholder grammar, so no consumer hand-rolls a heading or fence regex (Decision
    134 cl.3). The placeholders are scripts.roadmap.approved_text's number and date placeholders, held here as the
    constants PLACEHOLDER_NUMBER and PLACEHOLDER_DATE (decisions_md never imports approved_text; a test asserts
    approved_text fills both).
    (1) iter_placeholder_headings(content) beside iter_decision_headings: matches "## Decision <placeholder>:" and
    "## Decision <n>:" headings (group(1) is the placeholder or digits) and requires a non-empty title on the same line
    (":[ \t]*" then a non-blank title, never "\s*", so an anchor such as "## Decision 229:" followed by a newline is
    not a heading); iter_decision_headings' digits-only grammar is unchanged, so a placeholder heading never parses as
    a Decision. (2) extract_entry_envelope(block, placeholder=False): with placeholder=True the heading and the
    envelope number may be the placeholder; each placeholder token in the envelope text is replaced by a bare
    sentinel word before YAML parsing -- valid YAML whether the token sits quoted (decided_date, as sidecars write it)
    or unquoted (number), since an unquoted placeholder is not valid YAML -- and the number sentinel reads back as the
    placeholder; drafts only. (3)
    _envelope_has_well_formed_shape type-checks serves (list of str) and kind (mapping), and admits the placeholder as
    the number only under placeholder=True. (4) parse_decisions_md rows gain index-only keys kind (the envelope's kind
    mapping {value, justification}, or {} -- the significance precedent, so a consumer reads row["kind"].get("value"))
    and serves (the envelope's list, or []). Never added to the warehouse backfill columns, DecisionPayload or DQ
    config (Decision 84). 447 of 500 SLOC on 2026-11-03 (headroom 53): keep the additions small; if it would pass 500,
    decompose it into a facade package (Decision 128), never raise. It imports nothing new (the placeholder constants
    keep it a leaf), so the row carries no new_imports.
- file: scripts/decisions_index.py
  action: Modify
  purpose: >-
