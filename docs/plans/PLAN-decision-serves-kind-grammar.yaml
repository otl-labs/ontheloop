execution_steps:
- Before any edit -- run VP step 1. If it fails, stop and tell the coordinator (a prerequisite build has not merged).
- >-
  Contracts -- create docs/contracts/decision-kind.yaml from VERBATIM entry K and apply VERBATIM entries E1-E3 to
  decision-entry.yaml and P1-P2 to plan-obligations.yaml, each at the placement its first line names. Substitute DATE
  and "Decision NNN clause" only (constraints). Copy the text; never retype or rewrap it.
- Parser -- scripts/decisions_md.py placeholder iterator, placeholder envelope parsing, shape check and row keys, with tests/decisions_md/test_envelope.py (red, then green). Measure SLOC; past 500, decompose into a facade package (Decision 128), never raise.
- Index -- scripts/decisions_index.py band projection, its new test module and the widened key set in tests/test_decisions_index.py; regenerate docs/decisions-index.json.
- Rules and check -- envelope_rules.py and its tests first, then wire into the conformance check (path constant, north_star_models loader, each rule gated on its contract declaration) with its new test module including the REAL-CONTRACT node; move the required-field and significance rules into envelope_rules; widen the decisions, roadmap and verification _manifest.py pre_globs (measure north_star_models' first-party imports) with their test__manifest.py rows; rec-3260 unit fix and its node. Measure SLOC.
- Planning-time report -- plan_decision_drafts.py, the .txt fixture and its tests, then the plan_obligations section and flag.
- Skills -- apply VERBATIM entries S1-S2 (planning) and C1-C3 (plan-critique); measure bytes against config/prose_budgets.yaml.
- Registry shards for VP 4, 5 and 6.
- Bookkeeping -- T4.36 c4 met (met_by decision-serves-kind-grammar).
- Execute Verification Plan steps 2-10 after the edits -- loop until steps 2-9 pass (VP 10 stops and escalates per its fix_if, never loops); on unrecoverable failure stop and RCA (Decision 55).
- >-
  Closure evidence recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state; parent
  validator evidence (VP 8 full-tier exit 0 plus bin/venv-python -m scripts.checks.validation_result --verify-head for
  the pushed HEAD); structured postflight evidence (write the scripts.session.postflight_evidence.CATEGORIES JSON in the
  scratchpad, then bin/venv-python -m scripts.session.postflight --evidence <file>); the real outcome -- push, PR, CI
  green by event-driven wake (never polled), squash-merge, then VP step 11.
- 'Open the PR. Merge needs Benjamin''s word on the final diff in the build thread (governing contract text); then squash-merge on code review PROCEED + green CI with a `Resolves: rec-3260` trailer.'
- 'Report: what was implemented, verification results, measured SLOC, effective lines and bytes.'
- |-
  VERBATIM docs/contracts/decision-kind.yaml | K: the whole file, created with exactly this content
  # The one definition of a Decision's kind (direction | mechanism). decision-entry.yaml's envelope, the
  # operator_decision journal row and any later autonomy ladder point here; none restates it.
  contract:
    id: decision-kind
    class: D
    contract_version: 1
    status: ratified
    ratified_via: "Decision NNN clause 8 / PLAN-decision-serves-kind-grammar"
    description: >-
      The direction/mechanism classification every new Decision declares, and how any agent decides it.
    subject: decision-kind
    evaluator:
      check: validate_decision_entry_conformance

  amendment_log:
    - date: "DATE"
      semantic_break: false
      change_class: field_add
      summary: "PLAN-decision-serves-kind-grammar: created (Decision NNN clause 8)."

  shape: "{value, justification}, the same shape as decision-entry.yaml's significance."
  values: [direction, mechanism]
  test: >-
    If the entry's own clauses were undone (restoring what it replaced, retired or superseded), would a goal, a human
    gate or a data or user commitment change? Yes: direction. Only the means: mechanism. The justification is one
    sentence answering this and naming the deciding clause.
  own_clauses: >-
    Count what the entry sets, moves, widens, narrows or removes, including an existing rule it writes down as its own
    model and the change an amending entry makes; ignore what it only restates or cites, and later entries' amendments.
  direction_when: >-
    An own clause says what On The Loop or an adopter product is for, whom it serves or what success is; creates,
    moves, widens, narrows or removes a human gate; or sets or moves a commitment on licence, price or paywall,
    tenancy, or what data (the operator's included) is shipped, served or exposed and to whom.
  human_gate: >-
    An act an agent may not take without a human: a human approval or human-confirmed plan, a required citation of a
    human-approved record such as a numbered Decision, or a prohibition that removes the act from agents alone.
    Applying an existing gate to a new population (for example the raise-approved marker to a new class of file)
    widens it; changing what satisfies a gate (which approval or citation counts) moves it.
  mechanism_when: >-
    Every own clause states how something is done (tool, format, check, threshold, data shape, procedure, placement,
    vendor), including how an unchanged gate or commitment is enforced. A check that blocks a defect for every author
    alike, human or agent, is mechanism. An API, module or function boundary is mechanism; the word boundary is not a
    signal.
  tie_break: >-
    Any direction clause makes the entry direction, and an unclear clause reads as direction (fail closed: direction
    labelled mechanism is the harmful error). Put a human gate in its own entry so its mechanism can earn autonomy.
  semantics: >-
    direction is pinned at human approval on every autonomy ladder, forever. mechanism may earn autonomy on a ladder a
    later ratified Decision defines (Decision 235 is the pattern). kind grants and gates nothing until then. north_star
    is not a decision kind (north stars live in docs/contracts/north-star.yaml, Decision NNN clause 2). Unrelated to the
    kind of reversal-conditions stanzas and of work items, and to Decision 197's shipped mechanism.
  consumer_contract: >-
    Read kind.value from scripts.decisions_md.parse_decisions_md or docs/decisions-index.json; never re-derive it from
    prose. An entry without kind (the band before this field) reads as direction.
  enforcement: >-
    validate_decision_entry_conformance fails a new-in-diff entry whose kind is missing, whose value is outside values,
    or whose justification is empty. A mechanism entry listed in a north star's carried_by is a WARN; the remedy is to
    drop it from carried_by or supersede the entry, never to edit its envelope (Decision 177).
    scripts.roadmap.plan_obligations applies the same rules to drafts and quotes test when kind is missing.
- |-
  VERBATIM docs/contracts/decision-entry.yaml | E1: appended as the last row of the top-level amendment_log
    - date: "DATE"
      semantic_break: false
      change_class: field_add
      summary: "PLAN-decision-serves-kind-grammar (Decision NNN clause 8): required kind (defined in decision-kind.yaml), optional serves, closed_key_set, number_assignment (Decision 217 clause 5) and draft_check."
- |-
  VERBATIM docs/contracts/decision-entry.yaml | E2: replaces metadata_envelope's required_fields and optional_fields lines
    required_fields: [number, significance, kind]
    optional_fields: [status, decided_date, amends, supersedes, serves]
    closed_key_set: >-
      A new-in-diff envelope may carry only required_fields and optional_fields keys; any other key fails the entry.
    number_assignment: >-
      Assigned at implementation, never at planning (Decision 217 clause 5: max-plus-one with the re-check, until
      T4.24's per-file split). A plan or draft writes the literal placeholder NNN in the heading and the envelope number
      and cites its own entry as Decision NNN. The implementer, after rebasing onto origin/main, replaces every NNN with
      MAX(decision number across docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md) + 1 in the edit that inserts the
      entry, and re-assigns the same way if a concurrent merge takes the number first. A new number not above the
      baseline maximum, or an unsubstituted NNN heading, fails.
    draft_check: >-
      bin/venv-python -m scripts.roadmap.plan_obligations --plan <plan> (or --decision-draft <markdown>) applies these
      envelope rules to drafted entries before their wording is approved; NNN is expected and a concrete number is a
      WARN. Advisory; validate_decision_entry_conformance is the gate.
- |-
  VERBATIM docs/contracts/decision-entry.yaml | E3: inserted directly after field_shapes.significance.justification
      kind: Defined in docs/contracts/decision-kind.yaml (shape, values, test, enforcement); never restated here.
      serves:
        shape: A non-empty, duplicate-free list of north-star ids, each a string matching ^NS\.\d+$, e.g. [NS.6, NS.8].
        resolves_against: docs/contracts/north-star.yaml
        semantics: >-
          The north stars this Decision serves, as declared by its author. Advisory: the decision scout verifies the
          claim and the operator promotes it; it grants nothing. The mission is not nameable. A north star's carried_by
          list is the authoritative reverse link, and serves never edits it.
        enforcement: >-
          A new-in-diff entry fails when an id does not resolve to an entry in resolves_against. A baseline entry whose
          id no longer resolves is a WARN; the remedy is to keep the id in resolves_against as retired, because
          envelopes are append-only (Decision 177).
        flips_to_hard_fail_when: A ratified Decision makes serves load-bearing for an autonomy or promotion gate.
- |-
  VERBATIM docs/contracts/plan-obligations.yaml | P1: appended to contract.description after its last line
      Its advisory CLI also reports a decision_drafts section: drafted "## Decision" entries checked
      against the envelope rules decision-entry.yaml and decision-kind.yaml own (report-only; never
      part of this check's verdict).
