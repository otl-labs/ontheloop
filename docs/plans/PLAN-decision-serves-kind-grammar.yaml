schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: decision-serves-kind-grammar
intent: >-
  Separate direction from mechanism in the decision record, in a form every agent reads the same way. Every new
  Decision declares kind {value: direction | mechanism, justification} in its typed envelope, classified by one
  persisted test and rubric (docs/contracts/decision-kind.yaml); new Decisions may also declare which north stars they
  serve (serves: [NS.n]). Both are forward-only and index-projected, so the emergent-north-star detector and any later
  per-kind autonomy ceiling read a typed input. The planning agent's deterministic report
  (scripts.roadmap.plan_obligations) applies the same rules to drafted Decisions before their wording is approved, and
  the operator's ruling that a Decision number is assigned at implementation (MAX + 1, Decision 217 clause 5) is
  persisted and checked. kind grants and gates nothing yet (Decision 235 is the ladder pattern only). Bound by the
  north-star Decision (Decision NNN clause 8, PLAN-north-star-tier-a).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decision-serves-kind-grammar.yaml
phase: >-
  T4.36 (North stars as a Tier A file), created by PLAN-north-star-tier-a. Closes T4.36 c4 only. Builds only after two
  BUILD PRs have merged, not just their plan PRs: PLAN-north-star-tier-a's (docs/contracts/north-star.yaml, the
  north-star Decision and T4.36 must exist on main) and the decision-entry.yaml compaction plan's (Benjamin
  2026-10-27: compact the contract instead of raising its size pin), which leaves decision-entry.yaml at or under 470
  effective lines with its frozen size note retired. VP step 1 checks both.
closes_criteria: [T4.36:c4]
scope:
- file: docs/contracts/decision-entry.yaml
  action: Modify
  purpose: >-
    The approved text applied verbatim (execution_steps VERBATIM entries E1-E3): required_fields gains kind;
    optional_fields gains serves; closed_key_set, number_assignment and draft_check follow optional_fields;
    field_shapes.kind (a one-line pointer to decision-kind.yaml) and field_shapes.serves follow field_shapes.significance;
    one amendment_log row. Lands at or under the 500-effective-line contracts limit with no budgets entry: the
    compaction plan made the room (this edit adds 30 effective lines, measured on the approved text).
- file: docs/contracts/decision-kind.yaml
  action: Create
  purpose: >-
    Class D contract, the single definition of kind (VERBATIM entry K, 55 effective lines): shape, values, test,
    own_clauses, direction_when, human_gate, mechanism_when, tie_break, semantics, consumer_contract, enforcement.
    Evaluator validate_decision_entry_conformance, which reads values from it at check time and names its path as a
    module constant (validate_contract_drift resolves the evaluator on that basename). Born ratified (ratified_via the
    north-star Decision clause 8), so no contract-population.yaml ratchet pin moves. Pointed at by decision-entry.yaml,
    the planning skill and plan-critique, and later by the operator_decision journal row and any autonomy ladder.
- file: scripts/decisions_md.py
  action: Modify
  purpose: >-
    The one shared parser gains the placeholder grammar, so no consumer hand-rolls a heading or fence regex (Decision
    134 cl.3). (1) iter_placeholder_headings(content) beside iter_decision_headings: matches "## Decision NNN:" and
    "## Decision <n>:" headings (group(1) is the literal NNN or digits) and requires a non-empty title on the same line
    (":[ \t]*" then a non-blank title, never "\s*", so an OLD/NEW anchor such as "## Decision 229:" followed by a
    newline is not a heading); iter_decision_headings' digits-only grammar is unchanged, so an NNN heading never parses
    as a Decision. (2) extract_entry_envelope(block, placeholder=False): with
    placeholder=True the heading and the envelope number may be the literal NNN; drafts only. (3)
    _envelope_has_well_formed_shape type-checks serves (list of str) and kind (mapping), and admits number "NNN" only
    under placeholder=True. (4) parse_decisions_md rows gain index-only keys kind (the envelope's kind mapping
    {value, justification}, or {} -- the significance precedent, so a consumer reads row["kind"].get("value")) and
    serves (the envelope's list, or []). Never added to the warehouse backfill columns, DecisionPayload or DQ config
    (Decision 84). Stays under 500 SLOC (441 at plan time): keep the additions small; if it would pass 500, decompose
    it into a facade package (Decision 128), never raise.
- file: scripts/decisions_index.py
  action: Modify
  purpose: >-
    build_index decides the band with extract_entry_envelope(row["raw_block"]). On rows that are live and carry a
    well-formed envelope it projects serves (the list; [] when undeclared) and kind ({"value": <value>} -- the value
    only, for read cost -- or null when the envelope has no kind); pre-envelope and archive rows carry neither key
    (Decision 179 read cost). Docstring states the band rule and the two shapes.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated with bin/venv-python -m scripts.decisions_index --write.
- file: tests/test_decisions_index.py
  action: Modify
  purpose: >-
    test_entry_shape_is_the_stable_projection_only's expected key set gains serves and kind for live rows that carry a
    well-formed envelope (it asserts the exact key set of every row, so it reddens without this edit).
- file: scripts/checks/decisions/envelope_rules.py
  action: Create
  purpose: >-
    Pure rule functions over parsed inputs (no file reads), shared by the conformance check and plan_decision_drafts
    (one rule set, two callers): required_field_issues and significance_issues (moved unchanged from the check's
    missing-fields test and _significance_issues, with _NEVER_NUMBERED_DECISION_TEXT); kind_issues (missing, value
    outside the values passed in, empty justification);
    serves_issues (^NS\.\d+$, non-empty, duplicate-free, resolves against the ids passed in); unknown_key_issues
    (closed_key_set); malformed_envelope_detail (names the offending field when extract_entry_envelope returns None);
    number_issues (a new number must exceed the baseline maximum; an unsubstituted NNN heading fails; NNN accepted when
    the caller says the input is a draft); dangling_serves_warnings and carried_by_mechanism_warnings (WARN text names
    the lawful remedy, Decision 177).
- file: scripts/checks/decisions/validate_decision_entry_conformance.py
  action: Modify
  purpose: >-
    Adds _KIND_CONTRACT_REL_PATH = "docs/contracts/decision-kind.yaml" beside _CONTRACT_REL_PATH; reads kind values from
    it, the serves target from decision-entry.yaml field_shapes.serves.resolves_against, and north-star ids and
    carried_by through plan 1's scripts/north_star_models.py (load_north_star(path); resolution uses .ids(), so a
    retired id still resolves as approved; never a raw YAML walk), then calls envelope_rules. Each
    new rule fires only when the contract declares it (kind in required_fields, closed_key_set present,
    field_shapes.serves present -- which also gates both WARN rules -- and number_assignment present), the
    tolerated-absence pattern block_separator already uses (keep _load_envelope_config's 2-tuple signature, which the
    legacy module unpacks, and load the new contract sections in a separate loader), so tests/checks/decisions/test_validate_decision_entry_conformance.py's synthetic contracts stay valid and
    that module is untouched. New-in-diff entries: kind, serves, closed-key and number rules FAIL; a
    present-but-malformed envelope names its bad field. Every run (including the no-new-entries early return): an
    unsubstituted "## Decision NNN" heading FAILs (found with iter_placeholder_headings); the two WARN rules print lines
    starting "  WARN:", never appended to failed. A declared contract that is missing or unparseable fails closed when a
    new entry needs it (Decision 170). Bundled rec-3260: both registry.examined calls use
    unit="decision_entries_checked". The required-field and significance rules move into envelope_rules with behaviour
    unchanged (the untouched legacy module proves it). The stale "at its 500-SLOC budget" comment is corrected.
- file: scripts/checks/decisions/_manifest.py
  action: Modify
  purpose: >-
    validate_decision_entry_conformance's pre_globs gain docs/contracts/decision-kind.yaml, docs/contracts/north-star.yaml
    and scripts/north_star_models.py, so an edit to any input the check now reads runs it in --pre (never fail-open) and
    validate_pre_glob_closure stays green.
- file: tests/checks/decisions/test__manifest.py
  action: Modify
  purpose: >-
    _CLOSURE_INPUTS' validate_decision_entry_conformance row gains docs/contracts/decision-kind.yaml,
    docs/contracts/north-star.yaml, scripts/north_star_models.py and scripts/checks/decisions/envelope_rules.py, so the
    parametrized coverage node proves each is gated.
- file: scripts/checks/roadmap/_manifest.py
  action: Modify
  purpose: >-
    validate_plan_scope_closure's pre_globs gain scripts/decisions_md.py, scripts/checks/decisions/envelope_rules.py and
    scripts/north_star_models.py (plus any first-party module north_star_models imports, as measured at build time):
    plan_obligations now imports plan_decision_drafts, and validate_pre_glob_closure counts that closure.
- file: tests/checks/roadmap/test__manifest.py
  action: Modify
  purpose: _CLOSURE_INPUTS' validate_plan_scope_closure row gains the same paths.
- file: scripts/checks/verification/_manifest.py
  action: Modify
  purpose: >-
    validate_admin_root_premerge_gate's pre_globs gain scripts/roadmap/plan_decision_drafts.py, scripts/decisions_md.py,
    scripts/checks/decisions/envelope_rules.py and scripts/north_star_models.py (plus its measured first-party imports):
    the gate imports plan_obligations, whose closure now includes them.
- file: tests/checks/verification/test__manifest.py
  action: Modify
  purpose: TestGatedEntryInputClosures gains a node asserting validate_admin_root_premerge_gate's pre_globs cover those paths.
- file: scripts/roadmap/plan_decision_drafts.py
  action: Create
  purpose: >-
    Finds drafted Decision blocks -- headings from iter_placeholder_headings inside a plan's string values, or in a
    draft file -- parses each with extract_entry_envelope(block, placeholder=True), reads the same contracts the check
    reads (north-star ids through scripts/north_star_models.py), and applies every envelope_rules rule -- required
    fields, significance, kind, serves, closed keys, number -- with NNN accepted as the number. A concrete number is a WARN-class finding ("assign at implementation: Decision 217 cl.5"). When kind is
    missing or invalid, the finding quotes decision-kind.yaml's test so the drafter has the definition in hand
    (Decision 66). Public API: findings_for_plan(path) and findings_for_draft(path), each taking str or Path and
    returning finding objects with attributes number, title (the heading text after "Decision <number>: "), severity
    (FAIL or WARN), field and detail. A block with no well-formed envelope yields exactly one FAIL with field "envelope"
    and no per-field findings. The folded-scalar rule is judged on the parsed string by
    envelope_rules.malformed_envelope_detail: a block whose first ```yaml occurrence (the envelope opener; a later
    ```yaml reversal-conditions stanza is never judged) is not alone on its line is that one envelope FAIL, with detail "folded scalar: put the draft in a literal (|) block";
    literal, single-quoted and double-quoted scalars are all accepted. Report lines, exactly: "decision_drafts: none" when no drafted Decision is found, otherwise
    "decision_drafts: <d> drafted, <f> findings" followed by one "  FAIL <number> <field>: <detail>" or
    "  WARN <number> <field>: <detail>" line per finding. Never raises; an unreadable path is a finding.
- file: scripts/roadmap/plan_obligations.py
  action: Modify
  purpose: >-
    build_report appends the decision_drafts section from plan_decision_drafts for the plan; main gains
    --decision-draft <path> (prints the decision_drafts section for a draft file alone; exactly one of --plan or
    --decision-draft). Still always exits 0; validate_plan_scope_closure's gating verdict is unchanged.
- file: docs/contracts/plan-obligations.yaml
  action: Modify
  purpose: >-
    The approved sentence appended to contract.description (VERBATIM entry P1) and one amendment_log row saying the
    same (VERBATIM entry P2).
- file: .claude/skills/planning/SKILL.md
  action: Modify
  purpose: >-
    Decision Significance Gate: "Three property tests" becomes "Four property tests" (VERBATIM entry S1) and property
    test 4, kind classified, follows test 3 (VERBATIM entry S2). +434 B measured, within config/prose_budgets.yaml's
    44,097 B pin (43,522 B at plan time); no raise.
- file: .claude/skills/plan-critique/SKILL.md
  action: Modify
  purpose: >-
    12p judges the claimed kind.value the way it judges significance (VERBATIM entries C1-C3). +1 B measured, within
    the 18,693 B pin (18,684 B at plan time). The category-consistency verdict and its REVISE consequence stay exactly
    as strong (Decision 167's reversal condition names 12p as a gate).
- file: tests/decisions_md/test_envelope.py
  action: Modify
  purpose: >-
    Shapes accepted and rejected for serves and kind; the row keys and their shapes (kind a mapping or {}, serves a list
    or []); iter_placeholder_headings matches NNN and digits only, and rejects a heading with no same-line title; extract_entry_envelope reads an NNN draft only with
    placeholder=True and still returns None for it by default.
- file: tests/test_decisions_index_envelope_fields.py
  action: Create
  purpose: >-
    Keys only on live enveloped rows (serves [] and kind null when undeclared; kind {"value": ...} when declared),
    absent elsewhere; neither key in scripts.ops_portal.decisions._DECISION_BACKFILL_COLS.
- file: tests/checks/decisions/test_envelope_rules.py
  action: Create
  purpose: Each rule function over synthetic inputs, every FAIL and WARN case, remedy text present in WARNs.
- file: tests/checks/decisions/test_validate_decision_entry_conformance_serves_kind.py
  action: Create
  purpose: >-
    tmp_path repo with synthetic contracts, north-star file and DECISIONS.md, baseline_reader injected. FAIL: missing
    kind, kind north_star, empty justification, bad/duplicate/unresolved serves, unknown key, number not above the
    baseline max, a leftover NNN heading (also on the no-new-entries path), a declared contract missing. WARN-not-fail:
    dangling baseline serves, mechanism in carried_by. PASS: a conforming new entry; adding a value to the synthetic
    decision-kind.yaml admits it with no code change; a contract that declares none of the new rules leaves an old-style
    entry passing. REAL-CONTRACT node: copies the committed docs/contracts/decision-entry.yaml and decision-kind.yaml
    with a minimal north-star fixture into tmp_path, and asserts a new entry without kind fails and a conforming one
    passes. rec-3260 node: the no-new-entries path records registry.examined with unit decision_entries_checked.
- file: tests/fixtures/decision_drafts/nnn_conforming.txt
  action: Create
  purpose: >-
    A drafted "## Decision NNN:" entry with a conforming envelope (number NNN, significance, kind), used by tests and VP
    7. A .txt file, because a new tracked .md fails validate_prose_allowlist.
- file: tests/test_plan_decision_drafts.py
  action: Create
  purpose: >-
    A plan embedding an NNN Decision with a conforming envelope reports "decision_drafts: 1 drafted, 0 findings";
    missing kind reports a FAIL line quoting the test; a draft missing significance, or claiming a "Never a numbered
    Decision" routing row, reports a FAIL line; a literal draft that also carries a ```yaml reversal-conditions stanza
    passes; both folded-scalar shapes (with and without a blank line after the
    heading) report the one folded-scalar envelope FAIL, while double-quoted and single-quoted drafts pass; an OLD/NEW
    anchor ("## Decision 229:" then a newline) is not a drafted Decision; a concrete number reports the WARN line;
    findings_for_plan accepts str and Path and returns title and field on each finding; a draft file via
    --decision-draft; a plan with no drafted Decision reports "decision_drafts: none"; main() exits 0 in every case; an
    unreadable path is a finding, not a raise.
- file: config/agent/verification_registry/entries/decision-entry-serves-kind-enforced.yaml
  action: Create
  purpose: Graduated shard for VP step 5.
- file: config/agent/verification_registry/entries/decisions-index-serves-kind-band.yaml
  action: Create
  purpose: Graduated shard for VP step 4.
- file: config/agent/verification_registry/entries/plan-decision-drafts-report.yaml
  action: Create
  purpose: Graduated shard for VP step 6.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: Bookkeeping walk only -- T4.36 c4 open -> met, met_by decision-serves-kind-grammar.
bundled_recommendations: [rec-3260]
followon_recs: [rec-4659, rec-4660, rec-4664]
infrastructure_dependencies: []
acceptance_criteria:
- A new Decision without kind, with a value outside decision-kind.yaml's values, or with an empty justification fails validate_decision_entry_conformance with a message naming the field.
- serves is optional; a malformed, duplicate or unresolved id fails a new entry; unknown envelope keys fail a new entry.
- A new Decision number must exceed the baseline maximum, and an unsubstituted "## Decision NNN" heading fails on every run.
- plan_obligations reports a decision_drafts section for a plan (--plan) or a draft file (--decision-draft) through the shared parser's placeholder grammar, quoting the kind test when kind is missing, and still exits 0.
- docs/contracts/decision-kind.yaml is the single definition of kind; decision-entry.yaml, the planning skill and plan-critique point at it.
- Every VERBATIM entry in execution_steps is present in its target file, with only DATE and the north-star Decision number substituted.
- docs/decisions-index.json carries serves and kind on live enveloped rows only and is fresh; neither reaches a warehouse surface (backfill columns, DecisionPayload, DQ config -- VP 8).
- decision-entry.yaml stays within the 500-effective-line contracts limit, and this plan does not touch config/structural_size_budgets.yaml.
- rec-3260 is closed (VP 11).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Precondition, run once before the first edit -- both prerequisite builds have merged and this branch is rebased:
    the north-star file, its model module, its Decision and an open T4.36 c4 exist; decision-entry.yaml is at or under
    470 effective lines with neither a budgets entry nor a frozen size note; every insertion anchor the VERBATIM entries
    name is still present; both skills still have room for the measured +434 B and +1 B under config/prose_budgets.yaml.
  command: >-
    git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && test -f
    docs/contracts/north-star.yaml && test -f scripts/north_star_models.py && grep -qE "^## Decision [0-9]+: North stars
    are a Tier A file" docs/DECISIONS.md && bin/venv-python -c "import yaml; from scripts.checks.structural._classify
    import effective_lines as e; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml', encoding='utf-8')); t=[i for i in
    d['tier_items'] if i['id']=='T4.36'][0]; assert any(c['id']=='c4' and c.get('status', 'open')=='open' for c in
    t['exit_criteria']), 'T4.36 c4 open'; s=open('docs/contracts/decision-entry.yaml', encoding='utf-8').read(); assert
    e(s) <= 470, e(s); b=yaml.safe_load(open('config/structural_size_budgets.yaml', encoding='utf-8')); k='docs/contracts/decision-entry.yaml';
    assert k not in (b.get('budgets') or {}) and k not in (b.get('budget_notes') or {}), 'size pin or frozen note';
    a=[('docs/contracts/decision-entry.yaml', '  required_fields: [number, significance]'),
    ('docs/contracts/decision-entry.yaml', '  optional_fields: [status, decided_date, amends, supersedes]'),
    ('docs/contracts/decision-entry.yaml', '      justification: A non-empty one-line reason the claimed routing row
    applies.'), ('docs/contracts/plan-obligations.yaml', '    by .claude/skills/planning/SKILL.md.'),
    ('.claude/skills/planning/SKILL.md', 'Three property tests gate the draft'), ('.claude/skills/planning/SKILL.md',
    '   the significance bar on its own terms.'), ('.claude/skills/plan-critique/SKILL.md', 'This is the reviewer-side
    control that does not exist anywhere else in this gate'), ('.claude/skills/plan-critique/SKILL.md', 'A
    claimed-row/body mismatch is REVISE-worthy on its own')]; m=[x for x in a if x[1] not in open(x[0],
    encoding='utf-8').read()]; assert not m, m; import os; pb=yaml.safe_load(open('config/prose_budgets.yaml', encoding='utf-8')); pin=lambda q:
    [v[q] for v in pb.values() if isinstance(v, dict) and q in v][0]; h=[(q, n) for q, n in
    [('.claude/skills/planning/SKILL.md', 434), ('.claude/skills/plan-critique/SKILL.md', 1)] if os.path.getsize(q) + n
    > pin(q)]; assert not h, ('prose headroom', h)" && echo PRECONDITION_OK
  expected: PRECONDITION_OK.
  fix_if: >-
    A missing north-star file, model module, Decision or open criterion means PLAN-north-star-tier-a's build has not
    merged; an effective-line count over 470, a surviving budgets entry or a surviving frozen note means the compaction
    build has not merged; a missing anchor means a prerequisite reworded an insertion point; a prose-headroom failure
    means a sibling plan grew a skill on main. In every case stop and
    tell the coordinator; never raise the pin and never re-place approved text on a guess.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A sequencing precondition on two sibling plans' merges, not a behaviour of this change.
- step: 2
  phase: pre-deploy
  action: >-
    The approved text landed verbatim -- every VERBATIM execution step is present in its target file, with DATE and
    "Decision NNN clause" (the north-star Decision) as the only substitutions.
  command: >-
    bin/venv-python -c "import re, yaml; p=yaml.safe_load(open('docs/plans/PLAN-decision-serves-kind-grammar.yaml',
    encoding='utf-8')); n=re.search(r'^## Decision (\d+): North stars are a Tier A file', open('docs/DECISIONS.md',
    encoding='utf-8').read(), re.M).group(1); d=str(yaml.safe_load(open('docs/contracts/decision-kind.yaml',
    encoding='utf-8'))['amendment_log'][0]['date']); v=[s.split(chr(10), 1) for s in p['execution_steps'] if
    s.startswith('VERBATIM ')]; bad=[h for h, t in v if t.replace('DATE', d).replace('Decision NNN clause', 'Decision
    ' + n + ' clause') not in open(h.split()[1], encoding='utf-8').read()]; assert len(v) == 11 and not bad, (len(v),
    bad); print('VERBATIM_OK', len(v))" && bin/venv-python -c "import yaml;
    m=yaml.safe_load(open('docs/contracts/decision-entry.yaml', encoding='utf-8'))['metadata_envelope']; assert 'kind'
    in m['required_fields'] and 'serves' in m['optional_fields'] and {'closed_key_set', 'number_assignment',
    'draft_check'} <= set(m) and {'kind', 'serves'} <= set(m['field_shapes']), 'envelope keys'" && bin/venv-python -c
    "import yaml; d=yaml.safe_load(open('docs/contracts/decision-kind.yaml', encoding='utf-8')); assert d['values'] ==
    ['direction', 'mechanism'] and d['contract']['evaluator']['check'] == 'validate_decision_entry_conformance', 'kind
    contract'"
  expected: VERBATIM_OK 11 and both assertions pass. Red before (decision-kind.yaml absent).
  fix_if: >-
    A named entry means its text was retyped, rewrapped or placed differently -- copy it from this plan again. Never
    edit the plan's VERBATIM text to match the file: that text is what Benjamin approved.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: >-
    A landing check. The approved text may later be amended lawfully under its own approval, which a standing guard
    would block.
- step: 3
  phase: pre-deploy
  action: >-
    The parser accepts the new shapes, rejects wrong types as malformed, surfaces the row keys in their stated shapes,
    iterates NNN headings, and reads an NNN draft only under placeholder=True.
  command: bin/venv-python -m pytest tests/decisions_md/test_envelope.py -q
  expected: Every node passes. Red before (no row keys, no placeholder iterator, no placeholder parameter).
  fix_if: >-
    A scalar serves or a string kind yielding an envelope means the shape check was not extended; an NNN draft parsing
    without placeholder=True means the default grammar was widened.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: >-
    The graduated step 4, 5 and 6 nodes read the parser's real output, so a parser regression reddens those standing
    guards.
- step: 4
  phase: pre-deploy
  action: The index projects serves and kind on live enveloped rows only, the exact-key-set test accepts them, and the committed index is fresh.
  command: >-
    bin/venv-python -m pytest tests/test_decisions_index_envelope_fields.py tests/test_decisions_index.py -q &&
    bin/venv-python -m scripts.decisions_index --check
  expected: Every node passes and the freshness check exits 0. Red before (module absent; keys absent).
  fix_if: >-
    Keys on a pre-envelope row break the band rule; a test_decisions_index.py key-set failure means its expected set
    was not widened; a freshness failure means the index was not regenerated.
  hermetic: true
  expected_literals: []
  graduation: graduate
  graduation_check_id: decisions-index-serves-kind-band
- step: 5
  phase: pre-deploy
  action: >-
    Each FAIL rule fails closed on a planted defect, each WARN rule warns without failing, the kind vocabulary is read
    from decision-kind.yaml, the committed contracts enforce kind, the untouched legacy module stays green, and the
    check and the two gates that import plan_obligations run in --pre on every input they now read.
  command: >-
    bin/venv-python -m pytest tests/checks/decisions/test_envelope_rules.py
    tests/checks/decisions/test_validate_decision_entry_conformance_serves_kind.py
    tests/checks/decisions/test_validate_decision_entry_conformance.py tests/checks/decisions/test__manifest.py
    tests/checks/roadmap/test__manifest.py tests/checks/verification/test__manifest.py -q
  expected: Every node passes. Red before (modules absent; pre_globs and closure tables lack the new inputs).
  fix_if: >-
    A WARN case appending to failed, or a FAIL case passing, is a rule bug; a legacy-module failure means a new rule
    fires without its contract declaration; a manifest-test failure means a pre_globs widening is missing.
  hermetic: true
  expected_literals: []
  graduation: graduate
  graduation_check_id: decision-entry-serves-kind-enforced
- step: 6
  phase: pre-deploy
  action: The planning-time report finds drafted Decisions in plans and draft files, applies the same rules, and exits 0.
  command: bin/venv-python -m pytest tests/test_plan_decision_drafts.py tests/test_plan_obligations.py -q
