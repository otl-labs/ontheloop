  - step: 4
    phase: pre-deploy
    action: >-
      THE RETIRED CALENDAR-DAY RECORD'S REPLACEMENT. ducklake-partition-docs-calendar-day's contract legs are kept
      word for word; its Decision leg reads 137 and 81 through live_block, so a compacted entry needs only a stub whose
      pointer resolves.
    command: >-
      bin/venv-python -c "import yaml; from scripts.checks.decisions.entry_resolution import live_block;
      T='year(created_timestamp), month(created_timestamp), day(created_timestamp)';
      pb=[yaml.safe_load(open('docs/contracts/'+c+'.yaml', encoding='utf-8'))['governance']['partition_by'] for c in ('ops_recommendations','ops_decisions')];
      assert all(p.startswith('history='+T+';') for p in pb), pb;
      dm=yaml.safe_load(open('docs/contracts/data-modeling-standard.yaml', encoding='utf-8'));
      st=[r['statement'] for r in dm['rules'] if r['id']=='partition-every-table'][0];
      assert 'calendar day' in st and 'year(' in st and 'day-of-month' in st, st;
      dec=open('docs/DECISIONS.md', encoding='utf-8').read(); secs=[live_block(dec, n) for n in (137, 81)];
      assert all(s is None or T in s for s in secs), 'Decision 137/81 annotation missing';
      print('PARTITION_DOCS_CALENDAR_DAY_RESOLVED', ['live' if s else 'compacted' for s in secs])"
    expected: Exit 0 and the marker, with both entries live today.
    expected_literals: [PARTITION_DOCS_CALENDAR_DAY_RESOLVED]
    fix_if: a contract leg fails (the build touched a contract it must not; restore it), or live_block raises (fix entry_resolution.py)
    hermetic: true
    graduation: graduate
    graduation_check_id: ducklake-partition-docs-calendar-day-resolved
  - step: 5
    phase: pre-deploy
    action: >-
      THE RETIRED DECISION 101 READING RECORD'S REPLACEMENT. decision-101-performance-figures-reading's legs are kept
      word for word while 101 is live; once 101 is a stub, only its resolving pointer is asserted.
    command: >-
      bin/venv-python -c "import re,pathlib; from scripts.checks.decisions.entry_resolution import live_block;
      t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      f=lambda s: [m.group(1) for m in re.finditer(r'^## Decision (\d+): (.*)$', t, re.M) if s in m.group(2)];
      b=f('Recursive self-improvement is proven against a judge the loop cannot edit'); assert len(b)==1, ('proof-design Decision absent', b); n=b[0];
      blk=live_block(t, 101); U=r'^> \*\*Update \(\d{4}-\d{2}-\d{2}\):\*\* ';
      got=[] if blk is None else [x for x in blk.splitlines() if re.match(U, x) and 'financial performance of any kind' in x];
      assert blk is None or len(got)==1, ('expected exactly one dated point (d) reading on Decision 101', got); x=got[0] if got else '';
      need=['performance figures', 'financial performance of any kind', 'Decision '+n+' clause 5', 'not published under point (d) as it stands', 'supersede this entry in full'];
      assert blk is None or (re.search(r'rec-\d{4,}', x) and 'rec-X' not in x and 'DATE' not in x and 'cost' not in x.lower()), ('rec id, placeholder or cost wording', x);
      miss=[p for p in need if blk is not None and p not in x]; assert not miss, ('Decision 101 reading text missing', miss);
      print('DEC_101_READING_RESOLVED_OK', n, 'live' if blk is not None else 'compacted')"
    expected: Exit 0 and the marker, with 101 live today.
    expected_literals: [DEC_101_READING_RESOLVED_OK]
    fix_if: a leg fails on the live tree (the build touched Decision 101; restore it), or live_block raises (fix entry_resolution.py)
    hermetic: true
    graduation: graduate
    graduation_check_id: decision-101-performance-figures-reading-resolved
  - step: 6
    phase: pre-deploy
    action: >-
      Retirement sweep (closure obligation for the two Delete rows): both retired records are out of the live loader,
      byte-identical under entries/deprecated/ as git renames, named by no live surface outside docs/plans/ and
      entries/deprecated/, and both replacements are live.
    command: |-
      set -o pipefail; bin/venv-python -c "
      import subprocess
      from scripts.verification_graduation import load_entries
      E='config/agent/verification_registry/entries/'
      R=('ducklake-partition-docs-calendar-day','decision-101-performance-figures-reading')
      live={e['check_id'] for e in load_entries()}
      ren=subprocess.run(['git','diff','-M100%','--diff-filter=R','--name-status','origin/main...HEAD','--',E],capture_output=True,text=True,check=True).stdout
