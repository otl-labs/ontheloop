slug: decouple-decision-prose-pins
intent: >-
  Make the four remaining Decision chain consolidations (81, 144, 101, 213) change data and not tests: every test node
  and graduated record that pins a victim's dated notes or prose resolves the entry through supersession, so a
  compacted stub satisfies it without an edit, and a probe-based guard keeps new pins out (rec-5628, with rec-5630).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-decouple-decision-prose-pins.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5628 (High, L), operator ruling 2026-11-24 21:09Z (decouple in one change before chain 3, rec-5447). Closes no
  roadmap criterion.
closes_criteria: []
cites: [dec:149, dec:235, dec:244, dec:278, dec:279, dec:282]
amends: []
introduces: []
scope:
  - file: scripts/checks/decisions/entry_resolution.py
    action: Create
    purpose: >-
      The supersession resolver tests and records share (production code, so record one-liners can import it; precedent
      scripts/checks/decisions/entry_measure.py, re-exported by tests/fixtures/decision_entry.py).
      EntryResolutionError(ValueError). ResolvedEntry(frozen dataclass: number, block, compacted, successor: int | None,
      hops: tuple[int, ...]). resolve_entry(text, number) -> ResolvedEntry: exactly one section numbered `number`
      (scripts.decisions_md.iter_decision_sections) else EntryResolutionError; compacted is
      scripts.decisions_md.is_compacted_stub(block); for a stub, follow extract_superseded_by hop by hop through `text`
      to the first entry that is not a compacted stub (successor; hops lists every number passed), raising on a missing
      target or a cycle. live_block(text, number, *, naming=()) -> str | None: the block when the entry is live; for a
      compacted stub, raise EntryResolutionError unless its successor resolves and the stub's block names every number
      in `naming` as "Decision N" not followed by a digit (the same test as
      validate_supersession_annotations._is_annotated), then return None. Pure, no I/O, nothing at import. Under 120
      SLOC.
    new_imports: [scripts.decisions_md]
  - file: tests/checks/decisions/test_entry_resolution.py
    action: Create
    purpose: >-
      Mirror test on synthetic logs (numbers 9001 and up): a live entry returns its block; a stub naming the amender
      returns None; a stub not naming it, a dangling pointer, a two-hop chain and a cycle behave as specified; a missing
      or duplicated number raises.
  - file: tests/fixtures/decision_entry.py
    action: Modify
    purpose: Re-export live_block and resolve_entry beside decision_entry, so tests import one fixture module.
  - file: scripts/checks/decisions/consolidation.py
    action: Modify
    purpose: >-
      Add public live_amenders(rows) -> dict[int, set[int]], the existing _amenders rule (live, not superseded_compacted)
      that live_amender_counts already counts, so the guard reuses the threshold rule instead of a copy. No behaviour
      change.
  - file: scripts/checks/decisions/consolidation_inventory/_model.py
    action: Modify
    purpose: >-
      STUB_TEMPLATE_ID "compacted-stub-v2": the stub's Decision line also names its amenders ("... restates its rulings
      and names its amenders: Decision A, Decision B (consolidation inventory probe stub).", the clause omitted when
      there are none), as docs/contracts/decision-compaction.yaml consolidation.point_map and
      validate_supersession_annotations require of a real stub. Measured 2026-11-25: the v1 stub produced 8 false
      breaks out of 17 node breaks on the four chains.
  - file: scripts/checks/decisions/consolidation_inventory/_probe.py
    action: Modify
    purpose: >-
      (a) Stub v2: amenders of each victim are every superseder with an edge to it in
      validate_supersession_annotations.extract_supersession_edges(worktree), read before stubbing. (b) rec-5630: a
      failed decisions_index --write, a missing or unparseable junit report, or a record child whose output does not
      parse is a probe failure (ProbeError, or not_run with the reason on the affected hits), never breaks. (c) A test
      node red only after stubbing is re-run once alone before it is labelled breaks, as records already are. (d)
      Children run with OTL_CONSOLIDATION_PROBE=1 in their environment, so the guard test skips itself inside a probe
      (no nested probe).
    new_imports: [scripts.checks.decisions.validate_supersession_annotations]
  - file: scripts/checks/decisions/consolidation_inventory/_guard.py
    action: Create
    purpose: >-
      chain_victims(root, roots) -> tuple[int, ...]: for each root whose docs/decisions-index.json row is live and not
      superseded_compacted, the root plus consolidation.live_amenders; a compacted root contributes nothing, so each
      chain drops out as it lands with no edit here. prose_pin_breaks(root, roots, *, exclude=()) -> list[str]: run
      inventory(root, victims), drop hits whose locator path is in exclude, probe, raise GuardError when the probe
      failed or a test_node or graduated_record hit is not_run, and return the sorted locators whose probe is breaks
      (red_before hits, such as known_red records, are not breaks). Under 120 SLOC.
    new_imports: [scripts.checks.decisions.consolidation]
  - file: scripts/checks/decisions/consolidation_inventory/__init__.py
    action: Modify
    purpose: Re-export chain_victims, prose_pin_breaks and GuardError.
  - file: tests/checks/decisions/consolidation_inventory/test__guard.py
    action: Create
    purpose: >-
      Mirror test on a tiny git repo (the test__probe.py fixture builder): a planted test that pins a victim's dated
      note is returned; the same test rewritten with live_block is not; a compacted root contributes no victims; a
      crashed probe raises GuardError.
  - file: tests/checks/decisions/consolidation_inventory/test__probe.py
    action: Modify
