    expected: Prints RETIREMENT_PROSE_PINS_OK.
    expected_literals: [RETIREMENT_PROSE_PINS_OK]
    fix_if: >-
      A record is still live, changed, or not a 100% rename: redo the move as a pure git mv. A live surface names it:
      repoint or remove that reference. A replacement is missing: graduate steps 4 and 5.
