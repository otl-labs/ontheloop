      Add test_crashed_runs_never_label_breaks (rec-5630's acceptance) and test_stub_names_every_amender_edge; the
      template-id literal moves from compacted-stub-v1 to v2 (line 98).
  - file: tests/checks/decisions/consolidation_inventory/test__model.py
