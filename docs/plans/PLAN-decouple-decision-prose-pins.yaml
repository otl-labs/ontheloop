      tests/checks/contracts/test_telemetry_verification_contracts.py::test_decision_210_coverage_names_the_discharged_residual -q
      && ! grep -rn "_COMPACTED" tests/ --include=*.py
    expected: 9 passed, then no grep output
    fix_if: a node fails on the live tree (the conversion changed a live assertion), or a _COMPACTED set survives
    hermetic: false
    graduation: waive
