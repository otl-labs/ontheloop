    command: >-
      test -z "$(git status --porcelain)" && s=$(date +%s) &&
      bin/venv-python -m pytest tests/checks/decisions/test_no_prose_pins_on_consolidation_victims.py::test_named_chain_victims_break_no_test_or_record -q &&
