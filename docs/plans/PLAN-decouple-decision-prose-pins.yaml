      and tests/checks/contracts/test_ops_rule_source_records.py::test_decision_annotations, each (210, rec-5447).
      test_named_chain_victims_break_no_test_or_record: skips when OTL_CONSOLIDATION_PROBE == "1" or every root is
      compacted; else breaks = prose_pin_breaks(ROOT, ROOTS, exclude=(this file,)) and asserts breaks minus HANDED is
      empty (the message names each locator and live_block as the fix) and that every HANDED node is in breaks with
      its victim in chain_victims (a stale entry, including one whose victim has compacted, fails, so the owning chain
      deletes it). The file reads ROOT / "docs/DECISIONS.md" as a literal path, so the fast tier's data edge selects it
      when the log changes. Measured cost: about 32 s.
