    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads the live log at HEAD in a worktree (a moment claim); VP 1-2 hold the behaviour.
  - step: 8
    phase: pre-deploy
    action: The touched suites pass and every module stays under its SLOC budget.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions tests/checks/contracts/test_write_time_enforcement_decision.py
      tests/checks/contracts/test_telemetry_verification_contracts.py tests/checks/contracts/test_ops_rule_source_records.py -q &&
      bin/venv-python -c "from scripts.checks.sloc.sloc_limits import validate_sloc_limits as v; f=[]; v(f); print('sloc_failed', f); raise SystemExit(1 if f else 0)"
    expected: pytest exits 0; prints sloc_failed []
    fix_if: a node fails, or a module crosses its budget (split inside the package, never a raise, Decision 128)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-directory re-run (hermetic rule (v)); VP 1 graduates the new behaviour.
  - step: 9
    phase: pre-deploy
    action: Full presubmit tier, per handoff_policy.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Run on the committed clean tree, backgrounded with a 2 h limit from the top-level session (a timeout is a block, never a pass). Exit 0, then --verify-head attests HEAD's tree.
    fix_if: Fix the named check's finding in the changed files only; a sandbox-only failure outside the scope defers to PR CI per the standing ruling.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: scripts.validate is the aggregate presubmit entrypoint; graduating it would recurse the harness into its own registry.
  - step: 10
    phase: post-deploy
    action: rec-5628 and rec-5630 read back closed after the squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5628', 'rec-5630']); print(sorted((r['id'], r['status']) for r in rows))"
    expected: both closed
    fix_if: one is open; the Resolves trailer or the closure job did not run, or its acceptance failed
    hermetic: false
    graduation: not-applicable
