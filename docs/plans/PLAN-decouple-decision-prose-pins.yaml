      tests/checks/decisions/test_secret_parameters_decision.py::test_decision_entry_and_annotations
      tests/checks/decisions/test_owner_provisioning_decision.py::test_decision_entry_and_annotations
      tests/checks/decisions/test_telemetry_column_additions_decision.py::test_decision_entry_and_annotations
      tests/checks/contracts/test_write_time_enforcement_decision.py::test_decision_entry_and_victim_annotation
      tests/checks/contracts/test_write_time_enforcement_decision.py::test_dependency_lookup_names_its_amending_decision
