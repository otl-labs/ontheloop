    expected: >-
      Line 1 "Reviewer digest: <a> actionable of <t> resource change(s), <b> of 32768 bytes."; line 2 "Padded ci_policies
      digest: <n> of <budget> budget bytes" with n at most the budget; line 3 "Reviewer digest OPAQUE" (the sibling's
