schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "deferred-policy-digest"
intent: >-
  When an IAM policy's content is unknown at plan time because its aws_iam_policy_document is read at apply, the
  names-only merge-time plan digest stops printing an opaque `policy=(known after apply ...)` line. Instead it rebuilds
  the document from the deferred read's planned arguments and shows the same names-only delta it shows for any known
  policy. Every path that reaches the reviewer (push apply of the saved PR plan, acknowledge-and-retry, Reconcile) gets
  it, because all of them run this one module. That removes the ~1-in-6 reviewer refusal behind rec-4718's red latch.
  Executes rec-4741.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-deferred-policy-digest.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Follow-on to
  PLAN-pr-plan-opaque-iam-policy-check (Benjamin 2026-10-30, fork 6 A) and the rec-4718 RCA. Closes no roadmap criterion.
closes_criteria: []
scope:
  - file: scripts/ci/terraform_plan_policy_rebuild.py
    action: Create
    purpose: >-
      Stdlib-only, pure functions. Imports only the stdlib, scripts.ci.terraform_hcl_lexer and scripts.terraform_apply_guard
      (iter_resource_changes), by absolute import (the #1736 `_ROOT` pattern); it never imports
      scripts.ci.terraform_plan_digest (the digest imports it, and review.sh runs the digest by path as __main__, so a
      two-way import breaks). strip_instance_keys moves here unchanged and the digest re-exports it. (1)
      load_policy_links(paths) lexes the .tf files given with --literals-from (a directory means its *.tf, non-recursive,
      as load_literals) with terraform_hcl_lexer.lex and returns PolicyLinks: policy -> document for each top-level
      `resource "<T>" "<N>"` block whose `policy` attribute is exactly `data.aws_iam_policy_document.<D>.json` or
      `.minified_json` and nothing else up to the end of the line; document -> ordered sources for each
      `data "aws_iam_policy_document" "<D>"` block whose `source_policy_documents` is exactly a list literal of such
      references. It returns no links at all when any path given is, or any directory given contains, a Terraform
      override file (override.tf, *_override.tf, override.tf.json, *_override.tf.json), because an override can replace
      the linked attribute; a policy or document address declared by more than one block contributes no link. It never
      raises: like load_literals it skips a file on OSError and decodes with errors="replace", and a file the lexer
      refuses (LexRefusal) or any other parse problem contributes nothing. (2) rebuild_policy(plan, entry, links,
      policy_refs) never raises (any malformed plan shape is Incomplete) and returns Rebuilt(document, statements,
      unknown_elements) or Incomplete(reason). policy_refs is the entry's configuration `policy` references, passed in
      by the digest from its existing configuration walk (_config_resources stays in the digest; nothing else moves). It
      links the policy entry to its document only through PolicyLinks AND policy_refs (both must name the same
      document); finds that document's single planned `read` entry in
      resource_changes (any non-empty action_reason); maps each `change.after.statement` block to an IAM statement (sid
      -> Sid when non-empty; effect null -> Allow; actions, not_actions, resources, not_resources; principals and
      not_principals -> {type: identifiers}, a type "*" with identifiers ["*"] -> "*"; condition -> {test: {variable:
      values}}, same test and variable merged); merges sources first in list order (a known element is parsed as policy
      JSON; an unknown element resolves only through the PolicyLinks source list to a deferred document whose own rebuild
      is Rebuilt, depth at most 3, no cycles), then own statements (a non-empty Sid replaces the same-Sid sourced
      statement in place, otherwise appended). Unknown elements (after_unknown true at a list index) become per-position
      sentinel strings ("\x00unknown:" plus document, statement index, field and element index) that sort as strings,
      survive json.dumps in the Sid fingerprint, never equal a value, gate to <non-literal> if ever rendered as an action,
      and are counted. Incomplete reasons are exactly this closed list: "malformed plan entry" (any entry, change, after
      or after_unknown of an unexpected shape), "policy is not
      exactly the document's json", "several instances", "statement list unknown", "statement field unknown" (a whole
      statement, a Sid, an Effect, a whole list field, or a principal type or condition test or variable unknown),
      "unmodelled argument" (override_policy_documents, source_json or override_json non-null and non-empty, or unknown),
      "sourced document not resolvable", "current policy unparsed". (3) canonical(statements) -> statements with every
      list sorted and deduplicated, a single string as a one-element list, Effect defaulted to Allow, Principal "*" equal
      to {"*": ["*"]}; used on the rebuilt path for both sides of the comparison only. Never prints, logs or raises with a
      plan value. rebuild_policy is the public "renders completely" predicate a later OPAQUE narrowing may call (fork 3 A).
  - file: scripts/ci/terraform_plan_digest.py
    action: Modify
    purpose: >-
      Imports strip_instance_keys and the rebuild functions from scripts.ci.terraform_plan_policy_rebuild and re-exports
      strip_instance_keys (tests import it from here). main() computes links = load_policy_links(args.literals_from) once,
      right after load_literals in every mode (digest, --fit-report, --fit-check), or None when no --literals-from is
      given (so a call without source attempts no rebuild); under --fit-check that call sits
      inside the sibling's guarded region (so nothing it does can put a path or traceback in the public trusted-job log),
      and the other modes keep their existing handling; links is passed to build_digest and fit_report; build_digest, fit_report and
      _Parts gain a keyword `links` defaulting to None, and None attempts no rebuild (every opaque policy line stays
      today's). With links, a
      policy-type entry whose after_unknown.policy is true and whose configuration references name a document with a
      planned read is passed to rebuild_policy with those references (from _config_resources, as _deferred_note reads
      them): Rebuilt prints ` policy: rebuilt from deferred read <document> (<n>
      statements, <u> elements unknown until apply): <delta>` (singular "statement" / "element" when the count is 1),
      where <delta> is the existing renderer's parts over canonical(before statements) and canonical(rebuilt statements)
      joined by "; ", or "no action, Sid, or count delta" when there are none (a create has no before statements);
      Incomplete prints today's opaque line with "; not rendered: <reason>" appended before the closing parenthesis.
      _deferred_context collects reads with action_reason read_because_dependency_pending or read_because_config_unknown
      (today only the first), with or without links, and the generic note names the reasons present, sorted (unchanged
      text when only the first is present). REVIEWER_PREAMBLE gains, after its last sentence: "A policy shown as rebuilt from a deferred read was
      computed at plan time from the document's planned arguments; elements counted as unknown are decided at apply."
      The module docstring's description of the IAM renderer names the rebuilt line and the exact-link rule. Known-policy
      lines, the sibling's opaque_entries, OPAQUE fit line and --fit-check exit codes are unchanged. Stays under 500 SLOC
      (400 at b2e4a548, plus the sibling's predicate, minus strip_instance_keys); if a crossing is projected, move the
      IAM renderer block (_statements through _render_policy, with the _gate and NON_LITERAL it depends on) into the new
      module and re-export it here (Decision 128 facade), never raise a budget.
  - file: .github/CODEOWNERS
    action: Modify
    purpose: >-
      One line `/scripts/ci/terraform_plan_policy_rebuild.py @benjamin-blake` in the rec-4637 / Decision 238 block, after
      the terraform_plan_digest.py line (validate_trusted_plan_environment predicate h requires every module in the
      trusted job's import closure to be code-owned). No other line changes.
  - file: tests/test_terraform_plan_digest_deferred_statements.py
    action: Create
    purpose: >-
      rec-4741's acceptance file. The nodes VP 2 names, over the fixtures below and in-test variants built from them by
      deep copy (the harmful statement, a transform expression, an unknown statement list). The harmful variant appends
      one statement {sid "AdminEscalation", effect Allow, actions ["iam:*"], resources ["*"]} to
