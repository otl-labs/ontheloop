      after the merge; method list_workflow_jobs for that run -> its job, whose conclusion must be success; then save the
      log text (not the JSON wrapper) of mcp__github__get_job_logs for that job, return_content true and tail_lines large
      enough to hold the whole job, to $JOB_LOG. The command reads only that file.
    command: >-
      test -s "$JOB_LOG" && grep -Eq 'SMOKE outcome=(proceed|revise)$' "$JOB_LOG" && ! grep -q 'SENTINEL-' "$JOB_LOG"
      && ! grep -q 'SMOKE sentinel leaked' "$JOB_LOG" && echo SMOKE_OK
