    Names only (Decision 238 cl.4): Sids and actions print only as public .tf literals, Resource, Condition and
    Principal only as counts; no plan value, fingerprint or after string reaches stdout, stderr, an exception or a log.
  - No change to review.sh, its prompt, the apply guard, the sibling's OPAQUE predicate, any contract text or any Decision text.
  - No new dependency; stdlib only (the digest runs under the runner's system python3 and python3 -I).
  - Fixtures carry no real account id, ARN, key or hostname; account text is a non-numeric placeholder (Decision 101).
  - Complete or nothing; never a partial render. The Incomplete reason list is closed; adding a reason needs a plan amendment.
  - No budget raise (Decision 128); decompose as the digest scope row says if needed.
  - No rescue agents or workaround loops (Decision 55); a missed replay bar returns to planning, never a re-run.
