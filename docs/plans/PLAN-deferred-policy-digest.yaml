execution_steps:
  - "START CONDITION (VP 1): the sibling build is merged; rebase on origin/main. Otherwise stop before any edit."
  - >-
    Fixtures. In a scratch directory (never in the repo or terraform/personal), write a probe root: terraform with
    hashicorp/aws ~> 5.0, provider region eu-west-2 with skip_credentials_validation, skip_requesting_account_id and
    skip_metadata_api_check, credentials only from AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY env with dummy values (so no
    key text lands in any file), terraform_data stand-ins for the managed resources the documents reference, and the
    documents and role policies the scope rows name (statements copied from terraform/personal at the base commit,
    managed references re-pointed at the stand-in's `.id` as probe/main.tf does, account text a non-numeric
    placeholder). `terraform apply` once (local state only; terraform_data and aws_iam_policy_document make no AWS call;
    use -target to skip the role policies), change the stand-in in place, `terraform plan -out` and `terraform show
    -json`. Trim to format_version, terraform_version, resource_changes and configuration (drop provider_config). For
    each role-policy entry (the planned create of a targeted-out resource), convert it to the incident's in-place update:
    actions ["update"]; before is a copy of the planned after's known attributes plus id "<role>:<name>" (the
    provider's id form) and policy set to the document's json from prior_state (what the provider wrote); after gains the
    same id and keeps policy null; after_unknown is exactly {"policy": true}; so the line reads changed=[policy] as the
    incident's does. The unknown-element case stays a create. Save the probe HCL as
    source.tf.txt. Record the recipe in the test module docstring. Probe evidence:
    /mnt/project-files/ci-policy-plan-time/deferred-policy-digest/probe/.
  - "Write scripts/ci/terraform_plan_policy_rebuild.py and the digest changes as scoped; add the CODEOWNERS line."
  - "Write tests/test_terraform_plan_digest_deferred_statements.py (VP 2 node names verbatim), extend the sentinel fixture and its test, and update the sibling's expectations only as scoped."
  - >-
    Run VP 2-8, then VP 9 (full tier) to completion; commit and push; open the build PR (body: Resolves: rec-4741; the
    VP 7 lines; the census line) and drive CI green by event-driven wake (never polled).
  - >-
    Replay (VP 10-11), at the CI-green head, writing only under
    /mnt/project-files/ci-policy-plan-time/deferred-policy-digest/replay/ (never in the repo). The build writes
    build_digests.py and sequential_replay.py there (they do not exist yet); both run by path, so each puts the repo
    root on sys.path itself. build_digests.py imports
    the branch's modules and writes three digests from the RCA's replay/digest-red.txt: incident-rebuilt.txt (line 1 is
    the new REVIEWER_PREAMBLE; lines 12 and 19 are replaced by the lines build_digest prints, with links, for the
    ci_policies fixture's aws_iam_role_policy.github_ci_branch and data.aws_iam_policy_document.github_ci_branch entries);
    control-rebuilt.txt (the same, from harmful_ci_policies_plan() with literals and links from
    harmful_ci_policies_source(), so iam:* and AdminEscalation print as literals); control-known.txt (new preamble; line
    12 is the line build_digest prints, with the same harmful literals, for that role policy as a known update: before.policy
    the fixture's provider-JSON before policy, after.policy that same JSON with {"Sid": "AdminEscalation", "Effect":
    "Allow", "Action": "iam:*", "Resource": "*"} appended, after_unknown {}; line 19 removed, and line 2's summary and
    the read-by-type tail line regenerated as the digest prints them with that read not deferred: 16 actionable, 8
    read, aws_iam_policy_document x8, as the RCA's digest-fixed.txt did). Before writing any
    digest, build_digests.py asserts that the known line's text after "policy: " and the rebuilt line's text after the
    provenance clause's "): " both equal "Allow +[iam:*] -[]; Sids +[AdminEscalation] -[]", so the pair differs only in
    the provenance clause and the deferred-read line, and refuses to write the digests otherwise. Every replaced line
    comes from the code, never typed by hand. sequential_replay.py runs `claude -p --model claude-sonnet-4-6 --output-format json --tools ""
    --strict-mcp-config --max-turns 5 "$PROMPT"` from a fresh empty temp directory with the digest on stdin, PROMPT read
    from review.sh's PROMPT= line with ${CONTEXT_DESCRIPTION} set to "the sandbox auto-apply pipeline", and classifies
    with scripts/ci/review_verdict.py. Incident set: one run at a time; first REVISE -> FAIL; 25 PROCEED -> PASS;
    STARVED runs are not counted and more than 3 -> INCONCLUSIVE. Control: batches of 5 pairs (one known run and one
    rebuilt run each); a STARVED run is re-run in place, so a pair counts only once both of its runs have a PROCEED or
    REVISE verdict, and more than 3 STARVED runs in the set -> INCONCLUSIVE. After n counted pairs with m = 25 - n
    remaining, PASS when rebuilt_revise >= known_revise + m - 3, FAIL when rebuilt_revise + m < known_revise - 3, else
    continue; at 25 pairs PASS iff rebuilt_revise >= known_revise - 3. Save per-run verdicts and REVISE reasons
    (names-only text) to the results files; post the two summary lines on the PR with the sha256 of build_digests.py,
    sequential_replay.py and the three digests (the judge code lives outside the repo, so the hashes tie the posted
    result to the exact inputs). Freshness: if any later commit changes
    a byte of the three rendered digests (re-run build_digests.py and compare), re-run VP 10-11 at the new head; that is
    new evidence for new code, never a re-roll of a failed set.
  - >-
    Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state; parent
    validator evidence (VP 9 full-tier exit 0 plus bin/venv-python -m scripts.checks.validation_result --verify-head for
    the pushed HEAD); structured postflight evidence (write the scripts.session.postflight_evidence.CATEGORIES JSON in the
    scratchpad, then bin/venv-python -m scripts.session.postflight --evidence <file>); the real outcome - push, build PR,
    CI green by event-driven wake (never polled), VP 10-11 summary lines on the PR, merge SHA.
  - >-
    Code review (independent), then ask Benjamin for his word on the final diff (code-owned digest files and CODEOWNERS).
    Merge only on code review PROCEED, every check finished green (get_check_runs), VP 10-11 PASS at the current digest
    bytes, a coordinator-confirmed merge window and his word; squash-merge with the PR body (carrying Resolves:
    rec-4741) as the commit message.
  - "Post-merge: VP 12 (ask Benjamin to dispatch the smoke), VP 13."
  - 'Report: what was implemented, verification results, replay summary lines, what stays unproven.'
rollback: >-
  Revert the build PR: the digest falls back to today's opaque line (links unused), nothing else depends on the new
  module. No state, IAM or deploy change to undo.
