      "tests/test_terraform_plan_digest_deferred_statements.py::test_incomplete_reasons_print_the_fallback_line"
      "tests/test_terraform_plan_digest_deferred_statements.py::test_transformed_policy_expression_is_not_rendered"
      "tests/test_terraform_plan_digest_deferred_statements.py::test_lex_refusal_contributes_no_link"
      "tests/test_terraform_plan_digest_deferred_statements.py::test_override_file_disables_links"
      "tests/test_terraform_plan_digest_deferred_statements.py::test_no_links_keeps_todays_lines"
      "tests/test_terraform_plan_digest_deferred_statements.py::test_links_never_change_known_policy_lines"
      "tests/test_terraform_plan_digest_deferred_statements.py::test_config_unknown_read_is_named_in_the_note"
      "tests/test_terraform_plan_digest_deferred_statements.py::test_preamble_ends_with_the_approved_sentence"
      "tests/test_terraform_plan_digest_deferred_statements.py::test_sentinel_values_never_print"
      "tests/test_terraform_plan_digest_deferred_statements.py::test_real_scale_plan_stays_within_the_byte_budget_and_renders_every_policy"
      "tests/test_terraform_plan_digest_deferred_statements.py::test_cli_reads_links_from_literals_from"
    expected: >-
      exit 0; every node passes (test_incomplete_reasons_print_the_fallback_line is parametrized over all eight reasons
      and asserts each full line; test_preamble_ends_with_the_approved_sentence asserts REVIEWER_PREAMBLE ends with "A
      policy shown as rebuilt from a deferred read was computed at plan time from the document's planned arguments;
      elements counted as unknown are decided at apply." verbatim). Each fails before the change (the file does not
      exist).
    fix_if: >-
      Fix the module, never the assertion. A rebuilt-equals-provider failure means the block mapping or merge order is
