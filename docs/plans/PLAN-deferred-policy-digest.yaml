      "tests/test_terraform_plan_digest_deferred_statements.py::test_dynamic_statements_are_included"
      "tests/test_terraform_plan_digest_deferred_statements.py::test_deferred_source_chain_is_rebuilt"
      "tests/test_terraform_plan_digest_deferred_statements.py::test_own_statement_replaces_sourced_statement_with_same_sid"
