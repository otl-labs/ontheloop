    fix_if: >-
      OVERFLOW on line 1 or 3, or a DigestOverflow traceback -- the rendering is too long; stop and report. Line 3 FITS
      means the sibling predicate changed under this plan; stop and report.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Evidence for the PR body; the byte-budget assertion itself is the graduated node in step 2.
  - step: 8
    phase: pre-deploy
    action: Census check on the bundled rec (project rule) -- rec-4741's acceptance classifies probeable on the finished tree.
    command: >-
