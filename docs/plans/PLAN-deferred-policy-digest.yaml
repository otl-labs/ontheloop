    phase: pre-deploy
    action: >-
      START CONDITION -- the sibling PR-time opaque check build (PLAN-pr-plan-opaque-iam-policy-check) is merged on main
      (#1736 already is, b2e4a548).
    command: >-
      git fetch origin main -q && git show origin/main:scripts/ci/terraform_plan_digest.py | grep -c "def opaque_entries"
    expected: Prints 1.
    fix_if: >-
      0 -- the sibling build has not merged; stop before any edit and tell the coordinator (this build edits the same
      file and must land second).
    hermetic: false
    graduation: not-applicable
  - step: 2
