      ["iam:*"] resources = ["*"] }` block to that document in its literal source text, so "iam:*" and "AdminEscalation"
      gate as literals (as they would on a real PR adding the grant); it exports harmful_ci_policies_plan() and
      harmful_ci_policies_source() for the replay. test_no_links_keeps_todays_lines asserts that build_digest of the
      ci_policies fixture without links prints, for each CI role policy, exactly today's
      ` policy=(known after apply; deferred data read: data.aws_iam_policy_document.<name>)`.
      test_real_scale_plan_stays_within_the_byte_budget_and_renders_every_policy asserts, for
      padded_ci_policies_plan() with its literals and links, that build_digest returns without DigestOverflow, every CI
      role policy line is a rebuilt line, and fit_report's word is OPAQUE (the sibling's unchanged predicate, fork 3 A),
      never OVERFLOW. Exports the helpers VP 7 and the replay import: padded_ci_policies_plan() (the ci_policies fixture
      plus inert entries to #1692's scale, 146 resource changes), ci_policies_literals() (load_literals of the fixture's
      source.tf.txt) and ci_policies_links() (load_policy_links of the same file). Module docstring records the
      fixture-generation recipe (execution step 2).
  - file: tests/fixtures/terraform_plan_digest_deferred/ci_policies/plan.json
    action: Create
    purpose: >-
      Real `terraform show -json` output (execution step 2) trimmed to format_version, terraform_version,
      resource_changes and configuration: github_ci_branch, github_ci_planner and a third CI-shaped document, their
      aws_iam_role_policy updates, ci_full_refresh_read (deferred, sourcing ci_ssm_refresh_read) and
      ci_ssm_refresh_read (read at plan time), one document with a dynamic statement block, all deferred by an in-place
      update of a terraform_data stand-in for aws_s3_bucket.data_lake (the default_tags residual); references re-pointed
      at a stand-in use its `.id`, as probe/main.tf does. Placeholder account text, never 12 digits; no key material
      anywhere.
  - file: tests/fixtures/terraform_plan_digest_deferred/ci_policies/source.tf.txt
    action: Create
    purpose: >-
      The probe root's HCL for that plan (kept as .txt so no repo .tf scanner reads it), used as --literals-from and for
      PolicyLinks. Statements copied from terraform/personal at the build's base commit with managed references
      re-pointed at the stand-ins.
  - file: tests/fixtures/terraform_plan_digest_deferred/unknown_and_fallbacks/plan.json
    action: Create
    purpose: >-
      Real `terraform show -json` output, same trimming: a role policy CREATE whose document has one Resource element
      naming a resource created in the same plan (read_because_config_unknown); a document whose dynamic for_each is over
      an unknown value (statement list unknown); a document with override_policy_documents; a policy written as
      replace(data.aws_iam_policy_document.x.json, ...); a document whose deferred sourced document is itself not
