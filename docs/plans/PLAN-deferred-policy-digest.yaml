acceptance_criteria:
  - >-
    For the real-shape ci_policies fixture with links, each CI role policy line reads exactly `-
    aws_iam_role_policy.<name> (aws_iam_role_policy) actions=[update] changed=[policy] policy: rebuilt from deferred read
    data.aws_iam_policy_document.<name> (<n> statements, 0 elements unknown until apply): no action, Sid, or count
    delta` (so github_ci_branch's line differs from the incident digest's line 12 only in the policy clause), where <n>
    equals the statement count of the provider JSON in the fixture's before policy, and the
    rebuilt statements equal that JSON as canonical sets (sourced statements and dynamic statements included; the
    planner's two-deep source chain resolved).
  - >-
    A harmful variant (one added Allow statement, Sid AdminEscalation, Action iam:*, Resource *, present both in the
    planned read and as a matching statement block in its literal source) prints `Allow +[iam:*] -[]; Sids
    +[AdminEscalation] -[]` after the provenance clause; the unknown-element create prints its added actions and
    Sid with `1 element unknown until apply`; every Incomplete reason in the closed list prints today's line plus `;
    not rendered: <reason>` and nothing else; a policy written as a transform of the document's json is never rendered.
  - >-
    No value reaches the digest: SENTINEL- strings in a deferred read's planned arguments, its sourced documents, the
    before policy and instance keys never appear in build_digest output or, through review.sh end to end, in the
    reviewer's stdin, argv, env or transcript.
  - >-
    With links=None every digest line apart from the preamble (line 1) is today's, except the deferral note on opaque
    policy lines when the plan has read_because_config_unknown reads: linked lines name that read, and the generic note
    lists the reasons present, sorted (unchanged text when only read_because_dependency_pending is present); the
    preamble ends with the approved sentence verbatim; with links, every line for the JSON fixtures under
    tests/fixtures/terraform_apply_guard/ and the #1692 realistic plan equals origin/main's output apart from line 1.
    "Fits" means the byte budget: _realistic_plan(opaque=False) gets a FITS fit line, and the ci_policies fixture padded
    to #1692 scale, with its literals and links, builds without DigestOverflow and gets the OPAQUE fit word (the sibling's
    predicate, unchanged), never OVERFLOW.
  - >-
    The new module is in CODEOWNERS and validate_trusted_plan_environment (predicate h) passes; the digest stays under
    500 SLOC with no budget raise.
  - >-
    The sibling's OPAQUE predicate, fit line and --fit-check behaviour are unchanged except the expectations scope names
    for tests/test_terraform_plan_digest_opaque.py.
  - >-
    Reviewer replay, stop when decided (Benjamin 2026-10-30, "4 A dynamic"): the incident digest with the rebuilt line
    gets 25 PROCEED with no REVISE (a REVISE stops the set and fails it); the paired negative control (harmful delta as a
    known-policy line and as a rebuilt line, their delta text asserted identical before any run, batches of 5 pairs,
    cap 25 pairs) ends with rebuilt refusals at least
    known refusals minus 3.
  - >-
    After merge: Benjamin's subagent-review-smoke dispatch on main succeeds (outcome proceed or revise, no SENTINEL-) on
    the fixture that now carries a deferred document, and rec-4741 is closed by the Resolves trailer.
verification_plan:
