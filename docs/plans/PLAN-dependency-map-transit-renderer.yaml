  purpose: 'Class D provisional_v0 contract (STEP 1): the semantic model (line meaning OPEN with three starting points), three firm rules with Decision 181 coverage, revisable design intent, placeholder brand tokens with provenance, the T2.53 boundary and the rendered-output rule; evaluator agent_surface docs/ROADMAP-SEMANTO.yaml; re-ratification due 2027-01-01. 191 effective lines of the contracts class''s 500.'
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: 'The visual-grammar route (topic equals subject) and one amendment_log row, paid for by compacting the seven 2026-08 amendment rows to three (STEP 2): net zero effective lines (498 of 500 at drafting).'
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: 'New deferred_post_mvp T4.35 immediately before the T5 section, and a dated inherits-from bracket on T2.53 c4 (STEP 3): +50/-1 lines of the 10,000-line ceiling.'
- file: docs/ROADMAP-SEMANTO.yaml
  action: Modify
  purpose: The four rec-4563 pointer sites only (agent_instructions, S1.10 c2, S1.11 c3, S1.12 c1) repointed to docs/contracts/visual-grammar.yaml, with S1.10 c2 reworded to the firm-rules form (STEP 4).
- file: .pre-commit-config.yaml
  action: Modify
  purpose: One block-rendered-maps hook (language fail) in the existing local repo block (STEP 5).
- file: .gitignore
  action: Modify
  purpose: Ignore the render folder /.ontheloop/maps/ and the reserved filename shape *.otl-map.* (STEP 5).
bundled_recommendations:
- rec-4563
followon_recs:
- rec-4570
- rec-4571
infrastructure_dependencies:
- 'LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition (scout r1 WARN). compute_affected_artifacts(<this plan''s scope>) returns {''data-pipeline'': [''docs/ROADMAP-PLATFORM.yaml'']}: the live roadmap is a packaged asset of the active data-pipeline artifact. No build, deploy or smoke test is owed: the change to that asset is data only (a new deferred item and a dated bracket; no packaged code), its sole runtime reader puts the raw text into a prompt behind a disabled schedule (T4.12), and the asset refreshes with the artifact''s next governed deploy. No other scope file is Lambda-packaged and no .tf file is in scope. Standing gap: rec-3846 (no new rec). Precedent: PLAN-product-surface-and-open-core.'
acceptance_criteria:
- 'docs/contracts/visual-grammar.yaml is a Class D contract (subject visual-grammar, evaluator agent_surface docs/ROADMAP-SEMANTO.yaml that resolves; validate_contract_drift passes) whose durable structure -- the three firm rules with text and coverage, the rendered-output rule and the scope with the T2.53 boundary -- is pinned by VP 1, and whose transitional state is checked once by VP 4: status provisional_v0; firm-rule ids exactly the three; the semantic model (station, line with its meaning OPEN and three starting points, interchange, transfer, gate; six station states in precedence order; four provisional edge states; five zoom levels); every brand token a placeholder with provenance (typeface.display Special Elite for headings and the wordmark only; typeface.companion null; the palette entirely open) (VP 1, VP 4, VP 9).'
- Its re-ratification trigger parses in the evaluated vocabulary and comes due exactly on 2027-01-01 under the repository's own evaluator (not due 2026-12-31); its surfacing gap names rec-4570 and its re-ratification notes name the evaluator to revisit (VP 4).
- 'Rendered maps cannot be committed: .gitignore ignores .ontheloop/maps/ and *.otl-map.* but not the contract, docs/otl-map.md or marketing/logo.svg; the block-rendered-maps hook (language fail, files equal to the contract''s never_commit_regex, no ''Decision 101'' text) reports Failed on a force-added folder file and a render-shaped file and passes an ordinary svg; no tracked file matches (VP 2, VP 3).'
- file-router.yaml carries the visual-grammar route and this plan's amendment row, stays at or under 500 effective lines, and keeps every date and citation token of the compacted rows (VP 7, VP 8).
- T4.35 exists deferred_post_mvp in T4 with depends_on [T4.23, T4.24], structured open criteria c1-c7 (Decision 136; c7 records the brand-look question against rec-4557 without deciding it) free of roadmap-liveness blocking phrases, CD.42 and Decisions 93, 101, 127, 197, 232 and 233 related, a note declining the T4.33 -> T4.35 edge, and no live dependent (Decision 93); T2.53 c4 carries the dated inherits-from bracket (VP 6).
- ROADMAP-SEMANTO.yaml names docs/contracts/visual-grammar.yaml at exactly the four pointer sites and rec-4563 nowhere, S1.10 c2 reads 'meet its firm rules', every semanto VP 2 pinned phrase outside the pointers survives, and no deny-list token appears in the Semanto roadmap, the contract or T4.35 (VP 5).
- No graduated shard guarding a scope file turns newly red (VP 10), and the full tier passes on the committed, rebased tree with HEAD attested (VP 13).
- 'rec-4570 (High) and rec-4571 are open and rec-4565 carries the folded shard (VP 11); rec-4563''s re-authored acceptance buckets probeable and holds before the PR (VP 12), and the squash commit''s Resolves: rec-4563 trailer closes it (VP 14).'
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'DURABLE STRUCTURE ONLY (the standing shard): the contract is a Class D contract with subject visual-grammar; it carries the three firm rules, each with its text and coverage; the rendered-output rule (the .ontheloop/maps/ folder, the <name>.otl-map.<ext> shape and a never-commit pattern that catches both); and the scope and the T2.53 boundary (every human-facing visual; the dashboard inherits direction, tokens and firm rules and adds no colour vocabulary). It pins no design-intent vocabulary the operator and illustrator may revise by trial and error -- element, state, zoom and token names live in VP 4 -- and nothing a planned change ends.'
  command: |-
    bin/venv-python -c "
    import re, yaml
    from pathlib import Path
    from scripts.contracts import load_contract_meta
    p = Path('docs/contracts/visual-grammar.yaml')
    assert p.is_file(), 'docs/contracts/visual-grammar.yaml is absent'
    m = load_contract_meta(p)
    d = yaml.safe_load(p.read_text(encoding='utf-8'))
    assert m.class_.value == 'D' and m.subject == 'visual-grammar', (m.class_, m.subject)
    rules = {r['id']: r for r in d['firm_rules']}
    need = {'no-meaning-by-colour-alone': 'survives without colour', 'loop-never-bisected': 'symmetrically intersected', 'no-transit-operator-named': 'transit operator'}
    assert set(need) <= set(rules), sorted(rules)
    assert all(rules[k].get('coverage') and w in ' '.join(rules[k].get('rule', '').split()) for k, w in need.items()), 'a firm rule lost its text or coverage'
    ro = d['rendered_output']
    assert ro['default_folder'] == '.ontheloop/maps/' and ro['filename_shape'] == '<name>.otl-map.<ext>', ro
    rx = re.compile(ro['never_commit_regex'])
    assert rx.search('.ontheloop/maps/a.svg') and rx.search('x.otl-map.svg') and 'never committed' in ' '.join(ro['rule'].split()), ro
    sc = {k: ' '.join(v.split()) for k, v in d['scope'].items()}
    assert 'every human-facing visual' in sc['owns'], sc['owns']
    assert all(w in sc['dashboard_boundary'] for w in ('config/agent/visual_contract.yaml', 'inherits', 'firm rules', 'no colour vocabulary of its own')), sc['dashboard_boundary']
    print('VISUAL_GRAMMAR_CONTRACT_OK')
    "
  expected: Exit 0 and the marker.
  fix_if: 'A failed assertion names the missing key or phrase: restore STEP 1''s verbatim text. Never drop a firm rule, its coverage or the boundary to pass.'
  hermetic: true
  expected_literals: []
  graduation: graduate
  graduation_check_id: visual-grammar-durable-structure
- step: 2
  phase: pre-deploy
  action: 'THE NEVER-COMMIT GUARD, PARSED (Decision 189: the exit code alone cannot discriminate, so the parsed hook entry is asserted): exactly one local block-rendered-maps hook, language fail, files equal to the contract''s never_commit_regex, no exclude or stages, no ''Decision 101'' text (rec-4142''s acceptance greps for it); its pattern matches the render folder and the filename shape (multi-dot names included) and nothing ordinary; .gitignore ignores both shapes and none of the negative controls (the contract, docs/otl-map.md, marketing/logo.svg), which no ratified change ends -- it asserts nothing about the rest of .ontheloop/, which Decision 211 clause 5, as amended by Decision 224 clause 2, git-ignores once T4.24 c12 builds it; and no tracked file matches.'
  command: |-
    bin/venv-python -c "
    import re, subprocess, yaml
    from pathlib import Path
    vg = Path('docs/contracts/visual-grammar.yaml')
    assert vg.is_file(), 'docs/contracts/visual-grammar.yaml is absent'
    rx = yaml.safe_load(vg.read_text(encoding='utf-8'))['rendered_output']['never_commit_regex']
    cfg = yaml.safe_load(Path('.pre-commit-config.yaml').read_text(encoding='utf-8'))
    hooks = [h for r in cfg['repos'] if r.get('repo') == 'local' for h in r.get('hooks', []) if h.get('id') == 'block-rendered-maps']
    assert len(hooks) == 1, ('block-rendered-maps hook count', len(hooks))
    h = hooks[0]
    assert h.get('language') == 'fail' and h.get('files') == rx and 'exclude' not in h and 'stages' not in h, h
    assert 'Decision 101' not in yaml.safe_dump(h), 'the hook must not cite Decision 101 (rec-4142 acceptance)'
    pat = re.compile(h['files'])
    hit = ['x.otl-map.svg', 'docs/a/b.otl-map.html', 'x.otl-map.svg.gz', '.ontheloop/maps/x.svg', '.ontheloop/maps/sub/y.png']
    miss = ['docs/contracts/visual-grammar.yaml', 'marketing/logo.svg', '.ontheloop/config.yaml', 'docs/otl-map.md']
    assert all(pat.search(s) for s in hit) and not any(pat.search(s) for s in miss), 'files pattern'
    ign = lambda s: subprocess.run(['git', 'check-ignore', '-q', s]).returncode
    assert [ign(s) for s in ('.ontheloop/maps/probe.svg', 'a/b/probe.otl-map.svg')] == [0, 0], '.gitignore misses the folder or the shape'
    assert [ign(s) for s in ('docs/contracts/visual-grammar.yaml', 'docs/otl-map.md', 'marketing/logo.svg')] == [1, 1, 1], '.gitignore is over-broad'
    tracked = subprocess.run(['git', 'ls-files'], capture_output=True, text=True, encoding='utf-8', check=True).stdout.splitlines()
    assert not [t for t in tracked if pat.search(t)], 'a rendered map is tracked'
    print('RENDERED_MAPS_GUARD_OK')
    "
  expected: Exit 0 and the marker.
  fix_if: 'A pattern or ignore mismatch means STEP 5 or the contract''s never_commit_regex drifted: make the hook''s files equal to the contract value. Never widen the miss list or drop the tracked-file leg.'
  hermetic: true
  expected_literals: []
  graduation: graduate
  graduation_check_id: rendered-maps-never-commit-guard
- step: 3
  phase: pre-deploy
  action: 'THE GUARD FAILS FOR REAL: the parsed hook runs through pre-commit in a temporary git repository holding a render-shaped file, a file in the render folder (force-added) and an ordinary svg; pre-commit reports Failed and names both render files and not the svg.'
  command: |-
    bin/venv-python -c "
    import subprocess, sys, tempfile, yaml
    from pathlib import Path
    cfg = yaml.safe_load(Path('.pre-commit-config.yaml').read_text(encoding='utf-8'))
    h = [h for r in cfg['repos'] if r.get('repo') == 'local' for h in r.get('hooks', []) if h.get('id') == 'block-rendered-maps'][0]
    with tempfile.TemporaryDirectory() as d:
        run = lambda *a: subprocess.run(list(a), cwd=d, capture_output=True, text=True, encoding='utf-8', errors='replace')
        run('git', 'init', '-q')
        Path(d, '.pre-commit-config.yaml').write_text(yaml.safe_dump({'repos': [{'repo': 'local', 'hooks': [h]}]}), encoding='utf-8')
        for f in ('a.otl-map.svg', '.ontheloop/maps/b.svg', 'c.svg'):
            Path(d, f).parent.mkdir(parents=True, exist_ok=True)
            Path(d, f).write_text('<svg/>', encoding='utf-8')
        run('git', 'add', '-A', '-f')
        r = run(sys.executable, '-m', 'pre_commit', 'run', 'block-rendered-maps', '--files', 'a.otl-map.svg', '.ontheloop/maps/b.svg', 'c.svg')
    out = r.stdout + r.stderr
    lines = out.splitlines()
    assert r.returncode == 1 and 'Failed' in out and 'a.otl-map.svg' in lines and '.ontheloop/maps/b.svg' in lines and 'c.svg' not in lines, out
    print('HOOK_FAILED_OUTPUT_OK')
    "
  expected: Prints HOOK_FAILED_OUTPUT_OK.
  fix_if: 'No Failed line means the hook did not run: check language fail and the files pattern. An import error means pre-commit is missing from the venv (requirements-dev.txt).'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: It builds and runs a temporary git repository outside the tree (hermetic carve-out iv), so it cannot be a standing in-tree guard; VP 2's graduated shard pins the parsed hook entry this step exercises.
- step: 4
  phase: pre-deploy
  action: 'THE PROVISIONAL STATE, CHECKED ONCE (acceptance_criteria[0]''s transitional claims and the design-intent vocabulary): every trigger condition parses in scripts/contracts_enforcement.py''s evaluated vocabulary, the anchor plus the day count lands exactly on 2027-01-01, and the repository''s own evaluator reads it not due on 2026-12-31 and due on 2027-01-01; the surfacing gap names rec-4570 and the re-ratification notes name the evaluator; the firm-rule ids are exactly the three; the five elements each carry a meaning and a placeholder look, the line means OPEN with three starting points; the six station states run in the declared precedence order under the exactly-one-state rule and avoid deferred_post_mvp; the edge states are provisional; the five zoom levels; every brand token is a placeholder with provenance, typeface.display is Special Elite for headings and the wordmark only, typeface.companion is null and the palette is entirely open; and the positioning credit.'
  command: |-
    bin/venv-python -c "
    import yaml
    from datetime import date, datetime, timedelta, timezone
    from pathlib import Path
    from types import SimpleNamespace
    from scripts.contracts import load_contract_meta
    from scripts.contracts_enforcement import _parse_condition, default_provisional_metrics, evaluate_provisional_trigger
    p = Path('docs/contracts/visual-grammar.yaml')
    m = load_contract_meta(p)
    d = yaml.safe_load(p.read_text(encoding='utf-8'))
    assert m.status.value == 'provisional_v0', m.status
    prov = m.provisional_v0
    conds = prov['re_ratification_trigger']['first_of']
    parsed = [_parse_condition(c) for c in conds]
    assert parsed and all(parsed), ('unparseable trigger condition', conds)
    days = [n for lhs, n in parsed if lhs == 'days_since_first_production_invocation']
    anchor = date.fromisoformat(prov['first_production_invocation_date'])
    assert days and anchor + timedelta(days=min(days)) == date(2027, 1, 1), (anchor, days)
    doc = SimpleNamespace(contract=m)
    due = lambda y, mo, dd: evaluate_provisional_trigger(doc, default_provisional_metrics(doc, now=datetime(y, mo, dd, 12, tzinfo=timezone.utc)))[0]
    assert (due(2026, 12, 31), due(2027, 1, 1)) == (False, True)
    assert 'rec-4570' in prov['surfacing_gap'] and 'evaluator' in prov['re_ratification_notes']
    assert sorted(r['id'] for r in d['firm_rules']) == ['loop-never-bisected', 'no-meaning-by-colour-alone', 'no-transit-operator-named']
    di = d['design_intent']
    els = {e['element']: e for e in di['elements']}
    assert sorted(els) == ['gate', 'interchange', 'line', 'station', 'transfer'] and all(e.get('means') and e.get('look') == 'placeholder' for e in els.values()), sorted(els)
    assert els['line']['means'] == 'OPEN' and len(els['line']['starting_points']) == 3, els['line']
    assert [s['state'] for s in di['station_states']] == ['superseded', 'done', 'parked', 'blocked', 'in_progress', 'ready'] and 'exactly one state' in di['station_state_rule']
    assert 'deferred_post_mvp' not in str(di['station_states'])
    es = di['edge_states']
    assert es['standing'].startswith('provisional') and sorted(s['state'] for s in es['states']) == ['confirmed', 'proposed', 'retracted', 'suspect']
    assert [z['level'] for z in di['zoom_levels']['levels']] == ['intent', 'work_item', 'plan', 'pr', 'diff']
    bt = d['brand_tokens']
    toks = {t['token']: t for k in ('palette', 'typefaces', 'map_look') for t in bt[k]}
    assert all(t.get('status') == 'placeholder' and t.get('provenance') for t in toks.values()), [k for k, t in toks.items() if t.get('status') != 'placeholder']
    td, tc = toks['typeface.display'], toks['typeface.companion']
    assert td['value'] == 'Special Elite' and td['use'] == 'headings and the wordmark only' and tc['value'] is None, (td, tc)
    assert all(t.get('status') == 'placeholder' for t in bt['palette']) and 'entirely open' in ' '.join(bt['standing'].split())
    assert 'inspired by intuitive relationship mapping and schematic network diagrams' in ' '.join(d['positioning'].split())
    print('PROVISIONAL_STATE_OK', anchor.isoformat(), min(days))
    "
  expected: Prints the marker, the anchor date 2026-10-23 and the day count 70.
  fix_if: 'A date mismatch means the anchor or the day count drifted: restore 2026-10-23 and 70, never move the due date. A vocabulary or placeholder mismatch means STEP 1''s text was paraphrased: restore it verbatim.'
  hermetic: true
  expected_literals:
  - 2026-10-23 70
  graduation: waive
  graduation_waiver_reason: 'It asserts transitional state that sanctioned changes end: the provisional_v0 status and date (re-ratification by 2027-01-01, or earlier when S1.10 confirms), the placeholder values S1.10''s confirmation replaces, the open line meaning, and design-intent vocabulary the operator and the illustrator revise by trial and error -- a standing shard would rot or need re-graduation on each (rec-4565''s lifecycle-pin class). The date''s standing surfacing is rec-4570''s fix.'
- step: 5
  phase: pre-deploy
  action: 'THE SEMANTO REPOINT: the contract path at exactly the four pointer sites and rec-4563 nowhere; S1.10 c2 reworded to the firm-rules form while S1.10''s intent keeps its red/amber/green brief; every semanto VP 2 pinned phrase outside the pointers survives; the contract''s agent_surface evaluator resolves; and the semanto VP 2 deny pattern (read from that plan, never restated) matches nothing in the Semanto roadmap, the contract or T4.35.'
  command: |-
    bin/venv-python -c "
    import re, yaml
    from pathlib import Path
    from scripts.roadmap.platform_roadmap import RoadmapDocument
    from scripts.checks.contracts._population import _agent_surface_resolves
    t = Path('docs/ROADMAP-SEMANTO.yaml').read_text(encoding='utf-8')
    d = RoadmapDocument.model_validate(yaml.safe_load(t))
    s = {i.id: i for i in d.tier_items}
    ai = d.document.agent_instructions
    cr = lambda k: [c.text for c in s[k].exit_criteria]
    path = 'docs/contracts/visual-grammar.yaml'
    assert t.count('rec-4563') == 0 and t.count(path) == 4, (t.count('rec-4563'), t.count(path))
    assert path in ai and path in cr('S1.10')[1] and path in cr('S1.11')[2] and path in cr('S1.12')[0]
    assert 'meet its firm rules' in cr('S1.10')[1] and 'red/amber/green' not in cr('S1.10')[1] and 'red/amber/green' in s['S1.10'].intent
    keep = ['relationship mapping', 'or a transit mark, as a source or as the reason for a rule', 'rec-4389', 'rec-4557', 'all rights reserved', 'visual identity as embodied in the commissioned works', 'neither by BUSL-1.1 now nor by Apache-2.0']
    assert all(k in ai for k in keep), [k for k in keep if k not in ai]
    assert 'symmetrically intersected' in cr('S1.11')[3] and 'placeholders' in s['S1.11'].intent and 'Special Elite' in s['S1.12'].intent
    assert all(i.status == 'deferred_post_mvp' for i in d.tier_items) and t.count('transit operator') == 1
    assert _agent_surface_resolves('docs/ROADMAP-SEMANTO.yaml', 'visual-grammar.yaml', Path('.'))
    step2 = [x for x in yaml.safe_load(Path('docs/plans/PLAN-semanto-brand-identity.yaml').read_text(encoding='utf-8'))['verification_plan'] if x['step'] == 2][0]['command']
    m = re.search(r\"deny\s*=\s*re\.compile\(r'(.+?)'\)\", step2, re.S)
    assert m, 'the semanto VP 2 deny pattern was not found: STOP, never restate it'
    deny = re.compile(m.group(1))
    rp = Path('docs/ROADMAP-PLATFORM.yaml').read_text(encoding='utf-8')
    t435 = rp[rp.index('  - id: T4.35'):rp.index('# ----- T5:')]
    texts = {'semanto': t, 'contract': Path(path).read_text(encoding='utf-8'), 'T4.35': t435}
    assert not [k for k, v in texts.items() if deny.search(v)], [k for k, v in texts.items() if deny.search(v)]
    print('SEMANTO_REPOINT_OK')
    "
  expected: Exit 0 and the marker.
  fix_if: 'A count other than 4 or 0 names a missed or extra site: apply STEP 4 exactly. A missing semanto phrase means STEP 4 touched more than the pointer text: restore it. If the deny pattern cannot be read, STOP -- never write the names into this plan.'
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: It asserts transient Semanto roadmap state (exact pointer counts, deferred statuses, sibling-plan phrases) that later legitimate row edits change; the standing guard on the pointer is validate_contract_drift, whose agent_surface evaluator for the contract fails if the Semanto roadmap stops naming it.
- step: 6
  phase: pre-deploy
  action: 'T4.35 AND T2.53 c4: T4.35 is deferred_post_mvp in T4 with depends_on exactly [T4.23, T4.24], the related decisions and CD.42, criteria c1-c7 open with their phrases (c3 names the change_surface read verb that serves the PR and diff views, which ports.yaml does not list today, not T4.33 c4; c7 records the brand-look question against rec-4557), the note declining a T4.33 -> T4.35 edge, no roadmap-liveness leg C blocking phrase (read from docs/contracts/roadmap-liveness.yaml) and no live dependent (Decision 93); T2.53 c4 is open and carries the dated bracket (inherits direction, tokens and firm rules; chart conventions stay; semantic colours derive from that contract; no colour vocabulary of its own) with no blocking phrase.'
  command: |-
    bin/venv-python -c "
    import re, yaml
    from pathlib import Path
    d = yaml.safe_load(Path('docs/ROADMAP-PLATFORM.yaml').read_text(encoding='utf-8'))
    items = {i['id']: i for i in d['tier_items']}
    t = items['T4.35']
    assert t['tier'] == 'T4' and t['status'] == 'deferred_post_mvp' and set(t['depends_on']) == {'T4.23', 'T4.24'}, t
    assert {93, 101, 127, 197, 232, 233} <= set(t['related_decisions']) and 'CD.42' in t['related_candidate_decisions']
    c = {x['id']: x for x in t['exit_criteria']}
    c3txt = c.get('c3', {}).get('text', '')
    assert 'docs/contracts/visual-grammar.yaml' in t['intent'] and 'No T4.33 -> T4.35 depends_on edge' in t['note'] and 'T4.33 c4' not in c3txt
    need = {'c1': ['GRAMMAR', 'fixture graph'], 'c2': ['WITHOUT COLOUR', 'one colour'], 'c3': ['ZOOM', 'change_surface read verb that serves them', 'does not list today'], 'c4': ['NAMED VERBS ONLY', 'never caller SQL', 'never false zeroes'], 'c5': ['NEVER COMMITTED', '.ontheloop/maps/', '<name>.otl-map.<ext>', 'block-rendered-maps', 'never_commit_regex'], 'c6': ['EDGE STATES', 'only its asserter'], 'c7': ['BRAND LOOK', 'neutral default theme', 'rec-4557', 'no default theme ships']}
    miss = {k: [w for w in v if w not in c.get(k, {}).get('text', '')] for k, v in need.items()}
    assert sorted(c) == sorted(need) and all(x['status'] == 'open' for x in c.values()) and not any(miss.values()), miss
    phr = yaml.safe_load(Path('docs/contracts/roadmap-liveness.yaml').read_text(encoding='utf-8'))['leg_c_blocking_phrase_grammar']['phrases']
    hits = [(k, p) for k, x in c.items() for p in phr if re.search(p, x['text'])]
    assert not hits, ('roadmap-liveness leg C blocking phrase', hits)
    live = [i['id'] for i in d['tier_items'] if i.get('status') in ('not_started', 'in_progress') and 'T4.35' in (i.get('depends_on') or [])]
