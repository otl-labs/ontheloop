  STEP 1 -- Create docs/contracts/visual-grammar.yaml with exactly the text below (DATE substituted in authored_at and in the amendment_log row; first_production_invocation_date stays 2026-10-23). Edge-model note: if docs/contracts/work-item-edges.yaml exists on main at STEP 0, also replace (i) the sources row value 'approved, not yet built -- provisional here' with 'built: docs/contracts/work-item-edges.yaml -- still provisional here until this contract is re-ratified', (ii) 'provisional -- the edge-model plan defines these and is not yet built (sources)' with 'provisional -- docs/contracts/work-item-edges.yaml defines these; re-checked at re-ratification', and (iii) '(docs/plans/PLAN-work-graph-edge-model.yaml, then its own contract once built)' with '(docs/contracts/work-item-edges.yaml)'; VP 1 reads none of them. Then git add it (validate_placement reads git ls-files).

  # Visual-grammar contract (rec-4563): the "later contract" that Decision 232 clause 5 says owns the dependency map's
  # grammar. One written source for the map's design intent and for the brand tokens of every human-facing visual --
  # the dependency map (T4.35, shown by T4.33 c5), marketing (ROADMAP-SEMANTO S1.9-S1.12) and any analytical dashboard
  # (T2.53 c4). It records MEANING and DESIGN INTENT. Every look -- palette, typefaces, glyph shapes, line weights and
  # styles, interchange symbols -- is a placeholder that the operator settles with the external illustrator (S1.10);
  # confirmed values are written here through S1.10's confirmation flow, never by an agent's choice. Rationale lives in
  # Decisions 197 and 232 and in the operator's 2026-10-23 rulings recorded in PLAN-dependency-map-transit-renderer
  # (Decision 86); this file never restates them.
  contract:
    id: visual-grammar
    class: D
    contract_version: 1
    status: provisional_v0
    description: >-
      Class D mechanism contract: the dependency map's semantic model over the Decision 197 work-item graph (stations,
      lines, interchanges, transfers, gates, station and edge states, zoom levels), the three firm rules, the design
      intent the operator and the illustrator may revise, the brand tokens with provenance, the boundary with T2.53's
      dashboard conventions, and the rendered-output rule (a render is a query result, never committed).
    subject: visual-grammar
    evaluator:
      agent_surface: docs/ROADMAP-SEMANTO.yaml
    provisional_v0:
      authored_at: "DATE"
      authored_via: "PLAN-dependency-map-transit-renderer (rec-4563)"
      rationale: >-
        Every visual value is a placeholder until the commissioned illustration (S1.10), and the meaning of a line is
        open, so the operator holds this contract provisional and re-ratifies it by 2027-01-01 -- or earlier, when S1.10
        confirms the values, which is the intended normal path.
      first_production_invocation_date: "2026-10-23"
      trigger_anchor_note: >-
        first_production_invocation_date is the day-count anchor only: the operator's provisional ruling date, not a
        production invocation (this contract has none). It is the one date form scripts/contracts_enforcement.py
        evaluates (default_provisional_metrics); 2026-10-23 plus 70 days is 2027-01-01. rec-4570's vocabulary fix should
        migrate this anchor to an authored-date form, so no reader of production-invocation data takes it literally; any
        such migration keeps the 2027-01-01 due date.
      re_ratification_trigger:
        first_of:
          - "days_since_first_production_invocation >= 70"
      re_ratification_owner: "operator + plan-critique gate"
      re_ratification_notes: >-
        At re-ratification, revisit the evaluator: agent_surface on docs/ROADMAP-SEMANTO.yaml is the thinnest reading of
        Decision 168 clause 2 (plan-critique r1). The stronger resolvable kind is a registered, sequenced check whose
        module reads this file by name -- for example one wrapping T4.35's conformance suite.
      surfacing_gap: >-
        The preflight provisional-contract scan skips Class D contracts today, so this trigger is not yet surfaced;
        rec-4570 (High) owns that fix.

  amendment_log:
    - {date: "DATE", semantic_break: false, change_class: field_add, summary: "Initial authoring (PLAN-dependency-map-transit-renderer, rec-4563): semantic model, three firm rules, revisable design intent, placeholder brand tokens with provenance, the T2.53 boundary and the rendered-output rule; provisional_v0, re-ratification due 2027-01-01."}

  positioning: >-
    Dependency mapping at the level of milestones and gates -- what must hold before work may proceed -- not code
    dependencies, drawn in a transit-map, schematic network-diagram visual language (Decision 232 clause 5) inspired by
    intuitive relationship mapping and schematic network diagrams.

  scope:
    owns: >-
      The design direction and the brand tokens of every human-facing visual: the dependency map (T4.35, shown by T4.33
      c5), marketing (ROADMAP-SEMANTO S1.9-S1.12, one-way downstream per Decision 101 clause (c)) and any analytical
      dashboard (T2.53).
    dashboard_boundary: >-
      T2.53 c4's config/agent/visual_contract.yaml, if built, inherits its design direction, its brand values and the
      firm rules from this contract, and defines dashboard-specific conventions within that direction -- among them
      number formats, actual versus estimated presentation, chart conventions, missing-data behaviour and viewports. Its
      semantic colours derive from this contract's tokens and firm rules, so a dashboard adds no colour vocabulary of its
      own and never redefines a brand value.
    not_owned: >-
      The edge-state model (docs/plans/PLAN-work-graph-edge-model.yaml, then its own contract once built), the graph
      read verbs (docs/contracts/ports.yaml work_item_storage) and the brand-art licence (rec-4557).

  sources:
    - {source: "Decision 197 clause 3", gives: "work_items, work_item_criteria and work_item_edges; completion is criteria"}
    - {source: "docs/plans/PLAN-work-graph-edge-model.yaml", gives: "the closed edge kinds and the proposed, confirmed and retracted edge states, suspect derived at read", standing: "approved, not yet built -- provisional here"}
    - {source: "Decision 232 clauses 4, 5 and 7", gives: "zoom (altitude), the headline map and the presentation boundary"}
    - {source: "Decision 233 clause 4", gives: "approval authority is GitHub"}
    - {source: "docs/ROADMAP-SEMANTO.yaml S1.10-S1.13", gives: "the commission, the mark, the typefaces and the clearance the brand tokens come from"}

  firm_rules:
    - id: no-meaning-by-colour-alone
      rule: >-
        Every meaning in any human-facing visual this contract governs -- the map, the marks, marketing visuals and
        dashboards -- survives without colour: shape, pattern, position or label carries it too, so a colour-blind
        reader and one-colour output lose nothing.
      coverage: >-
        Unenforced until built: T4.35 c2 (a one-colour render keeps every element and state distinct), ROADMAP-SEMANTO
        S1.11 c2 (the one-colour mark) and, for dashboards, the inheritance T2.53 c4 records.
    - id: loop-never-bisected
      rule: The loop (the O of the OTL mark) is never bisected or symmetrically intersected by a bar or band.
      coverage: "Unenforced until built: ROADMAP-SEMANTO S1.11 c4 and the S1.13 c1 clearance."
    - id: no-transit-operator-named
      rule: No transit operator or transit mark is ever named in public text, as a source or as the reason for a rule.
      coverage: >-
        Unenforced residual: carried by the docs/ROADMAP-SEMANTO.yaml agent_instructions rule; owner rec-4571.
  firm_rules_note: >-
    These three are the only firm rules (operator, 2026-10-23). Changing one is the operator's call and lands as an
    amendment_log row; everything under design_intent the operator may revise with the illustrator.

  design_intent:
    standing: >-
      Revisable by the operator with the illustrator. Each entry fixes WHAT a thing means; HOW it looks is a placeholder
      (look: placeholder) until S1.10's confirmation flow writes a confirmed value into brand_tokens.
    colour: >-
      Colour carries line identity, never status; status is carried by shape or pattern. This is the brief's default:
      ROADMAP-SEMANTO S1.10's "which the colour rule forbids" states it, and the operator and the illustrator may revise
      it as long as firm rule no-meaning-by-colour-alone holds.
    elements:
      - element: station
        means: One work item at the current zoom level -- a milestone.
        look: placeholder
      - element: line
        means: OPEN
        open_note: >-
          The meaning of a line is open. The operator and the illustrator settle it by trying options, and it becomes
          clear as the work progresses.
        starting_points:
          - "The route to one goal: the stations that are part_of one epic, or that serve one north star at intent zoom, in dependency order."
          - A computed dependency chain leading to one milestone.
          - "A tier or workstream -- though tier membership is this operator's taxonomy, which Decision 197 clause 4 keeps out of the shipped mechanism, so a user's map could not carry it."
        look: placeholder
      - element: interchange
        means: A station shared by two or more lines.
        look: placeholder
      - element: transfer
        means: A dependency that crosses from one line to another.
        look: placeholder
      - element: gate
        means: >-
          What must hold before a station counts as done: one of its completion criteria (a work_item_criteria row;
          completion gates are criteria, never edges) or a human approval, which happens in GitHub (Decision 233
          clause 4).
        look: placeholder
    station_states:
      - {state: superseded, means: "replaced by another work item"}
      - {state: done, means: "every gate on the station has held"}
      - {state: parked, means: "intentionally set aside and not scheduled"}
      - {state: blocked, means: "not done, and something it depends on is unfinished, whether or not work has started"}
      - {state: in_progress, means: "work has started, nothing it depends on is unfinished, and a gate is still open"}
      - {state: ready, means: "not started, and nothing it depends on is unfinished"}
    station_state_rule: >-
      A station reads as exactly one state: the first in the list above that applies. Whether a blocked station had
      started shows in its detail, never as a second state.
    station_states_look: placeholder -- each state stays distinct without colour (firm rule no-meaning-by-colour-alone)
    edge_states:
      standing: provisional -- the edge-model plan defines these and is not yet built (sources)
      states:
        - {state: confirmed, means: "written by the implementation merge; holds up every dependent"}
        - {state: proposed, means: "asserted by a plan or a run but not yet merged; shown with the plan that asserted it, and holds up only the item that asserted it"}
        - {state: retracted, means: "withdrawn; not drawn on the map, kept in the edge's history"}
        - {state: suspect, means: "derived at read, never stored: the target changed since the edge bound it"}
      look: placeholder
    zoom_levels:
      rule: >-
        Decision 232 clause 4's altitude: intent -> work item -> plan -> PR -> diff, so an engineer can always drop to
        code. The first two are drawn as maps; the last three are drill views from a station.
      levels:
        - {level: intent, shows: "the goals and the work items serving them", drawn_as: map}
        - {level: work_item, shows: "work items with their gates and dependencies", drawn_as: map}
        - {level: plan, shows: "one station's plan: its scope and its verification steps as gates", drawn_as: drill view}
        - {level: pr, shows: "the pull request and its checks", drawn_as: "drill view through the change_surface read verb that serves it, which docs/contracts/ports.yaml does not list today"}
        - {level: diff, shows: "the code change", drawn_as: "drill view through the change_surface read verb that serves it, which docs/contracts/ports.yaml does not list today"}

  brand_tokens:
    standing: >-
      Every value is a placeholder (status: placeholder) until S1.10's confirmation flow, in which the operator confirms
      or replaces it from the commissioned work, the illustrator's judgement deciding the look. The confirmed value is
      written here (status: confirmed) with an amendment_log row -- never in a marketing/ file first (Decision 101
      clause (c)) and never by an agent's choice. The palette is entirely open.
    palette:
      - {token: palette.mark.loop, use: "the O of the OTL mark", status: placeholder, value: red, provenance: "ROADMAP-SEMANTO S1.11: a placeholder carrying no intent beyond a distinct identity"}
      - {token: palette.mark.arm, use: "the T arm of the mark", status: placeholder, value: green, provenance: "ROADMAP-SEMANTO S1.11: a placeholder carrying no intent beyond a distinct identity"}
      - {token: palette.mark.l, use: "the L of the mark", status: placeholder, value: yellow, provenance: "ROADMAP-SEMANTO S1.11: a placeholder carrying no intent beyond a distinct identity"}
      - {token: palette.line_identity, use: "the map's line colours", status: placeholder, value: null, provenance: "not chosen; S1.10"}
      - {token: palette.ink, use: "text and neutral marks", status: placeholder, value: null, provenance: "not chosen; S1.10"}
      - {token: palette.paper, use: "background", status: placeholder, value: null, provenance: "not chosen; S1.10"}
    typefaces:
      - {token: typeface.display, use: "headings and the wordmark only", status: placeholder, value: "Special Elite", provenance: "ROADMAP-SEMANTO S1.12: the current candidate, provisional"}
      - {token: typeface.companion, use: "body text and map labels", status: placeholder, value: null, provenance: "ROADMAP-SEMANTO S1.12: not chosen"}
    map_look:
      - {token: look.glyphs, use: "station, gate and state symbols", status: placeholder, value: null, provenance: "not chosen; S1.10"}
      - {token: look.lines, use: "line weights and styles", status: placeholder, value: null, provenance: "not chosen; S1.10"}
      - {token: look.interchange, use: "the interchange symbol", status: placeholder, value: null, provenance: "not chosen; S1.10 (S1.11's pin-joint rings are one idea)"}

  rendered_output:
    rule: >-
      A rendered map is a query result drawn on request for the user who asked for it, never a standing artefact: it
      is never committed and never shared through the repository (Decision 232 clause 7; Decision 127 clause 1 read by
      audience-of-record; Decision 197 clause 1, this operator's work-item data never ships). This is distinct from the
      tracked, generated-then-confirmed dependency graph Decision 211 clause 5 places under ontheloop/, which is
      structure data, not a render.
    reads: >-
      Named read verbs only (the work_item_storage graph reads docs/contracts/ports.yaml lists), never caller SQL; a
      failed read shows the last good view or says unavailable, never false zeroes or an empty map (Decision 232 clause
      7; Decision 215).
    default_folder: .ontheloop/maps/
    default_folder_note: >-
      Inside the git-ignored .ontheloop/ runtime root of Decision 211 clause 5 as amended by Decision 224 clause 2, which
      also homes .ontheloop/config.yaml there. This repository ignores the maps folder itself until T4.24 c12 creates and
      ignores that whole root; nothing here asserts that anything else under .ontheloop/ stays tracked.
    filename_shape: "<name>.otl-map.<ext>"
    never_commit_regex: '^\.ontheloop/maps/|\.otl-map\.[^/]+$'
    guard: >-
      .gitignore ignores the folder and the filename shape anywhere in the tree, and the block-rendered-maps pre-commit
      hook (language fail, files equal to never_commit_regex) rejects both, including a force-add. scripts.validate
      runs the hook in both tiers: changed files on a pull request, every file after merge.
    public_surfaces: >-
      A render of this operator's own work items never reaches marketing/ or the public site (Decision 101 clause (d));
      marketing visuals use example fixture graphs.
