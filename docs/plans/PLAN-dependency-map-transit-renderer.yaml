constraints:
- 'DESIGN ONLY (operator ruling 2026-10-23): no renderer, no prototype, no code, no test code. Every look (palette, typefaces, glyph shapes, line weights and styles, interchange symbols) stays a placeholder with provenance; confirmed values arrive only through S1.10''s confirmation flow, never by an agent''s choice.'
- 'Exactly three firm rules (operator, 2026-10-23): every meaning survives without colour; the OTL loop is never bisected or symmetrically intersected by a bar or band; no transit operator or transit mark is ever named in public text, not even as the reason for a rule. ''Colour carries line identity, never status'' is revisable design intent.'
- 'The meaning of a line stays OPEN (operator, 2026-10-23): the three starting points are options to explore, never a decision, and are written in plain design language (starting points to try).'
- 'PUBLIC REPOSITORY: no AWS account id, ARN, credential, ExternalId or internal hostname; never name the external illustrator, the commission terms or any former-employer detail; model wording stays vendor-neutral. Positioning reads ''inspired by intuitive relationship mapping and schematic network diagrams'' plus Decision 232 clause 5''s genre phrase. The deny-list check reads the semanto plan''s VP 2 pattern and never restates it.'
