- 'The block-rendered-maps hook text never contains ''Decision 101'': rec-4142''s acceptance greps .pre-commit-config.yaml for it, and this change must not satisfy that rec spuriously.'
- 'Decision 211 clause 5, as amended by Decision 224 clause 2, makes .ontheloop/ the git-ignored per-clone runtime root, with .ontheloop/config.yaml in it: this plan ignores only .ontheloop/maps/ now and asserts nothing about the rest of .ontheloop/, so T4.24 c12 ignoring the whole root breaks no guard here.'
- The edge-state model is cited by path (docs/plans/PLAN-work-graph-edge-model.yaml), never by its Decision number, which that plan re-derives at its own implementation; the contract marks the edge states provisional.
- file-router.yaml headroom is paid by compacting amendment history (Decision 166 contracts relief valve), never by joining route descriptions or deleting content; re-measure after any sibling lands (PLAN-work-graph-edge-model spends the same headroom).
- T4.35 and the T2.53 c4 bracket carry no roadmap-liveness leg C blocking phrase (docs/contracts/roadmap-liveness.yaml leg_c_blocking_phrase_grammar).
- 'Decision 67 / CD.17 freeze: IMPLEMENTATION only. Decision 126: no terraform apply and no Lambda deploy (see infrastructure_dependencies). Decision 55 and Decision 181: no rescue loops; a red check is diagnosed and the edit corrected, never a VP, a check or a pinned shard weakened.'
- 'Scope boundary (Decision 59): only the six scope files change, plus sanctioned derived paths -- the three graduated registry shards named in VP 1, VP 2 and VP 7, .secrets.baseline line-number regeneration, and this plan''s own bookkeeping fields. Out-of-scope findings become recs via the portal.'
- No emojis; ASCII hyphens; no eval or exec; every command Linux/bash-compatible via bin/venv-python.
