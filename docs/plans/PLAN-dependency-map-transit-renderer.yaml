schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: dependency-map-transit-renderer
intent: 'Write down, design only, the visual-grammar contract that Decision 232 clause 5 hands the dependency map''s grammar to: docs/contracts/visual-grammar.yaml, one source for the map''s design intent and for the brand tokens of every human-facing visual, with every look a placeholder the operator settles with the illustrator (S1.10). Park the renderer build as deferred_post_mvp T4.35, guard rendered maps from ever being committed (a git-ignored render folder, a reserved filename shape and a pre-commit fail hook), point T2.53 c4 at the contract, repoint the four ROADMAP-SEMANTO rec-4563 pointers and close rec-4563. No code, no prototype and no new Decision.'
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V1
plan_path: docs/plans/PLAN-dependency-map-transit-renderer.yaml
phase: 'T4.35 (created here, deferred_post_mvp; no criterion closes) plus the ad_hoc_rec rec-4563, bundled. Slice dependency-map-transit-renderer of overseer run otl-product-direction, implemented LAST: after Decisions 232-235 and the semanto-brand-identity rows are on main (STEP 0). Names no CD.27-gated item, so no fallback_reevaluation block is owed.'
introduces:
- visual-grammar
- T4.35
- block-rendered-maps
scope:
- file: docs/contracts/visual-grammar.yaml
