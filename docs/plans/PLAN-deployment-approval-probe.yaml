execution_steps:
  - Write the script, both test files, the workflow, the Terraform resource, import block and comment fix, the
    taxonomy row, the r3_workflows baseline entries and the CLAUDE.md section; run VP 1-3, the fast tier and VP 11 (full
    tier, before the commit that hands off); open the PR.
  - 'Closure, each fact reported separately and in order (implement skill Commit Flows; docs/contracts/git-ops.yaml):
    (a) readiness: bin/venv-python -m scripts.session.github_readiness (an unknown result is never PASS); (b) set
    implementation_declared true, commit, git fetch origin main and git rebase origin/main (STOP on conflict); (c) VP 11
    on the committed, rebased, clean tree; (d) a scratchpad JSON holding exactly the
    scripts.session.postflight_evidence.CATEGORIES keys, then bin/venv-python -m scripts.session.postflight --evidence
    <that file>; (e) the code-review verdict; (f) push, the PR URL, the CI outcome and the merge SHA (no Resolves
    trailer).'
  - VP 4 on the PR; merge under the standing rule once code review is PROCEED and CI is green (no DuckLake deploy).
  - Run VP 5 (the operator created the Environment in the UI before the PR and confirms it in Settings). Do not
    dispatch before VP 5 passes.
  - Run VP 6 (positive control; the operator approves one run in the Actions UI).
  - Run VP 7 (ci-bot leg, which also yields the environment id), then VP 8 (session legs, one fresh run each,
    cancelling each run after its leg), then VP 9.
  - Run VP 10; report the result to the operator and the content-reader planning thread.
  - 'Report: what was implemented, verification results'
rollback: >-
  If the operator has not applied terraform/github since the import landed: revert the PR first, then the operator
  deletes the Environment in the GitHub UI (deleting first would leave main's import block without a target). If he
  has applied it: delete in the UI first, then revert (a refresh drops the deleted object from state, so the PR-time
  plan shows no destroy), or the revert adds a removed block with lifecycle destroy = false. The Environment and workflow are inert, so
  leaving them in place has no effect on any real gate.
