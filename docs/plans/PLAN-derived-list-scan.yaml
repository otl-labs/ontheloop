constraints:
  - Report, never gate (operator lean confirmed by the blind consult); no registered check, no --pre or full-tier cost, no required check.
  - No registry of hand-kept lists and no exclusion list for the scanner; dispositions live as markers in each file.
  - Source code-smell (an existing scheduled static-analysis source), so no writer accepted_values change and no Lambda deploy.
