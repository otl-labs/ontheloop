- step: 1
  phase: pre-deploy
  action: 'ROADMAP-SEMANTO: rec-4572 and rec-4574 oracles, the brand-art rules kept, every row still deferred, and no deny-pattern or vendor token (the
    semanto plan''s VP 2 deny regex is read from that plan, never restated).'
  command: 'bin/venv-python -c "import re, yaml; from pathlib import Path; from scripts.roadmap.platform_roadmap import RoadmapDocument; t = Path(''docs/ROADMAP-SEMANTO.yaml'').read_text(encoding=''utf-8'');
    d = RoadmapDocument.model_validate(yaml.safe_load(t)); s = {i.id: i for i in d.tier_items}; ai = '' ''.join(d.document.agent_instructions.split());
    note = '' ''.join(s[''S1.1''].progress_note.split()); sp = yaml.safe_load(Path(''docs/plans/PLAN-semanto-brand-identity.yaml'').read_text(encoding=''utf-8''));
    vc = [x for x in sp[''verification_plan''] if x[''step''] == 2][0][''command'']; deny = re.compile(re.search(r\"deny = re\.compile\(r''(.+?)''\);\",
    vc).group(1)); vendor = re.compile(r''(?i)\b(anthropic|openai|gemini|mistral)\b''); assert ''Every asset landing in marketing/'' not in t and ''Every
    brand-art asset landing in marketing/ carries its own notice saying so'' in ai, ''rec-4572''; assert all(w in ai for w in (''third-party fonts keep
    their own licence (S1.12 c2)'', ''site code and prose ship under the repository licence (Decision 209 clause 3(1))'', ''all rights reserved'', ''visual
    identity as embodied in the commissioned works'', ''neither by BUSL-1.1 now nor by Apache-2.0'', ''rec-4557 owns the explicit licence-surface exclusion'')),
    ''a brand-art rule was lost''; assert ''remaining scope is README wording'' not in t and ''PLAN-documentation-refresh (rec-4574)'' in note and ''repository
    description'' in note, ''rec-4574''; assert all(i.status == ''deferred_post_mvp'' for i in d.tier_items), ''a row left deferred_post_mvp''; assert not
    deny.search(t) and not vendor.search(t), (deny.findall(t), vendor.findall(t)); print(''SEMANTO_DOC_REFRESH_OK'')"'
  expected: Exit 0 and the marker line.
  fix_if: 'An assertion names the rec or the lost rule: conform the text to execution step 5 verbatim. Never drop an assertion.'
  hermetic: true
  expected_literals:
  - SEMANTO_DOC_REFRESH_OK
  graduation: waive
  graduation_waiver_reason: It pins this slice's wording (the narrowed notice sentence, the dated S1.1 re-measure); a legitimate S1.1 reactivation or the
    rec-4557 licence wording would redden a standing guard. Its durable half, no transit-operator name, cannot graduate red-before (origin/main is already
    clean; PLAN-semanto-brand-identity VP 2 waiver) and is owned by rec-4571.
