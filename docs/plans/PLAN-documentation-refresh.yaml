slug: documentation-refresh
intent: Bring README.md, docs/PROJECT_CONTEXT.md and AGENTS.md in line with what overseer run otl-product-direction merged (Decisions 232-235; T4.33-T4.35;
  docs/contracts/visual-grammar.yaml; Semanto rows S1.10-S1.13) as concise pointers, never restatements, refresh PROJECT_CONTEXT's roadmap source stamp
  with the repository's own drift tooling, and close the run's documentation-accuracy recs -- so every agent that loads these surfaces starts from the current
  product direction, with no new Decision, contract, code or behaviour change.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V1
plan_path: docs/plans/PLAN-documentation-refresh.yaml
phase: 'user_explicit_out_of_scope (soft-warn category; slice documentation-refresh of overseer run otl-product-direction) with bundled ad_hoc_rec recs
  rec-4572, rec-4583, rec-4584, rec-4574, rec-3667. No tier_item is claimed and no exit criterion closes: the roadmap edits are text on deferred_post_mvp
  T4.33 and T4.35 only, statuses unchanged (Decisions 93, 136). Names no CD.27-gated item, so no fallback_reevaluation block is owed.'
scope:
- file: README.md
  action: Modify
  purpose: Projection header names docs/DECISIONS.md; a pointer-only Product Direction section (Decisions 232-234; T4.33-T4.35); the verified-stale tenancy
    line, subsystem statuses, Documentation Model rows and workflow entry points corrected; Canonical Sources gains docs/DECISIONS.md. The trademark sentence
    is untouched (fork answer).
- file: docs/PROJECT_CONTEXT.md
  action: Modify
  purpose: Pointers for the open core, users and surface, verification weakening, persona execution and path, Semanto brand rows and T3.22; CI-RCA and hosted-product
    lines corrected (scout); restatements of AGENTS.md and contracts tightened so S8 stays inside its 14032-byte budget; Source stamp refreshed by tooling
    (rec-3667).
- file: AGENTS.md
  action: Modify
  purpose: Convert its 12 em dashes to ASCII hyphens (its own Code style rule); no content line (fork answer).
- file: docs/ROADMAP-SEMANTO.yaml
  action: Modify
  purpose: 'rec-4572: the agent_instructions notice rule narrows to brand-art assets; rec-4574: S1.1''s remaining scope re-measured.'
- file: docs/contracts/visual-grammar.yaml
  action: Modify
  purpose: 'rec-4583 (rendered_output.reads: graph read verbs not listed today) and rec-4584 (rendered_output.guard: root-anchored folder, shape at any
    depth), plus a prose_improvement amendment_log row.'
- file: .gitignore
  action: Modify
  purpose: 'rec-4584: the rendered-maps comment says the folder is root-anchored and only the filename shape applies at any depth; the two ignore entries
    are unchanged.'
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: 'rec-4583: T4.35 c4 text; fork answer: dated append-only brackets on T4.33 c5 (names the contract) and T4.35''s note. No status or criterion
    closure.'
