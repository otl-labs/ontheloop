    == ''visual-grammar''; base = yaml.safe_load(subprocess.run([''git'', ''show'', ''origin/main:docs/contracts/visual-grammar.yaml''], capture_output=True,
    text=True, check=True).stdout); ro = {k: '' ''.join(str(v).split()) for k, v in d[''rendered_output''].items()}; assert ''graph reads docs/contracts/ports.yaml
    lists'' not in vt and ''which docs/contracts/ports.yaml does not list today'' in ro[''reads''] and ''PLAN-work-graph-edge-model'' in ro[''reads''],
    ''rec-4583 contract''; assert ''anywhere in the tree'' not in vt and ''root-anchored folder /.ontheloop/maps/'' in ro[''guard''] and ''filename shape
    at any depth'' in ro[''guard''], ''rec-4584 contract''; keep = (''contract'', ''positioning'', ''scope'', ''sources'', ''firm_rules'', ''design_intent'',
    ''brand_tokens''); assert all(d[k] == base[k] for k in keep) and all(d[''rendered_output''][k] == base[''rendered_output''][k] for k in (''rule'', ''default_folder'',
    ''filename_shape'', ''never_commit_regex'', ''public_surfaces'')), ''wording-only edit changed a rule, token or regex''; log = d[''amendment_log''];
    AmendmentLogEntry.model_validate(log[-1]); assert len(log) == len(base[''amendment_log'']) + 1 and log[-1][''change_class''] == ''prose_improvement''
    and log[-1][''semantic_break''] is False and ''rec-4583'' in log[-1][''summary''] and ''rec-4584'' in log[-1][''summary''], log[-1]; gi = Path(''.gitignore'').read_text(encoding=''utf-8'');
    blk = gi[gi.index(''# Rendered dependency maps''):gi.index(''*.otl-map.*'')]; assert ''root-anchored'' in blk and ''anywhere in the tree'' not in blk
    and ''/.ontheloop/maps/'' in blk, ''rec-4584 gitignore''; ign = lambda x: subprocess.run([''git'', ''check-ignore'', ''-q'', x]).returncode; assert
    [ign(x) for x in (''.ontheloop/maps/probe.svg'', ''a/b/probe.otl-map.svg'', ''docs/contracts/visual-grammar.yaml'')] == [0, 0, 1], ''ignore behaviour
    changed''; rt = Path(''docs/ROADMAP-PLATFORM.yaml'').read_text(encoding=''utf-8''); r = {i[''id'']: i for i in yaml.safe_load(rt)[''tier_items'']};
    c35 = {x[''id'']: x[''text''] for x in r[''T4.35''][''exit_criteria'']}; c33 = {x[''id'']: x[''text''] for x in r[''T4.33''][''exit_criteria'']}; assert
    ''graph read verbs docs/contracts/ports.yaml lists'' not in rt and ''which docs/contracts/ports.yaml does not list today'' in c35[''c4''], ''rec-4583
    roadmap''; assert re.search(r''\[\d{4}-\d{2}-\d{2}, PLAN-documentation-refresh: that contract is docs/contracts/visual-grammar.yaml\]'', c33[''c5''])
    and ''PLAN-documentation-refresh: T4.33 c5 now names docs/contracts/visual-grammar.yaml'' in r[''T4.35''][''note''], ''T4.33 c5 or T4.35 note bracket'';
    assert all(x[''status''] == ''open'' for k in (''T4.33'', ''T4.35'') for x in r[k][''exit_criteria'']) and r[''T4.33''][''status''] == r[''T4.35''][''status'']
    == ''deferred_post_mvp'', ''a status moved''; sp = yaml.safe_load(Path(''docs/plans/PLAN-semanto-brand-identity.yaml'').read_text(encoding=''utf-8''));
    vc = [x for x in sp[''verification_plan''] if x[''step''] == 2][0][''command'']; deny = re.compile(re.search(r\"deny = re\.compile\(r''(.+?)''\);\",
    vc).group(1)); vendor = re.compile(r''(?i)\b(anthropic|openai|gemini|mistral)\b''); new = '' ''.join([ro[''reads''], ro[''guard''], log[-1][''summary''],
    blk, c35[''c4''], c33[''c5''], r[''T4.35''][''note'']]); assert not deny.search(new) and not vendor.search(new) and chr(8212) not in new, (deny.findall(new),
    vendor.findall(new)); print(''VISUAL_GRAMMAR_DOC_REFRESH_OK'')"'
  expected: Exit 0 and the marker line.
  fix_if: 'A named assertion: conform to execution steps 6-8 verbatim; a ''wording-only'' failure means a rule, token or regex moved -- revert that hunk.
    Never edit the assertion.'
  hermetic: true
  expected_literals:
  - VISUAL_GRAMMAR_DOC_REFRESH_OK
  graduation: waive
  graduation_waiver_reason: PR-relative (git show origin/main:) and pinned to this slice's wording; rec-4583's 'not listed today' becomes false the day
    PLAN-work-graph-edge-model lands, so a standing guard would redden a correct future edit. The rendered-maps behaviour is already guarded by the graduated
    shards rendered-maps-never-commit-guard and visual-grammar-durable-structure.
