infrastructure_dependencies: []
acceptance_criteria:
- 'README.md: its projection header names docs/DECISIONS.md; a Product Direction section points, one line each, at the Signaller, the one supervision surface
  (T4.33), the milestone-and-gate dependency map with the operator''s positioning phrase and visual-grammar.yaml (T4.35), the customer-owned open core (free
  scale, paid tooling, "free" is price only) and the local sandboxed persona host (T4.34), citing Decisions 232-234; the eight verified-stale facts are
  corrected and Canonical Sources lists docs/DECISIONS.md; the trademark sentence, the licence lines and the projection header check are intact.'
- docs/PROJECT_CONTEXT.md carries pointers for Decisions 232-235 and 229 (a persona path matching the roadmap's depends_on), T3.22, T4.15, T4.28-T4.35,
  S1.10-S1.13 and visual-grammar.yaml, keeps every test-pinned string, stays inside the S8 prose budget (14032 bytes) with no budget raise, and its Source
  stamp matches the current tier_item id set (_check_endstate_drift reason ok).
- AGENTS.md differs from origin/main only by its 12 em dashes becoming ASCII hyphens; the S1 budget, CLAUDE.md pointer, git-ops pointer and ports.yaml pointer
  checks pass.
- rec-4572, rec-4583, rec-4584 and rec-4574 acceptances hold; rec-3667's acceptance is re-authored to the current stale hash and holds; all five are census-probeable
  and close through the squash commit's Resolves trailer (Decision 201).
- 'visual-grammar.yaml changes wording only: firm rules, brand tokens, design intent, scope, sources, positioning and every rendered_output rule, folder,
  shape and regex equal origin/main''s, plus one prose_improvement amendment_log row; .gitignore ignore behaviour is unchanged.'
- No public text names a transit operator or transit mark (PLAN-semanto-brand-identity VP 2's deny pattern, read, never restated), names the external illustrator,
  a model vendor, or says open source for the core; no em dash remains in an edited Markdown file; every brand value stays a placeholder.
- The full validate tier passes on the committed, rebased tree.
