schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ducklake-typed-unmapped-errors
intent: >-
  Close rec-4282 and land rec-4294's preventive half (PLAN-telemetry-owner-provisioning bundles and closes rec-4294 with the
  grant fix): an exception that no error-map row recognises must never reach a DuckLake serving Function URL as the runtime's
  untyped 502. The three URL-only serving functions (telemetry writer, reader, ops
  writer) answer an unmapped exception with a typed 500 `unmapped` carrying only the exception class and the Lambda request id,
  a dead catalog connection with a typed retryable 503 `catalog_unavailable`, an unparseable body with a 400 `bad_request`,
  and (reader) a caller-input DuckDB error inside a named verb with a 400 `named_read_input` carrying the DuckDB message. Paging
  survives the change because both writers' errors alarms sum AWS/Lambda Errors and Url5xxCount. Telemetry is the platform's
  learning signal (PROJECT_CONTEXT); a post-deploy gate that reports `error_type=none` teaches nothing.
plan_type: IMPLEMENTATION
verification_tier: V3
implementation_declared: true
plan_path: docs/plans/PLAN-ducklake-typed-unmapped-errors.yaml
phase: >-
  ci_rca soft-warn exception category (rec-4294, the one open ci-rca rec; same file as its source_file). Touches the T2.36
  telemetry writer and the T2.19 reader and ops writer serving functions, named only as owners of the touched code; closes
  no roadmap exit criterion (no open T2.19 or T2.36 criterion is advanced).
scope:
- file: src/common/ducklake_handler_errors.py
  action: Create
  purpose: >-
    Leaf helper shared by the three serving handlers (imports only stdlib and src.common.ducklake_runtime's
    is_dead_connection_error; no import-time side effects). (1) unmapped(exc, *, function, action, request_id, elapsed_ms) ->
    tuple[int, dict]: status 500, body {ok: false, error_type: "unmapped", error_class: type(exc).__name__, request_id, action,
    elapsed_ms}; never str(exc). Before returning it prints ONE JSON line {event: "ducklake_unmapped_error", function, action,
    error_class, request_id, chain (class names of __cause__/__context__, at most 3), frames (the last 10 traceback frames as
    "path:function:line", no locals), message: redact(str(exc))}. (2) catalog_unavailable(exc, *, function, action,
    request_id, reopened) -> tuple[int, dict]: status 503, body {ok: false, error_type: "catalog_unavailable", error_class,
    request_id, action, reopened}; logs the same line shape with event "ducklake_catalog_unavailable". (3) terminal(exc, ...)
    dispatching between the two on rt.is_dead_connection_error(exc). (3b) TRANSIENT_ERROR_TYPES = frozenset({"catalog_unavailable"}),
    the authority the Decision 155 classifier's literal is asserted equal to. (4) redact(text) -> str: replaces password=VALUE,
    X-Amz-*=VALUE, arn:... tokens and any run of 12 or more digits with a fixed marker, keeps the first line only and
    truncates to 300 characters. (5) bad_request(function, action) -> tuple[int, dict]: 400 {ok: false, error_type:
    "bad_request", error: "request body is not a JSON object"}. (6) A named_read_input log helper printing one
    ducklake_named_read_input line {function, verb, error_class, request_id, message: redact(...)}. `action` is always a registered action name or the token
    "unknown", never the caller's string (the log_invocation rule, src/common/ducklake_metrics.py:71-76).
- file: src/lambdas/ducklake_telemetry_writer/handler.py
  action: Modify
  purpose: >-
    The terminal `raise` at handler.py:211 becomes the helper's terminal answer: a dead-connection error (at _warm_connection
    or mid-verb) answers 503 catalog_unavailable (reopened false; no reopen-once is added), anything else 500 unmapped, with
    request_id from context.aws_request_id (None when context is None) and the dispatched action or "unknown". Every mapped
    row is unchanged and keeps precedence. The docstring's "unmapped errors propagate" is replaced. _parse_body's 400
    bad_request row also catches RecursionError (a deeply nested body), as the reader and ops writer rows do.
- file: src/lambdas/ducklake_reader/handler.py
  action: Modify
  purpose: >-
    (1) handler(): a body that json.loads refuses (ValueError, RecursionError) or that is not a JSON object answers 400
    bad_request before dispatch; the invocation line logs status 400. (2) One outermost terminal except in handler() covering
    parse, _handle and _guard_response_size: rt.is_dead_connection_error -> 503 catalog_unavailable (reopened true when it
    survived the reopen-once at handler.py:336-343), anything else -> 500 unmapped; the invocation line logs the answered
    status. (3) action_named_read: an exception from rt.named_read that is not a dead-connection error, not a
    DuckLakeRuntimeError and whose class is one of InvalidInputException, ConversionException, OutOfRangeException or
    TypeMismatchException from the duckdb/_duckdb module (the classes a bound value or a registry error() guard raises) is
    raised as a NamedReadInputError and answered
    400 {ok: false, error_type: "named_read_input", verb, error_class, error: the DuckDB message passed through the helper's
    redact() (first line, 300 characters; defence in depth, since InvalidInputException is broad)}, and the helper prints one
    ducklake_named_read_input line {verb, error_class, request_id, redacted message} so a misclassified server-side
    InvalidInputException can be found by request id; every other DuckDB class falls through to 500 unmapped (class name only: BinderException and
    ParserException mean registry-versus-schema drift, since callers send no SQL (Decision 84 I-3), and IOException,
    CatalogException, HTTPException and the rest carry URLs, hosts and paths). The dead-connection check stays first so the reopen-once path is
    unchanged. The "Any non-connection error still propagates (Decision 55)" comment is reworded to the new terminal posture.
- file: src/lambdas/ducklake_writer/handler.py
  action: Modify
  purpose: >-
