acceptance_criteria:
- >-
  No request that reaches the telemetry writer, reader or ops writer handler code answers 502: an exception no row maps
  answers 500 {ok: false, error_type: unmapped, error_class, request_id, action, elapsed_ms} with no exception message, and
  one ducklake_unmapped_error log line carries the class, request id, frames and the redacted, truncated message.
  Process-level failures (timeout, out of memory, Runtime.ExitError, an init failure) still answer the runtime's 502 and
  count in AWS/Lambda Errors by design (rec-4296 owns the reader's).
- >-
  A dead catalog connection that fails at connect or survives the reopen-once answers a typed 503 catalog_unavailable; the
  reader client retries it, the ops writer transport retries it for replay-safe requests only (an idempotency_ulid or
  update_ops, unchanged), and the Decision 155 classifier treats it (and only it among error_type-bearing failures) as
  transient.
- >-
  A reader named verb whose bound value or error() guard raises a caller-input DuckDB class answers 400 named_read_input with
  the DuckDB message (live: recs_related with 201 exclude_ids answers 400 naming "narrow the query"); the client raises it
  after one POST, and the agent SDK maps it to ReaderInputError. Every other DuckDB class answers 500 unmapped with the
  class name only.
- An unparseable or non-object body answers 400 bad_request on all three serving functions.
- >-
  Both writers' errors alarms sum AWS/Lambda Errors and Url5xxCount with FILL(..., 0), threshold > 0 over 900 s, and the
  applied alarms read back with that expression.
- >-
  A failing --lambda-telemetry vector prints error_class and request_id, never a message, ARN or account id.
- >-
  The plan 3 part 2 and blob-route plans no longer assume a raise-to-502 or Errors-only zero check; Decision 155 carries the
  dated catalog_unavailable amendment; the three contracts declare the typed answers.
- >-
  rec-4282 is closed by PR B's Resolves trailer. rec-4294 is cited, not bundled: PLAN-telemetry-owner-provisioning closes
  it.
