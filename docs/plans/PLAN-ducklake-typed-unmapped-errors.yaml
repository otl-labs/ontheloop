  PR B redeploys the DuckLake functions through deploy-ducklake-lambdas.yml (src/lambdas/ducklake_*/** and
  src/common/ducklake_*.py are push paths; Decisions 79/125/126). PR B carries the Decision 155 amendment, so its merge waits
