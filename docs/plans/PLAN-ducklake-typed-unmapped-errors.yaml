  terraform-apply-sandbox applies the reviewed plan (Decision 77/126). PR B (everything else) merges only after PR A's apply
  is green, so a typed 5xx never ships unwatched. Spend: each alarm goes from one to two metrics, about USD 0.10 a month
  each, signed off by Benjamin on the decision card (2026-10-14).
- >-
  PR B merges only after the Writer grant fix (PLAN-telemetry-owner-provisioning, thread "Writer grant fix plan", which
  bundles and closes rec-4294) is deployed and its --lambda-telemetry gate printed TELEMETRY_PROVISION_OK: PR B's own governed deploy runs the same
