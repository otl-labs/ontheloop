  command: >-
    bin/venv-python -m pytest tests/test_ducklake_artifacts.py::test_prmerge_concurrent_same_file_zip_identity
    tests/test_ducklake_attribution.py::test_push_same_inputs_different_bytes_fails_closed
    tests/test_ducklake_attribution.py::test_push_mismatch_without_inputs_record_fails_closed
    tests/test_ducklake_attribution.py::test_push_layer_mismatch_without_moved_input_fails_closed
    tests/test_ducklake_attribution.py::test_push_partly_attributed_mismatch_fails_closed
    tests/test_ducklake_attribution.py::test_push_unset_merge_sha_fails_closed
    tests/test_ducklake_attribution.py::test_push_inputs_record_not_describing_reference_fails_closed
    tests/test_ducklake_attribution.py::test_push_schema_mismatch_fails_closed
    tests/test_ducklake_attribution.py::test_push_malformed_inputs_record_fails_closed
