schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: true
slug: ducklake-zip-inputs-moved
intent: >-
  Stop the sandbox auto-apply failing closed when main gains a change to a DuckLake-packaged file between a
  terraform/personal PR's last speculative plan and its merge: the push-path zip check compares like with like, applies
  the reviewed saved plan with zips rebuilt from the merge commit when every difference traces to an input that moved
  on main, and keeps failing closed on any difference it cannot attribute.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ducklake-zip-inputs-moved.yaml
phase: >-
  ci_rca (soft-warn category): forward fix for the Critical ci_rca rec-4372 (terraform-apply-sandbox run 38905586484).
  No tier_item is claimed and no exit criterion is closed.
scope:
- file: scripts/ci/ducklake_inputs.py
  action: Create
  purpose: >-
    Pure input-identity record and attribution, no network. record_inputs(packages_dir, names, root) returns a
    JSON-ready dict: schema 1; tooling, the git blob id of each of scripts/build_lambda.py,
    scripts/build_lambda_config.py, scripts/build_lambda_packaging.py, scripts/build_lambda_deploy.py and
    scripts/lambda_manifest.py; and per named artifact its md5, its kind (layer when the name ends -layer.zip, else
    function), its entries as name -> uncompressed sha256 read from the built zip, and its inputs as path -> git blob
    id. A function artifact records the blob id of the manifest whose artifact field names it
    (src/lambdas/<slug>/manifest.yaml). A function zip entry has an input only when it is a git-tracked file at that
    repo path AND the git blob hash of the entry's uncompressed bytes equals the checkout's ls-files blob id (a proven
    verbatim copy, scripts/lambda_manifest.py stage_bundle); any other entry has no input. A layer's input is
    config/lambda/ducklake/version.yaml (its pins live in the tooling). Blob ids come from git ls-files -s at root,
    which works on a depth-1 checkout. attribute(reference, current) returns a verdict for every artifact whose md5
    differs: moved, with the moved paths, when any tooling blob differs; for a layer, when its input moved; for a
    function zip, when every differing entry is attributed, where an entry present in both zips is attributed only
    when it has an input on BOTH sides and the two blob ids differ; an entry only in the current zip only when it has
    an input there AND either the manifest blob moved or the path lies under a directory include of the current
    manifest; and an entry only in the reference only when it had an input there AND either the current manifest no
    longer packages the path or the path is no longer tracked in the current checkout. A present entry lacking an
    input is never attributed. A verdict is {"verdict": "moved" | "unattributed", "inputs": [...], "reason": str}; for
    a moved function zip, inputs lists its differing entry paths (plus any moved tooling path); for a moved layer, its
    moved input or tooling paths. Otherwise unattributed, naming the first entry that blocked attribution or saying
    only the container bytes differ. A reference whose schema differs from the current one, or that lacks an artifact
    the current record carries, is unattributed for every artifact (fail closed); a change to the record format bumps
    schema. Attribution iterates the artifacts the current record carries, in DUCKLAKE_ARTIFACT_NAMES' order (the push
    path always records all seven; VP step 3's replay records four).
- file: scripts/ci/ducklake_artifacts.py
  action: Modify
  purpose: >-
    (1) main() gains --mode upload-only: runs exactly the replaced action line's build, python -m scripts.build_lambda
    --ducklake-only --profile "" --bucket <bucket> with no --skip-upload (so build_lambda's own dual-write uploads all
    nine zips, unchanged), then uploads record_inputs(...) as lambda-packages/<artifact_sha>/inputs.json; it never
    calls assert_and_upload, and a failure to record or upload the record fails the step (exit 1, fail loud before
    merge). (2) assert_and_upload gains a keyword-only merge_sha: str | None = None resolved from GITHUB_SHA inside
    the function (main()'s call is unchanged). The push-path assert computes every md5 before uploading anything. All
    equal: first read lambda-packages/<artifact_sha>/superseded-by.json with the absence predicate in (3); present or
    unreadable -> fail closed (only the moved branch may create a pointer); absent -> unchanged (re-upload fixed and
    per-sha keys, DUCKLAKE_ZIP_IDEMPOTENT_OK). Any mismatch: read lambda-packages/<artifact_sha>/inputs.json, check
    that its md5 for every artifact equals the md5 of the reference zip just read and that its entries map equals the
    entries read from that zip (else it does not describe the reference: fail closed), compute the current record from
    the local build and checkout, and attribute every mismatched artifact. All moved: print DUCKLAKE_ZIP_INPUTS_MOVED
    naming each artifact and its moved inputs, upload all seven zips to the fixed key and to lambda-packages/<merge
    sha>/ (the merge sha from (2)), upload the current record as lambda-packages/<merge sha>/inputs.json, then write
    lambda-packages/<artifact_sha>/superseded-by.json as JSON {"schema": 1, "artifact_sha": <merge sha>, "reason":
    "DUCKLAKE_ZIP_INPUTS_MOVED", "moved": {<artifact>: [paths]}}; never write any zip under
    lambda-packages/<artifact_sha>/. Otherwise, or when inputs.json is missing, or the merge sha is unset or equals
    artifact_sha, or any exception arises while reading or parsing inputs.json, computing the current record (a git
    failure, an unreadable rebuilt zip) or attributing (malformed record internals): raise DUCKLAKE_ZIP_MISMATCH
    exactly as today (first line unchanged, then the entry diff, then one last line saying why it was not attributed),
    with no upload. (3) fetch_reviewed first reads lambda-packages/<artifact_sha>/superseded-by.json. It is absent
    only when the error carries the botocore ClientError response shape with Error.Code NoSuchKey or 404 (read
    duck-typed from exc.response, so no botocore import is added); every fetch call site assumes the apply role, which
    holds s3:ListBucket on the bucket (terraform/bootstrap/github_ci_apply_reads.tf DataLakeBucketManage), so a
    missing key is a 404, and a 403 or any other error fails closed. Absent -> unchanged; present, schema 1, and
    naming a 40-hex artifact_sha other than artifact_sha -> fetch and copy from that sha's prefix instead, one hop
    only, printing both shas in DUCKLAKE_FETCH_OK; malformed, unreadable for any other reason, or self-referencing ->
    DucklakeArtifactError before any copy. The missing-object all-or-nothing check is unchanged. (4) rec-4198:
    _zip_entry_diff catches any Exception for the diagnostic only, so it can never replace DUCKLAKE_ZIP_MISMATCH.
    Module docstring updated. Stays under 500 SLOC (238 at planning).
