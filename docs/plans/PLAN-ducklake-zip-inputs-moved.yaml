- file: tests/test_ducklake_attribution.py
  action: Create
  purpose: >-
    Push-path and fetch behaviour of scripts/ci/ducklake_artifacts.py beyond the two filed nodes, over the shared
    fakes. Fail-closed nodes (each raises DUCKLAKE_ZIP_MISMATCH with no upload AND asserts the message's final
