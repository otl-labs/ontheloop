    tests/test_ducklake_attribution.py::test_push_merge_sha_equals_artifact_sha_fails_closed
    tests/test_ducklake_attribution.py::test_fetch_follows_pointer_one_hop
    tests/test_ducklake_attribution.py::test_fetch_bad_pointer_fails_closed
    tests/test_ducklake_attribution.py::test_fetch_pointer_target_missing_fails_closed -q
  expected: Exit 0; every selected node passes (15 nodes; more items if any is parametrized). Red before, because the nodes do not exist; written first, the acceptance node fails on DUCKLAKE_ZIP_MISMATCH.
  expected_literals: []
  fix_if: A raise on the moved case, an upload on any fail-closed case, or a zip written under the PR head prefix -> fix ducklake_artifacts.py or ducklake_inputs.py, never loosen a test.
