    (malformed, self-referencing, a 403-shaped error) and test_fetch_pointer_target_missing_fails_closed, each failing
    before any copy. test_main_upload_only_writes_inputs_record (the build subprocess is exactly scripts.build_lambda
    --ducklake-only --profile "" --bucket <bucket> with no --skip-upload, the record lands at
