    APPROVED SENTENCE:
    Decision 154 / rec-2862's fetch_reviewed() route (scripts/ci/ducklake_artifacts.py): the human-gated apply paths (gated-apply, both Reconcile jobs) fetch the already-reviewed per-sha artifacts, or the merge commit's push-time artifacts when the push run left a superseded-by.json pointer because the PR-time zips predate inputs that moved on main (rec-4372), and server-side copy them onto the fixed key instead of rebuilding; Terraform reads none of them (see the never-read rule in conformance.description).
- file: docs/DECISIONS.md
  action: Modify
  purpose: |-
    Append, after Decision 154's **Related:** line (a blank line, then exactly this one line; allowed variance: the
    date only; approved by Benjamin 2026-10-17, see context, with the 30-minute correction he confirmed at 15:49Z). No other
    Decision is edited (Decision 177 append-only).
    APPROVED LINE:
    > **Update (2026-10-17):** rec-4372 showed point 1's push-path canary premise was wrong: its window has no upper bound, running from the PR's last speculative plan to the merge (about 30 minutes there), so the PR-time reference goes stale when main changes a packaged file in between (#1519's zips predated #1520's edit to `src/common/ducklake_handler_errors.py`). The speculative-plan job now records each artifact's inputs at `lambda-packages/<PR head sha>/inputs.json`. When every difference at merge traces to an input that moved on main (`DUCKLAKE_ZIP_INPUTS_MOVED`), the push run applies the saved plan.bin unchanged, writes the rebuilt zips to the fixed key and `lambda-packages/<merge sha>/`, and leaves a `superseded-by.json` pointer beside the untouched PR-time zips. Point 1's fetch follows that pointer one hop: gated-apply and Reconcile copy bytes fixed at push time, before any approval wait, whose identity rests on the input attribution rather than a PR-time byte match. Any other difference, or a missing reference or record, still fails closed as `DUCKLAKE_ZIP_MISMATCH`; the check is now a same-inputs canary, and a pre-merge double-build canary stays with rec-4194.
bundled_recommendations:
- rec-4372
- rec-4198
followon_recs:
- rec-4381
infrastructure_dependencies: []
acceptance_criteria:
- >-
  When a packaged file changes on main after a terraform/personal PR's speculative plan, the merge's push run attributes
  the zip difference to that file, applies the reviewed saved plan.bin unchanged, writes the rebuilt zips to the fixed
  key and the merge commit's prefix, and leaves the PR head prefix's zips untouched (hermetically, and replayed on the
  real incident commits).
- >-
  Any zip difference that does not trace to a moved input (same inputs with different bytes, a layer whose tracked
  inputs did not move, a missing inputs record) still fails closed as DUCKLAKE_ZIP_MISMATCH before any upload.
- >-
  The human-gated fetch routes (gated-apply, both Reconcile jobs) copy the merge-prefix zips when a pointer exists and
  fail closed on a bad pointer; a pointer the push run did not write (present when every zip matched) fails the push
  run closed.
- >-
  The PR speculative-plan job still builds and dual-writes all nine zips through build_lambda and then writes
  inputs.json, with no change to the composite action's inline body size.
- Decision 154 carries the approved dated Update line and environment-taxonomy.yaml the approved sentence (VP step 9).
- >-
  On the first terraform/personal PR after the merge, its speculative plan writes an inputs.json that describes its
  zips, and its merge's push run gets past the zip check (live, read-only).
- >-
  rec-4198 closes through the squash commit's Resolves trailer; rec-4372 closes through the manual closure route with
  closure_artifact shard:ducklake-zip-inputs-moved and the merge sha as fixed_by_sha.
