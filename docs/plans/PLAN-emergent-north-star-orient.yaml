  action: The skill fits its budget, its entry ratchets to the measured bytes, and no raise marker is added.
  command: bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as p; from scripts.checks.prose.prose_budget_raises
    import validate_prose_budget_raises as r; f=[]; p(f); r(f); assert not f, f; print('BUDGETS_OK')" && test "$(wc -c < .claude/skills/orient/SKILL.md)"
