execution_steps:
- 'Preconditions on origin/main, before any edit; if any fails, stop and tell the coordinator: VP 1 passes; `bin/venv-python -m scripts.roadmap.approved_text
  record --slug emergent-north-star-orient` prints the plan''s digest; every block applies exactly once to the unedited tree: `bin/venv-python
  -c "from scripts.roadmap.approved_text import load_sidecar, apply, words; s=load_sidecar(''emergent-north-star-orient''); fs=sorted({b.file
  for b in s.blocks}); [apply(words(open(f, encoding=''utf-8'').read()), [b for b in s.blocks if b.file == f]) for f in fs]; print(''BLOCKS_APPLY_OK'',
  len(s.blocks))"` prints BLOCKS_APPLY_OK 8. Byte sizes are measured after applying, never compared to a fixed figure.'
- Create scripts/preflight/emergent_north_star.py and its two suites per their scope rows; wire scripts/session/preflight.py, the conftest stub
  and the decomposition constant and stub; run VP 2-4, VP 6 and VP 8.
- Apply every block of docs/plans/approved/emergent-north-star-orient.yaml, ratchet config/prose_budgets.yaml to the measured bytes; run VP 5,
  7 and 9.
- Create the three registry shards (emergent-north-star-bucket and emergent-north-star-orient-pins as test_selector over the VP 2 and VP 6 suites,
  emergent-north-star-coverage as command_exit_zero over the VP 3 command; plan_slug emergent-north-star-orient); re-pin the T4.36 shard; after
  the verified VP pass, run the bookkeeping walk with completion_compaction and the two tier-item-lifecycle.yaml rows, quoting the scope rows
  exactly; run VP 10 and 11.
- 'Commit with "Resolves: rec-2413" as its own Key: value paragraph in the implementation commit message (git-ops.yaml resolves_trailer: TRANSPORT);
  fetch and merge origin/main (never a force push); run VP 12 on the clean committed tree (git-ops.yaml handoff_sequence). Push as its own tool
  call, open the build PR and drive CI green by event-driven wake. Independent code review; merge only on code review PROCEED, green CI and Benjamin''s
  word on the final diff for what no sidecar binds (the two tier-item-lifecycle.yaml rows and the T4.36 closeout; Decision 246 clause 4), through scripts.session.merge_step premerge, merge_pull_request with an explicit commit_message
  carrying the trailer and the expectedHeadSha premerge checked, then merge_step readback and VP 13.'
- 'Closure evidence as four separate facts (implement skill Commit Flows): GitHub readiness, VP 11 plus --verify-head for the pushed HEAD, structured
  postflight evidence, and the real outcome (push, PR, CI green by wake, merge SHA).'
- 'Report: what was implemented and the verification results.'
