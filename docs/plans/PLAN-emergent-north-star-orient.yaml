  files on every preflight and held only in the gitignored cache, that finds amends/supersedes clusters converging on shared intent vocabulary,
  Decisions that later entries keep citing, and the clusters no north star covers; /orient renders it as a read-only, chat-only Section 7. Nothing
  is promoted, filed or stored.'
