  action: The decomposition suite holds the 56-key report and the YAML parse budget still holds with the bucket's north-star read.
  command: bin/venv-python -m pytest tests/test_session_preflight_decomposition.py tests/session/preflight/test_yaml_parse_budget.py -q
  expected: Every node passes.
  fix_if: A key-set mismatch means the constant and the report disagree; the report key is emergent_north_star. A budget failure means the bucket
    parses more YAML than the north-star file (16.7 KB); read the index as JSON and the decision files through the parser only.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Both files are standing suites run in both tiers (TestReportSchemaFreeze and the parse budget guard).
- step: 9
