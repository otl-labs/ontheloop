acceptance_criteria:
- 'T4.36:c6 -- /orient carries a read-only, chat-only Section 7 rendered from the preflight bucket emergent_north_star: amends-cluster convergence
  (vocabulary-filtered components of 4 or more), recency-normalised in-degree (share of later live entries citing, hubs listed apart) and uncovered
  clusters, read as no carried_by member and no serves: a superset of the criterion''s ''orphan clusters by serves'', since serves is declared
  on 0 of 78 eligible rows and carried_by is the authoritative link (docs/contracts/decision-entry.yaml). VP 2, 5, 6.'
- The detector is pure-local, never raises, holds no import-time I/O, is byte-identical across two calls and fully covered, and the coverage check
  graduates. VP 2, 3.
- On the live corpus the bucket carries no error, runs in under 2 seconds, and the back-test before Decision 243 with no north stars ranks [178,
  184, 205, 209, 233] first. VP 4.
- The preflight report carries emergent_north_star, the frozen key list holds 56 keys, and main()-level tests run the stub. VP 2, 8.
- The orient command and skill equal the sidecar's text read at the base; the skill shrinks and its entry ratchets with no marker. VP 5, 9.
- T4.36 is complete with c6 met by this plan, compacted per completion_compaction; the re-pinned shard prints T436_OK; T4.36 is in archival_exceptions;
  the registry differential admits the re-pinned and three new shards. VP 10.
- rec-2413's acceptance passes before merge and the build merge's trailer closes it. VP 7, 13.
- scripts.validate --pre and the full tier exit 0, and --verify-head attests HEAD. VP 11, 12.
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'Precondition: the plan and its sidecar are on origin/main, the branch contains origin/main, and the scout-north-star-lane build has
    met T4.36 c5 (Decision 245 sequencing).'
  command: 'git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-emergent-north-star-orient.yaml && git cat-file -e origin/main:docs/plans/approved/emergent-north-star-orient.yaml
    && git merge-base --is-ancestor origin/main HEAD && git show origin/main:docs/ROADMAP-PLATFORM.yaml | bin/venv-python -c "import sys,yaml;
    t=[x for x in yaml.safe_load(sys.stdin)[''tier_items''] if x[''id'']==''T4.36''][0]; c={x[''id'']: x for x in t[''exit_criteria'']}; assert
    c[''c5''][''status'']==''met'' and c[''c6''][''status'']==''open'', c; print(''PRECONDITION_OK'')"'
  expected: Prints PRECONDITION_OK.
  fix_if: 'A missing file: the plan PR has not merged, stop. An AssertionError on c5: the scout-lane build has not landed, stop and tell the coordinator
    (never build ahead of it). A failing ancestry test: merge origin/main first.'
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: 'Run the detector suite: rules, bounds, ordering, determinism, loaders, the error path and the preflight glue.'
  command: bin/venv-python -m pytest tests/session/preflight/test_emergent_north_star.py -q
  expected: 'Every node passes. Red before: the file does not exist (collection fails).'
  fix_if: A rule failure means the module is wrong; fix the module, never the assertion.
  hermetic: false
  graduation: graduate
  graduation_check_id: emergent-north-star-bucket
- step: 3
  phase: pre-deploy
  action: Prove the new module is fully covered (no coverage_baseline entry, so 100% applies).
  command: bin/venv-python -m pytest tests/session/preflight/test_emergent_north_star.py --cov=scripts.preflight.emergent_north_star --cov-report=term-missing
    --cov-fail-under=100 -q
  expected: '100% for scripts/preflight/emergent_north_star.py; exit 0. Red before: the module does not exist (collection fails).'
  fix_if: 'Cover the missing branch with a test; never register a coverage_baseline entry for a new file (Decision 159). This shard is the standing
    guard: map_source_to_test returns None for scripts/preflight/*, so the coverage gate skips the module (rec-2634).'
  hermetic: false
  graduation: graduate
  graduation_check_id: emergent-north-star-coverage
- step: 4
  phase: pre-deploy
  action: 'One-time live-corpus evidence (Decision 244 clause 4: later Decisions and archival change these numbers): the real bucket carries no
    error, two calls are byte-identical, one call takes under 2 seconds, and the back-test (live entries numbered below 243, no carriers) ranks
    the 2026-10-30 promotion cluster first.'
  command: bin/venv-python -c "import json,time; from datetime import date; from scripts.preflight import emergent_north_star as m; t=time.monotonic();
    a=m.preflight_bucket(); s=time.monotonic()-t; b=m.preflight_bucket(); assert 'error' not in a, a; assert json.dumps(a,sort_keys=True)==json.dumps(b,sort_keys=True);
    assert s < 2.0, s; e=[x for x in m.load_entries(None, None) if x.number < 243]; r=m.detect(e, {}, date(2026, 10, 29)); assert r['clusters'][0]['members']==[178,
    184, 205, 209, 233], r['clusters'][:2]; print('LIVE_OK clusters=%d rising=%d' % (a['cluster_count'], len(a['rising'])))"
  expected: Prints a LIVE_OK line (9 clusters and 5 rising entries on 34c25c58).
  fix_if: 'An error key names the failing read; fix the loader. A back-test miss means a rule drifted from the plan (ordering is uncovered, cohesion,
    size, number); compare with /mnt/project-files/orient-detector/evidence/v3.py. Over 2 seconds: profile the all-pairs loop, never sample it.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Moment claim (Decision 244 clause 4) over the live corpus; the fixture suite (VP 2) is the standing guard.
- step: 5
  phase: pre-deploy
  action: The orient command and skill words equal the approved sidecar, read at the base.
  command: bin/venv-python -m scripts.roadmap.approved_text verify --slug emergent-north-star-orient --expect 0248dcc9a3b7a94bb6c5ce5637bab86cd5c19bcd4a2bde00acbefda2b3c699fa
  expected: Exit 0 (APPROVED-TEXT OK 0248dcc9a3b7a94bb6c5ce5637bab86cd5c19bcd4a2bde00acbefda2b3c699fa).
  fix_if: 'A MISMATCH: restore the sidecar''s words exactly; any other wording needs Benjamin''s new approval. This step reads no approval provenance;
    PR CI''s provenance leg is in constraints.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Duplicates validate_merge_step's approved-text leg, which reads the sidecar at the PR base on every PR.
