    assert any(''PLAN-emergent-north-star-orient'' in str(r.get(''summary'')) for r in d[''amendment_log'']); print(''LIFECYCLE_OK'')" && bin/venv-python
    -m pytest tests/test_roadmap_archive.py -q -k Lifecycle && bin/venv-python -c "from scripts.checks.verification.validate_verification_registry
