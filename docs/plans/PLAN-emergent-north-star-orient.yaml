  command: bin/venv-python -m pytest $(grep -rlE 'orient\.md|orient/SKILL\.md|skills" / "orient|commands" / "orient' tests --include='test_*.py'
    | sort) -q && grep -q 'and advisory emergent north stars. Writes nothing.' .claude/commands/orient.md && grep -q 'seven-section chat deliverable'
    .claude/commands/orient.md && echo REC_2413_OK
  expected: Every node passes, then REC_2413_OK.
  fix_if: A pinned literal was lost (for example 'except Section 2's CI-RCA triage rendering' or the 'Preserve the "do NOT surface' marker); restore
