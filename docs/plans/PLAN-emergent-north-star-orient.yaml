scope:
- file: scripts/preflight/emergent_north_star.py
  action: Create
  purpose: 'The detector (pure-local, credential-free, read-only, no import-time I/O, under 500 SLOC; the decision_conditions.py bucket pattern).
    Imports only the standard library, scripts.decisions_md.parse_decisions_md, scripts.north_star_models.load_north_star and scripts.north_star_shortlist.carriers.
    Frozen module constants: DETECTOR_VERSION = 1; STOPWORDS (the prototype list in /mnt/project-files/orient-detector/evidence/v3.py, verbatim);
    TOKEN = [a-z][a-z0-9_]+(?:-[a-z0-9_]+)* over lowercased text, tokens over 2 characters not in STOPWORDS; DF_MIN = 2, DF_MAX_SHARE = 0.15;
    CUT_PERCENTILE = 0.95, CUT_FLOOR = 0.03, CUT_CEIL = 0.08; MIN_CLUSTER = 4; HUB_PERCENTILE = 0.90; MIN_CITERS = 3; MIN_LATER = 10; MAX_CLUSTERS
    = 5, MAX_TERMS = 5, MAX_RISING = 5, MAX_HUBS = 10. A frozen Entry dataclass (number, text, amends, supersedes, related, kind, serves, decided).
    detect(entries, carriers, today) -> dict is pure: (1) kept tokens are those in DF_MIN to DF_MAX_SHARE x N live entries, idf = ln(N/df); similarity
    is IDF-weighted Jaccard (0.0 on an empty union). (2) edge_cut is the exact CUT_PERCENTILE of all live-pair similarities (sorted[int(p x (n
    - 1))], no sampling), clamped to [CUT_FLOOR, CUT_CEIL]. (3) Edges are distinct unordered live pairs from each entry''s amends and supersedes;
    an edge is kept when its similarity >= edge_cut. (4) Clusters are connected components of kept edges with >= MIN_CLUSTER members: members
    sorted; terms are kept tokens in at least max(2, ceil(size/2)) members ordered (-member count, -idf, token), first MAX_TERMS; carried maps
    each carriers key whose set meets the members to that count; served counts members'' serves ids; uncovered = not carried and not served; kinds
    counts kind values ("undeclared" when null); mean_similarity is the 3-dp mean of kept-edge similarities inside the component. Order: uncovered
    first, then mean_similarity desc, size desc, lowest member; emit MAX_CLUSTERS, with cluster_count the total. (5) citers[m] are the distinct
    live entries n > m whose Related line names m; hub_cut is the HUB_PERCENTILE of citer counts over live entries (same percentile rule); hubs
    are entries with citers > hub_cut ordered (-citers, number), first MAX_HUBS, with hub_count. Rising entries have citers >= MIN_CITERS, >=
    MIN_LATER later live entries, citers <= hub_cut, no carriers membership and kind != mechanism; each carries decision, citers, later, share
    = round(citers / later, 3), months = round(max(1.0, days since decided / 30.44), 1) or null when undated, per_month = round(citers / months,
    2) or null; ordered (-share, -citers, number), first MAX_RISING. (6) corpus = {live, amends_edges, kept_edges, edge_cut (3 dp), hub_cut, serves_declared
    (live rows with a non-empty serves), serves_eligible (live rows carrying the serves key), carried (live entries in any carried_by)}. Returns
    {detector_version, as_of (today, ISO), corpus, clusters, cluster_count, rising, hubs, hub_count}; every list is sorted and no set iteration
    reaches output. load_entries(index_path, decisions_paths) builds live Entries from docs/decisions-index.json (live, amends, supersedes, kind.value,
    serves, decided_date) and one parse_decisions_md() call (text = title + Intent + Problem, else the index triage_excerpt when both are empty;
    related = related_decisions); decided is the row''s YYYY-MM-DD date, a YYYY-MM date as its first day, else the nearest lower-numbered index
    row''s date, else null (never today). carriers are scripts.north_star_shortlist.carriers(load_north_star(path)) as frozensets: that function
    is the one home of the mission-plus-active-principles mapping, reused, never re-derived. preflight_bucket(index_path=None, decisions_paths=None,
    north_star_path=None, today=None) never raises: today defaults to the UTC date, and any exception returns {"detector_version": 1, "error":
    "<type>: <message>"}. The planning prototype is illustrative only (it reads files at fixed paths and carries no error path).'
- file: tests/session/preflight/test_emergent_north_star.py
  action: Create
  purpose: 'V2 detector tests, hermetic (synthetic Entry lists and tmp_path files, never the live corpus), under 400 SLOC: a four-member amends
    chain sharing terms clusters and a three-member one does not; an edge below the cut is dropped; the cut clamps to the floor and the ceiling;
    uncovered, carried, and serves-only coverage (served non-empty, carried empty, uncovered false); an all-mechanism cluster is kept and its
    kinds counted; cluster order (uncovered, cohesion, size, number) and the MAX_CLUSTERS cut with cluster_count; term order and cap; rising excludes
    a hub (listed in hubs), a carried entry, a kind: mechanism entry, fewer than 3 citers and fewer than 10 later entries; share order and its
    tie-breaks; months and per_month, the year-month date, the nearest-lower-row fallback and null when undated; two calls byte-identical under
    json.dumps(sort_keys=True); the constants and the STOPWORDS sha256 pinned. load_entries over a tmp DECISIONS.md and index: the excerpt fallback,
    the Related line through the shared parser, archived rows ignored. preflight_bucket returns an error bucket (no raise) for a malformed north-star
    file and a missing index. A glue test runs main() under the package''s seams with preflight_bucket patched and asserts report["emergent_north_star"]
    equals the canned bucket (boto3 importorskip inside that test only). 100% line coverage of the module. The orient text pins live in their
    own module (below), per Decision 128 decompose-by-default.'
