  expected: 'Every node passes. Red before: the file does not exist (collection fails).'
  fix_if: A missing phrase means the text differs from the sidecar; restore the sidecar's words, never edit the test to match.
  hermetic: false
  graduation: graduate
  graduation_check_id: emergent-north-star-orient-pins
