constraints:
  - Never add id-token or secrets to approved-text-approval.yml; the approve job gains only contents read and actions read (Decision 246; its header).
  - No new job in terraform-github-apply.yml (fence c), no workflow_call (validate_trusted_plan_environment c), no expression inside a run body (fence j).
  - Every python call in a governed job is isolated (-I) and executes only code-owned paths (validate_trusted_plan_environment h).
  - The approvals check runs before any credential, OIDC or secret-reading step and writes nothing later steps read.
  - Never loosen an existing predicate or assertion beyond the one planned change (Decision 235); never skip a test to get green.
  - No terraform apply and no Environment change from this plan; deployment-approval-probe.yml is not edited.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout r1 FLAGS_FOUND. CITE: Decisions 92, 94, 246, 248, 238, 183, 233, 162. Decisions triaged: 202 of 202. Roadmap items intersected: 3; CONFLICT: 0; RELATED: 3. Serves: NS.9 5/5 -- This directly stops GitHub-held human approval from failing open: a reviewer-gated job can no longer run unattended when its Environment loses its required reviewers."
  - "Scout flag Decision 212 (WARN) resolved: ports.yaml SA-09 in scope. The script does not reuse approved_text_github.approvals because it runs inside credentialed jobs before any credential under python3 -I with no installed packages, and must be its own whole code-owned import closure (Decision 238 cl.3; validate_trusted_plan_environment h); approved_text_github imports approved_words (pyyaml, pydantic)."
  - "Scout flag Decision 154 (NOTE) resolved: no allow-list change. The approvals step precedes the OIDC step (guard predicate c pins it), so on a refusal in gated-apply or gated-apply-reconcile the always-run record write has no credentials and cannot reach S3: the record keeps its prior value, as for every pre-credential failure today (terraform-apply-sandbox.yml's VP10 note), and nothing latches red. In the sandbox job ci-rca still fires (attempt-1 workflow_run; run_attempt != 1 self-dispatch); ci-rca does not watch reconcile.yml (ci-rca.yml:18-27), so a reconcile refusal is visible to whoever dispatched it, as every reconcile failure is today. Decision 154's closed allow-list is untouched; the step id is not added."
  - "pypi is UI-managed until rec-4549 brings it into terraform/github (Decision 126 drift); rec-4651 (tf-gated-apply main-only policy) and rec-4913 are related, not bundled. Follow-on rec-5001 (filed at planning, read back open): the branch-policy-only tf-trusted-plan Environment's live check."
  - "Fable consult (blind, facts-only): /mnt/project-files/fail-closed-gates/advisor-brief/ (BRIEF.md, ADVICE.md); adopted except the upstream environment check is not added to apply-sandbox or apply-reconcile (convergence-record semantics, Decisions 154/183)."
  - "Split: rec-4960 (wake comment on empty approvals) and rec-4980 (push-run neutral exit) are planned separately; rec-4980 also edits terraform-github-apply.yml and validate_github_settings_apply.py, so the second build to merge rebases."
  - "rec-4965 (move the apply job to tf-github-apply) needs no change here: the guard derives the literal and the admin-bypass flag from the job and terraform/github."
  - "Residuals stated, not fixed: approvals are recorded per run, not per attempt, so a re-run attempt is satisfied by an earlier attempt's approval; whether an admin bypass writes an approvals entry is unproven (with the reviewer-login check a bypass by a non-listed admin fails closed); the time between the upstream read and the gated job's start is covered by the in-job check."
  - "Recovery once a gate Environment is missing or ungated: every gated job, terraform-github-apply's included, now refuses, so the repair is the operator's break-glass local apply of terraform/github (sessions get proxy 403); this is the intended fail-closed state. Before rec-4965 moves the apply job, tf-github-apply must exist (it does since run 42362739770) or the cutover's first run refuses."
  - "More residuals, stated not fixed: on a preflight refusal the sandbox and reconcile best-effort wakes still post their generic did-NOT-converge text (the sandbox one says ci-rca will file a rec) though the record is untouched; telling a refused-before-credentials outcome apart is wake truthfulness, adjacent to rec-4960, not this plan. terraform-github-apply.yml's preview and apply jobs set MASK_AWS_ROLE_ID_ACCOUNT_PART from a secret in job-level env, and the preview's environment check runs after its configure-aws-credentials step, so the github-settings-preview session credentials (state read only) are also in that step's process environment; the script never prints or forwards its environment, and the module docstring says so. The check lives in each job's own definition, so a workflow dispatched from a non-main branch could drop it, and the Environment's reviewers stay the only gate on that path (tf-gated-apply admits any branch until rec-4651/rec-4965; publish-ontheloop has no main-only if:); the module docstring names this. An operator admin bypass of tf-gated-apply (can_admins_bypass unset) is not known to write an approvals entry, so it will probably now fail closed in the job: an intended loss of that release valve, the operator approving as reviewer instead."
  - "Build-time re-checks: the next free structural_assumptions id (SA-09 assumes no unbuilt ports.yaml plan lands first) and each NEAR_CAP file's measured size on main."
  - "UNPROVEN until VP 8-9: actions read lets GITHUB_TOKEN read both endpoints (docs list both under Actions read); the GET environment body carries can_admins_bypass (the Terraform provider reads it from this endpoint). pypi's reviewers are UI-managed and assumed to be the logins in TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS. Read at planning (2026-11-08): the last two publish-ontheloop runs (40115871822 on 2026-10-24, 39824756406 on 2026-10-22) have an EMPTY approvals list and their publish job started 3 s after the run was created, so pypi was ungated then (rec-4549's 2026-10-22 finding; no later read shows a reviewer). After this build the next publish refuses (ENVIRONMENT_APPROVAL_MISSING) unless pypi has a listed reviewer by then: the intended fail-closed state, repaired by rec-4549 (or the operator's console reviewer). No live publish is run by this plan."
  - "Size relief (second blind Fable consult, /mnt/project-files/fail-closed-gates/advisor-brief/ADVICE.md part 2, adopted): reconcile.yml and terraform-apply-sandbox.yml sit at their structural roster entries; the plan extracts best-effort bodies (never the convergence precondition, Decision 77's sole hard block) rather than raising, joining lines or deferring the two jobs."
  - "plan_obligations at 6d1d1f14: no unmet obligation; advisories handled (NEAR_CAP relief rows above; validate_github_settings_apply and both scripts/ci modules gain no import, new_imports []); overlapping unbuilt plans on the shared files rebase whichever builds second."
  - "Sessions get proxy 403 on the environments endpoint (environments.tf:111-113; memory terraform-github-apply-blocked), so its proof is a CI job log; the run-approvals endpoint is readable from a session (approved_text_github.py approvals --run-id), which VP 8 uses as a second read. Read-only probe 2026-11-08 from this session: approved_text_github approvals --run-id 42410066873 printed state=approved environment=approved-text login=benjamin-blake (the entry shape the preflight reads)."
