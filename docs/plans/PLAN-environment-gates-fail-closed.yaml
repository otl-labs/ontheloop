    behavior: every refusal path fails closed; only a reviewer's approval for this Environment passes
    verification_step: 1
    test_selector: tests/test_environment_reviewer_preflight.py
    red_green_expectation: red before (absent), green after
  - source: scripts/checks/ci_guards/validate_environment_reviewer_preflight.py
    behavior: each predicate refuses its red case; the real tree passes
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_validate_environment_reviewer_preflight.py
    red_green_expectation: red before (absent), green after
  - source: scripts/checks/ci_guards/_manifest.py
    behavior: the new check is registered in the fast tier
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_validate_environment_reviewer_preflight.py
    red_green_expectation: red before (absent), green after
  - source: .github/workflows/approved-text-approval.yml
