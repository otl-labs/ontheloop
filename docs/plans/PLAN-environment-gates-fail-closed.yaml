execution_steps:
  - Write scripts/ci/environment_reviewer_preflight.py and its test to 100% coverage (VP 1).
  - Write the guard, its mirror and the manifest entry; run VP 2 against main's workflows first and confirm it reports every gated job.
  - Size relief first (VP 6 red before any workflow growth is impossible to see, so measure main first) -- extract reconcile's two wake bodies into apply_wake and sandbox's advisory body into convergence_advisory --post, with their tests, and confirm the messages and statuses are byte-identical.
  - Edit the six workflows, CODEOWNERS, ports.yaml SA-09, validate_github_settings_apply OWNED, the approved-text workflow test and the environments.tf comments; append the one taxonomy line (VP 2-4).
  - Run VP 5 and VP 6, then the full tier (VP 7) backgrounded per AGENTS.md; open the PR with Resolves rec-4979, rec-4961; code review; the operator's final-diff word (CODEOWNERS paths, security code); merge on green.
  - After merge run VP 8-10 and post the evidence on the PR; report to the coordinator.
rollback: Revert the merge commit; no infrastructure changed.
