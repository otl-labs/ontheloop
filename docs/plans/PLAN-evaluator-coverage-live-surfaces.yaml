      glob, and passes the same contract pointed at a live surface with a resolving trigger. Plus
      test_check_evaluator_asserts_need_evidence. Existing agent_surface cases (test_agent_surface_pass_and_fail,
      test_agent_surface_read_error_returns_false) gain an injected live table and row; their assertions are unchanged.
  - file: tests/checks/contracts/validate_contract_drift/test_evaluator_resolution.py
    action: Modify
    purpose: >-
      Its direct resolve_evaluator agent_surface cases (:97-:118) pass an injected live table and coverage row, so
      their existing assertions keep their meaning; plus test_gate_fails_a_retired_surface_and_prints_coverage: a
      tmp contracts dir holding instruction-architecture.yaml (one retired path) and contract-population.yaml (one
      evaluator_coverage row) fails a fixture contract naming the retired surface, and prints a Coverage line for it
      once re-pointed at a live surface.
bundled_recommendations: [rec-5263]
followon_recs: [rec-5285]
infrastructure_dependencies:
  - >-
    None. No .tf file, no Lambda-packaged path (scripts/checks and docs/contracts are in no manifest's patterns), no
    workflow, no AWS role. The tighter gate takes effect on merge through the existing validate --pre/full tiers.
acceptance_criteria:
  - "A Class D contract whose agent_surface is a retired surface, or a path in no layer glob and no consumer load, fails validate_contract_drift; a chain of one contract to a live surface resolves, and a loop, a self-pointer or a deeper chain fails with the chain named."
  - "An agent_surface contract with no evaluator_coverage triggers row, or whose trigger is absent from its surface or lacks the basename, fails the gate; a check contract's asserts key with no literal in the check fails it."
  - "A skill or command whose frontmatter description starts 'Being retired' and is not in retired_surfaces.paths fails the gate."
  - "The gate prints one Coverage line per Class D contract naming the keys asserted, instructed and neither, plus a totals line; the real tree passes."
  - "overseer-dispatch.yaml resolves against .claude/skills/planning/SKILL.md, and no Class D contract names the overseer skill, docs/DECISIONS.md, docs/ROADMAP-SEMANTO.yaml, docs/CLAUDE.md or instruction-architecture.yaml as its agent_surface."
  - "contract-population.yaml, instruction-architecture.yaml and deploy-paths.yaml differ from the base by exactly the approved sidecar's blocks; deploy-paths.yaml and overseer-dispatch.yaml stay at or under 500 effective lines."
  - "rec-5263 is closed by the squash-merge trailer and reads back closed."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The rule's named tests (liveness, chain depth, loops, retired guard, triggers, anchors, asserts, table cross-check) and rec-5263's acceptance node.
    command: >-
      bin/venv-python -m pytest
      tests/checks/contracts/test__population.py::test_agent_surface_evaluator_must_be_live
      tests/checks/contracts/test__evaluator_coverage.py::test_chain_deeper_than_one_contract_is_not_live
      tests/checks/contracts/test__evaluator_coverage.py::test_loop_and_self_pointer_are_not_live
      tests/checks/contracts/test__evaluator_coverage.py::test_retired_marker_must_be_listed
      tests/checks/contracts/test__evaluator_coverage.py::test_trigger_must_occur_and_name_the_basename
      tests/checks/contracts/test__evaluator_coverage.py::test_anchor_names_instructed_key
      tests/checks/contracts/test__evaluator_coverage.py::test_asserted_key_needs_literal_evidence
      tests/checks/contracts/test__evaluator_coverage.py::test_coverage_table_cross_check
      tests/checks/contracts/test__evaluator_coverage.py::test_real_tree_retired_and_live -q
    expected: All nine nodes pass.
    expected_literals: [passed]
    fix_if: A missing node or a failure; fix the module, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: evaluator-coverage-live-surfaces
  - step: 2
    phase: pre-deploy
    action: Every test in the files the plan creates or modifies, including the pre-existing evaluator cases.
    command: bin/venv-python -m pytest tests/checks/contracts/test__evaluator_coverage.py tests/checks/contracts/test__population.py tests/checks/contracts/validate_contract_drift -q
    expected: All tests pass.
    fix_if: An existing case fails; give its fixture a live table and row, never weaken its assertion.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of test files this plan creates or modifies; the --pre pytest_diff tier already runs exactly
      these files on every PR that touches them (vp-red-before.yaml hermetic_authoring (v)).
  - step: 3
    phase: pre-deploy
    action: The real tree passes the tightened gate and prints coverage lines, including the self-hosting contract's.
    command: >-
      bin/venv-python -c "import io,contextlib; from scripts.checks.contracts.validate_contract_drift import
      validate_contract_drift as v; f=[]; b=io.StringIO(); s=contextlib.ExitStack();
      s.enter_context(contextlib.redirect_stdout(b)); v(f); s.close(); o=b.getvalue(); ok=(not f) and ('Coverage:
      contract-population.yaml asserted=[' in o) and ('Coverage totals: contracts=' in o); print('COVERAGE_GATE_OK'
      if ok else ('COVERAGE_GATE_RED', f)); raise SystemExit(0 if ok else 1)"
    expected: Prints the ok marker and exits 0; on the un-implemented tree it exits 1 (no Coverage lines).
    expected_literals: [COVERAGE_GATE_OK]
    fix_if: A failure list names a contract; fix the contract's row or surface per the sidecar, never the rule.
    hermetic: true
    graduation: graduate
    graduation_check_id: evaluator-coverage-gate-prints
  - step: 4
    phase: pre-deploy
    action: Approved text placed word-exactly; the two near-cap contracts within budget.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug evaluator-coverage-live-surfaces --base origin/main
      && bin/venv-python -c "from scripts.checks.structural._classify import effective_lines; n=[effective_lines(open(p).read())
      for p in ('docs/contracts/deploy-paths.yaml','docs/contracts/overseer-dispatch.yaml')]; print('BUDGET_OK', n) if
      max(n) <= 500 else print('OVER', n)"
    expected: Prints the approved-text ok line, then the budget marker.
    expected_literals: [APPROVED-TEXT OK, BUDGET_OK]
    fix_if: Any drift; re-place the blocks from the sidecar, never edit the sidecar; over 500 is a STOP to the plan owner.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim: binds this build's diff to its own base; validate_merge_step and validate_structural_size are the
      standing guards.
  - step: 5
    phase: pre-deploy
    action: Stale-reference sweep for the six re-pointed or retired evaluator surfaces.
    command: >-
      n=$(grep -rhE "^\s+agent_surface: (\.claude/skills/overseer/SKILL\.md|\.claude/commands/overseer\.md|docs/DECISIONS\.md|docs/ROADMAP-SEMANTO\.yaml|docs/CLAUDE\.md|docs/contracts/instruction-architecture\.yaml)\s*$"
      docs/contracts/ | wc -l); [ "$n" -eq 0 ] && echo SWEEP_OK || echo "STALE $n"
    expected: Prints the sweep marker.
    expected_literals: [SWEEP_OK]
    fix_if: A contract still names an old surface; re-point it per scope.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The liveness or trigger rule the gate now enforces (VP 3) refuses each old surface on every run (docs/CLAUDE.md
      is live, so there the trigger rule does it); this sweep only proves this build re-pointed all six.
  - step: 6
    phase: pre-deploy
    action: Full tier on the committed, rebased tree before handoff (handoff_policy).
    command: bin/venv-python -m scripts.validate
    expected: Exit 0; its verdict read with bin/venv-python -m scripts.checks.validation_result --verify-head.
    fix_if: Any failing check; fix it on the branch, never skip it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      recursion_refusal: the graduate partition refuses a step that invokes scripts.validate (vp-red-before.yaml).
  - step: 7
    phase: post-deploy
    action: rec-5263 reads back closed after the squash merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as rc; r,_=rc.fetch_recs_by_ids(rc.make_reader(),
      ['rec-5263']); print('REC', r[0]['id'], r[0]['status'])"
    expected: Prints REC rec-5263 closed.
    fix_if: Still open; run the git-ops.yaml resolves_trailer recovery route, never a manual status write.
    hermetic: false
