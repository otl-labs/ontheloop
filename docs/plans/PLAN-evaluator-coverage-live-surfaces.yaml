schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "evaluator-coverage-live-surfaces"
intent: >-
  Make a Class D contract's evaluator say what it covers and resolve only against a surface an agent actually loads
  (CFR-08, rec-5263; a thin first slice of T2.54 c1). An agent_surface evaluator must be live in
  docs/contracts/instruction-architecture.yaml (a layer location or a consumer's declared load, not retired, or one
  contract away from one) and must carry quoted trigger text from that surface; a check evaluator may list the keys it
  asserts, each proven by a literal in the check. Triggers and asserts live in one evaluator_coverage table in
  contract-population.yaml, and the drift gate prints per contract the keys asserted, instructed and neither. Serves
  NS.4: a contract's evaluator is evidence an agent reads it, not a mention.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-evaluator-coverage-live-surfaces.yaml
phase: >-
  T2.54 (bidirectional clause-to-check traceability, not_started): a key-grain first slice of c1 for the contracts
  layer only; c1 and c2 stay open. Remit: Decision Growth (contract-first retrospective, CFR-08).
cites: [dec:168, dec:246, dec:247, dec:251]
amends: []
introduces: []
closes_criteria: []
scope:
  - file: scripts/checks/contracts/_evaluator_coverage.py
    action: Create
    purpose: >-
      New module (kept out of _population.py, 390 of 500 SLOC). Stdlib + yaml; no import of _population (no cycle);
      never raises at import. Public surface: ENVELOPE_KEYS = frozenset({contract, amendment_log, version,
      contract_version, status, ratified_at, ratified_via}); body_keys(data) -> sorted top-level keys not in
      ENVELOPE_KEYS. LiveTable (frozen dataclass: globs, retired) and load_live_table(root) -> LiveTable | str (reads
      root/docs/contracts/instruction-architecture.yaml: every layers[].content_locations glob and every
      consumers[*].loads glob; retired = retired_surfaces.paths; a missing or unparseable file, or a non-list field,
      returns an error string -- fail closed). directly_live(path, table) -> bool: fnmatch.fnmatchcase against any glob
      and path not in table.retired. surface_liveness(contract_basename, surface, root, table) -> (bool, detail): depth
      0 when directly_live; else, when surface is docs/contracts/<X>.yaml whose `contract:` block parses as Class D
      with an agent_surface S2: X equal to contract_basename -> not live, detail "loop: <basename> -> <X> ->
      <basename>"; S2 equal to docs/contracts/<contract_basename> -> not live, "loop: <basename> -> <X> -> <basename>";
      directly_live(S2) -> live at depth 1, "via <X>"; otherwise not live, "chain deeper than one contract: <basename>
      -> <X> -> <S2>" (MAX_CHAIN_DEPTH = 1, operator ruling 2026-11-17). Any other surface -> not live, "<surface> is
      not in instruction-architecture.yaml's live table". retired_marker_errors(root, table) -> list[str]: each
      .claude/skills/*/SKILL.md and .claude/commands/*.md whose YAML frontmatter description, stripped, starts with
      "Being retired" and is not in table.retired is an error naming it; each table.retired path that does not exist
      is an error. CoverageRow (frozen dataclass: triggers tuple, asserts tuple) and load_coverage(root) ->
      dict[str, CoverageRow] | str from contract-population.yaml evaluator_coverage (a row with any key besides
      triggers/asserts, an empty list, or both lists -> error string). coverage_table_errors(rows, kinds) where kinds
      maps each valid Class D basename to "check" or "agent_surface": a row naming a basename not in kinds, a triggers
      row on a check contract, an asserts row on an agent_surface contract, and an agent_surface contract with no row
      are each an error. triggers_resolve(surface_text, basename, triggers) -> (bool, detail): every trigger, after "
      ".join(s.split()) on both sides, occurs in the surface and contains basename. instructed_keys(basename,
      triggers, body) -> (set, errors): every "<basename>#<key>" anchor (regex re.escape(basename) +
      r"#([A-Za-z_][A-Za-z0-9_]*)") adds key, and an anchor key not in body is an error ("anchor names no top-level
      key"); any occurrence of basename not followed by "#" adds every body key. asserts_resolve(basename, asserts,
      body, module_paths, contains_literal) -> (bool, detail): each key is in body and contains_literal(path, key) is
      true for some path (the caller passes _population.module_contains_literal and the check module plus its one-hop
      imports). coverage_line(basename, body, asserted, instructed) -> "Coverage: <basename> asserted=[a, b]
      instructed=[...] neither=[...]" (sorted, comma-space joined, keys only from body).
  - file: scripts/checks/contracts/_population.py
    action: Modify
    new_imports: [scripts.checks.contracts._evaluator_coverage]
    purpose: >-
      resolve_evaluator gains keyword-only live_table: LiveTable | None, coverage: dict[str, CoverageRow] | None and
      body: list[str] | None. The check branch never reads live_table, and reads coverage (None -> loaded from
      root/docs/contracts/contract-population.yaml) only when body is not None. In the agent_surface branch a None
      live_table or coverage is loaded from root, and a load error string returns (False, that string). agent_surface branch, in order: the
      existing path-exists-and-contains-basename test; surface_liveness; a coverage row with triggers;
      triggers_resolve; instructed_keys errors. check branch: unchanged resolution, then when the contract's row has
      asserts, asserts_resolve over the module and one_hop_scripts_imports (body None skips asserts). Detail strings
      name the failing rule. No other function changes.
  - file: scripts/checks/contracts/validate_contract_drift.py
    action: Modify
    purpose: >-
      Loads both tables once per run from target_dir (the scanned contracts directory), following the existing
      precedent that declared_subtrees and the ratchet pins read target_dir/contract-population.yaml: the coverage
      rows from target_dir/contract-population.yaml evaluator_coverage (file or key absent -> no rows), and the live
      table from target_dir/instruction-architecture.yaml (absent -> an empty table, so no agent surface is live). A
      malformed table that is present is one failed[] entry "Contract drift (coverage): <error>" (fail closed). On the
      real tree both files exist, so a deleted or emptied table turns every agent_surface contract red. It passes both
      tables and each file's body keys to resolve_evaluator, whose root stays _common.ROOT. After the loop it appends
      coverage_table_errors (kinds from this run's valid Class D files) and, only when
      target_dir/instruction-architecture.yaml exists, retired_marker_errors(_common.ROOT, table) (otherwise it prints
      "  advisory-SKIP: retired-marker guard -- no instruction-architecture.yaml in <dir>"), each as "Contract drift
      (coverage): ..." failures. The gate-fixture modules under tests/checks/contracts/validate_contract_drift/ write
      neither file and use only check evaluators, so their assertions are unaffected and none needs editing. It prints one "  Coverage: ..." line per Class D contract that resolved
      (asserted from its row's asserts, instructed from its row's triggers, both empty for a check contract without
      asserts) and one "  Coverage totals: contracts=<n> asserted=<a> instructed=<i> neither=<z>" line (key counts).
      Census, ratchet and Pass 2 untouched.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      validate_admin_root_premerge_gate's pre_globs gain "scripts/checks/contracts/_evaluator_coverage.py" beside
      _population.py (it imports _population, which now imports the new module; validate_pre_glob_closure).
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      validate_plan_scope_closure's pre_globs gain "scripts/checks/contracts/_evaluator_coverage.py" beside
      _population.py, for the same import closure.
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      Exactly the four contract-population blocks of docs/plans/approved/evaluator-coverage-live-surfaces.yaml
      (evaluator_kinds.check asserts sentence, evaluator_kinds.agent_surface liveness and trigger text, the
      evaluator_coverage table, and the new amendment_log entry, semantic_break true, field_add), {{DATE}} = build
      date. Nothing else.
  - file: docs/contracts/instruction-architecture.yaml
    action: Modify
    purpose: >-
      Exactly the three instruction-architecture blocks of the sidecar: repo_less_coordinator.loads,
      retired_surfaces (note + paths), and the new amendment_log entry. Nothing else.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Exactly the two deploy-paths blocks of the sidecar: the admin_out_of_band.restore_rehearsal pointer row
      (Decision 251 cl.1 limits, cl.6 scope; navigation only) and the new amendment_log entry. Its evaluator is
      unchanged. 482 -> 489 of 500 effective lines measured in the wording-check tree; re-measure at build.
  - file: docs/contracts/overseer-dispatch.yaml
    action: Modify
    purpose: >-
      contract.evaluator.agent_surface .claude/skills/overseer/SKILL.md -> .claude/skills/planning/SKILL.md; a new
      one-line amendment_log entry (field_add, semantic_break false) saying the triggers instruct only autonomy_tiers
      and gate_request_trampoline and that rec-5286 owns the overseer-only sections. 495 -> 496 of 500 effective
      lines; a flow-style one-line entry only.
  - file: docs/contracts/restore-rehearsal.yaml
    action: Modify
    purpose: contract.evaluator.agent_surface docs/DECISIONS.md -> docs/contracts/deploy-paths.yaml; a new one-line amendment_log entry (field_add, semantic_break false).
  - file: docs/contracts/package-registry-reservation.yaml
    action: Modify
    purpose: contract.evaluator.agent_surface docs/CLAUDE.md -> docs/contracts/deploy-paths.yaml (its publish row names it at its trigger); a new one-line amendment_log entry (field_add, semantic_break false).
  - file: docs/contracts/visual-grammar.yaml
    action: Modify
    purpose: contract.evaluator.agent_surface docs/ROADMAP-SEMANTO.yaml -> docs/PROJECT_CONTEXT.md (layer 2); a new one-line amendment_log entry (field_add, semantic_break false).
  - file: docs/contracts/coordinator.yaml
    action: Modify
    purpose: >-
      contract.evaluator.agent_surface docs/contracts/instruction-architecture.yaml -> docs/contracts/coordinator-harness-claude-projects.yaml
      (live through repo_less_coordinator.loads); a new one-line amendment_log entry (field_add, semantic_break false).
      No gated key (lifecycle, routing, standing_authorisation, always_ask, approvals, halts) changes.
  - file: tests/checks/contracts/test__evaluator_coverage.py
    action: Create
    purpose: >-
      Mirror tests (Decision 131) over tmp_path trees: test_layer_glob_and_consumer_load_are_live,
      test_retired_path_is_not_live, test_one_contract_chain_is_live, test_chain_deeper_than_one_contract_is_not_live
      (three hops: live -> A -> B -> C fails naming the chain), test_loop_and_self_pointer_are_not_live (A -> B -> A
      and A -> A, detail starts "loop:"), test_retired_marker_must_be_listed (an unlisted "Being retired" skill and a
      listed missing path both error; a listed existing one does not), test_trigger_must_occur_and_name_the_basename
      (absent text fails; text without the basename fails; text wrapped across lines passes),
      test_anchor_names_instructed_key (anchor -> that key; bare basename -> every body key; anchor to a missing key
      errors), test_asserted_key_needs_literal_evidence (non-body key, envelope key and a key with no literal each
      fail; a literal passes), test_coverage_table_cross_check (each of the four row errors), test_coverage_line_format,
      test_live_table_load_fails_closed (missing file and non-list field return an error string), and
      test_real_tree_retired_and_live (repo root, over the live table itself so it stays true when the overseer
      files are deleted (Decision 244 cl.4): every retired_surfaces.paths entry is not live,
      .claude/skills/planning/SKILL.md is live, and retired_marker_errors is empty).
  - file: tests/checks/contracts/test__population.py
    action: Modify
    purpose: >-
      test_agent_surface_evaluator_must_be_live, a module-level function (rec-5263's acceptance node; the existing
      module-level function at :439 is the placement precedent): with an injected live table and coverage
