    verification_step: 1
    test_selector: tests/telemetry/test_tool_input_link.py
    red_green_expectation: red before (no ref_links key; test file absent), green after
  - source: docs/contracts/telemetry_transcripts.yaml
    behavior: content_sha256 semantics names the declared ref link id
    verification_step: 1
    test_selector: tests/telemetry/test_tool_input_link.py
    red_green_expectation: red before (no pointer), green after
  - source: docs/contracts/telemetry-event-envelope.yaml
    behavior: external_ref's description says readers follow it only where _joins.yaml ref_links declares a link
    verification_step: 1
    test_selector: tests/telemetry/test_tool_input_link.py
    red_green_expectation: red before (description calls it not a caller-facing FK with no route), green after
constraints:
  - Stay off telemetry_observations, telemetry_sessions and telemetry_agents contracts; the envelope edit is net-negative in bytes and changes no rule another workspace's tests pin (the fork sentence in external_ref semantics is untouched).
  - No skill, AGENTS.md or CLAUDE.md edit (planning SKILL.md's stale "eight-step walk" is reported to its owner).
  - No reader, writer, producer or parser change; no deploy; no budget raise.
  - No rescue agents or workaround loops (Decision 55).
