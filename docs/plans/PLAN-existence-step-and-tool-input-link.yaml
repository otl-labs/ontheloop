    behavior: the walk must carry step 0 before step 1
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_data_model_standard.py
    red_green_expectation: red before (the guard ignores design_time_walk), green after
  - source: docs/contracts/data-modeling-standard.yaml
    behavior: the live walk carries step 0 before step 1 and passes the guard
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_data_model_standard.py
