infrastructure_dependencies: []
acceptance_criteria:
  - design_time_walk opens with step 0 (existence first) carrying the context's 'Wording, step 0' text verbatim; validate_data_model_standard fails a copy without it.
  - _joins.yaml declares ref_links.tool_call_open_to_tool_input with the context's 'Wording, ref_links' text; joins consumers are unchanged (field_semantics --check clean, no Lambda input change).
  - tests/telemetry/test_tool_input_link.py passes on the golden corpus and fails if the producer's ref grammar stops pairing a tool_call open with exactly one tool_input row.
  - Every edited contract stays within its effective-line and byte budget with no raise.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The link pin over the golden corpus.
    command: bin/venv-python -m pytest tests/telemetry/test_tool_input_link.py -q
    expected: exit 0; red before (file absent).
    fix_if: a golden case has an open with zero or two tool_input rows, or the ref_links entry is missing a field
    hermetic: true
    graduation: graduate
    graduation_check_id: tool-input-link-pinned
  - step: 2
    phase: pre-deploy
    action: The existence step guard.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_data_model_standard.py -q -k existence_step
    expected: exit 0; red before (no existence_step tests, and the guard does not check the walk).
    fix_if: a walk without step 0, or with step 0 after step 1, passes
    hermetic: true
    graduation: graduate
    graduation_check_id: design-walk-existence-step
  - step: 3
    phase: pre-deploy
    action: No joins consumer or Lambda input moves.
    command: bin/venv-python -m scripts.schema_to_field_semantics --check
    expected: exit 0 (field_semantics.yaml unchanged)
    fix_if: the generator picked up ref_links
    hermetic: true
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Fast tier, including structural sizes, contract drift and amendment checks.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: a budget or contract check fails
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier before handoff (Decision 163 cl.2).
    command: bin/venv-python -m scripts.validate
    expected: exit 0, and bin/venv-python -m scripts.checks.validation_result --verify-head reports PASS on the handoff HEAD
    fix_if: any full-tier check fails
    hermetic: false
    graduation: not-applicable
