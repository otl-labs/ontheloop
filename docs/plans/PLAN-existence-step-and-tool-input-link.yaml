  - "Wording, step 0 (design_time_walk, replacing 'field_semantics entry, or a warehouse write path is in scope.' before '1. Grain'): field_semantics entry, a warehouse write path, or any change that would store a new fact (a column, a metadata key, a table, a transcript purpose or an accepted value that carries a new fact) is in scope. 0 (existence first; operator ruling 2026-11-20). Before step 1, for each new fact the change would store: (a) state the fact in one sentence that names no column; (b) search the owning contracts (each field's meaning per discriminator value, such as purpose or observation_type, and each realization.unproduced list), docs/contracts/_joins.yaml (joins and ref_links) and the reader verb registries, and list the nearest existing facts: stored, declared but unproduced, derived at read, or reachable by a declared join or ref link; (c) reject a near match only with a counted read of real rows (verb, parameters, counts): \"not stored\" or \"cannot be joined\" needs an attempted read, never a sentence copied from a rec; (d) mark each premise copied from a rec, memory or brief as checked (with its read-back) or assumed; (e) give a blind advisor only the sentence from (a) and ask whether the fact is already stored or derivable; (f) record one plan context item per fact: \"Existence check: <fact> -> none | <table.column> | <join or ref link id> | <verb>; searched: <sources>\". An existing fact counts only if it has the same meaning and grain and is reached through a declared join, a declared ref link or a reader verb that a test pins; if the only route is undeclared or untested, declare and test it in the same change, or store the new field and say why. Never widen an existing field's meaning to avoid adding one; a genuinely new fact still gets a typed column."
