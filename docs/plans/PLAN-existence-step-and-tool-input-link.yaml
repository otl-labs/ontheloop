slug: existence-step-and-tool-input-link
intent: >-
  Stop agents proposing new stored fields for facts we already hold (data estate inventory phase 1, operator ruling
  2026-11-20). The mandatory data design walk gains an existence-first step (step 0) that every new stored fact must
  pass, guarded by validate_data_model_standard; and the tool call to tool input link, the link whose absence from the
  contracts caused the latest duplicate, is declared in _joins.yaml under a new ref_links key and pinned by a test over
  the producer's golden corpus, with the transcript contract, the join description and the event envelope pointing at
  it (the telemetry field consolidation audit's TFC-03 points 1-4).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-existence-step-and-tool-input-link.yaml
