slug: existence-step-and-tool-input-link
intent: >-
  Stop agents proposing new stored fields for facts we already hold (data estate inventory phase 1, operator ruling
  2026-11-20). The mandatory data design walk gains an existence-first step (step 0) that every new stored fact must
  pass, guarded by validate_data_model_standard; and the tool call to tool input link, the link whose absence from the
  contracts caused the latest duplicate, is declared in _joins.yaml under a new ref_links key and pinned by a test over
  the producer's golden corpus, with the transcript contract, the join description and the event envelope pointing at
  it (the telemetry field consolidation audit's TFC-03 points 1-4).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-existence-step-and-tool-input-link.yaml
phase: >-
  Data estate inventory phase 1 "Stop the repeat" (operator-directed 2026-11-20, ad_hoc_rec rec-5440; report
  https://claude.ai/artifact/FuJb2EbMWafuLtcD22Kfxm). No tier_item; phase 2 (rec-5438, rec-5439) builds after it and
  phase 3 (required plan field, CI gate, skills) is out of scope.
closes_criteria: []
cites: [dec:199, dec:246, dec:275, dec:279]
scope:
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      design_time_walk: the trigger sentence also fires on any change that stores a new fact, and step 0 (existence
      first) precedes step 1, text verbatim in context (Wording, step 0). version 7 -> 8, updated_at, updated_by, one terse
      amendment_log row. Relief (NEAR_CAP: 524 of 533 effective lines, 46,073 of 49,152 bytes on main 4232ed1e):
      compact four older full rows with semantic_break false (2026-10-15, 2026-10-05 vocabulary, 2026-10-04
      ops-rule-source, 2026-09-28 smoke vocabulary) to terse rows (Decision 275 cl.4); no row is dropped and no
      semantic-break row is touched. Measured on main 4232ed1e with the wording applied: 511 of 533 lines, 46,870
      bytes. The build re-measures.
  - file: docs/contracts/_joins.yaml
    action: Modify
    purpose: >-
      New top-level key ref_links with one entry, tool_call_open_to_tool_input (text verbatim in context, Wording, ref_links); the
      observation_id_join_observations_to_transcripts description names the node each transcript purpose hangs on
      and points tool_input at the ref link; version 3 -> 4, last_updated, one terse amendment_log row.
  - file: docs/contracts/telemetry_transcripts.yaml
    action: Modify
    purpose: >-
      external_ref's and observation_id's governance_notes_local name the ref link; content_sha256's semantics states
      the tool_input payload form (sorted-key compact JSON, then scrubbed, at every parser version: a description of
      the producer, not a new rule, Decision 199's 2026-10-04 Update) and the link, with a field-level
      prose_improvement row; one terse top-level amendment_log row.
  - file: docs/contracts/telemetry-event-envelope.yaml
    action: Modify
    purpose: >-
      external_ref's description: readers follow it only where _joins.yaml ref_links declares a link (audit TFC-03
      point 2), with a field-level prose_improvement row. The file sits at its Decision 275 byte seed (53,867):
      relief is the same description losing its history clause and two block-style semantic-break top-level rows
      (2026-10-04, 2026-09-28) written as one-line rows with identical values (canonical dumps unchanged, so neither
      a rewrite nor a compaction; validate_contract_drift's retention check compares parsed rows and passed on the
      rehearsal). Measured on main 4232ed1e: 53,857 bytes.
  - file: scripts/checks/contracts/validate_data_model_standard.py
    action: Modify
    purpose: >-
      _check_standard_contract also fails when design_time_walk lacks the step 0 marker, or places it after step 1's
      marker.
  - file: tests/checks/contracts/test_validate_data_model_standard.py
    action: Modify
    purpose: existence_step tests (marker missing fails; marker after step 1 fails; main's file passes after the edit).
  - file: tests/telemetry/test_tool_input_link.py
    action: Create
    purpose: >-
      Pins the declared link: the ref_links entry's fields; refs.role_ref and refs.transcript_ref agree on the shared
      prefix; over every golden case's expected_rows, each tool_call open has exactly one tool_input row by the link
      within (session_id, producer, parser_version), and the corpus keeps a nonzero block index case and a withheld
      tool_input row; load_telemetry_joins and the field_semantics joins exclude the ref link; the pointers resolve
      (telemetry_transcripts.yaml content_sha256 semantics and the envelope's external_ref description name
      ref_links.tool_call_open_to_tool_input or ref_links, and that id exists in _joins.yaml).
