  - source: scripts/checks/deps/fast_tier_env.py
    behavior: The env builder installs the same requirements files, in the same order, as ci.yml's pr-validate job.
    verification_step: 2
    test_selector: tests/checks/deps/test_fast_tier_env.py::TestInstallSequenceMatchesCi
    red_green_expectation: red before (module and test absent, exit 4), green after.
  - source: bin/venv-python
