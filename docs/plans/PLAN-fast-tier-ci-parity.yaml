    verification_step: 3
    test_selector: tests/test_venv_python.py::TestVenvPythonOverride
    red_green_expectation: red before (class absent, exit 4), green after.
  - source: scripts/validate.py
    behavior: Only the module entry point re-execs; main() never does.
    verification_step: 4
    test_selector: tests/validate/test_ci_parity_flag.py::TestMainNeverReexecs
    red_green_expectation: red before (test file absent, exit 4), green after.
  - source: scripts/validate.py
    behavior: --full-env and --ignore-budget print the not-CI-predictive banner; abbreviations are rejected.
    verification_step: 5
    test_selector: tests/validate/test_ci_parity_flag.py::TestFullEnvBanner
