constraints:
  - No check verifies less after this plan; the plan-reader re-run is not narrowed (operator's scope choice, 2026-11-18).
  - >-
    No pooling or retry of any differential leg. A pooled HEAD leg with an alone-retry (validate_graduated_rerun's
    rule) was drafted and dropped after critique r1 and scout r4: it would give a nondeterministic record a second
    admission draw, which Decision 235 cl.1 classes as loosening an assertion and so needs its own human approval; it
    saved about 4s on a five-entry PR and nothing on a one-entry PR.
  - NON_TEST_BUDGET_SECONDS stays 270; no --ignore-budget, no check moved out of the fast tier (Decision 208, 181).
  - The differential stays a real worktree revert against the base ref (Decision 132, Decision 55); base legs run serially.
  - The batched reader keeps everything in memory; nothing is cached to disk (Decision 176 cl.5, Decision 135).
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Graduated shards kept unchanged (no node they name is renamed, edited or removed; the scoped test files only gain
    tests or retarget a non-pinned node's patch, and the two registry test files are not edited):
    registry-baseline-reader-spans-layouts, registry-concurrent-graduations-merge-clean,
    registry-deprecated-subtree-excluded, registry-loader-order-deterministic, registry-modified-record-re-admitted,
    registry-shard-filename-is-check-id, registry-flat-file-rejected, late-closure-gates-checks,
    registry-portability-admission-leg.
context:
  - >-
    Decision-scout r5 NO_FLAGS (r4's WARN on Decision 181 cl.2 and NOTE on Decision 235 cl.1 about the drafted
    alone-retry were answered by dropping HEAD-leg pooling and retry; see constraints). Decisions triaged: 227 of 227.
