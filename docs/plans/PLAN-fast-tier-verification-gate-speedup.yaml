pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Create scripts/checks/verification/_graduation_git.py: move run_git, _provision_venv_symlink and git_worktree
    unchanged; add read_blobs_at_ref (parse `<sha> blob <size>` headers, read exactly size bytes plus the newline;
    a `missing` header raises GraduationError) and shared_worktrees. Pre: verification_graduation.py at 488 SLOC.
    Post: it is below 470 SLOC and both files pass ruff.
  - >-
    Modify scripts/verification_graduation.py as scoped; keep entries_at_ref's docstring branches (i)-(iv) and the
    legacy flat path; parse through scripts.contract_rules.parse_yaml.
  - >-
    Modify validate_verification_registry.py: one baseline read, pooled HEAD legs with alone-retry, serial base legs in
    one shared_worktrees() context. Late-closure bases (bases[cid]) use get(that ref).
  - Switch validate_platform_roadmap.py, contracts/_shared.py, validate_contract_drift.py and plan_lint/headroom.py to parse_yaml.
  - Run validate_pre_glob_closure and add exactly the pre_globs it reports to the two manifests.
  - Write the tests in scope (red before, green after for each new node).
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - >-
    Open the build PR; after its pr-validate completes, download the selection-manifest artifact through the GitHub MCP
    to logs/debug/pr-selection-manifest.json and run step 7; put the four phase times and the run id in the PR body.
  - 'Report: what was implemented, verification results, the GitHub phase times against the series'
