execution_steps:
  - >-
    Create scripts/checks/verification/_graduation_git.py: move run_git, _provision_venv_symlink and git_worktree
    unchanged, and move GraduationError there (re-exported, same class object); add read_blobs_at_ref (binary
    stdout; parse `<sha> blob <size>` headers, read exactly size bytes plus the newline, decode UTF-8; a `missing`
    header omits the path; a failed or misframed subprocess raises GraduationError) and shared_worktrees. Pre:
    verification_graduation.py at 488 SLOC.
    Post: it is below 470 SLOC and both files pass ruff.
  - >-
    Modify scripts/verification_graduation.py as scoped; keep entries_at_ref's docstring branches (i)-(iv) and the
    legacy flat path; parse through scripts.contract_rules.parse_yaml.
  - >-
    Modify validate_verification_registry.py: one baseline read passed as baseline=, then serial
    vg.run_differential(..., worktree_for=wt.get) calls in one shared_worktrees() context. Late-closure bases (bases[cid]) use get(that ref).
  - Switch validate_platform_roadmap.py, contracts/_shared.py, validate_contract_drift.py and plan_lint/headroom.py to parse_yaml.
  - Run validate_pre_glob_closure and add exactly the pre_globs it reports to the three manifests.
  - >-
    Write the tests in scope (red before, green after for each new node) and apply the patch retargets the scope rows
    name in test_loader.py and test_differential.py; edit no graduated pin node.
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - >-
    Open the build PR; after its pr-validate completes, download the selection-manifest artifact through the GitHub MCP
    to logs/debug/pr-selection-manifest.json and run step 9; put the four phase times and the run id in the PR body.
  - >-
    After merge, run step 10, then update_rec rec-3374 to record the registry-gate cost this plan removed and its
    GitHub phase time (read its context first; update_rec --context replaces, so carry the existing text forward).
  - >-
    Report: what was implemented; the step 8 verify-head result; the build PR number; the step 9 run id and four phase
    times against the series; and the merge SHA.
