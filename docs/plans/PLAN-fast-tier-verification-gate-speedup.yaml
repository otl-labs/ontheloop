schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "fast-tier-verification-gate-speedup"
intent: >-
  Restore headroom under the fast tier's unwaivable 270s non-test budget (Decision 208) as GitHub pr-validate measures
  it, by cutting the verification registry gate's duplicated per-shard git reads and worktrees and by moving the
  slowest fast-tier checks' YAML parsing onto the shared libyaml loader, with no change to what any check verifies, so
  graduation-adding build PRs stop landing within seconds of the cap (rec-5372).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-fast-tier-verification-gate-speedup.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5372 (High). Closes no roadmap criterion.
cites: [dec:128, dec:132, dec:176, dec:181, dec:208, dec:244]
scope:
  - file: scripts/checks/verification/_graduation_git.py
    action: Create
    purpose: >-
      Git plumbing for the graduation registry, split out of verification_graduation.py (12 SLOC headroom; Decision 128
      decomposes, never raises): run_git, the venv-symlink provisioner and git_worktree moved here unchanged;
      read_blobs_at_ref(ref, paths, root), every blob through ONE `git cat-file --batch` subprocess, returned in memory
      only (Decision 176 cl.5: no index, no cache file); and shared_worktrees(root), a context manager whose get(ref)
      lazily adds one real `git worktree add --detach` per distinct ref, whose restore(path) runs `git checkout -f -q`
      plus `git clean -fdxq -e .venv` and then requires `git status --porcelain --ignored` to list nothing but .venv
      (else GraduationError, Decision 55), and whose exit removes every worktree it added.
    new_imports: []
  - file: scripts/verification_graduation.py
    action: Modify
    purpose: >-
      Re-export run_git as _run_git, _provision_venv_symlink and git_worktree from _graduation_git so existing importers
      and patch targets keep resolving; entries_at_ref keeps its four branches and reads shard blobs through
      read_blobs_at_ref; load_entries and entries_at_ref parse through scripts.contract_rules.parse_yaml; split
      run_differential into run_head_leg(row, root) and run_base_leg(row, root, base_ref, worktree_for=None), with
      run_differential composing them exactly as today for every other caller.
    new_imports: [scripts.checks.verification._graduation_git, scripts.contract_rules]
  - file: scripts/checks/verification/validate_verification_registry.py
    action: Modify
    purpose: >-
      Read the origin/main baseline once per run and pass it to _added_entries and _modified_entries (today each reads
      it); run every candidate's HEAD leg in a ThreadPoolExecutor of min(4, cpu_count) and re-run a non-PASS HEAD leg
      alone before it counts (validate_graduated_rerun's rule, Decision 244); then run base legs SERIALLY, one candidate
      at a time, through one shared_worktrees() context restored between candidates (Decision 132: each row sees a
      clean pre-fix tree; a pooled base leg could misread contention as a FAIL and admit a tautology).
    new_imports: [scripts.checks.verification._graduation_git]
  - file: scripts/checks/roadmap/validate_platform_roadmap.py
    action: Modify
    purpose: The roadmap parse and the 815 plan parses go through scripts.contract_rules.parse_yaml (YAMLError handling unchanged).
    new_imports: [scripts.contract_rules]
  - file: scripts/checks/contracts/_shared.py
    action: Modify
    purpose: baseline_class_d_envelopes parses through scripts.contract_rules.parse_yaml.
    new_imports: [scripts.contract_rules]
  - file: scripts/checks/contracts/validate_contract_drift.py
    action: Modify
    purpose: >-
      Its per-contract safe_load calls go through scripts.contract_rules.parse_yaml; every contract basename literal
      stays in place (Decision 168 evaluator resolution).
    new_imports: [scripts.contract_rules]
  - file: scripts/roadmap/plan_lint/headroom.py
    action: Modify
    purpose: >-
      _load parses through scripts.contract_rules.parse_yaml (the unbuilt-plan scan plan_obligations runs, which the
      graduated record plan-obligations-cli-advisory executes twice in every plan-reader re-run).
    new_imports: [scripts.contract_rules]
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      Add scripts/contract_rules.py to the pre_globs of each Entry validate_pre_glob_closure reports as newly reaching
      it through headroom.py (validate_plan_scope_closure today); a widening only (Decision 187).
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      The same closure for this domain (validate_admin_root_premerge_gate today), plus
      scripts/checks/verification/_graduation_git.py wherever validate_pre_glob_closure reports it missing.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      The same closure for this domain (validate_instruction_architecture_layers and validate_prompt_compliance
      today, which reach the edited contract-check modules).
  - file: tests/checks/verification/test__graduation_git.py
    action: Create
    purpose: >-
      Mirror test (Decision 131): TestBatchedShardRead::test_one_subprocess_reads_every_shard (equal rows to a per-blob
      git show over a fixture repo, one subprocess), shared worktree reuse per ref, restore removes a planted untracked
      and a modified tracked file, a failed restore raises GraduationError, exit removes every worktree.
  - file: tests/verification_graduation/test_loader.py
    action: Modify
    purpose: entries_at_ref's four branches still hold on the batched reader, and both loaders parse through parse_yaml.
  - file: tests/verification_graduation/test_differential.py
    action: Modify
    purpose: run_differential's verdicts are unchanged when composed from run_head_leg and run_base_leg.
  - file: tests/checks/verification/test_validate_verification_registry_gate_cost.py
    action: Create
    purpose: >-
      Sibling of the near-cap mirror test (63 SLOC headroom), as test_validate_verification_registry_portability.py is:
      TestWorktreeReuse::test_added_entries_share_one_worktree (three added entries, one base ref, one worktree add);
      the baseline is read once; a pooled HEAD-leg non-PASS that passes alone is admitted, one that fails alone is not;
      base legs never overlap (a recording fake asserts no two are open at once).
  - file: tests/checks/verification/test_validate_graduated_rerun_plan_readers.py
    action: Modify
    purpose: TestSelectionUnchanged pins that every reads_plans record on the live registry is still selected (no narrowing).
  - file: tests/checks/roadmap/test_validate_platform_roadmap_loader.py
    action: Create
    purpose: Sibling of the near-cap mirror test (8 SLOC headroom). The check's plan and roadmap parses go through parse_yaml (spy), and a malformed plan still fails as today.
  - file: tests/checks/contracts/test__shared.py
    action: Modify
    purpose: baseline_class_d_envelopes parses through parse_yaml.
  - file: tests/checks/contracts/validate_contract_drift/test_parse_loader.py
    action: Create
    purpose: validate_contract_drift's contract parses go through parse_yaml and the check passes on the live tree.
  - file: tests/roadmap/plan_lint/test_headroom.py
    action: Create
    purpose: TestHeadroomLoader::test_unbuilt_scan_parses_through_fast_loader (tests/test_plan_obligations.py has 2 SLOC headroom).
bundled_recommendations: [rec-5372]
followon_recs: [rec-5435]
infrastructure_dependencies: []
acceptance_criteria:
  - entries_at_ref returns rows equal to today's per-shard reader at origin/main and reads the blobs in one git subprocess.
  - A registry run with N added entries against one base ref adds exactly one worktree, restores it between entries,
    fails loud when a restore leaves anything behind, and never runs two base legs at once.
  - A pooled HEAD leg that fails is re-run alone before it counts.
  - The plan-reader re-run still selects every plan-reading record.
  - Every switched parse site yields data identical to yaml.safe_load over the real files it reads.
  - On the build PR's GitHub pr-validate run, validate_graduated_rerun_plan_readers, validate_verification_registry,
    validate_platform_roadmap and validate_contract_drift together take at most 75s (today's series 86-112s).
  - rec-5372 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The registry gate, the batched reader and the shared worktree (red before, green after).
    command: >-
      bin/venv-python -m pytest -q
      tests/checks/verification/test_validate_verification_registry_gate_cost.py::TestWorktreeReuse::test_added_entries_share_one_worktree
      tests/checks/verification/test__graduation_git.py::TestBatchedShardRead::test_one_subprocess_reads_every_shard
      tests/roadmap/plan_lint/test_headroom.py::TestHeadroomLoader::test_unbuilt_scan_parses_through_fast_loader
    expected: 3 passed; before the build the nodes do not exist.
    fix_if: A failure names the behaviour; fix the code, never the test.
    hermetic: true
    expected_literals: ["3 passed"]
    graduation: graduate
    graduation_check_id: fast-tier-registry-gate-shared-worktree-and-batched-read
  - step: 2
    phase: pre-deploy
    action: Run every test file the change creates or edits, plus the two manifest mirrors.
    command: >-
      bin/venv-python -m pytest -q tests/checks/verification/test__graduation_git.py
      tests/verification_graduation/test_loader.py tests/verification_graduation/test_differential.py
      tests/checks/verification/test_validate_verification_registry.py
      tests/checks/verification/test_validate_verification_registry_gate_cost.py
      tests/checks/verification/test_validate_graduated_rerun_plan_readers.py
      tests/checks/roadmap/test_validate_platform_roadmap.py tests/checks/roadmap/test_validate_platform_roadmap_loader.py
      tests/checks/contracts/test__shared.py tests/checks/contracts/validate_contract_drift/test_parse_loader.py
      tests/roadmap/plan_lint/test_headroom.py tests/test_plan_obligations.py
      tests/checks/roadmap/test__manifest.py tests/checks/verification/test__manifest.py
      tests/checks/verification/test_validate_differential_gate_baseline.py tests/checks/deps/test_fast_tier_harness.py
    expected: All pass, including the patch-target tests that patch scripts.verification_graduation.git_worktree.
    fix_if: A patch-target test fails -- the re-export broke attribute lookup; call through the module attribute.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      These are this plan's own and neighbouring pytest modules, which the fast tier's affected-test selection runs on
      every PR touching the edited modules; step 1 graduates the acceptance nodes.
  - step: 3
    phase: pre-deploy
    action: Prove the libyaml loader parses every real file the switched sites read identically to yaml.safe_load.
    command: >-
      bin/venv-python -c "import glob, yaml; from scripts.contract_rules import parse_yaml, _SAFE_LOADER;
      assert _SAFE_LOADER is yaml.CSafeLoader, _SAFE_LOADER;
      ps=sorted(glob.glob('docs/plans/PLAN-*.yaml')+glob.glob('config/agent/verification_registry/entries/*.yaml')
      +glob.glob('docs/contracts/*.yaml')+['docs/ROADMAP-PLATFORM.yaml']);
      bad=[p for p in ps if parse_yaml(open(p,encoding='utf-8').read())!=yaml.safe_load(open(p,encoding='utf-8').read())];
      assert not bad, bad[:5]; print('YAML_PARITY_OK', len(ps))"
    expected: Exit 0 and the marker with the file count (about 2,650 today).
    expected_literals: [YAML_PARITY_OK]
    fix_if: >-
      A file parses differently -- keep that site on yaml.safe_load and record the file in the PR body; never edit the
      file to suit the loader.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A whole-corpus parse costs about 20s, too slow for a standing fast-tier guard; the per-site spy tests (step 2)
      guard the wiring and this one-off proof covers the corpus at build time.
  - step: 4
    phase: pre-deploy
    action: Prove the batched baseline equals today's per-shard read on the real registry at origin/main.
    command: >-
      bin/venv-python -c "import subprocess, yaml; from pathlib import Path;
      from scripts import verification_graduation as vg;
      paths=vg._shard_paths_at_ref('origin/main', Path('.'));
      old=[yaml.safe_load(subprocess.run(['git','show','origin/main:'+p],capture_output=True,text=True,check=True).stdout) for p in paths];
      new=vg.entries_at_ref('origin/main', Path('.')); assert new==old, (len(new), len(old)); print('BASELINE_PARITY_OK', len(new))"
    expected: Exit 0 and the marker with the shard count (about 1,770 today).
    expected_literals: [BASELINE_PARITY_OK]
    fix_if: Rows differ -- the batch parser misframes a blob; fix read_blobs_at_ref.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: TestBatchedShardRead (step 1, graduated) guards the reader on a fixture repo; this is the one-off live parity proof.
  - step: 5
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails -- fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates the PR fast tier, which runs the same command on every push.
  - step: 6
    phase: pre-deploy
    action: Run the full tier before handoff (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure -- fix in scope and re-run; a failure outside scope is a plan defect, never a handoff to PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      Measure in GitHub: read the build PR's pr-validate selection-manifest artifact (downloaded through the GitHub MCP
      artifact read to logs/debug/pr-selection-manifest.json) and sum the four phases.
    command: >-
      bin/venv-python -c "import json; b=json.load(open('logs/debug/pr-selection-manifest.json'))['budget'];
      pt=b['phase_times']; names=['validate_graduated_rerun_plan_readers','validate_verification_registry',
      'validate_platform_roadmap','validate_contract_drift']; s=sum(pt.get(n,0) for n in names);
      nt=b['static_s']+b['replay_s']+b['unattributed_s']-b.get('escalation_s',0);
      print({n: round(pt.get(n,0),1) for n in names}, 'non_test', round(nt,1), 'run', b['run_id']);
      assert s<=75, s; print('GITHUB_PHASES_OK', round(s,1))"
    expected: >-
      The marker, the four phase times, the run's non-test total and its run id, which goes in the PR body beside
      today's series (runs 44436747502, 44411637582, 44408969388, 44381177216, 44356030362).
    fix_if: >-
      Over 75s -- profile the slowest of the four from the run's own log and fix it in scope; never lower the target or
      move a check out of the fast tier. A target that still cannot be met is reported to the operator, not waived.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: Prove the merge closed rec-5372.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5372']);
      assert rows and rows[0]['status'] == 'closed', rows; print('REC_5372_CLOSED')"
    expected: REC_5372_CLOSED.
    fix_if: rec-5372 open -- the Resolves trailer was missing; close it through update_rec with the merge sha.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/verification/_graduation_git.py
    behavior: One cat-file subprocess reads every shard blob; one worktree per ref is reused, restored clean, fails loud, and removed on exit.
    verification_step: 1
    test_selector: tests/checks/verification/test__graduation_git.py::TestBatchedShardRead::test_one_subprocess_reads_every_shard
    red_green_expectation: red before (the module does not exist), green after.
  - source: scripts/verification_graduation.py
    behavior: entries_at_ref keeps its four branches on the batched reader and run_differential's verdicts are unchanged.
    verification_step: 2
    test_selector: tests/verification_graduation/test_loader.py
    red_green_expectation: red before (no batched-reader or parse_yaml assertions pass), green after.
  - source: scripts/checks/verification/validate_verification_registry.py
    behavior: N added entries share one worktree, the baseline is read once, HEAD legs pool with alone-retry, base legs stay serial.
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_verification_registry_gate_cost.py::TestWorktreeReuse::test_added_entries_share_one_worktree
    red_green_expectation: red before (one worktree per entry), green after.
  - source: scripts/checks/roadmap/validate_platform_roadmap.py
    behavior: Plan and roadmap parses go through parse_yaml and malformed plans still fail.
    verification_step: 2
    test_selector: tests/checks/roadmap/test_validate_platform_roadmap_loader.py
    red_green_expectation: red before (the file does not exist), green after.
  - source: scripts/checks/contracts/_shared.py
    behavior: baseline_class_d_envelopes parses through parse_yaml.
    verification_step: 2
    test_selector: tests/checks/contracts/test__shared.py
    red_green_expectation: red before (the spy sees no parse_yaml call), green after.
  - source: scripts/checks/contracts/validate_contract_drift.py
    behavior: Contract parses go through parse_yaml and the live tree still passes.
    verification_step: 2
    test_selector: tests/checks/contracts/validate_contract_drift/test_parse_loader.py
    red_green_expectation: red before (the file does not exist), green after.
  - source: scripts/roadmap/plan_lint/headroom.py
    behavior: The unbuilt-plan scan parses through parse_yaml.
    verification_step: 1
    test_selector: tests/roadmap/plan_lint/test_headroom.py::TestHeadroomLoader::test_unbuilt_scan_parses_through_fast_loader
    red_green_expectation: red before (the node does not exist), green after.
  - source: scripts/checks/roadmap/_manifest.py
    behavior: Entries reaching scripts/contract_rules.py carry it in pre_globs.
    verification_step: 2
    test_selector: tests/checks/roadmap/test__manifest.py
    waiver_reason: A pre_globs widening is enforced by validate_pre_glob_closure in step 5; the manifest mirror only re-reads the literal.
  - source: scripts/checks/verification/_manifest.py
    behavior: Entries reaching scripts/contract_rules.py or _graduation_git.py carry them in pre_globs.
    verification_step: 2
    test_selector: tests/checks/verification/test__manifest.py
    waiver_reason: A pre_globs widening is enforced by validate_pre_glob_closure in step 5; the manifest mirror only re-reads the literal.
constraints:
  - No check verifies less after this plan; the plan-reader re-run is not narrowed (operator's scope choice, 2026-11-18).
  - NON_TEST_BUDGET_SECONDS stays 270; no --ignore-budget, no check moved out of the fast tier (Decision 208, 181).
  - The differential stays a real worktree revert against the base ref (Decision 132, Decision 55); base legs run serially.
  - The batched reader keeps everything in memory; nothing is cached to disk (Decision 176 cl.5, Decision 135).
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Graduated shards kept unchanged (tests/verification_graduation/test_loader.py only gains tests; none it names is
    renamed, edited or removed): registry-baseline-reader-spans-layouts, registry-concurrent-graduations-merge-clean,
    registry-deprecated-subtree-excluded, registry-loader-order-deterministic.
context:
