  - >-
    Gotcha: tests patch scripts.verification_graduation.git_worktree and .entries_at_ref; callers must keep resolving
    them as module attributes at call time.
  - rec-3374 (move the differential out of the fast tier) is referenced, not bundled; rec-4127 owns content-scaled drift.
