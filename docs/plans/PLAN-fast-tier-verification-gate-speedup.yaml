    Decision-scout r2 FLAGS_FOUND, 0 CONTRADICT (r1's Decision 235/244 narrowing flags dropped with the narrowing).
    Decisions triaged: 224 of 224. Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2. CITE 128, 132, 176, 181,
    208, 244. Serves: NS.8 3/5 (keeps graduation-adding PRs inside the unwaivable budget). SPIRIT 208 note answered by
    rec-5435.
  - >-
    GitHub series (selection-manifest phase_times): plan_readers 30-53s and top non-test phase in 6 of 8 runs;
    verification_registry 9-15s, 25-33s with added entries; platform_roadmap 18-26s; contract_drift 13-20s. Non-test
    254s on #2198's merging run 44436747502, 257s and 258s on runs 44411637582 and 44304908769.
  - >-
    Decision 208 reversal (a) has fired (green non-test above 216s); the deferred re-derivation is rec-5435, which
