schema_version: 5
slug: "feedback-loop-regrounding"
intent: >-
  Re-ground the October 2026 telemetry feedback-loop designs (the eight W1 component reports and the W3 staging
  report) against main as one dated report, so the later wave 2-4 plans for T3.3 and T3.4 start from true premises
  and corrected anchors. A self-improvement loop built on stale premises would measure the wrong thing; this plan
  builds nothing and files its follow-ups as recs.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-feedback-loop-regrounding.yaml
phase: >-
  T3.3 and T3.4 (telemetry feedback loop), read-only re-grounding ahead of waves 2-4, which stay behind the
  operator's 2026-11-10 gate. Item B4 of the 2026-11-10 handover. Closes no exit criterion; every T3.3 and T3.4
  criterion stays open.
scope:
  - file: docs/plans/PLAN-feedback-loop-regrounding.yaml
    action: Create
    purpose: >-
      The planning artefact: premise evidence for the report (VP), the fork record and its provenance (context), and
      the constraints that keep this plan read-only.
  - file: docs/plans/reports/REPORT-feedback-loop-regrounding.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86 cl.2; report-deliverables route): what moved, the review's cheap-now
      items, per-component built / holds / stale / unbuilt / waits-on / overlap for the eight components, settled
      forks, probe re-runs, the ten unowned requirements with owners, recs filed and noted, waves and prerequisites,
      open operator items, the dated rulings with their homes, and known gaps.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The code premises the report relies on hold on main: the append kernel accepts only session_started_at
    partitions, window verbs are capped at 7 days, the friction verb stamps classifier_version 1, read_version is a
    16-hex digest, the telemetry reader logs one invocation line per request, rec_ids is unproduced under
    held:feedback-loop-gate, no deliberation verb exists, and the W1 ladder SQL casts versions to integers (VP 1).
  - >-
    The Decision text the report cites holds: Decision 221's one journal and one filer and its never-stored dollars,
    Decision 252's promote-only PROD, Decision 199's last clause-1 Update note, Decision 239's only-through content
    reader, and Decision 235's one loop record journal (VP 2).
  - The W1, W2 and W3 reports are unchanged since the probe base f866f98b, so the probe results carry (VP 3).
  - >-
    The report carries all nineteen sections, the ten dated rulings, every filed or noted rec id, is ASCII, and
    carries no placeholder, chat message id or account-id-shaped number (VP 4).
  - The plan validates against the PlanDocument schema (VP 5).
  - The branch changes exactly the plan and report files (VP 6), and the fast tier passes on the branch (VP 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the code premises the report's component sections rely on
    command: >-
      bin/venv-python -c "import pathlib as P,re; a=P.Path('src/telemetry/append.py').read_text();
      v=P.Path('src/common/ducklake_event_read_verbs.py').read_text(); r=P.Path('src/common/ducklake_event_reads.py').read_text();
      h=P.Path('src/lambdas/ducklake_telemetry_reader/handler.py').read_text(); s=P.Path('docs/contracts/telemetry_sessions.yaml').read_text();
      src=''.join(p.read_text() for p in P.Path('src').rglob('*.py')); l=P.Path('docs/plans/reports/REPORT-w1-maturity-ladder.md').read_text();
      print('kernel_session_partition_only=' + str('partition_column must be session_started_at' in a) + ' max_window_days=' + re.search(r'^MAX_WINDOW_DAYS = (\d+)', v, re.M).group(1) + ' classifier_version=' + re.search(r'\"classifier_version\": (\d+)', v).group(1) + ' read_version_hex16=' + str('first 16 hex' in r) + ' reader_logs_invocation=' + str('log_invocation(' in h) + ' rec_ids_held=' + str('unproduced: held:feedback-loop-gate' in s) + ' deliberation_verb_absent=' + str('session_deliberation_rollup' not in src and 'deliberation_class' not in src) + ' ladder_casts_int=' + str('TRY_CAST(version AS UBIGINT)' in l))"
    expected: >-
      One line: the kernel accepts only session_started_at partitions, the window cap is 7, classifier_version is 1,
      read_version is a 16-hex digest, the reader logs an invocation line, rec_ids is held, no deliberation verb
      exists, and the ladder SQL casts versions to integers.
    fix_if: >-
      A changed value means main moved under the report (rec-5077, rec-5080, rec-5097, rec-4606 or the deliberation
      build landed, or the cap moved); re-ground the matching report section before merging.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A moment claim: red-before evidence for rec-5077, rec-5080, rec-5097 and the deliberation build, each of which
      changes exactly one of these facts; a standing guard would block that sanctioned change.
    expected_literals: ["kernel_session_partition_only=True max_window_days=7 classifier_version=1 read_version_hex16=True reader_logs_invocation=True rec_ids_held=True deliberation_verb_absent=True ladder_casts_int=True"]
  - step: 2
    phase: pre-deploy
    action: Prove the Decision clauses the report cites hold as cited
    command: >-
      bin/venv-python -c "import pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      b=lambda n: t[t.index('## Decision %d:' % n):t.index(chr(10) + '## Decision ', t.index('## Decision %d:' % n) + 10)];
      print('d221_one_each=' + str('one allow-list, one journal, one filer' in b(221)) + ' d221_no_dollars=' + str('never stored or published' in b(221)) + ' d252_promote_only=' + str('PROD is promote-only' in b(252)) + ' d199_last_note=' + str('Last clause-1 note' in b(199)) + ' d239_only_through=' + str('only through' in b(239)) + ' d235_journal=' + str('one loop record journal' in b(235)))"
    expected: >-
      One line: Decision 221 keeps one journal and one filer and never stores dollars, Decision 252 makes PROD
      promote-only, Decision 199 carries its last clause-1 Update note, Decision 239 routes transcript text only
      through the content reader, and Decision 235 records shadow verdicts in the one loop record journal.
    fix_if: A False means the cited text moved (a later Decision or annotation); re-read it and re-ground sections 1, 6, 7, 8 and 11.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The cited Decisions are guarded by validate_supersession_annotations and the Decision corpus checks; a
      per-plan row would duplicate them for a point-in-time reading.
    expected_literals: ["d221_one_each=True d221_no_dollars=True d252_promote_only=True d199_last_note=True d239_only_through=True d235_journal=True"]
  - step: 3
    phase: pre-deploy
    action: Prove the W1, W2 and W3 reports are unchanged since the probe base, so section 12's results carry
    command: >-
      git diff --quiet f866f98b HEAD -- 'docs/plans/reports/REPORT-w1-*.md' docs/plans/reports/REPORT-w2-feedback-loop-synthesis.md
      docs/plans/reports/REPORT-w3-feedback-loop-staging.md src/ config/telemetry/parser_versions.yaml && echo designs_unchanged=True
    expected: Prints designs_unchanged=True; the designs, src/ and the parser registry match the probe base.
    fix_if: >-
      A diff means a design or its inputs moved after the probes ran; re-run that component's W1 VPs and update
      section 12.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Prove the report's structure, rulings, rec ids, ASCII text and public-content hygiene
    command: >-
      bin/venv-python -c "import pathlib,re; t=pathlib.Path('docs/plans/reports/REPORT-feedback-loop-regrounding.md').read_text(encoding='utf-8');
      H=['## %d. ' % i for i in range(19)]; R=['rec-5077','rec-5078','rec-5079','rec-5080','rec-5097','rec-4706','rec-4606','rec-4438','rec-4028'];
      print('sections=' + str(sum(h in t for h in H)) + '/19 rulings=' + str(sum(('| %s |' % k) in t for k in ['R1','R2','R3','R4','R5','S1','S2','S3','S4','S5'])) + '/10 recs=' + str(sum(r in t for r in R)) + '/9 ascii=' + str(t.isascii()) + ' placeholder=' + str('MAIN_SHA' in t) + ' msg_ids=' + str('cmsg_' in t) + ' acct_like=' + str(bool(re.search(r'(?<![0-9])[0-9]{12}(?![0-9])', t))))"
    expected: >-
      One line: nineteen sections, ten ruling rows, nine rec ids, ASCII only, no placeholder, no chat message id and
      no account-id-shaped number.
    fix_if: Restore the missing section, ruling row or rec id, or remove the offending text.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A moment claim about this report at merge; a sanctioned later revision may change its section set, and the
      repository's never-commit hook already guards account ids.
    expected_literals: ["sections=19/19 rulings=10/10 recs=9/9 ascii=True placeholder=False msg_ids=False acct_like=False"]
  - step: 5
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-feedback-loop-regrounding.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 6
    phase: pre-deploy
    action: Confirm the change is exactly the plan and report files
    command: git fetch --quiet origin main && git diff --name-only origin/main...HEAD
    expected: Exactly two paths, this plan and docs/plans/reports/REPORT-feedback-loop-regrounding.md.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan or report file.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    Read-only re-grounding: no code, workflow, contract, roadmap, W1/W2/W3 report or DECISIONS.md edit; no
    criterion flipped; no candidate decision filed or ratified (CD.46-CD.52 stay the operator's).
  - >-
    No wave 2-4 plan or build follows from this plan until the operator's 2026-11-10 gate list is complete (report
    section 16).
  - >-
    The recs this re-grounding needed were filed or noted through the ops portal before this plan was written
    (report section 14); the plan files none and its squash-merge carries no Resolves trailer.
  - No new standing prose doc (Decision 86); the report is a dated REPORT-ONLY snapshot and its lasting rulings live in recs.
  - Never plan another workspace's recs (rec-4028, T1.13, rec-4729, rec-4233, rec-3904 are named for overlap only).
  - No rescue agents or workaround loops (Decision 55).
context:
  - >-
    Decision-scout FLAGS_FOUND (r1). Decisions triaged: 205 of 205. Roadmap items intersected: 0; CONFLICT: 0;
    RELATED: 0. Serves: NS.6 3/5. CITE: 86, 127, 247, 221, 199, 250, 239, 84, 209. CONTRADICT: 86 NOTE (a
    nine-component report must not become a standing architecture doc), resolved by the operator's ruling R4: dated
    snapshot, lasting rulings in recs.
  - "Related-work check (Decision 226): scripts.ci_rca.red_overlap --plan exit 0, verdict clear, no open reds (2026-11-12, main d8283f55)."
  - >-
    Evidence: the 2026-11-10 draft re-grounding (read-only; probe base f866f98b) re-checked at d8283f55; the
    2026-10-05 feedback-loop review (out of repo, findings restated in the report); a blind advisor consult on the
    design forks (2026-11-11), each claim it relied on spot-checked against the cited file:line.
  - >-
    Recs filed 2026-11-11/12, each read back: rec-5077, rec-5078, rec-5079, rec-5080, rec-5097; notes on rec-4706,
    rec-4606, rec-4438, rec-4028. Draft P1 withdrawn by R1.
  - >-
    Unanswered, recorded as asked: T1.13 ownership and the ci-rca one-filer question, posted to the coordinator log
    (issue #1963) on 2026-11-12; answers land on recs, not this report.
  - "fork: where rec_ids come from | chosen: held until back-validation is planned, which picks a merge-time annotate producer or a client-side trailer join; read-time derivation rejected | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: report section 17 R1; rec-4606 note"
  - "fork: where the loop's daily series live | chosen: settled rows in the loop record journal (CD.47), the monitor's per-day counts as a row kind, stitched windows only to seed | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: report section 17 R2; rec-4438 and rec-5077 notes"
  - "fork: friction G1, a gate failure inside an erroring Bash call | chosen: absorb into the gate label and report the absorbed count | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: report section 17 R3; rec-5097"
  - "fork: report as standing record or dated snapshot | chosen: dated snapshot, rulings in recs | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: report header and section 17 R4"
  - "fork: rec-4028 owner | chosen: the Agents in GitHub workspace, reasoning mapping reviewed here | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: report section 17 R5; rec-4028 note"
  - "fork: read_version for the ladder, digest-keyed lanes or integer versions | chosen: integer per verb beside the digest with a lockstep check | class: asked | precedent: settled with notice on the advisor's evidence, shown to the operator before writing the plan (2026-11-11) | precedent_kind: none | reversible: yes | persisted: report section 17 S1; rec-5080"
  - "fork: content reader deploy as a deliberation prerequisite, the repeat key source, the gate list, the price table | chosen: forensic reads only; producer input_key; the operator's 2026-11-10 list; tokens-only | class: asked | precedent: settled with notice on the advisor's evidence, shown to the operator before writing the plan (2026-11-11) | precedent_kind: none | reversible: yes | persisted: report section 17 S2-S5; rec-5079; rec-4606 note"
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decisions 199, 221, 228, 231, 235, 239, 249, 250, 252 and 253 sections only
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
