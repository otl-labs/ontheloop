    records rec-5144 in sections 1.3 and 18. Earlier: clear on 2a62a61c at about 20:33Z 2026-11-12; unavailable (rec
    store unreachable, Decision 256's Problem) at 20:48Z on 5291a39e. Decision 254's 2026-11-12 amendment of Decision
    226 cl.4 replaced the past-SLO block with an operator alarm; red_overlap's slo_breached rule predates it.
  - >-
    Evidence: the 2026-11-10 draft (probe base f866f98b); [repo] claims re-read at 5291a39e and, for files changed
    since, at 0d51ede0 (report section 1.3); runnable W1 hermetic steps re-run at d8283f55, 3f8edd12, b4d76e92,
    5291a39e and 0d51ede0; the 2026-10-05 review (restated in the report); two
    blind advisor consults (2026-11-11 forks; 2026-11-12 daily series and one filer); decision-scout rounds 1-3, plan critique rounds 1-4 and two report critiques.
  - >-
