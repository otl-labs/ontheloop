  - "fork: where rec_ids come from | chosen: held until back-validation is planned, which picks a merge-time annotate producer or a client-side trailer join; read-time derivation rejected | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: report section 17 R1; rec-4606 note"
  - "fork: where the loop's daily series live | chosen: verdict records plus frozen daily rows copied from named verbs, under a numbered Decision amending Decision 199 cl.1 filed with CD.47; the row shape is left to that Decision and rec-5077 (first ruled as plain settled rows, re-asked the same day after round 1 found the clash; a blind advisor recommended this form) | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: report section 17 R2; rec-4438 and rec-5077 notes"
  - "fork: friction G1, a gate failure inside an erroring Bash call | chosen: absorb into the gate label and report the absorbed count | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: report section 17 R3; rec-5097"
