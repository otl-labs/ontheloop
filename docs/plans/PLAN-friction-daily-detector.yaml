schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: friction-daily-detector
intent: >-
  The feedback loop's first daily detector, propose-only (feedback-loop wave 2, plan 3). A new package
  scripts/feedback_loop with a friction command reads the last seven UTC days of friction_signature_counts, sums the
  per-tree rows per classifier_version and signature group, and derives two finding kinds under versioned detector params
  (detector_version 1): friction_coverage (the unmapped share of process-event facts above a bar) and friction_recurring
  (one labelled, non-generic signature group, repeat runs included, seen in at least min_sessions sessions and min_facts
  facts in the window). Each finding carries a ready-to-file rec draft (file_rec fields, a context_v2_json naming
  detector_id, subject_key, classifier_version and detector_version, and a decidable --assert-quiet acceptance probe) and,
  from one read-only scoped rec read, the state of the newest rec under source feedback_loop carrying the same subject, so a
  filed, rejected or covered subject is listed as decided rather than proposed again. Nothing is filed and nothing is
  stored (Decision 199 cl.1). A new daily workflow, feedback-loop.yml, runs the command and writes a counts line to the log
  and a public-safe findings table to the job summary; the full drafts and the operator's group review sheet (the pilot
  c3 review form) come only from the same command run in an agent session and are refused under GitHub Actions. The rec
  source feedback_loop is registered, and T3.3's stale files_in_scope is re-grounded to the package and the workflow.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-friction-daily-detector.yaml
phase: >-
  Feedback-loop wave 2 (operator-directed 2026-11-18): plan 3 of 4, after plan 1 (PLAN-friction-signature-coverage, built
  24757464, its verb live: see context) whose verb it reads. Realizes T3.3's detector shape at the read_all rung,
  propose-only; closes no criterion: T3.3 c1 (as ids after this plan's re-ground) needs the loop filer and a first-rung
  window, and c2 needs the filer's rejected share. CD.45 pilot item pwi-friction-classifier c3 (the operator's label
  review, read_all) gets its group review form; its status stays open (the pilot file is not edited). pwi-rec-filing-dedupe
  (the filer) stays wave 3; this plan's read-only rec match is display only and the filer's decision replaces it.
closes_criteria: []
cites: [dec:61, dec:79, dec:84, dec:101, dec:136, dec:162, dec:199, dec:201, dec:205, dec:210, dec:215, dec:221, dec:236, dec:246, dec:249, dec:267, dec:272, dec:279]
scope:
  - file: scripts/feedback_loop/__init__.py
    action: Create
    purpose: >-
      Package docstring only: the feedback loop's daily deterministic detectors (friction first); propose-only, files and
      stores nothing; output is a query result (Decision 199 cl.1). No re-exports.
  - file: scripts/feedback_loop/friction.py
    action: Create
    purpose: >-
      The detector core, pure apart from the injected reader. DETECTOR_PARAMS = {detector_version: 1, window_days: 7,
      coverage_bar: 0.20, min_process_event_facts: 20, min_sessions: 3, min_facts: 5, classes: (exception, rework),
      min_trees: 10} (unmeasured seeds: the pilot filer's min_sessions 3, min_events 5, window 7 and the wave 2 advice's
      coverage bar). read_window(reader, first, last) reads friction_signature_counts through scripts.telemetry_usage's
      windowed reads (its _Reads: halving on 413/504, the 32-call cap, WindowFailed), so one 7-day window is at most 13
      calls. Coverage is scripts.telemetry_usage.friction(rows, Namespace(workflow=None)) at the current FRICTION_RULES
      classifier_version V (so the CLI and the detector never disagree); friction_coverage (subject_key coverage) fires
      when process_event_facts >= min_process_event_facts and unmapped_failure_share > coverage_bar, and is unmeasurable
      (no finding, reported) below that count. Groups: rows at V summed across trees on (observation_type, signature,
      disposition, rule_id, label, class, generic), fact_count and session_count each summed (a session belongs to one
      tree, so the sum is exact), plus tree_count (distinct trees in the group), reported beside session_count: the seed
      stays on sessions, the pilot filer's grain, and one tree's sub-agent sessions can meet it. friction_recurring (subject_key "<rule_id>|<signature>" when a committed rule names the signature, else the opaque
      "<rule_id>|sha256:<first 12 hex of sha256 of the signature's UTF-8>", so filed rec text never spells an unpublished
      signature: today only repeat runs, whose signature names a tool and can name a connector's tool) fires for a group with generic
      false, class in classes, session_count >= min_sessions and fact_count >= min_facts, and a named failure as the
      operator's approach defines it: the group's rule matches one exact signature (a hook block, a failing check or a
      failing pre-commit hook) or the group is a repeat run (rule_id run, a tool failing repeatedly in a row); groups
      labelled by a prefix rule (r10, r11: status: outcomes) are counted, never a finding. Rows at another classifier_version are counted and reported, never a finding. Findings rank
      coverage first, then session_count desc, fact_count desc, subject_key. rec_states(reader): one scoped read of
      ops_recommendations rows with source feedback_loop (the current_state row_filter scripts.rec_episode.find_recs
      uses, all statuses kept; find_recs itself is not called, because it keeps only rows of one status and would drop
      declined, superseded, closed and failed rows; the source is proposals.SOURCE, the package's one literal; this is the source-scoped
      full-column read shape Decision 215 cl.2 and its residual rec-4236 name, which find_recs already uses; this call site
      joins the population rec-4236's move to a bounded verb covers; at read_all
      a few dozen rows stay far under Decision 215's 4.5 MB scoped-read reversal condition), and every returned row must
      carry id, status, source, created_timestamp, last_updated_timestamp and context_v2_json or the read raises (find_recs'
      _assert_rows_carry_keys shape: a projection change can never read as "new"); a row whose context_v2_json is null
      or not a JSON object is skipped and counted (unparsed_recs), never a match; for each finding the newest matching rec (created_timestamp, then the id's numeric part) whose parsed
      context_v2_json carries the same detector_id and subject_key gives its state: open filed, declined rejected,
      superseded covered, closed or failed recurred (proposed again, naming the old rec) only when window_from is after
      that rec's last_updated_timestamp date, else closing (decided: the window still holds friction from before the
      close); no match is new. A failed read
      raises (Decision 215: never read as no recs). friction_trees = distinct (root_session_id, harness_session_key,
      session_started_at) among the window's rows at V. The verb lists only trees holding at least one friction fact (it
      joins the facts to the trees), so min_trees is a floor on classified friction traffic at V, not on activity; rows at
      another version count only in other_version_rows, so zero rows at V (a rules merge not yet deployed) gives
      friction_trees 0.
  - file: scripts/feedback_loop/proposals.py
    action: Create
    purpose: >-
      draft(finding, window, params) -> {fields, context_v2_json} for scripts.ops_data_portal.file_rec. fields: title
      (friction_recurring "Recurring friction: <signature>" for a rule-named signature, "Repeated tool failures, tool
      <12 hex>" for an opaque one (measured Jaccard 0.6 between two such titles; that clears the 0.7 open-duplicate rule
      but meets rec_relevance's 0.5 closed-sibling rule, which only yields a close_proposed string for a caller passing
      closed recs, never an auto-close, and backlog-health passes none: accepted); friction_coverage "Friction coverage:
      <pct>% of process-event
      failures unnamed at classifier version <V>"; label, rule, counts and window go in context, because a shared template
      with counts and dates makes two drafts on one file read as duplicates under rec_relevance's title Jaccard 0.7: the
      measured pair "Recurring friction: gate:lint" / "Recurring friction: gate:pytest_diff" scores 0.5), file (hook:X
      -> the first existing .claude/hooks/X.py or X.sh; gate:X -> the module file of the Entry named X in any
      scripts/checks/<domain>/_manifest.py ENTRIES (the check manifests are the name-to-module map: validate_cc_limits
      lives in scripts/checks/sloc/cc_limits.py, so a filename match would miss it); precommit:X ->
      .pre-commit-config.yaml; anything else, a hook with no file, a gate no manifest registers (the scaffold phases
      gate:lint, gate:pytest_diff and gate:precommit_changed today) and coverage -> src/common/ducklake_event_read_verbs.py,
      the rules that labelled it), status open, source feedback_loop, priority Low, effort S (no risk or automatable: file_rec derives both from file and
      effort, and its formula overrides any caller value), context (counts, window, trees, both versions, the label's
      rule, the local command that lists examples, and the sentence that the acceptance probe is evidence the friction
      stopped, not proof a fix worked: a proof close stays with back-validation, Decision 221's judge), acceptance
      "AWS_PROFILE=agent_platform bin/venv-python -m scripts.feedback_loop friction --assert-quiet <detector_id>
      <shlex-quoted subject_key> --classifier-version <V>". The source literal is written once, as "source": "feedback_loop"
      in the module's base-fields dict literal (the form check_source_registry's pattern matches; a bare constant would
      make the scan vacuous), and SOURCE is read from that dict for friction.py's rec read; proposals imports friction
      only under TYPE_CHECKING. The file lookup's paths are this repository's own layout and a miss falls back to the
      rules file; the package is not executor, adapter or port code, so Decision 212's ports.yaml record is not owed.
      context_v2_json: detector_id, subject_key, classifier_version, detector_version,
      window_from, window_to, fact_count, session_count, probe_role "evidence_not_proof".
  - file: scripts/feedback_loop/render.py
    action: Create
    purpose: >-
      summary_markdown(result): the public job summary. A header (window, detector_version, classifier_version, calls,
      friction trees at V, process-event facts, unmapped share or unmeasurable), then one table of findings (state, detector, rule_id,
      label, class, signature, fact_count, session_count, tree_count, rec id when one matches) and a footer naming the local command for
      the drafts and the review sheet. Published-name rule: a signature is printed only when it equals the signature of a
      rule in the committed FRICTION_RULES; any other is printed as the fixed placeholder "(not published)", never its
      opaque key (a 12-hex digest of a tool name is confirmable by hashing candidate tool names); the table's rec id
      column lets the operator match a filed rec; the opaque key appears only in --json (subject_key) and --sheet, and the
      plain signature of a subject no rule names appears only in --sheet.
      Never a session id, root or
      harness key, branch, workflow value of a row, error body or URL host. sheet_markdown(result, rows): the local c3
      group review sheet: per classifier_version a header (window, friction trees, process-event facts, unmapped share,
      classifier_version), one row per group (group number, observation_type, signature, disposition, rule_id, label,
      class, generic, fact_count, session_count, tree_count, two example trees: the two with the most facts in the group, then
      session_started_at, then root_session_id, each as root_session_id, session_started_at and branch) with blank
      columns for the label verdict (right, wrong, should be specific) and, for a finding, the draft verdict (file,
      covered by rec, reject); every repeat run listed per tree; and a per-tree index (tree ref, workflow, the group
      numbers it contributes with fact counts). The verb's grain is the tree, so the sheet is per tree; whether that
      meets the pilot c3 wording "per session" is the pilot owner's call, not this plan's.
  - file: scripts/feedback_loop/__main__.py
    action: Create
    purpose: >-
      python -m scripts.feedback_loop friction [--to YYYY-MM-DD] [--summary PATH] [--json PATH] [--sheet PATH]
      [--assert-quiet DETECTOR SUBJECT --classifier-version N]. --to defaults to the previous UTC day and must be before today (else exit 2);
      the window is the seven days ending there. --json (findings with their drafts) and --sheet are refused with exit 2
      and one FRICTION_REFUSED reason=private_output_in_ci line, before any read, when GITHUB_ACTIONS is true. --summary
      appends summary_markdown. stdout is one counts line: FRICTION window= detector_version= classifier_version= calls=
      rows= friction_trees= process_event_facts= unmapped= coverage=finding|ok|unmeasurable findings= proposed= decided=
      unparsed_recs= other_version_rows= conflicted_rows= response_bytes= elapsed_s= (conflicted_rows counts rows with
      derivation_conflicted true, as telemetry_usage reports them; response_bytes is the length of the window's rows
      encoded as JSON, the response size the operator's approach promised; counts, version numbers and class words only, Decision 101). Exit 0 after a
      completed run whatever the findings (never a gate); 1 with one FRICTION_STOP stage=window|recs error_type=<word>
      status=<int|none> line when a window or the rec read failed. Extraction, since telemetry_usage.py is not in scope:
      for stage=window, error_type is the error_type= word parsed from str(WindowFailed) (telemetry_usage takes it from
      the reader's error body or the exception class, never a message) and status is getattr(exc.__context__, "status",
      None) (raise ... from None keeps __context__); for stage=recs, telemetry_usage._error_type(exc) and getattr(exc,
      "status", None). Any other exception prints FRICTION_STOP stage=internal error_type=<class name> status=none and
      exits 1, with no traceback under GITHUB_ACTIONS (a traceback can carry a row value; locally it goes to stderr).
      --json writes {"window": {"from", "to"}, "versions": {"detector_version", "classifier_version"}, "counts": {the
      counts line's keys}, "findings": [{"detector_id", "subject_key", "state", "rec_id" (null when none),
      "draft": {"fields", "context_v2_json"}}]}: every finding, proposed or decided, carries its draft. --assert-quiet requires --classifier-version (the rec's
      context_v2_json value, which the draft's acceptance carries), skips the rec read and fails closed: it exits 0 only
      after a completed run in which the version holds (friction_recurring: N equals the checkout's classifier_version V;
      friction_coverage: V >= N, since coverage is a property of the newest rules over the same facts and a coverage fix
      is itself a rules bump, so the probe measures at V as plan 1 compared shares across versions), friction_trees >=
      min_trees, the subject's detector was measurable (for coverage, process_event_facts >= min_process_event_facts)
      and that detector has no finding for the subject; anything else exits 2 (an internal error included: under
      --assert-quiet the stage=internal line exits 2, not 1), with one FRICTION_QUIET
      verdict=unmeasurable reason=version_mismatch|few_trees|coverage_unmeasurable|read_failed line, or
      verdict=not_quiet. A recurring subject's version mismatch is unmeasurable by design: the rules that named the
      subject changed, so quiet under new rules is not evidence the old friction stopped. The reader is
      scripts.telemetry_capture.read_route.make_routed_reader() (it serves the telemetry verb and the ops current_state
      read, as scripts.telemetry_verify does) unless injected. main() saves and restores the logging disable level (the
      reader's warnings can carry a URL host; rec-4553's lesson).
  - file: .github/workflows/feedback-loop.yml
    action: Create
    purpose: >-
      name feedback-loop. on: schedule one cron of the every-N-hours shape that
      scripts/convergence_health/sensor_liveness.py classifies as 86,400 s ('<M> */24 * * *', a minute other than
      telemetry-verification's 41), and workflow_dispatch with no inputs. permissions contents read; concurrency group
      feedback-loop, cancel-in-progress false. One job, friction: the same if-guard as telemetry-verification (schedule, or
      a main-only dispatch not by the dispatcher bot), timeout-minutes 45 (13 calls at the reader's 120 s timeout is about 26 minutes; the reader client's up to 3 attempts on
      a transient 502, 503 or 504 (not a typed 504 read_deadline_exceeded) could in theory triple that to about 78, but a run needing more than 45 minutes has failed in
      substance, and loop_liveness_stale sees it), permissions id-token write and contents read;
      steps in order: checkout, ./.github/actions/aws-region, setup-python 3.12, the venv install, configure-aws-credentials
      with the github-ci-branch role (the masked account-part env, no role-session-name), resolve and mask the reader and
      telemetry_reader Function URLs and hosts (the telemetry-verification loop without writer), then
      .venv/bin/python -m scripts.feedback_loop friction --summary "$GITHUB_STEP_SUMMARY". The same pinned action SHAs as
      telemetry-verification.yml at build time. No writer URL, no file_rec, no artifact upload, no terraform, apply,
      deploy or workflow dispatch; never a required check.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      A feedback-loop row beside telemetry-verification's: tier not_a_gate, ci_rca excluded, owner "platform" (the
      taxonomy's owner value), rationale: a
      propose-only daily report that files nothing; loop_liveness_stale backstops a run that cannot complete, so a ci-rca
      watch would double-record and could halt work over a report. The file is NEAR_CAP (494 of 500 effective lines on
      main eb1a4e39, plan_obligations' count, shared with ten or more unbuilt plans): one row in the one-line flow form
      decision-census uses (key: {tier, ci_rca, owner, rationale}), one effective line. Relief (the config class's "compact resolved rows" valve,
      config/structural_size_budgets.yaml): if the row would take the file past 500 effective lines measured on main at
      build, first fold telemetry-verification's seven-line block row into the same one-line flow form with its rationale
      text unchanged (decision-census's shape), measured again; if still over, fold further block rows the same
      way, each rationale unchanged; if none is left to fold, stop with a plan defect; never a raise.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      r3_workflows entries for every inline run body of the new job at its exactly-measured effective line count (the venv
      install, the URL resolution and the command), as #2258 registered decision-census.yml's new job.
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      canonical_id feedback_loop: description "Feedback-loop detector drafts (PLAN-friction-daily-detector): the daily
      friction detector drafts recs and never files them; at the read_all rung the operator files each accepted draft,
      and records a rejected one as declined (or a covered one as superseded, naming the covering rec) so the detector
      lists it as decided; drafts are filed only after the operator's label verdicts on the review sheet at that
      classifier_version (pilot pwi-friction-classifier c3's order); the loop filer (wave 3) files under this same
      source." signal_interpretation "Every rec
      carries context_v2_json detector_id and subject_key; recs filed before the loop filer carry no fingerprint, so the
      filer derives one from detector_id and subject_key; declined plus superseded over all recs under this source in 30
      days is the detector's rejected share (T3.3's staged false-positive measure). Drafts never spell a signature no committed
      rule names: such a subject is an opaque rule_id|sha256:<12 hex> key, because open rec rows reach public surfaces
      (backlog-health's census artifact, rec-5487; plans that copy rec text); the key is a code, not a secret: it is
      confirmable by hashing candidate tool names, so filing such a draft is the operator's call at filing time; the
      session-only review sheet maps it to the tool. Drafts default to priority Low. Operator-paced at read_all. Not
      source=ci_rca -- does NOT hard-block the /plan queue."
      added_date
      the build date.
