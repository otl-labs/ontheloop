  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    1. At start: read the operator's answer to the planning-time spend card, which the handoff states. "Only by hand"
    means this plan is amended first (drop on.schedule; revise AC4, VP 3's cron assertion, VP 9's scheduled tick, the
    taxonomy rationale's liveness backstop and the T3.3 c1 note) and the build waits for the amended plan (a plan
    defect, routing.plan_defect); no answer yet means build as written and ask at merge. Then re-run
    scripts.ci_rca.red_overlap over the scope; confirm friction_signature_counts is still served (one
    telemetry_usage friction call) and that ci_rca_taxonomy.yaml has one effective line of headroom for the one-line row (else the relief step in its scope row, which triggers past 500). Then the tests (steps 1-3) against
    synthetic rows; confirm red.
  - 2. The package (friction.py, proposals.py, render.py, __main__.py, __init__.py), then the workflow, the taxonomy row and the body ratchet entries.
  - 3. The source in the registry, then regenerate field_semantics (scripts.schema_to_field_semantics, then --check) and the guard's scan set; then T3.3 in the roadmap.
  - "4. Execute Verification Plan steps 1-5, then 6; loop until pass. On an unrecoverable failure stop and RCA (Decision 55)."
  - >-
    5. Commit Flow (implement skill and git-ops.yaml handoff_sequence, in this order; report each outcome separately).
    Readiness: bin/venv-python -m scripts.session.github_readiness (unknown is unproven, never PASS), copy code review's
    weakening_dispositions entries for every changed existing assertion into this plan, set implementation_declared: true,
    VP steps 1-5 pass. Rebase: git fetch origin main and rebase onto origin/main (scripts.session.rebase_resolve RESOLVE
    CLEAN). Validator evidence: VP step 6's full tier and validation_result --verify-head, PASS on that rebased, clean HEAD
    (any later rebase or fix commit needs a fresh run; a timeout is BLOCKED, handoff_policy). Postflight evidence:
    /tmp/implementation-retrospective.json with the postflight_evidence.CATEGORIES keys, then bin/venv-python -m
    scripts.session.postflight --evidence /tmp/implementation-retrospective.json passes. Push result: git push -u origin
    HEAD as its own call. PR result: the PR open (number returned), its body carrying the VP compliance table and the
    notice-class file list; subscribe to its activity. Merge result (standing authorisation: code review PROCEED, green CI
    and validate_merge_step green). Two always-ask items: spend, the daily run's running cost, and the public surface,
    the daily job summary on the public repository's Actions page (counts, labels, rule ids and only rule-named
    signatures; a curated projection over committed rule names, never an export of telemetry rows, Decision 111, in the
    counts-only line of telemetry-verification's precedent under Decision 101). The build PR merges only on the
    operator's own word on the final diff covering both, asked once in the build's own thread with the monthly estimate
    from context and a sample summary_markdown (from a pre-merge session run of the same command on the build branch with --summary,
    which needs no deploy, or a synthetic render; VP 8 runs only after the merge) pasted
    inline, after code review PROCEED and green CI (Decision 246 cl.4; coordinator standing_authorisation and
    approvals; the PLAN-telemetry-production-maintenance precedent). The planning-time answers (the 2026-11-21 fork
    answer on the summary's content, the spend card) inform the build and never stand in for that word:
    merge_step premerge --slug friction-daily-detector
    --message-file <the commit body>, merge_pull_request squash with that commit_message (subject starting
    feat(friction-daily-detector), which VP 7, 9 and 10 key on) and expectedHeadSha, then merge_step readback --sha
    <merge sha>.
  - 6. Post-deploy steps 7-9 once deploy-ducklake-lambdas has shipped a green main commit containing the merge; VP 10 is reported pending until the operator's next approved content reader deploy.
  - 'Report: what was implemented, verification results, the merge SHA, the deploy run id, the first workflow run id and the VP 8 counts.'
rollback: >-
  Nothing is stored and nothing was filed by the detector: revert the merge commit and let deploy-ducklake-lambdas ship the
  reverted field_semantics; the workflow and package leave with it. Recs the operator already filed under feedback_loop stay
  ordinary recs; a revert that removes the source from the accepted lists must first move or close them.
