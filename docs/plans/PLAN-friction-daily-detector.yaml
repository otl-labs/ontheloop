  - file: tests/feedback_loop/__init__.py
    action: Create
    purpose: Mirror test package marker.
  - file: tests/feedback_loop/test_friction.py
    action: Create
    purpose: >-
      Synthetic friction_signature_counts rows: coverage fires above the bar, is quiet at or below it and unmeasurable
      below min_process_event_facts; recurring fires at exactly min_sessions and min_facts and not one below either; generic
      groups, notice-class groups (r10), an exception-class prefix-rule group (r11, status:) at or above the seeds (counted,
      never fires) and other-version rows never fire; repeat runs fire; group sums across trees and
      windows equal scripts.telemetry_usage.friction's signatures; tree_count; friction_trees counts trees at V only (zero
      when every row is at another version); ranking; rec_states maps open, declined, superseded, closed and failed and
