schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: friction-daily-detector
intent: >-
  The feedback loop's first daily detector, propose-only (feedback-loop wave 2, plan 3). A new package
  scripts/feedback_loop with a friction command reads the last seven UTC days of friction_signature_counts, sums the
  per-tree rows per classifier_version and signature group, and derives two finding kinds under versioned detector params
  (detector_version 1): friction_coverage (the unmapped share of process-event facts above a bar) and friction_recurring
  (one labelled, non-generic signature group, repeat runs included, seen in at least min_sessions sessions and min_facts
  facts in the window). Each finding carries a ready-to-file rec draft (file_rec fields, a context_v2_json naming
  detector_id, subject_key, classifier_version and detector_version, and a decidable --assert-quiet acceptance probe) and,
  from one read-only scoped rec read, the state of the newest rec under source feedback_loop carrying the same subject, so a
  filed, rejected or covered subject is listed as decided rather than proposed again. Nothing is filed and nothing is
  stored (Decision 199 cl.1). A new daily workflow, feedback-loop.yml, runs the command and writes a counts line to the log
  and a public-safe findings table to the job summary; the full drafts and the operator's group review sheet (the pilot
  c3 review form) come only from the same command run in an agent session and are refused under GitHub Actions. The rec
  source feedback_loop is registered, and T3.3's stale files_in_scope is re-grounded to the package and the workflow.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-friction-daily-detector.yaml
phase: >-
  Feedback-loop wave 2 (operator-directed 2026-11-18): plan 3 of 4, after plan 1 (PLAN-friction-signature-coverage, built
  24757464, its verb live: see context) whose verb it reads. Realizes T3.3's detector shape at the read_all rung,
  propose-only; closes no criterion: T3.3 c1 (as ids after this plan's re-ground) needs the loop filer and a first-rung
  window, and c2 needs the filer's rejected share. CD.45 pilot item pwi-friction-classifier c3 (the operator's label
  review, read_all) gets its group review form; its status stays open (the pilot file is not edited). pwi-rec-filing-dedupe
  (the filer) stays wave 3; this plan's read-only rec match is display only and the filer's decision replaces it.
closes_criteria: []
cites: [dec:61, dec:79, dec:84, dec:101, dec:136, dec:162, dec:199, dec:201, dec:205, dec:210, dec:215, dec:221, dec:236, dec:246, dec:249, dec:267, dec:272, dec:279]
scope:
  - file: scripts/feedback_loop/__init__.py
    action: Create
    purpose: >-
      Package docstring only: the feedback loop's daily deterministic detectors (friction first); propose-only, files and
      stores nothing; output is a query result (Decision 199 cl.1). No re-exports.
  - file: scripts/feedback_loop/friction.py
    action: Create
    purpose: >-
      The detector core, pure apart from the injected reader. DETECTOR_PARAMS = {detector_version: 1, window_days: 7,
      coverage_bar: 0.20, min_process_event_facts: 20, min_sessions: 3, min_facts: 5, classes: (exception, rework),
      min_trees: 10} (unmeasured seeds: the pilot filer's min_sessions 3, min_events 5, window 7 and the wave 2 advice's
      coverage bar). read_window(reader, first, last) reads friction_signature_counts through scripts.telemetry_usage's
      windowed reads (its _Reads: halving on 413/504, the 32-call cap, WindowFailed), so one 7-day window is at most 13
      calls. Coverage is scripts.telemetry_usage.friction(rows, Namespace(workflow=None)) at the current FRICTION_RULES
      classifier_version V (so the CLI and the detector never disagree); friction_coverage (subject_key coverage) fires
      when process_event_facts >= min_process_event_facts and unmapped_failure_share > coverage_bar, and is unmeasurable
      (no finding, reported) below that count. Groups: rows at V summed across trees on (observation_type, signature,
      disposition, rule_id, label, class, generic), fact_count and session_count each summed (a session belongs to one
      tree, so the sum is exact). friction_recurring (subject_key "<rule_id>|<signature>") fires for a group with generic
      false, class in classes, session_count >= min_sessions and fact_count >= min_facts; repeat runs (rule_id run) are
      such groups. Rows at another classifier_version are counted and reported, never a finding. Findings rank
      coverage first, then session_count desc, fact_count desc, subject_key. rec_states(reader): one scoped read of
      ops_recommendations rows with source feedback_loop (the current_state row_filter scripts.rec_episode.find_recs
      uses, all statuses kept); for each finding the newest matching rec (created_timestamp, then id) whose parsed
      context_v2_json carries the same detector_id and subject_key gives its state: open filed, declined rejected,
      superseded covered, closed or failed recurred (proposed again, naming the old rec); no match is new. A failed read
      raises (Decision 215: never read as no recs). trees = distinct (root_session_id, harness_session_key,
      session_started_at) in the window's rows.
  - file: scripts/feedback_loop/proposals.py
    action: Create
    purpose: >-
      draft(finding, window, params) -> {fields, context_v2_json} for scripts.ops_data_portal.file_rec. fields: title
      (friction_recurring "Friction: <label> on <signature> in <S> sessions (<F> times), <from>..<to>"; friction_coverage
      "Friction coverage: <pct>% of process-event failures unnamed at classifier version <V>, <from>..<to>"), file (hook:X
      -> the first existing .claude/hooks/X.py or X.sh; gate:X -> the first sorted match of scripts/checks/**/X.py;
      precommit:X -> .pre-commit-config.yaml; anything else and coverage -> src/common/ducklake_event_read_verbs.py, the
      rules that labelled it), status open, source feedback_loop (the module's one source literal, which the source
      registry guard scans), priority Low, effort S, risk Low, context (counts, window, trees, both versions, the label's
      rule, the local command that lists examples, and the sentence that the acceptance probe is evidence the friction
      stopped, not proof a fix worked: a proof close stays with back-validation, Decision 221's judge), acceptance
      "AWS_PROFILE=agent_platform bin/venv-python -m scripts.feedback_loop friction --assert-quiet <detector_id>
      <shlex-quoted subject_key>". context_v2_json: detector_id, subject_key, classifier_version, detector_version,
      window_from, window_to, fact_count, session_count, probe_role "evidence_not_proof".
  - file: scripts/feedback_loop/render.py
    action: Create
    purpose: >-
      summary_markdown(result): the public job summary. A header (window, detector_version, classifier_version, calls,
      trees, process-event facts, unmapped share or unmeasurable), then one table of findings (state, detector, rule_id,
      label, class, signature, fact_count, session_count, rec id when one matches) and a footer naming the local command for
      the drafts and the review sheet. Published-name rule: a signature is printed only when it equals the signature of a
      rule in the committed FRICTION_RULES; any other is printed as "(not published)". Never a session id, root or
      harness key, branch, workflow value of a row, error body or URL host. sheet_markdown(result, rows): the local c3
      group review sheet: per classifier_version a header (window, trees, process-event facts, unmapped share,
      classifier_version), one row per group (group number, observation_type, signature, disposition, rule_id, label,
      class, generic, fact_count, session_count, two example trees: the two with the most facts in the group, then
      session_started_at, then root_session_id, each as root_session_id, session_started_at and branch) with blank
      columns for the label verdict (right, wrong, should be specific) and, for a finding, the draft verdict (file,
      covered by rec, reject); every repeat run listed per tree; and a per-tree index (tree ref, workflow, the group
      numbers it contributes with fact counts), so the sheet answers the pilot's per-session evidence requirement.
  - file: scripts/feedback_loop/__main__.py
    action: Create
    purpose: >-
      python -m scripts.feedback_loop friction [--to YYYY-MM-DD] [--summary PATH] [--json PATH] [--sheet PATH]
      [--assert-quiet DETECTOR SUBJECT]. --to defaults to the previous UTC day and must be before today (else exit 2);
      the window is the seven days ending there. --json (findings with their drafts) and --sheet are refused with exit 2
      and one FRICTION_REFUSED reason=private_output_in_ci line, before any read, when GITHUB_ACTIONS is true. --summary
      appends summary_markdown. stdout is one counts line: FRICTION window= detector_version= classifier_version= calls=
      rows= trees= process_event_facts= unmapped= coverage=finding|ok|unmeasurable findings= proposed= decided=
      other_version_rows= elapsed_s= (counts, version numbers and class words only, Decision 101). Exit 0 after a
      completed run whatever the findings (never a gate); 1 with a FRICTION_STOP class=<exception class>
      status=<int|none> line when a window or the rec read failed; --assert-quiet skips the rec read and exits 0 only
      after a completed run with trees >= min_trees and no finding for that detector and subject, else 2. The reader is
      scripts.telemetry_capture.read_route.make_routed_reader() (it serves the telemetry verb and the ops current_state
      read, as scripts.telemetry_verify does) unless injected. main() saves and restores the logging disable level (the
      reader's warnings can carry a URL host; rec-4553's lesson).
  - file: .github/workflows/feedback-loop.yml
    action: Create
    purpose: >-
      name feedback-loop. on: schedule one cron of the every-N-hours shape that
      scripts/convergence_health/sensor_liveness.py classifies as 86,400 s ('<M> */24 * * *', a minute other than
      telemetry-verification's 41), and workflow_dispatch with no inputs. permissions contents read; concurrency group
      feedback-loop, cancel-in-progress false. One job, friction: the same if-guard as telemetry-verification (schedule, or
      a main-only dispatch not by the dispatcher bot), timeout-minutes 30, permissions id-token write and contents read;
      steps in order: checkout, ./.github/actions/aws-region, setup-python 3.12, the venv install, configure-aws-credentials
      with the github-ci-branch role (the masked account-part env, no role-session-name), resolve and mask the reader and
      telemetry_reader Function URLs and hosts (the telemetry-verification loop without writer), then
      .venv/bin/python -m scripts.feedback_loop friction --summary "$GITHUB_STEP_SUMMARY". The same pinned action SHAs as
      telemetry-verification.yml at build time. No writer URL, no file_rec, no artifact upload, no terraform, apply,
      deploy or workflow dispatch; never a required check.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      A feedback-loop row beside telemetry-verification's: tier not_a_gate, ci_rca excluded, owner "platform" (the
      taxonomy's owner value), rationale: a
      propose-only daily report that files nothing; loop_liveness_stale backstops a run that cannot complete, so a ci-rca
      watch would double-record and could halt work over a report. The file is NEAR_CAP (493 of 500 effective lines on
      main 5070cb63, plan_obligations' count): one row in the two-line flow form telemetry-causal-chain uses (key line plus
      one {tier, ci_rca, owner, rationale} line); if it would cross 500 at build, stop with a plan defect.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      r3_workflows entries for every inline run body of the new job at its exactly-measured effective line count (the venv
      install, the URL resolution and the command), as #2258 registered decision-census.yml's new job.
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      canonical_id feedback_loop: description "Feedback-loop detector drafts (PLAN-friction-daily-detector): the daily
      friction detector drafts recs and never files them; at the read_all rung the operator files each accepted draft,
      and records a rejected one as declined (or a covered one as superseded, naming the covering rec) so the detector
      lists it as decided; the loop filer (wave 3) files under this same source." signal_interpretation "Every rec
      carries context_v2_json detector_id and subject_key; declined plus superseded over all recs under this source in 30
      days is the detector's rejected share (T3.3's staged false-positive measure). Operator-paced at read_all." added_date
      the build date.
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: >-
      GENERATED, never hand-edited: after the source_registry entry, run bin/venv-python -m
      scripts.schema_to_field_semantics, which adds feedback_loop to both accepted_values lists that carry the source
      vocabulary (ops_recommendations.source and telemetry_agents.agent_type, both derived from the registry through
      source-lineage.yaml's registry_key), as #2258 added decision_census to both; then --check exits 0. The writer refuses
      an unlisted source, so the operator's first filing waits on the governed deploy (VP 7; Decision 210 cl.4: the
      accepted value ships before anything emits it).
  - file: scripts/checks/ops_governance/check_source_registry.py
    action: Modify
    purpose: SCANNED_PATHS gains "scripts/feedback_loop/proposals.py", so its source literal must be registered.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Notice class (approval-routing.yaml: the roadmap is outside the gated set). T3.3 only, re-grounded per the tier item
      freshness gate's stale-reference check: files_in_scope becomes "scripts/feedback_loop/    # new: the loop's daily
      deterministic detectors, friction first (a T4 schedule home per CD.27 stays open)" and
      ".github/workflows/feedback-loop.yml    # new", replacing the telemetry_analysis_agent Lambda and
      scheduled-telemetry-analysis.yml lines; and, because Decision 136 forbids a touched tier_item from keeping bare-string
      criteria, its two exit_criteria become {id: c1, text: <unchanged>, status: open} and {id: c2, text: <unchanged>,
      status: open} in their current order (the ledger's load-time ids). intent, status and every other key unchanged.
  - file: tests/feedback_loop/__init__.py
    action: Create
    purpose: Mirror test package marker.
  - file: tests/feedback_loop/test_friction.py
    action: Create
    purpose: >-
      Synthetic friction_signature_counts rows: coverage fires above the bar, is quiet at or below it and unmeasurable
      below min_process_event_facts; recurring fires at exactly min_sessions and min_facts and not one below either; generic
      groups, notice-class groups and other-version rows never fire; repeat runs fire; group sums across trees and
      windows equal scripts.telemetry_usage.friction's signatures; ranking; rec_states maps open, declined, superseded,
      closed and failed and picks the newest; a failed rec read raises; read_window halves on a 413.
  - file: tests/feedback_loop/test_proposals.py
    action: Create
    purpose: >-
      Every draft passes validate_source and lint_acceptance_command(require_discrimination=True, require_decidable=True);
      the file lookup for hook, gate, pre-commit and other signatures; context_v2_json keys; the evidence-not-proof
      sentence; a subject with a quote or space is shell-quoted.
  - file: tests/feedback_loop/test_render.py
    action: Create
    purpose: >-
      The summary prints a rule-named signature and "(not published)" for any other, and no planted session id, root or
      harness key, branch or workflow value; the sheet's groups, examples, repeat runs, per-tree index and deterministic
      order.
  - file: tests/feedback_loop/test_main.py
    action: Create
    purpose: >-
      The counts line grammar; --json and --sheet refused under GITHUB_ACTIONS before any read; --to today refused;
      --assert-quiet exit contract (0 only after a completed run with trees >= min_trees and no finding; 2 otherwise,
      including a read failure); a window or rec read failure prints class and status only (no planted host) and exits 1;
      --summary appends; the logging disable level is restored.
  - file: tests/test_feedback_loop_workflow.py
    action: Create
    purpose: >-
      The workflow's triggers, cron period 86,400 s, guard, permissions, concurrency, step order (checkout < install <
      assume < resolve < command), masking of both URLs and hosts, the command, and the absence of writer, file_rec,
      upload-artifact and every forbidden word telemetry-verification's test lists; the taxonomy row. The bot-refusal half
      of the guard (Decision 267 cl.3) is also held by tests/verify_ci_workflow/test_dispatch_bot_guard.py, which scans
      every dispatchable workflow, so the new file must pass it unchanged.
  - file: tests/checks/ops_governance/test_check_source_registry.py
    action: Modify
    purpose: The scanned-path expectation includes scripts/feedback_loop/proposals.py.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - >-
    Lambda gating disposition (Decision 79): compute_affected_artifacts flags seven ducklake Lambdas through
    config/lambda/ducklake/field_semantics.yaml only (no Lambda code changes). deploy-ducklake-lambdas.yml ships the
    last-green main ref (Decision 249 cl.2, Decision 254 cl.5), so the writer and readers carry the new source on the first
    run whose full tier covering the merge is green (VP 7). The content reader also bundles the file, but its protective
    set (src/lambdas/ducklake_telemetry_content_reader, src/common/ducklake_content_read_verbs.py, src/sensitive_values)
    excludes it, so the merge does not wake its operator-gated channel (Decision 272 cl.1); its copy updates on the next
    deploy-telemetry-content run the operator approves (VP 10, pending), and is inert there (it writes no rec and checks
    no agent_type on read). No Terraform or IAM change: the github-ci-branch role trusts main by ref
    (terraform/personal/oidc_ci_roles.tf), and the monitor already proves it reads the telemetry reader and ops reader.
acceptance_criteria:
  - >-
    Over synthetic rows the detector raises friction_coverage only above the bar with at least 20 process-event facts and
    friction_recurring only for non-generic exception or rework groups at or above 3 sessions and 5 facts, at the current
    classifier_version only, and its coverage figures equal scripts.telemetry_usage.friction's for the same rows.
  - >-
    Every draft is fileable as written: source registered, acceptance probe decidable and discriminating under the
    portal's lint, context_v2_json carrying detector_id and subject_key; a subject whose newest feedback_loop rec is open,
    declined or superseded is listed as decided, and one whose newest rec is closed or failed is proposed again naming it.
  - >-
    No public surface carries a session, tree or branch reference or a signature the committed rules do not name: the job
    summary prints only rule-named signatures, and --json and --sheet are refused under GitHub Actions before any read.
  - >-
    feedback-loop.yml runs the command daily on main with the CI branch role, both URLs masked, no writer and no filing;
    after deploy its first run succeeds and its log holds one FRICTION counts line.
  - >-
    After deploy, an agent-session run over the last seven days completes (one counts line, exit 0), writes the drafts
    and the review sheet, and every draft passes the portal lint; the counts and elapsed time are recorded in the PR.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Detector core, drafts and rendering against synthetic rows.
    command: bin/venv-python -m pytest tests/feedback_loop/test_friction.py tests/feedback_loop/test_proposals.py tests/feedback_loop/test_render.py -q
    expected: exit 0 with every test passing; red before (the package does not exist).
    fix_if: a threshold fires one below its seed, a generic or other-version group fires, sums disagree with telemetry_usage.friction, a draft fails the lint, or a planted session id reaches the summary
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: feedback-loop-friction-detector
  - step: 2
    phase: pre-deploy
    action: The CLI contract.
    command: bin/venv-python -m pytest tests/feedback_loop/test_main.py -q
    expected: exit 0 with every test passing; red before (no scripts.feedback_loop).
    fix_if: a private output is written under GITHUB_ACTIONS, --assert-quiet passes without a completed run or below min_trees, or an error line carries a planted host
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: feedback-loop-friction-cli
  - step: 3
    phase: pre-deploy
    action: The workflow, its taxonomy row and the source registry guard's scan set.
    command: bin/venv-python -m pytest tests/test_feedback_loop_workflow.py tests/checks/ops_governance/test_check_source_registry.py -q
    expected: exit 0 with every test passing; red before (no feedback-loop.yml, no taxonomy row, scan set without the module).
    fix_if: the job names the writer, files, uploads an artifact, misses a mask, or the cron is not 86,400 s
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: feedback-loop-workflow-wiring
  - step: 4
    phase: pre-deploy
    action: T3.3 re-grounded once (a moment claim, Decision 244 cl.4).
    command: >-
      PYTHONPATH=. bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      t=next(i for i in d['tier_items'] if i['id']=='T3.3'); f=t['files_in_scope']; c=t['exit_criteria'];
      assert f==['scripts/feedback_loop/', '.github/workflows/feedback-loop.yml'], f;
      assert [(x['id'], x['status']) for x in c]==[('c1','open'),('c2','open')], c;
      assert c[0]['text']=='Agent runs daily and files anomaly recs via log-rec'; print('T33_REGROUNDED')"
    expected: prints T33_REGROUNDED and exits 0; red before (the Lambda path and bare-string criteria).
    fix_if: another T3.3 key changed, a criterion's text changed, or the order moved
    hermetic: true
    expected_literals: [T33_REGROUNDED]
    graduation: waive
    graduation_waiver_reason: >-
      A moment claim about one roadmap item's wording: a later plan may legitimately re-ground T3.3 again (the filer plan
      applies its staged criteria text), so a standing copy would turn red with nothing wrong (Decision 244 cl.4);
      validate_platform_roadmap keeps the shape valid.
  - step: 5
    phase: pre-deploy
    action: Fast tier on the build branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: any check fails, notably the workflow body ratchet, the source registry guard, the taxonomy check or the roadmap schema
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole fast-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push; started from the top-level session, backgrounded with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
  - step: 7
    phase: post-deploy
    action: The governed deploy shipped the writer and readers with the new source (last-green ref).
    command: >-
      git fetch -q origin main && build=$(git log -1 --format=%H --grep='^feat(friction-daily-detector)' origin/main) &&
      test -n "$build" && ok= && for id in $(gh api
      'repos/otl-labs/ontheloop/actions/workflows/deploy-ducklake-lambdas.yml/runs?status=success&per_page=100' --jq
      '.workflow_runs[].id'); do jobs=$(gh api "repos/otl-labs/ontheloop/actions/runs/$id/jobs" --jq '.jobs[] |
      select((.name=="deploy-serving" or .name=="smoke") and .conclusion=="success") | .name + " " + (.id|tostring)');
      echo "$jobs" | grep -q '^smoke ' || continue; job=$(echo "$jobs" | sed -n 's/^deploy-serving //p');
      deployed=$(gh api "repos/otl-labs/ontheloop/actions/jobs/$job/logs" | grep -oE 'LAMBDA_ARTIFACT_SHA: [0-9a-f]{40}' |
      head -1 | cut -d' ' -f2); echo "run $id deployed $deployed"; if git merge-base --is-ancestor "$build" "$deployed";
      then echo contains; ok=1; fi; break; done; test -n "$ok"
    expected: >-
      the newest successful run with green deploy-serving and smoke jobs deployed a LAMBDA_ARTIFACT_SHA that has the build
      commit as an ancestor (prints contains); non-zero until that run exists, so it is re-run after the deploy that follows
      the merge (the same read through mcp__github__actions_list and get_job_logs where gh is unavailable)
    fix_if: the run is held or failed; read deploy-paths.yaml's code-deploy recovery, never break-glass by default
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      An agent-session run over the last seven days, then the drafts against the portal's lint. Record the FRICTION line,
      the findings, proposed and decided counts, calls and elapsed_s in the PR (seeds are unmeasured: a first run listing
      more than 25 proposed findings is reported to the operator, not tuned in this build).
    command: >-
      out=/tmp/feedback-loop && mkdir -p $out && AWS_PROFILE=agent_platform bin/venv-python -m scripts.feedback_loop friction
      --json $out/friction.json --sheet $out/friction-sheet.md | tee $out/line.txt && grep -q '^FRICTION window=' $out/line.txt
      && test -s $out/friction-sheet.md && PYTHONPATH=. bin/venv-python -c "import json; from
      scripts.executor.acceptance_lint import lint_acceptance_command as l; from scripts.executor.rec_write_guidance import
      validate_source as v; d=json.load(open('$out/friction.json')); fs=d['findings']; [v(f['draft']['fields']['source']) for
      f in fs]; bad=[f['subject_key'] for f in fs if not l(f['draft']['fields']['acceptance'], require_discrimination=True,
      require_decidable=True)[0]]; assert not bad, bad; print('DRAFTS_OK', len(fs))"
    expected: exit 0, one FRICTION line, a non-empty sheet and DRAFTS_OK with the finding count
    fix_if: the run stops (read the FRICTION_STOP class), a draft fails the lint, or the sheet is empty while rows exist
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      The workflow's first run after the merge (a main dispatch the build may start with actions_run_trigger, or the next
      scheduled tick) succeeded and its log holds one FRICTION line and no URL host.
    command: >-
      run=$(gh api 'repos/otl-labs/ontheloop/actions/workflows/feedback-loop.yml/runs?branch=main&per_page=1' --jq
      '.workflow_runs[0] | select(.conclusion=="success") | .id') && test -n "$run" && job=$(gh api
      "repos/otl-labs/ontheloop/actions/runs/$run/jobs" --jq '.jobs[] | select(.name=="friction") | .id') && gh api
      "repos/otl-labs/ontheloop/actions/jobs/$job/logs" > /tmp/feedback-loop-run.log && test "$(grep -c 'FRICTION window='
      /tmp/feedback-loop-run.log)" = 1 && ! grep -qE 'https://[a-z0-9]+\.(lambda-url|execute-api)\.' /tmp/feedback-loop-run.log
    expected: exit 0 (the same read through mcp__github__actions_list and get_job_logs where gh is unavailable)
    fix_if: the run failed (read its FRICTION_STOP line), the line repeats, or an unmasked URL appears
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      Decision 79's deploy step for the content reader: its bundled field_semantics copy updates on the next
      deploy-telemetry-content run the operator approves; this build never dispatches it. Reported pending until then.
    command: >-
      gh api 'repos/otl-labs/ontheloop/actions/workflows/deploy-telemetry-content.yml/runs?status=success&per_page=1' --jq
      '.workflow_runs[0].head_sha' | xargs -I{} git merge-base --is-ancestor "$(git log -1 --format=%H
      --grep='^feat(friction-daily-detector)' origin/main)" {}
    expected: exit 0 once an approved content reader deploy at or after the merge exists; pending until then
    fix_if: never forced; the copy is inert in that reader
    hermetic: false
    graduation: not-applicable
