  - file: tests/checks/ops_governance/test_check_source_registry.py
    action: Modify
    purpose: >-
      The scanned-path expectation includes scripts/feedback_loop/proposals.py; and a test that the guard really sees the
      literal: with _common.ROOT patched to a tmp tree holding the real proposals.py text at its path and a registry
      lacking feedback_loop, check_source_registry fails naming scripts/feedback_loop/proposals.py and feedback_loop (the
      existing producer-module test's shape), and passes once the registry lists it.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - >-
    Lambda gating disposition (Decision 79): compute_affected_artifacts flags eight active artifacts. Seven ducklake ones
    through config/lambda/ducklake/field_semantics.yaml only (no Lambda code changes): ducklake_writer, ducklake_reader,
    ducklake_maintenance, ducklake_maintenance_smoke, ducklake_telemetry_writer, ducklake_telemetry_reader and the content
    reader. deploy-ducklake-lambdas.yml ships the last-green main ref (Decision 249 cl.2, Decision 254 cl.5) to the first
    six in one run (deploy-maintenance, deploy-serving and deploy-telemetry, each smoked by maintenance-smoke, smoke and
    telemetry-smoke), so they carry the new source on the first run whose full tier covering the merge is green and VP 7
    requires all six jobs green in that run. data-pipeline is flagged solely because docs/ROADMAP-PLATFORM.yaml is a
    packaged asset in its manifest: the edit is roadmap bookkeeping; src/data/handlers/scheduled_agent_handler.py reads
    the bundled roadmap at runtime, and a stale copy is harmless because scheduled agents are disabled
    (docs/PROJECT_CONTEXT.md), and PROD_SOURCE_PATHSPECS (scripts/convergence_health/code_drift.py) does not watch docs/, so no build, deploy or smoke
    step is owed (the precedent wording of earlier roadmap-touching plans). The content reader also bundles the file, but its protective
    set (src/lambdas/ducklake_telemetry_content_reader, src/common/ducklake_content_read_verbs.py, src/sensitive_values)
    excludes it, so the merge does not wake its operator-gated channel (Decision 272 cl.1); its copy updates on the next
    deploy-telemetry-content run the operator approves (VP 10, pending), and is inert there (it writes no rec and checks
    no agent_type on read). No Terraform or IAM change: the github-ci-branch role trusts main by ref
    (terraform/personal/oidc_ci_roles.tf), and the monitor already proves it reads the telemetry reader and ops reader.
acceptance_criteria:
  - >-
    Over synthetic rows the detector raises friction_coverage only above the bar with at least 20 process-event facts and
    friction_recurring only for non-generic exception or rework groups that are named failures (an exact-signature rule
    or a repeat run, never a prefix-rule group) at or above 3 sessions and 5 facts, at the current classifier_version only, and its coverage figures equal scripts.telemetry_usage.friction's for the same rows.
  - >-
    Every draft is fileable as written: source registered, acceptance probe decidable and discriminating under the
    portal's lint (the probe exits 0 once the friction stops: for a recurring subject at the same classifier_version,
    for coverage at the same or a newer one), context_v2_json carrying detector_id and subject_key; a subject whose
    newest feedback_loop rec is open, declined or superseded is listed as decided; one whose newest rec is closed or
    failed is proposed again naming it when the window starts after that rec's last update, and is listed as closing
    (decided) while the window still holds friction from before the close.
  - >-
    No public surface carries a session, tree or branch reference or a signature the committed rules do not name: the job
    summary prints only rule-named signatures (any other as "(not published)", never an opaque key), --json and --sheet are refused under GitHub Actions before
    any read, and no draft's title, context, acceptance or context_v2_json carries an unpublished signature or a session,
    root or harness key or branch (filed rec text reaches public artifacts, rec-5487).
  - >-
    feedback-loop.yml runs the command daily on main with the CI branch role, both URLs masked, no writer and no filing;
    no module of the package imports a portal or writer module or names a filing function (an AST test); after deploy
    the workflow's first run succeeds and its log holds one FRICTION counts line.
  - >-
    After deploy, an agent-session run over the last seven days completes (one counts line, exit 0), writes the drafts
    and the review sheet, and every draft passes the portal lint; only public-safe output is recorded on the PR (a
    post-merge comment whose body is only the counts line, the DRAFTS_OK count and at most the --summary output of the
    same run: text the CI path itself publishes, which test_render and test_main hold public-safe; never --json or
    --sheet content).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Detector core, drafts and rendering against synthetic rows.
    command: bin/venv-python -m pytest tests/feedback_loop/test_friction.py tests/feedback_loop/test_proposals.py tests/feedback_loop/test_render.py -q
    expected: exit 0 with every test passing; red before (the package does not exist).
    fix_if: a threshold fires one below its seed, a generic, prefix-rule (r11) or other-version group fires, sums disagree with telemetry_usage.friction, a draft fails the lint, or a planted session id reaches the summary
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: feedback-loop-friction-detector
  - step: 2
    phase: pre-deploy
    action: The CLI contract.
    command: bin/venv-python -m pytest tests/feedback_loop/test_main.py -q
    expected: exit 0 with every test passing; red before (no scripts.feedback_loop).
    fix_if: a private output is written under GITHUB_ACTIONS, --assert-quiet exits 0 without a completed run, for a recurring subject at a classifier_version other than the checkout's, for a coverage subject at a checkout older than its version, refuses a coverage subject at V > N, with zero rows at V, below min_trees or for an unmeasurable coverage subject, the package boundary test finds a portal or writer import, or an error line carries a planted host
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: feedback-loop-friction-cli
  - step: 3
    phase: pre-deploy
    action: The workflow, its taxonomy row and the source registry guard's scan set.
    command: bin/venv-python -m pytest tests/test_feedback_loop_workflow.py tests/checks/ops_governance/test_check_source_registry.py -q
    expected: exit 0 with every test passing; red before (no feedback-loop.yml, no taxonomy row, scan set without the module).
    fix_if: the job names the writer, files, uploads an artifact, misses a mask, or the cron is not 86,400 s
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: feedback-loop-workflow-wiring
  - step: 4
    phase: pre-deploy
    action: T3.3 re-grounded once (a moment claim, Decision 244 cl.4).
    command: >-
      PYTHONPATH=. bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));
      t=next(i for i in d['tier_items'] if i['id']=='T3.3'); f=t['files_in_scope']; c=t['exit_criteria'];
      assert f==['scripts/feedback_loop/', '.github/workflows/feedback-loop.yml'], f;
      assert [(x['id'], x['status']) for x in c]==[('c1','open'),('c2','open')], c;
      assert c[1]['text'].startswith('False-positive rate below a threshold DEFINED at decomposition time');
      assert t['intent'].startswith('Scheduled agent that analyses telemetry tables') and t['status']=='not_started';
      assert c[0]['text'].startswith('Agent runs daily and files anomaly recs via log-rec [Re-grounded 2026-11-21');
      print('T33_REGROUNDED')"
    expected: prints T33_REGROUNDED and exits 0; red before (the Lambda path and bare-string criteria).
    fix_if: T3.3's intent or status changed, c2's text changed, c1 lacks its kept words plus the re-grounded note, or the order moved
    hermetic: true
    expected_literals: [T33_REGROUNDED]
    graduation: waive
    graduation_waiver_reason: >-
      A moment claim about one roadmap item's wording: a later plan may legitimately re-ground T3.3 again (the filer plan
      applies its staged criteria text), so a standing copy would turn red with nothing wrong (Decision 244 cl.4);
      validate_platform_roadmap keeps the shape valid.
  - step: 5
    phase: pre-deploy
    action: Fast tier on the build branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: any check fails, notably the workflow body ratchet, the source registry guard, the taxonomy check or the roadmap schema
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole fast-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push; started from the top-level session, backgrounded with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
  - step: 7
    phase: post-deploy
    action: >-
      The governed deploy shipped the new source to all six ducklake artifacts it serves (last-green ref): one
      deploy-ducklake-lambdas run with deploy-maintenance, maintenance-smoke, deploy-serving, smoke, deploy-telemetry and
      telemetry-smoke all green.
    command: >-
      git fetch -q origin main && build=$(git log -1 --format=%H --grep='^feat(friction-daily-detector)' origin/main) &&
      test -n "$build" && ok= && for id in $(gh api
      'repos/otl-labs/ontheloop/actions/workflows/deploy-ducklake-lambdas.yml/runs?status=success&per_page=100' --jq
      '.workflow_runs[].id'); do jobs=$(gh api "repos/otl-labs/ontheloop/actions/runs/$id/jobs?per_page=100" --jq '.jobs[]
      | select(.conclusion=="success") | .name + " " + (.id|tostring)'); n=0; for want in deploy-maintenance
      maintenance-smoke deploy-serving smoke deploy-telemetry telemetry-smoke; do echo "$jobs" | grep -q "^$want " &&
      n=$((n+1)); done; [ "$n" = 6 ] || continue; job=$(echo "$jobs" | sed -n 's/^deploy-serving //p'); deployed=$(gh api
      "repos/otl-labs/ontheloop/actions/jobs/$job/logs" | grep -oE 'LAMBDA_ARTIFACT_SHA: [0-9a-f]{40}' | head -1 | cut -d'
      ' -f2); echo "run $id deployed $deployed"; if git merge-base --is-ancestor "$build" "$deployed"; then echo contains;
      ok=1; fi; break; done; test -n "$ok"
    expected: >-
      the newest successful run with all six jobs green deployed a LAMBDA_ARTIFACT_SHA (one gate SHA for every job) that
      has the build commit as an ancestor (prints contains); non-zero until that run exists, so it is re-run after the
      deploy that follows the merge (read in a session through mcp__github__actions_list and get_job_logs first, AGENTS.md; the gh command is
      its literal equivalent)
    fix_if: the run is held or failed; read deploy-paths.yaml's code-deploy recovery, never break-glass by default
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      An agent-session run over the last seven days, then the drafts against the portal's lint. Record on the PR, as a
      post-merge comment, only public-safe output: the FRICTION counts line (counts, versions and class words), the
      DRAFTS_OK count and at most the summary_markdown table (rule-named signatures only, any other "(not published)"); the drafts, subject keys and
      the sheet stay in the session (they go to the operator through the project, never GitHub). Seeds are unmeasured: a
      first run listing more than 25 proposed findings is reported to the operator, not tuned in this build.
    command: >-
      out=/tmp/feedback-loop && mkdir -p $out && AWS_PROFILE=agent_platform bin/venv-python -m scripts.feedback_loop friction
      --json $out/friction.json --sheet $out/friction-sheet.md --summary $out/summary.md | tee $out/line.txt && grep -q '^FRICTION window=' $out/line.txt
      && test -s $out/friction-sheet.md && PYTHONPATH=. bin/venv-python -c "import json; from
      scripts.executor.acceptance_lint import lint_acceptance_command as l; from scripts.executor.rec_write_guidance import
      validate_source as v; d=json.load(open('$out/friction.json')); fs=d['findings']; [v(f['draft']['fields']['source']) for
      f in fs]; bad=[f['subject_key'] for f in fs if not l(f['draft']['fields']['acceptance'], require_discrimination=True,
      require_decidable=True)[0]]; assert not bad, bad; print('DRAFTS_OK', len(fs))"
    expected: exit 0, one FRICTION line, a non-empty sheet and DRAFTS_OK with the finding count
    fix_if: the run stops (read the FRICTION_STOP class), a draft fails the lint, or the sheet is empty while rows exist
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      The workflow's first run after the merge (a main dispatch the build may start with actions_run_trigger, or the next
      scheduled tick) succeeded and its log holds one FRICTION line and no URL host.
    command: >-
      run=$(gh api 'repos/otl-labs/ontheloop/actions/workflows/feedback-loop.yml/runs?branch=main&per_page=1' --jq
      '.workflow_runs[0] | select(.conclusion=="success") | .id') && test -n "$run" && job=$(gh api
      "repos/otl-labs/ontheloop/actions/runs/$run/jobs" --jq '.jobs[] | select(.name=="friction") | .id') && gh api
      "repos/otl-labs/ontheloop/actions/jobs/$job/logs" > /tmp/feedback-loop-run.log && test "$(grep -c 'FRICTION window='
      /tmp/feedback-loop-run.log)" = 1 && ! grep -qE 'https://[a-z0-9]+\.(lambda-url|execute-api)\.' /tmp/feedback-loop-run.log
    expected: exit 0 (read in a session through mcp__github__actions_list and get_job_logs first, AGENTS.md; the gh command is its literal equivalent)
    fix_if: the run failed (read its FRICTION_STOP line), the line repeats, or an unmasked URL appears
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      Decision 79's deploy step for the content reader: its bundled field_semantics copy updates on the next
      deploy-telemetry-content run the operator approves; this build never dispatches it. Reported pending until then.
    command: >-
      git fetch -q origin main && build=$(git log -1 --format=%H --grep='^feat(friction-daily-detector)' origin/main) &&
      test -n "$build" && ok= && for id in $(gh api
      'repos/otl-labs/ontheloop/actions/workflows/deploy-telemetry-content.yml/runs?status=success&per_page=100' --jq
      '.workflow_runs[].id'); do job=$(gh api "repos/otl-labs/ontheloop/actions/runs/$id/jobs" --jq '.jobs[] |
      select(.name=="record" and .conclusion=="success") | .id'); [ -n "$job" ] || continue; deployed=$(gh api
      "repos/otl-labs/ontheloop/actions/jobs/$job/logs" | grep -oE 'LAMBDA_ARTIFACT_SHA: [0-9a-f]{40}' | head -1 | cut -d' '
      -f2); echo "run $id deployed $deployed"; if git merge-base --is-ancestor "$build" "$deployed"; then echo contains; ok=1;
      fi; break; done; test -n "$ok"
    expected: >-
      "run <id> deployed <sha>" then contains, exit 0: the newest deploy-telemetry-content run whose record job succeeded
      (a run that skipped build, deploy and record because the protective set was unchanged never counts), and the commit
      it deployed contains the build's squash commit; pending until the operator approves such a run (the predecessor
      plan's VP 8 form; read in a session through mcp__github__actions_list and get_job_logs first, AGENTS.md; the gh command is its literal equivalent)
    fix_if: never forced; no approved run since the merge yet (wait, never dispatch); the copy is inert in that reader
    hermetic: false
    graduation: not-applicable
