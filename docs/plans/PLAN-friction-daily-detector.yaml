constraints:
  - Propose-only. The package never imports scripts.ops_data_portal's write functions and never calls file_rec or update_rec; the workflow names no writer URL.
  - Derived at read, never stored (Decision 199 cl.1); no new table, column or tracked output file.
  - >-
    Public output (Actions log and job summary): counts, version numbers, class words, labels, rule ids and only
    signatures the committed FRICTION_RULES name (Decision 101; the operator's 2026-11-21 choice). Session, root and
    harness keys, branches, row workflows and example trees appear only in --json and --sheet, which are refused under
    GitHub Actions.
  - No LLM in the detector (Decision 205 cl.3; pilot settled s1/s2). No rescue agents or workaround loops (Decision 55).
  - "Seeds are not tuned in this build; a changed threshold is a detector_version bump in a later plan."
  - The build reconciles weakening_dispositions with the candidates the diff actually produces (validate_weakening_dispositions).
