schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: friction-rules-v2
intent: >-
  The feedback loop reads friction totals as its process-layer signal (Decision 221 cl.1), so they must be correct
  before any wave 2-4 work trusts them. Friction classifier version 2 makes three fixes in the telemetry reader's
  session_friction_rollup. First, a skip a repo CLI reports on a STATUS v1 line becomes its own notice-class label
  outside the exception total, and a reported failure gets its own exception label, instead of reading as hook_fault
  and unmapped_block (rec-4605). Second, a tool call whose own error event (a hook block, or a gate, pre-commit or
  status failure it printed) is already a fact is counted once, and the verb reports how many it absorbed (rec-5097 G1,
  operator ruling 2026-11-12: absorb). Third, orphan closes with no name no longer form a repeat run (rec-5097 G2).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-friction-rules-v2.yaml
phase: >-
  T3.3 prerequisite (friction correctness; operator gate list 2026-11-10 names rec-4605 and rec-4959). Closes no exit
  criterion; T3.3 stays not_started. V3: reader Lambda code deployed through the governed code-deploy channel
  (deploy-ducklake-lambdas.yml, Decision 125/126) and proven by the golden replay against the deployed reader.
scope:
  - file: src/common/ducklake_event_read_verbs.py
    action: Modify
    purpose: >-
      FRICTION_RULES: classifier_version 2; each rule row gains a signature_prefix column (rule_id, observation_type,
      signature, signature_prefix, disposition, label, class; a row sets at most one of signature and
      signature_prefix); r01-r04 and r90-r94 keep their ids, labels and classes; two new rows r10 (process_event,
      prefix 'status:', warning, reported_skip, notice) and r11 (process_event, prefix 'status:', error,
      reported_failure, exception). render_data renders the seven-column VALUES list. The session_friction_rollup
      description (verbs.py:103-105) names absorbed_count and the widened absorb.
  - file: src/common/ducklake_event_read_sql.py
    action: Modify
    purpose: >-
      FRICTION_CTES only. Matching: (signature IS NULL OR signature = name) AND (signature_prefix IS NULL OR
      starts_with(name, signature_prefix)), never LIKE; precedence exact signature, then prefix, then generic, then
      rule_id. Absorb: a tool_call close with outcome error or blocked is not a fact when a process_event in f at
      severity error has it as parent (today: blocked only). absorbed: the closes so excluded, counted per session.
      seq0 reads only closes whose name IS NOT NULL. FRICTION_ROLLUP_SQL adds absorbed_count (coalesce 0), emitted right after unmapped_count and before
      classifier_version, the VERB_FIELDS order (test_verb_fields_match_event_verb_output_columns compares in order). No new
      module: the content reader (stub) bundles this file, so its import set must not change (scout 239 note).
  - file: src/common/ducklake_reader_client.py
    action: Modify
    purpose: VERB_FIELDS["session_friction_rollup"] gains absorbed_count after unmapped_count.
  - file: scripts/telemetry_verify/derive.py
    action: Modify
    purpose: >-
      The independent oracle changes in step: _matching_rule ranks exact, prefix, generic; friction_facts absorbs an
      error or blocked close with an error-severity process_event child and counts it; runs skip closes with no name;
      session_friction_rollup emits absorbed_count. friction_facts keeps its 3-tuple return type (test_derive.py:149-150 and the
      scripts/telemetry_verify/__init__.py re-export stay untouched); the absorbed count is computed in a private helper
      that session_friction_rollup calls. The module docstring's 'absorbs its blocked tool_call' sentence (lines 20-26)
      states the widened absorb. It keeps its own Python matching (no SQL import).
  - file: docs/contracts/telemetry_sessions.yaml
    action: Modify
    purpose: >-
      rework_total and exception_total semantics, derivation formulas and two dated amendment_log lines, exactly the
      approved-text sidecar docs/plans/approved/friction-rules-v2.yaml (Decision 246). The phrases
      test_friction_rollups_read_the_rules_file pins stay verbatim. The file sits at the contracts-class cap (500
      effective lines), so the sidecar compacts the two meaning-free 2026-10-16 pointer-move log lines (rework_total,
      state) into the new rework_total line: net +1 -1 -1 +1 = 500, no raise.
  - file: tests/telemetry/fixtures/friction_vectors.yaml
    action: Modify
    purpose: >-
      Header comment names the v18+ additions and the optional absorbed key (asserted only when present; no
      default, because v02 and v10 absorb one blocked close under v2 and stay byte-identical); vectors v18-v27
      appended (execution step 1). v01-v17 stay byte-identical.
  - file: tests/telemetry/fixtures/derived_golden_rollups.yaml
    action: Modify
    purpose: >-
      Hand-derived before the code (execution step 2; AUTHORING RULE): header formula comment and classifier_version
      1 -> 2; every session_friction_rollup row gains absorbed_count; label and total changes only where a ruling moves
      them, all listed in execution step 2. A recorded re-baseline naming rec-4605 and rec-5097 (Decision 211 cl.3).
  - file: tests/common/test_ducklake_event_read_verbs.py
    action: Modify
    purpose: >-
      test_friction_vectors asserts absorbed_count only when the vector carries absorbed, reads classifier_version from
      FRICTION_RULES, and allows the notice class; its docstring stops saying 17. No new test function (481 SLOC at
      planning, NEAR_CAP: measure after the edit; any growth past 500 moves the friction vector test to a new file,
      never a raise).
  - file: tests/common/ducklake_event_reads/test_describe.py
    action: Modify
    purpose: >-
      test_read_version_moves_with_every_datum_sql_and_column overrides classifier_version with
      FRICTION_RULES["classifier_version"] + 1 instead of the literal 2, which v2 ships and which would no longer
      re-version (graduated record telemetry-tree-binding-and-row-cap, Decision 244 cl.1). No other change.
  - file: tests/common/ducklake_event_reads/test_friction_rule_precedence_sql.py
    action: Create
    purpose: >-
      The reader SQL's rule precedence and literal prefix match over synthetic rules (critique round 2 B1; the vectors use
      only the real rules, where no exact rule overlaps the status: prefix). Module-level duckdb importorskip in the
      assignment form. Uses the seam of tests/common/test_ducklake_event_read_verbs.py:290-300 (ev.execute_entry with an
      EventRead over sql.FRICTION_FACTS_SQL, through db.open_memory_catalog so
      test_verb_sql_modules_open_duckdb_only_through_the_seam stays green) fed dict(FRICTION_RULES, rules=<synthetic
      tuples>). It copies the row builder of test_friction_vectors (lines 263-290) into itself, never importing it
      (validate_no_cross_test_imports). Synthetic rule ids sort against precedence (generic a1 < prefix b1 < exact c1),
      so only the precedence term in the ORDER BY, never rule_id order, can pass (critique round 3 B1). Nodes:
      test_exact_rule_beats_prefix_rule (the name status:x.failed matches all three; the exact label wins);
      test_prefix_rule_beats_generic_rule (the name status:y.failed matches only the prefix and generic rules; the prefix
      label wins); test_prefix_is_literal_not_a_like_pattern (prefix gate:validate_ against the name gate:validateXy reads
      the generic label, where a LIKE wildcard would match); test_non_matching_prefix_reads_generic.
  - file: tests/telemetry_verify/test_derive.py
    action: Modify
    purpose: test_oracle_matches_every_friction_vector asserts absorbed_count only when the vector carries absorbed and reads classifier_version from FRICTION_RULES.
  - file: tests/telemetry/test_status_friction_rules.py
    action: Create
    purpose: >-
      rec-4605 acceptance and rule-shape guards over the oracle and FRICTION_RULES (no duckdb):
      test_status_skip_is_not_hook_fault, test_status_failure_has_its_own_label, test_rule_precedence_exact_prefix_generic
      (synthetic rules listed generic, then prefix, then exact, with ids sorting the same way, so a first-match-in-order
      oracle fails; injected with monkeypatch.setattr(derive, "FRICTION_RULES", dict(FRICTION_RULES, rules=...)) since
      _matching_rule reads the module constant; asserts both status:x.failed -> the exact label and status:y.failed -> the
      prefix label; also asserts FRICTION_CTES carries starts_with and no LIKE), test_rules_set_at_most_one_signature_form,
      test_rules_digest_matches_classifier_version (the sha256 of json.dumps(FRICTION_RULES["rules"], sort_keys=True), the
      rule tuples themselves, pinned as a literal mapping {2: '<hex>'} keyed by classifier_version, so a rules edit without
      a version bump fails; the 64-hex literal carries '# pragma: allowlist secret' for detect-secrets).
  - file: tests/telemetry/test_friction_absorb_and_runs.py
    action: Create
    purpose: >-
      rec-5097 acceptance over the oracle (no duckdb): test_friction_gate_under_error_close_counts_once,
      test_status_failure_absorbs_its_error_close, test_null_name_closes_form_no_run,
      test_absorbed_closes_still_form_a_run, test_blocked_absorb_is_counted (v02 and v10 each report absorbed_count 1),
      and test_contract_declares_v2_friction_rules (the sidecar's new phrases).
bundled_recommendations:
  - rec-4605
  - rec-5097
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - A status:<source>.skipped process_event at warning labels reported_skip (class notice) and counts in label_counts but not exception_total; status:<source>.failed at error labels reported_failure (class exception).
  - A gate, pre-commit or status error process_event whose parent is an error or blocked tool_call close yields one fact; absorbed_count counts that close; absorbed error closes still count toward a repeat run.
  - Closes with a NULL name never form a repeated_tool_failure run.
  - Rule precedence is exact signature, then signature prefix, then generic, and prefix matching is literal (no LIKE wildcard).
  - The reader SQL, the derive.py oracle, all 27 vectors and the restated golden rollups agree; v01-v17 parse identically to main (VP 7 compares the parsed YAML).
  - telemetry_sessions.yaml carries exactly the approved sidecar text; the content reader's manifest and import set are unchanged.
  - The deployed telemetry reader serves classifier_version 2 (golden replay skew=0 mismatches=0), and rec-4605 and rec-5097 read closed.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-4605 acceptance - a reported skip is a notice, never hook_fault.
    command: bin/venv-python -m pytest tests/telemetry/test_status_friction_rules.py::test_status_skip_is_not_hook_fault -q
    expected: exit 0; red before (the test file does not exist on main).
    expected_literals:
      - ' passed'
    fix_if: the skip reads hook_fault, counts in exception_total, or the node is missing
    hermetic: true
    graduation: graduate
    graduation_check_id: friction-status-skip-is-notice
  - step: 2
    phase: pre-deploy
    action: rec-5097 G1 acceptance - a gate failure under an error close counts once and is reported as absorbed.
    command: bin/venv-python -m pytest tests/telemetry/test_friction_absorb_and_runs.py::test_friction_gate_under_error_close_counts_once -q
    expected: exit 0; red before (file absent).
    expected_literals:
      - ' passed'
    fix_if: two facts for one failure, or absorbed_count is not 1
    hermetic: true
    graduation: graduate
    graduation_check_id: friction-error-close-absorbed-once
  - step: 3
    phase: pre-deploy
    action: rec-5097 G2 - three orphan error closes in one turn form no repeat run.
    command: bin/venv-python -m pytest tests/telemetry/test_friction_absorb_and_runs.py::test_null_name_closes_form_no_run -q
    expected: exit 0; red before (file absent).
    expected_literals:
      - ' passed'
    fix_if: a repeated_tool_failure fact appears for NULL-name closes
    hermetic: true
    graduation: graduate
    graduation_check_id: friction-orphan-closes-no-run
  - step: 4
    phase: pre-deploy
    action: Rule shape, precedence and the contract text.
    command: >-
      bin/venv-python -m pytest tests/telemetry/test_status_friction_rules.py::test_rule_precedence_exact_prefix_generic
      tests/telemetry/test_status_friction_rules.py::test_rules_set_at_most_one_signature_form
      tests/telemetry/test_friction_absorb_and_runs.py::test_contract_declares_v2_friction_rules
      tests/telemetry/test_contract_lifecycle_friction.py::test_friction_rollups_read_the_rules_file -q
    expected: exit 0, 4 passed; red before (three nodes absent).
    expected_literals:
      - 4 passed
    fix_if: a prefix rule outranks an exact one, a rule sets both signature forms, or a pinned contract phrase moved
    hermetic: true
    graduation: graduate
    graduation_check_id: friction-v2-rules-and-contract
  - step: 5
    phase: pre-deploy
    action: The oracle matches every vector, old and new, and its absorbed counts.
    command: bin/venv-python -m pytest tests/telemetry_verify/test_derive.py tests/telemetry/test_status_friction_rules.py tests/telemetry/test_friction_absorb_and_runs.py -q
    expected: exit 0
    fix_if: any vector, digest pin or absorbed expectation disagrees with derive.py
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of files this plan creates or modifies (hermetic_authoring v); the oracle-vector node is
      already the graduated record telemetry-verify-oracle-matches-committed-cases, and the new nodes graduate in
      steps 1-4.
  - step: 6
    phase: pre-deploy
    action: The reader SQL matches every vector and the restated golden rollups (DuckDB, full-tier environment).
    command: >-
      bin/venv-python -m pytest tests/common/test_ducklake_event_read_verbs.py tests/common/ducklake_event_reads/test_describe.py
      tests/common/ducklake_event_reads/test_friction_rule_precedence_sql.py tests/telemetry/test_derived_layer_reconciliation.py -q
    expected: exit 0 with no skips from a missing duckdb (run where duckdb is installed, as the full tier does)
    fix_if: SQL and oracle disagree on any vector or golden, or the friction read_version does not move
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Needs duckdb, which the fast tier does not install (hermetic_authoring iii); the full tier runs these files on
      every main commit and before handoff.
  - step: 7
    phase: pre-deploy
    action: v01-v17 unchanged and the content reader bundle untouched.
    command: >-
      git fetch origin main --quiet && bin/venv-python -c "import subprocess,yaml;
      old=yaml.safe_load(subprocess.run(['git','show','origin/main:tests/telemetry/fixtures/friction_vectors.yaml'],capture_output=True,text=True,check=True).stdout)['vectors'];
      new=yaml.safe_load(open('tests/telemetry/fixtures/friction_vectors.yaml'))['vectors'];
      assert new[:len(old)]==old and len(new)>=len(old)+10, 'vectors changed'; print('VECTORS_KEPT')"
      && git diff --quiet origin/main -- src/lambdas/ducklake_telemetry_content_reader/ src/lambdas/ducklake_telemetry_reader/manifest.yaml
      && test "$(git diff --name-only origin/main -- 'src/common/ducklake_event_read_*.py' | sort | tr '\n' ' ')" = "src/common/ducklake_event_read_sql.py src/common/ducklake_event_read_verbs.py "
      && for f in src/common/ducklake_event_read_sql.py src/common/ducklake_event_read_verbs.py; do diff <(git show origin/main:$f | grep -E '^(from|import) ') <(grep -E '^(from|import) ' $f) || exit 1; done
      && echo BUNDLE_KEPT
    expected: VECTORS_KEPT then BUNDLE_KEPT
    fix_if: an old vector moved, a manifest changed, a new ducklake_event_read_* module appeared, or either file gained an import
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Depends on this session's diff against origin/main (transient repo state); a moment claim, not a standing guard.
  - step: 8
    phase: pre-deploy
    action: >-
      Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start
      it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-4 carry the durable regressions.
  - step: 9
    phase: post-deploy
    action: >-
      After the merge commit (or a later one) is the newest green main commit and deploy-ducklake-lambdas has shipped
      the telemetry reader (it queues behind any --telemetry-hold, Decision 236/249), replay the goldens against the
      deployed reader.
    command: AWS_PROFILE=agent_platform bin/venv-python -m scripts.ducklake_smoke.lambda_telemetry_golden_gates --no-alarms --assert-zero-mismatches
    expected: a GOLDEN_SMOKE line with skew=0 mismatches=0 and exit 0 (skew=0 means the deployed session_friction_rollup read_version equals this tree's, so classifier_version 2 is live)
    fix_if: skew>0 (deploy not landed or held; wait for the deploy run, never break-glass) or mismatches>0 (root-cause; no inline fix)
    hermetic: false
  - step: 10
    phase: post-deploy
    action: Both bundled recs closed by the squash commit's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows,missing=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-4605','rec-5097']);
      s={r['id']:r['status'] for r in rows}; print(s); assert not missing and set(s.values())=={'closed'}; print('RECS_CLOSED')"
    expected: RECS_CLOSED
    fix_if: a rec reads open after the trailer-closure job; check the job, never close by hand without its evidence
    hermetic: false
test_obligations:
  - source: src/common/ducklake_event_read_verbs.py
    behavior: status rows take reported_skip (notice) and reported_failure (exception) by signature prefix; rules data is version-pinned
    verification_step: 1
    test_selector: tests/telemetry/test_status_friction_rules.py::test_status_skip_is_not_hook_fault
    red_green_expectation: red before (node absent; the skip reads hook_fault), green after
  - source: src/common/ducklake_event_read_sql.py
    behavior: the SQL matches prefixes literally with exact > prefix > generic, absorbs error or blocked closes with an error child, skips NULL-name closes in runs, reports absorbed_count
    verification_step: 6
    test_selector: tests/common/ducklake_event_reads/test_friction_rule_precedence_sql.py::test_prefix_rule_beats_generic_rule
    red_green_expectation: red before (file absent; the v1 SQL has no prefix column), green after; full tier only (duckdb), so no fast-tier red is expected
  - source: src/common/ducklake_reader_client.py
    behavior: the friction verb's declared response fields include absorbed_count
    verification_step: 6
    test_selector: tests/common/test_ducklake_event_read_verbs.py::test_verb_fields_match_event_verb_output_columns
    red_green_expectation: red before (the v2 SQL emits absorbed_count, which VERB_FIELDS lacks), green after; full tier only (duckdb)
  - source: scripts/telemetry_verify/derive.py
    behavior: the oracle mirrors the v2 rules (precedence, absorb, absorbed count, NULL-name runs)
    verification_step: 2
    test_selector: tests/telemetry/test_friction_absorb_and_runs.py::test_friction_gate_under_error_close_counts_once
    red_green_expectation: red before (node absent; v1 oracle yields two facts), green after
  - source: docs/contracts/telemetry_sessions.yaml
    behavior: rework_total and exception_total declare the v2 rules (notice class, prefix precedence, widened absorb, absorbed_count, NULL-name runs) and keep the pinned v1 phrases
    verification_step: 4
    test_selector: tests/telemetry/test_friction_absorb_and_runs.py::test_contract_declares_v2_friction_rules
    red_green_expectation: red before (node absent; the v1 text names none of the v2 rules), green after
constraints:
  - Fix the SQL and the oracle, never v01-v17; new expectations come from the rulings (rec-4605, rec-5097, operator 2026-11-12), written before the code (scout NS.6 note).
  - No LIKE for prefixes; no new src/common module; no content-reader manifest edit (Decision 239 cl.5).
  - Contract text only as the approved sidecar; a wording change after approval needs a new approval run (Decision 246).
  - Deploy only through deploy-ducklake-lambdas.yml; never build_lambda --deploy (Decision 125 cl.3, 249 cl.4).
  - No SLOC budget raise (Decision 128); ducklake_event_read_sql.py stays under 500 (460 at planning); telemetry_sessions.yaml stays at or under 500 effective lines (contracts class), by the sidecar's compaction only; tests/common/test_ducklake_event_read_verbs.py (481) is measured after the edit.
  - No rescue agents or workaround loops (Decision 55).
