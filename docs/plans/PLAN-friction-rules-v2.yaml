  - "--telemetry-hold state read (scripts.checks.ops_governance.validate_reconcile_pending_gate --telemetry-hold) so the deploy wait is expected, not debugged"
execution_steps:
  - >-
    1. Vectors first, from the rulings. Append to tests/telemetry/fixtures/friction_vectors.yaml (rows [id, type, kind,
    name, severity, outcome, parent, t]; optional absorbed, asserted only when present): v18 gate:validate_scope_boundary
    error under an error Bash close -> [[g1, scope_creep]], absorbed 1; v19 precommit:ruff error under an error Bash close
    -> [[p1, unmapped_block]], absorbed 1; v20 status:ops_portal.file_rec.skipped warning under a success close -> [[s1,
    reported_skip]], absorbed 0; v21 status:ops_portal.file_rec.failed error under a success close -> [[s1,
    reported_failure]], absorbed 0; v22 the same failure under an error close -> [[s1, reported_failure]], absorbed 1; v23
    a skip under an error close -> [[s1, reported_skip], [t1, tool_error]], absorbed 0; v24 three NULL-name error closes
    in turn A -> three tool_error, no run, absorbed 0; v25 three Bash error closes in turn A each with a
    gate:validate_scope_boundary error child -> three scope_creep plus [t1, repeated_tool_failure], absorbed 3; v26 a
    hook:never_on_main error under a blocked close -> [[h1, branch_policy_block]], absorbed 1; v27 statuses:x.skipped
    warning -> [[s1, hook_fault]], absorbed 0 (v27 pins the prefix boundary; the literal no-LIKE match is pinned by
    test_prefix_is_literal_not_a_like_pattern). Update the header comment; leave v01-v17 byte-identical (v02 and v10 carry
    no absorbed key; test_blocked_absorb_is_counted pins their 1).
  - >-
    2. Golden rollups by hand, before the code (AUTHORING RULE; Decision 211 cl.3 re-baseline naming rec-4605 and
    rec-5097). Header: the friction FORMULAS comment states the v2 rules and classifier_version 2. Every
    session_friction_rollup row: classifier_version 2 and absorbed_count. Values derived from the parser_version 9 rows
    of each corpus tree: corpus:gate_and_precommit_markers - gate:validate_alpha and gate:validate_beta are children of
    error close F85CC0, precommit:ruff of error close Z9AT2B, so both closes are absorbed: rework 0, exception_total 7 ->
    5, label_counts tool_error 3 -> 1 and unmapped_block 4, unmapped_count 4, absorbed_count 2. corpus:status_markers -
    status:tool_b.skipped and status:tool_e.skipped (warning) -> reported_skip x2 (notice), status:tool_c.failed and
    status:tool_e.failed (error) -> reported_failure x2, tool_c.failed's parent Z9AT2B is the one error close and is
    absorbed: rework 0, exception_total 5 -> 2, label_counts {reported_failure: 2, reported_skip: 2}, unmapped_count 2 ->
    0, absorbed_count 1. corpus:hook_blocked_tool_call - labels and totals unchanged (branch_policy_block, unmapped_block
    for hook:post, hook_fault for hook:Stop; exception_total 3), absorbed_count 1 (the blocked close F85CC0).
    corpus:tool_result_error (tool_error 1) and corpus:close_failed_api_error (tool_blocked 1, no hook child) unchanged,
    absorbed_count 0. Re-check each against the tree's rows at build; a disagreement is a plan defect, not a re-derivation.
  - 3. Write the three new test files and the test edits (scope rows); run them and confirm red on the v1 code.
  - 4. FRICTION_RULES v2 and render_data in src/common/ducklake_event_read_verbs.py.
  - 5. FRICTION_CTES and FRICTION_ROLLUP_SQL in src/common/ducklake_event_read_sql.py (and its comments, namely the "17 committed friction vectors" line and the FRICTION_CTES header at lines 264-266, which then states exact > prefix > generic and the widened absorb); VERB_FIELDS in ducklake_reader_client.py.
  - 6. derive.py oracle in step (friction_facts' return type kept; module docstring's absorb sentence updated).
  - 7. Apply the sidecar text to docs/contracts/telemetry_sessions.yaml with {{DATE}} set to the build date.
  - "8. Execute Verification Plan steps 1-7; loop until pass. On an unrecoverable failure stop and RCA (Decision 55)."
  - >-
    9. Commit Flow (implement skill and git-ops.yaml handoff_sequence and resolves_trailer, in this order; report each
    outcome separately). Readiness: bin/venv-python -m scripts.session.github_readiness (unknown is unproven, never
    PASS), copy code review's weakening_dispositions entries for every changed existing assertion into this plan, set
    implementation_declared: true, VP steps 1-7 pass and validate --pre is green. Commit: the implementation commit's
    message carries a Key: value block with Resolves: rec-4605, rec-5097 above the footer. Rebase: git fetch origin main
    and rebase onto origin/main (scripts.session.rebase_resolve RESOLVE CLEAN); if the rebase moved any sidecar
    before-text, stop (context: re-approval risk). Validator evidence: VP step 8's full tier and validation_result
    --verify-head PASS on that rebased, clean HEAD (any later rebase or fix commit needs a fresh run; a timeout is
    BLOCKED, handoff_policy). Postflight evidence: /tmp/implementation-retrospective.json with the ten
    postflight_evidence.CATEGORIES keys, then bin/venv-python -m scripts.session.postflight --evidence
    /tmp/implementation-retrospective.json passes. Push result: git push -u origin HEAD as its own call. PR result: the PR
    open (number returned), its body repeating the Resolves block, the VP compliance table and the golden re-baseline
    list (step 2); subscribe to its activity. Merge result (standing_authorisation: code review PROCEED, green CI and
    validate_merge_step green; no always_ask content beyond the sidecar-bound text): merge_step premerge --slug
    friction-rules-v2 --message-file <the commit body> --expect <the approved= value approved_text record prints,
    89111713... at plan time>, merge_pull_request squash with that commit_message and expectedHeadSha, then merge_step
    readback --sha <merge sha>.
  - 10. Post-deploy steps 9-10 once deploy-ducklake-lambdas has shipped the telemetry reader for the newest green main commit (after any --telemetry-hold clears).
  - 'Report: what was implemented, verification results, the merge SHA, the deploy run id and the golden replay line.'
rollback: >-
  Nothing is stored: revert the merge commit and let deploy-ducklake-lambdas ship the reverted reader; every total
  re-derives at read under classifier_version 1.
