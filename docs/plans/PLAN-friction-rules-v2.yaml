  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - docs/plans/approved/friction-rules-v2.yaml read; its approval run approved
  - rec-5097 acceptance read back (fetch_recs_by_ids) equals the test_friction_absorb_and_runs.py node; if not, re-run the update_rec in the plan context before building
