    graduation_check_id: friction-signature-registration-and-cli
  - step: 4
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push; started from the top-level session, backgrounded with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
  - step: 5
    phase: post-deploy
    action: The governed deploy shipped the telemetry reader with the merge (last-green ref, Decision 254 cl.5).
    command: >-
      git fetch -q origin main && build=$(git log -1 --format=%H --grep='^feat(friction-signature-coverage)' origin/main) &&
      test -n "$build" && ok= && for id in $(gh api
      'repos/otl-labs/ontheloop/actions/workflows/deploy-ducklake-lambdas.yml/runs?status=success&per_page=100' --jq
      '.workflow_runs[].id'); do jobs=$(gh api "repos/otl-labs/ontheloop/actions/runs/$id/jobs" --jq '.jobs[] |
      select((.name=="deploy-telemetry" or .name=="telemetry-smoke") and .conclusion=="success") | .name + " " +
      (.id|tostring)'); echo "$jobs" | grep -q '^telemetry-smoke ' || continue; job=$(echo "$jobs" | sed -n
      's/^deploy-telemetry //p'); deployed=$(gh api "repos/otl-labs/ontheloop/actions/jobs/$job/logs" | grep -oE
      'LAMBDA_ARTIFACT_SHA: [0-9a-f]{40}' | head -1 | cut -d' ' -f2); echo "run $id deployed $deployed"; if git merge-base
      --is-ancestor "$build" "$deployed"; then echo contains; ok=1; fi; break; done; test -n "$ok"
    expected: >-
      the newest successful run with a green telemetry-smoke job deployed a LAMBDA_ARTIFACT_SHA that has the build commit as
      an ancestor (prints contains); the command exits non-zero until that run exists, so it is re-run once the deploy run
      after the merge completes, and a non-zero exit before then is not a failure (the same read through
      mcp__github__actions_list and get_job_logs where gh is unavailable)
    fix_if: >-
      the run is held or failed: read deploy-paths.yaml's code-deploy recovery, never break-glass by default; a
      telemetry-smoke timeout or 504 on friction_signature_counts holds telemetry deploys, so stop and RCA (Decision 55) and
      fix forward through a plan, never by dropping the verb from the smoke list
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: The deployed reader describes the verb as an agent-facing window verb.
    command: >-
      PYTHONPATH=. bin/venv-python -c "from scripts.telemetry_capture.read_route import TelemetryReader as R;
      from scripts.aws_profile import resolve_aws_profile as p; d=R(profile=p('agent_platform')).describe();
      v=d.get('friction_signature_counts') or {}; print('DESCRIBED', v.get('binding'), v.get('agent_facing'), v.get('max_window_days'), v.get('table'));
      assert v.get('binding')=='window' and v.get('agent_facing') is True and v.get('max_window_days')==7"
    expected: DESCRIBED window True 7 telemetry_observations
    fix_if: the verb is absent; the deploy did not ship the merge
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      Live coverage: over the last full 7 UTC days after the deploy, the classifier_version 3 share against the same rows
      relabelled under the classifier_version 2 rules (AC4's definition and v2 relabel).
    command: >-
      s=$(date +%s) && bin/venv-python -m scripts.telemetry_usage friction --from "$(date -u -d '7 days ago' +%F)" --to "$(date -u -d yesterday +%F)" > /tmp/friction-v3.json &&
      echo "ELAPSED_S $(( $(date +%s) - s ))" &&
      bin/venv-python -c "import json; e=json.load(open('/tmp/friction-v3.json'))['by_classifier_version']['3'];
      spec={('hook:never_on_main','error'),('hook:fresh_branch_base','error'),('hook:edit_scope_guard','error'),('gate:validate_scope_boundary','error')};
      pe=[x for x in e['signatures'] if x['observation_type']=='process_event']; t=sum(x['fact_count'] for x in pe);
      g2=sum(x['fact_count'] for x in pe if (x['signature'],x['disposition']) not in spec and not
      ((x['signature'] or '').startswith('status:') and x['disposition'] in ('warning','error')));
      print('FACTS', t, 'V3_SHARE', e['unmapped_failure_share'], 'V2_SHARE', round(g2/t, 4) if t else None);
      assert t and e['unmapped_failure_share'] < g2/t"
    expected: >-
      Run after the deploy; exit 0, an ELAPSED_S line (one-time latency evidence for the new verb on the reader), and one
      line FACTS n V3_SHARE a V2_SHARE b with a below b,
      recorded in the report with the top generic signatures. Cloud-labelled hook records stay generic until rec-5384's
      hook markers ship; the comparison holds either way because both shares read the same rows.
    fix_if: >-
      the two shares are equal, which only happens when no listed signature fired in the window (v3 only adds rules):
      record it with the ranked signatures and re-run over the next full window; never edit rules post-merge outside a plan
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      Decision 79 for the content reader: its next deploy-telemetry-content run that the operator approves (Decision 272
      cl.1; this build never dispatches one) is on a commit that contains this build. Waits on the operator; the build
      reports it pending with this step named, and the coordinator keeps it on the waiting list.
    command: >-
      git fetch -q origin main && build=$(git log -1 --format=%H --grep='^feat(friction-signature-coverage)' origin/main) &&
      test -n "$build" && ok= && for id in $(gh api
      'repos/otl-labs/ontheloop/actions/workflows/deploy-telemetry-content.yml/runs?status=success&per_page=100' --jq
      '.workflow_runs[].id'); do job=$(gh api "repos/otl-labs/ontheloop/actions/runs/$id/jobs" --jq '.jobs[] |
      select(.name=="record" and .conclusion=="success") | .id'); [ -n "$job" ] || continue; deployed=$(gh api
      "repos/otl-labs/ontheloop/actions/jobs/$job/logs" | grep -oE 'LAMBDA_ARTIFACT_SHA: [0-9a-f]{40}' | head -1 | cut -d' '
      -f2); echo "run $id deployed $deployed"; if git merge-base --is-ancestor "$build" "$deployed"; then echo contains; ok=1;
      fi; break; done; test -n "$ok"
    expected: >-
      "run <id> deployed <sha>" then contains, exit 0: the newest deploy-telemetry-content run whose record job succeeded,
      and the commit it deployed contains the build's squash commit (the one whose subject starts
      feat(friction-signature-coverage)). The report names the run id (the same read through mcp__github__actions_list and
      get_job_logs where gh is unavailable).
    fix_if: no approved run since the merge yet (wait, never dispatch), or the run failed (the content channel's own recovery)
    hermetic: false
    graduation: not-applicable
