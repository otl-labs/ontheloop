    run whose batch full tier covering it is green, paused while main is red (Decision 249 cl.3); covered by VP 5-7) and the content reader (it bundles
    the same two modules, serves no event verb and its protective set excludes them, so a merge does not wake its
    operator-gated channel (Decision 272 cl.1); Decision 79's deploy step for it is VP 8, read on the next deploy-telemetry-content
    run the operator approves, which this build never dispatches, as PLAN-telemetry-planning-cost-reads' VP 8; the change is
    inert there because the new verb is outside CONTENT_READS); data-pipeline only through ducklake_reader_client.py and event_usage_fields.py:
    no data-pipeline handler reads VERB_FIELDS, and PROD_SOURCE_PATHSPECS (scripts/convergence_health/code_drift.py) watches
    neither file. No Terraform or IAM change.
acceptance_criteria:
  - friction_signature_counts is a registered agent-facing 7-day window verb whose rows match the independent oracle on every golden tree.
  - Every friction vector passes at classifier_version 3, including the new gate, pre-commit and hook vectors, with every existing vector's labels unchanged.
  - >-
    The rules guard reports a violation for each synthetic rule set carrying an unregistered hook, gate or pre-commit
    signature, an exact signature on an unregistered source (or any signature on a tool_call rule), an undeclared prefix, a
    prefix on a registered source (hook:, gate:, precommit:), a tie, a label with two
    classes or a fact kind (observation_type and disposition) with no generic fallback, and no shape violation for the real FRICTION_RULES. That every
    exact signature in the real rules is registered is checked once at build (VP 9), not held as a standing assertion.
  - >-
    After deploy, over one live 7-day window, the CLI's classifier_version 3 unmapped_failure_share is lower than the share
    of the same rows relabelled under the classifier_version 2 rules (VP 7). Definition, pre-registered: generic-rule
    process_event facts over all process_event facts. The fact population is identical under both versions (every new rule
    matches disposition error, as the generic r90 already does, and the absorb and repeat-run rules are unchanged), so only
    the labels differ; under the v2 rules a process_event fact is specific exactly when it is (hook:never_on_main,
    error), (hook:fresh_branch_base, error), (hook:edit_scope_guard, error), (gate:validate_scope_boundary, error) or a
    status: signature at warning or error. Expected, recorded and not gated: on the sample the rules were chosen from the
    share falls from 0.94 to 0.48 (the 48 left are the cloud hook records: the 44 blocks rec-5384's markers will name, and 4
    warnings that stay r91 hook_fault, since r06-r09 match error only); a later window
    also carries checks outside the list, so its share is expected somewhat higher than 0.48.
  - >-
    session_friction_rollup at classifier_version 3 counts in unmapped_count every process_event fact a generic rule
    labelled (r90, r91 hook_fault and r94), and the golden re-baseline changes only the listed rows: every
    session_friction_rollup row that carries a classifier_version stamp moves 2 -> 3, and corpus:hook_blocked_tool_call's
    unmapped_count moves 1 -> 2.
