      'FRICTION_ROLLUP_SQL') if n in vars(v)]; print('LEFT', left, 'MOVED', moved); assert not left and len(moved) == 3"
    expected: LEFT [] MOVED ['FRICTION_CTES', 'FRICTION_FACTS_SQL', 'FRICTION_ROLLUP_SQL'] and exit 0; red before (all three are still in the sql module).
