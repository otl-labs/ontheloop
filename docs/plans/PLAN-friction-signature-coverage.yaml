    command: >-
      git fetch -q origin main && PYTHONPATH=. bin/venv-python -c "import subprocess, yaml; show=lambda p:
      yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:' + p], capture_output=True, text=True, check=True).stdout);
      load=lambda p: yaml.safe_load(open(p)); v='tests/telemetry/fixtures/friction_vectors.yaml'; old={x['id']: x for x in
      show(v)['vectors']}; new={x['id']: x for x in load(v)['vectors']}; changed=[k for k in old if new.get(k) != old[k]];
      g='tests/telemetry/fixtures/derived_golden_rollups.yaml'; fix=lambda t, r: {**r, **({'classifier_version': 3} if
      r.get('classifier_version') == 2 else {}), **({'unmapped_count': 2} if t == 'corpus:hook_blocked_tool_call' else
      {})}; rows=lambda trees, bump: {(t['tree'], e['verb'], e.get('session'), repr(e.get('params')), repr([fix(t['tree'],
      r) if bump and e['verb'] == 'session_friction_rollup' else r for r in e['rows']])) for t in trees for e in
      t['expect']}; diff=rows(show(g)['trees'], True) ^ rows(load(g)['trees'], False); print('CHANGED_VECTORS', changed,
      'GOLDEN_DIFF', len(diff)); assert not changed and not diff, sorted(diff)[:2]"
    expected: CHANGED_VECTORS [] GOLDEN_DIFF 0 and exit 0; red before (origin/main's rows still carry classifier_version 2).
    fix_if: an existing vector or an unlisted golden row changed; restore it, since vectors are normative (fix the SQL)
