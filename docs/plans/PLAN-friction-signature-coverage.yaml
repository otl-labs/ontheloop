schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: friction-signature-coverage
intent: >-
  Make the friction classifier's coverage measurable and raise it before any review or rec filing builds on it (feedback-loop
  wave 2, first plan). A new agent-facing window verb, friction_signature_counts, returns per tree one row per friction
  signature (observation type, name, disposition, the rule that labelled it, label, class and whether that rule is generic)
  with fact and session counts, so the unmapped share per classifier_version and the signatures behind it are readable;
  friction classifier_version 3 adds prefix rules for repo-check and pre-commit failures and exact rules for the blocking
  hooks that have none, and its unmapped_count counts every process-event fact a generic rule labelled; a rules-file guard
  holds the rules to registered signatures with no ties. The telemetry_usage CLI gains a friction command that sums the
  rows and prints the unmapped share per classifier_version.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-friction-signature-coverage.yaml
phase: >-
  Feedback-loop wave 2 (operator-directed 2026-11-18): the friction detector the loop's daily analysis (T3.3) reads, the
  CD.45 pilot item pwi-friction-classifier criteria c1-c2. T3.20 is named only as that pilot item's part_of parent, as
  context: its one open criterion, c9, is CI capture, which this plan neither touches nor closes. T3.3's criteria wait on
  the daily detector and the filer, so closes_criteria is empty. T3.3's stale files_in_scope (a telemetry_analysis_agent Lambda) is re-grounded by the daily detector plan, the
  first plan that realizes T3.3's detector shape.
closes_criteria: []
cites: [dec:79, dec:84, dec:128, dec:199, dec:211, dec:235, dec:236, dec:244, dec:246, dec:249, dec:254, dec:272]
scope:
  - file: src/common/ducklake_event_read_verbs.py
    action: Modify
    purpose: >-
      FRICTION_RULES becomes classifier_version 3. New rules, each (rule_id, observation_type, signature, signature_prefix,
      disposition, label, class): r05 hook:scheduled_agent_log_only error scheduled_agent_write_block exception; r06
      hook:handoff_evidence_gate error handoff_evidence_block exception; r07 hook:merge_gate error merge_gate_block
      exception; r08 hook:rec_writer_tripwire error rec_write_block exception; r09 hook:protected_action_gate error
      protected_action_block exception; one exact rule per repo check seen failing in the 2026-11-18 sample (40 roots,
      11-17 Nov), each error check_failure exception: r20 gate:validate_plan_documents; r21 gate:precommit_changed; r22 gate:pytest_diff; r23 gate:validate_plan_scope_closure; r24 gate:validate_weakening_dispositions; r25 gate:validate_merge_step; r26 gate:lint; r27 gate:validate_contract_drift; r28 gate:validate_sloc_limits; r29 gate:validate_decisions_index_freshness; r30 gate:validate_glossary; r31 gate:validate_tier_demotion_markers; r32 gate:validate_graduation_completeness; r33 gate:validate_fallback_reevaluation; r34 gate:validate_project_region; r35 gate:validate_pre_glob_closure; r36 gate:validate_cc_limits; r37 gate:validate_prose_budget_raises; r38 gate:validate_handoff_full_tier; r39 gate:validate_graduated_rerun_plan_readers; and r50 precommit:detect-secrets error precommit_failure
      exception. No prefix rule is added: pilot c2 counts only a rule naming one exact registered signature as specific, so
      a check or pre-commit hook outside this list stays a generic unmapped_block and shows in the share (operator
      decision pending on the card; prefix catch-alls are the alternative). Existing rules unchanged
      (gate:validate_scope_boundary stays r04 scope_creep). EVENT_READS gains friction_signature_counts: tables
      (OBSERVATIONS, SESSIONS), observations first as validate_read_engine_verbs groups by tables[0], params (day_from, day_to), binding window, max_window_days MAX_WINDOW_DAYS, agent-facing,
      data FRICTION_RULES, sql FRICTION_SIGNATURE_SQL composed in this module (see the sql row), a description naming the
      grain and that it returns derived rows only. session_friction_rollup's description says unmapped_count counts the
      process-event facts a generic rule labelled. FRICTION_SIGNATURE_SQL is composed here, not in a new module, so neither
      reader manifest changes (the content reader's manifest directory is in its operator-gated protective set, Decision
      272); the sql module's headroom is spent by unbuilt plans first.
  - file: src/common/ducklake_event_read_sql.py
    action: Modify
    purpose: >-
      FRICTION_CTES' labelled CTE also carries rule_id and generic (r.signature IS NULL AND r.signature_prefix IS NULL) and
      the fact's observation_type, name and disposition; the friction CTE carries them through (the repeat-run arm carries
      rule_id 'run', generic false, observation_type tool_call, the tool name and disposition error). FRICTION_ROLLUP_SQL's
      unmapped_count becomes count(*) FILTER (WHERE observation_type = 'process_event' AND generic). No other text changes;
      the verbs module reads the window pieces (_USAGE_TREE, _TREE_COLS, _TREE_STAMPS, _TREE_USING) through the sql module
      namespace, as it already reads sql.* names. Net change a few SLOC against 17 of headroom (483 of 500 on main 16474b86, NEAR_CAP), which
      unbuilt plans spend first: the build measures headroom at build time and, if the change would cross 500, moves the
      friction block (FRICTION_CTES, FRICTION_FACTS_SQL, FRICTION_ROLLUP_SQL) into the verbs module instead, never a raise,
      and repoints its three importers (the two conditional test rows below and tests/telemetry/test_status_friction_rules.py);
      the sql module cannot re-export them, since the verbs module imports it.
  - file: src/common/event_usage_fields.py
    action: Modify
    purpose: >-
      FRICTION_SIGNATURE_FIELDS, the new verb's derived columns in SQL order: root_session_id, harness_session_key, branch,
      session_started_at, roots_in_tree, workflow, observation_type, signature, disposition, rule_id, label, class, generic,
      fact_count, session_count, classifier_version (stamps appended by VERB_FIELDS).
    new_imports: []
  - file: src/common/ducklake_reader_client.py
    action: Modify
    purpose: VERB_FIELDS gains friction_signature_counts = (*FRICTION_SIGNATURE_FIELDS, *_STAMP_FIELDS).
    new_imports: []
  - file: scripts/telemetry_verify/derive.py
    action: Modify
    purpose: >-
      A sibling labelled_facts(rows) returns each fact as (ref, label, class, rule_id, generic, observation_type, name,
      disposition); friction_facts keeps its 3-tuple (ref, label, class) contract as a projection of it, so its callers
      (tests/telemetry/test_friction_absorb_and_runs.py, tests/telemetry/test_status_friction_rules.py, test_derive.py) are
      untouched. session_friction_rollup's unmapped_count counts generic process-event facts through labelled_facts
      (matching the SQL); the module docstring's unmapped_count line follows. The oracle never imports SQL text from the
      verbs module.
  - file: scripts/telemetry_verify/derive_usage.py
    action: Modify
    purpose: >-
      Independent oracle friction_signature_counts(tables, projects, day_from, day_to) over the usage trees: the same rows
      from raw rows through derive.labelled_facts, grouped per tree and workflow.
  - file: scripts/telemetry_usage.py
    action: Modify
    purpose: >-
      A friction command over the existing windows: sums friction_signature_counts rows across trees and windows and prints
      one JSON object {window, conflicted_rows, by_classifier_version: {"<n>": {...}}} (conflicted_rows counts rows whose
      derivation_conflicted is true, reported and never resolved, Decision 207) with, per classifier_version, process_event_facts,
      generic_process_event_facts, unmapped_failure_share (generic over all process-event facts;
      null when there are none, never 0), tool_call_facts, and every signature (no truncation) ranked by fact_count, each
      with observation_type, signature, disposition, rule_id, label, generic, fact_count and session_count. --workflow NAME
      keeps rows whose workflow equals NAME; --workflow none keeps rows whose workflow is null (interactive sessions).
  - file: scripts/ducklake_smoke/lambda_telemetry_reader_gates.py
    action: Modify
    purpose: _USAGE_VERBS gains friction_signature_counts, so the reader smoke reads it and checks its rows carry exactly VERB_FIELDS.
  - file: docs/contracts/ducklake_telemetry_reader.yaml
    action: Modify
    purpose: >-
      Sidecar-bound words (docs/plans/approved/friction-signature-coverage.yaml): a friction-signature invariant after the
      usage-verbs invariant naming friction_signature_counts, its window, grain, columns and that it returns no content and
      no cross-tree sum; one amendment_log line whose migration_story says the same merge moves session_friction_rollup to
      classifier_version 3.
  - file: docs/contracts/read-engine.yaml
    action: Modify
    purpose: >-
      Registration, not sidecar-bound (a roster mirror validate_read_engine_verbs holds equal to the registry):
      friction_signature_counts joins read_surface.named_verbs under telemetry_observations, with a new amendment_log entry
      (field_add, semantic_break false) naming this plan.
  - file: docs/plans/approved/friction-signature-coverage.yaml
    action: Create
    purpose: Approved-text sidecar (Decision 246) for the two ducklake_telemetry_reader.yaml blocks.
  - file: tests/telemetry/fixtures/friction_vectors.yaml
    action: Modify
    purpose: >-
      New vectors v28-v36: gate:validate_plan_documents error takes check_failure; precommit:detect-secrets error takes
      precommit_failure; a gate signature outside the list (gate:validate_not_listed) stays unmapped_block; a gate: warning
      stays the generic hook_fault; one per new hook rule (five); an optional unmapped key asserts unmapped_count (generic
      process-event facts, r91 included). Every existing vector keeps its expected labels byte-identical (v19's
      precommit:ruff is not in the list, so it stays unmapped_block). The header comment names v28-v36.
      tests/common/test_ducklake_event_read_verbs.py (483 of 500 SLOC) is not edited: its parametrized test_friction_vectors
      runs the new vectors as they are added.
  - file: tests/telemetry/test_friction_rules.py
    action: Create
    purpose: >-
      The pilot c2 guard, fast tier (no duckdb), at the path pilot c2's method command names (pytest
      tests/telemetry/test_friction_rules.py -k guard). One helper, rule_violations(rules, registries), returns each
      violation as (kind, rule_id). Registries: hook stems of .claude/hooks/hooks.json commands; gate names are the step
      names of scripts.checks.registry.pre_sequence() and full_sequence() (check and scaffold steps, so pytest_diff, lint
      and precommit_changed count; no check module is imported, Decision 208's fast-tier budget); pre-commit hook ids from .pre-commit-config.yaml; prefixes, each of which must equal source + ':'
      for a source in the newest config/telemetry/parser_versions.yaml version's signature_prefixes. A signature_prefix is a
      literal prefix, never a LIKE wildcard (PLAN-friction-rules-v2's reading of pilot c2's no-wildcard rule). Tests:
      test_guard_real_rules_pass (FRICTION_RULES has no violation); negative cases over synthetic rule tuples, one per kind:
      test_guard_rejects_unregistered_hook_signature, test_guard_rejects_unregistered_gate_signature,
      test_guard_rejects_unregistered_precommit_signature, test_guard_rejects_undeclared_prefix, test_guard_rejects_tie
      (two rules with the same observation_type, signature form and disposition), test_guard_rejects_label_with_two_classes,
      test_guard_rejects_missing_generic_fallback (a fact class with no generic rule).
  - file: tests/common/test_ducklake_event_read_friction_signatures.py
    action: Create
    purpose: >-
      Full tier (importorskip duckdb), over the golden chain: test_verb_matches_oracle_on_every_golden_tree;
      test_generic_flag_marks_only_rules_without_signature_or_prefix; test_repeat_run_row_carries_rule_run;
      test_unmapped_count_counts_generic_process_event_facts (every vector carrying the unmapped key, through the
      session verb, stamped FRICTION_RULES["classifier_version"], never a literal);
      test_absorbed_close_is_not_a_row; test_window_reads_real_purpose_projects_only; test_two_trees_in_one_window_label_independently
      (two golden trees loaded into one catalog and one window give each tree the rows it gives alone).
  - file: tests/telemetry/test_friction_status_known_gap_contract_note.py
    action: Modify
    purpose: >-
      Growth-safe pin (implement-scope-boundary.yaml review_dispositions; tests/CLAUDE.md test-count coupling): the
      assertion int(version) == FRICTION_RULES["classifier_version"] becomes int(version) == 2 and
      FRICTION_RULES["classifier_version"] >= 2. The contract sentence it reads ("From classifier_version 2 (rec-4605) the
      reader's friction rules label a status warning ...") states the version the status rules arrived in, a fixed
      historical fact, so pinning it to the current version made every classifier bump force a false or contorted contract
      edit (a newest-entry claim, Decision 244 cl.4; the record's claim is unchanged, cl.5, so this is outside Decision 235
      cl.1's weakening class). The label and class checks against the current r10 and r11, the retired phrases and the amendment_log entry
      are unchanged; docs/contracts/telemetry_observations.yaml is not edited (its 498-line guard in
      tests/telemetry/test_retire_session_cli_contract_notes.py has no room for an amendment entry).
  - file: tests/telemetry/test_status_friction_rules.py
    action: Modify
    purpose: >-
      _RULES_DIGESTS gains 3: the sha256 of the classifier_version 3 rule tuples (additive; the 2 entry stays), so
      test_rules_digest_matches_classifier_version passes at version 3. The import of the friction block moves too only if
      the sql row's relief branch fires.
  - file: tests/common/test_ducklake_event_read_verbs.py
    action: Modify
    purpose: >-
      Conditional: only if the sql row's relief branch fires, its import of the friction block (line ~295) points at the
      verbs module (an import-line change; the file is NEAR_CAP at 483 of 500 SLOC). Otherwise untouched.
  - file: tests/common/ducklake_event_reads/test_friction_rule_precedence_sql.py
    action: Modify
    purpose: Conditional, as the row above (its import at line ~50). Otherwise untouched.
  - file: tests/telemetry_verify/test_derive.py
    action: Modify
    purpose: The oracle's unmapped_count counts generic process-event facts (a vector with r91 hook_fault), matching the verb.
  - file: tests/telemetry/fixtures/derived_golden_rollups.yaml
    action: Modify
    purpose: >-
      Re-baseline to classifier_version 3 (Decision 211 cl.3; the work item is this plan): every session_friction_rollup
      row's classifier_version stamp moves 2 -> 3; the header's friction formula comment states the v3 rules and the new
      unmapped_count; rows whose labels or unmapped_count the new rules change are re-derived (corpus:hook_blocked_tool_call's
      unmapped_count 1 -> 2, since its hook:Stop warning hook_fault now counts; corpus:gate_and_precommit_markers' synthetic
      gate:validate_alpha, gate:validate_beta and precommit:ruff are not in the list and keep unmapped_block). No friction_signature_counts window case is added here: the golden reconcile's run_oracle
      (tests/fixtures/telemetry_golden_chain.py) dispatches only derive's per-session verbs, and the verb-vs-oracle check
      lives in test_verb_matches_oracle_on_every_golden_tree, as for the three usage verbs. Every changed row is listed in the PR body with its
      before and after; no other row changes.
  - file: tests/test_event_usage_fields.py
    action: Modify
    purpose: _BY_VERB gains friction_signature_counts.
  - file: tests/ducklake_neon_smoke_test/test_lambda_telemetry_reader_gates.py
    action: Modify
    purpose: test_reader_gate_reads_the_usage_verbs covers friction_signature_counts.
  - file: tests/test_telemetry_usage.py
    action: Modify
    purpose: >-
      With a fake reader: test_friction_sums_signatures_across_trees_and_windows; test_friction_share_is_null_without_process_events;
      test_friction_share_is_per_classifier_version; test_friction_workflow_filter (NAME and none);
      test_friction_lists_every_signature_with_disposition;
      test_friction_verb_is_registered_agent_facing_window_verb;
      test_reader_contract_declares_the_friction_signature_verb (the contract's invariant starting "Friction signature verb"
      names friction_signature_counts, and the amendment_log entry naming PLAN-friction-signature-coverage is field_add,
      semantic_break false, and names the verb; found by plan name, never as the latest entry, so a later entry keeps it green).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - >-
    Lambda gating disposition (Decision 79): compute_affected_artifacts flags ducklake_telemetry_reader (the SQL and verbs
    modules; deploy-ducklake-lambdas.yml deploys the last-green main ref (Decision 254 cl.5), so the merge ships on the first
    run whose batch full tier covering it is green, paused while main is red (Decision 249 cl.3); covered by VP 5-7) and the content reader (it bundles
    the same two modules, serves no event verb and its protective set excludes them, so a merge does not wake its
    operator-gated channel (Decision 272 cl.1); Decision 79's deploy step for it is VP 8, read on the next deploy-telemetry-content
    run the operator approves, which this build never dispatches, as PLAN-telemetry-planning-cost-reads' VP 8; the change is
    inert there because the new verb is outside CONTENT_READS); data-pipeline only through ducklake_reader_client.py and event_usage_fields.py:
    no data-pipeline handler reads VERB_FIELDS, and PROD_SOURCE_PATHSPECS (scripts/convergence_health/code_drift.py) watches
    neither file. No Terraform or IAM change.
acceptance_criteria:
  - friction_signature_counts is a registered agent-facing 7-day window verb whose rows match the independent oracle on every golden tree.
  - Every friction vector passes at classifier_version 3, including the new gate, pre-commit and hook vectors, with every existing vector's labels unchanged.
  - >-
    The rules guard reports a violation for each synthetic rule set carrying an unregistered hook, gate or pre-commit
    signature, an undeclared prefix, a tie, a label with two classes or a fact class with no generic fallback, and none for
    the real FRICTION_RULES.
  - >-
    After deploy, over one live 7-day window, the CLI's classifier_version 3 unmapped_failure_share is lower than the share
    of the same rows relabelled under the classifier_version 2 rules (VP 7). Definition, pre-registered: generic-rule
    process_event facts over all process_event facts. The fact population is identical under both versions (every new rule
    matches disposition error, as the generic r90 already does, and the absorb and repeat-run rules are unchanged), so only
    the labels differ; under the v2 rules a process_event fact is specific exactly when it is (hook:never_on_main,
    error), (hook:fresh_branch_base, error), (hook:edit_scope_guard, error), (gate:validate_scope_boundary, error) or a
    status: signature at warning or error. Expected, recorded and not gated: on the sample the rules were chosen from the
    share falls from 0.94 to 0.48 (the 48 left are the cloud hook records rec-5384's markers will name); a later window
    also carries checks outside the list, so its share is expected somewhat higher than 0.48.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The rules guard, the friction vectors and the rule-shape tests at classifier_version 3.
    command: >-
      bin/venv-python -m pytest tests/telemetry/test_friction_rules.py
      tests/common/test_ducklake_event_read_verbs.py::test_friction_vectors tests/telemetry_verify/test_derive.py
      tests/telemetry/test_status_friction_rules.py tests/telemetry/test_friction_status_known_gap_contract_note.py -q
    expected: exit 0; red before (the guard file and vectors v28-v36 are absent).
    fix_if: a vector mislabels, the guard misses a synthetic violation, the digest map lacks 3, or oracle and SQL disagree on unmapped_count
    hermetic: false
    graduation: graduate
    graduation_check_id: friction-rules-v3-guard-and-vectors
  - step: 2
    phase: pre-deploy
    action: The new verb against the oracle over the golden chain.
    command: bin/venv-python -m pytest tests/common/test_ducklake_event_read_friction_signatures.py -q
    expected: exit 0 with every test passing; red before (the verb is not registered).
    fix_if: the verb and the oracle disagree, a run or absorbed close is miscounted, or a drill project leaks in
    hermetic: false
    graduation: graduate
    graduation_check_id: friction-signature-counts-verb
  - step: 3
    phase: pre-deploy
    action: Column registration, the smoke gate, the read-engine roster, the reader contract and the CLI.
    command: >-
      bin/venv-python -m pytest tests/test_telemetry_usage.py::test_friction_sums_signatures_across_trees_and_windows
      tests/test_telemetry_usage.py::test_friction_share_is_null_without_process_events
      tests/test_telemetry_usage.py::test_friction_share_is_per_classifier_version
      tests/test_telemetry_usage.py::test_friction_workflow_filter
      tests/test_telemetry_usage.py::test_friction_lists_every_signature_with_disposition
      tests/test_telemetry_usage.py::test_friction_verb_is_registered_agent_facing_window_verb
      tests/test_telemetry_usage.py::test_reader_contract_declares_the_friction_signature_verb
      tests/test_event_usage_fields.py tests/ducklake_neon_smoke_test/test_lambda_telemetry_reader_gates.py
      tests/checks/contracts/test_validate_read_engine_verbs.py tests/common/ducklake_event_reads/test_describe.py -q
    expected: exit 0; red before (the seven friction CLI and contract tests are absent).
    fix_if: VERB_FIELDS, the smoke list or read-engine.yaml misses the verb, or the CLI sums across classifier versions
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: friction-signature-registration-and-cli
  - step: 4
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push; started from the top-level session, backgrounded with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
  - step: 5
    phase: post-deploy
    action: The governed deploy shipped the telemetry reader with the merge (last-green ref, Decision 254 cl.5).
    command: >-
      git fetch -q origin main && build=$(git log -1 --format=%H --grep='^feat(friction-signature-coverage)' origin/main) &&
      test -n "$build" && ok= && for id in $(gh api
      'repos/otl-labs/ontheloop/actions/workflows/deploy-ducklake-lambdas.yml/runs?status=success&per_page=100' --jq
      '.workflow_runs[].id'); do jobs=$(gh api "repos/otl-labs/ontheloop/actions/runs/$id/jobs" --jq '.jobs[] |
      select((.name=="deploy-telemetry" or .name=="telemetry-smoke") and .conclusion=="success") | .name + " " +
      (.id|tostring)'); echo "$jobs" | grep -q '^telemetry-smoke ' || continue; job=$(echo "$jobs" | sed -n
      's/^deploy-telemetry //p'); deployed=$(gh api "repos/otl-labs/ontheloop/actions/jobs/$job/logs" | grep -oE
      'LAMBDA_ARTIFACT_SHA: [0-9a-f]{40}' | head -1 | cut -d' ' -f2); echo "run $id deployed $deployed"; if git merge-base
      --is-ancestor "$build" "$deployed"; then echo contains; ok=1; fi; break; done; test -n "$ok"
    expected: >-
      the newest successful run with a green telemetry-smoke job deployed a LAMBDA_ARTIFACT_SHA that has the build commit as
      an ancestor (prints contains); before that run exists the step waits, it does not fail (the same read through
      mcp__github__actions_list and get_job_logs where gh is unavailable)
    fix_if: the run is held or failed; read deploy-paths.yaml's code-deploy recovery, never break-glass by default
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: The deployed reader describes the verb as an agent-facing window verb.
    command: >-
      PYTHONPATH=. bin/venv-python -c "from scripts.telemetry_capture.read_route import TelemetryReader as R;
      from scripts.aws_profile import resolve_aws_profile as p; d=R(profile=p('agent_platform')).describe();
      v=d.get('friction_signature_counts') or {}; print('DESCRIBED', v.get('binding'), v.get('agent_facing'), v.get('max_window_days'), v.get('table'));
      assert v.get('binding')=='window' and v.get('agent_facing') is True and v.get('max_window_days')==7"
    expected: DESCRIBED window True 7 telemetry_observations
    fix_if: the verb is absent; the deploy did not ship the merge
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      Live coverage: over the last full 7 UTC days after the deploy, the classifier_version 3 share against the same rows
      relabelled under the classifier_version 2 rules (AC4's definition and v2 relabel).
    command: >-
      bin/venv-python -m scripts.telemetry_usage friction --from "$(date -u -d '7 days ago' +%F)" --to "$(date -u -d yesterday +%F)" > /tmp/friction-v3.json &&
      bin/venv-python -c "import json; e=json.load(open('/tmp/friction-v3.json'))['by_classifier_version']['3'];
      spec={('hook:never_on_main','error'),('hook:fresh_branch_base','error'),('hook:edit_scope_guard','error'),('gate:validate_scope_boundary','error')};
      pe=[x for x in e['signatures'] if x['observation_type']=='process_event']; t=sum(x['fact_count'] for x in pe);
      g2=sum(x['fact_count'] for x in pe if (x['signature'],x['disposition']) not in spec and not
      ((x['signature'] or '').startswith('status:') and x['disposition'] in ('warning','error')));
      print('FACTS', t, 'V3_SHARE', e['unmapped_failure_share'], 'V2_SHARE', round(g2/t, 4) if t else None);
      assert t and e['unmapped_failure_share'] < g2/t"
    expected: >-
      Run after the deploy; exit 0 and one line FACTS n V3_SHARE a V2_SHARE b with a below b,
      recorded in the report with the top generic signatures. Cloud-labelled hook records stay generic until rec-5384's
      hook markers ship; the comparison holds either way because both shares read the same rows.
    fix_if: the share did not fall; read the ranked signatures and report them, never edit rules post-merge outside a plan
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      Decision 79 for the content reader: its next deploy-telemetry-content run that the operator approves (Decision 272
      cl.1; this build never dispatches one) is on a commit that contains this build. Waits on the operator; the build
      reports it pending with this step named, and the coordinator keeps it on the waiting list.
    command: >-
      git fetch -q origin main && build=$(git log -1 --format=%H --grep='^feat(friction-signature-coverage)' origin/main) &&
      test -n "$build" && ok= && for id in $(gh api
      'repos/otl-labs/ontheloop/actions/workflows/deploy-telemetry-content.yml/runs?status=success&per_page=100' --jq
      '.workflow_runs[].id'); do job=$(gh api "repos/otl-labs/ontheloop/actions/runs/$id/jobs" --jq '.jobs[] |
      select(.name=="record" and .conclusion=="success") | .id'); [ -n "$job" ] || continue; deployed=$(gh api
      "repos/otl-labs/ontheloop/actions/jobs/$job/logs" | grep -oE 'LAMBDA_ARTIFACT_SHA: [0-9a-f]{40}' | head -1 | cut -d' '
      -f2); echo "run $id deployed $deployed"; if git merge-base --is-ancestor "$build" "$deployed"; then echo contains; ok=1;
      fi; break; done; test -n "$ok"
    expected: >-
      "run <id> deployed <sha>" then contains, exit 0: the newest deploy-telemetry-content run whose record job succeeded,
      and the commit it deployed contains the build's squash commit (the one whose subject starts
      feat(friction-signature-coverage)). The report names the run id (the same read through mcp__github__actions_list and
      get_job_logs where gh is unavailable).
    fix_if: no approved run since the merge yet (wait, never dispatch), or the run failed (the content channel's own recovery)
    hermetic: false
    graduation: not-applicable
