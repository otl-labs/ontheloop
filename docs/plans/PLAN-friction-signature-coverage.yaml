schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: friction-signature-coverage
intent: >-
  Make the friction classifier's coverage measurable and raise it before any review or rec filing builds on it (feedback-loop
  wave 2, first plan). A new agent-facing window verb, friction_signature_counts, returns per tree one row per friction
  signature (observation type, name, disposition, the rule that labelled it, label, class and whether that rule is generic)
  with fact and session counts, so the unmapped share per classifier_version and the signatures behind it are readable;
  friction classifier_version 3 adds exact rules for twenty repo checks and the detect-secrets pre-commit hook seen failing,
  and for the five blocking hooks that have none, and its unmapped_count counts every process-event fact a generic rule
  labelled; a rules-file guard holds the rules to registered signatures with no ties and no catch-all prefix on a
  registered source. The telemetry_usage CLI gains a friction command that sums the
  rows and prints the unmapped share per classifier_version.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-friction-signature-coverage.yaml
phase: >-
  Feedback-loop wave 2 (operator-directed 2026-11-18): the friction detector the loop's daily analysis (T3.3) reads, the
  CD.45 pilot item pwi-friction-classifier criteria c1-c2, whose statuses stay open (this plan does not edit the pilot
  file; c1's method file tests/telemetry/test_friction_rollup_ducklake.py is not created here, and c2's registration half
  is VP 9's one-time evidence; c2's literal text admits no wildcard, so it cannot close on that text while the status:
  prefix rules r10 and r11 of PLAN-friction-rules-v2 stand without the pilot owner's confirmation, a question the
  pilot's 2027-01-31 sunset review carries). T3.20 is named only as that pilot item's part_of parent, as
  context: its one open criterion, c9, is CI capture, which this plan neither touches nor closes, so it owes no closes_criteria entry. T3.3's criteria wait on
  the daily detector and the filer, so closes_criteria is empty. T3.3's stale files_in_scope (a telemetry_analysis_agent Lambda) is re-grounded by the daily detector plan, the
  first plan that realizes T3.3's detector shape.
closes_criteria: []
