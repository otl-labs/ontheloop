execution_steps:
  - >-
    1. Vectors and golden rows first: v28-v36 in friction_vectors.yaml; the classifier_version 3
    re-baseline of derived_golden_rollups.yaml by hand from each corpus tree's rows (a disagreement at build is a plan
    defect, not a re-derivation); the digest-map entry 3 in test_status_friction_rules.py computed from the planned
    tuples. Then the new test files and test edits; confirm red on the v2 code.
  - 2. Rules (classifier_version 3) and the verb in the verbs module; the labelled CTE and unmapped_count in the sql module (measure its SLOC first; relief branch only if it would cross 500); fields and client.
  - 3. Oracles (derive.py, derive_usage.py), CLI, smoke list, read-engine roster and amendment_log.
  - 4. Apply the sidecar's two blocks verbatim to docs/contracts/ducklake_telemetry_reader.yaml with {{DATE}} set to the build date.
  - "5. Execute Verification Plan steps 1-4; loop until pass. On an unrecoverable failure stop and RCA (Decision 55)."
  - >-
    6. Commit Flow (implement skill and git-ops.yaml handoff_sequence, in this order; report each outcome separately).
    Readiness: bin/venv-python -m scripts.session.github_readiness (unknown is unproven, never PASS), copy code review's
    weakening_dispositions entries for every changed existing assertion into this plan, set implementation_declared: true,
    VP steps 1-3 pass and validate --pre is green. Rebase: git fetch origin main and rebase onto origin/main
    (scripts.session.rebase_resolve RESOLVE CLEAN); if the rebase moved any sidecar before-text, stop (re-approval risk).
    Validator evidence: VP step 4's full tier and validation_result --verify-head PASS on that rebased, clean HEAD (any
    later rebase or fix commit needs a fresh run; a timeout is BLOCKED, handoff_policy). Postflight evidence:
    /tmp/implementation-retrospective.json with the postflight_evidence.CATEGORIES keys, then bin/venv-python -m
    scripts.session.postflight --evidence /tmp/implementation-retrospective.json passes. Push result: git push -u origin
    HEAD as its own call. PR result: the PR open (number returned), its body carrying the VP compliance table, the golden
    re-baseline list with before and after, and the VP 7 line when it exists; subscribe to its activity. Merge
    result (standing authorisation: code review PROCEED, green CI and validate_merge_step green; no always-ask content
    beyond the sidecar-bound text): merge_step premerge --slug friction-signature-coverage --message-file <the commit body>
    --expect <the approved= value approved_text record prints>, merge_pull_request squash with that commit_message (subject
    starting feat(friction-signature-coverage), which VP 5 and VP 8 key on) and expectedHeadSha, then merge_step readback
    --sha <merge sha>.
  - 7. Post-deploy steps 5-7 once deploy-ducklake-lambdas has shipped the telemetry reader for a green main commit containing the merge; VP 8 is reported pending until the operator's next approved content reader deploy.
  - 'Report: what was implemented, verification results, the merge SHA, the deploy run id and the VP 7 line.'
rollback: >-
  Nothing is stored: revert the merge commit and let deploy-ducklake-lambdas ship the reverted reader; every label and
  unmapped_count re-derives at read under classifier_version 2, and the verb and CLI command leave with it.
