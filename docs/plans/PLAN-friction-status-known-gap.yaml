pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - docs/plans/approved/friction-status-known-gap.yaml read; its approval run approved
  - The build base includes the 2026-11-17 amendment merge (rebase onto origin/main before VP step 4, whose verify reads the sidecar at the base)
execution_steps:
  - 1. Write tests/telemetry/test_friction_status_known_gap_contract_note.py (scope row) and confirm it is red on main's contract.
  - 2. Apply the sidecar's four blocks to docs/contracts/telemetry_observations.yaml and tests/telemetry/test_retire_session_cli_contract_notes.py, with {{DATE}} set to the build date; edit nothing else in either file.
  - "3. Execute Verification Plan steps 1, 2 and 4; loop until pass. Step 3 runs after the build commit (its contract drift leg reads merge_base..HEAD and passes vacuously on an uncommitted tree). On an unrecoverable failure stop and RCA (Decision 55)."
  - >-
    4. Commit Flow (implement skill, git-ops.yaml handoff_sequence and resolves_trailer, in order). Readiness:
    bin/venv-python -m scripts.session.github_readiness; copy code review's weakening_dispositions entries into this
    plan if they differ, set implementation_declared: true, steps 1, 2 and 4 pass and validate --pre is green. The commit body
    carries Resolves: rec-5193. After the commit, run VP step 3 on the committed tree. Rebase onto origin/main (scripts.session.rebase_resolve); if the rebase moved any
    sidecar before-text, stop and re-run the wording check and a new approval run unless the change is anchor-only
    (Decision 246 cl.2). Step 5 full tier and --verify-head on the rebased clean HEAD. Postflight evidence, push, PR
    (Resolves block and the VP table in the body), subscribe. Merge under standing_authorisation (code review PROCEED,
    green CI, validate_merge_step green; the only always_ask content is sidecar-bound text): merge_step premerge --slug
    friction-status-known-gap --expect <approved= value, 6474ca3e... after the 2026-11-17 amendment>, merge_pull_request squash with
    expectedHeadSha, then merge_step readback.
  - 5. Post-merge step 6 once the rec-autoclose job has run.
  - 'Report: what was implemented, verification results, the merge SHA and the rec closure read-back.'
rollback: Revert the merge commit; nothing is stored or deployed.
