schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: friction-status-known-gap
intent: >-
  Keep the telemetry contracts true so the feedback loop and its readers trust them (Decision 221 cl.1). The
  telemetry_observations name semantics still declare a known gap that friction classifier version 2 (PLAN-friction-rules-v2,
  PR #2057, rec-4605) closed: a status warning no longer reads hook_fault and a status error no longer reads
  unmapped_block; they read reported_skip (notice) and reported_failure. This plan retires that sentence (rec-5193).
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-friction-status-known-gap.yaml
phase: >-
  T3.3 prerequisite follow-on (friction correctness; follow-on rec of PLAN-friction-rules-v2). Closes no exit criterion;
  T3.3 stays not_started. Contract text and tests only: no Lambda-packaged file (compute_affected_artifacts returns {}),
  no deploy.
closes_criteria: []
cites: [dec:166, dec:235, dec:244, dec:246]
scope:
  - file: docs/contracts/telemetry_observations.yaml
    action: Modify
    purpose: >-
      Exactly the approved-text sidecar docs/plans/approved/friction-status-known-gap.yaml (Decision 246): the name
      semantics' status known-gap clause is replaced by the classifier_version 2 labels (the echoed STATUS line gap
      stays), one dated name amendment_log line (change_class prose_improvement, semantic_break false: the only non-break pairing contracts_enforcement category 6 admits for a semantics edit), and the meaning-free 2026-10-16
      PLAN-reader-verbs-decision-notes top-level log line compacted into it (contracts-class relief valve), so effective
      lines stay 498 (the cap test_observations_declares_the_status_rows pins).
  - file: docs/plans/approved/friction-status-known-gap.yaml
    action: Create
    purpose: The approved-text sidecar (four blocks, {{DATE}} filled at build); written and approved at planning time.
  - file: tests/telemetry/test_retire_session_cli_contract_notes.py
    action: Modify
    purpose: >-
      Exactly the sidecar's status-rows-test-tokens block. Record repair (Decision 244 cl.5, claim unchanged: the
      contract declares the status rows and how the reader labels them): test_observations_declares_the_status_rows
      swaps its two now-false tokens hook_fault and unmapped_block for reported_skip and reported_failure; rec-4605 and
      every other token, the one-entry log assert and the 498 cap stay. Graduated records turn-capture-status-events
      and telemetry-status-source-declared keep their commands unchanged.
  - file: tests/telemetry/test_friction_status_known_gap_contract_note.py
    action: Create
    purpose: >-
      test_observations_retires_the_status_known_gap: the name semantics carry the classifier_version 2 sentence and
      neither retired phrase ('friction rules gain a status row', 'r91 labels a status warning hook_fault'; scoped to the
      phrases, not the bare labels, so later work may name hook_fault elsewhere, Decision 244 cl.4); the labels and
      classes the sentence names equal FRICTION_RULES r10 and r11 (imported from src.common.ducklake_event_read_verbs,
      so a later classifier change that moves them reddens the note; the classes are asserted as the phrases '(<r10 class> class' and '(<r11 class> class)' built from the rule rows, never bare substrings, since 'exception' already appears in exception_total); the name amendment_log has at least one
      PLAN-friction-status-known-gap line naming rec-5193; the top-level log carries no
      'PLAN-reader-verbs-decision-notes (rec-4324)' line.
bundled_recommendations:
  - rec-5193
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - telemetry_observations.yaml carries exactly the approved sidecar text, and its name semantics no longer say a status row reads hook_fault or unmapped_block.
  - rec-5193's acceptance command exits 0.
  - test_observations_declares_the_status_rows asserts reported_skip and reported_failure in place of hook_fault and unmapped_block (the sidecar's test block), and the graduated records turn-capture-status-events and telemetry-status-source-declared stay green with their commands unchanged.
  - rec-5193 reads closed after the merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The contract retires the status known gap and records it (new node).
    command: bin/venv-python -m pytest tests/telemetry/test_friction_status_known_gap_contract_note.py::test_observations_retires_the_status_known_gap -q
    expected: exit 0; red before (the test file does not exist on main).
    expected_literals:
      - ' passed'
    fix_if: a retired phrase remains in name semantics, the named labels or classes differ from FRICTION_RULES r10/r11, the log line is missing, or the compacted line is still there
    hermetic: true
    graduation: graduate
    graduation_check_id: telemetry-status-known-gap-retired
  - step: 2
    phase: pre-deploy
    action: rec-5193 acceptance.
    command: >-
      ! grep -q 'friction rules gain a status row' docs/contracts/telemetry_observations.yaml
      && grep -q 'reported_skip' docs/contracts/telemetry_observations.yaml && echo REC_5193_ACCEPTANCE_OK
    expected: REC_5193_ACCEPTANCE_OK; red before (main carries the stale clause and no reported_skip).
    expected_literals:
      - REC_5193_ACCEPTANCE_OK
    fix_if: the stale clause is still present or reported_skip is absent
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the graduated step 1 node, which asserts the same absence and presence plus the log line; a second
      registry row would guard nothing new.
  - step: 3
    phase: pre-deploy
    action: The two graduated records naming the repaired test file stay green with their commands unchanged.
    command: >-
      bin/venv-python -m pytest tests/telemetry/test_retire_session_cli_contract_notes.py
      tests/checks/contracts/validate_contract_drift/test_declared_subtree.py::test_real_tree_passes -q
      && bin/venv-python -m scripts.schema_to_field_semantics --check
      && git diff --quiet origin/main -- config/agent/verification_registry/entries/turn-capture-status-events.yaml
      config/agent/verification_registry/entries/telemetry-status-source-declared.yaml && echo RECORDS_KEPT
    expected: all nodes pass (including the contract drift check on the committed tree, which reads HEAD against the merge-base), the field_semantics projection is unchanged, then RECORDS_KEPT
    fix_if: a node fails (a token drifted from the sidecar), the projection changed, or a registry entry was edited
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Already the graduated records turn-capture-status-events and telemetry-status-source-declared (Decision 244);
      the registry-unchanged leg depends on this session's diff against origin/main.
  - step: 4
    phase: pre-deploy
    action: The edited files hold exactly the approved sidecar text, and the contract stays at 498 effective lines.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug friction-status-known-gap --base origin/main
      && bin/venv-python -c "from pathlib import Path; from scripts.checks.structural._classify import effective_lines as e;
      n=e(Path('docs/contracts/telemetry_observations.yaml').read_text(encoding='utf-8')); print(n); assert n<=498"
    expected: APPROVED-TEXT OK, then 498
    fix_if: any byte differs from the sidecar (never edit the sidecar to match; a wording change needs a new approval run) or the count exceeds 498
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Compares this session's diff against origin/main (transient repo state); the size cap is already pinned by the graduated test_observations_declares_the_status_rows.
  - step: 5
    phase: pre-deploy
    action: >-
      Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it
      from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and step 1 carries the durable regression.
  - step: 6
    phase: post-deploy
    action: rec-5193 closed by the squash commit's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows,missing=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-5193']);
      s={r['id']:r['status'] for r in rows}; print(s); assert not missing and s.get('rec-5193')=='closed'; print('REC_CLOSED')"
    expected: REC_CLOSED
    fix_if: the rec reads open after the trailer-closure job; check the job, never close by hand without its evidence
    hermetic: false
test_obligations:
  - source: docs/contracts/telemetry_observations.yaml
    behavior: name semantics declare the classifier_version 2 status labels, not the retired known gap, and the name log records the retirement
    verification_step: 1
    test_selector: tests/telemetry/test_friction_status_known_gap_contract_note.py::test_observations_retires_the_status_known_gap
    red_green_expectation: red before (node absent; main carries the stale clause), green after
weakening_dispositions:
  - candidate: "[assertion-changed] tests/telemetry/test_retire_session_cli_contract_notes.py::test_observations_declares_the_status_rows"
    disposition: planned-change
    cite: "acceptance_criteria[2]"
constraints:
  - Contract and test text only as the approved sidecar; a wording change after approval needs a new approval run (Decision 246).
  - No contracts-class budget raise (Decision 166); telemetry_observations.yaml stays at 498 effective lines, by the sidecar's compaction only.
  - No edit to an existing registry entry; the two graduated records keep their commands (Decision 244 cl.5 repair in the test node only). Step 1's graduation creates its own new shard.
  - No rescue agents or workaround loops (Decision 55).
