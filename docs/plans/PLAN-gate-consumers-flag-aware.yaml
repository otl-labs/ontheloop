constraints:
  - "Build only after PLAN-merge-requires-green-checks' build and PLAN-persona-verdict-credential's build have merged (step 1): the build order is the operator's itinerary ruling (both earlier builds edit project-configuration.yaml or the gate), not an anchor need; {{N}} is plan 1's Decision number on the base."
  - "The merge gate reads the rows only from origin/main and the fetched PR head; no flag, environment variable, working-tree file or tool_input field changes what it reads or skips the leg (Decision 203 cl.3-4 pattern); a false refusal is fixed in the checker."
  - "merge_checks.py stays pure: no I/O, no pull request number (Decision 234 cl.4); git and GitHub plumbing stay in the adapter (Decision 212 cl.3)."
  - "No new GitHub endpoint: persona checks come from the check-run read plan 1 adds; only check runs by the app github-actions count."
  - "The contract, row and roadmap text is operator-approved; place it exactly, never re-word; a moved anchor is a plan-defect report."
  - "No git-ops.yaml edit (plan 1's merge_checks.py entry covers the module; the file is at its budget and serialised); no new Decision; no ruleset change (rec-4624); no automatic fallback (rec-5122)."
  - "The /plan and /implement skill texts and the retiring overseer's files are out of scope (the add and flip plans; Decision 247)."
  - "Never edit CI Reform's tests/checks/decisions/test_sit_decision_records.py."
  - "Existing tests change only fixture seeding, never an assert line, except the sidecar-approved test-profile-entry line (Decision 235)."
  - No rescue agents or workaround loops (Decision 55).
