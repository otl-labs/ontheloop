schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: gate-consumers-flag-aware
intent: >-
  Each verdict persona gets one switch saying where its verdict comes from (in_session or actions), so every later
  persona flip changes only its row's default. Second of two plans for T4.32 c5 (rec-5121): the three
  gates.<persona>.verdict_source rows, their validator rule, the merge gate's persona leg that PLAN-merge-requires-green-checks'
  Decision states (clauses 4-5), and the coordinator, tier-item-lifecycle and project-alignment readings. Adds no
  Decision; with every row at in_session nothing changes the day it lands.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-gate-consumers-flag-aware.yaml
phase: >-
  T4.32 (persona foundation), criterion c5's remaining half (the rows, the persona leg and the consumer readings);
  closes T4.32:c5 together with PLAN-merge-requires-green-checks, which must be built first.
closes_criteria:
  - T4.32:c5
scope:
  - file: docs/contracts/project-configuration.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's blocks pc-header, pc-amendment-log and pc-rows: three project-kind rows
      gates.code_reviewer.verdict_source, gates.decision_scout.verdict_source and gates.plan_critic.verdict_source
      (applies_when always, platform_file homes, variable null, readers .claude/hooks/merge_gate.py, defaults
      {local: in_session, cloud: in_session}, this_repository current_home null with the origin/main note, status open,
      owning_item T4.24:c16, enforcement validate_project_configuration), the header clause naming their defaults as
      the value the merge gate reads, and one amendment_log row. {{N}} in the blocks is PLAN-merge-requires-green-checks'
      Decision number on the build's base, {{DATE}} the build date UTC.
  - file: scripts/checks/contracts/validate_project_configuration.py
    action: Modify
    purpose: >-
      New rule (l) in the docstring and a _check_gate_rows finding function wired into _rule_findings: (1) the
      gates.<persona>.verdict_source row ids name exactly the kind-verdict personas of
      docs/contracts/executor-personas.yaml, one row each (a missing row, an extra row and an unregistered persona are
      each a finding naming it); (2) such a row has kind project, variable null and defaults.local and defaults.cloud
      equal and in {in_session, actions}; (3) when ontheloop/platform.yaml exists and parses with a top-level gates
      key while a gates row's this_repository.current_home is null, a finding says ontheloop/platform.yaml sets a gate no
      reader reads (T4.24 c16 moves the reader first), and an ontheloop/platform.yaml that exists but does not parse
      is a finding too (fail closed). Stdlib and yaml only; it does not import
      scripts.session.merge_checks. Stays under 500 SLOC.
    new_imports: []
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      The validate_project_configuration Entry's pre_globs gain docs/contracts/executor-personas.yaml and
      ontheloop/platform.yaml, the two inputs rule (l) reads, so a PR adding a verdict persona without its row, or
      creating ontheloop/platform.yaml with a gates key, reruns the check in --pre rather than surfacing on main.
    new_imports: []
  - file: tests/checks/contracts/test__manifest.py
    action: Modify
    purpose: >-
      One node: each of docs/contracts/executor-personas.yaml and ontheloop/platform.yaml matches a
      validate_project_configuration pre_glob (red before the Entry edit). Existing nodes unchanged.
  - file: tests/checks/contracts/test_validate_project_configuration.py
    action: Modify
    purpose: >-
      One red fixture per rule (l) finding, each a copy of the real contract with one edit run through
      validate_project_configuration(failed, root=tmp): a missing row, an extra gates row for a non-verdict persona,
      variable set, local differing from cloud, a value outside the enum, a platform.yaml with a gates key and an unparseable platform.yaml; plus
      the real file passing. The root fixture's _COPIED gains docs/contracts/executor-personas.yaml and _TOUCHED gains
      .claude/hooks/merge_gate.py (seeding only, so rule (l) and the readers rule find their files); existing nodes
      unchanged.
  - file: tests/checks/contracts/test_gate_verdict_source_rows.py
    action: Create
    purpose: >-
      rec-5121's acceptance file; its acceptance names three nodes: test_rows_read_in_session (the real file's rows
      parse through merge_checks.verdict_sources to three in_session), test_one_field_flip_requires_the_persona_check
      and test_switch_back_names_the_persona (switch_backs on the real rows and a copy with code_reviewer at actions
      names code_reviewer one way and nothing the other). Also:
      merge_checks.PERSONA_CLASSES keys equal the kind-verdict personas of executor-personas.yaml and the gates row
      personas; a copy with one row's two defaults set to actions makes merge_checks.persona_checks return
      persona-verdict/<that persona> for its class and nothing for the other (the one-field flip); and growth-safe
      phrase pins for the placed readings (coordinator.yaml lifecycle.verdict_source, roles.structure, the critique,
      plan_pr and build steps and two standing_authorisation items; tier-item-lifecycle steps (1) and (4);
      project-alignment pr_flow; ports.yaml PC-10; the T4.28 c1 amendment).
  - file: scripts/session/merge_checks.py
    action: Modify
    purpose: >-
      The persona leg's pure functions, beside plan 1's verdict(): PERSONA_CLASSES = {code_reviewer: code,
      decision_scout: plan, plan_critic: plan}; persona_check_name(persona) -> "persona-verdict/<persona>" (the one
      name rule the verdict-jobs plan must import); verdict_sources(config_text) -> dict persona -> value, or a
      reason string when the text is unparseable, a PERSONA_CLASSES persona has no row, a gates row names an unknown
      persona, a persona has two rows, a value is outside {in_session, actions} or local differs from cloud (reads settings[].id and defaults
      only); a file that parses with no gates.<persona>.verdict_source row at all reads every persona as in_session
      (the pre-adoption base: main before this build merges, so the build's own agent merge is not wedged; a removal
      of every row later is red under rule (l) and, from actions, a switch-back), while a partial set is a missing-row
      reason; pr_class(changed) -> plan when scripts.ci.push_scope.confined_to_plans(changed) else code (an empty or
      None set is code); persona_checks(sources, pr_class) -> sorted check names of actions rows serving that class;
      switch_backs(base_sources, head_sources) -> sorted personas whose row reads actions on base and in_session on
      head (the adapter passes the PR's merge base as base, so the judgement is the PR's own change). No I/O, no pull request number (Decision 234 cl.4). Stays under 500 SLOC.
    new_imports: [scripts.ci.push_scope]
  - file: tests/test_session_merge_checks.py
    action: Modify
    purpose: >-
      Unit nodes for the persona functions: name rule; each verdict_sources reason (unparseable, missing row, unknown
      persona, duplicated row, bad value, local != cloud) and the all-in_session parse; pr_class for plans-only, mixed, code-only and
      empty sets; the no-rows base reading all in_session; persona_checks for each class with one, two and no actions rows; switch_backs for a rollback, a
      flip forward and no change. Plan 1's nodes unchanged.
  - file: .claude/hooks/merge_gate.py
    action: Modify
    purpose: >-
      The persona leg (Decision {{N}} cl.4-5), on merge_pull_request and enable_pr_auto_merge alike, after the
      overlap and trailer checks and before the two GETs, inside plan 1's 40 s deadline. (1) Read
      docs/contracts/project-configuration.yaml from refs/remotes/origin/main with git show (never the working tree,
      a variable or a tool_input field); verdict_sources failing -> exit 2 "merge-gate: verdict-source: UNAVAILABLE:
      <reason>; retry later, or the operator merges in the GitHub UI". (2) changed = git diff --name-only
      --no-renames <merge base> <head>, using the merge base merge_overlap returned (a failed diff is UNAVAILABLE).
      (3) Only when changed includes docs/contracts/project-configuration.yaml, judge the PR's own change: read the
      file at the merge base and at the head; a merge base whose rows fail verdict_sources is UNAVAILABLE; a head whose
      rows fail it -> exit 2 "merge-gate: verdict-source: REFUSE: the PR head's gates rows do not read: <reason>";
      switch_backs(merge-base sources, head sources) non-empty -> exit 2 "merge-gate: verdict-source: REFUSE: this
      PR returns <persona list> from actions to in_session; the operator merges it in the GitHub UI (Decision {{N}}
      cl.5)". A PR that does not change the file is never judged a switch-back, however old its head. (4) The
      persona_checks(main's sources, pr_class(changed)) names join the ruleset's required contexts in the one
      merge_checks.verdict call, so a persona check reads exactly like a required check, and each such REFUSE reason
      adds "(gates.<persona>.verdict_source reads actions on origin/main; if that persona's Actions lane is down, a PR
      returning the row to in_session is the fallback, merged by the operator)". With every main row in_session and
      the file unchanged the leg costs one git show and one git diff and adds no check. yaml is imported at the
      hook's top, before its project-root sys.path insert, like plan 1's stdlib imports. Plan 1's read_checks_verdict
      seam gains a keyword argument extra (a sequence of check names, default empty) required beside the ruleset's
      contexts, used by the VP replay. No new GitHub endpoint, no override. Stays under 500 SLOC.
  - file: tests/fixtures/merge_overlap_repos.py
    action: Modify
    purpose: >-
      The seed commit also writes a minimal docs/contracts/project-configuration.yaml (settings: the three gates rows
      with in_session defaults, the only keys the gate reads), so existing allow-path nodes stay green unedited;
      set_verdict_source(persona, value) advances main with that row changed; branch_pr_switch(number, persona, value)
      opens a PR changing only that row; clear_gate_rows() advances main with the three rows removed (the pre-adoption
      base); install_project also copies scripts/ci/push_scope.py into a created scripts/ci/ directory with no
      __init__.py (a namespace package, as in the repo).
  - file: tests/hooks/test_merge_gate_persona_leg.py
    action: Create
    purpose: >-
      Through the shim, as the harness runs it (GIT_ALLOW_PROTOCOL=file): all rows in_session -> exit 0 on a green
      head; code_reviewer actions on a code PR with no persona check run, a failed one, a pending one and a newer
      queued re-run -> exit 2 naming persona-verdict/code_reviewer; with a green github-actions run -> exit 0; a run
      by another app -> exit 2; plan_critic actions on a plans-only PR -> exit 2 until its check is green, and a code
      PR is unaffected; a mixed PR counts as code; missing config file on main, a missing row, a bad value and
      local != cloud -> exit 2 naming UNAVAILABLE; a PR switching an actions row back to in_session -> exit 2 naming
      the operator even with every check green, on either tool; a PR branched before main's row was set to actions
      that does not touch the file, with a green persona check, -> exit 0; a PR whose head predates the rows -> exit 0
      once main reads actions (with its persona check green); a PR that itself changes a row from actions to
      in_session after that -> exit 2; a main with no gates rows and a PR adding them at
      in_session -> exit 0 (this build's own merge); a working-tree edit of the file, an OTL_ variable and an unknown
      tool_input key cannot turn a refusal into exit 0; enable_pr_auto_merge behaves the same. Module-scoped fixtures
      to protect the --pre budget.
  - file: tests/hooks/test_merge_gate_deadline.py
    action: Modify
    purpose: >-
      Plan 1's deadline node also covers the persona leg's git show and git diff calls: on the worst path (actions
      rows, slow git calls) no requested timeout runs past the 40 s deadline and a spent deadline denies naming the
      step. Plan 1's nodes keep their asserts; their injected git runner answers the persona leg's git show with an
      all-in_session config and its git diff with a code-only file list (fixture seeding only), so rec-4891's
      acceptance node stays green.
  - file: docs/contracts/coordinator.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's co-* blocks: lifecycle.verdict_source (a lifecycle key, not a term: every coordinator term
      maps to a harness surface in docs/contracts/coordinator-harness-claude-projects.yaml), the roles.structure,
      critique, plan_pr and build pointers, the two standing_authorisation items and co-amendment-log, a new
      amendment_log entry (no contract_version change: nothing changes while every row reads in_session). The strings
      test_coordinator_contract.py pins stay. After merge the shared copy is refreshed (step 11).
  - file: tests/checks/contracts/test_coordinator_harness_profile.py
    action: Modify
    purpose: >-
      Exactly the sidecar's block test-profile-entry: test_contract_points_at_the_profile finds the
      PLAN-coordinator-harness-profile amendment_log entry by its summary instead of pinning it as the last entry, which
      any later coordinator.yaml amendment breaks (the rec-5095 growth-safe pattern). A loosened assertion (it no
      longer asserts the entry is last), approved with the sidecar (Decision 235); its other assert lines are unchanged.
  - file: docs/contracts/tier-item-lifecycle.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's blocks til-step-1 and til-step-4, plus til-amendment-log, a new amendment_log entry (no
      contract_version change).
  - file: docs/contracts/project-alignment.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's blocks pa-pr-flow and pa-amendment-log (a new amendment_log entry); pr_flow stays status
      future and keeps the four tokens test_project_alignment_contract.py pins.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's blocks ports-pc-10 (coupling PC-10, open, owning_item T4.2:c9) and ports-amendment-log (a
      new amendment_log entry), and
      the folded scalars semantics.coupling_findings, semantics.structural_assumptions and PC-02's description each
      re-flowed onto one physical line with words unchanged (Decision 166 relief valve), so the file shrinks by two
      effective lines; measured at build against its base, never a raise.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's blocks roadmap-t4-28-c1 (a dated amendment saying a PR changing code is every PR not
      confined to docs/plans/), roadmap-t4-32-c5-met (closes_criteria's flip of T4.32 c5 to met), and the bookkeeping
      walk's strict-subset outcome for T4.32 written out in advance: roadmap-t4-32-status (status not_started ->
      in_progress) and roadmap-t4-32-progress (one dated progress_note bullet appended after the last bullet on main).
      No other word of the file changes; the walk's staging is exactly these blocks. If another build has already
      moved T4.32's status or that bullet, the anchor fails: stop and send a plan-defect report.
bundled_recommendations:
  - rec-5121
followon_recs: []
infrastructure_dependencies:
  - >-
    None. No .tf file is in scope. compute_affected_artifacts(<scope>) names only data-pipeline, through
    docs/ROADMAP-PLATFORM.yaml, which carries a dated amendment and a criterion status only (the
    PLAN-llm-client-litellm-transport and PLAN-persona-trigger-policy disposition: the deploy gate's watched paths
    exclude the roadmap and its one runtime reader runs only from the disabled scheduled-agent dispatcher): no build,
    deploy or smoke step.
acceptance_criteria:
  - rec-5121's acceptance (the three tests/checks/contracts/test_gate_verdict_source_rows.py nodes it names) exits 0.
  - docs/contracts/project-configuration.yaml holds the three rows at in_session and validate_project_configuration rejects a missing or extra row, a variable, local != cloud, a value outside the enum and an unread platform.yaml gates key.
  - Through the shim, a row reading actions makes the gate require persona-verdict/<persona> (newest github-actions run, completed, success, on the head) on the PRs of that persona's class; all in_session adds nothing; any unreadable row or diff refuses; a PR whose own change (merge base to head) switches a row from actions back to in_session or removes one is refused for an agent, and a PR that does not change the file never is, however old its head.
  - Replayed on real data, #1990 (plans-only) reads class plan, and the persona leg reads CLEAR on its head with the build's committed rows and REFUSE naming persona-verdict/plan_critic once a copy of the file sets plan_critic to actions.
  - The five contracts and the roadmap carry exactly the sidecar's blocks (approved_text verify exits 0) and ports.yaml has fewer effective lines than its base.
  - Existing merge-gate suites, plan 1's suites, rec-4869's replay and the contract tests stay green with no assert line changed, except the sidecar-approved test-profile-entry line.
  - After merge, the coordinator's shared copy matches coordinator.yaml at the merge commit, T4.32 c5 reads met, and rec-5121 reads closed.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Premises, run first on the build's base, before any edit; prints plan 1's Decision number for {{N}}.
    command: >-
      bin/venv-python -c "import pathlib, re, yaml; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      m=re.search(r'^## Decision (\\d+): An agent merge is refused unless every required check', t, re.M);
      mc=pathlib.Path('scripts/session/merge_checks.py'); pc=yaml.safe_load(open('docs/contracts/project-configuration.yaml', encoding='utf-8'));
      ids=[s['id'] for s in pc['settings']]; rows=[s for s in pc['settings'] if s['id'].startswith('ports.run_persona.litellm.api_key.')];
      print('plan1_decision=' + (m.group(1) if m else 'MISSING') + ' merge_checks=' + str(mc.exists() and 'def verdict(' in mc.read_text(encoding='utf-8'))
      + ' credential_built=' + str(all(r['this_repository']['status'] == 'accepted' for r in rows) and len(rows) == 2)
      + ' switch_back_clause=' + str(bool(m) and 'from actions to in_session' in t[m.end():].split(chr(10) + '## Decision ')[0])
      + ' no_gate_rows=' + str(not any(i.startswith('gates.') for i in ids)) + ' no_platform_file=' + str(not pathlib.Path('ontheloop/platform.yaml').exists()))"
    expected: >-
      One line: plan1_decision=<a number>, merge_checks=True, credential_built=True, switch_back_clause=True,
      no_gate_rows=True, no_platform_file=True.
    fix_if: >-
      plan1_decision=MISSING or merge_checks=False means plan 1 is not built (wait); credential_built=False means the
      credential build has not merged (wait); switch_back_clause=False means plan 1's Decision lacks the cl.5
      switch-back sentence this plan's refusal rests on (plan-defect report); a False elsewhere means a premise moved: stop and send a plan-defect
      report.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Red-before premise evidence that this build itself makes false; steps 2-5 are the standing guards.
  - step: 2
    phase: pre-deploy
    action: Run the persona functions' unit tests.
    command: bin/venv-python -m pytest tests/test_session_merge_checks.py -q
    expected: exit 0, all nodes pass; the persona nodes are red before (functions absent).
    fix_if: a reason case parses, a mixed PR reads plan, or a flip forward reads as a switch-back
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: merge-checks-persona-functions
  - step: 3
    phase: pre-deploy
    action: Run rec-5121's acceptance file and the validator's red fixtures.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_gate_verdict_source_rows.py
      tests/checks/contracts/test_validate_project_configuration.py tests/checks/contracts/test__manifest.py -q
    expected: exit 0, all nodes pass; red before (file absent, rows absent, rule (l) absent).
    fix_if: a red fixture passes the validator, or the real rows do not parse to three in_session
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: gate-verdict-source-rows
  - step: 4
    phase: pre-deploy
    action: Run the persona leg through the shim.
    command: bin/venv-python -m pytest tests/hooks/test_merge_gate_persona_leg.py tests/hooks/test_merge_gate_deadline.py -q
    expected: exit 0, all nodes pass; red before (file absent, and the adapter allows a head with no persona check).
    fix_if: any actions row, unreadable row or switch-back exits 0 (fails open), or all in_session refuses a green head
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: merge-gate-persona-leg
  - step: 5
    phase: pre-deploy
    action: Existing merge-gate suites, plan 1's suites, rec-4869's replay and the contract tests stay green.
    command: >-
      bin/venv-python -m pytest tests/hooks/test_merge_gate.py tests/hooks/test_merge_gate_shim.py
      tests/hooks/test_merge_requires_green_checks.py tests/test_session_merge_overlap.py
      tests/checks/prose/test_s1_concurrent_merge_premerge.py tests/checks/contracts/test_coordinator_contract.py
      tests/checks/contracts/test_coordinator_harness_profile.py tests/test_project_alignment_contract.py
      tests/roadmap/test_verdict_persona_criteria.py
      tests/hooks/test_plugin_hooks.py -q
    expected: exit 0
    fix_if: >-
      an allow-path node fails for the seeded config file (fix the fixture, never an assert line);
      validate_weakening_candidates listing a candidate is a plan-defect report, never a disposition
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Existing standing guards already graduated or selected by --pre for these files.
  - step: 6
    phase: pre-deploy
    action: Bind the contract and roadmap edits to the approved words.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug gate-consumers-flag-aware --base origin/main
      --expect 713186d4252938469a91cbda93b51db258694d8d414d5d50a98c55acc8beec71
    expected: exit 0; all twenty-three blocks match
    fix_if: any word differs from the sidecar; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar
      on every PR declaring this plan.
  - step: 7
    phase: pre-deploy
    action: The registry, ports and drift checks pass on the committed tree, and ports.yaml shrank.
    command: >-
      bin/venv-python -c "import subprocess, pathlib; from scripts.checks.structural._classify import effective_lines;
      from scripts.checks.contracts.validate_project_configuration import validate_project_configuration as a;
      from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as b;
      from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as c; f=[]; a(f); b(f); c(f); assert not f, f;
      base=effective_lines(subprocess.run(['git', 'show', 'origin/main:docs/contracts/ports.yaml'], capture_output=True, text=True, check=True).stdout);
      head=effective_lines(pathlib.Path('docs/contracts/ports.yaml').read_text(encoding='utf-8')); assert head < base, (base, head); print('CONTRACTS-OK', base, head)"
    expected: prints CONTRACTS-OK with ports' base and head effective lines, head smaller
    fix_if: a check fails (fix the placement, never the sidecar), or ports did not shrink (re-flow per scope; never a raise)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative (the line delta is vacuous once merged); the three checks run in --pre and the full tier on every PR.
  - step: 8
    phase: pre-deploy
    action: >-
      Live replay on real data (network): #1990's class from its real diff, then the committed build HEAD's rows (all
      in_session) and a copy with plan_critic at actions, judged with #1990's real check runs through the adapter's
      read seam.
    command: >-
      git fetch -q origin refs/pull/1990/head:refs/replay/1990 && bin/venv-python -c "import sys, pathlib, subprocess, yaml;
      sys.path.insert(0, '.claude/hooks'); import merge_gate as g; from scripts.session import merge_checks as m;
      run=lambda *a: subprocess.run(['git', *a], capture_output=True, text=True, check=True).stdout;
      sha=run('rev-parse', 'refs/replay/1990').strip(); base=run('merge-base', 'origin/main', sha).strip();
      cls=m.pr_class(run('diff', '--name-only', '--no-renames', base, sha).split());
      text=run('show', 'HEAD:docs/contracts/project-configuration.yaml'); d=yaml.safe_load(text);
      [s.update(defaults={'local': 'actions', 'cloud': 'actions'}) for s in d['settings'] if s['id'] == 'gates.plan_critic.verdict_source'];
      print('class', cls); [print(label, g.read_checks_verdict(pathlib.Path('.'), 'otl-labs', 'ontheloop', sha, extra=m.persona_checks(m.verdict_sources(t), cls)))
      for label, t in (('main', text), ('flipped', yaml.safe_dump(d)))]"; git update-ref -d refs/replay/1990
    expected: >-
      three lines: class plan (#1990 changed only docs/plans/ files); main (the HEAD rows, all in_session) a CLEAR
      verdict; flipped (plan_critic at actions) a REFUSE verdict whose reasons name persona-verdict/plan_critic as
      missing. An UNAVAILABLE line is a read failure on this surface: re-run once; if it persists, record it and send
      a plan-defect report
    fix_if: class reads code (pr_class misreads a plans-only diff), main reads REFUSE (the leg adds a check with every row in_session) or flipped reads CLEAR (the leg misses the flip)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Depends on network reads of GitHub; steps 2-4 graduate the same verdicts hermetically.
  - step: 9
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): this command as one backgrounded Bash call with a
      2 h limit from the top-level session.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate &&
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0; --verify-head reads the full tier's recorded verdict for HEAD, never the backgrounded run's own exit status
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun from the start; a failure only in another
      open red's tests is not this build's to fix: log it and follow the implement skill's go/no-go
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: After the squash merge, confirm the rec closed and c5 reads met on main.
    command: >-
      git fetch -q origin main && bin/venv-python -c "import subprocess, yaml; from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      r=yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:docs/ROADMAP-PLATFORM.yaml'], capture_output=True, text=True, check=True).stdout);
      item=next(i for i in r['tier_items'] if i['id'] == 'T4.32'); c5=next(c for c in item['exit_criteria'] if c['id'] == 'c5');
      print(c5['status'], sorted((x['id'], x['status']) for x in fetch_recs_by_ids(make_reader(), ['rec-5121'])[0]))"
    expected: prints met [('rec-5121', 'closed')]
    fix_if: >-
      rec still open after the closure job: read its log; a Decision 186 or 201 refusal routes per git-ops
      resolves_trailer (merge_step recover), never a hand close; c5 open means the bookkeeping commit was dropped
    hermetic: false
  - step: 11
    phase: post-deploy
    action: Refresh the coordinator's shared copy (coordinator.yaml surfaces.delivery) and prove it current.
    command: >-
      bin/venv-python -m scripts.session.coordinator_copy write /mnt/project-files/coordinator/ &&
      bin/venv-python -m scripts.session.coordinator_copy check /mnt/project-files/coordinator/
    expected: exit 0 from both; the copy's header names the merge commit
    fix_if: >-
      the shared store is not mounted on this surface: record it and ask the coordinator to have a worker run it; a
      stale check after write is a coordinator_copy defect (file a rec)
    hermetic: false
