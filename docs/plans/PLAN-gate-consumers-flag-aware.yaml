pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Run VP step 1 on the build's base before any edit; plan1_decision gives {{N}}; any False stops the build (wait or plan-defect report)."
  - "Write the new and extended test nodes (steps 2-4); run them on the base tree and confirm they fail (red-before)."
  - "scripts/session/merge_checks.py: add the persona functions per scope."
  - "scripts/checks/contracts/validate_project_configuration.py: add rule (l) per scope."
  - "tests/fixtures/merge_overlap_repos.py: seed the rows file and add the helpers per scope."
  - ".claude/hooks/merge_gate.py: add the persona leg per scope; keep the shim, settings.json and hooks.json unchanged."
  - "docs/contracts/*.yaml and docs/ROADMAP-PLATFORM.yaml: place the sidecar blocks exactly, {{N}} = step 1's number, {{DATE}} = the build date; re-flow the three ports.yaml scalars per scope."
  - "The plan declares no weakening disposition: if validate_weakening_candidates lists any candidate, stop and send a plan-defect report."
  - "Commit locally (no push) before VP step 6: steps 6-8 read the committed HEAD (step 8 flips a copy of HEAD's plan_critic row), and --verify-head attests only a full run that started on a clean, committed tree."
  - "Execute VP steps 1-9; loop until pass; on an unrecoverable failure stop and send a plan-defect report (Decision 55)."
  - "The implementation commit message carries 'Resolves: rec-5121'; merge_pull_request passes an explicit commit_message carrying it and expectedHeadSha. Merge only on code review PROCEED, green CI and the operator's word on the final diff (hook code)."
  - "After merge: run steps 10 and 11."
  - "Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state (scripts.session.github_readiness); parent validator evidence (VP 9 plus --verify-head for the pushed HEAD); structured postflight evidence (scripts.session.postflight --evidence); the real outcome - push, build PR, CI green by event-driven wake (never polled), merge SHA."
  - "Report: what was implemented, verification results, the four closure-evidence facts, merge SHA, steps 8, 10 and 11 results."
rollback: >-
  Revert the adapter, merge_checks.py, validator, fixture and test changes; the rows and contract readings may stay
  (every row reads in_session, so nothing reads them but the gate). The rollback PR's own merge passes through the
  live gate: if the gate is wedging, the operator's GitHub-UI merge is the valve.
