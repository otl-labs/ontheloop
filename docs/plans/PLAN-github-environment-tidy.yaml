schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "github-environment-tidy"
intent: >-
  Stop every tf-trusted-plan job creating a GitHub deployment record by running all three of them with deployment:
  false (the terraform/personal and terraform/github PR plans and the terraform/github apply preview), adopted only
  after live proof that the Environment still refuses a non-main ref and still binds the OIDC environment subject under
  deployment: false (rec-4913), so the Deployments panel stops filling with speculative-plan records. The
  deployment-approval-probe Environment is kept: Decision 248 cl.8-9 uses it as the apply App's approval oracle, so
  rec-4914's retirement was declined.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-github-environment-tidy.yaml
phase: >-
  ad_hoc_rec (rec-4913 Medium; soft-warn category, no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  closes_criteria empty: rec-4913 is not a roadmap exit criterion (precedent PLAN-deployment-approval-probe).
scope:
  - file: .github/workflows/terraform-plan-trusted.yml
    action: Modify
    purpose: >-
      The plan job's environment becomes the mapping {name: tf-trusted-plan, deployment: false}; one header sentence
      says the job creates no deployment record and names rec-4913 (whose resolution carries the VP 3, VP 4 and VP 9
      run links proving the branch policy and the OIDC subject under deployment: false).
  - file: .github/workflows/terraform-github-plan.yml
    action: Modify
    purpose: >-
      The plan job's environment becomes the mapping {name: tf-trusted-plan, deployment: false}; the same header
      sentence. The tf-trusted-plan environment secret TF_GITHUB_PLAN_APP_PRIVATE_KEY still applies under deployment:
      false (GitHub docs), which VP 3's branch refusal keeps away from non-main refs.
  - file: .github/workflows/terraform-github-apply.yml
    action: Modify
    purpose: >-
      The preview job's environment becomes the mapping {name: tf-trusted-plan, deployment: false}; one header-line
      clause on the preview's row says it creates no deployment record. The apply job is untouched
      (validate_github_settings_apply predicate (c), line 412, keeps its tf-gated-apply environment a literal string; it
      stays reviewer-gated and recorded). This file is a push path of the workflow itself, so the merge push runs the
      flipped preview (VP 8).
  - file: scripts/checks/ci_guards/validate_trusted_plan_environment.py
    action: Modify
    purpose: >-
      New predicate (l) in this module: every job in ENV_WORKFLOWS whose environment is ENV declares the mapping form
      with deployment the YAML boolean false (is False; a quoted "false", a bare string, deployment true or an absent
      key is refused), added to run_all with the existing predicates; the module docstring gains its (l) line worded as
      Deployments-panel hygiene, not the trust boundary. Coupled literals move with it: registry.examined(11, ...)
      (about line 526) becomes 12 and the PASS line "predicates (a)-(k)" (about line 528) becomes "(a)-(l)". _env_name
      stays as is (it already reads the mapping). Headroom 62 SLOC; the change is about ten.
    new_imports: []
  - file: tests/checks/ci_guards/test_validate_trusted_plan_environment.py
    action: Modify
    purpose: >-
      New node test_trusted_environment_job_requires_deployment_false: synthetic red cases (bare string, deployment
      true, quoted "false", key absent) for a job in each of the three ENV_WORKFLOWS files, and the green mapping form.
      test_real_tree_is_green keeps its id (graduated record trusted-plan-environment-fence, Decision 244), now runs
      over the three flipped workflows and its `[[]] * 11` (about line 44) becomes `[[]] * 12`;
      test_pass_line_ignores_unrelated_earlier_failures (about line 276) reads "PASS: predicates (a)-(l)".
  - file: tests/checks/ci_guards/test_terraform_plan_trusted.py
    action: Modify
    purpose: >-
      The shape pin (line 71) reads the mapping form (name tf-trusted-plan and deployment is False); one new mutation
      (deployment true) must be refused; the existing "no environment" mutation stays. Node ids unchanged (graduated
      record trusted-plan-cutover-workflow).
  - file: tests/checks/ci_guards/test_terraform_github_plan_trusted.py
    action: Modify
    purpose: >-
      The job pin (line 65) reads the mapping form; the remove-environment mutation (line 193), whose literal string
      replace would no longer match (test_each_shape_rule_has_a_red_case's mutated != text assertion would then fail),
      is rewritten to remove the mapping; one new mutation (deployment true) is refused. Node ids unchanged (graduated record terraform-github-plan-trusted).
  - file: tests/test_terraform_github_plan_workflow.py
    action: Modify
    purpose: >-
      The environment assertion (line 46) reads the mapping form (name and deployment is False). Node ids unchanged
      (graduated record terraform-github-plan-workflow-wiring).
bundled_recommendations: []
# rec-4913 is deliberately not bundled (a stated departure from the closure-obligation listing rule): its acceptance
# is the post-merge live proof (VP 8 and VP 9); a Resolves trailer would close it at merge, before that proof, and a
# closed rec is never reopened. It closes by update_rec after VP 9 (VP 10 reads back). rec-4914 was declined
# 2026-11-12 by the planning worker on the operator's agreement (read back: status declined); rec-4716 stays open.
followon_recs: []
infrastructure_dependencies:
  - >-
    No IAM, OIDC trust, secret, Lambda, Neon or terraform change. Three roles trust the environment:tf-trusted-plan
    sub plus an exact main job_workflow_ref and are untouched: agent-platform-github-ci-trusted-plan
    (terraform/personal/oidc_trusted_plan_role.tf; terraform-plan-trusted.yml), the trusted terraform/github plan role
    (terraform/personal/oidc_trusted_github_plan_role.tf; terraform-github-plan.yml) and github-settings-preview
    (terraform/bootstrap/github_settings_apply.tf:146-162; terraform-github-apply.yml preview). Each is proven against
    the flipped job after merge (VP 8, VP 9).
  - >-
    OPERATOR STEP A (his click, during VP 4): approve the one pending deployment-approval-probe job of the temporary
    probe workflow in the Actions UI. It is the Environment's required reviewer; no agent can approve (rec-4695).
  - >-
    The temporary probe workflow (.github/workflows/deployment-false-probe.yml) exists only on the build branch: it is
    committed, pushed, observed and deleted in the next commit BEFORE the PR opens, so it never reaches main, PR CI or
    the squash diff. No workflow in the repo triggers on push to a non-main branch (checked 2026-11-11), so the push
    runs only it.
  - >-
    terraform/github is not edited by the merged diff (only the throwaway VP 9 PR adds one comment line there and is
    closed unmerged). The merge push runs terraform-github-apply.yml (its own path is a push path): its preview plans
    terraform/github read-only; if pending drift makes it offer an apply, the apply job waits on tf-gated-apply and the
    operator REJECTS that pending deployment in the run's review dialog (his click, told in the merge-word message), so
    the run ends and frees the terraform-github-apply concurrency group (cancel-in-progress false,
    terraform-github-apply.yml:50-52); an unapproved-and-unrejected run would hold every later apply run, VP 8's
    fall-back dispatch included. An unnamed gate change ends a push run neutral.
acceptance_criteria:
  - >-
    VP 3: a job on a non-main branch naming {name: tf-trusted-plan, deployment: false} with permissions {} is refused by
    the Environment's branch policy and never runs a step, while a sibling job without an Environment runs; no
    tf-trusted-plan deployment record has the build branch as its ref and a created_at at or after the push.
  - >-
    VP 4: a job naming {name: deployment-approval-probe, deployment: false} waits for the operator's approval, then its
    OIDC token's sub is the immutable form repo:otl-labs@<owner id>/ontheloop@<repo id>:environment:deployment-approval-probe
    and the environment claim is present; no deployment-approval-probe record has the build branch as its ref and a
    created_at at or after the push.
  - >-
    All three tf-trusted-plan jobs (terraform-plan-trusted.yml plan, terraform-github-plan.yml plan,
    terraform-github-apply.yml preview) declare {name: tf-trusted-plan, deployment: false}, and
    validate_trusted_plan_environment refuses any job naming tf-trusted-plan without deployment false.
  - >-
    VP 8: the merge push's terraform-github-apply run's preview job assumes github-settings-preview under the flipped
    job, and no tf-trusted-plan record has the merge SHA as its sha. VP 9: one throwaway PR's terraform-plan-trusted and
    terraform-github-plan runs each assume their role and post their plan comment, and no tf-trusted-plan record has the
    throwaway PR's head branch as its ref and a created_at at or after its push. Raw record totals are context only.
  - >-
    rec-4913 is closed by update_rec only after VP 8 and VP 9 read green, naming the VP 3, VP 4, VP 8 and VP 9 run URLs
    and the merge SHA, and reads back closed in VP 10.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The fence refuses a tf-trusted-plan job without the mapping form and deployment false.
    command: >-
      bin/venv-python -m pytest
      tests/checks/ci_guards/test_validate_trusted_plan_environment.py::test_trusted_environment_job_requires_deployment_false -q
    expected: The node passes; it does not exist before the change.
    fix_if: Exit 4 (node missing) or a failing assertion.
    hermetic: true
    expected_literals: [passed]
    graduation: graduate
    graduation_check_id: trusted-plan-deployment-false
  - step: 2
    phase: pre-deploy
    action: >-
      Whole-file re-run of the modified fence and workflow-shape tests, plus the sibling guards that parse these
      three workflows' environment key.
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test_validate_trusted_plan_environment.py
      tests/checks/ci_guards/test_terraform_plan_trusted.py tests/checks/ci_guards/test_terraform_github_plan_trusted.py
      tests/test_terraform_github_plan_workflow.py tests/checks/ci_guards/test_validate_github_settings_apply.py
      tests/checks/ci_guards/test_validate_environment_reviewer_preflight.py
      tests/checks/ci_guards/test__trusted_plan_role_partition.py -q
    expected: All pass, including test_real_tree_is_green over the three flipped workflows.
    fix_if: A real-tree, mutation or sibling-guard failure; fix in scope, never loosen an assertion.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file pytest re-run of files this plan modifies or whose guards read them, always inside the --pre affected
      set; the durable regression is VP 1's node.
  - step: 3
    phase: pre-deploy
    action: >-
      LEG 1, before the flip and before the PR opens. Commit .github/workflows/deployment-false-probe.yml on the build
      branch: on push (branches-ignore main, paths that file only); top-level permissions {}; job ran (no environment,
      one echo); job branch-refusal (environment {name: tf-trusted-plan, deployment: false}, permissions {}, one echo,
      no secrets); job claims (VP 4). Record the push time (UTC, ISO 8601) and the build branch name, push, then read
      the run. The attributed read below replaces BRANCH and PUSH_TIME; a raw total is context only, because unrelated
      main-push preview runs still add tf-trusted-plan records until the flip merges.
    command: >-
      gh api "repos/otl-labs/ontheloop/deployments?environment=tf-trusted-plan&per_page=100"
      --jq '[.[] | select(.ref == "BRANCH" and .created_at >= "PUSH_TIME")] | length';
      echo 'gh because no mcp__github__ verb lists deployments (read-only GET proven 2026-11-11). VIA MCP: actions_list
      list_workflow_runs for deployment-false-probe.yml on the build branch, list_workflow_jobs, get_job_logs, and the
      run annotations'
    expected: >-
      ran concludes success; branch-refusal concludes failure with no step executed and an annotation that the branch is
      not allowed to deploy to tf-trusted-plan due to environment protection rules; the attributed read prints 0.
    fix_if: >-
      branch-refusal runs its step: STOP, do not flip; the main-only policy does not gate deployment: false, which
      Decision 238 cl.2 relies on and which keeps TF_GITHUB_PLAN_APP_PRIVATE_KEY off non-main refs; bring it to the
      operator. No run appears: if GitHub reports an invalid workflow file or the run fails to start (this is the repo's
      first use of the deployment key), fix the probe file's syntax and push again; otherwise the push did not trigger,
      fix the trigger. The attributed read is non-zero: record the records and STOP. The refusal annotation is not the
      branch-policy text (for example a custom deployment protection rule): STOP and report. On any STOP, cancel the
      pending claims job and delete the probe workflow in the next commit before anything else.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      LEG 2, same run. Job claims: environment {name: deployment-approval-probe, deployment: false}; permissions
      {contents: read, id-token: write}; SHA-pinned checkout with persist-credentials false; python3 -I
      scripts/ci/oidc_claims_probe.py --audience sts.amazonaws.com --require sub --require environment --require
      job_workflow_ref (allowlisted claims only). This use knowingly breaks the probe Environment's own invariant
      (never a job holding id-token, environments.tf:96-97), as the operator agreed on 2026-11-12; it is safe because
      no role trusts the environment:deployment-approval-probe sub (grep of terraform/personal and terraform/bootstrap
      sub conditions, 2026-11-11), and the gated apply's approval oracle reads approvals per run id
      (scripts/session/deployment_approval_probe.py), so this run's approval cannot be mistaken for it. Tell the
      operator it waits for his approval (OPERATOR STEP A) with the run link.
    command: >-
      gh api "repos/otl-labs/ontheloop/deployments?environment=deployment-approval-probe&per_page=100"
      --jq '[.[] | select(.ref == "BRANCH" and .created_at >= "PUSH_TIME")] | length';
      echo 'BRANCH and PUSH_TIME as in VP 3. VIA MCP: get_job_logs for the claims job'
    expected: >-
      The job waited for review and ran only after the operator approved; sub is the immutable-id form
      repo:otl-labs@<owner id>/ontheloop@<repo id>:environment:deployment-approval-probe (Decision 172; the ids are the
      ones local.github_repos in terraform/personal/oidc.tf carries), environment is deployment-approval-probe,
      job_workflow_ref names deployment-false-probe.yml at the build branch; ref and event_name recorded; no token
      text; the attributed read prints 0.
    fix_if: >-
      sub is anything other than the expected immutable environment form, or the environment claim is absent: STOP,
      do not flip (the Environment would no longer bind the identity of three roles) and bring it to the operator. It
      ran without waiting: STOP and report (reviewers do not gate deployment: false, contradicting GitHub's docs and
      affecting tf-gated-apply). The claims job is refused by the probe Environment's protected-branches policy
      (expected to admit a build branch: Decision 248 cl.9 records that tf-gated-apply, which this Environment mirrors,
      admits any branch under the ruleset-only main, rec-4651; unproven for a branch push): STOP, do not flip, and ask
      the operator whether to fall back to legs 1 and 3 only (needs his word). The attributed read is non-zero: record
      it and STOP. On any STOP, cancel the run if still pending; in every case delete the probe workflow in the next
      commit and push before anything else.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier before the commit that hands off (handoff_policy).
    command: bin/venv-python -m scripts.validate (backgrounded, 2 h) then bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Exit 0 on the committed head.
    fix_if: >-
      A failure in this scope: diagnose and fix on the branch. A failure that is an open ci_rca red outside this scope:
      timeout_disposition blocked (reported as blocked, never as ready); wait for its repair, then rerun from the start.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 6
    phase: pre-deploy
    action: Code review of the PR diff.
    command: >-
      echo 'VIA SKILL: ontheloop:code-review over the branch diff against origin/main'
    expected: PROCEED.
    fix_if: Fix findings and re-review.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      Merge readiness. Confirm no terraform-github-apply run is queued, waiting or in progress (its concurrency group
      would hold the merge push's run pending, delaying VP 8). Then ask the operator for the merge word with the VP 3
      and VP 4 evidence inline, telling him that if the merge push's preview offers an apply because of terraform/github
      drift he rejects that pending deployment in the run's review dialog (never leaves it waiting).
    command: >-
      echo 'VIA MCP: actions_list list_workflow_runs resource_id=terraform-github-apply.yml with workflow_runs_filter
      status waiting, then queued, then in_progress'
    expected: No pending terraform-github-apply run; the operator's merge word in the session.
    fix_if: A pending run exists - tell the operator and wait for it to finish or for him to reject it; never cancel it.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      LEG 3a, the merge push. Read the terraform-github-apply run the squash-merge commit triggered: the preview job's
      "Configure AWS credentials (OIDC -- github-settings-preview, state and mirror read only)" step. MERGE_SHA is the
      squash-merge commit.
    command: >-
      gh api "repos/otl-labs/ontheloop/deployments?environment=tf-trusted-plan&per_page=100"
      --jq '[.[] | select(.sha == "MERGE_SHA")] | length';
      echo 'VIA MCP: actions_list list_workflow_runs resource_id=terraform-github-apply.yml (event push, head_sha
      MERGE_SHA), list_workflow_jobs, get_job_logs for the preview job'
    expected: >-
      The preview job ran (not refused), its assume step succeeded as github-settings-preview, and the attributed read
      prints 0. The run's overall conclusion is not the proof (an unnamed gate change ends neutral; drift may offer an
      apply, which the operator rejects). A record from a pull_request_target run that started before the merge (old
      main definition) has a PR head ref and another sha and is not attributed.
    fix_if: >-
      The assume step failed, the job was refused before any step, or the attributed read is non-zero: open the
      forward-fix PR restoring the string form in terraform-github-apply.yml at once (rollback), tell the operator; leave
      rec-4913 open. "Check preview configuration" failed before the assume: the run proves nothing about OIDC; first
      confirm with the same list_workflow_runs status=waiting filter as VP 7 that no terraform-github-apply run is
      waiting (if one is, ask the operator to reject it), then dispatch the workflow on main with no inputs once and
      read that run, attributing by its head_sha.
    hermetic: false
  - step: 9
    phase: post-deploy
    action: >-
      LEG 3b, real PR-plan roles, right after merge. First confirm with the VP 7 list_workflow_runs status=waiting
      filter that no terraform-github-apply run is waiting (if one is, ask the operator to reject it before going on).
      The throwaway PR reuses the build's own harness-assigned session branch name (agents never create a branch of
      their own, git-ops.yaml branch_rule): git fetch origin main, git reset --hard origin/main on that branch, commit
      one comment line in terraform/personal/feature_flags.tf and one comment line in terraform/github/variables.tf (no
      resource change), record PUSH_TIME, push with --force-with-lease (the branch holds only already-merged history)
      carrying Decision 203 handoff evidence for that tree, open the PR, read both trusted plan runs, then close the PR
      unmerged. The repository deletes head branches on merge (delete_branch_on_merge true, read 2026-11-12), so this
      push re-creates the session branch on the remote under the same claude/ name; that is the harness branch, not a
      new one.
    command: >-
      gh api "repos/otl-labs/ontheloop/deployments?environment=tf-trusted-plan&per_page=100"
      --jq '[.[] | select(.ref == "BRANCH" and .created_at >= "PUSH_TIME")] | length';
      echo 'BRANCH is the session branch, PUSH_TIME this step. VIA MCP: actions_list list_workflow_runs for
      terraform-plan-trusted.yml and terraform-github-plan.yml on the throwaway PR, get_job_logs for each assume step,
      pull_request_read get_comments for the two plan comments'
    expected: >-
      terraform-plan-trusted's assume step succeeds as agent-platform-github-ci-trusted-plan and its plan comment posts
      with the SAVED_PLAN sentence of scripts/ci/terraform_personal_plan_report.py; terraform-github-plan's assume step
      succeeds and its names-only plan comment posts; the attributed read prints 0.
    fix_if: >-
      ASSUME_FAILED or a job refused before any step in either run: open the forward-fix PR restoring the string form in
      that workflow at once, tell the operator, leave rec-4913 open with the run URL added by update_rec; until it merges
      any terraform/personal PR gets no saved plan (recovery: blank workflow_dispatch of terraform-apply-sandbox). The
      attributed read is non-zero: the same forward-fix, then report. A non-empty plan caused by pre-existing drift is
      not a leg failure (the PR is closed unmerged, so nothing applies).
    hermetic: false
  - step: 10
    phase: post-deploy
    action: Rec closure read-back.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common import ducklake_reader_client as r;
      rows,_=r.fetch_recs_by_ids(r.make_reader(),['rec-4913','rec-4914']); print({x['id']: x['status'] for x in rows})"
    expected: rec-4913 closed (after VP 8 and VP 9 green); rec-4914 declined.
    fix_if: rec-4913 still open after a green VP 8 and VP 9 - redo the update_rec close and read back again.
    hermetic: false
test_obligations:
  - source: scripts/checks/ci_guards/validate_trusted_plan_environment.py
    behavior: A job naming tf-trusted-plan without the mapping form and deployment false is refused (predicate (l)).
    verification_step: 1
    test_selector: tests/checks/ci_guards/test_validate_trusted_plan_environment.py::test_trusted_environment_job_requires_deployment_false
    red_green_expectation: red before (node absent), green after.
  - source: .github/workflows/terraform-plan-trusted.yml
    behavior: "The plan job declares {name: tf-trusted-plan, deployment: false}; deployment true is refused by the shape pin."
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_terraform_plan_trusted.py
    red_green_expectation: red before (the pin reads the mapping form the old string fails), green after.
  - source: .github/workflows/terraform-github-plan.yml
    behavior: "The plan job declares {name: tf-trusted-plan, deployment: false}; deployment true is refused by the job pin."
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_terraform_github_plan_trusted.py
    red_green_expectation: red before (the pin reads the mapping form the old string fails), green after.
  - source: .github/workflows/terraform-github-apply.yml
    behavior: "The preview job declares {name: tf-trusted-plan, deployment: false}."
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_validate_trusted_plan_environment.py::test_real_tree_is_green
    red_green_expectation: red with predicate (l) over the unflipped preview, green after the flip.
# The build adds planned-change weakening_dispositions entries for the three rewritten environment pins, the
# test_real_tree_is_green count (11 to 12) and the PASS-line string change in test_pass_line_ignores_unrelated_earlier_failures
# (cite acceptance_criteria[2]) with the exact candidate strings validate_weakening_candidates reports (implementing-plan
# bookkeeping); every edit is a tightening and no assertion is loosened (Decision 235).
constraints:
  - No role trust, IAM, secret, Lambda, Neon or terraform change. No Decision text edit (Decisions 238 cl.2, 246 and 248 stand as written).
  - The flip lands only after VP 3 and VP 4 pass; a surprise in either stops the flip and goes to the operator.
  - >-
    The temporary .github/workflows/deployment-false-probe.yml is a sanctioned out-of-scope write: it is not a scope row
    because it never reaches a PR head, the squash diff or main; it is deleted in the commit after VP 4 and before the PR
    opens, so validate_scope_boundary sees a clean net diff.
  - No agent approves a deployment, creates, edits or deletes a GitHub Environment, or approves a terraform-github-apply apply job.
  - Never print an OIDC token or Authorization header; the claims probe prints allowlisted claims only (Decision 101).
  - AWS calls use PlatformDev (--profile agent_platform).
  - "The merge needs the operator's word: the three workflows are CODEOWNERS paths (rec-2827, Decision 246 cl.4)."
  - >-
    The coordinator holds other terraform/personal and terraform/github PRs from the merge until VP 8 and VP 9 read
    green (ruling 2026-11-05); open VP 9's PR as soon as its push is allowed (Decision 203 needs a fresh full tier on
    the post-merge tree, about 30 to 40 min).
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout verdict: FLAGS_FOUND (Decisions triaged: 205 of 205; Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2). CITE: Decision 238, 248, 246, 94, 226, 244. Report /mnt/project-files/environment-tidy/SCOUT-REPORT.md."
