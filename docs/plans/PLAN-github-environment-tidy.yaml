gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
  - {gate: plan-critique, round: 1, verdict: REVISE, blocking: 3, nits: 8}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decisions 238 (cl.2), 246 (approval-bypass condition) and 248 (cl.4, cl.8, cl.9) read
  - All files in scope located and readable
  - The operator is available for OPERATOR STEP A within the session
execution_steps:
  - >-
    Probe legs (pre-condition: on the harness branch, origin/main fetched, the operator reachable for OPERATOR STEP A).
    Write the temporary probe workflow, commit, push (push 1, carrying Decision 203 handoff evidence for that exact
    tree; a red validate on it, the fence flagging the temporary file under predicate (a), passes the gate with a
    warning); run VP 3 and VP 4; delete the probe workflow in the next commit and push (push 2, its own evidence).
    Post-condition: both legs green and the probe file absent from the branch tip; on any STOP, the probe file is
    deleted first and the operator told.
  - >-
    Scope edits (pre-condition: step 1's post-condition). Make the three workflow flips, predicate (l) with its coupled
    literals, and the four test edits; commit; run VP 1, VP 2 and the fast tier (bin/venv-python -m scripts.validate
    --pre). Post-condition: VP 1 and VP 2 green.
  - >-
    Closure, each fact reported separately and in order (implement skill Commit Flows; docs/contracts/git-ops.yaml):
    (a) readiness: bin/venv-python -m scripts.session.github_readiness (an unknown result is never PASS); (b) set
    implementation_declared true, add the planned-change weakening_dispositions entries, commit, git fetch origin main
    and git rebase origin/main (STOP on conflict); (c) VP 5 on the committed, rebased, clean tree (a timeout or an open
    red outside scope is reported as blocked, never as ready); (d) a scratchpad JSON holding exactly the
    scripts.session.postflight_evidence.CATEGORIES keys, then bin/venv-python -m scripts.session.postflight --evidence
    <that file>; (e) VP 6, the code-review verdict; (f) push 3 (the PR head) with its own handoff evidence, the PR URL
    and the CI outcome (no Resolves trailer).
  - >-
    Merge (pre-condition: CI green, code review PROCEED). VP 7, then the operator's merge word; run bin/venv-python -m
    scripts.session.merge_step premerge for this slug; squash-merge with an explicit commit message carrying no
    Resolves trailer; report the merge SHA.
  - >-
    Post-merge proof. Run VP 8 on the merge push's run and VP 9 (push 4, the throwaway PR head, with its own handoff
    evidence) as soon as its push is allowed. On both green, close rec-4913 with update_rec (status closed, resolution
    naming the VP 3, VP 4, VP 8 and VP 9 run URLs and the merge SHA, profile agent_platform; the acceptance-verdict
    route of scripts.rec_trailer_acceptance where its API allows it, else a verdict-less close reported as such,
    Decision 201 cl.2); then VP 10. Tell the coordinator the terraform PR hold can lift.
  - 'Report: what was implemented, each VP result with its run URL, the merge SHA and the rec read-back'
rollback: >-
  If VP 8 or VP 9 fails, a forward-fix PR restores environment: tf-trusted-plan as a string in the failing workflow(s)
  and narrows predicate (l) to the still-flipped files (or drops it if none stay flipped), never a whole-PR revert
  (Decision 226 cl.4). Narrowing (l) loosens a check (Decision 235), so that forward-fix rides on the operator's word,
  which its CODEOWNERS paths already require. The roles and the Environment are unchanged, so the old behaviour returns
  on the next run.
