schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "github-environment-tidy"
intent: >-
  Stop speculative Terraform plans creating GitHub deployment records by running the tf-trusted-plan job with
  deployment: false, adopted only after live proof that the Environment still binds the OIDC subject and still refuses a
  non-main ref (rec-4913), and retire the inert deployment-approval-probe Environment, workflow, script and tests now that
  rec-4695 is closed (rec-4914, superseding rec-4716), so the Deployments panel shows only real approvals and releases.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-github-environment-tidy.yaml
phase: >-
  ad_hoc_rec (rec-4913 Medium, rec-4914 Low; soft-warn category, no tier_item claimed, so the Tier Item Freshness Gate
  is skipped). closes_criteria empty: neither rec is a roadmap exit criterion (precedent PLAN-deployment-approval-probe).
scope:
  - file: .github/workflows/terraform-plan-trusted.yml
    action: Modify
    purpose: >-
      The plan job's environment becomes the mapping {name: tf-trusted-plan, deployment: false}; one header sentence
      says the job creates no deployment record and names this plan's live proof (VP 5 and 6) of the branch policy and the
      OIDC subject under deployment: false.
  - file: scripts/checks/ci_guards/validate_trusted_plan_environment.py
    action: Modify
    purpose: >-
      Predicate (a) also requires every job naming tf-trusted-plan to use the mapping form with deployment the YAML
      boolean false (is False; a quoted "false" is refused), and the module docstring's predicate (a) line names the
      rule, so
      terraform-github-plan.yml inherits it when rec-4638 moves onto the Environment. The violation text names it as
      Deployments-panel hygiene, not the trust boundary (Fable F3). Headroom 68 SLOC; the change is a few lines.
    new_imports: []
  - file: tests/checks/ci_guards/test_validate_trusted_plan_environment.py
    action: Modify
    purpose: >-
      Red cases in test_trusted_environment_job_requires_deployment_false: a trusted job naming the Environment as a bare
      string, with deployment true, with the quoted string "false", and with the key absent. test_real_tree_is_green keeps its id (graduated record
      trusted-plan-environment-fence pins it, Decision 244) and now runs over the flipped workflow.
  - file: tests/checks/ci_guards/test_terraform_plan_trusted.py
    action: Modify
    purpose: >-
      The workflow shape pin reads the mapping form (environment name tf-trusted-plan and deployment false); one new
      mutation (deployment true) must be refused. The file stays green (graduated record trusted-plan-cutover-workflow
      re-runs it).
  - file: terraform/github/environments.tf
    action: Modify
    purpose: >-
      Remove github_repository_environment.deployment_approval_probe and put a short retirement comment in its place:
      Decision 239's approval-bypass condition (kind manual) is re-observed by restoring the probe's own workflow,
      script and tests as of commit 40e02457 (#1709), re-adding its resource and import block, and re-creating the
      Environment in Settings after any change to the Claude GitHub App's
      permissions, repo ownership or admins, the reviewer set, or a new GitHub credential surface for agents (the
      workflow header's full trigger list). The tf_trusted_plan comment records that its jobs run with deployment: false
      and that the main-only policy still refused a branch ref under it (VP 5 run URL).
      The comment names the Environment by its hyphenated name only: rec-4914's acceptance greps the file for the
      resource name deployment_approval_probe.
  - file: terraform/github/imports.tf
    action: Modify
    purpose: Remove the deployment_approval_probe import block (an import block without a resource is a config error).
  - file: terraform/github/CLAUDE.md
    action: Modify
    purpose: >-
      Delete the probe row (the file is at its prose cap, 5214 of 5214 B, so the retirement note lives in
      environments.tf, which agents read for this root; the prose ratchet entry is lowered to the new measured size).
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Lower the terraform/github/CLAUDE.md entry to its new measured byte size (ratchet-down, sanctioned by
      implement-scope-boundary.yaml's prose_budgets_ratchet_down row).
  - file: .github/workflows/deployment-approval-probe.yml
    action: Delete
    purpose: Inert rec-4695 probe workflow, retired.
  - file: scripts/session/deployment_approval_probe.py
    action: Delete
    purpose: rec-4695 probe script, retired (rec-4716's hardening is superseded).
  - file: tests/test_session_deployment_approval_probe.py
    action: Delete
    purpose: Tests of the deleted script.
  - file: tests/test_deployment_approval_probe_workflow.py
    action: Delete
    purpose: Tests of the deleted workflow and Terraform block.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: Remove the deployment-approval-probe workflows row (validate_ci_rca_taxonomy maps workflow names).
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: Remove the two deployment-approval-probe.yml r3_workflows baseline entries.
# rec-4716 is deliberately not bundled: it is superseded (update_rec at merge), never closed by the Resolves trailer.
# rec-4913 is deliberately not bundled (a stated departure from the closure-obligation listing rule): its acceptance
# condition is VP 10's post-merge live proof, the trailer would close it at merge before that proof, and a closed rec is
# never reopened; validate_merge_step requires trailer == bundled. It closes by update_rec after VP 10 (VP 11 reads back).
bundled_recommendations: [rec-4914]
followon_recs: []
infrastructure_dependencies:
  - >-
    No IAM, OIDC trust, secret, Lambda or Neon change. agent-platform-github-ci-trusted-plan's trust
    (terraform/personal/oidc_trusted_plan_role.tf) is untouched; the flip is proven against it in VP 10.
  - >-
    OPERATOR STEP A (his click, during VP 6): approve the one pending deployment-approval-probe job of the temporary probe
    workflow in the Actions UI. It is the Environment's required reviewer; no agent can approve (rec-4695).
  - >-
    OPERATOR STEP B (admin mutation, needs his own words naming it; after VP 6, before the PR opens): delete the
    deployment-approval-probe Environment in Settings, Environments. Inferred, not verified: this also deletes its 6
    deployment records (the red X); the check that proves it is gh api
    "repos/otl-labs/ontheloop/deployments?environment=deployment-approval-probe&per_page=100" --jq length returning 0. Deleting first makes the PR-time terraform-github-plan refresh drop the object, so the PR plan shows no
    destroy (precedent: PLAN-deployment-approval-probe rollback note); the operator's next routine terraform/github
    apply then has nothing to do for it. If he prefers, the alternative is to leave the Environment and destroy it by
    his hand apply after merge; the PR-time plan then goes red with TF_GITHUB_PLAN_DESTRUCTIVE on exactly that one
    destroy (expected, advisory).
  - >-
    The temporary probe workflow (.github/workflows/deployment-false-probe.yml) exists only on the build branch: it is
    committed, pushed, observed and deleted in the next commit BEFORE the PR opens, so it never reaches main, PR CI or
    the squash diff. No workflow in the repo triggers on push to non-main branches, so the push runs only it.
  - >-
    terraform/github is operator-applied only (Decision 126 admin tier). No agent runs terraform there; VP 4 is
    provider-free fmt only (Decision 119), and the PR-time terraform-github-plan job is the root's authoritative plan.
acceptance_criteria:
  - >-
    VP 5: a job on a non-main branch naming {name: tf-trusted-plan, deployment: false} with permissions {} is refused by
    the Environment's branch policy and never runs a step, while a sibling job without an Environment runs; the
    tf-trusted-plan deployment count is unchanged.
  - >-
    VP 6: a job naming {name: deployment-approval-probe, deployment: false} waits for the operator's approval, then its
    OIDC token's sub is repo:<repo>:environment:deployment-approval-probe and the environment claim is present; the
    environment's deployment count is unchanged.
  - >-
    The plan job of terraform-plan-trusted.yml declares environment {name: tf-trusted-plan, deployment: false}, and
    validate_trusted_plan_environment refuses any job naming tf-trusted-plan without deployment false.
  - >-
    VP 10: after merge, a throwaway terraform/personal PR's trusted plan assumes agent-platform-github-ci-trusted-plan,
    posts its plan comment with saved plan yes, and the tf-trusted-plan deployment count does not grow.
  - >-
    The probe workflow, script and both test files are gone, terraform/github no longer declares or imports the probe
    Environment, the Environment is deleted (read back by VP 7: the refreshed PR-time plan shows no destroy, since the
    proxy blocks environment reads), and no live reference to them remains outside historical plans, audit
    prompts, the append-only github-org-transfer.yaml evidence log and the environments.tf retirement comment.
  - >-
    rec-4914 (the only bundled rec) is closed by the merge's Resolves trailer; rec-4716 is superseded by update_rec at
    merge; rec-4913 (unbundled, see the bundled_recommendations note) is closed by update_rec only after VP 10 reads green, naming the VP 10 run URL and the merge SHA; all three read back
    in VP 11.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The fence refuses a tf-trusted-plan job without deployment false.
    command: >-
      bin/venv-python -m pytest
      tests/checks/ci_guards/test_validate_trusted_plan_environment.py::test_trusted_environment_job_requires_deployment_false -q
    expected: The node passes; it does not exist before the change.
    fix_if: Exit 4 (node missing) or a failing assertion.
    hermetic: true
    expected_literals: [passed]
    graduation: graduate
    graduation_check_id: trusted-plan-deployment-false
  - step: 2
    phase: pre-deploy
    action: Whole-file re-run of the modified fence and workflow-shape tests, plus the import-block and taxonomy checks.
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test_validate_trusted_plan_environment.py
      tests/checks/ci_guards/test_terraform_plan_trusted.py tests/checks/iam_tf/test_terraform_github_import_blocks.py
      tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py
      tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py tests/checks/prose/test_prose_limits.py -q
    expected: All pass, including test_real_tree_is_green over the flipped workflow.
    fix_if: A real-tree, mutation, import-parity, taxonomy, baseline or prose-budget failure.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file pytest re-run of files this plan modifies, always inside the --pre affected set; the durable
      regression is VP 1's node.
  - step: 3
    phase: pre-deploy
    action: Stale-reference sweep for the retired surface (closure obligation, surface-retiring plan).
    command: >-
      test ! -e .github/workflows/deployment-approval-probe.yml && test ! -e scripts/session/deployment_approval_probe.py
      && test ! -e tests/test_session_deployment_approval_probe.py && test ! -e tests/test_deployment_approval_probe_workflow.py
      && ! git grep -n -e deployment_approval_probe -e deployment-approval-probe -- . ':!docs/plans/' ':!docs/audit-prompts/'
      ':!docs/contracts/github-org-transfer.yaml' ':!terraform/github/environments.tf' && echo SWEEP_CLEAN
    expected: Prints the clean marker.
    fix_if: Any file still exists or git grep names a live reference; remove or rewire it.
    hermetic: true
    expected_literals: [SWEEP_CLEAN]
    graduation: waive
    graduation_waiver_reason: >-
      Re-creating the probe from git history is the sanctioned way to observe Decision 239's approval-bypass condition,
      so absence is not a standing rule.
  - step: 4
    phase: pre-deploy
    action: Provider-free format check of the edited root (Decision 119; no local init or plan).
    command: terraform fmt -check -diff terraform/github
    expected: Exit 0, no diff.
    fix_if: Any formatting diff.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Already enforced by the required terraform-validate job; green by construction before the change.
  - step: 5
    phase: pre-deploy
    action: >-
      LEG 1, before the flip and before the PR opens. Commit .github/workflows/deployment-false-probe.yml on the build
      branch: on push (branches-ignore main, paths that file only); top-level permissions {}; job ran (no environment,
      echo); job branch-refusal (environment {name: tf-trusted-plan, deployment: false}, permissions {}, one echo); job
      claims (VP 6). Record the tf-trusted-plan deployment count, push, then read the run.
    command: >-
      gh api "repos/otl-labs/ontheloop/deployments?environment=tf-trusted-plan&per_page=100" --jq length;
      echo 'RUN BEFORE AND AFTER THE PUSH (gh because no mcp__github__ verb lists deployments; read-only GET proven
      2026-11-05). VIA MCP: actions_list list_workflow_runs for deployment-false-probe.yml on the build branch,
      list_workflow_jobs, get_job_logs, and the run annotations'
    expected: >-
      ran concludes success; branch-refusal concludes failure with no step executed and an annotation that the branch is
      not allowed to deploy to tf-trusted-plan due to environment protection rules; the deployment count is unchanged.
    fix_if: >-
      branch-refusal runs its step: STOP, do not flip; the main-only policy does not gate deployment: false, which
      Decision 238 cl.2 relies on; bring it to the operator (the role's job_workflow_ref binding still refuses such a
      job). ran did not run: the push did not trigger, fix the trigger. The count grew: record it and STOP (a refused
      job leaving a record defeats the goal). The refusal annotation is not the branch-policy text (for example a custom
      deployment protection rule): STOP and report. On any STOP, cancel the pending claims job and delete the probe workflow
      in the next commit before anything else.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      LEG 2, same run. Job claims: environment {name: deployment-approval-probe, deployment: false}; permissions
      {contents: read, id-token: write}; SHA-pinned checkout with persist-credentials false; python3 -I
      scripts/ci/oidc_claims_probe.py --audience sts.amazonaws.com --require sub --require environment --require
      job_workflow_ref. Tell the operator it waits for his approval (OPERATOR STEP A) with the run link.
    command: >-
      gh api "repos/otl-labs/ontheloop/deployments?environment=deployment-approval-probe&per_page=100" --jq length;
      echo 'RUN BEFORE AND AFTER (gh as in VP 5). VIA MCP: get_job_logs for the claims job'
    expected: >-
      The job waited for review and ran only after the operator approved; sub is the immutable-id form
      repo:otl-labs@<owner id>/ontheloop@<repo id>:environment:deployment-approval-probe (Decision 172; the ids are
      the ones local.github_repos in terraform/personal/oidc.tf carries, not a fallback), environment is deployment-approval-probe, job_workflow_ref
      names deployment-false-probe.yml at the build branch; ref and event_name recorded; no token text; the count is unchanged.
    fix_if: >-
      sub is anything other than the expected immutable environment form (a ref form, or the plain
      repo:otl-labs/ontheloop:environment:... form that local.github_repos would not trust), or the environment claim is
      absent: STOP, do not flip (the Environment would no
      longer bind the identity) and bring it to the operator. It ran without waiting: STOP and report (reviewers do not
      gate deployment: false, contradicting GitHub's docs and affecting tf-gated-apply). The claims job is refused by
      deployment-approval-probe's "protected branches only" policy (expected to admit every branch under the ruleset-only
      main, rec-4651's live Settings evidence, but unproven for a branch push): STOP, do not flip, and ask the operator
      whether to fall back to legs 1 and 3 only (fork 1's alternative needs his word). On any STOP, cancel the run if
      still pending; in every case delete the probe workflow in the next commit and push before anything else.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      After VP 5 and 6 pass and the probe workflow is deleted, OPERATOR STEP B (his words naming it). Then open the PR and
      read its terraform-github-plan report.
    command: >-
      echo 'VIA MCP: mcp__github__pull_request_read get_comments on the PR; read the terraform-github-plan report and job
      conclusion (no shell command reads a PR comment under the mcp-over-gh rule)'
    expected: >-
      No destroy and no change on any github_repository_environment; any other change is only the known
      visibility-gated main_protection bypass_actors diff named on the VISIBILITY line.
    fix_if: >-
      A destroy of deployment_approval_probe: the Environment was not deleted first; ask the operator to delete it or
      accept the destroy on his hand apply. Any other destroy or change: STOP and RCA.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Full tier before the commit that hands off (handoff_policy).
    command: bin/venv-python -m scripts.validate (backgrounded, 2 h) then bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Exit 0 on the committed head.
    fix_if: >-
      A failure in this scope: diagnose and fix on the branch. A failure that is one of the open ci_rca reds (rec-4872,
      rec-4890, rec-4899 or a later one): timeout_disposition blocked; wait for its repair, then rerun from the start.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 9
    phase: pre-deploy
    action: Code review of the PR diff.
    command: >-
      echo 'VIA SKILL: ontheloop:code-review over the branch diff against origin/main'
    expected: PROCEED.
    fix_if: Fix findings and re-review.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      LEG 3, real role, right after merge. Record the tf-trusted-plan count; open a throwaway PR adding one comment line
      to terraform/personal/feature_flags.tf (not an IAM file, no resource change; its push carries Decision 203
      handoff evidence for that tree); read the trusted plan run; close the PR unmerged and delete its branch.
    command: >-
      gh api "repos/otl-labs/ontheloop/deployments?environment=tf-trusted-plan&per_page=100" --jq length;
      echo 'RUN BEFORE AND AFTER (gh as in VP 5). VIA MCP: actions_list list_workflow_runs for terraform-plan-trusted.yml
      on the throwaway PR, get_job_logs for the assume step, pull_request_read get_comments for the plan comment'
    expected: >-
      The assume step succeeds as agent-platform-github-ci-trusted-plan; the plan comment posts with category OK, no
      changes and the SAVED_PLAN sentence of scripts/ci/terraform_personal_plan_report.py ("This saved plan is applied
      at merge (apply-the-saved-plan path); a stale plan fails closed at merge."); the count is unchanged.
    fix_if: >-
      ASSUME_FAILED: open the forward-fix PR restoring the string form at once (rollback note), tell the operator, and
      leave rec-4913 open (it was never closed) with the run URL added by update_rec; until the forward-fix merges any
      terraform/personal PR gets no saved plan (recovery: blank workflow_dispatch of terraform-apply-sandbox). The count
      grew: the same forward-fix, then report. The job fails before any step runs (not ASSUME_FAILED; for example a
      custom deployment protection rule): the same forward-fix, then report.
    hermetic: false
  - step: 11
    phase: post-deploy
    action: Rec closure read-back.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common import ducklake_reader_client as r;
      rows,_=r.fetch_recs_by_ids(r.make_reader(),['rec-4913','rec-4914','rec-4716']); print({x['id']: x['status'] for x in rows})"
    expected: rec-4913 closed (after VP 10 green), rec-4914 closed, rec-4716 superseded.
    fix_if: >-
      rec-4914 still open: the trailer job did not run; close it with update_rec naming the merge SHA. rec-4716 not
      superseded or rec-4913 not closed after a green VP 10: write it with update_rec under --profile agent_platform.
    hermetic: false
test_obligations:
  - source: scripts/checks/ci_guards/validate_trusted_plan_environment.py
    behavior: A job naming tf-trusted-plan without the mapping form and deployment false is refused.
    verification_step: 1
    test_selector: tests/checks/ci_guards/test_validate_trusted_plan_environment.py::test_trusted_environment_job_requires_deployment_false
    red_green_expectation: red before (node absent), green after.
  - source: .github/workflows/terraform-plan-trusted.yml
    behavior: "The plan job declares {name: tf-trusted-plan, deployment: false}; deployment true is refused by the shape pin."
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_terraform_plan_trusted.py
    red_green_expectation: red before (the pin reads the mapping form the old string fails), green after.
  - source: terraform/github/environments.tf
    behavior: The probe resource is gone and every remaining managed resource keeps its import block.
    verification_step: 2
    test_selector: tests/checks/iam_tf/test_terraform_github_import_blocks.py
    red_green_expectation: red if the resource or its import is removed alone, green with both removed.
  - source: terraform/github/imports.tf
    behavior: Import blocks match managed resources one to one.
    verification_step: 2
    test_selector: tests/checks/iam_tf/test_terraform_github_import_blocks.py
    red_green_expectation: red if the import block outlives its resource, green after.
  - source: config/ci_rca_taxonomy.yaml
    behavior: The workflows map covers exactly the live workflows.
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py
    waiver_reason: Removing a row for a deleted workflow changes no behaviour the existing coverage test does not already guard.
  - source: config/prose_budgets.yaml
    behavior: The terraform/github/CLAUDE.md entry equals the file's measured byte size (ratchet-down).
    verification_step: 2
    test_selector: tests/checks/prose/test_prose_limits.py
    waiver_reason: Lowering an entry to the measured size is data the existing validate_prose_limits check already reads; it fails current<budget and current>budget alike.
  - source: config/composite_action_body_baseline.yaml
    behavior: Baseline entries name live workflow steps only.
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py
    waiver_reason: Removing entries for a deleted workflow is data cleanup the existing baseline test already reads.
constraints:
  - No role trust, IAM, secret, Lambda or Neon change. No Decision text edit (Decision 238 cl.2 and Decision 239 stand as written).
  - The flip lands only after VP 5 and VP 6 pass; a surprise in either stops the flip and goes to the operator.
  - >-
    The temporary .github/workflows/deployment-false-probe.yml is a sanctioned out-of-scope write: it is not a scope row
    because it never reaches a PR head, the squash diff or main; it is deleted in the commit after VP 6 and before the PR
    opens, so validate_scope_boundary sees a clean net diff.
  - No agent approves a deployment, creates, edits or deletes a GitHub Environment, or applies terraform/github.
    OPERATOR STEP B needs his own words naming it; OPERATOR STEP A is his click.
  - Never print an OIDC token or Authorization header; the claims probe prints allowlisted claims only (Decision 101).
  - AWS calls use PlatformDev (--profile agent_platform), never the ADMIN environment's inherited profile.
  - "The merge needs the operator's word (always-ask list: security-adjacent workflow change plus an operator Settings step)."
  - Leg 3 is ready to open the moment the flip merges; the coordinator holds other terraform/personal PRs until VP 10 reads green.
  - >-
    No terraform/github apply runs between OPERATOR STEP B and the merge: main's config still declares the probe, so an
    apply would re-create it (VP 7 would then show a destroy).
  - No rescue agents or workaround loops (Decision 55).
