rollback: >-
  If VP 10 fails, a forward-fix PR restores environment: tf-trusted-plan as a string and the old predicate (a), never a
  whole-PR revert (it would re-add the probe resource and import for a deleted Environment; Decision 226 spirit); the
  role and the Environment are unchanged, so the old behaviour returns on the next PR. The probe retirement is reversible from git history (commit 40e02457) plus a
  Settings re-creation of the Environment.
