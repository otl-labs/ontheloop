schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "github-full-retirement"
intent: >-
  Retire the repo-declared github-full stdio MCP server -- a duplicate of the harness github server
  whose 36 extra tools have no codified use -- with its binary installer, its every-session self-heal
  hook and its setup-script token documentation, so direct web sessions stop loading ~2.3k tokens of
  duplicate GitHub tool surface. Pure retirement: the readiness probe (rec-3626) and the
  handoff-evidence gate widening are separate follow-on plans.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-github-full-retirement.yaml
implementation_declared: true
phase: >-
  ad_hoc_rec soft-warn exception category (rec-2982); no tier_item criterion claimed. Adjacent: T3.14
  (context-budget metric, deferred_post_mvp) -- not advanced. First of three stacked plans (Plan A);
  sequenced after PLAN-startup-context-tool-denies (implementation merged #1707; see constraints).
scope:
  - file: .mcp.json
    action: Modify
    purpose: Remove the github-full server entry; ducklake-reads stays byte-identical.
  - file: .claude/settings.json
    action: Modify
    purpose: >-
      Remove the "mcp__github-full" allow entry and the SessionStart command for
      session_start_ensure_github_mcp.sh; every other key byte-identical, including the
      handoff-gate PreToolUse matcher (Plan C rewrites it).
  - file: .claude/hooks/hooks.json
    action: Modify
    purpose: Regenerate the plugin's gated hooks render from the edited settings (plugin_hooks.py render).
  - file: .claude/hooks/session_start_ensure_github_mcp.sh
    action: Delete
    purpose: The every-session github-mcp-server self-heal hook has no server left to serve.
  - file: bin/ensure-github-mcp-server.sh
    action: Delete
    purpose: The binary installer's only callers are the deleted hook and setup step 6.
  - file: bin/setup-cloud-env.sh
    action: Modify
    purpose: >-
      Remove the GITHUB MCP comment block (the gh-mcp token instructions), the responsibility-split
      line for the ensure hook, step 6 (description and code) and every remaining github-mcp-server
      and gh-mcp mention, and reword the Codex-parity comment "The dependency and GitHub MCP
      SessionStart scripts delegate" to name the dependency script only; renumber the later step;
      keep the session_start_github_readiness.sh invocation.
  - file: bin/sync-deps.sh
    action: Modify
    purpose: Comment only -- drop the "mirrors bin/ensure-github-mcp-server.sh" clause.
  - file: .claude/hooks/session_start_precommit.sh
    action: Modify
    purpose: Comment only -- point the self-heal-pattern reference at session_start_sync_deps.sh.
  - file: .claude/hooks/session_start_sync_deps.sh
    action: Modify
    purpose: Comment only -- drop the "Mirrors session_start_ensure_github_mcp.sh" reference.
  - file: .claude/hooks/session_start_deepen_history.sh
    action: Modify
    purpose: Comment only -- the SessionStart block now holds seven hooks, not eight.
  - file: tests/test_setup_cloud_env.py
    action: Modify
    purpose: >-
      Drop the ensure-github-mcp-server ordering and count assertions and
      test_github_mcp_token_comment_writes_the_proxy_placeholder; add
      test_github_mcp_server_is_neither_installed_nor_declared (setup-cloud-env.sh has no ensure call
      and no gh-mcp block, its "<PAT>" / GITHUB_MCP_PAT absence assertions carried forward, AND
      .mcp.json parsed as JSON declares no github-full key and no server whose command or args run
      github-mcp-server); readiness-before-precommit ordering kept, without the ensure anchor.
  - file: tests/test_session_start_github_readiness_hook.py
    action: Modify
    purpose: >-
      Replace the ordering assertion against the deleted ensure hook with registration of the
      readiness hook and absence of the ensure hook.
  - file: config/agent/verification_registry/entries/setup-cloud-env-mcp-token-placeholder.yaml
    action: Delete
    purpose: >-
      Retire the graduated check by git mv (Decision 176 cl.5): its claim (the placeholder comment
      exists) stops holding, and check_id is immutable (docs/contracts/verification-registry.yaml).
  - file: config/agent/verification_registry/entries/deprecated/setup-cloud-env-mcp-token-placeholder.yaml
    action: Create
    purpose: The git mv destination -- a 100% rename, content untouched.
  - file: docs/contracts/github-org-transfer.yaml
    action: Modify
    purpose: >-
      procedure.pre_stage step 7: "one github-full read" becomes "one authenticated read"; one dated
      amendment_log entry (change_class correction) as one flow-style line whose summary avoids the
      retired literals. The file is at 499 of its 500 effective-line limit: the step 7 edit is in
      place and the entry adds one line (500 passes; no raise, no compaction of history rows).
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Rename the github-mcp-config topic to mcp-config (no reader keys on the old name; checked
      2026-10-30), describe .mcp.json as the repo MCP server config (ducklake-reads named verbs), and
      add one dated amendment_log entry as one flow-style line (Class D; 497 of 500 effective lines).
bundled_recommendations:
  - rec-2982
followon_recs:
  - rec-3626
  - rec-4775
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    .mcp.json declares no github-full server (ducklake-reads unchanged) and bin/setup-cloud-env.sh no
    longer references the gh-mcp token -- rec-2982's acceptance command passes verbatim.
  - >-
    No tracked file references the retired surface (github-full, github-mcp-server, gh-mcp, the
    ensure script or hook) outside docs/plans, docs/audit-prompts, audits, tests and the three files
    owned elsewhere: scripts/session/github_readiness.py (Plan B, rec-3626),
    .claude/hooks/handoff_evidence_gate.py (Plan C), scripts/session/deployment_approval_probe.py
    (constraint) and step 1's graduated shard
    config/agent/verification_registry/entries/github-mcp-server-neither-installed-nor-declared.yaml
    (verbatim graduation identifiers); the ensure hook and installer are deleted with no caller left.
  - >-
    The retired setup-cloud-env-mcp-token-placeholder check sits in entries/deprecated/ unchanged, and
    tests/test_setup_cloud_env.py::test_github_mcp_server_is_neither_installed_nor_declared is
    graduated under a new check_id.
  - The plugin's .claude/hooks/hooks.json is the render of the edited settings.
  - >-
    github-org-transfer.yaml pre_stage step 7 reads "one authenticated read" and file-router.yaml's
    .mcp.json topic is mcp-config, each with a dated amendment_log entry; their evaluators pass
    (wording review-verified in code review).
  - >-
    In a fresh direct web session on main after merge, the deferred-tool index holds no
    mcp__github-full__ names (and does hold mcp__github__ names), and no ensure-hook line prints at
    session start.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The new setup guard: neither setup-cloud-env.sh nor .mcp.json installs or declares the
      github-mcp-server. The node does not exist today, so the red-before replay classifies
      target_absent.
    command: bin/venv-python -m pytest tests/test_setup_cloud_env.py::test_github_mcp_server_is_neither_installed_nor_declared -q
    expected: exit 0, one test passed; before the change the node is not found.
    fix_if: A half fails -- finish the removal in that file; never narrow the assertion.
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: github-mcp-server-neither-installed-nor-declared
  - step: 2
    phase: pre-deploy
    action: Run rec-2982's acceptance command verbatim.
    command: 'test "$(grep -c github-full .mcp.json)" -eq 0 && test "$(grep -c gh-mcp bin/setup-cloud-env.sh)" -eq 0'
    expected: exit 0. Today it exits 1 (both literals present).
    fix_if: A literal remains -- finish the removal in that file; never edit the rec's acceptance again.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      rec-2982's oracle, probed at merge by ci.yml's trailer-acceptance-evaluate job; the standing
      guard against reintroduction is step 1's graduated node, which asserts both files.
  - step: 3
    phase: pre-deploy
    action: >-
      The setup and readiness-hook test files the plan modifies, whole -- the set the
      github-session-readiness-capabilities shard runs, plus the retired shard's former file.
    command: bin/venv-python -m pytest tests/test_setup_cloud_env.py tests/test_session_start_github_readiness_hook.py tests/test_session_github_readiness.py -q
    expected: exit 0, no failures.
    fix_if: A failure in scope is fixed in the source; never relax an assertion.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the standing github-session-readiness-capabilities registry shard, which runs exactly
      these three files.
  - step: 4
    phase: pre-deploy
    action: The committed plugin hooks file is the render of the edited settings.
    command: bin/venv-python -m pytest tests/hooks/test_plugin_hooks.py::test_the_committed_hooks_file_is_the_render_of_the_settings -q
    expected: exit 0, one test passed, before and after the change.
    fix_if: Fails -- regenerate with bin/venv-python .claude/hooks/plugin_hooks.py render and commit it.
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Green before and after by design (no-regression probe) and re-runs an existing standing test in
      tests/hooks/test_plugin_hooks.py.
  - step: 5
    phase: pre-deploy
    action: >-
      Stale-reference sweep for the retired surface (closure obligation). At planning time it lists
      exactly the ten non-test scope files that carry a literal. Excluded: tests/ (absence assertions
      and historical telemetry vectors), the three files owned elsewhere (see constraints), and step
      1's new graduated registry shard, whose check_id and plan_slug lines match the regex verbatim
      by construction (Decision 176 path = check_id; Decision 132 plan_slug match) -- the shard is
      itself the reintroduction guard (amended 2026-10-30, see constraints).
    command: "! git grep -nIE 'github-full|github-mcp-server|gh-mcp|ensure-github-mcp|ensure_github_mcp|GitHub MCP SessionStart' -- . ':!docs/plans' ':!docs/audit-prompts' ':!audits' ':!tests' ':!scripts/session/github_readiness.py' ':!.claude/hooks/handoff_evidence_gate.py' ':!scripts/session/deployment_approval_probe.py' ':!config/agent/verification_registry/entries/github-mcp-server-neither-installed-nor-declared.yaml'"
    expected: exit 0, no output.
    fix_if: >-
      A hit is a missed reference -- remove or reword it. The graduated-shard exclusion is the one
      sanctioned exclusion (human-confirmed amendment, Decision 235 cl.1); never add any other.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      A one-time closure sweep with pathspec exclusions; reintroduction of the server or installer is
      guarded by step 1's graduated node.
  - step: 6
    phase: pre-deploy
    action: >-
      Full-tier handoff obligation on the committed, rebased, clean tree, then HEAD attestation --
      .claude/settings.json is a never_exempt path (Decision 203). The handoff stays blocked until
      this step exits 0.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0; the Validation Summary lists no failure and --verify-head attests HEAD.
    fix_if: >-
      An in-scope failure is fixed, committed and this step re-run; an out-of-scope one becomes a rec
      (Decision 59, Decision 55) and the handoff stays blocked. Never skip or weaken a check.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      After the squash-merge whose body carries the trailer "Resolves: rec-2982", confirm the
      trailer-closure job closed it.
    command: bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f; s=f('rec-2982')['status']; print(s); assert s=='closed'"
    expected: prints closed; exit 0.
    fix_if: >-
      Still open -- read the trailer-closure job log; on a transport refusal use the sanctioned
      --update-rec fallback with --closure-artifact naming the step 1 shard; on an acceptance refusal
      use only the printed close_proposed command (git-ops.yaml resolves_trailer).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: In a fresh direct web session on main after the merge, read the session's own startup deferred-tool index.
    command: >-
      bin/venv-python -c "import json,glob,os; f=max(glob.glob(os.path.expanduser('~/.claude/projects/*/*.jsonl')),key=os.path.getmtime); rows=[json.loads(l) for l in open(f)]; n=[x for d in rows if d.get('type')=='attachment' and d['attachment'].get('type')=='deferred_tools_delta' for x in d['attachment'].get('addedNames',[])]; print('deferred_total', len(n), 'github_deferred', sum(x.startswith('mcp__github__') for x in n), 'github_full_deferred', sum(x.startswith('mcp__github-full__') for x in n))"
    expected: >-
      deferred_total and github_deferred both above 0 (positive control), github_full_deferred 0. The
      session-start output carries no session_start_ensure_github_mcp line (user-read).
    fix_if: github-full names present -- the session predates the merge or .mcp.json was not updated.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: .mcp.json
    behavior: No github-full server is declared, so no stdio GitHub MCP surface loads.
    verification_step: 1
    test_selector: tests/test_setup_cloud_env.py::test_github_mcp_server_is_neither_installed_nor_declared
    red_green_expectation: red before, green after -- the node does not resolve today.
  - source: .claude/settings.json
    behavior: The plugin render stays derived from settings; the ensure hook is no longer registered.
    verification_step: 3
    test_selector: tests/test_session_start_github_readiness_hook.py::test_hook_order_and_advisory_execution
    red_green_expectation: red before, green after -- the rewritten node asserts the ensure hook is absent, which fails today.
  - source: .claude/hooks/hooks.json
    behavior: The plugin's gated hooks stay the render of the settings.
    verification_step: 4
    test_selector: tests/hooks/test_plugin_hooks.py::test_the_committed_hooks_file_is_the_render_of_the_settings
    waiver_reason: >-
      Generated artefact: regenerated by plugin_hooks.py render; the existing standing render test is
      green before and after by design.
  - source: bin/setup-cloud-env.sh
    behavior: Setup installs no github-mcp-server and documents no gh-mcp token block.
    verification_step: 1
    test_selector: tests/test_setup_cloud_env.py::test_github_mcp_server_is_neither_installed_nor_declared
    red_green_expectation: red before, green after -- today the script calls the ensure script and carries the gh-mcp block.
  - source: bin/sync-deps.sh
    behavior: Comment-only edit.
    verification_step: 5
    command: "! git grep -nIE 'github-full|github-mcp-server|gh-mcp|ensure-github-mcp|ensure_github_mcp|GitHub MCP SessionStart' -- . ':!docs/plans' ':!docs/audit-prompts' ':!audits' ':!tests' ':!scripts/session/github_readiness.py' ':!.claude/hooks/handoff_evidence_gate.py' ':!scripts/session/deployment_approval_probe.py' ':!config/agent/verification_registry/entries/github-mcp-server-neither-installed-nor-declared.yaml'"
    waiver_reason: Comment-only edit with no behaviour change; the stale-reference sweep proves the reference is gone.
  - source: .claude/hooks/session_start_precommit.sh
    behavior: Comment-only edit.
    verification_step: 5
    command: "! git grep -nIE 'github-full|github-mcp-server|gh-mcp|ensure-github-mcp|ensure_github_mcp|GitHub MCP SessionStart' -- . ':!docs/plans' ':!docs/audit-prompts' ':!audits' ':!tests' ':!scripts/session/github_readiness.py' ':!.claude/hooks/handoff_evidence_gate.py' ':!scripts/session/deployment_approval_probe.py' ':!config/agent/verification_registry/entries/github-mcp-server-neither-installed-nor-declared.yaml'"
    waiver_reason: Comment-only edit with no behaviour change; the stale-reference sweep proves the reference is gone.
  - source: .claude/hooks/session_start_sync_deps.sh
    behavior: Comment-only edit.
    verification_step: 5
    command: "! git grep -nIE 'github-full|github-mcp-server|gh-mcp|ensure-github-mcp|ensure_github_mcp|GitHub MCP SessionStart' -- . ':!docs/plans' ':!docs/audit-prompts' ':!audits' ':!tests' ':!scripts/session/github_readiness.py' ':!.claude/hooks/handoff_evidence_gate.py' ':!scripts/session/deployment_approval_probe.py' ':!config/agent/verification_registry/entries/github-mcp-server-neither-installed-nor-declared.yaml'"
    waiver_reason: Comment-only edit with no behaviour change; the stale-reference sweep proves the reference is gone.
  - source: .claude/hooks/session_start_deepen_history.sh
    behavior: Comment-only edit (hook count).
    verification_step: 6
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    waiver_reason: Comment-only edit with no behaviour change; its existing hook tests run in the full tier.
  - source: config/agent/verification_registry/entries/deprecated/setup-cloud-env-mcp-token-placeholder.yaml
    behavior: The retired check is preserved unchanged and excluded from the loader.
    verification_step: 6
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    waiver_reason: >-
      A 100% rename into the loader-excluded deprecated/ subtree; validate_verification_registry runs
      in the full tier, and the replacement guard is step 1's graduated node.
  - source: docs/contracts/github-org-transfer.yaml
    behavior: Step 7 wording names the authenticated read.
    verification_step: 6
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    waiver_reason: >-
      Wording amendment of a completed procedure step; validate_github_org_transfer, the contract
      amendment-log rule and the size limit all run in the full tier.
  - source: docs/contracts/file-router.yaml
    behavior: The .mcp.json routing entry names the remaining server.
    verification_step: 6
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    waiver_reason: >-
      Wording of a discovery-index row; the file-router, amendment-log and size checks run in the full
