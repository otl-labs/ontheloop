constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    Sequencing: PLAN-startup-context-tool-denies' implementation merged (#1707); merge this plan's
    implementation only after the user confirms in chat that the sibling's post-merge VP step 4
    reading was taken (its control diff covers .mcp.json, and removing github-full lowers the MCP
    tools line it asserts). That control already prints AGENTS.md (#1749): expected, and it moves
    only the memory line and the unasserted first-call total. Ask the user once at merge time; do
    not hold open-endedly.
  - >-
    Owned elsewhere, untouched here and excluded from the sweep: scripts/session/github_readiness.py
    (Plan B, rec-3626 -- its github_mcp_runtime leg keeps reporting a stale pass while existing
    snapshots retain the binary, config and token file; advisory and harmless until Plan B removes
    it), .claude/hooks/handoff_evidence_gate.py and the handoff-gate matcher in .claude/settings.json
    (Plan C, rec-4775, rewrites both), and
    scripts/session/deployment_approval_probe.py (rec-4695's deliberate token-file leg, which retires
    with the user's security project).
  - >-
    Out of scope: revoking the old GitHub MCP personal access token and deleting the ~/.config/gh-mcp
    block from the DEV and ADMIN private Setup scripts -- owned by the user's security project.
  - ducklake-reads in .mcp.json stays byte-identical.
  - >-
    Retained historical strings, outside Scope by design (Decision 59): the telemetry tool-name
    vectors in tests/fixtures/process_event_name_vectors.py and
    tests/telemetry/test_process_event_name_rule.py, docs/audit-prompts/*, docs/plans/PLAN-*.yaml, and
    github-org-transfer.yaml's unaffected_bindings, phase-gate, rollback and evidence_ledger text.
  - >-
    PUBLIC repository (Decision 101): no token value, account id or credential in any committed file,
    commit message or PR body.
  - >-
    weakening_dispositions (Decision 181; Decision 235 cl.1 -- this human-confirmed plan names each).
    retirement, citing the deleted bin/ensure-github-mcp-server.sh or
    .claude/hooks/session_start_ensure_github_mcp.sh: tests/test_setup_cloud_env.py's ensure entry in
    test_shared_session_bootstrap_steps_are_ordered_after_prerequisites, its ensure count in
    test_setup_contract_uses_delegated_bootstrap_commands, the after-ensure ordering in
    test_github_readiness_runs_after_mcp_install_and_before_precommit (renamed
    test_github_readiness_runs_before_precommit), and the ensure-hook ordering assertion in
    tests/test_session_start_github_readiness_hook.py::test_hook_order_and_advisory_execution.
    planned-change, citing acceptance_criteria[2]: the removed node
    test_github_mcp_token_comment_writes_the_proxy_placeholder -- one entry for that one candidate
    (its "<PAT>" / GITHUB_MCP_PAT absence assertions carry into
    test_github_mcp_server_is_neither_installed_nor_declared, which graduates under a new check_id;
    its graduated check setup-cloud-env-mcp-token-placeholder retires by git mv to
    entries/deprecated/). Record exactly one entry per candidate code review emits, copying its stubs
    verbatim; a listed edit that emits no candidate (e.g. a dropped tuple element) gets no entry, or
    validate_weakening_dispositions fails it as stale. (A retirement cite resolves only as a deleted
    path or file.py::name.) A candidate from any other file, or one whose only truthful key is
    weakening, stops the build.
  - >-
    VP step 5 narrowing (amended 2026-10-30; Decision 235 cl.1 human-confirmed, Decision 181 routing via
    a separate plan-only PR, not the implementing diff): the sweep and its three test_obligations
    copies exclude exactly
    config/agent/verification_registry/entries/github-mcp-server-neither-installed-nor-declared.yaml.
    Cause: step 1's graduate obligation writes that shard with check_id and plan_slug literals the
    regex matches (Decision 176 path = check_id; Decision 132 verbatim match), so the unamended step
    contradicted step 1. Exact-file, not the registry directory, so other shards and registry
    tooling stay swept; the shard is itself the standing reintroduction guard.
  - >-
    Mechanical findings a CI check enforces (size caps, amendment-log presence and the like) are
    implementation to-dos caught by validate --pre, not plan revisions (user direction 2026-10-30;
    rec-4754).
