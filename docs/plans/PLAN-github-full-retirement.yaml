execution_steps:
  - Capture red-before output for VP steps 1, 2 and 5 on the untouched tree.
  - >-
    .mcp.json -- remove the github-full entry. .claude/settings.json -- remove the "mcp__github-full"
    allow entry (fix the preceding comma) and the ensure-hook SessionStart command; regenerate
    .claude/hooks/hooks.json with bin/venv-python .claude/hooks/plugin_hooks.py render.
  - >-
    Delete .claude/hooks/session_start_ensure_github_mcp.sh and bin/ensure-github-mcp-server.sh.
    bin/setup-cloud-env.sh -- remove the GITHUB MCP block, the ensure-hook responsibility line, step 6
    and the remaining github-mcp-server / gh-mcp mentions (including the "Materialise ... token" and
    "see github-mcp-server, step 6" lines); reword the Codex-parity comment; renumber the later step.
    Comment-only fixes in bin/sync-deps.sh, session_start_precommit.sh, session_start_sync_deps.sh and
    session_start_deepen_history.sh (seven hooks).
  - >-
    tests/test_setup_cloud_env.py and tests/test_session_start_github_readiness_hook.py -- as in scope;
    test_github_mcp_server_is_neither_installed_nor_declared asserts both halves (it fails today on
    both).
  - >-
    git mv config/agent/verification_registry/entries/setup-cloud-env-mcp-token-placeholder.yaml into
    entries/deprecated/ (content untouched).
  - >-
    docs/contracts/github-org-transfer.yaml -- step 7 in place plus one flow-style amendment_log entry.
    docs/contracts/file-router.yaml -- rename the topic, reword it, one flow-style amendment_log entry.
  - Run VP steps 1-5; loop until pass (Decision 55); record weakening dispositions per the constraint.
  - >-
    Closure (implement skill Commit Flows; git-ops.yaml handoff_sequence): readiness check, graduation
    walk writes the step 1 shard and sets implementation_declared true, commit, fetch and rebase onto
    origin/main, VP step 6 on the committed clean tree, postflight evidence (bin/venv-python -m
    scripts.session.postflight --evidence /tmp/implementation-retrospective.json), push as its own
    tool call, the PR, subscribe_pr_activity; on green CI and the sequencing constraint met,
    squash-merge with "Resolves: rec-2982" in the commit body, then VP step 7. Report readiness,
    validator evidence, postflight evidence and push/PR as separate facts.
  - >-
    Hand back a pasteable prompt for a FRESH direct web session on main: "Run VP step 8 of
    docs/plans/PLAN-github-full-retirement.yaml." Tell the user to update the ontheloop plugin in
    claude.ai (Customize > Plugins), or project threads keep calling the deleted ensure hook
    (non-blocking error line).
  - 'Report: what was implemented, VP results, rec closure, and the fresh-session reading.'
work_areas: []
rollback: >-
  Revert the merge commit: it restores the server entry, ensure hook, installer, setup step, tests and
  the setup-cloud-env-mcp-token-placeholder shard (the git mv reverses) and removes the
  github-mcp-server-neither-installed-nor-declared shard; the next fresh session reinstalls the
  binary. rec-2982 reopens via update_rec. No data or infrastructure changes.
weakening_dispositions:
  - candidate: "[assertion-changed] tests/test_session_start_github_readiness_hook.py::test_hook_order_and_advisory_execution"
    disposition: retirement
    cite: ".claude/hooks/session_start_ensure_github_mcp.sh"
  - candidate: "[assertion-removed] tests/test_setup_cloud_env.py::test_setup_contract_uses_delegated_bootstrap_commands"
    disposition: retirement
    cite: "bin/ensure-github-mcp-server.sh"
  - candidate: "[test-removed] tests/test_setup_cloud_env.py::test_github_mcp_token_comment_writes_the_proxy_placeholder"
    disposition: planned-change
    cite: "acceptance_criteria[2]"
  - candidate: "[test-removed] tests/test_setup_cloud_env.py::test_github_readiness_runs_after_mcp_install_and_before_precommit"
    disposition: retirement
    cite: "bin/ensure-github-mcp-server.sh"
