  the date and the Decision number only. Any other wording change, including one critique or code review asks for, goes back
  to the operator before merge.'
- 'Decision 177 append-only: the four annotations land as their own lines at the end of each entry''s span (after its last
  existing line, before the ''---'' separator); no existing body line changes.'
- 'Numbering race: if a Decision 218 lands on main first, renumber to max+1 everywhere (heading, envelope, annotations, contract
  text) and re-run steps 3-7.'
- 'Decision 101: names and locations only; no account id, organisation numeric id, e-mail or credential value in any file.'
- 'Do not touch terraform/**, .github/**, scripts/** or tests/**: the OIDC pre-stage (rec-3902), the sweep (rec-3903), the
  PR-time terraform/github plan (rec-4335) and the state reconcile (rec-3136) are separate plans.'
- 'Do not add a file-router route: not required by validate_contract_drift and not part of the approved text.'
- No rescue agents or workaround loops (Decision 55).
