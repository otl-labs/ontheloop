pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- |
  Create docs/contracts/github-org-transfer.yaml with EXACTLY this content (allowed variance: the amendment_log date; the Decision number if renumbered):

  # GitHub organisation transfer contract (rec-3905; Decisions 172, 195, 198, 218).
  # The keystone for moving this repository from the founder's personal GitHub account into the
  # company organisation: prerequisites, the breakage map, the phased sequence with its gates, the
  # evidence that proves each phase, the rollback stance, and predecessor removal. It changes nothing
  # live. Later plans execute it and cite its row ids (breakage_map.<id>, phases.<id>); each phase
  # flip is recorded in evidence_ledger and amendment_log. Names and locations only: no account id,
  # organisation id, e-mail, token or other credential value is ever written here (Decision 101).
  contract:
    id: github-org-transfer
    class: D
    contract_version: 1
    status: ratified
    ratified_via: "PLAN-github-org-transfer-contract"
    description: >-
      Prerequisites, breakage map, phased sequence and gates, evidence, rollback stance and
      predecessor removal for transferring the repository into the otl-labs GitHub organisation and
      renaming it in the same operation (Decision 218). Executes nothing itself.
    subject: github-org-transfer
    evaluator:
      agent_surface: docs/CLAUDE.md
  amendment_log:
    - date: "2026-10-15"
      semantic_break: false
      change_class: field_add
      summary: >-
        PLAN-github-org-transfer-contract: initial authoring (rec-3905). Records the target identity
        (Decision 218), the breakage map, six phases from settle to predecessor removal, the
        transfer-window checklist, the rollback stance and the evidence ledger. identity.phase
        starts at pre_transfer.

  planned_evaluator: >-
      The OIDC owner-segment pre-stage plan (rec-3902) replaces agent_surface with a registered check,
      validate_github_org_transfer, in the same PR that first flips identity.phase. Planned
      invariants: (1) local.github_repos in terraform/personal/oidc.tf and
      terraform/bootstrap/github_ci_apply.tf equals the trusted_segments of the phase whose exit_sets_phase equals identity.phase
      names, exact match; (2) every breakage_map row with detection: static matches its
      per-phase expected literal state. Until then the pinned constants in
      tests/checks/iam_tf/test_oidc_trust_slug_invariants.py and
      tests/checks/ci_guards/test_validate_dependabot_automation.py, and the old-slug pins in
      scripts/checks/hygiene/validate_licence_consistency.py (rec-3903 adds the new forbidden slug), are
      the only static guards.

  identity:
    current:
      owner: benjamin-blake
      owner_kind: personal_account
      repository: theseus
      trust_segment_ref: "terraform/personal/oidc.tf local.github_repos (the single immutable segment)"
    target:
      owner: otl-labs
      owner_kind: organisation
      owner_numeric_id: >-
        Read by the operator from the GitHub API at the pre_staged phase and written only into the
        two local.github_repos lists, never here (GitHub numeric ids are public API values; Decision
        172 precedent).
      repository: ontheloop
      decided_by: "Decision 218"
    durable: >-
      The repository numeric id survives transfer and rename; the OWNER half (login and numeric id)
      changes at transfer and the REPO name half changes at rename (Decision 172; GitHub mints the
      immutable subject repo:OWNER@OWNER-ID/REPO@REPO-ID for any repository renamed or transferred
      after 2026-07-15). Transfer and rename are ONE operation, so exactly one new segment is staged.
    phase: pre_transfer
    phase_values: [pre_transfer, pre_staged, transferred, proven, predecessor_removed]

  plan_tier:
    current: "GitHub Free for organisations"
    suffices_while: public repository
    why: >-
      Environment protection rules (required reviewers, the sole authorisation boundary of
      tf-gated-apply) and unmetered standard-runner Actions minutes are public-repository features on
      Free, Pro and Team.
    private_repo_consequence: >-
      The moment a PRIVATE repository needs required reviewers on an environment, the organisation
      needs GitHub Enterprise; Team adds private environments and secrets but not required reviewers.
    pages: GitHub Pages does not redirect after a transfer; this repository does not use Pages.

  prerequisites:
    - id: repository-name-decided
      satisfied_by: "Decision 218"
      blocks: pre_staged
    - id: decision-172-owner-half
      satisfied_by: "Decision 218 clause 2 (rec-3915)"
      blocks: pre_staged
    - id: terraform-github-pr-time-plan
      satisfied_by: >-
        rec-4335: a CI job runs a read-only terraform plan of terraform/github on every PR touching it,
        authenticated by an otl-labs-owned GitHub App (Metadata, Administration and Actions read), and
        terraform/github is recorded in environment-taxonomy.yaml once live, so
        deploy-paths.yaml's pre_merge_live_plan root derivation stays correct.
      blocks: "terraform-github-state-reconciled, and every migration change under terraform/github"
      why: >-
        Today CI only validates terraform/github offline, so its first live provider contact is at
        apply time (the #1316 failure class). The App is public until the transfer so it can be
        installed on the personal account for this repository only.
    - id: terraform-github-state-reconciled
      satisfied_by: >-
        rec-3136: state rm + re-import of github_repository.this under the CURRENT name, proven by the
        CI plan: one run records the drift, a second after the re-import reads 0 to change.
      blocks: pre_staged
      why: A post-move plan diff is unattributable without a zero-diff baseline.
    - id: org-owner-access
      satisfied_by: "The operator is an owner of otl-labs (required to rename during transfer) and holds admin on the repository."
      blocks: transferred

  carries_over:
    verified: >-
      Issues, pull requests, wiki, stars, watchers, webhooks, secrets, deploy keys, LFS objects,
      forks and history carry over; web and git URLs redirect until something is created at the old
      path (GitHub docs, read 2026-10-15). Repository secrets keep their values, so a value that
      names the old owner still needs replacing.
    unverified: >-
      GitHub docs do not state whether environments and their protection rules, rulesets and bypass
      actors, repository Actions settings or App installations carry over. Treat each as absent
      until a REST read on the new path proves it (phases.transfer).
    name_retirement: >-
      A repository with heavy clone or Actions traffic has its old owner/name path retired after a
      move, so benjamin-blake/theseus can never be recreated and its redirects persist.

  breakage_map:
    # changes_on: which half of the identity change breaks it. timing: at_transfer (breaks the moment
    # the transfer lands), first_use (breaks when next exercised), silent (stops working with no error).
    # fix_phase: the phase whose exit requires the fix. actor: HUMAN (operator console, or an exact
    # command run on the operator's word) or AGENT-RUNNABLE (a PR through the governed path).
    - id: oidc_trust_segment
      binding: OIDC trust subject segment of every CI role
      locations: [terraform/personal/oidc.tf, terraform/bootstrap/github_ci_apply.tf, tests/checks/iam_tf/test_oidc_trust_slug_invariants.py]
      changes_on: [owner, name]
      timing: at_transfer
      failure_mode: >-
        All five CI roles become unassumable; ci-rca and convergence-health go dark with them, so the
        outage is self-masking (Decision 172). Recovery after the fact is circular (the fix routes to
        tf-gated-apply, which needs OIDC) and falls to the admin break-glass apply.
      fix: >-
        Add the target segment additively to BOTH lists before transfer: terraform/personal through
        the PR -> tf-gated-apply path, terraform/bootstrap by the operator's out-of-band admin apply.
        Exact match only, no wildcard (Decision 172 clause 3). Every sub site renders all five sub
        forms from the list, including environment:tf-gated-apply (Decision 94), so the one new
        entry covers them; the both-forms guard in the trust test stays intact.
      fix_phase: pre_staged
      actor: HUMAN
      rec: rec-3902
      detection: static
    - id: environment_fail_open
      binding: GitHub Environments tf-gated-apply (Terraform-managed) and pypi (not Terraform-managed)
      locations: [terraform/github/environments.tf, .github/workflows/terraform-apply-sandbox.yml, .github/workflows/publish-ontheloop.yml]
      changes_on: [owner]
      timing: silent
      failure_mode: >-
        If an environment does not carry over, GitHub creates it WITHOUT protection rules on the first
        job that references it, while the OIDC environment sub still matches: every gated apply and
        every publish runs ungated (PLAN-repo-rename-relicense precedent).
      fix: >-
        Read both environments and their reviewers by REST on the new path BEFORE the first merge to
        main or any dispatch; recreate them from terraform/github (tf-gated-apply) or the console
        (pypi) before unfreezing.
      fix_phase: transferred
      actor: HUMAN
      rec: rec-3905
      detection: live
    - id: org_policy_override
      binding: Organisation-level Actions and token policies that override repository settings
      locations: [terraform/github/repo.tf]
      changes_on: [owner]
      timing: silent
      failure_mode: >-
        A restrictive organisation default for the GITHUB_TOKEN permission, the allowed-actions
        policy, the "Actions can create and approve pull requests" switch, fork-PR approval, the
        fine-grained PAT approval policy or a classic-PAT restriction can disable a repository setting
        with no error at transfer time; the first workflow or terraform/github call that needs it fails.
      fix: >-
        Before transfer the operator sets the organisation policies to match terraform/github/repo.tf
        (default token read-only; Actions may not approve pull requests; all actions allowed; classic
        and fine-grained PATs allowed, org-owner tokens need no approval); require 2FA for members.
        Recorded as a console checklist in procedure.pre_stage.
      fix_phase: pre_staged
      actor: HUMAN
      rec: rec-3905
      detection: live
    - id: ruleset_and_actions_settings
      binding: main ruleset (require_code_owner_review, admin bypass actor role 5), Actions and workflow permissions
      locations: [terraform/github/repo.tf, .github/CODEOWNERS]
      changes_on: [owner]
      timing: silent
      failure_mode: Not documented to carry; a missing ruleset lets unreviewed changes reach main.
      fix: REST read on the new path in phases.transfer; recreate from terraform/github if absent.
      fix_phase: transferred
      actor: HUMAN
      rec: rec-3905
      detection: live
    - id: terraform_github_root
      binding: terraform/github provider owner, repository name and name-keyed state
      locations: [terraform/github/variables.tf, terraform/github/main.tf, terraform/github/repo.tf, terraform/github/environments.tf]
      changes_on: [owner, name]
      timing: first_use
      failure_mode: >-
        The provider looks up the old owner/name and every name-keyed resource (repository, ruleset,
        environment, Actions and workflow permissions) misaddresses. Letting the provider perform the
        rename edits by the old id and fails once the repository is already renamed.
      fix: >-
        After transfer: change the github_owner and repository_name defaults, re-import every
        name-keyed resource with import blocks, and prove a plan of N to import, 0 to change, 0 to
        destroy in the PR-time CI plan (prerequisites.terraform-github-pr-time-plan) before any
        apply. Apply stays by hand with the classic admin PAT, which works for org repositories its
        holder can reach unless the organisation restricts classic PATs (org_policy_override); its
        successor is an otl-labs fine-grained PAT minted after transfer and proven on one apply.
        Until the App is proven to see security_and_analysis and ruleset bypass_actors, the
        operator's plan is authoritative for those two fields.
      fix_phase: proven
      actor: HUMAN
      rec: rec-3136
      detection: static
    - id: terraform_github_plan_app
      binding: The otl-labs GitHub App installation that authenticates the PR-time terraform/github plan
      locations: [operator console, repository secrets (App private key)]
      changes_on: [owner]
      timing: first_use
      failure_mode: >-
        Its installation is on the personal account, so after transfer the CI plan cannot read the
        repository until the App is installed on otl-labs and the job uses the new installation.
      fix: >-
        After transfer install the App on otl-labs, swap the installation reference, prove one plan on
        the new path; then uninstall it from the personal account and make it private.
      fix_phase: proven
      actor: HUMAN
      rec: rec-4335
      detection: live
    - id: pypi_trusted_publisher
      binding: PyPI Trusted Publisher for project ontheloop (repository, workflow filename, environment)
      locations: [docs/contracts/package-registry-reservation.yaml, .github/workflows/publish-ontheloop.yml]
      changes_on: [owner, name]
      timing: first_use
      failure_mode: The next publish dispatch is rejected by PyPI's OIDC exchange.
      fix: >-
        Before transfer register a SECOND publisher for otl-labs/ontheloop with the same workflow
        filename and environment (a PyPI project may hold several); remove the old one only after a
        live publish under the new path; update package-registry-reservation.yaml's
        pypi_trusted_publisher block in the sweep.
      fix_phase: pre_staged
      actor: HUMAN
      rec: rec-3905
      detection: live
    - id: claude_github_app
      binding: Claude GitHub App installation used by Claude Code cloud sessions and projects
      locations: [operator console]
      changes_on: [owner]
      timing: at_transfer
      failure_mode: Cloud sessions and project threads lose clone and push access to the repository.
      fix: >-
        Before transfer an organisation owner installs the App on otl-labs (all repositories, or the
        repository added immediately after transfer); the personal installation stays until proof.
