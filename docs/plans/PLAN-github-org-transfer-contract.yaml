    - id: fine_grained_pat
      binding: Fine-grained PATs whose resource owner is the personal account (GHAS_PROBE_TOKEN repo secret; the GitHub MCP token written by the cloud-environment setup scripts)
      locations: [.github/workflows/ghas-probe.yml, scripts/checks/misc/validate_ghas_probe.py, cloud-environment setup scripts (outside the repository)]
      changes_on: [owner]
      timing: first_use
      failure_mode: A fine-grained PAT reaches resources of ONE owner only, so both tokens 403 against the moved repository.
      fix: >-
        Mint successors with otl-labs as resource owner before transfer (all repositories, or
        narrowed to the repository right after transfer); swap the secret value and the setup-script
