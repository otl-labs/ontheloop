      - {step: 4, tag: HUMAN, action: "Register the second PyPI Trusted Publisher for otl-labs/ontheloop (same workflow filename and environment)."}
      - {step: 5, tag: HUMAN, action: "Mint the successor fine-grained PATs with otl-labs as resource owner and store them where their predecessors live (Secrets Manager or the operator's vault); do not swap yet."}
      - {step: 6, tag: AGENT-RUNNABLE, action: "Land the dependabot guard and test that accept both full names."}
    transfer_window_checklist:
      - {step: 1, tag: AGENT-RUNNABLE, action: "Repository GET on the new path: new full name, same numeric id."}
      - {step: 2, tag: AGENT-RUNNABLE, action: "Both environments exist with their required reviewers (breakage_map.environment_fail_open)."}
      - {step: 3, tag: AGENT-RUNNABLE, action: "Main ruleset active with code-owner review and the admin bypass role; Actions and workflow permissions match terraform/github/repo.tf."}
      - {step: 4, tag: AGENT-RUNNABLE, action: "Secret and variable NAMES present (values are never read)."}
      - {step: 5, tag: HUMAN, action: "Re-point the Claude Code project and edit each environment setup script's clone path; swap the GHAS_PROBE_TOKEN and MCP token values."}
      - {step: 6, tag: AGENT-RUNNABLE, action: "A fresh Claude Code thread clones, pushes a branch and opens a PR."}
      - {step: 7, tag: AGENT-RUNNABLE, action: "A read-only OIDC job (the drift plan, dispatched on the operator's word) assumes its role under the target segment."}
      - {step: 8, tag: HUMAN, action: "Merge one trivial PR; the post-merge apply run and CI on main are green. Unfreeze."}

