  phases:
    - id: settle
      exit_sets_phase: pre_transfer
      trusted_segments: [current]
      gates:
        - "This contract merged; Decision 218 recorded (repository name; owner half of Decision 172's playbook)."
    - id: pre_stage
      exit_sets_phase: pre_staged
      trusted_segments: [current, target]
      gates:
        - "breakage_map.oidc_trust_segment: target segment applied in BOTH roots; a CI run on the CURRENT path assumes every role (proof the additive edit broke nothing)."
        - "breakage_map.org_policy_override, claude_github_app, pypi_trusted_publisher: console steps done and read back."
        - "breakage_map.fine_grained_pat: successor tokens minted, not yet swapped."
        - "breakage_map.dependabot_repository_guard: both full names accepted, merged green."
        - "prerequisites.terraform-github-pr-time-plan and terraform-github-state-reconciled satisfied."
    - id: transfer
      exit_sets_phase: transferred
      trusted_segments: [current, target]
      gates:
        - "Go/no-go: every pre_stage gate green, recorded in evidence_ledger; this is the last reversible point."
        - "Freeze: no merge to main and no workflow dispatch from the go/no-go until unfreeze; in-flight runs drain first."
        - "The operator transfers to otl-labs and renames to ontheloop in ONE operation (Settings > Transfer)."
        - "Unfreeze only after procedure.transfer_window_checklist passes in order."
    - id: prove
      exit_sets_phase: proven
      trusted_segments: [current, target]
      gates:
        - "Green CI on main; a converged convergence record; a speculative plan and a tf-gated-apply run on the new path; Dependabot auto-merge; code-owner review; the pypi environment gate (read, not a publish, unless a release is due); a Claude Code thread clones, pushes and opens a PR; live RoleLastUsed for every CI role under the target segment."
        - "breakage_map.terraform_github_root: plan of N to import, 0 to change, 0 to destroy on the new owner and name."
    - id: predecessor_removal
      exit_sets_phase: predecessor_removed
      trusted_segments: [target]
      gates:
        - "Each removal is its own gated step with recorded evidence, in this order: old OIDC segment from both roots (gated and admin applies); old PyPI publisher; old fine-grained PATs revoked; the classic terraform/github admin PAT revoked after its fine-grained successor proves one apply; the plan App uninstalled from the personal account and made private; personal Claude App installation scoped off this repository; owner_literal_defaults, codeowners and descriptive_literals swept (rec-3903)."

  rollback:
    stance: >-
      Rollback is forward-fix on the new identity, never a transfer back. Every predecessor binding
      (old OIDC segment, old PyPI publisher, old tokens, personal App installation) stays live until
      phases.prove passes, so a straddling job or a missed binding fails safe. Transfer-back is not a
      rollback: the old path is likely retired and its OIDC subject cannot be minted again.
    last_reversible_point: phases.transfer go/no-go gate
    per_phase:
      pre_stage: "Each additive change is reverted by its own PR or console undo; nothing is removed in this phase."
      transfer: "If a checklist item fails, stay frozen and forward-fix it; if OIDC fails, the admin break-glass apply restores trust (Decision 172 recovery)."
      predecessor_removal: "Re-add the removed binding from its predecessor record before retrying."

  procedure:
    pre_stage:
      - {step: 1, tag: HUMAN, action: "Read the otl-labs numeric id from the GitHub API and hand it to the OIDC pre-stage plan (rec-3902), which adds the target segment to both roots."}
      - {step: 2, tag: HUMAN, action: "Set the otl-labs organisation policies per breakage_map.org_policy_override; read them back."}
