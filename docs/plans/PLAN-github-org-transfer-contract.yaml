schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: github-org-transfer-contract
intent: Land the keystone contract for moving the repository into the company GitHub organisation (docs/contracts/github-org-transfer.yaml,
  rec-3905) and the Decision that names its target identity (otl-labs/ontheloop in one transfer-and-rename) and extends Decision
  172's pre-stage playbook to the owner half (rec-3915), so every later migration plan cites one machine-readable sequence
  instead of re-deriving it. Changes nothing live.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-github-org-transfer-contract.yaml
phase: 'ad_hoc_rec (soft-warn exception category) -- resolves rec-3905 and rec-3915 (both High). No tier_item criterion claimed.
  Adjacent: T2.54 (clause-to-check traceability; the contract''s planned_evaluator names the check rec-3902 lands).'
closes_criteria: []
scope:
- file: docs/contracts/github-org-transfer.yaml
  action: Create
  purpose: 'The Class D contract, VERBATIM as approved (execution_steps step 1 carries the full text). Allowed variance: the
    amendment_log date and, if Decision 218 is taken first, the Decision number in its text.'
- file: docs/CLAUDE.md
  action: Modify
  purpose: Append the approved two-line sentence naming the contract directly after the existing package-registry-reservation
    example sentence (the contract's agent_surface evaluator resolves on it). +~170 bytes against the 3813-byte config/prose_budgets.yaml
    budget (3235 today); no budget edit.
- file: docs/DECISIONS.md
  action: Modify
  purpose: Insert Decision 218 (verbatim, execution_steps step 3) as the newest entry at the top, and append the four approved
    dated blockquotes to Decisions 171, 172, 195 and 198 (execution_steps step 4). No existing body line changes (Decision
    177).
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write after the DECISIONS.md edit (new entry and amends
    edges); never hand-edited.
- file: config/agent/verification_registry/entries/github-org-transfer-decision-172-owner-half.yaml
  action: Create
  purpose: 'Graduation record for VP step 3, same shape as the step 1 row: guard_target docs/DECISIONS.md, check_spec.command
    = [bash, -c, <VP step 3 command verbatim>] (precedent decision-192-noncurrent-lifecycle-amendment.yaml).'
- file: config/agent/verification_registry/entries/github-org-transfer-contract.yaml
  action: Create
  purpose: 'Graduation record for VP step 1 (filename == check_id == graduation_check_id, Decision 176): primitive_slot command_exit_zero,
    guard_target docs/contracts/github-org-transfer.yaml, guard_symbol null, plan_slug github-org-transfer-contract, graduated_by
    implement-agent, check_spec.command = [bash, -c, <VP step 1 command verbatim>].'
bundled_recommendations:
- rec-3905
- rec-3915
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- docs/contracts/github-org-transfer.yaml exists byte-identical to execution_steps step 1 (allowed variance only), is a Class
  D ratified contract whose agent_surface evaluator resolves, and validate_contract_drift passes.
- 'rec-3905''s acceptance holds: the contract exists and names fine_grained_pat.'
- 'rec-3915''s acceptance holds: docs/DECISIONS.md contains ''owner-transfer'' and ''org transfer'', inside Decision 172''s
  span (the new blockquote).'
- Decision 218 is the newest entry, carries the typed envelope with amends [171, 172, 198] and significance numbered_decision,
  its span is at or under 6,144 bytes, and the decisions index is current.
- Decisions 171, 172, 195 and 198 each carry the approved dated blockquote as their own lines; no existing body line in any
  entry changed.
- No account id, organisation numeric id, e-mail, token or ExternalId appears in any changed file (Decision 101).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Contract present with the rec-3905 marker and its evaluator surface wired.
  command: 'test -f docs/contracts/github-org-transfer.yaml && grep -q ''fine_grained_pat'' docs/contracts/github-org-transfer.yaml
    && grep -q ''agent_surface: docs/CLAUDE.md'' docs/contracts/github-org-transfer.yaml && grep -q ''github-org-transfer.yaml''
    docs/CLAUDE.md'
  expected: Exit 0.
  fix_if: 'Missing file or marker: the contract was not copied verbatim from execution_steps step 1. Missing docs/CLAUDE.md
    line: step 2 was skipped; without it the evaluator does not resolve.'
  hermetic: true
  graduation: graduate
  graduation_check_id: github-org-transfer-contract
- step: 2
  phase: pre-deploy
  action: 'Class D population gate: envelope, subject uniqueness, evaluator resolution and ratchet.'
  command: bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v;
    f=[]; v(f); print('\n'.join(f)); raise SystemExit(1 if f else 0)"
  expected: 'Prints PASS with one more governed contract than origin/main and exits 0 (dry-run at planning time: 43 governed).'
  fix_if: 'An evaluator finding means docs/CLAUDE.md lacks the basename. A schema finding means a key was added under contract:
    (ContractMeta is extra=forbid; planned_evaluator stays top-level). Never edit contract-population.yaml ratchet pins to
    pass.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_contract_drift is already a registered standing check in both tiers; a second registry
    row would assert the same property for one file.
- step: 3
  phase: pre-deploy
  action: rec-3915 acceptance, scoped to Decision 172's span so text landing in the wrong entry fails.
  command: awk '/^## Decision 172:/,/^## Decision 171:/' docs/DECISIONS.md | grep -q 'owner-transfer' && awk '/^## Decision
    172:/,/^## Decision 171:/' docs/DECISIONS.md | grep -q 'org transfer'
  expected: Exit 0.
  fix_if: The 172 blockquote is absent, misplaced, or a line wrap split a token; re-copy it verbatim from execution_steps
    step 4 and keep 'owner-transfer' and 'org transfer' unbroken on one line each.
  hermetic: true
  graduation: graduate
  graduation_check_id: github-org-transfer-decision-172-owner-half
- step: 4
  phase: pre-deploy
  action: Decision 218 parses as the newest entry with its typed envelope, stays within the per-entry norm, and the four annotations
    sit in their own entries.
  command: 'bin/venv-python -c "import pathlib,re; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); h=[(m.start(),int(m.group(1)))
    for m in re.finditer(r''^## Decision (\d+):'',t,re.M)]; assert h[0][1]==max(n for _,n in h), ''new entry not at top'';
    N=h[0][1]; s=t[h[0][0]:h[1][0]]; assert ''amends: [171, 172, 198]'' in s and ''value: numbered_decision'' in s, ''envelope'';
    assert len(s.encode())<=6144, len(s.encode()); sp={n:t[p:(h[i+1][0] if i+1<len(h) else len(t))] for i,(p,n) in enumerate(h)};
    [(lambda n: None if (''Decision %d'' % N) in sp[n] else (_ for _ in ()).throw(AssertionError(n)))(n) for n in (171,172,195,198)];
    print(''OK'', N, len(s.encode()))"'
  expected: Prints OK, the new Decision number and a span size at or under 6144.
  fix_if: '''new entry not at top'': insert above the current newest entry. An envelope failure: the yaml block was altered.
    Span over 6144: trim the Rationale only, and return the change to the operator because the wording was approved verbatim.
    A number named in AssertionError: first confirm whether that entry''s blockquote is present; if absent, add it verbatim
    from execution_steps step 4. NEVER edit approved annotation text to satisfy this check: a mismatch on a present blockquote
    is a defect in this check, to be escalated to the planning thread.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_decision_entry_conformance and validate_decisions_size already enforce the envelope and
    per-entry cap on new entries in both tiers; this is the plan's one-time placement check.
- step: 5
  phase: pre-deploy
  action: Index regenerated and current; corpus still parses.
  command: bin/venv-python -m scripts.decisions_index --check
  expected: Reports the index is current and exits 0.
  fix_if: 'Drift: run bin/venv-python -m scripts.decisions_index --write and commit the result; never hand-edit the JSON.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates validate_decisions_index_freshness (DCG-08), registered in both tiers.
- step: 6
  phase: pre-deploy
  action: 'Public-boundary sweep of every changed file: no 12-digit AWS ids, no e-mail addresses, no ExternalId or token shapes
    (Decision 101). The pre-commit never-commit hook is the backstop, not the check.'
  command: '! git diff origin/main -- docs/contracts/github-org-transfer.yaml docs/CLAUDE.md docs/DECISIONS.md | grep ''^+''
    | grep -Eq ''[0-9]{12}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}|ghp_|github_pat_|ExternalId'''
  expected: Exit 0 (no match).
  fix_if: 'A match is a Decision 101 breach: remove the value. The contract and Decision deliberately carry names and locations
    only.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The repository's never-commit hook and secret scanning are the standing guards; this is the plan's
    one-time diff sweep.
- step: 9
  phase: pre-deploy
  action: The created contract is identical to the approved text in execution_steps step 1, modulo the amendment_log date.
  command: 'bin/venv-python -c "import re,pathlib,yaml; p=yaml.safe_load(open(''docs/plans/PLAN-github-org-transfer-contract.yaml'',encoding=''utf-8''));
    want=p[''execution_steps''][0].split(chr(10)*2,1)[1]; got=pathlib.Path(''docs/contracts/github-org-transfer.yaml'').read_text(encoding=''utf-8'');
    n=lambda s: re.sub(r''date: .[0-9-]{10}.'',''date: X'',s); assert n(want)==n(got), ''contract differs from the approved
    text''; print(''identical'')"'
  expected: Prints identical.
  fix_if: 'Any difference is an unapproved wording change: restore the approved text. If Decision 218 was renumbered, the
    number is the only other allowed difference; confirm the diff shows nothing else.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A one-time check binding the created file to the plan's approved text; once merged the plan is
    history and the contract evolves through its own amendment_log.
- step: 7
  phase: pre-deploy
  action: Full presubmit tier, per handoff_policy.
  command: bin/venv-python -m scripts.validate
  expected: Run in the background with a timeout of at least 30 minutes (a planning-time run took over 9.5 minutes; a timeout
    is a block, never a pass). Exit 0. validate_decisions_size may print WARN amendment-delta lines for Decisions 171 and
    172 (both already over 6144 at baseline); WARN never fails.
  fix_if: Fix the named check's finding in the changed files only. A verification-registry differential failure means step
    1's command was not copied verbatim into the registry row.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: scripts.validate is the aggregate presubmit entrypoint; graduating it would recurse the harness
    into its own registry.
- step: 8
  phase: post-deploy
  action: Both bundled recs closed by the squash-merge Resolves trailer.
  command: bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f; s=[f(r)['status'] for r in
    ('rec-3905','rec-3915')]; print(s); assert s==['closed','closed'], s"
  expected: recs_by_ids('rec-3905,rec-3915') shows both rows with status closed after the merge commit's closure job.
  fix_if: 'Still open: the squash body lacked ''Resolves: rec-3905, rec-3915''; close them through scripts.ops_data_portal
    update_rec citing the merge sha.'
  hermetic: false
