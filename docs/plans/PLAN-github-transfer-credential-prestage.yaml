schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "github-transfer-credential-prestage"
intent: >-
  Pre-stage every repository-bound GitHub credential before the transfer to otl-labs/ontheloop (Decision 218) so the
  transfer strands none of them: land the transfer contract's credential wording and a register of everything minted
  for the transfer, give the PyPI publish workflow a proof_only mode that proves a Trusted Publisher without creating a
  file, retire the unused GitHub MCP PAT, and run the pre-transfer console steps on the operator's word (rec-4537;
  docs/contracts/github-org-transfer.yaml phases.pre_stage).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-github-transfer-credential-prestage.yaml
implementation_declared: true
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-4537, bundling rec-4535; no tier_item criterion claimed. Closes the
  credential gates of docs/contracts/github-org-transfer.yaml phases.pre_stage (org_policy_override, claude_github_app,
  terraform_github_plan_app install, pypi_trusted_publisher, the transfer_credentials mints, the MCP token retirement).
  Does not flip identity.phase: the transfer runbook plan's go/no-go does, citing this plan's evidence.
scope:
  - file: docs/contracts/github-org-transfer.yaml
    action: Modify
    purpose: >-
      Apply the 20 operator-approved edits verbatim by running
      /mnt/project-files/credential-reissue/draft/apply_contract_amendment.py (hash-pinned in VP 9) on this file, then
      set the new amendment_log entry's date. Adds the transfer_credentials register (five entries, each with its
      access and clean-up, the apply App's including deletion of its transfer-time private key), re-scopes the credential
      rows and re-points them off closed recs (rec-4537 pre-stage rows, rec-4538 fine_grained_pat and
      terraform_github_plan_app), names the org-owned apply App as the admin successor in terraform_github_root, adds the
      MCP token and agent-platform-github-pat to unaffected_bindings, and carries rec-4535's four corrections. After the
      console steps, fill each register entry's minted and expires from the operator's read-back (VP 23). Stays at or
      under 500 effective lines (Decision 166; 488 measured).
  - file: .github/workflows/publish-ontheloop.yml
    action: Modify
    purpose: >-
      workflow_dispatch gains input proof_only (type boolean, default false, description "Publisher proof: re-upload the
      published version; PyPI skips the duplicate and no new file is created"). The "Build distribution" step gains
      env PROOF_ONLY: ${{ inputs.proof_only }} and its single run line gains a third command, so it stays ONE effective
      line (config/composite_action_body_baseline.yaml pins publish-ontheloop.yml::publish::build-distribution at 1; no
      baseline edit): python -m pip install --upgrade build && python -m build packages/ontheloop-py && python -m
      scripts.ci.pypi_proof_only_guard ontheloop packages/ontheloop-py/dist. The publish step gains skip-existing: ${{
      inputs.proof_only }} and attestations: ${{ !inputs.proof_only }}. The header comment gains one paragraph naming
      the proof mode and the contract row. Still dispatch-only, no secret, no new permission (deploy-paths.yaml
      publish_artifacts: the credential surface is not widened).
  - file: scripts/ci/pypi_proof_only_guard.py
    action: Create
    purpose: >-
      Stdlib-only guard (the publish job installs only build; validate_workflow_dependency_install). CLI: python -m
      scripts.ci.pypi_proof_only_guard PROJECT DIST_DIR, reading env PROOF_ONLY. check(project, dist, flag, fetch) returns
      (exit_code, message): flag "false" -> (0, "PROOF_ONLY_OFF") with no network call; any other value but "true",
      including unset -> (2, "PROOF_ONLY_FLAG_INVALID: ..."); DIST_DIR missing or holding no regular file -> (1,
      "PROOF_ONLY_NO_DIST: ..."); any regular file in DIST_DIR that is not a *.whl or *.tar.gz -> (1, "PROOF_ONLY_REFUSED:
      unexpected file ...") before any network call, because the publish action uploads every file in packages-dir;
      reading the PEP 691 Simple API https://pypi.org/simple/PROJECT/ with Accept: application/vnd.pypi.simple.v1+json
      (the JSON API's releases key is deprecated) fails (URLError, timeout, bad JSON or shape) -> (1,
      "PROOF_ONLY_UNVERIFIED: ...") naming only the exception type; any file absent from the response's files[].filename
      -> (1, "PROOF_ONLY_REFUSED: ...") naming those files; else (0, "PROOF_ONLY_OK files=N"). fetch(url, headers) is
      injectable (default urllib.request, 20 s timeout) and returns the parsed JSON. main() prints the message (stderr on
      failure) and returns the code; wrong argument count returns 2. Never raises at import.
  - file: tests/test_pypi_proof_only_guard.py
    action: Create
    purpose: >-
      class TestProofOnlyGuard (Decision 131 placement): off is a no-op that never calls fetch; unset, "True" and ""
      fail closed with 2; an empty or missing dist is refused; a stray non-distribution file (a .zip beside the wheel
      and sdist) is refused even when both are on PyPI, and fetch is not called; a built file not on PyPI is refused and
      named; a fetch error fails closed as UNVERIFIED; fetch receives the Simple API URL and the PEP 691 Accept header;
      every built file published passes with files=2; main() returns 2 on a wrong
      argument count; and the module's top-level imports are all in sys.stdlib_module_names (ast scan of the file).
  - file: tests/test_ontheloop_placeholder_packages.py
    action: Modify
    purpose: >-
      New test_publish_workflow_proof_only_is_fail_safe: proof_only is boolean with default False; the "Build
      distribution" step's env PROOF_ONLY equals "${{ inputs.proof_only }}" and its run ends with the guard invocation;
      the guard's DIST_DIR argument equals the publish step's packages-dir; the build step precedes the pypa publish
      step; the publish step's skip-existing equals "${{ inputs.proof_only }}" and attestations equals "${{
      !inputs.proof_only }}"; and .github/CODEOWNERS has a row for /scripts/ci/pypi_proof_only_guard.py naming an owner.
      The existing trust-triple test is unchanged.
  - file: .github/CODEOWNERS
    action: Modify
    purpose: >-
      Add /scripts/ci/pypi_proof_only_guard.py @benjamin-blake beside the publish-ontheloop.yml row: the guard runs in
      the pypi environment job, which holds id-token: write, so an edit to it needs the same code-owner review as the
      workflow (precedent: /scripts/terraform_apply_guard.py). The person is the same as every other row (contract
      breakage_map.codeowners, rec-3903 decides any team conversion).
  - file: bin/setup-cloud-env.sh
    action: Modify
    purpose: >-
      Replace the GITHUB MCP comment block (the "GITHUB_MCP_PAT" heading through the rejected-alternative paragraph)
      with: the github-full server reads its token from ~/.config/gh-mcp/token; in a Claude Code cloud session the agent
      proxy substitutes the session's own GitHub credential on every api.github.com request, so the file holds the
      literal placeholder proxy-injected, never a PAT (retired before the otl-labs transfer;
      docs/contracts/github-org-transfer.yaml unaffected_bindings); the three-line snippet mkdir -p
      "$HOME/.config/gh-mcp", printf 'proxy-injected\n' > "$HOME/.config/gh-mcp/token" and chmod 600
      "$HOME/.config/gh-mcp/token"; the committed .mcp.json
      carries no secret; changes apply to new sessions. Comment-only: no executable line changes. The line-38 checkout
      comment is untouched (the sweep owns it). validate_licence_consistency's context pattern for this file (the old
      PAT scope comment) then matches nothing; it stays as a harmless absence check.
  - file: tests/test_setup_cloud_env.py
    action: Modify
    purpose: >-
      New test_github_mcp_token_comment_writes_the_proxy_placeholder: the script contains the exact printf line
      printf 'proxy-injected\n' > "$HOME/.config/gh-mcp/token" (as a comment) and contains no "<PAT>" and no
      "GITHUB_MCP_PAT".
  - file: config/agent/verification_registry/entries/pypi-proof-only-guard-refuses-new-files.yaml
    action: Create
    purpose: Graduation row for VP 1 (primitive_slot test_selector, guard_target scripts/ci/pypi_proof_only_guard.py).
  - file: config/agent/verification_registry/entries/publish-workflow-proof-only-fail-safe.yaml
    action: Create
    purpose: Graduation row for VP 2 (primitive_slot test_selector, guard_target .github/workflows/publish-ontheloop.yml).
  - file: config/agent/verification_registry/entries/setup-cloud-env-mcp-token-placeholder.yaml
    action: Create
    purpose: Graduation row for VP 3 (primitive_slot test_selector, guard_target bin/setup-cloud-env.sh).
bundled_recommendations:
  - rec-4537
  - rec-4535
followon_recs:
  - rec-4538
  - rec-4539
infrastructure_dependencies:
  - >-
    No Terraform. Console and admin steps, each on the operator's typed word: otl-labs organisation settings, two GitHub
    App installations, one new GitHub App, one fine-grained PAT, one PyPI publisher, two cloud-environment setup scripts,
    one PAT revocation, and one new Secrets Manager entry created by the operator in AWS CloudShell (about USD 0.40 a
    month; always-ask spend).
acceptance_criteria:
  - >-
    docs/contracts/github-org-transfer.yaml carries the 20 approved edits verbatim (variance: the amendment_log date and
    the register's minted and expires values), validate_github_org_transfer is green, and the file has at most 500
    effective lines.
  - >-
    publish-ontheloop.yml has a boolean proof_only input defaulting to false; the guard runs inside the one-line build
    step; skip-existing and attestations are bound to the input; the guard is off without a network call when false,
    refuses any file that is not a wheel or sdist already on PyPI when true, and fails closed on a bad flag, an empty
    dist or a PyPI read error; the guard is code-owned like the workflow.
  - bin/setup-cloud-env.sh instructs the proxy-injected placeholder and no PAT.
  - >-
    The pre-transfer console steps (org policies, Claude App and plan App on otl-labs with All repositories, second PyPI
    publisher, GHAS_PROBE_TOKEN successor minted and held, terraform/github apply App created, installed and its key in a
    new Secrets Manager entry) are each done on the operator's word, read back, and recorded in
    /mnt/project-files/credential-reissue/EVIDENCE.md; the register's minted and expires are filled.
  - >-
    The GitHub MCP token file holds proxy-injected in DEV and ADMIN, a fresh session in each passes readiness and one
    github-full read, and the old MCP PAT is revoked.
  - >-
    After merge, one proof_only dispatch from main on the current path is green with PROOF_ONLY_OK in its log, and PyPI
    still lists exactly the two 0.0.0 files.
  - >-
    rec-4535 is closed by the merge's Resolves trailer; rec-4537 (bundled, not in the trailer) is closed through the
    portal after the proof_only run.
  - No token value, private key, App or installation id, account id or ARN appears in any changed line, PR text or shared file.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The guard's behaviour, red before (the test file does not exist) and green after.
    command: bin/venv-python -m pytest tests/test_pypi_proof_only_guard.py::TestProofOnlyGuard -q
    expected: Exit 0, every TestProofOnlyGuard test passing.
    fix_if: Fix the guard, never the test's intent; the off path must never touch the network.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: pypi-proof-only-guard-refuses-new-files
  - step: 2
    phase: pre-deploy
    action: The publish workflow's proof mode is fail-safe, red before (the node does not exist) and green after.
    command: bin/venv-python -m pytest tests/test_ontheloop_placeholder_packages.py::test_publish_workflow_proof_only_is_fail_safe -q
    expected: Exit 0.
    fix_if: Match the workflow to the scope row exactly; keep the build step's run body on one line.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: publish-workflow-proof-only-fail-safe
  - step: 3
    phase: pre-deploy
    action: The setup script's MCP comment instructs the placeholder, red before (the node does not exist) and green after.
    command: bin/venv-python -m pytest tests/test_setup_cloud_env.py::test_github_mcp_token_comment_writes_the_proxy_placeholder -q
    expected: Exit 0.
    fix_if: Re-copy the snippet from the scope row; no PAT wording may remain.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: setup-cloud-env-mcp-token-placeholder
  - step: 4
    phase: pre-deploy
    action: >-
      The contract carries the new shape: five register entries, the four GitHub ones with access "all repositories" and
      the PyPI publisher scoped to project ontheloop (the pre-transfer state), the apply App's clean-up deleting its
      transfer-time key, the re-pointed recs, the MCP token and
      agent-platform-github-pat in unaffected_bindings, seven pre_stage procedure steps, checklist step 2 HUMAN, and at
      most 500 effective lines; the apply script's .edits.json side file is not left in the tree.
    command: >-
      test ! -e docs/contracts/github-org-transfer.edits.json &&
      bin/venv-python -c "import yaml; t=open('docs/contracts/github-org-transfer.yaml').read(); c=yaml.safe_load(t);
      r=c['transfer_credentials']; assert [e['access'] for e in r]==['all repositories']*4+['project ontheloop'], r;
      assert any('delete its transfer-time private key' in e['cleanup'] for e in r);
      rows={b['id']: b for b in c['breakage_map']};
      assert [rows[i]['rec'] for i in ('org_policy_override','claude_github_app','pypi_trusted_publisher','fine_grained_pat','terraform_github_plan_app')]==['rec-4537','rec-4537','rec-4537','rec-4538','rec-4538'];
      u=' '.join(c['unaffected_bindings']); assert 'proxy-injected' in u and 'agent-platform-github-pat' in u;
      assert [s['step'] for s in c['procedure']['pre_stage']]==[1,2,3,4,5,6,7];
      assert c['procedure']['transfer_window_checklist'][1]['tag']=='HUMAN';
      n=sum(1 for l in t.splitlines() if l.strip() and not l.strip().startswith('#')); assert n<=500, n; print('CONTRACT_SHAPE_OK', n)"
    expected: Exit 0 and the shape marker with the effective line count printed.
    fix_if: Re-run the pinned apply script on the base contract (VP 9); never hand-edit a row to pass.
    hermetic: true
    expected_literals:
      - CONTRACT_SHAPE_OK
    graduation: waive
    graduation_waiver_reason: >-
      It asserts the pre-transfer state, which rec-4538's clean-up changes by design (every access narrows to ontheloop),
      so a standing copy would break on the planned next step.
  - step: 5
    phase: pre-deploy
    action: The contract's registered evaluator is green on the real tree.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_github_org_transfer import validate_github_org_transfer as v;
      f=[]; v(f); assert not f, f; print('ORG_TRANSFER_CHECK_OK')"
    expected: Exit 0 and the check marker printed.
    fix_if: The failure names the row or list that disagrees; fix the contract text against the approved draft.
    hermetic: true
    expected_literals:
      - ORG_TRANSFER_CHECK_OK
    graduation: waive
    graduation_waiver_reason: The check is already registered and runs in both tiers; a registry copy would duplicate it.
  - step: 6
    phase: pre-deploy
    action: >-
      The bundled rec-4535's stored acceptance oracle holds on the committed tree before push, so the merge's Resolves
      trailer closes it (Decision 201). Verbatim from the warehouse, read 2026-10-21.
    command: >-
      ! grep -q 'plan (rec-3903, rec-3136)' docs/contracts/github-org-transfer.yaml && grep -q '"rec-4355: '
      docs/contracts/github-org-transfer.yaml && ! grep -q 'a second after the re-import reads 0 to change\.$'
      docs/contracts/github-org-transfer.yaml
    expected: Exit 0 on the amended contract (it fails on main today).
    fix_if: Re-read rec-4535's acceptance with recs_by_ids in case it changed; fix the contract, never the oracle.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: It is the rec's own closure oracle, evaluated at merge by ci.yml's trailer job; a registry copy would duplicate that gate.
  - step: 7
    phase: pre-deploy
    action: No secret value lands in the diff (Decision 101); names and dates only.
    command: >-
      ! git diff origin/main...HEAD | grep -E '^\+' | grep -qE
      'github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|BEGIN [A-Z ]*PRIVATE KEY|\bIv[0-9A-Za-z.]{16,}' && echo NO_SECRET_VALUES
    expected: NO_SECRET_VALUES printed.
    fix_if: Remove the value from history before any push (amend the unpushed commit); if pushed, revoke the credential first and tell the operator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: PR-relative and vacuous once merged; the never-commit pre-commit hook is the standing guard.
  - step: 8
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Forward-fix on the branch (Decision 55); never skip, disable or quarantine a test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Graduating the fast tier would register a check identical to the tier that runs it.
  - step: 9
    phase: pre-deploy
    action: >-
      VERBATIM CHECK of the operator-approved contract wording (acceptance criterion 1). The two drafts must still hash to
      the values pinned at approval, then every Edit's After block of draft/contract-amendment.md appears in the contract
      once the date placeholder takes the entry's real date and minted and expires values are normalised. The drafts live
      in the shared folder, so this runs in the build session, not in CI.
    command: |-  # pragma: allowlist secret
      bin/venv-python - <<'PY'
      import hashlib, pathlib, re, yaml
      D = pathlib.Path('/mnt/project-files/credential-reissue/draft')
      PIN = {
          'contract-amendment.md': '22ea78b2901f94ae4e11c3f288e93514dd4dcb579f1ffe2ed408af25dae6f4ce',
          'apply_contract_amendment.py': '2c86d038ae067b0ac4401a584b184ee77bd9fb1e176bf95feaeda345aed3d113',
      }
      for name, digest in PIN.items():
          assert hashlib.sha256((D / name).read_bytes()).hexdigest() == digest, 'draft changed since approval: ' + name
      norm = lambda t: re.sub(r'(minted|expires): (?:"[^"]*"|[^,}]+)', r'\1: X', t)
      c = pathlib.Path('docs/contracts/github-org-transfer.yaml').read_text()
      assert '2026-10-DD' not in c, 'amendment_log date not set'
      date = str(yaml.safe_load(c)['amendment_log'][-1]['date'])
      for sec in (D / 'contract-amendment.md').read_text().split('\n## Edit ')[1:]:
          blk = re.search(r'```yaml\n(.*?)```', sec.split('After:')[1], re.S).group(1).rstrip('\n').replace('2026-10-DD', date)
          assert norm(blk) in norm(c), 'contract edit not verbatim: Edit ' + sec.split(':', 1)[0]
      print('approved-texts-verbatim')
      PY
    expected: approved-texts-verbatim printed.
    fix_if: >-
      A hash mismatch means a draft changed after approval: STOP and ask the coordinator, never re-pin on your own. A
      verbatim miss: re-run the apply script on origin/main's contract; a wording change goes to the operator first.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: >-
      Full tier on the COMMITTED clean tree after the rebase, then --verify-head (docs/contracts/git-ops.yaml
      handoff_sequence; Decision 203's push gate). It runs for about ten minutes: run it in the background with a timeout
      of 30 minutes or more; a timeout blocks, it never passes. Every fix or rebase commit needs a fresh run.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Exit 0 with an empty failed-checks list, then --verify-head attests HEAD's tree.
    fix_if: Forward-fix on the branch (Decision 55).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Structurally enforced by validate_handoff_full_tier; graduating it would duplicate the tier.
  - step: 11
    phase: pre-deploy
    action: >-
      Open the PR (ready for review) once VP 1-10 pass, and record PR_NUMBER in the state file. The console steps (VP
      12-22) run while it is open; none needs the code, so their order is free except where a step names a predecessor.
    command: >-
      set -a && . "$HOME/.credential-prestage/state.env" && set +a && test -n "$PR_NUMBER" && echo "PR_OPEN $PR_NUMBER"
    expected: PR_OPEN and the number printed.
    fix_if: Create the state file (mode 600, outside the repository and the shared folder) and append PR_NUMBER.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: pre-deploy
    action: >-
      CONSOLE, operator's word (procedure.pre_stage step 2, breakage_map.org_policy_override). In otl-labs Settings: Actions
      general: allow all actions; workflow permissions read-only; Actions may not create or approve pull requests;
      fork pull request workflows from outside collaborators require approval for all outside collaborators. Personal
      access tokens: fine-grained allowed, no administrator approval; classic allowed; fine-grained maximum lifetime 366
      days (the contract's "up to 366 days"). Authentication security: require two-factor authentication. The operator
      reads each value back in
      the thread (agents cannot read organisation settings through the proxy); record the read-back under "## VP 12" in
      EVIDENCE.md with the operator's message id.
    command: >-
      bin/venv-python -c "import re; t=open('/mnt/project-files/credential-reissue/EVIDENCE.md').read();
      s=t.split('\n## VP 12 ',1)[1].split('\n## ',1)[0];
      assert len(set(re.findall(r'cmsg_[0-9A-Za-z]{20,}', s)))>=2 and all(k in s for k in ('read-only', '366', 'two-factor', 'approval')), s;
      print('VP12_RECORDED')"
    expected: VP12_RECORDED printed; the section cites at least two operator messages (the word on the step and the read-back) and carries the read-back values.
    fix_if: A value that cannot be set as listed (for example the lifetime control is absent on the plan tier) goes to the operator; never record a value not read back.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: pre-deploy
    action: >-
      CONSOLE, operator's word (procedure.pre_stage step 3). Install the Claude GitHub App on otl-labs with All
      repositories. Read back: the otl-labs installation page shows All repositories. Record under "## VP 13".
    command: >-
      bin/venv-python -c "import re; t=open('/mnt/project-files/credential-reissue/EVIDENCE.md').read();
      s=t.split('\n## VP 13 ',1)[1].split('\n## ',1)[0];
      assert len(set(re.findall(r'cmsg_[0-9A-Za-z]{20,}', s)))>=2 and all(k in s for k in ('All repositories',)), s;
      print('VP13_RECORDED')"
    expected: VP13_RECORDED printed; the section cites at least two operator messages (the word on the step and the read-back) and carries the read-back values.
    fix_if: The personal installation is never touched in this plan; if the org install fails, report it, do not retry with a narrower scope.
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: pre-deploy
    action: >-
      CONSOLE, operator's word (procedure.pre_stage step 3). Install the terraform/github plan App (public until the
      transfer) on otl-labs with All repositories. No workflow edit: create-github-app-token resolves the running
      repository's installation. Read back on the installation page. Record under "## VP 14".
    command: >-
      bin/venv-python -c "import re; t=open('/mnt/project-files/credential-reissue/EVIDENCE.md').read();
      s=t.split('\n## VP 14 ',1)[1].split('\n## ',1)[0];
      assert len(set(re.findall(r'cmsg_[0-9A-Za-z]{20,}', s)))>=2 and all(k in s for k in ('All repositories',)), s;
      print('VP14_RECORDED')"
    expected: VP14_RECORDED printed; the section cites at least two operator messages (the word on the step and the read-back) and carries the read-back values.
    fix_if: Leave the personal installation and the App's key unchanged; uninstalling, making it private and rotating its key are rec-4538's.
    hermetic: false
    graduation: not-applicable
  - step: 15
    phase: pre-deploy
    action: >-
      CONSOLE, operator's word (procedure.pre_stage step 4). On pypi.org, project ontheloop, Publishing: add a GitHub
      publisher with owner otl-labs, repository ontheloop, workflow publish-ontheloop.yml, environment pypi. The existing
      publisher stays. Read back: the publishing page lists both. Record under "## VP 15".
    command: >-
      bin/venv-python -c "import re; t=open('/mnt/project-files/credential-reissue/EVIDENCE.md').read();
      s=t.split('\n## VP 15 ',1)[1].split('\n## ',1)[0];
      assert len(set(re.findall(r'cmsg_[0-9A-Za-z]{20,}', s)))>=2 and all(k in s for k in ('otl-labs/ontheloop', 'publish-ontheloop.yml', 'pypi')), s;
      print('VP15_RECORDED')"
    expected: VP15_RECORDED printed; the section cites at least two operator messages (the word on the step and the read-back) and carries the read-back values.
    fix_if: If PyPI rejects the owner, the organisation name is wrong or not yet public; stop and report, never register a different owner.
    hermetic: false
    graduation: not-applicable
  - step: 16
    phase: pre-deploy
    action: >-
      CONSOLE, operator's word, after VP 12 (the organisation's 366-day maximum must be set first; procedure.pre_stage
      step 5; breakage_map.fine_grained_pat). Mint the GHAS_PROBE_TOKEN
      successor: fine-grained PAT, resource owner otl-labs, All repositories, permissions Administration read, Secret
