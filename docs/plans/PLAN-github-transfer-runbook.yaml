      assert any(ln.startswith('+') for ln in changed), 'no comment line added'
      P = 'docs/contracts/account-credential-inventory.yaml'
      inv, base = yaml.safe_load(open(P, encoding='utf-8')), yaml.safe_load(git('show', f'origin/main:{P}'))
      rows, brows = ({r['id']: r for r in d['rows']} for d in (inv, base))
      assert rows['GH-01'] == dict(brows['GH-01'], status='moved', owner_today='company', location='GitHub, the otl-labs organisation'), 'GH-01 differs from the planned flip'
      assert {k: x for k, x in rows.items() if k != 'GH-01'} == {k: x for k, x in brows.items() if k != 'GH-01'} and inv['billing'] == base['billing'], 'other rows changed'
      n = len(base['evidence_ledger'])
      assert inv['evidence_ledger'][:n] == base['evidence_ledger'], 'inventory ledger is not append-only'
      assert sorted((e['row'], e['status']) for e in inv['evidence_ledger'][n:]) == [('GH-01', 'moved'), ('GH-11', 'stays')]
      I1 = re.compile(r"PLAN-github-transfer-runbook \(rec-4550, PR #[0-9]+\): GH-01 flips to moved \(owner_today company, location the otl-labs organisation\) after the transfer and rename to otl-labs/ontheloop; GH-11 is re-read on the new path and stays\.")
