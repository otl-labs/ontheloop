schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: github-transfer-runbook
intent: >-
  Move benjamin-blake/theseus into the otl-labs organisation as ontheloop in one transfer-and-rename (Decision 218)
  and prove it live, executing docs/contracts/github-org-transfer.yaml from the go/no-go to the prove phase's live
  proofs: an operator rehearsal on a throwaway repository that checks the staged otl-labs owner id against the
  repository_owner_id claim from the GitHub OIDC issuer (rec-4356); path-agnostic cloud setup scripts; the
  operator-approved contract amendment and the go/no-go (identity.phase pre_staged); the freeze, the transfer and the
  window checklist (identity.phase transferred); the live proofs on the new path, recorded in evidence_ledger with the
  inventory flips. It stops at transferred: the proven flip lands with rec-4355's re-key, and every predecessor
  removal is a later plan (rec-4551, rec-4538, rec-3903).
implementation_declared: true
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-github-transfer-runbook.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-4550, bundling rec-4356; no tier_item criterion claimed. Executes
  docs/contracts/github-org-transfer.yaml phases.transfer and the live half of phases.prove (tracking.executed_by).
scope:
  - file: docs/contracts/github-org-transfer.yaml
    action: Modify
    purpose: >-
      PR A: the operator-approved amendment applied by the pinned generator (draft/make_draft.py), the P1
      amendment_log line, identity.phase pre_staged with staged_phase removed, evidence_ledger entries E1 and E2.
      PR B: the P2 amendment_log line, identity.phase transferred, entry E3. PR C: the P3 amendment_log line (the
      contract-drift check needs one for every change) and entry E4. Nothing else.
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: >-
      PR B: GH-01 moved (owner_today company, location "GitHub, the otl-labs organisation"), a GH-11 re-read entry and
      the I1 amendment_log entry. PR C: GH-01, GH-05, GH-06, GH-10 and REG-02 proven (owner_today company), GH-06's
      expires set to the successor's "2027-10-22" (public in transfer_credentials) and the I2 amendment_log entry. One
      evidence_ledger entry per row change (maintenance.stage_rule); the drift check needs the amendment_log entries.
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-
      PR B only: a comment-only refresh of the IMMUTABLE-SUBJECT paragraph so it names the move (its "now presents"
      sentence goes stale at the transfer), so the window PR gets a speculative plan (planner role, pull-request form)
      and an advisory convergence status (pr role), and its merge runs the sandbox apply (apply role). No HCL change;
      both trust lists byte-identical.
  - file: tests/checks/contracts/test_validate_account_credential_inventory.py
    action: Modify
    purpose: >-
      PR A: the pinned patch draft/inventory-test-dates.diff (sha256 212eb40f) dates the tests' appended ledger entries
      from the real ledger's latest entry instead of a hard-coded 2026-10-22, so PR B's later-dated entries do not turn
      two tests red mid-window. Skip it if main already carries the fix.
  - file: docs/plans/PLAN-github-transfer-runbook.yaml
    action: Modify
    purpose: PR A sets implementation_declared true.
bundled_recommendations: [rec-4550, rec-4356]
followon_recs: [rec-4355, rec-4551, rec-4538, rec-4549]
infrastructure_dependencies:
  - >-
    No Terraform change and no agent-run apply (Decision 126). Live surfaces, each on the operator's typed word:
    the GitHub transfer-and-rename, a throwaway public rehearsal repository (created, transferred, deleted), the DEV
    and ADMIN cloud-environment setup scripts, both Claude Code projects' repository bindings, the
    dependabot-auto-merge workflow state, the GHAS_PROBE_TOKEN secret value, a Codespaces prebuild configuration, and
    CI dispatches on the new path (terraform-drift, tf-gated-apply-prototype, deploy-ducklake-lambdas,
    publish-ontheloop proof_only, ghas-probe). The window PR's merge runs the sandbox apply on a comment-only diff.
acceptance_criteria:
  - >-
    The operator-approved contract amendment (2026-10-22) lands verbatim through the pinned generator, with only the
    amendment date, P1 to P3, the phase lines and the appended evidence varying (VP 7); the contract stays at or
    under 500 effective lines and validate_github_org_transfer is green in every PR.
  - >-
    The rehearsal printed ISS_OK and OWNER_ID MATCH after its transfer into otl-labs, its carry-over was read and
    recorded, and it was deleted; rec-4356's acceptance holds and it closes through PR A's trailer.
  - >-
    The go/no-go (E1, E2) is on main with identity.phase pre_staged before the transfer; the transfer and rename
    happened in one operation; checklist steps 1-7 are recorded (E3) and identity.phase is transferred; step 8's
    post-merge apply and CI on main are green and dependabot-auto-merge is re-enabled.
  - >-
    The live proofs of phases.prove gate 1 that this plan owns are recorded (E4) with run URLs: gated-apply prototype
    waited for its reviewer, drift, DuckLake deploy with its maintenance smoke, proof_only publish on the new
    publisher, @claude answered, the Dependabot job ran under the new full name, a fresh thread cloned, pushed and
    opened a PR, and RoleLastUsed after the transfer for all five CI roles (a lagging role only on its assume step's
    success in a post-transfer run); rec-4550 closes through PR C's trailer.
  - >-
    The inventory rows flip per maintenance.stage_rule (GH-01 moved then proven; GH-05, GH-06, GH-10, REG-02
    proven; GH-11 re-read) with the I1 and I2 amendment_log entries, and validate_account_credential_inventory and its
    tests are green.
  - >-
    No predecessor is removed (both OIDC segments, the old PyPI publisher, old tokens, the personal App installation
    and the old clone path stay), and no numeric id, ARN, token or e-mail address appears in a commit, ledger entry,
    shared file or chat message.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Start conditions, before any console step. This plan is on main; PR 1610's inventory flips are on main (GH-05,
      GH-06, GH-10 and REG-02 pre-staged, GH-01 personal); no open critical CI-RCA rec. Also confirm, outside the
      command: with the coordinator, that the scrub build (rec-3924) has merged or will not start before the window
      ends (its merge deploys Lambdas); with the GitHub MCP tools, that no open PR touches terraform/personal/oidc.tf
      (roadmap T2.48). Create /mnt/project-files/transfer-runbook/state.env (KEY=VALUE lines; PR numbers, SHAs,
      run ids and UTC timestamps only) and EVIDENCE.md (headings "## VP NN <title>"; names, flags, run URLs and
      message ids, never an id or value).
    command: |-
      bin/venv-python - <<'PY'
      import yaml
      from src.common.ducklake_reader_client import make_reader
      inv = yaml.safe_load(open('docs/contracts/account-credential-inventory.yaml', encoding='utf-8'))
      st = {r['id']: r['status'] for r in inv['rows']}
      want = {'GH-01': 'personal', 'GH-05': 'pre-staged', 'GH-06': 'pre-staged', 'GH-10': 'pre-staged', 'REG-02': 'pre-staged'}
      bad = {k: st.get(k) for k, v in want.items() if st.get(k) != v}
      assert not bad, f'inventory start state differs: {bad}'
      crit = [r['id'] for r in make_reader().named('ci_rca_open') if str(r.get('priority')).lower() == 'critical']
      assert not crit, f'open critical CI-RCA recs: {crit}'
      print('START_OK')
      PY
    expected: START_OK printed.
    fix_if: >-
      An inventory difference means PR 1610 has not merged or changed: wait, or ask the coordinator. An open critical
      CI-RCA rec halts dispatches (WAYS-OF-WORKING section 7): ask the operator once whether the window waits.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      REHEARSAL, before its transfer (HUMAN, operator's word; rec-4356, contract procedure.pre_stage 8). Check the
      pinned workflow draft, then give the operator its text. The operator creates a public repository under the
      personal account (any name except theseus or ontheloop), commits the file as
      .github/workflows/oidc-owner-check.yml, adds an environment with a required reviewer (the operator), a branch
      ruleset with the admin bypass role, one secret and one variable (dummy values), and dispatches the workflow.
      Record the log's flag lines in EVIDENCE.md as one line starting "REHEARSAL_BEFORE" (expected ISS_OK,
      OWNER_LOGIN benjamin-blake, OWNER_ID MATCH: the personal entry is checked the same way).
    command: >-
      echo "2cf5752739fbc429cbf77008b726a1a5659f35deed10eeee34845a6aca1fd261
      /mnt/project-files/transfer-runbook/draft/rehearsal-oidc-owner-check.yml" | sha256sum -c - && grep -q
      '^REHEARSAL_BEFORE .*ISS_OK.*OWNER_ID MATCH' /mnt/project-files/transfer-runbook/EVIDENCE.md && echo
      REHEARSAL_BEFORE_OK
    expected: REHEARSAL_BEFORE_OK printed.
    fix_if: >-
      A hash miss means the draft changed after planning: STOP and ask the coordinator. TOKEN_UNAVAILABLE: the
      workflow lacks id-token write. ISS_BAD or MISMATCH before the transfer: the parser or the personal entry is
      wrong; STOP and report, never edit oidc.tf.
    hermetic: false
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: >-
      REHEARSAL transfer and carry-over read (HUMAN, operator's word per action). The operator transfers the
      rehearsal repository into otl-labs with a rename in one operation (the same Settings flow as the real one) and
      dispatches the workflow again: record "REHEARSAL_AFTER" with the flags (rec-4356 is met by ISS_OK, OWNER_LOGIN
      otl-labs, OWNER_ID MATCH; IAM trust matches the sub claim, so SUB_FORMAT immutable and SUB_OWNER_CONSISTENT yes
      are required too). Then the operator reads in Settings and records, one line each: the environment and
      its required reviewer, the ruleset and its bypass actor, the secret name, the variable name, the Actions
      general and workflow-permission settings, and the workflow's enabled state ("CARRY <item> present|absent"),
      plus the organisation rulesets the repository now inherits ("CARRY org rulesets <n>").
      The build session tries list_repos and add_repo (this session only, never save_to_project, so nothing persists)
      for the moved repository and records "ADD_REPO ok|refused".
      The operator confirms the personal claude.ai account's repository picker lists the moved repository
      ("CLAUDE_AI_LISTS_OTL_LABS"; if not, reconnect GitHub on that account now, outside any window). Then the
      operator deletes the rehearsal repository ("REHEARSAL_DELETED"). Tell the coordinator the carry-over is
      recorded: rec-4355 may be planned from it (operator, 2026-10-22, Fork 2 A).
    command: >-
      E=/mnt/project-files/transfer-runbook/EVIDENCE.md && grep -q '^REHEARSAL_AFTER .*ISS_OK.*OWNER_LOGIN
      otl-labs.*OWNER_ID MATCH.*SUB_FORMAT immutable.*SUB_OWNER_CONSISTENT yes' "$E" && test "$(grep -c '^CARRY ' "$E")" -ge 7 && grep -q '^CARRY org rulesets ' "$E" && grep -q '^ADD_REPO ' "$E" && grep
      -q '^CLAUDE_AI_LISTS_OTL_LABS' "$E" && grep -q '^REHEARSAL_DELETED' "$E" && echo REHEARSAL_OK
    expected: REHEARSAL_OK printed.
    fix_if: >-
      OWNER_ID MISMATCH after the transfer means the staged otl-labs id is wrong: STOP, no go/no-go; tell the operator
      and the coordinator (the trust lists are corrected through the OIDC pre-stage path, rec-3902 precedent, never
      here). An item "absent" after the move is a real-window risk: record it and add its recreate step to the window
      notes before the go/no-go.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      SETUP SCRIPTS (HUMAN, operator's word; contract procedure.pre_stage 9). The operator replaces the guarded cd in
      the DEV and ADMIN setup scripts with the pinned draft/setup-snippet.sh (verbatim; its hash is checked first). Never read a setup script back through
      an environment tool (rec-4510). Then a fresh session in each environment runs: test -f bin/setup-cloud-env.sh
      && test -x .venv/bin/python && echo "SETUP_PATH_OK $(pwd)"; record "SETUP_PATH_OK DEV" and "SETUP_PATH_OK
      ADMIN" with the operator's message ids.
    command: >-
      echo "fd2f95626cd03192b700c629a585c96ef9e78fb521b52d3ae6904890d1558d2c
      /mnt/project-files/transfer-runbook/draft/setup-snippet.sh" | sha256sum -c - && grep -q '^SETUP_PATH_OK DEV'
      /mnt/project-files/transfer-runbook/EVIDENCE.md && grep -q '^SETUP_PATH_OK ADMIN'
      /mnt/project-files/transfer-runbook/EVIDENCE.md && echo SETUP_SCRIPTS_OK
    expected: SETUP_SCRIPTS_OK printed.
    fix_if: >-
      A session that fails to start, or has no .venv, means the snippet was not pasted verbatim or setup-cloud-env.sh
      failed (the snippet passes its exit code through, and a non-zero exit blocks session start): the operator
      re-edits, or the build session finds why the setup run failed. A hash miss: STOP and ask the coordinator. Never
      print a script's contents.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: >-
      CODESPACES (HUMAN, operator's word; procedure.pre_stage 9). The operator deletes any Codespaces prebuild
      configuration of the repository (it has no devcontainer, and once org-owned a prebuild fails or bills the
      organisation) and records "CODESPACES_PREBUILD_NONE".
    command: grep -q '^CODESPACES_PREBUILD_NONE' /mnt/project-files/transfer-runbook/EVIDENCE.md && echo CODESPACES_OK
    expected: CODESPACES_OK printed.
    fix_if: If the operator finds none, record the line with "none found".
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      SNAPSHOT for the go/no-go (procedure.pre_stage 10): the pinned projection of what the agent proxy serves
      (repository settings with security_and_analysis, rulesets with bypass actors, workflow states), id-free.
    command: >-
      echo "eb7f24b141e727fdf29aad1eb2424b9a5da2093be46d1965d80f099170f208c9
      /mnt/project-files/transfer-runbook/draft/snapshot_projection.py" | sha256sum -c - && mkdir -p
      /mnt/project-files/transfer-runbook/snapshot && bin/venv-python -I
      /mnt/project-files/transfer-runbook/draft/snapshot_projection.py snapshot benjamin-blake/theseus
      /mnt/project-files/transfer-runbook/snapshot/pre-stage.json
    expected: SNAPSHOT_WRITTEN printed.
    fix_if: >-
      READ_FAILED names the path the proxy refused: record it and treat that read as HUMAN in the window. A hash miss:
      STOP and ask the coordinator.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      VERBATIM CHECK (repeat in PR B and PR C). PR A is built after VP 2-6: run the pinned generator on the base
      contract (it refuses a base whose evidence_ledger is not the approved two entries), write AMEND_DATE to
      state.env and set the amendment date to it, add P1 directly after W1, set identity.phase pre_staged and delete
      the staged_phase line, append E1 and E2 (context templates, filled from EVIDENCE.md) as the last ledger entries,
      and set implementation_declared true last. The command rebuilds the expected file from the generator's output on
      the merge base and requires HEAD to equal it. In PR B and PR C it starts from main's contract and allows only P2
      as the last amendment_log entry, the phase flip to transferred and at most one ledger line (E3, phase transfer)
      in PR B, and P3 as the last amendment_log entry and exactly one ledger line (E4, phase prove) in PR C. Allowed
      variance (operator, 2026-10-22): dates and PR numbers; the rec ids are already substituted.
    command: |-  # pragma: allowlist secret
      set -a && . /mnt/project-files/transfer-runbook/state.env && set +a && bin/venv-python - <<'PY'
      import datetime, hashlib, os, pathlib, re, subprocess, sys, tempfile, yaml
      D = pathlib.Path('/mnt/project-files/transfer-runbook/draft')
      P = 'docs/contracts/github-org-transfer.yaml'
      APPEND = '# Append-only.'
      def git(*a):
          return subprocess.run(['git', *a], capture_output=True, text=True, check=True).stdout
      def note(summary):
          return re.compile(r'  - \{date: "(\d{4}-\d{2}-\d{2})", semantic_break: false, change_class: governance_note_add, summary: "' + re.escape(summary) + r'"\}')
      P1 = note('PLAN-github-transfer-runbook (rec-4550): go/no-go recorded in evidence_ledger; identity.phase pre_staged and staged_phase cleared.')
      P2 = note('PLAN-github-transfer-runbook (rec-4550): the repository moved to otl-labs/ontheloop; identity.phase transferred (evidence_ledger, window checklist 1-7).')
      P3 = note('PLAN-github-transfer-runbook (rec-4550): window checklist 8 and the live proofs of phases.prove gate 1 recorded in evidence_ledger; identity.phase stays transferred until rec-4355.')
      def entry(line, phase):
          assert line.startswith('  - {'), 'expected a ledger entry line'
          e = yaml.safe_load(line)[0]
          assert set(e) == {'date', 'phase', 'gate', 'observation', 'evidence_path'} and e['phase'] == phase, (phase, sorted(e))
          datetime.date.fromisoformat(e['date'])
          return line
      def with_ledger(lines, new):
          i = next(k for k, ln in enumerate(lines) if ln.startswith(APPEND))
          return lines[:i] + new + lines[i:]
      def log_end(lines):
          a = lines.index('amendment_log:')
          return next(k for k in range(a + 1, len(lines)) if not lines[k].strip())
      head = pathlib.Path(P).read_text(encoding='utf-8').splitlines()
      main = git('show', f'origin/main:{P}').splitlines()
      ai = next(k for k, ln in enumerate(head) if ln.startswith(APPEND))
      if '  phase: pre_transfer' in main:
          stage = 'A'
          assert hashlib.sha256((D / 'make_draft.py').read_bytes()).hexdigest() == 'f52f7663bc0df40aaed7fce99f652155eb0562402643de7ebaa38b60c9fbfe27', 'generator changed since approval'
          amend = os.environ['AMEND_DATE']
          datetime.date.fromisoformat(amend)
          base = git('merge-base', 'origin/main', 'HEAD').strip()
          with tempfile.TemporaryDirectory() as t:
              src, out = pathlib.Path(t, 'base.yaml'), pathlib.Path(t, 'out.yaml')
              src.write_text(git('show', f'{base}:{P}'), encoding='utf-8')
              subprocess.run([sys.executable, '-I', str(D / 'make_draft.py'), str(src), str(out)], check=True, capture_output=True)
              gen = out.read_text(encoding='utf-8').splitlines()
          w1 = [k for k, ln in enumerate(gen) if '"2026-10-DD"' in ln]
          assert len(w1) == 1, 'generator output changed'
          exp = [ln.replace('"2026-10-DD"', f'"{amend}"') for ln in gen]
          m = P1.fullmatch(head[w1[0] + 1])
          assert m and m.group(1) == amend, 'P1 missing, reworded, misdated or misplaced'
          exp.insert(w1[0] + 1, head[w1[0] + 1])
          exp[exp.index('  phase: pre_transfer')] = '  phase: pre_staged'
          exp.remove('  staged_phase: pre_staged')
          new = [entry(head[ai - 2], 'pre_stage'), entry(head[ai - 1], 'transfer')]
      else:
          exp = list(main)
          if '  phase: pre_staged' in main:
              stage = 'B'
              k = log_end(main)
              assert P2.fullmatch(head[k]), 'P2 missing, reworded or not the last amendment_log entry'
              exp.insert(k, head[k])
              exp[exp.index('  phase: pre_staged')] = '  phase: transferred'
              n = len(head) - len(exp)
              assert n in (0, 1), f'PR B adds {n} lines beyond P2 and E3'
              new = [entry(head[ai - 1], 'transfer')] if n else []
          else:
              stage = 'C'
              k = log_end(main)
              assert P3.fullmatch(head[k]), 'P3 missing, reworded or not the last amendment_log entry'
              exp.insert(k, head[k])
              new = [entry(head[ai - 1], 'prove')]
      exp = with_ledger(exp, new)
      diffs = [k + 1 for k, (a, b) in enumerate(zip(head, exp)) if a != b]
      assert head == exp, f'HEAD differs from the approved text at lines {diffs[:5]} (lengths {len(head)}, {len(exp)})'
      print('APPROVED_TEXT_VERBATIM', stage, len(new))
      PY
    expected: >-
      APPROVED_TEXT_VERBATIM A 2 in PR A; APPROVED_TEXT_VERBATIM B 0 before E3 and B 1 after it in PR B;
      APPROVED_TEXT_VERBATIM C 1 in PR C.
    fix_if: >-
      A listed line is wording that differs from the approval: restore it from the generator. Any wording change goes
      to the coordinator, then the operator, before merge. Never re-pin the hash yourself.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: >-
      The contract at PR A has the approved shape, the go/no-go evidence and phase pre_staged, within the size cap.
    command: |-
      bin/venv-python - <<'PY'
      import yaml
      t = open('docs/contracts/github-org-transfer.yaml', encoding='utf-8').read()
      c = yaml.safe_load(t)
      i = c['identity']
      assert i['phase'] == 'pre_staged' and 'staged_phase' not in i, i
      rows = {b['id']: b for b in c['breakage_map']}
      assert [rows[k]['rec'] for k in ('environment_fail_open', 'ruleset_and_actions_settings', 'claude_code_project_binding')] == ['rec-4550'] * 3
      tags = [s['tag'] for s in c['procedure']['transfer_window_checklist']]
      assert tags == ['HUMAN', 'AGENT-RUNNABLE', 'HUMAN', 'HUMAN', 'HUMAN', 'AGENT-RUNNABLE', 'AGENT-RUNNABLE', 'HUMAN'], tags
      assert [s['step'] for s in c['procedure']['pre_stage']] == list(range(1, 11))
      gate = c['phases'][2]['gates'][0]
      assert 'repository_owner_id' in gate and 'issuer' in gate, gate
      assert [e['phase'] for e in c['evidence_ledger'][-2:]] == ['pre_stage', 'transfer']
      ex = c['tracking']['executed_by']
      assert any(x.startswith('rec-4550 (with rec-4356): ') for x in ex) and any(x.startswith('rec-4551: ') for x in ex), 'tracking.executed_by'
      n = sum(1 for ln in t.splitlines() if ln.strip() and not ln.strip().startswith('#'))
      assert n <= 500, n
      print('CONTRACT_SHAPE_OK', n)
      PY
    expected: CONTRACT_SHAPE_OK and the effective line count printed.
    fix_if: Re-run the pinned generator on the base contract (VP 7); never hand-edit approved text to pass.
    hermetic: true
    expected_literals: [CONTRACT_SHAPE_OK]
    graduation: waive
    graduation_waiver_reason: >-
      It asserts the go/no-go state, which PR B changes by design (phase transferred); validate_github_org_transfer is
      the standing guard.
  - step: 9
    phase: pre-deploy
    action: The contract's registered evaluator is green on the real tree (repeat in PR B and PR C).
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_github_org_transfer import validate_github_org_transfer
      as v; f=[]; v(f); assert not f, f; print('ORG_TRANSFER_CHECK_OK')"
    expected: ORG_TRANSFER_CHECK_OK printed.
    fix_if: The failure names the row or list that disagrees; fix the contract against the approved text.
    hermetic: true
    expected_literals: [ORG_TRANSFER_CHECK_OK]
    graduation: waive
    graduation_waiver_reason: The check is already registered and runs in both tiers; a registry copy would duplicate it.
  - step: 10
    phase: pre-deploy
    action: >-
      rec-4356's stored acceptance oracle (verbatim, read 2026-10-22) holds before push, so PR A's Resolves trailer
      closes it (Decision 201).
    command: grep -q 'repository_owner_id' docs/contracts/github-org-transfer.yaml && grep -q 'issuer' docs/contracts/github-org-transfer.yaml
    expected: Exit 0 (it fails on main today).
    fix_if: Re-read rec-4356 with fetch_recs_by_ids in case its acceptance changed; fix the contract, never the oracle.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: It is the rec's own closure oracle, evaluated at merge by ci.yml's trailer job.
  - step: 11
    phase: pre-deploy
    action: >-
      evidence_ledger is append-only against main and the diff carries no id or secret shape (repeat in PR B and PR
      C). URLs are stripped first, so run ids in evidence paths are allowed.
    command: |-
      bin/venv-python - <<'PY'
      import re, subprocess, yaml
      P = 'docs/contracts/github-org-transfer.yaml'
      base = yaml.safe_load(subprocess.run(['git', 'show', f'origin/main:{P}'], capture_output=True, text=True, check=True).stdout)['evidence_ledger']
      head = yaml.safe_load(open(P, encoding='utf-8'))['evidence_ledger']
      assert head[:len(base)] == base, 'evidence_ledger is not append-only against origin/main'
      diff = subprocess.run(['git', 'diff', 'origin/main...HEAD'], capture_output=True, text=True, check=True).stdout
