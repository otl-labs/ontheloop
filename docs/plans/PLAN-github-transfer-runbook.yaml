      c = yaml.safe_load(open('docs/contracts/github-org-transfer.yaml', encoding='utf-8'))
      assert c['identity']['phase'] == 'transferred', c['identity']['phase']
      f = []
      v(f)
      assert not f, f
      print('TRUST_LISTS_UNCHANGED PR_B_FLIPS_OK INVENTORY_CHECK_OK')
      PY
      bin/venv-python -m pytest -q tests/checks/contracts/test_validate_account_credential_inventory.py
    expected: TRUST_LISTS_UNCHANGED PR_B_FLIPS_OK INVENTORY_CHECK_OK printed, then the inventory tests pass.
