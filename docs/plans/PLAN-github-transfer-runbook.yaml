rollback: >-
  Before the go/no-go merge everything is undoable: close PR A unmerged, restore the old setup-script line, delete the
  rehearsal repository. After the transfer, rollback is forward-fix on the new identity, never a transfer back (the
  old path is retired): stay frozen and fix the failing checklist item; an OIDC failure is recovered by the admin
  break-glass apply (contract rollback.per_phase.transfer, Decision 172 recovery). Between the go/no-go merge and
  the transfer, an abort keeps PR A (pre_staged stays true): the operator re-enables dependabot-auto-merge and
  unfreezes on their word, and a later window resumes at VP 15's pre-checks with a new word. Every predecessor binding stays
  live until proven, so a straddling job fails safe.
