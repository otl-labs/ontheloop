    behavior: The approved amendment, the go/no-go evidence and phase pre_staged land within the size cap.
    verification_step: 8
    command: CONTRACT_SHAPE_OK
    red_green_expectation: >-
      Red before (phase pre_transfer, rows on rec-3905, the old checklist tags; the step 8 assertions fail on main),
      green after. The evidence is step 8's own command, named by a substring of it.
  - source: docs/contracts/account-credential-inventory.yaml
    behavior: The five rows reach proven and company with one ledger entry each.
    verification_step: 32
    command: INVENTORY_FLIPS_OK
    red_green_expectation: >-
      Red before (GH-01 personal, the others pre-staged), green after PR C. The evidence is step 32's own command,
      named by a substring of it.
  - source: docs/contracts/account-credential-inventory.yaml
    behavior: PR B moves GH-01 to the company with the GH-01 and GH-11 ledger entries and the contract at transferred.
    verification_step: 23
    command: PR_B_FLIPS_OK
    red_green_expectation: >-
      Red before PR B (no oidc.tf comment change, GH-01 personal, phase pre_staged), green after. The evidence is step
      23's own command, named by a substring of it.
  - source: tests/checks/contracts/test_validate_account_credential_inventory.py
    behavior: The appended-entry tests date from the real ledger's latest entry, so later real entries keep them green.
    verification_step: 23
    test_selector: tests/checks/contracts/test_validate_account_credential_inventory.py
    red_green_expectation: >-
      Red on PR B's tree without the date patch (test_billing_stays_paid_personally_is_green and
      test_appended_ledger_entry_is_green fail with "earlier than the entry before it"; simulated at planning), green
      with it (81 passed).
  - source: terraform/personal/oidc.tf
    behavior: The window PR's terraform touch is comment-only and leaves both trust lists byte-identical.
    verification_step: 23
    command: TRUST_LISTS_UNCHANGED
    waiver_reason: >-
      A comment carries no behaviour; step 23 guards that nothing else changed, and the trust test and
      validate_github_org_transfer guard the lists themselves.
constraints:
  - >-
    Every console step, dispatch and merge waits for the operator's own typed word in the thread that runs it,
    fetched by message id before acting; one word per admin-tier action (the transfer, setup-script edits, secret
    paste, Codespaces delete, workflow disable and enable). A dispatch word may name several CI dispatches explicitly,
    except the deploy (VP 28), which gets its own.
  - >-
    Never print or store a numeric id, ARN, account id, token, key or e-mail address (PR numbers, commit SHAs,
    workflow run ids and UTC timestamps are not identities and may be kept): the rehearsal and snapshot tools
    print flags and names only; GitHub numeric ids live only in the two trust lists (Decision 101). Never read a
    setup script back through an environment tool (rec-4510).
  - >-
    No predecessor removal and no trust edit: both OIDC segments, the old PyPI publisher, the old GHAS and MCP
    tokens, the classic admin PAT, the personal App installations and the old clone path stay (rec-4551, rec-4538,
    rec-3903). No agent-run terraform apply (Decision 126); CI plans and applies.
  - >-
    Window rules (contract phases.transfer): from the go/no-go merge until VP 26 no other merge to main and no
    dispatch except the checklist's (and a heal or re-run the operator names, VP 15, 22 and 25); a failing checklist
    step keeps the freeze and is forward-fixed; rollback is
    forward-fix on the new identity, never a transfer back. Touch neither claude.ai account's GitHub connection in
    the window.
  - >-
