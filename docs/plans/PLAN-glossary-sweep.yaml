  - "No deploy (asked fork, operator ruling 2026-11-02): the data-pipeline assets change wording only, the scheduled fleet is inert, and deploy-prod-lambdas.yml does not path-trigger on them."
  - No rescue agents or workaround loops (Decision 55).
