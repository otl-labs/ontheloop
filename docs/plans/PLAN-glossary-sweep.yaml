    red_green_expectation: red before (module absent), green after.
  - source: scripts/checks/contracts/validate_glossary.py
    behavior: A missing note or a live hit fails the check; both legs run with or without a diff base.
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_glossary.py::TestStockLegs
    red_green_expectation: red before (legs absent; fixtures pass), green after.
  - source: scripts/checks/contracts/validate_glossary.py
    behavior: >-
      SHAPE fails each of the eight new records, note and noted_decisions defects with its own finding text, before any
      leg runs, so no live file can be exempted.
    verification_step: 2
