constraints:
  - >-
    Every edit to a bound file is one of the sidecar's blocks, applied verbatim ({{DATE}} = the day the build applies them). The build never
    edits docs/plans/approved/glossary-sweep.yaml and never writes governed wording the sidecar does not carry.
  - Identifiers keep their spelling (glossary.yaml relative_words.identifiers); code strings are out of scope.
  - No prose-budget raise and no raise-approved marker; no decomposition of a prose surface to fit a budget.
  - "No deploy (asked fork, pending the operator ruling): the data-pipeline assets change wording only, the scheduled fleet is inert, and deploy-prod-lambdas.yml does not path-trigger on them."
  - No rescue agents or workaround loops (Decision 55).
