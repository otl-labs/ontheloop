execution_steps:
  - >-
    Confirm the last wording-check row in gate_rounds reads PASS (validate_plan_documents only warns off a plan PR);
    STOP if it does not. The data-pipeline fork is answered (no deploy, operator ruling 2026-11-02), so no V3 build,
    deploy or smoke step applies. Rebase onto origin/main. Dry-run the sidecar on the base: bin/venv-python -c
    "from pathlib import Path; from scripts.roadmap import approved_text as a; s=a.load_sidecar('glossary-sweep');
    fs={}; [fs.setdefault(b.file, []).append(b) for b in s.blocks]; [a.apply(a.words(Path(f).read_text()), bs) for f,
    bs in fs.items()]". STOP and ask if any block raises (a bound line changed upstream); do not re-anchor it yourself.
  - >-
    Apply every block of docs/plans/approved/glossary-sweep.yaml ({{DATE}} = the apply day; whitespace and wrapping as
    in the block's `after`), the three test-code blocks included, so glossary.yaml carries records, note and
    noted_decisions before any test is written. The token-aligned applier the planner used is
    /mnt/project-files/rec-4676/tools/apply_sidecar.py (run from the repository root with the slug and the date; it
    writes nothing unless every block matches exactly once); without it, apply each block by hand and let VP step 4
    prove the result. Then lower the touched config/prose_budgets.yaml entries to the bytes validate_prose_limits
    measures (sanction row prose_budgets_ratchet_down; the wording check measured S1, scripts/CLAUDE.md,
    terraform/CLAUDE.md, the orient, overseer, plan-critique and planning skills and PROJECT_CONTEXT), regenerate
    docs/decisions-index.json with bin/venv-python -m scripts.decisions_index --write only if --check fails (no edge
    changes, so it is expected current), and refresh .secrets.baseline line numbers with PRE_COMMIT_NO_CONCURRENCY=1
    bin/venv-python -m pre_commit run detect-secrets --all-files, then git add the baseline and commit it before VP step 9
    (both sanction-covered; parallel hook batches each rewrite the whole baseline and can drop the ten
    iam-simulate-fixture.yaml shifts, and the hook refuses an unstaged modified baseline). Then run bin/venv-python -c "from scripts.checks.structural.size_limits import
    validate_structural_size_limits as v; f=[]; v(f); assert not f, f" on the applied tree: four bound contracts sit
    NEAR_CAP after the apply (iam-simulate-fixture.yaml 647 of 650, 646 at base; file-router.yaml 500 of 500;
    inference-provider.yaml 490 of 500, 489 at base; ducklake_maintenance.yaml 495 of 500), and unbuilt plans share three
    of them. On a FAIL in a bound file,
    STOP and ask: no compaction of bound words, no raise marker.
  - >-
    Write the red tests (VP steps 1-3 nodes, test_rejects_stock_shape_defect's eight cases and the fixture changes) and
    confirm each fails because the legs and the new SHAPE rules are absent: test__glossary_stock.py on the missing
    module, TestStockLegs on validate_glossary passing a defect, each stock SHAPE case on its missing finding text (or
    the absent leg names its spies replace), the acceptance nodes on the absent helpers they import.
  - >-
    scripts/checks/contracts/_glossary_stock.py, then wire it into validate_glossary.py after SHAPE and GUIDANCE pass:
    findings += unnoted(...); plan = _plan_lines_at(base_dir, "HEAD"); live, files = live_hits(base_dir, data,
    _pathspecs(base_dir), lambda text: _in_plan(text, plan)) -- since #1800 _plan_lines_at returns exact lines plus
    placeholder templates and _in_plan matches either, the same rule the added-line lint applies. The PASS line reads "PASS: glossary.yaml satisfies every rule, {n} noted Decisions carry the note, {files}
    live files and {scanned} added governed lines use glossary names." Both legs run when the diff base is missing.
    Then run bin/venv-python -c "from scripts.checks.typing.mypy_baseline import validate_mypy_ratchet as v; f=[]; v(f);
    assert not f, f": the ratchet runs only in the full tier and holds an unregistered file at 0 errors, so a type error
    in either file would first fail at VP step 10. For the same reason hold both files at 100% line coverage
    (validate_test_coverage, full tier; neither has a config/coverage_baseline.yaml entry): bin/venv-python -m pytest
    tests/checks/contracts/test__glossary_stock.py tests/checks/contracts/test_validate_glossary.py
    --cov=scripts.checks.contracts._glossary_stock --cov=scripts.checks.contracts.validate_glossary
    --cov-report=term-missing shows 100% for both, the uncomposable-file and read-error branches included.
  - >-
    Commit (the branch commit message carries "Resolves: rec-4676", which validate_merge_step reads), then execute VP
    steps 1-9; loop until pass; never weaken an assertion. Graduate steps 1-3 as test_selector shards, one node each:
    glossary-stock-helpers records tests/checks/contracts/test__glossary_stock.py; glossary-stock-legs-fail-check records
    tests/checks/contracts/test_validate_glossary.py::TestStockLegs (which holds test_rejects_stock_shape_defect);
    glossary-sweep-acceptance records ::test_older_decisions_carry_reads_through_note (the live-surfaces node's behavior
    is the whole-file leg validate_glossary runs on every PR).
  - >-
    Code review via a fresh code-review subagent; fix blocking findings and re-run steps 1-9. A fix to a line a sidecar
    block binds (the three test-code blocks included) is never edited in place: report it as a plan defect, and the
    owning planning session lands a plan amendment first.
  - >-
    Closure evidence (implement skill Commit Flows; docs/contracts/git-ops.yaml): VP step 10 on the committed, rebased,
    clean tree; postflight evidence; push, PR, subscribe, CI green by event-driven wake, code review PROCEED; then the
