schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: glossary-sweep
intent: >-
  Bring existing governed text in line with docs/contracts/glossary.yaml (Decision 240): records keep their wording and
  read through the read_as rows, every other governed file is rewritten once to glossary names, each older Decision
  that is still live in docs/DECISIONS.md and uses a relative word gains one dated reads-through note, and validate_glossary holds both from then on (rec-4676).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-glossary-sweep.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4676,
  the owner Decision 240 clause 5 and its Coverage line name for existing text.
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Decision 240 gains the approved dated Update and its re-armed read-as-misread condition; each of the 44 entries in
      glossary.yaml read_as.noted_decisions gains the approved reads-through note as a trailing annotation. Exactly the
      46 DECISIONS.md blocks of docs/plans/approved/glossary-sweep.yaml; no other byte changes.
  - file: docs/contracts/glossary.yaml
    action: Modify
    purpose: read_as.rule narrowed to the records; read_as gains records, note and noted_decisions; one amendment_log row (4 sidecar blocks).
  - file: scripts/checks/contracts/_glossary_stock.py
    action: Create
    purpose: >-
      Pure helpers for the two stock legs: note_pattern (the stored template with its literal DATE as a date regex),
      unnoted (a roster Decision whose entry lacks the note in DECISIONS.md or DECISIONS_ARCHIVE.md, or that neither file
      holds -- both are findings, and the finding text names the remedy for a Decision compacted to a stub (Decision 177
      cl.2): drop its number from read_as.noted_decisions with an amendment_log row), history_lines (the lines of every
      amendment_log key's value at any depth, block or flow style, via yaml.compose, from the first item's start to the
      last line of the last item's last scalar: its end_mark line, or the line before when end_mark.column is 0, as a
      block scalar's is; never a sequence or item end mark (PyYAML sets those at the next token), so a trailing comment
      and a following key line stay scanned, and two mirror cases pin them (the second: a block-scalar last item followed
      directly by a key line carrying the word) -- a field-level amendment_log such as observation-id.yaml's counts, and
      a one-line flow sequence covers its own line; a file that does not compose has none and is scanned whole, never
      raising) and live_hits (whole-file matcher over the lint pathspecs minus read_as.records, exempting amendment_log
      rows and plan-copied lines through an in_plan predicate its caller passes, so the helper never imports
      validate_glossary).
    new_imports: [scripts.decisions_md, scripts.checks.contracts._glossary_words]
  - file: scripts/checks/contracts/validate_glossary.py
    action: Modify
    purpose: >-
      Order: SHAPE, then GUIDANCE; when both are clean, the note leg, the whole-file leg and (with a diff base) the
      added-line lint each run and append findings, none gating another. SHAPE also requires read_as.noted_decisions to be
      a non-empty list of distinct integers below 240, read_as.note to start "> **Update (" and carry the literal DATE,
      and each read_as.records entry to lie within the record classes the Decision 240 Update names (docs/DECISIONS.md,
      docs/DECISIONS_ARCHIVE.md, docs/plans/, docs/audit-prompts/, docs/ROADMAP-PLATFORM.yaml,
      docs/ROADMAP-PLATFORM-ARCHIVE.yaml, or a path under the two directories), so no live file can be exempted (no
      existence check: a mistyped entry exempts nothing). Each new SHAPE finding names its key: "read_as.noted_decisions
      must be a non-empty list of distinct integers below 240", "read_as.note must start with > **Update ( and carry the
      literal DATE", "read_as.records entry {entry} lies outside the record classes". Reports the legs' counts in the PASS
      line and registry.examined, and the module docstring names the legs. Registration, owner and gating unchanged.
    new_imports: [scripts.checks.contracts._glossary_stock]
  - file: tests/checks/contracts/test__glossary_stock.py
    action: Create
    purpose: Mirror test (Decision 131) for every helper, on tmp_path fixtures.
  - file: tests/checks/contracts/test_validate_glossary.py
    action: Modify
    purpose: >-
      rec-4676's acceptance nodes test_older_decisions_carry_reads_through_note and test_live_surfaces_use_glossary_names
      on the real repository, each pinned to its own leg and importing the helpers inside the node: the first asserts
      _glossary_stock.unnoted(...) == [] over the repository's glossary.yaml and corpus, the second that live_hits(...)
      reports no hit, so neither turns red on the other leg or on the diff-base-dependent added-line lint; plus TestStockLegs (each leg fails validate_glossary on a fixture root, the whole-file leg also
      with no diff base, and test_added_line_lint_runs_beside_stock_findings: a roster Decision without the note plus an
      added live line both report, and test_rejects_stock_shape_defect, a parametrized method over a new _STOCK_DEFECTS
      map of eight cases, one per SHAPE rule, each paired with the key its finding names: empty_roster,
      non_integer_roster, duplicate_roster and roster_at_or_above_240 (read_as.noted_decisions), note_without_prefix and
      note_without_date (read_as.note), records_live_file (for example docs/PROJECT_CONTEXT.md) and
      records_covering_contracts (read_as.records). Each case asserts failed == ["Glossary"], that the FAIL output carries
      its SHAPE finding text, and that no leg ran: monkeypatch replaces the unnoted, live_hits and _lint names
      validate_glossary calls with spies that record calls, and the case asserts zero calls, so a deleted SHAPE rule fails
      its case even where a leg would also catch the fixture). The
      fixture follows the legs: _build rewrites the copied glossary.yaml's noted_decisions line to [27] and writes a
      Decision 27 entry carrying the note (body "**Decision:** older.") AFTER the optional Decision 240 entry, so
      DECISIONS.md line numbers the other nodes pin do not move. Four nodes change setup only, keeping every assert (so no
      weakening candidate arises and no weakening_dispositions row is needed): test_ignores_text_already_on_the_base, test_moved_line_is_not_a_use and test_no_base_skips_lint_only move their
      older, moved or no-base line from docs/contracts/other.yaml onto docs/audit-prompts/AUDIT-x.md (a records path, so
      the whole-file leg leaves it to the added-line lint they test); test_decision_held_only_in_the_archive_has_no_defining_range
      also writes the Decision 27 entry into the archive. Graduated shards: glossary-lint-ignores-older-text keeps its node
      id, which now proves older text in a record is ignored; glossary-lint-flags-unqualified-word and
      glossary-shape-requires-term-fields are kept with unchanged nodes. Stays under 500 lines.
  - file: tests/checks/decisions/test_telemetry_column_additions_decision.py
    action: Modify
    purpose: >-
      Sidecar blocks test-telemetry-143-import and test-telemetry-143-trails: Decision 143's amendment assertion pinned
      "last line of the entry", which the trailing note breaks; it now asserts the same amendment sits in the trailing
      annotation run (tests/fixtures/decision_entry.py authored()).
  - file: tests/docs/test_project_context.py
    action: Modify
    purpose: Sidecar block test-project-context-map; the pinned heading follows the approved rewrite ("Roadmap end-state map").
  - file: AGENTS.md
    action: Modify
    purpose: Approved text (2 sidecar blocks). Public surface.
  - file: README.md
    action: Modify
    purpose: Approved text (9 sidecar blocks); the North Star section is untouched (the north-star plan owns it). Public surface.
