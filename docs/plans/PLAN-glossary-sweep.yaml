pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - "Only the plan-cited decision sections read: 240, 177, 77, 211, 167, 131, 165, 201, 233, plus 79, 151 and 181 (fork and scout flags)"
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Confirm the data-pipeline fork line in context carries the operator's ruling; if it reads deploy, STOP (the plan
    then needs V3 build, deploy and smoke steps first). Rebase onto origin/main. Dry-run the sidecar on the base: bin/venv-python -c "from pathlib import Path; from
    scripts.roadmap import approved_text as a; s=a.load_sidecar('glossary-sweep'); fs={}; [fs.setdefault(b.file,
    []).append(b) for b in s.blocks]; [a.apply(a.words(Path(f).read_text()), bs) for f, bs in fs.items()]". STOP and
    ask if any block raises (a bound line changed upstream); do not re-anchor it yourself.
  - Write the red tests first (steps 1-3 nodes) and confirm each fails for the stated reason.
  - >-
    scripts/checks/contracts/_glossary_stock.py, then wire it into validate_glossary.py after SHAPE and GUIDANCE pass:
    findings += unnoted(...); live, files = live_hits(base_dir, data, _pathspecs(base_dir), _plan_lines_at(base_dir,
    "HEAD")). The PASS line reads "PASS: glossary.yaml satisfies every rule, {n} noted Decisions carry the note, {files}
    live files and {scanned} added governed lines use glossary names." Both legs run when the diff base is missing.
  - >-
    Apply every block of docs/plans/approved/glossary-sweep.yaml ({{DATE}} = the apply day; whitespace and wrapping as in
    the block's `after`), the three test-code blocks included. The token-aligned applier the planner used is
    /mnt/project-files/rec-4676/tools/apply_sidecar.py (run from the repository root with the slug and the date; it
    writes nothing unless every block matches exactly once); without it, apply each block by hand and let VP step 4 prove
    the result. Then lower the touched config/prose_budgets.yaml entries to
    the bytes validate_prose_limits measures (sanction row prose_budgets_ratchet_down; the wording check measured S1,
    scripts/CLAUDE.md, terraform/CLAUDE.md, the orient, overseer, plan-critique and planning skills and PROJECT_CONTEXT),
    regenerate docs/decisions-index.json, and let the pre-commit hook refresh .secrets.baseline line numbers (both
    sanction-covered).
  - >-
    Commit (the branch commit message carries "Resolves: rec-4676", which validate_merge_step reads), then execute VP
    steps 1-9; loop until pass; never weaken an assertion.
  - Code review via a fresh code-review subagent; fix blocking findings and re-run steps 1-9.
  - >-
    Closure evidence (implement skill Commit Flows; docs/contracts/git-ops.yaml): VP step 10 on the committed, rebased,
    clean tree; postflight evidence; push, PR, subscribe, CI green by event-driven wake, code review PROCEED; then the
    merge step: write the squash message carrying "Resolves: rec-4676" to a file, run bin/venv-python -m
    scripts.session.merge_step premerge --slug glossary-sweep --message-file <file> --expect <VP step 4's digest>, merge_pull_request
    (squash) with that commit_message and the printed expectedHeadSha, then merge_step readback --slug glossary-sweep
    --sha <merge sha>.
  - After merge, VP step 11.
weakening_dispositions:
  - candidate: "[assertion-changed] tests/checks/decisions/test_telemetry_column_additions_decision.py::test_decision_entry_and_annotations"
    disposition: planned-change
    cite: "acceptance_criteria[5]"
  - candidate: "[assertion-changed] tests/docs/test_project_context.py::test_project_context_preserves_roadmap_end_state_orientation"
    disposition: planned-change
    cite: "acceptance_criteria[0]"
rollback: >-
  Forward-fix by default: a defect in a leg or a block is fixed in a new PR. A revert of the squash commit removes 44
  dated annotations from Decision bodies (Decision 177's append-only record), so it needs the operator's word; it
  returns the rewritten text to its base wording, takes the two legs out of validate_glossary, and reopens rec-4676
  through update_rec. ops_decisions rebuilds from DECISIONS.md on the next backfill.
