    verification_step: 3
    test_selector: tests/checks/contracts/test_validate_glossary.py::test_older_decisions_carry_reads_through_note
    red_green_expectation: red before (no note), green after.
  - source: .github/prompts/scheduled/prompt-quality.prompt.md
    behavior: Carries the approved wording and no unqualified relative word outside an amendment_log row.
    verification_step: 3
    test_selector: tests/checks/contracts/test_validate_glossary.py::test_live_surfaces_use_glossary_names
    red_green_expectation: red before (the base carries the relative word), green after.
  - source: .github/prompts/scheduled/rec-curator.prompt.md
    behavior: Carries the approved wording and no unqualified relative word outside an amendment_log row.
    verification_step: 3
    test_selector: tests/checks/contracts/test_validate_glossary.py::test_live_surfaces_use_glossary_names
    red_green_expectation: red before (the base carries the relative word), green after.
  - source: docs/contracts/account-credential-inventory.yaml
    behavior: >-
      Carries exactly the bound words. Every relative-word line on its base is a copy of an older plan's line, which the
      whole-file leg exempts, so the approved-text verify is the discriminating evidence.
    verification_step: 4
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug glossary-sweep --base origin/main
