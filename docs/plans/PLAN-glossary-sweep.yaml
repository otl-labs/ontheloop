bundled_recommendations:
  - rec-4676
followon_recs:
  - rec-4815
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Every file bound by docs/plans/approved/glossary-sweep.yaml (201 blocks, 39 files) equals its base with the
    sidecar's blocks applied (scripts.roadmap.approved_text verify, digest as in the wording-check row of gate_rounds),
    and validate_merge_step passes on the build PR.
  - >-
    validate_glossary fails a Decision listed in read_as.noted_decisions that lacks the note or that neither corpus file
    holds, and fails a live governed file (lint pathspecs minus read_as.records) with an unqualified relative word
    outside an amendment_log row or a plan-copied line, with or without a diff base; a file that does not parse is
    scanned whole. SHAPE fails an empty, non-integer, duplicated or out-of-range roster, a note without the
    "> **Update (" prefix or the DATE template, and a records entry outside the record classes (a live file or
    docs/contracts/). It reads records, note and noted_decisions from glossary.yaml and never
    re-derives the roster; the added-line lint still runs when a stock leg has findings.
  - >-
    On the merged tree both legs pass: the 44 noted Decisions each carry the note, and zero live governed files carry a
    relative word; tests/checks/contracts/test_validate_glossary.py::test_older_decisions_carry_reads_through_note and
    ::test_live_surfaces_use_glossary_names pass (rec-4676 acceptance).
  - >-
    No new supersession edge, no new decision entry, no FAIL from validate_decisions_size (the 33 amendment-delta WARNs
    are expected), and the reversal-conditions stanzas stay well-formed.
  - >-
    The contract drift gate passes on the committed tree (12 new amendment_log rows: 11 prose_improvement rows and glossary.yaml's field_add row), and every config/prose_budgets.yaml
    entry this build touches equals its measured bytes with no raise.
  - >-
    tests/checks/decisions/test_telemetry_column_additions_decision.py::test_decision_entry_and_annotations still proves
    Decision 143 carries the Decision 222 amendment as a trailing annotation, not spliced into the body.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The stock helpers find missing notes, live hits and history ranges, and honour every exemption.
    command: bin/venv-python -m pytest tests/checks/contracts/test__glossary_stock.py -q
    expected: exit 0, every test passes.
    fix_if: >-
      A note dated any day fails the pattern, an amendment_log row or a plan-copied line is reported, a records path is
      scanned, or a Decision whose note sits only in DECISIONS_ARCHIVE.md is reported missing -- fix the helper.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: glossary-stock-helpers
  - step: 2
    phase: pre-deploy
    action: Each stock leg fails validate_glossary on a fixture root, and passes once the fixture is fixed.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_glossary.py::TestStockLegs
      tests/checks/contracts/test_validate_glossary.py::test_rejects_shape_defect -q
    expected: exit 0, every test passes.
    fix_if: A leg's finding does not reach failed, or a leg runs before SHAPE passes -- fix the wiring in validate_glossary.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: glossary-stock-legs-fail-check
  - step: 3
    phase: pre-deploy
    action: rec-4676's acceptance nodes on the real repository.
    command: >-
      bin/venv-python -m pytest
      tests/checks/contracts/test_validate_glossary.py::test_older_decisions_carry_reads_through_note
      tests/checks/contracts/test_validate_glossary.py::test_live_surfaces_use_glossary_names -q
    expected: exit 0, 2 passed (red at the base, where no note exists and 82 live lines carry a relative word, about 20 more exempt as plan copies).
    fix_if: >-
      A Decision lacks the note or a live line still carries a word -- a sidecar block was not applied (re-run step 4);
      a hit outside the sidecar's files means new text landed after the plan: STOP and ask, never improvise wording.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: glossary-sweep-acceptance
  - step: 4
    phase: pre-deploy
    action: Every bound file carries exactly the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug glossary-sweep --base origin/main --expect 0cc85090aee87752440db375c095525463c3041057aad9b38ecdaddaeeacdca4  # pragma: allowlist secret
    expected: exit 0, no mismatch line.
    fix_if: >-
      A mismatch -> the file differs from the approved text; restore it, never edit the sidecar. A `before` that no
      longer occurs once because main moved (for example PR #1742 reworded a bound line first) -> STOP and ask Benjamin.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Depends on this branch's diff; validate_merge_step's approved-text leg runs on every PR that declares the plan.
  - step: 5
    phase: pre-deploy
    action: The live glossary check, on the committed tree.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_glossary import validate_glossary as v; f=[]; v(f);
      assert not f, f"
    expected: exit 0; the PASS line names 44 noted Decisions and the count of live files scanned.
    fix_if: A FAIL line -- fix the text it names through the sidecar (step 4) or the helper (step 1).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_glossary itself runs on every PR; steps 1-3 graduate its legs.
  - step: 6
    phase: pre-deploy
    action: Contract drift gate on the committed tree (it diffs merge-base..HEAD, so commit first).
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v;
      f=[]; v(f); assert not f, f"
    expected: exit 0, PASS line.
    fix_if: A contract named as changed without an amendment_log row -- its row block was not applied (step 4).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The drift gate runs on every PR.
  - step: 7
    phase: pre-deploy
    action: Decision corpus checks.
    command: >-
      bin/venv-python -c "from scripts.checks.decisions.validate_supersession_annotations import
      validate_supersession_annotations as a; from scripts.checks.decisions.validate_decisions_size import
      validate_decisions_size as b; from scripts.checks.ops_governance.validate_reversal_stanzas import
      validate_reversal_stanzas as c; f=[]; a(f); b(f); c(f); assert not f, f" && bin/venv-python -m scripts.decisions_index
      --check && bin/venv-python -m pytest tests/checks/decisions/ tests/ci_rca/test_recovery_policy_surfaces.py
      tests/checks/contracts/test_ops_rule_source_records.py tests/decisions_md/ -q
    expected: exit 0; only WARN lines from the size check.
    fix_if: >-
      A new edge -> a note or the Update contains an edge verb; a size FAIL -> an entry is new-in-diff; a pinned test
      fails -> a note was spliced into a body instead of trailing it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Each check runs on every PR that touches docs/DECISIONS.md; the tests are selected by the same paths.
  - step: 8
    phase: pre-deploy
    action: Prose budgets lowered to measured (the ratchet fails an under-budget entry), nothing raised.
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f); assert
      not f, f" && bin/venv-python -c "from scripts.checks.prose.prose_budget_raises import validate_prose_budget_raises
      as v; f=[]; v(f); assert not f, f"
    expected: exit 0 from both; config/prose_budgets.yaml changes only by lowered numbers (sanction row prose_budgets_ratchet_down).
    fix_if: An under-budget FAIL -> lower that entry to the measured bytes it names; any raise -> revert it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_prose_limits and validate_prose_budget_raises run on every PR.
  - step: 9
    phase: pre-deploy
    action: Fast tier on the committed tree.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0, "All checks passed."
    fix_if: Fix the named check; never weaken an assertion (weakening_dispositions lists the two planned changes).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The fast tier is the PR gate itself.
  - step: 10
    phase: pre-deploy
    action: Full tier pre-handoff on the committed, rebased, clean tree, started backgrounded (2 h limit) from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: --verify-head exit 0 attesting HEAD.
    fix_if: Fix the named check and re-run both.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The full tier runs post-merge on main.
  - step: 11
    phase: post-deploy
    action: rec-4676 closed by the Resolves trailer.
    command: >-
      bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as r; x=r('rec-4676',
      profile='agent_platform'); print(x['status']); assert x['status'] == 'closed', x['status']"
    expected: prints closed.
    fix_if: Still open -> run scripts.session.merge_step readback and follow its route; never close it by hand.
    hermetic: false
    graduation: not-applicable
