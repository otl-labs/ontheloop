schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: glossary
intent: >-
  Give every governed sentence one name per thing where On The Loop meets its adopters, so no agent has to infer whose
  side a sentence is written from (Benjamin, 2026-10-27). Lands docs/contracts/glossary.yaml and Decision NNN exactly
  as approved, adds validate_glossary (the contract's shape plus a lint that fails added governed lines using
  "platform" or "product" unqualified), projects the glossary into get_rec_write_guidance, makes the rec portal refuse
  a rec title, context or verification whose new text does the same (a producer-side glossary_lint rule declared in
  ops_recommendations.yaml, Benjamin's option C, 2026-10-30), and points docs/CLAUDE.md at it. Existing text is rec-4676's follow-on plan: live surfaces rewritten, older Decisions given a reads-through
  note.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-glossary.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn category): Benjamin asked for the terminology to be settled now (2026-10-27),
  ahead of the north-star Tier A rework, whose binds field uses these names. No tier_item is claimed and no exit
  criterion is closed, so the Tier Item Freshness Gate does not fire.
closes_criteria: []
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Insert Decision NNN verbatim (execution step 3) above the newest entry.
  - file: docs/contracts/glossary.yaml
    action: Create
    purpose: The glossary (execution step 4, verbatim), a ratified Class D contract whose evaluator is validate_glossary.
  - file: docs/CLAUDE.md
    action: Modify
    purpose: >-
      Append the approved "Names" section (execution step 5), the contract's ambient trigger for every agent that reads
      or writes under docs/. 3,440 of 3,813 S2 bytes on main (2026-10-30); the section adds 216, so no raise.
  - file: scripts/checks/contracts/validate_glossary.py
    action: Create
    purpose: The shape, guidance and added-line lint legs (execution step 6).
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: Register validate_glossary as an ungated pre=True Entry with full_segment="full_after_lint" (execution step 7).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: "Classify the new check: validate_glossary: schema_drift, beside validate_ports_contract."
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Add the glossary route (topic equals the contract subject) and its one-line amendment_log entry, paid for by
      compacting the three oldest single-entry field_add amendment_log rows into one (execution step 7). The file is
      limited to 500 effective lines (Decision 166) and measured 498 on main at 8a49507e; never a raise.
  - file: scripts/executor/rec_write_guidance.py
    action: Modify
    purpose: Add a glossary_path parameter and project the contract into guidance["glossary"] (execution step 8).
  - file: tests/checks/contracts/test_validate_glossary.py
    action: Create
    purpose: Mirror test for every leg, in a temporary git repository (execution step 10).
  - file: tests/test_rec_write_guidance.py
    action: Modify
    purpose: Prove the glossary projection, its path override and its absence handling (execution step 10).
  - file: scripts/checks/contracts/_glossary_words.py
    action: Create
    purpose: The shared token rule and span exemptions, used by validate_glossary and the rec portal rule (execution step 9).
  - file: src/row_rules/rules.py
    action: Modify
    purpose: Add "glossary_lint" to PRODUCER_SIDE_KINDS so the writer loads the projection that declares it (execution step 9).
  - file: scripts/checks/contracts/_rule_grammar.py
    action: Modify
    purpose: >-
      Admit "glossary_lint" to the SCD2 vocabulary with exclude_before as its only subkey, and bind it to the
      repository_state exemption class in PRODUCER_CLASS (execution step 9).
  - file: docs/contracts/ops_recommendations.yaml
    action: Modify
    purpose: >-
      Declare the glossary_lint leg and its producer-side exemption on title, context and verification, with one
      amendment_log row each, paid for by compacting the oldest top-level amendment_log block (556-line grandfathered budget, Decision
      166; execution step 9).
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: Regenerated by scripts.schema_to_field_semantics from the contract, never by hand (execution step 9).
  - file: scripts/ops_portal/write_validators.py
    action: Modify
    purpose: The _glossary_lint producer handler, judging only new sentences on update (execution step 9).
  - file: tests/checks/contracts/test__glossary_words.py
    action: Create
    purpose: Mirror test for the shared matcher (execution step 10).
  - file: tests/test_ops_data_portal_validators.py
    action: Modify
    purpose: Prove the portal refuses unqualified rec text and judges only new sentences on update (execution step 10).
  - file: tests/row_rules/test_rules.py
    action: Modify
    purpose: Prove the writer records glossary_lint as a producer-side exemption and never evaluates it (execution step 10).
  - file: tests/test_security_detector_probe.py
    action: Modify
    purpose: >-
      Prove the hourly security-detector-liveness probe's automated rec still passes the portal gate: its text names
