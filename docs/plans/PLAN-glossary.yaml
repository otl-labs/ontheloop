  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      Keep rule write-time-enforcement's class-to-kind binding true: repository_state binds glossary_lint as well as
      acceptance_lint, with one amendment_log row (execution step 9 (r2); 468 of 500 effective lines on main).
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      Scope amendment 1 (build discovery, coordinator-approved 2026-10-30): add scripts/checks/contracts/_glossary_words.py to the pre_globs of
      validate_hermeticity_flags, validate_verification_registry and validate_differential_gate_baseline, whose import
      closure gains the helper through scripts/ops_portal/write_validators.py (execution step 9 (r8)).
  - file: scripts/checks/deps/_manifest.py
    action: Modify
    purpose: >-
      Scope amendment 1 (build discovery, coordinator-approved 2026-10-30): the same pre_globs addition for validate_presubmit_tool_pin_escalation (execution step 9 (r8)).
  - file: scripts/checks/ops_governance/_manifest.py
    action: Modify
    purpose: >-
      Scope amendment 1 (build discovery, coordinator-approved 2026-10-30): the same pre_globs addition for validate_recommendations_schema (execution step 9 (r8)).
  - file: tests/test_contract_rules.py
    action: Modify
    purpose: >-
      Scope amendment 1 (build discovery, coordinator-approved 2026-10-30): test_ops_recommendations_declares_its_rule_list pins every declared ops_recommendations rule,
      so it gains glossary_lint and its repository_state exemption on title, context and verification (execution
      step 10). The pin only grows.
  - file: docs/plans/PLAN-glossary.yaml
    action: Create
    purpose: This plan artefact.
bundled_recommendations: []
followon_recs: [rec-4676, rec-4762, rec-4768]
infrastructure_dependencies:
  - >-
    Lambda-packaged: src/row_rules/rules.py and config/lambda/ducklake/field_semantics.yaml ship in the DuckLake
    functions, so compute_affected_artifacts names ducklake_writer, ducklake_reader, ducklake_telemetry_writer,
    ducklake_telemetry_reader, ducklake_maintenance, ducklake_maintenance_smoke and ducklake_catalog_dr (checked
    2026-10-30). Deploy class terraform_personal_filemd5_coupled -> the governed deploy-ducklake-lambdas.yml channel,
    path-triggered by the squash-merge (config/lambda/ducklake/**, src/row_rules/**; Decisions 125 and 126); the local
    build_lambda --ducklake-only --deploy stays break-glass only. Precedent: PLAN-rule-declarations-and-writer-conformance.
    Re-run compute_affected_artifacts at build time: if ducklake_telemetry_content_reader (Decision 239, a stub on
    2026-10-30) has gone active, record that its deploy is operator-only and its shipped zip stays self-consistent
    (old engine, old projection); VP step 21 does not cover it.
  - >-
    No behaviour changes in a deployed function: the writer only records glossary_lint as a producer-side exemption
    and never evaluates it; the portal (scripts/ops_portal, not Lambda-packaged) runs it. The deploy keeps the shipped
    projection and engine equal to the repository's, which the portal's gate presumes. No .tf, IAM, role, Function URL
    or environment change.
acceptance_criteria:
  - >-
    Decision NNN is in docs/DECISIONS.md with the verbatim approved text of execution step 3 (only NNN and DATE
    substituted), under the 6,144-byte per-entry cap, conformant to decision-entry.yaml, its reversal-conditions stanza
    parsing, and docs/decisions-index.json regenerated (VP steps 10, 11 and 12).
  - >-
    docs/contracts/glossary.yaml holds exactly the approved text of execution step 4 as a ratified Class D contract
    whose evaluator, validate_glossary, resolves and passes on the real tree; the population gate passes and the
    file-router carries the glossary route within 500 effective lines (VP steps 2, 8, 9, 12 and 13).
  - >-
    validate_glossary fails an added governed line that uses "platform" or "product" unqualified, never fails text that
    was already there, honours every exemption of execution step 6, and rejects each shape defect by its own fixture
    (VP steps 3, 4, 5 and 7).
  - >-
    get_rec_write_guidance() carries a glossary entry whose terms and say_instead values equal the contract's, and
    docs/CLAUDE.md carries the approved Names section within its S2 budget (VP steps 6, 12 and 13).
  - >-
    file_rec refuses a title, context or verification using either word unqualified (resolution is never linted), update_rec judges only new sentences, the writer
    records glossary_lint as a producer-side exemption, and the contract, its projection and the rule grammar agree
    (VP steps 14-17).
  - >-
    The fast and full tiers pass; after the squash-merge dec-NNN reaches ops_decisions, rec-4676, rec-4762 and rec-4768 stay
    open, the governed DuckLake deploy for the merge commit succeeds with fresh deploy records, and the row-rule smoke
    passes (VP steps 18-22).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Precondition -- the branch is on current main and neither the contract nor the Decision exists yet.
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-glossary.yaml && git merge-base --is-ancestor origin/main HEAD && test ! -e docs/contracts/glossary.yaml && ! grep -q '^## Decision [0-9]*: One name per thing where On The Loop meets its adopters' docs/DECISIONS.md && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      A plan missing from origin/main means its PR has not merged: stop, because the build must never carry this
      plan's own text (VP step 2 would lint it). A failing ancestry test means the branch is stale: rebase on
      origin/main first. An existing contract or Decision means another change landed this work: stop and ask the
      coordinator.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: Prove the contract exists and validate_glossary passes on the real tree, including the lint over this branch's own added lines.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_glossary import validate_glossary as v; f=[]; v(f); assert not f, f; print('GLOSSARY_OK')"
    expected: Exit 0 with the PASS line and the marker. Red before because the module does not exist (ModuleNotFoundError, exit 1).
    fix_if: >-
      A shape finding names the key; the contract is verbatim, so fix the rule's reading, never the text. A lint finding
      names a path and line this branch added: reword that line to a glossary name (approved text is exempt by
      construction; if an approved line is flagged, the exemption is wrong -- fix the exemption). A flagged line in
      docs/plans/PLAN-glossary.yaml means the plan did not merge first: stop.
    hermetic: true
    expected_literals:
      - GLOSSARY_OK
    graduation: waive
    graduation_waiver_reason: >-
      validate_glossary is itself registered (execution step 7) and runs ungated on every --pre and full run; a shard
      re-running it would re-assert what the registered gate owns.
  - step: 3
    phase: pre-deploy
    action: Prove the defining rule -- an added governed line using "platform" unqualified fails, naming the file, the line and the say_instead text.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_glossary.py::test_flags_unqualified_word_in_added_line -q
    expected: Exit 0, one node passes. Red before because the node does not exist (pytest exit 4).
    fix_if: A failure means the token rule or the added-line parse misses the word; fix the rule, never the fixture.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: glossary-lint-flags-unqualified-word
  - step: 4
    phase: pre-deploy
    action: Prove older text is never linted -- a governed file with existing unqualified uses and an unrelated added line passes.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_glossary.py::test_ignores_text_already_on_the_base -q
    expected: Exit 0, one node passes. Red before because the node does not exist (pytest exit 4).
    fix_if: A failure means the lint reads whole files instead of added lines; Decision NNN clause 4 forbids rewriting older text.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: glossary-lint-ignores-older-text
  - step: 5
    phase: pre-deploy
    action: Prove a term missing do_not_use_for fails the shape leg.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_glossary.py::test_rejects_term_missing_do_not_use_for -q
    expected: Exit 0, one node passes. Red before because the node does not exist (pytest exit 4).
    fix_if: A failure means the shape leg does not require all three fields on every term.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: glossary-shape-requires-term-fields
  - step: 6
    phase: pre-deploy
    action: Prove get_rec_write_guidance projects the real contract's terms and say_instead values.
    command: >-
      bin/venv-python -m pytest tests/test_rec_write_guidance.py::TestGlossaryGuidance::test_glossary_terms_match_contract -q
    expected: Exit 0, one node passes. Red before because the class does not exist (pytest exit 4).
    fix_if: A failure means the projection reads the wrong path or drops a term; the contract is the only source.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: rec-guidance-carries-glossary
  - step: 7
    phase: pre-deploy
    action: Run both test modules and the contracts manifest test.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_glossary.py tests/test_rec_write_guidance.py tests/checks/contracts/test__manifest.py -q
    expected: Exit 0; every exemption and shape fixture behaves as execution step 10 lists and the manifest test resolves the new Entry.
    fix_if: A passing negative fixture means its rule is missing or too loose; a manifest failure means the Entry literal is malformed.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A whole-file re-run of test files this plan creates or modifies (vp-red-before.yaml hermetic_authoring rule v);
      the fast tier's pytest diff runs them on every PR, and steps 3-6 graduate the defining nodes.
  - step: 8
    phase: pre-deploy
    action: >-
      Prove the population gate accepts the new Class D file: ratified with ratified_via, a resolving check evaluator,
      a subject equal to the router topic, ratchet pins unchanged.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v; f=[]; v(f); assert not f, f; print('CONTRACT_DRIFT_OK')"
    expected: Exit 0 and the marker.
    fix_if: >-
      "evaluator does not resolve" means the check module lacks the executable "glossary.yaml" literal or is not
      sequenced; a topic mismatch means the router topic is not glossary.
    hermetic: true
    expected_literals:
      - CONTRACT_DRIFT_OK
    graduation: waive
    graduation_waiver_reason: validate_contract_drift is registered in both tiers and evaluates every docs/contracts file on every run.
  - step: 9
    phase: pre-deploy
    action: Prove the file-router carries the route whose topic is the contract subject.
    command: >-
      grep -n -x '  - topic: glossary' docs/contracts/file-router.yaml
    expected: One matching line. Red before because grep exits 1.
    fix_if: No match means the route is missing or its topic differs from the subject.
    hermetic: true
    expected_literals:
      - "topic: glossary"
    graduation: graduate
    graduation_check_id: router-route-glossary
  - step: 10
    phase: pre-deploy
    action: Prove the new Decision exists, found by its title so the number never matters, and its reversal-conditions stanza parses.
    command: >-
      bin/venv-python -c "import re; from pathlib import Path; n=int(re.search(r'^## Decision (\\d+): One name per thing where On The Loop meets its adopters', Path('docs/DECISIONS.md').read_text(encoding='utf-8'), re.M).group(1)); import scripts.preflight.decision_conditions as dc; r={x.decision_id: x for x in dc.evaluate()}; assert n in r and r[n].state != 'MALFORMED' and r[n].error is None, r.get(n); print('STANZA_OK')"
    expected: Exit 0 and the marker. Red before because the title search finds nothing (AttributeError on None, exit 1).
    fix_if: MALFORMED means the reversal-conditions fence or a condition's id/kind is malformed; copy execution step 3 verbatim.
    hermetic: true
    expected_literals:
      - STANZA_OK
    graduation: graduate
    graduation_check_id: decision-glossary-stanza-parses
  - step: 11
    phase: pre-deploy
    action: Run the decision-corpus gates the entry touches -- entry conformance, the per-entry size cap and index freshness.
    command: >-
      bin/venv-python -c "from scripts.checks.decisions.validate_decision_entry_conformance import validate_decision_entry_conformance as a; from scripts.checks.decisions.validate_decisions_size import validate_decisions_size as b; from scripts.checks.decisions.validate_decisions_index_freshness import validate_decisions_index_freshness as d; f=[]; [g(f) for g in (a, b, d)]; assert not f, f; print('DECISION_GATES_OK')"
    expected: >-
      Exit 0 and the marker; the entry measured about 5,255 bytes at plan time with a three-digit number and a date
      (cap 6,144). The envelope's kind block is tolerated today (extract_entry_envelope checks required fields only).
    fix_if: A size failure means wording was added -- restore the verbatim text; an index failure means bin/venv-python -m scripts.decisions_index --write was not re-run.
    hermetic: true
    expected_literals:
      - DECISION_GATES_OK
    graduation: waive
    graduation_waiver_reason: All three are registered decision-corpus checks that run on every --pre or full invocation; step 10 graduates the property specific to this entry.
  - step: 12
    phase: pre-deploy
    action: >-
      Prove every APPROVED TEXT block landed verbatim -- the Decision, the whole contract and the docs/CLAUDE.md section,
      with only NNN and DATE substituted (read from the entry itself).
    command: >-
      bin/venv-python -c "import re, yaml, textwrap; from pathlib import Path; R=lambda f: Path(f).read_text(encoding='utf-8'); D=R('docs/DECISIONS.md'); m=re.search(r'^## Decision (\d+): One name per thing where On The Loop meets its adopters', D, re.M); n=m.group(1); d=re.search(r'decided_date: .(\d{4}-\d\d-\d\d).', D[m.start():]).group(1); S=yaml.safe_load(R('docs/plans/PLAN-glossary.yaml'))['execution_steps']; B=lambda p: textwrap.dedent([s for s in S if s.startswith('APPROVED TEXT. ' + p + ' ')][0].split(chr(10), 1)[1]).strip(chr(10)).replace('NNN', n).replace('DATE', d); a=B('docs/DECISIONS.md') in D; b=R('docs/contracts/glossary.yaml') == B('docs/contracts/glossary.yaml') + chr(10); c=R('docs/CLAUDE.md').endswith(chr(10) * 2 + B('docs/CLAUDE.md') + chr(10)); assert a and b and c, (a, b, c); print('APPROVED_TEXT_OK', n)"
    expected: Exit 0 and the marker with the Decision number. Red before because the Decision title search finds nothing (exit 1).
    fix_if: >-
      The printed tuple names the block that differs (Decision, contract, docs/CLAUDE.md). Restore the approved wording;
      any change beyond NNN and DATE needs Benjamin's word.
    hermetic: true
    expected_literals:
      - APPROVED_TEXT_OK
    graduation: waive
    graduation_waiver_reason: >-
      A one-time landing proof that reads this plan file; once landed, step 10 and the registered checks guard the
      durable properties.
  - step: 13
    phase: pre-deploy
    action: Prove docs/CLAUDE.md stays within its S2 prose budget and file-router.yaml within 500 effective lines, both with no raise.
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as p; from scripts.checks.structural.size_limits import validate_structural_size_limits as s; f=[]; p(f); s(f); assert not f, f; print('SIZE_OK')"
    expected: Exit 0 and the marker; docs/CLAUDE.md at about 3,660 of 3,813 bytes and file-router.yaml at or under 500 effective lines.
    fix_if: >-
      A prose failure means the section grew past the approved text -- restore it. A file-router failure means the
      compaction did not save enough lines -- compact one more oldest field_add row; never raise the limit.
    hermetic: true
    expected_literals:
      - SIZE_OK
    graduation: waive
    graduation_waiver_reason: validate_prose_limits and validate_structural_size_limits are registered in both tiers and measure every file on every run.
  - step: 14
    phase: pre-deploy
    action: Prove the defining rec rule -- gate_write refuses a new rec whose title uses "platform" unqualified, naming the column, the word and say_instead.
    command: >-
      bin/venv-python -m pytest tests/test_ops_data_portal_validators.py::test_glossary_lint_refuses_unqualified_title -q
    expected: Exit 0, one node passes. Red before because the node does not exist (pytest exit 4).
    fix_if: A failure means the handler is not wired into _producer_handlers or the contract leg is not declared; fix the wiring, never the fixture.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: rec-portal-glossary-lint-refuses
  - step: 15
    phase: pre-deploy
    action: Prove update_rec judges only new text -- a context update keeping a stored sentence with an unqualified word passes, and adding a new one fails.
    command: >-
      bin/venv-python -m pytest tests/test_ops_data_portal_validators.py::test_glossary_lint_update_judges_only_new_sentences -q
    expected: Exit 0, one node passes. Red before because the node does not exist (pytest exit 4).
    fix_if: A failure means the handler does not receive the stored value or splits sentences differently from execution step 9.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: rec-portal-glossary-lint-new-text-only
  - step: 16
    phase: pre-deploy
    action: Prove the writer's engine records glossary_lint as a producer-side exemption and never evaluates it.
    command: >-
      bin/venv-python -m pytest tests/row_rules/test_rules.py::test_glossary_lint_is_a_producer_side_kind -q
    expected: Exit 0, one node passes. Red before because the node does not exist (pytest exit 4).
    fix_if: A failure means PRODUCER_SIDE_KINDS lacks the kind; without it the deployed writer cannot load the projection.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: row-rules-glossary-lint-producer-side
  - step: 17
    phase: pre-deploy
    action: >-
      Prove the contract, its generated projection and the rule grammar agree, and run the new and changed test modules
      for the rec rule.
    command: >-
      bin/venv-python -m scripts.schema_to_field_semantics --check && bin/venv-python -c "from scripts.checks.contracts.validate_write_time_enforcement_conformance import validate_write_time_enforcement_conformance as a; from scripts.checks.contracts.validate_ops_rule_source import validate_ops_rule_source as b; from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as c; from scripts.checks.deps.validate_pre_glob_closure import validate_pre_glob_closure as d; f=[]; [g(f) for g in (a, b, c, d)]; assert not f, f; print('RULE_SOURCE_OK')" && bin/venv-python -m pytest tests/checks/contracts/test__glossary_words.py tests/checks/contracts/test__rule_grammar.py tests/test_ops_data_portal_validators.py tests/row_rules/test_rules.py tests/test_security_detector_probe.py tests/test_contract_rules.py -q
    expected: Exit 0, the generator reports no drift, RULE_SOURCE_OK printed, and every node passes.
    fix_if: >-
      Generator drift means field_semantics.yaml was not regenerated; a conformance failure names the column and leg;
      a _rule_grammar failure means PRODUCER_CLASS and PRODUCER_SIDE_KINDS disagree; a pre-glob closure failure names
      a check whose pre_globs miss the helper (execution step 9 (r8)).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The four checks are registered and run on every --pre or full invocation, and the test modules are whole-file
      re-runs of files this plan creates or modifies (vp-red-before.yaml hermetic_authoring rule v); steps 14-16
      graduate the defining nodes.
  - step: 18
    phase: pre-deploy
    action: Run the fast tier.
    command: >-
      bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the named check at its cause; never weaken a rule or skip a test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion); the tier is itself the standing guard and runs on every PR.
  - step: 19
    phase: pre-deploy
    action: Run the full tier before handoff.
    command: >-
      bin/venv-python -m scripts.validate
    expected: Exit 0.
    fix_if: Fix the named check at its cause; never weaken a rule or skip a test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion); the full tier runs post-merge on main as the standing guard.
  - step: 20
    phase: post-deploy
    action: After the squash-merge, ETL the Decision to the warehouse, prove its row exists and the three follow-on recs are still open.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md && bin/venv-python -c "import re; from pathlib import Path; n=int(re.search(r'^## Decision (\\d+): One name per thing where On The Loop meets its adopters', Path('docs/DECISIONS.md').read_text(encoding='utf-8'), re.M).group(1)); from scripts.ops_portal.decisions import _fetch_decision_from_reader as g; from scripts.ops_data_portal import _fetch_rec_from_reader as r; assert g(f'dec-{n}'), n; assert all(r(x)['status'] == 'open' for x in ('rec-4676', 'rec-4762', 'rec-4768')); print('POST_MERGE_OK', n)"
    expected: Exit 0 and the marker with the Decision number.
    fix_if: A missing row after a clean backfill means the entry did not parse -- re-run VP step 11 against main.
    hermetic: false
  - step: 21
    phase: post-deploy
    action: >-
      The governed deploy-ducklake-lambdas.yml run for the merge commit concluded success, and every DuckLake deploy
      record names the commit that last touched the deploy paths. Read the run's conclusion with
      mcp__github__actions_list (workflow deploy-ducklake-lambdas.yml, head_sha the merge commit) and export it as
      DEPLOY_CONCLUSION before running the command.
    command: >-
      git fetch origin main --quiet && test "$DEPLOY_CONCLUSION" = success && bin/venv-python -c "import json,subprocess,boto3;s=boto3.Session(profile_name='agent_platform').client('s3'); h=subprocess.check_output(['git','log','-1','--format=%H','origin/main','--',':(glob)src/lambdas/ducklake_*/**',':(glob)src/common/ducklake_*.py','config/lambda/ducklake','src/row_rules','src/telemetry']).decode().strip(); f=['writer','reader','telemetry-writer','telemetry-reader','catalog-dr','maintenance','maintenance-smoke']; bad=[x for x in f if json.loads(s.get_object(Bucket='agent-platform-data-lake',Key=f'deploy-records/ducklake/agent-platform-ducklake-{x}.json')['Body'].read()).get('source_git_sha')!=h]; assert not bad, bad; print('DEPLOY_RECORDS_FRESH')"
    expected: Exit 0 and DEPLOY_RECORDS_FRESH printed.
    fix_if: >-
      A failed run: read its log and fix forward on a new PR (Decision 226); never fall back to the break-glass local
      deploy. A stale record names the function whose deploy leg did not run. If the run logged a
      TELEMETRY_PRODUCTION_HOLD notice, the telemetry writer and reader stay on their prior commit by design (their
      old engine and old projection agree): re-run with those two removed from f and report the hold; it is not a
      failed deploy. If the record key names differ, assert the set the workflow's record steps write and report it.
    hermetic: false
  - step: 22
    phase: post-deploy
    action: The deployed writer still enforces every row-rule class with the new projection (the gate the workflow's smoke job runs).
    command: >-
      DUCKLAKE_WRITER_URL="$(aws ssm get-parameter --name /agent-platform/ducklake/writer_url --query Parameter.Value --output text --profile agent_platform --region eu-west-2)" DUCKLAKE_READER_URL="$(aws ssm get-parameter --name /agent-platform/ducklake/reader_url --query Parameter.Value --output text --profile agent_platform --region eu-west-2)" bin/venv-python -m scripts.ducklake_neon_smoke_test --lambda-row-rules --profile agent_platform
    expected: Exit 0 and the row-rules smoke OK line printed.
    fix_if: A failure after a green deploy means the shipped projection does not load; compare the deployed record's sha with VP step 21 and fix forward.
    hermetic: false
