    cite: "tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_replay_registers_one_project_per_tree_and_pass"
  - candidate: "[assertion-removed] tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_tree_rows_must_match_the_sent_set_with_one_root"
