schema_version: 6
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: golden-gates-test-cost
intent: >-
  Clear the full-tier red rec-5497 by making the slowest telemetry replay tests cheaper, so a slow CI runner no longer
  pushes them past the 120 s pytest-timeout (which kills the xdist worker and reads as "worker crashed"). Test-only
  change; the timeout, the replay script and the fixtures do not move.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-golden-gates-test-cost.yaml
phase: >-
  ci_rca (soft-warn exception category: rec-5497, source ci_rca, Critical; no tier_item claimed, so the Tier Item
  Freshness Gate is skipped). No Lambda-packaged or .tf file changes, so V2.
cites: [dec:181, dec:201, dec:226, dec:244]
scope:
  - file: tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py
    action: Modify
    purpose: >-
      (1) test_tree_rows_must_match_the_sent_set_with_one_root: take the monkeypatch fixture and narrow the replay to
      the corpus:tool_result_error passes through the existing _with_passes helper (extra {}), so each of the two
      mismatch cases (a dropped row, two roots) replays one tree instead of the whole corpus; keep both cases' exit 1
      and GOLDEN_MISMATCH verb=session_tree_rows assertions; drop the trailing full clean replay, whose assertion
      (no mismatch on a clean run, including trees that store no row) is already made by
      test_replay_registers_one_project_per_tree_and_pass, and move its explanatory message onto that test's
      `not stats.mismatches` assertion. (2) test_deploy_records_follow_the_routed_reader: take monkeypatch and narrow
      both catalogs' replays with one _with_passes(monkeypatch, {}) call before the loop; keep every existing assertion (deploy_functions
      routing, skew 0, no mismatches, trees > 0, both records read). Every other test and every node name stays
      unchanged (graduated entries telemetry-golden-replay-over-fakes and
      golden-replay-asserts-catalog-before-registration pin two of them).
  - file: tests/telemetry_verify/test_monitor_capacity.py
    action: Modify
    purpose: >-
      Build fewer golden worlds and run the monitor fewer times; every node name and every asserted property stays.
      (1) test_two_workers_report_equals_one_worker: run workers=1 and workers=2 once each with world.cost = 11.0 and
      budget monitor.Budget(10**6, world.clock), and assert on those two reports both the equality of every
      non-timing field (the existing skip set) and the slow-call properties (calls_over_10s == reader_calls - 2 for
      both; call_p95_s == 11 for one worker, >= 11 for two), instead of four separate runs (probed 2026-11-23: the
      equality holds under these settings). (2) A module-scoped fixture first calls
      pytest.importorskip("duckdb", reason="env: duckdb is not installed in the fast tier") (the file has no
      module-level duckdb import and is collected in the fast tier, so without it the fixture would turn skips into
      setup errors), then computes the plain golden world's reader_calls once (one _locked_world().run(); that world
      has no litellm tree, so it needs no LITELLM_FLOOR patch); _refuse_last_litellm and
      test_oversize_day_counts_sum_and_backfill_reads_rest read it instead of building and running their own baseline
      world. (3) The full-read check that the litellm tree is read when the budget is unbounded (litellm_quiet == 1
      and litellm_read == 1) stays in a test body, made once in test_floor_met_excuses_litellm_without_coverage_alarm
      on the same litellm world that test then reruns under the refused budget (a second run on one world gives the
      same reader_calls on the plain world, probed 2026-11-23; if the litellm world's second run differs, build a
      second litellm world for the refused run instead); test_floor_missed_raises_coverage_incomplete builds its own litellm world
      and makes only its refused run. Both floors stay monkeypatched per test.
bundled_recommendations: [rec-5497]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - test_tree_rows_must_match_the_sent_set_with_one_root replays one corpus tree per mismatch case and makes no full clean replay; both mismatch cases still exit 1 with GOLDEN_MISMATCH verb=session_tree_rows.
  - test_deploy_records_follow_the_routed_reader replays one corpus tree per catalog and keeps every existing assertion.
  - test_monitor_capacity.py builds the plain golden world and runs it with default limits at most once per module for the baseline (after a duckdb importorskip, so the fast tier still skips rather than errors), and test_two_workers_report_equals_one_worker makes two monitor runs instead of four, with every existing assertion kept.
  - No pytest timeout value changes anywhere (scripts/checks/_scaffolding.py, pyproject.toml, any timeout marker).
  - Both files pass in full. On the build container (-n0, measured against its own main baseline from the first execution step) the two edited golden nodes each take under 3 s; no monitor_capacity node takes over 30 s including module fixture setup charged to it (pytest-randomly decides which node that is); and the monitor file's total wall time is at most two thirds of its main baseline. Planning baseline on b5326b3d (planning container, 2026-11-23) - tree rows 20.3 s, deploy records 14.2 s, two workers 35.8 s, floor met 26.7 s, floor missed 26.7 s, oversize 22.7 s; the critic's container measured the monitor file at 115.5 s total.
  - rec-5497's acceptance is updated to the command in verification step 1 before the merge, and the merge closes it.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the six edited nodes by node id (rec-5497's new acceptance).
    command: >-
      bin/venv-python -m pytest
      tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_tree_rows_must_match_the_sent_set_with_one_root
      tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py::test_deploy_records_follow_the_routed_reader
      tests/telemetry_verify/test_monitor_capacity.py::test_two_workers_report_equals_one_worker
      tests/telemetry_verify/test_monitor_capacity.py::test_floor_met_excuses_litellm_without_coverage_alarm
      tests/telemetry_verify/test_monitor_capacity.py::test_floor_missed_raises_coverage_incomplete
      tests/telemetry_verify/test_monitor_capacity.py::test_oversize_day_counts_sum_and_backfill_reads_rest -q
    expected: exit 0, 6 passed, no skips
    fix_if: any node fails or skips (fix the edit; never loosen an assertion, Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Every node needs duckdb (a module-level importorskip in the golden file, per-test importorskips plus the new
      fixture's in test_monitor_capacity.py), which venv-less pr-validate lacks, and every node is already in the full
      tier; the graduated entries telemetry-golden-replay-over-fakes,
      golden-replay-asserts-catalog-before-registration and monitor-read-budget keep pinning their nodes.
  - step: 2
    phase: pre-deploy
    action: Run both edited files in full.
    command: >-
      bin/venv-python -m pytest tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py
      tests/telemetry_verify/test_monitor_capacity.py -q
    expected: exit 0, no failures, no skips
    fix_if: any node fails or skips (fix the edit; never loosen an assertion, Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file re-run of existing standing tests already in the full tier; it adds no new guard.
  - step: 3
    phase: pre-deploy
    action: Measure per-test cost on the build container against the planning baseline.
    command: >-
      bin/venv-python -m pytest tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py
      tests/telemetry_verify/test_monitor_capacity.py -q -n0 --durations=12
    expected: >-
      exit 0; test_tree_rows_must_match_the_sent_set_with_one_root and test_deploy_records_follow_the_routed_reader
      each under 3 s (setup plus call); every test_monitor_capacity node under 30 s including any module fixture setup
      charged to it; the monitor file's total at most two thirds of the main baseline taken in the first execution
      step. Record both durations tables in the PR body.
    fix_if: >-
      a golden node still replays the whole corpus (check the _with_passes narrowing), or a monitor node still builds
      its own baseline world
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A runner-dependent wall-clock bound would be a flaky standing guard; the property it checks (fewer replays and world builds) is a one-time cost measurement for this change.
  - step: 4
    phase: pre-deploy
    action: Confirm no timeout value moved.
    command: >-
      git diff --exit-code origin/main -- scripts/checks/_scaffolding.py pyproject.toml && ! git diff origin/main --
      tests/ | grep -nE '^\+.*(timeout|pytest\.mark\.timeout)'
    expected: exit 0 (no diff in either config file, no added timeout line in tests/)
    fix_if: a timeout was raised or a timeout marker added (revert it; the direction is a cheaper test)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A diff against origin/main is this session's transient state (a moment claim, Decision 244 cl.4), not a standing guard.
  - step: 5
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): bin/venv-python -m scripts.validate --pre in the
      foreground (exit 0), then this command as its own backgrounded run with a 2 h limit from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: --pre exited 0 first; this command exits 0 for HEAD
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun; a failure only in another open red
      (rec-5491 at plan time, owned by the sibling Feedback Loop thread) goes to the operator as the implement skill's
      go/no-go; it never hands off on a non-green full tier by default
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: Confirm rec-5497 closed after the squash merge (Resolves trailer).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      r=make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5497')[0]; print(r['status']); assert r['status']=='closed'"
    expected: rec-5497 status closed
    fix_if: still open after ci.yml's closure job ran; close it with update_rec citing the merge SHA and step 1's result
    hermetic: false
test_obligations:
  - source: tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py
    behavior: The session_tree_rows mismatch detection and the routed deploy-record reads stay guarded on a one-tree replay.
    verification_step: 2
    test_selector: tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py
    waiver_reason: >-
      A test file, not behaviour: the edit narrows two tests' replay set and removes one duplicate clean replay whose
      assertion test_replay_registers_one_project_per_tree_and_pass already makes; no production code changes, so
      there is no red-before to show beyond step 3's cost measurement.
  - source: tests/telemetry_verify/test_monitor_capacity.py
    behavior: Two-worker equality, slow-call stats, litellm floor and oversize backfill stay guarded with fewer world builds and runs.
    verification_step: 2
    test_selector: tests/telemetry_verify/test_monitor_capacity.py
    waiver_reason: >-
      A test file, not behaviour: the edit shares one baseline world run per module and folds two runs into two others;
      every asserted property is kept, so there is no red-before to show beyond step 3's cost measurement.
