  - source: scripts/checks/verification/validate_graduated_rerun.py
    behavior: a hung record is red and named instead of stalling the full tier
    verification_step: 3
    test_selector: tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_hung_record_times_out_red
    red_green_expectation: red before (module absent), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: both new checks classify as code_regression
