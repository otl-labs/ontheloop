schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "graduated-records-standing-rerun"
intent: >-
  Make graduated verification records standing regression guards: the full tier re-runs every record (statically
  resolving the pinned test ids the test suite already runs) and fails on a red one, except records on a committed,
  shrink-only known-red list holding today's reds; the reversal of the 2026-09-26 "admitted once" verdict is recorded
  as a new Decision, and moment-shaped claims stop graduating as standing guards.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-graduated-records-standing-rerun.yaml
phase: >-
  Ad-hoc recommendation work (rec-4831 plus duplicates rec-3341, rec-3247, rec-3119); no tier_item criterion is
  closed. Touches deferred T3.7 (c7) and pending CD.29 by appended annotation only; T3.7 stays deferred_post_mvp
  (Decision 93) and CD.29 stays pending.
closes_criteria: []
scope:
  - file: scripts/checks/verification/validate_graduated_rerun.py
    action: Create
    purpose: >-
      Registered check validate_graduated_rerun (full tier only). Loads live records through
      scripts.verification_graduation.load_entries (never a hand-rolled glob, Decision 176) and the known-red list.
      Partitions records into SUITE-COVERED and RUN. SUITE-COVERED: primitive_slot test_selector, and
      command_exit_zero records whose argv starts with exactly [bin/venv-python|python, -m, pytest] (no shell; a
      command_output_matches pytest record asserts on output the suite never checks, so it is RUN); in either case a
      record is RUN instead when any pytest argument can select an integration-marked test: a node id whose function or
      class carries a pytest.mark.integration decorator or whose module pytestmark names it, or a bare file or
      directory argument containing any such test (a -k expression is not evaluated, so the whole file counts), found
      by _graduated_rerun_nodes, because the full tier's unit run passes -m "not integration". Every pytest node argument of a SUITE-COVERED record is resolved through
      _graduated_rerun_nodes (unresolvable = red). RUN records execute in a ThreadPoolExecutor of
      min(8, os.cpu_count() or 1) workers; each command-slot record runs in a child process (this module's
      one-record entry point, python -m with the check_id and --root <tree>, started from HEAD's repository root so it
      imports HEAD's code even when the tree under test is an origin/main worktree, start_new_session=True; the child
      calls materialize_check_in_tree(row, tree)) under a 300-second wall-clock limit,
      and on expiry the whole process group is killed and the record is red with "timed out after 300 s"; pure-Python
      slots (grep_count, file_presence) run in-process through materialize_check_in_tree(row, ROOT).run(). Each non-PASS
      record is re-run once, alone, under the same limit after the pool drains, and is red only if that serial run is
      also non-PASS (a record that passes alone is printed as load-sensitive, never silently dropped); a
      GraduationError from materialization is red (Decision 55). Prints the header "=== Graduated record re-run ===" and, after it, one summary line
      "<N> graduated_records examined, <R> red (<L> listed), <S> load-sensitive".
      Fails, one failure line per record naming check_id, guard_target and the first line of the failure output
      (Decision 142's fingerprint needs the id): an unlisted red record; a listed record that is not red ("passes;
      remove it from known_red.yaml"); a listed id that is not a live record ("retired or renamed; remove it"); a
      duplicate listed id; a malformed or missing list file. Declares registry.examined(<records evaluated>,
      unit="graduated_records"). Public helpers red_records(root) and live_ids(root). Under 400 SLOC; if it grows
      past, move the partition or pool into its own underscore module rather than raising any budget.
    new_imports: [scripts.verification_graduation, scripts.checks.verification._graduated_rerun_nodes]
  - file: scripts/checks/verification/validate_known_red_shrinks.py
    action: Create
    purpose: >-
      Registered check validate_known_red_shrinks (fast and full tiers), in its own module so its import closure stays
      small (scripts.checks._common, scripts.checks.registry, yaml, subprocess only; never
      scripts.verification_graduation, whose closure validate_pre_glob_closure would demand in pre_globs). Reads the
      list at HEAD and at the base, git merge-base HEAD origin/main, falling back to origin/main (git show, Decision
      176 cl.4), and fails when HEAD holds a check_id the base list lacks; registry.skipped when no base ref resolves or
      the base has no list file (the introducing change only). Comparing against the merge base keeps a branch green
      when main has removed a different id since it branched.
  - file: scripts/checks/verification/_graduated_rerun_nodes.py
    action: Create
    purpose: >-
      Pure static resolution of a pytest node id "path.py[::Class[::Nested]]::function[param]" against the tree
      (rec-4115's measured design: file existence, then an ast walk of the Class/function segments with any
      "[...]" suffix stripped; a bare file or directory argument resolves by existence; flags such as -q, -k and
      -m are skipped, and a -k/-m expression argument is skipped with it). Returns the unresolved node ids, and
      separately reports whether an argument can select an integration-marked test (a node whose function or class
      carries the decorator or whose module pytestmark names integration, or a bare file or directory containing any
      such test). No pytest import, no collection.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      Two Entries (Decision 169: registered here, never in validate.py): validate_graduated_rerun with pre=False and
      full_segment="full_after_lint"; validate_known_red_shrinks (module scripts.checks.verification.validate_known_red_shrinks) with pre=True,
      pre_globs=("config/agent/verification_registry/known_red.yaml", "scripts/checks/verification/**",
      "scripts/checks/_common.py", "scripts/checks/registry.py") and full_segment="full_after_lint"; re-measure with
      validate_pre_glob_closure (VP 10) and add any glob it names, never prune its finding.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: Two function_to_category rows, validate_graduated_rerun and validate_known_red_shrinks, both code_regression.
  - file: config/agent/verification_registry/known_red.yaml
    action: Create
    purpose: >-
      The known-red list: {schema_version: 1, entries: [{check_id, owner_rec, entered_at}]}, sorted by check_id,
      holding exactly the live records red on the build's origin/main base (VP step 7 measures it). owner_rec is
      the follow-on triage rec rec-4871, except the records whose only defect is an unresolvable
      pinned test id, which name rec-4115. No counts, no other fields (Decision 176 cl.3 anti-accretion).
  - file: tests/checks/verification/test_validate_graduated_rerun.py
    action: Create
    purpose: >-
      Mirror tests over a tmp-path tree with patched _common.ROOT (registry shards written through shard_path_for's
      layout): an unlisted red record fails naming its check_id
      (TestRerun::test_unlisted_red_record_fails); a listed red record passes
      (TestRerun::test_listed_red_record_passes); a listed green record fails (TestRerun::test_listed_green_record_fails);
      a listed retired id fails (TestRerun::test_listed_id_not_live_fails); a duplicate id fails; a stale pinned node
      id on a test_selector record and on a plain-pytest command record fails (TestRerun::test_stale_node_id_fails);
      a record that fails in the pool but passes alone is not red and is reported load-sensitive
      (TestRerun::test_load_sensitive_record_passes_serial_confirm); the shell-wrapped pytest command is RUN, not
      suite-covered (TestRerun::test_shell_wrapped_pytest_is_run); a record pinning an integration-marked test is RUN
      (TestRerun::test_integration_marked_pin_is_run), including a bare-file argument with a -k expression over a
      file holding an integration-marked class (the gc-guards-g2-g3-g4-discriminate shape); a record that exceeds the wall-clock limit (limit patched to
      about 1 s, command sleeps) is red, named, and its process group is gone
      (TestRerun::test_hung_record_times_out_red); examined() count equals records evaluated.
  - file: tests/checks/verification/test_validate_known_red_shrinks.py
    action: Create
    purpose: >-
      Shrink leg against a temporary git repo with an origin/main ref: an added id fails
      (TestShrink::test_added_id_fails); a removed id passes (TestShrink::test_removed_id_passes); no base list is
      skipped (TestShrink::test_no_base_list_skips); an id main removed after the branch point does not fail a branch
      that still lists it (TestShrink::test_merge_base_comparison).
  - file: tests/checks/verification/test__graduated_rerun_nodes.py
    action: Create
    purpose: >-
      Resolution cases: file::function, file::Class::method, nested class, [param] suffix, bare file, directory,
      missing file, missing function (TestResolve::test_missing_function_unresolved), flags and -k expressions skipped,
      integration marker found on a function, a class, a module pytestmark and anywhere in a bare-file argument
      (TestResolve::test_integration_marker_detected).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the sidecar (docs/plans/approved/graduated-records-standing-rerun.yaml blocks decision-new and
      decision-197-update): the new Decision above the current top entry, and an appended Update line on Decision
      197 (its 2026-09-26 amendment line is not edited, Decision 177).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar (blocks roadmap-t3-7-c7, roadmap-cd-29): appended amendment brackets on T3.7 c7 and CD.29;
      no status or state changes.
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar (blocks registry-version, registry-governance-note, registry-log-compaction):
      contract_version 6 -> 7, the STANDING governance note with its amendment_log row, and two older log rows
      compacted to flow style with their words unchanged (the file is at its 500-line contracts-class limit;
      measured 503 without the compaction).
  - file: docs/contracts/vp-red-before.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar (blocks vp-red-before-moment-claims, vp-red-before-version, vp-red-before-amendment-log):
      the moment-claim sentence in graduation_disposition_authoring, contract_version 7 -> 8 and its amendment_log row.
  - file: tests/test_project_alignment_contract.py
    action: Modify
    purpose: >-
      Exactly the sidecar (block alignment-test-log-lookup), operator-approved under Decision 235 cl.1:
      test_verification_registry_records_the_in_place_edit finds the PLAN-project-alignment amendment row anywhere
      in the log instead of at position 0, keeping its semantic_break assertion; any new registry amendment row
      otherwise breaks it.
  - file: docs/plans/approved/graduated-records-standing-rerun.yaml
    action: Create
    purpose: The operator-approved sidecar binding every always-ask word of this plan (committed in the plan PR).
bundled_recommendations: [rec-4831, rec-3341, rec-3247, rec-3119]
followon_recs: [rec-4871]
infrastructure_dependencies: []
acceptance_criteria:
  - The full tier fails when a live graduated record that is not on known_red.yaml is red, naming the record.
  - The full tier fails when a known_red.yaml entry passes, is not a live record, or is duplicated.
  - The full tier fails when a pinned pytest node id of a test_selector or plain-pytest record does not resolve.
  - A record that fails only under the parallel pool and passes alone is not red, and is reported load-sensitive.
  - The fast tier fails a change that adds an id to known_red.yaml; removing one passes.
  - known_red.yaml holds exactly the live records red on the build's origin/main base, and HEAD adds no red record.
  - DECISIONS.md, the roadmap, both contracts and the alignment test match the sidecar word for word.
  - rec-4831, rec-3341, rec-3247 and rec-3119 are closed through the trailer; the triage follow-on rec stays open.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: An unlisted red record fails the full-tier re-run and names itself; a listed one passes
    command: bin/venv-python -m pytest "tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_unlisted_red_record_fails" "tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_listed_red_record_passes" -q
    expected: Both pass.
    fix_if: The red record is not reported, or reported without its check_id.
    hermetic: true
    graduation: graduate
    graduation_check_id: graduated-rerun-unlisted-red-fails
  - step: 2
    phase: pre-deploy
    action: The known-red list is strict -- a listed green record, a listed non-live id and a stale pinned node id all fail
    command: bin/venv-python -m pytest "tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_listed_green_record_fails" "tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_listed_id_not_live_fails" "tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_stale_node_id_fails" -q
    expected: All three pass.
    fix_if: A green listed record or a retired id is tolerated (the list would stop shrinking), or a moved test id passes.
    hermetic: true
    graduation: graduate
    graduation_check_id: graduated-rerun-known-red-strict
  - step: 3
    phase: pre-deploy
    action: >-
      A load-sensitive record is confirmed serially and not called red; shell-wrapped pytest and integration-marked
      pins are run, not skipped; a hung record times out red
    command: bin/venv-python -m pytest "tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_load_sensitive_record_passes_serial_confirm" "tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_shell_wrapped_pytest_is_run" "tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_integration_marked_pin_is_run" "tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_hung_record_times_out_red" -q
    expected: All four pass.
    fix_if: >-
      A timing-only failure reds main, a shell command containing pytest or a pin the unit run deselects escapes the
      re-run, or a hung record stalls the tier instead of failing by name.
    hermetic: true
    graduation: graduate
    graduation_check_id: graduated-rerun-serial-confirm
  - step: 4
    phase: pre-deploy
    action: The list only shrinks
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_known_red_shrinks.py -q
    expected: Passes, including test_added_id_fails, test_removed_id_passes, test_no_base_list_skips and test_merge_base_comparison.
    fix_if: An added id passes the fast tier.
    hermetic: true
    graduation: graduate
    graduation_check_id: known-red-list-only-shrinks
  - step: 5
    phase: pre-deploy
    action: Static node-id resolution
    command: bin/venv-python -m pytest tests/checks/verification/test__graduated_rerun_nodes.py -q
    expected: Passes, including TestResolve::test_missing_function_unresolved.
    fix_if: A missing function or class resolves, or a [param] suffix or a -k expression makes a real node unresolvable.
    hermetic: true
    graduation: graduate
    graduation_check_id: graduated-rerun-node-ids-resolve
  - step: 6
    phase: pre-deploy
    action: Both checks are registered in the right tiers and taxonomy
    command: >-
      bin/venv-python -c "from scripts.checks import registry; f=[s.name for s in registry.full_sequence()];
      p=[s for s in registry.pre_sequence() if s.name=='validate_known_red_shrinks']; import yaml;
      t=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];
      assert 'validate_graduated_rerun' in f and 'validate_known_red_shrinks' in f, f;
      assert not [s for s in registry.pre_sequence() if s.name=='validate_graduated_rerun'];
      assert p and 'config/agent/verification_registry/known_red.yaml' in p[0].pre_globs, p;
      assert t['validate_graduated_rerun']==t['validate_known_red_shrinks']=='code_regression'; print('REGISTERED_OK')"
      && bin/venv-python -m pytest tests/checks/registry/test_sequences.py -q
    expected: Exit 0.
    fix_if: The re-run leaked into --pre (budget), or the shrink leg is missing from --pre.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Decision 187's tier-demotion gate already guards losing pre or full_segment, and validate_ci_rca_taxonomy covers
      the rows; the residual this leaves (promoting the re-run into --pre) is guarded only by the fast-tier budget and
      review.
  - step: 7
    phase: pre-deploy
    action: >-
      The list is exactly main's reds and the build adds none: run the new module's evaluation (HEAD's code) against
      an origin/main worktree's records and against HEAD's records; HEAD's red set equals the list, and the list
      equals main's red set restricted to records live at HEAD.
    command: |-
      bin/venv-python - <<'PY'
      from pathlib import Path
      import yaml
      from scripts.verification_graduation import git_worktree
      from scripts.checks.verification import validate_graduated_rerun as g
      lst = {e["check_id"] for e in yaml.safe_load(open("config/agent/verification_registry/known_red.yaml"))["entries"]}
      head = g.red_records(Path("."))
      with git_worktree("origin/main") as w:
          main = g.red_records(Path(w))
      live = g.live_ids(Path("."))
      assert head == lst, ("head", sorted(head ^ lst))
      assert lst == main & live, ("main", sorted(lst ^ (main & live)))
      print("KNOWN_RED_EXACT", len(lst))
      PY
    expected: >-
      Exit 0 and KNOWN_RED_EXACT with the count printed (about 50 on 2026-11-03's main; the build records its own).
      Two full RUN passes take several minutes: run it backgrounded, not in the 10-minute foreground.
    fix_if: >-
      HEAD has a red record not red on main: the build caused it -- fix the surface, never list it (Decision 181). A
      main red missing from the list: add it (this is the introducing change). red_records and live_ids are the
      module's public helpers the check itself uses.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Base-relative to origin/main at build time; after merge the list only shrinks and validate_graduated_rerun enforces the same equality on every full-tier run.
  - step: 8
    phase: pre-deploy
    action: The governed text matches the operator-approved sidecar word for word
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug graduated-records-standing-rerun --base origin/main
      && bin/venv-python -m pytest -q
      tests/test_project_alignment_contract.py::TestRegistryShardRepair::test_verification_registry_records_the_in_place_edit
    expected: Exit 0.
    fix_if: Any bound file differs from the sidecar beyond a filled {{N}}/{{DATE}} -- stop and ask; never re-derive the sidecar.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Base-relative to origin/main; vacuous after merge, when origin/main holds the bound text.
  - step: 9
    phase: pre-deploy
    action: Decisions index regenerated for the new entry
    command: bin/venv-python -m scripts.decisions_index --check
    expected: Exit 0.
    fix_if: Run --write and commit docs/decisions-index.json.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Already enforced by the decisions-index freshness check in the fast tier.
  - step: 10
    phase: pre-deploy
    action: Fast tier
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Diagnose the named check (Decision 55).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-tier run; not a single kernel check.
  - step: 11
    phase: pre-deploy
    action: Full tier before handoff, on the committed, rebased tree (includes the new re-run)
    command: bin/venv-python -m scripts.validate
    expected: >-
      Exit 0 via scripts.checks.validation_result --verify-head; validate_graduated_rerun reports its examined count and
      its wall time is under ten minutes (the Decision's leg-cost reversal condition).
    fix_if: Diagnose the named failing check on the branch; a failure outside this scope is a rec, not an inline patch.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-tier run; not a single kernel check.
  - step: 12
    phase: post-deploy
    action: The first main-validate run on the merge commit is green with the new check enforcing
    command: >-
      mcp__github__actions_list (workflow ci.yml, branch main, head_sha set to the squash-merge SHA) then
      mcp__github__get_job_logs for main-validate; find the "=== Graduated record re-run ===" header and the
      summary line "<N> graduated_records examined, <R> red (<L> listed), <S> load-sensitive" after it.
    expected: main-validate conclusion success; the summary line shows R equal to L and validate_graduated_rerun failed none.
    fix_if: >-
      A record green locally but red on the CI runner is an environment difference -- route it as red main
      (Decision 226), fix the record's surface or retire it with operator approval; never add it to the list.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: Bundled recs closed
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'),
      ['rec-4831','rec-3341','rec-3247','rec-3119']); s={x['id']:x['status'] for x in r}; assert all(v=='closed' for v in s.values()) and not m, (s,m); print('CLOSED', s)"
    expected: All four closed.
    fix_if: Re-run the ci.yml closure job's verdict; never close by hand without the trailer verdict.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/verification/validate_graduated_rerun.py
    behavior: an unlisted red graduated record fails the full tier and names itself
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_unlisted_red_record_fails
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/verification/validate_graduated_rerun.py
    behavior: the known-red list is strict (green, retired and duplicate entries fail)
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_listed_green_record_fails
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/verification/validate_known_red_shrinks.py
    behavior: the list only shrinks
    verification_step: 4
    test_selector: tests/checks/verification/test_validate_known_red_shrinks.py::TestShrink::test_added_id_fails
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/verification/_graduated_rerun_nodes.py
    behavior: an unresolvable pinned node id is reported
    verification_step: 5
    test_selector: tests/checks/verification/test__graduated_rerun_nodes.py::TestResolve::test_missing_function_unresolved
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/verification/_manifest.py
    behavior: the re-run is full-tier only and the shrink leg is in both tiers
    verification_step: 6
    command: bin/venv-python -m pytest tests/checks/registry/test_sequences.py -q
    red_green_expectation: green before and after; step 6's assertion is red before (names absent)
  - source: tests/test_project_alignment_contract.py
    behavior: the alignment test still finds its amendment row after a newer row lands
