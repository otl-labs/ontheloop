    command: bin/venv-python -m pytest tests/checks/registry/test_sequences.py -q
    waiver_reason: >-
      A taxonomy row is data the existing validate_ci_rca_taxonomy gate already requires for every registered check
      (fast tier, step 10); step 6's assertion pins both rows to code_regression, so a new test would duplicate the gate.
  - source: config/agent/verification_registry/known_red.yaml
    behavior: the list holds exactly main's reds and HEAD adds none
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_graduated_rerun.py::TestRerun::test_listed_red_record_passes
    red_green_expectation: red before (module and list absent), green after; step 7 proves the committed list is exact
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: the T3.7 c7 and CD.29 annotations match the approved sidecar word for word
    verification_step: 8
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug graduated-records-standing-rerun --base origin/main
    red_green_expectation: red before (bound text absent), green after
  - source: docs/contracts/verification-registry.yaml
    behavior: the STANDING note, version bump and compacted log rows match the approved sidecar
    verification_step: 8
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug graduated-records-standing-rerun --base origin/main
    red_green_expectation: red before (bound text absent), green after
  - source: docs/contracts/vp-red-before.yaml
    behavior: the moment-claim rule, version bump and log row match the approved sidecar
    verification_step: 8
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug graduated-records-standing-rerun --base origin/main
