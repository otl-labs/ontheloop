    Decision-scout verdict: FLAGS_FOUND (one scout run over both rec-4114 plans; this plan is its Decision 73 WARN's
    resolution). CITE: 205, 73, 249, 246, 170, 104, 159, 181, 244. Decisions triaged: 202 of 202. Flag taken: Decision
    73 WARN (the amendment's premise that every full-only plan reader repeats a fast-tier check was false for
    graduated records) -> this check, chosen by the operator over a declared residual; Decision 244 cl.1's "The fast
    tier does not run it" gets the dated Update in the sidecar.
  - >-
    Operator rulings (2026-11-09, this planning thread): decision card "Close it in this plan" (close the gap rather
    than accept Canary latency); "write the plan". Split into this plan and PLAN-plans-only-main-fast-tier, this one
    first, settled on a blind consult (shared folder rec-4114-plan/advisor-brief-split/ADVICE.md) per the
    2026-11-09 ruling that splitting and ordering are mechanical forks.
  - >-
    Measured at e6eda786: 16 records selected by PLAN_READ_RE; one (roadmap-projection-delta-bounded-to-t15) is red
    and on known_red.yaml; the subset took 34 s wall locally (8 workers). Three of the 16 read plans generically
    (plan-document-fallback-reevaluation-schema, vp-replay-pr-relative-predicate-population,
    roadmap-projection-delta-bounded-to-t15); the rest name specific files or assert plan-related text.
  - >-
    PLAN-plans-only-main-fast-tier depends on this plan's build merging first: until then a plans-only merge would
    leave these records to Main Canary. The coordinator starts that build only after this one merges.
  - >-
    Residual (Decision 181 cl.2): a record that reads plans only through an indirection, and any pre=False registry
    check that reads docs/plans/, are rec-5040's (filed 2026-11-09, read back as rec-5040 from file_rec). rec-4114
    itself closes through the sibling plan's bundled_recommendations, not this one.
  - >-
    Fast-tier budget (Decisions 182, 208; non-test budget 270 s, warning 216 s): CI non-test time is 85-89 s on recent
    plan PRs and 63-146 s on code PRs (critique r1, runs 42530284431, 42519106720, 42540015290, 42537454671,
    42521012669); this check adds about 27-34 s locally (4-8 cores), on plan PRs and on code PRs touching its import
    closure. Measured headroom remains; the step 3 wall time is reported. The 16 records import only yaml and
    pydantic today, which pr-validate installs; a future plan-reading record needing AWS or heavy dependencies would
    go red in pr-validate first.
  - "Decision-scout North Star: Serves NS.3 2/5 (engaged NS.3, NS.6, NS.8, NS.9)."
  - 'red_overlap (2026-11-09, main e6eda786): {"verdict": "clear", "slo_hours": 4, "reds": []}'
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
  - {gate: wording-check, round: 1, verdict: PASS, digest: 7ac38d464616233859ba5d605407351f2b13618788d6457352ff8abcbccfc75f, base: e6eda786a224d348d5e3620728e2c52b2ebcb0eb, selection: complete}  # pragma: allowlist secret
  - {gate: plan-critique, round: 1, verdict: REVISE, blocking: 5, nits: 8}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decision 244 and Decision 205 clause 5 read (only the plan-cited sections)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    validate_graduated_rerun.py: add the keyword-only select parameter to evaluate(); run step 2 to confirm
    unchanged behaviour.
  - Create validate_graduated_rerun_plan_readers.py and its test file; register the manifest Entry and the taxonomy row.
  - Place the sidecar block decision-244-update in docs/DECISIONS.md with {{DATE}} filled; run step 4.
  - Execute Verification Plan steps 1-6 -- loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
  - >-
    Report: what was implemented; each VP step's result; the step 3 count and wall time; whether the full tier's
    --verify-head passed; and the PR, CI and merge outcome as read back from GitHub (started, green, merged), never
    assumed.
rollback: Revert the build PR; the full tier's validate_graduated_rerun is untouched throughout.
