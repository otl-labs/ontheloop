schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: graduated-rerun-plan-readers
intent: >-
  Keep every graduated record that reads plan content checked when a plan changes, so that a plans-only merge, which
  will run the fast tier on main (Decision 205 clause 5, PLAN-plans-only-main-fast-tier), is never left to Main
  Canary alone. A new fast-tier check reruns the live graduated records whose command reads docs/plans/ on any
  diff under docs/plans/, which also gates plan PRs before merge. First of two atomic plans for rec-4114.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-graduated-rerun-plan-readers.yaml
phase: >-
  T4.9a (c10's prerequisite; closes no criterion itself -- PLAN-plans-only-main-fast-tier closes T4.9a:c10). Itinerary
  item D4 (verdict-ci ITINERARY.md, Actions-capacity lever CMTS-06).
scope:
  - file: scripts/checks/verification/validate_graduated_rerun.py
    action: Modify
    purpose: >-
      evaluate(root, select=None) gains a keyword-only `select: Callable[[dict], bool] | None`; when given, only rows
      for which select(row) is true are evaluated (static verdicts and child runs alike), in the same check_id order.
      select=None is byte-for-byte today's behaviour; unselected rows are never statically checked or run (filter
      before the pool, never after). The new check imports _load_known_red as is (a deliberate same-package import
      of a private helper; never copy it). No other behaviour changes.
  - file: scripts/checks/verification/validate_graduated_rerun_plan_readers.py
    action: Create
    purpose: >-
      PLAN_READ_RE = re.compile(r"(?<!:!)docs/plans") and reads_plans(row) -> bool: true when the record's
      check_spec command (a list joined with spaces, or a string) matches PLAN_READ_RE, so a `:!docs/plans/`
      pathspec exclusion never selects a record. Registered check validate_graduated_rerun_plan_readers(failed,
      root=None): prints "=== Graduated plan-reader re-run ===", runs validate_graduated_rerun.evaluate(tree,
      select=reads_plans), loads known_red.yaml through the existing loader (a load problem fails, as in the full
      check), and appends one failure per red selected record NOT on known_red.yaml, worded like the full check's
      ("graduated record <id> (guard_target <t>) is red: <detail>"). A listed record that passes, a listed id that is
      not live and duplicates are NOT checked here (validate_graduated_rerun and validate_known_red_shrinks own those),
      so this check never reports a known_red.yaml bookkeeping fault the full check also reports. Prints
      "<n> plan-reading graduated_records examined, <r> red (<l> listed)" and calls registry.examined(n,
      unit="graduated_records"); n == 0 calls registry.skipped("no graduated record reads docs/plans/") rather than
      passing silently (Decision 170). Module docstring states the selection rule and names rec-5040 as the
      indirection residual.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      New Entry after validate_graduated_rerun: name/attr validate_graduated_rerun_plan_readers, module
      scripts.checks.verification.validate_graduated_rerun_plan_readers, pre=True, full_segment=None (pre-only: the
      full tier already reruns every record through validate_graduated_rerun). pre_globs: validate_verification_registry's
      pre_globs tuple as it stands on main at build time (it already covers validate_graduated_rerun's import closure:
      0 of 80 closure paths uncovered at e6eda786) plus "docs/plans/**"; then validate_pre_glob_closure must report 0
      uncovered paths for the new Entry. The check therefore also runs on code PRs touching that closure (cost below).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Exactly one line: function_to_category gains `validate_graduated_rerun_plan_readers: code_regression` beside
      validate_graduated_rerun's row (validate_ci_rca_taxonomy needs every registered check mapped). NEAR_CAP (500 of
      500 effective lines at e6eda786; other unbuilt plans append too): measure on main at build time; if the line
      would pass 500, apply the config class relief valve in this file only (compact one resolved row, never a
      raise) as its own commit.
  - file: tests/checks/verification/test_validate_graduated_rerun_plan_readers.py
    action: Create
    purpose: >-
      Reuse test_validate_graduated_rerun.py's tmp_path fixture shape (copy its small _record/_listed helpers; do not
      import from another test module). Tests: test_selects_commands_that_read_plans (a command naming
      docs/plans/PLAN-x.yaml is selected; one naming only `':!docs/plans/'` is not; one naming no plans path is not);
      test_unlisted_red_plan_reader_fails; test_listed_red_plan_reader_passes; test_red_non_plan_record_is_ignored
      (a red record whose command does not read docs/plans adds no failure); test_listed_green_record_is_not_reported
      (bookkeeping stays the full check's); test_select_never_runs_unselected_records (an unselected record whose
      command would write a sentinel file under tmp_path leaves no sentinel after evaluate(tmp_path,
      select=reads_plans), while a selected record's sentinel is written); test_no_plan_readers_is_a_skip (registry.skipped, not a pass);
      test_manifest_entry_is_pre_only_on_plan_diffs (the manifest Entry has pre=True, full_segment None, and
      scripts.validate._should_run_in_pre(entry.pre_globs, ["docs/plans/PLAN-x.yaml"], True) is True while
      ["src/x.py"] is False); test_evaluate_without_select_is_unchanged (evaluate(tmp_path) and
      evaluate(tmp_path, select=None) return the same outcomes over a mixed fixture).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the sidecar block decision-244-update (docs/plans/approved/graduated-rerun-plan-readers.yaml): a dated
      Update under Decision 244's Coverage line, with {{DATE}} filled with the build date (UTC). Nothing else.
bundled_recommendations: []
followon_recs: [rec-5040]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    validate_graduated_rerun_plan_readers runs in --pre whenever a diff touches docs/plans/** or its import closure,
    reruns exactly the live records whose command names docs/plans/ outside a `:!` exclusion (16 at e6eda786), and
    fails on an unlisted red one; the nine new tests pass and fail before the change.
  - Every existing test in tests/checks/verification/test_validate_graduated_rerun.py and test__manifest.py passes unchanged.
  - >-
    On the real repository the check passes (the one selected red record, roadmap-projection-delta-bounded-to-t15,
    is on known_red.yaml) and takes under 90 s of wall clock locally.
  - docs/DECISIONS.md equals the approved sidecar with {{DATE}} filled (scripts.roadmap.approved_text verify exits 0).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the new check's selection, failure, skip and manifest behaviour.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_graduated_rerun_plan_readers.py -q
    expected: Exit 0, all passed. Red before (the module and the select parameter do not exist).
    fix_if: A test fails -- fix the check or evaluate() at root; never loosen a test.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Unit tests of one check module; the --pre pytest_diff runs them whenever the module or its test changes.
  - step: 2
    phase: pre-deploy
    action: Prove the full rerun check and the manifest are unchanged in behaviour.
    command: >-
      bin/venv-python -m pytest tests/checks/verification/test_validate_graduated_rerun.py
      tests/checks/verification/test__manifest.py tests/checks/verification/test__graduated_rerun_nodes.py -q
    expected: Exit 0, all passed.
    fix_if: An existing test fails -- the select parameter changed default behaviour; restore it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Suite-covered: these existing test files run in the full tier's unit suite and in --pre whenever the modules
      change; a graduated record would repeat them, and the step is green before the change.
  - step: 3
    phase: pre-deploy
    action: Run the new check against the real repository and time it.
    command: >-
      /usr/bin/time -f "wall=%e" bin/venv-python -c "from scripts.checks.verification.validate_graduated_rerun_plan_readers
      import validate_graduated_rerun_plan_readers as v; f=[]; v(f); assert not f, f; print('PLAN_READERS_OK')"
    expected: >-
      Prints a count line naming 16 or more plan-reading records, then PLAN_READERS_OK; wall under 90 s. A count far
      from 16 means the selector drifted.
    fix_if: >-
      A red record that is not on known_red.yaml is a real red on main: stop and report it to the coordinator (it is
      not this build's to fix or list); a wall time over 90 s goes to the plan owner before merge.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Live-repo run of the check itself; the --pre tier runs it on every plan diff after merge.
  - step: 4
    phase: pre-deploy
    action: Prove the committed Decision text is the approved text.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug graduated-rerun-plan-readers --expect
      7ac38d464616233859ba5d605407351f2b13618788d6457352ff8abcbccfc75f  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier (git-ops.yaml
      merge_step_coverage).
  - step: 5
    phase: pre-deploy
    action: Fast tier on the branch (advisory outside CI; PR CI is authoritative), including validate_ci_rca_taxonomy.
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0; the output includes the "=== Graduated plan-reader re-run ===" section (the check's own modules are in
      the build diff).
    fix_if: A failure in this plan's files -- fix at root; never loosen a test.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Lint the changed Python files and run the full tier, as the handoff policy requires before commit; start
      scripts.validate as its own backgrounded run (2 h limit) and read its verdict with --verify-head.
    command: >-
      bin/venv-python -m ruff check scripts/checks/verification/validate_graduated_rerun.py
      scripts/checks/verification/validate_graduated_rerun_plan_readers.py scripts/checks/verification/_manifest.py
      tests/checks/verification/test_validate_graduated_rerun_plan_readers.py
      && bin/venv-python -m ruff format --check scripts/checks/verification/validate_graduated_rerun.py
      scripts/checks/verification/validate_graduated_rerun_plan_readers.py scripts/checks/verification/_manifest.py
      tests/checks/verification/test_validate_graduated_rerun_plan_readers.py
      && bin/venv-python -m scripts.validate;
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      ruff exit 0, and validation_result --verify-head exit 0 for HEAD; the verdict is --verify-head, never the
      backgrounded run's own exit status.
    fix_if: >-
      A failure in this plan's files: fix at root and rerun the full tier from the start (handoff_policy). A failure
      only in another open red's tests is not this build's to fix: wait for that repair per the implement skill.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/verification/validate_graduated_rerun_plan_readers.py
    behavior: Records whose command names docs/plans/ outside a `:!` exclusion are selected, and only those.
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_graduated_rerun_plan_readers.py::test_selects_commands_that_read_plans
    red_green_expectation: red before (the module does not exist), green after
  - source: scripts/checks/verification/validate_graduated_rerun_plan_readers.py
    behavior: An unlisted red plan-reading record fails the fast tier; a listed one does not.
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_graduated_rerun_plan_readers.py::test_unlisted_red_plan_reader_fails
    red_green_expectation: red before (the module does not exist), green after
  - source: scripts/checks/verification/validate_graduated_rerun_plan_readers.py
    behavior: No selected record is a declared skip, never a silent pass (Decision 170).
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_graduated_rerun_plan_readers.py::test_no_plan_readers_is_a_skip
    red_green_expectation: red before (the module does not exist), green after
  - source: scripts/checks/verification/validate_graduated_rerun.py
    behavior: evaluate(select=...) never runs an unselected record, so the fast tier pays only for the subset.
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_graduated_rerun_plan_readers.py::test_select_never_runs_unselected_records
    red_green_expectation: red before (evaluate takes no select keyword), green after
  - source: scripts/checks/verification/validate_graduated_rerun.py
    behavior: evaluate() without select is unchanged.
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_graduated_rerun_plan_readers.py::test_evaluate_without_select_is_unchanged
    red_green_expectation: red before (evaluate takes no select keyword), green after
  - source: scripts/checks/verification/_manifest.py
    behavior: The new check is pre-only and selected exactly on diffs under docs/plans/ or its modules.
    verification_step: 1
    test_selector: tests/checks/verification/test_validate_graduated_rerun_plan_readers.py::test_manifest_entry_is_pre_only_on_plan_diffs
    red_green_expectation: red before (no such Entry), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: ci-rca classifies a failure of the new check as code_regression.
    verification_step: 5
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: Registry data checked by validate_ci_rca_taxonomy in the fast tier; no behavior of its own.
constraints:
  - >-
    The sidecar block decision-244-update is operator-approved Decision text (Decision 246): the build places it
    exactly, fills only {{DATE}}, and never edits it; a needed change is an approved_text plan defect
    (implement-scope-boundary.yaml deviation_trigger.escalation). The sidecar is not grandfathered: the planning
    worker dispatches its approval run at the plan PR's final head and the operator approves it on GitHub before the
    plan PR merges.
  - >-
    This build merges under the approve-once standing_authorisation item: its only always_ask content is the
    sidecar-bound Decision text, so it merges on code review PROCEED + green CI once validate_merge_step is green.
  - >-
    Select by the record's command text, never by guard_target (Decision 244's options rejected guard_target-keyed
    re-runs because guard_target misses inputs). One selector (reads_plans) and one evaluator (evaluate); never a
    second list of record ids (Decision 104).
  - No change to which records the full tier reruns, to known_red.yaml, or to validate_known_red_shrinks; no test is loosened or skipped.
  - No rescue agents or workaround loops (Decision 55).
context:
