schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: graduation-rows-on-main
intent: >-
  Let the graduation completeness check's implement-PR leg accept a graduated registry row that an earlier PR of the
  same plan already put on main, so a plan built over several PRs, or closed late in a closure-only PR, can be declared
  implemented without flipping honest graduate steps to waive.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-graduation-rows-on-main.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category: rec-2837, with its duplicates rec-3600 and rec-5135; no tier_item claimed,
  so the Tier Item Freshness Gate is skipped). rec-5382 (late closure of eight built plans) depends on this rec,
  rec-5057 and rec-5441. No Lambda-packaged file changes, so V2.
cites: [dec:132, dec:177, dec:235, dec:244, dec:246]
scope:
  - file: scripts/checks/verification/validate_graduation_completeness.py
    action: Modify
    purpose: >-
      _implement_pr_leg matches each graduate step against every row in the CURRENT registry
      (_current_registry_entries: rows new in the diff plus rows already on the base) on the unchanged (check_id,
      plan_slug) pair, instead of new-in-diff rows only. The baseline reader stays and labels a match: the PASS line says
      "new in this diff" or "already on main". A base row whose check_id is listed in
      config/agent/verification_registry/known_red.yaml (read at HEAD with validate_known_red_shrinks.ids_from_text;
      a missing file is an empty list, as validate_known_red_shrinks.py does) does not satisfy the step and fails with "row is on known_red.yaml; repair it before declaring". A step with no row
      for the exact pair fails as today, with the message "step {n} declared graduate (check_id={cid!r}) but no matching
      new-in-diff registry row found, and none already on main (plan_slug={slug!r})", followed, when the check_id exists
      under another plan_slug, by " -- a row with this check_id belongs to plan_slug={other!r}", then the existing
      remedy text and obligations note. Residual: a row retired to entries/deprecated/ gets the generic message,
      because load_entries excludes deprecated rows. Residual: a reused plan slug would let an old on-main row with the
      same (check_id, plan_slug) satisfy the new plan (check_ids are plan-scoped by convention).
      _new_registry_rows is removed (no other caller). Module and function docstrings follow.
    new_imports: [scripts.checks.verification.validate_known_red_shrinks]
  - file: tests/checks/verification/validate_graduation_completeness/test_implement_leg_rows_on_main.py
    action: Create
    purpose: >-
      New concern module in the existing test package (test_implement_leg.py has 103 SLOC headroom, too little for
      four git-fixture tests; it is not edited). Helpers come from the package conftest.py only (no cross-test imports).
      Module-level tests, all red before the change: test_baseline_registry_row_satisfies_graduate_step (rec-2837;
      base holds the undeclared plan and its row on origin/main, and the flip is made on a non-main branch, as
      _ImplementFixture does; asserts _common.push_context_base(root=repo) is None (the de-vacuum check the post-merge
      test uses), failed == [] and the PASS line says "already on main"). test_implement_leg_accepts_row_graduated_by_earlier_pr_of_same_plan (rec-3600 and
      rec-5135; real git history: plan merged, a PR-1 commit adds the row and moves origin/main, then the declaring diff
      flips the flag and touches another file; no injected reader). test_baseline_row_for_another_plan_slug_still_fails
      (right check_id, other plan_slug: fails, and the message names the other slug). test_known_red_base_row_does_not_satisfy_graduate_step
      (a matching base row listed in known_red.yaml fails with the known_red.yaml message). A fifth test,
      test_new_in_diff_row_is_labelled_under_push_context, keeps the push-aware registry base honest now that the base
      only labels a match: under GITHUB_EVENT_NAME=push with GITHUB_EVENT_BEFORE at the pre-merge commit and origin/main
      == HEAD, a row the merge added passes with the label "new in this diff" (red before: the label is absent).
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      Approved wording (sidecar): check_id semantics' last sentence (+2 lines), one flow-style row in
      fields.check_id.amendment_log (validate_contract_drift category 6), one flow-style row at the top of the
      top-level amendment_log, contract_version 9 -> 10. NEAR_CAP: 482 -> 486 of 500 effective lines (measured by
      applying the sidecar). The sidecar blocks quote words with flattened indentation; the builder keeps the file's
      own YAML indentation (the binding ignores whitespace).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Approved wording (sidecar): one dated trailing-bracket annotation on Decision 132, appended after its existing
      [Amendment 2026-08-17: ...] line (decision-entry.yaml amendment_forms; Decision 177 forbids splicing clause 2).
      docs/decisions-index.json is regenerated by the generator if its check asks.
bundled_recommendations: [rec-2837, rec-3600, rec-5135]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - A declaring PR whose graduate step's (check_id, plan_slug) row is already on main passes the implement-PR leg.
  - A graduate step with no row for that pair in the registry at HEAD still fails, including a row whose check_id matches but whose plan_slug names another plan.
  - A matching row already on main that known_red.yaml lists does not satisfy the step.
  - Replaying PR #2270 (late closure of PLAN-actions-sha-pin-non-codeowners) on pinned main f2b02160 no longer fails graduation completeness.
  - rec-2837, rec-3600 and rec-5135 acceptance commands pass and the three recs close at the build merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The five new tests.
    command: >-
      bin/venv-python -m pytest
      tests/checks/verification/validate_graduation_completeness/test_implement_leg_rows_on_main.py::test_baseline_registry_row_satisfies_graduate_step
      tests/checks/verification/validate_graduation_completeness/test_implement_leg_rows_on_main.py::test_implement_leg_accepts_row_graduated_by_earlier_pr_of_same_plan
      tests/checks/verification/validate_graduation_completeness/test_implement_leg_rows_on_main.py::test_baseline_row_for_another_plan_slug_still_fails
      tests/checks/verification/validate_graduation_completeness/test_implement_leg_rows_on_main.py::test_known_red_base_row_does_not_satisfy_graduate_step
      tests/checks/verification/validate_graduation_completeness/test_implement_leg_rows_on_main.py::test_new_in_diff_row_is_labelled_under_push_context
      -q
    expected: exit 0, five passed
    fix_if: >-
      the first two fail with "no matching new-in-diff registry row" (the leg still reads new rows only); the third
      does not name the other slug; the fourth passes (a known-red base row was accepted); the fifth lacks the "new in this diff" label
    hermetic: true
    expected_literals: ["5 passed"]
    graduation: graduate
    graduation_check_id: graduation-rows-on-main
  - step: 2
    phase: pre-deploy
    action: Re-run the whole graduation completeness test package.
    command: bin/venv-python -m pytest tests/checks/verification/validate_graduation_completeness -q
    expected: exit 0, no failures
    fix_if: an existing node fails (fix the code, never loosen an assertion, Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-package re-run of standing tests that any --pre run touching this check already selects; it adds no new guard.
  - step: 3
    phase: pre-deploy
    action: >-
      Replay PR #2270 on pinned history: a detached worktree at f2b02160, PLAN-actions-sha-pin-non-codeowners.yaml
      gains "implementation_declared: true", and the check runs with the push-context base pinned to f2b02160.
    command: >-
      D=$(mktemp -d) && W="$D/wt" && git worktree add -q --detach "$W" f2b02160 &&
      echo "implementation_declared: true" >> "$W/docs/plans/PLAN-actions-sha-pin-non-codeowners.yaml" &&
      GITHUB_EVENT_NAME=push GITHUB_EVENT_BEFORE=f2b02160 bin/venv-python -c "from pathlib import Path; from
      scripts.checks.verification.validate_graduation_completeness import validate_graduation_completeness as v; f=[];
      v(f, changed_files=['docs/plans/PLAN-actions-sha-pin-non-codeowners.yaml'], root=Path('$W')); print('FAILED', f);
      assert f == []"; rc=$?; git worktree remove --force "$W"; rm -rf "$D"; exit $rc
    expected: exit 0; the output contains "already on main" and FAILED []
    fix_if: the failure list names actions-sha-pin-non-codeowners-drained (red before, measured 2026-11-20)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A live-history replay of one real PR; step 1's git-history test is the standing guard for the same property.
  - step: 4
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): bin/venv-python -m scripts.validate --pre in the
      foreground (exit 0), then this command as its own backgrounded run with a 2 h limit from the top-level session.
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: "--pre exits 0, then the full tier, then --verify-head exits 0 for HEAD"
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun; a failure only in another project's open
      red goes to the operator as the implement skill's go/no-go
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: Confirm rec-2837, rec-3600 and rec-5135 closed after the squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows, _ = fetch_recs_by_ids(make_reader(), ['rec-2837','rec-3600','rec-5135']); print([(r['id'], r['status']) for r in rows]);
      assert len(rows) == 3 and all(r['status'] == 'closed' for r in rows)"
    expected: all three closed
    fix_if: one is still open after ci.yml's closure job ran; close it with update_rec citing the merge SHA
    hermetic: false
test_obligations:
  - source: scripts/checks/verification/validate_graduation_completeness.py
    behavior: A graduate step is satisfied by a (check_id, plan_slug) row already on main, not only one new in the diff.
    verification_step: 1
    test_selector: tests/checks/verification/validate_graduation_completeness/test_implement_leg_rows_on_main.py::test_baseline_registry_row_satisfies_graduate_step
    red_green_expectation: red before (no matching new-in-diff registry row), green after.
  - source: scripts/checks/verification/validate_graduation_completeness.py
    behavior: A row whose check_id matches but whose plan_slug names another plan never satisfies the step, and the failure names that plan.
    verification_step: 1
    test_selector: tests/checks/verification/validate_graduation_completeness/test_implement_leg_rows_on_main.py::test_baseline_row_for_another_plan_slug_still_fails
    red_green_expectation: red before (the message does not name the other slug), green after.
  - source: scripts/checks/verification/validate_graduation_completeness.py
    behavior: A matching row already on main that known_red.yaml lists does not satisfy the step.
    verification_step: 1
    test_selector: tests/checks/verification/validate_graduation_completeness/test_implement_leg_rows_on_main.py::test_known_red_base_row_does_not_satisfy_graduate_step
    red_green_expectation: red before (the known_red.yaml message is absent), green after.
  - source: scripts/checks/verification/validate_graduation_completeness.py
    behavior: In real git history, a row a PR-1 commit put on origin/main satisfies the later declaring PR's graduate step with no injected reader.
    verification_step: 1
    test_selector: tests/checks/verification/validate_graduation_completeness/test_implement_leg_rows_on_main.py::test_implement_leg_accepts_row_graduated_by_earlier_pr_of_same_plan
    red_green_expectation: red before (no matching new-in-diff registry row), green after.
  - source: scripts/checks/verification/validate_graduation_completeness.py
    behavior: Under a post-merge push context the registry base stays the pre-merge commit, so a row the merge added is labelled new in this diff.
    verification_step: 1
    test_selector: tests/checks/verification/validate_graduation_completeness/test_implement_leg_rows_on_main.py::test_new_in_diff_row_is_labelled_under_push_context
    red_green_expectation: red before (the label is absent), green after.
  - source: docs/contracts/verification-registry.yaml
    behavior: The check_id semantics sentence, a field and a top-level amendment_log row, and contract_version 10.
    verification_step: 4
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: Contract prose no code reads; the approved-text binding (validate_merge_step) and validate_contract_drift check the words and the amendment rows in the fast tier.
constraints:
