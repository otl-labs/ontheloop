schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: graduation-rows-on-main
intent: >-
  Let the graduation completeness check's implement-PR leg accept a graduated registry row that an earlier PR of the
  same plan already put on main, so a plan built over several PRs, or closed late in a closure-only PR, can be declared
  implemented without flipping honest graduate steps to waive.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-graduation-rows-on-main.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category: rec-2837, with its duplicates rec-3600 and rec-5135; no tier_item claimed,
  so the Tier Item Freshness Gate is skipped). rec-5382 (late closure of eight built plans) depends on this rec,
  rec-5057 and rec-5441. No Lambda-packaged file changes, so V2.
cites: [dec:132, dec:177, dec:235, dec:244]
scope:
  - file: scripts/checks/verification/validate_graduation_completeness.py
    action: Modify
    purpose: >-
      _implement_pr_leg matches each graduate step against every row in the CURRENT registry
      (_current_registry_entries: rows new in the diff plus rows already on the base) on the unchanged (check_id,
      plan_slug) pair, instead of new-in-diff rows only. The baseline reader stays and labels a match: the PASS line says
      "new in this diff" or "already on main". A base row whose check_id is listed in
      config/agent/verification_registry/known_red.yaml (read at HEAD with validate_known_red_shrinks.ids_from_text)
      does not satisfy the step and fails with "row is on known_red.yaml; repair it before declaring". A step with no row
      for the exact pair fails as today; the failure message keeps the substring "no matching new-in-diff registry row",
      adds ", and none already on main", and, when the check_id exists under another plan_slug, names that slug.
      _new_registry_rows is removed (no other caller). Module and function docstrings follow.
    new_imports: [scripts.checks.verification.validate_known_red_shrinks]
  - file: tests/checks/verification/validate_graduation_completeness/test_implement_leg.py
    action: Modify
    purpose: >-
      Four new module-level tests; no existing test changes. test_baseline_registry_row_satisfies_graduate_step
      (rec-2837's acceptance; base holds the undeclared plan and its row, the working tree only flips the flag; red
      before). test_implement_leg_accepts_row_graduated_by_earlier_pr_of_same_plan (rec-3600 and rec-5135; real git
      history: plan merged, a PR-1 commit adds the row and moves origin/main, then the declaring diff flips the flag and
      touches another file; no injected reader; red before). test_baseline_row_for_another_plan_slug_still_fails (right
      check_id, other plan_slug: fails and names the other slug; the PR #586 orphan guard). test_known_red_base_row_does_not_satisfy_graduate_step
      (a matching base row listed in known_red.yaml fails).
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      Approved wording (sidecar): check_id semantics' last sentence, one amendment_log row at the top, contract_version
      9 -> 10. NEAR_CAP (482 of 500 effective lines): the row is one flow-style line, so +1 line.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Approved wording (sidecar): one dated trailing-bracket annotation on Decision 132, appended after its existing
      [Amendment 2026-08-17: ...] line (decision-entry.yaml amendment_forms; Decision 177 forbids splicing clause 2).
      docs/decisions-index.json is regenerated by the generator if its check asks.
bundled_recommendations: [rec-2837, rec-3600, rec-5135]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - A declaring PR whose graduate step's (check_id, plan_slug) row is already on main passes the implement-PR leg.
  - A graduate step with no row for that pair in the registry at HEAD still fails, including a row whose check_id matches but whose plan_slug names another plan.
  - A matching row already on main that known_red.yaml lists does not satisfy the step.
  - Replaying PR #2270 (late closure of PLAN-actions-sha-pin-non-codeowners) on pinned main f2b02160 no longer fails graduation completeness.
  - rec-2837, rec-3600 and rec-5135 acceptance commands pass and the three recs close at the build merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The four new tests.
    command: >-
      bin/venv-python -m pytest
      tests/checks/verification/validate_graduation_completeness/test_implement_leg.py::test_baseline_registry_row_satisfies_graduate_step
      tests/checks/verification/validate_graduation_completeness/test_implement_leg.py::test_implement_leg_accepts_row_graduated_by_earlier_pr_of_same_plan
      tests/checks/verification/validate_graduation_completeness/test_implement_leg.py::test_baseline_row_for_another_plan_slug_still_fails
      tests/checks/verification/validate_graduation_completeness/test_implement_leg.py::test_known_red_base_row_does_not_satisfy_graduate_step
      -q
    expected: exit 0, four passed
    fix_if: the first two fail with "no matching new-in-diff registry row" (the leg still reads new rows only); the third or fourth passes when it should fail
    hermetic: true
    expected_literals: ["4 passed"]
    graduation: graduate
    graduation_check_id: graduation-rows-on-main
  - step: 2
    phase: pre-deploy
    action: Re-run the whole graduation completeness test package.
    command: bin/venv-python -m pytest tests/checks/verification/validate_graduation_completeness -q
    expected: exit 0, no failures
    fix_if: an existing node fails (fix the code, never loosen an assertion, Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-package re-run of standing tests that any --pre run touching this check already selects; it adds no new guard.
  - step: 3
    phase: pre-deploy
    action: >-
      Replay PR #2270 on pinned history: a detached worktree at f2b02160, PLAN-actions-sha-pin-non-codeowners.yaml
      gains "implementation_declared: true", and the check runs with the push-context base pinned to f2b02160.
    command: >-
      W=$(mktemp -d)/wt && git worktree add -q --detach "$W" f2b02160 &&
      echo "implementation_declared: true" >> "$W/docs/plans/PLAN-actions-sha-pin-non-codeowners.yaml" &&
      GITHUB_EVENT_NAME=push GITHUB_EVENT_BEFORE=f2b02160 bin/venv-python -c "from pathlib import Path; from
      scripts.checks.verification.validate_graduation_completeness import validate_graduation_completeness as v; f=[];
      v(f, changed_files=['docs/plans/PLAN-actions-sha-pin-non-codeowners.yaml'], root=Path('$W')); print('FAILED', f);
      assert f == []"; rc=$?; git worktree remove --force "$W"; exit $rc
    expected: exit 0; the output says registry row actions-sha-pin-non-codeowners-drained is already on main and FAILED []
    fix_if: the failure list names actions-sha-pin-non-codeowners-drained (red before, measured 2026-11-20)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A live-history replay of one real PR; step 1's git-history test is the standing guard for the same property.
  - step: 4
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): bin/venv-python -m scripts.validate --pre in the
      foreground (exit 0), then this command as its own backgrounded run with a 2 h limit from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: "--pre exited 0 first; this command exits 0 for HEAD"
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun; a failure only in another project's open
      red goes to the operator as the implement skill's go/no-go
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: Confirm rec-2837, rec-3600 and rec-5135 closed after the squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows, _ = fetch_recs_by_ids(make_reader(), ['rec-2837','rec-3600','rec-5135']); print([(r['id'], r['status']) for r in rows]);
      assert len(rows) == 3 and all(r['status'] == 'closed' for r in rows)"
    expected: all three closed
    fix_if: one is still open after ci.yml's closure job ran; close it with update_rec citing the merge SHA
    hermetic: false
test_obligations:
  - source: scripts/checks/verification/validate_graduation_completeness.py
    behavior: A graduate step is satisfied by a (check_id, plan_slug) row in the registry at HEAD, new or already on main and not known-red; a row for another plan never satisfies it.
    verification_step: 1
    test_selector: tests/checks/verification/validate_graduation_completeness/test_implement_leg.py::test_baseline_registry_row_satisfies_graduate_step
    red_green_expectation: red before (no matching new-in-diff registry row), green after.
constraints:
  - The (check_id, plan_slug) join is unchanged; only the row set it searches grows from new-in-diff to the whole registry at HEAD.
  - No existing assertion changes (Decision 235); the failure message keeps its old substring.
  - "Decision 235: this is a planned change, not a weakening. The widened set (rows already on main for the same plan, not known-red) is named in acceptance criteria 1-3; the operator's plan approval is the human gate if a reviewer reads it as in class."
  - git-ops.yaml, validate_merge_step.py, _implementation_merge.py and validate_weakening_dispositions.py are not edited (rec-5057 and rec-5441 own them).
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout verdict NO_FLAGS (round 2; round 1 FLAGS_FOUND: WARN Decision 132 cl.2 new-in-diff, resolved by the dated annotation; NOTE Decision 235, resolved by the planned-change constraint). CITE: Decision 132, Decision 177, Decision 235, Decision 244. Decisions triaged: 227 of 227. Roadmap items intersected: 5; CONFLICT: 0; RELATED: 5. Serves: NS.8 3/5."
  - "Blind advisor consult (Fable, /mnt/project-files/graduation-rows-on-main/advisor-brief/ADVICE.md): rule (a) any matching row at HEAD, not (b) late-closure X^..X only (would pass 12 of 93 plans with graduate rows on main); adopted its known-red and other-slug additions."
  - "Declared breadth (selection_budget --plan on the draft, cost table ok): 207 selected, predicted test half 164.3-621.6s against a 622s allowance -> breadth_waived; kept as one unit."
  - "docs/DECISIONS.md is scoped by many unbuilt plans; this edit is one appended line inside Decision 132, so whichever builds second rebases."
  - "PLAN-retire-ci-only-red-records also scopes verification-registry.yaml; it built as #1855 but never declared; whichever edits second rebases."
  - "Red before (probe 2026-11-20, pinned main f2b02160): VP 3's replay fails with step 1 actions-sha-pin-non-codeowners-drained, the PR #2270 failure."
  - "Kept unchanged (no existing test in test_implement_leg.py is edited): graduated shards graduation-completeness-content-keyed-can-still-fail, graduation-completeness-implement-leg-import-error-distinct, graduation-completeness-implement-pr-leg, registry-baseline-reader-spans-layouts, test-obligation-graduation-linkage."
  - "red_overlap at plan write (2026-11-20, main 7f2915f3): clear, no reds. Operator said write the plan 2026-11-20 14:50 UTC."
  - "rec-3600 and rec-5135 acceptance repointed 2026-11-20 to test_implement_leg.py::test_implement_leg_accepts_row_graduated_by_earlier_pr_of_same_plan (read back: both open with the new command)."
  - "Approved wording: docs/plans/approved/graduation-rows-on-main.yaml (four blocks: contract sentence, contract_version, amendment_log row, Decision 132 note). None of the four files is in .github/CODEOWNERS (checked at plan write); the build merges on green once the wording run is approved."
  - "Owning planning thread: 'Fix graduation check for late closure rec-2837' (Agents in GitHub). Plan defects go to the coordinator, which forwards them here."
  - "Sibling late-closure recs: rec-5057 (merge-step approved text) and rec-5441 (weakening dispositions), planned in parallel; no shared file."
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:5b44d75817ba9fc82e3a96e231293524af1be8b3164c02187bbcd530307bae36"}
  - {gate: decision-scout, round: 2, verdict: NO_FLAGS, scout_input_fingerprint: "v1:f42e6822c8f257fa17531041e6d3d3b263301e204d67ea039af2ed011b038de3"}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Add the three tests; run step 1 red (the first two fail, the third passes)."
  - "Change _implement_pr_leg per its scope row. Post: steps 1 and 2 pass."
  - "Apply the approved wording (docs/plans/approved/graduation-rows-on-main.yaml) to verification-registry.yaml and DECISIONS.md, filling {{DATE}}."
  - Execute Verification Plan -- run each pre-deploy step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - "CLOSURE: implementation_declared: true; squash-merge on code review PROCEED and green CI with `Resolves: rec-2837, rec-3600, rec-5135`; VP 5."
  - "Report: what was implemented, verification results"
