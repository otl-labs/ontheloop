schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: growth-safe-snapshot-pins
intent: >-
  Unblock the build of slice 2a-2 plan 1 (PLAN-telemetry-table-registration). Three tests pin the current state exactly
  -- the set of tables the row-rule projection changes, ScdTableSpec's field-name set, and a contract's amendment_log[0]
  -- so every legitimate additive change fails them. Each is rewritten as the invariant it was written to guard (derived
  from its source where one exists, a reviewed baseline and roster for ScdTableSpec), with every relaxed property recorded,
  and new nodes proving it admits growth and still catches real drift.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-growth-safe-snapshot-pins.yaml
phase: >-
  Unblocker for PLAN-telemetry-table-registration (slice 2a-2 plan 1 of rec-4024, T2.36). Operator-directed (Benjamin,
  2026-10-05); claims, moves and closes no tier_item criterion.
scope:
- file: tests/test_field_semantics_rule_projection.py
  action: Modify
  purpose: >-
    Derive the rule tables from the contracts, never from a list and never from the generator's own dispatch (Decision
    191). A private oracle walks every key of generate()'s ops_tables. It classifies the key by its contract, read as raw
    YAML and compared case-insensitively with a missing value read as scd2 (the generator's own rule; ops_recommendations
    declares 'SCD2'): no contract file -> no rules (dormant, smoke); event -> excluded, because the event projection owns
    those keys; anything else -> expected keys from scripts.contract_rules.declared_rules. That covers SCD2 and control.
    The generator's control branch never calls project_row_rules, so the first projectable rule a control contract declares
    fails test_other_tables_project_no_rule_key, as does a control contract's exempted rule and a contract authored for
    a still-dormant sidecar table. That is intended teeth (Decision 210: a declared rule is enforced at write or it is a
    gap). The module docstring names the remedy - wire the projection or register the table, never exclude it. A rule key is any column
    key outside the base column shape the SCD2 projection emits (role, sql_type, nullable, description, semantics); this
    replaces the literal _RULE_KEYS set, so an unknown key also fails the per-table comparison.
    The oracle's logic uses only DeclaredRule attributes and nullable read from the identity-projected 'plain' doc, never
    the projection module - an exempt leg -> write_time_exemptions; a non-exempt not_null on a nullable:false column ->
    nothing; any other leg -> its kind, plus exclude_before when dated. The oracle's expected set and every comparison built
    on it are sets of (column, key) pairs per table, never a per-table set of key names, so an undeclared key of a kind
    declared on another column still fails. The rule reader is an oracle parameter, defaulting
    to declared_rules. Rule tables are the non-event tables with a non-empty expected set. ops_decisions declares six not_null
    rules on nullable:false columns and projects none, so 'declares any rule' is the wrong test. Every derived set is computed
    inside a test function, never at module scope or collection. The existing node names stay, because live registry rows
    call them. test_rule_projection_touches_only_rule_keys keeps its strip-equality assertion and asserts, as sets, that
    the changed tables equal the rule tables, with ops_recommendations as a non-vacuity floor. test_projects_every_declared_rule_once
    runs its existing per-rule value body over every rule table and keeps the ops_recommendations floor and the title min_length
    10 anchor. test_other_tables_project_no_rule_key asserts each non-event table's projected rule keys equal its expected
    set, so the tables outside the rule set carry none. ops_decisions and ops_entity_counters stay as a floor, and the dormant
    and smoke entries join. test_exemptions_and_unknown_kinds is unchanged. Two new nodes. test_rule_invariants_follow_a_new_rule_table
    patches projection.declared_rules and passes the same patched reader to the oracle, appending DeclaredRule('ops_decisions',
    'title', 'min_length', {'value': 3}). The invariants pass, and ops_decisions joins the rule tables. test_rule_invariants_catch_undeclared_and_dropped_rules
    covers three wrappers around project_row_rules. One adds an undeclared pattern key to an ops_decisions column. One adds
    pattern to ops_recommendations.title, a kind that table declares on another column. The third returns ops_recommendations'
    columns unprojected, simulating a dropped dispatch. Each makes the invariants raise AssertionError.
    The module docstring names every SCD2 contract, not only ops_recommendations. About 190 SLOC after.
- file: tests/test_ducklake_control_tables.py
  action: Modify
  purpose: >-
    test_scd2_schema_delegates_without_widening keeps its directed-raise and history_table == 'str' assertions. Its exact
    field-name set becomes a guard over an ordered baseline of the eleven current fields as (name, annotation, has_default)
    - table 'str | None'; history_table 'str'; current_table 'str | None'; merge_key 'str'; fields 'dict[str, Any]'; ordered_columns
    'tuple[tuple[str, str], ...]'; partition_history 'str'; partition_current 'str | None'; each of those without a default;
    then entity_id_prefix 'str | None', id_keyspace 'str' and write_mode 'str', each with a default. It also uses a roster
    of approved additions, each naming its admitting plan, seeded with id_scheme (PLAN-telemetry-table-registration). A
    private guard takes the dataclass. It requires frozen; the leading fields to equal the baseline in order, with annotations
    normalised (a string as is, else inspect.formatannotation without the 'typing.' prefix); and every later field to be
    on the roster and carry a default or default_factory. The T2.26 'never widened' property is therefore held field by
    field, and the one sanctioned growth path is an explicit, reviewed roster line. New node test_spec_shape_guard_admits_only_approved_defaulted_growth
    builds standalone fixtures with dataclasses.make_dataclass from the baseline (no subclassing of the frozen class). The
    guard admits the baseline itself and the baseline plus a defaulted id_scheme. It rejects (AssertionError) each of these:
    a baseline field dropped; an unrostered defaulted field; history_table re-annotated 'str | None'; two baseline fields
    of the same default status swapped (history_table and current_table, so the fixture still builds); a non-frozen copy; and a rostered field added kw_only without a default. Pinning every annotation is a tightening:
    a non-widening refinement (for example dict[str, Any] to Mapping[str, Any]) edits the baseline in the same PR, a deliberate
    review point.
- file: tests/telemetry/test_contract_amendments.py
  action: Modify
  purpose: >-
    Three amendment_log[0] index pins become an exactly-one lookup of the entry they were written for. One private helper
    over a raw-YAML log returns the single entry dated 2026-10-04 whose summary contains the stable plan slug PLAN-telemetry-write-conformance,
    asserting there is exactly one. test_representation_only_columns_excluded_from_grain_compare looks the entry up in data-modeling-standard
    and asserts its semantic_break is true; version == 5 becomes version >= 5. Today [0] is PLAN-ops-rule-source's entry
    of the same date, so the pin does not check the entry it names. test_session_pin_is_earliest_timestamp looks up the
    envelope's entry, read through the module's _contract_text; its contract_version == 1 assertion stays. test_lexicon_names_tool_output_and_omission
    looks up the lexicon's entry. The helper and the new node sit next to _contract_text, never at the end of the file, so
    they stay out of #1416's appended hunk. New node test_write_conformance_lookup_survives_growth_only runs the helper over synthetic
    logs. A newer entry placed first is still found. A log with the entry removed, a log with it duplicated, and a log whose
    only same-date entry names another plan each raise AssertionError. #1416's lines (the transcripts and observations re-pins
    and the appended rec-4146 test) are not touched.
- file: config/agent/verification_registry/entries/growth-safe-snapshot-pins.yaml
  action: Create
  purpose: >-
    Verification-registry row for graduated VP step 1 - check_id growth-safe-snapshot-pins, primitive_slot command_exit_zero,
    check_spec.command the step's pytest node list, guard_target the comma-separated three test files (the telemetry-lifecycle-friction-amendment.yaml
    precedent), plan_slug growth-safe-snapshot-pins, graduated_by implement-agent.
bundled_recommendations: []
implementation_declared: true
followon_recs:
- rec-4180
- rec-4181
infrastructure_dependencies: []
acceptance_criteria:
- >-
  The rule-projection invariants derive their table set from the contracts and declared_rules, independent of the generator's
  dispatch, and compare sets. The literal changed == ["ops_recommendations"] is gone. The ops_recommendations, title,
  ops_decisions and ops_entity_counters anchors survive as floors.
- >-
  test_rule_invariants_follow_a_new_rule_table passes with ops_decisions given one extra declared rule. test_rule_invariants_catch_undeclared_and_dropped_rules
  shows that an undeclared key on a rule-less table, an undeclared key of an already-declared kind on another column of
  a rule table, and a dropped dispatch each fail the invariants.
- >-
  The ScdTableSpec guard pins all eleven baseline fields' order, annotation and default status, requires frozen, and admits
  only rostered, defaulted additions (id_scheme seeded). test_spec_shape_guard_admits_only_approved_defaulted_growth proves
  it admits that growth and rejects the six widening shapes, a dropped baseline field among them.
- >-
  No envelope, lexicon or data-modeling-standard amendment_log[0] pin remains. Each lookup asserts exactly one 2026-10-04
  PLAN-telemetry-write-conformance entry. data-modeling-standard's version is at least 5 and that entry's semantic_break
  is true, and the envelope contract_version == 1 pin is kept. test_write_conformance_lookup_survives_growth_only proves
  the lookup survives a newer entry and fails on loss, duplication and a same-date entry from another plan.
- >-
  Test-only and deploy-inert: no file under src/, scripts/, config/lambda/, docs/contracts/, terraform/ or docs/DECISIONS.md
  changes, and the generated field_semantics registry is unchanged.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Run the rewritten pin nodes and the four new growth and teeth nodes.
  command: >-
    bin/venv-python -m pytest tests/test_field_semantics_rule_projection.py::test_projects_every_declared_rule_once tests/test_field_semantics_rule_projection.py::test_other_tables_project_no_rule_key
    tests/test_field_semantics_rule_projection.py::test_rule_projection_touches_only_rule_keys tests/test_field_semantics_rule_projection.py::test_rule_invariants_follow_a_new_rule_table
    tests/test_field_semantics_rule_projection.py::test_rule_invariants_catch_undeclared_and_dropped_rules tests/test_ducklake_control_tables.py::test_scd2_schema_delegates_without_widening
    tests/test_ducklake_control_tables.py::test_spec_shape_guard_admits_only_approved_defaulted_growth tests/telemetry/test_contract_amendments.py::test_representation_only_columns_excluded_from_grain_compare
    tests/telemetry/test_contract_amendments.py::test_session_pin_is_earliest_timestamp tests/telemetry/test_contract_amendments.py::test_lexicon_names_tool_output_and_omission
    tests/telemetry/test_contract_amendments.py::test_write_conformance_lookup_survives_growth_only -q
  expected: >-
    Exit 0, 11 passed. Red before: the four new nodes are absent from the pre-change tree (pytest exit 4).
  fix_if: >-
    A growth node fails: an invariant still reads a literal table list, field list or [0] index; derive it per the scope
    row. A teeth node fails: the derivation became permissive or reads the generator's dispatch; it must compare each table's
    projected (column, key) pairs against the contract-derived pairs, never key names per table, the full baseline tuple, and exactly one lookup match. Never
    drop an assertion to get green.
  hermetic: true
  graduation: graduate
  graduation_check_id: growth-safe-snapshot-pins
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: >-
    Sweep: the literal pins are gone (the hardcoded changed list, the exact field-name set, and the three amendment_log[0]
    reads).
  command: >-
    ! grep -nF 'changed == ["ops_recommendations"]' tests/test_field_semantics_rule_projection.py && ! grep -nF 'assert field_names == {'
    tests/test_ducklake_control_tables.py && ! grep -nF 'standard["amendment_log"][0]' tests/telemetry/test_contract_amendments.py
    && ! grep -nF 'envelope.amendment_log[0]' tests/telemetry/test_contract_amendments.py && ! grep -nF 'lexicon["amendment_log"][0]'
    tests/telemetry/test_contract_amendments.py && echo PINS_GONE
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    A grep prints a line: that literal pin survived; replace it with its derived or lookup form per the scope row.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    A one-time removal sweep over three named files. Step 1's growth and teeth nodes guard the rewritten helpers; a new literal
    pin in some other test is the class-level gap rec-4181 carries (the count-coupling scanner extension).
  expected_literals:
  - PINS_GONE
- step: 3
  phase: pre-deploy
  action: >-
    Re-run the three modified test modules whole.
  command: >-
    bin/venv-python -m pytest tests/test_field_semantics_rule_projection.py tests/test_ducklake_control_tables.py tests/telemetry/test_contract_amendments.py
    -q
  expected: Exit 0; no failures.
  fix_if: >-
    A node outside the rewritten set fails: the rewrite leaked state (a patch left active, a mutated generate() result);
    scope each patch to its with-block and deep-copy before mutating.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A whole-file re-run of modules this plan modifies (vp-red-before hermetic_authoring carve-out (v)); the new nodes are
    graduated by step 1, and step 5's full tier runs the generator's own suite.
- step: 4
  phase: pre-deploy
  action: >-
    Deploy-inert proof: the generated registry is fresh and nothing under src/, scripts/, config/lambda/, docs/contracts/,
    docs/DECISIONS.md or terraform/ changed. The full location check is validate_scope_boundary, inside step 5.
  command: >-
    bin/venv-python -m scripts.schema_to_field_semantics --check && git diff --quiet "$(git merge-base origin/main HEAD)"
    -- src scripts config/lambda docs/contracts docs/DECISIONS.md terraform && echo INERT_OK
  expected: Exit 0 and the success marker printed.
  fix_if: >-
    A diff under src/, scripts/, config/lambda/, docs/contracts/, docs/DECISIONS.md or terraform/ is out of scope - revert
    it. A failing --check means main moved under the branch; rebase, never regenerate here.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Merge-base relative by construction. The standing equivalents are scripts.validate's field-semantics drift and scope-boundary
    checks.
- step: 5
  phase: pre-deploy
  action: Full validation tier before handoff (Decision 163).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; never raise a budget, skip a check or weaken an assertion.
  hermetic: false
  graduation: not-applicable
test_obligations:
- source: config/agent/verification_registry/entries/growth-safe-snapshot-pins.yaml
  behavior: Registry row for the graduated step-1 check.
  verification_step: 5
  command: bin/venv-python -m scripts.validate
  waiver_reason: >-
    Verification-registry metadata for step 1's graduation; validate_verification_registry's differential admission gate
    (the new nodes are absent on origin/main) and validate_graduation_completeness are its standing checks.
constraints:
- >-
  Test-only. Only the four scope files change. No contract, generator, src/, Lambda-packaged or terraform file, and no
  field_semantics.yaml regeneration, so the Decision 79/125 deploy gating is not triggered.
- >-
  Never weaken (Decision 181; implement-scope-boundary CONTENT clause). Every property each pin held keeps the disposition
  the context records. A failing invariant is fixed in the derivation, never by dropping an assertion.
- >-
  Derive, don't list (tests/CLAUDE.md growing-collection rule; Decision 210 cl.3). The oracle shares declared_rules' input
  with the projection, never its logic or its dispatch. The only literals in assertions are the named floors, the base
  column shape, the spec baseline and roster, and the 2026-10-04 date and plan slug.
- >-
  Keep node names (Decision 132): the ops-row-rules-projection, telemetry-contract-risk-amendments and control-class-spec-and-write-refusal
  registry rows call these modules or nodes. New nodes stay self-contained in their own modules (Decision 131).
- >-
  No module-scope generate() or contract read (AGENTS.md: no raise at import). Every patch is scoped to a with-block.
- >-
  Do not touch #1416's lines in test_contract_amendments.py (the transcripts and observations re-pins and the appended
  rec-4146 test).
- No rescue agents or workaround loops (Decision 55).
context:
- >-
  Decision-scout verdict FLAGS_FOUND (all resolved in this plan). CITE: 189, 132. CONTRADICT NOTE 181: per-pin dispositions
  and a teeth node for every pin. SPIRIT NOTE 191: the oracle derives from contracts, not dispatch, with a dropped-dispatch
  teeth case. SPIRIT NOTE 187: the roster keeps 'never widened', and dispositions are recorded below. RELATED: 148, 176,
  210, 200, 55, 59, 128/130, 131, 163, 48. Decisions triaged: 163 of 163. Roadmap items intersected: 1; CONFLICT: 0; RELATED: 1
- "gates: decision-scout=FLAGS_FOUND (resolved); plan-critique=PROCEED after 3 rounds (r1 REVISE 1 blocking + 8, r2 REVISE 1 + 6, all fixed; r2 F6 kept: guard_target names the test files, as 36 rows do; r3 optional F1/F3 applied); follow-on rec-4181"
- >-
  Pin dispositions (Decision 187). Projection: 'only rule tables change', 'ops_recommendations changes', 'ops_decisions/ops_entity_counters
  carry no rule key' and per-(column, kind) pair equality are retained, now contract-derived, with floors, and widened
  to every table. ScdTableSpec: history_table
  non-Optional and the eleven names are retained; 'no field added' is re-pointed to 'no unrostered or required addition';
  every annotation, the order, defaults and frozen are newly pinned. amendment_log: 'write-conformance recorded' is re-pointed
  to the right entry; version == 5 becomes a >= 5 ratchet. 'Newest first' was never stated and is unenforced; its carrier
  is rec-4180.
- >-
  Blocker (Slice 2 plan 1 build thread, 2026-10-05). The full tier fails test_rule_projection_touches_only_rule_keys (from
  #1413, ops plan B) once ops_tenants/ops_projects declare accepted_values. The build worked around two more pins code-side
  -- ScdTableSpec not widened with id_scheme (pin from PLAN-control-table-class-and-counter-conformance), and the
  data-modeling-standard entry appended last with version unbumped. Benjamin asked for a separate plan and implementation;
  plan 1 then rebases.
- >-
  Evidence. data-modeling-standard amendment_log[0] is PLAN-ops-rule-source's 2026-10-04 entry, not the write-conformance
  one; ops plan B placed its 2026-10-05 entry second to keep the pin green. Scratch prototypes (2026-10-05) pass on main
  and show each growth case admitted and each teeth case rejected.
- >-
  Approach: a best-practice consult (2026-10-05) and the scout agreed on derived oracles, roster, exactly-one lookups.
  Benjamin's approval line lets a consult settle mechanical forks; notice goes to him in the thread.
- >-
  Coordination. #1416 (C9-C13 implementation, open) also edits test_contract_amendments.py. Whichever lands second rebases;
  the lexicon hunk sits next to #1416's appended test. After this lands, plan 1's build may follow its own plan
  (ScdTableSpec.id_scheme; its amendment entry first, version per convention).
pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- Only the plan-cited decision sections read
- Whether #1416 has merged checked (rebase onto main first if so)
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  Red before, in substance. Write each growth node against the module's CURRENT assertions, factored into private helpers
  unchanged, and confirm it FAILS. The literal changed list rejects the extra ops_decisions rule; the exact name set rejects
  a defaulted id_scheme; the [0] read rejects a newer first entry. This shows the pins block growth. Then rewrite.
- >-
  tests/test_field_semantics_rule_projection.py - the contract-derived oracle and the three rewritten nodes, then the growth
  and teeth nodes.
- >-
  tests/test_ducklake_control_tables.py - the baseline tuple, roster and guard, then the fixture node.
- tests/telemetry/test_contract_amendments.py - the lookup helper, the three re-pins, then the synthetic-log node.
- Write the registry row for graduated step 1.
- >-
  Execute Verification Plan steps 1-4. Stage the new registry row first (git add --intent-to-add on the Create row) and
  loop until they pass. Never weaken an assertion; on an unrecoverable failure, stop and RCA (Decision 55).
- >-
  CLOSURE -- separate facts, in order (a)-(e) (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence),
  each reported on its own. (a) READINESS: bin/venv-python -m scripts.session.github_readiness (unknown is never PASS).
  (b) Set implementation_declared true, commit, git fetch origin main and git rebase origin/main (STOP on conflict, except
  the expected lexicon-hunk conflict with #1416: keep this branch's lookup line and #1416's appended rec-4146 test). (c) VP step 5 on the committed, rebased, clean tree,
  then bin/venv-python -m scripts.checks.validation_result --verify-head. (d) Write a scratchpad JSON holding exactly the
  scripts.session.postflight_evidence.CATEGORIES keys, then bin/venv-python -m scripts.session.postflight --evidence <that
  file>. (e) Push, open the PR, subscribe; on green CI on the head, squash-merge with the PR body as commit_message (standing
  authorization: code review PROCEED and CI green; nothing deploys).
- 'Report: what was implemented, verification results, merge outcome'
rollback: >-
  Revert the squash commit. Tests and one registry row only; nothing deploys.
