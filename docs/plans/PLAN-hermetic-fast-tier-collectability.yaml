schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: hermetic-fast-tier-collectability
intent: >-
  Catch, before a plan merges, a hermetic pre-deploy pytest step whose existing target test file is guarded at module
  level on a package PR CI's fast tier deliberately lacks (duckdb, psycopg2, pytz, radon). PR CI's venv-less fast tier
  collects 0 tests there (pytest exit 5) and VP replay reds the implementation PR; the planner had no signal. A new
  registered deps-domain check enforces vp-red-before.yaml hermetic_authoring carve-out (iii) at plan-PR time
  (rec-2809 option (a)). Split from PLAN-fast-tier-ci-parity at planning time (Benjamin 2026-10-30); that plan makes the
  agent container's --pre CI-shaped and is built first.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-hermetic-fast-tier-collectability.yaml
phase: >-
  ad_hoc_rec soft-warn category (rec-2809; joint review J-13 / TEL-F05); no tier_item criterion claimed, so the Tier
  Item Freshness Gate is skipped. Wave 1 plan F (second half) of the Project Review build.
scope:
  - file: scripts/checks/deps/validate_hermetic_fast_tier_collectability.py
    action: Create
    purpose: >-
      New registered fast-tier check (rec-2809 option (a), Decision 181 enforcer for vp-red-before.yaml
      hermetic_authoring carve-out (iii)). Population: vp-red-before.yaml's eligibility_predicate population --
      PLAN-*.yaml files ADDED in this diff (status A or ?? from _common.get_status_aware_diff matching
      _common.PLAN_PATH_RE; merely-modified plans are deliberately outside it, as for rg_portability_lint, because 387
      legacy plans read implementation_declared falsy and three merged ones would redden unrelated PRs) whose
      implementation_declared is falsy, read with yaml.safe_load only (a file that does not parse as YAML is a reported
      finding; a parsed plan whose shape is wrong -- non-mapping root, non-list verification_plan, non-mapping step --
      is skipped with a note, since schema validity is validate_plan_documents' concern; the check never imports
      scripts.roadmap.plan_document or calls _common.load_plan, so the declared pre_globs stay closure-complete without
      relying on a pruned edge). For each verification_plan step with phase pre-deploy, hermetic truthy as pydantic's lax bool reads it (true, "true",
      1 and the like, matching how validate_vp_replay sees the step; an uncoercible value is a reported finding) and a
      pytest invocation (shlex-split; `-m pytest`, or an argv token whose basename is `pytest`, such as
      `.venv/bin/pytest`), each positional selector argument under
      tests/ is examined by its file part (taken before any "::" node suffix): a Path.is_file() target is examined
      itself; a Path.is_dir() target has every test_*.py beneath it examined, each with its own conftest chain, so a
      guarded member that would make the directory's replay a hollow green is flagged naming that member (critique
      series 2 round 3 F1; measured 2026-10-30: 34 directory selectors in hermetic steps, one with guarded members, in
      an already-built plan, so no unrelated PR reddens); a missing path is skipped and counted in the skipped note,
      never reported as an unreadable finding (round 1 F1); the value of a
      two-token option such as `--deselect X`, `--ignore X`, `-k X` or `-m X` is not a selector. The command is first
      split on shell control operators with a local regex equivalent to
      scripts/checks/verification/_vp_replay_classify._SHELL_SEGMENT_SPLIT_RE (copied, not imported, so the declared
      pre_globs stay closure-complete and no cross-domain import is added), so tokens of a chained non-pytest segment
      are never attributed to the pytest step: the test file and every conftest.py from its directory up to and
      including tests/conftest.py are AST-parsed for a
      module-level `pytest.importorskip("<name>")` (assigned or bare) or a module-level `import <name>` / `from <name>
      import` outside try, each name matched on its top-level dotted segment (importorskip("botocore.exceptions") is
      botocore). A hit on a name in the CI-absent set fails with: plan path, step id, selector, the guarding
      file and name, and the fix ("set hermetic: false, or move the guarded selector into its own hermetic: false step
      (for a directory selector, list its unguarded member files instead of the directory) -- vp-red-before.yaml
      hermetic_authoring carve-out (iii)"); no `--ignore` advice, since `--ignore` values are never subtracted from a
      directory walk (critique series 2 round 4 F1). A guarded whole-file selector mixed with unguarded ones is
      flagged too: replay then passes with the guarded file skipped, a hollow green (critique series 2 round 2 F2). The
      CI-absent set is derived, never hard-coded (Decision 99): import names of requirements.in dists minus
      requirements-fast.txt dists minus requirements-dev.txt dists, reusing _parse_requirement_dist_names and
      _dist_to_import_name from scripts/checks/_pytest_diff.py (today: duckdb, psycopg2, pytz, radon). Declares
      registry.examined(<steps examined>, unit="hermetic_pytest_steps") or registry.skipped(<reason>) once per dispatch
      (Decision 170). Exception-contained: an unreadable plan or test file is a reported finding, never a raise. 100%
      line coverage (Decision 159 new-file floor).
  - file: tests/checks/deps/test_validate_hermetic_fast_tier_collectability.py
    action: Create
    purpose: >-
      Mirror test (Decision 131 name). Fixture repos under tmp_path: TestFlagsGuardedTarget (module-level importorskip,
      bare importorskip, module-level import, conftest-level guard, a file::Class::test node selector on a guarded
      file, a guarded whole file mixed with an unguarded file in one step, and a directory selector holding a guarded
      member -- each flagged with the message fields, the directory case's message advising the member-file list and
      never `--ignore`; and a quoted hermetic "true" step on a guarded file), TestPassesUnguardedTarget (function-scope importorskip, guard on a
      name present in CI such as boto3, hermetic false step, post-deploy step, non-pytest command, selector file absent,
      implementation_declared true plan, a MODIFIED (not added) legacy plan whose step targets a guarded file, a chained
      command whose non-pytest segment names a guarded file, a directory selector whose members are all unguarded, a
      `--deselect tests/<guarded>.py::t` option value, a missing selector path -- none flagged, the missing path counted
      as skipped). Cases are table-driven through one shared fixture-plan builder and pytest.mark.parametrize, so the
      file stays well under 500 SLOC: two warehouse acceptances (rec-2809 after step 5, rec-4763) pin this single path,
      so it must never need decomposing into a package, TestAbsentSetDerivation (set equals
      requirements.in - fast - dev import names on a fixture triple; the live repo set contains duckdb and not boto3),
      TestAccounting (examined/skipped declared exactly once), TestSegmentSplitEquivalence (the local control-operator
      regex splits a fixture command table exactly as _vp_replay_classify._SHELL_SEGMENT_SPLIT_RE does; the test may
      import it, the check may not).
  - file: scripts/checks/deps/_manifest.py
    action: Modify
    purpose: >-
      One Entry for validate_hermetic_fast_tier_collectability (bare string literals, Decision 169): pre=True, pre_globs
      ("docs/plans/**", "tests/**/conftest.py", "requirements.in", "requirements-fast.txt", "requirements-dev.txt",
      "scripts/checks/deps/validate_hermetic_fast_tier_collectability.py", "scripts/checks/_pytest_diff.py",
      "scripts/checks/_common.py", "scripts/checks/registry.py"), full_segment="full_after_lint". The deps domain (not
      verification) because plan C owns scripts/checks/verification/_manifest.py in this wave (coordinator,
      2026-10-29) and the check's subject is the fast tier's dependency set.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      One check-to-category row, validate_hermetic_fast_tier_collectability: code_regression. Shared append with plan C
      (coordinator ruling 2026-10-29): whichever build merges second rebases and keeps both rows.
  - file: docs/contracts/vp-red-before.yaml
    action: Modify
    purpose: >-
      Class D: hermetic_authoring carve-out (iii)'s ownership clause is reworded (Decision 181 point 2). It replaces
      "an interim workaround for an environment mismatch, owned by rec-2809 for its enforcement gap and root-cause fix"
      with: enforced at plan-PR time by validate_hermetic_fast_tier_collectability for target files that exist, covering
      direct module-level guards or imports in the target file and its conftest chain (transitive first-party imports are
      not examined, nor are an already-merged unbuilt plan's existing steps or a later edit to one -- residuals owned by
      rec-4763, with the one live instance today owned by rec-4765) (added by rec-2809); a target the implementation creates or newly guards is caught before push by the CI-parity
      agent-container --pre (scripts/checks/deps/fast_tier_env.py, delivered by PLAN-fast-tier-ci-parity), and its
      remaining plan-amendment cost is owned by rec-4757; the root-cause alternative (a replay environment carrying
      these packages) is closed by the keep-PR-CI-light ruling (Benjamin, 2026-10-18). It keeps the
      requirements-fast.txt, rec-2809, replay_bound and pytest_diff literals that registry row
      vp-hermetic-authoring-single-rule pins. contract_version bumped by one (6 to 7) with an amendment_log entry
      (semantic_break false, change_class field_add), per the file's convention. green_leg_labels.hints module_level_skip text is
      unchanged.
  - file: config/agent/verification_registry/entries/hermetic-fast-tier-collectability.yaml
    action: Create
    purpose: Graduation row for VP step 1 (test_selector, node tests/checks/deps/test_validate_hermetic_fast_tier_collectability.py::TestFlagsGuardedTarget, guard_target scripts/checks/deps/validate_hermetic_fast_tier_collectability.py).
  - file: config/agent/verification_registry/entries/hermetic-fast-tier-collectability-registered.yaml
    action: Create
    purpose: >-
      Graduation row for VP step 3 (command_exit_zero, the step's bin/venv-python -c probe as the argv list, guard_target
      scripts/checks/deps/_manifest.py): the check stays registered in --pre.
  - file: config/agent/verification_registry/entries/vp-red-before-carveout-iii-enforcer.yaml
    action: Create
    purpose: >-
      Graduation row for VP step 4 (command_exit_zero, the step's bin/venv-python -c probe as the argv list, guard_target
      docs/contracts/vp-red-before.yaml): carve-out (iii) keeps naming its enforcer. The existing
      vp-hermetic-authoring-single-rule row pins only requirements-fast.txt, rec-2809, replay_bound and pytest_diff, so
      the enforcer pointer otherwise has no standing guard (round 5 F3).
  - file: docs/plans/PLAN-hermetic-fast-tier-collectability.yaml
    action: Modify
    purpose: Implementing-plan bookkeeping only (implementation_declared true at handoff).
bundled_recommendations:
  - rec-2809
followon_recs:
  - rec-4757
  - rec-4763
  - rec-4765
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    validate_hermetic_fast_tier_collectability fails a diff-present, not-yet-implemented plan whose hermetic pre-deploy
    pytest step targets an existing test file guarded on a CI-absent package (including through a node selector, a
    mixed selector list, or a directory selector holding a guarded member), and passes every unguarded shape listed in
    the mirror test.
  - The CI-absent set is derived from requirements.in, requirements-fast.txt and requirements-dev.txt, never hard-coded.
  - The check is registered in --pre and the full tier, and carve-out (iii) names it while keeping the pinned markers.
  - rec-2809 is closed by the Resolves trailer with an acceptance oracle that holds at the closing sha.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the collectability check's flagging cases (the test file does not exist today, pytest exit 4).
    command: bin/venv-python -m pytest tests/checks/deps/test_validate_hermetic_fast_tier_collectability.py::TestFlagsGuardedTarget -q
    expected: exit 0; each guarded shape is flagged with plan path, step id, selector, guarding file and package.
    fix_if: A guarded shape is not flagged -- fix the AST walk, the selector split or the absent-set derivation.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: hermetic-fast-tier-collectability
  - step: 2
    phase: pre-deploy
    action: Run the whole mirror test once for coverage of every branch (100% floor on the new module).
    command: >-
      bin/venv-python -m pytest tests/checks/deps/test_validate_hermetic_fast_tier_collectability.py
      --cov=scripts.checks.deps.validate_hermetic_fast_tier_collectability --cov-report=term-missing
      --cov-fail-under=100
    expected: exit 0; the new module at 100% line coverage (the run fails under 100).
    fix_if: A missed line -- add the test for that branch; never add a pragma no cover to reach 100%.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The 100% new-file floor is already a standing gate (Decision 159 coverage baseline) and step 1 graduates the
      flagging behaviour; a whole-module coverage run as a registry row would duplicate both.
  - step: 3
    phase: pre-deploy
    action: Registration probe -- the new check has a pre Entry in the deps manifest.
    command: >-
      bin/venv-python -c "from scripts.checks.deps._manifest import ENTRIES; import sys; sys.exit(0 if any(e.name == 'validate_hermetic_fast_tier_collectability' and e.pre and e.full_segment == 'full_after_lint' for e in ENTRIES) else 1)"
    expected: exit 0.
    fix_if: Entry missing or not pre -- fix the manifest, never the probe.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: hermetic-fast-tier-collectability-registered
  - step: 4
    phase: pre-deploy
    action: Contract pointer probe -- carve-out (iii) names its enforcer and keeps the markers the existing row pins.
    command: >-
      bin/venv-python -c "import yaml,sys; t=yaml.safe_load(open('docs/contracts/vp-red-before.yaml', encoding='utf-8'))['hermetic_authoring']; sys.exit(0 if all(k in t for k in ('validate_hermetic_fast_tier_collectability','rec-2809','requirements-fast.txt','replay_bound','pytest_diff')) else 1)"
    expected: exit 0.
    fix_if: Pointer missing or a pinned marker dropped -- fix the contract text, never the registry row.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: vp-red-before-carveout-iii-enforcer
  - step: 5
    phase: pre-deploy
    action: >-
      Re-point rec-2809's acceptance oracle to the delivered mirror test (Decision 201: the trailer job runs the
      acceptance at the closing sha; Decision 131 rename). Run immediately before the merge call (execution_steps), so an
      abandoned PR never leaves the warehouse row pointing at a branch-only test.
    command: >-
      bin/venv-python -c "from scripts.ops_data_portal import update_rec as u;
      u('rec-2809', {'acceptance': 'bin/venv-python -m pytest tests/checks/deps/test_validate_hermetic_fast_tier_collectability.py::TestFlagsGuardedTarget -q'})"
      && bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows, _ = fetch_recs_by_ids(make_reader(), ['rec-2809']); print([(r['id'], r['acceptance']) for r in rows])"
    expected: exit 0; the row prints the new acceptance command.
    fix_if: Portal unreachable -- restore the agent_platform chain and re-run; never edit a local cache.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Full-tier handoff obligation on the committed, rebased, clean tree, then attest the evidence covers HEAD.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0; the Validation Summary lists no failure and --verify-head attests HEAD.
    fix_if: >-
      In-scope failure -- fix, commit, re-run from the start; out-of-scope -- file a rec (Decision 59, Decision 55).
      Never skip or weaken a check.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: After the squash merge (Resolves trailer for rec-2809), confirm rec-2809 closed.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows, _ = fetch_recs_by_ids(make_reader(), ['rec-2809']); print({r['id']: r['status'] for r in rows})"
    expected: rec-2809 closed.
    fix_if: >-
      Still open -- read the closure job's log on main; if the trailer was dropped, follow git-ops.yaml's resolves_trailer
      recovery; never close by hand without the acceptance verdict.
    hermetic: false
test_obligations:
