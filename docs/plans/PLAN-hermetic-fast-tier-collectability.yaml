pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - PLAN-fast-tier-ci-parity's build merged (scripts/checks/deps/fast_tier_env.py exists on main)
execution_steps:
  - Create the collectability check and its mirror test (steps 1, 2).
  - Add the manifest Entry and the taxonomy row (step 3).
  - Modify docs/contracts/vp-red-before.yaml carve-out (iii) and its changelog (step 4).
  - Create the three graduation rows.
  - Execute Verification Plan -- run each step except 5 and 7; loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
  - >-
    Independent code review: dispatch the code-review skill in a fresh-context subagent over the branch diff; address
    every finding or record why not, and re-run step 6 after any change.
  - >-
    Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state; parent
    validator evidence (VP step 6 full-tier exit 0 plus --verify-head for the pushed HEAD); structured postflight
    evidence (write the scripts.session.postflight_evidence.CATEGORIES JSON in the scratchpad, then bin/venv-python -m
    scripts.session.postflight --evidence <file>); the real outcome -- push, PR, CI green by event-driven wake (never
    polled), code review PROCEED, squash-merge, then VP step 7.
  - >-
    Run VP step 5 (re-point rec-2809's acceptance) immediately before the merge call, never earlier. Merge under the
    project's standing rule (code review PROCEED and CI green). Squash with
    mcp__github__merge_pull_request(merge_method="squash") and an explicit commit_message whose body ends with the line
    "Resolves: rec-2809" directly above the Co-Authored-By and Claude-Session trailers; then read the merge commit back
    and confirm the trailer is present before reporting the merge.
  - 'Report: what was implemented, verification results'
rollback: Revert the squash commit; the check is a single manifest Entry and can also be removed alone.
