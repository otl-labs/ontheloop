    behavior: Hermetic pre-deploy pytest steps on CI-absent-guarded targets are flagged at plan-PR time.
    verification_step: 1
    test_selector: tests/checks/deps/test_validate_hermetic_fast_tier_collectability.py::TestFlagsGuardedTarget
    red_green_expectation: red before (module and test absent, exit 4), green after.
  - source: scripts/checks/deps/_manifest.py
    behavior: The new check is registered in --pre and the full tier.
    verification_step: 3
    command: bin/venv-python -c "from scripts.checks.deps._manifest import ENTRIES; import sys; sys.exit(0 if any(e.name == 'validate_hermetic_fast_tier_collectability' and e.pre and e.full_segment == 'full_after_lint' for e in ENTRIES) else 1)"
    red_green_expectation: red before (no such Entry, exit 1), green after.
  - source: docs/contracts/vp-red-before.yaml
    behavior: Carve-out (iii) names its enforcer and keeps the pinned markers.
    verification_step: 4
    command: bin/venv-python -c "import yaml,sys; t=yaml.safe_load(open('docs/contracts/vp-red-before.yaml', encoding='utf-8'))['hermetic_authoring']; sys.exit(0 if all(k in t for k in ('validate_hermetic_fast_tier_collectability','rec-2809','requirements-fast.txt','replay_bound','pytest_diff')) else 1)"
    red_green_expectation: red before (enforcer name absent), green after; registry row vp-hermetic-authoring-single-rule stays green.
  - source: config/ci_rca_taxonomy.yaml
    behavior: The new check has its category row.
    verification_step: 6
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      A one-row mapping; the registered taxonomy-coverage check in every tier fails on an unmapped check, which is the
      red-green proof.
  - source: config/agent/verification_registry/entries/hermetic-fast-tier-collectability.yaml
    behavior: Records a VP step's graduation.
    verification_step: 6
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      A registry row is itself an executable check; validate_verification_registry and validate_graduation_completeness
      run it in every tier and fail on a missing or non-resolving shard, which is the red-green proof.
  - source: config/agent/verification_registry/entries/hermetic-fast-tier-collectability-registered.yaml
    behavior: Records a VP step's graduation.
    verification_step: 6
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      A registry row is itself an executable check; validate_verification_registry and validate_graduation_completeness
      run it in every tier and fail on a missing or non-resolving shard, which is the red-green proof.
  - source: config/agent/verification_registry/entries/vp-red-before-carveout-iii-enforcer.yaml
    behavior: Records a VP step's graduation.
    verification_step: 6
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      A registry row is itself an executable check; validate_verification_registry and validate_graduation_completeness
      run it in every tier and fail on a missing or non-resolving shard, which is the red-green proof.
