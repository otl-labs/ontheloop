schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "inference-tier-selection"
intent: >-
  Name, in the one contract that holds them, the models and settings the three verdict personas run with, and add the
  pure resolver that turns those rows into one selection per persona and tier role. inference-provider.yaml's tier 1
  becomes DeepSeek's deepseek-flash alias and tier 2 Claude Opus 5.5 (each with a default_model), tier 2's notes state
  the remaining-allowance assertion for the organisation's hard-capped monthly credit, and a new
  litellm_persona_selection block sets thinking enabled and effort high for every persona in both roles.
  project-configuration.yaml's api_key setting becomes one row per role naming its SSM parameter; ports.yaml records
  the resolver's repository-layout assumption (SA-13). scripts/llm/tier_selection.py resolves and refuses (Decision 173
  clause 2(a), 2(b), 2(d) and clause 4), and validate_inference_provider_registry runs it on every tree. Plan 1 of 2
  for T4.32 c1's model leg; PLAN-llm-client-litellm-transport (plan 2) is the only caller.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-inference-tier-selection.yaml
phase: T4.32
scope:
  - file: docs/contracts/inference-provider.yaml
    action: Modify
    purpose: >-
      Sidecar blocks s01-s07, byte for byte ({{DATE}} filled with the build date): an amendment_log row (semantic_break
      true, field_add); tier 1 and tier 2 state text; litellm_tier_models tier_1 (models ["deepseek/deepseek-flash"],
      default_model, alias notes) and tier_2 (models ["anthropic/claude-opus-5-5"], default_model, the hard-cap
      remaining-allowance form, the above-zero threshold and how utilization is measured); the new
      model_id_formats.litellm_persona_selection block (vocabulary thinking [enabled, disabled], effort [low, high,
      max]; the three personas, each role {thinking: enabled, effort: high}); iam_requirements.summary; and s07, the six
      oldest amendment_log rows compacted to one flow-style line each (the contracts class's named relief valve), so
      the file measures 493 of 500 effective lines after the edit (490 today; about 540 without s07; VP step 8 re-measures).
  - file: docs/contracts/project-configuration.yaml
    action: Modify
    purpose: >-
      Sidecar blocks s08-s11, byte for byte: an amendment_log row; the semantics.this_repository sentence admits a
      secrets-store parameter name as a secret row's current_home; the model row's readers become [T4.32]; the api_key
      row becomes ports.run_persona.litellm.api_key.primary (DEEPSEEK_API_KEY) and
      .api_key.warm_fetched_escape_hatch (ANTHROPIC_API_KEY), each with its /secret/ parameter as current_home, status
      open, owning_item "T4.32:c1", enforcement validate_inference_provider_registry (the check whose new leg guards the
      variable-to-provider match).
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Sidecar blocks s12-s13, byte for byte: an amendment_log row and SA-13 after SA-12 (location scripts/llm, status
      open, owning_item "T4.24:c9"). No port row changes. Lands at 497 of 500 effective lines (484 today): under the
      contracts cap, so no relief step is owed; VP step 8 measures it at build time.
  - file: tests/checks/contracts/test_validate_project_configuration.py
    action: Modify
    purpose: >-
      Sidecar block s14, byte for byte: the one fixture lookup of "ports.run_persona.litellm.api_key" becomes
      "ports.run_persona.litellm.api_key.primary". No other edit to this file (it is bound).
  - file: scripts/llm/tier_selection.py
    action: Create
    purpose: >-
      The resolver, pure over two loaded mappings (no AWS, no environment reads, no network, no model call). Public
      surface: frozen dataclass Selection (persona, role, provider, model, thinking, effort, billing_shape,
      cold_start_assertion, api_key_variable); TierSelectionError(ValueError); resolve(persona, role, *,
      inference_provider, project_configuration, credential_holder="on_the_loop") -> Selection; resolve_all(*,
      inference_provider, project_configuration, credential_holder="on_the_loop") -> list[Selection] (every persona in
      litellm_persona_selection, in file order, times primary then warm_fetched_escape_hatch; primary only for
      end_user); load(root=None) -> (inference_provider, project_configuration) from docs/contracts/ (missing or
      unparseable file -> TierSelectionError naming the path); and a CLI, `python -m scripts.llm.tier_selection
      --check [--root PATH]`, printing one line per selection, "<persona> <role> <model> thinking=<t> effort=<e>
      key=<VAR>", then "TIER-SELECTION OK", exit 0; on TierSelectionError it prints the message and exits 1. Refusals
      (each a TierSelectionError naming the persona, role and rule): unknown role or persona; credential_holder not in
      vocabulary.axes.credential_holder; end_user asking for the warm_fetched_escape_hatch role (interim rule, tag
      end_user_primary_only: until ontheloop/platform.yaml exists an end_user resolution reads this repository's own
      rows, so only the primary role Decision 206 clause 3 permits a user-owned deployment to fill alone resolves; T4.24
      c16, SA-13); the role's tier row is Deferred or missing;
      litellm_tier_models row missing, default_model absent or not in models, or models with mixed LiteLLM prefixes;
      the default_model's LiteLLM prefix is a retired_providers id (Decision 173 clause 2(a)); the row's provider string,
      lower-cased with a trailing "-direct" removed, differs from that prefix (the prefix is the vendor identity of
      record, so the two must agree); for on_the_loop, the two
      roles' prefixes are equal (2(b)); the primary role's billing_shape is not metered_marginal (2(d)); a tier's
      cold_start_assertion breaks cold_start_assertion_rule (clause 4); a role's tier row carries billing_shape local
      (no tier role may, per cold_start_assertion_rule); the persona lacks the role, or a thinking or
      effort value is outside the block's vocabulary; no project-configuration row with id
      ports.run_persona.litellm.api_key.<role>, or its variable is not <PREFIX>_API_KEY (the prefix upper-cased, e.g.
      DEEPSEEK_API_KEY). The provider is the litellm_tier_models row's provider string; the model is its default_model.
      The module docstring states that an end_user resolution reads this repository's own tier rows only until
      ontheloop/platform.yaml exists (T4.24 c16, SA-13).
  - file: tests/test_llm_tier_selection.py
    action: Create
    purpose: >-
      The resolver's tests (mirror of scripts/llm/ per test_coverage_checker's "llm": "test_llm_" home). The real tree
      resolves, for each of decision_scout, plan_critic and code_reviewer and each role (a membership floor, never an
      exact count), a selection whose model equals that role's litellm_tier_models default_model read from the
      contract (no model id literal in the test, Decision 173 clause 2), whose thinking and effort equal the persona's
      row in litellm_persona_selection, and whose billing_shape, cold_start_assertion and key are metered_marginal,
      credential_liveness and DEEPSEEK_API_KEY for primary and fixed_non_rollover_allowance, remaining_allowance and
      ANTHROPIC_API_KEY for the fallback. One test
      per refusal in the resolver's scope row, each built by mutating a deep copy of the real two mappings, asserting
      TierSelectionError and that the message names that refusal's rule (each message carries a distinct rule tag, e.g.
      "2(b) vendor_independence"), so a test cannot pass on a different refusal. end_user resolves primary alone and refuses the
      fallback. load(): a tmp root missing either file, or holding an unparseable one, raises naming the path. CLI: --check on the real tree exits 0
      with the decision_scout primary line and TIER-SELECTION OK; on the same-vendor fixture (copies of the real two contracts with tier 2's models
      and default_model set to deepseek/deepseek-flash, its provider to DeepSeek-direct, and the
      ports.run_persona.litellm.api_key.warm_fetched_escape_hatch row's variable to DEEPSEEK_API_KEY, so that 2(b) is
      the only rule it breaks) it exits 1 and prints the 2(b) vendor_independence
      message; the 2(b) refusal unit test uses the same fixture. The module names docs/contracts/inference-provider.yaml and docs/contracts/project-configuration.yaml as
      string literals, so the fast tier's affected-test selection picks it up when either contract changes.
  - file: scripts/checks/contracts/validate_inference_provider_registry.py
    action: Modify
    purpose: >-
      One new leg, run only when the parsed contract has a tier_model mapping (the existing minimal fixtures carry
      none and stay green): read project-configuration.yaml from the same contracts_dir (missing or unparseable is a
      failure) and call tier_selection.resolve_all; a TierSelectionError becomes one failure line prefixed
      "Inference-provider registry:". The resolved selections add to the examined count, and when the leg ran clean it
      prints a second line, "  PASS: tier selection resolves <n> persona-role pairs.", after the existing PASS line,
      whose text stays unchanged. The module docstring names the new leg. Existing legs unchanged.
  - file: tests/checks/contracts/test_validate_inference_provider_registry.py
    action: Modify
    purpose: >-
      New test class for the leg: the real docs/contracts directory passes it; a tmp contracts dir holding copies of
      the real two contracts passes, then fails naming the 2(b) vendor_independence rule on the same-vendor fixture (copies of the real two contracts with tier 2's models
      and default_model set to deepseek/deepseek-flash, its provider to DeepSeek-direct, and the
      ports.run_persona.litellm.api_key.warm_fetched_escape_hatch row's variable to DEEPSEEK_API_KEY, so that 2(b) is
      the only rule it breaks), fails naming the missing file
      when project-configuration.yaml is removed, and fails naming the file when it is unparseable; the real-tree case
      asserts (capsys) the second PASS line; a fixture without tier_model still
      passes unchanged. Existing tests unchanged.
bundled_recommendations: []
followon_recs: []
closes_criteria: []
infrastructure_dependencies:
  - >-
    None. compute_affected_artifacts(<this plan's scope>) returns no active artifact: no scope file is Lambda-packaged
    and no .tf file is in scope. The two SSM parameters already exist (declared in terraform/personal/secret_parameters.tf, read
    grants in terraform/bootstrap; Decision 237); this plan reads neither and makes no model call.
acceptance_criteria:
  - The four bound files' edits equal main plus the approved sidecar's 14 blocks, word for word (approved_text verify exits 0 at the recorded digest).
  - "`bin/venv-python -m scripts.llm.tier_selection --check` on the real tree prints six selection lines, including `decision_scout primary deepseek/deepseek-flash thinking=enabled effort=high key=DEEPSEEK_API_KEY` and `plan_critic warm_fetched_escape_hatch anthropic/claude-opus-5-5 thinking=enabled effort=high key=ANTHROPIC_API_KEY`, then TIER-SELECTION OK."
  - Every refusal in the resolver's scope row has a test that fails without it.
  - validate_inference_provider_registry, validate_project_configuration and validate_ports_contract pass on the real tree, and the registry leg fails, naming the 2(b) rule, on a fixture whose only broken rule is vendor independence.
  - tests/provider_agnostic_tier_model still passes (Decision 173 clause 4 rule unchanged).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: this plan and its sidecar are on main; branch current."
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-inference-tier-selection.yaml && git
      cat-file -e origin/main:docs/plans/approved/inference-tier-selection.yaml && git merge-base --is-ancestor
      origin/main HEAD && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: A missing plan or sidecar means this plan's PR has not merged; stop. A failed ancestry test means a stale branch; merge origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The bound files are exactly main plus the approved sidecar.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug inference-tier-selection --base origin/main
      --expect 345e37ffa256c249702e336ff07dcbd38301a0b11b3f2a2e0a7621b26a3c5ce9  # pragma: allowlist secret
    expected: Exit 0, printing APPROVED-TEXT OK. Red before the sidecar blocks are placed.
    fix_if: >-
      A word mismatch means a placed block drifted: restore its after text exactly, never edit the sidecar. A digest
      mismatch means the sidecar on main is not the approved one: stop and ask the operator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A base-relative, one-time binding of this build's diff to its sidecar; validate_merge_step enforces the same
      binding on the build PR's fast tier.
  - step: 3
    phase: pre-deploy
    action: The resolver resolves every persona and role on the real tree (the lasting rule, model-free).
    command: bin/venv-python -m scripts.llm.tier_selection --check
    expected: >-
      Exit 0, printing one line per persona and role and then TIER-SELECTION OK. Red before: the module does not
      exist; with only the sidecar placed it still does not exist.
    expected_literals:
      - "decision_scout primary "
      - "code_reviewer warm_fetched_escape_hatch "
      - "TIER-SELECTION OK"
    fix_if: >-
      A refusal on the real tree means the placed contract text or the resolver disagrees with the scope row: fix the
      resolver, or send a plan-defect report if the approved text itself is refused; never edit the bound text.
    hermetic: true
    graduation: graduate
    graduation_check_id: inference-tier-selection-real-tree
  - step: 4
    phase: pre-deploy
    action: The resolved selections equal the approved values at build time (a moment claim; model ids change by contract edit).
    command: bin/venv-python -m scripts.llm.tier_selection --check
    expected: Exit 0 with the two lines below and TIER-SELECTION OK.
    expected_literals:
      - "decision_scout primary deepseek/deepseek-flash thinking=enabled effort=high key=DEEPSEEK_API_KEY"
      - "plan_critic warm_fetched_escape_hatch anthropic/claude-opus-5-5 thinking=enabled effort=high key=ANTHROPIC_API_KEY"
    fix_if: A different model or setting means a placed block drifted (VP step 2 catches it) or the resolver reads the wrong field.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A moment claim (Decision 244 cl.4): the model ids are inference-provider.yaml's to change by contract edit
      (Decision 173 cl.2; rec-5069 plans a version bump), so a standing record would redden on a legitimate swap and
      become a second home for the ids. Step 3 graduates the lasting, model-free rule.
  - step: 5
    phase: pre-deploy
    action: The resolver's tests, the registry leg's tests and the neighbouring contract tests.
    command: >-
      bin/venv-python -m pytest -q tests/test_llm_tier_selection.py
      tests/checks/contracts/test_validate_inference_provider_registry.py
      tests/checks/contracts/test_validate_project_configuration.py tests/checks/contracts/test_validate_ports_contract.py
      tests/provider_agnostic_tier_model
    expected: "Exit 0. Red before: tests/test_llm_tier_selection.py is absent and the new registry tests fail."
    fix_if: Fix the code under test; never weaken an assertion or skip a test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The created tests are the standing guard: the --pre affected set selects them when either contract or the
      resolver changes, and the full tier runs them on main.
  - step: 6
    phase: pre-deploy
    action: The three contract checks pass on the real tree.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_inference_provider_registry import
      validate_inference_provider_registry as a; from scripts.checks.contracts.validate_project_configuration import
      validate_project_configuration as b; from scripts.checks.contracts.validate_ports_contract import
      validate_ports_contract as c; f=[]; a(f); b(f); c(f); print('FAILURES', f); raise SystemExit(1 if f else 0)"
    expected: Exit 0 after printing FAILURES [].
    fix_if: Fix the file the failure names; never edit a check to pass.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: All three checks run in the fast tier on every change; a registry record would re-run them.
  - step: 7
    phase: pre-deploy
    action: The retired row id ports.run_persona.litellm.api_key is referenced by no live script, test or contract.
    command: >-
      git grep -n 'ports.run_persona.litellm.api_key"' -- scripts tests docs/contracts; rc=$?; test $rc -eq 1 && echo
      OLD_ID_DEAD
    expected: "Prints OLD_ID_DEAD (git grep exit 1, no match); a git grep error (exit 128) fails. Red before s14: the bound test still names the old id."
    fix_if: >-
      A hit names a consumer the rename missed; the bound files are fixed, so report it as a plan defect. The
      trailing-quote pattern is deliberate: the approved amendment and IAM prose name the old id without a closing
      quote, and VP step 2 binds those rows.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A one-time rename proof across three trees, which the single-path grep_count slot cannot express. After it, a
      reintroduced lookup of the old id fails its own test, because the id resolves no row.
  - step: 8
    phase: pre-deploy
    action: Both near-cap contracts are under the contracts class's 500 effective lines at build time.
    command: >-
      bin/venv-python -c "from scripts.checks.structural import _classify as c; import sys; n={p:
      c.effective_lines(open(p).read()) for p in ('docs/contracts/inference-provider.yaml','docs/contracts/ports.yaml')};
      print(n); sys.exit(0 if max(n.values()) <= 500 else 1)"
    expected: Exit 0 printing both counts (493 and 497 if main has not moved under them).
    fix_if: >-
      Over 500 means another plan landed text in that contract first: stop and send a plan-defect report (relief needs
      new sidecar text); never raise the budget.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A moment claim; validate_size_limits enforces the same cap in the fast tier on every change.
  - step: 9
    phase: pre-deploy
    action: Fast tier on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the named failure on the branch; never skip, disable or quarantine a test.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Full tier before handoff (handoff_policy), started in the background from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports a completed full run for HEAD with exit 0.
    fix_if: A red full tier blocks handoff; fix and rerun from the start. A timeout is blocked, never a warning.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/llm/tier_selection.py
    behavior: resolves each persona and role to its selection and refuses every Decision 173 / 206 violation the scope row lists
    verification_step: 5
    test_selector: tests/test_llm_tier_selection.py
    red_green_expectation: red before (module and tests absent), green after
  - source: scripts/checks/contracts/validate_inference_provider_registry.py
    behavior: the registry check resolves every persona when tier_model is present and fails a same-vendor pair
    verification_step: 5
    test_selector: tests/checks/contracts/test_validate_inference_provider_registry.py
    red_green_expectation: red before (the new class fails; the leg does not exist), green after
  - source: docs/contracts/inference-provider.yaml
    behavior: tier rows, default models and per-persona settings resolve
    verification_step: 3
    command: bin/venv-python -m scripts.llm.tier_selection --check
    red_green_expectation: red before (no default_model, no litellm_persona_selection block), green after
  - source: docs/contracts/project-configuration.yaml
    behavior: one api_key row per committed tier role whose variable matches the role's provider
    verification_step: 5
    test_selector: tests/test_llm_tier_selection.py
    red_green_expectation: >-
      red before (no api_key.<role> rows; the real-tree test and the missing-row and wrong-variable refusal tests
      fail), green after
  - source: docs/contracts/ports.yaml
    behavior: SA-13 registers with an existing location
    verification_step: 6
    waiver_reason: Registration data; validate_ports_contract in the fast tier fails a row whose location does not exist.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_inference_provider_registry import
      validate_inference_provider_registry as a; from scripts.checks.contracts.validate_project_configuration import
      validate_project_configuration as b; from scripts.checks.contracts.validate_ports_contract import
      validate_ports_contract as c; f=[]; a(f); b(f); c(f); print('FAILURES', f); raise SystemExit(1 if f else 0)"
  - source: tests/test_llm_tier_selection.py
    behavior: the resolver's test file itself
    verification_step: 5
    test_selector: tests/test_llm_tier_selection.py
    waiver_reason: The test module is its own evidence; its red-before is the absent resolver it asserts on.
  - source: tests/checks/contracts/test_validate_inference_provider_registry.py
    behavior: the registry leg's tests
    verification_step: 5
    test_selector: tests/checks/contracts/test_validate_inference_provider_registry.py
    waiver_reason: The test module is its own evidence.
  - source: tests/checks/contracts/test_validate_project_configuration.py
    behavior: the bound fixture lookup follows the renamed row
    verification_step: 5
    test_selector: tests/checks/contracts/test_validate_project_configuration.py
    waiver_reason: The test module is its own evidence; its red-before is the renamed row.
constraints:
  - Place every sidecar block byte for byte, filling only {{DATE}}; never edit the sidecar (Decision 246). Any other edit to the four bound files fails approved_text verify.
  - The resolver is pure. No model call, no credential read, no AWS or SSM call, no environment read in tier_selection.py; the cold-start assertion itself is plan 2's, and the CLI only resolves.
  - No model id outside inference-provider.yaml's litellm_tier_models (Decision 173 clause 2) -- tests assert the real tree's ids by reading them from that contract, except the membership floor and VP literals that pin the approved values.
  - scripts/llm/model_registry.py's _VALID_PROVIDERS and provider_defaults.executor_path stay untouched (Decision 173 clause 2's untouched list).
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
