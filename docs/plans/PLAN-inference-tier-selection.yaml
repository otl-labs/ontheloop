  - "STEP 1: place sidecar blocks s01-s14 byte for byte ({{DATE}} = build date). Run VP step 2. Post: APPROVED-TEXT OK."
  - "STEP 2: write scripts/llm/tier_selection.py per its scope row, then tests/test_llm_tier_selection.py. Run VP step 3."
  - "STEP 3: add the registry leg and its tests. Run VP steps 4 and 5."
