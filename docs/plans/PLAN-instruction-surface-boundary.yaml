schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: instruction-surface-boundary
intent: >-
  Close the RB-12 security gap (rec-5570): AGENTS.md, the hook registration files and the hooks they register, and the
  interactive gate skills and commands become Decision 117 boundary paths, so a branch that edits the instructions a
  governed agent loads is no longer treated as an ordinary edit. A strict append to boundary_patterns plus a test that
  each surface is covered.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-instruction-surface-boundary.yaml
phase: >-
  security_advisory (soft-warn exception category): release-boundary audit finding RB-12 (rec-5570, High). No tier_item
  is claimed and no exit criterion is closed. It also lands early the boundary-list leg T4.28 c6 names for rec-4476
  (.claude/skills/ and .claude/commands/); the interactive self-review half of rec-4476 still closes at the T4.28 c6,
  T4.30 c5 and T4.29 c5 flips.
closes_criteria: []
cites: [dec:117, dec:229, dec:235, dec:279]
scope:
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      Strict append after the last boundary_patterns entry (today scripts/ci/ci_rca_steps.sh): one comment line naming
      rec-5570 and rec-4476, then the entries AGENTS.md, .claude/settings.json, .claude/hooks/, .claude-plugin/,
      .claude/statusline.py, .claude/skills/, .claude/commands/. No existing line moves or changes, so
      approval_routing.exempt holds (pure tightening append; no wording sidecar) and the base-ref ratchets in
      sensitive_value_detectors and validate_tier_a_amendment_guard see no removal or narrowing.
    new_imports: []
  - file: tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py
    action: Create
    purpose: >-
      Three nodes, each matching paths with the consumers' own substring rule (any(p in path for p in
      boundary_patterns), as risk_scoring.compute_automatable and validate_executor_boundary do).
      test_agents_md_and_hook_registration_are_boundary_paths (rec-5570's acceptance node): AGENTS.md,
      .claude/settings.json, .claude/.claude-plugin/plugin.json, .claude-plugin/marketplace.json and every file under
      .claude/hooks/ are covered, and every repo path named in a command registered in .claude/settings.json (hooks and
      statusLine) or .claude/hooks/hooks.json is covered, so a hook later registered from outside .claude/hooks/ fails
      the node. Extraction rule, one helper the node and its self-check share: walk every "command" string value in
      both files; replace ${CLAUDE_PLUGIN_ROOT}/ with .claude/ and delete ${CLAUDE_PROJECT_DIR}/ and
      $CLAUDE_PROJECT_DIR/; map each "-m a.b.c" to the first tracked file of a/b/c.py, a/b/c/__main__.py,
      a/b/c/__init__.py; then take every maximal run of [A-Za-z0-9_./-] characters that equals a git-tracked path (a
      regex scan over the whole string, so quoting, bash -c bodies and $(...) substitutions are scanned alike). A
      registered command that yields no tracked path fails the node (fail closed). The same node runs the helper on
      two synthetic registrations, bin/venv-python scripts/aws_identity.py and bin/venv-python -m scripts.aws_identity,
      and asserts each yields scripts/aws_identity.py reported uncovered (a negative self-check that the scan finds
      out-of-boundary paths in both forms). Measured on 2b3f37ec with the appended list: all 48 registered commands
      yield at least one tracked path and every path is covered. test_skills_and_commands_are_boundary_paths: every file
      under .claude/skills/ and .claude/commands/ is covered. test_compute_automatable_refuses_instruction_surfaces:
      with risk_scoring._compute_risk_score monkeypatched to return 0.0 (so only the boundary leg decides, and no radon
      subprocess runs) and risk_scoring._capabilities_cache reset to None before and after (monkeypatch.setattr, as
      tests/persona_contracts/test_leash_boundary.py does, so the node does not depend on test order), compute_automatable returns False for AGENTS.md, .claude/settings.json,
      .claude/hooks/never_on_main.py and .claude/skills/code-review/SKILL.md (the derivation a rec filed against them goes
      through; on main an XS rec on AGENTS.md derives True).
    new_imports: [scripts.ops_portal.risk_scoring]
  - file: tests/ci_rca/test_rca_agent_entrypoint.py
    action: Modify
    purpose: >-
      test_ci_rca_steps_script_is_in_the_executor_boundary pins scripts/ci/ci_rca_steps.sh as the list's last entry,
      which a strict append necessarily breaks (measured: the only consumer-test failure with the trial append). The
      last-entry assertion is replaced by an exact-position assertion: the entry sits immediately after
      persona_verdict (patterns.index of it equals patterns.index("persona_verdict") + 1). The membership assertion stays.
    new_imports: []
bundled_recommendations: [rec-5570]
followon_recs: [rec-5604]
infrastructure_dependencies: []
acceptance_criteria:
  - "boundary_patterns ends with the appended block; every entry before it is byte-identical to main (strict append)."
  - "AGENTS.md, .claude/settings.json, both plugin manifests, every file under .claude/hooks/, .claude/skills/ and .claude/commands/, and every repo path a registered hook or statusLine command names, match a boundary_patterns entry by substring."
  - "compute_automatable derives False for a rec whose file is one of those surfaces."
  - "rec-5570's acceptance node passes after the change and fails before it; every consumer test of boundary_patterns still passes."
  - "rec-5570 is closed by the merge's Resolves trailer; rec-4476 stays open with its context recording the delivered boundary half."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The three new nodes pass, including rec-5570's acceptance node.
    command: >-
      bin/venv-python -m pytest
      tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py::test_agents_md_and_hook_registration_are_boundary_paths
      tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py::test_skills_and_commands_are_boundary_paths
      tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py::test_compute_automatable_refuses_instruction_surfaces
      -q
    expected: exit 0 with 3 passed; all three fail against main's capabilities.yaml
    fix_if: a node fails; an entry is missing or a registered hook path falls outside the list
    hermetic: true
    expected_literals: ["3 passed"]
    graduation: graduate
    graduation_check_id: instruction-surface-boundary
  - step: 2
    phase: pre-deploy
    action: Every consumer test of boundary_patterns passes with the appended list.
    command: >-
      bin/venv-python -m pytest tests/test_approval_routing.py tests/checks/executor/
      tests/checks/misc/test_sensitive_value_detectors.py tests/checks/contracts/test_validate_north_star.py
      tests/checks/contracts/test_validate_tier_a_amendment_guard.py tests/test_ops_data_portal_validators.py
      tests/ci_rca/test_rca_agent_entrypoint.py tests/persona_hosts/test_package_boundary.py
      tests/persona_backends/test_package_boundary.py tests/persona_contracts/ -q
    expected: exit 0, no failure
    fix_if: a consumer test fails; read which consumer and why before touching anything outside scope
    hermetic: false
    graduation: waive
    graduation_waiver_reason: These files already run in the full tier; step 1 carries the new regression.
  - step: 3
    phase: pre-deploy
    action: The capabilities.yaml diff is a pure tightening append that approval routing exempts.
    command: >-
      bin/venv-python -c "import subprocess; from scripts.roadmap import approval_routing as ar;
      f='config/agent/executor/capabilities.yaml'; b=subprocess.run(['git','show','origin/main:'+f],capture_output=True,text=True,check=True).stdout;
      print('exempt', ar.exempt({}, f, b, open(f).read()))"
    expected: prints exempt True
    fix_if: exempt False; an existing line or comment moved, or a comment-only block was added; restore a strict append
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads origin/main, so it is not hermetic; the fast tier's approval routing check enforces the same rule on the PR.
  - step: 4
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 5
    phase: post-deploy
    action: rec-5570 is closed by the merge's Resolves trailer and rec-4476 is still open.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5570', 'rec-4476']); print([(r['id'], r['status']) for r in rows])"
    expected: rec-5570 closed and rec-4476 open, after the closure job runs on the merge commit; then, after the update_rec note, rec-4476's context contains test_skills_and_commands_are_boundary_paths (re-read with the same verb)
    fix_if: rec-5570 still open; read the closure job log for the refusal marker and fix its cause, never a direct status write
    hermetic: false
test_obligations:
  - source: config/agent/executor/capabilities.yaml
    behavior: AGENTS.md, the hook registration files and every hook path they register (by the stated extraction rule, failing closed on a command with no path) are boundary paths, and the scan reports a synthetic out-of-boundary registration in path and -m form
    verification_step: 1
    test_selector: tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py::test_agents_md_and_hook_registration_are_boundary_paths
    red_green_expectation: red before (AGENTS.md and .claude/hooks/ unmatched), green after
  - source: config/agent/executor/capabilities.yaml
    behavior: the interactive gate skills and commands are boundary paths
    verification_step: 1
    test_selector: tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py::test_skills_and_commands_are_boundary_paths
    red_green_expectation: red before (.claude/skills/ and .claude/commands/ unmatched), green after
  - source: config/agent/executor/capabilities.yaml
    behavior: a rec filed against an instruction surface derives automatable false
    verification_step: 1
    test_selector: tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py::test_compute_automatable_refuses_instruction_surfaces
    red_green_expectation: red before (compute_automatable returns True for AGENTS.md), green after
constraints:
