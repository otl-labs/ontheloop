  - "No test assertion is loosened (Decision 235 cl.1 and cl.5: the test guards the boundary path scripts/ci/ci_rca_steps.sh, so its change is floor and named here for the human): the ci_rca_steps.sh last-entry pin is replaced by an exact-position pin (immediately after persona_verdict); the two assert different properties, and the build records the weakening-candidate disposition as replaced under this plan's human approval."
  - "No consumer module is edited: approval_routing, risk_scoring, validate_executor_boundary, validate_tier_a_amendment_guard, validate_persona_contracts, validate_north_star and sensitive_value_detectors read the list as-is."
  - "No rescue agents or workaround loops (Decision 55)."
