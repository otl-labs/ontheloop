    action: Create
    purpose: >-
      The shared supersession walk: superseded(rows, number, block), declared_supersedes(block) and
      resolve_live(entries, number, rows=None), moved from consolidation.py unchanged in behaviour; rec-5719's guard
      reuses it with the same declaration rule (operator ruling 2026-11-27).
    new_imports: [scripts.decisions_md]
  - file: tests/checks/test__decision_chain.py
    action: Create
    purpose: Mirror test of the walk on small corpora, plus a real-corpus invariant that every declared chain ends at a live entry.
  - file: scripts/checks/decisions/consolidation.py
    action: Modify
    purpose: Drop _superseded, _live and _declared; call scripts.checks._decision_chain (behaviour unchanged, pinned by the existing test_consolidation.py).
    new_imports: [scripts.checks._decision_chain]
  - file: scripts/decisions_md.py
    action: Modify
    purpose: Rename the private _extract_title_borne_supersedes to extract_title_borne_supersedes (it has three importers outside the module); no other change.
  - file: scripts/roadmap/plan_decision_drafts.py
    action: Modify
    purpose: Import the renamed helper.
  - file: tests/decisions_md/test_parse.py
    action: Modify
    purpose: Import the renamed helper.
  - file: scripts/checks/decisions/consolidation_inventory/_structured.py
    action: Modify
    purpose: >-
      manifests lists carried_forward numbers and held "Decision N" units whose supersession path reaches the victim,
      with the path and the unit token in the hit detail; held hits become the new kind manifest_held_token.
    new_imports: [scripts.checks._decision_chain]
  - file: scripts/checks/decisions/consolidation_inventory/_model.py
    action: Modify
    purpose: >-
      RULES: manifest_reference's effect fails_resolve (stale since rec-5717) becomes resolves_to_successor, and new
      kind manifest_held_token (R-MANIFEST-HELD, successor_must_carry_token, needs disposition); SCHEMA_VERSION 1 -> 2
      because the JSON's effect values change.
  - file: tests/checks/decisions/consolidation_inventory/test__structured.py
    action: Modify
    purpose: Add test_inbound_manifest_references_to_a_victim_are_listed (rec-5720's acceptance node).
  - file: tests/checks/decisions/consolidation_inventory/test_inventory.py
    action: Modify
    purpose: The fixture's two manifest rows expect the new effect and the new held kind.
  - file: tests/checks/decisions/consolidation_inventory/test__model.py
    action: Modify
    purpose: KINDS gains manifest_held_token; the JSON schema_version literal reads 2.
  - file: tests/checks/decisions/consolidation_inventory/test___main__.py
    action: Modify
    purpose: The JSON schema_version literal reads 2.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
