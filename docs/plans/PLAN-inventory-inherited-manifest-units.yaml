execution_steps:
  - >-
    Create scripts/checks/_decision_chain.py with superseded(rows, number, block) (the index row's currency starts with
    "superseded" when the number has a row, else the body carries a Superseded by marker), declared_supersedes(block)
    (envelope supersedes ints when a list, union the title-borne supersedes of its heading line) and
    resolve_live(entries, number, rows=None) -> (live number or None, path): the loop consolidation.py's _live runs
    today, with no option to skip the declaration test. Module
    docstring names Decision 149, Decision 278 and the Decision 104 placement.
  - >-
    scripts/checks/decisions/consolidation.py: delete _superseded, _live and _declared; import resolve_live and
    superseded (as _superseded) from scripts.checks._decision_chain; call resolve_live(entries, n, rows) where _live
    was called; drop the decisions_md title-helper import.
  - >-
    scripts/decisions_md.py: rename _extract_title_borne_supersedes to extract_title_borne_supersedes (definition,
    its one call and the comments naming it, dropping the word "private"); update the imports and calls in
    scripts/roadmap/plan_decision_drafts.py and tests/decisions_md/test_parse.py; ruff fixes import order. No line
    count change (decisions_md.py 16 and test_parse.py 7 lines of headroom).
  - >-
    consolidation_inventory/_structured.py: add ARCHIVE_REL; _chain(root) builds entries (DECISIONS.md then the
    archive, first wins) and index rows (quietly, chain_edges already notes a missing index); _reaching(number,
    victim, chain) returns "" when the path is the victim alone, " (-> a -> b)" when the path reaches it, else None.
    manifests: supersedes hits unchanged; each carried_forward number whose path reaches the victim gives a
    manifest_reference hit at key carried_forward with detail "carried_forward Decision N<path>"; each held string
    matching "Decision N" exactly is resolved the same way, any other held string still matches by _mentions, and a
    hit is manifest_held_token at key units.<id>.held with detail "held <string><path> token <repr of token>".
  - >-
    _model.py: RULES manifest_reference -> ("R-MANIFEST", "resolves_to_successor", True); add manifest_held_token ->
    ("R-MANIFEST-HELD", "successor_must_carry_token", True); SCHEMA_VERSION = 2.
  - >-
    Tests: tests/checks/test__decision_chain.py (a CASES table of resolve_live rows: live, absent, one declared hop,
    envelope then title hop, undeclared hop, non-list supersedes, next
    header missing, cycle, markerless superseded row, current row beating a marker; declared_supersedes on envelope
    and title; the real-corpus invariant that every entry whose marker's target declares it resolves to a live
    entry). test__structured.py: test_inbound_manifest_references_to_a_victim_are_listed on a fixture with 9001 and
    9006 stubs pointing at live 9005 (only 9005's envelope declares 9001) and a manifest carrying [9001, 9006, 4] and
    holding Decision 9001 (T1), Decision 9005 (T2), Decision 9006 (T3) and a contract key (T4); for victim 9005 it
    expects exactly the held 9001 hit via 9005 with T1, the held 9005 hit with T2 and the carried_forward 9001 hit
    via 9005. test_inventory.py, test__model.py and test___main__.py take the new effect, kind and schema_version.
  - Add "scripts/checks/_decision_chain.py" to the pre_globs of the four Entries named in scope.
  - Execute the Verification Plan; loop until each step passes; on an unrecoverable failure stop and RCA (Decision 55).
  - "Squash-merge with \"Resolves: rec-5720\" in the commit body (git-ops.yaml Resolves trailer); VP 7 reads it back."
  - >-
    Report: the diff summary and VP 1-5 outputs. On merge, give the coordinator the merge SHA: rec-5719's build
    (PLAN-marker-guard-supersession-chain) waits on it.
rollback: Revert the squash commit; the inventory and manifest checks return to the in-module walk and no data changes.
