acceptance_criteria:
  - >-
    For each victim, the inventory lists every manifest carried_forward number and held "Decision N" unit whose
    supersession path (resolve_live with the index rows) contains the victim, including a number that reaches it
    through compacted stubs; a held hit carries the unit token and, when the reference is not the victim itself, the
    path, e.g. "held Decision 213 (-> 290) token 'provision_telemetry_login'"; an undeclared hop is not followed.
  - >-
    consolidation.py's manifest checks call the shared walk and every existing test of them passes unchanged; the
    walk's mirror test covers the declared, undeclared, cycle, missing-header and index-row cases.
  - >-
    manifest_reference's effect is resolves_to_successor, held units are manifest_held_token with effect
    successor_must_carry_token, and the inventory JSON reports schema_version 2.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5720's acceptance node.
    command: bin/venv-python -m pytest "tests/checks/decisions/consolidation_inventory/test__structured.py::test_inbound_manifest_references_to_a_victim_are_listed" -q
    expected: exit 0 with 1 passed; with the base _structured.py and _model.py it fails (no transitive hit, no token, old kind)
    fix_if: the listed hits differ; fix the surface, never the expected list
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: The node runs in the suite on every change to the inventory; a registry row would duplicate it.
  - step: 2
    phase: pre-deploy
    action: The shared walk's mirror test.
    command: bin/venv-python -m pytest "tests/checks/test__decision_chain.py::test_resolve_live" "tests/checks/test__decision_chain.py::test_declared_supersedes_reads_envelope_and_title" "tests/checks/test__decision_chain.py::test_every_declared_chain_in_the_real_corpus_ends_at_a_live_entry" -q
    expected: exit 0 with 12 passed (10 resolve_live rows, the declaration test and the real-corpus invariant)
    fix_if: a row fails; read its name and fix the walk, never the row
    hermetic: true
    expected_literals: ["12 passed"]
    graduation: waive
    graduation_waiver_reason: The mirror test runs in the suite on every change to the module.
  - step: 3
    phase: pre-deploy
    action: Behaviour preserved for every consumer of the moved code and the renamed helper.
    command: bin/venv-python -m pytest tests/checks/decisions tests/decisions_md tests/roadmap tests/checks/test__decision_chain.py -q -n 4
    expected: exit 0, no failures (1287 passed at planning with the rehearsed change applied)
    fix_if: an existing consolidation, decisions_md or plan_decision_drafts test fails; the move or the rename changed behaviour
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole-directory re-run of tests the scope touches; the suite already runs them on every change.
  - step: 4
    phase: pre-deploy
    action: >-
      Real-repository rehearsal of chain 6's shape: in memory, Decision 213 becomes a stub pointing at a new successor
      whose envelope supersedes [213]; the inventory of that successor lists the chain 81 and 126 manifests' inherited
      units through 213.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.checks.decisions.consolidation_inventory import _structured as s; from scripts.checks.decisions.consolidation_inventory._model import Gate; r=Path('.'); e,rows=s._chain(r); n=max(e)+1; e[213]='## Decision 213: x\n\n**Status:** Superseded\n\n**Superseded by: Decision %d**\n' % n; e[n]='## Decision %d: s\n\n\x60\x60\x60yaml\nnumber: %d\nsupersedes: [213]\n\x60\x60\x60\n' % (n, n); rows[213]=dict(rows[213], currency='superseded_compacted'); s._chain=lambda root: (e, rows); h=s.manifests(r, (n,), Gate(r), []); d=sorted(x.evidence[0].detail for x in h); print(d); assert len(h)==4 and all('(-> %d)' % n in x for x in d) and sum('provision_telemetry_login' in x for x in d)==2; print('INHERITED_OK')"
    expected: >-
      prints the four details (two carried_forward Decision 213, two held Decision 213 with token
      provision_telemetry_login, each naming the path to the new number) then INHERITED_OK; on the base the command
      fails (no _chain)
    fix_if: fewer than four hits or a detail without the path or token; the transitive walk is wrong for the real manifests
    hermetic: true
    expected_literals: ["held Decision 213 (-> "]
    graduation: waive
    graduation_waiver_reason: Moment claim about today's chain 81 and 126 manifests; step 1's node is the standing guard.
  - step: 5
    phase: pre-deploy
    action: Size headroom and the fast tier on the complete tree.
    command: >-
      bin/venv-python -c "sl={f: sum(1 for l in open(f) if l.strip() and not l.strip().startswith('#')) for f in ('scripts/decisions_md.py', 'scripts/checks/decisions/consolidation.py', 'scripts/checks/decisions/consolidation_inventory/_structured.py', 'scripts/checks/_decision_chain.py')}; print('SLOC', sl); assert max(sl.values()) <= 490" && bin/venv-python -m scripts.validate --pre
    expected: >-
      prints SLOC with every file at most 490 (rehearsed 484, 427, 349 and 36), then validate --pre exits 0
    fix_if: a file above 490 (decompose per Decision 128, never raise) or a --pre failure (fix on the branch)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_sloc_limits is the standing guard; this step only pins headroom for the build.
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 7
    phase: post-deploy
    action: rec-5720 reads back closed after the build's squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5720']); print(rows[0]['status'])"
    expected: prints closed
    fix_if: prints open; close it through scripts.ops_data_portal --update-rec after confirming its acceptance node passes on main
    hermetic: false
    graduation: not-applicable
