slug: inventory-inherited-manifest-units
intent: >-
  Make the consolidation coupling inventory list, for each victim, every merged manifest's held unit (with its token)
  and carried_forward number that names the victim directly or resolves to it through a supersession chain, so the
  drafter and critic of a chain consolidation see what the new entry inherits (rec-5720); the supersession walk moves
  into one shared module the manifest check, the inventory and later the raise-marker guard (rec-5719) all call.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-inventory-inherited-manifest-units.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5720 (Low), follow-on of rec-5717 (PLAN-manifest-supersession-resolver, built #2531). Closes no roadmap
  criterion.
closes_criteria: []
cites: [dec:104, dec:128, dec:149, dec:278]
amends: []
introduces: []
scope:
