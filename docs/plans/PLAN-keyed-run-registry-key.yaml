  - "Operator 2026-11-26 18:57 UTC: chose refuse telemetry only (not the run), then 'write the plan'."
  - "Order: build after rec-5659's build (PLAN-canary-guidance-eval-cases, unbuilt at planning) merges; both edit tests/personas/test_execute.py. rec-5561 and rec-5660 do not edit keyed_run.py or execute.py."
  - "Graduated shards over test_execute.py nodes this plan touches (persona-verdict-fixture-run-units: test_record_sidecar_maps; persona-record-telemetry-first) are kept: call sites change, assertions and node ids do not. persona-guidance-chain-guards and persona-verdict-fallback-run-units are kept: their test_execute.py nodes are not edited."
  - "Ports: SA-11 already records the persona mechanism's dependency on the executor-personas index; no ports.yaml change (Decision 212)."
