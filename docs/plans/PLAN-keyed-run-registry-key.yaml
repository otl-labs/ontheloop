gate_rounds:
  - {gate: decision-scout, round: 1, verdict: NO_FLAGS, scout_input_fingerprint: "v1:facf04bc1262cd3ac3155bfad274c14518e00cc99636faa8bb30e4fee67b9651"}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Write tests/personas/test_keyed_run.py first and confirm VP 1 fails; then execute.py registry_key; then keyed_run.py (drop AGENT, sidecar_bytes agent argument, _telemetry refusal); then the test_execute.py call sites.
  - Execute VP 1-2; run validate --pre; run VP 3 (full tier) as the Bash tool's own background task (run_in_background true, timeout 7200000); open the PR; merge on green with Resolves rec-5675; VP 4.
  - 'Report: what was implemented, verification results'
rollback: Revert the build PR; the run job reads main's checkout, so the revert is live on merge.
