      Node ids unchanged, so graduated
      records telemetry-owner-provisioning-wiring, telemetry-production-deploy-hold-wiring,
      telemetry-twin-gates-production-deploy and telemetry-writer-smoke-gate are kept as they are.
  - file: config/agent/verification_registry/entries/telemetry-writer-packaging.yaml
