bundled_recommendations:
  - rec-4912
followon_recs:
  - rec-4918
  - rec-4919
infrastructure_dependencies: []
acceptance_criteria:
  - rec-4912's acceptance command exits 0.
  - Both channels deploy only through the gate; the gate deploys the newest main commit whose main-validate full-tier step passed and never a commit whose full tier did not pass (VP 1, 2).
  - Deploy records name the deployed commit, and the freshness asserts compare against it, not main HEAD (VP 1, 3).
  - Golden replay checks out the deployed commit and skips after a no-op deploy run; the drift sensor targets the settled green commit and keeps a 6 h HEAD ceiling (VP 4, 5).
  - docs/DECISIONS.md and environment-taxonomy.yaml carry exactly the sidecar's approved words (approved_text verify exits 0), and the warehouse holds the new Decision row after the post-merge backfill.
  - The first post-merge gated runs prove the OIDC sub under workflow_run (the gate's assume succeeds) and a full gated deploy (dispatch, force) ships, smokes and records the gate sha, with golden replay green at that sha.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the gate's unit tests.
    command: bin/venv-python -m pytest tests/ci/test_deploy_gate.py -q
    expected: exit 0, all nodes pass; red before (module absent).
    fix_if: a fast-tier-only or red run counts as green, a rule rolls a function back, or an API error does not exit 2
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: deploy-gate-decisions
  - step: 2
    phase: pre-deploy
    action: Run the wiring tests for the three workflows and the ci.yml names the gate matches.
    command: bin/venv-python -m pytest tests/verify_ci_workflow/test_deploy_gate_wiring.py -q
    expected: exit 0, all nodes pass; red before (file absent, and the channels still trigger on push).
    fix_if: a checkout keeps the default ref, a job does not need gate, or github.sha survives in a channel file
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: deploy-gate-wiring
  - step: 3
    phase: pre-deploy
    action: Prove the deploy record names LAMBDA_ARTIFACT_SHA.
    command: bin/venv-python -m pytest tests/build_lambda_deploy/test_deploy_records.py -q
    expected: exit 0; the new node is red before the build_lambda_deploy.py edit.
    fix_if: the record still names GITHUB_SHA when both are set
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Covered by the existing test file, which --pre selects for build_lambda_deploy.py; step 1's graduated record covers the gate side.
  - step: 4
    phase: pre-deploy
    action: Run the drift-sensor tests.
    command: bin/venv-python -m pytest tests/convergence_health/code_drift/ -q
    expected: exit 0; the target, ceiling and fallback nodes are red before the code_drift.py edit.
    fix_if: a commit newer than the settled green reads as drift, or the ceiling never flags
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Existing suite selected by --pre for code_drift.py; ops-row-rules-wiring already graduates a node of it.
  - step: 5
    phase: pre-deploy
    action: Re-run the existing wiring guards this change edits.
    command: >-
      bin/venv-python -m pytest tests/verify_ci_workflow/test_ducklake_deploy_map_wiring.py
      tests/verify_ci_workflow/test_ducklake_row_rules_wiring.py tests/test_telemetry_golden_replay_workflow.py
      tests/checks/ci_guards/ -q
    expected: exit 0
    fix_if: a graduated wiring node fails (fix the workflow, never weaken the node)
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Standing graduated records (ducklake-deploy-map-coverage, ops-row-rules-wiring, telemetry-golden-replay-workflow-structure) already run these files.
  - step: 6
    phase: pre-deploy
    action: Bind the DECISIONS.md and taxonomy edits to the approved words.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug lambda-deploy-full-tier-gate --base origin/main
      --expect 5ef4d973fc8434bc7abd564bf79d4186782bcfc9c46fd84878d77d4fde196f0d
    expected: exit 0; all eight blocks match
    fix_if: any word differs from the sidecar; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar on every PR declaring this plan.
  - step: 7
    phase: pre-deploy
    action: Read-only live rehearsal of the gate against GitHub and the real deploy records (PlatformDev).
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -m scripts.ci.deploy_gate resolve --channel ducklake --manifest
      "${TMPDIR:-/tmp}/m-ducklake.json" && AWS_PROFILE=agent_platform bin/venv-python -m scripts.ci.deploy_gate
      resolve --channel prod --manifest "${TMPDIR:-/tmp}/m-prod.json"
    expected: >-
      two DEPLOY-GATE lines, each naming a sha whose ci.yml push run's main-validate full-tier step passed (check one
      in the Actions UI) and a reason consistent with the records (at planning both channels' records were aligned,
      ducklake at 5d63b006, prod at 4cfbea16, so no_source_change or source_changed by what merged since)
    fix_if: a GateError (API shape changed), or a sha whose full tier did not pass
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): this command as one backgrounded Bash call with a
      2 h limit from the top-level session.
    command: >-
      bin/venv-python -m pytest tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py -q &&
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate &&
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0; --verify-head reads the full tier's recorded verdict for HEAD, never the backgrounded run's own exit status
    fix_if: a failure in this plan's files is fixed at root and the full tier rerun from the start; another open red's failure follows the implement skill's go/no-go
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      After the squash merge, the merge commit's CI completes and wakes both channels through workflow_run. Prove the
      gate ran under workflow_run and its ci-branch assume succeeded (the OIDC sub under workflow_run is the one the
      deploy role also trusts: ref:refs/heads/main).
    command: >-
      for w in deploy-ducklake-lambdas.yml deploy-prod-lambdas.yml; do curl -fsS
      "https://api.github.com/repos/otl-labs/ontheloop/actions/workflows/$w/runs?event=workflow_run&per_page=1" |
      bin/venv-python -c "import json,sys; r=json.load(sys.stdin)['workflow_runs'][0]; print(r['id'], r['conclusion'],
      r['head_sha'])"; done
    expected: >-
      one workflow_run run per channel created after the merge, each conclusion success, its gate job's assume step
      success and a DEPLOY-GATE line in the log (the session may read the same runs with mcp__github__actions_list).
      The ducklake run skips (no_source_change: the build touches no ducklake path); the prod run deploys
      (source_changed: src/data/handlers/CLAUDE.md is a prod watched path), so the coordinator schedules the build
      merge itself as a prod deploy
    fix_if: >-
      the assume step fails (the sub differs from ref:refs/heads/main -- stop, RCA, no IAM edit without the operator)
      or no run appears (workflow_run did not fire: check the CI run's head_branch and event)
    hermetic: false
  - step: 10
    phase: post-deploy
    action: >-
      Prove a full gated deploy: dispatch deploy-ducklake-lambdas.yml and deploy-prod-lambdas.yml on main with force
      true (a governed CI deploy of an already-green commit; the coordinator schedules it so no other DuckLake deploy
      runs at the same time). Then read the records.
    command: >-
      bin/venv-python -c "import boto3, json; s3 = boto3.Session(profile_name='agent_platform').client('s3');
      print({f: json.loads(s3.get_object(Bucket='agent-platform-data-lake',
      Key=f'deploy-records/{c}/{f}.json')['Body'].read())['source_git_sha'] for c, f in [('ducklake',
      'agent-platform-ducklake-maintenance'), ('ducklake', 'agent-platform-ducklake-telemetry-writer'), ('prod',
      'agent-platform-findings-processor')]})"
    expected: >-
      both dispatched runs green (every smoke job passed); each printed sha equals its run's deploy-manifest sha, which
      is the newest green main commit at dispatch, not necessarily main HEAD
    fix_if: a record names main HEAD instead of the manifest sha (LAMBDA_ARTIFACT_SHA not threaded), or a freshness assert fails
    hermetic: false
  - step: 11
    phase: post-deploy
    action: Golden replay after the forced DuckLake deploy.
    command: >-
      curl -fsS "https://api.github.com/repos/otl-labs/ontheloop/actions/workflows/telemetry-golden-replay.yml/runs?event=workflow_run&per_page=1"
      | bin/venv-python -c "import json,sys; r=json.load(sys.stdin)['workflow_runs'][0]; print(r['id'], r['conclusion'],
      r['head_sha'])"
    expected: conclusion success; its log shows the second checkout at the step-10 manifest sha and the replay module ran
    fix_if: the replay skipped after a deploying run, or checked out main HEAD
    hermetic: false
  - step: 12
    phase: post-deploy
    action: After the next convergence-health tick, confirm no drift rec opened from the gate's lag.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; rd =
      make_reader(profile='agent_platform'); print([r['id'] for s in ('ducklake_code_drift', 'prod_code_drift') for r in
      rd.current_state('ops_recommendations', row_filter=f\"source = '{s}'\") if r.get('status') == 'open'])"
    expected: >-
      prints [] (or only a rec whose context names a real stale function)
    fix_if: a drift rec names functions deployed at the settled green commit (target resolution wrong)
    hermetic: false
  - step: 13
    phase: post-deploy
    action: ETL the new Decision to the warehouse and confirm rec-4912 closed.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md && bin/venv-python -c "import re; from pathlib
      import Path; n=int(re.search(r'^## Decision (\\d+): Lambda code deploys ship only',
      Path('docs/DECISIONS.md').read_text(encoding='utf-8'), re.M).group(1)); from scripts.ops_portal.decisions import
      _fetch_decision_from_reader as g; assert g(f'dec-{n}'), n; from src.common.ducklake_reader_client import
      make_reader, fetch_recs_by_ids; print('POST_MERGE_OK', n, [r['status'] for r in fetch_recs_by_ids(make_reader(),
      ['rec-4912'])[0]])"
    expected: POST_MERGE_OK <n> ['closed']
    fix_if: a missing Decision row after a clean backfill means the entry did not parse; rec-4912 open means the Resolves trailer was missing or refused
    hermetic: false
