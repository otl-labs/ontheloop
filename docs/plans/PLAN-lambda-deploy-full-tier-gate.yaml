constraints:
  - No IAM, trust or Environment change; no terraform/** edit. If the workflow_run OIDC sub is not ref:refs/heads/main, stop (VP 9) and bring it to the operator.
  - Terraform apply stays on push (Decision 77); only the two code-deploy channels move.
  - No agent-reachable ungated deploy path; never add an input that deploys a commit whose full tier has not passed.
  - The gate fails closed on API errors and never falls back to main HEAD; a skip is always a named reason in the log and the manifest (Decision 55).
  - The Decision text, the three annotations and the four taxonomy blocks are operator-approved; place them exactly (sidecar), never re-word. Only {{N}} and {{DATE}} are filled.
  - The word "promotion" is reserved by environment-taxonomy.yaml for a deploy between tiers; repo text calls this a deploy gate.
  - Structural size (Decision 166) and SLOC (Decision 128) are met by extraction, never a raise.
  - No rescue agents or workaround loops (Decision 55).
