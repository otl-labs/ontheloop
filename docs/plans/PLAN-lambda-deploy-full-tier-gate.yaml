schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: lambda-deploy-full-tier-gate
intent: >-
  Production Lambda code ships only main commits whose full tier passed. Today deploy-ducklake-lambdas.yml and
  deploy-prod-lambdas.yml deploy on push in parallel with main-validate (#1680 deployed 17:19Z 2026-10-27; its full
  tier went red 17:44Z), which Decision 73 cl.5 allowed only while the sandbox tier was not production. The operator
  confirmed on 2026-11-05 that it now serves production. Both channels move behind one shared gate that deploys the
  newest main commit whose main-validate full tier passed, and a new numbered Decision (amends Decisions 24, 73 and
  77) records the rule. rec-4874's batched-canary model is the end state; this is its interim slice.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-lambda-deploy-full-tier-gate.yaml
implementation_declared: false
phase: >-
  ad_hoc_rec (soft-warn category; rec-4912 names no tier_item, so the Tier Item Freshness Gate is skipped and
  closes_criteria is empty by construction).
scope:
  - file: scripts/ci/deploy_gate.py
    action: Create
    purpose: >-
      The gate, stdlib only at import (urllib, json, subprocess, argparse); build_lambda_config is imported lazily for
      the channel's function list (ducklake = _build_ducklake_function_zip_keys() keys, prod =
      _build_prod_function_names(); the drift sensor's hardcoded _PROD_FUNCTION_NAMES equals it today and the build
      points the sensor at the same builder). newest_green_sha(api, git, *, limit=50,
      settled_before=None) walks `git rev-list --first-parent -n <limit> origin-or-HEAD` newest first and, for each
      commit, lists `GET /repos/{repo}/actions/workflows/ci.yml/runs?head_sha=<sha>&event=push&branch=main`; a commit
      is green only when a run with that head_sha has conclusion success AND its latest-attempt jobs (`/jobs?filter=latest`)
      hold a job named main-validate with conclusion success whose step named exactly "Validate full tier (ruff, mypy,
      pytest, DQ runner, verifier harness)" concluded success (so a Decision 205 cl.5 fast-tier-only run never counts);
      with settled_before set, the run's updated_at must be at or before it. Commits whose CI is absent, running or red
      are passed over. Any HTTP or JSON error raises GateError (never falls back to HEAD); no green commit within the
      limit returns None. decide(target, records, pathspecs, git, force) applies, in order: (1) any record missing, its
      source_git_sha null, or unresolvable in history -> deploy, reason baseline_unknown; (2) target a strict ancestor
      of any record's sha -> skip, newer_deployed (never roll back); (3) unless force, every record equals target ->
      skip, already_deployed; (4) unless force, `git log -1 --format=%H <target> -- <pathspecs>` equals the same lookup
      from the OLDEST record (the one every other record descends from; records that do not form one ancestry chain
      fall to rule 5) -> skip, no_source_change; (5) deploy, source_changed. Records are read with `aws s3 cp
      s3://agent-platform-data-lake/deploy-records/<channel>/<function>.json -` (the AWS CLI, as the smoke asserts do
      today): a NoSuchKey (absent record) is rule 1, baseline_unknown; AccessDenied or any other `aws s3 cp` failure
      raises GateError. It refuses a shallow clone (git rev-parse --is-shallow-repository), as code_drift does. CLI: `resolve
      --channel ducklake|prod [--force] --manifest PATH` prints `DEPLOY-GATE <deploy|skip> reason=<r> sha=<sha>`,
      writes `sha`, `deploy` (true/false) and `reason` to $GITHUB_OUTPUT when set, writes deploy-manifest.json
      ({channel, sha, deploy, reason, records: {function: sha}, run_id}) and exits 0, or 2 on GateError; no green
      commit -> skip, no_green_in_window, exit 0, with a ::notice:: line (the drift sensor's HEAD ceiling is the
      independent alarm for a gate that never finds green). `freshness --channel C --expected-sha S FN...` replaces the
      four inline deploy-record freshness asserts: exit 1 with the existing DEPLOY_RECORD_STALE message when a record's
      source_git_sha differs from S, else prints OK lines. The repository comes from GITHUB_REPOSITORY (default
      otl-labs/ontheloop), the API base from GITHUB_API_URL, the token from GITHUB_TOKEN or GH_TOKEN (unauthenticated
      reads work on this public repository; a token raises the rate limit).
  - file: .github/workflows/deploy-gate.yml
    action: Create
    purpose: >-
      Reusable workflow (`on: workflow_call` only), name deploy-gate, the single gate both channels call. Inputs
      channel (string, required) and force (boolean, default false); outputs sha, deploy, reason from job gate. Job
      gate: permissions id-token write, contents read, actions read; checkout with fetch-depth 0 (the default ref,
      main HEAD, which is what the walk starts from); ./.github/actions/aws-region; assume
      agent-platform-github-ci-branch (it already reads deploy-records/ for the smoke asserts); setup-python 3.12;
      `pip install pyyaml pydantic`; `python -m scripts.ci.deploy_gate resolve --channel "$CHANNEL"
      ${{ inputs.force && '--force' || '' }} --manifest deploy-manifest.json` with GITHUB_TOKEN set from github.token
      (the boolean input renders as the string "false", so a shell `${FORCE:+--force}` would always force); the assume
      step carries env MASK_AWS_ROLE_ID_ACCOUNT_PART from secrets.AWS_ROLE_ID_ACCOUNT_PART, as the channels' assume
      steps do (validate_actions_account_id_masking); upload deploy-manifest.json as artifact deploy-manifest
      (retention_class governed_deployment, retention-days 7, if: always()). Run bodies stay at most 2 effective lines
      (R3, Decision 162).
  - file: .github/workflows/deploy-ducklake-lambdas.yml
    action: Modify
    purpose: >-
      Triggers become `workflow_run: {workflows: [CI], types: [completed], branches: [main]}` plus `workflow_dispatch`
      with input force (boolean, default false); the push trigger and its paths filter are deleted (the watched paths
      now live only in code_drift.DUCKLAKE_SOURCE_PATHSPECS). Workflow permissions gain actions: read. New first job
      gate: `uses: ./.github/workflows/deploy-gate.yml` with channel ducklake, force `${{ inputs.force || false }}`,
      the `secrets` key set to inherit (the called assume step reads the masking secret), and job-level `permissions: {id-token:
      write, contents: read, actions: read}` (a called workflow can only downgrade the caller's token, so without this
      block the run fails at startup); `if:` for workflow_dispatch only when github.ref == 'refs/heads/main' (as
      telemetry-golden-replay.yml does), or for workflow_run only when github.event.workflow_run.conclusion ==
      'success' && event == 'push' && head_repository.full_name == github.repository. Every other job adds gate to needs; deploy-maintenance and reconcile-gate gain
      `if: needs.gate.outputs.deploy == 'true'` (the other jobs' existing conditions already chain off
      deploy-maintenance). Every actions/checkout step in every job gets `ref: ${{ needs.gate.outputs.sha }}` (the
      default ref under workflow_run is main HEAD, not the gated commit), so reconcile-gate and the telemetry hold read
      the sidecar AT the deployed commit. The four deploy jobs set job env LAMBDA_ARTIFACT_SHA to
      needs.gate.outputs.sha. The four "Assert deploy-record freshness" steps become one-line calls to `python3 -m
      scripts.ci.deploy_gate freshness --channel ducklake --expected-sha "${{ needs.gate.outputs.sha }}" <their same
      functions>`; their names change from "... == github.sha" to "... == gate sha" (nothing keys on those names:
      governed_jobs' critical steps are the assume steps). After the edit the text `github.sha` appears nowhere in the
      file, comments included. Header comment: the trigger paragraph says what wakes it, Decision
      {{N}}, and that a held function catches up when its hold-clearing sidecar change ships. Concurrency stays one
      group, cancel-in-progress false, default queue (a replaced pending run loses nothing: every run deploys the
      newest green). Structural size: 476 of the 500 ci_workflows lines at planning base (Decision 166); measure at
      build and stay under it by these extractions, never a raise.
  - file: .github/workflows/deploy-prod-lambdas.yml
    action: Modify
    purpose: >-
      The same shape for the prod channel: workflow_run of CI plus workflow_dispatch (force), push and paths deleted
      (paths live only in code_drift.PROD_SOURCE_PATHSPECS), actions: read, gate job calling deploy-gate.yml with
      channel prod and the same inherited secrets, job-level permissions and if: (including the dispatch ref guard),
      deploy needs gate with `if: needs.gate.outputs.deploy == 'true'`, smoke needs [gate, deploy], both
      checkouts on the gate sha, LAMBDA_ARTIFACT_SHA on deploy, the freshness assert as a deploy_gate freshness call,
      its step renamed to "== gate sha", the text github.sha nowhere in the file, header comment updated.
  - file: .github/workflows/telemetry-golden-replay.yml
    action: Modify
    purpose: >-
      For a workflow_run event, a step before the second checkout downloads artifact deploy-manifest from the
      triggering run (actions/download-artifact with run-id github.event.workflow_run.id and github-token
      github.token; permissions gain actions: read) and sets outputs replay (manifest deploy == true) and sha; when
      replay is false the remaining steps are skipped and the job is green (a no-op deploy run deployed nothing to
      replay); a successful triggering run with no deploy-manifest artifact fails the job red (never a skip); the second checkout's ref becomes that sha for workflow_run (main HEAD for schedule and dispatch, as
      today). Header comment updated. Decision 236 cl.1's ordering and tagging are unchanged.
  - file: .github/workflows/convergence-health.yml
    action: Modify
    purpose: >-
      The two code-drift steps get `GH_TOKEN: ${{ github.token }}` (the job already holds actions: read) so the sensor
      can resolve the settled green target; header comment for the two sensors updated.
  - file: scripts/convergence_health/code_drift.py
    action: Modify
    purpose: >-
      Target: both detectors compute latest_sha from `git log -1 --format=%H <target> -- <pathspecs>` where target =
      deploy_gate.newest_green_sha(settled_before=now-45 min) instead of HEAD, so the gate's lag and red-main pauses do
      not file drift. Freshness keeps today's equality test first and adds one ancestor case, because the record may
      now be AHEAD of the settled target: fresh when L_R == L_T, or when `git merge-base L_T L_R` prints L_T (L_R = the
      latest watched commit reachable from the record, L_T = the same at the target), read from runner stdout so the
      graduated convergence-drift-reachability-tests oracle still passes; the HEAD ceiling uses the same rule against
      HEAD. The prod detector reads its function list from build_lambda_config._build_prod_function_names() instead of
      the hardcoded _PROD_FUNCTION_NAMES (equal today). Independent ceiling: a function is also stale when its record does not reach HEAD's latest
      watched commit and that commit's committer date is more than 6 h old (a resolver defect cannot silence the
      alarm). GateError or no green -> fall back to HEAD (today's behaviour, fail toward alarming) and say so in the
      rec context. DUCKLAKE_SOURCE_PATHSPECS becomes ("src/lambdas/ducklake_*", "src/common/ducklake_*.py",
      "src/row_rules", "src/telemetry", "config/lambda/ducklake") -- the deleted push globs, so ducklake_maintenance_smoke
      (missed today) is watched; PROD_SOURCE_PATHSPECS keeps its nine entries; their comments say they are the single
      path source for the gate and the sensor. Injectable resolver for tests. Under the 500 SLOC limit.
  - file: scripts/build_lambda_deploy.py
    action: Modify
    purpose: >-
      The deploy record's source_git_sha reads LAMBDA_ARTIFACT_SHA, then GITHUB_SHA, else null (GITHUB_* cannot be
      overridden, and under workflow_run GITHUB_SHA is main HEAD); docstring updated. The S3 artifact namespace already
      uses that precedence.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the approved-text sidecar docs/plans/approved/lambda-deploy-full-tier-gate.yaml: blocks decision-entry
      (the new Decision; {{N}} = next free number at build, 246 at planning; {{DATE}} = build date),
      decision-73-annotation, decision-77-annotation and decision-24-annotation. The decisions index is a generated
      companion.
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks taxonomy-amendment-log (the new amendment_log entry, governance_note_add),
      taxonomy-sandbox-row, taxonomy-code-deploy-gating and taxonomy-mock-vs-real-note; nothing else in the file
      changes.
  - file: docs/contracts/build-lambda.yaml
    action: Modify
    purpose: >-
      deploy_channels.ducklake_functions and prod_functions governed_channel comments: "push-to-main (... source
      paths) or workflow_dispatch" becomes "wakes on each completed CI push run on main and deploys the newest main
      commit whose full tier passed (Decision {{N}}; .github/workflows/deploy-gate.yml, scripts/ci/deploy_gate.py;
      watched paths = scripts.convergence_health *_SOURCE_PATHSPECS), or workflow_dispatch (same target, force
      redeploys it)". The mechanism text also says the workflow files and scripts/ci/deploy_gate.py both run at main
      HEAD while the deployed code is the gate sha. This file holds the mechanism; deploy-paths.yaml points here. One amendment_log row
      (governance_note_add).
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Navigation only (Decision 126 cl.2): deploy_code.recovery gains one sentence -- RED MAIN: code deploys pause
      until a later main commit's full tier passes (Decision {{N}}); the red's repair (Decision 226) is the recovery,
      workflow_dispatch redeploys the newest green commit, and break_glass_only stays the only ungated route
      (build-lambda.yaml#deploy_channels). One amendment_log row. The file is at 492 of 500 effective lines: the
      sentence plus the row must fit the headroom left at build time (PLAN-telemetry-content-reader-lock also scopes
      this file); if they do not, tighten existing deploy_code prose, never raise the budget, and keep the literals
      "TELEMETRY PRODUCTION COLUMN HOLD" and "provision_telemetry_catalog" in deploy_code.recovery (a graduated node
      asserts them).
  - file: docs/contracts/github-actions-evidence.yaml
    action: Modify
    purpose: >-
      governed_jobs gains deploy-gate.yml job gate (critical step: its assume-role step, diagnostic id
      ACTIONS_DEPLOY_GATE_GATE); artifact_uploads gains the deploy-manifest upload (retention_class per the file's
      taxonomy for a cross-run handoff read by telemetry-golden-replay); amendment_log row (field_add).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      workflows map gains deploy-gate (validate_ci_rca_adjudication needs every workflow name): tier not_a_gate,
      ci_rca excluded, rationale "workflow_call only; it never runs alone, and its failures are failures of the two
      watched caller runs". The ci-rca.yml filter is unchanged. The file is at 490 of 500 effective lines; the row is
      at most four lines, and if other plans landing first leave less headroom, compact rather than raise.
  - file: src/data/handlers/CLAUDE.md
    action: Modify
    purpose: >-
      The routine deploy channel paragraph says what wakes it and what it deploys (Decision {{N}}), not push-to-main.
      The file has zero prose headroom (3717 of 3717 B, prose ratchet): the replacement is no longer than the text it
      replaces, and a shrink lowers the entry with the budget tool.
  - file: scripts/ducklake_smoke/lambda_telemetry_golden_gates.py
    action: Modify
    purpose: >-
      deploy_paths() reads triggers["push"]["paths"] from deploy-ducklake-lambdas.yml, which this change deletes (a
      KeyError on every replay); it returns list(code_drift.DUCKLAKE_SOURCE_PATHSPECS) instead, the same watched set.
      records_skewed and every other function are unchanged.
  - file: tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py
    action: Modify
    purpose: >-
      The deploy_paths node asserts it equals DUCKLAKE_SOURCE_PATHSPECS (red before: KeyError once the push trigger is
      gone); graduated records golden-replay-asserts-catalog-before-registration and telemetry-golden-replay-over-fakes
      are kept as they are (their nodes are unchanged).
  - file: config/agent/verification_registry/entries/ducklake-deploy-job-topology.yaml
    action: Modify
    purpose: >-
      The asserted job set gains 'gate' and the command also asserts every other job lists gate in needs (a stronger
      check; the existing assertions stay).
  - file: tests/ci/test_deploy_gate.py
    action: Create
    purpose: >-
      Fixture git repo (linear and merge histories) plus a fake API object, in-process through main(argv): newest
      green picks the newest first-parent commit whose main-validate full-tier step passed; a run whose main-validate
      succeeded with the full-tier step skipped or absent is not green; a red, running or missing run is passed over;
      a PR-event run is ignored; settled_before excludes a just-finished run; an HTTP error raises GateError (CLI exit
      2); none green -> no_green_in_window skip; decide rules 1-5 each, never rolling back, force bypassing 3-4 but
      never 1-2; the oldest-record anchor under a hold (serving records older than maintenance); manifest and
      GITHUB_OUTPUT contents; shallow clone refused; freshness exit 1 naming DEPLOY_RECORD_STALE and exit 0 when
      fresh (aws CLI stubbed on PATH).
  - file: tests/verify_ci_workflow/test_deploy_gate_wiring.py
    action: Create
    purpose: >-
      Parses the three workflows: both channels' triggers are exactly workflow_run (workflows [CI], types completed,
      branches main) and workflow_dispatch with input force; no push key; the gate job uses ./.github/workflows/
      deploy-gate.yml with the right channel and the success/push/same-repository condition; every other job needs
      gate; every actions/checkout step outside deploy-gate.yml has ref needs.gate.outputs.sha; deploy jobs set
      LAMBDA_ARTIFACT_SHA from it; the text "github.sha" appears in neither channel file; permissions include actions
      read; deploy-gate.yml is workflow_call-only with outputs sha/deploy/reason and uploads deploy-manifest; ci.yml
      still has job main-validate with the exact full-tier step name deploy_gate.py matches, whose run is
      `python -m scripts.validate` with no `--pre` and no `if:` (so an in-step fast-tier switch cannot pass); each
      caller gate job inherits secrets and carries permissions {id-token: write, contents: read, actions: read}, and
      its dispatch branch requires refs/heads/main; deploy-gate.yml passes --force only through
      `inputs.force && '--force' || ''`; each deleted push glob
      (literal list frozen in the test) is matched by the channel's pathspecs; no pathspec matches a docs/plans/ path.
  - file: tests/build_lambda_deploy/test_deploy_records.py
    action: Modify
    purpose: A record written with LAMBDA_ARTIFACT_SHA and a different GITHUB_SHA names LAMBDA_ARTIFACT_SHA; GITHUB_SHA alone still works; neither -> null.
  - file: tests/convergence_health/code_drift/test_ducklake.py
    action: Modify
    purpose: >-
      Target is the settled green commit (a commit after it is not drift); the 6 h HEAD ceiling still flags; resolver
      failure falls back to HEAD; a record AHEAD of the settled target is fresh (red before: equality-only reads it
      stale), for both target and ceiling; ducklake_maintenance_smoke paths are watched;
      test_telemetry_writer_source_directory_is_watched and test_telemetry_reader_source_directory_is_watched assert
      their directories are matched by the src/lambdas/ducklake_* pathspec instead of literal tuple entries. test_pathspecs_include_row_rules keeps
      its node id (graduated record ops-row-rules-wiring).
  - file: tests/convergence_health/code_drift/test_prod.py
    action: Modify
    purpose: >-
      The same target, ceiling, record-ahead and fallback cases for the prod detector, and its function list comes
      from _build_prod_function_names().
  - file: tests/verify_ci_workflow/test_ducklake_deploy_map_wiring.py
    action: Modify
    purpose: >-
      test_deploy_push_paths_include_src_telemetry becomes test_deploy_watched_paths_include_src_telemetry, asserting
      the path through DUCKLAKE_SOURCE_PATHSPECS (the push filter is gone). Two helper-level edits keep the same
      invariants: _freshness_set parses the function arguments of the `deploy_gate freshness` calls instead of the
      deleted `for fn in ...; do` loops (test_each_leg_deploys_exactly_what_its_smoke_job_checks and
