schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: last-green-batched-full-tier-decision
intent: >-
  Land rec-4874's design as one Decision (build plan 1 of six): the full tier runs post-merge on batches of main, a
  red batch is narrowed to its culprit by a deterministic job, code deploys take the newest commit a passing run
  covers (the last-green ref), and a red pauses deploys but never merging. Dated notes align the eleven amended
  Decisions and the SIT Decision, the taxonomy reserves the term, and five child recs carry builds 2-6, so the build
  that follows is planned against ratified text (NS.9).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-last-green-batched-full-tier-decision.yaml
phase: >-
  rec-4874 (ad_hoc_rec; no tier_item names it). Build plan 1 of the design merged as #1946
  (PLAN-last-green-batched-full-tier-design). Closes no exit criterion; rec-4874 stays open until build plan 5.
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Every DECISIONS.md block of the sidecar: decision-new (the new Decision, above the newest entry, anchored on the
      file's preamble) and decision-{72,73,159,163,201,203,205,226,244,245,249}-note (one "Amended by Decision N"
      note each; 245's and 249's also record their reversal condition firing) and decision-252-note (an Update reading
      cl.6 as a necessary condition). The 73 and 249 notes sit directly above the SIT Decision's note; every other note
      is the entry's last annotation. At build N = max Decision number across DECISIONS.md and DECISIONS_ARCHIVE.md +
      1; {{DATE}} = build date UTC.
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks taxonomy-vocabulary (a last_green_ref row, apart from promotion) and taxonomy-log
      (one amendment_log row).
  - file: tests/checks/decisions/test_last_green_decision_records.py
    action: Create
    purpose: >-
      Pin the build's records without pinning position (the rec-5095 class): the number from the heading regex, the
      envelope (number, status, amends list, kind direction), the entry within cap_bytes(), no placeholder left, cl.9
      naming the five child recs; exactly one "Amended by Decision N (" paragraph in each of the eleven amended
      entries, 245's and 249's naming their fired condition ids; exactly one Update on 252 naming Decision N, a
      necessary condition and rec-5033; the taxonomy's last_green_ref row. Text in execution step 4.
bundled_recommendations: []
followon_recs: [rec-5106, rec-5107, rec-5108, rec-5109, rec-5110]
infrastructure_dependencies:
  - >-
    None. No .tf file, workflow, Lambda-packaged file or IAM is in scope; nothing is applied or deployed.
    compute_affected_artifacts over the scope returns no artifact.
acceptance_criteria:
  - The build tree holds exactly the sidecar's words in DECISIONS.md and the taxonomy (approved_text verify exits 0).
  - The three tests in tests/checks/decisions/test_last_green_decision_records.py fail on main and pass on the build.
  - tests/checks/decisions/test_sit_decision_records.py stays green (the SIT notes stay last on 73 and 249).
  - After merge, the decisions index holds the new Decision (rec-autoclose backfill) and the five child recs read open.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Premises, run first: the Decision clauses the new entry amends still read as the design cited them, and the
      taxonomy term is still absent (the design plan's VP 3 and 4).
    command: >-
      bin/venv-python -c "import pathlib,yaml; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      b=lambda n: t[t.index('## Decision %d:' % n):t.index(chr(10) + '## Decision ', t.index('## Decision %d:' % n) + 10)];
      v=yaml.safe_load(open('docs/contracts/environment-taxonomy.yaml'))['vocabulary'];
      print('d72=' + str('does NOT propose or execute any autonomous fix' in b(72)) + ' d245=' + str('id: tap-promotion-lands' in b(245)) + ' d249=' + str('id: canary-model-decided' in b(249)) + ' d226=' + str('a manual revert PR of the culprit is permitted when the fix is not obvious' in b(226)) + ' d252=' + str('promotion uses' + chr(10) + '   rec-4874' in b(252) or 'promotion uses rec-4874' in b(252)) + ' term_absent=' + str('last_green_ref' not in v))"
    expected: >-
      One line, every field True (d72, d245, d249, d226, d252, term_absent), run on the build's base before placing any
      text.
    fix_if: >-
      A False means a premise moved (a later Decision edited the cited text, or the term landed elsewhere): stop and
      send a plan-defect report; the wording goes back to the operator (Decision 246 cl.2).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Red-before premise evidence that this build itself makes false (term_absent); step 2's test is the standing guard.
  - step: 2
    phase: pre-deploy
    action: Pin the new Decision, its notes and the taxonomy term.
    command: bin/venv-python -m pytest tests/checks/decisions/test_last_green_decision_records.py -q
    expected: exit 0, three tests passed
    fix_if: >-
      A note is missing, duplicated or cites the wrong number, or a string differs from the sidecar: fix the placement,
      never the sidecar or the test's expectations.
    hermetic: true
    expected_literals: ["3 passed"]
    graduation: waive
    graduation_waiver_reason: >-
      The new file is itself the standing guard and runs in every --pre pytest selection touching DECISIONS.md or the
      taxonomy; a registry row would duplicate it.
  - step: 3
    phase: pre-deploy
    action: The SIT Decision's records stay green with the new notes on 73 and 249.
    command: bin/venv-python -m pytest tests/checks/decisions/test_sit_decision_records.py -q
    expected: exit 0
    fix_if: >-
      The 73 or 249 note was placed after the SIT note: place it directly above, as the sidecar does. Never edit that
      file (another project's).
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: An existing test file run unchanged; it is already a standing guard.
  - step: 4
    phase: pre-deploy
    action: Bind the edits to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug last-green-batched-full-tier-decision --base origin/main
    expected: exit 0; every block matches with only {{N}} and {{DATE}} filled
    fix_if: any word differs; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar
      on every PR declaring this plan.
  - step: 5
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy), backgrounded with a 2 h limit from the top-level
      session.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: --pre exit 0; validation_result --verify-head exit 0 for HEAD
    fix_if: >-
      A failure in this plan's files: fix at root and rerun from the start. Decision size or glossary failures mean the
      placed text differs from the sidecar (the sidecar passed both at planning). A failure only in another open red is
      not this build's to fix; follow the implement skill's go/no-go.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: Confirm the Decision reached ops_decisions and the five child recs are open.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && grep -c "\"dec-$(grep -oE '^## Decision [0-9]+: The full tier runs
      post-merge' docs/DECISIONS.md | grep -oE '[0-9]+')\"" logs/.decisions-index.jsonl && bin/venv-python -c "from
      src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows, missing = fetch_recs_by_ids(make_reader(),
      ['rec-5106', 'rec-5107', 'rec-5108', 'rec-5109', 'rec-5110']); assert not missing and all(r['status'] == 'open' for r in rows), (rows, missing); print(len(rows))"
    expected: a count of at least 1, then 5
    fix_if: >-
      count 0: read the rec-autoclose run for the merge commit (its backfill step). A child rec missing or not open:
      report it; never re-file (the Decision names the ids).
    hermetic: false
test_obligations:
  - source: docs/DECISIONS.md
    behavior: The new Decision lands within the cap with its envelope, and each amended entry carries exactly one note citing its number.
    verification_step: 2
    test_selector: tests/checks/decisions/test_last_green_decision_records.py::test_each_amended_entry_carries_one_dated_note
    red_green_expectation: red before (no heading on main), green after.
  - source: docs/contracts/environment-taxonomy.yaml
    behavior: The vocabulary reserves last_green_ref apart from promotion.
    verification_step: 2
    test_selector: tests/checks/decisions/test_last_green_decision_records.py::test_taxonomy_reserves_last_green_ref_apart_from_promotion
    red_green_expectation: red before (no last_green_ref row), green after.
constraints:
  - The DECISIONS.md and taxonomy words are operator-approved; place them exactly (sidecar), never re-word.
  - No code, workflow, infrastructure or IAM change; nothing is applied or deployed. Builds 2-6 are their own plans.
  - Never edit tests/checks/decisions/test_sit_decision_records.py (another project's file).
  - No rescue agents or workaround loops (Decision 55).
