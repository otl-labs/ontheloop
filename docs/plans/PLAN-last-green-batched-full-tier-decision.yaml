execution_steps:
  - "Anchors first: re-run plan_wording_check against current main. The build cannot edit its own sidecar (validate_merge_step reads it at the base). If only anchor words drifted (a note anchor no longer its entry's last line, or the 73 or 249 SIT note no longer last), stop, send a plan-defect report, and let the planning thread merge a sidecar-only scope-amendment PR that re-anchors; the approved-words digest is unchanged, so the approval holds (Decision 246 cl.2-3). If removed words drifted, the wording goes back to the operator."
  - "Run VP step 1 on the rebased base before placing anything."
  - "Place every sidecar block exactly (docs/plans/approved/last-green-batched-full-tier-decision.yaml); N = max Decision number + 1, {{DATE}} = build date UTC; regenerate docs/decisions-index.json with the repo's generator."
  - |-
    tests/checks/decisions/test_last_green_decision_records.py: create it with exactly this content, then confirm each
    test fails on main first (no heading, no notes, no vocabulary row):

      """The batched full tier and last-green ref Decision (rec-4874 build plan 1): entry, envelope, dated notes, taxonomy term.

      Growth-safe by design: the number comes from the heading, and nothing pins heading order, the newest entry or a
      note's position, so a later Decision or a later note on the same entries never turns this red (rec-5095's class).
      """

      from __future__ import annotations

      import re
      from pathlib import Path

      import pytest
      import yaml

      from tests.fixtures.decision_entry import authored_bytes, cap_bytes, decision_entry

      pytestmark = pytest.mark.unit

      _REPO = Path(__file__).resolve().parents[3]
      _HEADING = re.compile(r"^## Decision (\d+): The full tier runs post-merge on batches of main", re.MULTILINE)
      _AMENDS = [72, 73, 159, 163, 201, 203, 205, 226, 244, 245, 249]
      _FIRED = {245: "tap-promotion-lands", 249: "canary-model-decided"}
      _CHILD_RECS = 5


      def _decisions_text() -> str:
          return (_REPO / "docs/DECISIONS.md").read_text(encoding="utf-8")


      def _number(text: str) -> int:
          match = _HEADING.search(text)
          assert match is not None, "the batched full tier Decision heading must exist"
          return int(match.group(1))


      def _paragraphs(entry: str, prefix: str) -> list[str]:
          return [p for p in entry.split("\n\n") if p.startswith(prefix)]


      def test_decision_entry_and_envelope() -> None:
          text = _decisions_text()
          number = _number(text)
          entry = decision_entry(text, number)
          assert authored_bytes(entry) <= cap_bytes()
          envelope = yaml.safe_load(re.search(r"```yaml\n(.*?)\n```", entry, re.DOTALL).group(1))
          assert envelope["number"] == number and envelope["status"] == "Decided"
          assert envelope["amends"] == _AMENDS and envelope["kind"]["value"] == "direction"
          assert "{{" not in entry and not re.search(r"rec-P\d", entry)
          coverage = entry[entry.index("9. **Coverage") : entry.index("```yaml reversal-conditions")]
          assert len(set(re.findall(r"rec-\d+", coverage)) - {"rec-5019"}) == _CHILD_RECS


      def test_each_amended_entry_carries_one_dated_note() -> None:
          text = _decisions_text()
          number = _number(text)
          for amended in _AMENDS:
              notes = _paragraphs(decision_entry(text, amended), f"> **Amended by Decision {number} (")
              assert len(notes) == 1, (amended, len(notes))
              if amended in _FIRED:
                  assert _FIRED[amended] in notes[0], amended
          sit = [p for p in _paragraphs(decision_entry(text, 252), "> **Update (") if f"Decision {number} " in p]
          assert len(sit) == 1 and "necessary condition" in sit[0] and "rec-5033" in sit[0]


      def test_taxonomy_reserves_last_green_ref_apart_from_promotion() -> None:
          doc = yaml.safe_load((_REPO / "docs/contracts/environment-taxonomy.yaml").read_text(encoding="utf-8"))
          term = doc["vocabulary"]["last_green_ref"]
          assert "full tier" in term["reserved_meaning"] and "promotion" in term["do_not_use_for"]
          assert "deploy tier" in doc["vocabulary"]["promotion"]["reserved_meaning"]
  - "Execute Verification Plan steps 2-4 (step 1 ran before placement); loop until pass; on an unrecoverable failure stop and send a plan-defect report (Decision 55)."
  - "Run the code-review gate on the diff; fix its blocking findings and re-run steps 2-4."
  - "Commit (flip implementation_declared to true in this plan; no Resolves trailer, since rec-4874 stays open until build plan 5), rebase on origin/main (a newer Decision means renumbering N and re-running steps 2-4), run VP step 5 on the committed clean HEAD, push, open the build PR, and squash-merge on code review PROCEED and green CI under standing authorisation once validate_merge_step reads the operator's approval of the sidecar."
  - "After merge run step 6."
  - "Report, as separate facts: what was implemented and the Decision number; the red-before output of the new test on main (all three failing) and its green output on the build; the full-tier exit plus validation_result --verify-head for the pushed HEAD; structured postflight evidence (scripts.session.postflight --evidence); the push, PR number, CI result and merge SHA; step 6's read-back."
rollback: Revert the squash commit; nothing was applied or deployed.
