  - "Live assumption UNPROVEN: GitHub's pending-run replacement in a non-cancelling group (docs only; build plan 3 proves it)."
  - "fork: culprit remedy on main | chosen: CI opens, never merges, a revert PR for Track B culprits outside terraform/** and deploy paths | class: asked | precedent: operator decision card 2026-11-09 | precedent_kind: none | reversible: yes | persisted: report 3.4, Decision draft cl.3"
