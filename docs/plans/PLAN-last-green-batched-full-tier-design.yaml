schema_version: 5
slug: "last-green-batched-full-tier-design"
intent: >-
  Design, for rec-4874, the end-state CI model: the fast tier is the only presubmit, the full tier runs on adaptive
  batches of main with automated culprit finding, and a last-green ref derived from passing runs is what code deploys
  consume, so a red pauses deploys and never blocks merging. The report carries the Decision draft and sketches the
  atomic plans that would build it; it files none.
  Cheaper, faster merges with production gated on a full-tier pass serve the self-improvement loop's throughput.
plan_type: REPORT-ONLY
verification_tier: V1
plan_path: docs/plans/PLAN-last-green-batched-full-tier-design.yaml
phase: >-
  rec-4874 (ad_hoc_rec; no tier_item names it). Itinerary item C3 of the Agents in GitHub workstream: design only now;
  its build later retires rec-5019's interim per-PR full tier and re-scopes Decisions 245 and 249. Closes no exit
  criterion.
scope:
  - file: docs/plans/PLAN-last-green-batched-full-tier-design.yaml
    action: Create
    purpose: >-
      The planning artefact: premise evidence for the design (VP), the fork record and its provenance (context), and
      the constraints that keep this plan design-only.
  - file: docs/plans/reports/REPORT-last-green-batched-full-tier-design.md
    action: Create
    purpose: >-
      The REPORT-ONLY deliverable (Decision 86; report-deliverables route): batch vehicle, last-green ref, culprit
      step, remediation, what a red blocks, presubmit end state with a pre-registered retirement measure, Decision 245
      narrowing, range-aware consumers, options not taken, rec dispositions, the Decision draft, the six-plan
      decomposition and known gaps.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    Every premise the design changes is shown as today's state: main-validate has no concurrency group and Main
    Canary runs on its 3-hourly cron (VP 1); the deploy gate keys on head_sha equality inside a 50-commit window,
    vacuous_pass diffs HEAD^, ci-rca's job wakes on failure and never on cancelled or timed_out, push_context_base
    reads GITHUB_EVENT_BEFORE and falls back to HEAD~1, and both deploy channels wake only on success (VP 2).
  - >-
    The Decision text the design amends holds as cited: Decision 72 still forbids the ci-rca agent any autonomous
    fix, Decision 245 carries tap-promotion-lands, Decision 249 carries canary-model-decided, and Decision 226 still
    excludes automated revert and limits a revert PR to a manual one when the fix is not obvious (VP 3).
  - >-
    The vocabulary and acceptance premises hold: the taxonomy reserves promotion for a deploy between tiers and does
    not yet carry last-green, and neither rec-4874's named acceptance test nor its renamed successor exists (VP 4).
  - >-
    The report carries all sixteen sections, its Decision draft text stays within 4,700 bytes (room for the envelope
    under the 6,144-byte entry cap) and names the eleven amended Decisions (72, 73, 159, 163, 201, 203, 205, 226, 244,
    245, 249), it is ASCII, and it never uses "promotion ref" for the single-tier mechanism (VP 5).
  - The plan validates against the PlanDocument schema (VP 6).
  - The branch changes exactly the plan and report files (VP 7), and the fast tier passes on the branch (VP 8).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the batch vehicle and the canary skip are unbuilt
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('.github/workflows/ci.yml'));
      c=yaml.safe_load(open('.github/workflows/main-canary.yml')); on=c.get('on', c.get(True));
      print('main_validate_concurrency=' + str(d['jobs']['main-validate'].get('concurrency')) + ' canary_cron=' + ','.join(s['cron'] for s in on['schedule']))"
    expected: One line showing main-validate has no concurrency group and Main Canary runs on its 3-hourly cron.
    fix_if: >-
      A concurrency group or a changed cron means the vehicle (report 3.1) or the canary cadence (rec-4233) moved;
      re-ground report 3.1 before relying on it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for build plan 3, true only until that plan adds the concurrency group; a standing guard
      would block the sanctioned change.
    expected_literals: ["main_validate_concurrency=None canary_cron=0 */3 * * *"]
  - step: 2
    phase: pre-deploy
    action: Prove the per-push consumers the design makes range-aware still assume one run per push
    command: >-
      bin/venv-python -c "import pathlib as P; g=P.Path('scripts/ci/deploy_gate.py').read_text();
      v=P.Path('scripts/ci_rca/vacuous_pass.py').read_text(); r=P.Path('.github/workflows/ci-rca.yml').read_text();
      c=P.Path('scripts/checks/_common.py').read_text(); import yaml; i=yaml.safe_load(r)['jobs']['rca']['if'];
      s=chr(39) + 'success' + chr(39); d=[P.Path('.github/workflows/' + n).read_text() for n in ('deploy-ducklake-lambdas.yml', 'deploy-prod-lambdas.yml')];
      print('gate_head_sha_equality=' + str('run.get(\"head_sha\") != sha' in g) + ' gate_window=' + str('limit: int = 50' in g) + ' vacuous_head_parent=' + str('HEAD^' in v) + ' rca_failure_only=' + str('conclusion == ' + chr(39) + 'failure' + chr(39) in i and 'cancelled' not in i and 'timed_out' not in i) + ' base_event_before=' + str('GITHUB_EVENT_BEFORE' in c) + ' base_head_tilde=' + str('HEAD~1' in c) + ' deploy_success_only=' + str(all('workflow_run.conclusion == ' + s in x for x in d)))"
    expected: >-
      One line: the deploy gate compares a run's head_sha for equality inside a 50-commit window, vacuous_pass diffs
      against HEAD^, ci-rca's job is gated on a failure conclusion and never on cancelled or timed_out,
      push_context_base reads GITHUB_EVENT_BEFORE and falls back to HEAD~1, and both deploy channels wake on success.
    fix_if: >-
      Any False means a consumer in report 3.1, 3.2 or 3.8 already changed; re-read it and re-ground that section.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for build plans 2-4, which change exactly these lines; a standing guard would block them.
    expected_literals: ["gate_head_sha_equality=True gate_window=True vacuous_head_parent=True rca_failure_only=True base_event_before=True base_head_tilde=True deploy_success_only=True"]
  - step: 3
    phase: pre-deploy
    action: Prove the Decision clauses the draft amends hold as the report cites them
    command: >-
      bin/venv-python -c "import pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8');
      b=lambda n: t[t.index('## Decision %d:' % n):t.index(chr(10) + '## Decision ', t.index('## Decision %d:' % n) + 10)];
      print('d72_no_autonomous_fix=' + str('does NOT propose or execute any autonomous fix' in b(72)) + ' d245_tap=' + str('id: tap-promotion-lands' in b(245)) + ' d249_canary=' + str('id: canary-model-decided' in b(249)) + ' d226_no_auto_revert=' + str('Automated revert stays excluded' in b(226)) + ' d226_manual_not_obvious=' + str('a manual revert PR of the culprit is permitted when the fix is not obvious' in b(226)))"
    expected: >-
      One line: Decision 72 still forbids the ci-rca agent any autonomous fix, Decision 245's tap-promotion-lands and
      Decision 249's canary-model-decided reversal conditions exist, and Decision 226 still excludes automated revert
      and permits only a manual revert PR when the fix is not obvious.
    fix_if: >-
      A False means the cited text moved (a later Decision or annotation); re-read it and re-ground report 3.4, 3.7
      and section 6 before the Decision-landing plan.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The Decision-landing plan amends exactly this text; validate_supersession_annotations already guards amended
      entries once it lands.
    expected_literals: ["d72_no_autonomous_fix=True d245_tap=True d249_canary=True d226_no_auto_revert=True d226_manual_not_obvious=True"]
  - step: 4
    phase: pre-deploy
    action: Prove the vocabulary reservation and that rec-4874's acceptance test does not exist yet
    command: >-
      bin/venv-python -c "import pathlib,yaml; p='docs/contracts/environment-taxonomy.yaml';
      v=yaml.safe_load(open(p))['vocabulary']; t=pathlib.Path(p).read_text();
      print('promotion_reserved=' + str('deploy tier' in v['promotion']['reserved_meaning']) + ' last_green_listed=' + str('last-green' in t or 'last_green' in t) + ' old_test_absent=' + str(not pathlib.Path('tests/ci/test_promotion_ref.py').exists()) + ' new_test_absent=' + str(not pathlib.Path('tests/ci/test_last_green_ref.py').exists()))"
    expected: >-
      One line: promotion is reserved for a deploy between tiers, last-green is not yet in the taxonomy, and neither
      test file exists.
    fix_if: >-
      last_green_listed=True or a test file present means a build plan landed; withdraw the matching report step.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Red-before evidence for build plans 1 and 4; the taxonomy reservation itself is guarded by the contract.
    expected_literals: ["promotion_reserved=True last_green_listed=False old_test_absent=True new_test_absent=True"]
  - step: 5
    phase: pre-deploy
    action: Prove the report's structure, Decision draft size and amends list, ASCII text and vocabulary
    command: >-
      bin/venv-python -c "import pathlib,re; t=pathlib.Path('docs/plans/reports/REPORT-last-green-batched-full-tier-design.md').read_text(encoding='utf-8');
      H=['## 1. Problem and goal','## 2. Vocabulary','### 3.1 Batch vehicle','### 3.2 The last-green ref','### 3.3 Culprit step','### 3.4 Remediation','### 3.5 What a red blocks','### 3.6 Presubmit end state','### 3.7 Decision 245','### 3.8 Range-aware consumers','### 3.9 Deploys and Terraform','## 4. Options considered','## 5. Existing recs','## 6. Decision draft','## 7. Decomposition','## 8. Known gaps'];
      s=t.index(chr(96)*3 + 'text'); e=t.index(chr(96)*3, s + 7); d=t[s + 8:e];
      a=re.search(r'amends Decisions ([0-9, and\n]+)\)', d).group(1);
      print('sections=' + str(sum(h in t for h in H)) + '/16 decision_bytes_ok=' + str(len(d.encode()) <= 4700) + ' amends=' + ','.join(re.findall(r'\d+', a)) + ' ascii=' + str(t.isascii()) + ' bare_promotion_ref=' + str(t.count('promotion ref')))"
    expected: >-
      One line: all sixteen sections present, the Decision draft text within 4,700 bytes, the eleven amended Decisions
      in order, ASCII only, and no use of "promotion ref".
    fix_if: Restore the missing section, trim the draft, or correct the amends list or wording.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A moment claim (Decision 244 cl.4; vp-red-before rubric): an exact section set and an exact amends set at this
      plan's merge, which a sanctioned revision of the report may change; the landing plan re-checks the Decision
      itself through validate_decisions_size.
    expected_literals: ["sections=16/16 decision_bytes_ok=True amends=72,73,159,163,201,203,205,226,244,245,249 ascii=True bare_promotion_ref=0"]
  - step: 6
    phase: pre-deploy
    action: Validate this plan against the PlanDocument schema
    command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-last-green-batched-full-tier-design.yaml
    expected: The validator reports the plan valid and exits 0.
    fix_if: Fix the reported field (unknown key, missing graduation companion, backtick literal in expected).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_plan_documents already schema-checks every docs/plans/PLAN-*.yaml in both tiers; a per-plan row
      duplicates it.
  - step: 7
    phase: pre-deploy
    action: Confirm the change is exactly the plan and report files
    command: git fetch --quiet origin main && git diff --name-only origin/main...HEAD
    expected: >-
      Exactly two paths: this plan and docs/plans/reports/REPORT-last-green-batched-full-tier-design.md.
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Run the fast presubmit tier over the branch
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: Address the reported issue in the plan or report file.
    hermetic: false
    graduation: not-applicable
constraints:
  - >-
    Design only: no code, workflow, contract, roadmap or DECISIONS.md edit, no rec filed, closed or updated, no
    criterion flipped. The Decision draft lands only through build plan 1 with its wording approved on GitHub
    (Decision 246), after the SIT Decision (PR #1936) merges, as agreed with the CI Reform project.
  - Child recs for build plans 2-6 are filed by build plan 1, not now (Decision 247; no orphans if the wording moves).
  - No new standing prose doc (Decision 86); the report is a REPORT-ONLY deliverable.
  - No rescue agents or workaround loops (Decision 55).
