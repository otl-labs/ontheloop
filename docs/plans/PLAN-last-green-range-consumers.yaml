constraints:
  - "Behaviour-neutral where HEAD^'s main-validate ran the full tier: ci-rca's range is the head alone, vacuous_pass diffs HEAD^..HEAD, and nothing sets FULL_TIER_PREV, so push_context_base runs today's path. Every non-CI watched workflow, and a ci-rca run whose checkout predates range_context.py, keeps the HEAD^ diff; a ci range step that crashes passes an empty range (abstain), never HEAD^."
  - "scripts/ci/deploy_gate.py is not edited: it keeps newest_green_sha (push, latest attempt; Decision 249 cl.2) and its stdlib-only import test until rec-5108; last_green.py imports from it, and last_green_sha is not wired into any deploy channel here."
  - "Validate makes no GitHub API call: push_context_base reads only the two variables; resolving and widening prev are the job's (rec-5107) or ci-rca's."
  - "The v2 fingerprint is unchanged (Decision 142 cl.1); no open rec is migrated or re-keyed."
  - "The selection manifest stays the head commit's PR; escape_class is never dropped here (Decision 186's closure obligation keeps its reach)."
  - "ci-rca.yml: no existing inline body grows past its composite_action_body_baseline.yaml row (Decision 162 R3, Decision 165); new logic lives in scripts/ci_rca/range_context.py."
  - "docs/contracts/full-tier-range.yaml lands word for word as docs/plans/approved/last-green-range-consumers.yaml binds it (Decision 246); git-ops.yaml and ci-rca-lifecycle.yaml are not edited (497 and 499 of 500)."
  - "Out of scope, build plan 2b (rec-5106): the trailer census, junit verdict and closure over a range, scripts/rec_trailer_acceptance*.py, scripts/session/merge_step.py and git-ops.yaml. Out of scope, rec-5107: ci.yml main-validate (concurrency, the prev step that sets FULL_TIER_PREV and FULL_TIER_LAST_GREEN, the recorded range)."
  - "A workflow_dispatch re-diagnosis checks out main's tip, not the failing head, so CI_RCA_RANGE_PREV..HEAD also spans later commits; today's HEAD^..HEAD is already wrong there. Diffing prev..<run head> is out of scope here and is a third cl.4 leg rec-5107 owns (Decision 181 cl.2; recorded by execution step 1, and named in 2b's cl.9 annotation)."
  - "Runner assumption (Linux runners, inferred): an env: entry whose expression is empty is exported set but empty; the range step logs diff_base= so the first unresolved ci range's log confirms vacuous_pass abstained."
  - "No rescue agents or workaround loops (Decision 55)."
