schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: last-green-range-consumers
intent: >-
  rec-4874 build plan 2a (the first half of rec-5106; Decision 254 cl.2 and cl.4): before batching starts, give the full
  tier one shared resolver module, scripts/ci/last_green.py (Decision 254 cl.2's last-green ref, "covered" and prev),
  and make the consumers that do not belong to the trailer gate range-aware: push_context_base reads the prev a job
  passes (never HEAD~1), and ci-rca diagnoses a CI red over its run's range and dedups one cause across the two
  workflows that run the full tier (rec-4900). Serves NS.6: every merged tree's verification stays proven from run
  evidence once one run covers several merges. Behaviour is unchanged wherever HEAD^'s main-validate ran the full tier;
  after a plans-only parent ci-rca's range correctly reaches past it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-last-green-range-consumers.yaml
phase: >-
  rec-4874 (ad_hoc_rec; no tier_item names it). Build plan 2a of rec-4874's design (#1946); build plan 1 merged as #1998
  (Decision 254). Closes no exit criterion. rec-5106 stays open for build plan 2b, which closes it and first annotates Decision 254 cl.9's coverage note: two cl.4 legs move to rec-5107.
closes_criteria: []
cites: [dec:142, dec:159, dec:162, dec:168, dec:181, dec:186, dec:246, dec:249, dec:254]
scope:
  - file: scripts/ci/last_green.py
    action: Create
    purpose: >-
      The shared resolver module (Decision 254 cl.2). Standard library plus scripts.ci.deploy_gate only (the deploy
      channels run deploy_gate on bare python3; a later rewire, rec-5108, may import this module from there). (1) It
      imports GithubApi, Git, FULL_TIER_JOB, FULL_TIER_STEP and newest_green_sha from scripts.ci.deploy_gate, which is
      not edited, and re-exports newest_green_sha (push runs, latest attempt; Decision 249 cl.2). (2)
      last_green_sha(api, git, *, ref="origin/main", limit=50): the newest first-parent commit of ref whose ci.yml
      main-validate run, event push or workflow_dispatch, passed the full-tier step on ANY attempt (a listing shows the
      latest attempt only, so a run whose latest attempt did not pass reads its attempts); used by covered() and by prev
      widening, not by the deploy gate. (3) covered(api, git, sha) -> bool: sha equals or is a first-parent ancestor of
      last_green_sha. (4) full_tier_state(api, sha) -> "started" | "skipped" | "absent": "started" when any of the
      commit's ci.yml main-validate runs (push or dispatch), read at its latest attempt, has a main-validate job that
      started the full-tier step (a runner assigned and the step executed or executing) and did not conclude timed_out
      or cancelled, a job still in progress included; "skipped" when such a job exists and its full-tier step was
      skipped (plans-only, fast tier alone); else "absent" (no such run, or a running job whose full-tier step is still
      queued or pending: it has not started, so Decision 254 cl.1 passes over it). (5) resolve_prev(api, git, head) -> str | None: the nearest
      first-parent ancestor of head (head excluded) whose full_tier_state is "started"; the walk is capped at the same
      limit and returns None past it. No module-level I/O; the api and git objects are the deploy_gate seams, injected.
  - file: scripts/checks/_common.py
    action: Modify
    purpose: >-
      push_context_base, inside push context only (the existing detection, unchanged; outside it the function returns
      None as today, Decision 159 cl.1): when FULL_TIER_PREV is set and non-empty, return it if it names a commit
      present locally that is a strict ancestor of HEAD (git merge-base --is-ancestor, cwd as today, and not HEAD itself, which would recreate Decision 159's base == HEAD no-op); else
      FULL_TIER_LAST_GREEN under the same test; else raise RuntimeError naming both values, so the calling check goes
      red. Never HEAD~1 on this branch, and no API call (Decision 254's note on Decision 159 cl.1: the job passes prev
      in). When FULL_TIER_PREV is unset or empty, today's code path runs unchanged (GITHUB_EVENT_BEFORE, then HEAD~1,
      then None). Module constants FULL_TIER_PREV_ENV and FULL_TIER_LAST_GREEN_ENV carry the two names.
    new_imports: []
  - file: tests/conftest.py
    action: Modify
    purpose: >-
      The existing autouse _clear_push_context_env_vars also deletes FULL_TIER_PREV, FULL_TIER_LAST_GREEN and
      CI_RCA_RANGE_PREV, beside GITHUB_EVENT_NAME and GITHUB_EVENT_BEFORE: once rec-5107 sets them for the full-tier step
      they are job-global, and about ten test files opt back into push context with setenv("GITHUB_EVENT_NAME", "push")
      over tmp or mocked repos, which would otherwise take the new branch and fail. Its docstring names the three.
  - file: tests/checks/_common/test_push_context_base.py
    action: Modify
    purpose: >-
      test_conftest_strips_full_tier_vars_from_job_env: runs the sibling node
      test_full_tier_vars_absent_inside_a_test in a subprocess (sys.executable -m pytest, cwd the repo root) with FULL_TIER_PREV,
      FULL_TIER_LAST_GREEN and CI_RCA_RANGE_PREV set in its environment and expects exit 0 (red before: the variables
      leak into the test). Add the FULL_TIER_PREV cases on a real temp git
      repo in push context: an ancestor prev is returned (even when it is HEAD~3); a non-ancestor or absent prev falls
      to a qualifying FULL_TIER_LAST_GREEN; test_full_tier_prev_equal_to_head_is_not_strict_ancestor (the strict
      reading of the contract's "an ancestor of HEAD"); neither qualifying raises; outside push context a set FULL_TIER_PREV still
      returns None; an unset variable keeps today's GITHUB_EVENT_BEFORE then HEAD~1 results (existing tests unchanged).
  - file: scripts/ci_rca/range_context.py
    action: Create
    purpose: >-
      CLI and pure core for ci-rca's range step (Decision 162: the shell stays a thin adapter). Subcommand resolve:
      inputs --run-json (the failing run, already fetched), --workflow-slug, --repo, --out. For slug "ci" only: a range
      artifact the run recorded wins (read from --recorded-range PATH when the file exists; rec-5107 adds the
      producer); else last_green.resolve_prev(head); a prev that is absent or not an ancestor of head widens to
      last_green.last_green_sha(..., ref=head) (a green on origin/main that is not an ancestor of head never counts); if
      neither resolves, the range is head alone with range_status "unresolved". Output JSON: {head, prev, range_status:
      recorded|resolved|widened|unresolved|head_only, commits: [first-parent shas prev..head, oldest first], prs: [{sha,
      pr}] one per commit from commits/{sha}/pulls (null when none)}. Step outputs (key=value lines for
      $GITHUB_OUTPUT): range_status; diff_base = prev for a resolved, widened or recorded ci range, empty for an
      unresolved ci range, and the literal HEAD^ for every other slug (so vacuous_pass diffs HEAD^..HEAD there exactly as
      today); prompt_note = one sentence naming /tmp/ci-rca-range.json and its pull requests for slug ci, else empty.
      As its last act, after the outputs are written, it prints the workflow annotation "::notice
      title=ci-rca-range::range_status=<s> diff_base=<b>" (the proof that resolve completed; a continue-on-error step's
      conclusion reads success whatever its outcome, validate_oidc_failopen_guards.py:20-22). Any other slug: {head, prev: null,
      range_status: head_only, commits: [head]}, as today. A failing API read degrades to range_status unresolved,
      never a red ci-rca job. Subcommand probe --ref REF --depth N (read-only, a live check for the build): for each of
      REF's first N first-parent commits prints its full_tier_state, whether the job's fast-tier step ran, and an
      independent oracle, scripts.ci.push_scope.confined_to_plans over git diff --name-only sha^ sha; the oracle is
      compared only where the fast-tier step ran (a job that failed or was cancelled before it is listed as excluded:
      resolve_prev still passes over it, Decision 254 cl.1); exits 0 printing "probe=ok skipped=K" only when every
      compared "skipped" commit is plans-only and every "started" one is not, resolve_prev(REF) returned the
      nearest "started" commit, and K is above 0; else "probe=fail <reason>" and exit 1. Subcommand observe --merge-sha SHA
      (read-only): takes the merge commit's committer time from git, pages ci-rca.yml runs created at or after it with
      status completed (per_page 100), drops runs whose conclusion is skipped before reading any jobs, keeps runs whose "Resolve run range" step was not skipped (the rca job ran, the
      slug was ci and the checkout had the module), takes the oldest, reads its rca job's check-run annotations
      (check-runs/{job id}/annotations, public), and prints "observe=<run id> slug=ci resolve=completed
      range_status=<s>" (exit 0) when the ci-rca-range notice is present, "observe=<run id> slug=ci
      resolve=incomplete" (exit 1) when it is absent (the step's conclusion is never the proof), or "observe=none-yet"
      (exit 0) when no run qualifies. GH_TOKEN is optional (public reads).
  - file: tests/ci_rca/test_range_context.py
    action: Create
    purpose: >-
      Fake api/git fixtures: parent ran the full tier -> prev is HEAD^ and commits == [head] (the neutrality case);
      plans-only parent (full-tier step skipped) -> prev is HEAD^^ and commits holds both; timed_out parent passed
      over; in-progress parent counts; a running parent whose full-tier step is still queued is passed over; recorded
      range wins over resolve_prev; a non-ancestor prev (injected through the recorded-range path) widens to the
      last-green sha read at ref=head; nothing resolves -> unresolved, head alone and an empty diff_base; a non-CI slug
      returns head_only with diff_base HEAD^ and an empty prompt_note; an API error returns unresolved; one PR per
      commit; probe prints probe=ok over a fake chain with a skipped plans-only commit, and probe=fail when
      resolve_prev stops on it, when the oracle disagrees, or when K is 0; a commit whose job failed before the fast
      tier is excluded from the oracle; observe skips runs whose range step was skipped, takes the oldest remaining,
      reads completed from the notice, reads incomplete when the step's conclusion is success but the notice is
      absent, and prints none-yet on an empty page.
  - file: tests/ci/test_last_green.py
    action: Create
    purpose: >-
      last_green_sha counts a workflow_dispatch run and an earlier passing attempt whose latest attempt failed;
      newest_green_sha still ignores both (Decision 249 cl.2 unchanged); covered() is true for the green sha and its
      first-parent ancestors and false above it; full_tier_state and resolve_prev cases mirror range_context's at the
      function level; last_green.newest_green_sha is deploy_gate.newest_green_sha; test_module_imports_only_stdlib_and
      _deploy_gate (the module's imports are standard library or scripts.ci.deploy_gate).
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: >-
      (1) Two new steps after "Resolve run metadata". "Resolve run range" (id range; if: the meta step's workflow_slug
      is ci && hashFiles('scripts/ci_rca/range_context.py') != '' -- the job checks out the failing commit, which may
      predate the module; continue-on-error: true; timeout-minutes: 3; env GH_TOKEN): its body has no branch and no
      VAR=$(...) assignment (validate_masked_errexit_steps): fetch the run JSON (gh api to a file, the meta step's
      source) and run bin/venv-python -m scripts.ci_rca.range_context resolve, appending its outputs (range_status,
      diff_base, prompt_note) to $GITHUB_OUTPUT and writing /tmp/ci-rca-range.json. "Range fallback" (id
      range_fallback; if: the slug is not ci || that hashFiles is ''): writes diff_base=HEAD^. Under bash -e a failed
      fetch stops the body before resolve, so the run abstains (empty diff_base); a hang hits the timeout and, through
      continue-on-error, abstains too. Only resolve's closing ci-rca-range notice proves it completed. (2) "Generate evidence bundle" gains env CI_RCA_RANGE_PREV: ${{
      steps.range.outputs.diff_base || steps.range_fallback.outputs.diff_base }} (at most one of the two ran; an empty
      ci value stays empty). So every
      non-ci slug and a ci checkout that predates the module pass HEAD^ (today's diff), a resolved ci range passes its
      prev, and an unresolved ci range or a ci range step that crashed passes empty, so vacuous_pass abstains (Decision
      254 cl.4: never a HEAD^ diff standing in for a range). (3) The agent step gains env RANGE_NOTE from steps.range.outputs.prompt_note, appended at the
      end of its existing PROMPT= line (no new body line). (4) Unchanged: the meta step's anchor, the selection-manifest
      step (the head commit's PR until rec-5107's culprit job names one; Decision 142 cl.5, Decision 186), the
      commit-status dedup (keyed on the run head) and every other step. No existing inline body grows: each
      composite_action_body_baseline.yaml row for this file stays at or below its value (Decision 162 R3); the new
      step's body is a thin adapter.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      One row each for the two new ci-rca.yml steps' inline bodies at their measured lengths (Decision 162 R3 records every inline
      body); no existing row increases.
  - file: tests/verify_ci_workflow/test_ci_rca_range_step.py
    action: Create
    purpose: >-
      Structural pins on ci-rca.yml: the range step runs scripts.ci_rca.range_context resolve after the meta step and
      before the evidence step, its if: requiring the ci slug and hashFiles of the module, with continue-on-error
      true, timeout-minutes 3 and GH_TOKEN in its env; the range_fallback step's if: is the exact complement and it
      writes HEAD^; the evidence step's CI_RCA_RANGE_PREV is exactly the two-output
      expression; the agent step's PROMPT= line
      ends with ${RANGE_NOTE}; the selection-manifest step still resolves the PR from the anchor sha (unchanged); the
      dedup step still keys on steps.meta.outputs.anchor_sha.
  - file: scripts/ci_rca/vacuous_pass.py
    action: Modify
    purpose: >-
      _run_git_diff diffs CI_RCA_RANGE_PREV..HEAD when that variable is set and non-empty (a sha, or HEAD^ as ci-rca
      passes for a non-CI slug); when it is set but empty (an unresolved ci range) every diff-derived result is
      "undetermined", never a HEAD^ diff; when it is unset (a local caller) HEAD^..HEAD as today. RANGE_PREV_ENV names the
      variable. Docstrings follow.
  - file: tests/test_ci_rca_vacuous_pass.py
    action: Modify
    purpose: >-
      Add test_two_commit_range_diff_lists_both (the conftest strips CI_RCA_RANGE_PREV for every test),
      test_set_but_empty_range_is_undetermined, a HEAD^ value diffs as today, and unset keeps HEAD^.
  - file: scripts/ci_rca/dedup.py
    action: Modify
    purpose: >-
      Cross-workflow dedup (rec-4900; Decision 142 cl.1 and cl.3, fingerprint unchanged). FULL_TIER_SIBLING_SLUGS =
      ("ci", "main_canary"). sibling_fingerprints(bundle) -> list[str]: the bundle's own fingerprint first, then, when
      its workflow slug is a sibling, compute_fingerprint_v2(slug, failure_category, error_signature) for each other
      sibling. decide() keeps one entry per bundle; an entry is a str (as today, so
      dedup-probe.yml and the existing tests are unchanged) or that bundle's list: the finder is tried over the whole
      list first and the first open match is bumped once; only if none matches is the closed-head resolver tried over
      the list, and the bundle is dropped only when at least one entry reads "drop" and none reads "regression" (any
      regression, or no closed head at all, runs the agent: fail closed, Decision 55). main() passes each bundle's list and writes them to <bundles-dir>/sibling-fingerprints.txt (one line
      per bundle: its own fingerprint, then its siblings, space-separated; not a .json name, so no bundle reader sees
      it), the handoff the write-time backstop reads; the write is best-effort (an OSError is logged, never raised,
      because fp_dedup has no continue-on-error and the backstop already treats an absent file as own-fingerprint
      only). So a Main Canary red of a cause already open from main-validate bumps
      that rec instead of filing a second. Bundles carry workflow_name, failure_category and error_signature today
      (scripts/ci_rca/evidence/_bundle_core.py); a bundle missing any of them is looked up on its own fingerprint only.
  - file: scripts/ops_portal/ci_rca_runtime.py
    action: Modify
    purpose: >-
      Write-time backstop (Decision 142 cl.3): find_open_ci_rca_rec_by_fingerprint keeps its signature and both call
      sites (scripts/ops_data_portal.py file_rec and scripts/ops_portal/cli.py), which are not edited, and gains no
      first-party import (os from the standard library only): it expands its fingerprint to the line of $CI_RCA_BUNDLE_EMIT_DIR/sibling-fingerprints.txt that starts
      with it (the agent step sets that variable to the fp_dedup step's /tmp/ci-rca-bundles; with the variable unset, the
      file absent or no such line the list is the fingerprint alone, as today) and matches any of the list from the SAME
      single current_state read (no extra reader call; Decision 88, 215). Its fail-open behaviour is unchanged. Net SLOC
      growth at most 15; past 500, decompose (Decision 128), never raise.
    new_imports: []
  - file: tests/test_ci_rca_cross_workflow_dedup.py
    action: Create
    purpose: >-
      rec-4900's acceptance node test_same_full_tier_failure_on_two_workflows_files_one_rec: a main_canary bundle and
      an open ci rec of the same failure_category and error_signature -> decide() dedupes and bumps the ci rec, and
      the write-time backstop returns the same rec id; plus red cases: a different signature still runs the agent; a
      non-sibling slug (terraform-apply-sandbox) never matches a ci rec; a sibling's CLOSED head goes through
      classify_closed_head as its own slug's would; one sibling reading "drop" and another "regression" runs the
      agent. test_backstop_matches_sibling_fingerprint: with dedup's
      sibling-fingerprints.txt written to a tmp CI_RCA_BUNDLE_EMIT_DIR and a fake reader, find_open_ci_rca_rec_by_
      fingerprint(<main_canary fingerprint>) returns the open ci rec from one current_state call; without the file it
      matches the own fingerprint only.
  - file: docs/contracts/full-tier-range.yaml
    action: Create
    purpose: >-
      New Class D subject contract (Decision 168), the approved words of docs/plans/approved/
      last-green-range-consumers.yaml block c01: prev, range, last-green ref, covered, the three variables, the read
      order, ci-rca's range use and the full-tier sibling set, and what stays dormant until rec-5107. Evaluator
      validate_full_tier_range. Build plans 2b to 4 extend this file instead of the capped git-ops.yaml and
      ci-rca-lifecycle.yaml.
  - file: scripts/checks/ci_guards/validate_full_tier_range.py
    action: Create
    purpose: >-
      The contract's evaluator (Decision 168; derive-and-assert, the validate_presubmit_tool_pin_escalation shape):
      the contract's variables equal _common.FULL_TIER_PREV_ENV, _common.FULL_TIER_LAST_GREEN_ENV and
      vacuous_pass.RANGE_PREV_ENV; its sibling slugs equal dedup.FULL_TIER_SIBLING_SLUGS and each is the slug of a
      workflow in config/ci_rca_taxonomy.yaml's workflows map whose tier is the CI tier; its job and step names equal
      last_green.FULL_TIER_JOB and FULL_TIER_STEP. Holds the contract basename as a literal; reports
      registry.examined(n, unit="contract_fields").
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      Entry(name="validate_full_tier_range", ...) with pre=True, pre_globs naming the check, the contract, scripts/
      checks/_common.py, scripts/ci/last_green.py, scripts/ci_rca/dedup.py, scripts/ci_rca/vacuous_pass.py,
      scripts/ci_rca/fingerprint.py and config/ci_rca_taxonomy.yaml plus its import closure, full_segment
      full_after_lint.
  - file: tests/checks/ci_guards/test_validate_full_tier_range.py
    action: Create
    purpose: >-
      Green on the live tree; red per drift (a renamed variable, a sibling slug missing from the taxonomy or from
      dedup, a job-name drift) on tmp copies; test_registered_in_fast_tier (the registry resolves the Entry with
      pre=True).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      One function_to_category row, validate_full_tier_range: schema_drift. At 492 of 500 effective lines (plan_obligations): if the
      row would cross 500, compact an existing row in the same file (structural relief valve), never raise.
bundled_recommendations: [rec-4900]
followon_recs: [rec-5106]
infrastructure_dependencies: []
acceptance_criteria:
  - "rec-4900's acceptance passes: one full-tier failure seen by main-validate and Main Canary files one rec."
  - "scripts/ci/last_green.py answers last_green_sha (push or dispatch, any attempt), covered, full_tier_state and resolve_prev, each unit-tested, and imports only the standard library and scripts.ci.deploy_gate; scripts/ci/deploy_gate.py is not edited and tests/ci/test_deploy_gate.py passes unchanged."
  - "push_context_base in push context with FULL_TIER_PREV set returns an ancestor prev, else a qualifying FULL_TIER_LAST_GREEN, else fails; unset, or outside push context, every existing push_context_base test passes unchanged."
  - "ci-rca computes a CI run's range through range_context.py; when HEAD^ ran the full tier the range is the head commit alone (behaviour unchanged); after a plans-only parent it holds both commits; vacuous_pass diffs the range and abstains when it is unresolved; every other watched workflow, and a ci-rca run whose checkout predates range_context.py, still diffs HEAD^..HEAD; resolve_prev passes over a live plans-only main commit (VP 10)."
  - "docs/contracts/full-tier-range.yaml matches its approved sidecar word for word, and validate_full_tier_range is green on the tree and red on each drift fixture."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-4900's acceptance node and the write-time backstop (cross-workflow dedup).
    command: bin/venv-python -m pytest "tests/test_ci_rca_cross_workflow_dedup.py::test_same_full_tier_failure_on_two_workflows_files_one_rec" "tests/test_ci_rca_cross_workflow_dedup.py::test_backstop_matches_sibling_fingerprint" -q
    expected: exit 0; red before (the test file does not exist).
    fix_if: the canary bundle files a second rec; fix sibling_fingerprints or the finder order, never the fixture
    hermetic: true
    expected_literals: [" 2 passed"]
    graduation: graduate
    graduation_check_id: ci-rca-cross-workflow-dedup
  - step: 2
    phase: pre-deploy
    action: The range resolves past a plans-only parent and equals the head alone when the parent ran the full tier.
    command: bin/venv-python -m pytest "tests/ci_rca/test_range_context.py::test_plans_only_parent_widens_range" "tests/ci_rca/test_range_context.py::test_full_tier_parent_gives_head_only_range" -q
    expected: exit 0; red before (the module and test file do not exist).
    fix_if: the plans-only parent is taken as prev, or the neutral case yields more than the head commit
    hermetic: true
    expected_literals: [" 2 passed"]
    graduation: graduate
    graduation_check_id: ci-rca-range-resolves-prev
  - step: 3
    phase: pre-deploy
    action: "The read order -- recorded range wins, a bad prev widens to last-green, nothing resolves is unresolved."
    command: bin/venv-python -m pytest "tests/ci_rca/test_range_context.py::test_recorded_range_wins" "tests/ci_rca/test_range_context.py::test_non_ancestor_prev_widens_to_last_green" "tests/ci_rca/test_range_context.py::test_nothing_resolves_is_unresolved_head_alone" -q
    expected: exit 0; red before (the module and test file do not exist).
    fix_if: any rung of the read order is skipped or reordered
    hermetic: true
    expected_literals: [" 3 passed"]
    graduation: graduate
    graduation_check_id: ci-rca-range-read-order
  - step: 4
    phase: pre-deploy
    action: The shared resolver answers Decision 254 cl.2 and leaves the deploy gate's resolver as it was.
    command: bin/venv-python -m pytest "tests/ci/test_last_green.py::test_last_green_counts_dispatch_and_any_attempt" "tests/ci/test_last_green.py::test_newest_green_sha_unchanged_for_dispatch_and_attempts" "tests/ci/test_last_green.py::test_covered_is_green_and_its_ancestors" "tests/ci/test_last_green.py::test_module_imports_only_stdlib_and_deploy_gate" tests/ci/test_deploy_gate.py -q
    expected: exit 0; the four new nodes red before (the module does not exist); test_deploy_gate.py green before and after (deploy_gate.py is not edited).
    fix_if: a dispatch run or an earlier passing attempt is missed, newest_green_sha starts counting either, last_green.py imports beyond the standard library and deploy_gate, or a deploy_gate test changes
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: last-green-resolver-cl2
  - step: 5
    phase: pre-deploy
    action: push_context_base honours a passed prev, widens to a passed last-green, fails otherwise, and is unchanged when unset.
    command: bin/venv-python -m pytest "tests/checks/_common/test_push_context_base.py::TestPushContextBase::test_full_tier_prev_ancestor_is_returned" "tests/checks/_common/test_push_context_base.py::TestPushContextBase::test_full_tier_prev_falls_to_last_green" "tests/checks/_common/test_push_context_base.py::TestPushContextBase::test_neither_qualifying_raises" "tests/checks/_common/test_push_context_base.py::TestPushContextBase::test_full_tier_prev_equal_to_head_is_not_strict_ancestor" "tests/checks/_common/test_push_context_base.py::test_conftest_strips_full_tier_vars_from_job_env" -q
    expected: exit 0; red before (the five nodes do not exist); the file's existing cases run unchanged in VP 9.
    fix_if: HEAD~1 is returned while FULL_TIER_PREV is set, a non-qualifying pair returns a base, or the conftest lets a job-set variable reach a test
    hermetic: true
    expected_literals: [" 5 passed"]
    graduation: graduate
    graduation_check_id: push-context-base-full-tier-prev
  - step: 6
    phase: pre-deploy
    action: vacuous_pass diffs the range and abstains when it is unresolved.
    command: bin/venv-python -m pytest "tests/test_ci_rca_vacuous_pass.py::test_two_commit_range_diff_lists_both" "tests/test_ci_rca_vacuous_pass.py::test_set_but_empty_range_is_undetermined" -q
    expected: exit 0; red before (the two nodes do not exist); the file's existing cases run unchanged in VP 9.
    fix_if: a set-but-empty range diffs HEAD^, or a two-commit range drops the older commit's files
    hermetic: true
    expected_literals: [" 2 passed"]
    graduation: graduate
    graduation_check_id: ci-rca-vacuous-pass-range
  - step: 7
    phase: pre-deploy
    action: The contract's evaluator is green on the tree, red on each drift, and registered in the fast tier; the workflow pins hold.
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_full_tier_range.py tests/verify_ci_workflow/test_ci_rca_range_step.py -q && bin/venv-python -c "from scripts.checks.ci_guards.validate_full_tier_range import validate_full_tier_range as v; f=[]; v(f); raise SystemExit(1 if f else 0)"
    expected: exit 0; tests red before (files absent); the direct invocation finds nothing (registry.examined records the count; it prints nothing).
    fix_if: a drift fixture stays green, or the check is not registered pre=True
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The check itself becomes the standing guard in the fast tier (pre=True), so a graduated shard would re-run what
      every PR already runs.
  - step: 8
    phase: pre-deploy
    action: Bind the contract to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug last-green-range-consumers --base origin/main
    expected: exit 0; APPROVED-TEXT OK, every block word for word.
    fix_if: any word differs; fix the file, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_merge_step and the approved-text check run this on every PR; a shard would duplicate them.
  - step: 9
    phase: pre-deploy
    action: Every remaining new or touched test file and the size budgets.
    command: bin/venv-python -m pytest tests/ci_rca/test_range_context.py tests/ci/test_last_green.py tests/test_ci_rca_cross_workflow_dedup.py tests/test_ci_rca_dedup.py tests/ops_data_portal/test_ci_rca_fingerprint.py tests/checks/_common/test_push_context_base.py tests/test_ci_rca_vacuous_pass.py tests/verify_ci_workflow/test_ci_rca_range_step.py tests/checks/ci_guards/test__manifest.py tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py tests/checks/ci_guards/test_validate_masked_errexit_steps.py -q && bin/venv-python -c "from scripts.checks.sloc.sloc_limits import validate_sloc_limits as a; from scripts.checks.structural.size_limits import validate_structural_size_limits as b; f=[]; a(f); b(f); raise SystemExit(1 if f else 0)"
    expected: exit 0
    fix_if: an existing dedup or fingerprint test changes result, or a file crosses its budget (decompose, never raise)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A whole-file sweep and the size checks, both already in the full tier; steps 1-5 graduate the behaviours.
  - step: 10
    phase: pre-deploy
    action: resolve_prev against live GitHub passes over plans-only main commits (the jobs-API assumption, proven live).
    command: bin/venv-python -m scripts.ci_rca.range_context probe --ref origin/main --depth 20
    expected: exit 0 and a line "probe=ok skipped=K" with K above 0; push_scope's plans-only rule agrees with every skipped and started commit. About 40 public reads, inside the unauthenticated hourly limit; export GH_TOKEN where one is available.
    fix_if: probe=fail on an oracle disagreement over a compared commit (fast-tier step ran) means full_tier_state misreads the live jobs API; fix it and its fixtures to the live shape, never the probe. probe=fail with K 0 means no plans-only merge in the window; rerun after the next plan PR merges
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Live, unauthenticated GitHub reads against a moving main; steps 2-4 graduate the same logic on fixtures, and VP 12
      reads the deployed step.
  - step: 11
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree (HOME set to an empty dir for tests/test_aws_profile.py).
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: The first failing-upstream ci-rca run after merge runs the range step to success (observation only; no red is induced).
    command: bin/venv-python -m scripts.ci_rca.range_context observe --merge-sha "$(git rev-parse origin/main)"
    expected: run with the build's merge commit still origin/main's tip, or pass its SHA in place of the rev-parse; exit 0 with "observe=<run id> slug=ci resolve=completed range_status=<s>" on the oldest ci-rca run after the merge whose range step ran, or "observe=none-yet" (rerun on the next CI red).
    fix_if: "resolve=incomplete (the step ran but its notice is absent: a crash, a failed fetch or the timeout); read that run's log, and file a rec against this plan (forward fix)"
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: rec-4900 is closed by the merge commit's Resolves trailer.
    command: bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; r=make_reader().named('recs_by_ids', ids='rec-4900')[0]; print(r['status']); assert r['status']=='closed'"
    expected: prints closed, exit 0, after ci.yml's trailer-closure job on the merge commit has run.
    fix_if: still open; read the merge commit's trailer-census and trailer-closure jobs and close it through ops_data_portal update_rec citing the merge SHA (Decision 70 fallback)
    hermetic: false
    graduation: not-applicable
