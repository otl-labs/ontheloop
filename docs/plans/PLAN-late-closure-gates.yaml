schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "late-closure-gates"
intent: >-
  Let a rec-bundling plan's closure (implementation_declared plus its graduated registry shards) land in its own PR
  after the implementation PR has squash-merged (a plan with no bundled recs has no trailer-bearing anchor and stays
  uncovered), with every VP step still graduated. Two --pre gates learn one evidence-bound
  route, the plan's implementation merge read from git, and stay unchanged on the normal pre-merge path. Unblocks the
  PLAN-deferred-policy-digest closure (PR #1767, 6993f383, rec-4741).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-late-closure-gates.yaml
phase: >-
  ad_hoc_rec (soft-warn category user_explicit_out_of_scope; no tier_item claimed, so the Tier Item Freshness Gate is
  skipped). Requested by Benjamin 2026-11-02 to unblock the PLAN-deferred-policy-digest closure. Closes no roadmap
  criterion.
closes_criteria: []
scope:
  - file: scripts/checks/verification/_implementation_merge.py
    action: Create
    purpose: >-
      The one late-closure resolver both gates and the session verb share. find_implementation_merge(plan_rel, root,
      ref) returns the plan's implementation merge X from git alone, as a frozen dataclass ImplementationMerge(sha, parent)
      holding full 40-hex shas. It returns None BEFORE any history scan when the plan
      is absent at `ref` or its bundled_recommendations set there is empty (an empty set would match every trailer-less
      commit). Otherwise: among first-parent commits of `ref` after the
      commit that added the plan file (a squash that both adds the plan and carries the trailer is excluded, so None), the commits whose parse_resolves_trailer set equals the plan's (at ref)
      bundled_recommendations set, then filtered: the commit must read the plan undeclared, must not be refused by
      trailer_closure_gate.merge_leg_refuses on its changed files (taken from scripts.ops_portal.closure_gate.changed_files,
      the same source the production trailer-closure gate uses), and its diff must intersect the plan's scope files
      other than the plan itself. The count is taken AFTER these filters: none left is None, more than one raises
      LateClosureError. late_closure_route(plan_rel, root, base, head=None)
      (head=None is the WORKING-TREE mode: the flip is the caller's resolve_declared_plans result, never a second flip
      reader; the mapping compare reads the plan from disk; changed = working-tree diff against base plus untracked
      files under config/agent/verification_registry/entries/, branch trailers = base..HEAD; a sha reads that
      commit) returns X only for a CLOSURE-ONLY change: the plan flips to declared against the base; the plan's parsed mapping
      at head equals its parsed mapping at base except that implementation_declared is added or set to true (any other
      field edit, including an added or edited VP step, graduation, graduation_check_id or bundled_recommendations,
      means no route); bundled_recommendations and graduation_check_ids are read from the plan AT THE BASE, never from
      head; bundled is non-empty; no approved-text sidecar exists at the base (approved_text.sidecar_state(slug, root, base) == "absent", reusing
      the path owner rather than a second hardcoded path) (a sidecar plan
      gets no route, Benjamin 2026-11-03: its bound text is already on main, so leg (A) would fail and the binding was
      never checked mechanically; declared residual); the base..head commits carry no Resolves trailer; and every changed file is the plan
      itself or config/agent/verification_registry/entries/<id>.yaml for an id in the base plan's
      graduation_check_ids (throughout this plan: the set of the plan's verification_plan[].graduation_check_id values,
      not a plan field). late_closure_route evaluates its cheap closure-only conditions first (flip, mapping equality,
      changed-file allowlist, no branch trailer, non-empty bundled, no sidecar) and calls find_implementation_merge(..., ref=base)
      only when all hold, so X is always an ancestor of the base and a LateClosureError can never reach an ordinary
      implementation PR. Never
      calls push_context_base and adds no second plan-resolution contract: the flip is read
      with _common._plan_declared_at_ref(head) and the mapping compare with git show head:<plan> (head may be a
      historical sha for readback/recover); _common.resolve_declared_plans stays only the checks' working-tree
      candidate set (Decisions 148, 159).
    new_imports: [scripts.checks._common, scripts.rec_trailer, scripts.ops_portal.trailer_closure_gate, scripts.ops_portal.closure_gate, scripts.roadmap.approved_text]
  - file: scripts/verification_graduation.py
    action: Modify
    purpose: >-
      run_differential gains base_ref: str = "origin/main", passed to make_worktree_revert_runner; the admitted reason
      names the base ref's full sha on every path (the default path's reason changes from "fails on origin/main" to
      name the resolved sha; no assertion pins that string). Default call sites' arguments are unchanged. If the file's SLOC would exceed 500, decompose (facade
      package, Decision 128) instead of raising a budget.
    new_imports: []
  - file: scripts/checks/verification/validate_verification_registry.py
    action: Modify
    purpose: >-
      Add root/changed fixture seams with defaults byte-unchanged (as validate_merge_step has); the root default resolves
      _common.ROOT at call time, never at definition time, so the existing tests that patch it keep their path. Route
      inputs in both checks: base = the diff base status_diff_base(root) or origin/main (newly introduced in this check
      for the route only; _added_entries and _modified_entries keep origin/main), head =
      HEAD, changed = git diff --name-only base..HEAD; a declaration present only in the working tree prints PENDING for the committed route
      (head=HEAD); in that state, ONLY for a plan where late_closure_route(..., head=None) returns an X,
      which needs a non-empty bundled set and a closure-only diff and is None on every normal implementation PR, an
      added shard owned by that plan prints PENDING and skips its differential without failing (the committed run decides; PR CI always sees it committed).
      Every other added shard, including a normal-path plan with an uncommitted flip, runs today's origin/main
      differential unchanged. VP 2 covers both. late_closure_route is computed once per plan per dispatch (not per shard); every git failure inside it reads as no
      route, never an exception, so tests that point _common.ROOT at a non-git tree are unchanged. For an ADDED shard
      only, whose plan_slug names a plan with a late_closure_route X and whose check_id is one of
      that plan's graduation_check_ids, run_differential(row, base_ref=X^). Every modified row and every other added
      row keeps origin/main. LateClosureError is a failure naming the plan and the competing commits. Prints the base
      per admitted row.
    new_imports: [scripts.checks.verification._implementation_merge]
  - file: scripts/checks/verification/validate_merge_step.py
    action: Modify
    purpose: >-
      Route inputs as in the registry row (base = diff base, head = HEAD, changed = base..HEAD). Leg (T): when the
      branch trailer union is empty and late_closure_route returns X, the bundled set is satisfied by
      X's trailer, and the check prints LATE-CLOSURE naming X. Every other case runs today's equality check unchanged; a
      branch trailer with a route present still fails as today (never a superset). LateClosureError is a failure. Leg
      (A) is untouched.
    new_imports: [scripts.checks.verification._implementation_merge]
  - file: scripts/session/merge_step.py
    action: Modify
    purpose: >-
      The warehouse leg the credential-free pr-validate job cannot run. premerge: with a late-closure route X at HEAD,
      the message must parse to no trailer, and each bundled rec, read through fetch_recs_by_ids (recs_by_ids,
      Decision 215), must be status closed with a resolution naming X's full sha. A reader error, a missing row, an
      open rec or a different sha fails (exit 1); it never falls back to the acceptance preview as a substitute for this check. _preview (it prints
      already-closed and passes), _approved_text and _decision_collisions still run unchanged on the route. Bases: premerge evaluates
      late_closure_route with base = merge-base(origin/main, HEAD) and head = HEAD; readback --sha <closure merge>
      evaluates it with base = sha^, head = sha (the single squash commit; changed files = diff-tree of sha) and
      prints READBACK OK ... late-closure satisfied-by=X. readback --sha X, once the plan reads declared on
      origin/main and find_implementation_merge at origin/main returns X, prints READBACK OK ... late-closed; every other
      undeclared case keeps today's UNEXPECTED line and remedy. recover gains one refusal: when late_closure_route
      resolves at the given sha (a closure merge), it prints RECOVER refused: late closure, recs closed by X and exits
      2, never re-closing a closed rec; otherwise recover is unchanged.
    new_imports: [scripts.checks.verification._implementation_merge]
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      resolves_trailer gains a LATE CLOSURE clause (the route's conditions; the closure PR carries no trailer, so the
      trailer-census and trailer-closure jobs stay inert and no second closure path exists, Decision 201);
      merge_step_coverage names the git-only mechanical leg and the procedural warehouse leg in premerge, whose residual
      owner is rec-4755, and a plan with an approved-text sidecar is excluded from the route (residual: its bound text
      has no mechanical late check; it closes only through the normal path). Measure its effective lines against main at build time (31 of headroom at plan time, shared with two unbuilt plans)
      and compact within the file, never raise; compaction keeps verbatim every phrase validate_rec_autoclose_trailer_gate
      pins in resolves_trailer (the implementation-merge CARRIER phrase and the Key: value PLACEMENT phrase). Any repo path the clause names (scripts/checks/verification/_implementation_merge.py,
      scripts/ops_portal/trailer_closure_gate.py) joins referenced_repo_paths. contract_version 10 -> 11 with an
      amendment_log row.
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      A governance note: the differential base is origin/main except the late-closure route's X^; residuals: the
      Decision 176 clause 4 atomic revert (reverting X does not revert its shards; the closure commit is its revert partner), HEAD
      includes main commits after X so admission at X^ does not isolate X, a second commit with the same trailer set
      fails closed (LateClosureError), and a test_selector shard whose node is absent at X^ is admitted by absence
      (rec-3776 / rec-2998 shape). contract_version 6 -> 7 with an amendment_log row marked semantic_break: true (an admission-rule
      change, as the 2026-08-31 row was, unlike a plain governance_note_add).
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      Widen pre_globs so a later edit to anything the checks now read selects them in --pre: validate_merge_step gains
      scripts/ops_portal/** (trailer_closure_gate.py, closure_gate.py and the ops_portal/_common.py it imports;
      scripts/checks/verification/** and scripts/rec_trailer.py already cover the rest); validate_verification_registry gains scripts/rec_trailer.py, scripts/roadmap/approved_text.py and docs/plans/PLAN-*.yaml
      (needed: an edit to a plan's graduation step ids or bundled list changes the route's answer; scripts/ops_portal/**
      already covers trailer_closure_gate.py; it now reads
      bundled_recommendations and graduation_check_ids).
  - file: tests/checks/verification/test__manifest.py
    action: Modify
    purpose: >-
      Append two test methods, one per Entry, asserting the newly added globs (validate_merge_step:
      scripts/ops_portal/**; validate_verification_registry: scripts/rec_trailer.py,
      scripts/roadmap/approved_text.py and docs/plans/PLAN-*.yaml); existing nodes, including test_verification_registry_is_gated_on_its_full_closure, are
      unchanged, so graduated shard vp-replay-registered-in-both-tiers is kept.
  - file: tests/checks/verification/test__implementation_merge.py
    action: Create
    purpose: Fixture-repo tests for the resolver, positive and every negative condition.
  - file: tests/checks/verification/test_validate_late_closure.py
    action: Create
    purpose: >-
      Fixture-repo tests for both checks on the late-closure route and the unchanged normal path (new file: test_differential.py is 519 lines and test_session_merge_step.py 494, and
      the route's fixtures are shared across both checks).
  - file: tests/test_session_merge_step_late_closure.py
    action: Create
    purpose: premerge and readback late-closure tests with a stubbed reader.
  - file: docs/plans/PLAN-late-closure-gates.yaml
    action: Create
    purpose: This plan.
bundled_recommendations: []
followon_recs:
  - rec-4841
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    find_implementation_merge returns the unique implementation merge and returns None (or raises LateClosureError on
    two filtered candidates) for each negative condition, including an empty bundled set; late_closure_route refuses a branch trailer, any extra changed file,
    and a shard id outside the plan's graduation_check_ids.
  - >-
    validate_verification_registry admits a late-closure shard that fails at X^ and passes at HEAD, still rejects it as
    tautological when the route does not resolve, and keeps origin/main for every other added or modified row.
  - >-
    validate_merge_step passes a closure-only branch with no trailer when the route resolves, and fails exactly as today
    with no route, with a branch trailer, with an extra file, or for a plan with an approved-text sidecar.
  - >-
    merge_step premerge fails closed on an unavailable reader, an open rec, or a resolution naming another sha; readback
    prints OK for the closure merge and for X once the plan is declared on origin/main.
  - Against the real repository, the resolver finds 6993f383 for PLAN-deferred-policy-digest at origin/main.
  - >-
    The two assertion changes are confined to the late-closure route (VP 2's normal-path cases prove no other row's
    base or leg (T) result changes) and are both recorded under Decision 235 clause 1 (see context): validate_merge_step leg (T)'s alternate satisfier, and validate_verification_registry's differential
    base X^ in place of origin/main for a late-closure shard. No other row's base changes.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Resolver tests.
    command: bin/venv-python -m pytest -q tests/checks/verification/test__implementation_merge.py
    expected: >-
      exit 0. Fails before the change (the module does not exist). Covers unique anchor, zero anchors, two anchors
      (raises), plan-only anchor diff, anchor diff outside plan scope, plan declared at the anchor, empty bundled list,
      trailer set unequal to bundled, a trailer on a commit before the plan was added, branch trailer present, extra
      changed file, foreign shard id, a plan with an approved-text sidecar at the base (None), a squash that both adds the plan and carries the trailer (None), find_implementation_merge itself returning None
      for an empty-bundled plan with
      several trailer-less scope-touching commits after it was added, and a closure diff that also edits the plan in any other way (a VP step added, a
      graduation_check_id edited, bundled_recommendations edited, any other field changed), each giving no route.
    fix_if: Fix the resolver; never relax a negative case.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: late-closure-resolver
  - step: 2
    phase: pre-deploy
    action: Both checks on the route and on the normal path.
    command: bin/venv-python -m pytest -q tests/checks/verification/test_validate_late_closure.py
    expected: >-
      exit 0. Fails before the change. Includes a shard rejected as tautological against origin/main without the route,
      the same shard admitted against X^ with it, a modified shard still compared against origin/main, a shard whose id
      the closure PR itself added to the plan's graduation_check_ids still compared against origin/main (rejected), a
      sidecar-bearing plan's closure diff failing leg (T) exactly as today, and a LateClosureError failing both checks with a message naming the plan and the competing commits, the merge-step
      leg failing with a branch trailer present or with any plan edit beyond the flip, an uncommitted
      late-closure flip printing PENDING for its shards, and a normal-path plan with an uncommitted flip, including one
      with bundled_recommendations empty, still running its added shard's differential against origin/main (rejected
      when tautological). A named test, test_run_differential_honours_base_ref, asserts run_differential's revert leg
      uses base_ref, that the default stays origin/main, and that the admitted reason carries the resolved full sha
      (not the ref spelling), which VP 6's grep relies on.
    fix_if: Fix the check wiring; never weaken the normal path.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: late-closure-gates-checks
  - step: 3
    phase: pre-deploy
    action: Session verb premerge and readback.
    command: bin/venv-python -m pytest -q tests/test_session_merge_step_late_closure.py
    expected: >-
      exit 0. Fails before the change. premerge exits non-zero on a reader error, a missing row, an open rec, or a
      resolution naming another sha; readback prints OK for the closure merge (late-closure satisfied-by=X) and for X
      once the plan is declared on origin/main (late-closed); a sidecar-bearing plan gets no
      late-closure premerge route (today's TRAILER MISMATCH); recover on a closure-merge sha
      refuses with exit 2.
    fix_if: Fix merge_step; a reader failure must never pass.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: late-closure-merge-step-session
  - step: 4
    phase: pre-deploy
    action: Existing suites for the four modules still pass.
    command: >-
      bin/venv-python -m pytest -q tests/checks/verification/test_validate_merge_step.py
      tests/checks/verification/test_validate_verification_registry.py tests/verification_graduation/
      tests/test_session_merge_step.py tests/checks/verification/test_validate_differential_gate_baseline.py
      tests/checks/verification/test__manifest.py
    expected: exit 0 with no existing test assertion edited (test__manifest.py may gain appended pre_globs pins only).
    fix_if: A changed existing assertion is a weakening; fix the code.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      Re-runs the existing suites that already run in the fast tier through their own manifest selection; a shard
      for them would duplicate those guards.
  - step: 5
    phase: pre-deploy
    action: Real history resolves the motivating anchor.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.checks.verification._implementation_merge import
      find_implementation_merge as f; m=f('docs/plans/PLAN-deferred-policy-digest.yaml', Path('.'), 'origin/main');
      assert m and m.sha.startswith('6993f383'), m; print('ANCHOR', m.sha, m.parent)"
    expected: Prints ANCHOR 6993f383e62db29953b60c4cc53e339db20c07c8 followed by its parent sha.
    fix_if: Wrong or no anchor means the history scan or a condition is wrong.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Non-hermetic: it pins one fact of this repository's real history (needs a full clone and origin/main); the
      behaviour it exercises is the step 1 fixture-repo resolver tests' graduated guard.
  - step: 6
    phase: pre-deploy
    action: >-
      Real closure dry run, self-contained, run after the local build commit (the clone sees committed state only). In
      a throwaway clone (with the session's .venv symlinked in, so an interpreter gap is never misread as a plan
      defect; never a worktree, which would share refs with the
      real repo; never pushed) whose origin/main is moved to the build head, so the build's own changes are the base
      and not the diff, apply the
      PLAN-deferred-policy-digest closure (implementation_declared true plus its two test_selector shards, the same
      check ids and node ids the coordinating session prepared), commit it with no trailer, and run the whole fast tier
      there, so every flip-keyed check (validate_verification_registry, validate_merge_step,
      validate_graduation_completeness, validate_vp_replay, validate_scope_boundary, validate_weakening_dispositions)
      judges the real case.
    command: |-
      R=$(git rev-parse --show-toplevel); B=$(git rev-parse HEAD); WT=$(mktemp -d)/clone; LOG="$WT.log"
      ( set -euo pipefail
      git clone -q --no-hardlinks "$R" "$WT"; cd "$WT"; [ "$PWD" = "$WT" ]
      git checkout -q --detach "$B"; git update-ref refs/remotes/origin/main "$B"
      ln -s "$R/.venv" .venv; echo .venv >> .git/info/exclude
      "$R/bin/venv-python" - <<'PY'
      import pathlib, yaml
      plan = pathlib.Path("docs/plans/PLAN-deferred-policy-digest.yaml")
      plan.write_text(plan.read_text(encoding="utf-8").rstrip("\n") + "\nimplementation_declared: true\n", encoding="utf-8")
      assert yaml.safe_load(plan.read_text(encoding="utf-8"))["implementation_declared"] is True
      shards = {
          "deferred-policy-digest-rebuild": ("scripts/ci/terraform_plan_policy_rebuild.py", "tests/test_terraform_plan_digest_deferred_statements.py::test_rebuilt_statements_equal_the_provider_json"),
          "deferred-policy-digest-values-stripped": ("scripts/ci/terraform_plan_digest.py", "tests/test_subagent_plan_review_values_stripped.py::test_deferred_document_reaches_the_reviewer_rebuilt_without_values"),
      }
      for cid, (target, node) in shards.items():
          row = {"check_id": cid, "primitive_slot": "test_selector", "guard_target": target, "plan_slug": "deferred-policy-digest", "graduated_at": "2026-11-02", "graduated_by": "implement-agent", "check_spec": {"node_id": node}}
          pathlib.Path(f"config/agent/verification_registry/entries/{cid}.yaml").write_text(yaml.safe_dump(row, sort_keys=False), encoding="utf-8")
      PY
      git add -- docs/plans/PLAN-deferred-policy-digest.yaml config/agent/verification_registry/entries/deferred-policy-digest-rebuild.yaml config/agent/verification_registry/entries/deferred-policy-digest-values-stripped.yaml
      test "$(git status --porcelain --untracked-files=no | grep -vc '^A \|^M ')" -eq 0
      git -c commit.gpgsign=false -c user.name=dry -c user.email=dry@invalid commit --no-verify -q -m "dry run: deferred-policy-digest closure"
      test "$(git diff --name-only HEAD~1 HEAD | wc -l)" -eq 3
      set +e; "$R/bin/venv-python" -m scripts.validate --pre > "$LOG" 2>&1; rc=$?; set -e
      P=$(git rev-parse 6993f383^)
      grep -q "LATE-CLOSURE" "$LOG"; grep -q "admitted: deferred-policy-digest-rebuild.*$P" "$LOG"; grep -q "admitted: deferred-policy-digest-values-stripped.*$P" "$LOG"; test $rc -eq 0
      echo LATE_CLOSURE_DRY_RUN_OK ); ok=$?; echo "log: $LOG"; exit $ok
    expected: >-
      Prints LATE_CLOSURE_DRY_RUN_OK: validate --pre exits 0 in the clone, the merge-step check prints LATE-CLOSURE
      naming 6993f383, and the registry prints both shards admitted against 6993f383's parent. If the coordinating
      session's prepared shards differ in node id or guard_target, use theirs. The --pre run can approach the 10-minute
      foreground cap: run this step backgrounded and read the printed log path. The command exits non-zero unless the
      sentinel printed. The body runs in a set -e subshell that asserts it is inside the clone before any git write, so
      no step can touch the real repository; the closure commit holds exactly the three named paths (asserted), and
      .venv is excluded via the clone's .git/info/exclude.
    fix_if: >-
      A rejection by one of the six named flip-keyed checks means the route does not fit the real case; stop and report
      it as a plan defect (amendment mode), never widen the route to fit. A failure in any other check is treated as
      environmental first (the fresh clone lacks gitignored local files): diagnose it before calling it a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Depends on origin/main still lacking the deferred-policy-digest closure; steps 1-3 carry the graduated fixture
      guards.
  - step: 7
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0.
    fix_if: Fix the failure; never weaken a check.
    hermetic: false
    graduation: not-applicable
    # whole-tier run; graduating scripts.validate itself is circular (VP-replay recursion refusal)
  - step: 8
    phase: pre-deploy
    action: >-
      Full tier on the committed, rebased, clean head, started BACKGROUNDED with a 2 h limit from the top-level session
      (never a subagent; it exceeds the 10-minute foreground cap); on its completion notice, run the verdict command.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The background run ends with the final Validation Summary (scope all) PASS; the verdict is verify-head exit 0
      for the pushed HEAD, never a pipe's exit status.
    fix_if: Fix and rerun from the start.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/verification/_implementation_merge.py
    behavior: Unique, evidence-bound anchor; every refusal condition.
    verification_step: 1
    test_selector: tests/checks/verification/test__implementation_merge.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/verification_graduation.py
    behavior: run_differential honours base_ref; default stays origin/main.
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_late_closure.py::test_run_differential_honours_base_ref
    red_green_expectation: red before (no base_ref parameter), green after
  - source: scripts/checks/verification/validate_verification_registry.py
    behavior: Per-row base; X^ only for an added, plan-owned late-closure shard.
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_late_closure.py
    red_green_expectation: red before (tautological rejection), green after
  - source: scripts/checks/verification/validate_merge_step.py
    behavior: Alternate satisfier only for a closure-only, trailer-free branch with a resolved anchor.
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_late_closure.py
    red_green_expectation: red before (equality failure), green after
  - source: scripts/session/merge_step.py
    behavior: Fail-closed warehouse leg; late-closure readback lines.
    verification_step: 3
    test_selector: tests/test_session_merge_step_late_closure.py
    red_green_expectation: red before, green after
  - source: scripts/checks/verification/_manifest.py
    behavior: The two Entries' pre_globs cover every file the checks now read.
    verification_step: 4
    test_selector: tests/checks/verification/test__manifest.py
    red_green_expectation: red when the mirror pins a glob the Entry lacks, green after widening
  - source: docs/contracts/git-ops.yaml
    behavior: resolves_trailer LATE CLOSURE clause and merge_step_coverage split; contract_version 11.
    verification_step: 7
    command: bin/venv-python -m scripts.validate --pre
