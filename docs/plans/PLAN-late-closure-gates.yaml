schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "late-closure-gates"
intent: >-
  Let a plan's closure (implementation_declared plus its graduated registry shards) land in its own PR after the
  implementation PR has squash-merged, with every VP step still graduated. Two --pre gates learn one evidence-bound
  route, the plan's implementation merge read from git, and stay unchanged on the normal pre-merge path. Unblocks the
  PLAN-deferred-policy-digest closure (PR #1767, 6993f383, rec-4741).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-late-closure-gates.yaml
phase: >-
  ad_hoc_rec (soft-warn category user_explicit_out_of_scope; no tier_item claimed, so the Tier Item Freshness Gate is
  skipped). Requested by Benjamin 2026-11-02 to unblock the PLAN-deferred-policy-digest closure. Closes no roadmap
  criterion.
closes_criteria: []
scope:
  - file: scripts/checks/verification/_implementation_merge.py
    action: Create
    purpose: >-
      The one late-closure resolver both gates and the session verb share. find_implementation_merge(plan_rel, root,
      ref) returns the plan's implementation merge X from git alone: among first-parent commits of `ref` after the
      commit that added the plan file, the commits whose parse_resolves_trailer set equals the plan's (at ref)
      bundled_recommendations set; exactly one or none (more than one raises LateClosureError). X also must read the plan
      undeclared, must not be refused by trailer_closure_gate.merge_leg_refuses on its diff-tree, and its diff must
      intersect the plan's scope files other than the plan itself, else None. late_closure_route(...) returns X only
      for a CLOSURE-ONLY change: the plan flips to declared against the base, bundled is non-empty, the branch commits
      carry no Resolves trailer, and every changed file is the plan itself or
      config/agent/verification_registry/entries/<id>.yaml for an id in the plan's own graduation_check_ids. Never
      calls push_context_base and adds no second plan-resolution contract: the flip comes from
      _common.resolve_declared_plans / _plan_declared_at_ref (Decisions 148, 159).
    new_imports: [scripts.checks._common, scripts.rec_trailer, scripts.ops_portal.trailer_closure_gate]
  - file: scripts/verification_graduation.py
    action: Modify
    purpose: >-
      run_differential gains base_ref: str = "origin/main", passed to make_worktree_revert_runner; the admitted reason
      names the base. Default call sites are byte-unchanged. If the file's SLOC would exceed 500, decompose (facade
      package, Decision 128) instead of raising a budget.
  - file: scripts/checks/verification/validate_verification_registry.py
    action: Modify
    purpose: >-
      For an ADDED shard only, whose plan_slug names a plan with a late_closure_route X and whose check_id is one of
      that plan's graduation_check_ids, run_differential(row, base_ref=X^). Every modified row and every other added
      row keeps origin/main. LateClosureError is a failure naming the plan and the competing commits. Prints the base
      per admitted row.
    new_imports: [scripts.checks.verification._implementation_merge]
  - file: scripts/checks/verification/validate_merge_step.py
    action: Modify
    purpose: >-
      Leg (T): when the branch trailer union is empty and late_closure_route returns X, the bundled set is satisfied by
      X's trailer, and the check prints LATE-CLOSURE naming X. Every other case runs today's equality check unchanged; a
      branch trailer with a route present still fails as today (never a superset). LateClosureError is a failure. Leg
      (A) is untouched.
    new_imports: [scripts.checks.verification._implementation_merge]
  - file: scripts/session/merge_step.py
    action: Modify
    purpose: >-
      The warehouse leg the credential-free pr-validate job cannot run. premerge: with a late-closure route X at HEAD,
      the message must parse to no trailer, and each bundled rec, read through fetch_recs_by_ids (recs_by_ids,
      Decision 215), must be status closed with a resolution naming X's full sha. A reader error, a missing row, an
      open rec or a different sha fails (exit 1); it never falls back to the acceptance preview. readback --sha <closure
      merge> prints READBACK OK ... late-closure satisfied-by=X. readback --sha X, once the plan reads declared on
      origin/main and find_implementation_merge at origin/main returns X, prints READBACK OK ... late-closed; every other
      undeclared case keeps today's UNEXPECTED line and remedy. recover is unchanged.
    new_imports: [scripts.checks.verification._implementation_merge]
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      resolves_trailer gains a LATE CLOSURE clause (the route's conditions; the closure PR carries no trailer, so the
      trailer-census and trailer-closure jobs stay inert and no second closure path exists, Decision 201);
      merge_step_coverage names the git-only mechanical leg and the procedural warehouse leg in premerge, whose residual
      owner is rec-4755. contract_version 10 -> 11 with an amendment_log row.
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      A governance note: the differential base is origin/main except the late-closure route's X^; the Decision 176
      residual (reverting X does not revert its shards; the closure commit is its revert partner). contract_version 6 -> 7
      with an amendment_log row.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      Widen the pre_globs of the validate_merge_step and validate_verification_registry Entries to cover the new helper
      and its imports (scripts/checks/verification/_implementation_merge.py, scripts/rec_trailer.py,
      scripts/ops_portal/trailer_closure_gate.py), so a later edit to any of them selects both checks in --pre.
  - file: tests/checks/verification/test__manifest.py
    action: Modify
    purpose: >-
      Mirror test for the widened pre_globs, if the mirror pins them; append only, existing nodes unchanged, so graduated
      shard vp-replay-registered-in-both-tiers is kept.
  - file: tests/checks/verification/test__implementation_merge.py
    action: Create
    purpose: Fixture-repo tests for the resolver, positive and every negative condition.
  - file: tests/checks/verification/test_validate_late_closure.py
    action: Create
    purpose: >-
      Fixture-repo tests for both checks on the late-closure route and the unchanged normal path (new file: the existing
      registry, differential and session test files are near 500 lines).
  - file: tests/test_session_merge_step_late_closure.py
    action: Create
    purpose: premerge and readback late-closure tests with a stubbed reader.
  - file: docs/plans/PLAN-late-closure-gates.yaml
    action: Create
    purpose: This plan.
bundled_recommendations: []
followon_recs:
  - rec-4841
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    find_implementation_merge returns the unique implementation merge and returns None (or raises LateClosureError on
    two candidates) for each negative condition; late_closure_route refuses a branch trailer, any extra changed file,
    and a shard id outside the plan's graduation_check_ids.
  - >-
    validate_verification_registry admits a late-closure shard that fails at X^ and passes at HEAD, still rejects it as
    tautological when the route does not resolve, and keeps origin/main for every other added or modified row.
  - >-
    validate_merge_step passes a closure-only branch with no trailer when the route resolves, and fails exactly as today
    with no route, with a branch trailer, or with an extra file.
  - >-
    merge_step premerge fails closed on an unavailable reader, an open rec, or a resolution naming another sha; readback
    prints OK for the closure merge and for X once the plan is declared on origin/main.
  - Against the real repository, the resolver finds 6993f383 for PLAN-deferred-policy-digest at origin/main.
  - >-
    The leg (T) alternate satisfier is the only behaviour change on validate_merge_step and is confined to the
    late-closure route; Benjamin approved it as a planned change under Decision 235 clause 1 (see context).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Resolver tests.
    command: bin/venv-python -m pytest -q tests/checks/verification/test__implementation_merge.py
    expected: >-
      exit 0. Fails before the change (the module does not exist). Covers unique anchor, zero anchors, two anchors
      (raises), plan-only anchor diff, anchor diff outside plan scope, plan declared at the anchor, empty bundled list,
      trailer set unequal to bundled, a trailer on a commit before the plan was added, branch trailer present, extra
      changed file, foreign shard id.
    fix_if: Fix the resolver; never relax a negative case.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: late-closure-resolver
  - step: 2
    phase: pre-deploy
    action: Both checks on the route and on the normal path.
    command: bin/venv-python -m pytest -q tests/checks/verification/test_validate_late_closure.py
    expected: >-
      exit 0. Fails before the change. Includes a shard rejected as tautological against origin/main without the route,
      the same shard admitted against X^ with it, a modified shard still compared against origin/main, and the
      merge-step leg failing with a branch trailer present.
    fix_if: Fix the check wiring; never weaken the normal path.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: late-closure-gates-checks
  - step: 3
    phase: pre-deploy
    action: Session verb premerge and readback.
    command: bin/venv-python -m pytest -q tests/test_session_merge_step_late_closure.py
    expected: exit 0. Fails before the change. A reader error is a non-zero premerge exit.
    fix_if: Fix merge_step; a reader failure must never pass.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: late-closure-merge-step-session
  - step: 4
    phase: pre-deploy
    action: Existing suites for the four modules still pass.
    command: >-
      bin/venv-python -m pytest -q tests/checks/verification/test_validate_merge_step.py
      tests/checks/verification/test_validate_verification_registry.py tests/verification_graduation/test_differential.py
      tests/test_session_merge_step.py tests/checks/verification/test_validate_differential_gate_baseline.py
    expected: exit 0 with no test edited.
    fix_if: A changed existing assertion is a weakening; fix the code.
    hermetic: true
    expected_literals: []
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Real history resolves the motivating anchor.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.checks.verification._implementation_merge import
      find_implementation_merge as f; m=f('docs/plans/PLAN-deferred-policy-digest.yaml', Path('.'), 'origin/main');
      assert m and m.sha.startswith('6993f383'), m; print('ANCHOR', m.sha, m.parent)"
    expected: Prints ANCHOR 6993f383e62db29953b60c4cc53e339db20c07c8 followed by its parent sha.
    fix_if: Wrong or no anchor means the history scan or a condition is wrong.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Real closure dry run: a scratch worktree of the build head with the PLAN-deferred-policy-digest closure applied
      (implementation_declared true plus the two shards the coordinating session prepared) committed with no trailer;
      run both checks there.
    command: >-
      bin/venv-python -c "from scripts.checks.verification.validate_verification_registry import
      validate_verification_registry as a; from scripts.checks.verification.validate_merge_step import
      validate_merge_step as b; f=[]; a(f); b(f); assert not f, f; print('LATE_CLOSURE_DRY_RUN_OK')"
    expected: >-
      Run inside that worktree: both checks PASS, the registry prints admitted against 6993f383's parent for
      deferred-policy-digest-rebuild and deferred-policy-digest-values-stripped, merge-step prints LATE-CLOSURE.
    fix_if: A rejection here means the route does not fit the real case; stop and report.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0.
    fix_if: Fix the failure; never weaken a check.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Full tier on the committed head.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      exit 0 and the final Validation Summary (scope all) reads PASS; verify-head exit 0.
    fix_if: Fix and rerun from the start.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/verification/_implementation_merge.py
    behavior: Unique, evidence-bound anchor; every refusal condition.
    verification_step: 1
    test_selector: tests/checks/verification/test__implementation_merge.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/verification_graduation.py
    behavior: run_differential honours base_ref; default stays origin/main.
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_late_closure.py
    red_green_expectation: red before (no base_ref parameter), green after
  - source: scripts/checks/verification/validate_verification_registry.py
    behavior: Per-row base; X^ only for an added, plan-owned late-closure shard.
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_late_closure.py
    red_green_expectation: red before (tautological rejection), green after
  - source: scripts/checks/verification/validate_merge_step.py
    behavior: Alternate satisfier only for a closure-only, trailer-free branch with a resolved anchor.
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_late_closure.py
    red_green_expectation: red before (equality failure), green after
  - source: scripts/session/merge_step.py
    behavior: Fail-closed warehouse leg; late-closure readback lines.
    verification_step: 3
    test_selector: tests/test_session_merge_step_late_closure.py
    red_green_expectation: red before, green after
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - Normal pre-merge path byte-unchanged; no existing test assertion edited (Decisions 181, 235).
  - The flip is read only through _common.resolve_declared_plans / _plan_declared_at_ref (Decision 148); push_context_base stays the single diff-base resolver (Decision 159).
  - 500-SLOC limit; decompose, never raise (Decision 128).
context:
  - "Decision-scout verdict FLAGS_FOUND. CITE: 181, 201, 148, 159, 55, 215, 128. Flags: 235 NOTE, 132 SPIRIT NOTE, 176 SPIRIT NOTE. Decisions triaged: 193 of 193. Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2"
  - "Motivating case: PR #1767, merge 6993f383, rec-4741 closed with resolution naming that sha (run 41459638985); the plan reads implementation_declared absent at 6993f383."
  - "pr-validate has no AWS credentials (.github/workflows/ci.yml), so the --pre leg is git-only and the rec-status leg is premerge's."
  - "Base precedent: validate_graduation_completeness.py takes push_context_base(root) or origin/main; X^ is a per-row baseline, not a diff base."
  - "Related, not bundled: rec-3776 / rec-2998 (test_selector admitted by file absence) apply to X^ as to origin/main."
  - "Decision 235 clause 1: Benjamin approved leg (T)'s alternate satisfier as a planned change, 2026-11-02, in this /plan session; acceptance_criteria[5] carries it. No existing test is edited, so no weakening_dispositions row."
  - "Scout flags: 235 handled above; 132 preventive half deferred to rec-4841 (A --pre arm plus C closing-end refusal, Fable consult 2026-11-02); 176 revert residual recorded in the verification-registry.yaml note."
  - "fork: preventive control for a trailer merged without the declaration flip | chosen: A+C as follow-on rec-4841 | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: followon_recs"
  - "fork: closure-PR transport | chosen: evidence-bound alternate satisfier, never a second trailer (keeps CARRIER) | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: scope rows validate_merge_step.py, git-ops.yaml"
  - "fork: anchor source | chosen: derived from git only, no plan field | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: scope row _implementation_merge.py"
  - "fork: residual owner of the procedural premerge rec-status leg | chosen: rec-4755 | class: consistency-only | precedent: docs/contracts/git-ops.yaml | precedent_kind: contract | reversible: yes | persisted: git-ops.yaml merge_step_coverage"
  - "Size: verification_graduation.py 487/500 SLOC and verification-registry.yaml 493/500 effective lines (NEAR_CAP at plan time); measure against main at build time and decompose or compact an existing note, never raise. git-ops.yaml is also scoped by unbuilt PLAN-merge-race-attestation and PLAN-retire-strategic-plans-and-legacy-executor; whichever builds second rebases."
  - "Owner: this planning session (session_01G2j5RiqkNwJSkzA9Vk4U6m); coordinator session_01G2j5RhrWVwt8bduvsXQwgW. Sequencing: this plan's build lands before the PLAN-deferred-policy-digest closure."
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Write _implementation_merge.py and its tests (VP 1).
  - Thread base_ref through run_differential; wire validate_verification_registry and validate_merge_step; tests (VP 2).
  - Extend merge_step premerge/readback; tests (VP 3).
  - >-
    Contract clauses in git-ops.yaml and verification-registry.yaml. Relief step: measure verification-registry.yaml's
    effective lines against main first and compact an existing governance note so the file stays at or under 500.
  - Widen the two Entries' pre_globs in scripts/checks/verification/_manifest.py and its mirror test.
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - 'Report: what was implemented, verification results'
work_areas: []
