  - "Consequences for the other consumers, checked on the prototype: validate_merge_step calls the route only for rec-bundling plans (no change); merge_step premerge on a no-rec sidecar closure prints PREMERGE LATE-CLOSURE OK recs [] closed by X and passes, as it passed before; merge_step recover now refuses a no-rec sidecar closure merge as a late closure (no recs to recover there)."
