gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:d91615cd2c81193c88e87ea70b33af2f5272c54742f406b0e04f77719dc82e59"}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-late-closure-sidecar-base.yaml; on blocked, stop and report."
  - scripts/checks/verification/_implementation_merge.py -- add sidecar_landing_merge and wire it per its scope row; VP 2, VP 7.
  - tests/checks/verification/test_validate_verification_registry_late_closure_unbundled.py and the test__implementation_merge.py nodes per their scope rows; VP 1, VP 3.
  - >-
    docs/contracts/git-ops.yaml -- (a) in resolves_trailer LATE CLOSURE replace "after the plan's anchor merge X (the
    squash that carried its trailer)." with "after the plan's build merge X."; (b) replace "the plan has bundled recs
    (a sidecar's words are checked by approved_text_binding LANDED), and `_implementation_merge.find_implementation_merge`
    finds exactly one X in git (first-parent, trailer set equal to the bundled set, plan undeclared there, diff
    intersecting the plan's scope, not refused by `merge_leg_refuses`; two such commits fail closed)." with "and git
    yields one X: with bundled recs, the commit `_implementation_merge.find_implementation_merge` admits under its
    guards (two fail closed); else its sidecar's LANDED commit (approved_text_binding); with neither, no route.";
    (c) contract_version 17 -> 18; (d) directly after the 2026-11-17 PLAN-persona-verdict-wake row add {date:
    "2026-11-20", semantic_break: true, change_class: field_add, summary: "PLAN-late-closure-sidecar-base (rec-5470): a
    no-rec plan's LATE CLOSURE X is its sidecar's LANDED commit. contract_version 17 -> 18."}. No other line changes;
    wrapping is free. VP 6.
  - VP 4 and VP 5 on real history.
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55).
  - Graduate VP 1 as late-closure-unbundled-sidecar-base (test_selector, node the new test file).
  - VP 8 full tier, then commit, PR with Resolves rec-5470 in the squash body, merge on green.
  - "Report: what was implemented, verification results; tell the coordinator rec-5382's wake closure can proceed."
rollback: Revert the build commit; no-rec plans fall back to no late-closure route (today's behaviour).
