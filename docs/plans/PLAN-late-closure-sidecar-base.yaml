schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: late-closure-sidecar-base
intent: >-
  rec-5470: give the late-closure route a build merge X for a plan that bundles no recs, so the registry differential
  admits its missing graduation shards against X^ instead of origin/main (where they read tautological). X for such a
  plan is the one commit that landed its approved-text sidecar's words (approved_text.verify_landed, the rule
  validate_merge_step already uses). Unblocks rec-5382's last closure, PLAN-persona-verdict-wake (build #2126,
  4ac3243e). A plan with neither recs nor a sidecar keeps no route.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-late-closure-sidecar-base.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-5470
  (Low); rec-5382 depends on it. Closes no roadmap criterion.
cites: [dec:246, dec:275, dec:279]
scope:
  - file: scripts/checks/verification/_implementation_merge.py
    action: Modify
    purpose: >-
      Add sidecar_landing_merge(plan_rel, root, ref) -> ImplementationMerge | None: slug from the plan path,
      approved_text.load_sidecar_at(ref, slug, root) (ApprovedTextError or no sidecar -> None), then
      approved_text.verify_landed(sidecar, slug, root, ref); exactly one distinct landing sha and no messages -> X with
      parent X^ (rev-parse failure -> None); zero or competing landing commits -> None (validate_merge_step leg A
      reports them on the same PR). late_closure_route's last guard becomes: no bundled recs -> sidecar_landing_merge,
      else find_implementation_merge as today. The closure-only guards before it are unchanged. Module docstring: the
      resolver serves every plan, not only rec-bundling ones.
    new_imports: [scripts.roadmap.approved_text]
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Notice class (approval-routing.yaml gates only approved_text_binding here). resolves_trailer LATE CLOSURE names
      the sidecar route, contract_version 17 -> 18, one amendment_log row placed directly after the 2026-11-17
      persona-verdict-wake row. Byte relief is Decision 275 cl.3's second valve: the find_implementation_merge guard
      list moves out of the passage to the code and PLAN-late-closure-gates, which the passage header already cites.
      No amendment_log row is compacted (the only non-exempt full row is the anchored wake row; semantic_break rows
      stay full under cl.4). Exact words in execution_steps; 54534 of 54542 bytes on the draft over 745ef91a.
  - file: tests/checks/verification/test_validate_verification_registry_late_closure_unbundled.py
    action: Create
    purpose: >-
      rec-5470 acceptance: validate_verification_registry over fixture repos for a plan with no bundled recs. A
      sidecar plan's closure shard is admitted against the landing commit's parent, output naming it
      (test_unbundled_sidecar_plan_shard_admitted_against_landing_parent); still admitted when the bound file was
      edited on main after the landing commit (test_unbundled_sidecar_plan_admitted_after_later_edit); a
      working-tree-only closure prints PENDING; a plan with no sidecar, and a sidecar plan whose words never landed,
      stay tautological failures (the residual, pinned).
  - file: tests/checks/verification/test__implementation_merge.py
    action: Modify
    purpose: >-
      Add nodes only: test_unbundled_sidecar_plan_routes_to_landing_commit (red before: None), sidecar_landing_merge
      returns None for no sidecar, a malformed sidecar, words never landed, two competing landing commits and a failed
      parent lookup; a bundled sidecar plan still routes through the trailer merge. No existing node is edited
      (test_empty_bundled_gives_no_route keeps passing: its fixture has no sidecar).
  - file: tests/fixtures/late_closure_repos.py
    action: Modify
    purpose: >-
      Docstring says the fixture also builds no-rec plans; add a helper only if both new test sets need the same
      competing-landing or malformed-sidecar shape. Existing parameters and defaults unchanged.
bundled_recommendations: [rec-5470]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    rec-5470's acceptance passes. The planner re-pointed it (portal update_rec, 2026-11-20 22:05 UTC) from the bare file
    path (undecidable under Decision 201: no ::node_id) to bin/venv-python -m pytest
    tests/checks/verification/test_validate_verification_registry_late_closure_unbundled.py::test_unbundled_sidecar_plan_shard_admitted_against_landing_parent
    tests/checks/verification/test_validate_verification_registry_late_closure_unbundled.py::test_unbundled_sidecar_plan_admitted_after_later_edit
    -q; the whole file still runs in VP 1.
  - >-
    On real history, a scratch late closure of PLAN-persona-verdict-wake (flip plus the two shards rec-5382 names)
    passes validate_verification_registry with both shards admitted against 4ac3243e81^ (d98906cb), and fails as
    tautological without this change (measured on the planning prototype, origin/main 745ef91a).
  - >-
    late_closure_route, find_implementation_merge, ImplementationMerge(sha, parent) and LateClosureError keep their
    names and signatures; rec-bundling plans resolve X exactly as before (every existing node in
    test__implementation_merge.py, test_validate_verification_registry.py, test_validate_merge_step.py,
    tests/test_session_merge_step.py and tests/test_session_merge_step_landed.py passes unedited).
  - >-
    docs/contracts/git-ops.yaml stays at or under 54542 bytes and 500 effective lines, compacts no amendment_log row,
    and passes validate_contract_drift amendment retention; the trailer-range-closure sidecar's anchors (its first amendment_log row contiguity,
    "record. A trailer that readback finds missing goes to", the trailer_acceptance_gate PROVENANCE passage) are
    untouched.
  - scripts/checks/verification/_implementation_merge.py is 100% covered by test__implementation_merge.py alone.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5470 acceptance tests (registry differential for a no-rec plan).
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_registry_late_closure_unbundled.py -q
    expected: >-
      exit 0. Red before: the file does not exist. Against the pre-change resolver the admitted, later-edit and
      PENDING nodes fail as tautological; the two residual nodes pass either way.
    fix_if: Fix _implementation_merge; never loosen an assertion.
    hermetic: true
    expected_literals: [passed]
    graduation: graduate
    graduation_check_id: late-closure-unbundled-sidecar-base
  - step: 2
    phase: pre-deploy
    action: Late-closure resolver unit tests.
    command: bin/venv-python -m pytest tests/checks/verification/test__implementation_merge.py -q
    expected: >-
      exit 0. test_unbundled_sidecar_plan_routes_to_landing_commit fails before the change (None); every existing node
      passes unedited.
    fix_if: Fix sidecar_landing_merge or late_closure_route.
    hermetic: true
    expected_literals: [passed]
    graduation: waive
    graduation_waiver_reason: Covered by the existing whole-file shard late-closure-resolver (tests/checks/verification/test__implementation_merge.py).
  - step: 3
    phase: pre-deploy
    action: Every other consumer of late_closure_route, unedited.
    command: >-
      bin/venv-python -m pytest -q tests/checks/verification/test_validate_verification_registry.py
      tests/checks/verification/test_validate_merge_step.py tests/test_session_merge_step.py
      tests/test_session_merge_step_landed.py
    expected: >-
      exit 0 with no node added, removed or edited (144 passed on the prototype, about 19 s locally; the merge-step
      session files dominate).
    fix_if: A changed assertion is a weakening; fix the code.
    hermetic: true
    expected_literals: [passed]
    graduation: waive
    graduation_waiver_reason: >-
      Covered by existing shards (merge-step-check-tests, merge-step-verb-tests, late-closure-merge-step-session,
      approved-text-landed-premerge and the registry-file node shards); this step only shows they still pass.
  - step: 4
    phase: pre-deploy
    action: Real history resolves the no-rec plans' landing commits, read in a detached worktree at origin/main.
    command: >-
      bash -c 'set -e; R=$(pwd); T=$(mktemp -d); trap "git worktree remove --force $T" EXIT; git worktree add -q
      --detach "$T" origin/main; cp scripts/checks/verification/_implementation_merge.py "$T/scripts/checks/verification/";
      cd "$T"; "$R/bin/venv-python" -c "from pathlib import Path; from scripts.checks.verification import
      _implementation_merge as im; [print(s, im.sidecar_landing_merge(f\"docs/plans/PLAN-{s}.yaml\", Path(\".\"),
      \"origin/main\")) for s in (\"persona-verdict-wake\", \"persona-verdict-chain\", \"approved-text-landed-words\")]"'
    expected: >-
      wake prints sha 4ac3243e81... with parent d98906cb..., chain 4aecbb4441... with parent fe6111c7..., and
      approved-text-landed-words None (its build declared the plan in the landing commit). Measured on the planning
      prototype at origin/main 745ef91a. Still holds after rec-5382 declares wake (the guard reads the plan at C).
    fix_if: A None for wake or chain means a guard is wrong for real history; fix the resolver, never widen verify_landed.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: End-to-end scratch late closure of PLAN-persona-verdict-wake on real history.
    command: >-
      bash -c 'set -e; R=$(pwd); P=docs/plans/PLAN-persona-verdict-wake.yaml; E=config/agent/verification_registry/entries;
      if git show "origin/main:$P" | grep -q "^implementation_declared: true"; then echo "SKIP wake already declared"; exit 0; fi;
      T=$(mktemp -d); trap "git worktree remove --force $T" EXIT; git worktree add -q --detach "$T" origin/main;
      printf "check_id: persona-verdict-wake-verb\nprimitive_slot: test_selector\nguard_target: scripts/personas/wake.py\nguard_symbol: null\ncheck_spec:\n  node_id: tests/personas/test_wake.py\nplan_slug: persona-verdict-wake\ngraduated_at: \"2026-11-20\"\ngraduated_by: implement-agent\n" > "$T/$E/persona-verdict-wake-verb.yaml";
      printf "check_id: persona-verdict-wake-shape\nprimitive_slot: test_selector\nguard_target: scripts/checks/ci_guards/validate_persona_verdict_chain.py\nguard_symbol: null\ncheck_spec:\n  node_id: tests/checks/ci_guards/test_validate_persona_verdict_chain.py::test_red_fixture_is_refused[wake-missing]\nplan_slug: persona-verdict-wake\ngraduated_at: \"2026-11-20\"\ngraduated_by: implement-agent\n" > "$T/$E/persona-verdict-wake-shape.yaml";
      printf "implementation_declared: true\n" >> "$T/$P"; git -C "$T" add "$P" "$E";
      git -C "$T" -c user.name=vp -c user.email=vp@example.invalid commit -q --no-verify -m "declare wake";
      cp scripts/checks/verification/_implementation_merge.py "$T/scripts/checks/verification/"; cd "$T";
      "$R/bin/venv-python" -c "from pathlib import Path; from scripts.checks.verification.validate_verification_registry
      import validate_verification_registry as v; f=[]; v(f, root=Path(\".\")); print(\"FAILED\", f) if f else print(\"REGISTRY_OK\")"'
    expected: >-
      Prints admitted for persona-verdict-wake-shape and persona-verdict-wake-verb, each with late-closure base
      d98906cb276ed169bc961da1ae8b9d0ce3a8c9a8, then REGISTRY_OK (measured on the planning prototype: about 4 s; the
      same scratch without the change prints FAILED ... revert did not produce FAIL (tautological) for both). The
      resolver copy is left uncommitted on purpose, so base..HEAD holds only the plan and the two shards. If rec-5382
      has declared wake by then, it prints SKIP and is recorded as such.
    fix_if: Fix the resolver; never edit the wake plan, its sidecar or the shard recipe here.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: git-ops.yaml size, lines, anchors and the fast tier.
    command: >-
      wc -c docs/contracts/git-ops.yaml && grep -cvE '^\s*$|^\s*#' docs/contracts/git-ops.yaml && grep -c 'record. A
      trailer that readback finds missing goes to' docs/contracts/git-ops.yaml && bin/venv-python -m scripts.validate --pre
    expected: >-
      At most 54542 bytes (54534 on the planning draft over 745ef91a), at most 500 effective lines (490 on the draft),
      the anchor count 1, and --pre exit 0 (validate_contract_drift retention, validate_git_ops_contract and the
      structural size budgets included).
    fix_if: >-
      Re-wrap or tighten the new words (main may have moved; re-measure); never raise a budget or compact a
      semantic_break row; if no citation relief is left, stop and report to the planner.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Coverage of the changed module from its mapped test file.
    command: >-
      bin/venv-python -m pytest -q tests/checks/verification/test__implementation_merge.py
      --cov=scripts.checks.verification._implementation_merge --cov-report=term-missing --cov-fail-under=100 -o addopts=""
    expected: exit 0 at 100% (measured 100% on origin/main before the change).
    fix_if: Add the missing node; never a coverage baseline entry.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Full tier on the committed, rebased tree before handoff (git-ops.yaml handoff_sequence).
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The full tier completes and validation_result --verify-head attests HEAD's tree with exit 0. Start it backgrounded
      with a 2 h limit from the top-level session; tests/test_aws_profile.py needs HOME set to an empty directory.
    fix_if: Fix the failing check on the branch; never skip, disable or quarantine a test.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: rec-5470 closed by the merge trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c;
      print(c.fetch_recs_by_ids(c.make_reader(), ['rec-5470'])[0][0]['status'])"
    expected: closed (trailer-closure job on the merge commit).
    fix_if: Follow git-ops.yaml resolves_trailer (readback, then recover); never a manual close after an acceptance refusal.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/verification/_implementation_merge.py
    behavior: late_closure_route resolves a no-rec plan's X as its sidecar's one landing commit; rec-bundling plans unchanged
    verification_step: 2
    test_selector: tests/checks/verification/test__implementation_merge.py::test_unbundled_sidecar_plan_routes_to_landing_commit
    red_green_expectation: red before (None), green after
  - source: docs/contracts/git-ops.yaml
    behavior: LATE CLOSURE prose names the sidecar route; size and retention limits hold
    verification_step: 6
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Notice-class prose with no executable behaviour; the guarded properties are byte, line and amendment-retention
      limits that validate --pre already enforces.
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - Do not edit scripts/roadmap/approved_text.py (rec-5471's planner edits its CLI concurrently); call only
    load_sidecar_at and verify_landed, whose names, signatures and return shapes that planner confirmed it keeps.
  - Do not edit validate_verification_registry.py, validate_merge_step.py, scripts/session/merge_step.py or the
    graduation and weakening checks; the registry's no-rec base moves through late_closure_route alone.
  - git-ops.yaml stays at or under 54542 bytes and 500 effective lines; no budget raise; the new amendment_log row goes
    directly after the 2026-11-17 persona-verdict-wake row so trailer-range-closure's anchors stay intact.
  - No existing test node is edited or removed (no weakening candidates).
