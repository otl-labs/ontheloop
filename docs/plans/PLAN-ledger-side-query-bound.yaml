schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ledger-side-query-bound
intent: >-
  Correct the in-session ledger check's oracle so the feedback loop can trust the telemetry it reads (NS.6, T3.3/T3.4
  prerequisite): Claude Code's cost-state ledger credits every model request, including side requests that write no
  transcript record, so for a non-auxiliary model with transcript records the ledger is a superset of the transcript.
  The check compares that model as a declared bound (ledger >= transcript, exact still reported when equal), keeps
  every ledger-below-transcript alarm, and gains a compensating sub-agent linkage check so the bound cannot hide a
  stream the walk never links (rec-4430; rec-4654 stays open).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ledger-side-query-bound.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): rec-4430, a telemetry verification alarm. It is a prerequisite the
  feedback loop needs before it reads cost or token figures (alarm triage 2026-11-10), but no tier_item exit criterion
  is closed, so closes_criteria is empty.
closes_criteria: []
scope:
  - file: scripts/telemetry_verify/ledger.py
    action: Modify
    purpose: >-
      (1) DECLARED gains ledger_bounded_side_query: "a model with transcript records: Claude Code side requests that
      write no transcript record (resume cache warm, sub-agent and away summaries, WebSearch's inner request) credit the
      ledger [inferred, Claude Code 2.1.322 bundle], so a bound" and ledger_interrupted_spawn: "a sub-agent stream no
      spawn record links, paired with an Agent or Task tool_use that has no result before the cut (an interrupted sync
      spawn): its calls are summed into the prefix". ALARMS gains ledger_stream_unlinked. (2) _classify: the auxiliary,
      compaction and background bounds are unchanged. For any other model with transcript records: if the three input
      classes are all equal, the existing output rules run unchanged (ledger_exact, ledger_output_residual_nonfinal,
      ledger_output_residual_unexplained, ledger_output_excess); else if the ledger is at or above the transcript on all
      four classes the class is ledger_bounded_side_query; else if any input class is below,
      ledger_input_class_mismatch; else (inputs at or above, output below) ledger_output_excess. A ledger-only
      non-auxiliary model and a transcript model absent from the ledger stay ledger_model_unexplained. (3) Linkage, one
      helper used by both _prefix and prefix_calls so the two walks stay identical: at each cut, U is the set of Agent
      or Task tool_use ids in the root before the cut and in every included stream (as _included walks them) with no
      tool_result of that id before the cut in the same stream; S is the agent ids in tree.agent_ids() not reached by
      _included whose earliest timestamped record is at or before the latest timestamped root record before the cut.
      When 0 < len(S) <= len(U), every stream in S is summed into the prefix (its responses counted by _add, nested
      spawns inside it followed as _included does, its models not background-bounded) and one Finding per stream with
      cls ledger_interrupted_spawn and model None is appended; when len(S) > len(U), one Finding per stream in S with
      cls ledger_stream_unlinked and model None is appended and none is summed. Counts and ids never leave the module
      except as Finding counts (Decision 101). Module docstring: one sentence each for the bound and the linkage rule.
    new_imports: []
  - file: scripts/telemetry_verify/stored_ledger.py
    action: Modify
    purpose: >-
      _BOUNDED gains ledger_bounded_side_query, so the stored rows of such a model compare as stored <= ledger on all
      four classes (stored_ledger_bounded, else stored_ledger_bound_exceeded) instead of falling to the exact compare.
      Nothing else changes: an interrupted stream's calls, which the producer never stores (src/turn_capture/streams.py
      _spawns_of skips a spawn with no result), stay stored_ledger_call_unemitted (a true producer gap; follow-on rec).
    new_imports: []
  - file: tests/telemetry_verify/test_ledger.py
    action: Modify
    purpose: >-
      In test_cut_bounded_reconciliation_classifies_every_model (pinned by the graduated record
      telemetry-verify-ledger-and-shape-classify), the case _one_call(dict(_LED, inputTokens=11)) changes from
      ledger_input_class_mismatch to ledger_bounded_side_query (the operator-confirmed planned change); every other
      assertion in it stays, including cacheCreationInputTokens=0 (ledger below) as ledger_input_class_mismatch. New
      nodes: test_a_superset_ledger_on_a_transcript_model_is_the_side_query_bound (the alarmed shape: one model, two
      cost-state records, ledger above on input, cache_read and cache_creation, both cuts the bound; plus a sub-agent-only
      model above is the bound); test_a_ledger_below_the_transcript_still_alarms (each input class one below with the
      others above is ledger_input_class_mismatch; output below with inputs above is ledger_output_excess; exact inputs
      with output above and no nonfinal call stays ledger_output_residual_unexplained); test_an_interrupted_sync_spawn_is
      _summed_into_the_prefix (one unanswered Agent tool_use and one unlinked stream before the cut: ledger_interrupted_
      spawn, the stream's calls counted so the main model is ledger_exact, and prefix_calls lists them);
      test_an_unlinked_stream_beyond_the_unanswered_spawns_alarms (two unlinked streams, one unanswered spawn:
      ledger_stream_unlinked twice; a stream whose records start after the cut is not counted; a linked stream never
      is). All trees synthetic (Decision 101).
  - file: tests/telemetry_verify/test_stored_ledger.py
    action: Modify
    purpose: >-
      test_bounded_models_compare_as_bounds iterates ledger_bounded_side_query with the three existing bounds (stored
      at or below the ledger is stored_ledger_bounded, above is stored_ledger_bound_exceeded); red before (the class
      falls to the exact compare and reads stored_ledger_input_class_mismatch).
  - file: tests/telemetry/test_in_session_verify_chain.py
    action: Modify
    purpose: >-
      test_ledger_classes_on_the_resume_trap_and_a_planted_input_mismatch: the plant changes from inputTokens += 1 to
      inputTokens -= 1 (ledger below the transcript), so the same filed ledger_input_class_mismatch alarm, portal class
      list and single file call are still asserted end to end (operator-confirmed planned change; the assertions are
      unchanged, only the plant's sign).
bundled_recommendations: [rec-4430]
followon_recs: [rec-5104, rec-5105]
infrastructure_dependencies: []
acceptance_criteria:
  - "A non-auxiliary model with transcript records whose ledger is at or above the transcript on all four classes, and above on at least one input class, is ledger_bounded_side_query, a declared class; equal stays ledger_exact."
  - "Every ledger-below-transcript case still alarms: an input class below is ledger_input_class_mismatch, output below is ledger_output_excess, and exact inputs with an unexplained output excess stay ledger_output_residual_unexplained; ledger_model_unexplained is unchanged."
  - "An unlinked sub-agent stream before a cut is summed and declared ledger_interrupted_spawn when unanswered Agent or Task spawns account for it, and is the alarm ledger_stream_unlinked otherwise."
  - "The stored-row leg compares a ledger_bounded_side_query model as a bound."
  - "rec-4430 is closed after the post-merge read-back, not by a merge trailer (Decision 201); rec-4654 stays open."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The alarmed shape (a superset ledger on transcript models) is the declared bound.
    command: bin/venv-python -m pytest "tests/telemetry_verify/test_ledger.py::test_a_superset_ledger_on_a_transcript_model_is_the_side_query_bound" -q
    expected: exit 0; red before (node absent, then ledger_input_class_mismatch on both cuts).
    fix_if: either cut reads ledger_input_class_mismatch, or a sub-agent-only model stays exact
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: ledger-side-query-bound
  - step: 2
    phase: pre-deploy
    action: Every ledger-below-transcript case still alarms.
    command: bin/venv-python -m pytest "tests/telemetry_verify/test_ledger.py::test_a_ledger_below_the_transcript_still_alarms" -q
    expected: exit 0; red before (node absent).
    fix_if: any below case reads a declared class (the bound is one-sided only)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: ledger-below-transcript-alarms
  - step: 3
    phase: pre-deploy
    action: Interrupted sync spawns are summed; unlinked streams beyond them alarm.
    command: >-
      bin/venv-python -m pytest
      "tests/telemetry_verify/test_ledger.py::test_an_interrupted_sync_spawn_is_summed_into_the_prefix"
      "tests/telemetry_verify/test_ledger.py::test_an_unlinked_stream_beyond_the_unanswered_spawns_alarms" -q
    expected: exit 0; red before (nodes absent).
    fix_if: an unlinked stream is silently absorbed, a post-cut stream is counted, or prefix_calls and _prefix disagree
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: ledger-stream-linkage
  - step: 4
    phase: pre-deploy
    action: The stored-row leg bounds the new class, and the existing ledger tests (including the changed graduated node) pass.
    command: >-
      bin/venv-python -m pytest tests/telemetry_verify/test_stored_ledger.py::test_bounded_models_compare_as_bounds
      tests/telemetry_verify/test_ledger.py tests/telemetry_verify/test_stored_ledger.py -q
    expected: exit 0; test_bounded_models_compare_as_bounds red before (stored_ledger_input_class_mismatch for the new class).
    fix_if: the new class reads stored_ledger_input_class_mismatch or any existing node fails
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: stored-ledger-side-query-bound
  - step: 5
    phase: pre-deploy
    action: The in-session chain still files ledger_input_class_mismatch end to end on a planted ledger-below record.
    command: bin/venv-python -m pytest "tests/telemetry/test_in_session_verify_chain.py::test_ledger_classes_on_the_resume_trap_and_a_planted_input_mismatch" -q
    expected: exit 0; with the plant still at += 1 and the new rule it fails (no alarm filed), which is why the sign changes.
    fix_if: no alarm is filed, or a second class is filed
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: An existing node whose plant sign changes; it already runs in every tier and pins the alarm path, and a new graduated shard would duplicate it.
  - step: 6
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: any check fails; fix on the branch, never by weakening (Decision 235)
  - step: 7
    phase: pre-deploy
    action: Full tier before handoff (backgrounded, 2 h limit), then its verdict.
    command: bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0 for HEAD
    fix_if: the full tier failed or timed out (BLOCKED; rerun from the start)
  - step: 8
    phase: post-deploy
    action: >-
      Live read-back on post-merge code: in any session started after the merge that has a cost-state record (the build
      session itself, or the next worker the coordinator names), copy the session tree to a scratch directory and
      classify it with the merged check; report counts and class names only.
    command: >-
      bin/venv-python -c "import sys,collections; from pathlib import Path; from scripts.telemetry_verify import ledger;
      from src.turn_capture.transcript import FsTree; f=ledger.reconcile_ledger(FsTree(Path(sys.argv[1])));
      print(dict(collections.Counter(x.cls for x in f))); print([(x.model, {k: x.ledger.get(k,0)-x.transcript.get(k,0)
      for k in ledger.CLASSES}) for x in f if x.model and x.ledger and x.transcript])" "$SCRATCH_COPY_OF_ROOT_JSONL"
    expected: >-
      no alarm class; the per-class excess list printed as counts. If no session has a cost-state record yet, the step
      is BLOCKED and handed to the coordinator, not passed.
    fix_if: any ledger_input_class_mismatch or ledger_stream_unlinked on post-merge code; stop and report
  - step: 9
    phase: post-deploy
    action: >-
      Closure window: three days after the merge, no rec-4430 history version comes from a session started after the
      merge (rec_history scopes joined to telemetry_root_sessions session_started_at); then close rec-4430 with
      update_rec citing the merge SHA, VP 8 and this read.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common import ducklake_reader_client as rc;
      print([h['last_updated_timestamp'] for h in rc.make_reader().named('rec_history', id='rec-4430')][:5])"
    expected: no version later than the merge whose scope's session started after the merge; rec-4430 then reads closed.
    fix_if: a post-merge session alarms; reopen the diagnosis (the mechanism is [inferred]) and do not close
test_obligations:
  - source: scripts/telemetry_verify/ledger.py
    behavior: A superset ledger on a transcript model is the declared bound; every below case alarms; unlinked streams are summed or alarmed.
    verification_step: 1
    test_selector: tests/telemetry_verify/test_ledger.py::test_a_superset_ledger_on_a_transcript_model_is_the_side_query_bound
    red_green_expectation: red before (ledger_input_class_mismatch), green after
  - source: scripts/telemetry_verify/stored_ledger.py
    behavior: The new class compares stored rows as a bound.
    verification_step: 4
    test_selector: tests/telemetry_verify/test_stored_ledger.py::test_bounded_models_compare_as_bounds
    red_green_expectation: red before (stored_ledger_input_class_mismatch), green after
