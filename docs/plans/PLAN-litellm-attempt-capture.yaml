acceptance_criteria:
  - >-
    A turn cut short by the deadline records every attempt the transport made in send order, the call in flight as one
    more entry with outcome cancelled and its selection's provider, billing_shape and started_at_ms, a returned call's
    CallRecord and a completed fresh probe's record, with attempts_known true and the role and failed_over the scope
    row states; a deadline in a retry backoff adds no entry, and a transport that fills no capture keeps attempts
    unknown.
  - >-
    A fail-over whose fallback cold start fails keeps the primary attempts and, when the probe was sent and raised, the
    probe as an attempt entry (attempt 0), on both faces, with the turn record's role primary and failed_over false; a
    probe with no choices or no request adds none.
  - >-
    The events header (schema 2) is emitted once and equals the final header, including on input refusal,
    tool_server_unavailable and BridgeTimeout, where it is followed by the end record.
  - >-
    An error raised while the task is being cancelled, in a call or in the cold-start probe, is never classified or
    retried past the deadline.
  - src/persona_backends imports nothing under scripts, src/telemetry or src/sensitive_values; every changed module
    stays under 500 SLOC and keeps full coverage from its mapped test file.
  - rec-5395 is closed by the merge's Resolves trailer (VP 6).
  - Nothing deploys (VP 4), and no telemetry row is written (VP 3's closure test holds no src/telemetry in run_persona's closure, and the constraints forbid a writer call).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The backend's deadline, fail-over and header paths, through the real backend with a capturing fake.
    command: >-
      bin/venv-python -m pytest
      tests/persona_backends/test_litellm_backend.py::test_deadline_mid_call_records_cancelled_in_flight
      tests/persona_backends/test_litellm_backend.py::test_deadline_in_backoff_adds_no_entry
      tests/persona_backends/test_litellm_backend.py::test_deadline_after_asserted_probe_keeps_probe_record
      tests/persona_backends/test_litellm_backend.py::test_deadline_during_probe_records_cancelled_probe_entry
      tests/persona_backends/test_litellm_backend.py::test_deadline_after_returned_call_keeps_its_record
      tests/persona_backends/test_litellm_backend.py::test_deadline_with_unfilled_capture_keeps_unknown
      tests/persona_backends/test_litellm_backend.py::test_fallback_unavailable_lands_primary_and_probe_attempts
      tests/persona_backends/test_litellm_backend.py::test_first_written_header_is_final
      tests/persona_backends/test_litellm_backend.py::test_early_exits_write_header_then_end
      tests/persona_backends/test_events.py -q
    expected: >-
      Exit 0, every named node passes. Red before (the nodes are absent, so pytest exits 4). The rest of
      tests/persona_backends runs in every tier.
    fix_if: >-
      An ok entry without a record, a cancelled entry missing provider or billing_shape, or two heads: fix the backend,
      never the fake.
    hermetic: false
    graduation: graduate
    graduation_check_id: litellm-attempt-capture-backend
  - step: 2
    phase: pre-deploy
    action: The transport and cold-start capture, cancellation and failed-probe paths, sync and async.
    command: >-
      bin/venv-python -m pytest tests/test_llm_litellm_transport.py::TestCapture
      tests/test_llm_litellm_cold_start.py::TestProbeAttempt -q
    expected: >-
      Exit 0, every node passes. Red before (the classes are absent). Each changed source keeps full coverage from its
      own mapped test file (VP 5's validate_test_coverage).
    fix_if: >-
      A retry after a cancel, an attempt appended before its await returned, or a gate that drops primary attempts: fix
      the transport or cold start, never the fake.
    hermetic: false
    graduation: graduate
    graduation_check_id: litellm-attempt-capture-transport
  - step: 3
    phase: pre-deploy
    action: Import boundaries. src/persona_backends imports nothing under scripts, and run_persona's closure is unchanged.
    command: >-
      bin/venv-python -m pytest tests/persona_backends/test_package_boundary.py
      tests/turn_capture/test_litellm_usage.py::test_run_persona_closure_adds_only_litellm_usage -q &&
      bin/venv-python -m scripts.import_governance --check-contracts
    expected: Exit 0 from both; import-linter reports 0 contracts broken.
    fix_if: Capture importing from scripts; keep it a stdlib dataclass the transport fills by duck typing.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Both halves are standing guards: the boundary and closure tests run in every fast tier and the import-linter run
      is a registered check, so a shard would duplicate them.
  - step: 4
    phase: pre-deploy
    action: >-
      No Lambda artifact bundles a changed path, and no PROD or DuckLake deploy channel watches one (Decision 249 clause
      2). If the persona image channel has built, its publish workflow rebuilds the image after main's CI because
      build.copy holds scripts/llm and src/persona_backends: that republish is the channel's path, never a deploy from
      this plan.
    command: >-
      bin/venv-python -c "import subprocess;from scripts.convergence_health.code_drift import PROD_SOURCE_PATHSPECS as P,DUCKLAKE_SOURCE_PATHSPECS as D;from scripts.lambda_manifest import compute_affected_artifacts as ca;import fnmatch;run=lambda a:subprocess.run(a,capture_output=True,text=True,check=True).stdout.split();mb=subprocess.run(['git','merge-base','HEAD','origin/main'],capture_output=True,text=True,check=True).stdout.strip();ch=sorted(set(run(['git','diff','--name-only',mb]))|set(run(['git','ls-files','--others','--exclude-standard'])));hit=lambda f,g:f==g or f.startswith(g.rstrip('/')+'/') or fnmatch.fnmatch(f,g);hits=sorted({f for f in ch for g in P+D if hit(f,g)});aff=ca(ch);print('changed',len(ch),'hits',hits,'affected',aff);assert 'scripts/llm/litellm_transport.py' in ch and 'src/persona_backends/litellm_backend.py' in ch;assert not hits and not aff;print('NO_DEPLOY_TRIGGER_OK')"
    expected: >-
      Exit 0. The change list holds the transport and the backend, no changed path matches a PROD_SOURCE_PATHSPECS or
      DUCKLAKE_SOURCE_PATHSPECS entry, affected is empty, and the last line is NO_DEPLOY_TRIGGER_OK.
    fix_if: An artifact is affected; STOP to this planning thread, never deploy from this plan.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      It reads this branch's transient diff against the merge-base, which is empty on main; the persona-backends
      boundary test holds the data-pipeline excludes in every tier.
  - step: 5
    phase: pre-deploy
    action: Pre-handoff full tier on the committed, rebased tree (Decision 163), read through its evidence file.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      Start the full tier backgrounded with a 2 h limit from the top-level session (AGENTS.md), then read the verdict
      with --verify-head, never a pipe's exit status. It reports the full tier passed on HEAD's tree.
    fix_if: Any failure; fix and re-run both from the start (timeout_disposition blocked).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: rec-5395 is closed by the merge.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; r,_=fetch_recs_by_ids(make_reader(),['rec-5395']); print(r[0]['status']); assert
      r[0]['status']=='closed'"
    expected: Prints closed.
    fix_if: An open rec means the Resolves trailer was missing; close it through the portal with the merge SHA as evidence.
    hermetic: false
    graduation: not-applicable
