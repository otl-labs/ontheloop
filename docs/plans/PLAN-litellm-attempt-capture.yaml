schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: litellm-attempt-capture
intent: >-
  Solves rec-5395. rec-4028 (the litellm telemetry producer) was superseded on 2026-11-18 (one plan solves one rec) by
  rec-5395 (this plan: the run record keeps every billed call), rec-5388 (the Claude Code monitor checks are scoped to
  producer claude_code, LL-5; independent) and rec-5396 (the producer, its registry entry, golden corpus and the three
  row contracts; depends on rec-5395). PLAN-litellm-producer-envelope (#2223) put the rules in
  docs/contracts/telemetry-event-envelope.yaml; this plan makes the events file hold what LL-3 and LL-4 say it holds,
  so rec-5396's producer can map it without guessing:
  - a turn the run's wall-clock deadline cuts short records every attempt the transport made, the call in flight as
    one more attempt entry with outcome cancelled, and a fresh probe that completed earlier in that turn;
  - a fail-over whose fallback cold start fails keeps the primary attempts and the failed probe as an attempt entry;
  - the events header is written once, final at its first write, so a partial file is a prefix of the final one.
  Serves NS.6: verdict runs on GitHub are measured from their first run, including the calls a deadline cut short.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-litellm-attempt-capture.yaml
phase: >-
  T4.32 c1 (telemetry leg, part; rec-5395); closes no criterion. PLAN-litellm-producer-envelope is built (#2223); plan 4
  (the MCP bridge, #2174) is built. scripts/llm/ and src/persona_backends/ are in no Lambda bundle, so nothing deploys
  (V2).
closes_criteria: []
cites: [dec:173, dec:206, dec:235]
scope:
  - file: src/persona_backends/events.py
    action: Modify
    purpose: >-
      - header schema 2 (was 1): an attempt entry's outcome may now be cancelled, a failed cold-start probe may be an
        attempt entry, and the header is written once. Nothing reads a schema 1 file (no producer exists; no workflow
        runs run_persona). A cold-start probe's attempt entry (raised or cancelled) carries attempt 0, a value no call
        takes (a call's per-role counter starts at 1), so the producer can tell a probe from the fallback's first call.
      - Capture: a stdlib dataclass the backend creates per transport call and passes as capture=. Fields: filled
        (bool, False; the transport sets it True on entry, so a transport that ignores capture= is detectable),
        attempts (list, every completed attempt in send order across both roles, a raised probe included), in_flight
        (the attempt being awaited, or None), record (the CallRecord of the attempt that returned ok, or None) and
        probe_record (a fresh probe's CallRecord, or None). The transport fills it by duck typing; this package still
        imports nothing under scripts.
      - cancelled_dict(in_flight, latency_ms): attempt_dict with outcome cancelled and the given latency.
      - The module docstring names the declared losses this file cannot hold: a run killed before its header is
        written (during MCP bridge startup) leaves no events file; a warehouse_read run refused for want of an MCP
        server leaves none either (no call is made); and any process exit before a turn record lands (runner lost, job
        timeout, an OSError from write_atomic) loses that turn's attempts (LL-3 prefix rule).
  - file: src/persona_backends/litellm_backend.py
    action: Modify
    purpose: >-
      - Header finality: _Run.__init__ no longer emits the head. It is emitted once: in run_persona right before go()
        for a run without warehouse verbs; in run_with_bridge after the bridge's tool specs join and tools_sha256 is
        set, replacing today's re-emit (about :149-151); and by end() first when it has not gone out, which covers input
        refusal, tool_server_unavailable (factory or BridgeUnavailable) and BridgeTimeout with no per-path code. On those
        early exits tools_sha256 keeps the pre-bridge tool list's hash (no call was sent).
      - step() creates an ev.Capture per call and passes capture= to the transport. The asyncio.TimeoutError branch,
        when capture.filled, writes the turn record from it: attempts = every captured attempt, then the in-flight
        entry (if any) as cancelled with latency_ms = max(0, now_ms minus its started_at_ms) (both time.time in
        production; the clamp covers a fake wall); record = the captured record as a dict (an attempt that returned ok
        before the cancel keeps its CallRecord, so no ok entry ever lacks one); probe_record = the captured probe
        record and probe_turn 1 when it is set; attempts_known true. failed_over is true when the turn began on role
        primary and any written entry or the probe record is warm_fetched_escape_hatch's, and then the record's role
        is warm_fetched_escape_hatch, as on_result writes a fail-over turn; otherwise role is the turn's starting role
        and failed_over false. turns_used adds one per entry written plus one for the probe record. A deadline during
        a retry backoff has no in-flight entry. When capture.filled is false (a transport that ignores capture=), the
        branch keeps today's values: attempts [], attempts_known false, turns_used the upper bound.
      - on_transport_error for kind fallback_unavailable: no fallback call was answered, so the turn record keeps role
        primary and failed_over false, self.role is not switched (the run aborts), probe_turn is 0 (a raised probe is
        already an attempt entry) and turns_used adds the attempts alone, or the upper bound when there are none.
        Other kinds are unchanged.
      Stays under 500 SLOC.
  - file: scripts/llm/litellm_transport.py
    action: Modify
    purpose: >-
      - complete and acomplete take capture: Any = None (keyword), set capture.filled True on entry and carry it on
        _Call.
      - _run_role and _arun_role: set capture.in_flight to the selection's Attempt (outcome cancelled, latency 0,
        provider, billing_shape, started_at_ms) just before each completion call; after it returns or raises Exception,
        in one synchronous stretch with no await, clear in_flight, append the completed Attempt to capture.attempts and,
        for an ok attempt, set capture.record. CancelledError is not caught, so a cancelled call leaves in_flight set.
      - In _arun_role, an Exception raised while the current task is cancelling (asyncio.current_task().cancelling() >
        0; e.g. a client that turns CancelledError into an error) re-raises CancelledError with in_flight left set:
        it is never classified, retried or slept on past the deadline.
      - capture.probe_record is set when the direct ensure_asserted or the fallback gate returns a fresh probe.
      - No other behaviour changes; result.attempts and error.attempts keep today's values.
  - file: scripts/llm/litellm_cold_start.py
    action: Modify
    purpose: >-
      - ColdStartResult gains attempt (Attempt | None, default None). _failed (a probe that raised) sets it: role
        warm_fetched_escape_hatch (the resolved role), the selection's model, provider and billing_shape, attempt 0
        (the probe marker, see events.py), outcome the classify kind, latency and started_at_ms measured as for a
        call. A probe with no choices, a "no request made" probe and a not_applicable role set none (LL-4; rec-5338
        stays open). The probe's model is the first persona's resolution (_resolve), not the run's persona; rec-5396 maps
        it as it finds it.
      - _unavailable carries attempts=(result.attempt,) when set, else (). fallback_gate and afallback_gate, on a
        TransportError from ensure_asserted, set its attempts to primary_error.attempts plus its own before re-raising
        from primary_error (as _mid_run already copies them). Both faces.
      - cold_start_check, acold_start_check, ensure_asserted, aensure_asserted and both gates take capture=None and pass
        it to the probe only when it is not None, so existing callers and fakes with the old signature keep working.
        The async probe sets capture.in_flight (role warm_fetched_escape_hatch, attempt 0, outcome cancelled) before
        its completion await and clears it after; a raised probe's attempt is appended to capture.attempts in the same
        stretch. The same cancelling() rule as the transport applies: an Exception raised while the task is cancelling
        re-raises CancelledError before _failed, with in_flight left set and nothing appended. The sync probe fills
        capture the same way.
  - file: tests/persona_backends/fakes.py
    action: Modify
    purpose: >-
      CapturingTransport: a scripted fake that fills the capture it is passed (completed attempts, an in-flight attempt,
      a record, a probe record) and then returns, raises or waits forever, so deadline tests drive the real backend
      branch. Existing fakes keep their shapes.
  - file: tests/persona_backends/test_litellm_backend.py
    action: Modify
    purpose: >-
      New nodes:
      - test_deadline_mid_call_records_cancelled_in_flight: two primary outages captured, the third call in flight at
        the deadline; the turn holds three entries in send order, the last cancelled with provider, billing_shape and
        started_at_ms from the selection and a latency of at least 0; attempts_known true; role primary, failed_over
        false; turns_used 3.
      - test_deadline_in_backoff_adds_no_entry.
      - test_deadline_after_asserted_probe_keeps_probe_record: primary outages, an asserted fresh probe, the deadline
        during the fallback call; probe_record set, probe_turn 1, the fallback call a cancelled entry, role
        warm_fetched_escape_hatch and failed_over true (PLAN-litellm-producer-envelope critique r3 B1).
      - test_deadline_during_probe_records_cancelled_probe_entry: the probe in flight is an entry with role
        warm_fetched_escape_hatch, attempt 0 and outcome cancelled at its position.
      - test_deadline_after_returned_call_keeps_its_record: wait_for patched to run the call to completion and then
        raise TimeoutError; the ok entry is written with its CallRecord.
      - test_deadline_with_unfilled_capture_keeps_unknown: a transport that ignores capture= gives attempts [],
        attempts_known false and the upper bound (today's values, never a guessed zero).
      - test_fallback_unavailable_lands_primary_and_probe_attempts: primary outages and a raised probe entry (attempt
        0) land in the turn record, attempts_known true, role primary, failed_over false, probe_turn 0, turns_used =
        entries.
      - test_first_written_header_is_final: a warehouse_read run's on_event sees one head, equal to the final header.
      - test_early_exits_write_header_then_end: input refusal, tool_server_unavailable and BridgeTimeout each emit the
        head then the end, once each.
      test_wait_for_timeout_returns_budget_exhausted and test_fallback_unavailable_counts_upper_bound stay unchanged
      (their fakes fill no capture or carry no attempts). Planned re-specification (the old value described the
      defect this plan fixes): test_header_tools_sha256_covers_bridge_specs (two heads -> one).
  - file: tests/persona_backends/test_events.py
    action: Modify
    purpose: test_header_schema_two_and_capture_defaults; test_cancelled_dict_overrides_outcome_and_latency.
  - file: tests/test_llm_litellm_transport.py
    action: Modify
    purpose: >-
      TestCapture, sync and async where the face has the path:
      - test_capture_attempts_equal_returned_and_raised_attempts (primary outages then fallback ok; a fallback raise);
        record set only with an ok attempt.
      - test_in_flight_set_during_call_and_cleared_after (the fake completion reads capture.in_flight).
      - test_cancel_leaves_in_flight_set (async: the task is cancelled while the fake completion awaits).
      - test_cancel_in_backoff_leaves_no_in_flight.
      - test_cancel_raised_as_error_is_not_retried: a fake that answers cancellation with an APIConnectionError-shaped
        error; CancelledError propagates, one completion call, no sleep, in_flight set.
      - test_probe_record_on_capture (direct fallback role and fail-over gate) and capture.filled set on entry.
      - test_outage_inside_task_group_is_still_classified: an outage raised while the role runs inside an anyio task
        group (as the MCP bridge path does) is classified and retried, never turned into CancelledError (critique r1
        risk: no residual cancel count).
  - file: tests/test_llm_litellm_cold_start.py
    action: Modify
    purpose: >-
      TestProbeAttempt, sync and async: a raising probe's result carries an attempt with the fallback role, attempt 0,
      its classify outcome, selection fields and start; a no-choices probe and a no-request probe carry none;
      _unavailable's error carries it; fallback_gate and afallback_gate prepend primary_error.attempts; a cancelled
      async probe leaves capture.in_flight with role warm_fetched_escape_hatch;
      test_probe_cancel_raised_as_error_is_cancelled (async: a fake completion answers cancellation with an
      APIConnectionError-shaped error; CancelledError propagates, in_flight is set, nothing is appended). The four
      TestColdStartLock fakes (about :200, :219, :234, :253) are unchanged, since capture is forwarded only when set.
