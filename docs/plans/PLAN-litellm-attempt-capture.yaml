    No telemetry row, writer call, AWS call or key read, and no LiteLLM CustomLogger or callback (operator ruling
    2026-11-17). No edit to Feedback Loop's contracts or code, scripts/run_persona.py, scripts/personas/,
    executor-personas.yaml or ports.yaml (3b-2b and 3b-2c own those).
  - >-
    The approved LL-3 and LL-4 words (telemetry-event-envelope.yaml) are the specification; where this plan and they
    differ, STOP to this planning thread. The transport_exception path stays without a turn record (LL-4).
  - src/persona_backends imports nothing under scripts; Capture is filled by duck typing.
  - Every module stays under 500 SLOC (Decision 128); split, never raise.
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
