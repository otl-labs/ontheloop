    build.copy is measured from run_persona's closure, which this plan widens to src/turn_capture/litellm_usage.py, hence
    the three conditional image scope rows when it builds first (critique r4 B1). Also for 3b: the probe's
    CallRecord persona is the contract's first persona (litellm_cold_start.py about :56-58), not the running persona;
    a probe that got a response but is not_asserted (no choices) or spent may be billed yet carries no record;
