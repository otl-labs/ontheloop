constraints:
  - >-
    Place every sidecar block word for word, with {{DATE}} filled with the build date; never edit the sidecar (Decision
    246). inference-provider.yaml gets no other edit than the three whitespace-only re-joins. If the rebase moves a
    block's before text, STOP to this planning thread.
  - >-
    No telemetry row, writer call, AWS call or key read, and no LiteLLM CustomLogger or callback (operator ruling
    2026-11-17). src/turn_capture/litellm_usage.py imports stdlib only, and no src module imports scripts. No edit to
    scripts/run_persona.py, src/persona_backends/contract.py or executor-personas.yaml (plans 2 and 4 own those).
  - >-
    Golden vectors run only through litellm.completion, never a provider SDK (Decision 173 clause 1). Every id and
    value in them is synthetic (Decision 101).
  - Every module stays under 500 SLOC (Decision 128); split, never raise.
  - >-
    If PLAN-persona-image-twin has merged, the three conditional image rows apply and the PR runs the image conformance
    build. If config/persona_image.yaml then carries a non-null digest, or the image checks fail for any reason other than
    the new src/turn_capture entries, STOP to this planning thread; never edit another image key.
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
context:
  - >-
    Decision-scout r3 (2026-11-17): Verdict: FLAGS_FOUND. Decisions triaged: 219 of 219. Roadmap items intersected: 3;
    CONFLICT: 0; RELATED: 2. Serves: NS.6 3/5. CITE: 166, 173, 199, 246. Both Decision 99 NOTEs resolved:
