      of those, and litellm needs no exclude-pattern or auto-merge denylist entry. A red grouped bump is re-checked by
      whoever lands that bump PR, like any failing test it brings.
    Decision-scout r5: Verdict: NO_FLAGS. Decisions triaged: 219 of 219. Roadmap items intersected: 3; CONFLICT: 0;
    RELATED: 2. Serves: NS.6 3/5. CITE: 166, 173, 199, 246.
