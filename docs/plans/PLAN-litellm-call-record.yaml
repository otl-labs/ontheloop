schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: litellm-call-record
intent: >-
  Plan 3a of rec-4028's split. A blind consult split the work into 3a (this plan: the transport's per-call record and
  the one usage mapping table) and 3b (the producer that maps run_persona's events file to Decision 199 rows; rec-4028
  stays open for it). The operator chose capture from the transport record, so no LiteLLM CustomLogger is built. Every
  provider attempt the litellm transport makes gains what a model_call row needs and the transport does not record
  today:
  - the provider response id where it is the provider's own, the raw usage LiteLLM keeps, the 5m/1h cache-write split,
    the missing-usage marker and wall-clock times;
  - provider and billing_shape on a failed attempt;
  - the fallback's billable cold-start probe, surfaced as its own record.
  The events header gains tools_sha256, an input of 3b's prefix_hash. The four token classes come from one pure mapping
  over the provider's own usage fields. It is declared once as usage_mapping in docs/contracts/inference-provider.yaml,
  with golden vectors per provider re-run at the pinned LiteLLM (1.106.2 today), and the transport calls it instead of
  computing its own.
  Bundles rec-5112: a response with no usage block, one global lock across the cold-start probe, max_attempts below
  1, and the smoke test's load order. Serves NS.6: verdict runs on GitHub are measured from their first run.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-litellm-call-record.yaml
phase: >-
  T4.32 c1 (telemetry leg, part; plan 3a of rec-4028's split); closes no criterion. T4.32 is in_progress, and plan 1
  (PLAN-run-persona-litellm-backend) is merged and built (#2132, eed2f6e4). scripts/llm/ is in no Lambda bundle, and the
  data-pipeline manifest excludes src/turn_capture and src/persona_backends, so nothing deploys (V2). closes_criteria
  is [] because c1 has unbuilt legs (3b, the fixture run), so naming T4.32:c1 would be false.
closes_criteria: []
cites: [dec:166, dec:173, dec:199, dec:246]
scope:
  - file: src/turn_capture/litellm_usage.py
    action: Create
    purpose: >-
      The one usage mapping, stdlib only (tests/turn_capture/test_package_boundary.py holds the package's import rule).
      - USAGE_TABLE: three rows (deepseek, anthropic, default) mirroring inference-provider.yaml usage_mapping.rows key
        for key: each class's source field or expression, the structural 0s, guaranteed, cache_creation_split,
        reasoning_tokens and response_id.
      - row_for(prefix): returns the row for a LiteLLM prefix, else default.
      - map_usage is driven by USAGE_TABLE: a small restricted parser reads each row's dotted paths and `a - b - c`
        differences (never eval or exec, AGENTS.md Safety), so the table the tie test compares is the code that runs.
      - map_usage(prefix, usage): takes a LiteLLM Usage model_dump or None. Returns a frozen UsageColumns with
        tokens_input, tokens_output, tokens_cache_read, tokens_cache_creation, cache_creation_1h_tokens,
        cache_creation_5m_tokens, reasoning_tokens, usage_absent (a sorted tuple of class names) and response_id
        ("provider" or "not_recorded").
      Rules, as approved:
      - No usage (None, or prompt_tokens, completion_tokens and total_tokens all 0, which litellm.completion writes when
        the provider sent none) gives 0 in every class the row does not fix at a structural 0, and names each of them:
        four for anthropic, three for deepseek and default (tokens_cache_creation is structural there).
      - A missing guaranteed key gives 0 in each class it feeds and names those classes. A missing key outside
        guaranteed (e.g. default's prompt_tokens_details.cached_tokens) reads 0 and is not named.
      - A structural 0 is never named. A difference below 0 is 0, and its class is named.
      - reasoning_tokens is the provider's count (deepseek) or None, never LiteLLM's local estimate.
      - Each split value is None when absent, and None when above tokens_cache_creation. The guard is a few local
        lines with the same semantics as src/turn_capture/usage.py _split, never an import of usage.py: that module's
        closure brings about 20 modules (src/telemetry, src/sensitive_values with GITHUB_TOKEN string constants) into
        scripts/run_persona.py's closure, which the persona image's agnosticism check refuses (critique r5 B1).
      - Imports stdlib only; no src.* or scripts.* import at all.
      - Only int values count; a bool or other type is treated as missing.
  - file: scripts/llm/litellm_wire.py
    action: Modify
    purpose: >-
      CallRecord gains these fields, appended with defaults so positional construction keeps working: response_id
      (str | None), usage_raw (the Usage model_dump with None values stripped recursively, nested dicts included, or
      None), cache_creation_1h_tokens, cache_creation_5m_tokens (int | None), usage_absent (tuple[str, ...]),
      started_at_ms and responded_at_ms (wall-clock epoch ms, int | None). Attempt gains provider, billing_shape and
      started_at_ms (each defaulting to None). read_response(..., started_at_ms=None, responded_at_ms=None) takes both
      times from its caller, which reads its own clock, so a test fakes them at the caller. It reads
      `getattr(response, "usage", None)` (a response without usage no longer raises; rec-5112), hands map_usage the
      dump or None, and fills the four classes, the split, reasoning_tokens and usage_absent from the result; the
      all-zero usage litellm.completion synthesizes is recognised by map_usage, not here. response_id is response.id
      when the row says provider, else None. The token arithmetic it carries today is removed; no other module computes
      a token class.
  - file: scripts/llm/litellm_transport.py
    action: Modify
    purpose: >-
      Every Attempt carries the selection's provider and billing_shape and its wall-clock start, from a module-level
      _wall = time.time that tests replace; it also gives read_response its started_at_ms and responded_at_ms.
      TransportResult gains probe_record (CallRecord | None, default None), and TransportError (defined in
      scripts/llm/litellm_wire.py, about :61-78) gains probe_record, set to None in its __init__ there, which the
      transport assigns. A fresh cold-start probe run in this call is surfaced from both places complete and
      acomplete run one: the direct `role == warm_fetched_escape_hatch` ensure_asserted call before the role runs
      (litellm_transport.py about :214-215 and :248-249), and the fail-over fallback_gate. Its record is set on the
      result, or on the TransportError the call raises after the probe. A cached assertion (fresh False) sets None.
      complete and acomplete refuse max_attempts below 1 with TransportError("refused", ...,
      tag="max_attempts_below_one") before any call; the AssertionError path goes (rec-5112).
  - file: scripts/llm/litellm_cold_start.py
    action: Modify
    purpose: >-
      ColdStartResult gains fresh (bool, default False): True on any result whose probe ran in that call
      (cold_start_check, acold_start_check, ensure_asserted, aensure_asserted); a cached return is the cached value
      with fresh False (dataclasses.replace). The lock is per cache key, not one process-global lock held across every probe: a sync
      dict of threading.Lock keyed by the cache key under a short guard lock, and an async per-loop dict of
      asyncio.Lock keyed the same (rec-5112). A probe's record carries its wall-clock times, read from a module-level
      _wall = time.time, through read_response.
  - file: scripts/smoke_test_inference_credentials.py
    action: Modify
    purpose: A broad try now wraps the contract load (_row, about :60, which today runs outside the try at about :91-95), so a load failure prints a diagnostic and returns 1 instead of raising (rec-5112).
  - file: src/persona_backends/events.py
    action: Modify
    purpose: >-
      attempt_dict adds provider, billing_shape and started_at_ms. header(...) takes tools_sha256 as an appended keyword
      defaulting to None (the SHA-256 hex of canonical_json of the tool list the run sends; positional callers such as
      test_events.py:24 keep working) and writes it. turn_record(...) takes probe_record (the probe's
      CallRecord as a dict, or None) and writes it. The events schema stays 1, since every change is an added key.
  - file: src/persona_backends/litellm_backend.py
    action: Modify
    purpose: >-
      run_persona builds the tool list once, hashes it into the header and hands the same list to _Run, so
      tools_sha256 always equals the hash of the tools sent. on_result and on_transport_error pass the result's or the
      error's probe_record (getattr, default None) into the turn record. No other behaviour changes; still under 500
      SLOC.
  - file: docs/contracts/inference-provider.yaml
    action: Modify
    purpose: >-
      The approved sidecar's two blocks: the usage_mapping section before iam_requirements, and a new amendment_log row.
      Then three notes are re-joined onto one line each, words unchanged, so the file stays at or under 500 effective
      lines (measured 486 on a scratch tree of ddb28a40): the top-level note, projects_to's model_routing note and
      tier_model.note. Approved text (Decision 246); no other edit.
  - file: tests/fixtures/litellm_usage/vectors.json
    action: Create
    purpose: >-
      Synthetic golden vectors, each {name, prefix, model, wire, dump, expected}. wire is a provider response body, dump
      is the response.usage model_dump that litellm.completion returns for it at the pinned LiteLLM (the production path
      read_response consumes), and expected is the UsageColumns.
      - deepseek: a hit/miss pair with provider reasoning_tokens.
      - anthropic: a cached call with the 5m/1h split, an uncached call, and a call with usage.iterations whose
        iteration entries each carry their own cache fields, as the real API sends them (LiteLLM 1.106.2 drops the
        top-level cache counts when the iterations carry none).
      - default: an OpenAI-shaped cached pair.
      - a deepseek body with no usage: its dump is LiteLLM's all-zero Usage, and expected names tokens_input,
        tokens_cache_read and tokens_output in usage_absent.
      Ids are synthetic.
  - file: tests/turn_capture/test_litellm_usage.py
    action: Create
    purpose: >-
      - test_usage_mapping_conformance: map_usage(dump) equals expected for every vector.
      - test_vectors_match_litellm_completion: each wire body, served by tests/fixtures/litellm_capture.py's capture()
        to litellm.completion(model, messages, api_key, num_retries=0) offline, gives a response whose usage
        model_dump, None values stripped and projected onto the keys the vector's row reads plus iterations, equals the
        same projection of the recorded dump (the full dump stays recorded), and Anthropic's response id differs from the
        wire id. So an additive LiteLLM Usage field does not redden a grouped bump; a changed key a row reads does. It
        also asserts map_usage(prefix, live_dump) equals expected, which covers the missing-usage rule's keys
        (prompt_tokens, completion_tokens, total_tokens) on the live dump. litellm comes from
        scripts.llm.litellm_wire.load_litellm() after cap.reset(monkeypatch), which keeps the local cost map (no
        importorskip, no module-top import).
      - test_difference_equals_wire_uncached: for each vector whose row derives tokens_input as a difference, expected
        tokens_input equals the uncached count in the wire body (anthropic: input_tokens, summed over usage.iterations
        when present; default: prompt_tokens minus prompt_tokens_details.cached_tokens), so the source text's proof is
        not tautological.
      - test_table_matches_contract: USAGE_TABLE equals inference-provider.yaml usage_mapping.rows.
      - test_lock_only_diff_selects_this_file: derive_affected_tests([("M", "requirements-dev.txt")]) selects this file
        (mirrors tests/test_llm_litellm_transport.py:90-92; the file spells "requirements-dev.txt" as a quoted token),
        so a LiteLLM bump re-runs the vectors pre-merge.
      - test_missing_usage_marks_absent: None and the all-zero usage, per row (four names for anthropic, three for
        deepseek and default).
      - test_missing_key_outside_guaranteed_is_not_named.
      - test_negative_difference_is_zero_and_absent.
      - test_split_above_cache_creation_is_none.
      - test_non_int_value_is_missing: a bool, float or str in a guaranteed key counts as missing.
      - test_run_persona_closure_adds_only_litellm_usage: an AST walk of scripts/run_persona.py's static first-party
        import closure (import and from-import of src.* and scripts.*, following packages' __init__.py) holds, under
        src/turn_capture/, exactly src/turn_capture/__init__.py and src/turn_capture/litellm_usage.py, and nothing under
        src/sensitive_values/ or src/telemetry/. This pins the conditional image rows' enumeration whether or not the
        image plan has merged.
      - test_reasoning_tokens_provider_only.
  - file: tests/test_llm_litellm_robustness.py
    action: Create
    purpose: >-
      rec-5112's TestMissingUsage, the node its acceptance names. A response fake with choices and no usage attribute
      (defensive: at 1.106.2 litellm.completion never returns one, see context), through the primary (deepseek) role
      of the transport and through cold_start_check on the fallback (anthropic) role, gives a record, never an
      exception, whose usage_absent names every non-structural class of that row: three for deepseek, four for
      anthropic. rec-5112's other three fixes are tested in each source's own mapped test file, so per-file coverage
      (map_source_to_test) holds.
  - file: tests/test_llm_litellm_wire.py
    action: Modify
    purpose: >-
      TestRecords asserts the new CallRecord fields, recursive None-stripping of usage_raw, the passed-in times, and that
      each token class comes from map_usage (no arithmetic left in read_response), including a response with no usage
      attribute. The SimpleNamespace usage fakes move to real litellm.Usage objects carrying the provider keys; the
      deepseek expectations change because the row now reads prompt_cache_hit/miss_tokens, a re-specification by
      design (no weakening: the old fakes lacked those keys).
  - file: tests/test_llm_litellm_transport.py
    action: Modify
    purpose: >-
      - TestAttemptFields: provider, billing_shape and started_at_ms on ok and failed attempts, from a fake _wall.
      - TestProbeRecord: a fail-over result carries the fresh probe's record; a second fail-over in the process
        carries None; a fallback raise after a fresh probe carries it on the error; a direct warm_fetched_escape_hatch
        call carries its fresh probe's record on the result and on a later error, and a cached one carries None. Sync
        and async.
      - TestMaxAttempts: max_attempts 0 is refused with tag max_attempts_below_one before any call, sync and async,
        including with role warm_fetched_escape_hatch, where zero requests are made (the refusal precedes the direct
        ensure_asserted, a billable probe).
      TestToolsCallUnderPins is unchanged.
  - file: tests/test_llm_litellm_cold_start.py
    action: Modify
    purpose: >-
      TestGates asserts fresh True on the probing call and False on the cached return. Planned re-specification (rec-5112 and the cold-start scope row):
      the `first is again` identity asserts (about :92 and :109) become equality on every field but fresh, since the
      cached return is now a replaced copy. TestColdStartLock (rec-5112): two cache keys probe concurrently without
      waiting on each other, and one key probes once, sync and async. Deterministic: the first key's probe blocks on a
      threading.Event (asyncio.Event for async) that the second key's probe sets, with a bounded timeout, never a sleep.
  - file: tests/test_smoke_test_inference_credentials.py
    action: Modify
    purpose: >-
      TestRun gains test_contract_load_error_returns_one (rec-5112): a contract load error prints a diagnostic and
      returns 1. Planned re-specification (AC6): test_missing_row (about :130-133) expected a raised TierSelectionError
      and now asserts the return 1 and the diagnostic, which is rec-5112's fix.
  - file: tests/persona_backends/test_events.py
    action: Modify
    purpose: test_attempt_and_probe_fields (attempt keys, header tools_sha256, turn probe_record).
  - file: tests/persona_backends/test_litellm_backend.py
    action: Modify
    purpose: >-
      Adds test_fail_over_turn_carries_probe_record and test_header_tools_sha256_matches_tools_sent;
      test_tool_then_final_succeeds_with_two_turn_events is unchanged.
  - file: tests/persona_backends/fakes.py
    action: Modify
    purpose: The fakes keep the real shapes. attempt() and record() fill the new fields, and the result and error fakes can carry probe_record.
  - file: config/persona_image.yaml
    action: Modify
    purpose: >-
      Conditional: only if PLAN-persona-image-twin has merged at build time (the file exists on origin/main). This plan
      puts src/turn_capture/litellm_usage.py into the static import closure of scripts/run_persona.py (run_persona ->
      litellm_transport -> litellm_wire -> litellm_usage), and that plan's validate_persona_github_agnosticism fails on a
      closure module build.copy does not hold. build.copy gains exactly src/turn_capture/__init__.py and
      src/turn_capture/litellm_usage.py, the two files test_run_persona_closure_adds_only_litellm_usage pins. No other
      key changes. If the plan has not merged,
      skip this row and the two below: that plan measures build.copy from the closure when it builds.
  - file: docker/persona/Dockerfile
    action: Modify
    purpose: Conditional, as config/persona_image.yaml above. One COPY per new build.copy entry, to /app/<same path>, so validate_persona_image_digest's COPY-equals-build.copy rule holds.
  - file: docker/persona/Dockerfile.dockerignore
    action: Modify
    purpose: Conditional, as config/persona_image.yaml above. One "!<path>" per new build.copy entry, so the allow-list equals build.copy plus the lock.
bundled_recommendations: [rec-5112]
followon_recs: [rec-4028, rec-5318]
infrastructure_dependencies: []
acceptance_criteria:
  - map_usage maps every golden vector's recorded dump and live dump to its expected columns, each wire body served to litellm.completion at the pinned LiteLLM gives a dump whose projection onto the keys its row reads equals the recorded dump's, and each difference-derived tokens_input equals the wire body's uncached count.
  - USAGE_TABLE equals inference-provider.yaml usage_mapping.rows and drives map_usage. The contract names no LiteLLM version, and a change to requirements-dev.txt selects the golden-vector test pre-merge. The persona image's own litellm lock re-running the vectors is rec-5318 (T7 image line), not this plan.
  - read_response computes no token class itself. A response with no usage block, or LiteLLM's all-zero usage, gives a record whose usage_absent names every non-structural class of its row (four for anthropic, three for deepseek and default), never an exception.
  - Every Attempt the transport returns or raises carries provider, billing_shape and started_at_ms. A call that ran a fresh cold-start probe, through the fail-over gate or the direct warm_fetched_escape_hatch role, carries that probe's CallRecord on its result or error, and a cached assertion carries none.
  - The events header carries tools_sha256 equal to the hash of the tools sent, and each turn record carries probe_record.
  - max_attempts below 1 is refused, the cold-start lock is per key, and the smoke test returns 1 on a contract load error.
  - inference-provider.yaml carries the two approved blocks word for word and is at or under 500 effective lines.
  - Nothing deploys, and no telemetry row or writer call is added.
  - rec-5112 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The usage mapping against the golden vectors, litellm.completion at the pinned version, and the contract table.
    command: bin/venv-python -m pytest tests/turn_capture/test_litellm_usage.py -q
    expected: >-
      Exit 0, every node passes. Nothing can skip: the test loads litellm through load_litellm() with no importorskip, so
      a venv without it errors. Red before (the module and the test are absent).
    fix_if: >-
      A vector's dump differs from what litellm.completion returns: re-record the dump only if the wire body is right,
      and never edit expected to match the code. A table mismatch: the code is wrong, since the contract is the approved
      text.
    hermetic: false
    graduation: graduate
    graduation_check_id: litellm-usage-mapping-conformance
  - step: 2
    phase: pre-deploy
    action: The transport, wire and cold-start changes, and rec-5112's four fixes, each in its source's mapped test file except TestMissingUsage.
    command: >-
      bin/venv-python -m pytest tests/test_llm_litellm_robustness.py tests/test_llm_litellm_wire.py
      tests/test_llm_litellm_transport.py tests/test_llm_litellm_cold_start.py tests/test_smoke_test_inference_credentials.py -q
    expected: >-
      Exit 0, every node passes. Red before (the robustness file is absent, so pytest exits 4). Each changed source keeps
      100% coverage from its own mapped test file (VP 7's validate_test_coverage).
    fix_if: >-
      An attempt without provider, or a probe record surfaced twice or missing on the direct fallback path: fix the
      transport, never the fake. A coverage gap: add the node to the source's mapped test file, never to the robustness
      file.
    hermetic: false
    graduation: graduate
    graduation_check_id: litellm-call-record-transport
  - step: 3
    phase: pre-deploy
    action: The events file carries the new fields, and the backend passes them through.
    command: >-
      bin/venv-python -m pytest tests/persona_backends/test_events.py::test_attempt_and_probe_fields
      tests/persona_backends/test_litellm_backend.py::test_fail_over_turn_carries_probe_record
      tests/persona_backends/test_litellm_backend.py::test_header_tools_sha256_matches_tools_sent -q
    expected: >-
      Exit 0, the three nodes pass. Red before (they are absent, so pytest exits 4). The rest of tests/persona_backends,
      including the kept run-persona-litellm-backend-loop node, runs in every tier.
    fix_if: tools_sha256 computed from a different list than the one sent; build the list once in run_persona.
    hermetic: false
    graduation: graduate
    graduation_check_id: litellm-call-record-events
  - step: 4
    phase: pre-deploy
    action: Import boundaries. src/turn_capture stays stdlib plus its allowed imports, and src imports nothing under scripts.
    command: bin/venv-python -m pytest tests/turn_capture/test_package_boundary.py tests/persona_backends/test_package_boundary.py -q && bin/venv-python -m scripts.import_governance --check-contracts
    expected: Exit 0 from both; import-linter reports 0 contracts broken.
    fix_if: litellm_usage importing yaml or scripts; keep it stdlib and let the test read the contract.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Both halves are already standing guards: the two boundary tests run in every fast tier and the import-linter run
      is a registered check, so a registry shard would duplicate them.
  - step: 5
    phase: pre-deploy
    action: >-
      The placed contract text. The sidecar binds inference-provider.yaml, the contract stays under the contracts size
      cap, and the inference-provider registry check passes.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug litellm-call-record && bin/venv-python -c
      "from scripts.checks.structural.size_limits import validate_structural_size_limits as a;
      from scripts.checks.contracts.validate_inference_provider_registry import validate_inference_provider_registry as b;
      f=[];a(f);b(f);f=[x for x in f if 'inference-provider' in x or 'inference_provider' in x];print(*f,sep='\n');
      print(f'contract checks: {len(f)} failures');assert not f"
    expected: The verify run passes, and the last line reports 0 failures.
    expected_literals:
      - 'contract checks: 0 failures'
    fix_if: >-
      A verify mismatch: place the block word for word, and never edit the sidecar. Over the cap: re-join the three named
      notes (words unchanged). If still over, STOP to this planning thread; never raise the budget.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The approved-text verify runs in validate_merge_step and both checks run in every tier, so a shard would
      duplicate them.
  - step: 6
    phase: pre-deploy
    action: No artifact bundles a changed path, and no deploy channel watches one (Decision 249 clause 2).
    command: >-
      bin/venv-python -c "import subprocess;from scripts.convergence_health.code_drift import PROD_SOURCE_PATHSPECS as P,DUCKLAKE_SOURCE_PATHSPECS as D;from scripts.lambda_manifest import compute_affected_artifacts as ca;import fnmatch;run=lambda a:subprocess.run(a,capture_output=True,text=True,check=True).stdout.split();mb=subprocess.run(['git','merge-base','HEAD','origin/main'],capture_output=True,text=True,check=True).stdout.strip();ch=sorted(set(run(['git','diff','--name-only',mb]))|set(run(['git','ls-files','--others','--exclude-standard'])));hit=lambda f,g:f==g or f.startswith(g.rstrip('/')+'/') or fnmatch.fnmatch(f,g);hits=sorted({f for f in ch for g in P+D if hit(f,g)});aff=ca(ch);print('changed',len(ch),'hits',hits,'affected',aff);assert 'scripts/llm/litellm_wire.py' in ch and 'src/turn_capture/litellm_usage.py' in ch;assert not hits and not aff;print('NO_DEPLOY_TRIGGER_OK')"
    expected: >-
      Exit 0. The change list holds the wire module and the new usage module, no changed path matches a
      PROD_SOURCE_PATHSPECS or DUCKLAKE_SOURCE_PATHSPECS entry, affected is empty, and the last line is
      NO_DEPLOY_TRIGGER_OK.
    fix_if: >-
      An artifact is affected: a changed path is bundled somewhere. STOP to this planning thread; never deploy from this
      plan.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      It reads this branch's transient diff against the merge-base, which is empty on main. The data-pipeline excludes
      are held in every tier by the turn-capture and persona-backends boundary tests.
  - step: 7
    phase: pre-deploy
    action: Pre-handoff full tier on the committed, rebased tree (Decision 163), read through its evidence file.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      Start the full tier backgrounded with a 2 h limit from the top-level session (AGENTS.md; it outlasts the foreground
      cap), then read the verdict with --verify-head, never a pipe's exit status. It reports the full tier passed on
      HEAD's tree.
    fix_if: Any failure; fix and re-run both from the start (timeout_disposition blocked).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: rec-5112 is closed by the merge.
