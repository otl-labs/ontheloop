  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (166, 173, 199, 246)
  - All files in scope located and readable; docs/plans/approved/litellm-call-record.yaml read
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Read scripts/llm/litellm_wire.py, litellm_transport.py, litellm_cold_start.py,
    src/persona_backends/events.py, litellm_backend.py, tests/persona_backends/fakes.py and the sidecar.
  - >-
    Place the sidecar's two blocks in docs/contracts/inference-provider.yaml ({{DATE}} = build date). Re-join the
    three named notes (words unchanged) and measure effective lines (scripts.checks.structural._classify.effective_lines)
    at or under 500.
  - >-
    Write tests/fixtures/litellm_usage/vectors.json. Record each dump by serving its wire body through
    tests/fixtures/litellm_capture.py's capture() to litellm.completion offline (the path read_response consumes, not a
    provider config's transform_response), and write expected by hand from the approved rows. Then write
    src/turn_capture/litellm_usage.py and tests/turn_capture/test_litellm_usage.py, red first.
  - >-
    Write tests/test_llm_litellm_robustness.py (TestMissingUsage) and the new nodes in the transport, cold-start, wire and
    smoke tests red, then edit litellm_wire.py, litellm_transport.py, litellm_cold_start.py and the smoke script, and
    update the fakes. Each rec-5112 fix is tested in its source's mapped test file, so per-file coverage holds.
  - Edit src/persona_backends/events.py and litellm_backend.py and their tests.
  - Run bin/venv-python -m scripts.validate --pre and fix; git add the new files.
  - Execute Verification Plan steps 1-6. Run each step and loop until it passes; on an unrecoverable failure stop and RCA (Decision 55).
  - >-
    CLOSURE. Report each outcome separately: readiness, parent-validator evidence, postflight evidence, and the real
    push and PR outcome (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence).
    - Run bin/venv-python -m scripts.session.github_readiness.
    - Run /implement's Verification Graduation walk, which writes the registry shards
      litellm-usage-mapping-conformance, litellm-call-record-transport and litellm-call-record-events.
    - Record weakening_dispositions as planned-change, citing rec-5112 and this plan's scope rows, for each candidate
      validate_weakening_candidates lists, expected: tests/test_smoke_test_inference_credentials.py::TestRun::test_missing_row,
      the two `first is again` asserts in tests/test_llm_litellm_cold_start.py::TestGates, and the deepseek expectations
      in tests/test_llm_litellm_wire.py::TestRecords. Then set implementation_declared: true in this plan.
    - Commit (feat(litellm-call-record): ...) with the trailer `Resolves: rec-5112` in the commit body.
    - git fetch origin main && git rebase origin/main.
    - Run VP step 7 on that committed, rebased tree.
    - Write /tmp/implementation-retrospective.json with the scripts.session.postflight_evidence.CATEGORIES keys, then
      run bin/venv-python -m scripts.session.postflight --evidence /tmp/implementation-retrospective.json.
    - Push (git push -u origin HEAD as its own call). Open the PR, and report it as opened only with the returned PR
      number. Subscribe to it.
    - On green CI, squash-merge with the Resolves trailer in the commit message. Then run VP step 8.
    - No roadmap edit (T4.32 c1 stays open).
  - 'Report: what was implemented, verification results, and anything UNPROVEN.'
rollback: >-
  Revert the build commit. Nothing reads the new record fields yet (3b is unbuilt), no stored row or deployed artifact
  depends on them, and the contract rows revert with the code.
