    operator "write the plan" 2026-11-17 18:35 UTC on PRESENTATION-plan3a.md; decision card "Transport record, re-word
    rec" (no CustomLogger). rec-4028 re-worded the same day (title, file, acceptance; read back).
  - >-
    Offline probe at LiteLLM 1.106.2 on synthetic bodies, re-measured through litellm.completion over
    tests/fixtures/litellm_capture.py (critique r1 B1):
    - DeepSeek's dump keeps prompt_cache_hit_tokens and prompt_cache_miss_tokens, cached_tokens equals the hit count,
      and the id passes through.
    - Anthropic's prompt_tokens includes cache read and creation, the split sits at
      prompt_tokens_details.cache_creation_token_details, and reasoning_tokens is LiteLLM's estimate.
    - LiteLLM replaces Anthropic's message id with its own chatcmpl- id, hence response_id not_recorded.
    - A DeepSeek body with no usage gives Usage(prompt_tokens 0, completion_tokens 0, total_tokens 0, no details), hence
      the approved all-zero rule. An Anthropic body with no usage raises inside LiteLLM as APIConnectionError (an
      outage, retried). Only transform_response called directly leaves no usage attribute, so rec-5112's no-usage case
      is defensive hardening tested on a fake response.
    UNPROVEN until the fixture run: real provider usage keys and ids at deepseek-flash and claude-opus-5-5.
