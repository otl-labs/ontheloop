    verification_step: 2
    test_selector: tests/test_llm_litellm_robustness.py::TestColdStartLock
    red_green_expectation: red before (absent; on main a second key waits on the first probe), green after.
  - source: scripts/smoke_test_inference_credentials.py
    behavior: A contract load error returns 1 with a diagnostic.
    verification_step: 2
    test_selector: tests/test_llm_litellm_robustness.py::TestSmokeLoadOrder
    red_green_expectation: red before (absent; on main the load error raises), green after.
  - source: src/persona_backends/events.py
