execution_steps:
  - 'Pre: on the build''s base, re-run red_overlap and plan_obligations on this plan; confirm each sidecar block''s before-text occurs exactly once in docs/contracts/data-modeling-standard.yaml (else STOP to the plan owner: an amendment landed first and the words need re-approval). NEAR_CAP relief: measure the contract''s effective lines on the base (scripts.checks.structural._classify.effective_lines); placement adds one, so if the base is already at 533 STOP to the plan owner for compaction words, never a budget raise. Decision 275 retention: d02 is a terse row, so it adds no full amendment_log row.'
  - Edit scripts/telemetry_verify/silent_checks.py as its scope row says (PRODUCER constant, producer filter in check_tree after live_rows, one docstring sentence).
  - Place the sidecar's two blocks (d01-d02) in docs/contracts/data-modeling-standard.yaml with {{DATE}} set to the build's UTC date, and commit before VP 5.
  - Write tests/fixtures/telemetry_litellm_tree.py, tests/telemetry_verify/test_litellm_scoping.py and the test_monitor.py addition from the drafts; confirm 4 of 7 VP 2 nodes fail on the base code and contract (step 1's three among them) (git stash the two source edits, run, git stash pop) and all pass after.
  - Execute the Verification Plan -- run each step; loop until pass; on an unrecoverable failure stop and report to the plan owner (Decision 55).
  - Run the fresh-context code review (implement skill) on the diff; a REVISE is fixed and reviewed again.
  - 'Merge only on code review PROCEED and green CI (operator ruling 2026-11-16: a build of an approved plan merges on green), squash, with expectedHeadSha. The squash body carries Resolves: rec-5388 as its own paragraph; rec-4028 stays open.'
  - 'Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state (scripts.session.github_readiness); parent validator evidence (VP step 7 plus --verify-head for the pushed HEAD); structured postflight evidence (scripts.session.postflight --evidence); the real outcome - push, build PR, CI green by event-driven wake (never polled), merge SHA.'
  - 'Report: what changed, verification results, the four closure-evidence facts, merge SHA.'
