followon_recs: [rec-5385]
infrastructure_dependencies: []
acceptance_criteria:
  - The four silent checks count no litellm row; claude_code counts are unchanged beside a litellm tree.
  - The reader verbs and the monitor's re-derivation agree on a litellm tree (running, abandoned, closed), and the monitor's silent counts do not move when one is added.
  - The data-modeling standard holds the sidecar's words exactly (approved_text verify passes against main), and validate_contract_drift reports no error on the committed change.
  - The existing telemetry_verify, arrival and data-model-standard tests still pass.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The LL-5 unit and contract-words tests (no duckdb, so PR CI's fast-tier runner replays all three).
    command: >-
      bin/venv-python -m pytest -q
      tests/telemetry_verify/test_litellm_scoping.py::test_a_litellm_tree_counts_toward_no_silent_check
      tests/telemetry_verify/test_litellm_scoping.py::test_claude_code_counts_are_unchanged_beside_a_litellm_tree
      tests/telemetry_verify/test_litellm_scoping.py::test_the_sessions_arrival_denominator_excludes_litellm_roots
    expected: >-
      Exit 0, the three named nodes pass. Red before, measured on main 9b549344 with the draft test: all three fail (the
      litellm unit tree counts harness_key_missing 1/1, checkout_sha_missing 2/2, background_notice_unknown 1/1 and
      resume_without_prior_close 1/1; beside a claude_code tree harness_key_missing reads 2/2 against 1/1 and
      checkout_sha_missing 2/2 against 1/1; the words are absent). On a simulated build all three pass.
    expected_literals:
      - 3 passed
    fix_if: A silent-check failure means the producer filter is missing or placed before dedupe; a words failure means the placed text differs from the sidecar. Fix the source, never the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: litellm-claude-code-scoping
  - step: 2
    phase: pre-deploy
    action: The whole LL-5 file, duckdb cases included (the writer, the reader verbs, the oracle and the monitor over the hand-written litellm tree).
    command: >-
      bin/venv-python -m pytest -q tests/telemetry_verify/test_litellm_scoping.py
      tests/telemetry_verify/test_monitor.py::test_a_litellm_tree_is_rederived_and_never_silent_checked
    expected: >-
      Exit 0, seven nodes pass in a session with duckdb installed (the fast-tier runner, without duckdb, skips the four
      duckdb cases inside the tests, which is why step 1 is the replayed guard). Red before on main 6fcf9540: 4 of 7 fail
      (step 1's three, and the monitor case with harness_key_missing 28/29 against 27/28 and checkout_sha_missing 45/51
      against 44/50); the three state cases pass, as they guard behaviour main already has. On a simulated build all 7
      pass.
    fix_if: A state or monitor-agreement failure is a reader or derive defect, a STOP to the plan owner, never a test edit; a silent-count failure is the producer filter.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The full tier already runs these tests with duckdb on every merge, and the duckdb-free guard is step 1's graduated copy, so a second graduated copy would add no guard.
  - step: 3
    phase: pre-deploy
    action: The placed contract text equals the approved sidecar.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug litellm-claude-code-scoping --base origin/main
    expected: Prints APPROVED-TEXT OK.
    expected_literals:
      - APPROVED-TEXT OK
    fix_if: Words differ; re-place the blocks verbatim with only {{DATE}} filled, never edit the sidecar.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Compares the tree with the base branch's approved sidecar, which validate_merge_step already replays on every PR, so a graduated copy would add no guard.
  - step: 4
    phase: pre-deploy
    action: Existing readers of the changed module and contract still pass.
    command: >-
      bin/venv-python -m pytest tests/telemetry_verify/test_silent_checks.py tests/telemetry_verify/test_monitor.py
      tests/telemetry_verify/test_main.py tests/telemetry_verify/test_session_presence.py
      tests/checks/contracts/test_validate_data_model_standard.py tests/telemetry/test_contract_amendments.py -q
    expected: Exit 0.
    fix_if: A broken existing assertion means the filter changed a claude_code count or the placement moved a token an older test reads; fix within scope and the approved words, else STOP to the plan owner.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: These tests are the standing suite the fast and full tiers already run, so a graduated copy would add no guard.
  - step: 5
    phase: pre-deploy
    action: The contract drift gate on the committed change (it diffs committed HEAD against the merge base, so commit first).
    command: >-
      git diff --quiet HEAD -- docs/contracts/data-modeling-standard.yaml &&
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as c;
      f=[]; c(f); print(f); raise SystemExit(1 if f else 0)"
    expected: Exit 0, and the last line is []. The leading git diff fails the step if the contract edit is not committed, where the gate would pass vacuously.
    fix_if: A drift error means the placed text differs from the sidecar or the sidecar lacks an entry; re-place verbatim, else STOP to the plan owner.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Relative to the PR's merge base, so a graduated copy is green by construction; the same gate already runs in the --pre and full tiers.
  - step: 6
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: All fast-tier checks pass.
    fix_if: A check fails; fix inside scope or STOP to the plan owner; never loosen a check (Decision 235).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Full tier passes and --verify-head confirms it for the head. Start it backgrounded with a 2 h limit from the top-level session (a subagent never receives the completion), with HOME an empty directory (tests/test_aws_profile.py); its verdict is --verify-head, never a pipe's exit status.
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner (main reds owned elsewhere, such as rec-5247, rec-5276, rec-5355 and rec-5364, are deferred, not fixed here).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: Confirm rec-5388 is closed (the squash-merge Resolves trailer closes it; its acceptance is VP 1's first node).
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5388']); print(sorted((x['id'], x['status']) for x in r), m)"
    expected: Prints rec-5388 with status closed and an empty missing list, after the closure job runs on the merge commit.
    fix_if: Still open - read the ci.yml closure job log for an acceptance refusal or a missing Resolves line and fix its cause, never a direct status write (Decision 84 I-4).
    hermetic: false
    graduation: not-applicable
