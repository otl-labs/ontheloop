handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: litellm-claude-code-scoping
intent: >-
  Solves rec-5388 (split from rec-4028, the litellm telemetry producer), the LL-5 leg of
  docs/contracts/telemetry-event-envelope.yaml:
  make the scoping true before the first litellm row is written, so a verdict persona's run is never judged by checks
  written for Claude Code transcripts (the operator's ask: keep the Claude Code alarms valid). Today the monitor's four
  stored-row silent checks gate only on parser_version >= 4 across producers, so a litellm root at version 4 or later
  raises harness_key_missing and checkout_sha_missing (measured below). This plan scopes the four checks to producer
  claude_code, states in the data-modeling standard's telemetry_sessions arrival denominator that a litellm root is
  outside it, adds a hand-written litellm tree to the monitor's tests (the reader verbs and the monitor's own
  re-derivation agree on it: running, then abandoned, or closed from its end record), and records the monitor
  read-budget sizing as rec-5385 rather than a silent cap. Serves NS.6: verdict runs on GitHub are measured from their
  first run without corrupting the Claude Code alarms.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-litellm-claude-code-scoping.yaml
phase: >-
  T4.32 c1 (telemetry leg, part; rec-5388, split from rec-4028); closes no criterion. Related plans:
  PLAN-litellm-producer-envelope (merged, LL-5 words), PLAN-litellm-attempt-capture (planning beside this), and the
  producer and registry plan (after it). No dependency; must merge before any persona run writes the first litellm row (the producer plan, and the first live key
  read on the persona-verdict-egress line, neither planned yet); the coordinator carries that ordering into both briefs. Nothing deploys: the monitor
  runs from the repository in telemetry-verification.yml.
closes_criteria: []
cites: [dec:246, dec:250, dec:275]
scope:
  - file: scripts/telemetry_verify/silent_checks.py
    action: Modify
    purpose: >-
      Add PRODUCER = "claude_code". check_tree keeps, from each table's live rows (after live_rows, so dedupe and
      generations are unchanged), only rows whose producer is PRODUCER before the four checks run, so a litellm row
      never enters a numerator or a denominator, and _resume never reads a litellm model_call. The module docstring
      gains one sentence: only producer claude_code's rows are checked (telemetry-event-envelope.yaml LL-5), because the
      checks read Claude Code transcript facts and PARSER_FLOOR is a claude_code parser_version, comparable within one
      producer only (R2). CHECKS, ALARM_CHECKS, REPORT_ONLY_CHECKS, PARSER_FLOOR and check_trees are unchanged; a day
      with only litellm trees reads untested (0/0), as an empty day does. The filter also drops other-producer rows inside
      a claude_code tree (ci_annotate, telemetry_sessions.yaml:96); no check reads them (_resume skips annotate rows,
      the others read open, resume and close), so no count moves. Feedback Loop's file.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      Exactly the approved sidecar docs/plans/approved/litellm-claude-code-scoping.yaml (blocks d01-d02): the
      telemetry_sessions arrival denominator gains one sentence (a litellm root has no Claude-Session trailer and no
      harness_session_key, so no trailer can name it and it is outside this denominator; persona-run arrival stays with
      telemetry_agents' residual expectation, rec-4951), and one top-level amendment_log entry. Decision 250 cl.1/cl.5
      keep each table's arrival scope in this one place. Structural lines 523 on main 9b549344, budget 533; one added
      line. session_presence.py is unchanged: it joins stored harness_session_key against trailers
      (session_presence.py:209), and a litellm root's key is null.
  - file: tests/fixtures/telemetry_litellm_tree.py
    action: Create
    purpose: >-
      The hand-written litellm tree (tests/fixtures is the shared-helper home; tests never import another test_*
      module): litellm_batches(ended) gives producer batches of one run_persona run (root session open, top-level run
      open with host_run_ref and a persona agent_type, one model_call with no parent turn, and the end-record session
      close and run close only when ended) for the real writer, and stored_rows gives the same rows in stored shape for
      the pure checks. Draft: /mnt/project-files/run-persona-backend/plan3b2b-telemetry_litellm_tree.py.
  - file: tests/telemetry_verify/test_litellm_scoping.py
    action: Create
    purpose: >-
      LL-5 tests over that tree, from the draft /mnt/project-files/run-persona-backend/plan3b2b-test_litellm_scoping.py:
      - test_a_litellm_tree_counts_toward_no_silent_check: a litellm tree at parser_version 4 (asserted >= PARSER_FLOOR)
        with a null harness key, a null checkout_sha, a resume after an unclosed call and a background close with an
        unknown notice token counts 0/0 on all four checks;
      - test_claude_code_counts_are_unchanged_beside_a_litellm_tree: check_trees over a claude_code tree plus a litellm
        tree equals the claude_code tree alone;
      - test_a_litellm_root_reads_from_its_end_record_close (3 cases, duckdb): through the real writer and reader verbs,
        session_state_and_duration and agent_run_state_and_duration read running a minute after the run, abandoned
        past the idle threshold with no end record, and success with one, and the monitor's oracle (derive) agrees;
      - test_the_sessions_arrival_denominator_excludes_litellm_roots: the placed d01 words, by tokens main lacks
        ("A litellm root", "no harness_session_key", "telemetry_agents' residual expectation (rec-4951)").
      The duckdb cases importorskip inside _catalog before importing the golden-chain fixture, so the two unit tests
      and the words test also run in the fast tier.
  - file: tests/telemetry_verify/test_monitor.py
    action: Modify
    purpose: >-
      One test, test_a_litellm_tree_is_rederived_and_never_silent_checked (draft
      /mnt/project-files/run-persona-backend/plan3b2b-test_monitor_addition.py), using the file's own world fixture: the
      golden World plus the litellm tree compares one more tree at 6 more reader calls, every verb agrees, and
      report.silent equals the World's without it. Two imports added (types.SimpleNamespace after the datetime import,
      so ruff I001 stays clean; litellm_batches with the other fixture imports).
      Feedback Loop's file.
