schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: litellm-local-host-root
intent: >-
  Solves rec-5437. A run_persona litellm run on a local persona compute host (local_container today; sandbox_runtime and
  sandbox_runtime_windows when T4.34 builds them) has no root ref, so the litellm producer DEFERS it and the run is never
  measured (ports.yaml PC-13). This plan roots such runs under the already-registered host_run_ref prefix
  local:<runtime>/<run id>: the local_container adapter mints one run id per run and returns the host-run sidecar, the
  litellm producer reads gha or local sidecars (parser_version 2), the claude_code reader stays gha-only, and host
  precedence is fixed now (when hosts nest, the outermost host's sidecar names the run). The persona compute host
  conformance suite binds every later local adapter to the same sidecar. PC-13 narrows to fargate. Serves NS.6 (persona
  runs are recorded run units on every host).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-litellm-local-host-root.yaml
phase: >-
  T3.22 (producer onboarding; rec-5437), cited for context only: a rec-driven slice that closes no criterion. Producer,
  host adapter, test and contract-word changes only: no row is sent and no writer, Lambda or workflow changes, so nothing
  deploys (V2).
closes_criteria: []
cites: [dec:101, dec:184, dec:199, dec:205, dec:206, dec:207, dec:210, dec:212, dec:231, dec:234, dec:246, dec:275, dec:279]
scope:
  - file: src/turn_capture/host_run.py
    action: Modify
    purpose: >-
      LOCAL_RUNTIMES = ("local_container", "sandbox_runtime", "sandbox_runtime_windows") and a frozen LocalRun(project_ref,
      agent, content_policy, runtime, run_id) dataclass. The schema_version 1 top-level parse (keys, project_ref PIN_REF,
      agent AGENT_KEY, content_policy) moves into one private helper both readers share. New
      parse_persona_host_run(data: bytes | None) -> HostRun | LocalRun | None, the litellm reader: host.kind "gha" uses the
      unchanged gha grammar, host.kind "local" needs host keys exactly {kind, runtime, run_id}, runtime in LOCAL_RUNTIMES
      and run_id matching [A-Za-z0-9_.-]{1,128} (the registered local: pattern's run id class); anything else is None.
      parse_host_run (the claude_code reader and rule P-5's resolve_pin) stays gha-only and byte-for-byte unchanged in
      behaviour, so no claude_code output changes. render_host_run_ref(host: HostRun | LocalRun) renders
      local:<runtime>/<run_id> for a LocalRun.
  - file: src/turn_capture/litellm_producer.py
    action: Modify
    purpose: >-
      map_run reads the sidecar with parse_persona_host_run. A LocalRun root: session litellm:local:<runtime>/<run id>
      (litellm_root_ref of the rendered ref, as today); the top-level run rows carry trigger manual, workflow_run_id
      NULL and host_run_ref local:<runtime>/<run id>; the session rows carry execution_attempt 1; Ctx gets host None (Ctx.host
      stays HostRun | None: only the claude_code path reads it). gha output is unchanged except the two version columns.
      PARSER_VERSION 2, PRODUCER_VERSION "litellm-2".
  - file: src/persona_hosts/local_container/adapter.py
    action: Modify
    purpose: >-
      RunImageResult gains host_run: bytes | None = None. run_image gains keyword-only project_ref: str | None = None,
      agent: str | None = None, host_run: bytes | None = None. Host precedence (the outermost host wins): a caller that
      already holds a sidecar passes it as host_run and gets the same bytes back; it may not also pass project_ref or
      agent (ValueError). Otherwise project_ref and agent go together (one without the other is a ValueError): run_image
      mints uuid.uuid4().hex as the run id on each call (a re-run is a new session; no hostname, Decision 101), builds the
      schema_version 1 sidecar {schema_version, project_ref, agent, content_policy "full", host {kind "local", runtime
      "local_container", run_id}} as sorted-key JSON bytes, and checks it with
      src.turn_capture.host_run.parse_persona_host_run before docker runs (an invalid project_ref or agent is a ValueError,
      so the grammar has one source, Decision 210 cl.3). agent is the persona's executor-personas.yaml registry_key (for
      example plan-critique), never its persona id (telemetry_agents run_shapes agent_type: the registry_key on a persona
      run, Decision 206 cl.7; one key on every host keeps cl.4's per-persona parity readable); the
      caller passes it, because the conformance fixture persona has no personas row. With none of the three, host_run is
      None and the run DEFERS, as today. src.persona_hosts may import src.turn_capture (.importlinter forbids only
      scripts, src.persona_backends, src.lambdas and src.data).
  - file: tests/persona_hosts/conformance_suite.py
    action: Modify
    purpose: >-
      One leg, test_run_returns_a_host_run_sidecar_the_producer_roots, parametrised over ADAPTERS like every leg (Decision
      212 cl.1-2: a later adapter adds an ADAPTERS entry, never a second suite): one complete-input run with
      project_ref "example/project" and agent "plan-critique" returns host_run bytes that parse_persona_host_run accepts;
      for an adapter id in LOCAL_RUNTIMES the result is a LocalRun whose runtime equals the adapter id and whose agent and
      project_ref are the ones passed. The sandbox_runtime adapters (T4.34:c3 binds them to this one gating suite,
      Decision 234 cl.2) inherit it. A later github_actions_shell or fargate ADAPTERS entry inherits it too, so the fargate
      adapter (T4.15:c12) passes this suite only once its host writes a root (PC-13, T4.15:c15): the leg ties the two. Needs the Docker daemon like the rest of the suite (ci.yml's conformance step).
  - file: tests/turn_capture/test_litellm_non_gha_root.py
    action: Create
    purpose: >-
      rec-5437's acceptance file. (1) A local sidecar maps to rows: one session open and close under
