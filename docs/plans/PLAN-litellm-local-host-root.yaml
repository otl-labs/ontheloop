      adapter ids in docs/contracts/ports.yaml (read from the file; growth-safe subset, never a count).
  - file: tests/turn_capture/test_litellm_producer.py
    action: Modify
    purpose: Unit legs for the LocalRun branches of the session and run rows (coverage of litellm_producer.py).
  - file: tests/persona_hosts/local_container/test_adapter.py
    action: Modify
    purpose: >-
      Daemon-free legs: a minted sidecar per call with a fresh run id (two calls differ), sorted-key bytes that
      parse_persona_host_run accepts; host_run passed through unchanged; ValueError for host_run with project_ref, for
      project_ref without agent and the reverse, and for an agent that fails the grammar; no sidecar when none is given.
  - file: tests/fixtures/turn_capture_litellm_cases.py
