    validate_weakening_candidates lists any other candidate, STOP to this planning thread; never record one to pass.
  - >-
    .secrets.baseline is out of scope and stays untouched (amendment 1): it is a derived pre-commit global input, so an
    edit escalates the fast tier's precommit_changed to pre-commit --all-files (Decision 170 as cited by
