execution_steps:
  - >-
    Run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-litellm-local-host-root.yaml; on blocked,
    stop and report. Read rec-5477 through the reader; if it is not closed, stop and report (its build must merge first).
  - Implement host_run.py, litellm_producer.py and adapter.py per their scope rows.
  - >-
    Add the local_container_run.json builder, regenerate every litellm case's expected_rows from its builder, add the new
    case to index.json and LITELLM_CASES, and register litellm version 2 in parser_versions.yaml with the recomputed
    digest. The new builder uses the placeholder rendered_prompt_sha256; .secrets.baseline stays untouched (amendment 1): a
    build branch that already edited it restores it from the merge base (git checkout $(git merge-base origin/main HEAD)
    -- .secrets.baseline), or merges main first.
  - Write the new and modified tests per their scope rows, including the conformance leg.
  - Place the sidecar's twelve blocks verbatim (approved_text verify passes).
  - Record weakening dispositions per the constraint.
  - Commit, then execute the Verification Plan (VP 1-4) on the committed tree (VP 4's drift gate reads merge_base..HEAD only, rec-5480); loop until pass; on an unrecoverable failure stop and report (Decision 55).
  - Code review via a fresh code-review subagent; fix blocking findings and rerun VP 1-4.
  - >-
    CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared true; commit; rebase
    on origin/main; re-run red_overlap; run VP 5 on the committed clean HEAD; push; open the build PR; subscribe; run
    merge_step premerge; squash-merge on code review PROCEED and green CI with "Resolves: rec-5437" in the commit body;
    run merge_step readback; then VP 6.
  - >-
    Report, as separate facts: what was implemented; readiness state; the full-tier exit plus validation_result
    --verify-head for the pushed HEAD; structured postflight evidence (bin/venv-python -m scripts.session.postflight
    --evidence); the push, PR number, CI result (including the conformance step's run id) and read-back merge SHA; VP 6's
    read-back.
rollback: >-
  Revert the build's squash commit to restore the producer, adapter, goldens and contracts. Rows a local run wrote before
  the revert keep their refs; a later re-introduction must reproduce the same local grammar or it is an R10 change. After a
  revert, file a successor rec via file_rec naming rec-5437 and the revert SHA (Decision 103: a resolved rec is never
  reactivated). A revert also demotes every file it reverts to gated whole (approval-routing.yaml demotions.rule,
  Decision 279 cl.7), so restoring them later needs an approval run; prefer a forward fix.
