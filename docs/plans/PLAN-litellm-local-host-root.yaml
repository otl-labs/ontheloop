      host_run_ref local:local_container/<run id>, execution_attempt 1, model_call rows under the same session ref.
      (2) Invalid local sidecars DEFER: an unknown runtime, a run id with ':' or '/', an extra host key, a missing
      run_id. (3) parse_host_run still returns None for a valid local sidecar (claude_code reads gha only). (4) Round
      trip: run_image with subprocess.run mocked (the test_adapter pattern) and project_ref and agent given returns a
      sidecar that map_run roots; given a gha sidecar as host_run, it returns those bytes unchanged and map_run roots the
      gha session (outermost host wins). Names stay as here: rec-5437's acceptance runs this file.
