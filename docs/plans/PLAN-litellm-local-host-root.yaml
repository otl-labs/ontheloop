      adapter ids in docs/contracts/ports.yaml (read from the file; growth-safe subset, never a count).
  - file: tests/turn_capture/test_litellm_producer.py
    action: Modify
    purpose: Unit legs for the LocalRun branches of the session and run rows (coverage of litellm_producer.py).
  - file: tests/persona_hosts/local_container/test_adapter.py
    action: Modify
