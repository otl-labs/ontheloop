schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: litellm-producer-envelope
intent: >-
  Plan 3b-1 of rec-4028 (the litellm telemetry producer). A blind consult split 3b in two: this plan declares, in
  docs/contracts/telemetry-event-envelope.yaml alone, the rules the producer will follow, so the telemetry owner
  (Feedback Loop) reviews them before code is built against them; plan 3b-2 builds the producer, its parser_version
  registry entry and golden corpus, and the three row contracts' realization edits, which the field-realization check
  couples into one PR. Declared here:
  - a sole transcript-less producer (litellm, for a run_persona run) pins session_started_at from its run record's
    integer epoch-ms start, on the same clock as its rows;
  - LL-1 root session litellm:<host_run_ref>, one retry ordinal per run_persona run in the job, read as outside R10;
    a run with no host-run sidecar (another persona compute host) defers;
  - LL-2 positional model_call refs where no provider response id is recorded, and the open and end-record close refs;
  - LL-3 R7 without a cursor: a partial events file maps to open rows and model_calls only;
  - LL-4 declared losses: the call a deadline cancelled in flight (presumed billed) is one more attempt entry in its
    turn record, written from the selection it sent, and keeps a zero-token row with a cancelled marker (the operator's
    card; 3b-2 makes the backend record it); a deadline with no call in flight adds nothing; failed, malformed and
    empty attempts get zero-token rows marked usage-not-recorded (rec-5352); a transport_exception abort's loss is
    declared on the run close; a no-choices probe leaves no row (rec-5338);
  - LL-5 the checks written for Claude Code transcripts (the monitor's silent checks, the ledger and shape legs, the
    Decision 250 arrival oracle) are scoped to producer claude_code; plan 3b-2 does that in code before the first row.
  No code, no row, no deploy. Serves NS.6: verdict runs on GitHub are measured from their first run.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-litellm-producer-envelope.yaml
phase: >-
