    behavior: the sole-producer pin, the LITELLM PARSER_VERSION 1 line (LL-1..LL-5), the R10 first-grammar sentence and both amendment entries are present
    verification_step: 1
    test_selector: tests/telemetry/test_litellm_producer_envelope_notes.py
    red_green_expectation: red before (5 of 6 fail on main), green after
