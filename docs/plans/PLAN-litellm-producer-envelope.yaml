scope:
  - file: docs/contracts/telemetry-event-envelope.yaml
    action: Modify
    purpose: >-
      Exactly the approved sidecar docs/plans/approved/litellm-producer-envelope.yaml (blocks e01-e05): the sole
      transcript-less producer pin in session_started_at.semantics and its field amendment entry,
      the LITELLM PARSER_VERSION 1 line (LL-1..LL-5, with the stated Decision 228 deviation: no turn rows) before DQ
      intents in governance_notes, one sentence after R10 in parser_version.description (a new producer's first session
      entity_ref grammar is not a change to one), and one top-level amendment_log entry. Stays at or under 500
      effective lines (451 on main 52caa35a, 462 after).
  - file: tests/telemetry/test_litellm_producer_envelope_notes.py
    action: Create
    purpose: >-
      Contract-notes test in the precedent of tests/telemetry/test_persona_producer_contract_notes.py:
      - test_envelope_declares_litellm_line_before_dq_intents: the LITELLM PARSER_VERSION 1 line sits after the
        PARSER_VERSION 11 line and before DQ intents and names this plan, rec-4028, LL-1..LL-5, litellm:<host_run_ref>,
        <session ref>/call/<turn>/<n>, '<session ref>/end#0/close', '<session ref>/end#0/run_close', outside R10,
        rec-5338, rec-5352, producer claude_code, harness_key_missing, outcome cancelled, transport_exception and
        no host-run sidecar;
      - test_session_started_at_declares_the_sole_producer_pin: session_started_at.semantics names the sole producer
        pin, started_at_ms, DEFERS and no skew allowance, and its field amendment_log has this
        plan's governance_note_add entry;
      - test_r10_says_a_first_grammar_is_not_a_change: parser_version.description keeps R10 and gains the first-grammar
        sentence;
      - test_litellm_line_states_the_decision_228_deviation: the LITELLM line says it emits no turn rows and cites
        Decision 228 cl.1 and cl.3;
      - test_top_level_amendment_entry_is_a_semantic_break: the top-level amendment_log entry names this plan and
        LITELLM PARSER_VERSION 1 with semantic_break true;
      - test_envelope_stays_within_the_size_limit: effective lines <= 500.
