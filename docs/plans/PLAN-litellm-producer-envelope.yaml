acceptance_criteria:
  - The envelope holds the sidecar's words exactly (approved_text verify passes against main).
  - The new contract-notes test passes, and the existing envelope and contract-amendment tests still pass.
  - The envelope stays at or under 500 effective lines.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The new contract-notes test.
    command: bin/venv-python -m pytest tests/telemetry/test_litellm_producer_envelope_notes.py -q
    expected: Exit 0, six nodes pass. Red before, measured on main 52caa35a with the draft test, 5 of 6 fail (the size guard passes by design).
    expected_literals:
      - 6 passed
    fix_if: A token missing from the contract text means the placed text differs from the sidecar; fix the placement, never the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: litellm-producer-envelope-notes
  - step: 2
    phase: pre-deploy
    action: The placed contract text equals the approved sidecar.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug litellm-producer-envelope --base origin/main
    expected: Prints APPROVED-TEXT OK.
    expected_literals:
      - APPROVED-TEXT OK
    fix_if: Words differ; re-place the blocks verbatim with only {{DATE}} filled, never edit the sidecar.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Compares the tree with the base branch's approved sidecar, which validate_merge_step already replays on every PR, so a graduated copy would add no guard.
  - step: 3
    phase: pre-deploy
    action: Existing envelope readers still pass.
    command: >-
      bin/venv-python -m pytest tests/telemetry/test_contract_amendments.py tests/telemetry/test_persona_producer_contract_notes.py
      tests/checks/contracts/test_telemetry_event_journal_contracts.py tests/telemetry/test_identity.py -q
    expected: Exit 0.
    fix_if: A broken existing assertion means the insertion moved a token an older test reads; fix the placement within the approved words, else STOP to the plan owner.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: These tests are the standing suite the fast and full tiers already run, so a graduated copy would add no guard.
  - step: 4
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: All fast-tier checks pass.
    fix_if: A check fails; fix inside scope or STOP to the plan owner; never loosen a check (Decision 235).
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Full tier passes and --verify-head confirms it for the head. The full tier runs past the 10-minute foreground cap, so start it backgrounded with a 2 h limit from the top-level session (a subagent never receives the completion); its verdict is --verify-head, never a pipe's exit status.
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner (main reds owned elsewhere, such as Feedback Loop's rec-5247 and rec-5276, are deferred, not fixed here).
    hermetic: false
    graduation: not-applicable
test_obligations:
