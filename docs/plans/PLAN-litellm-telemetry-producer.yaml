    PR 1. Contract bookkeeping, exactly: (a) in each of the three row contracts' realization block, append to produced
    the key litellm with these lists, in this order, keeping produced and unproduced each one flow-mapping line (a
    reflow crosses telemetry_sessions' 500-line cap). telemetry_observations: event_kind, event_timestamp,
    session_started_at, source_ordinal, external_ref, entity_ref, producer, producer_version, parser_version,
    observation_type, name, outcome, model, tokens_input, tokens_output, tokens_cache_read, tokens_cache_creation,
