implementation_declared: false
bundled_recommendations: [rec-5396]
followon_recs: [rec-5437]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    One events file (schema 2) and its host-run sidecar map to one root session, one top-level run (open, and a close
    from the end record) and one model_call row per provider attempt in send order, the probe record included; every
    column is a pure function of the two files, so a prefix file's rows are a subset of the final file's.
  - >-
    A cancelled attempt is a zero-token row with outcome interrupted and metadata loss cancelled; a failed, malformed or
    empty attempt is a zero-token row with outcome error and loss usage_not_recorded; both usage_final false and
    usage_source NULL; no new accepted value is emitted (rec-5396's test_failed_attempt_emits_row).
  - >-
    A schema other than 2 is refused; a missing or invalid sidecar, or a header without started_at_ms, defers and
    writes nothing; a row before the pin halts and writes nothing.
  - >-
    The producer is registered as litellm parser_version 1 with its golden digest; validate_telemetry_field_realization
    passes R1-R8 with produced.litellm in all three row contracts; every golden case's rows pass the kernel
    (test_rows_pass_kernel).
  - >-
    The sidecar's twenty-four blocks are placed word for word by PR 2 (approved_text verify), and every edited contract stays
    within its Decision 275 byte budget and the 500 effective-line cap.
  - The producer and the entry are never imported by scripts/run_persona.py; nothing sends a row.
  - rec-5396 is closed by PR 2's Resolves trailer, and its acceptance command passes on main (VP 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: PR 1. The producer rules, the acceptance nodes, the golden corpus and the entry.
    command: >-
      bin/venv-python -m pytest tests/turn_capture/test_litellm_producer.py tests/personas/test_telemetry_rows.py
      tests/turn_capture/test_refs.py tests/turn_capture/test_litellm_usage.py::test_usage_mapping_conformance -q
    expected: >-
      Exit 0, every node passes. Red before: the two new test files are absent (pytest exits 4).
    fix_if: >-
      A guessed row for an unknown attempt list, a loss row with tokens, or a prefix row that differs from the final
      file's: fix the producer, never the corpus.
    hermetic: false
    graduation: graduate
    graduation_check_id: litellm-telemetry-producer-rules
  - step: 2
    phase: pre-deploy
    action: PR 1. Registration and realization.
    command: >-
      bin/venv-python -m pytest tests/telemetry/test_parser_version_registry.py
      tests/checks/contracts/test_validate_telemetry_field_realization.py -q
    expected: >-
      Exit 0. The registry checks run for claude_code and litellm, and the realization check's live-repository node
      passes (R2 litellm registered, R4 every credited field non-null in the litellm corpus, R5, R6, R8).
    fix_if: >-
      R4: add a golden case that carries the column, never drop the credit without a STOP. R6: credit the column or stop
      emitting it, per the scope's lists.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Both files are standing tests in every tier that reads the registry or the row contracts.
  - step: 3
    phase: pre-deploy
    action: PR 1. Import boundaries. run_persona's closure is unchanged and the producer imports nothing outside stdlib and src/turn_capture.
    command: >-
      bin/venv-python -m pytest tests/turn_capture/test_litellm_usage.py::test_run_persona_closure_adds_only_litellm_usage
      tests/persona_backends/test_package_boundary.py tests/turn_capture/test_package_boundary.py -q &&
      bin/venv-python -m scripts.import_governance --check-contracts
    expected: Exit 0 from both; import-linter reports 0 contracts broken.
    fix_if: An import of the producer from run_persona or src/persona_backends; keep the producer standalone.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The closure and boundary tests run in every fast tier and the import-linter run is a registered check, so a shard
      would duplicate them.
  - step: 4
    phase: pre-deploy
    action: >-
      PR 1 and PR 2. No Lambda artifact bundles a changed path, and no PROD or DuckLake deploy channel watches one
      (Decision 249 clause 2).
    command: >-
      bin/venv-python -c "import subprocess;from scripts.convergence_health.code_drift import PROD_SOURCE_PATHSPECS as P,DUCKLAKE_SOURCE_PATHSPECS as D;from scripts.lambda_manifest import compute_affected_artifacts as ca;import fnmatch;run=lambda a:subprocess.run(a,capture_output=True,text=True,check=True).stdout.split();mb=subprocess.run(['git','merge-base','HEAD','origin/main'],capture_output=True,text=True,check=True).stdout.strip();ch=sorted(set(run(['git','diff','--name-only',mb]))|set(run(['git','ls-files','--others','--exclude-standard'])));hit=lambda f,g:f==g or f.startswith(g.rstrip('/')+'/') or fnmatch.fnmatch(f,g);hits=sorted({f for f in ch for g in P+D if hit(f,g)});aff=ca(ch);print('changed',len(ch),'hits',hits,'affected',aff);assert ch;assert not hits and not aff;print('NO_DEPLOY_TRIGGER_OK')"
    expected: >-
      Exit 0. No changed path matches a PROD_SOURCE_PATHSPECS or DUCKLAKE_SOURCE_PATHSPECS entry, affected is empty, and
      the last line is NO_DEPLOY_TRIGGER_OK.
    fix_if: An artifact is affected; STOP to this planning thread, never deploy from this plan.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: It reads this branch's transient diff against the merge-base, which is empty on main.
  - step: 5
    phase: pre-deploy
    action: >-
      PR 2. The approved words are placed word for word, the byte and line budgets hold, and the contract checks pass.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug litellm-telemetry-producer && bin/venv-python -m
      pytest tests/checks/contracts/test_validate_ports_contract.py tests/checks/contracts/test_ports_verdict_chain_records.py
      tests/checks/contracts/test_persona_image_channel.py tests/telemetry/test_capture_v8_contract_notes.py
      tests/telemetry/test_contract_amendments.py tests/telemetry/test_retire_session_cli_contract_notes.py
      tests/telemetry/test_litellm_producer_contract_notes.py -q
    expected: >-
      Prints the approved-text OK line, then exit 0 from pytest. Each of telemetry_observations, telemetry_sessions,
      telemetry_agents and ports.yaml is within its byte budget (validate_structural_size_budgets, run by VP 6).
    fix_if: >-
      A before-block not found (main moved under a block): STOP to this planning thread for a sidecar amendment, never
      re-word a block.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
