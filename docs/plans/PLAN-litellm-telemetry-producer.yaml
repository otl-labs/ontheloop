schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: litellm-telemetry-producer
intent: >-
  Solves rec-5396, the producer half of superseded rec-4028. PLAN-litellm-producer-envelope put the rules in
  docs/contracts/telemetry-event-envelope.yaml (LL-1..LL-5, the sole-producer session_started_at pin) and
  PLAN-litellm-attempt-capture (#2262) made the run_persona events file (schema 2) hold every billed call. This plan
  builds the pure litellm producer: one events file plus the run's host-run sidecar map to Decision 199 rows (one root
  session, one top-level agent run, one model_call row per provider attempt, a lost call a zero-token row with a declared
  loss marker), written to a rows file by an entry script that sends nothing. It registers the producer as parser_version
  1 with a golden corpus, and the three row contracts, ports.yaml and executor-personas.yaml credit it. Serves NS.6:
  verdict persona runs on GitHub are measurable from their first run, including the calls a deadline cut short.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-litellm-telemetry-producer.yaml
phase: >-
  T4.32 c1 (telemetry leg, part; rec-5396); closes no criterion. PLAN-litellm-attempt-capture is built (#2262, 920d18ad).
  src/turn_capture is inert content of the data-pipeline bundle; compute_affected_artifacts over the scope returns {}
  and no row is sent, so nothing deploys (V2; VP 4 proves no deploy trigger).
closes_criteria: []
cites: [dec:199, dec:206, dec:210, dec:212, dec:228, dec:234, dec:235, dec:240, dec:246, dec:263, dec:275]
scope:
  # ---------------------------------------------- PR 1: the producer, its registration, corpus and contract bookkeeping
  - file: src/turn_capture/refs.py
    action: Modify
    purpose: >-
      PR 1. litellm_root_ref(host_run_ref) -> 'litellm:<host_run_ref>' and litellm_call_ref(session_ref, turn, position)
      -> '<session_ref>/call/<turn>/<position>' (position an int from 1 or the string probe). Every other litellm ref
      is composed from the existing builders: the run ref '<session ref>/run' (a new litellm_run_ref), the open markers
      with session_marker_ref, the end close refs with role_ref('<session ref>/end', 0, 'close' or 'run_close'), a
      provider-id model_call with model_call_ref. The module stays the only place a ref is composed.
  - file: src/turn_capture/litellm_producer.py
    action: Create
    purpose: >-
      PR 1. Pure mapper, stdlib plus src/turn_capture only (refs, host_run, observations.OBSERVATION_COLUMNS,
      sessions.SESSION_COLUMNS, AGENT_COLUMNS and agent_row_base, transcripts.Ctx); never imported by
      scripts/run_persona.py or src/persona_backends. PARSER_VERSION 1, PRODUCER "litellm", PRODUCER_VERSION
      "litellm-1". map_run(events: dict, host_run: bytes | None) -> Mapped | Deferred | Refused, where Mapped holds
      batches (observations, agents, then sessions last, LL-3) and diagnostics (a Counter). The rules, named in the module
      docstring as LM-1..LM-8:
      - Ref columns on every row (src/telemetry/identity.py KEY_PLANS): session_ref is the root session ref on every
        observation and agent row; parent_observation_ref is NULL on model_call rows; observation_ref is NULL on agent
        rows; parent_session_ref is NULL on session rows.
      - LM-1 input: header.schema other than 2 is Refused; a header without an integer started_at_ms, or a sidecar that
        parse_host_run rejects or that is absent, is Deferred (LL-1, the pin rule). session_started_at is the pin, from
        started_at_ms as UTC; every event_timestamp comes from the same clock.
      - LM-2 session (telemetry_sessions, entity_ref litellm_root_ref(render_host_run_ref(host))): the open row at the
        pin, external_ref '<ref>#0/open', source_ordinal 0, workflow = host.agent, execution_attempt =
        int(host.run_attempt). When the end record exists, one close row at end.ended_at_ms, external_ref
        '<ref>/end#0/close', outcome success when end.outcome is success, else failed, failure_reason end.failure or
        end.error (NULL on success). No resume, compact or turn rows (LL-3).
      - LM-3 top-level run (telemetry_agents, entity_ref '<session ref>/run'): agent_type host.agent, version
        str(header.contract_version), trigger host.event_name, workflow_run_id host.run_id, host_run_ref
        render_host_run_ref(host), definition_sha256 header.rendered_prompt_sha256, on both rows. The open row at the pin
        ('<session ref>/run#0/open', source_ordinal 0) reads no turn record (LL-3), so its model is NULL. The close row
        ('<session ref>/end#0/run_close', from the end record) takes model from the last turn record that carries a
        record (its model, else its requested_model), outcome success | timeout (end.failure budget_exhausted) | failed
        (any other failure, and every aborted end), error NULL on success, else end.error or end.failure.
      - LM-4 model_call rows (telemetry_observations, observation_type model_call, event_kind point, persona_backend
        litellm, session_ref the root session ref, no parent observation). Walk the turn records in order and each turn's attempts in order, position n from
        1. An ok entry maps the turn's record; any other entry is a loss row from the entry. A turn's probe_record maps
        one row placed just before the turn's first entry whose role is warm_fetched_escape_hatch with attempt 1 or
        more, else after its entries. A turn with attempts_known false maps no row and counts diagnostics
        attempts_unknown (a transport that filled no capture; never a guessed row). An ok entry whose turn has no record
        maps no row and counts diagnostics ok_without_record.
      - LM-5 refs (LL-2): a record with a response_id takes entity_ref <response_id> and external_ref
        model_call_ref(response_id); every other row takes entity_ref litellm_call_ref(session ref, turn, n), or
        position probe for the probe record, and external_ref '<entity_ref>/model_call'.
      - LM-6 columns of a record row: name the record's role (cold_start_probe for the probe record), outcome success,
        model record.model else record.requested_model, requested_model, provider, billing_shape, reasoning_effort, the
        four token classes, reasoning_tokens, cache_creation_1h_tokens and cache_creation_5m_tokens from the record,
        attempt record.attempt (NULL for the probe record), usage_final true exactly when record.usage_absent is empty
        (false otherwise: the zero-filled classes are a lower bound, inference-provider.yaml missing_usage; a unit node
        covers it), usage_source record, event_timestamp
        responded_at_ms, else started_at_ms plus latency_ms, else the turn's ended_at_ms. reasoning_visibility from the
        turn's message (a probe record has none): thinking_blocks with non-empty thinking -> summarized; thinking_blocks
        only redacted -> redacted; non-empty reasoning_content -> full; else reasoning_tokens above 0 -> omitted; else
        none; a none row's reasoning_tokens is NULL or 0 as the record has it.
      - LM-7 loss rows (LL-4): an entry with outcome cancelled -> outcome interrupted, metadata {"loss": "cancelled"};
        any other non-ok outcome (an outage, credit_exhausted, provider_error, malformed_output, empty_output) ->
        outcome error, metadata {"error": <entry outcome>, "loss": "usage_not_recorded"}. Both: the four token classes
        0, reasoning_tokens NULL, reasoning_visibility none, usage_final false, usage_source NULL, model and
        requested_model the entry's model, provider and billing_shape the entry's, reasoning_effort NULL, attempt the
        entry's attempt when 1 or more (a probe entry's 0 is never written: NULL), name the entry's role,
        event_timestamp the entry's started_at_ms plus latency_ms (the turn's started_at_ms when the entry has none).
        No new accepted value is emitted.
      - LM-8 ordering and HALT: source_ordinal 0 for the two open rows, 1..N for model_call rows in walk order, N+1 for
        both close rows. A row whose event_timestamp is before the pin raises ProducerHalt (no rows). Every column is a
        pure function of the two inputs (LL-3), so a prefix file (no end record) maps to the open rows and its
        model_calls, which equal the final file's rows for those turns.
      The producer builds transcripts.Ctx for agent_row_base with the record's billing_shape and full_output_cap_bytes 0
      (an int; litellm writes no output capture). Stays under 500 SLOC (Decision 128); if it would cross, split into a src/turn_capture/litellm/ facade package.
  - file: scripts/personas/telemetry_rows.py
    action: Create
    purpose: >-
      PR 1. Entry point: bin/venv-python -m scripts.personas.telemetry_rows --events PATH --host-run PATH --out PATH.
      Reads the events JSON and the sidecar bytes (a missing sidecar file is None), calls map_run, and on Mapped writes
      the rows file atomically (tmp then os.replace): {"producer", "parser_version", "producer_version", "batches":
      [{"table", "rows"}], "diagnostics"}, timestamps as UTC ISO-8601 millisecond strings ending in Z. Exit 0 written;
      2 refused (unreadable events JSON, a schema other than 2); 3 deferred (no rows file is written, one stderr line
      naming the reason); 4 producer HALT. It sends nothing and imports no writer, AWS or network module.
  - file: tests/turn_capture/test_litellm_producer.py
    action: Create
    purpose: >-
      PR 1. rec-5396's acceptance nodes test_failed_attempt_emits_row (every failed, malformed and empty attempt gets its
      zero-token row with outcome error and loss usage_not_recorded), test_reasoning_visibility_matrix (the LM-6 order
      over message shapes: thinking text, redacted only, reasoning_content, tokens only, nothing, a probe record) and
      test_rows_pass_kernel (every golden case's batches pass src/telemetry prepare_batch with the live specs, as
      tests/turn_capture/test_record_turn.py::test_every_emitted_row_passes_kernel_rules does). Plus one node per rule:
      LM-1 refused schema, deferred sidecar and deferred pin; test_imports_stay_inside_turn_capture (the module's own direct
      imports, read from its AST, are stdlib plus src.turn_capture only; and, in a -I subprocess that puts the repo root on
      sys.path itself (-I implies -P) and imports only the producer module (no asyncio, which loads ssl), importing it loads none
      of src.telemetry.append, src.telemetry.gate, src.telemetry_client, boto3, botocore, urllib.request, http.client, ssl
      or socket (urllib.parse, src.sensitive_values and src.telemetry.timestamps are reached legitimately through
      provenance.py, pathlib, scrub.py and transcript.py); LM-2/LM-3 outcome tables (success, budget_exhausted ->
      timeout and failed, other failure, aborted); LM-4 probe placement and attempts_unknown; LM-5 both ref forms; LM-7
      cancelled row; LM-8 the prefix rule (a partial file's rows are a subset of the final file's) and the HALT;
      test_cases_match_builders (every golden case regenerates from its builder) and test_golden_rows (each case's
      normalised rows equal its expected_rows). End to end: each golden builder runs the real backend
      (src/persona_backends/litellm_backend.py) with a fake transport and the real events sink, then this producer.
