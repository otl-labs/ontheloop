    unproduced becomes {held:feedback-loop-gate: [rec_id], T4.32:c1: [exit_code], rec-4600: [cost_usd_reported,
    acceptance_passed, time_lost_seconds]}. telemetry_sessions: event_kind, event_timestamp, session_started_at,
    source_ordinal, external_ref, entity_ref, producer, producer_version, parser_version, workflow, outcome,
    execution_attempt, failure_reason. telemetry_agents: event_kind, event_timestamp, session_started_at,
    source_ordinal, external_ref, entity_ref, producer, producer_version, parser_version, agent_type, model, version,
    trigger, outcome, error, workflow_run_id, host_run_ref, definition_sha256. (b) In the populated_by of every field
    in those lists that names the claude_code producer, replace the leading "the claude_code producer" with "the
    claude_code and litellm producers" (R8); in telemetry_agents workflow_run_id and host_run_ref the result then reads
    "the claude_code and litellm producers (claude_code producer from parser_version 8), ...", and definition_sha256's
    whole populated_by becomes "the claude_code and litellm producers. claude_code from parser_version 11, on a verdict
    persona's sub-agent run (its open and close rows; src/turn_capture/persona_identity.py and record_turn.py), NULL on
