schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "llm-client-litellm-transport"
intent: >-
  Add the LiteLLM transport the verdict personas call: scripts/llm/litellm_transport.py (with its per-provider wire
  table in scripts/llm/litellm_wire.py and its cold-start assertion in scripts/llm/litellm_cold_start.py) sends one persona's messages
  to the model its tier role resolves to (scripts/llm/tier_selection.resolve over inference-provider.yaml and
  project-configuration.yaml, read at call time), passes each provider's thinking and effort fields the way it accepts
  them, reads the role's key from the process environment by its registered variable name, retries outages a bounded
  number of times, fails over to the warm-fetched fallback role only when the caller asks, and returns a per-call
  record of the model asked for, the model the provider says served it and the four token classes. It also exposes
  the Decision 173 clause 4 cold-start assertion for each role. The credential smoke test is repointed to the
  contracts and runs through the transport. Plan 2 of 2 for T4.32 c1's model leg, after
  PLAN-inference-tier-selection; closes T4.17 c5. Code only: no contract or Decision text changes.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-llm-client-litellm-transport.yaml
phase: T4.32
scope:
  - file: scripts/llm/litellm_transport.py
    action: Create
    purpose: >-
      The transport's call path; it re-exports CallRecord, Attempt, TransportError and read_secret from
      scripts/llm/litellm_wire.py, and ColdStartResult and cold_start_check from scripts/llm/litellm_cold_start.py, so
      callers import one module. Public surface: frozen dataclasses CallRecord (persona, role, provider, requested_model, model,
      billing_shape, thinking, reasoning_effort, tokens_input, tokens_output, tokens_cache_read, tokens_cache_creation,
      reasoning_tokens, attempt, latency_ms; names follow docs/contracts/telemetry_observations.yaml's model_call
      columns where one exists (model, requested_model, reasoning_effort, billing_shape, the four tokens_* classes,
      reasoning_tokens); persona, role, thinking, attempt and latency_ms have no model_call column, provider holds the
      contract's provider string rather than that column's vocabulary, and the 1h/5m cache-creation split is not
      captured, all left to rec-4028's producer mapping), Attempt (role, model, attempt, outcome, latency_ms),
      TransportResult (content, tool_calls, message, finish_reason, record, attempts, failed_over) and
      ColdStartResult (role, assertion, outcome, record, detail); TransportError(RuntimeError) with .kind, .role and
      .attempts; complete(persona, messages, *, max_tokens, tools=None, tool_choice=None, response_format=None,
      timeout=600.0, role="primary", fail_over=False, credential_holder="on_the_loop", max_attempts=3, root=None) ->
      TransportResult;
      acomplete(...) with the same signature, async; cold_start_check(role, *, credential_holder="on_the_loop",
      root=None) -> ColdStartResult; read_secret(variable) -> str. Behaviour: (1) Selection. Each call loads both
      contracts through tier_selection.load(root) and resolves (persona, role, credential_holder), so a model or
      provider swap is a contract edit alone (T4.17 c5); TierSelectionError propagates unchanged. (2) Key. read_secret (defined in
      litellm_wire.py so the cold-start module shares it) reads os.environ[selection.env_name] and nothing else; unset or empty raises TransportError kind
      missing_credential before any request; the key is passed as api_key and never logged, recorded or put in an
      error message. Its docstring names it the secrets port's process-environment step, with the env-file step and
      adapter selection deferred to T4.24 c2 (Decision 224 clause 2). (3) Request: the keyword arguments come from
      litellm_wire.request_kwargs (its row), and every call goes through litellm.completion or litellm.acompletion
      with them; the refusals that function raises happen before any request. (4) Outcome classes come from
      litellm_wire.classify (its row): credit_exhausted = status 402, or a 400 whose message
      contains "credit balance is too low" (never retried, never failed over: the role's balance or allowance is spent
      and its runs pause); outage = litellm Timeout, APIConnectionError, RateLimitError, InternalServerError,
      ServiceUnavailableError or BadGatewayError, or status 408, 429 or any 5xx (LiteLLM reports a refused connection
      as InternalServerError 500); provider_error = anything else (auth, not found, bad request, context window) --
      never retried, never failed over. A response whose choices list is empty is malformed_output, and one whose
      content is blank with no tool calls is empty_output; neither is retried or failed over. The transport checks
      both before calling read_response, which assumes at least one choice and never raises. LiteLLM 1.106.2 itself
      raises APIError 500 for a body with no choices key at all and APIConnectionError 500 for an Anthropic body with
      no model, so those
      reach the transport as outages and are retried; this is accepted and documented in the module docstring.
      (5) Retries. An outage is retried up to
      max_attempts calls per role in total, sleeping 1 s then 2 s (doubling) between them through a module-level
      _sleep (time.sleep) in complete and a module-level _asleep (asyncio.sleep) in acomplete, both of which tests replace. (6) Role and fail-over. role selects
      the tier role the call resolves (default primary). A call on warm_fetched_escape_hatch, whether asked for
      directly or reached by fail-over, first passes litellm_cold_start's gate for that role (ensure_asserted in
      complete, aensure_asserted in acomplete; its row), so acomplete never blocks the event loop on a sync probe. Fail-over is
      off by default and applies only to role primary. With fail_over=True and credential_holder on_the_loop, an
      outage that exhausts the primary's attempts fails over only when messages hold no assistant turn yet (the
      run's first call), because each provider's reasoning state cannot be replayed to the other; on a later turn it
      raises TransportError kind fail_over_mid_run, chained to the outage, and the caller restarts the run on
      role=warm_fetched_escape_hatch from its first turn. A first-turn fail-over passes that gate and, only if it is
      asserted, calls that role with its own selection and attempts; the
      record's role then names it, and the module docstring tells the caller to pass that role for the rest of the
      run, so one transcript never mixes the two providers. Otherwise TransportError kind fallback_unavailable names the cold-start
      outcome, chained to the primary's error. No other failure class fails over. With credential_holder end_user,
      fail_over=True raises TransportError kind refused, tag end_user_primary_only, before any credential read or
      request (Decision 206 clause 3: one BYOK key fills the primary alone, with no fallback). Each of these
      decisions is made by a litellm_cold_start function (its row: refuse_end_user_fail_over, fallback_gate and
      afallback_gate, ensure_asserted and aensure_asserted), which raises the TransportError itself; the transport only
      calls them at the right point, so the raise lines are covered by their own module's mirror test. (7) Record:
      content, tool_calls, message and the CallRecord come from litellm_wire.read_response (its row); attempts lists
      every model call made for the request, failed ones included, and never the cold-start probe, whose record stays
      on its ColdStartResult (fallback_unavailable carries that result).
      (8) Cold start: cold_start_check, its async twin and the asserted cache live in litellm_cold_start.py (its row).
      (9) litellm is imported lazily inside the call path, after os.environ.setdefault("LITELLM_LOCAL_MODEL_COST_MAP",
      "True"), so importing this module is cheap, raises nothing and makes no network fetch. No AWS or SSM call and no
      AWS identity (Decision 212 clause 3). Size: the split from litellm_wire.py is the decomposition (Decision 128);
      each module stays under 500 SLOC, and a module that would pass 500 is a plan-defect STOP reported to this plan's
      planning thread (a new file is a scope change the build may not make), never a budget raise or a build-time split.
  - file: scripts/llm/litellm_cold_start.py
    action: Create
    purpose: >-
      The Decision 173 clause 4 cold-start assertion for each role, re-exported by the transport.
      cold_start_check(role, *, credential_holder="on_the_loop", root=None) -> ColdStartResult (role, assertion,
      outcome, record, detail). Resolves the role (the first persona in litellm_persona_selection, since the model
      is per role) and applies its tier row's cold_start_assertion: credential_liveness and remaining_allowance both
      make one minimal call (one user message "Reply with one word: OK", max_tokens 512 (room for thinking), at the
      resolved persona's own thinking and effort so the probe sends the shape runs send, one attempt) and read it the way litellm_tier_models.tier_2.notes states, on the raw LiteLLM response rather than
      through complete's output classes: any response carrying choices is asserted, whatever its finish reason and even
      with blank content (a probe that ends at max_tokens while thinking still proves the credential or credit); a
      response with no choices is not_asserted; credit_exhausted is spent (the role is unavailable and the runs that need it pause); every other
      failure, a missing credential or a refused TransportError from request_kwargs included (no request is made
      then), is not_asserted and never passes;
      not_applicable returns outcome not_applicable with no request (a defensive branch: plan 1's resolver refuses a
      Deferred role and allows not_applicable only there, so no resolved role reaches it today). It never raises for a provider failure;
      TierSelectionError still propagates (so end_user asking for the fallback role is refused by the resolver).
      The probe builds its request through litellm_wire.request_kwargs and reads the key through
      litellm_wire.read_secret. ensure_asserted(role, *, credential_holder, root) -> ColdStartResult runs
      cold_start_check unless an asserted result is cached; aensure_asserted is its async twin and probes through a
      private _acold_start_probe that calls litellm.acompletion, never the sync path; the two probes share one key-read
      and request-building helper and one response-interpretation helper, so only the call differs. Only an asserted outcome is
      cached, per process per (contracts root, model); spent, not_asserted and a transient failure are re-probed at the
      next gate. A threading.Lock (ensure_asserted) and an asyncio.Lock created lazily per running event loop
      (aensure_asserted) hold the probe, so concurrent gates in one mode run it once; a sync and an async gate in one
      process may each probe once, which is accepted (one extra minimal call). A module-level clear_cache() lets tests
      reset it. ensure_asserted and aensure_asserted return the asserted ColdStartResult or raise TransportError kind
      fallback_unavailable carrying it (used directly for a call on warm_fetched_escape_hatch). The fail-over policy
      the transport's row (6) describes lives here too: refuse_end_user_fail_over(fail_over, credential_holder) raises
      refused, tag end_user_primary_only, for end_user with fail_over=True and does nothing otherwise;
      fallback_gate(messages, primary_error, *, credential_holder, root) raises fail_over_mid_run chained to
      primary_error when messages hold an assistant turn, else returns ensure_asserted(warm_fetched_escape_hatch, ...)
      with any fallback_unavailable chained to primary_error; afallback_gate is its async twin over aensure_asserted.
      litellm is imported lazily, as in the transport; no AWS or SSM call. Under 500 SLOC (plan-defect STOP
      otherwise).
  - file: scripts/llm/litellm_wire.py
    action: Create
    purpose: >-
      The per-provider wire table, as pure functions with no network or file I/O, no litellm import at module import
      and no selection literal: read_secret(variable) -> str (the transport's row (2); the one environment read); the frozen dataclasses CallRecord and Attempt and TransportError (defined here, re-exported by the
      transport). request_kwargs(selection, messages, *, api_key, max_tokens, tools, tool_choice, response_format,
      timeout) -> dict: model=selection.model, api_key, messages, max_tokens, timeout, num_retries=0 (the transport
      owns retries), tools, tool_choice and response_format passed through unconditionally (None included), and
      never fallbacks= (the transport owns fail-over, first turn only) nor _skip_mcp_handler (litellm 1.106.2 imports
      its MCP handler on any tools call; that works under the lock's mcp 2.x, PLAN-mcp-2x-server-migration #1984, and
      TestToolsCallUnderPins guards it). Thinking and effort, by
      the model's LiteLLM prefix: deepseek -> thinking={"type": "enabled"|"disabled"} and, when enabled,
      extra_body={"reasoning_effort": effort} (LiteLLM 1.106.2 drops a bare reasoning_effort for DeepSeek);
      anthropic -> reasoning_effort=effort, which LiteLLM sends as adaptive thinking with output_config.effort;
      thinking disabled raises TransportError kind refused, tag anthropic_thinking_always_on, and a tool_choice other
      than None, "auto" or "none" raises refused, tag anthropic_thinking_forced_tool_choice (Anthropic's documented
      extended-thinking limit; LiteLLM 1.106.2 itself raises UnsupportedParamsError for "required" or a named tool on
      claude-opus-5-5 before any request, probed 2026-11-11, and this refusal keeps a stable tag across LiteLLM
      versions), both before any request; any other prefix -> LiteLLM's
      cross-provider reasoning_effort when thinking is enabled, and nothing when disabled. The docstring states two
      assumptions: the anthropic row assumes every model under that prefix always thinks (true of the current
      fallback; a later Anthropic model that accepts disabled thinking needs this row edited, and no persona sets
      disabled today), and the wire shape for an Anthropic model comes from LiteLLM's own per-model knowledge (probed
      2026-11-11: the current fallback model gets adaptive thinking, an older Sonnet a budgeted one, an unknown id
      raises UnsupportedParamsError; the docstring names no model id, per the constraints), so a model bump may also need a LiteLLM bump (rec-5069). classify(exc) -> outcome, from
      the status_code (the exception class varies with the body): credit_exhausted = status 402, or a 400 whose
      message contains "credit balance is too low"; outage = litellm Timeout, APIConnectionError, RateLimitError,
      InternalServerError, ServiceUnavailableError or BadGatewayError, or status 408, 429 or any 5xx (LiteLLM reports a
      refused connection as InternalServerError 500); provider_error = anything else, UnsupportedParamsError
      included. read_response(response, *, selection, persona, role, attempt, latency_ms) -> (content, tool_calls,
      message, CallRecord): content is choices[0].message.content or ""; tool_calls are the response's tool calls as
      plain dicts (id, type, function name and arguments); message is the assistant message as a plain dict LiteLLM
      accepts back as the next turn's assistant entry (choices[0].message.model_dump() with None values dropped), so
      DeepSeek's reasoning_content and Anthropic's thinking_blocks with their signatures and provider_specific_fields
      survive a tool loop with thinking on (verified 2026-11-11 under 1.106.2: both are replayed in turn 2's request);
      model is response.model as the provider reports it (None if absent, which only the deepseek path can return);
      tokens_cache_read is getattr(usage.prompt_tokens_details, "cached_tokens", None) or 0 and tokens_cache_creation
      getattr(usage.prompt_tokens_details, "cache_creation_tokens", None) or 0 (LiteLLM 1.106.2 gives a None details
      block for a DeepSeek body without prompt_cache_hit_tokens, and DeepSeek's block has no cache_creation_tokens), tokens_input is usage.prompt_tokens minus both (LiteLLM 1.106.2 reports prompt_tokens
      inclusive of cached tokens for both current providers), tokens_output is usage.completion_tokens and
      reasoning_tokens is getattr(usage.completion_tokens_details, "reasoning_tokens", None) (the block can be None
      too) for the deepseek prefix and None for
      anthropic (LiteLLM derives Anthropic's figure from the returned summarized thinking text, not the billed count,
      and tokens are facts, Decision 217 clause 4). Under 500 SLOC (plan-defect STOP otherwise, as above).
  - file: tests/test_llm_litellm_transport.py
    action: Create
    purpose: >-
      The transport's tests (mirror of scripts/llm/litellm_transport.py, "llm": "test_llm_" home). Requests are
      captured through tests/fixtures/litellm_capture.py (its row), which replaces httpx.Client.send and
      httpx.AsyncClient.send (never litellm.completion), so LiteLLM's own request building and response parsing run;
      the root conftest's --disable-socket stays on, and an autouse fixture here calls the helper's reset (cold-start
      cache cleared, LITELLM_LOCAL_MODEL_COST_MAP set, _sleep and _asleep replaced with no-ops). Model ids, providers
      and key variables are read from the real contracts through tier_selection, never written as literals; outcome
      tables use pytest.mark.parametrize. Every module row's mirror test reaches 100% line coverage of that module on its own (validate_test_coverage runs
      each source's mirror alone; VP step 3 runs the checker), so each test below sits in the file of the module whose
      lines it covers. Tests: (a) tools-call compatibility under the current pins (class
      TestToolsCallUnderPins): a tools call returns its tool call through complete, through acomplete, and through
      fail-over in both complete and acomplete (primary answers 503 for every attempt, fallback answers with a tool
      call; failed_over is true and record.role names the fallback); the class's docstring quotes
      "requirements-dev.txt", "requirements.txt" and "requirements-fast.txt" (the mcp pin lives in requirements.txt
      and its floor in requirements-fast.txt) and says the class guards LiteLLM's tools path, which needs mcp>=2 in
      the lock, and one test asserts derive_affected_tests([("M", f)]) selects this
      file for each of the three (Decision 135 data edge); and a second turn built from result.message plus a tool
      result sends DeepSeek's reasoning_content and Anthropic's thinking block with its signature (canned first
      responses carrying both). (d) Outcomes through complete and acomplete: 402 and the credit-balance 400 are
      credit_exhausted with one attempt and no fail-over; 401, 404 and a plain 400 are provider_error with one
      attempt; 503, 529, 429, a ReadTimeout and a ConnectError are retried to max_attempts, with a recording _sleep
      called with 1 then 2 and a recording _asleep the same, the attempt count asserted from the Attempt records
      rather than captured requests (LiteLLM's async HTTP handler itself retries a ConnectError once); blank content
      is empty_output and a body whose choices list is empty is malformed_output, sync and async. (e1) Fail-over
      wiring: off by default (an outage raises outage after the primary's attempts, the fallback never called); a
      call whose messages hold an assistant turn surfaces fail_over_mid_run with the fallback never called;
      role=warm_fetched_escape_hatch through complete and through acomplete serves after an asserted cold start (the
      async one probing through httpx.AsyncClient.send) and raises fallback_unavailable after a spent one;
      TransportResult.attempts never includes the probe's call; end_user without fail_over is served by the primary
      alone (the positive half of T4.17 c5's BYOK clause), and end_user with fail_over raises end_user_primary_only
      before any request or environment read; a missing key and a refused anthropic shape (thinking disabled) surface
      through complete and acomplete with their own kinds, missing_credential and refused, one Attempt-free raise each
      and no captured request after the gate, never reclassified as provider_error (setup for the refused case: a
      contract copy disables thinking for a non-first fallback persona only, and the cold-start cache is pre-asserted
      with ensure_asserted before the capture is reset). (f) the key string (a sentinel set in the environment) appears in
      neither str() of a raised TransportError nor its __cause__ chain, nor repr() of CallRecord or TransportResult
      (Decision 224 clause 2); a TierSelectionError propagates from two mutated contract copies (root=tmp), one
      breaking 2(a) (a retired_providers prefix, with that row's provider string and key variable aligned to the
      prefix so no other resolver rule fires first) and one breaking 2(b) (same vendor in both roles), each asserting
      the rule tag. (h) A contract swap (class TestContractSwap, which VP step 6 selects by name): a tmp root whose
      tier_1 default_model and models name another model id routes the request to it with no code change. Tests (i)
      and (j) cover no transport lines; if this file nears 500 SLOC the build moves them to
      tests/test_llm_litellm_wire.py (in scope) before any STOP. (i)
      Importing any of the three modules makes no request and does not import litellm, checked in a subprocess
      (subprocess.run([sys.executable, "-c", "import scripts.llm.litellm_transport, scripts.llm.litellm_wire,
      scripts.llm.litellm_cold_start, sys; assert 'litellm' not in sys.modules"], cwd=ROOT, check=True); not -I,
      which drops the repository root from sys.path), since other tests import litellm in the same process. (j) None
      of scripts/llm/litellm_transport.py, scripts/llm/litellm_wire.py, scripts/llm/litellm_cold_start.py and
      scripts/smoke_test_inference_credentials.py contains any litellm_tier_models models entry or default_model, any
      api_key row variable or any api_key row current_home read from the contracts (Decision 173 clause 2, Decision
      224); the per-prefix request and error table is adapter knowledge and allowed. Under 500 SLOC; crossing it is a
      plan-defect STOP, as for the modules.
  - file: tests/test_llm_litellm_wire.py
    action: Create
    purpose: >-
      The wire table's tests (mirror of scripts/llm/litellm_wire.py), capturing requests and reading the contracts
      through tests/fixtures/litellm_capture.py as the transport tests do; its module docstring quotes
      "requirements-dev.txt", "requirements.txt" and "requirements-fast.txt", so a lock-only bump runs these
      body-shape tests too (VP step 4). Every module row's mirror test reaches 100% line coverage of that module on its own (validate_test_coverage runs
      each source's mirror alone; VP step 3 runs the checker), so each test below sits in the file of the module whose
      lines it covers. (b) Wire shapes, through complete with httpx send replaced so LiteLLM
      builds the body: the primary's body carries thinking {"type": "enabled"} and reasoning_effort at the top level
      with the selected effort and no output_config; the fallback's body carries thinking {"type": "adaptive", ...}
      and output_config.effort equal to the selected effort; both carry the requested model without its prefix, and
      the key reaches the request's auth header from the environment variable. request_kwargs directly: every result
      carries num_retries=0 and neither _skip_mcp_handler nor fallbacks, and passes tools, tool_choice and
      response_format through (a json_schema response_format given is in the result); a deepseek selection with thinking disabled
      sends thinking disabled and no extra_body; another prefix (a Selection built with dataclasses.replace) gets
      reasoning_effort when thinking is enabled and neither field when disabled; an anthropic selection with thinking
      disabled is refused anthropic_thinking_always_on, and tool_choice {"type": "function", ...} or "required" on
      it is refused anthropic_thinking_forced_tool_choice, while "auto", "none" and None pass. For read_secret, an unset
      and an empty variable each raise missing_credential naming the variable and not any value; a set one is
