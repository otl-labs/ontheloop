  - file: tests/fixtures/litellm_capture.py
    action: Create
    purpose: >-
      Shared test helpers for the three LiteLLM test files (tests/fixtures/ is the importable helper package; test
      modules never import each other, tests/CLAUDE.md). Plain functions and context managers, no test functions and no
