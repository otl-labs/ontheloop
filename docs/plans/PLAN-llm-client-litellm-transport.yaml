      with one mutation; reset(monkeypatch) clearing litellm_cold_start's cache, setting
      LITELLM_LOCAL_MODEL_COST_MAP and replacing litellm_transport._sleep and _asleep with no-ops (only (d) installs
      recording ones). Under 500 SLOC (plan-defect STOP otherwise).
  - file: scripts/smoke_test_inference_credentials.py
    action: Modify
    purpose: >-
      The credentialed smoke test, repointed to the contracts (rec-3222's reader half) and run through the transport.
      CLI: --role {primary, warm_fetched_escape_hatch} (required) and --region (default None). run(role, region=None):
      loads the contracts with tier_selection.load(); takes the role's parameter name from the project-configuration
      settings row ports.run_persona.litellm.api_key.<role> (this_repository.current_home) and its variable from that
      row; fetches the value with ssm get_parameter(WithDecryption=True) under resolve_aws_profile() in region or
      _default_region() (config/aws-region's one line, read when called; the module constant DEFAULT_REGION_PATH names
      that file, rec-2289); puts the value in the process environment under the row's variable for this process only;
      and calls litellm_transport.cold_start_check(role). It prints the parameter name, then PASS [<role>]
      requested=<requested_model> served=<model> assertion=<outcome> on asserted and returns 0, and FAIL [<role>]
      with the outcome and detail on anything else, returning 1; the existing SSM diagnostics (AccessDenied,
