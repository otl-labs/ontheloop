  - file: tests/test_llm_litellm_cold_start.py
    action: Create
    purpose: >-
      The cold-start and fail-over-policy tests (mirror of scripts/llm/litellm_cold_start.py), capturing requests and
      reading the contracts through tests/fixtures/litellm_capture.py; its module docstring quotes the same three
      requirements file names (VP step 4). Every module row's mirror test reaches 100% line coverage of that module on its own (validate_test_coverage runs
