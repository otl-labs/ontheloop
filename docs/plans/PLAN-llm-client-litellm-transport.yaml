acceptance_criteria:
  - A tools call through complete, acomplete and fail-over returns its tool call under the pinned litellm 1.106.2 and mcp 2.3.0 with no _skip_mcp_handler, a second turn built from TransportResult.message replays each provider's reasoning state (DeepSeek reasoning_content, Anthropic signed thinking block), and a diff touching only requirements-dev.txt, requirements.txt or requirements-fast.txt selects every LiteLLM test file; each new module is fully covered by its own mirror test.
  - The primary's request carries DeepSeek's thinking field and top-level reasoning_effort, and the fallback's carries adaptive thinking with output_config.effort, each at the persona's selected effort, with model and key taken from the contracts and the environment; a forced tool_choice or disabled thinking on the anthropic fallback is refused before any request.
  - Every call returns a record naming the requested model, the served model as the provider reports it and the four token classes; failed attempts are listed.
  - Outages retry to the bound; credit exhaustion, auth, not-found, bad-request, blank and malformed responses never retry or fail over; fail-over is off by default and, when on, happens only on a run's first call and needs an asserted fallback cold start (a later turn raises fail_over_mid_run); end_user is served by the primary alone and cannot fail over.
  - cold_start_check reads each role's assertion as inference-provider.yaml states it (asserted, spent, not_asserted; not_applicable is a defensive branch plan 1's resolver never reaches today).
  - The smoke test holds no model id, provider or parameter literal and runs through the transport; rec-2288, rec-2289, rec-2291 and rec-3222's acceptance commands pass.
  - Swapping a role's model in a contract copy changes the requested model with no code edit (T4.17 c5); scripts/llm/client.py is unchanged.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: plan 1 is built and this plan is on main; branch current."
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-llm-client-litellm-transport.yaml
      && git cat-file -e origin/main:scripts/llm/tier_selection.py && git merge-base --is-ancestor origin/main HEAD
      && bin/venv-python -m scripts.llm.tier_selection --check >/dev/null && grep -qE '^mcp==2\.' requirements.txt
      && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      No tier_selection.py on main means PLAN-inference-tier-selection's build has not merged: stop and wait. A failed
      ancestry test means a stale branch: merge origin/main first. A failed mcp grep means the lock no longer pins mcp
      2.x: stop and send a plan-defect report (context, mcp line).
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: Tools calls work under the current pins, sync, async and through fail-over, and a lock-only diff selects the proof.
    command: bin/venv-python -m pytest -q "tests/test_llm_litellm_transport.py::TestToolsCallUnderPins"
    expected: >-
      Exit 0. Red before: the module does not exist. The class guards LiteLLM's tools path against the lock: under an
      mcp 1.x lock every test in it that sends tools (sync, async, both fail-over cases and the turn-2 replay) fails on
      LiteLLM's MCP import (measured 2026-11-11, ImportError CacheableResult), while the lock-selection test is
      unaffected.
    fix_if: >-
      Fix the transport; never mark the class skipped and never add _skip_mcp_handler. A failure on LiteLLM's MCP
      import means the lock regressed below mcp 2: stop and report it (no pin changes in this plan).
    hermetic: true
    graduation: graduate
    graduation_check_id: litellm-transport-tools-call-under-pins
  - step: 3
    phase: pre-deploy
    action: The transport's, wire table's, cold start's, smoke test's, resolver's and cutover tests.
    command: >-
      bin/venv-python -m pytest -q tests/test_llm_litellm_transport.py tests/test_smoke_test_inference_credentials.py
      tests/test_secrets_to_ssm_cutover.py tests/test_llm_tier_selection.py tests/test_llm_litellm_wire.py
      tests/test_llm_litellm_cold_start.py && bin/venv-python -m scripts.test_coverage_checker --check-tests
      --check-coverage --files scripts/llm/litellm_transport.py scripts/llm/litellm_wire.py
      scripts/llm/litellm_cold_start.py scripts/smoke_test_inference_credentials.py
    expected: "Exit 0, and the checker reports each of the four source files at 100% from its own mirror test. Red before: the three new LiteLLM test files are absent and the rewritten smoke tests fail on the old CLI."
    fix_if: >-
      Fix the code under test; never weaken an assertion or skip a test. A coverage gap means a test sits in the wrong
      file or is missing: add it to the uncovered module's mirror; never add a coverage_baseline entry.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The created and rewritten tests are the standing guard: the --pre affected set selects them when the transport,
      the smoke test, either contract or the lock changes, and the full tier runs them on main.
  - step: 4
    phase: pre-deploy
    action: A lock-only diff selects all three LiteLLM test files (Decision 135 data edge), shown directly.
    command: >-
      bin/venv-python -c "from scripts.checks.deps.affected_tests import derive_affected_tests as d;
      ok=all(t in d([('M',f)])['selected'] for f in ('requirements-dev.txt', 'requirements.txt',
      'requirements-fast.txt') for t in ('tests/test_llm_litellm_transport.py', 'tests/test_llm_litellm_wire.py',
      'tests/test_llm_litellm_cold_start.py'));
      print('LOCK_SELECTS_TRANSPORT' if ok else 'MISSING'); raise SystemExit(0 if ok else 1)"
    expected: Prints LOCK_SELECTS_TRANSPORT.
    expected_literals:
      - "LOCK_SELECTS_TRANSPORT"
    fix_if: The test file does not quote each of the three file names as a whole string; fix the docstring, never the selector.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: VP step 2's graduated class contains the same self-selection assertion, so a second record would duplicate it.
  - step: 5
    phase: pre-deploy
    action: The bundled recs' acceptance commands pass.
    command: >-
      grep -q "from __future__ import annotations" scripts/smoke_test_inference_credentials.py && ! grep -q
      "TYPE_CHECKING" scripts/smoke_test_inference_credentials.py && grep -q 'DEFAULT_REGION'
      scripts/smoke_test_inference_credentials.py && ! grep -q 'default="eu-west-2"'
      scripts/smoke_test_inference_credentials.py && ! grep -q 'region: str = "eu-west-2"'
      scripts/smoke_test_inference_credentials.py && grep -q 'except Exception as exc:'
      scripts/smoke_test_inference_credentials.py && grep -q 'intentionally broad'
      scripts/smoke_test_inference_credentials.py && ! grep -q 'agent-platform-deepseek-api-key'
      scripts/smoke_test_inference_credentials.py && ! grep -q 'agent-platform-anthropic-api-key'
      scripts/smoke_test_inference_credentials.py && grep -q 'current_home: /secret/agent-platform-deepseek-api-key'
      docs/contracts/project-configuration.yaml && ! grep -qE -- '--provider|--model|--parameter-name'
      scripts/smoke_test_inference_credentials.py && echo RECS_OK
    expected: Prints RECS_OK.
    fix_if: Fix the smoke test; rec acceptance text is not edited at build time.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Closure evidence for four Low/Medium tidy-up recs; the rewritten smoke tests and the transport test (j) guard
      the lasting part (no model or parameter literal), and ci.yml's closure job re-runs each acceptance on merge.
  - step: 6
    phase: pre-deploy
    action: The model swap is a contract edit alone, and client.py is untouched.
    command: >-
      git diff --quiet origin/main -- scripts/llm/client.py scripts/llm/__init__.py && bin/venv-python -m pytest -q
      "tests/test_llm_litellm_transport.py::TestContractSwap" && echo SWAP_OK
    expected: Prints SWAP_OK.
    fix_if: A client.py diff is out of scope (it is Lambda-packaged); revert it. A swap failure means the transport caches or hard-codes a model.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The swap test is in the transport test file the affected set selects; the client.py half is a one-time scope
      proof for this build.
  - step: 7
    phase: pre-deploy
    action: Fast tier on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the named failure on the branch; never skip, disable or quarantine a test.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Full tier before handoff (handoff_policy), started in the background from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports a completed full run for HEAD with exit 0.
    fix_if: A red full tier blocks handoff; fix and rerun from the start. A timeout is blocked, never a warning.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Credentialed smoke run from a cloud session under the agent_platform profile, after the build merges: each role's
      cold start against the real provider. Reported as expected until it has run.
    command: >-
      bin/venv-python -m scripts.smoke_test_inference_credentials --role primary && bin/venv-python -m
      scripts.smoke_test_inference_credentials --role warm_fetched_escape_hatch
    expected: >-
      Both print PASS with assertion=asserted, and each names its requested and served model; the primary's served
      string shows whether DeepSeek reports the alias or a dated build.
    fix_if: >-
      AccessDenied: the profile's grant is missing (terraform/bootstrap, admin-only; report, never apply). spent on
      the fallback: the monthly credit is used up, which pauses fallback runs and is not a code defect. not_asserted:
      report the detail; never retry in a loop.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Credentialed and billable (Decision 212 clause 2(b), Decision 244): never a merge gate or a standing record. The
      hermetic steps above graduate the code path.
  - step: 10
    phase: post-deploy
    action: The four bundled recs read back closed after the build's squash-merge (ci.yml's closure job, Resolves trailer).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,_=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-3222','rec-2288','rec-2289','rec-2291']);
      s=sorted((x['id'],x['status']) for x in r); print(s); raise SystemExit(0 if len(s)==4 and all(t=='closed' for _,t in s) else 1)"
    expected: Exit 0, printing the four ids each with status closed.
    fix_if: >-
      A rec still open means the closure job did not run or its acceptance failed on main: read the job log, fix
      forward on a branch; never close a rec by hand without its acceptance passing.
    hermetic: false
    graduation: not-applicable
