constraints:
  - Do not edit scripts/llm/client.py or scripts/llm/__init__.py (Lambda-packaged, data-pipeline); the transport is its own module.
  - No selection literal -- model id, default_model, key variable or parameter name -- in scripts/llm/litellm_transport.py, scripts/llm/litellm_wire.py, scripts/llm/litellm_cold_start.py or scripts/smoke_test_inference_credentials.py (Decision 173 clause 2, Decision 224); tests read them from the contracts. The transport's table keyed by LiteLLM prefix (deepseek, anthropic) for request fields and error classification, including the "credit balance is too low" match, is adapter knowledge and allowed; the smoke test holds no provider name either.
  - The transport, wire and cold-start modules make no AWS or SSM call and reads secrets from the process environment only (Decision 212 clause 3); only the smoke test reads SSM.
  - No pin changes to requirements.txt, requirements-dev.txt or their .in files; never pass LiteLLM's fallbacks= or _skip_mcp_handler.
  - No contract, Decision or capabilities.yaml edit; tier_selection.py is consumed, not changed (a needed change is a plan-defect report to this plan's planning thread).
  - No live model call or credential read before VP step 9; tests keep sockets disabled.
  - "No new file beyond the scope rows: a module or test file that would pass 500 SLOC is a plan-defect STOP, not a build-time split (the transport test row's move of tests (i) and (j) into the wire test file, both in scope, excepted)."
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
