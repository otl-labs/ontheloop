constraints:
  - >-
    Roadmap text only: the one sidecar block, appended verbatim. No tier_item, no other CD, no DECISIONS.md entry, no
    portal Decision write, no realization_evidence and no [Realized marker; each row ratifies only through its own
    component plan (candidate-decision-ratification.yaml lane_steps).
  - >-
    Approved text: every word of the rows is bound by docs/plans/approved/loop-candidate-decisions.yaml (Decision 246).
    The build never edits the sidecar or rewords a row; a wording change needs a new approval run on a plan amendment.
  - >-
    Numbering: the ids are the staged placeholders, kept because Decisions 221 and 235 and T3.4 c3 cite CD.46 and CD.47
    by id. Re-check at build that no candidate_decisions id from CD.46 to CD.51 exists on origin/main or on an open
    branch; if one does, stop and return a plan-defect report (ids are cited text the operator approved).
  - >-
    No ad hoc trim elsewhere in the roadmap (Decision 147); the file stays at or below 10,000 lines (Decision 114).
  - No rescue agents or workaround loops (Decision 55). No emojis; ASCII hyphens only.
