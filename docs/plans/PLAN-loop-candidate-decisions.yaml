schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: loop-candidate-decisions
intent: >-
  File the telemetry feedback loop's five staged decisions as pending candidate decisions CD.46, CD.47, CD.48, CD.50
  and CD.51 in docs/ROADMAP-PLATFORM.yaml, worded to the operator's final answers of 2026-11-17 after a blind
  best-practice consult, so the loop's later plans (waves 2-4, T3.3, T3.4) build against settled, binding rules and the
  operator's feedback-loop gate item "file the staged loop decisions" is met. Roadmap text only, bound word for word by
  an approved-text sidecar the operator approves on GitHub: no code, contract, Decision entry, terraform, IAM, spend or
  deploy.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-loop-candidate-decisions.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn category: operator-directed governance CD filing, the CD.45 precedent; no
  tier_item claimed, no exit criterion closed). The five rows name T3.4, T3.3, T3.20, T2.36, T2.19, T2.26, T2.52 and
  T4.24 in affects (in-scope-of, never gating).
cites: [dec:79, dec:105, dec:114, dec:199, dec:201, dec:209, dec:217, dec:221, dec:235, dec:246]
closes_criteria: []
scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Operator-approved text: block e01 of docs/plans/approved/loop-candidate-decisions.yaml (STEP 1), five pending
      candidate_decisions rows CD.46, CD.47, CD.48, CD.50 and CD.51 appended after CD.45's last line and before the
      blank line preceding tier_items:, +188 lines (8,903 -> 9,091 of the 10,000-line cap). No tier_item, no other CD
      and no other byte changes. Ids CD.49 and CD.52 stay unused: CD.49 was retired into CD.50 on 2026-10-04 and CD.52's
      substance landed as Decision 199's 2026-10-16 Update note, its T2.52 half now settled inside CD.47.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition: compute_affected_artifacts(<this
    plan's scope>) returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']} because the roadmap is a packaged asset of
    the active data-pipeline artifact. This plan runs no build, deploy or smoke test: the edit is candidate_decisions text with
    no packaged code, and its one runtime reader, src/data/handlers/scheduled_agent_handler.py, runs only from the
    scheduled-agent dispatcher, provisioned DISABLED with SCHEDULED_AGENTS_ENABLED "false" (terraform/personal/
    prod_lambdas.tf:27, :190), so a stale packaged copy reaches no running agent. deploy-prod-lambdas.yml does not
    path-trigger on the roadmap (PROD_SOURCE_PATHSPECS, scripts/convergence_health/code_drift.py:284-295, omits it;
    Decision 249 cl.2), so the asset refreshes at the next deploy a watched path starts; nothing is deployed by hand.
    Precedent: PLAN-work-item-pilot-candidate-decision, PLAN-verdict-persona-roadmap-regrounding.
acceptance_criteria:
  - >-
    docs/ROADMAP-PLATFORM.yaml carries CD.46, CD.47, CD.48, CD.50 and CD.51, in that order, as the last five
    candidate_decisions, each in R2's pending shape (state pending, filed_via pending_log_decision_lambda, no
    ratified_as, no realization_evidence, no '[Realized' marker) with gates [] and the affects lists the sidecar names
    (VP 3).
  - >-
    Each row carries the operator's 2026-11-17 terms: CD.46 the reachable-rung cap, the reviewed-only error measure and
    the restart key; CD.47 frozen verdict evidence, gating-only stored series amending Decision 199 cl.1 at
    ratification, declared non-verb producers, ingest time and T2.52 left deferred; CD.48 close at merge, the recurrence
    watch and the shadow-only proof that never closes a rec; CD.50 not-a-target, cost per useful outcome with an output
    floor, the payback rule, reported cost winning and the one API-lane stop; CD.51 published external tables, keyed
    ids, a minimum group size and push (VP 2-3).
  - >-
    No eligibility, blocking, ratification-lane or gate projection changes: PlatformRoadmapState.to_preflight_dict is
    identical for origin/main's roadmap and the branch roadmap (VP 4).
  - >-
    validate_platform_roadmap (schema and the 10,000-line ceiling), validate_candidate_decision_ratification,
    validate_candidate_decision_supersession and validate_roadmap_liveness pass; check_roadmap_regrowth fails nothing
    (VP 5), and the full presubmit tier exits 0 (VP 6).
  - >-
    The roadmap edit is exactly the approved sidecar's one block at its wording digest, on a branch that contains
    origin/main with the plan and sidecar merged (VP 1-2).
  - >-
    rec-4606, which carries the operator's feedback-loop gate list, gains a dated note that the "file the staged loop
    decisions" item is met, naming the merge sha (VP 7).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: plan and sidecar merged, branch current."
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-loop-candidate-decisions.yaml && git
      cat-file -e origin/main:docs/plans/approved/loop-candidate-decisions.yaml && git merge-base --is-ancestor
      origin/main HEAD && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      A missing plan or sidecar means the plan PR has not merged: stop. A failed ancestry test means a stale branch:
      merge origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The roadmap edit is exactly the approved sidecar, at its wording digest.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug loop-candidate-decisions --base origin/main
      --expect 1cdac92c48878347191723d5612a26e635910501f511592336217b14889271a6
    expected: Exit 0, printing APPROVED-TEXT OK. Red before STEP 1, because the head words still equal the base words.
    fix_if: >-
      A word mismatch means the edit drifted from the approved text: restore the block's after text exactly, never edit
      the sidecar. A digest mismatch means the sidecar on origin/main is not the approved one: stop and ask the operator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A base-relative, one-time binding of this build's diff to its sidecar; validate_merge_step enforces the same
      binding on the build PR's fast tier.
  - step: 3
    phase: pre-deploy
    action: Parse the roadmap and assert the five rows' order, pending shape, edges and load-bearing terms.
    command: >-
      bin/venv-python -c "import yaml;d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8'));cds=d['candidate_decisions'];ids=[c['id']
      for c in cds][-5:];assert ids==['CD.46','CD.47','CD.48','CD.50','CD.51'],ids;C={c['id']:c for c in cds};A={'CD.46':['T3.4','T3.3','T3.20','T2.36'],'CD.47':['T2.36','T3.3','T3.4'],'CD.48':['T3.4','T3.3'],'CD.50':['T2.36','T2.19','T2.26','T2.52'],'CD.51':['T4.24','T2.36']};bad=[k
      for k,a in A.items() if not (C[k]['state']=='pending' and C[k].get('filed_via')=='pending_log_decision_lambda' and
      'ratified_as' not in C[k] and not C[k].get('realization_evidence') and C[k]['gates']==[] and C[k]['affects']==a and
      '[Realized' not in C[k]['detail'])];assert not bad,('shape',bad);T={k:' '.join(C[k]['detail'].split()) for k in
      A};K={'CD.46':['REACHABLE RUNG','can reach sampled and no higher','ERROR MEASURE (answers W3-6)','count operator-reviewed outputs only','RESTART','one lane per model','REVIEWER CHECK'],'CD.47':['EVIDENCE','FROZEN SERIES (amends Decision 199 cl.1 at ratification)','gates a ladder transition or decides a proof','declared non-verb producers','T2.52 c1 stays deferred','INGEST TIME'],'CD.48':['keeps closing at merge','RECURRENCE WATCH','SHADOW PROOF','closes, reopens and proposes nothing','never closes a rec by itself','answers backval-q2','answers backval-q1'],'CD.50':['NOT A TARGET','output floor','WINS','the reported figure wins','ONE STOP','answers budget-q2'],'CD.51':['PUBLISHED LAYER','declared schema is its allow-list','keyed hash','GROUP SIZE','TRANSPORT (answers k3)','pushes']};miss=[(k,w)
      for k,ws in K.items() for w in ws if w not in T[k]];assert not miss,miss;print('five rows OK')"
    expected: Exit 0 printing five rows OK.
    fix_if: >-
      An assertion on ids means a row is missing or misplaced (red before STEP 1). A shape or missing-term assertion
      means the appended block drifted from the sidecar's after text: re-copy it, never edit the assertion. If a
      concurrent PR took one of these ids, stop and ask the operator (constraints, numbering).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The asserted fields are the rows' pre-ratification shape, which each row's own ratification legitimately flips and
      re-drafts (candidate-decision-ratification.yaml), so a standing registry row would fight the one edit it exists to
      allow. The durable shape invariants already run standing in both tiers (validate_candidate_decision_ratification R2,
      validate_platform_roadmap).
    expected_literals: []
  - step: 4
    phase: pre-deploy
    action: "Eligibility-invariance differential (Decision 147 point 3's method): to_preflight_dict for origin/main's roadmap and the branch roadmap."
    command: >-
      bin/venv-python -c "import subprocess,tempfile,json;from pathlib import Path;from scripts.platform_roadmap_state import
      load,PlatformRoadmapState as S;g=lambda r:subprocess.run(['git','show','origin/main:docs/'+r],capture_output=True,text=True,encoding='utf-8',check=True).stdout;b=g('ROADMAP-PLATFORM.yaml');D=Path(tempfile.mkdtemp());t=D/'ROADMAP-PLATFORM.yaml';t.write_text(b,encoding='utf-8');(D/'ROADMAP-PLATFORM-ARCHIVE.yaml').write_text(g('ROADMAP-PLATFORM-ARCHIVE.yaml'),encoding='utf-8');p=Path('docs/plans');f=lambda
      x:json.dumps(S(load(x)).to_preflight_dict(plans_dir=p),sort_keys=True,default=str);assert 'id: CD.46' not in
      b,'base already carries CD.46';assert f(t)==f(Path('docs/ROADMAP-PLATFORM.yaml')),'projection drift';print('projections identical')"
    expected: Exit 0 printing projections identical.
    fix_if: >-
      Projection drift means a row gates or surfaces something: check gates is [], realization_evidence is absent and no
      detail carries a [Realized marker. 'base already carries CD.46' means the base collapsed (post-merge) or a
      concurrent PR claimed the id.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      An invariance differential is green before and after by construction and is PR-relative against origin/main, so
      it has no red-before polarity to graduate and would be vacuous once the base collapses post-merge.
    expected_literals: []
  - step: 5
    phase: pre-deploy
    action: Run the five standing roadmap guards directly against the edited file.
    command: >-
      bin/venv-python -c "from scripts.checks.roadmap.validate_platform_roadmap import validate_platform_roadmap as
      a;from scripts.checks.roadmap.validate_candidate_decision_ratification import validate_candidate_decision_ratification
      as b;from scripts.checks.roadmap.validate_candidate_decision_supersession import validate_candidate_decision_supersession
      as c;from scripts.checks.roadmap.validate_roadmap_liveness import validate_roadmap_liveness as d;from
      scripts.checks.roadmap.check_roadmap_regrowth import check_roadmap_regrowth as e;f=[];[g(f) for g in
      (a,b,c,d,e)];assert not f,f;print('roadmap guards pass')"
    expected: Exit 0 printing roadmap guards pass; the regrowth line reads about lines=9091 headroom=909 escalate=false (report-only).
    fix_if: >-
      A schema FAIL means malformed YAML or an unknown CandidateDecision key; an R2 FAIL means ratified_as or a dec
      pointer in filed_via; a ceiling FAIL means the file passed 10,000 lines: escalate per Decision 147, never trim ad hoc.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates five checks already registered and standing in the --pre and full tiers; a registry row would re-run
      them for no added independence.
    expected_literals: []
  - step: 6
    phase: pre-deploy
    action: Full presubmit tier before handoff (backgrounded with a 2 h limit; verdict via validation_result --verify-head).
    command: bin/venv-python -m scripts.validate
    expected: Exit 0, confirmed by bin/venv-python -m scripts.checks.validation_result --verify-head.
    fix_if: >-
      Diagnose the named failing check on the branch (Decision 55); a failure unrelated to this one-block edit is
      recorded as a rec, not patched inline (implement-scope-boundary.yaml).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Invokes scripts.validate (recursion hazard, vp-red-before.yaml recursion_refusal); it is the handoff gate itself,
      not a regression guard.
  - step: 7
    phase: post-deploy
    action: After the build merges, read back the rec-4606 gate note.
    command: >-
      PYTHONPATH=. bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,make_reader;rows,_=fetch_recs_by_ids(make_reader(),['rec-4606']);c=rows[0]['context'];assert
      c.startswith('[') and 'LOOP DECISIONS FILED' in c.split(chr(10))[0] and all(x in c.split(chr(10))[0] for x in
      ['CD.46','CD.47','CD.48','CD.50','CD.51']) and __import__('re').search(r'\b[0-9a-f]{7,40}\b',c.split(chr(10))[0]),c[:200];print('rec-4606 note OK')"
    expected: Exit 0 printing rec-4606 note OK.
    fix_if: >-
      A missing note means the execution step's update_rec did not land: re-run it through the portal (never the writer
      directly) and read back again; an unreachable reader is a blocker to report, not to work around.
    hermetic: false
    graduation: not-applicable
