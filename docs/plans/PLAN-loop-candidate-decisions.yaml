execution_steps:
  - >-
    STEP 0: confirm no candidate_decisions id CD.46-CD.51 exists on origin/main or on any open remote branch (git fetch
    origin; for each head, git show origin/<head>:docs/ROADMAP-PLATFORM.yaml | grep -cE 'id: CD\.(4[6-9]|5[01])$').
  - >-
    STEP 1: docs/ROADMAP-PLATFORM.yaml: replace block e01's before text with its after text from
    docs/plans/approved/loop-candidate-decisions.yaml exactly (the five rows after CD.45's narrowly_supersedes line,
    two-space list indent as the siblings); no other change.
  - Execute the Verification Plan steps 2-6; loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
  - >-
    After the squash merge: add a note to rec-4606 through the portal (bin/venv-python -m scripts.ops_data_portal
    --update-rec rec-4606 --context ...), prepending one paragraph whose first line starts "[<merge date> LOOP
    DECISIONS FILED" and names the merge sha and the five ids, keeping the existing context below it; then run VP 7.
  - "Report: the ids used, the VP results, the GROWTH line from VP 5, the validation_result --verify-head record, the PR number, its CI run id and the merge sha."
rollback: >-
  Before merge: drop the commit. After merge: revert the squash commit; if any plan has already cited a row, retire it
  through the CD lifecycle instead (state superseded with a one-line reason) so the id stays reserved.
