schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: manifest-supersession-resolver
intent: >-
  Let a merged consolidation manifest's carried_forward or held Decision that a later consolidation supersedes resolve
  through its Superseded by chain to the live successor, so chain consolidations keep composing without rewriting
  merged manifests (rec-5717; it unblocks chain 6, rec-5449).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-manifest-supersession-resolver.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5717 (Medium), operator ruling 2026-11-27 on the chain 6 plan (resolver follows supersession, its own rec and
  plan, landing before rec-5449's build). Closes no roadmap criterion.
closes_criteria: []
cites: [dec:149, dec:247, dec:276, dec:278, dec:279]
amends: []
introduces: []
scope:
  - file: scripts/checks/decisions/consolidation.py
    action: Modify
    purpose: >-
      Add _live (follows Superseded by hop by hop, cycle guard, reciprocity, returns the live number and the path) and
      _via (renders the path for failure lines); held "Decision N" and carried_forward resolve through it; lift the
      carried_forward loop out of _manifest_problems into _carried_problems (cyclomatic headroom).
    new_imports: []
  - file: tests/checks/decisions/test_consolidation.py
    action: Modify
    purpose: >-
      Add test_carried_forward_and_held_resolve_through_supersession: a RESOLVED table of pass and fail mutations on
      the existing fixture spec (rec-5717's acceptance node).
  - file: docs/contracts/decision-compaction.yaml
    action: Modify
    purpose: >-
      consolidation.manifest.shape's held clause and consolidation.manifest.resolve state the resolution rule; one
      amendment_log row (contract_amendment under Decision 278's manifest bound).
bundled_recommendations: [rec-5717]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A held "Decision N" or carried_forward number that is superseded resolves hop by hop through each entry's
    Superseded by marker to the first entry not superseded; a hop resolves only to an entry with a header whose
    supersedes (index row, else envelope) lists the entry before it; a cycle, a missing header, a hop with no marker or
    an unreciprocated hop does not resolve.
  - >-
    A held number that is a victim of the manifest, or resolves to its consolidating entry, fails; a held token is
    read in the entry it resolves to; a carried_forward number fails when it is a victim, does not resolve, resolves to
    the consolidating entry, is not named by its own number in the consolidating entry, or is live with no amends edge
    (a resolved one needs no amends edge).
  - Failure lines name the resolution path, e.g. "held Decision 213 (-> 290)"; every existing DEFECTS row still passes.
  - >-
    With Decision 213 replaced by a stub pointing at a successor that states provision_telemetry_login, the real
    repository's manifests report no problem; with the token dropped from the successor, exactly the chain 81 and
    chain 126 units fail.
  - decision-compaction.yaml's shape and resolve keys state the rule; no merged manifest changes.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5717's acceptance node.
    command: bin/venv-python -m pytest "tests/checks/decisions/test_consolidation.py::test_carried_forward_and_held_resolve_through_supersession" -q
    expected: exit 0 with 1 passed; on the base the node is absent, and against the base checker its pass rows and the path-naming rows fail
    fix_if: a row fails; read its name and the problems it printed, and fix the resolver, never the row
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: The node runs in the suite on every change to the checker; a registry row would duplicate it.
  - step: 2
    phase: pre-deploy
    action: The checker's whole mirror test file and the decision checks it serves still pass.
    command: bin/venv-python -m pytest tests/checks/decisions tests/decisions_md -q -n 4
    expected: exit 0, no failures (977 passed at planning with the rehearsed change applied)
    fix_if: an existing DEFECTS row or another decisions test fails; a message substring changed or a guard regressed
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole-directory re-run of tests the scope modifies; the suite already runs them on every change.
  - step: 3
    phase: pre-deploy
    action: >-
      Real-repository rehearsal of chain 6's shape without its drafts: in memory, Decision 213 becomes a stub pointing
      at a new successor whose envelope supersedes [213] and which amends nothing; every merged manifest is then
      scanned with provision_telemetry_login kept in the successor and with it dropped.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.checks.decisions import consolidation as c; r=Path('.'); e=c._entries(r); rows=c.load_rows(r); n=max(e)+1; stub='## Decision 213: x\n\n**Status:** Superseded\n\n**Superseded by: Decision %d**\n' % n; succ=lambda body: '## Decision %d: s\n\n\x60\x60\x60yaml\nnumber: %d\nsupersedes: [213]\n\x60\x60\x60\n\n%s\n' % (n, n, body); rows=[dict(x, currency='superseded_compacted') if x.get('number')==213 else x for x in rows]+[{'number': n, 'live': True, 'currency': 'current', 'amends': [], 'supersedes': [213]}]; c.load_rows=lambda root: rows; scan=lambda body: (setattr(c, '_entries', lambda root: {**e, 213: stub, n: succ(body)}), c.manifest_problems(r, lambda root, rel: None))[1]; kept=scan('provision_telemetry_login'); dropped=scan('no token'); print('KEPT', kept); print('DROPPED', len(dropped)); assert kept==[] and len(dropped)==2 and all('token is absent from Decision 213 (-> %d)' % n in p for p in dropped), dropped; print('REHEARSAL_OK')"
    expected: >-
      prints KEPT with an empty list, then DROPPED 2, then REHEARSAL_OK; against the base checker the assertion fails
      listing four problems (chain 81 and 126 carried_forward and held units)
    fix_if: >-
      KEPT lists a problem (a rule is wrong for the real manifests; the successor amending nothing exercises the
      resolved carried_forward case) or DROPPED is not 2
    hermetic: true
    expected_literals: ["KEPT []", "DROPPED 2", "REHEARSAL_OK"]
    graduation: waive
    graduation_waiver_reason: Moment claim about today's chain 81 and 126 manifests; step 1's node is the standing guard.
  - step: 4
    phase: pre-deploy
    action: The contract states the rule, and no merged manifest changed.
    command: >-
      bin/venv-python -c "import yaml; m=yaml.safe_load(open('docs/contracts/decision-compaction.yaml'))['consolidation']['manifest'];
      assert 'neither superseded_compacted' not in m['shape'] and 'resolves, per resolve, to a live entry other than the consolidating entry' in m['shape'];
      assert all(s in m['resolve'] for s in ('resolves hop by hop', 'supersedes lists the entry before it', 'while itself live, has no amends edge', 'never rewritten')); print('CONTRACT_OK')"
      && git diff --quiet origin/main -- docs/decision-migration/consolidations/ && echo MANIFESTS_UNCHANGED
    expected: prints CONTRACT_OK then MANIFESTS_UNCHANGED
    fix_if: an assertion fails (the shape or resolve wording drifted from execution step 3) or a manifest differs from origin/main
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Wording presence and a diff against origin/main, which moves after merge; step 1 guards the behaviour.
  - step: 5
    phase: pre-deploy
    action: Size and complexity headroom, and the fast tier, on the complete tree.
    command: >-
      bin/venv-python -c "import ast; B=(ast.If, ast.For, ast.While, ast.Try, ast.ExceptHandler, ast.With, ast.BoolOp);
      t=ast.parse(open('scripts/checks/decisions/consolidation.py').read());
      cc={n.name: sum(isinstance(s, B) for s in ast.walk(n)) for n in ast.walk(t) if isinstance(n, ast.FunctionDef)};
      sl=[sum(1 for l in open(f) if l.strip() and not l.strip().startswith('#')) for f in ('scripts/checks/decisions/consolidation.py', 'tests/checks/decisions/test_consolidation.py')];
      print('MAXCC', max(cc.values()), 'SLOC', sl); assert max(cc.values()) <= 18 and max(sl) <= 480" && bin/venv-python -m scripts.validate --pre
    expected: >-
      prints MAXCC at most 18 and both SLOC under 480 (rehearsed 16, 437 and 435), then validate --pre exits 0 with
      validate_delegated_key_changes printing its PASS line for the consolidation units
    fix_if: >-
      a function above 18 branches or a file above 480 SLOC (decompose per Decision 128, never raise), or a --pre
      failure (fix on the branch)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_sloc_limits and validate_cc_limits are the standing guards; this step only pins headroom for the build.
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 7
    phase: post-deploy
    action: rec-5717 reads back closed after the build's squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5717']); print(rows[0]['status'])"
    expected: prints closed
    fix_if: prints open; close it through scripts.ops_data_portal --update-rec after confirming its acceptance node passes on main
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/decisions/consolidation.py
    behavior: held and carried_forward references resolve through supersession with the guards of acceptance_criteria 1-3
    verification_step: 1
    test_selector: tests/checks/decisions/test_consolidation.py::test_carried_forward_and_held_resolve_through_supersession
    red_green_expectation: red before (pass rows fail on the base checker), green after
  - source: tests/checks/decisions/test_consolidation.py
    behavior: the RESOLVED table holds each pass and fail case of the resolution rule
    verification_step: 1
    test_selector: tests/checks/decisions/test_consolidation.py::test_carried_forward_and_held_resolve_through_supersession
    red_green_expectation: absent before, green after
  - source: docs/contracts/decision-compaction.yaml
    behavior: consolidation.manifest shape and resolve state the resolution rule
    verification_step: 4
    command: >-
      bin/venv-python -c "import yaml; m=yaml.safe_load(open('docs/contracts/decision-compaction.yaml'))
    waiver_reason: Prose read by agents, not by the checker (which reads only consolidation.threshold); step 4 pins the wording and step 1 the behaviour.
constraints:
  - Merged manifests are never edited (operator ruling 2026-11-27); only the checker and the contract change.
  - No existing test row is loosened or removed (Decision 235); the held DEFECTS substrings stay, and the carried_forward rows match on "carried_forward Decision N".
  - Each file under 500 SLOC and each function under 20 branches (Decision 128, Decision 43); decompose, never raise.
  - No new dependency; consolidation.py imports nothing new (extract_entry_envelope is already imported).
  - No rescue agents or workaround loops (Decision 55).
context:
  - "rec-5717 (acceptance is VP 1's node). Operator ruling 2026-11-27 on the chain 6 plan: resolver follows supersession, own rec and plan, before rec-5449's build; then 'write the plan'."
  - "Advisor (blind, facts-only): /mnt/project-files/decision-growth/consolidation/manifest-resolver/advisor-brief/ADVICE.md. Adopted: fixpoint with cycle guard; reciprocity; consolidating-entry guard; no amends test on a resolved carried_forward; path in failure lines only."
  - "Rehearsed change (evidence/resolver-r2.diff and resolver-r2-tests.diff beside the advice): VP 1 green, VP 2 977 passed, VP 3 green; base checker red on VP 1 and VP 3. The chain 6 drafts applied with it give manifest problems []."
  - "Why no amends test on a resolved number: the operator chose amends [91] only for chain 6, and a successor that lets lapsed edges go must not fail merged manifests no rule lets anyone repair (live shapes 143, 210, 193, 225, 182 amend only compacted roots)."
  - "Prior art: scripts/checks/_marker_guard.py authorization_failure follows one Superseded by hop; this check needs the fixpoint because a successor may itself be consolidated later."
  - "Approval class: decision-compaction.yaml is notice class (approval-routing.yaml gated set excludes it), so no sidecar or approval run; the PR lists it as a notice-class file. The change stays inside Decision 278's manifest text bound (every target resolves at head)."
  - "Rejected (advisor residuals): identifier-shaped tokens and an inventory line listing inbound held tokens; both are separable and fail closed today in the superseding PR."
  - "Planned loosening (Decision 235 cl.1, human-confirmed plan): the resolve rule stops failing a superseded carried_forward or held number that resolves, and a resolved carried_forward number needs no amends edge. Operator ruling 2026-11-27 (resolver follows supersession); acceptance_criteria[0-1] are the planned-change disposition for any item validate_weakening_candidates lists. New guards tighten: reciprocity, cycle, header and consolidating-entry."
  - "red_overlap 2026-11-27: verdict clear, reds [] (slo_hours 4)."
  - "Decision-scout r1 FLAGS_FOUND (one NOTE, Decision 235: name the loosening; fixed by the line above). CITE: dec:278, dec:276, dec:279, dec:149, dec:247. Decisions triaged: 238 of 238. Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2. Serves: NS.4 3/5."
  - "Unbuilt plans on these files: none on main; chain 6 (rec-5449) depends on this rec and edits none of the three files."
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:1f4167c9c345da50aa9e1a33b0163008d68cc0d8493fcb56483f25b402607a39"}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Decision 278 read (clause 4 and its manifest delegation) and Decision 149's stub grammar
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    scripts/checks/decisions/consolidation.py: add _live(rows, entries, number) -> (live number or None, path). Loop
    while the number has a header and was not seen on the path: return it if not _superseded; else read
    extract_superseded_by; stop with None when the marker is missing or non-numeric, the target has no header, or the
    target's index row supersedes (its envelope supersedes when it has no row) does not list the current number;
    otherwise append the target to the path and continue. Add _via(path), rendering " (-> 290)" or " (-> 8 -> 10)"
    for a path longer than one and "" otherwise.
  - >-
    In _target_problems' held "Decision N" branch: a non-numeric N or one in ctx victims does not resolve; otherwise
    resolve with _live. Fail with "held {key}{via} is absent, superseded or a victim" when it does not resolve or
    resolves to ctx number (the consolidating entry); else read the token in the resolved entry's body and fail with
    "token is absent from {key}{via}". Drop the old check that the entry itself is not superseded.
  - >-
    Move the carried_forward loop out of _manifest_problems into _carried_problems(tag, carried, cons, supersedes,
    ctx_in). A number fails when it is a victim, does not resolve, resolves to cons, is live with an empty amends row,
    or "Decision N" (its own number) is absent from the consolidating entry; the line reads "carried_forward Decision
    {n}{via} is a victim, does not resolve to a live entry, lost its amends edge or is unnamed".
  - >-
    tests/checks/decisions/test_consolidation.py: add helpers that make an entry a stub pointing at another, write a
    successor whose envelope supersedes it, and set index rows (with supersedes on the successor's row); add a
    RESOLVED table and test_carried_forward_and_held_resolve_through_supersession over it. Pass rows (expect no
    problem): held 7 -> 8; held 7 -> 8 -> 10; carried 3 -> 5 whose successor amends nothing. Fail rows (expect the
    substring): successor lacks the token ("token is absent from Decision 7 (-> 8)"); marker names a missing header;
    superseded without a marker (superseded_pointer); a cycle 7 -> 8 -> 7 ("(-> 8 -> 7)"); successor's supersedes
    omits the predecessor; a carried_forward number that is a victim ("carried_forward Decision 2 is a victim"); held
    resolving to the consolidating entry ("held Decision 7 (-> 4)"). Leave every DEFECTS row unchanged.
  - >-
    docs/contracts/decision-compaction.yaml consolidation.manifest.shape: replace "that entry is neither
    superseded_compacted nor a victim of this manifest)" with "N is not a victim of this manifest and resolves, per
    resolve, to a live entry other than the consolidating entry)". In consolidation.manifest.resolve replace "or a
    carried_forward number is superseded, has no header or is not named in the consolidating entry." with "or a
    carried_forward number is a victim, does not resolve to a live entry other than the consolidating entry, is not
    named by its own number in the consolidating entry or, while itself live, has no amends edge. A superseded held
    \"Decision N\" or carried_forward number resolves hop by hop through each entry's Superseded by marker to the first
    entry that is not superseded; a hop resolves only to an entry with a header whose supersedes lists the entry
    before it, so an entry superseded without a marker, or a repeat, does not resolve. A held token is read in the
    entry it resolves to, and a failure line names the path. A merged manifest is never rewritten to follow a later
    supersession." Add an amendment_log row at the top: {date: <build date>, semantic_break: false, change_class:
    field_add, summary: "PLAN-manifest-supersession-resolver (rec-5717): manifest shape and resolve: a superseded held
    or carried_forward Decision resolves through its Superseded by chain to the live successor; merged manifests are
    never rewritten."}. Keep contract_version.
  - Execute the Verification Plan; loop until each step passes; on an unrecoverable failure stop and RCA (Decision 55).
  - "Report: the diff summary, VP 1-5 outputs, and on merge tell the coordinator so chain 6's plan re-runs its wording check."
rollback: Revert the squash commit; the checker returns to rejecting superseded references and no data changes.
