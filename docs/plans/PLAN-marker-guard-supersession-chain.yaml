execution_steps:
  - >-
    scripts/checks/_marker_guard.py authorization_failure: after building candidates, set number from dec_id and loop
    over dict.fromkeys(resolve_live(bodies, number)[1]); for the first hop whose body (when
    present) mentions a candidate, return kind_failure(hop, body, _common.ROOT); after the loop return True. Remove the
    one-hop block and the now-unused scripts.decisions_md import; import resolve_live from
    scripts.checks._decision_chain. Rewrite the docstring to state the walk (a hop counts only when the successor
    declares its predecessor, as in the consolidation manifests; currency comes from body markers, since the guard
    passes no index rows; first naming body decides; kind judged on it) and drop "the two re-exported scripts.decisions_md names" from the __all__
    comment.
  - >-
    Add "scripts/checks/_decision_chain.py" as the first item of the pre_globs of the eight Entries named in scope
    (validate_actions_account_id_masking, validate_oidc_failopen_guards, validate_sandbox_runner_test_deps,
    validate_schedule_removal_markers, validate_workflow_dependency_install, validate_platform_roadmap,
    validate_roadmap_liveness, validate_telemetry_metadata_keys). In the five ci_guards Entries also replace the
    "scripts/checks/_marker_guard.py" and "scripts/checks/_marker_guard_state_options.py" lines with the one line
    "scripts/checks/_marker_guard*.py", so ci_guards/_manifest.py stays at its SLOC (measure against main at build
    time; it must not cross 500). validate_pre_glob_closure then reports no finding.
  - >-
    tests/checks/test__marker_guard.py: replace class TestSupersessionHop with module-level _FOO (a body naming
    scripts/checks/foo.py) and _K (a kind envelope then _FOO) constants, a one-line helper _d(n, prev, to=0) giving
    "## Decision n: s (supersedes Decision prev)" plus, when to is set, "**Superseded by: Decision to**", a
    SUPERSESSION table and test_marker_authorizes_through_multi_hop_supersession parametrized over its sorted names,
    decorated with @patch("scripts.checks._marker_guard_state_options._floor", lambda _root: ("sampled", 279)) so the
    kind rows do not move with approval-routing.yaml's lane (its one-line description is a comment, not a docstring:
    the file has one line of SLOC slack), each asserting authorization_failure("dec-1", "scripts/checks/foo.py", bodies) is the row's value. Rows: one
    declared hop authorizes (False); an undeclared successor is not consulted (True); a successor that never mentions
    the key fails (True); two hops authorize (False); a mentioning intermediate decides, its successor declared but
    silent (False); no body on the chain mentions the key (True); a cycle ends and fails (True); a missing successor
    fails (True); the kind rule judges the deciding body (a mechanism-kind Decision 900, above kind_floor 279, two
    hops away: True); a direction successor past the floor authorizes (False). Each mutant must fail at least one row:
    the walk's declaration test removed; kind_failure given the cited number instead of the hop; judging only the
    path's last entry; walking one hop only.
  - >-
    docs/contracts/marker-grammar.yaml: apply the sidecar's two blocks (grammar-log, grammar-hop) word for word, the
    {{DATE}} filled with the build date. Keep contract_version.
  - >-
    config/agent/verification_registry/entries/marker-guard-uses-shared-decisions-parser.yaml: replace only the
    third item of check_spec.command (the bash -c string) with: grep -q "from scripts.checks._decision_chain import
    resolve_live" scripts/checks/_marker_guard.py && grep -q "bodies_from_text(" scripts/checks/_marker_guard.py &&
    grep -Eq "^from scripts.decisions_md import .*iter_decision_sections" scripts/checks/_marker_guard_state_options.py
    && grep -Eq "^from scripts.decisions_md import .*extract_superseded_by" scripts/checks/_decision_chain.py && !
    grep -q "## Decision" scripts/checks/_marker_guard.py scripts/checks/_marker_guard_state_options.py
    scripts/checks/_decision_chain.py && grep -q "DECISIONS_ARCHIVE" scripts/checks/_marker_guard.py && echo "shared
    parser OK" (one line in the YAML; keep the record's width-200 rendering and every other field). The import greps
    need single-line imports, which all three files use today; a wrapped import later reds the record loudly.
  - >-
    tests/checks/test__marker_guard_state_options.py test_kind_rule_through_authorization_failure: give the stub's
    successor the heading "## Decision 301: T (supersedes Decision 250)" for both its mechanism and direction bodies
    (one dict built from _entry with a replace), keep the two assertions on them (True, False), and add one assertion
    that the undeclared direction _entry(301, "direction") now refuses (True).
  - >-
    config/agent/executor/capabilities.yaml: append the two lines "  - scripts/checks/_decision_chain" and
    "  - tests/checks/test__decision_chain" as the last items of boundary_patterns, directly after
    "  - ontheloop/guidance/", touching no comment or other line (anything else is a gated change); in tests/test_ops_data_portal_validators.py add
    "scripts/checks/_decision_chain.py" as the last parameter of
    test_compute_automatable_executor_loop_kernel_path_is_never_automatable.
