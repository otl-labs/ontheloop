  - "Planned loosening (Decision 235 cl.1, cl.5 floor), confirmed with this plan: the guard's acceptance widens for declared chains, so a marker whose naming body is two or more declared hops along the chain now authorizes and the one-hop-only test is removed; no other test row is loosened. Planned tightening: an undeclared successor is no longer consulted (the one-hop authorize test's fixture becomes a fail row, and test_kind_rule_through_authorization_failure's successor fixture declares its predecessor, with one undeclared row added that refuses)."
  - >-
    Record repair (Decision 244 cl.5, claim unchanged; no live claim retired, so not a Decision 235 cl.1 retirement;
    the operator was asked on 2026-11-27 since the record guards a boundary_patterns path, Decision 235 cl.5): graduated
