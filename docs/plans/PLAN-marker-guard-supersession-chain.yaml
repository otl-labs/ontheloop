schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: marker-guard-supersession-chain
intent: >-
  Let the shared raise-marker guard follow a cited Decision's Superseded by chain hop by hop through the shared walk,
  so a budget-raise marker stays authorized when the successor restating its key is itself consolidated later
  (rec-5719); each hop counts only when the successor declares its predecessor, the consolidation-manifest rule
  (operator ruling 2026-11-27).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-marker-guard-supersession-chain.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5719 (Low), follow-on of rec-5717; its build follows rec-5720's (PLAN-inventory-inherited-manifest-units), which
  creates scripts/checks/_decision_chain.py. Closes no roadmap criterion.
closes_criteria: []
cites: [dec:117, dec:149, dec:165, dec:185, dec:235, dec:244, dec:246, dec:278, dec:279]
amends: []
introduces: []
scope:
  - file: scripts/checks/_marker_guard.py
    action: Modify
    purpose: >-
      authorization_failure walks resolve_live(bodies, number)'s path in order (declared hops only); the first body
      that mentions the key decides and kind_failure judges that body and number; docstrings drop the one-hop claim.
    new_imports: [scripts.checks._decision_chain]
  - file: tests/checks/test__marker_guard.py
    action: Modify
    purpose: >-
      TestSupersessionHop's three tests become the SUPERSESSION table and
      test_marker_authorizes_through_multi_hop_supersession (rec-5719's acceptance node); declared chains of any
      length authorize (Decision 235 planned loosening of the one-hop-only test) and an undeclared successor is no
      longer consulted (a tightening of the one-hop authorize test).
  - file: tests/checks/test__marker_guard_state_options.py
    action: Modify
    purpose: >-
      test_kind_rule_through_authorization_failure's stub successor (301) gains the title declaration "(supersedes
      Decision 250)", so its two kind assertions hold through a declared hop, and one row pins the tightening (an
      undeclared direction successor refuses).
  - file: config/agent/verification_registry/entries/marker-guard-uses-shared-decisions-parser.yaml
    action: Modify
    purpose: >-
      Plan amendment (full tier, build of 2026-11-27): the shard's first clause greps _marker_guard.py for "from
      scripts.decisions_md import", an import step 1 removes. Repaired with its claim unchanged (Decision 244 cl.5): the
      first clause pins each module of the guard's parse path to scripts.decisions_md, and the "## Decision" clause
      covers all three modules.
  - file: docs/contracts/marker-grammar.yaml
    action: Modify
    purpose: >-
      authorization_mechanics.supersession_hop states the chain walk; one amendment_log row. Gated key
      (approval-routing.yaml): the words are the sidecar's, never edited by the build.
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      In the pre_globs of validate_actions_account_id_masking, validate_oidc_failopen_guards,
      validate_sandbox_runner_test_deps, validate_schedule_removal_markers and validate_workflow_dependency_install,
      the two _marker_guard literals become one "scripts/checks/_marker_guard*.py" glob and
      scripts/checks/_decision_chain.py is added (net 0 lines: the file is at 497 of 500 SLOC; the guard now imports
      the module and validate_pre_glob_closure names exactly these eight Entries across three manifests).
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: validate_platform_roadmap's and validate_roadmap_liveness's pre_globs add scripts/checks/_decision_chain.py.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: validate_telemetry_metadata_keys' pre_globs add scripts/checks/_decision_chain.py.
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      boundary_patterns appends scripts/checks/_decision_chain and tests/checks/test__decision_chain at the END of
      the list (after ontheloop/guidance/), since the guard's chain walk now lives there (Decision 185 cl.3). Only a
      pure end append is exempt from the gated key (approval_routing._appended; a mid-list insert is gated and no
      sidecar block binds it; rehearsed: middle False, end True).
  - file: tests/test_ops_data_portal_validators.py
    action: Modify
    purpose: >-
      test_compute_automatable_executor_loop_kernel_path_is_never_automatable gains the parameter
      scripts/checks/_decision_chain.py (red without the capabilities.yaml lines, green with them; rehearsed).
  - file: docs/plans/approved/marker-guard-supersession-chain.yaml
    action: Create
    purpose: The approved-text sidecar (git-ops.yaml approved_text_binding), merged with this plan; the build never edits it.
bundled_recommendations: [rec-5719]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A marker citing a Decision whose body does not name the key is authorized when a body further along its Superseded
    by chain names it, however many hops away; the first naming body on the path decides and the kind rule judges that
    body; a cycle, a missing successor or a chain where no body names the key fails.
  - >-
    A hop counts only when the successor declares the entry before it (envelope supersedes or heading title), as in
    consolidation.manifest.resolve, the first hop included; every live marker stays authorized (none cites a
    superseded Decision).
  - marker-grammar.yaml supersession_hop and its amendment_log row hold exactly the sidecar's approved words.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5719's acceptance node.
    command: bin/venv-python -m pytest "tests/checks/test__marker_guard.py::test_marker_authorizes_through_multi_hop_supersession" -q
    expected: >-
      exit 0 with 10 passed; against the base guard the two-hops and undeclared-successor rows fail, and each mutant
      named in execution step 3 fails its row
    fix_if: a row fails; read its name and fix the guard, never the row
    hermetic: true
    expected_literals: ["10 passed"]
    graduation: waive
    graduation_waiver_reason: The node runs in the suite on every change to the guard; a registry row would duplicate it.
  - step: 2
    phase: pre-deploy
    action: The guard's whole mirror file, its state-options mirror and every authorization_failure consumer's tests still pass, including the live-corpus invariant.
    command: bin/venv-python -m pytest tests/checks/test__marker_guard.py tests/checks/test__marker_guard_state_options.py tests/checks/test__decision_chain.py tests/checks/sloc tests/checks/prose tests/checks/misc tests/checks/typing tests/checks/ci_guards tests/test_ops_data_portal_validators.py tests/checks/verification/test_validate_tier_demotion_markers.py tests/checks/structural/test_budget_raises.py tests/checks/contracts/test__ratchet.py tests/checks/contracts/test_validate_tier_a_amendment_guard.py tests/checks/roadmap/test_validate_roadmap_liveness.py tests/checks/structural/test_size_limits.py tests/checks/structural/test__byte_raises.py tests/checks/deps/validate_pre_glob_closure -q -n 4
    expected: exit 0, no failures
    fix_if: an existing consumer test fails; the walk changed a one-hop result
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A re-run of tests the scope touches; the suite already runs them on every change.
  - step: 3
    phase: pre-deploy
    action: The nine checks that re-scan live markers through the guard (check_present_markers, check_diff and check_state_diff callers) still pass (the retroactive scan); the other authorization_failure callers (size_limits, _byte_raises, the two ci_guards shell-body checks, contracts _ratchet, validate_pre_glob_closure) run in VP 4's --pre.
    command: >-
      bin/venv-python -c "import importlib; c=[('verification.validate_tier_demotion_markers','validate_tier_demotion_markers'),('typing.mypy_baseline','validate_mypy_baseline_edits'),('structural.budget_raises','validate_structural_size_budget_raises'),('ci_guards.validate_schedule_removal_markers','validate_schedule_removal_markers'),('misc.coverage_baseline','validate_coverage_baseline_edits'),('misc.sensitive_value_detectors','validate_detector_registry_edits'),('prose.prose_budget_raises','validate_prose_budget_raises'),('contracts.validate_tier_a_amendment_guard','validate_tier_a_amendment_guard'),('sloc.validate_sloc_budget_raises','validate_sloc_budget_raises')]; f=[]; [getattr(importlib.import_module('scripts.checks.'+m), a)(f) for m, a in c]; print('FAILED', f); assert f == []; print('RETRO_OK')"
    expected: prints FAILED [] then RETRO_OK (rehearsed; with the guard forced to refuse, four of the nine checks fail, so the scan is live)
    fix_if: a failure; the walk lost an authorization a live marker relies on (re-check that its successor declares it)
    hermetic: true
    expected_literals: ["RETRO_OK"]
    graduation: waive
    graduation_waiver_reason: These checks' own retroactive scans run in --pre on every change; this step only reads them at build time.
  - step: 4
    phase: pre-deploy
    action: The approved words landed exactly, and the size headroom and fast tier hold.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug marker-guard-supersession-chain --base origin/main
      && bin/venv-python -c "sl=[sum(1 for l in open(f) if l.strip() and not l.strip().startswith('#')) for f in ('scripts/checks/_marker_guard.py', 'tests/checks/test__marker_guard.py')]; print('SLOC', sl); assert max(sl) <= 500"
      && bin/venv-python -m scripts.validate --pre
    expected: >-
      approved_text verify passes, SLOC prints both files at most 500 (rehearsed 423 and 499), then validate --pre exits
      0 with validate_merge_step's approved-text check passing and validate_verification_registry's differential
      admitting the edited record (its output holds the line "admitted: marker-guard-uses-shared-decisions-parser"; a
      "skipped (non-fatal)" line instead means origin/main did not resolve, so re-run with it fetched)
    fix_if: >-
      a verify mismatch (restore the sidecar's words, never edit the sidecar), a file over 500 (main grew it first:
      decompose per Decision 128, never raise, keeping the new node in tests/checks/test__marker_guard.py so rec-5719's
      acceptance path and shard marker-guard-supersession-hop's -k stay live, and alert the coordinator for a plan
      amendment), or a --pre failure (fix on the branch)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_merge_step and validate_sloc_limits are the standing guards; this step pins them for the build.
  - step: 5
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 6
    phase: post-deploy
    action: rec-5719 reads back closed after the build's squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5719']); print(rows[0]['status'])"
    expected: prints closed
    fix_if: prints open; close it through scripts.ops_data_portal --update-rec after confirming its acceptance node passes on main
    hermetic: false
    graduation: not-applicable
