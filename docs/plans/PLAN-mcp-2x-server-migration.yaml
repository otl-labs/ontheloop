schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: mcp-2x-server-migration
intent: >-
  Move the DuckLake read-only MCP stdio server every interactive session uses onto the mcp 2.x SDK and lift the mcp<2 pin
  (rec-3795), with today's wire behaviour kept and typed tool errors made visible to clients (rec-2871), so litellm tool calls
  and litellm.experimental_mcp_client work for the verdict-persona LiteLLM backend (T4.32 c1, T4.10a c7) without a private
  workaround.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-mcp-2x-server-migration.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- resolves rec-3795 (Medium, risk high) and rec-2871 (Medium). No tier_item
  criterion claimed; enabling dependency for T4.32 c1 (the LiteLLM backend consumes this server as an MCP client per T4.10a c7).
closes_criteria: []
scope:
  - file: scripts/agent_sdk/mcp_server.py
    action: Modify
    purpose: >-
      Port create_server to the mcp 2.x lowlevel Server: handlers passed as on_list_tools= / on_call_tool= constructor kwargs
      with (ctx, params) signatures returning types.ListToolsResult / types.CallToolResult; Tool built with input_schema=. A new
      module-level _call_tool_result(reader, tool_by_name, name, arguments) does explicitly what mcp 1.x did implicitly, in this
      order: unknown tool -> error result error_type "unknown_tool"; jsonschema.validate(arguments, tool.input_schema) failure ->
      error result text "Input validation error: <message>", error_type "input_validation", reader never called; AgentToolError
      family -> error result text str(exc), structured_content {"error_type": <class name>, "message": str(exc)}; any other
      exception -> error result text "<tool> failed: class=<ClassName>", structured_content {"error_type": "internal",
      "error_class": <ClassName>} with NO exception text (Decision 101; same class-only rule as _default_surface); success ->
      structured_content {"rows": rows, "row_count": len(rows)} plus one TextContent of json.dumps(payload, indent=2).
      params.arguments None reads as {}. The tool list stays derived from describe() (Decision 81 cl.2), read-only (Decision 84
      I-3, Decision 143), fail-loud on describe failure (Decision 55); _run_stdio, main, _default_surface, build_tool_registry's
      derivation and _CACHE_FIRST_NOTE (Decision 215) are unchanged in behaviour.
    new_imports: []
  - file: tests/test_agent_sdk_mcp_server.py
    action: Modify
    purpose: >-
      Replace the removed server.request_handlers harness with the public in-memory mcp.Client (async with Client(server)); read
      results through 2.x snake_case attributes (is_error, structured_content, input_schema). Keep EVERY existing class and test
      name (verification-registry entries pin TestReadOnlySurface, TestFailLoud, TestTypedErrors, TestCreateServer and its
      test_default_reader_is_the_routed_reader / test_ops_tools_survive_an_unavailable_event_reader nodes, TestProjection,
      TestToolDescriptions, TestAgentFacingProjection). Add module-level tests: test_tool_round_trip_on_mcp_2x (rec-3795
      acceptance), test_call_tool_error_carries_error_type (rec-2871 acceptance), test_unexpected_exception_text_never_reaches_the_client,
      test_input_validation_error_is_an_error_result, test_requirements_only_diff_selects_this_file,
      test_jsonschema_is_a_direct_requirement (requirements.in declares it and requirements.txt annotates it via -r requirements.in).
  - file: requirements.in
    action: Modify
    purpose: 'mcp>=1.30.0,<2 -> mcp>=2.3.0,<3; add jsonschema>=4.20.0 (now imported directly by mcp_server.py; mcp 2.3.0 declares the same floor).'
  - file: requirements-fast.txt
    action: Modify
    purpose: 'Same two lines as requirements.in (its header requires runtime-tool floor parity).'
  - file: requirements.txt
    action: Modify
    purpose: >-
      Minimal relock: pip-compile --strip-extras --upgrade-package mcp with the existing lock as preference. Only the mcp closure
      moves (drops httpx, httpcore, httpx-sse, pydantic-settings, python-dotenv; adds httpx2, httpcore2, mcp-types,
      opentelemetry-api, truststore; mcp 1.30.0 -> 2.3.0; jsonschema annotation gains requirements.in). Every other pin,
      duckdb included (Decision 99), byte-identical. The `--no-index` header command line kept byte-identical to Dependabot's.
  - file: requirements-dev.txt
    action: Modify
    purpose: 'Recompile against the new requirements.txt constraint (annotation-only changes expected; litellm stays 1.106.2; header line kept byte-identical).'
  - file: tests/test_import_governance.py
    action: Modify
    purpose: >-
      Replace test_mcp_declaration_rejects_major_two (vacuous once the floor is 2.3.0) with test_mcp_declaration_rejects_the_next_major:
      Version(f"{pin.major + 1}.0.0") not in the mcp declaration's specifier, pin read from the compiled requirements.txt (same
      independent oracle as test_mcp_declaration_admits_the_compiled_pin), parametrized over requirements.in and requirements-fast.txt.
      No Version("1.x.y") literal (graduated shard mcp-declaration-test-has-no-pinned-1x-literal). Replace-only: the file is
      NEAR_CAP (472 of 500 SLOC); the jsonschema direct-requirement test lives in tests/test_agent_sdk_mcp_server.py instead.
  - file: config/agent/verification_registry/entries/mcp-declaration-admits-compiled-pin.yaml
    action: Modify
    purpose: >-
      Re-point the second node id from ...::test_mcp_declaration_rejects_major_two to ...::test_mcp_declaration_rejects_the_next_major
      (operator-confirmed retirement of the literal "2.0.0 rejected" claim, Decision 235 cl.1 / Decision 244 cl.5).
bundled_recommendations:
  - rec-3795
  - rec-2871
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    rec-3795's acceptance holds: bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::test_tool_round_trip_on_mcp_2x -q
  - >-
    rec-2871's acceptance (as updated at planning time) holds: grep -q 'structured_content' scripts/agent_sdk/mcp_server.py && bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::test_call_tool_error_carries_error_type -q
  - requirements.txt pins mcp==2.3.0 (or a later 2.x the build must justify); requirements.in and requirements-fast.txt declare mcp>=2.3.0,<3 and jsonschema>=4.20.0; no pin outside the mcp closure changed.
  - Every existing test in tests/test_agent_sdk_mcp_server.py and tests/test_import_governance.py passes under mcp 2.x with its node id unchanged, except the one operator-confirmed rename.
  - A non-AgentToolError exception's text never reaches the client; an AgentToolError's does, with its class as error_type.
  - A requirements.txt-only diff selects tests/test_agent_sdk_mcp_server.py in --pre affected-set selection (Decision 135).
  - Live stdio wire output (tools/list, a recs_by_ids call, an unknown tool, a bad-arguments call) is identical to mcp 1.30's across protocol versions 2024-11-05, 2025-03-26, 2025-06-18, 2025-11-25, except the dropped empty experimental capability.
  - litellm 1.106.2 completion and acompletion with tools= work WITHOUT _skip_mcp_handler, and import litellm.experimental_mcp_client succeeds.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-3795 acceptance -- in-memory round trip through the public mcp 2.x Client.
    command: bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::test_tool_round_trip_on_mcp_2x -q
    expected: 1 passed.
    fix_if: Port the handler, never relax the test; target_absent on the un-implemented tree is the expected red-before.
    hermetic: true
    graduation: graduate
    graduation_check_id: mcp-server-round-trip-on-mcp-2x
  - step: 2
    phase: pre-deploy
    action: rec-2871 acceptance -- typed errors carry error_type; unexpected exception text withheld.
    command: grep -q 'structured_content' scripts/agent_sdk/mcp_server.py && bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::test_call_tool_error_carries_error_type tests/test_agent_sdk_mcp_server.py::test_unexpected_exception_text_never_reaches_the_client -q
    expected: 2 passed.
    fix_if: Fix _call_tool_result; never put exception text in the non-AgentToolError branch.
    hermetic: true
    graduation: graduate
    graduation_check_id: mcp-server-typed-error-payload
  - step: 3
    phase: pre-deploy
    action: Whole server suite under mcp 2.x, existing node ids intact, 100% coverage of mcp_server.py (Decision 159).
    command: bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py -q -m "not integration" --cov=scripts.agent_sdk.mcp_server --cov-report=term-missing --cov-fail-under=100
    expected: All pass; coverage 100%.
    fix_if: A missing class/test name breaks a registry pin -- restore the name. Uncovered lines -- add a test, never a pragma.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Pin guards -- the declaration admits the compiled pin and rejects the next major; jsonschema is a direct requirement.
    command: bin/venv-python -m pytest tests/test_import_governance.py::TestCheckLockfileSync tests/test_agent_sdk_mcp_server.py::test_jsonschema_is_a_direct_requirement -q
    expected: All pass.
    fix_if: Fix the declaration or the lock, never the oracle.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: mcp-declaration-admits-compiled-pin already graduates these nodes (re-pointed in this plan); a second row would duplicate it.
  - step: 5
    phase: pre-deploy
    action: Relock is minimal -- only the mcp closure moved; duckdb lockstep intact.
    command: >-
      git diff origin/main -U0 -- requirements.txt requirements-dev.txt | grep -E '^[-+][a-z0-9]' | sed -E 's/^[-+]([A-Za-z0-9_.-]+).*/\1/' | sort -u | tr '\n' ' ' ; echo; bin/venv-python -m scripts.validate --check validate_ducklake_version_lockstep
    expected: The changed-name set is a subset of {mcp, mcp-types, httpx, httpx2, httpcore, httpcore2, httpx-sse, pydantic-settings, python-dotenv, opentelemetry-api, truststore, jsonschema}; the lockstep check passes.
    fix_if: Any other name moved -- re-run the relock with --upgrade-package mcp only, from the main lock.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Decision 135 data edge -- a requirements.txt-only diff selects the MCP server tests.
    command: bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::test_requirements_only_diff_selects_this_file -q
    expected: 1 passed.
    fix_if: Keep the quoted requirements.txt literal in test_tool_round_trip_on_mcp_2x.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The test lives in the same file steps 1-2 graduate and runs in every tier that selects the file.
  - step: 7
    phase: pre-deploy
    action: Live stdio wire parity against main (credentials; agent_platform). Run the probe against the built branch and against a main worktree on mcp 1.30 and diff.
    command: AWS_PROFILE=agent_platform bin/venv-python /mnt/project-files/rec-3795-plan/evidence/stdio_probe.py "$(pwd)/.venv/bin/python" "$(pwd)"
    expected: For each of 2024-11-05, 2025-03-26, 2025-06-18, 2025-11-25 the line reads tools N call_isError False rows 1 bad_isError True err None, N equal to main's.
    fix_if: A JSON-RPC error instead of isError means an exception escaped _call_tool_result.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Live end-to-end test (by hand only, never a CI tier).
    command: AWS_PROFILE=agent_platform bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::TestEndToEnd -q -m integration
    expected: 1 passed.
    fix_if: Fix the port; the test carries no credentials skip by design.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: litellm tool calls without the private flag, and the MCP bridge import (mock only, no network model call).
    command: bin/venv-python -I /mnt/project-files/rec-3795-plan/evidence/litellm_probe.py
    expected: 'Prints flag False sync OK, flag False async OK, flag True sync OK, flag True async OK and experimental_mcp_client import OK.'
    fix_if: An ImportError means mcp 1.x is still installed -- bash bin/sync-deps.sh.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: Fresh session after merge loads the new lock and lists the ducklake-reads tools.
    command: bin/venv-python -c "import importlib.metadata as m; print(m.version('mcp'))" && bin/venv-python -m scripts.agent_sdk.mcp_server < /dev/null; echo exit=$?
    expected: Prints a 2.x version; the server starts and exits cleanly on EOF; in that session the mcp__ducklake-reads__ tools are listed.
    fix_if: A 1.x version means the sync hook failed (it is advisory and exits 0) -- run bash bin/sync-deps.sh and restart.
    hermetic: false
  - step: 11
    phase: post-deploy
    action: Dependabot's stored "ignore this major version" on mcp is lifted (operator-approved comment on one open Dependabot pip PR, if one exists).
    command: echo "comment '@dependabot show mcp ignore conditions' on an open Dependabot pip PR; if a 2.x ignore remains, comment '@dependabot unignore mcp'"
    expected: No mcp ignore condition remains, or none can be checked because no Dependabot pip PR is open (recorded as unproven).
    fix_if: An ignore condition remains -- the unignore comment, with the operator's word.
    hermetic: false
  - step: 12
    phase: post-deploy
    action: Bundled recs closed by the squash trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as rc; rows,_=rc.fetch_recs_by_ids(rc.make_reader(),['rec-3795','rec-2871']); print(sorted((r['id'], r['status']) for r in rows))"
    expected: Both closed.
    fix_if: 'The squash commit body lacks Resolves: rec-3795, rec-2871.'
    hermetic: false
test_obligations:
  - source: scripts/agent_sdk/mcp_server.py
    behavior: Tool round trip over the mcp 2.x API, typed error payload, withheld unexpected exception text, input validation.
    verification_step: 1
    test_selector: tests/test_agent_sdk_mcp_server.py::test_tool_round_trip_on_mcp_2x
    red_green_expectation: red before (target absent; and the main server raises AttributeError list_tools under mcp 2.x), green after
  - source: tests/test_agent_sdk_mcp_server.py
    behavior: The harness drives the server only through the public mcp 2.x Client.
    verification_step: 3
    command: bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py -q -m "not integration"
    red_green_expectation: red before (6 fail under mcp 2.x on main), green after
  - source: requirements.in
    behavior: mcp declared >=2.3.0,<3 and jsonschema declared.
    verification_step: 4
    test_selector: tests/test_import_governance.py::TestCheckLockfileSync
    red_green_expectation: red before (the next-major and jsonschema tests are absent), green after
  - source: requirements-fast.txt
    behavior: Same floors as requirements.in.
    verification_step: 4
    test_selector: tests/test_import_governance.py::TestCheckLockfileSync
    red_green_expectation: red before, green after
  - source: requirements.txt
    behavior: Lock pins mcp 2.x with jsonschema as a direct requirement.
    verification_step: 4
    test_selector: tests/test_import_governance.py::TestCheckLockfileSync
    red_green_expectation: red before (admits-the-compiled-pin fails for a 2.3.0 floor against the 1.30 lock), green after
  - source: requirements-dev.txt
    behavior: Dev lock compiles against the new runtime constraint.
    verification_step: 9
    command: bin/venv-python -I /mnt/project-files/rec-3795-plan/evidence/litellm_probe.py
    waiver_reason: Generated lock with annotation-only changes; litellm behaviour is proven by step 9's probe, not a unit test.
  - source: tests/test_import_governance.py
    behavior: Next-major guard cannot go vacuous; jsonschema direct-requirement guard.
    verification_step: 4
    test_selector: tests/test_import_governance.py::TestCheckLockfileSync
    red_green_expectation: red before, green after
  - source: config/agent/verification_registry/entries/mcp-declaration-admits-compiled-pin.yaml
    behavior: Registry pin resolves to the renamed node.
    verification_step: 4
    test_selector: tests/test_import_governance.py::TestCheckLockfileSync::test_mcp_declaration_rejects_the_next_major
    waiver_reason: The full tier's graduated-record resolution check (Decision 244 cl.1) is the guard; a unit test would restate it.
constraints:
  - No pin outside the mcp closure moves (Decision 99 duckdb lockstep); relock with --upgrade-package mcp from the main lock.
  - Keep every existing test class and node name in tests/test_agent_sdk_mcp_server.py (verification-registry pins, Decision 244).
  - No exception text other than the AgentToolError family's reaches a client (Decision 101).
  - Never loosen a test to get green (Decision 235); the only renamed test is the operator-confirmed one.
  - tests/test_agent_sdk_mcp_server.py stays under 500 SLOC (Decision 128); split, never raise, if it would cross.
  - mypy clean on mcp_server.py (Decision 161 ratchet has no baseline entry for it).
  - The live tests (steps 7, 8) run by hand with agent_platform; never in a CI tier.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout r1 FLAGS_FOUND (WARN 244 registry pin; NOTE 101 error text; SPIRIT 135 requirements-only diffs) -- all adopted. Decisions triaged: 205 of 205. Roadmap items intersected: 5; CONFLICT: 0; RELATED: 5. Serves: NS.1 3/5. CITE: 55, 81, 84, 99, 212, 235."
  - "Related, no change needed: 76, 128, 131, 143, 159, 161, 215, 239. The LiteLLM transport plan (PLAN-llm-client-litellm-transport, unwritten) owns removing its _skip_mcp_handler workaround: amend before its build if this merges first, else a follow-on rec."
  - "Prototype evidence (throwaway worktree, 2026-11-11): /mnt/project-files/rec-3795-plan/evidence/ -- prototype.diff, relock.diff, wire-mcp1.json vs wire-mcp2.json (identical but the empty experimental capability), stdio_probe.py, litellm_probe.py. Advisor: advisor-brief/ADVICE.md."
  - "mcp 2.x gotchas: pydantic attrs are snake_case (is_error, structured_content, input_schema), constructors accept camelCase aliases, wire stays camelCase; a handler exception becomes JSON-RPC -32603 not an isError result, so every path must return a CallToolResult; 2.x no longer validates input against inputSchema."
  - "pip-compile --no-index cannot resolve in a CC-web container: run without it, then restore the header's command line byte-identical to Dependabot's. Sync this session's venv after the relock (bash bin/sync-deps.sh) before running tests."
  - "Rollout: session_start_sync_deps is advisory and exits 0 on failure; new code on mcp 1.30 fails in create_server, so a stale venv silently loses the ducklake-reads tools (step 10). Sessions already running are unaffected until restart."
  - "Dependabot PR #980 was closed with '@dependabot ignore this major version'; GitHub documents that as lifted once the repo upgrades to that major itself; step 11 checks, operator-approved comment."
  - "Graduated shards naming the two test files, all KEPT unchanged (node ids preserved): agent-verb-server-fails-loud-on-describe-failure, agent-verb-surface-is-read-only, agent-verb-tools-carry-nonempty-description, agent-verb-tools-derived-from-describe, agent-verb-typed-error-mapping, lockfile-sync-commented-absurd-bump-fails, lockfile-sync-hash-without-whitespace-not-comment, lockfile-sync-live-declarations-all-parsed, lockfile-sync-unparseable-declaration-fails, mcp-declaration-test-has-no-pinned-1x-literal, mcp-lock-major-compatibility, mcp-server-hermetic-coverage, preflight-summary-unavailable-and-agent-facing, telemetry-read-clients-use-the-route. Only mcp-declaration-admits-compiled-pin changes (scope)."
  - "PR CI's fast tier installs requirements-fast.txt (a range), so --pre runs the latest 2.x while the full tier tests the lock."
  - "Related-work check: red_overlap verdict clear (no reds, 2026-11-11). Operator sign-off 2026-11-11 covers confirmation A (rename + registry re-point, Decision 235) and B (Dependabot ignore-conditions comment, step 11)."
  - "Not bundled: rec-3821 (fast-tier floor agreement check -- separate concern, seven registration surfaces); rec-4280 (future repo-tools MCP server, to be written against 2.x)."
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - 'Pre: main''s requirements.txt still pins mcp==1.30.0 and no open PR touches the scope files. Post: none.'
  - 'requirements.in and requirements-fast.txt: mcp>=2.3.0,<3 and jsonschema>=4.20.0.'
  - 'Size relief (Decision 128): measure tests/test_import_governance.py and tests/test_agent_sdk_mcp_server.py SLOC against main after editing; if either crosses 500, split it into a mirror test package (Decision 131), never raise a budget.'
  - 'Relock: .venv/bin/pip-compile --output-file=requirements.txt --strip-extras --upgrade-package mcp requirements.in, then .venv/bin/pip-compile --output-file=requirements-dev.txt --strip-extras requirements-dev.in; restore both header command lines to the main text byte for byte; bash bin/sync-deps.sh. Post: step 5 passes.'
  - scripts/agent_sdk/mcp_server.py -- the 2.x port and _call_tool_result per the scope row.
  - tests/test_agent_sdk_mcp_server.py -- the Client harness, snake_case reads and the five new module-level tests per the scope row.
  - tests/test_import_governance.py and the registry entry -- the next-major and jsonschema tests; re-point the entry.
  - Execute Verification Plan -- run each pre-deploy step; loop until pass; stop and RCA on a step that cannot pass (Decision 55).
  - 'Report: what was implemented, verification results, the stdio parity lines, and the Resolves: rec-3795, rec-2871 trailer.'
rollback: Forward-fix only. Reverting the PR restores mcp 1.30 and the decorator server; sessions pick the old lock up on their next start.
