schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: mcp-2x-server-migration
intent: >-
  Move the DuckLake read-only MCP stdio server every interactive session uses onto the mcp 2.x SDK and lift the mcp<2 pin
  (rec-3795), keeping today's wire behaviour except two declared additions and making typed tool errors visible to clients
  (rec-2871), so litellm tool calls and litellm.experimental_mcp_client work for the verdict-persona LiteLLM backend (T4.32 c1)
  without a private workaround.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-mcp-2x-server-migration.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- resolves rec-3795 (Medium, risk high) and rec-2871 (Medium). No tier_item
  criterion claimed; T4.32 (not_started) is the consumer this enables, so closes_criteria is empty by design.
closes_criteria: []
scope:
  - file: scripts/agent_sdk/mcp_server.py
    action: Modify
    purpose: >-
      Port create_server to the mcp 2.x LOWLEVEL Server: handlers passed as on_list_tools= / on_call_tool= constructor kwargs with
      (ctx, params) signatures returning types.ListToolsResult / types.CallToolResult; Tool built with input_schema=. A new
      module-level _call_tool_result(reader, tool_by_name, name, arguments) makes every path return a CallToolResult (a raised
      exception in 2.x becomes a JSON-RPC -32603 error, not an isError result). In order: unknown tool -> error result whose text
      stays today's "unknown tool '<name>': expected one of [...]", structured_content {"error_type": "unknown_tool", "message":
      <text>}; then ONE try block around jsonschema.validate(arguments, tool.input_schema), _invoke_verb and json.dumps, with
      except clauses in this order: jsonschema.ValidationError -> text "Input validation error: <message>", structured_content
      {"error_type": "input_validation", "message": <text>}, reader never called; AgentToolError family -> text str(exc),
      structured_content {"error_type": <class name>, "message": str(exc)}; any other exception (including a jsonschema
      SchemaError from a malformed describe() schema and a non-serialisable row) -> text "<tool> failed: class=<ClassName>",
      structured_content {"error_type": "internal", "error_class": <ClassName>}, NO exception text (Decision 101; the same
      class-only rule as _default_surface). Success -> structured_content {"rows": rows, "row_count": len(rows)} plus one
      TextContent of json.dumps(payload, indent=2) (today's bytes). params.arguments None reads as {}. The tool list stays
      derived from describe() (Decision 81 cl.2), read-only (Decision 84 I-3, Decision 143), fail-loud on describe failure
      (Decision 55); _run_stdio, main, _default_surface, build_tool_registry's derivation and _CACHE_FIRST_NOTE (Decision 215)
      keep their behaviour.
    new_imports: []
  - file: tests/test_agent_sdk_mcp_server.py
    action: Modify
    purpose: >-
      Replace the removed server.request_handlers harness with the public in-memory mcp.Client (async with Client(server)); read
      results through 2.x snake_case attributes (is_error, structured_content, input_schema). Keep EVERY existing class and test
      name (graduated shards pin TestReadOnlySurface, TestFailLoud, TestTypedErrors, TestCreateServer and its
      test_default_reader_is_the_routed_reader / test_ops_tools_survive_an_unavailable_event_reader nodes, TestProjection,
      TestToolDescriptions, TestAgentFacingProjection). Add module-level tests -- test_tool_round_trip_on_mcp_2x (rec-3795
      acceptance: list_tools, a successful call's structured_content and JSON text, an unknown tool's is_error with
      structured_content error_type "unknown_tool", and the installed
      mcp major equal to the mcp== pin major read from ROOT / "requirements.txt" -- that quoted literal is the Decision 135 data
      edge); test_call_tool_error_carries_error_type (rec-2871 acceptance: a ReaderInvokeError body {"error_type": "runtime"}
      yields structured_content error_type "ReaderRuntimeError" with its message); test_unexpected_exception_text_never_reaches_the_client
      (a RuntimeError carrying a URL and an ARN-shaped string yields error_type "internal", the class name, and neither string;
      the ARN-shaped string carries no 12-digit account id, e.g. arn:aws:iam::x:role/r, so the never-commit hook passes);
      test_input_validation_error_is_an_error_result (wrong-typed argument -> "Input validation error", structured_content
      error_type "input_validation", reader not called);
      test_jsonschema_is_a_direct_requirement (requirements.in declares jsonschema and the lock's annotation block for
      jsonschema==, which is multi-line because mcp also requires it, contains "-r requirements.in").
  - file: tests/checks/deps/affected_tests/test_derivation.py
    action: Modify
    purpose: >-
      Add test_requirements_lock_selects_mcp_server_tests_through_data_edge beside test_setup_cloud_script_selects_contract_test_through_data_edge:
      derive_affected_tests over the real repo for a requirements.txt-only diff selects tests/test_agent_sdk_mcp_server.py and
      its provenance entry is "data_edge", as the sibling asserts (Decision 135 data edge, so a lock-only Dependabot mcp bump
      runs the server tests in --pre; selection through another channel cannot pass it).
  - file: requirements.in
    action: Modify
    purpose: 'mcp>=1.30.0,<2 -> mcp>=2.3.0,<3; add jsonschema>=4.20.0 (now imported directly by mcp_server.py; mcp 2.3.0 declares the same floor).'
  - file: requirements-fast.txt
    action: Modify
    purpose: >-
      Same two lines as requirements.in; add jsonschema to the header's runtime-tool floor list "(pydantic, pyyaml, networkx,
      import-linter, mcp, python-ulid)".
  - file: requirements.txt
    action: Modify
    purpose: >-
      Minimal relock: pip-compile --strip-extras --upgrade-package mcp with the existing lock as preference. Only the mcp closure
      moves (drops httpx, httpcore, httpx-sse, pydantic-settings, python-dotenv; adds httpx2, httpcore2, mcp-types,
      opentelemetry-api, truststore; mcp 1.30.0 -> 2.3.0; jsonschema's annotation gains -r requirements.in). Every other pin,
      duckdb included (Decision 99), byte-identical. The header command line kept byte-identical to main's (Dependabot's).
  - file: requirements-dev.txt
    action: Modify
    purpose: 'Recompile against the new requirements.txt constraint (annotation-only changes expected; litellm stays 1.106.2; header line kept byte-identical).'
  - file: tests/test_import_governance.py
    action: Modify
    purpose: >-
      Replace test_mcp_declaration_rejects_major_two (vacuous once the floor is 2.3.0) with test_mcp_declaration_rejects_the_next_major:
      Version(f"{pin.major + 1}.0.0") not in the mcp declaration's specifier, pin read from the compiled requirements.txt (same
      independent oracle as test_mcp_declaration_admits_the_compiled_pin), parametrized over requirements.in and
      requirements-fast.txt. No Version("1.x.y") literal (graduated shard mcp-declaration-test-has-no-pinned-1x-literal).
      Replace-only: the file is NEAR_CAP (472 of 500 SLOC).
  - file: config/agent/verification_registry/entries/mcp-declaration-admits-compiled-pin.yaml
    action: Delete
    purpose: >-
      Retire by git mv to config/agent/verification_registry/entries/deprecated/ (Decision 244 cl.5 retirement path; its pinned
      node test_mcp_declaration_rejects_major_two no longer exists). Operator-approved 2026-11-11 (Decision 235 cl.1): retire by git mv and replace with mcp-declaration-caps-next-major, chosen over re-pointing in place with a contract note. Its replacement
      record is VP step 4's graduation, check_id mcp-declaration-caps-next-major.
  - file: config/agent/verification_registry/entries/deprecated/mcp-declaration-admits-compiled-pin.yaml
    action: Create
    purpose: The git mv destination of the retired record, content unchanged.
  - file: tests/persona_contracts/test_schema_metaschema.py
    action: Modify
    purpose: >-
      The importorskip reason "jsonschema is a transitive pin (via mcp and litellm), not a direct requirement" becomes false;
      reword it to "env: jsonschema absent (a direct requirement since rec-3795)". The guard itself stays.
bundled_recommendations:
  - rec-3795
  - rec-2871
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    rec-3795's acceptance holds: bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::test_tool_round_trip_on_mcp_2x -q
  - >-
    rec-2871's acceptance (updated 2026-11-11 to the 2.x spelling) holds: grep -q 'structured_content'
    scripts/agent_sdk/mcp_server.py && bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::test_call_tool_error_carries_error_type -q
  - requirements.txt pins mcp==2.3.0 (a later 2.x only via a plan amendment); requirements.in and requirements-fast.txt declare mcp>=2.3.0,<3 and jsonschema>=4.20.0; no pin outside the mcp closure changed.
  - Every pre-existing test in tests/test_agent_sdk_mcp_server.py and tests/test_import_governance.py passes under mcp 2.x with its node id unchanged, except test_mcp_declaration_rejects_major_two, replaced by test_mcp_declaration_rejects_the_next_major with its record retired and replaced (operator-approved 2026-11-11; scope row 9).
  - A non-AgentToolError exception's text never reaches the client; an AgentToolError's does, with its class name as error_type.
  - A requirements.txt-only diff selects tests/test_agent_sdk_mcp_server.py in --pre affected-set selection (Decision 135).
  - >-
    Live stdio parity against origin/main on mcp 1.x, at protocol versions 2024-11-05, 2025-03-26, 2025-06-18 and 2025-11-25,
    over initialize, tools/list, a successful recs_by_ids call, an unknown tool and a bad-arguments call: identical full JSON
    except exactly two declared differences -- (1) 2.x no longer advertises the empty capabilities.experimental; (2) every error
    result carries structuredContent with a string error_type (rec-2871). Error texts, isError flags, tools/list and the success
    payload are identical. (Class-only text for unexpected exceptions is a third, intended change no live call can trigger; the
    hermetic test proves it.)
  - litellm 1.106.2 completion and acompletion with tools= work WITHOUT _skip_mcp_handler, and import litellm.experimental_mcp_client succeeds.
  - The retired record sits in entries/deprecated/ and a new graduated record mcp-declaration-caps-next-major pins the two pin-guard nodes.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-3795 acceptance -- in-memory round trip through the public mcp 2.x Client.
    command: bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::test_tool_round_trip_on_mcp_2x -q
    expected: 1 passed.
    fix_if: Port the handler, never relax the test; target_absent on the un-implemented tree is the expected red-before.
    hermetic: true
    graduation: graduate
    graduation_check_id: mcp-server-round-trip-on-mcp-2x
  - step: 2
    phase: pre-deploy
    action: rec-2871 acceptance and the other new error paths -- typed error payload, withheld unexpected exception text, input validation.
    command: >-
      grep -q 'structured_content' scripts/agent_sdk/mcp_server.py && bin/venv-python -m pytest
      tests/test_agent_sdk_mcp_server.py::test_call_tool_error_carries_error_type
      tests/test_agent_sdk_mcp_server.py::test_unexpected_exception_text_never_reaches_the_client
      tests/test_agent_sdk_mcp_server.py::test_input_validation_error_is_an_error_result -q
    expected: 3 passed.
    fix_if: Fix _call_tool_result; never put exception text in the non-AgentToolError branch.
    hermetic: true
    graduation: graduate
    graduation_check_id: mcp-server-typed-error-payload
  - step: 3
    phase: pre-deploy
    action: >-
      Whole server suite under mcp 2.x, pre-existing node ids intact, 100% coverage of mcp_server.py (Decision 159); the
      reworded test_schema_metaschema.py runs alongside.
    command: >-
      bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py tests/persona_contracts/test_schema_metaschema.py -q -m "not integration"
      --cov=scripts.agent_sdk.mcp_server --cov-report=term-missing --cov-fail-under=100
    expected: All pass; coverage 100%.
    fix_if: A missing class/test name breaks a graduated shard -- restore the name. Uncovered lines -- add a test, never a pragma.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates graduated shard mcp-server-hermetic-coverage plus the repo's standing 100% coverage gate (Decision 159).
      Stays hermetic false under vp-red-before hermetic_authoring carve-out (v) -- a whole-file re-run of a test file this
      plan's scope modifies -- and pytest-cov is absent from requirements-fast.txt, so a venv-less replay could not run it.
  - step: 4
    phase: pre-deploy
    action: Pin guards -- the mcp declaration admits the compiled pin and rejects the next major, in both requirements.in and requirements-fast.txt.
    command: >-
      bin/venv-python -m pytest tests/test_import_governance.py::TestCheckLockfileSync::test_mcp_declaration_admits_the_compiled_pin
      tests/test_import_governance.py::TestCheckLockfileSync::test_mcp_declaration_rejects_the_next_major -q
    expected: 4 passed (2 nodes x 2 files).
    fix_if: Fix the declaration or the lock, never the oracle.
    hermetic: true
    graduation: graduate
    graduation_check_id: mcp-declaration-caps-next-major
  - step: 5
    phase: pre-deploy
    action: jsonschema is a direct requirement, and a requirements.txt-only diff selects the server tests (Decision 135 data edge).
    command: >-
      bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::test_jsonschema_is_a_direct_requirement
      tests/checks/deps/affected_tests/test_derivation.py::test_requirements_lock_selects_mcp_server_tests_through_data_edge -q
    expected: 2 passed.
    fix_if: >-
      Selection test red -- keep the quoted requirements.txt literal in test_tool_round_trip_on_mcp_2x (it is the edge). Direct-requirement
      test red -- declare jsonschema in requirements.in and relock.
    hermetic: true
    graduation: graduate
    graduation_check_id: mcp-server-lock-data-edge
  - step: 6
    phase: pre-deploy
    action: Relock is minimal -- only the mcp closure moved; duckdb lockstep intact.
    command: >-
      moved=$(git diff origin/main -U0 -- requirements.txt requirements-dev.txt | grep -E '^[-+][a-z0-9]' | sed -E 's/^[-+]([A-Za-z0-9_.-]+).*/\1/' | sort -u
      | grep -vxE 'mcp|mcp-types|httpx|httpx2|httpcore|httpcore2|httpx-sse|pydantic-settings|python-dotenv|opentelemetry-api|truststore|jsonschema');
      echo "unexpected=${moved:-none}"; test -z "$moved" && ! git diff origin/main -- requirements.txt requirements-dev.txt | grep -E '^[-+]#.*pip-compile|^[-+]--[a-z]'
      && bin/venv-python -c "from scripts.checks.misc.validate_ducklake_version_lockstep import validate_ducklake_version_lockstep as v; f=[]; v(f); raise SystemExit(1 if f else 0)"
    expected: >-
      Prints unexpected=none and exits 0: no lock line outside the mcp closure moved, both pip-compile header command lines
      are byte-identical to main's, no option line (such as an emitted --index-url) was added or removed, and the lockstep check passes.
    fix_if: Any other name moved -- re-run the relock with --upgrade-package mcp only, starting from main's lock. A header line moved -- restore main's text byte for byte.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Stale-reference sweep -- the retired 1.x surfaces are gone from the server and its tests, and nothing live pins the retired test name.
    command: >-
      ! grep -nE 'request_handlers|\.isError|\.structuredContent|inputSchema=|@server\.(list_tools|call_tool)' scripts/agent_sdk/mcp_server.py
      tests/test_agent_sdk_mcp_server.py && ! grep -rn rejects_major_two tests config/agent/verification_registry/entries --include=*.py
      --include=*.yaml --exclude-dir=deprecated && test -f config/agent/verification_registry/entries/deprecated/mcp-declaration-admits-compiled-pin.yaml
      && test ! -e config/agent/verification_registry/entries/mcp-declaration-admits-compiled-pin.yaml
    expected: Exit 0 (no match, and the retired record sits only under entries/deprecated/).
    fix_if: A match is a leftover 1.x spelling or a live pin on the retired node -- port or retire it. A missing deprecated/ file means the record was deleted, not moved -- redo it with git mv.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: A one-time migration sweep; steps 1-5 graduate the lasting behaviour, and the full tier's shard resolution (Decision 244 cl.1) catches any dangling pin.
  - step: 8
    phase: pre-deploy
    action: mypy reports no error in scripts/agent_sdk/mcp_server.py (constraint; the Decision 161 ratchet has no baseline entry for it).
    command: >-
      out=$(bin/venv-python -m mypy scripts/agent_sdk/mcp_server.py 2>&1); printf '%s\n' "$out" | tail -1;
      ! printf '%s\n' "$out" | grep -E '^scripts/agent_sdk/mcp_server\.py:'
    expected: >-
      Exit 0: no error line names mcp_server.py. (mypy follows imports; on main today it reports one pre-existing error in
      src/common/ducklake_writes.py, which is out of scope and not this step's concern.)
    fix_if: Fix the type error in the port; never add a type-ignore or a ratchet baseline entry.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the standing full-tier validate_mypy_ratchet (Decision 161 cl.3; mcp_server.py's implicit baseline is 0),
      which step 12 runs before handoff and main-validate runs after merge; the fast tier's mypy output is informational only.
  - step: 9
    phase: pre-deploy
    action: >-
      Live stdio wire parity, branch vs origin/main on mcp 1.x. The script builds a throwaway origin/main worktree and uv venv
      outside the checkout, captures full JSON for five requests at four protocol versions from both servers, and diffs them
      allowing only the two declared differences (acceptance criterion 7). Precondition: this project's shared folder is
      mounted (/mnt/project-files/rec-3795-plan/evidence/ holds wire_parity.sh, wire_probe.py, wire_compare.py; recorded
      prototype run in wire-main-mcp1.json and wire-prototype-mcp2.json). The command pins all four mount scripts by the
      sha256 digests written in it, so the oracle cannot change unseen. wire_probe.py fails a reply slower than 120 s
      instead of hanging.
    command: >-
      (cd /mnt/project-files/rec-3795-plan/evidence/ && printf '%s  %s\n' fc2fe67dcfb82710cb16613df32437ce3778c84968eaf157e182f4eb9c64c42b wire_parity.sh e2fb27474a75c4d361c981eec9a1737cba11f0209e250c27229b34ac190e845a wire_probe.py eeba6beedab3282bd9fa8e98e2f359a54b2213d422b24495d79d9ec74f5a7980 wire_compare.py 8a6bfe103127c9e6d8dc787f2e8ee3621adac1fc9a156d56e711a5c6b5d8a722 litellm_probe.py | sha256sum -c)
      && cd "$(git rev-parse --show-toplevel)" && AWS_PROFILE=agent_platform bash /mnt/project-files/rec-3795-plan/evidence/wire_parity.sh
    expected: Four "OK" digest lines, then "wire parity OK - 4 protocol versions identical modulo the two declared differences"; exit 0.
    fix_if: >-
      A JSON-RPC error instead of isError means an exception escaped _call_tool_result; a text or payload difference is an
      undeclared wire change -- fix the port, never widen wire_compare.py's allowances. A digest FAILED means the oracle
      changed -- stop and report it, never re-pin. A "no reply within 120s" is a slow live reader -- rerun once, then RCA.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Live end-to-end test (by hand only, never a CI tier).
    command: AWS_PROFILE=agent_platform bin/venv-python -m pytest tests/test_agent_sdk_mcp_server.py::TestEndToEnd -q -m integration
    expected: 1 passed.
    fix_if: Fix the port; the test carries no credentials skip by design.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: pre-deploy
    action: >-
      litellm tool calls without the private flag, and the MCP bridge import (mock only, no network model call). Same mount
      precondition and digest pins as step 9.
    command: >-
      (cd /mnt/project-files/rec-3795-plan/evidence/ && printf '%s  %s\n' fc2fe67dcfb82710cb16613df32437ce3778c84968eaf157e182f4eb9c64c42b wire_parity.sh e2fb27474a75c4d361c981eec9a1737cba11f0209e250c27229b34ac190e845a wire_probe.py eeba6beedab3282bd9fa8e98e2f359a54b2213d422b24495d79d9ec74f5a7980 wire_compare.py 8a6bfe103127c9e6d8dc787f2e8ee3621adac1fc9a156d56e711a5c6b5d8a722 litellm_probe.py | sha256sum -c)
      && bin/venv-python -I /mnt/project-files/rec-3795-plan/evidence/litellm_probe.py | tee /dev/stderr | grep -cE ' OK( |$)' | grep -qx 5
    expected: >-
      Prints flag False sync OK, flag False async OK, flag True sync OK, flag True async OK and experimental_mcp_client
      import OK, and exits 0 (the probe itself always exits 0, so the trailing count of five OK lines is the verdict).
    fix_if: An ImportError means mcp 1.x is still installed -- bash bin/sync-deps.sh. A digest FAILED -- stop and report it, never re-pin.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: pre-deploy
    action: Full validation before handoff, attested for the pushed HEAD (backgrounded, 2 h limit, top-level session).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Exit 0; --verify-head attests HEAD.
    fix_if: >-
      A failure in scope -- fix on the branch and rerun from the start; a failure outside scope becomes a rec via
      scripts.ops_data_portal (Decisions 55, 59).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
  - step: 13
    phase: post-deploy
    action: >-
      A fresh CC-web session after merge has the new lock and the ducklake-reads tools, with no reconnect. Run in that
      session: the command below, then one tool call, mcp__ducklake-reads__recs_by_ids with ids "rec-3795" (the named
      read-back that the tools loaded).
    command: bin/venv-python -c "import importlib.metadata as m; print(m.version('mcp'))" && bin/venv-python -m scripts.agent_sdk.mcp_server < /dev/null; echo exit=$?
    expected: >-
      Prints a 2.x version and exit=0 (the server starts and exits cleanly on EOF); the recs_by_ids call returns rec-3795's
      row without a reconnect.
    fix_if: >-
      Two cases. (a) A 1.x version: the sync hook failed (it is advisory and exits 0) -- run bash bin/sync-deps.sh, then
      reconnect the server with /mcp. (b) A 2.x version but no mcp__ducklake-reads__ tools: the MCP launch likely ran before
      the SessionStart sync finished, on the snapshot's 1.x venv (inferred, not verified) -- reconnect with /mcp. On CC-web
      a restart boots the same stale snapshot, so if (a) or (b) recurs in a second fresh session, the operator rebuilds the
      cloud environment's snapshot (Project settings, Cloud environment) so it bakes the 2.x lock; the one check that proves
      it worked is this step passing in the next fresh session with no reconnect. Report which case occurred; neither case
      is a reason to revert.
    hermetic: false
  - step: 14
    phase: post-deploy
    action: >-
      Dependabot's stored "ignore this major version" on mcp is lifted. Operator-approved 2026-11-11: comment
      "@dependabot show mcp ignore conditions" on one open Dependabot pip PR, and "@dependabot unignore mcp" only if a 2.x
      ignore remains.
    command: >-
      echo 'VIA MCP: mcp__github__list_pull_requests(owner="otl-labs", repo="ontheloop", state="open"), keep the newest PR
      whose author is dependabot[bot] and whose head branch starts with dependabot/pip/; mcp__github__add_issue_comment on
      it with the body "@dependabot show mcp ignore conditions"; then mcp__github__issue_read(method="get_comments") on the
      same PR and print the id and body of the latest dependabot[bot] comment posted after yours'
    expected: >-
      The read-back shows Dependabot's reply (comment id and body) and the body lists no mcp ignore condition (or confirms the unignore). If no Dependabot pip PR is open, the report
      records UNPROVEN. (PR #980's reply was "OK, I won't notify you about version 2.x.x again, unless you re-open this PR",
      which names only a re-open, so the read-back matters.)
    fix_if: An ignore condition remains -- post the unignore comment (covered by the same approval) and read the reply back.
    hermetic: false
  - step: 15
    phase: post-deploy
    action: Bundled recs closed by the squash trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as rc; rows,_=rc.fetch_recs_by_ids(rc.make_reader(),['rec-3795','rec-2871']); print(sorted((r['id'], r['status']) for r in rows))"
    expected: Both closed.
    fix_if: The squash commit body lacks the Resolves trailer naming rec-3795 and rec-2871.
    hermetic: false
test_obligations:
  - source: scripts/agent_sdk/mcp_server.py
    behavior: The 2.x port's error paths -- typed error payload, withheld unexpected exception text, input validation (the round trip is step 1).
    verification_step: 2
    command: >-
      bin/venv-python -m pytest
      tests/test_agent_sdk_mcp_server.py::test_call_tool_error_carries_error_type
      tests/test_agent_sdk_mcp_server.py::test_unexpected_exception_text_never_reaches_the_client
      tests/test_agent_sdk_mcp_server.py::test_input_validation_error_is_an_error_result -q
    red_green_expectation: red before (main's decorator server raises AttributeError list_tools under mcp 2.x; the tests are absent on main), green after
  - source: tests/test_agent_sdk_mcp_server.py
    behavior: The harness drives the server only through the public mcp 2.x Client.
    verification_step: 3
    test_selector: tests/test_agent_sdk_mcp_server.py
    red_green_expectation: red before (the 5 pre-existing TestCreateServer tests that drive main's harness fail under mcp 2.x; TestEndToEnd is deselected by step 3), green after
  - source: tests/checks/deps/affected_tests/test_derivation.py
    behavior: A requirements.txt-only diff selects the MCP server tests.
    verification_step: 5
    test_selector: tests/checks/deps/affected_tests/test_derivation.py::test_requirements_lock_selects_mcp_server_tests_through_data_edge
    red_green_expectation: red before (the requirements.txt literal is absent from the server test file on main, so it is not selected), green after
  - source: requirements.in
    behavior: mcp declared >=2.3.0,<3 and jsonschema declared directly.
    verification_step: 5
    test_selector: tests/test_agent_sdk_mcp_server.py::test_jsonschema_is_a_direct_requirement
    red_green_expectation: red before (jsonschema undeclared), green after
  - source: requirements-fast.txt
    behavior: The mcp floor matches requirements.in and caps the next major.
    verification_step: 4
    test_selector: tests/test_import_governance.py::TestCheckLockfileSync::test_mcp_declaration_rejects_the_next_major
    red_green_expectation: red before (node absent), green after
  - source: requirements.txt
    behavior: The lock pins mcp 2.x and the declaration admits it.
    verification_step: 4
    test_selector: tests/test_import_governance.py::TestCheckLockfileSync::test_mcp_declaration_admits_the_compiled_pin
    red_green_expectation: red before (a 2.3.0 floor against main's 1.30 lock fails), green after
  - source: requirements-dev.txt
    behavior: The dev lock compiles against the new runtime constraint and litellm tool calls work without the flag.
    verification_step: 11
    command: bin/venv-python -I /mnt/project-files/rec-3795-plan/evidence/litellm_probe.py
    waiver_reason: Generated lock with annotation-only changes; litellm behaviour is proven by step 11's probe, not a unit test.
  - source: tests/test_import_governance.py
    behavior: The next-major guard is derived from the lock and cannot go vacuous.
    verification_step: 4
    test_selector: tests/test_import_governance.py::TestCheckLockfileSync::test_mcp_declaration_rejects_the_next_major
    red_green_expectation: red before (node absent), green after
  - source: config/agent/verification_registry/entries/deprecated/mcp-declaration-admits-compiled-pin.yaml
    behavior: The retired record leaves the live loader (the deprecated/ subtree is loader-excluded) and its claim moves to mcp-declaration-caps-next-major.
    verification_step: 4
    test_selector: tests/test_import_governance.py::TestCheckLockfileSync::test_mcp_declaration_rejects_the_next_major
    waiver_reason: A git mv of an unchanged record; the loader exclusion is structural and the replacement record is step 4's graduation.
  - source: tests/persona_contracts/test_schema_metaschema.py
    behavior: Reason-string reword only.
    verification_step: 3
    test_selector: tests/persona_contracts/test_schema_metaschema.py
    waiver_reason: A skip-reason string edit changes no behaviour; the file's own tests run unchanged in every tier.
constraints:
  - No pin outside the mcp closure moves (Decision 99 duckdb lockstep); relock with --upgrade-package mcp from main's lock.
  - Keep every pre-existing test class and node name in tests/test_agent_sdk_mcp_server.py (graduated shards, Decision 244).
  - No exception text other than the AgentToolError family's reaches a client (Decision 101).
  - Never loosen a test to get green (Decision 235); the only replaced test is the one the operator's sign-off names.
  - Test files stay under 500 SLOC (Decision 128); split into a mirror package, never raise, if one would cross.
  - mypy clean on mcp_server.py (the Decision 161 ratchet has no baseline entry for it; VP step 8).
  - The live checks (steps 9, 10, 11) run by hand with agent_platform; never in a CI tier.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout r1 FLAGS_FOUND (WARN 244 registry pin; NOTE 101 error text; SPIRIT 135 requirements-only diffs) -- all adopted. Decisions triaged: 205 of 205. Roadmap items intersected: 5; CONFLICT: 0; RELATED: 5. Serves: NS.1 3/5. CITE: 55, 81, 84, 99, 212, 235."
  - "Related, no change needed: 76, 128, 131, 143, 159, 161, 215, 239. The LiteLLM transport plan (PLAN-llm-client-litellm-transport, unwritten) owns removing its _skip_mcp_handler workaround: amend before its build if this merges first, else a follow-on rec. That planning work was told on 2026-11-11, and the implementation report repeats it."
  - "Why lowlevel, not the 2.x high-level server: the high-level server registers per-function tools with static signatures; this server's schemas are derived at runtime from describe() (Decision 81 cl.2)."
  - "Evidence (throwaway worktree, 2026-11-11): /mnt/project-files/rec-3795-plan/evidence/ -- prototype.diff (its error payload matches this plan, but it is NOT to be applied wholesale: it carries unrelated base-drift hunks in tests/persona_contracts/, keeps jsonschema.validate outside the catch-all try, and does not declare jsonschema), relock.diff (taken before jsonschema was declared), wire_parity.sh run on the prototype passed. Advisor: advisor-brief/ADVICE.md. Critique: CRITIQUE-r1.md to CRITIQUE-r5.md."
  - "mcp 2.x gotchas: pydantic attrs are snake_case (is_error, structured_content, input_schema), constructors accept camelCase aliases, wire stays camelCase; 2.x no longer validates input against inputSchema; mcp.Client(server) connects in-process."
  - "pip-compile --no-index cannot resolve in a CC-web container: run without it, then restore the header's command line byte-identical to main's. Sync the venv after the relock (bash bin/sync-deps.sh) before running tests."
  - "Rollout: the venv is baked into the CC-web environment snapshot and session_start_sync_deps heals it each session; it is advisory and exits 0 on failure. New code on mcp 1.x fails in create_server, so a session whose server starts on the snapshot's 1.x venv has no ducklake-reads tools -- either because the sync failed, or (inferred, not verified) because .mcp.json's launch ran before the SessionStart sync finished. A running session keeps its already-started server; a CC-web restart boots the same stale snapshot, so recovery is /mcp reconnect after sync, and the lasting fix is a snapshot rebuild (step 13 covers both cases)."
  - "Dependabot PR #980 was closed with '@dependabot ignore this major version'; GitHub documents that as lifted once the repo upgrades to that major; step 14 checks."
  - "Graduated shards naming scope test files, all KEPT unchanged (node ids preserved): agent-verb-server-fails-loud-on-describe-failure, agent-verb-surface-is-read-only, agent-verb-tools-carry-nonempty-description, agent-verb-tools-derived-from-describe, agent-verb-typed-error-mapping, lockfile-sync-commented-absurd-bump-fails, lockfile-sync-hash-without-whitespace-not-comment, lockfile-sync-live-declarations-all-parsed, lockfile-sync-unparseable-declaration-fails, mcp-declaration-test-has-no-pinned-1x-literal, mcp-lock-major-compatibility, mcp-server-hermetic-coverage, preflight-summary-unavailable-and-agent-facing, telemetry-read-clients-use-the-route, setup-cloud-affected-data-edge. Only mcp-declaration-admits-compiled-pin is retired (scope)."
  - "PR CI's fast tier installs requirements-fast.txt (a range), so --pre runs the latest 2.x while the full tier tests the lock; an upstream 2.x minor can red PR CI with no repo change (mcp 2.3.0's lowlevel server marks part of its surface provisional for 2.x minors). tests/validate/test_pytest_diff_runtime_dep_artifact.py already enforces fast-tier floor parity for the new jsonschema line."
  - "AgentToolError text still reaches the client as today: ReaderBoundaryError / ReaderUnavailableError carry up to 300 characters of the reader's response body; only unexpected exceptions become class-only."
  - "Related-work check: red_overlap verdict clear (no reds, 2026-11-11). Operator sign-off 2026-11-11 covers confirmation A (replace the major-two guard; the sign-off text said its record is re-pointed -- the critique showed Decision 244 cl.5 allows repair or retirement only, so the form was put back to the operator, who approved retire-and-replace on 2026-11-11) and B (step 14's Dependabot comments). Approval message ids live in the handoff note, never here."
  - "T4.10a (in_progress) is related context only: its c7 (one MCP server, consumed by the LiteLLM backend as an MCP client) is already met, so this plan claims no criterion of it."
  - "Not bundled: rec-3821 (fast-tier floor agreement check -- separate concern, seven registration surfaces); rec-4280 (future repo-tools MCP server, to be written against 2.x)."
