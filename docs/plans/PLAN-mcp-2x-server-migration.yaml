pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - /mnt/project-files/rec-3795-plan/evidence/ is mounted (steps 9, 11)
execution_steps:
  - 'Pre: main''s requirements.txt still pins mcp==1.30.0 and no open PR touches the scope files. Post: none.'
  - 'requirements.in and requirements-fast.txt: mcp>=2.3.0,<3 and jsonschema>=4.20.0; requirements-fast.txt header list gains jsonschema.'
  - 'Relock: .venv/bin/pip-compile --output-file=requirements.txt --strip-extras --upgrade-package mcp requirements.in, then .venv/bin/pip-compile --output-file=requirements-dev.txt --strip-extras requirements-dev.in; restore both header command lines to main''s text byte for byte; bash bin/sync-deps.sh. Post: step 6 passes.'
  - scripts/agent_sdk/mcp_server.py -- the 2.x port and _call_tool_result per the scope row.
  - tests/test_agent_sdk_mcp_server.py, tests/checks/deps/affected_tests/test_derivation.py, tests/test_import_governance.py, tests/persona_contracts/test_schema_metaschema.py -- per their scope rows.
  - 'Registry: git mv config/agent/verification_registry/entries/mcp-declaration-admits-compiled-pin.yaml config/agent/verification_registry/entries/deprecated/; graduate VP steps 1, 2, 4 and 5 with their graduation_check_id values.'
  - 'Size relief (Decision 128): measure the four modified test files'' SLOC after editing; if any crosses 500, split it into a mirror test package (Decision 131), never raise a budget.'
  - Run VP steps 1-11 until green; on unrecoverable failure stop and RCA (Decision 55).
  - 'Code review via a fresh code-review subagent; fix blocking findings and rerun VP steps 1-11. Expected weakening dispositions for validate_weakening_dispositions -- removed test_mcp_declaration_rejects_major_two: planned-change with the literal cite acceptance_criteria[3] (0-based; the node-ids-unchanged criterion naming this replacement); reworded importorskip in test_schema_metaschema.py: owned-skip (reason starts "env: " and cites rec-3795); harness assertion rewrites (request_handlers to mcp.Client, camelCase to snake_case attributes): refactor, each cite written as tests/test_agent_sdk_mcp_server.py::<test name>.'
  - 'Commit (flip implementation_declared to true; carry "Resolves: rec-3795, rec-2871" as its own paragraph), rebase on origin/main, run VP step 12 (full tier + validation_result --verify-head) on the committed clean HEAD (a blocking pre-handoff step, never a CI-only handoff), push, open the build PR, drive CI green, squash-merge with the Resolves trailer in the commit body.'
  - 'Report, as separate facts: what was implemented; VP results including the wire_parity.sh line and the litellm probe lines; the full-tier exit plus validation_result --verify-head for the pushed HEAD; structured postflight evidence (scripts.session.postflight --evidence); a reminder that the LiteLLM transport plan drops its _skip_mcp_handler workaround; the push, PR number, CI result and merge SHA; then run post-deploy steps 13-15 and report each read-back.'
rollback: >-
  Forward-fix only. Reverting the PR restores mcp 1.30 and the decorator server; sessions pick the old lock up through the
  SessionStart sync. If the environment snapshot was already rebuilt on the 2.x lock, the reverted server can start on 2.x
  before the sync heals the venv and fail in create_server -- the same recovery as step 13: /mcp reconnect after sync.
