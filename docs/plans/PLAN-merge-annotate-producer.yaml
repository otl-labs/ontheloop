  - "No new read shape: the telemetry_root_sessions named verb in the arrival check's window size and lookback, stopping at the first window that matches every key; the backfill dispatch is the one run that walks further."
  - "ports.yaml's edit is bound word for word by docs/plans/approved/merge-annotate-producer.yaml (Decision 246); telemetry_sessions.yaml's edits here are the populated_by strings and realization list above, mechanically fixed by validate_telemetry_field_realization R1-R8."
  - "Public repository (Decision 101): logs print counts and shas only; fixtures synthetic."
