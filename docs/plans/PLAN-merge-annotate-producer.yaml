schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: merge-annotate-producer
intent: >-
  Start the ci_annotate producer (rec-5270): twice a day, and on a dispatch that backfills, post-merge CI writes one
  telemetry_sessions annotate row per (captured root session, squash merge on main) from the squash commit's Claude-Session
  and Resolves trailers, carrying the merge sha (in external_ref), pr_url, rec_ids, the merge's diff stats and the
  attempt-1 conclusion of main's CI push run for that commit. It runs in its own workflow, so a link-writer failure
  never reads as an arrival red. A merge whose session has not arrived yet, or whose CI has not
  concluded, is picked up by a later run; re-sends of an identical row collapse at the writer.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-merge-annotate-producer.yaml
phase: >-
  T3.4 prerequisite capture (c1, "telemetry delta proves fix"): the baseline that keys a fix's merge to the sessions that
  produced it. Closes no exit criterion, so closes_criteria is empty.
closes_criteria: []
cites: [dec:88, dec:101, dec:162, dec:163, dec:199, dec:207, dec:210, dec:212, dec:213, dec:234, dec:236, dec:246, dec:250, dec:254, dec:267]
scope:
  - file: scripts/telemetry_capture/merge_annotate.py
    action: Create
    purpose: >-
      Pure build_links(commits, roots, ci_conclusions, diffstats) -> rows, plus a CLI (python -m
      scripts.telemetry_capture.merge_annotate --days N). For each first-parent squash commit on origin/main in the last N
      days (default 7): each distinct Claude-Session key (session_presence.normalise_key) matched to every root row with
      that harness_session_key gives one row: producer ci_annotate, parser_version 1, event_kind annotate, entity_ref and
      session_started_at the root's (session_started_at decoded from the root session_id with identity.decode_time_prefix,
      the envelope's held-root-key handoff; a decode failure skips that root), external_ref
      "<root entity_ref>:merge:<squash sha>#0/annotate", event_timestamp the squash committer time, pr_url from the
      subject's "(#N)" (a commit with none writes no row, since pr_url is required on annotate), rec_ids from Resolves trailers, files_changed / lines_added / lines_removed from git numstat of the
      commit against its first parent (a binary file counts as a file, zero lines), ci_outcome the conclusion of attempt 1
      of the CI workflow's own push run on main for that sha, cancelled included (attempt 1 so a re-run never changes a
      re-sent row; this is the commit's own run, not Decision 254's batch range verdict, deferred to rec-5295). A merge with
      no concluded CI run, or no matching root, writes nothing this run. Roots come from ONE telemetry_root_sessions read
      per run through the arrival check's reader function as rec-5248's fix leaves it (no new read shape). Rows go in one
      append call (chunked by transport.Limits) through transport.WriterClient; the writer Function URL is resolved inside the CLI (no second inline shell resolver).
      build_links stays pure: the GitHub reads (CI run attempts) live only in the CLI. Prints counts and shas only
      (Decision 101).
    new_imports: []
  - file: tests/telemetry_capture/test_merge_annotate.py
    action: Create
    purpose: >-
      rec-5270's acceptance. Synthetic commits, roots and CI conclusions: one row per (root, merge); two roots sharing a key
      give two rows with distinct external_refs; an unarrived key or unconcluded CI gives none; Resolves and "(#N)" parse;
      numstat with a binary file; a root whose id fails to decode is skipped; building twice yields identical rows; every
      row passes the writer's row rules (src.telemetry append prepare, no SQL); a commit without "(#N)" gives none; a
      cancelled attempt 1 is written as cancelled. Also a structure test of telemetry-merge-links.yml (triggers, job guard, and the sensor-liveness sweep's
      cron_period_seconds classifies its cron).
    new_imports: []
  - file: .github/workflows/telemetry-merge-links.yml
    action: Create
    purpose: >-
      Its own workflow (Decision 250 cl.4: the arrival check's red stays attributed to session_presence.py): a 12-hourly
      cron pinned to '47 */12 * * *' (a shape the sensor-liveness sweep's cron_period_seconds accepts, Decision 250 cl.3,
      minute apart from telemetry-arrival's 17), plus workflow_dispatch (input link_days, default 7; the one backfill dispatch
      after deploy walks reader-sized windows back to the earliest captured root, the stated exception to one read per
      run, Decision 88). The same job-level guard as telemetry-arrival (refuses the dispatcher bot, fork-safe), OIDC
      github_ci_branch role, permissions contents read, actions read, id-token write; a one-line run body. Its failure
      fails the run (an alarm, never a gate). At most two writer calls a day in steady state.
    new_imports: []
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: "Row telemetry-merge-links: {tier: not_a_gate, ci_rca: watched, owner: platform}, attributed to merge_annotate.py. 8 lines of headroom: one row fits."
    new_imports: []
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: The new workflow's measured run bodies (R3 workflow leg, Decision 162), each a single line.
    new_imports: []
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Extend the PR coupling row PC-09 (Decision 234 cl.4, Decision 212 cl.3) to name merge_annotate's two GitHub
      assumptions: the "(#N)" squash-subject convention and the Actions run-attempt read for ci_outcome. Adds a new
      amendment_log entry; at 498 of 500 lines, paid for by compacting older amendment_log rows (Decision 166).
    new_imports: []
  - file: config/telemetry/parser_versions.yaml
    action: Modify
    purpose: >-
      Register producer ci_annotate: golden_index tests/fixtures/merge_annotate/golden/index.json, current 1, history
      version 1 with its golden_digest (tests/fixtures/turn_capture_corpus.golden_digest over the corpus) per the header rule.
    new_imports: []
  - file: docs/contracts/telemetry_sessions.yaml
    action: Modify
    purpose: >-
      Bookkeeping only (the link columns' meaning is set by PLAN-merge-annotate-contract-reader): populated_by of rec_ids,
      pr_url, ci_outcome, files_changed, lines_added and lines_removed becomes "the ci_annotate producer, on annotate
      (merge link) rows, ..." (R8 prefix); realization.produced gains ci_annotate (the envelope columns plus those six);
      unproduced held:feedback-loop-gate keeps plan_slug and scope_drift_files (operator ruling 2026-11-17 releases the
      six); one top-level amendment_log row (the sibling plan leaves the file at 499 of 500 lines).
    new_imports: []
  - file: tests/fixtures/merge_annotate/golden/index.json
    action: Create
    purpose: >-
      The ci_annotate golden corpus index (purpose, normalised_out, cases), read by validate_telemetry_field_realization
      R4-R6: case files hold synthetic commits, roots and CI conclusions with expected_rows in which every credited column
      is non-null at least once; test_merge_annotate replays them through build_links.
    new_imports: []
bundled_recommendations: []
followon_recs: [rec-5295]
infrastructure_dependencies:
  - "None expected: github_ci_branch already invokes the telemetry writer and reader (oidc_ci_roles.tf). The build re-checks the writer invoke grant before relying on it; a missing grant stops for a Terraform PR, never a local apply."
acceptance_criteria:
  - "bin/venv-python -m pytest tests/telemetry_capture/test_merge_annotate.py -q passes (rec-5270's acceptance)."
  - "After the first scheduled run past deploy, each captured root session named by a merge's trailer in the window has exactly one link row per merge, and a second run inserts nothing."
  - "Link writes happen only on the schedule and dispatch, at most two writer calls a day in steady state."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The pure builder and its rules.
    command: bin/venv-python -m pytest tests/telemetry_capture/test_merge_annotate.py -q
    expected: exit 0
    fix_if: a row fails the writer's row rules, or a re-build differs
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: merge-annotate-link-rows
  - step: 2
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and the earlier steps carry the durable regressions.
  - step: 3
    phase: post-deploy
    action: First dispatch backfills; a second dispatch inserts nothing.
    command: >-
      Dispatch telemetry-merge-links.yml on main twice (mcp__github__actions_run_trigger; the first with the backfill
      link_days, the second with 7); read each run's merge_annotate summary line (submitted, inserted, collapsed, skipped).
    expected: first run inserted > 0 and failed 0; second run inserted 0, collapsed equal to the first run's submitted.
    fix_if: a GrainConflict (a row is not stable across runs) or a writer refusal
    hermetic: false
test_obligations:
  - source: scripts/telemetry_capture/merge_annotate.py
    behavior: one stable, rule-valid link row per (root, merge); nothing for unarrived or unconcluded merges
    verification_step: 1
    test_selector: tests/telemetry_capture/test_merge_annotate.py
    red_green_expectation: red before (module absent), green after
  - source: .github/workflows/telemetry-merge-links.yml
    behavior: schedule and dispatch triggers only, the dispatcher-bot guard, the CLI invocation
    verification_step: 1
    test_selector: tests/telemetry_capture/test_merge_annotate.py
    red_green_expectation: red before (workflow absent), green after; a structure test parses the workflow's triggers and job guard
  - source: config/ci_rca_taxonomy.yaml
    behavior: the new workflow has its taxonomy row
    verification_step: 2
    command: bin/venv-python -m scripts.validate
    waiver_reason: One mapping row; validate_ci_rca_taxonomy in the pre tier fails a workflow with no taxonomy row.
  - source: config/composite_action_body_baseline.yaml
    behavior: the new workflow's run bodies are measured
    verification_step: 2
    command: bin/venv-python -m scripts.validate
    waiver_reason: One baseline row; validate_composite_action_shell_bodies fails --pre for an inline workflow body with no row.
  - source: docs/contracts/ports.yaml
    behavior: PC-09 names the two new GitHub assumptions
    verification_step: 2
    command: bin/venv-python -m scripts.validate
    waiver_reason: Prose registration bound word for word by the approved-text sidecar; no runtime behavior reads it.
  - source: config/telemetry/parser_versions.yaml
    behavior: ci_annotate is a registered producer with its golden corpus
    verification_step: 2
    command: bin/venv-python -m scripts.validate
    waiver_reason: validate_telemetry_field_realization R2-R6 fails --pre for an unregistered producer or a corpus that misses a credited column.
  - source: docs/contracts/telemetry_sessions.yaml
    behavior: populated_by and realization credit ci_annotate for the six link columns
    verification_step: 2
    command: bin/venv-python -m scripts.validate
    waiver_reason: validate_telemetry_field_realization R1 and R8 fail --pre when populated_by and realization.produced disagree with the registry.
constraints:
  - "Build after PLAN-merge-annotate-contract-reader is deployed (an annotate row must not count as activity, and coverage_after must be waived), after rec-5248's read-timeout fix (reuse its read), and after the telemetry deploy hold lifts."
  - "No new wide read: one root-session read per run, through the arrival check's reader function; the one-off backfill dispatch is the only multi-window run."
  - "ports.yaml's edit is bound word for word by docs/plans/approved/merge-annotate-producer.yaml (Decision 246); telemetry_sessions.yaml's edits here are populated_by and realization bookkeeping, mechanically fixed by validate_telemetry_field_realization R1-R8."
  - "Public repository (Decision 101): logs print counts and shas only; fixtures synthetic."
  - "The trailer join in session_presence.py stays the arrival check; this producer never changes its verdict."
