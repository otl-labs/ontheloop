schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: merge-annotate-producer
intent: >-
  Start the ci_annotate producer (rec-5270): twice a day, and on a dispatch that backfills, post-merge CI writes one
  telemetry_sessions annotate row per (captured root session, squash merge on main) from the squash commit's Claude-Session
  and Resolves trailers, carrying the merge sha (in external_ref), pr_url, rec_ids, the merge's diff stats and the
  attempt-1 conclusion of main's CI push run for that commit. It runs in its own workflow, so a link-writer failure
  never reads as an arrival red. A merge whose session has not arrived yet, or whose CI has not concluded, is picked up
  by a later run; an identical re-send inserts nothing at the writer. Closes rec-5270.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-merge-annotate-producer.yaml
phase: >-
  T3.4 prerequisite capture (c1, "telemetry delta proves fix"): the baseline that keys a fix's merge to the sessions that
  produced it. Closes no exit criterion, so closes_criteria is empty.
closes_criteria: []
cites: [dec:88, dec:101, dec:162, dec:163, dec:199, dec:207, dec:210, dec:212, dec:213, dec:234, dec:236, dec:246, dec:250, dec:254, dec:267]
scope:
  - file: scripts/telemetry_capture/merge_annotate.py
    action: Create
    purpose: >-
      Pure build_links(commits, roots, ci_conclusions, diffstats) -> rows, plus a CLI (python -m
      scripts.telemetry_capture.merge_annotate [--days N] [--as-of SHA] [--dry-run] [--junit-xml PATH]). Merges: the
      first-parent commits of origin/main (or of --as-of) committed in the last N days (default 7, at most 120), read with
      session_presence.git_commits; keys from the commit body by session_presence._keys_in (the Claude-Session trailer, so
      the arrival check and this producer cannot diverge); pr_number from the subject by session_presence._PR, parsed in
      the CLI and passed into the builder. For each merge and each distinct key, every root row with that
      harness_session_key whose session_started_at (decoded from the root session_id with identity.decode_time_prefix, the
      envelope's held-root-key handoff; a decode failure skips that root) is at or before the squash committer time gives
      one row; a root started after the merge cannot have produced it and gives none (the writer's event_timestamp
      not_before session_started_at rule). Each row carries exactly: event_kind annotate, event_timestamp the squash
      committer time, session_started_at and entity_ref the root's, source_ordinal 0, external_ref
      "<root entity_ref>:merge:<squash sha>#0/annotate", producer ci_annotate, producer_version the module's
      PRODUCER_VERSION "1", parser_version PARSER_VERSION 1, rec_ids from Resolves trailers, pr_url
      https://github.com/<repo>/pull/<N> (a merge with no "(#N)" gives no row: pr_url is required on annotate),
      files_changed / lines_added / lines_removed from `git diff --numstat --no-renames <sha>^1 <sha>` (a binary file
      counts as a file with zero lines; --no-renames so git config cannot change the counts), and ci_outcome. ci_outcome:
      one GET of actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=<sha> per merge; a run with run_attempt 1
      gives its conclusion; a re-run (run_attempt > 1) gives the conclusion of runs/{id}/attempts/1; cancelled included;
      no concluded attempt 1 gives no row this run (attempt 1, so a re-run never changes a re-sent row; the commit's own
      run, not Decision 254's batch range verdict, deferred to rec-5295). Roots: the telemetry_root_sessions named verb
      through read_route's telemetry reader client (URL from DUCKLAKE_TELEMETRY_READER_URL or its SSM parameter), walked
      newest window first in config/telemetry/arrival.yaml's window_days (7) and stopping once every key is matched or
      the floor is passed: steady state the floor is max_lookback_days (56) before the run date, so a run reads 1 window
      when every key's root started in the last 7 days and at most 9 when a key is unmatched (the same bounded walk and
      bounds as the arrival check, which already runs it on every main CI completion); a backfill (N > 7) lowers the floor
      to N + 56 days. If rec-5248's fix changes the reader call that session_presence.run makes, this walk uses the same
      call. Each row runs src.telemetry.append.prepare_batch alone first (the pure half, no SQL, fixed placeholder tenant
      and project ids); a row it rejects is dropped and counted (rejected=), never sent, so one bad row cannot fail the
      batch. Rows go through transport.WriterClient (writer URL from DUCKLAKE_TELEMETRY_WRITER_URL or its SSM parameter,
      resolved in the CLI, no inline shell resolver) with transport.Limits built from transport's constants (link rows
      carry no blobs, so no describe call), chunked by transport.chunk: one append call per run while rows fit 2000 (a
      steady-state week is about 200 merges). The body is transport.append_body with component set to merge_annotate.
      project_ref from ci_pass.project_ref_home (Decision 224). --dry-run builds and prints counts, sends nothing. Prints
      one line "merge_annotate summary: merges=.. keys=.. windows_read=.. submitted=.. inserted=.. rejected=..
      skipped_no_root=.. skipped_no_ci=.. skipped_no_pr=.." and shas only (Decision 101). --junit-xml writes one testcase
      merge_links (file=scripts/telemetry_capture/merge_annotate.py) that fails, with the exception class as its type, on
      an unreadable source or a writer refusal, so ci-rca attributes a red to this module (Decision 250 cl.4); the CLI then
      exits 1.
    new_imports: []
  - file: tests/telemetry_capture/test_merge_annotate.py
    action: Create
    purpose: >-
      rec-5270's acceptance. Replays every golden case through build_links and compares expected_rows; checks the
      registry: ci_annotate's current equals PARSER_VERSION and its last history golden_digest equals
      tests/fixtures/turn_capture_corpus.golden_digest over the corpus. Builder cases: one row per (root, merge); two roots
      sharing a key give two rows with distinct external_refs; an unarrived key, an unconcluded CI run, a missing "(#N)",
      a root started after the merge and a root whose id fails to decode give none; Resolves parse; numstat with a binary
      file; a cancelled attempt 1 is written as cancelled; building twice yields identical rows; every row passes
      prepare_batch. CLI cases with fakes (git, GitHub, reader, WriterClient): a re-run commit reads attempts/1; a row
      prepare_batch rejects is dropped and counted while the rest are sent; a run whose rows fit one chunk makes exactly
      one WriterClient invoke and no describe; no rows makes none; the walk stops at the first window that matches every
      key and reads at most 9 when one stays unmatched; --dry-run sends nothing; the junit testcase names the module file
      and fails on a writer refusal. Workflow structure test of telemetry-merge-links.yml: schedule and workflow_dispatch
      triggers only, the dispatcher-bot and fork-safe job guard, cron_period_seconds classifies its cron, checkout
      fetch-depth 0, the pytest-junit upload, and the CLI invocation.
    new_imports: []
  - file: tests/fixtures/merge_annotate/golden/index.json
    action: Create
    purpose: >-
      The ci_annotate golden corpus index (purpose, normalised_out, cases [link_rows.json, no_rows.json]), read by
      validate_telemetry_field_realization R4-R6 and replayed by test_merge_annotate.
    new_imports: []
  - file: tests/fixtures/merge_annotate/golden/link_rows.json
    action: Create
    purpose: >-
      Synthetic commits, roots, numstat and CI conclusions whose expected_rows carry every credited column non-null at
      least once: two roots sharing a key, a Resolves trailer, a binary file, a cancelled attempt 1 and a re-run commit.
    new_imports: []
  - file: tests/fixtures/merge_annotate/golden/no_rows.json
    action: Create
    purpose: >-
      Synthetic inputs that give expected_rows []: an unarrived key, an unconcluded CI run, a subject with no "(#N)", a
      root started after the merge and a root id that fails to decode.
    new_imports: []
  - file: .github/workflows/telemetry-merge-links.yml
    action: Create
    purpose: >-
      Its own workflow (Decision 250 cl.4: the arrival check's red stays attributed to session_presence.py): a 12-hourly
      cron pinned to '47 */12 * * *' (a shape the sensor-liveness sweep's cron_period_seconds accepts, Decision 250 cl.3,
      minute apart from telemetry-arrival's 17), plus workflow_dispatch (inputs link_days, default 7, at most 120; as_of,
      optional sha). The same job-level guard as telemetry-arrival (refuses the dispatcher bot, fork-safe), OIDC
      github_ci_branch role (its ci_ssm_refresh_read covers both URL parameters; it already invokes the telemetry reader
      and writer), permissions contents read, actions read, id-token write; checkout fetch-depth 0; the venv install as
      telemetry-arrival's; one run body invoking the CLI with --junit-xml reports/pytest-junit.xml; and the "Upload pytest
      junit report (v2 fingerprint substrate)" step (if always(), artifact pytest-junit, retention 14 days). Its failure
      fails the run (an alarm, never a gate). Two writer calls a day in steady state.
    new_imports: []
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Row telemetry-merge-links: {tier: not_a_gate, ci_rca: watched, owner: platform, rationale: "ci_annotate merge link
      producer (rec-5270); junit names merge_annotate.py; files no rec itself."}. 8 lines of headroom: one row fits.
    new_imports: []
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: >-
      The workflow_run filter gains "telemetry-merge-links" after "telemetry-arrival" (validate_ci_rca_adjudication
      requires every watched row in the filter).
    new_imports: []
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: The new workflow's run bodies at their measured sizes (R3 workflow leg, Decision 162), the venv install and the CLI step.
    new_imports: []
  - file: docs/contracts/github-actions-evidence.yaml
    action: Modify
    purpose: >-
      One artifact_uploads row for the new pytest-junit upload (workflow .github/workflows/telemetry-merge-links.yml, its
      job, the upload step's name, artifact pytest-junit, retention_class ordinary_ci), the shape telemetry-arrival's row
      has; written flow-style on one line (the file is at 492 of 500).
    new_imports: []
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      structural_assumptions SA-07 (the arrival check's history, trailer and "(#N)" assumptions) extends to the producer,
      which imports those parsers, and to its Actions runs read for ci_outcome; one amendment_log row. PC-09 already
      records telemetry_sessions.pr_url as a GitHub pull-request pointer, so it is not edited. The placed file is 500 of
      500 effective lines; no compaction is bound, so a ports.yaml edit landing first means re-placing and re-approving.
    new_imports: []
  - file: config/telemetry/parser_versions.yaml
    action: Modify
    purpose: >-
      Register producer ci_annotate: golden_index tests/fixtures/merge_annotate/golden/index.json, current 1, history
      version 1 with its golden_digest (tests/fixtures/turn_capture_corpus.golden_digest over the corpus) per the header rule.
    new_imports: []
  - file: docs/contracts/telemetry_sessions.yaml
    action: Modify
    purpose: >-
      Bookkeeping only (the link columns' meaning is set by PLAN-merge-annotate-contract-reader). populated_by, one line
      each: rec_ids "the ci_annotate producer, on annotate (merge link) rows, from the squash commit's Resolves trailers.";
      pr_url "the ci_annotate producer, on annotate (merge link) rows, from the squash subject's (#N)."; ci_outcome "the
      ci_annotate producer, on annotate (merge link) rows, from attempt 1 of the commit's own CI push run."; files_changed,
      lines_added and lines_removed "the ci_annotate producer, on annotate (merge link) rows, from the squash commit's
      numstat against its first parent.". realization.produced gains ci_annotate: [event_kind, event_timestamp,
      session_started_at, source_ordinal, external_ref, entity_ref, producer, producer_version, parser_version, rec_ids,
      pr_url, ci_outcome, files_changed, lines_added, lines_removed]; unproduced held:feedback-loop-gate keeps plan_slug
      and scope_drift_files (operator ruling 2026-11-17 releases the six). One top-level amendment_log row (prose_improvement,
      semantic_break false: populated_by and realization bookkeeping, no meaning change); the sibling plan leaves the file
      at 499 of 500.
    new_imports: []
bundled_recommendations: [rec-5270]
followon_recs: [rec-5295]
infrastructure_dependencies:
  - "None expected: github_ci_branch already invokes the telemetry writer and reader and reads /agent-platform/* parameters (oidc_ci_roles.tf, oidc.tf ci_ssm_refresh_read), and it is already an admitted writer principal. The build re-checks the writer invoke grant before relying on it; a missing grant stops for a Terraform PR, never a local apply."
acceptance_criteria:
  - "bin/venv-python -m pytest tests/telemetry_capture/test_merge_annotate.py -q passes (rec-5270's acceptance)."
  - "After the backfill dispatch, a second dispatch with the same link_days and as_of inserts no row the first sent: its inserted is at most its submitted minus the first run's inserted, with rejected 0."
  - "Link writes happen only on the schedule and dispatch: two writer calls a day in steady state, no describe call."
  - "Declared residual: a root started more than 56 days before the run that first sees its merge eligible is not linked in steady state; a backfill dispatch with a larger link_days links it."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The pure builder, the CLI with fakes, the golden corpus, the registry entry and the workflow structure.
    command: bin/venv-python -m pytest tests/telemetry_capture/test_merge_annotate.py -q
    expected: exit 0
    fix_if: a row fails prepare_batch, a re-build differs, or the CLI makes more than one writer call for one chunk
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: merge-annotate-link-rows
  - step: 2
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and the earlier steps carry the durable regressions.
  - step: 3
    phase: post-deploy
    action: >-
      The backfill dispatch (link_days 120, as_of pinned to origin/main), run once the build is merged, the sibling plan
      is deployed and the telemetry hold allows. Run it backgrounded; it waits for the run to finish.
    command: >-
      git fetch -q origin main && A="$(git rev-parse origin/main)" && echo "$A" > /tmp/ma_asof &&
      gh api -X POST repos/otl-labs/ontheloop/actions/workflows/telemetry-merge-links.yml/dispatches -f ref=main
      -f "inputs[link_days]=120" -f "inputs[as_of]=$A" && sleep 15 &&
      R="$(gh api 'repos/otl-labs/ontheloop/actions/workflows/telemetry-merge-links.yml/runs?event=workflow_dispatch&per_page=1' --jq '.workflow_runs[0].id')" &&
      until [ "$(gh api "repos/otl-labs/ontheloop/actions/runs/$R" --jq .status)" = completed ]; do sleep 30; done &&
      gh run view "$R" --repo otl-labs/ontheloop --log | grep -o 'merge_annotate summary: .*' | tee /tmp/ma_run1
    expected: one summary line with inserted > 0 and rejected=0, and the run concluded success.
    fix_if: a GrainConflict or writer refusal (the junit testcase names it); rejected > 0 (read which rule from the run log)
    hermetic: false
  - step: 4
    phase: post-deploy
    action: A replay with the same link_days and as_of inserts nothing the first run sent.
    command: >-
      A="$(cat /tmp/ma_asof)" && gh api -X POST repos/otl-labs/ontheloop/actions/workflows/telemetry-merge-links.yml/dispatches
      -f ref=main -f "inputs[link_days]=120" -f "inputs[as_of]=$A" && sleep 15 &&
      R="$(gh api 'repos/otl-labs/ontheloop/actions/workflows/telemetry-merge-links.yml/runs?event=workflow_dispatch&per_page=1' --jq '.workflow_runs[0].id')" &&
      until [ "$(gh api "repos/otl-labs/ontheloop/actions/runs/$R" --jq .status)" = completed ]; do sleep 30; done &&
      gh run view "$R" --repo otl-labs/ontheloop --log | grep -o 'merge_annotate summary: .*' > /tmp/ma_run2 &&
      I1="$(grep -o 'inserted=[0-9]*' /tmp/ma_run1 | cut -d= -f2)" && S2="$(grep -o 'submitted=[0-9]*' /tmp/ma_run2 | cut -d= -f2)" &&
      I2="$(grep -o 'inserted=[0-9]*' /tmp/ma_run2 | cut -d= -f2)" && grep -q 'rejected=0 ' /tmp/ma_run2 &&
      [ "$I2" -le "$((S2 - I1))" ] && echo REPLAY_STABLE
    expected: REPLAY_STABLE (rows that arrived or concluded between the runs may insert; nothing the first run sent does).
    fix_if: a GrainConflict (a row field is not stable across runs) or the inequality fails
    hermetic: false
  - step: 5
    phase: post-deploy
    action: rec-5270 is closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import
      fetch_recs_by_ids,make_reader;r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-5270']);
      st=r[0]['status'] if r else None;assert not m and st=='closed', (m, st);print('REC_CLOSED')"
    expected: REC_CLOSED.
    fix_if: An open rec means the Resolves trailer was missing; close it through the portal with the merge sha as evidence.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/telemetry_capture/merge_annotate.py
    behavior: one stable, rule-valid link row per (root, merge); nothing for unarrived, unconcluded, PR-less or later-root merges; one writer call per chunk
    verification_step: 1
    test_selector: tests/telemetry_capture/test_merge_annotate.py
    red_green_expectation: red before (module absent), green after
  - source: .github/workflows/telemetry-merge-links.yml
    behavior: schedule and dispatch triggers only, the dispatcher-bot guard, fetch-depth 0, the junit upload, the CLI invocation
    verification_step: 1
    test_selector: tests/telemetry_capture/test_merge_annotate.py
    red_green_expectation: red before (workflow absent), green after; a structure test parses the workflow
  - source: config/ci_rca_taxonomy.yaml
    behavior: the new workflow has its taxonomy row
    verification_step: 2
    command: bin/venv-python -m scripts.validate
    waiver_reason: One mapping row; validate_ci_rca_taxonomy and validate_ci_rca_adjudication in the pre tier fail a workflow with no row or a watched row outside ci-rca.yml's filter.
  - source: .github/workflows/ci-rca.yml
    behavior: the workflow_run filter names telemetry-merge-links
    verification_step: 2
    command: bin/venv-python -m scripts.validate
    waiver_reason: One filter entry; validate_ci_rca_adjudication fails --pre when a watched taxonomy row is absent from the filter.
  - source: config/composite_action_body_baseline.yaml
    behavior: the new workflow's run bodies are measured
    verification_step: 2
    command: bin/venv-python -m scripts.validate
    waiver_reason: One baseline row per body; validate_composite_action_shell_bodies fails --pre for an inline workflow body with no row.
  - source: docs/contracts/github-actions-evidence.yaml
    behavior: the new pytest-junit upload is registered
    verification_step: 2
    command: bin/venv-python -m scripts.validate
    waiver_reason: One registry row; validate_actions_evidence fails a workflow artifact upload with no artifact_uploads row.
  - source: docs/contracts/ports.yaml
    behavior: SA-07 names the producer's assumptions
    verification_step: 2
    command: bin/venv-python -m scripts.validate
    waiver_reason: Prose registration bound word for word by the approved-text sidecar; no runtime behavior reads it.
  - source: config/telemetry/parser_versions.yaml
    behavior: ci_annotate is a registered producer with its golden corpus
    verification_step: 1
    test_selector: tests/telemetry_capture/test_merge_annotate.py
    red_green_expectation: red before (no ci_annotate entry), green after; the registry test checks current and golden_digest
  - source: docs/contracts/telemetry_sessions.yaml
    behavior: populated_by and realization credit ci_annotate for the six link columns
    verification_step: 2
    command: bin/venv-python -m scripts.validate
    waiver_reason: validate_telemetry_field_realization R1 and R8 fail --pre when populated_by and realization.produced disagree with the registry.
