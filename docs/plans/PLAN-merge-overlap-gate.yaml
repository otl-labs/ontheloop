schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: merge-overlap-gate
intent: >-
  Refuse an agent merge when main has changed, since the PR's base, a file the PR also changes, until the branch is
  updated and PR CI re-runs on the combined tree. On 2026-11-03 #1799 merged about 14 hours after its last CI run, on
  top of #1805, which made the same 4-byte AGENTS.md shrink and the same S1 budget edit (16955 -> 16951); git folded
  the identical budget-line edits, the combined tree measured 16947 and main went red (rec-4866, rec-4869). The gate
  is a best-effort pre-merge check: the post-merge full tier stays the authority (TAP-style). Its authority is a new
  numbered Decision (amends Decision 83); the long-term model is rec-4874.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-merge-overlap-gate.yaml
phase: >-
  ci_rca (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Preventive half of
  rec-4869 (Track B, Critical, product_regression); its corrective landed as #1823 (2215125d).
scope:
  - file: scripts/session/merge_overlap.py
    action: Create
    purpose: >-
      Forge-neutral git logic keyed on refs, never a PR number (Decision 234 cl.4): overlap(root, head_ref,
      base_ref="origin/main") -> Verdict(kind CLEAR|OVERLAP|UNAVAILABLE, merge_base, behind, files). merge_base = git
      merge-base base_ref head_ref; files = the sorted intersection of `git diff --name-only merge_base base_ref` and
      `git diff --name-only merge_base head_ref`. CLEAR when empty (behind may be > 0); OVERLAP with the shared paths;
      UNAVAILABLE on any git failure or unresolvable ref (never CLEAR). It never fetches; callers fetch. CLI: `python
      -m scripts.session.merge_overlap check --head REF [--base REF]` prints one line, `MERGE-OVERLAP <KIND>
      behind=<k> base=<sha12> files=<a,b>`, and exits 0 CLEAR, 1 OVERLAP, 2 UNAVAILABLE.
  - file: .claude/hooks/merge_overlap_gate.py
    action: Create
    purpose: >-
      GitHub-specific plumbing adapter only (the Decision 203 hook-adapter pattern): reads the PreToolUse payload; for
      tool_name mcp__github(-full)?__(merge_pull_request|enable_pr_auto_merge) whose tool_input owner/repo names this
      checkout's origin repository, it runs `git fetch --no-tags origin main refs/pull/<pullNumber>/head` (one
      --deepen=500 retry on a shallow clone), then merge_overlap.overlap(FETCH'd PR head, "origin/main"). CLEAR -> exit
      0, no output. OVERLAP -> exit 2, stderr "merge-overlap-gate: OVERLAP: main changed <files> since this PR's base
      <sha12> (<k> commits behind). Update the branch (mcp__github__update_pull_request_branch), wait for the CI-green
      wake on the new head (subscribe_pr_activity, never poll), then merge." A fetch failure, UNAVAILABLE, a missing pullNumber or malformed JSON on a
      merge tool -> exit 2 naming the reason. Any other repository or tool -> exit 0. No override argument or variable.
  - file: .claude/hooks/merge_overlap_gate.sh
    action: Create
    purpose: >-
      Fail-closed shim in the handoff_evidence_gate.sh pattern: a payload not naming a merge tool exits 0 without
      starting Python; otherwise it runs the adapter under `timeout -k 5 45` through $ROOT/bin/venv-python and maps
      every exit other than 0 or 2 (crash, timeout, missing interpreter) to exit 2 with "merge-overlap-gate
      unavailable (<rc>)". No GITHUB_ACTIONS carve-out.
  - file: .claude/settings.json
    action: Modify
    purpose: >-
      Append one PreToolUse group, matcher "^mcp__github(-full)?__(merge_pull_request|enable_pr_auto_merge)$", command
      `bash "$CLAUDE_PROJECT_DIR/.claude/hooks/merge_overlap_gate.sh"`. Existing groups unchanged and in order.
  - file: .claude/hooks/hooks.json
    action: Modify
    purpose: >-
      Regenerated, never hand-edited: `bin/venv-python .claude/hooks/plugin_hooks.py render`, so claude.ai project
      threads get the gate through the plugin (28 of the last 40 merges came from claude/project-thread-* branches).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the approved-text sidecar docs/plans/approved/merge-overlap-gate.yaml: block decision-entry (the new
      Decision, {{N}} = the next free number at build, 244 at planning; {{DATE}} = the build date) and block
      decision-83-annotation (a dated Update line after Decision 83's Related line). The decisions index is a
      generated companion (sanction rows), never hand-edited.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Mechanism shape only; the authority, the Decision 100 deferral and the revisit conditions live in the new
      Decision. push_pr_ci_merge_flow's green-confirmation step names the gate (Decision {{N}}) and its remedy (update
      the branch, wait for the CI-green wake, merge). merge_step_coverage names the hook files, matcher and exit
      codes, and the residual owners: GitHub-UI merges and different-file conflicts (rec-4874, rec-4451), the updated
      head carrying only --pre evidence (rec-4085), merge on red (rec-4080), auto-merge enabled before checks finish
      (rec-4874), agent merges by gh or REST from a shell (rec-2827). Add the three new paths to referenced_repo_paths; contract_version 10 -> 11 with one amendment_log
      row. Net added effective lines at most 8 (headroom 15 at planning base 9593de0b; three unbuilt plans also edit this file).
  - file: tests/test_session_merge_overlap.py
    action: Create
    purpose: >-
      Fixture-repo tests of merge_overlap (local bare origin): not behind -> CLEAR; behind with disjoint files -> CLEAR
      with behind > 0; behind with a shared file -> OVERLAP listing exactly the shared paths; branch updated by merging
      main in -> CLEAR; unresolvable ref -> UNAVAILABLE; CLI line format and exit codes 0/1/2.
  - file: tests/hooks/test_merge_overlap_gate.py
    action: Create
    purpose: >-
      Runs the shim as the harness does (subprocess, payload on stdin) against a fixture repo whose origin carries
      refs/pull/N/head: OVERLAP -> exit 2 and stderr names the files and update_pull_request_branch; CLEAR -> exit 0,
      empty stdout and stderr; enable_pr_auto_merge gated the same; fetch failure, malformed JSON or a missing
      pullNumber on a merge tool -> exit 2; another repository -> exit 0; a non-merge tool -> exit 0; adapter crash
      (broken interpreter path) -> exit 2. Both .claude/settings.json and .claude/hooks/hooks.json register the shim
      on PreToolUse with the exact matcher.
  - file: tests/checks/prose/test_s1_concurrent_merge_premerge.py
    action: Create
    purpose: >-
      rec-4869's acceptance node, test_second_identical_shrink_merge_is_refused_until_updated: replays the incident in
      a fixture repo. From one base, branch A and branch B each shrink AGENTS.md by 4 bytes on different lines and each
      set S1 root_ambient_load_set 16955 -> 16951 in config/prose_budgets.yaml; A merges to main; overlap() on B
      returns OVERLAP naming AGENTS.md and config/prose_budgets.yaml; after main is merged into B it returns CLEAR.
bundled_recommendations:
  - rec-4869
  - rec-4866
followon_recs:
  - rec-4874
  - rec-4873
infrastructure_dependencies: []
acceptance_criteria:
  - rec-4869's acceptance command exits 0, and rec-4866's acceptance holds at the merge sha.
  - scripts.session.merge_overlap reads OVERLAP for the real #1799 head (7f07dfa9) against caebb40f^, naming AGENTS.md and config/prose_budgets.yaml, and CLEAR for the real #1823 head (5a1ecc75) against 2215125d^.
  - The shim denies (exit 2) merge_pull_request and enable_pr_auto_merge on OVERLAP, UNAVAILABLE, fetch failure, malformed input and adapter failure, and allows CLEAR, other repositories and other tools.
  - .claude/settings.json and the rendered .claude/hooks/hooks.json register the shim with the exact matcher; hooks.json equals the render.
  - git-ops.yaml names the gate (citing the new Decision), its remedy and its residual owners; contract_version is 11.
  - docs/DECISIONS.md carries the new Decision and the Decision 83 annotation exactly as the sidecar approves (approved_text verify exits 0), and the warehouse holds the Decision row after the post-merge backfill.
  - Before the plugin update, a claude.ai project thread fetches origin main and refs/pull/N/head; after it, a real merge_pull_request call on a stale PR is refused by the hook before GitHub is contacted, in a fresh top-level session and a fresh project thread.
  - rec-4869 and rec-4866 read closed after the squash merge (Resolves trailer).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the merge_overlap logic tests.
    command: bin/venv-python -m pytest tests/test_session_merge_overlap.py -q
    expected: exit 0, all nodes pass; red before (module absent).
    fix_if: a node fails, or OVERLAP lists a path only one side changed
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: merge-overlap-verdicts
  - step: 2
    phase: pre-deploy
    action: Run the shim and adapter through the harness payload path, and the registration nodes.
    command: bin/venv-python -m pytest tests/hooks/test_merge_overlap_gate.py -q
    expected: exit 0, all nodes pass; red before (shim absent).
    fix_if: any deny path exits 0 (fails open), or the matcher differs between settings.json and hooks.json
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: merge-overlap-gate-fails-closed
  - step: 3
    phase: pre-deploy
    action: Run rec-4869's acceptance node (incident replay).
    command: bin/venv-python -m pytest tests/checks/prose/test_s1_concurrent_merge_premerge.py::test_second_identical_shrink_merge_is_refused_until_updated -q
    expected: exit 0, 1 passed; red before (file absent).
    fix_if: the replay reads CLEAR before B is updated, or stays OVERLAP after it
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: merge-overlap-s1-incident-replay
  - step: 4
    phase: pre-deploy
    action: Replay the gate on the real incident commits (network fetch of the PR refs).
    command: >-
      git fetch -q origin refs/pull/1799/head refs/pull/1823/head &&
      bin/venv-python -m scripts.session.merge_overlap check --head 7f07dfa9 --base caebb40f^ ;
      bin/venv-python -m scripts.session.merge_overlap check --head 5a1ecc75 --base 2215125d^
    expected: >-
      the first line reads OVERLAP, behind=24, with files AGENTS.md and config/prose_budgets.yaml; the second reads
      CLEAR, behind=1
    fix_if: '#1799 reads CLEAR (the rule misses the incident) or #1823 reads OVERLAP (false positive on a disjoint PR)'
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Depends on a network fetch of refs/pull/N/head; step 3 graduates the same property hermetically.
  - step: 5
    phase: pre-deploy
    action: Bind the docs/DECISIONS.md edits to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug merge-overlap-gate --base origin/main
    expected: exit 0; both blocks match
    fix_if: any word differs from the sidecar; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg already enforces the
      sidecar on every PR declaring this plan.
  - step: 6
    phase: pre-deploy
    action: >-
      Operator or coordinator step, before the build PR merges (Decision 83: the gate fails closed, so the fetch it
      needs must be proven where most merges run): in a claude.ai project thread on this repository, run the command.
    command: git fetch --no-tags origin main refs/pull/1799/head && git rev-parse FETCH_HEAD && echo FETCH-OK
    expected: prints 7f07dfa9a6c03285917d12e4cd977c81984d66a9 and FETCH-OK
    fix_if: >-
      the fetch fails in a project thread: do not merge the build; send a plan-defect report (the gate would wedge
      project-thread merges) -- a design change, never an override
    hermetic: false
  - step: 7
    phase: pre-deploy
    action: Re-run the hook render-parity and registration-order guards this change touches.
    command: bin/venv-python -m pytest tests/hooks/test_plugin_hooks.py tests/hooks/test_capture_hook_registration.py -q
    expected: exit 0
    fix_if: render parity fails (re-run plugin_hooks.py render, never hand-edit hooks.json)
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Existing standing guards already selected by --pre for these files.
  - step: 8
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): bin/venv-python -m scripts.validate --pre in the
      foreground (exit 0), then this command as one backgrounded Bash call with a 2 h limit from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: --pre exited 0 first (recorded); then this command exits 0 for HEAD
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun from the start; a failure only in another
      open red's tests (for example rec-4872) is not this build's to fix: log it and follow the implement skill's go/no-go
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Operator step: update the ontheloop plugin on claude.ai (Customize > Plugins). Then, in a fresh top-level session
      and in a fresh project thread, call mcp__github__merge_pull_request(owner="otl-labs", repo="ontheloop",
      pullNumber=1799, merge_method="squash"). #1799 is already merged, so a hook that did not fire yields only
      GitHub's harmless not-mergeable error; a working hook refuses first. This also proves the fetch reaches origin
      in each surface.
    command: >-
      printf '%s' '{"tool_name":"mcp__github__merge_pull_request","tool_input":{"owner":"otl-labs","repo":"ontheloop","pullNumber":1799}}'
      | bash .claude/hooks/merge_overlap_gate.sh; echo "rc=$?"
    expected: >-
      the shell probe prints a merge-overlap-gate: OVERLAP line and rc=2; the real MCP call in each surface returns
      the same hook refusal, not a GitHub API error
    fix_if: >-
      the MCP call reaches GitHub (the hook is not wired in that surface: settings.json for top-level, the plugin
      update for project threads); a fetch failure in a surface is the new Decision's false-refusal-or-wedge condition, never an
      override
    hermetic: false
  - step: 10
    phase: post-deploy
    action: After the squash merge, ETL the new Decision to the warehouse and prove its row exists.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md && bin/venv-python -c "import re; from pathlib
      import Path; n=int(re.search(r'^## Decision (\\d+): An agent merge is refused',
      Path('docs/DECISIONS.md').read_text(encoding='utf-8'), re.M).group(1)); from scripts.ops_portal.decisions import
      _fetch_decision_from_reader as g; assert g(f'dec-{n}'), n; print('POST_MERGE_OK', n)"
    expected: exit 0 and the marker with the Decision number
    fix_if: a missing row after a clean backfill means the entry did not parse; re-run step 5 against main
    hermetic: false
  - step: 11
    phase: post-deploy
    action: Confirm both bundled recs closed.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      print([r['status'] for r in fetch_recs_by_ids(make_reader(), ['rec-4869', 'rec-4866'])[0]])"
    expected: prints ['closed', 'closed']
    fix_if: >-
      still open after the closure job: read its log; a Decision 186 refusal means the closure_artifact stamp is
      missing or not fix-bound (re-stamp, then merge_step recover); a Decision 201 refusal routes per git-ops
      resolves_trailer
    hermetic: false
test_obligations:
  - source: scripts/session/merge_overlap.py
    behavior: CLEAR only when main and the PR share no changed file since the merge-base; OVERLAP names the shared paths; any git failure is UNAVAILABLE.
    verification_step: 1
    test_selector: tests/test_session_merge_overlap.py
    red_green_expectation: red before (module absent), green after.
  - source: .claude/hooks/merge_overlap_gate.py
    behavior: Denies merge and auto-merge calls on OVERLAP, UNAVAILABLE, fetch failure and malformed input; allows CLEAR, other repos and tools.
    verification_step: 2
    test_selector: tests/hooks/test_merge_overlap_gate.py
    red_green_expectation: red before (adapter absent), green after.
  - source: .claude/hooks/merge_overlap_gate.sh
    behavior: Maps every adapter failure mode to exit 2 for merge-tool payloads.
    verification_step: 2
    test_selector: tests/hooks/test_merge_overlap_gate.py
    red_green_expectation: red before (shim absent), green after.
  - source: .claude/settings.json
    behavior: Registers the shim on PreToolUse with the exact merge-tool matcher.
    verification_step: 2
    test_selector: tests/hooks/test_merge_overlap_gate.py
    red_green_expectation: red before (no registration), green after.
  - source: .claude/hooks/hooks.json
    behavior: Equals the render of .claude/settings.json.
    verification_step: 7
    test_selector: tests/hooks/test_plugin_hooks.py::test_the_committed_hooks_file_is_the_render_of_the_settings
    waiver_reason: >-
      Existing render-parity guard; step 2's registration node also reads hooks.json directly for the new matcher.
constraints:
  - terraform/github is not touched; strict_required_status_checks_policy stays false and admin bypass stays (Decision 83); operator GitHub-UI merges are unaffected.
  - Never hand-edit .claude/hooks/hooks.json; regenerate it with plugin_hooks.py render.
  - The gate fails closed and has no agent override (Decision 203 cl.3 pattern); a false block is fixed in the checker.
  - The gate reads git only, never the GitHub API, and writes nothing but fetched refs; merge_overlap.py never names a PR number (Decision 234).
  - "The Decision text and the Decision 83 annotation are operator-approved; place them exactly (sidecar), never re-word."
  - "git-ops.yaml records the mechanism only; the authority, deferral and revisit conditions stay in the Decision."
  - "git-ops.yaml is NEAR_CAP (485 of 500 effective lines at planning base 9593de0b): measure headroom on main at build; compact, never raise."
  - No rescue agents or workaround loops (Decision 55).
