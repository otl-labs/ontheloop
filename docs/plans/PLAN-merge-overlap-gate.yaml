  - "Advice reconciled: Fable consult (NRSR, bors, Zuul, GitHub merge queue, Uber SubmitQueue) -> adopt server-side update-branch remedy, adapt the overlap predicate as a labelled best-effort presubmit, reject local rebase + full tier. Sonnet scout on Anthropic's Scion (anthropic.com/research/redesigning-source-control) -> no global merge-queue lock at agent scale; post-merge and pre-deploy testing with automated bisect and revert; quotes via a summarising fetch. Operator chose the overlap gate plus rec-4874 (TAP-style promotion) over a merge queue on scalability grounds."
