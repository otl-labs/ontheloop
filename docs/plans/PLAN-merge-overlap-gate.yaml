pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "tests/test_session_merge_overlap.py, tests/hooks/test_merge_gate.py, tests/checks/prose/test_s1_concurrent_merge_premerge.py: write the nodes; run them on main's tree and confirm they fail (red-before)."
  - "scripts/session/merge_overlap.py: create per scope."
  - ".claude/hooks/merge_gate.py and .claude/hooks/merge_gate.sh: create per scope (chmod +x the shim)."
  - ".claude/settings.json: append the PreToolUse group; then run bin/venv-python .claude/hooks/plugin_hooks.py render."
  - "docs/DECISIONS.md: place sidecar blocks decision-entry and decision-83-annotation exactly, filling {{N}} with the next free number on main and {{DATE}} with the build date; regenerate the decisions index with its generator."
  - "docs/contracts/git-ops.yaml: measure headroom on main first (bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-merge-overlap-gate.yaml). Relief when the net add exceeds it (contracts class valves, config/structural_size_budgets.yaml): compact older amendment_log rows per the contract's own compaction convention, or carry the new text on fewer, longer physical lines (the contracts class allows up to 2,000 characters a line, Decision 166 cl.3); every residual in the scope row stays declared in git-ops.yaml, and nothing moves to the Decision; never a budget raise. Then edit per scope; bump contract_version and append the amendment_log row."
  - "The plan declares no weakening disposition: if validate_weakening_candidates lists any candidate (the pinned test_handoff_evidence_gate.py edit should produce none), stop and send a plan-defect report rather than adding a disposition."
  - "Commit locally (no push) before VP step 9: --verify-head attests only a full run that started on a clean, committed tree."
  - "Execute Verification Plan steps 1-5 and 7-9; ask the coordinator or operator for step 6 before merge; loop until pass; on an unrecoverable failure stop and send a plan-defect report (Decision 55)."
  - "The implementation commit message carries 'Resolves: rec-4869, rec-4866', and merge_pull_request passes an explicit commit_message carrying it (git-ops.yaml resolves_trailer). The build PR merges only with the operator's OK on the final diff (hooks are always-ask). If the new gate refuses its own merge, update the branch, `git pull --ff-only` the updated head, re-run premerge on it, wait for the CI-green wake, then merge."
  - "Before merge, scripts.session.merge_step premerge previews both recs' acceptance. If rec-4866's literal grep (S1 16947) previews fails because an S1 ratchet landed first, do not weaken it: route per git-ops resolves_trailer (fix-forward, or strengthen via update_rec with the operator's word, Decision 235), or drop rec-4866 from the trailer by plan amendment and close it later through merge_step recover."
  - "After merge: run step 11, ask the operator for the plugin update, then run steps 10 and 12; then update_rec rec-4451's context with one sentence naming .claude/hooks/merge_gate.py and scripts/session/merge_overlap.py as the seam its predicate extends, rec-2827's with one sentence recording that it owns the gate's gh/REST and former-repository-name residuals, and rec-4080's and rec-4755's with one sentence each naming this hook as the merge_pull_request seam to extend rather than a parallel hook."
  - "Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state (scripts.session.github_readiness; unknown is unproven, never ready); parent validator evidence (VP 9 full tier plus bin/venv-python -m scripts.checks.validation_result --verify-head for the pushed HEAD); structured postflight evidence (write the scripts.session.postflight_evidence.CATEGORIES JSON in the scratchpad, then bin/venv-python -m scripts.session.postflight --evidence <file>); the real outcome - push, build PR, CI green by event-driven wake (never polled), merge SHA."
  - "Report: what was implemented, verification results, the four closure-evidence facts, merge SHA, steps 6 and 10-12 results."
work_areas: []
rollback: >-
  Revert the hook, settings.json, hooks.json, git-ops.yaml, ports.yaml and test changes of the build PR (not
  docs/DECISIONS.md), or just remove the PreToolUse group and re-render hooks.json; merges return to today's ungated
  flow. The rollback PR's own merge passes through the live gate: if the gate is wedging, the operator's GitHub-UI
  merge is the valve.
  Project threads keep the installed plugin's hooks.json until the operator updates the plugin again; the Decision
  stays and gains a dated annotation recording the rollback.
