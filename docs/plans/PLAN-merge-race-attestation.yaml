constraints:
- >-
  No heavy dependency and no budget change in the fast tier (Benjamin, 2026-10-18): requirements-fast.txt,
  _FAST_TIER_BUDGET_SECONDS and the Decision 153/208 constants are untouched.
- >-
  No waiver, marker, env var or flag skips the check or the stamp (Decision 163 point 1). The only skips are a
  non-pull_request run, a bot-authored PR (event payload pull_request.user.type == "Bot") and an exempt-only PR
  (Decision 203 cl.4's exempt set, read from origin/main through scripts.session.handoff_evidence, never
  re-implemented). The check does not read branching_topology.agent_branch_prefixes, so it adds no consumer of that
  fact (its reversal trigger (c)).
- >-
  Decision 135: the selection manifest is never read and the PR's own selection is never recomputed. The one
  derivation the check runs is over the base-moved delta (attested tree -> merge tree), only when the deferral map
  defers a test, through the lru_cached graph --pre already built, bounded by DELTA_ENTRY_LIMIT = 75 entries; above
  it the rule is base_moved_large_delta. Nothing persists across runs.
- >-
  git-ops.yaml stays at or under 490 effective lines through amendment_log compaction only (Decision 166 contracts
  relief valve); never split it or raise its budget. The skill edit is the two "--stamp" tokens.
- >-
  terraform/github is untouched: strict_required_status_checks_policy stays false (Decision 83) and the required
  checks stay pr-validate and terraform-validate.
- >-
  The check must never raise: every git, JSON or derivation error resolves to a fail-closed rule.
- >-
  Do not create tests/checks/verification/test_validate_deferred_test_attestation.py::TestScope::test_skipped_populations_have_declared_coverage:
  it is rec-4452's acceptance and must stay red until that rec is worked.
- No rescue agents or workaround loops (Decision 55).
context:
- >-
  Decision-scout verdict: FLAGS_FOUND (round 1: WARN 135, 166, 43; NOTE 217; SPIRIT 163 -- all pivoted; round 2 on
  the revision: NOTE 181, 203; SPIRIT 163 -- all folded in). CITE: 163, 203, 135, 73, 83, 217, 208, 166, 168, 169,
  170, 128, 181. Decisions triaged: 175 of 175. Roadmap items intersected: 6; CONFLICT: 0; RELATED: 6.
- "gates: decision-scout=FLAGS_FOUND (resolved); plan-critique=PROCEED after 3 round(s); round 3 autonomous, its non-blocking J1-J7, J9 folded in"
- >-
  Cause (rec-4427 resolution; /mnt/project-files/rec-4427/ADVICE.md section 3g): #1554's full tier ran before #1551
  added the test; pr-validate deferred it (duckdb), so the combination merged unvalidated. rec-4372 was the same
  class through the apply-time ZIP assert (fixed by #1536's input attribution).
- >-
  Base rate (40 merged agent PRs #1523-#1562, pr-validate logs): 13 deferred a heavy-dependency test, 7 of them while
  behind main at CI time. Replay of this rule: 4 of the 7 fail (#1554, #1551, #1537, #1536), 3 pass; strict tree
  equality would fail all 7. Derivation cost, warm: 0.1-0.13s per delta entry (2.9s for #1554's 41 entries).
- >-
  Residuals and owners. rec-4451: main moving after the pr-validate merge ref (the same replay on the merged trees
  fails 3 more); a merge-time re-check of every PR, or a Decision amending 83 and 217 cl.1-2. rec-4452: bot-authored
  PRs (dependabot; the Decision 217 cl.3 executor App, keeping Decision 163 point 3), Decision 203 exempt-only PRs,
  and affected-set cap residue (needs a second full derivation per PR, 3-20s). rec-4453: tests that skip at run time
  on an excluded dependency never reach the deferral map. rec-4087: result=fail passes. rec-4085: CI cannot verify an
  agent-written trailer, nor that each deferred test executed in the attested run. rec-4429: delta-derivation recall
  gaps. Inherited: merge on red via the admin bypass (rec-4080).
  Operator-authored PRs share the agents' identity and are in scope; Benjamin works through agent sessions only.
- >-
  Trailer, not PR body: a trailer travels atomically with the pushed head, and a GitHub update-branch merge commit
  carries none, so it fails as missing_attestation; a PR body is read from the event payload and goes stale on edit.
  The amend is a message-only rewrite before push, not the signature-chasing amend AGENTS.md forbids. The push gate's
  deny hint (handoff_evidence.py) keeps naming only what the push gate checks; the check's failure text names the
  stamp.
- >-
  Rollout: once merged, every open PR's next pr-validate runs the check (CI runs the merge ref's code); a deferring
  PR then needs one `--verify-head --stamp` and a force-with-lease push if its evidence still attests HEAD.
- >-
  Routing (Decision 167): no new numbered Decision; pr-validate already holds the refusal authority (Decision 73), so
  the rule lands as a git-ops.yaml (Class D) clause with an amendment_log entry. The parallel red-main recovery
  Decision touches DECISIONS.md and the ci-rca surfaces, not these files. A base_moved red is a pr-validate red under
  the coordinator's three-reds stop rule.
