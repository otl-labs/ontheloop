execution_steps:
- >-
  attestation_trailer.py: ATTESTATION_TRAILER = "Full-Tier-Attestation"; a frozen Attestation(tree, result,
  heavy_deps: tuple[str, ...]); format_attestation() -> "tree=<sha> result=<pass|fail> heavy_deps=<a,b|none>";
  parse_attestation(value) with a strict full-match regex (tree 40-64 lowercase hex, result pass|fail, heavy_deps
  none or comma-joined [A-Za-z0-9_.-]+), None otherwise; read_attestation(rev, *, cwd) from `git log -1
  --format=%(trailers:key=Full-Tier-Attestation,valueonly,separator=%x0A) <rev>`, last non-empty value wins, None on
  any git error or parse failure.
- >-
  attestation_trailer.py: STAMP_RULES and stamp_head(rule, *, cwd=None) -> str, in this order: rule not ok or
  failed_run -> "not_stamped"; current branch main or master -> "on_main" (the postflight run_pre_commit_sanity
  precedent; the subprocess amend bypasses never_on_main.py); `git status --porcelain` non-empty -> "dirty_tree";
  heavy_deps = sorted importable names from scripts.checks._pytest_diff._excluded_heavy_import_names() (lazy import;
  find_spec is not None, the inverse of the predicate that defers them); target already on HEAD ->
  "already_stamped"; else pipe `git log -1 --format=%B HEAD` through `git interpret-trailers --if-exists replace
  --trailer "Full-Tier-Attestation: <value>"` into `git commit --amend --allow-empty -F -` (cwd defaults to
  _common.ROOT; the user's signing config untouched; no --no-verify): non-zero -> "amend_failed"; HEAD^{tree} changed
  -> "tree_changed"; else "stamped". validation_result.main(): --stamp is valid only with --verify-head
  (parser.error otherwise); print verify-head's rule, then stamp_head(rule); exit 0 only when the rule is ok and the
  stamp outcome is stamped or already_stamped.
- >-
  validate_deferred_test_attestation.py: a pure evaluate(*, root=None, environ=None, affected_by=None) ->
  Verdict(rule, deferred, detail, warning), plus the @registry.register wrapper that prints the "=== Deferred-test
  attestation ===" header, the verdict and, on failure, the remediation ("rebase onto origin/main, run the full tier,
  `--verify-head --stamp`, push --force-with-lease"), and declares registry.skipped / examined / failure_detail; a
  failing rule appends the constant label "Deferred-test attestation". DELTA_ENTRY_LIMIT = 75. DEFERRAL_ATTEST_RULES
  in evaluation order: not_pull_request, bot_authored (skips); nothing_deferred (vacuous pass, read before any
  merge-ref plumbing so a checkout change can only affect deferring PRs); unresolvable_head, not_merge_ref (fails);
  exempt_only (skip); missing_attestation, stale_attestation, dependency_not_attested (fails);
  attested_tree (pass); base_moved_unknown_deferrals, base_moved_large_delta, base_moved_affects_deferred (fails);
  base_moved_unaffected (pass).
- >-
  Evaluation detail (every git call with cwd=root): GITHUB_EVENT_NAME must be pull_request. Payload from
  GITHUB_EVENT_PATH: pull_request.user.type == "Bot" -> bot_authored. D = the deferral map's `deferred` mapping (file
  -> missing dep); missing, unparseable or not a mapping -> unknown. D empty and known -> nothing_deferred, with no
  derivation. pull_request.head.sha unreadable -> unresolvable_head; `git rev-parse HEAD^2` must equal it, else
  not_merge_ref. Every path of `git diff --name-only --no-renames HEAD^1 HEAD` exempt under
  scripts.session.handoff_evidence's base-ref clause (_base_ref_clause / _is_exempt, imported lazily; an unreadable
  clause exempts nothing) -> exempt_only. Then the trailer rules in order, recording result=fail as the verdict's
  warning. Merge tree = HEAD^{tree}; equal to the attested tree -> attested_tree. Else unknown D ->
  base_moved_unknown_deferrals. Else entries from `git diff --name-status --no-renames <attested> <merge>`; more than
  DELTA_ENTRY_LIMIT -> base_moved_large_delta; else affected_by(entries, root) (default _affected_by:
  stdout-suppressed derive_affected_tests(entries, repo_root=root), selected plus its manifest's deferred, a fallback
  counting as reaching all of D); overlap with D -> base_moved_affects_deferred with the overlap and `git log
  --oneline -10 <head>..HEAD^1` in detail; else base_moved_unaffected.
- >-
  _manifest.py: the Entry with a comment naming its placement reasons. config/ci_rca_taxonomy.yaml: the row.
  postflight.py: run_verify_head's argv gains "--stamp"; update its docstring and run_auto's sequence line.
- >-
  git-ops.yaml: compact the amendment_log entries to single-line flow mappings first (parsed values unchanged; VP 7),
  then the edits named in its scope row. The deferral_attestation clause lists DEFERRAL_ATTEST_RULES verbatim, states
  DELTA_ENTRY_LIMIT with its measured basis, and carries revisit triggers: executor concurrency above 1 (Decision 217
  concurrency-raised), rec-4451 landing, a measured base_moved re-run rate above 1 in 4 deferring PRs over 20 merges,
  or evidence that attestations are unreliable (ADVICE section 5). enforcement_coverage rows: {surface: "pr-validate run whose
  tier deferred a heavy-dependency test", status: mechanical, enforced_by:
  "tests/checks/verification/test_validate_deferred_test_attestation.py::TestMergeRace"}; residual rows for "main
  moving after the pr-validate merge ref (CI-green -> merge window)" (residual_owner rec-4451), "bot-authored and
  Decision 203 exempt-only PRs, and affected-set cap residue" (rec-4452), "tests that skip at run time on an excluded
  dependency, invisible to the deferral map" (rec-4453), "a result=fail attestation" (rec-4087), "an agent-written
  attestation CI cannot independently verify, including whether each deferred test executed rather than skipped in
  the attested run" (rec-4085), and "delta-derivation recall gaps (fixture-mediated importers) giving a false
  base_moved_unaffected" (rec-4429).
- >-
  SKILL.md, implement.md and the antidrift test as scoped: test_handoff_full_tier_runs_after_commit_and_rebase asserts
  `--verify-head --stamp` on the Commit Flow line and keeps the commit < rebase < full tier < verify-head < push
  order; the new test_implement_surfaces_name_the_stamped_verify_head asserts closure item 4 and implement.md's
  one-full-tier paragraph name `--verify-head --stamp`.
- >-
  Tests: both new modules build repos through tests/fixtures/attestation_repos.py (commit.gpgsign=false in the repo
  config); the deferral map under <root>/logs/debug; environ and the payload file injected; affected_by injected,
  except one test that exercises _affected_by against this repository's own tree (an edited test file selects
  itself). No cross-test imports.
- Execute Verification Plan steps 1-10 -- loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
- >-
  Closure sequence (implement skill), each outcome reported on its own: code-review gate; github_readiness;
  implementation_declared true; retrospective evidence; commit; fetch and rebase onto origin/main; VP step 10 (full
  tier, then --verify-head --stamp); push; PR; CI by subscription; squash merge; VP step 11 (a) and (b).
- 'Report: what was implemented and the verification results.'
