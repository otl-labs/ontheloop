schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: merge-race-attestation
intent: >-
  Close the semantic merge race behind rec-4427 (and rec-4372's class): when the PR tier defers a selected test on a
  heavy dependency, the PR must prove that a Decision 163 local full-tier run covered the tree actually being merged,
  with no heavy dependency and no budget change in the fast tier (Benjamin, 2026-10-18). It is a per-PR proof of which
  tree the full tier saw, not a merge lock: a green PR gate then means the deferred tests were covered on the
  merge-ref tree, within the residuals the context names.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-merge-race-attestation.yaml
phase: >-
  Soft-warn exception category ci_rca: the preventive Benjamin approved on 2026-10-18
  (cmsg_012XgaFy8VaDQbxP5D8nC9582aMXdziyBaRT37TC9eFAia, "go" to step 3 of
  cmsg_012XgaFy8VaDQbxP5D8nC9586gEaMGN1gZkPQkvRphdSBx; "write the plan",
  cmsg_012XgaFy8VaDQbxP5D8nC958LjGjUQiANWAGvxQqUe2Sbc; the heavy-dependency narrowing notified in
  cmsg_012XgaFy8VaDQbxP5D8nC958XWXFcpnEx6FZYgsFV1HVKy). Names no tier_item, so the Tier Item Freshness Gate is
  skipped; closes no exit criterion.
scope:
- file: scripts/checks/verification/validate_deferred_test_attestation.py
  action: Create
  purpose: >-
    The PR-tier check. In a pull_request run of a non-bot PR that is not Decision 203 exempt-only and whose
    _pytest_diff deferral map (written earlier in the same run) defers a selected test, require the PR head commit's
    Full-Tier-Attestation trailer to name the head tree, to list every deferred heavy dependency, and to cover the
    merge-ref tree: equal to it, or (deferral map known, delta at most 75 entries) no deferred module reached by the
    diff between them per the repo's own affected-set derivation. Rule vocabulary DEFERRAL_ATTEST_RULES; no override
    of any kind.
- file: scripts/checks/verification/_manifest.py
  action: Modify
  purpose: >-
    Register validate_deferred_test_attestation pre=True with no pre_globs (any diff can defer) and no full_segment
    (its inputs exist only after the pytest_diff scaffold of a PR run; precedent validate_diff_coverage). The three
    entries here whose pre_globs carry scripts/checks/validation_result.py also gain
    scripts/checks/attestation_trailer.py, which validate_pre_glob_closure requires once validation_result.py imports it.
- file: scripts/checks/deps/_manifest.py
  action: Modify
  purpose: >-
    One glob line: validate_presubmit_tool_pin_escalation's pre_globs gain scripts/checks/attestation_trailer.py, the
    fourth entry whose pre_globs carry scripts/checks/validation_result.py (validate_pre_glob_closure; scope amendment
    from the build, 2026-10-18).
- file: scripts/checks/attestation_trailer.py
  action: Create
  purpose: >-
    The attestation trailer vocabulary in one cohesive module both sides import: ATTESTATION_TRAILER, Attestation,
    format/parse/read_attestation, and stamp_head(rule), which amends HEAD's message with the trailer (tree
    unchanged) when verify-head's rule is ok (result=pass) or failed_run (result=fail), refuses on main/master or a
    dirty index or worktree, and names every outcome. Imports no validation_result code, so there is no cycle.
- file: scripts/checks/validation_result.py
  action: Modify
  purpose: >-
    --stamp becomes a modifier of --verify-head (valid only with it): after verify_head(), call
    attestation_trailer.stamp_head(rule) and print its outcome; exit 0 only when verify-head is ok and the stamp is
    on HEAD. --verify-head alone is unchanged and read-only.
- file: scripts/session/postflight.py
  action: Modify
  purpose: run_verify_head's argv gains --stamp, so the --auto handoff stays in step with git-ops handoff_sequence.
- file: docs/contracts/git-ops.yaml
  action: Modify
  purpose: >-
    handoff_sequence.description, push_pr_ci_merge_flow.steps and rebase_phase_distinction.commit_flow_time name
    `--verify-head --stamp`; a handoff_sequence.deferral_attestation clause (trailer grammar, scope and skips, rules
    list equal to DEFERRAL_ATTEST_RULES, the 75-entry delta bound, identity posture, no override, revisit triggers);
    push_pr_ci_merge_flow names the stamp in both its push step and its red-fix step; enforcement_coverage gains one
    mechanical row and six residual rows; referenced_repo_paths gains the two new modules; contract_version
    8 -> 9 with a new amendment_log entry. Stays at or under its current 490 effective lines (Decision 166 contracts
    class, limit 500) by compacting the existing amendment_log entries into single-line flow mappings, the class's
    declared relief valve, with every entry's parsed value unchanged.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: "Registration row: validate_deferred_test_attestation: code_regression."
- file: .claude/skills/implement/SKILL.md
  action: Modify
  purpose: >-
    Two tokens: the IMPLEMENTATION Commit Flow line becomes `bin/venv-python -m scripts.checks.validation_result
    --verify-head --stamp`, and closure item 4's "then `--verify-head` exit 0" becomes "then `--verify-head --stamp`
    exit 0" (+16 bytes; 24 bytes of headroom under config/prose_budgets.yaml's 35402).
- file: .claude/commands/implement.md
  action: Modify
  purpose: >-
    The one-full-tier rule paragraph's "followed by `--verify-head`" becomes "followed by `--verify-head --stamp`"
    (S3 is measured-only, Decision 127).
- file: tests/fixtures/attestation_repos.py
  action: Create
  purpose: >-
    Shared builder for temporary git repos (signing off, a base, an attested head carrying the trailer, a main-moved
    commit, refs/remotes/origin/main, a `git merge --no-ff` merge commit checked out as HEAD, evidence files) used by
    both new test modules, so neither duplicates it or nears the 500-SLOC limit.
- file: tests/checks/verification/test_validate_deferred_test_attestation.py
  action: Create
  purpose: >-
    Every rule against fixture repos; contract parity (rules list, the 75-entry bound and the three handoff surfaces).
- file: tests/checks/verification/test__manifest.py
  action: Modify
  purpose: Pin the entry as pre-only, ungated and absent from the full tier.
- file: tests/checks/test_attestation_trailer.py
  action: Create
  purpose: >-
    Mirror test of the trailer module: stamp, idempotence, stale replacement, refusals (unattested rule, main, dirty
    tree), amend failure, failed_run, parse and read.
- file: tests/checks/test_validation_result.py
  action: Modify
  purpose: >-
    TestStampCli only (the file is at 442 of 500 SLOC): --stamp with --verify-head calls stamp_head and exits 0 only
    when both succeed; --stamp alone is a usage error.
- file: tests/session/postflight/test_auto.py
  action: Modify
  purpose: TestVerifyHeadSeam pins the --stamp argv.
- file: tests/test_workflow_skill_antidrift.py
  action: Modify
  purpose: >-
    The Commit Flow assertion requires the verify-head line to carry --stamp, still before git push; closure item 4
    and implement.md's one-full-tier paragraph name `--verify-head --stamp`.
bundled_recommendations: []
followon_recs:
- rec-4451
- rec-4452
- rec-4453
infrastructure_dependencies: []
acceptance_criteria:
- >-
  In a pull_request run of a non-bot, non-exempt-only PR whose deferral map defers a test, the check fails when the
  head commit carries no Full-Tier-Attestation trailer, when the trailer names a tree other than the head's, when a
  deferred heavy dependency is absent from its heavy_deps, when main moved by more than 75 delta entries since the
  attested tree, and when main's smaller movement reaches a deferred module per the affected-set derivation; it passes
  when the attested tree equals the merge tree or main's movement reaches no deferred module.
- >-
  A missing or unreadable deferral map requires an exact tree match; a run whose map defers nothing is a vacuous pass
  with no derivation; a non-pull_request run, a bot-authored PR and a PR whose every changed path is in Decision 203's
  exempt set are declared skips; a result=fail attestation passes with a printed warning (identity gate, Decision
  203). The selection manifest is never read and the PR's own selection is never recomputed: the only derivation
  call receives the base-moved delta, asserted by a named test.
- >-
  Replayed on PR #1554's real head (d8319764) with its real CI base (5f355f10) and its four duckdb deferrals, a
  stamped head fails with base_moved_affects_deferred naming tests/common/test_ducklake_event_verification_verbs.py;
  merged with its attested base (064802ca) it passes with attested_tree. The replay command asserts both.
- >-
  `bin/venv-python -m scripts.checks.validation_result --verify-head --stamp` amends HEAD with one trailer naming
  HEAD's tree, the run's result and the importable excluded heavy dependencies, leaves the tree byte-identical
  (Decision 203's push gate still passes), is idempotent, replaces a stale trailer, refuses on main/master and on a
  dirty index or worktree, names a failed amend, and exits 0 only when verify-head is ok and the stamp is on HEAD.
- >-
  git-ops.yaml's handoff_sequence.description, push_pr_ci_merge_flow's push and red-fix steps and
  rebase_phase_distinction.commit_flow_time, the implement skill's Commit Flow and closure item 4, implement.md and
  postflight --auto all name `--verify-head --stamp` (asserted by tests); the contract's deferral_attestation rules
  list equals DEFERRAL_ATTEST_RULES; git-ops.yaml stays at or under 490 effective lines with every pre-existing
  amendment_log entry parsing to the same value; the skill stays within its prose budget.
- >-
  The fast tier gains no dependency and no budget change. The check runs a derivation only when the map defers a
  test and the merge tree differs from the attested tree, bounded by the 75-entry limit; VP 8 prints the warm cost on
  #1554's real delta and on a delta at the bound, under a 27s (10% of Decision 208's 270s non-test budget) ceiling.
  Planning-time measurement: 2.8s and 8.5s, in 7 of 40 sampled PRs.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    The incident shape: main gains a commit editing a deferred test after the attested run; the check fails and names
    the module and the commit.
  command: >-
    bin/venv-python -m pytest
    tests/checks/verification/test_validate_deferred_test_attestation.py::TestMergeRace::test_main_commit_touching_a_deferred_test_fails
    -q
  expected: >-
    Exit 0, 1 passed. Red before: the node is absent on the plan-only tree (pytest exit 4).
  fix_if: >-
    The node fails with attested_tree: the merge-ref tree is read from the head instead of HEAD; with
    base_moved_unaffected: the delta is not diffed attested tree -> merge tree, or the injected derivation result is
    not intersected with the deferred set.
  hermetic: true
  graduation: graduate
  graduation_check_id: deferred-test-attestation-fails-merge-race
- step: 2
  phase: pre-deploy
  action: Unrelated main movement after the attested run passes (no re-run tax when nothing deferred is reached).
  command: >-
    bin/venv-python -m pytest
    tests/checks/verification/test_validate_deferred_test_attestation.py::TestMergeRace::test_main_commit_not_affecting_deferred_tests_passes
    -q
  expected: Exit 0, 1 passed. Red before (pytest exit 4).
  fix_if: >-
    The node fails with base_moved_affects_deferred: the derivation's own selection is not filtered to the deferred
    set.
  hermetic: true
  graduation: graduate
  graduation_check_id: deferred-test-attestation-passes-unaffected-move
- step: 3
  phase: pre-deploy
  action: >-
    Every other rule: scope skips (non-PR, bot, exempt-only), vacuous pass without a derivation, missing/stale
    attestation, heavy deps, failed-run warning, unresolvable head, non-merge checkout, unknown map requiring an exact
    tree, the 75-entry delta bound, the derivation receiving only the delta (never the PR's own diff), corrupt
    artifacts never raising, the default derivation on this repository; and
    contract parity of the rules list, the bound and the git-ops handoff surfaces (handoff_sequence, both
    push_pr_ci_merge_flow steps, commit_flow_time) naming `--verify-head --stamp`.
  command: >-
    bin/venv-python -m pytest tests/checks/verification/test_validate_deferred_test_attestation.py::TestScope
    tests/checks/verification/test_validate_deferred_test_attestation.py::TestAttestation
    tests/checks/verification/test_validate_deferred_test_attestation.py::TestUnknownState
    tests/checks/verification/test_validate_deferred_test_attestation.py::TestContract -q
  expected: Exit 0, all collected nodes pass. Red before (pytest exit 4).
  fix_if: >-
    Fix the rule the failing node names; never relax an assertion. A parity failure means git-ops.yaml and the module
    drifted: the module is the source for the rules list and the bound, and the contract names the stamped command
    verbatim.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Class selectors over the module this plan creates: the --pre pytest_diff affected set and the full tier run the
    whole module on every change to it; steps 1 and 2 graduate the two merge-race verdicts.
- step: 4
  phase: pre-deploy
  action: The stamp amends HEAD with the trailer and keeps the tree byte-identical.
  command: >-
    bin/venv-python -m pytest
    tests/checks/test_attestation_trailer.py::TestStamp::test_stamp_amends_head_with_attestation_keeping_tree -q
  expected: Exit 0, 1 passed. Red before (pytest exit 4).
  fix_if: >-
    The tree differs after the amend: the clean-tree refusal did not run before the amend. The trailer is missing:
    interpret-trailers output was not passed to commit -F.
  hermetic: true
  graduation: graduate
  graduation_check_id: validation-result-stamp-keeps-tree
- step: 5
  phase: pre-deploy
  action: >-
    The rest of the stamp surface: refusals (unattested rule, main/master, dirty tree), a failed amend, failed_run,
    idempotence, stale replacement, parse and read; the --verify-head --stamp CLI and its exit codes; the postflight
    argv.
  command: >-
    bin/venv-python -m pytest tests/checks/test_attestation_trailer.py tests/checks/test_validation_result.py::TestStampCli
    tests/session/postflight/test_auto.py::TestVerifyHeadSeam -q
  expected: >-
    Exit 0, all collected nodes pass. Red before: the new module and class are absent (pytest exit 4) and
    TestVerifyHeadSeam::test_passes_through_zero fails on the argv without --stamp.
  fix_if: Fix the stamp rule, exit code or argv the failing node names.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Includes a whole-file re-run of a module this plan creates (vp-red-before.yaml hermetic_authoring (v)); the unit
    tiers run these modules whole, and step 4 graduates the tree-preservation property the push gate depends on.
- step: 6
  phase: pre-deploy
  action: >-
    Registration, skill and command wording and the taxonomy row are wired; git-ops.yaml and the skill stay inside
    their size budgets.
  command: >-
    bin/venv-python -m pytest
    tests/checks/verification/test__manifest.py::TestVerificationManifest::test_deferred_test_attestation_runs_pre_only_and_ungated
    tests/test_workflow_skill_antidrift.py::test_handoff_full_tier_runs_after_commit_and_rebase
    tests/test_workflow_skill_antidrift.py::test_implement_surfaces_name_the_stamped_verify_head
    tests/checks/ci_guards/test_validate_ci_rca_taxonomy_accounting.py::TestCiRcaTaxonomyAccountingDeclaration::test_real_tree_is_recorded_enforced
    -q && bin/venv-python -c "from pathlib import Path; from scripts.checks.structural._classify import
    effective_lines; n = effective_lines(Path('docs/contracts/git-ops.yaml').read_text(encoding='utf-8')); s =
    Path('.claude/skills/implement/SKILL.md').stat().st_size; print('git-ops effective', n, 'skill bytes', s); assert
    n <= 490, n; assert s <= 35402, s" && bin/venv-python -c "from scripts.checks import registry; f = [];
    registry.resolve('validate_pre_glob_closure')(f); assert not f, f"
  expected: >-
    Exit 0: 4 passed, then one line with git-ops effective lines at or under 490 and the skill at or under 35402
    bytes, then the pre-glob closure audit's PASS line (about 6s). Red before: the manifest and wording nodes are absent and the ordering node fails (no --stamp on the
    verify-head line).
  fix_if: >-
    The taxonomy node fails naming the new check: the function_to_category row is missing. The closure audit names an
    entry: add scripts/checks/attestation_trailer.py to that entry's pre_globs. git-ops over 490: compact
    more amendment_log entries; never split the file or raise its budget. Skill over budget (another merge spent the
    headroom): reword byte-neutrally, never raise the budget.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Wiring and size pins: the registry sequence tests, validate_ci_rca_taxonomy, validate_structural_size_limits and
    validate_prose_limits already guard these as standing checks in both tiers.
- step: 7
  phase: pre-deploy
  action: >-
    The amendment_log compaction changed no entry: every entry on origin/main parses to the same value on this
    branch, and the branch adds exactly one new entry at the top.
  command: >-
    bin/venv-python -c "import subprocess, yaml; from pathlib import Path; old =
    yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:docs/contracts/git-ops.yaml'], capture_output=True,
    text=True, check=True).stdout)['amendment_log']; new =
    yaml.safe_load(Path('docs/contracts/git-ops.yaml').read_text(encoding='utf-8'))['amendment_log']; assert new[1:]
    == old, 'compaction changed an entry'; print('amendment_log entries unchanged:', len(old), '+1 new')"
  expected: Exit 0 printing the unchanged-entry count plus one.
  fix_if: >-
    The assertion fails: a compacted entry was reworded or re-ordered; restore its text exactly. Run this before the
    merge only (on main, origin/main already carries the new entry).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    It compares the branch against origin/main as it stands before the merge, a transient repo state: after the merge
    origin/main already carries the new entry, so a standing row would fail by construction.
- step: 8
  phase: pre-deploy
  action: >-
    Measure the check's real fast-tier cost (Decision 208 non-test half) on #1554's actual CI-base delta
    (064802ca..5f355f10, 41 entries) and on a delta at the 75-entry bound taken from recent main history, with the
    import graph already built as --pre leaves it.
  command: >-
    bin/venv-python -c "import subprocess, time; from scripts.checks import _common; from
    scripts.checks.verification import validate_deferred_test_attestation as m; root = _common.ROOT; e = lambda a, b:
    [(ln.split('\t')[0][:1], ln.split('\t')[1]) for ln in subprocess.run(['git', 'diff', '--name-status',
    '--no-renames', a, b], capture_output=True, text=True, check=True, cwd=root).stdout.splitlines() if '\t' in ln];
    m._affected_by([('M', 'scripts/checks/_common.py')], root); big = next(x for k in range(5, 80) if len(x := e(f'origin/main~{k}', 'origin/main')) >= m.DELTA_ENTRY_LIMIT)[:m.DELTA_ENTRY_LIMIT]; assert len(big) == m.DELTA_ENTRY_LIMIT, len(big); out = []
    ; [(t0 := time.monotonic(), m._affected_by(x, root), out.append((len(x), round(time.monotonic() - t0, 2)))) for x in
    (e('064802ca0cc9918e59e7a273ed63e0159dfb297b', '5f355f10b98473a98b47a1d70d30bdffd0b7c350'), big)]; print('warm
    derivations (entries, seconds):', out); assert all(s < 27.0 for _, s in out), out"
  expected: >-
    Exit 0 printing two (entries, seconds) pairs. Measured at planning time on this container: about 2.9s for the
    41-entry #1554 delta and about 8s near the bound (63 entries took 6.6s, 125 took 12.9s). The 27s assertion is the
    10%-of-270s ceiling, a loose guard for slower hardware, not the expected cost.
  fix_if: >-
    Over the ceiling: the helper builds a fresh graph (a root that misses dependency_graph's lru_cache); pass the same
    root --pre used. Never add a cache that outlives the run (Decision 135). Lower DELTA_ENTRY_LIMIT only with a
    measured reason recorded in git-ops.yaml.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: >-
    Replay the rec-4427 incident on the real commits: PR #1554's head (d8319764), stamped, merged once with its CI
    base (5f355f10, main after #1551 and #1553) and once with its attested base (064802ca), with the four duckdb
    deferrals pr-validate printed for it; the command asserts both verdicts.
  command: >-
    R=$(git rev-parse --show-toplevel) && W=$(mktemp -d) && git fetch -q origin pull/1554/head:refs/replay/pr1554 &&
    git fetch -q origin main && H=$(git rev-parse refs/replay/pr1554) && HT=$(git rev-parse "$H^{tree}") &&
    S=$(printf 'replay\n\nFull-Tier-Attestation: tree=%s result=pass heavy_deps=duckdb\n' "$HT" | git -c
    commit.gpgsign=false commit-tree "$HT" -p "$(git rev-parse "$H^")") && rc=0 && for B in
    5f355f10b98473a98b47a1d70d30bdffd0b7c350 064802ca0cc9918e59e7a273ed63e0159dfb297b; do M=$(git -c
    commit.gpgsign=false commit-tree "$(git merge-tree --write-tree "$B" "$S")" -p "$B" -p "$S" -m merge) && rm -rf
    "$W/wt" && git worktree add -q --detach "$W/wt" "$M" && mkdir -p "$W/wt/logs/debug" && printf
    '{"state":"ok","deferred":{"tests/common/test_ducklake_event_verification_verbs.py":"duckdb","tests/ducklake_neon_smoke_test/test_lambda_telemetry_golden_gates.py":"duckdb","tests/telemetry/test_append_ducklake_integration.py":"duckdb","tests/telemetry/test_derived_layer_reconciliation.py":"duckdb"}}'
    > "$W/wt/logs/debug/diff-coverage-deferrals.json" && printf
    '{"pull_request":{"head":{"sha":"%s"},"user":{"type":"User"}}}' "$S" > "$W/event.json" &&
    GITHUB_EVENT_NAME=pull_request GITHUB_EVENT_PATH="$W/event.json" "$R/bin/venv-python" -c "import sys; from
    pathlib import Path; from scripts.checks.verification.validate_deferred_test_attestation import evaluate; b =
    sys.argv[2][:8]; v = evaluate(root=Path(sys.argv[1])); hit =
    'tests/common/test_ducklake_event_verification_verbs.py' in v.detail; print(b, v.rule, hit); want =
    {'5f355f10': ('base_moved_affects_deferred', True), '064802ca': ('attested_tree', False)}[b]; assert (v.rule,
    hit) == want, (v.rule, hit)" "$W/wt" "$B" || rc=1; git worktree remove --force "$W/wt"; done; git update-ref -d
    refs/replay/pr1554; exit $rc
  expected: >-
    Exit 0 and two lines: "5f355f10 base_moved_affects_deferred True", then "064802ca attested_tree False". Measured
    at planning time with an equivalent replay of the rule: the CI-base merge (41 delta entries, under the bound)
    reaches all four deferred modules; the attested-base merge tree equals the head tree.
  fix_if: >-
    The 5f355f10 line reads base_moved_unaffected: the derivation ran against the planning repo instead of root, or
    the delta is diffed the wrong way round. The 064802ca line is not attested_tree: the merge-ref tree is not read
    from HEAD^{tree} of root.
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: pre-deploy
  action: >-
    Lint the changed Python, then the handoff with the new stamp: full tier on the committed, rebased, clean tree and
    `--verify-head --stamp`, whose trailer must name HEAD's tree with result=pass.
  command: >-
    bin/venv-python -m ruff check scripts/checks/verification/validate_deferred_test_attestation.py
    scripts/checks/attestation_trailer.py scripts/checks/validation_result.py scripts/session/postflight.py
    tests/fixtures/attestation_repos.py && bin/venv-python -m scripts.validate && bin/venv-python -m
    scripts.checks.validation_result --verify-head --stamp && git log -1
    --format='%(trailers:key=Full-Tier-Attestation,valueonly)' HEAD | grep -q "tree=$(git rev-parse 'HEAD^{tree}')
    result=pass"
  expected: >-
    ruff exit 0, the full tier ends "All checks passed." exit 0, the CLI prints ok then stamped (or already_stamped)
    and exits 0, and the grep matches.
  fix_if: Any failure -- fix at root, commit, rebase and rerun the full tier from the start (handoff_policy).
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: post-deploy
  action: >-
    After the squash merge: (a) the check is in the merged --pre sequence; (b), reported as its own outcome, the
    implementing PR's final pr-validate job log shows the check's header and a verdict line.
  command: >-
    R=$(git rev-parse --show-toplevel) && W=$(mktemp -d) && git fetch -q origin main && git worktree add -q --detach
    "$W" origin/main && (cd "$W" && "$R/bin/venv-python" -c "from scripts.checks import registry; names = [s.name for s
    in registry.pre_sequence() if s.kind == 'check']; assert 'validate_deferred_test_attestation' in names, names;
    print('pre-sequence position', names.index('validate_deferred_test_attestation'))"); rc=$?; git worktree remove
    --force "$W"; exit $rc
  expected: >-
    (a) Exit 0 printing the position. (b) An MCP read (AGENTS.md: no gh CLI): mcp__github__actions_list for ci.yml
