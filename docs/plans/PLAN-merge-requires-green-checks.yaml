schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: merge-requires-green-checks
intent: >-
  An agent may merge only what GitHub shows green on the exact head it merges. Agents merged #1265 and #1261 while the
  required pr-validate check on those heads had concluded failure, because their merge identity holds the ruleset's
  admin bypass and "merge once green" was prose (rec-4080). The merge gate (Decision 245) gains a required-checks
  predicate and a mandatory expectedHeadSha, under one 40 s deadline (rec-4891), recorded in its own Decision in the
  Decision 245 clause 3 form. First of two plans for T4.32 c5; the second (rec-5121, PLAN-gate-consumers-flag-aware)
  adds the gates.<persona>.verdict_source rows, the persona leg and the contract readings.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-merge-requires-green-checks.yaml
phase: >-
  T4.32 (persona foundation), criterion c5's rec-4080 half: the merge_gate refusal and its Decision. c5 stays open
  until rec-5121's plan is built; closes_criteria is empty.
scope:
  - file: scripts/session/merge_checks.py
    action: Create
    purpose: >-
      Forge-neutral, pure predicate keyed on check names and conclusions, never a pull request number (Decision 234
      cl.4), no I/O. verdict(required, runs, total_count) -> Verdict(kind CLEAR|REFUSE|UNAVAILABLE, reasons tuple).
      `required` is the union of the check contexts of every required_status_checks rule rules/branches/main returns
      (it merges all applicable rulesets), or None when no such rule was found (UNAVAILABLE: an empty or absent list
      is unknown, never a pass). `runs` are check-run dicts
      (name, status, conclusion, started_at, id, app slug); when total_count exceeds len(runs) the read was partial
      (UNAVAILABLE). For each required name, only runs whose app slug is github-actions count (a commit status or
      another app's run never satisfies it); the newest by (started_at, id) decides, a null started_at sorting as newest
      (a queued run has none): status completed and conclusion
      success passes; a missing run, a newer queued or in-progress run, or any other conclusion (failure, skipped,
      neutral, cancelled, timed_out, action_required, stale) is REFUSE with a reason naming the check and its state.
      CLEAR only when every required name passes. Also a CLI for the VP replay: `python -m
      scripts.session.merge_checks judge --required A,B --runs FILE.json` prints one line `MERGE-CHECKS <KIND>
      <reasons>` and exits 0 CLEAR, 1 REFUSE, 2 UNAVAILABLE.
  - file: .claude/hooks/merge_gate.py
    action: Modify
    purpose: >-
      The GitHub adapter gains the required-checks leg (Decision {{N}}). (1) Deadline (rec-4891): one monotonic 40 s
      budget for the adapter's own work; every git call the adapter makes gets timeout min(25, remaining), the deepen
      retry only what is left, and each GET what is left (below); before each core call (merge_overlap.overlap,
      session_trailer.gate_denial, both local git reads with their own timeouts) the adapter checks the remaining
      budget; when it is spent the adapter denies "UNAVAILABLE: deadline spent (<step>)". The finally cleanup
      (update-ref -d) runs outside the budget with its own fixed 2 s reserve, and a timeout there is swallowed so it
      never overrides the verdict. Budget plus reserve (42 s) stays below the shim's 45 s TERM, so on the adapter's
      own calls the shim's kill never decides; a core call's local git read is the residual the shim's fail-closed
      kill still covers. (2) After the overlap verdict is CLEAR and the trailer check passes: for
      merge_pull_request, a missing expectedHeadSha denies with "merge-gate: checks: expectedHeadSha is required:
      merge naming the head whose CI-green wake you received (expectedHeadSha=<sha>)", printing the fetched head;
      the existing equality check stays. enable_pr_auto_merge, which carries no expectedHeadSha, is judged on the
      fetched head. (3) Reads, in order, each GET bounded by min(4 s, remaining) in wall-clock terms (the body is read
      in chunks against the deadline with a 1 MiB cap, since urllib's timeout bounds each socket operation only), no
      retry, no Authorization header, no credential read, and no tool_input field or variable of the gate's own that
      changes an endpoint or skips the leg: main's ruleset (rules/branches/main) and the head's check runs
      (commits/<sha>/check-runs?per_page=100&filter=all, every run so the predicate picks the newest itself; more
      than 100 runs on one head reads partial, UNAVAILABLE). <sha> is always the fetched 40-hex head
      (rev-parse of the fetched ref), never the tool_input value, which may be short or upper case. Transport from origin's resolved fetch URL (`git ls-remote --get-url
      origin`, after insteadOf): an http or https URL reads https://api.github.com/repos/<owner>/<repo>/... for the
      owner/repo parse_origin already takes from remote.origin.url (so the CC-web proxy form maps to GitHub); a
      file:// URL reads <that bare repository>/merge-gate-api/rules-branches-main.json and
      check-runs/<sha>.json (the test seam, Decision 212 cl.2); any other scheme is UNAVAILABLE. A non-200 answer
      (401, 403, 404, 429, 5xx), a timeout or unparseable JSON is UNAVAILABLE naming the endpoint and status. (4)
      Judge with merge_checks.verdict: CLEAR -> exit 0 silently; REFUSE -> exit 2, "merge-gate: checks: REFUSE: <each
      reason> on <sha12>. Fix the check with a new push and wait for its CI-green wake; never merge past a red
      required check (Decision {{N}})"; UNAVAILABLE -> exit 2, "merge-gate: checks: UNAVAILABLE: <reason>; retry the
      merge later, or the operator merges in the GitHub UI". Add `read_checks_verdict(root, owner, repo, sha,
      seconds=10.0) -> merge_checks.Verdict`, the adapter's read-and-judge seam the VP replay calls. The module
      docstring names rec-4080's predicate as built and keeps rec-4755 and rec-4451 as later predicates. Stays under
      500 SLOC; no override argument or variable.
  - file: tests/fixtures/merge_overlap_repos.py
    action: Modify
    purpose: >-
      install_project also copies scripts/session/merge_checks.py. Fixture writes the file:// API seam inside the bare
      origin: set_required(contexts or None) writes merge-gate-api/rules-branches-main.json (seeded at construction
      with pr-validate and terraform-validate in GitHub's rules/branches response shape), set_checks(sha, runs,
      total_count=None) writes merge-gate-api/check-runs/<sha>.json in GitHub's check-runs response shape, and
      branch_pr and every PR-head update seed both required checks green (github-actions, completed, success) for the
      new head; green_runs() returns that green pair; head_of(number) returns the PR head sha. merge_payload is
      unchanged.
  - file: tests/hooks/test_merge_gate.py
    action: Modify
    purpose: >-
      The nodes that expect a merge_pull_request to be allowed (at planning base 2fc58b50: test_clear_allows_silently,
      the 2.0 pullNumber node, and the trailer nodes at lines 188 and 197-198) pass expectedHeadSha=f.head_of(n) in
      their payload, since a merge without it is now refused. No assert line changes, and no node is renamed or
      removed; deny-path nodes are untouched.
  - file: tests/hooks/test_merge_gate_shim.py
    action: Modify
    purpose: >-
      Same edit for the shim nodes that expect a merge payload to pass through (test_clean_pass_through,
      test_github_actions_env_is_still_gated, test_planted_stdlib_name_is_not_loaded): their default payload names the
      fixture PR head as expectedHeadSha. No assert line changes; the fail-closed nodes are untouched.
  - file: tests/checks/prose/test_s1_concurrent_merge_premerge.py
    action: Modify
    purpose: >-
      rec-4869's incident replay: the test pushes PR heads with raw git push (lines 33 and 53), which the fixture's
      seeding does not see, so one seeding line `f.set_checks(f.head_of(2), f.green_runs())` follows the PR 2 update
      push, and the final `allowed` payload passes expectedHeadSha for the updated PR 2 head. The node id and every
      assert line stay textually identical.
  - file: tests/test_session_merge_checks.py
    action: Create
    purpose: >-
      Unit tests of merge_checks.verdict, in process: all required green -> CLEAR; one failure -> REFUSE naming it
      (the #1265 shape: terraform-validate success, pr-validate failure); skipped, neutral, cancelled and timed_out
      each -> REFUSE; a newer queued or in-progress re-run over an older success -> REFUSE; an older failure under a
      newer success -> CLEAR (equal started_at broken by id); a required name with no run -> REFUSE; a run by another
      app -> REFUSE (treated as missing); required None or empty -> UNAVAILABLE; total_count above the runs read ->
      UNAVAILABLE; an extra non-required failing run -> CLEAR; contexts from two required_status_checks rules are
      both required (union); a run with null started_at outranks a completed success; the CLI line format and exit
      codes 0/1/2 through main(argv).
  - file: tests/hooks/test_merge_requires_green_checks.py
    action: Create
    purpose: >-
      rec-4080's acceptance file, run through the shim as the harness does (tests/fixtures/merge_overlap_repos.py,
      GIT_ALLOW_PROTOCOL=file): required checks green with expectedHeadSha -> exit 0, empty stderr; pr-validate
      failure on the head -> exit 2 naming pr-validate and "REFUSE"; pending, skipped and a newer queued re-run -> exit
      2; a missing terraform-validate run -> exit 2; a run by another app only -> exit 2; a ruleset file with no
      required_status_checks rule, a missing ruleset file, a missing check-runs file and a truncated list
      (total_count above the runs) -> exit 2 naming UNAVAILABLE; merge_pull_request without expectedHeadSha on an
      all-green head -> exit 2 naming expectedHeadSha and printing the head; enable_pr_auto_merge on an all-green head
      -> exit 0 and with a pending check -> exit 2; an origin whose resolved URL is neither http(s) nor file:// -> exit
      2; setting HTTPS_PROXY, GITHUB_TOKEN or an unknown tool_input key cannot turn a REFUSE into exit 0; a short
      upper-case expectedHeadSha resolving to the head reads the check-runs file of the full 40-hex sha; the overlap
      refusal still comes first for an overlapping PR. Module-scoped fixtures to protect the --pre budget.
  - file: tests/hooks/test_merge_gate_deadline.py
    action: Create
    purpose: >-
      rec-4891's acceptance node test_retry_path_stays_under_shim_cap: in process, with an injected monotonic clock and
      git and HTTP runners that report the time each call used, the worst path (a slow first fetch, the deepen retry,
      both GETs) never asks for a timeout past the 40 s deadline, and a spent deadline denies naming UNAVAILABLE and
      the step; a slow-reader GET (a body trickling past the deadline) denies UNAVAILABLE within the budget; a
      cleanup timeout in finally does not change the verdict; plus a node that the adapter's deadline plus its
      cleanup reserve stays below the shim's timeout limit (read from merge_gate.sh, not restated; the existing shim
      node keeps limit plus kill-after below the registered 60 s).
  - file: tests/checks/decisions/test_merge_green_checks_decision_records.py
    action: Create
    purpose: >-
      Growth-safe pins (never the newest entry or a count of Decisions): exactly one heading starting "## Decision N:
      An agent merge is refused unless every required check" exists, its envelope reads amends [83] and kind
      direction, and its body names rec-4080 and expectedHeadSha; each of Decisions 83, 229, 245 and 246 holds exactly
      one dated note naming PLAN-merge-requires-green-checks and that same Decision N, inside its own entry's span.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the approved-text sidecar docs/plans/approved/merge-requires-green-checks.yaml: blocks decision-entry
      (the new Decision, {{N}} = the next free number at build, {{DATE}} = the build date UTC), decision-83-note,
      decision-229-note, decision-245-note and decision-246-note. The decisions index is a generated companion.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's git-ops blocks: contract_version 15 -> 16, one amendment_log row, push_pr_ci_merge_flow's green-confirmation item (re-flowed onto one
      line, words unchanged, plus the merge-gate sentence) and merge_step_coverage's hook files and residual owners.
      referenced_repo_paths is not edited: validate_git_ops_contract requires each listed path to exist, and the
      wording check runs before merge_checks.py does. Line budget: 499 of 500 effective lines on 2fc58b50 and 497
      with the blocks placed; over 500 at build is BLOCKED for a compaction amendment, never a raise (Decision 128).
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's ports blocks: SA-04 extends to the required-checks reads (Decision 212 cl.3) and one
      amendment_log row; no contract_version change (the SA-07 extension precedent). SA-04's assumption is one line
      so the file stays at 499 of 500 effective lines (498 with the blocks placed on 2fc58b50); over 500 at build is
      BLOCKED for a compaction amendment, never a raise (Decision 128).
