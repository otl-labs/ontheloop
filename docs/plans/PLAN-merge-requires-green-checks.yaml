constraints:
  - "terraform/github is not touched: the ruleset, strict=false and the admin bypass stay (Decision 83); operator GitHub-UI merges are unaffected; the persona checks become required status checks only after rec-4624."
  - "No agent override, no variable of the gate's own, flag or tool_input field that skips the leg or redirects a read, and no credential read or stored (Decision 203 cl.3 pattern); a false refusal is fixed in the checker. Git configuration (repository config and GIT_CONFIG_* in the environment, which CC-web itself sets for its github.com insteadOf) resolves origin for the checks exactly as for the fetch: it is the trust root the fetch already has, the rec-4085 residual the Decision names, not stripped."
  - "merge_checks.py never names a pull request number and does no I/O (Decision 234 cl.4); GitHub plumbing stays in the adapter (Decision 212 cl.3)."
  - "Only check runs count; commit statuses are never read (a token holder can post a status, not a github-actions check run)."
  - "The Decision text, the four notes and the git-ops and ports blocks are operator-approved; place them exactly, never re-word; a moved anchor is a plan-defect report."
  - "Never edit CI Reform's tests/checks/decisions/test_sit_decision_records.py; it pins none of the four Decisions this plan annotates."
  - "No persona leg, no gates.* rows and no coordinator, tier-item-lifecycle or project-alignment edit: those are rec-5121's plan."
  - "Existing tests change only payload construction (expectedHeadSha) and fixture seeding, never an assert line (Decision 235)."
  - No rescue agents or workaround loops (Decision 55).
