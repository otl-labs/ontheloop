  - step: 8
    phase: pre-deploy
    action: Check the git-ops.yaml and ports.yaml edits against main and run their contract tests.
    command: >-
      bin/venv-python -c "import subprocess, yaml; base = yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:docs/contracts/git-ops.yaml'],
      capture_output=True, text=True, check=True).stdout); head = yaml.safe_load(open('docs/contracts/git-ops.yaml', encoding='utf-8'));
      assert head['contract']['contract_version'] == base['contract']['contract_version'] + 1;
      assert 'expectedHeadSha' in str(head['push_pr_ci_merge_flow']) and 'merge_checks.py' in str(head['merge_step_coverage']);
      assert 'rec-4080' not in str(head['merge_step_coverage']); p = yaml.safe_load(open('docs/contracts/ports.yaml', encoding='utf-8'));
      sa = next(r for r in p['structural_assumptions'] if r['id'] == 'SA-04'); assert 'check-runs' in sa['assumption'] and 'github-actions' in sa['assumption'];
      print('CONTRACTS-OK')" && bin/venv-python -m pytest tests/checks/contracts/test_validate_git_ops_contract.py -q
    expected: prints CONTRACTS-OK and the contract tests pass
    fix_if: the version is not base+1 (another plan bumped it first; a plan-defect report, since the anchor is approved text), or a path or residual is missing
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main (the version delta is vacuous once merged); validate_git_ops_contract and
      validate_ports_contract keep checking both files on every PR.
  - step: 9
    phase: pre-deploy
    action: >-
      Live replay on the real incident heads (network): GitHub's public reads from this surface, and the adapter's
      read-and-judge seam on #1265 and #1261 (merged with pr-validate failed) and #1990 (green).
    command: >-
      git fetch -q origin refs/pull/1265/head:refs/replay/1265 refs/pull/1261/head:refs/replay/1261 refs/pull/1990/head:refs/replay/1990 &&
      bin/venv-python -c "import sys, pathlib; sys.path.insert(0, '.claude/hooks'); import subprocess, merge_gate as g; root = pathlib.Path('.');
      [print(n, g.read_checks_verdict(root, 'otl-labs', 'ontheloop', subprocess.run(['git', 'rev-parse', 'refs/replay/' + n], capture_output=True, text=True, check=True).stdout.strip()))
      for n in ('1265', '1261', '1990')]"; git update-ref -d refs/replay/1265; git update-ref -d refs/replay/1261; git update-ref -d refs/replay/1990
    expected: >-
      three lines, judged on output only (the trailing cleanup sets the exit status): 1265 and 1261 each a REFUSE
      verdict whose reasons name pr-validate failure; 1990 a CLEAR verdict.
      An UNAVAILABLE line is a read failure on this surface: re-run once; if it persists, record it and send a
      plan-defect report (the gate would wedge merges here)
    fix_if: '#1265 or #1261 reads CLEAR (the rule misses the incident) or #1990 reads REFUSE (false refusal)'
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Depends on network reads of GitHub; steps 2-3 graduate the same verdicts hermetically.
  - step: 10
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): this command as one backgrounded Bash call with a
      2 h limit from the top-level session.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate &&
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0; --verify-head reads the full tier's recorded verdict for HEAD, never the backgrounded run's own exit status
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun from the start; a failure only in another
      open red's tests is not this build's to fix: log it and follow the implement skill's go/no-go
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      After the squash merge and the operator's plugin update (Customize > Plugins), in a fresh claude.ai project
      thread, on #1819 (closed, never merged, pr-validate failure on head 1933f7ea at planning; GitHub refuses any
