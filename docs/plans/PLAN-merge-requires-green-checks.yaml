    command: bin/venv-python -m pytest tests/checks/decisions/test_merge_green_checks_decision_records.py -q
    expected: exit 0, all nodes pass; red before (file absent).
    fix_if: a note is missing, duplicated, outside its Decision's span or cites another number; fix the placement, never the sidecar
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: The new file is itself the standing guard, a plain pytest file the full tier always runs (Decision 244 cl.1).
  - step: 7
