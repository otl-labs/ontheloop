acceptance_criteria:
  - rec-4080's acceptance (pytest tests/hooks/test_merge_requires_green_checks.py) and rec-4891's acceptance node exit 0.
  - The shim refuses merge_pull_request and enable_pr_auto_merge on this repository unless every required check of main's ruleset has a newest github-actions check run completed with success on the head; every other state, a partial or failed read, and a merge_pull_request without expectedHeadSha refuse; an all-green head with expectedHeadSha is allowed.
  - Replayed on the real heads, the adapter's read-and-judge seam reads REFUSE naming pr-validate for #1265 and #1261 and CLEAR for #1990's head.
  - Every git call the adapter makes and both GitHub reads stay inside the adapter's 40 s deadline, checked before each core call; deadline plus the 2 s cleanup reserve stays under the shim's 45 s limit.
  - docs/DECISIONS.md, git-ops.yaml and ports.yaml carry exactly the sidecar's blocks (approved_text verify exits 0), and the Decision's records pin test passes.
  - Existing merge-gate suites, rec-4869's incident replay and the render and registration guards stay green with no assert line changed.
  - "After merge, in a fresh claude.ai project thread, the hook itself reads GitHub and refuses a real merge_pull_request on a closed, unmerged PR with a red pr-validate (#1819 at planning) with a \"merge-gate: checks: REFUSE\" line naming pr-validate."
  - The new Decision's warehouse row exists after the backfill, and rec-4080 and rec-4891 read closed after the squash merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Premises, run first on the build's base, before any edit.
    command: >-
      bin/venv-python -c "import pathlib; t=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); g=pathlib.Path('docs/contracts/git-ops.yaml').read_text(encoding='utf-8');
      h=pathlib.Path('.claude/hooks/merge_gate.py').read_text(encoding='utf-8'); b=t[t.index('## Decision 245:'):t.index('## Decision 244:')];
      print('d245_residual=' + str('merge on red (rec-4080)' in b) + ' gitops_residual=' + str('merge on red or before the updated head' in g)
      + ' version15=' + str('contract_version: 15' in g) + ' no_api=' + str('api.github.com' not in h) + ' no_module=' + str(not pathlib.Path('scripts/session/merge_checks.py').exists()))"
    expected: One line with every field True (d245_residual, gitops_residual, version15, no_api, no_module).
    fix_if: >-
      A False means a premise moved (another plan edited the residual text, bumped git-ops' version or added a
      GitHub read): stop and send a plan-defect report; changed anchors go back to the operator as new wording
      (Decision 246 cl.2).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Red-before premise evidence that this build itself makes false; steps 2-6 are the standing guards.
  - step: 2
    phase: pre-deploy
    action: Run the pure predicate's unit tests.
    command: bin/venv-python -m pytest tests/test_session_merge_checks.py -q
    expected: exit 0, all nodes pass; red before (module absent).
    fix_if: a non-success conclusion, a missing run or another app's run reads CLEAR, or a partial read is not UNAVAILABLE
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: merge-checks-verdicts
  - step: 3
    phase: pre-deploy
    action: Run rec-4080's acceptance file through the shim.
    command: bin/venv-python -m pytest tests/hooks/test_merge_requires_green_checks.py -q
    expected: exit 0, all nodes pass; red before (file absent, and the adapter allows a red head).
    fix_if: any red, pending, missing or unreadable state exits 0 (fails open), or an all-green head with expectedHeadSha is refused
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: merge-gate-refuses-red-checks
  - step: 4
