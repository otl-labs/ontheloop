      --expect 1cf533117ac9934c257e8c30d8dea0c45e2fa5edfa915df63b861751766708c9
    expected: exit 0; all eleven blocks match
    fix_if: any word differs from the sidecar; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
