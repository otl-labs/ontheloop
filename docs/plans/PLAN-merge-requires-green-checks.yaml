    action: Run rec-4891's acceptance node and the cap node.
    command: bin/venv-python -m pytest tests/hooks/test_merge_gate_deadline.py -q
    expected: exit 0, all nodes pass; red before (file absent; today two 40 s fetches can exceed the 45 s cap).
    fix_if: a requested timeout runs past the deadline, or the deadline plus kill grace reaches the shim cap
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: merge-gate-deadline-under-cap
  - step: 5
