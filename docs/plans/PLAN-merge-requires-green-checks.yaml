      overlap reads CLEAR (`git fetch -q origin refs/pull/1819/head:refs/replay/1819 && bin/venv-python -m
      scripts.session.merge_overlap check --head refs/replay/1819`); if it reads OVERLAP, pick the newest closed,
      unmerged PR whose required check concluded failure and whose overlap reads CLEAR, and use its number and head.
      Then run the shell probe, then call mcp__github__merge_pull_request(owner="otl-labs", repo="ontheloop",
      pullNumber=1819, merge_method="squash", expectedHeadSha="1933f7ead6d47678ba1cce462294f77bcfb6504d").
    command: >-
      printf '%s' '{"tool_name":"mcp__github__merge_pull_request","tool_input":{"owner":"otl-labs","repo":"ontheloop","pullNumber":1819,"expectedHeadSha":"1933f7ead6d47678ba1cce462294f77bcfb6504d"}}'
      | bash .claude/hooks/merge_gate.sh; echo "rc=$?"
    expected: >-
      the overlap pre-check prints MERGE-OVERLAP CLEAR; the shell probe prints "merge-gate: checks: REFUSE" naming
      pr-validate and rc=2; the real MCP call returns the same hook refusal, not a GitHub API error. This proves the
      hook process itself reaches GitHub from a project thread (proxy and CA inherited)
    fix_if: >-
      the MCP call reaches GitHub (the hook is not wired in that surface); an UNAVAILABLE read refusal on a
      fresh surface is the Decision's read-surface-lost condition, never an override
    hermetic: false
  - step: 12
    phase: post-deploy
    action: After the squash merge, ETL the new Decision to the warehouse and prove its row exists.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md && bin/venv-python -c "import re; from pathlib
      import Path; n=int(re.search(r'^## Decision (\\d+): An agent merge is refused unless every required check',
      Path('docs/DECISIONS.md').read_text(encoding='utf-8'), re.M).group(1)); from scripts.ops_portal.decisions import
      _fetch_decision_from_reader as g; assert g(f'dec-{n}'), n; print('POST_MERGE_OK', n)"
    expected: exit 0 and the marker with the Decision number
    fix_if: a missing row after a clean backfill means the entry did not parse; re-run step 7 against main
    hermetic: false
  - step: 13
    phase: post-deploy
    action: Confirm both bundled recs closed.
