    action: The existing merge-gate suites, rec-4869's replay and the hook render and registration guards stay green.
    command: >-
      bin/venv-python -m pytest tests/hooks/test_merge_gate.py tests/hooks/test_merge_gate_shim.py
      tests/test_session_merge_overlap.py tests/checks/prose/test_s1_concurrent_merge_premerge.py
      tests/hooks/test_plugin_hooks.py tests/hooks/test_handoff_evidence_gate.py -q
    expected: exit 0
    fix_if: >-
      an allow-path node fails for a missing expectedHeadSha or check fixture (fix the payload or fixture, never an
      assert line); validate_weakening_candidates listing a candidate is a plan-defect report, never a disposition
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Existing standing guards already graduated or selected by --pre for these files.
  - step: 6
