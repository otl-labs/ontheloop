  - file: .claude/commands/implement.md
    action: Modify
    purpose: Exactly the sidecar's one block - the Step 7 trailer and refusal-route paragraph.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's six blocks: contract_version 8 -> 9; one new amendment_log row and every existing row
      compacted to a one-line flow mapping (parsed values unchanged; the contracts class's declared relief valve,
      490 -> 478 effective lines against the 500 limit, Decision 166); three referenced_repo_paths; the merge step in
      push_pr_ci_merge_flow (premerge, commit_message, expectedHeadSha and readback for an IMPLEMENTATION merge only);
      resolves_trailer rewritten (keeps the CARRIER "implementation merge" and PLACEMENT
      "Key: value" wording validate_rec_autoclose_trailer_gate reads; adds TRANSPORT, the recover route with its junit
