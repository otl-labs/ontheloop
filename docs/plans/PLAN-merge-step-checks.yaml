schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "merge-step-checks"
intent: >-
  Make the /implement merge step checked instead of trusted: the Resolves trailer travels in a branch commit and a
  fast-tier check enforces it, the merge commit is read back, a lost trailer is recovered only through the Decision 201
  verdict gate, the documented refusal route is one that exists, bundled recs never close before their work merges,
  each bundled rec's acceptance is previewed before merge, and operator-approved exact text is bound to its words and
  re-checked against the PR diff. Removes operator load (no second approval of unchanged text, no hand closes) and adds
  measurement at the merge.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-merge-step-checks.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-2733,
  rec-3856, rec-4244, rec-4443, rec-4592, rec-4687 and rec-2437; joint-review items J-03 and J-14.
scope:
  - file: docs/plans/approved/merge-step-checks.yaml
    action: Create
    purpose: >-
      Lands WITH THIS PLAN (plan PR), not in the build. The approved-text sidecar: schema_version 1, slug, and 21
      blocks {id, file, before, after} binding the build's edits to the five always-ask files below. Each block's
      `after` is the operator-approved wording; `{{DATE}}` (the landing date) is the only placeholder used. The build
      copies every `after` verbatim, line breaks included, and its own PR is then checked against this file by
      validate_merge_step: the mechanism proves itself on its first use.
  - file: scripts/roadmap/approved_text.py
    action: Create
    purpose: >-
      The approved-text binding (docs/contracts/git-ops.yaml approved_text_binding). Pydantic Sidecar (extra=forbid:
      schema_version Literal[1], slug, blocks min 1, unique block ids) and Block (extra=forbid: id, file, before,
      after; before may be empty ONLY when the file is absent at the base, and then that block is the file's only
      block). parse_sidecar(text) and load_sidecar_at(ref, slug, root) reading docs/plans/approved/<slug>.yaml via `git
      show <ref>:<path>` (None when absent at ref); load_sidecar(slug, root) reads the working tree (authoring only).
      sidecar_state(slug, root, base) -> unchanged | added | changed | deleted | absent, comparing the working-tree file
      to the base copy. Words = text.split() (whitespace and line wrapping ignored). Placeholders: an approved token
      containing `{{N}}` (\d+) or `{{DATE}}` (\d{4}-\d{2}-\d{2}) matches only by re.fullmatch of the escaped token with
      each placeholder replaced by its pattern, so an unfilled placeholder never verifies; every other token must be
      equal. apply(base_words, blocks) replaces each block's `before` words, which must occur exactly once in the base
      and never overlap another block's, with its `after` words; anything else raises ApprovedTextError naming the
      block id. verify(sidecar, root, base_ref) -> list[str]: per bound file, base text from `git show
      <base_ref>:<file>` (absent = empty), head text from the working tree; a file whose head words do not equal
      apply(base words) token-for-token yields one message naming the file and the first differing position with 8
      words of context each side, and a bound `.yaml` file that does not yaml.safe_load at HEAD yields one message.
      digest(sidecar) = sha256 of json.dumps([{"file": f, "before": words, "after": words} per block in sidecar order],
      separators=(",", ":"), ensure_ascii=False) with keys in exactly that order (no sort_keys), so rewrapping never
      changes it and any word change does; the committed sidecar's digest is fixed in this plan (VP 5). CLI: `record --slug S`
      reads the working tree and prints `digest=<hex> blocks=<n>`; `verify --slug S [--base REF] [--expect HEX]` loads
      the sidecar AT THE BASE, prints `APPROVED-TEXT SIDECAR <state>` and exits 1 when the working-tree copy is added,
      changed or deleted relative to the base, else prints `APPROVED-TEXT OK <digest>` or one `APPROVED-TEXT MISMATCH
      ...` line per failure and exits 1 (2 on a usage or load error, or no sidecar at the base); --base defaults to
      scripts.checks._common.status_diff_base(root) (the push base in push context, else the merge-base with
      origin/main). Lives in scripts/roadmap/ (plan tooling; a scripts/ root module would need a file-router
      scripts_root_allowlist entry, RS-01).
      A word engine rather than `git apply --check` or `git diff --word-diff`, which bind lines or whitespace runs: the
      binding must survive rewrapping, allow filled placeholders and keep a wrap-stable digest. Never raises at import
      (AGENTS.md Safety).
  - file: tests/test_approved_text.py
    action: Create
    purpose: >-
      Fixture git repos (tmp_path) only, no dependence on origin/main; every fixture test passes --base/root explicitly
      and clears GITHUB_EVENT_NAME and GITHUB_EVENT_BEFORE (monkeypatch.delenv), so a push-event CI job sees the same
      results. Reaches 100% line coverage of scripts/roadmap/approved_text.py on its own (validate_test_coverage maps the
      module to this file). Cases: an exact copy of every block verifies; a
      rewrapped copy verifies; one extra word inside a bound file fails, also when it sits far outside every block (the
      whole-file binding); one changed or dropped word fails; a removed sentence that a block did not approve fails;
      `{{DATE}}` matches 2026-11-02 and not "soon"; an unfilled `{{DATE}}` left in the head text fails; a bound YAML
      file that no longer parses fails; a `before` that occurs twice or never, and two overlapping blocks, raise
      ApprovedTextError naming the block; a new file (absent at base, before empty) verifies; the sidecar is read from
      the base ref, and sidecar_state reports a working-tree edit as changed, a removal as deleted and a branch-only
      sidecar as added (verify exits 1 for each); the digest is stable under rewrapping and changes with one word;
      record and verify CLI exit codes; --expect with a wrong digest exits 1; the canonical digest of a two-block fixture equals a hard-coded hex (pins the key order). One real-tree test: every committed
      docs/plans/approved/*.yaml parses, its slug equals its file stem, and docs/plans/PLAN-<slug>.yaml exists (true
      before and after any build, so it never reddens main).
  - file: scripts/session/merge_step.py
    action: Create
    purpose: >-
      Three Commit Flow verbs over existing machinery, no new executor (Decision 201 point 4); lives in scripts/session/
      beside github_readiness (a scripts/ root module would need a file-router allowlist entry, RS-01). Reads a plan with
      a raw yaml.safe_load (never PlanDocument). EXPECTED SET: the plan's bundled_recommendations when the plan reads
      implementation_declared true at the ref checked (HEAD for premerge, the merge SHA for readback and recover, read
      with `git show <ref>:docs/plans/PLAN-<slug>.yaml`), else the empty set (CARRIER: a plan-only merge carries no
      trailer, so a trailer there is a mismatch). Reads
      recs with ONE fetch_recs_by_ids call per verb and passes the rows to rec_trailer_acceptance.census(ids, rows=...,
      repo_root=...) (Decision 215; no per-id rec_by_id); a reader failure prints `... unavailable: <reason>` and never
      a holds verdict. Imports of ops_data_portal, the reader and ci_rca_lifecycle stay function-local.
      `premerge --slug S --message-file F [--expect HEX]`: prints `PREMERGE HEAD <sha>` (the sha the merge call passes as
      expectedHeadSha); (1) scripts.rec_trailer.parse_resolves_trailer(message) must equal the expected set exactly,
      else `PREMERGE TRAILER MISMATCH expected=[...] parsed=[...]` with validate_merge_step (T)'s remedy for each arm,
      except that when the plan is undeclared at HEAD and
      the parsed trailer is non-empty it prints `PREMERGE UNDECLARED <slug>: implementation_declared is false at HEAD --
      set it ('Run the full gate locally first' item 3), commit, re-run CI; never drop the trailer` instead (a multi-PR
      intermediate PR carries no trailer and is unaffected); (2) acceptance preview
      per bundled rec: census at ROOT with every entry routed `junit` reset to `static` (locally there is no same-run
      junit report; the preview only reports), then rec_trailer_acceptance.evaluate(entries, ROOT, HEAD sha); one line
      per rec `PREVIEW rec-N holds|fails|unmeasurable|out_of_grammar arm=<arm>`, `PREVIEW rec-N missing` for an id the
      reader lacks, `PREVIEW rec-N already-closed` (not previewed, not fatal: an operator-closed rec stays bundled and
      in the trailer and the closure job skips it), and `PREVIEW rec-N already-superseded|already-declined: remove it
      from bundled_recommendations by a plan amendment PR` (not previewed, fatal: the closure job would otherwise
      re-close it); (3) when the sidecar exists at merge-base(origin/main, HEAD), the approved_text verify path
      (sidecar_state plus verify) against that base and, with --expect, digest equality; (4) after `git fetch origin
      main`, a block whose `before` no longer occurs exactly once in its file at origin/main prints `PREMERGE STALE BASE
      <block id>: rebase and re-run CI` (the post-merge check applies the blocks to the pre-merge main; edits elsewhere
      in a bound file are tolerated by the word-level apply). Exit 1 when (1), (3) or (4) fails or
      any rec previews fails, out_of_grammar, missing, already-superseded or already-declined (a red line blocks the
      merge); unavailable and unmeasurable are
      printed, not fatal. Writes nothing anywhere.
      `readback --slug S --sha SHA`: `git fetch origin main`, read `git log -1 --format=%B SHA`, parse the trailer and
      compare with the expected set at SHA; prints `READBACK OK <sha> recs=[...]`, or `READBACK MISSING <sha>
      missing=[...]` / `READBACK UNEXPECTED <sha> extra=[...]` (with the UNDECLARED remedy beside it when the plan is
      undeclared at SHA) and exits 1. An empty expected set with no trailer prints
      `READBACK OK <sha> recs=[]`.
      `recover --slug S --sha SHA`: refuses (exit 2) unless the plan's implementation_declared is true at SHA and not
      at SHA^ (the same flip test _common._plan_declared_at_ref applies, so SHA is this plan's own merge) AND readback
      at SHA reports recs missing; acts only on those missing bundled recs (never a rec present in the trailer, never
      an unbundled one). Inside scripts.verification_graduation.git_worktree(SHA, ROOT) (reused, function-local import:
      it adds a detached worktree, links ROOT/.venv so bin/venv-python resolves, and in a finally unlinks the link, runs
      `git worktree remove --force` and prunes on failure; its GraduationError prints `RECOVER worktree failed:
      <reason>` and exits 2): census(missing, rows=...,
      repo_root=worktree) with NO junit reset, evaluate(entries, worktree, SHA), rejoin(census_doc, verdict_doc, None)
      in the census-artifact shape rec_trailer_acceptance.cmd_census writes, so a junit-routed rec resolves to
      unmeasurable and stays open (Decision 201 source_admission: its authoritative verdict is the merge run's junit
      report, which recover neither re-executes nor accepts as an agent-supplied file); then ci_rca_lifecycle.close_recs_from_trailer(missing, SHA, "merge_step recover (operator
      session, no workflow run)", recs_cache, acceptance_verdicts=..., require_acceptance_verdict=True), so the
      merge-leg gate and the Decision 201 verdict gate both run and a non-holds verdict leaves the rec open. Prints
      `RECOVER rec-N junit-routed: left open for the operator` per junit-routed rec. Returns that function's exit code. Under 500 SLOC (Decision 128); must not import closure_stamps_applicable.
  - file: tests/test_session_merge_step.py
    action: Create
    purpose: >-
      validate_test_coverage maps scripts/session/merge_step.py to this file and needs 100% line coverage from it alone,
      so every premerge preview arm is covered here too (rec-4687's file is that rec's acceptance oracle, not the
      coverage home). Fixture repos with a local bare origin; tests clear GITHUB_EVENT_NAME and GITHUB_EVENT_BEFORE.
      readback OK, MISSING, UNEXPECTED (a trailer on a merge whose plan is not declared at SHA) and empty-bundle cases,
      with the expected set read from the plan at SHA, not the working tree; recover refuses when the trailer is present, refuses
      an unbundled rec, refuses a SHA where the plan's declaration does not flip, and on a missing trailer calls
      close_recs_from_trailer with require_acceptance_verdict=True, the merge sha and only the missing recs (stubbed
      reader, evaluate and close); census receives the rows from one fetch_recs_by_ids call and repo_root=<worktree>; a
      junit-routed entry is never in evaluate's probe payload and reaches the close as unmeasurable; premerge prints
      its HEAD sha, reports an already-closed bundled rec as `already-closed` without failing, exits 1 naming the
      amendment remedy for an already-superseded or already-declined one, a trailer mismatch exits 1, an exact match
      passes, an undeclared plan with no trailer passes and an undeclared plan with a trailer prints PREMERGE UNDECLARED
      with its remedy and exits 1 (readback prints the remedy beside UNEXPECTED); premerge runs the approved-text path when a sidecar
      exists at the base, --expect mismatch exits 1, a block whose `before` changed on origin/main prints STALE BASE
      and exits 1, and an edit elsewhere in a bound file on origin/main does not. Shared fixture builders come from
      tests/fixtures/merge_step_repos.py. Unstubbed worktree test (fixture repo carrying a copy of bin/venv-python and a
      `.venv/bin/python` link to sys.executable): inside recover's worktree, `bin/venv-python -c "print(42)"` exits 0
      and prints 42, the worktree's `.venv` resolves to the fixture's, and the worktree is gone afterwards, on success
      and on error; a stubbed git_worktree raising GraduationError prints `RECOVER worktree failed` and exits 2.
  - file: tests/fixtures/merge_step_repos.py
    action: Create
    purpose: >-
      Shared fixture builders for the three new test files (Decision 128 headroom for test files that need 100% line
      coverage of their module): a git repo with a local bare origin, commit and branch helpers, a plan writer
      (bundled recs, implementation_declared), a sidecar writer, and a copy of bin/venv-python with a `.venv/bin/python`
      link to sys.executable. Test-only; imports nothing from scripts.
  - file: tests/test_rec_trailer_acceptance_premerge.py
    action: Create
    purpose: >-
      rec-4687's acceptance file; every test sits in class TestPremergePreview (the acceptance names that node). The
      premerge acceptance preview: a holds verdict prints holds and exits 0; a fails or out_of_grammar verdict exits 1
      naming the rec; a junit-routed entry is evaluated through the static probe; a reader exception prints `PREVIEW
      unavailable` and no rec line says holds; nothing calls update_rec or the writer (assert not called).
  - file: scripts/checks/verification/validate_merge_step.py
    action: Create
    purpose: >-
      Registered fast-tier check, owner platform, Decision 170 accounting (examined = declared plans considered).
      Every git probe is scoped to the injected root: base = _common.status_diff_base(root) or "origin/main"; push base
      = _common.push_context_base(root) (an injectable seam); plans = _common.resolve_declared_plans(changed, root, base)
      (content-keyed: the plan whose implementation_declared flips in this diff). Per plan: (T) outside push context
      only (push base None), when bundled_recommendations is non-empty and the declaration is
      COMMITTED (`git show HEAD:<plan>` reads implementation_declared true): the union of parse_resolves_trailer over
      every `git log --format=%B <base>..HEAD` message must equal the bundled set exactly, else fail naming expected
      and found plus the remedy for each arm: a missing rec, `add a commit whose message carries: Resolves: <set>`; an
      extra rec (the union never shrinks, e.g. after a plan amendment PR removed a superseded rec), rewrite the
      trailer-carrying commit's message (`git commit --amend` when it is the last commit, else `git reset --soft
      <merge-base>` and recommit with the corrected trailer) and push with --force-with-lease (git-ops.yaml
      rebase_phase_distinction); a declaration present only in
      the working tree prints `PENDING trailer: declaration not committed`
      (the Commit Flow's --pre runs before the commit; CI always sees the committed state). (A) the sidecar is read AT
      THE BASE: sidecar_state added, changed or deleted fails (an approval cannot ride in or be edited by the build it
      binds); when present at the base, approved_text.verify(sidecar, ROOT, base) messages fail the check. A sidecar
      load error fails loud. Takes injected root/base/changed seams so red cases run on fixture repos. Prints PASS with
      counts.
  - file: tests/checks/verification/test_validate_merge_step.py
    action: Create
    purpose: >-
      Fixture repos: declared plan with bundled recs and the trailer in a branch commit passes; trailer only in a PR
      body (no commit) fails; trailer naming a subset or a superset fails, each printing its own arm's remedy; an uncommitted declaration prints PENDING
      and passes; push context skips (T); a sidecar mismatch fails and an exact sidecar passes; a sidecar edited,
      deleted or first added on the branch fails; an undeclared plan is not checked; real-tree run passes. Every
      fixture case injects root, base and the push-base seam and clears GITHUB_EVENT_NAME and GITHUB_EVENT_BEFORE, so
      main-validate's push-event job (GITHUB_EVENT_NAME=push is job-global) sees the same results; 100% line coverage
      of the check from this file.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      Register validate_merge_step (pre=True, full_segment full_after_lint) with pre_globs docs/plans/**,
      scripts/roadmap/approved_text.py, scripts/rec_trailer.py, scripts/checks/verification/**, scripts/checks/_common.py,
      scripts/checks/registry.py, mirroring validate_admin_root_premerge_gate's entry.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      One row in function_to_category: validate_merge_step: schema_drift. Shared append with plan
      local-fast-tier-parity: whichever build merges second rebases and keeps both rows.
  - file: config/agent/verification_registry/entries/merge-step-check-tests.yaml
    action: Create
    purpose: Graduated registry row for VP step 3 (test_selector, guard_target the new check).
  - file: config/agent/verification_registry/entries/merge-step-verb-tests.yaml
    action: Create
    purpose: Graduated registry row for VP step 2 (test_selector, guard_target scripts/session/merge_step.py).
  - file: config/agent/verification_registry/entries/approved-text-tests.yaml
    action: Create
    purpose: Graduated registry row for VP step 1 (test_selector, guard_target scripts/roadmap/approved_text.py).
  - file: config/agent/verification_registry/entries/merge-step-retired-routes-absent.yaml
    action: Create
    purpose: >-
      Graduated registry row for VP step 6 (command_exit_zero; check_spec.command is `bash -c` of VP 6's command, the
      form agents-md-contradiction-resolved uses; guard_target docs/contracts/git-ops.yaml).
  - file: scripts/rec_relevance.py
    action: Modify
    purpose: >-
      Add implement_recheck(rec_ids, *, reader=None) -> list of (rec_id, verdict, evidence, proposal): fetch through
      one fetch_recs_by_ids call, evaluate_rec_relevance(run_acceptance_probe=True), and for a verdict other than
      relevant, unknown or satisfied the proposal string from propose_or_close_rec(..., deterministic=False); satisfied
      gets no proposal and no write. It NEVER passes deterministic=True and never calls update_rec (rec-4592). A
      `__main__` CLI `--implement-recheck rec-A[,rec-B]` prints one line per rec (`rec-N <verdict> |
      <evidence[:120]>`, then any proposal) and exits 0; a missing id prints `rec-N missing` and exits 1. New imports
      stay function-local (scripts/backlog_health/classify.py imports this module on the credential-split path).
  - file: tests/test_rec_relevance.py
    action: Modify
    purpose: >-
      Add class TestBundledRecNeverClosedBeforeMerge (rec-4592's acceptance node): a deterministic satisfied verdict
      through implement_recheck leaves update_rec and propose_or_close_rec(deterministic=True) uncalled; a superseded
      verdict yields the close_proposed string from deterministic=False; the CLI prints one line per rec and a missing
      id prints `rec-N missing` and exits 1. Also covers evaluate_rec_relevance's two uncovered `continue` branches (a
