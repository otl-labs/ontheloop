implementation_declared: true
bundled_recommendations: [rec-2437, rec-2733, rec-3856, rec-4244, rec-4443, rec-4592, rec-4687]
followon_recs: [rec-4755, rec-4769, rec-4770]
infrastructure_dependencies: []
acceptance_criteria:
  - Every bundled rec's stored acceptance holds at the PR head (VP step 7).
  - validate_merge_step fails a declared plan whose committed declaration no branch commit's trailer matches exactly, a
    bound file whose words differ from the approved blocks, and a sidecar the build adds, edits or deletes (VP step 3);
    on this plan's own build it reports the trailer PENDING before the commit (VP step 8) and passes the committed
    trailer (VP step 11).
  - approved_text verify accepts rewrapping and a filled `{{DATE}}` and rejects any added, removed or changed word
    anywhere in a bound file, an unfilled placeholder and an unparseable bound YAML file (VP step 1).
  - merge_step recover acts only on this plan's own merge, closes only through close_recs_from_trailer with
    require_acceptance_verdict=True, only for bundled recs readback found missing, and leaves a junit-routed rec open
    without re-executing it; premerge and readback expect no trailer on a merge that declares no implementation (VP
    step 2).
  - The /implement Step 3 re-check never closes a rec (VP step 4).
  - The implement skill, the implement command and git-ops.yaml no longer name the printed close_proposed route, the
    PR-body inheritance claim or the step-3 auto-close (VP step 6); DECISIONS.md keeps the original sentence under the
    dated annotation, exactly as approved (VP step 5).
  - After merge, readback reports every bundled rec in the merge commit and the trailer jobs close them (VP steps 9-10).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Approved-text unit and fixture tests.
    command: bin/venv-python -m pytest tests/test_approved_text.py -q
    expected: All tests pass.
    fix_if: Any failure.
    hermetic: true
    graduation: graduate
    graduation_check_id: approved-text-tests
  - step: 2
    phase: pre-deploy
    action: merge_step verb tests (readback, recover refusals, gate threading and junit rule, premerge, real worktree).
    command: bin/venv-python -m pytest tests/test_session_merge_step.py -q
    expected: All tests pass.
    fix_if: Any failure.
    hermetic: true
    graduation: graduate
    graduation_check_id: merge-step-verb-tests
  - step: 3
    phase: pre-deploy
    action: validate_merge_step red and green cases on fixture repos.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_merge_step.py -q
    expected: All tests pass.
    fix_if: Any failure.
    hermetic: true
    graduation: graduate
    graduation_check_id: merge-step-check-tests
  - step: 4
    phase: pre-deploy
    action: rec-4592's node and rec-4687's class.
    command: >-
      bin/venv-python -m pytest tests/test_rec_relevance.py::TestBundledRecNeverClosedBeforeMerge
      tests/test_rec_trailer_acceptance_premerge.py::TestPremergePreview -q
    expected: All tests pass.
    fix_if: Any failure.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Both targets are bundled recs' own acceptance oracles, which the Decision 201 trailer gate evaluates at closure,
      and the full-tier pytest run keeps them as standing regressions.
  - step: 5
    phase: pre-deploy
    action: The approved-text binding holds on the build branch (the mechanism checking its own build).
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug merge-step-checks --expect affcbc8d328a5335995a4c094cee54e8d3427e4b6e36e8052a13dcb0fcefbc9f
    expected: Prints APPROVED-TEXT OK and the digest the operator approved (the --expect value); exit 0.
    fix_if: >-
      MISMATCH names a file: make that file's words equal the sidecar's `after` text (only `{{DATE}}` may differ); never
      edit the sidecar, which is the operator's approval.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Compares the bound files with their diff-base versions, so it is meaningful only on the build branch and the
      merge push; validate_merge_step's (A) leg is the durable check and step 3's graduated row guards it.
  - step: 6
    phase: pre-deploy
    action: Stale-reference sweep for the retired routes and claims.
    command: >-
      ! grep -rn "printed .close_proposed. command\|which the squash-merge commit body inherits\|auto-closes"
      .claude/skills/implement/SKILL.md .claude/commands/implement.md docs/contracts/git-ops.yaml
    expected: No matches; exit 0.
    fix_if: A match names a surface the sidecar missed; stop and report (the wording is approved text).
    hermetic: true
    graduation: graduate
    graduation_check_id: merge-step-retired-routes-absent
  - step: 7
    phase: pre-deploy
    action: >-
      Commit Flow step, after the trailer commit and the rebase: every bundled rec's stored acceptance holds at the PR
      head (the premerge preview, run for real) on the implementation commit's message, not a later fix-up's.
    command: >-
      git log -1 --grep='^Resolves: ' --format=%B origin/main..HEAD > /tmp/merge-step-msg.txt && bin/venv-python -m
      scripts.session.merge_step premerge
      --slug merge-step-checks --message-file /tmp/merge-step-msg.txt --expect affcbc8d328a5335995a4c094cee54e8d3427e4b6e36e8052a13dcb0fcefbc9f
    expected: >-
      The trailer parses to the seven bundled recs, every PREVIEW line says holds, the approved text verifies at the
      approved digest, no STALE BASE line; exit 0.
    fix_if: >-
      A PREVIEW fails line: fix the code, or correct that rec's acceptance by strengthening only (Decision 181); report a
      reader `unavailable` and retry, never treat it as holds.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: >-
      Commit Flow "Run the full gate locally first" item 4, after the graduation walk and the implementation_declared
      flip: the check sees this plan declared (trailer PENDING until the commit, sidecar exact).
    command: bin/venv-python -m scripts.validate --pre
    expected: >-
      Exit 0; the validate_merge_step section prints `PENDING trailer: declaration not committed` and PASS with 1 plan
      examined.
    fix_if: Read the validate_merge_step section; fix the branch, never the sidecar.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A graduate step may not invoke scripts.validate (recursion), and this run depends on this session's uncommitted
      declaration flip; step 3's graduated row guards the check.
  - step: 11
    phase: pre-deploy
    action: >-
      Commit Flow full tier after the trailer commit and the rebase, then HEAD attestation, before each push
      (handoff_policy); validate_merge_step now enforces the committed trailer.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The full tier exits 0 and the validation result attests the current HEAD's tree.
    fix_if: Any failure -- fix and rerun the full tier from the start.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the
      durable regressions.
  - step: 9
    phase: post-deploy
    action: Read the merge commit back (MERGE_SHA is the sha merge_pull_request returned).
    command: bin/venv-python -m scripts.session.merge_step readback --slug merge-step-checks --sha "$MERGE_SHA"
    expected: READBACK OK naming all seven recs.
    fix_if: READBACK MISSING -- run `bin/venv-python -m scripts.session.merge_step recover --slug merge-step-checks --sha "$MERGE_SHA"`.
  - step: 10
    phase: post-deploy
    action: >-
      After the merge push run's trailer-closure job concludes (Commit Flow step 5): the trailer jobs closed every
      bundled rec through the Decision 201 gate.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows, m =
      fetch_recs_by_ids(make_reader(), ['rec-2437','rec-2733','rec-3856','rec-4244','rec-4443','rec-4592','rec-4687']);
      print(sorted((r['id'], r['status']) for r in rows), m)"
    expected: All seven closed, none missing.
    fix_if: >-
      A rec left open: read the trailer-closure job log at the merge sha and follow git-ops.yaml resolves_trailer's
      route for that marker; never close by hand around a refusal.
