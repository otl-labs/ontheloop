  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Exactly the sidecar's six SKILL.md blocks: Step 3 becomes the one-line --implement-recheck call that never closes;
      the Wait-for-CI all-green line points at Commit Flow step 4; a rec the operator closes stays bundled, and one the
      operator supersedes or declines leaves only by a plan amendment PR; the IMPLEMENTATION commit carries the Resolves
