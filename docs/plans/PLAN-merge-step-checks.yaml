constraints:
  - Approved text is binding. Copy every sidecar `after` verbatim into its file, line breaks included (rec-4244's
    acceptance greps one line and rec-3856's greps the 12 lines after `resolves_trailer:`); never edit the sidecar.
    If a bound file must change any other way, stop and report; that is a new operator ask.
  - Never weaken a check or an acceptance to obtain green (Decision 181; implement-scope-boundary.yaml CONTENT).
  - No CI workflow, IAM, Terraform or Lambda change. Hooks are out of scope (rec-4755 owns the merge-time gate).
  - No rescue agents or workaround loops (Decision 55).
  - 500 SLOC per file (Decision 128). If a new module or test file would exceed it, stop and report a scope amendment
    (sibling helper modules beside the two paths git-ops.yaml pins); never register a budget raise.
  - Stay off plan_document.py and validate_plan_documents.py (another plan owns them); read plans with yaml.safe_load.
  - No file under scripts/session/ may contain the tokens `rec_relevance` or `run_acceptance_probe`, not even in a
    docstring or comment (graduated registry row preflight-never-runs-acceptance-probes).
