schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: monitor-read-budget
intent: >-
  Solves rec-5385 and bundles rec-5420: size the daily telemetry verification monitor's read budget so it reads every
  non-persona (Claude Code) tree and enough persona (litellm) trees before the persona egress plan writes the first
  litellm row. The monitor already hits MAX_READER_CALLS 800 on Claude Code trees alone (runs 44483082984 and
  44696913868 read 61/76 and 68/76 quiet trees; rec-5420 counts it). The plan reads trees on two workers (measured
  1.9x), makes the call cap a runaway guard sized from demand (3,000), reads non-litellm trees first and litellm trees
  in a stable hash order, and once a declared floor of 60 litellm trees is read counts the unread rest as a named
  residual (litellm_sampled_out) instead of monitor_coverage_incomplete. Serves NS.6: persona verdict runs on GitHub
  are verified from their first run without blinding the Claude Code alarms.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-monitor-read-budget.yaml
implementation_declared: true
phase: >-
  T4.32 c1 (telemetry leg, part; rec-5385, the follow-on PLAN-litellm-claude-code-scoping filed); closes no criterion.
  Must merge before the persona egress plan (E3) sends the first litellm row. Nothing deploys: the monitor runs from the
  repository in telemetry-verification.yml, so the first scheduled run after merge uses it.
closes_criteria: []
cites: [dec:101, dec:181, dec:210, dec:235]
scope:
  - file: scripts/telemetry_verify/monitor_capacity.py
    action: Create
    purpose: >-
      Pure capacity helpers, standard library only: MONITOR_WORKERS = 2; LITELLM_FLOOR = 60; LITELLM_ROOT_PREFIX =
      "litellm:" (a literal: the oracle never imports producer code; a test pins it to src.turn_capture.refs);
      is_litellm(root) on the root row's entity_ref (monitor._root_row now carries entity_ref, which
      telemetry_root_sessions already returns); read_order(quiet) = every non-litellm root in the given order,
      then litellm roots sorted by sha256(session_id) hex; sampled_out(statuses, litellm_flags, floor) returning the
      unread-by-budget litellm trees excused (non-zero only when no non-litellm tree is unread by budget and at least
      min(floor, litellm trees to read) litellm trees were compared; moved or collided trees are not clean samples and
      do not count toward the floor); CallStats, a lock-guarded recorder of call seconds with
      calls_over_10s (calls lasting strictly more than 10 s) and call_p95_s (whole seconds, ceil) over every gated call and both describes (the calls
      reader_calls counts).
  - file: scripts/telemetry_verify/monitor.py
    action: Modify
    purpose: >-
      MAX_READER_CALLS 800 -> 3000. _Gate's __call__ holds one threading.Lock around the cap and time check (an
      unlocked private helper that open() also calls) and the count increment, so two workers never pass the cap; the
      time rule already holds under concurrency, since each in-flight call started with at least 900 s left and lasts
      at most 450 s. open() never takes that non-reentrant lock, so _process's own gate.open() pre-check stays advisory
      and cannot deadlock. The same lock guards max_call_s/max_bytes, and the gate records each call's seconds in a
      CallStats. _root_row keeps entity_ref. run_monitor gains workers: int = 1 (so every existing
      caller and test stays sequential; only __main__ passes MONITOR_WORKERS); to_read is
      read_order(quiet)[skip_trees:] (quiet sorted as today first, so skip_trees and next_skip stay positional over the
      new order); the tree phase runs _process over to_read on a ThreadPoolExecutor(max_workers=workers) with map, so
      outcomes keep input order (workers=1 is today's sequential behaviour). The report gains workers, litellm_quiet (litellm
      trees in to_read), litellm_read (litellm trees compared; the floor's count), litellm_sampled_out, calls_over_10s and call_p95_s; not_read_budget counts only unexcused budget
      outcomes (budget outcomes minus litellm_sampled_out), so coverage_incomplete's formula is unchanged and an excused
      litellm tree never raises monitor_coverage_incomplete. MONITOR_BUDGET_S, CALL_WORST_CASE_S, FILING_RESERVE_S,
      MAX_TREE_CALLS, the run-level and day-level phases (still sequential) and _stops are unchanged. monitor.py reads
      monitor_capacity.LITELLM_FLOOR and MONITOR_WORKERS as module attributes at call time (import the module, never
      from-import the constants), so tests can monkeypatch them; no workers == 1 branch, and the excusal branching stays
      in monitor_capacity, so every new monitor.py line runs at workers=1 under test_monitor.py's per-file coverage.
  - file: scripts/telemetry_verify/__main__.py
    action: Modify
    purpose: >-
      monitor_line adds workers, litellm_quiet, litellm_read, litellm_sampled_out, calls_over_10s and call_p95_s after
      max_response_bytes and before alarms (counts and whole seconds only, Decision 101); run_monitor_command passes
      workers=monitor_capacity.MONITOR_WORKERS to run_monitor.
  - file: tests/telemetry_verify/test_monitor_capacity.py
    action: Create
    purpose: >-
      rec-5385 acceptance (named nodes in test_obligations); pure nodes need no duckdb; golden-world nodes call
      pytest.importorskip("duckdb", reason="env: duckdb is not installed in the fast tier") inside the test. Its World
      serialises named() with one threading.RLock (the DuckDB connection, the before/after hooks and the clock; reentrant,
      so a hook or the clock read inside named() never deadlocks), since a shared DuckDB connection is not thread-safe.
  - file: tests/telemetry_verify/test_main.py
    action: Modify
    purpose: >-
      MONITOR_LINE regex gains the six new fields in their order (fullmatch); new node
      test_monitor_command_runs_two_workers asserts run_monitor_command passes workers=MONITOR_WORKERS (a recording fake
      run_monitor); new node test_monitor_line_wires_each_new_field formats a report with workers=2, litellm_quiet=5,
      litellm_read=4, litellm_sampled_out=1, calls_over_10s=3 and call_p95_s=12 and asserts each name=value substring,
      so a field wired from the wrong attribute is red.
bundled_recommendations: [rec-5385, rec-5420]
followon_recs: [rec-5481]
infrastructure_dependencies: []
acceptance_criteria:
  - bin/venv-python -m pytest tests/telemetry_verify/test_monitor_capacity.py -q exits 0 (rec-5385's acceptance).
  - >-
    A session monitor run on the latest quiet day exits 0 under --no-alarms --assert-zero monitor_coverage_incomplete
    and prints workers=2 not_read_budget=0 litellm_sampled_out=0 (rec-5420's acceptance, its zero from capacity, not sampling).
  - >-
    The existing tests/telemetry_verify/test_monitor.py and tests/telemetry/test_parent_observation_orphan_monitor.py
    pass unchanged (run_monitor defaults to workers=1), and on the golden world workers=1 and workers=2 reports are equal
    excluding run_level_s, elapsed_s, max_call_s, calls_over_10s, call_p95_s and workers.
  - >-
    No call starts once MAX_READER_CALLS - 1 calls are made (one kept for the closing describe) or fewer than
    2 x CALL_WORST_CASE_S of MONITOR_BUDGET_S remain, with two concurrent callers.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The duckdb-free capacity nodes (order, floor, gate, call stats, prefix pin), which PR CI's fast tier replays.
    command: >-
      bin/venv-python -m pytest -q
      tests/telemetry_verify/test_monitor_capacity.py::test_read_order_puts_non_litellm_roots_first_in_given_order
      tests/telemetry_verify/test_monitor_capacity.py::test_litellm_roots_follow_in_a_stable_hash_order
      tests/telemetry_verify/test_monitor_capacity.py::test_floor_met_excuses_unread_litellm_trees
      tests/telemetry_verify/test_monitor_capacity.py::test_floor_missed_or_non_litellm_unread_excuses_nothing
      tests/telemetry_verify/test_monitor_capacity.py::test_gate_holds_cap_and_time_rule_across_two_workers
      tests/telemetry_verify/test_monitor_capacity.py::test_call_stats_count_slow_calls_and_p95
      tests/telemetry_verify/test_monitor_capacity.py::test_litellm_prefix_matches_the_producer_root_ref
    expected: >-
      Exit 0, seven nodes pass. Red before on main: the file and scripts/telemetry_verify/monitor_capacity.py do not
      exist, so collection fails. The gate node is deterministic: MAX_READER_CALLS monkeypatched to 2 (so exactly one call
      may start), a Budget whose clock sleeps 0.05 s on every read (widening the window between open() and the count
      increment), and two threads released together by a threading.Barrier each attempting one gate call; it asserts one
      call reached named() and the other raised _Refused. With _Gate unlocked both pass open() inside the sleep and two
      calls reach named(), so the node is red (near-certain under the sleep, not guaranteed; the red-before on main is collection failure regardless). Its time leg: the cap patched large, a Budget of 2 x CALL_WORST_CASE_S +
      1.5 s on a lock-guarded fake clock that returns 0 at Budget creation and advances 1 s per read, two threads released
      together: only the first read after creation leaves 2 x CALL_WORST_CASE_S (900.5 s) and every later read leaves less,
      so exactly one call starts and the other raises _Refused under any thread scheduling. The time leg pins the
      concurrent time rule only and passes with or without the lock; the cap leg is the lock's red-before evidence. On a simulated build all seven pass.
    expected_literals:
      - 7 passed
    fix_if: A failure is the helper or the gate lock; fix the source, never the test. The prefix node failing means the producer's root ref changed; STOP to the plan owner.
    hermetic: true
    graduation: graduate
    graduation_check_id: monitor-read-budget
  - step: 2
    phase: pre-deploy
    action: The whole capacity file (golden-world nodes included) and the standing monitor and CLI tests.
    command: >-
      bin/venv-python -m pytest -q tests/telemetry_verify/test_monitor_capacity.py tests/telemetry_verify/test_monitor.py
      tests/telemetry_verify/test_main.py tests/telemetry_verify/test_package_boundary.py tests/telemetry/test_parent_observation_orphan_monitor.py
    expected: >-
      Exit 0 in a session with duckdb. The golden-world nodes, by name: test_two_workers_report_equals_one_worker
      (the equality pair runs at the World's default cost 0, where the default Budget never binds: equal reports
      excluding run_level_s, elapsed_s, max_call_s, calls_over_10s, call_p95_s and workers; then, with world.cost = 11.0
      and budget=monitor.Budget(10**6, world.clock) so the time rule cannot cut the world short, a workers=1 run asserts
      calls_over_10s == reader_calls - 2 (the two describes cost 0) and call_p95_s == 11, and a workers=2 run asserts
      workers == 2, calls_over_10s == reader_calls - 2 and call_p95_s >= 11, since the serialised World adds the other
      worker's call to a waiting call's measured seconds; a report that always prints 0 is red);
      test_floor_met_excuses_litellm_without_coverage_alarm, test_floor_missed_raises_coverage_incomplete and
      test_oversize_day_counts_sum_and_backfill_reads_rest (the cases below); with LITELLM_FLOOR monkeypatched to 0, workers=1, and MAX_READER_CALLS monkeypatched to the full run's reader_calls minus the litellm tree's calls (measured from a full run in the same node, so the cap, not the clock, refuses exactly that last tree),
      every non-litellm tree is compared, litellm_sampled_out is 1, not_read_budget 0, monitor_coverage_incomplete
      absent from findings(), and the orphan_* and rederivation_mismatch:sessions_window classes equal the full-read run's;
      with the floor at 1 the same run raises monitor_coverage_incomplete 1; on an oversize day
      trees_read + tree_too_large + tree_read_failed + not_read_budget + litellm_sampled_out equals quiet - skip_trees,
      and a second run with skip_trees = next_skip reads the rest. Red before: those nodes fail (no workers parameter, no
      litellm_sampled_out); the new regex and test_monitor_command_runs_two_workers fail against main's line and CLI.
    fix_if: A golden-world mismatch between worker counts is first checked against the harness (a budget that binds, or the serialised World clock inflating a call's seconds); only then is it a thread-safety or ordering defect in monitor.py; fix the source. An excused run whose orphan_* or sessions_window classes differ from the full-read run's means an unread litellm tree leaks into the day-level comparison; fix the source (judge only compared trees). A changed existing assertion is a STOP to the plan owner.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The fast-tier runner has no duckdb, so these nodes cannot replay there; the full tier runs them on every merge, which is the standing guard for the golden-world behaviour.
  - step: 3
    phase: pre-deploy
    action: Fast tier, size and import boundary on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0; validate_sloc_limits passes with monitor.py and monitor_capacity.py each under 500 SLOC.
    fix_if: A SLOC breach on monitor.py moves more helpers into monitor_capacity.py (never a budget raise, Decision 128).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: PR CI runs the fast tier on every PR, so a graduated copy would add no guard.
  - step: 4
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      Full tier passes and --verify-head confirms it for the head. Start it backgrounded with a 2 h limit from the
      top-level session (a subagent never receives the completion), with HOME an empty directory
      (tests/test_aws_profile.py); its verdict is --verify-head, never a pipe's exit status.
    fix_if: A failure in scope is fixed; one outside scope (a main red owned elsewhere, such as rec-5468) is a STOP to the plan owner, never fixed here.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: rec-5420's acceptance on merged main from the session (agent_platform profile), backgrounded with a 2 h limit, on the latest quiet day, started outside 00:41-01:55 UTC and only when no telemetry-verification run is in progress (two two-worker runs would fill the reader's 4 reserved slots).
    command: >-
      set -o pipefail; log="$(mktemp)"; AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_verify monitor --no-alarms --assert-zero
      monitor_coverage_incomplete 2>&1 | tee "$log" && grep -E '^MONITOR .* not_read_budget=0 .*
      workers=2 litellm_quiet=0 litellm_read=0 litellm_sampled_out=0 ' "$log"
    expected: >-
      The monitor exits 0 and grep prints the MONITOR line. Record reader_calls, elapsed_s, max_call_s, calls_over_10s
      and call_p95_s verbatim in the closure report (counts only). elapsed_s well under 2,000 (about 600 s expected for
      about 880 calls at 0.64 s; recorded, not asserted). tree_read_failed is the signal attributable to this run's two
      workers (a throttled call counts there); step 6's daily sums are context, not attribution.
    fix_if: >-
      not_read_budget above 0 at workers=2 means the measured speedup did not hold on a full run; tree_read_failed above
      0 with throttles in step 6 means two workers contend for the reader's 4 reserved slots. Either is a STOP to the plan
      owner (the fallback, a second credential session, is a plan amendment), never a cap edit in the build. If the persona egress plan (E3) has already written litellm
      rows, the litellm_quiet=0 litellm_read=0 literals fail for that reason alone: a STOP to re-scope the assertion, not a
      build defect.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: Telemetry reader throttles and invocations for the day of step 5 (Decision 82 fan-out; Decision 215 evidence).
    command: >-
      AWS_PROFILE=agent_platform aws cloudwatch get-metric-statistics --region "$(cat config/aws-region)"
      --namespace AWS/Lambda --metric-name Throttles --dimensions Name=FunctionName,Value=agent-platform-ducklake-telemetry-reader
      --start-time "$(date -u -d '-1 day' +%Y-%m-%dT00:00:00Z)" --end-time "$(date -u -d '+1 day' +%Y-%m-%dT00:00:00Z)"
      --period 86400 --statistics Sum --query 'Datapoints[].Sum' --output text | tr '\t' '\n' |
      awk 'NF {print "throttles", $1; if ($1 + 0 > 7) bad = 1} END {exit bad}' &&
      AWS_PROFILE=agent_platform aws cloudwatch get-metric-statistics --region "$(cat config/aws-region)"
      --namespace AWS/Lambda --metric-name Invocations --dimensions Name=FunctionName,Value=agent-platform-ducklake-telemetry-reader
      --start-time "$(date -u -d '-1 day' +%Y-%m-%dT00:00:00Z)" --end-time "$(date -u -d '+1 day' +%Y-%m-%dT00:00:00Z)"
      --period 86400 --statistics Sum --query 'Datapoints[].Sum' --output text
    expected: >-
      Prints the daily throttle sums, then the daily invocation sums; record both in the closure report. The
      7-day baseline before this plan (11-13..11-19) averaged about 1,370 invocations a day (max 2,622) with 7 throttles on
      11-17 and 1 on 11-20. Pass: no day's throttle sum above 7 (the awk exits 1 otherwise, so the command fails).
    fix_if: A day's throttle sum above 7 is a STOP to the plan owner (drop to one worker or amend), never a reserved-concurrency change in the build.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Both recs closed and rec-4439 carries residual (9). rec-5385 by the squash merge's Resolves trailer; rec-5420 by update_rec after step 5 (its acceptance needs the warehouse, which the CI closure job lacks).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows,_=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-5385','rec-5420','rec-4439']); s={r['id']: r['status'] for r in rows};
      print(s); assert s['rec-5385']==s['rec-5420']=='closed';
      assert 'litellm_sampled_out' in next(r['context'] for r in rows if r['id']=='rec-4439')"
    expected: Prints the three statuses; rec-5385 and rec-5420 closed and rec-4439's context names residual (9) litellm_sampled_out.
    fix_if: rec-5385 open means the trailer was missing, its acceptance failed, or the closure job judged it undecidable (re-read it with recs_by_ids); rec-5420 open means update_rec was not run with step 5's MONITOR line as closure artifact.
    hermetic: false
    graduation: not-applicable
