    run_monitor, read_order, the thread pool, the new report fields and not_read_budget net of litellm_sampled_out. Keep
    every existing public name importable from monitor (tests monkeypatch monitor.MAX_READER_CALLS).
  - Modify scripts/telemetry_verify/__main__.py's monitor_line and tests/telemetry_verify/test_main.py's MONITOR_LINE.
  - >-
    Create tests/telemetry_verify/test_monitor_capacity.py: step 1's seven duckdb-free nodes, and golden-world nodes
    (duckdb importorskip inside each, World built from tests.fixtures.telemetry_golden_chain and
