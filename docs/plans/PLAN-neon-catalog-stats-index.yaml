  Neon, tuned now and capped next, with measured triggers to move (amends Decision 107 and Decision 88)". ENVELOPE:
  significance value numbered_decision; justification "Resets Decision 107's swap-back triggers and adds a standing
  invariant to Decision 88, with reversal conditions -- a commitment no contract note or amendment_forms annotation can
  carry; ducklake_maintenance.yaml carries the verb's field semantics." PROBLEM: the operator proposed a pre-emptive
  move to RDS (cost ~$10/month and rising with agents, cold starts, egress); an independent review found the measured
  pain has cheaper causes: Lambda p95 26-55 s and commit p95 5.5 s against a 2,000 ms budget, with DuckLake's fix for
