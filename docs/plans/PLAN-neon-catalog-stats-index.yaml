bundled_recommendations: []
followon_recs:
- rec-4220
- rec-4221
- rec-4222
- rec-4223
infrastructure_dependencies:
- >-
  neon_project.ducklake_catalog in-place update of history_retention_seconds only; the guard's neon_* rule routes it to
  tf-gated-apply, so the operator approves the Environment run. No IAM change: the maintenance role already reads the
  DSN secret it connects with, and psycopg2 is in the ducklake-deps layer.
- >-
  Lambda deploy: compute_affected_artifacts names six active artifacts. Five are DuckLake functions --
  ducklake_maintenance, ducklake_reader, ducklake_writer, ducklake_maintenance_smoke and ducklake_catalog_dr (the last
  only through the shared src/common/ducklake_metrics.py) -- all shipped by one run of the governed channel
  (.github/workflows/deploy-ducklake-lambdas.yml) at merge (Decision 125/126), with its per-function smoke gates. The
  sixth, data-pipeline, is matched only by its own manifest's excludes row (the manifest self-match rule): its zip is
  unchanged and deploy-prod-lambdas.yml does not trigger on that path, so it needs no deploy. Recompute the set after
  rebasing: a newly active manifest that bundles ducklake_metrics.py adds to it (PLAN-telemetry-writer-function's
  agent-platform-ducklake-telemetry-writer, if it has landed) and changes VP 9's grep alternation and count. The merge
  waits for the operator's word (always-ask: governed DuckLake Lambda deploys).
- >-
  Sequencing: PLAN-url-only-invoke-guard's implementation is merged (#1432, cdc380d5): Decision 213 is taken and the
  maintenance handler is at 497 SLOC with provision_telemetry_login registered. Rebase on origin/main before work.
acceptance_criteria:
- >-
  ensure_catalog_indexes refuses without confirm, enumerates every catalog schema from pg_catalog, builds the index
  CONCURRENTLY under autocommit and a bounded statement_timeout, rebuilds an invalid one, leaves an equivalent index
  alone, and returns only booleans, the migration hash and the pushdown probe's counters (or its error class); it is
  registered only on the admin maintenance function and declared in the contract.
- >-
  catalog_reinit leaves the re-initialised schema with a valid index; control_health reports StatsIndexValid and both
  scan counters per schema without ever raising on them, even when an invariant raises; catalog_stats reports
  stats_index; both results are JSON-serialisable; the moved actions behave as before.
- >-
  Reader and writer log exactly one ducklake_invocation line per invocation on every path, carrying only the fixed
  fields and registered action names.
- neon_ducklake_catalog.tf sets history_retention_seconds = 604800 and the apply goes through tf-gated-apply.
- >-
  Decision N (<= 6,144 bytes, amends [107, 88], significance numbered_decision, five-condition reversal stanza) exists
  and Decisions 107 and 88 carry dated annotations naming it.
- >-
  Post-deploy: the operator's invocation reports a valid index on ducklake_ops and ducklake_smoke and
  pushdown_probe.engaged true; after the 6 h pickup every post-index control_health window reports StatsIndexValid 1 and
  at least one reports a positive FileColumnStatsIdxScan (the counters are reported, not asserted as deltas, because they
  may reset on every Neon resume). Warm-container pickup and step 13's latency comparison are recorded, not
  pass/fail: they feed rec-4220, rec-4170 and Decision N's reversal conditions.
- The full validation tier passes.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The ensure verb's refusal, enumeration, build, rebuild, redaction, pushdown probe, SQL shape and contract declaration.
  command: >-
    bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/test_index_actions.py::test_refuses_without_confirm
    tests/lambdas/ducklake_maintenance/test_index_actions.py::test_builds_absent_and_rebuilds_invalid_per_enumerated_schema
    tests/lambdas/ducklake_maintenance/test_index_actions.py::test_errors_never_carry_host
    tests/lambdas/ducklake_maintenance/test_index_actions.py::test_pushdown_probe_reports_engagement
    tests/lambdas/ducklake_maintenance/test_index_actions.py::test_sql_file_statement_shape
    tests/lambdas/ducklake_maintenance/test_index_actions.py::test_manifest_ships_sql_asset
    tests/lambdas/ducklake_maintenance/test_index_actions.py::test_contract_declares_verb -q
  expected: 'Exit 0, 7 passed. Red before: the module does not exist.'
  fix_if: Fix the verb or the contract entry, never the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: ensure-catalog-indexes-verb
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: Index-status helpers, health emission, catalog_stats, dispatch and the moved actions' existing tests.
  command: >-
    bin/venv-python -m pytest tests/common/test_ducklake_catalog_index_status.py tests/lambdas/ducklake_maintenance/test_health_actions.py
    tests/lambdas/ducklake_maintenance/test__shared.py tests/lambdas/ducklake_maintenance/handler tests/test_ducklake_maintenance.py -q
  expected: Exit 0.
  fix_if: Fix the moved or new code; the moved control_health/catalog_stats behaviour must be unchanged.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A whole-file and whole-directory re-run of test files this plan creates or modifies (vp-red-before hermetic
    exception v); those files are the standing guard in the pytest tier, and a registry row would duplicate them.
- step: 3
  phase: pre-deploy
  action: The per-invocation log line on reader and writer.
  command: >-
    bin/venv-python -m pytest tests/test_ducklake_reader_handler.py::test_one_invocation_line_per_path
    tests/lambdas/ducklake_writer/handler/test_invocation_log.py::test_one_invocation_line_per_path
    tests/common/test_ducklake_metrics.py::test_log_invocation_fixed_fields -q
  expected: 'Exit 0, 3 passed. Red before: none of the three tests exists.'
  fix_if: Fix the handler or helper; never log a payload value.
  hermetic: false
  graduation: graduate
  graduation_check_id: ducklake-invocation-log-line
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: >-
    The Terraform value. Formatting is CI's terraform-validate job (scripts.validate --terraform-only): the DEV container
    has no terraform binary (bin/setup-cloud-env.sh installs it only with INSTALL_TERRAFORM=1, the admin environment), and
    a value-only edit on an existing line cannot change fmt alignment.
  command: bin/venv-python -m pytest tests/checks/iam_tf/test_neon_catalog_history_retention.py -q
  expected: Exit 0.
  fix_if: Set the value; never run terraform locally (Decision 119; CI's terraform-validate is the authority).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A whole-file re-run of a test file this plan creates (vp-red-before hermetic exception v); the test is itself the
    standing guard in the pytest tier, and a registry row would duplicate it.
- step: 5
  phase: pre-deploy
  action: The Decision, its envelope, clause anchors, reversal ids and the annotations on 107 and 88.
  command: >-
    bin/venv-python -m pytest tests/checks/decisions/test_neon_catalog_tuning_decision.py::test_decision_entry_and_annotations -q
  expected: 'Exit 0, 1 passed. Red before: the module does not exist.'
