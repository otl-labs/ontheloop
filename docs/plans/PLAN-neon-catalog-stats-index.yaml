  fix_if: Diagnose the failed job per the deploy channel's rules (Decision 125); never deploy by hand.
  hermetic: false
- step: 10
  phase: post-deploy
  action: >-
    Baseline with the new lines (at least 48 h after deploy, before the index): cold elapsed, cold connect_ms and warm
    elapsed percentiles, reopen count and Lambda Init Duration p95 per function, from FilterLogEvents (PlatformDev's grant), saved without
    hostnames to /mnt/project-files/neon-tuning/baseline.json.
  command: >-
    S=/mnt/project-files/neon-tuning; mkdir -p $S; for fn in reader writer; do aws logs filter-log-events --profile
    agent_platform --region eu-west-2 --log-group-name /aws/lambda/agent-platform-ducklake-$fn --start-time $(( ($(date
    +%s) - 172800) * 1000 )) --filter-pattern '{ $.event = "ducklake_invocation" }' --query 'events[].message' --output
    json > $S/inv-$fn.json && aws logs filter-log-events --profile agent_platform --region eu-west-2 --log-group-name
    /aws/lambda/agent-platform-ducklake-$fn --start-time $(( ($(date +%s) - 172800) * 1000 )) --filter-pattern 'REPORT'
    --query 'events[].message' --output json > $S/report-$fn.json; done && bin/venv-python -c "import json,re;S='$S';
    P=lambda v,q:sorted(v)[int(q*(len(v)-1))] if v else None;G=lambda L:{'n':len(L),'p50':P(L,.5),'p95':P(L,.95)};
    R=lambda fn:[json.loads(m) for m in json.load(open(f'{S}/inv-{fn}.json'))];o={fn:{'cold':G([r['elapsed_ms'] for r
    in R(fn) if r['connect_reused'] is False]),'cold_connect':G([r['connect_ms'] for r in R(fn) if r['connect_reused']
    is False and r['connect_ms'] is not None]),'warm':G([r['elapsed_ms'] for r in R(fn) if r['connect_reused'] is
    True]),'reopened':sum(1 for r in R(fn) if r['reopened']),'init_p95':P([float(x) for x in re.findall(r'Init
    Duration: ([0-9.]+)',' '.join(json.load(open(f'{S}/report-{fn}.json'))))],.95)} for fn in
    ('reader','writer')};json.dump(o,open(f'{S}/baseline.json','w'),indent=1);print(json.dumps(o))"
  expected: >-
    baseline.json written with cold elapsed, cold connect_ms (the cold-attach signal) and warm elapsed n/p50/p95, reopen
    counts and Init Duration p95 for reader and writer, each n greater than zero.
  fix_if: No lines found -- the deploy did not ship the log helper; check step 9.
  hermetic: false
- step: 11
  phase: post-deploy
  action: >-
    The operator invokes the verb once on production (Lambda console test event on agent-platform-ducklake-maintenance,
    event {"action": "ensure_catalog_indexes", "confirm": "ducklake_file_column_stats"}) and pastes the response into the
    thread; the agent saves it to $ENSURE_RESPONSE_FILE and exports INDEX_CREATED_AT (the response time, ISO 8601 UTC).
    Warm containers pick the index up at their next ATTACH (Neon's 5-minute scale-to-zero ends idle sessions and Lambda
    recycles idle containers); a few reset_warm_connection calls on reader and writer speed this up but are optional, so
    step 12 starts 6 h later.
  command: >-
    bin/venv-python -c "import json,os;r=json.load(open(os.environ['ENSURE_RESPONSE_FILE']));r=json.loads(r['body']) if 'body' in r else r;
    s=r['schemas'];assert r['ok'] and s['ducklake_ops']['valid_after'] and s['ducklake_smoke']['valid_after'];
    assert r['pushdown_probe']['engaged'];print('INDEX_VALID')"
  expected: >-
    INDEX_VALID printed: ok true, valid_after true for ducklake_ops and ducklake_smoke, and pushdown_probe.engaged
    true.
  fix_if: >-
    a 500 runtime error naming a class and SQLSTATE (for example QueryCanceled 57014, a build blocked past the 300 s
    timeout) or a post-build invalid index -> the operator re-runs the verb (it rebuilds an invalid index); a 500
    runtime refusal naming the confirm value -> check the event's confirm; engaged null -> read error_class and ask the operator to re-run the verb (the index result stands); engaged false with a
    valid index -> the operator re-runs the verb once (the index is a no-op then and only the probe repeats), and only if
    it is still false is the extension not pushing down: record the ducklake extension build from a connect_probe and
    file a rec (never add other indexes speculatively); never run DDL any other way.
  hermetic: false
- step: 12
  phase: post-deploy
  action: >-
    Production reporting over at least two control_health windows after the 6 h pickup (export BASELINE_START as the
    deploy time): StatsIndexValid is 1 for ducklake_ops in every window after INDEX_CREATED_AT and at least one of those
    windows reports a positive FileColumnStatsIdxScan; the idx and seq readings before and after are recorded. The
    counters are counts since the last statistics reset, which may happen on every Neon resume, so they are reported,
    never differenced; step 11's pushdown probe is the engagement proof.
  command: >-
    S=/mnt/project-files/neon-tuning; for m in StatsIndexValid FileColumnStatsIdxScan FileColumnStatsSeqScan; do aws
    cloudwatch get-metric-statistics --profile agent_platform --region eu-west-2 --namespace DuckLakeMaintenance
    --metric-name $m --dimensions Name=MetaSchema,Value=ducklake_ops --start-time "$BASELINE_START" --end-time $(date -u
    +%FT%TZ) --period 21600 --statistics Maximum --output json > $S/$m.json; done && bin/venv-python -c "import json,os;
    S='$S';T=os.environ['INDEX_CREATED_AT'];L=lambda m:[(p['Timestamp'],p['Maximum']) for p in
    sorted(json.load(open(f'{S}/{m}.json'))['Datapoints'],key=lambda p:p['Timestamp'])];v=[x for t,x in
    L('StatsIndexValid') if t>=T];i=[x for t,x in L('FileColumnStatsIdxScan') if t>=T];assert len(v)>=2 and
    all(x==1 for x in v);assert any(x>0 for x in i);print('REPORTED',json.dumps({m:L(m) for m in
    ('FileColumnStatsIdxScan','FileColumnStatsSeqScan')}))"
  expected: REPORTED printed with both counter series, after at least two post-index windows all reporting a valid index.
  fix_if: >-
    StatsIndexValid 0 after INDEX_CREATED_AT -> the index went invalid or missing: re-run the verb and read its
    response; no positive idx reading -> compare with step 11's probe before concluding anything, since a resumed
    compute may simply have seen no filtered reads in that window.
  hermetic: false
- step: 13
  phase: post-deploy
  action: >-
    Seven days after step 11: CommitLatencyMs p50/p95 and step 10's decomposition re-run for the same 7 days (change
    172800 to 604800 and baseline.json to after-7d.json), compared with step 10 and the 14-day CloudWatch baseline in
    context; record both on rec-4220, which carries the scale-to-zero choice and the index alarm, and on rec-4170, whose
    latency gate Decision N cl.4 repoints. Decision N cl.4's two subjects are the writer's warm elapsed p95 (against
    2,000 ms) and the cold_connect p95 (cold attach, against 3 s), never cold elapsed, which includes the action's own
    time. Recorded, not pass/fail.
  command: >-
    aws cloudwatch get-metric-statistics --profile agent_platform --region eu-west-2 --namespace DuckLakeWriter --metric-name
    CommitLatencyMs --start-time $(date -u -d '-7 days' +%FT%TZ) --end-time $(date -u +%FT%TZ) --period 604800
    --extended-statistics p50 p95 --output json
  expected: >-
    p50 and p95 recorded beside the baseline (p50 2.7 s, p95 5.5 s) and the after-7d decomposition beside
    baseline.json; rec-4220's and rec-4170's context are updated through the portal with both.
  fix_if: Missing data -- check control_health and the deploy; do not re-run the index.
  hermetic: false
