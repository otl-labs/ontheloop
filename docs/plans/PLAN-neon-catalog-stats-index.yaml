    validate_lambda_bundle_completeness as v;f=[];v(f);print(f);assert not f;print('BUNDLES_OK')"
  expected: Exit 0, an empty failure list and the success marker; every handler import resolves inside its bundle.
  fix_if: Add the missing include or asset to the manifest.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Duplicates the standing validate_lambda_bundle_completeness check, which runs in the full tier.
- step: 7
  phase: pre-deploy
  action: Full validation tier before handoff.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; never raise a budget or skip a check.
