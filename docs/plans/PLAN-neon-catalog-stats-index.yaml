- step: 8
  phase: post-deploy
  action: >-
    The PR's saved plan holds exactly one in-place update (neon_project.ducklake_catalog, history_retention_seconds
    21600 -> 604800); the merge run's guard routed only that resource to tf-gated-apply; after the operator approves, the
    gated-apply job applied it. On push the merge run applies the PR's saved plan without re-planning, so the attribute
    diff exists only in the PR's plan output. Capture first, with mcp__github__ tools: the PR's "Terraform Speculative
    Plan" comment body (rendered with terraform show -no-color) or the PR run's speculative-plan job log into
    $PLAN_LOG_FILE; the merge run's apply-sandbox job log (the guard's BLOCKED listing) into $GUARD_LOG_FILE; the
    gated-apply job log into $APPLY_LOG_FILE. Raw job logs can carry ANSI colour codes, so all three are stripped first.
  command: >-
    for f in "$PLAN_LOG_FILE" "$GUARD_LOG_FILE" "$APPLY_LOG_FILE"; do sed -i 's/\x1b\[[0-9;]*m//g' "$f"; done && grep -qE
    'history_retention_seconds += 21600 -> 604800' "$PLAN_LOG_FILE" && grep -qE 'Plan: 0 to add, 1 to change, 0 to
    destroy' "$PLAN_LOG_FILE" && grep -q 'terraform_apply_guard: BLOCKED' "$GUARD_LOG_FILE" && test "$(grep -cE ' - [^ ]+
    \([a-z0-9_]+\) actions=' "$GUARD_LOG_FILE")" = 1 && grep -qF "neon_project.ducklake_catalog (neon_project)
    actions=['update']" "$GUARD_LOG_FILE" && grep -qE 'Apply complete! Resources: 0 added, 1 changed, 0 destroyed'
    "$APPLY_LOG_FILE"
  expected: >-
    The plan shows the one attribute change and nothing else, the guard lists exactly one resource (the neon_project
    update), and the gated apply completed with 1 changed.
  fix_if: Any other resource in the plan or the guard listing is drift -- stop and report.
  hermetic: false
