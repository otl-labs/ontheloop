schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: neon-catalog-stats-index
intent: >-
  Keep the DuckLake catalog -- the metadata store under every warehouse read and write the platform's agents make --
  on Neon and make it fast and recoverable before re-deciding a move: engage DuckLake's upstream fix for the
  per-query full scan of ducklake_file_column_stats (issue #859, PR #1147) by creating the (table_id, column_id) index
  it needs through an operator-only maintenance verb, add the per-invocation telemetry that attributes today's 26-55 s
  Lambda tails, raise Neon point-in-time history to the 7 days Decisions 88 and 107 already assume, and record the
  deferred RDS move with its re-open triggers in a numbered Decision.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V3
plan_path: docs/plans/PLAN-neon-catalog-stats-index.yaml
phase: >-
  No tier_item: an operator-directed catalog tuning (soft-warn category user_explicit_out_of_scope). Relates to T2.19
  (c11 latency headroom evidence) and rec-4170 (writer commit latency above the 2,000 ms budget), which it measures
  but does not close. The compute cap and the index alarm are follow-on rec-4220; the deferred RDS design lives on
  rec-4223.
scope:
- file: src/lambdas/ducklake_maintenance/catalog_stats_index.sql
  action: Create
  purpose: >-
    The index DDL of record, beside the verb that applies it (an edit triggers the governed deploy and the drift
    sensor; the precedent is Decision 213's ducklake_telemetry_writer_role.sql). Header in the
    migrations/ducklake_ops_schema.sql style: what, why (issue #859 / PR #1147: DuckLake pushes the stats filter
    through postgres_query() only when an index on (table_id, column_id) exists; "the index must currently be manually
    created by the user"), and how it is applied (ensure_catalog_indexes, owner login, autocommit, a bounded
    statement_timeout, never inside a transaction). Body: exactly one statement with a {meta_schema} placeholder:
    CREATE INDEX CONCURRENTLY ducklake_file_column_stats_table_id_column_id_idx ON
    {meta_schema}.ducklake_file_column_stats (table_id, column_id); -- no IF NOT EXISTS (a failed concurrent build
    leaves an INVALID index that IF NOT EXISTS would accept).
- file: src/common/ducklake_catalog_index_status.py
  action: Create
  purpose: >-
    Read-only, the single source the verb, control_health and catalog_stats all read (no duplicated SQL):
    catalog_index_schemas(cur) -> the schemas holding a ducklake_file_column_stats table, from pg_catalog (Decision
    191's enumeration principle, never a hard-coded pair); catalog_index_status(cur, meta_schema) -> {present, valid,
    index_name, idx_scan, size_bytes, table_seq_scan, stats_reset}, with stats_reset cast to text in SQL
    (stats_reset::text) so every value is JSON-serialisable. present/valid hold for the fixed index name OR any
    equivalent index whose key columns are exactly (table_id, column_id) or (column_id, table_id), so a future
    DuckLake-created index is recognised and never duplicated; counters come from pg_stat_user_indexes and
    pg_stat_user_tables, stats_reset from pg_stat_database. Stdlib only (the caller passes the cursor). A new module
    rather than ducklake_maintenance.py growth because that file is at 446 of 500 SLOC (Decision 128); it ships in both
    the maintenance and maintenance-smoke bundles because catalog_stats imports it.
- file: src/lambdas/ducklake_maintenance/index_actions.py
  action: Create
  purpose: >-
    action_ensure_catalog_indexes(event, _con): a closed, operator-only verb (Decision 81 cl.6: no agent invocation;
    invoked over 443 or by a Lambda console test event like the other operational verbs) with no caller-supplied SQL,
    schema or index name. Refuses (rt.DuckLakeRuntimeError, the catalog_reinit refusal shape) unless confirm ==
    "ducklake_file_column_stats". As the ducklake_ops owner login (rt.fetch_dsn(), psycopg2 over rt.libpq_conninfo,
    autocommit = True, SET statement_timeout = '300s' -- well under the 900 s function timeout, so a build blocked by a
    long transaction ends as an INVALID index the next run rebuilds, not a Lambda timeout) it enumerates schemas through
    catalog_index_schemas and for each reads catalog_index_status: valid (fixed name or equivalent) -> no-op; invalid
    fixed-name index -> DROP INDEX CONCURRENTLY then build; absent -> build (the SQL file text formatted with the
    _require_identifier-validated schema); then re-reads and requires valid. Returns only ok, migration_sha256 (of the
    SQL file bytes), schemas {name: {existed, valid_before, created, rebuilt, valid_after}} and pushdown_probe. The
    probe is the deterministic engagement proof (Postgres cumulative counters may reset whenever Neon's compute
    resumes, so 6-hourly readings cannot prove it): within the same awake psycopg2 session it reads idx_scan for the
    ducklake_ops index, runs one read-only filtered count through a fresh DuckLake ATTACH (rt.open_connection with
    EXTENSION_DIRECTORY and the function's DUCKLAKE_DATA_PATH) on the ducklake_ops table holding the most live data
    files (enumerated from the catalog), filtering on that table's first column with an equality literal, closes that
    DuckDB connection, then polls idx_scan with fresh autocommit reads once a second for up to 15 s (another session's
    scan counts reach pg_stat_user_indexes only when it goes idle or disconnects, rate-limited to once a second and
    deferrable by about 10 s); pushdown_probe = {idx_scan_before, idx_scan_after, engaged: after > before}. The probe is
    fixed (no caller input) and count-only: it returns the two counters and the boolean, never row data. Any probe
    exception (the DuckDB ATTACH string embeds the conninfo) becomes pushdown_probe {engaged: null, error_class} with the
    class name only, and never fails the verb once the index result stands. Every psycopg2.Error in the index path is
    re-raised as rt.DuckLakeRuntimeError carrying only the exception class and SQLSTATE, never its message (a connect
    error names the host). Also exports ensure_index_for(meta_schema) for catalog_reinit. Maintenance bundle ONLY
    (Decision 204's mutate-half precedent). Under 200 SLOC.
- file: src/lambdas/ducklake_maintenance/health_actions.py
  action: Create
  purpose: >-
    Decomposition (Decision 128; the handler is at 497 of 500 SLOC): action_control_health and action_catalog_stats
    move here unchanged in behaviour, importing _emit_maintenance_metric and DATA_PATH from _shared.py (health_actions
    may never import handler.py -- the handler imports it for dispatch, the _shared.py import-cycle rule).
    control_health additionally, in a finally after ducklake_control_health.control_health() (so this run's own reads
    are counted and the metric is emitted even when an invariant raises), opens one read-only psycopg2 session, reads
    catalog_index_status for every enumerated schema and emits, per schema (dimension MetaSchema), StatsIndexValid
    (0/1), FileColumnStatsIdxScan and FileColumnStatsSeqScan (counters since the last statistics reset) to
    DuckLakeMaintenance, plus a stats_index result key. The index check
    is REPORTED, never raised: a raise would trip the existing breaker alarm during the planned pre-index baseline; the
    StatsIndexValid alarm is rec-4220's, landed after the index exists. A status-read failure is reported in the result
    as the exception class and SQLSTATE only (never its message, which can name the host) and as StatsIndexValid 0,
    never raised.
- file: src/lambdas/ducklake_maintenance/_shared.py
  action: Modify
  purpose: >-
    _emit_maintenance_metric (gaining an optional dimensions pass-through to rt.emit_metric) and DATA_PATH move here
    from handler.py (the same cycle-breaking move Decision 204 made for EXTENSION_DIRECTORY); handler.py re-binds both
    names, so its remaining actions and tests are unaffected.
- file: src/lambdas/ducklake_maintenance/handler.py
  action: Modify
  purpose: >-
    _ACTIONS registers "ensure_catalog_indexes" -> index_actions.action_ensure_catalog_indexes and points
    "control_health" / "catalog_stats" at health_actions; the moved bodies, _emit_maintenance_metric and DATA_PATH
    definitions are replaced by re-bindings from _shared; catalog_reinit calls index_actions.ensure_index_for(meta_schema)
    after its SELECT 1 proof and returns the result under "stats_index"; the module docstring's operational-verb list
    names the new verb as operator-only. Net SLOC falls.
- file: src/lambdas/ducklake_maintenance/manifest.yaml
  action: Modify
  purpose: >-
    includes gains index_actions.py, health_actions.py and src/common/ducklake_catalog_index_status.py; assets gains
    catalog_stats_index.sql; notes name the new operator-only verb.
- file: src/lambdas/ducklake_maintenance_smoke/manifest.yaml
  action: Modify
  purpose: >-
    includes gains src/common/ducklake_catalog_index_status.py (the smoke bundle ships ducklake_maintenance.py, whose
    catalog_stats now imports it). Nothing else changes; the smoke dispatch is untouched (Decision 143).
- file: src/lambdas/data-pipeline/manifest.yaml
  action: Modify
  purpose: >-
    excludes gains src/common/ducklake_catalog_index_status.py with a DuckLake-bundle-only comment, following the
    precedent rows (its includes wildcard src/ would otherwise package the module into data-pipeline.zip). The zip's
    contents are unchanged, so data-pipeline needs no deploy.
- file: src/common/ducklake_maintenance.py
  action: Modify
  purpose: >-
    catalog_stats adds "stats_index": ducklake_catalog_index_status.catalog_index_status(cur, meta_schema), read FIRST
    in its existing cursor (the later per-ops-table query's failure branch leaves the non-autocommit transaction
    aborted, so a read after it would fail with InFailedSqlTransaction). A few lines; read-only, inside Decision 88
    cl.2's catalog_stats charter.
- file: src/common/ducklake_metrics.py
  action: Modify
  purpose: >-
    log_invocation(function, action, status, connect_ms, connect_reused, reopened, elapsed_ms): prints one compact
    JSON line {"event": "ducklake_invocation", ...those fields}, so the fields are filterable with a CloudWatch Logs
    JSON filter pattern (PlatformDev holds logs:FilterLogEvents, not logs:StartQuery). Fixed fields only: never a
    payload value, table row, host or error message.
- file: src/common/ducklake_control_health.py
  action: Modify
  purpose: >-
    Docstring only: the reference to "handler.py action_control_health" names health_actions.action_control_health
    after the move. No code change.
- file: src/lambdas/ducklake_reader/handler.py
  action: Modify
  purpose: >-
    handler() measures elapsed time, records reopened as true when EITHER reopen path ran (conn_meta's acquisition-time
    probe reopen, the common Neon-suspend case, or the mid-statement dead-connection branch) and calls log_invocation in a
    finally, so every path (200, 4xx, 5xx, connectionless) logs exactly one line; connect_ms and connect_reused come
    from the existing conn_meta (None on connectionless actions); action is logged only when it is a registered
    _ACTIONS key, otherwise the fixed token "unknown" (the 400 path's action is caller-supplied).
- file: src/lambdas/ducklake_writer/handler.py
  action: Modify
  purpose: Same as the reader, one ducklake_invocation line per invocation on every path, registered action names only.
- file: terraform/personal/neon_ducklake_catalog.tf
  action: Modify
  purpose: >-
    history_retention_seconds 21600 -> 604800 (7 days, the paid Launch plan maximum), with its comment corrected (the
    6 h figure was the free-tier ceiling; Decisions 88 cl.3 and 107 rely on 7-day PITR between weekly dumps); the
    header's free-tier wording may be corrected in the same edit (comments only). A neon_* in-place update, so the guard
    routes the apply to tf-gated-apply (the operator approves). No other attribute changes.
- file: docs/contracts/ducklake_maintenance.yaml
  action: Modify
  purpose: >-
    Class B verb entry ensure_catalog_indexes (operational, operator-only per Decision 81 cl.6, confirm, idempotent,
    non-destructive to data, enumerates schemas, returns booleans, the migration hash and the pushdown probe only, the
    probe named as a fixed, count-only query returning two idx_scan counters and no row data);
    its payload_schema_ref carries the literal citation "(Decision <N>, amending Decision 88 invariant v)", which the
    Decision test parses for N; the entry also names catalog_reinit as the second path that runs the same SQL file, and the
    control_health metrics it is checked by (control_health has no verb entry today, and this plan does not add one);
    the catalog_stats entry's 200 body names stats_index; the governance callers line names the new verb; an
    amendment_log entry. The file is at 475 of 500 effective lines (contracts class, config/structural_size_budgets.yaml):
    keep the additions terse and, if needed, compact the oldest amendment_log entries (the class's relief valve);
    never raise the budget.
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    NEW numbered Decision N (origin/main max + 1 at implementation time; 214 expected -- 213 is on main), amends
    [107, 88], <= 6,144 bytes, content pinned in execution_steps and ratified by the operator on 2026-10-09; dated
    trailing-bracket annotations on Decision 107 and Decision 88 naming it.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write.
- file: tests/common/test_ducklake_catalog_index_status.py
  action: Create
  purpose: >-
    Over a fake cursor: schema enumeration; present/valid for the fixed name, for an equivalent index in either column
    order, absent, and invalid; counters passed through; the stats_reset query casts to text; no write statement is
    ever issued; and test_module_excluded_from_data_pipeline: compute_affected_artifacts on the module names
    ducklake_maintenance and ducklake_maintenance_smoke and never data-pipeline.
- file: tests/lambdas/ducklake_maintenance/test_index_actions.py
  action: Create
  purpose: >-
    With rt.fetch_dsn and psycopg2.connect patched (the test_login_actions.py stubbing, so no psycopg2 import is
    needed): missing or wrong confirm refuses before any connection; autocommit and the statement_timeout are set
    before any DDL; schemas come from the enumeration; valid or equivalent -> no DDL; absent -> exactly the SQL file's
    statement for that schema; invalid -> DROP INDEX CONCURRENTLY then CREATE; a post-build invalid state raises;
    migration_sha256 equals the file's sha256; an OperationalError whose message names a host becomes a
    DuckLakeRuntimeError naming only class and SQLSTATE; the response never contains the host; ensure_index_for builds
    for one schema; test_pushdown_probe_reports_engagement (rt.open_connection and time.sleep patched): engaged true
    when idx_scan has advanced on the first poll and when it advances only on a later poll, false when it never
    advances within the window, and a probe exception whose message names a host becomes {engaged: null, error_class}
    carrying the class only while the verb still returns ok with its index result; test_sql_file_statement_shape asserts
    the SQL file's literal content -- exactly one statement, CREATE INDEX CONCURRENTLY, the fixed index name, (table_id,
    column_id) in that order, the {meta_schema} placeholder and no IF NOT EXISTS; test_manifest_ships_sql_asset: the
    maintenance manifest's assets list contains catalog_stats_index.sql (the bundle-completeness check cannot see a
    file read at call time); and docs/contracts/ducklake_maintenance.yaml declares verbs.ensure_catalog_indexes with its
    confirm value (test_contract_declares_verb).
- file: tests/lambdas/ducklake_maintenance/test_health_actions.py
  action: Create
  purpose: >-
    The mapped test for health_actions.py, so it alone covers the module: every control_health and catalog_stats
    branch MOVES here from the handler package (data_path and meta_schema refusals, the env DATA_PATH fallback, the
    meta_schema refusal and the null file_column_stats_rows_est branch), plus the new cases -- per-schema
    StatsIndexValid / FileColumnStatsIdxScan / FileColumnStatsSeqScan with the MetaSchema dimension (sink captured),
    emission in the finally when the invariant check raises, a status-read failure (its message naming a host) reported
    as class and SQLSTATE only and as StatsIndexValid 0 without raising, and json.dumps of both actions' results succeeding when the cursor returns a datetime.
- file: tests/lambdas/ducklake_maintenance/handler/test_control_health_action.py
  action: Modify
  purpose: >-
    Its control_health branch cases move to test_health_actions.py; it keeps only the dispatch-level case, re-pointed
