    deploy-ducklake-lambdas.yml run for the merge SHA with mcp__github__actions_list (export its conclusion as
    $DEPLOY_RUN_CONCLUSION) and get_job_logs into $DEPLOY_LOG_FILE first.
  command: >-
    test "$DEPLOY_RUN_CONCLUSION" = success && test -s "$DEPLOY_LOG_FILE" && grep -oE
    'agent-platform-ducklake-(maintenance-smoke|maintenance|reader|writer|catalog-dr)' "$DEPLOY_LOG_FILE" | sort -u | wc -l
  expected: >-
