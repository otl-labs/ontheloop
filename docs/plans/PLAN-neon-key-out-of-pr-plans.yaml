schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "neon-key-out-of-pr-plans"
intent: >-  # pragma: allowlist secret -- describes key handling, no credential
  Stop PR-triggered Terraform plans from reading the Neon provider API key, and strip the PR-sub planner session's direct
  secret-value grants. The key reaches Terraform only as an ephemeral input variable, so it is never in state or a saved
  plan; trusted jobs fetch it at run time and PR speculative plans use a stub key with -refresh=false. The planner keeps
  no unconditioned secret-value grant except the tfvars secret: the Neon key and catalog DSN value reads stay only for the
  reserved drift session, and the GitHub PAT and inference-key grants go. Executes rec-4618 (Critical) and rec-4616 and
  the direct-grant half of rec-4619. Not closed here: the DSN value and catalog owner password stay PR-readable from
  state and saved plans (TfstateRead, TfplanWrite GetObject) until N3. Plan N1 of the credential-proxy workstream.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-neon-key-out-of-pr-plans.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4618 and
  rec-4616.
scope:
  - file: terraform/personal/neon_ducklake_catalog.tf
    action: Modify
    purpose: >-  # pragma: allowlist secret -- describes key handling, no credential
      Delete data "aws_secretsmanager_secret_version" "neon_api_key"; provider "neon" { api_key = var.neon_api_key }.
      Rewrite the PHASE 0 header and the data-source comment to say the key is an ephemeral input variable supplied per
      run (pointer to deploy-paths admin_out_of_band and secret-material-handling provider_credential_ephemeral_input).
      Keep the neon provider pin at 0.13.0 (main.tf untouched): the configure-time spike is valid for that version only.
  - file: terraform/personal/variables.tf
    action: Modify
    purpose: >-
      Add variable "neon_api_key" {type = string, ephemeral = true, sensitive = true, nullable = false, no default} with
      the description in context (approved texts, T1). Replace the comment at lines 52-55 ("The Neon provider API key is
      NOT a variable ...") with one line pointing at the variable.
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-  # pragma: allowlist secret -- describes key handling, no credential
      In ci_full_refresh_read: delete SecretsManagerNeonAPIKeyRead (nothing refreshes that secret once the data source is
      gone); rewrite SecretsManagerDuckLakeNeonDSNRead to metadata only, actions exactly
      ["secretsmanager:DescribeSecret", "secretsmanager:GetResourcePolicy"] (the DSN name does not match the
      agent-platform-* metadata prefix, so this statement is what keeps validate_ci_refresh_read_coverage green, Decision
      129 pt4 / 157); delete SecretsManagerGithubPatRead and SecretsManagerInferenceCredentialsRead outright (their
      secrets are agent-platform-* envelopes whose refresh needs metadata only, already covered by
      SecretsManagerMetadataRead; rec-4616). The tfvars value read stays (plan C).
  - file: terraform/personal/oidc_pipeline_roles.tf
    action: Modify
    purpose: >-  # pragma: allowlist secret -- describes key handling, no credential
      In data "aws_iam_policy_document" "github_ci_planner", next to ConvergenceRecordWrite, add statement
      DriftSessionSecretValueRead: actions ["secretsmanager:GetSecretValue"], resources the neon-api-key-* and
      ducklake-neon-catalog-dsn-* ARNs (same var-built shape as today), condition StringLike aws:userid
      "*:${local.convergence_writer_session_name}" (reference the local, never the literal). Update the reserved-name
      coupled-site comment in oidc.tf locals (4 sites -> 5) and the header's capability-union comment. In oidc.tf, the
      header comment's "shared 20-statement refresh-read surface" count is set to the statement count after the three
      Sids leave; the same count at oidc_pipeline_roles.tf:108 ("the shared 20-statement refresh-read surface") is set to
      the same number (`grep -rn "20-statement" terraform/` returns nothing afterwards). Stale comments fixed in the same
      pass: the "site N/4" annotations at oidc_pipeline_roles.tf:48/75/195 and terraform-drift.yml:84 become "N/5" with
      the new statement as site 5 (terraform-drift.yml:85's "other 3 sites" becomes "other 4 sites"); oidc_pipeline_roles.tf:35 ("Same refresh-read surface as before ... -- unchanged") and
      oidc.tf:357-358 ("value-capable reads stay in the enumerated per-secret Sids above") are rewritten to name
      DriftSessionSecretValueRead. The policy
      resource name is unchanged (a rename is a replace and routes to gated apply).
  - file: scripts/ci/neon_api_key.sh
    action: Create
    purpose: >-
      Two subcommands; the key is never written to disk. `check` (also reached through the init-retry delegate below): if GITHUB_EVENT_NAME is pull_request or
      pull_request_target, print "neon-api-key: skipped (PR plan uses a stub)" and exit 0; otherwise read the secret
      (`aws secretsmanager get-secret-value --secret-id neon-api-key --query SecretString --output text`) into a local
      variable, fail closed on an empty result or a fetch error (one stderr line, no value), and discard it. This is the
      pre-apply preflight that lets a missing grant surface in tf_init (Decision 154 infra_error) instead of the apply
      step. `run -- CMD...`: fetch the same way into a shell variable, emit ::add-mask:: for it before anything else,
      export TF_VAR_neon_api_key in the script's own process only, and exec CMD. Reusable any number of times in a job
      (apply-sandbox dispatch plans then applies; apply-reconcile applies, re-plans and applies). Works unchanged against
      a pre-N1 tree: Terraform ignores a TF_VAR_ for an undeclared variable. The secret is a plain string; never
      JSON-parse. Never set -x, never echo the value, never write a file, GITHUB_ENV or GITHUB_OUTPUT.
  - file: tests/test_ci_neon_api_key.py
    action: Create
    purpose: >-
      (tests/test_ci_claude_p_retry.py layout.) Runs the real script with a stub `aws` on PATH and a temp HOME and
      RUNNER_TEMP: check skips on pull_request and pull_request_target without calling aws; check on push calls aws once
      and prints no value; an empty or failing fetch exits non-zero with no value in output, for both subcommands; run
      prints exactly one ::add-mask:: line, exports TF_VAR_neon_api_key to the child, and propagates the child's exit code;
      two consecutive run calls both succeed; no file is created under RUNNER_TEMP or the cwd; no output line carries the
      stub value except the add-mask line; the init-retry delegate neon_api_key_check.sh, run with GITHUB_WORKSPACE at a
      temp tree holding the script, behaves exactly as `check` on both a push and a pull_request event.
  - file: .github/actions/terraform-init-retry/neon_api_key_check.sh
    action: Create
    purpose: >-
      One-line delegate: `exec bash "$GITHUB_WORKSPACE/scripts/ci/neon_api_key.sh" check`. It exists so the composite
      step is a bare `bash "${{ github.action_path }}/neon_api_key_check.sh"`, which matches
      validate_composite_action_shell_bodies' _DELEGATE_LINE_RE (no arguments allowed) and is a thin adapter needing no
      r3 entry in config/composite_action_body_baseline.yaml.
  - file: .github/actions/terraform-init-retry/action.yml
    action: Modify
    purpose: >-
      Add a second step after init whose whole run body is `bash "${{ github.action_path }}/neon_api_key_check.sh"` (thin
      adapter; no baseline entry). Every user of this action is a terraform/personal job (apply-sandbox, speculative-plan,
      gated-apply, both reconcile jobs, and drift after this plan), and tf_init is in every Decision 154 pt4 pre-apply
      allow-list, so a missing grant writes an infra_error marker rather than a red latch. In reconcile this action
      resolves from the red-commit checkout; a pre-N1 red commit's copy has no check step, which is correct because its
      config still uses the data source. Description updated.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      Remove the r3_workflows entry ".github/workflows/terraform-drift.yml::drift-detect::terraform-init-s3-backend-sandbox":
      24, dead once drift uses the composite (a removal is always unrestricted). No entry is added; the drift plan body's
      ceiling (25) is unchanged because the run prefix rides the existing line.
  - file: tests/test_terraform_drift_acceptance.py
    action: Modify
    purpose: >-
      Re-point test_drift_workflow_init_retry_signature_parity, which asserts exactly one non-comment `grep -qE` line in
      terraform-drift.yml (0 after this plan), to assert that the drift-detect job has exactly one step with `uses:
      ./.github/actions/terraform-init-retry` and no non-comment `terraform init` line. Equivalent invariant, not a
      weakening: the signatures now live only in the composite, which test_terraform_init_retry_action_signature_parity
      already pins. Keep at least two assert statements (today's count), so the weakening candidate stays keyed
      assertion-changed and matches the pre-declared disposition. Docstring says so.
  - file: config/agent/verification_registry/entries/terraform-init-retry-signature-parity-both-consumers.yaml
    action: Modify
    purpose: >-
      Equivalent-invariant re-point (record it as such in the PR body, Decisions 181/235): keep the composite half
      verbatim and replace the drift half with `grep -q 'uses: ./.github/actions/terraform-init-retry'
      .github/workflows/terraform-drift.yml && ! grep -Eq '^[[:space:]]+out=\$\(terraform init'
      .github/workflows/terraform-drift.yml`. validate_verification_registry runs the modified entry as a differential
      against a full origin/main worktree: it fails there (drift has the inline loop) and passes on HEAD, so it is
      admitted. terraform-init-retry-single-copy is unchanged.
  - file: .github/workflows/terraform-apply-sandbox.yml
    action: Modify
    purpose: >-  # pragma: allowlist secret -- describes key handling, no credential
      Same effective-line count (550, at its budget; no raise): speculative-plan plan line becomes
      `TF_VAR_neon_api_key=pr-speculative-plan-stub-not-a-key terraform plan -refresh=false -lock=false -input=false
      -var-file=terraform.personal.tfvars -out=plan.bin`; the dispatch fresh plan line and both apply lines (apply-sandbox
      and gated-apply) gain the `bash "$GITHUB_WORKSPACE/scripts/ci/neon_api_key.sh" run --` prefix in front of the
      command they already run (the stale_plan_signature.py wrapper stays). Rationale comments must not contain the
      literal -refresh=false (VP 5 and check (4) count it); comment lines are not effective lines.
  - file: .github/workflows/reconcile.yml
    action: Modify
    purpose: >-
      Same effective-line count (536, at its budget): the apply-reconcile saved apply, fresh re-plan and fresh apply
      lines, and the gated-apply-reconcile apply line gain the prefix `bash "$GITHUB_WORKSPACE/.dispatch-tooling/scripts/ci/neon_api_key.sh" run --`.
      The script resolves from the dispatch-ref side checkout (both jobs already have it), never from the RED_SHA root
      checkout, so a pre-N1 red commit still heals (Decision 183): the script exists, and the extra TF_VAR is ignored by
      the old config. The replan keeps refreshing.
  - file: .github/workflows/terraform-drift.yml
    action: Modify
    purpose: >-
      Replace the inline init retry loop with `uses: ./.github/actions/terraform-init-retry` (same `if:
      steps.oidc_drift.outcome == 'success'`; same backend file), which brings the check step and removes effective lines.
      The drift plan's terraform line gains the `run --` prefix. Drift keeps refreshing: it is the drift control that
      -refresh=false PR plans now rely on. Any test pinning the inline init loop's signature parity is re-pointed at the
      composite.
  - file: scripts/checks/iam_tf/validate_planner_secret_value_reads.py
    action: Create
    purpose: >-  # pragma: allowlist secret -- describes key handling, no credential
      New check (pre=True, full_after_lint). Reuses validate_convergence_writer_isolation's HCL block and condition
      parsing and validate_invoke_implies_resolve._resolve_statements for source_policy_documents. Asserts: (1) every
      Allow statement in the planner's resolved policy whose actions can return a Secrets Manager value
      (fnmatchcase of each lower-cased Action pattern against secretsmanager:getsecretvalue and
      secretsmanager:batchgetsecretvalue, since IAM action names are case-insensitive; any
      NotAction statement fails closed) either carries the StringLike aws:userid "*:${local.convergence_writer_session_name}" condition or has every
      resource inside ALLOWED_UNCONDITIONED (the tfvars secret ARN only, with a comment naming plan C); (2) exactly one
      aws_iam_role_policy and zero aws_iam_role_policy_attachment resources target the planner role; (3) across
      .github/workflows/*.yml the reserved session name appears as a role-session-name value in terraform-drift.yml only;
      (4) in the personal-root workflows (terraform-apply-sandbox.yml, reconcile.yml, terraform-drift.yml) -refresh=false
      appears on the speculative-plan job's plan command and on no other terraform plan, and every other terraform plan
      or apply of the personal root runs through `neon_api_key.sh run --`; (5) no data "aws_secretsmanager_secret_version"
      block exists under terraform/personal; (6) every job containing `neon_api_key.sh run --` also uses
      ./.github/actions/terraform-init-retry, that action carries the neon_api_key_check.sh delegate step, and the
      delegate execs `neon_api_key.sh check`; (7) positive coverage, mirroring validate_convergence_writer_isolation:
      exactly one Allow statement on the planner grants secretsmanager:GetSecretValue on both the neon-api-key-* and the
      ducklake-neon-catalog-dsn-* ARNs under the StringLike aws:userid "*:${local.convergence_writer_session_name}"
      condition (without it drift fails only post-deploy, because the secret-version type is TRANSITIVE in
      _read_coverage.py and validate_ci_refresh_read_coverage cannot see the gap). Declares examined() per Decision 170.
      Read-only, credential-free.
  - file: tests/checks/iam_tf/test_validate_planner_secret_value_reads.py
    action: Create
    purpose: >-  # pragma: allowlist secret -- fixture names, no credential
      Live-tree green case plus failing-first fixtures: an unconditioned GetSecretValue on a non-allow-listed ARN; Get* on
      the inference keys; a conditioned statement whose condition names a different session; a second planner role policy;
      a policy attachment; a NotAction statement; the reserved name in a second workflow; -refresh=false on the drift
      plan; a dispatch plan without the run prefix; a run-wrapped job without terraform-init-retry; the init-retry action
      without its check step; the data source restored; the drift value-read statement missing
      (test_drift_value_read_statement_missing_fails); the drift value-read statement covering only one of the two ARNs.
      A lower-case "secretsmanager:getsecretvalue" action on a non-allow-listed ARN (test_lowercase_action_fails). Plus
      test_registered_in_pre_and_full_sequence: the check name is in registry.pre_sequence() and
      registry.full_sequence() (mirrors tests/checks/hygiene/test__manifest.py:45).
  - file: scripts/checks/iam_tf/_manifest.py
    action: Modify
    purpose: Register validate_planner_secret_value_reads (pre=True, full_segment full_after_lint), beside validate_convergence_writer_isolation.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      function_to_category row for validate_planner_secret_value_reads, in the same category as
      validate_convergence_writer_isolation (plan_obligations companion registration).
  - file: scripts/checks/contracts/validate_terraform_cc_web_operations.py
    action: Modify
    purpose: >-
      A no-default variable that declares `ephemeral = true` at depth 0 must appear in the contract's new
      ephemeral_runtime_vars mapping and must NOT appear in where_values_live; the reverse (an ephemeral_runtime_vars entry
      the module no longer declares, or declares non-ephemeral) also fails. The five tfvars variables keep today's check.
  - file: tests/checks/contracts/test_validate_terraform_cc_web_operations.py
    action: Modify
    purpose: >-
      New cases test_ephemeral_var_listed_under_ephemeral_runtime_vars_passes,
      test_ephemeral_var_listed_under_where_values_live_fails, test_ephemeral_var_missing_from_both_fails and
      test_stale_ephemeral_runtime_vars_entry_fails, written as module-level functions (not inside the file's existing
      classes) so the VP3 and test_obligations node ids resolve as written.
  - file: docs/contracts/terraform-cc-web-operations.yaml
    action: Modify
    purpose: >-
      Approved texts T2-T4c (context): new tfvars_and_remote_state_recovery.ephemeral_runtime_vars mapping (neon_api_key);
      the apply_posture sentence "New no-default variables only require updating that secret" amended; one
      speculative_plan_job step for the stub key and -refresh=false; the capability_split phrase (T4b), the
      planner_main_sub_iam phrase (T4c), the apply_posture "all no-default root-module variables" phrase (T3b), the
      apply_posture "sole remaining env override" sentence (T3d) and two recoverable_vars phrases (T3c), all of which
      would otherwise go false; scripts/ci/neon_api_key.sh added to referenced_repo_paths. One amendment_log entry.
  - file: docs/contracts/secret-material-handling.yaml
    action: Modify
    purpose: >-
      Approved texts T5, T5b and T6: new patterns.provider_credential_ephemeral_input, the runtime_fetch "SDK or CLI"
      amendment, and one domains line for the Neon key. One amendment_log entry.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Approved text T7: one new admin_out_of_band.procedure.steps entry (Decision 126/127 home of the local-apply loop);
      one amendment_log entry.
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: Approved text T8 (NEON-05 target; rec stays empty); one amendment_log correction entry.
  - file: scripts/ducklake_smoke/canary.py
    action: Modify
    purpose: >-
      canary_rehearsal takes project_id (default from env NEON_PROJECT_ID); when set, skip neon_api.resolve_project_id
      (the only org-level calls, which a project-scoped key cannot make). Fail loud with a one-line hint when neither a
      project id nor a listable key is available. src/common/neon_api.py is NOT edited (it is packaged by the data-pipeline
      Lambda; branch create/delete are already project-scoped).
  - file: scripts/ducklake_neon_smoke_test.py
    action: Modify
    purpose: Add --project-id to the --canary-rehearsal CLI and pass it through.
  - file: tests/ducklake_neon_smoke_test/test_canary.py
    action: Modify
    purpose: >-
      Re-point the two resolve_project_id stubs and delenv NEON_PROJECT_ID in them; new cases
      test_explicit_project_id_skips_resolve_project_id, test_cli_project_id_reaches_canary_rehearsal and
      test_missing_project_id_and_listing_failure_fails_loud_with_hint.
bundled_recommendations:
  - rec-4618
  - rec-4616
followon_recs:
  - rec-4627
  - rec-4628
  - rec-4629
  - rec-4630
  - rec-4631
infrastructure_dependencies:
  - >-
    terraform/personal apply via the governed CI path only (Decision 126): the merge applies the PR's saved plan (one
    in-place update of aws_iam_role_policy.github_ci_planner; the orphaned neon_api_key data-source entry leaves state).
    The planner inline-policy UPDATE is in budget on a managed boundary-carrying role (Decision 144 pt5), so the guard
    verdict is expected PASS (auto-apply). Any trust change, replace, or ROUTE verdict means something crept in: stop.
  - >-
    The apply role (terraform/bootstrap, admin-only) already holds GetSecretValue on neon-api-key-* and the DSN; no
    bootstrap change. Its comment at github_ci_apply_reads.tf:161-167 goes stale (consumer becomes the CLI fetch) and is
    left for Plan B's bootstrap apply, so this plan carries no admin-root edit.
  - >-
    Ordering: the PR's own speculative plan runs the OLD planner policy with the NEW HCL and workflow (stub,
    -refresh=false, no fetch on pull_request), so no grant is needed pre-merge; after the apply the hourly drift run reads
    both values through the conditioned statement.
acceptance_criteria:
  - >-
    terraform/personal declares neon_api_key as ephemeral, sensitive, non-nullable with no default; the neon provider
    reads it; no data "aws_secretsmanager_secret_version" exists under terraform/personal.
  - >-
    The planner's resolved policy has no unconditioned secret-value read except the tfvars secret; the Neon key and DSN
    value reads carry the reserved-session aws:userid condition; the DSN keeps an unconditioned metadata-only statement;
    the GitHub PAT and inference-key Sids are gone.
  - >-
    PR speculative plans pass a stub key and -refresh=false; every other personal-root plan refreshes; every trusted
    personal-root plan and apply (apply-sandbox, gated-apply, both reconcile jobs, drift) receives the real key through
    neon_api_key.sh run, and each of those jobs runs the check preflight inside tf_init.
  - >-
    validate_planner_secret_value_reads is registered (pre) and fails each fixture listed in its test module.
  - >-
    validate_terraform_cc_web_operations accepts neon_api_key only under ephemeral_runtime_vars.
  - The approved contract texts T2-T8 (with T3b-T3d, T4b, T4c and T5b) are in place verbatim.
  - The canary rehearsal runs with an explicit project id and never calls the org-level project listing.
  - >-
    Post-deploy: the N1 PR's speculative plan and the merge apply are green; the next drift run is green; state holds no
    data.aws_secretsmanager_secret_version.neon_api_key address; IAM simulation gives implicitDeny on both value reads for
    a PR-style session and allowed for the reserved session.
  - >-
    Post-deploy: Benjamin's second Neon re-mint is proven by a green drift run and a canary rehearsal before the interim
    key is revoked (or recorded unproven).
  - The full tier exits 0 on the committed, rebased, clean tree before the PR is opened.
  - After the squash-merge with the Resolves trailer, rec-4618 and rec-4616 are closed.
  - >-
    terraform-drift.yml's drift-detect job runs init through ./.github/actions/terraform-init-retry with no inline init
    loop; the transient-init signatures are pinned only in the composite.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the new check's tests (live tree green, every fixture red).
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_validate_planner_secret_value_reads.py tests/checks/iam_tf/test__manifest.py -q
    expected: exit 0; every test passes. Before the change the new module does not exist, so collection fails.
    fix_if: >-
      The live-tree case fails -- a planner statement still grants an unconditioned value read; fix the HCL, never widen
      ALLOWED_UNCONDITIONED (only Benjamin can add to it).
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: planner-secret-value-reads
  - step: 2
    phase: pre-deploy
    action: >-
      Run the key helper tests (skip on PR events, fail-closed fetch, mask, reusable run, nothing on disk, init-retry
      delegate parity) and the re-pointed drift init-retry test.
    command: bin/venv-python -m pytest tests/test_ci_neon_api_key.py tests/test_terraform_drift_acceptance.py::test_drift_workflow_init_retry_signature_parity tests/test_terraform_drift_acceptance.py::test_terraform_init_retry_action_signature_parity -q
    expected: >-
      exit 0; every test passes. Before the change the script does not exist, and the re-pointed drift test fails on the
      inline loop.
    fix_if: >-
      The stub value appears in any output line other than the add-mask line -- the script leaks; fix the script, never
      the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: neon-api-key-helper
  - step: 3
    phase: pre-deploy
    action: Run the CC-web operations contract validator tests including the new ephemeral cases.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_terraform_cc_web_operations.py::test_ephemeral_var_listed_under_ephemeral_runtime_vars_passes tests/checks/contracts/test_validate_terraform_cc_web_operations.py::test_ephemeral_var_listed_under_where_values_live_fails tests/checks/contracts/test_validate_terraform_cc_web_operations.py::test_ephemeral_var_missing_from_both_fails tests/checks/contracts/test_validate_terraform_cc_web_operations.py::test_stale_ephemeral_runtime_vars_entry_fails -q
    expected: exit 0; the four new node ids pass (before the change they do not exist). The whole file stays green in step 9.
    fix_if: >-
      A new case fails on neon_api_key (the live tree is exercised in step 9) -- the contract mapping is missing or neon_api_key was put in
      where_values_live; never add it to the tfvars secret.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: cc-web-ops-ephemeral-vars
  - step: 4
    phase: pre-deploy
    action: Run the canary tests (explicit project id skips the org-level lookup; CLI pass-through).
    command: bin/venv-python -m pytest tests/ducklake_neon_smoke_test/test_canary.py::test_explicit_project_id_skips_resolve_project_id tests/ducklake_neon_smoke_test/test_canary.py::test_cli_project_id_reaches_canary_rehearsal tests/ducklake_neon_smoke_test/test_canary.py::test_missing_project_id_and_listing_failure_fails_loud_with_hint -q
    expected: exit 0; the three new node ids pass (before the change they do not exist). The whole file stays green in step 9.
    fix_if: resolve_project_id is still called with a project id set -- the skip is wrong.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: canary-explicit-project-id
  - step: 5
    phase: pre-deploy
    action: >-
      Grep proofs: the data source is gone, the variable is ephemeral, the stub and -refresh=false each appear exactly once
      (the speculative plan), and the oidc.tf value Sids are gone.
