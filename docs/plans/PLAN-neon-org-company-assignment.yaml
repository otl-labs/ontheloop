  - {row: NEON-01, status: proven, evidence: "PLAN-neon-org-company-assignment C1, R1 and R2: the company Workspace identity is the organisation's Admin and the founder's personal login has left it (operator screenshot of the members page, verified <date>)"}
  - {row: NEON-02, status: proven, evidence: "PLAN-neon-org-company-assignment C1-C4 and R2: the organisation is assigned in place to the company (company admin, company name and billing, personal login gone); terraform-drift run <run id> converged after the last change"}
