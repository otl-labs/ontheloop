rollback: >-
  Build PR before merge: close it unmerged; the T1 line is harmless (it equals the value in use). After merge: forward
  fixes only; never revert in a way that re-commits the organisation id; the lifecycle blocks are always safe to keep.
  T1 wrong: restore the previous parameter version on the operator's word (read /secret/agent-platform-terraform-personal-tfvars:<tfvars_version_before>
  and put it back in one shell command that prints only the new version). K2 before K4: restore /secret/neon-api-key
  from version key_version_before the same way on the operator's word, dispatch drift and run VP 8, then the operator
  revokes the new key. C1, C3 and the MFA setting are reversed by the operator in the console. R1 is reversed by the
  company Admin re-inviting the personal login; R2 by reactivation within 30 days. C2 and K4 are final (nothing uses
  them). Never move or re-create the catalog as a rollback.
