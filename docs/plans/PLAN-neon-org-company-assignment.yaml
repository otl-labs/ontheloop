schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: neon-org-company-assignment
intent: >-
  Hand the Neon organisation that holds the DuckLake catalog to On The Loop Labs Limited in place, without moving or
  re-creating the catalog: the organisation id leaves the public repository for the tfvars parameter (rec-4543), the
  catalog project and database can no longer be destroyed or replaced by a plan, the operator adds the company admin
  login, renames the organisation and shows the company billing, a project-scoped key minted by the company admin
  replaces the interim personal key, and the founder's personal login, key and account are removed only after the new
  key is proven.
implementation_declared: true
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-neon-org-company-assignment.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn exception category) -- the Neon stage of the company ownership move (Decision
  195), after the AWS account (Decision 242 cl.4). No tier_item criterion claimed.
closes_criteria: []
scope:
- file: terraform/personal/variables.tf
  action: Modify
  purpose: >-
    Build PR: neon_org_id loses its committed default and gains nullable = false and the approved description; the
    comment "There is no neon_org_id ..." is replaced by one saying the variable has no default and comes from the
    tfvars parameter (rec-4543). No other variable changes.
- file: terraform/personal/neon_ducklake_catalog.tf
  action: Modify
  purpose: >-
    Build PR: neon_project.ducklake_catalog gains lifecycle { prevent_destroy = true, ignore_changes = [org_id] } with a
    one-line why-comment (sole system of record, Decision 84); neon_database.ducklake_ops gains lifecycle {
    prevent_destroy = true }; the org_id paragraph of the header comment says the value comes from the tfvars parameter
    and is ignored after creation because the provider makes it ForceNew. No attribute, role, DSN or secret resource
    changes.
- file: tests/checks/iam_tf/test_neon_catalog_org_id.py
  action: Create
  purpose: >-
    Build PR: three unit tests over the .tf text, beside test_neon_catalog_history_retention.py. The two resource tests
    slice their block with tests.fixtures.terraform_hcl_blocks.find_resource_block; the variable test slices the
    variable block with a regex inside the new module (find_resource_block matches resource headers only, and the
    fixture is not in scope). The module carries no literal Neon id shape (VP 5 sweeps the tree).
    test_neon_org_id_has_no_committed_default (the
    neon_org_id variable block has no default line and carries nullable = false, variables.tf no longer says "There is no neon_org_id", and no
    terraform/personal/*.tf carries a quoted Neon organisation id shape); test_catalog_project_ignores_org_id_and_cannot_be_destroyed
    (the project's lifecycle has prevent_destroy = true and org_id in ignore_changes);
    test_catalog_database_cannot_be_destroyed (the database's lifecycle has prevent_destroy = true). pytestmark unit.
- file: docs/contracts/terraform-cc-web-operations.yaml
  action: Modify
  purpose: >-
    Build PR: the approved texts 1a-1c (execution_steps APPROVED BUILD TEXT): recoverable_vars names six variables,
    where_values_live gains neon_org_id, one amendment_log entry. validate_terraform_cc_web_operations fails without
    this edit once the default is gone.
- file: docs/contracts/deploy-paths.yaml
  action: Modify
  purpose: >-
    Build PR: the approved texts 2a-2c: the admin recovery step names six tfvars, the neon_api_key step gains the
    one-run organisation key sentence, one amendment_log entry. No channel, trigger or role change.
- file: docs/contracts/account-credential-inventory.yaml
  action: Modify
  purpose: >-
    Closing PR only, after the operator-deployment proof: the approved NEON-02, NEON-03 and NEON-06 targets, the NEON-01,
    NEON-02, NEON-03 and NEON-05 flips to proven (owner company), BILL-02 to moved (payer company), five
    evidence_ledger entries and one amendment_log entry (execution_steps APPROVED CLOSING TEXT).
bundled_recommendations:
- rec-4543
followon_recs:
- rec-4865
- rec-4867
infrastructure_dependencies:
- >-
  Infrastructure Dependencies table (terraform/personal in scope; pipeline mechanics are environment-taxonomy.yaml's,
  not restated). | order | dependency | timing | owner | -- | 1 | the tfvars parameter carries neon_org_id (T1) |
  pre-merge, before the build PR opens: every terraform/personal plan path (terraform-plan-trusted.yml,
  terraform-apply-sandbox.yml, terraform-drift.yml, reconcile.yml) materialises that parameter, and a required
  variable without a value fails the plan | agent, on the operator's word | -- | 2 | trusted PR plan (Decision 238) |
  pre-merge observation, VP 7 | CI | -- | 3 | merge applies the saved plan (Decision 77 guard; zero neon_* actions
  expected) | merge | CI | -- | 4 | first drift run after the apply reads converged (Decision 190) | post-merge, the
  binding zero-change proof (operator ruling 2026-10-26) | CI, read by the agent (VP 8).
- >-
  Required checks: terraform-validate (Decision 119: no local init, validate or plan; provider-free terraform fmt
  -check only), the trusted plan job and its digest status, and pr-validate. No IAM, trust, grant or secret-parameter
  resource changes, so no gated-apply route is expected.
- >-
  LAMBDA: compute_affected_artifacts(<this plan's scope>) returns {} -- no scope file is Lambda-packaged, so no build,
  deploy or smoke step is owed (Decision 79). The canary rehearsal in VP 14 exercises the new key, not a deploy.
- >-
  Neon: every organisation-level act (members, MFA setting, project deletion, rename, billing, API keys, leaving,
  account deletion) is an operator console step; the Terraform provider has no resources for organisation members,
  settings, billing or plan (kislerdm/neon 0.13.0 provider.go), and the operator agreed on 2026-11-03 that they stay out
  of Terraform.
acceptance_criteria:
- >-
  neon_org_id has no committed default and is read from the tfvars parameter, whose value equals the live catalog
  project's organisation (VP 3, 13, 17; the default's absence VP 4); no Neon organisation id shape remains in the tree (VP 5); rec-4543 is closed
  (VP 9).
- >-
  The catalog project and database carry prevent_destroy and the project ignores org_id changes (VP 4); the build PR's
  trusted plan shows no changes (VP 7) and the first drift run after the merge apply reads converged with the record
  green (VP 8).
- >-
  The build PR's contract texts and the closing PR's inventory texts match the approved wording (VP 6, 19); the
  standing contract checks pass (VP 5).
- >-
  The organisation is the company's: a second Admin (the company identity) with MFA required and no pending
  invitation (VP 10), only the catalog project left (VP 11), the company's name, Launch plan and 7-day history (VP 12),
  and the founder's personal login gone from it (VP 15).
- >-
  /secret/neon-api-key holds a project-scoped key on ducklake-catalog minted in the company-administered organisation
  (VP 13); drift converges and the canary rehearsal passes on it (VP 8, 14); the personal key is refused (VP 16).
- >-
  The operator deployment runs unchanged after the last change: a converged drift run and a green record after R2 (VP 8),
  the maintenance and maintenance-smoke Lambdas invoked without errors and a green ci.yml run on main (VP 17), and a live
  recommendation write (VP 18).
- >-
  EVIDENCE.md records every step by kind and UTC time with no id, key, e-mail or card detail (VP 17); NEON-01, NEON-02,
  NEON-03 and NEON-05 are proven and BILL-02 moved, each with its ledger entry (VP 19).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Start gate: the AWS stage is done (AWS-01 proven on origin/main; Decision 242 cl.4 puts Neon after it), the Neon
    rows are still personal, and Decision 226's red-main overlap check is clear for this plan.
  command: >-
    bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
    'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK &&
    git fetch -q origin main && git show origin/main:docs/contracts/account-credential-inventory.yaml |
    bin/venv-python -c "import sys,yaml; d=yaml.safe_load(sys.stdin); r={x['id']:x['status'] for x in d['rows']};
    assert r['AWS-01']=='proven', r['AWS-01']; assert all(r[k]=='personal' for k in ('NEON-01','NEON-02','NEON-03','NEON-05')),
    r; print('START_GATE_OK')" && bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-neon-org-company-assignment.yaml
  expected: Prints ADMIN_CHAIN_OK and START_GATE_OK, then a JSON line whose verdict is clear (exit 0).
  fix_if: >-
    No ADMIN_CHAIN_OK: this session lacks the admin tier every live step needs; stop and ask the coordinator for an
    ADMIN session. AWS-01 not proven: stop and tell the coordinator. A Neon row already moved: another thread acted; stop and ask the
    coordinator. A blocked or unavailable overlap verdict: hold and tell the coordinator (Decision 226).
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    Baseline, written once before any live step: build-state.json in the project folder gets t0 and the current version
    numbers of /secret/neon-api-key and the tfvars parameter (numbers and times only), and EVIDENCE.md gets its header.
    A re-run keeps the existing baseline.
  command: |-
    bin/venv-python - <<'PY'
    import datetime as dt, json, os, boto3
    S = '/mnt/project-files/neon-catalog-transfer/build-state.json'
    E = '/mnt/project-files/neon-catalog-transfer/EVIDENCE.md'
    if os.path.exists(S):
        s = json.load(open(S)); print('BASELINE_KEPT', s['t0'], s['key_version_before'], s['tfvars_version_before']); raise SystemExit(0)
    ssm = boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2').client('ssm')
    v = lambda n: ssm.get_parameter(Name=n)['Parameter']['Version']
    s = {'t0': dt.datetime.now(dt.timezone.utc).strftime('%Y-%m-%dT%H:%MZ'), 'key_version_before': v('/secret/neon-api-key'),
         'tfvars_version_before': v('/secret/agent-platform-terraform-personal-tfvars')}
    json.dump(s, open(S, 'w'), indent=1)
    if not os.path.exists(E):
        open(E, 'w', encoding='utf-8').write('# Neon organisation hand-over evidence (kinds and UTC times only)\n\n| step | what | UTC time | evidence kind | result |\n|---|---|---|---|---|\n')
    print('BASELINE', s['t0'], s['key_version_before'], s['tfvars_version_before'])
    PY
  expected: Prints BASELINE with T0 and the two version numbers, or BASELINE_KEPT on a re-run.
  fix_if: >-
    An AWS error: fix the admin profile; never proceed blind. Never delete the state file to re-baseline once T1 has
    run: key_version_before is what the rollback and VP 15 and 16 read the personal key from.
  hermetic: false
  graduation: not-applicable
- step: 3
  phase: pre-deploy
  action: >-
    After T1: the tfvars parameter has exactly one neon_org_id line, its value equals the catalog project's organisation
    in Terraform state and in the live Neon API, every other line is unchanged, and the parameter's type, tier and key
    are unchanged. Prints no value.
  command: |-
    bin/venv-python - <<'PY'
    import json, re, urllib.request, urllib.error, boto3
    B = boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); ssm = B.client('ssm')
    N = '/secret/agent-platform-terraform-personal-tfvars'
    s = json.load(open('/mnt/project-files/neon-catalog-transfer/build-state.json'))
    p = ssm.get_parameter(Name=N, WithDecryption=True)['Parameter']; old = ssm.get_parameter(Name=f"{N}:{s['tfvars_version_before']}", WithDecryption=True)['Parameter']['Value']
    assert p['Version'] == s['tfvars_version_before'] + 1, ('another writer touched the parameter', p['Version'])
    lines = [l for l in p['Value'].splitlines() if re.match(r'\s*neon_org_id\s*=', l)]
    assert len(lines) == 1, ('neon_org_id lines', len(lines))
    assert [l for l in p['Value'].splitlines() if l not in lines and l.strip()] == [l for l in old.splitlines() if l.strip()], 'other lines changed'
    val = lines[0].split('=', 1)[1].strip().strip('"')
    st = json.loads(B.client('s3').get_object(Bucket='agent-platform-data-lake', Key='tfstate/personal/sandbox/terraform.tfstate')['Body'].read())
    a = [r for r in st['resources'] if r['type'] == 'neon_project' and r['name'] == 'ducklake_catalog'][0]['instances'][0]['attributes']
    k = ssm.get_parameter(Name='/secret/neon-api-key', WithDecryption=True)['Parameter']['Value'].strip()
    k = json.loads(k).get('api_key', k) if k.startswith('{') else k
    q = urllib.request.Request('https://console.neon.tech/api/v2/projects/' + a['id'], headers={'Authorization': 'Bearer ' + k, 'Accept': 'application/json'})
    live = json.loads(urllib.request.urlopen(q, timeout=30).read())['project']['org_id']
    d = [x for x in ssm.describe_parameters(ParameterFilters=[{'Key': 'Name', 'Values': [N]}])['Parameters']][0]
    assert val == a['org_id'] == live, 'tfvars, state and live organisation differ'
    assert (d['Type'], d['Tier'], d.get('KeyId')) == ('SecureString', 'Standard', 'alias/aws/ssm'), 'parameter shape changed'
    print('TFVARS_OK version', p['Version'])
    PY
  expected: Prints TFVARS_OK with the new version number (tfvars_version_before + 1).
  fix_if: >-
    Another writer touched the parameter (version not +1): stop and tell the coordinator; never restore over that
    write. Zero or two lines, or other lines changed, at version +1: the write was wrong; restore the previous version on
    the operator's word (rollback) and re-run T1. Values differ: stop; never open the build PR (ignore_changes would hide a wrong value from
    every plan). A changed type, tier or key: stop and tell the coordinator.
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: pre-deploy
  action: >-
    The three new guard tests pass: no committed organisation id default, and the catalog project and database cannot
    be destroyed, with org_id ignored on the project.
  command: >-
    bin/venv-python -m pytest -q
    tests/checks/iam_tf/test_neon_catalog_org_id.py::test_neon_org_id_has_no_committed_default
    tests/checks/iam_tf/test_neon_catalog_org_id.py::test_catalog_project_ignores_org_id_and_cannot_be_destroyed
    tests/checks/iam_tf/test_neon_catalog_org_id.py::test_catalog_database_cannot_be_destroyed
  expected: All three selected tests pass, exit 0.
  fix_if: >-
    A failure names the missing lifecycle argument or the surviving default: fix the .tf, never the test. A collection
    error means a node was renamed: keep the three node names above.
  hermetic: true
  graduation: graduate
  graduation_check_id: neon-catalog-org-id-guard
  expected_literals:
  - 3 passed
- step: 5
  phase: pre-deploy
  action: >-
    Standing contract check, rec-4543's original probe greps (its acceptance is VP 4's first node since 2026-11-03), and
    a tree-wide sweep for a Neon organisation id shape.
  command: >-
    bin/venv-python -c "from scripts.checks.contracts.validate_terraform_cc_web_operations import
    validate_terraform_cc_web_operations as v; f=[]; v(f); assert not f, f" &&
    ! grep -qE 'default += "org-' terraform/personal/variables.tf && ! grep -q 'There is no neon_org_id' terraform/personal/variables.tf &&
    ! git grep -nE '(^|[^a-z-])org-[a-z]+-[a-z]+-[0-9]{8}([^0-9]|$)' && echo CONTRACT_CHECKS_OK
  expected: The check's PASS lines, then CONTRACT_CHECKS_OK (exit 0).
  fix_if: >-
    A where_values_live or recoverable_vars failure: apply approved text 1a or 1b exactly. A sweep hit: remove the id
    from that file (git history keeps the old value; that residual is accepted, context).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The contract leg duplicates validate_terraform_cc_web_operations, which already runs in every tier; the rec probe
    and the organisation id sweep for terraform/personal are graduated through VP 4's test_neon_org_id_has_no_committed_default,
    and a repository-wide id-shape guard belongs in the never-commit hook, not a plan-scoped registry row (rec-4867).
  expected_literals: []
- step: 6
  phase: pre-deploy
  action: >-
    Build PR only: the two contracts carry the approved texts 1a-1c and 2a-2c (execution_steps APPROVED BUILD TEXT)
    and the old five-variable wording is gone.
  command: |-
    bin/venv-python - <<'PY'
    import yaml
    p = yaml.safe_load(open('docs/plans/PLAN-neon-org-company-assignment.yaml', encoding='utf-8'))
    want = yaml.safe_load([s for s in p['execution_steps'] if s.startswith('APPROVED BUILD TEXT')][0].split('\n', 1)[1])
    norm = lambda t: ' '.join(t.split())
    for path, spec in want.items():
        text = norm(open(path, encoding='utf-8').read())
        missing = [s[:60] for s in spec['present'] if norm(s) not in text]
        stale = [s[:60] for s in spec.get('absent', []) if norm(s) in text]
        assert not missing and not stale, (path, missing, stale)
    print('APPROVED_TEXT_OK', len(want))
    PY
  expected: Prints APPROVED_TEXT_OK 2.
  fix_if: >-
    Any difference is an unapproved wording change: restore the approved text. A critique or review asking for other
    wording goes to the coordinator and the operator before merge; never re-word to fit.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    A one-time binding of the build PR to operator-approved wording; standing contract shape is guarded by
    validate_terraform_cc_web_operations and the deploy-paths contract checks, and a later amendment of either
    contract would make a standing row go red for a legitimate change.
  expected_literals: []
- step: 7
  phase: pre-deploy
  action: >-
    Build PR open: its trusted speculative plan comment (Decision 238) reads NO_CHANGES with zero counts and leaks
    nothing. An extra pre-merge observation; VP 8 stays the binding proof (operator ruling 2026-10-26).
  command: |-
    test -n "$PR_NUMBER" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request
    get = lambda p: json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/' + p, timeout=30))
    body = [c['body'] for c in get(f"issues/{os.environ['PR_NUMBER']}/comments?per_page=100") if 'terraform/personal speculative plan (trusted' in c['body']][-1]
    scan = re.sub(r'\b[0-9a-f]{40,64}\b', '', body)
    leaks = [n for n, x in (('org', r'\borg-[a-z]+-[a-z]+-\d+'), ('project', r'\b[a-z]+-[a-z]+-\d{8}\b'), ('at', r'@[a-z0-9-]+\.[a-z]'), ('12-digit', r'(?<!\d)\d{12}(?!\d)')) if re.search(x, scan)]
    ok = re.search(r'^State: NO_CHANGES$', body, re.M) and '0 to import, 0 to add, 0 to change, 0 to destroy (0 replaced)' in body and not leaks
    print(json.dumps({'no_changes': bool(ok), 'leaks': leaks})); sys.exit(0 if ok else 'TRUSTED PLAN STOP')
    PY
  expected: 'One JSON line {"no_changes": true, "leaks": []}.'
  fix_if: >-
    CHANGES on any neon_* resource: stop; never merge (the Decision 77 guard would route it, and a route publishes a raw
    plan file, rec-4230); root-cause first. CHANGES only on other resources from work merged elsewhere: not this
    plan's; rebase onto main after that work's apply and re-run. PLAN_FAILED naming neon_org_id: T1 was skipped or wrong (VP 3). A leak:
    stop, delete the comment and root-cause before any re-run (Decision 55).
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: >-
    Zero-change proof (operator ruling 2026-10-26; Decision 190): the first completed terraform-drift run on main
    created after AFTER succeeded and reads clean (exit 0) or measured converged, and the convergence record is green.
    With MERGE_SHA set, the push apply of that commit succeeded too. Run after the merge, after K2, after R1 and after R2.
  command: |-
    test -n "$AFTER" && bin/venv-python - <<'PY'
    import json, os, re, sys, urllib.request, boto3
    R = 'https://api.github.com/repos/otl-labs/ontheloop/'
    get = lambda p, raw=False: (lambda r: r.read().decode('utf-8', 'replace') if raw else json.load(r))(urllib.request.urlopen(R + p, timeout=60))
    if os.environ.get('MERGE_SHA'):
        ap = get('actions/workflows/terraform-apply-sandbox.yml/runs?head_sha=' + os.environ['MERGE_SHA'])['workflow_runs']
        assert ap and all(r['conclusion'] == 'success' for r in ap), [(r['id'], r['conclusion']) for r in ap]
    runs = sorted((r for r in get('actions/workflows/terraform-drift.yml/runs?branch=main&per_page=50')['workflow_runs'] if r['created_at'] > os.environ['AFTER'] and r['status'] == 'completed'), key=lambda r: r['created_at'])
    assert runs, 'no completed drift run after AFTER yet'
    d = runs[0]; log = ''.join(get(f"actions/jobs/{j['id']}/logs", raw=True) for j in get(f"actions/runs/{d['id']}/jobs")['jobs'])
    clean = re.search(r'Z Drift check: no changes detected \(exit 0\); cycle is clean\.$', log, re.M) or re.search(r'Z Measured verdict this cycle: converged ', log)
    rec = json.loads(boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2').client('s3').get_object(Bucket='agent-platform-data-lake', Key='convergence/personal/sandbox.json')['Body'].read())
    print('DRIFT', d['id'], d['event'], d['conclusion'], 'clean' if clean else 'NOT_CLEAN', 'record', rec['status'])
    sys.exit(0 if d['conclusion'] == 'success' and clean and rec['status'] == 'green' else 'DRIFT STOP')
    PY
  expected: Prints DRIFT with the run id, event, success, clean and record green (exit 0).
  fix_if: >-
    No run yet: wait for the next scheduled run, or dispatch terraform-drift.yml on main (a read-only plan; the same
    workflow). Not clean or record red: stop and follow docs/contracts/deploy-paths.yaml's reconcile row, never a local
    apply; a neon_* replace or delete in the measured delta is a hard stop for the coordinator and the operator (the
    residual the operator accepted: a problem shows only after merge). Exit 1 in the run (plan failed): read the step
    outcome only; a key or tfvars failure after K2 or R1 is rolled back per the rollback field.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: post-deploy
  action: >-
    rec-4543 is closed after the build PR's squash commit carried "Resolves: rec-4543" (ci.yml closure job).
  command: >-
    bin/venv-python -c "from src.common import ducklake_reader_client as rc; rows,_=rc.fetch_recs_by_ids(rc.make_reader(),
    ['rec-4543']); assert rows and rows[0]['status']=='closed', rows and rows[0]['status']; print('REC_4543_CLOSED')"
  expected: Prints REC_4543_CLOSED.
  fix_if: >-
    Still open: read the closure job's outcome on the merge commit; if the trailer was missing, close it with
    update_rec through scripts.ops_data_portal citing the merge SHA (call get_rec_write_guidance() first).
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: post-deploy
  action: >-
    C1 verified with the current (personal) key: the organisation has exactly two admins, the founder's login and one
    other with MFA, no pending invitation, and require_mfa on. Prints counts only.
  command: |-
    bin/venv-python - <<'PY'
    import json, urllib.request, urllib.error, boto3
    B = boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2')
    k = B.client('ssm').get_parameter(Name='/secret/neon-api-key', WithDecryption=True)['Parameter']['Value'].strip(); k = json.loads(k).get('api_key', k) if k.startswith('{') else k
    st = json.loads(B.client('s3').get_object(Bucket='agent-platform-data-lake', Key='tfstate/personal/sandbox/terraform.tfstate')['Body'].read())
    o = [r for r in st['resources'] if r['type'] == 'neon_project' and r['name'] == 'ducklake_catalog'][0]['instances'][0]['attributes']['org_id']
    get = lambda p: json.loads(urllib.request.urlopen(urllib.request.Request('https://console.neon.tech/api/v2' + p, headers={'Authorization': 'Bearer ' + k, 'Accept': 'application/json'}), timeout=30).read())
    me = get('/users/me')['id']; org = get(f'/organizations/{o}'); mem = get(f'/organizations/{o}/members')['members']
    inv = get(f'/organizations/{o}/invitations').get('invitations', [])
    admins = [m for m in mem if m['member']['role'] == 'admin']; other = [m for m in admins if m['member']['user_id'] != me]
    got = (len(mem), len(admins), len(other), any(m['member']['user_id'] == me for m in admins), all(m['user']['has_mfa'] for m in other), len(inv), org['require_mfa'])
    print('C1', got); assert got == (2, 2, 1, True, True, 0, True), got; print('C1_OK')
    PY
