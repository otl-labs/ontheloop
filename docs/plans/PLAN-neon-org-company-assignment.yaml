    p = yaml.safe_load(open('docs/plans/PLAN-neon-org-company-assignment.yaml', encoding='utf-8'))
    want = yaml.safe_load([s for s in p['execution_steps'] if s.startswith('APPROVED BUILD TEXT')][0].split('\n', 1)[1])
    norm = lambda t: ' '.join(t.split())
    for path, spec in want.items():
        text = norm(open(path, encoding='utf-8').read())
        missing = [s[:60] for s in spec['present'] if norm(s) not in text]
        stale = [s[:60] for s in spec.get('absent', []) if norm(s) in text]
        assert not missing and not stale, (path, missing, stale)
    print('APPROVED_TEXT_OK', len(want))
    PY
  red_green_expectation: >-
    Red before: on main the step reads "Recover the five no-default tfvars", AssertionError. Green after approved texts
    2a-2c.
- source: docs/contracts/account-credential-inventory.yaml
  behavior: the Neon rows record the in-place hand-over (closing PR).
  verification_step: 19
  command: |-
    bin/venv-python - <<'PY'
    import re, yaml
    from scripts.checks.contracts.validate_account_credential_inventory import validate_account_credential_inventory as v
    p = yaml.safe_load(open('docs/plans/PLAN-neon-org-company-assignment.yaml', encoding='utf-8'))
    w = yaml.safe_load([s for s in p['execution_steps'] if s.startswith('APPROVED CLOSING TEXT')][0].split('\n', 1)[1])
    d = yaml.safe_load(open('docs/contracts/account-credential-inventory.yaml', encoding='utf-8')); r = {x['id']: x for x in d['rows']}; b = {x['id']: x for x in d['billing']}
    assert all(r[i]['target'] == t for i, t in w['targets'].items()), [i for i, t in w['targets'].items() if r[i]['target'] != t]
    assert all({k: r[i][k] for k in f} == f for i, f in w['rows'].items()) and all({k: b[i][k] for k in f} == f for i, f in w['billing'].items()), 'status, owner or payer'
    pat = lambda t: re.escape(t).replace(re.escape('<date>'), r'\d{4}-\d{2}-\d{2}').replace(re.escape('<run id>'), r'\d+').replace(re.escape('<n>'), r'\d+').replace(re.escape('<follow-on rec>'), 'rec-4865')
    led = [e for e in d['evidence_ledger'] if e['row'] in {x['row'] for x in w['ledger']}]
    assert all(any(e['row'] == x['row'] and e['status'] == x['status'] and re.fullmatch(pat(x['evidence']), e['evidence']) for e in led) for x in w['ledger']), 'ledger entry'
    assert any(' '.join(a['summary'].split()) == ' '.join(w['amendment_summary'].split()) for a in d['amendment_log']), 'amendment_log'
    f = []; v(f); assert not f, f; print('INVENTORY_OK')
    PY
  red_green_expectation: >-
    Red before: on main the four rows read personal with owner founder and BILL-02 personal, AssertionError; it stays
    red through the build PR. Green after the closing PR's approved entries.
constraints:
- >-
  Approved texts are verbatim (context gives the approval). Allowed variance: dates, PR numbers, workflow run ids, the
  SSM parameter version number and the follow-on rec id. Any other wording change, including one critique or code
  review asks for, goes to the coordinator, then the operator, before merge.
- >-
  Every Neon organisation act is the operator's, in the Neon console. The agent runs read-only calls (Neon GET, SSM and
  S3 reads, GitHub and CloudWatch reads), dispatches terraform-drift.yml (a read-only plan) and writes through
  scripts.ops_data_portal. Only three agent mutations exist, each run only after the operator's typed word on the exact
  command in the build thread, one word per mutation: the T1 SSM write, the VP 14 canary rehearsal, and a rollback
  restore of a previous SSM version. No agent terraform apply; no other agent Neon API write.
- >-
  Order is fixed: baseline, T1, build PR, merge and VP 8, C1, C2, C3, C4, K1, K2, K3, R1, K4, R2, P1, closing PR. The
  personal login, key and account go only after the new key is proven (successor first, Decision 172/218). C2, C3 and
  R1 are checked through the API with the personal key, so they come before K4 revokes it; this moves the clean-up and
  the revocation relative to the presentation's list, with no change to any outcome.
- >-
  No Neon organisation, project or branch id, API key, e-mail address, card, invoice or billing detail, or screenshot
  enters the repository, a PR, memory, chat or the shared folder (Decision 101). Evidence is recorded by kind and UTC
  time; commands read ids from Terraform state at run time and print none.
- >-
  Size: deploy-paths.yaml is NEAR_CAP (491 of 500 effective lines on main 03ac4f9d; this build adds one line). Measure it
  against main at build time with scripts.roadmap.plan_obligations; if the edit would cross 500, compact an existing
  note in that file in the same PR, never raise the budget (Decision 128).
- >-
  T1 is a read-modify-write with a version check, serialised with rec-4048 and the personal-terraform-variables item,
  which write the same parameter; the coordinator owns that order.
- >-
  The tfvars value is invisible to every plan once ignore_changes lands; it is compared with the live project at VP 3,
  13 and 17 and nowhere else.
- >-
  A failed or drifted step halts this workstream until root-caused; never a silent retry; no rescue agents or
  workaround loops (Decision 55).
- >-
  Fallback: if Neon refuses to let the founder's sign-up login leave the organisation (undocumented), stop at R1; the
  plan is amended to the transfer path through /plan, which the build PR already makes safe. Never improvise a
  transfer, and never move or re-create the catalog under this plan.
