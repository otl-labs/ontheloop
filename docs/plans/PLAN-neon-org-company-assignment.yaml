execution_steps:
- |-
  Start gate (VP 1). Read docs/PROJECT_CONTEXT.md, this plan and /mnt/project-files/neon-catalog-transfer/HANDOFF-implementation.md (written when this plan merged; if absent, ask the coordinator). Conventions for every live step: present the exact step or command and its expected result in the thread; for an operator step wait for the operator's typed word that it is done, for an agent mutation wait for the operator's typed word on that exact command, one word per mutation; then verify with the VP step named and append one row to /mnt/project-files/neon-catalog-transfer/EVIDENCE.md: | step | what | UTC time as YYYY-MM-DDTHH:MMZ | evidence kind | pass |. Screenshots are checked in the thread and never saved anywhere; ids, keys, e-mails and card or billing details are never written down (Decision 101). Then run VP 2 (baseline, once).
- |-
  T1, tfvars line (agent, on the operator's word on this command; the coordinator confirms no other thread is writing the parameter). Present it, wait for the word, run it, then VP 3, row T1:
  bin/venv-python - <<'PY'
  import json, re, boto3
  N = '/secret/agent-platform-terraform-personal-tfvars'
  B = boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); ssm = B.client('ssm')
  p = ssm.get_parameter(Name=N, WithDecryption=True)['Parameter']
  assert not re.search(r'^\s*neon_org_id\s*=', p['Value'], re.M), 'neon_org_id already present'
  st = json.loads(B.client('s3').get_object(Bucket='agent-platform-data-lake', Key='tfstate/personal/sandbox/terraform.tfstate')['Body'].read())
  org = [r for r in st['resources'] if r['type'] == 'neon_project' and r['name'] == 'ducklake_catalog'][0]['instances'][0]['attributes']['org_id']
  assert re.fullmatch(r'org-[a-z]+-[a-z]+-[0-9]+', org), 'unexpected organisation id shape'
  assert ssm.get_parameter(Name=N)['Parameter']['Version'] == p['Version'], 'parameter changed since read'
  v = ssm.put_parameter(Name=N, Value=p['Value'].rstrip('\n') + '\nneon_org_id = "' + org + '"\n', Type='SecureString', Overwrite=True)['Version']
  print('TFVARS_WRITTEN', p['Version'], '->', v)
  PY
  Expected: TFVARS_WRITTEN with the old and new version numbers, then VP 3 passes. Nothing else changes in Terraform: the value equals the one the catalog was created with.
- |-
  Build PR. Apply the scope edits: variables.tf (no default, nullable = false, the description "Neon organisation id that owns the DuckLake catalog project, from the tfvars parameter (never committed). Used only when the project is created: neon_project.ducklake_catalog ignores later org_id changes, because the provider would otherwise replace the project."), the comment replacement, the two lifecycle blocks, the header-comment rewording, the new test file, and the APPROVED BUILD TEXT below in the two contracts (amendment_log entries dated the commit date, semantic_break false, change_class correction). Placement: in terraform-cc-web-operations.yaml the first string replaces the first sentence of tfvars_and_remote_state_recovery.recoverable_vars (rest unchanged), the second is a new where_values_live entry after alerts_email, the third a new top amendment_log entry; in deploy-paths.yaml the first replaces the start of the admin_out_of_band.procedure.steps recovery step (rest unchanged), the second is appended to the neon_api_key step that follows it, the third a new top amendment_log entry written as a one-line flow mapping (deploy-paths.yaml is near its size cap). Flip implementation_declared to true. Graduate VP 4 through the implement skill's graduation flow (registry row config/agent/verification_registry/entries/neon-catalog-org-id-guard.yaml, slot test_selector, guard_target terraform/personal/neon_ducklake_catalog.tf). Run VP 4, VP 5, VP 6, terraform fmt -check terraform/personal (provider-free; Decision 119), bin/venv-python -m scripts.validate --pre, then VP 20 (the full tier and --verify-head), and code review. Open the PR titled 'feat(neon-org-company-assignment): take the Neon organisation id out of the repository and block catalog destroy', with 'Resolves: rec-4543' in the squash body. Run VP 7 on its trusted plan comment. Squash-merge on code-review PROCEED, VP 7 and green CI. Record row B1 (PR number, merge SHA). Then VP 8 with AFTER set to the merge time and MERGE_SHA, and VP 9. Report separately (implement skill, Commit Flows): GitHub readiness, validator verdicts, postflight evidence, code review, and the real push and PR outcome.
- |
  APPROVED BUILD TEXT (YAML; per file, every present string appears verbatim in the file after whitespace is collapsed and no absent string does; the amendment_log entries carry the commit date, which is not part of the strings):
  docs/contracts/terraform-cc-web-operations.yaml:
