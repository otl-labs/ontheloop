- |-
  Closing PR: apply APPROVED CLOSING TEXT to docs/contracts/account-credential-inventory.yaml (amendment_log entry dated the commit date, semantic_break false, change_class correction), run VP 19, bin/venv-python -m scripts.validate --pre, VP 20, code review; open the PR titled 'feat(neon-org-company-assignment): closing -- record the Neon organisation hand-over'; squash-merge on code-review PROCEED and green CI, reporting readiness, validator verdicts, postflight evidence, review and the real push and PR outcome separately. Post a counts-only comment on the merged PR (steps, UTC times, run ids; no values) after running VP 17's redaction pattern over its text. Write handoff notes for the coordinator: rec-4865 carries the first company-paid Neon invoice (BILL-02 to proven); AWS-07 (the tfvars parameter) is untouched here and moves with the personal-terraform-variables item.
