    - "PLAN-neon-org-company-assignment (rec-4543): neon_org_id loses its committed default and becomes a recoverable tfvars variable read from the /secret/agent-platform-terraform-personal-tfvars parameter; recoverable_vars and where_values_live name it."
    absent:
    - "Five no-default, non-ephemeral vars"
  docs/contracts/deploy-paths.yaml:
