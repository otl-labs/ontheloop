  K4, revoke (operator, personal login): Account settings > API keys > revoke the key created on 2026-10-25. Run VP 16; row K4.
  R2, delete the personal Neon account (operator): Account settings > Delete account (Neon allows reactivation for 30 days). Row R2 on the operator's word. Then record t_r2 (bin/venv-python -c "import datetime as d, json; S='/mnt/project-files/neon-catalog-transfer/build-state.json'; s=json.load(open(S)); s['t_r2']=d.datetime.now(d.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'); json.dump(s, open(S, 'w'), indent=1); print('T_R2', s['t_r2'])") and run VP 8 with AFTER set to t_r2 (dispatch allowed): that run is the last change's drift proof the closing ledger cites.
- |-
  Operator-deployment proof P1: after the first full 6-hourly maintenance cycle after t_r2, run VP 17. Then the live write: call get_rec_write_guidance(), then update_rec through bin/venv-python -m scripts.ops_data_portal on rec-4865 appending exactly 'Organisation assigned in place to the company; moved on <YYYY-MM-DD>.' (the R1 date), and run VP 18 with MOVE_DATE set to that date. Row P1 with counts and run ids only.
- |
