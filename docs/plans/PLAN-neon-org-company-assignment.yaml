  K2, store (operator, AWS CloudShell in eu-west-2, signed in to the AWS console as usual). Paste:
  read -rsp 'Neon key: ' K; echo; printf '{"Name":"/secret/neon-api-key","Value":"%s","Type":"SecureString","Overwrite":true}' "$K" | aws ssm put-parameter --region eu-west-2 --cli-input-json file:///dev/stdin --query Version --output text; unset K
