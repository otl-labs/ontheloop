schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: north-star-tier-a
intent: >-
  Make this repository's north stars real Tier A direction: the mission and nine entries
  in the Decision 196 shape, each with its why, a failure signal, a binding scope in glossary terms and the Decisions
  that carry it, under a declared partial order, in docs/contracts/north-star.yaml with an evaluator that keeps the
  roadmap pointer and the README headline block equal to it. Lands Decision NNN (amends Decision 196 clause 3) and
  the Promoted appends exactly as approved, retires the three checks that pinned the old wording, and creates T4.36
  as the owner of the five plans that build on the file.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-north-star-tier-a.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn category): Benjamin asked for the north-star rework (2026-10-24) and ruled the
  glossary its prerequisite (2026-10-27; Decision 240 merged 2026-10-30). No existing tier_item is claimed, so the
  Tier Item Freshness Gate does not fire; this plan creates T4.36 with c1-c2 met by itself and adds T4.24 c17.
closes_criteria: []
scope:
  - file: docs/contracts/north-star.yaml
    action: Create
    purpose: >-
      Block north-star-file of docs/plans/approved/north-star-tier-a.yaml, verbatim: a ratified Class D contract
      (evaluator validate_north_star) holding the mission, NS.1-NS.9, their semantics, the partial order and the
      creation amendment_log row.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Sidecar blocks decision-entry (Decision NNN above the newest entry) and append-57 ... append-235 (fourteen dated
      Promoted appends, Decision 196's naming Decision NNN), verbatim. No other byte changes.
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write, never by hand.
  - file: docs/PROJECT_CONTEXT.md
    action: Modify
    purpose: >-
      Sidecar block project-context-pointer, verbatim: one line under the "## Platform thesis" heading naming the
      file (Decision 196 clause 3's context policy as Decision NNN clause 2 amends it). +64 bytes: 14,025 of the 14,032
      S8 budget on main at 5bb5d021.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Conditional (execution step 9): only if validate_prose_limits then fails docs/PROJECT_CONTEXT.md as over budget
      (PLAN-prose-budget-ratchet's build reseeds every budget to measured bytes), set that one entry to the measured
      bytes with the inline marker "# raise-approved: dec-NNN north-star pointer line (Decision NNN clause 2)".
      Decision NNN's body names docs/PROJECT_CONTEXT.md, so the marker authorizes the key (Decision 165). Otherwise
      untouched.
  - file: scripts/north_star_models.py
    action: Create
    purpose: >-
      Tier A Pydantic models, no first-party imports and no I/O at import. DEFAULT_PATH is docs/contracts/north-star.yaml
      resolved from the repository root. load_north_star(path=None) -> NorthStarDocument reads with yaml.safe_load and
      validates; a missing or unreadable file, a YAML error or a validation error raises ValueError naming the path.
      NorthStarDocument (extra="forbid"): contract (dict), amendment_log (list of dicts), semantics (dict of str),
      mission (Mission), principles (list of NorthStarEntry), partial_order (PartialOrder); ids() returns every entry
      id, active_ids() those with status active. NorthStarEntry (extra="forbid"): id matching ^NS\.[1-9][0-9]*$ and
      unique across the list; kind Literal north_star; principle, detail and failure_signal non-empty after strip;
      detail starts "Why:"; binds Literal repository|release|both; adopters Literal bound|may_override|set_scale,
      required when binds is release or both and forbidden when repository; carried_by a non-empty list of positive
      ints; status Literal active|retired, default active. Mission (extra="forbid"): kind, statement, detail,
      failure_signal, binds, adopters (same rule), carried_by; no Why rule. PartialOrder (extra="forbid"): rule
      (non-empty str), groups (list of lists of str, highest first). Interface pinned for the dependent plans
      (/mnt/project-files/north-star-tier-a/draft/models-interface.md); PR #1683 imports it.
  - file: scripts/checks/contracts/validate_north_star.py
    action: Create
    purpose: >-
      Registered check validate_north_star(failed, root=None) with _CONTRACT = "north-star.yaml" in executable
      context (the population gate's evaluator rule). Loads through load_north_star; an unloadable file fails and calls
      registry.skipped. Legs, each failure printed with its leg name: CONTRACT -- subject north-star, evaluator.check
      validate_north_star, ratified_via naming an existing Decision header; CARRIED -- every carried_by number of the
      mission and every entry is a header in docs/DECISIONS.md or docs/DECISIONS_ARCHIVE.md, read through
      scripts.decisions_md.decision_header_numbers(paths=[...]) at the injected root (no hand-rolled header regex);
      ORDER -- every partial_order id is a known, active entry and appears once across all groups; IDS -- NS.1-NS.5 are
      present, and when _common.status_diff_base(root) resolves and the base holds the file, every base id is still
      present (retire by status, never delete); base None prints a SKIP for this leg only; ROADMAP --
      docs/ROADMAP-PLATFORM.yaml's north_star value equals exactly {"source": "docs/contracts/north-star.yaml"}, parsed
      with scripts.contract_rules.parse_yaml; BOUNDARY -- some entry of config/agent/executor/capabilities.yaml
      boundary_patterns is a substring of "docs/contracts/north-star.yaml" (the substring test
      scripts/ops_portal/risk_scoring.py applies), the standing guard for Decision NNN clause 6's membership; README --
      README.md holds exactly one begin marker line and one end marker
      line, begin first, and the span from begin to end inclusive equals render_readme_block(doc). render_readme_block
      is public and pure: the begin line "<!-- north-star:begin generated from docs/contracts/north-star.yaml by
      validate_north_star; edit the contract, never this block -->", the line "The mission, and each entry's why,
      failure signal and binding scope, live in `docs/contracts/north-star.yaml`.", one blank line, one line "- **<id>**
      - <principle>" per active entry in file order, and the end line "<!-- north-star:end -->", joined by newlines.
      registry.examined(entries plus carried_by references, unit="north_star_entries_and_references").
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      One Entry for validate_north_star after validate_glossary: pre=True, full_segment="full_after_lint", ungated with
      a one-line comment naming the validate_glossary precedent (it reads six fixed files and one base copy).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Row "validate_north_star: schema_drift" after validate_glossary's (499 of 500 effective lines on 525546ee, 500
      after, so no headroom: if another row lands first and this one would pass 500, STOP, never raise).
  - file: scripts/platform_roadmap_models.py
    action: Modify
    purpose: >-
      NorthStar becomes the pointer model: extra="forbid", one field source: str defaulting to
      "docs/contracts/north-star.yaml", docstring naming Decision NNN clause 1. NorthStarPrinciple is deleted;
      RoadmapDocument.north_star keeps Field(default_factory=NorthStar).
  - file: scripts/roadmap/platform_roadmap.py
    action: Modify
    purpose: Drop NorthStarPrinciple from the facade's import list and __all__.
  - file: tests/test_platform_roadmap.py
    action: Modify
    purpose: >-
      _MODELS_SYMBOLS drops "NorthStarPrinciple"; new node TestFacadeReexports::test_north_star_principle_retired
      asserts neither the facade nor scripts.platform_roadmap_models exposes it.
  - file: tests/platform_roadmap_models/test_schema.py
    action: Modify
    purpose: >-
      TestCD25SchemaAmendments::test_other_classes_still_extra_ignore keeps its claim on a class that still ignores
      extras: _doc(known_gaps=[{"id": "KG.X", "gap": "g", "bogus_field": "ignored"}]) validates and known_gaps[0].gap ==
      "g" (comment names KnownGap). New class TestNorthStarPointer: the default source is the contract path; a
      north_star carrying principles, or any key but source, raises a ValidationError naming the key; the live roadmap
      (_LIVE_ROADMAP) validates with north_star.source equal to the contract path.
  - file: tests/test_north_star_models.py
    action: Create
    purpose: >-
      TestRealContract: [p.id for p in doc.principles] is NS.1-NS.9 in order, all active; binds and adopters per entry equal Benjamin's labels
      (mission repository; NS.1 both/bound; NS.2 repository; NS.3 repository; NS.4 both/may_override; NS.5
      both/may_override; NS.6 both/bound; NS.7 repository; NS.8 both/set_scale; NS.9 both/bound); groups are [[NS.6,
      NS.9], [NS.1, NS.3]]. TestEntryRules: one parametrized case per rule raising ValueError (adopters missing for both
      and for release, adopters present for repository, ids NS.0, NS-1 and NS.01, a duplicate id, a detail not starting
      Why:, an empty failure_signal, an unknown binds or adopters value, an extra key on an entry, the mission and the
      document, kind other than north_star, an empty carried_by); a retired entry is in ids() but not active_ids(); a
      missing file raises ValueError. TestNoFirstPartyImports: an AST walk of scripts/north_star_models.py finds no
      import of scripts, src or tests.
  - file: tests/checks/contracts/test_validate_north_star.py
    action: Create
    purpose: >-
      In a temporary git repository (the test_validate_glossary pattern): the real contract copied, a DECISIONS.md
      holding a header for every carried_by number and the ratified_via Decision, a roadmap holding the pointer, a
      capabilities.yaml whose boundary_patterns holds the path and a README holding render_readme_block. Nodes: test_fixture_tree_passes; test_unknown_carried_by_fails;
      test_ratified_via_unresolved_fails; test_partial_order_defect_fails (unknown id, retired id, an id in two groups);
      test_core_ids_required (NS.3 removed with no base); test_removed_id_against_base_fails (the base has NS.9, the head
      drops it, the failure names NS.9); test_retired_id_against_base_passes; test_no_base_skips_base_leg_only;
      test_roadmap_pointer_mismatch_fails (key missing, an extra key, the old principles block);
      test_boundary_pattern_missing_fails (the entry removed fails naming the path; "docs/contracts/" alone passes);
      test_readme_drift_fails (one bullet edited); test_readme_marker_defect_fails (end missing, begin duplicated, end
      before begin); test_unloadable_contract_fails_and_skips; test_entry_resolves_and_is_sequenced (registry.resolve
      and both tier sequences).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Execution step 7: the north_star block becomes the pointer {source: docs/contracts/north-star.yaml}; T4.36 is
      inserted after T4.35; T4.24 gains c17 and NNN in related_decisions. Nothing else.
  - file: README.md
    action: Modify
    purpose: >-
      Sidecar blocks readme-sources-line, readme-north-star-block, readme-repository-paragraph and
      readme-canonical-sources, verbatim (execution steps 4 and 8): the five North Star bullets become the generated
      block, which equals render_readme_block's output; the projection line, the repository paragraph and the
      Canonical Sources list name the contract. No other byte changes.
  - file: EVALUATION-PROMPTS.yaml
    action: Modify
    purpose: Q1's answer_loci gains docs/contracts/north-star.yaml after README.md (validate_portal_drift resolves it).
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      boundary_patterns gains a commented block "# Tier A north stars (Decision NNN cl.6; Decision 196 cl.3 authority
      policy)" with the entry docs/contracts/north-star.yaml, after the telemetry content reader block (Decision 117;
      Decision 235 clause 5's floor then covers its evaluator). validate_north_star's BOUNDARY leg guards it.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Execution step 6: the north-star route after the glossary route, north_star_models.py in
      scripts_root_allowlist.allowed_files after lambda_manifest.py, one amendment_log row, paid for by compacting the
      seven 2026-09-21 to 2026-09-26 rows to two (500 of 500 effective lines on 5bb5d021, 500 after; Decision 166, never
      a raise).
  - file: config/agent/verification_registry/entries/ns2-names-owning-entity.yaml
    action: Delete
    purpose: >-
      Retired by git mv into entries/deprecated/ (100% rename, content untouched; Decision 176 clause 5): it reads
      the roadmap's north_star principles, which become a pointer. Replaced by VP step 22's graduated row.
  - file: config/agent/verification_registry/entries/deprecated/ns2-names-owning-entity.yaml
    action: Create
    purpose: The retired shard, byte-identical (the rename target).
  - file: config/agent/verification_registry/entries/roadmap-wording-sweep-definition-host.yaml
    action: Delete
    purpose: >-
      Retired by git mv into entries/deprecated/ (100% rename): its NS.3/NS.5 leg reads the roadmap's north_star
      principles. Replaced by VP step 20's graduated row, which keeps every other leg verbatim.
  - file: config/agent/verification_registry/entries/deprecated/roadmap-wording-sweep-definition-host.yaml
    action: Create
    purpose: The retired shard, byte-identical (the rename target).
  - file: config/agent/verification_registry/entries/readme-executor-row-definition-host.yaml
    action: Delete
    purpose: >-
      Retired by git mv into entries/deprecated/ (100% rename): its count of "Decision N clause 2" in README.md
      depended on the NS.3/NS.5 bullet tails the generated block drops. Replaced by VP step 21's graduated row.
  - file: config/agent/verification_registry/entries/deprecated/readme-executor-row-definition-host.yaml
    action: Create
    purpose: The retired shard, byte-identical (the rename target).
  - file: docs/plans/approved/north-star-tier-a.yaml
    action: Create
    purpose: >-
      The approved-text sidecar (docs/contracts/git-ops.yaml approved_text_binding), merged with this plan; the build
      never edits it.
  - file: docs/plans/PLAN-north-star-tier-a.yaml
    action: Create
    purpose: This plan artefact.
bundled_recommendations: []
followon_recs:
  - rec-3959
  - rec-4791
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/contracts/north-star.yaml, Decision NNN, the fourteen Promoted appends, the docs/PROJECT_CONTEXT.md pointer
    and the four README blocks equal the sidecar's blocks (approved_text verify passes with the plan's digest), the
    blocks with every {{N}} and {{DATE}} replaced by Decision NNN's number and decided_date apply to the base exactly,
    and the number is the highest Decision header (VP 17).
  - >-
    validate_north_star passes on the real tree and fails each defect by its own fixture: an unknown carried_by
    number, an unresolved ratified_via, a partial-order id that is unknown, retired or repeated, a missing NS.1-NS.5
    id, an id removed against the base, a roadmap north_star that is not the exact pointer, a boundary_patterns list
    with no entry covering the file, and a README block that differs from the render or has a marker defect (VP 2,
    5-11).
  - >-
    The models reject every shape defect, carry Benjamin's binds and adopters labels, and import nothing first-party;
    the roadmap model's north_star is a pointer that forbids extra keys (VP 3, 4, 11, 12).
  - >-
    The three retired shards sit byte-identical in entries/deprecated/ and their replacements pass on HEAD and fail on
    origin/main; every other live shard reading the touched files fails at HEAD only where it fails at origin/main
    (VP 20-24).
  - >-
    The decision corpus gates pass (entry conformance, the 6,144-byte cap for the new entry, index freshness, and
    Decision 196's forward pointer to Decision NNN), file-router.yaml and ci_rca_taxonomy.yaml stay within 500
    effective lines, and docs/PROJECT_CONTEXT.md stays within its S8 budget (VP 15, 16, 25).
  - >-
    T4.36 exists in_progress with c1-c2 met by north-star-tier-a and c3-c7 open, c7 naming "REPORT-w3 section 9" and
    "CD.47"; T4.24 c17 is open and names the move (VP 19).
  - >-
    The fast and full tiers pass; after the squash-merge dec-NNN reaches ops_decisions and rec-3959 and rec-4791 stay
    open (VP 26-28).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Precondition: the plan and its sidecar are on origin/main, the branch contains origin/main, and neither the
      contract nor the Decision exists yet.
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-north-star-tier-a.yaml && git
      cat-file -e origin/main:docs/plans/approved/north-star-tier-a.yaml && git merge-base --is-ancestor origin/main HEAD
      && test ! -e docs/contracts/north-star.yaml && ! grep -q '^## Decision [0-9]*: North stars are a Tier A file'
      docs/DECISIONS.md && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      A plan or sidecar missing from origin/main means the plan PR has not merged: stop, the build must never carry the
      sidecar (validate_merge_step fails a PR that adds it). A failing ancestry test means the branch is stale: merge
      origin/main first. An existing contract or Decision means another change landed this work: stop and ask the
      coordinator.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: validate_north_star passes on the real tree, README block and roadmap pointer included.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_north_star import validate_north_star as v; f=[]; v(f);
      assert not f, f; print('NORTH_STAR_OK')"
    expected: Exit 0 with the PASS line and the marker. Red before because the module does not exist (exit 1).
    expected_literals: []
    fix_if: >-
      A CONTRACT or CARRIED finding on the verbatim contract means the check reads it wrongly: fix the check, never the
      contract. A README or ROADMAP finding means execution step 7 or 8 was not applied as written.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_north_star is registered (execution step 5) and runs ungated on every --pre and full run; a shard
      re-running it would re-assert what the registered gate owns.
  - step: 3
    phase: pre-deploy
    action: Every model rule rejects its defect; a retired entry is known but inactive; a missing file is a ValueError.
    command: bin/venv-python -m pytest tests/test_north_star_models.py::TestEntryRules -q
    expected: Exit 0, every node passes. Red before because the file does not exist (pytest exit 4).
    expected_literals: []
    fix_if: A defect that validates means its rule is missing in the model; fix the model, never the fixture.
    hermetic: true
    graduation: graduate
    graduation_check_id: north-star-entry-rules
  - step: 4
    phase: pre-deploy
    action: The real contract carries NS.1-NS.9 in order, Benjamin's binds and adopters labels, and the declared groups.
    command: bin/venv-python -m pytest tests/test_north_star_models.py::TestRealContract -q
    expected: Exit 0, every node passes. Red before because the file does not exist (pytest exit 4).
    expected_literals: []
    fix_if: A label or order mismatch means the contract differs from the sidecar; restore it, never edit the expectation.
    hermetic: true
    graduation: graduate
    graduation_check_id: north-star-binds-labels
  - step: 5
    phase: pre-deploy
    action: A carried_by number with no Decision header fails the CARRIED leg, naming the number.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_north_star.py::test_unknown_carried_by_fails -q
    expected: Exit 0, one node passes. Red before because the file does not exist (pytest exit 4).
    expected_literals: []
    fix_if: A pass on an unknown number means the leg reads the wrong files or skips the mission.
    hermetic: true
    graduation: graduate
    graduation_check_id: north-star-carried-by-resolves
  - step: 6
    phase: pre-deploy
    action: A partial-order id that is unknown, retired or listed twice fails the ORDER leg.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_north_star.py::test_partial_order_defect_fails -q
    expected: Exit 0, every parametrized case passes. Red before because the file does not exist (pytest exit 4).
    expected_literals: []
    fix_if: A defect that passes means the leg checks membership but not activity or uniqueness.
    hermetic: true
    graduation: graduate
    graduation_check_id: north-star-partial-order-ids
  - step: 7
    phase: pre-deploy
    action: An entry id present on the base and absent at head fails the IDS leg; retiring by status passes.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_north_star.py::test_removed_id_against_base_fails -q
    expected: Exit 0, one node passes. Red before because the file does not exist (pytest exit 4).
    expected_literals: []
    fix_if: A pass means the leg does not read the base copy through _common.status_diff_base and git show.
    hermetic: true
    graduation: graduate
    graduation_check_id: north-star-ids-never-removed
  - step: 8
    phase: pre-deploy
    action: A README block that differs from render_readme_block fails the README leg.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_north_star.py::test_readme_drift_fails -q
    expected: Exit 0, one node passes. Red before because the file does not exist (pytest exit 4).
    expected_literals: []
    fix_if: A pass means the leg compares presence, not equality.
    hermetic: true
    graduation: graduate
    graduation_check_id: north-star-readme-projection
  - step: 9
    phase: pre-deploy
    action: A roadmap north_star that is missing, carries an extra key or keeps the old principles fails the ROADMAP leg.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_north_star.py::test_roadmap_pointer_mismatch_fails -q
    expected: Exit 0, every parametrized case passes. Red before because the file does not exist (pytest exit 4).
    expected_literals: []
    fix_if: A pass means the leg tests a key rather than exact equality.
    hermetic: true
    graduation: graduate
    graduation_check_id: north-star-roadmap-pointer
  - step: 10
    phase: pre-deploy
    action: >-
      A boundary_patterns list with no entry covering docs/contracts/north-star.yaml fails the BOUNDARY leg, naming the
      path; a covering directory prefix passes.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_north_star.py::test_boundary_pattern_missing_fails -q
    expected: Exit 0, every parametrized case passes. Red before because the file does not exist (pytest exit 4).
    expected_literals: []
    fix_if: A pass with no covering entry means the leg tests equality or reads the wrong list.
    hermetic: true
    graduation: graduate
    graduation_check_id: north-star-boundary-pattern
  - step: 11
    phase: pre-deploy
    action: Whole new and changed test modules, the contracts manifest test and the facade test.
    command: >-
      bin/venv-python -m pytest tests/test_north_star_models.py tests/checks/contracts/test_validate_north_star.py
      tests/checks/contracts/test__manifest.py tests/platform_roadmap_models/test_schema.py tests/test_platform_roadmap.py -q
    expected: Exit 0; every node the scope lists behaves as described.
    expected_literals: []
    fix_if: A passing negative fixture means its rule is missing; a manifest failure means the Entry literal is malformed.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-runs of modules this plan creates or modifies (vp-red-before.yaml hermetic_authoring rule v); the
      fast tier's pytest diff runs them on every PR, and steps 3-10 and 12 graduate the defining nodes.
  - step: 12
    phase: pre-deploy
    action: The roadmap model's north_star is the pointer and forbids any other key.
    command: bin/venv-python -m pytest tests/platform_roadmap_models/test_schema.py::TestNorthStarPointer -q
    expected: Exit 0, every node passes. Red before because the class does not exist (pytest exit 4).
    expected_literals: []
    fix_if: An accepted principles key means NorthStar still ignores extras.
    hermetic: true
    graduation: graduate
    graduation_check_id: roadmap-north-star-pointer-model
  - step: 13
    phase: pre-deploy
    action: >-
      The population gate accepts the new Class D file: ratified with ratified_via, a resolving check evaluator, a
      subject equal to the router topic.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v;
      f=[]; v(f); assert not f, f; print('CONTRACT_DRIFT_OK')"
    expected: Exit 0 and the marker.
    expected_literals: []
    fix_if: >-
      "evaluator does not resolve" means the check lacks the executable "north-star.yaml" literal or is not sequenced; a
      topic mismatch means the router topic is not north-star.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_contract_drift is registered in both tiers and evaluates every docs/contracts file on every run.
  - step: 14
    phase: pre-deploy
    action: The file-router carries the route whose topic is the contract subject.
    command: >-
      grep -n -x '  - topic: north-star' docs/contracts/file-router.yaml
    expected: One matching line. Red before because grep exits 1.
    expected_literals: []
    fix_if: No match means the route is missing or its topic differs from the subject.
    hermetic: true
    graduation: graduate
    graduation_check_id: router-route-north-star
  - step: 15
    phase: pre-deploy
    action: The new Decision exists, found by its title so the number never matters, and its reversal-conditions stanza parses.
    command: >-
