  - "Not bundled: rec-5221 (CI Reform code-review follow-ups: force-push range, duplicate reposts, approval_routing fence parsing) is a different outcome across another module."
  - "Graduated shard notice-digest-composer kept: it pins the whole of tests/ci/test_notice_digest.py, which stays green; its entry file is untouched, and it guards the new node, so no new shard (VP 1 waive)."
