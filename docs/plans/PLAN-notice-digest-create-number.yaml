  - "Root cause (rec-5468 why_chain, run 44781885027 on ff94388a): create succeeded, the immediate label-filtered list missed it, RuntimeError at notice_digest.py:130. Issue #2307 was created by that run; every later run (10 checked, latest 44826437425) is success through the existing-issue path."
  - "Real gh shape: gh issue create prints the new issue's URL as one stdout line (cli/cli v2.89.0 create.go:382); gh issue create has no --json flag, so the rec's corrective-action option '--json number' is not available. The test uses #2307's html_url."
  - "Prototype (scratch worktree of origin/main 6c7ca48, not committed): the scope edits pass all 13 nodes of the file; validate_weakening_candidates lists exactly the two [assertion-changed] candidates in weakening_dispositions."
  - "UNPROVEN live: the create path on a real runner (it runs only when no open notice-digest issue exists). Evidence is the gh source line above plus VP 1."
