weakening_dispositions:
  - candidate: "[assertion-changed] tests/ci/test_notice_digest.py::test_a_missing_issue_creates_the_label_then_the_issue"
    disposition: planned-change
    cite: "acceptance_criteria[0]"
  - candidate: "[assertion-changed] tests/ci/test_notice_digest.py::test_gh_failures_are_loud"
    disposition: planned-change
    cite: "acceptance_criteria[1]"
rollback: >-
  Revert the squash commit to restore the code. State outside the repository is not reverted by it: rec-5468's closure
  (VP 4) is reopened with update_rec, and VP 6's backfill comment on issue 2307 stays unless the operator deletes it.
  A revert also demotes every file it reverts to gated whole (approval-routing.yaml demotions.rule, Decision 279
  cl.7), so restoring them later needs an approval run; prefer a forward fix.
