schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: notice-digest-create-number
intent: >-
  Clear the red on main from the notice-digest workflow (rec-5468): when no open notice-digest issue exists,
  _ensure_issue takes the new issue's number from gh issue create's own output instead of re-reading the
  eventually consistent label-filtered issue list, so the first row after a create is never lost to indexing lag and
  the operator's notice read stays complete.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-notice-digest-create-number.yaml
phase: >-
  ci_rca (soft-warn exception category: rec-5468, Critical, source ci_rca, red on main from run 44781885027; no
  tier_item claimed, so the Tier Item Freshness Gate is skipped; closes no criterion). The workflow only posts to an
  issue; nothing is deployed, so V2.
cites: [dec:226, dec:235, dec:279]
scope:
  - file: scripts/ci/notice_digest.py
    action: Modify
    purpose: >-
      _ensure_issue keeps its first _issue_number() lookup (the pre-existing issue case) and its label create
      unchanged. It keeps the CompletedProcess that _gh("issue", "create", ...) returns and reads the new issue number
      from its stdout with a new module regex _ISSUE_URL = r"/issues/(\d+)\s*$" (re.M), taking the last match; gh
      writes the created issue's URL as its own stdout line (cli/cli v2.89.0 pkg/cmd/issue/create/create.go:382,
      fmt.Fprintln(opts.IO.Out, newIssue.URL)). The second _issue_number() call after the create is removed. A
      create whose stdout holds no issue URL raises RuntimeError("gh issue create printed no issue URL: <stdout
      repr>") (fail loud; main() already turns it into ERROR and exit 1). No other function changes; no new import.
  - file: tests/ci/test_notice_digest.py
    action: Modify
    purpose: >-
      New node test_ensure_issue_captures_create_response_number (rec-5468's acceptance): replies list "[]", label
      create ok, issue create stdout "https://github.com/otl-labs/ontheloop/issues/2307\n" (the real shape: html_url
      of the live digest issue plus gh's newline); asserts _ensure_issue() == 2307 and the gh call kinds are exactly
      list, label create, issue create (no second list). A second case in the same node feeds create stdout with a
      leading non-URL line before the URL and asserts the URL's number is still read. Two existing nodes follow the
      planned change (weakening_dispositions): test_a_missing_issue_creates_the_label_then_the_issue drops the second
      ("issue", "list") from its expected kinds and gets its number (12) from the create reply's URL instead of a
      list reply; test_gh_failures_are_loud's create-then-missing case becomes create stdout "" raising "printed no
      issue URL". Every other assertion unchanged (Decision 235).
bundled_recommendations: [rec-5468]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - When no open notice-digest issue exists, _ensure_issue returns the number in gh issue create's stdout URL and makes no issue list call after the create.
  - A gh issue create whose stdout holds no issue URL fails loudly (RuntimeError naming the output; main exits 1).
  - The pre-existing issue path (lowest open labelled issue, no create) is unchanged.
  - rec-5468's acceptance node passes, and rec-5468 closes on the build's merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "rec-5468's acceptance node plus the two changed nodes (red before: the acceptance node does not exist on main; with it but no source change, the second list call gets the recorder's empty default reply and _ensure_issue raises not-found-after-creating-it before any assertion runs)."
    command: bin/venv-python -m pytest "tests/ci/test_notice_digest.py::test_ensure_issue_captures_create_response_number" "tests/ci/test_notice_digest.py::test_a_missing_issue_creates_the_label_then_the_issue" "tests/ci/test_notice_digest.py::test_gh_failures_are_loud" -q
    expected: exit 0, every node passed, none failed
    fix_if: a node fails (the create stdout is not parsed, the second list call remains, or the no-URL error text differs)
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Duplicates an already-graduated check; shard notice-digest-composer pins the whole of tests/ci/test_notice_digest.py, so the new node is a standing guard from the day it lands.
  - step: 2
    phase: pre-deploy
    action: Re-run the whole test file, existing cases included.
    command: bin/venv-python -m pytest tests/ci/test_notice_digest.py -q
    expected: exit 0, no failures
    fix_if: an existing case fails (fix the code, never loosen an assertion, Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file re-run of a test file this plan modifies; graduated shard notice-digest-composer already pins this file, so it adds no standing guard.
  - step: 3
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): bin/venv-python -m scripts.validate --pre in the
      foreground (exit 0), then this command as its own backgrounded run with a 2 h limit from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: "--pre exited 0 first; this command exits 0 for HEAD"
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun; a failure only in another project's open
      red goes to the operator as the implement skill's go/no-go; it never hands off on a non-green full tier by default
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: post-deploy
    action: Confirm rec-5468 closed after the squash merge (Resolves trailer).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      r=make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5468')[0]; print(r['status']); assert r['status']=='closed'"
    expected: rec-5468 status closed
    fix_if: still open after ci.yml's closure job ran; close it with update_rec citing the merge SHA
    hermetic: false
  - step: 5
    phase: post-deploy
    action: >-
      The notice-digest run for the merge commit itself (the build's diff changes a docs/plans notice file, so the
      run posts a row) concludes success and its row is on the digest issue. This proves the unchanged existing-issue
      path on the new code; the create path only runs when no labelled issue is open and stays proven by VP 1 (see
      context UNPROVEN).
    command: >-
      echo 'READ VIA MCP: mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="notice-digest.yml") for the run whose head_sha is the merge SHA, then mcp__github__issue_read
      (method="get_comments", issue_number=2307) for its row -- never the gh CLI (AGENTS.md Shell invocations)'
    expected: the merge commit's notice-digest run concluded success and issue 2307 carries its row
    fix_if: failure or no run for the merge commit; read the run log via mcp__github__get_job_logs and file a rec naming the run id
    hermetic: false
  - step: 6
    phase: post-deploy
    action: >-
      Backfill the one row run 44781885027 printed but never posted (operator choice at sign-off, recommended
      option). Read that run's job log as text (get_job_logs with return_content=true), take the line containing
      "PR #2306", strip only the leading Actions timestamp (the first space-separated token), and post the rest
      verbatim once as a comment on issue 2307, prefixed "Backfill (run 44781885027 failed before posting):". Post
      only if no comment on issue 2307 already contains "PR #2306".
    command: >-
      echo 'VIA MCP: mcp__github__get_job_logs(owner="otl-labs", repo="ontheloop", run_id=44781885027, failed_only=true,
      return_content=true) for the PR #2306 line, timestamp stripped; mcp__github__issue_read(method="get_comments", issue_number=2307) to confirm no comment holds
      "PR #2306"; then mcp__github__add_issue_comment(issue_number=2307, body=<prefix + row>) and read the comment id back'
    expected: exactly one comment on issue 2307 contains "PR #2306", with the backfill prefix; its comment id is reported
    fix_if: >-
      the log line is unreadable (report it and stop; never compose the row by hand); or a second copy exists (the MCP has
      no comment delete: edit the newer copy with mcp__github__update_issue_comment to "Duplicate of comment <id>" and
      ask the operator to delete it)
    hermetic: false
test_obligations:
  - source: scripts/ci/notice_digest.py
    behavior: A created digest issue's number comes from gh issue create's stdout URL, with no list call after the create; a create with no URL in its output fails loudly.
    verification_step: 1
    test_selector: tests/ci/test_notice_digest.py::test_ensure_issue_captures_create_response_number
    red_green_expectation: red before (node absent; then, without the source change, RuntimeError "not found after creating it" from the second list call), green after.
constraints:
  - Only the two changed nodes' assertions change, each recorded in weakening_dispositions as planned-change; every other assertion stays (Decision 235).
  - gh is still called through _gh / subprocess.run only; no retry or sleep loop is added (the create response makes the second read unnecessary).
  - The workflow file is untouched.
  - No rescue agents or workaround loops (Decision 55).
