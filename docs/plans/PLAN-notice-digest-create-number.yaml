  - {gate: plan-critique, round: 1, verdict: PROCEED, blocking: 0, nits: 5}  # applied: N1 red mechanism reworded; N2 VP 1 waive (composer shard pins the file), VP 2 waiver cites it; N3 rollback names rec closure and the backfill comment; N4 duplicate path via update_issue_comment + operator delete; N5 no change (echo-MCP precedent); Q3 URL parse settled with notice
