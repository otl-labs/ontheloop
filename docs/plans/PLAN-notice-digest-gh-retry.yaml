schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: notice-digest-gh-retry
intent: >-
  Clear the Critical ci_rca red rec-5543 by making the notice digest's gh calls survive one transient GitHub fault: a
  bounded retry on transient statuses, a guard so a retried comment that GitHub already applied is not posted twice,
  and an issue number taken from the created issue's URL so a lagging issue list right after creation no longer drops
  the row. No row is ever skipped to get green.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-notice-digest-gh-retry.yaml
phase: >-
  ci_rca (soft-warn exception category): repair of the main red rec-5543 the operator handed CI Reform on 2026-11-23.
  No tier_item is claimed and no exit criterion is closed.
closes_criteria: []
cites: [dec:55, dec:186, dec:226, dec:235, dec:246, dec:279]
scope:
  - file: scripts/ci/notice_digest.py
    action: Modify
    purpose: >-
      _gh gains a bounded retry (4 attempts, sleeps of 2, 5 and 10 s through a module-level _sleep wrapper around
      time.sleep) that fires only when stderr matches HTTP 499, 502, 503 or 504; any other failure, and a transient one
      on the last attempt, raises exactly as today. A retry=False switch keeps gh issue create out of it (not
      idempotent). Row posting moves to a _comment helper: it calls gh issue comment with retry off, and on a transient
      failure waits, then reads the issue's comments over REST (gh api --paginate --slurp on the repository's issue
      comments route, so every page is read and the read does not share the GraphQL route the 499 came from) and
      returns without posting again when a comment already holds the row (bodies compared after normalising CRLF and
      stripping); a failing guard read falls through to the retry, since a duplicate costs less than a lost row. _ensure_issue reads the new
      issue's number from the URL gh issue create prints and takes the lowest of it and the relisted number, so an
      empty relist no longer fails; the existing "not found after creating" error stays for an unparsable URL plus an
      empty list. The module still imports only stdlib, yaml and scripts.roadmap.approval_routing (import time is
      stdlib).
    new_imports: []
  - file: tests/ci/test_notice_digest.py
    action: Modify
    purpose: >-
      An autouse fixture replaces nd._sleep with a recorder, so no test sleeps and the waits are asserted. Five new
      nodes: test_post_retries_transient_gh_failure (rec-5543's acceptance node: issue list, then comment fails with
      HTTP 499, the guard read shows no row, comment succeeds; asserts the call order, one recorded 2 s wait and the row posted
      once), test_a_retried_comment_that_already_landed_is_not_posted_twice (the guard read returns a comment whose
      body equals the row, so no second comment call), test_retry_is_bounded_and_other_failures_are_not_retried (four 499s raise
      "gh issue comment failed" after exactly four comment calls and waits of 2, 5, 10; a denied failure raises after
      one call and no wait), test_a_lagging_list_after_create_uses_the_created_number (empty list, label, create
      printing an issues URL, empty list, comment goes to that number), test_issue_create_is_not_retried (a 502 on
      create raises after one create call). The existing nodes, including the "not found after creating" assertion,
      are unchanged.
    new_imports: []
bundled_recommendations: [rec-5543]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "A transient gh failure (HTTP 499, 502, 503 or 504) on an issue list, label create or issue comment is retried at most 3 more times with waits of 2, 5 and 10 s, then raises as today; any other gh failure raises on the first attempt."
  - "A comment retried after a transient failure is not posted again when the issue already holds a comment with the same body."
  - "gh issue create is never retried, and an empty issue list right after it no longer fails the run: the number comes from the URL gh printed."
  - "rec-5543's acceptance node test_post_retries_transient_gh_failure passes, red before; every existing node in tests/ci/test_notice_digest.py still passes with its assertions unchanged."
  - "rec-5543 is closed by the merge's Resolves trailer, through the Decision 186 closure obligation against its closure_artifact shard:notice-digest-gh-retry."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The five new nodes pass, including rec-5543's acceptance node.
    command: >-
      bin/venv-python -m pytest
      tests/ci/test_notice_digest.py::test_post_retries_transient_gh_failure
      tests/ci/test_notice_digest.py::test_a_retried_comment_that_already_landed_is_not_posted_twice
      tests/ci/test_notice_digest.py::test_retry_is_bounded_and_other_failures_are_not_retried
      tests/ci/test_notice_digest.py::test_a_lagging_list_after_create_uses_the_created_number
      tests/ci/test_notice_digest.py::test_issue_create_is_not_retried -q
    expected: exit 0 with 5 passed; red before (each node fails on the missing retry, guard or URL parse)
    fix_if: a node fails; the retry, guard or created-number path is wrong
    hermetic: true
    expected_literals: ["5 passed"]
    graduation: graduate
    graduation_check_id: notice-digest-gh-retry
  - step: 2
    phase: pre-deploy
    action: Every node in the digest's test file passes, the old ones with their assertions unchanged.
    command: bin/venv-python -m pytest tests/ci/test_notice_digest.py -q
    expected: exit 0, no failure
    fix_if: an existing node fails; the gh call order the old nodes pin changed
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: The file already runs in the full tier; step 1 carries the new regression.
  - step: 3
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 4
    phase: post-deploy
    action: >-
      The notice-digest run for the merge push (the workflow runs on every push to main) completes green with the new
      script. It proves the workflow still starts and exits 0 with the new code; a real GitHub 499 cannot be induced
      from a cloud environment, so the retry itself is proven by step 1 against a faked gh and is unproven live.
    command: >-
      SHA=$(git fetch -q origin main && git log origin/main -1 --format=%H -E --grep='^(build|fix|test)\(notice-digest-gh-retry\)') && test -n "$SHA" &&
      gh run list --repo otl-labs/ontheloop --workflow notice-digest.yml --commit "$SHA" --json databaseId,conclusion
    expected: one run for the merge commit with conclusion success; record its id
    fix_if: the run failed; read its job log, and file or fix the cause on a new branch, never a re-run to green
    hermetic: false
  - step: 5
    phase: post-deploy
    action: >-
      rec-5543 is closed by the merge's Resolves trailer through the Decision 186 closure obligation: it is
      escape-classified (no-edge), and its closure_artifact shard:notice-digest-gh-retry is recorded at plan write, so
      the trailer closure resolves it once the shard (step 1's graduation) is on main.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5543']); print([(r['id'], r['status']) for r in rows])"
    expected: rec-5543 closed after the closure job runs on the merge commit
    fix_if: >-
      still open; read the closure job log for a ClosureArtifactRequired or acceptance refusal marker and fix its cause
      (the shard file missing from the merge, or no Resolves line in the squash body), never a direct status write
    hermetic: false
test_obligations:
  - source: scripts/ci/notice_digest.py
    behavior: a transient gh failure is retried within bounds, a landed row is not re-posted, a lagging list after create still finds the issue, and create is never retried
    verification_step: 1
    test_selector: tests/ci/test_notice_digest.py::test_post_retries_transient_gh_failure
    red_green_expectation: red before (the first gh failure raises), green after
constraints:
  - "No test, assertion or workflow condition is loosened (Decision 235): the existing nodes stay as they are, including the 'not found after creating' assertion, and a failed run still raises and exits 1 once the bounded retry is spent."
  - "The workflow file, the digest row format and the issue title and label are not edited; no new environment variable, secret or config key (the retry constants are module-level, so Decision 224's project-configuration row does not apply)."
  - "The module keeps importing only stdlib, yaml and scripts.roadmap.approval_routing: the workflow installs pyyaml alone."
  - "Both scope files sit on the executor boundary (config/agent/executor/capabilities.yaml boundary_patterns row notice_digest, the Decision 235 cl.5 floor): the edit is human-directed /plan -> /implement, never executor-authored, and rec-5543 stays automatable: false (read 2026-11-23). The autouse _sleep fixture only removes real waiting; no assertion of the floor check is loosened (Decision 235 cl.1 and cl.5)."
  - "No rescue agents or workaround loops (Decision 55): the bounded retry is Decision 55's deterministic recovery for a well-understood failure class."
context:
