  - "The workflow file, the digest row format, the issue title and label, and _ensure_issue (already fixed by rec-5468, PR #2330) are not edited; no new environment variable, secret or config key (the retry constants are module-level, so Decision 224's project-configuration row does not apply)."
  - "The module keeps importing only stdlib, yaml and scripts.roadmap.approval_routing: the workflow installs pyyaml alone."
  - "Both scope files sit on the executor boundary (config/agent/executor/capabilities.yaml boundary_patterns row notice_digest, the Decision 235 cl.5 floor): the edit is human-directed /plan -> /implement, never executor-authored, and rec-5543 stays automatable: false (read 2026-11-23). The autouse _sleep fixture only removes real waiting; no assertion of the floor check is loosened (Decision 235 cl.1 and cl.5)."
  - "No rescue agents or workaround loops (Decision 55): the bounded retry is Decision 55's deterministic recovery for a well-understood failure class."
