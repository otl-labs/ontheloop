schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: notice-digest-gh-retry
intent: >-
  Clear the Critical ci_rca red rec-5543 by making the notice digest's gh calls survive one transient GitHub fault: a
  bounded retry on transient statuses, and a guard so a retried comment that GitHub already applied is not posted
  twice. No row is ever skipped to get green.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-notice-digest-gh-retry.yaml
phase: >-
  ci_rca (soft-warn exception category): repair of the main red rec-5543 the operator handed CI Reform on 2026-11-23.
  No tier_item is claimed and no exit criterion is closed.
closes_criteria: []
cites: [dec:55, dec:186, dec:226, dec:235, dec:246, dec:279]
scope:
  - file: scripts/ci/notice_digest.py
    action: Modify
    purpose: >-
      _gh gains a bounded retry (4 attempts, waits of 2, 5 and 10 s through a module-level _sleep wrapper around
      time.sleep) that fires only when stderr matches HTTP 499, 502, 503 or 504; any other failure, and a transient one
      on the last attempt, raises exactly as today. A retry=False switch keeps gh issue create out of it (not
      idempotent). Row posting moves to a _comment helper that posts with retry=False and, on a transient failure,
      waits (when a retry remains), then reads the issue's comments over REST (gh api --paginate --slurp on the
      repository's issue comments route, with retry=False so the total wait stays 17 s; --slurp returns an array of page
      arrays, and the {owner}/{repo} placeholders resolve from the checkout's git remote as the gh issue calls
      already do) and returns without posting again when a comment body equals the body that was posted (the _fit
      text, CRLF normalised and stripped). Empty, non-JSON or failing guard output, and a null body, count as not
      landed: a duplicate costs less than a lost row. The guard also runs after the last transient failure, with no wait,
      and the run raises only when it finds no row. The module still imports only stdlib, yaml and
      scripts.roadmap.approval_routing: the workflow installs pyyaml alone (the new import time is stdlib).
    new_imports: []
  - file: tests/ci/test_notice_digest.py
    action: Modify
    purpose: >-
      An autouse fixture replaces nd._sleep with a recorder, so no test sleeps and the waits are asserted. Four new
      nodes: test_post_retries_transient_gh_failure (rec-5543's acceptance node: issue list, then comment fails with
      HTTP 499, the guard read shows no row, comment succeeds; asserts the call order, one recorded 2 s wait and the
      row posted once), test_a_retried_comment_that_already_landed_is_not_posted_twice (the guard read returns the
      --slurp shape, an array holding one page array, whose comment body equals the posted body, so no second comment
      call; the same node covers a failing guard read, empty stdout, non-JSON stdout and a null body, each falling
      through to a second comment call), test_retry_is_bounded_and_other_failures_are_not_retried (four 499s with an
      empty guard read each raise "gh issue comment failed" after exactly four comment calls, four guard reads and
      waits of 2, 5, 10; a denied failure raises after one call, no guard read and no wait; a 503 on issue list is
      retried and then succeeds), test_issue_create_is_not_retried (a 502 on create raises after one create call and
      no wait; it passes before the change too and pins retry=False). The existing nodes, including the "printed no
      issue URL" assertion, are unchanged.
    new_imports: []
bundled_recommendations: [rec-5543]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "A transient gh failure (HTTP 499, 502, 503 or 504) on an issue list, label create or issue comment is retried at most 3 more times with waits of 2, 5 and 10 s, then raises as today; any other gh failure raises on the first attempt."
  - "A comment retried after a transient failure, including after the last one, is not posted again when the issue already holds a comment with the same body."
  - "gh issue create is never retried."
  - "rec-5543's acceptance node test_post_retries_transient_gh_failure passes and fails before the change; every existing node in tests/ci/test_notice_digest.py still passes with its assertions unchanged."
  - "rec-5543 is closed by the merge's Resolves trailer, through the Decision 186 closure obligation against its closure_artifact shard:notice-digest-gh-retry."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The four new nodes pass, including rec-5543's acceptance node.
    command: >-
      bin/venv-python -m pytest
      tests/ci/test_notice_digest.py::test_post_retries_transient_gh_failure
      tests/ci/test_notice_digest.py::test_a_retried_comment_that_already_landed_is_not_posted_twice
      tests/ci/test_notice_digest.py::test_retry_is_bounded_and_other_failures_are_not_retried
      tests/ci/test_notice_digest.py::test_issue_create_is_not_retried -q
    expected: >-
      exit 0 with 4 passed; the first three fail before the change (no retry, no guard); test_issue_create_is_not_retried
      passes before and after, a pin against dropping retry=False
    fix_if: a node fails; the retry, the guard or the create switch is wrong
    hermetic: true
    expected_literals: ["4 passed"]
    graduation: graduate
    graduation_check_id: notice-digest-gh-retry
  - step: 2
    phase: pre-deploy
    action: Every node in the digest's test file passes, the old ones with their assertions unchanged.
    command: bin/venv-python -m pytest tests/ci/test_notice_digest.py -q
    expected: exit 0, no failure
    fix_if: an existing node fails; the gh call order the old nodes pin changed
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: The file already runs in the full tier and in the graduated notice-digest-composer shard; step 1 carries the new regression.
  - step: 3
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 4
    phase: post-deploy
    action: >-
      The notice-digest run for the merge push (the workflow runs on every push to main) completes green with the new
      script. It proves the workflow still starts and exits 0 with the new code; a real GitHub 499 cannot be induced
      from a cloud environment, so the retry itself is proven by step 1 against a faked gh and is unproven live (the
      build report says so).
    command: >-
      SHA=$(git fetch -q origin main && git log origin/main -1 --format=%H -E --grep='^(build|fix|test)\(notice-digest-gh-retry\)') && test -n "$SHA" &&
      gh run list --repo otl-labs/ontheloop --workflow notice-digest.yml --commit "$SHA" --json databaseId,conclusion
    expected: one run for the merge commit with conclusion success; record its id
    fix_if: the run failed; read its job log, and file or fix the cause on a new branch, never a re-run to green
    hermetic: false
  - step: 5
    phase: post-deploy
    action: >-
      rec-5543 is closed by the merge's Resolves trailer through the Decision 186 closure obligation: it is
      escape-classified (no-edge), and its closure_artifact shard:notice-digest-gh-retry is recorded at plan write, so
      the trailer closure resolves it once the shard (step 1's graduation) is on main.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5543']); print([(r['id'], r['status']) for r in rows])"
    expected: rec-5543 closed after the closure job runs on the merge commit
    fix_if: >-
      still open; read the closure job log for a ClosureArtifactRequired or acceptance refusal marker and fix its cause
      (the shard file missing from the merge, or no Resolves line in the squash body), never a direct status write
    hermetic: false
test_obligations:
  - source: scripts/ci/notice_digest.py
    behavior: a transient gh failure on a comment is retried once and posts the row once
    verification_step: 1
    test_selector: tests/ci/test_notice_digest.py::test_post_retries_transient_gh_failure
    red_green_expectation: red before (the first gh failure raises), green after
  - source: scripts/ci/notice_digest.py
    behavior: a retried comment that GitHub already applied is not posted twice, and unreadable guard output posts anyway
    verification_step: 1
    test_selector: tests/ci/test_notice_digest.py::test_a_retried_comment_that_already_landed_is_not_posted_twice
    red_green_expectation: red before (no retry path), green after
  - source: scripts/ci/notice_digest.py
    behavior: the retry stops at four attempts with waits of 2, 5 and 10 s, and a failure that is not transient is never retried
    verification_step: 1
    test_selector: tests/ci/test_notice_digest.py::test_retry_is_bounded_and_other_failures_are_not_retried
    red_green_expectation: red before (one attempt only), green after
  - source: scripts/ci/notice_digest.py
    behavior: gh issue create is never retried
    verification_step: 1
    test_selector: tests/ci/test_notice_digest.py::test_issue_create_is_not_retried
    red_green_expectation: green before and after (a pin against dropping retry=False, not a red-before node)
