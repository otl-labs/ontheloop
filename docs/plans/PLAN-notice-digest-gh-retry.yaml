  - "Both are scripts/ci/notice_digest.py _gh and _ensure_issue; the existing node at tests/ci/test_notice_digest.py (test_a_missing_issue_creates_the_label_then_the_issue) mocks the relist as immediately consistent, which is why neither was caught."
  - "Precedent for a bounded gh retry: scripts/ci/dependabot_stranded_sweep.sh:78 (_gh_bounded_retry). Statuses retried: 499, 502, 503, 504 matched in gh's stderr (inferred as the transient set; 499 from the rec's log). Total wait is 17 s against the workflow's 10 minute timeout."
  - "Forks decided with notice (consistency-only, no always-ask item): retry reads, label create and the guarded comment but never gh issue create (not idempotent); a failing guard read posts anyway (a duplicate beats a lost row); the guard reads over REST because the 499 came from the GraphQL route (gh api --paginate --slurp needs gh 2.48 or newer: it ran on 2.89 in a session read of issue #2307, 89 comments; the runner image's version is inferred, and an unsupported flag fails the read, which falls through to the retry); rows already lost stay a separate operator-called backfill by re-running runs 44781885027 and 45232494715 after checking the issue for the row, not part of this plan."
  - "Red overlap: rec-5543 is the open red this plan repairs and bundles (Decision 226 cl.3). It blocks the CI RCA script-extraction build (rec-5500, PLAN-ci-rca-step-extraction) at its red_overlap gate through the shared test file tests/ci/test_notice_digest.py."
  - "rec-5543 closure (Decision 186): escape_class no-edge; closure_artifact shard:notice-digest-gh-retry recorded at plan write without a status change, so the build's trailer closure resolves it against the merge sha once the shard is on main."
