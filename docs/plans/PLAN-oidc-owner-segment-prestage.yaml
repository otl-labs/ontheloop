schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "oidc-owner-segment-prestage"
intent: >-
  Make the GitHub organisation transfer unable to lock CI out: pre-stage the otl-labs owner segment
  additively in every OIDC trust (both Terraform roots, all five CI roles) while the personal segment still
  works, prove every role still assumes on the current path, and land the transfer contract's registered
  evaluator so the trust lists stay tied to the contract's phase from here to predecessor removal
  (rec-3902; Decision 218 clause 2; docs/contracts/github-org-transfer.yaml breakage_map.oidc_trust_segment).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-oidc-owner-segment-prestage.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-3902, no tier_item criterion claimed. Executes the first
  gate of docs/contracts/github-org-transfer.yaml phases.pre_stage (breakage_map.oidc_trust_segment) and the
  contract's planned evaluator upgrade (tracking.executed_by). Does not flip identity.phase: pre_staged also
  needs console steps, minted tokens, the Dependabot guard (rec-3903) and the terraform/github prerequisites
  (rec-4335, rec-3136), which other plans own. Adjacent: T2.48 (not widened), T2.54 (a new contract-reading
  check, consistent).
scope:
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-
      Append the target segment "otl-labs@<OTL_ORG_ID>/ontheloop@1252427466" to local.github_repos after the
      current entry (the org numeric id appears ONLY here and in the bootstrap list). Re-ground the locals
      comment to the pre-staged state (Decision 218), keeping CONTRACTED STEADY STATE as the history it
      follows, and drop the overclaim rec-3167 names. Consumed unchanged by oidc_ci_roles.tf and
      oidc_pipeline_roles.tf, which are NOT edited.
  - file: terraform/bootstrap/github_ci_apply.tf
    action: Modify
    purpose: >-
      Same entry in the mirrored list, same commit (cross-root agreement test). Re-ground the locals comment and
      the stale dual-slug comments in this file; the role description becomes exactly "GitHub Actions sandbox
      apply (Decisions 77, 94): refs/heads/main and environment:tf-gated-apply via OIDC" (rec-3128). The trust template is unchanged.
  - file: tests/checks/iam_tf/test_oidc_trust_slug_invariants.py
    action: Modify
    purpose: >-
      Add TestTargetOwnerSegment::test_both_roots_stage_the_target_segment: each root carries exactly one entry
      whose owner is otl-labs and repository ontheloop, whose repository id equals the durable _EXPECTED_REPO_ID
      constant (so the node survives predecessor removal), and whose owner id is digits and differs from
      _EXPECTED_OWNER_ID. It pins NAMES and repo-id equality, never
      the org id (operator ruling, contract identity.target.owner_numeric_id). Make
      test_both_roots_declare_the_immutable_entry find the current entry by owner, not list position. Update
      the module docstring for the two-entry pre-staged state.
  - file: scripts/checks/contracts/validate_github_org_transfer.py
    action: Create
    purpose: >-
      The contract's registered evaluator (invariant 1). Reads docs/contracts/github-org-transfer.yaml (path
      as an executable string literal, Decision 168) and both local.github_repos lists. Resolves the governing
      phase value as identity.staged_phase when set, else identity.phase; fails when staged_phase is set to
      anything but the value immediately after identity.phase in identity.phase_values. Fails when: a file is
      missing or unparseable; the lists differ across roots; an entry is not OWNER@OWNER-ID/REPO@REPO-ID;
      entries carry more than one repository id; an entry's owner/repository pair is neither
      identity.current's nor identity.target's; a segment repeats; or the entries' segment set is not EXACTLY
      the trusted_segments of the phase whose exit_sets_phase equals the governing value. No-silent-skip: it
      evaluates breakage_map.oidc_trust_segment and names every other detection: static row as pending; it fails
      on a static row in neither, on a row in both, or on a named row the contract no longer has. PUBLIC
      EXTENSION INTERFACE (the literal sweep plan, rec-3903, and the terraform/github row's owner extend the check
      through these exact
      names, agreed 2026-10-15): load_contract(repo_root: Path) -> dict | None (parsed contract, None after
      registry.skipped on a missing or unparseable file); ROW_EVALUATORS: dict[str, Callable[[dict, Path,
      list[str]], None]] (row id -> evaluator(contract, repo_root, failed) that appends failure strings; this
      plan registers only "oidc_trust_segment"); PENDING_STATIC_ROWS: dict[str, str] (row id -> owning rec,
      each value mirroring that breakage_map row's own rec field at build time: dependabot_repository_guard,
      owner_literal_defaults, codeowners, descriptive_literals -> rec-3903; terraform_github_root -> rec-3136, or
      rec-4355 if the state-fix closure has already moved the row). The check fails when a value differs from its
      row's rec, so a PR that re-homes a row edits both together. An extending plan moves its row from
      PENDING_STATIC_ROWS to ROW_EVALUATORS. Row evaluators only append to failed; they never call registry.examined()/skipped()
      (the parent check's declaration is last-writer-wins, Decision 170). Edits nothing rec-3903 owns. Declares registry.examined()/skipped() (Decision 170). Never
      raises at import.
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      One bare-literal Entry for validate_github_org_transfer (Decision 169): pre=True, pre_globs=None (ungated,
      the validate_portal_drift precedent), because the rec-3903 extension agreed with the literal sweep plan
      makes the check read every tracked file, which no static glob encloses; full_segment full_after_lint. The
      check reads three files today, so running it on every --pre costs nothing.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: "function_to_category row: validate_github_org_transfer -> schema_drift."
  - file: tests/checks/contracts/test_validate_github_org_transfer.py
    action: Create
    purpose: >-
      One class, TestValidateGithubOrgTransfer, over tmp_path fixtures (synthetic contract plus both .tf
      files) and the real tree: green at pre_transfer (no staged_phase) with [current]; red there with
      [current, target]; green at pre_transfer + staged_phase pre_staged with [current, target]; red there with
      [current]; red when staged_phase skips a phase (pre_transfer -> transferred); green at proven +
      staged_phase predecessor_removed with [target]; red at proven (no staged_phase) with [target]; red on an
      unknown owner, two repository ids, a cross-root mismatch, a non-immutable entry, a duplicate, a missing
      contract, an unknown phase value, a static breakage row neither evaluated nor pending, a row in both
      ROW_EVALUATORS and PENDING_STATIC_ROWS, a named row absent from the contract, staged_phase equal to
      identity.phase, staged_phase preceding it, staged_phase set while identity.phase is the last value, an
      unparseable contract, a
      missing or unparseable .tf file, a .tf file with no github_repos list, and a governing value no phase's
      exit_sets_phase names, and a PENDING_STATIC_ROWS value that differs from its row's rec; green on the real
      tree;
      the three interface names exist with their documented shapes; and the check is registered under its
      name. Parametrize the phase matrix so the class stays one selector (the graduated node) and the file stays
      well under 500 SLOC.
  - file: docs/contracts/github-org-transfer.yaml
    action: Modify
    purpose: >-
      The seven operator-approved edits, verbatim (context names the approvals): evaluator agent_surface ->
      check validate_github_org_transfer; a second amendment_log entry; identity.staged_phase: pre_staged;
      planned_evaluator rewritten; breakage_map.oidc_trust_segment.fix names the admin split-apply;
      tracking.decision_172_review points at the re-armed stanza; identity.current.trust_segment_ref and
      identity.target.owner_numeric_id re-worded for the two-segment state. identity.phase stays pre_transfer.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Decision 172 only, operator-approved text verbatim: the fenced reversal-conditions stanza re-armed
      (review_by 2027-04-30; legacy-entries-provably-dead-with-proof replaced by
      old-owner-segment-removed-with-proof; future-rename-not-prestaged and on_trigger unchanged), legal under
      Decision 177 clause 4, plus one appended "> **Update (...):**" line at the end of the entry. No other
      entry changes; no new numbered Decision.
  - file: config/agent/verification_registry/entries/github-org-transfer-contract.yaml
    action: Modify
    purpose: >-
      The existing graduated row greps 'agent_surface: docs/CLAUDE.md', which Edit 1 removes; repoint that grep
      to 'check: validate_github_org_transfer' so the standing check stays true (its other greps unchanged).
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      The operator-approved governance note and amendment_log entry (draft/verification-registry-note.md) that
      record the in-place repoint of github-org-transfer-contract; governance_notes is the only provenance surface
      for an in-place row edit (Decision 176).
  - file: tests/checks/contracts/test__manifest.py
    action: Modify
    purpose: >-
      Add TestGithubOrgTransferPromotedUngated beside TestPortalDriftPromotedUngated: the Entry is dispatched in
      --pre (registry.pre_sequence()) and in the full tier (registry.full_sequence()), and declares no pre_globs
      (the convention for an ungated Entry).
  - file: config/agent/verification_registry/entries/oidc-trust-target-owner-segment-staged.yaml
    action: Create
    purpose: "Graduated row for VP step 2 (test_selector, plan_slug oidc-owner-segment-prestage)."
  - file: config/agent/verification_registry/entries/github-org-transfer-evaluator-tests.yaml
    action: Create
    purpose: "Graduated row for VP step 3 (test_selector, plan_slug oidc-owner-segment-prestage)."
bundled_recommendations:
  - rec-3902
  - rec-3167
  - rec-3128
followon_recs:
  - rec-4356
infrastructure_dependencies:
  - >-
    terraform/personal: an IAM trust diff on github_ci_branch, github_ci_pr, github_ci_planner and
    github_ci_deploy (assume_role_policy only). The guard routes it to tf-gated-apply (Decision 77/92). The CI
    apply role may rewrite trust ONLY on branch and pr (terraform/bootstrap/github_ci_apply_policy.tf Sid
    IAMRoleReconcile, pinned by tests/checks/iam_tf/test_iam_role_reconcile_trust_scope.py, Decision 143
    clause 1), so planner and deploy go first by an ADMIN split-apply with -target (Decision 183 point 4;
    docs/contracts/deploy-paths.yaml admin_out_of_band.procedure SPLIT-APPLY; Decision 126 human-gated tier)
    and branch and pr then go through the governed gated apply. Never widen IAMRoleReconcile to avoid the
    split (the rename-era rec-3132 widening needed a whole plan to revert).
  - >-
    terraform/bootstrap: operator-only manual apply (terraform/bootstrap/CLAUDE.md), one in-place update of
    github_ci_apply (assume_role_policy, description). The pre_merge_live_plan rule applies (VP 10, 12).
    .github/CODEOWNERS makes /terraform/bootstrap/ a code-owner path: the PR needs the operator's review.
  - >-
    ORDER IS LOAD-BEARING (Decision 183 point 4: split FIRST, then the governed path carries the remainder):
    split-apply planner and deploy from the final PR head (VP 15) -> re-run the PR's speculative plan so its
    saved plan.bin carries only branch and pr (VP 16) -> merge (VP 17; the push run routes and waits) ->
    bootstrap apply (VP 18; separate state, so the waiting plan stays fresh) -> the operator approves the
    gated job (VP 19) -> green. Merging first would leave the push run holding a four-role saved plan that the
    split makes stale, and the only ways to clear such a waiting run are a cancel, which the API could not do in
    the 2026-07-23 episode (docs/plans/reports/OVERSEER-terraform-deploy-redesign.yaml:267), or a reject, which
    concludes the run as failure on main so ci-rca files a rec (ci-rca.yml:59; terraform-apply-sandbox.yml:814
    names reject as the release). Splitting before the merge avoids both. The trade: VP 15 applies the final PR
    head's (additive) trust to two roles before merge, which Decision 190's bounded pending_codification marker
    exists to carry.
  - >-
    TWO-HOUR WINDOW: rec-4050 is open, so the hourly terraform-drift tick (cron 17 * * * *) marks the pending
    delta pending_codification and escalates it to red after 2.0 h (Decision 190 point 3; environment-taxonomy
    convergence_marker_vocabulary). The clock starts at the VP 15 split-apply (state ahead of main): start it
    right after a drift tick and finish VP 15-19 in one sitting. A missed window latches red: review its rec, then
    the acknowledge-and-retry dispatch naming the red commit plans fresh and routes the same remainder (or VP 15's
    fix_if restores the two roles if the merge is abandoned). Each tick in the window files a
    "Terraform drift check found a pending-..." tf_drift rec that nothing auto-closes, and convergence-health may file a tf_convergence_stale rec that closes
    itself once the backlog drains (VP 27 checks both).
  - >-
    No permission, boundary or policy change: trust only, additive. Not a grant-surface change, so the
    POST-APPLY iam_simulate gate and the PRE-APPLY narrowing check do not apply. The platform-security
    role-change detector does not fire (terraform/bootstrap/platform_security_alarms.tf:24 matches only
    PlatformDev, PlatformAdmin and two policies); platform-security-denied-iam-write (:27) fires on any
    AccessDenied IAM write, which the planned sequence never makes but a mistaken approval of the stale push
    run's four-role plan, or a skipped split-apply, would (VP 16, 19 fix_if). Largest projected trust document ~1,260 characters (planner) against
    IAM's 2,048 default.
  - >-
    Security of the new entry: only a repository whose id is 1252427466 can present it, and repository ids
    are unique and immutable, so even a mistyped org id grants nothing to anyone; it only fails to match after
    the transfer (caught by the contract's transfer_window_checklist step 7 before unfreeze).
  - >-
    ADMIN container with the S3 provider mirror (Decision 120): the personal-root read-only plan (VP 13) and
    the split-apply (VP 15) need TF_CLI_CONFIG_FILE pointing at a synced mirror. Planning-time check
    (2026-10-15): the mirror syncs and terraform/personal initialises with -backend-config=backend-sandbox.hcl.
acceptance_criteria:
  - >-
    local.github_repos in terraform/personal/oidc.tf and terraform/bootstrap/github_ci_apply.tf are identical
    and equal [benjamin-blake@217728084/theseus@1252427466, otl-labs@<OTL_ORG_ID>/ontheloop@1252427466], where
    OTL_ORG_ID is the id the operator read from the GitHub API, quoted in the build thread; the id appears in
    no other repository file.
  - >-
    Live IAM: every trust statement of all five CI roles carries the current and the target segment with
    identical suffix sets, the current subjects unchanged; github_ci_apply keeps both Decision 94 forms for
    both segments. Verified by aws iam get-role, never by reading HCL.
  - >-
    Live liveness on the CURRENT path, per role, after that role's own trust change: github_ci_apply by the
    push run's gated-apply job (environment form) and a blank dispatch's apply-sandbox job (ref form), both after
    the bootstrap apply; github_ci_planner by a
    terraform-drift run (main statement) and the probe PR's speculative plan (PR statement); github_ci_pr by
    the probe PR's advisory-status job; github_ci_deploy by an operator-directed deploy-prod-lambdas dispatch;
    github_ci_branch by scheduled workflows. Each recorded as role name, timestamp and run id.
  - >-
    The convergence record is green, written by the merge's push run (run_id bound) and again by the VP 22
    dispatch, with no pending marker after the next drift tick; every tf_drift or stale-backlog rec filed
    during the window is closed.
  - >-
    validate_github_org_transfer is registered, runs in both tiers and is green; the contract's evaluator is
    that check; the contract and Decision 172 texts match the operator-approved drafts verbatim apart from the
    allowed date variance (step 29).
  - >-
    rec-3167 and rec-3128 close at merge (Resolves trailer); rec-3902 closes only after the live proof, by
    update_rec with the evidence path, after its stored acceptance oracle passes at MERGE_SHA (VP 28; Decision
    103 lifecycle; the rec-3161 manual-close precedent).
  - >-
    The freeze was declared by the operator, in the build thread, before the first live mutation (VP 15), and
    its preconditions were recorded (VP 14).
verification_plan:
  - step: 1
    phase: pre-deploy
    hermetic: true
    action: >-
      Both roots stage the target segment after the untouched current entry, with identical lists and one
      repository id.
    command: >-
      bin/venv-python -c "import re,pathlib;
      get=lambda p: re.findall(r'\"([^\"]+)\"', re.search(r'github_repos\s*=\s*\[([^\]]*)\]',
      pathlib.Path(p).read_text(),re.S).group(1));
      a=get('terraform/personal/oidc.tf'); b=get('terraform/bootstrap/github_ci_apply.tf');
      assert a==b, (a,b); assert len(a)==2 and a[0]=='benjamin-blake@217728084/theseus@1252427466', a;
      m=re.fullmatch(r'otl-labs@([0-9]+)/ontheloop@1252427466', a[1]); assert m and m.group(1)!='217728084', a[1];
      print('target-segment-staged-ok')"
    expected: The marker prints and the command exits 0.
    fix_if: >-
      A missing current entry is the catastrophic case (the only subject CI can mint before the transfer):
      restore it first. A list mismatch means one root was missed; a different repository id means a typo in
      the durable half.
    graduation: waive
    graduation_waiver_reason: >-
      An exact two-element shape check of this plan's end state. The predecessor_removal phase will legally
      shrink the list to the target alone, so a standing copy would go red on a correct change; the graduated
      guards are the format-based TestTargetOwnerSegment node (step 2) and validate_github_org_transfer, which
      is phase-aware.
  - step: 2
    phase: pre-deploy
    hermetic: true
    action: Run the new target-segment guard as its own graduated step (red before, green after).
    command: >-
      bin/venv-python -m pytest
      tests/checks/iam_tf/test_oidc_trust_slug_invariants.py::TestTargetOwnerSegment::test_both_roots_stage_the_target_segment
      -q
    expected: >-
      Passes on the post-change tree. On the pre-change tree the node does not exist (pytest exit 4), and once
      authored it fails until both lists carry the entry.
    fix_if: >-
      Exit 4 after authoring means the class or method name differs from the selector; fix the name, not the
      selector. A pass on the pre-change lists means the test guards nothing.
    graduation: graduate
    graduation_check_id: "oidc-trust-target-owner-segment-staged"
  - step: 3
    phase: pre-deploy
    hermetic: true
    action: Run the evaluator's test class as its own graduated step (red before, green after).
    command: >-
      bin/venv-python -m pytest
      tests/checks/contracts/test_validate_github_org_transfer.py::TestValidateGithubOrgTransfer -q
    expected: Every test in the class passes. On the pre-change tree the file does not exist (pytest exit 4).
    fix_if: >-
      A failing phase-rule case means the current-or-next lookup is wrong: the lists must equal exactly one of
      the two trusted sets, never a superset or a subset. Do not loosen a fixture to get green (Decision 181).
    graduation: graduate
    graduation_check_id: "github-org-transfer-evaluator-tests"
  - step: 4
    phase: pre-deploy
    hermetic: true
    action: The registered evaluator is green on the real tree and resolves as the contract's evaluator.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_github_org_transfer import
      validate_github_org_transfer as v; f=[]; v(f); assert not f, f;
      import yaml; c=yaml.safe_load(open('docs/contracts/github-org-transfer.yaml'));
      assert c['contract']['evaluator']=={'check':'validate_github_org_transfer'}, c['contract']['evaluator'];
      assert c['identity']['phase']=='pre_transfer' and c['identity']['staged_phase']=='pre_staged', c['identity'];
      print('org-transfer-evaluator-green')"
    expected: The marker prints and the command exits 0.
    fix_if: >-
      A failure naming the phase rule on the real tree means the lists, staged_phase or the contract's
      trusted_segments disagree; fix the HCL or the check, never the contract's phases. Registration is proven
      by the step 3 class and the step 9 full tier.
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the registered check itself, which runs in both validate tiers once this plan lands, plus the
      real-tree test in the step 3 class.
  - step: 5
    phase: pre-deploy
    hermetic: true
    action: The contract carries the approved edits and still validates against the contract schema.
    command: >-
      bin/venv-python -c "import yaml; from scripts.contracts_schema import ContractMeta;
      c=yaml.safe_load(open('docs/contracts/github-org-transfer.yaml')); ContractMeta.model_validate(c['contract']);
      log=c['amendment_log']; assert len(log)>=2 and 'PLAN-oidc-owner-segment-prestage' in log[-1]['summary'], log[-1];
      assert log[-1]['change_class']=='field_add' and log[-1]['semantic_break'] is False;
      assert c['planned_evaluator'].startswith('validate_github_org_transfer (rec-3902) enforces invariant (1)');
      assert 'identity.staged_phase' in c['planned_evaluator'];
      assert 're-armed by the OIDC pre-stage plan' in c['tracking']['decision_172_review'];
      assert '(the benjamin-blake entry)' in c['identity']['current']['trust_segment_ref'];
      import subprocess; row=yaml.safe_load(open('config/agent/verification_registry/entries/github-org-transfer-contract.yaml'));
      subprocess.run(row['check_spec']['command'], check=True);
      o=[r for r in c['breakage_map'] if r['id']=='oidc_trust_segment'][0];
      assert 'admin' in o['fix'] and 'split-apply of github_ci_planner and github_ci_deploy' in o['fix'];
      print('contract-amendment-applied')"
    expected: The marker prints and the command exits 0.
    fix_if: >-
      Any mismatch: re-copy the approved text from the plan context's draft path verbatim. Do not reword; a
      wording change goes back to the operator.
    graduation: waive
    graduation_waiver_reason: >-
      A one-shot check that approved prose landed. The contract keeps changing at every later phase flip, so a
      standing string pin would go red on correct amendments; the structural invariant is graduated as the
      evaluator itself (step 3).
  - step: 6
    phase: pre-deploy
    hermetic: true
    action: Decision 172's stanza parses as re-armed and the decisions index stays fresh.
    command: >-
      bin/venv-python -c "import datetime as dt, pathlib, re, yaml;
      t=pathlib.Path('docs/DECISIONS.md').read_text(); e=t[t.index('## Decision 172:'):]; e=e[:e.index('\n---\n')];
      s=yaml.safe_load(re.search(r'\x60\x60\x60yaml reversal-conditions\n(.*?)\x60\x60\x60', e, re.S).group(1));
      assert s['decision']==172 and str(s['review_by'])=='2027-04-30', s;
      assert [c['id'] for c in s['conditions']]==['old-owner-segment-removed-with-proof','future-rename-not-prestaged'], s;
      assert all(c['kind']=='manual' for c in s['conditions']);
      assert 'Reversal stanza re-armed by PLAN-oidc-owner-segment-prestage' in ' '.join(e.replace('\n> ',' ').split());
      print('decision-172-rearmed')" &&
      bin/venv-python -m scripts.decisions_index --check
    expected: The marker prints and the index freshness check exits 0.
    fix_if: >-
      A parse failure means the stanza fence or YAML broke: the stanza must stay non-empty and fenced exactly as
      before (Decision 177 clause 4 locks its existence). A stale index means the build edited text outside the
      stanza and the Update line; revert that, do not regenerate around it.
    graduation: waive
    graduation_waiver_reason: >-
      The stanza is a mutable watched surface (scripts/preflight/decision_conditions.py) that later plans re-arm
      again, so pinning this exact state would go red on the next legitimate re-arm.
  - step: 7
    phase: pre-deploy
    hermetic: true
    action: The CI apply role's trust-rewrite grant is unchanged (the split-apply replaces any widening).
    command: >-
      bin/venv-python -m pytest
      tests/checks/iam_tf/test_iam_role_reconcile_trust_scope.py::TestIAMRoleReconcileScope::test_resource_set_is_exactly_branch_and_pr
      -q
    expected: Passes before and after; this plan never edits terraform/bootstrap/github_ci_apply_policy.tf.
    fix_if: >-
      A failure means IAMRoleReconcile changed; revert it. Widening it is out of scope and forbidden here.
    graduation: waive
    graduation_waiver_reason: >-
      Already graduated as iam-role-reconcile-scope-branch-pr-only (PLAN-oidc-trust-contraction-closure); this
      step only re-runs it to prove the plan left it alone.
  - step: 8
    phase: pre-deploy
    hermetic: false
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Forward-fix on the branch (Decision 55); never skip, disable or quarantine a test.
    graduation: waive
    graduation_waiver_reason: >-
      Graduating the fast tier would register a check identical to the tier that runs it.
  - step: 9
    phase: pre-deploy
    hermetic: false
    action: >-
      Full tier on the COMMITTED clean tree after the rebase, then --verify-head (docs/contracts/git-ops.yaml
      handoff_sequence; Decision 163's 2026-09-26 Update; Decision 203's push gate refuses a push whose evidence
      does not attest HEAD). It runs for about ten minutes: run it in the background with a timeout of 30
      minutes or more; a timeout blocks, it never passes. Every fix or rebase commit needs a fresh run.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Exit 0 with an empty failed-checks list, then --verify-head attests HEAD's tree.
    fix_if: Forward-fix on the branch (Decision 55).
    graduation: waive
    graduation_waiver_reason: >-
      Structurally enforced by validate_handoff_full_tier; graduating it would duplicate the tier.
