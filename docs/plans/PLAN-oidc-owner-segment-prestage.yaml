work_areas: []
rollback: >-
  Every change is additive, so nothing here can lock CI out: the current segment is never touched. Mid-sequence
  failure: stop where it failed; the roles already updated carry both segments, the rest carry the current one,
  and CI keeps working on the current path; RCA, then resume from the failed step. If the merge cannot follow
  the pre-merge split-apply inside the window, restore planner and deploy with the same targeted apply from
  origin/main (VP 15 fix_if). Full rollback (only if the
  target entry itself is wrong and must go): a revert PR, then the forward order mirrored -- split-apply planner
  and deploy from the revert PR's final head, re-run its speculative plan, merge, bootstrap apply while the gate
  waits, approve the gated job (no waiting run is ever cancelled or rejected). The same revert PR removes the
  target entry from both lists, identity.staged_phase (so
  validate_github_org_transfer then expects [current] alone), TestTargetOwnerSegment, and retires the
  oidc-trust-target-owner-segment-staged registry row by git mv into entries/deprecated/ (Decision 176 point 5),
  or the revert itself goes red. A wrong org id is corrected
  the same way with the right id, not reverted.
