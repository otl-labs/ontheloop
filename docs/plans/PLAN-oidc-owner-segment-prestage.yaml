constraints:
  - >-
    CARRIER: shell state does not persist between tool calls (AGENTS.md), so every value a later step reads
    (OTL_ORG_ID, PR_NUMBER, PR_HEAD_SHA, PRE_WINDOW_RECS, MERGE_SHA, PUSH_RUN_ID, BOOTSTRAP_APPLY_TS, SPLIT_APPLY_TS, DISPATCH_RUN_ID,
    GATED_APPLY_TS, DEPLOY_SHA, TF_CLI_CONFIG_FILE) lives in the session-local file
    "$HOME/.oidc-prestage/state.env" (mode 600, outside the repository and the shared folder, deleted at VP
    28); each step's command sources it first, and each producing step appends KEY=value. The org id may sit in
    that file and in this session's own command text and transcript, which already carry the operator's message;
    post-merge steps read the target segment from the merged list instead.
  - >-
    Every live mutation is its own step on the operator's typed word, in the build thread, on the exact command
    shown: the split-apply, the merge, the bootstrap apply, the gated approval, the blank dispatch, the deploy
    dispatch
    (project instructions; Decision 126). Present the command and expected result first; verify from the live
    system after. Never batch two mutations under one word. Read-only admin calls are standing.
  - >-
    The org numeric id is written ONLY into the two local.github_repos lists (operator ruling, contract
    identity.target.owner_numeric_id). Never in a test, the plan, a PR body, a commit message, the evidence
    file, memory or a reply. Evidence is counts-only: role names, timestamps, run ids, shas; no ARN, account id
    or raw get-role output (Decision 101).
