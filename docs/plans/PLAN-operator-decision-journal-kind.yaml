- source: docs/plans/reports/REPORT-w3-feedback-loop-staging.md
  behavior: Section 9 equals the sidecar's approved text and carries the two new keys, the six entry ids and the register shape.
  verification_step: 3
  command: bin/venv-python -m scripts.roadmap.approved_text verify --slug operator-decision-journal-kind --expect 1449253bc8b728ac0b4560265bbf6f7b3dad16abca5990deb6eb667ee1a20300
    && bin/venv-python -c "import re,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w3-feedback-loop-staging.md',encoding='utf-8').read();
    i=T.index(chr(10)+'## 9. Reservation ('); tail=T[i+1:]; sep=T[i-1]==chr(10) and T[i-2]!=chr(10); keys=[k for b in re.findall(F+'yaml'+chr(10)+'(.*?)'+F,T,re.S)
    for k in yaml.safe_load(b)]; Y={k:v for b in re.findall(F+'yaml'+chr(10)+'(.*?)'+F,tail,re.S) for k,v in yaml.safe_load(b).items()};
    ids=[e['id'] for e in Y['staged_row_amendments']]; reg=[sorted(r) for r in Y['register_rows_staged']]; need=['fork_id','answer_event','source','kind','class','option
    recommended','option chosen','rationale','decided_by','decided_at','tenant_id','project_id','one row per answer to a fork','never
    a classifier over transcripts','path plus commit SHA','the fork sentence','answer confirms or corrects it']; r1=' '.join([e for
    e in Y['staged_row_amendments'] if e['id']=='CD.47-r1'][0]['text'].split()); miss=[n for n in need if n not in r1]; print('sep=%s
    keys=%d new=%s ids=%s reg_rows=%d reg_shape=%s miss=%s ascii=%s' % (sep,len(keys),keys[8:],ids,len(reg),all(r==sorted(['detector','metric','decides','cheap_path','declared_guard','counter','counter_floor','drill','upstream'])
    for r in reg),miss,all(ord(c)<128 for c in tail)))"
  waiver_reason: Report text with no executable behavior; VP 3 asserts it (VP 1 and VP 2 prove sections 0-8 and PLAN-w3's assertions
