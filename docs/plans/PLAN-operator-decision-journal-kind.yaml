schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: operator-decision-journal-kind
intent: 'Persist the operator''s 2026-10-24 direction that every answered operator fork becomes one typed row in the loop record
  journal, written by the surface that asks, so autonomy over decisions is earned from recorded evidence and a gate that stops discriminating
  is detectable (the north-star file''s autonomy and approval-authority entries). Direction only: reserves the operator_decision
  kind and its companion amendments against the staged CD.46, CD.47 and CD.51 rows; builds no table, writer, verb or check.'
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-operator-decision-journal-kind.yaml
phase: 'T4.36 (North stars as a Tier A file; created by PLAN-north-star-tier-a''s build); closes T4.36 c7. Staged rows touched by
  text only: CD.46, CD.47, CD.51 in docs/plans/reports/REPORT-w3-feedback-loop-staging.md (pending, operator-filed).'
closes_criteria:
- T4.36:c7
scope:
- file: docs/plans/reports/REPORT-w3-feedback-loop-staging.md
  action: Modify
  purpose: 'Append section 9, the approved text of docs/plans/approved/operator-decision-journal-kind.yaml (DATE set to the build
    day), after line 859, separated by one blank line. Lines 1-859 stay byte-identical: Decision 221 and merged plans cite this report
    by line number.'
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: Flip T4.36 c7 to status met with met_by operator-decision-journal-kind. No other byte of the file changes.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- REPORT-w3 lines 1-859 are byte-identical to origin/main and section 9 follows them after one blank line; the file equals its base
  with the block of docs/plans/approved/operator-decision-journal-kind.yaml applied (approved_text verify passes with the plan's
  digest; DATE is the only variance).
- Section 9 adds exactly two yaml top-level keys (staged_row_amendments, register_rows_staged); PLAN-w3's hermetic VP 3 and VP 9
  still print their pinned literals.
- 'staged_row_amendments carries CD.47-r1, CD.47-r2, CD.47-r3, CD.46-r1, CD.46-r2 and CD.51-r1; register_rows_staged carries two
  rows with the register row fields less pr (no design PR exists for a direction-only row); counter_floor stays a string seed that
  #1400 converts to a number at fold.'
- T4.36 c7 is met with met_by operator-decision-journal-kind, and the roadmap diff touches only that criterion.
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'Prove every cited line of REPORT-w3 keeps its number: the first 859 lines equal origin/main''s whole file.'
  command: git fetch --quiet origin main && diff <(git show origin/main:docs/plans/reports/REPORT-w3-feedback-loop-staging.md) <(head
    -n 859 docs/plans/reports/REPORT-w3-feedback-loop-staging.md) && test "$(git show origin/main:docs/plans/reports/REPORT-w3-feedback-loop-staging.md
    | wc -l)" -eq 859 && echo ANCHORS_OK
  expected: Prints ANCHORS_OK (no diff output, origin/main's file is 859 lines).
  fix_if: Any diff line means a line at or above 859 changed or the blank separator was lost; restore it and re-append. If origin/main
    moved since the last rebase, rebase first and re-run. If origin/main's file is no longer 859 lines, stop and tell the coordinator
    (another PR edited the report).
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: Re-run PLAN-w3's hermetic VP 3 and VP 9 commands from that plan file and check their pinned literals.
  command: bin/venv-python -c "import yaml,subprocess as S; p=yaml.safe_load(open('docs/plans/PLAN-w3-feedback-loop-staging.yaml',encoding='utf-8'));
    st={s['step']:s for s in p['verification_plan']}; out={i:S.run(['bash','-c',st[i]['command']],capture_output=True,text=True).stdout
    for i in (3,9)}; bad=[(i,l) for i in (3,9) for l in st[i]['expected_literals'] if l not in out[i]]; print(out[3].strip()); print(out[9].strip());
    print('drift=%s' % bad)"
  expected: 'Prints PLAN-w3 VP 3''s and VP 9''s pinned lines unchanged and an empty drift list. Red before is not applicable: the
    step guards that section 9 leaves PLAN-w3''s assertions true.'
  fix_if: 'A non-empty drift list means section 9 reused an existing yaml key, broke yaml parsing, or text was inserted inside sections
    0-8. A max_main or on_main change instead means the operator filed a candidate decision on main: stop and tell the coordinator
    (execution step 1), never edit PLAN-w3.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: PLAN-w3's VP 3 pins max_main=CD.45 and rows=6, which the operator's own CD filing legitimately changes;
    a standing registry row would go red on the edit it exists to allow.
  expected_literals:
  - rows=6 validated=6 pending=6 ids=['CD.46', 'CD.47', 'CD.48', 'CD.50', 'CD.51', 'CD.52'] on_main=0 max_main=CD.45 routing_ids_equal=True
  - texts=10 phrases=15 denylist_hits=[]
  - drift=[]
- step: 3
  phase: pre-deploy
  action: 'Check section 9 against the approved sidecar, read at the base, and its digest; then parse it: separator, key set, entry
    ids, the field terms of CD.47-r1, the register shape and ASCII.'
  command: bin/venv-python -m scripts.roadmap.approved_text verify --slug operator-decision-journal-kind --expect 1449253bc8b728ac0b4560265bbf6f7b3dad16abca5990deb6eb667ee1a20300
    && bin/venv-python -c "import re,yaml; F=chr(96)*3; T=open('docs/plans/reports/REPORT-w3-feedback-loop-staging.md',encoding='utf-8').read();
    i=T.index(chr(10)+'## 9. Reservation ('); tail=T[i+1:]; sep=T[i-1]==chr(10) and T[i-2]!=chr(10); keys=[k for b in re.findall(F+'yaml'+chr(10)+'(.*?)'+F,T,re.S)
    for k in yaml.safe_load(b)]; Y={k:v for b in re.findall(F+'yaml'+chr(10)+'(.*?)'+F,tail,re.S) for k,v in yaml.safe_load(b).items()};
    ids=[e['id'] for e in Y['staged_row_amendments']]; reg=[sorted(r) for r in Y['register_rows_staged']]; need=['fork_id','answer_event','source','kind','class','option
    recommended','option chosen','rationale','decided_by','decided_at','tenant_id','project_id','one row per answer to a fork','never
    a classifier over transcripts','path plus commit SHA','the fork sentence','answer confirms or corrects it']; r1=' '.join([e for
    e in Y['staged_row_amendments'] if e['id']=='CD.47-r1'][0]['text'].split()); miss=[n for n in need if n not in r1]; print('sep=%s
    keys=%d new=%s ids=%s reg_rows=%d reg_shape=%s miss=%s ascii=%s' % (sep,len(keys),keys[8:],ids,len(reg),all(r==sorted(['detector','metric','decides','cheap_path','declared_guard','counter','counter_floor','drill','upstream'])
    for r in reg),miss,all(ord(c)<128 for c in tail)))"
  expected: 'APPROVED-TEXT OK with the plan''s digest, then one line reporting sep=True (exactly one blank line after line 859),
    ten yaml keys of which the two new are staged_row_amendments and register_rows_staged, the six entry ids in order, two register
    rows in full shape, an empty miss list and ascii=True. Red before: APPROVED-TEXT MISMATCH (section 9 absent from the head words),
    so the parse line never prints.'
  fix_if: 'A MISMATCH line means section 9 differs from the sidecar''s approved text: re-copy it from the sidecar''s block. APPROVED-TEXT
    SIDECAR means the build touched the sidecar: restore it. Never edit the sidecar, the digest or the assertion (any wording change
    needs Benjamin''s new approval). A `before` that no longer occurs once means main moved: stop and tell the coordinator.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The asserted text is pending candidate-decision text that the operator re-drafts at filing (section 3's
    re-draft rule), so a standing row would block the filing it serves; validate_merge_step's approved-text leg checks the binding
    on the build PR.
  expected_literals:
  - APPROVED-TEXT OK 1449253bc8b728ac0b4560265bbf6f7b3dad16abca5990deb6eb667ee1a20300
  - sep=True keys=10 new=['staged_row_amendments', 'register_rows_staged'] ids=['CD.47-r1', 'CD.47-r2', 'CD.47-r3', 'CD.46-r1', 'CD.46-r2',
    'CD.51-r1'] reg_rows=2 reg_shape=True miss=[] ascii=True
- step: 4
  phase: pre-deploy
  action: Assert T4.36 c7 is met by this plan.
  command: bin/venv-python -c "import yaml; R=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8')); t=[x for x in
    R['tier_items'] if x['id']=='T4.36'][0]; c=[x for x in t['exit_criteria'] if isinstance(x,dict) and x['id']=='c7'][0]; print('c7
    status=%s met_by=%s' % (c.get('status'),c.get('met_by')))"
  expected: 'Prints the c7 line with status met and met_by operator-decision-journal-kind. Red before: status open (or IndexError
    while T4.36 is absent).'
  fix_if: IndexError means PLAN-north-star-tier-a's build has not merged; stop (constraint 2). Otherwise edit only c7's status and
    met_by.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A one-time status flip; validate_platform_roadmap guards met_by resolution standing (criterion (i)),
    and c7 staying met is roadmap data the exit-criteria ledger owns.
  expected_literals:
  - c7 status=met met_by=operator-decision-journal-kind
- step: 5
  phase: pre-deploy
  action: Prove the roadmap diff touches only T4.36 c7's status and met_by.
  command: git fetch --quiet origin main && bin/venv-python -c "import yaml,subprocess as S; a=yaml.safe_load(S.run(['git','show','origin/main:docs/ROADMAP-PLATFORM.yaml'],capture_output=True,text=True,check=True).stdout);
    b=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8')); f=lambda d:[c for t in d['tier_items'] if t['id']=='T4.36'
    for c in t['exit_criteria'] if isinstance(c,dict) and c['id']=='c7'][0]; ca,cb=f(a),f(b); flip=(cb.get('status'),cb.get('met_by'))==('met','operator-decision-journal-kind');
    cb.clear(); cb.update(ca); print('roadmap flip=%s rest_equal=%s' % (flip,a==b))" && git diff --numstat origin/main -- docs/ROADMAP-PLATFORM.yaml
    | awk '{print "numstat_ok=" ($1<=2 && $2<=1)}'
  expected: 'Prints roadmap flip=True rest_equal=True: c7 is flipped and, with c7 restored to origin/main''s values, the parsed roadmap
    equals origin/main''s; then numstat_ok=1 (at most two lines added and one removed, so no comment or restyle drift).'
  fix_if: If origin/main moved since the last rebase, rebase first and re-run; then rest_equal=False means a stray edit elsewhere
    in the roadmap (any item, criterion or T4.36's own status); revert it.
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: Validate the plan document, then run the fast tier.
  command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-operator-decision-journal-kind.yaml && bin/venv-python
    -m scripts.validate --pre
  expected: Both exit 0.
  fix_if: Fix the named finding; never skip or disable a check.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: After the commit and the rebase onto origin/main, run the full tier to completion on the clean committed tree, then attest
    HEAD, before push (git-ops.yaml handoff_sequence).
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: 'Both exit 0: the full tier passes and --verify-head attests the HEAD tree that ships.'
  fix_if: Fix the named finding; a timeout leaves the handoff blocked and the full tier reruns from the start.
  hermetic: false
  graduation: not-applicable
