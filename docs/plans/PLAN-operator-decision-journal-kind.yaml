- source: docs/ROADMAP-PLATFORM.yaml
  behavior: T4.36 c7 flips to met by this plan (VP 5 proves nothing else changes).
  verification_step: 4
  command: bin/venv-python -c "import yaml; R=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml',encoding='utf-8')); t=[x for x in
    R['tier_items'] if x['id']=='T4.36'][0]; c=[x for x in t['exit_criteria'] if isinstance(x,dict) and x['id']=='c7'][0]; print('c7
    status=%s met_by=%s' % (c.get('status'),c.get('met_by')))"
  waiver_reason: Roadmap data flip already guarded standing by validate_platform_roadmap and the exit-criteria ledger.
constraints:
- 'PLAN-w3''s VP parser merges all REPORT-w3 yaml blocks by top-level key: section 9 never reuses inputs, staged_criteria, staged_candidate_decisions,
  cd_routing, parked_questions, answered_questions, consult_rows or consult_departures.'
- 'Data model is direction only (data-modeling-standard.yaml design_time_walk at direction level: grain one row per answer, append_only,
  boundary-derived identity, event-day partition, join keys fork_id, plan path+SHA, consult point, forge approval ref, tenant/project
  ids); schemas are the build''s at CD.47 ratification.'
- 'Lines 1-859 of REPORT-w3 are never edited: Decision 221 (DECISIONS.md, cites :274-470, :290, :359, :380-382, :423, :611, :619,
  :627) and merged plans cite them, and Decision 221''s text is append-only (Decision 177).'
- 'Order: the build PR merges only after PLAN-north-star-tier-a''s build has merged (T4.36 must exist on main). This plan PR shows
  validate_platform_roadmap red (''unknown tier_item T4.36'') until then and merges only after it, as PLAN-decision-serves-kind-grammar''s
  PR does. The build also merges after PLAN-decision-serves-kind-grammar''s build, because section 9 points at docs/contracts/decision-kind.yaml,
  which that build creates.'
- 'Section 9 presumes CD.46, CD.47 and CD.51 are still unfiled (pending in REPORT-w3 only). If the operator has filed any candidate
  decision past CD.45, stop: section 9''s re-draft premise needs his word first.'
- Section 9 is v3, bound by docs/plans/approved/operator-decision-journal-kind.yaml (git-ops.yaml approved_text_binding; digest in
  VP 3), which lands with this plan PR and which the build never edits. v2 is Benjamin-approved verbatim (frozen at /mnt/project-files/operator-decision-journal-kind/approved/v2/
  with SHA256SUMS); the v3 redline (section-9-v3-redline.diff) and the sidecar digest await his approval, and this plan PR merges
  only once the approvals line records it (date and digest; the approving message id stays outside the repository, per approved_text_binding).
  DATE is the only allowed variance. Any other word needs his new approval in the thread that acts (project rule).
- No contract edit (overseer-dispatch.yaml untouched), no rec write, no numbered Decision, and no table, verb, writer or check is
  built (Decision 67 IMPLEMENTATION; direction only).
- No rescue agents or workaround loops (Decision 55).
