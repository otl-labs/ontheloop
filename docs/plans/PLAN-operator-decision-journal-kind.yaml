pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
- T4.36 present on main (PLAN-north-star-tier-a build merged)
execution_steps:
- 'Preconditions on origin/main; if any fails, stop and tell the coordinator: (a) T4.36 exists and its c7 is open and its text names
  REPORT-w3 section 9 and CD.47; (b) REPORT-w3 is still 859 lines and its line 859 is the `before` of docs/plans/approved/operator-decision-journal-kind.yaml''s
  one block; (c) candidate_decisions'' highest id is CD.45 and none of CD.46-CD.52 is present; (d) docs/contracts/decision-kind.yaml
  exists (PLAN-decision-serves-kind-grammar''s build merged); (e) the sidecar is on origin/main and this plan''s approvals line records
  Benjamin''s section 9 v3 approval with no PENDING.'
- 'Apply the one block of docs/plans/approved/operator-decision-journal-kind.yaml to docs/plans/reports/REPORT-w3-feedback-loop-staging.md:
  its `after` is line 859, one blank line, then section 9, so append one blank line after line 859 and then section 9 exactly as
  the block''s lines, with {{DATE}} replaced by the build day (YYYY-MM-DD) and nothing else changed. The file ends with one trailing
  newline. Never edit the sidecar (validate_merge_step fails a build PR that changes it).'
- 'In docs/ROADMAP-PLATFORM.yaml set T4.36 c7 to status: met and met_by: operator-decision-journal-kind, keeping c7''s text and style.'
- 'Execute VP 1-6: run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55). Then commit, fetch and
  rebase onto origin/main, and run VP 7 (full tier, then --verify-head) on the clean committed tree (git-ops.yaml handoff_sequence).'
- 'Push as its own tool call, open the build PR (no Resolves: trailer; this build resolves no rec) and drive CI green by event-driven
  wake, never polled. Independent code review, then merge on code review PROCEED plus green CI under the project''s standing rule.'
- 'Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state (bin/venv-python -m scripts.session.github_readiness;
