    and DECISIONS_ARCHIVE.md) + 1 after rebasing and {{DATE}} with the build date; regenerate docs/decisions-index.json;
    step 8 with the approved digest.
  - >-
    CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true; commit with
    Resolves: rec-5179; rebase on origin/main; steps 1-9; code review in a fresh context.
  - >-
    Closure evidence, recorded as four SEPARATE facts: GitHub readiness state; parent validator evidence (step 10 full
    tier plus validation_result --verify-head for the pushed HEAD; backgrounded from the top-level session, a timeout
    is BLOCKED, no push); structured postflight evidence (scripts.session.postflight --evidence); the real outcome --
    push, PR, CI green by event-driven wake (never polled), squash-merge on code review PROCEED and green CI under the
    sidecar's standing authorisation with Resolves: rec-5179 in the squash body, reporting PR number, run ids and SHA.
