rollback: >-
  Revert the PR; the governed deploy ships the previous code and merge_ops stops rewriting. Compaction is
  content-preserving, so nothing needs restoring; superseded files stay time-travel reachable for the current-table
  retention window (7 days) until gc_ops. To stop the rewrite without a revert, flip the scd2 cell to apply=false.
