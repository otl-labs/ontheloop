      assert all(any(n.startswith(w) and c=='success' for n,c in jobs.items()) for w in want),jobs;print('DEPLOY_OK')"
    expected: Every named deploy and smoke job concluded success (a skipped job fails this step), then DEPLOY_OK.
    fix_if: A red deploy job is root-caused and fixed forward, never re-run to green (Decision 55).
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: >-
      First production pass, operator-invoked from CloudShell after step 11 (command in context), then the pass's
      CURRENT_COMPACTION line saved to $COMPACTION_LINE_FILE. The smoke_harness canary compacts first; its result is
      reported, and a canary with no delete files is reported as vacuous, never as a pass.
    command: >-
      aws logs filter-log-events --profile agent_platform --region eu-west-2 --log-group-name
      /aws/lambda/agent-platform-ducklake-maintenance --start-time "$DEPLOY_EPOCH_MS" --filter-pattern
      '"CURRENT_COMPACTION"' --query 'events[].message' --output json > "$COMPACTION_LINE_FILE" && bin/venv-python -c
      "import json,os;ms=json.load(open(os.environ['COMPACTION_LINE_FILE']));
      ps=[json.loads(m[m.index('{'):]) for m in ms];assert ps,'no CURRENT_COMPACTION line yet';
      [print(d['elapsed_ms'],'ms of 900000;',[(r['table'],r['files_processed'],r['proof'],r['duration_ms']) for r in d['per_table']],d['deferred']) for d in ps];
      assert all(not d['failures'] and not d['refused'] for d in ps),[(d['failures'],d['refused']) for d in ps];
      assert all(any(r['table']==x and r['files_processed']>0 and r['proof']=='equal' for d in ps for r in d['per_table']) for x in ['ops_recommendations_current','ops_decisions_current']);
      print('COMPACTION_LIVE_OK')"
    expected: >-
      Every pass since the deploy free of failures and refusals, each target table rewritten and proved equal in some
      pass, each pass's elapsed time printed against the 900 s timeout, then COMPACTION_LIVE_OK.
    fix_if: >-
      A deferred table means the first pass hit the time budget: let the next scheduled pass finish it and re-read. A
      pass with no CURRENT_COMPACTION line but a Task timed out REPORT line in the log group means the pass outran 900
      s: read the last per-table durations, file a rec, and let the idempotent re-proof finish it. A proof failure has
      already paged (MaintenanceBreakerTrip): STOP and file a Critical rec naming both snapshot ids;
      restoration is a rebuild of current from history (Decision 81 cl.8; rec-5202), separately planned.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: The ops catalog's after-merge file count fell.
    command: >-
      aws cloudwatch get-metric-statistics --profile agent_platform --region eu-west-2 --namespace DuckLakeMaintenance
      --metric-name MergeOpsFilesAfterTotal --start-time "$DEPLOY_ISO" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --period 300 --statistics Minimum --query 'min(Datapoints[].Minimum)' --output text | bin/venv-python -c
      "import sys;r=sys.stdin.read().strip();assert r not in ('','None'),'no datapoint: no pass ran yet';v=float(r);print(v);
      assert v<400,v;print('FILES_FELL_OK')"
    expected: A value below 400 (946 before the deploy), then FILES_FELL_OK.
    fix_if: No datapoint means no pass ran yet; a value near 946 means the rewrite did not reach the current tables.
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: >-
      First read after compaction on a fresh connection: after at least 10 quiet minutes, call count_by_status once
      through the ducklake-reads tool, then save that call's ducklake_invocation line from
      /aws/lambda/agent-platform-ducklake-reader to $READ_LINE_FILE.
    command: >-
      bin/venv-python -c "import json,os;t=open(os.environ['READ_LINE_FILE']).read();d=json.loads(t[t.index('{'):]);
      s=d['elapsed_ms']-(d.get('connect_ms') or 0);print(d.get('action'),d.get('status'),d.get('connect_reused'),s);
      assert d.get('connect_reused') is False,'reused connection: not the fresh path';
      assert str(d.get('status')) in ('200','ok') and s<5000,d;print('FIRST_READ_FAST')"
    expected: A fresh connection, status 200 and under 5,000 ms outside connect (96,363 ms on 2026-11-14), then FIRST_READ_FAST.
    fix_if: >-
      A reused connection: wait longer and repeat. Over 5 s on compacted tables points at another cost (threads,
      rec-5182; the batch predicate, rec-5181): record the number in the PR body, never loosen the bound.
    hermetic: false
    graduation: not-applicable
  - step: 15
    phase: post-deploy
    action: >-
      Pre-registered latency outcome (NS.6; Decision 214 cl.4's per-invocation wall signal), run at least 24 h after
      the first pass (schedule a wake; never poll). This identity cannot run Logs Insights (StartQuery denied,
      2026-11-15), so for the 24 h before the deploy and the 24 h after the first pass, save each window's
      aws logs filter-log-events --log-group-name /aws/lambda/agent-platform-ducklake-reader --filter-pattern
      '{ $.event = "ducklake_invocation" }' --query 'events[].message' output to $BEFORE_JSON and $AFTER_JSON.
    command: >-
      bin/venv-python -c "import json,os;
      f=lambda p:sorted(json.loads(m[m.index('{'):])['elapsed_ms'] for m in json.load(open(os.environ[p])));
      b,a=f('BEFORE_JSON'),f('AFTER_JSON');q=lambda x:x[int(0.95*(len(x)-1))];
      r={'before':{'n':len(b),'slow':sum(e>29000 for e in b),'p95':q(b)},'after':{'n':len(a),'slow':sum(e>29000 for e in a),'p95':q(a)}};
      print(r);assert r['after']['slow']<=2 and r['after']['p95']<r['before']['p95'],r;print('LATENCY_OUTCOME_OK')"
    expected: >-
      At most 2 calls over 29 s in the 24 h after (about 51 a day before: 359 in 7 days) and a lower p95, then
      LATENCY_OUTCOME_OK; both windows' figures go in the PR body and on rec-5200.
    fix_if: >-
      More slow calls on compacted tables means another cost dominates (rec-5181 batch predicate, rec-5182 threads,
      rec-5180 deadline): file a new rec citing rec-5179 (closed at merge) with both windows' figures, never loosen the
      bound.
    hermetic: false
    graduation: not-applicable
  - step: 16
    phase: post-deploy
    action: The next control_health run after the first pass holds the ceiling.
    command: >-
      aws cloudwatch get-metric-statistics --profile agent_platform --region eu-west-2 --namespace DuckLakeMaintenance
      --metric-name ControlTableInvariantViolation --start-time "$PASS_ISO" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --period 300 --statistics Maximum --query 'max(Datapoints[].Maximum)' --output text | bin/venv-python -c
      "import sys;r=sys.stdin.read().strip();assert r not in ('','None'),'no control_health run yet';
      assert float(r)==0,r;print('CEILING_HOLDS')"
    expected: 0, then CEILING_HOLDS.
    fix_if: A violation names its table in the control_health 500 log body; read it before changing anything.
    hermetic: false
    graduation: not-applicable
  - step: 17
    phase: post-deploy
    action: rec-5179 closed by the squash commit's Resolves trailer; read it back with recs_by_ids into $REC_STATUS.
    command: test "$REC_STATUS" = closed && echo REC_CLOSED
    expected: REC_CLOSED.
    fix_if: Read ci.yml's closure job log for the merge commit.
    hermetic: false
    graduation: not-applicable
