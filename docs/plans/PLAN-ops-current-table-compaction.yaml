schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ops-current-table-compaction
intent: >-
  Bound the live files of the ops current tables so a first full read on a fresh reader connection opens about 16
  objects instead of 1,143 (rec-5179; audit ducklake-api-latency-442ff085 LAT-01): a new per-table maintenance verb,
  rewrite_current_deletes, runs inside the 6-hourly merge_ops pass and rewrites each current table's delete-bearing
  files at an explicit delete threshold, proved row- and digest-preserving, before the merge consolidates them;
  control_health asserts a live-file ceiling per current table every 6 h. Removes the dominant agent-path latency
  (84-106 s first reads at a 120 s limit, 12 timeouts a week) on the warehouse every flow reads.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ops-current-table-compaction.yaml
phase: >-
  T2.18 (DuckLake maintenance pipeline; in_progress). Rec-driven (rec-5179): the item's intent names "(+ optional
  rewrite for compaction)" and no cadence runs one. Closes no T2.18 criterion; c2 and c8 stay open and untouched.
scope:
  - file: src/common/ducklake_current_compaction.py
    action: Create
    purpose: >-
      compact_current_tables(con, discovered, *, semantics, registry, policy, catalog, emit): resolves verb
      rewrite_current_deletes via scope.resolve_scope (scope errors wrapped in a DuckLakeRuntimeError subclass,
      partition_actions precedent); refuses a non-current registry side even when its cell applies, and a table with
      legacy-scheme files (read_partition_layout); per table one transaction tagged by a unique commit-message token
      runs maint.rewrite at CURRENT_REWRITE_DELETE_THRESHOLD (0.0) under the writer's bounded OCC policy; no proof when
      files_processed is 0 (no snapshot is committed); post-commit row count + full-row digest AT the commit's
      immediate predecessor snapshot vs AT commit (ducklake_partition_rewrite._row_proof). Never AT the in-transaction
      pre snapshot: a non-conflicting insert can commit between them. Transient failures isolate per table; a proof mismatch raises
      CurrentCompactionProofError (a DuckLakeMaintenanceError) at once. Emits CurrentCompactionFilesRewritten,
      CurrentCompactionFailures and CurrentCompactionDurationMs and prints one value-free CURRENT_COMPACTION line.
    new_imports:
      - src.common.ducklake_maintenance
      - src.common.ducklake_maintenance_scope
      - src.common.ducklake_partition_layout
      - src.common.ducklake_partition_rewrite
      - src.common.ducklake_writes
  - file: src/common/ducklake_maintenance.py
    action: Modify
    purpose: >-
      rewrite() takes a required keyword delete_threshold (the engine's 0.95 default is never reachable) and returns
      the summed files_processed; its docstring names why the default never compacts a Type-1 projection.
  - file: src/common/ducklake_maintenance_scope.py
    action: Modify
    purpose: VERB_UNIVERSE gains rewrite_current_deletes (per-table; the catalog-wide rule unchanged).
    new_imports: []
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      maintenance_policy cells for rewrite_current_deletes: scd2 true (the verb itself refuses a non-current side),
      smoke_harness true, append_only false (no current projection, no delete files), control false
      (ops_entity_counters: allocation-serialization contention, Decision 84 I-2; measured by the follow-on rec).
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: Regenerated by bin/venv-python -m scripts.schema_to_field_semantics; never hand-edited.
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      action_merge_ops: one call to compact_current_tables after scope resolution and before the merge loop; the 200
      body gains `compaction`; compaction failures join MergeOpsPassFailed and the post-loop aggregate raise. A proof
      error propagates (breaker 500). Thin call site only (484 of 500 SLOC on main today).
    new_imports:
      - src.common.ducklake_current_compaction
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: Ship src/common/ducklake_current_compaction.py in the maintenance bundle only.
  - file: src/common/ducklake_control_health.py
    action: Modify
    purpose: >-
      CURRENT_LIVE_FILE_CEILING (100): every registry current-side table present in the catalog reports live and
      delete-bearing file counts; a live count above the ceiling is an invariant violation (existing
      ControlTableInvariantViolation alarm); OpsCurrentLiveFilesMax emitted every run.
    new_imports:
      - src.common.ducklake_maintenance_scope
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      merge_ops entry: the rewrite_current_deletes step, threshold, proof, failure split, breaker mapping, the
      `compaction` body key and metrics; control_health: the current-table ceiling. Relief first (NEAR_CAP).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Bound verbatim by docs/plans/approved/ops-current-table-compaction.yaml: one new numbered Decision (amends 188,
      191, 192; number and date filled at implementation, max-plus-one after rebasing) with a reversal-conditions
      stanza; a dated note on Decision 204 (re-lay is a partition-layout rewrite; current tables can always be rebuilt
      from the immutable, append-only history tables, procedure rec-5202) and on Decision 192 (the VERB_UNIVERSE
      literal); pointer lines after the Related paragraphs of 191 and 188.
  - file: tests/common/test_ducklake_current_compaction.py
    action: Create
    purpose: Unit tests with connection doubles (mirror file; full branch coverage of the new module).
  - file: tests/common/test_ducklake_current_compaction_engine.py
    action: Create
    purpose: >-
      Integration-marked real-engine conformance on the pinned engine (precedent
      tests/common/test_ducklake_gc_engine_conformance.py): a bucket(8, rec_id) MERGE-maintained table with merged,
      delete-bearing files; the default threshold rewrites nothing and a compaction is invisible inside its own
      transaction (Decision 99 pins); compaction then merge leaves at most 8 files and no delete file with rows and
      digest equal; both update-race directions conflict and the writer's error classifies as an OCC collision; a
      concurrent new-key insert commits without conflict and the predecessor proof still holds. Its node
      test_compaction_bounds_live_files_and_preserves_rows is rec-5179's acceptance.
  - file: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_compaction.py
    action: Create
    purpose: Wiring -- compaction before merge; a transient failure still merges every table and fails the pass; a proof failure merges nothing and maps to the breaker 500.
  - file: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py
    action: Modify
    purpose: Test semantics builders declare the new verb's cells apply=false; real-registry tests patch compact_current_tables.
  - file: tests/lambdas/ducklake_maintenance/handler/test_operational_actions.py
    action: Modify
    purpose: Same fixture change for its two semantics builders.
  - file: tests/common/test_ducklake_maintenance_scope.py
    action: Modify
    purpose: VERB_UNIVERSE pin and the declared cells per class.
  - file: tests/common/test_ducklake_gc_ops.py
    action: Modify
    purpose: Its VERB_UNIVERSE pin gains the verb; gc_ops still absent.
  - file: tests/checks/contracts/test_validate_maintenance_policy_matrix.py
    action: Modify
    purpose: Its verb tuple gains the verb; a missing rewrite_current_deletes cell fails the matrix check.
  - file: tests/test_ducklake_control_health.py
    action: Modify
    purpose: Current-table ceiling violation and per-table reporting.
  - file: tests/test_ducklake_maintenance.py
    action: Modify
    purpose: rewrite() requires delete_threshold and renders it.
bundled_recommendations:
  - rec-5179
followon_recs:
  - rec-5200
  - rec-5201
  - rec-5202
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    On the pinned engine, a production-shaped current table's compaction then merge leaves at most one live data file
    per bucket and no delete file, with row count and full-row digest equal at the pre and commit snapshots; the
    engine's default threshold rewrites nothing.
  - >-
    rewrite_current_deletes is a declared per-table verb with a cell for every class; the pass rewrites only
    current-side tables whose cell applies, never at an implicit threshold, refuses legacy-scheme files, and is a
    no-op on the telemetry catalog.
  - >-
    A transient compaction failure isolates to its table, every table still merges and the pass ends non-successfully;
    a proof mismatch aborts the pass before any merge as a breaker trip.
  - control_health fails a current table whose live file count exceeds CURRENT_LIVE_FILE_CEILING and reports every one.
  - The new Decision, the two dated notes and the two pointers match the approved-text sidecar.
  - >-
    After the deploy, the first production pass logs CURRENT_COMPACTION with files rewritten and proof equal for
    ops_recommendations_current and ops_decisions_current, MergeOpsFilesAfterTotal falls below 400 (946 at
    2026-11-15T06:30Z), a first count_by_status spends under 5,000 ms outside connect, and the next control_health is
    clean.
  - rec-5179 is closed with its acceptance test green.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Compaction unit behaviour (connection doubles).
    command: >-
      bin/venv-python -m pytest -q
      tests/common/test_ducklake_current_compaction.py::test_rewrite_runs_at_explicit_threshold
      tests/common/test_ducklake_current_compaction.py::test_history_side_refused_even_when_cell_applies
      tests/common/test_ducklake_current_compaction.py::test_legacy_scheme_files_refused
      tests/common/test_ducklake_current_compaction.py::test_noop_rewrite_skips_proof
      tests/common/test_ducklake_current_compaction.py::test_occ_exhaustion_isolates_table
      tests/common/test_ducklake_current_compaction.py::test_proof_mismatch_raises_breaker_error
      tests/common/test_ducklake_current_compaction.py::test_proof_reads_the_commit_predecessor_snapshot
      tests/common/test_ducklake_current_compaction.py::test_append_only_catalog_rewrites_nothing
    expected: Eight passed.
    fix_if: A failure names the branch; fix the module, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: ops-current-compaction-unit
  - step: 2
    phase: pre-deploy
    action: merge_ops wiring and failure split.
    command: >-
      bin/venv-python -m pytest -q
      tests/lambdas/ducklake_maintenance/handler/test_merge_ops_compaction.py::test_compaction_runs_before_merge
      tests/lambdas/ducklake_maintenance/handler/test_merge_ops_compaction.py::test_transient_failure_still_merges_every_table
      tests/lambdas/ducklake_maintenance/handler/test_merge_ops_compaction.py::test_proof_failure_merges_nothing_and_trips_breaker
    expected: Three passed.
    fix_if: Keep the handler call site thin; the split lives in the module.
    hermetic: true
    graduation: graduate
    graduation_check_id: ops-current-compaction-wiring
  - step: 3
    phase: pre-deploy
    action: The verb is declared per class and the matrix check holds it.
    command: >-
      bin/venv-python -m pytest -q
      tests/common/test_ducklake_maintenance_scope.py::test_rewrite_current_deletes_declared_for_every_class
      tests/checks/contracts/test_validate_maintenance_policy_matrix.py::test_missing_rewrite_current_deletes_cell_fails
    expected: Two passed.
    fix_if: Edit field_semantics.static.yaml and regenerate; never hand-edit field_semantics.yaml.
    hermetic: true
    graduation: graduate
    graduation_check_id: rewrite-current-deletes-declared
  - step: 4
    phase: pre-deploy
    action: control_health current-table ceiling.
    command: >-
      bin/venv-python -m pytest -q
      tests/test_ducklake_control_health.py::test_current_table_over_ceiling_is_a_violation
      tests/test_ducklake_control_health.py::test_current_tables_reported_per_table
    expected: Two passed.
    fix_if: Fix control_health; the ceiling is a guardrail, never tuned to pass (Decision 55).
    hermetic: true
    graduation: graduate
    graduation_check_id: ops-current-live-file-ceiling
  - step: 5
    phase: pre-deploy
    action: The library rewrite helper refuses an implicit threshold.
    command: >-
      bin/venv-python -m pytest -q tests/test_ducklake_maintenance.py::test_rewrite_requires_explicit_delete_threshold
    expected: One passed.
    fix_if: rewrite() is still reachable without delete_threshold.
    hermetic: true
    graduation: graduate
    graduation_check_id: ducklake-rewrite-explicit-threshold
  - step: 6
    phase: pre-deploy
    action: Real-engine conformance on the pinned engine (needs duckdb and a network INSTALL of the ducklake extension).
    command: >-
      bin/venv-python -m pytest -q -m integration tests/common/test_ducklake_current_compaction_engine.py -p no:randomly
      -rs
    expected: Every test passed and none skipped; a skip means the extension did not install and is never accepted.
    fix_if: >-
      More than 8 files after merge, a delete file left, or a digest difference is a design defect: stop and RCA before
      any deploy (Decision 55).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Needs duckdb (absent from requirements-fast.txt) and a network INSTALL of the ducklake extension; the full tier
      already runs it as an integration-marked test on every post-merge validation.
  - step: 7
    phase: pre-deploy
    action: The new module ships only in the maintenance bundle.
    command: >-
      grep -q 'src/common/ducklake_current_compaction.py' src/lambdas/ducklake_maintenance/manifest.yaml && ! grep -l
      'ducklake_current_compaction' src/lambdas/ducklake_reader/manifest.yaml src/lambdas/ducklake_writer/manifest.yaml
      src/lambdas/ducklake_maintenance_smoke/manifest.yaml && echo MANIFEST_SCOPE_OK
    expected: The marker printed.
    fix_if: Add it to the maintenance manifest and remove it from any other.
    hermetic: true
    expected_literals:
      - MANIFEST_SCOPE_OK
    graduation: graduate
    graduation_check_id: ops-current-compaction-bundle-scope
  - step: 8
    phase: pre-deploy
    action: The new Decision, notes and pointers are exactly the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug ops-current-table-compaction
    expected: The approved-text OK line naming the slug's blocks.
    fix_if: Place the sidecar's words verbatim; a wording change needs a new approval, never an edit to match.
    hermetic: true
    expected_literals:
      - APPROVED-TEXT OK
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Fast presubmit on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix each failure at root cause (Decision 55).
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: >-
      Full tier before handoff, started backgrounded with a 2 h limit from the top-level session (AGENTS.md two-tier
      model); its verdict is validation_result --verify-head, never a pipe's exit status.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Full tier exits 0 and --verify-head confirms a PASS recorded for the current HEAD.
    fix_if: Any failing check; fix on the branch and re-run from the start (handoff_policy timeout_disposition blocked).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Handoff gate for this build's head only; post-merge the full tier runs on main anyway.
  - step: 11
    phase: post-deploy
    action: >-
      The governed deploy shipped the merge commit: deploy-ducklake-lambdas.yml deploys the last-green ref and skips a
      superseded commit (Decision 254 cl.5), so read with mcp__github__actions_list the first run whose gate sha
      (LAMBDA_ARTIFACT_SHA) is $MERGE_SHA or a first-parent descendant of it, and save its jobs to $DEPLOY_JOBS_JSON.
    command: >-
      test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
      jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
      assert all(any(n.startswith(w) and c=='success' for n,c in jobs.items()) for w in ['deploy-maintenance','maintenance-smoke']),jobs;print('DEPLOY_OK')"
    expected: deploy-maintenance and maintenance-smoke concluded success, then DEPLOY_OK.
    fix_if: A red deploy job is root-caused and fixed forward, never re-run to green (Decision 55).
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: >-
      First production pass: the operator runs merge_ops once from CloudShell after step 11 (command in context), or
      the next scheduled :30 pass runs it. Save the pass's CURRENT_COMPACTION line to $COMPACTION_LINE_FILE.
    command: >-
      aws logs filter-log-events --profile agent_platform --region eu-west-2 --log-group-name
      /aws/lambda/agent-platform-ducklake-maintenance --start-time "$DEPLOY_EPOCH_MS" --filter-pattern
      '"CURRENT_COMPACTION"' --query 'events[-1].message' --output text > "$COMPACTION_LINE_FILE" && bin/venv-python -c
      "import json,os;t=open(os.environ['COMPACTION_LINE_FILE']).read();d=json.loads(t[t.index('{'):]);
      p={r['table']:r for r in d['per_table']};print(p);assert not d['failures'],d['failures'];
      assert all(p[x]['files_processed']>0 and p[x]['proof']=='equal' for x in ['ops_recommendations_current','ops_decisions_current']),p;
      print('COMPACTION_LIVE_OK')"
    expected: No failures; both tables rewrote files and proved equal, then COMPACTION_LIVE_OK.
    fix_if: >-
      A proof failure has already paged (MaintenanceBreakerTrip): STOP and file a Critical rec naming both snapshot
      ids; restoration is a rebuild of current from history (Decision 81 cl.8), separately planned, never improvised.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: The ops catalog's after-merge file count fell.
    command: >-
      aws cloudwatch get-metric-statistics --profile agent_platform --region eu-west-2 --namespace DuckLakeMaintenance
      --metric-name MergeOpsFilesAfterTotal --start-time "$DEPLOY_ISO" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --period 300 --statistics Minimum --query 'min(Datapoints[].Minimum)' --output text | bin/venv-python -c
      "import sys;v=float(sys.stdin.read().strip());print(v);assert v<400,v;print('FILES_FELL_OK')"
    expected: A value below 400 (946 before the deploy), then FILES_FELL_OK.
    fix_if: No datapoint means no pass ran yet; a value near 946 means the rewrite did not reach the current tables.
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: >-
      First read after compaction: call count_by_status once through the ducklake-reads tool, then save that call's
      ducklake_invocation line from /aws/lambda/agent-platform-ducklake-reader to $READ_LINE_FILE.
    command: >-
      bin/venv-python -c "import json,os;t=open(os.environ['READ_LINE_FILE']).read();d=json.loads(t[t.index('{'):]);
      s=d['elapsed_ms']-d.get('connect_ms',0);print(d.get('action'),d.get('status'),s);
      assert str(d.get('status')) in ('200','ok') and s<5000,d;print('FIRST_READ_FAST')"
    expected: Status 200 and under 5,000 ms outside connect (96,363 ms on 2026-11-14), then FIRST_READ_FAST.
    fix_if: >-
      Over 5 s on compacted tables points at another cost (threads, rec-5182; the batch predicate, rec-5181): record the
      number in the PR body and on rec-5179, never loosen the bound.
    hermetic: false
    graduation: not-applicable
  - step: 15
    phase: post-deploy
    action: >-
      Pre-registered latency outcome (NS.6; Decision 214 cl.4's per-invocation wall signal), run at least 24 h after
      the first pass (schedule a wake; never poll): over the ops reader's ducklake_invocation lines, count calls with
      elapsed_ms over 29,000 and take elapsed_ms p95, for the 24 h before the deploy and the 24 h after the first pass
      (Logs Insights on /aws/lambda/agent-platform-ducklake-reader, one query per window: fields @message | filter
      @message like /ducklake_invocation/ | parse @message '"elapsed_ms": *,' as e | stats count(*) as n, sum(e >
      29000) as slow, pct(e, 95) as p95), saved to $LATENCY_JSON as
      {"before": {"slow": n, "p95": ms}, "after": {...}}.
    command: >-
      bin/venv-python -c "import json,os;d=json.load(open(os.environ['LATENCY_JSON']));b,a=d['before'],d['after'];print(d);
      assert a['slow']<=2 and a['p95']<b['p95'],d;print('LATENCY_OUTCOME_OK')"
    expected: >-
      At most 2 calls over 29 s in the 24 h after (about 51 a day before: 359 in 7 days) and a lower p95, then
      LATENCY_OUTCOME_OK; both windows' numbers go in the PR body and on rec-5179.
    fix_if: >-
      More slow calls on compacted tables means another cost dominates (rec-5181 batch predicate, rec-5182 threads,
      rec-5180 deadline): record it, never loosen the bound.
    hermetic: false
    graduation: not-applicable
  - step: 16
    phase: post-deploy
    action: The next control_health run after the first pass holds the ceiling.
    command: >-
      aws cloudwatch get-metric-statistics --profile agent_platform --region eu-west-2 --namespace DuckLakeMaintenance
      --metric-name ControlTableInvariantViolation --start-time "$PASS_ISO" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      --period 300 --statistics Maximum --query 'max(Datapoints[].Maximum)' --output text | bin/venv-python -c
      "import sys;v=float(sys.stdin.read().strip());assert v==0,v;print('CEILING_HOLDS')"
    expected: 0, then CEILING_HOLDS.
    fix_if: A violation names its table in the control_health 500 log body; read it before changing anything.
    hermetic: false
    graduation: not-applicable
  - step: 17
    phase: post-deploy
    action: rec-5179 closed by the squash commit's Resolves trailer; read it back with recs_by_ids into $REC_STATUS.
    command: test "$REC_STATUS" = closed && echo REC_CLOSED
    expected: REC_CLOSED.
    fix_if: Read ci.yml's closure job log for the merge commit.
    hermetic: false
    graduation: not-applicable
