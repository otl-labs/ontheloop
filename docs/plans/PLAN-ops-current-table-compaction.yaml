    the evidence fixture it writes (rec-5179's acceptance already names the evidence node: update_rec at planning,
    read back 2026-11-16T00:11Z).
  - handler.py thin call and the wiring tests; step 2 red then green.
  - control_health ceiling and its tests; step 4 red then green.
  - Both manifests and the bundle test; step 7 red then green.
