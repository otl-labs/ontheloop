    verification_step: 2
    test_selector: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_compaction.py::test_proof_failure_merges_nothing_and_trips_breaker
    red_green_expectation: red before (node absent), green after
  - source: src/common/ducklake_maintenance_scope.py
    behavior: The verb is in VERB_UNIVERSE and every class declares a cell.
    verification_step: 3
    test_selector: tests/common/test_ducklake_maintenance_scope.py::test_rewrite_current_deletes_declared_for_every_class
    red_green_expectation: red before (node absent), green after
  - source: src/common/ducklake_control_health.py
    behavior: Current-table live-file ceiling.
    verification_step: 4
    test_selector: tests/test_ducklake_control_health.py::test_current_table_over_ceiling_is_a_violation
    red_green_expectation: red before (node absent), green after
  - source: src/common/ducklake_maintenance.py
    behavior: rewrite() needs an explicit delete_threshold.
    verification_step: 5
    test_selector: tests/test_ducklake_maintenance.py::test_rewrite_requires_explicit_delete_threshold
    red_green_expectation: red before (node absent), green after
constraints:
  - No rescue agents or workaround loops (Decision 55); guardrail constants are never tuned to make a check pass.
  - The scheduled path stays agent-free (Decision 81 cl.6); no agent invokes the maintenance function.
  - Non-destructive at rewrite time; superseded files leave only through the weekly guarded gc_ops (Decision 188).
  - Never auto-restore on a proof failure; current rebuilds from history (Decision 81 cl.8).
  - Code reaches production only through deploy-ducklake-lambdas.yml (Decisions 125, 126); no Terraform change.
  - handler.py stays under 500 SLOC and the contract under its cap; relieve, never raise (Decision 128).
  - field_semantics.yaml is regenerated, never hand-edited.
  - >-
    Graduated shards kept (node ids unchanged; only assertions in their files change, all green after): control-health-asserts-invariants, control-health-catalog-aware, ducklake-merge-ops-smoke-harness-and-outcome-metrics, ducklake-partition-normalizer-and-verbs, ducklake-policy-matrix-smoke-harness-universe, ducklake-scope-smoke-harness-registry, g4-guards-bound-the-post-expiry-set-with-real-sizes, gc-ops-emits-full-metric-set, guard-live-set-is-universal, maintenance-helpers-raise-on-introspection-error, maintenance-policy-matrix-exhaustive, maintenance-scope-predicates-discriminate, matrix-carries-no-catalog-wide-verb, merge-ops-count-pair-nulled-together, merge-ops-discovery-and-loud-isolation.
