constraints:
  - No rescue agents or workaround loops (Decision 55); guardrail constants are never tuned to make a check pass.
  - The scheduled path stays agent-free (Decision 81 cl.6); no agent invokes the maintenance function.
  - Non-destructive at rewrite time; superseded files leave only through the weekly guarded gc_ops (Decision 188).
  - Never auto-restore on a proof failure; current rebuilds from history (Decision 81 cl.8; rec-5202).
  - Code reaches production only through deploy-ducklake-lambdas.yml (Decisions 125, 126); no Terraform change.
  - handler.py stays under 500 SLOC and the contract under its cap; relieve, never raise (Decision 128).
  - field_semantics.yaml is regenerated, never hand-edited.
  - >-
    Graduated shards kept (node ids unchanged; only assertions in their files change, all green after): control-health-asserts-invariants, control-health-catalog-aware, ducklake-merge-ops-smoke-harness-and-outcome-metrics, ducklake-partition-normalizer-and-verbs, ducklake-policy-matrix-smoke-harness-universe, ducklake-scope-smoke-harness-registry, g4-guards-bound-the-post-expiry-set-with-real-sizes, gc-ops-emits-full-metric-set, guard-live-set-is-universal, maintenance-helpers-raise-on-introspection-error, maintenance-policy-matrix-exhaustive, maintenance-scope-predicates-discriminate, matrix-carries-no-catalog-wide-verb, merge-ops-count-pair-nulled-together, merge-ops-discovery-and-loud-isolation, control-modules-track-scd2-membership, handler-errors-module-bundled, maintenance-scope-module-manifest-wiring, reader-dq-check-bundle, shared-reader-serves-no-telemetry, telemetry-kernel-excluded-from-data-pipeline, telemetry-reader-content-bundle, turn-capture-excluded-from-data-pipeline.
