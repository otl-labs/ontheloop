    read timeout would re-send a long first pass), and the second catalog_stats (record on rec-5200, read back); steps 12, 13, 14 and 16; schedule a wake 24 h after the first pass for step 15 and record its
    figures on rec-5200 and the PR; step 17.
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)
  - 'Report: what was implemented, verification results'
rollback: >-
  Revert the PR; the governed deploy ships the previous code and merge_ops stops rewriting. Compaction is
  content-preserving, so nothing needs restoring; superseded files stay time-travel reachable for the current-table
  retention window (7 days) until gc_ops. To stop the rewrite without a revert, set the scd2 and smoke_harness cells
  to apply=false (the Decision's proof-mismatch reversal); the 200-file ceiling stays armed, so control_health then
  raises a breaker 500 every 6 h once a current table passes 200 files -- expected until compaction resumes.
