schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ops-current-table-compaction
intent: >-
  Bound the live files of the ops current tables so a first full read on a fresh reader connection opens about 16
  objects instead of 1,143 (rec-5179; audit ducklake-api-latency-442ff085 LAT-01): a new per-table maintenance verb,
  rewrite_current_deletes, runs inside the 6-hourly merge_ops pass and rewrites each current table's delete-bearing
  files at an explicit delete threshold, proved row- and digest-preserving, before the merge consolidates them;
  control_health asserts a live-file ceiling per current table every 6 h. Removes the dominant agent-path latency
  (84-106 s first reads at a 120 s limit, 12 timeouts a week) on the warehouse every flow reads.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ops-current-table-compaction.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Executes rec-5179 (audit LAT-01).
closes_criteria: []
scope:
  - file: src/common/ducklake_current_compaction.py
    action: Create
    purpose: >-
      compact_current_tables(con, discovered, *, semantics, registry, policy, catalog, emit, budget_s) -> {per_table,
      skipped, refused, deferred, failures, elapsed_ms}. Resolves verb rewrite_current_deletes via scope.resolve_scope
      and reads read_partition_layout once; a catalog-level error there (a scope error, a layout read error or an
      unclassified table) is one recorded failure, never a raise, so the merge still runs; the layout is read only when a
      current-side table is scoped (the telemetry catalog reads nothing). Order: smoke_harness tables
      first (the in-pass canary), then the rest by delete-file count, largest first. A scoped history-side table is a recorded skip. A table with
      an active scheme and legacy_scheme_files > 0 is a collected refusal. Per table: re-prove its latest
      rewrite_current_deletes commit (token "rewrite_current_deletes:<table>:<uuid>", the Decision 204 verb's
      set_commit_message precedent) at its immediate predecessor snapshot vs the commit, a predecessor past retention
      being a recorded skip (the re-proof also counts against the budget); then, unless elapsed time passes COMPACTION_TIME_BUDGET_S (450, half the 900 s function
      timeout; checked before every OCC retry too, deferring rather than retrying once past it), one transaction under
      that token runs maint.rewrite at CURRENT_REWRITE_DELETE_THRESHOLD (0.0) under the writer's bounded OCC policy; the proof is decided by token lookup, not by files_processed; post-commit row count +
      full-row digest at the commit's immediate predecessor vs the commit (never the in-transaction pre snapshot: a
      non-conflicting insert can commit between them). files_processed > 0 with no snapshot for the token, or any
      digest mismatch, raises CurrentCompactionProofError (a DuckLakeMaintenanceError) at once. A table left unstarted
      by the budget is recorded under deferred. Every other per-table error is an isolated failure. Emits
      CurrentCompactionFilesRewritten, CurrentCompactionFailures, CurrentCompactionRefused and
      CurrentCompactionDurationMs (ops series undimensioned; non-ops catalogs through the CATALOG_METRICS filter) and
      prints one value-free line per pass: the literal prefix CURRENT_COMPACTION then one JSON object with keys
      per_table (each {table, files_before, delete_files_before, files_processed, files_after, attempts, duration_ms,
      pre_snapshot_id, commit_snapshot_id, proof}, proof one of equal | none | reproved), skipped, refused, deferred,
      failures and elapsed_ms; no row value. files_processed 0 with no snapshot for the token is clean (proof none).
    new_imports:
      - src.common.ducklake_maintenance
      - src.common.ducklake_maintenance_scope
      - src.common.ducklake_partition_layout
      - src.common.ducklake_partition_rewrite
      - src.common.ducklake_writes
  - file: src/common/ducklake_maintenance.py
    action: Modify
    purpose: >-
      rewrite() takes a required keyword delete_threshold (the engine's 0.95 default is never reachable) and returns
      the summed files_processed; its docstring names why the default never compacts a Type-1 projection.
  - file: src/common/ducklake_maintenance_scope.py
    action: Modify
    purpose: VERB_UNIVERSE gains rewrite_current_deletes (per-table; the catalog-wide rule unchanged).
    new_imports: []
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      maintenance_policy cells for rewrite_current_deletes: scd2 true (the verb itself skips a history side),
      smoke_harness true, append_only false (no current projection, no delete files), control false
      (ops_entity_counters: allocation-serialization contention, Decision 84 I-2; rec-5201). The header comment's list
      of production consumers names merge_ops's rewrite_current_deletes resolution.
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: Regenerated by bin/venv-python -m scripts.schema_to_field_semantics; never hand-edited.
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      action_merge_ops: one call to compact_current_tables after scope resolution and before the merge loop; the 200
      body gains `compaction`; compaction failures and refusals join MergeOpsPassFailed and the post-loop aggregate
      raise (the merge loop always runs); a CurrentCompactionProofError propagates to the breaker 500 before any merge.
      Thin call site only (484 of 500 SLOC on main today).
    new_imports:
      - src.common.ducklake_current_compaction
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: Ship src/common/ducklake_current_compaction.py in the maintenance bundle.
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: >-
      Exclude src/common/ducklake_current_compaction.py from the wildcard src/ include, as for the other ducklake_*
      maintenance modules; data-pipeline's packaged bytes are unchanged and its deploy gate (PROD_SOURCE_PATHSPECS) does
      not cover the manifest, so no data-pipeline deploy follows.
  - file: tests/lambda_manifest/test_bundle_checks.py
    action: Modify
    purpose: test_current_compaction_module_bundled_and_excluded, in the shape of test_maintenance_scope_module_bundled_and_excluded.
  - file: src/common/ducklake_control_health.py
    action: Modify
    purpose: >-
      CURRENT_LIVE_FILE_CEILING (200; the busiest merge-to-merge window of 2026-11-08..15 carried 104 ops writes): every
      registry current-side table present in the catalog reports live and delete-bearing file counts; a live count
      above the ceiling is an invariant violation (existing ControlTableInvariantViolation alarm); OpsCurrentLiveFilesMax
      emitted every run when any current table is present.
    new_imports:
      - src.common.ducklake_maintenance_scope
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      merge_ops entry: the rewrite_current_deletes step (threshold, proof and re-proof, refusal, deferral, failure
      split, breaker mapping, the `compaction` body key, metrics) classified non-destructive with the reason (it
      supersedes files the way merge does, every row unchanged and old files reachable until gc_ops, unlike
      rewrite_partition_layout's DELETE plus INSERT); the control_health ceiling
      sentence; the audit_invariants line naming maintenance_policy's production consumers; one amendment_log row.
      Relief first (NEAR_CAP).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Bound verbatim by docs/plans/approved/ops-current-table-compaction.yaml: one new numbered Decision (amends 188,
      191, 192; number and date filled at implementation, max-plus-one after rebasing) with a reversal-conditions
      stanza; an Update note on Decision 204 (re-lay is a partition-layout rewrite; the history tables are the true
      append-only record, and every current table can always be rebuilt from them, procedure rec-5202); a dated note
      on Decision 192 (the VERB_UNIVERSE literal); pointer lines on 191 (after its Warehouse ID) and 188 (after its
      Decision 193 pointer).
  - file: tests/common/test_ducklake_current_compaction.py
    action: Create
    purpose: >-
      Unit tests with connection doubles (mirror file; full branch coverage of the new module), plus
      test_engine_evidence_bounds_files_and_preserves_rows, which reads the committed evidence fixture, asserts its
      duckdb version equals config/lambda/ducklake/version.yaml (a Decision 99 bump re-runs step 6) and is rec-5179's
      acceptance (hermetic, so CI measures it); test_compaction_line_keys_and_value_free pins the line schema. If the
      file nears 500 SLOC, split it into a mirror package, never a budget registration.
  - file: tests/common/test_ducklake_current_compaction_engine.py
    action: Create
    purpose: >-
      Integration-marked real-engine conformance on the pinned engine (precedent
      tests/common/test_ducklake_gc_engine_conformance.py) that drives compact_current_tables itself on a local file
      catalog: a bucket(8, rec_id) MERGE-maintained table with merged, delete-bearing files; the default threshold
      rewrites nothing and a compaction is invisible inside its own transaction (Decision 99 pins); compaction then
      merge leaves at most 8 files and no delete file, with the token lookup, predecessor resolution and AT VERSION
      proof equal; both update-race directions conflict and the writer's error classifies as an OCC collision; a
      concurrent new-key insert commits without conflict and the predecessor proof still holds. With
      CURRENT_COMPACTION_EVIDENCE_OUT set it writes its measured counts (files and delete files before and after,
      files_processed under the default and the explicit threshold, row counts and digest equality) to that path.
  - file: tests/fixtures/current_compaction_engine_evidence.json
    action: Create
    purpose: >-
      The step-6 engine run's measured counts and the duckdb and ducklake extension versions it ran on, committed as
      evidence (Decision 204 cl.5 and 251 cl.5 precedent): CI never runs integration tests (the full tier deselects
      them under --disable-socket; rec-4071).
  - file: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_compaction.py
    action: Create
    purpose: >-
      Wiring: compaction before merge; a transient failure or a refusal still merges every table and fails the pass;
      a proof failure merges nothing and maps to the breaker 500; the real compact_current_tables beside an
      unclassified table records a failure and every classified table still merges.
  - file: tests/lambdas/ducklake_maintenance/handler/test_merge_ops_discovery.py
    action: Modify
    purpose: Test semantics builders declare the new verb's cells apply=false; real-registry tests patch compact_current_tables.
  - file: tests/lambdas/ducklake_maintenance/handler/test_operational_actions.py
    action: Modify
    purpose: >-
      _merge_ops_semantics declares the new cells apply=false, and _run_merge_ops also patches compact_current_tables
      (it patches h.scope.resolve_scope module-wide, which the compaction's own resolution would otherwise read).
  - file: tests/common/test_ducklake_maintenance_scope.py
    action: Modify
    purpose: VERB_UNIVERSE pin and the declared cells per class.
  - file: tests/common/test_ducklake_gc_ops.py
    action: Modify
    purpose: Its VERB_UNIVERSE pin gains the verb; gc_ops still absent.
  - file: tests/checks/contracts/test_validate_maintenance_policy_matrix.py
    action: Modify
    purpose: Its verb tuple gains the verb; a missing rewrite_current_deletes cell fails the matrix check.
  - file: tests/test_ducklake_control_health.py
    action: Modify
    purpose: Current-table ceiling violation, per-table reporting and the OpsCurrentLiveFilesMax emission.
  - file: tests/test_ducklake_maintenance.py
    action: Modify
    purpose: rewrite() requires delete_threshold and renders it.
bundled_recommendations:
  - rec-5179
followon_recs:
  - rec-5200
  - rec-5201
  - rec-5202
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    On the pinned engine, compact_current_tables then merge leaves a production-shaped current table at most one live
    data file per bucket and no delete file, with row count and full-row digest equal at the commit's predecessor and
    the commit; the engine's default threshold rewrites nothing.
  - >-
    rewrite_current_deletes is a declared per-table verb with a cell for every class; the pass rewrites only
    current-side tables whose cell applies, smoke_harness first, never at an implicit threshold; a history side is a
    recorded skip, a legacy-scheme table a collected refusal, and the telemetry catalog a no-op.
  - >-
    A transient per-table failure, a refusal or a catalog-level compaction error is recorded, every table still merges
    and the pass ends non-successfully; a table the time budget leaves unstarted is deferred, not failed; a quiet
    table (no file processed, no snapshot) is clean; a proof mismatch, or a rewrite that processed files but whose
    token resolves no snapshot, aborts the pass before any merge as a breaker trip.
  - >-
    Each pass re-proves a table's latest rewrite_current_deletes commit before rewriting it again; the time budget
    defers unstarted tables and stops OCC retries.
  - The committed engine evidence shows at most 8 files, no delete file and equal rows and digest after compaction.
  - >-
    control_health fails a current table whose live file count exceeds CURRENT_LIVE_FILE_CEILING, reports every one
    and emits OpsCurrentLiveFilesMax.
  - The new module ships in the maintenance bundle and is excluded from data-pipeline and every other bundle.
  - The new Decision, the two notes and the two pointers match the approved-text sidecar.
  - >-
    After the deploy, no pass logs a compaction failure or refusal, and the first pass that rewrote each of
    ops_recommendations_current and ops_decisions_current logs files rewritten and proof equal; MergeOpsFilesAfterTotal falls below 400 (946 at
    2026-11-15T06:30Z), a first count_by_status on a fresh connection spends under 5,000 ms outside connect, and the
    next control_health is clean.
  - >-
    rec-5179 (whose acceptance names the hermetic evidence node, set at planning) is closed by the merge's Resolves
    trailer with that node green.
