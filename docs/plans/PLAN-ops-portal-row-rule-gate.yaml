schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ops-portal-row-rule-gate
intent: >-
  rec-4158 (Decision 210), its closing plan: the agent-side ops portal stops carrying its own copy of the rules.
  file_rec, update_rec, file_decision and update_decision run the DuckLake writer's own pure gate (schema_gate and
  check_write) over the field_semantics.yaml the writer ships, as a fail-fast pre-check that can never drift from the
  writer and is never authoritative. Inserts evaluate every rule; updates and caller-keyed upserts evaluate only
  undated rules, so the pre-check can never be stricter than the writer. The two rules no writer can run (acceptance lint, dependency existence) stay
  portal-side, driven by the contract's own exemptions. config/agent/data_quality/ops.yaml loses its write-time role:
  its write_time flags and the five portal-only test entries go, and what remains is a DQ backstop never stricter than
  the contract. Closes T2.29 c6 and rec-4158.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-ops-portal-row-rule-gate.yaml
phase: >-
  ad_hoc_rec rec-4158 (Decision 210 cl.3 single source, applied to the portal); closes T2.29 c6 (the write-time
  validator registry repointed to the Class A contract's declared rules) and re-grounds T2.29 c5's wording.
scope:
# --- the portal -----------------------------------------------------------------------------------------------------
- file: scripts/ops_portal/write_validators.py
  action: Modify
  purpose: >-
    Rewritten in place (the ops_recommendations contract names this path as the acceptance_lint exemption owner, and
    the projection ships that owner, so the path must not move). Deleted: _load_write_time_validators, its cache, the
    _WRITE_TIME_VALIDATOR_BUILDERS map and every builder, _check_not_null, _validate_file_path,
    _validate_context_length and _OPS_YAML_PATH. Kept: _rec_exists and its positive memo. New gate_write(table,
    record, *, insert, existing=None): projects the record exactly as the transport does
    (writer_transport._project_ops_record), then calls the writer's own schema_gate and
    src.common.ducklake_write_rules.check_write against resolve_table_spec(table) over the repo's
    config/lambda/ducklake/field_semantics.yaml. insert=True is used only where the row is new by construction
    (file_ops: the writer allocates the key) and evaluates every rule with prior None and the minted columns set as
    file_scd2 sets them (a placeholder merge key "<entity_id_prefix>0"). insert=False is used for update_ops and for
    every caller-keyed write_ops upsert (file_decision, which backfill_decisions_from_md re-runs over existing rows,
    and file_rec's _migration_int_id path), where a stored prior may exist: it evaluates only the undated rules -- the
    projection's columns with every leg named in their exclude_before removed -- with prior None, because an undated
    rule binds every row whatever its age (src/row_rules/rules.py _binder), so the created_timestamp argument is just
    the call time and the existing row's stored value is never read (a missing or unparseable one cannot fail the
    gate; created_timestamp is a derived column the writer owns), and dated rules stay the writer's alone: never stricter
    than the writer, by construction. Consequence, stated in the records: an update no longer fails fast in the
    portal on a dated leg (title, context, file and acceptance min_length, file pattern, tags format and the dated
    not_null legs); the writer evaluates it, binding it when the column changes or the row is newer than the date,
    and its 422 surfaces as the portal's ValueError (writer_transport) at the cost of one round-trip. A rejection
    raises RowRuleRejected(ValueError) naming table, column, rule, the declared limit in words (min_length "at least
    N stripped characters", accepted_values "one of [...]", pattern and array_element_format the pattern, not_null
    "is required") and exclude_before -- never the value; a schema-gate failure raises ValueError with the gate's own
    message. Then the producer-side rules, driven by RowRules.producer_exemptions (column, kind): a handler map
    {acceptance_lint: lint_acceptance_command, array_element_reference: _rec_exists}, each handler given the declared
    leg's params from scripts.contract_rules.declared_rules(table) for that (column, kind) -- so require_discrimination
    comes from the contract, never a portal copy; a handler runs on insert, on an upsert with no existing row
    (existing None: the producer-side rules apply as on insert), and on update only when the column's value differs
    from the existing row; an exempt kind with no handler fails closed. The update arm removes each dated leg together
    with its exclude_before entry from the projection copy, deleting an emptied exclude_before mapping
    (RowRules.from_projection refuses a date naming an absent rule and an empty mapping), and also drops any undated
    two-column rule (not_before, at_most) whose other column is writer-derived, since the gate's call-time
    created_timestamp is not the stored one; none is declared on an ops table today, so this keeps "never stricter"
    true by construction rather than by inventory. The array_element_reference handler is built once per gate_write call and holds one reader for the
    whole element list, built lazily and not at all when every element is memoised (Decision 88 invariant (i), as the
    deleted builder closure did). Module docstring: a derived pre-check, never authoritative; the writer re-evaluates
    every rule (Decision 81 cl.5 as widened by Decision 210 cl.5).
