followon_recs: []
closes_criteria: ["T2.29:c6"]
infrastructure_dependencies:
- >-
  data-pipeline (src/lambdas/data-pipeline/manifest.yaml, active) packages docs/ROADMAP-PLATFORM.yaml as an asset, so
  compute_affected_artifacts reports it. No deploy is performed or needed (Decision 198 precedent; asserted by VP
  step 10; rec-3990 tracks the asset deploy-trigger gap). No other scope file is Lambda-packaged; no .tf is in scope.
acceptance_criteria:
- >-
  file_rec, update_rec, file_decision and update_decision reject through the writer's own gate functions over the
  shipped projection; no portal module reads config/agent/data_quality/ops.yaml for a write-time rule
  (tests/test_ops_data_portal_validators.py::test_portal_gate_is_the_writer_gate, rec-4158's acceptance node, for the
  gate; tests/ops_data_portal/test_rec_write.py::TestWriteTimeDispatch::test_file_rec_and_update_rec_refuse_through_the_gate
  and tests/ops_data_portal/test_decisions.py::test_file_decision_and_update_decision_refuse_through_the_gate for the
  four call sites; step 12's sweep for the ops.yaml reads).
- The update pre-check evaluates only undated rules and is never stricter than the writer; an older row with a pre-date violation stays updatable through the portal.
- Acceptance lint and dependency existence run from the contract's exemptions, on insert and on a changed column only; an exempt kind with no handler fails closed.
- >-
  Every retired portal check maps to the contract leg that replaces it, proven by mutation (the removal ledger, step
  4): on insert the gate refuses what the old check refused; on update a dated leg is the writer's, named per row; the
  ledger is complete against origin/main's ops.yaml (step 12).
- ops.yaml carries no write_time key and no write-time-only test; the DQ compiler raises on any such test type; DQ is never stricter than the contract.
- >-
  T2.29 c6 is met and c5 re-grounded; Decision 65 carries the dated update; ports.yaml records the coupling
  (tests/checks/contracts/test_ops_rule_source_records.py::test_roadmap_is_regrounded and ::test_portal_gate_records_land).
- >-
  rec-4158, rec-3217 and rec-2801 close on holds verdicts (step 13); the build report lists the close_proposed commands
  propose_or_close_rec composes for rec-746, rec-2807 and rec-759 (superseded) and rec-2805 (contradicted), for the
  operator to run (they persist nothing until run).
- No reference to a deleted symbol or an ops.yaml write_time key remains in scripts, src, tests or .github (step 12).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    rec-4158's acceptance node -- for every rule kind its tables declare (derived from RowRules), a mutation the
    writer itself refuses (driven through tests/fixtures/ducklake_fakes.py, not check_write, which the gate itself
    calls: file_scd2 for ops_recommendations, write_scd2 with a new key for ops_decisions, whose keyspace is the
    caller's) is refused by the gate naming the same rule and column, and a rule-clean record passes both; writer-minted
    columns are skipped, derived from their role, since no payload supplies them.
  command: bin/venv-python -m pytest "tests/test_ops_data_portal_validators.py::test_portal_gate_is_the_writer_gate" -q
  expected: Exit 0.
  fix_if: A kind where the gate and the writer disagree -> the gate re-implemented or skipped something; call the writer's functions, never copy them.
  hermetic: true
  graduation: graduate
  graduation_check_id: portal-gate-is-the-writer-gate
- step: 2
  phase: pre-deploy
  action: >-
    The update pre-check is never stricter than the writer: update_rec, driven with a reader-shaped older row that
    violates a dated leg on an untouched column, passes the gate and the fake writer's write_scd2 alike; for every
    undated kind a violation is refused by both.
  command: bin/venv-python -m pytest "tests/test_ops_data_portal_validators.py::test_update_gate_is_never_stricter_than_the_writer" -q
  expected: Exit 0; every parametrized kind passes.
  fix_if: A dated rule evaluated on update -> remove it from the update rule set (Decision 70).
  hermetic: true
  graduation: graduate
  graduation_check_id: portal-update-gate-never-stricter
- step: 3
  phase: pre-deploy
  action: >-
    The producer-side rules follow the contract's exemptions and take their params from the declared leg (a copied
    contract with require_discrimination false flips the verdict on a lone-grep acceptance); an unhandled exempt kind
    fails closed; an unchanged column skips on update; one reader per write.
  command: bin/venv-python -m pytest "tests/test_ops_data_portal_validators.py::test_producer_side_rules_follow_the_contract_exemptions" -q
  expected: Exit 0.
  fix_if: Fix the handler map; never drop a producer-side rule.
  hermetic: true
  graduation: graduate
  graduation_check_id: portal-producer-rules-follow-exemptions
- step: 4
  phase: pre-deploy
  action: >-
    The removal ledger, proven by mutation: for each row of tests/fixtures/portal_removal_ledger.py (every retired
    portal check), gate_write(insert=True) refuses the input the old check refused, naming the contract rule, and
    accepts it once that leg is removed from a copied projection; for each row whose leg is dated, the named writer
    node passes, run as a pytest subprocess (never imported: the no-cross-test-import guard).
  command: bin/venv-python -m pytest "tests/test_ops_data_portal_validators.py::test_each_retired_validator_is_replaced_by_its_contract_leg" -q
  expected: Exit 0; every parametrized ledger row passes.
  fix_if: A row whose input the gate accepts -> a rule was lost; restore it at the contract, never in portal code (Decision 181 cl.1).
  hermetic: true
  graduation: graduate
  graduation_check_id: portal-removal-ledger-by-mutation
- step: 5
  phase: pre-deploy
  action: ops.yaml has no write-time role and is never stricter than the contract.
  command: bin/venv-python -m pytest "tests/checks/contracts/test__ops_rule_bindings.py::test_ops_yaml_has_no_write_time_role_and_is_never_stricter" -q
  expected: Exit 0.
  fix_if: Fix ops.yaml or the leg.
  hermetic: true
  graduation: graduate
  graduation_check_id: ops-yaml-no-write-time-role
- step: 6
  phase: pre-deploy
  action: The DQ compiler raises on each former write-time-only test type.
  command: bin/venv-python -m pytest "tests/test_data_quality_compile.py::test_former_write_time_only_types_now_raise" -q
  expected: Exit 0.
  fix_if: Fix the compiler.
  hermetic: true
  graduation: graduate
  graduation_check_id: dq-compiler-former-write-time-types-raise
- step: 7
  phase: pre-deploy
  action: The re-pinned and new suites pass whole.
  command: >-
    bin/venv-python -m pytest tests/test_ops_data_portal_validators.py tests/ops_data_portal/test_rec_write.py
    tests/ops_data_portal/test_update_rec_content_validation.py tests/test_ops_data_portal_decisions.py
    tests/ops_data_portal/test_decisions.py tests/test_ops_portal_facade.py tests/test_data_quality_compile.py
    tests/checks/test__budget_recs.py tests/convergence_health/budget_ingest/test_ingest.py
    tests/convergence_health/test_escalate.py tests/ci_rca/test_close_recs_from_trailer.py
    tests/ops_data_portal/test_ci_rca_propose_close.py tests/ops_data_portal/test_ci_rca_schema.py
    tests/test_ci_rca_inactivity_sweep.py tests/session/preflight/test_context_docs_data_quality.py
    tests/checks/ops_governance/test_validate_dq_manifest_gate.py tests/checks/contracts/test__ops_rule_bindings.py
    tests/checks/contracts/test_validate_ops_rule_source.py tests/checks/ci_guards/test_validate_ops_portal_patch_targets.py
    tests/test_cost_reconciliation.py tests/checks/contracts/test_ops_rule_source_records.py
    tests/checks/contracts/test_write_time_enforcement_decision.py -q
  expected: Exit 0.
  fix_if: Re-pin to the gate; never weaken an assertion (Decision 181 cl.1).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Whole-file re-run of files this plan scopes; --pre's pytest_diff already runs them; steps 1-6 carry the standing guards.
- step: 8
  phase: pre-deploy
  action: The census-to-engine agreement test still agrees after the portal pattern helper is gone.
  command: bin/venv-python -m pytest tests/test_contract_rule_census_duckdb.py -q
  expected: Exit 0.
  fix_if: Fix the re-pin.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Whole-file re-run of a file this plan re-pins (local DuckDB, credential-free); its census-to-engine node is already
    a standing test, run by the full tier (duckdb is a heavy dependency deferred there, Decision 104; the fast CI tier
    skips the module at import, which is why the step is not hermetic).
- step: 9
  phase: pre-deploy
  action: Live census through the DQ harness -- no stored row violates a rule the update gate evaluates (undated rules bind every row).
  command: bin/venv-python -m scripts.contract_rule_census
  expected: Exit 0; every compiled rule prints 0 violators with PASS.
  fix_if: A violator -> STOP, do not merge, return to /plan. Exit 2 -> the reader is unavailable; never treat it as clean.
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: pre-deploy
  action: Assert the ground for NO data-pipeline redeploy despite touching its packaged roadmap asset.
  command: >-
    grep -q 'the schedule stays disabled' src/lambdas/data-pipeline/manifest.yaml && ! grep -q 'ROADMAP-PLATFORM'
    .github/workflows/deploy-prod-lambdas.yml && git diff --quiet "$(git merge-base HEAD origin/main)" -- config/lambda
    src/common src/lambdas src/row_rules src/telemetry terraform && echo INERT_OK
  expected: Exit 0 and INERT_OK printed.
  fix_if: A packaged diff -> it does not belong in this plan; revert it. Schedules re-enabled -> the governed deploy-prod-lambdas workflow, never a local deploy.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Green on the un-implemented tree too, a per-PR transient; its durable form is rec-3990.
- step: 11
  phase: pre-deploy
  action: Full validation tier before handoff.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; never raise a budget, skip a check or drop a pre_glob.
  hermetic: false
  graduation: not-applicable
- step: 12
  phase: pre-deploy
  action: >-
    Closure sweep (12k): no deleted symbol and no ops.yaml write_time key remains in scripts, src, tests or .github,
    and the removal ledger covers every write_time test origin/main's ops.yaml carries.
  command: >-
    ! git grep -n -E '_load_write_time_validators|_validate_file_path|_validate_context_length|_check_not_null|_write_time_validators_cache|_UPDATE_CONTENT_VALIDATED_FIELDS|_migration_mode|_WRITE_TIME_ONLY_TEST_TYPES|_WRITE_TIME_VALIDATOR_BUILDERS|_build_[a-z_]+_validator|_OPS_YAML_PATH'
    -- scripts src tests .github && ! grep -n 'write_time' config/agent/data_quality/ops.yaml && bin/venv-python -c
    "import subprocess,yaml;from tests.fixtures.portal_removal_ledger import LEDGER;
    b=yaml.safe_load(subprocess.run(['git','show','origin/main:config/agent/data_quality/ops.yaml'],capture_output=True,text=True,check=True).stdout);
    w=set();[w.add((c,next(iter(t)))) for tb in b['tables'].values() for c,col in (tb.get('columns') or {}).items() for t in (col.get('tests') or []) if isinstance(t,dict) and any(isinstance(v,dict) and v.get('write_time') for v in t.values())];
    h={(r['column'],r['check']) for r in LEDGER};m=w-h;print('SWEEP_CLEAN' if not m else m);assert not m"
  expected: Exit 0 and SWEEP_CLEAN printed (git fetch origin main first).
  expected_literals:
  - SWEEP_CLEAN
  fix_if: >-
    A hit -> remove or re-point that reference (the whole surface is in scope); a ledger gap -> add the row with its
    replacing leg, never drop the retired check silently.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    PR-relative closure sweep against origin/main: after merge the base carries no write_time keys and the deleted
    symbols, so it proves nothing; the standing guards are step 4's ledger, step 5's one-way leg and step 6's compiler
    refusal.
- step: 13
  phase: post-deploy
  action: Bookkeeping landed -- rec-4158, rec-3217 and rec-2801 closed by the Resolves trailer, and T2.29 c6 met.
  command: >-
    bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;from scripts.platform_roadmap_state import load;
    s={r:(f(r) or {}).get('status') for r in ('rec-4158','rec-3217','rec-2801')};
    t=[i for i in load('docs/ROADMAP-PLATFORM.yaml').tier_items if i.id=='T2.29'][0];c6=[c for c in t.exit_criteria if c.id=='c6'][0].status;
    print('CLOSURE', s, 'T2.29:c6', c6);assert set(s.values())=={'closed'} and c6=='met'"
  expected: Exit 0; CLOSURE printed with all three closed and T2.29:c6 met (git pull origin main first).
  fix_if: A rec still open -> check ci.yml's closure job and the holds verdict; never close by hand without the verdict (Decision 201).
  hermetic: false
