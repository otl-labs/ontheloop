schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ops-rule-source
intent: >-
  rec-4158 plan A of three (Decision 210 cl.3): make the ops_recommendations Class A contract the ONE declared source of
  every data rule its rows must satisfy -- reconciled from the seven surfaces that hold those rules today -- through one
  shared contract-rule reader (extracted from the telemetry projection, not forked), prove every declared rule and
  effective date against the live warehouse, and record the choice in the Decisions, the write-time-enforcement rule
  and the roadmap. Deploy-inert: plan B moves enforcement into the writer (V3); plan C switches the portal and DQ to the
  same rules and lands the all-writer conformance check. A single, verified rule source is what lets the writer reject
  bad rows in an append-only store where they can never be corrected later.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-ops-rule-source.yaml
phase: >-
  ad_hoc_rec rec-4158 (Decision 210 Coverage: existing ops writers and contracts); no tier_item claimed. Re-grounds the
  text of NS.5, CD.12, T1.6 (name, intent, c7, decomposition hint) and T2.29 (intent, c5, c6, c7) to the chosen source;
  closes no exit criterion.
scope:
- file: docs/contracts/ops_recommendations.yaml
  action: Modify
  purpose: >-
    Declare these rules, field by field ("05-01" = exclude_before "2026-05-01"): id: not_null, pattern
    '^(rec-[0-9]+|agent-[0-9]+|test-[a-z0-9-]+)$'; title: not_null (its existing undated leg, unchanged), min_length {value: 10, exclude_before:
    "2026-09-01"}; source: dq_intent_local not_null {enforced: true, exclude_before: "2026-05-01"} (its write_time sub-key
    is dropped -- under Decision 210 every declared row-local rule is write-time), values from the registry via its $ref;
    effort: not_null 05-01, accepted_values [XS, S, M, L, XL] 05-01; priority: not_null 05-01, [Critical, High, Medium,
    Low] 05-01; status: not_null, [open, closed, failed, declined, superseded]; automatable: not_null 05-01; risk:
    not_null 05-01, [low, medium, high] 05-01; file: not_null 05-01, min_length 1 05-01, pattern
    '^([^/\\A-Za-z][^\\]*|[A-Za-z]([^:\\][^\\]*)?|[A-Za-z]:([^/\\][^\\]*)?)$' (equal to _validate_file_path on every
    non-empty string, checked exhaustively at planning to length 4); context: not_null 05-01, min_length 80 05-01;
    acceptance: not_null 05-01, min_length 1 05-01, acceptance_lint {require_discrimination: true} with exemption {class:
    repository_state, reason: the lint reads the repository tree, owner: scripts/ops_portal/write_validators.py};
    dependencies: array_element_format '^rec-[0-9]+$', array_element_reference with exemption {class: cross_row, reason:
    an existence lookup outside the batch's partitions (Decision 210 cl.2(a)), owner: rec-4166}; tags:
    array_element_format '^[a-z][a-z0-9-]*$' exclude_before 2026-09-08; last_updated_timestamp: not_null, not_before
    created_timestamp; every field not named above keeps its existing not_null block (ulid and created_timestamp
    enforced: true, the rest enforced: false, meaning no rule). not_null means IS NOT NULL (the
    telemetry meaning); a string column the portal also requires non-blank carries a blank-rejecting rule (min_length
    >= 1, accepted values, or the registry). Layout: every dq_intent block is rewritten in YAML flow style (the
    telemetry_sessions.yaml precedent; same data, fewer lines) so the file stays within its 556 effective-line budget
    with no budget raise and no amendment_log compaction. Prose made consistent with the declared rules, each with a
    field-level amendment_log entry (prose_improvement, semantic_break false: the enforced behaviour never changed):
    status description and semantics name the five enforced values and drop in_progress/deferred executor eligibility;
    file semantics drops "Null for cross-cutting recs" (file has been required since 2026-05-01). The header comment
    and governance_notes stop naming src/schemas/rec.py as a co-authority. One contract-level amendment_log entry
    (change_class accepted_values_narrow, semantic_break true -- the contract's own 2026-09-08 precedent for rule
    additions) names PLAN-ops-rule-source; the ratchet below keys on it. nullable flags and the projected
    field_semantics.yaml are unchanged.
- file: scripts/contract_rules.py
  action: Create
  purpose: >-
    The ONE contract-rule reader, EXTRACTED from scripts/field_semantics_event_projection.py (its _load_yaml,
    _split_ref, _layer_rules, _registry_values, _effective_intents and _check_rule_keys move here as public functions):
    read_intents(table_id, resolved_fields, *, contracts_dir, repo_root, registry_key_ref) reads the RAW contract (never
    scripts/contracts.py's resolved view, which replaces a $ref field's dq_intent wholesale), layers dq_intent_local over
    the $ref target, and gives a registry_key $ref the registry's values; check_rule_keys(table, name, intent, allowed)
    fails closed on a key outside the caller's allowed set. Two changes, neither altering telemetry output: layering
    keeps a not_null leg's sub-keys (so source's exclude_before survives) while still OR-ing enforced; an exemption may
    carry an optional class beside reason and owner. Adds declared_rules(table) -> tuple[DeclaredRule, ...] (frozen:
    table, column, kind, params, exclude_before, exemption) for ops consumers. A non-not_null leg is a declared rule
    whatever its enforced value (that flag keeps its DQ-runner meaning; plan C owns the platform-wide re-read), so
    declared_rules includes it. Stdlib plus PyYAML; no network.
- file: scripts/field_semantics_event_projection.py
  action: Modify
  purpose: >-
    Import the extracted reader from scripts.contract_rules. The bodies of _load_yaml, _split_ref, _layer_rules and
    _registry_values leave this module; thin private shims _effective_intents(table_id, resolved_fields) and
    _check_rule_keys(table, name, intent) stay and delegate, passing the module-level _CONTRACTS_DIR, _REPO_ROOT,
    _REGISTRY_KEY_REF and _KNOWN_DQ_KEYS read at call time, so every existing test that patches or calls them
    (tests/test_field_semantics_event_projection.py) keeps passing unmodified. Pure extraction:
    config/lambda/ducklake/field_semantics.yaml regenerates byte-identical and every existing projection test passes
    unmodified.
- file: scripts/contract_rule_census.py
  action: Create
  purpose: >-
    Live census: compiles every non-exempt rule from contract_rules.declared_rules for ops_recommendations and
    ops_decisions into a DQ Check exactly as scripts/data_quality_compile.py's expression branch does (the same FROM
    form, created_timestamp >= DATE gate for exclude_before), translates with to_ducklake_sql and runs them through
    scripts.data_quality_execute.run_checks (the DQ harness; no new reader client). Predicates: not_null IS NOT NULL;
    accepted_values IS NULL OR IN; min_length on the Python str.strip() result (the SQL character class equals exactly
    the characters str.isspace() accepts); pattern via regexp_full_match; array_element_format counts a NULL element as
    a violation; not_before. Producer-side rules are listed as exempt, never compiled. CLI: --table, --json, --dry-run
    (prints compiled SQL, no reader). Every compiled Check carries enforced=True and severity="error". One line per
    rule with its violator count, then a summary line. Exit 1 when any check reports a violation count above zero,
    whatever its verdict label; otherwise exit 0 only when, per table, at least one rule compiled, the compiled count
    equals the declared non-exempt count, and every verdict is PASS; exit 2 for any other verdict (SKIP, UNAVAILABLE,
    ERROR) or a count mismatch -- never a silent pass (Decision 55).
- file: scripts/checks/contracts/validate_ops_rule_source.py
  action: Create
  purpose: >-
    Registered check (owner platform; Decision 170 accounting via registry.examined over declared rules). For
    ops_recommendations (and ops_decisions, whose rule set beyond not_null is T1.5 Phase 2's) it fails on: a rule key
    outside the ops vocabulary (not_null, accepted_values, min_length, pattern, array_element_format,
    array_element_reference, acceptance_lint, not_before, write_time_exemptions) or an unknown sub-key; a regex outside
    the RE2-and-Python subset (lookaround, backreference); not_null enforced false on a nullable false field; an
    exclude_before that is not an ISO date or, on ops_recommendations, is earlier than 2026-05-01; a producer-side key
    (acceptance_lint, array_element_reference) without an exemption; an exemption without a class from {cross_row,
    repository_state, temporary}, a reason and an owner, where a cross_row or temporary owner must be a rec id and a
    repository_state owner a repository path that exists; a rule leg whose exclude_before at HEAD is later than at
    the merge-base with origin/main, where an undated leg counts as the earliest date (it binds every row), so dating a
    previously undated leg is also a later move (the ratchet; a leg new at HEAD -- including a not_null leg that was
    enforced: false, meaning no rule, at the merge-base -- is unconstrained). A leg present at the
    merge-base and absent at HEAD also fails (a rule removal is a redefinition, Decision 210 cl.4, so it needs its own
    plan changing this check). The ratchet is dormant only on the installing PR -- when the merge-base resolves and
    scripts/checks/contracts/validate_ops_rule_source.py does not exist there (the Decision 208 cl.1 absent arm) --
    so this plan's own two first datings (title min_length, tags array_element_format), justified by the census, are
    the last unratcheted move, and amendment_log edits can never switch it off; when no merge-base resolves the leg
    prints skipped with its reason; any write_time test in config/agent/data_quality/ops.yaml without an equal contract rule on the same
    column (not_null -> contract not_null plus, on a VARCHAR column, a blank-rejecting rule; accepted_values as a set;
    min_length value; array_element_format pattern; path_syntax -> the contract's file pattern; acceptance_lint and
    array_element_reference -> the declared producer-side key; gates compared only through the floor and ratchet; the
    retired write-time expression builder ignored); the contract's status accepted values differing from
    STATUS_TRANSITIONS["ops_recommendations"]["enforced"], scripts/executor/jsonl_store._VALID_STATUSES or the
    Recommendation status Literal -- all three read by an ast parse of their source files, never imported, so the
    check's import closure stays scripts.contract_rules plus PyYAML. Transitional by design: plan C folds it into the all-writer conformance check.
- file: scripts/checks/contracts/_manifest.py
  action: Modify
  purpose: >-
    Entry for validate_ops_rule_source, pre=True, pre_globs: docs/contracts/ops_recommendations.yaml,
    docs/contracts/ops_decisions.yaml, docs/contracts/source-lineage.yaml, config/agent/data_quality/ops.yaml,
    config/agent/data_quality/source_registry.yaml, scripts/contract_rules.py, scripts/executor/jsonl_store.py,
    src/common/ducklake_scd2_schema.py (both ast-read, not imported), scripts/ops_portal/write_validators.py (the
    repository_state owner path the check verifies), scripts/checks/contracts/**, scripts/checks/_common.py,
    scripts/checks/registry.py -- the check's whole import closure, so validate_pre_glob_closure holds; full_segment
    full_after_lint.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: function_to_category row validate_ops_rule_source -> schema_drift.
- file: scripts/checks/ops_governance/_manifest.py
  action: Modify
  purpose: >-
    Human-directed scope amendment (Benjamin, 2026-10-04, decision card, landed as its own reviewed PR): the extracted
    reader scripts/contract_rules.py enters the import closure of validate_reconcile_pending_gate through
    scripts/field_semantics_event_projection.py, so that check's Entry gains the pre_globs line
    scripts/contract_rules.py (validate_pre_glob_closure fails the full tier without it). One line; no other change.
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: >-
    scripts_root_allowlist.allowed_files gains scripts/contract_rules.py and scripts/contract_rule_census.py (a
    two-member contract_ family beside the generator singles; validate_placement fails a depth-1 scripts/ file that is
    not allowlisted), with one amendment_log entry (field_add, additive only).
- file: config/agent/verification_registry/entries/ops-recommendations-partition-amendment-in-budget.yaml
  action: Modify
  purpose: >-
    Its exact-match expected stdout pins the contract's effective line count (554 today); the flow-style rewrite
    changes that count, so expected is updated to the measured post-rewrite count, exact match kept (the command's own
    <= 556 assertion still carries the budget), so the shard fails on origin/main and passes on HEAD.
- file: docs/contracts/source-lineage.yaml
  action: Modify
  purpose: >-
    registry_key governance_notes: the ops_recommendations tightening reads 'not_null enforced:true +
    exclude_before:"2026-05-01"' (the write_time sub-key is dropped from that dq_intent_local). No other change.
- file: docs/contracts/data-modeling-standard.yaml
  action: Modify
  purpose: >-
    Rule write-time-enforcement statement: replace "for the ops tables the choice among ... is rec-4158's; an exemption
    sits beside the rule with its reason and owning rec" with the recorded choice (the owning Class A contract;
    field_semantics.yaml its generated projection; ops.yaml and the CD.12 Pydantic models DQ-side artefacts, never a
    write-time rule source), the exemption grammar (write_time_exemptions {class, reason, owner}: class cross_row or
    temporary names its owning rec; class repository_state -- a rule no write can ever decide -- names the producer
    that enforces it), the OLDER-ROWS rule (a rule binds every column of a row created on or after its exclude_before,
    and any column a write changes, decided from the existing-row fetch the writer already makes; on insert every rule
    binds; on ops_recommendations no exclude_before is earlier than the Decision 64 anchor 2026-05-01, a later date is
    that rule's own effective date, never a moved anchor, and a date never moves later), and one coverage sentence
    (Decision 181 cl.2): contract declarations -> validate_ops_rule_source; writer enforcement -> rec-4158 plan B; the
    sidecar tables' rules (ops_execution_plans, ops_priority_queue), class on telemetry's exemption and the
    platform-wide enforced re-read -> rec-4158 plan C; ops_decisions rules beyond not_null -> rec-4167 (after T1.5
    Phase 2); the dependency-reference DQ monitor -> rec-4166. Keeps every phrase
    tests/checks/contracts/test_write_time_enforcement_decision.py anchors. amendment_log entry; updated_by.
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    Three dated annotations, appended, never mid-body (Decision 177 pinned forms): a trailing "[Amendment 2026-MM-DD,
    rec-4158: ...]" on Decision 210 recording cl.3's ops choice, the older-rows rule and the exemption owner rule, which
    extends cl.3's "owning rec" (an exemption names its owning rec, except a repository_state rule, which no write can
    ever decide, names the producer that enforces it), with a detail pointer to data-modeling-standard.yaml; a "> **Update (2026-MM-DD):**" on Decision 65 (for
    ops_recommendations the canonical field-semantic and write-time rule authority is the owning Class A contract;
    ops.yaml's write_time flags are a transitional, parity-checked copy until rec-4158 plan C retires them; its DQ checks
    stay until T1.6 c7 retires the file, and the description/semantics text Decision 66 guidance reads moves to the
    contract under T2.29 c7); a "> **Update (2026-MM-DD):**" on
    Decision 64 (2026-05-01 is also the floor for every write-time rule's exclude_before on ops_recommendations; a rule
    introduced later carries its own later date -- a rule-effective date, never a moved anchor -- and no date moves
    later or is removed once declared, which validate_ops_rule_source's ratchet enforces). Decision 210 stays under
    the 6,144-byte per-entry cap.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write; never hand-edited.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    Re-grounding only (tier-item-lifecycle stale-reference rule), each change dated and citing rec-4158 and Decision 210
    cl.3. NS.5 detail gains a dated amendment (schema and write-time rules live in the owning Class A contract,
    Decisions 118 and 199; field_semantics.yaml is generated from it; Pydantic models are consumer projections). CD.12
    detail gains a dated amendment naming what is displaced -- Pydantic as the only place schema lives, the marker
    vocabulary as the rule vocabulary, and the YAML-vs-Pydantic drift detector as a source guard (it stays a DQ-side
    check until T1.6 c7) -- and what is not (alarm-not-gate, handler invariants, DqDeleted); ratification reconciles with
    this. T1.6: name, intent's deferred-phase sentence, c7 and decomposition_hints.atomic_plans[2] read the Class A
    contracts' declared rules instead of Annotated metadata. T2.29: intent items 5-6 and the closing SSOT sentence; c5
    (measured 2026-09-29: one current row, of any status, created before 2026-09-01 has a title under 10 stripped
    characters, so the title rule carries exclude_before 2026-09-01); c6 (the validator registry re-points to the Class A
    contract's declared rules -- rec-4158 plan C -- or stays the last ops.yaml runtime reader with T1.6 as retirement
    owner); c7 (guidance sources the Class A contract). No status, criterion count or dependency changes; net additions
    stay under 30 lines (9,754 of the 10,000-line ceiling at planning, Decision 114).
- file: tests/test_contract_rules.py
  action: Create
  purpose: >-
    Mirror test (alone reaches the per-file coverage floor validate_test_coverage applies, including the extracted
    functions): ops_recommendations declares exactly its scope row's rule list; ops_decisions declares only its existing
    not_null rules (the T1.5 boundary); source values come from the registry and its local intent has no write_time;
    layering keeps leg sub-keys and still ORs enforced; every check_rule_keys and exemption-shape branch fails closed
    on a fixture contract; scripts/field_semantics_event_projection.py no longer defines _load_yaml, _split_ref,
    _layer_rules or _registry_values, and its _effective_intents and _check_rule_keys shims delegate to
    scripts.contract_rules (a patched contract_rules function is what the shim calls).
- file: tests/test_contract_rule_census.py
  action: Create
  purpose: >-
    Mirror test, duckdb-free: each rule kind compiles to its predicate and gate; exempt rules are listed, not compiled;
    exit codes from a stubbed run_checks -- 0 all PASS, 1 a FAIL, 1 a WARN with violators, 2 a SKIP, 2 an UNAVAILABLE, 2 an empty compiled set, 2 a
    count mismatch; the whitespace class equals the str.isspace() set.
- file: tests/test_contract_rule_census_duckdb.py
  action: Create
  purpose: >-
    Module-level pytest.importorskip("duckdb"): every compiled predicate, run on an in-memory DuckDB table seeded with
    passing and violating rows (tab, no-break-space and ideographic-space padding; drive-letter, absolute and backslash
    paths; NULL list elements and empty lists), agrees row-for-row with the Python reference (str.strip, re.fullmatch,
    the portal's _validate_file_path, a NULL element as a violation). Plan B re-pins it to the shipped evaluator.
- file: tests/checks/contracts/test_validate_ops_rule_source.py
  action: Create
  purpose: >-
    Mirror test: the real tree passes; each failure branch fails on a fixture (vocabulary, sub-key, regex subset,
    contradictory not_null, floor, producer-side key without exemption, exemption class and owner forms, an ops.yaml
    write_time rule missing from the contract, status vocabulary drift); the ratchet fails a date moved later, a
    previously undated leg newly dated, and a removed leg against a fixture base that has the check module, is dormant
    against a resolved base lacking the module, and skips with a printed reason without a base; the contracts manifest carries the Entry with its
    pre_globs; the portal's _validate_file_path and
    _validate_context_length agree with the contract's file pattern and context min_length on one fixture corpus.
- file: tests/checks/contracts/test_ops_rule_source_records.py
  action: Create
  purpose: >-
    The recorded choice: Decision 210's trailing annotation names rec-4158, the Class A contract and the owner rule;
    Decisions 65 and 64 carry their dated updates; the write-time-enforcement statement names the ops source, the
    exemption grammar, the older-rows rule and the coverage sentence (naming rec-4166 and rec-4167) and no longer says
    the choice is rec-4158's;
    ops_recommendations' header and governance_notes no longer name rec.py; source-lineage.yaml's note no longer names
    write_time:true; NS.5, CD.12, T1.6 (name, c7, hint) and
    T2.29 (c5, c6, c7) carry the re-grounded text. Decision numbers are resolved from headers.
bundled_recommendations: []
followon_recs:
- rec-4158
- rec-4166
- rec-4167
infrastructure_dependencies:
- >-
  data-pipeline (src/lambdas/data-pipeline/manifest.yaml, active) packages docs/ROADMAP-PLATFORM.yaml as an asset, so
  compute_affected_artifacts() reports it. NO deploy is performed or needed: the roadmap edit is asset-only text with no
  packaged code change, and the asset refreshes with the artifact's next governed deploy (Decision 198 precedent,
  PLAN-telemetry-event-journal-contracts VP 8; asserted by VP step 7; rec-3990 tracks the asset deploy-trigger gap). No
  other scope file is Lambda-packaged; no .tf file is in scope.
acceptance_criteria:
- ops_recommendations declares exactly its scope row's rule list, ops_decisions keeps only its existing not_null rules,
  and validate_ops_rule_source passes on the tree and fails on each fixture defect.
- The telemetry projection no longer defines its own contract reader -- it imports scripts.contract_rules -- and
  field_semantics.yaml regenerates byte-identical with every existing projection test passing unmodified.
- The live census exits 0 -- per table at least one rule compiled, the compiled count equal to the declared non-exempt
  count, every verdict PASS with zero violators under the declared gates -- and lists the two producer-side rules as
  exempt; any SKIP, UNAVAILABLE or ERROR verdict, empty set or count mismatch exits 2.
- The census's SQL predicates agree row-for-row with the Python reference on DuckDB, including Unicode whitespace, NULL
  list elements and empty lists.
- Decisions 210, 65 and 64 carry their dated annotations; the write-time-enforcement statement records the choice, the
  exemption grammar, the older-rows rule and coverage; NS.5, CD.12, T1.6 (name, intent, c7, decomposition hint) and
  T2.29 (intent, c5, c6, c7) are re-grounded; docs/decisions-index.json is fresh.
- No packaged code change and no deploy -- the data-pipeline roadmap asset refresh is deferred to that artifact's next
  governed deploy, and no terraform or workflow file changes.
- rec-4158 carries a dated note that plan A landed and plans B and C remain.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The shared reader on the real contracts, layering, and fail-closed grammar.
  command: >-
    bin/venv-python -m pytest tests/test_contract_rules.py::test_ops_recommendations_declares_its_rule_list
    tests/test_contract_rules.py::test_ops_decisions_keeps_only_its_not_null_rules
    tests/test_contract_rules.py::test_source_values_come_from_the_registry
    tests/test_contract_rules.py::test_layering_keeps_leg_subkeys
    tests/test_contract_rules.py::test_rule_keys_and_exemptions_fail_closed
    tests/test_contract_rules.py::test_projection_imports_the_reader -q
  expected: Exit 0, 6 passed. Red before, because the module and its tests do not exist.
  fix_if: A rule missing or extra against the scope row -> fix the contract; never loosen the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: ops-contract-rule-table
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: The registered grammar, ratchet and parity check, on the real tree and on fixture defects.
  command: >-
    bin/venv-python -m pytest tests/checks/contracts/test_validate_ops_rule_source.py::test_real_tree_passes
    tests/checks/contracts/test_validate_ops_rule_source.py::test_each_defect_fails
    tests/checks/contracts/test_validate_ops_rule_source.py::test_exclude_before_cannot_move_later
    tests/checks/contracts/test_validate_ops_rule_source.py::test_portal_validators_agree_with_contract
    tests/checks/contracts/test_validate_ops_rule_source.py::test_registered_in_the_contracts_manifest -q
  expected: Exit 0, 5 passed. Red before, because the check does not exist.
  fix_if: A real-tree failure -> fix the contract or the parity mapping; never add an allow-list.
  hermetic: true
  graduation: graduate
  graduation_check_id: ops-rule-source-parity
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: Census compiler and exit codes, duckdb-free.
  command: >-
    bin/venv-python -m pytest tests/test_contract_rule_census.py::test_each_rule_kind_compiles
    tests/test_contract_rule_census.py::test_exempt_rules_are_listed_not_compiled
    tests/test_contract_rule_census.py::test_exit_codes
    tests/test_contract_rule_census.py::test_whitespace_class_equals_isspace -q
  expected: Exit 0, 4 passed. Red before, because the module does not exist.
  fix_if: A SKIP or empty set exiting 0 -> fix the exit mapping; a predicate drifting from the reference -> fix the compiler.
  hermetic: true
  graduation: graduate
  graduation_check_id: ops-rule-census-compile
  expected_literals: []
- step: 4
  phase: pre-deploy
  action: Census SQL semantics equal the Python reference on a real DuckDB engine.
  command: bin/venv-python -m pytest tests/test_contract_rule_census_duckdb.py -q
  expected: Exit 0 with no test skipped (duckdb is installed in the dev environment).
  fix_if: A disagreement -> fix the predicate; if RE2 cannot express a declared pattern, change the pattern at the source.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    duckdb is a heavy-exclusion dependency of the fast tier (requirements-fast.txt), so this module is collected only in
    the full tier; graduating it into the fast-tier registry would never execute it.
- step: 5
  phase: pre-deploy
  action: The recorded choice in the Decisions, the standard, the contract header and the roadmap; the Decision 210 guard holds.
  command: >-
    bin/venv-python -m pytest tests/checks/contracts/test_ops_rule_source_records.py::test_decision_annotations
    tests/checks/contracts/test_ops_rule_source_records.py::test_standard_records_the_ops_source
    tests/checks/contracts/test_ops_rule_source_records.py::test_ops_recommendations_names_one_authority
    tests/checks/contracts/test_ops_rule_source_records.py::test_roadmap_is_regrounded
    tests/checks/contracts/test_ops_rule_source_records.py::test_source_lineage_note_matches
    tests/checks/contracts/test_write_time_enforcement_decision.py -q
