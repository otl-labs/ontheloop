  CLOSURE -- separate facts, in order (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence):
  (a) READINESS: bin/venv-python -m scripts.session.github_readiness. (b) Set implementation_declared true, commit, git
