schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ops-writer-row-rules
intent: >-
  rec-4158 plan B of three (Decision 210 cl.1/cl.3): the DuckLake ops writer rejects, before any MERGE and writing
  nothing, every write that breaks a non-exempt rule the ops_recommendations Class A contract declares, under the
  recorded older-rows rule, with the rules projected from the contract into the shipped field_semantics.yaml and
  evaluated by ONE plane-neutral engine shared with the telemetry kernel. In an append-only store a bad row can never
  be corrected later, so the closed write boundary is the only place the rule can hold for every caller, not just the
  portal. Ships through the governed DuckLake deploy channel (V3); plan C (portal and DQ onto the same engine, the
  all-writer conformance check, the enforced re-read, sidecar tables) stays out of scope.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-ops-writer-row-rules.yaml
implementation_declared: true
phase: >-
  ad_hoc_rec rec-4158 (Decision 210 Coverage: existing ops writers and contracts); bundles rec-4168; no tier_item
  claimed. Widens T2.19 c7's writer schema-enforcement gate; closes no exit criterion.
scope:
- file: src/row_rules/__init__.py
  action: Create
  purpose: >-
    New plane-neutral leaf package for the ONE shared row-rule engine (Decision 210 cl.5, Decision 184 cl.2). Docstring
    only; defines and imports nothing.
- file: src/row_rules/rules.py
  action: Create
  purpose: >-
    src/telemetry/rules.py moved here with `git mv` (its 2a-1 plan's stated intent, PLAN-telemetry-write-conformance
    scope row: "rec-4158 can relocate it to a shared module unchanged"), then extended table-agnostically; still stdlib
    only, still no table, column or value literal of any contract. A None value passes every value rule (min_length,
    pattern, array_element_format, accepted_values): NULL is not_null's concern alone, exactly as the census's
    violation_condition treats it. New column keys: not_null (true; binds a nullable column), min_length (non-negative
    int; a non-None value violates when it is not a str or len(value.strip()) is below it), array_element_format (regex;
    a non-None value violates when it is not a list or any element is None, not a str, or fails re.fullmatch; an empty
    list passes), and exclude_before (mapping of a rule key present on that column, not_null
    included, to an ISO date; fail closed on an unknown key, a non-date, or a key naming a rule the column lacks).
    write_time_exemptions also accepts the two producer-side kinds acceptance_lint and array_element_reference,
    recorded per (column, kind) in their own mapping and never evaluated, so two columns may each exempt the same kind;
    content-leg exemptions keep today's table-wide keying; every other key stays fail-closed. check_row gains keyword-only `prior` (the existing
    row, or None for an insert): a rule on column c binds iff it is undated, or prior is None, or created_timestamp is
    at or after 00:00 UTC of its date, or the write changes c (row.get(c) != prior.get(c); a two-column rule binds when
    either column changed). Undated rules and telemetry calls (prior defaults to None) behave exactly as today.
    RowRuleError is unchanged (table, rule, column, never a value).
- file: src/telemetry/rules.py
  action: Delete
  purpose: Moved to src/row_rules/rules.py (git mv, so history follows).
- file: src/telemetry/append.py
  action: Modify
  purpose: >-
    Import RowRuleError, RowRules and check_row from src.row_rules.rules; the module docstring's reference to
    src/telemetry/rules.py is updated. No behaviour change.
- file: src/common/ducklake_write_rules.py
  action: Create
  purpose: >-
    The writer's adapter onto the engine (keeps src/common/ducklake_scd2_schema.py, 479/500 SLOC and being split by
    telemetry 2a-2 plan 1, untouched). RowRuleViolationError(SchemaGateError) carrying table, rule, column and the
    rule's exclude_before (never a value), raised from the engine's RowRuleError. rules_for(spec) builds RowRules from
    spec.fields with RowRules.from_projection (None for the smoke pair, table None). existing_row_select(spec, rules,
    include_status) returns (sql, columns): created_timestamp, status when the table has a status DAG, and -- only when
    the rules carry a dated leg -- every column a dated rule reads (the only prior values the changed-column test
    needs), else exactly today's created_timestamp[, status] select; one statement either way (Decision 88). check_write(spec, rules, record, created_timestamp, last_updated_timestamp, ulid, prior) evaluates
    the bound row (every input column from the record, absent = None, plus the minted ulid, created_timestamp and
    last_updated_timestamp). Pure and I/O-free.
- file: src/common/ducklake_writes.py
  action: Modify
  purpose: >-
    write_scd2: the existing-row fetch uses existing_row_select and maps the row to a dict by column (strict length),
    reading created_timestamp and status from it; check_write runs inside the transaction after the referential and
    status-DAG checks and before _write_params/any MERGE, with prior = that row (None on insert); append_only tables
    evaluate with prior None. file_scd2: check_write runs before BEGIN beside the existing schema_gate call, on the
    same placeholder-keyed copy, prior None, created = identity.timestamp, so a reject touches no counter.
    RowRuleViolationError joins write_scd2's terminal tuple (rolled back, never OCC-retried); in file_scd2 it raises
    before the loop. Inserts are bound by every rule, created_override included (the recorded rule).
- file: src/common/ducklake_runtime.py
  action: Modify
  purpose: Re-export RowRuleViolationError on the facade beside SchemaGateError (one import line).
- file: src/lambdas/ducklake_writer/handler.py
  action: Modify
  purpose: >-
    An `except rt.RowRuleViolationError` clause placed before `except rt.SchemaGateError` returns 422 {ok: false,
    error_type: row_rule, table, rule, column, exclude_before, error}; the existing 422 schema_gate mapping is
    unchanged.
- file: scripts/field_semantics_rule_projection.py
  action: Create
  purpose: >-
    project_row_rules(table_id, columns) -> columns: merges every rule scripts.contract_rules.declared_rules returns
    for an SCD2 contract table into its projected columns (the census compiles the same list, so writer and census
    share one rule set by construction). Mapping: not_null -> not_null: true (omitted on a nullable:false column,
    which already binds every row; a DATED not_null leg on a nullable:false column raises, since dropping the key would
    silently drop its date); accepted_values -> the values list; min_length -> its int; pattern -> its regex;
    array_element_format -> its pattern; not_before -> the column name; a dated leg also writes exclude_before[kind];
    a leg with an exemption ships only as write_time_exemptions[kind] {class, reason, owner}. Any other kind raises
    (fail closed). The enforced flag never reaches the projection (plan C).
- file: scripts/schema_to_field_semantics.py
  action: Modify
  purpose: >-
