rollback: >-
  Revert the squash commit: the governed workflow redeploys the prior code and projection on the revert's merge. Rejected
  writes wrote nothing and accepted writes are ordinary rows, so no data needs repair; the title DDL flip only ever
  applied to tables created after it. If the deploy itself is red, the workflow's own gates stop the serving deploy
  before writer/reader change (maintenance ships first).
