    e=lambda s,d:{'tests':[{'expression':{'sql':s,'description':d,'enforced':True}}]};
    cols={x:e(f\"COALESCE({x}, 'x') <> ''\",f'{x} stores an empty string') for x in c};
    cols.update({x:e(f'COALESCE(len(list_filter({x}, v -> v IS NULL)), 0) = 0',f'{x} holds a NULL element') for x in ('tags','dependencies')});
