- rec-4171
infrastructure_dependencies:
- >-
  Lambda-packaged: all five active DuckLake artifacts (writer, reader, maintenance, maintenance-smoke, catalog-dr)
  bundle ducklake_writes.py and the new engine files, and config/lambda/ducklake/field_semantics.yaml changes, so
  compute_affected_artifacts names all five. Deploy class terraform_personal_filemd5_coupled -> the governed
  deploy-ducklake-lambdas.yml channel, triggered by the implementation PR's squash-merge (Decision 125/126); the local
  build_lambda --ducklake-only --deploy stays break-glass only. Merging is therefore a production deploy and waits for
  the operator's explicit approval. No .tf, IAM, role, Function URL or environment change.
- >-
  data-pipeline (active) is ALSO reported affected, by its own manifest.yaml edit only (lambda_manifest's
  manifest-changed clause): the edit adds excludes for paths that are new in this plan, so its staged runtime code is
  byte-identical and only the inert manifest text inside its src/ copy differs. NO deploy is performed or needed:
  deploy-prod-lambdas.yml's push paths do not include the manifest, nothing reads it at runtime, and it refreshes with
  that artifact's next governed deploy (Decision 198 precedent, as PLAN-ops-rule-source did for its roadmap asset). VP
  step 6's wiring test asserts that an engine or adapter edit never marks data-pipeline affected.
acceptance_criteria:
- >-
  The writer rejects, with 422 row_rule naming table, rule and column and writing nothing, every non-exempt rule the
  ops_recommendations contract declares, under the older-rows rule; a real local DuckLake catalog shows zero rows and an
  unchanged counter after each rejection, and an older row with a pre-date violation stays updatable, including through
  the portal's update shaping (no older row stores an empty string or a NULL list element in a ruled column).
- >-
  One engine: src/row_rules/rules.py serves the telemetry kernel and the ops writer; the telemetry tests pass unmodified
  apart from the moved rules test; the rules reach the Lambda only through the regenerated field_semantics.yaml, whose
  other tables are byte-identical.
- The census SQL and the shipped engine agree row-for-row on DuckDB; the live census exits 0 immediately before the merge.
- >-
  validate_ops_rule_source fails a PR that removes a source registry id, and malformed rule legs produce FAIL lines
  (rec-4168).
- >-
  After the governed deploy, all five deploy records are fresh, the workflow run for the merge commit is green
  including its --lambda-row-rules step (recorded in the post-merge execution step), --lambda-row-rules passes locally,
  the read-your-write probe passes, the census still exits 0, and there is no gross latency regression (post-deploy
  CommitLatencyMs p50 at or below the prior 7-day p95).
- rec-4168 is closed by the Resolves trailer; rec-4158 carries a dated PLAN B DELIVERED note and stays open for plan C.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The shared engine's new kinds, dates, changed-column leg, exemptions and leaf boundary.
  command: >-
    bin/venv-python -m pytest tests/row_rules/test_rules.py::test_min_length_and_element_format_reject
    tests/row_rules/test_rules.py::test_exclude_before_binds_from_utc_midnight
    tests/row_rules/test_rules.py::test_changed_column_binds_older_rows
    tests/row_rules/test_rules.py::test_producer_side_exemptions_are_recorded_not_evaluated
    tests/row_rules/test_rules.py::test_unknown_keys_and_bad_dates_fail_closed
    tests/row_rules/test_rules.py::test_package_is_a_stdlib_leaf -q
  expected: Exit 0, 6 passed. Red before, because the package and its tests do not exist.
  fix_if: A telemetry behaviour change -> restore it; never loosen a test.
  hermetic: true
  graduation: graduate
  graduation_check_id: ops-row-rules-engine
  expected_literals: []
- step: 2
  phase: pre-deploy
  action: The projection carries exactly the declared non-exempt rules, and nothing else moves.
  command: >-
    bin/venv-python -m pytest tests/test_field_semantics_rule_projection.py::test_projects_every_declared_rule_once
    tests/test_field_semantics_rule_projection.py::test_exemptions_and_unknown_kinds
