      merge_checks.PERSONA_CLASSES key each fail with the reason naming fixture_kind. merge_checks is imported inside
      the check's existing try (line 400), so an ImportError is a reported failure, never an import-time raise.
      Docstring states the fixture rule and that _persona_llm_signatures.compute_plane_ids treats fixture as it treats
      verdict (an Actions job may start it, rec-5550). Stays under 500 SLOC.
  - file: tests/persona_contracts/fixture_tree.py
    action: Modify
    purpose: >-
      Mutators (each with its expectation substring): fixture_repo_target (a fixture contract naming a repo-target
      capability), fixture_without_tether, fixture_without_rule, fixture_over_budget, fixture_unlisted (a fixture row
      not in fixture_kind.personas), fixture_rekinds_verdict_persona (the fixture row is named code_reviewer, a
      PERSONA_CLASSES key), fixture_listed_without_row and unknown_kind. The mutator and expectation maps stay exactly equal
      (test_mutators_and_expectations_cover_the_same_rules), never loosened. build_tree resets the copied index's
      fixture_kind.personas to [] (the real canary_persona would otherwise dangle in every tmp tree) and gains a
      base-kind argument (verdict or fixture) that sets the fixture row's kind and lists it.
  - file: tests/checks/contracts/test_validate_persona_contracts.py
    action: Modify
    purpose: >-
      test_red_rule is parametrized over both base kinds (verdict, fixture), so every mutator, old and new, fails on a
      fixture tree exactly as on a verdict tree, and a future kind branch that skips fixture goes red; adds
      test_fixture_contract_passes_every_verdict_rule (the fixture base tree is green, so the kind adds no rule).
  - file: .claude/skills/canary-persona/SKILL.md
    action: Create
    purpose: >-
      The in-session twin the tether requires: frontmatter name canary-persona and a description that starts "Use only
      when testing persona or agent machinery (fixture runs, dual-run or flip drills); never for a real review." The
      body states the BLOCKING:/NIT:/injection task and holds verdict_line and verdict_rule byte for byte.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      S4 gains .claude/skills/canary-persona/SKILL.md at exactly its measured bytes with the inline marker
      "# raise-approved: dec-229 canary-persona skill tether twin (Decision 229 cl.1)": validate_prose_budget_raises
      treats any new S4 key as a registration that needs a marker naming a Decision whose body names the key or an
      ancestor; it passes as an ancestor match on .claude/skills, which Decision 229's body contains (any .claude/skills/* key
      would pass the same way). The operator's approval of this plan is the endorsement
      of that marker (Decision 165); the builder never picks another Decision.
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      Entry canonical_id canary-persona (description: the canary_persona machinery fixture; signal_interpretation:
      telemetry_agents.agent_type of a canary_persona run, a machinery test and never a review; a rec with this source
      is a machinery defect a canary run found), added_date 2026-11-23.
  - file: docs/contracts/inference-provider.yaml
    action: Modify
    purpose: >-
      litellm_persona_selection.personas gains canary_persona (primary and warm_fetched_escape_hatch: thinking enabled,
      effort high, as the verdict personas), appended last; the block's header comment and note say each verdict or
      fixture persona; one terse amendment_log entry. tests/test_llm_litellm_transport.py:228-232 picks the last
      persona, so it now exercises canary_persona (harmless). NEAR_CAP (486 of 500
