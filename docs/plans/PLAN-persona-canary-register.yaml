acceptance_criteria:
  - The index has a fixture kind whose stated purpose is machinery testing, and canary_persona is its one registered persona.
  - A fixture contract fails every verdict-persona rule a verdict contract fails; a fixture row outside fixture_kind.personas, a fixture row named for a merge-gate persona, and an unknown kind each fail validate_persona_contracts.
  - canary_persona has no gates row and no PERSONA_CLASSES entry, and route.bound_personas excludes it even when implemented.
  - Its contract loads in the litellm backend and resolves a selection in both roles; the rendered prompt equals a fresh render.
  - rec-5553 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the acceptance file, the contract-check tests and the gate and route tests.
    command: >-
      bin/venv-python -m pytest tests/persona_contracts/test_canary_persona.py tests/checks/contracts/test_validate_persona_contracts.py
      tests/checks/contracts/test_gate_verdict_source_rows.py tests/test_session_merge_checks.py tests/personas/test_route.py
      tests/telemetry/test_definition_sha256_required.py tests/checks/contracts/test_persona_run_identity_contract.py -q
    expected: All pass; the summary reads passed with no failed or error.
    fix_if: >-
      A pinned set that lists the personas rows is extended with canary_persona and kept exact (Decision 181), never
      loosened to a floor.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Default-collected files that every full tier already runs; a registry row would duplicate them.
  - step: 2
    phase: pre-deploy
    action: The render check, the field-semantics drift gate and the registered checks accept the new persona.
    command: >-
      bin/venv-python -m scripts.persona_contracts.render --check && bin/venv-python -m scripts.schema_to_field_semantics --check &&
      bin/venv-python -c "from scripts.checks.contracts.validate_persona_contracts import validate_persona_contracts as a;from scripts.checks.contracts.validate_persona_contract_binding import validate_persona_contract_binding as b;from scripts.checks.contracts.validate_project_configuration import validate_project_configuration as c;from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as d;from scripts.checks.contracts.validate_inference_provider_registry import validate_inference_provider_registry as e;from scripts.checks.structural.size_limits import validate_structural_size_limits as h;from scripts.checks.prose.prose_budget_raises import validate_prose_budget_raises as i;from scripts.checks.prose.prose_limits import validate_prose_limits as j;from scripts.checks.contracts.validate_ops_rule_source import validate_ops_rule_source as k;f=[];[g(f) for g in (a,b,c,d,e,h,i,j,k)];assert not f,f"
    expected: The render line reads RENDER-CHECK OK, the drift gate exits 0, and the last command exits 0 with no AssertionError.
    fix_if: A drift failure naming the sub-tree means the row's contract or rendered_prompt path is not byte-exact.
    hermetic: true
    expected_literals: [RENDER-CHECK OK]
    graduation: waive
    graduation_waiver_reason: The render check, the drift gate and all nine checks are registered and run in every tier already.
  - step: 3
    phase: pre-deploy
    action: Full tier then HEAD attestation, after the build commit and rebase and before the push; started backgrounded from the top-level session with a 2 h limit (tests/test_aws_profile.py needs HOME as an empty dir).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The full tier exits 0 and --verify-head confirms the attestation names HEAD.
    fix_if: A failing check is fixed on the branch; a timeout is BLOCKED, never a push.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole-suite run, not a guard.
  - step: 4
    phase: post-deploy
    action: >-
      The governed deploy that first ships a commit at or after the merge is green, the telemetry functions included.
      Read with mcp__github__actions_list (list_workflow_runs, workflow deploy-ducklake-lambdas.yml; the run whose gate
      job names a sha at or after $MERGE_SHA) then list_workflow_jobs, written to $DEPLOY_JOBS_JSON, and the
      telemetry-smoke job log (mcp__github__get_job_logs) to $TSMOKE_LOG_FILE.
    command: >-
      test -s "$DEPLOY_JOBS_JSON" && test -s "$TSMOKE_LOG_FILE" && bin/venv-python -c "import
      json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));jobs={x['name']:x.get('conclusion') for x in
      (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','deploy-telemetry-twin','telemetry-twin-smoke','smoke','deploy-telemetry','telemetry-smoke'];assert
      all(jobs.get(w)=='success' for w in want),jobs" && grep -q TELEMETRY_PROVISION_OK "$TSMOKE_LOG_FILE"
    expected: The nine named jobs concluded success and the telemetry-smoke log holds TELEMETRY_PROVISION_OK; exit 0.
    fix_if: >-
      A red job -- read its log first; STOP and RCA (Decision 55). No run yet because main is red (Decision 249 cl.3):
      wait for the next green full tier. The deploy is the governed channel; never an ungated dispatch or break-glass.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: >-
      The content reader's leg (Decision 79, Decision 272 residual, rec-5333). After VP 4, dispatch
      deploy-telemetry-content.yml from main with force true (mcp__github__actions_run_trigger), tell the operator in the
      thread that its deploy job waits on the telemetry-content-deploy Environment, and once it completes write the run's
      jobs (list_workflow_jobs) to $CONTENT_JOBS_JSON.
    command: >-
      test -s "$CONTENT_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['CONTENT_JOBS_JSON']));
      jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
      assert all(jobs.get(w)=='success' for w in ['gate / gate','build','deploy','record']),jobs"
    expected: The gate / gate, build, deploy and record jobs concluded success; exit 0.
    fix_if: >-
      If the operator declines or defers the approval, record it in the report with the run link as a deferral: the
      content reader never validates agent_type or rec source at write, so no canary run waits on it (Decision 272's
      accepted residual). A held run (build output held true) or a skipped deploy job is also a deferral, recorded
      with the run link. If the session identity's workflow_dispatch is refused, record a deferral and ask the
      operator to dispatch it. Never break-glass (Decision 270 cl.3).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: '[post-deploy] rec-5553 closed by the merge commit Resolves: trailer.'
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as rc;rows,m=rc.fetch_recs_by_ids(rc.make_reader(profile='agent_platform'),['rec-5553']);print(rows[0]['id'],rows[0]['status'])"
    expected: The line reads rec-5553 closed.
    fix_if: Still open after the closure job ran; read the trailer-acceptance verdict artifact for the node id.
    hermetic: false
    graduation: not-applicable
