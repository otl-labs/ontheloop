  - The DuckLake functions ship only through the governed deploy-ducklake-lambdas run (Decision 126); never scripts.build_lambda --deploy.
  - No change to scripts/session/merge_checks.py, project-configuration.yaml gates rows, route.py, override.py, the merge gate hook or any workflow.
  - The implementation row stays pending; no module under scripts/personas/ or src/persona_backends/ names canary_persona (implementation_binding), so running it on Actions waits for rec-5550.
  - tests/fixtures/persona_backends/fixture_persona.yaml and the turn-capture goldens are untouched.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Operator 2026-11-23 22:25 UTC: register a fake persona so persona machinery changes can be tested first, mirroring exact persona behaviour; 22:27 UTC chose this split (rec-5553 before rec-5548); 22:39 UTC chose a new fixture kind: be explicit about what it is for and that it is not a backdoor to remove guards from other personas."
  - "Why a new kind and not a verdict row: a verdict row needs a gates row (rule (l)), and merge_checks.verdict_sources refuses a gates row whose persona has no PERSONA_CLASSES entry; the merge gate imports the working tree's merge_checks but reads gates rows from origin/main, so a new verdict persona would leave every older branch UNAVAILABLE at the gate (Decision 264). The fixture kind touches no gate surface."
  - "Why a real row: docs/contracts/personas/ is a closed declared sub-tree (executor-personas.yaml declared_subtree; contract-population.yaml declared_subtrees), so a contract there needs an index row."
  - "This PR changes persona image inputs; the publish run is read by rec-5548's handoff for the pin PR, not here (docs/contracts/personas/, inference-provider.yaml), so pr-validate runs the conformance suite and the merge triggers the image channel rebuild; rec-5548 uses the rebuilt image after the operator merges the pin PR."
  - "Decision 205: rec-5550 confirms the canary's Actions run is keyless and eligible before it runs there; this plan adds no job."
  - "LAMBDA-DEPLOY (Decisions 79, 125, 126, 249): field_semantics.yaml ships in seven active artifacts. Six redeploy on the governed deploy-ducklake-lambdas run after main's full tier passes (VP 4; a red main pauses it). The seventh, ducklake_telemetry_content_reader, deploys only through the operator-approved deploy-telemetry-content channel (Decision 272, residual rec-5333): VP 5 asks the operator. No Terraform, no IAM change."
  - "For rec-5550: the change that meets T4.32 c3 re-points canary_persona's owning_item and budget.provisional.until in the same commit, or the binding and provisional checks fail. closes_criteria stays [] here (partial-leg precedent: PLAN-inference-tier-selection, PLAN-scout-input-fingerprint)."
