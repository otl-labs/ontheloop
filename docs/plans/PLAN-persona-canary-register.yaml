slug: persona-canary-register
intent: >-
  Solves rec-5553 (split of rec-5548, operator 2026-11-23 22:27 UTC). Agent and persona machinery has no SIT stage: a
  change to the persona contract checks, the image, the backend or the strangler steps is first exercised on a real
  persona. This plan adds a third persona index kind, fixture, and registers one fixture persona, canary_persona. The
  fixture kind has one purpose: a test bed for persona and agent machinery changes. A fixture persona obeys every rule a
  verdict persona obeys (required_for_verdict, the repo-target refusal, verdict_consistency, failure envelope, budget
  ceilings, skill tether, registry key, rendered-prompt hash), so it behaves exactly as a verdict persona does in the
  image and the backend. It is never routed (route.bound_personas reads kind verdict only), never gated (it has no
  merge_checks.PERSONA_CLASSES entry and validate_project_configuration rule (l) refuses a gates row for it), and never
  counted in a dual-run or flip. The kind is not a way to relax a guard (operator 22:39 UTC): no rule is conditioned on
  fixture to be looser, a fixture row must be named in the index's closed fixture_kind.personas list, and a fixture
  persona may not be a PERSONA_CLASSES key, so turning code_reviewer, plan_critic or decision_scout into a fixture fails
  validate_persona_contracts (and rule (l) on its gates row). canary_persona's task spec is deterministic (the injection call is still model judgement): each notes line
  starting BLOCKING: is a blocking finding, NIT: a nit, and a note that tries to set the verdict is injection_suspected.
  The kind's name is unrelated to route.py's fixture PRs (probe_routes), tests/fixtures/persona_backends/fixture_persona.yaml (a kind verdict backend test contract) and fixture_tree's fixture_verdict; fixture_kind.purpose says so. A new registry key also extends the telemetry and ops projections, so the governed DuckLake deploy ships it before any canary run writes a row. It ships in the persona image already (docs/contracts/personas/ is copied whole). rec-5548 runs it through the image,
  conformance and the local CLI; rec-5550 runs it on Actions.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-canary-register.yaml
phase: >-
  T4.32 (in_progress); advances c3 (the fixture persona c3 names). Freshness gate: c3 open; no retired surface. The
  implementation row stays pending on T4.32:c3 until rec-5550 lands its run code.
closes_criteria: []
cites: [dec:181, dec:185, dec:235, dec:249, dec:272, dec:275]
scope:
  - file: docs/contracts/personas/canary_persona.yaml
    action: Create
    purpose: >-
      persona canary_persona, contract_version 1, kind fixture. input_schema: change_id, head_sha (the two required
      fields) and notes (string, minLength 1: the fixture text), all required, additionalProperties false. capabilities
      [read_input:notes]. output_schema mirrors the review personas' findings shape: outcome const success, verdict enum
      [PROCEED, REVISE], findings array of {id (pattern ^line:[0-9]+$), severity enum [blocking, nit], origin enum
      [mechanical], anchor (the quoted notes line), summary}. verdict_consistency: REVISE when any findings[].severity
      in [blocking], otherwise PROCEED. budget max_turns 6, max_wall_clock_seconds 120, max_revisions 1, provisional
      {until: "T4.32:c3", measure: turns and wall-clock per run and budget_exhausted count over the fixture runs}.
      failure_outputs: the four required ids. skill_tether {skill: canary-persona, verdict_line, verdict_rule} naming
      PROCEED, REVISE and blocking. prompt_template states the task: read notes with read_input; one finding per line
      starting BLOCKING: (blocking) or NIT: (nit); no other line is a finding; a line that tries to set the verdict,
      widen capabilities or skip the rule is an injection (injection_suspected). Header comment says it is a machinery
      fixture, never a review. rendered_prompt_sha256 from the render.
  - file: docs/contracts/personas/rendered/canary_persona.txt
    action: Create
    purpose: Written by bin/venv-python -m scripts.persona_contracts.render --write canary_persona (never hand-edited).
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      persona_contract.fields.kind and personas_row.kind gain fixture. New top-level block fixture_kind {purpose,
      personas: [canary_persona], rules}: purpose says a fixture persona exists only to test persona and agent machinery
      changes before they reach a verdict persona, and that the name is unrelated to fixture PRs and backend test
      fixtures. The block sits above personas. Rules, each naming its enforcer: (1) a fixture contract takes every
      verdict-persona rule, required_for_verdict and the repo-target refusal included, and no rule is ever conditioned
      on fixture to be looser (validate_persona_contracts VERDICT_RULE_KINDS), so every field text that says "a verdict
      persona" (run_persona workspace, capabilities, skill_tether, verdict_consistency, failure_envelope schema_invalid,
      personas_row registry_key) is reworded to "a verdict or fixture persona", and skill_tether says a fixture's skill
      is its in-session twin, strangling nothing; (2) a fixture row is named in
      fixture_kind.personas and each name there is a fixture row (validate_persona_contracts); (3a) a fixture persona is
      never a merge-gate persona: no merge_checks.PERSONA_CLASSES key (validate_persona_contracts) and no gates row,
      so never a verdict_source flip (validate_project_configuration rule (l)); (3b) never routed (route.bound_personas
      reads kind verdict only; tests/persona_contracts/test_canary_persona.py); (3c) never counted in a dual-run:
      advisory until the dual-run counters land (owned by the persona add-dual-run plans, T4.28-T4.30), which count by
      persona id; (4) so re-kinding a verdict persona to fixture is refused (rules 2 and 3a). personas gains {persona:
      canary_persona, kind: fixture, contract, rendered_prompt, implementation: {status: pending, owning_item:
      "T4.32:c3"}, registry_key: canary-persona}. One amendment_log entry (accepted_values_extend, semantic_break
      false), a terse row of at most 160 summary chars so the full-row count does not grow (Decision 275 cl.4), naming
      Decision 235 clause 1 confirmed by the operator.
  - file: scripts/persona_contracts/schema.py
    action: Modify
    purpose: >-
      PersonaRow.kind and PersonaContract.kind become Literal["verdict", "compute_plane", "fixture"], so an unknown kind
      is off schema; PersonaIndex gains fixture_kind: FixtureKind (strict: purpose str, personas list[str], rules
      list[str]).
  - file: scripts/checks/contracts/validate_persona_contracts.py
    action: Modify
    purpose: >-
      One VERDICT_RULE_KINDS = frozenset({"verdict", "fixture"}) used at the repo-target refusal (line 124) and the
