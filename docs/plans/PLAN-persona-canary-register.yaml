  - "Decision 235 clause 1: validate_persona_contracts is a floor check (it guards Decision 117 boundary paths). The fixture kind is an accepted_values_extend of a closed set that weakens no rule; the operator confirmed it at 2026-11-23 22:39 UTC. Precedent: contract-population.yaml's 2026-11-09 declared-sub-tree row."
