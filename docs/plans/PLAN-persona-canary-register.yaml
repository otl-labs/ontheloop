pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - schema.py kind Literal and FixtureKind; executor-personas.yaml kind text, fixture_kind block and amendment entry.
  - validate_persona_contracts.py VERDICT_RULE_KINDS and _fixture_failures; fixture_tree.py mutators and expectations; test_validate_persona_contracts.py new test.
  - The personas row, then canary_persona.yaml, then render --write canary_persona for the rendered prompt and its hash (render refuses a persona with no row); source_registry.yaml entry.
  - .claude/skills/canary-persona/SKILL.md and its prose_budgets.yaml S4 row.
  - inference-provider.yaml selection row and entry; telemetry_agents.yaml required_when, field-level census row and byte relief; test_definition_sha256_required.py KEYS; regenerate field_semantics.yaml.
  - tests/persona_contracts/test_canary_persona.py; extend any exact pinned persona set the new row breaks, keeping it exact.
  - Execute Verification Plan -- run each step; loop until pass (Decision 55)
  - 'Report: what was implemented, verification results'
rollback: Revert the squash commit; the kind, its rules, the row, contract, skill and selection row go together, and the next governed deploy ships the reverted projection.
