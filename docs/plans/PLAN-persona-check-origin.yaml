schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-check-origin"
intent: >-
  Make the merge gate's persona leg unforgeable (rec-5241): a persona-verdict/<persona> check counts only when the
  dedicated verdict GitHub App posted it, the App whose numeric id a new gates.verdict_app.app_id row names on
  origin/main, so a same-named run that any branch workflow posts as github-actions no longer satisfies an actions
  row. Gate side only, under a new Decision amending Decisions 264 and 205; the App, its key and the post job's token
  mint land in PLAN-persona-verdict-egress. Serves NS.9: an agent cannot pass a merge gate with a check it posted.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-check-origin.yaml
phase: >-
  T4.32 (persona foundation): hardening of the met c5 persona leg (rec-5241, High), and the verdict identity half of
  c1 (T4.2 c9, amended here: on Actions too the verdict identity is the dedicated verdict App). Lands before any
  gates.<persona>.verdict_source row reads actions; closes no criterion.
cites: [dec:177, dec:205, dec:212, dec:224, dec:264, dec:267]
fallback_reevaluation:
  reevaluated_on: "2026-11-17"
  substrate_status: CD.27 pending; executor substrate unratified; T4.2 not built; the T4.15 spike has not run.
  verdict: continue_on_current_substrate
  basis: >-
    T4.2 c9 is touched only by a dated amendment naming the verdict identity, and the code is the merge gate's
    PreToolUse hook and its pure predicate, which read the same under every candidate layer-2 substrate and touch no
    CD.27, fallback_spec or T4.15 ruling (the PLAN-persona-verdict-chain disposition).
scope:
  - file: scripts/session/merge_checks.py
    action: Modify
    purpose: >-
      Four pure additions beside the persona functions (no I/O, no pull request number; Decision 234 cl.4).
      (1) VERDICT_APP_ROW = "gates.verdict_app.app_id" and verdict_app_id(config_text) -> int | None | str: the row's
      value from a project-configuration.yaml text, read like verdict_sources (settings[].id, defaults only); no such
      row -> None; null in both defaults -> None; a positive int (never a bool) equal in defaults.local and
      defaults.cloud -> that int; otherwise a reason string (unparseable text, no settings list, the row appearing
      more than once, local differing from cloud, a value that is not a positive integer or null). (2) verdict()
      gains a keyword pins: Mapping[str, int | None] | None = None. A name in pins is judged only over runs whose
      app.id equals its pin (an int, never a bool; a run with no app object or no int id never matches); its pin None
      -> the reason "<name> has no verdict App: gates.verdict_app.app_id is empty on origin/main"; no matching run ->
      "<name> has no run by the verdict App (app id <pin>)"; otherwise the newest matching run under the existing
      _state rule. A name not in pins keeps the github-actions slug rule unchanged. Runs of the same name by any other
      app are ignored, never a refusal on their own (Decision {{N}} cl.2). (3) app_id_changed(base, head) -> bool
      for two verdict_app_id ints-or-None. (4) persona_pins(names, app) -> dict[str, int | None]: every name in names
      equal to persona_check_name(p) for p in PERSONA_CLASSES maps to app, whatever its row reads, so a persona check
      the ruleset itself requires is pinned too (Decision {{N}} cl.1 covers every check named persona-verdict/<persona>);
      other names are left out. Stays under 500 SLOC.
    new_imports: []
  - file: .claude/hooks/merge_gate.py
    action: Modify
    purpose: >-
      The persona leg (Decision {{N}} cl.1 and cl.3), on merge_pull_request and enable_pr_auto_merge alike, inside the
      existing 40 s deadline and with no new git or GitHub read. A new _persona_leg_app(root, head, merge_base, dl)
      returns (extra, app, refusal) and holds today's leg body; _persona_leg keeps its signature and return
      (extra, refusal) by delegating to it, so tests/hooks/test_merge_gate_deadline.py stays unedited and still covers
      every read the leg makes. app is merge_checks.verdict_app_id of origin/main's config text (the git show the leg
      already does): an int, None, or a reason string. When the PR's changed files include
      docs/contracts/project-configuration.yaml (the existing merge-base and head reads), in this order after the
      existing gates-row reads: the existing switch-back refusal first (Decision 264 cl.5, message unchanged); then a
      head app row that does not read -> exit 2 "merge-gate: verdict-source: REFUSE: the PR head's
      gates.verdict_app.app_id does not read: <reason>"; a merge-base app row that does not read -> exit 2
      "merge-gate: verdict-source: UNAVAILABLE: gates.verdict_app.app_id on the merge base does not read: <reason>;
      retry later, or the operator merges in the GitHub UI"; app_id_changed(merge base, head) -> exit 2 "merge-gate:
      verdict-source: REFUSE: this PR changes gates.verdict_app.app_id; the operator merges it in the GitHub UI
      (Decision {{N}} cl.3)". _judge calls _persona_leg_app and passes app to _checks_denial and _checks_verdict
      (keyword app, default None). _checks_verdict, once the required set (with extra) is read and is not None, takes
      pins = merge_checks.persona_pins(required | extra, app) for an int or None app and passes pins to
      merge_checks.verdict (a None required set keeps today's UNAVAILABLE path, with no pins computed);
      when app is a reason string and persona_pins of that set is not empty -> UNAVAILABLE "gates.verdict_app.app_id on
      origin/main does not read: <reason>" (exit 2 through the existing UNAVAILABLE message); with no persona-named
      check required or added the row is not judged. read_checks_verdict keeps its signature (no app keyword: no
      caller needs it). _persona_leg gains a one-line docstring saying it stays for the deadline suite's unedited
      asserts (Decision 235). The module docstring names the pin. No override, no new endpoint. Stays under 500 SLOC.
  - file: scripts/checks/contracts/validate_project_configuration.py
    action: Modify
    purpose: >-
      New rule (m) in the docstring and a finding function wired into _rule_findings: exactly one
      gates.verdict_app.app_id row, kind project, variable null, defaults.local equal to defaults.cloud, each null or
      a positive integer (never a bool); a missing row, a second row and each bad shape is a finding naming the row.
      Does not import scripts.session.merge_checks (rule (l)'s precedent). Stays under 500 SLOC.
    new_imports: []
  - file: tests/checks/contracts/test_validate_project_configuration.py
    action: Modify
    purpose: >-
      New node test_rule_m_rejects_a_bad_verdict_app_row, parametrised over one red fixture per rule (m) finding
      (missing row, a kind other than project, variable set, local differing from cloud, a string value, a bool value,
      zero, a negative value) through
      validate_project_configuration(failed, root=tmp), and test_real_contract_passes_rule_m. A second
      gates.verdict_app.app_id row has no rule (m) fixture: ProjectConfigurationBody's unique-id check rejects it
      before the rules run (test_rejects_duplicate_setting_ids covers it). Existing nodes unchanged.
  - file: tests/checks/contracts/test_gate_verdict_source_rows.py
    action: Modify
    purpose: >-
      New nodes only. test_verdict_app_row_reads_null_and_pins_persona_checks: the real file's gates.verdict_app.app_id reads None through merge_checks.verdict_app_id; a copy
      with code_reviewer at actions and the row null makes merge_checks.verdict refuse a green github-actions
      persona-verdict/code_reviewer run naming "has no verdict App". test_verdict_app_text_is_placed: growth-safe phrase pins for the placed text
      (ports.yaml PC-10 names gates.verdict_app.app_id and keeps status open and owning_item T4.2:c9;
      coordinator.yaml lifecycle.verdict_source names the verdict GitHub App; T4.2 c9 carries the
      PLAN-persona-check-origin amendment; Decision 264 and Decision 205 carry their Decision {{N}} notes). Existing
      nodes and asserts unchanged.
  - file: tests/test_session_merge_checks.py
    action: Modify
    purpose: >-
      New nodes test_verdict_app_id_reads_the_row, test_verdict_app_id_reasons (parametrised),
      test_pinned_name_counts_only_the_app (parametrised), test_app_id_changed (parametrised) and
      test_persona_pins_cover_every_persona_name (parametrised): verdict_app_id for no row, null, an int, each reason (unparseable, no settings list, duplicated row,
      local differing from cloud, a string, a bool, zero, a negative); verdict with pins: a pinned name passes on the
      App's success, refuses with no App run while a github-actions success of the same name exists (the forged run
      ignored), refuses with pin None, judges the newest App run when an older App run failed, ignores a run whose app
      id is a bool or missing; an unpinned name keeps the slug rule; app_id_changed for None to int, int to None, int
      to another int and no change; persona_pins maps each persona-verdict/<persona> name in the set to the app
      (int or None) and leaves out pr-validate, a misspelt persona name and a persona name with a suffix. Existing
      nodes unchanged.
  - file: tests/hooks/test_merge_gate_persona_check_origin.py
    action: Create
    purpose: >-
      rec-5241's acceptance file, through the shim as the harness runs it (GIT_ALLOW_PROTOCOL=file), on the
      persona-leg fixture with gates.code_reviewer.verdict_source at actions on main. Its acceptance node
      test_refuses_persona_check_from_another_workflow: main pins the verdict App, and a code PR whose head carries
      only a github-actions persona-verdict/code_reviewer run concluding success (the forged run) exits 2 naming
      persona-verdict/code_reviewer and "no run by the verdict App". Also: the same head with an added success run by
      the pinned App id exits 0 (the forged run beside it changes nothing); a failed App run under a forged
      github-actions success exits 2; an empty row on main with an actions row exits 2 naming "has no verdict App"; an
      unreadable row on main with an actions row exits 2 naming UNAVAILABLE, and with every row in_session exits 0;
      a PR changing the row from null to an id, from an id to another id and removing it each exit 2 naming the
      operator, on either tool, even with every check green; a PR leaving the row unchanged is never refused for it;
      a PR adding the gates rows with the row null to a main without rows exits 0 (this build's own merge); a
      working-tree edit of the row cannot turn a refusal into exit 0; with every row in_session and the ruleset
      itself requiring persona-verdict/code_reviewer (set_required), the forged github-actions run alone exits 2
      naming "no run by the verdict App" and an added App run exits 0; a PR returning a row to in_session that also
      changes the App row is refused naming the persona (the switch-back refusal is judged first). Module-scoped fixtures to protect the --pre
      budget. Red on main for every node that expects a refusal on a forged run or a row change.
  - file: tests/hooks/test_merge_gate_persona_leg.py
    action: Modify
    purpose: >-
      Fixture seeding only: _run's default app becomes the fixture's verdict App ({slug, id} with
      merge_overlap_repos.VERDICT_APP_ID) and _Case.set_main seeds that id on main whenever a row reads actions and
      records the id it writes in the Fixture's remembered app id (VERDICT_APP_ID when any row reads actions, else
      None, and None for rows=False), so branch_pr_switch never carries a stale id into a later node of the
      module-scoped fixture, and so
      every existing node keeps its assert lines and outcomes (the other-app case still refuses). A tightening: a
      github-actions run no longer satisfies a persona check.
  - file: tests/fixtures/merge_overlap_repos.py
    action: Modify
    purpose: >-
      VERDICT_APP_ID = 900001 (a fixture number, not a real App); config_text gains keyword app_id (default None),
      written as a gates.verdict_app.app_id row (id line and defaults line, null for None) whenever rows is true,
      placed between the first and second persona rows: lines[2] stays the first persona's defaults line and the
      last two lines stay the last persona row, so test_bad_rows_on_main_are_unavailable's missing, value and split
      edits keep hitting persona rows and keep their outcomes; the Fixture remembers main's
      app id (seed: None) so set_verdict_source and branch_pr_switch reproduce it and change only their own row; new
      helpers set_verdict_app(app_id) (advance main with the row changed) and branch_pr_app(number, app_id, name)
      (open a PR changing only the row). Existing helpers keep their signatures and outcomes.
  - file: tests/hooks/test_merge_gate_deadline.py
    action: Modify
    purpose: >-
      Expected untouched: _persona_leg keeps its (extra, refusal) return and _checks_verdict's new keyword has a
      default, so lines 135, 173-174 and 197-202 run unedited. Fixture seeding only if the injected git runner's
      config answer needs the app row; never an assert line (Decision 235). VP step 3 re-measures
      test_persona_leg_git_calls_stay_inside_the_deadline.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the sidecar's blocks decision-entry (the new Decision {{N}} at the top of the file), decision-264-note
      and decision-205-note (dated annotations, Decision 177: the bodies stay unchanged). {{N}} is the next free
      Decision number on the build's base and {{DATE}} the build date UTC; docs/decisions-index.json is
      generator-touched.
  - file: docs/contracts/project-configuration.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's blocks pc-header (the no-value exception names the new row), pc-amendment-log (a new
      amendment_log entry) and pc-row (gates.verdict_app.app_id after gates.plan_critic.verdict_source, defaults null).
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's blocks ports-pc-10 (PC-10 re-worded for the verdict App, still open for T4.2:c9, and
      re-flowed onto one line, the Decision 166 relief valve) and ports-amendment-log (a new amendment_log entry); net five fewer effective
      lines, measured at build against its base.
  - file: docs/contracts/coordinator.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's blocks co-verdict-source (lifecycle.verdict_source's actions lane is the persona's check
      run by the verdict GitHub App) and co-amendment-log (a new amendment_log entry); no contract_version change. The phrases
      test_gate_verdict_source_rows.py and test_coordinator_contract.py pin stay. After merge the shared copy is
      refreshed (step 10).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's block roadmap-t4-2-c9: a dated amendment on T4.2 c9 (the verdict identity on Actions is
      the verdict App). No status changes.
bundled_recommendations: [rec-5241]
followon_recs: [rec-5271]
closes_criteria: []
infrastructure_dependencies:
  - >-
    None. No .tf file is in scope and no AWS, GitHub App or Environment change is made: the App, its key in SSM
    /secret/, the reading role's grant and the post job's token mint are PLAN-persona-verdict-egress's (Decision {{N}}
    cl.4). compute_affected_artifacts(<scope>) names only data-pipeline through docs/ROADMAP-PLATFORM.yaml, which
    carries a dated criterion amendment only (the PLAN-gate-consumers-flag-aware disposition): no build, deploy or
    smoke step.
acceptance_criteria:
  - rec-5241's acceptance (tests/hooks/test_merge_gate_persona_check_origin.py::test_refuses_persona_check_from_another_workflow) exits 0, and fails on the build's base.
  - With gates.code_reviewer.verdict_source at actions, the gate counts persona-verdict/code_reviewer only from check runs by the App gates.verdict_app.app_id names on origin/main; a same-named github-actions success neither passes nor refuses on its own; the same holds for a persona check the ruleset itself requires while its row reads in_session; an empty, absent or unreadable row refuses only when a persona check is required or added.
  - An agent merge of a PR whose own change alters gates.verdict_app.app_id (adding, changing or removing it) is refused naming the operator; a PR that leaves it unchanged is never refused for it.
  - With every row in_session, the gate's verdict on every existing merge-gate suite is unchanged, and no new git or GitHub read is made.
  - validate_project_configuration rejects a missing or malformed gates.verdict_app.app_id row (rule (m)) and a duplicated one (rule (a)) and the real file passes with the row null.
  - The four contracts and the roadmap carry exactly the sidecar's blocks (approved_text verify exits 0); ports.yaml has fewer effective lines than its base.
  - After merge, rec-5241 reads closed and the coordinator's shared copy matches coordinator.yaml at the merge commit.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Premises on the build's base, before any edit.
    command: >-
      bin/venv-python -c "import pathlib, yaml; from scripts.session import merge_checks as m;
      pc=pathlib.Path('docs/contracts/project-configuration.yaml').read_text(encoding='utf-8');
      ports=pathlib.Path('docs/contracts/ports.yaml').read_text(encoding='utf-8');
      d=pathlib.Path('docs/DECISIONS.md').read_text(encoding='utf-8'); s=m.verdict_sources(pc);
      print('rows_in_session=' + str(isinstance(s, dict) and set(s.values()) == {'in_session'})
      + ' no_app_row=' + str('gates.verdict_app.app_id' not in pc) + ' no_pins=' + str('pins' not in pathlib.Path('scripts/session/merge_checks.py').read_text(encoding='utf-8'))
      + ' pc10_github_actions=' + str('created by the app github-actions on the exact head' in ports)
      + ' anchors=' + str(d.count('**Related:** Decisions 73, 76, 83, 89, 100, 163, 181, 203, 205, 212, 217, 224, 229, 234, 245, 246; T4.32;') == 1 and d.count('> **Amended by Decision 254 (2026-11-12):** Clause 5') == 1))"
    expected: >-
      One line: rows_in_session=True no_app_row=True no_pins=True pc10_github_actions=True anchors=True.
    fix_if: >-
      rows_in_session=False means a persona already flipped before this gate fix: stop and tell the plan owner (the
      flip must wait); any other False means a premise moved: stop and send a plan-defect report.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Red-before premise evidence that this build itself makes false; steps 2-4 are the standing guards.
  - step: 2
    phase: pre-deploy
    action: Run the predicate's unit tests.
    command: >-
      bin/venv-python -m pytest tests/test_session_merge_checks.py::test_verdict_app_id_reads_the_row
      tests/test_session_merge_checks.py::test_verdict_app_id_reasons tests/test_session_merge_checks.py::test_pinned_name_counts_only_the_app
      tests/test_session_merge_checks.py::test_app_id_changed tests/test_session_merge_checks.py::test_persona_pins_cover_every_persona_name -q
    expected: exit 0, all nodes pass; red before (the nodes and the functions they call are absent).
    fix_if: >-
      a forged github-actions run passes a pinned name, a bool or missing app id matches a pin, a malformed row reads
      as an id, or a persona name is left out of persona_pins
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: merge-checks-verdict-app-pin
  - step: 3
    phase: pre-deploy
    action: Run rec-5241's acceptance file and the persona-leg suites through the shim.
    command: >-
      bin/venv-python -m pytest tests/hooks/test_merge_gate_persona_check_origin.py
      tests/hooks/test_merge_gate_persona_leg.py tests/hooks/test_merge_gate_deadline.py -q
    expected: exit 0, all nodes pass; the acceptance node is red before (the gate allows a head whose only persona run is github-actions).
    fix_if: >-
      a forged run exits 0 (an added or a ruleset-required persona check), a row change exits 0 for an agent, an
      all-in_session main with no persona check required refuses for the row, or an existing persona-leg or deadline
      node changes outcome or needs an assert edit
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: merge-gate-persona-check-origin
  - step: 4
    phase: pre-deploy
    action: Run the registry rule (m) fixtures and the placed-text pins.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_project_configuration.py::test_rule_m_rejects_a_bad_verdict_app_row
      tests/checks/contracts/test_validate_project_configuration.py::test_real_contract_passes_rule_m
      tests/checks/contracts/test_gate_verdict_source_rows.py::test_verdict_app_row_reads_null_and_pins_persona_checks
      tests/checks/contracts/test_gate_verdict_source_rows.py::test_verdict_app_text_is_placed -q
    expected: exit 0, all nodes pass; red before (the nodes, rule (m), the row and the placed text absent).
    fix_if: a malformed row passes rule (m), the real file fails it, or a placed phrase is missing
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: verdict-app-row
  - step: 5
    phase: pre-deploy
    action: Existing merge-gate suites and contract tests stay green with no assert line changed.
    command: >-
      bin/venv-python -m pytest tests/hooks/test_merge_gate.py tests/hooks/test_merge_gate_shim.py
      tests/hooks/test_merge_requires_green_checks.py tests/test_session_merge_overlap.py
      tests/checks/contracts/test_coordinator_contract.py tests/checks/contracts/test_coordinator_harness_profile.py
      tests/roadmap/test_verdict_persona_criteria.py tests/hooks/test_plugin_hooks.py -q
    expected: exit 0
    fix_if: >-
      an allow-path node fails for the seeded row (fix the fixture, never an assert line); validate_weakening_candidates
      listing a candidate is a plan-defect report, never a disposition
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Existing standing guards already graduated or selected by --pre for these files.
  - step: 6
    phase: pre-deploy
    action: Bind the Decision, contract and roadmap edits to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-check-origin --base origin/main
    expected: exit 0; all eleven blocks match
    fix_if: any word differs from the sidecar; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar
      on every PR declaring this plan.
  - step: 7
    phase: pre-deploy
    action: The registry, ports and drift checks pass on the committed tree, and ports.yaml shrank.
    command: >-
      bin/venv-python -c "import subprocess, pathlib; from scripts.checks.structural._classify import effective_lines;
      from scripts.checks.contracts.validate_project_configuration import validate_project_configuration as a;
      from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as b;
      from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as c; f=[]; a(f); b(f); c(f); assert not f, f;
      base=effective_lines(subprocess.run(['git', 'show', 'origin/main:docs/contracts/ports.yaml'], capture_output=True, text=True, check=True).stdout);
      head=effective_lines(pathlib.Path('docs/contracts/ports.yaml').read_text(encoding='utf-8')); assert head < base, (base, head); print('CONTRACTS-OK', base, head)"
    expected: prints CONTRACTS-OK with ports' base and head effective lines, head smaller
    fix_if: a check fails (fix the placement, never the sidecar), or ports did not shrink (the PC-10 re-flow is missing)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: PR-relative (the line delta is vacuous once merged); the three checks run in --pre and the full tier on every PR.
  - step: 8
    phase: pre-deploy
    action: >-
      Live replay on real data (network, anonymous reads): the real check runs on main's head, judged by
      merge_checks.verdict with main-validate (a check that runs on every main push) pinned to github-actions' real
      app id, then to a fixture id; prints each verdict's kind and reasons.
    command: >-
      git fetch -q origin main && bin/venv-python -c "import json, subprocess, urllib.request; from scripts.session import merge_checks as m;
      sha=subprocess.run(['git', 'rev-parse', 'origin/main'], capture_output=True, text=True, check=True).stdout.strip();
      body=json.load(urllib.request.urlopen(f'https://api.github.com/repos/otl-labs/ontheloop/commits/{sha}/check-runs?per_page=100&filter=all', timeout=20));
      [print(label, (v := m.verdict(['main-validate'], body['check_runs'], body['total_count'], pins={'main-validate': pin})).kind, v.reasons)
      for label, pin in (('actions_app', 15368), ('fixture_app', 900001))]"
    expected: >-
      two lines: actions_app CLEAR when main's main-validate run succeeded (or REFUSE naming main-validate's own state
      while it is still running or red, never "no run by the verdict App"); fixture_app REFUSE with the reason
      "main-validate has no run by the verdict App (app id 900001)". A network error, or UNAVAILABLE for a partial
      read (more than 100 check runs on main's head), is a read failure on this surface: re-run once; if it persists,
      record it and send a plan-defect report.
    fix_if: >-
      fixture_app reads CLEAR (the pin is not applied to real runs) or actions_app names "no run by the verdict App"
      while main's main-validate run exists (the real app id field is not read)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Depends on network reads of GitHub; steps 2-3 graduate the same verdicts hermetically.
  - step: 9
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): this command as one backgrounded Bash call with a
      2 h limit from the top-level session.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate &&
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0; --verify-head reads the full tier's recorded verdict for HEAD, never the backgrounded run's own exit status
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun from the start; a failure only in another
