constraints:
  - "Build before any gates.<persona>.verdict_source row reads actions (step 1 checks it); no other build order is required."
  - "The gate reads the row only from origin/main and the fetched PR head; no flag, variable, working-tree file or tool_input field changes what it reads (Decision 203 cl.3-4 pattern); a false refusal is fixed in the checker, never overridden."
  - "merge_checks.py stays pure (Decision 234 cl.4); git and GitHub plumbing stay in the adapter (Decision 212 cl.3). No new GitHub endpoint or read: the app id is on the check runs plan 1 already reads."
  - "A persona-named run from another app is ignored, never a refusal on its own (operator, 2026-11-17); reporting it is rec-5271, out of scope."
  - "No GitHub App, key, IAM, Environment, workflow or terraform change: PLAN-persona-verdict-egress owns them (Decision {{N}} cl.4). The row stays null in this build."
  - "The Decision, contract, row and roadmap text is operator-approved; place it exactly, never re-word; a moved anchor is a plan-defect report."
  - "No git-ops.yaml edit (the persona leg's module is already named there; the file is at 497 of 500 effective lines)."
  - "Never edit CI Reform's tests/checks/decisions/test_sit_decision_records.py."
  - "Existing tests change only fixture seeding, never an assert line (Decision 235)."
  - No rescue agents or workaround loops (Decision 55).
