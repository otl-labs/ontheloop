execution_steps:
  - "Run VP step 1 on the build's base before any edit; any False stops the build (see its fix_if)."
  - "Write the new test nodes (steps 2-4) and the acceptance file; run them on the base tree and confirm the new nodes fail (red-before)."
  - "tests/fixtures/merge_overlap_repos.py and tests/hooks/test_merge_gate_persona_leg.py: seed the App row and id per scope; confirm every existing persona-leg node keeps its outcome."
  - "scripts/session/merge_checks.py: add verdict_app_id, the pins keyword, app_id_changed and persona_pins per scope."
  - ".claude/hooks/merge_gate.py: add _persona_leg_app (with _persona_leg delegating to it), thread app into _checks_verdict, and add the row-change refusal after the switch-back refusal, per scope; keep the shim, settings.json and hooks.json unchanged."
  - "scripts/checks/contracts/validate_project_configuration.py: add rule (m) per scope."
  - "docs/DECISIONS.md, docs/contracts/*.yaml and docs/ROADMAP-PLATFORM.yaml: place the sidecar blocks exactly, {{N}} = the next free Decision number on the base, {{DATE}} = the build date UTC; regenerate docs/decisions-index.json with its generator."
  - "The plan declares no weakening disposition: if validate_weakening_candidates lists any candidate, stop and send a plan-defect report."
  - "Commit locally (no push) before VP step 6: steps 6-8 read the committed HEAD, and --verify-head attests only a full run that started on a clean, committed tree."
  - "Execute VP steps 1-9; loop until pass; on an unrecoverable failure stop and send a plan-defect report (Decision 55)."
  - "The implementation commit message carries 'Resolves: rec-5241'; merge_pull_request passes an explicit commit_message carrying it and expectedHeadSha. Merge only on code review PROCEED, green CI and the operator's word on the final diff (hook code)."
  - "After merge: run step 10."
  - "Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state (scripts.session.github_readiness); parent validator evidence (VP 9 plus --verify-head for the pushed HEAD); structured postflight evidence (scripts.session.postflight --evidence); the real outcome - push, build PR, CI green by event-driven wake (never polled), merge SHA."
  - "Report: what was implemented, verification results, the four closure-evidence facts, merge SHA, steps 8 and 10 results."
rollback: >-
  Revert the adapter, merge_checks.py, validator, fixture and test changes; the row may stay (null, read only by the
  gate). With every persona row at in_session nothing reads the pin. The rollback PR's own merge passes through the
  live gate: if the gate is wedging, the operator's GitHub-UI merge is the valve.
