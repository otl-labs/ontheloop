constraints:
  - Place every sidecar block word for word (c01-c02 byte for byte; only {{DATE}} is filled); never edit the sidecar (Decision 246). Any other edit to the bound files fails approved_text verify. The rendered .txt files come only from render --write, which reproduces c05-c06; the T4.10a bookkeeping is exactly STEP 4's.
  - Never edit scripts/persona_contracts/, the persona checks or their tests; a contract the merged mechanism refuses is a plan defect (implement-scope-boundary deviation_trigger), not a code fix.
  - "No model, provider or money figure in either contract -- model identity is docs/contracts/inference-provider.yaml's (Decision 173), and spend is T4.32's (Decision 206 clause 7)."
  - No persona code under scripts/personas/ or src/persona_backends/ (the binding check refuses it while the rows are pending); the host step that commits plan_agent's plan and the run_tests refusal (rec-5086) belong to T4.31, T4.15 and T4.32 c1.
