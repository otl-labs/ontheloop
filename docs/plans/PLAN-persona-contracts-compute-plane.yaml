schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-contracts-compute-plane"
intent: >-
  Write the last two T4.2 persona contracts, plan_agent and implement_agent (kind compute_plane; they run later on
  Fargate through T4.31 and T4.15), on the merged persona contract mechanism unchanged, so the compute-plane personas
  are leashed by contracts the executor cannot loosen before any of their code exists (NS.8). plan_agent reads the
  repository and its named inputs and returns its drafted plan in its result, which the run's host step writes and
  commits (it holds no write capability, T4.10a c3); implement_agent reads, edits and tests its workspace and returns
  identifiers and rec-shaped findings, never running the full validation (T4.15 c9). Both register in
  executor-personas.yaml pending on their persona items with their telemetry keys; T4.10a c1 and c5 close, and with
  them T4.10a, which T4.32's completion needs.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-contracts-compute-plane.yaml
phase: T4.10a
scope:
  - file: docs/contracts/personas/plan_agent.yaml
    action: Create
    purpose: >-
      Sidecar block c01, byte for byte: the plan_agent contract (kind compute_plane; inputs work_item,
      related_work_items, unbuilt_plans, operator_direction, revision_request and rec_write_guidance; capabilities
      read_repo plus read_input over each; success status drafted | decomposed | escalated with work_item_id,
      plan_slug, plan_document, rec-shaped child_work_items the caller files, forks and escalation; budget 150 turns,
      3600 s, 2 revisions, provisional until T4.31:c1; failure ids incl. input_unusable and workspace_mismatch; a
      prompt_template whose bracketed step ids cover every "## Step N:" of .claude/commands/plan.md).
  - file: docs/contracts/personas/implement_agent.yaml
    action: Create
    purpose: >-
      Sidecar block c02, byte for byte: the implement_agent contract (kind compute_plane; inputs plan, approved_text,
      work_items (bundled recs with their acceptance[] typed checks), review_findings, ci_results, continuation and
      rec_write_guidance; capabilities read_repo, edit_repo, run_tests plus read_input over each; success status
      implemented | continuation | escalated with plan_slug, work_item_ids, steps_completed, left_to_coordinator (each
      execution-step part outside its capabilities -- a verification-plan step, the full validation, a generator or
      other non-test command, a commit, push, change, merge, closure walk or report -- returned with its step, neither
      performed nor escalated), next_step, checkpoint, files_changed, tests_run, rec-shaped out_of_scope_findings and
      the plan-defect escalation report; budget 200 turns, 3600 s, 2 revisions, provisional until T4.15:c6; a
      prompt_template carrying the never-weaken and no-full-validation rules, whose bracketed step ids cover every
      "## Step N:" of .claude/commands/implement.md).
  - file: docs/contracts/personas/rendered/plan_agent.txt
    action: Create
    purpose: Sidecar block c05, produced only by `bin/venv-python -m scripts.persona_contracts.render --write plan_agent`; never hand-edited. Its SHA-256 equals c01's rendered_prompt_sha256.
  - file: docs/contracts/personas/rendered/implement_agent.txt
    action: Create
    purpose: Sidecar block c06, produced only by `bin/venv-python -m scripts.persona_contracts.render --write implement_agent`; never hand-edited. Its SHA-256 equals c02's rendered_prompt_sha256.
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      Sidecar blocks c03-c04: an amendment_log entry (accepted_values_extend, semantic_break false) placed above the
      current first entry, and the implement_agent (pending on T4.15:c14, registry_key implement-agent) and plan_agent
      (pending on T4.31:c2, registry_key planning) rows, kind compute_plane, placed first in personas, above
      code_reviewer. Both anchors avoid the lines PLAN-persona-run-identity-contract (rec-4433 plan 1) edits, so either
      build order verifies. No rule of the index changes; contract_version stays 1.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Not sidecar-bound (critique r2 NB2: approved_text verify compares a bound file whole, and STEP 4's T4.10a
      completion cannot ride a sidecar because a scratch tree of main cannot resolve met_by to this unmerged plan; the
      verdict-slice precedent left its roadmap edits unbound the same way). STEP 4 carries the exact text: one dated
      annotation on T4.31's intent (the run's host step commits the plan file; c2's identifiers are the run-level
      return; caller-files for a decomposed run until c7's authority), one on T4.31 c2's own text (a work item id, a
      change id and a head SHA, which the host assembles after file_pr), and the T4.10a bookkeeping (c1 and c5 met by
      persona-contracts-compute-plane, status complete, completion compaction keeping progress_note).
  - file: config/agent/verification_registry/entries/roadmap-t4-containment-resequence-invariants.yaml
    action: Modify
    purpose: >-
      Not sidecar-bound; exact text in STEP 4. One pin re-pins to the state this plan sets: "T4.10a not_started or
      in_progress" becomes "T4.10a complete"; every other pin, including the re-pin-noted pin on progress_note, is
      unchanged. The edited record fails on origin/main and passes on the build's head, so the differential admission
      gate admits it (critique r2 NB1). The replaced assertion needs the operator's approval in words (Decision 235
      clause 1), as roadmap-exr050809-shape-t414-parked's re-pin had; the context entry "Registry and lifecycle"
      records it, and this plan does not merge until it does.
  - file: docs/contracts/tier-item-lifecycle.yaml
    action: Modify
    purpose: >-
      Not sidecar-bound (its archival-exception test needs T4.10a complete); exact text in STEP 4. T4.10a joins
      completion_compaction_exceptions with fields [progress_note] and archival_exceptions, both pinned by
      roadmap-t4-2-callback-and-exr-citations, which reads that field for its EXR and Decision 93 citations (the
      containment record reads it for its re-pin marker), with one field_add amendment_log entry after the 2026-11-07
      T4.36 entry (Decision 227 clause 4; precedent: PLAN-emergent-north-star-orient's unbound T4.36 row). So the
      citations record stays untouched. No rule changes.
  - file: tests/persona_contracts/test_compute_plane_contracts.py
    action: Create
    purpose: >-
      The audit's WP-10 test file. Pins, per persona: the personas row (kind compute_plane, contract and rendered
      paths, pending on its owning criterion, registry_key); capabilities exactly read_repo (plus edit_repo and
      run_tests for implement_agent) and read_input over every input property except change_id and head_sha;
      the input role set, with no property named verification on implement_agent (T3.10 criterion 4); the status
      enum; the failure ids; budget values and provisional.until; and a step disposition map (command step id ->
      "template" or "omitted: <owner>") whose key set equals the "## Step <id>:" ids of .claude/commands/plan.md
      (plan_agent) and .claude/commands/implement.md (implement_agent), failing when either command gains or loses a
      step, with every id's "[step <id>]" marker present in prompt_template. Pins implement_agent's template sentences
      "Never weaken a check to obtain green", "Never run the full validation" and "record it in left_to_coordinator",
      left_to_coordinator in its output_schema's required list, and plan_agent's "change no file and file nothing".
      Names each contract, rendered prompt, the index and both command paths as string literals so the fast tier's
      affected-test selection picks it up when any of them changes.
bundled_recommendations: []
followon_recs: []
closes_criteria: ["T4.10a:c1", "T4.10a:c5"]
infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition: compute_affected_artifacts(<this
    plan's scope>) returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']} because the roadmap is a packaged asset of
    the active data-pipeline artifact. No build, deploy or smoke test is owed: the change is an annotation and
    bookkeeping with no packaged code; the deploy gate's watched paths exclude the roadmap, and its one runtime reader
    runs only from the scheduled-agent dispatcher, provisioned DISABLED (precedent: PLAN-persona-contracts-verdict-personas).
    No other scope file is Lambda-packaged and no .tf file is in scope.
acceptance_criteria:
  - "T4.10a:c1 -- plan_agent and implement_agent each have a contract-versioned YAML with input_schema, output_schema, capabilities, a turn, wall-clock and revision budget and failure_outputs, registered in executor-personas.yaml as compute_plane personas pending on T4.31:c2 and T4.15:c14; with the three verdict contracts all five T4.2 personas are covered and validate_persona_contracts and validate_persona_contract_binding pass on the real tree (VP 4)."
  - "T4.10a:c5 -- each of the two rendered prompts equals a fresh render of its contract, starts with the quoted-content clause and hashes to its contract's rendered_prompt_sha256 (render --check reports five, VP 3)."
  - The bound files (the two contracts, their rendered prompts and executor-personas.yaml) equal main plus the approved sidecar's six blocks (approved_text verify exits 0 at the approved digest, VP 2).
  - tests/persona_contracts/test_compute_plane_contracts.py passes, including both step disposition maps, and the archival-exception test accepts T4.10a (VP 5).
  - T4.10a is complete in the compact form, keeping its declared progress_note, with c1 and c5 met by persona-contracts-compute-plane; it stays live as a compaction and archival exception; and the re-pinned containment record and the untouched citations record replay green on that tree (VP 6).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: this plan and its sidecar are on main, the registry-key precursor build is on main, and the branch is current."
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-persona-contracts-compute-plane.yaml
      && git cat-file -e origin/main:docs/plans/approved/persona-contracts-compute-plane.yaml && git merge-base
      --is-ancestor origin/main HEAD && bin/venv-python -c "from scripts.persona_contracts.schema import PersonaRow;
      raise SystemExit(0 if 'registry_key' in PersonaRow.model_fields else 1)" && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      A missing plan or sidecar means this plan's PR has not merged; a PersonaRow without a registry_key field means
      PLAN-persona-registry-key-check has not built (the keyed rows are refused until it does): stop either way. A
      failed ancestry test means a stale branch: merge origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The bound files are exactly main plus the approved sidecar, at its approved digest.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-contracts-compute-plane --base origin/main
      --expect 82a94fa431c8d64b2fb79a7f69aa5abb7a52732be0e6db580b876a9fc37398f3
    expected: Exit 0, printing APPROVED-TEXT OK. Red before the sidecar blocks are placed.
    fix_if: >-
      A word mismatch means a placed block drifted: restore its after text exactly, never edit the sidecar. A digest
      mismatch means the sidecar on main is not the approved one: stop and ask the operator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A base-relative, one-time binding of this build's diff to its sidecar; validate_merge_step enforces the same
      binding on the build PR's fast tier.
  - step: 3
    phase: pre-deploy
    action: The five rendered prompts are fresh renders of their contracts.
    command: bin/venv-python -m scripts.persona_contracts.render --check
    expected: Exit 0 printing RENDER-CHECK OK 5. Before the build it prints RENDER-CHECK OK 3, also exit 0.
    fix_if: >-
      A stale or missing rendered prompt means it was hand-edited or not regenerated: re-run render --write for that
      persona. A hash mismatch in VP 4 means the sidecar's rendered_prompt_sha256 and the merged renderer disagree:
      stop and send the plan-defect report, never edit the bound hash.
    hermetic: true
    expected_literals: ["RENDER-CHECK OK 5"]
    graduation: waive
    graduation_waiver_reason: >-
      One-time evidence (Decision 244 cl.4): render --check exits 0 on any consistent index, so only its printed count
      differs, an exact count later personas change; the standing guards are VP 4's graduated check and VP 5's test
      file, which the full tier runs on main.
  - step: 4
    phase: pre-deploy
    action: The real tree passes both persona checks with the five T4.2 personas registered (the contract drift gate over the amended contracts runs in VP 7's fast tier).
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_persona_contracts import validate_persona_contracts as
      a; from scripts.checks.contracts.validate_persona_contract_binding import validate_persona_contract_binding as b;
      import yaml; rows=yaml.safe_load(open('docs/contracts/executor-personas.yaml'))['personas']; f=[]; a(f); b(f);
      names=sorted(r['persona'] for r in rows); print(names, f); raise SystemExit(1 if f or not
      {'code_reviewer','decision_scout','implement_agent','plan_agent','plan_critic'} <= set(names) else 0)"
    expected: >-
      Exit 0 after printing the five persona names and an empty failure list. Red before the build: plan_agent and
      implement_agent are not registered.
    fix_if: Fix the placed file the failure names (or regenerate a rendered prompt); never edit the checks or loosen the contract.
    hermetic: true
    graduation: graduate
    graduation_check_id: compute-plane-persona-contracts-real-tree
  - step: 5
    phase: pre-deploy
    action: The compute-plane acceptance test, the mechanism's own tests (whose metaschema test covers every registered contract), the roadmap tests and the archival-exception tests.
    command: >-
      bin/venv-python -m pytest -q tests/persona_contracts tests/checks/contracts/test_validate_persona_contracts.py
      tests/checks/contracts/test_validate_persona_contract_binding.py tests/roadmap tests/platform_roadmap_state
      tests/test_planning_skill_start_order.py tests/test_roadmap_archive.py
    expected: >-
      Exit 0; test_compute_plane_contracts.py and test_schema_metaschema.py run (the latter skips only where
      jsonschema is absent). Red before: test_compute_plane_contracts.py is absent.
    fix_if: Fix the contract text through the plan-defect route or the test code, never the assertion's intent.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The created test file is the standing guard: the --pre affected set selects it whenever a contract, the index or
      either command changes, and the full tier runs it on main.
  - step: 6
    phase: pre-deploy
    action: T4.10a is complete in compact form (keeping its declared progress_note) with c1 and c5 met, and the re-pinned containment record and the untouched citations record replay green on that tree.
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); i=[t for t in
      d['tier_items'] if t['id']=='T4.10a'][0]; s={c['id']:(c['status'],c.get('met_by')) for c in i['exit_criteria']};
      ok=i['status']=='complete' and s['c1']==s['c5']==('met','persona-contracts-compute-plane') and
      'roadmap-t4-containment-resequence-invariants' in (i.get('progress_note') or '') and not
      i.get('decomposition_hints') and i['files_in_scope']==[] and 'EXR-03' in
      i['intent'] and 'Decision 93' in i['intent']; print('T4.10A OK' if ok else 'T4.10A WRONG', i['status'], s);
      raise SystemExit(0 if ok else 1)" && bin/venv-python -m scripts.roadmap.platform_roadmap > /dev/null && echo
      ROADMAP-LOADS && bin/venv-python -m scripts.checks.verification.validate_graduated_rerun --check-id
      roadmap-t4-containment-resequence-invariants --root . | grep -q '"passed": true' && bin/venv-python -m
      scripts.checks.verification.validate_graduated_rerun --check-id roadmap-t4-2-callback-and-exr-citations --root . |
      grep -q '"passed": true' && echo RECORDS-REPLAY-OK
    expected: >-
      Prints T4.10A OK, ROADMAP-LOADS and RECORDS-REPLAY-OK. Red before STEP 4 (T4.10A WRONG, status in_progress);
      with STEP 4's bookkeeping applied but its containment re-pin not, the containment replay prints "passed": false
      and RECORDS-REPLAY-OK is absent; with progress_note dropped, the citations replay does.
    fix_if: >-
      A wrong field means STEP 4 was not applied exactly; apply it as written there. A failed replay means the
      containment re-pin is missing or progress_note was dropped; restore STEP 4's exact text. Never re-open c1 or c5
      by hand, and never edit either record beyond STEP 4's one re-pin.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      One-time evidence of a bookkeeping flip: the standing guards are the two replayed records themselves, already
      graduated and replayed by the full tier's registry segment on every main (the re-pinned one admitted by the
      differential gate in VP 7), and validate_platform_roadmap's met_by resolution.
  - step: 7
    phase: pre-deploy
    action: Fast tier on the branch, including validate_contract_drift over the two amended contracts and validate_verification_registry's differential admission of the re-pinned record.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the named failure on the branch; never skip, disable or quarantine a test.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Full tier before handoff (handoff_policy), started in the background from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports a completed full run for HEAD with exit 0.
    fix_if: A red full tier blocks handoff; fix and rerun from the start. A timeout is blocked, never a warning.
    hermetic: false
    graduation: not-applicable
