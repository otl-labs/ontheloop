execution_steps:
  - "STEP 0: run VP step 1. Read back rec-5050 (recs_by_ids) as open; if closed, note it and continue."
  - "STEP 1: place sidecar blocks s01-s06 byte for byte and s10 word for word at build_tree's body indent ({{DATE}} = build date); s07-s09 come from STEP 2."
  - "STEP 2: `bin/venv-python -m scripts.persona_contracts.render --write <persona>` for code_reviewer, decision_scout and plan_critic; each printed hash must equal its contract's bound rendered_prompt_sha256 (a mismatch is a plan defect: stop). Run VP step 3, then VP step 2. Post: RENDER-CHECK OK 3 and APPROVED-TEXT OK."
  - "STEP 2b: with s10 placed in STEP 1, the mechanism's own tests (VP step 5's first three paths) are green again."
  - "STEP 3: set config/prose_budgets.yaml's .claude/skills/decision-scout/SKILL.md entry to `wc -c < .claude/skills/decision-scout/SKILL.md`. Run VP step 6."
  - >-
    STEP 4: tests/persona_contracts/test_verdict_persona_contracts.py per its scope row. The step-id map reads skill
    step ids as follows: decision-scout and plan-critique, every line matching ^(\*\*)?([0-9]+[a-z]?(-[0-9]+)?)\. (today
    decision-scout 0-8, 8b, 9, 10; plan-critique 1-12, 5b, 12b, 12c, 12c-1, 12d-12p, 13, 14), with template marker
    "[step <id>]"; code-review, each "## Step <id>:" heading (0, 0b) and each numbered line of the "## Review
    Process" section (1-6) as "[step <id>]", each "### <n>." dimension heading as "[dimension <n>," and the "## V3
    Post-Deploy Evidence" heading as "[v3 evidence]". plan-critique 12d maps to "omitted: retired (Decision 247)";
    every other id maps to "template". Run VP steps 4 and 5.
  - >-
    STEP 5 (roadmap, T4.10a only): append to progress_note, after the last bullet, "- <build date>
    (PLAN-persona-contracts-verdict-personas, rec-5050): the decision_scout, plan_critic and code_reviewer contracts
    landed under docs/contracts/personas/ with their rendered prompts and skill tethers, registered in
    executor-personas.yaml pending on T4.30 c3, T4.29 c3 and T4.28 c4; c1 and c5 stay open for plan_agent and
    implement_agent (PLAN-persona-contracts-compute-plane)." Keep "(PLAN-persona-contracts-verdict-personas,
    rec-5050):" unwrapped on the bullet's first line: VP step 7 matches it as one substring. No other roadmap edit.
    Then VP step 7.
  - "STEP 6: validate --pre (VP step 8). Loop until pass; on an unrecoverable failure stop and RCA (Decision 55)."
  - >-
    CLOSURE, each outcome reported separately: readiness, parent-validator evidence, postflight evidence and the real
    push and PR outcome (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence): bin/venv-python -m
    scripts.session.github_readiness; run /implement's Verification Graduation walk, which writes the registry shard
    for verdict-persona-contracts-real-tree; set implementation_declared: true in this
    plan; commit (feat(persona-contracts-verdict-personas): ...); git fetch origin main && git rebase origin/main; VP
    step 9; write /tmp/implementation-retrospective.json with the ten scripts.session.postflight_evidence.CATEGORIES
    keys and run bin/venv-python -m scripts.session.postflight --evidence /tmp/implementation-retrospective.json; push
    (git push -u origin HEAD as its own call); open the PR and report it as opened only with the returned PR number;
    subscribe to it; on green CI squash-merge with "Resolves: rec-5050" in the commit body; then VP step 10.
  - >-
    Report: what was implemented, verification results, that T4.10a c1 and c5 stay open for the compute-plane plan, and
    that the verdict jobs plan (T4.32) and the three add plans may now rely on the contracts. State each CLOSURE outcome
    on its own line, never inferred from a prior step.
