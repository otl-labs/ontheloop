schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-contracts-verdict-personas"
intent: >-
  Write the three verdict persona contracts -- decision_scout, plan_critic and code_reviewer -- on the persona contract
  mechanism, so the verdict personas move to GitHub Actions governed (NS.8: each persona's leash is a contract the
  executor cannot loosen). Each contract names its inputs by role, grants read_input over those inputs only, fixes the
  one output schema every backend's result validates against, bounds the run in turns, wall clock and revisions, and
  carries its prompt template, rendered prompt hash and skill tether; executor-personas.yaml registers all three with
  implementation pending on each persona's ADD criterion. Delivers T4.10a c1 and c5 for the three verdict personas
  (rec-5050); both criteria stay open until PLAN-persona-contracts-compute-plane lands the other two personas.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-contracts-verdict-personas.yaml
phase: T4.10a
scope:
  - file: docs/contracts/personas/decision_scout.yaml
    action: Create
    purpose: >-
      Sidecar block s01, byte for byte: the decision_scout contract (kind verdict; inputs plan, approved_text,
      north_star, decisions_index, decisions and the shell pre-computations tag_shortlist, north_star_carriers and
      roadmap_projection; read_input over each; verdict NO_FLAGS | FLAGS_FOUND | BLOCK with the CITE, CONTRADICT,
      RELATED, SPIRIT, ROADMAP and NORTH STAR lanes and the N-of-M triage integers; budget 60 turns, 1200 s, 2
      revisions, provisional until T4.30:c3; failure ids incl. input_unusable and triage_incomplete; prompt_template;
      rendered_prompt_sha256; skill_tether to .claude/skills/decision-scout/SKILL.md).
  - file: docs/contracts/personas/plan_critic.yaml
    action: Create
    purpose: >-
      Sidecar block s02, byte for byte: the plan_critic contract (inputs plan, approved_text, approved_text_record,
      scope_files, project_context, north_star, decisions, roadmap_items, plan_obligations, affected_artifacts; verdict
      PROCEED | REVISE with decision conflicts, the five frame-challenge answers, one row per numbered check and
      blocking/nit findings; budget 80 turns, 1800 s, 2 revisions, provisional until T4.29:c3; skill_tether to
      .claude/skills/plan-critique/SKILL.md).
  - file: docs/contracts/personas/code_reviewer.yaml
    action: Create
    purpose: >-
      Sidecar block s03, byte for byte: the code_reviewer contract (inputs plan, change_files, diff, review_scope,
      review_scope_files, project_context, review_exemptions, review_dispositions, weakening_candidates, ci_results,
      change_evidence; verdict PROCEED | REVISE with rec-shaped findings the caller files, acceptance check, weakening
      dispositions and exemptions; budget 120 turns, 2400 s, 2 revisions, provisional until T4.28:c4; skill_tether to
      .claude/skills/code-review/SKILL.md).
  - file: docs/contracts/personas/rendered/decision_scout.txt
    action: Create
    purpose: Generated by `bin/venv-python -m scripts.persona_contracts.render --write decision_scout`; never hand-edited. Its SHA-256 equals s01's rendered_prompt_sha256.
  - file: docs/contracts/personas/rendered/plan_critic.txt
    action: Create
    purpose: Generated by `bin/venv-python -m scripts.persona_contracts.render --write plan_critic`; never hand-edited. Its SHA-256 equals s02's rendered_prompt_sha256.
  - file: docs/contracts/personas/rendered/code_reviewer.txt
    action: Create
    purpose: Generated by `bin/venv-python -m scripts.persona_contracts.render --write code_reviewer`; never hand-edited. Its SHA-256 equals s03's rendered_prompt_sha256.
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      Sidecar blocks s04-s05: an amendment_log entry (accepted_values_extend, semantic_break false) and the three
      personas rows (code_reviewer pending on T4.28:c4, decision_scout on T4.30:c3, plan_critic on T4.29:c3), each with
      kind verdict and its contract and rendered_prompt paths. No rule of the index changes; contract_version stays 1.
  - file: .claude/skills/decision-scout/SKILL.md
    action: Modify
    purpose: >-
      Sidecar block s06: the Quality Gate line "- [ ] The Verdict line is one of the three exact strings (no
      variations)" becomes "- [ ] Verdict: NO_FLAGS | FLAGS_FOUND | BLOCK -- one exact string", the tether line whose
      tokens after its first colon equal decision_scout's verdict enum. The report template, its "### Verdict" heading
      and the three strings stay byte for byte (Decision 152 clause 2). The file shrinks by 7 bytes.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Ratchet .claude/skills/decision-scout/SKILL.md's entry down to the file's measured size after s06 (11285 on
      today's main; measure at build time with `wc -c`). A decrease, sanctioned by implement-scope-boundary.yaml's
      prose_budgets_ratchet_down row; never a raise.
  - file: tests/persona_contracts/test_verdict_persona_contracts.py
    action: Create
    purpose: >-
      rec-5050's acceptance (its node test_three_verdict_personas_registered_pending asserts the three rows). Pins,
      per persona: the personas row (kind verdict, contract and rendered paths, pending
      on its ADD criterion); the verdict enum and the tether (skill path, verdict_line present in the skill, its tokens
      equal to the enum); capabilities exactly read_input over every input property except change_id and head_sha; the
      input role set; the failure ids; budget provisional.until equal to the persona's ADD criterion; and a step-id map
      (skill step id -> "template" or "omitted: <reason>") that fails when the skill gains a step id the map lacks and
      checks every "template" id appears as its bracketed marker in prompt_template. Also pins that decision-scout's
      report template still reads "### Verdict" followed by "NO_FLAGS | FLAGS_FOUND | BLOCK".
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Bookkeeping only, not sidecar-bound (no criterion text changes): one progress_note bullet on T4.10a, exact text
      in execution STEP 5. c1 and c5 stay open; no status, met_by or hint edit.
bundled_recommendations: [rec-5050]
followon_recs: []
closes_criteria: []
infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition: compute_affected_artifacts(<this
    plan's scope>) returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']} because the roadmap is a packaged asset of
    the active data-pipeline artifact. No build, deploy or smoke test is owed: the change is one progress_note bullet
    with no packaged code; deploy-prod-lambdas.yml does not path-trigger on the roadmap, and its one runtime reader runs
    only from the scheduled-agent dispatcher, provisioned DISABLED (precedent: PLAN-persona-contracts-verdict-slice).
    No other scope file is Lambda-packaged and no .tf file is in scope.
acceptance_criteria:
  - The six bound files' edits (three contracts, the index, the decision-scout skill) equal main plus the approved sidecar's 6 blocks, word for word (approved_text verify exits 0 at the approved digest).
  - executor-personas.yaml registers code_reviewer, decision_scout and plan_critic as verdict personas, each pending on its persona item's ADD criterion, and validate_persona_contracts, validate_persona_contract_binding and validate_contract_drift pass on the real tree.
  - Each rendered prompt equals a fresh render of its contract, starts with the quoted-content clause and hashes to its contract's rendered_prompt_sha256 (render --check reports three).
  - Every input_schema and output_schema passes the JSON Schema 2020-12 metaschema check, and each contract's verdict enum equals its skill tether's verdict tokens.
  - tests/persona_contracts/test_verdict_persona_contracts.py passes (rec-5050's acceptance), including the step-id map for all three skills.
  - decision-scout's report interface is unchanged and its prose budget ratchets down to its measured size.
  - T4.10a's c1 and c5 stay open, with one progress_note bullet naming this plan.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: this plan, its sidecar and the persona contract mechanism are on main; branch current."
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-persona-contracts-verdict-personas.yaml
      && git cat-file -e origin/main:docs/plans/approved/persona-contracts-verdict-personas.yaml && git cat-file -e
      origin/main:docs/contracts/executor-personas.yaml && git cat-file -e
      origin/main:scripts/checks/contracts/validate_persona_contracts.py && git merge-base --is-ancestor origin/main HEAD
      && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      A missing plan or sidecar means this plan's PR has not merged; a missing executor-personas.yaml or validator means
      PLAN-persona-contracts-verdict-slice has not built: stop either way. A failed ancestry test means a stale branch:
      merge origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The bound files are exactly main plus the approved sidecar, at its approved digest.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-contracts-verdict-personas --base origin/main
      --expect APPROVED_DIGEST_PENDING
    expected: Exit 0, printing APPROVED-TEXT OK. Red before the sidecar blocks are placed.
    fix_if: >-
      A word mismatch means a placed block drifted: restore its after text exactly, never edit the sidecar. A digest
      mismatch means the sidecar on main is not the approved one: stop and ask the operator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A base-relative, one-time binding of this build's diff to its sidecar; validate_merge_step enforces the same
      binding on the build PR's fast tier.
  - step: 3
    phase: pre-deploy
    action: The three rendered prompts are fresh renders of their contracts.
    command: bin/venv-python -m scripts.persona_contracts.render --check
    expected: Exit 0 printing RENDER-CHECK OK 3. Red before (no contract registered, the count is 0).
    fix_if: >-
      A stale or missing rendered prompt means it was hand-edited or not regenerated: re-run render --write for that
      persona; a hash mismatch against the contract means the sidecar's rendered_prompt_sha256 and the merged renderer
      disagree -- stop and send the plan-defect report, never edit the bound hash.
    hermetic: true
    expected_literals: ["RENDER-CHECK OK 3"]
    graduation: graduate
    graduation_check_id: verdict-persona-render-check
  - step: 4
    phase: pre-deploy
    action: The real tree passes the persona checks and the drift check with the three contracts registered.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_persona_contracts import validate_persona_contracts as
      a; from scripts.checks.contracts.validate_persona_contract_binding import validate_persona_contract_binding as b;
      from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as c; import yaml;
      rows=yaml.safe_load(open('docs/contracts/executor-personas.yaml'))['personas']; f=[]; a(f); b(f); c(f);
      names=sorted(r['persona'] for r in rows); print(names, f); raise SystemExit(1 if f or
      names!=['code_reviewer','decision_scout','plan_critic'] else 0)"
    expected: Exit 0 after printing the three persona names and an empty failure list.
    fix_if: Fix the placed file the failure names (or regenerate a rendered prompt); never edit the checks or loosen the contract.
    hermetic: true
    graduation: graduate
    graduation_check_id: verdict-persona-contracts-real-tree
  - step: 5
    phase: pre-deploy
    action: rec-5050's acceptance, the mechanism's own tests (whose metaschema test covers every registered contract) and the scout skill's pins.
    command: >-
      bin/venv-python -m pytest -q tests/persona_contracts tests/checks/contracts/test_validate_persona_contracts.py
      tests/checks/contracts/test_validate_persona_contract_binding.py tests/test_decision_scout_north_star_lane.py
    expected: >-
      Exit 0; test_verdict_persona_contracts.py and test_schema_metaschema.py run (the latter skips only where
      jsonschema is absent). Red before: test_verdict_persona_contracts.py is absent.
    fix_if: Fix the contract text through the plan-defect route or the test code, never the assertion's intent.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The created test file is the standing guard: the --pre affected set selects it whenever a contract, the index or
      a tethered skill changes, and the full tier runs it on main.
  - step: 6
    phase: pre-deploy
    action: The decision-scout skill matches its ratcheted prose budget.
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f);
      print(f); raise SystemExit(1 if f else 0)"
    expected: Exit 0 after printing an empty failure list.
    fix_if: A mismatch means config/prose_budgets.yaml's entry is not the file's measured byte size; set it to `wc -c` of the file (a decrease only).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: T4.10a keeps c1 and c5 open, carries the progress bullet, and the roadmap model still loads.
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); i=[t for t in
      d['tier_items'] if t['id']=='T4.10a'][0]; s={c['id']:c['status'] for c in i['exit_criteria']};
      ok=s['c1']==s['c5']=='open' and 'PLAN-persona-contracts-verdict-personas' in i['progress_note']; print('T4.10A OK'
      if ok else 'T4.10A WRONG', s); raise SystemExit(0 if ok else 1)" && bin/venv-python -m
      scripts.roadmap.platform_roadmap > /dev/null && echo ROADMAP-LOADS
    expected: Prints T4.10A OK and ROADMAP-LOADS.
    fix_if: A missing bullet means STEP 5 was not applied; apply it exactly as written there. Never flip c1 or c5.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Fast tier on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the named failure on the branch; never skip, disable or quarantine a test.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Full tier before handoff (handoff_policy), started in the background from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports a completed full run for HEAD with exit 0.
    fix_if: A red full tier blocks handoff; fix and rerun from the start. A timeout is blocked, never a warning.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: rec-5050 closed by the squash-merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as r; rows,_=r.fetch_recs_by_ids(r.make_reader(),
      ['rec-5050']); s=rows[0]['status'] if rows else None; print('rec-5050', s); raise SystemExit(0 if s=='closed' else
      1)"
    expected: Prints rec-5050 closed.
    fix_if: >-
      Still open means ci.yml's closure job did not run or failed: read its run on the merge commit; close through
      update_rec only with the merge SHA as evidence.
    hermetic: false
    graduation: not-applicable
