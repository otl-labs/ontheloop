      ok=s['c1']==s['c5']=='open' and 'PLAN-persona-contracts-verdict-personas' in i['progress_note']; print('T4.10A OK'
      if ok else 'T4.10A WRONG', s); raise SystemExit(0 if ok else 1)"
    red_green_expectation: red before STEP 5 (prints T4.10A WRONG), green after
  - source: tests/persona_contracts/test_verdict_persona_contracts.py
