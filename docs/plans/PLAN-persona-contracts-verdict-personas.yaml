constraints:
  - Place every sidecar block byte for byte (s10 word for word at build_tree's body indent; only {{DATE}} is filled); never edit the sidecar (Decision 246). Any other edit to the bound files fails approved_text verify. The rendered .txt files come only from render --write, which reproduces s07-s09; the roadmap edit is exactly STEP 5's.
  - Never edit scripts/persona_contracts/, the persona checks or their tests beyond fixture_tree.py's scope row; a contract the merged mechanism refuses is a plan defect (implement-scope-boundary deviation_trigger), not a code fix.
  - The decision-scout report template, its "### Verdict" heading and its three verdict strings stay byte for byte (Decision 152 clause 2); prose budgets only ratchet down.
  - "No model, provider or dollar figure in any contract -- model identity is docs/contracts/inference-provider.yaml's (Decision 173; PLAN-llm-client-litellm-transport), and spend is T4.32's (Decision 206 clause 7)."
  - No persona code under scripts/personas/ or src/persona_backends/ (the binding check refuses it while the rows are pending).
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
