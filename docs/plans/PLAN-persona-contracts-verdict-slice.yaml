schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-contracts-verdict-slice"
intent: >-
  Write the rulebook every persona runs under before any persona or backend exists, so the verdict personas move to
  GitHub Actions governed (NS.8: the persona's leash is a contract the executor cannot loosen). One new Class D contract,
  docs/contracts/executor-personas.yaml, declares the run_persona call shape, the closed persona capability vocabulary
  with its litellm bindings, the shape every persona contract takes and the rendered-prompt rules; a registered
  validator, a renderer and a registered binding check enforce it; docs/contracts/personas/ becomes a declared
  sub-tree. Closes T4.10a c2, c3, c4, c6, c7 and c8, which moves T4.10a to in_progress and opens T4.32. The three
  verdict persona contracts are PLAN-persona-contracts-verdict-personas (rec-5050).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-contracts-verdict-slice.yaml
phase: T4.10a
scope:
  - file: docs/contracts/executor-personas.yaml
    action: Create
    purpose: >-
      Sidecar block b01, byte for byte with {{DATE}} filled: a Class D contract (subject executor-personas, evaluator
      check validate_persona_contracts, status draft) declaring the run_persona call shape (pointing at the ports.yaml
      row, backends by values_ref to inference-provider.yaml's persona_backend axis), the closed capability vocabulary
      (read_input, read_repo, run_tests, edit_repo, warehouse_read) with effect, target, parameter domain and litellm
      binding, the refused targets and bound verbs, the persona contract shape, the schema dialect, budget rules,
      failure envelope, rendered-prompt rules with the quoted-content clause, the declared sub-tree, the
      implementation binding and an empty personas index. Its amendment_log carries the initial entry.
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: >-
      Sidecar blocks b02-b04: a new amendment_log entry (accepted_values_extend), the EXCEPTION sentence in
      shape_grammar.extension_and_depth, and a new top-level declared_subtrees list with one row (personas/, index
      executor-personas.yaml, evaluator validate_persona_contracts, extensions .yaml and .txt, members_key personas,
      member_fields contract and rendered_prompt, owning_item T4.10a:c5). contract_version unchanged.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Sidecar blocks b05-b06: a new amendment_log entry and structural_assumptions row SA-{{N}} (the next free SA id at
      build time; SA-11 on today's main) recording the mechanism's repository-layout assumptions (Decision 211 clause
      2). No port row changes. Stays under 500 effective lines (457 today).
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      Sidecar block b07: boundary_patterns gain scripts/persona_contracts/,
      scripts/checks/contracts/validate_persona_contract, tests/persona_contracts/ and
      tests/checks/contracts/test_validate_persona_contract, so the leash's own enforcers are executor boundary paths
      (Decision 185 clause 3; the decision scout's WARN).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Bookkeeping and the settled split, not sidecar-bound (criteria text is unchanged; the split and order are
      mechanical forks the operator delegated, 2026-11-09): T4.10a c2, c3, c4, c6, c7 and c8 open -> met with met_by
      persona-contracts-verdict-slice; T4.10a not_started -> in_progress; one progress_note bullet; decomposition_hints
      re-cut (this slug narrowed to the mechanism, PLAN-persona-contracts-verdict-personas added, rationale re-worded),
      all with the exact text execution STEP 5 gives. No other roadmap edit.
  - file: scripts/checks/contracts/_population.py
    action: Modify
    purpose: >-
      load_declared_subtrees(population_path) parses contract-population.yaml's declared_subtrees (an empty list when
      the key is absent) and subtree_member_failures(contracts_dir, rows) returns the failure strings for one tree:
      a file under a row's path that the index does not list as a member, a member with an extension the row does not
      name, a listed member with no file, a .yaml/.yml member carrying a top-level contract key, and an index that is
      not a depth-1 Class D contract whose evaluator check equals the row's evaluator. is_governed_extension_depth is
      unchanged (its existing tests keep asserting nested paths are not depth-1).
    new_imports: []
  - file: scripts/checks/contracts/validate_contract_drift.py
    action: Modify
    purpose: >-
      The extension/depth pass admits a non-depth-1 file only when it lies under a declared sub-tree, and appends
      _population.subtree_member_failures for every row on every run (not only when the merge-base baseline is
      reachable, so the closed set holds offline too). Members never enter Pass 1, the census or the ratchet.
  - file: scripts/persona_contracts/__init__.py
    action: Create
    purpose: Facade re-exporting the public surface of schema.py and render.py (Decision 80 facade pattern).
  - file: scripts/persona_contracts/schema.py
    action: Create
    purpose: >-
      Pydantic (extra="forbid") models of executor-personas.yaml's machine-read sections (capability_vocabulary,
      refused, persona_contract field lists, schema_dialect keywords, budget_rules ceilings, failure_envelope
      required_ids, rendered_prompt placeholders and clause, declared_subtree, personas rows) and of a persona contract;
      load_index() and load_contract(); a schema-dialect checker that refuses any keyword outside schema_dialect.keywords,
      any object schema without additionalProperties false or without an explicit required list; parse_capability()
      splitting <id>[:<parameter>]. No jsonschema import (fast tier).
  - file: scripts/persona_contracts/render.py
    action: Create
    purpose: >-
      render(contract, index) -> bytes: string.Template.substitute (strict; an unknown placeholder or a stray $ raises)
      of prompt_template with exactly rendered_prompt.placeholders (output_schema as json.dumps(sort_keys=True,
      indent=2)), quoted_content_clause prepended, LF line endings, one trailing newline, UTF-8; sha256_hex(bytes). CLI
      `python -m scripts.persona_contracts.render --check` (exit 1 naming each stale or missing rendered prompt, else
      prints RENDER-CHECK OK <n>) and `--write <persona>` (writes the file and prints the hash to record).
  - file: scripts/checks/contracts/validate_persona_contracts.py
    action: Create
    purpose: >-
      Registered check (owner platform, fast tier) and executor-personas.yaml's evaluator; holds the literal
      "executor-personas.yaml" in executable context. Fails: index unparseable or off its schema; backends.values_ref
      not resolving to inference-provider.yaml's persona_backend values or built_before_mvp outside them; a vocabulary
      capability whose target is refused, whose binding names a refused bound verb, whose effect is write without
      personas [implement_agent] only, or (warehouse_read) whose server is not scripts/agent_sdk/mcp_server.py; per
      contract (each personas row): missing required field (verdict kind also skill_tether), persona/stem/row mismatch,
      a capability outside the vocabulary (naming the harness tool when it is one), a parameter outside its domain
      (read_input: a top-level input_schema property; warehouse_read: an agent_facing key of
      src/common/ducklake_named_reads.NAMED_READS), a parameter equal to a registered persona id, edit_repo named by a
      persona not listed, a repo-target capability in a verdict contract, input_schema not requiring change_id and
      head_sha, a schema off the dialect, a budget missing, null, non-integer, below its floor or over its ceiling, a
      budget key or string value naming a currency, cost, price or spend, provisional.until not an open roadmap
      criterion, failure_outputs missing a required id, a rendered prompt not equal to a fresh render, not starting
      with the clause, or hashing to anything but rendered_prompt_sha256, a rendered prompt changed against the
      merge-base with contract_version not raised (advisory skip when origin/main is unreachable), a skill_tether whose
      file lacks verdict_line or verdict_rule byte for byte or whose verdict tokens differ from output_schema's verdict
      enum; and any of its own leash paths (the index, docs/contracts/personas/, scripts/persona_contracts/, this
      module, the binding module) not covered by capabilities.yaml boundary_patterns. Decision 170 examined()/skipped().
  - file: scripts/checks/contracts/validate_persona_contract_binding.py
    action: Create
    purpose: >-
      Registered check (owner platform, fast tier), T4.10a c4's conformance check. Fails: a personas row whose
      implementation is not {status: pending, owning_item} or {status: implemented, location}; a pending row whose
      owning_item is not an open roadmap criterion; an implemented row whose location is missing or does not contain
      the contract's path as a string literal; and any .py module under implementation_binding.landing_dirs holding a
      string literal equal to a registered persona id or its contract path while that row is pending (AST scan, never
      comments or docstrings). Decision 170 examined()/skipped().
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: Two Entries registering validate_persona_contracts and validate_persona_contract_binding in the pre and full sequences.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Two function_to_category rows, validate_persona_contracts: schema_drift and validate_persona_contract_binding:
      schema_drift. The file sits at 500 of 500 effective lines: if the rows push it over, compact existing entries
      into single-line flow mappings with every parsed value unchanged (the config class's declared relief valve,
      measured against main at build time); never raise the budget.
  - file: .gitattributes
    action: Modify
    purpose: Add `docs/contracts/personas/rendered/*.txt -text` so git never rewrites a rendered prompt's bytes.
  - file: tests/persona_contracts/__init__.py
    action: Create
    purpose: Package marker.
  - file: tests/persona_contracts/conftest.py
    action: Create
    purpose: >-
      Fixtures building a temporary repo tree: a copy of the real executor-personas.yaml with one fixture verdict
      persona row, its contract, its rendered prompt (rendered by render.py) and a fixture SKILL.md, plus a mutator per
      rule so each red test changes exactly one thing.
  - file: tests/persona_contracts/test_schema.py
    action: Create
    purpose: The real index parses; the dialect checker refuses an off-subset keyword, a missing additionalProperties false and a missing required list; parse_capability splits ids and parameters.
  - file: tests/persona_contracts/test_render.py
    action: Create
    purpose: >-
      Same contract renders the same bytes twice; the clause is first; LF and one trailing newline; an unknown
      placeholder or stray $ raises; --check exits 1 on a stale file and 0 with RENDER-CHECK OK on a fresh one;
      test_rendered_prompts_are_not_text_converted reads git check-attr text for a rendered path as unset.
  - file: tests/persona_contracts/test_schema_metaschema.py
    action: Create
    purpose: >-
      Full tier only (module-level `jsonschema = pytest.importorskip("jsonschema")`, the fast tier installs none): every
      schema in the fixture contract passes Draft202012Validator.check_schema, and a success example validates against
      its output_schema while every failure_envelope value does not.
  - file: tests/checks/contracts/test_validate_persona_contracts.py
    action: Create
    purpose: >-
      Real tree green (empty index) with examined declared; fixture tree green; one red test per rule in the validator's
      purpose (c2, c3, c5-mechanism, c6, c7, c8 legs), each asserting its own failure string, named so VP step 6's -k
      terms select them; test_both_checks_registered_in_both_sequences.
  - file: tests/checks/contracts/test_validate_persona_contract_binding.py
    action: Create
    purpose: Real tree green; red for a pending row on a met or unknown criterion, an implemented row without its contract path, and a landing-dir module naming a pending persona id; green once the row is implemented.
  - file: tests/checks/contracts/validate_contract_drift/test_declared_subtree.py
    action: Create
    purpose: >-
      A listed member under a declared sub-tree is admitted; an unlisted file, a wrong extension, a listed-but-missing
      member, a member carrying a contract block and an index that is not Class D with the row's evaluator each FAIL;
      a nested file under an undeclared directory still FAILS; the real tree passes.
  - file: tests/checks/executor/test_persona_leash_boundary.py
    action: Create
    purpose: >-
      A rec targeting scripts/persona_contracts/render.py, scripts/checks/contracts/validate_persona_contracts.py and
      tests/persona_contracts/test_render.py each derives automatable false through scripts/ops_portal/risk_scoring.py's
      boundary match (red before b07).
bundled_recommendations: []
followon_recs: [rec-5050]
closes_criteria: ["T4.10a:c2", "T4.10a:c3", "T4.10a:c4", "T4.10a:c6", "T4.10a:c7", "T4.10a:c8"]
infrastructure_dependencies: []
acceptance_criteria:
  - The four bound files (executor-personas.yaml, contract-population.yaml, ports.yaml, capabilities.yaml) equal main plus the approved sidecar's 7 blocks, word for word (approved_text verify exits 0 at the approved digest).
  - validate_persona_contracts and validate_persona_contract_binding are registered in both sequences, green on the real tree, and each rule has a red fixture test asserting its failure string.
  - validate_contract_drift admits exactly the declared sub-tree's listed members and still fails every other non-depth-1 file under docs/contracts.
  - The renderer is deterministic, strict on placeholders and puts the quoted-content clause first; --check fails a stale rendered prompt.
  - A rec targeting any of the leash's new code or test paths derives automatable false.
  - T4.10a reads in_progress with c2, c3, c4, c6, c7 and c8 met by persona-contracts-verdict-slice; c1 and c5 stay open.
  - The fast tier gains no dependency; jsonschema is used only by a full-tier test.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: plan and sidecar merged, branch current."
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-persona-contracts-verdict-slice.yaml
      && git cat-file -e origin/main:docs/plans/approved/persona-contracts-verdict-slice.yaml && git merge-base
      --is-ancestor origin/main HEAD && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: A missing plan or sidecar means the plan PR has not merged, so stop. A failed ancestry test means a stale branch, so merge origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The four bound files are exactly main plus the approved sidecar, at its approved digest.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-contracts-verdict-slice --base origin/main
      --expect 37bf952dc96a4bb411d1e6be81ef491fcc32041f8083cd02196e35314fac3686
    expected: Exit 0, printing APPROVED-TEXT OK. Red before the sidecar blocks are placed.
    fix_if: >-
      A word mismatch means a placed block drifted: restore its after text exactly, never edit the sidecar. A digest
      mismatch means the sidecar on main is not the approved one: stop and ask the operator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A base-relative, one-time binding of this build's diff to its sidecar; validate_merge_step enforces the same
      binding on the build PR's fast tier.
  - step: 3
    phase: pre-deploy
    action: The mechanism's own test files, whole.
    command: >-
      bin/venv-python -m pytest -q tests/persona_contracts tests/checks/contracts/test_validate_persona_contracts.py
      tests/checks/contracts/test_validate_persona_contract_binding.py
      tests/checks/contracts/validate_contract_drift/test_declared_subtree.py
      tests/checks/executor/test_persona_leash_boundary.py
    expected: >-
      Exit 0 with no failures; test_schema_metaschema.py is skipped only where jsonschema is absent. Red before: every
      file is absent on main.
    fix_if: Fix the code the failing test names, never the assertion.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The created files are the standing guard: the --pre affected set selects them whenever their sources change and
      the full tier runs them on main; a registry row would duplicate them.
  - step: 4
    phase: pre-deploy
    action: The real tree passes both new checks and the drift check, each declaring what it examined.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_persona_contracts import validate_persona_contracts as
      a; from scripts.checks.contracts.validate_persona_contract_binding import validate_persona_contract_binding as b;
      from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as c; f=[]; a(f); b(f); c(f);
      print(f); raise SystemExit(1 if f else 0)"
    expected: Exit 0 after printing an empty failure list; each check prints its own section header.
    fix_if: >-
      An unresolved evaluator means the module lost its executable "executor-personas.yaml" literal or its manifest
      Entry; a boundary failure means b07 is not placed. Fix the code, never the contract text.
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-contract-checks-real-tree
  - step: 5
    phase: pre-deploy
    action: The renderer check runs on the real tree.
    command: bin/venv-python -m scripts.persona_contracts.render --check
    expected: Exit 0, printing RENDER-CHECK OK 0 (no persona contract is registered yet).
    fix_if: A non-zero exit on the empty index means the CLI treats an empty index as an error; fix render.py.
    hermetic: true
    expected_literals: ["RENDER-CHECK OK 0"]
    graduation: graduate
    graduation_check_id: persona-render-check-real-tree
  - step: 6
    phase: pre-deploy
    action: The hub-and-spoke, patch and merge rules (T4.10a c3, c8) and the unbounded and dollar budget rules (c2) by name.
    command: >-
      bin/venv-python -m pytest -q tests/checks/contracts/test_validate_persona_contracts.py -k "hub_and_spoke or
      persona_parameter or refused_bound_verb or refused_target or edit_repo_outside_implement_agent or
      unbounded_budget or dollar_budget or harness_tool_name or unknown_capability or missing_schema"
    expected: Exit 0, at least ten selected tests passing, none deselected to zero.
    fix_if: A test selecting nothing means a rule's test is missing or misnamed; add it under the named rule.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A named subset of step 3's file, which is already the standing guard.
  - step: 7
    phase: pre-deploy
    action: The declared sub-tree is a closed set and an undeclared nested file still fails.
    command: bin/venv-python -m pytest -q tests/checks/contracts/validate_contract_drift/
    expected: Exit 0; the existing extension-depth tests pass unchanged beside test_declared_subtree.py.
    fix_if: An existing extension-depth test failing means the exception widened beyond the declared rows; narrow the code, never the test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: An existing directory already run by the full tier; step 3 covers the new file.
  - step: 8
    phase: pre-deploy
    action: The roadmap reads T4.10a in_progress with the six criteria met and the roadmap model still loads.
    command: >-
      bin/venv-python -c "import yaml; d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); i=[t for t in
      d['tier_items'] if t['id']=='T4.10a'][0]; s={c['id']:c['status'] for c in i['exit_criteria']}; ok=i['status']=='in_progress'
      and all(s[c]=='met' for c in ['c2','c3','c4','c6','c7','c8']) and s['c1']==s['c5']=='open'; print('T4.10A OK' if ok
      else 'T4.10A WRONG', i['status'], s)" && bin/venv-python -m scripts.roadmap.platform_roadmap > /dev/null && echo ROADMAP-LOADS
    expected: Prints T4.10A OK and ROADMAP-LOADS.
    fix_if: A wrong status means STEP 5's flips were not applied; apply them exactly as written there.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Fast tier on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the named failure on the branch; never skip, disable or quarantine a test.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Full tier before handoff (handoff_policy), started in the background from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports a completed full run for HEAD with exit 0.
    fix_if: A red full tier blocks handoff; fix and rerun from the start. A timeout is blocked, never a warning.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/contracts/_population.py
    behavior: declared_subtrees load and the closed-set member failures
    verification_step: 7
    test_selector: tests/checks/contracts/validate_contract_drift/test_declared_subtree.py
    red_green_expectation: red before (file and functions absent), green after
  - source: scripts/checks/contracts/validate_contract_drift.py
    behavior: the extension/depth pass admits only listed sub-tree members and runs the member check every run
    verification_step: 7
    test_selector: tests/checks/contracts/validate_contract_drift/test_declared_subtree.py
    red_green_expectation: red before (an admitted member fails the depth rule), green after
  - source: scripts/persona_contracts/__init__.py
    behavior: facade re-exports
    verification_step: 3
    test_selector: tests/persona_contracts/test_schema.py
    waiver_reason: Re-export facade with no logic; every exported name is exercised through test_schema.py and test_render.py.
  - source: scripts/persona_contracts/schema.py
    behavior: index and contract models, schema-dialect checker, capability parser
    verification_step: 3
    test_selector: tests/persona_contracts/test_schema.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/persona_contracts/render.py
    behavior: deterministic strict render with the clause first, and the --check CLI
    verification_step: 3
    test_selector: tests/persona_contracts/test_render.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/contracts/validate_persona_contracts.py
    behavior: every c2, c3, c5-mechanism, c6, c7 and c8 rule plus self-coverage by boundary_patterns
    verification_step: 6
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py
    red_green_expectation: red before (module absent), green after; each red fixture fails on its own rule's string
  - source: scripts/checks/contracts/validate_persona_contract_binding.py
    behavior: pending, implemented and landing-dir binding rules (c4)
    verification_step: 3
    test_selector: tests/checks/contracts/test_validate_persona_contract_binding.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/contracts/_manifest.py
    behavior: both checks registered in the pre and full sequences
    verification_step: 3
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py::test_both_checks_registered_in_both_sequences
    red_green_expectation: red before (neither check registered), green after
  - source: config/ci_rca_taxonomy.yaml
    behavior: category rows for the two checks
    verification_step: 9
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: Registration data; validate_ci_rca_taxonomy in the fast tier fails any registered check without its row.
  - source: config/agent/executor/capabilities.yaml
    behavior: the leash's code and test paths are executor boundary paths
    verification_step: 3
    test_selector: tests/checks/executor/test_persona_leash_boundary.py
    red_green_expectation: red before b07 (each rec derives automatable true), green after
  - source: docs/contracts/executor-personas.yaml
    behavior: the index the validator reads
    verification_step: 3
    test_selector: tests/persona_contracts/test_schema.py
    red_green_expectation: red before (file absent), green after (the real index parses)
  - source: docs/contracts/contract-population.yaml
    behavior: the declared_subtrees row the drift check reads
    verification_step: 7
    test_selector: tests/checks/contracts/validate_contract_drift/test_declared_subtree.py
    red_green_expectation: red before (no declared_subtrees key), green after
  - source: .gitattributes
    behavior: rendered prompts are never newline-converted
    verification_step: 3
    test_selector: tests/persona_contracts/test_render.py::test_rendered_prompts_are_not_text_converted
    red_green_expectation: red before (git check-attr reports text unspecified), green after (text unset)
constraints:
  - Place every sidecar block byte for byte (only {{DATE}} and {{N}} are filled); never edit the sidecar (Decision 246). Any other edit to the four bound files fails approved_text verify. The roadmap is not bound; its edits are exactly STEP 5's.
  - No persona contract, template or rendered prompt lands here; those are PLAN-persona-contracts-verdict-personas (rec-5050) and PLAN-persona-contracts-compute-plane.
  - config/agent/executor/personas.yaml is not created (settled with notice; no criterion needs it).
  - No new fast-tier dependency (coordinator build_conventions); jsonschema only in the importorskip full-tier test.
  - scripts/validate.py is not edited; registration is the manifest (Decision 169). Decompose any file that passes 500 SLOC (Decision 128).
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test.
  - Decision 235 cl.1 - the only loosened check is validate_contract_drift's extension/depth rejection, narrowed to the declared sub-tree and confirmed by the operator; every existing extension-depth assertion stays.
