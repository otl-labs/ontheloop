infrastructure_dependencies:
- 'LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition. compute_affected_artifacts(<this plan''s scope>) returns
  {''data-pipeline'': [''docs/ROADMAP-PLATFORM.yaml'']}, because the live roadmap is a packaged asset of the active data-pipeline artifact
  (src/lambdas/data-pipeline/manifest.yaml). No build, deploy or smoke test is owed: the change to that asset is data only (T4.14''s text,
  status and edge; no packaged code); its sole runtime reader, src/data/handlers/scheduled_agent_handler.py, puts the raw text into a prompt
  behind a disabled schedule (T4.12 owns repointing the manifest consumers); the asset refreshes with the artifact''s next governed deploy.
  No other scope file is Lambda-packaged and no .tf file is in scope. Decision 79''s per-Lambda build, deploy and smoke obligation, keyed
  off the manifest graph, is knowingly not applied to this data-only asset change; that standing gap is rec-3846''s (no new rec). Precedent:
  PLAN-persona-first-migration.'
acceptance_criteria:
- Exactly one Decision titled 'Persona evaluation is an offline lane ...' exists, at or under 6,144 bytes when added, with a bare yaml envelope
  (amends [221], significance numbered_decision), a title whose only amends edge is 221, four clauses (offline lane and run records -- unit
  of record not a concurrency limit, replay and shadow modes, per-model records and ensembles; the grader -- code checks, real outcomes and
  blind operator adjudication, never an LLM; faithful sealed point-in-time inputs; roster of five doing and two judgment personas, and spend
  measured, uncapped outside the loop and under Decision 217 cl.4's caps beside a loop run, operator-initiated), a Rationale naming the RL
  framing and Harness^2, a monitored reversal stanza and a Coverage line (VP 1-2).
- Decision 221 carries one dated Amended-by line naming the minted number, its clause 2 and 7 openings intact; decisions-index.json is fresh
  (VP 3-4).
- T4.14 is the offline persona-evaluation lane, parked deferred_post_mvp, depending on T4.10a and not T4.2, with no live dependent (Decision
  93); its intent names the targets (implement_agent first feasible, the advice consult highest leverage, implement_agent and CI-RCA the
  strong early candidates) and builds on the persona items' capture; c1-c3 carry dated brackets and c4-c10 the lane's rules, including consult
  (c8) and CI-RCA (c9) grading and point-in-time replay (c10); no model, vendor or subscription-tier name appears in it or in Decision 231
  (VP 2 and VP 5 denylist legs); the exr050809 concept phrases survive (VP 5, VP 8).
- roadmap-exr050809-t4-13-14-t5-6-shape is retired by a 100% rename into entries/deprecated/ and replaced by roadmap-exr050809-shape-t414-parked
  with its T4.13, T5.6 and T4.4 legs verbatim; the governance note names the replacement; no live surface names the retired id (VP 6-7).
- rec-4503..rec-4509 are open, each naming the operator as owner of the six open decisions (VP 9); the full tier passes (VP 1); after merge
  the Decision row reaches the warehouse (VP 10).
