slug: persona-eval-lane
intent: 'Record Decision 231 (offline persona-evaluation lane): a persona run is the unit of record (never a concurrency limit), by offline
  replay or shadow runs that never bind live work or file recs; every grade comes from deterministic code checks, real-outcome replay and
  the operator''s blind adjudication, never an LLM; inputs are point-in-time and sealed apart from this public repository behind IAM and
  network; each record names its model, ensembles record per arm; the roster is the five doing personas plus two judgment personas (the advice
  consult and CI-RCA); eval LLM spend is measured on its own line and adds no budget -- uncapped outside the loop, under Decision 217''s
  caps beside a loop run -- every run and shadow arm operator-initiated. The Decision amends Decision 221 clauses 2 and 7; T4.14 is re-scoped
  in place to the lane (with the judgment personas'' grading) and parked deferred_post_mvp on T4.10a; the design''s open decisions and build
  items are filed as rec-4503..rec-4509. Governance, roadmap and registry encoding only -- no code, workflow, terraform, IAM, spend, eval
  run or deploy; the lane is post-MVP and this plan lays its foundation.'
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V1
plan_path: docs/plans/PLAN-persona-eval-lane.yaml
phase: 'Platform T4 (executor): T4.14 re-scoped to the offline persona-evaluation lane and parked deferred_post_mvp; Decision 221 annotated.
  Names no CD.27-gated item, so no fallback_reevaluation block is owed.'
