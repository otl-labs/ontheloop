schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-findings-contract
intent: >-
  Give every verdict persona run a typed record of what it found, so the dual-run agreement measure (T4.28 c5, T4.29
  c4, T4.30 c4) and the offline persona-evaluation lane (T4.14, Decision 231 cl.2) compare and grade personas by their
  findings, not by one integer (NS.6). Plan A of 2 for rec-4434: a new Class A contract, telemetry_persona_findings,
  declaring a relation DERIVED AT READ with no physical table, at grain (agent_run_id, finding_ordinal,
  projection_version), ordinal 0 the run's verdict row; a pure projection, scripts/persona_contracts/findings.py, that
  turns a persona run's PERSONA_RESULT line, or a run_persona result already validated against the persona's
  output_schema, into those rows for all three verdict personas; and the in-session code-review skill's PERSONA_RESULT
  line. Plan B (rec-5254) adds the plan-critique and decision-scout lines, the Actions-lane input and the live read, and
  closes rec-4434.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-findings-contract.yaml
phase: >-
  rec-4434 (open), the CAPTURE FROM DAY ONE prerequisite of T4.28 c3, T4.29 c2 and T4.30 c2 ("rec-4434 (per-finding
  rows) before dual-run starts"); closes no criterion and leaves rec-4434 open: plan B (rec-5254) closes it, so the
  roadmap's "closed before dual-run" is not overstated. V2: Python and contract text only, nothing deployed, no
  warehouse read or write.
closes_criteria: []
cites: [dec:118, dec:199, dec:200, dec:221, dec:229, dec:231, dec:239, dec:246]
scope:
  - file: docs/contracts/telemetry_persona_findings.yaml
    action: Create
    purpose: >-
      The Class A contract, word for word as sidecar block c01-contract binds it: 18 fields (tenant_id and project_id by
      $ref, Decision 200; agent_run_id, finding_ordinal, agent_type, definition_sha256, lane, kind, verdict, finding_id,
      severity, origin, anchor, subject_sha, subject_dirty, parse_status, projection_version, source_event_id), every
      field (the two $ref ones too, which the reconcile-pending gate reads) carrying derivation {timing: read, derived_by: library:scripts.persona_contracts.findings.project_result,
      realized: false}; status draft; no projects_to (no table, no generator registration); governance_notes name the
      materialization triggers (T2.52 c1, never a second journal) and the capture-only rule.
    new_imports: []
  - file: .claude/skills/code-review/SKILL.md
    action: Modify
    purpose: >-
      Sidecar blocks k01-k07, word for word: the report ends with one PERSONA_RESULT line (verdict, subject_sha,
      subject_dirty, findings with id, severity, origin, anchor), and five sentences are compacted with their meaning
      kept so the file stays at its prose budget (12568 bytes, config/prose_budgets.yaml, zero headroom). No heading,
      step number or the Verdict line changes (tests/persona_contracts/test_verdict_persona_contracts.py reads them).
    new_imports: []
  - file: scripts/persona_contracts/findings.py
    action: Create
    purpose: >-
      The projection. Public surface: PROJECTION_VERSION = 1; BLOCK_MARKER = "PERSONA_RESULT: "; RunIdentity (frozen
      dataclass: tenant_id, project_id, agent_run_id, agent_type, definition_sha256, lane); FindingRow (frozen
      dataclass whose field names are exactly the contract's 18 fields); LISTS, the per-persona finding lists the
      contract's kind, finding_id, severity, origin and anchor semantics name (code_reviewer and plan_critic: findings
      -> finding with id, severity, origin, anchor; decision_scout: contradictions -> contradiction, anchor
      dec:<decision>; spirit -> spirit, anchor target; roadmap.rows -> roadmap, severity the lane, anchor item; cite ->
      cite, id cite:<decision>, anchor dec:<decision>, no severity); project_result(identity, *, text=None, result=None,
      subject_sha=None, source_event_id=None) -> list[FindingRow]. Behaviour: the persona is the executor-personas.yaml
      row whose registry_key equals identity.agent_type (scripts.persona_contracts.load_index); text is read for the
      LAST line that starts with BLOCK_MARKER, its rest parsed as one JSON object; a given result is used as is. The
      object is validated (jsonschema, the dialect the persona contracts use) against a schema derived from the
      persona contract's output_schema: its verdict property, the LISTS arrays with item properties restricted to the
      mapped keys plus decision where an anchor or id needs it, every other property optional, plus optional
      subject_sha (40 lower-case hex) and subject_dirty (boolean); additionalProperties is not enforced, so a full
      validated run_persona result passes too. Status: parsed; block_absent (text has no marker line);
      block_invalid (bad JSON or schema failure); content_unavailable (text and result both None). Only parsed yields
      finding rows; every status yields the ordinal-0 verdict row (kind verdict, verdict NULL unless parsed), so a run
      is never dropped. subject_sha: the argument when given, else the object's. The function never raises on its
      inputs (an unknown agent_type is the one ValueError: not a verdict persona). No I/O beyond reading the two
      contracts; no warehouse, network or transcript access; stdlib, yaml and jsonschema only. Under 500 SLOC.
    new_imports: [scripts.persona_contracts]
  - file: tests/telemetry/test_persona_findings.py
    action: Create
    purpose: >-
      Nodes (each red before: the module and fixtures are absent): test_code_review_findings_block_yields_one_row_per_finding
      (rec-4434's acceptance; the two-finding fixture yields ordinals 0, 1, 2, kind verdict then finding, verdict
      REVISE on all three, severity, origin, anchor and finding_id as in the fixture, subject_sha and subject_dirty
      copied, identity fields copied, parse_status parsed, projection_version 1, no field holds the finding title);
      test_a_run_without_findings_keeps_its_verdict_row (one row, verdict PROCEED);
      test_unreadable_results_keep_only_the_verdict_row (no-block fixture -> block_absent; a marker line with bad JSON
      and one with severity Urgent -> block_invalid; text and result None -> content_unavailable; each one row, verdict
      NULL); test_masked_text_still_projects (the masked fixture, whose prose holds detector tokens, projects like the
      two-finding fixture); test_validated_results_project_for_every_verdict_persona (an in-test dict per persona
      shaped like its full output_schema, including decision_scout's four lists, maps to the kinds, ids, severities
      and anchors the contract names, in list order); test_lists_cover_every_finding_list_of_each_persona_contract
      (drift guard: every array property of each verdict persona contract's output_schema whose items carry a severity,
      plus decision_scout's cite and roadmap.rows, is in LISTS, and every LISTS key exists in that schema);
      test_the_code_review_skill_prints_the_block_the_projection_reads (the PERSONA_RESULT template line in
      .claude/skills/code-review/SKILL.md names exactly the keys the projected code_reviewer schema reads);
      test_contract_fields_match_the_row (the contract loads with scripts.contracts.load_contract as Class A, every
      field's derivation timing is read, and its field names equal FindingRow's).
    new_imports: [scripts.persona_contracts.findings, scripts.contracts]
  - file: tests/telemetry/fixtures/persona_findings/code_review_two_findings.txt
    action: Create
    purpose: A code-review final report ending in a PERSONA_RESULT line with two findings (one High judgement, one Low mechanical), verdict REVISE.
    new_imports: []
  - file: tests/telemetry/fixtures/persona_findings/code_review_no_findings.txt
    action: Create
    purpose: A PROCEED report whose PERSONA_RESULT line has an empty findings list.
    new_imports: []
  - file: tests/telemetry/fixtures/persona_findings/code_review_no_block.txt
    action: Create
    purpose: A report in today's format (FINDINGS JSON lines and a Verdict line, no PERSONA_RESULT line).
    new_imports: []
  - file: tests/telemetry/fixtures/persona_findings/code_review_masked.txt
    action: Create
    purpose: The two-finding report with masking tokens in its prose, as the masked content reader would serve it (Decision 239).
    new_imports: []
bundled_recommendations: []
followon_recs: [rec-5254]
infrastructure_dependencies: []
acceptance_criteria:
  - "tests/telemetry/test_persona_findings.py::test_code_review_findings_block_yields_one_row_per_finding passes (rec-4434's filed acceptance), and the whole file passes."
  - "docs/contracts/telemetry_persona_findings.yaml and the code-review skill edits match docs/plans/approved/persona-findings-contract.yaml word for word (approved_text verify)."
  - "The contract is a Class A draft with every field derived at read and no physical table: no generator, writer, reader, DDL or field_semantics change, and no new process_event name."
  - "The code-review skill stays at 12568 bytes, its headings, step numbers and Verdict line unchanged."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-4434's acceptance node.
    command: bin/venv-python -m pytest "tests/telemetry/test_persona_findings.py::test_code_review_findings_block_yields_one_row_per_finding" -q
    expected: exit 0; red before (the test file does not exist).
    fix_if: rows or fields differ from the fixture; fix the projection, never the fixture's words
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: persona-findings-code-review-block
  - step: 2
    phase: pre-deploy
    action: The skill's line and the projection stay in step.
    command: bin/venv-python -m pytest "tests/telemetry/test_persona_findings.py::test_the_code_review_skill_prints_the_block_the_projection_reads" -q
    expected: exit 0; red before (the test file does not exist).
    fix_if: the skill's template line and the projected schema name different keys
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: persona-findings-skill-block-in-step
  - step: 3
    phase: pre-deploy
    action: The projection follows every verdict persona contract's finding lists.
    command: bin/venv-python -m pytest "tests/telemetry/test_persona_findings.py::test_lists_cover_every_finding_list_of_each_persona_contract" -q
    expected: exit 0; red before (the test file does not exist).
    fix_if: a persona contract's finding list is unmapped or LISTS names a list the contract lacks
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: persona-findings-lists-cover-contracts
  - step: 4
    phase: pre-deploy
    action: The whole new test file.
    command: bin/venv-python -m pytest tests/telemetry/test_persona_findings.py -q
    expected: exit 0
    fix_if: any node fails
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A whole-file re-run of the file this plan creates (hermetic_authoring rule (v)); steps 1-3 graduate its standing
      guards and the full tier runs the rest.
  - step: 5
    phase: pre-deploy
    action: Bind the contract and the skill edit to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-findings-contract --base origin/main
    expected: exit 0; every block matches word for word
    fix_if: any word differs; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar on
      every PR declaring this plan.
  - step: 6
    phase: pre-deploy
    action: No physical table, writer, reader or registry change rides along.
    command: >-
      git diff --name-only origin/main...HEAD | grep -E '^(config/lambda/ducklake/field_semantics.yaml|src/lambdas/|src/common/ducklake|src/telemetry/|src/turn_capture/|scripts/schema_to_field_semantics.py|scripts/field_semantics_event_projection.py|config/telemetry/)' ; test $? -eq 1
    expected: exit 0 (grep finds no such path)
    fix_if: a listed path changed; this plan derives at read only, so revert that change
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable guards.
test_obligations:
  - source: scripts/persona_contracts/findings.py
    behavior: a persona run's PERSONA_RESULT line or validated result becomes one verdict row plus one row per finding; an unreadable result keeps only the verdict row
    verification_step: 1
    test_selector: tests/telemetry/test_persona_findings.py::test_code_review_findings_block_yields_one_row_per_finding
    red_green_expectation: red before (module and test absent), green after
  - source: .claude/skills/code-review/SKILL.md
    behavior: the in-session reviewer ends its report with the PERSONA_RESULT line the projection reads
    verification_step: 2
    test_selector: tests/telemetry/test_persona_findings.py::test_the_code_review_skill_prints_the_block_the_projection_reads
    red_green_expectation: red before (no PERSONA_RESULT line, test absent), green after
  - source: docs/contracts/telemetry_persona_findings.yaml
    behavior: the contract is a Class A derived relation whose fields equal the projection's row
    verification_step: 4
    test_selector: tests/telemetry/test_persona_findings.py::test_contract_fields_match_the_row
    red_green_expectation: red before (contract and test absent), green after
constraints:
