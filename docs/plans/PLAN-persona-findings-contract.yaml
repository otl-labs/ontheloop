  - "Derived at read (Decision 199 cl.1): no physical table, DDL, telemetry writer or reader change, generator registration or production step; materialization waits for a named trigger under T2.52 c1 and is never a second journal (Decision 221)."
  - "No parsing in the claude_code capture producer: src/turn_capture/ and config/telemetry/ are not in scope (its parser_version is dedupe-authoritative; Feedback Loop owns it)."
  - "Finding text is never a field (CD.51); the row points at it by source_event_id, read through the masked content reader only (Decision 239)."
  - "The contract and the skill edit land word for word as docs/plans/approved/persona-findings-contract.yaml binds them (Decision 246); a change to either is a plan amendment that goes to the operator first."
  - "The plan-critique and decision-scout skills are not edited here (rec-5254 lands both together)."
  - "No rescue agents or workaround loops (Decision 55)."
