  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    .claude/skills/plan-critique/SKILL.md, each an exact one-occurrence replacement. (a) Step 13 line becomes:
    "13. Produce this structured output, ending with one `PERSONA_RESULT: ` JSON line, one findings item per finding,
    in order:". (b) Inside the fence, after the **Recommendation:** line, add a blank line, then:
    PERSONA_RESULT: {"verdict": "[PROCEED|REVISE]", "subject_sha": "[git rev-parse HEAD]", "subject_dirty": [true|false: uncommitted changes], "findings": [{"id": "[check]:[anchor]", "severity": "[blocking|nit]", "origin": "[mechanical|judgement]", "anchor": "[plan field path or VP step id]"}]}
  - >-
    plan-critique compaction (meaning kept): step 5 "Read every `scope` file to verify the plan's accuracy."; step 8's
    last question "Beyond the stated phase?"; step 10 "What could invalidate the approach before execution (an
    unavailable dependency, a pending decision, an unverified assumption)?"; step 11 "Flag any criterion that is vague,
    subjective or untestable ("improved performance" with no metric)."; 12b "Stubs: no deploy (Decision 79)."; 12c's
    last sentence "Either failing: REVISE naming the steps."; 12l's last sentence "No in_progress tier_item: exempt.";
    12m "(`status: active` in its manifest, Decision 79; a stub does not) => `V3`; ... A lower declared tier => REVISE
    citing the scope file and the tier it demands."; Quality Gate drops ", and your Files Read count matches the scope
    entry count" (the template's Files Read line keeps that rule).
  - >-
    .claude/skills/decision-scout/SKILL.md. (a) Step 9 gains: "The last line is one JSON object: one item per
    CONTRADICT, SPIRIT, ROADMAP row and CITE above, in order." (b) Inside the fence, after the "(Planning agent: copy
    both count lines ...)" line, add:
    PERSONA_RESULT: {"verdict": "[NO_FLAGS|FLAGS_FOUND|BLOCK]", "contradictions": [{"id": "contradict:[N]", "decision": [N], "severity": "[BLOCK|WARN|NOTE]"}], "spirit": [{"id": "spirit:[N|NS.n|mission]", "target": "[Decision N|NS.n|mission]", "severity": "[WARN|NOTE]"}], "roadmap": {"rows": [{"id": "roadmap:[T-N.M]", "item": "[T-N.M]", "lane": "[CONFLICT|CITE|RELATED]"}]}, "cite": [{"decision": [N]}]}
  - >-
    decision-scout compaction (meaning kept): Intent "then surface every relevant active decision (CITE, CONTRADICT,
    RELATED or SPIRIT, Phase 2) and any roadmap tier_item its Scope touches (ROADMAP, step 8b). Triage is BOUNDED
    (step 1):"; step 2 and its five bullets become one line "2. Read the caller's brief: **Intent** (`/plan` Step 3),
    **Proposed approach** (Steps 3-5), **Scope file list** (Step 4), **Verification Tier** (Step 5) and **Explicitly
    cited decision IDs**. Any input absent: return `Verdict: BLOCK` and one line:" followed by the unchanged quoted
    note; step 4 ends "(offset/limit to the next heading)."; step 10's tail "(only the judgement pass stops; the lane
    never retires)."; the migration heading "(T1.5 c1 owns this)"; Quality Gate merges the two CITE/CONTRADICT lines
    into "Every CITE and CONTRADICT names an indexed decision; every CONTRADICT has a clause citation AND a severity"
    and the two SPIRIT lines into "SPIRIT flags: <= 3, each with a verbatim gate (ii) quote; no decision in both SPIRIT
    and CONTRADICT, and no north star in CONTRADICT"; Anti-patterns "**Editing files.** Read-only: file a rec instead."
  - >-
    tests/telemetry/test_persona_findings.py: add test_every_verdict_skill_prints_the_block_the_projection_reads with
    helpers. For each executor-personas row whose persona is in LISTS: read the skill from the persona contract's
    skill_tether.skill; require exactly one line starting with BLOCK_MARKER; substitute only the bare placeholders
    after '": ' ([N] -> 1, [true|false...] -> true) and json.loads it; walk it against projected_schema: every dict
    key is collected, every list holds one example item, every enum leaf is "[a|b|...]" whose alternatives equal the
    schema enum as a set (filled with the first enum value), every integer leaf is an int; assert the collected keys
    equal all projected-schema property names plus {subject_sha, subject_dirty} unless the persona is decision_scout;
    then project_result on "report\n" + the filled line gives parse_status parsed and row kinds equal to LISTS order.
    Keep every existing node.
  - "Lower config/prose_budgets.yaml's two S4 entries to the measured sizes (VP step 4); the plan-critique line keeps its inline raise-approved dec-75 marker comment unchanged (Decision 165)."
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - 'Report: what was implemented, verification results'
rollback: Revert the squash commit; the projection and contracts are untouched, so no data or reader changes back.
