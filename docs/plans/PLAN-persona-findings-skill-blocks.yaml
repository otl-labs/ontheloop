schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-findings-skill-blocks
intent: >-
  Make every in-session plan-critique and decision-scout run leave a machine-readable result, so the derived relation
  telemetry_persona_findings can read them and the plan_critic and decision_scout dual-runs (T4.29 c4, T4.30 c4) count
  agreement from per-finding rows (NS.6). Both skills end their reports with one PERSONA_RESULT line shaped by that
  persona's contract output_schema as scripts/persona_contracts/findings.py LISTS reads it, as the code-review skill
  already does (rec-5741, the skills half of rec-5254).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-findings-skill-blocks.yaml
phase: >-
  rec-5741 (split of rec-5254, which closes rec-4434): the CAPTURE FROM DAY ONE prerequisite of T4.29 c2 and T4.30 c2
  ("rec-4434 (per-finding rows) before dual-run starts"). Lands before either persona's dual-run window opens, since
  each edit changes that persona's definition_sha256 (rec-4433). Sibling rec-5742 (Actions half) is planned apart.
closes_criteria: []
cites: [dec:118, dec:127, dec:128, dec:199, dec:229, dec:231, dec:279]
amends: []
introduces: []
scope:
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Phase 3 step 13 ends the structured output with one PERSONA_RESULT line (verdict, subject_sha, subject_dirty,
      findings with id, severity, origin, anchor); compaction elsewhere keeps the file at or under its 17768-byte prose
      budget. Item 12p and Phase 2b stay byte-identical.
  - file: .claude/skills/decision-scout/SKILL.md
    action: Modify
    purpose: >-
      Phase 3 step 9 ends the report with one PERSONA_RESULT line (verdict; contradictions, spirit, roadmap.rows and
      cite as decision_scout's output_schema names them); compaction keeps it at or under its 11157-byte budget.
  - file: tests/telemetry/test_persona_findings.py
    action: Modify
    purpose: >-
      test_every_verdict_skill_prints_the_block_the_projection_reads (rec-5741 and rec-5254 acceptance): for every
      persona LISTS covers, its tethered skill prints exactly one PERSONA_RESULT line whose keys equal the projected
      schema's (plus subject_sha and subject_dirty except for decision_scout), whose enum placeholders list exactly
      the schema's enum, and whose filled example projects parsed with one row per finding list.
bundled_recommendations: [rec-5741]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The code-review, plan-critique and decision-scout skills each print exactly one PERSONA_RESULT line, and a filled
    example of each projects through project_result with parse_status parsed and one row per finding list
    (tests/telemetry/test_persona_findings.py::test_every_verdict_skill_prints_the_block_the_projection_reads).
  - Both skills stay within their prose budgets, plan-critique 12p and Phase 2b are byte-identical to main, and every
    existing guard pinning either skill's text stays green.
  - rec-5741 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5741's acceptance node (also rec-5254's).
    command: bin/venv-python -m pytest "tests/telemetry/test_persona_findings.py::test_every_verdict_skill_prints_the_block_the_projection_reads" -q
    expected: exit 0; red before (the node does not exist on main, and with the node added but the skills unedited it fails on the missing decision-scout line).
    fix_if: >-
      a skill's line names a key, enum value or list the projected schema lacks, or a filled example does not parse;
      fix the skill line, never the test's derivation from the persona contracts
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: persona-findings-every-skill-block
  - step: 2
    phase: pre-deploy
    action: The whole findings test file, including the code-review node the registry already pins.
    command: bin/venv-python -m pytest tests/telemetry/test_persona_findings.py -q
    expected: exit 0
    fix_if: any node fails
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A whole-file re-run of the test file this plan modifies (hermetic_authoring rule (v)); step 1 graduates the new
      node and the existing nodes are already registry guards.
  - step: 3
    phase: pre-deploy
    action: Every existing guard that pins either skill's text, tether or step ids stays green after the compaction.
    command: >-
      bin/venv-python -m pytest tests/persona_contracts/test_verdict_persona_contracts.py
      tests/test_decision_scout_north_star_lane.py tests/test_scope_projection.py
      tests/checks/decisions/test_validate_decision_currency.py tests/test_prose_context.py
      tests/test_planning_skill_split_test.py tests/test_serves_claim_verification.py tests/test_plan_decision_drafts.py
      tests/test_implementation_retrospective_skill_contract.py tests/test_plan_critique_guard_consequence_rules.py
      tests/test_workflow_skill_antidrift.py tests/checks/contracts/test_validate_skill_prose_relocation.py -q
    expected: exit 0 (250 passed, 1 skipped on the draft tree at plan time)
    fix_if: >-
      a pinned phrase, the Phase 2b hash, a step-id marker or the verdict tether broke; restore that text and compact
      elsewhere, never edit the pin
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      These files are already the standing guards for the pinned text (registry entries scout-north-star-lane-pins,
      serves-claim-verification-pins and others); graduating them again duplicates those checks.
  - step: 4
    phase: pre-deploy
    action: Both skills are within budget and every budget entry equals measured bytes (ratchet down).
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as f; x=[]; f(x); assert not x, x; print('PROSE_BUDGETS_OK')"
    expected: exit 0 and PROSE_BUDGETS_OK printed
    fix_if: an entry differs from measured bytes; lower the two S4 entries in config/prose_budgets.yaml to the measured sizes, never raise one
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the standing validate_prose_limits check, which both tiers already run over every gated surface;
      green before as well, so it is no red-before guard.
  - step: 5
    phase: pre-deploy
    action: Item 12p (gated wording) is unchanged, so the edit stays notice class.
    command: >-
      bin/venv-python -c "import subprocess,re; s=lambda t: re.search(r'(?ms)^12p\..*?(?=^### )', t).group(0); m=subprocess.run(['git','show','origin/main:.claude/skills/plan-critique/SKILL.md'],capture_output=True,text=True,check=True).stdout; h=open('.claude/skills/plan-critique/SKILL.md',encoding='utf-8').read(); assert s(m)==s(h); print('12P_UNCHANGED')"
    expected: exit 0 and 12P_UNCHANGED printed
    fix_if: the 12p item differs from main; revert that hunk, never route it through a sidecar inside this plan
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; approval-routing.yaml md_sections and the approved-text check
      guard 12p on every later PR.
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: rec-5741 closed by the squash merge's Resolves trailer.
    command: bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; r=make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5741')[0]; print(r['status'], r.get('resolution')); assert r['status']=='closed'"
    expected: closed
    fix_if: still open; check ci.yml's closure job run for the merge and the trailer line, then close through update_rec only if the acceptance node passes on main
    hermetic: false
test_obligations:
  - source: .claude/skills/plan-critique/SKILL.md
    behavior: the in-session critic ends its output with the PERSONA_RESULT line the projection reads
    verification_step: 1
    test_selector: tests/telemetry/test_persona_findings.py::test_every_verdict_skill_prints_the_block_the_projection_reads
    red_green_expectation: red before (no PERSONA_RESULT line, node absent), green after
  - source: .claude/skills/decision-scout/SKILL.md
    behavior: the in-session scout ends its report with the PERSONA_RESULT line the projection reads
    verification_step: 1
    test_selector: tests/telemetry/test_persona_findings.py::test_every_verdict_skill_prints_the_block_the_projection_reads
    red_green_expectation: red before (no PERSONA_RESULT line, node absent), green after
constraints:
  - "Notice class only (Decision 279): never touch plan-critique item 12p (approval-routing.yaml md_sections) or Phase 2b (hash-pinned); no approved-text sidecar."
  - No budget raise (config/prose_budgets.yaml, Decision 128 marker rule); compact other text with its meaning kept, then ratchet both S4 entries down to measured bytes.
  - No new numbered step in either skill (test_verdict_persona_contracts STEP_MAP and the rendered prompt templates would drift); the line lives inside steps 9 and 13.
  - No change to scripts/persona_contracts/findings.py, the persona contracts, telemetry_persona_findings.yaml or any Actions-lane file (rec-5742's scope).
  - No rescue agents or workaround loops (Decision 55).
