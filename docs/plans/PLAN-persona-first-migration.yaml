    work item (a rec today)'',''never pick_work_item'',''T4.21 c9, c11'',''never by the operator identity'',''rec-4043'',''T4.2 c7'')
    if w not in txt(''T4.31'')]; probs+=[(''T4.10a'',w) for w in (''HUB AND SPOKE'',''another persona'',''registered conformance check
