    import toxic_node_ids; d=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml'')); ti={x[''id'']:x for x in d[''tier_items'']}; kids={''T4.32'':[''T4.10a''],''T4.28'':[''T4.32''],''T4.30'':[''T4.32''],''T4.29'':[''T4.32''],''T4.15'':[''T4.21'',''T4.32''],''T4.31'':[''T4.15'']};
