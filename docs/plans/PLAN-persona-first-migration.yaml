    leg proves no session is called a loop host. Red on origin/main (asserted during planning: exits 1 on its own AssertionError).'
  command: 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m for m
    in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''Persona-first migration'' in m.group(2)];
    assert len(es)==1, (''expected exactly one persona-first Decision entry'', [m.group(1) for m in es]); n=es[0].group(1); b=es[0].group(0);
    assert int(n)>=229, n; fence=''^''+chr(96)*3+''yaml''; assert re.search(fence+r''\s*\nnumber: ''+n+r''\b'', b, re.M), ''no bare
    yaml envelope carrying number ''+n; assert ''value: numbered_decision'' in b and chr(10)+''amends: [205, 217]''+chr(10) in b, ''envelope
    significance or amends list''; from scripts.decisions_md import extract_amends_edges as ae; assert set(ae(es[0].group(2)))=={205,217},
    (''title amends edges'', ae(es[0].group(2))); cl=re.findall(r''^(\d)\. \*\*'', b, re.M); assert cl==[''1'',''2'',''3'',''4''], (''expected
    four clauses'', cl); need=[''Incremental delivery'',''Hub and spoke'',''Compute plane'',''Umbrella and strangler'',''interim coordinator'',''no
    MVP persona item depends on T4.1 or T4.22'',''approved IMPLEMENTATION plan'',''never fed from the rec queue'',''subscribe_pr_activity'',''Interim
    reading, pending rec-4478'',''Decision 67'',''two engines (Decision 185 cl.1) are unchanged'',''with implement_agent as the live
    vehicle'',''made before T4.15\''s first live run'',''Personas never invoke personas'',''sole planning-to-implementation handoff'',''never
    to the planning persona'',''persona_compute_host'',''launcher only'',''ecs:RunTask'',''iam:PassRole'',''separate executor task role'',''terraform/bootstrap
    admin-only apply'',''Decision 223 cl.2'',''file_pr'',''base-ref leash'',''second caller'',''plan_agent drafting its plan'',''operator-chosen
    work item (a rec today)'',''implement_agent on Fargate'',''long_running_container'',''ESB-04, ESB-06 and ESB-01'',''defer to T4.1'',''CD.17'',''That
    is sequencing'',''add, dual-run'',''CD.12 alarm-not-gate'',''per-persona flag'',''outage fallback'',''self-review gap closes at
    flip'',''covered by a scout verdict over an identical scout-input fingerprint (Decision 217 cl.8)'',''scout-input fingerprint (T4.32
    c4) changes'',''ready_for_review'',''T4.25'',''Decision 217 cl.8'',''abandoned'',''anti-abuse'',''workflow_dispatch'',''yaml reversal-conditions'',''session-start-ungovernable'',''actions-terms-flag'',''Coverage
    (Decision 181 cl.2)'',''T4.10a c8'',''T4.32 c1'',''T4.15 c14'',''PC-08'',''rec-4476'',''rec-2827'']; bb='' ''.join(b.split()); miss=[p
    for p in need if p not in bb]; assert not miss, (''persona-first Decision text missing'', miss); edges=re.findall(r''(?:amends|Amends|supersedes|Supersedes)
    Decision (\d+)'', b); assert edges and set(edges)<={''205'',''217''}, (''unexpected amends/supersedes edges'', edges); assert not
    re.search(r''\b(?:is|are|as) (?:the |an |a )?(?:interim )?loop host'', b), ''an interactive session is called a loop host''; print(''DEC_PERSONA_FIRST_OK'',
    n, len(b.encode(''utf-8'')))"'
  expected: Prints the marker, the minted number (229 at drafting) and the entry's byte size (6,137 at drafting).
  fix_if: A missing phrase means a clause was dropped or paraphrased -- restore STEP 1's text; over the cap means tighten prose.
  hermetic: true
  graduation: graduate
  graduation_check_id: persona-first-decision-recorded
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: 'DECISIONS 205, 217 AND 90 ARE ANNOTATED, NOT EDITED. 205 and 217 carry dated Amended-by lines (217''s records the formal
    amendment of clause 8: the T4.25 c1 pointer and its Coverage home are now T4.30''s flip, and every plan PR head SHA is covered by
