schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-first-migration
intent: 'Record Decision 229 (persona-first incremental migration): each of T4.2''s five personas ships as its own MVP roadmap item,
  consumable by interactive CC-web sessions and the /overseer as the interim coordinator before any loop host exists; personas never
  invoke personas; compute-plane personas start through the persona_compute_host port with the operator as launcher only and the executor
  App pushing their output; T4.2 stays the umbrella and T4.15 becomes implement_agent on Fargate. The Decision amends Decision 205 clauses
  1 and 6 and Decision 217 clause 8 (the pre-merge scout is fingerprint-keyed, never sampled). Governance, roadmap and contract-pointer
  encoding only -- no code, workflow, terraform, IAM, spend or deploy.'
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V1
plan_path: docs/plans/PLAN-persona-first-migration.yaml
phase: Platform T4 (executor). T4.2 decomposed into per-persona children (new T4.28-T4.31 plus T4.15 re-scoped), T4.25 reserved, T4.1/T4.10a/T4.21
  and CD.27 annotated (T4.21 c6 rehomed to T4.16), roadmap-liveness's excluded_reserved re-justified. T4.2 and T4.1 are CD.27-gated,
  so the fallback_reevaluation block is carried.
fallback_reevaluation:
  reevaluated_on: '2026-10-19'
  substrate_status: CD.27's layer-2 substrate is unratified; long_running_container stays presumptive (Decision 205 cl.6). This plan
    re-scopes T4.15 so its first live run (implement_agent on Fargate, started by the interim coordinator) is the confirmation; the
    durable_functions incumbent formally stands until T4.15 rules, and CD.43's store stays TBD.
  verdict: continue_on_current_substrate
  basis: No persona has executed, so unplanned_resume_rate has no data and no Lambda Durable Functions regression is recorded. The fallback_spec's
    lapse_condition fires only when T4.15 pins a non-replay substrate; T4.15 is re-scoped here, not run, so neither the trigger nor
    the lapse has fired.
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: New Decision 229 (four clauses, 6,137 B at drafting, envelope amends [205, 217]) above Decision 228 (STEP 1); dated Amended-by
    lines on Decisions 205 and 217 and a dated Update line on Decision 90 (STEPS 2-4); no existing body line edited.
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by scripts.decisions_index --write (STEP 34), never hand-edited.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: CD.27 ESB-04 note; T4.1 annotation and DEFERRED HALVES criterion; T4.2 umbrella annotation, edges, c7/c11 brackets, notes
    and hints; T4.10a c4 bracket and c8; T4.15 re-scope (name, intent amendment, edges, c12-c15, brackets, progress_note); T4.21 c6
    rehomed to T4.16 and c11; T4.25 reserved; new MVP items T4.28-T4.32, T4.32 the shared persona foundation (STEPS 5-26).
- file: docs/contracts/ports.yaml
  action: Modify
  purpose: fargate adapter owning_item -> T4.15:c12; coupling PC-08 (interim coordinator as the fargate adapter's launch assumption);
    amendment_log row (STEPS 27-29).
- file: docs/contracts/tier-item-lifecycle.yaml
  action: Modify
  purpose: archival_exceptions entry for reserved T4.25 (pinned by t425-t427-followon-items) and an amendment_log row (STEPS 30-31).
- file: docs/contracts/roadmap-liveness.yaml
  action: Modify
  purpose: A dated re-justification appended to node_classes.excluded_reserved for reserved T4.25 (no edge enters it) and an amendment_log
    row (STEPS 32-33).
bundled_recommendations: []
followon_recs:
- rec-4476
- rec-4477
- rec-4478
- rec-4479
- rec-4484
- rec-4490
infrastructure_dependencies:
- 'LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition. compute_affected_artifacts(<this plan''s scope>)
  returns {''data-pipeline'': [''docs/ROADMAP-PLATFORM.yaml'']}, because the live roadmap is a packaged asset of the active data-pipeline
  artifact (src/lambdas/data-pipeline/manifest.yaml). No build, deploy or smoke test is owed: the change to that asset is data only
  (tier-item text and edges, no packaged code); its sole runtime reader, src/data/handlers/scheduled_agent_handler.py, puts the raw
  text into a prompt behind a disabled schedule (T4.12 cF owns repointing the manifest consumers); the asset refreshes with the artifact''s
  next governed deploy. No other scope file is Lambda-packaged and no .tf file is in scope. Precedents: PLAN-roadmap-lifecycle-archival
  and PLAN-project-configuration-homes.'
acceptance_criteria:
- Exactly one Decision titled 'Persona-first migration ...' exists, at or under 6,144 bytes, with a bare yaml envelope (amends [205,
  217], significance numbered_decision), a title that names the clauses it amends, four clauses (incremental delivery with the interim
  freeze reading; hub and spoke; compute plane with T4.15's re-scope; umbrella and strangler with the draft/ready mapping and the fingerprint-keyed
  scout), a monitored reversal stanza, a Coverage line and title amends edges exactly {205, 217}; no session is called a loop host (VP
  2).
- 'Decisions 205 and 217 carry dated Amended-by lines (217''s for clause 8: its Coverage home and the identical-fingerprint scout coverage)
  and Decision 90 a dated Update line, each naming the minted number, with their bodies intact and 217 at or under 6,144 bytes; decisions-index.json
  is fresh (VP 3-4).'
- T4.32 persona foundation (transport, run_persona backend, image and channel, local twin, verdict chain and plan-PR routing) and T4.28
  code_reviewer, T4.30 decision_scout, T4.29 plan_critic, T4.15 implement_agent and T4.31 plan_agent are the T4.2 umbrella's children
  with their required edges -- T4.28, T4.30, T4.29 and T4.15 directly on T4.32, T4.31 on T4.15 (so it reaches T4.32 through T4.15),
  none reaching T4.1, T4.22, T4.9a or T4.2 -- and the operator's build order is a dated START-ORDER note; Decision 93 and the liveness
  baseline hold; every persona item (T4.28, T4.30, T4.29, T4.15 and T4.31) carries a CAPTURE FROM DAY ONE criterion discharging T4.2
  c3, and each verdict persona also carries add, dual-run (N at least 20, pre-registered), flip and remove criteria; each T4.2 atomic-plan
  slug resolves to one parent; T4.32 c4's fingerprint carries each cited and amended decision's content hash, names the single plan-edge
  extractor and owes a fingerprint-completeness test; T4.10a c4 is met by a registered conformance check that binds each persona as
  it lands and c8 bars persona-to-persona dispatch (VP 5).
- T4.15 is implement_agent on Fargate with the discharge split, the launcher-only IAM direction (further grants, the task execution
  role's iam:PassRole among them, asked of the human), the App-pushed output, day-one capture (c15), the c2/c5/c6/c9 brackets and the
  recorded abandonment; T4.25 is reserved with its criteria rehomed, declared in archival_exceptions, entered by no edge and re-justified
  in roadmap-liveness's excluded_reserved; T4.21 c6 is rehomed to T4.16; T4.1, T4.21 c11, CD.27 and T4.2 c7/c11 carry their notes (VP
  6-8).
- ports.yaml carries PC-08 and the re-pointed fargate owning_item, with no adapter row for a session (VP 9); every pinning shard replays
  green (VP 10); rec-4476..rec-4479, rec-4484 and rec-4490 are open (VP 11); the full tier passes (VP 1).
verification_plan:
- step: 1
  phase: pre-deploy
  action: Full tier on the committed, rebased, clean tree, then attest HEAD (git-ops handoff_sequence; Decision 163 pre-handoff run).
    The roadmap schema and graph, Decision 93, liveness, decision-entry conformance, the per-entry size cap, supersession annotations,
    index freshness, ports, fallback re-evaluation, graduation completeness and the differential replay all gate here.
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Exit 0 on a completed full-tier run, then --verify-head attests HEAD's tree.
  fix_if: 'validate_decisions_size FAIL on the new entry means tighten its prose, never raise the cap. A red pinned shard means an edit
    disturbed a pinned phrase: restore it. validate_roadmap_liveness FAIL means a child reaches the toxic SCC: drop the edge, never
    grow the baseline.'
  hermetic: false
  graduation: not-applicable
