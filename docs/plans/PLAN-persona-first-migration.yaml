    their required edges as subset assertions (every persona item on T4.32, T4.15 also on T4.21, T4.31 on T4.15; status and exact edge
    lists are deliberately not pinned, so the graduated record survives the children starting or gaining a legitimate edge); no child
    reaches T4.1, T4.22, T4.9a or T4.2 through depends_on; T4.2 keeps T4.1 and gains the children; Decision 93 holds; the toxic SCC
    equals the rec-3580 baseline with no child in it; each child carries its capture, strangler and discharge criteria; T4.32 c4's fingerprint
