constraints:
  - Builds only after rec-5553's build has merged (rec dependency); canary_persona must already be in the tree's docs/contracts/personas/ and inference-provider.yaml.
  - Keyless throughout; no session reads an inference key (Decision 263); the stub provider stands in for the model.
  - No change to docker/persona/, config/persona_image.yaml, run_argv, run_image, persona-verdict*.yml, any egress file, executor-personas.yaml or any persona contract.
  - tests/fixtures/persona_backends/fixture_persona.yaml and the turn-capture goldens are untouched (the backend unit tests keep it).
  - The CLI's rows file is written, never sent (telemetry send is rec-5551).
  - Before handoff, list the build diff's weakening candidates (validate_weakening_candidates) and record one disposition each in this plan; the move of existing conformance tests from fixture_image to image_id and from fixture_persona to canary_persona keeps every assertion (Decision 181 cl.1).
  - No rescue agents or workaround loops (Decision 55).
