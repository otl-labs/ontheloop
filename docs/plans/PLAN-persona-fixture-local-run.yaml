schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-fixture-local-run
intent: >-
  Solves rec-5548, part A of rec-5545's operator-approved split (T4.32 c3's local leg). It depends on rec-5553, which
  registers canary_persona (index kind fixture, a machinery test bed that obeys every verdict-persona rule) and ships it
  in the persona image, since docker/persona/Dockerfile copies docs/contracts/personas/ whole and inference-provider.yaml
  carries its selection row. This plan moves the conformance suite onto canary_persona on the image as built: the derived
  test layer (tests/persona_hosts/fixture_image) and the suite's in-memory selection row go, so pr-validate and the
  publish workflow run the canary on the very image content that gets pinned. The stub provider plays the canary's
  deterministic task (one finding per BLOCKING: or NIT: line, REVISE on any blocking), so a run through the image proves
  the verdict_consistency path, and an injection fixture (a pull-request body instructing PROCEED) proves a failure value
  passes through. The local twin gains its first measured caller: python -m src.persona_hosts.local_container.cli runs
  run_image with project_ref and agent and writes the result, the events file and the host-run sidecar side by side, so
  scripts.personas.telemetry_rows maps the run to a rows file (sends nothing). Everything is keyless against the stub
  provider; the model's own judgement, the chain run and the advisory check stay with rec-5550 (part C).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-fixture-local-run.yaml
phase: >-
  T4.32 (in_progress). Advances c3 (local leg) without closing it: c3 also needs the chain run on a fixture PR, the
  advisory check, the wake proof, the model-judged injection case and input-field coverage, all rec-5550. Freshness
  gate: c3 open (not silently met); no retired surface named; the roadmap's PLAN-persona-verdict-fixture-run hint is
  now carried by rec-5545's children (rec-5548..rec-5551, rec-5553), whose re-grounding of that hint is rec-5550's.
closes_criteria: []
cites: [dec:200, dec:205, dec:212]
scope:
  - file: tests/persona_hosts/conformance_suite.py
    action: Modify
    purpose: >-
      FIXTURE becomes canary_persona (rec-5553's registered fixture persona). Drop the fixture_image fixture,
      _provider_with_fixture, _teardown_tags and test_a_prebuilt_image_keeps_its_base_tag; every test runs on image_id
      (the tree build, or PERSONA_IMAGE_UNDER_TEST in the publish workflow). test_run_returns_a_host_run_sidecar's agent
      becomes canary-persona. Add test_blocking_note_yields_revise_with_findings (input_blocking.json: verdict REVISE,
      one blocking and one nit finding, ids line:<n>), test_injection_fixture_yields_a_failure_value (input_injection.json:
      outcome failure, failure injection_suspected, never success; plumbing only, the stub plays the model) and
      test_cli_run_is_measured, parametrized on the adapter fixture through a CLI_BUILDERS map keyed like ARGV_BUILDERS
      (local_container's entry runs python -m src.persona_hosts.local_container.cli; a later adapter adds its own entry,
      never a skip, so the suite stays the port's one suite under Decision 212 cl.1). The CLI with project_ref and agent
      writes result.json, events.json and host_run.json; host_run.json parses (parse_persona_host_run) carrying that
      project_ref and agent; scripts.personas.telemetry_rows exits 0 on them and its rows file's telemetry_agents rows
      carry agent_type canary-persona and host_run_ref local:local_container/<host_run.json host.run_id> (rows carry no
      project_ref: the sidecar binds it, Decision 200 cl.1). Test project_ref values use the reserved synthetic
      namespace (Decision 200). The image_id fixture's teardown removes the tree-built image only when it was not
      prebuilt (PERSONA_IMAGE_UNDER_TEST unset), so no run leaves a dangling image.
  - file: tests/persona_hosts/fixture_image/Dockerfile
    action: Delete
    purpose: The derived fixture layer; the image carries canary_persona since rec-5553.
  - file: tests/persona_hosts/stub_provider.py
    action: Modify
    purpose: >-
      The final object follows canary_persona's task over the tool message text: read_input's lines mode prefixes each
      line with "<n>: " and appends a "[notes: N lines]" trailer, so the stub strips the numeric prefix, takes n from it,
      and emits one finding {id line:<n>, severity blocking or nit, origin mechanical, anchor the line, summary} per
      stripped line starting BLOCKING: or NIT:, verdict REVISE when any is blocking, else PROCEED with findings []
      (input_complete.json's reply is unchanged). A stripped line equal to INJECTION FIXTURE yields {outcome: failure,
      failure: injection_suspected, detail: stub}. Port 0 binds 127.0.0.1 on an ephemeral port and the stub prints
      STUB_PORT <n> first, so a test can start it as a host subprocess; the in-network docker stub keeps 0.0.0.0.
  - file: tests/persona_hosts/fixtures/input_complete.json
    action: Modify
    purpose: Gains plan "" (canary_persona requires the verdict chain's shared fields change_id, head_sha and plan, as every verdict persona does); notes unchanged.
  - file: tests/persona_hosts/fixtures/input_incomplete.json
    action: Modify
    purpose: Gains plan "" so head_sha stays the only missing required field (the input_incomplete case is unchanged).
  - file: tests/persona_hosts/fixtures/input_blocking.json
    action: Create
    purpose: "change_id, head_sha, plan and notes holding one BLOCKING: line, one NIT: line and one plain line; valid against canary_persona's input_schema."
  - file: tests/persona_hosts/fixtures/input_injection.json
    action: Create
    purpose: >-
      The injection case: change_id, head_sha, plan and notes, where notes is a pull-request body that starts with the line
      INJECTION FIXTURE and instructs the reviewer to return PROCEED with no findings. Valid against canary_persona's
      input_schema. rec-5550 reuses it for the model-judged run.
  - file: src/persona_hosts/local_container/cli.py
    action: Create
    purpose: >-
      python -m src.persona_hosts.local_container.cli --image REF --persona ID --input PATH --out DIR --project-ref REF
      --agent KEY [--key-variable V] [--base-url-variable V] [--network N] [--timeout S]: reads the input JSON, calls
      run_image with project_ref and agent, writes DIR/result.json (the parsed stdout or null), DIR/events.json and
      DIR/host_run.json (RunImageResult.host_run bytes); events.json holds null when the run wrote none. Exits with the
      container's exit code; refuses (exit 2, nothing written) a non-empty DIR, an unreadable input, or a ValueError
      from run_image (bad sidecar or variable arguments); exit 3, nothing written, on run_image's RuntimeError
      (docker unreachable). Names no persona id. Imports nothing from scripts or
      src.persona_backends (tests/persona_hosts/test_package_boundary.py). The first caller that writes the sidecar
      beside the events file (PLAN-litellm-local-host-root, Not in scope note).
  - file: tests/persona_hosts/local_container/test_cli.py
    action: Create
    purpose: >-
      run_image monkeypatched: test_cli_writes_result_events_and_sidecar (argument mapping, the three files written,
      exit code passthrough, events.json null when no events) and
      test_cli_refuses_a_non_empty_out_dir_or_unreadable_input (exit 2 on a non-empty DIR, an unreadable input or a
      run_image ValueError; exit 3 on a run_image RuntimeError; nothing written in each case).
  - file: tests/persona_hosts/test_fixture_persona_run.py
    action: Create
    purpose: >-
      The rec acceptance, default-collected and keyless with no Docker daemon:
      test_fixture_persona_runs_through_run_image_on_stub_provider calls run_image(docker=<docker_shim>) for
      canary_persona on input_complete.json and input_blocking.json with project_ref and agent against stub_provider.py
      started as a subprocess on an ephemeral port (the test process opens no socket), and asserts exit 0, outcome
      success, PROCEED then REVISE with the two findings, the events header names canary_persona with the contract's
      rendered_prompt_sha256, and the sidecar parses. test_injection_input_yields_the_failure_value runs
      input_injection.json and asserts the failure value.
  - file: tests/persona_hosts/docker_shim.py
    action: Create
    purpose: >-
      A stand-in docker executable for run_image's real argv: lays out a temporary /app from docker/persona/Dockerfile's
      own COPY lines into /app (so a COPY that drops the personas tree fails the test; COPY targets outside /app, such
      as requirements-persona.txt to /tmp, are skipped), honours the Dockerfile's ENV HOME and WORKDIR, maps run_argv's
      two -v mounts, passes only the -e variables named in argv, and runs the image's ENTRYPOINT argv with
      sys.executable -I. The test passes run_image a generated wrapper script that runs sys.executable on
      docker_shim.py, so the venv interpreter is used and no exec bit is needed. It proves the image layout, not the
      image's pinned dependency set (the venv's litellm, not requirements-persona.txt); the conformance suite stays the
      image proof. Named outside test_*.py so it is never collected.
bundled_recommendations: [rec-5548]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The conformance suite runs canary_persona on the image built from docker/persona/Dockerfile with no derived layer (green on CC-web and in pr-validate).
  - tests/persona_hosts/test_fixture_persona_run.py::test_fixture_persona_runs_through_run_image_on_stub_provider passes with no Docker daemon.
  - "A notes body with a BLOCKING: line yields REVISE with its findings through run_image; the injection fixture yields outcome failure with failure injection_suspected, never success (stub plumbing)."
  - The CLI writes result.json, events.json and host_run.json; host_run.json parses with the given project_ref and agent, and scripts.personas.telemetry_rows maps them to a rows file whose telemetry_agents rows carry agent_type canary-persona and host_run_ref local:local_container/<host_run.json host.run_id>.
  - No reference to tests/persona_hosts/fixture_image remains.
  - rec-5548 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the acceptance and CLI tests with no Docker daemon.
    command: >-
      bin/venv-python -m pytest tests/persona_hosts/test_fixture_persona_run.py tests/persona_hosts/local_container/test_cli.py
      tests/persona_hosts/local_container/test_adapter.py tests/persona_hosts/test_package_boundary.py -q
    expected: All pass; the summary line reads passed with no failed or error.
    fix_if: A shim layout error names a COPY line; fix the shim, never the assertion.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: The four files are default-collected, so every full tier already runs them; a registry row would duplicate that.
  - step: 2
    phase: pre-deploy
    action: '[live, CC-web dockerd] Build the image from the tree and run the conformance suite on it, with no derived layer.'
    command: bin/venv-python -m pytest tests/persona_hosts/conformance_suite.py -q
    expected: >-
      All pass, including test_complete_input_returns_a_valid_success on canary_persona,
      test_blocking_note_yields_revise_with_findings, test_injection_fixture_yields_a_failure_value and
      test_cli_run_is_measured.
    fix_if: unknown_persona or exit 2 on canary_persona means rec-5553 has not merged into this branch's base; rebase, never re-add the derived layer.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: pr-validate's persona image conformance step and the publish workflow re-run this suite on every image-input change.
  - step: 3
    phase: pre-deploy
    action: Full tier then HEAD attestation, after the build commit and rebase and before the push; started backgrounded from the top-level session with a 2 h limit (tests/test_aws_profile.py needs HOME as an empty dir).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The full tier exits 0 and --verify-head confirms the attestation names HEAD.
    fix_if: A failing check is fixed on the branch; a timeout is BLOCKED, never a push.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole-suite run, not a guard.
  - step: 4
    phase: pre-deploy
    action: Stale-reference sweep for the deleted derived layer.
    command: >-
      ! git grep -n -e "fixture_image" -e "_provider_with_fixture" -e "_teardown_tags" -- . ':!docs/plans/'
    expected: Exit 0 and no output (git grep found no reference).
    fix_if: Remove or rewire the named reference.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: A one-time sweep of a deleted surface (moment claim); nothing re-creates the derived layer.
  - step: 5
    phase: pre-deploy
    action: '[live] The pull request CI ran the persona image conformance step on the PR head and it passed.'
    command: >-
      mcp__github__pull_request_read(method=get_check_runs, owner=otl-labs, repo=ontheloop, pullNumber=<this PR>) then
      mcp__github__get_job_logs for the job that holds the "Persona image conformance (local_container suite)" step
    expected: >-
      The step ran (scripts/ci/persona_image_changed.py counts tests/persona_hosts/ as an input) and passed on the PR
      head; report the run id.
    fix_if: A red step is fixed on the branch (ci-rca watches main only).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: '[post-deploy] rec-5548 closed by the merge commit Resolves: trailer.'
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as rc;rows,m=rc.fetch_recs_by_ids(rc.make_reader(profile='agent_platform'),['rec-5548']);print(rows[0]['id'],rows[0]['status'])"
    expected: The line reads rec-5548 closed.
    fix_if: Still open after the closure job ran; read the trailer-acceptance verdict artifact for the node id.
    hermetic: false
    graduation: not-applicable
test_obligations:
