    verification_step: 1
    test_selector: tests/persona_hosts/test_fixture_persona_run.py::test_injection_input_yields_the_failure_value
    red_green_expectation: red before (module absent), green after
  - source: src/persona_hosts/local_container/cli.py
    behavior: writes result, events and sidecar side by side
    verification_step: 1
    test_selector: tests/persona_hosts/local_container/test_cli.py::test_cli_writes_result_events_and_sidecar
    red_green_expectation: red before (module absent), green after
  - source: src/persona_hosts/local_container/cli.py
