schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-fixture-run-closure
intent: >-
  Close T4.32 c3 (fixture run) and c7 (egress) on the evidence rec-5548 and rec-5550 proved live, so persona add steps
  can start: canary_persona's implementation becomes implemented, bound through the fixture kind; its provisional
  budget ends on the measured runs; the fixture_kind rules record the Actions reading of Decision 205 cl.1; the image
  is re-pinned on the changed contract. Serves NS.1: verdict personas run on one tested mechanism on GitHub Actions.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-fixture-run-closure.yaml
phase: >-
  T4.32 c3 and c7 (follow-on mode; rec-5561, follow-on of rec-5550). Preconditions read back 2026-11-26: rec-5548,
  rec-5550 and rec-5558 closed.
closes_criteria: [T4.32:c3, T4.32:c7]
cites: [dec:235, dec:246, dec:249, dec:282]
scope:
  - file: scripts/checks/contracts/validate_persona_contract_binding.py
    action: Modify
    purpose: >-
      Kind binding for fixture rows (planned change, Decision 235 cl.1): a row of kind fixture that reads
      {status: implemented, location} is green when location exists and its non-docstring string literals include
      "fixture_kind" (the module reads fixture_kind.personas, so the persona is bound through the kind, never by id),
      in place of naming the contract path; rows of kind verdict and compute_plane keep the contract-path rule
      unchanged, and a verdict row whose location names only "fixture_kind" still fails "does not name". New
      tightening: for every fixture row, pending or implemented, a module under landing_dirs that names the persona id
      or its contract path fails (today that refusal ends once a row is implemented). Message forms follow the
      existing ones. Docstring names both rules.
  - file: tests/checks/contracts/test_validate_persona_contract_binding.py
    action: Modify
    purpose: >-
      New nodes on the fixture tree with one fixture row added: test_fixture_row_bound_through_the_kind_is_green;
      test_fixture_row_location_without_fixture_kind_fails; test_verdict_row_naming_only_fixture_kind_fails;
      test_landing_dir_module_naming_implemented_fixture_persona_fails (id and contract path each). Existing nodes
      unchanged.
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      canary_persona row implementation -> {status: implemented, location: scripts/personas/execute.py} (execute.py's
      fixture_personas reads fixture_kind.personas; route.py and materialise.py reach the canary only through it).
      implementation_binding.rule gains the fixture kind binding and the permanent landing-dir refusal for fixture rows.
      fixture_kind.rules: (1) scoped to contract rules, naming the binding rule as the one fixture-conditioned rule and
      stricter on the landing dirs; (3b) rewritten: never routed on a real change (route.bound_personas reads kind
      verdict only); a fixture-only pull request routes the fixture_kind personas (route.py), which run on Actions
      under Decision 205 cl.1's terms: from a pull_request through workflow_run, reading the pinned SHA as data,
      posting an advisory check run, never a commit, never gated or counted. One terse amendment_log row naming the
      plan (Decision 282 cl.4), and in the same change the row the tool selects is compacted (cl.1 decay: amendment_compact
      --check reports compactable=1 today): bin/venv-python -m scripts.checks.contracts.amendment_compact --write --rows 1
      docs/contracts/executor-personas.yaml, re-run at build time.
  - file: docs/contracts/personas/canary_persona.yaml
    action: Modify
    purpose: >-
      budget.provisional: false, and budget.basis: runs 45687386075 and 45693907198 (rec-5550 VP 6 and 7) took 2 turns
      each, 5.2 s and 4.9 s, with no budget_exhausted; the ceilings stay 6 turns, 120 s and 1 revision because they rest
      on turn arithmetic (2 calls, a revision, a fail-over's cold-start probe and retried attempts each count as a turn,
      budget_rules), not on the sample; neither run exercised a revision or fail-over. No word of the basis names a
      currency or spend (dollar_budget). contract_version is raised by one over main's value at build time (the
      personas_row rule: raised whenever any other field changes; 2 -> 3 if rec-5659's build has landed), so
      rendered_prompt_sha256 is re-computed from the fresh render; the budget lines of the prompt are unchanged.
  - file: docs/contracts/personas/rendered/canary_persona.txt
    action: Modify
    purpose: >-
      Regenerated with bin/venv-python -m scripts.persona_contracts.render --write canary_persona; only the contract
      version line differs.
  - file: tests/persona_contracts/test_canary_persona.py
    action: Modify
    purpose: >-
      test_canary_persona_is_registered_and_never_routed_on_real_prs expects the implemented row (location
      scripts/personas/execute.py); new node test_canary_persona_binding_follows_met_c3: no canary field names
      T4.32:c3 (implementation, provisional), provisional is false with a basis naming both run ids, and
      validate_persona_contract_binding and validate_persona_contracts stay green on a copy of the index and roadmap
      where T4.32 c3 and c7 read met (red before: the pending row and provisional.until fail on that copy).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      /implement's bookkeeping walk only: T4.32 c3 and c7 open -> met, met_by persona-fixture-run-closure, and one
      progress_note line naming rec-5548 (local leg, stub provider, operator ruling 2026-11-23), rec-5550 runs
      45687386075 and 45693907198 (chain, injection, wake, container red fixture in the keyed job) and rec-5558. No
      criterion text changes.
  - file: config/persona_image.yaml
    action: Modify
    purpose: >-
      Not in the build PR: after merge and the image channel's publish of the merge commit, the build session opens a
      pin PR with bin/venv-python -m scripts.ci.persona_image_pin update (digest and source_commit lines only); the
      operator merges it (a pin is a deploy, Decision 246 cl.4), after rec-5559's live fixture PR #2497 has finished.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
  - >-
    Lambda: compute_affected_artifacts over the scope returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']} (active).
    Disposition: a criterion flip in a packaged roadmap asset, no code change; the governed channel ships it with the
    next green through deploy-prod-lambdas.yml, which deploys and smoke-invokes (Decision 249 cl.2 read through Decision 254 cl.5), as in PLAN-persona-image-pin; no session deploy.
  - >-
    No Terraform, credential or workflow change. The contract edit is a persona image input: pr-validate's conformance
    step runs on the build PR, and the image channel republishes after main's full tier passes.
acceptance_criteria:
  - canary_persona reads implemented, bound through the fixture kind, and no module under the landing dirs names it; a verdict row cannot use the kind binding (VP 1).
  - canary_persona's provisional budget has ended with a basis naming the two measured runs at a raised contract_version, and its rendered prompt differs from main only in the version line (VP 1, VP 2).
  - T4.32 c3 and c7 read met with met_by persona-fixture-run-closure, and both persona checks stay green on main (VP 3, VP 5).
  - config/persona_image.yaml pins the image built from a commit at or after this plan's merge (VP 4).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The kind binding, its refusals and the canary's closed binding
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_persona_contract_binding.py
      tests/persona_contracts/test_canary_persona.py::test_canary_persona_binding_follows_met_c3 -q
    expected: all pass; before the change the new nodes fail
    fix_if: a node fails -- fix the check or the row, never loosen a node
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-fixture-kind-binding
  - step: 2
    phase: pre-deploy
    action: Contracts and rendered prompts stay green and the canary's rendered bytes are unchanged
    command: >-
      bin/venv-python -m scripts.persona_contracts.render --check && git diff -U0 origin/main --
      docs/contracts/personas/rendered/canary_persona.txt | grep -c '^[-+][^-+]' && bin/venv-python -m pytest
      tests/persona_contracts -q
    expected: render --check exit 0; the rendered diff count prints 2 (the version line removed and added); tests pass
    fix_if: more lines differ -- the basis leaked into a rendered placeholder; revert that edit
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Existing suites already run in both tiers; VP 1 carries this plan's assertions.
  - step: 3
    phase: post-deploy
    action: After merge, the bookkeeping walk's flip is on main
    command: >-
      git fetch origin main -q && git show origin/main:docs/ROADMAP-PLATFORM.yaml | bin/venv-python -c "import sys,yaml;
      d=yaml.safe_load(sys.stdin); t=[i for i in d['tier_items'] if i['id']=='T4.32'][0];
      print([(c['id'],c['status'],c.get('met_by')) for c in t['exit_criteria'] if c['id'] in ('c3','c7')])"
    expected: "[('c3', 'met', 'persona-fixture-run-closure'), ('c7', 'met', 'persona-fixture-run-closure')]"
    fix_if: still open -- the walk did not run; land it in a bookkeeping PR
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: post-deploy
    action: >-
      Once persona-image-publish has published the merge commit (or a later one) and PR #2497 is closed, open the pin PR
      with persona_image_pin update; the operator merges it on its green pr-validate; then check the pin on main
    command: bin/venv-python -m scripts.ci.persona_image_pin check
    expected: PERSONA-IMAGE-PIN current, with source_commit at or after this plan's merge commit
    fix_if: stale -- the publish skipped or failed; read the persona-image-publish run and report to the plan owner
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: rec-5561 closed by the trailer closure on main's covering run
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(),
      ['rec-5561']); print(r[0]['id'], r[0]['status'])"
    expected: rec-5561 closed
    fix_if: still open -- read ci.yml's closure job; never close by hand
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/contracts/validate_persona_contract_binding.py
    behavior: a fixture row binds through the kind; a verdict row cannot; landing dirs never name a fixture persona
    verification_step: 1
    test_selector: tests/checks/contracts/test_validate_persona_contract_binding.py
    red_green_expectation: red before (new nodes fail), green after
  - source: docs/contracts/executor-personas.yaml
    behavior: canary_persona is implemented through the kind and names no met criterion
    verification_step: 1
    test_selector: tests/persona_contracts/test_canary_persona.py::test_canary_persona_binding_follows_met_c3
    red_green_expectation: red before, green after
  - source: docs/contracts/personas/canary_persona.yaml
    behavior: provisional ended with a basis naming the measured runs
    verification_step: 1
    test_selector: tests/persona_contracts/test_canary_persona.py::test_canary_persona_binding_follows_met_c3
    red_green_expectation: red before, green after
weakening_dispositions:
  - candidate: "[assertion-changed] tests/persona_contracts/test_canary_persona.py::test_canary_persona_is_registered_and_never_routed_on_real_prs"
    disposition: planned-change
    cite: "acceptance_criteria[0]"
  - candidate: "[check-changed] scripts/checks/contracts/validate_persona_contract_binding.py::validate_persona_contract_binding"
    disposition: planned-change
    cite: "acceptance_criteria[0]"
