  - {gate: decision-scout, round: 2, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:e24e3336b9c0bd6e6041b7bba3bd9743fca1593fd87abb9bb858f1d89d55ba85"}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Binding check and its tests (scope rows 1-2); then the canary row, rules and amendment row (row 3); then the contract budget and version (row 4), the render (row 5) and test_canary_persona.py (row 6).
  - Execute VP 1-2; run validate --pre; open the PR; the operator's final-diff word on the binding check; merge on green.
  - Bookkeeping walk (closes_criteria) with the progress_note line (row 7); VP 3.
  - After the publish and PR #2497 closes, the pin PR (row 8); operator merges; VP 4; then VP 5.
  - 'Report: what was implemented, verification results'
rollback: Revert the build PR; the next pin PR moves the image forward again (no rollback pin, Decision 254 cl.5).
