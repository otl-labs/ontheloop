  - The binding check is guard code; the build's merge needs the operator's final-diff word on it (Decision 246 cl.4). The pin PR needs his merge.
  - No workflow, Terraform, credential or runtime persona code change; scripts/personas/ is not edited.
  - No rescue agents or workaround loops (Decision 55).
