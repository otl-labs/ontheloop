schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-fixture-run-closure
implementation_declared: true
intent: >-
  Close T4.32 c3 (fixture run) and c7 (egress) on the evidence rec-5548 and rec-5550 proved live, so persona add steps
  can start: canary_persona's implementation becomes implemented, bound through the fixture kind; its provisional
  budget ends on the measured runs; the fixture_kind rules record the Actions reading of Decision 205 cl.1; the image
  is re-pinned on the changed contract. Serves NS.1: verdict personas run on one tested mechanism on GitHub Actions.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-fixture-run-closure.yaml
phase: >-
  T4.32 c3 and c7 (follow-on mode; rec-5561, follow-on of rec-5550). Preconditions read back 2026-11-26: rec-5548,
  rec-5550 and rec-5558 closed.
closes_criteria: [T4.32:c3, T4.32:c7]
cites: [dec:235, dec:246, dec:249, dec:282]
scope:
  - file: scripts/checks/contracts/validate_persona_contract_binding.py
    action: Modify
    purpose: >-
      Kind binding for fixture rows (planned change, Decision 235 cl.1 and cl.5). Input forms and outcomes:
      (a) a row of kind fixture reading {status: implemented, location} whose location is an existing module under
      implementation_binding.landing_dirs with a non-docstring string literal "fixture_kind" (it reads
      fixture_kind.personas, so the persona is bound through the kind, never by id): green;
      (b) the same with "fixture_kind" only in a docstring or comment, or a location that does not parse: fails
      "does not bind through fixture_kind";
      (c) a fixture row whose location is outside landing_dirs (a test module, a script elsewhere): fails "is outside
      the landing dirs";
      (d) a fixture row whose location names its contract path or persona id: fails under (f), so a fixture row can
      never bind by naming;
      (e) a missing location: fails "does not exist", as today;
      (f) new tightening: for every fixture row, pending or implemented, a module under landing_dirs whose literals
      name the persona id or its contract path fails "names fixture persona" (today that refusal ends once a row is
      implemented);
      (g) rows of kind verdict and compute_plane keep the contract-path rule unchanged, so a verdict row whose location
      names only "fixture_kind" still fails "does not name"; a kind outside the schema still fails "unreadable or off
      its schema"; a fixture row missing from fixture_kind.personas is validate_persona_contracts' rule (2).
      (h) landing-dir membership in (a) and (c) is decided on (root / location).resolve() being relative to
      (root / landing).resolve() for some landing dir; an absolute location, one with segments escaping a landing dir
      (scripts/personas/../../tests/x.py), or a symlink whose resolved target is outside every landing dir fails "is
      outside the landing dirs".
      Named residuals of (f): a registry_key literal (scripts/personas/keyed_run.py AGENT = "canary-persona", owned by
      rec-5675), an id computed, concatenated or read from the index (how execute.py legitimately reaches a fixture
      persona), and non-.py files under the landing dirs are not screened, as with today's pending rule. The docstring
      names (a)-(h) and the residuals.
  - file: tests/checks/contracts/test_validate_persona_contract_binding.py
    action: Modify
    purpose: >-
      New nodes on the fixture tree with one fixture row added, each asserting its message substring:
      test_fixture_row_bound_through_the_kind_is_green (red before: "does not name");
      test_fixture_row_location_without_fixture_kind_fails ("does not bind through fixture_kind"; red before, today's
      message differs); test_fixture_row_location_outside_landing_dirs_fails ("is outside the landing dirs"; red before);
      test_landing_dir_module_naming_implemented_fixture_persona_fails ("names fixture persona", id and contract path
      each; red before); test_fixture_row_location_escaping_landing_dirs_fails ("is outside the landing dirs" for
      scripts/personas/../../tests/x.py and for a symlink under scripts/personas/ to a module outside, each holding
      "fixture_kind"; red before); test_verdict_row_naming_only_fixture_kind_fails ("does not name"; a guard node, green before
      and after). Existing nodes unchanged.
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      canary_persona row implementation -> {status: implemented, location: scripts/personas/execute.py} (execute.py's
      fixture_personas reads fixture_kind.personas; route.py and materialise.py reach the canary only through it).
      implementation_binding.rule gains the fixture kind binding (location resolved under landing_dirs naming fixture_kind) and the permanent landing-dir refusal for fixture rows, naming its residuals (registry_key literal, rec-5675; computed ids; non-.py files).
      fixture_kind.rules: (1) scoped to contract rules, and saying plainly that implementation_binding is the one rule conditioned on
      fixture: a fixture row's location test is looser (it binds through the kind, not the contract path) and its
      landing-dir refusal is stricter (permanent); (3b) rewritten: never routed on a real change (route.bound_personas reads kind
      verdict only); a fixture-only pull request routes the fixture_kind personas (route.py), which run on Actions
      under Decision 205 cl.1's terms: from a pull_request through workflow_run, reading the pinned SHA as data,
      posting an advisory check run, never a commit, never gated or counted. One terse amendment_log row naming the
      plan (Decision 282 cl.4), and in the same change the row the tool selects is compacted (cl.1 decay: amendment_compact
      --check reports compactable=1 today): bin/venv-python -m scripts.checks.contracts.amendment_compact --write --rows 1
      docs/contracts/executor-personas.yaml, re-run at build time.
  - file: docs/contracts/personas/canary_persona.yaml
    action: Modify
    purpose: >-
      budget.provisional: false, and budget.basis: runs 45687386075 and 45693907198 (rec-5550 VP 6 and 7) took 2 turns
      each, 5.2 s and 4.9 s, with no budget_exhausted; the ceilings stay 6 turns, 120 s and 1 revision because they rest
      on turn arithmetic (2 calls, a revision, a fail-over's cold-start probe and retried attempts each count as a turn,
      budget_rules), not on the sample; neither run exercised a revision or fail-over. The basis carries the figures
      themselves, so it stays true after GitHub expires the runs' artifacts. No word of the basis names a currency or
      spend (dollar_budget). contract_version is raised by one over main's value at build time (the
      personas_row rule: raised whenever any other field changes; 2 -> 3 if rec-5659's build has landed), so
      rendered_prompt_sha256 is re-computed from the fresh render; the budget lines of the prompt are unchanged.
  - file: docs/contracts/personas/rendered/canary_persona.txt
    action: Modify
    purpose: >-
      Regenerated with bin/venv-python -m scripts.persona_contracts.render --write canary_persona; only the contract
      version line differs.
  - file: tests/persona_contracts/test_canary_persona.py
    action: Modify
    purpose: >-
      test_canary_persona_is_registered_and_never_routed_on_real_prs expects the implemented row (location
      scripts/personas/execute.py); new node test_canary_persona_binding_follows_met_c3: no canary field names
      T4.32:c3 (implementation, provisional), provisional is false with a basis naming both run ids, and
      validate_persona_contract_binding and validate_persona_contracts stay green on a copy of the index and roadmap
      where T4.32 c3 and c7 read met (red before: the pending row and provisional.until fail on that copy).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      /implement's bookkeeping walk only, in the build PR after VP compliance and before code review
      (tier-item-lifecycle.yaml bookkeeping_walk): T4.32 c3 and c7 open -> met, met_by persona-fixture-run-closure, and one
      progress_note line with the measured figures (2 calls each, 5.2 s and 4.9 s, PROCEED and injection_suspected) naming rec-5548 (local leg, stub provider, operator ruling 2026-11-23), rec-5550 runs
      45687386075 and 45693907198 (chain, injection, wake, container red fixture in the keyed job) and rec-5558. No
      criterion text changes.
  - file: config/persona_image.yaml
    action: Modify
    purpose: >-
      Not in the build PR: after merge and the image channel's publish of the merge commit, the build session opens a
      pin PR with bin/venv-python -m scripts.ci.persona_image_pin update (digest and source_commit lines only); the
      operator merges it (a pin is a deploy, Decision 246 cl.4), after rec-5559's live fixture PR #2497 has finished.
      rec-5561 closes on the build PR's trailer before the pin lands; if the build session ends before VP 4 passes, the
      re-pin falls to rec-5660's first step (its pin PR), else the build files a rec for it before ending.
bundled_recommendations: [rec-5561]
followon_recs: []
infrastructure_dependencies:
  - >-
    Lambda: compute_affected_artifacts over the scope returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']} (active).
    Disposition: a criterion flip in a packaged roadmap asset, no code change; the governed channel ships it with the
    next green through deploy-prod-lambdas.yml, which deploys and smoke-invokes (Decision 249 cl.2 read through Decision 254 cl.5), as in PLAN-persona-image-pin; no session deploy.
  - >-
    No Terraform, credential or workflow change. The contract edit is a persona image input: pr-validate's conformance
    step runs on the build PR, and the image channel republishes after main's full tier passes.
acceptance_criteria:
  - canary_persona reads implemented, bound through the fixture kind, and no module under the landing dirs names it; a verdict row cannot use the kind binding (VP 1).
  - canary_persona's provisional budget has ended with a basis naming the two measured runs at a raised contract_version, and its rendered prompt differs from main only in the version line (VP 1, VP 2).
  - T4.32 c3 reads met with met_by persona-fixture-run-closure, on rec-5548's local leg and rec-5550's chain run (PROCEED) and injection run (injection_suspected) (VP 0, VP 3).
  - T4.32 c7 reads met with met_by persona-fixture-run-closure, on the container red fixture re-run before the key read and as the last step of rec-5550's key-holding job (rec-5550 VP 6 and VP 7 rows, rec-5550 closed by covering run 45698230012) (VP 3); both persona checks stay green (VP 1, VP 2).
  - config/persona_image.yaml pins the image built from a commit at or after this plan's merge, and rec-5561 is closed by its Resolves trailer (VP 4, VP 5).
verification_plan:
  - step: 0
    phase: pre-deploy
    action: Re-read the c3/c7 evidence the flip rests on (rec-5550 VP 6 and 7; copied before GitHub's artifact expiry)
    command: >-
      bin/venv-python -c "import json; d='/mnt/project-files/canary-c3-c7-flip/evidence/';
      r=[json.loads(json.loads(open(d+f'run-{i}-result.json').read())['stdout']) for i in (45687386075, 45693907198)];
      print(r[0]['verdict'], r[1]['failure'])"
    expected: PROCEED injection_suspected
    fix_if: the files are missing or differ -- STOP and report to the plan owner; c3 is not evidenced
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The evidence sits on an off-repo project mount CI cannot read; no standing guard can reproduce it.
  - step: 1
    phase: pre-deploy
    action: The kind binding, its refusals and the canary's closed binding
    command: >-
      bin/venv-python -m pytest
      tests/checks/contracts/test_validate_persona_contract_binding.py::test_fixture_row_bound_through_the_kind_is_green
      tests/checks/contracts/test_validate_persona_contract_binding.py::test_fixture_row_location_without_fixture_kind_fails
      tests/checks/contracts/test_validate_persona_contract_binding.py::test_fixture_row_location_outside_landing_dirs_fails
      tests/checks/contracts/test_validate_persona_contract_binding.py::test_landing_dir_module_naming_implemented_fixture_persona_fails
      tests/checks/contracts/test_validate_persona_contract_binding.py::test_verdict_row_naming_only_fixture_kind_fails
      tests/checks/contracts/test_validate_persona_contract_binding.py::test_fixture_row_location_escaping_landing_dirs_fails
      tests/persona_contracts/test_canary_persona.py::test_canary_persona_binding_follows_met_c3 -q
    expected: all pass; before the change the new nodes fail
    fix_if: a node fails -- fix the check or the row, never loosen a node
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-fixture-kind-binding
  - step: 2
    phase: pre-deploy
    action: Contracts and rendered prompts stay green and the canary's rendered bytes are unchanged
    command: >-
      bin/venv-python -m scripts.persona_contracts.render --check && git diff -U0 origin/main --
      docs/contracts/personas/rendered/canary_persona.txt | grep -c '^[-+][^-+]' && bin/venv-python -m pytest
      tests/persona_contracts -q
    expected: render --check exit 0; the rendered diff count prints 2 (the version line removed and added); tests pass
    fix_if: more lines differ -- the basis leaked into a rendered placeholder; revert that edit
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Existing suites already run in both tiers; VP 1 carries this plan's assertions.
  - step: 7
    phase: pre-deploy
    action: rec-5548, rec-5550 and rec-5558 read closed before the flip
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(),
      ['rec-5548','rec-5550','rec-5558']); print(sorted(x['status'] for x in r))"
    expected: "['closed', 'closed', 'closed']"
    fix_if: any still open -- STOP and report to the plan owner
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads live warehouse state; no standing guard can reproduce it.
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, before commit and push (handoff_policy)
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The full tier cannot graduate (recursion refusal); it is the handoff gate.
  - step: 3
    phase: post-deploy
    action: After merge, the bookkeeping walk's flip is on main
    command: >-
      git fetch origin main -q && git show origin/main:docs/ROADMAP-PLATFORM.yaml | bin/venv-python -c "import sys,yaml;
      d=yaml.safe_load(sys.stdin); t=[i for i in d['tier_items'] if i['id']=='T4.32'][0];
      print([(c['id'],c['status'],c.get('met_by')) for c in t['exit_criteria'] if c['id'] in ('c3','c7')])"
    expected: "[('c3', 'met', 'persona-fixture-run-closure'), ('c7', 'met', 'persona-fixture-run-closure')]"
    fix_if: still open -- the walk did not run; land it in a bookkeeping PR
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: post-deploy
    action: >-
      Once persona-image-publish has published the merge commit (or a later one) and PR #2497 is closed, open the pin PR
      with persona_image_pin update; the operator merges it on its green pr-validate; then check the pin on main
    command: >-
      bin/venv-python -m scripts.ci.persona_image_pin check && git fetch origin main -q && M=<the build PR's squash merge
      SHA, recorded in the build report> && S=$(git show origin/main:config/persona_image.yaml | sed -n
      's/^source_commit: "\([0-9a-f]*\)".*/\1/p') && git merge-base --is-ancestor "$M" "$S" && echo PIN-AFTER-MERGE
    expected: PERSONA-IMAGE-PIN current, then PIN-AFTER-MERGE
    fix_if: stale -- the publish skipped or failed; read the persona-image-publish run and report to the plan owner
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: rec-5561 closed by the trailer closure on main's covering run
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(),
      ['rec-5561']); print(r[0]['id'], r[0]['status'])"
    expected: rec-5561 closed
    fix_if: still open -- read ci.yml's closure job; never close by hand
    hermetic: false
    graduation: not-applicable
