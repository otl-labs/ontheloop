  - "Blind Fable consult (advisor-brief/ADVICE.md, 2026-11-26): kind binding over a duplicate provider module or a pending re-point (the code ran); provisional ends, numbers unchanged; no Decision 205 Update, the reading goes in fixture_kind.rules."
