schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-guidance-chain-fill
intent: >-
  Wire Decision 280's guidance seam into the verdict chain: materialise fills every slot a route's contract declares by
  calling guidance.fill with main's checkout (never the head snapshot), and the slot values are captured in the run
  record, so the base-ref read is a chain property before the first persona with a declared slot runs (rec-5605).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-guidance-chain-fill.yaml
phase: >-
  T4.32 (persona foundation), c1's persona-machinery leg: the verdict chain's input build calls the guidance seam. No
  exit criterion is closed; it gates rec-5585 (slots on the contracts) and T4.28 to T4.30 producer work.
closes_criteria: []
cites: [dec:205, dec:231, dec:280, dec:282]
amends: []
introduces: []
scope:
  - file: scripts/personas/execute.py
    action: Modify
    purpose: >-
      Add guidance_slots(root, route_id) -> list[str]: reads docs/contracts/personas/<route_id>.yaml under root (the
      trusted checkout) for any persona kind, not only fixture personas; returns [] when the contract or its
      guidance_slots key is absent; raises ValueError when route_id is off ^[a-z][a-z0-9_]*$, the contract does not
      parse (its own loader: execute._load swallows YAMLError), or guidance_slots is present but not a list of strings
      (null included). Never reads under the snapshot.
  - file: scripts/personas/materialise.py
    action: Modify
    purpose: >-
      build_input and materialise take a keyword-only base_root: Path | None = None, resolved at call time to
      execute.ROOT (the main checkout derived from the module path), so a monkeypatched execute.ROOT moves it; main
      passes execute.ROOT explicitly. The fixture-provider lookup reads execute.fixture_personas(base_root). After the
      route's provider fields, build_input reads slots = execute.guidance_slots(base_root, route_id) and merges
      guidance.fill(base_root, route_id, slots); the head snapshot root is never passed to either. A declared slot that
      names any key already in the input (the shared change_id, head_sha, plan or a provider field), or a ValueError or
      OSError from guidance_slots or fill, raises Unusable("input_unusable", detail), so the route gets a failure file
      and no input. Any other exception from a registered provider propagates and fails the prepare job (fail closed:
      no input, no verdict). Docstring names the base-root rule.
  - file: scripts/personas/keyed_run.py
    action: Modify
    purpose: >-
      record(): on a launcher result, the written results/<route>.json gains guidance {slot: value} copied from the
      prepared input-<route>.json for each slot execute.guidance_slots(root, route) declares; the key is omitted when
      the route declares none, so today's records are byte-unchanged. A ValueError from guidance_slots, or a declared
      slot missing from the prepared input, writes {route, failure: input_unusable} instead, so a run whose inputs
      cannot be replayed is never posted as a verdict. The ValueError catch wraps only the guidance_slots call, so an
      image_pin.load_pin ValueError is never relabelled input_unusable.
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      guidance_slot.rule: replace "advisory at the chain's call site until rec-5605 wires it" with "and at the
      verdict chain's call site by tests/personas/test_materialise.py::test_guidance_slots_filled_from_base_checkout;
      each run's results/<route>.json keeps the slot values under guidance". One terse amendment_log row
      (prose_improvement, summary 160 characters or fewer, Decision 275 cl.4), and in the same change run
      bin/venv-python -m scripts.checks.contracts.amendment_compact --write --rows 1 docs/contracts/executor-personas.yaml
      so the file keeps one fewer full row than its base (Decision 282 cl.1; the tool is lossless, cl.3).
  - file: tests/personas/test_materialise.py
    action: Modify
    purpose: >-
      Rec acceptance test_guidance_slots_filled_from_base_checkout: a tmp base root holds a contract declaring slot
      focus and ontheloop/guidance/<route>/focus.md with text BASE; the head snapshot holds a different focus.md with
      text HEAD and a second slot file present only at head; the input carries BASE for focus and "" for the head-only
      slot, and HEAD appears nowhere in the written input. test_guidance_collision_and_bad_file_are_unusable: a
      provider field naming a slot, a slot named plan, and a symlinked guidance file at the base root, each give a
      failure file with input_unusable and no input file. test_main_fills_guidance_from_execute_root_not_the_snapshot:
      with execute.ROOT monkeypatched to a tmp base root and PERSONA_SNAPSHOT holding a head-only guidance file,
      main() writes the base value and the head text appears nowhere in the input.
  - file: tests/personas/test_execute.py
    action: Modify
    purpose: >-
      test_guidance_slots_reads_any_contract: absent contract and absent key give [], a non-list or off-pattern route
      raises ValueError. test_record_keeps_guidance_slot_values: a route declaring slots records guidance equal to the
      prepared input's values; a route declaring none has no guidance key; a declared slot missing from the input
      records failure input_unusable.
bundled_recommendations: [rec-5605]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - tests/personas/test_materialise.py::test_guidance_slots_filled_from_base_checkout passes and fails on main (no fill at the call site).
  - A guidance file present only in the head snapshot never reaches the input; a slot collision or an unreadable guidance file gives input_unusable.
  - results/<route>.json keeps the declared slot values under guidance; a route with no slots writes the same record as today.
  - No persona contract, rendered prompt, hash or workflow changes.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The rec's acceptance node passes.
    command: bin/venv-python -m pytest tests/personas/test_materialise.py::test_guidance_slots_filled_from_base_checkout -q
    expected: exit 0 with 1 passed; on main the node does not exist and before the materialise change it fails
    fix_if: the node fails; the fill call, its base root or the merge into the input is wrong; fix the code, never the test
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: persona-guidance-chain-fill
  - step: 2
    phase: pre-deploy
    action: The fail-closed and capture nodes pass.
    command: >-
      bin/venv-python -m pytest tests/personas/test_materialise.py::test_guidance_collision_and_bad_file_are_unusable
      tests/personas/test_materialise.py::test_main_fills_guidance_from_execute_root_not_the_snapshot
      tests/personas/test_execute.py::test_guidance_slots_reads_any_contract
      tests/personas/test_execute.py::test_record_keeps_guidance_slot_values -q
    expected: exit 0 with 4 passed; before the change the nodes do not exist
    fix_if: a node fails; fix the code, never the test's expectation
    hermetic: true
    expected_literals: ["4 passed"]
    graduation: graduate
    graduation_check_id: persona-guidance-chain-guards
  - step: 3
    phase: pre-deploy
    action: The persona contract suites stay green against the edited guidance_slot rule.
    command: bin/venv-python -m pytest tests/persona_contracts tests/checks/contracts/test_validate_persona_contracts.py -q
    expected: exit 0 with no failure
    fix_if: a node fails; the rule edit or amendment_log row broke a contract check; fix the edit
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Existing suites that run in the full tier; this step only guards the one rule-text edit.
  - step: 4
    phase: pre-deploy
    action: No persona contract, rendered prompt or verdict workflow changed.
    command: test -z "$(git diff --name-only origin/main -- docs/contracts/personas/ .github/workflows/)"
    expected: exit 0 (the diff is empty)
    fix_if: a contract, prompt or workflow changed; revert it (slots on contracts are rec-5585)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A branch-relative diff with no registry form; validate_persona_contracts holds the rendered-prompt rules on main.
  - step: 5
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push; start it backgrounded from the top-level session with a 2 h limit and HOME set to an empty directory.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 6
    phase: post-deploy
    action: rec-5605 closed by the build's squash-merge Resolves trailer once its acceptance holds.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(),
      ['rec-5605']); print(r[0]['id'], r[0]['status'])"
    expected: Prints rec-5605 closed.
    fix_if: Still open after the closure job ran; read ci.yml's closure job log and report to the plan owner.
    hermetic: false
test_obligations:
  - source: scripts/personas/materialise.py
    behavior: declared slots are filled from the base root, never the head snapshot; a collision or unreadable guidance file is input_unusable
    verification_step: 1
    test_selector: tests/personas/test_materialise.py::test_guidance_slots_filled_from_base_checkout
    red_green_expectation: red before (no fill at the call site, the slot is absent from the input), green after
  - source: scripts/personas/execute.py
    behavior: guidance_slots reads any persona contract, gives [] when absent and refuses a malformed list or route
    verification_step: 2
    test_selector: tests/personas/test_execute.py::test_guidance_slots_reads_any_contract
    red_green_expectation: red before (function absent), green after
  - source: scripts/personas/keyed_run.py
    behavior: the run record keeps declared slot values, is unchanged for a route with none, and fails closed on a missing slot
    verification_step: 2
    test_selector: tests/personas/test_execute.py::test_record_keeps_guidance_slot_values
    red_green_expectation: red before (no guidance key in the record), green after
  - source: docs/contracts/executor-personas.yaml
    behavior: the guidance_slot rule names the chain call-site test and the record capture; the contract checks stay green
    verification_step: 3
    command: bin/venv-python -m pytest tests/persona_contracts tests/checks/contracts/test_validate_persona_contracts.py -q
    red_green_expectation: green before and after; the amendment_log hold and decay rule (validate_contract_drift) is proved by step 5's full tier
constraints:
  - "No persona contract, template, rendered prompt or hash changes; slots on the five contracts are rec-5585."
  - "No workflow change: the prepare job already checks out main at github.sha to $GITHUB_WORKSPACE/main, and run.py derives execute.ROOT from its own path, so base_root is main's checkout without a new input."
  - "guidance.py is unchanged (its seam, HOME and file_default rules are rec-5569's, Decision 280 cl.4-5)."
  - "No existing test, assertion or check rule is loosened (Decisions 181, 235)."
  - "No rescue agents or workaround loops (Decision 55)."
