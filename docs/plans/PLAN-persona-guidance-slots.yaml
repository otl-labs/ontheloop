schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-guidance-slots
intent: >-
  Give persona contracts generic guidance slots and a role-keyed guidance provider seam whose default reads a file at
  the base ref, decided by a new Decision and recorded as instruction-architecture layers, so a project's guidance
  reaches a persona as input values outside the hash-pinned prompt before T4.28 to T4.30 build input producers
  (rec-5569; release-boundary audit RB-10, RB-11).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-guidance-slots.yaml
phase: >-
  T4.32 (persona foundation), c1's persona-machinery leg: the guidance seam lands beside materialise in
  scripts/personas/. No exit criterion is closed; it gates T4.28 c4, T4.29 c3 and T4.30 c3 producer work.
closes_criteria: []
cites: [dec:117, dec:185, dec:205, dec:206, dec:211, dec:235, dec:246, dec:276, dec:279]
amends: []
introduces: [persona-guidance-slot, persona-guidance-provider-seam]
scope:
  - file: docs/plans/approved/persona-guidance-slots.yaml
    action: Create
    purpose: >-
      The approved-text sidecar (Decisions 246, 279), written by this planning session and approved by the operator's
      approval run; the build never edits it. One block, decision-new: the new Decision placed after the corpus's
      intro paragraph, above the newest entry, with {{N}} and {{DATE}} placeholders.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Place block decision-new word-exactly, filling {{N}} with MAX(decision number across DECISIONS.md and
      DECISIONS_ARCHIVE.md) + 1 after rebasing onto origin/main (decision-entry.yaml number_assignment) and {{DATE}}
      with the build date; no other edit.
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      (a) persona_contract.fields gains guidance_slots: "Optional, for any kind: a list of input_schema property names,
      each a guidance slot (Decision N): named by role, never by a path, matching ^[a-z][a-z0-9_]*$; a required
      input_schema property whose schema is exactly {type: string} plus an optional description; never change_id,
      head_sha or plan (the fields the input builder fills from the change); named as read_input:<slot> in
      capabilities, so every backend offers it to the model; filled by guidance_slot's provider, never rendered into
      the prompt." (b) A new
      top-level guidance_slot block after fixture_kind: home "ontheloop/guidance/<persona>/<slot>.md" (the key the
      new Decision's cl.4 names; a value, not a delegation), provider_seam "scripts/personas/guidance.py", and rule: "Decision N: each declared slot
      is filled by the provider registered for its role, else by the file at home for that persona and slot, read at
      the base ref, never the change's head; an absent file gives an empty value; the value is quoted content that may
      add to or focus the persona's judgement, never relax it, and never enters the rendered prompt or its hash. Enforced
      by validate_persona_contracts (slot shape, leash) and tests/persona_contracts/test_persona_guidance_slots.py
      (provider order, base-root read, absent file); advisory at the chain's call site until rec-5605 wires it." (c)
      One amendment_log row at the top: change_class field_add, semantic_break false, naming this plan, rec-5569 and
      Decision N, and stating that no persona contract, rendered prompt or hash changes. N is the filled number.
  - file: scripts/persona_contracts/schema.py
    action: Modify
    purpose: >-
      PersonaContract gains guidance_slots: list[str] | None = None. A new _Strict model GuidanceSlot {home: str,
      provider_seam: str, rule: str}, and PersonaIndex gains guidance_slot: GuidanceSlot (after fixture_kind).
  - file: scripts/checks/contracts/validate_persona_contracts.py
    action: Modify
    purpose: >-
      (a) A _guidance_failures(persona, raw) helper, called from _contract_failures after the schema-dialect checks: a
      contract without guidance_slots passes; otherwise each entry must be a distinct string matching
      ^[a-z][a-z0-9_]*$, not change_id, head_sha or plan, a key of input_schema.properties whose schema is exactly
      {type: string} or {type: string, description: <str>} (const, enum, pattern, minLength, maxLength and every other
      keyword refused), listed in input_schema.required, and named as read_input:<slot> in capabilities; each failure
      names the persona and the slot. (b) _leash_failures also requires the guidance home's directory prefix, derived
      from index.guidance_slot.home as the text before "<persona>" (today "ontheloop/guidance/"), to be covered by
      capabilities.yaml boundary_patterns, so the leash follows the contract value rather than a literal. The module docstring's rule list names the slot shape. Stays under its 500
      SLOC cap (unregistered; VP 4 measures).
  - file: docs/contracts/instruction-architecture.yaml
    action: Modify
    purpose: >-
      The new Decision's cl.6: layers 6 (persona contracts) and 7 (project guidance), the run_persona consumer and one
      amendment_log row, with the exact field values in the context row that starts "instruction-architecture.yaml
      edit". No existing layer or consumer changes.
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      Append one boundary_patterns entry, "ontheloop/guidance/", as the list's final entry after
      scripts/ci/ci_rca_steps.sh, with no comment line (Decision 117 as amended by Decision 185; the new Decision's
      cl.5). The routing exemption holds only for a true end-of-list append (approval_routing.py, head[:len(base)] ==
      base). Appending to boundary_patterns is exempt from the wording gate
      (approval-routing.yaml gated.exempt: it only tightens). No other edit.
  - file: scripts/personas/guidance.py
    action: Create
    purpose: >-
      The provider seam, stdlib only (it runs beside materialise under python3 -I). HOME =
      "ontheloop/guidance/<persona>/<slot>.md" (a test pins it equal to executor-personas.yaml guidance_slot.home);
      GuidanceProvider = Callable[[Path, str, str], str], called as (base_root, persona, slot); register(slot,
      provider) adds to a module registry keyed by slot role and raises ValueError on a second registration for the
      same slot; file_default(base_root, persona, slot) raises ValueError when persona or slot is off
      ^[a-z][a-z0-9_]*$, reads base_root / HOME with both names filled, returns "" when the file is absent, and raises
      ValueError naming the path when it is a symlink, not a regular file, or not UTF-8; fill(base_root, persona, slots)
      returns {slot: text} using the registered provider for each slot, else file_default. base_root is always the
      base-ref checkout the caller passes (main's checkout in the verdict chain), never the head snapshot; the module
      names no persona id and imports nothing from scripts.personas.snapshot.
  - file: tests/persona_contracts/test_persona_guidance_slots.py
    action: Create
    purpose: >-
      Nodes: test_contract_schema_declares_generic_guidance_slot (rec-5569's acceptance: the real index's
      persona_contract.fields has guidance_slots and its guidance_slot.home equals guidance.HOME; PersonaContract
      accepts guidance_slots; a fixture_tree.build_tree contract that declares a well-formed slot passes
      validate_persona_contracts with no failure); test_malformed_slot_is_refused (parametrized, each yielding a failure
      naming the slot: absent from input_schema.properties, typed integer, carrying minLength 0, minLength 1,
      maxLength 0, const "", enum, pattern, not in required, named change_id, head_sha or plan, duplicated, named with
      a slash, missing read_input:<slot> in capabilities); test_guidance_home_leaves_boundary_is_refused (dropping
      "ontheloop/guidance/" from the tree's capabilities.yaml fails the leash check, and changing the tree's
      guidance_slot.home to another root moves the required prefix); test_slot_placeholder_in_template_is_refused (a
      prompt_template naming $<slot> fails validate_persona_contracts as unrenderable, the closed placeholder set);
      test_fixture_guidance_reaches_input_without_contract_change (a slot-declaring fixture contract's rendered bytes
      and rendered_prompt_sha256 are identical before and after writing two different guidance files under a tmp
      base root, and fill returns each file's text in turn); test_absent_guidance_file_is_empty;
      test_registered_provider_overrides_file_default (with a registry reset fixture; a duplicate register raises);
      test_non_utf8_guidance_is_refused; test_symlinked_or_off_pattern_guidance_is_refused (a symlink at the home path,
      a directory there, and a persona or slot name with a slash or dot each raise ValueError);
      test_fill_reads_only_the_given_base_root (a file present only under a head tmp dir is not read when fill is given
      the base dir; a library property, and the call-site test is rec-5605's).
bundled_recommendations: [rec-5569]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "bin/venv-python -m pytest tests/persona_contracts/test_persona_guidance_slots.py::test_contract_schema_declares_generic_guidance_slot -q passes (rec-5569's acceptance) and fails before the change (file absent)."
  - "Every node in tests/persona_contracts/test_persona_guidance_slots.py passes; validate_persona_contracts and validate_instruction_architecture_layers pass on the real tree."
  - "docs/DECISIONS.md carries exactly the sidecar's block, words-exact (approved_text verify --base origin/main exits 0), with {{N}} filled as max + 1."
  - "No persona contract, rendered prompt or rendered_prompt_sha256 changes (git diff origin/main -- docs/contracts/personas/ is empty)."
  - "rec-5569 is closed by the build's squash-merge Resolves trailer once its acceptance holds (Decision 201)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The acceptance node passes.
    command: bin/venv-python -m pytest tests/persona_contracts/test_persona_guidance_slots.py::test_contract_schema_declares_generic_guidance_slot -q
    expected: exit 0 with 1 passed; before the change the file does not exist and pytest exits non-zero
    fix_if: the node fails; the index field, the GuidanceSlot model or the validator's slot rule is missing or wrong
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: persona-guidance-slot-schema
  - step: 2
    phase: pre-deploy
    action: Every seam and refusal node passes.
    command: bin/venv-python -m pytest tests/persona_contracts/test_persona_guidance_slots.py -q
    expected: exit 0 with no failure; every malformed-slot variant, the leash refusal, the base-root read and the unchanged hash hold
    fix_if: a node fails; fix the seam or the validator, never the test's expectation
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: persona-guidance-slot-seam
  - step: 3
    phase: pre-deploy
    action: The real tree stays green under the two touched contract checks and the existing persona contract suites.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_persona_contracts.py
      tests/checks/contracts/test_validate_instruction_architecture_layers.py tests/persona_contracts -q
    expected: exit 0 with no failure
    fix_if: an existing node fails; the index model change or a layer row broke a check; fix the change, never an existing test
    hermetic: false
    graduation: waive
    graduation_waiver_reason: These suites already run in the full tier and in the fast tier when their inputs change; steps 1 and 2 graduate the new nodes.
  - step: 4
    phase: pre-deploy
    action: No persona contract or rendered prompt changed (the SLOC cap on validate_persona_contracts.py is gated by validate_sloc_limits in step 6).
    command: test -z "$(git diff --name-only origin/main -- docs/contracts/personas/)"
    expected: exit 0 (the diff is empty)
    fix_if: a contract or rendered prompt changed; revert it (slots on real contracts are rec-5585)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A branch-relative diff; validate_persona_contracts already holds the contracts' rendered-prompt rules on main.
  - step: 5
    phase: pre-deploy
    action: The approved text is placed word-exactly.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-guidance-slots --base origin/main
    expected: exit 0
    fix_if: a word differs; copy the block from the sidecar, never edit the sidecar
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_merge_step already binds the sidecar's words on the build PR; a registry copy adds no guard.
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it backgrounded from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 7
    phase: post-deploy
    action: rec-5569 closed by the build's squash-merge Resolves trailer once its acceptance holds.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(),
      ['rec-5569']); print(r[0]['id'], r[0]['status'])"
    expected: Prints rec-5569 closed.
    fix_if: Still open after the closure job ran; read ci.yml's closure job log and report to the plan owner.
    hermetic: false
test_obligations:
  - source: scripts/personas/guidance.py
    behavior: a registered provider wins over the file default; the default reads the base root only, an absent file is empty, non-UTF-8 is refused, and a guidance edit leaves the rendered prompt and hash unchanged
    verification_step: 2
    test_selector: tests/persona_contracts/test_persona_guidance_slots.py::test_fill_reads_only_the_given_base_root
    red_green_expectation: red before (module and test absent), green after
  - source: scripts/checks/contracts/validate_persona_contracts.py
    behavior: a malformed slot and a guidance home outside boundary_patterns are refused
    verification_step: 2
    test_selector: tests/persona_contracts/test_persona_guidance_slots.py::test_malformed_slot_is_refused
    red_green_expectation: red before (no slot rule), green after
  - source: scripts/persona_contracts/schema.py
    behavior: PersonaContract accepts guidance_slots and PersonaIndex carries guidance_slot
    verification_step: 1
    test_selector: tests/persona_contracts/test_persona_guidance_slots.py::test_contract_schema_declares_generic_guidance_slot
    red_green_expectation: red before (extra=forbid refuses the field), green after
  - source: docs/contracts/executor-personas.yaml
    behavior: the index declares guidance_slots and a guidance_slot.home equal to the seam's HOME
    verification_step: 1
    test_selector: tests/persona_contracts/test_persona_guidance_slots.py::test_contract_schema_declares_generic_guidance_slot
    red_green_expectation: red before (field and block absent), green after
  - source: config/agent/executor/capabilities.yaml
    behavior: the guidance home is inside the executor boundary, and its removal is refused
    verification_step: 2
    test_selector: tests/persona_contracts/test_persona_guidance_slots.py::test_guidance_home_leaves_boundary_is_refused
    red_green_expectation: red before (no leash path for the home), green after
  - source: docs/contracts/instruction-architecture.yaml
    behavior: layers 6 and 7 and the run_persona consumer resolve under the layer-claims check
    verification_step: 3
    test_selector: tests/checks/contracts/test_validate_instruction_architecture_layers.py
    red_green_expectation: green before and after; a new layer whose glob matches no file turns it red
  - source: docs/plans/approved/persona-guidance-slots.yaml
    behavior: the sidecar parses and its block is the one the operator approved
    verification_step: 5
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-guidance-slots --base origin/main
    red_green_expectation: red before (block not placed), green after
  - source: docs/DECISIONS.md
    behavior: exactly the approved new Decision is placed
    verification_step: 5
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-guidance-slots --base origin/main
    red_green_expectation: red before (block not placed), green after
