constraints:
  - >-
    Governing text only as approved: the deploy-paths and ports edits are the sidecar's words
    verbatim (approved_text verify, VP 2); any other wording need is a plan defect back to this planning thread
    (Decision 246).
  - >-
    The workflow holds no secret, assumes no AWS role, runs no LLM and spells no image reference; it pushes only the
    tag main and never deletes or retags an earlier version (a pinned digest must stay pullable).
  - >-
    No session pushes to the registry, changes package visibility or settings, or dispatches the workflow except VP 7's
    first_publish dispatch from main (once, plus one re-dispatch after a skip); package settings are operator steps A1-A3, each on the operator's own words.
  - >-
    config/persona_image.yaml is not edited (digest and source_commit stay null); pinning is PLAN-persona-image-pin's.
    deploy-gate.yml and the two Lambda channel workflows are not edited.
  - No key, account id or proxy value enters the image, a log, a summary or the repository (Decision 101).
  - Every new module stays under 500 SLOC (Decision 128).
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
