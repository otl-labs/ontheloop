constraints:
  - >-
    Governing text only as approved: the actions-capacity and deploy-paths edits are the sidecar's words verbatim
    (approved_text verify, VP 2); any other wording need is a plan defect back to this planning thread (Decision 246).
  - >-
    No secret, App or credential is added; pr-validate stays contents: read and actions: read, except one pre-approved
    fallback (operator card 2026-11-17 19:53 UTC): if VP 6 shows gh refused for want of a token permission, the build
    adds attestations: read to pr-validate's permissions and nothing else (with test_holds_actions_read's matching
    edit, scope), and records the refusal in the PR body. Any other need: STOP to this planning thread.
  - >-
    The pin is never hand-edited: only persona_image_pin update writes it, and only from the registry's main tag. No
    rollback pin; no --source-digest; no skip flag on verify.
  - >-
    The build PR (code plus the first pin) and every later pin PR merge only on the operator's final-diff word
    (Decision 246 cl.4: a pin is a deploy; registry_record.py and the pin script are code-owned).
  - >-
    No file outside config/persona_image.yaml and docs/plans/ spells an image reference (validate_persona_image_digest);
    tests read names through load_pin or use fake names.
  - Every new module stays under 500 SLOC (Decision 128).
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
