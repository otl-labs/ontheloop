    verification_step: 3
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_actions_capacity import validate_actions_capacity as a;
      from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as b;
      from scripts.checks.ci_guards.validate_persona_image_digest import validate_persona_image_digest as c;
      from scripts.checks.ci_guards.validate_persona_trigger_policy import validate_persona_trigger_policy as d;
      from scripts.checks.structural.size_limits import validate_structural_size_limits as e;
      f=[];[h(f) for h in (a,b,c,d,e)];print(*f,sep='\n');print(f'pin checks: {len(f)} failures');assert not f"
    waiver_reason: Comment-only edit; the value 1500.0 and the existing selection_budget tests are unchanged.
  - source: config/composite_action_body_baseline.yaml
    behavior: the new inline body has its R3 entry
    verification_step: 3
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_actions_capacity import validate_actions_capacity as a;
      from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as b;
      from scripts.checks.ci_guards.validate_persona_image_digest import validate_persona_image_digest as c;
      from scripts.checks.ci_guards.validate_persona_trigger_policy import validate_persona_trigger_policy as d;
      from scripts.checks.structural.size_limits import validate_structural_size_limits as e;
      f=[];[h(f) for h in (a,b,c,d,e)];print(*f,sep='\n');print(f'pin checks: {len(f)} failures');assert not f"
    red_green_expectation: red before (body without entry), green after
  - source: .github/CODEOWNERS
    behavior: the operator owns the pin script
    verification_step: 1
    test_selector: tests/ci/test_persona_image_pin.py
    waiver_reason: Procedural line (CODEOWNERS does not bind agent PRs); reviewed in the final diff, no behaviour to guard.
  - source: docs/contracts/actions-capacity.yaml
    behavior: the ledger row and its live_signal, word for word as approved
    verification_step: 1
    test_selector: tests/ci/test_persona_image_pin.py
    red_green_expectation: red before (row absent), green after
  - source: docs/contracts/deploy-paths.yaml
    behavior: the recovery pointer word for word as approved, file within its cap
    verification_step: 2
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-image-pin
    red_green_expectation: red before placement, green after
  - source: config/persona_image.yaml
    behavior: the pinned digest is the attested, labelled build of a main commit
    verification_step: 4
    command: bin/venv-python -m scripts.ci.persona_image_pin --check
    waiver_reason: The pin's standing guard is pr-validate's pin step on every later pin PR (VP 6 proves it once live); a session run lacks gh's CI token.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: T4.32 c2 met with met_by persona-image-pin
    verification_step: 7
    command: bin/venv-python -m scripts.ci.persona_image_pin --check
    waiver_reason: A one-time status flip that the exit-criteria ledger checks already validate in every tier.
constraints:
  - >-
    Governing text only as approved: the actions-capacity and deploy-paths edits are the sidecar's words verbatim
    (approved_text verify, VP 2); any other wording need is a plan defect back to this planning thread (Decision 246).
  - >-
    No permission, secret, App or credential is added; pr-validate stays contents: read and actions: read. If gh needs
    more, STOP to this planning thread.
  - >-
    The pin is never hand-edited: only persona_image_pin update writes it, and only from the registry's main tag. No
    rollback pin; no --source-digest; no skip flag on verify.
  - >-
    The build PR (code plus the first pin) and every later pin PR merge only on the operator's final-diff word
    (Decision 246 cl.4: a pin is a deploy; registry_record.py and the pin script are code-owned).
  - >-
    No file outside config/persona_image.yaml and docs/plans/ spells an image reference (validate_persona_image_digest);
    tests read names through load_pin or use fake names.
  - Every new module stays under 500 SLOC (Decision 128).
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
