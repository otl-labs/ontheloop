schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-image-pin
intent: >-
  Record the published persona image's digest in config/persona_image.yaml only after the required pr-validate check
  proves it is the attested build of a reviewed main commit (T4.32 c2's pin leg): a stdlib-plus-gh verification step
  runs whenever the pin's digest or source commit changes, a pin helper lets a session open each pin PR, and the
  actions-capacity ledger gains the publish channel's row. Third of the three image plans (PLAN-persona-image-twin
  built the image, PLAN-persona-image-channel publishes it). Serves NS.1: every persona host runs one tested,
  provenance-checked artefact.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-image-pin.yaml
phase: >-
  T4.32 c2 (pin leg; closes c2 at the first pin merge, the operator's decision card answered 2026-11-17 19:21:28 UTC). c2's remaining
  clause, the verdict workflow reading the pin, is already tracked as config/persona_image.yaml's pending
  github_actions_shell consumer owned by T4.2:c8 (PLAN-persona-image-twin), so met_by persona-image-pin re-homes no
  open work silently (Decision 136); c2's text is re-grounded to that mechanism in the flip's edit (sidecar e06). Builds after PLAN-persona-image-channel's build merges and the operator has set
  the package Public (an anonymous read of the published digest succeeds).
closes_criteria: [T4.32:c2]
fallback_reevaluation:
  reevaluated_on: "2026-11-17"
  substrate_status: CD.27 pending; executor substrate unratified; T4.2 not built; the T4.15 spike has not run.
  verdict: continue_on_current_substrate
  basis: >-
    T4.2:c8 is named only as the owner of the pin's pending github_actions_shell consumer; this plan pins a digest and
    verifies it in pr-validate, which every candidate layer-2 substrate would consume unchanged, so it touches no
    CD.27, fallback_spec or T4.15 ruling (the PLAN-persona-image-twin disposition).
cites: [dec:126, dec:153, dec:162, dec:205, dec:246, dec:249, dec:254, dec:264]
scope:
  - file: scripts/ci/persona_image_pin.py
    action: Create
    purpose: >-
      One module, run as python -m scripts.ci.persona_image_pin, stdlib plus load_pin (src.persona_hosts) and
      scripts.ci.registry_record, under 500 SLOC. Pin checks shared by both subcommands, each failing with its own
      PinError naming the rule:
      (a) digest and source_commit both set (load_pin's shape);
      (b) a pin change changes the digest (a new source_commit with the same digest is refused; the same source_commit
      with a new digest is a forced rebuild and allowed);
      (c) source_commit is an ancestor of the base commit (git merge-base --is-ancestor; the checkout is fetch-depth 0);
      (d) the base pin's source_commit, when set, is an ancestor of or equal to the new one (no rollback pin: forward-fix,
      Decision 254 cl.5);
      (e) registry_record.read_image(image, digest, token=None) answers one image manifest whose
      org.opencontainers.image.revision label equals source_commit (an anonymous read: the package is public).
      verify --base <sha> (pr-validate): parses the pin at <sha> (git show into a temporary root, read with load_pin)
      and HEAD's; the unchanged test reads only the image, digest and source_commit lines of each (a minimal line read, so a
      pin-schema change that leaves them alone still skips); an image line change -> exit 1 (moving the pinned
      repository needs its own plan); unchanged digest and source_commit -> one line "PERSONA-IMAGE-PIN skip reason=unchanged", exit 0; a
      set pin returning to null -> exit 1; when the pin changed and the base pin cannot be parsed -> exit 1 (fail
      closed; such a PR merges only on the operator's word, as every pin PR does); otherwise checks (a)-(e), then runs gh attestation verify
      oci://<load_pin(root).reference()> --repo <GITHUB_REPOSITORY> --signer-workflow
      <GITHUB_REPOSITORY>/.github/workflows/persona-image-publish.yml --source-ref refs/heads/main --predicate-type
      https://slsa.dev/provenance/v1 --deny-self-hosted-runners --format json (argv list, no shell; GITHUB_REPOSITORY
      read from the environment, the repository from git's origin when unset, so no file spells the image or the
      owner; no --source-digest: a workflow_run job runs at main HEAD, not the built sha), and prints
      "PERSONA-IMAGE-PIN verified digest=<d> source_commit=<s>". Any git, registry, gh or parse error exits 1
      (fail closed, never a skip). update (session): reads the main tag with read_image(image, "main", token=None),
      runs (a)-(e) against origin/main and the working tree's current pin, and rewrites only the digest and
      source_commit lines in place as double-quoted strings (text edit, comments and order kept); it does not run gh (the pin PR's pr-validate
      attests); when the main tag already equals the pin it prints "PERSONA-IMAGE-PIN current", writes nothing and exits
      0. check (a third subcommand): prints "PERSONA-IMAGE-PIN current" or "PERSONA-IMAGE-PIN stale pinned=<d> newest=<d>",
      exit 0 either way, exit 1 on a read error. Module docstring: every pin PR is opened by an agent session (a
      GITHUB_TOKEN-opened PR starts no CI) and merges only on the operator's final-diff word (Decision 246 cl.4: a pin
      is a deploy).
  - file: tests/ci/test_persona_image_pin.py
    action: Create
    purpose: >-
      Mirror test over tmp_path git repositories and injected registry and gh seams (no network, no daemon; image names
      from load_pin() or a fake name, never a literal reference, so validate_persona_image_digest stays green): each of
      (a)-(e) refused with its rule named; unchanged -> skip line and no registry or gh call; an image line change refused; set -> null refused; a
      first pin (base null) verified; a forced rebuild (same source_commit, new digest) verified; a rollback refused; a
      label mismatch refused; an index answer refused; gh exit non-zero -> exit 1; gh argv carries exactly --repo, --signer-workflow, --source-ref,
      --predicate-type, --deny-self-hosted-runners and --format json, and never --source-digest; a registry or git error -> exit 1, never a skip; update rewrites only the two lines;
      update's already-current no-op (nothing written, exit 0); check current and stale. Shape nodes: ci.yml's pr-validate has "Persona image pin verification" after the
      conformance step and before the upload step (still last), no continue-on-error, timeout-minutes 5, an env block
      of exactly GH_TOKEN and BASE_SHA, a run text of one line naming scripts.ci.persona_image_pin verify; the job's
      permissions are contents: read and actions: read (plus attestations: read only when the fallback was taken); docs/contracts/actions-capacity.yaml has the
      persona-image-publish row whose live_signal names .github/workflows/persona-image-publish.yml, event
      workflow_run; test_codeowners_names_the_pin_script: .github/CODEOWNERS owns /scripts/ci/persona_image_pin.py.
  - file: scripts/ci/registry_record.py
    action: Modify
    purpose: >-
      read_image(image, reference, *, token, opener=urllib.request.urlopen) -> ImageRecord(digest, revision): the
      existing token, manifest and config-blob reads for a tag or a sha256 digest reference, with the same Accept types,
      timeouts, unredirected token header, single-image-manifest shape rule and RecordError failures; the digest is
      the registry's Docker-Content-Digest header, checked equal to the sha256 of the manifest bytes read (and to the
      reference when it is a digest). read_image raises RecordError on any absence (NAME_UNKNOWN, MANIFEST_UNKNOWN,
      DENIED) as RecordAbsent, a RecordError subclass, so rule (e) and verify fail closed; RecordAbsent carries the
      registry code; read_record maps RecordAbsent to None as today except a DENIED one when first_publish is false,
      which still raises (the channel's fail-closed rule; any other RecordError still raises). read_record becomes a wrapper returning read_image(image, "main", ...).revision
      with its None-on-absent and first_publish behaviour unchanged. Stays stdlib (test_module_imports_only_stdlib).
  - file: tests/ci/test_registry_record.py
    action: Modify
    purpose: >-
      New nodes only: read_image by tag and by digest returns digest and label; a digest header that disagrees with the
      manifest bytes or the requested digest -> RecordError (not RecordAbsent); read_record returns None only on
      RecordAbsent (DENIED without first_publish still raises); existing read_record nodes unchanged and green.
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      pr-validate gains "Persona image pin verification" (id persona_image_pin) after PLAN-persona-image-twin's
      conformance step and before the upload step, which stays last: timeout-minutes 5, env GH_TOKEN ${{ github.token }}
      and BASE_SHA ${{ github.event.pull_request.base.sha }} on this step only (the per-step token pattern of the fast tier's APPROVED_TEXT_GH_TOKEN step, rec-4769),
      run python -m scripts.ci.persona_image_pin verify --base "$BASE_SHA". No permission is added: the job keeps
      contents: read and actions: read (the package and the attestations of a public repository read anonymously,
      UNPROVEN for gh's token until VP 6), except the pre-approved attestations: read fallback (constraints). The run text names neither run_persona nor persona_compute_host
      (validate_persona_trigger_policy). A workflow step, not a scripts.validate check: gh needs the job's token, and
      the fast tier gives a token only to its dedicated approved-text step. The job's timeout-minutes 45 -> 50 (Decision 153 cl.3 re-derivation below).
  - file: tests/ci/test_persona_image_changed.py
    action: Modify
    purpose: >-
      test_ci_step_shape's job-timeout assertion 45 -> 50; if, as built, it asserts the conformance step sits immediately
      before the upload step, that order assertion becomes conformance, then the pin step, then upload (still last);
      no other node changes.
  - file: tests/test_approved_text_approval_workflow.py
    action: Modify
    purpose: >-
      Only when VP 6 takes the operator's pre-approved fallback: TestPrValidate::test_holds_actions_read expects
      contents: read, actions: read and attestations: read; no other node changes. Untouched otherwise. The graduated
      shard approved-text-approval-workflow-shape, which runs this file, is kept unchanged.
  - file: scripts/checks/deps/selection_budget.py
    action: Modify
    purpose: >-
      Comment only (Decision 153 cl.3): the CEILING_SECONDS derivation names pr-validate's 50-minute timeout minus the
      conformance step's 15 minutes, the pin step's 5 minutes and the ~5-minute margin = 25 minutes = 1500 s; the
      value stays 1500.0.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      One r3_workflows entry, ".github/workflows/ci.yml::pr-validate::<step id as the guard derives it>", at its
      effective line count (1) (Decision 162 R3). The body writes no GITHUB_OUTPUT, so R1 is not engaged.
  - file: .github/CODEOWNERS
    action: Modify
    purpose: >-
      /scripts/ci/persona_image_pin.py added to PLAN-persona-image-channel's persona image block (operator). Procedural
      only: CODEOWNERS does not bind agent PRs (rec-2827, Decision 239). The control is the operator's word on each
      pin PR with Decision 264's required-check gate, never this line.
  - file: docs/contracts/actions-capacity.yaml
    action: Modify
    purpose: >-
      Approved text only (sidecar blocks): the persona-image-publish ledger row (items [T4.32], per_merge, assumed,
      2.0 job-minutes, live_signal {workflow: .github/workflows/persona-image-publish.yml, job: "*", event:
      workflow_run}) and one amendment_log row. No other word of the file changes (approved_text verify binds it).
      Pin PRs' own load (the pin step plus the conformance re-run, up to about 16 job-minutes per pin PR) is measured
      live under ci.yml pr-validate, which the gauge already reads, so it needs no ledger row.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Approved text only (sidecar blocks): publish_persona_image's recovery sentence "Consumers move only when a pin PR
      records a new digest." gains a pointer that a pin PR passes pr-validate's pin verification and merges on the
      operator's word (Decision 246 cl.4), a pointer, not a second copy of the rule (Decision 126 cl.2); one
      amendment_log row. NEAR_CAP relief (482 of 500 effective lines before PLAN-persona-image-channel's row, about 490
      after it): sidecar block e05 reflows the 2026-10-17 amendment_log entry (PLAN-platform-iam-personal-release) to
      one flow mapping with its words unchanged (-8 effective lines; the 2026-10-25/26/29/30 entries are other plans'
      reliefs), so this plan nets -7 (critique r2 measured 490 -> 483 after the channel's row).
  - file: config/persona_image.yaml
    action: Modify
    purpose: >-
      The first pin: digest and source_commit written by persona_image_pin update from the published main tag. The one
      other change: the twin's header comment ("written by the publish channel's pin PRs", PLAN-persona-image-twin's
      scope row) is corrected to say an agent session opens pin PRs with persona_image_pin update and the operator
      merges them, and its "read only through src/persona_hosts/image_pin.py" clause is qualified to name the two
      line-level readers (persona_image_changed.py, and persona_image_pin.py, which also rewrites the digest and
      source_commit lines); comment lines only. No other line changes (VP 4 asserts it).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Approved text only (sidecar block e06): T4.32 c2 status open -> met with met_by persona-image-pin, and in the
      same edit c2's text is re-grounded per the realized-differently rule (exit-criteria-ledger.yaml status.semantics):
      the clause "the pushed digest is recorded in one repository file that the verdict workflow and the local twin
      both read" becomes the realized mechanism, config/persona_image.yaml read by the local twin today and by the
      verdict workflow as its github_actions_shell consumer (T4.2:c8), which PLAN-persona-verdict-fixture-run wires
      under T4.32 c3. The original clause goes in the build PR body (the realized-differently rule's progress_note home is optional
      for a non-terminal item, and T4.32's progress_note stays unedited because approved_text binds the file). No other word of the
      file changes in the build PR (approved_text verify binds it).
bundled_recommendations: []
followon_recs: [rec-5315, rec-5316, rec-5317]
infrastructure_dependencies:
  - >-
    Lambda: compute_affected_artifacts over the scope returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']}
    (active). Disposition: a criterion flip and re-grounding in a packaged roadmap asset, no code change, so no build,
    deploy or smoke step from the session; this merge changes a watched data-pipeline path, so the governed channel
    ships it with the next green (Decision 249 cl.2, Decision 254 cl.5), as in PLAN-loop-candidate-decisions and
    PLAN-persona-verdict-chain.
  - >-
    No Terraform and no new credential or permission. Needs on main before the build: PLAN-persona-image-channel's
    build (persona-image-publish.yml, registry_record.py, the deploy-paths row) with at least one attested publish,
    and the operator's step A2 of that plan (package Public), proved by its VP 9 anonymous read; rec-5294's build
    (actions-capacity tests independent of the ledger row count and of the workflows copied into the test tree) before
    the wording check.
acceptance_criteria:
  - A PR that changes the pinned digest or source commit passes pr-validate only when the image is the attested, labelled build of a main commit at or after the previous pin; any other PR that leaves the image, digest and source_commit lines unchanged prints a skip line for the step.
  - Each pin rule (a)-(e), a failed attestation and any read error fail the step with the rule named; none skips.
  - persona_image_pin update writes the newest published digest and its source commit, and check reports current or stale.
  - config/persona_image.yaml holds the first verified pin on main; T4.32 c2 reads met with met_by persona-image-pin and its re-grounded text (this criterion closes c2).
  - actions-capacity.yaml and deploy-paths.yaml carry the approved words verbatim.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The pin checks, the registry digest read and the pr-validate step shape.
    command: bin/venv-python -m pytest tests/ci/test_persona_image_pin.py tests/ci/test_registry_record.py tests/ci/test_persona_image_changed.py tests/test_approved_text_approval_workflow.py -q
    expected: Exit 0, every node passes. Red before (module, read_image and step absent; timeout 45).
    fix_if: A rule that skips instead of failing, --source-digest in the argv, a token outside the step env, or a widened permission (except the constraints' pre-approved read-only attestations fallback); fix the code, never the test.
    hermetic: false
    graduation: graduate
    graduation_check_id: persona-image-pin-verify
  - step: 2
    phase: pre-deploy
    action: The approved wording placed verbatim.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-image-pin
    expected: Exit 0; the sidecar's digest unchanged and every block placed.
    fix_if: A mismatch means the placed words differ from the approved words; restore them, never re-approve silently.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_merge_step already runs the same approved_text verify on every PR that declares this plan; a shard would duplicate it.
  - step: 3
    phase: pre-deploy
    action: The registered checks over the live tree that this change's files feed.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_actions_capacity import validate_actions_capacity as a;
      from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as b;
      from scripts.checks.ci_guards.validate_persona_image_digest import validate_persona_image_digest as c;
      from scripts.checks.ci_guards.validate_persona_trigger_policy import validate_persona_trigger_policy as d;
      from scripts.checks.structural.size_limits import validate_structural_size_limits as e;
      from scripts.checks.roadmap.validate_platform_roadmap import validate_platform_roadmap as r;
      f=[];[h(f) for h in (a,b,c,d,e,r)];print(*f,sep='\n');print(f'pin checks: {len(f)} failures');assert not f"
    expected: The last line reports 0 failures.
    expected_literals:
      - 'pin checks: 0 failures'
    fix_if: A failure names the file to fix; never loosen a check. deploy-paths.yaml over its cap -> STOP to this planning thread.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: All six are registered checks that already run in every tier; a shard would duplicate them.
  - step: 4
    phase: pre-deploy
    action: The first pin, written by the helper from the live registry, then checked by the helper.
    command: >-
      git fetch -q origin main && bin/venv-python -m scripts.ci.persona_image_pin update &&
      bin/venv-python -m scripts.ci.persona_image_pin check | grep -x 'PERSONA-IMAGE-PIN current' &&
      test "$(git diff -U0 origin/main -- config/persona_image.yaml | grep -vE '^(\+\+\+|---) ' | grep -E '^[+-]' |
      grep -vE '^[+-][[:space:]]*(#|$)' | sed -E 's/^([+-])[[:space:]]*([a-z_]+):.*/\1\2/' | LC_ALL=C sort | tr '\n' ' ')" =
      "+digest +source_commit -digest -source_commit "
    expected: >-
      update exits 0, check prints the current line, and among the pin file's non-comment, non-blank lines only the
      digest and source_commit lines differ from origin/main (the header-comment correction is a comment line, so it
      passes), before and after the pin and the comment correction are committed. A re-run (closure step) that rewrites the pin because a
      newer publish landed is committed before VP 5.
    fix_if: >-
      DENIED means the package is still private (channel plan step A2, the operator's); a rule failure names it; a
      session proxy refusing ghcr.io: STOP to this planning thread. Never hand-edit the digest.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A one-time live read of the registry; VP 6's pr-validate run is the standing proof.
  - step: 5
    phase: pre-deploy
    action: Pre-handoff full tier on the committed, rebased tree (Decision 163), read through its evidence file.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports the full tier passed on HEAD's tree.
    fix_if: Any failure; fix and re-run both from the start (timeout_disposition blocked).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      After the PR is pushed, pr-validate passed on its head and its pin step verified the first pin (the PR changes
      the pin, so the step ran in full, gh attestation verify included).
    command: >-
      bin/venv-python -c "import json,subprocess,urllib.request as u;sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
      g=lambda p:json.load(u.urlopen(u.Request('https://api.github.com/repos/otl-labs/ontheloop/'+p,headers={'Accept':'application/vnd.github+json'})));
      run=g('actions/workflows/ci.yml/runs?event=pull_request&head_sha='+sha)['workflow_runs'][0];
      job=[j for j in g('actions/runs/%d/jobs'%run['id'])['jobs'] if j['name']=='pr-validate'][0];
      st={s['name']:s['conclusion'] for s in job['steps']};p=st.get('Persona image pin verification');print('pr-validate:',job['conclusion'],'pin:',p,'job',job['id']);assert job['conclusion']=='success' and p=='success'" &&
      J=$(gh api "repos/otl-labs/ontheloop/actions/workflows/ci.yml/runs?head_sha=$(git rev-parse HEAD)&event=pull_request" --jq '.workflow_runs[0].id' | xargs -I{} gh api repos/otl-labs/ontheloop/actions/runs/{}/jobs --jq '.jobs[]|select(.name=="pr-validate").id') && test -n "$J" &&
      P=$(bin/venv-python -c "from pathlib import Path;from src.persona_hosts import load_pin;p=load_pin(Path('.'));print(f'digest={p.digest} source_commit={p.source_commit}')") &&
      gh api "repos/otl-labs/ontheloop/actions/jobs/$J/logs" | grep -m1 -F "PERSONA-IMAGE-PIN verified $P"
    expected: >-
      pr-validate success and the pin step success, then the job log's PERSONA-IMAGE-PIN verified line naming VP 4's
      digest and source commit exactly, read from the committed pin (a skip line or another digest fails the grep). gh
      is attempted first; if gh's session auth is refused, read the logs with mcp__github__get_job_logs on the printed
      job id and check the same exact line. Record both and
      the working gh flags in the PR body.
    fix_if: >-
      An unknown gh flag: use the working invocation PLAN-persona-image-channel's handoff records (its VP 8 does not
      exercise --predicate-type or --format json; if either is refused, read gh attestation verify --help on the runner
      and record the working form), never drop --signer-workflow or --source-ref. gh refused for want of a token permission: add attestations: read to
      pr-validate's permissions only (the operator's pre-approved fallback, constraints) and re-run; anything more is a
      STOP to this planning thread. Fix on the branch; never skip the step.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: It reads one PR's run; pr-validate itself is the standing gate.
  - step: 7
    phase: post-deploy
    action: '[post-deploy] On main after the merge: the pin is current, the pinned digest reads anonymously and c2 is met.'
    command: >-
      git fetch -q origin main && W=$(mktemp -d) && git worktree add -q --detach "$W" origin/main && cd "$W" &&
      $OLDPWD/bin/venv-python -m scripts.ci.persona_image_pin check &&
      R=$($OLDPWD/bin/venv-python -c "from pathlib import Path;from src.persona_hosts import load_pin;print(load_pin(Path('.')).reference())") &&
      (DOCKER_CONFIG=$(mktemp -d) docker manifest inspect "$R" >/dev/null && echo ANONYMOUS_PIN_READ_OK || echo 'docker read UNPROVEN through the proxy') &&
      $OLDPWD/bin/venv-python -c "import yaml;d=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'));c=[c for i in d['tier_items'] if i['id']=='T4.32' for c in i['exit_criteria'] if c['id']=='c2'][0];print('c2',c['status'],c.get('met_by'));assert c['status']=='met' and c.get('met_by')=='persona-image-pin'";
      rc=$?; cd "$OLDPWD" && git worktree remove --force "$W"; test $rc -eq 0
    expected: >-
      The current line (or a stale line naming a newer publish, which then wants the next pin PR, not a fix), then
      ANONYMOUS_PIN_READ_OK or the UNPROVEN line, then "c2 met persona-image-pin".
    fix_if: c2 not met means the flip did not land; restore it in a follow-up PR on the operator's word.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/ci/persona_image_pin.py
    behavior: rules (a)-(e), skip only when unchanged, fail closed on every error, gh argv without --source-digest, update and check
    verification_step: 1
    test_selector: tests/ci/test_persona_image_pin.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/ci/registry_record.py
    behavior: read_image returns the checked digest and label by tag and by digest; read_record unchanged
    verification_step: 1
    test_selector: tests/ci/test_registry_record.py
    red_green_expectation: red before (read_image absent), green after
  - source: .github/workflows/ci.yml
    behavior: the pin step's place, env, timeout and one-line body; job permissions unchanged; job timeout 50
    verification_step: 1
    test_selector: tests/ci/test_persona_image_pin.py
    red_green_expectation: red before (step absent), green after
  - source: tests/test_approved_text_approval_workflow.py
    behavior: "pr-validate's permissions assertion matches the job (attestations: read only after the fallback)"
    verification_step: 1
    test_selector: tests/test_approved_text_approval_workflow.py::TestPrValidate::test_holds_actions_read
    red_green_expectation: red if the fallback is taken without the test edit, green after
  - source: scripts/checks/deps/selection_budget.py
    behavior: CEILING_SECONDS unchanged; comment re-derived
    verification_step: 3
    command: >-
