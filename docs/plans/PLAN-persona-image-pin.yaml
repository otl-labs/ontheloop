    Preconditions: the three builds above on main and the package Public; re-run scripts.ci_rca.red_overlap; read
    PLAN-persona-image-channel's handoff for the working gh flags; measure deploy-paths.yaml on main (STOP if e05's before text is absent, or if the
    sidecar placement would pass the cap).
  - >-
    registry_record.read_image and its tests (pre: test_registry_record green on main; post: VP 1's registry nodes
    green).
  - scripts/ci/persona_image_pin.py and tests/ci/test_persona_image_pin.py.
  - >-
    ci.yml's pin step and job timeout; test_persona_image_changed.py's timeout node; selection_budget.py's comment; the
    body-baseline entry; CODEOWNERS.
  - Place sidecar blocks e01-e05 verbatim (actions-capacity, deploy-paths with the e05 relief); approved_text verify runs once e06 is placed too.
  - VP 4 (the first pin through the helper), then the pin file's header-comment correction (scope row; comment lines only), then VP 4 again, then place sidecar block e06 (T4.32 c2 met and re-grounded); then approved_text verify (VP 2).
  - Execute Verification Plan pre-deploy steps 1-6 -- loop until pass; on unrecoverable failure stop and RCA (Decision 55).
  - >-
    CLOSURE, each outcome reported separately (implement skill Commit Flows; docs/contracts/git-ops.yaml
    handoff_sequence): bin/venv-python -m scripts.session.github_readiness; run /implement's Verification Graduation
    walk, which writes the registry shard for persona-image-pin-verify; set implementation_declared: true in this
    plan; commit (feat(persona-image-pin): ...); git fetch origin main && git rebase origin/main; re-run VP 1-4 if the
    rebase changed a scope file; VP 5 on that committed, rebased tree (full tier backgrounded from the top-level
    session with a 2 h limit, then --verify-head; a timeout is BLOCKED, no push); write
    /tmp/implementation-retrospective.json with the scripts.session.postflight_evidence.CATEGORIES keys and run
    bin/venv-python -m scripts.session.postflight --evidence /tmp/implementation-retrospective.json; push (git push -u
    origin HEAD as its own call); open the PR and report it as opened only with the returned PR number; subscribe;
    code review in a fresh context; VP 6 on the PR's pr-validate run (after any post-push fix commit, such as the fallback, re-run VP 1 and VP 5 on the new head before re-pushing); squash-merge only on code review PROCEED, green
    CI (Decision 264), validate_merge_step and the operator's word on the final diff (a pin is a deploy, Decision 246
    cl.4), reporting the merge SHA; then VP 7.
  - >-
    Report: the readiness, graduation, --verify-head and postflight outcomes separately; the verified digest and source
    commit; the PR number, VP 6's run id, whether the attestations: read fallback was taken, the working gh flags and
    the merge SHA; the data-pipeline deploy run id that ships the roadmap change (or "pending the next green"); tell the coordinator that later pin PRs (after any publish) are session-opened with
    persona_image_pin update and merge on the operator's word.
