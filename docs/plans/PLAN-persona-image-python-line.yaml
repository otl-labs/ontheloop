schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-image-python-line
intent: >-
  Keep the persona image on the repository's Python line (rec-5383): Dependabot stops proposing Python minor or major
  moves for the docker/persona base image while same-tag digest refreshes still arrive, and the registered
  persona-image digest check fails any tree where the image's base Python, its hashed lock and the repository's
  .python-version disagree, so a bump like closed PR #2170 (3.12 -> 3.15, unbuildable lock) is refused at --pre.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-image-python-line.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category: rec-5383, Low, filed by the persona-image planning line; no tier_item
  claimed, so the Tier Item Freshness Gate is skipped; closes no criterion). Related, not targeted: it hardens the
  image PLAN-persona-image-twin built under T4.32 c2 (image channel), whose status it does not change.
  No Lambda-packaged file changes; nothing is published or deployed, so V2.
cites: [dec:170, dec:235]
scope:
  - file: .github/dependabot.yml
    action: Modify
    purpose: >-
      On the docker entry for directory /docker/persona add, in the file's block-list style, an ignore row:
      dependency-name "python" with update-types "version-update:semver-major" and "version-update:semver-minor".
      No semver-patch and no versions key, so same-tag (3.12-slim) digest refreshes and the 3.12.x releases they carry
      still arrive. A one-line comment says a Python line move is a deliberate repo-wide upgrade that recompiles the
      lock. No other entry changes.
  - file: scripts/checks/ci_guards/validate_persona_image_digest.py
    action: Modify
    purpose: >-
      Two new rules, _RULE_COUNT 6 -> 8. The module docstring names both and states the new coupling: the lock stays the
      image's own (never compared with requirements-dev.txt), but its Python line now follows the repository's
      .python-version. (1) Dependabot python-line ignore, inside
      _dependabot_findings: the docker update entry for the image directory carries an ignore row whose
      dependency-name equals the base image name parsed from the Dockerfile FROM line (derived, Decision 187 style;
      never the literal "python"), whose update-types include both version-update:semver-major and
      version-update:semver-minor, and which has neither version-update:semver-patch nor a versions key (either would
      hold back patch or digest refreshes); every ignore row naming that dependency is examined, so a second row carrying
      a semver-patch or versions hold is a finding too; each miss is its own finding. When the FROM line cannot be
      read or parsed, rule (1) emits its own finding (no base image name to match) rather than passing. (2) Python line, a new
      _python_line_findings(root, pin): the base tag's MAJOR.MINOR from FROM (regex on the tag's leading digits, any
      suffix such as -slim allowed), the lock header's "autogenerated by pip-compile with Python X.Y", and
      the repository's .python-version (its leading MAJOR.MINOR, so 3.12 and 3.12.7 both read as 3.12, matching the
      graduated python-version-file-matches-required-minor) must all be equal; a value that cannot be read or parsed is a
      finding (fail closed, never a silent pass), and a mismatch finding names all three values. Wired into
      validate_persona_image_digest's found list. Filesystem-only; no new import. File stays
      well under its 500 SLOC budget (151 lines today).
  - file: tests/checks/ci_guards/test_validate_persona_image_digest.py
    action: Modify
    purpose: >-
      Fixture tree made consistent with the new rules: _DEPENDABOT's docker entry gains the ignore row; the lock
      content written by _tree (the inline "x==1" literal; _LOCK is the path constant) gains a pip-compile header
      "with Python 3.12"; _tree writes a .python-version of 3.12. Existing assertions unchanged (Decision 235). New parametrized node
      test_python_line_violation_is_red, one case per finding: docker entry has no ignore; ignore names another
      dependency; ignore lacks semver-minor; ignore lacks semver-major; ignore adds semver-patch; ignore has a versions
      key; FROM python:3.15-slim with the 3.12 lock and .python-version; lock header 3.13; .python-version 3.13; FROM tag with no
      MAJOR.MINOR (python:slim); lock without a header; .python-version unparseable; .python-version
      missing; FROM line with no tag at all. Each asserts its own needle in the failed list. A companion green case
      writes .python-version 3.12.7 and asserts no Python-line finding. test_live_repository_is_green (existing) is red until
      the dependabot.yml edit lands.
bundled_recommendations: [rec-5383]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - .github/dependabot.yml's docker /docker/persona entry ignores semver-major and semver-minor updates of the base image and nothing else.
  - validate_persona_image_digest fails a tree whose Dependabot docker entry lacks that ignore, or adds a patch or versions hold.
  - validate_persona_image_digest fails a tree whose Dockerfile base Python, lock header Python and .python-version are not all equal, or cannot be read.
  - The live repository passes the check, and rec-5383's acceptance passes and it closes on the build's merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "rec-5383's acceptance node plus the live-repository node (red before: the new node does not exist; with it but no rules, its cases fail; with rules but no dependabot.yml edit, the live node fails)."
    command: bin/venv-python -m pytest "tests/checks/ci_guards/test_validate_persona_image_digest.py::test_python_line_violation_is_red" "tests/checks/ci_guards/test_validate_persona_image_digest.py::test_live_repository_is_green" -q
    expected: exit 0, every case passed, none failed
    fix_if: a case fails (its rule is missing or its needle differs); the live node fails (dependabot.yml, Dockerfile, lock header and .python-version disagree)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: persona-image-python-line  # pins tests/checks/ci_guards/test_validate_persona_image_digest.py::test_python_line_violation_is_red (rec-5383's acceptance)
  - step: 2
    phase: pre-deploy
    action: Re-run the whole check test file, existing cases included.
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_persona_image_digest.py -q
    expected: exit 0, no failures
    fix_if: an existing case fails (fix the fixture or the rule, never loosen an assertion, Decision 235)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file re-run of a test file this plan modifies; --pre already selects it, so it adds no standing guard.
  - step: 3
    phase: pre-deploy
    action: Run the registered check against the live tree and print its lines.
    command: bin/venv-python -c "from scripts.checks.ci_guards.validate_persona_image_digest import validate_persona_image_digest as c; f=[]; c(f); print(f); assert not f"
    expected: the check prints its PASS line and an empty failed list; exit 0
    fix_if: a FAIL line names the dependabot ignore or the Python line
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Green before the change by construction (the live tree passes the six existing rules); step 1's live node is the standing guard.
  - step: 4
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy): bin/venv-python -m scripts.validate --pre in the
      foreground (exit 0), then this command as its own backgrounded run with a 2 h limit from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: "--pre exited 0 first; this command exits 0 for HEAD"
    fix_if: >-
      a failure in this plan's files is fixed at root and the full tier rerun; a failure only in another project's open
      red goes to the operator as the implement skill's go/no-go; it never hands off on a non-green full tier by default
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: Confirm rec-5383 closed after the squash merge (Resolves trailer).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader;
      r=make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5383')[0]; print(r['status']); assert r['status']=='closed'"
    expected: rec-5383 status closed
    fix_if: still open after ci.yml's closure job ran; close it with update_rec citing the merge SHA
    hermetic: false
  - step: 6
    phase: post-deploy
    action: >-
      After each of the first four weekly Dependabot docker runs following the merge (live Dependabot behaviour is
      UNPROVEN at plan time; see context): list Dependabot branches for docker/persona with the command, and read
      that run's docker /docker/persona job log (mcp__github__actions_list for the Dependabot Updates workflow, then
      mcp__github__get_job_logs on its docker /docker/persona job).
    command: git ls-remote origin 'refs/heads/dependabot/docker/docker/persona/*'
    expected: >-
      Both halves hold. No branch or job-log line moves python to 3.13 or later (the log reports those versions as
      ignored). And the digest path still runs: either a same-tag python 3.12-slim digest refresh branch or PR appears,
      or the job log shows the same-tag digest check ran and found the pinned digest current.
    fix_if: >-
      A branch or PR bumps python past the repository line (the ignore is not honoured); or a job log shows the
      same-tag digest update filtered as ignored; or four weekly runs pass with no digest refresh and no log line
      showing the digest check ran. Each files a rec naming the run id and the log lines.
    hermetic: false
test_obligations:
  - source: scripts/checks/ci_guards/validate_persona_image_digest.py
    behavior: A missing or partial Dependabot python-line ignore, or any disagreement between the image base Python, the lock header and .python-version, fails the check.
    verification_step: 1
    test_selector: tests/checks/ci_guards/test_validate_persona_image_digest.py::test_python_line_violation_is_red
    red_green_expectation: red before (node absent, then each case unmet without its rule), green after.
  - source: .github/dependabot.yml
    behavior: The live repository's Dependabot docker entry for the image carries the python-line ignore.
    verification_step: 1
    test_selector: tests/checks/ci_guards/test_validate_persona_image_digest.py::test_live_repository_is_green
    red_green_expectation: red once the rules land without the config edit, green after the edit.
constraints:
  - No existing assertion changes (Decision 235); fixture changes only add the files and rows the new rules read.
  - The base image name and Python line are derived from the Dockerfile, lock and .python-version; no 3.12 or python literal in the check.
  - _manifest.py is untouched (the check is already pre=True, pre_globs=None).
  - No rescue agents or workaround loops (Decision 55).
