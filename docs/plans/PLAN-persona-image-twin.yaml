  - file: tests/persona_hosts/conformance_suite.py
    action: Create
    purpose: >-
      Named outside pytest's test_*.py pattern so no default collection, affected-test selection or tier run picks it
      up (it is passed explicitly by the pr-validate step and by the publish plan's workflow). The persona_compute_host
      conformance suite (Decision 212 cl.2; T4.2 c14's gating leg), written for reuse by every adapter of the port
      (Decision 234 cl.2, T4.34 c3): the legs take the adapter's run_image from a module-level ADAPTERS map
      (local_container today) and the image build is a separate fixture, so a later adapter adds a map entry, never a
      second suite. Fixtures are module-scoped and every leg sets up what it reads, so the legs pass in any order under
      pytest-randomly (critique r1 B1). The dummy key value and DEEPSEEK_API_BASE (derived as run_image derives it) are
      set inside the suite process, never in the workflow step's env (validate_persona_trigger_policy's secret
      signature, Decision 184 cl.3). Builds the image from the tree under test with build_image, then a derived fixture
      image (tests/persona_hosts/fixture_image/Dockerfile) from a temp build context the suite assembles: the backend
      plan's fixture contract and rendered prompt, and an inference-provider.yaml generated from the live file with a
      fixture_persona row under litellm_persona_selection.personas copying plan_critic's settings for both roles
      (critique r1 B2). It creates an --internal docker network; starts tests/persona_hosts/stub_provider.py in the
      pinned base image on it; then through run_image with key_variable set to the tier 1 api_key variable holding a
      dummy value and the base-URL variable pointing at the stub: (1) the complete input returns exit 0 and a success
      value valid against the fixture contract's output_schema, after one read_input tool turn the stub scripts, with
      exactly two stub hits; the
      events header names the fixture persona and its rendered_prompt_sha256; (2) the incomplete input returns exit 0,
      failure input_incomplete and zero stub hits; (3) an unknown persona exits 2; (4) through run_argv with
      entrypoint ["python", "-c", <a write to /app and an id -u>], the process runs as uid 10001 and the write fails;
      (5) the dummy key value appears in neither stdout nor the events file; (6) through run_argv with an entrypoint
      opening a TCP connection to a public address on the --internal network, the connection fails (egress denied,
      Decision 234 cl.2). Cleans up network and containers in a
      finally. Without a reachable daemon it fails with a "docker unreachable" message, never skips. It reaches docker
      and the containers only through subprocess and opens no socket in-process (pyproject addopts carry
      --disable-socket --allow-hosts=127.0.0.1,::1).
  - file: tests/persona_hosts/stub_provider.py
    action: Create
    purpose: >-
      Stdlib http.server answering POST /chat/completions (and /v1/chat/completions) in the OpenAI shape: first a
      read_input tool call, then a final JSON object valid against the fixture output_schema; counts hits and prints
      one "STUB_HIT <n>" line per request for the suite to read from the container log.
  - file: tests/persona_hosts/fixture_image/Dockerfile
    action: Create
