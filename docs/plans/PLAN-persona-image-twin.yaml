infrastructure_dependencies:
  - >-
    None. No .tf file is in scope. compute_affected_artifacts(<scope>) names data-pipeline through its manifest and,
    until the manifest's new src/persona_hosts exclude lands in the same change, the src/persona_hosts files; after it,
    only src/lambdas/data-pipeline/manifest.yaml (an exclude edit, which bundles nothing new). VP 7 proves no artifact
    and no deploy channel's pathspec is hit, so the change builds or deploys nothing (V2).
acceptance_criteria:
  - A pull request touching any image input runs the conformance suite in the required pr-validate job, and one touching none skips it with a printed reason.
  - The image builds from the tree with pip --require-hashes, runs as user 10001 and holds the entrypoint, its closure, the persona contracts and the two resolver files at their repository paths.
  - Through run_image on local_container, a fixture persona against a stub provider returns a schema-valid success, an incomplete input returns input_incomplete with no provider call, and an unknown persona exits 2, credential-free in PR CI.
  - validate_persona_github_agnosticism is red on each fixture violation and green on the repository.
  - validate_persona_image_digest is red on each fixture violation and green on the repository; no tracked file outside config/persona_image.yaml and docs/plans/ holds an image reference.
  - ports.yaml records local_container as implemented, its oracle and conformance suite present; the roadmap is unchanged (T4.2 c14 stays open).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The pin loader and the local_container adapter and build helper, without a daemon.
    command: bin/venv-python -m pytest tests/persona_hosts/test_image_pin.py tests/persona_hosts/local_container/ tests/persona_hosts/test_package_boundary.py -q
    expected: Exit 0, every node passes. Red before (modules and tests absent).
    fix_if: A tag accepted, a key value in argv, a forbidden mount or flag, or a schema breach loaded; fix the module, never the test.
    hermetic: false
    graduation: graduate
    graduation_check_id: persona-image-twin-adapter
  - step: 2
    phase: pre-deploy
    action: The two checks red on every fixture violation and green on the repository, and their manifest entries.
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_persona_github_agnosticism.py tests/checks/ci_guards/test_validate_persona_image_digest.py tests/checks/ci_guards/test__manifest.py -q
    expected: Exit 0, every node passes. Red before (checks absent).
    fix_if: A fixture violation passing; widen the check, never drop the fixture.
    hermetic: false
    graduation: graduate
    graduation_check_id: persona-image-twin-checks
  - step: 3
    phase: pre-deploy
    action: The decision script and the shape of the two pr-validate steps.
    command: bin/venv-python -m pytest tests/ci/test_persona_image_changed.py -q
    expected: Exit 0, every node passes. Red before (script, steps and test absent).
    fix_if: An image input that does not trigger the suite, or an error that skips it; fix the script (fail closed).
    hermetic: false
    graduation: graduate
    graduation_check_id: persona-image-twin-ci-step
  - step: 4
    phase: pre-deploy
    action: The registered checks over the live tree, including the companions this change touches.
    command: >-
      bin/venv-python -c "from scripts.checks.ci_guards.validate_persona_github_agnosticism import validate_persona_github_agnosticism as a;
      from scripts.checks.ci_guards.validate_persona_image_digest import validate_persona_image_digest as b;
      from scripts.checks.ci_guards.validate_ci_rca_taxonomy import validate_ci_rca_taxonomy as c;
      from scripts.checks.ci_guards.validate_dependabot_config import validate_dependabot_config as d;
      from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as e;
      f=[];[g(f) for g in (a,b,c,d,e)];print(*f,sep='\n');print(f'image checks: {len(f)} failures');assert not f"
      && bin/venv-python -m scripts.import_governance --check-contracts
    expected: The last line of the first command reports 0 failures and the import-linter run keeps the src.persona_hosts contract.
    expected_literals:
      - 'image checks: 0 failures'
    fix_if: A failure names the file to fix; never loosen a check.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: All five are registered checks that already run in every tier; a shard would duplicate them.
  - step: 5
    phase: pre-deploy
    action: >-
      The conformance suite in this cloud session: start dockerd as root, then build and run through run_image (the
      build helper passes the session proxy CA as a build secret and builds on the host network).
    command: >-
      (docker info >/dev/null 2>&1 || (sudo -n dockerd >/tmp/dockerd.log 2>&1 &)); timeout 30 sh -c 'until docker info >/dev/null 2>&1; do :; done';
      bin/venv-python -m pytest tests/persona_hosts/conformance_suite.py -q
    expected: >-
      Exit 0, every node passes; the stub's hit count is two for the complete input and zero for the incomplete one.
      Record the suite's wall time in the PR body (Decision 73 note: the step is an unbudgeted gate).
    fix_if: >-
      A build failure on a hash: regenerate the lock with the recorded command, never drop --require-hashes. A missing
      module at run time: add it to build.copy (the agnosticism check's closure rule should have caught it; fix that
      too). If dockerd cannot start in the session, record the step UNPROVEN in the PR body and rely on step 9.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The pr-validate conformance step (step 9) is the standing guard on every PR touching an image input.
  - step: 6
    phase: pre-deploy
    action: The ports registry flips and the check that reads them.
    command: >-
      bin/venv-python -c
      "from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as a;
      f=[];a(f);print(*f,sep='\n');print(f'ports checks: {len(f)} failures');assert not f"
      && bin/venv-python -m pytest tests/checks/contracts/test_validate_ports_contract.py -q
    expected: The ports check reports 0 failures (every new location and suite path exists) and the ports contract tests pass.
    expected_literals:
      - 'ports checks: 0 failures'
      - ' passed'
    fix_if: A missing path -- fix the location, never revert the flip; a cap breach -- the SA-01 relief in the ports.yaml scope row.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_ports_contract is a standing check in every tier.
  - step: 7
    phase: pre-deploy
    action: No artifact bundles the new packages and no deploy channel watches a changed path (Decision 249 clause 2).
    command: >-
      bin/venv-python -c "import subprocess;from scripts.convergence_health.code_drift import PROD_SOURCE_PATHSPECS as P,DUCKLAKE_SOURCE_PATHSPECS as D;from scripts.lambda_manifest import compute_affected_artifacts as ca;import fnmatch;run=lambda a:subprocess.run(a,capture_output=True,text=True,check=True).stdout.split();mb=subprocess.run(['git','merge-base','HEAD','origin/main'],capture_output=True,text=True,check=True).stdout.strip();ch=sorted(set(run(['git','diff','--name-only',mb]))|set(run(['git','ls-files','--others','--exclude-standard'])));hit=lambda f,g:f==g or f.startswith(g.rstrip('/')+'/') or fnmatch.fnmatch(f,g);hits=sorted({f for f in ch for g in P+D if hit(f,g)});aff=ca(ch);print('changed',len(ch),'hits',hits,'affected',aff);assert 'src/persona_hosts/local_container/adapter.py' in ch and 'docker/persona/Dockerfile' in ch;assert not hits and aff in ({},{'data-pipeline':['src/lambdas/data-pipeline/manifest.yaml']});print('NO_DEPLOY_TRIGGER_OK')"
    expected: >-
      Exit 0; the change list (tracked diff against the merge-base plus untracked files) holds the adapter and the
      Dockerfile, no changed path equals, sits under or glob-matches a PROD_SOURCE_PATHSPECS or DUCKLAKE_SOURCE_PATHSPECS
      entry, affected is empty or data-pipeline via its manifest only, and the last line is NO_DEPLOY_TRIGGER_OK.
    fix_if: >-
      An artifact is affected: a src/persona_hosts path is bundled somewhere; add the exclude, never deploy from this
      plan. A pathspec hit: the change touches a deployed source; STOP to this planning thread.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A one-change proof copied from PLAN-run-persona-litellm-backend's VP 5; the manifest exclude test in VP 1 is the
      standing guard that keeps src/persona_hosts out of the bundle.
  - step: 8
    phase: pre-deploy
    action: Pre-handoff full tier on the committed, rebased tree (Decision 163), read through its evidence file.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports the full tier passed on HEAD's tree.
    fix_if: Any failure; fix and re-run both from the start (timeout_disposition blocked).
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: >-
      After the build PR is pushed (so after VP 8's local full tier): on the PR head, pr-validate ran the conformance
      step and it passed (the PR touches image inputs, so the decision line reads run=true).
    command: >-
      bin/venv-python -c "import json,os,subprocess,urllib.request as u;sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip();
      g=lambda p:json.load(u.urlopen(u.Request('https://api.github.com/repos/otl-labs/ontheloop/'+p,headers={'Accept':'application/vnd.github+json'})));
      run=[r for r in g('actions/workflows/ci.yml/runs?event=pull_request&head_sha='+sha)['workflow_runs']][0];
      job=[j for j in g('actions/runs/%d/jobs'%run['id'])['jobs'] if j['name']=='pr-validate'][0];
      st={s['name']:s['conclusion'] for s in job['steps']};c=st.get('Persona image conformance (local_container suite)');print('conformance step:',c);assert c=='success'"
    expected: The last line reads that the conformance step concluded success.
    fix_if: Skipped means the decision script missed an input; failure means fix the image or adapter on the branch.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      It reads one PR's run; the step itself is the standing guard. The command is an unauthenticated read of public
      REST data; a session may read the same job steps with mcp__github__actions_get and actions_list instead.
