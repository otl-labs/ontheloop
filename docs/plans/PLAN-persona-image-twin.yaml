constraints:
  - >-
    No governing text changes: ports.yaml gets only the three registry flips, one amendment_log row and, if needed, the
    SA-01 format relief; ROADMAP-PLATFORM.yaml is not edited (c14 stays open). Any other wording need is a plan
    defect back to this planning thread (it would need an approved-text sidecar, Decision 246).
  - >-
    Nothing is pushed to any registry, no workflow file is added, and config/persona_image.yaml's digest and
    source_commit stay null; the publish channel, attestation, pin PRs and the deploy-paths row are
    PLAN-persona-image-channel's.
  - >-
    No key, account id, hostname or proxy value enters the image, a fixture, a log or the repository (Decision 101);
    the conformance suite's key is a fixed dummy string, and the session CA passes only as a build secret.
  - >-
    No code under src/persona_hosts/ imports scripts or src.persona_backends, names a registered persona id, or calls the
    GitHub API; the fixture persona lives under tests/ and enters only the test-only derived image.
  - Every new module stays under 500 SLOC (Decision 128).
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
context:
  - >-
    Decision 73/208 note: the conformance step is an unbudgeted gate outside validate --pre (timeout 15 min, wall time
    recorded at VP 5). Move it out of the required job by a plan amendment if its p90 passes 5 minutes or it runs on more
    than a fifth of PRs over a month (actions-capacity gauge, rec-5022).
  - >-
    Decision 254 note (accepted deferral): two PRs that each pass the suite can merge into a main tree that fails it,
    because required checks are not strict (terraform/github/repo.tf:116). The cover is PLAN-persona-image-channel's
    publish workflow, which re-runs the suite on the built image before any push, so a failing tree never publishes;
    until that build lands nothing consumes the image.
  - >-
    Split and design settled on a blind consult (two plans, this one first; contracts baked in; conformance as a
    conditional pr-validate step, never in the full tier; the publish workflow re-runs it before push; no skip).
  - >-
    Depends on PLAN-run-persona-litellm-backend's build (plan merged #2111, 95e0d5c2; entry point `scripts/run_persona.py
    --contract --input --events`, exit 2 on a refused contract; fixture tests/fixtures/persona_backends/fixture_persona.yaml
    with input change_id, head_sha, notes and capability read_input:notes). No sidecar: the plan changes no governing
    text, so Decision 246 does not bind it (wording-check round 1 failed because flips naming build-created paths cannot
    pass on main; SA-14 moved to plan 2).
  - >-
    Measured 2026-11-17 in a cloud session: dockerd starts as root; image pulls work; pip in a build needs the proxy CA
    as a build secret and --network host; 72 binary wheels with mcp (build measurement). litellm reads DEEPSEEK_API_BASE (deepseek transformation.py:350).
  - >-
    Required checks are pr-validate and terraform-validate only (terraform/github/repo.tf:102-116) and rec-4624 freezes
    the ruleset, so the suite gates inside pr-validate. .github/workflows/ci.yml is shared: no open PR touches it
    (checked 2026-11-17).
  - >-
    plan_obligations (2026-11-17): shared files with unbuilt plans, second builder rebases; notably
    PLAN-plans-only-main-fast-tier (ci.yml, composite baseline) and PLAN-persona-verdict-chain (_manifest.py, taxonomy,
    capabilities.yaml, roadmap). NEAR_CAP ci_rca_taxonomy.yaml 497 and ports.yaml 498 carry relief in their scope rows.
  - >-
    red_overlap (2026-11-17 13:25 UTC): blocked by rec-5247 (slo_breached; production telemetry-reader smoke 504), no
    shared path. Deferral: this plan touches no Lambda, reader or deploy workflow; the build's full tier (VP 8, Decision
    163) waits for the repair, and /implement re-runs red_overlap first.
  - >-
    Scout flags all adopted: r1 (suite path, reuse per adapter, dummy key out of the step env, base-URL variable by
    name), r2 (c14 stays open per Decision 136; rec-5274, rec-5275 per Decision 166; owning_item T4.2:c8), r4
    (Decision 153 ceiling re-derived, dec:153 cited); r5 NO_FLAGS. Critique rounds 1-4 fixes sit
    in the scope rows naming them; gate_rounds holds the counts. Decision 153's body still names the 30-minute timeout as
    the derivation's input on its date; its own rule (re-derive from the timeout) is what this plan follows, and the
    code comment carries the new arithmetic, so no Decision text changes. N10: closes_criteria stays empty (c1 and c14
