schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-image-twin
intent: >-
  Build the digest-pinnable persona container image and its local container twin (T4.32 c1 image legs; the gating leg of T4.2
  c14 and part of c13; audit WP-11 part 1), the first of the two plans the hint PLAN-persona-image-channel splits into (blind consult,
  settled). A Dockerfile under docker/persona/ builds python 3.12 from a digest-pinned base, installs a hash-locked
  requirements file with pip --require-hashes, copies the run_persona entrypoint, its import closure, the persona
  contracts with their rendered prompts and the two contract files the tier resolver reads, at their repository paths,
  and runs as a numeric non-root user. src/persona_hosts/ holds the pin loader for config/persona_image.yaml (image
  name, digest and source commit, both null until the publish plan pins them; the watched build inputs; a closed
  consumer list) and the local_container adapter of the persona_compute_host port: run_image runs one persona in a
  locked-down container and returns its result, exit code and events file. A credential-free conformance suite builds
  the image from the change under test and runs a fixture persona through run_image against a stub OpenAI-compatible
  server on an internal network. Two registered checks keep persona code GitHub-agnostic and keep the image name and
  digest in one file. The publish channel (GHCR, attestation, newest-green gate, pin PRs, deploy-paths row) is
  PLAN-persona-image-channel. Serves NS.3: verdicts run on GitHub from main's definition.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-persona-image-twin.yaml
phase: >-
  T4.32 c1 (image legs, part) and T4.2 c14's gating leg (c14 stays open: its github_actions_shell and fargate drift
  legs are unbuilt, T4.15:c12 owns the fargate one). T4.32 is in_progress. Builds after
  PLAN-run-persona-litellm-backend's build merges (the image packages its entrypoint and package). Nothing is
  published or deployed; no Lambda bundle holds the new paths (V2).
closes_criteria: []
cites: [dec:153, dec:205, dec:212, dec:234]
fallback_reevaluation:
  reevaluated_on: "2026-11-17"
  substrate_status: CD.27 pending; executor substrate unratified; T4.2 not built; the T4.15 spike has not run.
  verdict: continue_on_current_substrate
  basis: >-
    T4.2 c14's gating leg here is a container image, a local docker twin of the persona_compute_host port and a pr-validate step;
    the image is the host-portable unit every candidate layer-2 substrate would run (the fargate adapter stays pending
    under T4.15:c12), so it touches no CD.27, fallback_spec or T4.15 ruling (the PLAN-persona-trigger-policy disposition).
scope:
  - file: docker/persona/Dockerfile
    action: Create
    purpose: >-
      FROM python:3.12-slim@sha256:<the digest current at build time, read with docker buildx imagetools inspect>. ENV
      HOME=/tmp (uid 10001 has no passwd entry and the root filesystem is read-only at run time; no PYTHON* variables,
      which python -I ignores). COPY docker/persona/requirements-persona.txt, then one RUN with a
      BuildKit secret mount id=build_ca (required=false; when present PIP_CERT points at it) running pip install
      --no-cache-dir --require-hashes --no-deps --only-binary :all: -r, then removes the file. Then one COPY per
      config/persona_image.yaml build.copy entry, to /app/<same path>, dependency layer first so a prompt change
      reuses it. USER 10001:10001, WORKDIR /app, ENTRYPOINT ["python", "-I", "/app/scripts/run_persona.py"], LABEL
      org.opencontainers.image.source="https://github.com/otl-labs/ontheloop". No syntax directive (it would pull an
      unpinned frontend image), no ADD, no curl, no shell entrypoint.
  - file: docker/persona/Dockerfile.dockerignore
    action: Create
    purpose: >-
      BuildKit's per-Dockerfile ignore file: "*", then one "!<path>" per build.copy entry and
      "!docker/persona/requirements-persona.txt", then "**/__pycache__" and "**/*.pyc" (a session checkout holds
      bytecode, .venv and logs), so the context sends only the image's sources.
  - file: docker/persona/requirements-persona.in
    action: Create
    purpose: >-
      The image's direct third-party imports, measured at build time from the copied closure (litellm, jsonschema,
      pyyaml), plus mcp, a lazy import inside litellm when tools are passed (scope amendment 2026-11-17), pinned to the versions
      requirements-dev.txt holds on the build day (mcp==2.3.0 as requirements.txt pins it). The lock is the image's own
      from then on (no -c to the dev lock, so Dependabot can bump it; critique r1 B4): each bump PR touches an image
      input, so pr-validate runs the conformance suite on the real image with the bumped versions.
  - file: docker/persona/requirements-persona.txt
    action: Create
    purpose: >-
      pip-compile --generate-hashes --strip-extras --output-file=docker/persona/requirements-persona.txt
      docker/persona/requirements-persona.in under Python 3.12, pip-compile's autogenerated header kept verbatim
      (Dependabot re-runs the command it names). Every pin carries
      sha256 hashes; the build measured 72 binary wheels with mcp (58 without it on 2026-11-17).
  - file: config/persona_image.yaml
    action: Create
    purpose: >-
      The one image file (T4.32 c2): image: ghcr.io/otl-labs/ontheloop-persona; digest: null; source_commit: null
      (both null or both set; digest sha256:<64 hex>, source_commit 40 hex; no tag field); build.dockerfile
      docker/persona/Dockerfile; build.files: the build's own files (docker/persona/Dockerfile, its .dockerignore,
      docker/persona/requirements-persona.txt); build.copy: the COPY sources (scripts/__init__.py,
      scripts/run_persona.py, the scripts/llm modules in the entrypoint's closure, src/__init__.py if present,
      src/persona_backends/, docs/contracts/personas/, docs/contracts/inference-provider.yaml,
      docs/contracts/project-configuration.yaml), measured from the closure at build time; consumers: local_container
      {status: built, location: src/persona_hosts/local_container/} (build.py reads the pin), github_actions_shell {status: pending,
      owning_item: "T4.2:c8"}, fargate {status: pending, owning_item: "T4.15:c12"}. build.files plus build.copy are the
      image inputs every reader means. Header comment: written by the publish channel's pin PRs
      (PLAN-persona-image-channel) and read only through src/persona_hosts/image_pin.py.
  - file: src/persona_hosts/__init__.py
    action: Create
    purpose: Package facade re-exporting ImagePin, PinUnset and load_pin from image_pin.
  - file: src/persona_hosts/image_pin.py
    action: Create
    purpose: >-
      `load_pin(root: Path) -> ImagePin` (frozen dataclass: image, digest | None, source_commit | None, dockerfile,
      files tuple, copy tuple, consumers tuple; inputs() returns files plus copy); `ImagePin.reference() -> str` returns "<image>@<digest>" or raises PinUnset while the digest is
      null; any schema breach raises ValueError naming the field. Stdlib plus yaml; no network.
  - file: src/persona_hosts/local_container/__init__.py
    action: Create
    purpose: Facade (the adapter) re-exporting run_image, RunImageResult, build_image and BuildOptions.
  - file: src/persona_hosts/local_container/adapter.py
    action: Create
    purpose: >-
      `run_argv(image_ref, persona, in_dir, events_dir, *, key_variable, base_url_variable=None, network="bridge",
      docker="docker", entrypoint=None) -> list[str]` builds the argv below; entrypoint, when set (a list, for the
      suite's confinement legs), becomes --entrypoint <its first element> and its remaining elements follow the image
      ref in place of the persona arguments, because docker's --entrypoint takes one executable (test_adapter asserts
      the split) and is the only argv source run_image uses.
      `run_image(image_ref: str, persona: str, materialised_input: dict, *, key_variable: str | None,
      base_url_variable: str | None = None, network: str =
      "bridge", timeout_s: int = 3700, docker: str = "docker") -> RunImageResult(exit_code, result: dict | None,
      events: dict | None, stderr: str)`. image_ref must match <name>@sha256:<64 hex> or a local image id sha256:<64 hex>
      (a tag is refused); persona must match ^[a-z][a-z0-9_]*$ and maps to docs/contracts/personas/<persona>.yaml inside
      the image (no caller-supplied path). Writes input.json (mode 0644) to a fresh temp dir (mode 0755, since mkdtemp's
      0700 would shut out uid 10001) mounted read-only at /run/persona/in, and an empty temp dir chmod 0777 at
      /run/persona/events. argv: docker run --rm --read-only --tmpfs /tmp
      --cap-drop ALL --security-opt no-new-privileges --user 10001:10001 --network <network> plus the two mounts plus
      "-e <key_variable>" (name only; the value is inherited, never in argv) when key_variable is set, which must be one
      of the variable names the ports.run_persona.litellm.api_key rows of docs/contracts/project-configuration.yaml name;
      and "-e <base_url_variable>" (name only) when base_url_variable is set, which must be <PREFIX>_API_BASE where
      PREFIX is the upper-cased LiteLLM prefix (before "/") of a litellm_tier_models default_model in
      docs/contracts/inference-provider.yaml (DEEPSEEK_API_BASE today; a vendor variable litellm reads, used
      by the conformance suite to reach its stub; no repository setting, so no project-configuration row);
      then image_ref --contract ... --input ... --events .... Never mounts the workspace, .git, home or the Docker socket;
      never --privileged, host PID or an --env-file. Result is stdout parsed as one JSON object (None when not JSON);
      events is the events file parsed (None when absent). An unreachable daemon raises RuntimeError naming it.
  - file: src/persona_hosts/local_container/build.py
    action: Create
    purpose: >-
      `build_image(root: Path, options: BuildOptions | None = None) -> str` calls load_pin(root) (the built consumer
      rule depends on it) and runs docker build -f the pin's build.dockerfile with root as context and --iidfile, returning the image id (sha256:<64 hex>). BuildOptions
      (ca_bundle, http_proxy) default from the process's PIP_CERT or SSL_CERT_FILE and HTTPS_PROXY: a CA bundle passes
      as --secret id=build_ca, and a proxy on a loopback host adds --network host and --build-arg HTTPS_PROXY (a
      predefined proxy arg, kept out of image history); on a hosted runner neither is set and the build is plain.
  - file: tests/persona_hosts/__init__.py
    action: Create
    purpose: Package marker; empty.
  - file: tests/persona_hosts/test_image_pin.py
    action: Create
