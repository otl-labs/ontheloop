pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - PLAN-run-persona-litellm-backend built on main (scripts/run_persona.py and src/persona_backends/ exist)
  - All files in scope located and readable
execution_steps:
  - "Measure the entrypoint's static first-party import closure and its third-party imports on main; write build.files and build.copy into config/persona_image.yaml and requirements-persona.in from them, plus mcp (litellm's tools-path import; scope amendment); post: the two files exist."
  - "Compile requirements-persona.txt with hashes (the recorded command); write the Dockerfile and its .dockerignore with the base digest read at build time; post: the digest check's Dockerfile rules pass."
  - "Create src/persona_hosts/ (image_pin, local_container adapter and build) and their mirror tests; post: VP 1 green."
  - "Create the two checks, their manifest entries, taxonomy rows and tests; post: VP 2 and VP 4 green."
  - "Create scripts/ci/persona_image_changed.py, the two pr-validate steps, the baseline entries and the test; post: VP 3 green."
  - "Create the stub, the fixture image, the inputs and conformance_suite.py; run VP 5."
  - "Edit .importlinter, capabilities.yaml, the data-pipeline manifest and dependabot.yml; make the ports.yaml flips and amendment row; post: VP 6 green."
  - Execute VP 1-7 -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55)
  - >-
    CLOSURE, each outcome reported separately: readiness, graduation, the full tier's verdict, postflight evidence and
    the real push, PR and merge outcome (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence):
    bin/venv-python -m scripts.session.github_readiness; run /implement's Verification Graduation walk, which writes
    the registry shards for persona-image-twin-adapter, persona-image-twin-checks and persona-image-twin-ci-step; set
    implementation_declared: true in this plan; commit (feat(persona-image-twin): ...); git fetch origin main && git
    rebase origin/main; re-run VP 1-4, 6 and 7 if the rebase changed a scope file; VP 8 on that committed, rebased tree
    (full tier backgrounded from the top-level session with a 2 h limit, then --verify-head; a timeout is BLOCKED, no
    push); write /tmp/implementation-retrospective.json with the scripts.session.postflight_evidence.CATEGORIES keys and
    run bin/venv-python -m scripts.session.postflight --evidence /tmp/implementation-retrospective.json; push (git push
    -u origin HEAD as its own call); open the PR (body records VP 5's wall time or UNPROVEN) and report it as opened
    only with the returned PR number; subscribe; code review in a fresh context; VP 9 on the PR's pr-validate run;
    squash-merge on code review PROCEED and green CI. No roadmap edit (T4.2 c14 stays open).
  - "Report: what was implemented; readiness, graduation, --verify-head and postflight outcomes separately; whether VP 5 ran or is UNPROVEN and its wall time; the PR number, VP 9's run id and the merge SHA"
rollback: >-
  Revert the build commit: nothing publishes or consumes the image yet (digest and source_commit stay null), the
  pr-validate steps and the timeout return to their prior state with ci.yml, the ports.yaml flips and amendment row
  revert with it, and reverting the manifest exclude restores the data-pipeline bundle list unchanged (the package it
  excluded is reverted with it).
