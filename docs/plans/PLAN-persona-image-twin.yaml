      litellm_persona_selection.personas); then USER 10001:10001. Test-only: never published.
  - file: tests/persona_hosts/fixtures/input_complete.json
    action: Create
    purpose: >-
      A materialised input carrying every field the fixture contract's input_schema requires; head_sha is a
      low-entropy 40-hex value (a repeated pattern), so detect-secrets' entropy rule does not fire.
  - file: tests/persona_hosts/fixtures/input_incomplete.json
    action: Create
    purpose: The same input with head_sha removed.
  - file: scripts/checks/ci_guards/validate_persona_github_agnosticism.py
    action: Create
    purpose: >-
      Registered check (T4.2 c13 first half). Persona code = every .py file the pin's build.copy entries hold. Fails on: a gh
      command (a call whose argv list or string starts with "gh", or a string constant matching
      (^|[\s;&|`(])gh\s); an import of github, ghapi, githubkit, github3 or octokit, by import statement or
      importlib.import_module / __import__ with a literal; a string constant GITHUB_TOKEN or GH_TOKEN; a
      requirements-persona.txt pin of PyGithub, ghapi, githubkit or github3.py; and a first-party module in the static
      import closure of scripts/run_persona.py that build.copy does not hold. It declares
      registry.examined(<file count>, unit="persona_files") (Decision 170, validate_check_accounting). Docstrings are not scanned for the gh
      pattern.
  - file: scripts/checks/ci_guards/validate_persona_image_digest.py
    action: Create
    purpose: >-
      Registered check (T4.2 c13 second half, T4.32 c2's one file). Fails when: the pin breaches its schema
      (load_pin); a tracked file outside config/persona_image.yaml and docs/plans/** holds an image reference, the pin's
      image name followed by ":" or "@" (plans describe the image and are not consumers; critique r1 B3); a consumer
      with status built names a location that does not exist or under which no .py file calls load_pin, or a pending consumer's
      owning_item is not an open roadmap criterion; or the Dockerfile's FROM is not pinned by digest, its COPY sources
      differ from build.copy plus the lock, or its .dockerignore allow-list differs from build.copy plus the lock; or
      .github/dependabot.yml lacks a pip and a docker update for the Dockerfile's directory. Its reference scan runs as
      one git grep for the pin's name. A failure names the
      fix (for a COPY or allow-list drift, the build.copy line to add). It declares registry.examined(<rule count>,
      unit="image_pin_rules") (Decision 170, validate_check_accounting). It never compares the image lock with
      requirements-dev.txt: the lock is the image's own and the conformance suite tests each bump.
