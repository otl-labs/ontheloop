schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-registry-key-check
intent: >-
  Let a docs/contracts/executor-personas.yaml personas row carry a checked registry_key, the persona's
  config/agent/data_quality/source_registry.yaml canonical_id, before any row carries one. PersonaRow accepts an
  optional registry_key and validate_persona_contracts checks every key a row carries: registered, unique across rows,
  and equal to the persona contract's skill_tether.skill. Code only, no contract text. It goes first so
  PLAN-persona-run-identity-contract (rec-4433 plan 1, planned next) can bind the rows' keys and their definition in its
  approved-text sidecar without binding a scripts/ module, whose import closure would cap the wording check's test
  selection; that plan's build then makes the key required.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-registry-key-check.yaml
phase: >-
  Parent rec-4433 (open, not resolved here), precursor of its plan 1 (CAPTURE FROM DAY ONE: T4.28 c3, T4.29 c2 and T4.30 c2). V2: Python
  checks and their tests only; nothing here is Lambda-packaged, deployed or read by a producer.
scope:
  - file: scripts/persona_contracts/schema.py
    action: Modify
    purpose: >-
      PersonaRow gains registry_key: str | None = None (the model stays extra-forbid). Nothing else changes.
  - file: scripts/checks/contracts/validate_persona_contracts.py
    action: Modify
    purpose: >-
      New _registry_key_failures(index, root), called from validate_persona_contracts after the vocabulary check. When
      no row carries a registry_key it reads nothing and returns no failure. Otherwise it reads
      config/agent/data_quality/source_registry.yaml through the module's existing _load_raw, so every unreadable
      shape takes one code path (the canonical_id of every entry); one condition, a file that is
      missing or does not parse, has no entries list, or has an entry that is not a mapping with a string canonical_id,
      gives one failure "Persona contracts: config/agent/data_quality/source_registry.yaml is unreadable" (never a
      crash); and it fails a
      key that is not a registered canonical_id ("Persona contracts: <persona>: registry_key '<key>' is not a registered
      canonical_id") or that two rows carry ("Persona contracts: registry_key '<key>' is not unique"). In
      _contract_failures, once the contract parses, a row whose registry_key is set and whose contract carries a
      skill_tether fails when they differ ("Persona contracts: <persona>: registry_key '<key>' differs from
      skill_tether.skill '<skill>'"). The module docstring names the rule. No other failure text changes.
  - file: tests/persona_contracts/fixture_tree.py
    action: Modify
    purpose: >-
      REGISTRY_REL = "config/agent/data_quality/source_registry.yaml" joins _COPIED; build_tree appends one entry,
      canonical_id fixture-verdict, to the copy, and the fixture personas row carries registry_key fixture-verdict (its
      skill_tether.skill) on a line after its implementation line (tests/checks/contracts/test_validate_persona_contracts.py
      test_compute_plane_contract_needs_no_skill_tether edits the row's "kind: verdict" and "contract:" lines as one
      literal). Five mutators and their EXPECTED substrings: registry_key_unregistered ("is not a registered
      canonical_id"), registry_key_tether_mismatch (key set to code-review: "differs from skill_tether.skill"),
      registry_key_duplicate (a second personas row with the same key: "is not unique"), registry_unreadable (the
      copied registry replaced by a mapping with no entries list) and registry_entry_not_mapping (entries: [x], an
      entry that is not a mapping), both "source_registry.yaml is unreadable" (the missing-file and unparseable shapes
      take the same _load_raw path as the no-entries one). Every existing mutator and expectation is unchanged.
  - file: tests/persona_contracts/test_schema.py
    action: Modify
    purpose: >-
      Two tests, PersonaRow imported from scripts.persona_contracts.schema (as fixture_tree.py does; the
      scripts/persona_contracts/__init__.py facade is not edited): test_persona_row_registry_key_is_a_string (durable: a
      string key validates, a non-string key is refused) and test_persona_row_registry_key_may_be_absent (transitional: a
      row without registry_key validates with None, until PLAN-persona-run-identity-contract makes the key required).
  - file: tests/checks/contracts/test_validate_persona_contracts.py
    action: Modify
    purpose: >-
      test_registry_is_not_read_when_no_row_carries_a_key: on a fixture tree whose row has no registry_key and whose
      registry copy is deleted, validate_persona_contracts reports no failure at all (the module's _run(tree) == []).
      Transitional like test_persona_row_registry_key_may_be_absent: both are waived moment claims (VP 3), never
      graduated, because PLAN-persona-run-identity-contract retires the keyless row. Its red-before is structural only
      (the node is absent): at step 2 it errors at setup with every fixture-tree test (the keyed fixture row is refused
      until PersonaRow has the field), and it is green from step 3 on. The
      existing test_red_rule covers the five new mutators through MUTATORS and EXPECTED, and the existing
      test_compute_plane_contract_needs_no_skill_tether becomes the guard for a key with no skill_tether (no tether
      comparison) once the fixture row carries a key.
bundled_recommendations: []
followon_recs: []
acceptance_criteria:
  - >-
    A personas row may carry a string registry_key; validate_persona_contracts refuses an unregistered, duplicated or
    tether-mismatched key and an unreadable registry (VP 2), and reads nothing when no row carries a key (VP 3).
  - >-
    The real tree stays green with no key on any row, and executor-personas.yaml, the persona contracts, their rendered
    prompts and hashes are unchanged (VP 4).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: this plan is on main, the verdict persona rows are present, and the branch is current."
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-persona-registry-key-check.yaml &&
      git show origin/main:docs/contracts/executor-personas.yaml | grep -q "persona: plan_critic" && git merge-base
      --is-ancestor origin/main HEAD && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: A missing plan means this plan's PR has not merged; missing persona rows mean main is older than d312cba0; a failed ancestry test means a stale branch -- merge origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The durable new nodes -- the string-typed field and the registry_key rules (five mutators).
    command: >-
      bin/venv-python -m pytest -q tests/persona_contracts/test_schema.py::test_persona_row_registry_key_is_a_string
      "tests/checks/contracts/test_validate_persona_contracts.py::test_red_rule[registry_key_unregistered]"
      "tests/checks/contracts/test_validate_persona_contracts.py::test_red_rule[registry_key_tether_mismatch]"
      "tests/checks/contracts/test_validate_persona_contracts.py::test_red_rule[registry_key_duplicate]"
      "tests/checks/contracts/test_validate_persona_contracts.py::test_red_rule[registry_unreadable]"
      "tests/checks/contracts/test_validate_persona_contracts.py::test_red_rule[registry_entry_not_mapping]"
    expected: >-
      Exit 0 with 6 passed. Red before: the node ids do not exist on the un-implemented tree (pytest exit 4, not found).
      Every node stays true once PLAN-persona-run-identity-contract makes the key required.
    fix_if: Fix validate_persona_contracts.py or schema.py; never loosen an expectation.
    hermetic: true
    expected_literals:
      - 6 passed
    graduation: graduate
    graduation_check_id: persona-registry-key-check
  - step: 3
    phase: pre-deploy
    action: The transitional nodes -- a keyless row validates and the registry is not read when no row carries a key.
    command: >-
      bin/venv-python -m pytest -q tests/persona_contracts/test_schema.py::test_persona_row_registry_key_may_be_absent
      tests/checks/contracts/test_validate_persona_contracts.py::test_registry_is_not_read_when_no_row_carries_a_key
    expected: "Exit 0 with 2 passed. Red before: the node ids do not exist (pytest exit 4)."
    fix_if: Fix the no-key path in validate_persona_contracts.py or the field default in schema.py.
    hermetic: true
    expected_literals:
      - 2 passed
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim: PLAN-persona-run-identity-contract makes registry_key required, retiring the keyless row and the
      no-key path, so these nodes are one-time evidence, not a standing guard (Decision 244 cl.4).
  - step: 4
    phase: pre-deploy
    action: >-
      Regression: the whole persona suites on the fixture tree and every mutator, then the registered persona checks on
      the real tree (no row carries a key), and nothing under docs/contracts or config/agent/data_quality changed.
    command: >-
      bin/venv-python -m pytest -q tests/checks/contracts/test_validate_persona_contracts.py
      tests/checks/contracts/test_validate_persona_contract_binding.py tests/persona_contracts && bin/venv-python -c
      "from scripts.checks.contracts.validate_persona_contracts import validate_persona_contracts as a; from
      scripts.checks.contracts.validate_persona_contract_binding import validate_persona_contract_binding as b; f=[];
      a(f); b(f); print('PERSONA_FAILS', len(f)); assert not f, f" && git diff --quiet origin/main -- docs/contracts
      config/agent/data_quality && echo CONTRACTS_UNCHANGED
    expected: The suites exit 0, then PERSONA_FAILS 0, then CONTRACTS_UNCHANGED.
    fix_if: A real-tree failure means the rule fires without a key -- fix the no-key path; a contract diff is out of scope -- revert it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A regression replay of existing suites and registered checks, green before by construction, so not a red-before
      guard; the git diff is a one-time scope check.
  - step: 5
    phase: pre-deploy
    action: SLOC budgets hold with no raise.
    command: >-
      bin/venv-python -c "from scripts.checks.sloc.sloc_limits import validate_sloc_limits as c; f=[]; c(f);
      print('SLOC_FAILS', len(f)); assert not f, f"
    expected: SLOC_FAILS 0.
    fix_if: Decompose an oversized file (Decision 128), never raise.
    hermetic: true
    expected_literals:
      - SLOC_FAILS 0
    graduation: waive
    graduation_waiver_reason: Duplicates the registered validate_sloc_limits.
  - step: 6
    phase: pre-deploy
    action: Red-main overlap verdict for the touched files (Decision 226).
    command: bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-persona-registry-key-check.yaml
    expected: No open ci_rca rec overlaps the scope.
    fix_if: An overlap -- STOP and tell the coordinator before building.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Fast tier, then the full tier before handoff (handoff_policy), the full tier started in the background from the top-level session.
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The fast tier exits 0 and the verify-head read reports a completed full run for HEAD with exit 0.
    fix_if: In-scope failures are fixed on the branch; out-of-scope failures become recs (Decisions 59, 55). A timeout is blocked, never a warning.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/persona_contracts/schema.py
    behavior: PersonaRow accepts a string registry_key and refuses a non-string one.
    verification_step: 2
    test_selector: tests/persona_contracts/test_schema.py::test_persona_row_registry_key_is_a_string
    red_green_expectation: red before (the node does not exist; a row with registry_key is refused as an extra key), green after.
  - source: scripts/checks/contracts/validate_persona_contracts.py
    behavior: An unregistered registry_key is refused.
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py::test_red_rule[registry_key_unregistered]
    red_green_expectation: red before (the node does not exist; with the field and no rule, the keyed tree builds and the rule finds no failure), green after.
  - source: scripts/checks/contracts/validate_persona_contracts.py
    behavior: A registry_key that differs from skill_tether.skill is refused.
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py::test_red_rule[registry_key_tether_mismatch]
    red_green_expectation: red before (the node does not exist; with the field and no rule, the keyed tree builds and the rule finds no failure), green after.
  - source: scripts/checks/contracts/validate_persona_contracts.py
    behavior: A registry_key two rows carry is refused.
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py::test_red_rule[registry_key_duplicate]
    red_green_expectation: red before (the node does not exist; with the field and no rule, the keyed tree builds and the rule finds no failure), green after.
  - source: scripts/checks/contracts/validate_persona_contracts.py
    behavior: An unreadable registry is one failure, never a crash.
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py::test_red_rule[registry_unreadable]
    red_green_expectation: red before (the node does not exist; with the field and no rule, the keyed tree builds and the rule finds no failure), green after.
  - source: scripts/checks/contracts/validate_persona_contracts.py
    behavior: A registry entry that is not a mapping is the same one unreadable failure, never a TypeError.
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py::test_red_rule[registry_entry_not_mapping]
    red_green_expectation: red before (the node does not exist; with the field and no rule, the keyed tree builds and the rule finds no failure), green after.
  - source: scripts/checks/contracts/validate_persona_contracts.py
    behavior: No row carries a key, so the registry is not read (transitional, VP 3).
    verification_step: 3
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py::test_registry_is_not_read_when_no_row_carries_a_key
    red_green_expectation: red-before is structural only, the node being absent; it errors at setup at step 2 with every fixture-tree test (keyed row refused), green from step 3 on.
  - source: tests/persona_contracts/fixture_tree.py
    behavior: The fixture tree carries the copied registry, a registered fixture key and the five registry_key mutators.
    verification_step: 4
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py::test_fixture_tree_green
    waiver_reason: Test helper; its red-before is the validator change it exercises, guarded by test_red_rule.
  - source: tests/persona_contracts/test_schema.py
    behavior: The string-typed and the may-be-absent field tests themselves.
    verification_step: 2
    test_selector: tests/persona_contracts/test_schema.py::test_persona_row_registry_key_is_a_string
    waiver_reason: The test module is its own evidence; its red-before is the extra-key refusal it asserts against.
  - source: tests/checks/contracts/test_validate_persona_contracts.py
    behavior: The no-key, no-read test module edit itself (transitional, VP 3).
    verification_step: 3
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py::test_registry_is_not_read_when_no_row_carries_a_key
    waiver_reason: The test module is its own evidence; a moment claim pinning the no-key path that keeps the real tree green until plan 1.
