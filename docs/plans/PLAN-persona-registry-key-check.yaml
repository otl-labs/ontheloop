    prompt, hash, registry entry or personas row changes; no row carries a registry_key after this plan.
  - The field stays optional here; PLAN-persona-run-identity-contract's build makes it required once every row carries one.
  - >-
    No docs/contracts/ports.yaml edit here (no contract text): SA-11's layout list gains
    config/agent/data_quality/source_registry.yaml (the registry this check reads) in PLAN-persona-run-identity-contract's
    sidecar, as Decision 212 asks of a new repo-structure assumption.
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
  - "Public repository (Decision 101): no ARN, account id, Function URL or hostname in any test value or PR text."
