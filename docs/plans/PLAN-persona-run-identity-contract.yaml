  and the next deploy ships a production writer whose MERGE names a column production lacks; dropping the field too
  leaves the smoke catalog with a column the owner step's drift check refuses. So the hold lasts until the operator's
  provision_telemetry_catalog add (idempotent, nullable; the way forward). Keep the plan-critique and decision-scout
  registry entries: removing a canonical_id fails validate_ops_rule_source's ratchet (Decision 70), and an unused
  source is harmless. Only the personas rows' registry_key with the schema.py flip (together, with the tests that
  assert them) and the agent_type and parity prose may be reverted; reverting the rows' keys retires the graduated
  persona-run-identity-contract node, which needs Decision 235 cl.1 approval (Decision 244 cl.5). After the admin
