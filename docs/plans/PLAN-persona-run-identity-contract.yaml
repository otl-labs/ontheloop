schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-run-identity-contract
intent: >-
  Let telemetry say which persona an agent run was and which definition it loaded, so the verdict personas' add steps
  capture from day one (T4.28 c3, T4.29 c2, T4.30 c2), rec-4434's per-finding rows have a key, and the offline eval lane (Decision 231)
  can tell a changed definition (NS.6). On a persona run telemetry_agents.agent_type carries that persona's registry key
  (code-review, plan-critique, decision-scout), mapped once by a checked registry_key field on each
  executor-personas.yaml row so the Decision 231 persona ids keep their spelling; a new nullable definition_sha256 column
  holds the hash of the definition text the run was given. Plan 1 of 2 for rec-4433, after its code-only precursor
  PLAN-persona-registry-key-check (the optional field and its check): the contract, the registry, the map, the key made
  required, and the production column add with the existing deploy hold; the claude_code producer (parser_version 10)
  is plan 2, PLAN-persona-run-identity-producer.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-run-identity-contract.yaml
phase: >-
  rec-4433 (open), the CAPTURE FROM DAY ONE prerequisite of T4.28 c3, T4.29 c2 and T4.30 c2; complies with T3.22
  c3's write-enforcement rule (a constraint, not a target: a new write-enforced rule with its conformance coverage; it
  closes no criterion). V3:
  config/lambda/ducklake/field_semantics.yaml changes, so the governed deploy ships the DuckLake functions (active artifacts, Decision 79), and the production telemetry functions are
  held by the existing telemetry_catalog hold until the operator-directed production column add.
scope:
  - file: docs/contracts/telemetry_agents.yaml
    action: Modify
    purpose: >-
      Sidecar blocks t01-t09, word for word: agent_type's PERSONA RUN note and its semantic_break amendment; agent_name
      re-described as the raw spawn label; the new definition_sha256 field (nullable, pattern ^[0-9a-f]{64}$, unproduced
      under rec-4433) placed before host_run_ref; realization.unproduced gains rec-4433; the persona-aware agent_type
      text in both run_shapes; the PERSONA RUN governance paragraph with the rec-5071 residual; the contract-level
      amendment_log entry; t09 rewrites the five multi-line contract-level amendment_log entries one per line with
      identical parsed values (the contracts class relief valve: 475 effective lines on main, 517 with t01-t08, about 466
      with t09, under the 500 limit; no raise). contract_version stays 2 (field-level changes are logged per field).
  - file: docs/contracts/telemetry_observations.yaml
    action: Modify
    purpose: >-
      Sidecar blocks o01-o02, word for word: persona_backend's outcome-parity sentence groups by
      (telemetry_agents.agent_type, persona_backend) over persona runs, with NULL persona_backend as the in-session lane;
      metadata drops prompt_hash from the STEP and MODEL_CALL key lists; one amendment_log entry on each field.
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      Sidecar blocks e01-e03, word for word: an amendment_log entry (field_add), personas_row gains registry_key, and the
      three verdict rows carry registry_key code-review, decision-scout and plan-critique. contract_version stays 1; no
      persona contract, rendered prompt or hash changes.
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      Sidecar blocks r01-r03, word for word: the code-review entry names its persona role, claude-code-subagent is
      narrowed to non-persona sub-agent runs, and two entries are added, plan-critique and decision-scout, so both are
      registered before first use (Decision 66).
  - file: scripts/persona_contracts/schema.py
    action: Modify
    purpose: >-
      PersonaRow.registry_key becomes required: str | None = None (from PLAN-persona-registry-key-check) -> str. Not
      sidecar-bound (code). Nothing else changes.
  - file: scripts/checks/contracts/validate_persona_contracts.py
    action: Modify
    purpose: >-
      Follows the flip, with no rule change: the module docstring (lines 4-6) says registry_key is required and the
      registry is read whenever the index has a row, and the two registry_key is not None guards
      (_registry_key_failures and the skill_tether comparison), dead once the field is required, are removed. The early
      return for an index with no rows stays, so such an index still reads no registry. Not sidecar-bound (code).
  - file: tests/persona_contracts/test_schema.py
    action: Modify
    purpose: >-
      The precursor's transitional test_persona_row_registry_key_may_be_absent (a waived moment claim, Decision 244 cl.4)
      becomes test_persona_row_requires_registry_key: PersonaRow refuses a row without registry_key.
      test_persona_row_registry_key_is_a_string is unchanged.
  - file: tests/checks/contracts/test_validate_persona_contracts.py
    action: Modify
    purpose: >-
      The precursor's transitional test_registry_is_not_read_when_no_row_carries_a_key (waived, never graduated) becomes
      test_row_without_registry_key_is_refused: a fixture tree whose row has no registry_key fails
      validate_persona_contracts with "is unreadable or off its schema", since the key is now required. The graduated
      record persona-registry-key-check (test_red_rule[registry_key_unregistered]) is unchanged.
  - file: tests/checks/contracts/test_telemetry_top_level_agent_run.py
    action: Modify
    purpose: >-
      Sidecar block v01, word for word: test_host_run_ref_production_add_is_reconciled_in_the_sidecar asserts host_run_ref
      is not pending instead of nothing pending, since definition_sha256 is now pending in the same list (a loosened
      assertion, so it is sidecar-bound for the operator's approval). Its reconciled-evidence assertions are unchanged.
      The graduated shard telemetry-top-level-run-shape is kept: its node (test_top_level_run_shape_is_declared_and_write_enforced) is untouched.
  - file: tests/checks/contracts/test_persona_run_identity_contract.py
    action: Create
    purpose: >-
      Plan 1's acceptance (mirrors tests/checks/contracts/test_telemetry_top_level_agent_run.py's helpers). Nodes:
      test_definition_sha256_is_declared_and_write_enforced (declared nullable with the 64-hex pattern, projected in
      field_semantics.yaml, check_row accepts a 64-hex value and None and refuses an upper-case, 63-character and
      sha256:-prefixed value); test_persona_registry_keys_are_registered_and_tethered (every executor-personas.yaml row's
      registry_key is a source_registry canonical_id, the keys are unique, each verdict row's key equals its contract's
      skill_tether.skill, the projected telemetry_agents.agent_type accepted_values contain code-review, plan-critique
      and decision-scout, and the projected ops_recommendations.source accepted_values contain plan-critique and
      decision-scout); test_persona_key_contract_text (agent_type's notes and both run_shapes name registry_key, the
      persona_backend semantics groups by (telemetry_agents.agent_type, persona_backend), no telemetry contract says
      "telemetry_agents.agent_name, persona_backend", and metadata's semantics no longer names prompt_hash; the
      PERSONA RUN residual text, which rec-5071 will change, is bound by the sidecar (VP 2) and asserted by no graduated
      node); test_definition_sha256_is_pending_or_reconciled (a rule that holds across the
      bookkeeping PR: definition_sha256 is in exactly one of telemetry_agents pending_reconcile.history and
      reconciled.history; while pending, the --telemetry-hold predicate names telemetry_agents.definition_sha256; once
      reconciled, its evidence names telemetry_agents.definition_sha256 as added). The module names each contract path
      as a string literal so the fast tier's affected-test selection picks it up.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Sidecar blocks p01-p02, word for word: SA-11's layout list names config/agent/data_quality/source_registry.yaml as
      the registry each personas row's registry_key names (read by validate_persona_contracts since the precursor;
      Decision 212) and the compute-plane step maps keyed by the "## Step <id>:" headings of .claude/commands/plan.md
      and implement.md (PLAN-persona-contracts-compute-plane's coupling, forwarded here because p01 rewrites SA-11), and
      one amendment_log entry. Size relief, outside the blocks: ports.yaml is 497 of 500 effective lines on main
      (contracts class) and PLAN-arrival-lost-window-author-date (#1971, unbuilt) adds 2, so the build also re-wraps two
      folded prose fields at 120 columns, contract.description (5 to 4 lines) and semantics.verbs_status (8 to 7). The
      re-wrap keeps every word and both parsed values (approved_text verify compares words, and VP 6 compares the
      values), so ports.yaml measures 497 after the build, and 499 in either order with the arrival plan. Over 500
      effective lines at build (VP 8) is a STOP to the planning thread.
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: >-
      Sidecar blocks g01-g03, which are the generator's output for the placed contracts: regenerate with
      bin/venv-python -m scripts.schema_to_field_semantics (never hand-edit), and VP 2 and VP 6 prove the two agree.
      telemetry_agents gains definition_sha256 (nullable, pattern); the agent_type and ops_recommendations.source
      accepted_values gain plan-critique and decision-scout.
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      Sidecar block c01, word for word: telemetry_agents pending_reconcile.history becomes [definition_sha256]
      (reconcile_scope telemetry_catalog), so the merge-time reconcile-pending gate passes and the governed deploy holds the
      production telemetry writer and reader. No other entry changes.
bundled_recommendations: []
followon_recs:
  - rec-5071
  - rec-5072
infrastructure_dependencies:
  - >-
    No Terraform, IAM or spend. One admin step after merge, named here so it needs only Benjamin's word naming it: the
    production column add, re-running provision_telemetry_catalog under PlatformAdmin, human-directed (Decision 230 cl.4,
    docs/contracts/deploy-paths.yaml production_catalog_provisioning row provision_telemetry_catalog). It adds
    definition_sha256 through the owner-login additive leg (Decision 222 cl.1: nullable, no not_null or required_when)
    and is idempotent.
  - >-
    Deploy, first run (the governed deploy of the newest full-tier-green main commit at or after the merge, Decision
    249): deploy-maintenance ships the maintenance functions with the new projection; maintenance-smoke adds the column on
    the smoke catalog; the twin and serving legs deploy and gate as usual; deploy-telemetry holds (pending
    definition_sha256), so the production writer and reader keep their current code and telemetry-smoke skips. The
    ducklake_code_drift sensor files one High rec for the held functions while the hold lasts and closes it after the
    second deploy.
  - >-
    Second run (bookkeeping PR merge, after the admin step): definition_sha256 moves from pending_reconcile to reconciled
    with the provision response as evidence, the hold clears, deploy-telemetry ships the production writer (whose
    agent_type accepted_values now hold the two new keys) and reader, and telemetry-smoke proves live == declared
    (TELEMETRY_PROVISION_OK).
  - >-
    Cross-project hold: while definition_sha256 is pending, every production telemetry writer or reader deploy is held,
    including Feedback Loop's telemetry work. The coordinator books the admin step for the day this plan's build merges
    and merges no other production telemetry writer or reader change in that window (concurrent-applies rule).
  - >-
    Lambda gating disposition: compute_affected_artifacts over this scope flags the DuckLake functions through
    config/lambda/ducklake/; executor-personas.yaml, source_registry.yaml, the persona checks and the tests are not
    Lambda-packaged (config/agent/ is never bundled, Decision 79), which is why the new registry keys reach the writer
    only through the regenerated field_semantics.yaml (Decision 210 cl.4).
acceptance_criteria:
  - >-
    The eight bound files' edits equal main plus the approved sidecar's 24 blocks, word for word (approved_text verify
    exits 0 at the approved digest) (VP 2).
  - >-
    telemetry_agents declares definition_sha256 nullable with the 64-hex pattern, write-enforced, unproduced under
    rec-4433; agent_type's notes and both run_shapes name the persona's registry_key; the parity read groups by
    (agent_type, persona_backend); metadata no longer names prompt_hash (VP 2 binds the owner text, VP 3, VP 6).
  - >-
    Every executor-personas.yaml row carries a registry_key that is a registered canonical_id, unique, and equal to the
    verdict persona's skill_tether.skill, and PersonaRow refuses a row without one (VP 3, VP 4).
  - >-
    plan-critique and decision-scout are registered, and the projected agent_type accepted_values include them (VP 3, VP
    6).
  - >-
    The production telemetry writer and reader are held while definition_sha256 is pending; after the operator's
    provision_telemetry_catalog re-run lists telemetry_agents.definition_sha256 as added and the bookkeeping PR clears the
    hold, they deploy and the light gate passes (VP 7, VP 11-14).
  - >-
    No claude_code output changes: PARSER_VERSION stays 9 and the golden digest is unchanged (VP 5).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: this plan and its sidecar are on main, the precursor is built, and the branch is current."
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-persona-run-identity-contract.yaml &&
      git cat-file -e origin/main:docs/plans/approved/persona-run-identity-contract.yaml && git show
      origin/main:scripts/persona_contracts/schema.py | grep -q "registry_key: str | None = None" && git merge-base
      --is-ancestor origin/main HEAD && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      A missing plan or sidecar means this plan's PR has not merged; no optional registry_key means
      PLAN-persona-registry-key-check is not built: stop either way. A failed ancestry test means a stale branch: merge
      origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The bound files are exactly main plus the approved sidecar, at its approved digest.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-run-identity-contract --base origin/main
      --expect e6f8ace482cf79eabb91961087d04fd02393b772e504a398155fbd0cec5c3c93
    expected: >-
      Exit 0, printing APPROVED-TEXT OK (the expected value is the sidecar's digest= line from approved_text record and
      the wording-check gate row, not its approved= line). Red before the sidecar blocks are placed.
    fix_if: >-
      A word mismatch means a placed block drifted: restore its after text exactly, never edit the sidecar. A digest
      mismatch means the sidecar on main is not the approved one: stop and ask the operator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A base-relative, one-time binding of this build's diff to its sidecar; validate_merge_step enforces the same
      binding on the build PR's fast tier.
  - step: 3
    phase: pre-deploy
    action: >-
      Plan 1's acceptance -- the persona key and definition hash are declared, mapped, registered and write-enforced,
      and a personas row without registry_key is refused.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_persona_run_identity_contract.py
      tests/persona_contracts/test_schema.py::test_persona_row_requires_registry_key
      tests/checks/contracts/test_validate_persona_contracts.py::test_row_without_registry_key_is_refused -q
    expected: >-
      Exit 0. Before the change the acceptance file and the two required-key nodes do not exist, and a row without
      registry_key validates.
    fix_if: Fix the placed contract, the regenerated projection, the sidecar entry or the check; never the test's intent.
    hermetic: true
    expected_literals:
      - passed
    graduation: graduate
    graduation_check_id: persona-run-identity-contract
  - step: 4
    phase: pre-deploy
    action: The persona checks on the real tree (every row now carries its key) and on every mutator, with the key required.
    command: >-
      bin/venv-python -m pytest -q tests/checks/contracts/test_validate_persona_contracts.py
      tests/checks/contracts/test_validate_persona_contract_binding.py tests/persona_contracts
    expected: >-
      Exit 0. Red before the flip: test_persona_row_requires_registry_key fails, since a row without registry_key still
      validates.
    fix_if: Fix schema.py, or a placed block that drifted; never loosen an existing expectation.
    hermetic: true
    expected_literals:
      - passed
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file selections of files this plan modifies, always in the affected-test selection; VP 3 graduates the new
      acceptance and the two required-key nodes.
  - step: 5
    phase: pre-deploy
    action: No producer output changes -- parser version, golden digest and the real-DuckDB golden append are unchanged under the new rule.
    command: >-
      bin/venv-python -m pytest tests/telemetry/test_parser_version_registry.py tests/telemetry/test_append_ducklake_integration.py
      tests/telemetry/test_golden_normalisation_source.py -q && bin/venv-python -c "from src.turn_capture.record_turn import
      PARSER_VERSION as v; print('PARSER_VERSION', v); assert v == 9"
    expected: Exit 0, then PARSER_VERSION 9.
    fix_if: A golden row refused by the new rule means the contract is wrong for stored data -- fix the contract through the plan-defect route, never the golden.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The parser-version and golden-append suites are already registered; the version print is a one-time no-bump check.
  - step: 6
    phase: pre-deploy
    action: >-
      Projection current and the registered contract checks green (drift, write-time conformance, realization, reconcile
      gate, source registry), plus the projection, conformance and run-shape suites.
    command: >-
      bin/venv-python -m scripts.schema_to_field_semantics --check && bin/venv-python -c "from
      scripts.checks.contracts.validate_contract_drift import validate_contract_drift as a; from
      scripts.checks.contracts.validate_write_time_enforcement_conformance import validate_write_time_enforcement_conformance as
      b; from scripts.checks.contracts.validate_telemetry_field_realization import validate_telemetry_field_realization as c;
      from scripts.checks.ops_governance.validate_reconcile_pending_gate import validate_reconcile_pending_gate as e; from
      scripts.checks.ops_governance.check_source_registry import check_source_registry as g; f=[]; [x(f) for x in
      (a,b,c,e,g)]; print('CONTRACT_FAILS', len(f)); assert not f, f" && bin/venv-python -m pytest -q
      tests/test_field_semantics_event_projection.py tests/checks/contracts/test_write_time_enforcement_conformance.py
      tests/checks/contracts/test_telemetry_top_level_agent_run.py tests/checks/contracts/test_validate_telemetry_field_realization.py
      tests/telemetry/test_contract_amendments.py tests/row_rules && bin/venv-python -c "import subprocess as s,yaml;
      m=lambda p:yaml.safe_load(s.run(['git','show','origin/main:'+p],capture_output=True,text=True,check=True).stdout);
      h=lambda p:yaml.safe_load(open(p));ta='docs/contracts/telemetry_agents.yaml';po='docs/contracts/ports.yaml';
      assert h(ta)['amendment_log'][1:]==m(ta)['amendment_log'],'t09 changed a parsed log entry';o,n=m(po),h(po);
      assert all(n[a][b]==o[a][b] for a,b in (('contract','description'),('semantics','verbs_status'))),'re-wrap changed a value';
      print('PARSED_EQUAL_OK')"
    expected: The generator check passes, CONTRACT_FAILS 0, the suites exit 0, then PARSED_EQUAL_OK.
    fix_if: >-
      Regenerate the projection, or fix the named contract, sidecar entry or realization block. A PARSED_EQUAL failure
      means t09 or the ports.yaml re-wrap was placed wrongly: restore the block or the field's words exactly.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Replays checks already registered in the validate tiers.
  - step: 7
    phase: pre-deploy
    action: The two gate entrypoints read the committed sidecar -- ops serving not blocked, production telemetry held on definition_sha256.
    command: >-
      bin/venv-python -m scripts.checks.ops_governance.validate_reconcile_pending_gate --deploy-gate && bin/venv-python -m
      scripts.checks.ops_governance.validate_reconcile_pending_gate --telemetry-hold
    expected: "OK: no reconcile_scope=ducklake table has a pending reconcile., then held=true on stdout and TELEMETRY_PRODUCTION_HOLD pending=1 columns=['telemetry_agents.definition_sha256'] on stderr."
    fix_if: A refused --deploy-gate means a telemetry table leaked into the ducklake predicate; held=false means the pending entry is missing.
    hermetic: true
    expected_literals:
      - held=true
    graduation: waive
    graduation_waiver_reason: Reads this commit's sidecar state, which the bookkeeping PR changes by design.
  - step: 8
    phase: pre-deploy
    action: >-
      Size limits hold with no raise: Python SLOC and the structural effective-line limits (ports.yaml and
      telemetry_observations.yaml are near the contracts class's 500).
    command: >-
      bin/venv-python -c "from scripts.checks.sloc.sloc_limits import validate_sloc_limits as a; from
      scripts.checks.structural.size_limits import validate_structural_size_limits as b; from
      scripts.checks.structural.budget_raises import validate_structural_size_budget_raises as c; f=[]; [x(f) for x in
      (a,b,c)]; print('SIZE_FAILS', len(f)); assert not f, f"
    expected: SIZE_FAILS 0.
    fix_if: >-
      A sidecar-bound file over its limit is a STOP to the planning thread; never decompose, compact or raise it in the
      build. An unbound Python file over budget is decomposed (Decision 128), never raised.
    hermetic: true
    expected_literals:
      - SIZE_FAILS 0
    graduation: waive
    graduation_waiver_reason: Replays registered checks.
  - step: 9
    phase: pre-deploy
    action: Red-main overlap verdict for the touched files (Decision 226).
    command: bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-persona-run-identity-contract.yaml
    expected: No open ci_rca rec overlaps the scope.
    fix_if: An overlap -- STOP and tell the coordinator before building.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Fast tier, then the full tier before handoff (handoff_policy), the full tier started in the background from the top-level session.
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The fast tier exits 0 and the verify-head read reports a completed full run for HEAD with exit 0.
    fix_if: In-scope failures are fixed on the branch; out-of-scope failures become recs (Decisions 59, 55). A timeout is blocked, never a warning.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      The governed deploy that first ships a commit at or after the merge is green with the production telemetry leg
      held. Read with mcp__github__actions_list (list_workflow_runs, workflow deploy-ducklake-lambdas.yml; the run whose
      gate job names a sha at or after $MERGE_SHA) then list_workflow_jobs, written to $DEPLOY_JOBS_JSON.
    command: >-
      test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
      jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
      want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','deploy-telemetry-twin','telemetry-twin-smoke','smoke','deploy-telemetry'];
      assert all(jobs.get(w)=='success' for w in want),jobs;
      assert jobs.get('telemetry-smoke')=='skipped',jobs;print('HELD_DEPLOY_OK')"
    expected: The eight named jobs concluded success, telemetry-smoke skipped, then HELD_DEPLOY_OK.
    fix_if: A red job -- read its log (VP 12) first; STOP and RCA (Decision 55). telemetry-smoke ran -- the hold did not engage; STOP and tell the coordinator.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: The smoke owner step added the column and the production deploy was held. Save the maintenance-smoke and deploy-telemetry job logs (mcp__github__get_job_logs) to $MAINT_LOG_FILE and $HOLD_LOG_FILE.
    command: >-
      test -s "$MAINT_LOG_FILE" && test -s "$HOLD_LOG_FILE" && grep -Eq "MAINTENANCE_CREATE_TELEMETRY OK created=[0-9]+
      added=1 foreign_owned=0 scoped_create=false" "$MAINT_LOG_FILE" && grep -q "TELEMETRY_PRODUCTION_HOLD pending=1"
      "$HOLD_LOG_FILE" && echo HOLD_LIVE_OK
    expected: HOLD_LIVE_OK, from the first deploy run that ships the change (added=1).
    fix_if: >-
      added=0 on that first run -- the projection did not ship to maintenance; STOP and RCA. A re-run of the same commit
      prints added=0 by design: read the first run's maintenance-smoke log instead. No hold marker -- the hold step did
      not run (VP 11 shows whether the deploy ran).
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: >-
      Admin step on Benjamin's own words in the build thread naming it (Decision 230 cl.4): an admin-container session
      invokes ducklake_maintenance provision_telemetry_catalog as PlatformAdmin with the deploy-paths.yaml payload,
      pasted inline first, and saves the response body to $PROVISION_RESPONSE (table names, counters and the owner
      fields only).
    command: >-
      test -s "$PROVISION_RESPONSE" && bin/venv-python -c "import json,os;r=json.load(open(os.environ['PROVISION_RESPONSE']));
      print(r.get('added'), r.get('ownership'));assert r['ok'] is True and r['meta_schema']=='ducklake_telemetry';
      assert 'telemetry_agents.definition_sha256' in r['added'], r['added'];print('PRODUCTION_COLUMN_ADDED')"
    expected: PRODUCTION_COLUMN_ADDED, with added naming telemetry_agents.definition_sha256 (on a repeat run added is empty; then use the first response).
