    PR 1: a verdict persona's sub-agent run (a Skill call named plainly, with a leading / or with the ontheloop: prefix,
    within the run's open bound, with its readable definition record) writes agent_type the persona's registry key and
    definition_sha256 the SHA-256 of the record text after its header line and blank line, without the ARGUMENTS
    trailer, on its open and close rows; an absent or unreadable record keeps claude-code-subagent with no hash and is
    counted; the first readable persona call wins (VP 2).
  - "PR 1: every close row repeats its run's open row's agent_type and definition_sha256 (rule PI-4), and workflow attribution reads plugin-prefixed skill names (VP 2)."
  - >-
    PR 1: PARSER_VERSION 11; the corpus gains two cases; no existing case changes beyond its parser_version stamp except
    host_run_only_withheld's agent_type and workflow (its host-run agent moves off a persona key); the registry records
    version 11; the derived golden layer is at 11 and reads the persona key through
    agent_run_state_and_duration (VP 3, VP 4).
