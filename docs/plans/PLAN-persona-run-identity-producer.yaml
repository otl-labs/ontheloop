schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-run-identity-producer
intent: >-
  Make the claude_code producer write what plan 1 declared: on a verdict persona's sub-agent run, telemetry_agents
  agent_type carries the persona's registry key (code-review, plan-critique, decision-scout) and definition_sha256 the
  hash of the skill definition the run loaded, on its open and close rows, so the persona add steps capture from day
  one and the offline eval lane can tell a changed definition (rec-4433, plan 2 of 2). The persona is the first Skill
  call within the sub-agent's open bound whose name, after one normaliser removes a leading slash and the ontheloop:
  plugin prefix, is a verdict persona's skill, and whose injected definition record is readable; the hash is that
  record's text minus the Base directory header and the ARGUMENTS trailer. A run's close rows repeat its open row's
  identity. The operator asked that a persona run never carry a NULL hash (2026-11-12): definition_sha256 gains a
  write-enforced required_when on every persona registry key, kept equal to the executor-personas.yaml rows by a test.
  The same normaliser fixes workflow attribution for plugin-prefixed skill names. Parser version 11 (rec-4959 took
  10), so this plan's approved text moves plan 1's two parser_version 10 sentences to 11. Two build PRs: PR 1 is the
  producer, its corpus and the definition_sha256 provenance edits; PR 2 places every approved word and flips
  implementation_declared.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-run-identity-producer.yaml
phase: >-
  rec-4433 (open), the CAPTURE FROM DAY ONE prerequisite of T4.28 c3, T4.29 c2, T4.30 c2, T4.15 c15 and T4.31 c4; closes no
  criterion. V3: PR 2 changes config/lambda/ducklake/field_semantics.yaml (the required_when rule), so the governed
  deploy ships every DuckLake function (Decision 79); src/turn_capture is in no Lambda bundle, so sessions pick the
  producer up from their checkout of main after PR 1.
closes_criteria: []
cites: [dec:66, dec:79, dec:84, dec:199, dec:206, dec:207, dec:210, dec:212, dec:222, dec:230, dec:231, dec:246, dec:256]
scope:
  # ------------------------------------------------ PR 1: the producer, its corpus and the definition_sha256 provenance
  - file: src/turn_capture/persona_identity.py
    action: Create
    purpose: >-
      PR 1. Rules PI-1..PI-3 in the docstring (the envelope's PARSER_VERSION 11 line, sidecar block e01, is their text).
      PLUGIN_PREFIX = "ontheloop:"; skill_name(raw: str) -> str: strip, lower-case, remove one leading "/", then one
      PLUGIN_PREFIX (so "/ontheloop:Plan-Critique " -> "plan-critique", "ontheloop:ontheloop:x" -> "ontheloop:x", and
      "other:code-review" stays unmapped). PERSONA_SKILLS = {"code-review": "code-review", "decision-scout":
      "decision-scout", "plan-critique": "plan-critique"} (normalised skill name -> registry key). definition_hash(stream,
      use, bound) -> str | Literal["absent", "unreadable"] (PI-2): the records of stream with kind "companion",
      data.isMeta is True, data.sourceToolUseID == use.tool_id and line <= bound whose content (a str, or a list of
      exactly one {type: text} block) opens with "Base directory for this skill: "; none -> "absent"; more than one ->
      "unreadable"; the text after the first "\n\n" (no "\n\n" -> "unreadable"); when the call's input.args is a
      non-empty str, that text must end with "\n\nARGUMENTS: " + args, which is removed (else "unreadable"); the result
      is hashlib.sha256(text.encode("utf-8")).hexdigest(). persona_of(stream, bound, diag) -> tuple[str, str] | None
      (PI-1, PI-3): None when bound is None; else the stream's Skill tool_uses with rec.line <= bound in (rec.line,
      block) order whose skill_name(input.skill) is in PERSONA_SKILLS (input.skill a str); the first with a hash wins
      (diag persona_run += 1); each earlier one counts persona_definition_absent or persona_definition_unreadable. Stdlib
      plus src.turn_capture.streams; at most 90 SLOC.
    new_imports: [src.turn_capture.streams]
  - file: src/turn_capture/sessions.py
    action: Modify
    purpose: >-
      PR 1. _skill_workflow looks the name up as WORKFLOW_SKILLS.get(skill_name(skill)) (rule WA-2 now reads
      plugin-prefixed names; the old lower().removeprefix("/") goes). build_agents resolves identity =
      persona_of(child, open_bound(child), diag) once per spawn and passes it to every _agent_row of that spawn;
      _agent_row writes agent_type = identity[0] and definition_sha256 = identity[1] when identity is not None, else
      AGENT_TYPE and no definition_sha256 (agent_row_base drops None), each as a one-line conditional expression so every
      new line runs in tests/turn_capture/test_sessions.py's existing sub-agent nodes (the per-file 100% line-coverage
      gate measures sessions.py through that mirror test only). AGENT_COLUMNS gains "definition_sha256" after
      "host_run_ref". top_level_agent_rows is unchanged. 337 SLOC today, at most 350 after.
    new_imports: [src.turn_capture.persona_identity]
  - file: src/turn_capture/record_turn.py
    action: Modify
    purpose: >-
      PR 1. PARSER_VERSION 11, PRODUCER_VERSION "turn-capture-11". Rule PI-4 at the end of _Emitter.emit, after the
      union loop: map entity_ref -> the open row for every ("telemetry_agents", ref) entry of out whose event_kind is
      open; every close row whose entity_ref has an open row and whose agent_type or definition_sha256 differs from it
      is replaced in out by a copy carrying the open row's agent_type and definition_sha256 (the key removed when the
      open row has none), never mutating a memoised build; diag["close_identity_copied"] += 1 per replaced row when
      diag is not None. The copy is one expression ({k: v for k, v in close.items() if k not in IDENTITY} | {k: open[k]
      for k in IDENTITY if k in open}), so test_record_turn.py's PI-4 node runs every new line (the coverage gate
      measures record_turn.py through that mirror test only). 233 SLOC today, at most 245 after.
  - file: config/telemetry/parser_versions.yaml
    action: Modify
    purpose: >-
      PR 1. claude_code current 11; history entry version 11 (build date, the regenerated golden_digest with the
      allowlist pragma, full_output_cap_bytes 8388608, signature_prefixes [hook, gate, precommit, status], reason
      naming this plan, rec-4433 and rules PI-1..PI-4: a verdict persona's sub-agent run carries its registry key and
      definition hash on its open and close rows, close rows repeat the open row's identity, WA-2 reads plugin-prefixed
      skill names; two new golden cases; host_run_only_withheld's host-run agent moves from code-review to
      architectural-review (a top-level persona row with no hash is what PR 2's rule refuses, rec-5226); no other case
      changes beyond the version stamp).
  - file: docs/contracts/telemetry_agents.yaml
    action: Modify
    purpose: >-
      PR 1, provenance only (definition_sha256), never a sidecar block's words: populated_by becomes the folded text
      "the claude_code producer from parser_version 11, on a verdict persona's sub-agent run (its open and close rows;
      src/turn_capture/persona_identity.py, rules PI-1..PI-4); NULL on every other claude_code run."; realization appends
      definition_sha256 to produced.claude_code (after host_run_ref) and drops "rec-4433: [definition_sha256]" from
      unproduced; definition_sha256's amendment_log gains, first, {date: build date, semantic_break: false, change_class:
      prose_improvement, summary: "PLAN-persona-run-identity-producer (rec-4433, PR 1): populated_by names the
      claude_code producer from parser_version 11 and realization moves definition_sha256 to produced.claude_code (the
      unproduced owner rec-4433 is retired for this column). Meaning unchanged.", migration_story: "Provenance only; no
      stored row changes."}. PR 2: sidecar blocks t01, t02, t03, t05 and t06, verbatim. 466 effective lines on main,
      484 with the blocks, 487 after both PRs.
  - file: tests/turn_capture/test_persona_identity.py
    action: Create
    purpose: >-
      PR 1. Mirror test of persona_identity.py over synthetic trees built with tests/fixtures/turn_capture_corpus helpers
      and run through record_turn (mem_tree, session_final=True), so the sessions.py and record_turn.py wiring is what
      is tested. Nodes: test_skill_subagent_run_carries_persona_and_definition_hash (rec-4433's acceptance node; a sync
      general-purpose sub-agent calls Skill plan-critique with args and its definition record follows: both agent rows
      carry agent_type plan-critique and definition_sha256 equal to hashlib.sha256 of the record text after its header
      and blank line, without the ARGUMENTS trailer, computed in the test from the literal); test_skill_name_normalises;
      test_plugin_prefixed_and_slash_names_map (ontheloop:code-review, /code-review); test_workflow_reads_a_plugin_prefixed_skill_name
      (a sub-agent calling Skill ontheloop:planning reads workflow plan); test_string_content_and_no_args_hash_the_whole_body;
      test_absent_definition_keeps_the_subagent_key (no record: claude-code-subagent, no definition_sha256, diag
      persona_definition_absent); test_unreadable_definition_keeps_the_subagent_key (two records; no blank line after the
      header; args given but the trailer missing; content a list of two blocks; each: claude-code-subagent, no hash, diag
      persona_definition_unreadable); test_first_readable_persona_call_wins (code-review with no record, then plan-critique
      with one, then decision-scout with one: plan-critique, absent counted once); test_non_persona_skill_is_ignored (a
      dataviz call with its own definition record, then decision-scout: decision-scout); test_call_after_the_open_bound_is_not_read
      (the Skill call in the child's second turn: claude-code-subagent); test_background_run_carries_the_persona_on_its_notice_close;
      test_a_non_string_skill_input_is_ignored (input.skill a list, then a mapped call: the mapped call wins);
      test_no_open_bound_reads_no_persona (persona_of(stream, None, diag) is None and counts nothing);
      test_persona_skills_equal_the_verdict_personas_rows (PERSONA_SKILLS equals {contract skill_tether.skill: row
      registry_key} over docs/contracts/executor-personas.yaml's kind verdict rows, PLUGIN_PREFIX equals the name in
      .claude/.claude-plugin/plugin.json plus ":", and no .claude/skills/<skill>/SKILL.md of those rows holds
      "$ARGUMENTS", since PI-2 reads an appended ARGUMENTS trailer). PI-4's node is in test_record_turn.py. String
      literal paths, so the affected-test selection finds it.
