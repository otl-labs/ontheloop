      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader,
      fetch_recs_by_ids;rows,missing=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-5204','rec-5212']);s={r['id']:r['status']
      for r in rows};print(s);assert not missing and set(s.values())=={'closed'}" && git fetch origin main --quiet && git
      cat-file -e origin/main:docs/plans/PLAN-persona-run-identity-producer.yaml &&
      git cat-file -e origin/main:docs/plans/approved/persona-run-identity-producer.yaml && git show
      origin/main:src/turn_capture/record_turn.py | grep -q "^PARSER_VERSION = 10$" && git show
      origin/main:tests/fixtures/turn_capture/golden/index.json | bin/venv-python -c "import json,sys;n=len(json.load(sys.stdin)['cases']);print('cases',n);assert n==61" && git merge-base --is-ancestor origin/main HEAD && echo PRECONDITION_OK
