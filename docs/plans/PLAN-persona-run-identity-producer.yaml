rollback: >-
  Before PR 2 merges, revert PR 1 alone with a forward PR that also moves the corpus, the registry entry and the derived
  headers back (a new parser version: PARSER_VERSION never decreases, so the revert is version 12 with version 10's
  rules); rows already stored at 11 stay valid. After PR 2, the fast rollback of the rule is a forward PR removing
  required_when from definition_sha256 with its projection, the two PR 2 test modules' rule nodes and a sidecar-bound
  amendment (approved words, Decision 246); the governed deploy then ships the looser projection. Never drop the column
  or its realization while rows at 11 carry it. The producer and the rule are independent: a defect in either reverts
  alone.
