      rec-5212 closed by PLAN-telemetry-capture-proxy-body-cap's Resolves trailer). A parser bump makes every session
      resend its whole tree, which the egress proxy refuses over 1 MiB without the body's SHA-256 (Decision 256), so
      without the fix every long session would stop capturing for good.
