    test modules, flips implementation_declared and carries "Resolves: rec-4433". The provenance edit (populated_by,
    realization and its log entry) is the one telemetry_agents.yaml change outside the sidecar: it must land with the
    corpus that emits definition_sha256 (realization rules R4, R5, R8), and coordinator.yaml's always_ask item excepts a
    provenance swap.
