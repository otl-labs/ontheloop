    red_green_expectation: red before (module absent), green after
  - source: scripts/personas/telemetry_send.py
    behavior: handled artifacts are skipped, a missing cursor baselines expired artifacts, and an expired artifact never seen reds the run only with a present cursor
    verification_step: 1
    test_selector: tests/personas/test_telemetry_send.py::test_cursor_skips_handled_and_reds_on_expired_unseen
    red_green_expectation: red before (module absent), green after
  - source: scripts/personas/telemetry_send.py
