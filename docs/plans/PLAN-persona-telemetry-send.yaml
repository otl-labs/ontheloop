schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-telemetry-send
intent: >-
  Send every GitHub Actions verdict persona run's telemetry rows (tokens, served model, latency, retries) to the
  production telemetry writer from one keyless scheduled job outside the covered verdict workflows, so Actions runs
  are measurable like in-session runs before the first persona flip (NS.6), without the writer's host ever appearing
  in a public file or job log (the operator's 2026-11-28 ruling on rec-5358, option 2).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-telemetry-send.yaml
phase: >-
  T4.32 (rec-5551, part D of the rec-5545 split): records c1's MODEL leg for Actions runs and names c7's ENDPOINTS
  writer-host source. c1 stays open (other legs) and c7 is met, so the plan closes no criterion and adds dated
  amendments only (Decision 136).
closes_criteria: []
cites: [dec:88, dec:200, dec:205, dec:207, dec:212, dec:250, dec:255, dec:263, dec:267, dec:275, dec:282, dec:290, dec:291]
amends: []
introduces: []
scope:
  - file: .github/workflows/persona-telemetry-send.yml
    action: Create
    purpose: >-
      The keyless sender, deliberately named outside .github/workflows/persona-verdict*.yml (validate_persona_verdict_egress
      covers every id-token job there, and its filter prints every allowed host). name persona-telemetry-send; triggers
      schedule cron '23 * * * *' (a shape sensor_liveness.cron_period_seconds accepts) and workflow_dispatch; concurrency
      group persona-telemetry-send, cancel-in-progress false. One job send: if (github.event_name != 'workflow_dispatch' ||
      github.actor != 'otl-workflow-dispatcher[bot]') && (github.ref == 'refs/heads/main'), the form test_dispatch_bot_guard's
      guard_problems accepts (Decision 267 cl.3; never
      registered in config/lambda/scheduled_workflow_dispatcher/schedules.yaml); runs-on ubuntu-latest; timeout-minutes 15; permissions exactly
      contents read, actions read, id-token write; no Environment; no egress filter. Steps, every action SHA-pinned as
      elsewhere in the repo: checkout (persist-credentials false); ./.github/actions/aws-region; setup-python 3.12;
      venv install of requirements.txt (telemetry-arrival.yml's form); actions/cache/restore of the cursor (key prefix
      persona-telemetry-sent-); aws-actions/configure-aws-credentials for agent-platform-github-ci-branch with
      MASK_AWS_ROLE_ID_ACCOUNT_PART (telemetry-arrival.yml:55-63's form); one shell step that reads
      /agent-platform/ducklake/telemetry_writer_url with aws ssm get-parameter, emits ::add-mask:: for the URL and its
      bare host before anything else, and exports DUCKLAKE_TELEMETRY_WRITER_URL (transport.URL_ENV) to GITHUB_ENV; the
      send step (GH_TOKEN github.token) running .venv/bin/python -m scripts.personas.telemetry_send with the cursor path;
      actions/cache/save of the new cursor with key persona-telemetry-sent-${{ github.run_id }}-${{ github.run_attempt }},
      if always() (a crash before the cursor is written leaves no path, which the save step reports as a warning, never a
      failure). Header comment: why the name sits outside the glob, why no filter, and that it is an alarm watched by
      ci-rca, never a gate.
  - file: scripts/personas/telemetry_send.py
    action: Create
    purpose: >-
      Imports exactly: stdlib; scripts.telemetry_capture.transport and responses; scripts.telemetry_capture.ci_pass
      (project_ref_home); scripts.personas.resolve_pr (request, for API GETs only); scripts.personas.execute
      (registry_key); src.turn_capture.litellm_producer (PRODUCER, PARSER_VERSION, PRODUCER_VERSION);
      src.turn_capture.observations (OBSERVATION_COLUMNS); src.turn_capture.sessions (SESSION_COLUMNS, AGENT_COLUMNS).
      Never imported by persona code. main(argv) with --cursor PATH and --dry-run (lists, admits, downloads and
      validates, sends nothing, writes no cursor). Outcome per artifact is exactly one of handled, foreign, unreadable,
      baselined, expired_unseen, empty, invalid, unsent, sent. (1) List artifacts named persona-verdict-results (job
      run) and persona-verdict-results-fallback (job run-fallback) (GET /repos/{repo}/actions/artifacts?name=...
      &per_page=100, paged, capped at 10 pages), keeping those created in the last 72 h. A listing non-200 or a cap hit
      without a short page is listing_incomplete: the run is red. (2) Cursor first: a JSON file {ids: {artifact id:
      expires_at}} of artifacts already handled, pruned past 96 h; ids in it are skipped as handled before any other call
      (Decision 88). A missing or unreadable cursor prints cursor=missing and starts a baseline: every admitted
      artifact that is already expired is recorded as baselined (counted, never red), so the next run never reds on
      artifacts that expired before the sweep could see them. With a present cursor, an admitted expired artifact absent
      from it is expired_unseen and reds the run (Decision 250's loss alarm; never the enforcing check of
      telemetry_agents' arrival residual, rec-4951). (3) Provenance from GitHub's records only, for unhandled artifacts:
      artifact.workflow_run.repository_id and head_repository_id equal the repository's id (GET /repos/{repo}, once),
      head_branch main, and the run (GET /actions/runs/{id}, at most once per run id per sweep) has path
      .github/workflows/persona-verdict.yml and event workflow_run. A proven mismatch is foreign (skipped, never sent,
      never red, recorded handled); a non-200 or missing field on either GET is unreadable (Decision 250 cl.2): the run
      is red and the id stays out of the cursor so the next tick retries. (4) Download each unexpired admitted artifact:
      refuse (invalid) when the listing's size_in_bytes exceeds 5 MiB; GET .../artifacts/{id}/zip with Authorization
      through an opener whose redirect handler follows nothing, read the 302 Location, then GET that URL with no
      Authorization header and read at most 5 MiB + 1 bytes into memory (over the cap is invalid). A non-200/302 answer
      or a transport error is unsent; a corrupt zip is invalid. Read only members named telemetry-<route>.json at the
      zip root, route a key registry_key resolves over main, each at most 5 MiB uncompressed (else invalid); never
      extract to disk, never read any other member (the verdict file holds persona output); no rows member is empty.
      (5) Validate each document: keys exactly batches, diagnostics, parser_version, producer, producer_version
      (telemetry_rows.rows_document); producer, parser_version and producer_version equal litellm_producer's constants;
      batches only telemetry_observations, telemetry_agents and telemetry_sessions, in that order; each row's keys
      within OBSERVATION_COLUMNS, AGENT_COLUMNS or SESSION_COLUMNS; every telemetry_agents row's workflow_run_id equal
      to the artifact's run id and host_run_ref starting gha:<run id>/ with the job the artifact name binds (run or
      run-fallback). A failed document is invalid and reds the run (main's own code wrote it). (6) Send each valid
      document through transport.make_client (the env URL, SigV4 under the ambient CI credentials) as append_telemetry
      bodies chunked by transport.chunk, project_ref from ci_pass.project_ref_home, batch order kept; responses.classify
      handles OK, REGISTER_TENANT once, RECHUNK by halving; any other answer, or a 409 conflict (Decision 207), is
      unsent. Sent, empty, foreign, baselined and invalid ids are recorded handled (invalid stays red that run and is
      not re-read); unsent and unreadable ids are not, so the next tick retries them. (7) Print one line
      'PERSONA_TELEMETRY_SEND listed=N handled=N foreign=N unreadable=N baselined=N sent=N rows=N empty=N invalid=N
      unsent=N expired_unseen=N listing=complete|incomplete cursor=present|missing' plus one 'sent run=<id>
      attempt=<n> route=<route>' line per document; never a URL, host, response body or exception message (fixed
      reason tokens only, Decision 290 cl.2). Exit 1 when unreadable, invalid, unsent or expired_unseen is non-zero or
      the listing is incomplete, else 0. Writes the updated cursor before exiting (not under --dry-run).
  - file: tests/personas/test_telemetry_send.py
    action: Create
    purpose: >-
      Offline tests with a fake GitHub API and a fake writer client: the rec-5551 acceptance node
      test_rows_file_is_sent_without_publishing_writer_host (a valid document is sent as chunked append_telemetry bodies
      under project_ref, and captured stdout and stderr hold neither the URL nor its host even when the writer errors);
      test_foreign_artifacts_are_skipped_never_sent (wrong repository id, head repository, branch, path and event, one case
      each); test_document_validation_refuses_and_reds (extra key, wrong producer or version, unknown table, unknown column,
      wrong run id, wrong host_run_ref job, oversize listing size, oversize body, oversize member, corrupt zip,
      non-telemetry member never read); test_cursor_skips_handled_and_reds_on_expired_unseen (present cursor skips
      handled ids before any provenance call; expired unseen reds; pruning at 96 h; and a two-run case: a missing cursor
      baselines expired artifacts and exits 0, then a second run with that cursor and the same listing exits 0);
      test_unreadable_provenance_and_listing_red_and_retry (403 and 5xx on the run GET, non-200 on the repo GET, a
      listing non-200 and a page-cap hit each red the run and leave the id out of the cursor; one run GET per run id);
      test_zip_redirect_carries_no_token_and_is_bounded (the second request carries no Authorization header, the first
      follows no redirect, and an over-cap body is refused after cap + 1 bytes); test_writer_answers_drive_the_exit_code
      (OK, register_tenant once, rechunk, 409 conflict and transport failure); test_summary_line_prints_counts_only.
  - file: tests/ci/test_persona_verdict_unpublished_hosts.py
    action: Create
    purpose: >-
      rec-5358's acceptance node test_no_covered_job_lists_the_telemetry_writer_host: no job in
      .github/workflows/persona-verdict*.yml and no row of config/persona_verdict_egress.yaml lists a lambda-url,
      execute-api or telemetry host form, and none reads the writer URL parameter. Plus
      test_the_sender_sits_outside_the_covered_glob_and_holds_no_key: persona-telemetry-send.yml is outside the glob, has
      exactly the plan's permissions, no secrets but AWS_ACCOUNT_ID and AWS_ROLE_ID_ACCOUNT_PART, the github_ci_branch
      role, no harden-runner step, the Decision 267 guard, an accepted cron shape and the add-mask step before the send.
  - file: tests/persona_contracts/test_findings_read.py
    action: Modify
    purpose: >-
      Add test_sent_actions_runs_are_not_read_as_in_session: a root session whose telemetry_agents rows are a litellm
      top-level gha run (observation_id NULL, host_run_ref gha:...) yields no in_session row, pinning the existing
      observation_id filter that keeps sent Actions rows out of the in-session lane until rec-5752 joins them.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      One workflows-map row: persona-telemetry-send: {tier: not_a_gate, ci_rca: watched, owner: platform, rationale:
      "rec-5551 keyless persona telemetry sweep; red on an unsent or lost rows file; files no rec itself."}. Headroom 6
      lines at planning; other unbuilt plans also add rows (see context); whichever builds second re-measures.
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: Add "persona-telemetry-send" to on.workflow_run.workflows so a red sweep is diagnosed (Decision 250 cl.4).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Append to T4.32 c7's text the dated amendment quoted in context (TELEMETRY), and to c1's text: [Amendment
      2026-11-28, PLAN-persona-telemetry-send, rec-5551: the CREDENTIAL leg's role keeps its writer grants unused; Actions
      runs' telemetry is sent by the keyless sweep c7's TELEMETRY amendment names, under the CI branch role (operator
      2026-11-28); removing the unused grants is rec-5754]. Notice class (Decision 279).
  - file: docs/contracts/telemetry_persona_findings.yaml
    action: Modify
    purpose: >-
      Every rec-5551 mention outside amendment_log (lines 23 and 38, the tenant_id, project_id and agent_run_id NULL
      notes, and lines 264-274, the governance_notes ACTIONS LANE, DEFERRAL and MATERIALIZATION sentences) is
      re-pointed; the 2026-11-27 amendment_log row at line 44 is history and never changes (Decision 282 cl.3): rows are now sent by persona-telemetry-send.yml, and the
      join that fills the three ids and moves the actions lane onto the telemetry verbs is rec-5752. One amendment_log
      row, with the compaction Decision 282 cl.1 requires; byte budget per Decision 275.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Decision 212 cl.3: SA-14's assumption list adds 'the Actions artifacts API,' after github_app_token and its full
      lists add docs/plans/PLAN-persona-telemetry-send.yaml (this plan holds the listing, provenance and redirect
      detail); PC-01's sentence naming scripts/telemetry_capture/ci_pass.py (through transport.py, under a CI role)
      adds scripts/personas/telemetry_send.py beside it. One terse amendment_log row. Byte relief first (50218 of 50251 B
      at planning; amendment_log already fully terse), both in SA-02, lossless by citation (Decision 275 cl.4 relief
      order): its parenthetical '(measured in 2.1.302: ... usable witness)' (269 B) becomes '(measured:
      docs/plans/PLAN-telemetry-stop-turn-close.yaml)', and its WORKFLOW_SKILLS parenthetical drops the nine skill names
      'orient, ... executor-rca; ' (src/turn_capture/sessions.py:37 holds them), keeping the adopter sentence. Simulated
      at planning: 50190 of 50251 B after all edits (61 B spare); the build re-measures and stops if short.
bundled_recommendations: [rec-5551, rec-5358]
followon_recs: []
infrastructure_dependencies:
  - >-
    No Terraform or IAM change. agent-platform-github-ci-branch already trusts main's workflow subject, holds
    TelemetryWriterInvokeCI and TelemetryWriterInvokeCIViaUrlOnly (Decision 291 cl.1) and ssm Get* on
    parameter/agent-platform/*, and cannot read /secret/* (terraform/personal/oidc_ci_roles.tf, oidc.tf:90-91); it is
    already a declared writer class (docs/contracts/telemetry-writer-principals.yaml). Lambda: compute_affected_artifacts
    maps docs/ROADMAP-PLATFORM.yaml to the data-pipeline artifact as a data-only asset; no build, deploy or smoke is owed
    (Decision 79; PLAN-wording-approval-routing.yaml precedent).
acceptance_criteria:
  - "rec-5551's node tests/personas/test_telemetry_send.py::test_rows_file_is_sent_without_publishing_writer_host passes."
  - "rec-5358's node tests/ci/test_persona_verdict_unpublished_hosts.py::test_no_covered_job_lists_the_telemetry_writer_host passes."
  - ".github/workflows/persona-verdict.yml and config/persona_verdict_egress.yaml are unchanged against origin/main."
  - "After merge, a dispatched persona-telemetry-send run on main ends success with sent >= 1 and its log holds no lambda-url or execute-api text."
  - "The sent run's telemetry_agents rows read back from production telemetry with writer-minted tenant_id and project_id."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The new sender and host-guard nodes pass.
    command: bin/venv-python -m pytest tests/personas/test_telemetry_send.py tests/ci/test_persona_verdict_unpublished_hosts.py tests/persona_contracts/test_findings_read.py::test_sent_actions_runs_are_not_read_as_in_session -q
    expected: exit 0, no failures or errors
    fix_if: a node fails; fix the code, never the assertion
    hermetic: true
    expected_literals: [passed]
    graduation: waive
    graduation_waiver_reason: these are the test_obligations selectors pr-validate already runs on every PR; a registry row would duplicate them
  - step: 2
    phase: pre-deploy
    action: The neighbouring suites the change reaches pass.
    command: bin/venv-python -m pytest tests/personas/test_telemetry_rows.py tests/personas/test_keyed_run.py tests/persona_contracts/test_findings_read.py tests/checks/misc tests/checks/ci_guards/test_validate_persona_verdict_chain.py tests/convergence_health/test_dispatch_integrity.py tests/convergence_health/test_sensor_liveness_dispatch.py tests/verify_ci_workflow/test_dispatch_bot_guard.py -q
    expected: exit 0
    fix_if: a node fails; fix the code, never the assertion
    hermetic: false
    graduation: waive
    graduation_waiver_reason: broad neighbouring suites already in the fast and full tiers; not a single standing check
  - step: 3
    phase: pre-deploy
    action: The covered verdict workflow and its egress list are untouched.
    command: git fetch origin main --quiet && git diff --quiet origin/main -- .github/workflows/persona-verdict.yml config/persona_verdict_egress.yaml && echo unchanged
    expected: prints unchanged, exit 0
    fix_if: a diff exists; revert it (this plan never edits either file)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: PR-relative against origin/main, so it is vacuous once merged
  - step: 4
    phase: pre-deploy
    action: The contracts the plan edits stay inside their budgets and validate.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0 (structural size budgets, amendment_log retention, ci_rca taxonomy, egress and chain checks green)
    fix_if: a budget or contract check fails; apply the named relief, never a raise
    hermetic: false
    graduation: waive
    graduation_waiver_reason: invokes scripts.validate, which the graduate partition refuses (recursion)
  - step: 5
    phase: pre-deploy
    action: Read-only live probe that a retained results artifact holds a rows file of the validated shape (dry run, no send).
    command: D=$(mktemp -d) && GH_TOKEN=$(gh auth token) bin/venv-python -m scripts.personas.telemetry_send --cursor "$D/cursor.json" --dry-run
    expected: exit 0 and a PERSONA_TELEMETRY_SEND line with listed >= 1, unreadable=0, invalid=0 and unsent=0 (a results artifact of run 46093899188 held telemetry-code_reviewer.json at planning)
    fix_if: invalid > 0 on main's own artifacts, fix the validator against the real document, never widen it past the producer's columns; unsent on the token-free storage GET, fix the download; if gh holds no token in the session, the step is BLOCKED, recorded so in the PR body, and VP 6 is the first live download (the token-forwarding and size-cap risks are pinned offline by test_zip_redirect_carries_no_token_and_is_bounded)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a live, non-hermetic probe of retained artifacts that expire within a day
  - step: 6
    phase: post-deploy
    action: Dispatch the sweep on main after a keyed verdict run has uploaded results within the last day, and read its run.
    command: "Accepted form, MCP steps then shell: mcp__github__actions_run_trigger(owner=otl-labs, repo=ontheloop, workflow_id=persona-telemetry-send.yml, ref=main); export RUN_ID=<that run's id> RUN_DAY=<its UTC date>; mcp__github__get_job_logs for its send job written to $D/pts.log (D=$(mktemp -d)); then grep -E 'PERSONA_TELEMETRY_SEND .*sent=[1-9]' $D/pts.log && ! grep -Eqi 'lambda-url|execute-api' $D/pts.log && echo host-absent"
    expected: run conclusion success; the summary line shows sent >= 1, unreadable=0, invalid=0, unsent=0; prints host-absent
    fix_if: unsent or invalid; read the fixed reason token and fix forward on a new branch; a host in the log is a security finding (file it and surface it at once)
    hermetic: false
  - step: 7
    phase: post-deploy
    action: The sent run's rows are in production telemetry with writer-minted ids.
    command: "bin/venv-python -c \"from scripts.telemetry_capture import read_route as r; n=r.make_routed_reader('agent_platform').named; import os; d=os.environ['RUN_DAY']; rows=[x for x in n('telemetry_root_sessions', day_from=d, day_to=d) if str(x.get('host_run_ref') or '').startswith('gha:'+os.environ['SENT_RUN_ID']+'/')]; print(len(rows), all(x.get('session_id') and x.get('tenant_id') and x.get('project_id') for x in rows))\""
    expected: prints a count of at least 1 and True (SENT_RUN_ID is a run id from a 'sent run=' line of VP 6's log)
    fix_if: zero rows after a success run; check the writer's answer counts in the send log, then the reader's catalog route; fix forward
    hermetic: false
  - step: 8
    phase: post-deploy
    action: rec-5551 and rec-5358 read back closed after the merge's Resolves trailer and their acceptance nodes pass on main.
    command: bin/venv-python -m pytest tests/personas/test_telemetry_send.py::test_rows_file_is_sent_without_publishing_writer_host tests/ci/test_persona_verdict_unpublished_hosts.py::test_no_covered_job_lists_the_telemetry_writer_host -q && bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows,_=fetch_recs_by_ids(make_reader('agent_platform'),['rec-5551','rec-5358']); print(sorted((r['id'],r['status']) for r in rows))"
    expected: both nodes pass and the print shows rec-5358 and rec-5551 with status closed
    fix_if: a rec still open; close it through ops_data_portal with the merge sha after its node passes on main
    hermetic: false
test_obligations:
