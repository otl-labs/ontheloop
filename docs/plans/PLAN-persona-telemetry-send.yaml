    waiver_reason: a guard over files this plan leaves unchanged, so it is green before and after; its value is the regression pin rec-5358 names
  - source: config/ci_rca_taxonomy.yaml
    behavior: the sweep is a watched, not-a-gate workflow ci-rca listens to
    verification_step: 4
    command: bin/venv-python -m scripts.validate --pre
    red_green_expectation: red before (validate_ci_rca_adjudication refuses a new workflow without a row), green after
  - source: .github/workflows/ci-rca.yml
    behavior: ci-rca listens to the sweep's completions
    verification_step: 4
