rollback: >-
  A forward PR, never a revert of the squash commit while a build that depends on the check (H1, T8) is in flight.
  Removing the gates without the check fails validate_persona_trigger_policy on the live tree, so they go together; the
  writer's dispatch-refused input is inert at "false" and may stay. Retiring the three graduated nodes needs Decision
  235 cl.1 approval. The DECISIONS.md annotations are append-only (Decision 177): a reversal is a further dated
  annotation, never a deletion. The relief delegates are behaviour-identical and stay.
