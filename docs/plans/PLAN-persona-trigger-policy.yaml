schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-trigger-policy
intent: >-
  Enforce Decision 205 clause 1 mechanically before any verdict persona lands on Actions (T4.2 c10, part of T4.32 c1):
  a deterministic dispatch gate stops a workflow_dispatch from an App or bot reaching an LLM step (and so an unreviewed
  apply), and a registered check refuses any workflow that runs an LLM persona on an inadmissible trigger, grants
  checks: write to a pull_request-triggered workflow, or starts a compute-plane persona.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-trigger-policy.yaml
phase: >-
  T4.32 c1 (part: the trigger-policy check, which also refuses a compute-plane start; Decision 229 cl.3), discharging
  T4.2 c10 (closes_criteria). V2: Python check, gate script, workflow YAML and tests; nothing Lambda-packaged, no
  Terraform, no deploy. Live dispatch behaviour is read back post-merge (VP 11).
fallback_reevaluation:
  reevaluated_on: "2026-11-12"
  substrate_status: CD.27 pending; executor substrate unratified; T4.2 not built; the T4.15 spike has not run.
  verdict: continue_on_current_substrate
  basis: >-
    T4.2 c10 is a GitHub Actions trigger rule and check; it reads the same under every candidate layer-2 substrate and
    touches no CD.27, fallback_spec or T4.15 ruling. The compute-plane leg only refuses an Actions start.
scope:
  - file: scripts/ci/persona_dispatch_gate.py
    action: Create
    purpose: >-
      The deterministic dispatch gate (thin-adapter target, Decision 162). Reads GITHUB_EVENT_NAME, GITHUB_EVENT_PATH
      (sender.type), GITHUB_ACTOR, GITHUB_TRIGGERING_ACTOR and GITHUB_OUTPUT. Any event other than workflow_dispatch:
      refused=false, exit 0. workflow_dispatch: admitted (refused=false, exit 0) when sender.type is User and
      GITHUB_TRIGGERING_ACTOR does not end in [bot]; or, only with --own-failure (ci-rca), when GITHUB_ACTOR is
      github-actions[bot] and --run-json names a run of this repository (GITHUB_REPOSITORY) on the default branch,
      whose workflow (the run's path resolved to that workflow file's name:, since the run's name can be a run-name) is in
      the --watched-from workflow file's on.workflow_run.workflows list (PyYAML reads the on:
      key as True; both spellings are read), and which has
      conclusion failure, or status in_progress and --jobs-json (that run's jobs, fetched in the same step) shows a job or a
      step with conclusion failure (a self-dispatch from a failing step reaches ci-rca while its own job still runs);
      an admission prints
      "PERSONA_DISPATCH_ADMITTED: <user|own-failure> <actor>" and writes refused=false. Anything else,
      an unreadable input included: prints "PERSONA_DISPATCH_REFUSED: <reason>" to stderr and the step summary, writes
      refused=true, exits 1 (fail closed). An unexpected exception is not a refusal: it prints
      "PERSONA_DISPATCH_GATE_ERROR: <type>", writes nothing and exits 2, so ci-rca still files it. Module-scope imports
      are stdlib only (the reconcile and sandbox apply jobs run plain python3 with no pyyaml); yaml is imported inside
      the --own-failure path, which only ci-rca uses, under bin/venv-python.
  - file: tests/ci/test_persona_dispatch_gate.py
    action: Create
    purpose: >-
      Truth table over the gate: push, pull_request and workflow_run pass; User dispatch admitted; Bot sender refused;
      User sender with a [bot] triggering_actor refused; github-actions[bot] own-failure admitted on a completed
      failed run, on an in-progress run with a failed job, and on an in-progress run whose only failure is a step of a
      job still in progress (the gated-apply self-dispatch shape);
      refused when the run is in another repository, off the default branch, of an unwatched workflow, green, or
      unreadable; refused without --own-failure. Each refusal writes refused=true and exits 1. An injected exception
      exits 2 with the GATE_ERROR marker and no output. Module-scope imports are stdlib only (an AST assertion), and a
      subprocess run of the push and User-dispatch paths under python3 -I with yaml import blocked succeeds.
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: >-
      One step, name "Persona dispatch gate (Decision 205 cl.1)", id persona_gate, immediately before "Run ci-rca
      agent": if: github.event_name == 'workflow_dispatch' plus rca_agent's existing conjuncts; under set -euo pipefail
      it fetches the dispatched run (gh api repos/<repo>/actions/runs/<steps.meta.outputs.run_id>, the digit-sanitised
      id, never the raw input) and its jobs (.../jobs?per_page=100) to two files at gate time, then runs the gate under
      bin/venv-python with
      --own-failure, --run-json, --jobs-json and --watched-from .github/workflows/ci-rca.yml (a failed fetch fails the
      step, so the LLM step is skipped).
      rca_agent's if gains "&& steps.persona_gate.outputs.refused != 'true'". The designed-refusal step's command is
      byte-unchanged: on workflow_run it runs from the failing commit's checkout, whose designed_refusal.py may predate
      any new argument. The job if (pinned by
      tests/verify_ci_workflow/test_ci_rca_and_canary.py) is unchanged.
  - file: .github/workflows/reconcile.yml
    action: Modify
    purpose: >-
      Steps persona_gate (before review, same if as review) and persona_gate_fresh (before review_fresh, same if as
      review_fresh), named "Persona dispatch gate (Decision 205 cl.1)" and "Persona dispatch gate (Decision 205 cl.1,
      fresh re-plan)", each running python3 "$GITHUB_WORKSPACE/.dispatch-tooling/scripts/ci/persona_dispatch_gate.py"
      (the RED_SHA checkout predates the script). review and review_fresh gain the matching refused != 'true'
      conjunct. record_write gains dispatch-refused from either gate. Gate step if: strings use only the tokens
      scripts/ci/reconcile_reachability.py accepts. Relief (the file is 513 of its 513 structural budget; measured
      against main at build, never a raise): gated-apply-reconcile's "Verify downloaded fresh plan.bin sha256" body
      becomes one call of scripts/ci/verify_plan_sha256.py from .dispatch-tooling, and, only while still over, the
      artifact_sha bodies of apply-reconcile and gated-apply-reconcile become one call each of
      scripts/ci/originating_pr_sha.py from .dispatch-tooling. Step ids, names, if: and env are unchanged. The resolved,
      route, apply, recheck and starved-rec bodies are pinned by tests and are never moved.
  - file: scripts/ci/verify_plan_sha256.py
    action: Create
    purpose: >-
      Relief delegate (both workflow rows): --label <MARKER> --plan plan.bin, expected digest from env
      FRESH_PLAN_SHA256; on mismatch prints "::error::<MARKER> sha256 mismatch: expected X, got Y. Refusing to apply a
      possibly-corrupted plan." to stderr and exits 1; else prints "<MARKER> sha256 verified: Y". Same text as today's
      inline bodies.
  - file: tests/ci/test_verify_plan_sha256.py
    action: Create
    purpose: Match, mismatch, missing plan.bin and empty expected digest (all but match exit 1 with the marker).
  - file: scripts/ci/originating_pr_sha.py
    action: Create
    purpose: >-
      Conditional relief delegate (reconcile.yml row only): resolves the originating PR head sha of RED_SHA through
      gh api, writes value=<sha> to GITHUB_OUTPUT, and on an empty or null answer prints today's "No originating PR
      resolved for <sha>; cannot resolve the content-addressed artifact sha (Decision 77 no-TOCTOU)." error and exits
      1 (fail closed, as now). Not created if reconcile.yml fits without it.
  - file: tests/ci/test_originating_pr_sha.py
    action: Create
    purpose: Conditional with its script -- resolved, empty, null and gh failure (the last three exit 1 with the marker).
  - file: .github/workflows/terraform-apply-sandbox.yml
    action: Modify
    purpose: >-
      apply-sandbox: step persona_gate, name "Persona dispatch gate (Decision 205 cl.1)", before review, with review's
      if plus && github.event_name == 'workflow_dispatch', so a push apply (the Decision 77 hard-block path) never runs
      the gate (this file is outside reconcile_reachability's token subset); running the gate from the checkout; review
      gains the refused != 'true' conjunct; record_write gains dispatch-refused from the gate. refused stays exactly
      ${{ steps.precond.outputs.refused }} (pinned by tests/test_gated_apply_drift_guard.py). gated-apply has no LLM
      step. Relief (409 of 409; measured at build, never a raise): gated-apply's verify_fresh_plan_sha256 body becomes
      one call of scripts/ci/verify_plan_sha256.py, id, if: and env unchanged (about 7 lines saved against 5 added).
      artifact_sha and precond are pinned (test_validate_masked_errexit_steps.py, topology invariant vi) and are never
      moved, so there is no second relief: if the file is still over, STOP to the planning thread.
  - file: .github/workflows/subagent-review-smoke.yml
    action: Modify
    purpose: >-
      Step persona_gate, name "Persona dispatch gate (Decision 205 cl.1)", before run-smoke, run as python3
      scripts/ci/persona_dispatch_gate.py (the job has no .venv); run-smoke gains the conjunct. Not in T4.2 c10's named set, but a live
      maintainer-only dispatch path its header asserts and nothing enforces (Q8 of the consult).
  - file: .github/actions/write-convergence-record/action.yml
    action: Modify
    purpose: >-
      New input dispatch-refused (default "false"). The existing step (positional #0, body at its R3 ceiling of 97)
      gains only if: inputs.dispatch-refused != 'true' and its body is untouched; a new step after it, id
      dispatch_refused, if: inputs.dispatch-refused == 'true', shell bash, runs one echo of "Dispatch refused by the
      persona dispatch gate (Decision 205 cl.1); NOT overwriting the convergence record." The existing refused input
      and its description are unchanged.
  - file: tests/test_convergence_dispatch_refused.py
    action: Create
    purpose: >-
      Parses the action: the dispatch-refused input exists with default "false"; step #0's if is exactly
      inputs.dispatch-refused != 'true'; the dispatch_refused step is if-gated on "true" and contains no aws call. Then
      drives step #0's body under the composite bash argv with an aws stub: with dispatch-refused false, apply skipped
      with no other skip still latches red. Red before: the input and the step are absent. (Body #0's byte identity is
      a one-time VP 8 diff, never a standing pin.)
  - file: scripts/checks/ci_guards/_persona_llm_signatures.py
    action: Create
    purpose: >-
      The one LLM-step detector (T4.26 c3 can re-point the claude -p guards onto it). A parsed step is an LLM step
      when it (a) names, as an env key or a secrets.<NAME> reference, the variable of a
      docs/contracts/project-configuration.yaml row with kind secret and applies_when.port run_persona; (b) has a
      comment-stripped run body that invokes claude with -p or --print, scripts/ci/claude_p_retry.sh, or the
      run_persona entrypoint; or (c) uses anthropics/claude-code-action, or a local composite action or reusable
      workflow (one hop, ./ and ./.dispatch-tooling/ prefixes) one of whose steps matches (a) or (b). Installing or
      probing the CLI (command -v claude, claude --version, an npm install) is not an LLM step: no prompt runs and no
      credential is read (ci-rca.yml's "Install Claude Code CLI" step). Plus the compute-plane start detector, with the same one-hop resolution as (c): a run body invoking aws ecs
      run-task or the persona_compute_host port, or a launch argument to persona_compute_host or the run_persona
      entrypoint that names a persona id whose executor-personas.yaml index row has kind compute_plane (a persona id
      mentioned only as data is not a start).
  - file: tests/checks/ci_guards/test__persona_llm_signatures.py
    action: Create
    purpose: >-
      Each signature matched and not matched; a name mentioned only in a comment is not a match (the ghas-probe.yml
      shape); a CLI install and version probe body is not a match; each compute-plane signature, and the kind branch
      over both the live index (implement_agent and plan_agent rows, #1977) and an injected one; and, on the live tree,
      every step scripts/check_workflow_agent_safety.py flags is also an LLM step here (the two detectors cannot drift
      apart unnoticed before T4.26 c3). The kind branch
      matches the persona id as a whole word, never the registry_key (plan_agent's is the ordinary word planning).
  - file: scripts/checks/ci_guards/validate_persona_trigger_policy.py
    action: Create
    purpose: >-
      @registry.register("validate_persona_trigger_policy"). Over every .github/workflows/*.yml (glob, never a
      filename list; claude.yml exempt by name with its Decision 184 cl.4 reason): an LLM workflow's triggers must be
      in {pull_request, push, workflow_run, workflow_dispatch}; a workflow_dispatch LLM workflow must gate every LLM
      step, by an allowlist: the LLM step's if: has no || and no status function other than success() (no always(),
      failure(), cancelled() or !cancelled()); it has a top-level && term steps.<id>.outputs.refused != 'true' with
      <id> starting persona_gate; an earlier step in the same job has that id, runs the gate script and sets no
      continue-on-error; and the gate step's if: equals the LLM step's if: less the refused term, optionally plus
      && github.event_name == 'workflow_dispatch' (compared as sets of top-level && terms, order-insensitive; no evaluator). workflow_run, per named
      upstream U (resolved by name: across .github/workflows/*.yml; an unresolved name is refused): when the LLM job is
      failure-gated, U is admitted if U carries no LLM signature (a deterministic run's failure) or U qualifies
      itself; when it is not, U qualifies itself only if all of U's triggers are push, pull_request, or workflow_run
      whose own upstreams qualify. An LLM-bearing U qualifies itself when it passes every rule of this check (cycles
      refused). "Failure-gated" is read syntactically from the job's or the step's if:, never evaluated: split on
      top-level || (parentheses and quotes respected, the expression wrapper and each disjunct's enclosing parentheses
      stripped); every disjunct is either
      exactly github.event_name == 'workflow_dispatch' (the dispatch path, which the gate rule covers) or has
      github.event.workflow_run.conclusion == 'failure' as a top-level && conjunct (ci-rca.yml's pinned job if). An if
      is also failure-gated when one of its own top-level && conjuncts, enclosing parentheses stripped, is (an && only
      narrows), so a leading guard conjunct such as PLAN-scheduled-workflow-dispatch's bot refusal G composes. Refuses checks: write or write-all (top or job level) on any
      pull_request-triggered workflow, and any workflow that starts a compute-plane persona. examined(n,
      unit="workflows"); each failure names the workflow and branch. Past 500 SLOC it decomposes into a facade package
      (Decision 128), never a raise.
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      One Entry: validate_persona_trigger_policy, pre=True, pre_globs (.github/workflows/**, .github/actions/**,
      docs/contracts/project-configuration.yaml, docs/contracts/executor-personas.yaml, the two new modules,
      scripts/checks/_common.py, scripts/checks/registry.py), full_segment full_after_lint.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Companion row: function_to_category validate_persona_trigger_policy: environment (as its siblings). Relief (497
      of the config class 500; other unbuilt plans add rows; measured at build, never a raise): only while over 500,
      rewrite one block-style workflows: entry as a one-line flow mapping (as telemetry-arrival is), parsed value
      unchanged, each saving four lines.
  - file: scripts/ci_rca/designed_refusal.py
    action: Modify
    purpose: >-
      A refused dispatch must not mint a ci_rca rec: the terraform-apply-sandbox run it fails is watched, and a Critical
      rec there would gate overlapping work (Decision 226). Exports PERSONA_GATE_STEP_PREFIX = "Persona dispatch gate"
      and adds a step-granular designed refusal for any watched slug, with a new --failed-log argument defaulting to
      /tmp/ci-rca-failed.log (written before the designed-refusal step), so ci-rca's existing command is unchanged and
      an older checkout simply lacks the new skip and files (fail-closed): skip=true also when every failing job's (conclusion failure or, while it is still in progress, a failed step) failed
      steps are exactly one step whose name starts with the prefix AND the failed log contains
      "PERSONA_DISPATCH_REFUSED:". Fail-closed as today: no marker (a gate crash prints GATE_ERROR instead), an
      unreadable log, a job with no steps array, any other failed step, or an empty failing set gives skip=false. The
      refusal self-documents (the marker in the run's step summary and log).
  - file: tests/test_ci_rca_designed_refusal.py
    action: Modify
    purpose: >-
      Adds cases (existing assertions unchanged): a sole failing gate step with the marker in the log skips; the same
      without the marker (GATE_ERROR), with an unreadable log, the gate step plus another failed step, a missing steps
      array, and a differently named failed step do not; and the live ci-rca.yml designed-refusal command passes only
      arguments main's designed_refusal.py already declares (old-checkout compatibility). The graduated shard
      ci-rca-designed-refusal-fail-closed (its whole-file node) is kept unchanged.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      R3 registrations at their measured counts: every new persona_gate* inline body (ci-rca, reconcile x2, the sandbox
      workflow, the smoke workflow) under r3_workflows and the writer's dispatch_refused step under r3; the extracted
      relief bodies ratchet down to their new counts. No marker, no raise; .github/actions/write-convergence-record::#0
      stays 97.
  - file: tests/ci/test_persona_gate_wiring.py
    action: Create
    purpose: >-
      Live-tree wiring, workflows found by content: in every job holding a persona_gate* step, each
      write-convergence-record call passes dispatch-refused naming every gate step's refused output; each review
      step's if is its gate's if plus the refused conjunct, less the gate's optional workflow_dispatch event conjunct
      (compared as sets of top-level && terms, order-insensitive);
      every persona_gate* step's name starts with designed_refusal.PERSONA_GATE_STEP_PREFIX (imported, not retyped);
      the one gate invoked with --own-failure also passes
      --run-json, --jobs-json and --watched-from naming its own workflow file, and that workflow's job if still carries rca's
      dispatch-or-failure expression, whole or as one top-level && conjunct (never a literal of the whole if).
  - file: tests/checks/ci_guards/test_validate_persona_trigger_policy.py
    action: Create
    purpose: >-
      Red on one fixture per refused branch, green on the green fixtures, green on the live tree with examined >= 1
      (test_live_tree_is_green), and a live-tree floor (test_live_floor_review_workflows_are_gated): every dispatchable workflow using subagent-plan-review is gated and at least one exists
      (no filename named).
  - file: tests/checks/ci_guards/fixtures/persona_trigger_policy/
    action: Create
    purpose: >-
      Synthetic workflows. Red: schedule, repository_dispatch, pull_request_target, issue_comment, workflow_call (refused
      conservatively until a reusable persona workflow is designed; its caller's trigger would then be checked one hop
      up) and
      an ungated workflow_dispatch on an LLM workflow; a gate conjunct behind ||; a gated step with no gate step; an
      LLM step if: with !cancelled(); a continue-on-error gate; a gate in another job; a gate whose if: differs from
      its LLM step's (github.event_name == 'push'); a
      workflow_run on a schedule-only LLM upstream; a failure-gated workflow_run on an LLM upstream that does not
      qualify; a non-failure-gated workflow_run on a dispatchable deterministic upstream; an unresolved upstream; a
      workflow_run cycle; checks: write top-level, job-level and write-all on pull_request; an ecs run-task start; a
      persona_compute_host start; a start naming a compute_plane persona id; a local composite action whose step runs
      aws ecs run-task, used by a workflow step (one hop). Green: a comment-only
      secret mention; a CLI install and version probe; a step naming plan_agent only as data; claude.yml; a gated dispatch; a push LLM workflow; a
      failure-gated workflow_run on a deterministic schedule upstream; a ci-rca-shaped failure-gated job (dispatch ||
      failure) over mixed upstreams: deterministic schedule ones and a gated LLM one; the same job with a leading
      (github.event_name != 'workflow_dispatch' || github.actor != '<bot>') && conjunct.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Bookkeeping: T4.2 c10 met (closes_criteria); T4.2 status not_started -> in_progress (a strict subset of its criteria
      met, per tier-item-lifecycle.yaml's bookkeeping walk); progress_note bullets on T4.2 and T4.32; T4.32 files_in_scope gains
      the new script and check paths. T4.2's note records the one departure from c10's wording, as signed off: an App
      dispatch is admitted on the no-op and guard-ROUTE paths but refused where it would reach a review gating an
      automatic apply (rec-5100 owns routing it to approval). No intent, hint or criterion text edit.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Two dated Update annotations, sidecar-bound (Decision 177 form, Decision 246 approval): Decision 229's Coverage
      residual is now this check; Decision 158's route set and the refused dispatch (with Decision 154 point 5's
      account and Decision 183 cl.1's totality per admitted dispatcher).
bundled_recommendations: []
followon_recs: ["rec-5100", "rec-5101"]
closes_criteria: ["T4.2:c10"]
infrastructure_dependencies:
  - >-
    None. No .tf file is in scope. compute_affected_artifacts(<scope>) names only data-pipeline, through
    docs/ROADMAP-PLATFORM.yaml, which carries bookkeeping only (PLAN-llm-client-litellm-transport's reasoned
    disposition: the deploy gate's watched paths exclude the roadmap and its one runtime reader runs only from the
    disabled scheduled-agent dispatcher): no build or deploy step.
acceptance_criteria:
  - The gate admits only a maintainer user dispatch or ci-rca's own-failure bot dispatch, and refuses everything else fail-closed (VP 3).
  - A refused dispatch changes no convergence record status and mints no ci_rca rec (VP 4, VP 6).
  - validate_persona_trigger_policy is registered, red on each fixture, green on the live tree (VP 5, VP 6).
  - Every live LLM workflow_dispatch path carries the gate, wired to its record write; the reconcile reachability and topology guards stay green (VP 6, VP 7).
  - "Live read-back after merge: a maintainer dispatch of subagent-review-smoke is admitted (VP 11)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: this plan and its sidecar are on main and the branch is current."
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-persona-trigger-policy.yaml && git
      cat-file -e origin/main:docs/plans/approved/persona-trigger-policy.yaml && git merge-base --is-ancestor origin/main
      HEAD && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: A missing plan or sidecar means this plan's PR has not merged -- stop. A failed ancestry test means merge origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The two DECISIONS.md annotations are exactly main plus the approved sidecar, at its recorded wording digest.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-trigger-policy --base origin/main --expect 7363d5e583840cb969793409fc59d755b6c25b73af47a2d18a5ad97d7f0176ce
    expected: Exit 0, printing APPROVED-TEXT OK. Red before the blocks are placed.
    fix_if: A word mismatch means a placed block drifted -- restore its after text; never edit the sidecar. A digest mismatch is a STOP to the planning thread.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A base-relative one-time binding; validate_merge_step enforces it on the build PR's fast tier.
  - step: 3
    phase: pre-deploy
    action: >-
      The gate's truth table: non-dispatch events pass; a User dispatch is admitted; a Bot sender, a [bot] re-runner,
      and every malformed or non-qualifying own-failure case are refused fail-closed; ci-rca's own-failure shapes
      (completed failed run, in-progress run with a failed job) are admitted.
    command: bin/venv-python -m pytest tests/ci/test_persona_dispatch_gate.py -q
    expected: Exit 0. Red before (the module and the test do not exist).
    fix_if: Fix the gate; never relax a refusal case.
    hermetic: true
    expected_literals:
      - passed
    graduation: graduate
    graduation_check_id: persona-dispatch-gate
  - step: 4
    phase: pre-deploy
    action: A refused dispatch writes no convergence record for any apply outcome; dispatch-refused false keeps every existing branch.
    command: >-
      bin/venv-python -m pytest tests/test_convergence_dispatch_refused.py tests/test_gated_apply_drift_guard.py -q
    expected: Exit 0. Red before (the input and the dispatch_refused step do not exist).
    fix_if: Fix the writer; the existing refused input and its pinned wiring stay as they are.
    hermetic: true
    expected_literals:
      - passed
    graduation: graduate
    graduation_check_id: convergence-dispatch-refused
  - step: 5
    phase: pre-deploy
    action: >-
      The check: red on each refused-branch fixture, green on the green fixtures and on the live tree (examined >= 1),
      the live floor holds, and each signature matches and a comment-only mention does not.
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test_validate_persona_trigger_policy.py
      tests/checks/ci_guards/test__persona_llm_signatures.py -q
    expected: Exit 0. Red before (modules, tests and fixtures do not exist).
    fix_if: Fix the check or a live workflow's gate wiring; never add a filename exemption beyond claude.yml.
    hermetic: true
    expected_literals:
      - passed
    graduation: graduate
    graduation_check_id: persona-trigger-policy
  - step: 6
    phase: pre-deploy
    action: >-
      Registered and green through the registry, its taxonomy row and manifest Entry valid; the gates wired to their
      record writes and ci-rca's own-failure arguments; a sole failing gate step is a designed refusal; the relief
      delegates tested.
    command: >-
      bin/venv-python -c "from scripts.checks.ci_guards.validate_persona_trigger_policy import
      validate_persona_trigger_policy as a; from scripts.checks.ci_guards.validate_ci_rca_taxonomy import
      validate_ci_rca_taxonomy as b; f=[]; [x(f) for x in (a,b)]; print('POLICY_FAILS', len(f)); assert not f, f" &&
      bin/venv-python -m pytest tests/ci/test_persona_gate_wiring.py tests/test_ci_rca_designed_refusal.py
      tests/ci/test_verify_plan_sha256.py tests/checks/ci_guards/test__manifest.py
      tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py -q && (test ! -e scripts/ci/originating_pr_sha.py ||
      bin/venv-python -m pytest tests/ci/test_originating_pr_sha.py -q)
    expected: POLICY_FAILS 0, then the suites exit 0. Red before (the wiring test does not exist; a gate-step failure is not a designed refusal).
    fix_if: A taxonomy failure means the companion row is missing or misnamed; a delegate failure means its text drifted from the inline body it replaced.
    hermetic: true
    expected_literals:
      - POLICY_FAILS 0
    graduation: waive
    graduation_waiver_reason: >-
      Replays checks registered in both tiers; VP 5 graduates the policy check itself. The new wiring suite and the
      designed-refusal cases are whole-file selections of files this plan creates or modifies, always in the
      affected-test selection when a workflow, the writer or designed_refusal.py changes.
  - step: 7
    phase: pre-deploy
    action: >-
      Wiring regressions stay green with no pinned expectation edited: reconcile reachability (the gate if: strings are
      evaluator-safe), the dispatch-gated-apply topology, the recovery-workflow topology, the apply and terraform
      shapes, masked errexit, ci-rca's pinned job if, and the reviewer action.
    command: >-
      bin/venv-python -m pytest tests/test_reconcile_reachability.py tests/verify_ci_workflow
      tests/checks/ci_guards/test_validate_dispatch_gated_apply_topology.py
      tests/checks/ci_guards/test_validate_masked_errexit_steps.py tests/test_convergence_infra_error_acceptance.py -q &&
      git diff --quiet origin/main -- tests/test_reconcile_reachability.py tests/verify_ci_workflow
      tests/test_gated_apply_drift_guard.py tests/checks/ci_guards/test_validate_dispatch_gated_apply_topology.py
      tests/checks/ci_guards/test_validate_masked_errexit_steps.py && echo PINS_UNCHANGED
    expected: Exit 0, then PINS_UNCHANGED.
    fix_if: A red pinned test means the wiring broke an invariant -- fix the workflow edit, never the test (Decision 235). A changed pin file is a STOP.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Existing registered suites; the diff guard is a one-time build check.
  - step: 8
    phase: pre-deploy
    action: >-
      Size limits hold with no raise: files (reconcile.yml and the sandbox workflow are at budget on main) and inline
      shell bodies (every new body registered; the writer's #0 body unchanged at 97).
    command: >-
      bin/venv-python -c "from scripts.checks.sloc.sloc_limits import validate_sloc_limits as a; from
      scripts.checks.structural.size_limits import validate_structural_size_limits as b; from
      scripts.checks.structural.budget_raises import validate_structural_size_budget_raises as c; from
      scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as d;
      f=[]; [x(f) for x in (a,b,c,d)]; print('SIZE_FAILS', len(f)); assert not f, f" && git diff --quiet origin/main --
      config/sloc_budgets.yaml config/structural_size_budgets.yaml && ! git diff origin/main --
      config/composite_action_body_baseline.yaml | grep -q raise-approved && echo NO_RAISE && bin/venv-python -c "import
      subprocess,yaml; a='.github/actions/write-convergence-record/action.yml'; o=yaml.safe_load(subprocess.run(['git',
      'show','origin/main:'+a],capture_output=True,text=True,check=True).stdout)['runs']['steps'][0]['run'];
      n=yaml.safe_load(open(a))['runs']['steps'][0]['run']; assert o==n,'writer body #0 changed'; print('BODY0_UNCHANGED')"
    expected: SIZE_FAILS 0, then NO_RAISE, then BODY0_UNCHANGED (a one-time build check, never graduated).
    fix_if: Over budget -- apply the next relief named in the workflow's scope row; past the last one, STOP to the planning thread (never raise).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Replays registered checks; the no-raise diff is a one-time build check.
  - step: 9
    phase: pre-deploy
    action: Roadmap bookkeeping valid (T4.2 c10 met, T4.32 files_in_scope) and the red-main overlap clear (Decision 226).
    command: >-
      bin/venv-python -m scripts.roadmap.platform_roadmap docs/ROADMAP-PLATFORM.yaml && bin/venv-python -m
      scripts.ci_rca.red_overlap --plan docs/plans/PLAN-persona-trigger-policy.yaml
    expected: The roadmap validates; no open ci_rca rec overlaps the scope.
    fix_if: A roadmap error names the field; an overlap is a STOP -- tell the coordinator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: red_overlap is time-dependent (it reads the open ci_rca recs of the day); the roadmap validator is registered in both tiers.
  - step: 10
    phase: pre-deploy
    action: Fast tier, then the full tier before handoff, started in the background from the top-level session.
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The fast tier exits 0 and the verify-head read reports a completed full run for HEAD with exit 0.
    fix_if: In-scope failures are fixed on the branch; out-of-scope failures become recs (Decisions 59, 55). A timeout is blocked.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      Live read-back: a maintainer dispatch of the reviewer smoke workflow on main is admitted by the gate and the
      reviewer runs. From a session (the operator's own token): mcp__github__actions_run_trigger (run_workflow,
      subagent-review-smoke.yml, ref main); then list_workflow_runs to find that run, list_workflow_jobs to
      $SMOKE_JOBS_JSON once completed, and get_job_logs for the smoke job to $SMOKE_LOG_FILE.
    command: >-
      test -s "$SMOKE_JOBS_JSON" && test -s "$SMOKE_LOG_FILE" && grep -q "PERSONA_DISPATCH_ADMITTED: user" "$SMOKE_LOG_FILE"
      && bin/venv-python -c "import json,os;j=json.load(open(os.environ['SMOKE_JOBS_JSON']));
      jobs=j.get('jobs') if isinstance(j,dict) else j;print('JOBS',[(x['name'],x.get('conclusion')) for x in jobs]);
      print('SMOKE_ADMITTED_OK')"
    expected: >-
      SMOKE_ADMITTED_OK once the admission marker is found in the smoke job's log; the JOBS line is reported (the
      reviewer's own result is the smoke's evidence, not the gate's).
    fix_if: >-
      No marker -- the gate did not run (check the step order). A refusal on the operator's dispatch -- the User branch
      is wrong: revert the gate conjuncts by a forward PR and STOP to the planning thread. A reviewer failure after
      admission is the smoke's own: report it and RCA it (Decision 55), never re-run to green.
    hermetic: false
    graduation: not-applicable
