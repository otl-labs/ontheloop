constraints:
  - >-
    Place each sidecar block word for word (only {{DATE}} is filled, with the build date); never edit the sidecar
    (Decision 246). No other DECISIONS.md edit.
  - >-
    Never edit a pinned assertion: tests/test_reconcile_reachability.py, tests/verify_ci_workflow/**,
    tests/test_gated_apply_drift_guard.py, test_validate_dispatch_gated_apply_topology.py,
    test_validate_masked_errexit_steps.py and tests/verify_ci_workflow/test_ci_rca_and_canary.py's job if. A change any
    of them would need is a STOP to the planning thread (Decision 235).
  - >-
    No filename list: the check and tests find workflows by glob and by what they contain; the only name in code is
    claude.yml's exemption (Decision 184 cl.4). The sandbox workflow may be renamed by another project (rec-5035).
  - >-
    The gate's module-scope imports are stdlib only; yaml loads only on the --own-failure path (ci-rca, bin/venv-python).
    Its refusal marker is printed only on a deliberate refusal, never from an exception handler.
  - >-
    Fail closed: an unreadable event, run or jobs file is a refusal. The gate never evaluates a GitHub expression; the
    check recognises the gate by its fixed conjunct and the earlier gate step only (no second evaluator).
  - >-
    The writer's existing refused input, its description and the sandbox's refused wiring stay byte-identical.
  - >-
    No new secret, variable or configuration key (no project-configuration.yaml row). No Terraform, no Lambda package.
  - >-
    Public repository (Decision 101): no account id, ARN or hostname in any fixture, log marker or PR text.
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
