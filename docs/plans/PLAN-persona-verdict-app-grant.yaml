schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-app-grant"
intent: >-
  Plan 4 of the verdict persona egress series (T4.32; T4.2 c9's verdict identity): give the verdict GitHub App
  (Decision 271) a key home and one reader that no model-running job can reach. The operator creates the App (Checks
  write and Metadata read only, no webhook, organisation-owned, this repository only) and puts its private key in the
  SSM SecureString /secret/agent-platform-persona-verdict-app-key (Decision 237). A new role,
  agent-platform-github-ci-persona-verdict-app, trusted only by main's persona-verdict.yml in a new main-only,
  reviewer-free Environment persona-verdict-app, reads exactly that key by literal ARN; the persona-verdict role is
  unchanged (Decision 263 cl.2). A Deny in the CI apply boundary refuses the read to every other carrier (the
  operator's card, 2026-11-18), outside the agent merge loop. A new Decision records the custody as an accepted residual
  against Decision 143 cl.1 in the Decision 267 cl.5 form and re-anchors Decision 270 cl.5's boundary trigger; a
  project-configuration secret row and inventory row GH-16 record the rest. Serves NS.9: the trust root that lets
  persona checks gate agent merges gets a single reader outside every model-running job.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-app-grant.yaml
phase: >-
  T4.32 (persona foundation) and T4.2 c9 (verdict identity). Closes no criterion: the verdict identity is met when
  PLAN-persona-verdict-app-post posts the persona checks through the App.
cites: [dec:92, dec:98, dec:143, dec:144, dec:167, dec:172, dec:177, dec:202, dec:224, dec:237, dec:238, dec:246, dec:248, dec:252, dec:256, dec:257, dec:258, dec:263, dec:267, dec:270, dec:271]
scope:
  - file: terraform/bootstrap/github_ci_apply_reads.tf
    action: Modify
    purpose: >-
      PR 1. In the IAMRolesRead statement's Resource list add
      "arn:aws:iam::${var.account_id}:role/agent-platform-github-ci-persona-verdict-app" directly after the
      agent-platform-github-ci-persona-verdict entry, under a two-line comment in the existing pre-stage form naming
      PLAN-persona-verdict-app-grant (the gated apply that creates the role reads it back, so this applies first).
  - file: terraform/bootstrap/github_ci_apply_boundary.tf
    action: Modify
    purpose: >-
      PR 1, the lock (Decision N cl.4). Append one statement after DenyTelemetryContentChange, under a two-line comment
      naming Decision N: Sid "DenyVerdictAppKeyRead", Effect "Deny", Action "ssm:GetParameter*", Resource
      ["arn:aws:ssm:${var.aws_region}:*:parameter/secret/agent-platform-persona-verdict-app-key",
      "arn:aws:ssm:${var.aws_region}:*:parameter/", "arn:aws:ssm:${var.aws_region}:*:parameter/secret",
      "arn:aws:ssm:${var.aws_region}:*:parameter/secret/"], Condition { ArnNotLike = { "aws:PrincipalArn" =
      "arn:aws:iam::*:role/agent-platform-github-ci-persona-verdict-app" } }. The account is * (the boundary's
      byte-saving form, as DenyBoundedWriteOnProtectedRoles). No other statement changes.
  - file: tests/checks/iam_tf/test_telemetry_content_reader_iam.py
    action: Modify
    purpose: >-
      PR 1. _BOUNDARY_PROD_BYTES becomes the boundary's minified PROD size with the new Deny, as the test's own
      _minified(_boundary(text)) measures it on the branch (about 5,838 B; the build records the figure in the PR body
      and in VP step 7's expected BOUNDARY_BYTES). Only that constant and the test name that embeds it
      (test_boundary_renders_5427_bytes_prod_and_carries_the_lock -> ..._renders_<new>_bytes_...) change. Feedback
      Loop's file (#2135): the operator allowed this edit on 2026-11-18 or the build asks first.
  - file: tests/checks/iam_tf/test_persona_verdict_app_role.py
    action: Create
    purpose: >-
      The standing guard, pure functions of HCL and workflow text, each with a red case on synthetic text. CREATED BY
      WHICHEVER OF PR 1 AND PR 2 BUILDS FIRST (the module docstring names the plan and its three PRs), extended by the
      other and by PR 3 (next rows). PR 1 cases: the IAMRolesRead pre-stage names the role ARN (red without it); the
      boundary's DenyVerdictAppKeyRead exists once, is Deny, its Action is exactly ["ssm:GetParameter*"], its Resource
      set is exactly the four ARNs of the boundary row, and its Condition is exactly ArnNotLike on aws:PrincipalArn
      naming the role (red on: a missing resource, a second principal, StringNotLike, the Sid absent).
  - file: tests/checks/iam_tf/test_persona_verdict_app_role.py
    action: Modify
    purpose: >-
      PR 2 cases (if PR 1 has not built, PR 2 creates the file): the persona-verdict-app Environment parsed from
      terraform/github/*.tf with validate_trusted_plan_environment's _blocks, as test_persona_verdict_role.py does:
      can_admins_bypass false, no reviewers block, no wait_timer, custom_branch_policies true and protected_branches
      false, prevent_destroy, and exactly one deployment policy whose branch_pattern is "main"; no
      github_actions_environment_secret or _variable names it; the workflow fence over .github/workflows/*.yml: a job
      may name persona-verdict-app only when it is the post job of persona-verdict.yml, never by expression, and no job
      outside that one assumes the role (red on: another job of persona-verdict.yml, another workflow, an expression).
      PR 3 cases: the role file's trust is one jsonencode statement with operators exactly ["StringEquals"] and keys
      exactly aud, sub and job_workflow_ref, sub the persona-verdict-app Environment subject in each repository form of
      local.github_repos, job_workflow_ref persona-verdict.yml at refs/heads/main; the boundary is the CI apply boundary;
      one inline policy, no attachment; its document is exactly one statement, Allow ssm:GetParameter on the key's
      literal ARN; the key's readers across terraform/personal and terraform/bootstrap (the Allow statements whose
      literal resources end in the key's path or match it by pattern, validate_secret_parameter_grants' parser) are
      exactly this role's statement; the role ARN is in oidc.tf's IAMCIRolesRead. Red cases for each on synthetic text.
  - file: terraform/github/environments.tf
    action: Modify
    purpose: >-
      PR 2. Append resource "github_repository_environment" "persona_verdict_app" (environment "persona-verdict-app",
      can_admins_bypass false, no reviewers, deployment_branch_policy { protected_branches = false,
      custom_branch_policies = true }, lifecycle { prevent_destroy = true }) and
      "github_repository_environment_deployment_policy" "persona_verdict_app_main" (branch_pattern "main"), with a
      header in the persona_verdict block's style: the post job's Environment for the verdict App key's role (Decision
      N), no reviewer because verdicts post unattended, safety from the main-only policy and the role's job_workflow_ref
      binding, never a secret or variable, created by the first approved terraform-github-apply.yml dispatch naming both
      addresses in gate_change.
  - file: tests/checks/iam_tf/test_terraform_github_import_blocks.py
    action: Modify
    purpose: >-
      PR 2. EXEMPT gains the two new addresses with a new reason constant _PERSONA_VERDICT_APP_REASON in the
      _CONTENT_DEPLOY_REASON form naming PLAN-persona-verdict-app-grant VP step 10. Graduated shard
      terraform-github-import-blocks kept: its node id and guard target do not change.
  - file: terraform/personal/oidc_persona_verdict_app_role.tf
    action: Create
    purpose: >-
      PR 3. Header in oidc_persona_verdict_role.tf's style: what the role is for (persona-verdict.yml's post job reads
      the verdict App's private key; Decision N), why dedicated (no model-running job may reach the key; the operator's
      2026-11-17 ruling), the trust shape, that the boundary's DenyVerdictAppKeyRead names this role, and that the
      CREATE routes to tf-gated-apply and later trust edits are admin split-applies (Decision 223 cl.4, 238 cl.6).
      locals { persona_verdict_app_environment = "persona-verdict-app" }. aws_iam_role.github_ci_persona_verdict_app:
      name agent-platform-github-ci-persona-verdict-app, the apply boundary, one trust statement identical in shape to
      the persona-verdict role's with the new Environment. data aws_iam_policy_document.github_ci_persona_verdict_app:
      one statement, sid VerdictAppKeyParameterRead, ssm:GetParameter on
      "arn:aws:ssm:${var.aws_region}:${var.account_id}:parameter/secret/agent-platform-persona-verdict-app-key".
      aws_iam_role_policy.github_ci_persona_verdict_app with the minified-size precondition the persona-verdict role's
      policy carries. No count, for_each, ternary or file read (Decision 238 cl.4 screen).
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-
      PR 3. IAMCIRolesRead's resources gain the role ARN after the persona-verdict entry, with one comment line naming
      oidc_persona_verdict_app_role.tf (validate_ci_refresh_read_coverage enumerates roles by name).
  - file: scripts/checks/iam_tf/validate_policy_document_plan_time_refs.py
    action: Modify
    purpose: >-
      PR 3. REQUIRED_DOCUMENTS gains "github_ci_persona_verdict_app" after "github_ci_persona_verdict".
  - file: tests/checks/iam_tf/test_validate_policy_document_plan_time_refs.py
    action: Modify
    purpose: >-
      PR 3. One assertion beside the persona-verdict one: "github_ci_persona_verdict_app" in REQUIRED_DOCUMENTS (red
      before). Graduated shard policy-document-plan-time-refs kept: its node id and guard target do not change.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      PR 1. Sidecar blocks decision-entry, decision-258-amended-by and decision-270-amended-by, word for word: {{N}} = the highest Decision number
      across docs/DECISIONS.md and docs/DECISIONS_ARCHIVE.md plus one after rebasing on origin/main, {{DATE}} = the
      build's UTC date. docs/decisions-index.json is regenerated by its generator.
  - file: docs/contracts/project-configuration.yaml
    action: Modify
    purpose: >-
      PR 1. Sidecar blocks pc-amendment-log (a new amendment_log entry) and pc-verdict-app-key-row, word for word (the
      ports.verdict_plane.github_actions.verdict_app.private_key secret row, accepted, owning_item dec-N).
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: >-
      PR 1. Sidecar blocks inventory-amendment-log (a new amendment_log entry), inventory-gh-16 and inventory-gh-16-ledger, word for word; the
      ledger's evidence is VP step 2's read-back, so PR 1 commits them only after VP step 2.
bundled_recommendations: []
followon_recs: []
closes_criteria: []
infrastructure_dependencies:
  - >-
    PR 1 (terraform/bootstrap, admin-only root): the boundary is in Decision 257 cl.3's protected set, so the merge
    push's terraform-bootstrap-apply preview ends CLOUDSHELL_REQUIRED (expected) and the operator applies the whole
    plan from CloudShell, never split and never -target (deploy-paths.yaml admin_out_of_band.bootstrap_ci_apply).
    Pre-merge: the operator's ENVIRONMENT CHECK and screened read-only plan at the CI-green head (VP 7-8). Post-merge:
    the operator's apply and IAM simulation (VP 9). It applies BEFORE PR 3 merges, or the gated apply's own
    iam:GetRole after the create, and every later refresh, fail closed. One merged-unapplied bootstrap change at a time.
  - >-
    PR 2 (terraform/github): created by a terraform-github-apply.yml dispatch from main whose gate_change names
    github_repository_environment.persona_verdict_app and github_repository_environment_deployment_policy.persona_verdict_app_main,
    after one operator approval in Actions (Decision 248; VP 10). Needed before app-post's post job names it, not
    before PR 3.
  - >-
    Out of band (Decision 237 cl.3): the operator creates the App in the browser before PR 1 commits the inventory
    ledger (VP 2) and puts its private key into the SSM parameter from CloudShell after PR 1 is applied (VP 11), so
    the Deny is live before any key exists. Terraform never holds the value.
  - >-
    PR 3 (terraform/personal): the role CREATE routes to tf-gated-apply (guard exit 2, Decision 144 cl.4); the operator
    approves the gated-apply job in Actions (VP 13); a CloudShell read-back with simulation follows (VP 14). SIT gets
    the same role with no key (Decision 252).
  - >-
    Lambda: none. compute_affected_artifacts over this scope names no Lambda-packaged file.
acceptance_criteria:
  - The three governed files carry exactly the sidecar's seven blocks (approved_text verify exits 0 on PR 1's head).
  - tests/checks/iam_tf/test_persona_verdict_app_role.py passes on each PR head and each red case fails its predicate.
  - The boundary renders under 6,144 B in PROD and SIT, and test_telemetry_content_reader_iam.py pins the new PROD size.
  - "After PR 1's apply: simulation shows github-ci-branch, github-ci-persona-verdict and PlatformDev explicitly denied ssm:GetParameter on the key."
  - "After PR 3's apply: the role exists with one trust statement and one inline policy; simulation allows it the key and denies it both inference keys."
  - The persona-verdict-app Environment exists, main-only, with no reviewers and no admin bypass.
  - The App exists under the organisation, installed on this repository only, Checks write and Metadata read only, no webhook; the key parameter is a SecureString at version 1 or later.
  - The fast tier passes on each PR head and the full tier before each hand-off.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Precondition at each PR's build start: this plan and its sidecar are on main and the egress build has placed
      Decision 271's dated Update naming this plan (Decision N cites it). PR 3 also needs PR 1 applied (VP step 9's
      APPLY_DONE posted on PR 1).
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-persona-verdict-app-grant.yaml &&
      git cat-file -e origin/main:docs/plans/approved/persona-verdict-app-grant.yaml &&
      git show origin/main:docs/DECISIONS.md | awk '/^## Decision 271:/{f=1} f&&/^---$/{exit} f' | grep -q 'Update.*PLAN-persona-verdict-app-grant' &&
      echo PRECONDITION_OK
    expected: Prints the precondition marker.
    fix_if: Absent; the egress build has not merged, so wait for it (the coordinator tracks it); never place Decision N first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      OPERATOR STEP M1 and read-back, before PR 1 commits the inventory blocks (the session's GitHub proxy refuses the
      App pages, so the steps are his). The build asks him in these words and waits for his reply.
    command: >-
      echo 'ASK THE OPERATOR: "Please create the verdict GitHub App: in github.com, the organisation otl-labs, Settings,
      Developer settings, GitHub Apps, New GitHub App. Name it so it reads as the persona verdict App; homepage the
      repository URL; untick Webhook Active; Repository permissions: Checks Read and write, Metadata Read-only, nothing
      else; no account or organisation permissions; Where can this GitHub App be installed: Only on this account. Create
      it, then Install App on otl-labs, Only select repositories, ontheloop. Do not generate a private key yet. Then open
      the installation Configure page and reply with: the repository access line, the permission list as shown, and
      whether a webhook is active. Do not paste the App id, client id or any key in chat."'
    expected: The operator's reply shows repository access to ontheloop only, Checks read and write and Metadata read only, and no active webhook.
    fix_if: Any other permission, repository or an active webhook; the operator corrects it in the App settings and re-reads, before PR 1 commits.
    hermetic: false
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: The standing guard holds on the real tree and reddens on every synthetic breach (grows with each PR).
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_persona_verdict_app_role.py -q
    expected: All cases pass.
    expected_literals: [passed]
    fix_if: A real-tree case fails; fix the Terraform toward this plan's rows, never the predicate.
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-app-role
  - step: 4
    phase: pre-deploy
    action: >-
      The neighbouring guards hold with the new statement, Environment and role: the boundary byte pin and lock tests,
      the bootstrap CI role tests, the import-block accounting, the plan-time reference scan, the persona-verdict role
      guard (its key-reader and Environment cases must not move), the refresh-read coverage and the registered checks.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_content_reader_iam.py tests/checks/iam_tf/test_bootstrap_ci_roles.py
      tests/checks/iam_tf/test_terraform_github_import_blocks.py tests/checks/iam_tf/test_validate_policy_document_plan_time_refs.py
      tests/checks/iam_tf/test_persona_verdict_role.py tests/checks/iam_tf/validate_ci_refresh_read_coverage/ -q &&
      bin/venv-python -c "from scripts.checks.iam_tf.validate_secret_parameter_grants import validate_secret_parameter_grants as a; from scripts.checks.iam_tf.validate_policy_document_plan_time_refs import validate_policy_document_plan_time_refs as b; f=[]; a(f); b(f); assert not f, f; print('NEIGHBOURS_OK')"
    expected: All tests pass and the two registered checks report no finding.
    expected_literals: [passed]
    fix_if: A failure in scope is fixed; a byte-pin failure means the measured size moved, so re-measure and update the constant and the PR body figure; a failure in another project's test outside scope is a STOP to the plan owner.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Runs existing registered checks and other plans' graduated tests that the fast and full tiers already run on every
      PR; a second graduated copy adds no guard.
  - step: 5
    phase: pre-deploy
    action: Provider-free formatting of the touched roots (init, validate and plan are CI's and the gates' job, Decision 119).
    command: terraform fmt -check terraform/bootstrap && terraform fmt -check terraform/github && terraform fmt -check terraform/personal && echo FMT_OK
    expected: Prints the format marker.
    fix_if: Run terraform fmt on the touched root and re-check.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      PR 1 only. The build's tree holds exactly the sidecar's words with {{N}} and {{DATE}} filled, and the approval run
      the planning session dispatched (Decision 246) is approved; a changed word needs a new run before merge.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-app-grant --base origin/main
    expected: Prints the approved-text ok line.
    expected_literals: [APPROVED-TEXT OK]
    fix_if: A mismatch is fixed toward the sidecar; an anchor that no longer matches main exactly once, or a needed word change, is a STOP to the plan owner.
    hermetic: true
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      PR 1 ENVIRONMENT CHECK (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan), operator-run in AWS CloudShell
      in the PROD account as user/platform-breakglass, once PR 1 is CI green.
    command: >-
      ( printf 'caller-arn check: '; aws sts get-caller-identity --query Arn --output text 2> /dev/null | grep -q ':user/platform-breakglass$' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT )
    expected: caller-arn check, ADMIN_CHAIN_OK. The ARN itself is never printed.
    fix_if: ADMIN_CHAIN_ABSENT; the operator signs in as the break-glass user and re-runs; VP 8 waits.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: >-
      PR 1 PRE-MERGE GATE (ADMIN), operator-run in CloudShell after VP 7 at the PR's full CI-green head (the build fills
      PR_HEAD_SHA and the expected file list): PLAN-telemetry-content-reader-api-lock's VP 6 block verbatim except W and L
      named "pvag" and the screen's file list set to "terraform/bootstrap/github_ci_apply_boundary.tf
      terraform/bootstrap/github_ci_apply_reads.tf " (fetch, screen, verified terraform install, tfvars from SSM, init,
      a read-only plan, the changed addresses and the boundary's planned minified length). Names and counts only.
    command: >-
      bin/venv-python -c "import yaml; p=yaml.safe_load(open('docs/plans/PLAN-telemetry-content-reader-api-lock.yaml'));
      c=[v['command'] for v in p['verification_plan'] if v['step']==6][0].replace('/tcr','/pvag').replace('tcr-tf.err','pvag-tf.err');
      import re; c=re.sub(r'\[ \"\$F\" = \"[^\"]*\" \]', '[ \"\$F\" = \"terraform/bootstrap/github_ci_apply_boundary.tf terraform/bootstrap/github_ci_apply_reads.tf \" ]', c); print(c)"
    expected: >-
      The printed block, which the build posts on the PR for the operator to paste with PR_HEAD_SHA filled. His paste
      prints SCREEN_OK; HEAD_PLAN_EXIT 2; a Plan line of 0 to add, 2 to change, 0 to destroy; exactly the update lines
      for aws_iam_policy.github_ci_apply_boundary and aws_iam_policy.github_ci_apply_reads (plus any guard policy that
      embeds the read list, which the build names from the preview before posting); BOUNDARY_BYTES equal to the test
      pin; the sha. The build records the address list on the PR for VP 9.
    fix_if: SCREEN_REFUSED (main moved under terraform/bootstrap; rebase and re-post), a setup error (the operator reads $HOME/pvag-tf.err), or any address, action or size outside the expected; stop, do not merge, report to the plan owner.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      PR 1 OPERATOR APPLY, CloudShell in the PROD account, in the same sitting as the merge and after SIT's bootstrap
      apply where SIT's bootstrap root is live (Decision 252), at merge sha M: PLAN-telemetry-content-reader-api-lock's
      VP 7 block with W and L named "pvag" and its sim lines replaced by the six below, run with ARNs built in-shell and
      aws:PrincipalArn passed as context (the simulator leaves it unset, and a negated ArnNotLike over a missing key
      matches). The operator's paste is the direction for the apply (Decision 126 cl.1).
    command: >-
      KEY="arn:aws:ssm:$R:$A:parameter/secret/agent-platform-persona-verdict-app-key";
      sim "arn:aws:iam::$A:role/agent-platform-github-ci-branch" ssm:GetParameter "$KEY" branch_key;
      sim "arn:aws:iam::$A:role/agent-platform-github-ci-persona-verdict" ssm:GetParameter "$KEY" verdict_key;
      sim "arn:aws:iam::$A:role/agent-platform-github-ci-apply" ssm:GetParameter "$KEY" apply_key;
      sim "arn:aws:iam::$A:role/PlatformDev" ssm:GetParameter "$KEY" dev_key;
      sim "arn:aws:iam::$A:role/agent-platform-github-ci-branch" ssm:GetParametersByPath "arn:aws:ssm:$R:$A:parameter/secret" branch_bypath;
      sim "arn:aws:iam::$A:role/agent-platform-github-ci-persona-verdict" ssm:GetParameter "arn:aws:ssm:$R:$A:parameter/secret/agent-platform-deepseek-api-key" verdict_inference
    expected: >-
      SCREEN_OK; a Plan line; APPLY_DONE; REPLAN_EXIT 0; SIM branch_key explicitDeny; SIM verdict_key explicitDeny; SIM
      apply_key explicitDeny; SIM dev_key explicitDeny; SIM branch_bypath explicitDeny; SIM verdict_inference allowed
      (the lock leaves the inference keys alone); M.
    fix_if: APPLY_SKIPPED (stop, report the differing addresses); APPLY_FAILED or REPLAN_EXIT 2 (report the error class; a partial apply is finished by a plan amendment's block, never -target); any other SIM value means the lock is not what this plan approved; file a forward-fix rec naming M, tell the operator and hold VP 11 and PR 3.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      PR 2 CI APPLY. The merge's push run of terraform-github-apply.yml ends neutral naming the dispatch owed. The build
      dispatches it from main with gate_change naming github_repository_environment.persona_verdict_app and
      github_repository_environment_deployment_policy.persona_verdict_app_main; the operator reads the preview (two
      creates, nothing else) and approves; the build reads the run's conclusion and its apply log.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_run_trigger(method=run_workflow, workflow_id=terraform-github-apply.yml, ref=main, inputs={gate_change}), then mcp__github__actions_get(method=get_workflow_run) asserting conclusion == success and mcp__github__get_job_logs on its apply job asserting exactly the two created addresses')"
    expected: The run concluded success and its apply log lists exactly the two created addresses.
    fix_if: The preview lists any other change; the operator rejects the run and the build reports it; never approve a change the preview did not list.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      OPERATOR STEP M2, after VP 9's APPLY_DONE: he generates the App's private key and puts it from CloudShell in the
      PROD account, then deletes every local copy. The build asks in these words; the metadata line is his evidence.
    command: >-
      echo 'ASK THE OPERATOR: "In the App settings, Private keys, Generate a private key (a .pem downloads). In CloudShell
      (PROD, break-glass): Actions, Upload file, the .pem; then run: aws ssm put-parameter --name
      /secret/agent-platform-persona-verdict-app-key --type SecureString --value file://$HOME/<file>.pem --no-overwrite
      --query Version --output text && rm -f $HOME/<file>.pem && aws ssm describe-parameters --parameter-filters
      Key=Name,Values=/secret/agent-platform-persona-verdict-app-key --query
      \"Parameters[0].[Type,Version,KeyId]\" --output text ; then delete the downloaded .pem from your device and reply
      with the last line only."'
    expected: The operator's reply reads SecureString, a version of 1 or more, and alias/aws/ssm; no value is shown.
    fix_if: ParameterAlreadyExists (a key was put earlier; the operator reads its version instead); any other type or key; the operator deletes and re-puts it; the build never sees the value.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: pre-deploy
    action: >-
      PR 3's trusted PR plan screens clean (Decision 238 cl.4) and routes to the gated apply: the role CREATE is
      trust-bearing (guard exit 2). Its planned rows are exactly the role, its inline policy and the IAMCIRolesRead
      update.
    command: >-
      bin/venv-python scripts/ci/terraform_hcl_screen.py screen --root terraform/personal && echo SCREEN_LOCAL_OK; then
      mcp__github__pull_request_read(method=get_comments) on PR 3 and read the trusted plan comment
    expected: SCREEN_LOCAL_OK, and the trusted plan comment shows two creates (aws_iam_role.github_ci_persona_verdict_app, aws_iam_role_policy.github_ci_persona_verdict_app), one in-place update of the planner refresh-read policy, and the gated route.
    fix_if: Any other row, or an auto-apply route for the role create; stop and report to the plan owner.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: post-deploy
    action: PR 3 GATED APPLY. The operator approves the tf-gated-apply job in Actions; it creates the role and its policy and re-plans clean.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_list(method=list_workflow_runs, resource_id=terraform-apply-sandbox.yml) for PR 3 merge sha; tell the operator the gated-apply job waits for his approval with the run link; then read its conclusion')"
    expected: The gated-apply run concluded success after the operator's approval.
    fix_if: The run fails; read its log and report the error class to the plan owner; never re-run with -target.
    hermetic: false
    graduation: not-applicable
  - step: 14
    phase: post-deploy
    action: >-
      Live read-back of the new role as an OPERATOR CLOUDSHELL BLOCK (Decision 256 cl.3) after VP 13, read-only, ARNs
      built in-shell and never printed: the role's trust statement count and condition keys, its boundary, one inline
      policy and no attachment, and simulation with aws:PrincipalArn as context.
    command: >-
      ( R=$(aws configure get region); A=$(aws sts get-caller-identity --query Account --output text); N=agent-platform-github-ci-persona-verdict-app;
      ROLE="arn:aws:iam::$A:role/$N"; KEY="arn:aws:ssm:$R:$A:parameter/secret/agent-platform-persona-verdict-app-key";
      aws iam get-role --role-name $N --query 'Role.[length(AssumeRolePolicyDocument.Statement), PermissionsBoundary.PermissionsBoundaryArn != null]' --output text | sed 's/^/ROLE /';
      aws iam get-role --role-name $N --query 'Role.AssumeRolePolicyDocument.Statement[0].Condition.StringEquals' --output json | jq -r 'keys | join(",")' | sed 's/^/TRUST_KEYS /';
      echo "POLICIES $(aws iam list-role-policies --role-name $N --query 'length(PolicyNames)') ATTACHED $(aws iam list-attached-role-policies --role-name $N --query 'length(AttachedPolicies)')";
      s() { aws iam simulate-principal-policy --policy-source-arn "$ROLE" --action-names "$1" --resource-arns "$2" --context-entries "ContextKeyName=aws:PrincipalArn,ContextKeyValues=$ROLE,ContextKeyType=string" --query 'EvaluationResults[0].EvalDecision' --output text | sed "s/^/SIM $3 /"; };
      s ssm:GetParameter "$KEY" app_key; s ssm:GetParameter "arn:aws:ssm:$R:$A:parameter/secret/agent-platform-deepseek-api-key" app_deepseek;
      s ssm:GetParameter "arn:aws:ssm:$R:$A:parameter/secret/agent-platform-anthropic-api-key" app_anthropic; s ssm:PutParameter "$KEY" app_put )
    expected: >-
      ROLE 1 True; TRUST_KEYS token.actions.githubusercontent.com:aud,token.actions.githubusercontent.com:job_workflow_ref,token.actions.githubusercontent.com:sub;
      POLICIES 1 ATTACHED 0; SIM app_key allowed; SIM app_deepseek implicitDeny; SIM app_anthropic implicitDeny; SIM
      app_put implicitDeny.
    fix_if: Any other line; the role is not what this plan approved; file a forward-fix rec naming the merge sha and the line and tell the operator before app-post starts.
    hermetic: false
    graduation: not-applicable
  - step: 15
    phase: pre-deploy
    action: >-
      Fast tier on each PR head (advisory locally; PR CI is authoritative, Decision 73), then the full tier before each
      hand-off (handoff_policy), started in the background from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Both tiers pass and validation_result verifies the head sha.
    fix_if: A failure caused by this diff is fixed on the branch; one that reproduces on origin/main is cited by its existing rec in the PR body, never fixed inline (main reds rec-5247 and rec-5276 are Feedback Loop's).
    hermetic: false
    graduation: not-applicable
