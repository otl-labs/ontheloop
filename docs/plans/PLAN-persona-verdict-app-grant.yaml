    action: Modify
    purpose: >-
      PR 1. In the IAMRolesRead statement's Resource list add
      "arn:aws:iam::${var.account_id}:role/agent-platform-github-ci-persona-verdict-app" directly after the
      agent-platform-github-ci-persona-verdict entry, under a two-line comment in the existing pre-stage form naming
      PLAN-persona-verdict-app-grant (the gated apply that creates the role reads it back, so this applies first).
  - file: terraform/bootstrap/github_ci_apply_boundary.tf
    action: Modify
    purpose: >-
      PR 1, the lock (Decision N cl.4). Append one statement after DenyTelemetryContentChange, under a two-line comment
      naming Decision N: Sid "DenyVerdictAppKeyRead", Effect "Deny", Action "ssm:GetParameter*", Resource
      ["arn:aws:ssm:${var.aws_region}:*:parameter/secret/agent-platform-persona-verdict-app-key",
      "arn:aws:ssm:${var.aws_region}:*:parameter", "arn:aws:ssm:${var.aws_region}:*:parameter/",
      "arn:aws:ssm:${var.aws_region}:*:parameter/secret",
      "arn:aws:ssm:${var.aws_region}:*:parameter/secret/"], Condition { ArnNotLike = { "aws:PrincipalArn" =
      "arn:aws:iam::*:role/agent-platform-github-ci-persona-verdict-app" } }. The account is * (the boundary's
      byte-saving form, as DenyBoundedWriteOnProtectedRoles). No other statement changes.
  - file: tests/checks/iam_tf/test_telemetry_content_reader_iam.py
    action: Modify
    purpose: >-
      PR 1. _BOUNDARY_PROD_BYTES becomes the boundary's minified PROD size with the new Deny, as the test's own
      _minified(_boundary(text)) measures it on the branch (about 5,874 B; the build records the figure in the PR body
      and in VP step 7's expected BOUNDARY_BYTES). Only that constant and the test name that embeds it
      (test_boundary_renders_5427_bytes_prod_and_carries_the_lock -> ..._renders_<new>_bytes_...) change. Feedback
      Loop's file (#2135): the operator allowed this edit on 2026-11-18 or the build asks first.
  - file: tests/checks/iam_tf/test_persona_verdict_app_role.py
    action: Create
    purpose: >-
      The standing guard, pure functions of HCL and workflow text, each with a red case on synthetic text. Shared HCL
      parsing comes from the existing helpers by import only (tests/checks/iam_tf/_platform_security_hcl.py:
      _block_body, _mask, _strip_comments; tests/checks/iam_tf/_ci_platform_role_iam.py: _hcl_statement_blocks,
      _jsonencode_statement_blocks, _attr_raw), with no edit to them. If the file would still pass 500 SLOC, the build
      stops for a scope amendment adding a helper module (implement-scope-boundary.yaml amendment_procedure); it never
      creates an undeclared file. CREATED BY
      WHICHEVER OF PR 1 AND PR 2 BUILDS FIRST (the module docstring names the plan and its three PRs), extended by the
      other and by PR 3 (next rows). PR 1 cases: the IAMRolesRead pre-stage names the role ARN (red without it); the
      boundary's DenyVerdictAppKeyRead exists once, is Deny, its Action is exactly the scalar "ssm:GetParameter*", its
      Resource set is exactly the five ARNs of the boundary row, and its Condition is exactly ArnNotLike on aws:PrincipalArn
      naming the role (red on: a missing resource, a second principal, StringNotLike, the Sid absent).
  - file: tests/checks/iam_tf/test_persona_verdict_app_role.py
    action: Modify
    purpose: >-
      PR 2 cases (if PR 1 has not built, PR 2 creates the file): the persona-verdict-app Environment parsed from
      terraform/github/*.tf with validate_trusted_plan_environment's _blocks, as test_persona_verdict_role.py does:
      can_admins_bypass false, no reviewers block, no wait_timer, custom_branch_policies true and protected_branches
      false, prevent_destroy, and exactly one deployment policy whose branch_pattern is "main"; no
      github_actions_environment_secret or _variable names it; the workflow fence over .github/workflows/*.yml: a job
      may name persona-verdict-app only when it is the post job of persona-verdict.yml, never by expression, and no job
      outside that one assumes the role (red on: another job of persona-verdict.yml, another workflow, an expression).
      PR 3 cases: the role file's trust is one jsonencode statement with operators exactly ["StringEquals"] and keys
      exactly aud, sub and job_workflow_ref, sub the persona-verdict-app Environment subject in each repository form of
      local.github_repos, job_workflow_ref persona-verdict.yml at refs/heads/main; the boundary is the CI apply boundary;
      one inline policy, no attachment; its document is exactly one statement, Allow ssm:GetParameter on the key's
      literal ARN; the key's readers across terraform/personal and terraform/bootstrap
      (validate_secret_parameter_grants' parser, in test_persona_verdict_role.py's form): literal readers are exactly
      {("oidc_persona_verdict_app_role.tf", "VerdictAppKeyParameterRead")} and pattern readers exactly
      {("github_ci_apply_boundary.tf", "DataPlaneAllow"), ("platform_admin_policies.tf", "SecretParameterAdmin")}
      (red on a third literal reader and on a third pattern reader); no Allow outside platform_admin_policies.tf
      SecretParameterAdmin and github_ci_apply_boundary.tf DataPlaneAllow grants an action matching ssm:PutParameter,
      ssm:DeleteParameter or ssm:DeleteParameters by IAM wildcard (fnmatch, as covers_value_verb does: "*", "ssm:*",
      "ssm:Put*", "ssm:D*" and the like) on the key's literal ARN or a pattern covering it (red on a synthetic literal
      PutParameter grant and on a synthetic literal "ssm:Delete*" grant); the role ARN is in oidc.tf's IAMCIRolesRead.
      Red cases for each on synthetic text.
  - file: terraform/github/environments.tf
    action: Modify
    purpose: >-
      PR 2. Append resource "github_repository_environment" "persona_verdict_app" (environment "persona-verdict-app",
      can_admins_bypass false, no reviewers, deployment_branch_policy { protected_branches = false,
      custom_branch_policies = true }, lifecycle { prevent_destroy = true }) and
      "github_repository_environment_deployment_policy" "persona_verdict_app_main" (branch_pattern "main"), with a
      header in the persona_verdict block's style: the post job's Environment for the verdict App key's role (Decision
      N), no reviewer because verdicts post unattended, safety from the main-only policy and the role's job_workflow_ref
      binding, never a secret or variable, created by the first approved terraform-github-apply.yml dispatch naming both
      addresses in gate_change.
  - file: tests/checks/iam_tf/test_terraform_github_import_blocks.py
    action: Modify
    purpose: >-
      PR 2. EXEMPT gains the two new addresses with a new reason constant _PERSONA_VERDICT_APP_REASON in the
      _CONTENT_DEPLOY_REASON form naming PLAN-persona-verdict-app-grant VP step 10. Graduated shard
      terraform-github-import-blocks kept: its node id and guard target do not change.
  - file: terraform/personal/oidc_persona_verdict_app_role.tf
    action: Create
    purpose: >-
      PR 3. Header in oidc_persona_verdict_role.tf's style: what the role is for (persona-verdict.yml's post job reads
      the verdict App's private key; Decision N), why dedicated (no model-running job may reach the key; the operator's
      2026-11-17 ruling), the trust shape, that the boundary's DenyVerdictAppKeyRead names this role, and that the
      CREATE routes to tf-gated-apply and later trust edits are admin split-applies (Decision 223 cl.4, 238 cl.6).
      locals { persona_verdict_app_environment = "persona-verdict-app" }. aws_iam_role.github_ci_persona_verdict_app:
      name agent-platform-github-ci-persona-verdict-app, the apply boundary, one trust statement identical in shape to
      the persona-verdict role's with the new Environment. data aws_iam_policy_document.github_ci_persona_verdict_app:
      one statement, sid VerdictAppKeyParameterRead, ssm:GetParameter on
      "arn:aws:ssm:${var.aws_region}:${var.account_id}:parameter/secret/agent-platform-persona-verdict-app-key".
      aws_iam_role_policy.github_ci_persona_verdict_app with the minified-size precondition the persona-verdict role's
      policy carries. No count, for_each, ternary or file read (Decision 238 cl.4 screen).
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-
      PR 3. IAMCIRolesRead's resources gain the role ARN after the persona-verdict entry, with one comment line naming
