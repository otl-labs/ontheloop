schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-app-grant"
intent: >-
  Plan 4 of the verdict persona egress series (T4.32; T4.2 c9's verdict identity): give the verdict GitHub App
  (Decision 271) a key home and one reader that no model-running job can reach. The operator creates the App (Checks
  write and Metadata read only, no webhook, organisation-owned, this repository only) and puts its private key in the
  SSM SecureString /secret/agent-platform-persona-verdict-app-key (Decision 237). A new role,
  agent-platform-github-ci-persona-verdict-app, trusted only by main's persona-verdict.yml in a new main-only,
  reviewer-free Environment persona-verdict-app, reads exactly that key by literal ARN; the persona-verdict role is
  unchanged (Decision 263 cl.2). A Deny in the CI apply boundary refuses the read to every other carrier (the
  operator's card, 2026-11-18), outside the agent merge loop. A new Decision records the custody as an accepted residual
  against Decision 143 cl.1 in the Decision 267 cl.5 form and re-anchors Decision 270 cl.5's boundary trigger; a
  project-configuration secret row and inventory row GH-16 record the rest. Serves NS.9: the trust root that lets
  persona checks gate agent merges gets a single reader outside every model-running job.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-app-grant.yaml
phase: >-
  T4.32 (persona foundation) and T4.2 c9 (verdict identity). Closes no criterion: the verdict identity is met when
  PLAN-persona-verdict-app-post posts the persona checks through the App.
cites: [dec:92, dec:98, dec:143, dec:144, dec:167, dec:172, dec:177, dec:202, dec:223, dec:224, dec:237, dec:238, dec:246, dec:248, dec:252, dec:256, dec:257, dec:258, dec:263, dec:267, dec:270, dec:271]
amends:
  - dec:258#2
  - dec:270#5
fallback_reevaluation:
  reevaluated_on: "2026-11-18"
  substrate_status: CD.27 pending; executor substrate unratified; T4.2 not built; the T4.15 spike has not run.
  verdict: continue_on_current_substrate
  basis: >-
    The plan adds an SSM parameter, an IAM role, a boundary Deny and a GitHub Environment for the verdict App's key; they
    read the same under every candidate layer-2 substrate and touch no CD.27, fallback_spec or T4.15 ruling (the
    PLAN-persona-verdict-chain disposition).
scope:
