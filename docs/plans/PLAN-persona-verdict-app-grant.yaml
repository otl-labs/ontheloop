infrastructure_dependencies:
  - >-
    PR 1 (terraform/bootstrap, admin-only root): the boundary is in Decision 257 cl.3's protected set, so the merge
    push's terraform-bootstrap-apply preview ends CLOUDSHELL_REQUIRED (expected) and the operator applies the whole
    plan from CloudShell, never split and never -target (deploy-paths.yaml admin_out_of_band.bootstrap_ci_apply).
    Pre-merge: the operator's ENVIRONMENT CHECK and screened read-only plan at the CI-green head (VP 7-8). Post-merge:
    the operator's apply and IAM simulation (VP 9). It applies BEFORE PR 3 merges, or the gated apply's own
    iam:GetRole after the create, and every later refresh, fail closed. One merged-unapplied bootstrap change at a time.
  - >-
    PR 2 (terraform/github): created by a terraform-github-apply.yml dispatch from main whose gate_change names
    github_repository_environment.persona_verdict_app and github_repository_environment_deployment_policy.persona_verdict_app_main,
    after one operator approval in Actions (Decision 248; VP 10). Needed before app-post's post job names it, not
    before PR 3.
  - >-
    Out of band (Decision 237 cl.3): the operator creates the App in the browser before PR 1 commits the inventory
    ledger (VP 2) and puts its private key into the SSM parameter from CloudShell after PR 1 is applied (VP 11), so
    the Deny is live before any key exists. Terraform never holds the value.
  - >-
    PR 3 (terraform/personal): the role CREATE routes to tf-gated-apply (guard exit 2, Decision 144 cl.4); the operator
    approves the gated-apply job in Actions (VP 13); a CloudShell read-back with simulation follows (VP 14). SIT gets
    the same role with no key (Decision 252).
  - >-
    Lambda: none. compute_affected_artifacts over this scope names no Lambda-packaged file.
acceptance_criteria:
  - The three governed files carry exactly the sidecar's eight blocks (approved_text verify exits 0 on PR 1's head).
  - tests/checks/iam_tf/test_persona_verdict_app_role.py passes on each PR head and each red case fails its predicate.
  - The boundary renders under 6,144 B in PROD and SIT, and test_telemetry_content_reader_iam.py pins the new PROD size.
  - "After PR 1's apply: simulation shows github-ci-branch, github-ci-persona-verdict and PlatformDev explicitly denied ssm:GetParameter on the key."
  - "After PR 3's apply: the role exists with one trust statement and one inline policy; simulation allows it the key and denies it both inference keys."
  - The persona-verdict-app Environment exists, main-only, with no reviewers and no admin bypass.
  - The App exists under the organisation, installed on this repository only, Checks write and Metadata read only, no webhook; the key parameter is a SecureString at version 1 or later.
  - The fast tier passes on each PR head and the full tier before each hand-off.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Precondition at each PR's build start: this plan and its sidecar are on main and the egress build has placed
      Decision 271's dated Update naming this plan (Decision N cites it). PR 3 also needs PR 1 applied (VP step 9's
      APPLY_DONE posted on PR 1).
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-persona-verdict-app-grant.yaml &&
      git cat-file -e origin/main:docs/plans/approved/persona-verdict-app-grant.yaml &&
      git show origin/main:docs/DECISIONS.md | awk '/^## Decision 271:/{f=1} f&&/^---$/{exit} f' | grep -q 'Update.*PLAN-persona-verdict-app-grant' &&
      echo PRECONDITION_OK
    expected: Prints the precondition marker.
    fix_if: Absent; the egress build has not merged, so wait for it (the coordinator tracks it); never place Decision N first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: >-
      OPERATOR STEP M1 and read-back, before PR 1 commits the inventory blocks (the session's GitHub proxy refuses the
      App pages, so the steps are his). The build asks him in these words and waits for his reply.
    command: >-
      echo 'ASK THE OPERATOR: "Please create the verdict GitHub App: in github.com, the organisation otl-labs, Settings,
      Developer settings, GitHub Apps, New GitHub App. Name it so it reads as the persona verdict App; homepage the
      repository URL; untick Webhook Active; Repository permissions: Checks Read and write, Metadata Read-only, nothing
      else; no account or organisation permissions; Where can this GitHub App be installed: Only on this account. Create
      it, then Install App on otl-labs, Only select repositories, ontheloop. Do not generate a private key yet. Then open
      the installation Configure page and reply with: the repository access line, the permission list as shown, and
      whether a webhook is active. Do not paste the App id, client id or any key in chat."'
    expected: The operator's reply shows repository access to ontheloop only, Checks read and write and Metadata read only, and no active webhook.
    fix_if: Any other permission, repository or an active webhook; the operator corrects it in the App settings and re-reads, before PR 1 commits.
    hermetic: false
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: The standing guard holds on the real tree and reddens on every synthetic breach (grows with each PR).
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_persona_verdict_app_role.py -q
    expected: All cases pass.
    expected_literals: [passed]
    fix_if: A real-tree case fails; fix the Terraform toward this plan's rows, never the predicate.
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-app-role
  - step: 4
    phase: pre-deploy
    action: >-
      The neighbouring guards hold with the new statement, Environment and role: the boundary byte pin and lock tests,
      the bootstrap CI role tests, the import-block accounting, the plan-time reference scan, the persona-verdict role
      guard (its key-reader and Environment cases must not move), the refresh-read coverage and the registered checks.
    command: >-
      bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_content_reader_iam.py tests/checks/iam_tf/test_bootstrap_ci_roles.py
      tests/checks/iam_tf/test_terraform_github_import_blocks.py tests/checks/iam_tf/test_validate_policy_document_plan_time_refs.py
      tests/checks/iam_tf/test_persona_verdict_role.py tests/checks/iam_tf/validate_ci_refresh_read_coverage/
      tests/checks/iam_tf/test__read_coverage_trusted.py -q &&
      bin/venv-python -c "from scripts.checks.iam_tf.validate_secret_parameter_grants import validate_secret_parameter_grants as a; from scripts.checks.iam_tf.validate_policy_document_plan_time_refs import validate_policy_document_plan_time_refs as b; f=[]; a(f); b(f); assert not f, f; print('NEIGHBOURS_OK')"
    expected: All tests pass and the two registered checks report no finding.
    expected_literals: [passed]
    fix_if: A failure in scope is fixed; a byte-pin failure means the measured size moved, so re-measure and update the constant and the PR body figure; a failure in another project's test outside scope is a STOP to the plan owner.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Runs existing registered checks and other plans' graduated tests that the fast and full tiers already run on every
      PR; a second graduated copy adds no guard.
  - step: 5
    phase: pre-deploy
    action: Provider-free formatting of the touched roots (init, validate and plan are CI's and the gates' job, Decision 119).
    command: terraform fmt -check terraform/bootstrap && terraform fmt -check terraform/github && terraform fmt -check terraform/personal && echo FMT_OK
    expected: Prints the format marker.
    fix_if: Run terraform fmt on the touched root and re-check.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      PR 1 only. The build's tree holds exactly the sidecar's words with {{N}} and {{DATE}} filled, and the approval run
      the planning session dispatched (Decision 246) is approved; a changed word needs a new run before merge.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-app-grant --base origin/main
    expected: Prints the approved-text ok line.
    expected_literals: [APPROVED-TEXT OK]
    fix_if: A mismatch is fixed toward the sidecar; an anchor that no longer matches main exactly once, or a needed word change, is a STOP to the plan owner.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: "PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar on every PR declaring this plan."
  - step: 7
    phase: pre-deploy
    action: >-
      PR 1 ENVIRONMENT CHECK (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan), operator-run in AWS CloudShell
      in the PROD account as user/platform-breakglass, once PR 1 is CI green.
    command: >-
      ( printf 'caller-arn check: '; aws sts get-caller-identity --query Arn --output text 2> /dev/null | grep -q ':user/platform-breakglass$' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT )
    expected: caller-arn check, ADMIN_CHAIN_OK. The ARN itself is never printed.
    fix_if: ADMIN_CHAIN_ABSENT; the operator signs in as the break-glass user and re-runs; VP 8 waits.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: >-
      PR 1 PRE-MERGE GATE (ADMIN), operator-run in CloudShell after VP 7 at the PR's full CI-green head (the build fills
      PR_HEAD_SHA and the expected file list): the command below: PLAN-telemetry-content-reader-api-lock's VP 6 block, except W and L
      named "pvag" and the screen's file list set to "terraform/bootstrap/github_ci_apply_boundary.tf
      terraform/bootstrap/github_ci_apply_reads.tf " (fetch, screen, verified terraform install, tfvars from SSM, init,
      a read-only plan, the changed addresses and the boundary's planned minified length). Names and counts only.
    command: "( set -o pipefail; PR_HEAD_SHA=<full PR head sha>; W=\"${TMPDIR:-/tmp}/pvag\"; L=\"$HOME/pvag-tf.err\"; rm -rf \"\
        $W\"; mkdir -p \"$W/bin\"; : > \"$L\"; trap 'rm -rf \"$W\"' EXIT; unset AWS_PROFILE; git init -q \"$W/repo\" 2>>\
        \ \"$L\"; { git -C \"$W/repo\" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git +refs/heads/main:refs/o/main\
        \ && git -C \"$W/repo\" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git \"$PR_HEAD_SHA\" && git -C\
        \ \"$W/repo\" checkout -q --detach FETCH_HEAD; } 2>> \"$L\" || { echo CLONE_FAILED; exit 1; }; F=$(git -C \"$W/repo\"\
        \ diff --name-only refs/o/main HEAD -- terraform/bootstrap config/aws-region config/terraform-version 2>> \"$L\"\
        \ | LC_ALL=C sort | tr '\\n' ' '); X=$(git -C \"$W/repo\" diff refs/o/main HEAD -- 'terraform/*.tf' 2>> \"$L\" |\
        \ grep -E '^\\+' | grep -cE 'data \"(external|http)\"|provider \"|required_providers|module \"|provisioner|local-exec|^\\\
        +\\s*(data|import|removed|check|terraform)\\b'); [ \"$F\" = \"terraform/bootstrap/github_ci_apply_boundary.tf terraform/bootstrap/github_ci_apply_reads.tf\
        \ \" ] && [ \"$X\" = 0 ] || { echo SCREEN_REFUSED; exit 1; }; echo SCREEN_OK; R=$(tr -d '[:space:]' < \"$W/repo/config/aws-region\"\
        ); export AWS_REGION=\"$R\" AWS_DEFAULT_REGION=\"$R\"; V=$(tr -d '[:space:]' < \"$W/repo/config/terraform-version\"\
        ); case \"$(uname -m)\" in aarch64) P=linux_arm64 ;; *) P=linux_amd64 ;; esac; Z=\"terraform_${V}_${P}.zip\"; {\
        \ curl -fsSL -o \"$W/$Z\" \"https://releases.hashicorp.com/terraform/$V/$Z\" && curl -fsSL -o \"$W/sums\" \"https://releases.hashicorp.com/terraform/$V/terraform_${V}_SHA256SUMS\"\
        \ && ( cd \"$W\" && grep \" $Z\\$\" sums | sha256sum -c --quiet - ) && unzip -qo \"$W/$Z\" -d \"$W/bin\"; } >> \"\
        $L\" 2>&1 || { echo TERRAFORM_INSTALL_FAILED; exit 1; }; export PATH=\"$W/bin:$PATH\"; command -v jq > /dev/null\
        \ || { echo JQ_ABSENT; exit 1; }; aws ssm get-parameter --name /secret/agent-platform-terraform-personal-tfvars\
        \ --with-decryption --query Parameter.Value --output text > \"$W/vars.tfvars\" 2>> \"$L\" && test -s \"$W/vars.tfvars\"\
        \ || { echo TFVARS_ABSENT; exit 1; }; A=$(aws sts get-caller-identity --query Account --output text 2>> \"$L\");\
        \ test -n \"$A\" || { echo IDENTITY_FAILED; exit 1; }; B=\"$W/repo/terraform/bootstrap\"; terraform -chdir=\"$B\"\
        \ init -input=false -lockfile=readonly -backend-config=\"region=$R\" > /dev/null 2>> \"$L\" || { echo INIT_FAILED;\
        \ exit 1; }; terraform -chdir=\"$B\" plan -lock=false -input=false -no-color -detailed-exitcode -var-file=\"$W/vars.tfvars\"\
