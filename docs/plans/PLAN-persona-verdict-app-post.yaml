      child (deployment_approval_probe already takes it), so a rate-limited unauthenticated pending read can still reach a
      verdict. The child, redaction, revoke and exit-code rules are shared.
      The module docstring names both Apps and Decision 273 cl.5.
    new_imports: [scripts.personas.app_token, scripts.personas.override]
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      coupling_findings gains PC-14, one flow-style line (ports [verdict_plane, secrets], location
      scripts/personas/app_token.py, status accepted, owning_item dec-273, a one-sentence description: the post job's
      check identity rests on an OIDC assume and an SSM key read on the secrets port's AWS adapter (Decision 273)). SA-14
      names App installation tokens (via src/data/handlers/github_app_token) in one clause and moves its enumerated
