constraints:
  - No key, JWT, installation token, credential, ARN or account id in any committed file or public log line (Decision 101).
  - No package index host and no host beyond regional STS and SSM on post's list; no wildcard; no list widened to obtain green (Decisions 181, 235).
  - Every check body is built before the App role is assumed; the App token is used for the check-runs POST and the revoke only.
  - No job but persona-verdict.yml post names persona-verdict-app or holds the App role name (Decision 273 cl.3).
  - src/data/handlers/github_app_token.py is not edited (Lambda-packaged).
  - "No agent merge: the operator merges in the GitHub UI (Decision 271 cl.3); the probe and the merge are admin steps that need his words naming each."
  - "500-SLOC limit (Decision 128): decompose, never raise."
  - No rescue agents or workaround loops (Decision 55).
