schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-app-post"
intent: >-
  Egress plan 5 (T4.32 hint PLAN-persona-verdict-app-post; T4.2 c9's verdict-identity leg): persona-verdict.yml's post
  job, in the persona-verdict-app Environment behind the block-mode egress filter, builds every check body first, then
  assumes the verdict App role through OIDC, reads the App key from SSM in its own process, mints one installation token
  (checks write, metadata read), posts every persona-verdict check run with it and revokes it; GITHUB_TOKEN drops to
  checks read. override.py's origin rule pins the gates.verdict_app.app_id row, which this PR sets (operator GitHub-UI
  merge, Decision 271 cl.3). Proves Decision 273 cl.7's live assume, refusal outside the Environment and cannot-approve
  probe. Serves NS.9: a persona check counts only when the chain on main posted it.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-app-post.yaml
phase: >-
  T4.32 (persona foundation) hint PLAN-persona-verdict-app-post; T4.32 c7 (the post job becomes a secret-bearing job under
  the filter). Closes no criterion: c7 stays open for the container leg. The verdict-identity leg it advances is named in
  context, not here.
cites: [dec:212, dec:248, dec:263, dec:267, dec:271, dec:273]
scope:
  - file: .github/workflows/persona-verdict.yml
    action: Modify
    purpose: >-
      keyprep's condition becomes KEYPREP_IF = "!cancelled() && needs.prepare.result == 'success'", so the wheelhouse and
      the aws-region output exist on every run that can reach post; smoke and refusal keep their conditions (KEYED_IF and
      the KEYPREP_OK conjunct) unchanged. post: needs [prepare, run, keyprep]; if unchanged (!cancelled()); environment
      persona-verdict-app (bare name, as smoke); timeout-minutes 10; permissions exactly {checks: read, contents: read,
      actions: read, id-token: write}. Steps in order: the pinned filter (block; allowed-endpoints as one folded >- line,
      Amendment 1 of PLAN-persona-verdict-first-key-read, holding sts.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443
      and ssm.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443 only; telemetry, sudo and containers off;
      api.github.com is already filter-supplied as *.github.com); checkout of main (ref github.sha, path main,
      persist-credentials false); mkdir (id post-mkdir); the egress self-check (id post-self-check); setup-python 3.12; the
      download of persona-verdict-wheels (no continue-on-error); the offline install (id post-install, the keyed PIP_INSTALL
      line); the two existing downloads (prepared, results; continue-on-error kept, so a run whose run job uploaded nothing
      still posts its failure checks); the post step (id post-post) with env GH_TOKEN ${{ github.token }}, AWS_ACCOUNT_ID
      ${{ secrets.AWS_ACCOUNT_ID }}, PERSONA_AWS_REGION ${{ needs.keyprep.outputs.aws_region }} and PERSONA_SNAPSHOT. The
      PyPI pip line is removed. The header comment names this plan and the post job as the only App-token holder.
  - file: config/persona_verdict_egress.yaml
    action: Modify
    purpose: >-
      jobs .github/workflows/persona-verdict.yml gains post: [sts.{aws_region}.amazonaws.com:443,
      ssm.{aws_region}.amazonaws.com:443]. No other row changes; no region id, account id or wildcard is added.
  - file: scripts/personas/oidc_assume.py
    action: Modify
    purpose: >-
      APP_ROLE = "agent-platform-github-ci-persona-verdict-app" beside ROLE, so key_refusal and inference_smoke name the
      App role without importing anything outside the standard library. No other change.
  - file: scripts/personas/app_token.py
    action: Create
    purpose: >-
      The verdict App token, a context manager session(repo, env) imported only by post_verdict and
      workflow_dispatcher_probe. KEY_PARAMETER and PERMISSIONS are its constants. In order: override.app_id() (a null,
      absent or unreadable row raises before any network call); oidc_assume.token(), claims() whose sub must
      end ':environment:persona-verdict-app' and whose job_workflow_ref must equal $GITHUB_REPOSITORY +
      '/.github/workflows/persona-verdict.yml@refs/heads/main' (else fail before the assume); oidc_assume.assume(ROLE,
      jwt) with oidc_assume.APP_ROLE, reported through oidc_assume.report(APP_ROLE, 'ok', ...);
      a boto3.Session from the returned credentials and PERSONA_AWS_REGION, ssm get_parameter(Name=KEY_PARAMETER =
      /secret/agent-platform-persona-verdict-app-key, WithDecryption=True); github_app_token.app_jwt(str(app_id), pem,
      now) and installation_token(api, jwt, repo, PERMISSIONS = {checks: write, metadata: read}); the PEM, JWT and
      credentials are dropped (del) before the session yields the token. Exit: revoke in finally; SIGTERM and SIGINT
      handlers installed before the mint call revoke then re-raise as KeyboardInterrupt, and the previous handlers are
      restored on exit. A botocore ClientError is reported by its error code only, any other exception by its type only.
      Prints only fixed lines: OIDC-CLAIMS sub=<sub> job_workflow_ref=<ref>, OIDC-ASSUME role=<name> expect=ok
      got=<code>, APP-TOKEN minted app_id=<id>, APP-TOKEN revoked, APP-TOKEN FAIL <stage>:<class>. Never a key, JWT,
      token, credential, ARN, account id or exception text. Imports src.data.handlers.github_app_token unchanged (a
      Lambda-packaged module this plan does not edit, so no Lambda deploy follows).
    new_imports: [scripts.personas.oidc_assume, scripts.personas.override, src.data.handlers.github_app_token]
  - file: scripts/personas/post_verdict.py
    action: Modify
    purpose: >-
      Two phases. plan_all(root, work, repo, read_token) returns the list of check bodies (name, head_sha, conclusion,
      title, summary, text) exactly as post_all computes them today, with every GitHub read (override.lookup, origin) on
      GH_TOKEN; it never touches the App role or key. post_all then: an empty list returns before any assume; otherwise one
      app_token.session(...) posts each body with the App token (post_check unchanged apart from returning the parsed 201
      body), and the first created run's app.id must equal override.app_id(), else RuntimeError before any further POST.
      main() reads GH_TOKEN for reads only. The conclusion mapping, titles, summaries and record text are unchanged. The
      downloaded results are data: only results/<route>.json for route ids from the prepared routes.json are read, each
      through _read (json.loads, no other evaluation), and no value read from them reaches an environment variable, a
      path, a URL other than the check-runs POST body, or the session's arguments.
    new_imports: [scripts.personas.app_token]
  - file: scripts/personas/override.py
    action: Modify
    purpose: >-
      New app_id(): the gates.verdict_app.app_id row read from ROOT/docs/contracts/project-configuration.yaml through
      merge_checks.verdict_app_id (already imported; yaml only), raising Refused ("no verdict App is set") on a null,
      absent or unreadable row. Both callers run on main: post checks out the workflow_run's main commit, and
      persona-verdict-override.yml's render job runs only when github.ref is main (OVERRIDE_RENDER_IF, pinned by
      validate_persona_verdict_chain). origin(): the check run's app.id must equal app_id(); a run from any other app,
      github-actions included, refuses. The slug rule is removed. The newest-run test counts only listed runs whose
      app.id equals app_id(), matching merge_checks.verdict's App-pinned newest run (a later same-named run from another
      app is ignored, as Decision 271 cl.2 says a foreign run never refuses on its own). The producing-run and record
      tests are unchanged; the import closure stays {yaml}.
    new_imports: []
  - file: scripts/personas/key_refusal.py
    action: Modify
    purpose: >-
      ATTEMPTS gains the row (oidc_assume.APP_ROLE, "AccessDenied"), the verdict App role refused to a job outside every
      Environment. No new import: the verb stays stdlib-only on the system python.
    new_imports: []
  - file: scripts/personas/inference_smoke.py
    action: Modify
    purpose: >-
      _prelude, after the claim checks and before its own assume, attempts oidc_assume.APP_ROLE with the same jwt and reports
      OIDC-ASSUME role=<app role> expect=AccessDenied got=<code>; any outcome other than HTTP 403 AccessDenied returns the
      failure line class app_role before the persona-verdict assume, so no key is read.
    new_imports: []
  - file: scripts/checks/ci_guards/_persona_verdict_keyed.py
    action: Modify
    purpose: >-
      CONDITIONS keyprep becomes KEYPREP_IF; smoke and refusal unchanged. _secret_rules counts secrets.AWS_ACCOUNT_ID also
      in post's post step when it follows post's self-check. Exposes KEYPREP_IF, PIP_INSTALL, SELF_CHECK, REGION_ENV,
      ACCOUNT_ENV and WHEELS to the post helper (already module constants). No other rule changes.
    new_imports: []
  - file: scripts/checks/ci_guards/_persona_verdict_post.py
    action: Create
    purpose: >-
      post_problems(doc, workflows) pins the post job: exact condition !cancelled(); needs exactly [prepare, run, keyprep];
      environment exactly persona-verdict-app; permissions exactly {checks: read, contents: read, actions: read, id-token:
      write}; no container, services, uses or job-level continue-on-error; the step sequence filter, checkout, mkdir,
      self-check, setup-python, wheels download, offline install, prepared download, results download, post step (by uses
      prefix or exact run line); continue-on-error only on the prepared and results downloads; no configure-aws-credentials
      step, no local action, no docker command (the egress check's command-token rule, imported), every run step carries
      an id; exactly one pip line, the keyed PIP_INSTALL; uploads nothing and downloads exactly persona-verdict-prepared,
      persona-verdict-results and persona-verdict-wheels; run.py verbs exactly [egress-self-check, post]; the post step's
      env keys exactly {GH_TOKEN, AWS_ACCOUNT_ID, PERSONA_AWS_REGION, PERSONA_SNAPSHOT} with GH_TOKEN ${{ github.token }},
      the keyed REGION_ENV and ACCOUNT_ENV. Across every file under .github/workflows/, no job other than persona-verdict.yml
      post names the persona-verdict-app Environment, and no file other than persona-verdict.yml holds the App role name.
      This fence is advisory in --pre (the chain check's pre_globs match only persona-verdict*.yml, and _manifest.py is at
      its cap) and binding in the full tier; the binding lock is the role trust's Environment sub and job_workflow_ref.
      Imports nothing from scripts/personas/.
    new_imports: [scripts.checks.ci_guards._persona_verdict_keyed, scripts.checks.misc.validate_persona_verdict_egress]
  - file: scripts/checks/ci_guards/validate_persona_verdict_chain.py
    action: Modify
    purpose: >-
      Table edits and one call, net lines added at or under the measured headroom (457 raw on main b5326b3d; the 500 limit
      is decomposed, never raised): JOB_PERMISSIONS post becomes {checks: read, contents: read, actions: read, id-token:
      write}; PIP_SETS drops post and _job_problems' pip loop (:228-232) skips post by name as it skips the keyed jobs (the
      post helper pins post's one PIP_INSTALL line); _artifact_problems' continue-on-error rule for post downloads
      (:266-267) applies to persona-verdict-prepared and persona-verdict-results only, and the wheels download carries none
      (the post helper refuses one); the environment and id-token rules admit post (the post helper pins it exactly); the
      python-step rule admits post's self-check line as it admits smoke's and refusal's; the secrets rule admits what the
      keyed helper allows; ARTIFACT_DIRS reads persona-verdict-wheels as wheels for post; _job_problems' name != "post"
      checks-write exemption is dropped, so no verdict job may hold checks: write; verdict_problems calls
      post_problems. If the net lines would pass 500 effective, the post-specific branches move into the post helper.
    new_imports: [scripts.checks.ci_guards._persona_verdict_post]
  - file: docs/contracts/project-configuration.yaml
    action: Modify
    purpose: >-
      gates.verdict_app.app_id: defaults.local and defaults.cloud become the App's numeric id, which the operator gives the
      build (public; read on the App's settings page); readers gain scripts/personas/override.py (app_id(), which
      app_token, post_verdict and the probe call); the private_key row's readers [T4.32] become
      [scripts/personas/app_token.py]; this_repository.note
      re-worded to name PLAN-persona-verdict-app-grant's App and this plan as its token mint ("the merge gate and the
      verdict chain read this value from origin/main; the operator merges any change to it"); status and owning_item
      unchanged (T4.24:c16 homes App ids). One terse amendment_log row.
  - file: scripts/session/workflow_dispatcher_probe.py
    action: Modify
    purpose: >-
      --app {dispatcher, verdict}, default dispatcher (unchanged behaviour and checks). verdict: key parameter fixed to
      app_token.KEY_PARAMETER (a different --key-parameter refuses before any read), issuer str(override.app_id()) read
      from the checked-out row (null refuses before any read), permissions app_token.PERMISSIONS, repository from the
      dispatcher register's repository (the same repository). The child, redaction, revoke and exit-code rules are shared.
      The module docstring names both Apps and Decision 273 cl.5.
    new_imports: [scripts.personas.app_token, scripts.personas.override]
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      coupling_findings gains PC-14 (ports [verdict_plane, secrets], location scripts/personas/app_token.py (one existing
      path, as validate_ports_contract requires), status accepted, owning_item dec-273): the description says persona-verdict.yml's
      post job's check identity rests on an OIDC assume and an SSM key read on the secrets port's AWS adapter. SA-14 also names the GitHub App
      installation-token shapes (app JWT, /repos/{repo}/installation, access_tokens, DELETE /installation/token) and the
      scripts/personas -> src/data/handlers/github_app_token import. One terse amendment_log row. Decision 275 byte cap
      (50162 of 50251 on main b5326b3d): the build pays every added byte by shortening SA-14's or PC-12's description by
      citation (docs/plans/approved/ or this plan's path) or by compacting an older full amendment_log row to a terse
      summary of its own change, never a protected log row, measured against main at build time; the file is also at 499 of
      500 effective lines, so the build frees at least the two lines it adds (PC-14 and the row) by compacting multi-line
      amendment_log rows to terse one-line rows; kept verbatim: "Decision
      263 clause 4", "assumes no AWS identity" and SA-14's pinned token tuple.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      One r3 row per new or changed inline run body in persona-verdict.yml's post job (post-mkdir, post-self-check,
      post-install, post-post), each at its line count; the stale rows post::install-dependencies (step removed),
      post::create-the-work-directory and post::post-the-check-runs (re-keyed by their new ids) are removed.
  - file: tests/personas/test_post_verdict_app_token.py
    action: Create
    purpose: >-
      rec-5486's acceptance. With app_token's network seams patched (oidc_assume opener, boto3.Session replaced by a fake
      recording its client calls, github_app_token.GitHubApi given a fake opener returning GitHub's real shapes: the
      installation object {id, app_id, ...}, the access_tokens 201 body {token, expires_at, permissions {checks: write,
      metadata: read}, repository_selection: selected}, 204 on DELETE /installation/token, and a check-runs 201 body with
      app {id, slug}): every GH_TOKEN read happens before the first OIDC request (an ordered call log); zero bodies make no
      OIDC request; the check-runs POSTs carry the App token and every read carries GH_TOKEN; a 201 whose app.id differs
      from the row stops before the second POST and still revokes; an exception mid-POST revokes; a SIGTERM delivered
      after the mint revokes once (in a subprocess that installs the handler, so the xdist worker is never signalled); a hostile results file (a
      route id not in routes.json, a symlink, a JSON body naming a path or an environment key) changes only its own route's
      check body and never the session's arguments.
  - file: tests/personas/test_app_token.py
    action: Create
    purpose: >-
      A null row, a missing row and an unreadable file fail before any network call; a sub without
      ':environment:persona-verdict-app' or a foreign job_workflow_ref fails before the assume; an AccessDenied assume, an
      SSM ParameterNotFound and a mint permission mismatch each print one APP-TOKEN FAIL line with a code or type only;
      capfd shows no PEM marker, JWT (eyJ...), token, AKIA/ASIA id, ARN or 12-digit account id across every case; the JWT
      issuer is str(app_id); the minted token is revoked on exit and the handlers restored; importing the module imports
      neither boto3 nor jwt.
  - file: tests/personas/test_post_verdict.py
    action: Modify
    purpose: >-
      Existing cases call plan_all for the bodies (fixture base, not an assertion change: the conclusion, title, summary
      and text assertions are unchanged) and post_all through a fake app_token.session; an unresolved resolution and an
      empty route list post nothing and open no session.
  - file: tests/personas/test_override.py
    action: Modify
    purpose: >-
      origin admits a run whose app.id equals the row; refuses app slug github-actions with any id, another App's id, and
      a null row ("no verdict App is set"); a newer same-named run from github-actions or another App is ignored (admitted),
      and a newer run from the row's App refuses; the existing producing-run, record and newest-run refusals keep their
      assertions with the fixture run's app changed to the row's id (fixture base).
  - file: tests/personas/test_key_refusal.py
    action: Modify
    purpose: >-
      Two rows: passes only when both roles return 403 AccessDenied; an ok on the App role fails; ATTEMPTS names the role
      in terraform/personal's verdict App role file.
  - file: tests/personas/test_inference_smoke.py
    action: Modify
    purpose: >-
      The App-role attempt precedes the persona-verdict assume (ordered opener log); an ok or a non-403 code on it fails
      with class app_role and no SSM client is built; the existing subprocess fd-1 order case expects the App-role
      OIDC-ASSUME line between OIDC-CLAIMS and the persona-verdict OIDC-ASSUME line, and test_a_pass_prints_only_marker_lines
      expects that line too, with its assume stub made role-aware (403 for the App role) (planned changes, dispositions
      below).
  - file: tests/personas/test_run.py
    action: Modify
    purpose: >-
      ALLOWED gains app_token: the import names its closure measures at build time (test_run's ast.walk closure counts
      imports inside functions; expected boto3, botocore, jwt, cryptography, yaml and src), each provided by a distribution
      pinned in docker/persona/requirements-persona.txt, which post installs offline; post_verdict's set gains the same.
      override ({yaml}), key_refusal (set()), oidc_assume (set()) and inference_smoke keep their rows unchanged.
  - file: tests/checks/ci_guards/test__persona_verdict_post.py
    action: Create
    purpose: >-
      Red fixtures, each a mutation of the live persona-verdict.yml: post without the Environment or with persona-verdict;
      checks: write on post; id-token missing; a needs list without keyprep; a pip line from an index; the self-check after
      the post step; AWS_ACCOUNT_ID on another step; GH_TOKEN as a secret; an upload; a download of another artifact; a
      continue-on-error on the wheels download; a configure-aws-credentials step; another run.py verb; a second workflow
      job naming persona-verdict-app; the App role name in another workflow; each fails with its own message, and
      test_live_file_passes passes on the live file.
  - file: tests/checks/ci_guards/test__persona_verdict_keyed.py
    action: Modify
    purpose: >-
      keyprep's condition is KEYPREP_IF (a fixture with KEYED_IF on keyprep is red); smoke and refusal keep theirs; the
      existing "AWS_ACCOUNT_ID outside a key-reading step" fixture stays red for every job but post's post step after its
      self-check.
  - file: tests/checks/ci_guards/test_validate_persona_verdict_chain.py
    action: Modify
    purpose: >-
      The post permission map and environment admission (red: checks: write on post; an Environment on run or wake; the
      environment-on-post case moves to a run-job Environment, planned change below); the
      seven-job set unchanged; the live tree passes. At 445 of 500 SLOC: new red fixtures go in
      test__persona_verdict_post.py where they fit; measure at build and decompose past the budget.
  - file: tests/checks/iam_tf/test_persona_verdict_app_role.py
    action: Modify
    purpose: >-
      The fence also requires persona-verdict.yml's post job to name the persona-verdict-app Environment and no other job
      in .github/workflows/ to name it (today the Environment is named by no job).
  - file: tests/test_session_workflow_dispatcher_probe.py
    action: Modify
    purpose: >-
      --app verdict reads the fixed key parameter, signs with str(row id), requests {checks: write, metadata: read} and
      refuses before any read on a null row or another --key-parameter; the default stays the dispatcher's.
  - file: tests/checks/contracts/test_ports_verdict_chain_records.py
    action: Modify
    purpose: SA-14 names the App installation-token shapes; PC-14 is accepted with owning_item dec-273.
bundled_recommendations: [rec-5486]
followon_recs: []
closes_criteria: []
infrastructure_dependencies:
  - "No terraform change. Uses the live role agent-platform-github-ci-persona-verdict-app, the persona-verdict-app Environment (terraform/github) and the SSM key put by the operator (PLAN-persona-verdict-app-grant, Decision 273; VP 11 key put and VP 17 clean 2026-11-20)."
acceptance_criteria:
  - After the operator's UI merge, every persona-verdict/* check run that the chain posts on main's definition carries the gates.verdict_app.app_id App id, and the post job shows APP-TOKEN minted and APP-TOKEN revoked after EGRESS-SELF-CHECK PASS.
  - The post job holds no checks write on GITHUB_TOKEN, no package index host and no host beyond regional STS and SSM on its own list.
  - On a fixture PR, the no-Environment refusal job and the persona-verdict smoke job each get AccessDenied for the App role.
  - The operator's CloudShell probe with --app verdict, before the merge, mints with the row's App id and shows the token cannot approve a pending deployment (TOKEN_LACKS_PERMISSION or NOT_REVIEWER), discharging Decision 273 cl.5's proof (the operator's 2026-11-23 choice).
  - override.origin refuses a github-actions-posted run and any run while the row is null, and its newest-run test counts only the row's App's runs.
  - No public log line or committed file carries a key, JWT, installation token, credential, ARN or account id.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Live read-backs before any job assumes the role: the App role's trust, then the persona-verdict-app Environment
      against its HCL (the session proxy refuses the environments API, so read terraform-github-apply's preview, as
      PLAN-persona-verdict-first-key-read's VP 2 does).
    command: >-
      aws iam get-role --role-name agent-platform-github-ci-persona-verdict-app --profile agent_platform --query
      'Role.AssumeRolePolicyDocument.Statement[0].Condition.StringEquals' --output json; then
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="terraform-github-apply.yml", workflow_runs_filter={branch: "main", status: "completed"}) for the newest
      run, list_workflow_jobs and mcp__github__get_job_logs(job_id=<preview job>, return_content=true)
    expected: >-
      Prints the audience sts.amazonaws.com, job_workflow_ref otl-labs/ontheloop/.github/workflows/persona-verdict.yml@refs/heads/main
      and a sub naming environment:persona-verdict-app; the newest completed terraform-github-apply run's preview shows no
      pending change to the persona-verdict-app Environment or its deployment policy, and its head is at or after the
      newest main commit touching terraform/github/ (report the run id). Step 8's sub check is the second read-back.
    fix_if: Any other value, a pending Environment change or an error is a STOP to the plan owner; no workflow edit merges until both match.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: Unit tests for the token session, the post phases, origin, the refusal rows, the probe flag and the checks.
    command: >-
      bin/venv-python -m pytest tests/personas/test_post_verdict_app_token.py tests/personas/test_app_token.py
      tests/personas/test_post_verdict.py tests/personas/test_override.py tests/personas/test_key_refusal.py
      tests/personas/test_inference_smoke.py tests/personas/test_run.py tests/checks/ci_guards/test__persona_verdict_post.py
      tests/checks/ci_guards/test__persona_verdict_keyed.py tests/checks/ci_guards/test_validate_persona_verdict_chain.py
      tests/checks/iam_tf/test_persona_verdict_app_role.py tests/test_session_workflow_dispatcher_probe.py
      tests/checks/contracts/test_ports_verdict_chain_records.py tests/checks/misc/test_validate_persona_verdict_egress.py
      tests/ci/test_persona_verdict_egress.py -q
    expected: All tests pass.
    expected_literals: [passed]
    fix_if: A test fails; fix the code inside scope, never the assertion (Decision 235).
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-app-post-units
  - step: 3
    phase: pre-deploy
    action: The registered checks pass on the live tree and the app_id row holds a positive integer.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.session.merge_checks import verdict_app_id; from scripts.checks.misc.validate_persona_verdict_egress import validate_persona_verdict_egress as a; from scripts.checks.ci_guards.validate_persona_verdict_chain import validate_persona_verdict_chain as b; from scripts.checks.ci_guards.validate_persona_trigger_policy import validate_persona_trigger_policy as c; from scripts.checks.contracts.validate_project_configuration import validate_project_configuration as d; from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as e; f=[]; [g(f) for g in (a,b,c,d,e)]; assert not f, f; v = verdict_app_id(Path('docs/contracts/project-configuration.yaml').read_text()); assert isinstance(v, int) and not isinstance(v, bool) and v > 0, v; print('APP_POST_CHECKS_OK')"
    expected: Prints the ok marker.
    expected_literals: [APP_POST_CHECKS_OK]
    fix_if: A rule refuses the live tree; fix the workflow or file to its scope row's shape, never the rule.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates five registered checks the fast and full tiers run on every PR and on main, so a graduated copy adds no
      guard.
  - step: 4
    phase: pre-deploy
    action: No account id or ARN was committed, and no region id under .github/ or in config/persona_verdict_egress.yaml.
    command: >-
      a=$(git diff origin/main...HEAD -- .github config scripts tests docs ':!docs/plans' | grep -E '^\+' | grep -cE '\b[0-9]{12}\b|arn:aws:[^:]*:[^:]*:[0-9]{12}:');
      b=$(git diff origin/main...HEAD -- .github config/persona_verdict_egress.yaml | grep -E '^\+' | grep -cE 'arn:aws:|(eu|us|ap|ca|sa|me|af)-(west|east|north|south|central|northeast|southeast)-[0-9]');
      test "$a$b" = 00 && echo NO_LEAK
    expected: Prints NO_LEAK.
    expected_literals: [NO_LEAK]
    fix_if: Any match is removed before push; test fixtures use a synthetic non-12-digit account placeholder.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A PR-relative diff scan with no meaning on main once merged; the pre-commit never-commit hook and the fast tier's
      secret-shape checks are the standing guards.
  - step: 5
    phase: pre-deploy
    action: Fast tier, then the full tier before handoff.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate &&
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and --verify-head confirms the head. The full tier outlasts the foreground cap: start it as a
      harness-tracked background run with a 2 h limit from the top-level session; the verdict is --verify-head.
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner (main reds owned elsewhere are deferred).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Operator admin step (needs his words naming it): the cannot-approve probe (Decision 248 cl.8, Decision 273 cl.5;
      the Decision 267 cl.5 precedent), run at the PR head after the full tier passes and before the UI merge. The build
      dispatches one deployment-approval-probe.yml run from main (mcp__github__actions_run_trigger, method run_workflow)
      and hands the operator a CloudShell block written to /mnt/project-files/persona-verdict-app-post/ that checks out the
      PR head, installs pyyaml==6.0.3, pyjwt==2.15.1 and cryptography (the Decision 267 probe's install line plus PyYAML,
      which workflow_dispatcher_handler and merge_checks import), and runs the probe with the run id.
    command: >-
      python3.12 -m scripts.session.workflow_dispatcher_probe --app verdict --run-id <pending probe run id>
      --key-parameter /secret/agent-platform-persona-verdict-app-key
    expected: >-
      The operator pastes the last two lines: a JSON line whose verdict is TOKEN_LACKS_PERMISSION or NOT_REVIEWER, and
      child_exit=0; the probe's own exit is 0. A successful mint also proves the row's App id matches the key's App (a
      wrong issuer fails the mint with 401). The checks+metadata token cannot read the run or its pending deployments, so
      the child falls back to the unauthenticated proxy-leg reads for those (unlike the dispatcher precedent, whose token
      held actions: write); the build's block says so, so a fallback read failure is told apart from a verdict. The build
      reports the probe run id and the pasted lines.
    fix_if: >-
      APPROVED is a STOP to the plan owner and Decision 273's probe-approves reversal condition fires; a 401 mint means the
      row's id is wrong (fix the row, re-run); anything else (exit 2, a fallback read failure included) proves nothing and
      is re-run once, then a STOP.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      Operator admin step: the operator merges the PR in the GitHub UI (Decision 271 cl.3 refuses an agent merge of a
      change to the app_id row); that merge is also his final-diff review of the credential code. Read the merge back.
    command: mcp__github__pull_request_read(method="get", owner="otl-labs", repo="ontheloop", pullNumber=<PR>)
    expected: >-
      merged true, merged_by the operator, and the merge SHA reported, with the head's required checks green at the merged
      head (mcp__github__pull_request_read method get_check_runs; run ids reported), since the UI merge skips the agent
      merge gate's required-check rule (Decision 264).
    fix_if: Not merged is a wait, never an agent merge.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      First App-posted verdict: on the first persona-verdict run on main's definition after the merge that posts at least
      one check (the build's own fixture PR in step 9 qualifies), read the post job log and the head's check runs.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") for that run, list_workflow_jobs with workflow_jobs_filter {filter: "all"},
      mcp__github__get_job_logs(job_id=<post job>, return_content=true), then
      mcp__github__pull_request_read(method="get_check_runs", owner="otl-labs", repo="ontheloop", pullNumber=<PR>)
    expected: >-
      The post job shows, in order, EGRESS-SELF-CHECK PASS, OIDC-CLAIMS with a sub ending environment:persona-verdict-app,
      OIDC-ASSUME role=agent-platform-github-ci-persona-verdict-app expect=ok got=ok, APP-TOKEN minted app_id=<row id>,
      APP-TOKEN revoked and PERSONA-VERDICT posted=<n> (main prints the count after post_all, whose session has revoked); every persona-verdict/* check run that run created carries app.id
      equal to the row (none from github-actions); the post job log's lines from the post step's own group (from its
      run line to the job's post-run cleanup, excluding action-printed runner and step ids) give zero matches (counts
      reported) for each of
      arn:aws:, \b[0-9]{12}\b, eyJ[A-Za-z0-9_-]{10,}, \b(AKIA|ASIA)[A-Z0-9]{16}\b, IQoJb3JpZ2lu, ghs_[A-Za-z0-9]{20,} and
      BEGIN (RSA )?PRIVATE KEY. An attempt that stops as UNSUPPORTED_PLACEMENT is re-run with
      mcp__github__actions_run_trigger(method="rerun_failed_jobs", run_id=<id>), at most 10 attempts; report the run id
      and attempt numbers.
    fix_if: >-
      Any FAIL line, a check run from another app, or a non-zero scan count is a STOP to the plan owner with the job, step
      and line number, never the matched text; never widen the list or retry the assume in code.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Refusals on main: on the build branch restarted from main, commit one head that REWRITES (>, never appends)
      tests/fixtures/persona_verdict/fixture_pr/proceed.txt with printf '\n%s\n' proceed and nothing else; run the full
      tier and --verify-head; push once and open one draft fixture PR; read refusal's and smoke's logs.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") for the fixture head, list_workflow_jobs, mcp__github__get_job_logs for refusal,
      smoke and post; then mcp__github__update_pull_request(state="closed") for the fixture PR.
    expected: >-
      refusal shows OIDC-ASSUME role=agent-platform-github-ci-persona-verdict-app expect=AccessDenied got=AccessDenied and
      KEY-REFUSAL PASS; smoke shows, for each tier role, OIDC-ASSUME role=agent-platform-github-ci-persona-verdict-app
      expect=AccessDenied got=AccessDenied before OIDC-ASSUME role=agent-platform-github-ci-persona-verdict expect=ok
      got=ok and INFERENCE-SMOKE outcome=PASS; the same run's post job meets step 8. UNSUPPORTED_PLACEMENT attempts are
      re-run as step 8.
    fix_if: >-
      An App-role outcome other than AccessDenied is a STOP to the plan owner and Decision 273's key-exposed review (the
      role's trust admits a job it must not); any other FAIL is a STOP with the log lines.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      Tighten rec-5486's acceptance to node ids before the UI merge (so Decision 201's closure precondition can decide
      it), then close it by update_rec after steps 8 and 9 pass (the UI merge carries no agent trailer step), then read
      it back.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-5486 --acceptance "bin/venv-python -m pytest
      tests/personas/test_post_verdict_app_token.py::<reads-before-oidc node>
      tests/personas/test_post_verdict_app_token.py::<app-id-mismatch node>
      tests/checks/ci_guards/test__persona_verdict_post.py::test_live_file_passes -q" (node names as built, read back with
      recs_by_ids); after steps 8 and 9: bin/venv-python -m scripts.ops_data_portal --update-rec rec-5486 --status closed --execution_result success
      --execution_pr_url <PR url> --resolution "PLAN-persona-verdict-app-post: post job posts with the verdict App token;
      run <step 8 run id>, refusals run <step 9 run id>, probe run <step 6 run id>" && bin/venv-python -c "from
      src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ = fetch_recs_by_ids(make_reader(),
      ['rec-5486']); print(rows[0]['id'], rows[0]['status'])"
    expected: Prints rec-5486 closed; rec-5486's acceptance command passes on main first.
    fix_if: A write that fails loudly is re-filed after connectivity returns (Decision 84 I-4).
    hermetic: false
    graduation: not-applicable
