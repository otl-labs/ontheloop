      only "installation token" and "github_app_token". One terse amendment_log row naming this plan,
      PC-14, SA-14, SA-11 and SA-13. Amendment 1 relief (Decision 275 cl.3): after the floor build the file sits at 500 of
      500 effective lines with about 15 of 50251 bytes free; rung 1 frees no lines (every amendment_log row is already one
      line) and lines bind, so the build takes rung 2, moving detail to the owning plan by citation, on two persona rows that keep their
      subject, location, status and owning_item: SA-11 (the persona contract mechanism's layout; cites
      docs/plans/approved/persona-contracts-verdict-slice.yaml and persona-run-identity-contract.yaml) and SA-13 (the
