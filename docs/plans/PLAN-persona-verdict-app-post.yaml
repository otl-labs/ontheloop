      the floor build's own relief takes SA-11 or SA-13 (main 2aa043e4 already sits at 500 effective lines, so the floor
      blocks need one), the build takes rung 2 on SA-10 or SA-12 (multi-line, owning_item T4.24:c9) by the same rules.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      One r3 row per new or changed inline run body in persona-verdict.yml's post job (post-floor, post-mkdir,
      post-self-check, post-install, post-post, post-final-check; Amendment 1 adds post-floor and post-final-check), each at its line count; the stale rows post::install-dependencies (step removed),
