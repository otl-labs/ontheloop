schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-app-post"
intent: >-
  Egress plan 5 (T4.32 hint PLAN-persona-verdict-app-post; T4.2 c9's verdict-identity leg): persona-verdict.yml's post
  job, in the persona-verdict-app Environment behind the block-mode egress filter, builds every check body first, then
  assumes the verdict App role through OIDC, reads the App key from SSM in its own process, mints one installation token
  (checks write, metadata read), posts every persona-verdict check run with it and revokes it; GITHUB_TOKEN drops to
  checks read. override.py's origin rule pins the gates.verdict_app.app_id row, which this PR sets (operator GitHub-UI
  merge, Decision 271 cl.3). Proves Decision 273 cl.7's live assume, refusal outside the Environment and cannot-approve
  probe. Serves NS.9: a persona check counts only when the chain on main posted it. Amendment 1 (2026-11-23, after
  PLAN-persona-verdict-egress-floor merged as #2375): post, a covered job, follows the floor plan's rules (the filter's
  disable-sudo-and-containers false, the root egress-floor step right after the checkout, the always() self-check last),
  and the ports.yaml relief is re-planned against the floor build's 500/500 lines and about 15 free bytes.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-app-post.yaml
phase: >-
  T4.32 (persona foundation) hint PLAN-persona-verdict-app-post; T4.32 c7 (the post job becomes a secret-bearing job under
  the filter). Closes no criterion: c7 stays open for the container leg. The verdict-identity leg it advances is named in
  context, not here.
cites: [dec:212, dec:248, dec:263, dec:267, dec:271, dec:273, dec:275]
scope:
  - file: .github/workflows/persona-verdict.yml
    action: Modify
    purpose: >-
      keyprep's condition becomes KEYPREP_IF = "!cancelled() && needs.prepare.result == 'success'", so the wheelhouse and
      the aws-region output exist on every run that can reach post; smoke and refusal keep their conditions (KEYED_IF and
      the KEYPREP_OK conjunct) unchanged. post: needs [prepare, run, keyprep]; if unchanged (!cancelled()); environment
      persona-verdict-app (bare name, as smoke); timeout-minutes 10; permissions exactly {checks: read, contents: read,
      actions: read, id-token: write}. Steps in order: the pinned filter (block; allowed-endpoints as one folded >- line,
      Amendment 1 of PLAN-persona-verdict-first-key-read, holding sts.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443
      and ssm.${{ needs.keyprep.outputs.aws_region }}.amazonaws.com:443 only; telemetry off; Amendment 1:
      disable-sudo-and-containers false, as the floor plan requires of every covered job; api.github.com is already
      filter-supplied as *.github.com); checkout of main (ref github.sha, path main, persist-credentials false, the
      floor rule's pinned checkout keys); Amendment 1: the floor step (id post-floor, name Lay the egress floor) running
      exactly sudo python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-floor with no env, if, shell,
      working-directory or continue-on-error; mkdir (id post-mkdir); the egress self-check (id post-self-check); setup-python 3.12; the
      download of persona-verdict-wheels (no continue-on-error); the offline install (id post-install, the keyed PIP_INSTALL
      line); the two existing downloads (prepared, results; continue-on-error kept, so a run whose run job uploaded nothing
      still posts its failure checks); the post step (id post-post) with env GH_TOKEN ${{ github.token }}, AWS_ACCOUNT_ID
      ${{ secrets.AWS_ACCOUNT_ID }}, PERSONA_AWS_REGION ${{ needs.keyprep.outputs.aws_region }} and PERSONA_SNAPSHOT;
      Amendment 1: last, the final check (id post-final-check, name Check the egress filter again, if: always()) running
      the egress-self-check run line and nothing else. The PyPI pip line is removed. The header comment names this plan and the post job as the only App-token holder.
  - file: config/persona_verdict_egress.yaml
    action: Modify
    purpose: >-
      jobs .github/workflows/persona-verdict.yml gains post: [sts.{aws_region}.amazonaws.com:443,
      ssm.{aws_region}.amazonaws.com:443]. No other row changes; no region id, account id or wildcard is added.
  - file: scripts/personas/oidc_assume.py
    action: Modify
    purpose: >-
      APP_ROLE = "agent-platform-github-ci-persona-verdict-app" beside ROLE, so key_refusal and inference_smoke name the
      App role without importing anything outside the standard library. No other change.
  - file: scripts/personas/app_token.py
    action: Create
    purpose: >-
      The verdict App token, a context manager session(repo, env) imported only by post_verdict and
      workflow_dispatcher_probe. KEY_PARAMETER and PERMISSIONS are its constants. In order: override.app_id() (a null,
      absent or unreadable row raises before any network call); oidc_assume.token(), claims() whose sub must
      end ':environment:persona-verdict-app' and whose job_workflow_ref must equal $GITHUB_REPOSITORY +
      '/.github/workflows/persona-verdict.yml@refs/heads/main' (else fail before the assume); oidc_assume.assume(
      oidc_assume.APP_ROLE, jwt), reported through oidc_assume.report(APP_ROLE, 'ok', ...);
      a boto3.Session from the returned credentials and PERSONA_AWS_REGION, ssm get_parameter(Name=KEY_PARAMETER =
      /secret/agent-platform-persona-verdict-app-key, WithDecryption=True); github_app_token.app_jwt(str(app_id), pem,
      now) and installation_token(api, jwt, repo, PERMISSIONS = {checks: write, metadata: read}); the PEM, JWT and
      credentials are dropped (del) before the session yields the token. Exit: revoke in finally; SIGTERM and SIGINT
      handlers installed before the mint call revoke then re-raise as KeyboardInterrupt, and the previous handlers are
      restored on exit. A botocore ClientError is reported by its error code only, any other exception by its type only.
      Prints only fixed lines: OIDC-CLAIMS sub=<sub> job_workflow_ref=<ref>, OIDC-ASSUME role=<name> expect=ok
      got=<code>, APP-TOKEN minted app_id=<id>, APP-TOKEN revoked, APP-TOKEN FAIL <stage>:<class>. Never a key, JWT,
      token, credential, ARN, account id or exception text. Imports src.data.handlers.github_app_token unchanged (a
      Lambda-packaged module this plan does not edit, so no Lambda deploy follows).
    new_imports: [scripts.personas.oidc_assume, scripts.personas.override, src.data.handlers.github_app_token]
  - file: scripts/personas/post_verdict.py
    action: Modify
    purpose: >-
      Two phases. plan_all(root, work, repo, read_token) returns the list of check bodies (name, head_sha, conclusion,
      title, summary, text) exactly as post_all computes them today, with every GitHub read (override.lookup, origin) on
      GH_TOKEN; it never touches the App role or key. post_all then: an empty list returns before any assume; otherwise one
      app_token.session(...) posts each body with the App token (post_check unchanged apart from returning the parsed 201
      body), and the first created run's app.id must equal override.app_id(), else RuntimeError before any further POST.
      main() reads GH_TOKEN for reads only. The conclusion mapping, titles, summaries and record text are unchanged. The
      downloaded results are data: only results/<route>.json for route ids from the prepared routes.json are read, each
      through _read (json.loads, no other evaluation), and no value read from them reaches an environment variable, a
      path, a URL other than the check-runs POST body, or the session's arguments.
    new_imports: [scripts.personas.app_token]
  - file: scripts/personas/override.py
    action: Modify
    purpose: >-
      New app_id(): the gates.verdict_app.app_id row read from ROOT/docs/contracts/project-configuration.yaml through
      merge_checks.verdict_app_id (already imported; yaml only), raising Refused ("no verdict App is set") on a null,
      absent or unreadable row. Both callers run on main: post checks out the workflow_run's main commit, and
      persona-verdict-override.yml's render job runs only when github.ref is main (OVERRIDE_RENDER_IF, pinned by
      validate_persona_verdict_chain). origin(): the check run's app.id must equal app_id(); a run from any other app,
      github-actions included, refuses. The slug rule is removed. The newest-run test counts only listed runs whose
      app.id equals app_id(), the same App filter merge_checks.verdict applies (a later same-named run from another
      app is ignored, as Decision 271 cl.2 says a foreign run never refuses on its own). The producing-run and record
      tests are unchanged; the import closure stays {yaml}.
    new_imports: []
  - file: scripts/personas/key_refusal.py
    action: Modify
    purpose: >-
      ATTEMPTS gains the row (oidc_assume.APP_ROLE, "AccessDenied"), the verdict App role refused to a job outside every
      Environment. No new import: the verb stays stdlib-only on the system python.
    new_imports: []
  - file: scripts/personas/inference_smoke.py
    action: Modify
    purpose: >-
      _prelude, after the claim checks and before its own assume, attempts oidc_assume.APP_ROLE with the same jwt and reports
      OIDC-ASSUME role=<app role> expect=AccessDenied got=<code>; any outcome other than HTTP 403 AccessDenied returns the
      failure line class app_role before the persona-verdict assume, so no key is read.
    new_imports: []
  - file: scripts/checks/ci_guards/_persona_verdict_keyed.py
    action: Modify
    purpose: >-
      CONDITIONS keyprep becomes KEYPREP_IF; smoke and refusal unchanged. _secret_rules counts secrets.AWS_ACCOUNT_ID also
      in post's post step when it follows post's self-check. Exposes KEYPREP_IF, PIP_INSTALL, SELF_CHECK, REGION_ENV,
      ACCOUNT_ENV and WHEELS to the post helper (already module constants), and Amendment 1: FLOOR (exported by the floor
      build); _secret_rules counts post's post step as a key step after the first self-check, as the floor build counts
      smoke's and refusal's. No other rule changes.
    new_imports: []
  - file: scripts/checks/ci_guards/_persona_verdict_post.py
    action: Create
    purpose: >-
      post_problems(doc, workflows) pins the post job: exact condition !cancelled(); needs exactly [prepare, run, keyprep];
      environment exactly persona-verdict-app; permissions exactly {checks: read, contents: read, actions: read, id-token:
      write}; no container, services, uses or job-level continue-on-error; the step sequence filter, checkout, floor,
      mkdir, self-check, setup-python, wheels download, offline install, prepared download, results download, post step,
      final check (by uses prefix or exact run line; Amendment 1 adds floor and final check); the floor, switch and final
      check rules themselves stay in _persona_verdict_floor, which validate_persona_verdict_egress already applies to
      every covered job, so this helper pins only their places in post's sequence; continue-on-error only on the prepared
      and results downloads; no configure-aws-credentials
      step, no local action, no docker command (the egress check's command-token rule, imported), every run step carries
      an id; exactly one pip line, the keyed PIP_INSTALL; uploads nothing and downloads exactly persona-verdict-prepared,
      persona-verdict-results and persona-verdict-wheels; run.py verbs exactly [egress-floor, egress-self-check, post,
      egress-self-check] (Amendment 1; the keyed jobs' form); the post step's
      env keys exactly {GH_TOKEN, AWS_ACCOUNT_ID, PERSONA_AWS_REGION, PERSONA_SNAPSHOT} with GH_TOKEN ${{ github.token }},
      the keyed REGION_ENV and ACCOUNT_ENV. Across every file under .github/workflows/, no job other than persona-verdict.yml
      post names the persona-verdict-app Environment, and no file other than persona-verdict.yml holds the App role name.
      This fence is advisory in --pre (the chain check's pre_globs match only persona-verdict*.yml, and _manifest.py is at
      its cap) and binding in the full tier; the binding lock is the role trust's Environment sub and job_workflow_ref.
      Imports nothing from scripts/personas/.
    new_imports: [scripts.checks.ci_guards._persona_verdict_keyed, scripts.checks.misc.validate_persona_verdict_egress]
  - file: scripts/checks/ci_guards/validate_persona_verdict_chain.py
    action: Modify
    purpose: >-
      Table edits and one call, net lines added at or under the measured headroom (457 raw on main b5326b3d; the 500 limit
      is decomposed, never raised): JOB_PERMISSIONS post becomes {checks: read, contents: read, actions: read, id-token:
      write}; PIP_SETS drops post and _job_problems' pip loop (:228-232) skips post by name as it skips the keyed jobs (the
      post helper pins post's one PIP_INSTALL line); _artifact_problems' continue-on-error rule for post downloads
      (:266-267) applies to persona-verdict-prepared and persona-verdict-results only, and the wheels download carries none
      (the post helper refuses one); the environment and id-token rules admit post (the post helper pins it exactly); the
      python-step rule admits post's self-check line, and (Amendment 1) its FLOOR line and always() final self-check, on
      the same branch the floor build extends for smoke and refusal (name in KEYED_JOBS or post), and the floor build's
      mkdir-after-floor counting applies to post; the secrets rule admits what the
      keyed helper allows; ARTIFACT_DIRS already maps persona-verdict-wheels (global, no edit); _job_problems' name != "post"
      checks-write exemption is dropped, so no verdict job may hold checks: write; verdict_problems calls
      post_problems. If the net lines would pass 500 effective, the post-specific branches move into the post helper.
    new_imports: [scripts.checks.ci_guards._persona_verdict_post]
