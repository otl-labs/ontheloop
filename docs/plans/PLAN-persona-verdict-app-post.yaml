      reflow-only rewrite or a raise). Kept verbatim: "Decision 263 clause 4" and "assumes no AWS identity" (PC-12), and
      SA-14's pinned tokens (persona-verdict.yml, workflow_run, head_sha, Checks API, github-actions[bot], docs/plans/,
