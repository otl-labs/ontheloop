schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-chain"
intent: >-
  Build the GitHub Actions verdict chain shell, plan 1 of the six PLAN-persona-verdict-* plans that replace T4.32's
  single verdict-jobs hint: a secretless pull_request trigger chained by workflow_run to a verdict workflow that runs
  main's definition and main's code, resolves the PR only from fields GitHub sets, enforces the author allowlist fail
  closed, routes on the diff (T4.2 c12), materialises the input fields every verdict contract shares in a job that
  holds no credential with the head-tree snapshot off the import path (rec-5041 part 1), and posts one completed check
  run per routed persona on the head SHA from a poster job that alone holds checks: write. The chain runs only the
  verdict personas whose executor-personas.yaml implementation reads implemented (none yet), plus a deterministic
  non-LLM probe persona on fixture PRs that proves the chain end to end; no job assumes the persona-verdict role or
  names its Environment (operator card 2026-11-16: the role is first assumed in PLAN-persona-verdict-egress, after
  c7's egress denial). This serves the North Star's verdict plane (NS.3): reviews start from a forge event on main's
  definition, never from a session.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-chain.yaml
phase: >-
  T4.32 (persona foundation), c1's verdict chain, verdict identity and plan-PR routing part (T4.2 c8's shell half, c9's
  identity and allowlist, c12). c1, c3, c4, c6 and c7 stay open; the approved annotation and hint re-cut name the five
  later plans.
cites: [dec:170, dec:185, dec:205, dec:224, dec:229, dec:234, dec:246, dec:247, dec:263, dec:264]
scope:
  - file: .github/workflows/persona-verdict-trigger.yml
    action: Create
    purpose: >-
      name persona-verdict-trigger. on: pull_request, types [opened, synchronize, reopened, ready_for_review]. Top-level
      permissions {}; one job (ubuntu-latest, timeout-minutes 2, permissions {}) whose single run step echoes the head
      SHA; no checkout, no uses:, no secrets., no environment (T4.2 c8, Decision 205 cl.2). Its conclusion carries no
      meaning: the verdict workflow never reads it.
  - file: .github/workflows/persona-verdict.yml
    action: Create
    purpose: >-
      name persona-verdict. on: workflow_run, workflows [persona-verdict-trigger], types [completed]; top-level
      permissions {}; concurrency group persona-verdict-<workflow_run.head_repository.full_name>-<workflow_run.head_branch>
      with cancel-in-progress true; every uses: pinned to a 40-hex SHA with a trailing version comment. Three jobs.
      (1) prepare (timeout-minutes 10; permissions contents: read, pull-requests: read; no environment, no id-token):
      checks out main at github.sha (persist-credentials false) into main/, sets up Python 3.12 and runs `pip install
      pyyaml -c main/requirements.txt` (the approved-text-approval.yml pattern; no new dependency); then, in this order,
      each through `python3 -I main/scripts/personas/run.py <verb>` with the working directory $RUNNER_TEMP/work (never
      the snapshot): resolve, route, then a fetch of the head tarball by API into $RUNNER_TEMP/snapshot (only when a
      route exists), then materialise; uploads one artifact persona-verdict-prepared (resolution, routes, one input JSON
      per routed persona). (2) run (needs prepare; timeout-minutes 15; permissions {}; no environment, no id-token; if:
      always() && needs.prepare.result == 'success'): checks out main (the repository is public, so an empty-permission
      token suffices), sets up Python 3.12 and runs `pip install jsonschema -c main/requirements.txt`, downloads the
      artifact, validates each input against its persona's input schema as data, and for the probe route runs
      `python3 -I main/tests/fixtures/persona_verdict/probe.py` with a step timeout-minutes 5; uploads
      persona-verdict-results. No bound
      persona other than the probe exists, so this job runs nothing else in this plan. (3) post (needs [prepare, run];
      if: always(); timeout-minutes 5; permissions checks: write, contents: read, actions: read): checks out main and
      runs scripts.personas.post_verdict, which posts one completed check run per route on the resolved head SHA from
      whatever artifacts exist (a missing or invalid one maps to failure). The workflow exits 0 on every verdict
      outcome and goes red only on a shell fault (an exception in a script, or a check-run POST that fails after
      retries), so ci-rca never files on a verdict.
  - file: scripts/personas/__init__.py
    action: Create
    purpose: Package marker; empty.
  - file: scripts/personas/run.py
    action: Create
    purpose: >-
      The one entry point the workflow calls under python3 -I. Inserts exactly the main checkout's root (derived from
      this file's own path, never the cwd) at sys.path[0], asserts no sys.path entry resolves inside $PERSONA_SNAPSHOT
      (exit 3, PERSONA_SNAPSHOT_ON_PATH, before any other import), then dispatches the verb (resolve, route, materialise,
      post) to the module's main(argv). Stdlib at import.
  - file: scripts/personas/resolve_pr.py
    action: Create
    purpose: >-
      Resolves the PR from GitHub-set workflow_run fields only (head_sha, head_repository.full_name, head_branch,
      event); never reads workflow_run.pull_requests[] or any trigger-run artifact. event != pull_request -> no routes.
      Lists open PRs with head <owner>:<head_branch>, keeps rows whose head.sha equals head_sha and whose
      head.repo.full_name equals head_repository.full_name, and requires exactly one; zero or more than one ->
      resolution unresolved (no PR to post on: the workflow writes a job summary and exits 0, nothing posted). Author =
      that row's user.login and user.id; allowlisted iff GET /repos/{repo}/collaborators/{login}/permission returns
      role_name admin or maintain (a live read, so no maintainer list is stored); any API error or other value ->
      not allowlisted (fail closed). The executor App leg of T4.2 c9 joins with T4.21's App, which does not exist yet.
      Output: {change_id: "<repo>#<number>" (Decision 234 cl.4 generic id), number, head_sha, base_sha, draft,
      author_login, author_id, allowlisted, reason}.
  - file: scripts/personas/route.py
    action: Create
    purpose: >-
      Routing on the diff, never on the branch name; changed paths and status from the compare API (base...head). Two
      rules, unioned so no PR shape loses a verdict. (a) The merge gate's class, imported, never copied:
      scripts.session.merge_checks.pr_class(changed) (push_scope.confined_to_plans; T4.28 c1, ports.yaml PC-10) --
      every persona whose merge_checks.PERSONA_CLASSES class equals the PR's class, on every head, except those in
      merge_checks.READY_HEAD_PERSONAS, which run on ready heads only. Until PLAN-persona-verdict-rescout adds
      fingerprint coverage, every-head personas re-run on ready heads rather than reusing a covered verdict, so a check
      exists on the merge-time head the gate reads. (b) T4.2 c12's extras: a code-class PR that adds a
      docs/plans/PLAN-*.yaml, or modifies one in a field outside docs/contracts/implement-scope-boundary.yaml
      sanction_rows.implementing_plan_bookkeeping.permitted_field_edits (read from main; base and head plan text
      compared with yaml.safe_load), also gets the plan-class set with the same head rule, so the scout runs on every
      head (Decision 229 cl.4); a plan-class PR whose only plan edits are bookkeeping fields also gets the code-class
      set. An unparseable plan at head counts as a revision (fail toward review). Persona ids and classes come only
      from merge_checks, so route.py holds no persona-id string literal (executor-personas.yaml implementation_binding
      landing_dirs rule). The routes are then intersected with the bound set: executor-personas.yaml personas rows of
      kind verdict whose implementation.status is implemented (none today). Separately, the probe route is added iff
      every changed path is under tests/fixtures/persona_verdict/fixture_pr/; no other diff routes to it. Output:
      ordered persona ids.
  - file: scripts/personas/materialise.py
    action: Create
    purpose: >-
      Builds one input JSON per route from API data and main's files, as data only: the shared fields change_id,
      head_sha and plan (the text at head of the single docs/plans/PLAN-*.yaml the diff adds or modifies; empty when
      none; input_unusable when more than one), and a provider registry (persona id -> callable) that later add plans
      extend with each persona's own fields; a route whose persona has no provider for a required field gets
      input_incomplete. The verdict_probe provider adds marker (the text at head of
      tests/fixtures/persona_verdict/fixture_pr/marker.txt). It never imports, executes or adds to sys.path anything
      under the snapshot; it reads snapshot files as bytes. Names no registered persona id or contract path (the
      executor-personas.yaml landing_dirs rule), so the registry starts empty for the three verdict personas.
  - file: scripts/personas/post_verdict.py
    action: Create
    purpose: >-
      Conclusion mapping (audit Q4): verdict NO_FLAGS, FLAGS_FOUND (flags in output.text) and PROCEED -> success; BLOCK
      and REVISE -> failure; a failure_outputs value, a missing, unparseable or schema-invalid result, a timed-out or
      cancelled run job, or an author not allowlisted (title "author not on allowlist", no persona run) -> failure;
      never neutral, skipped or action_required. One check run per route, created once with status completed on the
      resolved head_sha (never GITHUB_SHA, which is main's), name persona-verdict/<persona id> (the probe's is
      persona-verdict/verdict_probe, never a gated persona's name, Decision 264), output.title and output.summary
      under 65,535 characters. POST retried 3 times; a final failure is a shell fault (non-zero exit).
  - file: scripts/session/merge_checks.py
    action: Modify
    purpose: >-
      One constant beside PERSONA_CLASSES: READY_HEAD_PERSONAS = frozenset({"plan_critic"}), the personas the verdict
      chain runs on ready heads only (T4.2 c12). The merge gate's own logic is unchanged; the table lives here because
      scripts/personas/ may not name a pending persona id.
  - file: tests/test_session_merge_checks.py
    action: Modify
    purpose: >-
      One test: READY_HEAD_PERSONAS is a subset of PERSONA_CLASSES whose class is plan, so a ready-only persona can
      never be one the merge gate needs on a draft head of a code PR. Additive only: the graduated shards
      merge-checks-persona-functions and merge-checks-verdicts are kept (their tests are unchanged).
  - file: tests/fixtures/persona_verdict/probe.py
    action: Create
    purpose: >-
      The deterministic non-LLM probe persona (stdlib only, no network, no GitHub): reads one input JSON, and from
      marker returns {outcome: success, verdict: PROCEED} for "proceed", {outcome: success, verdict: REVISE} for
      "revise", a failure_outputs value input_unusable for "fail", and unparseable output for "malformed", so a live
      fixture PR exercises each conclusion. Removed by PLAN-persona-verdict-fixture-run.
  - file: tests/fixtures/persona_verdict/probe_schema.json
    action: Create
    purpose: The probe's input and output JSON schemas (change_id, head_sha, plan, marker; outcome, verdict).
  - file: tests/fixtures/persona_verdict/fixture_pr/marker.txt
    action: Create
    purpose: The fixture PR marker, committed as "proceed"; the post-deploy fixture PRs edit only this file.
  - file: tests/personas/__init__.py
    action: Create
    purpose: Package marker; empty.
  - file: tests/personas/test_probe.py
    action: Create
    purpose: >-
      Runs tests/fixtures/persona_verdict/probe.py as a subprocess on each marker (proceed, revise, fail, malformed)
      and asserts its output: PROCEED, REVISE, failure_outputs input_unusable, and output that does not parse.
  - file: tests/personas/test_resolve_pr.py
    action: Create
    purpose: >-
      Mirror test (Decision 131): resolution from GitHub-set fields only (a populated pull_requests[] naming another PR
      is ignored), exactly-one rule, fork head_repository mismatch, allowlist admin/maintain admitted, write/read/none
      and API errors refused.
  - file: tests/personas/test_route.py
    action: Create
    purpose: >-
      Mirror test: plan-class PR -> decision_scout on draft and ready heads, plan_critic on ready heads; code-class PR
      -> code_reviewer; code PR adding or revising a plan -> both sets, decision_scout on draft and ready heads;
      docs/plans/-only bookkeeping edit -> plan set and code_reviewer; branch name never consulted; unbound personas
      filtered; probe only on fixture-only diffs; the class comes from merge_checks.pr_class and the head rule from
      merge_checks.READY_HEAD_PERSONAS (monkeypatching either changes the result). The test file may name persona
      ids; it is outside landing_dirs.
  - file: tests/personas/test_materialise.py
    action: Create
    purpose: "Mirror test: shared fields, plan selection rules, input_incomplete for a missing provider, probe marker."
  - file: tests/personas/test_post_verdict.py
    action: Create
    purpose: >-
      Mirror test: every row of the conclusion mapping, head_sha from the resolution not GITHUB_SHA, status completed
      in one POST, names, allowlist refusal, missing artifacts, retry then shell fault.
  - file: tests/personas/test_run.py
    action: Create
    purpose: "Mirror test: sys.path holds the main root first and no snapshot path; exit 3 when one would."
  - file: tests/ci/test_persona_verdict_isolation.py
    action: Create
    purpose: >-
      rec-5041 part 1 (its acceptance selector): a snapshot planting json.py, yaml.py, sitecustomize.py, conftest.py,
      scripts/__init__.py, scripts/personas/__init__.py and a .pth file, each writing a sentinel when imported or
      processed. Runs the materialise verb with the exact argv and working directory parsed from persona-verdict.yml's
      prepare job, under a hostile environment (PYTHONPATH set to the snapshot); asserts no sentinel and no loaded
      module __file__ under the snapshot. Negative control: the same argv with -I removed and the same PYTHONPATH fires
      a sentinel (sitecustomize.py and json.py shadow from PYTHONPATH), so the test can fail. A run by script path puts
      the script's own directory, not the cwd, at sys.path[0], so a cwd-only control would never fire and is not used.
  - file: scripts/checks/ci_guards/validate_persona_verdict_chain.py
    action: Create
    purpose: >-
      Registered check (declares examined(), Decision 170 cl.3). Refuses: a trigger workflow other than exactly
      pull_request, permissions other than {} anywhere in it, a uses:, a checkout, a secrets. reference or an
      environment; a verdict workflow not on exactly workflow_run naming persona-verdict-trigger; any uses: in either
      not pinned to a 40-hex SHA; checks: write on any job but post; id-token: write or environment on any job (until
      PLAN-persona-verdict-egress amends this rule); a prepare-job python invocation of the snapshot-reading verbs
      without -I or with working directory under the snapshot; a prepare job whose snapshot fetch comes after
      materialise; a run-job probe step invoking anything but tests/fixtures/persona_verdict/probe.py. It reads the
      two workflow files as YAML text only and imports nothing from scripts/personas/. Fails when either file is
      missing.
  - file: tests/checks/ci_guards/test_validate_persona_verdict_chain.py
    action: Create
    purpose: "Mirror test with one red fixture workflow per refused shape, green on the live pair, and test_registered_in_fast_tier (the registry resolves the Entry with pre=True)."
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      One Entry for validate_persona_verdict_chain, pre=True with pre_globs .github/workflows/persona-verdict*.yml,
      scripts/checks/ci_guards/validate_persona_verdict_chain.py, scripts/checks/_common.py and
      scripts/checks/registry.py (its whole import closure beyond stdlib and yaml), full_segment full_after_lint (the
      validate_persona_trigger_policy entry's shape).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      The file is at 497 of 500 effective lines, so first compact the Claude Code workflows entry from block style to
      one flow-style line (same four keys and the same rationale text), freeing 8 lines; then add three one-line rows:
      function_to_category `validate_persona_verdict_chain: environment`, and in the workflows map
      `persona-verdict-trigger: {tier: not_a_gate, ci_rca: excluded, owner: platform, rationale: ...}` and
      `persona-verdict: {tier: not_a_gate, ci_rca: excluded, owner: platform, rationale: ...}`. Both are excluded
      because each run serves one PR (ci-rca-lifecycle.yaml trigger_scope watches main only, though GitHub labels a
      workflow_run run with main's branch); a shell fault shows on that PR as a failed or missing persona-verdict
      check. So .github/workflows/ci-rca.yml is not edited. Net -5 effective lines (about 492 of 500), measured with
      plan_obligations after the edit.
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      boundary_patterns gains three substring rows: scripts/personas/, tests/personas/ and persona_verdict (the last
      covers tests/fixtures/persona_verdict/, the shape check validate_persona_verdict_chain, its mirror test and
      tests/ci/test_persona_verdict_isolation.py, plus the existing persona-verdict role .tf and its test). Decision
      185 cl.3: the verdict shell and its leash become merge gates on executor PRs. .github/workflows/ is already
      covered; scripts/checks/ is not, hence the persona_verdict row. A pure append, so a tightening.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Exactly the five ROADMAP blocks of docs/plans/approved/persona-verdict-chain.yaml (T4.32 intent annotation,
      progress-note bullet, verdict-jobs hint re-cut into six plans, and the T4.28 and T4.30 add-plan hints' after lists
      re-pointed from PLAN-persona-verdict-jobs to the plans that now carry its parts); no other edit.
  - file: tests/roadmap/test_verdict_persona_criteria.py
    action: Modify
    purpose: >-
      Exactly the sidecar's hint-set-test block: test_decomposition_hints_resolve_to_one_parent's T4.32 set names the six
      PLAN-persona-verdict-* plans in place of PLAN-persona-verdict-jobs (the hint the re-cut removes); every other
      expected plan and assertion is unchanged, so the test stays as strict.
bundled_recommendations: []
followon_recs: [rec-5241, rec-5249]
closes_criteria: []
infrastructure_dependencies:
  - >-
    None. No .tf file is in scope. compute_affected_artifacts(<scope>) names only data-pipeline, through
    docs/ROADMAP-PLATFORM.yaml, which carries a dated annotation, a progress bullet and decomposition hints only (the
    PLAN-verdict-persona-roadmap-regrounding and PLAN-gate-consumers-flag-aware disposition: the deploy gate's watched
    paths exclude the roadmap and its one runtime reader runs only from the disabled scheduled-agent dispatcher): no
    build, deploy or smoke step. The two workflows take effect on main at merge (workflow_run reads main's
    definition); VP 8 and VP 9 are their post-deploy proof.
acceptance_criteria:
  - "A fixture PR whose diff is only tests/fixtures/persona_verdict/fixture_pr/marker.txt gets exactly one check run named persona-verdict/verdict_probe on each head SHA, created by the post job of a persona-verdict run whose event is workflow_run, with the conclusion the marker selects: proceed -> success, revise -> failure, fail -> failure, malformed -> failure."
  - "No job in any persona-verdict or persona-verdict-trigger run holds id-token: write or names an Environment, and no run reads an inference key."
  - "Until a verdict persona is bound, a PR whose diff is not confined to tests/fixtures/persona_verdict/fixture_pr/ gets no check run named persona-verdict/..., although its persona-verdict run concludes (read on a real PR after merge)."
  - "A planted module in the head-tree snapshot is never imported by the materialiser (tests/ci/test_persona_verdict_isolation.py), and the negative control fires."
  - "validate_persona_verdict_chain is registered in the fast tier, green on main and red on each fixture shape it refuses."
  - "docs/ROADMAP-PLATFORM.yaml and tests/roadmap/test_verdict_persona_criteria.py differ from main by exactly the six approved sidecar blocks (approved_text verify OK)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Chain module unit tests (resolve, route, materialise, post, run, probe) and the merge_checks head table.
    command: bin/venv-python -m pytest tests/personas tests/test_session_merge_checks.py -q
    expected: All tests pass.
    expected_literals: [passed]
    fix_if: Any failure; fix the module, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-chain-modules
  - step: 2
    phase: pre-deploy
    action: Snapshot isolation (rec-5041 part 1) with its negative control.
    command: bin/venv-python -m pytest tests/ci/test_persona_verdict_isolation.py -q
    expected: Passes; the negative-control case asserts the sentinel fired.
    expected_literals: [passed]
    fix_if: A sentinel fires under the workflow's argv, or the negative control does not fire.
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-snapshot-isolation
  - step: 3
    phase: pre-deploy
    action: The workflow-shape check, red fixtures and live pair.
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_persona_verdict_chain.py tests/checks/ci_guards/test__manifest.py -q
    expected: All pass.
    expected_literals: [passed]
    fix_if: A refused shape passes, or the live pair fails.
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-chain-shape
  - step: 4
    phase: pre-deploy
    action: "The trigger-policy check accepts the new pair (workflow_run upstream qualifies; no checks: write on a pull_request workflow)."
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_persona_trigger_policy.py -q && bin/venv-python -c "from scripts.checks.ci_guards.validate_persona_trigger_policy import validate_persona_trigger_policy as v; f=[]; v(f); print('FAILED', f) if f else print('TRIGGER_POLICY_OK')"
    expected: Tests pass and the live tree prints the ok marker.
    expected_literals: [TRIGGER_POLICY_OK]
    fix_if: The policy check names a persona workflow; fix the workflow, never the policy check.
    hermetic: true
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Approved roadmap and hint-set test text is placed byte-exactly.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-chain --base origin/main && bin/venv-python -m pytest tests/roadmap/test_verdict_persona_criteria.py -q
    expected: Prints APPROVED-TEXT OK, then the roadmap criteria tests pass.
    expected_literals: [APPROVED-TEXT OK, passed]
    fix_if: Any drift; re-place the blocks from the sidecar, never edit the sidecar.
    hermetic: true
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Fast tier on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Any failing check; fix the cause.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Full tier on the ready head (background, 2 h limit) and its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: verify-head reports ok for HEAD.
    fix_if: Any failure; tests/test_aws_profile.py needs HOME set to an empty directory in containers (rec-5196).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      After merge, on the build session's own branch (restarted from main per git-ops.yaml once the build PR merged; no
      new branch), open one draft fixture PR whose diff is only tests/fixtures/persona_verdict/fixture_pr/marker.txt,
      and push four successive heads setting the marker to proceed (plus a trailing-newline change), revise, fail and
      malformed. Push the next head only after the previous head's persona-verdict run has concluded, because the
      workflow's concurrency group cancels an in-progress run on the same branch. The PR is authored by the operator's
      linked account (an admin), so the allowlist admits it.
    command: >-
      For each head: mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") to find the concluded run whose job summary names that head SHA, then
      mcp__github__pull_request_read(method="get_check_runs", owner="otl-labs", repo="ontheloop", pullNumber=<n>) on
      that head, then mcp__github__get_job_logs for the run's jobs.
    expected: >-
      Each head has exactly one check run named persona-verdict/verdict_probe from the GitHub Actions app, conclusions
      success, failure, failure, failure in marker order; each run's event is workflow_run; no job log shows an OIDC
      token request, an AWS call or an Environment; each run concluded success.
    fix_if: A missing or wrong conclusion, or a credential in any job; close the fixture PR, file the defect to the plan owner.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      A real PR gets no persona check (nothing bound): read the first non-fixture PR head pushed after the merge whose
      persona-verdict run has concluded; then close the fixture PR unmerged.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") for a concluded run whose job summary names a PR other than the fixture PR;
      mcp__github__pull_request_read(method="get_check_runs", owner="otl-labs", repo="ontheloop", pullNumber=<that PR>)
      filtered to names starting persona-verdict/; then mcp__github__update_pull_request(state="closed") for the
      fixture PR.
    expected: The run concluded success with no routes, no persona-verdict/ check run is on that head, and the fixture PR is closed.
    fix_if: A persona check on a real PR means route.py bound something; fix before any add plan.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: The executor boundary covers the verdict shell (Decision 185 cl.3).
    command: >-
      bin/venv-python -c "import yaml; b=yaml.safe_load(open('config/agent/executor/capabilities.yaml'))['boundary_patterns']; assert {'scripts/personas/', 'tests/personas/', 'persona_verdict'} <= set(b); print('BOUNDARY_OK')"
    expected: Prints the ok marker.
    expected_literals: [BOUNDARY_OK]
    fix_if: A pattern is missing; add it to boundary_patterns.
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-executor-boundary
test_obligations:
