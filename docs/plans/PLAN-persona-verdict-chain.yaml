execution_steps:
  - "Pre: on main, no persona-verdict*.yml exists and no other open PR creates one (mcp__github__list_pull_requests); git-ops.yaml and ports.yaml are not touched."
  - "Create scripts/personas/ (run, resolve_pr, route, snapshot, materialise, execute, post_verdict), the probe fixtures (probe.py, probe_schema.json, fixture_pr/{proceed,revise,fail,malformed}.txt) and their mirror tests under tests/personas/ (including test_probe, test_snapshot and test_execute); post: VP 1 green."
  - "Create the two workflows (SHA-pinned uses: resolved from the tags the repo already uses, with version comments); post: VP 4 green."
  - "Create tests/ci/test_persona_verdict_isolation.py (it parses persona-verdict.yml, so after the workflows); post: VP 2 green including the negative control."
  - "Create validate_persona_verdict_chain with its mirror test, the _manifest Entry (test__manifest.py is parametrised over Entries and stays unchanged), and the ci_rca_taxonomy rows; post: VP 3 green."
  - "Add READY_HEAD_PERSONAS to scripts/session/merge_checks.py with its test, and the three capabilities.yaml boundary_patterns rows; post: VP 10 BOUNDARY_OK."
  - "Place the six sidecar blocks (five in docs/ROADMAP-PLATFORM.yaml with {{DATE}} set to the build date, one in tests/roadmap/test_verdict_persona_criteria.py); post: VP 5 OK and bin/venv-python -m pytest tests/roadmap/test_verdict_persona_criteria.py -q green."
  - "Before the PR is ready: update_rec rec-5041 through scripts.ops_data_portal, appending to its context that part 1 (snapshot isolation) is done by PLAN-persona-verdict-chain's tests/ci/test_persona_verdict_isolation.py and parts 2 and 3 belong to PLAN-persona-verdict-egress, and setting its acceptance to bin/venv-python -m pytest tests/ci/test_persona_verdict_isolation.py tests/ci/test_persona_verdict_egress.py -q (the egress test, red until that plan builds); post: VP 11. A portal refusal of that acceptance is a STOP to the plan owner, not a fallback."
  - "Execute Verification Plan -- VP 6 and VP 7 before the PR is ready; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)"
  - "After merge: VP 8 and VP 9; report the run ids and conclusions to the coordinator."
  - "Report: what was implemented, verification results"
rollback: >-
  Revert the build PR: the two workflows disappear, so no chain runs; nothing else reads scripts/personas/ and no
  persona is bound. The roadmap blocks revert with it.
