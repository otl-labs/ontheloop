    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      After merge, on the build session's own branch (restarted from main per git-ops.yaml once the build PR merged; no
      new branch), commit one head that appends a newline to each of the four
      tests/fixtures/persona_verdict/fixture_pr/*.txt files and nothing else. That path is not in git-ops.yaml
      handoff_evidence_gate.exempt_path_globs, so the head needs one full-tier run and validation_result --verify-head
      before the push (a 2 h background run; one head, so one run). Push it and open one draft fixture PR. The PR is
      authored by the operator's linked account (an admin), so the allowlist admits it.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") for the concluded run whose prepare log (mcp__github__get_job_logs) carries
      `PERSONA-VERDICT head_sha=<the fixture head>`, then mcp__github__pull_request_read(method="get_check_runs",
      owner="otl-labs", repo="ontheloop", pullNumber=<n>) on that head, then mcp__github__get_job_logs for the run's
      other jobs.
    expected: >-
      The head has exactly four check runs named persona-verdict/verdict_probe.<stem> from the GitHub Actions app,
      conclusions proceed success, revise failure, fail failure, malformed failure; the run's event is workflow_run;
      no job log shows an OIDC token request, an AWS call or an Environment; the run concluded success.
    fix_if: >-
      A missing or wrong conclusion, or a credential in any job: close the fixture PR and file the defect to the plan
      owner. A run-job checkout failure means contents: read is not enough there; an allowlisted=false line for an
      admin author means GITHUB_TOKEN cannot read the collaborator permission: both fail closed, and both are plan
      defects to report, not to work around.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      A real PR gets no persona check (nothing bound): read the first non-fixture PR head pushed after the merge whose
      persona-verdict run has concluded; then close the fixture PR unmerged.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") for a concluded run whose prepare log's PERSONA-VERDICT line names a
      change_id other than the fixture PR's;
      mcp__github__pull_request_read(method="get_check_runs", owner="otl-labs", repo="ontheloop", pullNumber=<that PR>)
      filtered to names starting persona-verdict/; then mcp__github__update_pull_request(state="closed") for the
      fixture PR.
    expected: The run concluded success with no routes, no persona-verdict/ check run is on that head, and the fixture PR is closed.
    fix_if: A persona check on a real PR means route.py bound something; fix before any add plan.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
