    expected: Prints the ok marker.
    expected_literals: [BOUNDARY_OK]
    fix_if: A pattern is missing; add it to boundary_patterns.
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-executor-boundary
  - step: 11
    phase: pre-deploy
    action: rec-5041 is narrowed, not closed (read-back of the execution step's update_rec).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; r=[x for x in make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5041')][0]; assert r['status']=='open' and 'test_persona_verdict_egress' in r['acceptance'] and 'PLAN-persona-verdict-chain' in r['context']; print('REC_5041_NARROWED')"
    expected: Prints REC_5041_NARROWED.
    fix_if: The update did not land; re-run update_rec, never edit a cache.
    hermetic: false
    graduation: not-applicable
