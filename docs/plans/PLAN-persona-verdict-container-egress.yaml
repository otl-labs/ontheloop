infrastructure_dependencies:
  - "data-pipeline (active) bundles docs/ROADMAP-PLATFORM.yaml; this plan changes tier-item text only, so no build, deploy or smoke step is owed."
acceptance_criteria:
  - "bin/venv-python -m pytest tests/personas/test_container_egress.py::test_container_on_internal_network_refuses_unlisted_hosts -q passes (rec-5549's acceptance)."
  - The governed files carry exactly the sidecar's two blocks, words-exact (approved_text verify --base origin/main exits 0).
  - >-
    validate_persona_verdict_egress passes on the live tree and each new red fixture fails with its own message. The
    container-job class is a planned change of a never-weaken rule (Decisions 181, 235): it admits only the two exact
    launcher sudo lines in a job whose floor is egress-floor-container; the no-docker rule, the self-check's
    docker_socket and sudo cases and every other covered-job rule are unchanged.
  - >-
    The build PR's persona-verdict-egress-probe run, on an eth0-placed Azure attempt, shows for egress-container
    EGRESS-FLOOR PASS with the docker version and iptables backend printed, both self-checks PASS, and CONTAINER-PROBE
    PASS with every refused case got=refused and proxy_upstream and proxy_fixed_upstream got=reached; and for
    egress-container-control raw_ip_443, unlisted_name and dns_txt_system got=reached; before merge.
  - After merge, the same on main's definition through a fixture PR (c7 ORDER's keyless proof on main).
  - test_local_twin_red_fixture passes on the CC-web twin with PERSONA_TWIN=1.
  - docs/contracts/ports.yaml has at most 500 effective lines and fits its byte budget.
  - The fast tier passes on the build head.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Unit tests for the floor variant, launcher, proxy, probes, run.py, adapter and the checks.
    command: >-
      bin/venv-python -m pytest tests/personas/test_container_egress.py tests/personas/test_egress_floor_container.py
      tests/personas/test_egress_launcher.py tests/personas/test_egress_proxy.py
      tests/personas/test_egress_container_probe.py tests/personas/test_egress_container_control.py
      tests/personas/test_egress_floor.py tests/personas/test_run.py tests/persona_hosts/local_container/test_adapter.py
      tests/checks/misc/test__persona_verdict_container.py tests/checks/misc/test__persona_verdict_floor.py
      tests/checks/misc/test_validate_persona_verdict_egress.py tests/checks/misc/test__manifest.py
      tests/checks/contracts/test_ports_verdict_chain_records.py -q
    expected: All tests pass; the twin test is skipped here.
    expected_literals:
      - passed
    fix_if: A test fails; fix the code inside scope, never the assertion (Decision 235).
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-container-egress-units
  - step: 2
    phase: pre-deploy
    action: The registered egress and chain checks pass on the live tree.
    command: >-
      bin/venv-python -c "from scripts.checks.misc.validate_persona_verdict_egress import validate_persona_verdict_egress
      as v; from scripts.checks.ci_guards.validate_persona_verdict_chain import validate_persona_verdict_chain as c;
      f=[]; v(f); c(f); assert not f, f; print('CONTAINER_EGRESS_CHECKS_OK')"
    expected: Prints the ok marker.
    expected_literals:
      - CONTAINER_EGRESS_CHECKS_OK
    fix_if: A rule refuses the live workflow or file; fix the workflow or file to the scope row's shape.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_persona_verdict_egress and validate_persona_verdict_chain, registered checks the fast and full
      tiers run on every PR and on main, so a graduated copy adds no guard.
  - step: 3
    phase: pre-deploy
    action: Approved text placed word-exactly and ports.yaml within its line and byte budgets.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-container-egress --base origin/main &&
      bin/venv-python -c "from scripts.checks.structural._classify import effective_lines;
      n=effective_lines(open('docs/contracts/ports.yaml').read()); assert n<=500, n; print('PORTS_OK', n)" &&
      bin/venv-python -c "from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as v; f=[];
      v(f); assert not f, f; print('PORTS_CONTRACT_OK')" && test $(wc -c < docs/contracts/ports.yaml) -le 50251 && echo
      PORTS_BYTES_OK
    expected: Prints the approved-text, ports-size, ports-contract and ports-bytes markers.
    expected_literals:
      - APPROVED-TEXT OK
      - PORTS_OK
      - PORTS_CONTRACT_OK
      - PORTS_BYTES_OK
    fix_if: Drift means re-place the blocks from the sidecar; over 500 lines, over the byte budget or an anchor not unique on main is a STOP to the plan owner.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-shot landing check of placed words; the line budget, the byte budget and the ports contract are registered
      checks the fast and full tiers already run.
  - step: 4
    phase: pre-deploy
    action: Local twin red fixture on the CC-web dockerd (as root; start dockerd if it is not running).
    command: >-
      PERSONA_TWIN=1 bin/venv-python -m pytest
      tests/personas/test_container_egress.py::test_local_twin_red_fixture -q -rs
    expected: >-
      The test passes (not skipped): every refused case refused from inside the container, the proxy reached, and the
      upstream result reported. If the twin cannot pull the pinned image, STOP to the plan owner with the error.
    fix_if: A refused case reached or the proxy unreachable; fix inside scope, never the expectation.
    hermetic: false
    graduation: not-applicable
  - step: 5
