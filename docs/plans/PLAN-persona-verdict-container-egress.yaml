schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: persona-verdict-container-egress
intent: >-
  A container on the digest-pinned persona image is denied network egress by default and never holds the provider key:
  it sits on an internal Docker network with no route out and no DNS, and its only peer is a non-root host proxy with one
  fixed upstream (the routed tier's provider) that adds the key and opens TLS itself, proven keyless with a red fixture
  on Actions and on the local twin, so the keyed fixture run (rec-5550) can run the image (T4.32 c7 container leg).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-container-egress.yaml
phase: >-
  T4.32 (persona foundation), c7 container leg proven keyless. c7 stays open: rec-5550 re-runs the identical red fixture
  in its keyed job and that re-run proves the container leg.
cites: [dec:48, dec:128, dec:181, dec:205, dec:212, dec:224, dec:235, dec:246, dec:273, dec:275, dec:279]
amends: []
introduces: [persona-container-launcher, persona-key-injecting-proxy]
scope:
  - file: docs/plans/approved/persona-verdict-container-egress.yaml
    action: Create
    purpose: >-
      The approved-text sidecar (Decisions 246, 279), written by this planning session and approved by the operator's
      approval run; the build never edits it. Two blocks: roadmap-t4-32-c7-container (the dated c7 amendment: CONTAINER,
      ORDER and the residual) and decision-263-update-proxy (a dated Update on Decision 263 cl.4). DECISIONS.md is in the
      gated set, so the sidecar is required.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: "Place block roadmap-t4-32-c7-container word-exactly; no other edit."
  - file: docs/DECISIONS.md
    action: Modify
    purpose: "Place block decision-263-update-proxy word-exactly; no other edit."
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Notice class (not in the gated set). PC-12's description becomes one sentence that keeps the tokens
      tests/checks/contracts/test_ports_verdict_chain_records.py pins ("Decision 263 clause 4", "assumes no AWS
      identity") and says: the workflow shell, not the persona process, reads the inference keys; on a container host it
      hands them to the launcher's key-adding proxy, whose address the shell passes to local_container's run_argv as an
      input, so the persona process never holds a key and every compute host keeps the key out of the persona process.
      SA-15's flag list adds --pids-limit, --memory and --dns and names the internal network. One terse amendment_log row
      naming this plan, PC-12 and SA-15, inserted above the 2026-11-23 local-host-root row. Relief (Decision 275 cl.3,
      never a raise): measured against main after the PLAN-persona-verdict-app-post build (rec-5486), which takes SA-11
      and SA-13 (or SA-12 and SA-10 as its fallback); this build takes rung 2 (detail moved to its owning plan by
      citation, keeping subject, location, status and owning_item) on the first of SA-12, SA-10 that the app-post build
      left untouched. A shortfall is a STOP to the plan owner (the next rung is a subject split under its own rec).
  - file: scripts/personas/egress_floor_container.py
    action: Create
    purpose: >-
      Verb egress-floor-container: the floor for a covered job that runs the image, run once as root right after the
      filter and the checkout (sudo python3 -I .../run.py egress-floor-container). Reuses egress_floor.py's chains and
      fail-closed unit unchanged, then: (1) one extra v4 EGRESS_FLOOR rule, placed after the -j EGRESS_FAIL_CLOSED jump
      and before the 172.16.0.0/12 DROP, RETURN for -o br-persona with --uid-owner of the system user
      persona-egress-proxy and -p tcp --sport 18443 (the proxy's replies; nothing else on the bridge); (2) mangle chain
      EGRESS_BRIDGE_IN jumped at INPUT position 1 for -i br-persona: RETURN only for -d 172.31.250.1 -p tcp --dport
      18443, else DROP; chain EGRESS_BRIDGE_FWD jumped at FORWARD position 1: DROP -i br-persona and -o br-persona; (3)
      leaves docker.socket, docker.service and containerd.service unmasked and running, with drop-in
      /etc/systemd/system/docker.socket.d/zz-egress-floor.conf (SocketMode=0600, SocketUser=root, SocketGroup=root),
      daemon-reload and restart, never touching /etc/docker/daemon.json (the filter's agent restores its own backup and
      restarts Docker on exit); (4) docker network create --internal --ipv6=false --subnet 172.31.250.0/24 --gateway
      172.31.250.1 -o com.docker.network.bridge.name=br-persona persona-egress; (5) docker pull of the pinned digest from
      config/persona_image.yaml and a RepoDigests read-back; (6) useradd --system persona-egress-proxy; (7) installs
      egress_launcher.py, egress_proxy.py, egress_container_probe.py and a provider_hosts snapshot of
      config/persona_verdict_egress.yaml into /usr/local/lib/persona-egress/ (root:root, 0755 dir, 0644 files), writing
      their sha256 to a root-owned manifest the launcher checks; (8) writes /etc/sudoers.d/zz-egress-floor with
      runner ALL=(ALL) !ALL first and then exactly two allow lines (runner ALL=(root) NOPASSWD:
      /usr/bin/python3 -I /usr/local/lib/persona-egress/egress_launcher.py probe, and the same with run), no wildcard,
      no SETENV, env_reset kept, checked with visudo -cf; verify() reads every piece back as root (rules equal the
      rendered rules, socket stat root:root 0600, the drop-in, the network's internal flag, subnet, gateway, bridge name
      and no IPv6, the pulled digest, the install hashes, the sudoers text, docker info LiveRestoreEnabled false) and
      prints docker version and the iptables backend; EGRESS-FLOOR PASS else FAIL and exit 1. Refuses unless uid 0.
      Stdlib only; rules, paths, ports, names and the subnet are module constants. Every input is read from the main
      checkout before any step the runner user controls.
  - file: scripts/personas/egress_launcher.py
    action: Create
    purpose: >-
      The fixed root launcher, run only as /usr/local/lib/persona-egress/egress_launcher.py through the sudoers rule
      (argv[1] is probe or run, nothing else). Imports only the stdlib and nothing from the checkout; refuses unless
      uid 0 and its own and its siblings' sha256 match the manifest. Reads one bounded JSON request on stdin (persona id
      matching ^[a-z][a-z0-9_]*$, provider prefix that is a key of the snapshot, materialised input; in run mode the key,
      never on argv or in sudo's environment). Creates its own root-owned in and events directories; takes no path,
      network, engine, image or entrypoint from the caller. Starts egress_proxy.py as persona-egress-proxy (setuid
      child, cleared groups) bound to 172.31.250.1:18443 with the provider's host as its one upstream and the key on its
      stdin; then docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user
      10001:10001 --pids-limit 256 --memory 2g --dns 0.0.0.0 --network persona-egress, the in dir read-only and the
      events dir, the pinned digest, <PREFIX>_API_BASE=http://172.31.250.1:18443 and a fixed placeholder under the key
      variable (no -e carries a key, no published port, no --add-host). probe mode runs egress_container_probe.py from
      the in dir with a fixed entrypoint and starts a decoy listener on 172.31.250.1:18444; run mode runs the image's
      own entrypoint with the persona contract. Reads results with O_NOFOLLOW, regular file only, size-capped; prints one
      JSON result to stdout; on SIGTERM or SIGINT kills the container by its fixed name and the proxy, then removes its
      directories; the existing timeout bounds the run.
  - file: scripts/personas/egress_proxy.py
    action: Create
    purpose: >-
      Stdlib key-adding reverse proxy with one fixed upstream (host:443 from the snapshot). Accepts plain HTTP from the
      container; refuses CONNECT and absolute-URI requests (405), oversized headers and bodies, and more than a bounded
      number of concurrent connections; strips client Authorization, x-api-key and Proxy-* headers, sets Host to the
      upstream, and adds the provider's auth header (Bearer for deepseek/, x-api-key for anthropic/) only when a key was
      given on stdin. Resolves the upstream once at start, refuses a loopback, link-local or private answer, and connects
      to that address with TLS verified against the upstream hostname; streams the response back. Binds only the address
      it is given; logs method, path and status, never a header value or body.
  - file: scripts/personas/egress_container_probe.py
    action: Create
    purpose: >-
      Stdlib red fixture run inside the container: unlisted_name (resolve a name), dns_txt_system (TXT through the
      container's resolver), raw_ip_443 (1.1.1.1:443), imds (169.254.169.254:80), wireserver (168.63.129.16:80),
      private (10.0.0.1:443), ipv6 (2606:4700:4700::1111:443), decoy_port (gateway:18444) refused; proxy_upstream (an
      HTTP request through <PREFIX>_API_BASE gets an HTTP status from the provider) and proxy_fixed_upstream (a request
      with an unlisted Host header still lands on the provider) reached. Prints one CONTAINER-PROBE line per case and
      CONTAINER-PROBE PASS or FAIL; never imports from the checkout.
  - file: scripts/personas/egress_container_control.py
    action: Create
    purpose: >-
      Verb egress-container-control for the unfiltered control job: pulls the pinned digest and runs the same probe on
      Docker's default bridge with no launcher, no proxy and no rules, expecting raw_ip_443, unlisted_name and
      dns_txt_system reached and reporting the rest, so each refusal in the filtered job is shown to be the control's.
  - file: scripts/personas/run.py
    action: Modify
    purpose: Register verbs egress-floor-container and egress-container-control.
  - file: src/persona_hosts/local_container/adapter.py
    action: Modify
    purpose: >-
      run_argv and run_image take an optional proxy_base_url input; when given it requires base_url_variable and a
      network other than bridge, passes base_url_variable=<url> by value and no key variable, and the adapter reads no
      provider config for it (NS.1, Decision 212 cl.3). Without it the argv is unchanged, so test_exact_argv holds. The
      docstring names the proxy path.
  - file: .github/workflows/persona-verdict-egress-probe.yml
    action: Modify
    purpose: >-
      Two keyless jobs. egress-container: the pinned filter (block, its row, switch off), checkout, the floor step sudo
      python3 -I scripts/personas/run.py egress-floor-container, the self-check, one step that pipes a fixed probe request
      into sudo /usr/bin/python3 -I /usr/local/lib/persona-egress/egress_launcher.py probe, and the final self-check with
      if: always(); no secret, id-token, Environment, artifact or job-level container. egress-container-control: no
      filter, checkout, setup-python, python3 -I scripts/personas/run.py egress-container-control. The header comment
      names the container leg.
  - file: config/persona_verdict_egress.yaml
    action: Modify
    purpose: >-
      Row for egress-container: api.deepseek.com:443 (the routed tier's provider) and
      pkg-containers.githubusercontent.com:443 (GHCR's blob host for the digest pull; ghcr.io is filter-supplied). The
      header comment names the container variant. If a refused-host log shows a different blob host, STOP to the plan
      owner.
  - file: scripts/checks/misc/_persona_verdict_container.py
    action: Create
    purpose: >-
      The container-job class (Decision 128: validate_persona_verdict_egress.py is at 486 lines). A covered job is in the
      class when its floor step runs egress-floor-container. Rules: the job's only sudo lines are the floor step and
      steps whose run is exactly one of the two launcher command lines, piped from a fixed command; no docker token
      anywhere (the existing rule is unchanged); its row lists exactly one provider host and the GHCR blob host; the
      blob host is refused in a job outside the class; the launcher steps come after the first self-check; the last step
      is the final self-check. Reads parsed YAML only; imports nothing from scripts/personas/.
  - file: scripts/checks/misc/_persona_verdict_floor.py
    action: Modify
    new_imports: [scripts.checks.misc._persona_verdict_container]
    purpose: >-
      FLOOR_VERB set gains egress-floor-container; "a step other than the egress floor runs sudo" admits the two exact
      launcher lines only in a job _persona_verdict_container classifies as a container job. Every other rule unchanged.
  - file: scripts/checks/misc/validate_persona_verdict_egress.py
    action: Modify
    new_imports: [scripts.checks.misc._persona_verdict_container]
    purpose: >-
      Call _persona_verdict_container's rules for each covered job and add the two probe jobs to the probe workflow's job
      shape table; net growth stays under 500 SLOC (crossing it is a STOP, never a raise).
  - file: scripts/checks/misc/_manifest.py
    action: Modify
    purpose: "Entry validate_persona_verdict_egress's pre_globs gains scripts/checks/misc/_persona_verdict_container.py beside _persona_verdict_floor.py."
  - file: tests/checks/misc/test__manifest.py
    action: Modify
    purpose: Its pinned pre_globs tuple for validate_persona_verdict_egress gains the new module.
  - file: tests/personas/test_container_egress.py
    action: Create
    purpose: >-
      The rec acceptance test_container_on_internal_network_refuses_unlisted_hosts (hermetic: the launcher's rendered
      network argv is --internal with IPv6 off; the docker run argv carries no key, no published port and the internal
      network; the floor's bridge chains admit only 172.31.250.1:18443 and drop every forward; the proxy sends a request
      with an unlisted Host header to its one upstream through a fake connector), plus
      test_local_twin_red_fixture (@pytest.mark.integration, skipped unless PERSONA_TWIN=1, uid 0 and a dockerd): runs
      the launcher's probe mode as root on the CC-web dockerd with the bridge rules applied and asserts every refused
      case refused and the proxy reached (upstream unreachable from the twin is reported, not failed).
  - file: tests/personas/test_egress_floor_container.py
    action: Create
    purpose: Rendered rules and their order, drop-in text, sudoers text and visudo call, install manifest, verify() read-backs, refusal when not root.
  - file: tests/personas/test_egress_launcher.py
    action: Create
    purpose: >-
      Hash refusal, mode refusal, stdin parsing and bounds, persona and provider validation, no caller-chosen value
      reaching argv, key only on the proxy's stdin, O_NOFOLLOW results read, signal cleanup, argv parity with run_argv's
      hardening flags.
  - file: tests/personas/test_egress_proxy.py
    action: Create
    purpose: Fixed upstream, CONNECT and absolute-URI refused, client auth headers stripped, key header per provider, private answer refused, bounds, no secret in logs.
  - file: tests/personas/test_egress_container_probe.py
    action: Create
    purpose: Case table, expectations and PASS/FAIL lines.
  - file: tests/personas/test_egress_container_control.py
    action: Create
    purpose: The control's argv and expectations.
  - file: tests/personas/test_run.py
    action: Modify
    purpose: The two new verbs.
  - file: tests/persona_hosts/local_container/test_adapter.py
    action: Modify
    purpose: proxy_base_url passes the base URL by value and no key; refused without base_url_variable or on bridge; unchanged argv without it.
  - file: tests/checks/misc/test__persona_verdict_container.py
    action: Create
    purpose: Live probe workflow passes; red fixtures (another sudo line, a docker token, a second provider host, the blob host outside the class, launcher before the self-check, missing final check).
  - file: tests/checks/misc/test__persona_verdict_floor.py
    action: Modify
    purpose: The container floor verb is accepted only in its class; the launcher lines are refused outside it.
  - file: tests/checks/contracts/test_ports_verdict_chain_records.py
    action: Modify
    purpose: Pin PC-12's new tokens (key-adding proxy, keeps the key out of the persona process) beside the kept ones.
