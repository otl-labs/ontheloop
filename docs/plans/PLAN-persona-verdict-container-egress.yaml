  - file: scripts/personas/egress_launcher.py
    action: Create
    purpose: >-
      The fixed root launcher, run only as /usr/local/lib/persona-egress/egress_launcher.py through the sudoers rule
      (argv[1] is probe or run, nothing else). Imports only the stdlib and nothing from the checkout; refuses unless
      uid 0 and its own and its siblings' sha256 match the manifest. Reads one JSON request on stdin, at most 4 MiB, and refuses (exit 2, one LAUNCHER-REFUSED line naming the reason,
      nothing started) any of: a top level that is not an object; duplicate keys; a key outside {persona, provider,
      input, key}; persona not matching ^[a-z][a-z0-9_]*$; provider not a prefix in the snapshot; input not an object;
      in probe mode any key field; in run mode a missing or empty key, or a key with a character outside printable
      ASCII 0x21-0x7e; invalid JSON, non-UTF-8 bytes, and a persona, provider or key that is not a string are refused the
      same way. The key never comes on argv or through sudo's environment. Takes a non-blocking flock on /run/persona-egress/lock and refuses (exit 2) when another launcher holds it or the proxy port or container name is in use. Creates, by mkdtemp under the root-only 0700 /run/persona-egress, its own in directory (root:root 0755, files 0644) and events directory (owned 10001:10001, 0700); takes no path,
      network, engine, image or entrypoint from the caller. Starts /usr/bin/python3 -I -S egress_proxy.py as persona-egress-proxy (setuid
      child, cleared groups) bound to 172.31.250.1:18443 with the provider's host as its one upstream and the key on its
      stdin; then docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --user
      10001:10001 --pids-limit 256 --memory 2g --dns 0.0.0.0 --network persona-egress, the in dir read-only and the
      events dir, the pinned digest, <PREFIX>_API_BASE=http://172.31.250.1:18443 and a fixed placeholder under the key
      variable (no -e carries a key, no published port, no --add-host). probe mode runs egress_container_probe.py from
      the in dir with a fixed entrypoint and starts a decoy listener on 172.31.250.1:18444; run mode runs the image's
      own entrypoint with the persona contract. The container's stdout and stderr are relayed to the launcher's stderr, so the per-case lines reach the job log. Reads results with O_NOFOLLOW|O_NONBLOCK, then fstat for a regular file, size-capped; prints one
      JSON result to stdout; probe mode exits 0 only when the container exited 0 and its result carries CONTAINER-PROBE PASS, else 1 (a missing or malformed result included); on SIGTERM or SIGINT kills the container by its fixed name and the proxy, then removes its
      directories; its own bound (600 s for run, 120 s for probe) kills the container by its fixed name and the proxy when it fires and exits 1. On every path after it has started the proxy or the container (the normal, signal and timeout paths) it reaps the proxy (waitpid) and confirms no process of the persona-egress-proxy uid remains, polls for up to 30 s until a successful docker ps -a -q --filter name=^/<fixed name>$ (exit 0) prints nothing (a query that exits non-zero, times out or cannot run counts as the container surviving), and exits 1 with LAUNCHER-TEARDOWN FAIL otherwise; the refusal paths (exit 2) start nothing and read back nothing (Amendment 2).
  - file: scripts/personas/egress_proxy.py
    action: Create
    purpose: >-
      Stdlib key-adding reverse proxy with one fixed upstream (host:443 from the snapshot). Accepts plain HTTP from the
      container, one request per connection: it requires exactly one valid Content-Length (duplicate or conflicting ones refused) and re-emits its own single one upstream, refuses Transfer-Encoding or both headers together
      (400/411), sends Connection: close upstream and to the client, and closes after the response; forwards only POST to the prefix's chat path in the snapshot (/chat/completions for deepseek/,
      /v1/messages for anthropic/) and answers 404 to any other method or path; refuses CONNECT and absolute-URI requests (405), oversized headers and bodies, and more than a bounded
      number of concurrent connections; strips client Authorization, x-api-key and Proxy-* headers, sets Host to the
      upstream, and adds the auth header the snapshot's auth style names for the prefix (today Bearer for deepseek/, x-api-key for anthropic/) only when a key was
      given on stdin; it refuses to start on a key with a character outside printable ASCII 0x21-0x7e. Resolves the upstream once at start, refuses a loopback, link-local or private answer, and connects
      to that address with TLS verified against the upstream hostname; streams the response back. Binds only the address
      it is given; on an upstream resolve, connect, TLS or timeout failure it answers 502; every response it makes itself
      (400, 404, 405, 411, 502) carries one header X-Persona-Egress-Proxy: refused or upstream-unreachable, which it never
      adds to a relayed upstream response and strips from upstream responses; logs method, path and status, never a header value or body.
  - file: scripts/personas/egress_container_probe.py
    action: Create
    purpose: >-
      Stdlib red fixture run inside the container: unlisted_name (resolve a name), dns_txt_system (TXT through the
      container's resolver), raw_ip_443 (1.1.1.1:443), imds (169.254.169.254:80), wireserver (168.63.129.16:80),
      private (10.0.0.1:443), ipv6 (2606:4700:4700::1111:443), decoy_port (gateway:18444) refused; proxy_upstream (a
      POST with a valid Content-Length to the snapshot's chat path for the prefix through <PREFIX>_API_BASE gets an
      unmarked HTTP status, so from the provider) and proxy_fixed_upstream (the same with an unlisted Host header still
      lands on the provider) reached; a response carrying X-Persona-Egress-Proxy counts as got=proxy-refused or
      got=upstream-unreachable, never reached, and FAILs (the twin test reports upstream-unreachable instead of failing). Prints one CONTAINER-PROBE line per case and
      CONTAINER-PROBE PASS or FAIL, exiting 0 on PASS and 1 on FAIL; never imports from the checkout.
  - file: scripts/personas/egress_container_control.py
    action: Create
    purpose: >-
      Verb egress-container-control for the unfiltered control job: pulls the pinned image@digest (the same stdlib line read) and runs the same probe on
      Docker's default bridge with no launcher, no proxy and no rules, expecting raw_ip_443, unlisted_name and
      dns_txt_system reached and reporting the rest, so each refusal in the filtered job is shown to be the control's; CONTAINER-CONTROL PASS exits 0, FAIL exits 1.
      Stdlib only. The same module holds the egress-container-request verb, which prints the fixed probe request
      ({persona: fixture probe id, provider: deepseek/, input: {}}).
