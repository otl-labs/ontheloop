  - file: scripts/personas/egress_floor_container.py
    action: Create
    purpose: >-
      Verb egress-floor-container: the floor for a covered job that runs the image, run once as root right after the
      filter and the checkout (sudo python3 -I .../run.py egress-floor-container). Reuses egress_floor.py's chains and
      fail-closed unit unchanged, then: (1) one extra v4 EGRESS_FLOOR rule, placed after the -j EGRESS_FAIL_CLOSED jump
      and before the 172.16.0.0/12 DROP, RETURN for -o br-persona with --uid-owner of the system user
      persona-egress-proxy and -p tcp --sport 18443 (the proxy's replies; nothing else on the bridge), inserted after
      step (6) creates that user, with verify() rendering the looked-up numeric uid because iptables -S prints it; (2) mangle chain
      EGRESS_BRIDGE_IN jumped at INPUT position 1 for -i br-persona: RETURN only for -d 172.31.250.1 -p tcp --dport
      18443, else DROP; chain EGRESS_BRIDGE_FWD jumped at FORWARD position 1: DROP -i br-persona and -o br-persona; the same two mangle
      chains in ip6tables with DROP only for -i br-persona and -o br-persona; (3)
      leaves docker.socket, docker.service and containerd.service unmasked and running, with drop-in
      /etc/systemd/system/docker.socket.d/zz-egress-floor.conf (SocketMode=0600, SocketUser=root, SocketGroup=root),
      daemon-reload, then stop docker.service and docker.socket, start the socket, then the service, and read back through the new socket, never touching /etc/docker/daemon.json (the filter's agent restores its own backup and
      restarts Docker on exit); (4) docker network create --internal --ipv6=false --subnet 172.31.250.0/24 --gateway
      172.31.250.1 -o com.docker.network.bridge.name=br-persona persona-egress; (5) docker pull, with its own 300 s timeout (not egress_floor's 30 s), of the pinned image@digest, read from
      config/persona_image.yaml's image and digest lines by a stdlib line read (no yaml, no new image reference), and a
      RepoDigests read-back; (6) useradd --system persona-egress-proxy; (7) installs
      egress_launcher.py, egress_proxy.py, egress_container_probe.py and one snapshot file (the pinned image@digest; for
      each provider prefix in config/persona_verdict_egress.yaml provider_hosts its host:443, its key variable and
      base-URL variable names from docs/contracts/project-configuration.yaml and inference-provider.yaml, and its auth
      style and chat path, snapshot fields keyed by provider prefix and provider-swap touchpoints; these rows are module constants, stdlib
      only, with a hermetic parity test against the three YAML files) into /usr/local/lib/persona-egress/ (root:root, 0755 dir, 0644 files), writing
      their sha256 to a root-owned manifest the launcher checks; (8) writes /etc/sudoers.d/zz-egress-floor with
      runner ALL=(ALL) !ALL first and then exactly two allow lines (runner ALL=(root) NOPASSWD:
      /usr/bin/python3 -I -S /usr/local/lib/persona-egress/egress_launcher.py probe, and the same with run), no wildcard,
      no SETENV, env_reset kept, checked with visudo -cf; (9) Amendment 2: installs and starts persona-egress-teardown.service
      (Type=oneshot, ExecStart=/bin/true, RemainAfterExit=yes, BindsTo=agent.service, After=agent.service, absolute
      binary paths and iptables -w, as egress_floor's unit) whose three ExecStop lines, run when the filter agent
      stops and independent of the launcher, each carry systemd's - prefix so each runs whatever the previous returned:
      in order, insert a mangle DROP for -i br-persona at the head of EGRESS_BRIDGE_IN (severing the container's one path
      to the proxy), kill every process of persona-egress-proxy, then timeout 30 docker kill the fixed container name
      (dockerd may be restarting from the agent's revert); verify() reads every piece back as root (rules equal the
      rendered rules, socket stat root:root 0600 for docker.sock (the drop-in sets it), /run/containerd/containerd.sock uid 0, gid 0 and no other-bits (containerd creates it 0660 itself) with no non-root member of gid 0, the drop-in, the network's internal flag, subnet, gateway, bridge name
      and no IPv6, the pulled digest, the install hashes, the sudoers text, the teardown unit (ActiveState active, BindsTo agent.service and its three ExecStop entries each with ignore_errors=yes, read by systemctl show) and egress-fail-closed.service through egress_floor's own unit read-back (ActiveState, BindsTo and hook argv), docker server version at
      least 26 (CVE-2024-29018 internal-network DNS), and every ancestor of /usr/local/lib/persona-egress and of the
      resolved /usr/bin/python3, and of the -I -S sys.path directories (the stdlib and lib-dynload), root-owned with no group or other write) and
      prints docker version, the iptables backend and docker info LiveRestoreEnabled as an observation, never a gate (Amendment 2); EGRESS-FLOOR PASS else FAIL and exit 1. Refuses unless uid 0.
      Stdlib only; rules, paths, ports, names and the subnet are module constants. Every input is read from the job's
