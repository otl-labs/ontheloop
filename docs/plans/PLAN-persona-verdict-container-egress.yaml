    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: All fast-tier checks pass.
    fix_if: A check fails; fix inside scope or STOP to the plan owner; never loosen a check (Decision 235).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      Full tier passes and --verify-head confirms it for the head. Start it as a harness-tracked background run with a
      2 h limit from the top-level session with HOME set to an empty directory; the verdict is --verify-head.
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner (main reds owned elsewhere are deferred).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      Pre-merge live proof: the build PR touches scripts/personas/egress_*.py and the probe workflow, so
      persona-verdict-egress-probe runs on it with the PR's definition. Read egress-container and
      egress-container-control, and confirm the existing five jobs stay green.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict-egress-probe.yml") for the run on the build PR's head SHA, then
      mcp__github__actions_list(method="list_workflow_jobs", resource_id=<run id>, workflow_jobs_filter={filter: "all"})
      and mcp__github__get_job_logs(owner="otl-labs", repo="ontheloop", job_id=<id>, return_content=true) for
      egress-container and egress-container-control.
    expected: >-
      The run concluded success. egress-container: EGRESS-PLACEMENT iface=eth0 with a Cloud: line reading Azure;
      EGRESS-FLOOR PASS with one line per check and the docker version and iptables backend printed; the first and final
      EGRESS-SELF-CHECK PASS (docker_socket and sudo got=refused); CONTAINER-PROBE lines with unlisted_name,
      dns_txt_system, raw_ip_443, imds, wireserver, private, ipv6 and decoy_port got=refused and proxy_upstream and
      proxy_fixed_upstream got=reached, then CONTAINER-PROBE PASS. egress-container-control: raw_ip_443, unlisted_name
      and dns_txt_system got=reached, CONTAINER-CONTROL PASS. Off-eth0 attempts follow PLAN-persona-verdict-shell-deny VP
      6's re-run rule (rerun_workflow_run, at most 10 attempts, each attempt's Cloud: line reported). Report the run id
      and attempt numbers to the plan owner.
    fix_if: >-
      Any refused case reached, a reached case refused, EGRESS-FLOOR FAIL, the bridge without a gateway address (an
      isolated gateway mode), a blob host other than the listed one in the refused-host log, or a control case refused is
      a STOP to the plan owner with the log lines; never drop or re-classify a case and never widen a rule in the build.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      Proof on main (c7 ORDER): after merge, on the build session's branch restarted from main, commit one head that
      rewrites tests/fixtures/persona_verdict/fixture_pr/proceed.txt with printf '\n%s\n' proceed and nothing else; run
      the full tier and --verify-head for that head; push and open one draft fixture PR; read its
      persona-verdict-egress-probe run.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict-egress-probe.yml") for the fixture PR's head, then list_workflow_jobs and get_job_logs
      for every job as step 7; then mcp__github__update_pull_request(state="closed") for the fixture PR.
    expected: >-
      Step 7's expected text on main's definition, and the existing five jobs green. The run id is reported to the plan
      owner and the coordinator as rec-5549's read-back and as the keyless red fixture rec-5550 re-runs; the fixture PR
      is closed unmerged.
    fix_if: As step 7; a failure here is a STOP to the plan owner, and rec-5550's build does not start.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
