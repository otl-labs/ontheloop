pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections (48, 128, 162, 181, 205, 212, 224, 235, 246, 263, 273, 275, 279)
  - The PLAN-persona-verdict-app-post build (rec-5486) is merged; otherwise STOP and tell the plan owner
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "egress_proxy.py, egress_container_probe.py and egress_launcher.py as their scope rows (stdlib only, no checkout imports)."
  - "egress_floor_container.py as its scope row, reusing egress_floor.py's chains; egress_container_control.py; register both verbs in run.py."
  - "The probe workflow's two jobs and config/persona_verdict_egress.yaml's row; baseline the five new inline bodies in config/composite_action_body_baseline.yaml (Amendment 1)."
  - "_persona_verdict_container.py, _persona_verdict_floor.py and validate_persona_verdict_egress.py; then the tests and the registry entry."
  - "ports.yaml as its scope row, measured against main at build time."
  - "Place the sidecar's two blocks word-exactly (approved_text verify), never editing the sidecar; flip implementation_declared to true."
  - Execute the Verification Plan -- run each step; loop until pass; on an unrecoverable live failure stop and report to the plan owner (Decision 55).
  - "Before merge: the operator's final-diff word (Decision 246 cl.4); squash-merge with Resolves: rec-5549 only after VP 7 passes; then VP 8 and VP 9."
  - "Report: what was implemented, verification results and run ids."
rollback: >-
  Revert the build's squash commit: the probe workflow loses its container jobs, no covered job may run a container, and
  the c7 text and Decision 263 return to their prior words; no infrastructure changes.
