slug: persona-verdict-container-egress
intent: >-
  A container on the digest-pinned persona image is denied network egress by default and never holds the provider key:
  it sits on an internal Docker network with no route out and no DNS, and its only peer is a non-root host proxy with one
  fixed upstream (the routed tier's provider) that adds the key and opens TLS itself, proven keyless with a red fixture
  on Actions and on the local twin, so the keyed fixture run (rec-5550) can run the image (T4.32 c7 container leg).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-container-egress.yaml
implementation_declared: true
phase: >-
  T4.32 (persona foundation), c7 container leg proven keyless. c7 stays open: rec-5550 re-runs the identical red fixture
  in its keyed job and that re-run proves the container leg.
