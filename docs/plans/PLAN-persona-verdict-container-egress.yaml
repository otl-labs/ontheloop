constraints:
  - No rescue agents or workaround loops (Decision 55).
  - Never loosen a check or drop a probe case to obtain green (Decisions 181, 235); a live surprise is a STOP to the plan owner.
  - No job in this plan holds a key, id-token, an Environment or a secret; persona-verdict.yml is not edited (rec-5550 owns the run job).
  - No region id, account id or unpublished host in any file (Decision 101); the launcher and proxy log no header value or body (Decision 224 cl.2).
  - The launcher imports nothing from the checkout and takes no path, network, engine, image or entrypoint from its caller; the proxy never runs as root.
  - "Decision 246 cl.4: the build PR merges only after the operator's final-diff word on the security and guard code: egress_floor_container.py, egress_launcher.py, egress_proxy.py, egress_container_probe.py, egress_container_control.py, adapter.py, the probe workflow, config/persona_verdict_egress.yaml, _persona_verdict_container.py, _persona_verdict_floor.py and validate_persona_verdict_egress.py."
