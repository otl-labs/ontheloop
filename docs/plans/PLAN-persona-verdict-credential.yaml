infrastructure_dependencies:
  - "PR 1 (terraform/bootstrap, admin-only root): the read-only ADMIN pre-merge plan of VP step 5 at the CI-green head, then the human-directed bootstrap apply of VP step 6 after the operator directs it in the ADMIN session. It must be applied BEFORE PR 3 merges, or the gated apply's own iam:GetRole after the create, and every later refresh, fail closed."
  - "PR 2 (terraform/github): CI-applied by terraform-github-apply.yml (Decision 248). The merge's push run ends neutral naming the dispatch owed; a workflow_dispatch whose gate_change names both addresses applies it after one operator approval in Actions (VP step 8). Needed before the verdict-jobs plan's workflow first names the Environment, not before PR 3."
  - "PR 3 (terraform/personal): a new role and trust route to tf-gated-apply (guard exit 2); the operator approves the gated-apply job in Actions (VP step 15). The inline policy is created in the same apply."
  - "Out of band (Decision 237 cl.3): the operator replaces the Anthropic key's value from AWS CloudShell (VP step 17). No Terraform change; independent of the three PRs."
  - "Lambda: none. compute_affected_artifacts over this scope returns no Lambda-packaged file; the telemetry writer is unchanged."
acceptance_criteria:
  - "agent-platform-github-ci-persona-verdict exists live with the apply boundary and one StringEquals trust statement bound to the persona-verdict Environment subjects and persona-verdict.yml@refs/heads/main; VP step 16 prints LIVE_GRANTS_OK and TRUST_READBACK_OK."
  - "The role can read exactly the two inference-key parameters and the telemetry writer URL parameter, and invoke the production telemetry writer only through its URL; it cannot read any other /secret/ parameter, invoke the smoke twin, call the writer directly or read Terraform state (VP step 16)."
  - "The persona-verdict Environment exists, created by an approved terraform-github-apply.yml dispatch whose apply re-planned clean, with no reviewers, a single main-only deployment policy and admin bypass off (VP step 8 and the PR 2 test cases)."
  - "No Actions or Environment secret holds either key, and only persona-verdict.yml may name the Environment or assume the role, with no pull_request, pull_request_target or workflow_call trigger (test_persona_verdict_role.py)."
  - "validate_invoke_implies_resolve accepts a telemetry-writer-only invoker that reads just the writer's URL parameter and still demands the broad read for every DuckLake writer or reader invoker (its new red tests)."
  - "The /secret/agent-platform-anthropic-api-key parameter holds a key minted in the Anthropic organisation that carries the monthly credits: version 2 after the operator's put, the operator's own words naming that organisation, and a passing smoke call on each key (VP steps 17-18)."
  - "The new Decision, the two accepted api_key rows and the simulate-fixture note match the approved sidecar word for word (approved_text verify at the recorded digest)."
  - "The two inference-key parameters have exactly two literal-ARN consumers in IAM, PlatformDev and this role, plus PlatformAdmin's SecretParameterAdmin admin grant over /secret/ (Decision 237 cl.2) as the only wildcard reader, and the parameters' header names all three (test_persona_verdict_role.py)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Precondition at each PR's build start: this plan and its sidecar are on main and the branch is current. Before PR
      3 only, the tier-selection build has landed (the resolver and the two api_key rows exist on main).
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-persona-verdict-credential.yaml &&
      git cat-file -e origin/main:docs/plans/approved/persona-verdict-credential.yaml && git merge-base --is-ancestor
      origin/main HEAD && echo PRECONDITION_OK && git cat-file -e origin/main:scripts/llm/tier_selection.py && git show
      origin/main:docs/contracts/project-configuration.yaml | grep -c 'id: ports.run_persona.litellm.api_key\.' &&
      echo PR3_PRECONDITION_OK
    expected: >-
      PRECONDITION_OK for every PR; for PR 3 also a count of 2 and PR3_PRECONDITION_OK. Red today: the plan is not on
      main (the tier-selection build is on main since before d75c76f3).
