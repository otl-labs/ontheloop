schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-credential"
intent: >-
  Build the only door from GitHub to the verdict personas' inference keys: a dedicated role,
  agent-platform-github-ci-persona-verdict, that only main's persona-verdict.yml running in a new main-only
  persona-verdict Environment can assume. It reads the DeepSeek and Anthropic keys from their /secret/ SSM parameters by
  literal ARN (Decision 237), invokes the production telemetry writer URL-only (Decision 213) and reads that writer's URL
  parameter; nothing else. No key is ever an Actions or Environment secret, and a pull_request job cannot assume the
  role. A new Decision records the read as an accepted exception to Decision 224 clause 2's Actions-secret CI home, and
  the two api_key rows in project-configuration.yaml point to it. Three PRs: (1) the apply role's IAMRolesRead
  pre-stage in terraform/bootstrap (admin root); (2) the Environment in terraform/github (CI-applied by a
  terraform-github-apply.yml dispatch naming it); (3) the role, its read-list entry, the check change the operator
  chose, the parameters' header, the Decision and the contract rows. T4.32 c1's credential leg (audit WP-04); the
  verdict-jobs plan (PLAN-persona-verdict-jobs, T8) writes the workflow that uses it. This plan writes no workflow.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-credential.yaml
phase: T4.32
scope:
  # ---------------------------------------------------------------- PR 1: bootstrap pre-stage (admin root)
  - file: terraform/bootstrap/github_ci_apply_reads.tf
    action: Modify
    purpose: >-
      PR 1. In the IAMRolesRead statement's Resource list add
      "arn:aws:iam::${var.account_id}:role/agent-platform-github-ci-persona-verdict" directly after the
      agent-platform-github-ci-trusted-github-plan entry, under a two-line comment in the existing pre-stage form:
      "Pre-staged ahead of the role's own creation (PLAN-persona-verdict-credential, the same precedent as the two
      trusted-plan entries above): the gated apply that creates the role reads it back, so this applies before that
      create merges." Nothing else in the file changes. Headroom against the file's 6,144 B managed-policy precondition:
      about 4,710 B minified on main (the trusted-github-plan plan measured 4,635 B before adding its own ARN), plus
      about 80 B here; the precondition fails closed at plan time if a parallel change used the room, and VP step 5's
      plan would then error.
  - file: tests/checks/iam_tf/test_persona_verdict_role.py
    action: Create
    purpose: >-
      CREATED BY WHICHEVER OF PR 1 AND PR 2 BUILDS FIRST (they build and merge in either order; the only hard order is
      PR 1 applied before PR 3 merges), then extended by the other and by PR 3 (rows below). The creating PR writes the
      module docstring, the shared helpers and its own cases; the other rebases onto main after that merge and adds its
      cases (scope amendment 2026-11-12). PR 1 cases: the
      IAMRolesRead Resource list in terraform/bootstrap/github_ci_apply_reads.tf names the role ARN exactly once (reuse
      the _iam_roles_read_resources shape of tests/checks/iam_tf/test_trusted_github_plan_identity.py, written locally,
      since test modules never import each other); a red case on a copy of the text with the ARN replaced. Helpers come
      from tests/checks/iam_tf/_ci_platform_role_iam.py and _platform_security_hcl.py only. Module docstring names this
      plan and the three PRs. Stays under 500 SLOC after PR 3 (precedents are 171 and 351 lines).
  - file: config/agent/verification_registry/entries/persona-verdict-role.yaml
    action: Create
    purpose: >-
      Written by the PR that creates the test file (PR 1 or PR 2, whichever builds first). Registry row for VP step 2: check_id persona-verdict-role, primitive_slot test_selector, guard_target
      tests/checks/iam_tf/test_persona_verdict_role.py, guard_symbol null, plan_slug persona-verdict-credential,
      graduated_at that PR's build date, graduated_by implement-agent, check_spec.node_id tests/checks/iam_tf/test_persona_verdict_role.py (the
      trusted-github-plan-identity.yaml shape). The creating PR owns the record; the other PRs' cases join the same
      file and so the same record, which they never edit.
  # ---------------------------------------------------------------- PR 2: the Environment (terraform/github, CI-applied)
  - file: terraform/github/environments.tf
    action: Modify
    purpose: >-
      PR 2. Append resource "github_repository_environment" "persona_verdict": repository = github_repository.this.name,
      environment = "persona-verdict", can_admins_bypass = false, no reviewers block, no wait_timer,
      deployment_branch_policy { protected_branches = false, custom_branch_policies = true }, lifecycle { prevent_destroy
      = true }; and resource "github_repository_environment_deployment_policy" "persona_verdict_main": repository =
      github_repository.this.name, environment = github_repository_environment.persona_verdict.environment,
      branch_pattern = "main". The tf_trusted_plan shape exactly. Header comment, in the file's style: the verdict persona
      jobs' Environment (PLAN-persona-verdict-credential, T4.32 c1); no reviewer, because the jobs run unattended on every
      pull request; its safety is the main-only policy (matched against GITHUB_REF, refs/heads/main under workflow_run),
      the persona-verdict role's job_workflow_ref binding in terraform/personal, and tests/checks/iam_tf/test_persona_verdict_role.py;
      never in a reviewer-gated list; no Environment secret or variable, ever; created by the first approved
      terraform-github-apply.yml dispatch naming both addresses in gate_change (Decision 248), with no UI step and no
      import block; destroying it fails open for the same reason as tf_gated_apply. No other resource changes.
  - file: tests/checks/iam_tf/test_terraform_github_import_blocks.py
    action: Modify
    purpose: >-
      PR 2. EXEMPT gains "github_repository_environment.persona_verdict" and
      "github_repository_environment_deployment_policy.persona_verdict_main", each with a new reason constant,
      _PERSONA_VERDICT_REASON = "created by the first approved terraform-github-apply.yml dispatch naming it in
      gate_change (Decision 248, PLAN-persona-verdict-credential); the remote object does not exist before it". Without
      them test_real_tree_one_import_per_managed_resource fails on the two new resources (red before the edit, by the
      environments.tf edit alone). No other line changes.
  - file: tests/checks/iam_tf/test_persona_verdict_role.py
    action: Modify
    purpose: >-
      PR 2 cases (if PR 1 has not merged when PR 2 builds, PR 2 creates the file and the registry record per the rows
      above). (a) Environment shape, parsed from terraform/github/*.tf with
      scripts.checks.ci_guards.validate_trusted_plan_environment's _blocks and _arg helpers: exactly one
      github_repository_environment whose environment is "persona-verdict", with can_admins_bypass false, no reviewers
      block, no wait_timer, protected_branches false, custom_branch_policies true and prevent_destroy true; exactly one
      github_repository_environment_deployment_policy bound to it, branch_pattern "main" and no tag_pattern. (b) No
      github_actions_environment_secret, github_actions_environment_variable or github_actions_secret resource in
      terraform/github names persona-verdict or either key variable (DEEPSEEK_API_KEY, ANTHROPIC_API_KEY). (c) Workflow
      fence over .github/workflows/*.yml loaded with scripts.verify_ci_workflow's loader: no workflow other than
      persona-verdict.yml names the Environment (string or {name:} form, any job), and no workflow names an environment
      by expression; no workflow other than persona-verdict.yml has a configure-aws-credentials step whose
      role-to-assume ends with /agent-platform-github-ci-persona-verdict; when persona-verdict.yml exists, its triggers
      include none of pull_request, pull_request_target and workflow_call. Until the verdict-jobs plan creates the file,
      (c) holds vacuously and the test says so in its docstring. Red cases on synthetic input for each predicate:
      can_admins_bypass true, a reviewers block, protected_branches true, no prevent_destroy, branch_pattern "*", a
      second policy, an environment secret named for persona-verdict, a second workflow naming the Environment, a
      persona-verdict.yml with a pull_request trigger, one with workflow_call, and another workflow assuming the role.
  # ---------------------------------------------------------------- PR 3: the role and the paperwork (terraform/personal, tf-gated-apply)
  - file: terraform/personal/oidc_persona_verdict_role.tf
    action: Create
    purpose: >-
      PR 3. Header in the oidc_trusted_github_plan_role.tf style: what the role is for (the verdict persona jobs read
      the two inference keys and write telemetry rows; Decision of this plan), why dedicated (no PR- or branch-trusted
      role may read a key), trust in one line, that the CREATE routes to tf-gated-apply (Decision 144 cl.4) and later
      trust edits are admin split-applies (Decision 223 cl.4, Decision 238 cl.6). locals { persona_verdict_environment =
      "persona-verdict" }. resource aws_iam_role github_ci_persona_verdict: name
      agent-platform-github-ci-persona-verdict, description "GitHub Actions verdict persona jobs: main's
      persona-verdict.yml in the persona-verdict Environment", permissions_boundary
      "arn:aws:iam::${var.account_id}:policy/agent-platform-github-ci-apply-boundary"; assume_role_policy jsonencode
      with ONE statement: Principal Federated aws_iam_openid_connect_provider.github_actions.arn, Action
      sts:AssumeRoleWithWebIdentity, Condition StringEquals only: "token.actions.githubusercontent.com:aud" =
      "sts.amazonaws.com"; ":sub" = flatten([for repo in local.github_repos : ["repo:${repo}:environment:${local.persona_verdict_environment}"]]);
      ":job_workflow_ref" = "otl-labs/ontheloop/.github/workflows/persona-verdict.yml@refs/heads/main". No StringLike, no
      repository_id, no session-name condition. data aws_iam_policy_document github_ci_persona_verdict, no
      source_policy_documents, four statements, every resource a string built from variables and locals (never a managed
      resource reference, validate_policy_document_plan_time_refs): InferenceKeyParameterRead (ssm:GetParameter on
      "arn:aws:ssm:${var.aws_region}:${var.account_id}:parameter/secret/agent-platform-deepseek-api-key" and
      ".../parameter/secret/agent-platform-anthropic-api-key"; literal ARN strings, Decision 237 cl.2);
      TelemetryWriterUrlParameterRead (ssm:GetParameter on
      "arn:aws:ssm:${var.aws_region}:${var.account_id}:parameter/agent-platform/ducklake/telemetry_writer_url");
      TelemetryWriterInvoke (lambda:InvokeFunctionUrl on
      "arn:aws:lambda:${var.aws_region}:${var.account_id}:function:${local.ducklake_telemetry_writer_function}" and its
      ":*" form, unconditioned); TelemetryWriterInvokeViaUrlOnly (lambda:InvokeFunction on the same two resources,
      condition Bool lambda:InvokedViaFunctionUrl ["true"]). No lambda:GetFunctionUrlConfig (the URL comes from the
      parameter), no smoke twin, no reader, no S3, no Secrets Manager. resource aws_iam_role_policy
      github_ci_persona_verdict (name agent-platform-github-ci-persona-verdict, role
      aws_iam_role.github_ci_persona_verdict.id, policy the document's json) with the 10,240 B minified-size lifecycle
      precondition copied from oidc_trusted_github_plan_role.tf. No aws_iam_role_policy_attachment.
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-
      PR 3. In ci_full_refresh_read's IAMCIRolesRead resources add
