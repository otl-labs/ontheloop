      condition key on CreateRole -- AWS rejects the trust shape. Either way the apply's always-run record write latches
      the sandbox convergence record red: stop and RCA, never retry; the heal is a forward-fix PR, then the
      human-reviewed workflow_dispatch acknowledge-and-retry (deploy-paths.yaml reconcile row), never a silent re-plan.
    hermetic: false
  - step: 16
    phase: post-deploy
    action: >-
      Live read-back of the new role, read-only, as an OPERATOR CLOUDSHELL BLOCK (Decision 256 cl.3) after PR 3's
      gated apply: its effective grants by simulation, boundary included, and its trust document by shape. No agent
      session can run it: the session user agent-platform-session (terraform/bootstrap/agent_session_user.tf) holds
      iam:GetRole, GetRolePolicy, ListRolePolicies and ListAttachedRolePolicies but no iam:Simulate* action, and its
      boundary's ceiling is its grant set; a 2026-11-14 probe from this plan's planning session (PlatformDev chain)
      was denied SimulatePrincipalPolicy and SimulateCustomPolicy. The new user was read from its HCL, not called.
      The agent posts the block below with R set to config/aws-region's value on its first line (R=<value>;) and
      asks the operator to run it in AWS CloudShell under his own sign-in; he returns the three marker lines and
      nothing else. Markers and counts only.
    command: >-  # pragma: allowlist secret -- names secret parameter ARNs, no credential
      : "${R:?set R to the config/aws-region value}"; A=$(aws sts get-caller-identity --query Account --output text); P=agent-platform-github-ci-persona-verdict; S="arn:aws:ssm:$R:$A:parameter"; F="arn:aws:lambda:$R:$A:function:agent-platform-ducklake-telemetry-writer";
      U='ContextKeyName=lambda:InvokedViaFunctionUrl,ContextKeyValues=true,ContextKeyType=boolean'; N='ContextKeyName=lambda:InvokedViaFunctionUrl,ContextKeyValues=false,ContextKeyType=boolean';
      s() { aws iam simulate-principal-policy --policy-source-arn "arn:aws:iam::$A:role/$P" --action-names "$1" --resource-arns "$2" ${3:+--context-entries "$3"} --query 'EvaluationResults[0].EvalDecision' --output text 2> /dev/null; };
      [ "$(s ssm:GetParameter "$S/secret/agent-platform-deepseek-api-key")" = allowed ] && [ "$(s ssm:GetParameter "$S/secret/agent-platform-anthropic-api-key")" = allowed ] && [ "$(s ssm:GetParameter "$S/agent-platform/ducklake/telemetry_writer_url")" = allowed ] && [ "$(s lambda:InvokeFunctionUrl "$F")" = allowed ] && [ "$(s lambda:InvokeFunction "$F" "$U")" = allowed ] &&
      [ "$(s ssm:GetParameter "$S/secret/neon-api-key")" != allowed ] && [ "$(s ssm:GetParameter "$S/agent-platform/ducklake/probe")" != allowed ] && [ "$(s lambda:InvokeFunction "$F" "$N")" != allowed ] && [ "$(s lambda:InvokeFunctionUrl "$F-smoke")" != allowed ] && [ "$(s s3:GetObject arn:aws:s3:::agent-platform-data-lake/tfstate/personal/sandbox/terraform.tfstate)" != allowed ] && [ "$(s secretsmanager:GetSecretValue "arn:aws:secretsmanager:$R:$A:secret:agent-platform-anthropic-api-key-AbCdEf")" != allowed ] && echo LIVE_GRANTS_OK || echo LIVE_GRANTS_MISMATCH;
      aws iam get-role --role-name "$P" --query Role --output json | python3 -I -c "import json,sys; r=json.load(sys.stdin); st=r['AssumeRolePolicyDocument']['Statement']; c=st[0].get('Condition', {}) if len(st) == 1 else {}; se=c.get('StringEquals', {}); L=lambda v: v if isinstance(v, list) else [v]; k='token.actions.githubusercontent.com:'; ok=len(st) == 1 and list(c) == ['StringEquals'] and sorted(se) == sorted(k+x for x in ('aud', 'sub', 'job_workflow_ref')) and L(se[k+'job_workflow_ref']) == ['otl-labs/ontheloop/.github/workflows/persona-verdict.yml@refs/heads/main'] and all(v.endswith(':environment:persona-verdict') for v in L(se[k+'sub'])) and r.get('PermissionsBoundary', {}).get('PermissionsBoundaryArn', '').endswith(':policy/agent-platform-github-ci-apply-boundary'); print('TRUST_SUBJECTS', len(L(se.get(k+'sub', [])))); print('TRUST_READBACK_OK' if ok else 'TRUST_READBACK_MISMATCH')"
    expected: >-
      LIVE_GRANTS_OK, TRUST_SUBJECTS equal to the number of local.github_repos entries, and TRUST_READBACK_OK. Post the
      three lines with the merge sha as a counts-only comment on the merged PR 3. This is the plan's behavioural
      acceptance (Decision 48); the positive assume from a real job is the verdict-jobs plan's fixture run.
    fix_if: >-
      LIVE_GRANTS_MISMATCH right after the apply: IAM propagation, re-run after a minute; still a mismatch: the boundary
      or a statement differs from the HCL, STOP and report (a mismatch on a deny line is a grant leak). TRUST_READBACK_MISMATCH:
      the live trust differs from the HCL; STOP and report, never edit the trust by hand (later trust edits are admin
      split-applies).
    hermetic: false
  - step: 17
    phase: pre-deploy
    action: >-
      ANTHROPIC KEY REPLACEMENT (operator, AWS CloudShell; card answer 2026-11-11, option A). Ask the operator at build
      start, in these words, then read the metadata back. Independent of the three PRs; due before the verdict-jobs plan's
      fixture run.
    command: >-
      echo 'ASK THE OPERATOR: "Please mint a new API key in the Anthropic Console organisation that holds the monthly
      credits, created INSIDE A WORKSPACE (Settings > Workspaces, pick or create one, ideally a dedicated one with a
      monthly spend limit, then Create key there). A key that is not scoped to a workspace is refused with a 400 that
      asks for an anthropic-workspace-id header.
      Then open AWS CloudShell in the project region and run this one command, pasting the key when asked (nothing is
      echoed):  read -rsp "New Anthropic key: " K && echo && aws ssm put-parameter --name
      /secret/agent-platform-anthropic-api-key --type SecureString --overwrite --value "$K" --query Version --output text
      && aws secretsmanager put-secret-value --secret-id agent-platform-anthropic-api-key --secret-string "$K" --query
      Name --output text; unset K   It prints the new version number and the secret name. Then revoke the old key in the Console it came from,
      and tell me here which organisation and workspace the new key is in. Never paste the key in this thread."' and after his reply
      run: aws ssm get-parameter --profile agent_platform --name /secret/agent-platform-anthropic-api-key --query
      'Parameter.[Type,Version]' --output text
    expected: >-
      The operator's own words naming the credits organisation and the workspace the key was created in, and that the
      old key is revoked; the read-back prints
      SecureString and a version of 2 or higher (metadata only: no --with-decryption, and the query prints only Type and Version;
      describe-parameters is not used because PlatformDev holds no ssm:DescribeParameters grant). The Secrets Manager twin gets the same value so the two copies
      agree until secrets-to-ssm-retire removes it.
    fix_if: >-
      Version still 1: the put did not run (wrong region or account in CloudShell); ask him to re-run it. Version above 2:
      a retry or a re-mint (for example an unscoped key replaced by a workspace-scoped one), harmless if he confirms
      the current key is the workspace-scoped one. The secretsmanager half fails: ask him to re-run the
      command whole (the SSM write is idempotent apart from the version number).
    hermetic: false
    graduation: not-applicable
  - step: 18
