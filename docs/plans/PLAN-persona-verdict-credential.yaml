constraints:
  - "Never put a key value, an account id or an ARN with one in a file, a log, a PR, a comment or the thread (Decision 101). Simulation and plan evidence is markers and counts only."
  - "Agents never apply terraform/bootstrap as a self-directed act: VP step 6 runs in an ADMIN session only after the operator directs it there; terraform/github applies only through terraform-github-apply.yml behind his approval; terraform/personal through tf-gated-apply (Decision 126, Decision 248)."
  - "Place every sidecar block word for word, filling only {{N}} and {{DATE}}; never edit the sidecar (Decision 246). Any other edit to the three bound files fails approved_text verify."
  - "No key ever becomes an Actions secret, an Environment secret, a variable or a file; nothing in this plan reads a key value except VP step 18's smoke script inside its own process."
  - "Never loosen an existing assertion (Decision 235): validate_invoke_implies_resolve gains one accepted form for telemetry-writer-only invokers, which the operator approved, and every existing case stays as it is."
  - "This plan writes no workflow. persona-verdict.yml, its trigger policy and its ports.yaml coupling row are the verdict-jobs plan's (T8) and the trigger-policy plan's (T3)."
  - "No rescue agents or workaround loops (Decision 55); a failed apply is stopped and reported, never retried with -target."
