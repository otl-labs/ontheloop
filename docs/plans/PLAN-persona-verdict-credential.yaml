      DeepSeek's prepaid credit; the operator's word at build start covers them). The script resolves each role's SSM
      parameter, key variable and model from the contracts (its --role interface since f47fb8ce)
    command: >-
      for r in primary warm_fetched_escape_hatch; do AWS_PROFILE=agent_platform bin/venv-python -m
      scripts.smoke_test_inference_credentials --role "$r" 2>&1 | grep -E '^(PASS|FAIL) ' | cut -d' ' -f1-2; done
    expected: >-
      Two lines, 'PASS [primary]' (the DeepSeek key) and 'PASS [warm_fetched_escape_hatch]' (the Anthropic key). Red
      before step 17 only if the old Anthropic key had no credit.
    fix_if: >-
      FAIL [warm_fetched_escape_hatch] after step 17: the new key or its organisation is wrong; ask the operator to
      check the key's workspace and credit. FAIL [primary]: report the error class only (never paste error text, which
      can carry an ARN) and ask the operator whether the DeepSeek key needs replacing too. A provider 400 invalid_request_error that asks for an
      anthropic-workspace-id header means the Anthropic key is not workspace-scoped: re-run step 17 with a key minted
      inside a workspace. Any other 400 can be request shape, which belongs to the LiteLLM transport plan's owner, not
      this plan. Never print or log a key.
    hermetic: false
    graduation: not-applicable
  - step: 19
    phase: pre-deploy
    action: Fast tier on each PR head (advisory locally; PR CI is authoritative, Decision 73)
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Diagnose and fix on the branch; never skip, disable or quarantine a test (Decision 235).
    hermetic: false
    graduation: not-applicable
  - step: 20
    phase: pre-deploy
    action: Full tier before each PR's hand-off (handoff_policy), started in the background from the top-level session with a 2 h limit
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports a completed full run for HEAD with exit 0.
    fix_if: A red full tier blocks hand-off; fix and rerun from the start. A timeout is blocked, never a warning.
    hermetic: false
    graduation: not-applicable
