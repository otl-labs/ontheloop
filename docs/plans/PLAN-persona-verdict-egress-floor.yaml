      v(f); assert not f, f; print('PORTS_CONTRACT_OK')" && test $(wc -c < docs/contracts/ports.yaml) -le 50251 && echo
      PORTS_BYTES_OK
    expected: Prints the approved-text, ports-size, ports-contract and ports-bytes markers.
    expected_literals:
