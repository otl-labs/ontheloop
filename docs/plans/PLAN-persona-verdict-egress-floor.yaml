      tests/personas/test_egress_fail_closed.py
      tests/personas/test_egress_fail_closed_verdict.py tests/personas/test_egress_probe.py tests/personas/test_run.py
      tests/checks/misc/test_validate_persona_verdict_egress.py tests/checks/misc/test__persona_verdict_floor.py
      tests/checks/misc/test__manifest.py tests/checks/ci_guards/test__persona_verdict_keyed.py
      tests/checks/ci_guards/test_validate_persona_verdict_chain.py tests/ci/test_persona_verdict_egress.py -q
    expected: All tests pass.
    expected_literals:
      - passed
    fix_if: A test fails; fix the code inside scope, never the assertion (Decision 235).
