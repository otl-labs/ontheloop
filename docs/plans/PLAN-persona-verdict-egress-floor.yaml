acceptance_criteria:
  - "bin/venv-python -m pytest tests/ci/test_persona_verdict_azure_openings.py -q passes (rec-5362's acceptance)."
  - The governed files carry exactly the sidecar's three blocks (approved_text verify --base origin/main exits 0).
  - >-
    validate_persona_verdict_egress passes on the live tree and each new red fixture fails with its own message; the
    check now requires disable-sudo-and-containers false and the floor step, because the floor, not the filter, revokes
    sudo and containers (a planned change of the inverted assertion, not a weakening: sudo stays asserted refused by the
    self-check, the probe and the final check).
  - >-
    The build PR's persona-verdict-egress-probe run, on an eth0-placed Azure attempt, shows EGRESS-FLOOR PASS, EGRESS-PROBE
    PASS with dns_tcp_azure, wireserver_http, imds, ipv6, sudo and docker_socket got=refused, EGRESS-CONTROL PASS with
    wireserver_http, imds and docker_socket got=reached, and EGRESS-FAIL-CLOSED-VERDICT PASS, before merge.
  - >-
    After merge, a fixture PR's persona-verdict run on main's definition has smoke and refusal green with EGRESS-FLOOR
    PASS, both self-checks PASS and the key steps green (the runner works under the floor), and its probe run is green
    as above.
  - docs/contracts/ports.yaml has at most 500 effective lines and fits its byte budget.
  - The fast tier passes on the build head.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Unit tests for the floor, the drill and verdict verbs, the probe cases, run.py, both checks and the live tree.
    command: >-
      bin/venv-python -m pytest tests/ci/test_persona_verdict_azure_openings.py tests/personas/test_egress_floor.py
      tests/personas/test_egress_revert_drill.py tests/personas/test_egress_fail_closed.py
      tests/personas/test_egress_fail_closed_verdict.py tests/personas/test_egress_probe.py tests/personas/test_run.py
      tests/checks/misc/test_validate_persona_verdict_egress.py tests/checks/misc/test__persona_verdict_floor.py
      tests/checks/misc/test__manifest.py tests/checks/ci_guards/test__persona_verdict_keyed.py
      tests/ci/test_persona_verdict_egress.py -q
    expected: All tests pass.
    expected_literals:
      - passed
    fix_if: A test fails; fix the code inside scope, never the assertion (Decision 235).
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-egress-floor-units
  - step: 2
    phase: pre-deploy
    action: Both registered checks pass on the live tree.
    command: >-
      bin/venv-python -c "from scripts.checks.misc.validate_persona_verdict_egress import validate_persona_verdict_egress
      as v; from scripts.checks.ci_guards.validate_persona_verdict_chain import validate_persona_verdict_chain as c;
      f=[]; v(f); c(f); assert not f, f; print('EGRESS_FLOOR_CHECKS_OK')"
    expected: Prints the ok marker.
    expected_literals:
      - EGRESS_FLOOR_CHECKS_OK
    fix_if: A rule refuses the live workflow or file; fix the workflow or file to the scope row's shape.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_persona_verdict_egress and validate_persona_verdict_chain, registered checks the fast and full
      tiers run on every PR and on main, so a graduated copy adds no guard.
  - step: 3
    phase: pre-deploy
    action: Approved text placed word-exactly and ports.yaml within its line and byte budgets.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-egress-floor --base origin/main &&
      bin/venv-python -c "from scripts.checks.structural._classify import effective_lines;
      n=effective_lines(open('docs/contracts/ports.yaml').read()); assert n<=500, n; print('PORTS_OK', n)" &&
      bin/venv-python -c "from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as v; f=[];
      v(f); assert not f, f; print('PORTS_CONTRACT_OK')"
    expected: Prints the approved-text, ports-size and ports-contract markers.
    expected_literals:
      - APPROVED-TEXT OK
      - PORTS_OK
      - PORTS_CONTRACT_OK
    fix_if: Drift means re-place the blocks from the sidecar; over 500 lines, over the byte budget or an anchor not unique on main is a STOP to the plan owner.
    hermetic: true
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: All fast-tier checks pass.
    fix_if: A check fails; fix inside scope or STOP to the plan owner; never loosen a check (Decision 235).
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      Full tier passes and --verify-head confirms it for the head. The full tier outlasts the foreground cap: start it as
      a harness-tracked background run with a 2 h limit from the top-level session with HOME set to an empty directory;
      the verdict is --verify-head.
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner (main reds owned elsewhere are deferred).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Pre-merge live proof: the build PR touches the probe workflow and scripts/personas/egress_*.py, so
      persona-verdict-egress-probe runs on it with the PR's definition. Read all four jobs.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict-egress-probe.yml") for the run on the build PR's head SHA, then
      mcp__github__actions_list(method="list_workflow_jobs", resource_id=<run id>, workflow_jobs_filter={filter: "all"})
      and mcp__github__get_job_logs(owner="otl-labs", repo="ontheloop", job_id=<id>, return_content=true) for
      egress-probe, egress-control and egress-fail-closed-verdict (egress-fail-closed has no log by design).
    expected: >-
      The run concluded success. egress-probe: its first probe line is EGRESS-PLACEMENT iface=eth0 with a Cloud: line
      reading Azure; the floor step prints one EGRESS-FLOOR line per check and EGRESS-FLOOR PASS; listed got=reached,
      dns_tcp_azure, wireserver_http, imds, ipv6, sudo, docker_socket and every other refused-expected case got=refused,
      EGRESS-PROBE PASS; the final check prints EGRESS-SELF-CHECK PASS; actions/setup steps and the job's log upload
      complete (the runner works under the floor). egress-control: wireserver_http, imds and docker_socket got=reached,
      a got= line for dns_tcp_azure, VENDOR-LIST ok, EGRESS-CONTROL PASS. egress-fail-closed-verdict: its observed line
      shows egress-fail-closed not success, drill-floor and drill-self-check success and drill-fail-closed neither
      success nor failure, then EGRESS-FAIL-CLOSED-VERDICT PASS. Attempts placed off eth0 follow
      PLAN-persona-verdict-shell-deny VP 6's re-run rule (rerun_failed_jobs, at most 10 attempts, report each attempt's
      Cloud: line); report the run id and attempt numbers to the plan owner.
    fix_if: >-
      Any refused-expected case reached, a control case refused, EGRESS-FLOOR FAIL, a step the runner needs failing
      under the floor, or a verdict observed line in another shape (GitHub may record a cut-off job or step
      differently: the observed line is the read-back) is a STOP to the plan owner with the log lines; never drop or
      re-classify a case, and never widen the floor or the verdict rule in the build.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      Proof on main: after merge, on the build session's branch restarted from main, commit one head that rewrites
      tests/fixtures/persona_verdict/fixture_pr/proceed.txt with printf '\n%s\n' proceed and nothing else; run the full
      tier and --verify-head for that head; push and open one draft fixture PR authored by the operator's linked
      account; read the persona-verdict run (workflow_run of the fixture PR) and the persona-verdict-egress-probe run
      on the fixture PR's head.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") and (resource_id="persona-verdict-egress-probe.yml") for the fixture PR's head,
      then list_workflow_jobs (workflow_jobs_filter {filter: "all"}) and get_job_logs for smoke, refusal and the four
      probe jobs as step 6; then mcp__github__update_pull_request(state="closed") for the fixture PR.
    expected: >-
      persona-verdict: smoke and refusal concluded success on an eth0/Azure attempt; each shows EGRESS-FLOOR PASS, the
      first and final EGRESS-SELF-CHECK PASS, and its key steps green (smoke's two inference-smoke steps, refusal's
      key-refusal), so the runner, setup-python, the wheelhouse download and the role assumption all work under the
      floor. The probe run meets step 6's expected text on main's definition. The run ids are reported to the plan owner
      and the coordinator as rec-5362's read-back; the fixture PR is closed unmerged.
    fix_if: As step 6; a failure here is a STOP to the plan owner, and the E5 post-job build (rec-5486) does not start.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: rec-5362 closed by the build's squash-merge Resolves trailer once its acceptance holds.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(),
      ['rec-5362']); print(r[0]['id'], r[0]['status'])"
    expected: Prints rec-5362 closed.
    fix_if: Still open after the closure job ran; read ci.yml's closure job log and report to the plan owner.
    hermetic: false
    graduation: not-applicable
