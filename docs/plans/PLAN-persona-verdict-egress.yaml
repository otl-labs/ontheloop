    red_green_expectation: red before (blocks not placed), green after
constraints:
  - Place every governed block from the sidecar with {{DATE}} set to the build's UTC date; change no other line of the three governed files. A block whose before-text no longer matches main exactly once (another plan landed on the same line) is a STOP to the plan owner, never a hand-merge.
  - No workflow, script, terraform, Environment or IAM change; no job assumes a role or reads a key (T4.32 c7 as amended here).
  - "docs/contracts/ports.yaml: at or under 500 effective lines (Decision 166); 497 after placement on main 3e8a4f86, so no re-flow is needed (scout r5 SPIRIT note on Decision 128 adopted); rec-5274 owns the real size relief."
  - docs/decisions-index.json is regenerated by its generator if the Decision Updates change it; it is never hand-edited.
  - No rescue agents or workaround loops (Decision 55); never skip or loosen a test or check to get green (Decision 235).
