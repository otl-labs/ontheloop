schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-egress"
intent: >-
  Plan 4a of the PLAN-persona-verdict-* chain (T4.32 c7 and c1's credential leg): settle in approved text how the
  verdict jobs' network egress is denied before any job holds a key, and record the verdict chain shell's structural
  assumptions. T4.32 c7 gains the endpoints the runner itself needs (GitHub's OIDC token endpoint and the Actions
  artifact, cache, results and action-download services), names the shell mechanism (a SHA-pinned egress filter in
  block mode as the first step of every job in .github/workflows/persona-verdict*.yml that holds id-token: write or
  reads a secret other than its GITHUB_TOKEN) and the container
  mechanism (an internal network whose only route out is an allowlisting proxy), and orders the legs as the operator
  ruled on 2026-11-17: the shell leg, proven on a credential-free job, gates the first assumption of the persona-verdict
  role; the container leg gates the first job that runs the digest-pinned image while holding a key. The T4.32 egress
  hint is re-cut into five plans. Decision 263 gets a dated note naming the plans that now discharge its clause 4 and
  Coverage line, and Decision 271 (with a T4.2 c9 bracket) one moving the App from this plan to the App-grant and
  App-posting plans (rec-5351). ports.yaml gains the chain's structural assumptions (rec-5249) and Decision 263 clause 4's
  shell-reads-the-key coupling. Serves NS.1 (couplings recorded as Decision-held port rows) and keeps NS.9's gates
  ahead of any key, without widening any credential.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-persona-verdict-egress.yaml
phase: >-
  T4.32 (persona foundation), c7 and c1's credential leg. Neither closes here: c7 is met only when both legs are proven
  (shell in PLAN-persona-verdict-shell-deny, container in PLAN-persona-verdict-fixture-run).
cites: [dec:177, dec:212, dec:246, dec:263, dec:271]
scope:
  - file: docs/plans/approved/persona-verdict-egress.yaml
    action: Create
    purpose: >-
      The approved-text sidecar (Decision 246), written by this planning session and approved by the operator's
      approval run; the build never edits it.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's seven roadmap blocks: roadmap-t4-32-intent-annotation (a dated bracket after the chain
      annotation in T4.32's intent: the role-assumption gate now waits for PLAN-persona-verdict-shell-deny's red fixture
      on main, and the "six" plans read as the hints now name); roadmap-t4-32-c7 (a dated amendment on T4.32 c7: endpoints,
      mechanisms, the order of the legs, met only when both legs are proven); roadmap-t4-32-egress-hints (the
      PLAN-persona-verdict-egress hint replaced by five hints: egress wording, shell deny, first key read, App grant,
      App posting); roadmap-t4-32-fixture-run-hint (adds c7's container leg and the new after-list);
      roadmap-t4-32-rationale and roadmap-t4-2-umbrella-hint (the stale "verdict-jobs" wording); roadmap-t4-2-c9-repoint
      (a dated bracket after T4.2 c9's check-origin amendment: the App and its key custody land in
      PLAN-persona-verdict-app-grant, the token mint in PLAN-persona-verdict-app-post; rec-5351). No status changes.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the sidecar's blocks decision-263-update and decision-271-update: one dated blockquote Update after each
      Decision's Related line (decision-entry.yaml amendment_forms, Decision 177). Decision 271's re-points its clause 4,
      Coverage, app-key-exposed reversal and the gates.verdict_app.app_id row note (docs/contracts/project-configuration.yaml,
      left untouched) from PLAN-persona-verdict-egress to PLAN-persona-verdict-app-grant and PLAN-persona-verdict-app-post
      (rec-5351). No clause, Coverage or reversal text changes.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's three ports blocks: ports-amendment-log (a new amendment_log entry), ports-pc-12
      (coupling_findings PC-12, accepted, owning dec-263) and ports-sa-14 (structural_assumptions SA-14, the verdict chain
      shell; rec-5249). Effective lines stay at or under 500 (494 on main 3e8a4f86, 497 after).
  - file: tests/checks/contracts/test_ports_verdict_chain_records.py
    action: Create
    purpose: >-
      Pins the two records as lasting rules, no status pinned (Decision 244 clause 4): test_sa14_records_the_verdict_chain_shell
      (SA-14 exists once, location scripts/personas/, owning_item T4.24:c9, and its assumption names persona-verdict.yml,
      workflow_run, head_sha, the Checks API, github-actions[bot] and docs/plans/) and
      test_pc12_records_decision_263_clause_4 (PC-12 exists once, its ports include verdict_plane, persona_compute_host
      and secrets, owning_item dec-263, its location file exists and its description names "Decision 263 clause 4" and
      "assumes no AWS identity"). Reads ports.yaml with yaml only, beside the other ports.yaml tests.
bundled_recommendations: [rec-5249, rec-5351]
followon_recs: []
closes_criteria: []
infrastructure_dependencies:
  - >-
    None. No .tf, workflow, script or Environment file is in scope; no role is assumed and no key is read.
    compute_affected_artifacts(<scope>) names only data-pipeline (status active), through docs/ROADMAP-PLATFORM.yaml,
    which it packages as an asset; this plan changes tier-item text only there, so no build, deploy or smoke step is
    owed (the PLAN-persona-verdict-override and PLAN-verdict-persona-roadmap-regrounding disposition).
acceptance_criteria:
  - The three governed files carry exactly the sidecar's twelve blocks (approved_text verify --base origin/main exits 0).
  - tests/checks/contracts/test_ports_verdict_chain_records.py passes on the branch and fails on its base (SA-14 and PC-12 absent).
  - docs/contracts/ports.yaml has at most 500 effective lines.
  - rec-5249's and rec-5351's acceptances pass, and after merge both read closed (Resolves trailer).
  - The fast tier passes on the build head.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The two ports records are pinned by their test.
    command: bin/venv-python -m pytest tests/checks/contracts/test_ports_verdict_chain_records.py -q
    expected: Both tests pass.
    expected_literals: [2 passed]
    fix_if: A test fails; re-place the ports blocks from the sidecar, never edit the sidecar or loosen the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-ports-records
  - step: 2
    phase: pre-deploy
    action: Approved text placed word-exactly; ports.yaml within its budget; rec-5249's and rec-5351's acceptances hold.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-egress --base origin/main &&
      bin/venv-python -c "from scripts.checks.structural._classify import effective_lines; n=effective_lines(open('docs/contracts/ports.yaml').read()); assert n<=500, n; print('PORTS_OK', n)" &&
      grep -q "scripts/personas/" docs/contracts/ports.yaml && grep -q "persona-verdict.yml" docs/contracts/ports.yaml && echo REC_5249_ACCEPTANCE_OK &&
      grep -q 'rec-5351: the egress hint is re-cut' docs/ROADMAP-PLATFORM.yaml && awk '/^## Decision 271:/{f=1} f&&/^---$/{exit} f' docs/DECISIONS.md | grep -q 'Update.*PLAN-persona-verdict-app-grant' && echo REC_5351_ACCEPTANCE_OK
    expected: Prints APPROVED-TEXT OK, then the ports marker with the line count, then the rec-5249 and rec-5351 markers.
    expected_literals: [APPROVED-TEXT OK, PORTS_OK, REC_5249_ACCEPTANCE_OK, REC_5351_ACCEPTANCE_OK]
    fix_if: Any drift; re-place the blocks from the sidecar, never edit the sidecar; over 500 lines or an anchor that no longer matches main is a STOP to the plan owner.
    hermetic: true
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: The ports contract's schema and cross-reference rules accept PC-12 and SA-14 (port ids, owning_item dec-263).
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as v; f=[]; v(f); assert not f, f; print('PORTS_CONTRACT_OK')"
    expected: Prints the ports-contract ok marker.
    expected_literals: [PORTS_CONTRACT_OK]
    fix_if: A ports rule refuses PC-12 or SA-14 (for example an unknown port id or owning_item form); STOP to the plan owner with the message.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_ports_contract, a registered check the fast and full tiers already run on every PR and on
      main, so a graduated copy would add no guard.
  - step: 4
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: All fast-tier checks pass.
    fix_if: A check fails; fix inside scope or STOP to the plan owner; never loosen a check (Decision 235).
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Full tier passes and --verify-head confirms it for the head.
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner (main reds owned elsewhere are deferred, not fixed here).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: rec-5249 and rec-5351 are closed by the squash merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; r,_=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-5249','rec-5351']); assert len(r)==2 and all(x['status']=='closed' for x in r), r; print('RECS_CLOSED')"
    expected: Prints RECS_CLOSED.
    fix_if: Still open after ci.yml's closure job; read that job's log and close through the portal's update_rec with the merge SHA as evidence.
    hermetic: false
    graduation: not-applicable
test_obligations:
