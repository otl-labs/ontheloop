schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-egress"
intent: >-
  Plan 4a of the PLAN-persona-verdict-* chain (T4.32 c7 and c1's credential leg): settle in approved text how the
  verdict jobs' network egress is denied before any job holds a key, and record the verdict chain shell's structural
  assumptions. T4.32 c7 gains the endpoints the runner itself needs (GitHub's OIDC token endpoint and the Actions
  artifact, cache, results and action-download services), names the shell mechanism (a SHA-pinned egress filter in
  block mode as the first step of every job that names an Environment or holds id-token: write) and the container
  mechanism (an internal network whose only route out is an allowlisting proxy), and orders the legs as the operator
  ruled on 2026-11-17: the shell leg, proven on a credential-free job, gates the first assumption of the persona-verdict
  role; the container leg gates the first job that runs the digest-pinned image while holding a key. The T4.32 egress
  hint is re-cut into five plans. Decision 263 gets a dated note naming the plans that now discharge its clause 4 and
  Coverage line. ports.yaml gains the chain's structural assumptions (rec-5249) and Decision 263 clause 4's
  shell-reads-the-key coupling. Serves NS.3 (an independent verdict plane) without widening any credential.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-persona-verdict-egress.yaml
phase: >-
  T4.32 (persona foundation), c7 and c1's credential leg. Neither closes here: c7 is met only when both legs are proven
  (shell in PLAN-persona-verdict-shell-deny, container in PLAN-persona-verdict-fixture-run).
cites: [dec:177, dec:212, dec:246, dec:263]
scope:
  - file: docs/plans/approved/persona-verdict-egress.yaml
    action: Create
    purpose: >-
      The approved-text sidecar (Decision 246), written by this planning session and approved by the operator's
      approval run; the build never edits it.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's five roadmap blocks: roadmap-t4-32-c7 (a dated amendment on T4.32 c7: endpoints,
      mechanisms, the order of the legs, met only when both legs are proven); roadmap-t4-32-egress-hints (the
      PLAN-persona-verdict-egress hint replaced by five hints: egress wording, shell deny, first key read, App grant,
      App posting); roadmap-t4-32-fixture-run-hint (adds c7's container leg and the new after-list);
      roadmap-t4-32-rationale and roadmap-t4-2-umbrella-hint (the stale "verdict-jobs" wording). No status changes.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the sidecar's block decision-263-update: one dated blockquote Update after Decision 263's Related line
      (decision-entry.yaml amendment_forms, Decision 177). No clause, Coverage or reversal text changes.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's four ports blocks: ports-amendment-log (a new amendment_log entry), ports-pc-12 (coupling_findings PC-12,
      accepted, owning dec-263), ports-sa-03-reflow (SA-03 onto one flow line, value unchanged) and ports-sa-14
      (structural_assumptions SA-14, the verdict chain shell; rec-5249). Effective lines stay at or under 500.
  - file: tests/ci/test_persona_verdict_ports_records.py
    action: Create
    purpose: >-
      Pins the two records: test_sa14_records_the_verdict_chain_shell (SA-14 exists once, location scripts/personas/,
      status open, owning_item T4.24:c9, and its assumption names persona-verdict.yml, workflow_run, head_sha, the
      Checks API, github-actions[bot] and docs/plans/) and test_pc12_records_decision_263_clause_4 (PC-12 exists once,
      ports exactly [verdict_plane, persona_compute_host], status accepted, owning_item dec-263, its location file exists and
      its description names "Decision 263 clause 4" and "assumes no AWS identity"). Reads ports.yaml with yaml only.
bundled_recommendations: [rec-5249]
followon_recs: []
infrastructure_dependencies:
  - >-
    None. No .tf, workflow, script, Environment or Lambda-packaged file is in scope; no role is assumed and no key is
    read. docs/ROADMAP-PLATFORM.yaml and docs/DECISIONS.md carry approved text only (no build, deploy or smoke step).
acceptance_criteria:
  - The three governed files carry exactly the sidecar's ten blocks (approved_text verify --base origin/main exits 0).
  - tests/ci/test_persona_verdict_ports_records.py passes on the branch and fails on its base (SA-14 and PC-12 absent).
  - docs/contracts/ports.yaml has at most 500 effective lines and SA-03's parsed value is unchanged.
  - rec-5249's acceptance passes, and after merge rec-5249 reads closed (Resolves trailer).
  - The fast tier passes on the build head.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The two ports records are pinned by their test.
    command: bin/venv-python -m pytest tests/ci/test_persona_verdict_ports_records.py -q
    expected: Both tests pass.
    expected_literals: [2 passed]
    fix_if: A test fails; re-place the ports blocks from the sidecar, never edit the sidecar or loosen the test.
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-ports-records
  - step: 2
    phase: pre-deploy
    action: Approved text placed word-exactly; ports.yaml within its budget with SA-03's value unchanged; rec-5249's acceptance holds.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-egress --base origin/main &&
      bin/venv-python -c "import subprocess,yaml; from scripts.checks.structural._classify import effective_lines; t=open('docs/contracts/ports.yaml').read(); n=effective_lines(t); a={r['id']:r for r in yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/ports.yaml'],capture_output=True,text=True).stdout)['structural_assumptions']}; b={r['id']:r for r in yaml.safe_load(t)['structural_assumptions']}; assert n<=500, n; assert a['SA-03']==b['SA-03']; print('PORTS_OK', n)" &&
      grep -q "scripts/personas/" docs/contracts/ports.yaml && grep -q "persona-verdict.yml" docs/contracts/ports.yaml && echo REC_5249_ACCEPTANCE_OK
    expected: Prints APPROVED-TEXT OK, then the ports marker with the line count, then the rec-5249 marker.
    expected_literals: [APPROVED-TEXT OK, PORTS_OK, REC_5249_ACCEPTANCE_OK]
    fix_if: Any drift; re-place the blocks from the sidecar, never edit the sidecar; over 500 lines or an anchor that no longer matches main is a STOP to the plan owner.
    hermetic: true
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: The ports contract's schema and cross-reference rules accept PC-12 and SA-14 (port ids, owning_item dec-263).
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as v; f=[]; v(f); print('FAILED', f) if f else print('PORTS_CONTRACT_OK')"
    expected: Prints the ports-contract ok marker.
    expected_literals: [PORTS_CONTRACT_OK]
    fix_if: A ports rule refuses PC-12 or SA-14 (for example an unknown port id or owning_item form); STOP to the plan owner with the message.
    hermetic: true
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: All fast-tier checks pass.
    fix_if: A check fails; fix inside scope or STOP to the plan owner; never loosen a check (Decision 235).
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Full tier passes and --verify-head confirms it for the head.
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner (main reds owned elsewhere are deferred, not fixed here).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: rec-5249 is closed by the squash merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; r,_=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-5249']); assert r and r[0]['status']=='closed', r; print('REC_5249_CLOSED')"
    expected: Prints REC_5249_CLOSED.
    fix_if: Still open after ci.yml's closure job; read that job's log and close through the portal's update_rec with the merge SHA as evidence.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/contracts/ports.yaml
    behavior: SA-14 records the verdict chain shell and PC-12 records Decision 263 clause 4's coupling
    verification_step: 1
    test_selector: tests/ci/test_persona_verdict_ports_records.py
    red_green_expectation: red before (SA-14 and PC-12 absent), green after
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: exactly the five approved roadmap blocks are placed
    verification_step: 2
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-egress --base origin/main
    red_green_expectation: red before (blocks not placed), green after
  - source: docs/DECISIONS.md
    behavior: exactly the approved Decision 263 Update is placed
    verification_step: 2
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-egress --base origin/main
    red_green_expectation: red before (block not placed), green after
constraints:
  - Place every governed block from the sidecar with {{DATE}} set to the build's UTC date; change no other line of the three governed files. A block whose before-text no longer matches main exactly once (another plan landed on the same line) is a STOP to the plan owner, never a hand-merge.
  - No workflow, script, terraform, Environment or IAM change; no job assumes a role or reads a key (T4.32 c7 as amended here).
  - "docs/contracts/ports.yaml: at or under 500 effective lines (Decision 166); the SA-03 re-flow is a one-time bridge, and rec-5274 owns the real size relief (decision-scout SPIRIT note on Decision 128)."
  - docs/decisions-index.json is regenerated by its generator if the Decision 263 Update changes it; it is never hand-edited.
  - No rescue agents or workaround loops (Decision 55); never skip or loosen a test or check to get green (Decision 235).
