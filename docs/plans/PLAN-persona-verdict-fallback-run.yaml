pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Build start: confirm rec-5549, rec-5550 and rec-5615 are merged and config/persona_image.yaml source_commit descends from rec-5615's merge, else STOP. Re-measure with bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-persona-verdict-fallback-run.yaml; if persona-verdict.yml would pass 500 effective lines with run-fallback added, STOP to the plan owner (a reusable-workflow split changes job_workflow_ref, which Decision 263 cl.2 trust pins, so it needs the operator)."
  - Proxy counts line, launcher upstream field and --role, snapshot role field, run_argv role (egress_proxy.py, egress_launcher.py, egress_floor_container.py, adapter.py) with their tests and the install manifest hash.
  - keyed_run.py role and primary_outage output with tests; tests/personas/test_fallback_chain.py.
  - post_verdict.py fallback choice with tests.
  - Workflow run-fallback job, run outputs and PERSONA_ROLE, post's fallback download; egress row, evidence row, baseline rows; guard modules and tests.
  - Execute the Verification Plan; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results'
