schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-fallback-run"
intent: >-
  Solves rec-5559 (Decision 173's fallback leg for keyed verdict jobs). When the proxy itself sees the primary
  provider fail during the run job, a separate run-fallback job runs the same persona once on the
  warm_fetched_escape_hatch role, with its own one-host egress row, its own key read and its own proxy, and post
  judges that result and says in the check title that the fallback role served it. So a primary outage stops failing
  a verdict check before any persona's gating flip, and the role is chosen per run, never mid-run. Until KEYED_IF
  widens, run and run-fallback serve fixture runs only.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-fallback-run.yaml
phase: >-
  T4.32 (persona foundation): c7 EGRESS container leg's escape hatch ("a re-run on the fallback role", approved
  text docs/plans/approved/persona-verdict-container-egress.yaml); owed before the first verdict persona flip
  (T4.28-T4.30), not before add or dual-run.
cites: [dec:55, dec:173, dec:205, dec:235, dec:263, dec:275]
amends: []
introduces: []
scope:
  - file: .github/workflows/persona-verdict.yml
    action: Modify
    purpose: >-
      prepare's outputs gain fallback_drill: ${{ steps.route.outputs.fallback_drill }}. run gains job outputs exactly
      {primary_outage: "${{ steps.<run's PERSONA step id>.outputs.primary_outage }}"} (the id rec-5550's build pins);
      its PERSONA step env gains PERSONA_ROLE: primary. New job run-fallback: needs [prepare, keyprep, run]; if exactly
      the keyed condition && keyprep success && (needs.run.outputs.primary_outage == 'true' ||
      needs.prepare.outputs.fallback_drill == 'true'); environment persona-verdict; permissions exactly {contents: read, id-token: write}; run's closed step
      list with these differences only: its filter row, step ids prefixed run-fallback-, PERSONA env PERSONA_ROLE:
      warm_fetched_escape_hatch, and the upload step "Upload fallback verdict results" (persona-verdict-results-fallback,
      path ${{ runner.temp }}/work/results, retention 1 day); timeout-minutes 25. Its two PROBE steps are run's PROBE
      literal unchanged: the request verb picks the provider from GITHUB_JOB (egress_container_control.py row). post:
      needs [prepare, run, run-fallback, keyprep]; after its results download, one more download step of
      persona-verdict-results-fallback to ${{ runner.temp }}/work/results-fallback with continue-on-error true (as the
      results download has); its post step env gains PERSONA_FALLBACK_RESULT: ${{ needs.run-fallback.result }}. Size:
      re-measured at build start (see execution_steps).
  - file: config/persona_verdict_egress.yaml
    action: Modify
    purpose: >-
      Row for persona-verdict.yml run-fallback: sts and ssm {aws_region} hosts, the warm_fetched_escape_hatch tier's
      provider host (api.anthropic.com:443, through provider_hosts) and pkg-containers.githubusercontent.com:443.
      run's row is unchanged (one provider host each).
  - file: scripts/personas/keyed_run.py
    action: Modify
    purpose: >-
      request_main reads PERSONA_ROLE (refused unless in (primary, warm_fetched_escape_hatch); a refusal prints
      nothing to stdout and exits 2 as today) and resolves that role's tier provider prefix and SSM key, replacing
      the fixed primary; the job is GITHUB_JOB and must pair with the role (run with primary, run-fallback with
      warm_fetched_escape_hatch), else refused. Before the fd guard it writes one stderr line PERSONA-REQUEST
      role=<role> provider=<prefix> (no key, token or ARN). record_main: the sidecar's host.job is GITHUB_JOB (one of the two).
      On run only (a slow primary that reaches the launcher's 600 s bound counts as inflight and so triggers the
      fallback, by design), it appends primary_outage=true to GITHUB_OUTPUT when the written result is not success-shaped
      (success-shaped is exit_code 0 and timed_out false; run_persona exits 4 on a transport outage) and the launcher
      result's upstream field has ok 0 and (outage >= 1 or inflight >= 1), each count a non-negative int and never a
      JSON boolean; otherwise primary_outage=false (upstream null included, so launcher_no_result, which carries no
      upstream, always writes false). GITHUB_JOB unset or any third job name is refused like a role mismatch. It never reads
      the persona's stdout or events for this, and writes no output on run-fallback.
  - file: scripts/personas/egress_proxy.py
    action: Modify
    purpose: >-
      After each upstream request starts and after each response it sends, the proxy writes one JSON line
      {ok, outage, inflight} (running totals) to its stdout, which the launcher holds as a pipe; its log lines stay on
      stderr. ok counts relayed upstream 2xx; outage counts its own 502 upstream-unreachable answers and relayed
      upstream 408, 429 or 5xx (litellm_wire's outage set: _OUTAGE_STATUSES plus >= 500); inflight counts upstream
      requests started with no response yet sent. A relayed 402 or any other 4xx is neither (a spent or broken
      primary fails, never spends the fallback credit; T4.32 SPEND). No header value or body is written.
  - file: scripts/personas/egress_launcher.py
    action: Modify
    purpose: >-
      Run mode reads the proxy's stdout pipe (non-blocking, each line size-capped, at most 4096 lines) and keeps the
      last line that parses as exactly {ok, outage, inflight} of non-negative ints (a JSON boolean is not an int); its stdout result gains upstream:
      that object, or null when none parsed. Lines are read until the proxy exits, including after the launcher's own
      bound kills it, so a hang ends as inflight >= 1. It derives the run's role from the request's provider prefix
      through the snapshot's role field and appends --role <role> after the image entrypoint's arguments (rec-5615's
      flag), in run mode only, for both jobs; the request's key set is unchanged. Both modes drain the proxy's stdout
      pipe; probe mode's own stdout stays one JSON object. Probe mode writes the validated request input to
      in/input.json (root 0644), as run mode does. Its install manifest hash follows.
  - file: scripts/personas/egress_floor_container.py
    action: Modify
    purpose: >-
      The snapshot row per provider prefix gains role (deepseek/: primary, anthropic/: warm_fetched_escape_hatch),
      read for its parity test from docs/contracts/inference-provider.yaml tier_model.tiers[].role through each
      tier's selection_ref into litellm_tier_models (never a hard-coded tier_1/tier_2 mapping, so a renumbering cannot
      swap roles), and refused when two prefixes share a role (Decision 173 cl.2(b)).
  - file: scripts/personas/egress_container_control.py
    action: Modify
    purpose: >-
      The egress-container-request verb picks the probe request's provider from GITHUB_JOB: run-fallback gets the
      snapshot prefix whose role is warm_fetched_escape_hatch, every other job the primary-role prefix (today's
      deepseek/). In run and run-fallback only, the request's input is {upstream: report}; elsewhere it stays {}.
      Planned change p5 (constraints).
  - file: scripts/personas/egress_container_probe.py
    action: Modify
    purpose: >-
      Only an input exactly equal to {"upstream": "report"} selects report mode; any other value, an extra key, a
      non-object, or a missing or unreadable in/input.json is strict mode (today's behaviour). In report mode,
      proxy_upstream and proxy_fixed_upstream report got=upstream-unreachable
      (the proxy's marker) as a REPORT line instead of failing, as the twin already does; got=proxy-refused still
      FAILs, and every refused case (unlisted_name, dns_txt_system, raw_ip_443, imds, wireserver, private, ipv6,
      decoy_port) still FAILs when reached. In strict mode nothing changes. So a primary outage no longer stops run
      before its persona step, and the probe still proves the container's isolation in every keyed job.
  - file: scripts/checks/misc/validate_persona_verdict_egress.py
    action: Modify
    new_imports: []
    purpose: >-
      It passes the container module a role-to-host map in place of the one primary host, by reshaping
      _provider_hosts_expected to return role to host (roles read from inference-provider.yaml tier_model.tiers[].role
      through selection_ref, hosts from provider_hosts): near-zero growth. Headroom is measured by plan_obligations at
      build start (429 SLOC today, before rec-5549); a crossing of 500 is a STOP to the plan owner, never a raise
      (Decision 128).
  - file: src/persona_hosts/local_container/adapter.py
    action: Modify
    purpose: >-
      run_argv gains keyword role: str | None = None; a role appends --role <role> after the entrypoint's arguments
      and is passed through as an opaque token (ValueError only when it does not match ^[a-z_]+$; run_persona
      validates the tier vocabulary, Decision 212 cl.3, so this adapter assumes no backend's role set); None leaves
      the argv unchanged, so local_container's behaviour is unchanged. This keeps the launcher's argv parity with
      run_argv (rec-5549's parity test).
  - file: scripts/personas/post_verdict.py
    action: Modify
    purpose: >-
      plan_all selects each route's result once: results-fallback/<route>.json when present, else results/<route>.json,
      and passes that one result to judge, overridable_output and record_text, so a fallback-served REVISE carries
      its override record (T4.32 c6). The title gains " (fallback role)" when the fallback result was used, or
      " (fallback role: no result)" when PERSONA_FALLBACK_RESULT is success, failure or cancelled and no fallback
      result exists; the marker is appended after any override form. Conclusion mapping and check names are unchanged.
      plan_override's own record carries no marker (noted, not changed).
  - file: scripts/checks/ci_guards/_persona_verdict_post.py
    action: Modify
    new_imports: []
    purpose: >-
      Planned change p3 (Decision 235 cl.1, named in constraints): NEEDS becomes [prepare, run, run-fallback,
      keyprep]; ARTIFACTS and OPTIONAL gain persona-verdict-results-fallback; _kind maps it to results-fallback;
      SEQUENCE gains results-fallback right after results; the continue-on-error rule covers it as it covers results;
      POST_ENV gains PERSONA_FALLBACK_RESULT: ${{ needs.run-fallback.result }}.
  - file: scripts/checks/ci_guards/_persona_verdict_keyed.py
    action: Modify
    new_imports: [scripts.checks.ci_guards._persona_verdict_fallback]
    purpose: >-
      KEYED_JOBS gains run-fallback. One canonical step list parameterised by job (run, run-fallback): the filter
      row, the step id prefix, the PERSONA_ROLE literal and the upload step name and artifact differ, nothing else.
      Planned change p1: run's and run-fallback's PERSONA env is exactly PERSONA_AWS_REGION, AWS_ACCOUNT_ID,
      PERSONA_SNAPSHOT and PERSONA_ROLE at that job's literal role. NEEDS, CONDITIONS and PERMISSIONS each gain a
      run-fallback entry (NEEDS [prepare, keyprep, run]; _job_shape indexes all three). _secret_rules and the
      Environment rule name run-fallback beside run; the run-fallback-specific rules are called from _persona_verdict_fallback.py.
  - file: scripts/checks/ci_guards/_persona_verdict_fallback.py
    action: Create
    new_imports: []
    purpose: >-
      The new refusal rules, in their own module so their red fixtures are measured where the per-file coverage check
      looks: run-fallback's if equals exactly KEYED_IF && KEYPREP_OK && (needs.run.outputs.primary_outage == 'true' ||
      needs.prepare.outputs.fallback_drill == 'true') (a CONDITIONS row, not a substring); run's outputs equal exactly
      {primary_outage: "${{ steps.<run PERSONA id>.outputs.primary_outage }}"}; prepare's outputs equal exactly
      {allowlisted: "${{ steps.resolve.outputs.allowlisted }}", fixture: "${{ steps.route.outputs.fixture }}",
      fallback_drill: "${{ steps.route.outputs.fallback_drill }}"}; no other job names primary_outage or fallback_drill;
      PERSONA_ROLE is primary in run and warm_fetched_escape_hatch in run-fallback; run-fallback's permissions and
      Environment equal run's; run-fallback's job-level key set is exact (no strategy, matrix, outputs or env), so at
      most one fallback run is enforced statically (Decision 55). It owns the run-fallback condition built from KEYED_IF
      and KEYPREP_OK passed in by _persona_verdict_keyed.py as parameters and never imports that module (no circular
      import).
  - file: scripts/checks/ci_guards/validate_persona_verdict_chain.py
    action: Modify
    new_imports: []
    purpose: >-
      run-fallback joins KEYED_ENVIRONMENTS, KEYED_ID_TOKEN and JOB_PERMISSIONS ({contents: read, id-token: write}),
      and every rule rec-5550 scoped to run applies to it by name; ARTIFACT_DIRS gains
      persona-verdict-results-fallback: results-fallback for post's download, and a separate upload-directory
      override (persona-verdict-results-fallback: results) pins run-fallback's upload to the same work directory as
      run's, both under WORKDIR (${{ runner.temp }}/work). Grows by the tuple and map entries; if plan_obligations reports it
      NEAR_CAP at build time, the relief is a facade decomposition (Decision 128), never a raise.
  - file: scripts/checks/misc/_persona_verdict_container.py
    action: Modify
    new_imports: []
    purpose: >-
      Admission gains persona-verdict.yml's run-fallback job on run's terms, with its PROBE literal accepted as run's
      is. A job's role is read from the job name and cross-checked against its PERSONA_ROLE literal. It receives the role-to-host map from validate_persona_verdict_egress.py. Planned change p2: a class job's row
      lists exactly one provider host, the host of the role that job runs (run and the probe jobs: primary;
      run-fallback: warm_fetched_escape_hatch), plus the blob host and, for the two keyed jobs, the sts and ssm hosts;
      a second provider host, or the other role's host, stays refused.
  - file: scripts/personas/route.py
    action: Modify
    purpose: >-
      The fallback drill: when the fixture output is true and tests/fixtures/persona_verdict/fixture_pr/fallback_drill.txt
      is among the added or modified paths, route writes the output fallback_drill=true (else false). Only a
      fixture-only diff can set it, so the drill runs only where the keyed jobs already run.
  - file: tests/fixtures/persona_verdict/fixture_pr/fallback_drill.txt
    action: Create
    purpose: "The drill marker; one neutral line (\"fallback drill\"), rewritten by a drill head."
  - file: docs/contracts/github-actions-evidence.yaml
    action: Modify
    purpose: >-
      artifact_uploads gains run-fallback's persona-verdict-results-fallback (ephemeral_handoff) as one flow-form
      line, with one terse flow-form amendment_log row (the file is NEAR_CAP: 6 lines of headroom). Relief measured
      at build start: if the two lines do not fit, compact multi-line amendment_log rows to terse one-line rows
      (contract-population.yaml amendment_log_retention) until they do; a shortfall after that is a STOP.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: "Rows for run-fallback's inline run bodies."
  - file: tests/personas/test_execute.py
    action: Modify
    purpose: >-
      Rec acceptance test_request_reads_the_fallback_role_key_on_a_fallback_run (PERSONA_ROLE
      warm_fetched_escape_hatch in run-fallback reads the anthropic/ key parameter and emits provider anthropic/);
      a role/job mismatch, an unknown role, a missing role, GITHUB_JOB unset and a third job name are refused with
      nothing on stdout;
      test_primary_outage_only_from_proxy_counts_on_run: true only on run with a non-success result, ok 0 and
      outage or inflight >= 1; false with ok >= 1, with boolean counts, with upstream null and on success; nothing written on run-fallback;
      host.job follows GITHUB_JOB.
  - file: tests/personas/test_egress_proxy.py
    action: Modify
    purpose: >-
      test_counts_line_records_ok_outage_and_inflight: the stdout lines after a relayed 200, 503, 408 and 429, an own
      502 and a relayed 402 (counted neither); an upstream that never answers leaves inflight 1 in the last line.
  - file: tests/personas/test_egress_launcher.py
    action: Modify
    purpose: >-
      test_run_result_carries_upstream_and_role_flag: upstream is the last valid counts line, null when none or only
      malformed lines, and survives the bound's kill; --role follows the provider's snapshot role and matches
      run_argv(role=...). test_probe_mode_writes_the_input_file: probe mode writes the validated input to in/input.json
      and its stdout stays one JSON object while the proxy writes counts lines.
  - file: tests/personas/test_egress_floor_container.py
    action: Modify
    purpose: "test_snapshot_role_matches_tier_models; a shared role is refused."
  - file: tests/persona_hosts/local_container/test_adapter.py
    action: Modify
    purpose: "test_run_argv_role_appends_flag; None leaves the argv unchanged; a role that is not a plain token raises."
  - file: tests/personas/test_fallback_chain.py
    action: Create
    purpose: >-
      Hermetic pre-merge proof of the signal chain: test_unreachable_primary_sets_primary_outage runs the real proxy
      against a closed local port (an own 502), feeds its stdout through the launcher's counts reader into a run-mode
      result with a failure, and record_main (GITHUB_JOB run) writes primary_outage=true; the same with an upstream
      that answers 200 writes false. Both use a fake connector defined in this file at rec-5549's proxy connector seam
      (never imported from test_egress_proxy.py; validate_no_cross_test_imports), since the proxy refuses a loopback
      answer and verifies TLS against the hostname.
  - file: tests/personas/test_post_verdict.py
    action: Modify
    purpose: >-
      test_fallback_result_wins_and_is_named (a fallback REVISE carries its override record, and the marker follows an
      override form); the no-result marker from PERSONA_FALLBACK_RESULT; without results-fallback the primary result
      is judged as today.
  - file: tests/personas/test_route.py
    action: Modify
    purpose: >-
      test_fallback_drill_only_on_fixture_diffs (true with the drill file added or modified in a fixture-only diff;
      false in a mixed diff, on a rename or removal, or without it). The exact-output assertion (test_route.py:190,
      "routes=1\nfixture=true\n" as rec-5550 leaves it) is extended with the fallback_drill line: an addition, not a
      loosening, dispositioned in code review (validate_weakening_candidates).
  - file: tests/personas/test_egress_container_control.py
    action: Modify
    purpose: "test_probe_request_follows_the_job_role (run-fallback names anthropic/ and upstream report; run names deepseek/ and report; the probe workflow's job names deepseek/ with input {})."
  - file: tests/personas/test_egress_container_probe.py
    action: Modify
    purpose: >-
      test_report_mode_reports_unreachable_upstream (with exactly {"upstream": "report"} an upstream-unreachable
      marker is a REPORT, proxy-refused and every reached refused case still FAIL); test_other_inputs_stay_strict
      ({}, another value, an extra key, a non-object, a missing or unreadable file all fail as today).
  - file: tests/checks/misc/test_validate_persona_verdict_egress.py
    action: Modify
    purpose: "test_role_host_map_passed_to_container: the live tree passes with the role-to-host map; a map naming the same host for both roles is refused."
  - file: tests/checks/ci_guards/test__persona_verdict_keyed.py
    action: Modify
    purpose: >-
      test_run_fallback_step_list_is_run_s (the live run-fallback passes; red fixtures: run's upload name in
      run-fallback, an extra step, a step id without the run-fallback- prefix). The cases rec-5550's build pins to the
      three-key PERSONA env or the KEYED_JOBS tuple change to the four-key env and the new tuple; no assertion is
      loosened.
  - file: tests/checks/ci_guards/test__persona_verdict_post.py
    action: Modify
    purpose: "The live post passes; red fixtures for the old needs list, the fallback download missing continue-on-error, and it before the results download."
  - file: tests/checks/ci_guards/test__persona_verdict_fallback.py
    action: Create
    purpose: >-
      Mirror test of _persona_verdict_fallback.py: test_run_fallback_shape_is_closed (the live workflow passes); red
      fixtures, each failing with its own message: run-fallback's if without either disjunct or with another,
      PERSONA_ROLE primary in run-fallback or warm_fetched_escape_hatch in run, run's outputs with a literal 'true'
      or an extra key, prepare's outputs missing fallback_drill or with a literal value, another job naming
      primary_outage or fallback_drill, run-fallback with a strategy or matrix key, run-fallback without the
      Environment or with other permissions (test_run_fallback_permissions_and_environment).
  - file: tests/checks/ci_guards/test_validate_persona_verdict_chain.py
    action: Modify
    purpose: "test_the_keyed_jobs_are_part_of_the_seven_job_set asserts the eight-job set (assertion edit only; node id kept)."
  - file: tests/checks/misc/test__persona_verdict_container.py
    action: Modify
    purpose: "test_class_row_holds_its_roles_one_provider_host: run-fallback's live row passes; red fixtures: run-fallback's row with the primary host, run's row with the fallback host, either with both."
bundled_recommendations: [rec-5559]
followon_recs: []
closes_criteria: []
infrastructure_dependencies:
  - "No Terraform: the persona-verdict role's trust is the Environment subject plus job_workflow_ref (terraform/personal/oidc_persona_verdict_role.tf), and it already reads both tier keys; run-fallback is in persona-verdict.yml under the same Environment."
acceptance_criteria:
  - bin/venv-python -m pytest tests/personas/test_execute.py::test_request_reads_the_fallback_role_key_on_a_fallback_run -q passes (rec-5559's acceptance).
  - bin/venv-python -m pytest tests/personas/test_fallback_chain.py -q passes (the proxy-to-output chain, hermetic).
  - "The fallback drill on main (VP 6): run-fallback runs once on warm_fetched_escape_hatch with both CONTAINER-PROBE PASS, PERSONA-REQUEST role=warm_fetched_escape_hatch provider=anthropic/ and no key in its log, and persona-verdict/canary_persona is judged from the fallback result with (fallback role) in its title."
  - The live tree passes validate_persona_verdict_chain and validate_persona_verdict_egress; each new red fixture fails with its own message.
  - On a fixture PR run on main where the primary serves, run-fallback is skipped and the check title carries no fallback marker.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Unit and chain tests for the request and record verbs, proxy counts, launcher result, snapshot role, run_argv and post's choice.
    command: >-
      bin/venv-python -m pytest tests/personas/test_execute.py tests/personas/test_egress_proxy.py
      tests/personas/test_egress_launcher.py tests/personas/test_egress_floor_container.py
      tests/persona_hosts/local_container/test_adapter.py tests/personas/test_fallback_chain.py
      tests/personas/test_post_verdict.py tests/personas/test_route.py tests/personas/test_egress_container_control.py
      tests/personas/test_egress_container_probe.py -q
    expected: All tests pass.
    fix_if: A test fails; fix the code inside scope, never the assertion (Decision 235).
    hermetic: false
    graduation: graduate
    graduation_check_id: persona-verdict-fallback-run-units
  - step: 2
    phase: pre-deploy
    action: Guard tests, live tree and red fixtures.
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test__persona_verdict_fallback.py
      tests/checks/ci_guards/test__persona_verdict_keyed.py tests/checks/ci_guards/test__persona_verdict_post.py
      tests/checks/ci_guards/test_validate_persona_verdict_chain.py tests/checks/misc/test__persona_verdict_container.py
      tests/checks/misc/test_validate_persona_verdict_egress.py -q
    expected: All tests pass, each new red fixture failing with its own message.
    fix_if: A live-tree case fails; fix the workflow or config to the scope row's shape. A red fixture passing is a guard gap; fix the check.
    hermetic: false
    graduation: graduate
    graduation_check_id: persona-verdict-fallback-run-guards
  - step: 3
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: All fast-tier checks pass.
    fix_if: A check fails; fix inside scope or STOP to the plan owner; never loosen a check (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: is the fast tier itself
  - step: 4
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Full tier passes and --verify-head confirms it for the head (background, 2 h limit, HOME an empty directory).
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: is the full tier itself
  - step: 5
    phase: post-deploy
    action: Primary-served run on main - a fixture PR head rewriting proceed.txt (the rec-5550 VP 6 form).
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") for the head SHA, then mcp__github__actions_list(method="list_workflow_jobs",
      resource_id=<run id>) and mcp__github__get_job_logs for the run and post jobs;
      mcp__github__pull_request_read(method="get_check_runs", owner="otl-labs", repo="ontheloop", pullNumber=<fixture PR>)
    expected: >-
      run succeeds and its log shows PERSONA-REQUEST role=primary provider=deepseek/ and no key; run-fallback concluded skipped;
      persona-verdict/canary_persona has no fallback marker in its title.
    fix_if: Any other shape is a STOP to the plan owner with the run id; rec-5559 is reopened with update_rec naming the run.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: >-
      Fallback drill on main: on the same fixture PR, push one head that rewrites
      tests/fixtures/persona_verdict/fixture_pr/fallback_drill.txt to 'fallback drill 1' and nothing else (full tier
      and --verify-head first), only after VP 5's run has concluded (the head_branch concurrency group cancels an
      earlier run). Spends one fallback-role run of the Anthropic credit; the later drill-revert head runs one more
      primary run.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") for the head SHA, then mcp__github__actions_list(method="list_workflow_jobs",
      resource_id=<run id>) and mcp__github__get_job_logs for run, run-fallback and post;
      mcp__github__pull_request_read(method="get_check_runs", owner="otl-labs", repo="ontheloop", pullNumber=<fixture PR>)
    expected: >-
      run succeeds on the primary; run-fallback runs once: EGRESS-FLOOR PASS, both CONTAINER-PROBE PASS, both
      self-checks PASS, PERSONA-REQUEST role=warm_fetched_escape_hatch provider=anthropic/, no key, token, ARN or
      account id in the log; persona-verdict/canary_persona concluded from the fallback result with (fallback role) at
      the end of its title (or a failure titled with the fallback marker if the credit is spent, never success
      without the marker and never skipped).
    fix_if: >-
      UNSUPPORTED_PLACEMENT is re-run (rec-5455); any other shape is a STOP to the plan owner with the run id, and
      rec-5559 is reopened with update_rec naming the run. After the reads, revert fallback_drill.txt on the fixture
      PR (or close it) so no later fixture head re-runs the drill.
    hermetic: false
    graduation: not-applicable
