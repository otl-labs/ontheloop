schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-fallback-run"
intent: >-
  Solves rec-5559 (Decision 173's fallback leg for keyed verdict jobs). When the proxy itself sees the primary
  provider fail during the run job, a separate run-fallback job runs the same persona once on the
  warm_fetched_escape_hatch role, with its own one-host egress row, its own key read and its own proxy, and post
  judges that result and says in the check title that the fallback role served it. So a primary outage stops failing
  a verdict check before any persona's gating flip, and the role is chosen per run, never mid-run.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-fallback-run.yaml
phase: >-
  T4.32 (persona foundation): c7 EGRESS container leg's escape hatch ("a re-run on the fallback role", approved
  text docs/plans/approved/persona-verdict-container-egress.yaml); owed before the first verdict persona flip
  (T4.28-T4.30), not before add or dual-run.
cites: [dec:55, dec:173, dec:205, dec:235, dec:263]
amends: []
introduces: []
scope:
  - file: .github/workflows/persona-verdict.yml
    action: Modify
    purpose: >-
      run gains job outputs exactly {primary_outage: "${{ steps.<run's PERSONA step id>.outputs.primary_outage }}"}
      (the id rec-5550's build pins); its PERSONA step env gains PERSONA_ROLE: primary. New job run-fallback: needs
      [prepare, keyprep, run]; if exactly the keyed condition && keyprep success && needs.run.outputs.primary_outage
      == 'true'; environment persona-verdict; permissions exactly {contents: read, id-token: write}; run's closed step
      list with these differences only: its filter row, step ids prefixed run-fallback-, PERSONA env PERSONA_ROLE:
      warm_fetched_escape_hatch, and the upload step "Upload fallback verdict results" (persona-verdict-results-fallback,
      path $RUNNER_TEMP/work/results, retention 1 day); timeout-minutes 25. post: needs [prepare, run, run-fallback,
      keyprep]; after its results download, one more download step of persona-verdict-results-fallback to
      $RUNNER_TEMP/work/results-fallback with continue-on-error true (as the results download has). Size: re-measured
      at build start (see execution_steps).
  - file: config/persona_verdict_egress.yaml
    action: Modify
    purpose: >-
      Row for persona-verdict.yml run-fallback: sts and ssm {aws_region} hosts, the warm_fetched_escape_hatch tier's
      provider host (api.anthropic.com:443, through provider_hosts) and pkg-containers.githubusercontent.com:443.
      run's row is unchanged (one provider host each).
  - file: scripts/personas/keyed_run.py
    action: Modify
    purpose: >-
      request_main reads PERSONA_ROLE (refused unless in (primary, warm_fetched_escape_hatch); a refusal prints
      nothing to stdout and exits 2 as today) and resolves that role's tier provider prefix and SSM key, replacing
      the fixed primary; the job is GITHUB_JOB and must pair with the role (run with primary, run-fallback with
      warm_fetched_escape_hatch), else refused. record_main: the sidecar's host.job is GITHUB_JOB (one of the two).
      On run only, it appends primary_outage=true to GITHUB_OUTPUT when the written result is not a success-shaped
      launcher result (a failure, a timeout or launcher_no_result) and the launcher result's upstream field has ok 0
      and (outage >= 1 or inflight >= 1); otherwise primary_outage=false (upstream null included). It never reads
      the persona's stdout or events for this, and writes no output on run-fallback.
  - file: scripts/personas/egress_proxy.py
    action: Modify
    purpose: >-
      After each upstream request starts and after each response it sends, the proxy writes one JSON line
      {ok, outage, inflight} (running totals) to its stdout, which the launcher holds as a pipe; its log lines stay on
      stderr. ok counts relayed upstream 2xx; outage counts its own 502 upstream-unreachable answers and relayed
      upstream 408, 429 or 5xx (litellm_wire's outage set: _OUTAGE_STATUSES plus >= 500); inflight counts upstream
      requests started with no response yet sent. A relayed 402 or any other 4xx is neither (a spent or broken
      primary fails, never spends the fallback credit; T4.32 SPEND). No header value or body is written.
  - file: scripts/personas/egress_launcher.py
    action: Modify
    purpose: >-
      Run mode reads the proxy's stdout pipe (non-blocking, each line size-capped, at most 4096 lines) and keeps the
      last line that parses as exactly {ok, outage, inflight} of non-negative ints; its stdout result gains upstream:
      that object, or null when none parsed. Lines are read until the proxy exits, including after the launcher's own
      bound kills it, so a hang ends as inflight >= 1. It derives the run's role from the request's provider prefix
      through the snapshot's role field and appends --role <role> after the image entrypoint's arguments (rec-5615's
      flag), in run mode only, for both jobs; the request's key set is unchanged. Its install manifest hash follows.
  - file: scripts/personas/egress_floor_container.py
    action: Modify
    purpose: >-
      The snapshot row per provider prefix gains role (deepseek/: primary, anthropic/: warm_fetched_escape_hatch),
      read for its parity test from docs/contracts/inference-provider.yaml litellm_tier_models (tier_1 primary,
      tier_2 warm_fetched_escape_hatch) and refused when two prefixes share a role (Decision 173 cl.2(b)).
  - file: src/persona_hosts/local_container/adapter.py
    action: Modify
    purpose: >-
      run_argv gains keyword role: str | None = None; a role appends --role <role> after the entrypoint's arguments
      and must be one of the two tier roles, else ValueError; None leaves the argv unchanged, so local_container's
      behaviour is unchanged. This keeps the launcher's argv parity with run_argv (rec-5549's parity test).
  - file: scripts/personas/post_verdict.py
    action: Modify
    purpose: >-
      For each route, judge reads results-fallback/<route>.json when present and judges it with " (fallback role)" at
      the end of the check title; when the results-fallback directory exists without that file it judges the primary
      result with " (fallback role: no result)"; with no results-fallback directory it judges the primary result as
      today. Conclusion mapping and check names are unchanged.
  - file: scripts/checks/ci_guards/_persona_verdict_post.py
    action: Modify
    new_imports: []
    purpose: >-
      Planned change p3 (Decision 235 cl.1, named in constraints): NEEDS becomes [prepare, run, run-fallback,
      keyprep]; ARTIFACTS and OPTIONAL gain persona-verdict-results-fallback; _kind maps it to results-fallback;
      SEQUENCE gains results-fallback right after results; the continue-on-error rule covers it as it covers results.
  - file: scripts/checks/ci_guards/_persona_verdict_keyed.py
    action: Modify
    new_imports: []
    purpose: >-
      KEYED_JOBS gains run-fallback. One canonical step list parameterised by job (run, run-fallback): the filter
      row, the step id prefix, the PERSONA_ROLE literal and the upload step name and artifact differ, nothing else.
      Planned change p1: run's and run-fallback's PERSONA env is exactly PERSONA_AWS_REGION, AWS_ACCOUNT_ID,
      PERSONA_SNAPSHOT and PERSONA_ROLE at that job's literal role. run-fallback's if equals exactly KEYED_IF &&
      KEYPREP_OK && needs.run.outputs.primary_outage == 'true' (a CONDITIONS row, not a substring); run's outputs equal
      exactly {primary_outage: "${{ steps.<run PERSONA id>.outputs.primary_outage }}"}; any other job carrying outputs
      that name primary_outage is refused.
  - file: scripts/checks/ci_guards/validate_persona_verdict_chain.py
    action: Modify
    new_imports: []
    purpose: >-
      run-fallback joins KEYED_ENVIRONMENTS, KEYED_ID_TOKEN and JOB_PERMISSIONS ({contents: read, id-token: write}),
      and every rule rec-5550 scoped to run applies to it by name; ARTIFACT_DIRS gains
      persona-verdict-results-fallback: results-fallback for post's download, and run-fallback's upload path is
      results (the same work directory as run's). Grows by the tuple entries only; if plan_obligations reports it
      NEAR_CAP at build time, the relief is a facade decomposition (Decision 128), never a raise.
  - file: scripts/checks/misc/_persona_verdict_container.py
    action: Modify
    new_imports: []
    purpose: >-
      Admission gains persona-verdict.yml's run-fallback job on run's terms. Planned change p2: a class job's row
      lists exactly one provider host, the host of the role that job runs (run and the probe jobs: primary;
      run-fallback: warm_fetched_escape_hatch), plus the blob host and, for the two keyed jobs, the sts and ssm hosts;
      a second provider host, or the other role's host, stays refused.
  - file: docs/contracts/github-actions-evidence.yaml
    action: Modify
    purpose: >-
      artifact_uploads gains run-fallback's persona-verdict-results-fallback (ephemeral_handoff) as one flow-form
      line, with one terse flow-form amendment_log row (the file is NEAR_CAP: 6 lines of headroom).
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: Rows for run-fallback's inline run bodies.
  - file: tests/personas/test_execute.py
    action: Modify
    purpose: >-
      Rec acceptance test_request_reads_the_fallback_role_key_on_a_fallback_run (PERSONA_ROLE
      warm_fetched_escape_hatch in run-fallback reads the anthropic/ key parameter and emits provider anthropic/);
      a role/job mismatch, an unknown role and a missing role are refused with nothing on stdout;
      test_primary_outage_only_from_proxy_counts_on_run: true only on run with a non-success result, ok 0 and
      outage or inflight >= 1; false with ok >= 1, with upstream null and on success; nothing written on run-fallback;
      host.job follows GITHUB_JOB.
  - file: tests/personas/test_egress_proxy.py
    action: Modify
    purpose: >-
      test_counts_line_records_ok_outage_and_inflight: the stdout lines after a relayed 200, 503, 408 and 429, an own
      502 and a relayed 402 (counted neither); an upstream that never answers leaves inflight 1 in the last line.
  - file: tests/personas/test_egress_launcher.py
    action: Modify
    purpose: >-
      test_run_result_carries_upstream_and_role_flag: upstream is the last valid counts line, null when none or only
      malformed lines, and survives the bound's kill; --role follows the provider's snapshot role and matches
      run_argv(role=...).
  - file: tests/personas/test_egress_floor_container.py
    action: Modify
    purpose: test_snapshot_role_matches_tier_models; a shared role is refused.
  - file: tests/persona_hosts/local_container/test_adapter.py
    action: Modify
    purpose: test_run_argv_role_appends_flag; None leaves the argv unchanged; an unknown role raises.
  - file: tests/personas/test_fallback_chain.py
    action: Create
    purpose: >-
      Hermetic pre-merge proof of the signal chain: test_unreachable_primary_sets_primary_outage runs the real proxy
      against a closed local port (an own 502), feeds its stdout through the launcher's counts reader into a run-mode
      result with a failure, and record_main (GITHUB_JOB run) writes primary_outage=true; the same with a local
      upstream that answers 200 writes false.
  - file: tests/personas/test_post_verdict.py
    action: Modify
    purpose: test_fallback_result_wins_and_is_named; the no-result marker; without results-fallback the primary result is judged as today.
  - file: tests/checks/ci_guards/test__persona_verdict_post.py
    action: Modify
    purpose: The live post passes; red fixtures for the old needs list, the fallback download missing continue-on-error, and it before the results download.
  - file: tests/checks/ci_guards/test__persona_verdict_fallback.py
    action: Create
    purpose: >-
      New file (test_validate_persona_verdict_chain.py has 29 SLOC of headroom): test_run_fallback_shape_is_closed
      (the live run-fallback passes); red fixtures: run-fallback's if without or with a widened outage conjunct,
      PERSONA_ROLE primary in run-fallback or warm_fetched_escape_hatch in run, run's upload name in run-fallback,
      an extra step, run's outputs with a literal 'true' or an extra key, another job with a primary_outage output,
      run-fallback without the Environment or with other permissions.
  - file: tests/checks/ci_guards/test_validate_persona_verdict_chain.py
    action: Modify
    purpose: test_the_keyed_jobs_are_part_of_the_seven_job_set becomes the eight-job set (assertion edit only).
  - file: tests/checks/misc/test__persona_verdict_container.py
    action: Modify
    purpose: "test_class_row_holds_its_roles_one_provider_host: run-fallback's live row passes; red fixtures: run-fallback's row with the primary host, run's row with the fallback host, either with both."
