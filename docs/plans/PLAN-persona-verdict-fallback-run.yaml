constraints:
  - One provider host per job row and one upstream per proxy; the role is chosen per job, never mid-run (approved c7 text).
  - "At most one fallback run per verdict run (Decision 55). Decision 173 cl.4's remaining-allowance assertion is made at the fallback run's cold start by the image's transport (scripts/llm/litellm_transport.py runs ensure_asserted before the first call when the role is warm_fetched_escape_hatch; rec-5615 keeps it, its probe counting as probe_turn 1), before any persona call spends the credit. A refused assertion (credit spent) aborts the run and post posts a failure, never a success or a skip; inference-provider.yaml tier_2's 'runs that need it pause' is read here as that posted failure."
  - "Decision 235 cl.1 planned changes, named for the operator's confirmation: (p1) rec-5550's PERSONA env set grows from three keys to four (PERSONA_ROLE at a literal per job); (p2) the container class row rule's admitted provider host becomes the host of the role that job runs, each row still exactly one provider host pinned by the job's literal role, a second provider host still refused; (p3) post's needs gain run-fallback and its step list gains one optional, name-pinned download of persona-verdict-results-fallback."
  - No secret in a pull_request job (Decision 205); keys stay in SSM under the persona-verdict role (Decision 263).
  - Never loosen an assertion or check to get green (Decision 235); no rescue loops (Decision 55).
