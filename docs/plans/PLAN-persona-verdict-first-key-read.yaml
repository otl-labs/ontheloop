constraints:
  - No AWS account id, ARN or region id committed; no public log line carries a key, token, credential, ARN or account id (Decision 101).
  - No package index host on a keyed job's list; no wildcard added; no list widened to obtain green (Decisions 181, 235).
  - No job assumes the role before the smoke and refusal land together; no container in any id-token job (c7 ORDER).
  - No keyed job writes telemetry or lists a telemetry writer host.
  - Nothing in this plan forbids PLAN-persona-verdict-app-post adding attempt rows to key_refusal.ATTEMPTS or an app-role attempt to the smoke (its consult F5).
  - "500-SLOC limit (Decision 128): decompose, never raise."
  - No rescue agents or workaround loops (Decision 55).
