      Decision 275 byte seed (50168 of 50251 on main bbe094f9). This plan adds its own terse amendment_log row (one line:
      499 of 500 effective lines; no merged rows). The build pays every added byte (the row and SA-14's new words) by
      shortening SA-14's or PC-12's description by citation, or by compacting an older full row's summary to a terse
      summary of its own change, never a protected log row, measured against main at build time. Kept verbatim: "Decision
      263 clause 4", "assumes no AWS identity" and SA-14's pinned token tuple.
  - file: tests/checks/contracts/test_ports_verdict_chain_records.py
    action: Modify
    purpose: test_sa14_records_the_verdict_chain_shell also requires SA-14 to name the OIDC token-request and STS AssumeRoleWithWebIdentity shapes.
  - file: tests/scripts/test_smoke_inference_credentials_ci.py
    action: Create
    purpose: >-
      rec-5166's acceptance. test_credentialed_run_is_a_ci_job: the live persona-verdict.yml's smoke job names the
      persona-verdict Environment, holds id-token: write, runs one run.py inference-smoke step per tier role in
