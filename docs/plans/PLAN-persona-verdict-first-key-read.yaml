  - file: tests/personas/test_inference_smoke.py
    action: Create
    purpose: >-
      With oidc_assume and the transport stubbed and boto3.Session replaced by a fake whose client records its
      region_name (no real client is built): one role per process from PERSONA_SMOKE_ROLE, an unknown role fails; run()
      receives region equal to PERSONA_AWS_REGION;
      the boto3 session carries the assumed credentials and PERSONA_AWS_REGION's region; a sub without the persona-verdict
      Environment or a foreign job_workflow_ref fails before any assume; the in-process cases call the inner function
      (os._exit never reached) and only marker lines print (capfd, fd level); a subprocess case with stdout as a pipe (as
      on Actions) asserts the child's fd 1 holds, in order, exactly the OIDC-CLAIMS, OIDC-ASSUME ... got=ok and
      INFERENCE-SMOKE lines; a real
      litellm completion against a stubbed transport answering 401 echoes no part of a planted key to fd 1 or 2, and a
