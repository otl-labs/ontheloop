closes_criteria: []
infrastructure_dependencies:
  - "No terraform change. Uses the live role agent-platform-github-ci-persona-verdict (created 2026-11-16, trust read back this session) and the persona-verdict Environment (terraform/github, applied by #2002 888f5b56)."
acceptance_criteria:
  - On a fixture PR after merge, one persona-verdict run on main's definition shows smoke PASS for both tier roles (INFERENCE-SMOKE outcome=PASS, a sub ending environment:persona-verdict) and refusal KEY-REFUSAL PASS (AccessDenied, a sub with no environment part), each after EGRESS-SELF-CHECK PASS on an eth0-placed runner.
  - The smoke job holds no package index host; its packages come only from a hash-checked wheelhouse of docker/persona/requirements-persona.txt.
  - No AWS account id, ARN, region id or wildcard is committed under .github/ or in config/persona_verdict_egress.yaml; no public log line carries a key, token, credential, ARN or account id.
  - validate_persona_verdict_egress, validate_persona_verdict_chain, validate_persona_trigger_policy and validate_project_region pass on the live tree and refuse each red fixture.
  - rec-5166's acceptance node passes; rec-5041's acceptance is tightened to node ids; both close through the merge's Resolves trailer (VP 10).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Live read-back of the role trust before any job assumes it.
    command: >-
      aws iam get-role --role-name agent-platform-github-ci-persona-verdict --profile agent_platform --query
      'Role.AssumeRolePolicyDocument.Statement[0].Condition.StringEquals."token.actions.githubusercontent.com:job_workflow_ref"'
      --output text
    expected: Prints otl-labs/ontheloop/.github/workflows/persona-verdict.yml@refs/heads/main.
    fix_if: A different string or an error is a STOP to the plan owner; no workflow edit merges until the role matches.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: Live read-back that the persona-verdict Environment matches its HCL (the session proxy refuses the environments API).
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="terraform-github-apply.yml", workflow_runs_filter={branch: "main", status: "completed"}) for the newest
      run (terraform-github-plan.yml runs only on pull_request_target, never on main), then list_workflow_jobs and
      mcp__github__get_job_logs(job_id=<preview job>, return_content=true); then mcp__github__list_commits(owner="otl-labs",
      repo="ontheloop", sha="main", path="terraform/github", perPage=1).
    expected: >-
      The newest completed terraform-github-apply run's preview job (its terraform plan) shows no pending change to
      github_repository_environment.persona_verdict or its deployment policy, and its head commit is at or after the
      newest main commit touching terraform/github/ (every such commit triggers a push run); report the run id (at
      planning the newest was 44756210341, re-measure at build time). Step 9's smoke sub (environment:persona-verdict) is
      the second read-back, covering drift made after that run.
    fix_if: >-
      A pending Environment change, or a newest run older than the newest terraform/github/ commit, is a STOP to the plan
      owner until a terraform-github-apply run on main shows none.
    hermetic: false
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: Unit tests for the new verbs, the checks and the smoke.
    command: >-
      bin/venv-python -m pytest tests/personas/test_oidc_assume.py tests/personas/test_key_refusal.py
      tests/personas/test_inference_smoke.py tests/personas/test_run.py tests/personas/test_route.py
      tests/checks/ci_guards/test__persona_verdict_keyed.py tests/checks/ci_guards/test_validate_persona_verdict_chain.py
      tests/checks/misc/test_validate_persona_verdict_egress.py tests/checks/ci_guards/test__persona_llm_signatures.py
      tests/checks/ci_guards/test_validate_project_region.py tests/checks/iam_tf/test_persona_verdict_role.py
      tests/scripts/test_smoke_inference_credentials_ci.py tests/test_smoke_test_inference_credentials.py
      tests/test_llm_litellm_wire.py tests/ci/test_persona_verdict_egress.py tests/ci/test_persona_verdict_isolation.py
      tests/checks/contracts/test_ports_verdict_chain_records.py tests/checks/misc/test__manifest.py -q
    expected: All tests pass.
    expected_literals: [passed]
    fix_if: A test fails; fix the code inside scope, never the assertion (Decision 235).
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-first-key-read-units
  - step: 4
    phase: pre-deploy
    action: The registered checks (and the run-body ratchet) pass on the live tree.
    command: >-
      bin/venv-python -c "from scripts.checks.misc.validate_persona_verdict_egress import validate_persona_verdict_egress as a; from scripts.checks.ci_guards.validate_persona_verdict_chain import validate_persona_verdict_chain as b; from scripts.checks.ci_guards.validate_persona_trigger_policy import validate_persona_trigger_policy as c; from scripts.checks.ci_guards.validate_project_region import validate_project_region as d; from scripts.checks.ci_guards.validate_composite_action_shell_bodies import validate_composite_action_shell_bodies as e; f=[]; [g(f) for g in (a,b,c,d,e)]; assert not f, f; print('KEYED_CHECKS_OK')"
    expected: Prints the ok marker.
    expected_literals: [KEYED_CHECKS_OK]
    fix_if: A rule refuses the live workflow; fix the workflow or file to the scope row's shape.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates five registered checks the fast and full tiers run on every PR and on main, so a graduated copy adds no
      guard.
  - step: 5
    phase: pre-deploy
    action: The wheelhouse installs offline from the image's lock, and litellm imports with no network.
    command: >-
      d=$(mktemp -d) && bin/venv-python -m pip download --require-hashes --no-deps --only-binary :all: --python-version 3.12
      "--platform=manylinux_2_28_x86_64" "--platform=manylinux_2_17_x86_64" "--platform=manylinux2014_x86_64" "--platform=any"
      --implementation cp -r docker/persona/requirements-persona.txt -d "$d/w" -q && echo WHEELHOUSE_OK $(ls "$d/w" | wc -l)
      && bin/venv-python -m venv "$d/v" && "$d/v/bin/python" -m pip install --no-index --find-links "$d/w"
      --require-hashes --no-deps -r docker/persona/requirements-persona.txt -q && env -u LITELLM_LOCAL_MODEL_COST_MAP -u
      LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS "$d/v/bin/python" -I -c "import os, sys, socket; sys.path.insert(0, '.'); tried
      = []; socket.socket.connect = lambda *a, **k: (tried.append(1), (_ for _ in ()).throw(OSError('blocked')))[1]; from
      scripts.llm.litellm_wire import load_litellm; load_litellm(); import scripts.personas.inference_smoke; assert
      os.environ.get('LITELLM_LOCAL_ANTHROPIC_BETA_HEADERS') and os.environ.get('LITELLM_LOCAL_MODEL_COST_MAP'), 'unset';
      assert not tried, 'connected'; print('OFFLINE_IMPORT_OK')"
    expected: >-
      Run from the repository root. Prints WHEELHOUSE_OK with a non-zero count (every pin has a cp312 manylinux or pure
      wheel), then OFFLINE_IMPORT_OK: the wheelhouse installs with no index, and with neither LITELLM_LOCAL_* variable
      exported, load_litellm() sets both and litellm plus inference_smoke import with no socket connect attempted. At
      planning (2026-11-21) the download gave 72 wheels and the check without the inference_smoke import was red
      ('unset', load_litellm sets no beta-headers variable today) with no connect attempted.
    fix_if: >-
      A pin without a cp312 wheel, or an import that connects, is a STOP to the plan owner (the wheelhouse form or the
      LITELLM_LOCAL_* set needs a replacement).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      No account id or account-identifying ARN was committed anywhere, and no ARN or region id under .github/ or in
      config/persona_verdict_egress.yaml (AC3's bound). Test ARNs (the redaction fixtures) use a non-12-digit placeholder
      account; region literals in test fixtures elsewhere stay allowed.
    command: >-
      a=$(git diff origin/main...HEAD -- .github config scripts tests docs ':!docs/plans' | grep -E '^\+' | grep -cE '\b[0-9]{12}\b|arn:aws:[^:]*:[^:]*:[0-9]{12}:');
      b=$(git diff origin/main...HEAD -- .github config/persona_verdict_egress.yaml | grep -E '^\+' | grep -cE 'arn:aws:|(eu|us|ap|ca|sa|me|af)-(west|east|north|south|central|northeast|southeast)-[0-9]');
      test "$a$b" = 00 && echo NO_LEAK
    expected: Prints NO_LEAK.
    expected_literals: [NO_LEAK]
    fix_if: Any match is removed before push; a test fixture's account id is a synthetic non-12-digit placeholder only (VP 6 counts every 12-digit run).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A PR-relative diff scan with no meaning on main once merged; the pre-commit never-commit hook and the fast tier's
      secret-shape checks are the standing guards, and docs/plans is excluded because this plan names the region forms.
  - step: 7
    phase: pre-deploy
    action: Fast tier, then the full tier before handoff.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate &&
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and --verify-head confirms the head. The full tier outlasts the foreground cap: start it as a
      harness-tracked background run with a 2 h limit from the top-level session; the verdict is --verify-head.
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner (main reds owned elsewhere are deferred).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Tighten rec-5041's acceptance to node ids before the merge's Resolves trailer.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --update-rec rec-5041 --acceptance "bin/venv-python -m pytest
      tests/ci/test_persona_verdict_egress.py::test_the_live_tree_passes_check_tree
      tests/ci/test_persona_verdict_isolation.py::test_planted_snapshot_modules_are_never_processed
      tests/ci/test_persona_verdict_isolation.py::test_no_loaded_module_comes_from_the_snapshot
      tests/ci/test_persona_verdict_isolation.py::test_negative_control_fires_without_isolation
      tests/checks/ci_guards/test__persona_verdict_keyed.py::test_live_file_passes -q" --context "<rec-5041's current
      context, read back first with recs_by_ids and kept byte for byte> Update 2026-11-21: parts 2 and 3 close with
      PLAN-persona-verdict-first-key-read (the block filter and its self-check guard the first keyed jobs); the container
      leg moves to PLAN-persona-verdict-fixture-run." then bin/venv-python -c "from src.common.ducklake_reader_client
      import fetch_recs_by_ids, make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5041']);
      print(rows[0]['acceptance']); print(rows[0]['context'][-200:])"
    expected: >-
      The read-back prints the new acceptance and a context ending with the container-leg sentence. The acceptance
      passes acceptance_lint with require_discrimination (checked at planning: every path carries a node id). Run that
      acceptance command locally: it passes.
    fix_if: A write that fails loudly is re-filed after connectivity returns (Decision 84 I-4); never drop the trailer instead.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Proof on main: after merge, on the build branch restarted from main, commit one head that REWRITES (>, never
      appends) tests/fixtures/persona_verdict/fixture_pr/proceed.txt with printf '\n%s\n' proceed and nothing else; run the
      full tier and --verify-head; push once (cancel-in-progress cancels on a second push) and open one draft fixture PR.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") for the run on the fixture head, then list_workflow_jobs with
      workflow_jobs_filter {filter: "all"} and mcp__github__get_job_logs(job_id=<id>, return_content=true) for keyprep,
      smoke and refusal; then mcp__github__update_pull_request(state="closed") for the fixture PR.
    expected: >-
      keyprep, smoke and refusal concluded success in one run on main's definition; smoke shows EGRESS-SELF-CHECK PASS,
      a printed sub ending environment:persona-verdict, OIDC-ASSUME got=ok and INFERENCE-SMOKE outcome=PASS for primary
      and for warm_fetched_escape_hatch; refusal shows EGRESS-SELF-CHECK PASS, a sub with no environment part,
      OIDC-ASSUME expect=AccessDenied got=AccessDenied and KEY-REFUSAL PASS; the saved keyprep, smoke and refusal logs
      give zero matches (counts reported) for each of arn:aws:, \b[0-9]{12}\b, eyJ[A-Za-z0-9_-]{10,} (a JWT),
      \b(AKIA|ASIA)[A-Z0-9]{16}\b, IQoJb3JpZ2lu (an STS session-token prefix) and \bsk-[A-Za-z0-9_-]{8,}
      (both key forms: DeepSeek sk-... and Anthropic sk-ant-...); smoke shows OIDC-CLAIMS before
      OIDC-ASSUME for each role; verdict_probe.proceed concludes success. An attempt that stops as UNSUPPORTED_PLACEMENT is re-run with
      mcp__github__actions_run_trigger(method="rerun_failed_jobs", run_id=<id>), at most 10 attempts, until smoke and
      refusal both pass; report the run id and attempt numbers to the plan owner and the coordinator as c1's first-key-read
      read-back and c7 ORDER's evidence.
    fix_if: >-
      Any FAIL line, a missing host (a filter block in the log), a refusal that got anything but AccessDenied, or no
      passing attempt in 10 is a STOP to the plan owner with the log lines; a non-zero scan count is a STOP to the plan
      owner with the pattern name, the job and step holding the line and its line number, never the matched text (a
      12-digit job id or byte count is triaged from those); never widen a list, drop a case or retry the
      assume in code.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      The squash-merge body carries "Resolves: rec-5166, rec-5041"; after ci.yml's trailer-closure job (about 16 to 20
      minutes after the merge), read both recs back.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, missing =
      fetch_recs_by_ids(make_reader(), ['rec-5166', 'rec-5041']); print(sorted((r['id'], r['status']) for r in rows),
      missing)"
    expected: Prints [('rec-5041', 'closed'), ('rec-5166', 'closed')] [] and the trailer-closure run id is reported.
    fix_if: >-
      A rec still open: read the trailer-closure job log; an acceptance that fails on main is a STOP to the plan owner,
      never an acceptance rewrite to obtain closure.
    hermetic: false
    graduation: not-applicable
