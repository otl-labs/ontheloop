  - file: scripts/personas/egress_floor_container.py
    action: Modify
    purpose: >-
      Amendment 1 (2026-11-25, build stop under the sudo log_input residual; critique r6 A1-B1, A1-B2), as revised
      by Amendment 2 (2026-11-25, build stop at VP 9): the key passes through sudo's stdin, so sudo I/O logging must
      be off for the two launcher commands. SUDOERS_LINES stays the three lines on main (deny, then the two launcher
      lines, NOPASSWD only): the hosted runner's sudo is sudo-rs (/usr/lib/cargo/bin/sudo and visudo, run
      45631879879), whose visudo -cf rejects a "Defaults:runner" line, the log_* settings ("unknown setting:
      log_input") and NOLOG_INPUT/NOLOG_OUTPUT tags, while the three lines parse under both sudo-rs and C sudo
      (reproduced locally with sudo-rs 0.2.2 and sudo 1.9.15p5). sudo-rs has no I/O logging at all, and C sudo logs
      no I/O unless a sudoers file turns it on, so the control on either implementation is the read-back below, not
      the drop-in. verify() gains sudo_io_logging_off. It reads its paths through module constants the tests patch (the sudoers
      file, the sudoers.d directory, sudo.conf, nsswitch.conf), never raises, and decides each input form: (a) a
      sudoers file other than the drop-in (/etc/sudoers and every /etc/sudoers.d entry, whole-line # comments
      stripped but #include and #includedir kept as directives) that names, case-insensitively, log_input,
      log_output, log_stdin, log_ttyin, log_stdout, log_stderr, log_ttyout, iolog_dir, iolog_file or log_servers
      (so LOG_INPUT:/LOG_OUTPUT: tags too) fails; (b) any include directive (@include, @includedir, #include,
      #includedir) fails except exactly "@includedir /etc/sudoers.d" or "#includedir /etc/sudoers.d" in /etc/sudoers;
      (c) an unreadable sudoers file or sudoers.d directory fails; (d) an absent /etc/sudo.conf passes (the stock
      plugins load), an unreadable one fails, and a Plugin line passes only when, whitespace-normalised, it equals
      "Plugin sudoers_policy sudoers.so", "Plugin sudoers_io sudoers.so" or "Plugin sudoers_audit sudoers.so" (no
      arguments, so no sudoers_file= or ldap_conf= redirect); (e) an nsswitch.conf whose sudoers: line is anything
      but "files" fails (SSSD or LDAP sudoers rules are read by nothing here); no sudoers: line, or no file, passes.
      The check is the same on both implementations (sudo-rs reads neither sudo.conf plugins nor nsswitch, so
      those forms only matter where C sudo runs). A tightening. persona-verdict-egress-probe.yml runs this same floor on pull_request for
      scripts/personas/egress_*.py, so it is a second consumer and the build PR exercises the check live (VP 9);
      nothing else in the floor changes.
