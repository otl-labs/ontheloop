  - file: scripts/checks/ci_guards/_persona_llm_signatures.py
    action: Modify
    new_imports: []
    purpose: >-
      Two new signatures (rule b), each a regex over the comment-stripped run text after the new signatures join
      backslash continuations themselves (_direct_llm today searches comment-stripped text without joining, so
      INFERENCE_SMOKE's continued form is not matched; the build files a rec for that, outside scope): LAUNCHER_RUN = egress_launcher\.py["']?\s+["']?run\b
      and PERSONA_REQUEST = run\.py["']?\s+persona-request\b. Because the regex reads raw text, quoting, extra
      whitespace, a backslash continuation, a trailing comment, and the grouped forms bash -c '...', sh -c, $( ... ),
      { ...; } and an env- or exec-prefixed sudo all match. Residual, named: a variable holding the launcher path or
      verb (for example L=...; sudo "$L" run) does not match; its compensating controls are the floor's sudo-token
      rule (_persona_verdict_floor.py: any sudo line outside the exact literal set is refused) in covered jobs, and
      the launcher's own uid and install-manifest refusal elsewhere. A second named residual: a step that calls
      keyed_run.request_main directly (python3 -c or an import from another module) is neither an LLM step nor a
      role-fence hit; its controls are the run job's closed step list and pinned literals inside persona-verdict.yml
      and the role's job_workflow_ref trust outside it. The probe mode is not an LLM step.
