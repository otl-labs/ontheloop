schema_version: 7
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-fixture-run"
intent: >-
  Solves rec-5550 (split of rec-5545, part C). The verdict chain's run job stops running the deterministic probe and
  instead, on fixture PRs only, holds the inference key and runs the fixture persona canary_persona (rec-5553) from the
  digest-pinned image through the fixed root launcher behind the container egress control (rec-5549), posting an
  advisory check run. The container leg's red fixture is re-run in that key-holding job before the key read and as its
  last step. With rec-5548's local leg this meets T4.32 c3 (fixture run, injection case, wake, input completeness) and
  c7 (container leg proven while holding a key), so persona add steps can start (the criteria flip in follow-on rec-5561).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-fixture-run.yaml
phase: >-
  T4.32 (persona foundation): c3 FIXTURE RUN and c7 EGRESS container leg; the decomposition_hints row
  PLAN-persona-verdict-fixture-run, split 2026-11-23 into rec-5548 (A), rec-5549 (B), rec-5550 (C, this plan) and
  rec-5551 (D).
cites: [dec:181, dec:205, dec:224, dec:235, dec:246, dec:263]
amends: []
introduces: []
scope:
  - file: .github/workflows/persona-verdict.yml
    action: Modify
    purpose: >-
      The run job becomes a covered container job on fixture PRs only. Condition: the keyed condition (KEYED_IF) and
      keyprep success; needs [prepare, keyprep]; environment persona-verdict; permissions exactly {contents: read,
      id-token: write}. Steps in order: the pinned filter (block, the run row, disable-sudo-and-containers false,
      telemetry off); check out main; the container floor (sudo python3 -I .../run.py egress-floor-container, which
      pulls the pinned image by digest); create the work directory; the self-check; download prepared inputs; the
      container red fixture (the PROBE line below); set up Python 3.12, download and install the wheelhouse offline
      (as smoke does); the persona step (the PERSONA line below) with env exactly AWS_ACCOUNT_ID, PERSONA_AWS_REGION
      and PERSONA_SNAPSHOT at the values smoke's steps use (keyed REGION_ENV, ACCOUNT_ENV and the snapshot path) and
      working-directory the work directory; the step named "Upload verdict results" (persona-verdict-results,
      retention 1 day, unchanged name: github-actions-evidence.yaml reads it); the PROBE line again; the always()
      final self-check. timeout-minutes 25 (worst case: 300 s pull, 2 x 120 s probes, 600 s run, plus setup). The
      literal run texts, each one logical line: FLOOR = sudo python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-floor-container; PROBE = python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-container-request | sudo /usr/bin/python3 -I -S /usr/local/lib/persona-egress/egress_launcher.py probe; PERSONA = python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" persona-request | sudo /usr/bin/python3 -I -S /usr/local/lib/persona-egress/egress_launcher.py run | python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py" persona-record.
      The header comment names the run job among the keyed jobs. No other job changes.
  - file: config/persona_verdict_egress.yaml
    action: Modify
    purpose: >-
      Row for persona-verdict.yml run: sts.{aws_region}.amazonaws.com:443, ssm.{aws_region}.amazonaws.com:443, the
      routed tier's provider host (api.deepseek.com:443) and pkg-containers.githubusercontent.com:443 (the GHCR blob
      host rec-5549 proves). No account or region id is written (Decision 101).
  - file: config/persona_image.yaml
    action: Modify
    purpose: >-
      consumers.github_actions_shell becomes {status: built, location: scripts/personas/keyed_run.py} (T4.2 c8's image
      clause; validate_persona_image_digest requires a built location whose .py calls load_pin). ports.yaml's
      persona_compute_host github_actions_shell adapter row stays pending under T4.2:c8 (its conformance leg is not
      this plan's).
  - file: scripts/personas/execute.py
    action: Modify
    purpose: >-
      Rewritten to the schema helpers only (post_verdict imports it; it now reads the contracts and the index as YAML,
      so its closure becomes {jsonschema, yaml}, a named planned change, inside post_verdict's existing row); the probe
      runner, PROBE_* constants, SCHEMAS and the unkeyed subprocess path are removed. schema_for(root, route_id,
      kind) reads input_schema or output_schema from docs/contracts/personas/<route_id>.yaml for a route named in the
      index's fixture_kind.personas, else None (post_verdict keeps calling it); failure_schema_for(root, route_id)
      returns the failure envelope limited to that contract's failure_outputs ids.
  - file: scripts/personas/keyed_run.py
    action: Create
    new_imports: [scripts.personas.execute, scripts.personas.oidc_assume, scripts.personas.telemetry_rows, src.persona_hosts.image_pin, src.turn_capture.host_run, src.turn_capture.transcript]
    purpose: >-
      The run job's two keyed verbs, in a module post_verdict never imports (closure {boto3, botocore, jsonschema,
      yaml, src}; never scripts.telemetry_capture). request_main (verb persona-request): requires
      prepared/routes.json to hold exactly one route and that route to be in fixture_kind.personas, and no
      prepared/failure-<route>.json; validates the input against execute.schema_for's input_schema; resolves the
      route's primary-role provider prefix from docs/contracts/inference-provider.yaml; claim-checks the OIDC token
      (environment persona-verdict, persona-verdict.yml@refs/heads/main) and assumes the role through oidc_assume,
      reads that role's key from SSM in-process, and writes exactly one JSON object {persona, provider, input, key}
      to stdout. Every diagnostic goes to stderr: request_main wraps the claims and oidc_assume.report calls in
      contextlib.redirect_stdout(sys.stderr) before the fd guard, so the success-path stdout is that one object and
      nothing else. Any refusal prints nothing to stdout and exits 2 with one fixed marker line on stderr. fds 1 and
      2 are guarded as inference_smoke guards them, and the one success write goes to the saved fd 1 (the pipe), never to
      the scratch file: no token, key, ARN or account id reaches the log. record_main
      (verb persona-record): reads the launcher's stdout from stdin (capped); writes results/<route>.json in the
      shape post_verdict.judge reads: {route, failure} from a failure file, else {route, exit_code, timed_out,
      stdout, image_digest} from the launcher result, or {route, failure: "launcher_no_result"} when stdin is empty
      or not that object (a request or launcher refusal; the step stays green, so the run log and this distinct value
      are the operator's read); image_digest comes from src.persona_hosts.image_pin.load_pin. It writes the gha
      host-run sidecar with a stdlib writer over src.turn_capture.host_run's shape: top level exactly
      {schema_version: host_run.SCHEMA_VERSION, project_ref, agent, content_policy, host}; project_ref read from
      main's .claude/settings.json by Decision 224's one-home rule (the SessionStart pin hook's flag, via
      src.turn_capture.transcript's PIN_SCRIPT_STEM, PIN_FLAG, hook_script and unquoted) and checked with
      host_run.valid_project_ref; agent canary-persona; content_policy withheld (the rows file sits in a public
      one-day artifact, so it carries counts, model and hashes, never prompt or completion text); host {kind gha,
      run_id, run_attempt, job run, retry_ordinal 1, event_name workflow_run, repository, workflow_path
      .github/workflows/persona-verdict.yml, ref, sha, checkout_sha} from GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT,
      GITHUB_REPOSITORY, GITHUB_REF, GITHUB_SHA and the checked-out main SHA, checked with host_run.valid_host_facts
      before it is written. When the result carries events it writes the rows file results/telemetry-<route>.json
      through scripts.personas.telemetry_rows; its exit codes 2-4 are recorded as results/telemetry-<route>.status
      and never fail the step. Rows are never sent (rec-5551). Request refuses zero or several routes; record then
      writes {route, failure: "input_unusable"} for each listed route, and nothing when none is listed.
  - file: scripts/personas/post_verdict.py
    action: Modify
    purpose: >-
      judge reads a failure value before the output schema: when the parsed stdout is an object whose outcome is
      failure, it is validated against the failure envelope (execute.failure_schema_for: outcome const failure,
      failure enum the contract's failure_outputs ids, detail string) and posts "failed: <id>"; an envelope with an
      unlisted id posts "output failed its schema". A success value is validated against output_schema as today.
      The conclusion mapping and check names are unchanged.
  - file: scripts/personas/route.py
    action: Modify
    purpose: >-
      probe_routes becomes fixture_routes: when the diff is known and every path is under
      tests/fixtures/persona_verdict/fixture_pr/ with at least one added or modified .txt, the routes are the index's
      fixture_kind.personas (read from executor-personas.yaml, so no persona-id literal) and only those (no verdict
      persona routes a fixture-only diff, so request_main never sees two routes there), else []. routes.json gains
      fixture_paths (the added or modified .txt paths, sorted). PROBE_STEMS and PROBE_PREFIX go; the fixture output
      keeps its meaning (a fixture-only diff).
  - file: scripts/personas/materialise.py
