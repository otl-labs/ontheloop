pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - rec-5548, rec-5549, rec-5553 and rec-5486 builds merged, rec-5549's VP 8 keyless proof on main, and a pin whose source_commit is at or after the rec-5553 and rec-5486 merges on main; otherwise STOP and tell the plan owner
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "execute.py, keyed_run.py, route.py, materialise.py, override.py, post_verdict.py, resolve_pr.py and run.py as their scope rows; delete the probe, its schema, its tests and the four marker files (proceed.txt and revise.txt stay unchanged)."
  - "egress_launcher.py's run-mode result object, with its manifest hash and test."
  - "persona-verdict.yml's run job, config/persona_verdict_egress.yaml's run row, config/persona_image.yaml's consumer row and the inline-body baseline rows."
  - "_persona_verdict_keyed.py (k1-k3), validate_persona_verdict_chain.py (c1-c3), _persona_verdict_floor.py (the named widening), _persona_llm_signatures.py and _persona_verdict_container.py, then their tests and the role fence's needle; the roadmap hint note; Amendment 1's egress_floor_container.py (sudo_io_logging_off; the drop-in keeps its three lines per Amendment 2) with its test, test_post_verdict_app_token.py's retarget, and project-configuration.yaml's readers row with its amendment_compact run."
  - "Execute the Verification Plan -- run each step; loop until pass; on an unrecoverable live failure stop and report to the plan owner (Decision 55)."
  - "Before merge: the operator's final-diff word on the guard and security code (Decision 246 cl.4). Then squash-merge with Resolves: rec-5550 in the commit body, run VP 6-8, and reopen rec-5550 with update_rec on any live failure."
  - "Flip implementation_declared to true in the build commit."
  - "Report: what was implemented, run ids, tokens per run and the wake observations."
