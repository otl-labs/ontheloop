constraints:
  - No rescue agents or workaround loops (Decision 55).
  - Never loosen a check or drop a probe case to obtain green (Decisions 181, 235); a live surprise is a STOP to the plan owner.
  - "Decision 235 cl.1 planned changes, each named here, each with its red fixture, and approved with this plan: _persona_verdict_container.py admits one key-holding class job (persona-verdict.yml run) with both PROBE steps' keys pinned; _persona_verdict_keyed.py adds run to KEYED_JOBS with the Environment and the one secret step, plus its scope row's k1 (pip map, exactly PIP_INSTALL), k2 (exactly the prepared and wheels downloads and the results upload, the one new data exit from a key-holding job) and k3 (the run.py sequence and the closed step list in which every step equals its canonical mapping, a tightening), execute's import-closure row gaining yaml (test_run.py ALLOWED), plus the k4 tightening (no job-level env or defaults on keyed jobs, no top-level env or defaults); validate_persona_verdict_chain.py replaces the keyless run shape with c1 (KEYED_ENVIRONMENTS, KEYED_ID_TOKEN gain run), c2 (JOB_PERMISSIONS run) and c3 (the mkdir rule's container-FLOOR exemption); _persona_verdict_floor.py's exact launcher-line set gains the PROBE and PERSONA literals and its floor admission the FLOOR literal, only in a container-class job (a widening, named); _persona_llm_signatures.py and the role fence in test_persona_verdict_role.py tighten (LAUNCHER_RUN, PERSONA_REQUEST, the persona-request needle). Amendment 1 adds one tightening: egress_floor_container.py's sudo_io_logging_off verify check (also run by persona-verdict-egress-probe.yml); Amendment 2 keeps the sudoers drop-in at its three lines on main. Any rule change not in this list is a STOP to the plan owner for an amendment."
  - "rec-5549's residuals for this job: the key is never printed, so no add-mask line is written (one would itself put the key in the step's output stream); container output is untrusted data, size-capped and judged only against the contract's output_schema; a spend-capped provider key is the operator's provider-account setting, outside the repository, a named residual."
  - "c7 reading: the second container probe is the step before the always() final self-check the floor rules require last; it is not always(), so it runs on every run that reached it, and a run that failed earlier has already failed."
  - "The results artifact is public for one day: the telemetry rows file holds the run's model, token counts, prompt hashes and the gha sidecar (public run ids), never an account id, region id, key or unpublished host (Decision 101); record refuses to write a row file that fails telemetry_rows' own refusal."
  - "If rec-5549 pins the launcher's sha256 in a file outside this scope, the hash update is a STOP to the plan owner for an amendment, never an out-of-scope edit."
  - The key is never on argv, in an environment variable, in a file or in the log; it passes only through the pipe into the launcher (Decision 263 cl.4 and rec-5549's build).
  - Keyed jobs run on fixture PRs only; no other PR reaches the run job's key read.
  - Decision 246 cl.4 - the build PR merges only after the operator's final-diff word on the guard and security code.
  - "Residuals, named for any later gated persona on this job: the results upload runs before the second probe, so a probe failure after the key fails the job but not the already-uploaded check (sound while canary_persona is advisory); the key passes through sudo's stdin, so a sudoers log_input or iolog Default would write it to disk: Amendment 1 (2026-11-25, revised by Amendment 2) narrows this: the runner's sudo-rs has no I/O logging, and verify() refuses the input forms its scope row lists (any I/O logging name, a non-stock include, a foreign or argument-carrying Plugin line, a non-files sudoers source, an unreadable sudoers file). What it does not read stays a residual: a sudo binary or plugin replaced on disk, and an audit or log server configured outside sudoers and sudo.conf (both need root on the runner before the floor runs). Run mode end to end (the key-adding proxy, LiteLLM's base-URL variable, the image entrypoint and the contract baked into the pinned image) is first proven live in VP 6 after merge; the hermetic cover is the launcher's run-mode argv and result-shape tests, and the blast radius is advisory checks on fixture PRs."
