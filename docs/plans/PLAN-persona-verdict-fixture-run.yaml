  - file: scripts/checks/ci_guards/_persona_verdict_keyed.py
    action: Modify
    new_imports: []
    purpose: >-
      KEYED_JOBS gains run: condition KEYED_IF && keyprep success, permissions {contents: read, id-token: write},
      environment persona-verdict (_job_shape's Environment rule admits smoke and run only); secrets.AWS_ACCOUNT_ID
      only in run's persona step, after the first self-check and after the first launcher probe step. Run-specific
