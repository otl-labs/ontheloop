      tests/personas/test_wake.py::test_a_sweep_posts_no_fault_comment_and_wakes_marks_only_when_landed -q
    expected: All selected tests pass.
    fix_if: A test fails; fix the code inside scope, never the assertion (Decision 235).
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-main-rescout-units
  - step: 3
    phase: pre-deploy
    action: Regression over the touched modules' suites and the chain guards' live pairs.
    command: >-
      bin/venv-python -m pytest tests/personas/test_resolve_pr.py tests/personas/test_route.py
      tests/personas/test_post_verdict.py tests/personas/test_wake.py tests/personas/test_rescout.py
      tests/checks/ci_guards/test_validate_persona_verdict_chain.py tests/checks/ci_guards/test_validate_persona_trigger_policy.py
      tests/checks/ci_guards/test__persona_verdict_keyed.py -q
    expected: All tests pass.
    fix_if: A pre-existing test fails; fix the code inside scope or STOP to the plan owner; never edit an assertion out of scope.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: duplicates the graduated shards that already run these files
  - step: 4
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: All fast-tier checks pass.
    fix_if: A check fails; fix inside scope or STOP to the plan owner; never loosen a check (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: is the fast tier itself
  - step: 5
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Full tier passes and --verify-head confirms it for the head (background, 2 h limit, HOME an empty directory).
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: is the full tier itself
  - step: 6
    phase: post-deploy
    action: >-
      Live drill, part 1. Before the build merges, open a fixture-only PR (allowlisted author) adding
      tests/fixtures/persona_verdict/fixture_pr/rescout_drill.txt and let its own canary run post. The first later push
      to main touching a watched path (any merge; the build itself touches none) starts the sweep; the session
      subscribes to the fixture PR and waits on its persona-verdict-rescout wake comment, never polling.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") for event push on that main SHA, then list_workflow_jobs and get_job_logs for
      prepare, post and wake; mcp__github__pull_request_read(method="get_check_runs", pullNumber=<fixture PR>) and
      method="get_comments"
    expected: >-
      The run has event push; prepare, keyprep, post and wake succeeded; run, run-fallback, smoke and refusal concluded
      skipped; on the fixture PR only (other open PRs may add entries, so counts are not asserted): its head's newest
      persona-verdict/canary_persona check concluded failure, titled re-scout required, with the verdict App's app id,
      and exactly one comment holds a persona-verdict-rescout marker for that head.
    fix_if: Any other shape is a STOP to the plan owner with the run id; rec-5654 is reopened with update_rec naming it.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Live drill, part 2. After the next qualifying main push, read again; then re-run the fixture PR's latest persona-verdict-trigger run and read once more; then close the fixture PR.
    command: >-
      mcp__github__pull_request_read(method="get_check_runs", pullNumber=<fixture PR>) and method="get_comments" after
      the second sweep; mcp__github__actions_run_trigger(method="rerun_workflow_run", run_id=<trigger run>) then
      list_workflow_runs on persona-verdict.yml for event pull_request at the fixture head
    expected: >-
      On the fixture PR, the second sweep adds no persona-verdict/canary_persona check and no rescout comment; the re-run
      starts a pull_request-origin persona-verdict run whose post lands a fresh persona-verdict/canary_persona check
      newer than the mark.
    fix_if: >-
      A duplicate mark or comment on the fixture PR, or no workflow_run on the re-run, is a STOP to the plan owner with
      the run ids; a rerun refused for want of actions write on the session's GitHub identity is a STOP to the operator
      (he re-runs it from the Actions UI and the reads continue). Placeholders are the fixture PR number and its latest
      persona-verdict-trigger run id, read at run time.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: rec-5654 closed by the build's squash-merge Resolves trailer once its acceptance holds.
    command: bin/venv-python -c "from src.common import ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(), ['rec-5654']); print(r[0]['id'], r[0]['status'])"
    expected: Prints rec-5654 closed.
    fix_if: Still open after the closure job ran; read ci.yml's closure job log and report to the plan owner.
    hermetic: false
    graduation: not-applicable
