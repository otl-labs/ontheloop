execution_steps:
  - "Build start: re-measure with bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-persona-verdict-main-rescout.yaml and the contract byte caps; git-ops.yaml, ports.yaml or exit-criteria-ledger.yaml past a cap after the named relief is a STOP to the plan owner. Re-read the next free Decision number on main."
  - "scripts/session/merge_scout_inputs.py with tests/test_session_merge_scout_inputs.py, red first."
  - "tests/fixtures/merge_overlap_repos.py install_project copies the new module; the six fixture-project suites stay green."
  - "docs/contracts/ports.yaml SA-04 and docs/contracts/git-ops.yaml with exactly the named edits; re-measure both byte caps (the plan's figures are at main ec28df09)."
  - ".claude/hooks/merge_gate.py with its hook tests, red first."
  - "docs/DECISIONS.md from the sidecar word for word ({{N}} and {{DATE}} filled); then git-ops.yaml and exit-criteria-ledger.yaml naming that number."
  - Execute Verification Plan -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55)
  - "Report: what was implemented, verification results"
rollback: Revert the build's code and contract edits (merge_scout_inputs.py, its tests, the merge_gate.py call, the fixture copy, git-ops.yaml, ports.yaml and exit-criteria-ledger.yaml); the merge gate returns to the overlap and checks legs alone. The new Decision and its dated notes on 83 and 245 stay (Decision 177's append-only lock) and are superseded by a dated note.
