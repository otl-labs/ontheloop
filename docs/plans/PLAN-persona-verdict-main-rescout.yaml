constraints:
  - scripts/session/merge_overlap.py and Decision 245's overlap rule are unchanged; the new predicate runs only on its CLEAR.
  - "scripts/roadmap/plan_fingerprint.py is not changed: every value comes from its load_tree, projection and fingerprint, and TREE_FILES only says which files to materialise, held complete by its test."
  - The new module stays under 500 SLOC and merge_gate.py stays under its limit; a breach is decomposed, never a budget raise (Decision 128).
  - "Fail closed (Decision 271 cl.3, the new Decision's cl.3): any failure to compute, or running past the deadline, refuses; no agent override."
  - Nothing runs on a push to main; no workflow, persona module, keyed job or GitHub permission changes (Decision 263, T4.32 c4).
  - "docs/DECISIONS.md changes only by the sidecar's words; git-ops.yaml's approved_text_binding key is not touched."
  - No rescue agents or workaround loops (Decision 55).
context:
  - "RE-SCOPED 2026-11-26 13:08 UTC by the operator (decision card: adopt the consult's plan) after his concern that the file rule's churn grows with main's throughput and a third blind consult (/mnt/project-files/persona-verdict-rescout/rec-5654-advisor-brief-3/ADVICE.md). Replayed over the 80 plans merged in the week to 2026-11-26, the file rule fired on 30 to 47 (2 to 6 hour PR lifetimes, inferred) and on build PRs; the fingerprint moved on 4 to 11. rec-5654's context and acceptance were updated (read back 13:15 UTC)."
  - "History: consult 1 (push-to-main sweep, rec-5654-advisor-brief/) escalated at critique r2; consult 2 (merge-gate file rule, rec-5654-advisor-brief-2/) drew scout r3's WARN that a new refusal ground needs its own Decision. This plan drafts that Decision in docs/plans/approved/persona-verdict-main-rescout.yaml (Decision 264's pattern: amends Decision 83, a dated Update on Decision 245)."
  - "Scout r3's Decision 254 NOTE: cl.8 narrows Decision 245's overlap rule only; the new Decision's cl.2 says the narrowing does not reach this predicate."
  - "Why after CLEAR: overlap CLEAR means no file changed on both sides, so the composite tree (head's file where the head changed it, else main's) is the merged state for every scout-input file, with no merge commit and no stale merge_commit_sha (critique r2 MRS2-02)."
  - "Why the barrier's compared-plan rule: a build PR that edits its merged plan for bookkeeping keeps the plan's fingerprint, so it is skipped and never woken for drift it cannot re-scout (critique r2 MRS2-01); a merged plan gone stale is rec-5671's build-start check."
  - "Pending intent: approved but unbuilt wording in other plans' sidecars is not compared; consult 3 Q3 and the operator's 2026-11-26 13:08 choice route it to rec-5673 (filed, read back open): declare amends completely, then flag conflicting approved intent at approval."
  - "Seam: when DECISIONS.md is split or the roadmap moves to the work-item store (post-MVP), plan_fingerprint.load_tree changes and the completeness test fails until TREE_FILES follows; the comparison itself is untouched. TREE_FILES lives in the new module, not plan_fingerprint, for the fast-tier budget: plan_fingerprint.py alone measures a 182-690 s test half and with DECISIONS.md the scope breaches."
  - "selection_budget at plan write (main 4f052a84): breadth_waived, predicted CI test half 172-662 s, docs/DECISIONS.md the main driver (128-490 s alone); declared here, not split, because the Decision and the code it governs land together."
  - "Trade the operator accepted: a stale check stays green on the PR page and is refused at merge, not repainted. Operator merges in the GitHub UI skip the hook (rec-4624)."
  - "Roadmap: T4.32 c4's 2026-11-26 amendment (rewritten for this design) and the PLAN-persona-verdict-rescout hint's split note land in THIS plan PR as planner roadmap bookkeeping."
  - "red_overlap at plan write (2026-11-26 13:25 UTC): clear, no reds."
  - "Graduated shards kept unchanged: merge-gate-trailer-attribution and merge-overlap-gate-fails-closed (tests/hooks/test_merge_gate.py); existing tests there are not edited, new ones are added."
  - "ports.yaml: the gate and session modules are not executor, adapter or port code (Decision 212's scope), so no row."
  - "No build dependency on rec-5653: the predicate works in session today; on Actions it relies on rec-5653's carry only once decision_scout is bound (T4.30)."
