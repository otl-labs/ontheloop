schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-main-rescout"
intent: >-
  Close T4.32 c4's push-to-main leg (rec-5654): a push to main that moves an open plan PR's scout-input fingerprint
  marks that PR's verdict-App scout check "re-scout required" on its current head and wakes its in-session owner, so no
  covered head keeps a verdict against superseded Decisions, north-star or roadmap text, while the keyed jobs admit no
  new event origin and a sweep spends no model tokens.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-main-rescout.yaml
phase: >-
  T4.32 (persona foundation): c4 leg 3 (push-to-main re-scout) and rec-5103's in-session residuals, advisory; c4 stays
  open until the decision_scout add plan (T4.30) proves the legs on a real plan PR, so closes_criteria is []
cites: [dec:205, dec:229, dec:262, dec:263, dec:264, dec:271, dec:273, dec:282]
amends: []
introduces: []
closes_criteria: []
scope:
  - file: .github/workflows/persona-verdict-rescout.yml
    action: Create
    purpose: >-
      The third upstream: on push, branches [main], paths exactly rescout.WATCHED_PATHS (docs/DECISIONS.md,
      docs/DECISIONS_ARCHIVE.md, docs/contracts/north-star.yaml, docs/ROADMAP-PLATFORM.yaml); top-level and job
      permissions {}; one job, one echo step, no checkout, no uses:, no secrets, no Environment.
  - file: .github/workflows/persona-verdict.yml
    action: Modify
    purpose: >-
      workflow_run.workflows gains persona-verdict-rescout (in place); the concurrency group expression gains one
      branch so every push-origin run shares the fixed group persona-verdict-<repo>-rescout-sweep (in place); no job,
      step, permission or condition changes, so every keyed job keeps its workflow_run.event == 'pull_request' conjunct.
  - file: scripts/personas/sweep.py
    action: Create
    new_imports: [scripts.personas.resolve_pr, scripts.personas.route, scripts.personas.rescout, scripts.personas.execute, scripts.session.merge_checks]
    purpose: >-
      The level-triggered sweep, no persona-id literal. WATCHED_PATHS (the tuple above); PAGE_CAP = 10;
      RESCOUT_PREFIX "<!-- persona-verdict-rescout v1 " with render_mark (one line, compact sorted JSON, keys exactly
      {route, head_sha, main_sha, fingerprints}); MARK_TITLE "re-scout required". sweep(repo, token, main_root,
      main_sha) -> list of entries {number, head_sha, kind: mark|wake, route, fingerprints, reason}: lists every open PR
      (state=open, per_page=100, at most PAGE_CAP pages; a full last page or any API error raises SweepError, so
      prepare fails loudly and the next sweep, being level-triggered, heals; no count cap, since a mark spends no
      tokens); keeps PRs whose head
      repository is this one and whose author resolve_pr.is_allowlisted admits (Decision 205 cl.2); reads the diff with
      route.changed_files (unknown diff: the PR is treated as stale for both legs, fail closed). Actions leg, per route in
      merge_checks.FINGERPRINT_PERSONAS: rescout.prior must return a trusted record whose head_sha is the current head
      (else nothing covers the head and nothing is marked); a head whose newest App check for the route already holds a
      RESCOUT_PREFIX line is skipped (idempotent); a mark entry is emitted when rescout.fingerprints(head inputs,
      main_root, record cites) differs from the record's map or raises Unreadable. In-session leg, per plan path whose head text
      is schema_version 6 or later (the barrier's floor; older plans are skipped): the last decision-scout gate_rounds
      row's scout_input_fingerprint against rescout.fingerprints(head inputs, merge_root, no extra cites), where
      merge_root is a temporary tree holding the four WATCHED_PATHS files as the PR's merge commit has them (main's
      checkout, with each watched file the PR's diff touches replaced by its text at pulls/{n} merge_commit_sha, read
      with the raw media type), the tree the re-scout barrier compares on, so a PR's own roadmap or north-star edit
      never reads as main moving; a wake entry when the values differ, when the plan has decision-scout rows but the
      last one carries no scout_input_fingerprint, when merge_commit_sha is null, or when the recompute raises
      Unreadable; no wake for a plan with no decision-scout row. Drill: a fixture-only diff that adds or modifies
      tests/fixtures/persona_verdict/fixture_pr/rescout_drill.txt yields one mark entry per execute.fixture_personas
      route (reason drill), subject to the same idempotence skip. moved_since(repo, token, base_sha) -> bool: the
      compare API from base_sha to main touches a WATCHED_PATHS file (any API error, or a truncated compare at
      route.COMPARE_LIMIT files or 250 commits: True). A PR whose diff holds no plan path and no drill marker costs no
      call after its compare; the sweep prints its API call count.
  - file: scripts/personas/resolve_pr.py
    action: Modify
    purpose: >-
      RESCOUT_WORKFLOW = ".github/workflows/persona-verdict-rescout.yml"; resolve() returns the unresolved shape with
      reason "sweep" and sweep: true only when workflow_run.event == 'push', workflow_run.path is RESCOUT_WORKFLOW,
      head_branch is main and head_repository is this repository; every other push origin stays unresolved as today.
      allowlisted stays false, so the fetch and materialise steps and every keyed job stay skipped.
  - file: scripts/personas/route.py
    action: Modify
    new_imports: [scripts.personas.sweep]
    purpose: >-
      main(): on a sweep resolution, imports sweep function-locally (route stays pydantic-free at module scope) and
      writes prepared/sweep.json {main_sha: $GITHUB_SHA, entries}; routes stays []; the printed line gains
      sweep=<n>. route() is unchanged.
  - file: scripts/personas/post_verdict.py
    action: Modify
    new_imports: [scripts.personas.sweep]
    purpose: >-
      plan_all: (a) on a sweep resolution, one failure body per mark entry: name persona-verdict/<route>, the entry's
      head, title MARK_TITLE, a summary naming main's moved inputs, text = render_mark as its only record line (no v1
      record, no persona-verdict-input line, so rec-5653's carry reads the head as unreadable and routes the scout);
      wake entries post no check. (b) on a pull_request-origin run, before posting a fresh or carried body on a
      FINGERPRINT_PERSONAS route that would conclude success, sweep.moved_since($GITHUB_SHA) true replaces it with
      the mark body (newer main wins, Decision 264 cl.1 reads the newest App check). Every other body is unchanged.
  - file: scripts/personas/wake.py
    action: Modify
    purpose: >-
      On a sweep resolution, _gate reads prepared/sweep.json instead of routes: one comment per entry not yet marked,
      marker <!-- persona-verdict-rescout:<head sha>:<route or in_session>:<fingerprint digest> -->, text saying main
      moved a scouted input and the scout must re-run (re-scout in session, or re-run the PR's persona-verdict-trigger
      run); idempotent per (head, route, fingerprint); a mark entry's comment is posted only when landed_names shows its check
      on that head, a wake entry's always; a sweep never posts a fault comment (it has no PR of its own; a failed post
      shows in the run log, see the ci_rca_taxonomy residual).
  - file: scripts/checks/ci_guards/_persona_verdict_rescout.py
    action: Create
    new_imports: []
    purpose: >-
      Stdlib and yaml only (no scripts.personas import, so the gated Entry's pre_globs stay as they are). WATCHED, the
      upstream's path list, equal to sweep.WATCHED_PATHS by a test that imports both. rescout_trigger_problems(doc):
      exact-shape pins -- name exactly persona-verdict-rescout (workflow_run matches upstreams by name); on (the parsed
      on/True key) exactly {push: {branches: [main], paths: WATCHED}}, so a bare string or list form and any other
      event or push sub-key (tags, tags-ignore, branches-ignore, paths-ignore) is refused; top-level and every job's
      permissions exactly {}; each job's keys within {runs-on, timeout-minutes, permissions, steps}, so job-level uses,
      container, services and environment are refused; no step with uses:; no secrets reference in any form, matched
      with validate_persona_verdict_chain.SECRETS_CTX's pattern (copied, the guard imports nothing from the chain
      module). Keyed jobs: no new check; the existing exact KEYED_CONDITION pins (_persona_verdict_keyed.py for run,
      smoke and refusal, _persona_verdict_fallback.py for run-fallback) already refuse any if: that drops or ORs the
      pull_request conjunct, and a test here asserts each pinned condition carries it as a top-level conjunct.
  - file: scripts/checks/ci_guards/validate_persona_verdict_chain.py
    action: Modify
    new_imports: [scripts.checks.ci_guards._persona_verdict_rescout]
    purpose: >-
      UPSTREAMS gains persona-verdict-rescout and VERDICT_GROUP the sweep branch, in place; the file table gains one row
      for the new upstream calling _persona_verdict_rescout (one line); measured at build start against the 500 cap.
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: >-
      plan_scout_input_fingerprint's governance note: the main-amendment and merged-plan-amendment residuals read
      narrowed (marked on Actions, advisory wake in session; a merge_gate recompute is rec-5128's), not closed; the
      Actions recompute is enforced by rec-5653's carry; one new terse amendment_log row (governance_note change) and
      Decision 282's decay applied by its tool.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      wake_signals.persona_verdict gains one sentence naming the persona-verdict-rescout marker and the push-origin
      sweep that posts it, with a new terse amendment_log entry (field_add, no contract_version change); byte relief
      first (54429 of 54542 B on main): compact the oldest prose amendment_log rows to terse rows
      (contract-population.yaml amendment_log_retention), measured at build start.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      workflows gains persona-verdict-rescout {tier: not_a_gate, ci_rca: excluded, owner: platform}: a secretless push
      trigger whose conclusion carries no meaning. The persona-verdict row's rationale is reworded in place to say a
      push-origin sweep's fault has no PR and shows only as a failed persona-verdict run on main (a named residual:
      nothing alerts on it; the next qualifying push re-sweeps).
  - file: tests/personas/test_rescout_sweep.py
    action: Create
    purpose: >-
      Hermetic tests, fake GitHub API, repository tree as main: the acceptance case (a Decision a plan cites amended on
      main marks its scout check and wakes in session), idempotence, allowlist, unknown diff, untrusted or
      off-head record, drill marker, moved_since, an unreadable listing.
  - file: tests/personas/test_resolve_pr.py
    action: Modify
    purpose: sweep resolution only for the exact push shape; other push origins stay unresolved.
  - file: tests/personas/test_route.py
    action: Modify
    purpose: main writes sweep.json on a sweep resolution and keeps routes empty.
  - file: tests/personas/test_post_verdict.py
    action: Modify
    purpose: mark bodies carry no input line; a PR-origin success on a covered route becomes a mark when main moved.
  - file: tests/personas/test_wake.py
    action: Modify
    purpose: sweep comments are idempotent per (head, route, fingerprint).
  - file: tests/checks/ci_guards/test__persona_verdict_rescout.py
    action: Create
    purpose: one red fixture per refused upstream form (name, on forms, push sub-keys, permissions, job keys, uses, each secrets form); the keyed conditions' top-level conjunct; WATCHED equals sweep.WATCHED_PATHS.
  - file: tests/checks/ci_guards/test_validate_persona_verdict_chain.py
    action: Modify
    purpose: >-
      Only where a test pins UPSTREAMS or VERDICT_GROUP literally (487 of 500 SLOC: edits in place, new cases go in
      test__persona_verdict_rescout.py).
bundled_recommendations: [rec-5654]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - bin/venv-python -m pytest tests/personas/test_rescout_sweep.py::test_main_amendment_rescouts_open_plan_prs_and_wakes_in_session -q passes (rec-5654's acceptance).
  - "No keyed job's if: admits a push origin; persona-verdict-rescout.yml holds permissions {} and no uses:, secret or Environment."
  - A mark carries no persona-verdict-input line and concludes failure; a repeated sweep adds no check and no comment.
  - A pull_request-origin covered success is posted as a mark when a watched file moved on main since its github.sha.
  - The live drill reads back a push-origin run with every keyed job skipped, a failing App mark on the fixture head, one wake comment, and a fresh canary verdict after a re-run of the trigger run.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5654's acceptance test.
    command: bin/venv-python -m pytest tests/personas/test_rescout_sweep.py::test_main_amendment_rescouts_open_plan_prs_and_wakes_in_session -q
    expected: One test passes.
    expected_literals: ["1 passed"]
    fix_if: It fails; fix sweep.py or its callers inside scope, never the assertion (Decision 235).
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-main-rescout-acceptance
  - step: 2
    phase: pre-deploy
    action: The new behaviour tests.
    command: >-
      bin/venv-python -m pytest
      tests/personas/test_rescout_sweep.py::test_a_repeated_sweep_adds_no_mark
      tests/personas/test_rescout_sweep.py::test_an_unreadable_pr_listing_raises_and_marks_nothing
      tests/personas/test_rescout_sweep.py::test_unallowlisted_or_foreign_prs_are_skipped
      tests/personas/test_rescout_sweep.py::test_unknown_diff_or_unreadable_recompute_marks
      tests/personas/test_rescout_sweep.py::test_off_head_or_untrusted_record_marks_nothing
