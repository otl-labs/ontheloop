constraints:
  - plan_fingerprint.py and rec-5653's rescout functions are consumed unchanged; nothing re-derives the projection.
  - "No keyed job (run, run-fallback, smoke, refusal) admits a push origin; their if: conditions are unchanged (Decision 263, Decision 205 cl.2)."
  - No new GitHub write scope and no new secret; checks are posted only by the existing post job's App token, comments only by wake's pull-requests write (T4.32 c4).
  - No persona-id literal in scripts/personas; the covered set is merge_checks.FINGERPRINT_PERSONAS.
  - "Fail closed (Decision 271 cl.3): an unknown diff or an unreadable recompute on a covered head marks; an API error listing PRs fails the job; nothing is left success on doubt."
  - The sweep runs no persona and spends no model tokens.
