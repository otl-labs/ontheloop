schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-main-rescout"
intent: >-
  Close T4.32 c4's main-moved leg (rec-5654) at the only place a verdict is used: the merge gate's overlap predicate
  treats the scout-input files as changed by every PR that adds or modifies a plan or approved-text sidecar, so an agent
  merge is refused while main has changed a Decision, north-star or the roadmap since the PR's merge-base, and the
  branch update the gate already asks for makes the existing re-scout barrier or rec-5653's carry recompute the
  fingerprint on current main. Nothing runs on a push to main.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-verdict-main-rescout.yaml
phase: >-
  T4.32 (persona foundation): c4's main-moved leg and rec-5103's "Decision amended on main after a PR's last CI run"
  residual; c4 stays open until the decision_scout add plan (T4.30) proves the legs on a real plan PR, so
  closes_criteria is []
cites: [dec:205, dec:229, dec:245, dec:262, dec:263, dec:264, dec:271]
amends: []
introduces: []
closes_criteria: []
scope:
  - file: scripts/session/merge_overlap.py
    action: Modify
    purpose: >-
      SCOUT_INPUTS = ("docs/DECISIONS.md", "docs/DECISIONS_ARCHIVE.md", "docs/ROADMAP-PLATFORM.yaml",
      "docs/ROADMAP-PLATFORM-ARCHIVE.yaml", "docs/contracts/north-star.yaml") and a plan-path test (docs/plans/PLAN-*.yaml
      at that depth, or docs/plans/approved/*.yaml). overlap(): when the head's diff since the merge-base holds such a
      path, one more git call, git log --format= --name-only <merge_base>..<base_ref> -- <SCOUT_INPUTS>, lists every
      scout-input file any main commit in the window touched (a change reverted inside the window still counts); those
      files join the OVERLAP set beside the existing on_base & on_head intersection. A failed call is UNAVAILABLE.
      The Verdict shape, format_line, exit codes and the CLI are unchanged; a PR with no plan path is judged exactly as
      today. The module docstring names the rule. Stays stdlib only (the gate's 40 s deadline).
  - file: tests/test_session_merge_overlap.py
    action: Modify
    purpose: >-
      Fixture-repo tests: a plan PR overlaps when main moved a scout input it never touched; a sidecar-only PR too; a
      code PR with the same main move stays clear; a main change reverted inside the window still overlaps; the branch
      updated with main is clear; a failing git log is UNAVAILABLE; SCOUT_INPUTS equals the files plan_fingerprint's
      load_tree and HASHED_BLOCK_FILES read (the archive pair included), so a new fingerprint input cannot be added
      without the gate learning it.
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: >-
      plan_scout_input_fingerprint's governance note: "a Decision amended on main after a PR's last CI run" is closed
      for agent merges in both lanes by the overlap rule (operator GitHub-UI merges stay rec-4624's residual); "an
      amendment of a merged plan whose own inputs are unchanged while a cited Decision moved" stays UNENFORCED, owned by
      rec-5671; the Actions recompute is rec-5653's carry. One terse amendment_log row; Decision 282's decay by its tool.
bundled_recommendations: [rec-5654]
followon_recs: [rec-5671]
infrastructure_dependencies: []
acceptance_criteria:
  - bin/venv-python -m pytest tests/test_session_merge_overlap.py::test_plan_pr_overlaps_when_main_moved_a_scout_input -q passes (rec-5654's acceptance).
  - A PR whose diff holds no plan or sidecar path gets exactly today's verdict; every existing overlap test passes unchanged.
  - A scout-input change on main that was reverted inside the window still refuses a plan PR.
  - SCOUT_INPUTS equals the fingerprint's file inputs, asserted by a test.
  - No workflow, persona module, keyed job or GitHub permission changes.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5654's acceptance test.
    command: bin/venv-python -m pytest tests/test_session_merge_overlap.py::test_plan_pr_overlaps_when_main_moved_a_scout_input -q
    expected: One test passes.
    expected_literals: ["1 passed"]
    fix_if: It fails; fix merge_overlap.py, never the assertion (Decision 235).
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-main-rescout-acceptance
  - step: 2
    phase: pre-deploy
    action: The new behaviour tests.
    command: >-
      bin/venv-python -m pytest
      tests/test_session_merge_overlap.py::test_sidecar_only_pr_overlaps_when_main_moved_a_scout_input
      tests/test_session_merge_overlap.py::test_code_pr_is_clear_when_main_moved_a_scout_input
      tests/test_session_merge_overlap.py::test_reverted_scout_input_change_still_overlaps
      tests/test_session_merge_overlap.py::test_plan_pr_updated_with_main_is_clear
      tests/test_session_merge_overlap.py::test_failed_scout_input_log_is_unavailable
      tests/test_session_merge_overlap.py::test_scout_inputs_equal_the_fingerprint_file_inputs -q
    expected: All selected tests pass.
    fix_if: A test fails; fix merge_overlap.py, never the assertion (Decision 235).
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-main-rescout-units
  - step: 3
    phase: pre-deploy
    action: Regression over the overlap suite and the merge gate hook's tests.
    command: bin/venv-python -m pytest tests/test_session_merge_overlap.py tests/hooks/test_merge_gate.py -q
    expected: All tests pass.
    fix_if: A pre-existing test fails; fix merge_overlap.py or STOP to the plan owner; never edit an assertion out of scope.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: duplicates the graduated shards that already run these files
  - step: 4
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: All fast-tier checks pass.
    fix_if: A check fails; fix inside scope or STOP to the plan owner; never loosen a check (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: is the fast tier itself
  - step: 5
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Full tier passes and --verify-head confirms it for the head (background, 2 h limit, HOME an empty directory).
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: is the full tier itself
  - step: 6
    phase: post-deploy
    action: rec-5654 closed by the build's squash-merge Resolves trailer once its acceptance holds.
    command: bin/venv-python -c "from src.common import ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(), ['rec-5654']); print(r[0]['id'], r[0]['status'])"
    expected: Prints rec-5654 closed.
    fix_if: Still open after the closure job ran; read ci.yml's closure job log and report to the plan owner.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/session/merge_overlap.py
    behavior: a plan PR is refused while main has moved a scout input since its merge-base
    verification_step: 1
    test_selector: tests/test_session_merge_overlap.py::test_plan_pr_overlaps_when_main_moved_a_scout_input
    red_green_expectation: red before (CLEAR, the PR never touched the file), green after
  - source: scripts/session/merge_overlap.py
    behavior: a PR with no plan path is judged as today
    verification_step: 2
    test_selector: tests/test_session_merge_overlap.py::test_code_pr_is_clear_when_main_moved_a_scout_input
    red_green_expectation: green before and after (guards against widening the rule to every PR)
  - source: scripts/session/merge_overlap.py
    behavior: a reverted main change inside the window still refuses
    verification_step: 2
    test_selector: tests/test_session_merge_overlap.py::test_reverted_scout_input_change_still_overlaps
    red_green_expectation: red before (no tree diff), green after (commit listing)
  - source: scripts/session/merge_overlap.py
    behavior: the gate's file set tracks the fingerprint's inputs
    verification_step: 2
    test_selector: tests/test_session_merge_overlap.py::test_scout_inputs_equal_the_fingerprint_file_inputs
    red_green_expectation: red before (no SCOUT_INPUTS), green after
  - source: docs/contracts/exit-criteria-ledger.yaml
    behavior: governance-note prose and one amendment_log row
    verification_step: 4
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: contract prose with no executable behaviour; the fast tier's contract validators (amendment_log shape, size caps) check it
constraints:
  - plan_fingerprint.py is not changed and not imported by merge_overlap.py (the gate stays stdlib, inside its 40 s deadline); the equality test is the coupling.
  - A PR with no plan or sidecar path in its diff gets exactly today's verdict (Decision 245 is narrowed for plan PRs only, never widened elsewhere).
  - "Fail closed (Decision 271 cl.3, Decision 245): an unreadable git state is UNAVAILABLE and refuses."
  - Nothing runs on a push to main; no workflow, persona module, keyed job or GitHub permission changes (Decision 263, T4.32 c4).
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout: PENDING (re-scope; r1-r2 scouted the superseded sweep design)."
  - "Re-scoped 2026-11-26 12:25 UTC by the operator (decision card: adopt the merge-gate rule) after critique r2's escalation and his call for a blind frame-check consult (/mnt/project-files/persona-verdict-rescout/rec-5654-advisor-brief-2/ADVICE.md). The push-to-main sweep (consult 1, rec-5654-advisor-brief/) is dropped. rec-5654's context and acceptance were updated to match (read back 12:40 UTC)."
  - "Why the gate: a verdict's only consumer today is the merge gate (Decision 264 cl.3), whose first predicate already refuses, fail closed, when main changed a file the head also changes and names the remedy (update the branch, wait for green). The branch update gives a new head: in session the re-scout barrier (scripts/checks/roadmap/_plan_rescout_barrier.py, pr-validate) recomputes on a tree holding current main and fails 're-scout required' only if the plan's inputs really moved; on Actions rec-5653's carry recomputes against main and carries or runs the scout. Build PRs that touch their merged plan pay one branch update, and the barrier's compared-plan rule skips them."
  - "Trade the operator accepted: a stale check stays green on the PR page and is refused at merge, not repainted; staleness surfaces when an agent merges, possibly after plan approval. Operator merges in the GitHub UI skip the hook (Decision 264's existing residual, rec-4624)."
  - "Residual handed off: a merged plan whose cited Decision moves before its build is not a PR-head property; rec-5671 (filed 2026-11-26, followon) owns a build-start check."
  - "Roadmap: T4.32 c4's 2026-11-26 amendment (rewritten for this design) and the PLAN-persona-verdict-rescout hint's split note land in THIS plan PR as planner roadmap bookkeeping on the operator's sign-off."
  - "red_overlap at plan write (2026-11-26 11:50 UTC): blocked rule 1 slo_breached on rec-5664, rec-5665 and rec-5666 (no shared files). Deferral rationale: this plan touches none of their files; the plan PR merges only on the operator's deferral or once they clear; the build re-runs red_overlap at dispatch."
  - "No build dependency on rec-5653: the gate rule works in session today; on Actions it relies on rec-5653's carry only once decision_scout is bound (T4.30)."
  - "Graduated shard kept unchanged: merge-overlap-verdicts (tests/test_session_merge_overlap.py); existing tests are not edited, new ones are added."
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND, scout_input_fingerprint: "v1:3581641bc78d58589209041df2686605845680b8260de9e6f1a272e4584b2d7b"}
  - {gate: decision-scout, round: 2, verdict: NO_FLAGS, scout_input_fingerprint: "v1:44f635c14970f2fabf4de9dcfaefd3230adef6e75c5347d5a4ca976fb4e22c9a"}
  - gate: plan-critique
    round: 1
    verdict: REVISE
    blocking: 3
    nits: 11
    findings:
      - {id: MRS-01, severity: blocking, origin: judgement, anchor: "scope[scripts/personas/sweep.py]", subject: "in-session recompute on pure main wakes every PR that edits a watched file itself", disposition: fixed}
      - {id: MRS-02, severity: blocking, origin: judgement, anchor: "verification_plan[6]", subject: "drill asserts exact sweep counts and a false trigger premise", disposition: fixed}
      - {id: MRS-03, severity: blocking, origin: judgement, anchor: "scope[scripts/checks/ci_guards/_persona_verdict_rescout.py]", subject: "upstream guard leaves on forms, name, job keys and secrets forms unexamined", disposition: fixed}
      - {id: MRS-04, severity: nit, origin: judgement, anchor: "scope[scripts/personas/sweep.py]", subject: "a truncated compare must read as moved", disposition: fixed}
      - {id: MRS-05, severity: nit, origin: judgement, anchor: "scope[scripts/personas/sweep.py]", subject: "skip plans below schema 6; reword the absent-row case", disposition: fixed}
      - {id: MRS-06, severity: nit, origin: judgement, anchor: "scope[config/ci_rca_taxonomy.yaml]", subject: "push-origin faults have no PR; reword the rationale and name the residual", disposition: fixed}
      - {id: MRS-07, severity: nit, origin: judgement, anchor: "scope[scripts/personas/wake.py]", subject: "sweep fault behaviour and landed gating unspecified", disposition: fixed}
      - {id: MRS-08, severity: nit, origin: judgement, anchor: "scope[scripts/personas/sweep.py]", subject: "GITHUB_TOKEN budget: count calls, short-circuit non-plan PRs", disposition: fixed}
      - {id: MRS-09, severity: nit, origin: mechanical, anchor: "execution_steps[0]", subject: "taxonomy and ledger missing from the build-start STOP list", disposition: fixed}
      - {id: MRS-10, severity: nit, origin: mechanical, anchor: "scope[docs/contracts/exit-criteria-ledger.yaml]", subject: "amendment_log row and Decision 282 decay unnamed", disposition: fixed}
      - {id: MRS-11, severity: nit, origin: mechanical, anchor: "closes_criteria", subject: "[] on in_progress T4.32, reason in phase", disposition: fixed}
      - {id: MRS-12, severity: nit, origin: judgement, anchor: "verification_plan[7]", subject: "placeholders and a refused rerun", disposition: fixed}
      - {id: MRS-13, severity: nit, origin: mechanical, anchor: "test_obligations", subject: "mark path and sweep wake behaviour lack obligations", disposition: fixed}
      - {id: MRS-14, severity: nit, origin: judgement, anchor: "scope", subject: "ports.yaml coverage of the new couplings", disposition: fixed}
