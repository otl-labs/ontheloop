    verdict: REVISE
    blocking: 2
    nits: 9
    escalated: true
    escalation_choice: re-scope
    findings:
      - {id: MRS2-01, severity: blocking, origin: judgement, anchor: "scope[scripts/personas/sweep.py]", subject: "in-session leg wakes build PRs for drift that predates the PR; no barrier compared-plan rule", disposition: fixed}
      - {id: MRS2-02, severity: blocking, origin: judgement, anchor: "scope[scripts/personas/sweep.py]", subject: "merge_commit_sha can be stale right after a main push", disposition: fixed}
      - {id: MRS2-03, severity: nit, origin: judgement, anchor: "scope[scripts/personas/wake.py]", subject: "landed gating is vacuous", disposition: fixed}
      - {id: MRS2-04, severity: nit, origin: judgement, anchor: "scope[scripts/personas/sweep.py]", subject: "roadmap archive missing from the watched inputs", disposition: fixed}
      - {id: MRS2-05, severity: nit, origin: mechanical, anchor: "scope[tests/checks/ci_guards/test_validate_persona_verdict_chain.py]", subject: "in-place count edits undercounted", disposition: fixed}
