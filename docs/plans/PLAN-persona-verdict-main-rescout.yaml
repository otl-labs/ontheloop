      - {id: MRS2-10, severity: nit, origin: mechanical, anchor: "verification_plan[6]", subject: "MCP-call commands with placeholders", disposition: fixed}
      - {id: MRS2-11, severity: nit, origin: mechanical, anchor: "test_obligations", subject: "uncommitted working-tree waiver rows", disposition: fixed}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Build start: re-measure with bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-persona-verdict-main-rescout.yaml; docs/contracts/exit-criteria-ledger.yaml past its line or byte cap after its decay is a STOP to the plan owner."
  - "scripts/session/merge_overlap.py with tests/test_session_merge_overlap.py, red first."
  - "docs/contracts/exit-criteria-ledger.yaml note and amendment_log row."
  - Execute Verification Plan -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55)
  - "Report: what was implemented, verification results"
rollback: Revert the build commit; merge_overlap returns to the shared-file rule alone.
