schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-main-rescout"
intent: >-
  Close T4.32 c4's main-moved leg (rec-5654) where a verdict is used: after the merge gate's overlap predicate clears, a
  new predicate refuses an agent merge, fail closed, when a plan the PR adds, or changes so that its scout-input
  fingerprint moves, has a different fingerprint on the PR head than on origin/main with the PR's changes. It compares
  by content through plan_fingerprint, so a main change that leaves the fingerprint equal never refuses, and the gate's
  branch-update remedy lets the re-scout barrier or rec-5653's carry ask for a re-scout. Nothing runs on a push to main.
  A new Decision records the refusal ground.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-verdict-main-rescout.yaml
phase: >-
  T4.32 (persona foundation): c4's main-moved leg and rec-5103's "Decision amended on main after a PR's last CI run"
  residual; c4 stays open until the decision_scout add plan (T4.30) proves the legs on a real plan PR, so
  closes_criteria is []
cites: [dec:83, dec:128, dec:177, dec:181, dec:203, dec:205, dec:212, dec:229, dec:235, dec:245, dec:254, dec:262, dec:263, dec:264, dec:271, dec:275, dec:276, dec:279, dec:282]
amends: [dec:83]
introduces: []
closes_criteria: []
scope:
  - file: scripts/session/merge_scout_inputs.py
    action: Create
    purpose: >-
      judge(root, head_ref, base_ref, merge_base, timeout) -> Verdict(kind CLEAR | STALE | UNAVAILABLE, plans, reason),
      called after merge_overlap returned CLEAR. TREE_FILES names the files plan_fingerprint.load_tree reads
      (docs/DECISIONS.md, docs/DECISIONS_ARCHIVE.md, docs/ROADMAP-PLATFORM.yaml, docs/ROADMAP-PLATFORM-ARCHIVE.yaml,
      docs/contracts/north-star.yaml); a test proves the list complete. CANDIDATES are exactly the re-scout barrier's
      examined set (critique r5 MRS5-09): git diff --name-status --no-renames <merge_base> <head_ref> -- docs/plans,
      read as scripts.checks._common.get_status_aware_diff reads it (no -z, tab split, the status's first letter), keeps
      the A and M lines whose path matches a local copy of scripts.checks._common.PLAN_PATH_RE, and of those the plans
      whose head version's schema_version, read as PlanDocument reads it (pydantic int coercion, so "7" is 7; a bool,
      which PlanDocument reads as 0 or 1 and the barrier then skips, is UNAVAILABLE here, failing closed), is at or
      above a local copy of _plan_rescout_barrier.FINGERPRINT_MIN_SCHEMA_VERSION; tests pin both copies equal and pin
      the selection equal to _plan_rescout_wiring's on one fixture. So a deleted plan, a type change (T) and a path git
      quotes (non-ASCII) are skipped as the barrier skips them, a change to an approved-text sidecar alone is not a
      candidate (rec-5671's residual), and an absent or non-integral schema_version on an A or M plan is UNAVAILABLE
      naming the plan. FAST PATHS, in this order, each CLEAR and each before plan_fingerprint is imported: no-plan, when
      no A or M line matches the plan-path rule; main-unchanged, when git diff --quiet <merge_base> <base_ref> --
      TREE_FILES docs/plans/ shows main changed none of them, checked before any plan content is read and exact because
      the merged tree's inputs then equal the head's (critique r5 MRS5-01: tests/hooks/test_merge_gate_persona_leg.py's
      PRs adding docs/plans/PLAN-x.yaml and PLAN-y.yaml, whose content is not a plan, clear here, since main moved only
      docs/contracts/project-configuration.yaml after their base); no-candidate, when schema filtering leaves none;
      inputs-unchanged, when git diff --quiet <merge_base> <base_ref> -- TREE_FILES plus every candidate's plan and
      sidecar path shows no change on main. MERGE: git merge-tree --write-tree --merge-base <merge_base> -z --name-only
      --no-messages <base_ref> <head_ref>, from the refs the gate fetched and the overlap verdict's merge base (never
      GitHub's test merge; it writes only unreachable objects, which git gc removes): exit 0 is clean, exit 1 lists
      conflicted paths after the tree id, and any other exit, or a git without --write-tree, is UNAVAILABLE. A
      conflicted path among TREE_FILES or a candidate's plan or sidecar is UNAVAILABLE with the rebase_resolve remedy
      (GitHub's branch update cannot resolve a conflict); conflicts elsewhere are the overlap predicate's to judge. The
      merge is computed whatever overlap decided, so Decision 254 cl.8's later narrowing of that predicate leaves this
      one exact for every file it reads. TREES: two temporary directories, the head's (git show <head_ref>:<path>) and
      the merged one (git show <tree>:<path>), each holding TREE_FILES and the candidates' plans and sidecars read from
      that same tree; a file absent from its tree stays absent. Each tree is loaded once by plan_fingerprint.load_tree;
      every value comes from plan_fingerprint.projection and fingerprint. A modified candidate is skipped when its base
      version and base sidecar (read at merge_base) give the same fingerprint on the head tree as its head version (the
      barrier's compared-plan rule, so a build PR's bookkeeping edit is never refused). STALE when a candidate's
      head-tree and merged-tree fingerprints differ, naming the plan and the payload keys that differ. Any git failure,
      missing or unparsable plan, ImportError, FingerprintError, PlanEdgesError, ApprovedTextError, OSError, YAMLError
      or ValueError, any other exception at judge()'s boundary (named in the reason), or running past timeout, is
      UNAVAILABLE, so the CLI never exits 1 on a crash. CLI (--head-ref, --base-ref, optional --merge-base, computed
      when absent) prints one line with the verdict, the path taken (no-plan, main-unchanged, no-candidate,
      inputs-unchanged or computed), the candidate count and the elapsed seconds, and exits 0 CLEAR, 1 STALE, 2
      UNAVAILABLE.
  - file: .claude/hooks/merge_gate.py
    action: Modify
    purpose: >-
      _judge: inside the CLEAR branch, after the trailer check and before the expectedHeadSha and checks legs, call
      merge_scout_inputs.judge(root, ref, "refs/remotes/origin/main", verdict.merge_base, the remaining deadline less
      a 10 s reserve for the checks leg). STALE writes a refusal naming each plan and its moved keys with the remedy
      (update the branch with mcp__github__update_pull_request_branch and `git pull --ff-only` the updated head;
      pr-validate then fails "re-scout required" on that plan: re-run the decision scout there, record its row, push,
      wait for the CI-green wake, then merge) and returns 2; UNAVAILABLE returns _deny with its reason (a conflicted scout input names the
      rebase_resolve route, as _OVERLAP_MSG does). OVERLAP and UNAVAILABLE overlap verdicts are
      judged exactly as today.
  - file: tests/test_session_merge_scout_inputs.py
    action: Create
    purpose: >-
      Fixture git repos with a minimal fingerprintable tree (the tests/test_plan_fingerprint.py helpers' shape): a plan
      PR is refused when main moved a cited Decision; clear when main moved an uncited one; a code PR is clear; a build
      PR whose plan inputs are unchanged is clear; a sidecar-only change and a plan below schema 6 are not candidates; a
      deleted plan, a type-changed plan and a quoted (non-ASCII) plan path are skipped; on one fixture holding A, M, D
      and T plans and a non-ASCII plan path, the candidates equal the selection _plan_rescout_wiring makes from
      scripts.checks._common.get_status_aware_diff on the same checkout; a non-plan file at a plan path clears on the
      main-unchanged path before any plan content is read; the branch updated with main is clear; a scout-input file
      changed on both sides without conflict is judged on the merged file; a conflicting scout-input file is UNAVAILABLE
      and a conflict elsewhere is ignored; an unparsable plan, an ImportError, a timeout, a merge-tree exit of 2 or more
      and a git without --write-tree (git run through a stub) are UNAVAILABLE; the refusal names the plan and the moved
      key; the local plan-path rule equals scripts.checks._common.PLAN_PATH_RE and the local schema floor equals
      _plan_rescout_barrier.FINGERPRINT_MIN_SCHEMA_VERSION; the CLI prints the path taken; main changing only a
      candidate's sidecar is computed and STALE; a quoted schema_version ("7") is a candidate and an absent or "x" one
      is UNAVAILABLE; an unexpected exception is UNAVAILABLE; and the set of files plan_fingerprint.load_tree(REAL_ROOT)
      opens, traced with sys.addaudithook, equals TREE_FILES, so a new load_tree input fails this test until the gate
      learns it. The audit hook is added once and records only while a module flag is set inside that test, ignoring
      opens of .py and .pyc files (the import system's); plan_fingerprint is imported at module level so --pre's
      affected-set selection follows its import chain (critique r5 MRS5-07).
  - file: tests/fixtures/merge_overlap_repos.py
    action: Modify
    purpose: >-
      install_project also copies scripts/session/merge_scout_inputs.py, so the six shim-run hook suites that build
      fixture projects with it reach the new call; each of their PRs clears on a fast path before plan_fingerprint is
      needed: a PR with no plan path at no-plan, and tests/hooks/test_merge_gate_persona_leg.py's PLAN-x.yaml and
      PLAN-y.yaml PRs at main-unchanged (critique r5 MRS5-01). That suite is unchanged and in VP3.
  - file: tests/hooks/test_merge_gate.py
    action: Modify
    purpose: >-
      In-process _judge with merge_scout_inputs.judge monkeypatched (the tests/hooks/test_merge_gate_deadline.py
      import pattern, since a shim-run fixture project lacks the plan_fingerprint closure): refuses with exit 2 and
      the plan named when the predicate returns STALE after a CLEAR overlap; denies on UNAVAILABLE; never calls the
      predicate when overlap is OVERLAP.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      The new Decision (number at build) and a dated Update note on Decision 245, word for word from the approved-text
      sidecar docs/plans/approved/persona-verdict-main-rescout.yaml.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      push_pr_ci_merge_flow: the overlap refusal's "when main changed a file the PR also changes since its base" gains
      ", or (Decision <N>) a plan whose scout inputs main moved" (the remedy that follows stands; Decision <N> cl.1 says
      the barrier then asks for a re-scout); "(Decision 264; skipped, pending, missing or unreadable refuses)" becomes
      "(Decision 264 cl.1, cl.3)". merge_step_coverage: the runs list gains "for scout inputs (Decision <N>)
      scripts/session/merge_scout_inputs.py"; the residual owners' "GitHub-UI merges and different-file conflicts
      (rec-4874, rec-4451), the updated head carrying only --pre evidence (rec-4085), a push after auto-merge is enabled
      on a green head, which no persona check covers until the persona checks are required (rec-4624)," becomes "those
      of Decision 245 cl.4 and cl.6, Decision 264 cl.6 and Decision <N> cl.5," and "the check reads following a
      session-redirected origin as the fetch does (rec-4085), agent merges by gh or REST from a shell or naming the
      repository's former owner/name (rec-2827)," becomes "agent merges naming the repository's former owner/name
      (rec-2827),". Each cut item is in a cited clause (245 cl.4 the --pre evidence; 245 cl.6 the UI merges,
      different-file conflicts and gh or REST merges; 264 cl.6 the auto-merge push and the re-pointed origin); the
      git-ops-only residuals stay (the former owner/name, the gate judged by its own copy, the checkout predating the
      gate, the foreign session or surface). referenced_repo_paths gains the module; contract_version 18 -> 19; one
      amendment_log row, semantic_break true as Decision 245's and 264's rows were, summary
      "PLAN-persona-verdict-main-rescout (Decision <N>). contract_version 18 -> 19." (161 B). MEASURED (critique r5
      MRS5-02) on main ec28df09 by applying exactly these edits with N=287 (python, UTF-8 length): 54429 B before, 54427
      B after, 115 B under the 54542 B cap; longest line 1592 chars. The build re-measures; a shortfall is a STOP to the
      plan owner, never a raise or a cut residual. approved_text_binding is not touched.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      SA-04's "for its required-checks leg (Decision 264) it also assumes GitHub's public REST endpoints at
      https://api.github.com for rules/branches/main and commits/<sha>/check-runs, read with no credential, a
      required_status_checks rule naming check contexts, check runs created by the app github-actions, and, for a
      file:// origin, JSON fixtures inside that bare repository in place of the API;" becomes "its required-checks leg
      (Decision 264) assumes GitHub's public check reads (full list: docs/plans/PLAN-merge-requires-green-checks.yaml);
      its scout-input predicate (Decision <N>) assumes docs/plans/PLAN-<slug>.yaml at schema 6+,
      docs/plans/approved/<slug>.yaml and merge_scout_inputs.TREE_FILES;". The citation is the "(full list: <plan>)"
      form SA-11, SA-13 and SA-14 use: that plan's merge_checks.py scope rows name every endpoint, the github-actions
      app, the credential-free read and the file:// fixture seam, so no coupling goes unrecorded (Decision 212 cl.3).
      One terse amendment_log row, semantic_break false, summary "PLAN-persona-verdict-main-rescout: SA-04 scout
      inputs." (140 B). MEASURED (critique r5 MRS5-03, replacing the mis-measured SA-10 relief) on main ec28df09 with
      N=287: 50167 B before, 50219 B after, 32 B under the 50251 B cap. The build re-measures; a shortfall is a STOP to
      the plan owner, never a raise.
  - file: docs/contracts/exit-criteria-ledger.yaml
