schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-main-rescout"
intent: >-
  Close T4.32 c4's main-moved leg (rec-5654) where a verdict is used: after the merge gate's overlap predicate clears, a
  new predicate refuses an agent merge, fail closed, when a plan the PR adds, or changes so that its scout-input
  fingerprint moves, has a different fingerprint on the PR head than on origin/main with the PR's changes. It compares
  by content through plan_fingerprint, so a main change that leaves the fingerprint equal never refuses, and the gate's
  branch-update remedy lets the re-scout barrier or rec-5653's carry ask for a re-scout. Nothing runs on a push to main.
  A new Decision records the refusal ground.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-verdict-main-rescout.yaml
phase: >-
  T4.32 (persona foundation): c4's main-moved leg and rec-5103's "Decision amended on main after a PR's last CI run"
  residual; c4 stays open until the decision_scout add plan (T4.30) proves the legs on a real plan PR, so
  closes_criteria is []
cites: [dec:83, dec:181, dec:203, dec:205, dec:229, dec:245, dec:254, dec:262, dec:263, dec:264, dec:271]
amends: [dec:83]
introduces: []
closes_criteria: []
scope:
  - file: scripts/session/merge_scout_inputs.py
    action: Create
    purpose: >-
      judge(root, head_ref, base_ref, merge_base, timeout) -> Verdict(kind CLEAR | STALE | UNAVAILABLE, plans, reason),
      called only after merge_overlap returned CLEAR. TREE_FILES names the files plan_fingerprint.load_tree reads
      (docs/DECISIONS.md, docs/DECISIONS_ARCHIVE.md, docs/ROADMAP-PLATFORM.yaml, docs/ROADMAP-PLATFORM-ARCHIVE.yaml,
      docs/contracts/north-star.yaml); a test proves the list complete, and nothing else is derived from it. Candidates: from git diff --no-renames --name-status
      <merge_base> <head_ref> -- docs/plans, each docs/plans/PLAN-*.yaml (depth 2) the head adds or modifies, and each
      plan whose docs/plans/approved/<slug>.yaml sidecar the head adds, modifies or deletes; deleted plans are skipped;
      none is CLEAR. git diff --quiet <merge_base> <base_ref> -- TREE_FILES: no change on main is
      CLEAR without computing. Otherwise it writes two trees of TREE_FILES into a temporary directory, the head's
      (git show <head_ref>:<path>) and the composite (the head's version of each file the head changed since the merge
      base, else the base_ref's; overlap's CLEAR means no file changed on both sides, so this equals the merged files,
      with no merge commit); a file absent at its ref stays absent. Each tree is loaded once by plan_fingerprint.load_tree
      and every value comes from plan_fingerprint.projection and fingerprint with the plan and sidecar text read at
      head_ref. A modified plan is skipped when its base version and base sidecar (read at merge_base) give the same
      fingerprint on the head tree as its head version (the re-scout barrier's compared-plan rule, so a build PR's
      bookkeeping edit is never refused). STALE when a candidate's head-tree and composite-tree fingerprints differ,
      naming the plan and the payload keys whose values differ. Any git failure, missing or unparsable plan,
      FingerprintError, PlanEdgesError, ApprovedTextError, OSError, YAMLError or ValueError, and running past timeout, is
      UNAVAILABLE. plan_fingerprint is imported inside judge, so importing the module never raises. A CLI
      (--head-ref, --base-ref; merge base computed) prints one verdict line with the elapsed seconds and exits 0 CLEAR,
      1 STALE, 2 UNAVAILABLE, as merge_overlap's does.
  - file: .claude/hooks/merge_gate.py
    action: Modify
    purpose: >-
      _judge: inside the CLEAR branch, after the trailer check and before the expectedHeadSha and checks legs, call
      merge_scout_inputs.judge(root, ref, "refs/remotes/origin/main", verdict.merge_base, remaining deadline). STALE
      writes a refusal naming each plan and its moved keys with the remedy (update the branch with
      mcp__github__update_pull_request_branch, wait for the CI-green wake; the re-scout barrier then asks for a
      re-scout) and returns 2; UNAVAILABLE returns _deny with its reason. OVERLAP and UNAVAILABLE overlap verdicts are
      judged exactly as today.
  - file: tests/test_session_merge_scout_inputs.py
    action: Create
    purpose: >-
      Fixture git repos with a minimal fingerprintable tree (the tests/test_plan_fingerprint.py helpers' shape): a plan
      PR is refused when main moved a cited Decision; clear when main moved an uncited one; a code PR is clear; a build
      PR whose plan inputs are unchanged is clear; a sidecar-only PR is refused when main moved a cited Decision; the
      branch updated with main is clear; an unparsable plan is UNAVAILABLE; a timeout is UNAVAILABLE; the refusal names
      the plan and the moved key; and TREE_FILES copied alone from the repository's own tree give the same fingerprint
      for a synthetic plan citing real Decisions as the full tree does, so a new load_tree input fails this test until
      the gate learns it.
  - file: tests/hooks/test_merge_gate.py
    action: Modify
    purpose: >-
      _judge refuses with exit 2 and the plan named when the predicate returns STALE after a CLEAR overlap; denies on
      UNAVAILABLE; never calls the predicate when overlap is OVERLAP.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      The new Decision (number at build) and a dated Update note on Decision 245, word for word from the approved-text
      sidecar docs/plans/approved/persona-verdict-main-rescout.yaml.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      push_pr_ci_merge_flow: one sentence after the overlap refusal naming the scout-input refusal, its Decision and the
      same remedy; merge_step_coverage's runs list names scripts/session/merge_scout_inputs.py and the residual owners
      (rec-4624, rec-5671, rec-5673); referenced_repo_paths gains the module; contract_version bump and one terse
      amendment_log row with Decision 282's decay. Byte relief inside git-ops.yaml by its compaction tool or by turning
      restated detail into citations, never a budget raise; approved_text_binding is not touched.
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: >-
      plan_scout_input_fingerprint's governance note: "a Decision amended on main after a PR's last CI run" leaves the
      UNENFORCED list (refused at agent merges by the merge gate's scout-input predicate; GitHub UI merges stay
      rec-4624's residual); "an amendment of a merged plan whose own inputs are unchanged while a cited Decision moved"
      moves to rec-5671; approved but unbuilt edits to a cited Decision join it, owned by rec-5673. One terse
      amendment_log row with Decision 282's decay.
bundled_recommendations: [rec-5654]
followon_recs: [rec-5671, rec-5673]
infrastructure_dependencies: []
acceptance_criteria:
  - bin/venv-python -m pytest tests/test_session_merge_scout_inputs.py::test_plan_pr_is_refused_when_main_moved_a_cited_decision -q passes (rec-5654's acceptance).
  - A main change that leaves a plan's fingerprint equal never refuses, asserted by a test.
  - A PR with no plan or sidecar in its diff, and a build PR whose plan inputs are unchanged, get exactly today's verdict.
  - Every failure to compute refuses (UNAVAILABLE), asserted by tests.
  - merge_overlap.py, every workflow, persona module, keyed job and GitHub permission are unchanged.
  - The new Decision and the Decision 245 note land word for word (approved_text verify).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5654's acceptance test.
    command: bin/venv-python -m pytest tests/test_session_merge_scout_inputs.py::test_plan_pr_is_refused_when_main_moved_a_cited_decision -q
    expected: One test passes.
    expected_literals: ["1 passed"]
    fix_if: It fails; fix merge_scout_inputs.py, never the assertion (Decision 235).
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-main-rescout-acceptance
  - step: 2
    phase: pre-deploy
    action: The new behaviour tests.
    command: >-
      bin/venv-python -m pytest
      tests/test_session_merge_scout_inputs.py::test_plan_pr_is_clear_when_main_moved_an_uncited_decision
      tests/test_session_merge_scout_inputs.py::test_code_pr_is_clear_when_main_moved_a_cited_decision
      tests/test_session_merge_scout_inputs.py::test_build_pr_with_unchanged_plan_inputs_is_clear
      tests/test_session_merge_scout_inputs.py::test_sidecar_only_pr_is_refused_when_main_moved_a_cited_decision
      tests/test_session_merge_scout_inputs.py::test_branch_updated_with_main_is_clear
      tests/test_session_merge_scout_inputs.py::test_unparsable_plan_is_unavailable
      tests/test_session_merge_scout_inputs.py::test_timeout_is_unavailable
      tests/test_session_merge_scout_inputs.py::test_refusal_names_the_plan_and_the_moved_key
      tests/test_session_merge_scout_inputs.py::test_tree_files_suffice_for_the_fingerprint
      tests/hooks/test_merge_gate.py::test_judge_refuses_a_stale_plan_after_a_clear_overlap
      tests/hooks/test_merge_gate.py::test_judge_denies_when_scout_inputs_are_unavailable
      tests/hooks/test_merge_gate.py::test_judge_skips_scout_inputs_on_overlap -q
    expected: All selected tests pass.
    fix_if: A test fails; fix the module under test, never the assertion (Decision 235).
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-main-rescout-units
  - step: 3
    phase: pre-deploy
    action: Regression over the gate, overlap, fingerprint and barrier suites.
    command: >-
      bin/venv-python -m pytest tests/test_session_merge_scout_inputs.py tests/test_plan_fingerprint.py
      tests/hooks/test_merge_gate.py tests/test_session_merge_overlap.py tests/checks/roadmap/test__plan_rescout_barrier.py -q
    expected: All tests pass.
    fix_if: A pre-existing test fails; fix in scope or STOP to the plan owner; never edit an assertion out of scope.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: duplicates the graduated shards that already run these files
  - step: 4
    phase: pre-deploy
    action: The approved wording landed word for word.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-main-rescout
    expected: Exits 0 with every bound file matching the sidecar.
    fix_if: A mismatch; make docs/DECISIONS.md match the sidecar word for word, never edit the sidecar (Decision 279).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: the fast tier's approved_text_binding check runs the same verification on the PR
  - step: 5
    phase: pre-deploy
    action: Wall time on the real tree, against the gate's 40 s deadline.
    command: bin/venv-python -m scripts.session.merge_scout_inputs --head-ref HEAD --base-ref origin/main
    expected: One verdict line whose elapsed value is under 10 seconds.
    fix_if: Over 10 s; cache the loaded trees or STOP to the plan owner; never raise the gate's deadline here.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: a timing observation on the live tree, not a behaviour a shard can pin
  - step: 6
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: All fast-tier checks pass.
    fix_if: A check fails; fix inside scope or STOP to the plan owner; never loosen a check (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: is the fast tier itself
  - step: 7
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Full tier passes and --verify-head confirms it for the head (background, 2 h limit, HOME an empty directory).
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: is the full tier itself
  - step: 8
    phase: post-deploy
    action: rec-5654 closed by the build's squash-merge Resolves trailer once its acceptance holds.
    command: bin/venv-python -c "from src.common import ducklake_reader_client as c; r,_=c.fetch_recs_by_ids(c.make_reader(), ['rec-5654']); print(r[0]['id'], r[0]['status'])"
    expected: Prints rec-5654 closed.
    fix_if: Still open after the closure job ran; read ci.yml's closure job log and report to the plan owner.
    hermetic: false
    graduation: not-applicable
