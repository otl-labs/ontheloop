pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Build start: re-measure with bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-persona-verdict-main-rescout.yaml and the contract byte caps; git-ops.yaml or exit-criteria-ledger.yaml still past a cap after decay and relief is a STOP to the plan owner. Re-read the next free Decision number on main."
  - "scripts/session/merge_scout_inputs.py with tests/test_session_merge_scout_inputs.py, red first."
  - "tests/fixtures/merge_overlap_repos.py install_project copies the new module; the six fixture-project suites stay green."
  - "docs/contracts/ports.yaml SA-04 clause and docs/contracts/git-ops.yaml with the named relief; re-measure both byte caps first."
  - ".claude/hooks/merge_gate.py with its hook tests, red first."
  - "docs/DECISIONS.md from the sidecar word for word ({{N}} and {{DATE}} filled); then git-ops.yaml and exit-criteria-ledger.yaml naming that number."
  - Execute Verification Plan -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55)
  - "Report: what was implemented, verification results"
rollback: Revert the build commit; the merge gate returns to the overlap and checks legs alone, and the Decision is superseded by a dated note.
