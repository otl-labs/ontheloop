schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-main-rescout"
intent: >-
  Close T4.32 c4's main-moved leg (rec-5654) where a verdict is used: after the merge gate's overlap predicate clears, a
  new predicate refuses an agent merge, fail closed, when a plan the PR adds, or changes so that its scout-input
  fingerprint moves, has a different fingerprint on the PR head than on origin/main with the PR's changes. It compares
  by content through plan_fingerprint, so a main change that leaves the fingerprint equal never refuses, and the gate's
  branch-update remedy lets the re-scout barrier or rec-5653's carry ask for a re-scout. Nothing runs on a push to main.
  A new Decision records the refusal ground.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-verdict-main-rescout.yaml
phase: >-
  T4.32 (persona foundation): c4's main-moved leg and rec-5103's "Decision amended on main after a PR's last CI run"
  residual; c4 stays open until the decision_scout add plan (T4.30) proves the legs on a real plan PR, so
  closes_criteria is []
cites: [dec:83, dec:128, dec:177, dec:181, dec:203, dec:205, dec:212, dec:229, dec:235, dec:245, dec:254, dec:262, dec:263, dec:264, dec:271, dec:275, dec:276, dec:279, dec:282]
amends: [dec:83]
introduces: []
closes_criteria: []
scope:
  - file: scripts/session/merge_scout_inputs.py
    action: Create
    purpose: >-
      judge(root, head_ref, base_ref, merge_base, timeout) -> Verdict(kind CLEAR | STALE | UNAVAILABLE, plans, reason),
      called after merge_overlap returned CLEAR. TREE_FILES names the files plan_fingerprint.load_tree reads
      (docs/DECISIONS.md, docs/DECISIONS_ARCHIVE.md, docs/ROADMAP-PLATFORM.yaml, docs/ROADMAP-PLATFORM-ARCHIVE.yaml,
      docs/contracts/north-star.yaml); a test proves the list complete. CANDIDATES follow the re-scout barrier's
      examined set: from git diff -z --no-renames --name-status <merge_base> <head_ref> -- docs/plans, each path matching a
      local copy of scripts.checks._common.PLAN_PATH_RE (a test pins the two equal) with status A, M or T (T read as
      M) whose head version's schema_version, read as PlanDocument reads it (pydantic int coercion, so "7" is 7; bool
      rejected), is at or above _plan_rescout_barrier.FINGERPRINT_MIN_SCHEMA_VERSION, and an absent or non-integral
      schema_version is UNAVAILABLE naming the plan. Two forms go beyond the barrier, which reads A and M without -z:
      a T entry and a quoted (non-ASCII) path are candidates here, so such a plan meets one refusal whose branch
      update then clears without a re-scout, accepted friction on rare forms; D is
      skipped (a retired plan, with or without its sidecar); any other status on such a path is UNAVAILABLE; a change
      to an approved-text sidecar alone is not a candidate, as the barrier does not examine it (rec-5671's residual).
      FAST PATHS: no candidate is CLEAR; git diff --quiet <merge_base> <base_ref> -- TREE_FILES plus every candidate's
      plan and sidecar path, with no change on main, is CLEAR (every file the fingerprint reads is in the pathspec). Both run before plan_fingerprint or the barrier module is imported, so a fixture project without that
      closure still clears. MERGE: git merge-tree --write-tree -z --name-only --no-messages <base_ref> <head_ref>,
      computed locally from the fetched refs (never GitHub's test merge): exit 0 is clean, exit 1 lists conflicted
      paths after the tree id, and any other exit, or a git without --write-tree, is UNAVAILABLE. A conflicted path
      among TREE_FILES or a candidate's plan or sidecar is UNAVAILABLE with the rebase_resolve remedy (GitHub's branch
      update cannot resolve a conflict); conflicts elsewhere are the overlap predicate's to judge. The merge is computed
      whatever overlap decided, so Decision 254 cl.8's later narrowing of that predicate leaves this one exact for
      every file it reads. TREES: two temporary directories, the head's (git show <head_ref>:<path>) and the merged
      one (git show <tree>:<path>), each holding TREE_FILES and the candidates' plans and sidecars read from that same
      tree; a file absent from its tree stays absent. Each tree is loaded once by plan_fingerprint.load_tree; every
      value comes from plan_fingerprint.projection and fingerprint. A modified candidate is skipped when its base
      version and base sidecar (read at merge_base) give the same fingerprint on the head tree as its head version
      (the barrier's compared-plan rule, so a build PR's bookkeeping edit is never refused). STALE when a candidate's
      head-tree and merged-tree fingerprints differ, naming the plan and the payload keys that differ. Any git failure,
      missing or unparsable plan, ImportError, FingerprintError, PlanEdgesError, ApprovedTextError, OSError, YAMLError
      or ValueError, any other exception at judge()'s boundary (named in the reason), or running past timeout, is
      UNAVAILABLE, so the CLI never exits 1 on a crash. CLI (--head-ref, --base-ref, optional --merge-base,
      computed when absent) prints one line with the verdict, the path taken (no-candidate, main-unchanged or
      computed), the candidate count and the elapsed seconds, and exits 0 CLEAR, 1 STALE, 2 UNAVAILABLE.
  - file: .claude/hooks/merge_gate.py
    action: Modify
    purpose: >-
      _judge: inside the CLEAR branch, after the trailer check and before the expectedHeadSha and checks legs, call
      merge_scout_inputs.judge(root, ref, "refs/remotes/origin/main", verdict.merge_base, the remaining deadline less
      a 10 s reserve for the checks leg). STALE writes a refusal naming each plan and its moved keys with the remedy
      (update the branch with mcp__github__update_pull_request_branch; pr-validate then fails "re-scout required" on
      that plan: re-run the decision scout, record its row, push, wait for the CI-green wake, then merge) and returns 2; UNAVAILABLE returns _deny with its reason (a conflicted scout input names the
      rebase_resolve route, as _OVERLAP_MSG does). OVERLAP and UNAVAILABLE overlap verdicts are
      judged exactly as today.
  - file: tests/test_session_merge_scout_inputs.py
    action: Create
    purpose: >-
      Fixture git repos with a minimal fingerprintable tree (the tests/test_plan_fingerprint.py helpers' shape): a plan
      PR is refused when main moved a cited Decision; clear when main moved an uncited one; a code PR is clear; a build
      PR whose plan inputs are unchanged is clear; a sidecar-only change and a plan below schema 6 are not candidates;
      a deleted plan is skipped; a type-changed plan is judged as modified; a non-ASCII plan path is a candidate; an
      unrecognised status on a plan path is UNAVAILABLE; the branch updated with main is clear; a scout-input file
      changed on both sides without conflict is judged on the merged file; a conflicting scout-input file is
      UNAVAILABLE and a conflict elsewhere is ignored; an unparsable plan, an ImportError and a timeout are
      UNAVAILABLE; the refusal names the plan and the moved key; the local plan-path rule equals
      scripts.checks._common.PLAN_PATH_RE; the CLI prints the path taken; main changing only a candidate's sidecar is
      computed and STALE; a quoted schema_version ("7") is a candidate and an absent or "x" one is UNAVAILABLE; an
      unexpected exception is UNAVAILABLE; and the set of files plan_fingerprint.load_tree(REAL_ROOT) opens, traced
      with sys.addaudithook, equals TREE_FILES, so a new load_tree input fails this test until the gate learns it.
  - file: tests/fixtures/merge_overlap_repos.py
    action: Modify
    purpose: >-
      install_project also copies scripts/session/merge_scout_inputs.py, so the six shim-run hook suites that build
      fixture projects with it reach the new call and clear on its no-candidate path.
  - file: tests/hooks/test_merge_gate.py
    action: Modify
    purpose: >-
      In-process _judge with merge_scout_inputs.judge monkeypatched (the tests/hooks/test_merge_gate_deadline.py
      import pattern, since a shim-run fixture project lacks the plan_fingerprint closure): refuses with exit 2 and
      the plan named when the predicate returns STALE after a CLEAR overlap; denies on UNAVAILABLE; never calls the
      predicate when overlap is OVERLAP.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      The new Decision (number at build) and a dated Update note on Decision 245, word for word from the approved-text
      sidecar docs/plans/approved/persona-verdict-main-rescout.yaml.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      push_pr_ci_merge_flow: the overlap refusal's sentence gains ", or (Decision <N>) a plan whose scout-input
      fingerprint differs on main merged with the PR" and, after its remedy, "; for that plan pr-validate then asks for
      a re-scout"; merge_step_coverage's runs list gains "for scout inputs (Decision <N>),
      scripts/session/merge_scout_inputs.py"; referenced_repo_paths gains the module; contract_version bump; one terse
      amendment_log row (the compaction tool selects no row, so Decision 275 cl.4's hold binds). BYTE RELIEF, keeping
      every residual held only here (the three rec-4085 items, the session-redirected origin and rec-2827's former
      owner/name): merge_step_coverage's "GitHub-UI merges and different-file conflicts (rec-4874, rec-4451), the
      updated head carrying only --pre evidence (rec-4085), a push after auto-merge is enabled on a green head, which
      no persona check covers until the persona checks are required (rec-4624)," restates Decision 245 cl.2 and cl.4
      and Decision 264 cl.6 and becomes "those of Decision 245 cl.2 and cl.4, Decision 264 cl.6 and Decision <N>
      cl.5," (about 157 B freed); push_pr_ci_merge_flow's "(Decision 264; skipped, pending, missing or unreadable
      refuses)" becomes "(Decision 264 cl.1)" (44 B). Arithmetic at plan write (main a77e7b26, wc -c): 113 B headroom
      plus about 201 B freed against about 330 B added; the build re-measures, and a shortfall is a STOP to the plan
      owner, never a raise or a cut residual. approved_text_binding is not touched.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      SA-04 gains one clause: the scout-input predicate assumes plans at docs/plans/PLAN-<slug>.yaml read at
      schema_version 6 or above, sidecars at docs/plans/approved/<slug>.yaml and the five TREE_FILES, and refuses
      where DECISIONS.md or the roadmap is absent (Decision 212 cl.3, Decision 211's Coverage); one terse
      amendment_log row. ports.yaml has 84 B headroom (50167 of 50251) and the compaction tool selects no row, so the
      build frees bytes by citing rather than restating inside SA-04 itself or SA-10 (4,277 B, which restates the
      attribution leg's Decision text); a shortfall is a STOP to the plan owner, never a raise.
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: >-
      plan_scout_input_fingerprint's governance note: "a Decision amended on main after a PR's last CI run" leaves the
      UNENFORCED list (refused at agent merges by the merge gate's scout-input predicate; GitHub UI merges stay
      rec-4624's residual); "an amendment of a merged plan whose own inputs are unchanged while a cited Decision moved"
      moves to rec-5671; approved but unbuilt edits to a cited Decision join it, owned by rec-5673. One terse
      amendment_log row (the compaction tool selects no row today, so Decision 275 cl.4's hold binds).
