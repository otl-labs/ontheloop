pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Pre: PLAN-persona-verdict-chain's build is merged (scripts/personas/ and both persona-verdict*.yml exist on main); no open PR edits persona-verdict*.yml or scripts/personas/ (mcp__github__list_pull_requests); re-run plan_obligations and red_overlap on this plan."
  - "Create scripts/personas/override.py and tests/personas/test_override.py; post: VP 1 green."
  - "Modify run.py, resolve_pr.py, route.py, post_verdict.py, the probe, its schema and the two new marker files, with the additive mirror-test cases; post: VP 2 green."
  - "Create persona-verdict-override.yml and modify persona-verdict.yml; modify validate_persona_verdict_chain and its test, validate_environment_reviewer_preflight and its test; post: VP 3 green."
  - "Modify validate_persona_trigger_policy and its test; post: VP 4 green. Record the loosening as weakening_disposition planned-change citing AC5."
  - "Append the two terraform/github resources and the two EXEMPT rows; post: VP 6 and VP 3 green."
  - "Add the five composite_action_body_baseline entries and the ci_rca_taxonomy row (measure the cap first, relieve by compaction) and place the two sidecar blocks with {{DATE}} set to the build date; post: VP 5 green."
  - "Execute VP 7 before the PR is ready; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)."
  - "After merge: VP 8 (admin step: the operator's words naming the terraform-github-apply approval), then VP 9 (the operator approves one fixture override run); report run ids and conclusions to the coordinator."
  - "Report: what was implemented, verification results"
rollback: >-
  Revert the build PR: persona-verdict.yml returns to one upstream and the override workflow disappears, so no override
  can run; a check run already posted stays as GitHub history. The Environment stays (prevent_destroy); removing it is a
  separate gated terraform-github-apply dispatch the operator approves. The roadmap blocks revert with the PR.
