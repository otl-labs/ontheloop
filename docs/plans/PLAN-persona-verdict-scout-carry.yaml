schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-scout-carry"
intent: >-
  Bind a decision-scout verdict to the scout-input fingerprint it judged (T4.32 c4 legs 1-2, rec-5653): on every
  plan-PR push the verdict chain's prepare job computes each changed plan's fingerprint with plan_fingerprint
  unchanged; an equal value on the last verdict-App scout check posts a carried check on the new head with no persona
  run, and a moved, missing, untrusted or unreadable value routes the scout, so usage falls without a verdict ever
  covering inputs it did not judge.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-persona-verdict-scout-carry.yaml
phase: >-
  T4.32 (persona foundation): c4 legs 1-2 (carry on an equal fingerprint, re-run the scout on a moved one); c4 stays
  open (leg 3 is rec-5654, the live proof is T4.30's), so closes_criteria is [] because c4 cannot be met here
cites: [dec:205, dec:229, dec:262, dec:264, dec:271]
amends: []
introduces: []
closes_criteria: []
scope:
  - file: scripts/personas/rescout.py
    action: Create
    new_imports: [scripts.personas.override, scripts.personas.resolve_pr, scripts.personas.route, scripts.roadmap.plan_fingerprint, scripts.roadmap.approved_words, scripts.session.merge_checks]
    purpose: >-
      The fingerprint carry, no persona-id literal. INPUT_PREFIX "<!-- persona-verdict-input v1 " with render_input /
      parse_input: one line, compact sorted JSON, keys exactly {route, head_sha, verdict, cites, fingerprints, run_id,
      carried_from}; cites a sorted list of dec:N tokens; fingerprints {plan path: "v<N>:<hex>"}; carried_from a 40-hex
      SHA or null; parse_input finds exactly one such line anywhere in a check's output text, else None.
      head_inputs(repo, token, head_sha, plan_paths): each plan's text and approved-text sidecar
      (path approved_words.sidecar_rel(slug)) at the head through the contents API with a status-aware fetch -- 404
      means no sidecar, any other non-200 or undecodable body raises Unreadable; the plan text is parsed with
      route.parse_plan (512 KiB cap, alias refusal), None raising Unreadable, and a slug that is not a string matching
      [A-Za-z0-9._-]+ raises Unreadable before any sidecar fetch. fingerprints(inputs, main_root, cites): {path:
      plan_fingerprint.fingerprint(projection(plan, load_tree(main_root), parse_sidecar(sidecar) or None, cites))};
      any FingerprintError, PlanEdgesError, ApprovedTextError or yaml error raises Unreadable. prior(repo, token, number,
      route): the PR's commits (pulls/{n}/commits, every page, at most 3), newest first, at most SCAN_COMMITS = 20; on
      the first commit holding a check run named persona-verdict/<route> whose app.id equals override.app_id(), the
      newest such run's output.text; returns (input record, v1 record or None, finding titles) or a reason: missing
      (no such run within the scan), untrusted (record route or head_sha differs from the run's), unreadable (an API
      error, no or bad input line, a verdict that is not an upper-case token, or override.app_id() refusing; rescout
      never imports post_verdict, whose jsonschema prepare does not install, and post maps an unknown verdict to failure
      as judge does). decide(...): for each route in routes that is in merge_checks.FINGERPRINT_PERSONAS, when the resolution is
      allowlisted (Decision 205 cl.2), the diff is known, plan_paths is non-empty, the prior record is trusted and fingerprints(head inputs, main, record cites) equals
      the record's fingerprints map exactly, the route moves from routes to carried {route, verdict, blocking_ids,
      titles, cites, fingerprints, from_head, from_check_run_id}; else it stays in routes with reason moved (record
      readable, maps differ), missing, untrusted, unreadable or not_allowlisted. rescout_required(routes_doc) -> bool: True when
      routes_doc's rescout map is non-empty (the state the plan_critic add plan, T4.29, reads).
  - file: scripts/personas/route.py
    action: Modify
    new_imports: [scripts.personas.rescout]
    purpose: >-
      main(), after route(): calls rescout.decide (a module-scope import, while rescout reaches route only as
      `from scripts.personas import route` and reads route.parse_plan at call time, so the cycle imports in either order; Amendment 1: route and materialise run only in
      prepare, which installs pydantic, and wake no longer imports route) over the resolved PR (number, head, routes, plan paths, unknown flag,
      $GITHUB_WORKSPACE/main as the main tree), writes routes.json with the two new keys carried (list) and rescout
      ({route: reason}), and prepared/plan_inputs.json ({path: {plan, sidecar}}) whenever a covered route stays in
      routes, so post can compute the fresh record; "routes" stays the routes to run, so materialise.py and
      keyed_run.py are untouched. The printed line gains carried=<n>. route() itself is unchanged.
  - file: scripts/personas/post_verdict.py
    action: Modify
    new_imports: [scripts.personas.rescout]
    purpose: >-
      plan_all: (a) one body per carried entry on the resolved head (an unallowlisted resolution posts judge's allowlist
      failure instead, as for a fresh route): conclusion success for a SUCCESS_VERDICTS verdict and
      failure for FAILURE_VERDICTS (Decision 262: a carried BLOCK stays a failure), title "verdict <V> (carried from
      <short sha>)"; text = override.render_record(route, new head, verdict, blocking_ids, this GITHUB_RUN_ID) and the
      finding lines when blocking_ids is non-empty, with rescout.render_input inserted as the text's second line (its first when
      there is no v1 record): head_sha the new head, run_id this GITHUB_RUN_ID, verdict, cites and fingerprints copied
      from the carried entry, carried_from the prior record's head; a failure is then looked up with override.lookup for the NEW head only, exactly as a fresh failure,
      so no override crosses heads. (b) a fresh result on a covered route whose output is schema-valid with outcome
      success gets rescout.render_input as the text's second line (its first when there is no v1 record), so the
      TEXT_LIMIT cut never drops it; fingerprints computed from
      prepared/plan_inputs.json and the checked-out main with the output's cite[].decision ids as dec:N tokens; no
      input line when the output fails, the inputs file is absent or rescout raises Unreadable (the check still posts).
      (c) _override_form and plan_override keep the source text's input line, as the line after the v1 record and before
      the override marker. The v1 record stays the text's first line whenever it is written.
  - file: scripts/personas/wake.py
    action: Modify
    purpose: >-
      _gate and wake read the route ids to mark as routes plus each carried entry's route, so a run whose only checks
      are carried still wakes the watching session; no_routes only when both are empty. Amendment 1: wake.py no longer
      imports scripts.personas.route; it holds its own ROUTES = Path("prepared") / "routes.json", so its import closure
      stays {yaml} under test_run.py's AST walker (which counts function-local imports) and the pyyaml-only wake job.
  - file: scripts/session/merge_checks.py
    action: Modify
    purpose: >-
      FINGERPRINT_PERSONAS = frozenset({"decision_scout"}) beside PERSONA_CLASSES and READY_HEAD_PERSONAS: the personas
      whose verdict a scout-input fingerprint covers.
  - file: .github/workflows/persona-verdict.yml
    action: Modify
    purpose: >-
      prepare's permissions gain checks: read (to list earlier check runs; no write scope, no secret, no id-token) and its
      install line becomes pip install pyyaml pydantic -c "$GITHUB_WORKSPACE/main/requirements.txt" (plan_fingerprint
      needs both). No other job or step changes. Size: in place on rec-5559's flow-form permissions line, else +1 line;
      re-measured at build start.
  - file: scripts/checks/ci_guards/validate_persona_verdict_chain.py
    action: Modify
    new_imports: []
    purpose: >-
      PIP_SETS["prepare"] = "pyyaml pydantic" and JOB_PERMISSIONS["prepare"] gains "checks": "read", in place (no line
      growth); the live-pair test then pins the workflow edit.
  - file: tests/personas/test_rescout.py
    action: Create
    purpose: >-
      Hermetic tests with a fake GitHub API and the repository tree as main: carry on equal, re-run on moved, the
      fail-closed reasons (missing, untrusted, unreadable, not_allowlisted, bad slug), the status-aware sidecar fetch, the
      cite merge, a two-carry chain, the input line round trip and the export.
  - file: tests/personas/test_route.py
    action: Modify
    purpose: main writes carried, rescout and plan_inputs.json and keeps routes the to-run list.
  - file: tests/personas/test_post_verdict.py
    action: Modify
    purpose: carried bodies, the fresh input line and the override form keeping it.
  - file: tests/personas/test_wake.py
    action: Modify
    purpose: >-
      a carried-only run wakes; wake and override import in a subprocess with pydantic blocked; wake.ROUTES equals
      route.ROUTES (Amendment 1).
  - file: tests/personas/test_run.py
    action: Modify
    purpose: >-
      Amendment 1: ALLOWED["route"] and ALLOWED["materialise"] become {"yaml", "pydantic"} (prepare's install line
      becomes pyyaml pydantic in this plan), and ALLOWED["post_verdict"] gains "pydantic" (in the post job's hash-locked
      wheelhouse, docker/persona/requirements-persona.txt). ALLOWED["wake"] stays {"yaml"}; the closure rule and every
      other entry are unchanged. Each widened set equals that job's install set (tracking, not loosening). The widening
      raises no validate_weakening_candidates candidate (ALLOWED is a module-level dict; measured []), so the build
      records no weakening_dispositions entry for it; this row is the human-confirmed plan naming it (Decision 235 cl.1)
      and the operator confirms the three rows by name when approving Amendment 1; if code review nonetheless lists a
      candidate, record it as planned-change citing test_obligations[2].
  - file: tests/ci/test_persona_verdict_isolation.py
    action: Modify
    purpose: >-
      Amendment 2: _layout copies the whole scripts/ tree into the fake main (shutil.copytree with ignore_patterns("__pycache__", "*.pyc")) in
      place of its hand-listed scripts/personas, scripts/session and scripts/ci files, as prepare checks out all of main;
      route's module-scope rescout import reaches scripts.roadmap, which the hand list lacked. The two contract copies,
      the planted snapshot, the sentinels and every assertion are unchanged; the edit raises no
      validate_weakening_candidates candidate (measured []).
  - file: tests/test_session_merge_checks.py
    action: Modify
    purpose: FINGERPRINT_PERSONAS is a subset of the plan class.
bundled_recommendations: [rec-5653]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - bin/venv-python -m pytest tests/personas/test_rescout.py::test_equal_fingerprint_carries_the_scout_verdict_and_a_moved_one_reruns -q passes (rec-5653's acceptance).
  - A carried BLOCK posts a failure on the new head, and a prior head's override success is never posted on the new head.
  - A missing, untrusted or unreadable prior record, an unallowlisted author, an unknown diff, a bad slug or a sidecar fetch error routes the scout.
  - scripts.personas.wake and scripts.personas.override import with pydantic unavailable.
  - routes.json keeps routes as the routes to run; carried and rescout are new keys; materialise.py and keyed_run.py are unchanged.
  - The workflow's prepare job holds exactly contents read, pull-requests read, actions read and checks read; no job gains a write scope.
