constraints:
  - plan_fingerprint.py is consumed unchanged; no module re-derives the projection (exit-criteria-ledger.yaml plan_scout_input_fingerprint).
  - No persona-id string literal in scripts/personas (executor-personas.yaml implementation_binding landing_dirs rule); the covered set is merge_checks.FINGERPRINT_PERSONAS.
  - override.py's persona-verdict-record v1 format, parse_record and origin are unchanged; the input line is a separate line.
  - "Fail closed (Decision 271 cl.3): any API error, unreadable record, unknown diff or fingerprint error runs the scout; nothing is carried on doubt."
  - A carry never widens past an exactly equal fingerprint map (Decision 235); a carried verdict's conclusion is re-derived, never copied from a prior check's conclusion.
  - No new GitHub write scope (T4.32 c4); prepare holds no secret and no id-token (Decision 263).
  - No rescue agents or workaround loops (Decision 55).
