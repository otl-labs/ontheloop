constraints:
  - Place every governed block from the sidecar with {{DATE}} set to the build's UTC date; change no other line of the two governed files. A block whose before-text does not occur exactly once on the build's base is a STOP to the plan owner.
  - No .tf, Environment, role, secret, id-token or key; no change to persona-verdict.yml, persona-verdict-trigger.yml, persona-verdict-override.yml or validate_persona_verdict_chain.py.
  - No AWS region id anywhere under .github/ (validate_project_region R2; scout r1 WARN on Decision 202); the probe lists the global sts.amazonaws.com.
  - "The filter is pinned at step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4 (tag dated 2026-11-06, past the 7-day cooldown); a different pin is a plan amendment."
  - docs/contracts/ports.yaml stays at or under 500 effective lines (Decision 166); over it is a STOP to the plan owner (rec-5274 owns relief).
  - Never weaken a probe case or a check rule to get green; a live result that contradicts the plan is a STOP (Decisions 55, 235).
