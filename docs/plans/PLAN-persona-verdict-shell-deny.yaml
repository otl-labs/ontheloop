schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-shell-deny"
intent: >-
  Plan 2 of the verdict persona egress series (T4.32 c7's shell leg): prove on a credential-free job, before any job
  assumes the persona-verdict role, that the runner shell refuses every host a job does not list. Each covered job's hosts
  live in one platform-owned file; a static check makes every job in .github/workflows/persona-verdict*.yml that holds
  id-token: write or a secret other than its GITHUB_TOKEN start with the SHA-pinned block-mode filter (telemetry, sudo and
  containers off) whose list equals that file's row, then a behavioural self-check before any step that can reach a
  credential, because the filter can pass while blocking nothing; and a keyless probe workflow on fixture PRs shows a
  listed host reached and an unlisted host, raw-IP connects, outside resolvers and sudo refused, beside an unfiltered
  control job showing each refusal is the filter's and that the vendor's filter-supplied host list is no wider than a
  committed snapshot. A dated c7 amendment names the filter's built-in GitHub allowance, its fail-open modes and what it
  sends its vendor as accepted residuals (operator card 2026-11-18). Serves NS.9 (containment ahead of any key) without
  widening any credential.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-verdict-shell-deny.yaml
phase: >-
  T4.32 (persona foundation), c7 shell leg. c7 stays open: it is met only when the container leg is proven in
  PLAN-persona-verdict-fixture-run.
cites: [dec:101, dec:205, dec:246, dec:263]
scope:
  - file: docs/plans/approved/persona-verdict-shell-deny.yaml
    action: Create
    purpose: >-
      The approved-text sidecar (Decision 246), written by this planning session and approved by the operator's approval
      run; the build never edits it.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar block roadmap-t4-32-c7-shell-leg: a dated amendment appended inside T4.32 c7's text after the
      egress plan's amendment (FILTER-SUPPLIED HOSTS, FAIL-OPEN, VENDOR). No status change.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks ports-amendment-log-shell-deny and ports-sa-15 (structural_assumptions SA-15: the shell's
      dependence on the filter and its vendor; scout r1 NOTE, Decision 212 clause 3). At most 500 effective lines.
  - file: config/persona_verdict_egress.yaml
    action: Create
    purpose: >-
      The one egress list file (platform-owned, Decision 224 clause 1, precedent config/persona_image.yaml): filter (action,
      sha, version), filter_supplied (the normalised snapshot of the vendor's list plus the agent's hard-coded hosts, read
      at build time from https://agent.api.stepsecurity.io/v1/github/meta and agent v0.18.1 agent.go addImplicitEndpoints,
      productionresultssaN folded to productionresultssa*), wildcard_residuals (empty), and jobs: {<workflow path>: {<job>:
      [host:port, ...]}} with one row, the probe workflow's egress-probe job: [sts.amazonaws.com:443]. A header comment says
      every entry is platform-owned and that a host derived from a project setting (the region, a provider) arrives only
      with a form the check resolves from that setting's home (PLAN-persona-verdict-first-key-read).
  - file: .github/workflows/persona-verdict-egress-probe.yml
    action: Create
    purpose: >-
      Keyless probe. on: pull_request with paths tests/fixtures/persona_verdict/fixture_pr/**,
      config/persona_verdict_egress.yaml, scripts/personas/egress_*.py, scripts/personas/run.py and this file; top-level
      permissions {}. Job egress-probe (runs-on ubuntu-latest, timeout 5, permissions {contents: read}): step 0 the filter
      (uses step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4; with egress-policy block,
      allowed-endpoints sts.amazonaws.com:443, disable-telemetry true, disable-sudo-and-containers true), step 1
      actions/checkout at the repo's pinned SHA with persist-credentials false, step 2 id probe-egress run
      `python3 -I scripts/personas/run.py egress-probe`. Job egress-control (same runs-on, timeout and permissions, no
      filter): checkout, the repo's pinned setup-python 3.12, id control-install `pip install pyyaml -c requirements.txt`,
      id control-egress `python3 -I scripts/personas/run.py egress-control`. No secrets, id-token, environment, container
      or artifact.
  - file: scripts/personas/egress_probe.py
    action: Create
    purpose: >-
      Stdlib only. CASES, each (id, kind, target, port): listed (TLS handshake with SNI to sts.amazonaws.com:443),
      unlisted_name (resolve example.com, then connect 443), raw_ip_443 (1.1.1.1), raw_ip_80 (1.1.1.1), raw_ip_other
      (9.9.9.9:443), dns_udp_public and dns_tcp_public (an A query to 8.8.8.8:53, packet built with struct),
      dns_udp_platform and dns_tcp_platform (168.63.129.16:53), dot (1.1.1.1:853), ipv6 ([2606:4700:4700::1111]:443),
      sudo (`sudo -n true`). run_cases(cases, expect) returns one result per case; a case is reached when it completes
      (a DNS answer arrives, a connect or handshake succeeds, sudo exits 0) and refused otherwise, each attempt bounded by
      a 5 s timeout. main() (verb egress-probe) expects listed reached and every other case refused, prints
      `EGRESS-PROBE case=<id> expect=<e> got=<g>` per case and `EGRESS-PROBE PASS` or `EGRESS-PROBE FAIL`, exits 0 only
      on PASS. LISTED = ("sts.amazonaws.com", 443) is the one constant the list file's row must hold.
  - file: scripts/personas/egress_self_check.py
    action: Create
    purpose: >-
      Verb egress-self-check for covered jobs: runs egress_probe's unlisted_name, raw_ip_443 and sudo cases expecting
      refused; prints `EGRESS-SELF-CHECK PASS` or `EGRESS-SELF-CHECK FAIL <ids>`, exits non-zero on FAIL.
  - file: scripts/personas/egress_control.py
    action: Create
    purpose: >-
      Verb egress-control (unfiltered job): runs every case except ipv6 expecting reached (ipv6 is reported, not
      asserted; hosted runners may have no IPv6 route), then GETs the vendor's list, normalises it as the list file
      does and fails if it holds a host the file's filter_supplied lacks. Prints `EGRESS-CONTROL case=...` lines,
      `EGRESS-CONTROL VENDOR-LIST <ok|wider: hosts>` and `EGRESS-CONTROL PASS` or `FAIL`; a fetch failure is FAIL.
  - file: scripts/personas/run.py
    action: Modify
    purpose: VERBS gains egress-probe -> egress_probe, egress-self-check -> egress_self_check, egress-control -> egress_control.
  - file: scripts/checks/misc/validate_persona_verdict_egress.py
    action: Create
    purpose: >-
      The static check (c7 shell leg; its own module in the misc domain, not the 437-line chain check, Decision 128).
      Over every .github/workflows/persona-verdict*.yml and config/persona_verdict_egress.yaml. A job is covered when it
      holds id-token: write (job or workflow level), names any secrets-context entry other than GITHUB_TOKEN, passes the
      caller's secrets through with inherit, or has a row in the file. Rules: (1) the file parses with filter.action, a 40-hex filter.sha, filter.version, a
      non-empty filter_supplied, wildcard_residuals and jobs; (2) every row names an existing covered job and every covered
      job has a row; (3) a covered job has no job-level uses:, no container: or services:, no docker command, runs-on
      exactly ubuntu-latest; (4) its step 0 uses exactly <action>@<sha>, its uses: line carries the file's version comment,
      it has no if: or continue-on-error, its with: keys are exactly egress-policy (block), allowed-endpoints,
      disable-telemetry (true) and disable-sudo-and-containers (true), no with: value holds ${{, and allowed-endpoints
      split on whitespace equals the row as a set; (5) the first step that is not step 0, an actions/checkout with
      persist-credentials false, or the exact work-directory mkdir line is a self-check step (its run is the egress-self-check
      or egress-probe run.py line, with or without the $GITHUB_WORKSPACE/main/ prefix) with no if: or continue-on-error;
      (6) every endpoint is host:port with a numeric port, no IP literal, no execute-api or lambda-url host, and a host
      with * only when it is in wildcard_residuals and the job uploads or downloads an artifact; (7) the probe workflow is
      exactly the scope row's shape (trigger, paths, permissions, job set, run lines, egress-control has no filter and is
      not covered). Declares registry.examined(n, unit="workflows") on every exit (Decision 170).
  - file: scripts/checks/misc/_manifest.py
    action: Modify
    purpose: >-
      One Entry for validate_persona_verdict_egress: pre=True, pre_globs .github/workflows/persona-verdict*.yml,
      config/persona_verdict_egress.yaml, the module, scripts/checks/_common.py, scripts/checks/registry.py;
      full_segment full_after_lint (the chain check's pattern). The check sits in misc, beside validate_ghas_probe,
      because scripts/checks/ci_guards/_manifest.py is at 499 of 500 SLOC (Decision 128: place, do not raise).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: "validate_persona_verdict_egress: environment, beside validate_persona_verdict_chain."
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      r3 rows, value 1, for the probe workflow's inline run bodies: egress-probe::probe-egress,
      egress-control::control-install and egress-control::control-egress (Decision 162; each body is one line).
  - file: tests/checks/misc/test_validate_persona_verdict_egress.py
    action: Create
    purpose: >-
      Unit red fixtures on a tmp tree built from a known-good covered job: step 0 missing, filter second, audit mode,
      telemetry on, sudo-and-containers off, an extra or missing host, a wildcard (and a residual wildcard in a job with no
      artifact step), ${{ in with, if: or continue-on-error on step 0 or the self-check, self-check absent or after another
      step, container:, services:, job-level uses:, a non-ubuntu-latest runs-on, a policy-store input, an IP literal, an
      execute-api host, a stale row, a covered job with no row, an id-token job and a secrets job each uncovered by the
      file, a wrong SHA or version comment, a probe workflow drift; each fails with its message, and the good tree passes.
  - file: tests/personas/test_egress_probe.py
    action: Create
    purpose: >-
      The three verb modules with socket, ssl, subprocess and urllib stubbed: case classification (reached vs refused,
      timeouts), the DNS packet, PASS and FAIL lines and exit codes, the self-check subset, the control job's vendor-list
      normalisation and the wider-list and fetch-failure FAILs.
  - file: tests/personas/test_run.py
    action: Modify
    purpose: ALLOWED gains egress_probe and egress_self_check (stdlib only) and egress_control ({"yaml"}).
  - file: tests/ci/test_persona_verdict_egress.py
    action: Create
    purpose: >-
      rec-5041's acceptance first path (absent on main): the live tree passes check_tree; the probe workflow's step 0 SHA
      and version equal the file's filter; egress_probe.LISTED as host:port equals the egress-probe row; filter_supplied
      holds github.com and a productionresultssa* entry (the snapshot is not empty or stale-shaped).
bundled_recommendations: []
followon_recs: [rec-5357, rec-5358]
closes_criteria: []
infrastructure_dependencies:
  - >-
    None. No .tf, Environment, role or secret. The probe workflow is keyless. compute_affected_artifacts(<scope>) names
    data-pipeline through docs/ROADMAP-PLATFORM.yaml only (tier-item text), so no build, deploy or smoke step is owed
    (the PLAN-persona-verdict-egress disposition).
acceptance_criteria:
  - The two governed files carry exactly the sidecar's three blocks (approved_text verify --base origin/main exits 0).
  - validate_persona_verdict_egress passes on the live tree and each unit red fixture fails with its own message.
  - The build PR's own persona-verdict-egress-probe run is green with EGRESS-PROBE PASS and EGRESS-CONTROL PASS, before merge.
  - After merge, a fixture PR's persona-verdict-egress-probe run on main's definition is green with both PASS lines (the red fixture proven on main that PLAN-persona-verdict-first-key-read waits for).
  - docs/contracts/ports.yaml has at most 500 effective lines.
  - The fast tier passes on the build head.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Unit tests for the check, the probe verbs, run.py and the live tree.
    command: >-
      bin/venv-python -m pytest tests/checks/misc/test_validate_persona_verdict_egress.py tests/personas/test_egress_probe.py
      tests/personas/test_run.py tests/ci/test_persona_verdict_egress.py -q
    expected: All tests pass.
    expected_literals: [passed]
    fix_if: A test fails; fix the code inside scope, never the assertion (Decision 235).
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-egress-units
  - step: 2
    phase: pre-deploy
    action: The registered check passes on the live tree.
    command: >-
      bin/venv-python -c "from scripts.checks.misc.validate_persona_verdict_egress import validate_persona_verdict_egress as v; f=[]; v(f); assert not f, f; print('EGRESS_CHECK_OK')"
    expected: Prints the ok marker.
    expected_literals: [EGRESS_CHECK_OK]
    fix_if: A rule refuses the live workflow or file; fix the workflow or file to the scope row's shape.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_persona_verdict_egress, a registered check the fast and full tiers run on every PR and on main,
      so a graduated copy adds no guard.
  - step: 3
    phase: pre-deploy
    action: Approved text placed word-exactly and ports.yaml within its budget.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-shell-deny --base origin/main &&
      bin/venv-python -c "from scripts.checks.structural._classify import effective_lines; n=effective_lines(open('docs/contracts/ports.yaml').read()); assert n<=500, n; print('PORTS_OK', n)" &&
      bin/venv-python -c "from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as v; f=[]; v(f); assert not f, f; print('PORTS_CONTRACT_OK')"
    expected: Prints the approved-text, ports-size and ports-contract markers.
    expected_literals: [APPROVED-TEXT OK, PORTS_OK, PORTS_CONTRACT_OK]
    fix_if: Drift means re-place the blocks from the sidecar; over 500 lines or an anchor not unique on main is a STOP to the plan owner.
    hermetic: true
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: All fast-tier checks pass.
    fix_if: A check fails; fix inside scope or STOP to the plan owner; never loosen a check (Decision 235).
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Full tier passes and --verify-head confirms it for the head.
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner (main reds owned elsewhere are deferred).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Pre-merge live proof: the build PR touches the probe workflow, so persona-verdict-egress-probe runs on it with the
      PR's definition. Read both jobs' logs.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict-egress-probe.yml") for the run on the build PR's head SHA, then
      mcp__github__get_job_logs for its egress-probe and egress-control jobs.
    expected: >-
      Both jobs concluded success; the egress-probe log shows listed got=reached, every other case got=refused and
      EGRESS-PROBE PASS; the egress-control log shows every asserted case got=reached, VENDOR-LIST ok and EGRESS-CONTROL
      PASS; neither log shows a StepSecurity insights link.
    fix_if: >-
      dns_tcp_platform or dns_udp_platform got=reached in egress-probe (the filter leaves the platform resolver open) is a
      STOP to the plan owner, who takes it to the operator (accept as a residual through a new approval run, or change the
      mechanism); never drop the case. Any other refusal missing, a control case refused, or a wider vendor list is also a
      STOP with the log lines; a flaky control target is replaced only through a plan amendment.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      Proof on main: after merge, on the build session's branch restarted from main, commit one head that rewrites
      tests/fixtures/persona_verdict/fixture_pr/proceed.txt with printf '\n%s\n' proceed (a leading newline, so
      end-of-file-fixer leaves a real change) and nothing else; run the full tier and --verify-head for that head (the
      fixture path is not handoff-exempt), push, and open one draft fixture PR authored by the operator's linked account.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict-egress-probe.yml") for the run on the fixture PR's head, then mcp__github__get_job_logs
      for both jobs; then mcp__github__update_pull_request(state="closed") for the fixture PR.
    expected: >-
      Both jobs concluded success with EGRESS-PROBE PASS and EGRESS-CONTROL PASS on a definition equal to main's (the PR
      changes only the fixture file); the run id is reported to the plan owner and the coordinator as the c7 shell leg's
      read-back; the fixture PR is closed unmerged.
    fix_if: As step 6; a failure here is a STOP to the plan owner, and PLAN-persona-verdict-first-key-read does not start.
    hermetic: false
    graduation: not-applicable
