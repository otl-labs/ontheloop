execution_steps:
  - "Pre: on the build's base, re-run red_overlap and plan_obligations on this plan; confirm each sidecar block's before-text occurs exactly once (else STOP to the plan owner)."
  - Place the four sidecar blocks with {{DATE}} set to the build's UTC date.
  - "Compute AGENT_SHA256: download https://github.com/step-security/agent/releases/download/v0.18.1/agent_0.18.1_linux_amd64.tar.gz, assert its sha256 equals CHECKSUMS.non_tls.amd64 in src/checksum.ts at the pinned action SHA (9db01a8e795ffa77e0220de75c37f3fde83ec8e411e1fad8932977a13d49e8d0 at planning), extract it into an empty directory, sha256 the agent file, and write the value to filter.agent_sha256 and egress_probe.AGENT_SHA256 (a mismatch is a STOP to the plan owner)."
  - "Fetch the vendor list (curl https://agent.api.stepsecurity.io/v1/github/meta) and write config/persona_verdict_egress.yaml with filter_supplied normalised as egress_control.py normalises it, plus the agent's hard-coded hosts."
  - Write the probe modules, run.py verbs, the probe workflow, the check, its manifest entry, taxonomy row and baseline rows, then the four test files; confirm each new test fails on the base and passes after.
  - Execute the Verification Plan -- run each step; loop until pass; on an unrecoverable failure stop and report to the plan owner (Decision 55).
  - "Run the fresh-context code review (implement skill) on the diff; a REVISE is fixed and reviewed again."
  - "Push, open the build PR, read VP 6 (the PR's own probe run) and merge on code review PROCEED and green CI (operator card 2026-11-18); merge_pull_request passes an explicit commit_message and expectedHeadSha."
  - "After merge: VP 7 (fixture PR on main's definition), report its run id to the plan owner and the coordinator."
  - "Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state; parent validator evidence (VP 5 plus --verify-head); structured postflight evidence; the real outcome - push, build PR, CI green by event-driven wake, merge SHA, VP 7 run id."
