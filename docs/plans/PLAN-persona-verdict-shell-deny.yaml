schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-shell-deny"
intent: >-
  Plan 2 of the verdict persona egress series (T4.32 c7's shell leg): prove on a credential-free job, before any job
  assumes the persona-verdict role, that the runner shell refuses every host a job does not list. Each covered job's hosts
  live in one core-owned file; a static check makes every job in .github/workflows/persona-verdict*.yml that holds
  id-token: write or a secret other than its GITHUB_TOKEN start with the SHA-pinned block-mode filter (telemetry, sudo and
  containers off) whose list equals that file's row, then a behavioural self-check before any step that can reach a
  credential, because the filter can pass while blocking nothing; and a keyless probe workflow on fixture PRs shows a
  listed host reached and an unlisted name, raw-IP connects, outside resolvers and sudo refused, beside an unfiltered
  control job showing each refusal is the filter's and that the vendor's filter-supplied host list is no wider than a
  committed snapshot. A dated c7 amendment names the filter's built-in GitHub allowance, the Azure host addresses it
  leaves open, its fail-open modes (including a mid-job rule removal) and what it exchanges with its vendor as accepted
  residuals (operator cards 2026-11-18, the Azure one awaiting its answer). Serves NS.9 (containment ahead of any key) without
  widening any credential.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-persona-verdict-shell-deny.yaml
phase: >-
  T4.32 (persona foundation), c7 shell leg. c7 stays open: it is met only when the container leg is proven in
  PLAN-persona-verdict-fixture-run.
cites: [dec:101, dec:205, dec:212, dec:246, dec:263]
scope:
  - file: docs/plans/approved/persona-verdict-shell-deny.yaml
    action: Create
    purpose: >-
      The approved-text sidecar (Decision 246), written by this planning session and approved by the operator's approval
      run; the build never edits it.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar block roadmap-t4-32-c7-shell-leg: a dated amendment appended inside T4.32 c7's text after the
      egress plan's amendment (FILTER-SUPPLIED HOSTS, FAIL-OPEN, VENDOR). No status change.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks ports-amendment-log-shell-deny (a new amendment_log entry) and ports-sa-16
      (structural_assumptions SA-16: the shell's dependence on the filter, its agent and its vendor; scout r1 NOTE, Decision
      212 clause 3). At most 500 effective lines: 493 on main 6fcf9540, 495 after this one.
  - file: tests/checks/contracts/test_persona_image_channel.py
    action: Modify
    purpose: >-
      Exactly the sidecar block image-test-row-by-content: test_ports_records_the_persona_image_row finds the image row
      by content (exactly one structural_assumptions row names config/persona_image.yaml; its id is well formed and
      unique; an amendment_log summary naming PLAN-persona-image-channel names it) instead of as rows[-1] and
      amendment_log[0], which SA-16 breaks. No other line in the file changes.
  - file: config/persona_verdict_egress.yaml
    action: Create
    purpose: >-
      The one egress list file (core-owned, Decision 224 clause 1, precedent config/persona_image.yaml): filter (action,
      sha, version, agent_sha256: the sha256 of the agent binary inside the agent v0.18.1 linux amd64 release tarball whose
      checksum the pinned action verifies, computed at build time), filter_supplied (the normalised snapshot of the vendor's list plus the agent's hard-coded hosts, read
      at build time from https://agent.api.stepsecurity.io/v1/github/meta and agent v0.18.1 agent.go addImplicitEndpoints,
      productionresultssaN folded to productionresultssa*), wildcard_residuals (empty), and jobs: {<workflow path>: {<job>:
      [host:port, ...]}} with one row, the probe workflow's egress-probe job: [sts.amazonaws.com:443]. A header comment says
      every entry is core-owned and that a host derived from a project setting (the region, a provider) arrives only
      with a form the check resolves from that setting's home (PLAN-persona-verdict-first-key-read).
  - file: .github/workflows/persona-verdict-egress-probe.yml
    action: Create
    purpose: >-
      Keyless probe, workflow name: persona-verdict-egress-probe. on: pull_request with paths tests/fixtures/persona_verdict/fixture_pr/**,
      config/persona_verdict_egress.yaml, scripts/personas/egress_*.py, scripts/personas/run.py and this file; top-level
      permissions {}. Job egress-probe (runs-on ubuntu-latest, timeout 5, permissions {contents: read}): step 0 the filter
      (uses step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4; with egress-policy block,
      allowed-endpoints sts.amazonaws.com:443, disable-telemetry true, disable-sudo-and-containers true), step 1
      actions/checkout at the repo's pinned SHA with persist-credentials false, step 2 id probe-egress run
      `python3 -I scripts/personas/run.py egress-probe`. Job egress-control (same runs-on, timeout and permissions, no
      filter): checkout, the repo's pinned setup-python 3.12, id control-install `pip install pyyaml -c requirements.txt`,
      id control-egress `python3 -I scripts/personas/run.py egress-control`. No secrets, id-token, environment, container
      or artifact.
  - file: scripts/personas/egress_probe.py
    action: Create
    purpose: >-
      Stdlib only. CASES, each (id, kind, target, port): listed (TLS handshake with SNI to sts.amazonaws.com:443);
      unlisted_name (example.com through the system resolver: reached when it returns any address other than the filter's
      sinkhole 54.185.253.63, since a real answer means the name left the filter; otherwise reached only if a connect to
      443 on the returned address succeeds); dns_txt_system (a TXT query for example.com to the first nameserver in
      /etc/resolv.conf, over UDP: reached when a TXT answer returns; the filter's resolver answers A queries only, so a
      TXT answer means a resolver outside it, such as GitHub's own resolver experiment); raw_ip_443 (1.1.1.1), raw_ip_80
      (1.1.1.1), raw_ip_other (9.9.9.9:443); dns_udp_public and dns_tcp_public (an A query to 8.8.8.8:53, packet built
      with struct); dns_udp_azure (168.63.129.16:53); dns_tcp_azure (168.63.129.16:53, expectation reported); dot
      (1.1.1.1:853); ipv6 ([2606:4700:4700::1111]:443; no route counts as refused); sudo (`sudo -n true`). run_cases(cases,
      expect) returns one result per case; a case is reached when it completes (a DNS answer arrives, a connect or
      handshake succeeds, sudo exits 0) and refused otherwise, each attempt bounded by a 5 s timeout. An expectation is
      reached, refused or reported; a reported case prints its result and never fails the run (the c7 AZURE HOST
      ADDRESSES residual, owned by rec-5362). main() (verb egress-probe) expects listed reached, dns_tcp_azure reported and
      every other case refused, prints `EGRESS-PROBE case=<id> expect=<e> got=<g>` per case and `EGRESS-PROBE PASS` or
      `EGRESS-PROBE FAIL`, exits 0 only on PASS. LISTED = ("sts.amazonaws.com", 443) and AGENT_SHA256 are the constants the
      list file must hold. Case agent_binary: sha256 of /home/agent/agent (the path the action copies the agent to, in a
      folder it chowns to the runner user) equal to AGENT_SHA256 is refused-expected-pass (the read agent runs); a
      different or unreadable binary is reached, which fails the run.
  - file: scripts/personas/egress_self_check.py
    action: Create
    purpose: >-
      Verb egress-self-check for covered jobs: runs egress_probe's agent_binary, unlisted_name, dns_txt_system,
      raw_ip_443, ipv6 and sudo cases expecting refused (agent_binary first, so a job under agent-ebpf fails before any
      other step; scout r4 SPIRIT 181), with the same classification; prints `EGRESS-SELF-CHECK PASS` or `EGRESS-SELF-CHECK FAIL <ids>`, exits non-zero on FAIL.
  - file: scripts/personas/egress_control.py
    action: Create
    purpose: >-
      Verb egress-control (unfiltered job): runs every case except ipv6, dns_tcp_azure and agent_binary expecting reached
      (agent_binary is skipped: no agent runs there; the other two are reported, not asserted: hosted runners may have no IPv6 route, and whether Azure's resolver answers over TCP is the
      probe's reported residual), so each refusal in egress-probe is shown to be the filter's; then GETs the vendor's
      list, normalises it as the list file does (productionresultssaN folded to productionresultssa*, and any served host
      a filter_supplied wildcard already matches under the agent's prefix-plus-suffix rule dropped) and fails if it holds
      a host the file's filter_supplied lacks. Prints `EGRESS-CONTROL case=...` lines,
      `EGRESS-CONTROL VENDOR-LIST <ok|wider: hosts>` and `EGRESS-CONTROL PASS` or `FAIL`; a fetch failure is FAIL.
  - file: scripts/personas/run.py
    action: Modify
    purpose: VERBS gains egress-probe -> egress_probe, egress-self-check -> egress_self_check, egress-control -> egress_control.
  - file: scripts/checks/misc/validate_persona_verdict_egress.py
    action: Create
    purpose: >-
      The static check (c7 shell leg; its own module in the misc domain, not the 437-line chain check, Decision 128).
      Over every .github/workflows/persona-verdict*.yml and config/persona_verdict_egress.yaml. A job is covered when
      its effective id-token permission is write (an explicit id-token: write or permissions: write-all, at job level, or
      at workflow level when the job sets no permissions of its own), when any secrets reference other than
      secrets.GITHUB_TOKEN (secrets.NAME, secrets['NAME'], toJSON(secrets) or any other secrets expression) appears in
      the job or in the workflow's top-level env: or defaults:, when it passes the caller's secrets through with inherit,
      or when it has a row in the file. Rules: (1) the file parses with filter.action, a 40-hex filter.sha, filter.version, a 64-hex filter.agent_sha256, a
      non-empty filter_supplied, wildcard_residuals and jobs; (2) every row names an existing covered job and every covered
      job has a row; (3) a covered job has no job-level uses:, no container: or services:, no docker command, runs-on
      exactly ubuntu-latest; (4) its step 0 uses exactly <action>@<sha>, its uses: line carries the file's version comment,
      it has no if: or continue-on-error, its with: keys are exactly egress-policy (block), allowed-endpoints,
      disable-telemetry (true) and disable-sudo-and-containers (true), no with: value holds ${{, and allowed-endpoints
      split on whitespace equals the row as a set; (5) the first step that is not step 0, an actions/checkout with
      persist-credentials false, or the exact work-directory mkdir line (the chain check's MKDIR, mkdir -p
      "$RUNNER_TEMP/work") is a self-check step (its run is the egress-self-check or egress-probe run.py line; in the
      probe workflow without a prefix, in every other covered job only the chain check's RUN_PREFIX form, python3 -I
      "$GITHUB_WORKSPACE/main/scripts/personas/run.py" egress-self-check, after an actions/checkout with path: main) with
      no if: or continue-on-error; no step before it has a secrets expression in its env: or with:; a checkout before it
      has with: keys exactly persist-credentials (false), plus path (main) outside the probe workflow and optionally ref
      only as exactly ${{ github.sha }} (the form persona-verdict.yml's checkouts use), so no repository:, token:,
      ssh-key: or other input; and the job's and the workflow's env: hold no secrets expression, so in a keyed job only code from
      the trusted checkout runs before the self-check and no credential is in reach until it passes (the keyless probe
      runs the PR's own code by design);
      (6) every endpoint is host:port with a numeric port, no IP literal, no execute-api or lambda-url host, and a host
      with * only when it is in wildcard_residuals and the job uploads or downloads an artifact; (7) the probe workflow is
      exactly the scope row's shape (name persona-verdict-egress-probe, trigger, paths, permissions, job set, run lines, egress-control has no filter and is
      not covered). Declares registry.examined(n, unit="workflows") on every exit (Decision 170).
  - file: scripts/checks/misc/_manifest.py
    action: Modify
    purpose: >-
      One Entry for validate_persona_verdict_egress: pre=True, pre_globs .github/workflows/persona-verdict*.yml,
      config/persona_verdict_egress.yaml, the module, scripts/checks/_common.py, scripts/checks/registry.py;
      full_segment full_after_lint (the chain check's pattern). The check sits in misc, beside validate_ghas_probe,
      because scripts/checks/ci_guards/_manifest.py is at 499 of 500 SLOC (Decision 128: place, do not raise).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      Two one-line rows: function_to_category gains `validate_persona_verdict_egress: environment` beside
      validate_persona_verdict_chain; the workflows map gains `persona-verdict-egress-probe: {tier: not_a_gate, ci_rca:
      excluded, owner: platform, rationale: "Keyless pull_request probe of the verdict shell's egress filter; each run
      serves one PR and its result is read by the plan's live proof, while ci-rca watches main only (ci-rca-lifecycle
      trigger_scope)."}` beside the persona-verdict-trigger row (validate_ci_rca_taxonomy and
      validate_ci_rca_adjudication require every workflow name: in that map). The file is 492 effective lines on main
      6fcf9540, 494 after these rows. Only if the rows would take it past 500 on the build's base does the same edit fold
      the block-style CodeQL workflows: entry into one flow-style line with identical keys and values (the #2120
      precedent; never drop a key or a word).
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      r3_workflows rows, value 1, for the probe workflow's inline run bodies, with full keys:
      ".github/workflows/persona-verdict-egress-probe.yml::egress-probe::probe-egress",
      "...::egress-control::control-install" and "...::egress-control::control-egress" (Decision 162; each body is one
      line).
  - file: tests/checks/misc/test_validate_persona_verdict_egress.py
    action: Create
    purpose: >-
      Unit red fixtures on a tmp tree built from a known-good covered job: step 0 missing, filter second, audit mode,
      telemetry on, sudo-and-containers off, an extra or missing host, a wildcard (and a residual wildcard in a job with no
      artifact step), ${{ in with, if: or continue-on-error on step 0 or the self-check, self-check absent or after another
      step, container:, services:, job-level uses:, a non-ubuntu-latest runs-on, a policy-store input, an IP literal, an
      execute-api host, a stale row, a covered job with no row, an id-token job and a secrets job each uncovered by the
      file, each further covering form uncovered by the file (workflow-level id-token: write, job-level write-all,
      workflow-level write-all, a secret in the workflow's top-level env:, toJSON(secrets), a secrets['NAME'] form, an inherit of the caller's secrets), a
      lambda-url host, a wrong SHA or version comment, a missing or malformed agent_sha256, a secret in a job's env:, a secret in a pre-self-check step's own env: and
      one in its with:, a workflow-level env: secret on a job that has a row, a pre-self-check checkout with token:, one
      with ssh-key:, one with repository:, one with a ref: other than ${{ github.sha }}, an unprefixed self-check line
      outside the probe workflow, a prefixed self-check line with no path: main checkout, a probe workflow drift; each fails with its message; two green fixtures stay uncovered (a job whose own permissions: override a
      workflow-level id-token: write, a job whose only secret is secrets.GITHUB_TOKEN); and the good tree passes.
  - file: tests/personas/test_egress_probe.py
    action: Create
    purpose: >-
      The three verb modules with socket, ssl, subprocess and urllib stubbed: case classification (reached vs refused,
      timeouts; unlisted_name reached on a real answer even when the connect fails, refused on the sinkhole or a
      failure; dns_txt_system reached on a TXT answer; a reported case never fails; agent_binary with the read of /home/agent/agent stubbed: a matching hash is refused
      and passes, a mismatching hash, a missing file and an unreadable file are each reached and fail, and the self-check
      runs agent_binary first), the DNS packets (A and TXT), PASS and FAIL lines and exit codes, the self-check subset, the control job's case set (agent_binary
      skipped, ipv6 and dns_tcp_azure reported only, every other case expected reached), its vendor-list normalisation and
      the wider-list and fetch-failure FAILs.
  - file: tests/personas/test_run.py
    action: Modify
    purpose: ALLOWED gains egress_probe and egress_self_check (stdlib only) and egress_control ({"yaml"}).
  - file: tests/ci/test_persona_verdict_egress.py
    action: Create
    purpose: >-
      rec-5041's acceptance first path (absent on main): the live tree passes check_tree; the probe workflow's step 0 SHA
      and version equal the file's filter; egress_probe.LISTED as host:port equals the egress-probe row; egress_probe.AGENT_SHA256 equals filter.agent_sha256; filter_supplied
      holds github.com and a productionresultssa* entry (the snapshot is not empty or stale-shaped).
bundled_recommendations: []
followon_recs: [rec-5357, rec-5358, rec-5362]
closes_criteria: []
infrastructure_dependencies:
  - >-
    None. No .tf, Environment, role or secret. The probe workflow is keyless. compute_affected_artifacts(<scope>) names
    data-pipeline through docs/ROADMAP-PLATFORM.yaml only (tier-item text), so no build, deploy or smoke step is owed
    (the PLAN-persona-verdict-egress disposition).
acceptance_criteria:
  - The three governed files carry exactly the sidecar's four blocks (approved_text verify --base origin/main exits 0).
  - validate_persona_verdict_egress passes on the live tree and each unit red fixture fails with its own message.
  - The build PR's own persona-verdict-egress-probe run is green with EGRESS-PROBE PASS and EGRESS-CONTROL PASS, before merge.
  - After merge, a fixture PR's persona-verdict-egress-probe run on main's definition is green with both PASS lines (the red fixture proven on main that PLAN-persona-verdict-first-key-read waits for).
  - docs/contracts/ports.yaml has at most 500 effective lines.
  - The fast tier passes on the build head.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Unit tests for the check, the probe verbs, run.py and the live tree.
    command: >-
      bin/venv-python -m pytest tests/checks/misc/test_validate_persona_verdict_egress.py tests/personas/test_egress_probe.py
      tests/personas/test_run.py tests/ci/test_persona_verdict_egress.py -q
    expected: All tests pass.
    expected_literals: [passed]
    fix_if: A test fails; fix the code inside scope, never the assertion (Decision 235).
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-egress-units
  - step: 2
    phase: pre-deploy
    action: The registered check passes on the live tree.
    command: >-
      bin/venv-python -c "from scripts.checks.misc.validate_persona_verdict_egress import validate_persona_verdict_egress as v; f=[]; v(f); assert not f, f; print('EGRESS_CHECK_OK')"
    expected: Prints the ok marker.
    expected_literals: [EGRESS_CHECK_OK]
    fix_if: A rule refuses the live workflow or file; fix the workflow or file to the scope row's shape.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_persona_verdict_egress, a registered check the fast and full tiers run on every PR and on main,
      so a graduated copy adds no guard.
  - step: 3
    phase: pre-deploy
    action: Approved text placed word-exactly and ports.yaml within its budget.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-shell-deny --base origin/main &&
      bin/venv-python -c "from scripts.checks.structural._classify import effective_lines; n=effective_lines(open('docs/contracts/ports.yaml').read()); assert n<=500, n; print('PORTS_OK', n)" &&
      bin/venv-python -c "from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as v; f=[]; v(f); assert not f, f; print('PORTS_CONTRACT_OK')" &&
      bin/venv-python -m pytest tests/checks/contracts/test_persona_image_channel.py -q
    expected: Prints the approved-text, ports-size and ports-contract markers and the image test's pass line.
    expected_literals: [APPROVED-TEXT OK, PORTS_OK, PORTS_CONTRACT_OK, passed]
    fix_if: Drift means re-place the blocks from the sidecar; over 500 lines or an anchor not unique on main is a STOP to the plan owner.
    hermetic: true
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: All fast-tier checks pass.
    fix_if: A check fails; fix inside scope or STOP to the plan owner; never loosen a check (Decision 235).
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Full tier before handoff.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      Full tier passes and --verify-head confirms it for the head. The full tier outlasts the foreground cap: start it as a
      harness-tracked background run with a 2 h limit from the top-level session; the verdict is --verify-head.
    fix_if: A failure in scope is fixed; one outside scope is a STOP to the plan owner (main reds owned elsewhere are deferred).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Pre-merge live proof: the build PR touches the probe workflow, so persona-verdict-egress-probe runs on it with the
      PR's definition. Read both jobs' logs.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict-egress-probe.yml") for the run on the build PR's head SHA, then
      mcp__github__actions_list(method="list_workflow_jobs", resource_id=<run id>) and
      mcp__github__get_job_logs(owner="otl-labs", repo="ontheloop", job_id=<id>, return_content=true) for its egress-probe
      and egress-control jobs.
    expected: >-
      Both jobs concluded success; the egress-probe log shows listed got=reached, every refused-expected case
      got=refused (ipv6 included), a got= line for dns_tcp_azure (reported in the run summary to the plan owner) and
      EGRESS-PROBE PASS; the egress-control log shows every asserted case got=reached, VENDOR-LIST ok and EGRESS-CONTROL
      PASS; neither log shows a StepSecurity insights link; the egress-probe filter step log shows `[!] TLS_NOT_ENABLED`
      (it selects agent v0.18.1, the binary this plan read: setup.ts:514-515, install-agent.ts:33-38), and the probe shows
      agent_binary got=refused.
    fix_if: >-
      Any refused-expected case got=reached in egress-probe (notably dns_udp_azure, unlisted_name or dns_txt_system),
      a control case refused, a wider vendor list, or a filter step that installed agent-ebpf (TLS_ENABLED or the
      'Defaulting to TLS enabled' line) is a STOP to the plan owner with the log lines; never drop or
      re-classify a case. A flaky control target is replaced only through a plan amendment.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      Proof on main: after merge, on the build session's branch restarted from main, commit one head that rewrites
      tests/fixtures/persona_verdict/fixture_pr/proceed.txt with printf '\n%s\n' proceed (a leading newline, so
      end-of-file-fixer leaves a real change) and nothing else; run the full tier and --verify-head for that head (the
      fixture path is not handoff-exempt), push, and open one draft fixture PR authored by the operator's linked account.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict-egress-probe.yml") for the run on the fixture PR's head, then mcp__github__get_job_logs
      for both jobs (list_workflow_jobs then get_job_logs with job_id, as step 6); then
      mcp__github__update_pull_request(state="closed") for the fixture PR.
    expected: >-
      Both jobs concluded success with EGRESS-PROBE PASS and EGRESS-CONTROL PASS on a definition equal to main's (the PR
      changes only the fixture file), and the egress-probe filter step log shows `[!] TLS_NOT_ENABLED` and the probe
      shows agent_binary got=refused; the run id is reported to the plan owner and the coordinator as the c7 shell leg's
      read-back; the fixture PR is closed unmerged.
    fix_if: As step 6; a failure here is a STOP to the plan owner, and PLAN-persona-verdict-first-key-read does not start.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: exactly the approved c7 shell-leg block is placed
    verification_step: 3
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-shell-deny --base origin/main
    red_green_expectation: red before (block not placed), green after
  - source: docs/contracts/ports.yaml
    behavior: exactly the approved SA-16 and amendment-log blocks are placed
    verification_step: 3
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-shell-deny --base origin/main
    red_green_expectation: red before (blocks not placed), green after
  - source: config/persona_verdict_egress.yaml
    behavior: the list file's filter pin, snapshot and egress-probe row agree with the probe workflow and the probe constant
    verification_step: 1
    test_selector: tests/ci/test_persona_verdict_egress.py
    red_green_expectation: red before (file and test absent), green after
  - source: .github/workflows/persona-verdict-egress-probe.yml
