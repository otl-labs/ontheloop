constraints:
  - "Starts only after PLAN-persona-verdict-chain's build has merged: every Modify row here edits a file that build creates. If its merged shape differs from that plan's scope rows (job names, artifact names, file names), or resolve_pr and route expose no module-level constants for the prepared file names wake.py must import, STOP and send the plan owner the difference; never adapt silently or edit those modules."
  - No inference key, no OIDC token, no AWS call and no Environment in the wake job (operator card 2026-11-16; T4.32 c7).
  - Nothing under scripts/personas/ names a registered persona id or contract path (executor-personas.yaml implementation_binding); wake.py validates route ids by pattern only.
  - A wake never carries a verdict, title, summary, count or PR-authored text (T4.2 c9); the verdict is read only from the persona-verdict/ check runs.
  - "docs/contracts/git-ops.yaml: only the sidecar's four blocks plus words-unchanged re-wraps; at or under 500 effective lines; docs/contracts/ports.yaml is not edited (rec-5249 carries the record)."
  - wake.py reads no branch name and no git-ops.yaml agent_branch_prefixes (operator card 2026-11-17), so it adds no consumer to that list's review trigger.
  - The same-head re-run key extension and its c1 wording belong to PLAN-persona-verdict-override (c6), not here.
  - No rescue agents or workaround loops (Decision 55); never skip or loosen a test to get green (Decision 235).
context:
  - "Decision-scout r2 NO_FLAGS on the written plan (Decisions triaged: 216 of 216; Roadmap items intersected: 4; CONFLICT: 0; RELATED: 3; Serves: NS.3 3/5). CITE: dec:76, dec:205, dec:229, dec:246; no CONTRADICT. Round 1 FLAGS_FOUND on the draft. Its one flag, a Decision 211 spirit note (a branch-prefix read is a repo-layout assumption an adopter may lack), is resolved: after critique r1 the wake reads no prefix list at all, and rec-5249 gains the wake's remaining assumptions (VP 10). Report: /mnt/project-files/persona-verdict-wake/SCOUT-r1.md."
  - "Design settled on a blind Fable consult (/mnt/project-files/persona-verdict-wake/advisor-brief/ADVICE.md): separate wake job, same-repo scope, no head re-check (cancel-in-progress plus the SHA in the body), bot comment not a label, fault wake keyed on run id and attempt, bot-only exact markers. Operator cards 2026-11-17: one comment per run with a marker per (head SHA, persona) pair; and (critique r1 B1: a prefix read would be the fourth consumer that git-ops.yaml agent_branch_prefixes_reversal trigger (c) reviews; second consult advisor-brief-prefix/ADVICE.md) wake allowlisted authors on any branch, so the wake is broader than the two prefix-scoped wakes until rec-4266's self-registration, which the build notes on rec-4266."
  - "Event class: rec-3335 (open, High) saw one github-actions[bot] comment fail to wake (n=1); rec-3866 saw native check_suite and check_run wakes (n=2, another repo). The CI-green, conflict and approval-run wakes are bot comments in daily use. Delivery is UNPROVEN here; T4.32 c3 proves it, and VP 7 adds one recorded observation, not a gate."
