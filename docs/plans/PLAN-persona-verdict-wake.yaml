schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "persona-verdict-wake"
intent: >-
  Add the verdict-landed wake to the persona verdict chain, plan 2 of the six PLAN-persona-verdict-* plans (T4.32 c1's
  WAKE leg): after the post job, a separate wake job posts one value-free comment per verdict run on an agent-branch PR,
  carrying one marker per (head SHA, persona) pair not yet marked, so a session subscribed to the PR wakes when its
  persona check runs land and never polls; a run that ends without posting every check run posts a value-free fault
  wake instead of leaving the PR silent. docs/contracts/git-ops.yaml wake_signals names it. This serves the North
  Star's verdict plane (NS.3): a verdict reaches a waiting session by a forge event, never by polling.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-persona-verdict-wake.yaml
phase: >-
  T4.32 (persona foundation), c1's WAKE leg. c1 stays open (backend, image and credential-use legs), and its "event
  class rec-3335 proves delivers" stays unproven until T4.32 c3's fixture run (PLAN-persona-verdict-fixture-run).
cites: [dec:76, dec:205, dec:229, dec:246]
fallback_reevaluation:
  reevaluated_on: "2026-11-17"
  substrate_status: CD.27 pending; executor substrate unratified; T4.2 not built; the T4.15 spike has not run.
  verdict: continue_on_current_substrate
  basis: >-
    The wake is a GitHub Actions job and a shell script that comments on a PR; it reads the same under every candidate
    layer-2 substrate and touches no CD.27, fallback_spec or T4.15 ruling (the PLAN-persona-verdict-chain disposition).
scope:
  - file: .github/workflows/persona-verdict.yml
    action: Modify
    purpose: >-
      Adds a fourth job, wake, after the three plan 1 builds; prepare, run and post are unchanged. wake: needs [prepare,
      post]; `if: ${{ !cancelled() }}` (a run cancelled by a newer push wakes nothing; the newer run wakes);
      runs-on ubuntu-latest; timeout-minutes 5; permissions exactly contents: read, actions: read, checks: read,
      pull-requests: write; no environment, no id-token, no secret but its GITHUB_TOKEN. Steps, in order and in plan 1's
      forms (the same SHA-pinned checkout, setup-python and download-artifact uses: as post, with their version
      comments): checkout main at github.sha into main/ (persist-credentials false); set up Python 3.12; `mkdir -p
      "$RUNNER_TEMP/work"` (id wake-mkdir); `pip install pyyaml -c "$GITHUB_WORKSPACE/main/requirements.txt"` (id
      wake-install); download
      persona-verdict-prepared into `${{ runner.temp }}/work/prepared` with continue-on-error: true (an absent artifact
      means no resolution, so the verb logs and exits 0); then the step named "Post wake" (id wake-post): `python3 -I
      "$GITHUB_WORKSPACE/main/scripts/personas/run.py" wake` with `working-directory: ${{ runner.temp }}/work` and env
      exactly GH_TOKEN `${{ github.token }}`, PERSONA_SNAPSHOT `${{ runner.temp }}/snapshot` and POST_RESULT `${{
      needs.post.result }}`. No continue-on-error on that step: a wake exception or a comment POST that fails after its
      retries reds the run (a shell fault, plan 1's rule), while every verdict outcome exits 0. pull-requests: write is
      held by this job alone; post keeps checks: write alone.
  - file: scripts/personas/wake.py
    action: Create
    purpose: >-
      The wake verb, main(argv), stdlib plus yaml, no persona id literal (plan 1's landing_dirs rule). (1) Reads the
      resolution and routes from work/prepared through the file names resolve_pr and route write (imported constants,
      never retyped); missing, unresolved or no routes -> logs `PERSONA-VERDICT wake skipped reason=<r>` and exits 0;
      a resolution whose allowlisted is false -> logs reason=author_not_allowlisted, posts neither a wake nor a fault
      comment, and exits 0 (so dependabot and non-maintainer PRs get no comment). (2) Reads
      workflow_run.head_repository.full_name from the event payload at $GITHUB_EVENT_PATH (a GitHub-set field, never
      pull_requests[] or an upload); a head repository other than $GITHUB_REPOSITORY -> skip. It reads no branch name
      and no branch-prefix list (operator card 2026-11-17: allowlisted authors on any branch, so the wake is not a
      consumer of git-ops.yaml agent_branch_prefixes). (3) Refuses to interpolate anything it has not validated: head_sha must be 40 lowercase hex and each
      route id must match ^[a-z][a-z0-9_]*(\.[a-z0-9_]+)?$ (a failing id is logged and dropped), so nothing can close
      the HTML comment. (4) Lists the check runs on head_sha (GET /repos/{repo}/commits/{sha}/check-runs, paginated,
      tried at most 3 times) and splits the routes into landed (a check run named persona-verdict/<route> exists, from
      any app, since the posting identity may move to a dedicated verdict App under rec-5241's plan; a same-named
      spoof can only cause a value-free wake) and unlanded; a listing that still fails after 3 tries treats every route
      as unlanded, so step (7) posts the fault wake and no wake marker (the run then exits non-zero only if that
      fault POST also fails). (5) Lists the
      PR's issue comments (paginated, per_page 100) and collects markers only from comments whose user.login is
      github-actions[bot] and user.type is Bot, matching each marker line exactly and whole; a listing failure after 3
      tries leaves the set empty (post anyway: a duplicate wake is cheap, a missed one strands a session). (6) For the
      landed routes whose marker `<!-- persona-verdict-wake:<head_sha>:<route_id> -->` is not in the set, posts ONE
      comment: one marker line per such route, then exactly `Persona verdict check runs are posted for <head_sha> (run
      <run_url>). Automated wake signal for a watching session; this comment carries no verdict - read the
      persona-verdict/ check runs on that head.` (7) When POST_RESULT is not success or any route is unlanded, posts
      one fault comment unless its marker exists: `<!-- persona-verdict-fault:<run_id>.<run_attempt> -->` then exactly
      `Persona verdict run <run_url> for <head_sha> ended without posting every check run. Automated wake signal for a
      watching session; this comment carries no verdict - read that run.` run_url is
      $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. (8) Every comment POST is tried at most 3
      times and re-lists the comments before each retry, posting only if the marker is still absent (the rec-3068
      duplicate). Nothing it posts or logs carries a conclusion, title, summary, count, author or any text read from
      the PR or a result file. Logs one line `PERSONA-VERDICT wake head_sha=<sha> new=<n> fault=<bool>`. The wake is
      idempotent per (head SHA, persona): a same-head re-run (PLAN-persona-verdict-override's c6 re-run) finds its
      markers and posts nothing; that plan owns extending the key.
  - file: scripts/personas/run.py
    action: Modify
    purpose: The verb table gains wake -> scripts.personas.wake.main; the sys.path guard and other verbs are unchanged.
  - file: scripts/checks/ci_guards/validate_persona_verdict_chain.py
    action: Modify
    purpose: >-
      Extends plan 1's rules to the wake job, as a tightening: the job set is exactly prepare, run, post and wake; wake's
      permissions are exactly contents: read, actions: read, checks: read and pull-requests: write, and pull-requests:
      write on any other job (or at workflow level) is refused; wake's needs is exactly [prepare, post] and its
      condition, after the existing unwrap and whitespace normalisation, exactly `!cancelled()`; its pip line is
      exactly pyyaml with the absolute constraint; it has the mkdir step before its python step; its one python step is
      the wake verb in plan 1's exact form with env keys exactly GH_TOKEN, PERSONA_SNAPSHOT and POST_RESULT and no
      continue-on-error; its download-artifact step names persona-verdict-prepared, path `${{ runner.temp
      }}/work/prepared` and continue-on-error: true; the wake verb in any job but wake, or any verb but wake in wake,
      is refused. The id-token, environment, secrets, SHA-pin, bare-variable and token-in-env rules already apply to
      every job and are kept. Reads YAML text only; imports nothing from scripts/personas/.
  - file: tests/checks/ci_guards/test_validate_persona_verdict_chain.py
    action: Modify
    purpose: >-
      One red fixture per new refused shape (wake missing, a fifth job, wake permissions widened or narrowed,
      pull-requests: write on post or at workflow level, needs or condition changed, extra env key, continue-on-error
      on the wake step, download without continue-on-error or into another path, wake verb in post, execute verb in
      wake, wake job with id-token or an environment); the live file stays green. Additive: no existing case changes.
  - file: tests/personas/test_wake.py
    action: Create
    purpose: >-
      Mirror test with a fake HTTP layer and a temp event payload: one comment with four markers for four landed
      probe routes; a second call with those markers present posts nothing; a marker in a comment by another author
      does not suppress; a marker that only prefixes a longer one does not count; an allowlisted author on a branch
      outside every agent prefix is woken; a not-allowlisted resolution, a fork head repository, an unresolved or empty
      resolution and an absent prepared artifact post nothing (no wake and no fault comment); wake.py reads no
      git-ops.yaml (asserted by an ast scan for the path and the open call); a comment-listing failure still posts; a check-run listing that fails 3 times posts the fault
      comment and no wake markers; POST_RESULT failure or one unlanded route posts the
      fault comment once (and not again for the same run id and attempt); a bad head_sha or route id is never
      interpolated; the wake and fault bodies equal the exact texts; no body contains success, failure, PROCEED,
      REVISE, BLOCK, NO_FLAGS or FLAGS_FOUND; a POST retry re-lists and does not duplicate; a final POST failure exits
      non-zero.
  - file: tests/personas/test_run.py
    action: Modify
    purpose: >-
      The verb-closure assertion gains wake (stdlib, scripts.* and yaml, which the wake job installs); the existing
      cases are unchanged.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      r3_workflows gains three entries at their measured counts, one per inline run body of the wake job, keyed by
      step id (Decision 162 R3, validate_composite_action_shell_bodies): `".github/workflows/persona-verdict.yml::wake::wake-mkdir": 1`,
      `".github/workflows/persona-verdict.yml::wake::wake-install": 1` and
      `".github/workflows/persona-verdict.yml::wake::wake-post": 1`. No marker (new entries at their exact counts, the
      PLAN-scheduled-workflow-dispatch precedent); re-measure each body at build and register its exact count.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Exactly the four blocks of docs/plans/approved/persona-verdict-wake.yaml (an amendment_log row, field_add,
      semantic_break false, so contract_version stays 16; coverage_note naming the signals without a count;
      merge_conflict's rec-3874 probe narrative cut to one clause; push_pr_ci_merge_flow.wake_signals.persona_verdict),
      plus a re-wrap of coverage_note, ci_green_comment, merge_conflict, cc_web_permission_gotcha and
      auto_merge_relationship to about 118 characters with words unchanged (the approved-text binding ignores wrapping;
      the yaml.safe_load value of every re-wrapped entry is unchanged). referenced_repo_paths is not edited (the row
      names persona-verdict.yml by basename). Measured 496 of 500 effective lines in the wording-check tree; re-measure
      at build.
bundled_recommendations: []
followon_recs: [rec-5272]
closes_criteria: []
infrastructure_dependencies:
  - >-
    None. No .tf file is in scope, no Lambda-packaged path (docs/contracts/git-ops.yaml and the workflow are not
    in any manifest's patterns), no Environment, no AWS role. The wake job takes effect on main at merge (workflow_run
    reads main's definition); VP 7 to VP 9 are its post-deploy proof.
acceptance_criteria:
  - "A fixture PR head whose diff touches only the four tests/fixtures/persona_verdict/fixture_pr/*.txt files gets, after its persona-verdict run, exactly one comment by github-actions[bot] carrying the four markers persona-verdict-wake:<head sha>:verdict_probe.<stem>, whose text names no conclusion."
  - "Re-running that persona-verdict run on the same head adds no wake comment (idempotent per head SHA and persona)."
  - "A PR whose diff routes nothing, or whose author the chain did not allowlist, gets no persona-verdict-wake comment; an allowlisted author is woken whatever the branch name (wake.py reads no branch-prefix list)."
  - "validate_persona_verdict_chain refuses each new wake-job shape (red fixtures) and is green on the live workflow; pull-requests: write sits on the wake job alone and checks: write on post alone."
  - "docs/contracts/git-ops.yaml differs from main by exactly the four approved sidecar blocks (approved_text verify OK), stays at or under 500 effective lines, and every re-wrapped wake_signals entry the sidecar does not edit parses to the same value."
  - "The build session's n=1 observation of which event woke it on the fixture PR is appended to rec-3335 (read back); delivery stays recorded as observed, not proven."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Wake verb and run.py verb table.
    command: bin/venv-python -m pytest tests/personas/test_wake.py tests/personas/test_run.py -q
    expected: All tests pass.
    expected_literals: [passed]
    fix_if: Any failure; fix the module, never the assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-wake-verb
  - step: 2
    phase: pre-deploy
    action: The workflow-shape check, its red fixtures and the live workflow with the wake job.
    command: bin/venv-python -m pytest tests/checks/ci_guards/test_validate_persona_verdict_chain.py -q && bin/venv-python -c "from scripts.checks.ci_guards.validate_persona_verdict_chain import validate_persona_verdict_chain as v; f=[]; v(f); print('FAILED', f) if f else print('CHAIN_SHAPE_OK')"
    expected: Tests pass and the live tree prints the ok marker.
    expected_literals: [passed, CHAIN_SHAPE_OK]
    fix_if: A refused shape passes or the live workflow fails; fix the workflow or the check, never loosen a rule.
    hermetic: true
    graduation: graduate
    graduation_check_id: persona-verdict-wake-shape
  - step: 3
    phase: pre-deploy
    action: The trigger-policy check still accepts the workflow pair with the new job.
    command: bin/venv-python -c "from scripts.checks.ci_guards.validate_persona_trigger_policy import validate_persona_trigger_policy as v; f=[]; v(f); print('FAILED', f) if f else print('TRIGGER_POLICY_OK')"
    expected: Prints the ok marker.
    expected_literals: [TRIGGER_POLICY_OK]
    fix_if: The policy check names persona-verdict.yml; fix the workflow, never the policy check.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the registered fast-tier check validate_persona_trigger_policy (scripts/checks/ci_guards/_manifest.py),
      which already runs on every PR touching the persona workflows.
  - step: 4
    phase: pre-deploy
    action: Approved git-ops.yaml text placed word-exactly, line budget held, re-wrapped entries unchanged in value.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug persona-verdict-wake --base origin/main &&
      bin/venv-python -c "import subprocess,yaml; from scripts.checks.structural._classify import effective_lines; t=open('docs/contracts/git-ops.yaml').read(); n=effective_lines(t); a=yaml.safe_load(subprocess.run(['git','show','origin/main:docs/contracts/git-ops.yaml'],capture_output=True,text=True).stdout)['push_pr_ci_merge_flow']['wake_signals']; b=yaml.safe_load(t)['push_pr_ci_merge_flow']['wake_signals']; assert n<=500, n; assert all(a[k]==b[k] for k in ('ci_green_comment','cc_web_permission_gotcha','auto_merge_relationship')); assert 'persona_verdict' in b; print('GITOPS_OK', n)"
    expected: Prints APPROVED-TEXT OK, then the ok marker with the line count.
    expected_literals: [APPROVED-TEXT OK, GITOPS_OK]
    fix_if: Any drift; re-place the blocks from the sidecar, never edit the sidecar; over 500 lines is a STOP to the plan owner.
    hermetic: true
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Fast tier on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Any failing check; fix the cause.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Full tier on the ready head (background, 2 h limit) and its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: verify-head reports ok for HEAD.
    fix_if: Any failure; fix and re-run from the start (handoff_policy).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      After merge, on the build session's own branch (restarted from main per git-ops.yaml; no new branch), commit one
      head that appends a newline to each of the four tests/fixtures/persona_verdict/fixture_pr/*.txt files and nothing
      else; that head needs one full-tier run and validation_result --verify-head before the push (plan 1's VP 8
      pattern). Push it, open one draft fixture PR, subscribe to it (mcp__claude-code-remote__subscribe_pr_activity)
      and end the turn. When woken, record which event woke the session first (its event name, e.g. issue_comment or
      check_run) and whether the wake comment produced a turn of its own.
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="persona-verdict.yml") for the concluded run whose prepare log carries `PERSONA-VERDICT
      head_sha=<the fixture head>`; mcp__github__get_job_logs for its wake job; mcp__github__pull_request_read(method="get_comments",
      owner="otl-labs", repo="ontheloop", pullNumber=<n>) and mcp__github__pull_request_read(method="get_check_runs", ...) on that head.
    expected: >-
      The four persona-verdict/verdict_probe.<stem> check runs exist on the head; exactly one comment by
      github-actions[bot] carries the four markers for that head, in the exact wake text, naming no conclusion; no
      fault comment; the wake job log shows `PERSONA-VERDICT wake head_sha=<head> new=4 fault=False`; the run concluded
      success.
    fix_if: >-
      No comment, a duplicate, a fault comment, or a conclusion in the body: close the fixture PR and send the defect
      to the plan owner. A 403 on the comment POST means pull-requests: write is not enough there: a plan defect.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: Idempotency on the same head, then no wake on a PR that routes nothing.
    command: >-
      mcp__github__actions_run_trigger(method="rerun_workflow_run", owner="otl-labs", repo="ontheloop", run_id=<VP 7's
      run>); after it concludes, mcp__github__pull_request_read(method="get_comments", ...) on the fixture PR and
      mcp__github__get_job_logs for the re-run's wake job; then, for the first non-fixture PR head pushed after the
      merge whose persona-verdict run has concluded, mcp__github__pull_request_read(method="get_comments", ...) on
      that PR; then mcp__github__update_pull_request(state="closed") for the fixture PR.
    expected: >-
      The re-run concluded success, its wake log shows new=0 fault=False, and the fixture PR still has exactly one
      wake comment; the real PR has no comment containing persona-verdict-wake; the fixture PR is closed.
    fix_if: A second wake comment on the same head, or a wake on a PR that routed nothing; a plan defect to the plan owner.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: rec-3335 carries the n=1 delivery observation (read-back of the execution step's update_rec).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; r=[x for x in make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-3335')][0]; assert 'PLAN-persona-verdict-wake' in r['context'] and r['status']=='open'; print('REC_3335_OBSERVED')"
    expected: Prints REC_3335_OBSERVED.
    fix_if: The update did not land; re-run update_rec, never edit a cache.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: rec-5249 names the wake's structural assumptions and rec-4266 names the wake (read-back of the execution step's update_rec calls).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; r=[x for x in make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-5249')][0]; assert 'PLAN-persona-verdict-wake' in r['context'] and 'github-actions[bot]' in r['context']; q=[x for x in make_reader(profile='agent_platform').named('recs_by_ids', ids='rec-4266')][0]; assert 'PLAN-persona-verdict-wake' in q['context']; print('REC_5249_EXTENDED')"
    expected: Prints REC_5249_EXTENDED.
    fix_if: The update did not land; re-run update_rec through the portal; a refusal is a STOP to the plan owner.
    hermetic: false
    graduation: not-applicable
