schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: plan-corpus-walkers-libyaml
intent: >-
  Clear the Critical CI-RCA hard block rec-4797 at root cause. The "crashed" xdist worker was pytest-timeout's 120 s
  thread-method kill: the test ran 119.3 s on main CI run 41204203615, and the bare "node down: Not properly terminated"
  line is that kill's own signature under xdist (reproduced locally). The test drives preflight main(), which walks the
  whole docs/plans corpus (658 plans, about 29 MB) twice through PyYAML's pure-Python SafeLoader, and three sibling plan-corpus
  tests reached 106-117 s of the same cap in the same run. Those plan parses move to the existing libyaml helper
  scripts.contract_rules.parse_yaml (about 13x faster, same output), the preflight pure-Python YAML byte budget grows to
  cover both preflight plan walkers, and each walker's loader is pinned by a test. No timeout raise, no skip, no xdist
  change.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-corpus-walkers-libyaml.yaml
phase: >-
  ci_rca (rec-4797, Critical, Track B product_regression; soft-warn category, no tier_item claimed, so the Tier Item
  Freshness Gate is skipped). Forward fix (Decision 73 cl.3, Decision 226) for the post-merge full tier of #1775
  (87bc3f56), a plan-only merge that grew the corpus past the cap on a slow runner. Claims, moves and closes no tier_item
  criterion.
scope:
- file: scripts/preflight/recs_cache.py
  action: Modify
  purpose: >-
    _landed_followon_rec_ids parses each plan that passes the followon_recs substring gate through
    scripts.contract_rules.parse_yaml instead of yaml.safe_load; the yaml.YAMLError catch and every gate stay. The
    docstring's "before yaml.safe_load ever runs" names the new seam.
  new_imports:
  - scripts.contract_rules
- file: scripts/platform_roadmap_state.py
  action: Modify
  purpose: >-
    compute_followon_state parses each plan that passes the closes_criteria substring gate through parse_yaml (already
    imported for load()); the now-unused `import yaml` goes. It adds no import, so the row carries no new_imports key
    (an explicit empty list tripped validate_scope_boundary's raw-versus-model_dump comparison, rec-3435).
- file: scripts/checks/roadmap/validate_tier_floor.py
  action: Modify
  purpose: >-
    validate_tier_floor parses each PLAN-*.yaml through parse_yaml instead of yaml.safe_load on an open file handle, and
    its now-unused `import yaml` goes; the judged set (schema_version 2 only), the examined() declaration and the
    messages are unchanged.
  new_imports:
  - scripts.contract_rules
- file: scripts/checks/roadmap/_manifest.py
  action: Modify
  purpose: >-
    The validate_tier_floor Entry's pre_globs gain "scripts/contract_rules.py" (validate_pre_glob_closure requires it once
    the check imports contract_rules; #1755 added the same glob to validate_plan_documents).
- file: tests/checks/roadmap/test__manifest.py
  action: Modify
  purpose: >-
    _CLOSURE_INPUTS["validate_tier_floor"] gains "scripts/contract_rules.py", so TestClosureMembersAreCovered pins the
    new glob directly (a member falling out of coverage reddens its row).
- file: tests/platform_roadmap_state/test_state_dict_and_feeds.py
  action: Modify
  purpose: >-
    The two yaml.safe_load spies (_install_safe_load_outcome_spy and
    TestKeylessPlanSkipsYamlParse.test_plan_without_the_key_is_never_yaml_parsed) become one module-level `_spy`
    helper on prs.parse_yaml (rec-3234), keeping the raised and returned-non-dict outcome assertions (rec-4374's ask).
    Adds TestComputeFollowonState::test_plan_corpus_parses_with_libyaml (rec-4374's acceptance node): a keyed tmp plan
    is parsed by the C loader with zero pure-Python constructions (tests/fixtures/yaml_parse_spy.py).
- file: tests/session/preflight/test_recs_cache_adhoc_lane.py
  action: Modify
  purpose: >-
    test_plan_never_naming_the_key_is_never_parsed guards scripts.preflight.recs_cache.parse_yaml (the old
    yaml.safe_load target would pass vacuously after the change). Adds
    TestAdHocLaneDerivations::test_keyed_plan_parses_through_libyaml (spy: one libyaml construction under
    preflight/recs_cache.py:_landed_followon_rec_ids, zero pure-Python).
- file: tests/checks/roadmap/test_validate_tier_floor.py
  action: Modify
  purpose: >-
    Adds TestTierFloorLoader::test_plans_parse_through_libyaml: with _tier_floor_module.lambda_manifest.load_all stubbed
    to {} (this file's existing precedent in TestValidateTierFloor -- the nine src/lambdas manifests are parsed in pure
    Python by scripts/lambda_manifest.py:53, outside this plan) and the yaml parse spy installed only after the fixture
    plans are written (this file's _copy_as_plan and _write_plan helpers parse templates in pure Python), every tmp
    schema_version 2 plan is parsed by the C loader under checks/roadmap/validate_tier_floor.py:validate_tier_floor, and
    no pure-Python construction carries that frame.
- file: tests/session/preflight/test_yaml_parse_budget.py
  action: Modify
  purpose: >-
    Adds TestPlanCorpusWalkerBudget::test_plan_walkers_stay_under_budget: the REAL compute_state_dict (not the
    live_state_dict memo) and the REAL _landed_followon_rec_ids over the live tree, under the yaml parse spy, parse at
    most PURE_PYTHON_YAML_BUDGET bytes in pure Python and show both walker frames among the libyaml frames. Both real
    functions are bound at module import, before the package conftest's autouse stubs. The existing node's docstring
    drops its "rec-4374's cost to fix" carve-out and points at the new node.
- file: tests/test_vp_literals.py
  action: Modify
  purpose: >-
    TestV4CorpusInvariance._v4_and_below_steps parses each plan with yaml.CSafeLoader (the loader
    test_validate_tier_floor.py's own counting loop already uses); the set-wise assertion is unchanged.
