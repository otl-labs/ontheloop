- >-
  Source swap: compute_followon_state calls parse_yaml(text) where it called yaml.safe_load(text) and the unused
  `import yaml` goes; _landed_followon_rec_ids gets the same swap through a module-level `from scripts.contract_rules
  import parse_yaml` (keep `import yaml` for yaml.YAMLError) and its docstring names the new seam; validate_tier_floor
  reads data = parse_yaml(path.read_text(encoding="utf-8")) and drops its now-unused `import yaml`;
