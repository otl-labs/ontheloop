acceptance_criteria:
- compute_followon_state, _landed_followon_rec_ids and validate_tier_floor parse plan documents only through
  scripts.contract_rules.parse_yaml; no yaml.safe_load call remains in those three functions.
- On the live tree, the two preflight plan walkers parse at most 512 KB of YAML in pure Python (today about 13 MB and
  15 MB, measured with tests/fixtures/yaml_parse_spy.py).
- Every docs/plans/PLAN-*.yaml parses to the same document under the C loader and the pure-Python loader, so the three
  walkers' outputs are unchanged.
- rec-4797's node and the three sibling plan-corpus tests each finish inside a 10 s pytest timeout without xdist
  (14-16 s each before the change, measured).
- The two re-pointed spies keep their raised and returned-non-dict outcome assertions, and exactly one `def _spy(`
  remains in tests/platform_roadmap_state/test_state_dict_and_feeds.py.
- No pytest --timeout value, xdist setting, skip or xfail changes and no SLOC budget raise; no check Entry is added or
  removed -- only validate_tier_floor's pre_globs gain scripts/contract_rules.py.
- Before merge, rec-4797's context_v2_json carries the corrected proximate_cause, why_chain, corrective_action and
  preventive_action (execution step 5), its acceptance carries --timeout 10, and closure_artifact
  pytest:tests/session/preflight/test_yaml_parse_budget.py::TestPlanCorpusWalkerBudget::test_plan_walkers_stay_under_budget
  (Decision 186), and all four bundled acceptances hold under the trailer probe's isolation (Decision 201).
- rec-4797, rec-4374, rec-4575 and rec-3234 close through the squash commit's Resolves trailer.
