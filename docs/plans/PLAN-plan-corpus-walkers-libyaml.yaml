rollback: >-
  Revert the squash commit; the loaders return identical data (VP step 5), so a revert only restores the slower parse. On
  a revert or an abandoned PR, correct rec-4797's closure_artifact (status-preserving correct_rec_context with a stated
  reason, Decision 186 pt 8) so it names no node absent on main, and restore its filed acceptance with a
  status-preserving update_rec (the filed text is in the rec's history); the narrative and preventive_action corrections
  are factual and stay, and rec-4811, rec-4812 and rec-4813 stay open.
