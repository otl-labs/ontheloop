constraints:
- No pytest --timeout raise, skip, xfail, quarantine or xdist change (Decision 235 -- weakening verification is
  human-gated; the timeout is the detector, not the defect).
- Keep both substring gates; build no index or cache over docs/plans/ (rec-4006 corrections 3 and design constraints).
- Never patch beneath compute_state_dict around a live-path call while the live_state_dict memo may be cold
  (tests/fixtures/platform_roadmap_state.py warning); the budget node calls the real function directly.
- No SLOC budget raise, no new check module, no registry entry other than the three graduated shards.
- No rescue agents or workaround loops (Decision 55); a corpus plan that libyaml parses differently stops the build.
