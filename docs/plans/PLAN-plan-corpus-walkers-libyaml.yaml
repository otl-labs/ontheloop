  Measure SLOC of every scope file against main at build time (tests/platform_roadmap_state/test_state_dict_and_feeds.py
  had 30 lines of headroom at planning time); over 500 stops the build for a plan amendment.
- Execute Verification Plan steps 1-8 -- loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
- |-
  Before merge (status-preserving warehouse writes, Decision 186 / Decision 201 / Decision 226), two calls:
  (a) bin/venv-python -m scripts.ops_data_portal --update-rec rec-4797 --acceptance "bin/venv-python -m pytest tests/test_session_preflight_cache_serving.py::TestPhaseBAbsenceOfReaderCalls::test_main_phase_b_makes_no_reader_calls -p no:xdist --timeout 10 -q"
  (strengthening only: the filed form has no timeout and passes before the fix).
  (b) scripts.ops_portal.ci_rca_lifecycle.correct_rec_context("rec-4797", <the mapping below, verbatim>,
  row_updates={"title": "pytest-timeout killed an xdist worker in test_main_phase_b_makes_no_reader_calls (pure-Python plan-corpus parse)"},
  profile="agent_platform"). escape_mode, escape_class and detection_gap's gate and escape_mode
  fields stay as filed (only its gap_explanation narrative changes): they are the verified bundle's escape attribution
  that Decision 186's closure predicate and the Decision 226 cl.5 class key read, and rec-4811 owns making that
  classifier right. The mapping was checked against _validate_ci_rca_context_v2 at planning time (no errors).
  {
    "proximate_cause": "pytest-timeout's 120 s thread-method kill (log header 'timeout: 120.0s / timeout method: thread') ended tests/test_session_preflight_cache_serving.py::TestPhaseBAbsenceOfReaderCalls::test_main_phase_b_makes_no_reader_calls after 119.3 s on main-validate of run 41204203615; under xdist that kill prints only '[gw2] node down: Not properly terminated' and 'worker crashed', with no stack dump.",
    "why_chain": [
      "The full-tier pytest run failed because xdist worker gw2 died while running the node: it started at 13:14:55.22 and gw2 went down at 13:16:54.50, 119.3 s against the 120 s --timeout.",
      "pytest-timeout's thread method calls os._exit at the cap while pytest's fd capture holds stderr, so the Timeout banner and stack dump are lost and xdist reports a crashed worker (reproduced locally with -n 2 --timeout 3).",
      "The node drives preflight main(), which walks the whole docs/plans corpus twice with PyYAML's pure-Python SafeLoader (_landed_followon_rec_ids and compute_followon_state): about 15 s on CC-web, 82-119 s under CI -n auto with coverage.",
      "Systemic gap: no gate bounded the pure-Python YAML the plan-corpus walkers parse, so their runtime grew with every plan merge until a slow runner crossed the tier's 120 s cap (scripts/platform_roadmap_state.py:116, scripts/preflight/recs_cache.py:53)."
    ],
    "corrective_action": "Move the plan-corpus parses in compute_followon_state, recs_cache._landed_followon_rec_ids and validate_tier_floor to scripts.contract_rules.parse_yaml (libyaml, about 13x faster with identical results); no timeout raise, skip or xdist change.",
    "preventive_action": "Corrected by PLAN-plan-corpus-walkers-libyaml: the red was pytest-timeout's 120 s thread-method kill of a test whose preflight main() parsed the whole plan corpus with the pure-Python YAML loader, not a worker crash. Preventive: tests/session/preflight/test_yaml_parse_budget.py::TestPlanCorpusWalkerBudget bounds the pure-Python YAML both preflight plan walkers parse over the live tree at 512 KB, and per-walker loader pins fail if compute_followon_state, _landed_followon_rec_ids or validate_tier_floor return to the pure-Python loader. Class follow-ons: rec-4811 (CI-RCA timeout-kill label), rec-4812 (per-test timeout headroom gauge), rec-4813 (write-time plan checks).",
    "closure_artifact": "pytest:tests/session/preflight/test_yaml_parse_budget.py::TestPlanCorpusWalkerBudget::test_plan_walkers_stay_under_budget",
    "detection_gap": {
      "earliest_viable_gate": "presubmit",
      "actual_gate_that_caught_it": "CI",
      "gap_explanation": "No gate bounded the pure-Python YAML the plan-corpus walkers parse and nothing reads per-test durations against the 120 s cap, so corpus growth from plan-only merges, which the --pre diff-aware selection never maps to this node, reached main unseen until a slow runner crossed the cap (scripts/platform_roadmap_state.py:116). escape_mode and escape_class stay as filed; rec-4811 owns the classifier.",
      "escape_mode": "tier_misplaced"
    }
  }
  Then run VP step 9.
- >-
  Code review via a fresh code-review subagent; fix blocking findings and rerun the pre-deploy steps. Every candidate
  validate_weakening_candidates lists over the diff gets a weakening_dispositions entry (permitted plan bookkeeping): the
  spy re-points as planned-change citing acceptance_criteria[4]; any other as refactor citing the file.py::name where
  the same or stronger check now lives.
- >-
  Commit Flow per the implement skill: flip this plan's implementation_declared to true and carry "Resolves: rec-4797,
  rec-4374, rec-4575, rec-3234" as its own paragraph in a branch commit's message (validate_merge_step checks both);
  rebase; VP step 10 started backgrounded with a 2 h limit from the top-level session (a subagent never receives the
  completion), its verdict --verify-head, never a pipe's exit status; push, PR, subscribe. Closure evidence, recorded as
  four SEPARATE facts: GitHub readiness state (bin/venv-python -m scripts.session.github_readiness; unknown is never
  PASS); parent validator evidence (VP step 10 on the committed, rebased, clean tree, --verify-head attesting the pushed
  HEAD); structured postflight evidence (bin/venv-python -m scripts.session.postflight --evidence <file>); the real
  outcome -- CI green by event-driven wake (never polled), code review PROCEED, then write the squash message (with the
