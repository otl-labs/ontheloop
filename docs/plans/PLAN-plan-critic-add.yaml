- file: tests/checks/ci_guards/test_validate_persona_verdict_chain_keyed_sequence.py
  action: Create
  purpose: >-
    keyed-sequence runs only in keyed jobs, and the live workflow passes the chain check. New file because
    test_validate_persona_verdict_chain.py is 496 of 500; graduated shards persona-verdict-chain-shape and
    persona-verdict-wake-shape stay on that file, unchanged.
- file: tests/fixtures/persona_verdict/plan_input/
  action: Create
  purpose: >-
    Synthetic head snapshot: one plan (schema_version 7, two scope files, one absent), its approved-text sidecar, one scope file
