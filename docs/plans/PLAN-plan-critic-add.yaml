    block a later real run on that head), summary naming the lane read and both fingerprints, no input or findings line. The
    fallback marker follows the routes the fallback ran: those with an outage marker results/outage-<route>.json in the
    primary results, or every route when the fallback ran with none (the drill). Only a route in that set with no fallback
    result is marked " (fallback role: no result)"; a route whose primary verdict stands keeps its unmarked title. 427 of 500
    SLOC: the body builder and the outage-set reader go in a small helper; a crossing is decomposed, never raised.
- file: .github/workflows/persona-verdict.yml
  action: Modify
  purpose: >-
    The run and run-fallback "Run the fixture persona" steps call python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py"
    keyed-sequence (one line each, replacing the pipeline); the run job gains output outage_routes; the run-fallback persona
    step gains env PERSONA_OUTAGE_ROUTES from needs.run.outputs.outage_routes; both results uploads gain if: always(), so a
    second route's failure keeps the first route's result. Time: the scout's 1200 s and the critic's 1800 s budgets sum to
    3000 s inside the run job's 75-minute timeout-minutes; the launcher's own 3600 s per-run bound means a hung scout plus a
    full critic can pass 75 minutes, and the job timeout then cancels the critic (the first route's result survives through
    if: always()); acceptable for an advisory check, and rec-5762 measures real wall-clock. timeout-minutes is unchanged. Net +4
    effective lines (489 of 500 today, measured at build against
    main after rec-5749 and any sibling that lands first); over 500 is a STOP to the plan owner, never a raise.
