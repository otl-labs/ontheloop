  Operator 2026-11-28 15:16 UTC ("yes to all, write the plan"): the Decision 235 entry approval for exactly two keyed widenings,
  (a) plan_critic keyed on the trigger upstream (merge_checks.TRIGGER_KEYED_PERSONAS) and (b) the ordered pair decision_scout
  then plan_critic run in sequence in the one keyed run job; the fallback re-runs only the routes whose primary had an outage;
  the read_tree opt-in is rec-5761, next. Smoke and refusal stay fixture-only; main's definition and code, the Environment,
  OIDC, the egress floor and the launcher are unchanged (Decision 205 cl.1-2, Decision 263).
- >-
  Operator 2026-11-28 15:14 UTC: the critic always follows the scout and a planner redraft, never back to back on a fresh
  scout result. The in-job sequence serves only the advisory window, where both lanes sample a head the in-session scout and
  critique already passed and nobody acts on either Actions result.
- 'The check is advisory: gates.plan_critic.verdict_source stays in_session; no gate reads the check.'
- 'Head content is data: parse YAML as data or read as text, never import, exec, install or run it.'
- No persona contract change (rec-5761); no spend mechanism (rec-5707); no extra parallel job; no change to egress_launcher.py.
