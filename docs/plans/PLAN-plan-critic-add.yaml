  command: bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-plan-critic-add.yaml | grep 'persona-verdict.yml'
  expected: a headroom line for .github/workflows/persona-verdict.yml whose effective-line count is at most 500
  fix_if: over 500 or NEAR_CAP with headroom below 0 is a STOP to the plan owner (decompose; never raise)
