    workflow body ratchet pass with the widened run.
  command: >-
    bin/venv-python -m pytest tests/personas/test_materialise.py tests/personas/test_route.py tests/personas/test_run.py
    tests/personas/test_keyed_run.py tests/personas/test_execute.py tests/personas/test_rescout.py tests/personas/test_post_verdict.py
    tests/personas/test_wake.py tests/test_session_merge_checks.py tests/checks/ci_guards/test__persona_verdict_keyed.py
