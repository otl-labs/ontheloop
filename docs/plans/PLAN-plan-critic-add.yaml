  expected: >-
    Full tier passes and --verify-head confirms it for the head. Start it as a harness-tracked background run (Bash
    run_in_background, timeout 7200000) from the top-level session with HOME set to an empty directory.
  fix_if: a failure in scope is fixed; one outside scope is a STOP to the plan owner; never loosen a check (Decision 235)
  hermetic: false
  graduation: waive
  graduation_waiver_reason: is the full tier itself
- step: 7
  phase: post-deploy
  action: >-
    The squash commit carries Resolves: rec-5750, and merge_step readback's recs_by_ids leg reads it (it reads
    bundled_recommendations).
  command: bin/venv-python -m scripts.session.merge_step readback --slug plan-critic-add --sha <merge_sha>
  expected: readback OK naming rec-5750, then (after ci.yml's closure job) its status leg reads closed
  fix_if: 'MISSING: follow merge_step recover'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a per-merge read-back, not a repository property
- step: 8
  phase: post-deploy
  action: >-
    Live read-back: on the first ready plan PR from an allow-listed author after merge (the build opens a ready plan-only PR
    from the operator's account carrying a fixture plan under docs/plans/ whose last decision-scout row matches, if none arrives
    within a day, and closes it unmerged after), read the head's check runs and that head's persona-verdict run. A session
    without gh makes the same reads through mcp__github__ (pull_request_read get_check_runs, actions_list) and applies the same
    comparison.
  command: >-
    gh api repos/otl-labs/ontheloop/commits/<head_sha>/check-runs | jq -r '.check_runs[] | select(.name|startswith("persona-verdict/"))
    | [.name, .app.id, .conclusion, .output.title] | @tsv'
  expected: >-
    rows for persona-verdict/decision_scout and persona-verdict/plan_critic, both from <gates.verdict_app.app_id>; the critic's
    title starts 'verdict ' (its scout row matched) and the run's log shows both routes run in the one run job, decision_scout
    first; record the run id, the prepare job's duration and the critic's turns and wall-clock seconds for rec-5762
  fix_if: >-
    no plan_critic row, a title other than 'verdict ' on a matching head, or only one route run: read the persona-verdict run for
    that head and STOP to the plan owner with its run id and the check title
