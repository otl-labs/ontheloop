constraints:
- >-
  Operator 2026-11-28 15:16 UTC ("yes to all, write the plan"): the Decision 235 entry approval for exactly two keyed widenings,
  (a) plan_critic keyed on the trigger upstream (merge_checks.TRIGGER_KEYED_PERSONAS) and (b) the ordered pair decision_scout
  then plan_critic run in sequence in the one keyed run job; the fallback re-runs only the routes whose primary had an outage;
  the read_tree opt-in is rec-5761, next. Smoke and refusal stay fixture-only; main's definition and code, the Environment,
  OIDC, the egress floor and the launcher are unchanged (Decision 205 cl.1-2, Decision 263).
- >-
  Operator 2026-11-28 15:14 UTC: the critic always follows the scout and a planner redraft, never back to back on a fresh
  scout result. The in-job sequence serves only the advisory window, where both lanes sample a head the in-session scout and
  critique already passed and nobody acts on either Actions result.
- 'The check is advisory: gates.plan_critic.verdict_source stays in_session; no gate reads the check.'
- 'Head content is data: parse YAML as data or read as text, never import, exec, install or run it.'
- No persona contract change (rec-5761); no spend mechanism (rec-5707); no extra parallel job; no change to egress_launcher.py.
- >-
  Security code: the keyed job, its sequencer and its guard change, so the build brings the operator the final diff for his word
  before merge (coordinator standing_authorisation: hook and other security code).
context:
- 'Graduated shards kept unchanged: merge-checks-persona-functions, merge-checks-verdict-app-pin and merge-checks-verdicts (tests/test_session_merge_checks.py nodes this plan does not edit) and persona-verdict-scout-carry-units (tests/personas/test_wake.py; the new no-wake node is added beside its nodes, none removed or renamed).'
- 'Graduated shards also kept unchanged: persona-record-telemetry-first and persona-verdict-fallback-run-units (their test_execute.py, test_post_verdict.py and test_route.py nodes are not edited; the no-outage-marker case keeps every route in the fallback set, so test_fallback_result_wins_and_is_named holds) and reviewer-read-tree-wording-contract (test_verdict_persona_contracts.py).'
- >-
  Decision-scout r2 NO_FLAGS (r1 FLAGS_FOUND: T4.29 c1 'fails' vs a neutral conclusion, fixed to failure; dec:162 added). CITE
  162, 205, 224, 229, 235, 263, 264, 271. Decisions triaged: 240 of 240. Roadmap items intersected: 8; CONFLICT: 0; RELATED: 6.
  Serves: NS.8 4/5. Related: 262 (barrier comparison reused), 288 (single extractor), 280 (no slots yet), 166/128 (size).
- >-
  Depends on rec-5749 (PLAN-decision-scout-add, merged as #2561, squash c2adbe6a; its build not yet merged):
  merge_checks.TRIGGER_KEYED_PERSONAS, the generic trigger-upstream kill switch
  and one-verdict-per-head skip, the decision_scout provider and the shared route.py, materialise.py, executor-personas.yaml and
  project-configuration.yaml edits. Build only after it merges; rebase and re-read those files first.
- >-
  T4.29 c2 prerequisites: rec-4433 and rec-4416 closed; rec-4028 superseded by its 3a/3b split (operator ruling 2026-11-17).
  rec-4434 (per-finding rows) gates rec-5762, not this add.
- >-
  Blind consults: /mnt/project-files/plan-critic-add/advisor-brief/ADVICE.md (slicing, coupling, kill switch) and
  advisor-brief-2/ADVICE.md (two routes on one head: sequence in one job via a run.py verb; launcher untouched).
  advisor-brief-3/ADVICE.md (critique r1 B1): each run in a keyed job takes its run number as the gha retry ordinal, as
  telemetry-event-envelope.yaml LL-1 and telemetry_agents.yaml already define; no grammar, contract or job change. A keyed job
  can now hold more than one telemetry sidecar and rows file (results/telemetry-<route>.json), which the rec-5551 send reads.
- >-
  Why two routes: rec-5749's scout routes on every plan PR's first ready head (no prior Actions record), and the critic routes
  there too, so without the sequence neither would run. Under the actions scout lane the coupling blocks the critic whenever the
  scout routes, so the pair only occurs while the scout's verdict_source reads in_session.
- >-
  Fingerprint basis: the coupling computes over main's tree (rescout.fingerprints), so a head whose cited Decision text changed
  on main reads re-scout required even when pr-validate passes on the PR tree; that matches Decision 288's merge refusal.
- >-
  Volume: plan-class personas also route on a code PR that revises its plan, and a quick second push cancels the earlier run
  (concurrency on branch and upstream path); both acceptable for an advisory check. Budget stays provisional until T4.29 c3
  (plan_critic.yaml budget.provisional); VP 8 records the first figures for rec-5762.
- >-
  Unbuilt plans sharing files: PLAN-agent-proxy-signed-access (project-configuration.yaml); PLAN-bootstrap-ci-gated-apply,
  PLAN-bootstrap-trusted-pr-plan, PLAN-environment-gates-fail-closed, PLAN-merge-annotate-producer
  (composite_action_body_baseline.yaml); PLAN-loop-candidate-decisions (ROADMAP-PLATFORM.yaml). Whichever builds second rebases.
  Sibling planners rec-5710 and rec-5551 may also edit persona-verdict.yml; VP 5 measures the cap at build.
