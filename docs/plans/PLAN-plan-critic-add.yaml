schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: plan-critic-add
intent: >-
  Switch the plan_critic verdict persona on as an advisory GitHub check on ready plan PR heads (T4.29 c1 and c3 ADD; rec-5750),
  the first step in moving plan critiques, the project's largest usage cost, off in-session subagents: a provider builds the 13
  contract inputs from the head snapshot (data only) and main, plan_critic is marked implemented and named in the trigger-keyed
  set, a head whose scout lane has no verdict for its fingerprint gets an advisory "re-scout required" check with no model call
  (so the critic always follows a scout and the planner's redraft), and when decision_scout and plan_critic both route on one
  head the one keyed run job runs them in sequence, scout first. The check gates nothing while gates.plan_critic.verdict_source
  reads in_session; a project-configuration row switches the runs off.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-plan-critic-add.yaml
phase: >-
  T4.29 (plan_critic persona) c1 CRITIQUE TRIGGER and c3 ADD, step 1 of 3 (rec-5761 read_tree wording and rec-5762 dual-run
  follow). Work ahead on T4.29 (not_started; depends on T4.32, in_progress), allowed because nothing closes, as for the
  sibling scout add (rec-5749): neither criterion is closed here, and the live
  read-back is recorded for the plan that closes them.
closes_criteria: []
cites:
- dec:162
- dec:205
- dec:224
- dec:229
- dec:235
- dec:263
- dec:264
- dec:271
amends: []
introduces: []
scope:
- file: scripts/personas/plan_input.py
  action: Create
  purpose: >-
    The plan_critic provider: sets materialise.PROVIDERS["plan_critic"] on import, as review_input.py does, and is imported
    by the new bottom-of-file line in materialise.py (rec-5731's explicit registry instead, if it lands first). Pure: no network, no token;
    head files read only as bytes through snapshot.read_bytes and parsed as YAML data, never imported or run; every rule
    document read at ctx base_root (main). Fields beyond the shared three: approved_text (docs/plans/approved/<slug>.yaml at
    head, or empty); approved_text_record (approved_text's record output for that sidecar - its digest=, approved= and
    fingerprint= lines - computed with main's scripts.roadmap.approved_text over the head sidecar text, or empty with no
    sidecar); scope_files (each plan scope file at head after a header line naming it; a path absent at head, a directory or
    not UTF-8 gets the header plus one line naming why; an unclean path token is skipped); project_context
    (docs/PROJECT_CONTEXT.md), north_star (docs/contracts/north-star.yaml) and decisions (docs/DECISIONS.md), all at base_root;
    roadmap_items (YAML: the tier items whose id the plan's phase or context names, plus the items scope_projection matches on
    the scope paths, projected with scope_projection.PROJECTED_FIELDS from base_root's roadmap); plan_obligations (main's
    plan_obligations.build_report over the plan's path inside the snapshot with data_root set to the snapshot root, as
    plan_critic.yaml requires: "run by main's scripts over the head-tree snapshot"; headroom, companions and the approved-text
    sidecar's decision drafts come from head data, the rule contracts from main);
    affected_artifacts (JSON: lambda_manifest.compute_affected_artifacts over the scope paths, each artifact with its manifest
    status, or the literal {} as a one-line JSON value); governance_contracts (YAML at base_root: deploy-paths.yaml
    admin_out_of_band, decision-entry.yaml significance.routing, significance.routing_rule and
    metadata_envelope.field_shapes.serves.verification, decision-kind.yaml test and own_clauses). A missing plan raises
    Unusable(input_incomplete); more than one plan keeps shared_fields' input_unusable. Imports stay within {yaml, pydantic}
    (test_run.py's closure node).
- file: scripts/personas/critique_coupling.py
  action: Create
  purpose: >-
    The re-scout coupling, kept out of route.py (330 of 500 SLOC, shared with rec-5749). decide(routes_doc, resolution,
    inputs, main_root) -> (routes, blocked): runs only when plan_critic is routed; reads
    merge_checks.verdict_sources(main's project-configuration) for decision_scout. The critic is kept only when the selected
    lane holds a scout verdict for this head's scout inputs that is not BLOCK; every other case blocks it. in_session: the head
    plan's last decision-scout gate_rounds row (_plan_rescout_barrier._last_scout over the PlanDocument parsed from the head text
    as data) against the fingerprint rescout.fingerprints computes for that plan and sidecar over main_root with cites=[] (the
    barrier's own projection, _plan_rescout_barrier.py:80-84), compared through _plan_rescout_barrier._compare (imported, never
    re-derived; Decision 288 cl.2's single extractor); a matching row whose verdict is BLOCK also blocks (the barrier's
    Decision 262 rule in _plan_findings, reason scout_block). actions: kept only when routes_doc carried holds a decision_scout
    entry (an earlier head's Actions verdict whose scout inputs this head did not change) whose verdict is not BLOCK, so at
    least one push, the planner's redraft, sits between that scout run and the critic (operator 2026-11-28 15:14 UTC). It
    blocks when decision_scout routes on this head (reason scout_routed), when rec-5749's one-verdict-per-head skip dropped the
    scout because it already ran on this same head (scout_same_head), when gates.decision_scout.advisory_runs is disabled or
    unreadable (scout_disabled), when the carried verdict is BLOCK (scout_block), or with no carried entry (no_scout). A blocked
    plan_critic leaves routes and enters a rescout_blocked list with {route, lane, reason, scout_fingerprint,
    head_fingerprint}; any unreadable input or fingerprint error blocks with reason unreadable (nothing runs on doubt).
