- file: scripts/personas/keyed_sequence.py
  action: Create
  purpose: >-
    The keyed-sequence run.py verb for the run and run-fallback persona steps. Reads prepared/routes.json, orders routes by a
    fixed list (decision_scout, then plan_critic; any single route as is), and per route spawns persona-request | sudo
    /usr/bin/python3 -I -S /usr/local/lib/persona-egress/egress_launcher.py run | persona-record as three child processes
    joined by OS pipes it never reads (the key stays pipe-only, Decision 263's 2026-11-24 Update), with PERSONA_ROUTE set to
    that route and PERSONA_RUN_ORDINAL to its run number in the children's environment: the k-th route the sequencer starts in
    this job gets k (a lone critic is 1; the pair is scout 1, critic 2; numbering restarts in run-fallback), so each run has its
    own telemetry identity, as telemetry-event-envelope.yaml LL-1 already requires ("a second persona run in one job is a new
    session"). A route that never reaches the model still takes its number. Each route's results and telemetry files
    (results/<route>.json, results/telemetry-<route>.json) are written before the next route starts. In the run-fallback job
    it runs only the routes named in PERSONA_OUTAGE_ROUTES, a space-separated list: any token that is not a route in
    routes.json, a duplicate, or a malformed token refuses with no route run and exit 1; an empty list runs every route, which
    only the fallback_drill dispatch reaches (the job's condition: a real outage always writes a non-empty list). It writes
    primary_outage (any route) and outage_routes (space-separated, validated route ids) to GITHUB_OUTPUT once, in the run job
    only, and an outage marker results/outage-<route>.json per outage route. Exit status: non-zero when any route's record
    exited non-zero, after every route ran. The launcher is unchanged and still serves one request per invocation.
- file: scripts/personas/keyed_run.py
  action: Modify
  purpose: >-
    prepared_request and _record take the route from PERSONA_ROUTE when it is set and names a member of routes.json; set to
    an empty string, an unlisted id or a malformed token, they refuse (exit 1, no request); unset, they keep today's
    exactly-one-route refusal and behaviour. sidecar_bytes and run_ref take retry_ordinal from PERSONA_RUN_ORDINAL through one
    shared helper (both variables unset keeps 1, so current behaviour and nodes are unchanged; digits 1 to 999 required; one
    variable set without the other, or a malformed ordinal, takes the existing invalid-run-facts path: no run_ref, telemetry
    DEFERRED). No contract, renderer (src/turn_capture/host_run.py) or grammar change: the gha ref's retry ordinal is already
    the per-run segment. record writes no GITHUB_OUTPUT line when PERSONA_ROUTE is set (keyed_sequence writes the outputs
    once) and returns the outage flag to its caller through the marker file results/outage-<route>.json. 469 of 500 SLOC
    today (about +8): if the change crosses 500, move the selector helpers into keyed_sequence.py rather than raise.
- file: scripts/personas/run.py
  action: Modify
  purpose: VERBS gains "keyed-sequence" -> "keyed_sequence".
- file: scripts/personas/post_verdict.py
  action: Modify
