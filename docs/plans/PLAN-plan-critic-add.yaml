schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: plan-critic-add
intent: >-
  Switch the plan_critic verdict persona on as an advisory GitHub check on ready plan PR heads (T4.29 c1 and c3 ADD; rec-5750),
  the first step in moving plan critiques, the project's largest usage cost, off in-session subagents: a provider builds the 13
  contract inputs from the head snapshot (data only) and main, plan_critic is marked implemented and named in the trigger-keyed
  set, a head whose scout lane has no verdict for its fingerprint gets an advisory "re-scout required" check with no model call
  (so the critic always follows a scout and the planner's redraft), and when decision_scout and plan_critic both route on one
  head the one keyed run job runs them in sequence, scout first. The check gates nothing while gates.plan_critic.verdict_source
  reads in_session; a project-configuration row switches the runs off.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-plan-critic-add.yaml
phase: >-
  T4.29 (plan_critic persona) c1 CRITIQUE TRIGGER and c3 ADD, step 1 of 3 (rec-5761 read_tree wording and rec-5762 dual-run
  follow). Neither criterion is closed here: T4.29 cannot start before T4.32 completes, and the live read-back is recorded for
  the plan that closes them.
closes_criteria: []
cites:
- dec:162
- dec:205
- dec:224
- dec:229
- dec:235
- dec:263
- dec:264
- dec:271
amends: []
introduces: []
scope:
- file: scripts/personas/plan_input.py
  action: Create
  purpose: >-
    The plan_critic provider, registered through the registration form main has after rec-5749 (today a PROVIDERS entry made
    on import, as review_input.py does; rec-5731's explicit registry if rec-5749 bundles it). Pure: no network, no token;
    head files read only as bytes through snapshot.read_bytes and parsed as YAML data, never imported or run; every rule
    document read at ctx base_root (main). Fields beyond the shared three: approved_text (docs/plans/approved/<slug>.yaml at
    head, or empty); approved_text_record (approved_text's record output for that sidecar - its digest=, approved= and
    fingerprint= lines - computed with main's scripts.roadmap.approved_text over the head sidecar text, or empty with no
    sidecar); scope_files (each plan scope file at head after a header line naming it; a path absent at head, a directory or
    not UTF-8 gets the header plus one line naming why; an unclean path token is skipped); project_context
    (docs/PROJECT_CONTEXT.md), north_star (docs/contracts/north-star.yaml) and decisions (docs/DECISIONS.md), all at base_root;
    roadmap_items (YAML: the tier items whose id the plan's phase or context names, plus the items scope_projection matches on
    the scope paths, projected with scope_projection.PROJECTED_FIELDS from base_root's roadmap); plan_obligations
    (plan_obligations.build_report over the head plan text written to a temporary file, rules and headroom read at main);
    affected_artifacts (JSON: lambda_manifest.compute_affected_artifacts over the scope paths, each artifact with its manifest
    status, or the literal {} as a one-line JSON value); governance_contracts (YAML at base_root: deploy-paths.yaml
    admin_out_of_band, decision-entry.yaml significance.routing, significance.routing_rule and
    metadata_envelope.field_shapes.serves.verification, decision-kind.yaml test and own_clauses). A missing plan raises
    Unusable(input_incomplete); more than one plan keeps shared_fields' input_unusable. Imports stay within {yaml, pydantic}
    (test_run.py's closure node).
- file: scripts/personas/critique_coupling.py
  action: Create
  purpose: >-
    The re-scout coupling, kept out of route.py (330 of 500 SLOC, shared with rec-5749). decide(routes_doc, resolution,
    inputs, main_root) -> (routes, blocked): runs only when plan_critic is routed; reads
    merge_checks.verdict_sources(main's project-configuration) for decision_scout. in_session: the head plan's last
    decision-scout gate_rounds row (_plan_rescout_barrier._last_scout over the PlanDocument parsed from the head text as data)
    against the fingerprint rescout.fingerprints computes for that plan and sidecar over main_root, compared through
    _plan_rescout_barrier._compare (imported, never re-derived; Decision 288 cl.2's single extractor). actions:
    rescout.rescout_required(routes_doc), so any head where decision_scout routes blocks plan_critic (operator 2026-11-28 15:14
    UTC: the critic always follows the scout and a planner redraft). A blocked plan_critic leaves routes and enters a
    rescout_blocked list with {route, lane, reason, scout_fingerprint, head_fingerprint}; any unreadable input or fingerprint
    error blocks with reason unreadable (nothing runs on doubt).
- file: scripts/personas/route.py
  action: Modify
  purpose: >-
    main() calls critique_coupling.decide after rescout.decide and writes rescout_blocked into routes.json; is_keyed accepts one
    trigger-upstream route in merge_checks.TRIGGER_KEYED_PERSONAS (rec-5749's rule, unchanged), and also exactly the ordered
    pair [decision_scout, plan_critic] on the trigger upstream with both in that set; every other two-route form stays false.
    The kill switch and the one-verdict-per-head skip are rec-5749's generic trigger-upstream ones, reused unchanged. Names no
    new persona-id literal beyond the pair rule's reading of merge_checks.
- file: scripts/session/merge_checks.py
  action: Modify
  purpose: >-
    TRIGGER_KEYED_PERSONAS (added by rec-5749 as frozenset({"decision_scout"})) gains plan_critic: the named keyed widening the
    operator approved 2026-11-28 15:16 UTC (Decision 235 entry approval), never a class-wide rule.
- file: scripts/personas/keyed_sequence.py
  action: Create
  purpose: >-
    The keyed-sequence run.py verb for the run and run-fallback persona steps. Reads prepared/routes.json, orders routes by a
    fixed list (decision_scout, then plan_critic; any single route as is), and per route spawns persona-request | sudo
    /usr/bin/python3 -I -S /usr/local/lib/persona-egress/egress_launcher.py run | persona-record as three child processes
    joined by OS pipes it never reads (the key stays pipe-only, Decision 263's 2026-11-24 Update), with PERSONA_ROUTE set to
    that route in the children's environment. Each route's results file is written before the next route starts. In the
    run-fallback job it runs only the routes named in PERSONA_OUTAGE_ROUTES (validated against routes.json; empty with
    fallback_drill runs every route). It writes primary_outage (any route) and outage_routes (space-separated, validated
    route ids) to GITHUB_OUTPUT once, in the run job only. Exit status: non-zero when any route's record exited non-zero,
    after every route ran. The launcher is unchanged and still serves one request per invocation.
- file: scripts/personas/keyed_run.py
  action: Modify
  purpose: >-
    prepared_request and _record take the route from PERSONA_ROUTE when it is set and names a member of routes.json; unset,
    they keep today's exactly-one-route refusal and behaviour. record writes no GITHUB_OUTPUT line when PERSONA_ROUTE is set
    (keyed_sequence writes the outputs once) and returns the outage flag to its caller through a results-side marker file
    results/outage-<route>.json. 469 of 500 SLOC today: if the change crosses 500, move the selector helpers into
    keyed_sequence.py rather than raise.
- file: scripts/personas/run.py
  action: Modify
  purpose: VERBS gains "keyed-sequence" -> "keyed_sequence".
- file: scripts/personas/post_verdict.py
  action: Modify
  purpose: >-
    plan_all appends one body per routes_doc rescout_blocked entry (allow-listed authors only): name persona-verdict/<route>,
    conclusion failure (T4.29 c1 "fails with re-scout required"; advisory while gates.<route>.verdict_source reads in_session,
    Decision 264 cl.4), title "re-scout required" (never starting "verdict ", so rec-5749's one-verdict-per-head skip does not
    block a later real run on that head), summary naming the lane read and both fingerprints, no input or findings line.
    427 of 500 SLOC: the body builder goes in a small helper; a crossing is decomposed, never raised.
- file: .github/workflows/persona-verdict.yml
  action: Modify
  purpose: >-
    The run and run-fallback "Run the fixture persona" steps call python3 -I "$GITHUB_WORKSPACE/main/scripts/personas/run.py"
    keyed-sequence (one line each, replacing the pipeline); the run job gains output outage_routes; the run-fallback persona
    step gains env PERSONA_OUTAGE_ROUTES from needs.run.outputs.outage_routes; both results uploads gain if: always(), so a
    second route's failure keeps the first route's result. Net +4 effective lines (489 of 500 today, measured at build against
    main after rec-5749 and any sibling that lands first); over 500 is a STOP to the plan owner, never a raise.
- file: config/composite_action_body_baseline.yaml
  action: Modify
  purpose: The R3 entries for the two changed persona-step bodies, at their measured counts (a decrease needs no marker; a rise needs Decision 162 cl.3's raise-approved marker and is a STOP to the plan owner).
- file: scripts/checks/ci_guards/_persona_verdict_keyed.py
  action: Modify
  purpose: >-
    PERSONA becomes the keyed-sequence line and LITERAL_VERBS maps it to persona-run, so _run_job_rules' verb list is unchanged;
    the canonical run and run-fallback step lists give both uploads if: always(); the run job's outputs pin adds outage_routes;
    the fallback persona step's env pin adds PERSONA_OUTAGE_ROUTES. The guard still refuses every other step form, the old
    pipeline included.
- file: scripts/checks/ci_guards/_persona_verdict_fallback.py
  action: Modify
  purpose: want_outputs gains outage_routes; only the run and run-fallback jobs may name it.
- file: scripts/checks/ci_guards/validate_persona_verdict_chain.py
  action: Modify
  purpose: VERBS gains keyed-sequence, allowed only in the keyed run and run-fallback jobs. 463 of 500 SLOC.
- file: docs/contracts/executor-personas.yaml
  action: Modify
  purpose: >-
    plan_critic implementation: {status: implemented, location: scripts/personas/plan_input.py}; one amendment_log row
    {semantic_break: false, change_class: field_add} naming it.
- file: docs/contracts/project-configuration.yaml
  action: Modify
  purpose: >-
    A new row gates.plan_critic.advisory_runs (kind project, values enabled|disabled as quoted strings, defaults.local and
    defaults.cloud both enabled, reader scripts/personas/route.py through rec-5749's generic gate, basis this plan); one
    amendment_log row {semantic_break: false, change_class: field_add}. No other line changes.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    T4.29 decomposition_hints.atomic_plans and rationale only: PLAN-plan-critic-add (c1 and c3, rec-5750), the read_tree
    wording plan (rec-5761), the dual-run plan (c4, rec-5762), then the flip and remove lines as they stand. No criterion text
    or status changes (bookkeeping, Decision 279's notice class).
- file: tests/personas/test_plan_input.py
  action: Create
  purpose: >-
    test_plan_critic_input_has_every_contract_field (the built input validates against plan_critic.yaml's input_schema with
