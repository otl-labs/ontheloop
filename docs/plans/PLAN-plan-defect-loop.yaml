schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-defect-loop"
intent: >-
  Close the loop between a stuck build and the plan that caused it, without the operator relaying messages: before
  approval, the planner places the always-ask wording in a scratch copy of main and runs the fast tier there (the
  wording check, recorded as a gate row the plan-PR check and the critic read, never re-run); during a build, a plan
  defect parks the build and sends one fixed-shape plan-defect report to the coordinator, which routes it to the
  plan's owning planning session; that session lands a re-critiqued plan-text-only amendment under the operator's
  standing direction, except approved wording, contract text and loosened assertions, which still go to the operator
  (Decision 229 cl.2, Decision 235). Removes the operator as message relay and catches pinned-wording breakage before
  approval (operator rulings 2026-10-30).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-defect-loop.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Project Review joint
  review area B (BUILD-SEAMS row B, widened). Builds after PLAN-plan-lint (same plan PR) and after the
  prose-budget-ratchet build. Routing inside the coordinator is plan H's (operator chose "Split B and H", 2026-10-30).
closes_criteria: []
scope:
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Exactly the sidecar: new Step 8b (plan lint, wording check, live-assumption probes, owner named in the handoff),
      Amendment mode, the generator-touched and VP touched-set sentences (rec-3834, rec-3603), the Step 4 "Size headroom
      (Decisions 128, 166)" bullet, the template's optional new_imports line; paid for by compacting the speculative-plan,
      complexity-freeze, deploy-channel and report-critique sections (every rule kept). 43,483 -> 43,350 B (dry build).
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Exactly the sidecar: 5b reads the lint report and the last wording-check row (never re-runs it); 12n becomes the
      size headroom check for every file type, a planned change's projected growth included. 18,663 -> 18,660 B (dry build).
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Exactly the sidecar: the interactive-era alarm is STOP plus one plan-defect report (deviation_trigger.escalation);
      branches (b) and (c), the 3-attempt STOP and the nondeterminism STOP point at it. 34,890 -> 34,887 B (dry build).
  - file: docs/contracts/implement-scope-boundary.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar: deviation_trigger.escalation (the plan-defect report, routing and standing direction);
      amendment_procedure names the prohibited_field_edits case and the commit subject (rec-3965); the ineligibility
      clause records the preflight frozen_report_key test and config/structural_size_budgets.yaml as plan-time
      declarations (rec-3545, rec-3586); one new amendment_log entry; four old entries compacted to pointers
      (contracts relief valve). 499 -> 485 effective lines on main 91b84e55 (after the prose-ratchet build, #1773).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the sidecar's decisions-1 block: one dated Update note after Decision 229's Related line (operator ruling
      2026-10-31): a plan amendment a build's plan-defect report raises that fixes a scope companion, VP text or a
      repeated failure is approved and merged under the operator's standing direction; approved wording, contract or
      Decision text and any loosened assertion still need the operator. Decision 229 grows 6,137 -> about 6,753 B;
      validate_decisions_size's amendment-delta leg warns and never fails on an existing entry (rec-3243). The
      docs/decisions-index.json projection is unchanged by this note (measured); if it changes, the
      decisions_index_regeneration sanction row covers the regeneration. rec-autoclose.yml backfills ops_decisions on
      the merge push.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Lower the planning, plan-critique and implement entries to their measured sizes after the edit (the ratchet only
      goes down; implement-scope-boundary.yaml prose_budgets_ratchet_down). No raise, no marker added.
  - file: scripts/roadmap/plan_wording_check.py
    action: Create
    purpose: >-
      CLI `--slug S --tree T [--sidecar P]` and run(slug, tree, sidecar_path, runner) -> Result. The sidecar defaults
      to docs/plans/approved/<slug>.yaml in this checkout. Checks, in order, each a FAIL with its reason: T's HEAD is an
      ancestor of origin/main (base = that SHA); T's changes against HEAD (git status, ignoring a .venv link) are the
      sidecar's files plus at most three companions (config/prose_budgets.yaml, config/structural_size_budgets.yaml,
      docs/decisions-index.json); scripts.roadmap.approved_text.verify(sidecar, T, base) is empty. Then it settles the
      companions as the build commits them, by line-level edits that keep every inline comment and marker: in either
      budget file a changed line is kept only when it carries a `# raise-approved: dec-NNN` marker (a planned raise the
      planner placed, judged in --pre by validate_prose_budget_raises or validate_structural_size_budget_raises), and
      every other changed line is restored to HEAD; then config/prose_budgets.yaml entries covering a sidecar file (its
      S2/S4/S8 path key, or S1's when the file is a root load-set member) are lowered to the size T measures
      (scripts.preflight.prose_context.measure_prose_context run in a subprocess with cwd T), never raised (the build's
      sanctioned prose_budgets_ratchet_down edit); docs/decisions-index.json is restored to HEAD and, when
      docs/DECISIONS.md is a sidecar file, rewritten by `scripts.decisions_index --write` in T
      (decisions_index_regeneration). Then it deletes any T/logs/debug/selection-manifest.json, links this checkout's
      .venv into T when absent and runs `bin/venv-python -m scripts.validate --pre` with cwd T (the injectable runner;
      timeout 900 s is a FAIL), and reads the new manifest: selection complete only when its sha equals base and it
      shows no fallback, capped false and no deferred test, else degraded (absent manifest = degraded). Prints `WORDING-CHECK verdict=PASS|FAIL digest=<sha256>
      base=<sha> selection=<status>`, echoes the runner's last failing lines, and prints the gate_rounds row to paste;
      a FAIL before the fast tier runs prints its reason and no row. Exit 0 only on PASS. Writes no repository file
      outside T (a local --pre budget breach may still file its own rec, scripts/checks/_budget_recs.py, as any local
      run does).
  - file: scripts/roadmap/plan_gate_rounds.py
    action: Create
    purpose: >-
      GateRound and _GATE_VERDICTS move here unchanged (relief: plan_document.py is at 485 SLOC), then gain the
      wording-check gate: verdict PASS | FAIL; required digest (64 hex), base (40 hex) and selection (complete |
      degraded) on wording-check rows, forbidden on the other gates; blocking and nits stay 0 on wording-check rows.
      Counts and run facts only, never an approval input (Decision 87 as amended by 205).
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      Imports GateRound and _GATE_VERDICTS (which _validate_gate_rounds iterates) from plan_gate_rounds and re-exports
      GateRound (facade; existing importers unchanged); the 1..N
      numbering rule covers every gate, wording-check included. About 489 (after PLAN-plan-lint's new_imports) -> 463
      SLOC.
  - file: scripts/checks/roadmap/validate_plan_documents.py
    action: Modify
    purpose: >-
      _wording_check_gaps: a schema_version >= 5 plan whose docs/plans/approved/<slug>.yaml the diff adds or changes
      (approved_text.sidecar_state against the merge base: added | changed, so an Amendment-mode PR that changes a
      sidecar needs a fresh run, and a build PR, which never changes it, needs none) needs a last wording-check row with verdict PASS, selection complete and digest equal to approved_text.digest of that
      sidecar. Routed exactly like _gate_round_gaps: FAIL on the plan PR, WARN locally and on the push to main
      (Decision 163). When no merge base resolves, it prints one WARN and requires nothing (never a fallback ref that
      would read every sidecar as added). About 162 -> 190 SLOC.
  - file: tests/test_plan_decision_projection.py
    action: Create
    purpose: >-
      rec-4731's node test_overflowing_annotation_is_reported_before_approval: a tmp git repo with a DECISIONS.md, a
      cap test on one entry, and a sidecar whose annotation overflows it, placed in a scratch worktree; run() with a
      runner that runs the fixture's pytest reports FAIL naming the cap test. A second test,
      test_decisions_edit_selects_the_entry_cap_reader, asserts the live selector
      (scripts.checks.deps.affected_tests.derive_affected_tests) selects
      tests/checks/decisions/test_telemetry_production_catalog_decision.py for a docs/DECISIONS.md modification.
  - file: tests/test_plan_wording_check.py
    action: Create
    purpose: >-
      The module's mapped test home (validate_test_coverage measures 100% from this file alone): each FAIL reason (HEAD
      not on main, an edit outside the sidecar, a verify mismatch, runner non-zero, runner timeout, a git error),
      selection degraded on a fallback manifest and on an absent one, the .venv link created only when absent, the
      echoed runner lines, the printed row, the CLI's exit codes, PASS exit 0; the companion step (a shrunk sidecar
      file's budget entry lowered in T, a grown one left unraised, an unmarked budget change reset, a marked raise kept
      in either budget file, inline comments and markers such as plan-critique's dec-75 surviving the edit, the
      decisions index rewritten only when DECISIONS.md is a sidecar file); a stale manifest deleted before the run, and
      a manifest whose sha differs from base, capped or with deferred tests read as degraded.
  - file: tests/test_plan_gate_rounds.py
    action: Create
    purpose: >-
      The mapped test home of plan_gate_rounds.py (100% coverage from this file alone): every GateRound rule, the
      moved ones and the wording-check fields (required on wording-check, forbidden on the other gates, verdict set,
      blocking and nits 0).
  - file: tests/roadmap/plan_document/test_gate_rounds.py
    action: Modify
    purpose: >-
      PlanDocument level only: wording-check rows numbered 1..N like every gate; GateRound still importable from
      plan_document.
  - file: tests/checks/roadmap/test_validate_plan_documents.py
    action: Modify
    purpose: >-
      TestWordingCheckRecord: fail on the plan PR (no row, last row FAIL, degraded, digest mismatch), warn elsewhere,
      no requirement without a sidecar or with an unchanged one, a changed sidecar on an existing plan needs a fresh
      PASS row, an unresolved merge base warns once and requires nothing. 362 SLOC + about 75.
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: >-
      Pins: Step 8b and Amendment mode clauses; critique 5b reads the recorded row and never re-runs it; 12n covers
      every file type; the implement alarm points at deviation_trigger.escalation. Shards naming this file are kept:
      deleted-writer-caller-disposition, followon-half-filing-step-pinned, no-live-pointer-to-retired-git-ops-section.
  - file: tests/test_scope_boundary_contract.py
    action: Modify
    purpose: >-
      Pins: escalation's report fields, routing via the coordinator, standing direction and its always-ask exceptions;
      the prohibited_field_edits case and commit subject; the two plan-time declarations. Shards naming this file are
      kept: code-review-weakening-dispositions, followon-half-filing-step-pinned,
      scope-boundary-prose-surfaces-carry-the-rule, scope-boundary-weakening-surfacing-shape.
implementation_declared: true
weakening_dispositions:
  - candidate: "[test-removed] tests/roadmap/plan_document/test_gate_rounds.py::test_gate_is_one_of_the_two_plan_gates"
    disposition: refactor
    cite: "tests/test_plan_gate_rounds.py::test_gate_is_one_of_the_known_gates"
  - candidate: "[test-removed] tests/roadmap/plan_document/test_gate_rounds.py::test_escalation_choice_is_the_five_choice_menu"
    disposition: refactor
    cite: "tests/test_plan_gate_rounds.py::test_escalation_choice_is_the_five_choice_menu"
bundled_recommendations: [rec-4731, rec-3965, rec-3545, rec-3586, rec-3603, rec-3834]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The five governed files carry exactly the approved sidecar text (validate_merge_step's approved-text binding passes
    on the implement PR); each skill is no larger than on main and its budget equals its measured size; the scope
    contract stays <= 500 effective lines. VP steps 5 and 6.
  - >-
    plan_wording_check reports FAIL for a placed annotation that overflows a reader's cap, for an edit outside the
    sidecar, for a verify mismatch and for a red fast tier, and prints the digest, base and selection status of every
    run that reaches the fast tier (rec-4731). VP steps 1 and 2.
  - >-
    A gate_rounds wording-check row carries digest, base and selection; validate_plan_documents fails a plan whose
    sidecar the PR adds or changes unless the last wording-check row is PASS, selection complete and matching the
    sidecar's digest, and warns elsewhere. VP step 3.
  - >-
    The planning, plan-critique and implement skills and the scope contract carry the alarm, routing, amendment mode
    and plan-time declarations; the antidrift and contract pins hold them. VP step 4.
  - Every bundled rec's own acceptance command exits 0 (VP step 5), and each is closed after merge (VP step 9).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-4731's node (one selector, so the graduated registry row holds one node).
    command: >-
      bin/venv-python -m pytest -q
      tests/test_plan_decision_projection.py::test_overflowing_annotation_is_reported_before_approval
    expected: exit 0; one test passes. Red before (module absent on main).
    fix_if: Fix the tool, never the assertion.
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: graduate
    graduation_check_id: wording-check-reports-overflowing-annotation
  - step: 2
    phase: pre-deploy
    action: The wording-check tool, the gate row model and the live selector check.
    command: >-
      bin/venv-python -m pytest -q tests/test_plan_wording_check.py tests/test_plan_gate_rounds.py
      tests/roadmap/plan_document/test_gate_rounds.py
      tests/test_plan_decision_projection.py::test_decisions_edit_selects_the_entry_cap_reader
    expected: exit 0; every test passes and none fails (the count is not pinned).
    fix_if: Fix the tool, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: Ordinary unit tests selected by the --pre affected set; a registry row would duplicate them.
  - step: 3
    phase: pre-deploy
    action: The plan-PR requirement (each test sets GITHUB_EVENT_NAME itself, like TestGateRoundRecord).
    command: bin/venv-python -m pytest -q "tests/checks/roadmap/test_validate_plan_documents.py::TestWordingCheckRecord"
    expected: exit 0; every test passes. Red before (class absent on main).
    fix_if: Fix the model or validator, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: wording-check-row-required-on-plan-pr
  - step: 4
    phase: pre-deploy
    action: Clause pins on the skills and the scope contract, whole files.
    command: >-
      bin/venv-python -m pytest -q tests/test_workflow_skill_antidrift.py tests/test_scope_boundary_contract.py
      tests/checks/verification/validate_scope_boundary tests/test_prose_context.py tests/checks/prose
    expected: exit 0; every test passes.
    fix_if: >-
      A pin fails: the surface differs from the sidecar; restore the approved text. Never edit a pin to match drifted
      text.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: Whole-file re-run of suites the --pre affected set selects for these scope files.
  - step: 5
    phase: pre-deploy
    action: The bundled recs' acceptance commands.
    command: >-
      bin/venv-python -m pytest -q
      tests/test_plan_decision_projection.py::test_overflowing_annotation_is_reported_before_approval &&
      grep -qE "every test and (registered )?check that reads" .claude/skills/planning/SKILL.md &&
      grep -rq 'scope amendment' .claude/skills/implement/SKILL.md docs/contracts/implement-scope-boundary.yaml &&
      grep -rq 'two-act' .claude/skills/implement/SKILL.md docs/contracts/implement-scope-boundary.yaml &&
      grep -q frozen_report_key docs/contracts/implement-scope-boundary.yaml &&
      grep -q test_session_preflight_decomposition.py docs/contracts/implement-scope-boundary.yaml &&
      grep -q 'structural_size_budgets' docs/contracts/implement-scope-boundary.yaml &&
      grep -q 'sanction_rows' docs/contracts/implement-scope-boundary.yaml &&
      grep -q "sanction_rows" .claude/skills/planning/SKILL.md &&
      grep -qi "graduation shard\|graduated_registry_shard" .claude/skills/planning/SKILL.md &&
      grep -q "sanction_rows-covered" .claude/skills/planning/SKILL.md &&
      grep -c "generator-touched" .claude/skills/planning/SKILL.md | grep -qv "^0$" && echo ACCEPTANCE-OK
    expected: exit 0; prints ACCEPTANCE-OK.
    fix_if: A grep that misses means the surface differs from the sidecar; restore the approved text.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: The rec acceptances themselves; the trailer job re-runs them at merge.
  - step: 6
    phase: pre-deploy
    action: Approved text, sizes and the fast tier.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug plan-defect-loop &&
      bin/venv-python -m scripts.validate --pre
    expected: >-
      exit 0; prints "APPROVED-TEXT OK" and "All checks passed." (validate_prose_limits, validate_sloc_limits,
      validate_structural_size_limits and validate_scope_boundary among them).
    fix_if: >-
      A prose entry not equal to its measured size: lower it to the size the message prints. An approved-text mismatch:
      restore the sidecar text. A Python size crossing: apply the scope row's relief. The scope contract crossing 500
      (its text is fixed approved text): STOP and raise the alarm, defect class approved_text. Never raise a budget.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Lint and format on the changed Python files.
    command: >-
      bin/venv-python -m ruff check scripts/roadmap scripts/checks/roadmap/validate_plan_documents.py
      tests/test_plan_decision_projection.py tests/test_plan_wording_check.py tests/test_plan_gate_rounds.py tests/roadmap
      tests/checks/roadmap/test_validate_plan_documents.py tests/test_workflow_skill_antidrift.py
      tests/test_scope_boundary_contract.py && bin/venv-python -m ruff format --check scripts/roadmap
      scripts/checks/roadmap/validate_plan_documents.py tests/test_plan_decision_projection.py
      tests/test_plan_wording_check.py tests/test_plan_gate_rounds.py tests/roadmap
      tests/checks/roadmap/test_validate_plan_documents.py tests/test_workflow_skill_antidrift.py
      tests/test_scope_boundary_contract.py
    expected: exit 0.
    fix_if: Run ruff format and fix lint.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Discharge the handoff obligation with a full-tier run to completion.
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test, relax an assertion or add a baseline. A failure
      outside scope becomes a rec via scripts.ops_data_portal (Decisions 55, 59).
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: Confirm the six bundled recs are closed (the squash-merge Resolves trailer closes them).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      ids=['rec-4731','rec-3965','rec-3545','rec-3586','rec-3603','rec-3834'];
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ids); print(sorted((x['id'], x['status']) for x in r), m)"
    expected: Prints all six with status closed and an empty missing list.
    fix_if: Any still open - read the ci.yml closure job log and close it with update_rec (Decision 84 I-4).
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/roadmap/plan_wording_check.py
    behavior: A placed annotation that overflows a reader's cap is reported FAIL before approval.
    verification_step: 1
    test_selector: tests/test_plan_decision_projection.py::test_overflowing_annotation_is_reported_before_approval
    red_green_expectation: red before (module absent on main), green after.
  - source: scripts/roadmap/plan_wording_check.py
    behavior: Companions in T keep only marked raises, then budgets are lowered (never raised) and the decisions index rewritten.
    verification_step: 2
    test_selector: tests/test_plan_wording_check.py
    red_green_expectation: red before (module absent on main), green after.
  - source: scripts/roadmap/plan_wording_check.py
    behavior: Each refusal reason, the selection status and the printed row.
    verification_step: 2
    test_selector: tests/test_plan_wording_check.py
    red_green_expectation: red before (module absent on main), green after.
  - source: scripts/roadmap/plan_gate_rounds.py
    behavior: wording-check rows carry digest, base and selection; other gates refuse them.
    verification_step: 2
    test_selector: tests/test_plan_gate_rounds.py
    red_green_expectation: red before (gate enum refuses wording-check on main), green after.
  - source: scripts/roadmap/plan_document.py
    behavior: GateRound stays importable from plan_document; numbering covers every gate.
    verification_step: 2
    test_selector: tests/roadmap/plan_document/test_gate_rounds.py
    red_green_expectation: red before (no wording-check numbering on main), green after.
  - source: scripts/checks/roadmap/validate_plan_documents.py
    behavior: A plan whose sidecar the PR adds or changes needs a matching PASS wording-check row; a warning elsewhere.
    verification_step: 3
    test_selector: tests/checks/roadmap/test_validate_plan_documents.py::TestWordingCheckRecord
    red_green_expectation: red before (no such check on main), green after.
  - source: .claude/skills/planning/SKILL.md
    behavior: Step 8b and Amendment mode clauses.
    verification_step: 4
    test_selector: tests/test_workflow_skill_antidrift.py
    red_green_expectation: red before (no Step 8b on main), green after.
  - source: .claude/skills/plan-critique/SKILL.md
    behavior: 5b reads the recorded wording-check row and never re-runs it; 12n covers every file type.
    verification_step: 4
    test_selector: tests/test_workflow_skill_antidrift.py
    red_green_expectation: red before, green after.
  - source: .claude/skills/implement/SKILL.md
    behavior: The alarm is STOP plus one plan-defect report.
    verification_step: 4
    test_selector: tests/test_workflow_skill_antidrift.py
    red_green_expectation: red before ("stop-and-surface-to-human" on main), green after.
  - source: docs/contracts/implement-scope-boundary.yaml
    behavior: escalation fields, routing, standing direction and its exceptions; the prohibited_field_edits case.
    verification_step: 4
    test_selector: tests/test_scope_boundary_contract.py
    red_green_expectation: red before (no escalation key on main), green after.
  - source: config/prose_budgets.yaml
    behavior: Each changed skill's entry equals its measured size.
    verification_step: 6
    command: bin/venv-python -m scripts.validate --pre
    red_green_expectation: red before (entries above measured once the skills shrink), green after.
constraints:
  - >-
    The skill, contract and Decision text is the operator-approved sidecar docs/plans/approved/plan-defect-loop.yaml
    (digest a0cbc7b98f3081ff70821b6fa5e0dd208034597cb9860cb1c60001bd1d20ea30): apply it verbatim; any other wording goes back to
    the operator before merge.
  - >-
    The wording check is a local, planner-run rehearsal of the build's own fast tier on the approved words only; its
    result travels as a recorded row that the plan-PR check and the critic read and never re-run. Nothing new runs in
    CI (TAP; git-ops.yaml source_admission; Decision 226).
  - >-
    A build never lands its own plan amendment (Decisions 229, 235); the report goes to the coordinator, which routes it
    to the owning planning session. Approved wording, contract text and any loosened assertion still need the operator
    (Decision 229's Update note records the standing direction for the rest).
  - No prose budget is raised; each changed skill's entry is lowered to its measured size (Decision 127, rec-4779).
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Origin: Project Review joint review area B (BUILD-SEAMS row B, widened). Operator rulings 2026-10-30: 21:30Z no throwaway builds; 21:36Z lint plus wording check, and automate the build-to-planning alarm so the operator is not a relay; 21:37Z 'Split B and H' (routing in plan H; coordinator adopts it as practice now)."
