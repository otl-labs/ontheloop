pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Rebase onto origin/main. Confirm PLAN-plan-lint and PLAN-prose-budget-ratchet both carry implementation_declared
    true; if either does not, STOP and raise the alarm (this build must not land first).
  - >-
    Apply docs/plans/approved/plan-defect-loop.yaml to the five governed files verbatim, filling `{{DATE}}` with the
    merge date, then run bin/venv-python -m scripts.decisions_index --write; confirm with bin/venv-python -m scripts.roadmap.approved_text verify --slug plan-defect-loop. A block
    whose `before` no longer occurs once in the base is an approved_text defect: STOP and raise the alarm.
  - >-
    Write the tests first (scope rows above) and record their red output on main in the PR body; then
    plan_gate_rounds, plan_document's re-export, plan_wording_check and validate_plan_documents.
  - Lower the three skill entries in config/prose_budgets.yaml to the measured sizes VP step 6 prints.
  - >-
    Run VP steps 1-8; loop until pass; on an unrecoverable failure stop and raise the alarm per the implement skill
    (Decision 55).
  - >-
    Closure evidence and merge per the implement skill Commit Flow: full tier plus validation_result --verify-head,
    postflight evidence, PR, CI green by event-driven wake, code review PROCEED. The branch commit carries
    "Resolves: rec-4731, rec-3965, rec-3545, rec-3586, rec-3603, rec-3834" (git-ops.yaml resolves_trailer TRANSPORT);
    squash with merge_step premerge before and readback after. The skill and contract text is always-ask, approved
    verbatim through the sidecar; merge under the standing build rule only if validate_merge_step's binding passes.
  - 'Report: what was implemented, verification results, measured sizes, the closure facts.'
rollback: >-
  Revert the PR. Plans merged meanwhile that carry wording-check rows would be refused by the reverted GateRound
  (extra="forbid"): the revert strips those rows in the same PR.
