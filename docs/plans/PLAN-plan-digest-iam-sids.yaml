schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-digest-iam-sids"
intent: >-
  Make the names-only merge-time plan-review digest reviewable for IAM narrowing. The first live run of the values-stripped
  reviewer (apply run 40590294289 for #1687) returned REVISE because the digest showed two role policies as changed=[policy]
  with no delta (the digest diffs action tokens only, and #1687 removes Sids and narrows Resource) and two CI role policies as
  policy=(known after apply) with no reason (deferred data reads). Render IAM policy changes per Sid as element counts, and
  annotate deferred reads, without printing any Terraform value. Executes rec-4675. rec-4674 (ci_rca, Critical) is not resolved here: it closes with the flip thread's acknowledge-and-retry.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-digest-iam-sids.yaml
phase: >-
  security_advisory (soft-warn category; no tier_item claimed). Follow-on to rec-4639 (#1678); unblocks every terraform/personal apply.
scope:
  - file: scripts/ci/terraform_plan_digest.py
    action: Modify
    purpose: >-
      (1) Parse policy statements once (_statements). (2) Per Sid: added and removed Sids, and for Sids whose statement
      differs, Action/Resource/Condition ELEMENT COUNTS before and after (Resource and NotResource both counted, Condition
      counted as operator-key pairs); Sid names are printed only when they are double-quoted literals in the public .tf files
      (_gate, as for actions), else <non-literal>; unnamed statements are keyed "(no Sid #n)". Resource and Condition values are
      never printed. A policy that differs with no action, Sid or count delta prints "policy: changed (no action, Sid, or count
      delta)" instead of nothing. (3) A resource_change carrying action_reason prints " reason=<token>" when the token matches
      [a-z_]{1,64}. (4) A policy with after_unknown.policy prints "(known after apply; deferred data read: <data address>)"
      when plan.configuration links the policy expression to a data address whose resource_change has action_reason
      read_because_dependency_pending, else a generic deferred-reads note when any such read exists, else the old text. All
      added text is structural (addresses already printed, fixed words, integers) or literal-gated.
  - file: tests/test_terraform_plan_digest.py
    action: Modify
    purpose: >-
      Add cases: per-Sid counts with no Resource or Condition value leaking; literal-gated and unnamed Sids; Sid added and
      reorder-only change; deferred-read annotation with and without configuration and without pending reads; action_reason
      shape gate; replay of the #1687 shape (two narrowed role policies with no action change plus a deferred CI policy).
  - file: docs/plans/PLAN-plan-digest-iam-sids.yaml
    action: Create
    purpose: This plan.
bundled_recommendations:
  - rec-4675
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - A policy narrowed only in Resource, with Sids removed, renders per-Sid removed Sids and Resource/Condition count changes; no Resource, Condition, ARN or secret name appears in the digest.
  - A policy whose data read is deferred is annotated with the data address (via configuration references) instead of a bare (known after apply).
  - The #1687 shape (two narrowed role policies, two deferred CI policies) yields a digest a reviewer can judge.
  - The values-stripped sentinel tests and guard tests are unchanged and green.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Digest unit tests including the #1687-shape replay.
    command: bin/venv-python -m pytest tests/test_terraform_plan_digest.py -q
    expected: exit 0; every test passes. The new cases fail before the change.
    fix_if: A value leaks - fix the renderer, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: Covered permanently by the unit tests, which run in every tier.
  - step: 2
    phase: pre-deploy
    action: Sentinel, guard and wiring suites unchanged.
    command: bin/venv-python -m pytest tests/test_subagent_plan_review_values_stripped.py tests/test_terraform_apply_guard.py tests/test_subagent_review_wiring.py -q
    expected: exit 0.
    fix_if: A sentinel appears - the new text printed a value; gate it.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: Existing suites run in every tier.
  - step: 3
    phase: pre-deploy
    action: Discharge the handoff obligation with a full-tier run to completion.
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test, relax an assertion or add a baseline. A failure outside
      scope becomes a rec via scripts.ops_data_portal (Decision 59, 55).
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: post-deploy
    action: Confirm rec-4675 is closed (the squash-merge Resolves trailer closes it).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; r,_=fetch_recs_by_ids(make_reader(), ['rec-4675']); print(r[0]['id'], r[0]['status'])"
    expected: Prints rec-4675 closed.
    fix_if: Still open - the ci.yml closure job failed; read its log and close with update_rec (Decision 84 I-4).
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/ci/terraform_plan_digest.py
    behavior: Per-Sid counts, deferred-read annotation, action_reason token, all names-only.
    verification_step: 1
    test_selector: tests/test_terraform_plan_digest.py
    red_green_expectation: red before (no Sid or deferred rendering), green after.
weakening_dispositions: []
constraints:
  - No IAM, Terraform, Neon or AWS change; no admin credentials; no secrets touched.
  - 'The digest stays names-only (#1678): no Resource, Condition, ARN or secret-name value is ever printed; only literal-gated Sid and action names.'
  - The guard, review.sh and the reviewer prompt are untouched; the reviewer's POLICY is not relaxed, only its input improved.
  - After merge the flip thread (not this build) runs acknowledge-and-retry for 313ae03e.
context:
  - "Origin: rec-4675 / rec-4674; Benjamin chose fix-the-digest-then-retry (22:19:37Z, card cmsg_012XgaFy8VaDQbxP5D8nC958KmQUyrLCasoVYVhDC64LwX)."
  - "Terraform plan JSON: action_reason read_because_dependency_pending sits on the data resource_change; the linking resource names it only through configuration expressions references."
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Edit the digest module and tests as scoped.
  - Run VP steps 1-3.
  - Open the PR, merge on code review PROCEED and green CI, message the flip thread.
rollback: Revert PR; the digest returns to action-token-only IAM rendering. Nothing in AWS changes.
