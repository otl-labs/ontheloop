pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (85, 118, 181 cl.2, 196 cl.6/cl.8, 197 cl.1/4/5, 201, 205 cl.5, 217 cl.5-6, 229 cl.1/cl.4)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    STEP 0 -- Confirm the branch is not main; run bin/venv-python -m scripts.ci_rca.red_overlap --plan
    docs/plans/PLAN-plan-document-edge-fields.yaml (a BLOCK or exit 2 stops the session).
  - >-
    STEP 1 -- scripts/roadmap/plan_document.py. (a) Module constants beside _REC_ID_RE: _DECISION_TOKEN_RE =
    re.compile(r"dec:[1-9][0-9]*(#[^\s#:]+)?") (no re.ASCII flag: [0-9] already enforces ASCII digits, and Unicode \s must stay active so non-ASCII whitespace is rejected like the sibling str.isspace() validators), _EDGE_FIELDS = frozenset({"amends", "introduces", "principal"}),
    _EDGE_FIELDS_MIN_VERSION = 5. (b) Append to PlanDocument after weakening_dispositions, in this order:
    amends: list[str] = Field(default_factory=list), introduces: list[str] = Field(default_factory=list),
    principal: str | None = None. (c) Three @field_validator classmethods after _followon_recs_tokens: _amends_tokens
    raises ValueError for any entry failing _DECISION_TOKEN_RE.fullmatch, message containing "amends entry {entry!r} is
    not a valid 'dec:<number>[#<clause-id>]' token"; _introduces_tokens raises for an empty or whitespace-bearing entry,
    message containing "is not a valid name token"; _principal_token raises for a non-None empty or whitespace-bearing
    value, message containing "is not a valid principal token", and for a value containing '@', message containing
    "public-repository boundary" (an email address is a private identifier). (d) A _validate_edge_fields_version method: present =
    sorted(_EDGE_FIELDS & self.model_fields_set); if present and schema_version < 5, raise ValueError containing
    "require schema_version 5 or above (got schema_version N)". Call it from _validate_document after
    _validate_expected_literals. No I/O, no existence lookup, no dedupe.
  - >-
    STEP 2 -- tests/roadmap/plan_document/test_edge_fields.py (new; import _mutate and REPO_ROOT from
    tests.fixtures.plan_document_helpers; build v5 docs via _mutate(schema_version=5, handoff_policy={...})).
    TestPlanEdgeFields: defaults when absent; the three fields are in model_fields and not required; amends accepts
    dec:217, dec:217#6, dec:151#3(ii), dec:1; amends rejects dec-217, Decision 217, 217, dec:, dec:0217,
    a non-ASCII-digit token (the Python literal 'dec:2\u0661\u0667', Arabic-Indic digits), dec:scale-readiness, dec:217#, dec:217#6#7, dec:217 #6, a non-ASCII-whitespace clause fragment (the Python literal 'dec:217#6\u00a0x') (match the grammar phrase); introduces accepts ready_set
    and plan-obligations and rejects '', '   ', 'two words'; principal accepts operator and rejects '', '   ',
    'the operator' (match "is not a valid principal token") and someone@example.com (match "public-repository
    boundary"); each key refused on the v1 fixture (_mutate()), including amends=[]; the v1 fixture without the keys
    still validates; an unknown sibling key (amend) still raises "Extra inputs are not permitted"; a bad amends entry
    written to disk fails through validate_paths. TestPlanEdgeFieldsContract (load via scripts.contracts.load_contract; import check_required_inline_fields from scripts.contracts_enforcement):
    {plan_amends, plan_introduces, plan_principal} <= set(fields); check_required_inline_fields returns []; each
    description names PlanDocument.<field>; plan_amends.semantics contains "dec:<number>[#<clause-id>]", "DECLARATION",
    "Decision 197 cl.5", "Decision 217 cl.5-6", "T4.32 c4" and "current and future-version plans"; plan_amends
    governance_notes contains rec-4517; plan_principal.semantics contains "never an email address"; contract.description
    contains followon_recs, roadmap_alignment_projection, PlanDocument.amends and PlanDocument.principal; the
    change_class set over the contract's TOP-LEVEL amendment_log entries (doc.amendment_log, never a field-level log) whose summary names PLAN-plan-document-edge-fields is a superset of
    {field_add, prose_improvement}. Subset/phrase assertions only; no whole-corpus test (step 3 covers it).
  - >-
    STEP 3 -- docs/contracts/exit-criteria-ledger.yaml. (a) contract.description: replace "plus the plan->criterion
    linkage field (PlanDocument.closes_criteria)" with a clause naming every plan-linkage field -- closes_criteria,
    followon_recs and its followon_recs_readiness projection, PlanDocument.amends / PlanDocument.introduces /
    PlanDocument.principal, and the roadmap_alignment_projection audit_invariant; leave the rest unchanged. (b) Insert
    plan_amends, plan_introduces, plan_principal (type, description, semantics, populated_by, dq_intent {}) after
    plan_followon_recs. plan_amends.semantics: the dec:<number>[#<clause-id>] grammar naming _DECISION_TOKEN_RE;
    token-shape only; why dec: diverges from decision-entry.yaml field_shapes.amends
    (integers) and the dec-NNN warehouse id: a typed-namespace prefix plus a #clause fragment, so the extractor emits it
    verbatim as an edge target ref; a DECLARATION, never the durable record -- the implementation merge writes the edge (Decision 197
    cl.5, Decision 205 cl.5); consumer T4.32 c4's single plan-edge extractor, not built and not claimed; the Decision
    217 cl.5-6 deferral (home T4.24 c7) -- numbers only until Decision 196 cl.8's split, #clause recorded but resolving
    to the whole decision until then, slug form and Decision 196 cl.6 prefixes by amendment; refused below
    schema_version 5 -- only current and future-version plans can assert edges; default []. plan_amends
    governance_notes: Decision 181 cl.2 per-surface coverage -- shape and version floor enforced by
    validate_plan_documents in both tiers; existence UNENFORCED, owned by rec-4517. plan_introduces.semantics: opaque
    non-blank whitespace-free name tokens; a bare un-namespaced token stays permanently valid (merged plans are
    immutable history), so any later namespacing is additive and never re-reads a bare token's kind by guesswork; declaration only; same consumer and version
    floor; default []. plan_principal.semantics: opaque non-blank whitespace-free token, shape only, no hard-coded handle
    (operator data, Decision 197 cl.1/cl.4); constant today, so absence means the single operator; a public handle or
    role token, never an email address or other private identifier -- a value containing '@' is refused at schema time
    (coverage per Decision 181 cl.2: the '@' arm enforced by validate_plan_documents in both tiers; other private
    identifiers remain an author obligation); same version floor; default None. (c) Append two
    entries to the contract's TOP-LEVEL amendment_log (never a field-level log: category 6, check_amendment_for_diff,
    needs the description change's prose_improvement / semantic_break false entry at top level) dated the implementation day, semantic_break false: change_class field_add (the three
    entries, rec-4496) and change_class prose_improvement (the description widening, rec-3534), each summary naming
    PLAN-plan-document-edge-fields.
  - STEP 4 -- bin/venv-python -m ruff format and ruff check the two Python files.
  - >-
    STEP 5 -- Execute the Verification Plan: run each pre-deploy step and loop until it passes; on an unrecoverable
    failure stop and RCA (Decision 55). Graduate steps 1 and 2 as test_selector registry shards under
    config/agent/verification_registry/entries/ named by their graduation_check_id (node_id = the step's class
    selector, plan_slug plan-document-edge-fields).
  - >-
    STEP 6 -- Closure (implement skill Commit Flows; docs/contracts/git-ops.yaml), each outcome reported separately: the
    readiness check bin/venv-python -m scripts.session.github_readiness (unknown is unproven, never PASS); set
    implementation_declared true after the graduation walk (load-bearing for rec-4517: followon_recs_readiness projects
    only plans carrying implementation_declared true); rebase on origin/main; VP step 7's full tier on the committed,
    clean tree (blocking, never a CI-only handoff); the postflight evidence file and bin/venv-python -m
    scripts.session.postflight --evidence; the real push and PR outcomes (PR body and squash body carry 'Resolves:
    rec-4496, rec-3534', never rec-4517, which stays open for slice 2); after merge, VP step 8.
  - 'Report: what was implemented, verification results, and rec-4517 left open as the declared existence-check owner.'
rollback: Revert the squash commit; no plan carries the new keys yet, so nothing else needs undoing.
