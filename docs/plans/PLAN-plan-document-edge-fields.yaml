schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-document-edge-fields"
intent: >-
  Let a plan declare its own edges -- the decision clauses it amends, the names it introduces and its human of intent --
  as three optional, shape-validated PlanDocument fields, so the future single plan-edge extractor reads a typed source
  instead of free text: the plan->work half of the platform's governed work graph. Resolves rec-4496 and rec-3534.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-plan-document-edge-fields.yaml
phase: >-
  No tier_item (soft-warn ad_hoc_rec category): resolves rec-4496 (plus rec-3534, same contract). The fields' consumer is
  named in context as a NOT-CLAIMED adjacency; this plan claims no tier_item criterion.
scope:
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      Add amends (list[str], default []), introduces (list[str], default []) and principal (str | None, default None) to
      PlanDocument, with token-shape field validators mirroring _closes_criteria_tokens / _followon_recs_tokens, and refuse
      all three keys below schema_version 5 (the expected_literals precedent) -- only current and future-version plans
      can assert edges.
  - file: tests/roadmap/plan_document/test_edge_fields.py
    action: Create
    purpose: >-
      TestPlanEdgeFields (defaults, optionality, accepted and rejected token shapes, loader-level rejection,
      schema_version gating both directions, extra=forbid still biting) and TestPlanEdgeFieldsContract (the ledger
      contract carries the three field entries, the widened description and this plan's amendment_log entries).
  - file: docs/contracts/exit-criteria-ledger.yaml
    action: Modify
    purpose: >-
      Add plan_amends, plan_introduces and plan_principal field entries (declarations-only semantics, the Decision 217
      cl.5-6 deferral note, the Decision 181 cl.2 coverage declaration naming rec-4517) with a field_add amendment_log
      entry; widen contract.description to name every plan-linkage field (rec-3534) with its own prose_improvement entry.
bundled_recommendations: [rec-4496, rec-3534]
followon_recs: [rec-4517]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    PlanDocument admits amends, introduces and principal as optional fields defaulting to [], [] and None, and every
    existing docs/plans/PLAN-*.yaml still validates unchanged.
  - >-
    amends rejects any entry that does not fullmatch ^dec:[1-9][0-9]*(#[^\s#:]+)?$ (ASCII digits only, any Unicode whitespace rejected; e.g. 'dec:217#6\u00a0x', dec-217, Decision 217, 217, dec:, dec:2<Arabic-Indic digits>,
    dec:0217, a slug id, dec:217#, dec:217#6#7, dec:217 #6) with a message naming 'dec:<number>[#<clause-id>]';
    introduces rejects a blank or whitespace-bearing entry; principal rejects a blank, whitespace-bearing or '@'-bearing value --
    through both model_validate and the load()/validate_paths path.
  - >-
    Any of the three keys present (even with an empty value) on a schema_version 1-4 plan is refused with a message
    containing "require schema_version 5 or above"; a schema_version 1-4 plan omitting them still validates, and
    schema_version 5 accepts them.
  - >-
    scripts/roadmap/plan_document.py carries exactly two lines matching ^    (amends|introduces): (rec-4496's oracle) and
    stays at or below 500 SLOC (Decision 128).
  - >-
    exit-criteria-ledger.yaml carries plan_amends, plan_introduces and plan_principal (each with description, semantics,
    populated_by and dq_intent; plan_amends also governance_notes naming rec-4517), its contract.description names every
    plan-linkage field including followon_recs and roadmap_alignment_projection (rec-3534's oracle), it carries one new
    field_add and one new prose_improvement amendment_log entry naming this plan, and it raises no category-2 or
    category-6 finding (Decision 118).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Exercise the three fields' defaults, optionality, token shapes, loader path and schema_version gating.
    command: bin/venv-python -m pytest tests/roadmap/plan_document/test_edge_fields.py::TestPlanEdgeFields -q
    expected: Every TestPlanEdgeFields test passes, exit 0 (about 2s measured on the scratch prototype).
    fix_if: >-
      A token case fails -- align the regex or validator with the dec:<number>[#<clause-id>] grammar; never widen or
      delete a test case.
    hermetic: true
    graduation: graduate
    graduation_check_id: plan-document-edge-fields-token-shape
    expected_literals: ["passed"]
  - step: 2
    phase: pre-deploy
    action: Prove the ledger contract carries the three field entries, the widened description and this plan's entries.
    command: bin/venv-python -m pytest tests/roadmap/plan_document/test_edge_fields.py::TestPlanEdgeFieldsContract -q
    expected: Every TestPlanEdgeFieldsContract test passes, exit 0.
    fix_if: A field entry, phrase or amendment_log entry is missing -- add it to the contract as execution STEP 3 specifies.
    hermetic: true
    graduation: graduate
    graduation_check_id: exit-criteria-ledger-plan-edge-fields
    expected_literals: ["passed"]
  - step: 3
    phase: pre-deploy
    action: Revalidate the whole plan corpus through the CLI (Decision 85).
    command: bin/venv-python -m scripts.roadmap.plan_document
    expected: Every plan prints PASS (WARN advisories allowed), exit 0; about 25s measured, under the 30s authoring target.
    fix_if: Any FAIL line -- the change broke a historical plan; fix the schema change, never edit the historical plan.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the standing validate_plan_documents check, which runs this exact corpus walk in both tiers; a second
      registry row would add no independent guard.
  - step: 4
    phase: pre-deploy
    action: Run rec-4496's stored oracle verbatim (the Decision 201 closure precondition).
    command: >-
      test "$(grep -cE '^    (amends|introduces): ' scripts/roadmap/plan_document.py)" -eq 2 || ! grep -q 'reads the optional PlanDocument fields amends and introduces' docs/ROADMAP-PLATFORM.yaml
    expected: Exit 0.
    fix_if: >-
      Exit 1 -- the count is not exactly 2: a comment, docstring, message or second declaration starts a 4-space-indented
      line with amends: or introduces:; reword it. Never edit the roadmap phrase.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-time closure oracle: pinning a raw line count as a standing guard would redden a legitimate facade
      decomposition of plan_document.py, while step 1's shard already guards the behaviour itself.
  - step: 5
    phase: pre-deploy
    action: >-
      rec-4496's and rec-3534's stored acceptance lint decidable and pass inside the trailer evaluator's isolation
      (scripts.backlog_health.probe.run_one), so the Resolves trailer closes both. Reads the DuckLake reader (credentials).
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.backlog_health import probe; from scripts.executor.acceptance_lint import lint_acceptance_command as lint; from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-4496', 'rec-3534']); assert len(rows) == 2, rows; v = {r['id']: (lint(r['acceptance'], require_decidable=True)[0], probe.run_one(r['acceptance'], repo_root=Path('.').resolve())) for r in rows}; bad = {k: x for k, x in v.items() if x != (True, probe.PASS)}; assert not bad, bad; print('ACCEPTANCES_HOLD', sorted(v))"
    expected: Prints the ACCEPTANCES_HOLD marker naming both recs, exit 0.
    fix_if: >-
      A probe returns fail -- fix the code or contract, never the stored acceptance. Plan time: both returned
      (True, 'fail') on a73b0d63 (red) and (True, 'pass') on the scratch prototype.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Confirm both touched Python files stay inside the 500-SLOC limit (Decision 128).
    command: >-
      bin/venv-python -c "import pathlib,sys; ps=['scripts/roadmap/plan_document.py','tests/roadmap/plan_document/test_edge_fields.py']; n={p: len([l for l in pathlib.Path(p).read_text(encoding='utf-8').splitlines() if l.strip() and not l.strip().startswith('#')]) for p in ps}; print(n); sys.exit(0 if max(n.values()) <= 500 else 1)"
    expected: Prints both SLOC counts (prototype 450 and about 100), exit 0.
    fix_if: Over 500 -- decompose per Decision 128 (facade package); never raise a budget.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates the standing validate_sloc_limits check, which already fails any unregistered file over 500 SLOC.
  - step: 7
    phase: pre-deploy
    action: Run the full validation tier pre-handoff.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0.
    fix_if: Any failing check -- fix at root cause on the branch (Decision 55); never --ignore-budget to pass.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Invokes scripts.validate (recursion refusal); the full tier is itself the standing gate post-merge on main.
  - step: 8
    phase: post-deploy
    action: rec-4496 and rec-3534 are closed by the squash commit's Resolves trailer; rec-4517 stays open for slice 2.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-4496', 'rec-3534', 'rec-4517']); st = {r['id']: r['status'] for r in rows}; print(st); assert st == {'rec-4496': 'closed', 'rec-3534': 'closed', 'rec-4517': 'open'}, st"
    expected: Prints rec-4496 and rec-3534 closed and rec-4517 open, exit 0.
    fix_if: >-
      Still open -- confirm the squash body carries 'Resolves: rec-4496, rec-3534' in a Key: value block (never
      rec-4517), then read the trailer-closure job's verdict artifact. An AcceptanceVerdictRefused is never closed
      manually: fix the code or contract and let a trailer close it.
    hermetic: false
test_obligations:
  - source: scripts/roadmap/plan_document.py
    behavior: >-
      amends, introduces and principal exist as optional fields defaulting to [], [], None; their token shapes are
      enforced through model_validate and the loader path; all three keys are refused below schema_version 5 and
      accepted at 5.
    verification_step: 1
    test_selector: tests/roadmap/plan_document/test_edge_fields.py::TestPlanEdgeFields
    red_green_expectation: >-
      red before (measured on a73b0d63 with the prototype test file: 32 of 33 fail -- extra=forbid rejects the keys, so
      accept/default cases fail and reject cases raise the wrong message; the extra=forbid guard alone passes), green
      after.
  - source: docs/contracts/exit-criteria-ledger.yaml
    behavior: >-
      The ledger carries plan_amends, plan_introduces and plan_principal with the grammar, declarations-only, Decision
      217 deferral and public-boundary phrases, a contract.description naming every plan-linkage field, and one
      field_add plus one prose_improvement amendment_log entry naming this plan.
    verification_step: 2
    test_selector: tests/roadmap/plan_document/test_edge_fields.py::TestPlanEdgeFieldsContract
    red_green_expectation: red before (measured on a73b0d63, 5 of 5 fail), green after.
constraints:
  - IMPLEMENTATION only (Decision 67; Decision 229 cl.1 interim reading; Decision 229 cl.4 names the consumer).
  - >-
    No roadmap edit (growth budget 0 lines), no new numbered Decision, no plan-edge extractor, no existence check (rec-4517
    owns it), no Decision 197 cl.5 amendment, no planning-skill template line, no edit outside the three scope files and
    the two graduated registry shards.
  - >-
    Claim none of T4.28-T4.32, PC-08 or any persona-first id; T4.32 c4's text stays byte-identical (the
    persona-first-children shard pins it).
  - Tests and graduated shards use subset or phrase assertions only, never list positions or indexes.
  - >-
    In plan_document.py, only the two field declarations may start a 4-space-indented line with amends: or introduces:
    (rec-4496 oracle, Decision 201).
  - >-
    principal is shape-validated only and rejects any value containing '@' (the public-repository boundary,
    mechanically enforced); no validator or test hard-codes a real handle (Decision 197 cl.1/cl.4), and no
    email address or other private identifier enters repo text (public-repository boundary).
  - >-
    Wherever a rationale for the version floor is written, it reads "only current and future-version plans can assert
    edges" (the operator's 2026-10-20 wording): v5 and every later version accept the fields.
  - bin/venv-python only; ruff format and check, line length 127; no emojis; ASCII hyphens; no comments beyond a non-obvious why.
  - No rescue agents or workaround loops (Decision 55).
