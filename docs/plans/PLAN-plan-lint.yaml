  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
  - {gate: decision-scout, round: 2, verdict: FLAGS_FOUND}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Rebase onto origin/main. Re-measure plan_document.py and tests/test_plan_obligations.py SLOC and apply each scope
    row's relief if the measured edit crosses its line; never a budget entry.
  - >-
    Apply docs/plans/approved/plan-lint.yaml to docs/contracts/plan-obligations.yaml verbatim, filling `{{DATE}}` with
    the merge date; confirm with bin/venv-python -m scripts.roadmap.approved_text verify --slug plan-lint.
  - >-
    Write the tests first (scope rows above) and record their red output on main in the PR body; then
    validate_pre_glob_closure's seam, plan_lint, the plan_obligations wiring and the ScopeEntry field.
  - >-
    Run validate --pre and add to scripts/checks/roadmap/_manifest.py exactly the validate_plan_scope_closure pre_globs
    validate_pre_glob_closure reports; no repo-wide glob (pre-glob-closure-no-repo-wide-glob-gained).
  - >-
    Run VP steps 1-8; loop until pass; on an unrecoverable failure stop and raise the alarm per the implement skill
    (Decision 55).
  - >-
    Closure evidence and merge per the implement skill Commit Flow: full tier plus validation_result --verify-head,
    postflight evidence, PR, CI green by event-driven wake, code review PROCEED. The branch commit carries
    "Resolves: rec-4383, rec-4751, rec-4752, rec-4754" (git-ops.yaml resolves_trailer TRANSPORT); squash with
    merge_step premerge before and readback after.
  - 'Report: what was implemented, verification results, measured sizes, the closure facts.'
rollback: >-
  Revert the PR. Plans merged meanwhile that declare scope[].new_imports would be refused by the reverted schema
  (extra="forbid"): the revert strips that field from them in the same PR.
