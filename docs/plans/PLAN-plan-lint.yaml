    Rebase onto origin/main. Re-measure plan_document.py and tests/test_plan_obligations.py SLOC: apply the
    tests/test_plan_obligations.py relief its scope row names, and STOP if plan_document.py would cross 500; never a
    budget entry.
  - >-
    Apply docs/plans/approved/plan-lint.yaml to docs/contracts/plan-obligations.yaml verbatim, filling `{{DATE}}` with
    the merge date; confirm with bin/venv-python -m scripts.roadmap.approved_text verify --slug plan-lint.
  - >-
    Write the tests first (scope rows above) and record their red output on main in the PR body; then
    validate_pre_glob_closure's seam, plan_lint, the plan_obligations wiring and the ScopeEntry field.
  - >-
    Run validate --pre and add to both manifests exactly the pre_globs validate_pre_glob_closure reports for
    validate_plan_scope_closure and validate_admin_root_premerge_gate; no repo-wide glob
    (pre-glob-closure-no-repo-wide-glob-gained). If it reports any executor, ops-portal or DuckLake path, an import
    of acceptance.py has crept in: remove it rather than glob it.
  - >-
    Run VP steps 1-8; loop until pass; on an unrecoverable failure stop and raise the alarm per the implement skill
    (Decision 55).
  - >-
    Closure evidence and merge per the implement skill Commit Flow: full tier plus validation_result --verify-head,
    postflight evidence, PR, CI green by event-driven wake, code review PROCEED. The branch commit carries
    "Resolves: rec-4383, rec-4751, rec-4752, rec-4754" (git-ops.yaml resolves_trailer TRANSPORT); squash with
    merge_step premerge before and readback after.
