schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-lint"
intent: >-
  Make the plan-time report find, before critique, the companions and caps that builds keep stopping on: the manifest
  pre_globs a new import forces, the accounting-baseline strike a baselined check's edit forces, the amendment entry a
  Class D contract edit owes, the disposition a graduated registry shard naming a changed test owes (gating, joining
  validate_plan_scope_closure for net-new plans), and the size headroom, unbuilt plans on the same file, undecidable
  bundled-rec acceptance and hand-written freeze tests (advisory). Deterministic reads of plan plus repo only: nothing
  new runs in CI beyond the existing plan check, and no code is built to test a plan (operator ruling 2026-10-30).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-lint.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Project Review joint
  review area B (BUILD-SEAMS row B); closes no roadmap criterion. Sibling plan PLAN-plan-defect-loop (same plan PR)
  carries the wording check, the plan-defect alarm and the skill texts, and builds after this one.
closes_criteria: []
scope:
  - file: docs/plans/approved/plan-lint.yaml
    action: Create
    purpose: >-
      Lands WITH THIS PLAN (plan PR), not in the build. The approved-text sidecar (schema_version 1, 4 blocks, all on
      docs/contracts/plan-obligations.yaml; `{{DATE}}` is the only placeholder). The build applies it verbatim and
      validate_merge_step binds the merged words to it (git-ops.yaml approved_text_binding).
  - file: docs/contracts/plan-obligations.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar: description sentence naming derived_findings; the re_ratification_trigger disjunct
      "derived_findings_gating_rows_count >= 6"; one new amendment_log entry (field_add, records the re-ratification
      review outcome: stays provisional_v0); the derived_findings section (eight rows, four gating) and frozen_companions
      (one row, the preflight key set). 132 -> 197 effective lines of 500 (contracts class, Decision 166).
  - file: scripts/roadmap/plan_lint/__init__.py
    action: Create
    purpose: >-
      Facade. derive(plan: dict, root: Path) -> LintResult(gating: list[str], advisory: list[str]); reads the rows
      through _rows, dispatches each row id to its derivation, puts a row's findings under gating or advisory by the
      row's own `gating` flag (never a second copy in code), and turns a row with no derivation, a derivation with no
      row, or any derivation exception into one gating finding naming it. Never raises.
  - file: scripts/roadmap/plan_lint/_rows.py
    action: Create
    purpose: >-
      load_rows(contract_path) -> (rows, frozen_companions, error): reads derived_findings.rows and frozen_companions
      from docs/contracts/plan-obligations.yaml; a missing or malformed section yields an error string, never a raise.
  - file: scripts/roadmap/plan_lint/companions.py
    action: Create
    purpose: >-
      The four gating derivations plus frozen_companions. pre_glob_closure: edges = (row module, each new_imports
      module) for Create/Modify .py rows; findings from validate_pre_glob_closure.uncovered_after_edges, each naming the
      Entry and the uncovered path and requiring scripts/checks/<domain>/_manifest.py in scope; plus an advisory line per
      scoped module gated Entries reach when no new_imports is declared. accounting_baseline_strike: Modify rows whose
      file is the module (Entry.module from registry._ALL_ENTRIES, no check import) of a name in
      config/check_accounting_baseline.yaml `entries` require that file in scope. class_d_amendment_entry: Modify rows on
      docs/contracts/*.yaml whose file has a top-level amendment_log require the token amendment_log in that row's
      purpose. registry_shard_disposition: Modify/Delete rows on tests/**.py named by a shard's check_spec.node_id
      prefix or check_spec.command text require that shard's path in scope or its check_id anywhere in the plan text.
      frozen_companions: names the test and breaks_when for each scoped source matching a row's source glob.
  - file: scripts/roadmap/plan_lint/headroom.py
    action: Create
    purpose: >-
      size_headroom: per Modify row, SLOC (non-blank, non-comment lines, as validate_sloc_limits counts) against
      config/sloc_budgets.yaml else 500 for .py; effective_lines and the class or roster limit from
      scripts.checks.structural._classify for governed non-Python files; bytes against a path key of
      config/prose_budgets.yaml for prose files; NEAR_CAP when headroom < 5% of the limit. unbuilt_same_file: plans with
      schema_version >= 4, implementation_declared not true and added in the last 30 days (ONE `git log --diff-filter=A
      --since=30.days --name-only -- docs/plans/` call, never one per plan) whose scope lists the same file.
  - file: scripts/roadmap/plan_lint/acceptance.py
    action: Create
    purpose: >-
      acceptance_decidable: fetches bundled_recommendations through src.common.ducklake_reader_client (imported inside
      the function) and runs scripts.executor.acceptance_lint.lint_acceptance_command(require_decidable=True) on each
      acceptance; any reader exception yields one advisory UNREACHABLE line, never a raise. Called from the --plan report
      only, never from evaluate_plan (the CI check has no reader credentials).
  - file: scripts/roadmap/plan_obligations.py
    action: Modify
    purpose: >-
      evaluate_plan appends plan_lint.derive(...).gating (prefixed with the plan name) after the registration findings;
      build_report adds a "derived findings (advisory)" section with the advisory lines and the acceptance lines; the
      module docstring names the new seam. The CLI still always exits 0. 437 -> about 460 lines (368 -> about 385 SLOC).
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      ScopeEntry gains `new_imports: list[str] = Field(default_factory=list)`, each a dotted first-party module name
      (regex ^(scripts|src|tests)(\.[A-Za-z_][A-Za-z0-9_]*)+$). 485 SLOC, NEAR_CAP: if the edit takes it past 495 SLOC
      measured on the rebased branch, move ScopeEntry and its validator into scripts/roadmap/plan_scope_entry.py and
      re-export it from plan_document (facade, Decision 80/104/124) -- never a budget raise.
  - file: scripts/checks/deps/validate_pre_glob_closure.py
    action: Modify
    purpose: >-
      Public seam uncovered_after_edges(edges: Iterable[tuple[str, str]], root: Path) -> dict[str, list[str]]: copies
      the import view, adds each edge (adding an absent target node whose repo path the dotted name gives), and returns,
      per gated Entry name, the reported paths not reported on the unmodified view. Reuses _closure_view,
      _gated_entries and _uncovered_and_suppressed; the registered check's behaviour is unchanged.
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      validate_plan_scope_closure's pre_globs gain exactly the globs validate_pre_glob_closure reports for the new import
      closure (the pre_glob_closure obligation, applied to this plan by hand because its own field lands here).
  - file: tests/test_plan_obligations.py
    action: Modify
    purpose: >-
      The six module-level tests the bundled recs' acceptances name: test_near_cap_structural_scope_row_is_reported,
      test_near_cap_report_names_unbuilt_plans_editing_the_same_file,
      test_scoped_import_edge_and_baselined_check_obligate_companions, test_undecidable_bundled_rec_acceptance_is_reported
      (the reader is monkeypatched), test_class_d_contract_scope_row_obligates_amendment_entry,
      test_registry_shard_naming_a_scoped_test_is_reported. Relief (420 SLOC + about 110): TestDeriveFindingsEdgeCases and
      TestEnforcedElsewherePointerEdgeCases move unchanged to tests/roadmap/plan_obligations/test_edge_cases.py (no shard
      names either). Shards naming this file stay valid and are kept: plan-obligations-accounting-pointer-reported,
      plan-obligations-grammar-guard-g1, plan-obligations-grammar-guard-g2, plan-obligations-grammar-guard-g3,
      plan-obligations-grammar-guard-g4, plan-obligations-grammar-guard-g5, plan-obligations-live-contract-grammar-clean,
      plan-obligations-workflow-taxonomy-rule.
  - file: tests/roadmap/plan_obligations/__init__.py
    action: Create
    purpose: Package marker, matching tests/roadmap/plan_document/.
  - file: tests/roadmap/plan_obligations/test_edge_cases.py
    action: Create
    purpose: The two moved classes, byte-identical bodies (relief for tests/test_plan_obligations.py).
  - file: tests/roadmap/plan_lint/__init__.py
    action: Create
    purpose: Package marker.
  - file: tests/roadmap/plan_lint/test_rows_and_dispatch.py
    action: Create
    purpose: >-
      A row with no derivation and a derivation with no row each give one gating finding; the gating flag is read from
      the contract (a fixture contract flipping size_headroom to gating moves its lines); a raising derivation is
      contained; a malformed derived_findings section is a finding, never a raise.
  - file: tests/roadmap/plan_lint/test_derivations.py
    action: Create
    purpose: >-
      Edge cases per derivation on tmp-path fixture repos: pre_glob edge to a not-yet-created module; an already-covered
      edge gives nothing; a baselined check's module Modify; a contract without amendment_log gives nothing; a shard
      kept by check_id; NEAR_CAP boundary at exactly 5%; an unbuilt plan older than 30 days is not named; a matching
      frozen_companions row is named.
  - file: tests/roadmap/plan_document/test_scope_new_imports.py
    action: Create
    purpose: new_imports accepted on any schema_version, defaults empty, refuses a non-dotted or non-first-party name.
  - file: tests/checks/deps/validate_pre_glob_closure/test_uncovered_after_edges.py
    action: Create
    purpose: >-
      The seam reports a newly uncovered path for an Entry whose closure gains the edge, nothing for an edge outside
      every gated closure, and nothing that the unmodified view already reports; validate_pre_glob_closure's own
      verdict on the live tree is unchanged.
  - file: tests/checks/roadmap/test_validate_plan_scope_closure.py
    action: Modify
    purpose: >-
      A net-new v4+ plan with a gating derived finding fails the check; an advisory-only finding never does. Shards
      naming this file are kept: plan-obligations-enforced-elsewhere-never-gates, plan-obligations-grammar-leg-unconditional,
      plan-scope-closure-accounting-declared.
bundled_recommendations: [rec-4383, rec-4751, rec-4752, rec-4754]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/contracts/plan-obligations.yaml carries exactly the approved sidecar text (validate_merge_step's approved-text
    binding passes on the implement PR) and stays <= 500 effective lines. VP step 6.
  - >-
    For a net-new schema_version >= 4 IMPLEMENTATION plan, validate_plan_scope_closure fails on each gating derived
    finding (pre_glob_closure, accounting_baseline_strike, class_d_amendment_entry, registry_shard_disposition) and
    never on an advisory one. VP steps 1, 2 and 4.
  - >-
    `plan_obligations --plan` prints the advisory section: size headroom with NEAR_CAP, unbuilt plans on the same file,
    undecidable bundled-rec acceptance (or UNREACHABLE), and frozen companions; it always exits 0. VP steps 1 and 5.
  - >-
    PlanDocument accepts scope[].new_imports; validate_pre_glob_closure's verdict on the live tree is unchanged. VP
    steps 3 and 4.
  - >-
    plan_document.py, plan_obligations.py and tests/test_plan_obligations.py each stay <= 500 SLOC with no budget
    entry added. VP step 6.
  - Every bundled rec's own acceptance command exits 0 (VP step 1), and each is closed after merge (VP step 9).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The bundled recs' acceptance nodes.
    command: >-
      bin/venv-python -m pytest -q
      tests/test_plan_obligations.py::test_near_cap_structural_scope_row_is_reported
      tests/test_plan_obligations.py::test_near_cap_report_names_unbuilt_plans_editing_the_same_file
      tests/test_plan_obligations.py::test_scoped_import_edge_and_baselined_check_obligate_companions
      tests/test_plan_obligations.py::test_undecidable_bundled_rec_acceptance_is_reported
      tests/test_plan_obligations.py::test_class_d_contract_scope_row_obligates_amendment_entry
      tests/test_plan_obligations.py::test_registry_shard_naming_a_scoped_test_is_reported
    expected: exit 0; six tests pass. Red before (on main none of the six nodes exists).
    fix_if: A derivation differs from scope; fix the code, never the assertion.
    hermetic: true
    expected_literals: ["6 passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Ordinary unit tests in tests/test_plan_obligations.py, which the --pre affected set selects for every change to
      the plan engine; a registry row would duplicate them.
  - step: 2
    phase: pre-deploy
    action: Row dispatch, containment and per-derivation edge cases.
    command: bin/venv-python -m pytest -q tests/roadmap/plan_lint tests/roadmap/plan_obligations
    expected: exit 0; every test passes and none fails (the count is not pinned).
    fix_if: Fix the code, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: Ordinary unit tests selected by the --pre affected set; a registry row would duplicate them.
  - step: 3
    phase: pre-deploy
    action: The new scope field.
    command: bin/venv-python -m pytest -q tests/roadmap/plan_document
    expected: exit 0; every test passes.
    fix_if: Fix the model, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: Ordinary unit tests selected by the --pre affected set.
  - step: 4
    phase: pre-deploy
    action: The closure seam and the gating leg of the plan check.
    command: >-
      bin/venv-python -m pytest -q tests/checks/deps/validate_pre_glob_closure
      tests/checks/roadmap/test_validate_plan_scope_closure.py
    expected: exit 0; every test passes, including the existing shards' nodes.
    fix_if: Fix the code, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: plan-lint-gating-derivations-fail-net-new-plans
  - step: 5
    phase: pre-deploy
    action: The advisory report on this plan itself (dogfood; no reader in CI, so the acceptance row prints UNREACHABLE or a verdict).
    command: bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-plan-lint.yaml
    expected: >-
      exit 0; prints "no unmet registration obligations", a "derived findings (advisory)" section listing
      scripts/roadmap/plan_document.py as NEAR_CAP, and no gating line.
    fix_if: A gating line names a companion this plan omits -- STOP (deviation_trigger branch b); never edit scope here.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Sizes, approved text and the existing gates on every scope file.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug plan-lint &&
      bin/venv-python -m scripts.validate --pre
    expected: >-
      exit 0; prints "APPROVED-TEXT OK" and "All checks passed." (validate_sloc_limits,
      validate_structural_size_limits, validate_pre_glob_closure and validate_plan_scope_closure among them).
    fix_if: >-
      A size crossing: apply the relief named in that file's scope row. An approved-text mismatch: restore the sidecar
      text. Never add a budget entry.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Lint and format on the changed Python files.
    command: >-
      bin/venv-python -m ruff check scripts/roadmap scripts/checks/deps/validate_pre_glob_closure.py
      scripts/checks/roadmap/_manifest.py tests/test_plan_obligations.py tests/roadmap tests/checks/deps/validate_pre_glob_closure
      tests/checks/roadmap/test_validate_plan_scope_closure.py && bin/venv-python -m ruff format --check scripts/roadmap
      scripts/checks/deps/validate_pre_glob_closure.py tests/test_plan_obligations.py tests/roadmap
      tests/checks/deps/validate_pre_glob_closure tests/checks/roadmap/test_validate_plan_scope_closure.py
    expected: exit 0.
    fix_if: Run ruff format and fix lint.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Discharge the handoff obligation with a full-tier run to completion.
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test, relax an assertion or add a baseline. A failure
      outside scope becomes a rec via scripts.ops_data_portal (Decisions 55, 59).
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: Confirm the four bundled recs are closed (the squash-merge Resolves trailer closes them).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      ids=['rec-4383','rec-4751','rec-4752','rec-4754'];
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ids); print(sorted((x['id'], x['status']) for x in r), m)"
    expected: Prints all four with status closed and an empty missing list.
    fix_if: Any still open - read the ci.yml closure job log and close it with update_rec (Decision 84 I-4).
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/roadmap/plan_lint/companions.py
    behavior: The four gating derivations name the companion each forces.
    verification_step: 1
    test_selector: tests/test_plan_obligations.py::test_scoped_import_edge_and_baselined_check_obligate_companions
    red_green_expectation: red before (node absent on main), green after.
  - source: scripts/roadmap/plan_lint/headroom.py
    behavior: NEAR_CAP for a non-Python governed file and the unbuilt plans editing the same file.
    verification_step: 1
    test_selector: tests/test_plan_obligations.py::test_near_cap_report_names_unbuilt_plans_editing_the_same_file
    red_green_expectation: red before (node absent on main), green after.
  - source: scripts/roadmap/plan_lint/acceptance.py
    behavior: An undecidable bundled-rec acceptance is reported; a reader failure is UNREACHABLE, never a raise.
    verification_step: 1
    test_selector: tests/test_plan_obligations.py::test_undecidable_bundled_rec_acceptance_is_reported
    red_green_expectation: red before (node absent on main), green after.
  - source: scripts/roadmap/plan_lint/__init__.py
    behavior: Gating versus advisory comes from the contract row; unmatched rows and raising derivations are findings.
    verification_step: 2
    test_selector: tests/roadmap/plan_lint/test_rows_and_dispatch.py
    red_green_expectation: red before (module absent on main), green after.
  - source: scripts/roadmap/plan_lint/_rows.py
    behavior: A malformed derived_findings section is a finding, never a raise.
    verification_step: 2
    test_selector: tests/roadmap/plan_lint/test_rows_and_dispatch.py
    red_green_expectation: red before (module absent on main), green after.
  - source: scripts/roadmap/plan_obligations.py
    behavior: evaluate_plan carries gating derived findings; the report carries the advisory section; the CLI exits 0.
    verification_step: 4
    test_selector: tests/checks/roadmap/test_validate_plan_scope_closure.py
    red_green_expectation: red before (a gating derived finding does not fail the check on main), green after.
  - source: scripts/roadmap/plan_document.py
    behavior: scope[].new_imports accepted and validated.
    verification_step: 3
    test_selector: tests/roadmap/plan_document/test_scope_new_imports.py
    red_green_expectation: red before (extra="forbid" refuses the key on main), green after.
  - source: scripts/checks/deps/validate_pre_glob_closure.py
    behavior: uncovered_after_edges reports only paths a declared edge newly uncovers.
    verification_step: 4
    test_selector: tests/checks/deps/validate_pre_glob_closure/test_uncovered_after_edges.py
    red_green_expectation: red before (seam absent on main), green after.
  - source: scripts/checks/roadmap/_manifest.py
    behavior: validate_plan_scope_closure's pre_globs cover its new import closure.
    verification_step: 6
    command: bin/venv-python -m scripts.validate --pre
    red_green_expectation: red before (validate_pre_glob_closure reports the uncovered plan_lint imports without the glob), green after.
constraints:
  - >-
    The plan-obligations.yaml text is the operator-approved sidecar docs/plans/approved/plan-lint.yaml (digest
    1902f44b65633f9cf0afbb7a012cd1c15de3b47266439610b34ce4870e704c51): apply it verbatim; any other wording goes back to
    the operator before merge.
  - >-
    Gating means joining validate_plan_scope_closure's existing verdict for net-new plans; no new check, CI job or tier
    (TAP: the fast tier gates PRs; git-ops.yaml source_admission). The reader-backed acceptance row never runs in CI.
  - >-
    Decompose by default: no entry is added to config/sloc_budgets.yaml or config/structural_size_budgets.yaml
    (Decisions 128, 165, 166).
  - No rescue agents or workaround loops (Decision 55).
