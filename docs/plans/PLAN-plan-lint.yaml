schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-lint"
intent: >-
  Make the plan-time report find, before critique, the companions and caps that builds keep stopping on: the manifest
  pre_globs a new import forces, the accounting-baseline strike a baselined check's edit forces, the amendment entry a
  Class D contract edit owes, the disposition a graduated registry shard naming a changed test owes (gating, joining
  validate_plan_scope_closure for net-new plans), and the size headroom, unbuilt plans on the same file, undecidable
  bundled-rec acceptance and hand-written freeze tests (advisory). Deterministic reads of plan plus repo only: nothing
  new runs in CI beyond the existing plan check, and no code is built to test a plan (operator ruling 2026-10-30).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-lint.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Project Review joint
  review area B (BUILD-SEAMS row B); closes no roadmap criterion. Sibling plan PLAN-plan-defect-loop (same plan PR)
  carries the wording check, the plan-defect alarm and the skill texts, and builds after this one.
closes_criteria: []
scope:
  - file: docs/contracts/plan-obligations.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar: the header comment's scope sentence; description sentence naming derived_findings; the re_ratification_trigger disjunct
      "derived_findings_gating_rows_count >= 6"; one new amendment_log entry (field_add, records the re-ratification
      review outcome: stays provisional_v0); the derived_findings section (eight rows, four gating) and frozen_companions
      (one row, the preflight key set). 132 -> 197 effective lines of 500 (contracts class, Decision 166).
  - file: scripts/roadmap/plan_lint/__init__.py
    action: Create
    purpose: >-
      Facade. derive(plan: dict, root: Path, *, report: bool = False) -> LintResult(gating, advisory: list[str]); a
      STATIC dispatch table maps all eight row ids to derivations, acceptance_decidable included: it maps to
      _acceptance_lines here, which spawns acceptance.py as a subprocess. It reads the rows through _rows and runs each
      row by its own `gating` flag (never a second copy in code): gating rows always, advisory rows only when
      report=True, so the CI check path (report=False) never runs git log, the acceptance subprocess or anything
      network-backed, and reads registry shards only when the plan has a Modify or Delete tests/**.py row;
      _acceptance_lines spawns nothing when bundled_recommendations is empty. A contract row with no table entry or a
      table entry with no row becomes one gating finding naming it; a derivation exception becomes one finding naming
      it on its own row's side (gating for a gating row, advisory for an advisory row, so build_report prints it).
      Never raises.
  - file: scripts/roadmap/plan_lint/_rows.py
    action: Create
    purpose: >-
      load_rows(contract_path) -> (rows, frozen_companions, error): reads derived_findings.rows and frozen_companions
      from docs/contracts/plan-obligations.yaml; a missing or malformed section yields an error string, never a raise.
  - file: scripts/roadmap/plan_lint/companions.py
    action: Create
    purpose: >-
      The four gating derivations plus frozen_companions. pre_glob_closure: edges = (row module, each new_imports
      module) for Create/Modify .py rows; findings from validate_pre_glob_closure.uncovered_after_edges, each naming the
      Entry and the uncovered path and requiring scripts/checks/<domain>/_manifest.py in scope (with no new_imports
      declared, no import view is built on the CI path); plus, only when report=True, an advisory line per scoped
      module gated Entries reach when no new_imports is declared (the import graph costs about 6 s cold). accounting_baseline_strike: Modify rows whose
      file is the module (Entry.module from registry._ALL_ENTRIES, no check import) of a name in
      config/check_accounting_baseline.yaml `entries` require that file in scope. class_d_amendment_entry: Modify rows on
      docs/contracts/*.yaml whose parsed contract is class_d shape (scripts/checks/contracts/_population.classify_file,
      the population validate_contract_drift's amendment check runs on), with or without an amendment_log yet, require
      the token amendment_log in that row's purpose; Class A/B/C contracts are left to validate_contract_drift's own field rule. registry_shard_disposition: Modify/Delete rows on tests/**.py named by a shard's check_spec.node_id
      prefix or check_spec.command text require that shard's path in scope or its check_id anywhere in the plan text.
      frozen_companions: names the test and breaks_when for each scoped source matching a row's source glob.
  - file: scripts/roadmap/plan_lint/headroom.py
    action: Create
    purpose: >-
      size_headroom: per Modify row, SLOC (non-blank, non-comment lines, as validate_sloc_limits counts) against
      config/sloc_budgets.yaml else 500 for .py; effective_lines and the class or roster limit from
      scripts.checks.structural._classify for governed non-Python files; bytes against a path key of
      config/prose_budgets.yaml for prose files; NEAR_CAP when headroom < 5% of the limit. A prose row's line adds
      that the ratchet (#1773) pins every entry to its measured size, so a shrinking edit needs only its entry lowered
      and growth needs compaction or a `# raise-approved` marker. unbuilt_same_file: plans with
      schema_version >= 4, implementation_declared not true and added in the last 30 days (ONE `git log --diff-filter=A
      --since=30.days --name-only -- docs/plans/` call, never one per plan) whose scope lists the same file, excluding
      the plan under report.
  - file: scripts/roadmap/plan_lint/acceptance.py
    action: Create
    purpose: >-
      acceptance_decidable, run ONLY as a subprocess (`sys.executable -m scripts.roadmap.plan_lint.acceptance <rec ids>`,
      cwd ROOT, timeout 60 s) by plan_lint's _acceptance_lines (report=True only) and imported by no module, so neither the reader nor
      scripts.executor.acceptance_lint (whose deferred imports reach about 57 executor, ops-portal and DuckLake paths)
      enters any gated Entry's import closure. Its main fetches the recs through src.common.ducklake_reader_client and
      runs lint_acceptance_command(require_decidable=True) on each acceptance, printing one line per rec; any failure,
      non-zero exit or timeout becomes one advisory UNREACHABLE line in the report, never a raise.
  - file: scripts/roadmap/plan_obligations.py
    action: Modify
    purpose: >-
      evaluate_plan appends plan_lint.derive(..., report=False).gating (prefixed with the plan name) after the
      registration findings; build_report calls derive(..., report=True) and adds a "derived findings (advisory)"
      section with derive's advisory lines (the acceptance runner's among them); the module docstring names the new
      seam.
      The CLI still always exits 0. validate_test_coverage maps this module to tests/test_plan_obligations.py alone, so
      the new lines are covered from that file. 437 -> about 460 lines (368 -> about 385 SLOC).
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      ScopeEntry gains one field line, `new_imports: list[Annotated[str, StringConstraints(pattern=...)]] =
      Field(default_factory=list)`, each item a dotted first-party module name (pattern
      ^(scripts|src|tests)(\.[A-Za-z_][A-Za-z0-9_]*)+$), with no new validator: 485 -> about 489 SLOC of 500 (NEAR_CAP,
      reported). No relief step: PLAN-plan-defect-loop's GateRound move takes the file to about 463. If the rebased
      edit would cross 500 SLOC, STOP (deviation_trigger) -- never an unplanned decomposition or a budget raise.
  - file: scripts/checks/deps/validate_pre_glob_closure.py
    action: Modify
    purpose: >-
      Public seam uncovered_after_edges(edges: Iterable[tuple[str, str]], new_paths: Mapping[str, str], root: Path) ->
      dict[str, list[str]]: copies the import view, adds each edge, and returns, per gated Entry name, the closure paths
      no pre_glob matches that the unmodified view does not already report. A target module absent from the tree
      resolves through new_paths (dotted name -> the plan's Create row path, `x/__init__.py` when the plan creates
      that, else `x.py`), because _module_to_repo_path returns None for a missing file and would drop it. Reuses
      _closure_view, _closure_modules, _gated_entries and _glob_match; the registered check's behaviour is unchanged.
  - file: scripts/checks/roadmap/_manifest.py
    action: Modify
    purpose: >-
      validate_plan_scope_closure's pre_globs gain exactly the per-path or per-directory globs validate_pre_glob_closure
      reports for the new import closure (plan_lint -> validate_pre_glob_closure, registry, structural._classify and
      contracts._population and their imports; measured at critique round 3: 11 paths per Entry once acceptance is a
      subprocess, none an executor, ops-portal or DuckLake path), never `scripts/**`, `src/**`
      or `scripts/checks/**` (TestPaydownDirection). The pre_glob_closure obligation, applied to this plan by hand
      because its own field lands here.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      validate_admin_root_premerge_gate imports scripts.roadmap.plan_obligations (validate_admin_root_premerge_gate.py
      line 24) and globs only scripts/roadmap/plan_obligations.py, so its pre_globs gain scripts/roadmap/plan_lint/**
      plus the same closure globs as the row above, exactly as validate_pre_glob_closure reports them.
  - file: tests/test_plan_obligations.py
    action: Modify
    purpose: >-
      The six module-level tests the bundled recs' acceptances name: test_near_cap_structural_scope_row_is_reported,
      test_near_cap_report_names_unbuilt_plans_editing_the_same_file,
      test_scoped_import_edge_and_baselined_check_obligate_companions, test_undecidable_bundled_rec_acceptance_is_reported
      (acceptance.main runs in-process with its fetch injected; the report's _acceptance_lines is stubbed),
      test_class_d_contract_scope_row_obligates_amendment_entry, test_registry_shard_naming_a_scoped_test_is_reported.
      Relief (420 SLOC + about 60): the six stay thin by building their fixture repos and plans through
      tests/fixtures/plan_lint_fixtures.py, and TestBuildReport, the one class whose removal keeps plan_obligations.py at
      100% coverage from this file (measured at critique round 3), moves unchanged to
      tests/roadmap/plan_obligations/test_build_report.py; TestDeriveFindingsEdgeCases and
      TestEnforcedElsewherePointerEdgeCases stay, because they cover plan_obligations.py's defensive branches. About 470
      SLOC after; if the rebased measure would cross 500, STOP (deviation_trigger), never a budget entry. Shards naming this file stay valid and are kept: plan-obligations-accounting-pointer-reported,
      plan-obligations-grammar-guard-g1, plan-obligations-grammar-guard-g2, plan-obligations-grammar-guard-g3,
      plan-obligations-grammar-guard-g4, plan-obligations-grammar-guard-g5, plan-obligations-live-contract-grammar-clean,
      plan-obligations-workflow-taxonomy-rule.
  - file: tests/roadmap/plan_obligations/__init__.py
    action: Create
    purpose: Package marker, matching tests/roadmap/plan_document/.
  - file: tests/roadmap/plan_obligations/test_build_report.py
    action: Create
    purpose: >-
      TestBuildReport moved with a byte-identical body, plus copies of any module helper it calls (relief for
      tests/test_plan_obligations.py; no shard names it).
  - file: tests/fixtures/plan_lint_fixtures.py
    action: Create
    purpose: >-
      Builders for the tmp-path fixture repos and plan dicts the six acceptance tests and tests/roadmap/plan_lint share
      (a contract with derived_findings rows, a baselined check module, a Class D contract, a graduated shard naming a
      test, a prose budget entry, an unbuilt plan), so the test bodies stay thin.
  - file: tests/roadmap/plan_lint/__init__.py
    action: Create
    purpose: Package marker.
  - file: tests/roadmap/plan_lint/test_rows_and_dispatch.py
    action: Create
    purpose: >-
      A row with no derivation and a derivation with no row each give one gating finding; the gating flag is read from
      the contract (a fixture contract flipping size_headroom to gating moves its lines); a raising derivation is
      contained; a malformed derived_findings section is a finding, never a raise.
  - file: tests/roadmap/plan_lint/test_derivations.py
    action: Create
    purpose: >-
      Edge cases per derivation on tmp-path fixture repos: pre_glob edge to a not-yet-created module (both .py and
      __init__.py forms); an already-covered edge gives nothing; a baselined check's module Modify; a Class C contract
      with an amendment_log gives nothing; a Class D contract with no amendment_log yet is named; a shard kept by check_id; NEAR_CAP boundary at exactly 5%; an unbuilt plan
      older than 30 days is not named, nor is the plan under report; a matching frozen_companions row is named
      (test_frozen_companion_is_named); _acceptance_lines returns a child module's printed lines (its module argument
      pointed at a module importable from ROOT: a `__main__` block in tests/fixtures/plan_lint_fixtures.py), gives UNREACHABLE on a timeout or non-zero exit, and spawns nothing with no bundled
      recs; a raising advisory derivation lands in advisory; report=False runs no advisory row.
  - file: tests/roadmap/plan_document/test_scope_new_imports.py
    action: Create
    purpose: new_imports accepted on any schema_version, defaults empty, refuses a non-dotted or non-first-party name.
  - file: tests/checks/deps/validate_pre_glob_closure/test_uncovered_after_edges.py
    action: Create
    purpose: >-
      The seam reports a newly uncovered path for an Entry whose closure gains the edge, nothing for an edge outside
      every gated closure, and nothing that the unmodified view already reports; validate_pre_glob_closure's own
      verdict on the live tree is unchanged.
  - file: tests/checks/roadmap/test_validate_plan_scope_closure.py
    action: Modify
    purpose: >-
      New class TestDerivedFindingsGate: a net-new v4+ plan with a gating derived finding fails the check; an
      advisory-only finding never does. TestGatingUnchanged's docstring is reworded to say the registration verdict is
      unchanged and derived gating rows add to it (its assertions hold: its fixture has no derived finding). Shards
      naming this file are kept: plan-obligations-enforced-elsewhere-never-gates,
      plan-obligations-grammar-leg-unconditional, plan-scope-closure-accounting-declared.
bundled_recommendations: [rec-4383, rec-4751, rec-4752, rec-4754]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/contracts/plan-obligations.yaml carries exactly the approved sidecar text (validate_merge_step's approved-text
    binding passes on the implement PR) and stays <= 500 effective lines. VP step 6.
  - >-
    For a net-new schema_version >= 4 IMPLEMENTATION plan, validate_plan_scope_closure fails on each gating derived
    finding (pre_glob_closure, accounting_baseline_strike, class_d_amendment_entry, registry_shard_disposition) and
    never on an advisory one. VP steps 1, 2 and 4.
  - >-
    `plan_obligations --plan` prints the advisory section: size headroom with NEAR_CAP, unbuilt plans on the same file,
    undecidable bundled-rec acceptance (or UNREACHABLE), and frozen companions; it always exits 0. VP steps 1 and 5.
  - >-
    PlanDocument accepts scope[].new_imports; validate_pre_glob_closure's verdict on the live tree is unchanged. VP
    steps 2, 3 and 6.
  - >-
    plan_document.py, plan_obligations.py and tests/test_plan_obligations.py each stay <= 500 SLOC with no budget
    entry added. VP step 6.
  - Every bundled rec's own acceptance command exits 0 (VP step 1), and each is closed after merge (VP step 9).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The bundled recs' acceptance nodes.
    command: >-
      bin/venv-python -m pytest -q
      tests/test_plan_obligations.py::test_near_cap_structural_scope_row_is_reported
      tests/test_plan_obligations.py::test_near_cap_report_names_unbuilt_plans_editing_the_same_file
      tests/test_plan_obligations.py::test_scoped_import_edge_and_baselined_check_obligate_companions
      tests/test_plan_obligations.py::test_undecidable_bundled_rec_acceptance_is_reported
      tests/test_plan_obligations.py::test_class_d_contract_scope_row_obligates_amendment_entry
      tests/test_plan_obligations.py::test_registry_shard_naming_a_scoped_test_is_reported
    expected: exit 0; six tests pass. Red before (on main none of the six nodes exists).
    fix_if: A derivation differs from scope; fix the code, never the assertion.
    hermetic: true
    expected_literals: ["6 passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Ordinary unit tests in tests/test_plan_obligations.py, which the --pre affected set selects for every change to
      the plan engine; a registry row would duplicate them.
  - step: 2
    phase: pre-deploy
    action: Row dispatch, containment, per-derivation edge cases and the closure seam.
    command: >-
      bin/venv-python -m pytest -q tests/roadmap/plan_lint tests/roadmap/plan_obligations
      tests/checks/deps/validate_pre_glob_closure/test_uncovered_after_edges.py
    expected: exit 0; every test passes and none fails (the count is not pinned).
    fix_if: Fix the code, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Edge-case suites across three new files whose test counts grow as cases are added; the gate-facing behaviour is
      graduated once in VP step 4, and the --pre affected set runs these on any change to plan_lint, plan_obligations or
      validate_pre_glob_closure.
  - step: 3
    phase: pre-deploy
    action: The new scope field.
    command: bin/venv-python -m pytest -q tests/roadmap/plan_document
    expected: exit 0; every test passes.
    fix_if: Fix the model, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: waive
    graduation_waiver_reason: >-
      A model-field test file; every plan validate_plan_documents loads exercises the field, and the --pre affected set
      runs this directory on any plan_document.py change.
  - step: 4
    phase: pre-deploy
    action: The gating leg of the plan check (one selector, so the graduated registry row holds one node).
    command: bin/venv-python -m pytest -q "tests/checks/roadmap/test_validate_plan_scope_closure.py::TestDerivedFindingsGate"
    expected: >-
      exit 0; every test passes. Red before: the class is absent on main (the existing suites in this file re-run in VP
      step 6's --pre).
    fix_if: Fix the code, never the assertion.
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: plan-lint-gating-derivations-fail-net-new-plans
  - step: 5
    phase: pre-deploy
    action: The advisory report on this plan itself (dogfood; no reader in CI, so the acceptance row prints UNREACHABLE or a verdict).
    command: bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-plan-lint.yaml
    expected: >-
      exit 0; prints "no unmet registration obligations", a "derived findings (advisory)" section listing
      scripts/roadmap/plan_document.py as NEAR_CAP, and no gating line.
    fix_if: A gating line names a companion this plan omits -- STOP (deviation_trigger branch b); never edit scope here.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Sizes, approved text and the existing gates on every scope file.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug plan-lint &&
      bin/venv-python -m scripts.validate --pre
    expected: >-
      exit 0; prints "APPROVED-TEXT OK" and "All checks passed." (validate_sloc_limits,
      validate_structural_size_limits, validate_pre_glob_closure and validate_plan_scope_closure among them).
    fix_if: >-
      A size crossing: apply the relief that file's scope row names, or STOP where it names none. An approved-text
      mismatch: restore the sidecar text. Never add a budget entry.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Lint and format on the changed Python files.
    command: >-
      bin/venv-python -m ruff check scripts/roadmap scripts/checks/deps/validate_pre_glob_closure.py
      scripts/checks/roadmap/_manifest.py scripts/checks/verification/_manifest.py tests/test_plan_obligations.py
      tests/fixtures/plan_lint_fixtures.py tests/roadmap tests/checks/deps/validate_pre_glob_closure
      tests/checks/roadmap/test_validate_plan_scope_closure.py
      && bin/venv-python -m ruff format --check scripts/roadmap scripts/checks/deps/validate_pre_glob_closure.py
      scripts/checks/roadmap/_manifest.py scripts/checks/verification/_manifest.py tests/test_plan_obligations.py
      tests/fixtures/plan_lint_fixtures.py tests/roadmap tests/checks/deps/validate_pre_glob_closure
      tests/checks/roadmap/test_validate_plan_scope_closure.py
    expected: exit 0.
    fix_if: Run ruff format and fix lint.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Discharge the handoff obligation with a full-tier run to completion.
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test, relax an assertion or add a baseline. A failure
      outside scope becomes a rec via scripts.ops_data_portal (Decisions 55, 59).
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: Confirm the four bundled recs are closed (the squash-merge Resolves trailer closes them).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      ids=['rec-4383','rec-4751','rec-4752','rec-4754'];
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ids); print(sorted((x['id'], x['status']) for x in r), m)"
    expected: Prints all four with status closed and an empty missing list.
    fix_if: Any still open - read the ci.yml closure job log and close it with update_rec (Decision 84 I-4).
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/roadmap/plan_lint/companions.py
    behavior: pre_glob_closure and accounting_baseline_strike name the companion each forces.
    verification_step: 1
    test_selector: tests/test_plan_obligations.py::test_scoped_import_edge_and_baselined_check_obligate_companions
    red_green_expectation: red before (node absent on main), green after.
  - source: scripts/roadmap/plan_lint/companions.py
    behavior: A Class D contract Modify row owes its amendment_log entry.
    verification_step: 1
    test_selector: tests/test_plan_obligations.py::test_class_d_contract_scope_row_obligates_amendment_entry
    red_green_expectation: red before (node absent on main), green after.
  - source: scripts/roadmap/plan_lint/companions.py
    behavior: A graduated shard naming a changed test needs a disposition.
    verification_step: 1
    test_selector: tests/test_plan_obligations.py::test_registry_shard_naming_a_scoped_test_is_reported
    red_green_expectation: red before (node absent on main), green after.
  - source: scripts/roadmap/plan_lint/companions.py
    behavior: A scoped source matching a frozen_companions row names its freeze test.
    verification_step: 2
    test_selector: tests/roadmap/plan_lint/test_derivations.py::test_frozen_companion_is_named
    red_green_expectation: red before (module absent on main), green after.
  - source: docs/contracts/plan-obligations.yaml
    behavior: Every derived_findings row has a derivation, and its gating flag decides gating versus advisory.
    verification_step: 2
    test_selector: tests/roadmap/plan_lint/test_rows_and_dispatch.py
    red_green_expectation: red before (no derived_findings section or plan_lint on main), green after.
  - source: scripts/roadmap/plan_lint/headroom.py
    behavior: NEAR_CAP for a non-Python governed file and the unbuilt plans editing the same file.
    verification_step: 1
    test_selector: tests/test_plan_obligations.py::test_near_cap_report_names_unbuilt_plans_editing_the_same_file
    red_green_expectation: red before (node absent on main), green after.
  - source: scripts/roadmap/plan_lint/acceptance.py
    behavior: acceptance.main flags an undecidable bundled-rec acceptance, and the report carries the runner's lines.
    verification_step: 1
    test_selector: tests/test_plan_obligations.py::test_undecidable_bundled_rec_acceptance_is_reported
    red_green_expectation: red before (node absent on main), green after.
  - source: scripts/roadmap/plan_lint/__init__.py
    behavior: _acceptance_lines returns the child's lines, UNREACHABLE on timeout or failure, and spawns nothing with no recs.
    verification_step: 2
    test_selector: tests/roadmap/plan_lint/test_derivations.py
    red_green_expectation: red before (module absent on main), green after.
  - source: scripts/roadmap/plan_lint/__init__.py
    behavior: Gating versus advisory comes from the contract row; unmatched rows and raising derivations are findings.
    verification_step: 2
    test_selector: tests/roadmap/plan_lint/test_rows_and_dispatch.py
    red_green_expectation: red before (module absent on main), green after.
  - source: scripts/roadmap/plan_lint/_rows.py
    behavior: A malformed derived_findings section is a finding, never a raise.
    verification_step: 2
    test_selector: tests/roadmap/plan_lint/test_rows_and_dispatch.py
    red_green_expectation: red before (module absent on main), green after.
  - source: scripts/roadmap/plan_obligations.py
    behavior: build_report carries the derived findings (advisory) section with a NEAR_CAP line.
    verification_step: 1
    test_selector: tests/test_plan_obligations.py::test_near_cap_structural_scope_row_is_reported
    red_green_expectation: red before (node absent on main), green after.
  - source: scripts/roadmap/plan_obligations.py
    behavior: evaluate_plan carries gating derived findings into validate_plan_scope_closure's verdict.
    verification_step: 4
    test_selector: tests/checks/roadmap/test_validate_plan_scope_closure.py::TestDerivedFindingsGate
    red_green_expectation: red before (a gating derived finding does not fail the check on main), green after.
