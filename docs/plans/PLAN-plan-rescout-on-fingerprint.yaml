schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "plan-rescout-on-fingerprint"
intent: >-
  Make the scout-input fingerprint (scripts/roadmap/plan_fingerprint.py, built by PLAN-scout-input-fingerprint) decide
  when interactive /plan re-runs the decision scout, replacing the judged "material change", and make the plan check
  enforce it: validate_plan_documents fails with "re-scout required" when a newly added plan, or a modified plan whose
  own fingerprint moved, has a last decision-scout row that does not equal the fingerprint recomputed on the checked-out
  tree (on a PR, the merge with main), and it fails closed on every path where it cannot tell. A newly added plan must
  also declare the newest PlanDocument schema_version the tree supports (rec-5102), so no plan can dodge the barrier by
  declaring an older version. A last decision-scout row of BLOCK always fails, with no exemption; a new Decision
  amending Decision 83 records that narrowing and the operator's admin bypass merge as its release valve. Plan 2 of 2 of T4.32 c4's interactive half (rec-4490); the Actions legs are rec-5103's.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-rescout-on-fingerprint.yaml
phase: T4.32
cites: [dec:83, dec:86, dec:163, dec:170, dec:181, dec:205, dec:217, dec:226, dec:229, dec:235, dec:244, dec:246]
scope:
  - file: scripts/checks/roadmap/_plan_rescout_barrier.py
    action: Create
    purpose: >-
      The re-scout barrier, kept out of validate_plan_documents.py like _plan_sidecar_approval.py, with its own mirror
      test. It imports scripts.roadmap.plan_fingerprint (load_tree, projection, fingerprint, FingerprintError) and
      scripts.roadmap.plan_edges (PlanEdgesError) inside barrier(), so an ImportError there is a failure "scout-input
      fingerprint module cannot be imported: <error>", never a skip or a pass; it never re-derives the payload or the edges (T4.32 c4, THE single extractor). Each value is
      fingerprint(projection(yaml.safe_load(plan text), tree, approved_words.parse_sidecar(sidecar text) or None)), the
      inputs the plan_fingerprint CLI assembles for the same plan and root with no --with-cites; the loaded PlanDocument
      in docs supplies only schema_version and gate_rounds. Entry point
      barrier(entries, docs, root, base, push_context, read_base) -> BarrierResult(failures, warnings, examined, compared),
      where entries are the status-aware (status, path) pairs of docs/plans/PLAN-*.yaml, docs maps a plan filename to its
      loaded PlanDocument, base is the diff base (None when unresolved), push_context is
      _common.push_context_base(root) is not None, and read_base(rel) returns the file text at base or None (default: git show base:rel, None on a non-zero exit;
      the seam the tests drive). Rules, FINGERPRINT_MIN_SCHEMA_VERSION = 6:
      (1) An ADDED plan (status A or ??) at schema_version >= 6 is compared. (2) A MODIFIED plan (status M): a
      schema_version lower than at base fails ("schema_version lowered from B to H"); at head >= 6 it computes the base
      fingerprint from the base plan text and the base sidecar text (docs/plans/approved/<base plan's slug>.yaml at base, None
      when absent) and the head fingerprint from the head plan and head sidecar, both over ONE load_tree(root) of the head
      tree, and is compared only when the two differ; an unreadable or absent base plan is compared as if added. A
      modified plan below 6 is never compared (it counts toward examined only for the lowered-version and BLOCK checks) (operator ruling 2026-11-12, fork 2B; the gap is recorded on rec-5102 and
      in the ledger). (3) Compare: the last gate_rounds row with gate decision-scout; none fails "re-scout required: no
      decision-scout row". (3b) BLOCK, before and independent of (2) and (3): EVERY examined plan (added or modified, at
      any schema_version, whether or not its fingerprint moved) whose last decision-scout row has verdict BLOCK fails
      "re-scout required: the last decision-scout row is BLOCK" whatever its value, with no exemption, escalated or
      accept-with-deferral rows included; its message ends "(re-run the decision scout after the pivot; a BLOCK the
      operator accepted is merged only by the operator's admin bypass in the GitHub UI)". No plan on main ends in a BLOCK
      row (checked 2026-11-12), so the rule binds every plan a PR adds or changes. Operator ruling 2026-11-12: a BLOCK binds everyone but the operator, whose release valve is the
      main-protection ruleset's Repository Admin bypass (bypass_mode always, audit-logged by GitHub); agent merges of a
      red PR are refused once PLAN-merge-requires-green-checks builds (rec-4080 until then), and the post-merge push run only warns, so main stays green.
      T4.32 c6's approved override run is the later in-band route (rec-5128); a row whose scout_input_fingerprint is None fails "re-scout required: the last decision-scout
      row records no scout_input_fingerprint"; a value unequal to the recomputed one fails "re-scout required: the last
      decision-scout row records <recorded>; this tree gives <recomputed>"; every message names the plan file and ends
      with the remedy "(re-run the decision scout on the plan as it is now and record the value its report prints)".
      Any FingerprintError, PlanEdgesError, ApprovedTextError, OSError, UnicodeDecodeError or YAML error while loading
      the tree or computing either fingerprint is a failure "<plan>: scout-input fingerprint cannot be computed:
      FINGERPRINT-ERROR: <reason>", never "equal" and never skipped; no broad except. (4) Routing: every finding is a
      failure unless push_context, where it is a warning (a Decision changed on main by an unrelated merge must not
      turn main red; the PR check is the gate). (5) Fail closed: when base is None and not push_context the result
      carries the failure "cannot resolve a diff base, so the re-scout barrier cannot tell which plans are new or
      changed" (a warning in push context). The barrier also takes diff_count, the number of tracked entries (status A, M or D; never the untracked ?? leg)
      in the whole status-aware diff (every path, not only plans): on a pull_request event (GITHUB_EVENT_NAME) with base resolved and
      diff_count 0 it fails "the PR diff lists no file (git diff failed or returned nothing), so the re-scout barrier
      cannot tell which plans are new or changed", because a real PR's diff is never empty and get_status_aware_diff
      returns nothing when git diff fails (scripts/checks/_common.py:181). Off a PR an empty diff is normal (a branch
      level with main) and passes; the PR run is the gate. Under the plans_dir test seam entries come only from
      added_plan_names and modified_plan_names, diff_count is the number of names given, and the base-None and
      empty-diff failures apply only when the names passed are non-empty (so plans_dir callers that pass none or an empty set,
      such as tests/roadmap/plan_document/test_loader_cli.py and tests/test_checks_registry_test_obligations.py, are
      unaffected by git state). (6) The tree is loaded lazily, once, only when
      some plan needs a fingerprint. (7) examined counts every added or modified plan file seen, compared counts the
      comparisons made; an added plan at >= 6 that reaches the end uncompared is a failure ("<plan>: added at
      schema_version N but not compared"), so a bug in the routing cannot pass silently.
    new_imports: [scripts.roadmap.plan_fingerprint, scripts.roadmap.plan_edges, scripts.roadmap.approved_words, scripts.checks._common]
