      GITHUB_EVENT_NAME and, when plans_dir is given, added_plan_names and modified_plan_names; failures join errors,
      warnings join advisories, and the line is printed. The plan_document ImportError branch and the empty-plans-dir
      early return are unchanged and keep their own lines. (c) A new test seam modified_plan_names: set[str] | None =
      None beside added_plan_names, used only when plans_dir is given. _added_plan_names(), _new_plan_version_failures
      and _MIN_NEW_PLAN_SCHEMA_VERSION = 5 stay exactly as they are: the constant still bounds _gate_round_gaps,
      _wording_check_gaps, _approval_gaps and the sidecar_unchecked advisory, so every v5 plan stays bound by Decision
      246 cl.3 (scout WARN, Decision 235). Every new line runs under the existing mirror test with run stubbed, so the
      file keeps 100% mirror coverage. Stays well under 500 SLOC (218 today).
    new_imports: [scripts.checks.roadmap._plan_rescout_wiring]
  - file: scripts/checks/roadmap/_plan_rescout_wiring.py
    action: Create
    purpose: >-
      The plan check's two new legs, kept out of validate_plan_documents.py so every new line is covered by this
      module's own mirror test (validate_test_coverage measures a source only through its mirror, and the existing
      mirror of validate_plan_documents.py stubs run). newest_schema_version() returns
      max(scripts.roadmap.plan_document._SUPPORTED_VERSIONS), importing plan_document inside the function.
      newest_version_findings(added_names, docs, push_context) is the newest-version rule (rec-5102): a newly added plan
