execution_steps:
  - "STEP 0: run VP step 1. Post: PRECONDITION_OK."
  - "STEP 1: place the sidecar's blocks in project-alignment.yaml, exit-criteria-ledger.yaml and docs/DECISIONS.md byte for byte ({{DATE}} = build date, {{N}} = the next free Decision number); regenerate the decisions index. Run VP step 2. Post: APPROVED-TEXT OK."
  - "STEP 2: scripts/checks/roadmap/_plan_rescout_barrier.py and tests/checks/roadmap/test__plan_rescout_barrier.py. Run VP step 3."
  - "STEP 3: validate_plan_documents.py wiring, newest-version rule and seam; scripts/checks/roadmap/_plan_rescout_wiring.py and tests/checks/roadmap/test__plan_rescout_wiring.py; tests/checks/roadmap/test_validate_plan_documents_scout_fingerprint.py, test_validate_plan_documents_latest_format.py and the two changes in test_validate_plan_documents.py its scope row names. Run VP step 4 (VP 5 is red until STEP 4 sets the template to 6)."
  - "STEP 4: the planning skill and plan.md replacements exactly as the scope rows give them; measure the skill and set its prose budget; git mv the retired record; tests/test_planning_skill_scout_fingerprint.py and tests/checks/decisions/test_rescout_block_decision_records.py. Run VP steps 5, 6 and 8 (the template edit, the retargeted assertion and the record retirement land together here)."
  - "STEP 5: VP step 7 (end to end), then validate --pre (VP 9) and the full tier (VP 10). Loop until pass; on an unrecoverable failure stop and RCA (Decision 55)."
  - "STEP 6: post the coordinator-log notice (context), then merge with the squash commit body carrying 'Resolves: rec-4490, rec-5102' as its own paragraph; run VP step 11 after the closure job."
  - "Report: what was implemented, the VP results, the notice link, and that rec-5103, rec-5128 and rec-5129 remain open."
rollback: >-
  Revert the build PR: the barrier and the newest-version rule disappear and the instruction text returns to the judged
  re-scout. Plans written at v6 meanwhile stay valid (plan 1's schema), so a revert breaks nothing already merged.
