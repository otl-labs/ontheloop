      stay exactly as they are: the constant still bounds _gate_round_gaps, _wording_check_gaps, _approval_gaps and the
      sidecar_unchecked advisory, so every v5 plan stays bound by Decision 246 cl.3 (scout WARN, Decision 235).
      run(docs, plan_paths, root, base, push_context, event, added_plan_names=None, modified_plan_names=None) ->
      (failures, warnings, line): without names it builds the barrier's entries (docs/plans/PLAN-*.yaml) and diff_count
      (tracked A, M and D entries of every path; never the untracked ?? leg) from one _common.get_status_aware_diff
      call; with names it uses them (the plans_dir test seam, diff_count the number of names); it passes each plan's
      head text read from the path the loop loaded (a plan that failed its schema load is absent from docs and not
      passed: it has already failed), calls _plan_rescout_barrier.barrier with the default read_base, adds
      newest_version_findings, routes both per the barrier's rule (4), and returns the line " re-scout barrier: E
      plan(s) examined, C compared, F failing" (Decision 170: never a bare PASS) or " re-scout barrier: no added or
      modified plan in this diff".
    new_imports: [scripts.checks.roadmap._plan_rescout_barrier, scripts.checks._common, scripts.roadmap.plan_document]
