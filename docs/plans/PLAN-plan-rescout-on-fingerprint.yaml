acceptance_criteria:
  - "An added plan at schema_version 6 or above fails validate_plan_documents outside push context with \"re-scout required\" when its last decision-scout row's fingerprint is missing or differs from the one recomputed on the checked-out tree, and passes when they are equal."
  - A modified plan at 6 or above is compared only when its base and head fingerprints differ, and a lowered schema_version fails.
  - A plan a PR adds or modifies whose last decision-scout row is BLOCK fails, at any schema_version, whether or not its fingerprint moved, whatever its recorded value and even when the row records an accepted escalation; only the operator's admin bypass merges it.
  - Every error computing a fingerprint, an unresolved diff base outside push context, an empty diff on a pull_request event, and an import failure of the barrier fail the check; nothing on those paths reads as a pass.
  - Every run prints how many plans the barrier examined and compared.
  - A newly added plan below the newest supported schema_version fails outside push context, naming both versions; the floor of 5 and every gate it bounds still bind v5 plans.
  - The planning skill and plan.md say to record the scout's printed fingerprint and to re-scout exactly when it moves; neither says "material to decision alignment" or "changes the proposed approach materially"; the planning skill shrinks and its prose budget ratchets down.
  - project-alignment.yaml, exit-criteria-ledger.yaml and DECISIONS.md equal main plus the approved sidecar's blocks, word for word.
  - A new Decision amending 83 records the BLOCK rule and its release valve, and Decision 83 carries one dated note naming it.
  - skill-template-emits-v5 is retired to entries/deprecated/ as a 100% rename and no live surface names it.
  - rec-4490 and rec-5102 read closed after the merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: plan 1's build (plan_fingerprint) and this plan with its sidecar are on main; branch current."
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:scripts/roadmap/plan_fingerprint.py && git cat-file -e
      origin/main:docs/plans/approved/plan-rescout-on-fingerprint.yaml && git merge-base --is-ancestor origin/main HEAD
      && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: A missing plan_fingerprint.py means plan 1's build has not merged; stop and wait. A missing sidecar means this plan's PR has not merged. A failed ancestry test means a stale branch; merge origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The two contracts and DECISIONS.md are exactly main plus the approved sidecar.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug plan-rescout-on-fingerprint --base origin/main
      --expect fb0ca747310e55bd1db5027ed43a94b44d4f33beb1b190eae17a787bc15457af
    expected: Exit 0, printing APPROVED-TEXT OK. Red before the blocks are placed.
    fix_if: >-
      A word mismatch means a placed block drifted: restore its after text exactly, never edit the sidecar. A digest
      mismatch means the sidecar on main is not the approved one: stop and ask the operator. If PLAN-work-graph-edge-model
      built first and moved an anchor, send a plan-defect report.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A base-relative, one-time binding of this build's diff to its sidecar; validate_merge_step enforces the same binding
      on the build PR's fast tier.
  - step: 3
    phase: pre-deploy
    action: The barrier's rules, including every fail-closed path.
    command: bin/venv-python -m pytest tests/checks/roadmap/test__plan_rescout_barrier.py -q
    expected: All pass. Red before (module and test absent).
    expected_literals: [" passed"]
    fix_if: Fix _plan_rescout_barrier.py; never drop a case or turn a failure into a warning outside push context.
    hermetic: true
    graduation: graduate
    graduation_check_id: plan-rescout-barrier-rules
  - step: 4
    phase: pre-deploy
    action: The new legs' helper and its wiring into validate_plan_documents, with the count line and the empty-diff failure.
    command: >-
      bin/venv-python -m pytest tests/checks/roadmap/test__plan_rescout_wiring.py
      tests/checks/roadmap/test_validate_plan_documents_scout_fingerprint.py -q
    expected: All pass. Red before (both test files and the helper are absent).
    expected_literals: [" passed"]
    fix_if: Fix _plan_rescout_wiring.py or its call in validate_plan_documents.py.
    hermetic: true
    graduation: graduate
    graduation_check_id: plan-rescout-barrier-wired
  - step: 5
    phase: pre-deploy
    action: The newest-version rule, the unchanged floor of 5, and the retargeted template test.
    command: >-
      bin/venv-python -m pytest tests/checks/roadmap/test_validate_plan_documents_latest_format.py
      tests/checks/roadmap/test_validate_plan_documents.py -q
    expected: All pass. Red before (the new file is absent and the retargeted template assertion fails while the template says 5).
    expected_literals: [" passed"]
    fix_if: Fix _plan_rescout_wiring.newest_version_findings or the template line; never change _MIN_NEW_PLAN_SCHEMA_VERSION.
    hermetic: true
    graduation: graduate
    graduation_check_id: new-plans-declare-newest-schema-version
  - step: 6
    phase: pre-deploy
    action: The instruction and contract text says re-scout exactly when the fingerprint moves (rec-4490 acceptance), and the new Decision is recorded.
    command: bin/venv-python -m pytest tests/test_planning_skill_scout_fingerprint.py tests/checks/decisions/test_rescout_block_decision_records.py tests/test_workflow_skill_antidrift.py tests/persona_contracts/test_verdict_persona_contracts.py -q
    expected: All pass. Red before (the rec-4490 test file and the Decision records test are absent).
    expected_literals: [" passed"]
    fix_if: Restore the exact replacement text the scope rows give; never reword a pinned sentence to get green.
    hermetic: true
    graduation: graduate
    graduation_check_id: planning-skill-rescouts-on-fingerprint
  - step: 7
    phase: pre-deploy
    action: >-
      End to end through the real git diff: an untracked v6 fixture plan copied from this plan with a stale fingerprint
      fails the check with "re-scout required"; with the recomputed value recorded it passes; the fixture is removed.
    command: >-
      f=docs/plans/PLAN-zz-rescout-fixture.yaml; trap 'rm -f "$f"' EXIT; bin/venv-python -c "import yaml, sys;
      d=yaml.safe_load(open('docs/plans/PLAN-plan-rescout-on-fingerprint.yaml', encoding='utf-8'));
      d.update(schema_version=6, cites=[], slug='zz-rescout-fixture', plan_path='docs/plans/PLAN-zz-rescout-fixture.yaml');
      d['gate_rounds']=[{'gate':'decision-scout','round':1,'verdict':'NO_FLAGS','scout_input_fingerprint':'v1:'+'0'*64},
      {'gate':'plan-critique','round':1,'verdict':'PROCEED'}]; yaml.safe_dump(d, open(sys.argv[1],'w',encoding='utf-8'),
      sort_keys=False)" "$f" && out=$(bin/venv-python -c "from scripts.checks.roadmap.validate_plan_documents import
      validate_plan_documents as v; f=[]; v(f); print('FAILED' if f else 'CLEAN')") ; echo "$out" | grep -q 're-scout
      required' && echo "$out" | grep -q '^FAILED' && fp=$(bin/venv-python -m scripts.roadmap.plan_fingerprint --plan "$f")
      && fp=${fp#scout_input_fingerprint=} && [ -n "$fp" ] && sed -i "s/v1:0\{64\}/$fp/" "$f" && out2=$(bin/venv-python -c "from
      scripts.checks.roadmap.validate_plan_documents import validate_plan_documents as v; f=[]; v(f); print('FAILED' if
      f else 'CLEAN')") ; ! echo "$out2" | grep -q 're-scout required' && echo "$out2" | grep -qE 're-scout barrier: [0-9]+ plan\(s\) examined, [1-9][0-9]* compared' && ! echo "$out2" | grep -E
      'FAIL' | grep -q 'zz-rescout-fixture' && echo E2E-BARRIER OK
    expected: Prints E2E-BARRIER OK, and the fixture file is gone afterwards.
    fix_if: >-
      No "re-scout required" on the stale value means the barrier did not see the untracked plan as added (check the "??"
      leg) or did not compare it; a "re-scout required" after recording the recomputed value means the barrier and the
      CLI disagree about the payload (they must share plan_fingerprint). Any other FAIL line in out2 is unrelated to this
      step only if it also appears with the fixture absent.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      It writes and removes a file in the working tree and reads git status; steps 3-4 are the standing guards of the
      same rules.
  - step: 8
    phase: pre-deploy
    action: The retired record is a pure rename and nothing live names it; the prose budget equals the measured size.
    command: >-
      git diff --find-renames=100% --name-status origin/main -- config/agent/verification_registry/entries/ | grep -qE
      '^R100\s+config/agent/verification_registry/entries/skill-template-emits-v5.yaml\s+config/agent/verification_registry/entries/deprecated/skill-template-emits-v5.yaml$'
      && ! grep -rlq 'skill-template-emits-v5' config/agent/verification_registry/entries/*.yaml config/agent/verification_registry/known_red.yaml
      && [ "$(grep -E '^  \.claude/skills/planning/SKILL\.md:' config/prose_budgets.yaml | awk '{print $2}')" = "$(wc -c <
      .claude/skills/planning/SKILL.md | tr -d ' ')" ] && echo RETIRE-AND-BUDGET OK
    expected: Prints RETIRE-AND-BUDGET OK.
    fix_if: A non-100% rename means the record's content changed; restore it. A budget mismatch means the ratchet was not set to the measured size.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Fast tier on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the named failure on the branch; never skip, disable or quarantine a test.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Full tier before handoff (handoff_policy), started in the background from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports a completed full run for HEAD with exit 0, including the contract drift gate on the committed ledger and project-alignment.yaml.
    fix_if: A red full tier blocks handoff; fix and rerun from the start. A timeout is blocked, never a warning.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: The bundled recs closed through the squash commit's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; rows, missing =
      c.fetch_recs_by_ids(c.make_reader(), ['rec-4490', 'rec-5102']); s={r['id']: r['status'] for r in rows};
      print(s, missing); assert not missing and set(s.values()) == {'closed'}; print('RECS-CLOSED OK')"
    expected: Prints RECS-CLOSED OK.
    fix_if: An open rec means the trailer closure job did not run or rejected the acceptance; read its CI run and close through ops_data_portal only with its acceptance passing.
    hermetic: false
    graduation: not-applicable
