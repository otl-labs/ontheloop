schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: plan-split-one-rec
intent: >-
  One plan delivers one outcome that can be verified and reverted on its own, under one primary rec, and work with no
  rec gets one filed first. Delivery pressure (an order a check forces, the fast-tier budget, a size cap) targets more
  PRs in the same plan, and until rec-5411 gives every PR the build gates it files child recs with an order edge; only
  independent parts, another project's files or a different risk class become child recs, filed with dependency edges
  and a split-of-rec tag while the parent stays open until they close; a design fork is settled before planning; a
  second split of one lineage goes to the human; nothing splits on a file count or nests a plan name (rec-5390).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plan-split-one-rec.yaml
phase: >-
  ad_hoc_rec (soft-warn category; rec-5390, High, operator rulings 2026-11-18; no tier_item claimed, so the Tier Item
  Freshness Gate is skipped). No tier_item criterion is closed.
cites: [dec:247, dec:246, dec:208, dec:66, dec:201, dec:268]
scope:
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Apply block agents-split-form verbatim, nothing else: the Layer 1 line "work too large for one plan splits into
      child recs or atomic IMPLEMENTATION plans" becomes "one plan is one verifiable, revertible outcome; more work
      splits into child recs, each planned on its own (Decision 247)" (decision-scout round 2 NOTE: the universal
      rules must not offer the split form the three edited surfaces drop). Measured net -1 byte.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Apply blocks complexity-split-test and suggest-one-rec-relief of docs/plans/approved/plan-split-one-rec.yaml
      verbatim, nothing else in this file (validate_merge_step binds every word). The Complexity Assessment's
      "Scope files > 5 OR estimated steps > 8" heuristic becomes the rule: one plan delivers one verifiable,
      revertible outcome under one primary rec; never split on a file count; /plan Step 4 item 5 holds the split test
      and Step 8 the filing; no nested plan names; a second split of one lineage goes to the human (Decision 247
      cl.5). Suggest Aligned Recommendations compresses to two sentences that cap bundling at two recs beside the
      primary, each closed whole and only by its own acceptance (Decision 201). Measured at planning: net -112 bytes.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Apply blocks plan-step3-rec-first, plan-step4-split-test and plan-step8-child-recs verbatim. Step 3 files a rec
      first for work with no rec, which becomes the plan's primary rec. Step 4 item 5 becomes the split test: child
      recs only for independently valuable or parallel parts, another project's files, or a different risk class;
      delivery mechanics (forced order, fast-tier budget, a size cap the in-plan facade decomposition cannot absorb)
      target at most three PRs in linear order under one
      plan, and until rec-5411 gives every PR the build gates (today they fire only on the PR that flips
      implementation_declared) file child recs with an order edge; a design fork is settled first; a near-cap shared
      file another open plan also edits (the same lines, or growth that together exceeds its headroom) needs a
      dependency edge between their recs or a split;
      selection_budget is a guardrail, a breach is delivery mechanics, and its open limits are named (rec-5389,
      rec-5397). Step 8's Planning-time split applies after a split confirmed at sign-off (the plan write is skipped)
      or chosen at a Step 9 escalation (the written plan and its sidecar are deleted from the branch) and becomes the child-rec filing: guidance, file_rec per child in dependency order with
      a fresh-planner-ready context, --tags split-of-rec-NNNN and --dependencies; update_rec gives the parent every
      child as a dependency so it stays open as the umbrella; read back; a split-of-rec-tagged rec goes to the human;
      the run ends decomposed and plans no child. It keeps "only if this plan defers a half" and "followon_recs" for
      build-time deferrals, which tests/test_workflow_skill_antidrift.py pins. Step 9's "split means split the plan per
      Step 8's Planning-time split" stays untouched and now reaches the filing through the Step 9 guard.
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Apply blocks critique-step8-split-test and critique-scope-template verbatim: step 8 judges one verifiable,
      revertible outcome per /plan Step 4, and the Scope Evaluation line offers "more PRs, or child recs" while keeping
      the pinned "deferred half filed as a follow-on rec" phrase. Measured net 0 bytes.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Ratchet the planning SKILL.md entry and S1 root_ambient_load_set down to their measured byte sizes after the
      edit (no raise; prose_budgets_ratchet_down sanction). The plan-critique entry is unchanged unless its measured size moves, in
      which case it is lowered and keeps its marker comment.
  - file: tests/test_planning_skill_split_test.py
    action: Create
    purpose: >-
      rec-5390's acceptance (absent on main). test_complexity_assessment_names_the_outcome_rule: the Complexity
      Assessment section holds "one outcome that can be verified and reverted on its own", "Never split on a file
      count", "never nested plan names" and "Decision 247 cl.5" and no longer holds "Scope files > 5".
      test_step4_split_test_routes_mechanics_to_prs: Step 4 item 5 holds "at most three PRs merged in linear order",
      "until rec-5411 gives every PR the build gates", "child recs with an order edge", "A design fork is not a
      split", "differs in risk class", "another project's files" and "is a guardrail, not the trigger". test_named_verdicts_are_selection_budget_outcomes: every backticked token of the form
      `within_budget|breadth_waived|breach|non_test_breach` in Step 4 item 5 is a key of
      scripts.checks.deps.selection_budget._DECLARE_OR_SPLIT, imported, and at least breadth_waived and breach appear,
      so a renamed outcome fails here. test_step8_files_child_recs_and_keeps_the_parent_open: Step 8's Planning-time
      split holds "--tags split-of-rec-NNNN", "--dependencies <its existing dependencies and every child>",
      "recs_by_ids", "Decision 247 cl.5", "plan no child" and "chose split at a Step 9 escalation", with the child
      "--file-rec" before the parent "--update-rec", and holds no "--status superseded".
      test_step3_files_a_rec_for_work_with_no_rec: Step 3 holds "Work with no rec", "--file-rec" and "the plan's
      primary rec". test_bundling_is_capped_at_two_beside_the_primary: Suggest Aligned Recommendations holds "Bundle
      at most two beside the primary rec" and "Decision 201" and no longer holds "include rec-XXX".
      test_critique_template_offers_more_prs_or_child_recs: plan-critique's Scope Evaluation template holds "more PRs,
      or child recs". test_no_live_planning_surface_offers_atomic_plans: AGENTS.md,
      planning SKILL.md, plan.md and plan-critique SKILL.md contain neither "atomic plans" nor "atomic IMPLEMENTATION
      plans", and AGENTS.md holds "one verifiable, revertible outcome"; every presence and absence check here
      compares whitespace-normalised text, so a line wrap neither hides nor breaks a phrase.
  - file: docs/plans/approved/plan-split-one-rec.yaml
    action: Create
    purpose: >-
      The approved-text sidecar (git-ops.yaml approved_text_binding, Decision 246): eight blocks over the four
      instruction files, merged with this plan; the build never edits it.
  - file: docs/plans/PLAN-plan-split-one-rec.yaml
    action: Create
    purpose: This plan artefact.
bundled_recommendations:
  - rec-5390
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    The planning skill's Complexity Assessment states one plan delivers one verifiable, revertible outcome under one
    primary rec, holds no scope-file-count trigger, names no nested plan form, and sends a second split of one lineage
    to the human (Decision 247 cl.5).
  - >-
    /plan Step 4 item 5 splits into child recs only for independent or parallel parts, another project's files or a
    different risk class; targets delivery mechanics at up to three PRs under one plan, filing child recs with an order
    edge until rec-5411 lands; settles a design fork first; and names selection_budget as a guardrail whose verdict
    names are its own outcome keys.
  - >-
    /plan Step 3 files a rec before planning work that has none, and the planning skill caps bundling at two recs beside
    the primary, each closed only by its own acceptance (Decision 201).
  - >-
    /plan Step 8 applies to a split confirmed at sign-off or chosen at a Step 9 escalation, files child recs with
    split-of-rec-NNNN tags and dependency edges, keeps the parent open by making every child its dependency, ends the run decomposed without planning a child, and keeps followon_recs for
    build-time deferrals only.
  - >-
    No live planning surface (AGENTS.md, planning SKILL.md, plan.md, plan-critique SKILL.md) offers atomic plans as a
    split form, the critique template offers "more PRs, or child recs", and the existing antidrift pins still pass.
  - >-
    The four instruction files' words equal the approved sidecar, and validate_prose_limits passes with the planning
    skill's and the S1 root load-set budgets lowered to their new sizes.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5390's acceptance and the unchanged antidrift pins, through the real instruction files and the real selection_budget table.
    command: bin/venv-python -m pytest tests/test_planning_skill_split_test.py tests/test_workflow_skill_antidrift.py -q
    expected: >-
      Exit 0, all pass. Before the change the new file does not exist. The existing antidrift pins (Step 8's
      "only if this plan defers a half" and "followon_recs", plan-critique's "deferred half filed as a follow-on rec")
      still pass because the approved words keep those phrases.
    expected_literals:
      - passed
    fix_if: >-
      A pin fails -- the applied words differ from the sidecar (restore them; never edit a pin to match wrong text);
      the verdict test fails -- a verdict name in the text is not a _DECLARE_OR_SPLIT key.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Both files are ordinary test modules the full tier and every selecting --pre run already execute.
  - step: 2
    phase: pre-deploy
    action: AGENTS.md (S1) and the planning and plan-critique skills stay inside their prose budgets and each budget equals its size.
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f); assert not f, f; print('PROSE_OK')"
    expected: PROSE_OK.
    expected_literals:
      - PROSE_OK
    fix_if: current>budget -- the applied words differ from the sidecar; current<budget -- lower the entry to wc -c.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_prose_limits is a standing registered check on every tier.
  - step: 3
    phase: pre-deploy
    action: The four instruction files' words equal the approved sidecar, read at the base.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug plan-split-one-rec --expect
      f0a062555a44621ecd044a66a9c8b2b14673c9ddae7a7437f269d849a0da997b
    expected: Exit 0 (APPROVED-TEXT OK with that digest).
    fix_if: A MISMATCH -- restore the sidecar's words exactly; any other wording needs a new operator approval run.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text leg on every PR.
  - step: 4
    phase: pre-deploy
    action: Full validation before handoff, attested for the pushed HEAD (backgrounded, 2 h limit, top-level session).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Exit 0; --verify-head attests HEAD.
    expected_literals: []
    fix_if: >-
      A failure in scope -- fix on the branch and rerun from the start; outside scope -- a rec via
      scripts.ops_data_portal (Decisions 55, 59). tests/test_aws_profile.py needs HOME set to an empty directory.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
  - step: 5
    phase: post-deploy
    action: rec-5390 closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, missing = fetch_recs_by_ids(make_reader(), ['rec-5390']); print([(r['id'], r['status']) for r in
      rows], missing)"
    expected: rec-5390 shows a closed status and none are missing.
    fix_if: >-
      Still open after ci.yml's trailer-closure job concluded -- follow the implement skill's post-merge closeout
      fallback; never close by hand against a refusal marker.
    hermetic: false
