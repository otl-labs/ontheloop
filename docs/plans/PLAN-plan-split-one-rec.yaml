pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Precondition: the plan and its sidecar are on origin/main and the branch contains origin/main; else stop.
    Apply the sidecar's eight blocks verbatim to AGENTS.md, .claude/skills/planning/SKILL.md, .claude/commands/plan.md
    and .claude/skills/plan-critique/SKILL.md (VP step 3).
  - >-
    config/prose_budgets.yaml -- set the planning SKILL.md entry to `wc -c < .claude/skills/planning/SKILL.md` and S1
    root_ambient_load_set to its measured size (validate_prose_limits reports it); lower the plan-critique entry only
    if its measured size moved, keeping its marker comment.
  - tests/test_planning_skill_split_test.py -- per its scope row.
  - Run VP steps 1-3 until green; on unrecoverable failure stop and RCA (Decision 55).
  - Code review via a fresh code-review subagent; fix blocking findings and rerun VP steps 1-3.
  - >-
    Commit (flip implementation_declared to true; carry "Resolves: rec-5390" as its own paragraph), merge origin/main,
    run VP step 4 on the committed clean HEAD, push, open the build PR, merge on green checks.
  - 'Report: what was implemented, VP results, PR number, merge SHA, rec-5390 closure readback (VP step 5).'
