schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "planning-eligibility-start-edges"
intent: >-
  Make the three eligibility sentences agents read agree with the typed start edge: the roadmap's agent_instructions,
  the planning skill's tier_item rejection rule and the orient skill's status digest say that a depends_on entry named
  by an item's start_edges counts as satisfied once it is in_progress, while depends_on still orders completion. With
  PLAN-roadmap-start-edges built, T4.32's first plan is no longer refused while T4.10a is in_progress. Second of
  rec-5037's two plans; closes rec-5037.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-planning-eligibility-start-edges.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-5037,
  which T4.32's START annotation names as the fix due before T4.32's first plan.
scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Apply block roadmap-eligibility of docs/plans/approved/planning-eligibility-start-edges.yaml verbatim (the
      agent_instructions eligibility bullet plus the new start_edges bullet). No other edit: approved text binds the
      whole file.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Apply block planning-skill-reject verbatim (the soft-warn paragraph's last two sentences). Net 0 bytes, so the
      prose budget entry (43028) is unchanged.
  - file: .claude/skills/orient/SKILL.md
    action: Modify
    purpose: Apply blocks orient-status-digest and orient-omit-blocked verbatim. Net -3 bytes.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Ratchet the .claude/skills/orient/SKILL.md entry down to the bytes measured after the blocks apply (23160 when
      applied to 75b7458e; re-measure at build). No marker. The planning skill entry stays as measured.
  - file: tests/test_planning_skill_start_order.py
    action: Create
    purpose: >-
      rec-5037's acceptance test. Wording leg: the roadmap's document.agent_instructions (read from the parsed YAML,
      not the whole file, since T4.32's row also names start_edges), planning SKILL.md and orient SKILL.md each name
      start_edges; agent_instructions also names in_progress beside start_edges; and none keeps an old phrase ("all
      depends_on entries have status == "complete"", "depends_on are not satisfied", "with all depends_on satisfied",
      "(depends_on not satisfied)"). Behaviour leg: on an in-memory copy of the live roadmap that sets T4.32 to
      not_started and T4.10a to in_progress, T4.32 is in eligible_items() and its next_eligible row carries start_edges
      ["T4.10a"]; with T4.10a set to not_started it is in compute_blocked(). No assertion reads a live status, so the
      test holds as T4.10a and T4.32 move through their lifecycles. The behaviour leg overlaps PLAN-roadmap-start-edges's test (e) on purpose:
      rec-5037's acceptance names this file.
  - file: docs/plans/approved/planning-eligibility-start-edges.yaml
    action: Create
    purpose: The approved-text sidecar (4 blocks), merged with this plan; the build never edits it.
  - file: docs/plans/PLAN-planning-eligibility-start-edges.yaml
    action: Create
    purpose: This plan.
bundled_recommendations:
  - rec-5037
followon_recs: []
infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition: compute_affected_artifacts(<this
    plan's scope>) returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']} because the roadmap is a packaged asset
    of the active data-pipeline artifact. No build, deploy or smoke test is owed: the change is agent_instructions text
    with no packaged code. deploy-prod-lambdas.yml does not path-trigger on the roadmap, so the asset refreshes at the
    next deploy a watched path starts. Its one runtime reader, src/data/handlers/scheduled_agent_handler.py, runs only
    from the scheduled-agent dispatcher, whose EventBridge rule is provisioned DISABLED with SCHEDULED_AGENTS_ENABLED
    "false" (terraform/personal/prod_lambdas.tf), so a stale packaged copy reaches no running agent. No other scope
    file is Lambda-packaged and no .tf file is in scope (precedent: PLAN-verdict-persona-roadmap-regrounding).
acceptance_criteria:
  - The three files carry the sidecar's words exactly (validate_merge_step's approved-text binding passes against the build's base).
  - bin/venv-python -m pytest tests/test_planning_skill_start_order.py -q passes; it fails on a base without the wording.
  - The prose budget registry equals the measured bytes of both skills, with no raise marker.
  - rec-5037 is closed by the squash-merge Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: PLAN-roadmap-start-edges's build is on main (StartEdge exists there and T4.32 carries its edge)
    command: >-
      git fetch origin main --quiet && git show origin/main:scripts/platform_roadmap_models.py | grep -q 'class StartEdge' &&
      bin/venv-python -c "from scripts.roadmap.platform_roadmap import StartEdge, load; d = load('docs/ROADMAP-PLATFORM.yaml'); t = next(i for i in d.tier_items if i.id == 'T4.32'); print('edges', [(e.ref, e.once) for e in t.start_edges])"
    expected: Prints edges [('T4.10a', 'in_progress')].
    fix_if: Stop; this build waits for PLAN-roadmap-start-edges's build to merge.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The bound files match the approved text against the build's base
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug planning-eligibility-start-edges --base origin/main
    expected: Exit 0 with no mismatch.
    fix_if: Re-apply the blocks verbatim; never edit the sidecar in the build.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_merge_step enforces the same approved-text binding on the build PR in CI.
  - step: 3
    phase: pre-deploy
    action: rec-5037's acceptance test
    command: bin/venv-python -m pytest tests/test_planning_skill_start_order.py -q
    expected: All pass; the wording leg fails on main before the blocks apply.
    fix_if: Fix the placement of the approved words; never weaken the test.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: A unit test under tests/ that runs in every tier through the fast-tier pytest selection.
  - step: 4
    phase: pre-deploy
    action: Prose budgets equal measured bytes with no raise
    command: >-
      bin/venv-python -c "from scripts.checks.registry import resolve; f = []; resolve('validate_prose_limits')(f);
      resolve('validate_prose_budget_raises')(f); print('failed', f)"
    expected: Prints failed [] after the two check banners.
    fix_if: Ratchet the orient entry to the measured bytes; never add a raise marker.
    hermetic: true
    expected_literals: ["failed []"]
    graduation: waive
    graduation_waiver_reason: Both checks already run in the fast and full tiers.
  - step: 5
    phase: pre-deploy
    action: Full validation before handoff, attested for the pushed HEAD (backgrounded, 2 h limit, top-level session)
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Exit 0; --verify-head attests HEAD.
    expected_literals: []
    fix_if: >-
      A failure in scope is fixed on the branch and the run restarts from the start; never skip a test, relax an
      assertion or add a baseline. A failure outside scope becomes a rec via scripts.ops_data_portal (Decisions 55, 59).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
  - step: 6
    phase: post-deploy
    action: Confirm rec-5037 is closed
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; r,_=fetch_recs_by_ids(make_reader(), ['rec-5037']); print(r[0]['id'], r[0]['status'])"
    expected: Prints rec-5037 closed.
    fix_if: Still open -- read the ci.yml closure job log and close with update_rec (Decision 84 I-4).
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: agent_instructions states the start-edge eligibility rule.
    verification_step: 3
    test_selector: tests/test_planning_skill_start_order.py
    red_green_expectation: red before (complete-only sentence), green after.
  - source: .claude/skills/planning/SKILL.md
    behavior: The planning skill rejects only on unmet depends_on under the start-edge rule.
    verification_step: 3
    test_selector: tests/test_planning_skill_start_order.py
    red_green_expectation: red before, green after.
  - source: .claude/skills/orient/SKILL.md
    behavior: The orient digest reads eligibility from next_eligible and blocked.
    verification_step: 3
    test_selector: tests/test_planning_skill_start_order.py
    red_green_expectation: red before, green after.
  - source: config/prose_budgets.yaml
    behavior: The orient entry equals the measured bytes.
    verification_step: 4
    command: >-
      bin/venv-python -c "from scripts.checks.registry import resolve; f = []; resolve('validate_prose_limits')(f);
      resolve('validate_prose_budget_raises')(f); print('failed', f)"
    waiver_reason: validate_prose_limits already fails any mismatch in both tiers; no new test is owed for a ratchet.
weakening_dispositions: []
constraints:
  - Every byte written to the three bound files comes from docs/plans/approved/planning-eligibility-start-edges.yaml; approved text binds whole files (git-ops.yaml approved_text_binding).
  - No prose budget raise (Decisions 128, 165); the planning skill nets 0 bytes, the orient skill -3.
  - Builds only after PLAN-roadmap-start-edges's build merges (VP 1).
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout round 1 FLAGS_FOUND (two NOTEs, no contradiction). CITE: Decision 229, Decision 246, Decision 86. Decisions triaged: 202 of 202. Roadmap items intersected: 4; CONFLICT: 0; RELATED: 4. Serves: NS.4 3/5."
  - "red_overlap at 654b7797: verdict clear, no reds. Roadmap size: 8,821 of 10,000 lines (Decision 114); this plan adds 7 (plan_obligations' 500 figure is the roadmaps class default, which validate_platform_roadmap's 10,000-line ceiling overrides)."
  - "Approved text: docs/plans/approved/planning-eligibility-start-edges.yaml, 4 blocks; wording digest eb296696011514b9b9662f76f5192b12f5d829027c0dbb96778710f51365c653, approved-words digest 006484ff5fb882f2fc3d6a6f015c78da7da65b9df4c75664f87464658eeccfc0, fingerprint acorn-lilac-pepper-mesa; approval run approved-text-approval 42649654971 (Decision 246)."
  - "Rebase note: other unbuilt plans edit docs/ROADMAP-PLATFORM.yaml and the skills; a rebase that changes words inside a block re-anchors it, and only an anchor-only re-anchor keeps the approval (Decision 246 cl.2)."
  - "fork: binding of the eligibility wording | chosen: one approved-text sidecar, approved on GitHub | class: consistency-only | precedent: Decision 246 | precedent_kind: decision | reversible: yes | persisted: docs/plans/approved/planning-eligibility-start-edges.yaml"
  - "fork: room in two skills at zero prose headroom | chosen: tighten the soft-warning sentence and the orient phrases, no budget raise | class: consistency-only | precedent: Decision 127 | precedent_kind: decision | reversible: yes | persisted: config/prose_budgets.yaml"
  - "Sign-off: Benjamin said 'please write the plans' on 2026-11-09 after the presentation (/mnt/project-files/rec-5037-plan/PRESENTATION.md)."
  - "Serialised queue: this plan holds the planning-skill slot ahead of PLAN-scout-input-fingerprint (itinerary rev 2)."
gate_rounds:
  - {gate: wording-check, round: 1, verdict: PASS, digest: eb296696011514b9b9662f76f5192b12f5d829027c0dbb96778710f51365c653, base: 75b7458e810f939c7096af11b3a25e325fe3bbb4, selection: complete}  # pragma: allowlist secret
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
  - {gate: plan-critique, round: 1, verdict: REVISE, blocking: 1, nits: 5}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - docs/plans/approved/planning-eligibility-start-edges.yaml read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Run VP 1; stop if PLAN-roadmap-start-edges's build is not on main.
  - Apply the four sidecar blocks verbatim; ratchet the orient prose budget to the measured bytes.
  - Write tests/test_planning_skill_start_order.py.
  - Run VP steps 2-4 until green; on an unrecoverable failure stop and RCA (Decision 55).
  - Code review via a fresh code-review subagent; fix blocking findings and rerun VP steps 2-4.
  - >-
    Commit (flip implementation_declared to true; carry "Resolves: rec-5037" as its own paragraph), rebase on
    origin/main, run VP step 5 on the committed clean HEAD, push, open the build PR, and merge on code review PROCEED
    and green CI once validate_merge_step reads the sidecar's GitHub approval (standing authorisation for
    sidecar-bound text).
  - >-
    Report, as separate facts: what was implemented; the full-tier exit plus validation_result --verify-head for the
    pushed HEAD; structured postflight evidence (scripts.session.postflight --evidence); the push, PR number, CI result
    and merge SHA; and VP 6's read-back of rec-5037.
rollback: Revert the PR; the sentences return to the complete-only rule while the code keeps honouring start edges.
