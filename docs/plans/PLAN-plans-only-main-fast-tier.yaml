schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: plans-only-main-fast-tier
intent: >-
  Cut about half of the post-merge full-tier runs on main, the largest single demand on the 20-slot Actions
  concurrency cap (audit CMTS-06), by building Decision 205 clause 5: a push to main whose diff is confined to
  docs/plans/ runs the fast tier inside main-validate instead of the full tier, with Main Canary's 3-hourly full tier
  as the backstop. Second of two atomic plans for rec-4114; closes roadmap T4.9a c10.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-plans-only-main-fast-tier.yaml
phase: T4.9a (exit criterion c10). Itinerary item D4 (verdict-ci ITINERARY.md, Actions-capacity lever CMTS-06).
closes_criteria: ["T4.9a:c10"]
scope:
  - file: scripts/ci/push_scope.py
    action: Create
    purpose: >-
      Stdlib-only at import (like scripts/ci/deploy_gate.py), runnable as `python3 -I scripts/ci/push_scope.py
      classify` before setup-python. PLAN_PREFIX = "docs/plans/". confined_to_plans(changed: set[str] | None) ->
      bool: False on None or empty, else every path starts with PLAN_PREFIX. changed_paths(before, after, cwd) ->
      set[str] | None: None when before is empty or all zeros, when `git cat-file -e <sha>^{commit}` fails for either
      sha, or when `git diff --name-only --no-renames <before> <after>` fails; else that output's non-empty lines
      (deletions included; a rename shows both paths). classify(before, after, forced, cwd) -> (bool, reason): False
      with a reason when forced is "true", when changed_paths is None, or when confined_to_plans is False; True only
      for a non-empty all-plans diff. CLI `classify` reads BEFORE, AFTER and FORCED from the environment, prints
      "push_scope: plans_only=<true|false> (<reason>)", appends "plans_only=<true|false>" to $GITHUB_OUTPUT when set,
      and exits 0 on every input, including any unexpected exception, which prints the error and writes
      plans_only=false (fail closed to the full tier; Decision 170). Module docstring: a scope classifier, not a diff
      base; --pre's own diff base stays scripts/checks/_common.py push_context_base (Decision 159 cl.1); it shares
      its prefix with scripts/ops_portal/trailer_closure_gate.py's merge_leg_refuses (opposite polarity on an empty
      diff), pinned equal by test_prefix_matches_trailer_gate rather than imported, because the gate module is
      reached by gated --pre Entries whose pre_globs would otherwise need push_scope.py added in four manifests.
  - file: tests/ci/test_push_scope.py
    action: Create
    purpose: >-
      Against a temporary git repo (core.autocrlf=false): test_plans_only_diff_is_plans_only (PLAN and approved/
      sidecar files); test_mixed_diff_is_full; test_deletion_under_plans_is_plans_only; test_deletion_outside_is_full;
      test_rename_out_of_plans_is_full; test_zero_before_is_full; test_unresolvable_before_is_full;
      test_forced_push_is_full; test_empty_diff_is_full; test_git_error_is_full (a cwd that is not a repo);
      test_prefix_matches_trailer_gate (push_scope.PLAN_PREFIX equals
      scripts.ops_portal.trailer_closure_gate._PLAN_PREFIX, so the two plans-only predicates cannot drift);
      test_cli_writes_github_output (writes plans_only=true and plans_only=false lines to a tmp GITHUB_OUTPUT, exit
      0 both ways); test_cli_exception_fails_closed (an exception inside classify still exits 0 and writes
      plans_only=false); test_confined_to_plans_polarity (None and empty are False);
      test_range_base_matches_push_context_base (with GITHUB_EVENT_NAME=push and GITHUB_EVENT_BEFORE=<parent sha>,
      scripts.checks._common.push_context_base(root) returns the same before sha classify used, so the classifier
      and --pre diff the same range); test_recent_main_share (over the real repository's last 300 first-parent
      commits, when the history is present, classify on each (parent, commit) pair returns True for at least 100 --
      the measured share was 142 of 300 at e6eda786; skips with an "env: shallow history" reason when fewer than 300
      commits are reachable).
  - file: scripts/checks/_scaffolding.py
    action: Modify
    new_imports: []
    purpose: >-
      run_precommit_checks' --pre escalation call becomes precommit_escalates(target, _common.push_context_base() or
      "origin/main"), and the comment that says the --pre call site never runs in push context is replaced by one
      line saying it runs there for plans-only pushes to main (Decision 205 cl.5). No other change.
  - file: tests/validate/test_precommit_escalation_predicate.py
    action: Modify
    purpose: >-
      Add test_push_context_uses_push_base: with push_context_base patched to return a sha, run_precommit_checks
      (files given, all_files False) passes that sha to precommit_escalates; with it returning None, "origin/main".
      Existing tests unchanged.
  - file: .github/workflows/ci.yml
    action: Modify
    purpose: >-
      main-validate only. After checkout, a step "Classify push scope" (id scope, no if) with env BEFORE: ${{
      github.event.before }}, AFTER: ${{ github.sha }}, FORCED: ${{ github.event.forced }} and run `python3 -I
      scripts/ci/push_scope.py classify`. Let FULL = `steps.scope.outputs.plans_only != 'true'` and FAST =
      `steps.scope.outputs.plans_only == 'true'`. The OIDC step, the existing dependency-cache step and "Install
      dependencies" take `if: FULL`; the existing step "Validate full tier (ruff, mypy, pytest, DQ runner, verifier
      harness)" keeps its exact name and run line and takes `if: FULL` (scripts/ci/deploy_gate.py binds that name;
      a skipped step is never deploy evidence, Decision 249 cl.2). New steps with `if: FAST`: a fast-tier cache with
      pr-validate's key expression; "Install fast-tier dependencies only" with pr-validate's three-line body; and
      "Validate fast tier (ruff lint, ruff format, mypy, prompt checks)" running `python -m scripts.validate --pre`
      with env GITHUB_EVENT_BEFORE: ${{ github.event.before }} (no APPROVED_TEXT_GH_TOKEN: in push context the
      sidecar lookup prints SKIP). The aws-region action, setup-python, the pre-commit cache and both always()
      upload steps stay unconditioned. The header comment gains one line naming the plans-only exception
      (Decision 205 cl.5, git-ops.yaml two_tier_presubmit_model.full.plans_only_exception). No other job changes.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      Register main-validate's three new inline run bodies under the existing key scheme (classify-push-scope: 1,
      install-fast-tier-dependencies-only: 3, validate-fast-tier-ruff-lint-ruff-format-mypy-prompt-checks: 1), as
      validate_composite_action_shell_body_rules derives them; no other row changes.
  - file: scripts/verify_ci_workflow/_shared.py
    action: Modify
    new_imports: []
    purpose: >-
      _full_tier_jobs classifies per step: a job is full-tier when any one step's run invokes scripts.validate with
      neither --pre nor --terraform-only (so main-validate stays in the set beside main-canary's job). Docstring
      updated; still the sole derivation (Decision 104).
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      Entry validate_trusted_plan_environment's pre_globs gain "scripts/ci/deploy_gate.py" (pre-glob closure:
      _ci_yaml.py now imports it). No other change.
  - file: scripts/verify_ci_workflow/_ci_yaml.py
    action: Modify
    new_imports: [scripts.ci.deploy_gate]
    purpose: >-
      _check_jobs_and_flags replaces `"--pre" not in main_steps` with step-level asserts on main-validate: exactly
      one step whose run invokes scripts.validate without --pre or --terraform-only, named
      scripts.ci.deploy_gate.FULL_TIER_STEP (imported, never restated), whose `if` names
      steps.scope.outputs.plans_only and is the FULL literal; exactly one step running scripts.validate --pre, whose
      `if` is the FAST literal; a step with id scope, no `if`, whose run invokes scripts/ci/push_scope.py classify
      and which precedes both; the OIDC step carries the FULL literal. Each assert message names the failing rule.
      pr-validate's asserts are unchanged.
  - file: tests/verify_ci_workflow/test_ci_topology_guards.py
    action: Modify
    purpose: >-
      _VALID_CI_DATA's main-validate gains the new shape (classify step, FULL/FAST conditions, both validate steps).
      Add: test_fails_when_full_step_is_unconditionally_off (`if: false`); test_fails_when_fast_step_is_unconditioned;
      test_fails_when_classify_step_is_missing; test_fails_when_full_step_is_renamed; test_fails_when_classify_runs_after_validate;
      test_full_tier_jobs_classifies_by_step (a job with one full step and one --pre step is full-tier; a job with only
      --pre is not). Existing tests keep their assertions; only the fixture's main-validate shape changes.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: >-
      Exactly the four sidecar blocks (docs/plans/approved/plans-only-main-fast-tier.yaml): version (contract_version
      14 -> 15), amendment-log (a new first amendment_log entry, semantic_break true), description-compact (the model's
      description shortened to one line, same meaning) and plans-only-exception (two_tier_presubmit_model.full gains a one-line
      plans_only_exception, indented under full:), with {{DATE}} filled with the build date (UTC). Nothing else. Size:
      499 effective lines at e6eda786 (contracts class cap 500, NEAR_CAP); the new field and log entry add two lines and
      the shortened description saves two, so the file stays at 499 -- measure on main at build time, and if another plan has grown it
      past the cap first, stop with a plan-defect report (never a raise).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      T4.9a c10 flips open -> met with met_by naming this plan and the build PR (docs/contracts/exit-criteria-ledger.yaml),
      plus one progress_note line; the item's status follows docs/contracts/tier-item-lifecycle.yaml (not_started ->
      in_progress when a first criterion is met). Nothing else.
bundled_recommendations: [rec-4114]
followon_recs: [rec-5040]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    rec-4114's acceptance command exits 0: test "$(grep -c "scripts.validate --pre" .github/workflows/ci.yml)" -ge 2.
  - >-
    A push to main confined to docs/plans/ runs only the fast tier in main-validate; any other push, a zero or
    unresolvable before, a forced push, an empty diff or a git error runs the full tier (the push_scope tests pass and fail before
    the change).
  - >-
    scripts.verify_ci_workflow passes on the real ci.yml and fails on each mutation in test_ci_topology_guards.py;
    main-validate stays in _full_tier_jobs; the full-tier step keeps deploy_gate.FULL_TIER_STEP's exact name.
  - >-
    push_scope's prefix equals trailer_closure_gate's (test_prefix_matches_trailer_gate), and every existing
    trailer-closure test passes unchanged.
  - docs/contracts/git-ops.yaml equals the approved sidecar with {{DATE}} filled (scripts.roadmap.approved_text verify exits 0).
  - >-
    After merge, the first plans-only push to main shows "push_scope: plans_only=true" and the fast step ran with the
    full step skipped; the next code push shows plans_only=false and the full step ran; rec-4114 reads closed.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the classifier's every branch, its CLI and its agreement with push_context_base.
    command: bin/venv-python -m pytest tests/ci/test_push_scope.py -q
    expected: Exit 0, all passed (test_recent_main_share may skip only with its env reason). Red before (no module).
    fix_if: A test fails -- fix push_scope at root; a fail-open branch is a blocking defect.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Unit tests of one CI script; the --pre pytest_diff runs them whenever it or its test changes.
  - step: 2
    phase: pre-deploy
    action: Prove the CI shape guards accept the new main-validate and reject each mutation.
    command: >-
      bin/venv-python -m pytest tests/verify_ci_workflow/ tests/checks/ci_guards/test_validate_ci_workflow_guards.py -q
      && bin/venv-python -m scripts.verify_ci_workflow
    expected: Exit 0 for both; the verifier prints every guard passing on the real ci.yml.
    fix_if: >-
      The real ci.yml fails a guard -- fix ci.yml, not the guard; a mutation test passes -- the guard does not fail
      closed, fix it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      validate_ci_workflow_guards already runs these guards on ci.yml in both tiers; a graduated record would repeat it.
  - step: 3
    phase: pre-deploy
    action: Prove the trailer refusal is unchanged and the pre-commit escalation is push-aware.
    command: >-
      bin/venv-python -m pytest tests/ops_data_portal/test_trailer_closure_gate.py tests/test_rec_trailer.py
      tests/checks/ci_guards/test_validate_rec_autoclose_trailer_gate.py tests/validate/test_precommit_escalation_predicate.py -q
    expected: Exit 0, all passed; test_push_context_uses_push_base red before, green after.
    fix_if: An existing trailer test fails -- this plan must not touch the trailer gate; find what changed it.
    hermetic: true
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      Replay the plans-only path: in a scratch clone at a recent plans-only main commit with origin/main set to that
      commit, run the classifier and the fast tier as main-validate would.
    command: >-
      C=$(for c in $(git log --first-parent --format=%H -n 60 origin/main); do f=$(git diff-tree --no-commit-id
      --name-only -r $c); [ -n "$f" ] && ! echo "$f" | grep -qv '^docs/plans/' && echo $c && break; done);
      D=$(mktemp -d) && cp scripts/ci/push_scope.py "$D/push_scope.py" && git clone -q --no-checkout . "$D/c"
      && cd "$D/c" && git update-ref refs/remotes/origin/main $C && git checkout -q -B main $C
      && ln -s "$OLDPWD/.venv" .venv
      && BEFORE=$(git rev-parse HEAD~1) AFTER=$C FORCED=false python3 -I "$D/push_scope.py" classify
      && CI=true GITHUB_EVENT_NAME=push GITHUB_EVENT_BEFORE=$(git rev-parse HEAD~1) bin/venv-python -m scripts.validate --pre
    expected: >-
      push_scope prints plans_only=true, then the fast tier ends "All checks passed." with the plan schema section
      present (the branch's push_scope.py is copied in because the clone checks out an older main commit).
    fix_if: >-
      plans_only=false on a plans-only commit -- classifier defect; a fast-tier failure -- a --pre check misbehaves in
      push context: fix it inside this plan's scope or stop with a plan-defect report.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Prove the committed contract text is the approved text.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug plans-only-main-fast-tier --expect
      3ab4edd98c881bb82d11e22b5973d5dea39c9063bbdaedb18407b3fddb349b3d  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier (git-ops.yaml
      merge_step_coverage).
  - step: 6
    phase: pre-deploy
    action: Fast tier on the branch (advisory outside CI; PR CI is authoritative), and rec-4114's acceptance.
    command: >-
      bin/venv-python -m scripts.validate --pre
      && test "$(grep -c "scripts.validate --pre" .github/workflows/ci.yml)" -ge 2 && echo REC_4114_ACCEPTANCE_OK
    expected: Exit 0 and REC_4114_ACCEPTANCE_OK.
    fix_if: A failure in this plan's files -- fix at root; never loosen a test.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      Lint the changed Python files and run the full tier, as the handoff policy requires before commit; start
      scripts.validate as its own backgrounded run (2 h limit) and read its verdict with --verify-head.
    command: >-
      bin/venv-python -m ruff check scripts/ci/push_scope.py tests/ci/test_push_scope.py
      scripts/ops_portal/trailer_closure_gate.py scripts/checks/_scaffolding.py
      tests/validate/test_precommit_escalation_predicate.py scripts/verify_ci_workflow/_shared.py
      scripts/verify_ci_workflow/_ci_yaml.py tests/verify_ci_workflow/test_ci_topology_guards.py
      && bin/venv-python -m ruff format --check scripts/ci/push_scope.py tests/ci/test_push_scope.py
      scripts/ops_portal/trailer_closure_gate.py scripts/checks/_scaffolding.py
      tests/validate/test_precommit_escalation_predicate.py scripts/verify_ci_workflow/_shared.py
      scripts/verify_ci_workflow/_ci_yaml.py tests/verify_ci_workflow/test_ci_topology_guards.py
      && bin/venv-python -m scripts.validate;
      bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      ruff exit 0, and validation_result --verify-head exit 0 for HEAD; the verdict is --verify-head, never the
      backgrounded run's own exit status.
    fix_if: >-
      A failure in this plan's files: fix at root and rerun the full tier from the start (handoff_policy). A failure
      only in another open red's tests is not this build's to fix: wait for that repair per the implement skill.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      After the build merges, read the next CI push run on main for a plans-only commit and for a code commit (any
      later merges; the build's own merge is a code commit).
    command: >-
      echo "mcp__github__actions_list (workflow ci.yml, event push, branch main), then mcp__github__get_job_logs for
      main-validate on the build's merge run and on the next plans-only merge run"
    expected: >-
      Build merge run: "push_scope: plans_only=false", the full-tier step succeeded, the fast step skipped. First
      plans-only merge run: "push_scope: plans_only=true", the fast step succeeded, the full-tier step and the OIDC
      step skipped, and deploy-gate (if woken) resolved an earlier commit.
    fix_if: >-
      A plans-only run that ran the full tier costs only minutes: file a rec. A code run that skipped the full tier is
      a fail-open defect: report to the coordinator at once and open a revert PR of this build (red-main-recovery.yaml).
    hermetic: false
  - step: 9
    phase: post-deploy
    action: Confirm rec-4114 closed after the squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,_=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-4114']); print(r[0]['status'])"
    expected: Prints closed.
    fix_if: >-
      Still open: wait until the merge commit's ci.yml trailer-closure job has concluded, read its log and follow
      git-ops.yaml resolves_trailer; close it through update_rec only after a transport failure.
    hermetic: false
