constraints:
  - >-
    Depends on PLAN-graduated-rerun-plan-readers's build being merged first (its fast-tier check keeps the
    plan-reading graduated records running on plans-only pushes); the build checks
    scripts/checks/verification/validate_graduated_rerun_plan_readers.py exists on main before starting, and stops
    if it does not.
  - >-
    The four git-ops.yaml sidecar blocks are operator-approved governing text (Decision 246): placed exactly, only
    {{DATE}} filled, never edited; a needed change, including a contract_version that moved because another plan
    edited git-ops.yaml first, is an approved_text plan defect routed to the owning planning worker for a new
    approval run. The sidecar is not grandfathered: the planning worker dispatches its approval run at the plan PR's
    final head and the operator approves it on GitHub before the plan PR merges.
  - >-
    Merge: the git-ops.yaml text is under the approve-once standing_authorisation item, but ci.yml and
    scripts/verify_ci_workflow/ are CI security-relevant code; the build holds its PR for the operator's word on the
    final diff if CODEOWNERS covers any scope path (check .github/CODEOWNERS at build time), else it merges on code
    review PROCEED + green CI once validate_merge_step is green.
  - >-
    Never weaken the full tier for any push that is not plans-only; the classifier fails closed on every doubtful
    input; the full-tier step's name stays exactly deploy_gate.FULL_TIER_STEP (Decision 249 cl.2).
  - >-
    weakening_dispositions: the replaced `"--pre" not in main_steps` assert, the job-text _full_tier_jobs rule and
    test_deploy_gate_wiring's `"if" not in step` assertion (replaced by an exact FULL-literal match) are planned-change
    dispositions citing acceptance_criteria[2]; scoping _assert_runtime_lock to the full-tier path is a tightening (a
    job-wide join would otherwise pass on the fast install); no test is skipped or loosened (Decision 235).
  - "The fast tier stays light: no new dependency in requirements-fast.txt and no budget raise."
  - No rescue agents or workaround loops (Decision 55).
