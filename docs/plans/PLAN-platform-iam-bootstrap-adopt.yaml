constraints:
  - No rescue agents or workaround loops (Decision 55)
  - Never `terraform state rm` and never a cross-backend `state mv` -- adoption is `import {}` only; release is the sibling plan's `removed` blocks (terraform/personal/main.tf header, Decision 178 clause 4 / Decision 183)
  - Merge only after pre-merge gates 8-11 pass (rec-4044 closed, bootstrap baseline converged, speculative adoption clean, personal record quiet), and bind the merge to the head step 9 planned -- mcp__github__merge_pull_request(..., merge_method="squash", expectedHeadSha=$PR_HEAD_SHA); any new PR head (a rebase, a fix push) re-runs step 9, and step 8 only if the tfvars secret changed, before merge
  - The adoption apply runs from merged main in the ADMIN container, only after a human has reviewed step 14's presented plan and explicitly directed it (Decision 126)
  - "The adoption must be zero-diff -- never change a permission, a trust document or a tag during adoption; any change is a separate, later plan. Sensitivity-only update (the one tolerated plan action, steps 9 and 14): on aws_iam_role.platform_dev or aws_iam_role.platform_admin only, actions exactly [update] with importing set, before equal to after, no unknown value, no sensitive mark before, and assume_role_policy the only sensitive mark after. It arises because import reads the trust document unmarked while the config marks it sensitive (the ExternalId variables); it changes no value and Terraform applies it without a provider call"
  - Never widen the CI apply role to write these identities (Decision 180 clauses 2-3 are permanent)
  - "V3 merge gate resolved for an admin-only import (implement skill V3 Merge Gate and code-review skill V3 Post-Deploy Evidence; the Decision 48 tension PLAN-heartbeat-canary-plan-time-grant recorded): the import apply must run from merged main (the admin tier applies merged code only, Decision 126), so post-deploy evidence cannot precede merge. Pre-merge evidence is steps 8-11 -- before merge, post a counts-only PR comment (baseline exit code, speculative imports=7 / value changes=0 / sensitivity-only updates=<N step 9 printed>, rec-4044 status, convergence status, $PR_HEAD_SHA, and the URL of the green CI run at that head). The pre-merge code-review dispatch is told this constraint: for this plan its V3 Post-Deploy Evidence check is met before merge by that comment and after merge by the declared post-apply comment, so a High finding for the not-yet-possible post-deploy artifact is answered by citing this constraint, never by an improvised deviation or a pre-merge apply. Post-deploy evidence is steps 12-19 and 22 -- after the walk, post a counts-only comment on the merged PR naming the applied $MERGE_SHA (who accepted the apply and when, imports, the applied changed count (the sensitivity-only updates, 2 expected), snapshot document count and IDENTICAL verdict, follow-up plan exit codes, alarm counts, and the run URL an admin apply otherwise lacks: the S3 console object-version URL of agent-platform-bootstrap-tfstate/terraform.tfstate with its post-apply versionId, which names region, bucket and key but no account id); the plan is not complete until that comment exists. This is the plan-level instance of docs/contracts/deploy-paths.yaml admin_out_of_band.pre_merge_live_plan (approved 2026-10-15, PLAN-admin-root-premerge-plan-gate; steps 8-11 and 23 are its PRE-MERGE GATE and ENVIRONMENT CHECK), not a second statement of it; if this PR merges before that plan's build adds the key, these steps carry the rule on their own and the pointer resolves when the key lands. Neither comment carries an ARN, account id, ExternalId or policy document (Decision 101)."
  - "Environment check before any hand-off assumption: the implementing session runs step 23 first; on ADMIN_CHAIN_OK it runs every step itself, and the walk is never deferred to a hypothetical other session"
  - "The PR declares IAM: merge on explicit human word after the pre-merge gates and green CI; step 15 runs only on explicit human direction of that exact apply command"
  - "Public-repo boundary (Decision 101): snapshots, plan files, plan JSON, the presented plan and the bootstrap tfvars stay in the ADMIN session, scratch or gitignored paths and are never pasted into chat, a PR or a commit -- every IAM document and ARN carries the account id, and adopt.json and the snapshots carry both ExternalIds in plaintext; step 20 removes the scratch artifacts, including after any STOP; the parity tests compare templates, never rendered ARNs"
  - "Freeze: (a) from merge until step 16 converges, no other terraform/bootstrap apply -- the merged import blocks would ride along and skip steps 13-17; after step 16 and until the sibling's forget converges, any bootstrap apply must show a no-op on the seven addresses; (b) from merge until the sibling's forget converges, no terraform/personal PR touching the seven addresses, their referents, or terraform/personal/main.tf's provider default_tags -- TestDualCopyParity catches a one-sided edit at PR time, and step 11 checks for open conflicting PRs"
  - "This PR's squash body must NOT carry `Resolves: rec-3838` -- the sibling plan resolves it"
  - "No file this plan creates or modifies may carry a contiguous terraform/personal/platform_(dev|admin|admin_data)_policies.tf literal (not even a provenance comment such as 'copied from ...'; the parity module joins path segments instead) -- step 5 enforces this, because the sibling's step 2 sweep could otherwise only be fixed by an out-of-scope edit; the declared rec-4047 shard is the sole exception"
  - Do not edit docs/ROADMAP-PLATFORM.yaml (T2.48 / T2.44 files_in_scope pointers go stale; the sibling plan's single T4.2 edit is the only roadmap change in this pair)
