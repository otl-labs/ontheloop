rollback: >-
  Before the sibling plan merges, terraform/personal still owns all seven, so rollback is state-only
  and touches no live object: replace the seven bootstrap resource and import blocks with
  `removed { lifecycle { destroy = false } }` blocks, set the platform_security_admin attachment's
  role back to the "PlatformAdmin" literal in the same change (its reference would otherwise dangle),
  and admin-apply terraform/bootstrap (bootstrap forgets; personal keeps owning; live unchanged). Then retire the four modified shards and the two
  new shards (platform-iam-bootstrap-owns-roles-and-policies, deploy-paths-admin-self-access-isolation-step)
  by git mv to config/agent/verification_registry/entries/deprecated/ -- an in-place repoint back to
  terraform/personal passes at the post-merge origin/main, so run_differential would reject it as
  tautological -- and revert the test and validator repoints. After the
  sibling plan's forget, rollback is that plan's rollback. Never `state rm`, never a cross-backend
  `state mv`.
