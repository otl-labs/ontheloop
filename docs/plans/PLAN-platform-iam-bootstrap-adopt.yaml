  - step: 22
    phase: post-deploy
    action: the Decision 202 detector stayed quiet across the apply, with IAM-event delivery proven in every period that brackets it
    command: |-
      N=$(cat terraform/bootstrap/*.tf | grep -cE '^[[:space:]]*alarm_name[[:space:]]*=[[:space:]]*"platform-security-') && bin/venv-python - "$N" "$(cat "${TMPDIR:-/tmp}/platform-iam-migration/applied_at")" <<'EOF'
      import sys, time, datetime as dt, boto3
      n, a, P = int(sys.argv[1]), int(sys.argv[2]), 900
      s = (a // P) * P - P
      e = s + 3 * P
      now = int(time.time())
      f = lambda x: dt.datetime.fromtimestamp(x, dt.timezone.utc)
      if now < e + 300:
          sys.exit(f"WAIT -- re-run after {f(e + 300):%H:%M}Z, when the three 900 s periods bracketing the apply have closed")
      cw = boto3.Session(profile_name="agent_platform_admin").client("cloudwatch")
      al = [m for pg in cw.get_paginator("describe_alarms").paginate(AlarmNamePrefix="platform-security-") for m in pg["MetricAlarms"]]
      if n < 5 or len(al) != n:
          sys.exit(f"ALARM COUNT -- live {len(al)}, declared {n}")
      bad = sorted(m["AlarmName"] for m in al if m["StateValue"] != "OK")
      if bad:
          sys.exit(f"NOT OK -- {bad}")
      dp = cw.get_metric_statistics(Namespace="PlatformSecurity", MetricName="IamEventHeartbeat", StartTime=f(s), EndTime=f(e), Period=P, Statistics=["Sum"])["Datapoints"]
      fed = sum(1 for d in dp if d["Sum"] >= 1)
      if fed != 3:
          sys.exit(f"DELIVERY GAP -- {3 - fed} of the 3 periods bracketing the apply had no delivered IAM event")
      h = [i for pg in cw.get_paginator("describe_alarm_history").paginate(HistoryItemType="StateUpdate", StartDate=f(s), EndDate=f(now)) for i in pg["AlarmHistoryItems"] if i["AlarmName"].startswith("platform-security-") and "to ALARM" in i["HistorySummary"]]
      if h:
          sys.exit(f"{len(h)} platform-security transition(s) to ALARM since the bracket start")
      print(f"DETECTOR QUIET -- {n} alarms declared and live, all OK, none entered ALARM since the bracket start; IAM events delivered in all 3 periods bracketing the apply")
      EOF
    expected: >-
      DETECTOR QUIET -- an import performs only IAM reads, so neither the IAM-change nor the denied-call filter
      should fire. The verdict is bound to the apply window: the three 900 s periods (the heartbeat alarm's own
      grain) that bracket step 15's applied_at -- the one before, the one containing it and the one after -- must
      each show at least one delivered IamEventHeartbeat event (the canary feeds one every 5 minutes), so a
      trail-to-Logs gap overlapping the apply cannot read as quiet even though the four change, denied, tamper
      and topic alarms treat missing data as notBreaching. The live alarm count must equal the platform-security-*
      alarm_name declarations on merged main (5 today; a later alarm such as rec-4204's raises both sides), every
      alarm must be OK, and none may have entered ALARM since the bracket start. Only counts and alarm names are
      printed.
    fix_if: >-
      WAIT -- the bracket has not closed; re-run at the printed time (never shorten the bracket). ALARM COUNT -- a
      declared alarm is unapplied or an undeclared one exists: stop and reconcile through its own human-gated
      loop. A transition to ALARM, or NOT OK on a change, denied-call or tamper alarm -- something wrote (or tried
      to write) IAM during the walk: stop and RCA before the sibling plan merges. DELIVERY GAP, or the heartbeat
      alarm not OK -- the detector may have been blind across the apply, so the quiet verdict cannot be
      established. The bracket is fixed in time, so a re-run reads the same three periods: allow ONE re-run at
      least 15 minutes later to rule out late-arriving datapoints, and report both results; a gap that persists
      is not cured by restoring delivery afterwards: STOP, triage per the
      platform-security-iam-event-heartbeat alarm's alarm_description (canary schedule and executions, then
      AWS/Logs IncomingLogEvents on platform-security-cloudtrail), and put the gap to the human for adjudication
      before the sibling plan merges
