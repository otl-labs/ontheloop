bundled_recommendations: []
followon_recs: ["rec-4047"]
infrastructure_dependencies:
  - "terraform/bootstrap is NEVER auto-applied (terraform/bootstrap/CLAUDE.md, CD.35 Wave 4 / T2.23): every live step runs in the ADMIN container under agent_platform_admin, and the adoption apply runs from merged main only after a human has reviewed the presented plan and explicitly directed it (Decision 126 human-gated admin tier)."
  - "ADMIN container precondition (Decision 120): bin/setup-cloud-env.sh ran with INSTALL_TERRAFORM=1 and a non-empty provider-mirror sync, so TF_CLI_CONFIG_FILE is set, both roots initialise, and terraform/personal/terraform.personal.tfvars is materialised. DEV containers cannot init a root that pulls a third-party provider (Decision 119; terraform/personal's neon provider) -- HCL validity is delegated to CI's required terraform-validate check, which covers terraform/bootstrap."
  - "HARD PREREQUISITE, checked BEFORE merge (step 10): rec-4044 (state-free IAM-change alarms on both roles) is closed. Merging arms the seven import blocks for any later bootstrap apply, so the gate must hold before the merge, not only before step 15."
  - "BASELINE and SPECULATIVE ADOPTION, checked BEFORE merge (step 9): a terraform/bootstrap plan at the pre-merge origin/main exits 0, and a plan-only adoption at the reviewed PR head is exactly seven imports with no value change (a value-unchanged, sensitivity-only update of assume_role_policy on the two roles (defined in constraints) is the one tolerated action) -- so step 14 is a confirmation at merged main, not the first sight of the diff."
  - "No terraform/personal apply happens in this plan. The bootstrap import writes only bootstrap state, so no personal saved plan goes stale and the personal drift plan stays no-diff; the seven objects are dual-owned until the sibling plan's gated forget."
  - "IAM precedence is unaffected: no Lambda code or IAM content changes; the adoption must not change any permission (zero-diff gate)."
  - "CI-first (why each ADMIN step cannot go through CI): terraform/bootstrap has no CI plan or apply path by design -- it holds CI's own apply role and permissions boundary (Decision 126, T2.23), and only PlatformAdmin's BootstrapStateProvisioning can read its state -- so step 15's import apply is the one admin WRITE and is bootstrap break-glass. Every other ADMIN step (8, 9, 11-14, 16-19, 22) is a read or local scratch; step 20 deletes local scratch. No terraform/personal change is made, so nothing here bypasses the CI pipeline."
  - "PlatformAdmin's managed-policy permission source, the sixth across the two roles (Decision 202's platform-security-detector-admin managed policy) is already bootstrap-owned; this plan only rewires its attachment's role argument to the adopted resource, a zero-diff change that steps 9 and 14 assert (no non-import change anywhere in the root)."
acceptance_criteria:
  - terraform/bootstrap declares aws_iam_role.platform_dev, aws_iam_role.platform_admin and the five inline policies (platform_dev_runtime, platform_admin_ops, platform_admin_datalake, platform_admin_bootstrap_state, platform_admin_ducklake_breakglass), each with an import block whose id is the role name or role:policy name
  - Both roles, AdminOps and BootstrapStateProvisioning carry lifecycle prevent_destroy; BootstrapStateProvisioning and AdminOps carry preconditions protecting the bootstrap-state statements and the IAMFull statement; every bootstrap inline policy carries a <= 10240 B size precondition
  - Every bootstrap copy of a personal-root name equals a source file the sibling plan keeps, asserted as templates with no rendered account id anywhere in the repository
  - The bootstrap DailyOps copy carries Decision 213's split -- InvokeFunctionUrl unconditioned, InvokeFunction only with Bool lambda:InvokedViaFunctionUrl = true -- on all six writer/reader/telemetry-writer ARN forms, and test_url_only_invoke_guard checks the identity grants of both roots and the six forms on the bootstrap copy
  - The platform-security-detector-admin attachment (PlatformAdmin's managed-policy permission source) references aws_iam_role.platform_admin.name, and test_cloudtrail_write_grant_scoped's red cases still mutate and fail
  - While both roots declare the seven addresses, the two copies agree on role arguments, trust shape, per-Sid Effect/Action/Resource/Condition and the effective tag set
  - Before merge, rec-4044 is closed and a terraform/bootstrap plan at the pre-merge origin/main exits 0
  - The admin adoption plan reads exactly seven imports and zero add, value change or destroy across the whole bootstrap root (the rewired attachment included); the only tolerated action is a value-unchanged, sensitivity-only update of assume_role_policy on the two imported roles, which Terraform applies without calling the provider; the trust documents show no value diff and the ExternalIds render as sensitive
  - After the adoption apply, a bootstrap plan exits 0 and a before/after snapshot of both roles' complete IAM surface (role documents, inline and attached policy lists, every live inline document, and the default-version document of every attached managed policy) is identical, and all platform-security-* alarms stay OK
  - After the adoption apply, an ADMIN terraform/personal plan exits 0 and the personal convergence record is green with no pending marker; no terraform/personal apply is performed
  - The IAM guards (fence test, observability read coverage, four registry shards -- platformdev-state-convergence-denies-intact re-authored to assert the exact four-Sid DenyState set) read the bootstrap copy and pass; the four modified shards and the two new shards are admitted by run_differential
  - docs/contracts/deploy-paths.yaml's admin procedure carries the self-access isolation step before POST-APPLY, and terraform/bootstrap/CLAUDE.md stays within its prose budget
verification_plan:
  - step: 1
    phase: pre-deploy
    action: bootstrap owns the seven addresses -- declared, imported, protected, and name-parity with surviving terraform/personal sources
    command: bin/venv-python -m pytest "tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py::TestBootstrapOwnsPlatformIam" -q
    expected: >-
      all tests pass, including the red cases (a dropped import block, a missing prevent_destroy, a
      missing IAMFull or self-access precondition, an ExternalId variable that is not sensitive or has
      a default, a literal-ARN boundary in place of the resource reference, a boundary on
      PlatformAdmin, a wildcard-suffix secret ARN, the attachment's role reverted to the literal, a drifted
      bucket/table/function/prefix/secret/user-name constant) proving each assertion can fail; red before
      this plan is implemented (the module does not exist), green after
    fix_if: an address is missing, an import id is malformed, a protection is absent, or a constant diverges from its terraform/personal source
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: platform-iam-bootstrap-owns-roles-and-policies
  - step: 2
    phase: pre-deploy
    action: while both roots declare the seven addresses, the two copies agree on everything that governs live IAM
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_platform_iam_dual_copy_parity.py -q
    expected: >-
      all tests pass -- role scalar arguments, trust shape, per-Sid Effect/Action/Resource/Condition
      after the declared substitution map, and the effective tag set all match across the two roots,
      with red cases for a one-sided Resource, Condition, description and default_tags edit
    fix_if: a copy diverges -- reconcile the bootstrap copy to the personal copy (the personal copy is what live state matches today)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Transitional by design: the sibling plan deletes this module once terraform/personal stops
      declaring the addresses, so a registry row for it would have to be retired by git mv to
      entries/deprecated/ one merge later. The durable claim (bootstrap owns the seven, with
      name parity) is graduated by step 1.
  - step: 3
    phase: pre-deploy
