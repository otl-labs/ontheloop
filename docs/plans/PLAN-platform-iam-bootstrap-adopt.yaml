      drifted constant. Stays under the
      500-SLOC limit (Decision 128) because the transitional parity class lives in its own module.
  - file: tests/checks/iam_tf/test_platform_iam_dual_copy_parity.py
    action: Create
    purpose: >-
      TestDualCopyParity (transitional; the sibling plan deletes this module once terraform/personal
      stops declaring the addresses): for every dual-declared address, both copies match on the role
      scalar arguments (name, description, max_session_duration, permissions_boundary rendering), the
      trust statement shape (Effect, Action, Principal template, Condition keys and variable names),
      and per-Sid Effect, Action, Resource and Condition after a declared personal-to-bootstrap
      reference substitution map (for example aws_s3_bucket.data_lake.arn to its bootstrap local, and
      aws_lambda_function.ducklake_writer.arn / ducklake_reader.arn to the literal ARN templates, so
      DuckLakeInvokeViaUrlOnly's Bool lambda:InvokedViaFunctionUrl condition is compared on both sides);
      and terraform/personal's provider default_tags equal bootstrap's default_tags merged with the
      roles' resource-level tags. Condition extraction is implemented locally in this module, reusing
      scripts/checks/iam_tf/_read_coverage.py's _locate_policy_statement_array and the brace-depth
      _extract_block helper it already uses -- _read_coverage.py itself is NOT edited (it is outside
      this plan's scope; validate_scope_boundary). The module builds every source path by joining
      segments (for example _REPO_ROOT / "terraform" / "personal" / "platform_dev_policies.tf", as the
      fence test already does), so each basename is still mentioned for --pre affected-test selection
      while no contiguous terraform/personal/platform_*_policies.tf literal appears (the no-old-path
      constraint). Red cases for a one-sided Resource edit, Condition edit (including dropping the
      Decision 213 InvokedViaFunctionUrl condition from the bootstrap DailyOps copy), role
      description edit and default_tags edit.
  - file: tests/checks/iam_tf/test_url_only_invoke_guard.py
