schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "platform-iam-bootstrap-adopt"
intent: >-
  First half of rec-3838: adopt the two non-CI-writable IAM roles (PlatformDev, PlatformAdmin) and
  all five inline policies on them into the admin-only terraform/bootstrap root with zero-diff
  imports, wire PlatformAdmin's managed-policy permission source (Decision 202's platform-security-detector-admin
  attachment; the sixth permission source across the two roles) to the adopted role, and re-anchor the standing IAM guards -- including Decision 213's
  URL-only invoke guard -- on that copy. Once the sibling plan releases them
  from terraform/personal, each Terraform state holds only what its applier may mutate, which
  removes the split-apply / stale-saved-plan race class (Decision 190's named pattern) at its
  source rather than managing it procedurally.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-platform-iam-bootstrap-adopt.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-3838, plan 1 of 2 (sibling:
  PLAN-platform-iam-personal-release resolves rec-3838). No tier_item criterion claimed. Adjacent:
  T2.48 (in_progress; its files_in_scope names the personal policy files, not edited here) and
  T2.23 (bootstrap root, complete).
closes_criteria: []
scope:
  - file: terraform/bootstrap/platform_roles.tf
    action: Create
    purpose: >-
      aws_iam_role.platform_dev and aws_iam_role.platform_admin copied from terraform/personal with
      identical arguments (name, description, max_session_duration, trust documents built from
      var.account_id, var.agent_service_account_user_name and the two ExternalId variables).
      PlatformDev's permissions_boundary references aws_iam_policy.github_ci_apply_boundary.arn (it
      renders the identical ARN, encodes the dependency, and keeps validate_authority_budget's
      root-wide boundary check discriminating) and stays within the first three lines of the block,
      because the platformdev-bounded-platformadmin-excluded shard reads it with grep -A3.
      Resource-level `tags` reproduce the personal default_tags values bootstrap's default_tags do
      not carry (Account = "personal", ManagedBy = "Terraform") so tags_all is unchanged and the
      import is zero-diff. lifecycle prevent_destroy on both roles. Two import blocks (ids
      PlatformDev, PlatformAdmin).
  - file: terraform/bootstrap/platform_dev_policies.tf
    action: Create
    purpose: >-
      DailyOps (aws_iam_role_policy.platform_dev_runtime) copied with its hoisted policy local and
      its existing byte-size precondition. Personal-root object references become bootstrap locals
      built from literal names and var.account_id / var.aws_region (bucket, counters table, keeping
      the local names ducklake_prod_data_prefix and ducklake_smoke_data_prefix); the two
      inference-credential secret ARNs come from data "aws_secretsmanager_secret" lookups by name
      (exact ARN, rendered document unchanged). Decision 213 cl.1 is carried verbatim: the two invoke
      statements DuckLakeInvokeUrl (lambda:InvokeFunctionUrl, unconditioned) and
      DuckLakeInvokeViaUrlOnly (lambda:InvokeFunction with Bool lambda:InvokedViaFunctionUrl = "true")
      each name the writer, reader and telemetry writer as literal templates
      "arn:aws:lambda:${var.aws_region}:${var.account_id}:function:agent-platform-ducklake-<fn>" plus
      the ":*" form -- the same form this root's boundary DenyDuckLakeDirectInvoke uses and the only
      forms test_url_only_invoke_guard recognises without a name-only local (never a full-ARN local
      referenced as bare local.x, which that guard skips silently). role = aws_iam_role.platform_dev.id.
      Import block PlatformDev:DailyOps.
  - file: terraform/bootstrap/platform_admin_policies.tf
    action: Create
    purpose: >-
      AdminOps (aws_iam_role_policy.platform_admin_ops) copied with its hoisted local and byte-size
      precondition, plus lifecycle prevent_destroy and a precondition asserting the IAMFull
      statement is still present -- that precondition must not use the
      length(jsonencode(jsondecode(local. measure, because the
      personal-policies-carry-byte-preconditions shard requires exactly one such measure per file.
      Import block PlatformAdmin:AdminOps.
  - file: terraform/bootstrap/platform_admin_data_policies.tf
    action: Create
    purpose: >-
      PlatformDataLakeProvisioning, BootstrapStateProvisioning and DuckLakeBreakGlass copied, each
      hoisted into a local so a <= 10240 B size precondition can measure it (a precondition cannot
      reference self). BootstrapStateProvisioning gets lifecycle prevent_destroy and a precondition
      asserting its statements still name the agent-platform-bootstrap-tfstate bucket ARN and object
      ARN. The DuckLake DSN secret ARN comes from a data "aws_secretsmanager_secret" lookup by name.
      Three import blocks (PlatformAdmin:<policy name>).
  - file: terraform/bootstrap/variables.tf
    action: Modify
    purpose: >-
      Add agent_service_account_user_name (default "agent-service-account", matching personal)
      and platform_dev_external_id / platform_admin_external_id (sensitive, no default, supplied
      via the gitignored terraform.bootstrap.tfvars -- never a committed literal).
  - file: terraform/bootstrap/platform_security_admin_policy.tf
    action: Modify
    purpose: >-
      Wire PlatformAdmin's managed-policy permission source (the sixth across the two roles) to the adopted role:
      aws_iam_role_policy_attachment.platform_security_admin's role = "PlatformAdmin" becomes
      role = aws_iam_role.platform_admin.name (same rendered value, known at plan time from the role's
      literal name, so no replace and zero live diff; it encodes the dependency in the one root that now
      declares the role). Rewrite the header comment's "this root does not declare PlatformAdmin ...
      moves it here later" sentence to the present state, and reword the PlatformSecurityTrailBucketManage
      comment so it names PlatformDataLakeProvisioning's CatalogDrBucketManage Sid instead of the
      terraform/personal data-policy file path (the no-old-path constraint). The policy document and the
      attachment's policy_arn are unchanged.
  - file: terraform/bootstrap/CLAUDE.md
    action: Modify
    purpose: >-
      Scope and pointer lines only (Decision 127): the module now also owns the two admin-tier
      identities and their inline policies; the import-verification section names them and points
      at docs/contracts/deploy-paths.yaml admin_out_of_band.procedure for the standing rule; the
      Prerequisites line and the "Prepare variables" tfvars template add platform_dev_external_id
      and platform_admin_external_id (sensitive, no default) with their materialisation source (the
      agent-platform-terraform-personal-tfvars secret, admin-readable), so the next operator does
      not hit "No value for required variable". Fold the scope line into the existing Decision 202
      sentence ("It also owns the platform-security-* IAM-change detector") rather than adding a
      second one. The one-time adoption walkthrough lives in this plan's VP and the PR description
      (Decision 115), not in standing prose. The file measures 5120 prose bytes against its
      config/prose_budgets.yaml budget of 5151 (31 B headroom, re-measured 2026-10-15 after #1283
      added a scope line), so fund the lines by replacing the stale "State-migration ordering" section --
      it prescribes `terraform state rm`, which terraform/personal/main.tf now forbids -- with a
      one-line pointer to the import/removed pattern. Net size must not exceed the budget: trim, or
      relocate detail to a docs/contracts/*.yaml the file points at -- never raise, and never split
      the file into fragments (config/prose_budgets.yaml header). Pre-authorised extra trims if the
      retired section plus headroom (~650 B) is not enough: compress the step-4 import-verification
      prose, and point the tfvars-source note at docs/contracts/terraform-cc-web-operations.yaml
      instead of restating it.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Add one admin_out_of_band.procedure step, placed between the PRE-APPLY and POST-APPLY steps
      (the sibling's ordering test asserts PRE-APPLY < isolation < POST-APPLY): a
      terraform/bootstrap apply that changes BootstrapStateProvisioning or AdminOps' IAMFull
      statement carries no other change, and its plan must show no trust-document diff on either
      role (bare-action wording, no restated guard classification -- Decision 126 point 2).
      amendment_log entry.
  - file: tests/test_deploy_paths_admin_procedure.py
    action: Modify
    purpose: >-
      Add test_admin_procedure_has_self_access_isolation_step beside the module's existing tests (one at
      planning; PLAN-admin-root-premerge-plan-gate's build may add more):
      a step names both BootstrapStateProvisioning and IAMFull, forbids bundling them with any other
      change, and precedes the POST-APPLY step.
  - file: config/agent/verification_registry/entries/deploy-paths-admin-self-access-isolation-step.yaml
    action: Create
    purpose: graduate the self-access isolation test (function-level node id) under this plan's slug
  - file: tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py
    action: Create
    purpose: >-
      TestBootstrapOwnsPlatformIam (durable, graduated): the seven addresses are declared in
      terraform/bootstrap with correctly shaped import blocks; prevent_destroy on both roles, AdminOps
      and BootstrapStateProvisioning; AdminOps carries the IAMFull-presence precondition and
      BootstrapStateProvisioning the precondition naming the agent-platform-bootstrap-tfstate bucket
      ARN and object ARN; platform_dev_external_id and platform_admin_external_id are sensitive with
      no default; the three secret ARNs come from data "aws_secretsmanager_secret" lookups by name,
      never a `-*` suffix; aws_iam_role_policy_attachment.platform_security_admin's role is exactly
      aws_iam_role.platform_admin.name (PlatformAdmin's managed-policy source is wired to the adopted role,
      never the bare literal); PlatformDev's permissions_boundary is exactly
      aws_iam_policy.github_ci_apply_boundary.arn within the block's first three lines, and
      PlatformAdmin declares no permissions_boundary; each role's trust statement carries a StringEquals sts:ExternalId condition
      on its own sensitive variable (the Decision 113 confused-deputy defence, which outlives the
      transitional parity module); and every bootstrap copy of a personal-root name equals its source,
      compared as templates (never rendered ARNs, Decision 101). It reads ONLY sources that survive
      the sibling plan -- bucket and counters table from terraform/personal/main.tf, function names
      (the locals ducklake_writer_function, ducklake_reader_function and
      ducklake_telemetry_writer_function, each equal to the name inside the bootstrap DailyOps ARN
      templates) and data prefixes from terraform/personal/ducklake_lambdas.tf, secret names from
      inference_credentials.tf and neon_ducklake_catalog.tf, the service-account default from
      terraform/personal/variables.tf (rec-4048 must re-anchor that leg when it retires the
      variable), and the boundary name from bootstrap's own aws_iam_policy.github_ci_apply_boundary
      -- never platform_roles.tf or the three policy files. Red cases for a dropped import, a missing
      prevent_destroy, a missing IAMFull or self-access precondition, an ExternalId variable without
      sensitive = true or with a default, a trust statement without its sts:ExternalId condition, the
      attachment's role reverted to the "PlatformAdmin" literal, a
      literal `arn:aws:iam::${var.account_id}:policy/agent-platform-github-ci-apply-boundary` boundary
