schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: true
slug: "platform-iam-ci-grant-retirement"
intent: >-
  Finish the platform IAM move (rec-4049): now that PlatformDev and PlatformAdmin live only in the
  admin-only terraform/bootstrap root (Decision 223) and terraform/personal's state has released
  them, retire the three CI grants that still name them -- PlatformDev in the CI apply role's
  IAMRoleMetadataWrite, and both roles in the apply role's IAMRolesRead and the CI planner's
  IAMPlatformRolesRead -- and record the Decision 180 adjudication Decision 223 clause 3 left to
  this plan, so no CI identity holds any IAM grant on the two identities that govern the platform.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-platform-iam-ci-grant-retirement.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-4049, follow-on of
  PLAN-platform-iam-personal-release (rec-3838, merged #1540). No tier_item criterion claimed.
closes_criteria: []
scope:
  - file: terraform/bootstrap/github_ci_apply_policy.tf
    action: Modify
    purpose: >-
      IAMRoleMetadataWrite's Resource becomes exactly ["arn:aws:iam::${var.account_id}:role/agent-platform-*"]
      (drop the role/PlatformDev line). Its comment's rec-3327 / Decision 180 paragraph (the lines from
      "rec-3327 / Decision 180: the metadata risk class" to "would become CI-mutable.") is replaced by a
      short paragraph: Decision NNN re-narrowed the class to role/agent-platform-* once Decision 223 moved
      PlatformDev to terraform/bootstrap; no CI identity holds any IAM grant on PlatformDev or PlatformAdmin
      (Decision NNN clause 2; PlatformAdmin's exclusion is Decision 180 clause 3); the pin is
      tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py. Comments name the roles without a
      "role/" prefix (rec-4049's text checks grep for that literal). No other Sid, verb or resource changes.
  - file: terraform/bootstrap/github_ci_apply_reads.tf
    action: Modify
    purpose: >-
      IAMRolesRead drops the two role/PlatformDev and role/PlatformAdmin lines. One comment line beside the
      RETIREMENT ORDERING RULE records that the two roles' ARNs were pruned under it by rec-4049 after
      terraform/personal's forget converged (2026-10-17, #1540); the Sid's header comment "branch, pr, plan,
      drift, platform, ducklake roles" drops "platform". No other Sid changes.
  - file: terraform/personal/oidc.tf
    action: Modify
    purpose: >-
      The planner's IAMPlatformRolesRead drops the PlatformDev and PlatformAdmin lines; its comment
      "IAM read-quartet on the platform roles (codified in platform_roles.tf)" becomes "IAM read-quartet on
      the agent-platform-* execution roles terraform/personal manages" with a pointer that PlatformDev and
      PlatformAdmin are bootstrap-owned and never CI-readable (Decision NNN). Sid name unchanged. No other
      statement changes (the trust locals rec-3902 will edit are untouched).
  - file: tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py
    action: Modify
    purpose: >-
      The standing guard for Decision NNN clause 2. (1) _EXPECTED_METADATA_WRITE_RESOURCES becomes exactly
      {role/agent-platform-*}; the method is renamed test_resource_set_is_exactly_agent_platform_prefix.
      (2) test_carries_all_four_metadata_verbs and TestPlatformAdminNeverMatchedByAnyAllowSid are kept
      unchanged; that class gains test_no_allow_sid_resource_pattern_matches_a_concrete_platformdev_arn
      (same rule, PlatformDev). (3) New pure predicate ci_platform_role_iam_leaks(texts) returning
      (file, sid, pattern) for every Allow statement that carries an iam: action (or the bare action "*")
      and whose literal Resource pattern fnmatches a concrete PlatformDev or PlatformAdmin ARN, over BOTH HCL
      dialects: jsonencode Statement lists (Sid/Effect/Action/Resource) and `statement {}` blocks
      (sid/effect/actions/resources), over terraform/bootstrap/github_ci_apply_policy.tf and
      github_ci_apply_reads.tf (the apply role's two policies; the boundary is a ceiling and is not
      scanned) and EVERY terraform/personal/*.tf file (all of it CI-applied). Fail-closed by independent
      count, per file and per dialect (tests/CLAUDE.md: derive the count, never a floor): the parsed
      `statement {}` blocks must equal a raw count of `statement {` openings, and the parsed jsonencode
      statements must equal a raw count of `Effect =` keys, both over comment-masked text; the two bootstrap
      files and oidc.tf, oidc_ci_roles.tf and oidc_pipeline_roles.tf must each be present and non-empty.
      ATTACHMENTS (fail closed): in the scanned files, any aws_iam_role_policy_attachment,
      aws_iam_policy_attachment, *_exclusive attachment set or managed_policy_arns whose policy is not an
      aws_iam_policy declared in a scanned file is a problem -- an AWS-managed ARN (arn:aws:iam::aws:policy/...)
      such as IAMReadOnlyAccess would grant the read quartet on both roles through the boundary's iam:Get*
      ceiling; today the only attachment is the apply role's own reads policy, which is allowed.
      POLICY SOURCES (fail closed): in the scanned files, every `policy =` on aws_iam_role_policy and
      aws_iam_policy, every aws_iam_role inline_policy, and every source_policy_documents /
      override_policy_documents element must resolve to a jsonencode literal, a local holding one, or a
      data "aws_iam_policy_document" declared in a scanned file; anything else (a data "aws_iam_policy" such as
      IAMReadOnlyAccess, a heredoc, file() or templatefile()) is a problem, and so is any `dynamic "statement"`
      block. Planning census: every policy source in the scanned files is one of the allowed forms and no
      dynamic statement exists (file() appears only for non-policy config values). APPLY ROLE UNIVERSE: any
      aws_iam_role_policy, attachment or *_exclusive resource in ANY terraform/bootstrap file whose role is
      aws_iam_role.github_ci_apply (or the literal name agent-platform-github-ci-apply), other than
      aws_iam_role_policy.github_ci_apply and aws_iam_role_policy_attachment.github_ci_apply_reads, is a problem,
      and so is an inline_policy block or a managed_policy_arns argument on any terraform/bootstrap aws_iam_role
      whose name resolves to agent-platform-github-ci-apply; "whose role is" resolves aws_iam_policy_attachment's
      roles list and local/var indirection the way the Decision 223 guard does (_resolve and _list_elements in
      tests/checks/iam_tf/test_platform_iam_admin_root_only.py). Red case: managed_policy_arns =
      ["arn:aws:iam::aws:policy/IAMReadOnlyAccess"] on aws_iam_role.github_ci_apply. The ATTACHMENTS failure
      message says the way out for a harmless AWS-managed attachment is a reviewed edit to this guard. Planning census: on the unedited tree the only iam: Allows matching
      either role are the five lines this plan removes. New class TestNoCIIamGrantOnPlatformRoles: the real tree has no leak. Red cases
      driving the real predicate on mutated text (Decision 187): PlatformDev re-added to
      IAMRoleMetadataWrite; PlatformAdmin added to bootstrap IAMRolesRead; PlatformDev added to oidc.tf
      IAMPlatformRolesRead; an iam: statement with Resource role/* in oidc_pipeline_roles.tf; a scanned
      file emptied (fail-closed). Negative control: a non-iam statement with Resource "*" is not flagged.
      HARDENING (fail closed; none of these shapes is in an iam: statement today, so no false positive):
      scalar Action or Resource strings as well as lists; Sid-less jsonencode statements; a `statement {}`
      block with no effect counts as Allow (the provider default); any Allow carrying NotAction / not_actions is a
      problem whatever its list (NotAction = ["s3:*"] grants every iam: verb), and so is a NotResource /
      not_resources key in a statement carrying an iam: action; actions are case-folded before the iam: test,
      and an action pattern whose case-folded fnmatch covers an iam: verb ("*", "i*", "IAM:Get*") counts as
      iam; so is an iam:
      statement whose Resource is not a string literal after substituting ${var.account_id} and
      ${var.aws_region}; role names match case-insensitively (IAM role names are case-insensitive,
      platform_security_alarms.tf). Reuse the existing parsers where they fit
      (scripts/checks/iam_tf/_read_coverage.py, tests/checks/iam_tf/_platform_security_hcl.py) rather than a
      third. Extra red cases: scalar Resource naming PlatformDev; a Sid-less statement; an effect-less
      `statement {}`; a NotResource statement; a lower-case "platformdev"; an AWS-managed policy attachment on
      a CI role; one dialect made unparseable in oidc_ci_roles.tf while the file's other dialect still parses
      (the per-dialect count must fail); IAMReadOnlyAccess composed into github_ci_planner's
      source_policy_documents through a data "aws_iam_policy"; a heredoc JSON statement granting iam:GetRole on
      role/PlatformDev; a dynamic "statement" block; NotAction = ["s3:*"] on an Allow; "IAM:GetRole" on
      role/PlatformDev; a second inline policy on the apply role declared in terraform/bootstrap/main.tf. The module names the five CI
      policy files by path (its fail-closed list), which is what makes --pre select it (step 24). Module
      docstring names Decision NNN. The predicate and parsers live in the new helper module (next row); the test
      module stays under 500 SLOC (88 today).
