acceptance_criteria:
  - IAMRoleMetadataWrite's Resource is exactly role/agent-platform-*; neither bootstrap CI policy file nor terraform/personal/oidc.tf contains a role/PlatformDev or role/PlatformAdmin ARN; no Allow statement carrying an iam action in the CI roles' policies matches either role (the guard, red-cased)
  - The simulate fixture expects implicitDeny for the four metadata verbs on PlatformDev, iam:GetRole on PlatformDev and iam:GetRolePolicy on PlatformAdmin, keeps the PlatformAdmin negatives and stays within its 650-line budget without a raise
  - The approved Decision NNN (amends exactly 180) and its Updates on Decisions 180, 202 and 223 are in DECISIONS.md, NNN is under the 6,144-byte cap, no prior clause text changed, and the index is fresh; the approved deploy-paths citation replaces "(Decision 180 clauses 2-3 are permanent)" and the alarm comment no longer says "until rec-4049 lands"
  - Before merge, the read-only ADMIN bootstrap plan at the PR head shows exactly two in-place updates removing exactly the three grants, and the PR's CI speculative plan shows exactly one in-place update (the planner's policy) with guard PASS
  - After merge, CI applies the planner change and the convergence record is green at the merge commit; after the human-directed bootstrap apply, the live simulate reports zero mismatches, a bootstrap plan shows no changes, neither CI role's live policies name either platform role, and the next terraform-drift run under the narrowed planner is green
  - rec-4049 is closed via the squash-merge Resolves trailer, its acceptance re-grounded to the guard's pytest node ids first
verification_plan:
  - step: 1
    phase: pre-deploy
    action: the guard pins the narrowed class and finds no CI IAM grant on either platform role, and every red case trips it
    command: |-
      bin/venv-python -m pytest -q "tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py::TestIAMRoleMetadataWriteScope" "tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py::TestPlatformAdminNeverMatchedByAnyAllowSid" "tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py::TestNoCIIamGrantOnPlatformRoles"
    expected: all selected tests pass; red before (the exact-set pin fails on the PlatformDev line and TestNoCIIamGrantOnPlatformRoles does not exist on origin/main), green after
    fix_if: a leak names a file and Sid -- remove the grant there; a red case passes -- the predicate is too narrow, fix it; never loosen an assertion (Decision 181)
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: The nodes are standing suite tests that pytest_diff and the full tier already run on every PR; a registry row would re-run the same nodes.
  - step: 24
    phase: pre-deploy
    action: under --pre, an edit to any of the five CI policy files selects the guard, and an oidc.tf edit still selects the Decision 223 guard
    command: |-
      bin/venv-python -c "import sys; from scripts.checks.deps.affected_tests import derive_affected_tests as d; G='tests/checks/iam_tf/test_platform_role_metadata_admin_scope.py'; R='tests/checks/iam_tf/test_platform_iam_admin_root_only.py'; fs=['terraform/personal/oidc.tf','terraform/personal/oidc_ci_roles.tf','terraform/personal/oidc_pipeline_roles.tf','terraform/bootstrap/github_ci_apply_policy.tf','terraform/bootstrap/github_ci_apply_reads.tf']; sel={f: set(d([('M',f)])['selected']) for f in fs}; bad=[f for f in fs if G not in sel[f]]+(['oidc.tf no longer selects the Decision 223 guard'] if R not in sel['terraform/personal/oidc.tf'] else []); sys.exit('NOT SELECTED: '+str(bad)) if bad else print('GUARDS SELECTED ON ALL FIVE')"
    expected: prints the marker; red before (today oidc_ci_roles.tf, oidc_pipeline_roles.tf, oidc.tf and github_ci_apply_reads.tf do not select the metadata guard), green after
    fix_if: a file not selected -- the guard module must name that file's path (its fail-closed list does); oidc.tf losing the Decision 223 guard -- restore the oidc.tf mention in that module's docstring
    hermetic: true
    expected_literals: ["GUARDS SELECTED ON ALL FIVE"]
    graduation: waive
    graduation_waiver_reason: A landing check of the --pre selection edges. The five metadata-guard edges are kept by the guard module's literal file list (red-cased in step 1); the oidc.tf edge to the Decision 223 guard rests on a docstring mention nothing pins, and losing it only narrows --pre, which Decision 223's Coverage already scopes as when --pre selects it.
