    hermetic: true
    expected_literals: ["NO CI PLATFORM ROLE ARNS"]
    graduation: waive
    graduation_waiver_reason: A landing check of rec-4049's original text acceptance (it also counts comment mentions, which the guard ignores); the structural invariant is step 1's standing guard.
  - step: 3
    phase: pre-deploy
    action: the simulate fixture expects the narrowed surface and still passes its shape check
    command: |-
      bin/venv-python -c "import sys,yaml; from scripts.checks.contracts.validate_iam_simulate_fixture_shape import validate_iam_simulate_fixture_shape as v; f=[]; v(f); d=yaml.safe_load(open('docs/contracts/iam-simulate-fixture.yaml')); rows={r['id']:r for r in d['triples']}; want={'platformdev-tag-role','platformdev-untag-role','platformdev-update-role','platformdev-update-role-description','platformdev-get-role-negative','platformadmin-get-role-policy-negative','platformadmin-update-role-description-negative','platformadmin-update-role-negative'}; bad=[i for i in sorted(want) if i not in rows or rows[i]['expected_decision']!='implicitDeny' or not rows[i].get('by_design')]; sys.exit(f'shape={f} bad={bad}') if f or bad else print('FIXTURE NARROWED')"
    expected: prints the marker; red before (the four PlatformDev rows expect allowed and the two read negatives are absent), green after
    fix_if: a named row is missing, still allowed or lacks by_design -- fix the row; a shape failure -- follow its message
    hermetic: true
