    graduation: waive
    graduation_waiver_reason: The fixture's standing guard is validate_iam_simulate_fixture_shape (both tiers) plus the live POST-APPLY simulate; the row-content leg is a one-time landing check.
  - step: 4
    phase: pre-deploy
    action: the approved Decision and its three pointers landed, under the cap, amending exactly 180, with no prior clause rewritten
    command: |-
      bin/venv-python - <<'EOF'
      import re, sys, yaml
      F = chr(96) * 3
      d = open("docs/DECISIONS.md").read()
      hs = re.findall(r"(?m)^## Decision (\d+): CI identities hold no IAM grant on PlatformDev or PlatformAdmin", d)
      if len(hs) != 1:
          sys.exit(f"expected exactly one entry, found {len(hs)}")
      n = int(hs[0])
      blk = lambda k: re.split(r"(?m)^## Decision ", d.split(f"## Decision {k}:", 1)[1])[0]
      env = yaml.safe_load(re.search("(?s)" + F + "yaml\n(.*?)" + F, blk(n)).group(1))
      ups = lambda k: [q for q in re.findall(r"(?m)^> \*\*Update \(2026-[^\n]*", blk(k)) if f"Decision {n}" in q and "rec-4049" in q]
      bad = [m for m, c in [
          ("envelope does not amend exactly [180]", env.get("amends") != [180]),
          ("entry over 6144 B", len((f"## Decision {n}:" + blk(n)).encode()) > 6144),
          ("Decision 180 reversal text edited", "only if (a) PlatformDev leaves terraform management" not in blk(180)),
          ("Decision 180 clause 3 edited", "PlatformAdmin is PERMANENTLY excluded from every CI-writable Resource pattern in this policy" not in blk(180)),
          ("Decision 223 clause 3 edited", "whether that fires (a) and licenses" not in blk(223)),
      ] + [(f"Decision {k} lacks its forward-pointer Update", not ups(k)) for k in (180, 202, 223)] if c]
      sys.exit("; ".join(bad)) if bad else print(f"DECISION RECORD OK (Decision {n})")
      EOF
    expected: >-
      prints the marker with the number: exactly one entry with the approved title, envelope amends exactly
      [180], span under 6,144 bytes, a dated Update naming it and rec-4049 on each of Decisions 180, 202 and
      223; red before (no entry), green after. The three verbatim-clause legs are green throughout (Decision
      177's append-only rule)
    fix_if: the entry or a pointer is missing or not the approved text, or a clause was rewritten in place -- restore the text and append instead
    hermetic: true
    expected_literals: ["DECISION RECORD OK"]
    graduation: waive
    graduation_waiver_reason: >-
      A one-time, PR-relative record check; the standing guards for the entry are
      validate_decision_entry_conformance, validate_decisions_size and validate_supersession_annotations in
      step 6.
