      bin/venv-python -c "from scripts.rec_trailer_acceptance import census; e=census(['rec-4049'], profile='agent_platform_admin'); assert len(e)==1 and e[0]['bucket']=='probeable' and e[0]['route']=='junit', e; print('REC-4049 ACCEPTANCE JUNIT-ROUTED')"
