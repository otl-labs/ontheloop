      The file is at its 11416-byte config/prose_budgets.yaml budget at refresh; the approved text
      measures about 1.15 KB smaller (10,264 B in a dry run).
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Ratchet terraform/CLAUDE.md's S2 budget down to its measured size after the edit (a decrease,
