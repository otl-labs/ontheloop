schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "platform-iam-personal-release"
intent: >-
  Second half of rec-3838: release PlatformDev, PlatformAdmin and their five inline policies from
  the CI-applied terraform/personal state through one human-gated forget that touches no live
  object, so the CD pipeline never again plans these seven IAM addresses, whose trust and inline policies its identity cannot write. The plan also locks
  the one-state-per-applier rule for PlatformDev and PlatformAdmin in a standing guard, records it as a numbered Decision
  (one Terraform state per applier; amends Decisions 180 and 183, with forward pointers on 180, 183, 202 and 113), and makes rec-4043 (a separate admin principal) a gate on
  executor re-enable in the roadmap. Refreshed 2026-10-15 against main: Decision 213's URL-only invoke conditions stay
  guarded and are re-proven live after the forget, the Decision 202 detector is verified live before the forget ends hourly
  drift coverage, and every recommendation read goes through the reader (Decision 215).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-platform-iam-personal-release.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-3838, plan 2 of 2 (predecessor:
  PLAN-platform-iam-bootstrap-adopt). No tier_item criterion is closed and no executor work is
  delivered; the one roadmap edit is human-directed bookkeeping that adds an open,
  executor-gating exit criterion naming rec-4043 (see the docs/ROADMAP-PLATFORM.yaml scope row).
closes_criteria: []
scope:
  - file: terraform/personal/platform_roles.tf
    action: Modify
    purpose: >-
      Replace both aws_iam_role blocks with seven `removed { from = <address> lifecycle { destroy
      = false } }` blocks (the two roles and the five inline policies) under the banner in
      execution_steps (it points at terraform/bootstrap). The file is kept, not deleted, so its config/structural_size_budgets.yaml
      key and the structural-registry-section-scoped-extraction shard that asserts that key stay
      valid.
  - file: terraform/personal/platform_dev_policies.tf
    action: Delete
    purpose: DailyOps now lives in terraform/bootstrap/platform_dev_policies.tf; its removed block is in platform_roles.tf
  - file: terraform/personal/platform_admin_policies.tf
    action: Delete
    purpose: AdminOps now lives in terraform/bootstrap/platform_admin_policies.tf; its removed block is in platform_roles.tf
  - file: terraform/personal/platform_admin_data_policies.tf
    action: Delete
    purpose: the three data policies now live in terraform/bootstrap/platform_admin_data_policies.tf; their removed blocks are in platform_roles.tf
  - file: tests/checks/iam_tf/test_platform_iam_admin_root_only.py
    action: Create
    purpose: >-
      Standing guard for the one-state-per-applier rule: terraform/personal declares no
      aws_iam_role named PlatformDev or PlatformAdmin, and no aws_iam_role_policy,
      aws_iam_role_policy_attachment, aws_iam_policy_attachment (its `roles = [...]` list),
      aws_iam_role_policies_exclusive or aws_iam_role_policy_attachments_exclusive targeting either --
      by resource reference or by literal role name, the literal check keyed ONLY on those resources'
      `role` / `roles` arguments, so legitimate mentions elsewhere (the literal role ARNs in oidc.tf's IAMPlatformRolesRead,
      comments, and log or event patterns such as Decision 202's metric filters) cannot false-positive; each of the seven relocated addresses has exactly one removed block with lifecycle
      destroy = false in terraform/personal. (That bootstrap declares and imports them is the
      predecessor's graduated TestBootstrapOwnsPlatformIam; this guard does not duplicate it.) Red
      cases for a re-added role, an inline policy attached by literal role name, a managed-policy
      attachment, an aws_iam_policy_attachment naming a role in `roles`, an *_exclusive resource, and
      a removed block missing destroy = false, and a role argument reaching either identity through a
      data-source indirection (role = data.aws_iam_role.<x>.name or .id) or a local or variable whose
      literal value or default names either role (role = local.<x> or var.<x>), and an aws_iam_role whose
      name or name_prefix reaches either name through a local or variable; a negative-of-the-negative
      case proving a metric-filter or EventBridge pattern naming PlatformDev does not trip the guard.
  - file: config/agent/verification_registry/entries/platform-iam-admin-root-only.yaml
    action: Create
    purpose: graduate the admin-root-only guard under this plan's slug
  - file: tests/checks/iam_tf/test_platform_iam_dual_copy_parity.py
    action: Delete
    purpose: >-
      The predecessor's transitional dual-copy parity module -- terraform/personal no longer declares
      the addresses, so there is nothing left to compare. The graduated
      tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py is untouched and must stay green
      (its parity sources live in files this plan keeps).
  - file: tests/checks/iam_tf/test_url_only_invoke_guard.py
    action: Modify
    purpose: >-
      One-statement fix (ruff format wraps it to three lines) found by re-simulating the release on main
      2606b684 (the predecessor's build, #1500, merged): test_real_identity_grants_are_url_only's guarded-Sid assertion calls _named_forms with an
      empty locals map, so it recognises only terraform/personal's aws_lambda_function references. The
      bootstrap DailyOps copy names the functions through name-only locals (local.ducklake_*_function),
      which grant_problems already resolves through fn_locals. Pass fn_locals to the guarded-set
      comprehension as well, so the "DuckLakeInvokeViaUrlOnly carries Bool lambda:InvokedViaFunctionUrl"
      superset assertion holds on the bootstrap copy once the personal copy is deleted (Decision 213 cl.1).
      Claim-preserving: the same three Sids must still carry the condition; no other statement changes. Without
      it the release turns the graduated url-only-invoke-guard row red.
  - file: tests/test_deploy_paths_admin_procedure.py
    action: Modify
    purpose: >-
      Add test_split_apply_step_excludes_platform_iam: the SPLIT-APPLY step's text contains
      "terraform/bootstrap" and "no split", no longer contains "any inline-policy write on
      PlatformDev", and the PRE-APPLY, self-access isolation and POST-APPLY steps survive in that
      order. Never edit the module's existing tests (the predecessor's isolation test and
      PLAN-admin-root-premerge-plan-gate's TestPreMergeLivePlan).
  - file: config/agent/verification_registry/entries/deploy-paths-split-apply-excludes-platform-iam.yaml
    action: Create
    purpose: graduate the SPLIT-APPLY narrowing test (function-level node id) under this plan's slug
