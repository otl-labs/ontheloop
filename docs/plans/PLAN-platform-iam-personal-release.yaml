infrastructure_dependencies:
  - "PRECONDITION: PLAN-platform-iam-bootstrap-adopt is fully deployed -- terraform/bootstrap state holds all seven addresses and a bootstrap plan exits 0 (the predecessor's step 16 proved it; this plan's step 12 re-checks it before merge). Merging this plan before that would leave the seven objects unmanaged (harmless to live IAM, but it breaks the chain of custody)."
  - "PRECONDITION: the Decision 202 detector is live (step 23): after the forget the two roles leave terraform/personal's hourly drift plan, and terraform/bootstrap has no scheduled plan until rec-3358 (gated on rec-4043)."
  - "The merge routes seven `forget` actions to the tf-gated-apply Environment: scripts/terraform_apply_guard.py treats a non-inert action on an IAM-sensitive type as out-of-budget (a forget's after is null, so the trust-diff check does not fire and routing rests on that rule; environment-taxonomy.yaml is the classification SoT; rec-4053 owns classifying forget explicitly). On push the gated job applies the same digest-verified PR-head plan.bin step 14 inspects (Decision 77 no-TOCTOU). A forget issues no AWS API call, so github_ci_apply can execute it; one human approval."
  - "APPROVAL WINDOW: approve the gated run within 2.0 hours of merge. Until then the hourly terraform-drift plan measures the forgets as resource_changes with no resource_drift, writes a pending_codification marker before it consults pending_gated, and escalates that marker to red at 2.0h (Decision 190 point 3; ordering defect owned by rec-4050 -- if rec-4050 has landed before this merge, the window no longer applies). A missed window is recoverable: the gated-apply job has no convergence precondition, and its green write replaces the record, so approving the still-pending run converges it. Side effect: each non-escalating hourly drift tick in that window files a source=tf_drift 'pending-codification delta' rec (terraform-drift.yml) that nothing auto-closes -- step 20 closes them."
  - "Freeze: no other terraform/personal PR merges between this PR's speculative plan and the gated forget -- a state-serial bump in between makes the saved plan stale and fails closed (the 2026-09-20 failure shape); recovery is the workflow_dispatch acknowledge-and-retry path."
  - "ADMIN container (Decision 120) for steps 11-18 and 22-24: bin/setup-cloud-env.sh with INSTALL_TERRAFORM=1 and a non-empty provider-mirror sync materialises terraform/personal/terraform.personal.tfvars only; step 11 materialises terraform/bootstrap/terraform.bootstrap.tfvars. DEV containers cannot init any root (Decision 119)."
acceptance_criteria:
  - terraform/personal declares no PlatformDev/PlatformAdmin role, inline policy, attachment or exclusive-set resource; seven removed blocks with destroy = false cover the seven relocated addresses; the three personal policy files are deleted
  - Before merge, the predecessor's adoption is complete, rec-4044 is closed, the Decision 202 detector is live (every platform-security-* alarm OK, IAM events delivered), and the PR's saved speculative plan contains exactly seven forget actions and nothing else
  - After the gated forget the personal convergence record is green at the merge commit, a terraform/personal plan exits 0, terraform/personal state holds none of the seven addresses, and a bootstrap plan still exits 0
  - A before/after snapshot of both roles' complete IAM surface (every live inline and attached managed policy document) is identical across the release -- no live permission changed
  - The re-anchored guards (url-only invoke, CloudTrail grant scope, DEP-13 fence, observability read coverage, adoption) stay green with the personal copies deleted, and after the forget PlatformDev's direct invoke of the writer, reader and telemetry writer is denied while the URL path is allowed (Decision 213)
  - deploy-paths.yaml, terraform-cc-web-operations.yaml (including the ExternalId recovery sources), environment-taxonomy.yaml, terraform/CLAUDE.md, the DuckLake runbook and the session-start hook point at terraform/bootstrap with the approved text; no swept surface still names a deleted personal policy file except the two declared exclusions
  - The approved numbered Decision (one Terraform state per applier) amends Decisions 180 and 183 and is under the 6,144-byte cap; Decisions 180, 183, 202 and 113 each carry its approved forward-pointer Update; original clause texts are unchanged; after merge the decision is in the warehouse (ops_decisions)
  - T4.2 carries an open exit criterion naming rec-4043
  - rec-3838 is closed via the squash-merge Resolves trailer
verification_plan:
  - step: 1
    phase: pre-deploy
    action: the one-state-per-applier guard -- terraform/personal holds no PlatformDev/PlatformAdmin IAM, and every relocated address is released through a removed block
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_platform_iam_admin_root_only.py -q
    expected: >-
      all tests pass, including the red cases (a re-added role, an inline policy attached by
      literal role name, a managed-policy attachment, an aws_iam_policy_attachment naming a role in
      `roles`, an *_exclusive resource, a data-source, local or variable role indirection, a removed block without
      destroy = false) and the pattern negative-of-the-negative case; red before this plan is
      implemented (the module does not exist), green after
    fix_if: personal still declares an address or attachment, or a removed block is missing or destroy-capable
    hermetic: false
    graduation: graduate
    graduation_check_id: platform-iam-admin-root-only
  - step: 2
    phase: pre-deploy
    action: stale-reference sweep -- no swept surface names a deleted personal policy file, and the prose and hook pointers moved to terraform/bootstrap
