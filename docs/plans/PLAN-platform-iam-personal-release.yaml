          sys.exit("RECORD -- not green at the merge commit; run step 15 first")
      a = int(dt.datetime.fromisoformat(r["timestamp"].replace("Z", "+00:00")).timestamp())
      s = (a // P) * P - P
      e = s + 3 * P
      f = lambda x: dt.datetime.fromtimestamp(x, dt.timezone.utc)
      if time.time() < e + 300:
          sys.exit(f"WAIT -- re-run after {f(e + 300):%H:%M}Z, when the three 900 s periods bracketing the forget have closed")
      cw = boto3.Session(profile_name="agent_platform_admin").client("cloudwatch")
      al = [x for pg in cw.get_paginator("describe_alarms").paginate(AlarmNamePrefix="platform-security-") for x in pg["MetricAlarms"]]
      if n < 5 or len(al) != n:
          sys.exit(f"ALARM COUNT -- live {len(al)}, declared {n}")
      bad = sorted(x["AlarmName"] for x in al if x["StateValue"] != "OK" or not x["ActionsEnabled"])
      if bad:
          sys.exit(f"NOT OK OR ACTIONS DISABLED -- {bad}")
      h = [i for pg in cw.get_paginator("describe_alarm_history").paginate(HistoryItemType="StateUpdate", StartDate=m, EndDate=f(time.time())) for i in pg["AlarmHistoryItems"] if i["AlarmName"].startswith("platform-security-") and "to ALARM" in i["HistorySummary"]]
      if h:
          sys.exit(f"{len(h)} platform-security transition(s) to ALARM since merge -- {sorted({i['AlarmName'] for i in h})}")
      dp = cw.get_metric_statistics(Namespace="PlatformSecurity", MetricName="IamEventHeartbeat", StartTime=f(s), EndTime=f(e), Period=P, Statistics=["Sum"])["Datapoints"]
      fed = sum(1 for d in dp if d["Sum"] >= 1)
      if fed != 3:
          sys.exit(f"DELIVERY GAP -- {3 - fed} of the 3 periods bracketing the forget had no delivered IAM event")
      print(f"DETECTOR QUIET -- {n} alarms OK and actions-enabled, none entered ALARM since merge; IAM events delivered in all 3 periods bracketing the forget")
      EOF
    expected: >-
      DETECTOR QUIET -- run after step 15. The bracket is the three 900 s periods around the convergence
      record's timestamp (the gated apply's write): the one before, the one containing it and the one
      after must each show a delivered IamEventHeartbeat event, so the detector was not blind at the
      moment it became the only config-vs-live control on the two roles; every alarm is OK with actions
      enabled and none entered ALARM since merge (a forget applied from a saved plan makes no IAM call, so
      the change and denied-call filters must stay quiet). Read-only dry run 2026-10-15 against the
      2026-10-14 apply: DETECTOR QUIET. Only counts and alarm names are printed
    fix_if: WAIT -- re-run at the printed time (never shorten the bracket). RECORD -- run step 15 first. A transition to ALARM, or NOT OK on a change, denied-call or tamper alarm -- something wrote (or tried to write) IAM on the two roles during the release; stop and RCA. DELIVERY GAP -- allow ONE re-run at least 15 minutes later for late datapoints; if it persists, triage per the heartbeat alarm's alarm_description and put the gap to Benjamin
  - step: 25
    phase: pre-deploy
    action: terraform/CLAUDE.md shrank under the approved text and its prose budget is ratcheted down to the measured size
    command: |-
      bin/venv-python -c "import sys,yaml; from scripts.preflight.prose_context import measure_prose_context; m=[f['prose_bytes'] for f in measure_prose_context()['S2']['files'] if f['path']=='terraform/CLAUDE.md'][0]; b=yaml.safe_load(open('config/prose_budgets.yaml'))['S2']['terraform/CLAUDE.md']; sys.exit(f'measured {m}, budget {b}') if m!=b or b>=11416 else print('TF CLAUDE BUDGET RATCHETED')"
    expected: TF CLAUDE BUDGET RATCHETED -- red before (budget 11416), green after (budget equals the measured size, about 10.3 KB)
    fix_if: the budget was not lowered, or does not equal the measured size -- set it to the measured value (a decrease); never raise it
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      validate_prose_limits already enforces the budget on every run; this step only proves the one-time
      ratchet landed at the measured value.
  - step: 26
    phase: post-deploy
    action: the new Decision reached the warehouse through the post-merge DECISIONS.md backfill (rec-autoclose.yml)
    command: |-
      bin/venv-python -c "import re,sys; from src.common.ducklake_reader_client import make_reader; n=re.findall(r'(?m)^## Decision (\d+): One Terraform state per applier', open('docs/DECISIONS.md').read()); n=n[0] if len(n)==1 else sys.exit('entry not found'); rows=make_reader(profile='agent_platform_admin').named('decision_by_id', id='dec-'+n); sys.exit('dec-'+n+' not in ops_decisions yet') if not rows else print('WAREHOUSE HAS dec-'+n+' status '+str(rows[0].get('status')))"
    expected: WAREHOUSE HAS dec-219 status Decided (or the number the entry landed under), read through the reader's decision_by_id verb after rec-autoclose.yml's backfill step ran on the merge commit
    fix_if: not found -- check the merge commit's rec-autoclose run (Backfill decisions to warehouse); re-run it, never write ops_decisions by hand
