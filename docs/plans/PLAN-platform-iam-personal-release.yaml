      terraform/personal until rec-4048 retires them. Approved amendment_log entry.
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: >-
      axis_a.bootstrap money_real scope wording names PlatformDev and PlatformAdmin with their inline
