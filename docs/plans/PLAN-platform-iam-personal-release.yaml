    expected: >-
      exit 0 and the marker is printed -- the old paths are gone and the hook, runbook and
      terraform/CLAUDE.md positively name terraform/bootstrap, and every terraform/CLAUDE.md line that
      mentions the split-apply (the Decision 183 reversal (b) co-moving recovery row) also names
