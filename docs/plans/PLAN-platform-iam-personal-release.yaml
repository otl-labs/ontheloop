      Replace the "Out-of-band IAM grants" section's opening and its PlatformAdmin and PlatformDev
      bullets with the approved text in execution_steps (it names terraform/bootstrap/platform_roles.tf
      and trims the historical codification narrative that git history and Decision 180 carry) and
