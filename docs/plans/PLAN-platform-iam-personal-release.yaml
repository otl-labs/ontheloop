    action: Modify
    purpose: >-
      The approved numbered entry in execution_steps (Decision 219 at refresh, or the next free number:
      one Terraform state per applier; amends Decision 180 clause 6 and Decision 183 point 4), inserted
      newest-first above the current top entry, plus the four approved one-line forward-pointer
