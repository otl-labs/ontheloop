constraints:
  - No rescue agents or workaround loops (Decision 55)
  - Never `terraform state rm` or a cross-backend `state mv` -- release is `removed { lifecycle { destroy = false } }` only, applied by CI through the gated Environment (terraform/personal/main.tf header, Decision 178 clause 4 / Decision 183)
  - "CI-first (Benjamin, 2026-10-15): this plan makes no admin write. The forget runs in CI (tf-gated-apply, Benjamin's approval in GitHub Actions); every ADMIN step (11-14, 16-18, 22-24) is a read or local scratch; step 20's update_rec calls are routine portal writes"
  - Merge only after pre-merge gates 22, 11-14 and 23 pass at the head being merged (expectedHeadSha) -- the predecessor's adoption complete, rec-4044 closed, the detector live, the saved plan exactly seven forgets -- and on Benjamin's explicit word in the build thread (IAM is always-ask)
  - The release must change no live permission; the removed blocks must never allow a destroy
  - "Approved text lands verbatim (Benjamin, step 6b): the new Decision entry and its four forward-pointer Updates, the SPLIT-APPLY step, the taxonomy wording, the cc-web operations edits, the terraform/CLAUDE.md section and recovery row, the runbook and hook lines, the T4.2 criterion and the three amendment_log entries in execution_steps. Allowed variance: the DATE placeholders (the build's merge date), the Decision number if 219 is taken (every 219 reference moves with it), the T4.2 criterion id if c15 is taken, and line wrapping in YAML folded scalars. Any other wording change goes back to Benjamin before merge"
  - "Approve the tf-gated-apply run within 2.0h of merge (Decision 190 point 3) unless rec-4050 has landed; the drift ordering defect is rec-4050's, not worked around here"
  - "Freeze: no other terraform/personal PR merges between this PR's speculative plan and the gated forget, and no terraform/bootstrap apply runs until the forget converges (restated from the predecessor)"
  - Decision 177 -- the new entry is appended newest-first and the four pointers are dated one-line Updates; clause 6 and point 4 texts stay verbatim; the entry number is max-plus-one at write time with the re-check (Decision 217 clause 5)
  - terraform/CLAUDE.md must end at or under its config/prose_budgets.yaml budget (11416 bytes at refresh); the budget only ever decreases (Decision 128/166)
  - Decision 215 -- every recommendation read uses the reader's verbs (recs_by_ids, recs_by_title_prefix); never a local recs cache or sync()
  - "Public-repo boundary (Decision 101): snapshots, plan files and plan JSON stay in scratch and step 21 removes them, including after any STOP; no ARN, account id or ExternalId in any committed file, chat or PR; evidence comments are counts-only plus the public GitHub Actions run URL"
  - Never widen the CI apply role to write these identities (Decision 180 clause 3 is permanent for PlatformAdmin; clause 2's PlatformDev metadata grant is rec-4049's to adjudicate, never to widen)
  - "The only roadmap edit is the T4.2 rec-4043 criterion (human-directed); T2.48 / T2.44 files_in_scope pointers are left as history"
