      entries/deprecated/cloudtrail-read-only-no-write-verbs.yaml (a deprecated registry row kept as
      history, whose guard_target names the old AdminOps path). Remaining comment-only pointers to
      terraform/personal/platform_roles.tf (which now holds the removed blocks) are owned by rec-4052
    fix_if: a hit remains -- repoint it to terraform/bootstrap; never widen the exclusions
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      A one-time closure sweep for the Delete rows (closure obligation 2). The durable half -- no
      PlatformDev/PlatformAdmin IAM declared in terraform/personal -- is graduated by step 1; a
      path-string sweep would only re-flag the two declared exclusions.
