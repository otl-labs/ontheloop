schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "platform-role-iam-change-alarms"
intent: >-
  Resolve rec-4044: land a state-free detective control that emails the operator whenever anyone
  changes -- or is denied changing -- IAM on PlatformDev or PlatformAdmin, proven by a live fire
  before the rec closes, so rec-3838's Plan A (PLAN-platform-iam-bootstrap-adopt) can move the two
  most privileged identities out of hourly terraform-drift coverage without leaving them unwatched.
  Everything lives in Terraform and in the single project region variable (var.aws_region), with no
  second-region provider and no console step, because the repository is meant to ship as a tool
  whose users set exactly one AWS region.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-platform-role-iam-change-alarms.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-4044, the human-adjudicated HARD PREREQUISITE of
  PLAN-platform-iam-bootstrap-adopt (its step 10 gate). No tier_item criterion claimed. Adjacent:
  T2.48 (allow-list inversion; unaffected, bootstrap is outside CI) and T2.47 (terraform-drift.yml;
  no open criteria).
closes_criteria: []
scope:
  - file: terraform/bootstrap/platform_security_admin_policy.tf
    action: Create
    purpose: >-
      PlatformAdmin's detector-management grants as a NEW customer-managed policy
      (aws_iam_policy.platform_security_admin, name platform-security-detector-admin) attached to
      PlatformAdmin by aws_iam_role_policy_attachment.platform_security_admin (role = "PlatformAdmin"
      literal: this root does not declare the role until Plan A). The document is hoisted into
      local.platform_security_admin_policy_json with a <= 6144 B whitespace-stripped size
      precondition (validate_iam_policy_size; Decision 156 managed-policy remedy -- PlatformAdmin's
      inline aggregate has only ~2.2 KB of its 10,240 B per-role headroom left). Five Sids, every ARN
      built from var.aws_region / var.account_id: PlatformSecurityTrailManage = exactly
      cloudtrail:CreateTrail, UpdateTrail, PutEventSelectors, StartLogging, AddTags, RemoveTags on the
      ONE trail ARN (trail/platform-security-trail); PlatformSecurityTrailRead = enumerated cloudtrail
      read verbs (GetTrail, GetTrailStatus, DescribeTrails, GetEventSelectors, GetInsightSelectors,
      ListTags) on "*"; PlatformSecurityTrailBucketManage = the enumerated S3 set, mirroring
      terraform/personal/platform_admin_data_policies.tf's CatalogDrBucketManage verb for verb
      (CreateBucket, ListBucket, GetBucketLocation, GetBucketAcl, Get/PutBucketVersioning,
      Get/PutEncryptionConfiguration, Get/PutBucketPublicAccessBlock, Get/PutBucketPolicy,
      Get/PutBucketTagging, Get/PutLifecycleConfiguration, GetBucketOwnershipControls,
      GetAccelerateConfiguration, GetBucketRequestPayment, GetBucketLogging,
      GetReplicationConfiguration, GetBucketObjectLockConfiguration, GetBucketCORS,
      GetBucketWebsite) plus PutBucketOwnershipControls, on the trail bucket only (no s3:DeleteBucket,
      no s3:DeleteBucketPolicy); PlatformSecurityLogGroupManage = logs CreateLogGroup,
      PutRetentionPolicy, TagResource, TagLogGroup, ListTagsForResource, ListTagsLogGroup,
      PutMetricFilter, DeleteMetricFilter, and the READ verbs DescribeLogStreams, GetLogEvents,
      FilterLogEvents and StartQuery, on log-group:platform-security-* only (no logs:DeleteLogGroup)
      -- so the Logs Insights query named in every alarm email is runnable by PlatformAdmin;
      PlatformSecurityLogsRead = logs:DescribeMetricFilters, TestMetricFilter, GetQueryResults and
      StopQuery on "*" (none supports resource scoping). CloudWatch alarm verbs are NOT
      re-granted (AdminOps' CloudWatchAlarmManagement already covers alarm:*). No cloudtrail
      StopLogging, DeleteTrail, Delete*/Stop* wildcard or cloudtrail:* anywhere.
  - file: terraform/bootstrap/platform_security_trail.tf
    action: Create
    purpose: >-
      The event source, all keyed to var.aws_region / var.account_id (no region or account literal,
      no provider alias): aws_s3_bucket.platform_security_trail
      (platform-security-trail-<account_id>-<aws_region>, force_destroy false, prevent_destroy) with
      versioning Enabled, all four public-access-block flags, SSE-S3 default encryption,
      BucketOwnerEnforced ownership, a lifecycle rule expiring current objects after 400 days and
      noncurrent versions after 30, and a bucket policy allowing only cloudtrail.amazonaws.com
      (GetBucketAcl; PutObject under AWSLogs/<account_id>/ with bucket-owner-full-control), both
      conditioned on aws:SourceArn = the trail ARN, plus a DenyInsecureTransport statement;
      aws_cloudwatch_log_group.platform_security_trail (platform-security-cloudtrail, 30-day
      retention, prevent_destroy -- S3 is the 400-day authoritative copy);
      aws_iam_role.platform_security_trail_logs (platform-security-cloudtrail-logs, trusted by
      cloudtrail.amazonaws.com with an aws:SourceArn condition) and its inline policy
      (logs:CreateLogStream + logs:PutLogEvents on that log group's streams only), hoisted into a local
      with the <= 10240 B size precondition; aws_cloudtrail.platform_security (platform-security-trail,
      is_multi_region_trail true, include_global_service_events true, enable_log_file_validation true,
      enable_logging true, one event_selector read_write_type All with management events,
      cloud_watch_logs_group_arn "<log group arn>:*", depends_on the bucket policy, prevent_destroy).
  - file: terraform/bootstrap/platform_security_alarms.tf
    action: Create
    purpose: >-
      Five aws_cloudwatch_log_metric_filter + aws_cloudwatch_metric_alarm pairs on the trail's log
      group, metric namespace PlatformSecurity, every alarm's alarm_actions = the EXISTING
      agent-platform-alerts topic ARN built as arn:aws:sns:${var.aws_region}:${var.account_id}:agent-platform-alerts
      (Decision 39; the topic stays in terraform/personal). Patterns live in one
      local.platform_security_filter_patterns map keyed by alarm name, so the ADMIN TestMetricFilter
      step can read them through terraform console. Every pattern is a plain string literal with NO
      interpolation (no var.account_id, no var.aws_region): ARN clauses match by suffix wildcard
      (e.g. "*:policy/agent-platform-github-ci-apply-boundary", "*:agent-platform-alerts"), so the
      committed fixture evaluates identically against the live service, and each pattern stays
      within CloudWatch Logs' 1024-character limit:
      (1) platform-security-platform-role-iam-change -- iam.amazonaws.com, readOnly false, and either
      requestParameters.roleName matching PlatformDev or PlatformAdmin CASE-INSENSITIVELY (IAM role
      names are case-insensitive in API calls, so an exact match is evadable) -- written in the
      CloudWatch Logs regex subset: character classes ([Pp][Ll]...) with TOP-LEVEL alternation
      between the two anchored role forms, no parentheses and no inline flags inside %...%, or a policy-version /
      policy-delete verb whose policyArn is the agent-platform-github-ci-apply-boundary or the
      platform-security-detector-admin policy (content edits to policies attached to the roles carry
      no roleName); denied attempts included;
      (2) platform-security-denied-iam-write -- iam.amazonaws.com, readOnly false, errorCode
      AccessDenied*, any role;
      (3) platform-security-detector-tamper -- any mutating cloudtrail.amazonaws.com call; a
      mutating iam, logs or s3 call naming a platform-security-* role, log group or the trail bucket,
      EXCEPT logs CreateLogStream (the delivery role's own routine stream creation, which would
      otherwise self-fire);
      a monitoring.amazonaws.com PutMetricAlarm naming a platform-security-* alarm; or ANY
      DeleteAlarms or DisableAlarmActions call (their alarmNames is an array a filter pattern cannot
      quantify over, so these two verbs match regardless of name -- rare, and a deletion of any alarm
      is worth an email);
      (4) platform-security-alerts-topic-change -- a mutating sns.amazonaws.com call whose topicArn or
      subscriptionArn is the agent-platform-alerts topic;
      (5) platform-security-iam-event-heartbeat -- ANY iam.amazonaws.com event (reads included; the
      hourly terraform-drift refresh reads both roles), alarm LessThanThreshold 1 over three 3600 s
      periods with treat_missing_data = breaching and ok_actions to the same topic. Because IAM events
      reach this London-homed trail only through its multi-region/global-events path, this proves the
      exact input the other alarms depend on is alive, and fires on StopLogging, DeleteTrail, a
      multi-region or global-events flip, an event-selector change or a broken Logs delivery.
      Event alarms (1)-(4): Sum >= 1 over one 300 s period, treat_missing_data notBreaching. Every
      alarm_description names the log group and a CloudWatch Logs Insights query (fields eventTime,
      userIdentity.arn, eventName, requestParameters.roleName, errorCode, eventID) plus a console link
      built from var.aws_region, so the email says where to read who changed what.
  - file: tests/fixtures/platform_security_filter_events.yaml
    action: Create
    purpose: >-
      Sanitised sample CloudTrail events (account id rendered as the literal ACCOUNT -- never twelve
      digits, the never-commit hook) with, per event, the exact set of filter names it must match: a
      lowercase platformadmin UpdateRole, a PlatformDev TagRole denied with AccessDenied, a
      CreatePolicyVersion on the boundary policy, a StopLogging, a PutMetricFilter on the
      platform-security-cloudtrail log group, an Unsubscribe on an agent-platform-alerts subscription,
      an iam GetRole read (heartbeat only), and an UpdateRole on an unrelated agent-platform-* role
      (heartbeat only -- must NOT match filter 1), and a DisableAlarmActions whose alarmNames lists an
      unrelated alarm first (filter 3), and a CreateLogStream on platform-security-cloudtrail by the
      delivery role (heartbeat-free, must match NO filter). No twelve-digit number appears anywhere in the file. Read by
      the unit test (fixture shape, no twelve-digit id, coverage of all five filters) and by the ADMIN
      TestMetricFilter step (live evaluation, events used as committed).
  - file: tests/checks/iam_tf/test_platform_role_iam_change_alarms.py
    action: Create
    purpose: >-
      rec-4044's own acceptance path. TestPlatformRoleIamChangeDetector (graduated): the trail is
      multi-region, includes global service events, validates log files, logs All management
      events, delivers to the log group and carries prevent_destroy; the bucket has versioning,
