  - "Scout flags, decided with notice (2026-09-25): 144 WARN -- Decision 202 clause 3 names the re-narrow trigger and says it does not fire; 100 WARN -- clause 6 rejects AWS Config; 190 NOTE -- distinct source security_detector_stale; 181 NOTE -- retirement recorded as a Decision-authorised claim narrowing; 180 NOTE -- policy attachment only, clause 6 not re-decided, CI-caused emails accepted."
  - "gates: decision-scout=FLAGS_FOUND (re-run on the refined design, 2026-09-25); plan-critique=REVISE after 5 round(s) (13, 7, 4, 5, 3 findings -- all fixed, none disputed, none recurring); round 5 was the confirming round, so escalated to Benjamin 2026-09-25 with merge recommended (Decision card in the rec-4044 thread)"
  - "Critique round 1 dispositions (all fixed, none disputed): F1 evidence from the trail's log group, not region-local lookup-events; F2 log-group read verbs granted; F3 account-agnostic patterns; F4 separate workflow plus bootstrap-window gate; F5 graduated workflow test and Decision 202 residual; F6 clause 4 scoped, residuals owned by rec-4067; F7 reversal conditions drafted, Decision 171 related; F8 closure read-back; F9 pattern length and DeleteAlarms/DisableAlarmActions; F10 enumerated S3 verbs plus a pre-phase-2 simulate; F11 calls spaced by an OK reset; F12 obligations restated in scope; F13 heartbeat start-up window. Round 2 (all fixed): R100 --name-status rename check; a standalone pre-phase-2 simulate step; every Plan A count site enumerated and grepped; escaped filter-pattern quotes; explicit PROOF_AT and untag cleanup; CreateLogStream excluded from filter 3; the percent-brace template sequence asserted absent; CI-writable alerts topic named as a residual; acceptance derived from the live rec. Round 3 (all fixed): probe identity moved from the planner's reserved session to agent-platform-github-ci-branch (Decision 143 clause 1), superseding rec-4069; the stale-count grep no longer collides with the corrected text and covers three more sites; step 6 waiver covers both halves. Round 4 (all fixed): stale oidc.tf execution step removed; the CI branch policy has no size precondition; probe output and rec text carry no ARN or account id (ClientError rendered as code only); step 17 stderr suppressed; platform_security address prefix asserted in step 1. Round 5 (all fixed): the PR speculative plan is one in-place github_ci_branch update, and step 9 confirms that CD apply converged; the probe now catches topic-attribute tampering (KMS key, policy Deny, failed alarm actions); step 1 encodes the CloudWatch Logs regex subset, which forbids the parenthesised group the roleName regex first used."
  - "Design provenance (2026-09-25, rec-4044 thread): Benjamin rejected a us-east-1 EventBridge + console-trail draft; a blind Fable consult independently chose a Terraform-owned London-homed trail in bootstrap with a narrow PlatformAdmin grant (/mnt/project-files/rec-4044/fable-consult.md); Benjamin chose the London-only CloudWatch Logs path and approved the outline (/mnt/project-files/rec-4044/plan-outline.md)."
  - "Refinements over the outline, decided with notice: PlatformAdmin's grant is a bootstrap managed policy, not AdminOps inline (PlatformAdmin's inline aggregate had ~2.2 KB headroom in the 10,240 B role limit, measured baseline 7575 B on 2026-09-13 plus T2.48; Decision 156's remedy), which also removes the pre-merge split-apply and its 2-hour window; the liveness probe reads an IAM-event heartbeat alarm instead of cloudtrail:GetTrailStatus, because the CI boundary's DataPlaneAllow has no cloudtrail entry (terraform/personal/platform_dev_policies.tf:101 notes the same) and the heartbeat observes the exact global-event path the alarms need."
  - "ci-rca deferral (Related-Work): rec-4057 (validate_test_coverage on rec_trailer_acceptance.py) is open and unrelated -- different file, decision and failure category; this plan is the human-adjudicated security prerequisite of Plan A and proceeds with this logged deferral."
  - "Cost (inferred, not measured): CloudTrail's first management-event copy is free; CloudWatch Logs ingestion of read+write management events from hourly terraform plans is on the order of a few GB a month (about 1-3 USD); 30-day retention; S3 400-day expiry."
  - "Why bootstrap: the detector must be out of reach of the principals it watches -- CI grants stop at agent-platform-*/ducklake-* names, and PlatformDev holds no logs/cloudwatch/cloudtrail/s3 write on these resources (step 1 asserts the CI half)."
  - "Probe transition rule mirrors drift's one-red-one-signal; a persistently red security-detector-liveness run is also caught by the loop_liveness_stale success leg (source_registry.yaml), which dedups per episode -- the backstop if the probe's own filing fails."
  - "IAM events are delivered only to trails that cover us-east-1; a multi-region trail homed in var.aws_region receives them and forwards all regions' events to its one Logs group, which is why no second-region resource exists."
  - "The PlatformDev out-of-band AgentPlatformRuntime inline policy (terraform/CLAUDE.md) is outside every root; filter 1 matches any change naming the role, so edits to it alert too."
  - "Plan A (PLAN-platform-iam-bootstrap-adopt) step 10 gates on rec-4044 closed; its bootstrap baseline plan (its step 9) needs this plan's apply to have landed first."
  - "Filter-fix re-entry (2026-10-12): the first step 17 run proved filter 2 live (ALARM 00:46Z) but filter 1 never fired -- CloudTrail records requestParameters, responseElements and resources as null on a denied IAM call, naming the target role only in errorMessage, and the fixture's denied TagRole had been hand-written with a roleName, so step 13 passed against a shape CloudTrail never emits. Fix (Benjamin chose it over relaxing the acceptance, Decision 181): filter 1 gains an errorMessage clause (role.<case-insensitive name>\\s, verified live by TestMetricFilter against the real denied event), the fixture's denied events carry the real shape, every alarm email's Insights query adds errorMessage (so a denied alert shows its target), and step 1 pins all three. Re-entry path after the fix PR merges: steps 9 (gate admits in-place platform_security metric-filter and alarm updates), 13, 14 (expected plan: 1 filter + 5 alarm-description updates in place, 0 add, 0 destroy, human-directed), 15, 16, then 17-21 with a fresh PROOF_AT. Steps 10-12 are skipped: phase 1 is applied and unchanged, and step 12's no-trail check is pre-first-apply only."
