      topic, bare iam eventSource), every %...% regex span uses only CloudWatch Logs' documented regex subset (no "(", ")" or "(?",
      only alphanumerics, the symbols : _ # = @ / ; , - and the operators ^ $ ? [ ] { } | \ * + .),
      no pattern has more than two regex spans and at most five patterns carry one, the roleName
