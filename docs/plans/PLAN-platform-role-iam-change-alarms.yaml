  - file: scripts/ci/security_detector_probe.py
    action: Create
    purpose: >-
      Read-only second channel (not SNS), a pure-Python module under 500 SLOC (Decision 128) with a
      thin CLI. check() reads, via boto3 (region from AWS_DEFAULT_REGION, never a literal): the five
      platform-security-* alarms by name (cloudwatch:DescribeAlarms) and the alerts topic's
      subscriptions (sns:ListSubscriptionsByTopic, topic ARN built from the caller's account and
      region); it returns a failure list when any expected alarm is missing, has ActionsEnabled
      false, lacks the alerts topic in AlarmActions, when the heartbeat alarm's StateValue is not OK,
      or when no email subscription is confirmed (SubscriptionArn PendingConfirmation); and -- so
      that tampering with the CI-writable alerts topic cannot silence every alarm while the probe
      stays green -- when any platform-security-* alarm's history (cloudwatch:DescribeAlarmHistory,
      HistoryItemType Action) records a failed action in the last 25 hours, or the topic's
      attributes (sns:GetTopicAttributes) carry a KmsMasterKeyId or a Policy with any Deny statement.
      Its output,
      failure strings and filed rec text carry ONLY alarm names, failure classes and AWS error codes
      -- never an Endpoint, an ARN (AlarmArn, AlarmActions, SubscriptionArn, TopicArn) or an account
      id -- and every botocore ClientError is caught and rendered as its error code only (Actions
      logs are public, Decision 101).
      --file-on-transition files ONE High rec through scripts.ops_data_portal file_rec (source
      security_detector_stale) only when the previous completed scheduled run of
      security-detector-liveness.yml concluded success or no previous run exists, read from the
      GitHub REST API with GITHUB_TOKEN; if that lookup fails it files anyway (noise over silence).
      --bootstrap-window (set by the workflow while the operator variable is not yet true) reports
      failures as warnings, files nothing and exits 0 -- the scoped deploy-paths.yaml precedent
      (DEPLOY_ROLE_PROVISIONED), never a blanket skip. Otherwise exit 1 whenever check() fails,
      whether or not a rec was filed. --profile selects a local AWS profile (ADMIN runs);
      --subscription-only runs just the subscription leg (the pre-apply check, before the alarms
      exist). The expected alarm names are a module constant pinned to the HCL by the test.
