      the TagRole fails with AccessDenied (DailyOps grants no iam write); within about 15 minutes
      both platform-security-denied-iam-write and platform-security-platform-role-iam-change reach
      ALARM (the lowercase role name proves the case-insensitive match live) and Benjamin receives
      both emails
    fix_if: >-
      run in the same ADMIN container as the later steps and export the printed PROOF_AT=... line before step 19.
      If the TagRole unexpectedly SUCCEEDS, immediately run aws iam untag-role --role-name
      PlatformAdmin --tag-keys rec-4044-probe --profile agent_platform_admin (a stray tag would drift
      terraform/personal and flip convergence red) and STOP -- PlatformDev holding an iam write is a
      finding. An alarm that does not fire within 20 minutes -- read the log group for the eventID
      (step 19) to split a filter miss (step 13) from a trail or delivery miss (step 15), fix through
      a new PR, repeat
  - step: 18
    phase: post-deploy
    action: LIVE PROOF call 2 (Benjamin runs it) -- only once both alarms read OK again, an unchanged-value UpdateRole on PlatformAdmin
    command: |-
      test "$(aws cloudwatch describe-alarms --alarm-names platform-security-platform-role-iam-change platform-security-denied-iam-write --state-value OK --query 'length(MetricAlarms)' --output text --profile agent_platform_admin)" = "2" && aws iam update-role --role-name platformadmin --max-session-duration 3600 --profile agent_platform_admin && echo "CALL 2 MADE"
    expected: >-
      the state precheck passes (both alarms back to OK, so the next transition is attributable to
      this call alone), the UpdateRole succeeds writing the value terraform/personal already
      declares (3600, so no drift), and platform-security-platform-role-iam-change reaches ALARM a
      second time with a second email. The role name is lowercase (IAM resolves it to PlatformAdmin),
      so this call proves the case-insensitive roleName regex live; call 1 proves the errorMessage
      clause, because a denied call carries requestParameters null
    fix_if: the precheck fails -- an alarm is still in ALARM from call 1; run this step again after the next 300 s period, never before
  - step: 19
    phase: post-deploy
    action: ADMIN -- record the evidence from the trail's own log group (IAM events are global, so region-local lookup-events does not show them) without printing the email address
    command: |-
      bin/venv-python -c "import json,subprocess,sys,os,datetime as d; run=lambda *a: json.loads(subprocess.run(['aws',*a,'--profile','agent_platform_admin','--output','json'],check=True,capture_output=True,text=True).stdout); since=os.environ['PROOF_AT']; ms=str(int(d.datetime.fromisoformat(since.replace('Z','+00:00')).timestamp()*1000)); ev=[json.loads(e['message']) for e in run('logs','filter-log-events','--log-group-name','platform-security-cloudtrail','--start-time',ms,'--filter-pattern','{ (\$.eventSource = \"iam.amazonaws.com\") && (\$.eventName = \"TagRole\" || \$.eventName = \"UpdateRole\") }')['events']]; ids={n:[e['eventID'] for e in ev if e['eventName']==n] for n in ('TagRole','UpdateRole')}; hist=lambda n: sorted(a['Timestamp'] for a in run('cloudwatch','describe-alarm-history','--alarm-name',n,'--history-item-type','StateUpdate','--start-date',since)['AlarmHistoryItems'] if 'to ALARM' in a['HistorySummary']); fired={'platform-security-platform-role-iam-change':hist('platform-security-platform-role-iam-change'),'platform-security-denied-iam-write':hist('platform-security-denied-iam-write')}; ok=all(ids.values()) and len(fired['platform-security-platform-role-iam-change'])>=2 and len(fired['platform-security-denied-iam-write'])>=1; print(json.dumps({'event_ids':ids,'alarm_fired':fired})); sys.exit(0 if ok else 'EVIDENCE INCOMPLETE')"
    expected: >-
      a JSON line with at least one eventID per call, two to-ALARM timestamps for the role-change
      alarm and one for the denied-write alarm (eventIDs and alarm names carry no account id, so this
      line may be quoted in the rec's resolution as $EVIDENCE), plus Benjamin's confirmation that the
      emails arrived
    fix_if: no eventIDs in the log group means the trail or its Logs delivery missed the call (step 15); eventIDs without alarm transitions mean a filter miss (step 13)
  - step: 20
    phase: post-deploy
    action: close rec-4044 through update_rec with a holds acceptance verdict keyed to the merge sha, and verify it is closed
    command: |-
      test -n "$MERGE_SHA" && test -n "$EVIDENCE" && git fetch origin main && git checkout --detach "$MERGE_SHA" && bin/venv-python -m pytest tests/checks/iam_tf/test_platform_role_iam_change_alarms.py -q && git checkout --detach origin/main && bin/venv-python -c "import hashlib,os; from scripts.ops_data_portal import update_rec; from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows,missing=fetch_recs_by_ids(make_reader(),['rec-4044']); assert not missing, missing; acc=rows[0]['acceptance']; sha=os.environ['MERGE_SHA']; rec={'rec_id':'rec-4044','sha':sha,'acceptance_sha256':hashlib.sha256(acc.encode()).hexdigest(),'verdict':'holds','source':'manual','arm':'post-live-proof'}; update_rec('rec-4044',{'status':'closed','file':'terraform/bootstrap/platform_security_alarms.tf','execution_result':'success','resolution':'Detector live in terraform/bootstrap (Decision 202). Live proof: '+os.environ['EVIDENCE']},acceptance_verdict=rec,closing_sha=sha); print('rec-4044 close written')" && bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows,missing=fetch_recs_by_ids(make_reader(),['rec-4044']); assert not missing, missing; r=rows[0]; assert r['status']=='closed' and 'Live proof' in (r.get('resolution') or ''), r['status']; print('rec-4044 closed (read back)')"
    expected: >-
      the acceptance oracle passes at the merge sha, update_rec accepts the holds record (the
      acceptance text is unchanged, so its sha256 matches), and the read-back through the
      recs_by_ids named verb prints rec-4044 closed (read back) with the live-proof evidence in its
      resolution. The oracle runs at MERGE_SHA; the portal calls run from origin/main, because
      Decision 215 (#1452) retired the recs cache this step originally synced and read (sync now
      refuses ops_recommendations), and MERGE_SHA predates fetch_recs_by_ids
    fix_if: >-
      AcceptanceVerdictRefused -- the acceptance text or sha differ; recompute from the rec's
      current acceptance, never close without a record (git-ops.yaml trailer_acceptance_gate).
      MERGE_SHA is the squash-merge sha of PLAN-heartbeat-canary-plan-time-grant's implementation PR
      (it descends from #1316's dd7f1ee2 and carries the live detector code, the re-pinned heartbeat
      test and the plan-time grant), not #1283's or #1316's.
  - step: 21
    phase: post-deploy
    action: CLEANUP (ADMIN) -- remove scratch plans and renders; also run after any STOP
    command: rm -rf "${TMPDIR:-/tmp}/platform-security" && test ! -e "${TMPDIR:-/tmp}/platform-security" && echo "SCRATCH CLEARED"
    expected: SCRATCH CLEARED
    fix_if: a path survives -- remove it by hand before ending the ADMIN session
