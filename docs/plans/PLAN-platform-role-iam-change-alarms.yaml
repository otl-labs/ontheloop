execution_steps:
  - Create terraform/bootstrap/platform_security_admin_policy.tf, platform_security_trail.tf and platform_security_alarms.tf per scope, terraform fmt -check clean (provider-free)
  - Create tests/fixtures/platform_security_filter_events.yaml, then the two iam_tf test modules and their registry shards
  - Create scripts/ci/security_detector_probe.py and its test and shard; register security_detector_stale; create .github/workflows/security-detector-liveness.yml, its test, shard, ci_rca_taxonomy entry, R3 baseline entries and the oidc_ci_roles.tf SecurityDetectorLivenessRead grant
  - git mv the old shard into entries/deprecated/; add the verification-registry.yaml governance note; amend Plan A's plan file
  - Add Decision 202 to docs/DECISIONS.md; update the AdminOps comment and the bootstrap CLAUDE.md pointer
  - "DEV session: run pre-deploy steps 1-8, commit, open the PR (no Resolves trailer; ADMIN hand-off in the description, Decision 115), drive CI green, merge"
  - "ADMIN session: steps 9-16 (baseline, phase 1 grant, simulate, pre-apply checks, live filter test, phase 2 detector, trail health, probe green; Benjamin arms SECURITY_DETECTOR_PROVISIONED); Benjamin runs steps 17 and 18's two calls; steps 19-21 evidence, closure, cleanup"
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)
  - "Report: what was implemented, verification results, rec-4044 closure evidence, and hand off to PLAN-platform-iam-bootstrap-adopt"
work_areas: []
rollback: >-
  Before step 14, rollback is code-only: revert the PR (phase 1's policy is removed by an admin
  apply of the reverted root, a detach then delete). After step 14, the trail, bucket and log group
  carry prevent_destroy by design (Decision 202 clause 2: destroying the trail is break-glass
  only): disabling the alarms is an HCL change through a new PR and the same human-gated apply;
  removing the trail requires a human-directed break-glass change that first lifts prevent_destroy.
  The retired shard is never restored in place -- a restoration is a new check_id.
