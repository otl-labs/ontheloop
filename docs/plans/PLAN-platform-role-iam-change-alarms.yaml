infrastructure_dependencies:
  - "terraform/bootstrap is NEVER auto-applied (terraform/bootstrap/CLAUDE.md, T2.23): every live step below runs in an ADMIN container under agent_platform_admin, from merged main, only after a human has reviewed the presented plan and explicitly directed the apply (Decisions 120 and 126). terraform/bootstrap is hashicorp-only, so init needs no provider mirror."
  - "No pre-merge apply and no split-apply: PlatformAdmin's new grant is a bootstrap-declared managed policy. terraform/personal's speculative plan on the PR shows exactly one in-place update, aws_iam_role_policy.github_ci_branch (the probe's read Sid), which CD auto-applies at merge; the two comment edits render nothing, and aws_iam_role_policy.platform_admin_ops must show no change."
  - "Two-phase post-merge bootstrap apply: phase 1 targets aws_iam_policy.platform_security_admin + aws_iam_role_policy_attachment.platform_security_admin (the grant must be live before the resources that need it; Decision 183 clause 4 targeted-apply precedent); phase 2 applies the detector. Phase 1 also grants the cloudtrail reads and logs:TestMetricFilter the pre-apply checks need."
  - "The alerts topic and its email subscription stay in terraform/personal; the detector references the topic ARN by template only (no cross-root reference). The subscription must already be confirmed (step 11)."
  - "Freeze from merge until step 15: no other terraform/bootstrap apply, or the unapplied detector would ride along unreviewed."
  - "The probe identity is the existing agent-platform-github-ci-branch role (main-trusted, convergence-write denied); it gains one in-budget read Sid (cloudwatch:DescribeAlarms, sns:ListSubscriptionsByTopic on the alerts topic) that CD auto-applies at merge. The CI permissions boundary has no cloudtrail entry, which is why the probe reads alarm state, not trail status."
  - "Merge-to-apply window: from merge until step 16, the detector does not exist yet, so security-detector-liveness.yml runs with --bootstrap-window (warnings, green, no rec) because repo variable SECURITY_DETECTOR_PROVISIONED is unset; Benjamin sets it to true at step 16, after which a failure is red and files a rec. Never set it before step 16 passes locally."
acceptance_criteria:
  - terraform/bootstrap declares a multi-region, global-events, log-file-validated CloudTrail trail homed in var.aws_region, its protected S3 bucket, a CloudWatch Logs group and delivery role, and five platform-security-* metric filters with alarms targeting the existing alerts topic, with no region literal and no provider alias
  - PlatformAdmin's only CloudTrail write authority is Sid PlatformSecurityTrailManage in a bootstrap managed policy -- exactly six verbs on one trail ARN -- and StopLogging, DeleteTrail and cloudtrail:* appear nowhere under terraform/
  - cloudtrail-read-only-no-write-verbs is retired to entries/deprecated/ and cloudtrail-write-grant-scoped-to-platform-trail, platform-role-iam-change-detector-declared, security-detector-probe-fails-closed and security-detector-liveness-workflow-read-only are admitted by run_differential
  - Decision 202 records the grant, the platform-security-* family, the single-region rule and the blinding residual with its compensating controls
  - A separate hourly security-detector-liveness workflow runs a read-only probe that fails on a missing, disabled or mis-targeted alarm, a non-OK heartbeat or an unconfirmed subscription, and files one security_detector_stale rec per transition once SECURITY_DETECTOR_PROVISIONED is true
  - PLAN-platform-iam-bootstrap-adopt no longer repoints the retired shard and still validates
  - Every filter pattern, evaluated live by logs:TestMetricFilter, matches exactly the fixture's expected events, including the lowercase role name
  - After the two-phase admin apply, the trail is logging with fresh Logs delivery, all five alarms exist and are enabled, the heartbeat is OK and the probe exits 0 locally and in a dispatched security-detector-liveness run
  - A denied lowercase TagRole from PlatformDev raises the role-change and denied-write alarms, and, after both return to OK, an unchanged-value UpdateRole on PlatformAdmin raises the role-change alarm again -- two distinct transitions attributable to the two calls, evidenced by eventIDs read from the trail's log group, alarm transition times, and Benjamin's confirmation that the emails arrived
  - rec-4044 is closed through update_rec with a holds acceptance verdict keyed to the merge sha, with the live evidence in its resolution
