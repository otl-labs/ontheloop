        ("read-transcript", "s3:GetObject", "ci-rca-evidence/review-transcripts/1/review.json", "explicitDeny"),
        ("version-read-tfplan", "s3:GetObjectVersion", "tfplan/personal/1/probe.bin", "explicitDeny"),
        ("write-tfstate-github", "s3:PutObject", "tfstate/github/terraform.tfstate", "explicitDeny"),
        ("write-tfstate-github-lock", "s3:PutObject", "tfstate/github/terraform.tfstate.tflock", "explicitDeny"),
        ("delete-version-tfplan", "s3:DeleteObjectVersion", "tfplan/personal/1/probe.bin", "explicitDeny"),
        ("write-transcript", "s3:PutObject", "ci-rca-evidence/review-transcripts/1/review.json", "explicitDeny"),
