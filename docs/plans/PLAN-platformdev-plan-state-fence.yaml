schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: platformdev-plan-state-fence
intent: >-
  Fence PlatformDev, the role every agent session runs as, off every Terraform state object, every saved plan and the
  merge-time plan-review transcripts, so no agent session can read a value embedded in them or tamper with them. Slice
  S1b (rec-4635) of the trusted plan executor: "no agent-controlled identity reads Terraform state or saved plans".
  Four explicit Deny statements in the codified DailyOps inline policy; the four DEP-13 statements stay byte-identical.
implementation_declared: true
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-platformdev-plan-state-fence.yaml
phase: >-
  security_advisory (soft-warn exception category): slice S1b of the trusted plan executor split (rec-4635, absorbing
  rec-2768 and rec-4353). No tier_item criterion claimed; extends DEP-13 (T2.44, Decision 144 clauses 3 and 7).
closes_criteria: []
scope:
- file: terraform/bootstrap/platform_dev_policies.tf
  action: Modify
  purpose: >-
    Four new statements in platform_dev_runtime_policy_json, inserted directly after DenyStateRead, each Effect "Deny",
    no Condition, Resource built from local.data_lake_bucket_arn:
    (1) Sid DenyTerraformArtifactRead -- Action exactly ["s3:GetObject", "s3:GetObjectVersion",
    "s3:GetObjectVersionAcl", "s3:GetObjectVersionTagging", "s3:GetObjectVersionAttributes", "s3:GetObjectAttributes"],
    Resource exactly ["${local.data_lake_bucket_arn}/tfstate/*", "${local.data_lake_bucket_arn}/tfplan/*"];
    (2) Sid DenyTerraformArtifactWrite -- Action exactly ["s3:PutObject", "s3:DeleteObject", "s3:DeleteObjectVersion"],
    same two Resources;
    (3) Sid DenyReviewTranscriptRead -- the read Action set of (1), Resource exactly
    ["${local.data_lake_bucket_arn}/ci-rca-evidence/review-transcripts/*"];
    (4) Sid DenyReviewTranscriptWrite -- the write Action set of (2), the Resource of (3).
    One comment above (1) and one above (3), why only: saved plans embed prior state (catalog passwords, ExternalIds;
    rec-2768) and tfstate/* covers every root including tfstate/github and its .tflock (rec-4353); the reviewer that
    writes the transcripts reads plan JSON with values (.github/actions/subagent-plan-review), and only CI writes that
    prefix; convergence/ and the rest of ci-rca-evidence/ are deliberately NOT fenced (agents read
    convergence/personal/sandbox.json and file ci-rca-evidence/<sha>.json); the bootstrap root's own state is in
    another bucket on which PlatformDev holds no Allow. The comments contain no [, ], { or } characters (the
    brace-balanced statement splitters in scripts/checks/iam_tf do not skip comments). No Sid name starts with "DenyState" (the graduated
    platformdev-state-convergence-denies-intact check counts exactly four). No other statement, verb or resource
    changes. The minified document grows by about 1,070 B (4,853 of 10,240 B measured live 2026-10-26; Decision 156
    precondition unchanged).
- file: tests/checks/iam_tf/test_platform_dev_plan_and_state_fence.py
  action: Create
  purpose: >-
    rec-4635's acceptance test. A public validate_plan_state_fence(text) -> list[str] over the policy file text
    (preferred splitter: the brace-balanced scripts/checks/iam_tf/_read_coverage.py _parse_bootstrap_statements(text,
    "platform_dev_runtime"), which resolves the hoisted local and splits by object, plus a local Condition-key probe
    on each object's text; the Sid-to-Sid regex idiom of test_platform_dev_data_lake_read_fence.py is acceptable only
    with the structural parsing below; builder's choice). It asserts, for each of the four Sids: present exactly once, Effect Deny, no
    Condition, Action set exactly as scoped, Resource set exactly as scoped. It also asserts: no Deny statement in the
    file names a Resource of "${local.data_lake_bucket_arn}/*", ".../convergence/*" or ".../ci-rca-evidence/*" (the
    agent-read paths stay open); exactly four Sids start with "DenyState" (the DEP-13 set is untouched). Tests:
    the good fixture passes; test_real_tree_passes (exactly this name: the three bundled recs' acceptance is its
    ::node_id) runs the validator on the real file; and one red case each, every one driving the real validator --
    a Sid dropped, a Resource narrowed to tfstate/personal/*, s3:GetObject dropped from the read set,
    s3:DeleteObjectVersion dropped from the write set, Effect flipped to Allow, a Condition added, a new
    "DenyStateX" Sid name, and a Deny on ci-rca-evidence/*. The "no Condition" and "no Deny on convergence/ or
    ci-rca-evidence/" assertions parse the `Condition\s*=` key and the `Resource = [...]` body, never a raw block
    substring: under the sibling's Sid splitter the two planned comments fall inside the preceding statement's block,
    and the comment above (3) itself names those prefixes. Module docstring names rec-4635 and this plan. Under 500
    SLOC.
bundled_recommendations:
- rec-4635
- rec-2768
- rec-4353
followon_recs: []
infrastructure_dependencies:
- >-
  terraform/bootstrap is admin-only and never auto-applied (Decision 126; Decision 223 clause 2: a DailyOps change is a
  terraform/bootstrap admin apply with no -target). This PR merges code only; nothing is applied before merge.
- >-
  Pre-merge (VP steps 9-13, ADMIN container under agent_platform_admin): read-only, -lock=false, at the CI-green PR
  head, in a throwaway worktree (docs/contracts/deploy-paths.yaml admin_out_of_band.pre_merge_live_plan). Any new PR
  head re-runs steps 10-12.
- >-
  Ride-along rule (Benjamin, F2-A): the gate and the apply-time plan must show only this diff -- one update, to
  aws_iam_role_policy.platform_dev_runtime, adding exactly the four Sids and changing or removing none. If any other
  merged-but-unapplied bootstrap change shows (secrets-to-ssm-grants, secrets-to-ssm-retire and Plan B all change this
  root, and two of them this same policy), this plan's apply waits until that change is applied through its own plan.
  The one declared exception is S2's PR 1 (PLAN-trusted-plan-identity, one IAMRolesRead ARN in the apply role's reads
  policy): step 10 carries its combined expected outcome, and the combined apply needs Benjamin's word naming both.
- >-
  Post-merge (VP steps 15-17): the human-directed admin apply from main on Benjamin's word on the exact command, then
  the live probes and live simulate. Never in parallel with another bootstrap apply.
- "Expected email at apply: the platform-role IAM-change alarm (PutRolePolicy on PlatformDev, Decision 202)."
acceptance_criteria:
- >-
  DailyOps carries DenyTerraformArtifactRead, DenyTerraformArtifactWrite, DenyReviewTranscriptRead and
  DenyReviewTranscriptWrite exactly as scoped; the four DEP-13 statements and every other statement are unchanged.
- >-
  tests/checks/iam_tf/test_platform_dev_plan_and_state_fence.py passes on the tree and each red case is detected; it
  fails on origin/main's policy file; test_platform_dev_data_lake_read_fence.py and the
  platformdev-state-convergence-denies-intact registry command stay green unchanged.
- >-
  Before merge, the ADMIN gate on the PR head shows 0 add, 1 change, 0 destroy, the change being
  aws_iam_role_policy.platform_dev_runtime with exactly the four Sids added and none changed or removed -- or, only under
  step 10's declared S2 combined outcome and Benjamin's word naming both changes, 0 add, 2 change, 0 destroy, the
  second change being aws_iam_policy.github_ci_apply_reads with changed Sids IAMRolesRead only; IAM's
  simulator, given the candidate policy, denies PlatformDev read on a tfplan, tfstate/github, tfstate/personal and
  transcript object and write on tfstate/github state, its lock file and a transcript object, while still allowing
  ducklake/, convergence/personal/sandbox.json and ci-rca-evidence/<sha>.json. Counts and decisions only are on the
  PR for that head.
- >-
  After the human-directed apply, a live head-object as PlatformDev returns 403 on a real tfplan, tfstate/github and
  transcript object (200 on each before the apply) and 200 on the three positive controls -- or, where a prefix holds
  no object, steps 11 and 17's simulate row for it, recorded as unproven-live in the PR description; the live simulate (which
  includes the unmanaged AgentPlatformRuntime policy) matches the pre-merge decisions; evidence is a counts-only
  comment on the merged PR naming the applied sha.
- >-
  rec-2768 and rec-4353 carry the new test as their acceptance before merge; rec-4635, rec-2768 and rec-4353 close
  through the build merge's Resolves trailer.
verification_plan:
- step: 1
  phase: pre-deploy
  action: the new fence test passes and every red case is detected
  command: bin/venv-python -m pytest tests/checks/iam_tf/test_platform_dev_plan_and_state_fence.py -q
  expected: all tests pass, including the eight red cases and the real-tree case
  fix_if: a red case not detected means validate_plan_state_fence is too weak -- strengthen it, never drop the red case
  hermetic: false
  graduation: graduate
  graduation_check_id: platformdev-plan-state-fence-shape
- step: 2
  phase: pre-deploy
  action: red before -- the validator fails on origin/main's policy file because the four Sids are absent
  command: >-
    git fetch origin main --quiet && T="${TMPDIR:-/tmp}/platform-dev-policies-at-main.tf" && git show
    origin/main:terraform/bootstrap/platform_dev_policies.tf > "$T" && bin/venv-python -c "import sys; from
    tests.checks.iam_tf.test_platform_dev_plan_and_state_fence import validate_plan_state_fence as v;
    p=v(open(sys.argv[1]).read()); print(p); want=('DenyTerraformArtifactRead','DenyTerraformArtifactWrite',
    'DenyReviewTranscriptRead','DenyReviewTranscriptWrite'); sys.exit(0 if all(any(s in x for x in p) for s in want)
    else 1)" "$T" && rm -f "$T" && echo "RED BEFORE AT ORIGIN MAIN"
  expected: the problem list names all four missing Sids, then the marker (before merge only)
  fix_if: a Sid not named -- its presence pin is missing from the validator; add it
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Depends on origin/main predating this merge; after merge it cannot go red, and step 1's "Sid dropped" red case is
    the standing form of the same proof.
- step: 3
  phase: pre-deploy
  action: the existing DEP-13 guards stay green with no edit
  command: >-
    bin/venv-python -m pytest tests/checks/iam_tf/test_platform_dev_data_lake_read_fence.py
    tests/checks/iam_tf/test_validate_iam_policy_size.py -q && bash -c "$(bin/venv-python -c "import yaml;
    print(yaml.safe_load(open('config/agent/verification_registry/entries/platformdev-state-convergence-denies-intact.yaml'))['check_spec']['command'][2])")"
    && git diff --quiet origin/main -- tests/checks/iam_tf/test_platform_dev_data_lake_read_fence.py
    config/agent/verification_registry/entries/platformdev-state-convergence-denies-intact.yaml && echo "DEP-13 GUARDS
    UNCHANGED AND GREEN"
  expected: all pass, the registry command exits 0, neither guard file differs from origin/main, then the marker
  fix_if: >-
    the registry command fails on the DenyState count -- a new Sid name starts with DenyState: rename it; a guard file
    differs -- revert it, this plan never edits the DEP-13 guards
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Both guards are already graduated or in the fast tier; this step only proves this diff left them alone.
- step: 4
  phase: pre-deploy
  action: the whole iam_tf suite stays green
  command: bin/venv-python -m pytest tests/checks/iam_tf -q
  expected: all pass
  fix_if: a read-coverage or write-companion check flags a Deny -- read its rule; never weaken it, return to the planner if it needs a change
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Existing suites already run in the fast and full tiers; steps 1-3 carry this plan's assertions.
- step: 5
  phase: pre-deploy
  action: provider-free formatting of the bootstrap root (validate is CI's terraform-validate job; plan is the gate's)
  command: terraform fmt -check -recursive terraform/bootstrap && echo "BOOTSTRAP FMT OK"
  expected: exit 0 with the marker
  fix_if: run terraform fmt on the touched file only
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The required terraform-validate CI job enforces fmt; a registry row would duplicate it.
- step: 6
  phase: pre-deploy
  action: the plan document validates
  command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-platformdev-plan-state-fence.yaml && echo "PLAN VALID"
  expected: exit 0 with the marker
  fix_if: a schema error names the field -- fix only the bookkeeping fields implement may edit
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: validate --pre already runs plan_document over every plan (step 7).
- step: 7
  phase: pre-deploy
  action: fast tier
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0
  fix_if: validate_sloc_limits -- decompose, never raise; any other failure -- RCA (Decision 55)
  hermetic: false
  graduation: waive
  graduation_waiver_reason: docs/contracts/vp-red-before.yaml#recursion_refusal refuses a graduate step whose command invokes scripts.validate.
- step: 8
  phase: pre-deploy
  action: full tier before handoff (handoff_policy)
  command: bin/venv-python -m scripts.validate
  expected: exit 0
  fix_if: RCA per Decision 55; a timeout is blocked, rerun from the start
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Same recursion_refusal as step 7.
- step: 9
  phase: pre-deploy
  action: ENVIRONMENT CHECK -- the gate and the post-merge apply need the ADMIN chain
  command: >-
    bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
    'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
  expected: ADMIN_CHAIN_OK in this project's ADMIN environment
  fix_if: ADMIN_CHAIN_ABSENT -- the PR waits at CI-green and steps 10-13 go to an ADMIN session through the coordinator
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: pre-deploy
  action: >-
    PRE-MERGE GATE (ADMIN) -- read-only plan of terraform/bootstrap at the CI-green PR head: one in-place update of
    PlatformDev's DailyOps that adds exactly the four Sids and changes nothing else
  command: |-
    test -n "$PR_HEAD_SHA" && M="${TMPDIR:-/tmp}/pd-fence-gate" && (umask 077 && mkdir -p "$M") && aws secretsmanager get-secret-value --secret-id agent-platform-terraform-personal-tfvars --profile agent_platform_admin --query SecretString --output text | grep -E '^[[:space:]]*(account_id|owner_email|platform_dev_external_id|platform_admin_external_id|agent_service_account_user_name)[[:space:]]*=' > "$M/bootstrap.tfvars" && W="$M/wt" && git fetch origin "$PR_HEAD_SHA" && git worktree add --detach "$W" "$PR_HEAD_SHA" > /dev/null && rc=0 && { terraform -chdir="$W/terraform/bootstrap" init -input=false -backend-config="region=$(tr -d '[:space:]' < "$W/config/aws-region")" > /dev/null && terraform -chdir="$W/terraform/bootstrap" plan -input=false -lock=false -var-file="$M/bootstrap.tfvars" -out="$M/head.tfplan" > /dev/null && terraform -chdir="$W/terraform/bootstrap" show -json "$M/head.tfplan" > "$M/head.json"; } || rc=1; git worktree remove --force "$W"; rm -f "$M/head.tfplan" "$M/bootstrap.tfvars"; test $rc -eq 0 && M="$M" RIDE_ALONG="${RIDE_ALONG:-}" bin/venv-python - <<'EOF'
    import json, os, sys
    m = os.environ["M"]
    rc = json.load(open(f"{m}/head.json")).get("resource_changes", [])
    os.remove(f"{m}/head.json")
    moving = [r for r in rc if r["change"]["actions"] not in (["no-op"], ["read"])]
    addr = "aws_iam_role_policy.platform_dev_runtime"
    new = {"DenyTerraformArtifactRead", "DenyTerraformArtifactWrite", "DenyReviewTranscriptRead", "DenyReviewTranscriptWrite"}
    out = {"add": sum("create" in r["change"]["actions"] for r in moving), "change": sum(r["change"]["actions"] == ["update"] for r in moving), "destroy": sum("delete" in r["change"]["actions"] for r in moving), "moving_types": sorted({r["type"] for r in moving})}
    pol = [r for r in moving if r["address"] == addr and r["change"]["actions"] == ["update"]]
    sids = lambda r, k: {s["Sid"]: s for s in json.loads(r["change"][k]["policy"])["Statement"]}
    extra = [r for r in moving if r["address"] != addr]
    s2 = os.environ["RIDE_ALONG"] == "s2-trusted-plan-identity"
    if s2 and len(extra) == 1 and extra[0]["address"] == "aws_iam_policy.github_ci_apply_reads" and extra[0]["change"]["actions"] == ["update"]:
        eb, ea = sids(extra[0], "before"), sids(extra[0], "after")
        out["ride_along"] = {"address": extra[0]["address"], "changed_sids": sorted(k for k in set(ea) | set(eb) if ea.get(k) != eb.get(k))}
        extra = [] if out["ride_along"]["changed_sids"] == ["IAMRolesRead"] else extra
    if not extra and pol:
        b = {s["Sid"]: s for s in json.loads(pol[0]["change"]["before"]["policy"])["Statement"]}
        a = {s["Sid"]: s for s in json.loads(pol[0]["change"]["after"]["policy"])["Statement"]}
        out.update(added_sids=sorted(set(a) - set(b)), removed_sids=sorted(set(b) - set(a)), changed_sids=sorted(k for k in set(a) & set(b) if a[k] != b[k]), denies_unconditioned=all(a[k]["Effect"] == "Deny" and "Condition" not in a[k] for k in new & set(a)), minified_bytes=len(pol[0]["change"]["after"]["policy"].replace(" ", "").replace("\n", "")))
        open(f"{m}/candidate-policy.json", "w").write(pol[0]["change"]["after"]["policy"])
    print(json.dumps(out))
    want_counts = (0, 2, 0) if "ride_along" in out and not extra else (0, 1, 0)
    good = not extra and out.get("added_sids") == sorted(new) and out.get("removed_sids") == [] and out.get("changed_sids") == [] and out.get("denies_unconditioned") and (out["add"], out["change"], out["destroy"]) == want_counts and out.get("minified_bytes", 99999) <= 10240
    print("PRE-MERGE PLAN OK -- DailyOps adds exactly the four Denies" + (" (with the declared S2 ride-along)" if want_counts == (0, 2, 0) else "")) if good else sys.exit("PRE-MERGE PLAN STOP")
    EOF
  expected: >-
    one counts-only JSON line: add 0, change 1, destroy 0, moving_types ["aws_iam_role_policy"], added_sids the four
    new Sids, removed_sids [], changed_sids [], denies_unconditioned true, minified_bytes about 5,920 (at most 10,240);
    then PRE-MERGE PLAN OK. Declared second outcome (N3 planner, 2026-10-26): if S2's PR 1
    (PLAN-trusted-plan-identity) is merged but unapplied, re-run with RIDE_ALONG=s2-trusted-plan-identity; expected
    then add 0, change 2, destroy 0, moving_types ["aws_iam_policy", "aws_iam_role_policy"], ride_along naming
    aws_iam_policy.github_ci_apply_reads with changed_sids ["IAMRolesRead"] only, the same four added Sids. That
    combined outcome is F2-B: the apply proceeds only on Benjamin's word naming both changes; otherwise wait (F2-A).
    Nothing is applied; -lock=false keeps the read off the state lock; the plan file, its JSON
    and the tfvars are deleted in this step (the candidate policy JSON stays in the scratch folder for step 11). Post
    the JSON line and PR_HEAD_SHA in the PR description.
  fix_if: >-
    any other moving resource or a changed/removed Sid -- another merged bootstrap change is unapplied or live drifted
    (Benjamin's F2-A): STOP, name the ride-along set (counts and Sid names only) to Benjamin through the coordinator,
    and wait for it to be applied by its own plan; never apply to make the plan match. A tfvars key missing (Plan B may
    have removed the two ExternalId lines, or plan D moved the tfvars to SSM) -- read the current source from
    docs/contracts/terraform-cc-web-operations.yaml tfvars_and_remote_state_recovery and adjust the key list only. If
    the session's permission layer refuses the tfvars read, ask Benjamin to allow this exact command. Any new PR head
    re-runs steps 10-12. An init failure -- the backend needs the region flag (docs/contracts/terraform-cc-web-operations.yaml
    backend_region) or a provider fetch failed: STOP and return to the planner; never init without the flag.
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: pre-deploy
  action: >-
    PRE-MERGE GATE (ADMIN) -- IAM's simulator on PlatformDev, with the candidate DailyOps, denies the fenced reads and
    writes and still allows the agent-read controls
  command: |-
    M="${TMPDIR:-/tmp}/pd-fence-gate" && { test -n "$LIVE" || test -s "$M/candidate-policy.json"; } && M="$M" LIVE="${LIVE:-}" bin/venv-python - <<'EOF'
    import json, os, sys, boto3
    s = boto3.Session(profile_name="agent_platform_admin", region_name="eu-west-2")
    acct = s.client("sts", region_name="eu-west-1", endpoint_url="https://sts.eu-west-1.amazonaws.com").get_caller_identity()["Account"]
    iam = s.client("iam")
    role = "arn" + ":aws:iam::" + acct + ":role/PlatformDev"
    o = lambda k: "arn:aws:s3:::agent-platform-data-lake/" + k
    live = bool(os.environ["LIVE"])
    cand = None if live else open(os.path.join(os.environ["M"], "candidate-policy.json")).read()
    rows = [
        ("read-tfplan", "s3:GetObject", "tfplan/personal/1/probe.bin", "explicitDeny"),
        ("read-tfstate-github", "s3:GetObject", "tfstate/github/terraform.tfstate", "explicitDeny"),
        ("read-tfstate-personal", "s3:GetObject", "tfstate/personal/sandbox/terraform.tfstate", "explicitDeny"),
        ("read-transcript", "s3:GetObject", "ci-rca-evidence/review-transcripts/1/review.json", "explicitDeny"),
        ("version-read-tfplan", "s3:GetObjectVersion", "tfplan/personal/1/probe.bin", "explicitDeny"),
        ("write-tfstate-github", "s3:PutObject", "tfstate/github/terraform.tfstate", "explicitDeny"),
        ("write-tfstate-github-lock", "s3:PutObject", "tfstate/github/terraform.tfstate.tflock", "explicitDeny"),
        ("delete-version-tfplan", "s3:DeleteObjectVersion", "tfplan/personal/1/probe.bin", "explicitDeny"),
        ("write-transcript", "s3:PutObject", "ci-rca-evidence/review-transcripts/1/review.json", "explicitDeny"),
        ("control-read-ducklake", "s3:GetObject", "ducklake/probe.parquet", "allowed"),
        ("control-read-convergence", "s3:GetObject", "convergence/personal/sandbox.json", "allowed"),
        ("control-read-evidence", "s3:GetObject", "ci-rca-evidence/probe.json", "allowed"),
        ("control-write-evidence", "s3:PutObject", "ci-rca-evidence/probe.json", "allowed"),
        ("read-bootstrap-state", "s3:GetObject", "arn:aws:s3:::agent-platform-bootstrap-tfstate/terraform.tfstate", "implicitDeny"),
    ]
    def sim(extra, act, key):
        return iam.simulate_principal_policy(PolicySourceArn=role, ActionNames=[act], ResourceArns=[key if key.startswith("arn:") else o(key)], **extra)["EvaluationResults"][0]["EvalDecision"]
    today = {n: sim({}, a, k) for n, a, k, _ in rows}
    after = today if live else {n: sim({"PolicyInputList": [cand]}, a, k) for n, a, k, _ in rows}
    print(json.dumps({"live": today} if live else {"today": today, "with_candidate": after}))
    bad = [n for n, _, _, want in rows if after[n] != want]
    leaked_today = sorted(n for n, _, _, want in rows if want == "explicitDeny" and today[n] == "allowed")
    print(json.dumps({"mismatch": bad, "open_today": leaked_today}))
    ok = not bad and (live or ("read-tfplan" in leaked_today and "write-tfstate-github" in leaked_today))
    print("SIMULATE OK (" + ("live" if live else "candidate") + ") -- every probe fenced, every control kept") if ok else sys.exit("SIMULATE STOP")
    EOF
  expected: >-
    two JSON lines of probe names and decisions only: with_candidate explicitDeny on the nine fenced rows, allowed on the
    four controls, and implicitDeny on read-bootstrap-state (the bootstrap root's state bucket, which holds both
    ExternalIds and on which no PlatformDev policy, managed or not, may grant anything); open_today includes read-tfplan and write-tfstate-github (the gap this closes; read-tfstate-
    personal is explicitDeny today through DEP-13); then SIMULATE OK. Simulated ARNs are representative (the simulator
    evaluates strings, not objects). Post both lines in the PR description with step 10's.
  fix_if: >-
    read-bootstrap-state allowed -- some PlatformDev policy (likely the unmanaged AgentPlatformRuntime) grants the
    bootstrap state bucket: STOP and raise it with Benjamin as a security finding, it is outside this plan's Sids;
    a fenced row allowed with the candidate -- the Sid's Resource or Action is wrong: fix it in this PR and re-run
    steps 10-12; a control denied -- a Deny is too wide (convergence/ or ci-rca-evidence/ caught): fix and re-run;
    read-tfplan not open today -- someone already applied a fence: stop and establish who before going on
  hermetic: false
  graduation: not-applicable
- step: 12
  phase: pre-deploy
  action: >-
    LIVE RED BEFORE (read-only, as PlatformDev) -- head-object on a real tfplan, tfstate/github and transcript object
    succeeds today, and the three controls succeed
  command: |-
