schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: plugin-hooks-locate-checkout
intent: >-
  Clear the Critical telemetry-arrival red rec-5055 and restore the guards: since 2026-11-09 the claude.ai harness
  starts project threads in the parent of the checkout, so the ontheloop plugin gate finds no manifest and skips every
  hook (no capture, no PreToolUse guard, no canary). The plugin ships a locator that finds the checkout from the start
  directory, the gate runs each hook from it, an unusable layout is visible instead of silent, and the uncaptured
  window is recorded once the fix is proven live (NS.8: the hooks are part of the floor; NS.6: capture proven, not
  assumed).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-plugin-hooks-locate-checkout.yaml
phase: >-
  ci_rca (soft-warn exception category): Track B repair of rec-5055 under docs/contracts/red-main-recovery.yaml
  (Decision 226). No tier_item is targeted and no exit criterion is closed, so closes_criteria is empty.
closes_criteria: []
scope:
  # ---------------------------------------------------------------- PR 1: the fix (unguarded build thread, undeclared)
  - file: .claude/hooks/locate_checkout.bash
    action: Create
    purpose: >-
      PR 1. The locator, shipped inside the plugin and run as bash FILE (mode bits vary in the synced copy). No
      argument: print the checkout's absolute path and exit 0, or print nothing and exit 1; nothing on stderr. A
      directory is a candidate when its .claude/.claude-plugin/plugin.json is a regular file containing the manifest
      name literal ("name": "ontheloop"; test -f before reading, so a FIFO cannot hang it). Rule, first match wins:
      (1) CLAUDE_PROJECT_DIR, when absolute and a candidate; (2) its direct, non-hidden children that are candidates,
      the same directory reached by two names counted once: exactly one is the checkout; (3) among several, the one
      whose .git is a directory when exactly one is (a linked worktree's .git is a file); otherwise fail. It never
      consults PWD, never recurses below the direct children, never reads stdin and never executes or evaluates a
      name it finds. --notice SessionStart: when the rule fails, one stderr line
      "[plugin_hooks] no ontheloop checkout (candidates=N)", N the candidate count of step 2. --notice
      UserPromptSubmit: when the rule fails with N above 1, one UserPromptSubmit hookSpecificOutput JSON object whose
      additionalContext is "[plugin_hooks] repo hooks not loaded: N ontheloop checkouts under the session start
      directory, so the ontheloop plugin ran no hook (no guards, no capture). Follow the AGENTS.md hook canary rule.";
      nothing otherwise. Notice mode exits 0 on every path. The name must not end .sh or .py (constraint 2).
  - file: .claude/hooks/plugin_hooks.py
    action: Modify
    purpose: >-
      PR 1. GATE becomes exactly:
      [ -n "${ONTHELOOP_PROJECT_SETTINGS:-}" ] || ! CLAUDE_PROJECT_DIR="$(bash "${CLAUDE_PLUGIN_ROOT}/hooks/locate_checkout.bash" </dev/null)" || ! cd "$CLAUDE_PROJECT_DIR" || ! export CLAUDE_PROJECT_DIR ||
      followed by one space and the settings command byte for byte. render adds two plugin-only notice commands,
      [ -n "${ONTHELOOP_PROJECT_SETTINGS:-}" ] || bash "${CLAUDE_PLUGIN_ROOT}/hooks/locate_checkout.bash" --notice EVENT </dev/null,
      with no statusMessage: EVENT SessionStart after the drift check in the leading plugin-only SessionStart group,
      and EVENT UserPromptSubmit in a new leading UserPromptSubmit group. gated keeps refusing control operators in
      the settings command only. check and the CLI are unchanged in behaviour. The manifest path and name literal
      move to the locator; the docstring describes the new gate.
  - file: .claude/hooks/hooks.json
    action: Modify
    purpose: >-
      PR 1. Re-rendered with bin/venv-python .claude/hooks/plugin_hooks.py render; never edited by hand
      (docs/contracts/mechanical-conflicts.yaml names the generator).
  - file: tests/hooks/test_plugin_hooks.py
    action: Modify
    purpose: >-
      PR 1. New class TestLocatedGate (VP 1), each case run with /bin/sh -c on the gated command against directories
      under tmp_path, CLAUDE_PLUGIN_ROOT naming a plugin root that holds the locator: (a) project dir is the parent of
      one checkout and cwd is the parent: the hook runs with cwd and CLAUDE_PROJECT_DIR equal to the checkout (read in
      the hook's own environment), receives a PreToolUse payload on stdin byte for byte, and its exit status 2 is the
      gate's; (b) project dir is the checkout: the same; (c) a settings command that names
      "$CLAUDE_PROJECT_DIR/.claude/hooks/x.sh" runs the checkout's copy; (d) the settings marker set: not run, exit
      0, no output; (e) zero candidates and two clones: not run, exit 0, stdout and stderr empty; (f) the locator
      absent from the plugin root, and CLAUDE_PLUGIN_ROOT unset: not run, exit 0; (g) cwd inside a second checkout
      outside the project dir, and inside a sibling whose .git is a file (a linked worktree's shape): the same
      checkout as (a). Existing
      nodes re-pointed, none loosened: the gated-in-place node expects the two notice entries and still requires
      every settings hook to equal GATE plus its command; the parser node also asserts that no whitespace-split token
      of GATE or of a notice command ends .py or .sh and that the pin hook's command still names
      "$CLAUDE_PROJECT_DIR/.claude/hooks/"; the marketplace node asserts the gate names
      "${CLAUDE_PLUGIN_ROOT}/hooks/locate_checkout.bash", that the file ships under .claude/hooks, and that it reads
      .claude/.claude-plugin/plugin.json for the same name literal plugin.json carries; the marker-and-checkout node
      runs through the new gate with CLAUDE_PLUGIN_ROOT set.
  - file: tests/hooks/test_locate_checkout.py
    action: Create
    purpose: >-
      PR 1. TestLocate (VP 2), the locator run with bash against tmp_path layouts: the project dir wins when it is a
      candidate, even with candidate children; a single child (also with spaces in its path); a symlink twin counts
      once; a hidden child and a checkout two levels down are not found; an empty or relative CLAUDE_PROJECT_DIR
      fails; two clones fail; a clone with a linked worktree beside it (real git init, commit and worktree add, with
      -c user.name, -c user.email and -c commit.gpgsign=false) gives the clone from any cwd; a clone beside a copy
      with no .git gives the clone; two linked worktrees with no clone fail; a FIFO named plugin.json returns under a
      5 s timeout; a directory named with $(...), backticks, a semicolon and * is printed verbatim and creates
      nothing; success prints exactly one line, failure prints nothing, stderr is empty in both, and input waiting on
      stdin is left unread. TestNotice (VP 2): the SessionStart line for zero and for two clones, nothing when a
      checkout is found; the UserPromptSubmit object only for two clones, parsed as JSON, its additionalContext
      containing "repo hooks not loaded" and the count and never "[hook_canary]"; exit 0 on every path; and in the
      rendered hooks.json both notice entries are absent from settings.json, start with the marker test, carry no
      statusMessage and end </dev/null.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      PR 1. structural_assumptions gains the next free SA id (SA-12 at plan write; another unbuilt plan may take it
      first), status open, owning_item "T4.24:c9", location .claude/hooks/locate_checkout.bash, and one amendment_log
      row (field_add, semantic_break false, summary naming PLAN-plugin-hooks-locate-checkout and rec-5055,
      migration_story "Prose only; no code or contract consumer reads it."). The assumption text lands word for word
      as quoted here (operator-approved at the alignment sign-off, context item 2; the SA id is the only variance): "The ontheloop plugin gate assumes three facts about the claude.ai cloud harness and one layout.
      Facts: a project thread may start in the parent of the checkout rather than in it; hook shells get
      CLAUDE_PROJECT_DIR equal to that start directory, wherever the session shell has moved; and hook shells get
      CLAUDE_PLUGIN_ROOT naming the synced plugin directory, which holds every file under .claude/hooks, the locator
      included. Layout: the checkout is the start directory or one level below it. A directory counts as the checkout
      when its .claude/.claude-plugin/plugin.json names ontheloop, so the plugin runs that directory's hooks and
      bin/venv-python; among several it uses the one whose .git is a directory (a linked worktree's is a file) when
      exactly one is, and otherwise runs no hook. A checkout two or more levels down, a second clone beside the
      first, or a missing or edited synced locator therefore switches every plugin hook off with exit 0 (rec-5060 owns
      the fail-closed witness; rec-5062 owns guards that judge by the located checkout rather than the tool call's own
      directory)." The file has 32 effective lines of headroom (plan_obligations) and the row takes about 16.
  - file: config/agent/verification_registry/entries/plugin-gate-runs-hooks-from-the-located-checkout.yaml
    action: Create
    purpose: >-
      PR 1. Standing guard for VP 1, written in the PR that adds its nodes so the differential admission gate admits
      it against pre-PR main: primitive_slot test_selector, node_id tests/hooks/test_plugin_hooks.py::TestLocatedGate,
      guard_target .claude/hooks/plugin_hooks.py, plan_slug plugin-hooks-locate-checkout.
  - file: config/agent/verification_registry/entries/plugin-locator-picks-one-checkout.yaml
    action: Create
    purpose: >-
      PR 1. Standing guard for VP 2, same route: primitive_slot test_selector, node_id
      tests/hooks/test_locate_checkout.py::TestLocate, guard_target .claude/hooks/locate_checkout.bash, plan_slug
      plugin-hooks-locate-checkout.
  # ---------------------------------------------------------------- PR 2: the lost window (fresh, guarded thread)
  - file: config/telemetry/arrival.yaml
    action: Modify
    purpose: >-
      PR 2. lost_windows gains one row {from: "2026-11-09T22:33:00Z", to: TO, owner: rec-5055, reason: "plugin hooks
      skipped after the harness start directory moved, no backfill"}; TO is the proof thread's session_started_at
      read back in VP 16, UTC to the second. excused_sessions gains {key, owner: rec-5055} only for a key VP 11 lists
      with its evidence; none otherwise.
  - file: tests/telemetry_verify/test_session_presence.py
    action: Modify
    purpose: >-
      PR 2. New node test_the_shipped_config_records_the_rec_5055_lost_window: load_config(ROOT) passes check_config
      and holds at least one window owned by rec-5055 that starts 2026-11-09T22:33:00Z and ends later; with the
      shipped config a lone uncaptured commit whose PR was created at that start, or one second before the row's own
      end, is lost_window=1 missing=0, and one created at the row's end is missing=1. The end is read from the row,
      never restated.
