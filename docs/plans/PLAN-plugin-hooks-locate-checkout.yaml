rollback: >-
  PR 1: revert it; the plugin re-syncs to the old gate, which skips every hook in the parent-directory layout (the
  state before the fix) and behaves as before elsewhere. Both the fix and its revert reach every cloud session of
  the account on its next process start, so a revert is the fast route when the broken-locator line appears in
  sessions of other repositories. PR 2: revert it; arrival turns red again on the uncaptured
  merges until they leave the judge window, and rec-5055 reopens through ci-rca.
