      ls "$HOME"/.claude/plugins/synced/*/ontheloop/hooks/locate_checkout.bash && grep -c locate_checkout.bash
      "$HOME"/.claude/plugins/synced/*/ontheloop/hooks/hooks.json && /home/user/ontheloop/bin/venv-python -c "import
      json,os,glob; p=glob.glob(os.path.expanduser('~/.claude/projects/*/'+os.environ['CLAUDE_CODE_SESSION_ID']+'.jsonl'))[0];
      a=[json.dumps(r['attachment']) for r in (json.loads(l) for l in open(p,encoding='utf-8',errors='replace') if
      l.startswith('{')) if isinstance(r.get('attachment'),dict) and r['attachment'].get('hookEvent')];
      print('canary',sum('[hook_canary] repo hooks loaded' in s for s in a),'pin',sum('capture pin project_ref=ontheloop'
      in s for s in a))"
    expected: the locator path, a count above 0, then canary and pin both above 0 (in this plan's own unguarded thread the same probe printed canary 0 pin 0).
    fix_if: >-
      no locator file -- the sync did not carry the .bash file: stop and report (fix-forward PR: inline the locator's
      rule or rename it to a synced form, keeping constraint 2); canary 0 -- read the gate's stderr in the transcript's
      hook records and the container's start directory before changing anything; pin 0 with canary above 0 --
      SessionStart did not fire or the pin hook failed: report to the coordinator (U2 in HANDOFF-planning.md)
    hermetic: false
  - step: 16
    phase: post-deploy
    action: >-
      Fresh project thread -- a PreToolUse guard denies, and the thread's own root session row is in the warehouse.
      First run AWS_PROFILE=agent_platform_admin aws --version and capture the deny (it uses no credentials and
      contacts no backend, PLAN-protected-action-gate VP 9 precedent). Then, after the thread's first turn has ended
      at least once, read the row; its session_started_at is the lost window's end, TO.
    command: >-
      AWS_PROFILE=agent_platform /home/user/ontheloop/bin/venv-python -c "import os; from datetime import datetime,
      timezone; from scripts.telemetry_capture import read_route; from scripts.telemetry_verify import completeness;
      d=datetime.now(timezone.utc).date().isoformat(); k=completeness.normalise_key(os.environ['CLAUDE_CODE_REMOTE_SESSION_ID']);
      print([(r.get('session_started_at'), r.get('branch')) for r in
      read_route.make_routed_reader().named('telemetry_root_sessions', day_from=d, day_to=d) if
      completeness.normalise_key(r.get('harness_session_key'))==k])"
    expected: the aws command is blocked with a reason naming admin-credential; the read prints exactly one row with a session_started_at after PR 1's merge (its branch reads HEAD until rec-5061 lands). Record both in the PR 2 body.
    fix_if: aws prints a version -- the guards are not running, stop and report; no row after two ended turns -- read the Stop hook's record in the transcript for the capture outcome and report, do not write the lost window
    hermetic: false
  - step: 17
    phase: post-deploy
    action: After PR 2 merges -- telemetry-arrival is green on main at PR 2's merge sha, and again on the first run after PR 2's own session passes its SLA.
    command: AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_verify arrival
    expected: status=green (or skipped) with missing=0; record the two telemetry-arrival workflow run ids on main and their conclusions.
    fix_if: "missing above 0 on a sha: read its PR's creation time against the window and its key against step 11's list before suspecting capture; a new red is ci-rca's to file, never excused here"
    hermetic: false
  - step: 18
    phase: post-deploy
    action: >-
      rec-5055 is closed by PR 2's Resolves trailer through the Decision 186 closure obligation: it is
      escape-classified (escape_class no-edge), and its closure_artifact shard:arrival-config-records-rec-5055-lost-window
      was recorded at plan write, so the trailer closure resolves it once step 10's graduated shard is on main.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "import json; from src.common.ducklake_reader_client import
      fetch_recs_by_ids, make_reader; rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5055']);
      r=rows[0]; print(r['id'], r['status'], json.loads(r.get('context_v2_json') or '{}').get('fixed_by_sha'))"
    expected: prints rec-5055 closed and PR 2's merge sha, after the closure job runs on the merge commit; record that run id.
    fix_if: >-
      still open: read the closure job's log for a ClosureArtifactRequired or acceptance refusal marker (it exits 0 and
      leaves the rec open). Leading causes: the squash body lacks Resolves for rec-5055, the graduated shard is not on
      main, or a named node is absent from the run's junit report. Never close it with a direct status write after a
      refusal (git-ops.yaml resolves_trailer); fix the cause and re-run the closure route.
    hermetic: false
