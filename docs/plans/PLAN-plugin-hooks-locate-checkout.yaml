acceptance_criteria:
  - "From a project dir that is the checkout's parent (the harness layout since 2026-11-09) every plugin hook runs from the checkout with CLAUDE_PROJECT_DIR set to it, its stdin payload intact and its exit status passed through; the old layout (project dir is the checkout) and the settings-marker path behave as before, except that every plugin hook now runs from the checkout rather than the session shell's directory (inside the rec-5062 residual)."
  - "The locator picks the project dir when it is the checkout, else the single direct child that is one, else the single candidate whose .git is a directory; the shell's directory never changes the answer; it reads no stdin and prints one path or nothing."
  - "With no usable checkout the plugin runs no hook and exits 0. SessionStart writes one stderr line with the candidate count; with more than one unresolved candidate every prompt carries a model-visible line containing repo hooks not loaded; zero candidates never reach model context. A missing or unparseable synced locator also puts a repo hooks not loaded line on every prompt, and no notice command ever exits non-zero."
  - "hooks.json is the render of settings.json under the new gate, and every hook keeps the name and the capture pin the capture parser reads."
  - "ports.yaml records the harness and layout assumption in the words its scope row quotes."
  - "In a fresh project thread after PR 1 merges the synced plugin holds the locator, the canary line and the SessionStart capture pin are in the transcript's hook records, a PreToolUse guard denies a protected command, and the thread's root session row is in the warehouse."
  - "config/telemetry/arrival.yaml records one lost window from 2026-11-09T22:33:00Z to the proof thread's start, owned by rec-5055; telemetry-arrival on main is green on PR 2's merge, and rec-5055 is closed by PR 2's Resolves trailer with fixed_by_sha equal to that merge."
