execution_steps:
  - >-
    Precondition: #1736 and #1730 are on main (git fetch origin main first). #1736: .github/workflows/terraform-plan-trusted.yml
    has job `plan` with steps persist and digest (the digest run body contains context=terraform-plan-digest), and
    tests/checks/ci_guards/test_terraform_plan_trusted.py exists. #1730:
    scripts/checks/iam_tf/validate_policy_document_plan_time_refs.py exists on origin/main. If either is missing, stop
    and wait; if the job's shape differs from this plan, return to the planner.
  - >-
    Add opaque_entries, the OPAQUE fit line and --fit-check to terraform_plan_digest.py and create
    tests/test_terraform_plan_digest_opaque.py; run its cases and VP 2.
  - Update terraform_personal_plan_report.py and its tests.
  - >-
    Add the fit_check step to terraform-plan-trusted.yml, extend test_terraform_plan_trusted.py, register the r3 entry,
    edit the contract with the approved wording (at most 500 effective lines); run VP 1-3.
  - Run VP 4 (full tier) to completion; commit and push.
  - >-
    Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state; parent
    validator evidence (VP 4 full-tier exit 0 plus bin/venv-python -m scripts.checks.validation_result --verify-head for
    the pushed HEAD); structured postflight evidence (write the scripts.session.postflight_evidence.CATEGORIES JSON in the
    scratchpad, then bin/venv-python -m scripts.session.postflight --evidence <file>); the real outcome - push, build PR,
    CI green by event-driven wake (never polled), merge SHA.
  - >-
    Open the build PR and ask Benjamin for his word on the final diff (code-owned workflow and digest module). Merge on
    code review PROCEED, every check finished green (get_check_runs), a coordinator-confirmed merge window and that word;
    the contract wording is pre-approved. Then tell the rec-4741 planning thread the digest change is on main and the module's effective SLOC after it.
  - "Report: what was implemented, verification results, and VP 5 once the first real terraform/personal PR runs."
rollback: >-
  Revert the build PR. The trusted plan job stops failing on OPAQUE and OVERFLOW, the fit line loses the OPAQUE word, and
  the contract loses one sentence. The merge-time digest never changed. Nothing in AWS changes.
