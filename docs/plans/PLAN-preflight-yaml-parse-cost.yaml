constraints:
- >-
  Scope is the nineteen files above (Decision 59). Untouched: compute_followon_state's per-plan parse
  (scripts/platform_roadmap_state.py:115), scripts/data_quality_compile.py, scripts/preflight/decision_conditions.py,
  tests/session/preflight/conftest.py, scripts/test_coverage_checker.py, scripts/checks/_pytest_diff.py, the coverage
  child's argv, and every config/coverage_baseline.yaml entry. The child's environment changes only by COVERAGE_CORE.
- >-
  No COVERAGE_TIMEOUT_SECONDS raise, no xdist in the coverage child, no skip or quarantine, no baseline lowering, no
  budget raise in the guard to pass (Decisions 55, 128, 159, 181; operator ruling 2026-10-11). The sysmon core is the
  operator's 2026-10-16 Step 6b choice; if step 7 finds a reproducible line difference, the core switch stops for the
  operator rather than shipping.
- >-
  Every touched file stays at or under 500 SLOC by decomposition, never a budget raise (Decision 128/130).
- >-
  Every switched site parses through scripts.contract_rules.parse_yaml; no new loader constant or yaml.load call
  appears in scope. libyaml is a required dependency (the pinned PyYAML wheels bundle it) enforced by the guard's
  yaml.__with_libyaml__ assertion; parse_yaml's getattr fallback (#1511's code, not this plan's) only keeps an odd
  environment correct but slow and gets no dedicated test here.
- >-
  Call get_rec_write_guidance() before composing the amended acceptances (Decision 66). Recommendation reads go through
  named verbs only (Decision 215).
- Never weaken (implement-scope-boundary CONTENT clause). No rescue agents or workaround loops (Decision 55).
