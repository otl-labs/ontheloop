slug: product-surface-and-open-core
intent: 'Record the operator-confirmed product direction as two numbered Decisions and one deferred tier item. Decision 232:
  a persona is an AI role and a human target-user type is a user archetype; the Signaller (an engineer moving into supervision,
  also the champion who installs and hosts On The Loop) is served first; one human surface, a web UI over the engine''s closed
  named-verb API that steers, watches, interrupts and routes approvals to GitHub, ships as the CLI plus a localhost UI built
  to be served from anywhere. Decision 233: the open core is customer-owned (Decision 184''s local-first re-read), Decision
  209 clause 1 is reworded so scale is never blocked and only the tooling that makes scale painless is paid, go-to-market
  is champion first, and the free tier is a framework with no identity system of its own; the multi-writer questions stay
  open under follow-on recs. T4.33 tracks the web UI, deferred_post_mvp. Governance encoding only: no code, UI, package or
  port lands.'
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V1
plan_path: docs/plans/PLAN-product-surface-and-open-core.yaml
phase: 'No existing tier_item: operator-directed product-direction Decisions (overseer run otl-product-direction, wave 1;
  soft-warn category user_explicit_out_of_scope). Creates deferred_post_mvp T4.33 (Decision 93) and adds a dated pointer bracket
  to T2.53 c5; closes no criterion. Implementation order 232/233 -> 234 -> 235. Names no CD.27-gated item, so no fallback_reevaluation
  block is owed.'
amends:
- dec:184#1
- dec:184#2
- dec:209#1
introduces:
- user_archetype
- T4.33
