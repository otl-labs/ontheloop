  a bare yaml envelope (amends [184, 209]), title amends edges {184, 209}, clauses 1-5, the Options-considered line, a monitored
  stanza (multi-writer-unsafe, approval-authority-absent) naming rec-4558 and rec-4559, every phrase VP 3 lists, and no public-boundary
  or retired-name token (VP 3, VP 10).
