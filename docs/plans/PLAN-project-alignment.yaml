  The plan-obligations-command-wired shard's two asserted conditions are never repointed or dropped (Decision 181);
  the repair is restoring the guarded phrase in plan.md. Repointing at the menu literal was simulated against
  run_differential and rejected as tautological; it would also change the asserted condition.
- No rescue agents or workaround loops (Decision 55).
