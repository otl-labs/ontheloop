execution_steps:
- >-
  Create docs/contracts/project-alignment.yaml (header comment, contract envelope per Decision 168, then definition,
  tasks, carriers, autonomy, legacy_labels, decisions_cited) and its file-router route; model the envelope on
  docs/contracts/visual-grammar.yaml with status ratified instead of provisional_v0.
- >-
  Edit .claude/commands/plan.md Step 6 (title, one-line definition naming the contract, two role-named sub-steps,
  every Step 6a/6b mention and the gate value); then the planning, overseer and decision-scout skills, checking byte
  counts after each skill edit.
- >-
  Edit docs/contracts/overseer-dispatch.yaml: rename the gate value and Step 6a/6b wording in every live section, point
  plan_fork_classification.applies_to at the new contract, append one amendment_log row.
- >-
  Edit candidate-decision-ratification.yaml and tier-item-lifecycle.yaml (rename plus one amendment_log row, in each file's existing order,
  each), orphan_baseline.yaml, scripts/decisions_index.py and the freshness test docstrings.
- >-
  Edit the plan-obligations-command-wired shard's first assert message only, and in the same commit append
  '; split means split the plan per Step 8's Planning-time split' after the escalation-menu literal in plan.md Step 9; add the
  verification-registry.yaml governance note and amendment_log row; run VP 10.
- Append the two dated brackets to T4.30 c5 and T4.29 c5 in docs/ROADMAP-PLATFORM.yaml.
- >-
  Update tests/test_plan_fork_classification_contract.py and tests/test_workflow_skill_antidrift.py (renames only, equal
  strength); write tests/test_project_alignment_contract.py; add the two registry rows.
- >-
  Execute the Verification Plan: run each step and loop until it passes; on an unrecoverable failure stop and RCA
  (Decision 55). Never weaken a VP assertion, a check or the sweep's exclusions to obtain green (Decision 181).
- >-
  CLOSURE. Report each fact separately and in order (implement skill Commit Flows; docs/contracts/git-ops.yaml).
  (a) READINESS: bin/venv-python -m scripts.session.github_readiness; an unknown result is never PASS. (b) Set
  implementation_declared true, commit, then git fetch origin main and git rebase origin/main; STOP on a conflict.
  (c) Re-run VP 1, VP 7, VP 8, VP 10 and the full tier (VP 6) on the committed, rebased tree. (d) Structured evidence
  through bin/venv-python -m scripts.session.postflight --evidence. (e) The independent code-review verdict. (f) Push,
  PR, CI and squash-merge, with 'Resolves: rec-3214' in the squash commit body; the PR body notes that the
  OVERSEER-persona-first-migration ledger has in-flight slices carrying the retired gate value, which legacy_labels
  reads, that rec-3042 closed before implement (credited to PLAN-step-6b-fork-classification), and that the
  plan-obligations-command-wired shard was repaired. (g) Append a note to rec-3286 through the portal's update_rec
  naming the repaired shard and the merge commit (rec-3286 stays open).
- >-
  Report: facts (a)-(g) as separate items, each VP verdict (VP 1-10), the two graduated shard ids, and the three
  effective-line counts from VP 7.
rollback: >-
  Revert the squash commit. The rename is atomic across surfaces, so a partial revert would leave a gate value one
  surface does not know; revert whole.
