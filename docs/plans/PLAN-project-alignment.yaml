schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: project-alignment
intent: >-
  Name /plan Step 6 "project alignment" -- one process at project level made of two agent tasks: the decision-scout
  recon of active Decisions, then the alignment sign-off on the plan draft refined from its findings -- and migrate the
  retired Step 6a/6b labels and the step-6b-confirmation gate value repo-wide, with one Class D contract that defines
  the process across the in-session, overseer-relay and future PR flows, so the platform's defining planning step has
  one durable name and one home.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-project-alignment.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn category): operator-directed naming of the /plan Step 6 process. Claims no
  docs/ROADMAP-PLATFORM.yaml tier_item and closes no criterion; adds dated append-only brackets to open criteria
  T4.30 c5 and T4.29 c5 (exit-criteria-ledger.yaml fields.status.semantics: the realized-differently rewrite fires
  only on a flip to met), statuses unchanged, and repoints one tier item's intent pointer to the Step 6a gate (scope row). Bundles rec-3214 (rec-3042 auto-closed before implement; not bundled). Names no CD.27-gated item, so no fallback_reevaluation block is owed.
scope:
- file: docs/contracts/project-alignment.yaml
  action: Create
  purpose: >-
    Class D contract (Decision 168): status ratified, ratified_via PLAN-project-alignment, subject project-alignment,
    evaluator agent_surface .claude/commands/plan.md. Defines project alignment, its two agent tasks, its three
    carriers (in-session, overseer relay on gate value project-alignment, future PR flow), the autonomy pointer and a
    documentation-only legacy_labels map. Pointers only, never restating Decisions (Decision 86).
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: >-
    One route whose topic equals the new contract's subject, project-alignment (Decision 168 self-hosting), plus one
    flow-style amendment_log row. The file is at 498 of 500 effective lines: pay for the route and row by joining
    wrapped route descriptions onto one line each (no text change), ending at or under 500 (VP 7).
- file: .claude/commands/plan.md
  action: Modify
  purpose: >-
    '## Step 6: Present Findings and Confirm' becomes '## Step 6: Project Alignment' with a one-line definition naming
    docs/contracts/project-alignment.yaml; sub-steps '### Step 6a: Decision Scout Gate ...' and '### Step 6b: Present
    and Confirm' are renamed by role ('### Decision Scout (MANDATORY, before sign-off)', '### Alignment Sign-off');
    every Step 6a/6b mention and the gate value are repointed. Step 9's escalation sentence gains the gloss
    '; split means split the plan per Step 8's Planning-time split' after the verbatim menu literal (revision r1: restores the
    phrase the plan-obligations-command-wired shard guards, lost in #1050; the menu literal itself is unchanged).
- file: .claude/skills/planning/SKILL.md
  action: Modify
  purpose: >-
    Headings 'Decision Scout Gate (Workflow Step 6a, pre-presentation)' and 'Confirmation Gate (Workflow Step 6b)'
    become 'Decision Scout Gate (Workflow Step 6, project alignment recon)' and 'Alignment Sign-off (Workflow Step 6,
    project alignment)'; Step 6a/6b mentions and the gate value repointed; rec-3214's two four-rows counts made
    count-free.
- file: .claude/skills/overseer/SKILL.md
  action: Modify
  purpose: >-
    Gate value and the Step 6b confirmation relay wording renamed; byte-neutral or smaller (25 bytes free). Today the
    carrier wraps across lines 118-119 ('gate:' then the value); the rewrap keeps 'gate: project-alignment' on one
    line so the carrier-literal assertions match without whitespace normalization.
- file: .claude/skills/decision-scout/SKILL.md
  action: Modify
  purpose: >-
    Description 'Mandatory pre-confirmation gate in /plan' names project alignment instead; at most 5 bytes larger
    (11,293 of 11,298).
- file: docs/contracts/overseer-dispatch.yaml
  action: Modify
  purpose: >-
    Gate value step-6b-confirmation -> project-alignment in every live section (request_schema, gate_run_id,
    pending_gates, subagent_detection exact_header, trampoline_sequence, autonomy_tiers.plan_fork_classification);
    Step 6a/6b wording repointed, including interleave_with_pr_lifecycle's 'Steps 6a/9/5' (line 287) and
    plan_fork_classification.applies_to's 'planning/SKILL.md Confirmation Gate' heading pointer (line 381);
    applies_to names docs/contracts/project-alignment.yaml; one appended flow-style (one-line) amendment_log row, since
    the file is at 492 of 500 effective lines (VP 7). Existing amendment_log rows unchanged.
- file: docs/contracts/candidate-decision-ratification.yaml
  action: Modify
  purpose: >-
    The Step 6b Confirmation Gate mentions become the alignment sign-off (Decision 105's sign-off meaning kept), plus
    one amendment_log row in the file's existing order (change_class prose_improvement, semantic_break false) that validate_contract_drift
    requires; prior rows unchanged.
- file: docs/contracts/tier-item-lifecycle.yaml
  action: Modify
  purpose: >-
    The human confirmation gate pointer names the alignment sign-off instead of Step 6b, plus one amendment_log
    row in the file's existing order (change_class prose_improvement, semantic_break false) that validate_contract_drift requires;
    prior rows unchanged.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    Dated append-only brackets on open T4.30 c5 and T4.29 c5 (sequencing clarification, not only a rename; the T4.30
    bracket explicitly supersedes the original 'after Step 6b' ordering); original text and statuses unchanged. T4.2's
    intent pointer 'per the planning skill's Step 6a gate' becomes 'per the planning skill's Decision Scout Gate
    (project alignment)'.
- file: config/agent/data_quality/decisions/orphan_baseline.yaml
  action: Modify
  purpose: Prose mention 'the Step 6b confirmation' becomes 'the alignment sign-off'.
- file: config/agent/verification_registry/entries/plan-obligations-command-wired.yaml
  action: Modify
  purpose: >-
    The first assert's message 'Steps 4/6b do not invoke the obligation query' becomes 'Step 6 (alignment sign-off) does
    not invoke the obligation query' (Step 4 no longer invokes it; rec-3286 item 3). Both asserted conditions and every
    other field stay byte-identical. The edit re-enters run_differential, which admits it only because plan.md's
    restored 'split the plan' gloss makes the shard fail on origin/main and pass on HEAD (VP 10).
- file: docs/contracts/verification-registry.yaml
  action: Modify
  purpose: >-
    One governance_notes paragraph recording the in-place, message-only, claim-preserving edit of
    plan-obligations-command-wired (check_id, plan_slug and graduated_at kept; the plan.md gloss is the repair; fails
    on origin/main, passes on HEAD), per the PLAN-ccr-branch-prefix precedent (Decision 176: governance_notes is the
    only provenance surface an in-place modification lands on), plus one flow-style amendment_log row in the file's newest-first order (change_class
    governance_note_add, semantic_break false). The file is at 481 of 500 effective lines (VP 7).
- file: config/agent/verification_registry/entries/router-route-project-alignment.yaml
  action: Create
  purpose: >-
    Graduated grep_count row for VP step 2 (the new router route): pattern '(?m)^  - topic: project-alignment$',
    operator eq, count 1 (the slot's re.findall has no MULTILINE flag; precedent router-route-project-configuration).
- file: config/agent/verification_registry/entries/project-alignment-contract-shape.yaml
  action: Create
  purpose: Graduated test_selector row for VP step 1 (contract shape and stale-reference sweep).
- file: scripts/decisions_index.py
  action: Modify
  purpose: Docstring provenance '(Step 6b fork 2' becomes '(project alignment fork 2'; no code change.
- file: tests/test_project_alignment_contract.py
  action: Create
  purpose: >-
    Contract-shape test plus the stale-reference sweep over the live surfaces (red on main, green after); covers
    every Modify surface that is not otherwise tested.
- file: tests/test_plan_fork_classification_contract.py
  action: Modify
  purpose: >-
    Tokens step-6b-confirmation -> the carrier literal 'gate: project-alignment' (never the bare token, which is a
    substring of the contract path plan.md must cite, so a bare-token assertion would pass vacuously -- critique r2
    R1) in the three surface helpers (_assert_plan_md_step6b..., _assert_planning_skill_points_without_restating,
    _assert_dispatched_carrier_is_declared_on_every_surface); the YAML-structure assertions keep the bare value; the
    planning-skill heading slice, helper and test names, and messages renamed; equal-strength assertions
    (weakening_dispositions refactor).
- file: tests/test_workflow_skill_antidrift.py
  action: Modify
  purpose: >-
    Test test_plan_workflow_invokes_obligations_once_at_step_6b renamed ..._at_alignment_sign_off and its docstring's
    'at Step 6b' updated; assertions unchanged.
- file: tests/checks/decisions/test_validate_decisions_index_freshness.py
  action: Modify
  purpose: Docstring '(Step 6b fork 2)' becomes '(project alignment fork 2)'.
bundled_recommendations:
- rec-3214
followon_recs: []
infrastructure_dependencies:
- >-
  LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition (critique r1 R2).
  compute_affected_artifacts(<this plan's scope>) returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']}: the live
  roadmap is a packaged asset of the active data-pipeline artifact. No build, deploy or smoke test is owed: the change
  to that asset is data only (two dated brackets and one intent pointer; no packaged code), its sole runtime reader puts
  the raw text into a prompt behind a disabled schedule (T4.12), and the asset refreshes with the artifact's next
  governed deploy. No other scope file is Lambda-packaged and no .tf file is in scope. Standing gap: rec-3846 (no new
  rec). Precedent: PLAN-dependency-map-transit-renderer.
weakening_dispositions:
- candidate: "[test-removed] tests/test_plan_fork_classification_contract.py::TestForkClassificationContract::test_plan_md_step6b_carries_shape_and_pointer"
  disposition: refactor
  cite: tests/test_plan_fork_classification_contract.py::TestForkClassificationContract::test_plan_md_step6_carries_shape_and_pointer
- candidate: "[test-removed] tests/test_plan_fork_classification_contract.py::TestForkClassificationContract::test_trampoline_declares_the_step_6b_relay_hop"
  disposition: refactor
  cite: tests/test_plan_fork_classification_contract.py::TestForkClassificationContract::test_trampoline_declares_the_sign_off_relay_hop
- candidate: "[test-removed] tests/test_workflow_skill_antidrift.py::test_plan_workflow_invokes_obligations_once_at_step_6b"
  disposition: refactor
  cite: tests/test_workflow_skill_antidrift.py::test_plan_workflow_invokes_obligations_once_at_alignment_sign_off
acceptance_criteria:
- >-
  docs/contracts/project-alignment.yaml exists as a Class D contract with status ratified, ratified_via naming
  PLAN-project-alignment, subject project-alignment and evaluator agent_surface .claude/commands/plan.md, and
  .claude/commands/plan.md contains the literal docs/contracts/project-alignment.yaml (Decision 168).
- >-
  The contract defines project alignment as one process with exactly two agent tasks (decision_scout_recon, then
  alignment_sign_off on the refined draft), names three carriers -- in_session (AskUserQuestion or chat), overseer_relay
  (GATE_REQUEST gate project-alignment) and pr_flow (marked future, pointer-only to T4.30 c5 and T4.29 c5 and Decisions
  205 clause 1 and 229 clause 4, which own the sequencing; the contract never restates it) -- states that project
  alignment (the whole Step 6 process) is distinct from the decision scout's intent-alignment (SPIRIT) lane of
  Decision 152, points autonomy at overseer-dispatch.yaml autonomy_tiers.plan_fork_classification
  (provenance PLAN-step-6b-fork-classification, audit remedy B2-R4; Decision 211 cited as the frame autonomy is earned
  under, Decision 235 as an analogous pattern only), and carries a legacy_labels map
  (Step 6a, Step 6b, step-6b-confirmation) marked documentation-only, never an accepted value.
- >-
  No live surface carries a retired label. Over whitespace-normalized text with amendment_log rows stripped, zero
  matches for step-6b-confirmation, for the regex Steps?\s+(?:\d+/)*6[ab]\b, and for the retired heading names
  'Confirmation Gate (Workflow', 'Present and Confirm', 'Present Findings and Confirm', 'Workflow Step 6a' and
  'Workflow Step 6b', across .claude/, docs/contracts/ (except project-alignment.yaml's legacy_labels), scripts/,
  tests/ (except tests/test_project_alignment_contract.py) and config/. The registry row plan_slug
  step-6b-fork-classification is a real historical slug and stays. Separately, T4.2's intent in
  docs/ROADMAP-PLATFORM.yaml no longer names Step 6a.
- >-
  docs/contracts/overseer-dispatch.yaml's gate enumeration names project-alignment where it named
  step-6b-confirmation, gains exactly one appended amendment_log row (change_class accepted_values_narrow,
  semantic_break true, naming both the retired and the new value), and its prior amendment_log rows are byte-identical.
- >-
  docs/ROADMAP-PLATFORM.yaml T4.30 c5 and T4.29 c5 each end in a dated bracket citing PLAN-project-alignment: T4.30 c5's
  states that it supersedes the original 'after Step 6b' ordering: Step 6b is now project alignment's sign-off, and in
  the PR flow project alignment begins when /plan opens the draft plan PR (the scout runs on its draft pushes) and
  completes at ready_for_review; T4.29 c5's states that /plan marks the plan PR ready only
  on the operator's alignment sign-off. Both statuses stay open and the original text is unchanged.
- >-
  No historical artefact changes: docs/DECISIONS.md, docs/plans/ (other than this plan), docs/plans/reports/,
  docs/audit-prompts/ and audits/ are untouched.
- >-
  The prose budgets hold: .claude/skills/decision-scout/SKILL.md stays within 11,298 bytes and
  .claude/skills/overseer/SKILL.md within 12,721 bytes with no budget raise; rec-3214's acceptance holds (no 'four rows'
  or 'four routing keys' in the planning skill); the squash commit's Resolves trailer names rec-3214 only (rec-3042 was
  auto-closed before implement and is not bundled).
- >-
  config/agent/verification_registry/entries/plan-obligations-command-wired.yaml differs from origin/main only in its
  first assert's message (now 'Step 6 (alignment sign-off) does not invoke the obligation query'); both asserted
  conditions are byte-identical. .claude/commands/plan.md contains 'split the plan' outside the escalation-menu literal,
  which stays verbatim. The differential admission gate admits this shard and both new registry rows (VP 10).
- >-
  docs/contracts/candidate-decision-ratification.yaml, docs/contracts/tier-item-lifecycle.yaml and
  docs/contracts/verification-registry.yaml each gain exactly one amendment_log row citing PLAN-project-alignment,
  their prior rows unchanged (VP 8); verification-registry.yaml's governance_notes names plan-obligations-command-wired
  and PLAN-project-alignment.
- The full validate tier exits 0 on the committed, rebased tree.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Run the new contract test: contract shape (Decision 168 fields, two tasks, three carriers, legacy_labels
    documentation-only), plan.md naming the contract, the single router route and both registry rows, T4.2's intent naming no Step 6a,
    the carrier literal 'gate: project-alignment' on each relay surface, and the stale-reference sweep over the live surfaces with
    amendment_log rows stripped. Red on main (file absent), green after.
  command: bin/venv-python -m pytest tests/test_project_alignment_contract.py -q
  expected: pytest exits 0 with every test passing.
  fix_if: >-
    Any failure names the surface still carrying a retired label, or the contract field that is missing; fix that
    surface, never widen the sweep's exclusions.
  hermetic: true
  graduation: graduate
  graduation_check_id: project-alignment-contract-shape
  expected_literals:
  - passed
- step: 2
  phase: pre-deploy
  action: The file-router carries exactly one route whose topic is the new contract's subject.
  command: >-
    test "$(grep -cE '^  - topic: project-alignment$' docs/contracts/file-router.yaml)" -eq 1 && echo ROUTE_OK
  expected: Prints the marker and exits 0.
  fix_if: Zero or two routes; add or dedupe the route.
  hermetic: true
  graduation: graduate
  graduation_check_id: router-route-project-alignment
  expected_literals: []
- step: 3
  phase: pre-deploy
  action: >-
    The renamed existing tests still pass at equal strength: the fork-classification contract test (now asserting
    project-alignment on all four surfaces), the antidrift suite and the decisions-index freshness test.
  command: >-
    bin/venv-python -m pytest tests/test_plan_fork_classification_contract.py tests/test_workflow_skill_antidrift.py
    tests/checks/decisions/test_validate_decisions_index_freshness.py -q
  expected: pytest exits 0.
  fix_if: >-
    A failing token assertion means a surface was missed or a heading slice no longer matches; fix the surface, never
    the assertion's strength.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    These files already guard on main through plan-fork-classification-contract-shape (whole-file node_id) and the
    standing suites; a new row would duplicate them, and they are green before the change, so they cannot graduate as
    red-before.
  expected_literals:
  - passed
- step: 4
  phase: pre-deploy
  action: >-
    The weakening surfacer reports exactly the three test-removed candidates, each disposed refactor in this plan's
    weakening_dispositions, and no assertion-weakening candidate.
  command: bin/venv-python -m scripts.checks.verification.validate_weakening_candidates --base origin/main --head HEAD
  expected: >-
    Exactly three CANDIDATE lines, all category test-removed, matching weakening_dispositions; none of category
    assertion-removed, assertion-changed or tolerance.
  fix_if: >-
    An extra candidate means an assertion changed strength; restore it rather than add a disposition.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Diff-relative against origin/main, so it goes vacuous after merge; validate_weakening_dispositions is the standing
    guard for the dispositions themselves.
- step: 5
  phase: pre-deploy
  action: Prose budgets hold with no raise marker added.
  command: >-
    test "$(wc -c < .claude/skills/decision-scout/SKILL.md)" -le 11298 && test "$(wc -c <
    .claude/skills/overseer/SKILL.md)" -le 12721 && test "$(wc -c < .claude/skills/planning/SKILL.md)" -le 44097 && ! git diff origin/main -- config/prose_budgets.yaml | grep -q '^+'
    && echo BUDGETS_OK
  expected: Prints the marker and exits 0.
  fix_if: Tighten the edited sentence; never raise the budget.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    validate_prose_budgets already guards both byte budgets in every tier; this step only proves this diff added no
    raise.
- step: 6
  phase: pre-deploy
  action: Fast tier, then the full tier on the committed, rebased tree.
  command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
  expected: Both exit 0.
  fix_if: Diagnose the named check; fix on the branch.
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: >-
    Effective-line accounting for the three contracts near the 500-line ceiling: file-router.yaml,
    overseer-dispatch.yaml and verification-registry.yaml each end at or under 500 effective lines.
  command: >-
    bin/venv-python -c "from pathlib import Path; from scripts.checks.structural._classify import effective_lines; n =
    {f: effective_lines(Path(f).read_text(encoding='utf-8')) for f in ('docs/contracts/file-router.yaml',
    'docs/contracts/overseer-dispatch.yaml', 'docs/contracts/verification-registry.yaml')}; print(n); assert all(v <=
    500 for v in n.values()), n"
  expected: Prints the three counts, each at or under 500, and exits 0.
  fix_if: Join further wrapped descriptions onto one line; never drop content or raise the ceiling.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    validate_structural_size_limits already guards the 500-line contracts class in every tier; this step only makes
    the accounting visible before the full tier.
  expected_literals: []
- step: 8
  phase: pre-deploy
  action: >-
    History stays untouched: no change under docs/DECISIONS.md, docs/plans/ (other than this plan), docs/audit-prompts/
    or audits/, and the prior amendment_log rows of overseer-dispatch.yaml, candidate-decision-ratification.yaml,
    tier-item-lifecycle.yaml and verification-registry.yaml are unchanged with exactly one row, citing
    PLAN-project-alignment, added to each.
  command: >-
    test -z "$(git diff --name-only origin/main -- docs/DECISIONS.md docs/plans/ docs/audit-prompts/ audits/ | grep -vx
    'docs/plans/PLAN-project-alignment.yaml')" && bin/venv-python -c "import subprocess, yaml; ld = lambda f, base=False:
    yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:' + f], capture_output=True, text=True,
    check=True).stdout if base else open(f, encoding='utf-8'))['amendment_log']; fs = ['docs/contracts/' + c + '.yaml'
    for c in ('overseer-dispatch', 'candidate-decision-ratification', 'tier-item-lifecycle', 'verification-registry')];
    added = {f: [r for r in ld(f) if r not in ld(f, True)] for f in fs}; bad = [f for f in fs if not (len(ld(f)) ==
    len(ld(f, True)) + 1 and all(r in ld(f) for r in ld(f, True)) and len(added[f]) == 1 and 'PLAN-project-alignment'
    in str(added[f][0]))]; assert not bad, bad; g = yaml.safe_load(open('docs/contracts/verification-registry.yaml',
    encoding='utf-8'))['governance_notes']; assert 'plan-obligations-command-wired' in g and 'PLAN-project-alignment'
    in g, 'governance note missing'" && echo HISTORY_OK
  expected: Prints the marker and exits 0.
  fix_if: Restore the touched historical artefact or amendment row from origin/main; never edit history to pass.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Diff-relative against origin/main, so it goes vacuous after merge; Decision 177's immutability check guards
    DECISIONS.md standing.
- step: 9
  phase: post-deploy
  action: After the squash merge, the bundled rec reads closed.
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
    fetch_recs_by_ids(make_reader(), ['rec-3214']); print(sorted((r['id'], r['status']) for r in rows))"
  expected: The rec-3214 row shows status closed.
  fix_if: The Resolves trailer was missing or malformed; close through the portal's update_rec with the merge evidence.
- step: 10
  phase: pre-deploy
  action: >-
    The edited plan-obligations-command-wired shard differs from origin/main only in its first assert's message, and
    the real differential admission gate admits it and both new registry rows (fails on origin/main, passes on HEAD).
  command: &vp10_command >-
    bin/venv-python -c "import subprocess, yaml; from pathlib import Path; from scripts import verification_graduation
    as vg; e = 'config/agent/verification_registry/entries/'; f = e + 'plan-obligations-command-wired.yaml'; old =
    yaml.safe_load(subprocess.run(['git', 'show', 'origin/main:' + f], capture_output=True, text=True,
    check=True).stdout); new = yaml.safe_load(Path(f).read_text(encoding='utf-8'));
    old['check_spec']['command'][2] = old['check_spec']['command'][2].replace('Steps 4/6b do not invoke', 'Step 6
    (alignment sign-off) does not invoke'); assert old == new, 'shard changed beyond the message'; rows =
    [yaml.safe_load(Path(e + c + '.yaml').read_text(encoding='utf-8')) for c in ('plan-obligations-command-wired',
    'router-route-project-alignment', 'project-alignment-contract-shape')]; out = {r['check_id']: vg.run_differential(r)
    for r in rows}; print({k: v.reason for k, v in out.items()}); assert all(v.admitted for v in out.values()), out"
    && echo ADMITTED_OK
  expected: Prints three 'admitted' reasons and the marker, and exits 0.
  fix_if: >-
    'shard changed beyond the message' means an asserted condition moved; restore it. 'not admitted -- check does not
    pass on HEAD' means plan.md lacks the 'split the plan' gloss, or -- when the output names 'Step 6 (alignment
    sign-off) does not invoke' -- the Alignment Sign-off rewrite dropped the scripts.roadmap.plan_obligations
    invocation (restore it); 'tautological' means the shard no longer fails on origin/main. A GraduationError naming an
    unrunnable interpreter in the revert worktree is environmental (no resolvable .venv): rerun from the main checkout
    with .venv present; never read it as a content verdict. Never repoint either assertion to obtain admission (Decision 181).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Diff-relative against origin/main, so it goes vacuous after merge; validate_verification_registry runs the same
    differential on every added or modified shard in every tier.
