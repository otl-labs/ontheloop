constraints:
- >-
  Hard cut: step-6b-confirmation is not accepted as an alias anywhere; legacy_labels is documentation for reading old
  plans and run ledgers, never an accepted gate value.
- >-
  Historical artefacts are never edited (Decision 177 for Decision bodies; plans, run ledgers, audit prompts, audits
  and existing amendment_log rows are history). Decision 152's Step 6a/6b wording is resolved by legacy_labels, not by
  a DECISIONS.md annotation.
- >-
  No new numbered Decision (Decision 167 routing: a gate-value rename and a process definition are field semantics and
  belong in a contract). No behaviour change: who signs off and what reaches the operator are unchanged.
- >-
  The decision-scout persona name and its decision-scout gate value are unchanged.
- >-
  Prose budgets are never raised: decision-scout skill at most +5 bytes, overseer skill at most +25 bytes; the new
  gate value is 3 bytes shorter than the old, so its renames save bytes.
- >-
  The sweep exclusions are exactly those listed in acceptance criterion 3; never widen them to pass.
- Marketing-facing prose about project alignment belongs only in marketing/ (Decisions 101 and 198), never here.
- >-
  Bracket wording avoids the roadmap-liveness blocking-phrase grammar (docs/contracts/roadmap-liveness.yaml
  leg_c_blocking_phrase_grammar), e.g. no 'before ... completes'.
