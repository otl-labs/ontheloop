schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: project-configuration-homes
intent: >-
  Give every user-set setting exactly one home, chosen by its kind, so a user who runs otl init has one predictable
  place to set the platform's configuration and moving a port to the cloud is an edit to one tracked file (rec-4403).
  Lands the rule as a numbered Decision and the registry as docs/contracts/project-configuration.yaml (the AWS region
  first), guarded by a registered check, as a reference for agents inside and outside this project.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-project-configuration-homes.yaml
phase: >-
  ad_hoc_rec (soft-warn category): rec-4403. No tier_item is claimed and no exit criterion is closed; the plan ADDS
  open criteria c15 and c16 to T4.24 (deferred_post_mvp) and adds no depends_on edge from a live item (Decision 93).
  Freshness gate run against T4.24 (2026-10-17): every criterion c1-c14 open (no silent completion); files_in_scope
  pyproject.toml and LICENSE exist and src/ontheloop/ is marked new; no sibling absorbs config placement (T4.23 c2 and
  T4.27 c10-c11 are cited, not overlapped); related CD.27 is pending (starting allowed, completion gated). Nothing to
  close out.
closes_criteria: []
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Insert Decision NNN verbatim (execution step 3) above the newest entry, and append the two dated Amended-by
      blockquotes to Decisions 212 and 211 (execution step 3).
  - file: docs/contracts/project-configuration.yaml
    action: Create
    purpose: >-
      The registry (execution step 4, verbatim): a ratified Class D contract, ten setting rows, kinds, homes,
      precedence, not-configuration classes and field semantics.
  - file: scripts/checks/contracts/validate_project_configuration.py
    action: Create
    purpose: Schema and cross-reference evaluator for the registry (execution step 6).
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: Register validate_project_configuration as a pre=True Entry with diff-gated pre_globs and full_segment (execution step 7).
  - file: tests/checks/contracts/test_validate_project_configuration.py
    action: Create
    purpose: Mirror test, real-tree positive plus one negative fixture per rule (execution step 8).
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: "Classify the new check: validate_project_configuration: schema_drift, beside validate_ports_contract."
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Add the project-configuration route (topic equals the contract subject) and its one-line amendment_log entry. The
      file is limited to 500 effective lines (contracts class, Decision 166) and measured 489 on main after #1543, so the
      addition fits; no raise.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: Add T4.24 exit criteria c15 and c16 verbatim (execution step 5) and NNN to T4.24 related_decisions.
  - file: scripts/CLAUDE.md
    action: Modify
    purpose: Append the approved "User-set settings" section (execution step 5), the contract's ambient trigger.
  - file: docs/plans/PLAN-project-configuration-homes.yaml
    action: Create
    purpose: This plan artefact.
bundled_recommendations: [rec-4403]
followon_recs: [rec-4410]
infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition:
    scripts.lambda_manifest.compute_affected_artifacts(<this plan's scope>) returns {'data-pipeline':
    ['docs/ROADMAP-PLATFORM.yaml']} because the roadmap is a packaged asset of the active data-pipeline artifact
    (src/lambdas/data-pipeline/manifest.yaml). No build, deploy or smoke-test is owed: the edit is asset-only criteria and
    related_decisions bookkeeping with no packaged code change, and the asset refreshes with the artifact's next governed
    deploy. V2 stands, following PLAN-brownfield-adoption-port-conformance.yaml and PLAN-showcase-product-and-rsi-proof.yaml.
    No other scope file is Lambda-packaged; no .tf file is in scope.
acceptance_criteria:
  - >-
    Decision NNN is in docs/DECISIONS.md with the verbatim approved text of execution step 3 (only NNN and DATE
    substituted), under the 6144-byte per-entry cap, conformant to decision-entry.yaml, its reversal-conditions stanza
    parsing; Decisions 212 and 211 carry the dated Amended-by blockquotes; docs/decisions-index.json is regenerated and
    fresh (VP steps 8, 9 and 12).
  - >-
    docs/contracts/project-configuration.yaml exists with the verbatim text of execution step 4 as a ratified Class D
    contract whose evaluator, validate_project_configuration, resolves and passes on the real tree; the population gate
    passes and the file-router carries the project-configuration route (VP steps 2, 6, 7 and 12).
  - >-
    validate_project_configuration rejects every defect class execution step 6 lists, each by its own negative fixture,
    and passes the real contract (VP steps 3, 4 and 5).
  - >-
    T4.24 carries c15 and c16 verbatim, both open, with NNN in related_decisions and its status unchanged; scripts/CLAUDE.md
    carries the approved section and stays within its S2 budget with no raise (VP steps 10, 11 and 12).
  - >-
    The fast and full tiers pass; after the squash-merge rec-4403 closes through the Resolves trailer, rec-4410 stays
    open and dec-NNN reaches ops_decisions (VP steps 13-16).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Precondition: the branch is on current main, PLAN-project-region-single-source (rec-4067) is merged and its build
      has landed the files the region row names, and the registry does not exist yet.
    command: >-
      git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && test -f docs/plans/PLAN-project-region-single-source.yaml && test -f config/aws-region && test -f .github/actions/aws-region/action.yml && grep -rqs "validate_project_region" scripts/checks && grep -q config/aws-region terraform/bootstrap/CLAUDE.md && grep -q config/aws-region terraform/github/CLAUDE.md && test ! -e docs/contracts/project-configuration.yaml && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      A missing region file, action or check means rec-4067's build has not merged: stop and wait (the handoff's start
      condition). If it merged under different names, stop and ask the coordinator to route a plan amendment to the
      planning thread; never rename the region row's paths on your own.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: Prove the registry exists and its own evaluator passes on the real tree.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_project_configuration import validate_project_configuration as v; f=[]; v(f); assert not f, f; print('PROJECT_CONFIGURATION_OK')"
    expected: Exit 0 with the PASS line and the marker. Red before because the module does not exist (ModuleNotFoundError, exit 1).
    fix_if: >-
      A printed finding names the row and rule; fix the row only where the approved text allows (it does not: the
      contract is verbatim), otherwise fix the rule's reading of the field, never by loosening a rule.
    hermetic: true
    expected_literals:
      - PROJECT_CONFIGURATION_OK
    graduation: waive
    graduation_waiver_reason: >-
      validate_project_configuration is itself registered (execution step 7) and runs on every --pre diff touching its
      pre_globs and on every full run; a shard re-running it would re-assert what the registered gate owns.
  - step: 3
    phase: pre-deploy
    action: Prove the defining rule, that a secret or private row may never name a tracked or in-tree home, fails a fixture that breaks it.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_project_configuration.py::test_rejects_secret_row_in_tracked_home -q
    expected: Exit 0, one node passes. Red before because the node does not exist (pytest exit 4).
    fix_if: A failure means the kind_homes rule does not reject platform_file or clone_file for a secret row; fix the rule.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: project-configuration-secret-never-tracked
  - step: 4
    phase: pre-deploy
    action: Prove the ambient-trigger rule fails when scripts/CLAUDE.md stops naming the contract.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_project_configuration.py::test_rejects_ambient_trigger_without_contract_pointer -q
    expected: Exit 0, one node passes. Red before because the node does not exist (pytest exit 4).
    fix_if: A failure means the trigger rule reads the wrong file or string; the real-tree presence is also asserted by step 2.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: project-configuration-ambient-trigger
  - step: 5
    phase: pre-deploy
    action: Run the whole mirror test module and the contracts manifest test.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_project_configuration.py tests/checks/contracts/test__manifest.py -q
    expected: Exit 0; every negative fixture in execution step 8 fails its rule and the real tree passes; the manifest test resolves the new Entry.
    fix_if: A negative fixture that passes means its rule is missing or too loose; a manifest failure means the Entry literal is malformed.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A whole-file re-run of test files this plan creates or modifies (vp-red-before.yaml hermetic_authoring rule v);
      the fast tier's pytest diff runs them on every PR, and steps 3 and 4 graduate the two defining nodes.
  - step: 6
    phase: pre-deploy
    action: >-
      Prove the population gate accepts the new Class D file: ratified with ratified_via, a resolving check evaluator,
      a subject equal to the router topic, no smuggled shape, ratchet pins unchanged.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v; f=[]; v(f); assert not f, f; print('CONTRACT_DRIFT_OK')"
    expected: Exit 0 and the marker; the declared bucket is one higher than on origin/main and grandfathered / status_active are unchanged.
    fix_if: >-
      "evaluator does not resolve" means the check module lacks the executable project-configuration.yaml literal or is
      not sequenced; a topic mismatch means the router topic is not project-configuration; a shape-smuggling failure
      means a leaf mapping carries two Class A descriptor keys, which the verbatim contract does not.
    hermetic: true
    expected_literals:
      - CONTRACT_DRIFT_OK
    graduation: waive
    graduation_waiver_reason: validate_contract_drift is registered in both tiers and evaluates every docs/contracts file on every run; a per-file shard would re-assert what it owns.
  - step: 7
    phase: pre-deploy
    action: Prove the file-router carries the route whose topic is the contract subject.
    command: >-
      grep -n -x '  - topic: project-configuration' docs/contracts/file-router.yaml
    expected: One matching line. Red before because grep exits 1.
    fix_if: No match means the route is missing or its topic differs from the subject.
    hermetic: true
    expected_literals:
      - "topic: project-configuration"
    graduation: graduate
    graduation_check_id: router-route-project-configuration
  - step: 8
    phase: pre-deploy
    action: Prove the new Decision exists, found by its title so the number never matters, and its reversal-conditions stanza parses.
    command: >-
      bin/venv-python -c "import re; from pathlib import Path; n=int(re.search(r'^## Decision (\\d+): One home per kind of user-set configuration', Path('docs/DECISIONS.md').read_text(encoding='utf-8'), re.M).group(1)); import scripts.preflight.decision_conditions as dc; r={x.decision_id: x for x in dc.evaluate()}; assert n in r and r[n].state != 'MALFORMED' and r[n].error is None, r.get(n); print('STANZA_OK')"
    expected: Exit 0 and the marker. Red before because the title search finds nothing (AttributeError on None, exit 1).
    fix_if: MALFORMED means the reversal-conditions fence or a condition's id/kind is malformed; copy execution step 3 verbatim.
    hermetic: true
    expected_literals:
      - STANZA_OK
    graduation: graduate
    graduation_check_id: decision-config-homes-stanza-parses
  - step: 9
    phase: pre-deploy
    action: >-
      Run the decision-corpus gates the entry and the two annotations touch: entry conformance (envelope, significance,
      markers), the per-entry size cap, supersession annotations on 211 and 212, and index freshness.
    command: >-
      bin/venv-python -c "from scripts.checks.decisions.validate_decision_entry_conformance import validate_decision_entry_conformance as a; from scripts.checks.decisions.validate_decisions_size import validate_decisions_size as b; from scripts.checks.decisions.validate_supersession_annotations import validate_supersession_annotations as c; from scripts.checks.decisions.validate_decisions_index_freshness import validate_decisions_index_freshness as d; f=[]; [g(f) for g in (a, b, c, d)]; assert not f, f; print('DECISION_GATES_OK')"
    expected: >-
      Exit 0 and the marker; no per-entry cap failure (the entry measured 6,041 bytes at plan time with NNN and DATE as
      placeholders, about 6,054 after substitution, cap 6,144); a WARN-only amendment-delta line for Decision 212 is
      expected and accepted (212 measures 6,105 bytes on main; the Amended-by note takes it over the cap, and rec-3243's
      accretion signal never fails).
    fix_if: A size failure means wording was added -- restore the verbatim text; an index failure means bin/venv-python -m scripts.decisions_index --write was not re-run.
    hermetic: true
    expected_literals:
      - DECISION_GATES_OK
    graduation: waive
    graduation_waiver_reason: All four are registered decision-corpus checks that run on every --pre or full invocation; step 8 graduates the one property specific to this entry.
  - step: 10
    phase: pre-deploy
    action: Prove T4.24 carries c15 and c16 with their text and the Decision in related_decisions (durable properties only, never lifecycle status).
    command: >-
      bin/venv-python -c "import re; from pathlib import Path; n=int(re.search(r'^## Decision (\\d+): One home per kind of user-set configuration', Path('docs/DECISIONS.md').read_text(encoding='utf-8'), re.M).group(1)); from scripts.platform_roadmap_state import load; t={i.id: i for i in load(Path('docs/ROADMAP-PLATFORM.yaml')).tier_items}['T4.24']; c={x.id: x for x in t.exit_criteria}; assert 'no clouds block' in c['c15'].text and 'project-configuration.yaml' in c['c15'].text, c['c15']; assert 'config/aws-region' in c['c16'].text, c['c16']; assert n in t.related_decisions, t.related_decisions; print('ROADMAP_CRITERIA_OK')"
    expected: Exit 0 and the marker. Red before because the Decision title search finds nothing and c15 does not exist (exit 1).
    fix_if: A KeyError names the missing criterion; an AssertionError names the phrase or the related_decisions entry.
    hermetic: true
    expected_literals:
      - ROADMAP_CRITERIA_OK
    graduation: graduate
    graduation_check_id: roadmap-t4-24-config-homes-criteria
  - step: 11
    phase: pre-deploy
    action: Prove scripts/CLAUDE.md names the contract and the prose budgets hold with no raise.
    command: >-
      grep -q -F 'docs/contracts/project-configuration.yaml' scripts/CLAUDE.md && bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f); assert not f, f; print('PROSE_OK')"
    expected: Exit 0 and the marker; scripts/CLAUDE.md at about 2,961 of its 2,984-byte budget.
    fix_if: A budget failure means the section grew past the approved text; restore it verbatim (no raise is authorised).
    hermetic: true
    expected_literals:
      - PROSE_OK
    graduation: waive
    graduation_waiver_reason: validate_prose_limits is registered in both tiers, and step 4 graduates the trigger rule that keeps the pointer present.
  - step: 12
    phase: pre-deploy
    action: >-
      Prove every APPROVED TEXT block landed verbatim: the Decision, both Amended-by notes, the contract, the two T4.24
      criteria and the scripts/CLAUDE.md section, each with only NNN and DATE substituted (read from the entry itself).
    command: >-
      bin/venv-python -c "import re, yaml, textwrap; from pathlib import Path; R=lambda f: Path(f).read_text(encoding='utf-8'); D=R('docs/DECISIONS.md'); m=re.search(r'^## Decision (\d+): One home per kind of user-set configuration', D, re.M); n=m.group(1); d=re.search(r'decided_date: .(\d{4}-\d\d-\d\d).', D[m.start():]).group(1); S=yaml.safe_load(R('docs/plans/PLAN-project-configuration-homes.yaml'))['execution_steps']; A=chr(10)*2; U=lambda t: textwrap.dedent(t).strip(chr(10)).replace('NNN', n).replace('DATE', d); G=S[2].split(A); P=[(U(S[2].split('(already inside the text below):'+chr(10), 1)[1].split(A+'Then append', 1)[0]), D), (U(G[-4]), D), (U(G[-2]), D), (U(S[3].split('(NNN and DATE substituted):'+chr(10), 1)[1]), R('docs/contracts/project-configuration.yaml')), (U(S[4].split('after one blank line:'+chr(10), 1)[1]), R('scripts/CLAUDE.md'))]; bad=[i for i, (t, f) in enumerate(P) if t not in f]; from scripts.platform_roadmap_state import load; c={x.id: x.text for x in {i.id: i for i in load(Path('docs/ROADMAP-PLATFORM.yaml')).tier_items}['T4.24'].exit_criteria}; q=[re.search('id: ' + k + chr(10) + r'\s+text: .(.*).' + chr(10), S[4]).group(1).replace('NNN', n) for k in ('c15', 'c16')]; assert not bad and [c.get('c15'), c.get('c16')] == q, (bad, q); print('APPROVED_TEXT_OK', n)"
    expected: Exit 0 and the marker with the Decision number. Red before because the Decision title search finds nothing (exit 1).
    fix_if: >-
      The printed indexes name the blocks that differ (0 Decision, 1 note on 212, 2 note on 211, 3 contract, 4
      scripts/CLAUDE.md); a criteria mismatch prints the expected c15/c16 text. Restore the approved wording; any change
      beyond NNN and DATE needs Benjamin's word.
    hermetic: true
    expected_literals:
      - APPROVED_TEXT_OK
    graduation: waive
    graduation_waiver_reason: >-
      A one-time landing proof that reads this plan file, which is archived later; once landed, steps 8 and 10 and the
      registered checks guard the durable properties.
  - step: 13
    phase: pre-deploy
    action: Run the fast tier.
    command: >-
      bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: >-
      Fix the named check at its cause; never weaken a rule or skip a test. validate_structural_size_limits on
      docs/contracts/file-router.yaml means the file grew past 500 effective lines since planning; stop and ask for a
      plan amendment rather than raising the limit. A detect-secrets Secret Keyword hit on the contract's kinds.secret
      line means the baseline was not regenerated (the execution step before the VP run).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion); the tier is itself the standing guard and runs on every PR.
  - step: 14
    phase: pre-deploy
    action: Run the full tier before handoff.
    command: >-
      bin/venv-python -m scripts.validate
    expected: Exit 0.
    fix_if: Fix the named check at its cause; never weaken a rule or skip a test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion); the full tier runs post-merge on main as the standing guard.
  - step: 15
    phase: post-deploy
    action: After the squash-merge, prove rec-4403 closed through the Resolves trailer and rec-4410 is still open.
    command: >-
      bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as g; a, b = g('rec-4403'), g('rec-4410'); assert a['status'] == 'closed', a['status']; assert b['status'] == 'open', b['status']; print('RECS_OK')"
    expected: Exit 0 and the marker.
    fix_if: >-
      rec-4403 still open means the squash commit body lacked "Resolves: rec-4403" or the closure job failed; read the ci.yml closure job's log before closing it by update_rec.
    hermetic: false
  - step: 16
    phase: post-deploy
    action: ETL the Decision to the warehouse and prove its row exists.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --backfill-decisions-md && bin/venv-python -c "import re; from pathlib import Path; n=int(re.search(r'^## Decision (\\d+): One home per kind of user-set configuration', Path('docs/DECISIONS.md').read_text(encoding='utf-8'), re.M).group(1)); from scripts.ops_portal.decisions import _fetch_decision_from_reader as g; assert g(f'dec-{n}'), n; print('DECISION_ETL_OK', n)"
    expected: Exit 0 and the marker with the Decision number.
    fix_if: A missing row after a clean backfill means the entry did not parse -- re-run VP step 9 against main.
    hermetic: false
test_obligations:
  - source: scripts/checks/contracts/validate_project_configuration.py
    behavior: >-
      Every rule in execution step 6 rejects its defect class and the real registry passes; the defining rule is that a
      secret or private row never names a tracked or in-tree home.
    verification_step: 3
    test_selector: tests/checks/contracts/test_validate_project_configuration.py::test_rejects_secret_row_in_tracked_home
    red_green_expectation: Red before -- the test module and the check do not exist (pytest exit 4). Green after.
  - source: scripts/checks/contracts/_manifest.py
    behavior: The new Entry resolves to the registered validate_project_configuration callable and sits in both tier sequences.
    verification_step: 5
    test_selector: tests/checks/contracts/test_validate_project_configuration.py::test_entry_resolves_and_is_sequenced
    red_green_expectation: Red before -- the node does not exist (pytest exit 4), and with the module but no Entry registry.resolve raises UnknownCheckError. Green after.
  - source: docs/contracts/project-configuration.yaml
    behavior: The real registry satisfies every validate_project_configuration rule.
    verification_step: 2
    command: >-
      from scripts.checks.contracts.validate_project_configuration import validate_project_configuration as v
    red_green_expectation: Red before -- the module and contract are absent (exit 1). Green after; the registered check is the standing guard.
  - source: docs/contracts/file-router.yaml
    behavior: The router carries the project-configuration route equal to the contract subject.
    verification_step: 7
    command: >-
      grep -n -x '  - topic: project-configuration' docs/contracts/file-router.yaml
    red_green_expectation: Red before -- grep exits 1. Green after; graduated as router-route-project-configuration.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: T4.24 c15 and c16 exist open with their text, and the Decision is in related_decisions.
    verification_step: 10
    command: >-
      from scripts.platform_roadmap_state import load
    red_green_expectation: Red before -- the Decision title search finds nothing (exit 1). Green after; graduated as roadmap-t4-24-config-homes-criteria.
  - source: config/ci_rca_taxonomy.yaml
    behavior: The new check is classified under schema_drift.
    verification_step: 13
    command: >-
      bin/venv-python -m scripts.validate --pre
    waiver_reason: >-
      Pure registry data: validate_ci_rca_taxonomy (registered, --pre) already fails any registered check missing from
      function_to_category, so a dedicated test would duplicate that standing guard.
constraints:
  - "Decision 67: IMPLEMENTATION only."
  - "Decision 86: rationale in the Decision, field semantics in the contract, forward work in T4.24 criteria and rec-4410; no new prose doc."
  - >-
    Approved text (Benjamin, 2026-10-17 "write the plan", message cmsg_01LtdKEiB2ddSuSRXGr2tFnCBT2ZF5oc3kCQFqzH1VcYs1, on
    the presentation and proposed-text.md revision 3 in /mnt/project-files/rec-4403/): every APPROVED TEXT block in
    execution_steps lands verbatim. Allowed variance: NNN (the next free Decision number at build time, three digits, the
    same everywhere it appears), DATE (the merge date, YYYY-MM-DD). Any other wording change needs Benjamin's word, except
    a meaning-preserving correction under his 2026-10-17 rule (note it in the thread and the PR).
  - >-
    Numbering race: at build time re-check the highest '## Decision NNN:' header and any approved, unbuilt plan that
    reserves a number (PLAN-platform-iam-personal-release reserves 219); take the next free number; re-check before merge.
  - "Decision 128: no SLOC budget raise; the new check stays under 500 SLOC (if it would not, decompose it). No prose budget raise."
  - >-
    Decision 84 Single Portal Invariant: recs and decisions move only through scripts.ops_data_portal; never edit
    logs/. rec-4403 closes by the squash-merge "Resolves: rec-4403" trailer (pass the PR body as the commit message).
  - "Decision 101: the repository is public; the contract names variables and paths only, never a value, account id or ARN."
  - >-
    implement-scope-boundary.yaml: graduated-step shards, docs/decisions-index.json and .secrets.baseline (its
    secrets_baseline_regeneration row; docs/ROADMAP-PLATFORM.yaml is a results key) are permitted derived companions;
    if scripts.roadmap.plan_obligations names any other companion not in scope, STOP and ask for a plan amendment.
    config/agent/fast_tier/module_costs.json is generated (Decision 208), never hand-edited.
  - "No rescue agents or workaround loops (Decision 55); a failing gate is fixed at its cause, never by weakening a rule."
context:
  - "rec-4403 (Benjamin, 2026-10-17, from the Plan rec-4067 thread): one home per kind of user-set configuration for otl init; local first, a cloud adapter is a change to the user default."
