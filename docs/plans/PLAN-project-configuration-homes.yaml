    And after Decision 211's **Related:** line, separated by a blank line:

      > **Amended by Decision NNN (DATE):** Clause 5's gitignored `.ontheloop/` also holds `.ontheloop/config.yaml`, one clone's machine settings (Decision NNN clause 2); it holds no secret or private value.

