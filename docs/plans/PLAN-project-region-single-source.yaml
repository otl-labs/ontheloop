- file: scripts/checks/ci_guards/validate_project_region.py
  action: Create
  purpose: 'Registered fast-tier check, filesystem-only (Decision 208). Rules: (1) config/aws-region is one valid region id;
    (2) no AWS region or availability-zone id anywhere in the raw text of any file under .github/ (a filesystem walk, so tmp-tree
    red cases need no git), comments included (region-agnostic: (?<![\w-])(af|ap|ca|cn|eu|il|me|mx|sa|us|us-gov)-(central|north|south|east|west|northeast|southeast|northwest|southwest)-\d[a-z]?(?![\w-]),
    so the Neon id aws-eu-west-2 is not matched); (3) no such id in the raw text, comments included, of terraform/**/*.tf
    or *.hcl except the default of variable "aws_region" in terraform/bootstrap/variables.tf and terraform/personal/variables.tf,
    each of which must equal config/aws-region; no backend "s3" block or backend*.hcl sets region; (4) every configure-aws-credentials
    step''s aws-region is ${{ env.AWS_REGION }} with an earlier ./.github/actions/aws-region step in the same job whose most
    recent preceding checkout (actions/checkout at any version or pinned sha) has neither ref nor path (the workflow''s own
    commit, never an older tree), or ${{ needs.<job>.outputs.aws_region }} where that job is in needs and binds aws_region
    to a step using the action; (5) no workflow, job or step env sets AWS_REGION or AWS_DEFAULT_REGION. Failure text names
    file, job and step, never a value beyond the region id. Declares examined() with the number of files and sign-in steps
    scanned (Decision 170). Under 500 SLOC; split into a helper module if it grows.'
- file: scripts/checks/ci_guards/_manifest.py
  action: Modify
  purpose: 'One Entry(name="validate_project_region", module="scripts.checks.ci_guards.validate_project_region", attr="validate_project_region",
    pre=True, pre_globs=(".github/**", "terraform/**", "config/aws-region", "scripts/checks/ci_guards/validate_project_region.py",
    "scripts/checks/_common.py", "scripts/checks/registry.py", ...), full_segment="full_after_lint") (Decision 169 bare literals).
    The pre_globs tuple is a minimum: add every module the check imports (for example _workflow_shell_bodies.py, _marker_guard.py,
    scripts/decisions_md.py if reused) so validate_pre_glob_closure passes.'
