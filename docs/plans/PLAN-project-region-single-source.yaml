acceptance_criteria:
- Within .github/ (workflows and actions) and terraform/ HCL, config/aws-region is the only home of the project region apart
  from the two aws_region variable defaults, which validate_project_region pins equal to it; every other surface (Python,
  config files, runbook prose, the Neon id) is rec-4404's declared residual.
- No workflow or composite action under .github/ contains an AWS region id in any scalar or comment; every configure-aws-credentials
  step takes aws-region from the aws-region action's AWS_REGION or reconcile's resolve-target output; no env entry sets AWS_REGION
  or AWS_DEFAULT_REGION.
- The terraform/bootstrap and terraform/github backend blocks and terraform/personal/backend-sandbox.hcl name no region; CI
  inits read AWS_REGION from the sign-in and hand-run inits pass -backend-config region from config/aws-region.
- validate_project_region is registered in both tiers and fails each violation class on a red tree.
- reconcile.yml and terraform-apply-sandbox.yml stay within their structural size ceilings (536 and 550) with no raise.
- 'The approved Decision 202 Update line (date only varies) and the runbook and contract texts as amended 2026-10-18 land
  verbatim: the approved init commands and state_location unchanged, the approved re-init note relocated to the cc-web contract''s
  backend_region with pointers in both runbooks, and three duplicate or dead passages deleted to fit the prose budgets.'
- The bootstrap plan at the PR head shows no changes with the region from config/aws-region only; the PR's CI, the merge's
  push runs and the first runs of the four step-13 schedules are green; every other edited workflow is step 13's declared
  residual.
- rec-4067 closes through its strengthened acceptance.
