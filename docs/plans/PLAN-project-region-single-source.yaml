  effective lines (scripts.checks.structural._classify.effective_lines). If the first two moved from 534 / 547, STOP and send
  the planning thread the numbers (the scoped shapes assume them).
- Write the red tests first (tests/checks/ci_guards/test_validate_project_region.py, tests/test_aws_region_action.py, and
  the new golden replay workflow assertions) and confirm each fails on the unchanged tree for the stated reason.
- Create config/aws-region and .github/actions/aws-region (action.yml, resolve.sh) as scoped; step 2 green except the build-ducklake-artifacts
  wiring node.
- Create validate_project_region, its manifest Entry and its taxonomy row; step 1 green except test_real_tree_passes.
- Edit the 19 workflows and build-ducklake-artifacts/action.yml to the scoped shapes (ci-rca's and telemetry-golden-replay's
  default-ref checkout first); update the liveness test's anchors and the golden replay test's checkout selector; never write
  a region id in a comment.
- Edit the three backends and the neon_region_id description; terraform fmt.
- 'Land the texts exactly as the scope rows give them: the Decision 202 Update paragraph (date = the planned merge date; re-date
  if the merge slips), the two CLAUDE.md edits with their offset deletions, the cc-web contract (state_location, backend_region,
  referenced_repo_paths, amendment_log) and the bootstrap prose-budget ratchet; regenerate docs/decisions-index.json.'
- Run VP steps 1-3, 5 and 6 and the fast tier (with and without AWS_REGION / AWS_DEFAULT_REGION set). Only once step 3 is
  green on the finished tree, strengthen rec-4067's acceptance to step 3's exact command with one update_rec call after get_rec_write_guidance()
  (Decision 66), stating why (the old first clause was vacuous; Decision 181 allows strengthening only).
- 'Code review via a fresh code-review subagent; fix every blocking finding and re-run steps 1-3, 5 and 6. weakening_dispositions
  already records the pin-test rename: rename exactly as scoped, and copy only candidates not already recorded (a duplicate
  or a stale entry fails validate_weakening_dispositions).'
- 'CLOSURE -- separate facts, in order (a)-(e) (implement skill Commit Flows; docs/contracts/git-ops.yaml), each reported
  on its own. (a) READINESS: bin/venv-python -m scripts.session.github_readiness (unknown is never PASS). (b) Set implementation_declared
  true, commit, git fetch origin main and git rebase origin/main (STOP on conflict; re-check the size ceilings after a rebase).
  (c) VP step 4 (fast tier with the CI region env, then the full tier) on the committed, rebased, clean tree, then bin/venv-python
  -m scripts.checks.validation_result --verify-head. (d) Write a scratchpad JSON holding exactly the scripts.session.postflight_evidence.CATEGORIES
  keys, then bin/venv-python -m scripts.session.postflight --evidence that file. (e) Push, open the PR with Resolves: rec-4067
  in the body, request Benjamin''s review (code owner), subscribe to its activity.'
- At the CI-green head run steps 7-10 and post the counts-only gate line with $PR_HEAD_SHA on the PR; confirm step 11 via
  MCP. A new head re-runs 7-11.
- 'Before merging, tell the coordinator that this build and #1534 both edit terraform/github/CLAUDE.md (clean merge, 5238
  bytes stacked against the 5253 budget, either order), and send it the list of every open PR, and every plan not yet built
  (no feat commit for its slug on main), whose commands init terraform/bootstrap, terraform/github or terraform/personal with
  no region source (at planning: the three in context), so each is sequenced before this merge or patched to pass -backend-config
  region; merge only once the coordinator has acknowledged. Then merge (squash, with an explicit commit_message whose trailer
  block reads Resolves: rec-4067) only on code review PROCEED, green CI, Benjamin''s code-owner approval and the posted gate
  evidence.'
