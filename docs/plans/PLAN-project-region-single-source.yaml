- step: 6
  phase: pre-deploy
  action: 'The approved texts landed verbatim (Decision 202: only the date varies; the runbook texts and the two contract
    texts, state_location and the relocated backend_region: no variance beyond YAML folding).'
  command: |-
    PYTHONPATH=. bin/venv-python - <<'EOF'
    import re, sys, yaml
    from pathlib import Path
    plan = yaml.safe_load(Path("docs/plans/PLAN-project-region-single-source.yaml").read_text())
    rows = {r["file"]: r["purpose"] for r in plan["scope"]}
    norm = lambda x: " ".join(x.split())
    line = re.sub(r"^>\s*", "", rows["docs/DECISIONS.md"].split("Decision 177 blockquote_update form): ", 1)[1].strip())
    pat = re.escape(norm(line)).replace(re.escape("(DATE)"), r"\(\d{4}-\d{2}-\d{2}\)")
    dec = Path("docs/DECISIONS.md").read_text()
    paras = [norm(" ".join(l[1:].strip() for l in p.splitlines())) for p in re.split(r"\n>\s*\n|\n\n", dec) if p.startswith("> **Update (")]
    d_ok = sum(1 for p in paras if re.fullmatch(pat, p)) == 1
    boot = rows["terraform/bootstrap/CLAUDE.md"].split("no variance):\n", 1)[1]
    gh = rows["terraform/github/CLAUDE.md"].split("no variance):\n", 1)[1]
    cc = rows["docs/contracts/terraform-cc-web-operations.yaml"].split("may vary): ", 1)[1].split(" Also: ", 1)[0]
    br = rows["docs/contracts/terraform-cc-web-operations.yaml"].split("RELOCATED TEXT (verbatim, folded-scalar wrapping may vary): ", 1)[1].split(" End of relocated text.", 1)[0]
    b_ok = norm(boot) in norm(Path("terraform/bootstrap/CLAUDE.md").read_text())
    g_ok = norm(gh) in norm(Path("terraform/github/CLAUDE.md").read_text())
    c = yaml.safe_load(Path("docs/contracts/terraform-cc-web-operations.yaml").read_text())
    c_ok = norm(cc) == norm(c["tfvars_and_remote_state_recovery"]["state_location"]) and norm(br) == norm((c.get("provider_init_and_mirror") or {}).get("backend_region", ""))
    bt = Path("terraform/bootstrap/CLAUDE.md").read_text()
    gt = Path("terraform/github/CLAUDE.md").read_text()
    o_ok = "ACCOUNT_ID" not in bt and "The bootstrap S3 state bucket must exist" not in bt and "The backend block names no region" not in bt and "**NEVER auto-apply.**" not in gt and "## NEVER auto-apply this module" in gt and "initialised before rec-4067" not in gt
    bud = yaml.safe_load(Path("config/prose_budgets.yaml").read_text())["S2"]
    p_ok = bud["terraform/bootstrap/CLAUDE.md"] == len(bt.encode()) and len(gt.encode()) <= bud["terraform/github/CLAUDE.md"]
    print("decision", d_ok, "bootstrap", b_ok, "github", g_ok, "contract", c_ok, "offsets", o_ok, "budgets", p_ok)
    sys.exit(0 if d_ok and b_ok and g_ok and c_ok and o_ok and p_ok else 1)
    EOF
  expected: Exit 0 and "decision True bootstrap True github True contract True offsets True budgets True" printed.
  fix_if: 'A False names the text that drifted: restore it verbatim from the scope row (offsets False: a deleted passage came
    back or the github never-auto-apply section was lost; budgets False: ratchet the bootstrap budget to the file''s bytes,
    or the github file outgrew its budget). Never edit the approved text in the plan to match.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: 'A one-time landing check of approved prose, not a standing invariant; Decision 177''s append-only
    convention and code review guard later edits. The two runbook pointers to the contract''s backend_region are prose with
    no standing resolver in the repo (explicit waiver: a later rename of that key is a contract edit that code review sees).'
