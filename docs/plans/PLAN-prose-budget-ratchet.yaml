schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: prose-budget-ratchet
intent: >-
  Make the ambient-prose byte budgets ratchet for real: a PR that shrinks a gated prose file must lower its budget in the
  same PR, so budgets stay at measured size, compaction gains are locked in, and the two graduated equality guards on
  config/prose_budgets.yaml stop rotting red on main (rec-4779).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-prose-budget-ratchet.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-4779,
  surfaced by the Project Review plan A critique rounds.
scope:
  - file: scripts/checks/prose/prose_limits.py
    action: Modify
    purpose: >-
      An entry measured below its budget FAILS (it was a non-blocking advisory), naming the exact reseed line and the
      sanction row; over-budget and unregistered branches unchanged; the advisory list and its print block go. The check
      declares registry.examined(n, unit="prose_surfaces") (Decision 170 touch-it-fix-it; execution_steps[6]).
  - file: scripts/preflight/prose_context.py
    action: Modify
    purpose: >-
      _resolve_s1_root_load_set takes an optional root (default _common.ROOT), so the scope-boundary trigger reuses the
      one @-import walk at a fixture root. No other behaviour change.
  - file: scripts/checks/verification/validate_scope_boundary.py
    action: Modify
    purpose: >-
      New trigger kind scope_file_is_prose_gated: fires when declared scope meets the S1 load set or an S2/S4/S8 path key
      of trigger.registry_path, and sanctions the registry only when its base-to-working diff is decrease-only (every
      entry value <= base, every other byte identical). Inert when the plan declares the registry itself; otherwise it
      prints why it did not sanction and the existing out-of-scope STOP reports the path.
  - file: docs/contracts/implement-scope-boundary.yaml
    action: Modify
    purpose: >-
      The prose_budgets_ratchet_down sanction row, one amendment_log entry and the re-armed count trigger, exact text in
      execution_steps[3].
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Header ratchet paragraph replaced (exact text in execution_steps[4]); every entry reseeded to its measured bytes,
      S1 included, its plan-D comment dropped (operator ruling, see context).
  - file: tests/checks/prose/test_prose_limits.py
    action: Modify
    purpose: >-
      New class TestUnderBudgetFails; the four under-budget-is-advisory tests flip to the failing polarity;
      TestProseRatchetAdvisoryEmission is deleted (its claim is re-decided); every background S1 fixture budget is set to
      its measured bytes and every over-budget/unregistered assertion names its own surface (execution_steps[1]); new
      class TestExaminedDeclaration (execution_steps[6]).
  - file: config/agent/verification_registry/entries/prose-ratchet-advisory-emitted-below-budget.yaml
    action: Delete
    purpose: >-
      Retired by git mv into entries/deprecated/ (a 100% rename, content untouched): its graduated node pins the
      advisory this plan removes, by operator ruling (context). Its replacement is VP step 1's graduated row.
  - file: config/agent/verification_registry/entries/deprecated/prose-ratchet-advisory-emitted-below-budget.yaml
    action: Create
    purpose: The retired shard, byte-identical (the rename target).
  - file: tests/checks/verification/validate_scope_boundary/test_prose_budgets_ratchet_row.py
    action: Create
    purpose: TestProseBudgetsRatchetRow, the trigger kind's arms (listed in execution_steps[2]) plus the real contract row shape.
  - file: config/check_accounting_baseline.yaml
    action: Modify
    purpose: >-
      Strike the "- validate_prose_limits" entry, a shrink of the Decision 170 grandfather roster: once the check declares
      examined(), TestRosterCarriesNoFullyDeclaringModule fails until it leaves the roster. No other line changes.
bundled_recommendations:
  - rec-4779
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - validate_prose_limits fails a registered surface measured below its budget, and the failure names the surface and the exact value to reseed.
  - A resolved plan whose declared scope contains a prose-gated surface may lower lines in config/prose_budgets.yaml without declaring it; any other undeclared edit to that file (a raise, a comment, a new key) still STOPs as out of scope, and the row is inert for a plan that declares the registry itself.
  - The graduated shard prose-ratchet-advisory-emitted-below-budget is retired into entries/deprecated/, and no live test_selector shard names a test node that no longer exists in tests/checks/prose/test_prose_limits.py.
  - Every config/prose_budgets.yaml entry equals its measured bytes on the merged tree, and both graduated guards (prose-budgets-s4-entries-equal-measured-and-marker-free, prose-budgets-reseeded-to-measured) pass.
  - docs/contracts/implement-scope-boundary.yaml stays at or under 500 effective lines; validate_scope_boundary.py stays under 500 SLOC.
  - validate_prose_limits declares examined(n, unit="prose_surfaces") on every exit path, n being the surfaces it checked, and config/check_accounting_baseline.yaml no longer lists it.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Under-budget fails, at budget passes, over-budget and unregistered still fail, message names the reseed value.
    command: bin/venv-python -m pytest tests/checks/prose/test_prose_limits.py::TestUnderBudgetFails -q
    expected: exit 0, all tests in the class pass.
    fix_if: A test sees an empty failed list for an under-budget fixture -- the advisory branch survived in _check_entry.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: prose-limits-under-budget-fails
  - step: 2
    phase: pre-deploy
    action: The sanction row's trigger arms.
    command: bin/venv-python -m pytest tests/checks/verification/validate_scope_boundary/test_prose_budgets_ratchet_row.py::TestProseBudgetsRatchetRow -q
    expected: exit 0, all arms pass.
    fix_if: >-
      A raise, a comment edit or a new key passed as sanctioned (the decrease-only diff test is too loose), or a decrease
      with an S1 member in scope STOPs (the S1 walk did not run at the fixture root).
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: scope-boundary-prose-budgets-ratchet-row
  - step: 3
    phase: pre-deploy
    action: Whole-suite re-run of every suite the scope files feed.
    command: >-
      bin/venv-python -m pytest tests/checks/prose/ tests/checks/verification/validate_scope_boundary/
      tests/test_scope_boundary_contract.py tests/test_prose_context.py tests/checks/hygiene/test_validate_check_accounting.py -q
    expected: exit 0.
    fix_if: >-
      A pinned contract test or a prose_context caller broke -- fix the source. A test_prose_limits fixture that fails only
      because its background S1 budget now sits above measured is reseeded to its measured bytes (execution_steps[1]);
      never loosen an assertion. TestRosterCarriesNoFullyDeclaringModule naming validate_prose_limits -- strike its
      config/check_accounting_baseline.yaml line (execution_steps[6]).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file re-run of suites the --pre affected set already selects for these scope files.
  - step: 4
    phase: pre-deploy
    action: The live gate passes on the reseeded tree.
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as v; f=[]; v(f);
      print('PROSE_FAILED', len(f)); raise SystemExit(1 if f else 0)"
    expected: exit 0; no surface reported below or over budget.
    fix_if: A surface reports below budget -- reseed that entry to the printed value (a file changed on main since the reseed).
    hermetic: true
    expected_literals:
      - PROSE_FAILED 0
      - All gated prose surfaces within budget.
    graduation: waive
    graduation_waiver_reason: >-
      Passes on origin/main too (there the advisory never fails), so the admission gate would refuse it as tautological;
      the claim is carried by validate_prose_limits itself, which runs in every --pre.
  - step: 5
    phase: pre-deploy
    action: Both graduated equality guards pass.
    command: >-
      bin/venv-python -c "from scripts import verification_graduation as g;
      ids={'prose-budgets-s4-entries-equal-measured-and-marker-free','prose-budgets-reseeded-to-measured'};
      r={e['check_id']: str(g.materialize_check(e).run().status) for e in g.load_entries() if e['check_id'] in ids};
      print(r); raise SystemExit(0 if len(r)==2 and all(s.endswith('PASS') for s in r.values()) else 1)"
    expected: exit 0; both ids map to PASS.
    fix_if: An id is missing (a shard was renamed or retired) or FAILs (an entry is not at measured bytes).
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: Both claims are already graduated rows; a third row would duplicate them.
  - step: 6
    phase: pre-deploy
    action: Size governance on the two near-cap files.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.checks.structural._classify import effective_lines;
      e=effective_lines(Path('docs/contracts/implement-scope-boundary.yaml').read_text(encoding='utf-8'));
      s=sum(1 for l in Path('scripts/checks/verification/validate_scope_boundary.py').read_text(encoding='utf-8').splitlines()
      if l.strip() and not l.strip().startswith('#')); print('contract', e, 'sloc', s); raise SystemExit(0 if e<=500 and s<=500 else 1)"
    expected: exit 0 (contract 475 effective lines before this plan).
    fix_if: Contract over 500 -- compact the new row and amendment entry, never raise (Decision 166).
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: The structural-size and SLOC gates already run in --pre; this step only pins the plan's own headroom.
  - step: 8
    phase: pre-deploy
    action: No live test_selector shard names a missing test_prose_limits node; the retired shard sits in deprecated/.
    command: >-
      bin/venv-python -c "import subprocess,sys; from pathlib import Path; from scripts import verification_graduation as g;
      n=[e['check_spec']['node_id'] for e in g.load_entries() if e['primitive_slot']=='test_selector'
      and e['check_spec']['node_id'].startswith('tests/checks/prose/test_prose_limits.py')];
      r=subprocess.run([sys.executable,'-m','pytest','--collect-only','-q',*n],capture_output=True,text=True) if n else None;
      d=Path('config/agent/verification_registry/entries/deprecated/prose-ratchet-advisory-emitted-below-budget.yaml').is_file();
      print('NODES', len(n), 'RETIRED', d); raise SystemExit(0 if d and (r is None or r.returncode==0) else 1)"
    expected: exit 0; every node collects and the retired shard exists under deprecated/.
    fix_if: A node fails to collect -- a renamed or deleted test still has a live shard; retire or re-point it only by a reviewed plan amendment.
    hermetic: true
    expected_literals:
      - RETIRED True
    graduation: waive
    graduation_waiver_reason: >-
      A one-time migration claim about this plan's own retirement (the shape rec-3247 warns against graduating); the
      corpus-wide dangling-node guard is rec-4115's.
  - step: 10
    phase: pre-deploy
    action: validate_prose_limits declares the surfaces it examined, on the passing and the failing exit alike.
    command: bin/venv-python -m pytest tests/checks/prose/test_prose_limits.py::TestExaminedDeclaration -q
    expected: exit 0, all tests in the class pass.
    fix_if: >-
      The declaration is None on one exit (examined() sits inside a branch rather than before the final errors branch),
      or its count differs from the _check_entry calls made.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: prose-limits-declares-examined-surfaces
  - step: 9
    phase: pre-deploy
    action: >-
      Commit Flow full tier after the rebase, then HEAD attestation, before each push (handoff_policy).
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The full tier exits 0 and the validation result attests the current HEAD's tree.
    fix_if: Any failure -- fix and rerun the full tier from the start.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-2 carry the
      durable regressions.
  - step: 7
    phase: post-deploy
    action: 'Closure: rec-4779 closed by the Resolves trailer.'
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows,_=fetch_recs_by_ids(make_reader(),['rec-4779']); s={r['id']:r['status'] for r in rows}; print(s);
      assert s=={'rec-4779':'closed'}, s"
    expected: rec-4779 closed.
    fix_if: Open -- read the closure job log; its acceptance is VP step 1's selector.
    hermetic: false
test_obligations:
  - source: scripts/checks/prose/prose_limits.py
    behavior: Under-budget fails with the reseed value; at-budget passes; over-budget and unregistered still fail.
    verification_step: 1
    test_selector: tests/checks/prose/test_prose_limits.py::TestUnderBudgetFails
    red_green_expectation: red before (class absent; under-budget passes), green after.
  - source: scripts/checks/verification/validate_scope_boundary.py
    behavior: scope_file_is_prose_gated sanctions only a decrease-only registry diff, only for a plan with a gated surface in scope.
    verification_step: 2
    test_selector: tests/checks/verification/validate_scope_boundary/test_prose_budgets_ratchet_row.py::TestProseBudgetsRatchetRow
    red_green_expectation: red before (file absent; the kind is unimplemented and fails loudly), green after.
  - source: scripts/preflight/prose_context.py
    behavior: S1 resolver honours an explicit root; default unchanged.
    verification_step: 2
    test_selector: tests/checks/verification/validate_scope_boundary/test_prose_budgets_ratchet_row.py::TestProseBudgetsRatchetRow
    red_green_expectation: red before (an S1-member arm cannot fire at a fixture root), green after.
  - source: docs/contracts/implement-scope-boundary.yaml
    behavior: The row exists with the kind, registry_path and path_template the check reads.
    verification_step: 2
    test_selector: tests/checks/verification/validate_scope_boundary/test_prose_budgets_ratchet_row.py::TestProseBudgetsRatchetRow
    red_green_expectation: red before (row absent), green after.
  - source: config/prose_budgets.yaml
    behavior: Every entry equals measured bytes.
    verification_step: 5
    command: ids={'prose-budgets-s4-entries-equal-measured-and-marker-free','prose-budgets-reseeded-to-measured'}
    red_green_expectation: red before (both guards FAIL on main), green after.
  - source: config/agent/verification_registry/entries/deprecated/prose-ratchet-advisory-emitted-below-budget.yaml
    behavior: The retired shard sits under deprecated/, excluded from the live loader.
    verification_step: 8
    command: entries/deprecated/prose-ratchet-advisory-emitted-below-budget.yaml
    red_green_expectation: red before (file absent; VP step 8 prints RETIRED False), green after.
  - source: scripts/checks/prose/prose_limits.py
    behavior: The check declares examined(n, unit="prose_surfaces") on every exit path.
    verification_step: 10
    test_selector: tests/checks/prose/test_prose_limits.py::TestExaminedDeclaration
    red_green_expectation: red before (class absent; no declaration is made), green after.
  - source: config/check_accounting_baseline.yaml
    behavior: The grandfather roster no longer exempts validate_prose_limits.
    verification_step: 3
    test_selector: tests/checks/hygiene/test_validate_check_accounting.py::TestRosterCarriesNoFullyDeclaringModule
    red_green_expectation: >-
      red with the examined() adoption but without the strike (TestRosterCarriesNoFullyDeclaringModule names
      validate_prose_limits), green with both.
