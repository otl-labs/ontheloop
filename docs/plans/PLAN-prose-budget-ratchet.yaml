pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Rebase onto origin/main. Confirm the critique-severity-convergence build has merged (git log origin/main --
    .claude/skills/planning/SKILL.md shows it); if not, STOP and report -- this build must not land first.
  - >-
    scripts/checks/prose/prose_limits.py: in _check_entry, current_bytes < budget appends to errors:
    "{surface} {path}: {current_bytes} bytes below budget {budget}; lower the entry to {current_bytes} in
    config/prose_budgets.yaml in this PR (the ratchet only goes down; implement-scope-boundary's prose_budgets_ratchet_down
    row sanctions the edit)." Drop the advisories parameter, list and print block (lines 79-83, 124-127 today), and make
    the _RELIEF_VALVE_TEXT comment and the module docstring's relief-valve sentence say every OVER-budget and
    unregistered message carries it. scripts/preflight/
    prose_context.py: _resolve_s1_root_load_set(root: Path | None = None), using root or _common.ROOT throughout.
    tests/checks/prose/test_prose_limits.py: add TestUnderBudgetFails (under-budget fails per surface S1/S2/S4/S8 with
    the reseed value in the message; at budget passes; over-budget and unregistered still fail); flip the four
    under-budget-is-advisory tests; delete TestProseRatchetAdvisoryEmission; set every fixture's background
    root_ambient_load_set to the fixture's measured S1 bytes (10 where CLAUDE.md is "x" * 10); replace each
    len(failed) == 1 assertion with one naming its own surface and branch in the captured output.
  - >-
    scripts/checks/verification/validate_scope_boundary.py: add kind scope_file_is_prose_gated to _row_derived_paths,
    delegating to a helper _prose_ratchet_sanction(row, plan_scope_files, root, base) -> list[str] (the
    _secrets_baseline_keys precedent; keeps _row_derived_paths under validate_cc_limits' 20).
    If trigger.registry_path is in plan_scope_files, return [] (inert: declared scope already covers it). If the
    registry is absent in the working tree, print a note and return [] before reading it. Gated set =
    every S1 member as p.resolve().relative_to(root.resolve()) for p in _resolve_s1_root_load_set(root) (a member outside
    root is skipped with a printed NOTE, never a ValueError), union every
    key containing "/" in the working-tree registry, parsed with _marker_guard.make_flat_extractor("raise-approved")
    (the shared block-style entry scan; no new scanner). Disjoint from plan_scope_files -> return []. Read the registry
    at base (git show, the _plan_content_at_ref convention) and in the working tree; absent at either half -> print a
    note and return []. Decrease-only means the two texts are byte-identical once each entry line's integer is replaced
    by a placeholder, and every working value <= its base value; then return [path_template], else print
    "  NOTE: prose_budgets_ratchet_down sanctions only lowered values in <registry>; other text changed" and return [],
    (base is the existing push_context_base-or-origin/main ref; the implement flow rebases first, so an unrebased local
    --pre can see a main-side lowering as a raise),
    so the existing out-of-scope STOP reports the path. This row never appends to failed. Update the module docstring.
    Test arms in the new file: (a) S4 path in scope + lowered value -> no findings; (b) same + raised value -> STOP on the
    registry path; (c) same + comment edit -> STOP; (d) S1 member (CLAUDE.md or an @-imported file) in scope + lowered
    value -> no findings; (e) no gated surface in scope + lowered value -> STOP; (f) registry absent at base -> STOP and
    no crash; (g) registry declared in scope + raised value -> no finding from this row; (h) the real contract's row has
    kind scope_file_is_prose_gated, registry_path and path_template config/prose_budgets.yaml; (i) an S1 member
    resolving outside root -> skipped with a NOTE, no exception; (j) registry absent in the working tree -> STOP, no
