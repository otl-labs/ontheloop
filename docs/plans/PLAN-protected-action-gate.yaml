schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "protected-action-gate"
intent: >-
  Give protected actions (state-changing terraform on the live roots, secret reads, admin-credential use) a
  repo-owned, deny-only early-warning gate that reaches project threads through the ontheloop plugin, so the
  operator's approval no longer rests only on the Claude Code auto-mode classifier (rec-4518); and make admin-command
  approvals one ask, in the thread, at build start, instead of a mid-walk refusal.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-protected-action-gate.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Plan G of the
  joint review of the IAM and Telemetry projects (Benjamin chose option A, 2026-10-30). Closes no roadmap criterion.
scope:
  - file: docs/contracts/protected-actions.yaml
    action: Create
    purpose: >-
      Class D contract, status provisional_v0, evaluator validate_admin_root_premerge_gate: authority (none), the
      gate's modules, tools, contract source and live roots (each mapped to its environment-taxonomy axis_a row), the
      three classes with match rules, targets, approval lifetime and binding control, the state reads it does not
      gate, the approval grammar, sources and build-start ask, fail-closed and tamper rules, known limits, and the
      refusal procedure. Exact text: block protected-actions-contract of docs/plans/approved/protected-action-gate.yaml
      (execution step 1).
  - file: .claude/hooks/protected_action_gate.sh
    action: Create
    purpose: >-
      The registered fail-closed shim (the handoff_evidence_gate.sh pattern): runs the Python entry point with -P
      under a timeout and maps a timeout or any exit other than 0 and 2 to a deny when the payload names a coarse keyword,
      else to an allow. Spec in execution step 2.
  - file: .claude/hooks/protected_action_gate.py
    action: Create
    purpose: >-
      PreToolUse hook entry point on Bash, Monitor, Edit, Write, MultiEdit and NotebookEdit, plumbing only: reads
      stdin, the environment, the origin/main contract, the transcript and git state, calls the pure modules, and
      exits 0 with no output or 2 with the deny on stderr. Never prints to stdout. Spec in execution step 2.
  - file: scripts/session/protected_action_match.py
    action: Create
    purpose: >-
      Pure, no I/O: tamper detection, the fast path and classification against the contract, over the simple
      commands and inline code protected_action_shell.py returns. Lives in scripts/session/ so it inherits the 100%
      per-file coverage floor (handoff_push_parse.py's critique F7 precedent). Spec in execution step 2.
  - file: scripts/session/protected_action_shell.py
    action: Create
    purpose: >-
      Pure, no I/O: the shell walk on scripts/session/handoff_push_parse.py's lexer (here-string and arithmetic
      neutralisation, inline-code collection, recursion into substitutions and shell strings, simple commands with
      their command env, directory and command word after wrappers, and -- / -exec tails). Split from the match
      module up front so neither passes 500 SLOC (the lexer alone is 450). Spec in execution step 2.
  - file: scripts/session/protected_action_approvals.py
    action: Create
    purpose: >-
      Pure, no I/O: approval sources from transcript records, whole-line grammar matching, the one-shot credit walk
      and the deny message. Same placement reason. Spec in execution step 2.
  - file: tests/test_session_protected_action_match.py
    action: Create
    purpose: >-
      Direct-import unit tests at the match module's mapped home (map_source_to_test), at least the functions named
      in execution step 3, plus whatever the 100% line floor needs.
  - file: tests/test_session_protected_action_shell.py
    action: Create
    purpose: >-
      Direct-import unit tests at the shell module's mapped home, at least the functions named in execution step 3,
      plus whatever the 100% line floor needs.
  - file: tests/test_session_protected_action_approvals.py
    action: Create
    purpose: >-
      Direct-import unit tests at the approvals module's mapped home, at least the functions named in execution
      step 3, plus whatever the 100% line floor needs.
  - file: .claude/settings.json
    action: Modify
    purpose: >-
      Append one PreToolUse group after the existing groups (the fourth today): matcher
      "^(Bash|Monitor|Edit|Write|MultiEdit|NotebookEdit)$", one command hook "bash
      \"$CLAUDE_PROJECT_DIR/.claude/hooks/protected_action_gate.sh\"" with "timeout": 60, as its two sibling shim
      groups carry. No other key changes.
  - file: .claude/hooks/hooks.json
    action: Modify
    purpose: Re-rendered with bin/venv-python .claude/hooks/plugin_hooks.py render, never hand-edited.
  - file: tests/hooks/test_protected_action_gate.py
    action: Create
    purpose: >-
      The eighteen end-to-end test functions (twenty-one cases) named in execution step 3, including rec-4518's
      acceptance selector test_protected_action_denied_without_authorisation. Hook runs are subprocesses on the real
      file with a pinned environment.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      admin_out_of_band.pre_merge_live_plan: rule[0]'s "standing operator authorisation ... counts" clause becomes the
      in-session sentence, enforcement names the build-start check, and one one-line amendment_log entry. Exact
      text: the sidecar's three deploy-paths blocks (execution step 4).
  - file: scripts/checks/verification/validate_admin_root_premerge_gate.py
    action: Modify
    new_imports: []
    purpose: >-
      Read docs/contracts/protected-actions.yaml (fail closed) and check it against axis_a (live_roots rows exist,
      every admin-only root listed, each class well formed); flag a net-new admin-root plan with no "Approvals at
      build start:" context line, or one that lists a one-shot class.
  - file: tests/checks/verification/test_validate_admin_root_premerge_gate.py
    action: Modify
    purpose: >-
      Eight new tests named in execution step 6; the compliant fixture gains the approvals line and the fixture
      taxonomy a github row; every three-finding assertion becomes four.
  - file: scripts/checks/verification/_manifest.py
    action: Modify
    purpose: >-
      The validate_admin_root_premerge_gate Entry's pre_globs gain "docs/contracts/protected-actions.yaml" beside
      environment-taxonomy.yaml, so a contract-only PR runs the check in --pre (the hook reads the contract from main,
      so a bad one on main refuses coarse commands in every session).
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Decision 212 (SA-04 precedent): structural_assumptions gains SA-07 -- the protected-action gate assumes Claude
      Code's transcript record fields (promptId, sourceToolUseID, turnCompanion, isMeta, isCompactSummary,
      isSidechain, origin.kind), the claude.ai project wake grammar (wake, message from and trust attributes, relay,
      coordinator-relay and cited elements, the 'Chose "' card-tap prefix), the PreToolUse hook input fields
      (transcript_path, cwd, tool_name, tool_input, tool_use_id, and agent_id only from a subagent), a remote named
      origin with a branch main, and .claude/settings.json plus the rendered plugin hooks.json as its registration;
      location .claude/hooks/protected_action_gate.py, status open, owning_item T4.24:c9 -- and a new one-line
      amendment_log row (change_class field_add), as SA-04 was added. If a sibling plan took SA-07 first, use the next
      free id.
  - file: .github/CODEOWNERS
    action: Modify
    purpose: >-
      Nine lines owned by the operator: every gate.modules path not yet owned (/.claude/hooks/protected_action_gate.sh,
      /.claude/hooks/protected_action_gate.py, /scripts/session/protected_action_match.py,
      /scripts/session/protected_action_shell.py, /scripts/session/protected_action_approvals.py, /scripts/session/handoff_push_parse.py,
      /scripts/session/__init__.py, /bin/venv-python) and /docs/contracts/protected-actions.yaml. /scripts/__init__.py
      is already owned (rec-4637 block).
  - file: scripts/checks/misc/sensitive_value_detectors.py
    action: Modify
    purpose: >-
      PROTECTED gains the ten gate paths (the nine gate.modules and the contract; the content reader's precedent),
      so legs (d) and (e) require their CODEOWNERS lines and boundary entries and the base-ref leg refuses a
      narrowing. Any later PROTECTED-reading guard (the unbuilt content-reader lock's protected_path_guard reads this
      tuple) covers them with no change here.
  - file: tests/checks/misc/test_sensitive_value_detectors.py
    action: Modify
    purpose: >-
      test_protected_action_gate_paths_are_protected, the content-reader test's shape for the ten paths; the
      BOUNDARY fixture gains them and CONTENT_READER_PATHS becomes an explicit list.
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      boundary_patterns gain the ten paths under a "# Protected-action gate (Decision 239 cl.5)" comment, which the
      PROTECTED ownership leg requires (Decision 117/185 SSOT).
  - file: docs/plans/PLAN-protected-action-gate.yaml
    action: Modify
    purpose: Graduation walk sets implementation_declared and records VP shards.
bundled_recommendations: [rec-4518]
followon_recs: [rec-4767, rec-4773]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    For each class, a protected command with no approval in the transcript exits 2 and its stderr names the class,
    the target, the binding control and the exact approve line.
  - >-
    A session-class command exits 0 when a principal wake message (thread) or a typed user turn (direct session)
    carries the matching approval as a whole line or item; another class or target, a negated line, a coordinator
    relay citing the operator, a tool result, a companion record, a compaction summary, the agent's text or a
    decision card's question text does not count.
  - >-
    A tf-state-change approval allows exactly one matching call, only at its commit with no edit in the repository,
    tracked or untracked; never from a subagent, for target unknown or for a root taken only from the hook input cwd;
    refresh, test, workspace new or delete and init -migrate-state count, also behind wrappers with options, a --
    or -exec tail, bash -c or $(...).
  - >-
    Inline code fed to an interpreter (-c, a heredoc or a here-string) that names a value verb or an admin profile is
    classified; other heredoc bodies are data, and a here-string or arithmetic << never hides a later line. The pure
    modules in scripts/session/ hold 100% line coverage, and a planted json.py cannot shadow a module the hook loads.
  - >-
    Unprotected commands (terraform fmt and validate on a live root; plan, show and state list on terraform/github;
    plan on terraform/bootstrap with aws_profile set to agent_platform; git; aws sts under agent_platform) exit 0
    without reading the transcript, also under an ambient admin AWS_PROFILE where the segment selects agent_platform.
  - >-
    An ambient-only admin-credential deny names the AWS_PROFILE=agent_platform re-run; a terraform call that contacts
    AWS on bootstrap or personal without a non-admin aws_profile is admin-credential, and under an ambient admin
    profile only a non-admin AWS_PROFILE clears it.
  - >-
    The contract is read from origin/main, not the working tree; an unreadable one denies only coarse or
    ambient-admin aws and terraform calls; an unreadable transcript denies a protected command; writes to the
    transcript directory are denied; malformed hook input exits 0; no gate module contains "permissionDecision".
  - >-
    .claude/settings.json registers the shim on the six tools with a $CLAUDE_PROJECT_DIR-anchored path, the shim
    denies a coarse payload when the interpreter fails, .claude/hooks/hooks.json is the render, and gate.modules and
    the contract are code-owned and PROTECTED.
  - >-
    validate_admin_root_premerge_gate fails on an incoherent contract and flags a net-new admin-root plan with no
    "Approvals at build start:" line or with a one-shot class in it.
  - >-
    deploy-paths.yaml no longer says a standing authorisation counts and passes validate_contract_drift;
    protected-actions.yaml passes it as a new Class D contract; both stay inside their structural-size limits.
  - >-
    After merge and a plugin refresh, a fresh project thread's harmless probe is denied, stays denied when the agent
    writes the approve line itself, then runs after Benjamin writes it in that thread; rec-4518 is closed by the
    Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run the gate's end-to-end test module. It does not exist today, so the red-before replay classifies
      target_absent.
    command: bin/venv-python -m pytest tests/hooks/test_protected_action_gate.py -q
    expected: exit 0 and twenty-one tests passed; before the change pytest finds no such file.
    fix_if: >-
      Fix the hook or the contract. Never drop a class, a forgery case, a tamper case or a fail-closed case to pass
      (Decision 181).
    hermetic: true
    expected_literals: ["21 passed"]
    graduation: graduate
    graduation_check_id: protected-action-gate-hook
  - step: 2
    phase: pre-deploy
    action: Run rec-4518's acceptance selector on its own (the closure evaluator runs exactly this).
    command: bin/venv-python -m pytest tests/hooks/test_protected_action_gate.py::test_protected_action_denied_without_authorisation -q
    expected: exit 0, three parametrized cases passed.
    fix_if: Fix the hook; the selector name is rec-4518's acceptance and must not change.
    hermetic: true
    expected_literals: ["3 passed"]
    graduation: waive
    graduation_waiver_reason: >-
      A subset of step 1's module, run separately only because it is the rec's acceptance command.
  - step: 3
    phase: pre-deploy
    action: >-
      Run the three pure modules' unit tests, then hold them to the 100% per-file line floor. None exists today
      (target_absent before).
    command: >-
      bin/venv-python -m pytest tests/test_session_protected_action_match.py tests/test_session_protected_action_shell.py
      tests/test_session_protected_action_approvals.py -q && bin/venv-python -m scripts.test_coverage_checker
      --check-tests --check-coverage --files scripts/session/protected_action_match.py
      scripts/session/protected_action_shell.py scripts/session/protected_action_approvals.py
    expected: exit 0; every unit test passes and the checker reports 0 missing test files and 0 below 100% coverage.
    fix_if: >-
      Add the missing test or fix the module. Never add a coverage exclusion, a baseline entry or a pragma to reach
      the floor.
    hermetic: true
    expected_literals: ["0 below 100% coverage"]
    graduation: waive
    graduation_waiver_reason: >-
      The three test files are the modules' mapped homes, so affected-test selection runs them on every change to
      any module and the full tier's coverage check holds the floor.
  - step: 4
    phase: pre-deploy
    action: >-
      Run the nine new check tests: eight in the premerge-gate module and the PROTECTED-membership test. They do
      not exist today (target_absent before).
    command: >-
      bin/venv-python -m pytest tests/checks/verification/test_validate_admin_root_premerge_gate.py
      tests/checks/misc/test_sensitive_value_detectors.py -q -k "approvals_line or one_shot_class or
      protected_actions_contract or missing_axis_a_row or missing_from_live_roots or coherent_with_the_taxonomy or
      points_at_in_session_approval or watches_the_protected_actions_contract or protected_action_gate_paths"
    expected: exit 0, nine tests passed and the rest deselected.
    fix_if: >-
      Fix the check or the registrations; never relax the prefix match to a substring, skip the contract read, drop
      a coherence rule or narrow PROTECTED.
    hermetic: true
    expected_literals: ["9 passed"]
    graduation: graduate
    graduation_check_id: admin-root-premerge-approvals-clause
  - step: 5
    phase: pre-deploy
    action: >-
      Run the whole premerge-gate and sensitive-value modules, the plugin render parity test and the hook-registration
      test (no regression in existing clauses or ownership legs; hooks.json is the render of settings.json).
    command: >-
      bin/venv-python -m pytest tests/checks/verification/test_validate_admin_root_premerge_gate.py
      tests/checks/misc/test_sensitive_value_detectors.py
      "tests/hooks/test_plugin_hooks.py::test_the_committed_hooks_file_is_the_render_of_the_settings"
      tests/hooks/test_capture_hook_registration.py -q
    expected: exit 0, no failures.
    fix_if: Re-render hooks.json from settings.json; fix the check. Never edit hooks.json by hand.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Re-runs existing standing test modules as a no-regression probe; they are already in the fast tier.
  - step: 6
    phase: pre-deploy
    action: >-
      Run the contract population, ports and structural-size checks: the new Class D contract resolves its
      evaluator, deploy-paths and ports.yaml carry new amendment_log entries, SA-07 validates, and deploy-paths,
      ports.yaml, the contract and CODEOWNERS fit their limits.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as c;
      from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as pc;
      from scripts.checks.structural.size_limits import validate_structural_size_limits as s; f=[]; c(f); pc(f); s(f);
      print('GATE FAILURES', len(f)); assert not f, f"
    expected: GATE FAILURES 0.
    fix_if: >-
      Fix the contract envelope or the amendment_log entry within the sidecar's words. If deploy-paths is over its
      limit, re-wrap only the two changed paragraphs; if still over, stop and report a plan defect (an unbound
      compaction fails validate_merge_step). Never alter the approved wording or raise a limit.
    hermetic: true
    expected_literals: ["GATE FAILURES 0"]
    graduation: waive
    graduation_waiver_reason: All three checks already run in the fast tier on every PR.
  - step: 7
    phase: pre-deploy
    action: >-
      Prove the hook is fast on the unprotected path: time 20 runs of an unprotected command through the real hook
      with a pinned environment (no CLAUDE_PROJECT_DIR, AWS_PROFILE agent_platform).
    command: >-
      bin/venv-python -c "import json,os,subprocess,time,sys; e={'PATH':os.environ['PATH'],'HOME':os.environ.get('HOME','/tmp'),'AWS_PROFILE':'agent_platform'};
      p={'tool_name':'Bash','tool_input':{'command':'git status'},'transcript_path':'/nonexistent/t.jsonl','cwd':'.'};
      t=time.time(); rs=[subprocess.run([sys.executable,'.claude/hooks/protected_action_gate.py'],input=json.dumps(p),capture_output=True,text=True,env=e)
      for _ in range(20)]; avg=(time.time()-t)/20; assert all(r.returncode==0 and not r.stdout for r in rs), rs[0];
      assert avg<0.5, avg; print('FAST_PATH_OK', round(avg,3))"
    expected: FAST_PATH_OK and an average under half a second.
    fix_if: Slow -- move the YAML import and the git call behind the coarse-keyword test.
    hermetic: true
    expected_literals: ["FAST_PATH_OK"]
    graduation: waive
    graduation_waiver_reason: >-
      A performance probe on the Python entry alone (not the bash shim or venv-python wrapper, so it understates the
      real per-call cost): runner timing noise makes a latency threshold flaky as a standing record. The deny-only
      invariant it once carried is pinned in step 1's module by test_source_never_emits_a_permission_decision and the
      run helper's empty-stdout assertion.
  - step: 8
    phase: pre-deploy
    action: >-
      Full-tier handoff obligation on the committed, rebased, clean tree, then attest the evidence covers HEAD
      (.claude/settings.json is a never_exempt path, Decision 203). The full tier passes the 10-minute foreground
      cap: start it backgrounded with a 2 h limit from the top-level session (a subagent never receives the
      completion); the verdict is validation_result --verify-head, never the chain's exit status.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: exit 0; no failure in the Validation Summary; --verify-head attests HEAD.
    fix_if: >-
      An in-scope failure is fixed, committed and this step re-run from the start; an out-of-scope one becomes a rec
      via scripts.ops_data_portal (Decision 59, Decision 55). Never skip or weaken a check.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Live probe in a FRESH project thread after merge and after the claude.ai plugin has refreshed (its SessionStart
      drift check prints no warning). (a) Run AWS_PROFILE=agent_platform_admin aws --version and capture the denial.
      (b) Negative: post the exact line "approve admin-credential agent_platform_admin" in the agent's own thread
      message and print it with echo, then re-run; it must still be denied. (c) Ask Benjamin in that thread to write
      exactly that line. (d) Re-run. (e) One-shot and subagent probe: from the main session run
      AWS_PROFILE=agent_platform terraform -chdir=terraform/github apply -help and capture the deny's approve line;
      ask Benjamin to write it; (f) have a subagent (Agent tool) run the same command; (g) re-run it from the main
      session. Neither command uses credentials or contacts a backend, so both are safe to run.
    command: AWS_PROFILE=agent_platform_admin aws --version
    expected: >-
      (a) and (b) blocked; the reason names admin-credential, agent_platform_admin, the binding control and the
      approve line. (d) prints the aws CLI version. (e) blocked, naming tf-state-change, github and the approve line
      with HEAD's first 12 characters; (f) blocked, naming the main session (the hook input's agent_id, Claude Code's
      subagent-only field); (g) prints terraform's apply help.
    fix_if: >-
      (a) runs -- the plugin did not refresh or the hook is not registered: check the drift-check line, then
      hooks.json. (b) runs -- the source predicate counts agent text: stop and fix it in a follow-up PR before any
      admin build. (d) still blocked -- capture the transcript record of Benjamin's message and fix the source
      parser in a follow-up PR; never widen the sources to relays or tool results. (f) runs -- the harness sent no
      agent_id: stop and fix it in a follow-up PR before any one-shot is used (the one-shot lifetime would otherwise
      fail open). (g) still blocked -- capture the credit walk's inputs and fix it in a follow-up PR. A "Denied by auto
      mode classifier" refusal at (d) or (g) is not a gate failure: follow the contract's CLASSIFIER VERDICT step.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: Confirm rec-4518 was closed by the squash commit's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import
      fetch_recs_by_ids,make_reader;r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-4518']);
      st=r[0]['status'] if r else None;assert not m and st=='closed', (m, st);print('REC_CLOSED')"
    expected: REC_CLOSED.
    fix_if: >-
      Still open -- read the trailer-closure job log; on a transport or merge-leg refusal use the sanctioned
      --update-rec fallback; on an acceptance-verdict refusal use only the printed close_proposed command
      (git-ops.yaml resolves_trailer). Then resolve the probe thread, so its session-long approval ends with it.
    hermetic: false
    graduation: not-applicable
