execution_steps:
  - |-
    docs/contracts/protected-actions.yaml -- create with exactly this text, less its two-space margin (signed off by Benjamin at step 6b, with the critique-round wording changes approved 2026-10-30 19:57Z, see the Approvals context line):

      # Protected-action gate (rec-4518). Class D mechanism contract: the actions an agent session runs only after the
      # operator acknowledges them in that session, the acknowledgement grammar, and the recovery procedure for refusals.
      # Read at run time from origin/main by .claude/hooks/protected_action_gate.py (PreToolUse; project threads load it
      # through the ontheloop plugin's hooks.json). PUBLIC repository (Decision 101): logical names only.
      contract:
        id: protected-actions
        class: D
        contract_version: 1
        status: provisional_v0
        description: >-
          The protected-action classes, the in-session approval grammar the gate reads from the session transcript, the
          build-start ask, the fail-closed and tamper rules, the known limits, and the refusal procedure.
          validate_admin_root_premerge_gate checks this file against environment-taxonomy.yaml axis_a and enforces
          approval.build_start on net-new admin-root plans.
        subject: protected-actions
        evaluator:
          check: validate_admin_root_premerge_gate
        provisional_v0:
          authored_at: "2026-10-30"
          authored_via: "PLAN-protected-action-gate"
          rationale: >-
            First shape. The approval grammar is tested only against this repository's project-thread and direct-session
            transcript formats, which the harness may change; provisional_v0 lets it settle before it is treated as stable.
      amendment_log:
        - date: "2026-10-30"
          semantic_break: false
          change_class: field_add
          summary: >-
            PLAN-protected-action-gate (rec-4518): created. Classes tf-state-change, secret-read and admin-credential; the
            in-session approval grammar and the build-start ask; fail-closed and tamper rules; the refusal procedure.
          migration_story: New contract; nothing migrates.

      authority: >-
        None. The gate is an early warning (Decision 239 cl.5; Decision 143 cl.1 puts enforcement outside the agent's
        loop): it only refuses, never returns an allow decision, and so never bypasses the auto-mode classifier. An approve
        line acknowledges the warning for this gate alone. It grants no authority and is not an engine verb (Decision 233);
        each class's binding_control is what binds.

      gate:
        hook: .claude/hooks/protected_action_gate.sh
        modules:
          - .claude/hooks/protected_action_gate.sh
          - .claude/hooks/protected_action_gate.py
          - scripts/session/protected_action_match.py
          - scripts/session/protected_action_approvals.py
          - scripts/session/handoff_push_parse.py
          - scripts/session/__init__.py
          - scripts/__init__.py
          - bin/venv-python
        tools: [Bash, Monitor, Edit, Write, MultiEdit, NotebookEdit]
        contract_source: >-
          git show origin/main:docs/contracts/protected-actions.yaml in CLAUDE_PROJECT_DIR (else the hook input cwd),
          never the working tree (Decision 203 cl.4 precedent).
        shell_parsing: >-
          The handoff gate's lexer (scripts/session/handoff_push_parse.py) splits a command into simple commands and
          recovers $(...) and backtick bodies, bash -c and eval strings, and heredocs fed to a shell; a here-string (<<<) or
          an arithmetic << never starts a heredoc. A heredoc or here-string fed to an interpreter (python or python3 with
          any version suffix, venv-python, perl, node), and an interpreter's -c, -e, -E, -p or --eval string, also inside a
          combined flag word such as -Ic, is inline code; other heredoc bodies are data. A command word matches by basename
          after leading NAME=value assignments. After a wrapper (env, command, exec, nohup, nice, time, timeout, sudo,
          stdbuf, ionice, xargs, watch) the command word is the first later word whose basename is terraform or aws, so no
          wrapper option hides it, and NAME=value words before it join the command's environment. The words after a
          standalone --, -exec or -execdir are a command of their own; cd, pushd and env -C set the directory for what
          follows.
        live_roots:
          terraform/bootstrap: bootstrap
          terraform/github: github
          terraform/personal: sandbox
        live_roots_note: >-
          Each live root maps to its environment-taxonomy.yaml axis_a row, the sole source for its apply gating
          (Decision 92 pt 5). Every admin-only row's root must be listed here. A root directory is matched by its literal
          last two path parts, so -chdir="$W/terraform/bootstrap" is bootstrap.
        admin_profiles: [agent_platform_admin]
        self_serve_profile: agent_platform
        on_deny: >-
          Exit 2. The message names the class, the target, the binding control, and the exact approve line the operator
          writes in this thread, beside the exact command. When the only hit is admin-credential from the hook's own
          AWS_PROFILE, it also names the self-serve fix: re-run with AWS_PROFILE=<self_serve_profile>.

      classes:
        - id: tf-state-change
          matches: >-
            A terraform invocation, run against a live root, whose subcommand is in subcommands; or state followed by one of
            state_subcommands; or workspace followed by one of workspace_subcommands; or init with one of init_flags. The
            root directory is the -chdir= value, else the directory a preceding cd, pushd or env -C in the same command
            sets, else the hook input cwd. A directory whose last two parts are not literal has target unknown.
          subcommands: [apply, destroy, import, refresh, test, force-unlock, taint, untaint]
          state_subcommands: [rm, mv, push, replace-provider]
          workspace_subcommands: [new, delete]
          init_flags: [-migrate-state, -force-copy]
          target: the live root's last path part (bootstrap, github or personal), or unknown, which is never approvable
          approval: one_shot_at_commit
          binding_control: >-
            The apply_gating of the root's axis_a row (gate.live_roots). An agent applies only after the operator has seen
            the plan and directed the apply (Decision 126 cl.1; deploy-paths.yaml admin_out_of_band.procedure).
        - id: secret-read
          matches: >-
            aws secretsmanager get-secret-value or batch-get-secret-value; aws ssm get-parameter, get-parameters,
            get-parameters-by-path or get-parameter-history with --with-decryption; inline code (gate.shell_parsing)
            naming get_secret_value, batch_get_secret_value or WithDecryption=True; or a command that runs one of
            entry_points.
          entry_points:
            - .github/actions/materialise-tfvars/materialise_tfvars.sh
            - bin/sync-terraform-assets.sh --tfvars
            - scripts/ci/neon_api_key.sh
          target: the --secret-id, --name, --names or --path value, else any
          approval: session
          binding_control: >-
            IAM: the reading role's value grant on that secret or parameter (Decisions 157 and 237;
            secret-material-handling.yaml).
        - id: admin-credential
          matches: >-
            (1) A command that selects an admin profile: --profile <p>, --profile=<p>, AWS_PROFILE=<p>,
            AWS_DEFAULT_PROFILE=<p>, TF_VAR_aws_profile=<p>, -var aws_profile=<p>, -backend-config=profile=<p>, or, in any
            word or inline code, profile_name='<p>' or profile='<p>' (either quote). (2) A terraform call that contacts
            AWS (any subcommand not in offline_subcommands, and not init -backend=false) on a root in admin_default_roots,
            whose provider defaults aws_profile to an admin profile, unless the call sets aws_profile (-var or TF_VAR_) to
            a non-admin profile. (3) An aws call, or a terraform call that contacts AWS, while the hook's own AWS_PROFILE is
            an admin profile, unless the command sets AWS_PROFILE (or, for aws, --profile) to a non-admin profile; -var and
            TF_VAR_ do not clear this, because the terraform backends read the ambient profile.
          admin_default_roots: [terraform/bootstrap, terraform/personal]
          offline_subcommands: [fmt, validate, version, providers, graph, help, -help, -version]
          target: the profile name
          approval: session
          binding_control: >-
            IAM trust on the admin role and the CloudTrail IAM-change detector (Decisions 144, 202 and 225), and the
            operator's rule that the admin profile serves only named bootstrap and admin deploys (rec-4707).

      not_protected:
        - >-
          terraform plan, show, output, state list and state pull on a live root: state reads are bound by IAM
          (Decision 238 cl.1). Run with an admin profile, including a root's default one, they are admin-credential.
        - aws ssm get-parameter(s) without --with-decryption, and any secretsmanager or ssm metadata call.

      approval:
        grammar:
          session: "approve <class> <target>"
          one_shot_at_commit: "approve <class> <target> <commit>"
        grammar_notes: >-
          Case-insensitive; a whole line, or a whole comma-separated item, is one approval, so a line that only mentions
          one ("do not approve ...") is none; one message may carry several. Target any covers every target of a session
          class. <commit> is at least 7 hex characters of a commit id.
        lifetimes:
          session: The rest of that session. A new thread needs its own approval.
          one_shot_at_commit: >-
            One matching tool call made after the approval line, and only while the repository's HEAD starts with <commit>
            and no file in the repository, tracked or untracked and not ignored, differs from HEAD (a root also reads files
            outside its directory, such as config/). It covers only a root the command names (-chdir=, cd, pushd or env
            -C), never one taken from the hook input cwd. Any later matching call uses it up, whether or not it ran. A call
            from a subagent (the hook input carries agent_id) is never covered, because its calls are not in the
            transcript that counts the credit: one-shot actions run in the main session.
        sources: >-
          A user turn the person typed: a user record with string content, a promptId, no sourceToolUseID or
          turnCompanion, and none of isMeta, isCompactSummary or isSidechain (src/turn_capture/streams.py's prompt rule).
          In a project thread that record must be a wake whose origin kind is human, and only its <message> elements with
          from="human" and trust="principal", outside any relay or citation, count; for a decision-card tap only the
          chosen option's label counts. In a direct session a record whose origin kind is present and not human does not
          count.
        never_counted: >-
          Coordinator or thread relays, including the operator's messages they cite; tool results; companion records;
          compaction summaries; file contents; hook output; the agent's own messages.
        build_start:
          context_prefix: "Approvals at build start:"
          rule: >-
            A net-new IMPLEMENTATION plan whose scope changes a non-Markdown file under an admin-only root
            (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan) carries a context line starting with context_prefix.
            It lists the approve line for every session class its steps need and the exact commands each covers. The build
            posts that list as its first ask, before any work. One reply in that thread clears this gate, and because it
            names the exact commands it is also the in-thread approval the auto-mode classifier looks for (harness
            behaviour this repository does not own). Only session classes may be listed; a one_shot_at_commit class is
            asked when its plan is shown.

      fail_closed:
        - An unreadable or unparseable transcript, or an empty transcript_path, denies a protected command.
        - >-
          An unreadable or invalid contract at origin/main denies every command that names a coarse keyword (terraform,
          secretsmanager, ssm, get_secret_value, WithDecryption, an admin profile, an entry point), and every aws or
          terraform call while the hook's own AWS_PROFILE is an admin profile, naming the failure and git fetch origin main.
        - A lexer error on a command that names a coarse keyword denies it.
        - A git error while checking a one_shot_at_commit approval, or a root path that is not literal, denies it.
        - >-
          The registered shim (gate.hook) maps a timeout or any interpreter exit other than 0 and 2 to a deny when the
          payload names a coarse keyword, and to an allow otherwise, so a broken interpreter never wedges every command.
        - Malformed hook input allows (the never_on_main precedent, Decision 138), because nothing can be classified.

      tamper:
        - The gate denies Edit, Write, MultiEdit and NotebookEdit on any file in the transcript's directory.
        - >-
          It denies a Bash or Monitor command that names the transcript's directory and writes (>, tee, sed -i, cp, mv, rm,
          truncate, dd, ln, or an inline interpreter). Reading it stays allowed.
        - >-
          gate.modules and this contract are code-owned by the operator (.github/CODEOWNERS) and listed in the PROTECTED
          ratchet (scripts/checks/misc/sensitive_value_detectors.py), so protected_path_guard refuses an edit to them that
          no declared plan scopes.

      known_limits:
        - >-
          Indirection the lexer does not recover is not parsed: variables other than a literal root path, aliases,
          functions, wrappers not in gate.shell_parsing (such as flock or parallel), shells nested beyond one -c or eval,
          and scripts or programs that call terraform, aws or an AWS SDK internally, including a script written elsewhere
          that then writes the transcript.
        - >-
          The ambient rule (admin-credential rule 3) gates only aws and terraform words: inline code or a script that uses
          an AWS SDK under an admin AWS_PROFILE without naming a profile passes.
        - >-
          A one-shot approval does not see ignored files a root reads, such as a gitignored tfvars file or a build output;
          the plan output the operator saw is what the approval stands on.
        - >-
          A hook failure on a payload that names no coarse keyword is allowed, so a crash skips the tamper rules; an empty
          transcript_path skips them too.
        - >-
          The hook runs from the working tree, so a Bash edit to gate.modules or the venv's packages disables it for that
          session, as does an edit to its registration (.claude/settings.json, .claude/hooks/hooks.json or
          .claude/.claude-plugin/plugin.json, which are not code-owned); CODEOWNERS review catches an edit to gate.modules
          or this contract at merge.
        - Approvals are read, and one-shot credits used up, only in the transcript the hook input names.
        - The gate never loosens auto mode. A command it lets through can still be refused by the classifier.
        - The binding controls hold whatever the gate misses.

      procedure:
        description: >-
          Agent-led steps when a protected action or its approval is refused. Each step starts with the refusal it answers.
        steps:
          - >-
            GATE DENY (the message names a protected-actions class): post the exact command and the deny's approve line to
            the operator in this thread, as a message rather than a decision card (card labels hold at most 40 bytes), and
            run the command only after the operator writes that line here. For tf-state-change, first commit every change,
            then present the plan output at the named commit (deploy-paths.yaml admin_out_of_band.procedure), from the main
            session with a literal -chdir=terraform/<root>; a target of unknown is rewritten, never approved. An
            admin-credential hit from the hook's own AWS_PROFILE alone is re-run with the self-serve profile when the step
            does not need admin rights; ask only when it does.
          - >-
            CLASSIFIER VERDICT ("Denied by auto mode classifier"): only the operator's own message in this thread naming the
            exact command clears it, so every ask lists the exact commands beside the approve lines.
          - >-
            CONTENT CHECK ("a safety check separate from auto mode blocked this request because of earlier conversation
            content"): no approval clears it. Stop, record the state, and continue in a fresh thread with a handoff.
          - >-
            RELAYED APPROVAL: neither the classifier nor this gate counts an approval relayed by the coordinator or another
            thread; ask the operator to answer in this thread.
  - >-
    .claude/hooks/protected_action_gate.sh -- the registered command, modelled on handoff_evidence_gate.sh with no
    set -e or set -u: read the payload, run timeout -k 5 20 "$CLAUDE_PROJECT_DIR/bin/venv-python" -P
    "$CLAUDE_PROJECT_DIR/.claude/hooks/protected_action_gate.py" with it on stdin (-P keeps the script directory off
    sys.path), pass exit 0 and exit 2 (and stderr) through, and map any other exit or a timeout to exit 2 with a
    one-line stderr reason when the payload contains a word in the shim's COARSE list (the Python COARSE plus aws and
    terraform when AWS_PROFILE is an admin profile), else to exit 0. The Python splits by the coverage floor
    (handoff_push_parse.py's F7 placement): .claude/hooks/protected_action_gate.py is plumbing (it appends the repo
    root, found from its own path, to the end of sys.path, never first, so with the shim's -P no planted json.py,
    shlex.py or yaml.py in .claude/hooks or the repo root shadows a module it imports; reads stdin, the environment,
    the origin/main contract, the transcript and git state; writes the deny to stderr; exits), and every decision is
    a pure function with no I/O in scripts/session/protected_action_match.py ((1), (2), (4) and (5) below) or
    scripts/session/protected_action_approvals.py ((6) and (7)). Stdlib plus PyYAML, imported lazily; module
    docstrings in the never_on_main style (behaviour, exit codes, the contract as the source of every list); the
    strings permissionDecision and hookSpecificOutput appear in no gate module, and nothing writes to stdout. main()
    reads stdin JSON; a decode error or a non-mapping input exits 0. (1) Tamper rules, before any contract read and
    skipped when transcript_path is empty: for Edit, Write, MultiEdit or NotebookEdit, deny when tool_input file_path
    (or notebook_path) resolves inside the directory of transcript_path, else exit 0; for Bash or Monitor, deny when
    the command names that directory or the transcript file name together with a write form (>, tee, sed -i, cp, mv,
    rm, truncate, dd, ln, python -c, python3 -c, perl -e, or a heredoc). (2) Fast path: exit 0 before any git call,
    YAML import or transcript read when the command contains none of the module constant COARSE (terraform,
    secretsmanager, ssm, get_secret_value, WithDecryption, materialise_tfvars, sync-terraform-assets, neon_api_key,
    agent_platform_admin) and either the hook's own AWS_PROFILE is not an admin profile or the command has no aws or
    terraform word. (3) Contract (entry): repo is CLAUDE_PROJECT_DIR, else the input cwd; run git -C <repo> show
    origin/main:docs/contracts/protected-actions.yaml (5 s timeout) and yaml.safe_load it; a git error, a parse error
    or a missing gate, classes or approval key denies (the fast path already let everything else through), naming the
    failure and "git fetch origin main". (4) Shell walk, the is_push_shaped order. An interpreter word is one whose
    basename is venv-python, perl or node or matches python[0-9.]*. First, from the raw text, collect as inline code
    each <<< here-string whose line has an interpreter word, and the word after a single-dash flag word ending in c,
    e, E or p, or after --eval, that follows an interpreter word. Then, in the walk's copy, neutralise each unquoted
    <<< operator and each << inside $((...)) or ((...)), because the shared _HEREDOC_OP_RE reads both as a heredoc
    and would drop every later line (rec-4772 owns the same defect in the handoff gate). From that copy, collect as
    inline code each heredoc body (_HEREDOC_OP_RE and _find_delimiter_line) whose receiving line has an interpreter
    word. Then strip_heredocs and strip_line_continuations; recurse into each _find_balanced_spans body and each
    _shell_c_and_eval_args string; elide the spans; _tokenize (a ValueError denies, the fast path having already
    passed non-coarse text) and _split_simple_commands. Per simple command: strip leading NAME=value assignments into
    a command env (its AWS_PROFILE, AWS_DEFAULT_PROFILE and TF_VAR_aws_profile win over the hook's AWS_PROFILE); a
    command of only assignments, or export NAME=value, carries them to later commands, as cd <dir> or pushd <dir>
    carries its directory. The command word is the first word, by basename; when that is a wrapper (env, command,
    exec, nohup, nice, time, timeout, sudo, stdbuf, ionice, xargs, watch), it is instead the first later word whose
    basename is terraform or aws (if none, the command is neither), every NAME=value word after the wrapper joins the
    command env either way, and env -C <dir>, -C<dir> or --chdir=<dir> sets the command's directory. The words after
    a standalone --, -exec or -execdir are classified as a further command. (5) Classify per the contract:
    tf-state-change (terraform, an optional -chdir=, then a subcommand in subcommands, state plus one of
    state_subcommands, workspace plus one of workspace_subcommands, or init with one of init_flags; the root
    directory is -chdir resolved against the command's directory, else that directory, else the input cwd, and the
    hit records whether the command named it (-chdir=, cd, pushd or env -C) or it came from the input cwd; the target
    is the live root whose last two path parts equal the directory's literal last two parts, so
    "$W/terraform/bootstrap" is bootstrap; non-literal last parts are unknown; a directory outside every live root is
    not protected), secret-read (the verbs in matches, the entry_points by path suffix, and get_secret_value,
    batch_get_secret_value or WithDecryption=True in the collected inline code; target the --secret-id, --name,
    --names or --path value, else any) and admin-credential (the three rules in matches: the selection forms, with
    profile_name= and profile= also found inside any word or the inline code; the admin_default_roots rule, cleared
    only by a non-admin -var aws_profile=, -var=aws_profile= or TF_VAR_aws_profile=; and the ambient rule, cleared
    only by a non-admin AWS_PROFILE in the command env or, for aws, --profile; target the profile; record whether the
    hit is ambient-only). (6) Approvals: the entry reads the transcript; an empty transcript_path, or a missing,
    unreadable or bad-line JSONL file, denies. Sources are user records whose message.content is a string, with a
    non-empty promptId, no sourceToolUseID, no turnCompanion, and isMeta, isCompactSummary and isSidechain not true.
    Thread mode when any source starts with "<wake ": only sources that start with "<wake " and whose origin.kind is
    "human" count, and from each only the text of <message> elements whose attributes include from="human" and
    trust="principal" and that sit outside any <relay>, <coordinator-relay> or <cited> element, html.unescaped; when
    that text starts with 'Chose "' keep only the quoted label. Direct mode otherwise: sources that do not start with
    "<" and whose origin.kind, when present, is "human". Split the text into lines and each line into comma-separated
    items; an item counts only when, trimmed and with whitespace collapsed, it equals an approve form
    case-insensitively. A session-class hit is approved by an item naming its class and its target or any. A one-shot
    hit denies when the hook input carries a non-empty agent_id (run it in the main session), when its target is
    unknown, or when its root came from the input cwd or is not literal (use -chdir=terraform/<root>); otherwise the
    entry runs git -C <root dir> rev-parse --show-toplevel HEAD and git -C <toplevel> status --porcelain
    --untracked-files=normal (the whole repository; a git error denies), and the approvals module walks the
    transcript in order: each approve item for that class and target adds a credit carrying its commit, and each
    assistant tool_use for Bash or Monitor whose id differs from the input's tool_use_id and whose command,
