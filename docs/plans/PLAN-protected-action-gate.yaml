execution_steps:
  - >-
    docs/contracts/protected-actions.yaml -- create it with exactly the `after` text of block
    protected-actions-contract in docs/plans/approved/protected-action-gate.yaml, read at the build's base (the
    operator's approved wording, Decision 246), filling each {{DATE}} with the build date. Never re-derive, reword or
    re-wrap it; a build that cannot place it word for word stops and reports a plan defect. bin/venv-python -m
    scripts.roadmap.approved_text verify --slug protected-action-gate must pass before commit.
  - >-
    .claude/hooks/protected_action_gate.sh -- the registered command, modelled on handoff_evidence_gate.sh with no
    set -e or set -u: read the payload; ROOT is $CLAUDE_PROJECT_DIR, else "$(cd "$(dirname "$0")/../.." && pwd)" (the
    merge_gate.sh fallback); when "$ROOT/.claude/hooks/protected_action_gate.py" is not a file, take the failure
    branch below at once (python's own missing-script exit is 2, which would otherwise pass through as a deny of every
    call); else run timeout -k 5 20 "$ROOT/bin/venv-python" -P "$ROOT/.claude/hooks/protected_action_gate.py" with it
    on stdin (-P keeps the script directory off
    sys.path), pass exit 0 and exit 2 (and stderr) through, and map any other exit or a timeout to exit 2 with a
    one-line stderr reason when the payload contains a word in the shim's COARSE list (the Python COARSE plus aws and
    terraform when AWS_PROFILE is an admin profile), else to exit 0. The Python splits by the coverage floor
    (handoff_push_parse.py's F7 placement): .claude/hooks/protected_action_gate.py is plumbing (it appends the repo
    root, found from its own path, to the end of sys.path, never first, so with the shim's -P no planted json.py,
    shlex.py or yaml.py in .claude/hooks or the repo root shadows a module it imports; reads stdin, the environment,
    the origin/main contract, the transcript and git state; writes the deny to stderr; exits), and every decision is
    a pure function with no I/O in scripts/session/protected_action_match.py ((1), (2) and (5) below),
    scripts/session/protected_action_shell.py ((4), which match calls) or
    scripts/session/protected_action_approvals.py ((6) and (7)). Stdlib plus PyYAML, imported lazily; module
    docstrings in the never_on_main style (behaviour, exit codes, the contract as the source of every list); the
    strings permissionDecision and hookSpecificOutput appear in no gate module, and nothing writes to stdout. main()
    reads stdin JSON; a decode error or a non-mapping input exits 0. (1) Tamper rules, before any contract read and
    skipped when transcript_path is empty: for Edit, Write, MultiEdit or NotebookEdit, deny when tool_input file_path
    (or notebook_path) resolves inside the directory of transcript_path, else exit 0; for Bash or Monitor, deny when
    the command names that directory or the transcript file name together with a write form (a > or >> redirect whose
    target is inside that directory, so 2>/dev/null and 2>&1 never count; tee, sed -i, cp, mv, rm, truncate, dd, ln,
    python -c, python3 -c, perl -e, or a heredoc); a tamper deny names the read-only way on (cat, tail or the Read
    tool, or cat it into a file outside that directory and analyse the copy). (2) Fast path: exit 0 before any git call,
    YAML import or transcript read when the command contains none of the module constant COARSE (terraform,
    secretsmanager, ssm, get_secret_value, WithDecryption, materialise_tfvars, sync-terraform-assets, neon_api_key,
    agent_platform_admin) and either the hook's own AWS_PROFILE is not an admin profile or the command has no aws or
    terraform word. (3) Contract (entry): repo is CLAUDE_PROJECT_DIR, else the input cwd; run git -C <repo> show
    origin/main:docs/contracts/protected-actions.yaml (5 s timeout) and yaml.safe_load it; a git error, a parse error
    or a missing gate, classes or approval key denies (the fast path already let everything else through), naming the
    failure and "git fetch origin main". (4) Shell walk, the is_push_shaped order. An interpreter word is one whose
    basename is venv-python, perl or node or matches python[0-9.]*. First, from the raw text, collect as inline code
    each <<< here-string whose line has an interpreter word, and the word after a single-dash flag word ending in c,
    e, E or p, or after --eval, that follows an interpreter word. Then, in the walk's copy, neutralise each unquoted
    <<< operator and each << inside $((...)) or ((...)), because the shared _HEREDOC_OP_RE reads both as a heredoc
    and would drop every later line (rec-4772 owns the same defect in the handoff gate). From that copy, collect as
    inline code each heredoc body (_HEREDOC_OP_RE and _find_delimiter_line) whose receiving line has an interpreter
    word. Then strip_heredocs and strip_line_continuations; recurse into each _find_balanced_spans body and each
    _shell_c_and_eval_args string; elide the spans; _tokenize (a ValueError denies, the fast path having already
    passed non-coarse text) and _split_simple_commands. Per simple command: strip leading NAME=value assignments into
    a command env (its AWS_PROFILE, AWS_DEFAULT_PROFILE and TF_VAR_aws_profile win over the hook's AWS_PROFILE); a
    command of only assignments, or export NAME=value, carries them to later commands, as cd <dir> or pushd <dir>
    carries its directory. The command word is the first word, by basename; when that is a wrapper (env, command,
    exec, nohup, nice, time, timeout, sudo, stdbuf, ionice, xargs, watch), it is instead the first later word whose
    basename is terraform or aws (if none, the command is neither), every NAME=value word after the wrapper joins the
    command env either way, and env -C <dir>, -C<dir> or --chdir=<dir> sets the command's directory. The words after
    a standalone --, -exec or -execdir are classified as a further command. (5) Classify per the contract:
    tf-state-change (terraform, an optional -chdir=, then a subcommand in subcommands, state plus one of
    state_subcommands, workspace plus one of workspace_subcommands, or init with one of init_flags; the root
    directory is -chdir resolved against the command's directory, else that directory, else the input cwd, and the
    hit records whether the command named it (-chdir=, cd, pushd or env -C) or it came from the input cwd; the target
    is the live root whose last two path parts equal the directory's literal last two parts, so
    "$W/terraform/bootstrap" is bootstrap; non-literal last parts are unknown; a directory outside every live root is
    not protected), secret-read (the verbs in matches; an entry point run, that is its path, matched by suffix, as
    the command word after wrappers and assignments or as the script operand of bash, sh, source or ., never as an
    argument of another command such as cat, grep, git diff or git add; and get_secret_value,
    batch_get_secret_value or WithDecryption=True in the collected inline code; target the --secret-id, --name,
    --names or --path value, else any; an entry point written with an argument, such as
    bin/sync-terraform-assets.sh --tfvars, matches only when the command has that path word and that argument word)
    and admin-credential (the three rules in matches: the selection forms, with
    profile_name= and profile= also found inside any word or the inline code; the admin_default_roots rule, cleared
    only by a non-admin -var aws_profile=, -var=aws_profile= or TF_VAR_aws_profile=; and the ambient rule, cleared
    only by a non-admin AWS_PROFILE in the command env or, for aws, --profile; target the profile; record whether the
    hit is ambient-only). (6) Approvals: the entry reads the transcript; an empty transcript_path, or a missing,
    unreadable or bad-line JSONL file, denies. Sources are user records whose message.content is a string, with a
    non-empty promptId, no sourceToolUseID, no turnCompanion, and isMeta, isCompactSummary and isSidechain not true.
    A record whose promptId equals an earlier source's is a companion, not a source (streams.py's reused-promptId
    rule). Thread mode when any source starts with "<wake ": only sources that start with "<wake " and whose
    origin.kind is "human" count, and from each only the text of <message> elements whose attributes include
    from="human" and trust="principal", that sit inside a <thread> element whose ts equals the first wake source's
    thread ts (this thread; a new thread needs its own approval), and that sit outside any <relay>,
    <coordinator-relay> or <cited> element, html.unescaped; when
    that text starts with 'Chose "' keep only the quoted label. Direct mode otherwise: sources that do not start with
    "<" and whose origin.kind, when present, is "human". Split the text into lines and each line into comma-separated
    items; an item counts only when, trimmed and with whitespace collapsed, it equals an approve form
    case-insensitively. A session-class hit is approved by an item naming its class and its target or any. A one-shot
    hit denies when the hook input carries a non-empty agent_id (run it in the main session), when its target is
    unknown, or when its root came from the input cwd or is not literal (use -chdir=terraform/<root>); otherwise the
    entry runs git -C <root dir> rev-parse --show-toplevel HEAD and git -C <toplevel> status --porcelain
    --untracked-files=normal (the whole repository; a git error denies), and the approvals module walks the
    transcript in order: each approve item for that class and target adds a credit carrying its commit, and each
    assistant tool_use for Bash or Monitor whose id differs from the input's tool_use_id and whose command,
    classified against that assistant record's own cwd (else the input cwd), has the same class and target uses up
    the oldest credit. It is approved when an unused credit's commit is a prefix of HEAD and the status output is
    empty. (7) All hits approved: exit 0 silently. Otherwise exit 2 with the on_deny message on stderr for the first
    unapproved hit: class, target, binding_control, the exact approve line (one-shot: with the first 12 characters of
    HEAD, and "commit every change first" when the status output was not empty), that the operator writes it in this
    thread beside the exact command, the AWS_PROFILE=agent_platform re-run when the hit is ambient-only, and the
    procedure's CLASSIFIER VERDICT step. Wrap the entry's body so an unexpected exception denies when the fast path
    would not have passed the command and allows otherwise.
  - >-
    Tests, in four files. tests/hooks/test_protected_action_gate.py runs the real hook end to end: every run is a
    subprocess of sys.executable on .claude/hooks/protected_action_gate.py (the shim only in
    test_shim_maps_hook_failure_by_payload) with JSON on stdin and a pinned env (PATH, HOME, CLAUDE_PROJECT_DIR set
    to the fixture repo, AWS_PROFILE=agent_platform unless the test sets it); the shared run helper asserts stdout is
    empty on every run. A fixture builds a tmp git repo (git -c commit.gpgsign=false) holding
    docs/contracts/protected-actions.yaml copied from the working tree, config/feature_flags.yaml, and
    terraform/bootstrap, terraform/github and terraform/personal directories with one tracked file each, and points
    refs/remotes/origin/main at its commit. A helper writes JSONL transcripts whose records carry the real fields
    (type, promptId, message.content, and for wakes the real wake > project > thread > message shape with from,
    trust, author and id attributes, html-escaped text, and origin kind human). Exactly these eighteen functions,
    parametrized only where stated (twenty-one cases):
    test_protected_action_denied_without_authorisation[tf-state-change, secret-read, admin-credential] (terraform
    -chdir=terraform/github apply; aws ssm get-parameter --name /secret/x --with-decryption; aws --profile
    agent_platform_admin iam list-roles; exit 2 and stderr names the class, target, binding control and approve
    line); test_session_class_approval_from_principal_allows[secret-read, admin-credential];
    test_tf_state_change_approval_allows_one_call_at_its_commit (approve with HEAD's first 7 characters allows the
    first apply; with that apply recorded as an earlier tool_use, a second is denied);
    test_tf_state_change_approval_refused_after_new_commit_or_local_change (a later commit, an edit to the root's
    tracked file, an untracked override.tf, and an edit to config/feature_flags.yaml outside the root each deny; an
    ignored .terraform/ directory does not); test_subagent_one_shot_call_is_denied (the same approved apply with
    agent_id set is denied, naming the main session); test_unknown_or_cwd_only_root_is_never_approvable (-chdir=$ROOT
    apply is denied even with "approve tf-state-change unknown <sha>", and a bare terraform apply with the input cwd
    at terraform/github is denied even with the github approval at HEAD, each naming -chdir);
    test_relayed_and_agent_approvals_do_not_count (a <cited author="user"> approval inside a coordinator relay, the
    line in a tool_result block, in an assistant message, in a from="agent" trust="relay" message, and a relay
    message whose escaped body carries &lt;message from="human" trust="principal"&gt;approve ...&lt;/message&gt;,
    which pins parse-before-unescape, each leave the command denied); test_unprotected_commands_pass_without_reading_the_transcript (terraform fmt -check and validate
    on terraform/bootstrap; plan, show and state list on terraform/github; terraform -chdir=terraform/bootstrap plan
    -var aws_profile=agent_platform; git push; grep -n agent_platform_admin docs; aws sts get-caller-identity
    --profile agent_platform; echo "approve admin-credential agent_platform_admin"; transcript_path at a missing
    file); test_ambient_admin_profile_rules (with the hook's AWS_PROFILE the admin profile: aws s3 ls is denied and
    the message names AWS_PROFILE=agent_platform; terraform -chdir=terraform/personal plan -var
    aws_profile=agent_platform is still denied; AWS_PROFILE=agent_platform aws s3 ls, export
    AWS_PROFILE=agent_platform && aws s3 ls, AWS_PROFILE=agent_platform terraform -chdir=terraform/personal plan -var
    aws_profile=agent_platform, aws --profile agent_platform sts get-caller-identity, terraform fmt and git status
    pass); test_transcript_writes_are_denied_and_reads_pass (Write and Edit into the transcript directory, echo >>
    and sed -i on the transcript, each deny; tail of it and a Write elsewhere pass);
    test_contract_is_read_from_origin_main (deleting the working-tree contract changes nothing; deleting the
    origin/main ref denies a coarse match naming git fetch origin main, and git status passes both normally and with
    the admin profile ambient); test_unreadable_transcript_denies_protected (also with an empty transcript_path,
    where a Write elsewhere passes); test_malformed_input_allows; test_shim_maps_hook_failure_by_payload (with
    CLAUDE_PROJECT_DIR at a fixture whose bin/venv-python exits 1: a coarse payload is denied with the shim's reason,
    git status passes, and an exit-2 child's stderr reaches the caller; with protected_action_gate.py absent from the
    fixture, git status passes and a coarse payload is denied with the shim's reason); test_planted_stdlib_names_do_not_load (in
    the fixture repo, copies of the gate's Python and shell modules, a bin/venv-python that execs sys.executable with
    its arguments, and a json.py at the repo root and in .claude/hooks that exits 0 on import: a protected command
    through the shim is still denied); test_registered_rendered_and_code_owned (settings.json carries the group with
    the exact matcher, anchored shim command and timeout 60 after every existing PreToolUse group; hooks.json equals
    plugin_hooks.render of settings.json; CODEOWNERS owns every gate.modules path and the contract);
    test_contract_shape_and_coarse_keywords (the working-tree contract loads; every class has id, matches, target,
    approval and binding_control; every admin profile, entry-point basename and class verb family is covered by the
    hook's COARSE, and the shim's list equals COARSE; the prefix is "Approvals at build start:");
    test_source_never_emits_a_permission_decision (no gate.modules file contains permissionDecision or
