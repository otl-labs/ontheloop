schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "pypi-and-gated-apply-environments"
intent: >-
  Close the last two GitHub Environment gaps in terraform/github: bring the UI-managed pypi Environment (the PyPI
  Trusted Publishing gate of publish-ontheloop.yml) under Terraform with its required reviewer, no admin bypass and
  an explicit main-only branch policy (rec-4549), and replace tf-gated-apply's "protected branches only" setting,
  which admits every branch under this repo's ruleset-only main, with the same explicit main-only policy (rec-4651).
  Both land through the reviewed terraform-github-apply.yml channel (Decision 248) on one operator approval, so every
  reviewer-gated Environment but the approval probe refuses a non-main run before it can ask for approval.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-pypi-and-gated-apply-environments.yaml
phase: >-
  ad_hoc_rec (rec-4549, rec-4651; no tier_item). Serves the CI Reform remit (all CI/CD). Closes no roadmap criterion.
cites: [dec:94, dec:126, dec:172, dec:248]
scope:
  - file: terraform/github/environments.tf
    action: Modify
    purpose: >-
      (1) tf_gated_apply: deployment_branch_policy becomes protected_branches = false, custom_branch_policies = true;
      add github_repository_environment_deployment_policy.tf_gated_apply_main (environment =
      github_repository_environment.tf_gated_apply.environment, branch_pattern = "main"). Nothing else in the block
      changes (reviewers, prevent_self_review and prevent_destroy stay; can_admins_bypass stays unset, see context).
      Its header's key-constraints bullet and the "may let any branch deploy" note are rewritten to say the policy is
      main-only (rec-4651), and the authorization-boundary paragraph names Decision 172's immutable subject form beside
      Decision 94's two subs (rec-3151). (2) New github_repository_environment.pypi: environment "pypi",
      prevent_self_review = false, can_admins_bypass = false, reviewers { users = var.gated_apply_reviewer_user_ids },
      deployment_branch_policy { protected_branches = false, custom_branch_policies = true }, lifecycle
      prevent_destroy = true; plus github_repository_environment_deployment_policy.pypi_main (branch_pattern "main").
      Its header says it is publish-ontheloop.yml's PyPI Trusted Publishing gate, imported from the UI-created object
      (rec-4549), that the name is part of PyPI's trust triple (package-registry-reservation.yaml
      pypi_trusted_publisher, never renamed), and that destroying it fails open like tf_gated_apply. (3) The
      deployment_approval_probe comment drops "Inert probe target", names Decision 248 cl.8 as its user (the apply App
      approval oracle, terraform-github-apply.yml approval_probe_run_id) and says it mirrors tf_gated_apply's reviewer
      settings but keeps protected-branches-only (rec-5098). No other block changes.
  - file: terraform/github/imports.tf
    action: Modify
    purpose: >-
      Append one block: to = github_repository_environment.pypi, id = "${var.repository_name}:pypi". The two new
      deployment policies get no import block (no remote object exists; EXEMPT rows in the import-block test).
  - file: scripts/checks/ci_guards/validate_environment_reviewer_preflight.py
    action: Modify
    purpose: >-
      UI_MANAGED becomes an empty dict (predicate (b) itself is unchanged and still fails a name in both places); the
      docstring's (b) line is unchanged. Without this the real tree fails (b) once pypi is declared in HCL.
    new_imports: []
  - file: tests/checks/ci_guards/test_validate_environment_reviewer_preflight.py
    action: Modify
    purpose: >-
      test_b_ui_managed_name_also_declared_in_hcl_fails monkeypatches v.UI_MANAGED to {"pypi": "rec-4549"} before
      calling check_environment_names, so predicate (b) keeps its red case on the same name; add
      test_pypi_is_declared_in_hcl asserting "pypi" in v.declared_environments(tree[1]) with reviewers and no_bypass
      true and "pypi" not in v.UI_MANAGED. No assertion is removed or weakened.
  - file: tests/checks/iam_tf/test_terraform_github_import_blocks.py
    action: Modify
    purpose: >-
      Add EXEMPT rows for github_repository_environment_deployment_policy.tf_gated_apply_main and .pypi_main with a
      reason naming this plan (created by the approved terraform-github-apply.yml dispatch that names them in
      gate_change; no remote object before it). github_repository_environment.pypi is NOT exempt: the existing test
      then requires its import block.
  - file: tests/checks/iam_tf/test_tf_gated_apply_branch_policy.py
    action: Create
    purpose: >-
      rec-4651's acceptance test. Static over terraform/github/*.tf via tests/fixtures/terraform_hcl_blocks, with an
      EXEMPT set {"deployment_approval_probe"}: (a) test_every_environment_but_the_probe_is_main_only -- at least two
      environments are examined (fail closed on an empty parse), and every github_repository_environment not exempt sets protected_branches = false and
      custom_branch_policies = true and has exactly one github_repository_environment_deployment_policy referencing it
      with branch_pattern "main" and no tag_pattern; (b) test_gated_environments_keep_their_reviewer -- tf_gated_apply and pypi each keep a reviewers block bound to
      var.gated_apply_reviewer_user_ids, prevent_self_review = false and prevent_destroy = true; (c)
      test_pypi_has_no_admin_bypass -- pypi sets can_admins_bypass = false and environment "pypi". Red cases run the same predicates on synthetic HCL
      (protected_branches = true, a "*" pattern, a missing policy, a policy bound to another Environment, a missing
      reviewers block).
  - file: .github/workflows/publish-ontheloop.yml
    action: Modify
    purpose: >-
      Comment only: line 49's "the pypi Environment is UI-managed" becomes "the pypi Environment is terraform/github's
      (main-only, required reviewer)". No step, input or permission changes.
  - file: scripts/ci/environment_reviewer_preflight.py
    action: Modify
    purpose: >-
      Docstring only: the residual "(Decision 94's premise ... holds only for main-defined jobs until
      rec-4651/rec-4965)" is re-stated: every reviewer-gated Environment but deployment-approval-probe is main-only,
      so a non-main-branch job cannot enter one; admins can still bypass tf-gated-apply until rec-4965 moves the
      terraform/github apply job to tf-github-apply. No code change.
  - file: terraform/github/CLAUDE.md
    action: Modify
    purpose: >-
      Replace the whole "## tf-gated-apply Environment" section (heading through the deployment-approval-probe line,
      about 836 B) with exactly this text (about 721 B as wrapped; the build measures both; the file shrinks about 115 B, and config/prose_budgets.yaml's entry is lowered to
      the measured size in the same PR under implement-scope-boundary.yaml's prose_budgets_ratchet_down row):
      "## Environments" / blank / "`tf-gated-apply` gates the post-merge apply of the guard fail-closed set
      (IAM/trust/destroy diffs): the `gated-apply` job in `terraform-apply-sandbox.yml` waits for benjamin-blake's
      approval. Until rec-4965 it also gates this root's CI apply job. `pypi` gates `publish-ontheloop.yml`; its name
      is in PyPI's trust triple." / blank / "Key constraints:" / "- Every Environment but the probe is main-only by an
      explicit branch policy, never \"protected branches only\", which admits every branch under a ruleset-only main."
      / "- Reviewer IDs come from `gated_apply_reviewer_user_ids` at apply time, never a literal default." / blank /
      "deployment-approval-probe: rec-4695 probe, created in the UI and imported; Decision 248 cl.8 uses it." (rec-4651,
      rec-5098). Lines wrap at 110 columns as the file does. Also in the intro paragraph, "and the
      `tf-gated-apply` GitHub Environment (CD.35 Wave 3 / T2.22 / Decision 92)" becomes "and its GitHub Environments
      (CD.35 Wave 3 / T2.22 / Decision 92)" (shorter). No other line changes.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Place the sidecar block decision-248-update word for word (one dated Update line appended to Decision 248, after
      the Decision 256 amendment note; {{DATE}} is the build merge's UTC date). Nothing else changes.
  - file: docs/contracts/github-org-transfer.yaml
    action: Modify
    purpose: >-
      Place the sidecar blocks transfer-binding, transfer-fix and transfer-amendment-log word for word:
      breakage_map.environment_fail_open's binding covers every Environment terraform/github declares (pypi among
      them) and its fix reads and recreates them all from terraform/github, and a new amendment_log entry (change_class correction, {{DATE}} the build merge's UTC date) records it. contract_version unchanged.
bundled_recommendations: [rec-4549, rec-4651, rec-3151, rec-5098]
followon_recs: []
closes_criteria: []
infrastructure_dependencies:
  - "terraform/github is CI-applied only by terraform-github-apply.yml (Decision 248): the merge push run's preview stops neutral on the four unnamed gate rows; a dispatch from main naming them in gate_change applies them after one operator approval in tf-gated-apply."
  - "The apply job that changes tf-gated-apply runs inside tf-gated-apply at main, so the new main-only policy never refuses it."
  - "github_repository_environment.pypi imports the live UI object (rec-4549). Its live settings are UNPROVEN (the session proxy refuses Environment reads); VP 4 reads them from the build PR's terraform-github-plan.yml report before merge."
  - "PyPI's Trusted Publisher triple (repository, publish-ontheloop.yml, environment pypi) is unchanged, so no re-registration (package-registry-reservation.yaml restage_obligation)."
acceptance_criteria:
  - tf-gated-apply and pypi each have custom_branch_policies true and one deployment policy with branch_pattern main, in HCL and live.
  - pypi is declared in terraform/github with a required reviewer from var.gated_apply_reviewer_user_ids, can_admins_bypass false and prevent_destroy, and is imported, not recreated.
  - validate_environment_reviewer_preflight passes with UI_MANAGED empty and pypi gated by HCL.
  - A publish-ontheloop.yml (proof_only) dispatch from a non-main branch fails at the pypi Environment with no pending deployment; a tf-gated-apply-prototype.yml dispatch from a non-main branch fails the same way or, if admin bypass admits it, is cancelled unapproved and filed as a rec depending on rec-4965; both workflows dispatched from main reach waiting and are cancelled.
  - rec-4549, rec-4651, rec-3151 and rec-5098 are closed by the squash-merge Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Precondition at build start; no open PR other than the build's touches terraform/github, and red_overlap is re-run.
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-pypi-and-gated-apply-environments.yaml &&
      echo PRECONDITION_OK; bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-pypi-and-gated-apply-environments.yaml; echo RED_OVERLAP_RC=$?
    expected: >-
      Prints the precondition marker; red_overlap exits 0, or 1 naming only reds the context's deferral names with no
      shared file. The build also lists open PRs (mcp__github__list_pull_requests) and confirms none touches
      terraform/github.
    fix_if: A new red, a shared file, or exit 2 (reds unreadable; HARD BLOCK); or another open PR edits terraform/github; the build reports it to the coordinator and waits, since two pending gate changes would make either dispatch refuse (GATE_CHANGE_UNNAMED).
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The new and changed static tests pass on the branch and fail on main's HCL.
    command: >-
      bin/venv-python -m pytest
      tests/checks/iam_tf/test_tf_gated_apply_branch_policy.py::test_every_environment_but_the_probe_is_main_only
      tests/checks/iam_tf/test_tf_gated_apply_branch_policy.py::test_gated_environments_keep_their_reviewer
      tests/checks/iam_tf/test_tf_gated_apply_branch_policy.py::test_pypi_has_no_admin_bypass
      tests/checks/ci_guards/test_validate_environment_reviewer_preflight.py::test_real_tree_is_green
      tests/checks/ci_guards/test_validate_environment_reviewer_preflight.py::test_pypi_is_declared_in_hcl -q
    expected: All selected tests pass.
    expected_literals: [passed]
    fix_if: A failure; fix the HCL or the test on the branch, never loosen an assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: tf-gated-apply-branch-policy
  - step: 3
    phase: pre-deploy
    action: The registered guards over the tree pass, and terraform fmt is clean.
    command: >-
      bin/venv-python -m scripts.validate --pre && terraform -chdir=terraform/github fmt -check -diff
    expected: validate --pre exits 0 and fmt prints no diff.
    fix_if: Any failing check; fix on the branch.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      Read the build PR's terraform-github-plan.yml report (the PR-time plan comment; it prints actions and changed
      attribute names, never values) and confirm it lists exactly four rows: tf_gated_apply update (changed names
      include deployment_branch_policy), tf_gated_apply_main create, pypi import with an update whose changed names
      include deployment_branch_policy (live is not already custom) and not wait_timer, and pypi_main create; nothing
      else. The build lists pypi's changed names in the PR body (expected also: can_admins_bypass if live allowed
      bypass, prevent_self_review if live had it on, reviewers if the live set differs).
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__pull_request_read(method=get_comments) on the build PR; read the terraform-github-plan report')"
    expected: Exactly the four rows above, by changed names; the pypi row is an import, not a create.
    fix_if: >-
      pypi shows as a create (the import id is wrong or the Environment is gone: STOP, report to the plan owner); its
      deployment_branch_policy is unchanged (live already uses custom policies, so a live policy object may exist and
      needs its own import: STOP, plan defect to the plan owner); the pypi row's changed names include wait_timer (a
      UI-set wait timer would be dropped: STOP, report to the plan owner); its changed names include reviewers (the
      live reviewer set differs from var.gated_apply_reviewer_user_ids: the build asks the operator on the PR to
      confirm the live set holds no reviewer he wants kept before merge); any other row (drift: report to the
      coordinator). The apply gate already refuses a delete or replace.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: >-
      The merge's push run of terraform-github-apply.yml ends neutral naming the dispatch owed for exactly the four
      addresses, and its preview table (allowlisted values) shows: pypi reviewer_count 1, can_admins_bypass false,
      prevent_self_review false, protected_branches false, custom_branch_policies true; tf_gated_apply reviewer_count 1,
      protected_branches false, custom_branch_policies true; tf_gated_apply_main and pypi_main with branch_pattern main
      and their own environment names.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_list(list_workflow_runs, terraform-github-apply.yml, event=push), then mcp__github__get_job_logs on its preview job, asserting TF_GITHUB_APPLY_GATE_CHANGE_UNNAMED with exactly the four addresses')"
    expected: The preview log names exactly the four addresses with the values above, and the run concluded success with no apply.
    fix_if: Other addresses appear, or any value differs; stop before VP 6 and report to the coordinator (values) or the plan owner (a value the HCL does not set).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: >-
      CI APPLY. The build dispatches terraform-github-apply.yml from main with gate_change
      "github_repository_environment.tf_gated_apply,github_repository_environment_deployment_policy.tf_gated_apply_main,github_repository_environment.pypi,github_repository_environment_deployment_policy.pypi_main";
      the operator reads the preview (the same four rows) and approves in tf-gated-apply; the build reads the run.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_run_trigger(method=run_workflow, workflow_id=terraform-github-apply.yml, ref=main, inputs={gate_change}), then mcp__github__actions_get(get_workflow_run) asserting conclusion == success and mcp__github__get_job_logs on its apply job asserting the four addresses applied and a clean re-plan')"
    expected: The run concluded success; its apply log lists exactly the four addresses and the re-plan is clean.
    fix_if: The preview lists any other change (the operator rejects it); an apply failure is reported with its error class and finished by a plan amendment, never -target or a CloudShell apply without the operator's word; the same amendment corrects the Decision 248 Update if the branch policy cannot be applied.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      Branch refusal, live. From a non-main branch that holds both workflows (the build branch; if the squash-merge
      deleted it, create a probe branch from main with mcp__github__create_branch), dispatch
      tf-gated-apply-prototype.yml and publish-ontheloop.yml with proof_only true. The dispatching identity is the
      operator's (a repo admin; record it). pypi (no admin bypass) must fail at the Environment (not allowed to deploy
      due to environment protection rules) and never enter waiting: that leg is the proof. tf-gated-apply should fail
      the same way; because it keeps admin bypass until rec-4965, a waiting state there is cancelled unapproved and
      filed (get_rec_write_guidance, then file_rec through scripts.ops_data_portal) as a rec depending on rec-4965 that
      names the run id; the build continues. A probe branch the build created is deleted afterwards (or left to
      branch_cleanup, said in the report).
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_run_trigger(run_workflow, ref=<build branch>) for both workflows (publish with inputs proof_only=true); mcp__github__actions_get(get_workflow_run) each: conclusion failure, never status waiting; mcp__github__actions_list(list_workflow_jobs) shows no step ran')"
    expected: The publish run concluded failure with no step executed and no pending deployment; the prototype run the same, or a recorded rec-4965 finding.
    fix_if: The publish run enters waiting (the pypi policy is not live) or any run enters waiting; cancel it at once (mcp__github__actions_run_trigger cancel_workflow_run), never approve it, and report that the policy is not live.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      Main still admitted. Dispatch the same two workflows from main (publish with proof_only true); each must reach
      status waiting (a pending deployment on its Environment); the build then cancels both. Nobody approves.
    command: >-
      bin/venv-python -c "print('MCP: mcp__github__actions_run_trigger(run_workflow, ref=main) for both; mcp__github__actions_get(get_workflow_run) shows status waiting; then mcp__github__actions_run_trigger(cancel_workflow_run) for both and confirm conclusion cancelled')"
    expected: Both runs reached waiting and ended cancelled.
    fix_if: "A run fails at the Environment from main (the policy pattern is wrong): report and fix forward by a plan amendment."
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: The four bundled recs are closed by the squash-merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; rows,_=c.fetch_recs_by_ids(c.make_reader(),['rec-4549','rec-4651','rec-3151','rec-5098']); print(sorted((r['id'],r['status']) for r in rows))"
    expected: All four show status closed.
    fix_if: A rec stays open; the build follows git-ops.yaml's late-closure route.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: The bundled comment recs' acceptance holds (rec-3151, rec-5098) and rec-4549's grep acceptance holds.
    command: >-
      ! grep -q 'the sub is still refs/heads/main' terraform/github/environments.tf &&
      grep -q 'Decision 94' terraform/github/environments.tf && grep -q 'Decision 172' terraform/github/environments.tf &&
      ! grep -q 'Inert probe target' terraform/github/environments.tf &&
      awk '/^# GitHub Environment: deployment-approval-probe/{f=1} /^resource "github_repository_environment" "deployment_approval_probe"/{exit} f' terraform/github/environments.tf | grep -q 'Decision 248 cl.8' &&
      ! grep -qi 'deployment-approval-probe: inert' terraform/github/CLAUDE.md &&
      grep -q 'github_repository_environment" "pypi"' terraform/github/environments.tf &&
      grep -q 'to = github_repository_environment.pypi' terraform/github/imports.tf && echo COMMENT_ACCEPTANCE_OK
    expected: Prints the acceptance marker.
    expected_literals: []
    fix_if: A grep fails; fix the comment or block on the branch.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: One-time comment and grep acceptance of four recs; the branch-policy test graduates the behaviour.
  - step: 11
    phase: pre-deploy
    action: The approved words are placed exactly (Decision 248's dated Update and the three github-org-transfer blocks).
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug pypi-and-gated-apply-environments --base origin/main
    expected: verify exits 0.
    fix_if: A block's before-text no longer matches main exactly once; STOP to the plan owner, never hand-merge.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim, PR-relative to origin/main and vacuous once merged; validate_merge_step's approved-text leg repeats
      it on the PR.
  - step: 12
    phase: pre-deploy
    action: >-
      Fast tier on the PR head (advisory locally; PR CI is authoritative, Decision 73), then the full tier before the
      hand-off (handoff_policy), started in the background from the top-level session with a 2 h limit.
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Both tiers pass and validation_result verifies the head sha.
    fix_if: A failure caused by this diff is fixed on the branch; one that reproduces on origin/main is cited by its existing rec in the PR body, never fixed inline.
    hermetic: false
    graduation: not-applicable
  - step: 13
    phase: pre-deploy
    action: The import-block guard passes with pypi imported and the two new policies exempt.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_terraform_github_import_blocks.py::TestTerraformGithubImportBlocks -q
    expected: The class passes.
    expected_literals: [passed]
    fix_if: pypi lacks its import block or a policy lacks its EXEMPT row; fix on the branch.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Already graduated as shard terraform-github-import-blocks (kept, node id unchanged); this step only re-runs it.
test_obligations:
  - source: terraform/github/environments.tf
    behavior: every Environment but the probe is main-only by an explicit policy; pypi is reviewer-gated, no admin bypass, never destroyed
    verification_step: 2
    test_selector: tests/checks/iam_tf/test_tf_gated_apply_branch_policy.py::test_every_environment_but_the_probe_is_main_only
    red_green_expectation: red before (tf_gated_apply protected_branches true, pypi absent), green after
  - source: terraform/github/imports.tf
    behavior: pypi is imported, the two new policies are exempt creates
    verification_step: 13
    test_selector: tests/checks/iam_tf/test_terraform_github_import_blocks.py::TestTerraformGithubImportBlocks
    red_green_expectation: >-
      Passes on main; red on the mid-build tree once pypi is declared without its import block or the policies without
      EXEMPT rows; green after
  - source: scripts/checks/ci_guards/validate_environment_reviewer_preflight.py
    behavior: pypi is gated by its HCL declaration, not the UI_MANAGED list; (b) still refuses a name in both
    verification_step: 2
    test_selector: tests/checks/ci_guards/test_validate_environment_reviewer_preflight.py::test_pypi_is_declared_in_hcl
    red_green_expectation: red before (test_pypi_is_declared_in_hcl fails on UI_MANAGED), green after
  - source: .github/workflows/publish-ontheloop.yml
    behavior: comment only
    verification_step: 3
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: A one-line comment edit changes no step, input or permission; the reviewer preflight guard already covers the job.
  - source: scripts/ci/environment_reviewer_preflight.py
    behavior: docstring only
    verification_step: 3
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: A docstring residual re-statement; no code path changes, and tests/test_environment_reviewer_preflight.py is unchanged.
  - source: docs/DECISIONS.md
    behavior: exactly the approved Decision 248 Update line is placed
    verification_step: 11
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug pypi-and-gated-apply-environments --base origin/main
    red_green_expectation: red before (block not placed), green after
  - source: docs/contracts/github-org-transfer.yaml
    behavior: exactly the three approved blocks are placed
    verification_step: 11
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug pypi-and-gated-apply-environments --base origin/main
    red_green_expectation: red before (blocks not placed), green after
  - source: terraform/github/CLAUDE.md
    behavior: prose only
    verification_step: 3
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: Ambient prose with no code path; VP 10 greps the probe line and validate_prose_limits pins its shrunk size.
constraints:
  - "One PR. Merge only with no other terraform/github change pending on main (VP 1, VP 5)."
  - "Never apply terraform/github outside terraform-github-apply.yml; a CloudShell break-glass apply needs the operator's own words naming it."
  - "The build never approves a deployment; VP 7 and VP 8 runs are cancelled, never approved."
  - "terraform/github, publish-ontheloop.yml, the reviewer preflight script and its guard are CODEOWNERS paths and CLAUDE.md is a public surface: the operator's word on the final diff is required before merge."
  - "Place every sidecar block word for word; change no other line of docs/DECISIONS.md or github-org-transfer.yaml."
