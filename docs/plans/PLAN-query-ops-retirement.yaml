  - "PR A: handler action, pre-connection validation and 400 mapping; FakeCon to tests/fixtures/ducklake_reader_fakes.py; tests/lambdas/ducklake_reader/test_dq_check_action.py, the ops-slot test in test_event_routing.py and the handler dispatch test (step 3)."
