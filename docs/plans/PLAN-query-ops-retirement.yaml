  - "PR A: code review in a fresh context; fix every blocking finding. Closure per the implement skill's Commit Flows: step 8 on the committed clean tree, push, PR, CI green; implementation_declared stays unset. Merge under the standing rule once code review is PROCEED and CI is green; the coordinator sequences the DuckLake deploy. Then steps 9 and 10."
  - "PR B: models, compile, execute, runner and census move to dq_check requests; the ops.yaml rewrite; their tests (steps 13-15, 20); the integration test repointed at row_predicate (step 26); then steps 11 and 12 against PR A's deployed reader. Stop on any parity difference."
  - "PR B: delete query_ops, query_current, assert_read_only_sql and DuckLakeReader.query with their tests; retired_actions_gate and its tests; the routing, control-table, dedupe, facade, contract-pin and conformance test edits (steps 16-17)."
  - "PR B: contracts (ducklake_reader.yaml, read-engine.yaml, storage-substrate.yaml, ops_entity_counters.yaml); git mv of the four registry shards (step 18); the Decision 84 note (step 19)."
  - "PR B: code review in a fresh context; fix every blocking finding. Closure: weakening_dispositions for every deleted test or assertion and the two retired ops.yaml tests, implementation_declared true, step 21 on the committed clean tree, push, PR, CI green. Ask Benjamin for his word on the Decision 84 note (rule-forced confirmation), then merge on PROCEED and green CI. Then steps 22-24."
  - "After PR B merges: through scripts.ops_data_portal (get_rec_write_guidance first; fetch each rec just before update_rec and prepend to its full context, naming the merge commit's short SHA and this slug) add a dated note to rec-4292 that the query_ops residual is retired, and mark rec-2100, rec-753 and rec-629 superseded with the reason. Then step 25."
  - "Roadmap bookkeeping walk: flip T1.6:c6 to met (met_by query-ops-retirement), set T1.6 status in_progress (c1-c5, c7, c8 open; completion still waits on T1.5), and replace T1.6's progress_note, whose 'the dq_check verb family ... not built' clause this plan makes stale."
  - "Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)."
  - "Report: what was implemented, verification results including the step 11 parity line and step 24's verdict, and the stale-branch note."
rollback: >-
  PR A is additive: revert it and redeploy (query_ops still serves the harness). PR B: revert the merge commit and let the
  governed channel redeploy; query_ops returns and the reverted runner uses it again. Never re-add caller SQL as a hotfix
  on top of PR B.
