infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY (Decision 79/125/126), twice: PR A adds src/common/ducklake_dq_checks.py to the reader bundle and edits
    the handler; PR B edits the handler, ducklake_reads.py and the ducklake_runtime facade, which every DuckLake bundle
    carries. Each merge commit triggers the governed deploy-ducklake-lambdas run (path trigger src/common/ducklake_*.py and
    src/lambdas/ducklake_*/**), whose smoke job runs lambda_reader with this plan's gates; steps 9 and 22 assert the runs.
    PR B merges only after PR A's run is green (step 9). The local build_lambda --deploy stays break-glass only. No
    Terraform and no IAM: the reader role, its grants and CI's reader invoke are unchanged; dq_check reads only the ops
    tables query_ops read.
  - >-
    LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact disposition: compute_affected_artifacts flags data-pipeline
    through src/common/ducklake_reader_client.py (its src/ wildcard). No build, deploy or smoke is owed: no data-pipeline
    handler calls dq_check or query(), and deploy-prod-lambdas.yml's path triggers exclude the file; the same disposition
    as PLAN-telemetry-verification-verbs. The tool also flags docs/ROADMAP-PLATFORM.yaml (a packaged asset; this plan's
    T1.6 rows refresh with the next governed deploy, nothing reads them at runtime) and src/lambdas/data-pipeline/manifest.yaml
    (an exclude only); neither is a deploy-prod-lambdas.yml path trigger, so no deploy is owed. The new dq module is
    excluded from that bundle in PR A.
acceptance_criteria:
  - "The reader serves dq_check: twelve kinds, server-owned SQL, bound values, one violation count per call, check_version stamped; a refused request answers 400 dq_check_input naming the parameter without its value and opens no connection; control-class, telemetry_append and registration tables are refused; it binds the ops slot only (steps 1-6, 10)."
  - "Each one-to-one kind's count equals the SQL it replaces on the same data; the two kinds replacing NOT EXISTS expressions agree on zero/non-zero and are stricter in the pinned empty-current case; the six contract kinds agree row-for-row with the writer's rule engine over the census's full corpora (step 2)."
  - "The DQ runner and the contract-rule census send no SQL: every check is a dq_check request; expression and the contract's write-time kinds stay unrecognised YAML test types; ops.yaml declares typed DQ-side tests only; its two retired single-row tests survive as the writer's write-time row rules, with the census as the on-demand read-time proof (steps 13-15, 20)."
  - "Against the deployed reader, the new runner's per-(table, column) verdicts equal origin/main's minus the two retired tests, which were PASS there, and the census output is identical (steps 11, 12, 24)."
  - "query_ops, query_current, assert_read_only_sql and DuckLakeReader.query are gone; no reader action accepts caller SQL; the deployed reader answers query_ops with 400 unknown action (steps 16, 17, 23)."
  - "Retired checks keep equal-strength successors: four registry shards retire to entries/deprecated/ with successors graduated by steps 3, 4, 5, 15 and 16, and the contracts, Decision 84 note and T1.6 criteria record the retirement (steps 7, 18, 19)."
  - "T1.6:c6 is met: the dq_check verb family exists and raw query_ops / reader.query() over scripts/ no longer includes the DQ harness."
