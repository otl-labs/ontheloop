schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: query-ops-retirement
intent: >-
  Retire the ducklake_reader's caller-SQL action query_ops (Decision 84 I-3's staged follow-up): the data-quality harness
  (the YAML runner and the contract-rule census) moves onto a closed dq_check verb family whose SQL is server-owned and whose
  values are bound, then query_ops and its dead helpers are removed, so no reader action accepts caller-supplied SQL.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-query-ops-retirement.yaml
phase: >-
  T1.6 (DQ runner reshape) -- its "introduce the dq_check verb family" atomic plan, authorable ahead of T1.5 (only the
  deferred YAML-retirement phase needs it). Closes T1.6:c6 only.
closes_criteria:
  - T1.6:c6
scope:
  # ---- PR A (expand): the verb family ships; no caller moves ----
  - file: src/common/ducklake_dq_checks.py
    action: Create
    purpose: >-
      PR A. Reader-only module (imported by the reader handler alone; never re-exported by the ducklake_runtime facade, so
      no other bundle gains a file). A DQ_KINDS registry of twelve check kinds: row_count_min, recency_hours, not_null,
      accepted_values, min_length, pattern, array_element_format, not_before, min_value, unique (columns list, projection
      current|history, exclude_before applied before grouping as today), history_not_ahead_of_current, key_absent. Each kind owns its SQL template and returns one integer
      violation count, never row data. The seven row-level kinds (not_null, accepted_values, min_length, pattern,
      array_element_format, not_before, min_value) build their WHERE clause through one public row_predicate(kind, table,
      column, params) returning (sql_fragment, binds), so the count template and the real-DuckLake integration test share
      it. validate(payload) runs before any connection: table must be an ops table with the projection the kind needs
      (control-class, telemetry_append and registration tables refused, as the generic reads refuse them); every column
      must be in the table's bundled field-semantics spec; values, patterns, the exclude_before date (CAST(? AS DATE)
      against created_timestamp) and numbers are bound parameters, never spliced; lists and strings are length-capped;
      unknown or missing params refused. A refusal raises DqCheckInputError naming the kind, the parameter and a reason,
      never the value. check_version(kind) is the first 16 hex of sha256 over the kind's template text and param names
      (the read_version idiom). min_length strips by WHITESPACE_CLASS, the RE2 class equal to exactly the characters
      str.isspace() accepts (moved here from the census), computed lazily, never at import. No duckdb import at module
      scope. row_count_min and recency_hours keep today's 0/1 flag semantics.
  - file: src/lambdas/ducklake_reader/handler.py
    action: Modify
    purpose: >-
      PR A: action_dq_check returns {ok, check, table, violation_count, check_version}; _handle calls dq.validate before
      acquiring a connection for a dq_check request, so a refused request opens nothing; DqCheckInputError answers 400
      {ok: false, error_type: dq_check_input, check, param, reason}; dq_check binds the ops warm slot (the default
      acquirer). PR B: action_query_ops, its _ACTIONS entry and its module-docstring line are deleted.
  - file: src/lambdas/ducklake_reader/manifest.yaml
    action: Modify
    purpose: PR A. includes gains src/common/ducklake_dq_checks.py.
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: PR A. excludes gains src/common/ducklake_dq_checks.py (reader-bundle only), like the event-read modules.
  - file: src/common/ducklake_reader_client.py
    action: Modify
    purpose: >-
      PR A: DuckLakeReader.dq_check(check, table, params) sends {action: dq_check, check, table, params} through _invoke
      (same retry and loud-fail) and returns the response body; it does not import the dq module (the client ships in the
      data-pipeline bundle). PR B: DuckLakeReader.query() is deleted and the Reader Protocol docstring no longer names it.
