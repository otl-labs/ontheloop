constraints:
  - "Two PRs, in order: PR B starts only after PR A's deploy run (step 9) and live check (step 10) are green; PR B merges only after steps 11 and 12 pass against PR A's deployed reader."
  - "No caller SQL anywhere on the new path: no kind accepts a SQL fragment, identifier text is never taken from a request except as a validated field-semantics column name, and values are always bound."
  - "Behaviour-preserving for the DQ harness: every enforced flag, severity, exclude_before date and dq-latest.json test name of a surviving test is unchanged; the four typed rewrites are equal or stricter; the two retired ops.yaml tests survive as stricter-or-equal contract rules the writer enforces at write time (Decision 181, Decision 210 cl.1-3)."
  - "Counts only: no dq_check response, smoke line or log carries row data or a refused value (Decision 101)."
  - "SLOC: every touched file stays under 500 (tests/test_ducklake_reader_handler.py is at 495); decompose, never raise a budget (Decision 128)."
  - "Each deleted test or assertion gets a weakening_dispositions entry (retirement or refactor, citing the deleted subject or the successor node) on the PR that flips implementation_declared (Decision 181), including the two retired ops.yaml tests."
  - "No live call against a deployed service outside the VP's post-deploy and pre-merge parity steps; no Terraform or IAM change; the local build_lambda --deploy stays break-glass only (Decision 125)."
  - "No rescue agents or workaround loops (Decision 55)."
context:
  - >-
    Direction: Benjamin's "perfect, write the plan" (2026-10-19, Slice 2c thread) approved retiring query_ops via named check
    verbs; his "write the plan" (2026-10-19T12:35Z, this thread) confirmed this shape and its five recommended forks.
    Evidence and adopt/adapt record: /mnt/project-files/query-ops-retirement/ and telemetry-slice2c/ADVICE-reads.md.
  - >-
    Decision-scout: NO_FLAGS. Decisions triaged: 180 of 180. Roadmap items intersected: 16; CONFLICT: 0; RELATED: 14.
    CITE 84, 81, 91, 79, 125, 126, 118, 143, 181, 210, 136, 176, 177, 128. RELATED 55, 62, 65, 88, 212, 101, 73, 226, 115,
    168, 189. Report: /mnt/project-files/query-ops-retirement/decision-scout-report.md.
  - "gates: decision-scout=NO_FLAGS; plan-critique=PROCEED after 3 round(s) (r1 and r2 REVISE, fixed; r3 PROCEED, its implementation notes folded in)"
  - >-
    Why two PRs: main-validate runs the DQ runner against the live reader on every push to main, in parallel with the
    reader deploy. Callers move only after their verbs are deployed (PR A); removing query_ops in PR B cannot race, because
    nothing calls it by then. Steps 11-12 are the pre-merge proof the consult asked for before collapsing to two PRs.
  - >-
    Merge gates: PR A under the standing rule (CI DuckLake deploy, Class B field_add, no IAM, no Decision text). PR B
    carries the Decision 84 note, so it needs Benjamin's word before merge (project rule: Decision text). The
    ops_entity_counters.yaml (Class A) edit swaps a verb name with no meaning change (mechanical-edits rule, 2026-10-16).
  - >-
    Overlap: the Slice 2c telemetry reader may touch handler.py, lambda_ec_gates.py::_telemetry_read_checks, the event
    routing/reads/dedupe tests and ducklake_reader.yaml's residual lines; this plan only deletes query_ops there.
    PLAN-telemetry-cold-read-deadline (merged, unbuilt) edits _handle, both manifests, the client and the contract; its
    deadline guard is event-verb only. Whichever builds second rebases; the coordinator sequences DuckLake deploys.
  - >-
    After PR B deploys, a branch based before PR B whose local full tier auto-invokes the old DQ runner gets ERROR on every
    check (query_ops is gone) until it rebases; the PR B report and the coordinator say so.
  - "rec-4292 owns the declared query_ops residual (Decision 143 cl.1); PR B retires it and notes rec-4292, which keeps the rest."
  - "Not adopted from the consult: interim hardening, a src/row_rules/sql.py home, kinds in describe, an agent SDK error mapping, batching."
  - >-
    Gotchas: handler.py coverage comes from tests/test_ducklake_reader_handler.py alone (495 SLOC; FakeCon moves out).
    Hermetic steps replay against the final tree, so none asserts PR A-only state. check_graduation_guard needs PASS for
    the two newly enforced execution_plans keys (step 11 writes it). WHITESPACE_CLASS is computed lazily, never at import.
  - >-
    T1.6: criteria structured c1..c8 and files_in_scope re-grounded in this plan PR (Freshness Gate), one line per
    criterion. T1.5 gates T1.6 completion only; c1-c5, c7, c8 stay open. T2.19 c13's uniqueness checks are carried across.
  - "Superseded by this plan's deletions (after PR B): rec-2100, rec-753, rec-629 (their target code is deleted)."
  - "Related-work check: scripts.ci_rca.red_overlap verdict clear (no open red, SLO 4 h) at plan time."
