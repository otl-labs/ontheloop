schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: ratify-cd40-agent-turn-capture
intent: >-
  Ratify candidate decision CD.40 (agent-turn telemetry capture on the canonical telemetry model) through the Decision
  105 lane without minting a new number, so T3.20's completion gate on CD.40 clears ahead of c9: every CD.40 clause is
  already recorded in Decisions 78, 127, 174, 199 and 213 or the telemetry_transcripts contract, so CD.40 ratifies onto
  Decision 199 (the model it was reconciled onto) with one dated update line that maps each clause to its home.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ratify-cd40-agent-turn-capture.yaml
phase: >-
  T3.20 (in_progress; CD.40 gates it). Ratifies CD.40 via the Decision 105 lane onto dec-199. Closes no exit criterion:
  T3.20 c1-c8 are met and c9 belongs to PLAN-telemetry-producer-admission-plan-review-capture. No tier status flip
  (lane step 8).
closes_criteria: []
scope:
  - file: docs/plans/approved/ratify-cd40-agent-turn-capture.yaml
    action: Create
    purpose: >-
      Lands WITH THIS PLAN (plan PR), never in the build: the approved-text sidecar binding the operator-approved words of
      every docs/DECISIONS.md and docs/ROADMAP-PLATFORM.yaml edit below (four blocks; placeholder {{DATE}} for the
      build date).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly sidecar block decision-199-update: one "> **Update ({{DATE}}):**" line appended after Decision 199's last
      annotation (Decision 177 dialect, never a body rewrite). It records that CD.40 is ratified onto Decision 199, adds
      and changes no clause, and names where each CD.40 clause already lives. {{DATE}} = the build date (UTC).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Exactly sidecar blocks cd40-ratified (CD.40 to the compact ratified form, Decision 147 points 1 and 4: id, title,
      gates, state ratified, ratified_as dec-199, filed_via ops_decisions:dec-199; affects kept as a machine field,
      candidate-decision-ratification.yaml affects_field; detail removed; discipline_points cut to one line keeping the
      "clause 1 realized" literal that graduated record ops-session-log-roadmap-regrounded reads, Decision 147 cl.1's
      retained-literal carve-out), t3-20-intent (an inline "[Re-grounded {{DATE}}, ...]" annotation after T3.20 intent's "CD.40's
      3-condition structural trigger" naming Decision 199's derived-read-too-costly condition as its replacement, lane
      step 5 truth maintenance) and t3-20-note (one dated progress_note line on T3.20; no status or criterion change).
  - file: tests/decisions/test_cd40_ratification_decision.py
    action: Create
    purpose: >-
      Durable assertions only: T3.20's intent and progress_note are left to VP step 3, because completion_compaction
      (tier-item-lifecycle.yaml) drops them when T3.20 completes. test_cd40_ratified_onto_decision_199: in
      docs/ROADMAP-PLATFORM.yaml (yaml.safe_load) CD.40 has state ratified, ratified_as dec-199, filed_via
      ops_decisions:dec-199, gates [T3.20], affects [T2.26], no detail key, and exactly one discipline_points entry,
      containing "clause 1 realized" and "Decision 199". test_decision_199_maps_cd40_clauses: Decision 199's block
      (scripts.decisions_md.iter_decision_sections over docs/DECISIONS.md then docs/DECISIONS_ARCHIVE.md, as R1 reads,
      matched by number 199) holds exactly one line starting "> **Update (" that contains "CD.40", and, whitespace-normalised, that
      line contains "not a clause-1 or clause-5 note", "Decision 78's 2026-09-22 amendment", "Decisions 127 and 174",
      "imported-row flag" (rec-2510), "the audit's ops_sessions, not telemetry_sessions" (rec-2509), "Decision 213",
      "derived-read-too-costly condition above", "rec-4833" and "snapshot retention"; every Decision number it names (78, 127, 174, 213) has a "## Decision N:" header in docs/DECISIONS.md or
      docs/DECISIONS_ARCHIVE.md.
bundled_recommendations:
  - rec-2509
  - rec-2510
followon_recs:
  - rec-4833
infrastructure_dependencies: []
implementation_declared: false
acceptance_criteria:
  - >-
    docs/DECISIONS.md and docs/ROADMAP-PLATFORM.yaml equal main plus the approved sidecar (scripts.roadmap.approved_text
    verify --slug ratify-cd40-agent-turn-capture exits 0).
  - >-
    No new "## Decision N:" header is added; validate_candidate_decision_ratification passes (R1 resolves dec-199) and the
    fast tier's decision checks pass on the annotated Decision 199.
  - T3.20's completion_blocked_on_cd is empty in scripts.platform_roadmap_state's in_progress projection.
  - tests/decisions/test_cd40_ratification_decision.py passes.
  - rec-2509 and rec-2510 are closed by the squash merge's Resolves trailer (recs_by_ids shows status closed).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove CD.40's ratified shape and Decision 199's clause map.
    command: bin/venv-python -m pytest tests/decisions/test_cd40_ratification_decision.py -q
    expected: >-
      Exit 0, 2 passed. Red before: pytest exit 4 (file absent); with the test written but the blocks not yet placed,
      both tests fail (CD.40 pending, no update line on Decision 199), which the build shows once.
    fix_if: >-
      A missing phrase or field: a block was not placed; restore the sidecar's words. Never edit an assertion to fit.
    hermetic: true
    expected_literals:
      - 2 passed
    graduation: waive
    graduation_waiver_reason: >-
      A content test over two governed files; the --pre pytest diff selection and the full tier run it whenever either
      file or the test changes.
  - step: 2
    phase: pre-deploy
    action: Prove the committed words are the approved words.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug ratify-cd40-agent-turn-capture --expect
      895408f196a5a9166a62fa094e397358ea722f70423de734ca0522c293edf9e8  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; never edit the sidecar (a needed change is a new operator ask).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier on every PR that declares
      this plan.
  - step: 3
    phase: pre-deploy
    action: >-
      One-shot build-time checks: the ratification cleared T3.20's CD gate, T3.20's intent and note carry the re-ground,
      and the referential guard resolves dec-199.
    command: >-
      bin/venv-python -c "from pathlib import Path; import yaml; from scripts.roadmap.platform_roadmap import compute_state_dict;
      d = compute_state_dict(Path('docs/ROADMAP-PLATFORM.yaml')); row = next(i for i in d['in_progress'] if i['id'] == 'T3.20');
      assert row['completion_blocked_on_cd'] == [], row['completion_blocked_on_cd'];
      t = next(i for i in yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml'))['tier_items'] if i['id'] == 'T3.20');
      assert 'derived-read-too-costly condition replaces that trigger' in ' '.join(t['intent'].split()), 'intent';
      assert 'CD.40 is ratified onto Decision 199' in ' '.join(t['progress_note'].split()), 'note';
      print('T3.20 completion_blocked_on_cd clear')"
      && bin/venv-python -c "from scripts.checks.roadmap.validate_candidate_decision_ratification import
      validate_candidate_decision_ratification as v; f = []; v(f); assert not f, f; print('ratification guard PASS')"
    expected: >-
      Prints "T3.20 completion_blocked_on_cd clear" and "ratification guard PASS". Red before: the first assertion fails
      naming CD.40.
    fix_if: >-
      CD.40 still listed -- its state is not ratified; intent/note -- block t3-20-intent or t3-20-note not placed; an R1
      failure -- ratified_as/filed_via do not both name dec-199; fix the placement, not the words.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Moment-shaped: T3.20's in_progress row, intent annotation and progress_note disappear under completion_compaction
      when T3.20 completes; the R1 half duplicates validate_candidate_decision_ratification, registered in both the pre
      and full sequences.
  - step: 4
    phase: pre-deploy
    action: Keep the decisions index fresh after Decision 199's annotation.
    command: bin/venv-python -m scripts.decisions_index --write && bin/venv-python -m scripts.decisions_index --check
    expected: Both exit 0 (the index may be unchanged; no new number appears).
    fix_if: --check exits 1 after --write -- the annotation broke Decision 199's parse; fix the placement, not the words.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The fast tier's decisions-index freshness check already gates every PR touching docs/DECISIONS.md.
  - step: 5
    phase: pre-deploy
    action: Lint and run the full tier, as the handoff policy requires before commit.
    command: >-
      bin/venv-python -m ruff check tests/decisions/ && bin/venv-python -m ruff format --check tests/decisions/; then,
      as its own backgrounded run (2 h limit), bin/venv-python -m scripts.validate; then bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      ruff exit 0; validation_result --verify-head exit 0 for HEAD (the verdict, never the backgrounded run's own exit
      status).
    fix_if: >-
      A failure in this plan's files: fix at root and rerun the full tier from the start (handoff_policy). A failure
      only in another open red's tests is not this build's to fix: wait for that repair per the implement skill.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: Confirm rec-2509 and rec-2510 closed and dec-199's ops_decisions row carries the update after the squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-2509', 'rec-2510']);
      got = sorted((r['id'], r['status']) for r in rows); assert got == [('rec-2509', 'closed'), ('rec-2510', 'closed')], got;
      print('both recs closed')" && AWS_PROFILE=agent_platform bin/venv-python -m scripts.sync.ops sync
      && bin/venv-python -c "import json; rows = [json.loads(l) for l in open('logs/.decisions-index.jsonl') if l.strip()];
      r = [x for x in rows if x.get('id') == 'dec-199']; assert r and 'CD.40 is ratified onto this Decision' in json.dumps(r[-1]);
      print('dec-199 backfilled with the CD.40 update')"
    expected: Prints "both recs closed", then "dec-199 backfilled with the CD.40 update".
    fix_if: >-
      A rec still open: check the squash body carries "Resolves: rec-2509, rec-2510" and ci.yml's closure job ran;
      never close by hand without the acceptance passing. dec-199 stale: check rec-autoclose.yml's "Backfill decisions
      to warehouse" step ran on the merge commit (Decision 84); re-run that workflow, never write the cache.
    hermetic: false
test_obligations:
  - source: docs/DECISIONS.md
    behavior: Decision 199 carries exactly one CD.40 update line naming every clause's home (no new header, per VP step 2).
    verification_step: 1
    test_selector: tests/decisions/test_cd40_ratification_decision.py::test_decision_199_maps_cd40_clauses
    red_green_expectation: red before (file absent, or no placed blocks), green after
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: CD.40 is in the compact ratified form pointing at dec-199, keeping the one guard-read discipline line.
    verification_step: 1
    test_selector: tests/decisions/test_cd40_ratification_decision.py::test_cd40_ratified_onto_decision_199
    red_green_expectation: red before (file absent, or no placed blocks), green after
  - source: docs/plans/approved/ratify-cd40-agent-turn-capture.yaml
    behavior: The sidecar is the plan-time approved text; it lands with the plan and the build never edits it.
    verification_step: 2
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug ratify-cd40-agent-turn-capture --expect
      895408f196a5a9166a62fa094e397358ea722f70423de734ca0522c293edf9e8  # pragma: allowlist secret
    waiver_reason: Not a behavior-capable source; validate_merge_step guards the sidecar on every PR declaring this plan.
constraints:
  - >-
    Every docs/DECISIONS.md and docs/ROADMAP-PLATFORM.yaml edit is operator-approved text: the build places the
    sidecar's words exactly, fills only {{DATE}}, and never edits them; a needed change is an approved_text plan defect
    (implement-scope-boundary.yaml deviation_trigger.escalation) routed to this plan's owning planning session, "Ratify
    CD.40 as a Decision".
  - >-
    Lane step 2 (Decision 105 execution-time confirmation) stands: before placing any block, the build re-presents all
    four blocks verbatim, {{DATE}} filled, in its own thread and waits for the operator's explicit go-ahead there; plan
    approval is not authorization to write. The digest binding stays the mechanical check that the words did not
    change. Lane step 3's numbering-race re-check does not apply: no number is minted. Lane step 4's ETL is carried
    by rec-autoclose.yml's post-merge "Backfill decisions to warehouse" step (VP 6 reads it back), not a build-run
    --backfill-decisions-md.
  - >-
    No new Decision header, no tier status flip and no criterion flip (lane step 8). No edit to Decision tooling,
    contracts, skills, AGENTS.md or CLAUDE.md. Recs move only through scripts.ops_data_portal (update_rec for the two
    acceptance re-points; closure by the Resolves trailer).
  - No rescue agents or workaround loops (Decision 55); no thread, session or message ids in any repository file (Decision 101).
context:
  - >-
    Decision-scout r1 (superseded new-entry draft): FLAGS_FOUND, 193 of 193 triaged. The operator then chose ratifying
    onto Decision 199 with no new header (2026-11-03), since every clause already lives elsewhere.
  - >-
    Decision-scout r2 (this approach) FLAGS_FOUND (NOTE 199, 105, 181; no WARN, no SPIRIT), each resolved: the line says
    it is "a ratification record, not a clause-1 or clause-5 note" and "condition above" (not "below"); the T3.20 intent
    annotation replaces the dangling trigger pointer; the acceptance map below. CITE: 105, 150, 199, 177, 147, 78, 127,
    174, 213, 84. Decisions triaged: 195 of 195. Roadmap items intersected: 4; CONFLICT: 0; RELATED: 4. Decision 199 is
    7,981 bytes; the line adds 834, so size_governance.accretion_signal's amendment-delta leg WARNs (never fails).
  - >-
    Precedent: Decision 105 pointed five CDs at existing numbers; R1 only needs the header to resolve (Decision 150's
    cd_state_flip row: a pure gate-clear needs no fresh entry).
  - >-
    CD.40's own three-condition trigger is dropped for Decision 199's derived-read-too-costly condition (one aggregate
    question, not two). rec-4833 (Low) watches it; its context carries the 2026-11-02 measurement ((c) holds; (a) about
    6,400 turn rows, an estimate; (b) no qualifying rec) and was re-pointed to that condition on 2026-11-03.
  - >-
    Bundled recs: rec-2509 (ops_sessions name vs telemetry_sessions) and rec-2510 (the audit's imported-row backfill
    design) are settled by the update line. Their acceptances grep CD.40/T3.20 text the compact form removes, so the
    build re-points both, via update_rec before the merge, to
    `bin/venv-python -m pytest tests/decisions/test_cd40_ratification_decision.py::test_decision_199_maps_cd40_clauses -q`
    (a node id, so the Decision 201 junit source evaluates it). Nothing is weakened (Decision
    181): rec-2509's grep (ops_sessions beside telemetry_sessions) maps to the pinned phrase "the audit's ops_sessions,
    not telemetry_sessions"; rec-2510's grep ("imported" in T3.20) maps to "imported-row flag" plus the explicit no-import
    statement, now on the Decision rather than the roadmap item.
  - >-
    Order with PLAN-telemetry-producer-admission-plan-review-capture (merged #1712, unbuilt; closes T3.20 c9): it says
    T3.20 stays in_progress pending CD.40. If this builds first, that build may flip T3.20 complete once c9 is met (its
    owner amends the plan); if second, this PR body names T3.20 unpark-eligible for the bookkeeping walk. T2.15
    (deferred_post_mvp) reactivates on CD.17 reversal and CD.40 ratification; CD.17 is pending, so nothing moves.
  - >-
    Races: unbuilt plans scoping DECISIONS.md or the roadmap rebase over four pure replacements (CD.40's own block, one
    T3.20 intent annotation, one T3.20 progress_note insertion, one line after Decision 199's last annotation). Lambda gating: the roadmap is a
    data-pipeline packaged asset only; data-only edit, deploy-prod-lambdas.yml's paths exclude it (rec-3846). red_overlap
    clear (2026-11-02). Freshness gate: T3.20 is not silently complete (c9 open). plan_obligations' roadmap NEAR_CAP is
    the 500-line class default the roadmap is exempt from (validate_platform_roadmap's 10,000-line ceiling governs);
    this edit shrinks it about 50 lines, so no relief step. Graduated records reading CD.40:
    ops-session-log-roadmap-regrounded passes with the blocks placed (its "clause 1 realized" literal is kept);
    roadmap-blocked-by-transcription-exact is red on base already, not this plan's.
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - docs/plans/approved/ratify-cd40-agent-turn-capture.yaml read
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Re-present the four sidecar blocks verbatim ({{DATE}} filled) to the operator in the build thread and wait for an
    explicit go-ahead (constraint 2); on edits or a no, stop and route an approved_text plan defect.
  - >-
    Place every sidecar block's after-text in docs/DECISIONS.md and docs/ROADMAP-PLATFORM.yaml with {{DATE}} (build
    date, UTC) filled, keeping each block's indentation; run VP step 2.
  - Regenerate the decisions index (VP step 4); run VP step 3.
  - Write tests/decisions/test_cd40_ratification_decision.py per the scope row; run VP step 1.
  - >-
    Re-point rec-2509's and rec-2510's acceptance to `bin/venv-python -m pytest
    tests/decisions/test_cd40_ratification_decision.py::test_decision_199_maps_cd40_clauses -q` through
    scripts.ops_data_portal update_rec (--profile agent_platform) and read both back.
  - >-
    Closure per the implement skill: code review, implementation_declared true, rebase, full tier and --verify-head (VP
    5), push, PR with "Resolves: rec-2509, rec-2510" in the squash body and the T3.20 unpark note; before merging run
    `bin/venv-python -m scripts.session.merge_step premerge --slug ratify-cd40-agent-turn-capture --message-file <f>
    --expect <digest of VP step 2>`, squash-merge on PROCEED plus green CI, then `merge_step readback`; then VP step 6 and tell the coordinator CD.40 is ratified onto Decision 199.
work_areas: []
rollback: >-
  Revert the squash commit (CD.40 returns to pending with its detail; Decision 199 loses the update line) and reopen
  rec-2509 and rec-2510, restoring their original acceptances (rec-2509: `grep -A6 'Aggregate ops_sessions table
  deferred' docs/ROADMAP-PLATFORM.yaml | grep -qi 'telemetry_sessions'`; rec-2510: `awk '/^  - id: T3.20$/,/^  - id:
  T3.21$/' docs/ROADMAP-PLATFORM.yaml | grep -qi 'imported'`); do the same if the PR is abandoned after the re-point. No production, infrastructure or warehouse state changes beyond the ops_decisions backfill
  refreshing dec-199's row.
