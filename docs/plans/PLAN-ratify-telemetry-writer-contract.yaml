schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "ratify-telemetry-writer-contract"
intent: >-
  Re-ratify the telemetry writer's Class B verb contract (docs/contracts/ducklake_telemetry_writer.yaml) from provisional_v0
  to ratified now that its re-ratification trigger (production_invocations >= 500) has been observed, on a production
  traffic census, after declaring the 19 (verb, typed_error) pairs the handler already answers but the contract omits, and
  with a test that pins every declared typed error to a named test and fails when the writer emits an error type no verb
  declares. Make the census's principal divergence true before ratifying: turn capture's writer client signs as PlatformDev
  instead of the ADMIN environment's ambient AWS_PROFILE role, proven live before the merge.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-ratify-telemetry-writer-contract.yaml
phase: >-
  Decision 118 per-contract graduation of a provisional_v0 Class B contract (re_ratification_owner "human + Step 10
  multi-perspective critique"); T2.36 (the writer's tier item) is complete, so no tier_item criterion is claimed. First
  Class B provisional_v0 -> ratified transition in the repo.
scope:
  - file: docs/contracts/ducklake_telemetry_writer.yaml
    action: Modify
    purpose: >-
      Apply execution step 2's patch verbatim: status provisional_v0 -> ratified with ratified_at and ratified_via;
      provisional_v0 gains trigger_observed_at and ratification_census; 19 typed_errors declared and named in response_codes;
      provision_telemetry.payload_schema_ref names both table creators; audit_invariants gain the pre-dispatch and
      enforcement-scope rule, the narrowed no-502 line, the rec-4317, rec-4492 and principal-classes residuals; three amendment_log entries (governance_note_add,
      field_add, prose_improvement).
  - file: tests/checks/contracts/test_telemetry_writer_ratification.py
    action: Create
    purpose: >-
      Class TestWriterContractRatification (seven tests, AST and YAML only, importing no src module): ratified with census;
      TYPED_ERROR_TESTS registry equal to the contract's declared pairs and the contract's verbs equal to the handler's;
      every node resolves and names its error, with the basis anchor rule; shared basis only for handler-wide errors; the
      writer's emitted error types equal the declared union plus the pre-dispatch unknown_action, and every declared error
      is named in its verb's response_codes; an origin table, call-path checked, proves per-verb declarations for shared origins; red cases.
  - file: scripts/telemetry_capture/transport.py
    action: Modify
    purpose: >-
      make_client resolves resolve_aws_profile(DEFAULT_SSO_PROFILE), so turn capture signs the writer as PlatformDev
      (agent_platform) whatever AWS_PROFILE names; CI and Lambda keep the ambient chain (resolve_aws_profile returns None
      when environment keys are set). Its docstring is updated in place.
  - file: tests/telemetry_capture/test_capture_profile.py
    action: Create
    purpose: >-
      Class TestCaptureSignsAsPlatformDev: with AWS_PROFILE=agent_platform_admin and no ambient keys, make_client opens its
      boto3 Session under agent_platform; with AWS_ACCESS_KEY_ID set it passes None (CI). A new file keeps
      test_transport.py unchanged.
  - file: docs/plans/PLAN-ratify-telemetry-writer-contract.yaml
    action: Create
    purpose: This planning artefact.
bundled_recommendations: []
followon_recs:
  - rec-4706
  - rec-4707
  - rec-4712
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    docs/contracts/ducklake_telemetry_writer.yaml equals execution step 2's patch applied to its pre-build text with
    <BUILD_DATE> filled, and loads through scripts.contracts.load_contract at status ratified, contract_version 1, with
    ratified_at and a ratified_via naming Benjamin's approval, PLAN-ratify-telemetry-writer-contract and Decision 118;
    evaluate_provisional_trigger returns (False, None) for it.
  - >-
    The contract declares 71 (verb, typed_error) pairs; every declared error is named in its verb's response_codes; the
    newest amendment_log entry is governance_note_add with semantic_break false, followed by the field_add and
    prose_improvement entries.
  - >-
    tests/checks/contracts/test_telemetry_writer_ratification.py::TestWriterContractRatification passes, and its helpers
    report a problem for each red case of execution step 3 (an undeclared emitted error type, a declared error nothing
    emits, a missing or extra registry pair, an unresolved node, a node naming another error, a verb row whose anchor is
    not called, a shared row for a non-handler-wide error, an origin pair the contract omits, a listed verb with no call path
    to its origin).
  - >-
    transport.make_client resolves agent_platform under AWS_PROFILE=agent_platform_admin and passes None when
    AWS_ACCESS_KEY_ID is set (tests/telemetry_capture/test_capture_profile.py::TestCaptureSignsAsPlatformDev).
  - The CD.25 contract-drift gate passes (no forbidden transition, no unrecorded description change) in the full tier.
  - >-
    Before the merge, a telemetry_probe sent through the build branch's capture transport from this ADMIN-environment
    session reaches the production writer signed as PlatformDev (its C6 line's caller_role), not PlatformAdmin.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Run the capture-profile class. It does not exist today, so red-before replay sees pytest exit 4; after the change its
      two tests pass.
    command: bin/venv-python -m pytest tests/telemetry_capture/test_capture_profile.py::TestCaptureSignsAsPlatformDev -q
    expected: exit 0, two tests passed. Before the change pytest reports the class not found.
    fix_if: >-
      make_client still opens its Session under agent_platform_admin -- pass DEFAULT_SSO_PROFILE. CI case not None -- the
      call must go through resolve_aws_profile, never a hard-coded profile_name. Never change resolve_aws_profile's
      precedence (rec-4707 owns the shared resolver).
    hermetic: true
    expected_literals: ["2 passed"]
    graduation: graduate
    graduation_check_id: capture-signs-as-platform-dev
  - step: 2
    phase: pre-deploy
    action: >-
      Run the ratification class: contract ratified with census, registry equal to the declared pairs, nodes resolve and
      name their errors under the anchor rule, bases allowed, emitted equals declared, origin table holds, red cases.
      Absent today (exit 4).
    command: bin/venv-python -m pytest tests/checks/contracts/test_telemetry_writer_ratification.py::TestWriterContractRatification -q
    expected: exit 0, seven tests passed. Before the change pytest reports the class not found.
    fix_if: >-
      A pair with no node that meets the evidence rule (execution step 3) -- STOP and report the pair: never ratify an
      unasserted error, never drop the error from the contract, never widen the shared set to pass. An emitted error type
      the contract does not declare, or a declared one nothing emits -- STOP and report it (the patch is approved text).
      A node that does not resolve or does not name its error -- pick the correct node from the seed or the tests.
    hermetic: true
    expected_literals: ["7 passed"]
    graduation: graduate
    graduation_check_id: telemetry-writer-contract-ratified
  - step: 3
    phase: pre-deploy
    action: >-
      Re-run the existing guards and suites that read the edited contract or the edited capture module, to prove the edit
      kept them green.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/ tests/lambdas/ducklake_telemetry_writer/
      tests/checks/iam_tf/test_telemetry_reader_and_twin_pins.py tests/checks/iam_tf/test_telemetry_catalog_deploy_output.py
      tests/checks/iam_tf/test_telemetry_infra_pins.py tests/checks/iam_tf/test_ducklake_writer_error_alarms.py
      tests/convergence_health/code_drift/test_ducklake.py tests/common/test_ducklake_telemetry_provision.py
      tests/lambda_manifest/test_bundle_checks.py tests/telemetry_capture/test_transport.py -q
    expected: exit 0, no failures, before and after the change (the patch was dry-run against these at planning time).
    fix_if: >-
      A guard fails -- the patch changed text a guard pins; report it (the patch is approved text, so any change to it is
      a new approval). Never edit a guard to pass.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A no-regression re-run of existing standing test directories and files (green before and after by design), which
      hermetic_authoring rule (v) keeps non-hermetic.
  - step: 4
    phase: pre-deploy
    action: >-
      Prove the status transition and trigger state through the real contract machinery, outside the new tests: the loader,
      the Invariant-6 transition table and the provisional-trigger evaluator.
    command: >-
      bin/venv-python -c "from scripts.contracts import load_contract, validate_status_transition; from
      scripts.contracts_enforcement import evaluate_provisional_trigger, check_re_ratification_trigger; d =
      load_contract('docs/contracts/ducklake_telemetry_writer.yaml'); c = d.contract; assert c.status.value == 'ratified'
      and c.contract_version == 1, c.status; assert 'PLAN-ratify-telemetry-writer-contract' in c.ratified_via and
      'Decision 118' in c.ratified_via; assert c.ratified_at; assert validate_status_transition('provisional_v0',
      'ratified'); assert evaluate_provisional_trigger(d, {'production_invocations': 10**9}) == (False, None); assert
      check_re_ratification_trigger(d) == []; assert c.provisional_v0['trigger_observed_at'] == '2026-10-29';
      print('WRITER_CONTRACT_RATIFIED', c.ratified_at)"
    expected: Prints WRITER_CONTRACT_RATIFIED and the ratified_at date; exit 0. Today it fails on the status assertion.
    fix_if: An AssertionError names the field; compare the contract with execution step 2's patch.
    hermetic: true
    expected_literals: ["WRITER_CONTRACT_RATIFIED"]
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates step 2's graduated test_contract_is_ratified_with_census, which pins the same status, ratified_via and
      provisional_v0 fields as a standing regression guard.
  - step: 5
    phase: pre-deploy
    action: >-
      Full-tier handoff on the committed, rebased, clean tree (git-ops.yaml handoff_sequence): the CD.25 contract-drift gate
      checks the provisional_v0 -> ratified transition and the amendment record, plus every other gate; then attest HEAD.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      exit 0; the Validation Summary lists no failure (Contract drift (CD.25) PASS) and --verify-head attests the checked
      HEAD's tree.
    fix_if: >-
      A failure in scope is fixed on the branch, committed, and this step re-run from the start; one outside scope becomes a
      rec via scripts.ops_data_portal (Decision 59, Decision 55). Never skip or weaken a check.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Live principal proof BEFORE the merge (the ratification cannot be reverted; the capture fix runs from this checkout):
      on the pushed build branch, in this ADMIN-environment session (AWS_PROFILE is agent_platform_admin here), send one
      telemetry_probe through the branch's capture transport for this session's own transcript (the newest-modified one,
      since this session is writing it), then read the production writer's C6 lines for telemetry_probe from the probe's
      start onward with the PlatformDev profile and count them by caller_role. Read-only verbs; no admin credential is used
      for the read.
    command: >-
      T0=$(date +%s); bin/venv-python -m scripts.telemetry_capture probe --tree "$(ls -t ~/.claude/projects/*/*.jsonl | head
      -1)"; T0="$T0" bin/venv-python -c "import boto3, json, os, collections; logs =
      boto3.Session(profile_name='agent_platform').client('logs', region_name='eu-west-2'); r =
      logs.get_paginator('filter_log_events').paginate(logGroupName='/aws/lambda/agent-platform-ducklake-telemetry-writer',
      startTime=(int(os.environ['T0']) - 5) * 1000, filterPattern='telemetry_probe'); rows = [json.loads(e['message']) for
      page in r for e in page['events'] if e['message'].startswith('{')]; c = collections.Counter(x.get('caller_role') for x in rows if
      x.get('verb') == 'telemetry_probe'); print('PROBE_CALLERS', dict(c)); assert c.get('PlatformDev', 0) >= 1 and
      c.get('PlatformAdmin', 0) == 0, c"
    expected: >-
      The probe prints per-table grain counts (rows may be zero; the probe's own exit status is not the assertion).
      PROBE_CALLERS shows at least one PlatformDev and zero PlatformAdmin, and the closing assertion passes (exit 0). Allow up
      to a minute for log delivery and re-run only the read if it is empty.
    fix_if: >-
      "probe: no cursor for this tree" -- the newest transcript has no capture cursor yet; run
      `bin/venv-python -m scripts.telemetry_capture status --tree <path>` on this session's transcript, pass that path, and
      re-run. PlatformAdmin present -- confirm git log shows the fix on this checkout and that the PlatformAdmin line is not
      another session's probe in the same window (another ADMIN session on an older checkout); re-run once, then report.
      No telemetry_probe line -- the probe never reached the writer (read its printed reason); re-run once, then report.
      Never use admin credentials for the read.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/contracts/ducklake_telemetry_writer.yaml
    behavior: >-
      The writer contract stays ratified with its census, its declared typed errors stay equal to the error types the
      writer emits (plus the pre-dispatch unknown_action), and every declared typed error stays pinned to a test that names
      it (a new error without a declaration or a registered node fails).
    verification_step: 2
    test_selector: tests/checks/contracts/test_telemetry_writer_ratification.py::TestWriterContractRatification
    red_green_expectation: >-
      red before, green after -- the class does not resolve today (pytest exit 4) and its seven tests pass once the
      contract edit and test land.
  - source: scripts/telemetry_capture/transport.py
    behavior: make_client opens its boto3 Session under agent_platform whatever AWS_PROFILE names; None on CI.
    verification_step: 1
    test_selector: tests/telemetry_capture/test_capture_profile.py::TestCaptureSignsAsPlatformDev
    red_green_expectation: red before (class absent, exit 4), green after.
