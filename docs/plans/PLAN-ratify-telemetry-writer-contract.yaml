execution_steps:
  - >-
    1. Capture profile: in scripts/telemetry_capture/transport.py make_client, call resolve_aws_profile(DEFAULT_SSO_PROFILE)
    (import DEFAULT_SSO_PROFILE from scripts.aws_profile on the existing import line), and update its docstring to say the
    agent_platform profile is pinned and the ambient AWS_PROFILE is not honoured (environment keys still win, for CI).
    Create tests/telemetry_capture/test_capture_profile.py with class TestCaptureSignsAsPlatformDev (two tests: under
    AWS_PROFILE=agent_platform_admin make_client opens agent_platform; with AWS_ACCESS_KEY_ID set it passes None). Fake
    boto3 the way tests/telemetry_capture/test_transport.py already does; monkeypatch env, never the real chain.
  - |
    2. Contract text: apply this patch to docs/contracts/ducklake_telemetry_writer.yaml VERBATIM, with every <BUILD_DATE>
    replaced by the build commit's UTC date (YYYY-MM-DD). It is the approved text. Extract and apply it with:
    bin/venv-python -c "import sys, yaml; s = yaml.safe_load(open('docs/plans/PLAN-ratify-telemetry-writer-contract.yaml'))['execution_steps'][1]; open(sys.argv[2], 'w').write(s[s.index('\ndiff --git') + 1:].replace('<BUILD_DATE>', sys.argv[1]))" "$(date -u +%F)" "${TMPDIR:-/tmp}/contract.patch" && git apply "${TMPDIR:-/tmp}/contract.patch"
    If git apply refuses (the contract changed on main since planning), stop and ask: the text needs re-approval.
