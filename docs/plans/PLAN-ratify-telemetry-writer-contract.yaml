  - >-
    No Lambda code change: rec-4317 and rec-4492 stay open as declared residuals. No IAM, terraform, Neon or secret change;
    no admin credential use (PlatformDev-default rule, Benjamin 2026-10-29).
  - >-
    PUBLIC repository (Decision 101): no account id, ARN, principal ref or hash of either in the contract, tests, commit or
