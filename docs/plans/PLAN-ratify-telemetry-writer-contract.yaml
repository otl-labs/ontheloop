    approval: stop and ask.
  - >-
    Never add PlatformAdmin to contract.governance.principal_classes (Decision 113 two-principal semantic; Decision 144
    cl.3; tenant-id.yaml producer identity note; rec-4420 owns admitting new producer identities). Outside the patch,
    principal_classes, every verb, request shape, response code and typed error stay byte-identical.
  - >-
    Never change scripts/aws_profile.py's precedence and do not touch scripts/telemetry_capture/verify.py,
    scripts/telemetry_capture/read_route.py or src/common/ducklake_reader_client.py: the read paths (including verify's
    credentials_available gate, which must keep resolving the same profile as the read it guards) and the shared resolver
