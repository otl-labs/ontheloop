schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: read-set-report
intent: >-
  Make the cost of the instruction surface readable without an audit: one measure-only report prints the bytes a
  planning run and an implementing run are sent to read, by band (always read, gate sub-agent, on demand), with both
  readings of the judgment-banded files and the stored 2026-08-07 and audited-commit baselines beside today's figures
  (rec-5256; contract-first retrospective CFR-04, CFR-07). It fails nothing; its numbers feed rec-5259's abort test and
  rec-3250's before/after.
plan_type: IMPLEMENTATION
implementation_declared: false
verification_tier: V2
plan_path: docs/plans/PLAN-read-set-report.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Executes rec-5256 from the contract-first retrospective (audits/contract-first-retrospective-177c8f37.yaml, #2093).
  T3.14 (deferred) measures reachable source lines, not read-sets, and does not own this. No Lambda-packaged file.
closes_criteria: []
cites: [dec:128, dec:131, dec:201]
scope:
  - file: config/agent/read_sets.yaml
    action: Create
    purpose: >-
      The band table, data only (advisor Q2: not the contract, whose header holds only check-time maps, and not code).
      Header comment: the three band definitions and the precedence rule (always_read, then gate_subagent, then
      on_demand), from the audit prompt's Q2, and the edit rule: any change to a run's files rows recomputes that run's
      stored baselines in the same change (the recompute test enforces it). Top level `runs:` with two keys. Each run
      has `entry_files` (the files the drift scan reads: planning = .claude/commands/plan.md and
      .claude/skills/planning/SKILL.md; implementing = .claude/commands/implement.md and
      .claude/skills/implement/SKILL.md), `files` (rows {path, band, alt_band?, basis}; basis is a file:line pointer), `extra`
      (rows {path, when?}: read targets kept outside every total, the audit's extra_files convention), `exclude`
      (rows {path, reason}: named paths that are not read targets, e.g. named only as an output or a validator), and `baselines` (rows {boundary, ref, totals per
      band for both readings}). planning.files: the audit's 16 with its bands
      (metrics.planning_context_footprint.band_assignment), alt_band on_demand on docs/contracts/file-router.yaml,
      docs/contracts/git-ops.yaml and docs/contracts/project-alignment.yaml (meta.contract_notes 3). implementing.files:
      the audit's 17 (Q2 answer; enumerated here since the audit gives only its naming rule: .claude/commands/implement.md,
      .claude/skills/implement/SKILL.md, AGENTS.md; docs/contracts/ candidate-decision-ratification, ci-rca-lifecycle,
      exit-criteria-ledger, git-ops, implement-scope-boundary, overseer-dispatch, recommendation-relevance,
      tier-item-lifecycle, verification-registry and deploy-paths (.yaml); .claude/skills/ overseer, code-review,
      planning and executor-rca (SKILL.md); 497,688 bytes at 177c8f37) plus CLAUDE.md
      and docs/PROJECT_CONTEXT.md (ambient; implement.md:44 reads it every run; the audit's path rule left them out),
      19 rows: always_read = CLAUDE.md, AGENTS.md, implement.md, implement SKILL.md, PROJECT_CONTEXT.md and git-ops.yaml
      (alt_band on_demand); gate_subagent = .claude/skills/code-review/SKILL.md; on_demand = the other twelve.
      baselines: e871e89100ebd1ee77af675139c85b8b63a8b96c (2026-08-07 boundary, Script A's rule) and
      177c8f376dc4b0d93208f1f737271d868a4a18eb (audited commit), stored as full 40-hex SHAs, each computed with
      this table by the module itself at build time and pasted, never typed from the audit. extra and exclude are
      filled at build so that the drift scan at the build's HEAD lists no unlisted path: every path it reports goes to
      extra (a read target, with `when` where the workflow states a condition; the audit's extra_files rows give the
      wording for those it covers) or to exclude (with the reason).
  - file: scripts/roadmap/read_set_report.py
    action: Create
    purpose: >-
      load_read_sets(path) -> (data, error), never raises. file_sizes(root, ref=None): working-tree byte sizes with the
      tracked set from `git -C <root> ls-files`, or `git -C <root> ls-tree -r -l <ref>` sizes and paths (the audit's
      Script A method); an absent banded file is 0 (no message). In ref mode the entry files are read at the same ref
      (`git show <ref>:<path>`), so the drift scan describes that tree's workflow.
      named_paths(text, tracked): the one-hop drift scan (tracked = the set file_sizes returns) -- repository-relative paths, bare docs/contracts basenames,
      and skills named by name ("`<name>` skill" or "<name> skill", resolved to .claude/skills/<name>/SKILL.md when
      tracked) in an entry file that resolve to a tracked read target (.md, .yaml, .yml, .json; never docs/plans/,
      logs/, or Python); no recursion into named files. build_read_set_report(root, ref=None, files=False) -> str: per run, one line per band
      with bytes, the total and tokens as the audit's token_estimate, (always_read + gate_subagent) // 4 (audit prompt
      Q2 :421-422: what the root agent and its gate sub-agents read in full; on_demand is outside it), the same for the alternative reading, the stored baselines with the
      delta to today, the extra rows' total (outside totals), and each unlisted named path with its bytes (neither in
      files, extra nor exclude), or the line '<run> unlisted: none' when there are none. Fixed line format, integers
      without separators, so measured and stored figures never share a prefix: '<run> @<label> primary
      always_read=<n> gate_subagent=<n> on_demand=<n> total=<n> tokens=<n>' and the same with 'alternative' (label =
      the --ref value as given, else 'worktree'); stored rows as '<run> baseline <boundary> <reading> ...' with a
      'delta_total=<+/-n>' field; '<run> extra total=<n>'; '<run> unlisted <path> <bytes>'. --files adds one row per banded file: path, band, alt_band (or -), bytes. main(argv): the module's own advisory CLI (`bin/venv-python -m
      scripts.roadmap.read_set_report [--ref REF] [--files] [--config PATH] [--root DIR]`; --root defaults to the
      repository root, so tests point it at a tmp git repo and never depend on cwd), always returns 0. A malformed config,
      an unreadable ref or a git failure is a printed line, never an exception or a non-zero exit. Standalone, not a
      plan_obligations mode: tests/test_plan_obligations.py (that module's mirror home, Decision 131) has 2 SLOC of
      headroom (Decision 128) and the unbuilt PLAN-wording-approval-routing scopes both files. Not preflight: see the
      home fork line in context.
  - file: tests/test_read_set_report.py
    action: Create
    purpose: >-
      test_read_set_bytes_reported_by_band (rec-5256's acceptance node, amended to this path at planning):
      main(['--root', <tmp git repo>, '--config', <tmp config>]) over a committed tmp tree prints each band's bytes for both runs and both readings and returns 0. Also: band
      sums and the alternative reading; --ref on a tmp git repo with two commits (the fixture sets commit.gpgsign false and a local user.name and user.email, as tests/test_plan_wording_check.py:53 does, so the graduated node never depends on a signer or identity); an absent file counts 0; a malformed
      or missing config and an unknown ref each print a line and return 0; the drift scan lists an unbanded named
      path, resolves a skill named by name, and skips files, extra and exclude rows and anything outside the read-target
      classes; the real config loads and every run has the three bands present; and the stored baselines equal a
      recompute at their refs with the real config (pytest.skip only when `git cat-file -e <ref>` fails; CI's
      pr-validate and main-validate check out with fetch-depth 0, so it runs there). No standing test pins the table to
      the audit (later owners may add or re-band rows; VP step 3 checks the audit reproduction once). The file covers read_set_report.py to 100% lines (validate_test_coverage, full tier; Decision
      131 mirror home).
bundled_recommendations:
  - rec-5256
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - bin/venv-python -m scripts.roadmap.read_set_report prints, for planning and implementing, the always_read, gate_subagent and on_demand bytes, the total and the alternative reading, the stored baselines with deltas, and exits 0.
  - With --ref 177c8f37 the measured planning line reproduces the audit exactly (541,865 = 193,734 / 232,354 / 115,777; alternative reading always_read 89,129, on_demand 220,382) and the implementing total is 511,608 (the audit's 17 at 497,688 plus CLAUDE.md 11 and docs/PROJECT_CONTEXT.md 13,909); with --ref e871e891 planning reads 340,247 with always_read 137,615 and implementing 280,589 (266,582 plus 11 and 13,996).
  - The report fails nothing -- a malformed or missing config file and an unreadable ref each print a line and exit 0 -- and no check, gate, workflow or budget reads it.
  - At the build's HEAD the drift scan lists no unlisted path for either run.
  - rec-5256's acceptance command exits 0, and rec-5256 reads closed after the merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5256's acceptance node -- the CLI reports read-set bytes by band for both runs (new node).
    command: bin/venv-python -m pytest tests/test_read_set_report.py::test_read_set_bytes_reported_by_band -q
    expected: exit 0; red before (the test file does not exist on main).
    expected_literals:
      - ' passed'
    fix_if: a band line is missing, a run is missing, the alternative reading is absent, or the CLI returns non-zero
    hermetic: true
    graduation: graduate
    graduation_check_id: read-set-report-by-band
  - step: 2
    phase: pre-deploy
    action: The module's unit tests -- sums, ref mode, fail-nothing paths, drift scan incl. skill names, stored baselines equal a recompute.
    command: bin/venv-python -m pytest tests/test_read_set_report.py -q
    expected: all pass; red before (file absent). The baseline-recompute test runs (full history locally and in CI, fetch-depth 0).
    fix_if: any test fails; never loosen a sum or a band to pass -- fix the table or the code, and recompute baselines after any row change
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole-file re-run of a test file this plan creates (vp-red-before hermetic_authoring carve-out); step 1's graduated node is the standing guard, and the file runs as read_set_report.py's coverage mirror on every change to it.
  - step: 3
    phase: pre-deploy
    action: The report on the real repo at the two audit boundaries reproduces the audit's figures (planning exactly; implementing as the audit's 17 plus the two added rows).
    command: >-
      bin/venv-python -m scripts.roadmap.read_set_report --ref 177c8f37 | tee /tmp/rsr-audited.txt
      && grep -Eq '^planning @177c8f37 primary always_read=193734 gate_subagent=232354 on_demand=115777 total=541865 tokens=106522$' /tmp/rsr-audited.txt
      && grep -Eq '^planning @177c8f37 alternative always_read=89129 gate_subagent=232354 on_demand=220382 total=541865 tokens=80370$' /tmp/rsr-audited.txt
      && grep -Eq '^implementing @177c8f37 primary .* total=511608 ' /tmp/rsr-audited.txt
      && bin/venv-python -m scripts.roadmap.read_set_report --ref e871e891 | tee /tmp/rsr-0807.txt
      && grep -Eq '^planning @e871e891 primary always_read=137615 gate_subagent=138578 on_demand=64054 total=340247 tokens=69048$' /tmp/rsr-0807.txt
      && grep -Eq '^implementing @e871e891 primary .* total=280589 ' /tmp/rsr-0807.txt
      && echo AUDIT_FIGURES_REPRODUCED
    expected: AUDIT_FIGURES_REPRODUCED -- each grep is anchored on a measured '@<ref>' line, so the stored 'baseline' lines cannot satisfy it
    fix_if: a measured line differs -- the rows or bands drifted from the audit's band_assignment and Q2 set, sizes are not read from git ls-tree at the ref, or the line format differs from the scope row's
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A one-time multi-command reproduction of the audit's numbers (moment claim, Decision 244 cl.4); later owners may re-band or add rows, and step 2's recompute test is the standing guard that the table and its stored baselines agree.
  - step: 4
    phase: pre-deploy
    action: Measure-only holds (no check, workflow or budget reads the report or its table) and the drift scan at HEAD lists nothing unlisted.
    command: >-
      { rg -l 'read_set_report|read_sets\.yaml' scripts/checks scripts/validate.py scripts/session scripts/preflight
      .github/workflows config/prose_budgets.yaml config/sloc_budgets.yaml config/structural_size_budgets.yaml; test $? -eq 1; }
      && bin/venv-python -m scripts.roadmap.read_set_report > /tmp/rsr-head.txt
      && test "$(grep -c 'unlisted: none' /tmp/rsr-head.txt)" -eq 2 && echo MEASURE_ONLY_AND_NO_DRIFT
    expected: MEASURE_ONLY_AND_NO_DRIFT
    fix_if: a gate, workflow or budget names the report (remove it; out of scope), or a run lists an unlisted path (add it to extra or exclude with its reason)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The no-drift leg is a moment claim on the current workflow text (Decision 244 cl.4), and the sweep reads this tree's wiring at build time.
  - step: 5
    phase: pre-deploy
    action: Today's report on the working tree, pasted into the PR body as the first post-change reading (rec-5259 reads it).
    command: bin/venv-python -m scripts.roadmap.read_set_report --files; echo EXIT=$?
    expected: both runs' band lines, alternative reading, baselines with deltas, extra total, per-file rows and the unlisted line, then EXIT=0
    fix_if: a section is missing or the exit is non-zero
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Its output is a reading of the current tree (moment claim, Decision 244 cl.4); step 1 guards the shape.
  - step: 6
    phase: pre-deploy
    action: >-
      Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it
      from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start; a timed-out or incomplete full tier is BLOCKED (handoff_policy timeout_disposition) and nothing is pushed
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and step 1 carries the durable regression.
  - step: 7
    phase: post-deploy
    action: rec-5256 closed by the squash commit's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows,missing=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-5256']);
      s={r['id']:r['status'] for r in rows}; print(s); assert not missing and s.get('rec-5256')=='closed'; print('REC_CLOSED')"
    expected: REC_CLOSED
    fix_if: the rec reads open after the trailer-closure job; check the job, never close by hand without its evidence
    hermetic: false
test_obligations:
  - source: scripts/roadmap/read_set_report.py
    behavior: sums read-set bytes by band at the tree or a ref, prints both readings, baselines and drift, and never raises or fails
    verification_step: 1
    test_selector: tests/test_read_set_report.py::test_read_set_bytes_reported_by_band
    red_green_expectation: red before (file absent), green after
  - source: config/agent/read_sets.yaml
    behavior: the table loads with all three bands per run, and its stored baselines equal a recompute at their refs
    verification_step: 2
    test_selector: tests/test_read_set_report.py
    red_green_expectation: red before (file absent), green after
constraints:
  - "Measure-only (rec-5256): no gate, no registered check, no budget; nothing reads the report's numbers to fail a run."
  - No Decision text, no contract edit, no AGENTS.md, command or skill edit (the ambient prose budgets have zero headroom).
  - Baseline numbers in read_sets.yaml are computed by the module at their refs at build time, never typed from the audit.
  - Decompose rather than raise if any Python file nears its SLOC budget (Decision 128).
  - No rescue agents or workaround loops (Decision 55).
