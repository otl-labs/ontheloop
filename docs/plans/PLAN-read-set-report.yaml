pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read (128, 131)
  - All files in scope located and readable; audits/contract-first-retrospective-177c8f37.yaml band_assignment and Q2 answer read
  - Acceptance criteria understood and verifiable
execution_steps:
  - 1. Write tests/test_read_set_report.py first and confirm step 1 is red on main.
  - 2. Write scripts/roadmap/read_set_report.py (scope row), then config/agent/read_sets.yaml without baselines.
  - 3. Compute each baseline row with the module at its ref (python -m scripts.roadmap.read_set_report --ref <ref>) and paste the numbers into read_sets.yaml; confirm VP step 3 reproduces the audit's planning figures.
  - "4. Execute Verification Plan steps 1-4; loop until pass. Paste step 4's output into the PR body. On an unrecoverable failure stop and RCA (Decision 55)."
  - >-
    5. Commit Flow (implement skill; git-ops.yaml handoff_sequence and resolves_trailer). The commit body carries
    Resolves: rec-5256. Rebase onto origin/main, then step 5 (full tier and --verify-head) on the rebased clean HEAD;
    push, PR, subscribe; merge under standing_authorisation on code review PROCEED and green CI.
  - 6. Post-merge step 6 once the trailer-closure job has run.
  - 'Report: what was implemented, the step 4 reading, verification results, the merge SHA and the rec closure read-back.'
rollback: Revert the merge commit; nothing is stored, deployed or gated.
