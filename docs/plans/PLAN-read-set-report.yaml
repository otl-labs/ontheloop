schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: read-set-report
intent: >-
  Make the cost of the instruction surface readable without an audit: one measure-only report prints the bytes a
  planning run and an implementing run are sent to read, by band (always read, gate sub-agent, on demand), with both
  readings of the judgment-banded files and the stored 2026-08-07 and audited-commit baselines beside today's figures
  (rec-5256; contract-first retrospective CFR-04, CFR-07). It fails nothing; its numbers feed rec-5259's abort test and
  rec-3250's before/after.
plan_type: IMPLEMENTATION
implementation_declared: false
verification_tier: V2
plan_path: docs/plans/PLAN-read-set-report.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Executes rec-5256 from the contract-first retrospective (audits/contract-first-retrospective-177c8f37.yaml, #2093).
  T3.14 (deferred) measures reachable source lines, not read-sets, and does not own this. No Lambda-packaged file.
closes_criteria: []
cites: [dec:128, dec:131, dec:201]
scope:
  - file: config/agent/read_sets.yaml
    action: Create
    purpose: >-
      The band table, data only (advisor Q2: not the contract, whose header holds only check-time maps, and not code).
      Header comment: the three band definitions and the precedence rule (always_read, then gate_subagent, then
      on_demand), from the audit prompt's Q2. Top level `runs:` with two keys. Each run has `entry_files` (the files
      the drift scan reads), `files` (rows {path, band, alt_band?, basis}; basis is a file:line pointer), `extra`
      (rows {path, when?}: read targets kept outside every total, the audit's extra_files convention), `exclude`
      (rows {path, reason}: named paths that are not read targets), and `baselines` (rows {boundary, ref, totals per
      band for both readings}). planning.files: the audit's 16 with its bands
      (metrics.planning_context_footprint.band_assignment), alt_band on_demand on docs/contracts/file-router.yaml,
      docs/contracts/git-ops.yaml and docs/contracts/project-alignment.yaml (meta.contract_notes 3). implementing.files:
      the audit's 17 (Q2 answer: implement.md, implement SKILL.md, AGENTS.md, ten contracts, four skills) plus CLAUDE.md
      and docs/PROJECT_CONTEXT.md (ambient; implement.md:44 reads it every run; the audit's path rule left them out),
      19 rows: always_read = CLAUDE.md, AGENTS.md, implement.md, implement SKILL.md, PROJECT_CONTEXT.md and git-ops.yaml
      (alt_band on_demand); gate_subagent = .claude/skills/code-review/SKILL.md; on_demand = the other twelve.
      baselines: e871e891 (2026-08-07 boundary, Script A's rule) and 177c8f37 (audited commit), each computed with
      this table by the module itself at build time and pasted, never typed from the audit.
  - file: scripts/roadmap/read_set_report.py
    action: Create
    purpose: >-
      load_read_sets(path) -> (data, error), never raises. file_sizes(root, ref=None): working-tree byte sizes, or
      `git ls-tree -r -l <ref>` sizes (the audit's Script A method); an absent file is 0. named_paths(text,
      tracked): the one-hop drift scan -- repository-relative paths and bare docs/contracts basenames in an entry file
      that resolve to a tracked read target (.md, .yaml, .yml, .json; never docs/plans/, logs/, or Python), no
      recursion into named files. build_read_set_report(root, ref=None, files=False) -> str: per run, one line per band
      with bytes, the total and tokens as bytes/4, the same for the alternative reading, the stored baselines with the
      delta to today, the extra rows' total (outside totals), and each unlisted named path with its bytes (neither in
      files, extra nor exclude). main(argv): the module's own advisory CLI (`bin/venv-python -m
      scripts.roadmap.read_set_report [--ref REF] [--files] [--config PATH]`), always returns 0. A malformed config,
      an unreadable ref or a git failure is a printed line, never an exception or a non-zero exit. Standalone, not a
      plan_obligations mode: tests/test_plan_obligations.py (that module's mirror home, Decision 131) has 2 SLOC of
      headroom (Decision 128) and the unbuilt PLAN-wording-approval-routing scopes both files.
  - file: tests/test_read_set_report.py
    action: Create
    purpose: >-
      test_read_set_bytes_reported_by_band (rec-5256's acceptance node, amended to this path at planning): main([])
      over a tmp tree and config prints each band's bytes for both runs and both readings and returns 0. Also: band
      sums and the alternative reading; --ref on a tmp git repo with two commits; an absent file counts 0; a malformed
      or missing config and an unknown ref each print a line and return 0; the drift scan lists an unbanded named
      path and skips files, extra and exclude rows and anything outside the read-target classes; the real config's
      planning rows equal the audit's 16 paths and bands and its implementing rows hold the audit's 17 plus the two;
      and the stored baselines equal a recompute at their refs (pytest.skip when `git cat-file -e <ref>` fails, as in a
      shallow checkout). The file covers read_set_report.py to 100% lines (validate_test_coverage, full tier; Decision
      131 mirror home).
bundled_recommendations:
  - rec-5256
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - bin/venv-python -m scripts.roadmap.read_set_report prints, for planning and implementing, the always_read, gate_subagent and on_demand bytes, the total and the alternative reading, the stored baselines with deltas, and exits 0.
  - With --ref 177c8f37 the planning figures reproduce the audit exactly (541,865 = 193,734 / 232,354 / 115,777); with --ref e871e891 planning reads 340,247 with always_read 137,615.
  - The report fails nothing -- a malformed config, a missing file and an unreadable ref each print a line and exit 0 -- and no check, gate or budget reads it.
  - rec-5256's acceptance command exits 0, and rec-5256 reads closed after the merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-5256's acceptance node -- the CLI reports read-set bytes by band for both runs (new node).
    command: bin/venv-python -m pytest tests/test_read_set_report.py::test_read_set_bytes_reported_by_band -q
    expected: exit 0; red before (the test file does not exist on main).
    expected_literals:
      - ' passed'
    fix_if: a band line is missing, a run is missing, the alternative reading is absent, or the CLI returns non-zero
    hermetic: true
    graduation: graduate
    graduation_check_id: read-set-report-by-band
  - step: 2
    phase: pre-deploy
    action: The module's unit tests -- sums, ref mode, fail-nothing paths, drift scan, real-config shape, stored baselines.
    command: bin/venv-python -m pytest tests/test_read_set_report.py -q
    expected: all pass; red before (file absent). The baseline-recompute test passes here (full history) and may skip in a shallow CI checkout.
    expected_literals:
      - ' passed'
    fix_if: any test fails; never loosen a sum or a band to pass -- fix the table or the code
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Step 1's graduated node is the standing guard for the report's contract; the whole-file run adds unit detail the coverage mirror already runs in --pre.
  - step: 3
    phase: pre-deploy
    action: The report on the real repo at the two audit boundaries reproduces the audit's planning figures.
    command: >-
      bin/venv-python -m scripts.roadmap.read_set_report --ref 177c8f37 | tee /tmp/rsr-audited.txt
      && grep -q 541865 /tmp/rsr-audited.txt && grep -q 193734 /tmp/rsr-audited.txt && grep -q 232354 /tmp/rsr-audited.txt
      && grep -q 115777 /tmp/rsr-audited.txt
      && bin/venv-python -m scripts.roadmap.read_set_report --ref e871e891 | tee /tmp/rsr-0807.txt
      && grep -q 340247 /tmp/rsr-0807.txt && grep -q 137615 /tmp/rsr-0807.txt && echo AUDIT_FIGURES_REPRODUCED
    expected: AUDIT_FIGURES_REPRODUCED (byte counts printed without thousands separators)
    fix_if: a figure differs -- the planning rows or bands drifted from the audit's band_assignment, or sizes are not read from git ls-tree at the ref
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Needs full git history (both refs), absent in a shallow CI checkout; step 2's baseline-recompute test guards the same sums wherever history exists.
  - step: 4
    phase: pre-deploy
    action: Today's report on the working tree, pasted into the PR body as the first post-change reading (rec-5259 reads it).
    command: bin/venv-python -m scripts.roadmap.read_set_report --files; echo EXIT=$?
    expected: both runs' band lines, alternative reading, baselines with deltas, extra total and the unlisted list, then EXIT=0
    fix_if: a section is missing or the exit is non-zero
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Its output is a reading of the current tree (moment claim, Decision 244 cl.4); step 1 guards the shape.
  - step: 5
    phase: pre-deploy
    action: >-
      Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it
      from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and step 1 carries the durable regression.
  - step: 6
    phase: post-deploy
    action: rec-5256 closed by the squash commit's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      rows,missing=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-5256']);
      s={r['id']:r['status'] for r in rows}; print(s); assert not missing and s.get('rec-5256')=='closed'; print('REC_CLOSED')"
    expected: REC_CLOSED
    fix_if: the rec reads open after the trailer-closure job; check the job, never close by hand without its evidence
    hermetic: false
test_obligations:
  - source: scripts/roadmap/read_set_report.py
    behavior: sums read-set bytes by band at the tree or a ref, prints both readings, baselines and drift, and never raises or fails
    verification_step: 1
    test_selector: tests/test_read_set_report.py::test_read_set_bytes_reported_by_band
    red_green_expectation: red before (file absent), green after
  - source: config/agent/read_sets.yaml
    behavior: planning rows equal the audit's band_assignment; stored baselines equal a recompute at their refs
    verification_step: 2
    test_selector: tests/test_read_set_report.py
    red_green_expectation: red before (file absent), green after
constraints:
  - "Measure-only (rec-5256): no gate, no registered check, no budget; nothing reads the report's numbers to fail a run."
  - No Decision text, no contract edit, no AGENTS.md, command or skill edit (the ambient prose budgets have zero headroom).
  - Baseline numbers in read_sets.yaml are computed by the module at their refs at build time, never typed from the audit.
  - Decompose rather than raise if any Python file nears its SLOC budget (Decision 128).
  - No rescue agents or workaround loops (Decision 55).
