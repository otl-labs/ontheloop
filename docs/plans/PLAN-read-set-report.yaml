execution_steps:
  - 1. Write tests/test_read_set_report.py first and confirm step 1 is red on main.
  - 2. Write scripts/roadmap/read_set_report.py (scope row), then config/agent/read_sets.yaml without baselines, extra or exclude.
  - "3. Run the module at HEAD and fill extra and exclude until both runs print 'unlisted: none'; then compute each baseline row with the module at its ref (--ref e871e891, --ref 177c8f37) and paste the numbers."
  - "4. Execute Verification Plan steps 1-5; loop until pass. Paste step 5's output into the PR body. On an unrecoverable failure stop and RCA (Decision 55)."
  - "5. Re-run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-read-set-report.yaml before the first commit; if a red now shares a path with this scope, stop and report."
  - >-
    6. Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state
    (bin/venv-python -m scripts.session.github_readiness; 'unknown' is unproven, not ready); parent validator evidence
    (VP step 6 full-tier exit 0 plus validation_result --verify-head for the pushed HEAD; full tier backgrounded from
    the top-level session with a 2 h limit; a timed-out or incomplete full tier is BLOCKED and nothing is pushed);
    structured postflight evidence (write the scripts.session.postflight_evidence.CATEGORIES JSON in the scratchpad,
    then bin/venv-python -m scripts.session.postflight --evidence <file>); the real outcome (push, PR, CI green by
    event-driven wake, merge SHA).
  - >-
    7. CLOSURE (implement skill Commit Flows; git-ops.yaml handoff_sequence and resolves_trailer): implementation_declared
    true; commit with Resolves: rec-5256; rebase onto origin/main; VP step 6 on the rebased clean HEAD; push only after
    --verify-head exits 0; postflight evidence; PR (VP table and step 5's reading in the body); subscribe; code review;
    merge under standing_authorisation on code review PROCEED and green CI (squash, expectedHeadSha).
  - 8. Post-merge VP step 7 once the trailer-closure job has concluded (its verdict binds at the first main-validate run holding the merge, Decision 254).
  - 'Report: readiness, the validator verdict, the postflight evidence, the push/PR/merge outcome (merge SHA), the step 5 reading and the rec-5256 closure read-back, each separately.'
rollback: Revert the merge commit; nothing is stored, deployed or gated.
