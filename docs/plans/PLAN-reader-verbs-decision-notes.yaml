  command: >-
    test -s "$CI_JOBS_JSON" && test -s "$AUTOCLOSE_JOBS_JSON" && bin/venv-python -c "import json,os;L=lambda e:(lambda j:{x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)})(json.load(open(os.environ[e])));c=L('CI_JOBS_JSON');a=L('AUTOCLOSE_JOBS_JSON');print(c,a);assert all(any(n.startswith(w) and v=='success' for n,v in c.items()) for w in ('trailer-census','trailer-acceptance-evaluate','trailer-closure')),c;assert a and all(v=='success' for v in a.values()),a;from src.common.ducklake_reader_client import make_reader,fetch_recs_by_ids;r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-4324']);assert not m and r[0]['status']=='closed',(m,r and r[0]['status']);print('REC_4324_CLOSED')"
  expected: The three trailer jobs and every rec-autoclose job concluded success, then REC_4324_CLOSED.
