    Related-line order means a note edit touched or moved an existing line (Decision 177): restore it.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: >-
    The node already runs in the standing pytest tiers (--pre and full); graduating it would register a duplicate guard
