  expected_literals: []
  graduation: waive
  graduation_waiver_reason: >-
    PR-relative (reads origin/main and this plan's approved templates), so it has no subject once the PR merges. No
    standing guard covers a governance_notes edit's amendment_log entry (validate_contract_drift's amendment-log rule
