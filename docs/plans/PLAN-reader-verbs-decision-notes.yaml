- step: 7
  phase: pre-deploy
  action: >-
    The decisions index stays current without regeneration, and the entry spans land where the trial measured them.
  command: >-
    bin/venv-python -m scripts.decisions_index --check && bin/venv-python -c "import re;t=open('docs/DECISIONS.md',encoding='utf-8').read();h=[(m.start(),int(m.group(1))) for m in re.finditer(r'^## Decision (\d+):',t,re.M)];z={n:len(t[s:(h[i+1][0] if i+1<len(h) else len(t))].encode()) for i,(s,n) in enumerate(h)};print('spans',{n:z[n] for n in (199,207,215)})"
