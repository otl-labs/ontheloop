- step: 9
  phase: pre-deploy
  action: >-
    The test that pins Decision 207's 2026-10-04 note passes with the three notes in place, through the line-scoped
    assertion in the test_contract_amendments.py scope row.
  command: bin/venv-python -m pytest tests/telemetry/test_contract_amendments.py::test_decision_annotations_for_hash_compare_and_omission -q
  expected: The node passes (1 passed).
  fix_if: >-
    A failure on the section-end assertion means the old positional assertion is still there: apply the scope row's
