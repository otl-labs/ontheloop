  phase: post-deploy
  action: >-
    After the squash merge: ci.yml's trailer-census, trailer-acceptance-evaluate and trailer-closure jobs on the merge
    commit's main run closed rec-4324 (Decision 201), and rec-autoclose.yml's ops_decisions backfill run on the same
    commit concluded success (Decision 84; it fires because docs/DECISIONS.md changed). With mcp__github__actions_list
    (list_workflow_runs on ci.yml and on rec-autoclose.yml for the merge SHA, then list_workflow_jobs), write the two
