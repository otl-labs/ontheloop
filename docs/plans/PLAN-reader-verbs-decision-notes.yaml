slug: reader-verbs-decision-notes
intent: >-
  Keep three Decisions true once the telemetry reader verbs build lands (rec-4324): append one approved, dated Update
  note each to Decision 199 (clause 1's window-verb reading), Decision 207 (the Coverage line's reader side is now
  enforced code, not rec-4024's residual) and Decision 215 (clause 4's per-session reader count is six, observed not
  restated), so the decision record matches the shipped read layer and the decision scout stops flagging window verbs;
  and drop the stale KNOWN GAPS entries (rec-2173, already closed; rec-4024, whose named verbs and dimension contracts
  are built once the reader verbs build lands) from the telemetry_sessions and telemetry_observations contracts.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-reader-verbs-decision-notes.yaml
implementation_declared: true
phase: >-
  T2.36 (Phase 4: telemetry re-lands on DuckLake), bookkeeping owed by PLAN-telemetry-reader-verbs (#1481, rec-4291
  read layer) and parked by it in rec-4324. Closes no exit criterion: T2.36:c3 belongs to the reader verbs plan.
closes_criteria: []
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    Three dated `> **Update (YYYY-MM-DD):**` lines, one each at the end of Decisions 199, 207 and 215 (after the
    entry's last existing note, before its `---` separator), with the exact texts in execution_steps[2]. Nothing else in
    any entry changes.
- file: config/agent/verification_registry/entries/reader-verbs-decision-notes.yaml
  action: Create
  purpose: Graduated presence guard for the three notes (VP step 4), check_id equal to the filename stem.
- file: docs/contracts/telemetry_sessions.yaml
  action: Modify
  purpose: >-
    KNOWN GAPS cleanup (Benjamin 2026-10-15, cmsg_012XgaFy8VaDQbxP5D8nC958QAs6KSJt5NZBpQ7z2JsAwN): drop the stale rec-2173
    (closed) and rec-4024 (its named verbs and dimension contracts built) entries, and add one amendment_log entry, exactly as execution_steps[3]
    says. No other key or field changes.
- file: docs/contracts/telemetry_observations.yaml
  action: Modify
  purpose: >-
    The same cleanup for its stale rec-4024 (writer/reader verbs) entry, with one amendment_log entry, exactly as
    execution_steps[3] says. No other key or field changes.
- file: tests/telemetry/test_contract_amendments.py
  action: Modify
  purpose: >-
    test_decision_annotations_for_hash_compare_and_omission asserts Decision 207's whole span ends with the 2026-10-04
    note's "(PLAN-telemetry-write-conformance).", so any sanctioned append-only note (Decision 177, amendment_forms)
    fails it. Replace that positional assertion with a line-scoped one, exactly these four lines: `marker = "> **Update
    (2026-10-04):** representation-only columns"`, `note = next((line for line in d207.splitlines() if
    line.startswith(marker)), "")`, `assert note.rstrip().endswith("(PLAN-telemetry-write-conformance).")`, `assert
    d207.index(note) > d207.index("**Related:**")`. The 2026-10-04 note must still exist, end with its provenance and sit
    after the entry's Related line (a trailing annotation, never a mid-body splice; precedent
    tests/checks/contracts/test_ops_rule_source_records.py); nothing else in the file changes. This corrects an
    over-constraint that Decision 177's append-only dialect never promised, not a CONTENT weakening
    (implement-scope-boundary.yaml invariants.content): presence and provenance stay asserted and the trailing order is
    added.
- file: docs/decisions-index.json
  action: Modify
  purpose: >-
    CONDITIONAL. A trial of the three notes on a copy of main 9df9535b left the index current (the notes sit after each
    entry's Problem-sourced excerpt and add no typed edge), so it is expected byte-identical. Regenerate with
    `bin/venv-python -m scripts.decisions_index --write` ONLY if VP step 7 reports drift, after finding why.
bundled_recommendations:
- rec-4324
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  Decision 199's span ends with the approved clause-1 note: it names operator ruling reader-k2 (a) of 2026-10-04, keeps
  the per-derivation bound (each reading only its own session's calendar-day partition), puts the cap in the reader
  registry without a day count, points to telemetry_sessions.yaml WINDOW VERBS, and says later clause-1 changes need a
  numbered Decision.
- >-
  Decision 207's span ends with the approved Coverage note naming src/common/ducklake_event_reads.py as the enforcing
  code, the test node that guards it, the reader verbs build PR, rec-4024 no longer owning the reader side and rec-4025
  unchanged.
- >-
  Decision 215's span ends with the approved clause-4 note: five reader invocations per session became six with the
  creds-gated telemetry_health_count gauge, recs_read stays two, a 1.2x rise is short of reader-invocations-doubled,
  and the count is observed through log_invocation and not annotated again.
- >-
  The diff against origin/main adds exactly three non-blank lines to docs/DECISIONS.md and removes none (Decision 177
  append-only); each sits in its own Decision's span and equals its approved template in execution_steps[2] except for
  the landing date, the build PR number and, for 207 only, a renamed test node that exists in the dedupe test file.
- >-
  The reader verbs build is merged, its governed deploy is green and the preflight gauge reads pass live before the PR
  merges (VP steps 1-3).
- >-
  telemetry_sessions.yaml's KNOWN GAPS no longer names rec-2173 or rec-4024 and telemetry_observations.yaml's no longer
  names rec-4024; every other entry, field and key is unchanged; each contract's amendment_log gains exactly the
  approved first entry (VP step 6).
- >-
  test_contract_amendments.py's Decision 207 assertion is line-scoped exactly as its scope row says, and VP step 9
  passes with the notes in place.
- >-
  docs/decisions-index.json is current; no numbered Decision is added; no code (beyond that one test assertion),
  roadmap or Lambda file changes, and no contract change beyond the approved KNOWN GAPS cleanup.
- >-
  rec-4324's acceptance holds on the merge commit and rec-4324 is closed by the `Resolves: rec-4324` trailer.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Build-facts precondition, run before any edit and again before the squash-merge: the reader verbs build has merged
    to main and ships every fact the three notes state (the module and its per-verb window cap, sessions_window, the
    two conflict columns, the dedupe test, the preflight gauge and its verb). The WINDOW VERBS leg guards the existing
    contract note the 199 text points to (on main since 2026-10-06, #1416), not a build fact.
  command: >-
    git fetch -q origin main && git cat-file -e origin/main:src/common/ducklake_event_reads.py && git grep -q max_window_days origin/main -- src/common/ducklake_event_reads.py && git grep -q sessions_window origin/main -- src/common/ducklake_event_read_verbs.py && git grep -q conflicted_grain_keys origin/main -- 'src/common/ducklake_event_read*.py' && git grep -q derivation_conflicted origin/main -- 'src/common/ducklake_event_read*.py' && git grep -qi conflict origin/main -- src/common/ducklake_event_reads.py && git grep -q conflicted_grain_keys origin/main -- tests/common/test_ducklake_event_read_dedupe.py && git grep -q check_telemetry_health origin/main -- scripts/session/preflight.py && git grep -q telemetry_health_count origin/main -- scripts/preflight/telemetry_health.py && git grep -q 'WINDOW VERBS' origin/main -- docs/contracts/telemetry_sessions.yaml && echo BUILD_ON_MAIN
  expected: Prints BUILD_ON_MAIN.
  fix_if: >-
    A failing leg means the reader verbs build has not merged, or merged in a shape the approved text no longer
    describes (a renamed module, cap field, verb, column, gauge or contract note). Not merged: stop and wait; never land
    the notes ahead of it. Merged differently: stop and send the difference to the coordinator (send_message), which
    routes it to the planning thread for Benjamin's word. The 207 test node's exact name is checked by step 5.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    The reader verbs build's governed deploy is green on main. Export BUILD_MERGE_SHA (the squash commit of the build
    PR that adds src/common/ducklake_event_reads.py, whose number fills the notes' #NNNN even if fix-forward PRs follow
    it). With mcp__github__actions_list (list_workflow_runs, workflow deploy-ducklake-lambdas.yml, branch main) take the
    run on BUILD_MERGE_SHA, or, if that run was red and the build thread fixed forward, the first later successful run;
    export its head SHA as DEPLOY_RUN_SHA, then list_workflow_jobs for that run, writing the jobs JSON to a scratch path
    exported as DEPLOY_JOBS_JSON.
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && git fetch -q origin main && git merge-base --is-ancestor "$BUILD_MERGE_SHA" "$DEPLOY_RUN_SHA" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON'])); jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs); want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke']; assert all(any(n.startswith(w) and c=='success' for n,c in jobs.items()) for w in want),jobs;print('DEPLOY_OK')"
  expected: Every named job concluded success (a skipped job fails this step), then DEPLOY_OK.
  fix_if: >-
    A red or skipped job means the redeployed reader, and so the six-call and enforced-reader claims, are not yet
    live: wait for the build thread's fix-forward and bind to the first green run whose head contains BUILD_MERGE_SHA
    (never a re-run to green, Decision 55). A failed ancestry check means the chosen run predates the build. An empty
    file means the MCP read was not saved.
  hermetic: false
  graduation: not-applicable
- step: 3
  phase: pre-deploy
  action: >-
    The sixth reader call is live: re-run the reader verbs plan's step 15 command, so the preflight telemetry-store
    gauge reports pass through the deployed reader (agent_platform credentials).
  command: >-
    rm -f logs/.preflight-report.json; bin/venv-python -m scripts.session.preflight > /dev/null 2>&1; bin/venv-python -c "import json;h=json.load(open('logs/.preflight-report.json')).get('telemetry_health') or {};print(h); assert h.get('status')=='pass' and h.get('catalog'), h;print('GAUGE_LIVE_PASS', h['catalog'])"
  expected: >-
    telemetry_health status pass, then GAUGE_LIVE_PASS with the catalog it read: ducklake_smoke until slice 2c
    (rec-4292) re-pins it to production, which is recorded in the report, not a failure.
  fix_if: >-
    unavailable means no credentials or a reader error: confirm `aws sts get-caller-identity --profile agent_platform`
    and retry once only after restoring credentials, recording the restoration (a green retry with nothing changed is
    NONDETERMINISTIC under VF-08, not a pass); unpopulated or a red build-side step 15 is the build thread's to fix. Never land the 215 note
    while the gauge is not live. A catalog other than ducklake_smoke before slice 2c has merged is a build defect to
    report, not a pass.
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: pre-deploy
  action: >-
    Each note sits inside its own entry's span (from the entry's heading to its `---` separator), so a note landing in
    the wrong entry or after the separator fails.
  command: >-
    bin/venv-python -c "t=open('docs/DECISIONS.md',encoding='utf-8').read();sp=lambda n:(lambda
    s:s[:s.index(chr(10)+'---'+chr(10))])(t[t.index('## Decision %d:'%n):]);c={199:['operator ruling reader-k2 (a),
    2026-10-04','each reading only its own session'],207:['ducklake_event_reads.py reports a differing pair as
    conflicted','rec-4024 no longer owns it'],215:['five reader invocations per session became
    six','telemetry_health_count']};m=[(n,k) for n in c for k in c[n] if k not in sp(n)];assert not m,m"
  expected: >-
    Exit 0. Measured at authoring time: exit 1 (AssertionError listing all six phrases) on main 9df9535b, exit 0 on a
    scratch copy of main carrying the three approved notes.
  fix_if: >-
    An AssertionError lists the (decision, phrase) pairs missing from their span: the note is absent, landed in another
    entry or after the separator, or was not copied verbatim. Fix placement or restore the approved text; never widen
    the slice or drop a phrase.
  hermetic: true
  expected_literals: []
  graduation: graduate
  graduation_check_id: reader-verbs-decision-notes
- step: 5
  phase: pre-deploy
  action: >-
    Append-only and verbatim, on the rebased tree: the diff against origin/main adds exactly three non-blank lines to
    docs/DECISIONS.md and removes none (Decision 177); each Decision's span holds exactly one added line; and each line
    equals its approved template in execution_steps[2] of this plan once the date, the PR number and (207 only) the
    test node are normalised. Each note is its entry's last non-blank line before `---`, and the test node the 207 note
    names must exist in the dedupe test file.
  command: >-
    bin/venv-python -c "import subprocess as s,re,yaml;d=s.run(['git','diff','--unified=0','origin/main','--','docs/DECISIONS.md'],capture_output=True,text=True,check=True).stdout.splitlines();rm=[l for l in d if l.startswith('-') and not l.startswith('--- a/')];ad=[l[1:] for l in d if l.startswith('+') and not l.startswith('+++ b/') and l[1:].strip()];assert not rm,rm;assert len(ad)==3,ad;assert not [l for l in ad if '#NNNN' in l or 'YYYY-MM-DD' in l],'placeholder left';st=yaml.safe_load(open('docs/plans/PLAN-reader-verbs-decision-notes.yaml',encoding='utf-8'))['execution_steps'][2];tp=dict((int(k.split()[1]),v) for k,v in (l.split(': ',1) for l in st.splitlines() if l.startswith('Decision ')));nz=lambda x:re.sub(r'test_ducklake_event_read_dedupe\.py::test_\w+','test_ducklake_event_read_dedupe.py::test_conflicted_keys_are_reported_never_resolved',re.sub(r'#\d+\)','#NNNN)',re.sub(r'^> \*\*Update \(\d{4}-\d{2}-\d{2}\)','> **Update (YYYY-MM-DD)',x)));t=open('docs/DECISIONS.md',encoding='utf-8').read();sp=lambda n:(lambda q:q[:q.index(chr(10)+'---'+chr(10))])(t[t.index('## Decision %d:'%n):]);got={n:[l for l in ad if l in sp(n)] for n in tp};assert all(len(v)==1 for v in got.values()),got;assert all([x for x in sp(n).splitlines() if x.strip()][-1]==got[n][0] for n in tp),'a note is not its entry last line';bad=[n for n in tp if nz(got[n][0])!=tp[n]];assert not bad,bad;nm=re.search(r'::(test_\w+)',got[207][0]).group(1);assert 'conflict' in nm and 'def '+nm+'(' in open('tests/common/test_ducklake_event_read_dedupe.py',encoding='utf-8').read(),nm;print('append-only and verbatim: 3 notes')"
  expected: >-
    Prints the append-only and verbatim line and exits 0. Measured at authoring time on a scratch copy of this branch:
    exit 1 with no notes; exit 0 with the three notes and a dedupe test file defining the node; exit 1 naming [199]
    when one word of the 199 note was changed.
  fix_if: >-
    A removed line means an existing line was edited (restore it), or the branch is behind an origin/main that changed
    docs/DECISIONS.md (rebase, which restarts the Commit Flow). A count other than three means a note was wrapped
    or an extra line added: each note is one physical line. A Decision number in the assertion means that note's text
    differs from its approved template beyond the date, PR number or test node: copy it again from execution_steps[2].
    A test-node assertion means the 207 note names a node the build does not define, or one that is not the
    conflict-report test: use the build's real name for that test (the one permitted substitution, and only for a
    rename of it).
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: >-
    PR-relative (diffs against origin/main and reads this plan's approved templates), so it has no subject once the PR
    merges; the standing presence of the notes is step 4's graduated guard.
- step: 6
  phase: pre-deploy
  action: >-
    The approved contract cleanup, on the rebased tree: in telemetry_sessions.yaml and telemetry_observations.yaml the
    parsed governance_notes equals origin/main's with exactly the approved KNOWN GAPS entries (and the comma and space
    after each) removed; amendment_log gains exactly one new first entry (date, semantic_break false, change_class
    prose_improvement, the approved summary once #NNNN is normalised) over origin/main's list; every other key is
    unchanged. Templates are read from execution_steps[3] of this plan.
  command: >-
    bin/venv-python -c "import subprocess as s,re,yaml;from functools import reduce;st=yaml.safe_load(open('docs/plans/PLAN-reader-verbs-decision-notes.yaml',encoding='utf-8'))['execution_steps'][3];L=st.splitlines();C=('telemetry_sessions','telemetry_observations');R={c:[l.partition(': ')[2] for l in L if l.partition(': ')[0]==c+' removes'] for c in C};S={c:[l.partition(': ')[2] for l in L if l.partition(': ')[0]==c+' summary'][0] for c in C};nz=lambda x:re.sub(r'#\d+\)','#NNNN)',x);B={c:yaml.safe_load(s.run(['git','show','origin/main:docs/contracts/%s.yaml'%c],capture_output=True,text=True,check=True).stdout) for c in C};H={c:yaml.safe_load(open('docs/contracts/%s.yaml'%c,encoding='utf-8')) for c in C};X=('governance_notes','amendment_log');ok=lambda c,e:all(B[c]['governance_notes'].count(f+', ')==1 for f in R[c]) and H[c]['governance_notes']==reduce(lambda a,f:a.replace(f+', ',''),R[c],B[c]['governance_notes']) and H[c]['amendment_log'][1:]==B[c]['amendment_log'] and set(e)=={'date','semantic_break','change_class','summary'} and bool(re.fullmatch(r'\d{4}-\d{2}-\d{2}',str(e['date']))) and e['semantic_break'] is False and e['change_class']=='prose_improvement' and '#NNNN' not in e['summary'] and nz(e['summary'])==S[c] and {k:v for k,v in H[c].items() if k not in X}=={k:v for k,v in B[c].items() if k not in X};bad=[c for c in C if not ok(c,H[c]['amendment_log'][0])];assert all(R[c] for c in C) and not bad,bad;print('contract edits verbatim: 2 contracts')"
  expected: >-
    Prints the contract-edits line and exits 0. Measured at authoring time on a scratch copy of main 79063637: exit 1
    naming both contracts with no edit; exit 0 with the approved edits; exit 1 naming telemetry_observations when its
    summary had one word changed.
  fix_if: >-
    A contract named means its KNOWN GAPS list, amendment_log or another key differs from the approved edit: copy the
    removals and summary again from execution_steps[3], keep the new log entry first, and touch nothing else. A wrapped
