- step: 8
  phase: pre-deploy
  action: rec-4324's own acceptance command passes, so the Resolves trailer can close it (Decision 201).
  command: grep -q 'reader-k2' docs/DECISIONS.md && grep -c 'ducklake_event_reads' docs/DECISIONS.md
  expected: Exit 0, printing a count of at least 1.
  fix_if: Exit 1 means a note is missing; step 4 names which.
  hermetic: true
  expected_literals: []
  graduation: waive
  graduation_waiver_reason: >-
    A whole-file restatement of rec-4324's acceptance oracle, run once for the trailer close; step 4 is the
