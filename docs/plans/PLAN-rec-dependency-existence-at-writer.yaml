      nothing. Planned changes to existing nodes: test_a_rule_clean_file_scd2_lands seeds rec-7 before naming
      it; test_the_census_sql_and_the_engine_agree_row_for_row skips writer-lookup legs through the census module's own
      predicate, never a restated kind.
  - file: tests/test_field_semantics_rule_projection.py
    action: Modify
    purpose: The real projection carries array_element_reference true on dependencies and no exemption (planned change).
  - file: tests/test_contract_rules.py
    action: Modify
    purpose: The ops contract's dependencies leg carries no exemption (planned change of the rec-4166 owner assertion).
  - file: tests/checks/contracts/test__rule_grammar.py
    action: Modify
    purpose: >-
      SCD2 leg without exemption accepted; an event contract declaring the leg fails "outside the event vocabulary";
      class binding unchanged. Planned change: test_a_producer_side_rule_needs_its_exemption loops over the producer
      kinds that still need one (array_element_reference on SCD2 no longer does).
  - file: tests/checks/contracts/test_validate_ops_rule_source.py
