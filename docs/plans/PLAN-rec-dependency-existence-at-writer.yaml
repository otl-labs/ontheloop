acceptance_criteria:
  - >-
    A file_ops, write_ops or update_ops whose dependencies names an absent rec is rejected by the writer with error_type
    row_rule, rule array_element_reference, column dependencies, and writes nothing (unit and real-engine evidence for
    all three verbs; deployed smoke evidence for write_ops).
  - >-
    An update that leaves a stored dangling dependencies value unchanged still commits and issues no lookup (census
    2026-11-16: rec-610 and rec-613, both closed, both naming rec-608, deleted under Decision 70).
  - The portal's pre-check still refuses an absent rec early; the contract names the writer as the enforcement point.
  - >-
    DECISIONS.md carries the approved numbered Decision and the Amended-by trailer on Decision 210;
    data-modeling-standard.yaml carries the approved blocks; approved_text verify passes against the operator's approval
    run; ops_recommendations.yaml carries scope parts 1-3 exactly, and the PR body cites the operator's merge message.
  - >-
    The governed deploy-ducklake-lambdas run on a commit containing the merge sha is green, including the smoke job's
    --lambda-row-rules gate with the new case.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Writer lookup behaviour on connection doubles.
    command: >-
      bin/venv-python -m pytest -q
      tests/common/test_ducklake_writes_references.py::test_file_scd2_rejects_dangling_dependency_inside_transaction
      tests/common/test_ducklake_writes_references.py::test_write_scd2_rejects_dangling_dependency_inside_transaction
      tests/common/test_ducklake_writes_references.py::test_valid_dependencies_pass_with_one_lookup
      tests/common/test_ducklake_writes_references.py::test_unchanged_legacy_value_issues_no_lookup
      tests/common/test_ducklake_writes_references.py::test_changed_value_is_looked_up
      tests/common/test_ducklake_writes_references.py::test_empty_or_null_issues_no_lookup
      tests/common/test_ducklake_writes_references.py::test_lookup_binds_one_placeholder_per_distinct_id
      tests/common/test_ducklake_write_rules.py::test_select_widens_only_with_dated_rules
      tests/common/test_ducklake_write_rules.py::test_check_references_names_rule_and_column_without_values
    expected: Nine passed.
    fix_if: Fix the writer module; never the assertion. A rejection must roll back and never retry.
    hermetic: true
    graduation: graduate
    graduation_check_id: ops-writer-dependency-reference
  - step: 2
    phase: pre-deploy
    action: Engine projection, generator and grammar accept the writer-enforced leg.
    command: >-
      bin/venv-python -m pytest -q
      tests/common/test_ducklake_write_rules.py::test_reference_columns_built_from_projected_leg
      tests/common/test_ducklake_write_rules.py::test_reference_leg_value_must_be_true
      tests/common/test_ducklake_write_rules.py::test_reference_leg_with_its_exemption_is_refused
      tests/test_field_semantics_rule_projection.py::test_dependencies_projects_writer_reference
      tests/test_contract_rules.py::test_dependencies_reference_leg_is_not_exempt
      tests/checks/contracts/test__rule_grammar.py::test_scd2_reference_leg_needs_no_exemption
      tests/checks/contracts/test__rule_grammar.py::test_event_reference_leg_outside_event_vocabulary
      tests/checks/contracts/test_validate_ops_rule_source.py::test_each_defect_fails
    expected: Eight passed.
    fix_if: Edit the contract and regenerate field_semantics.yaml; never hand-edit the projection.
    hermetic: true
    graduation: graduate
    graduation_check_id: ops-dependency-reference-projection
  - step: 3
    phase: pre-deploy
    action: Declared equals enforced, and the census reports the leg without compiling it.
    command: >-
      bin/venv-python -m pytest -q
      tests/checks/contracts/test_validate_write_time_enforcement_conformance.py::test_references_mismatch_fails
      tests/checks/contracts/test_validate_write_time_enforcement_conformance.py::test_event_reference_without_exemption_fails_closed
      tests/checks/contracts/test_validate_write_time_enforcement_conformance.py::test_the_registered_check_passes_on_the_real_tree
      tests/test_contract_rule_census.py::test_writer_lookup_leg_reported_not_compiled
    expected: Four passed.
    fix_if: The conformance arm must compare the declared columns with reference_columns exactly.
    hermetic: true
    graduation: graduate
    graduation_check_id: ops-dependency-reference-conformance
  - step: 4
    phase: pre-deploy
    action: Portal pre-check and the smoke gate case list.
    command: >-
      bin/venv-python -m pytest -q
      tests/test_ops_data_portal_validators.py::test_array_element_reference_rejects_absent_rec
      tests/test_ops_data_portal_validators.py::test_reference_precheck_runs_from_writer_leg
      tests/common/test_ducklake_write_rules.py::test_row_rule_gate_cases_trip_their_rule
      tests/ducklake_neon_smoke_test/test_lambda_ops_gates.py
    expected: Every selected test passed.
    fix_if: The portal must still name the absent ids; the gate case must name array_element_reference and dependencies.
    hermetic: true
    graduation: graduate
    graduation_check_id: ops-dependency-reference-precheck-and-gate
  - step: 5
    phase: pre-deploy
    action: The rule statement and the amending Decision agree.
    command: >-
      bin/venv-python -m pytest -q
      tests/checks/contracts/test_write_time_enforcement_decision.py::test_dependency_lookup_names_its_amending_decision
      tests/checks/contracts/test_write_time_enforcement_decision.py::test_write_time_enforcement_rule_declared
      tests/checks/contracts/test_write_time_enforcement_decision.py::test_decision_entry_and_victim_annotation
    expected: Three passed (the first node is new, so the step is red before the build).
    fix_if: Place the sidecar blocks verbatim; never edit approved words to pass.
    hermetic: true
    graduation: graduate
    graduation_check_id: write-time-enforcement-dependency-decision
  - step: 6
    phase: pre-deploy
    action: >-
      Real-engine proof on the pinned duckdb and ducklake (integration mark; needs a network INSTALL of the ducklake
      extension; a skip is a FAIL, rec-4071).
    command: >-
      bin/venv-python -m pytest -q -m integration tests/common/test_ducklake_write_rules_integration.py -p no:randomly
      -rs
    expected: Every test passed and none skipped, including the five dependency nodes.
    fix_if: >-
      A dangling insert that commits, or a counter that moves on a rejection, is a design defect: stop and RCA before
      any deploy (Decision 55).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Never CI-run: scripts.validate deselects integration tests under --disable-socket, so this is a pre-merge local run
      only (rec-4071 owns the residual); steps 1 and 9 carry the CI and deployed evidence.
  - step: 7
    phase: pre-deploy
    action: >-
      The DECISIONS.md and data-modeling-standard.yaml blocks are exactly the approved words (ops_recommendations.yaml
      is not bound; its words are scope part 1-3 and the operator's merge message).
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug rec-dependency-existence-at-writer --expect
      "$APPROVED_DIGEST"
    expected: >-
      The line APPROVED-TEXT OK followed by the digest; $APPROVED_DIGEST is the digest= value approved_text record prints
      for the approved sidecar.
    fix_if: Place the sidecar's words verbatim; a wording change needs a new approval, never an edit to match.
    hermetic: true
    expected_literals:
      - APPROVED-TEXT OK
    graduation: waive
    graduation_waiver_reason: >-
      Build-base-bound moment claim: it checks this build's head against this sidecar and base; validate_merge_step
      re-checks it on the PR against the operator's approval run.
  - step: 8
    phase: pre-deploy
    action: >-
      Fast presubmit, then the full tier before handoff, started backgrounded with a 2 h limit from the top-level
      session; its verdict is validation_result --verify-head, never a pipe's exit status.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: Both tiers exit 0 and --verify-head confirms a PASS recorded for the current HEAD.
    fix_if: Fix each failure at root cause on the branch and re-run from the start (Decision 55; timeout_disposition blocked).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Graduating it would invoke scripts.validate recursively; PR CI runs the fast tier on every push and main runs the
      full tier after merge.
  - step: 9
    phase: post-deploy
    action: >-
      The governed deploy shipped the merge: deploy-ducklake-lambdas.yml deploys the newest commit a passing full-tier
      run covers and pauses while main is red (Decision 254), so read with mcp__github__actions_list the first run whose
      gate sha is $MERGE_SHA or a first-parent descendant of it, and save its jobs to $DEPLOY_JOBS_JSON. The writer,
      the shared row-rule engine and the regenerated field_semantics.yaml reach every affected active artifact
      (compute_affected_artifacts: ducklake_writer, ducklake_reader, ducklake_catalog_dr via deploy-serving and smoke;
      ducklake_maintenance and ducklake_maintenance_smoke via deploy-maintenance and maintenance-smoke;
      ducklake_telemetry_writer and ducklake_telemetry_reader via the telemetry jobs), so every deploy and smoke job
      counts.
    command: >-
      test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
      jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
      want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke','deploy-telemetry-twin','telemetry-twin-smoke','deploy-telemetry','telemetry-smoke'];
      assert all(jobs.get(w)=='success' for w in want),jobs;print('DEPLOY_OK')"
    expected: Every named deploy and smoke job concluded success (a skipped job fails this step), then DEPLOY_OK.
    fix_if: A red job is root-caused and fixed forward, never re-run to green (Decision 55).
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      The smoke job's row-rules gate ran the new case on the deployed writer: save that job's log (mcp__github__get_job_logs
      for the smoke job of step 9's run) to $SMOKE_LOG.
    command: >-
      grep -E "LAMBDA_ROW_RULES OK [0-9]+ cases" "$SMOKE_LOG" | bin/venv-python -c "import re,sys;t=sys.stdin.read();
      n=int(re.search(r'LAMBDA_ROW_RULES OK (\d+) cases',t).group(1));print(n);assert n>=5,n;print('DEPENDENCY_GATE_OK')"
    expected: >-
      The gate reports at least 5 cases (4 before this change), then DEPENDENCY_GATE_OK.
    fix_if: Four cases means the deployed gate predates this change; a FAIL line names the rule the writer answered.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      The writer's per-invocation wall p95 held after the lookup shipped (the Decision's lookup-cost reversal signal;
      Decision 214 cl.4: wall time is the latency signal, CommitLatencyMs is attribution): AWS/Lambda Duration p95 for
      agent-platform-ducklake-writer over the 7 days after the deploy against the 7 days before. Set DEPLOY_HOUR to the
      step 9 deploy-serving job's completion, rounded down to the hour, in ISO 8601 UTC; both windows are whole
      hour-aligned 7-day periods, so each returns one datapoint. Probe 2026-11-16 (7 days to 18:00 UTC): wall p95
      24,530 ms, CommitLatencyMs p95 7,614 ms, both already past Decision 82's 2,000 ms (Decision 214's own reversal
      watch), so the bound is relative. Duration mixes warm and cold-attach invocations (214 cl.4 pins them apart) and
      about one write in ten carries dependencies, so this is a coarse tripwire, not an attribution of the lookup's
      cost.
    command: >-
      R=$(tr -d '[:space:]' < config/aws-region); D=$(date -u -d "$DEPLOY_HOUR" +%s);
      for w in "$((D-604800)) $D" "$D $((D+604800))"; do set -- $w; aws cloudwatch get-metric-statistics
      --profile agent_platform --region "$R" --namespace AWS/Lambda --metric-name Duration --dimensions
      Name=FunctionName,Value=agent-platform-ducklake-writer --start-time "$(date -u -d @$1 +%FT%TZ)" --end-time
      "$(date -u -d @$2 +%FT%TZ)" --period 604800 --extended-statistics p95 --query
      'Datapoints[0].ExtendedStatistics.p95' --output text; done | bin/venv-python -c "import sys;
      b,a=[float(x) for x in sys.stdin.read().split()];print(b,a);assert a<=b*1.2,(b,a);print('LATENCY_HELD')"
    expected: The after p95 is at most 1.2 times the before p95, then LATENCY_HELD.
    fix_if: >-
      A breach fires the Decision's lookup-cost reversal condition: read CommitLatencyMs for the same windows as
      attribution, file a rec with all four figures and re-decide; never loosen the bound.
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: >-
      rec-4166 re-scoped as a backstop (the post-deploy execution step): read it back with the ducklake_reader recs_by_ids verb through
      scripts.ops_data_portal's reader client and save the returned row as JSON to $REC_4166_JSON.
    command: >-
      test -s "$REC_4166_JSON" && bin/venv-python -c "import json,os;r=json.load(open(os.environ['REC_4166_JSON']));
      r=r[0] if isinstance(r,list) else r;print(r.get('status'));assert r.get('status')=='open',r.get('status');
      assert 'backstop' in (r.get('context') or '').lower();print('REC_4166_BACKSTOP')"
    expected: Status open and the context names it a backstop, then REC_4166_BACKSTOP.
    fix_if: Re-run the update_rec through the portal; never write the warehouse directly.
    hermetic: false
    graduation: not-applicable
