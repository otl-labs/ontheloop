      reason: r, owner: someone}} on dependencies before asserting "must be a rec id", so the cross_row owner arm stays
      exercised (graduated shard ops-rule-source-parity, node id unchanged).
  - file: tests/checks/contracts/test_validate_write_time_enforcement_conformance.py
    action: Modify
    purpose: A references mismatch fails; the real tree passes; an unexempted event-table leg fails closed.
  - file: tests/test_contract_rule_census.py
    action: Modify
    purpose: A non-exempt array_element_reference yields one WRITER-LOOKUP line and is not compiled.
  - file: tests/test_ops_data_portal_validators.py
    action: Modify
    purpose: >-
      The portal pre-check still rejects an absent rec when the leg comes from reference_columns. Planned change:
