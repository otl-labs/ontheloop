schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: rec-dependency-existence-at-writer
intent: >-
  Move the ops_recommendations dependency-existence rule (array_element_reference: every element of dependencies names
  an existing rec of any status) from the portal's client-side pre-check into the DuckLake writer's own transaction,
  so no route to the writer can land a dangling dependency. A numbered Decision amends Decision 210 cl.2(a) to admit a
  same-table merge-key point lookup; rec-4166's DQ monitor becomes a backstop. Plan A of five in the rec write-path
  data-quality work (B lints advisory, C provenance column, D portal provenance and risk inputs, E scheduled alarm; F a
  guardrail hook), which serves NS.5 (a data rule is enforced at the write boundary wherever the write can decide it).
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V3
plan_path: docs/plans/PLAN-rec-dependency-existence-at-writer.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Operator
  work item from the 2026-11-12 rec read/write audit. Decision 79 (per-Lambda build, deploy and smoke for an active
  artifact) makes it V3, met by steps 9-10; T2.29 c9 is a standing conditional obligation this plan does not close.
closes_criteria: []
amends: [dec:210]
cites: [dec:210, dec:81, dec:84, dec:207, dec:88, dec:177, dec:254, dec:167, dec:79, dec:235, dec:181, dec:214, dec:246, dec:70]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      The sidecar's blocks verbatim: a new numbered Decision {{N}} amending Decision 210 cl.2(a) (a point lookup by merge
      key on the same table's current projection, inside the write's own transaction, is write-decidable; the ops
      writer enforces dependencies existence on insert and on a change to the column; rec-4166 is a backstop; the
      Decision 70 deletion caveat; two reversal conditions), and an "> **Amended by Decision {{N}} ({{DATE}}):**"
      trailer at the end of Decision 210's section (Decision 177 dialect; 210's body is never spliced).
      docs/decisions-index.json is regenerated by the tooling (sanctioned, no row).
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      The sidecar's blocks verbatim in rule write-time-enforcement: the write-owned cross-row list gains the
      ops_recommendations dependencies lookup under Decision {{N}}, which binds on an insert and on a write that
      changes the column; the COVERAGE clause re-points the dependency reference from "monitor with rec-4166" to the
      writer, its unit and real-engine tests and the --lambda-row-rules gate, with rec-4166 a backstop; one new
      amendment_log row (governance_note_add, semantic_break true). The file is at its cap (533 of 533 effective lines,
      NEAR_CAP): the approved blocks are net-zero lines, rewrapping the edited sentences to fit, never a cap raise.
  - file: docs/contracts/ops_recommendations.yaml
    action: Modify
    purpose: >-
      Not bound by the sidecar (approved_text verify compares a bound file whole, and the rule line in part 3 cannot
      be a block because the fast tier fails it before this build's code exists, wording check r1), so every edit to
      this file is always-ask contract text whose words are fixed here, and the build's merge waits for the operator's
      own message naming these dependencies edits. Three parts, nothing else changes. (1) On dependencies' semantics,
      the words "-- enforced write-time by the portal's gate_write (array_element_reference, run from the declared
      exemption) on an insert and on an update that changes the column." become exactly "-- enforced by the DuckLake
      writer inside the write's own transaction (array_element_reference, Decision {{N}}) on an insert and on an
      update or upsert that changes the column; the portal's gate_write runs the same check through the reader as a
      derived pre-check." (2) One flow-style amendment_log row, the last entry of the dependencies field's
      amendment_log at its siblings' 6-space "- " indent, after the row whose summary is "dependencies existence is
      enforced by the portal's gate_write from the declared exemption.", exactly: {date: "{{DATE}}",
      semantic_break: true, change_class: governance_note_add, summary: "Decision {{N}}: the cross_row exemption
      (owner rec-4166) is removed; the writer enforces array_element_reference in its own transaction, the portal
      keeps a derived pre-check, rec-4166 is a backstop.", migration_story: "Not re-armed against older rows: the
      lookup binds on an insert or a change to the column. Census 2026-11-16: 2 of 390 rows dangle (rec-610, rec-613,
      naming rec-608, deleted under Decision 70); they stay updatable."} (3) The rule line: the dependencies dq_intent
      becomes exactly {array_element_format: {pattern: '^rec-[0-9]+$'}, array_element_reference: {}} (the
      write_time_exemptions entry class cross_row, owner rec-4166, is deleted). {{N}} and {{DATE}} take the build's
      values for the sidecar. 554 of 556 effective lines (NEAR_CAP): net +1.
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: >-
      Regenerated by bin/venv-python -m scripts.schema_to_field_semantics, never hand-edited: ops_recommendations
      dependencies carries array_element_reference: true and no write_time_exemptions.
  - file: scripts/field_semantics_rule_projection.py
    action: Modify
    purpose: _rule_value projects a non-exempt array_element_reference leg as true (it takes no params).
    new_imports: []
  - file: src/row_rules/rules.py
    action: Modify
    purpose: >-
      Only "array_element_reference" joins _COLUMN_KEYS, so a projected leg is a known key; RowRules gains no field
      and rules.py gains no branch and no import (amendment 2: its mirror test tests/row_rules/test_rules.py is at 498
      of 500 SLOC and is not edited, and test_package_is_a_stdlib_leaf with the .importlinter contract
      src-row-rules-is-a-leaf refuses any first-party import inside src/row_rules, so the reference branches live in
      the adapter below). check_row never evaluates the leg (no I/O); PRODUCER_SIDE_KINDS is unchanged, so an
      exempted leg (class cross_row) still projects as a producer exemption. The telemetry writer is unaffected.
    new_imports: []
  - file: src/common/ducklake_write_rules.py
    action: Modify
    purpose: >-
      WRITER_REFERENCE_KINDS = frozenset({"array_element_reference"}) and reference_columns(fields) -> frozenset[str]
      (fields is a table's projected field map, spec.fields): the columns whose elements must name an existing merge
      key of the same table, built from a projected array_element_reference: true; any other value, or a column that
      carries both the leg and its write_time_exemptions entry, raises src.row_rules.rules.RuleProjectionError (so the
      conformance arm's except still catches it). check_references(con, spec, record, prior) -> None (no rules
      parameter; the columns come from reference_columns): for each
      column in reference_columns(spec.fields) with a non-empty
      value that is an insert (prior None) or differs from prior[column], one SELECT of spec.merge_key from the
      current table WHERE merge_key IN (one ? per distinct element), on the caller's open transaction; any element not
      returned raises RowRuleViolationError(spec.table, "array_element_reference", column) carrying no value.
      existing_row_select adds every reference column to the one existing-row SELECT (still one statement, Decision 88)
      so the changed-value test reads the stored value.
    new_imports: []
  - file: src/common/ducklake_writes.py
    action: Modify
    purpose: >-
      write_scd2 calls check_references after check_write and before the MERGEs, with the same prior; file_scd2 calls
      it after the replay check and before _allocate_entity_id, with prior None, so a doomed request never takes the
      counter-row write. Both reuse the existing
      terminal handling (RowRuleViolationError is a DuckLakeRuntimeError: rolled back, never retried). 359 of 500 SLOC.
    new_imports: []
  - file: scripts/checks/contracts/_rule_grammar.py
    action: Modify
    purpose: >-
      An array_element_reference leg needs no write_time_exemptions entry on an SCD2 contract (the writer looks it up).
      The relaxation is SCD2-vocabulary only: the event vocabulary (field_semantics_event_projection.py) has no
      array_element_reference, so an event contract declaring the leg still fails "outside the event vocabulary"; the
      class binding table is unchanged.
    new_imports: []
  - file: scripts/checks/contracts/validate_write_time_enforcement_conformance.py
    action: Modify
    purpose: >-
      A references arm: the declared non-exempt array_element_reference columns equal
      src.common.ducklake_write_rules.reference_columns of the table's projected fields for every contract table, and an
      event table declaring one without an exemption fails closed.
    new_imports: [src.common.ducklake_write_rules]
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      The validate_write_time_enforcement_conformance Entry's pre_globs gain "src/common/ducklake_write_rules.py" (its
      new import; validate_pre_glob_closure), nothing else.
    new_imports: []
  - file: scripts/contract_rule_census.py
    action: Modify
    purpose: >-
      A non-exempt array_element_reference is reported on its own WRITER-LOOKUP line (the writer enforces it per write;
      the dq_check path has no array-reference kind, rec-4166 owns the backstop) instead of raising "no census check
      kind", and leaves both declared_non_exempt and the compiled checks, so census() still exits CLEAN (0); the test
      asserts the exit code.
    new_imports: []
  - file: scripts/ops_portal/write_validators.py
    action: Modify
    purpose: >-
      The derived pre-check keeps refusing early with the absent ids named: the existing _ElementReference handler now
      runs from src.common.ducklake_write_rules.reference_columns(columns), the projected field map it already
      builds RowRules from (insert, or a changed value) as well as
      from a producer exemption, so behaviour and
      its reader round-trip are unchanged; the module docstring names the writer as the enforcement point. The
      references path resolves its handler through _producer_handlers and fails closed when it is missing, so
      test_producer_side_rules_follow_the_contract_exemptions stays green (its docstring is re-pointed).
    new_imports: []
  - file: scripts/ducklake_smoke/lambda_ops_gates.py
    action: Modify
    purpose: >-
      ROW_RULES_CASES gains ("array_element_reference", {"dependencies": ["rec-999999999"]}, "dependencies"), so the
      per-deploy --lambda-row-rules gate proves the deployed writer rejects a dangling dependency with 422 row_rule and
      stores nothing (the gate's existing repair path covers a failed probe).
    new_imports: []
  - file: tests/common/test_ducklake_writes_references.py
    action: Create
    purpose: >-
      Connection-double tests: dangling insert via file_scd2 and write_scd2 rejected inside the transaction, rolled
      back, zero OCC retries, no MERGE issued; a valid list passes with one lookup statement; an update leaving a
      dangling legacy value unchanged issues no lookup and passes; a changed value is looked up; empty or null issues no
      lookup; the lookup SQL binds one placeholder per distinct id. (tests/common/test_ducklake_writes.py is at 471 of
      500 SLOC, so the new nodes live here.)
  - file: tests/common/test_ducklake_write_rules.py
    action: Modify
    purpose: >-
      test_select_widens_only_with_dated_rules expects dependencies in the widened select; the gate-case test expects
      the new case and checks it through check_references with a double that returns no row (planned changes);
      check_references unit nodes; reference_columns nodes (built from array_element_reference true, the same fields
      also passing RowRules.from_projection so the new column key is proven; any other value refused; leg plus
      exemption refused), so the mirror test keeps ducklake_write_rules.py at 100%.
  - file: tests/common/test_ducklake_write_rules_integration.py
    action: Modify
    purpose: >-
      Real local DuckLake catalog (integration mark): a dangling file_scd2 insert is rejected and leaves the counter and
