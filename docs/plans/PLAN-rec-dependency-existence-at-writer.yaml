  - >-
    Code reaches production only through deploy-ducklake-lambdas.yml (Decisions 125, 126, 254); no Terraform change,
    no column add, no admin step. This plan must deploy before plan C opens a pending_reconcile window, which refuses
    every serving deploy until it clears.
  - field_semantics.yaml is regenerated, never hand-edited; on a rebase regenerate it, never merge hunks.
  - The engine stays pure (no I/O in src/row_rules/rules.py); the lookup lives in the ops writer adapter only.
