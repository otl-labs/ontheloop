schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: rec-lints-advisory
intent: >-
  Make the ops_recommendations glossary_lint legs (title, context, verification) advisory: the rec portal still runs
  them on every file_rec and update_rec (gate_write returns each per-check result and prints each finding or error
  with its fix), but a finding, or a glossary the lint cannot load, never refuses the write. A numbered Decision amends Decision 240 cl.5 and its Coverage line and
  Decision 210's 2026-10-04 and 2026-10-15 amendments; acceptance_lint keeps refusing until rec-5239's scheduled re-run
  is live. Plan B of five in the rec write-path data-quality work; it keeps the contract and the Decisions from claiming
  a write-time guarantee the writer cannot give (NS.5).
implementation_declared: true
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-rec-lints-advisory.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Operator
  work item from the 2026-11-12 rec read/write audit and the 2026-11-16 consult. No Lambda-packaged file changes
  (compute_affected_artifacts over the scope is empty and field_semantics.yaml stays byte-identical), so V2.
closes_criteria: []
amends: [dec:240, dec:210]
cites: [dec:240, dec:210, dec:235, dec:244, dec:181, dec:177, dec:167, dec:66, dec:246]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      The sidecar's blocks verbatim: a new numbered Decision {{N}} (amends 240 and 210: the portal reports glossary
      findings on rec title, context and verification and writes anyway; a repository_state leg may be declared
      advisory: true; acceptance_lint keeps refusing until rec-5239's re-run is live; one reversal condition), an
      "> **Amended by Decision {{N}} ({{DATE}}):**" line after Decision 240's 2026-11-02 Update, and one after Decision
      210's 2026-10-15 amendment (Decision 177 dialect; neither body is spliced). docs/decisions-index.json is
      regenerated by the tooling (sanctioned, no row).
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      The sidecar's blocks verbatim in rule write-time-enforcement: class repository_state names the producer that
      enforces it or, on a leg declared advisory: true, runs it and reports without refusing; DECLARATIONS gains the
      advisory exception; RATCHET: adding or removing advisory: true needs a semantic-break entry; one
      new amendment_log row above the 2026-10-30 row (which #2102 already re-spelled in flow style; amendment 1
      re-anchored the block on it). 529 of 533 effective lines on main 2026-11-17: the blocks are net +1 line.
  - file: docs/contracts/ops_recommendations.yaml
    action: Modify
    purpose: >-
      Not bound by the sidecar (approved_text verify compares a bound file whole, and the rule lines in part 3 cannot be
      blocks because the fast tier refuses the advisory sub-key before this build's grammar exists; plan A's #2083
      route), so every edit to this file is always-ask contract text whose words are fixed here, and the build's merge
      waits for the operator's own message naming these edits. Three parts, nothing else changes. (1) Title's
      amendment_log row dated 2026-09-01 is re-spelled in flow style with the same values, exactly: {date:
      "2026-09-01", semantic_break: false, change_class: prose_improvement, summary: "Corrected title's semantics to
      describe the min_length 10 rule that now actually enforces (rec-3310).", migration_story: "Prose correction
      paired with the min_length write-time enforcement landing in the same change."} (2) In each of title, context and
      verification (C below), one flow-style amendment_log row directly after the 2026-10-30 row whose summary says
      "refuses new C text", at its 6-space "- " indent, exactly: {date: "{{DATE}}", semantic_break: true,
      change_class: governance_note_add, summary: "Decision {{N}}: the C glossary_lint leg is advisory (advisory:
      true): the portal reports each finding with its fix and writes anyway, never refusing.", migration_story: "No row
      changes; a direct writer call and an ignored finding are an unenforced residual owned by rec-5239's scheduled
      re-run (Decision 181 cl.2)."} (3) The three rule lines: in the dq_intent of title, context and verification,
      exactly "glossary_lint: {}" becomes "glossary_lint: {advisory: true}" and nothing else on those lines changes; the
      acceptance leg is not touched. write_time_exemptions entries are unchanged, so the projection is byte-identical.
      {{N}} and {{DATE}} take the build's values for the sidecar. 554 of 556 effective lines (NEAR_CAP): net -1, so
      553 after (554 if plan A's +1 lands first).
  - file: scripts/checks/contracts/_rule_grammar.py
    action: Modify
    purpose: >-
      _SUBKEYS: glossary_lint and acceptance_lint accept "advisory"; its only legal value is true (any other value is an
      error naming the leg), and only on a leg whose write_time_exemptions entry is class repository_state (else an
      error naming the leg); array_element_reference does not accept it, so a cross_row leg can never be advisory.
    new_imports: []
  - file: scripts/checks/contracts/_rule_ratchet.py
    action: Modify
    purpose: >-
      _params_narrowed compares params without the advisory key, so the key never needs a census entry; adding or
      removing advisory: true needs a semantic_break true entry in the column's gained amendment_log rows, else an error
      "advisory added without a semantic-break entry" or "advisory removed without a semantic-break entry".
    new_imports: []
  - file: scripts/ops_portal/write_validators.py
    action: Modify
    purpose: >-
      A frozen LintResult(column, kind, outcome, message) with outcome one of pass, finding, error, skipped. gate_write
      returns tuple[LintResult, ...] (empty for a table with no producer exemptions). _run_producer_rules visits every
      exempted leg; a missing handler still raises (fails closed); a leg whose column is unchanged on update is
      skipped; a leg whose declared params carry advisory: true is run and its ValueError becomes a finding, and a
      LintUnavailable (new ValueError subclass, raised by _load_glossary instead of the bare ValueError, and also when
      the parsed glossary is not a mapping, such as an empty file, or lacks a relative word's say_instead entry, a
      KeyError the lint turns into LintUnavailable) becomes an error; any other leg raises as today
      (acceptance_lint, array_element_reference). Before returning, and before a refusing leg's exception propagates,
      one stderr line per finding or error collected so far: "[REC_LINT_ADVISORY] <table>.<column> <kind> <outcome>: <message> -- the portal does not
      refuse; an unenforced residual owned by rec-5239". Module and _GlossaryLint docstrings say report, never refuse.
    new_imports: []
  - file: scripts/cost_reconciliation.py
    action: Modify
    purpose: >-
      _validate_rec_payload (a dry-run template check, never a write) stays strict: it raises ValueError
      "cost-rec template has advisory lint results: <column> <kind> <outcome>, ..." when gate_write returns any finding
      or error.
    new_imports: []
  - file: tests/ops_data_portal/test_advisory_lints.py
    action: Create
    purpose: >-
      Report-not-refuse behaviour: finding reported and write proceeds; every advisory finding collected; an unloadable
      glossary (missing file, an empty file that parses to no mapping, or a word without say_instead) is an error
      result; a refusing leg still raises, and the title finding's [REC_LINT_ADVISORY] line is on stderr when it does; unchanged column skipped; dependency and acceptance refusals still raised alongside
      glossary findings; the contract's advisory key drives the mode (a copy without it refuses again); the stderr line
      format; file_rec writes a rec whose title carries a finding and update_rec writes a context change that carries
      one (writer transport patched in both); the real contract marks
      the three glossary legs advisory and not the acceptance leg; assert_portal_gate_clean fails on a template whose
      title carries a glossary finding (the helper is not vacuous).
  - file: tests/test_ops_data_portal_validators.py
    action: Modify
    purpose: >-
      Planned changes (Decision 235 cl.1, named): _refusal becomes _finding (asserts one finding result and returns its
      message); test_glossary_lint_refuses_unqualified_title becomes test_glossary_lint_reports_unqualified_title;
      test_glossary_lint_fails_closed_without_contract becomes test_glossary_lint_reports_error_without_contract (the
      write proceeds with an error result); test_glossary_lint_update_judges_only_new_sentences,
      test_glossary_lint_covers_verification_not_resolution and test_glossary_lint_context_message_names_derivation
      read the finding message instead of the exception (same claims), and their negative halves (the kept-sentence
      update; the resolution write) assert an empty finding set; test_glossary_lint_passes_quotes_identifiers_and_none
      asserts an empty finding set for each of its three params instead of only not raising. Acceptance and dependency
      assertions unchanged.
  - file: tests/test_cost_reconciliation.py
    action: Modify
    purpose: A template whose title carries a glossary finding raises naming the column, kind and outcome.
  - file: tests/checks/contracts/test__rule_grammar.py
    action: Modify
    purpose: >-
      advisory true accepted on glossary_lint and acceptance_lint with a repository_state exemption; false or a string
      refused; refused with a temporary exemption or none; refused on array_element_reference.
  - file: tests/checks/contracts/test__rule_ratchet.py
    action: Modify
    purpose: >-
      Three new _ARMS: advisory added without an entry (error), advisory added with a semantic_break entry (clean),
      advisory removed without a semantic_break entry (error). _base_spec gains a glossary_lint leg with advisory: true
      and its repository_state exemption so the removal arm can strip the key from the head.
  - file: tests/checks/contracts/test_write_time_enforcement_decision.py
    action: Modify
    purpose: >-
      The rule statement names the amending Decision for advisory legs, and that Decision's section exists in
      DECISIONS.md and amends 240 and 210 (number resolved from the statement, never hard-coded).
  - file: config/agent/verification_registry/entries/rec-portal-glossary-lint-refuses.yaml
    action: Delete
    purpose: >-
      Retired by git mv to config/agent/verification_registry/entries/deprecated/ (Decision 244 cl.5), its claim being
      changed under this plan's named Decision 235 cl.1 approval; step 2 graduates rec-portal-glossary-lint-reports.
  - file: config/agent/verification_registry/entries/deprecated/rec-portal-glossary-lint-refuses.yaml
    action: Create
    purpose: The moved record of the Delete row above (git mv, byte-identical; --no-renames sees D plus A).
  - file: tests/fixtures/portal_gate.py
    action: Create
    purpose: >-
      assert_portal_gate_clean(table, fields, **kwargs): calls the real gate_write and asserts it returns no finding or
      error result, naming each one; used by the producer-template tests below so they keep their glossary claim.
  - file: tests/telemetry_verify/test_alarms.py
    action: Modify
    purpose: test_every_alarm_record_passes_the_portal_row_gate calls assert_portal_gate_clean instead of a bare gate_write.
  - file: tests/test_security_detector_probe.py
    action: Modify
    purpose: test_rec_fields_pass_the_portal_gate calls assert_portal_gate_clean instead of a bare gate_write.
  - file: tests/convergence_health/test_escalate.py
    action: Modify
    purpose: >-
      TestEscalatePortalValidators::test_persistent_red_files_rec calls assert_portal_gate_clean instead of a bare
      gate_write; the import line is swapped, not added, so the file stays at 497 of 500 SLOC.
  - file: tests/convergence_health/budget_ingest/test_ingest.py
    action: Modify
    purpose: >-
      TestIngestBudgetBreaches::test_rec_fields_pass_the_real_acceptance_linter_and_write_time_validators calls
      assert_portal_gate_clean instead of a bare gate_write.
  - file: tests/ci/test_actions_capacity_alarm.py
    action: Modify
    purpose: test_build_fields_pass_the_portal_write_gate calls assert_portal_gate_clean instead of a bare gate_write.
  - file: tests/checks/test__budget_recs.py
    action: Modify
    purpose: >-
      TestBudgetBreachRecFiling's test_breach_priority_survives_real_accepted_values_validator and
      test_bypass_priority_survives_real_accepted_values_validator call assert_portal_gate_clean (imported from
      tests.fixtures.portal_gate, the gate_write import dropped) instead of a bare gate_write.
  - file: tests/test_contract_rules.py
    action: Modify
    purpose: >-
      test_ops_recommendations_declares_its_rule_list expects glossary_lint ({"advisory": True}, None) on title,
      context and verification (declared_rules keeps advisory in params; _LEG_META_KEYS is unchanged);
      acceptance_lint stays ({"require_discrimination": True}, None). It follows the deliberate contract change.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A file_rec or update_rec whose title, context or verification carries an unqualified relative word writes the rec,
    gate_write returns a finding result for that column, and stderr carries one [REC_LINT_ADVISORY] line naming the
    fix.
  - A glossary the lint cannot load yields an error result and the write proceeds.
  - >-
    A non-discriminating acceptance and a dangling dependency are still refused, also when glossary findings are
    present in the same record.
  - cost_reconciliation._validate_rec_payload still raises on any finding or error.
  - The seven producer-template tests fail on any glossary finding or error in their templates.
  - The rule grammar accepts advisory true only on repository_state kinds; the ratchet treats adding or removing it as a semantic break.
  - >-
    DECISIONS.md carries the approved Decision and both Amended-by lines and data-modeling-standard.yaml the approved
    blocks; approved_text verify passes and validate_merge_step finds the operator's approval run; ops_recommendations.yaml carries scope
    parts 1-3 exactly, and the PR body cites the operator's merge message naming them.
  - config/lambda/ducklake/field_semantics.yaml is byte-identical to origin/main.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Portal report-not-refuse behaviour.
    command: >-
      bin/venv-python -m pytest -q
      tests/ops_data_portal/test_advisory_lints.py::test_glossary_finding_is_reported_and_the_write_proceeds
      tests/ops_data_portal/test_advisory_lints.py::test_every_advisory_finding_is_collected
      tests/ops_data_portal/test_advisory_lints.py::test_unloadable_glossary_is_an_error_result
      tests/ops_data_portal/test_advisory_lints.py::test_unchanged_column_is_skipped
      tests/ops_data_portal/test_advisory_lints.py::test_refusing_legs_still_refuse_beside_findings
      tests/ops_data_portal/test_advisory_lints.py::test_contract_advisory_key_drives_the_mode
      tests/ops_data_portal/test_advisory_lints.py::test_stderr_line_names_the_fix_and_the_write
      tests/ops_data_portal/test_advisory_lints.py::test_file_rec_writes_a_rec_with_a_glossary_finding
      tests/ops_data_portal/test_advisory_lints.py::test_update_rec_writes_a_change_with_a_glossary_finding
      tests/ops_data_portal/test_advisory_lints.py::test_contract_marks_glossary_legs_advisory_not_acceptance
    expected: Ten passed.
    fix_if: Fix write_validators.py; never the assertion. A refusing leg must still raise; an advisory leg must never raise.
    hermetic: true
    graduation: graduate
    graduation_check_id: rec-portal-advisory-lints
  - step: 2
    phase: pre-deploy
    action: The repaired glossary nodes report instead of refusing.
    command: >-
      bin/venv-python -m pytest -q
      tests/test_ops_data_portal_validators.py::test_glossary_lint_reports_unqualified_title
      tests/test_ops_data_portal_validators.py::test_glossary_lint_reports_error_without_contract
      tests/test_ops_data_portal_validators.py::test_glossary_lint_update_judges_only_new_sentences
      tests/test_ops_data_portal_validators.py::test_glossary_lint_covers_verification_not_resolution
      tests/test_ops_data_portal_validators.py::test_glossary_lint_context_message_names_derivation
      tests/test_ops_data_portal_validators.py::test_glossary_lint_passes_quotes_identifiers_and_none
      tests/test_ops_data_portal_validators.py::test_producer_side_rules_follow_the_contract_exemptions
    expected: Seven nodes, nine passed (one has three params; the first two nodes are new names, so the step is red before the build).
    fix_if: The finding message must keep its say-instead remedy and the context_v2_json note.
    hermetic: true
    graduation: graduate
    graduation_check_id: rec-portal-glossary-lint-reports
  - step: 3
    phase: pre-deploy
    action: Grammar, ratchet and the cost-rec template check.
    command: >-
      bin/venv-python -m pytest -q
      tests/checks/contracts/test__rule_grammar.py::test_advisory_only_true_on_repository_state_kinds
      "tests/checks/contracts/test__rule_ratchet.py::test_loosening_and_narrowing_need_their_marker[advisory-added-without-entry]"
      "tests/checks/contracts/test__rule_ratchet.py::test_loosening_and_narrowing_need_their_marker[advisory-added-with-break-entry]"
      "tests/checks/contracts/test__rule_ratchet.py::test_loosening_and_narrowing_need_their_marker[advisory-removed-without-break-entry]"
      tests/test_cost_reconciliation.py::TestReconcileDedupe::test_validate_rec_payload_raises_on_glossary_finding
    expected: Five passed.
    fix_if: >-
      Fix the grammar or ratchet module; the cost-rec check must raise on a non-empty finding or error set, never only on
      a refusal.
    hermetic: true
    graduation: graduate
    graduation_check_id: rule-grammar-advisory-leg
  - step: 4
    phase: pre-deploy
    action: The rule statement and the amending Decision agree.
    command: >-
      bin/venv-python -m pytest -q
      tests/checks/contracts/test_write_time_enforcement_decision.py::test_advisory_leg_names_its_amending_decision
      tests/checks/contracts/test_write_time_enforcement_decision.py::test_write_time_enforcement_rule_declared
      tests/test_contract_rules.py::test_ops_recommendations_declares_its_rule_list
    expected: Three passed (the first node is new, so the step is red before the build).
    fix_if: Place the sidecar blocks verbatim; never edit approved words to pass.
    hermetic: true
    graduation: graduate
    graduation_check_id: write-time-enforcement-advisory-decision
  - step: 5
    phase: pre-deploy
    action: Automated producers' rec templates still clear the glossary, now as an empty finding set.
    command: >-
      bin/venv-python -m pytest -q
      tests/ops_data_portal/test_advisory_lints.py::test_portal_gate_helper_fails_on_a_glossary_finding
      tests/telemetry_verify/test_alarms.py::test_every_alarm_record_passes_the_portal_row_gate
      tests/test_security_detector_probe.py::test_rec_fields_pass_the_portal_gate
      tests/convergence_health/test_escalate.py::TestEscalatePortalValidators::test_persistent_red_files_rec
      tests/convergence_health/budget_ingest/test_ingest.py::TestIngestBudgetBreaches::test_rec_fields_pass_the_real_acceptance_linter_and_write_time_validators
      tests/ci/test_actions_capacity_alarm.py::test_build_fields_pass_the_portal_write_gate
      tests/checks/test__budget_recs.py::TestBudgetBreachRecFiling::test_breach_priority_survives_real_accepted_values_validator
      tests/checks/test__budget_recs.py::TestBudgetBreachRecFiling::test_bypass_priority_survives_real_accepted_values_validator
    expected: Nineteen passed (the alarm node is parametrized 4x3; red before the build, since the first node's file and tests/fixtures/portal_gate.py do not exist).
    fix_if: A finding names a template word; fix the producer's template, never the helper or the glossary.
    hermetic: true
    graduation: graduate
    graduation_check_id: producer-rec-templates-clear-glossary
  - step: 6
    phase: pre-deploy
    action: The retired record left entries/ and nothing live names it or the two old test nodes.
    command: >-
      test ! -e config/agent/verification_registry/entries/rec-portal-glossary-lint-refuses.yaml && test -e
      config/agent/verification_registry/entries/deprecated/rec-portal-glossary-lint-refuses.yaml && ! rg -n
      "rec-portal-glossary-lint-refuses|test_glossary_lint_refuses_unqualified_title|test_glossary_lint_fails_closed_without_contract"
      --glob '!docs/plans/**' --glob '!**/deprecated/**' . && echo RETIRED_CLEAN
    expected: No rg match, then RETIRED_CLEAN.
    fix_if: Remove or rename the live reference rg names; never delete the deprecated record.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: One-time move claim, true once at merge; nothing re-adds a retired record.
  - step: 7
    phase: pre-deploy
    action: Nothing Lambda-packaged changed, so nothing deploys.
    command: >-
      git fetch -q origin main && git diff --exit-code origin/main -- config/lambda/ducklake/field_semantics.yaml &&
      bin/venv-python -m scripts.schema_to_field_semantics --check && echo PROJECTION_UNCHANGED
    expected: No diff, the generator check passes, then PROJECTION_UNCHANGED.
    fix_if: A projection change means a projected key moved; revert it (only dq_intent leg params may change).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative moment claim against origin/main; validate_field_semantics_drift guards the projection on every run.
  - step: 8
    phase: pre-deploy
    action: DECISIONS.md and data-modeling-standard.yaml (the sidecar's two files) hold exactly the approved words.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug rec-lints-advisory --expect
      6bcdfd5cec463b2b027be2927e5be5e01e8b6cba3bf4007f7c775751612797e0
    expected: >-
      The line APPROVED-TEXT OK followed by the digest (the sidecar digest wording check r5 recorded; the approval run
      carries the matching approved-words digest approved_text record prints as approved=; a later wording change
      re-pins it by plan amendment).
    fix_if: Place the sidecar's words verbatim; a wording change needs a new approval, never an edit to match.
    hermetic: true
    expected_literals:
      - APPROVED-TEXT OK
    graduation: waive
    graduation_waiver_reason: >-
      Build-base-bound moment claim: it checks this build's head against this sidecar and base; validate_merge_step
      re-checks it on the PR against the operator's approval run.
  - step: 9
    phase: pre-deploy
    action: >-
      Fast presubmit, then the full tier before handoff, started backgrounded with a 2 h limit from the top-level
      session; its verdict is validation_result --verify-head, never a pipe's exit status.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: Both tiers exit 0 and --verify-head confirms a PASS recorded for the current HEAD.
    fix_if: Fix each failure at root cause on the branch and re-run from the start (Decision 55; timeout_disposition blocked).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Graduating it would invoke scripts.validate recursively; PR CI runs the fast tier on every push and main runs the
      full tier after merge.
test_obligations:
  - source: scripts/ops_portal/write_validators.py
    behavior: An advisory leg reports and never refuses; refusing legs still refuse; results are returned and printed.
    verification_step: 1
    test_selector: tests/ops_data_portal/test_advisory_lints.py::test_refusing_legs_still_refuse_beside_findings
    red_green_expectation: red before (file absent), green after
  - source: scripts/checks/contracts/_rule_grammar.py
    behavior: advisory is legal only as true on repository_state kinds.
    verification_step: 3
    test_selector: tests/checks/contracts/test__rule_grammar.py::test_advisory_only_true_on_repository_state_kinds
    red_green_expectation: red before (node absent), green after
  - source: scripts/checks/contracts/_rule_ratchet.py
    behavior: Adding or removing advisory needs a semantic-break entry.
    verification_step: 3
    test_selector: "tests/checks/contracts/test__rule_ratchet.py::test_loosening_and_narrowing_need_their_marker[advisory-added-without-entry]"
    red_green_expectation: red before (param id absent), green after
  - source: scripts/cost_reconciliation.py
    behavior: The template check raises on any advisory finding or error.
    verification_step: 3
    test_selector: tests/test_cost_reconciliation.py::TestReconcileDedupe::test_validate_rec_payload_raises_on_glossary_finding
    red_green_expectation: red before (node absent), green after
  - source: docs/contracts/ops_recommendations.yaml
    behavior: The three glossary legs carry advisory true; the acceptance leg does not.
    verification_step: 1
    test_selector: tests/ops_data_portal/test_advisory_lints.py::test_contract_marks_glossary_legs_advisory_not_acceptance
    red_green_expectation: red before (file absent), green after
  - source: docs/contracts/data-modeling-standard.yaml
    behavior: The rule statement names the amending Decision for advisory legs.
    verification_step: 4
    test_selector: tests/checks/contracts/test_write_time_enforcement_decision.py::test_advisory_leg_names_its_amending_decision
    red_green_expectation: red before (node absent), green after
  - source: docs/DECISIONS.md
    behavior: The amending Decision exists and amends 240 and 210.
    verification_step: 4
