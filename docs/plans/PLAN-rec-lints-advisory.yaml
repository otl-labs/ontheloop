    red_green_expectation: red before (section absent), green after
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - >-
    No Lambda-packaged file changes and no deploy: write_time_exemptions entries are unchanged and the advisory key
    lives on the dq_intent leg, which the projection does not carry (scripts/field_semantics_rule_projection.py).
  - >-
    Both contracts stay at or under their caps; relieve by re-spelling an existing log row in flow style (same values),
    never a cap raise (Decision 128).
  - >-
    acceptance_lint keeps refusing (operator decision 2026-11-16); only the three glossary legs carry advisory: true.
    array_element_reference keeps refusing (plan A moves it into the writer).
  - >-
    Never call the writer directly from a session; rec reads and writes go through scripts.ops_data_portal and the
    reader verbs (Single Portal Invariant). Tests patch the writer transport; none writes the warehouse.
  - >-
    Weakenings named for Decision 235 cl.1 approval: glossary_lint stops refusing rec title, context and verification;
    test_glossary_lint_refuses_unqualified_title and test_glossary_lint_fails_closed_without_contract become
    report-not-refuse tests; the graduated record rec-portal-glossary-lint-refuses retires to entries/deprecated/.
    Nothing else is loosened.
  - >-
    Graduated shards kept (node ids unchanged; assertions repaired in place for the same claim, all green after):
    dependencies-reference-reader-loud-fail, executor-loop-kernel-path-not-automatable, portal-gate-is-the-writer-gate,
    portal-producer-rules-follow-exemptions, portal-removal-ledger-by-mutation, portal-update-gate-never-stricter,
    rec-portal-glossary-lint-new-text-only, repair-dependency-tokens-dry-run-safe, recs-consumers-read-live-rows,
    rule-grammar-bans-enforced, rule-ratchet-loosening-and-narrowing (its parametrized node gains three arms),
    ops-row-rules-contracts, ops-rule-source-records, write-time-enforcement-decision-declared.
