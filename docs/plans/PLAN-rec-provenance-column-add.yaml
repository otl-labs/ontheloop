slug: rec-provenance-column-add
intent: >-
  Add provenance_json to ops_recommendations: a nullable per_write VARCHAR column whose contract declares a dated
  json_object leg (schema_version 1, 4096 bytes, closed key set), projected into field_semantics.yaml, physically added
  by the admin-tier reconcile_columns action, and proven on the first serving deploy by a new --lambda-row-rules
  vector. Plan C2 of the rec write-path data-quality series (C1 rec-provenance-shape-check shipped the writer check and
  the per_write attribute); it gives plan D a declared column to fill. Serves NS.5 (a data rule is enforced at the
  write boundary wherever the write can decide it).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-rec-provenance-column-add.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Operator
  work item from the 2026-11-12 rec read/write audit and the 2026-11-16 consult (plan C of the B-F brief, split C1/C2
  on a blind Fable consult; C1 merged #2123, built #2145, deployed run 44153472191).
  Decision 79 makes it V3 (field_semantics.yaml is in every DuckLake Lambda package), met by steps 6-9.
closes_criteria: []
amends: []
cites: [dec:64, dec:79, dec:81, dec:126, dec:143, dec:210]
scope:
  - file: docs/contracts/ops_recommendations.yaml
    action: Modify
    purpose: |-
      Operator-approved words (context item 1); nothing else in the file changes.
      Part 1: this field, inserted immediately before _contract_version (<build UTC date> is the build commit's UTC
      date, the same in part 3):
        provenance_json:
          type: str
          iceberg_type: string
          nullable: true
          per_write: true
          description: >-
            How this row version was written, as a JSON object: the writing client and its commit, whether that checkout had
            uncommitted changes, the rule set and each write-path check with its outcome, and optionally the inputs the
            client scored risk from. NULL when the client sent none.
          semantics: >-
            Describes the write that produced this row version, never the recommendation. per_write: a portal update path
            never carries it forward from the prior row, so an update that sends none stores NULL; the writer stores what it
            is sent and checks only its shape (json_object). The key set is closed per schema_version; once declared, a
            version never changes and max_bytes never shrinks, so a new key set is a new schema_version. No producer emits it
            yet: the plan that makes the portal fill it defines ruleset_version's value and the risk keys' sources and adds a
            dated not_null leg.
          populated_by: Caller-supplied on file_rec and update_rec (scripts/ops_data_portal.py); no producer emits it yet.
          dq_intent:
            json_object:
              max_bytes: 4096
              exclude_before: "<build UTC date>"
              versions:
                1:
                  required:
                    schema_version: integer
                    client: string
                    client_commit: string
                    client_dirty: boolean
                    ruleset_version: string
                    checks: {map: {key_pattern: '^[a-z][a-z0-9_]{0,63}$', values: [pass, fail, advisory, skipped]}}
                  optional:
                    risk_formula_version: string
                    file_exists_at_commit: boolean
                    complexity_fallback: boolean
                    effort_fallback: boolean
                    coverage_present: boolean
                    ceiling_fallback: boolean
                    boundary_match: boolean
                    empty_file_fallback: boolean
                    complexity_max: number
                    effort_scale: number
                    risk_raw: number
                    maturity_ceiling: number
                    coverage_line_rate: number?
      Part 2: the header comment "(25 columns + _contract_version = 26 total)" becomes "(26 columns +
      _contract_version = 27 total)" and the description's "26 fields: 25 from the live" becomes "27 fields: 26 from
      the live".
      Part 3: these two rows, appended as the last entries of the table-level amendment_log (the second pairs the
      description's count change, which validate_contract_drift category 6 requires):
        - {date: "<build UTC date>", semantic_break: false, change_class: field_add, summary: "PLAN-rec-provenance-column-add: add provenance_json, a nullable per_write VARCHAR column with a dated json_object leg (schema_version 1, 4096 bytes). No not_null leg yet; no column removed or retyped.", migration_story: "Additive: every existing row reads NULL, which the leg admits. The physical column lands through the maintenance function's reconcile_columns (listed in pending_reconcile until then, which holds the serving deploy); the plan that makes the portal fill the column adds a dated not_null leg."}
        - {date: "<build UTC date>", semantic_break: false, change_class: prose_improvement, summary: "PLAN-rec-provenance-column-add: the description's field count reads 27 for provenance_json."}
      Part 4 (structural relief: the file is 554 of its 556-line budget): rewrite block-style amendment_log rows,
      oldest first, as one-line flow mappings until the file is at most 556 effective lines; each row's parsed value
      stays identical (step 1 asserts it).
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      Operator-approved words (context item 1), rule write-time-enforcement only, the text half of rec-5281. Part 1
      (DECLARATIONS): "so a new field on an existing SCD2 contract is nullable with a dated not_null." becomes "so a new
      field on an existing SCD2 contract is nullable and any not_null leg it carries is dated; a per_write column
      (nullable, never derived) is never carried forward from the prior row by a portal update path, and the writer
      stores what it is sent." Part 2 (RATCHET), after "adding or removing advisory: true on a leg needs a semantic-break
      entry": "; a json_object leg, which the census cannot check, changes only by an added schema_version or a larger
      max_bytes, and its date never moves (any other change is a temporary exemption, the drop, then a new dated
      leg)". Part 3 (COVERAGE), after "with rec-4166's monitor a backstop;": " the json_object shape leg -> the ops
      writer (check_json_objects), proven by its unit tests and the --lambda-row-rules gate, the portal running it as
      the insert pre-check;". Part 4: amendment row first in amendment_log: {date: "<build UTC date>",
      semantic_break: true, change_class: governance_note_add, summary: "PLAN-rec-provenance-column-add (rec-5281 text
      half): rule write-time-enforcement states the json_object leg's ratchet and coverage and the per_write column
      attribute; a new field's not_null leg, when it has one, is dated."}. Nothing else changes. Size: 520 of 533 effective
      lines, about +4 (the long lines grow; one new row line); if over, rewrap the touched paragraphs to net zero, never
      raise the budget.
  - file: config/lambda/ducklake/field_semantics.static.yaml
    action: Modify
    purpose: >-
      contract_table_ops.ops_recommendations: migration_columns history and current each gain "provenance_json: {role:
      input, sql_type: VARCHAR, nullable: true}" after context_v2_json; pending_reconcile history and current become
      [provenance_json] (the merge-time gate requires pending_reconcile, which holds serving until the bookkeeping PR;
      migration_columns is documentary, kept as context_v2_json's). Size:
      481 of 500 effective lines, +2; the bookkeeping PR adds about 14 (two reconciled entries, as ops_decisions'
      intent), still under 500; if not, write the evidence as one flow line, never raise the budget.
  - file: config/lambda/ducklake/field_semantics.yaml
    action: Modify
    purpose: Regenerated by bin/venv-python -m scripts.schema_to_field_semantics; never hand-edited.
  - file: scripts/ducklake_smoke/lambda_ops_gates.py
    action: Modify
    purpose: >-
      ROW_RULES_CASES gains ("json_object", {"provenance_json": '{"schema_version": 1}'}, "provenance_json") (required
      keys missing). Nothing else: the gate stays write-free (every case is refused, nothing stored), so a serving deploy
      adds no row to the append-only rec tables.
  - file: tests/common/test_ducklake_writes_per_write.py
    action: Create
    purpose: >-
      Hermetic proof that the writer stores what it is sent for a per_write column, on the real repo projection
      (FakeCon from tests/fixtures/ducklake_fakes; a MIRROR docstring like test_ducklake_writes_references.py): nodes
      test_write_binds_provenance_json_as_sent (a valid v1 value is bound verbatim in the history and current MERGE
      params at provenance_json's ordered position), test_update_omitting_provenance_json_binds_null (an update path
      record without the key binds None in both MERGEs) and test_current_merge_updates_provenance_json (the current
      MERGE's UPDATE SET names provenance_json = s.provenance_json, so an omitted value replaces the prior one). The
      live round trip is plan D's, its first emitter.
  - file: tests/common/test_ducklake_write_rules.py
    action: Modify
    purpose: >-
      test_row_rule_gate_cases_trip_their_rule's pinned list gains json_object; test_json_object_spec_built_from_projected_leg
      asserts set(json_object_columns(SPEC.fields)) == {"provenance_json"} (was == {});
      test_select_widens_only_with_dated_rules's pinned dated set gains provenance_json (its dated leg widens
      existing_row_select).
  - file: tests/common/test_ducklake_write_rules_integration.py
    action: Modify
    purpose: >-
      test_the_census_sql_and_the_engine_agree_row_for_row skips census.is_writer_shape(rule) beside
      census.is_writer_lookup(rule): the census compiles no check for a json_object leg (C1), so the first declared one
      would otherwise raise. Integration-marked: never CI-run (rec-4071); VP step 1 runs it locally.
  - file: tests/test_contract_rules.py
    action: Modify
    purpose: test_ops_recommendations_declares_its_rule_list's expected map gains provenance_json's json_object leg and date.
  - file: tests/test_schema_to_field_semantics.py
    action: Modify
    purpose: test_ops_recommendations_columns_present asserts provenance_json in cols and 27 columns (in place; file 498 of 500 SLOC).
  - file: tests/checks/ops_governance/test_validate_reconcile_pending_gate.py
    action: Modify
    purpose: >-
      test_pending_reconcile_map_real asserts _blocking_tables == ["ops_recommendations"] and its pending sides name
      provenance_json, its docstring reworded to match (in place; file 500 of 500 SLOC: no net line). The bookkeeping PR restores the empty assertion.
