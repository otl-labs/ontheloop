acceptance_criteria:
  - >-
    ops_recommendations.yaml declares provenance_json exactly as its scope row gives it, the field count reads 27, the
    two amendment rows are present, every compacted amendment row parses to its prior value, and the file is within its
    structural budget; data-modeling-standard.yaml carries exactly parts 1-4 of its scope row.
  - >-
    field_semantics.yaml is the generator's output: ops_recommendations has 27 columns and provenance_json projects
    per_write true, the json_object leg and exclude_before.json_object; the static sidecar lists provenance_json in
    migration_columns and pending_reconcile on both sides.
  - >-
    The writer's rule engine, built from the repo projection, refuses a provenance_json missing required keys with rule
    json_object on column provenance_json, and the rule source, conformance, census, ratchet and structural checks pass.
  - >-
    Before the reconcile, the deploy gate refuses the serving deploy naming ops_recommendations and ci-rca files no
    fresh critical for it (designed refusal); after the operator's reconcile_columns response lists provenance_json in
    added_history and added_current and the bookkeeping PR merges, the serving deploy and every smoke job are green and
    --lambda-row-rules reports 6 cases refused with nothing stored.
  - The reader returns provenance_json as null for an existing rec after the serving deploy.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Contract to projection: the declared rule list, the column count, per_write projection, the repo spec's
      json_object column, the generator drift check, and every compacted amendment row parsing to its base value.
    command: >-
      bin/venv-python -m pytest -q
      tests/test_contract_rules.py::test_ops_recommendations_declares_its_rule_list
      tests/test_schema_to_field_semantics.py::TestGenerateIntegration::test_ops_recommendations_columns_present
      tests/test_schema_to_field_semantics_columns.py::test_projected_per_write_equals_contract_declared
      tests/common/test_ducklake_write_rules.py::test_json_object_spec_built_from_projected_leg
      tests/common/test_ducklake_write_rules.py::test_row_rule_gate_cases_trip_their_rule
      tests/common/test_ducklake_write_rules.py::test_select_widens_only_with_dated_rules
      && bin/venv-python -m pytest -q -m integration -rs
      tests/common/test_ducklake_write_rules_integration.py::test_the_census_sql_and_the_engine_agree_row_for_row
      && bin/venv-python -m scripts.schema_to_field_semantics --check
      && bin/venv-python -c "import subprocess,yaml;p='docs/contracts/ops_recommendations.yaml';
      b=yaml.safe_load(subprocess.run(['git','show','origin/main:'+p],capture_output=True,text=True,check=True).stdout);
      h=yaml.safe_load(open(p));fl=lambda d:[e for e in d.get('amendment_log',[])]+[e for f in d['fields'].values() for e in f.get('amendment_log',[])];
      new=[e for e in fl(h) if e not in fl(b)];assert all(e in fl(h) for e in fl(b));assert len(new)==2,new;print('AMENDMENTS_PRESERVED')"
      && grep -q "a json_object leg, which the census cannot check" docs/contracts/data-modeling-standard.yaml
    expected: >-
      Every selected test passed (the integration node passed and was not skipped; a skip is a FAIL, rec-4071), the
      generator reports no drift, AMENDMENTS_PRESERVED prints and the RATCHET sentence is present.
    fix_if: >-
      Never hand-edit field_semantics.yaml; a compacted row that no longer parses to its base value is restored, not
      re-baselined.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The nodes are existing registered tests updated in place and run by every fast tier that selects these files; the
      amendment comparison reads origin/main, which a graduated replay cannot pin.
  - step: 2
    phase: pre-deploy
    action: >-
      The writer binds provenance_json as sent (None when omitted, which the current MERGE writes over the prior value),
      and the --lambda-row-rules gate sends the new json_object case on a scripted transport, storing nothing.
    command: >-
      bin/venv-python -m pytest -q
      tests/common/test_ducklake_writes_per_write.py::test_write_binds_provenance_json_as_sent
      tests/common/test_ducklake_writes_per_write.py::test_update_omitting_provenance_json_binds_null
      tests/common/test_ducklake_writes_per_write.py::test_current_merge_updates_provenance_json
      tests/ducklake_neon_smoke_test/test_lambda_ops_gates.py::test_lambda_row_rules_ok
    expected: Every selected test passed.
    fix_if: Fix the code, never the assertion; a gate FAIL message must not echo a row (rec-4409).
    hermetic: true
    graduation: graduate
    graduation_check_id: writer-stores-per-write-column-as-sent
  - step: 3
    phase: pre-deploy
    action: >-
      The merge-time reconcile gate accepts the added column with its pending entry, and the deploy gate refuses while it
      is pending.
    command: >-
      bin/venv-python -m pytest -q
      tests/checks/ops_governance/test_validate_reconcile_pending_gate.py::TestRealRepoIntegration::test_pending_reconcile_map_real
      && bin/venv-python -m scripts.checks.ops_governance.validate_reconcile_pending_gate
      && { ! bin/venv-python -m scripts.checks.ops_governance.validate_reconcile_pending_gate --deploy-gate; } && echo DEPLOY_GATE_HOLDS
    expected: The test passed, the merge-time check exits 0, the deploy gate exits non-zero naming ops_recommendations, then DEPLOY_GATE_HOLDS.
    fix_if: A merge-time failure means the pending entry or migration_columns row is missing; fix the sidecar.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: >-
      Fast presubmit, then the full tier before handoff, started backgrounded with a 2 h limit from the top-level
      session; its verdict is validation_result --verify-head, never a pipe's exit status.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: Both tiers exit 0 and --verify-head confirms a PASS recorded for the current HEAD.
    fix_if: Fix each failure at root cause on the branch and re-run from the start (Decision 55; timeout_disposition blocked).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Graduating it would invoke scripts.validate recursively; PR CI runs the fast tier on every push and main runs the
      full tier after merge.
  - step: 5
    phase: post-deploy
    action: >-
      The merge's governed deploy run: with mcp__github__actions_list find the first deploy-ducklake-lambdas run whose
      head_sha is $MERGE_SHA or a first-parent descendant of it and whose gate job chose to deploy (gate output deploy
      true; a gate-skipped run is passed over), export RUN_SHA (its head_sha) and RUN_STARTED (its
      run_started_at), and save its jobs (actions_list list_workflow_jobs) to $DEPLOY_JOBS_JSON. The maintenance
      functions ship the new projection and pass their smoke, and the serving deploy is refused by design. Export
      RUN_ID (its id). Then ci-rca acted on it and filed nothing: with actions_list find the completed ci-rca.yml run
      (event workflow_run, created after the deploy run completed; no head_sha filter, as GitHub stamps main's head at
      trigger time) whose rca job log prints RUN_ID="$RUN_ID"; export RCA_CONCLUSION (its conclusion). Every log here
      ($RCA_LOG, $SMOKE_LOG, $TELEMETRY_SMOKE_LOG) is get_job_logs' decoded logs_content with tail_lines 3000. Only then
      read ci_rca_open: no open ci_rca rec created after RUN_STARTED names deploy-ducklake-lambdas.
    command: >-
      git merge-base --is-ancestor "$MERGE_SHA" "$RUN_SHA" && test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import
      json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));u=lambda v:v.get('jobs',[]) if isinstance(v,dict) else v;
      jobs={x['name']:x.get('conclusion') for x in u(u(j))};print(jobs);assert jobs.get('deploy-maintenance')=='success' and
      jobs.get('maintenance-smoke')=='success' and jobs.get('reconcile-gate')=='failure',jobs;
      assert jobs.get('deploy-telemetry-twin')=='success' and jobs.get('telemetry-twin-smoke')=='success',jobs;
      assert jobs.get('deploy-serving') in ('skipped',None),jobs;print('HELD_AS_DESIGNED')"
      && test "$RCA_CONCLUSION" = success && grep -qF "RUN_ID=\"$RUN_ID\"" "$RCA_LOG" && grep -qE 'skip=true$' "$RCA_LOG"
      && echo CI_RCA_SKIPPED_BY_DESIGN && bin/venv-python -c "import
      os;from src.common import ducklake_reader_client as rc;rows=rc.make_reader().named('ci_rca_open');
      new=[x for x in rows if str(x.get('created_timestamp'))[:19].replace(' ','T')>os.environ['RUN_STARTED'][:19] and
      any(k in (str(x.get('title',''))+str(x.get('file',''))).lower() for k in ('deploy-ducklake','reconcile'))];
      assert not new,new;print('NO_FRESH_CRITICAL')"
    expected: >-
      The run descends from the merge; deploy-maintenance, maintenance-smoke, deploy-telemetry-twin and
      telemetry-twin-smoke success, reconcile-gate failure,
      deploy-serving skipped, then HELD_AS_DESIGNED, CI_RCA_SKIPPED_BY_DESIGN and NO_FRESH_CRITICAL.
    fix_if: >-
      A gate-skipped run is not the run (pick the next deploying one). A red deploy-maintenance, maintenance-smoke or
      telemetry twin leg is root-caused and fixed forward before the admin step (Decision 55). No ci-rca run yet: wait
      for it (event-driven, never a sleep loop); skip=false in its log is a designed_refusal defect, reported. If none
      prints this RUN_ID and a later run of its concurrency group (same head, same workflow) has completed, GitHub
      dropped the queued run: report that with both run ids instead of waiting.
      A fresh critical for the designed refusal alone is a designed_refusal defect: report it, never close it by hand. A
      concurrent real failure in the run mints its own rec by design (designed_refusal suppresses only a lone
      reconcile-gate failure); triage it on its own. If ci_rca_open's row shape differs, read it and adapt the filter,
      never drop the assertion.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: >-
      ADMIN STEP (operator only, on his own words naming it; Decisions 126, 143): from AWS CloudShell, invoke
      reconcile_columns on the deployed maintenance function with the block in execution step 6. The operator pastes the
      response; save it to $RECONCILE_JSON.
    command: >-
      bin/venv-python -c "import json,os;r=json.load(open(os.environ['RECONCILE_JSON']));b=r.get('body',r);
      b=json.loads(b) if isinstance(b,str) else b;print(b);assert b.get('ok') is True and b.get('table')=='ops_recommendations';
      assert 'provenance_json' in b['added_history'] and 'provenance_json' in b['added_current'],b;print('RECONCILED')"
    expected: The response is ok for ops_recommendations and names provenance_json in added_history and added_current, then RECONCILED.
    fix_if: >-
      columns_pre_existing true on both sides with empty added lists means it was already added (idempotent re-run):
      record that response instead. A 500 is reported to the operator verbatim; never retried autonomously.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      Bookkeeping PR (does not declare this plan; static sidecar plus one test line): provenance_json moves from
      pending_reconcile to reconciled on both sides with {at: <UTC date>, evidence: the step 6 response body}, and
      test_pending_reconcile_map_real asserts the empty map again. Merge on green.
    command: >-
      bin/venv-python -m scripts.checks.ops_governance.validate_reconcile_pending_gate --deploy-gate && bin/venv-python -m
      pytest -q tests/checks/ops_governance/test_validate_reconcile_pending_gate.py::TestRealRepoIntegration::test_pending_reconcile_map_real
    expected: The deploy gate exits 0 (nothing pending) and the test passed.
    fix_if: Evidence must be the response body verbatim; never clear pending_reconcile without it.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      The bookkeeping merge's governed deploy run (found as in step 5, gate-skipped runs passed over, against the
      bookkeeping squash sha $BOOK_SHA; jobs
      to $DEPLOY_JOBS_JSON, the smoke job's log via mcp__github__get_job_logs to $SMOKE_LOG, the telemetry-smoke job's
      log to $TELEMETRY_SMOKE_LOG): every deploy and smoke job of all six affected artifacts green (ducklake_writer,
      ducklake_reader, ducklake_maintenance, ducklake_maintenance_smoke, ducklake_telemetry_writer,
      ducklake_telemetry_reader), and the row-rules gate reports the new case with nothing stored. The one carve-out:
      a telemetry-smoke failure whose log shows rec-5247's sessions_window read_deadline_exceeded is reported, not fixed.
    command: >-
      git merge-base --is-ancestor "$BOOK_SHA" "$RUN_SHA" && bin/venv-python -c "import json,os,re;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
      u=lambda v:v.get('jobs',[]) if isinstance(v,dict) else v;jobs={x['name']:x.get('conclusion') for x in u(u(j))};print(jobs);
      want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke','deploy-telemetry-twin','telemetry-twin-smoke','deploy-telemetry'];
      assert all(jobs.get(w)=='success' for w in want),jobs;ts=jobs.get('telemetry-smoke');
      log=open(os.environ['TELEMETRY_SMOKE_LOG']).read() if ts!='success' else '';
      assert ts=='success' or re.search(r'sessions_window.*read_deadline_exceeded|read_deadline_exceeded.*sessions_window',log),ts;
      print('DEPLOY_OK' if ts=='success' else 'DEPLOY_OK TELEMETRY_SMOKE_REC_5247')" && grep -E
      "LAMBDA_ROW_RULES OK 6 cases rejected 422 row_rule, nothing stored" "$SMOKE_LOG" && echo ROW_RULES_GATE_OK
    expected: >-
      DEPLOY_OK (or DEPLOY_OK TELEMETRY_SMOKE_REC_5247, reported to the coordinator with the run id), the gate's OK
      line with 6 cases and nothing stored, then ROW_RULES_GATE_OK.
    fix_if: >-
      A red job is root-caused and fixed forward, never re-run to green (Decision 55). Only the rec-5247 signature is
      carved out; any other telemetry-smoke failure is this plan's to fix.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: The physical column is live; the reader returns it for an existing rec, empty.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as rc;rows,_=rc.fetch_recs_by_ids(rc.make_reader(),['rec-5281']);
      assert rows and 'provenance_json' in rows[0] and rows[0]['provenance_json'] is None,rows[0].keys();print('READER_SEES_COLUMN')"
    expected: READER_SEES_COLUMN
    fix_if: A missing key means the physical column is absent (recs_by_ids is SELECT *, so this proves the reconcile, step 8 the serving deploy); re-check step 6.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/contracts/ops_recommendations.yaml
    behavior: The contract declares provenance_json's dated json_object leg as the one rule source.
    verification_step: 1
