    1. Leg grammar (json_object_spec): {max_bytes: int 1..65536, versions: {int >= 1: {required: {key: type}, optional:
    {key: type}}}, exclude_before}; a declared key name matches ^[a-z][a-z0-9_]{0,63}$ (grammar for the contract's own
    names; data keys must equal a declared one); a type is string, integer, number or boolean, optionally suffixed "?"
    (null allowed), or {map: {key_pattern, values}}: an anchored regex (^...$, compiles, <= 256 chars) and a non-empty
    list of distinct strings, both contract-declared and compared by the conformance arm (Decision 210 cl.3: no data
    vocabulary in writer code; C2 declares the check-outcome set); every version requires schema_version: integer; no key
    both required and optional.
  - >-
    2. Value rules (None passes; first failure raises): a str; UTF-8 length <= max_bytes; json.loads refusing NaN and
    Infinity (parse_constant) and duplicate keys (object_pairs_hook); a top-level object; integer (not bool)
    schema_version naming a declared version; every required key; no undeclared key; integer is int not bool, number
    int or float not bool, a map an object whose every key fullmatches key_pattern and every value is one of values.
