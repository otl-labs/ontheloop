constraints:
  - No rescue agents or workaround loops (Decision 55); a rejection is terminal and never retried.
  - >-
    Code reaches production only through deploy-ducklake-lambdas.yml (Decisions 125, 126, 254); no Terraform change, no
    column add, no contract declares json_object or per_write, no admin step, no governed contract text.
  - >-
    src/row_rules stays a pure stdlib leaf with literal-only edits; every evaluation lives in the ops writer adapter.
    tests/row_rules/test_rules.py is not edited (SLOC cap).
  - field_semantics.yaml is regenerated, never hand-edited, and must come out byte-identical.
  - >-
    scripts/ops_data_portal.py stays at or under 500 SLOC (Decision 128); if the change would cross, move the merge into
    a helper in scripts/ops_portal/write_validators.py rather than raise a budget.
  - >-
    Never call the writer directly from a session; rec reads and writes go through scripts.ops_data_portal and the reader
    verbs (Single Portal Invariant).
context:
  - >-
    1. Leg grammar (json_object_spec): {max_bytes: int 1..65536, versions: {int >= 1: {required: {key: type}, optional:
    {key: type}}}, exclude_before}; key ^[a-z][a-z0-9_]{0,63}$; type string, integer, number, boolean or check_map, each
    optionally suffixed "?" (null allowed); every version requires schema_version: integer; no key both required and
    optional; optional may be absent.
  - >-
    2. Value rules (None passes; first failure raises): a str; UTF-8 length <= max_bytes; json.loads refusing NaN and
    Infinity (parse_constant) and duplicate keys (object_pairs_hook); a top-level object; integer (not bool)
    schema_version naming a declared version; every required key; no undeclared key; integer is int not bool, number
    int or float not bool, check_map an object of pattern-matching keys to pass, fail, advisory or skipped.
  - >-
    3. Binding mirrors the engine's dated rules (Decision 210, 2026-10-04): binds when undated, on insert, when
    created_timestamp >= exclude_before, or when the value differs from prior's. A new SCD2 leg needs its own
    exclude_before (ratchet); C2 sets it; any later params change is a ratchet narrowing (semantic_break plus census).
  - >-
    Decision-scout r1 FLAGS_FOUND: SPIRIT NOTE 210 cl.3 (the draft hard-coded the column name in update_rec), resolved
    by the per_write attribute. r2 FLAGS_FOUND, CITE 65, 79, 210, 268; SPIRIT NOTE NS.5: per_write is a portal update
    semantic a direct writer caller can bypass. Accepted with note: not a data rule; plan E's alarm watches the
    residual, plan F's hook trips direct calls, and C2's brief carries a writer-clock key option. Decisions triaged:
    217 of 217. Roadmap items intersected: 14; CONFLICT: 0; RELATED: 14. Serves: NS.5 4/5.
  - >-
    Precedent: plan A (Decision 268, #2098; its Amendment 2) put reference evaluation in this adapter for the same
    reasons. C2 (separate thread, brief /mnt/project-files/rec-provenance-column/BRIEF-plan-C2.md) declares
    provenance_json with both keys. Operator: "write the plan" 2026-11-17 13:24 UTC for this approach and the C1/C2
    split (blind Fable consults, /mnt/project-files/rec-provenance-column/advisor-brief/).
  - >-
    red_overlap 2026-11-17: blocked by rec-5247 (Critical ci_rca, telemetry-reader smoke 504, slo_breached, shared
    files none). Deferral: this plan shares no file with it and repairs nothing in it, but step 8 needs telemetry-smoke
    green, so the build re-runs red_overlap and waits for a clear verdict or the operator's ruling.
  - "Overlaps: B's build #2099; unbuilt PLAN-telemetry-producer-admission-plan-review-capture. Second to build rebases."
  - >-
    Graduated shards kept (node ids unchanged; nodes only added): ops-dependency-reference-conformance,
    ops-dependency-reference-precheck-and-gate, ops-dependency-reference-projection, ops-row-rules-projection,
    ops-row-rules-writer, ops-rule-census-dq-kinds, portal-gate-is-the-writer-gate, portal-producer-rules-follow-exemptions,
