acceptance_criteria:
  - >-
    For a column whose projection declares json_object, the writer rejects every malformed value named in context item
    2 on file_ops, write_ops and update_ops with error rule json_object and the column, writes nothing and never
    retries; a declared-shape value and NULL land (unit evidence on doubles, real-engine evidence on the pinned engine).
  - >-
    The leg binds per the dated-rule semantics: every insert, every row created on or after its exclude_before, and an
    older row only when the write changes the column.
  - >-
    The portal's gate_write refuses a malformed value on insert with the same rule and column, and leaves the dated leg
    to the writer on update.
  - >-
    The generator projects the leg's params and per_write; the grammar refuses malformed params and the leg on an event
    contract; the conformance check fails a declared leg the writer does not build; the census reports the leg as
    WRITER-SHAPE and compiles nothing for it; the ratchet frees an added version or a larger cap and refuses any other
    params change and an earlier exclude_before, with no census-token route.
  - >-
    update_rec and update_decision never send a per_write column read from the prior row: an update that omits it
    writes NULL, and an update that names it sends the named value.
  - >-
    No contract declares json_object or per_write in this plan: config/lambda/ducklake/field_semantics.yaml is
    byte-identical before and after.
  - >-
    The governed deploy-ducklake-lambdas run on a commit containing the merge sha is green in every deploy and smoke
    job, including --lambda-row-rules and the telemetry jobs (shared engine).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The writer adapter's json_object spec, evaluator and binding on doubles.
    command: >-
      bin/venv-python -m pytest -q
      tests/common/test_ducklake_write_rules.py::test_json_object_spec_built_from_projected_leg
      tests/common/test_ducklake_write_rules.py::test_json_object_spec_refuses_malformed_params
      tests/common/test_ducklake_write_rules.py::test_json_object_leg_with_its_exemption_is_refused
      tests/common/test_ducklake_write_rules.py::test_json_object_accepts_declared_shapes_and_null
      tests/common/test_ducklake_write_rules.py::test_json_object_map_type_uses_declared_key_pattern_and_values
      tests/common/test_ducklake_write_rules.py::test_json_object_refusals_name_rule_and_column_without_values
      tests/common/test_ducklake_write_rules.py::test_json_object_binding_follows_exclude_before
      tests/common/test_ducklake_write_rules.py::test_check_write_evaluates_json_object_after_row_rules
    expected: Every selected test passed.
    fix_if: >-
      Fix the adapter, never the assertion. The refusal message must carry no part of the value (a test asserts a
      sentinel substring of the value is absent from str(exc)).
    hermetic: true
    graduation: graduate
    graduation_check_id: ops-json-object-writer
  - step: 2
    phase: pre-deploy
    action: The engine records both keys, the generator projects the leg, the grammar accepts and refuses it.
    command: >-
      bin/venv-python -m pytest -q
      tests/common/test_ducklake_write_rules.py::test_engine_records_json_object_and_per_write_keys
      tests/test_field_semantics_rule_projection.py::test_json_object_projects_its_params
      tests/checks/contracts/test__rule_grammar.py::test_scd2_json_object_leg_accepted
      tests/checks/contracts/test__rule_grammar.py::test_json_object_leg_malformed_params_refused
      tests/checks/contracts/test__rule_grammar.py::test_event_json_object_leg_outside_event_vocabulary
      tests/checks/contracts/test__rule_grammar.py::test_json_object_temporary_exemption_accepted
    expected: Every selected test passed.
    fix_if: The grammar must call json_object_spec, never restate the leg grammar.
    hermetic: true
    graduation: graduate
    graduation_check_id: ops-json-object-projection
  - step: 3
    phase: pre-deploy
    action: Declared equals enforced for the leg, the census reports it without compiling it, and the ratchet guards it.
    command: >-
      bin/venv-python -m pytest -q
      tests/checks/contracts/test_validate_write_time_enforcement_conformance.py::test_json_object_mismatch_fails
      tests/checks/contracts/test_validate_write_time_enforcement_conformance.py::test_the_registered_check_passes_on_the_real_tree
      tests/test_contract_rule_census.py::test_writer_shape_leg_reported_not_compiled
      tests/checks/contracts/test__rule_ratchet.py::test_json_object_added_version_or_larger_cap_is_free
      tests/checks/contracts/test__rule_ratchet.py::test_json_object_changed_version_or_smaller_cap_refused
      tests/checks/contracts/test__rule_ratchet.py::test_json_object_earlier_date_refused
    expected: Every selected test passed.
    fix_if: >-
      The conformance arm compares params exactly; the census never compiles a WRITER_SHAPE_KINDS leg; the ratchet never
      offers a census-token route for json_object.
    hermetic: true
    graduation: graduate
    graduation_check_id: ops-json-object-conformance
  - step: 4
    phase: pre-deploy
    action: The portal pre-check and the per_write merge on both portal update paths.
    command: >-
      bin/venv-python -m pytest -q
      tests/test_ops_data_portal_validators.py::test_gate_write_insert_refuses_malformed_json_object
      tests/test_ops_data_portal_validators.py::test_gate_write_update_leaves_dated_json_object_to_writer
      tests/ops_data_portal/test_update_per_write_column.py::test_update_drops_per_write_column_from_prior_row
      tests/ops_data_portal/test_update_per_write_column.py::test_update_naming_a_per_write_column_sends_it
      tests/ops_data_portal/test_update_per_write_column.py::test_gate_and_closure_checks_still_see_the_whole_prior_row
      tests/ops_data_portal/test_update_per_write_column.py::test_update_decision_drops_per_write_column_from_prior_row
    expected: Every selected test passed.
    fix_if: >-
      The prior row passed to gate_write and the closure checks stays whole; only the merge source drops per_write
      columns.
    hermetic: true
    graduation: graduate
    graduation_check_id: portal-json-object-and-per-write
  - step: 5
    phase: pre-deploy
    action: The contract attribute per_write and its projection.
    command: >-
      bin/venv-python -m pytest -q
      tests/test_contracts_schema.py::test_field_per_write_accepted
      tests/test_contracts_schema.py::test_field_per_write_requires_nullable
      tests/test_schema_to_field_semantics.py::test_per_write_projects_true
      tests/test_schema_to_field_semantics.py::test_absent_or_false_per_write_adds_nothing
      tests/test_schema_to_field_semantics_columns.py::test_projected_per_write_equals_contract_declared
      && bin/venv-python -m scripts.schema_to_field_semantics --check
    expected: Every selected test passed and the generator --check reports no drift (field_semantics.yaml unchanged).
    fix_if: >-
      Never hand-edit the projection. The last node is a lasting rule (every projected per_write column is one its
      contract declares, and the reverse), true before and after C2.
    hermetic: true
    graduation: graduate
    graduation_check_id: contract-per-write-attribute
  - step: 6
    phase: pre-deploy
    action: >-
      Real-engine proof on the pinned duckdb and ducklake (integration mark; needs a network INSTALL of the ducklake
      extension; a skip is a FAIL, rec-4071), on a semantics copy whose context_v2_json declares the leg and per_write.
    command: bin/venv-python -m pytest -q -m integration tests/common/test_ducklake_write_rules_integration.py -p no:randomly -rs
    expected: >-
      Every test passed and none skipped, including the new nodes: a malformed value rejected on every write verb with
      nothing written and the counter unmoved, and a declared value landing. (An update omitting the column stores NULL
      by the writer's existing absent-means-NULL rule; per_write evidence is step 4.)
    fix_if: A malformed value that commits, or a counter that moves on a rejection, is a design defect; stop and RCA (Decision 55).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Never CI-run: scripts.validate deselects integration tests under --disable-socket, so this is a pre-merge local run
      only (rec-4071 owns the residual); steps 1 and 8 carry the CI and deployed evidence.
  - step: 7
    phase: pre-deploy
    action: >-
      Fast presubmit, then the full tier before handoff, started backgrounded with a 2 h limit from the top-level
      session; its verdict is validation_result --verify-head, never a pipe's exit status.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: Both tiers exit 0 and --verify-head confirms a PASS recorded for the current HEAD.
    fix_if: Fix each failure at root cause on the branch and re-run from the start (Decision 55; timeout_disposition blocked).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Graduating it would invoke scripts.validate recursively; PR CI runs the fast tier on every push and main runs the
      full tier after merge.
  - step: 8
    phase: post-deploy
    action: >-
      The governed deploy shipped the merge: deploy-ducklake-lambdas.yml deploys the newest commit a passing full-tier
      run covers and pauses while main is red (Decision 254), so read with mcp__github__actions_list the first run whose
      gate sha is $MERGE_SHA or a first-parent descendant of it, and save its jobs to $DEPLOY_JOBS_JSON. The adapter and
      the shared engine reach every affected active artifact (compute_affected_artifacts: ducklake_writer,
      ducklake_reader, ducklake_catalog_dr, ducklake_maintenance, ducklake_maintenance_smoke, ducklake_telemetry_writer,
      ducklake_telemetry_reader), so every deploy and smoke job counts.
    command: >-
      test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));
      jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
      want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke','deploy-telemetry-twin','telemetry-twin-smoke','deploy-telemetry','telemetry-smoke'];
      assert all(jobs.get(w)=='success' for w in want),jobs;print('DEPLOY_OK')"
    expected: Every named deploy and smoke job concluded success (a skipped job fails this step), then DEPLOY_OK.
    fix_if: A red job is root-caused and fixed forward, never re-run to green (Decision 55).
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      The deployed writer still passes every row-rules case (no regression from the new key and the check_write call):
      save the smoke job's log of step 8's run (mcp__github__get_job_logs) to $SMOKE_LOG.
    command: >-
      grep -E "LAMBDA_ROW_RULES OK [0-9]+ cases" "$SMOKE_LOG" | bin/venv-python -c "import re,sys;t=sys.stdin.read();
      n=int(re.search(r'LAMBDA_ROW_RULES OK (\d+) cases',t).group(1));print(n);assert n>=5,n;print('ROW_RULES_GATE_OK')"
    expected: The gate reports at least 5 cases, then ROW_RULES_GATE_OK.
    fix_if: A FAIL line names the rule the deployed writer answered; fix forward.
    hermetic: false
    graduation: not-applicable
