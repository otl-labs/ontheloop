schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: rec-provenance-shape-check
intent: >-
  Give the ops DuckLake writer a contract-declared, row-local shape-and-size check for a JSON string column (a new
  dq_intent leg, json_object: a byte cap, and per schema_version a closed set of typed keys), enforced by the writer and
  run by the portal as its derived pre-check, and a contract-declared per_write column attribute so update_rec never
  carries such a column forward from the prior row. Plan C1 of the rec write-path data-quality series: it ships the
  writer code ahead of plan C2's provenance_json column add, whose reconcile window freezes serving deploys. Serves
  NS.5 (a data rule is enforced at the write boundary wherever the write can decide it).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-rec-provenance-shape-check.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Operator
  work item from the 2026-11-12 rec read/write audit and the 2026-11-16 consult (plan C of the B-F brief, split C1/C2
  on a blind Fable consult). Decision 79 makes it V3 (active artifacts change), met by steps 8-9.
closes_criteria: []
amends: []
cites: [dec:65, dec:79, dec:210, dec:268]
scope:
  - file: src/row_rules/rules.py
    action: Modify
    purpose: >-
      Literals only (its coverage is measured by tests/row_rules/test_rules.py alone, which is at its SLOC cap, and the
      package must stay a stdlib leaf): _COLUMN_KEYS gains json_object and per_write; _DATEABLE_KINDS gains json_object
      (so its exclude_before is recorded and the existing-row select fetches the column); WAIVABLE_KINDS gains
      json_object (the mark-then-drop removal every dated row leg has, and the conformance check's _SUPPORTED set); a new
      constant WRITER_SHAPE_KINDS = frozenset({"json_object"}) beside WRITER_REFERENCE_KINDS. The engine records, never
      evaluates, either key.
    new_imports: []
  - file: tests/row_rules/test_rules.py
    action: Modify
    purpose: >-
      Exactly one added line, a _WAIVED_RULES entry for json_object (e.g. "json_object": {"max_bytes": 8, "versions":
      {}}), so test_waived_rules_cover_every_exemptable_kind and the WAIVABLE_KINDS-parametrized nodes stay green (498 to
      499 SLOC).
  - file: src/common/ducklake_write_rules.py
    action: Modify
    purpose: >-
      json_object_spec(column, params) validates one projected leg and raises RuleProjectionError on a malformed one;
      json_object_columns(fields) builds every column's spec and refuses a leg that is also exempt; check_write calls
      check_json_objects after check_row, on every path that calls check_write (write_scd2, file_scd2,
      src/common/ducklake_telemetry_registration.py, the portal), with the dated binding below. A refusal raises
      RowRuleViolationError(table, "json_object", column, exclude_before) and
      never carries a value. The leg grammar and the value rules are context items 1-2.
    new_imports: []
  - file: scripts/field_semantics_rule_projection.py
    action: Modify
    purpose: _rule_value returns {max_bytes, versions} for json_object, so the generator projects the leg's params.
    new_imports: []
  - file: scripts/checks/contracts/_rule_grammar.py
    action: Modify
    purpose: >-
      json_object joins SCD2_VOCABULARY (never the event vocabulary) with _SUBKEYS {max_bytes, versions, exclude_before};
      a declared leg's params are validated by calling src.common.ducklake_write_rules.json_object_spec, one
      implementation for the grammar and the writer.
    new_imports: [src.common.ducklake_write_rules]
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      validate_ops_rule_source's pre_globs gain the grammar's new import closure: src/common/ducklake_write_rules.py,
      src/common/ducklake_named_reads.py and src/common/ducklake_write_verbs.py (as the conformance Entry lists them).
  - file: scripts/contract_rule_census.py
    action: Modify
    purpose: >-
      A non-exempt WRITER_SHAPE_KINDS leg is reported as "WRITER-SHAPE <table>.<column> json_object (enforced by the
      writer per write)" and never compiled to a census check (the reader has no JSON check kind; the writer binds it):
      build_plan's live filter excludes it, so declared_non_exempt matches the compiled checks.
    new_imports: []
  - file: scripts/checks/contracts/validate_write_time_enforcement_conformance.py
    action: Modify
    purpose: >-
      A json_object arm: declared {column: params} for live json_object legs equals the projection read back through
      json_object_columns, so a declared leg the writer does not build fails closed (json_object reaches _SUPPORTED
      through WAIVABLE_KINDS).
    new_imports: []
  - file: scripts/checks/contracts/_rule_ratchet.py
    action: Modify
    purpose: >-
      A json_object arm in _params_narrowed: free when max_bytes does not shrink and every base version is present and
      equal in head (versions only added); any other params change, and an earlier exclude_before on a
      WRITER_SHAPE_KINDS leg, is refused outright with no census-token route (the census compiles nothing for it), naming
      the two honest paths: a new schema_version, or a temporary exemption, the drop, then a new dated leg. The same
      date gap on WRITER_REFERENCE_KINDS is rec-5281.
    new_imports: []
  - file: scripts/ops_portal/write_validators.py
    action: Modify
    purpose: >-
      _run_row_rules hands check_write dataclasses.replace(spec, fields=columns), the same projection it builds the
      rules from, so on an update the dated json_object leg is dropped with every other dated leg (Decision 65,
      2026-10-16: updates run undated rules only) and on an insert it is checked; _limit_in_words names json_object as
      "must be a JSON object of a declared schema_version within <max_bytes> bytes"; carry_forward(table, existing)
      returns existing minus the projection's per_write columns, the one merge source for every portal update path.
    new_imports: []
  - file: scripts/ops_data_portal.py
    action: Modify
    purpose: >-
      update_rec merges {**carry_forward("ops_recommendations", existing), **updates}, so an update that omits a
      per_write column sends no value and the writer stores NULL; existing itself stays whole for gate_write and the
      closure checks. At most 3 added lines (491 of 500 SLOC).
    new_imports: []
  - file: scripts/ops_portal/decisions.py
    action: Modify
    purpose: >-
      update_decision merges {**carry_forward("ops_decisions", existing), **updates} the same way, so a per_write
      attribute is honoured by every portal update path (the only two prior-row merges), never by update_rec alone.
    new_imports: []
  - file: scripts/contracts_schema.py
    action: Modify
    purpose: >-
      FieldSpec gains per_write: bool | None = None (a column written fresh on every write, never carried forward by
      an update); a model validator refuses per_write true on a field whose nullable is not true.
    new_imports: []
  - file: scripts/schema_to_field_semantics.py
    action: Modify
    purpose: >-
      The column projection adds per_write: true when the contract field declares it; an absent or false value adds
      nothing, so field_semantics.yaml stays byte-identical in this plan.
    new_imports: []
  - file: tests/common/test_ducklake_write_rules.py
    action: Modify
    purpose: The adapter's json_object spec, evaluator and binding nodes (steps 1-2).
  - file: tests/common/test_ducklake_write_rules_integration.py
    action: Modify
    purpose: Real-engine nodes on a test semantics copy that declares the leg on context_v2_json (step 6).
  - file: tests/test_field_semantics_rule_projection.py
    action: Modify
    purpose: >-
      The projection node (step 2); also C2-ready: per_write joins _BASE_COLUMN_KEYS and _expected_value gains a
      json_object branch, so _rule_invariants holds once C2 declares both keys.
  - file: tests/checks/contracts/test__rule_grammar.py
    action: Modify
    purpose: The grammar nodes (step 2).
  - file: tests/test_contract_rule_census.py
    action: Modify
    purpose: The census node (step 3).
  - file: tests/checks/contracts/test_validate_write_time_enforcement_conformance.py
    action: Modify
    purpose: The conformance node (step 3).
  - file: tests/checks/contracts/test__rule_ratchet.py
    action: Modify
    purpose: The json_object ratchet nodes (step 3); at most 40 added lines.
  - file: tests/test_ops_data_portal_validators.py
    action: Modify
    purpose: >-
      The portal pre-check nodes (step 4); 435 of 500 SLOC before plan B's build rewrites it, so re-measure after the
      rebase and stay under 500.
  - file: tests/ops_data_portal/test_update_per_write_column.py
    action: Create
    purpose: The update_rec and update_decision per_write nodes (step 4).
  - file: tests/test_contracts_schema.py
    action: Modify
    purpose: The FieldSpec nodes (step 5).
  - file: tests/test_schema_to_field_semantics.py
    action: Modify
    purpose: >-
      The two generator per_write nodes (step 5), here because the coverage gate measures
      scripts/schema_to_field_semantics.py by this mapped file alone (100%, no baseline entry). Room (497 of 500 SLOC)
      comes from moving TestProjectRole out verbatim: about 482 SLOC after, so the two nodes fit in 17; measured
      2026-11-17, the file without TestProjectRole still covers the generator 213/213.
  - file: tests/test_schema_to_field_semantics_columns.py
    action: Create
    purpose: >-
      TestProjectRole moved verbatim from tests/test_schema_to_field_semantics.py (no node graduated), and the
      lasting-rule node test_projected_per_write_equals_contract_declared (step 5; needs no coverage mapping).
