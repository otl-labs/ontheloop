    command: bin/venv-python -m pytest -q tests/test_ducklake_named_reads.py::test_recs_by_tag_filters_and_orders_newest_first
    expected: >-
      exit 0; the node passes in the full tier (duckdb present). Red before (the verb is absent on main). Not
      replayed in the fast tier, which carries no duckdb (requirements-fast.txt heavy-exclusion).
    fix_if: Fix the verb SQL, never an assertion.
    hermetic: false
    graduation: graduate
    graduation_check_id: recs-by-tag-filters-and-orders-newest-first
  - step: 2
    phase: pre-deploy
    action: The registry, parity and contract suites.
    command: >-
      bin/venv-python -m pytest -q tests/test_ducklake_named_reads.py tests/common/ducklake_reader_client/test_verb_fields_parity.py
      tests/checks/contracts/test_validate_read_engine_verbs.py tests/test_ducklake_reader_handler.py
    expected: exit 0; every test passes (the count is not pinned).
    fix_if: Fix the code, never the assertion.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-suite re-run of existing graduated shards plus VP 1's new shard; no new node id beyond the scope rows'.
  - step: 3
    phase: pre-deploy
    action: Lint and format.
    command: >-
      bin/venv-python -m ruff check src/common/ducklake_named_reads.py src/common/ducklake_reader_client.py tests/test_ducklake_named_reads.py tests/common/ducklake_reader_client/test_verb_fields_parity.py &&
      bin/venv-python -m ruff format --check src/common/ducklake_named_reads.py src/common/ducklake_reader_client.py tests/test_ducklake_named_reads.py tests/common/ducklake_reader_client/test_verb_fields_parity.py
    expected: exit 0.
    fix_if: Run ruff format and fix lint.
    hermetic: false
    graduation: not-applicable
  - step: 4
    phase: pre-deploy
    action: Full tier to completion, backgrounded from the top-level session with Bash run_in_background and a 2 h limit.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: validation_result --verify-head exits 0 attesting HEAD's tree.
    fix_if: Fix in-scope failures on the branch; out-of-scope failures become recs (Decisions 55, 59).
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: Confirm deploy-ducklake-lambdas.yml deployed the merge commit (or a later main commit) to the reader and its smoke passed.
    command: >-
      mcp__github__actions_list(owner="otl-labs", repo="ontheloop", method="list_workflow_runs", resource_id="deploy-ducklake-lambdas.yml")
    expected: A run for the merge SHA or later concludes success, deploy-serving and smoke green.
    fix_if: A red or held run follows deploy-paths.yaml deploy_code recovery; never break-glass without the operator.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: post-deploy
    action: Live read through the deployed reader.
    command: >-
      bin/venv-python -c "import time; from src.common.ducklake_reader_client import make_reader; r=make_reader(profile='agent_platform');
      d=r.describe(); assert 'recs_by_tag' in d, sorted(d); t=time.time();
      rows=r.named('recs_by_tag', tag='coordinator-log', status='all', since_ts='', priority='', source='', before='', max_rows='5');
      print(round(time.time()-t,1), [(x['id'], x['status'], x['total']) for x in rows])"
    expected: describe lists recs_by_tag; the read returns rec-5700 among rows newest first with total at least 1; the elapsed seconds are recorded in the PR.
    fix_if: Missing verb means the deploy has not shipped this commit (VP 5); a typed error means an SQL fault, fixed forward.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Confirm rec-5700 is closed (squash Resolves trailer).
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5700']); print(sorted((x['id'], x['status']) for x in r), m)"
    expected: Prints rec-5700 with status closed and an empty missing list.
    fix_if: Still open - read the ci.yml closure job log and close it with update_rec.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: src/common/ducklake_named_reads.py
    behavior: recs_by_tag filters by tag, status default open, since at-or-after, priority, source, cursor and cap, newest first with an id tiebreak.
    verification_step: 1
    test_selector: tests/test_ducklake_named_reads.py::test_recs_by_tag_filters_and_orders_newest_first
    red_green_expectation: red before (verb absent on main), green after.
  - source: src/common/ducklake_reader_client.py
    behavior: VERB_FIELDS declares the columns the recs_by_tag SQL really returns.
    verification_step: 2
    test_selector: tests/common/ducklake_reader_client/test_verb_fields_parity.py::test_verb_fields_covers_every_registered_verb
    red_green_expectation: red before (a registered verb without a VERB_FIELDS entry), green after.
  - source: docs/contracts/read-engine.yaml
    behavior: The ops_recommendations verb roster names recs_by_tag, matching the registry (validate_read_engine_verbs).
    verification_step: 2
    test_selector: tests/checks/contracts/test_validate_read_engine_verbs.py::TestRealContractRoster::test_real_contract_matches_registry_and_names_v4_verbs
    red_green_expectation: red if the registry gains recs_by_tag without the roster entry, green after.
execution_steps:
  - Add the recs_by_tag NamedRead to src/common/ducklake_named_reads.py per its scope row.
  - Add its VERB_FIELDS tuple; add the parity test's param values; add the roster entry and amendment_log entry in read-engine.yaml.
  - Add the acceptance node and sibling nodes to tests/test_ducklake_named_reads.py.
  - Execute the Verification Plan; loop until pass; on an unrecoverable V3 failure stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results, the live elapsed time from VP 6.'
rollback: Revert the squash commit; the next governed deploy removes the verb. No data or schema changes.
