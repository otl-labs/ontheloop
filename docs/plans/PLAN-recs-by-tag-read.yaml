slug: "recs-by-tag-read"
intent: >-
  Add the recs_by_tag named read (rec-5700): current recommendations whose tags contain one tag, newest
  last_updated_timestamp first, with status (default open), since, priority and source filters, a keyset cursor
  for older pages and a capped row count, bind values only. Project coordinators can then read the latest recs
  labelled to their project through the threads they start, instead of paging the unfilterable issue log.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-recs-by-tag-read.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5700 (Medium, S), taken by Agents in GitHub at the operator's request (cross-project coordination). Closes no
  roadmap criterion.
closes_criteria: []
cites: [dec:79, dec:84, dec:215, dec:249]
amends: []
introduces: []
scope:
  - file: src/common/ducklake_named_reads.py
    action: Modify
    purpose: >-
      rec-5700. One new NamedRead, verb recs_by_tag, table ops_recommendations, agent_facing True, paginable False,
      params in bind order (tag, status, since_ts, priority, source, before, max_rows), all strings. SQL binds the
      first six once each in a leading args CTE and max_rows only in the final
      LIMIT least(CAST(? AS INTEGER), 100) (recs_related precedent). Semantics: list_contains(tags, tag) (a NULL tags
      row never matches); status is one value or a comma list, empty means open, the single value all means every
      status, and any other element outside open, in_progress, closed, failed, declined, superseded raises; since_ts
      empty means no bound, else last_updated_timestamp at or after CAST(since_ts AS TIMESTAMPTZ) through a CASE so an
      empty value is never cast; priority empty means any, else lower(priority) = lower(bind); source empty means
      any, else source = bind; before empty means the first page, else "ts|id" and only rows strictly older than
      (ts, id) in the sort order. Guards raise through error() (recs_related pattern) on an empty tag, an unknown
      status element, a since_ts or before timestamp without an explicit Z or numeric offset, or a before value
      without exactly one "|". Columns: id, title, status, priority, effort, source, file, tags, created_timestamp,
      last_updated_timestamp, total (count(*) OVER () before the cap, so a caller sees truncation). ORDER BY
      last_updated_timestamp DESC, id DESC. The description states the defaults, the cap and the cursor shape, since
      it is all an MCP caller sees. NAMED_READS_VERSION stays 6 (additive verb, docs/contracts/ducklake_reader.yaml
      history); no existing verb's read_version moves. About +45 SLOC.
    new_imports: []
  - file: src/common/ducklake_reader_client.py
    action: Modify
    purpose: >-
      VERB_FIELDS gains the recs_by_tag column tuple (the 11 columns above, in order); the version pin stays 6.
      NEAR_CAP (476 of 500 SLOC on main 2026-11-26; three unbuilt plans also scope it): a literal 11-string tuple formats
      to about 13 lines (489 of 500), and the build re-measures with validate_sloc_limits against main at build time; if the file
      would pass 500 the build parks with a plan-defect report (decomposition is its own plan), never a raise.
    new_imports: []
  - file: tests/test_ducklake_named_reads.py
    action: Modify
    purpose: >-
      rec-5700's acceptance node test_recs_by_tag_filters_and_orders_newest_first executes the verb's SQL in DuckDB
      (tests.fixtures.duckdb_connect, the parity test's table-from-spec pattern, {tbl} pointed at a local table) over
      fixture rows covering: tag hit and miss and NULL tags; open default, a comma list, all; since at-or-after
      boundary; priority case-insensitive; source; the before cursor returning the next page with no overlap and no
      gap when timestamps tie; the max_rows cap with total above it; and the cap of 100. Sibling nodes: guard errors
      (empty tag, unknown status, offset-less since_ts, malformed before) raise; registry shape (params order, one ?
      per param, paginable False, agent_facing True, ORDER BY ending id DESC immediately before the LIMIT, which the
      generic total-order test does not reach for a bind LIMIT); NAMED_READS_VERSION still 6 and the existing
      pinned digests unchanged. The module docstring drops "DB-free" and names the two duckdb nodes. About +110 SLOC.
    new_imports: [tests.fixtures.duckdb_connect]
  - file: tests/common/ducklake_reader_client/test_verb_fields_parity.py
    action: Modify
    purpose: >-
      _PARAM_VALUES gains values the new guards accept for the params only recs_by_tag uses (status, before), so the
      parametrised column-parity node runs the verb's real SQL. +1 SLOC.
  - file: docs/contracts/read-engine.yaml
    action: Modify
    purpose: >-
      The ops_recommendations verb roster gains recs_by_tag (validate_read_engine_verbs), and an amendment_log entry
      (field_add, semantic_break false, additive: no existing caller's answer changes).
constraints:
  - Bind values only; no caller SQL crosses the reader boundary (Decision 84 I-3). The runtime (src/common/ducklake_reads.py) and the client's named() signature are unchanged.
  - Additive only. No existing verb, its SQL, params or read_version changes; NAMED_READS_VERSION stays 6.
  - The reader ships through the governed channel deploy-ducklake-lambdas.yml after the merge's full tier passes on main (build-lambda.yaml deploy_channels); build_lambda --deploy is break-glass only and is not used.
  - No rescue agents or workaround loops (Decision 55).
