  - "Deviation from rec-5700's text: the rec says paginable and that the version pin moves. The runtime limit cannot be sent by the client's named() or the MCP projection (ducklake_reader_client.py:551-559), so the bound is the max_rows bind plus a before cursor and paginable stays False; additive verbs keep NAMED_READS_VERSION at 6 (ducklake_reader.yaml:268,277)."
  - "Operator sign-off 2026-11-26 23:53 UTC: write the plan, with the before cursor included (fork offered at sign-off; deferring it was the alternative)."
  - "Cursor caveat: the sort key is mutable, so a rec updated between page reads moves to the top and is not seen again in that walk; a fresh first page shows it."
  - "Live probe 2026-11-26 (agent_platform reader): warm full-scan verbs count_by_status 1.3 s, open_recs_tally 1.2 s over 4,404 rows. tags cannot prune files, so a cold first touch may be slow (rec-5181 measured 84 s for list_contains over id). UNPROVEN until VP post-deploy step."
  - "Out of scope (rec-5700): a fixed list of project tags the portal checks. Related, not bundled: rec-5181 (recs_by_ids pruning), rec-4240 (deprecated verb removal)."
  - "Graduated shards kept unchanged (their node ids stay valid): named-reads-v4-recs-verbs, recs-read-model-parity, recs-related-verb-registered, telemetry-event-reads-registry, verb-fields-match-registry-sql, verb-fields-version-pin-matches. VP 1 adds shard recs-by-tag-filters-and-orders-newest-first."
  - "Other active artifacts packaging these files (data-pipeline via deploy-prod-lambdas.yml; the telemetry readers, writer, maintenance and catalog-dr; the operator-gated telemetry content reader under Decision 272) receive inert registry data through their own channels; only the reader carries a smoke obligation here."
  - "Amendment 1 (2026-11-27, build plan-defect report): VP 1 is hermetic false under docs/contracts/vp-red-before.yaml hermetic_authoring rule (iii), since its node needs duckdb, which the fast tier excludes; graduation stays graduate, as for the duckdb shard verb-fields-match-registry-sql. The two new duckdb nodes skip in the fast tier only (importorskip inside each node, env: reason), recorded as owned-skip weakening_dispositions; no module-level skip, and no assertion or scope change."
  - "Related-work check: red_overlap verdict clear (no reds), 2026-11-26."
  - "Unbuilt plans also scoping these files (whichever builds second rebases): PLAN-agent-proxy-signed-access, PLAN-telemetry-claude-p-capture-adapter (ducklake_reader_client.py); PLAN-telemetry-planning-cost-reads (read-engine.yaml, ducklake_reader_client.py)."
  - "Decision-scout round 1: NO_FLAGS (Decisions triaged: 238 of 238; Roadmap items intersected: 3; CONFLICT: 0; RELATED: 2). CITE: 84, 215, 79, 249. Related: 88 (catalog egress: cap 100 on the warm reader), 125, 254, 283, 255, 213, 140, 214. Roadmap: T2.19 c8/c14 related; both stay open (one verb verifies neither). Serves: NS.5 4/5."
