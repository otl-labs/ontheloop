infrastructure_dependencies: []
acceptance_criteria:
  - >-
    An unfiltered read of ops_recommendations through the deployed reader returns HTTP 413
    response_too_large (bytes and cap in the body) within one attempt, never a 502 and never a
    client retry.
  - >-
    Session preflight on the deployed reader reports recs_read_status ok, makes exactly two
    read-model calls for ops_recommendations (recs_read.calls; write-path fetch-before-update reads by
    an open escalation are outside the read model), serves open counts from open_recs_tally
    (within 2 of count_by_status's open count, allowing a concurrent write), and the
    preflight_signal_rows re-serialised row bytes stay under 1,500,000 (791,827 measured at planning).
  - >-
    With the reader unreachable, preflight reports recs_read_status reader_unreachable, JSON null
    (never [] or 0) for every recs-derived list and count, no false liveness alert, one UNAVAILABLE
    section and an UNAVAILABLE stdout summary, and makes no context_docs fallback reader call; the planning skill treats that as a hard block at
    commitment unless the human overrides, and the overseer halts dispatch on a null list.
  - >-
    No full-table ops_recommendations pull remains: sync and warm_sync skip the table and delete a
    stale copy, the portal's sync refuses it, file_rec and update_rec never write
    logs/.recommendations-log.jsonl, and the trailer close, cost reconciliation, back-validate,
    assert-clear probes and relevance gates read named verbs (or fail loudly) instead of the file.
  - >-
    The v4 registry is live with recs_by_ids, recs_for_files, open_recs_tally and
    preflight_signal_rows; rec_by_id is still served (deprecated, removal rec-4240); open_recs and
    preflight_signal_rows are not projected as MCP agent tools.
  - >-
    The new numbered Decision is merged with amends [88, 103], the rejected alternatives (prioritised
    truncation, keyset pagination of the full table), a Decision 181 coverage line naming rec-4235,
    rec-4236, rec-4237 and rec-4240 as residual owners, a reversal-conditions block, and dated
    annotations on Decisions 88 and 103.
  - All five DuckLake functions' deploy records carry the merge sha after the governed deploy run.
  - rec-4232, rec-2863 and rec-2639 close on merge through their acceptance commands.
