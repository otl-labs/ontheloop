    Decision 181). Run VP steps 13 and 15-18.
  - >-
    6. Closure sequence (implement skill, git-ops handoff_sequence), each outcome reported on its own: run the code-review
    gate; run scripts.session.github_readiness and report each state separately (unknown is unproven, never PASS); run
    scripts.test_coverage_checker --check-tests --check-coverage as a diagnostic; set implementation_declared true in this
    plan; run scripts.validate --pre; write the retrospective evidence and run scripts.session.postflight --evidence.
    Then VP 19: the full tier on the committed, rebased, clean tree to completion (final Validation Summary scope all
    PASS), then scripts.checks.validation_result --verify-head exit 0; any review-fix commit reruns both; a timeout is
    BLOCKED, never skipped.
  - >-
