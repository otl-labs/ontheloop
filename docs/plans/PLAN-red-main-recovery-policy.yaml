    against the old 291; the root ambient load set had 10 bytes of headroom at planning, config/prose_budgets.yaml
    S1). It keeps the literals "forward-fix, never auto-revert", "source=ci_rca" and "priority=critical" that
    tests/test_pr_ci_red_protocol_contract.py and the agents-md-contradiction-resolved registry shard pin. No other
    AGENTS.md line changes.
