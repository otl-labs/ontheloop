  APPROVED_RED_OVERLAP (scripts/ci_rca/red_overlap.py):
  Inputs. (a) One reader call, named("preflight_signal_rows", followon_ids=""), the complete read model preflight
  already uses (scripts/preflight/recs_signals_source.py); the reds are every row with source ci_rca and status open
  or in_progress, uncapped, each carrying file, created_timestamp and context_v2_json (a JSON string, decoded with
  scripts.ops_portal.closure_gate.parse_context_json; an unparseable or empty blob reads as {}, so the red is not
  Track A and contributes only its file to red_files). Never the ci_rca_open verb (it
  is LIMIT 5, the truncated read Decision 215 rejects). A reader exception -> {"verdict": "unavailable", "reason":
  ...}, exit 2. (b) The preflight report, logs/.preflight-report.json (--report overrides the path): when it parses
  and its recs_read_status is "ok", the ids in its ci_rca_likely_resolved_recs are dropped from the reds (the same
  likely-resolved split today's HARD BLOCK honours); otherwise nothing is dropped (fail closed). (c)
  recovery_policy.slo_hours from docs/contracts/red-main-recovery.yaml via yaml.safe_load at call time; missing or not
  a positive int -> exit 2.
  (d) Work paths: --plan PATH reads scope[].file with action Create -> "A", Modify -> "M", Delete -> "D", and the
  plan's bundled_recommendations; --files PATH... uses "M" for each and bundles nothing; with neither, the work set
  is empty and rules (4) and (5) are skipped (nothing can overlap empty work; /plan Step 8 re-runs with the plan's
  scope), so only rules 1 (slo_breached) and 3 (undeterminable) can block -- the overseer's /plan-dispatch form.
  evaluate(reds, work_entries, bundled_ids, now, slo_hours, selector=derive_affected_tests) is pure and returns the
  verdict dict (bundled_ids: the plan's bundled_recommendations, empty for --files).
  Per red, the first matching rule wins: (0) the red's id is in the plan's bundled_recommendations -> clear
  "repairs_this_red" (the plan is that red's repair, so overlap is expected); (1) created_timestamp unparseable, or age in hours
  >= slo_hours -> blocked "slo_breached", whatever the track or overlap, unless the plan bundles an open ci_rca red
  (repair work is never unrelated work, so two reds past their SLO cannot block each other's repair plans); such a
  plan goes on to rules (2)-(6) for this red. (2) is_track_a(context_v2_json)
  (scripts/ops_portal/ci_rca_schema.py) -> clear "track_a_in_slo". (3) red_files = {file} | {nodeid.split("::")[0] for each affected_nodeid}, empties dropped; empty
  -> blocked "undeterminable". (4) Run the selector over the work entries and over [("M", f) for f in red_files];
  either manifest with fallback or full_suite_forced true -> blocked "selector_fail_closed". (5) affected = the
  entries' paths | selected | deferred, per side; a non-empty intersection -> blocked "overlap" with the shared paths
  (sorted, at most 20). (6) Otherwise clear "disjoint". The overall verdict is "blocked" when any red is blocked, else
  "clear" (no reds -> clear).
  Output: one JSON object on stdout, {"verdict", "slo_hours", "reds": [{"id", "rule", "track", "age_hours",
  "shared"}]}; exit 0 clear, 1 blocked, 2 unavailable. stdout carries that one line only: the selector's own banners
  (derive_affected_tests prints its cap and fallback notices) run under contextlib.redirect_stdout(sys.stderr). The
  reader client is constructed lazily and injectable for tests (src.common.ducklake_reader_client.make_reader); no
  other network.
- |-
  APPROVED_RECOVERY_CONTRACT (the whole new file docs/contracts/red-main-recovery.yaml; DATE = the build's commit date):
  # Red-main recovery (Decision 226). The values code reads, the fast-lane procedure and the coverage
  # map live here (the three CiRcaContext fields' semantics are ci-rca-lifecycle.yaml projection_fields);
  # the rationale lives in the Decision (Decision 86). Read by scripts/ci_rca/red_overlap.py, pinned
  # by tests/ci_rca/test_recovery_policy_surfaces.py.
  contract:
    id: red-main-recovery
    class: D
    contract_version: 1
    status: ratified
    ratified_via: "Decision 226 / PLAN-red-main-recovery-policy"
    description: >-
      Class D mechanism contract: Decision 226's red-main recovery values (repair SLO, track
      predicate, halt rules, preventive window), the fast-lane procedure and its coverage map.
    subject: red-main-recovery
    evaluator:
      agent_surface: .claude/skills/planning/SKILL.md

  amendment_log:
    - {date: "DATE", semantic_break: false, change_class: field_add, summary: "Initial authoring (Decision 226 / PLAN-red-main-recovery-policy)."}

  recovery_policy:
    decision: 226
    slo_hours: 4
    test_path_prefix: "tests/"
    bookkeeping_prefixes: ["docs/plans/", "config/agent/verification_registry/entries/"]
    tracks:
      test_defect: >-
        Track A. The corrective changes only paths under test_path_prefix and leaves merged product
        behaviour as it is (a stale expected value, a missing test under a coverage floor). The
        diagnosis counts only through is_track_a (scripts/ops_portal/ci_rca_schema.py): repair_track
        test_defect, regression_of unset, and workflow_tier "CI" from the verified bundle (the CI and
        Main Canary workflows). Then priority is High and the red blocks nothing inside its SLO. No
        preventive_action is owed (preventive_deficiency); repaired through procedure.fast_lane_repair. A
        test_defect diagnosis that fails is_track_a is Track B.
      product_regression: >-
        Track B. Every other red: an absent, unsure or product_regression repair_track, and a test_defect
        diagnosis that fails is_track_a. Priority Critical. Repaired through /plan, or through a manual revert PR of the culprit merge when the
        fix is not obvious and the culprit touched neither terraform/** nor a governed deploy path
        (docs/contracts/deploy-paths.yaml); the revert PR also lands the Decision 186 closure artifact
        (for example a test pinning the culprit's failure), since the revert alone changes no artifact
        file. preventive_action stays mandatory until the class tally (rec-4441) lands.
    priority: >-
      scripts.ops_portal.ci_rca_schema.derive_ci_rca_priority (High iff is_track_a, else Critical),
      applied in file_rec after the bundle cross-check to every source=ci_rca write carrying
      context_v2_json, and in correct_rec_context; a passed priority never survives it. Declared in
      ops_recommendations.yaml's priority derivation (Decision 210 cl.3).
    confirmed_track: >-
      scripts.ops_portal.closure_gate.confirmed_repair_track over the fix commit's diff-tree, ignoring
      bookkeeping_prefixes (a plan flip and graduated registry shards ride every /implement squash):
      test_defect when every remaining path is under test_path_prefix, product_regression when any is
      not, unset when nothing remains or the sha is unresolvable. Stamped as repair_track_confirmed
      wherever fixed_by_sha is stamped. Only the confirmed value may feed a tally.
    preventive:
      window_days: 90
      threshold: 2
      class_key: >-
        The failing check plus its escape attribution (escape_mode, escape_class) from the verified
        bundle, defined against the fingerprint chain and the flaky quarantine (Decision 142).
        Unrealized until rec-4441; these are the Decision 226 cl.5 parameters it will read.
    halt:
      evaluator: scripts/ci_rca/red_overlap.py
      inputs: >-
        The reds are every open or in_progress source=ci_rca row of one complete preflight_signal_rows
        read, minus the ids a parseable, ok preflight report lists as likely_resolved.
      rules:
        - "0 repairs_this_red: the plan's bundled_recommendations names this red -> clear."
        - "1 slo_breached: filed slo_hours or more ago, or an unparseable filing time -> blocked, unless the plan bundles an open ci_rca red (repair work is never unrelated work); such a plan goes on to rule 2."
        - "2 track_a_in_slo: is_track_a(context_v2_json) -> clear."
        - "3 undeterminable: the red's file plus its affected_nodeids' files are empty -> blocked."
        - "4 selector_fail_closed: either side's selector manifest has fallback or full_suite_forced -> blocked (rules 4 and 5 are skipped when the work set is empty)."
        - "5 overlap: the work's and the red's affected sets (paths, selected and deferred; Decision 135 channels) intersect -> blocked, naming the shared paths."
        - "6 disjoint: otherwise clear."
      exit_codes: "0 clear, 1 blocked, 2 unavailable (callers treat 2 as an UNAVAILABLE block the human may override)"
      callers: "/plan Step 8 Related-Work Check (always run); the overseer before every dispatch (--plan for /implement, no arguments for /plan)"
      merge_pause: "Decision 73 cl.3's L6 pause is unbuilt; when built it applies this same rule."
    slo_clock: >-
      From the rec's created_timestamp. A build that reaches handoff during a red still needs a green
      full tier (Decision 163), so it waits for the repair; the SLO bounds that wait.
    coverage:
      cl1_track_and_priority:
        - tests/ops_data_portal/test_ci_rca_repair_track.py::TestRepairTrack
        - tests/ops_data_portal/test_ci_rca_repair_track.py::TestWorkflowTierStamp
        - tests/ops_data_portal/test_ci_rca_repair_track.py::TestCiRcaPortalDerivations
        - tests/ops_data_portal/test_closure_gate.py::TestConfirmedRepairTrack
        - tests/test_ci_rca_lifecycle_correct_rec_context.py::TestCorrectRecContext
      cl3_cl4_verdicts:
        - tests/test_ci_rca_red_overlap.py::TestEvaluate
        - tests/test_ci_rca_red_overlap.py::TestInputs
        - tests/test_ci_rca_red_overlap.py::TestCli
        - tests/test_ci_rca_red_overlap.py::TestPolicySource
      residuals:
        cl2_fast_lane_eligibility_and_dispositions: rec-4442
        cl3_callers_and_cl4_revert_eligibility: rec-4444
        cl5_class_tally: rec-4441

  context_fields: >-
    The semantics of repair_track, repair_track_confirmed and workflow_tier are ci-rca-lifecycle.yaml
    projection_fields entries (validate_ci_rca_lifecycle_projection enforces their enum parity); file_rec and
    correct_rec_context drop a caller's repair_track_confirmed, workflow_tier and regression_of.

  procedure:
    fast_lane_repair: >-
      Decision 226 cl.2, for a red filed High (is_track_a), by whichever session picks it up, with no
      plan: (1) confirm from the evidence that merged product behaviour is right, and derive the
      expectation from its source of truth, never a pinned copy; (2) change only tests/** on the
      harness branch; (3) run the failing node ids, bin/venv-python -m scripts.validate --pre, and the
      full tier with the handoff evidence step git-ops.yaml handoff_sequence names, on the rebased head (if it fails
      only on another open red's tests, that red is not this lane's to fix: follow the implement
      skill's go/no-go and wait for that red's repair or the human's word); (4) run the
      code-review skill on the diff and record its weakening-candidate dispositions in the PR body
      (instruction-enforced: validate_weakening_dispositions reads plans only, rec-4442); (5) before
      merging, stamp closure_artifact pytest:<repaired node id> on the rec with correct_rec_context
      (a status-preserving write) and put "Resolves: rec-NNNN" in the squash commit body
      (git-ops.yaml resolves_trailer), so ci.yml's trailer-closure job closes it with the Decision 201
      acceptance verdict and closure_fix_sha at the merge; if that job refuses, follow resolves_trailer's
      conditional fallback. If the repair needs a non-test file, stop: the red is Track B --
      call correct_rec_context with context_updates {"repair_track": "product_regression",
      "preventive_action": "<100-800 chars>"} (it re-derives priority, so the row becomes Critical)
      and plan it.
