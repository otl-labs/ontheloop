acceptance_criteria:
- >-
  DECISIONS.md carries Decision 226 exactly as APPROVED_DECISION (number re-checked), under the 6144-byte per-entry
  cap, and Decisions 72, 73 and 217 each end with their APPROVED_ANNOTATIONS line; decisions-index.json is fresh.
  TestDecisionEntry pins the header, the five clause labels and the annotations; the verbatim text is checked at code
  review against APPROVED_DECISION.
- >-
  A source=ci_rca file_rec carrying context_v2_json is written with priority High exactly when repair_track is
  test_defect, regression_of is unset and the verified bundle stamped workflow_tier CI, else Critical, whatever
  priority was passed.
- >-
  CiRcaContext accepts repair_track and repair_track_confirmed (two values each); file_rec and correct_rec_context
  require preventive_action unless the red is Track A (is_track_a).
- >-
  Stamping fixed_by_sha (update_rec closure_fix_sha or stamp_fixed_by_sha) also stamps repair_track_confirmed from the
  fix commit's diff, ignoring plan and registry bookkeeping: test_defect for a tests-only commit, product_regression
  otherwise, unset when unresolvable or when only bookkeeping changed.
- >-
  scripts.ci_rca.red_overlap exits 1 for a red past the SLO, an undeterminable red file set, a selector fallback or an
  overlapping affected set; exits 0 for disjoint work, an in-SLO Track A red and a red the plan bundles; exits 2 when a
  read is unavailable; prints one JSON line; reads slo_hours from the contract and the open reds uncapped; a plan
  bundling a red is not globally blocked by another red past its SLO.
- >-
  Every prose surface that stated the old halt (AGENTS.md, the planning, overseer and orient skills, orient.md,
  overseer.md, overseer-dispatch never_overrides, the preflight print, ci-rca-lifecycle trigger_scope, the
  source_registry.yaml ci_rca entry) states the
  Decision 226 rule within its prose budget, and AGENTS.md keeps the three literals the pr-ci-red contract pins.
- >-
  ops_recommendations.yaml declares the ci_rca priority rule in its priority derivation with realized false, and the
  generated field_semantics.yaml is byte-identical (no Lambda artifact changes).
- >-
  The three follow-on recs (rec-4441, rec-4442, rec-4444) are open and their titles and contexts name Decision 226 and
  red-main-recovery.yaml, never Decision 225 (taken by another entry) or the old ci-rca-lifecycle.yaml homes.
