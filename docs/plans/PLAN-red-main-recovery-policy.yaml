constraints:
- >-
  Decision 55: the ci-rca agent still never fixes anything; priority, the confirmed track, and the overlap and SLO
  verdicts are computed in code. repair_track is the agent's diagnosis; it counts (is_track_a) only on a CI-tier
  workflow per the verified bundle, gates only priority and the Track A halt exemption, and only
  repair_track_confirmed may feed a tally.
- >-
  Fail closed everywhere (Decision 215): an unreadable report or reader, an undeterminable red file set, a selector
  fallback, or a full_suite_forced manifest blocks. Callers treat exit 2 as blocked.
- >-
  Decision 163 and Decision 186 are unchanged: no handoff relaxation for a known red, no new waiver category, no
  closure-gate change beyond stamping repair_track_confirmed. Decision 163's structural check (validate_handoff_full_tier)
  reads plans, so it does not reach a planless fast-lane PR: that run is an instruction-enforced residual owned by
  rec-4442.
- >-
  No new ops_recommendations column, no new source value, no Lambda-packaged file (Decision 84/103/63; the new fields
  are context_v2_json projections). The ops_recommendations.yaml note sits under the unrealized priority derivation,
  so the generated field_semantics.yaml stays byte-identical and nothing deploys.
- >-
  Prose budgets and SLOC limits hold without a raise (Decision 128): the overseer skill (2 bytes headroom), the orient
  skill (12), the root ambient load set (10), the planning skill (484); ops_data_portal.py and ci_rca_signals.py
  stay under 500 SLOC.
- The Decision text is APPROVED_DECISION verbatim apart from the number and dates; any wording change needs Benjamin's word.
- No rescue agents or workaround loops (Decision 55).
