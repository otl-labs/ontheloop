    next free Decision number (226 at planning; re-check the highest live header at implement time and renumber every
    "226" in this plan's texts on a race). Append the three APPROVED_ANNOTATIONS as the last line of Decision 72's,
    Decision 73's and Decision 217's bodies (after each entry's existing final annotation or block, before its "---").
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated with bin/venv-python -m scripts.decisions_index --write after the DECISIONS.md edit; never hand-edited.
