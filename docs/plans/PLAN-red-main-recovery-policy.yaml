    with no regression (none owed, Decision 226); required otherwise."
- file: scripts/ops_portal/ci_rca_schema.py
  action: Modify
  purpose: >-
    CiRcaContext gains repair_track and repair_track_confirmed, both Optional[str]=None with
    pattern ^(test_defect|product_regression)$ (repair_track agent-authored; repair_track_confirmed stamped at fix
    time, never agent-authored, mirroring the fixed_by_sha comment block), and workflow_tier, Optional[str]=None with
    no pattern (portal-derived from the verified bundle's workflow_to_tier_resolution, never agent-authored).
    preventive_action becomes Optional[str]=None keeping min_length=100/max_length=800, with no model validator (the
    model cannot see workflow_tier, which the cross-check stamps after validation). Three new pure functions:
    preventive_deficiency(context) -> list[str], ["preventive_action is required unless the red is Track A
    (is_track_a)"] when preventive_action is absent and not is_track_a(context), else []; is_track_a(context) -> bool, true only when repair_track == "test_defect",
    regression_of is unset and workflow_tier == "CI" (the taxonomy tier of the CI and Main Canary workflows); and
    derive_ci_rca_priority(context) -> str, "High" when is_track_a(context) else "Critical". No schema_version
    ceiling raise. A test_defect diagnosis that fails is_track_a is Track B: Critical, and it owes preventive_action.
- file: scripts/ops_data_portal.py
  action: Modify
  purpose: >-
    file_rec: for every source=ci_rca write carrying context_v2_json, first pop the portal-owned keys workflow_tier,
    repair_track_confirmed and regression_of from the caller's context (a caller can never supply them; the existing
    _run_ci_rca_cross_check then stamps workflow_tier from the verified bundle, and the closed-head branch's
    file_regression_record stamps regression_of). Then, AFTER the closed-head regression branch and immediately before
    _derive_computed_fields (so regression_of is visible), set fields["priority"] =
    derive_ci_rca_priority(context_v2_json) and apply preventive_deficiency(context_v2_json): when the deficiency
    exists only because the portal could not accept the agent's test_defect diagnosis for a reason the agent could not
    see (this call's file_regression_record set regression_of, or no verified bundle stamped workflow_tier), log and
    stamp the reason preventive_required through _stamp_warn_mode_reject in both modes, never raising, so a
    red is never left unfiled, and in strict mode set that marker's mode_at_write to "strict" (the real mode);
    otherwise use the existing CI_RCA_STRICT_MODE handling (strict raises; warn logs and stamps preventive_required).
    The reason carries no "schema" prefix, so back_validate_ci_rca's marker read counts the rec non-conformant
    (scripts/ops_portal/ci_rca_runtime.py drops schema* tags because it recomputes schema deficiencies, and the model
    no longer reports this one). Legacy no-context ci_rca writes are unchanged. All of this logic lives in one helper in the ops_portal submodule,
    scripts.ops_portal.ci_rca_schema.apply_track_rules(fields, context_v2_json, *, portal_regression, mode), which
    the facade calls once (Decision 124); the facade gains only the key-pop line and that call. The
    function lives in the ops_portal submodule; the facade gains only the call (Decision 124). update_rec: when closure_fix_sha is supplied, closure_stamps.update(confirmed_track_stamp(merged.get("source"),
    closure_fix_sha, ROOT)) before the existing stamp merge, so repair_track_confirmed rides the same context blob. Net growth stays inside the 500-SLOC limit (466 SLOC at planning).
