schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: red-main-recovery-policy
intent: >-
  Re-price red-main recovery under Decision 73's optimistic merge, so a red costs what its repair needs and no more: one
  Decision (226) amending Decisions 72, 73 and 217 splits reds into a tests-only fast lane and product regressions,
  narrows the halt to work that overlaps the red, bounds recovery with an agent-owned repair SLO (revert permitted for
  product regressions), and owes a preventive only for a recurring failure class; the build lands the code that
  computes the track, the priority, the confirmed track, and the overlap and SLO verdicts, plus every prose surface
  that states the old halt.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-red-main-recovery-policy.yaml
phase: >-
  ci_rca (soft-warn category): the red-main recovery policy Benjamin approved on 2026-10-18 in the rec-4427 thread
  (step 2 of that thread's proposal). Related tier item T1.13 (CI-RCA methodology contract); closes no exit criterion
  (its open criteria c2, c3, c5 and c9 are strict-mode, observability, S3 roundtrip and category integrity).
scope:
