schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: redecide-public-identity
intent: >-
  Record the operator's clause-by-clause re-decision of Decision 286 (rec-5668, step 2 of Decision 101's supersession)
  in one new direction entry that supersedes 286 and amends Decisions 127, 171 and 209: one confidentiality boundary binds
  every public surface, its classes and the complete freeze list held in a new contract; this repository and its site
  publish no financial figures, a product repository only under its own decision; the audience reads through the
  glossary and Decision 232; the marketing/ exception leaves this repository; Decision 286 compacts to a stub.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-redecide-public-identity.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5668 (Medium), the operator-driven step 2 of Decision 101's full supersession (rec-4389, closed by #2494).
  Closes no roadmap criterion.
cites: [dec:75, dec:84, dec:86, dec:100, dec:101, dec:127, dec:149, dec:157, dec:168, dec:171, dec:181, dec:198, dec:200, dec:202, dec:209, dec:220, dec:221, dec:223, dec:232, dec:235, dec:237, dec:240, dec:244, dec:246, dec:247, dec:248, dec:257, dec:270, dec:276, dec:278, dec:279, dec:282, dec:286]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Sidecar blocks DECISIONS-1 (the new direction entry: supersedes 286, amends 127, 171 and 209, delegates two contract
      keys under operator_approval), DECISIONS-286 (compacted stub with a clause map), DECISIONS-209-note (a dated
      "Amended by" note on 209 cl.3(1) and 3(2)), DECISIONS-127-note (point 1's marketing/ class retired) and
      DECISIONS-171-note (cl.1's project_id = trading-system row leaves the freeze).
  - file: AGENTS.md
    action: Modify
    purpose: Sidecar block AGENTS-boundary - the boundary lead-in and NEVER bullet point at the contract list (operator wording, approval-gated).
  - file: docs/contracts/public-identity.yaml
    action: Create
    purpose: Sidecar block public-identity-contract - new Class D contract holding confidential.classes and frozen_identifiers.families (evaluator agent_surface AGENTS.md).
  - file: docs/contracts/contract-population.yaml
    action: Modify
    purpose: Sidecar blocks contract-population-row (the new contract's evaluator_coverage trigger row) and contract-population-log (a new amendment_log entry, field_add).
  - file: docs/contracts/approval-routing.yaml
    action: Modify
    purpose: Sidecar blocks approval-routing-gated (gated.files gains docs/contracts/public-identity.yaml, so the delegated lists change only by an approved sidecar) and approval-routing-log (a new amendment_log entry).
  - file: docs/PROJECT_CONTEXT.md
    action: Modify
    purpose: Sidecar block project-context-boundary - line 9's pointer moves from Decision 101 to the new entry and the contract.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Sidecar blocks file-router-marketing (prose_allowlist drops the marketing/**/*.md glob and its Decision 101(c)
      comment) and file-router-log (a new amendment_log entry, accepted_values_narrow, with the two oldest
      compactable rows made terse by scripts.checks.contracts.amendment_compact, Decision 282 cl.1).
  - file: .github/pull_request_template.md
    action: Modify
    purpose: The PUBLIC-REPO BOUNDARY comment cites the new entry's cl.2 and the contract list instead of Decision 101.
  - file: scripts/checks/decisions/consolidation.py
    action: Modify
    purpose: >-
      Conformance fix to decision-compaction.yaml consolidation.manifest.resolve ("a manifest whose consolidating entry
      is itself superseded at head is history"): once 286 compacts it has no envelope, so the 101 manifest's lookup
      finds no consolidating entry and fails; a new _dormant helper returns no problem when every victim's stub points
      at one entry that is itself a superseded compacted stub.
    new_imports: []
  - file: tests/checks/decisions/test_consolidation.py
    action: Modify
    purpose: Adds test_a_manifest_whose_consolidating_entry_compacted_is_history (dormant when the consolidator compacted and its row is superseded; still fails when the row is live).
  - file: tests/checks/decisions/test_public_identity_decision.py
    action: Create
    purpose: Guards the entry (supersedes, amends, delegates resolving, clause phrases), 286 and 101 resolving to it, the 127, 171 and 209 notes, the freeze list and the AGENTS.md pointer.
  - file: tests/checks/hygiene/test_validate_prose_allowlist.py
    action: Modify
    purpose: Adds test_marketing_prose_is_not_sanctioned.
  - file: config/agent/verification_registry/entries/decision-101-performance-figures-reading-resolved.yaml
    action: Delete
    purpose: The record pins a reading on Decision 101 and passes vacuously since 101 compacted; disposition refactor to test_public_identity_decision.py::test_entry_supersedes_286_and_delegates_both_lists.
  - file: config/agent/verification_registry/entries/deprecated/decision-101-performance-figures-reading-resolved.yaml
    action: Create
    purpose: The retired record, moved byte for byte (git mv), beside its predecessor.
bundled_recommendations: [rec-5668]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - The committed governed text equals the approved sidecar (approved_text verify exits 0).
  - Decision 286 derives currency superseded_compacted, superseded by the new entry, and rec-5668's acceptance command passes; Decision 101 resolves to the new entry through 286.
  - The new entry measures at or under decision-entry.yaml size_governance.measured_size_norm.cap_bytes and both delegated keys resolve.
  - tests/checks/decisions/test_public_identity_decision.py and test_validate_prose_allowlist.py::test_marketing_prose_is_not_sanctioned pass, and fail on origin/main.
  - validate --pre passes, the decisions index is fresh and the full tier passes before hand-off.
  - rec-5668 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed governed text is exactly the approved text.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug redecide-public-identity --expect {{DIGEST}}
    expected: Exit 0.
    fix_if: A difference is reported - restore the approved words; any other change is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier.
  - step: 2
    phase: pre-deploy
    action: Run the new and changed tests; they must fail on origin/main and pass on HEAD.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions/test_public_identity_decision.py
      tests/checks/hygiene/test_validate_prose_allowlist.py tests/checks/decisions/test_consolidation.py -q
    expected: All pass.
    fix_if: A failure - a sidecar block or the test was applied wrongly; fix the application, never the assertion.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The fast tier's affected-set selection runs both modules on every PR touching DECISIONS.md, AGENTS.md, the contract or file-router.yaml.
  - step: 3
    phase: pre-deploy
    action: Prove rec-5668's acceptance and that 286 compacted onto the new entry.
    command: >-
      awk '/^## Decision [0-9]+: On The Loop.s public identity in one entry/{f=1;next} /^## Decision [0-9]+:/{f=0} f'
      docs/DECISIONS.md | grep -q '^\*\*Superseded by: Decision [0-9]' && bin/venv-python -m scripts.decisions_index --check &&
      bin/venv-python -c "import json; rows={r['number']: r for r in json.load(open('docs/decisions-index.json'))['decisions']};
      new=[n for n, r in rows.items() if (r.get('supersedes') or []) == [286]]; assert len(new) == 1, new; r=rows[286];
      assert r.get('currency') == 'superseded_compacted' and r.get('superseded_by') == new[0], r; assert
      rows[209].get('currency') != 'superseded_compacted' and set(rows[new[0]].get('amends') or []) == {127, 171, 209}; print('REDECIDE_286_COMPACTED_OK')"
    expected: Exit 0 and the marker.
    expected_literals: [REDECIDE_286_COMPACTED_OK]
    fix_if: 286 not superseded_compacted or the index stale - re-apply the stub block and regenerate the index with scripts.decisions_index --write.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_decisions_index_freshness and the supersession checks in the fast tier, and test_public_identity_decision.py's stub test; the rec grep runs again at closure.
  - step: 4
    phase: pre-deploy
    action: Run the decision, contract, index and hygiene suites.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions tests/checks/contracts tests/decisions_md
      tests/test_decisions_index.py tests/checks/hygiene -q
    expected: All pass.
    fix_if: A failure - fix inside scope; a fix outside scope is a plan defect. Takes close to 10 minutes; run it backgrounded.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The fast tier's affected-set selection runs these modules on every PR touching their sources.
  - step: 5
    phase: pre-deploy
    action: Record the measurement for the PR body.
    command: >-
      bin/venv-python -c "import re, yaml; from scripts.decisions_md import iter_decision_sections; from
      scripts.checks.decisions import entry_measure as m; cap=yaml.safe_load(open('docs/contracts/decision-entry.yaml'))['size_governance']['measured_size_norm']['cap_bytes'];
      t=open('docs/DECISIONS.md').read(); b={int(re.search(r'Decision (\d+)', h.group(0)).group(1)): s for h, s in
      iter_decision_sections(t)}; n=next(k for k, s in b.items() if 'supersedes: [286]' in s); size=m.measured_bytes(b[n],
      (m.METADATA_ENVELOPE, m.REVERSAL_CONDITIONS, m.OPTIONS_CONSIDERED)); print('measured', size, 'cap', cap); assert
      size <= cap; print('REDECIDE_FITS')"
    expected: The two figures and the marker.
    expected_literals: [REDECIDE_FITS]
    fix_if: Over the cap - stop and report; never trim approved words.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_decisions_size enforces the cap in the fast tier; this step only records the figures.
  - step: 6
    phase: pre-deploy
    action: Run the fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A guard fails - fix inside scope; a fix outside scope is a plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: vp-red-before.yaml refuses to graduate a scripts.validate step (the recursion refusal), and PR CI runs this tier on every PR.
  - step: 7
    phase: pre-deploy
    action: Run the full tier before hand-off (backgrounded, 2 h limit) and read its verdict.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: A completed full-tier pass for HEAD.
    fix_if: A failure - fix in scope and re-run; outside scope is a plan defect, never a hand-off to PR CI.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: Prove the merge synced 286's stub and the new entry to ops_decisions and closed rec-5668.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && bin/venv-python -c "import json; rows={r['id']: r for r in
      map(json.loads, open('logs/.decisions-index.jsonl'))}; assert rows['dec-286']['status'] == 'Superseded',
      rows['dec-286']; new=[r for r in rows.values() if 'public identity re-decided' in (r.get('title') or '')]; assert
      len(new) == 1 and new[0]['status'] == 'Decided', new; print('OPS_DECISIONS_OK')" && bin/venv-python -c "from
      src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
      fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5668']); st={r['id']: r['status'] for r in rows};
      assert st.get('rec-5668') == 'closed', st; print('RECS_OK')"
    expected: OPS_DECISIONS_OK and RECS_OK.
    fix_if: dec-286 still Decided or the new row missing - the rec-autoclose backfill failed; re-run the backfill through the portal. rec-5668 open - close it through update_rec with the merge sha.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/DECISIONS.md
    behavior: The new entry keeps its rulings, delegates and supersession; 286 and 101 resolve to it; 127, 171 and 209 carry the notes.
    verification_step: 2
    test_selector: tests/checks/decisions/test_public_identity_decision.py
    red_green_expectation: red before (AGENTS.md names no confidentiality-boundary Decision), green after
  - source: AGENTS.md
    behavior: The boundary points at the contract list and no longer carries its own NEVER list.
    verification_step: 2
    test_selector: tests/checks/decisions/test_public_identity_decision.py::test_freeze_list_is_complete_and_agents_points_at_the_list
    red_green_expectation: red before (no pointer, old NEVER bullet), green after
  - source: docs/contracts/public-identity.yaml
    behavior: Both delegated lists exist; the freeze list is complete and drops trading-system.
    verification_step: 2
    test_selector: tests/checks/decisions/test_public_identity_decision.py::test_freeze_list_is_complete_and_agents_points_at_the_list
    red_green_expectation: red before (no contract), green after
  - source: scripts/checks/decisions/consolidation.py
    behavior: A manifest whose consolidating entry has compacted onto a successor is history, not a missing consolidator.
    verification_step: 2
    test_selector: tests/checks/decisions/test_consolidation.py::test_a_manifest_whose_consolidating_entry_compacted_is_history
    red_green_expectation: red before (no entry's envelope supersedes exactly [1, 2]), green after
  - source: docs/contracts/approval-routing.yaml
    behavior: A change to docs/contracts/public-identity.yaml needs an approved sidecar.
    verification_step: 6
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: validate_approval_routing already reads gated.files on every run and its own tests cover a listed file; a new test would duplicate it.
  - source: docs/contracts/contract-population.yaml
    behavior: The new Class D contract's agent_surface evaluator resolves through its trigger row.
    verification_step: 6
    command: bin/venv-python -m scripts.validate --pre
    waiver_reason: The contract-population gate already fails an agent_surface contract with no row or an unmatched trigger on every run; a new test would duplicate it.
  - source: docs/contracts/file-router.yaml
    behavior: marketing/**/*.md is no longer sanctioned prose.
    verification_step: 2
    test_selector: tests/checks/hygiene/test_validate_prose_allowlist.py::test_marketing_prose_is_not_sanctioned
    red_green_expectation: red before (the glob sanctions marketing/), green after
  - source: docs/PROJECT_CONTEXT.md
    behavior: Line 9's pointer names the new entry and contract.
    verification_step: 1
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug redecide-public-identity --expect {{DIGEST}}
    waiver_reason: A one-line pointer with no behaviour; the approved-text binding pins its words.
