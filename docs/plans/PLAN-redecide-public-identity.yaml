  - Acceptance criteria understood and verifiable
execution_steps:
  - Rebase onto origin/main; confirm the last wording-check row's base is an ancestor of HEAD and every block's before-text still occurs once (else stop and report a plan defect); run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-redecide-public-identity.yaml and stop on a block.
  - Apply every sidecar block's after-text verbatim, filling {{N}} with the next free Decision number and {{DATE}} with the build date; regenerate docs/decisions-index.json with scripts.decisions_index --write, and lower config/prose_budgets.yaml to the measured sizes the prose ratchet reports (AGENTS.md and PROJECT_CONTEXT.md shrink; rehearsal measured 16666 and 13897 B).
  - Create tests/checks/decisions/test_public_identity_decision.py from /mnt/project-files/decision-growth/consolidation/chain-101/redecide/build-drafts/test_public_identity_decision.py and append /mnt/project-files/decision-growth/consolidation/chain-101/redecide/build-drafts/prose_allowlist_test_addition.py to tests/checks/hygiene/test_validate_prose_allowlist.py; confirm both fail on origin/main (git worktree add ../rb origin/main; copy the two test files into it; run step 2 pytest there and expect failures; git worktree remove ../rb).
  - git mv config/agent/verification_registry/entries/decision-101-performance-figures-reading-resolved.yaml into entries/deprecated/ unchanged.
  - "In .github/pull_request_template.md replace 'PUBLIC-REPO BOUNDARY (Decision 101):' with 'PUBLIC-REPO BOUNDARY (Decision {{N}} cl.2; classes: docs/contracts/public-identity.yaml):'; leave line 20's example untouched."
  - Execute Verification Plan steps 1-6 - run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55).
  - >-
    CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared: true in the
    implementation commit, which carries 'Resolves: rec-5668'; git fetch origin main && git rebase origin/main
    (refill {{N}} if main gained a Decision); re-run red_overlap; re-run steps 1-6 on the closure commit and run
    step 7 last on that same commit, backgrounded from the top-level session with a 2 h limit; push.
  - >-
    Handoff: open the PR ready for review only after steps 1-7 pass; subscribe to its activity; post the #1963 entry
    naming DECISIONS.md (the new entry, the 286 body, the 127, 171 and 209 notes), AGENTS.md, the new contract, contract-population,
    PROJECT_CONTEXT.md, file-router.yaml (marketing/ no longer sanctioned) and the retired record; merge per
    docs/contracts/git-ops.yaml resolves_trailer and merge_step (merge_step premerge --expect the sidecar digest,
    squash commit_message carrying 'Resolves: rec-5668', expectedHeadSha, merge_step readback); then run step 8.
  - >-
    Report, as separate facts: what was implemented; the readiness state (bin/venv-python -m
    scripts.session.github_readiness); the full-tier exit plus validation_result --verify-head for the pushed HEAD;
    structured postflight evidence (bin/venv-python -m scripts.session.postflight --evidence); the push, PR number,
    CI result and read-back merge SHA; step 8's read-back.
rollback: >-
  Before merge, drop the branch. After merge, roll forward, never revert: a new Decision supersedes this entry and
  restates what is to be restored; the 286 stub stays (Decision 177).
