schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: registry-command-portability
intent: >-
  Class-level preventive (Decision 226 cl.5) for the red PR #1836 put on main: refuse, at admission, a graduated
  record whose verdict depends on the CI runner's toolset (ripgrep) or on the live checkout's branch, push context or
  GITHUB_* event variables, and make the local full-tier re-run see ripgrep as absent, as the runner does.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-registry-command-portability.yaml
phase: >-
  Red-main preventive (Decision 226 cl.5) for ci_rca rec-4899 (the Main Canary duplicate of rec-4888); no tier_item
  criterion is closed. Soft-warn exception category ci_rca, so the Tier Item Freshness Gate is skipped.
scope:
  - file: scripts/checks/verification/_registry_command_portability.py
    action: Create
    purpose: >-
      Pure helper findings(row) -> list[str], empty for any row whose primitive_slot is not command_exit_zero,
      command_output_matches or metric_under_threshold. Rule RG (ripgrep in program position): an argv head of rg;
      inside a bash -c or sh -c body, every shell segment including $(...) and backtick substitution bodies, each
      tested with _segment_invokes_rg; inside a python -c body (python, python3 or bin/venv-python head, alone or
      as a segment of a shell body), a list literal whose first element is 'rg'. Rule LIVE_CHECKOUT (actual reads
      only): a git segment or git list literal carrying branch with --show-current, rev-parse with --abbrev-ref, or
      symbolic-ref; a $GITHUB_ or ${GITHUB_ expansion outside single quotes in a shell body; os.environ or os.getenv
      naming a GITHUB_ variable, or a push_context_base() call with no argument, in a python body. A grep or echo
      that only names a token is never a finding. Each finding names its rule and the remedy (POSIX grep for RG; a
      pytest test that builds its own repository for LIVE_CHECKOUT).
    new_imports: [scripts.checks.verification._vp_replay_classify]
  - file: tests/checks/verification/test__registry_command_portability.py
    action: Create
    purpose: >-
      Mirror test, class TestFindings: every RG and LIVE_CHECKOUT shape above is flagged, including the three
      measured live shapes verbatim (data-pipeline-excludes-control-module, push-context-session-branch-guard,
      ungoverned-counter-creation-retired); the non-flagged shapes stay clean (grep -q 'GITHUB_HEAD_REF' f,
      grep -c 'push_context_base' f, echo '$GITHUB_REF', print('rg'), push_context_base(root), a test_selector row,
      a grep_count row).
  - file: scripts/checks/verification/_vp_replay_classify.py
    action: Modify
    purpose: Receives _segment_invokes_rg moved verbatim from validate_vp_replay.py (plus the shlex import it needs), beside the _SHELL_SEGMENT_SPLIT_RE it already uses.
  - file: scripts/checks/verification/validate_vp_replay.py
    action: Modify
    purpose: >-
      Imports _segment_invokes_rg from _vp_replay_classify instead of defining it (a refactor disposition citing
      _vp_replay_classify.py::_segment_invokes_rg; rg_portability_lint behaviour unchanged, and the name stays
      importable from this module for tests/checks/verification/validate_vp_replay/test_lint_and_budget.py). Relieves
      the module's 483-of-500 SLOC NEAR_CAP.
  - file: scripts/checks/verification/validate_verification_registry.py
    action: Modify
    purpose: >-
      New admission leg over exactly the added-or-modified candidates its differential gate already selects, run
      before the differential: each findings() entry fails the run as "verification-registry portability:
      check_id=<id>: <finding>", and the leg prints "Portability (rec-4889): <N> added-or-modified command-slot
      row(s) examined, <M> refused." even when N is 0 (Decision 170). The differential gate itself is unchanged.
    new_imports: [scripts.checks.verification._registry_command_portability]
  - file: tests/checks/verification/test_validate_verification_registry_portability.py
    action: Create
    purpose: >-
      Class TestPortabilityLeg drives validate_verification_registry(failed, root=<tmp git repo>) with an origin/main
      ref holding a base set of shards (the pattern tests/checks/verification/test_validate_verification_registry.py
      already uses): an added rg record, an added live-checkout record and a modified record that gains rg each yield a
      "verification-registry portability:" failure naming its check_id; a clean added record, an unmodified live rg
      record and an added test_selector record yield none; the examined line prints. Assertions read only the
      portability-prefixed messages.
  - file: scripts/checks/verification/validate_graduated_rerun.py
    action: Modify
    purpose: >-
      _run_child runs each child with PATH whose first entry is a temporary directory holding an executable rg that
      exits 127, so a local full tier matches the CI runner; the directory is created once per evaluate() call and
      removed after it. In-process slots are unchanged. Ripgrep is never installed in CI (rg_portability_lint).
  - file: tests/checks/verification/test_validate_graduated_rerun.py
    action: Modify
    purpose: >-
      TestHelpers::test_child_runs_see_rg_absent: with a fake rg that exits 0 prepended to the test's own PATH, a
      record running bash -c 'rg --version' is red through _run_child -- red before the change on any host, green
      after.
  - file: tests/test_counter_table_creation_confined.py
    action: Create
    purpose: >-
      rg-free pytest holding ungoverned-counter-creation-retired's claim, which is vacuous on the runner and, once the
      rg stub lands, locally too: test_no_stray_counter_table_creation asserts no ensure_entity_counters_table( call in
      any src/ or scripts/ Python file outside *control_tables* files; test_stray_call_is_detected proves the scan
      flags a planted call in a tmp tree. Pure-Python scan, no first-party imports (collects on venv-less pr-validate).
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's three blocks: the fields.check_spec.semantics PORTABILITY sentence, a new
      fields.check_spec amendment_log entry (accepted_values_narrow, semantic_break true; Decision 118 category 6 is
      field-scoped) and contract_version 8 -> 9.
  - file: docs/plans/approved/registry-command-portability.yaml
    action: Create
    purpose: Operator-approved sidecar binding the contract words (digest c4d6ced2); delivered by the plan PR, so the build PR does not touch it.
bundled_recommendations: [rec-4889, rec-4899]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - validate_verification_registry refuses an added or modified command-slot record that runs rg in program position (bash -c bodies, $(...) and backtick substitutions and python list heads included) or reads live checkout state, naming the check_id, the rule and the remedy, and prints its examined count.
  - A record that only names a token (grep -q 'GITHUB_HEAD_REF' f, grep -c 'push_context_base' f) and every non-command slot is never refused.
  - Over the live corpus after PLAN-retire-ci-only-red-records' build, findings() flags exactly ungoverned-counter-creation-retired, and it flags both records that build retired (RG and LIVE_CHECKOUT respectively).
  - validate_graduated_rerun's child runs see rg exit 127 on any host.
  - rg_portability_lint behaves identically after the detector move, with one definition of _segment_invokes_rg.
  - ungoverned-counter-creation-retired's claim is asserted by an rg-free pytest node in the same diff as the rg stub.
  - verification-registry.yaml carries exactly the sidecar's words (approved digest c4d6ced2) and stays within 500 effective lines.
  - The full tier is green locally and on the first post-merge main-validate run; rec-4889 and rec-4899 close through the Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The helper flags every RG and LIVE_CHECKOUT shape, including the three measured live shapes, and nothing that only names a token.
    command: bin/venv-python -m pytest tests/checks/verification/test__registry_command_portability.py::TestFindings -q
    expected: Exit 0. Red before (the test file and the helper do not exist).
    fix_if: A shape is missed or a token-only shape is flagged -- fix findings(); never loosen a test case.
    hermetic: true
    graduation: graduate
    graduation_check_id: registry-command-portability-findings
    expected_literals: []
  - step: 2
    phase: pre-deploy
    action: The admission leg refuses added and modified non-portable records and nothing else.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_registry_portability.py::TestPortabilityLeg -q
    expected: Exit 0. Red before (the leg does not exist).
    fix_if: A non-portable added or modified record passes, or an unmodified or clean record is refused -- fix the leg's population or the helper.
    hermetic: true
    graduation: graduate
    graduation_check_id: registry-portability-admission-leg
    expected_literals: []
  - step: 3
    phase: pre-deploy
    action: The standing re-run's child processes see ripgrep as absent even where a working rg is on PATH.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_graduated_rerun.py::TestHelpers::test_child_runs_see_rg_absent -q
    expected: Exit 0. Red before (the fake rg exits 0, so the record passes without the stub).
    fix_if: The record passes -- the stub directory is not first on the child's PATH.
    hermetic: true
    graduation: graduate
    graduation_check_id: graduated-rerun-child-rg-absent
    expected_literals: []
  - step: 4
    phase: pre-deploy
    action: The vacuous record's claim is asserted for real, without ripgrep, and the scan is proven to discriminate.
    command: >-
      bin/venv-python -m pytest
      tests/test_counter_table_creation_confined.py::test_no_stray_counter_table_creation
      tests/test_counter_table_creation_confined.py::test_stray_call_is_detected -q
    expected: Exit 0, 2 passed. Red before (the file does not exist).
    fix_if: The real-tree node fails -- a stray call exists; report it as a rec, never weaken the scan. The planted-call node fails -- the scan is blind.
    hermetic: true
    graduation: graduate
    graduation_check_id: counter-table-creation-confined
    expected_literals: []
  - step: 5
    phase: pre-deploy
    action: >-
      Corpus measurement over real data: findings() flags exactly one live record, the vacuous one, and flags both
      records PLAN-retire-ci-only-red-records retired with the rule that matches their incident.
    command: >-
      bin/venv-python -c "from pathlib import Path; import yaml; from scripts import verification_graduation as vg;
      from scripts.checks.verification import _registry_command_portability as p;
      hit=sorted(r['check_id'] for r in vg.load_entries(Path('.')) if p.findings(r));
      assert hit==['ungoverned-counter-creation-retired'], hit;
      d='config/agent/verification_registry/entries/deprecated/';
      a=p.findings(yaml.safe_load(open(d+'data-pipeline-excludes-control-module.yaml')));
      b=p.findings(yaml.safe_load(open(d+'push-context-session-branch-guard.yaml')));
      assert a and all('RG' in f for f in a), a; assert b and all('LIVE_CHECKOUT' in f for f in b), b;
      print('PORTABILITY_CORPUS_EXACT', len(hit))"
    expected: Exit 0 and the marker line with count 1. Precondition, PLAN-retire-ci-only-red-records' build merged (both records in entries/deprecated/).
    fix_if: >-
      Another live record is flagged -- if it truly runs rg or reads live state it is a new CI-only red to route
      (Decision 226), else the rule over-matches: fix the shape, never add an allowlist. A retired record is not
      flagged -- the rule misses its incident shape.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Moment claim (an exact whole set of live records, Decision 244 cl.4); steps 1-2 carry the standing rule.
    expected_literals: [PORTABILITY_CORPUS_EXACT 1]
  - step: 6
    phase: pre-deploy
    action: The detector move changes no VP-lint behaviour and leaves exactly one definition.
    command: >-
      test "$(grep -c '^def _segment_invokes_rg' scripts/checks/verification/_vp_replay_classify.py)" -eq 1 &&
      ! grep -q '^def _segment_invokes_rg' scripts/checks/verification/validate_vp_replay.py &&
      bin/venv-python -m pytest tests/checks/verification/validate_vp_replay/test_lint_and_budget.py -q
    expected: Exit 0.
    fix_if: Two definitions, or an existing rg_portability_lint test changes verdict -- the move was not verbatim.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The lint tests already run in the suite; the single-definition check is one-time evidence of a verbatim move.
    expected_literals: []
  - step: 7
    phase: pre-deploy
    action: The governed text matches the operator-approved sidecar word for word.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug registry-command-portability --base origin/main --expect c4d6ced2ceabc7e57e69963ff6821981a495bcc15b92de6f488f2073d9e3a824
    expected: Exit 0.
    fix_if: Any bound word differs beyond a filled {{DATE}} -- stop and route to this plan's planning thread; never re-derive the sidecar.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Base-relative to origin/main; vacuous after merge, when origin/main holds the bound text.
  - step: 8
    phase: pre-deploy
    action: Fast tier, including the new leg, the differential gate, structural size and contract drift.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: verification-registry.yaml over 500 effective lines -- stop and amend the plan (the sidecar binds every word, so relief needs an approved block); any other failure in scope is fixed on the branch.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard); the tier itself is the standing guard.
  - step: 9
    phase: pre-deploy
    action: Full tier before handoff (Decision 163), backgrounded with a 2 h limit, read by its verdict file; validate_graduated_rerun runs with the rg stub.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verdict check exits 0 for HEAD.
    fix_if: >-
      validate_graduated_rerun reds a record the stub newly exposes -- it is a CI-only red the runner already sees;
      route it (Decision 226), never list it. Any other failure in scope is fixed on the branch.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard); the full tier on main is the standing guard.
  - step: 10
    phase: post-deploy
    action: The first main-validate run on the merge commit is green.
    command: >-
      mcp__github__actions_list(method=list_workflow_runs, owner=otl-labs, repo=ontheloop, resource_id=ci.yml,
      workflow_runs_filter={branch: main, event: push}), pick the run whose head_sha is the squash-merge SHA, then
      mcp__github__get_job_logs(owner=otl-labs, repo=ontheloop, job_id=<its main-validate job>, return_content=true)
      and read the Validation Summary.
    expected: main-validate conclusion success, with no GATE-FAILURE line for validate_verification_registry or validate_graduated_rerun.
    fix_if: A failure in this plan's checks -- forward-fix on a new branch (Decision 226). An unrelated red (for example rec-4872's flake) -- record this plan's legs as passed and route the other failure.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: Bundled recs closed by the Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4889','rec-4899']); s={x['id']:x['status'] for x in r};
      assert all(v=='closed' for v in s.values()) and not m, (s,m); print('CLOSED', s)"
    expected: Both closed.
    fix_if: Read the ci.yml closure job's verdict; never close by hand without it.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/verification/_registry_command_portability.py
    behavior: Every RG and LIVE_CHECKOUT shape is flagged and token-only shapes are not.
    verification_step: 1
    test_selector: tests/checks/verification/test__registry_command_portability.py::TestFindings
    red_green_expectation: Red before (module absent). Green after.
  - source: scripts/checks/verification/validate_verification_registry.py
    behavior: Added and modified non-portable command-slot records fail the run; nothing else does.
    verification_step: 2
    test_selector: tests/checks/verification/test_validate_verification_registry_portability.py::TestPortabilityLeg
    red_green_expectation: Red before (no leg; the non-portable records pass). Green after.
  - source: scripts/checks/verification/validate_graduated_rerun.py
    behavior: Child record runs see rg exit 127 on any host.
    verification_step: 3
    test_selector: tests/checks/verification/test_validate_graduated_rerun.py::TestHelpers::test_child_runs_see_rg_absent
    red_green_expectation: Red before (the fake rg exits 0). Green after.
  - source: scripts/checks/verification/_vp_replay_classify.py
    behavior: _segment_invokes_rg keeps its verdicts after the move.
    verification_step: 6
    test_selector: tests/checks/verification/validate_vp_replay/test_lint_and_budget.py
    waiver_reason: Verbatim relocation with no behaviour change (refactor disposition); the existing rg_portability_lint tests pin every verdict.
  - source: scripts/checks/verification/validate_vp_replay.py
    behavior: rg_portability_lint is unchanged with the detector imported.
    verification_step: 6
    test_selector: tests/checks/verification/validate_vp_replay/test_lint_and_budget.py
    waiver_reason: Import-only change; the existing lint tests run unchanged against the moved function.
  - source: docs/contracts/verification-registry.yaml
    behavior: The PORTABILITY sentence, its field amendment entry and the version bump match the operator-approved sidecar word for word.
    verification_step: 7
    command: approved_text verify --slug registry-command-portability
    waiver_reason: Governed prose with no behaviour; step 7 binds every word to the approved digest and step 8's contract-drift and size checks cover its shape.
constraints:
  - IMPLEMENTATION only (Decision 67 STRATEGIC freeze); no numbered Decision is drafted (record grammar routes to the contract, Decision 150).
  - 'Never install ripgrep in CI, never add an id to known_red.yaml, and never retire or edit a live record: ungoverned-counter-creation-retired stays live and unmodified (human choice; rec-3286 owns its repair; retiring it would be a Decision 235 weakening).'
  - Admission-only by design -- the leg reads exactly the differential gate's added-or-modified population; no allowlist, waiver or corpus exception (Decision 163 cl.1).
  - The rg stub (validate_graduated_rerun) and tests/test_counter_table_creation_confined.py land in the same commit, so no commit makes the vacuous record's only real check vanish (Decision 235 cl.1 NOTE).
  - The move of _segment_invokes_rg is verbatim (Decision 181 refactor disposition); rg_portability_lint's population and verdicts do not change.
  - Contract text is exactly the sidecar; nothing is loosened to obtain green (Decisions 181, 235). No VP step invokes rg (rg_portability_lint).
  - No rescue agents or workaround loops (Decision 55).
