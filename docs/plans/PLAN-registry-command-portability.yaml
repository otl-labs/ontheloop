schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: registry-command-portability
intent: >-
  Class-level preventive (Decision 226 cl.5) for the red PR #1836 put on main: refuse, at admission, a graduated
  record whose verdict depends on the CI runner's toolset (ripgrep) or on the live checkout's branch, push context or
  GITHUB_* event variables, and make the local full-tier re-run see ripgrep as absent, as the runner does.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-registry-command-portability.yaml
phase: >-
  Red-main preventive (Decision 226 cl.5) for ci_rca rec-4899 (the Main Canary duplicate of rec-4888); no tier_item
  criterion is closed. Soft-warn exception category ci_rca, so the Tier Item Freshness Gate is skipped.
scope:
  - file: scripts/checks/verification/_registry_command_portability.py
    action: Create
    purpose: >-
      Pure helper with no first-party imports. findings(row) -> Findings(messages: list[str], unparseable: int), empty
      for any row whose primitive_slot is not command_exit_zero, command_output_matches or metric_under_threshold.
      ARGV RULES apply to the top-level argv and to every python list literal made solely of string literals: strip
      leading timeout N, env and VAR=val, then by head basename -- rg is an RG finding; git carrying branch with
      --show-current, rev-parse with --abbrev-ref, symbolic-ref or merge-base is a LIVE_CHECKOUT finding; bash or sh
      with an option token that is -c or a combined short flag containing c (-lc, -ec) makes the following argument a
      SHELL BODY; python, python3 or venv-python with -c makes it a PYTHON BODY. SHELL BODIES: the helper's own
      quote-aware (a quoted |, ; or newline never splits), newline-aware segmentation on newline, ;, &&, ||, |, & and
      subshell parentheses, recursing into $(...) and backtick substitution bodies found outside single quotes
      (inside double quotes included); each segment's head, after stripping !, env, VAR=val, timeout N, command and
      exec (a superset of rg_portability_lint's strips; its program-position sense is unchanged), goes through the
      argv rules; a $GITHUB_ or ${GITHUB_ expansion outside single quotes is a LIVE_CHECKOUT finding; a segment it
      cannot tokenize (unbalanced quote) is counted in unparseable and fails OPEN, as rg_portability_lint does. PYTHON
      BODIES are read with the stdlib tokenize module, never executed or parsed, so string contents are never matched:
      code tokens forming os.environ[...], os.environ.get(...) or os.getenv(...) with a GITHUB_ string argument, or
      ANY push_context_base( call (it reads GITHUB_EVENT_NAME job-globally whatever its root argument,
      scripts/checks/_common.py), are LIVE_CHECKOUT findings, and each all-string list literal goes through the argv
      rules; a body tokenize rejects counts one unparseable and fails open, never raising. A grep or echo that only
      names a token, a string literal that only names one, and an os.environ.pop or assignment are never findings.
      Each message starts with its rule token, "RG:" or "LIVE_CHECKOUT:", and names the remedy (POSIX grep for RG; a
      pytest test that builds its own repository for LIVE_CHECKOUT). admission_report(candidates) -> (failures, line):
      failures are "verification-registry portability: check_id=<id>: <message>" for each finding, and line is
      "Portability (rec-4889): <N> added-or-modified command-slot row(s) examined, <M> refused, <U> unparseable
      segment(s) failed open." -- a counted line, never silent, in rg_portability_lint's posture (the check's own
      examined() declaration is unchanged). The module docstring records the residuals: reads through first-party
      code and string-form shell calls (subprocess shell=True, os.system) are rec-4904's, and the re-run's rg stub is
      present-but-exiting-127 rather than absent, so a command -v rg or shutil.which('rg') probe would differ from the
      runner (none exists in the repository today).
  - file: tests/checks/verification/test__registry_command_portability.py
    action: Create
    purpose: >-
      Mirror test (full per-file coverage; no coverage_baseline entry exists for scripts/checks/verification/**).
      TestFindings flags, each message asserted by its exact rule prefix: the three measured live shapes verbatim
      (data-pipeline-excludes-control-module, push-context-session-branch-guard, ungoverned-counter-creation-retired);
      a multi-line body with rg on line 2; rg -n 'foo|bar' src/ in a bash -c body; bash -lc 'rg x'; timeout 60 bash -c
      'rg x'; LC_ALL=C rg -q foo src/; a top-level ['timeout','60','rg','x'] and ['env','rg','x'] argv; "$(rg x)" inside double quotes; a backtick rg; bin/venv-python -c "import
      subprocess; subprocess.run(['rg','x'])" embedded in a shell body; a top-level ['git','branch','--show-current'] and ['timeout','60','git','merge-base','origin/main','HEAD'] argv;
      a python body holding subprocess.run(['bash','-c','rg x']); git branch --show-current, git rev-parse
      --abbrev-ref HEAD inside $(...), git symbolic-ref HEAD, git merge-base origin/main HEAD, $GITHUB_EVENT_NAME and
      ${GITHUB_REF} in a shell body; os.getenv('GITHUB_REF') and push_context_base(Path('.')) in a python body. Clean:
      grep -q 'GITHUB_HEAD_REF' f, grep -c 'push_context_base' f, echo '$GITHUB_REF', '$(rg x)' inside single quotes,
      print('rg'), a python string literal naming push_context_base( or os.getenv('GITHUB_REF'),
      os.environ.pop('GITHUB_EVENT_NAME', None), a test_selector row, a grep_count row. An unbalanced
      quote counts one unparseable segment and no finding; a python body tokenize rejects counts one unparseable segment
      without raising. TestAdmissionReport covers admission_report's failures and its line for zero, clean and refused
      candidates.
  - file: scripts/checks/verification/validate_verification_registry.py
    action: Modify
    purpose: >-
      Straight-line admission leg right after the added-or-modified candidates are computed and before the
      differential: failures, line = admission_report(candidates); print the line (also when there are none);
      failed.extend(failures). The differential gate itself is unchanged. The loop lives in the helper so this
      module's mirror, whose existing tests already reach the candidates path, keeps full coverage.
    new_imports: [scripts.checks.verification._registry_command_portability]
  - file: tests/checks/verification/test_validate_verification_registry_portability.py
    action: Create
    purpose: >-
      Class TestPortabilityLeg drives validate_verification_registry(failed, root=<tmp git repo>) end to end with an
      origin/main ref holding a base set of shards, verification_graduation.run_differential mocked (as
      TestVerificationRegistryDifferential does) so the result never depends on host ripgrep; git helpers are local
      to the file or from tests/fixtures, never imported from a sibling test module (validate_no_cross_test_imports).
      An added rg record, an added live-checkout record and a modified record that gains rg each yield a
      "verification-registry portability:" failure naming its check_id; a clean added record, an unmodified live rg
      record and an added test_selector record yield none; the Portability line prints. Assertions read only the
      portability-prefixed messages and the line.
  - file: scripts/checks/verification/validate_graduated_rerun.py
    action: Modify
    purpose: >-
      _run_child(row, root, rg_stub_dir=None) runs each child with PATH whose first entry is a directory holding an
      executable rg that writes "rg: command not found (stubbed: the CI runner has no ripgrep)" to stderr and exits
      127; with rg_stub_dir None it creates its own temporary directory and removes it before returning. evaluate()
      creates one directory, threads it through _run_record to every child, the serial confirm re-run included, and
      removes it after. In-process slots are unchanged. Ripgrep is never installed in CI (rg_portability_lint).
  - file: tests/checks/verification/test_validate_graduated_rerun.py
    action: Modify
    purpose: >-
      TestHelpers::test_child_runs_see_rg_absent: with a fake rg that exits 0 prepended to the test's own PATH, a
      record running bash -c 'rg --version' is red through _run_child(row, root) -- red before the change on any host
      (the fake rg wins), green after. TestHelpers::test_rg_stub_dir_removed: with tempfile.mkdtemp spied, _run_child(row, root)
      alone creates exactly one stub directory, and evaluate() over at least two child-slot records creates exactly
      one in total; none remains afterwards -- red before the change (no directory is created).
  - file: tests/test_counter_table_creation_confined.py
    action: Create
    purpose: >-
      rg-free pytest holding ungoverned-counter-creation-retired's claim, which is vacuous on the runner and, once the
      rg stub lands, locally too. test_no_stray_counter_table_creation: no file `git ls-files src scripts` lists, other
      than paths whose basename contains control_tables (the record's --glob '!*control_tables*'), contains
      ensure_entity_counters_table( -- the record's own scope, not only Python. test_stray_call_is_detected: the same
      scan, pointed at a tmp git repo, flags a planted call and ignores one in a *control_tables* file. No first-party
      imports, so it collects on venv-less pr-validate.
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's four blocks: the fields.check_spec.semantics PORTABILITY sentence, a new
      fields.check_spec amendment_log entry (accepted_values_narrow, semantic_break true; Decision 118 category 6 is
      field-scoped), contract_version 8 -> 9, and the flow-style compaction (values unchanged) of the 2026-09-25 and
      2026-08-31 top-level amendment_log rows -- the NEAR_CAP relief that leaves 482 of 500 effective lines.
  - file: docs/plans/approved/registry-command-portability.yaml
    action: Create
    purpose: Operator-approved sidecar binding the contract words (digest b7129205); delivered by the plan PR, so the build PR does not touch it.
bundled_recommendations: [rec-4889, rec-4899]
followon_recs: [rec-4904]
infrastructure_dependencies: []
acceptance_criteria:
  - validate_verification_registry refuses an added or modified command-slot record that runs rg in program position (multi-line, bash -lc, timeout-prefixed and quoted-pipe bodies, $(...) and backtick substitutions and python list heads included) or reads live checkout state (a top-level, segment or python-list git argv, any push_context_base call and git merge-base included), naming the check_id, the rule and the remedy, and prints its examined, refused and unparseable counts.
  - A record that only names a token -- in a grep or echo argument (grep -q 'GITHUB_HEAD_REF' f, grep -c 'push_context_base' f) or inside a python string literal -- an os.environ.pop, and every non-command slot is never refused; a python body tokenize rejects is counted unparseable and never raises.
  - Over the live corpus after PLAN-retire-ci-only-red-records' build (merged, 10571b32), findings() flags exactly ungoverned-counter-creation-retired, and it flags both records that build retired (RG and LIVE_CHECKOUT respectively).
  - validate_graduated_rerun's child runs see rg exit 127 on any host, exactly one stub directory serves an evaluate() call (asserted over two or more child-slot records), and none is left behind.
  - ungoverned-counter-creation-retired's claim is asserted by an rg-free pytest node over the record's own scope, in the same diff as the rg stub.
  - verification-registry.yaml carries exactly the sidecar's words (approved digest b7129205) and stays within 500 effective lines.
  - The full tier is green locally and on the first post-merge main-validate run; rec-4899 carries its Decision 186 class artifact before merge, and rec-4889 and rec-4899 close through the Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The helper flags every RG and LIVE_CHECKOUT shape, including the three measured live shapes and the corpus's multi-line, -lc, timeout and quoted-pipe bodies, counts unparseable segments, and flags nothing that only names a token.
    command: >-
      bin/venv-python -m pytest tests/checks/verification/test__registry_command_portability.py::TestFindings
      tests/checks/verification/test__registry_command_portability.py::TestAdmissionReport -q
    expected: Exit 0. Red before (the test file and the helper do not exist).
    fix_if: A shape is missed or a token-only shape is flagged -- fix findings(); never loosen a test case.
    hermetic: true
    graduation: graduate
    graduation_check_id: registry-command-portability-findings
    expected_literals: []
  - step: 2
    phase: pre-deploy
    action: The admission leg refuses added and modified non-portable records and nothing else.
    command: bin/venv-python -m pytest tests/checks/verification/test_validate_verification_registry_portability.py::TestPortabilityLeg -q
    expected: Exit 0. Red before (the leg does not exist).
    fix_if: A non-portable added or modified record passes, or an unmodified or clean record is refused -- fix the leg's population or the helper.
    hermetic: true
    graduation: graduate
    graduation_check_id: registry-portability-admission-leg
    expected_literals: []
  - step: 3
    phase: pre-deploy
    action: The standing re-run's child processes see ripgrep as absent even where a working rg is on PATH, and the stub directory is created and cleaned up.
    command: >-
      bin/venv-python -m pytest
      tests/checks/verification/test_validate_graduated_rerun.py::TestHelpers::test_child_runs_see_rg_absent
      tests/checks/verification/test_validate_graduated_rerun.py::TestHelpers::test_rg_stub_dir_removed -q
    expected: Exit 0, 2 passed. Red before (the fake rg exits 0, so the record passes; no stub directory is created).
    fix_if: The record passes -- the stub directory is not first on the child's PATH. A stub directory remains -- fix its cleanup.
    hermetic: true
    graduation: graduate
    graduation_check_id: graduated-rerun-child-rg-absent
    expected_literals: []
  - step: 4
    phase: pre-deploy
    action: The vacuous record's claim is asserted for real, without ripgrep, over its own scope, and the scan is proven to discriminate.
    command: >-
      bin/venv-python -m pytest
      tests/test_counter_table_creation_confined.py::test_no_stray_counter_table_creation
      tests/test_counter_table_creation_confined.py::test_stray_call_is_detected -q
    expected: Exit 0, 2 passed. Red before (the file does not exist).
    fix_if: The real-tree node fails -- a stray call exists; report it as a rec, never weaken the scan. The planted-call node fails -- the scan is blind.
    hermetic: true
    graduation: graduate
    graduation_check_id: counter-table-creation-confined
    expected_literals: []
  - step: 5
    phase: pre-deploy
    action: >-
      Corpus measurement over real data: findings() flags exactly one live record, the vacuous one, and flags both
      records PLAN-retire-ci-only-red-records retired with the rule that matches their incident.
    command: >-
      bin/venv-python -c "from pathlib import Path; import yaml; from scripts import verification_graduation as vg;
      from scripts.checks.verification import _registry_command_portability as p;
      hit=sorted(r['check_id'] for r in vg.load_entries(Path('.')) if p.findings(r).messages);
      assert hit==['ungoverned-counter-creation-retired'], hit;
      d='config/agent/verification_registry/entries/deprecated/';
      a=p.findings(yaml.safe_load(open(d+'data-pipeline-excludes-control-module.yaml'))).messages;
      b=p.findings(yaml.safe_load(open(d+'push-context-session-branch-guard.yaml'))).messages;
      assert a and all(f.startswith('RG:') for f in a), a; assert b and all(f.startswith('LIVE_CHECKOUT:') for f in b), b;
      print('PORTABILITY_CORPUS_EXACT', len(hit))"
    expected: Exit 0 and the marker line with count 1. Its precondition, PLAN-retire-ci-only-red-records' build, merged at 10571b32.
    fix_if: >-
      Another live record is flagged -- if it truly runs rg or reads live state it is a new CI-only red to route
      (Decision 226), else the rule over-matches: fix the shape, never add an allowlist. A retired record is not
      flagged -- the rule misses its incident shape.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Moment claim (an exact whole set of live records, Decision 244 cl.4); steps 1-2 carry the standing rule.
    expected_literals: [PORTABILITY_CORPUS_EXACT 1]
  - step: 6
    phase: pre-deploy
    action: The governed text matches the operator-approved sidecar word for word.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug registry-command-portability --base origin/main --expect b71292053c2422b0e976dbf8781bde1d76c46957d5c6e1ab76a1274b6499f7b2
    expected: Exit 0.
    fix_if: Any bound word differs beyond a filled {{DATE}} -- stop and route to this plan's planning thread; never re-derive the sidecar.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Base-relative to origin/main; vacuous after merge, when origin/main holds the bound text.
  - step: 7
    phase: pre-deploy
    action: Fast tier, including the new leg, the differential gate, structural size and contract drift.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: verification-registry.yaml over 500 effective lines (482 measured with the sidecar on 734b65e9) -- stop and amend the plan, since the sidecar binds every word; any other failure in scope is fixed on the branch.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard); the tier itself is the standing guard.
  - step: 8
    phase: pre-deploy
    action: Full tier before handoff (Decision 163), backgrounded with a 2 h limit, read by its verdict file; validate_graduated_rerun runs with the rg stub and validate_test_coverage measures each touched source against its mirror.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verdict check exits 0 for HEAD.
    fix_if: >-
      validate_graduated_rerun reds a record the stub newly exposes -- it is a CI-only red the runner already sees;
      route it (Decision 226), never list it. A per-file coverage miss -- add the mirror node. Any other failure in
      scope is fixed on the branch.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard); the full tier on main is the standing guard.
  - step: 9
    phase: pre-deploy
    action: >-
      rec-4899 (escape-classified: detection_gap tier_misplaced, escape_class no-edge) carries the class artifact its
      Decision 186 closure needs before the trailer closes it; the status is untouched (a status-preserving write is
      ungated, scripts/ops_portal/closure_gate.py). rec-4889 is not escape-classified and needs no stamp.
    command: >-
      bin/venv-python -m scripts.ops_data_portal --profile agent_platform --update-rec rec-4899 --closure-artifact
      'pytest:tests/checks/verification/test_validate_verification_registry_portability.py::TestPortabilityLeg' &&
      bin/venv-python -c "import json; from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4899']); c=json.loads(r[0]['context_v2_json']);
      assert r[0]['status']=='open' and c['closure_artifact'].startswith('pytest:tests/checks/verification/test_validate_verification_registry_portability.py'), c.get('closure_artifact');
      print('ARTIFACT_STAMPED', c['closure_artifact'])"
    expected: Exit 0 and the marker line; rec-4899 still open. Run after the build commit exists and before the merge; the squash commit adds the artifact's defining file, so the trailer's closure_fix_sha binds it.
    fix_if: The portal refuses the token -- read docs/contracts/ci-rca-lifecycle.yaml closure_obligation for the token grammar; never use a waiver for a duplicate (Decision 186 cl.5).
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: The first main-validate run on the merge commit is green.
    command: >-
      mcp__github__actions_list(method=list_workflow_runs, owner=otl-labs, repo=ontheloop, resource_id=ci.yml,
      workflow_runs_filter={branch: main, event: push}), pick the run whose head_sha is the squash-merge SHA, then
      mcp__github__get_job_logs(owner=otl-labs, repo=ontheloop, job_id=<its main-validate job>, return_content=true)
      and read the Validation Summary.
    expected: main-validate conclusion success, with no GATE-FAILURE line for validate_verification_registry or validate_graduated_rerun.
    fix_if: A failure in this plan's checks -- forward-fix on a new branch (Decision 226). An unrelated red (for example rec-4872's flake) -- record this plan's legs as passed and route the other failure.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: Bundled recs closed by the Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4889','rec-4899']); s={x['id']:x['status'] for x in r};
      assert all(v=='closed' for v in s.values()) and not m, (s,m); print('CLOSED', s)"
    expected: Both closed.
    fix_if: >-
      Read the ci.yml closure job's verdict; never close by hand without it. An escape-closure refusal marker for
      rec-4899 means its closure_artifact is missing or unbound -- re-stamp it (step 9) and re-close through the portal
      with --closure-artifact plus --closure-fix-sha <merge sha>; never a waiver for a duplicate (Decision 186 cl.5).
    hermetic: false
    graduation: not-applicable
