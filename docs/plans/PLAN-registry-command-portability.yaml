  - 'Add the portability leg to validate_verification_registry (before the differential, same candidates, examined line) and tests/checks/verification/test_validate_verification_registry_portability.py::TestPortabilityLeg; run step 2.'
  - 'In one commit: the rg stub in validate_graduated_rerun._run_child, TestHelpers::test_child_runs_see_rg_absent, and tests/test_counter_table_creation_confined.py; run steps 3-4.'
  - Apply docs/plans/approved/registry-command-portability.yaml's three blocks to docs/contracts/verification-registry.yaml exactly, filling {{DATE}} with the build date; run step 7.
