    waiver_reason: Governed prose with no behaviour; step 6 binds every word to the approved digest and step 7's contract-drift and size checks cover its shape.
constraints:
  - IMPLEMENTATION only (Decision 67 STRATEGIC freeze); no numbered Decision is drafted (record grammar routes to the contract, Decision 150).
  - 'Never install ripgrep in CI, never add an id to known_red.yaml, and never retire or edit a live record: ungoverned-counter-creation-retired stays live and unmodified (human choice; rec-3286 owns its repair; retiring it would be a Decision 235 weakening).'
  - Admission-only by design -- the leg reads exactly the differential gate's added-or-modified population; no allowlist, waiver or corpus exception (Decision 163 cl.1). Unparseable segments fail open and are counted on the printed line, never silently (rg_portability_lint's posture; Decision 181 cl.2).
  - The rg stub (validate_graduated_rerun) and tests/test_counter_table_creation_confined.py land in the same commit, so no commit makes the vacuous record's only real check vanish (Decision 235 cl.1 NOTE); the approval is this human-confirmed plan naming the stub (Decision 235 cl.1), and the same-commit replacement disposes it as non-weakening; code review still disposes of it and the handoff states this.
  - validate_vp_replay, _vp_replay_classify and rg_portability_lint are untouched; the helper's segmentation is its own.
  - Contract text is exactly the sidecar; nothing is loosened to obtain green (Decisions 181, 235). No VP step invokes rg (rg_portability_lint).
  - No rescue agents or workaround loops (Decision 55).
