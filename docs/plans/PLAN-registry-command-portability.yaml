  - After merge, run steps 10-11 and report the merge SHA, the main-validate run id and its Validation Summary.
  - 'Report: what was implemented, verification results.'
rollback: Revert the squash commit; admission returns to differential-only and the local re-run sees host ripgrep again; no record or list changes.
