pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (163, 176, 201, 226, 235, 244) read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - 'git mv config/agent/verification_registry/entries/data-pipeline-excludes-control-module.yaml config/agent/verification_registry/entries/deprecated/ -- content untouched.'
  - 'git mv config/agent/verification_registry/entries/push-context-session-branch-guard.yaml config/agent/verification_registry/entries/deprecated/ -- content untouched.'
  - Apply docs/plans/approved/retire-ci-only-red-records.yaml's two blocks to docs/contracts/verification-registry.yaml exactly, filling {{DATE}} with the build date.
  - >-
    Create tests/verification_graduation/test_retired_ci_only_red_records.py: assert neither id is in
    scripts.verification_graduation.load_entries(), and each entries/deprecated/<id>.yaml parses with check_id == <id>.
    It pins no contract text (step 5 binds that word for word), so a later amendment-history compaction needs no test edit.
  - >-
    Commit the change with the trailer "Resolves: rec-4888" in the commit body, then execute Verification Plan steps 1-7
    on the committed, clean tree (step 4 and step 7 backgrounded; step 7 after every other step passes); loop until pass;
    on an unexpected red record stop and report (Decision 55).
  - >-
    Open the PR. The contract text merges under the operator's approve-once ruling (project instructions,
    2026-11-03; repo contract PLAN-coordinator-approve-once), since it is sidecar-bound and step 5 verifies it. The two
    retirements are a Decision 235 always-ask action the ruling does not name, so the PR merges on code review PROCEED +
    green CI only if the handoff cites, by message id, the operator's planning-thread approval that explicitly lets
    the build merge them (their mechanical binding is step 1's R100-only check and validate_scope_boundary's LOCATION
    invariant, which refuses any other record moving). Without that citation, hold the merge for the operator's word
    on the final diff. The handoff also records the sidecar path, the approved digest (e4618d60) and the plan merge
    commit, and the sidecar carries no commit after that merge; step 6's --pre runs validate_merge_step.
  - After merge, run steps 8-9 and report the merge SHA, the main-validate run id and its summary line.
  - 'Report: what was implemented, verification results.'
rollback: Revert the squash commit; main returns to red on the two records until another route lands.
