schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: retire-ci-only-red-records
intent: >-
  Return main to green after PR #1836 by retiring the two graduated records that are red only on the CI runner, so the
  Decision 244 standing re-run guards real regressions instead of the runner's environment.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-retire-ci-only-red-records.yaml
phase: >-
  Red-main repair (Decision 226 Track B) of the ci_rca rec rec-4888; no tier_item criterion is closed. Soft-warn
  exception category ci_rca, so the Tier Item Freshness Gate is skipped.
scope:
  - file: config/agent/verification_registry/entries/data-pipeline-excludes-control-module.yaml
    action: Delete
    purpose: Retired by git mv into entries/deprecated/ (100% rename, content untouched); Decision 244 cl.5 with operator approval (Decision 235 cl.1).
  - file: config/agent/verification_registry/entries/deprecated/data-pipeline-excludes-control-module.yaml
    action: Create
    purpose: The git mv destination of the retired record, byte-identical content.
  - file: config/agent/verification_registry/entries/push-context-session-branch-guard.yaml
    action: Delete
    purpose: Retired by git mv into entries/deprecated/ (100% rename, content untouched); Decision 244 cl.5 with operator approval (Decision 235 cl.1).
  - file: config/agent/verification_registry/entries/deprecated/push-context-session-branch-guard.yaml
    action: Create
    purpose: The git mv destination of the retired record, byte-identical content.
  - file: docs/contracts/verification-registry.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar (docs/plans/approved/retire-ci-only-red-records.yaml blocks registry-retirement-note and
      amendment-log-compaction): the retirement governance note, its semantic_break false amendment_log row, and the
      flow-style compaction of the 2026-10-15 and 2026-10-11 rows (values unchanged) that keeps the file under the
      Decision 166 500-effective-line contracts limit.
  - file: tests/verification_graduation/test_retired_ci_only_red_records.py
    action: Create
    purpose: >-
      Regression test that fails without the change: neither id is a live record, each sits in entries/deprecated/
      under its own check_id, and the contract's governance note and amendment row record the retirement.
  - file: docs/plans/approved/retire-ci-only-red-records.yaml
    action: Create
    purpose: The operator-approved sidecar binding every always-ask word of this plan; delivered by the plan PR, so the build PR does not touch it.
bundled_recommendations: [rec-4888]
followon_recs: [rec-4889]
infrastructure_dependencies: []
acceptance_criteria:
  - data-pipeline-excludes-control-module and push-context-session-branch-guard are no longer live records and sit byte-identical in entries/deprecated/.
  - No live surface outside entries/deprecated/, the contract, the new test and docs/plans/ names either id.
  - verification-registry.yaml carries exactly the sidecar's governance note, amendment row and compaction (approved digest e4618d60), and stays within its structural-size limit.
  - Step 3's two retained nodes pass, so the standing claims stay asserted (push-context hermetically; the data-pipeline exclude row while data-pipeline excludes ducklake_scd2_schema.py); the data-pipeline deploy-trigger half is recorded as one-time evidence (Decision 244 cl.4).
  - The full tier is green locally, and the first post-merge main-validate run is green with validate_graduated_rerun failing nothing.
  - rec-4888 closes through its Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      STALE-REFERENCE SWEEP (Closure Obligation, surface-retiring): both records leave entries/ by a 100% rename into
      entries/deprecated/, and no tracked file anywhere in the tree names either id outside the retired files, the
      contract and the new test. docs/plans/ is excluded: resolved plans'
      historical steps are never edited (the governance note's DECLARED RESIDUAL).
    command: >-
      E=config/agent/verification_registry/entries; R=$(git diff -M --name-status origin/main -- $E);
      for id in data-pipeline-excludes-control-module push-context-session-branch-guard; do
      test -f $E/deprecated/$id.yaml && test ! -e $E/$id.yaml && printf '%s\n' "$R" | grep -qxF "$(printf 'R100\t%s\t%s' $E/$id.yaml $E/deprecated/$id.yaml)" || exit 1;
      ! git grep -l -e "$id" -- . ':!docs/plans/' ":!$E/deprecated/" ':!docs/contracts/verification-registry.yaml'
      ':!tests/verification_graduation/test_retired_ci_only_red_records.py' || exit 1;
      done && echo CI_ONLY_RED_RECORDS_RETIRED
    expected: Exit 0 and the marker line.
    fix_if: A rename is not R100 (content edited) or a live surface names a retired id -- restore the content, or reword the surface; never edit a resolved plan.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-time retirement sweep over this diff, base-relative to origin/main; once merged the deprecated subtree is
      loader-excluded and step 2's test carries the durable claim.
    expected_literals: []
  - step: 2
    phase: pre-deploy
    action: The new regression test fails before the change and passes after it.
    command: bin/venv-python -m pytest tests/verification_graduation/test_retired_ci_only_red_records.py -q
    expected: Exit 0. Red before (the file does not exist on origin/main; with the test present and the records still live, its live-ids assertion fails).
    fix_if: A test fails -- fix the retirement or the contract text to match the sidecar; never loosen the test.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The test suite runs this file on every PR that affects it and on every main full tier; a test_selector registry
      row would add only standing node-id resolution, which matters for a pin other plans rely on, and nothing relies
      on this one.
    expected_literals: []
  - step: 3
    phase: pre-deploy
    action: >-
      The claims the retired records carried are still asserted by the two retained tests the governance note names:
      the hermetic session-branch push-context test and the control-module exclude membership test.
    command: >-
      bin/venv-python -m pytest -q
      "tests/checks/_common/test_push_context_base.py::TestPushContextBase::test_session_branch_false_positive_regression"
      "tests/lambda_manifest/test_bundle_checks.py::test_new_ducklake_modules_track_scd2_schema_membership"
    expected: Exit 0, 2 passed.
    fix_if: Either node fails or no longer resolves -- stop and report to the owning planning thread; the governance note's no-claim-dropped sentence would be false.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Both nodes already run in the suite; the second is already graduated as control-modules-track-scd2-membership,
      and a new record pinning the first would be refused by run_differential as tautological (it passes on
      origin/main).
    expected_literals: []
  - step: 4
    phase: pre-deploy
    action: >-
      Partial CI-parity re-run: evaluate every live record at HEAD with ripgrep masked on PATH (a stub that exits 127,
      as on the runner) and GITHUB_EVENT_NAME=push (as on main-validate); the red set equals known_red.yaml exactly.
      It models only those two runner differences (not branch main with origin/main equal to HEAD, the runner's
      credentials or its venv-less interpreter), so step 8 is the authoritative proof.
    command: >-
      D=$(mktemp -d); printf '#!/bin/sh\nexit 127\n' > "$D/rg"; chmod +x "$D/rg";
      PATH="$D:$PATH" GITHUB_EVENT_NAME=push bin/venv-python -c "from pathlib import Path; import yaml;
      from scripts.checks.verification import validate_graduated_rerun as g;
      lst={e['check_id'] for e in yaml.safe_load(open('config/agent/verification_registry/known_red.yaml'))['entries']};
      red=g.red_records(Path('.')); assert red==lst, sorted(red ^ lst); print('CI_PARITY_RED_SET_EQUALS_LIST', len(lst))";
      rc=$?; rm -rf "$D"; exit $rc
    expected: 'Exit 0 and CI_PARITY_RED_SET_EQUALS_LIST with the list count. UNPROVEN hypothesis, not measured at planning: CI run 41729004349 failed exactly the two retired ids and no listed id, so equality is expected; a mismatch halts the build and is reported to the owning planning thread, since it is not a defect the build can fix. A full RUN pass takes several minutes: run it backgrounded, not in the 10-minute foreground.'
    fix_if: >-
      A record outside the list is red here -- stop and report it to the owning planning thread with its detail
      line (it may be another CI-only red, whose retirement needs operator approval, or a local-only red that step 8
      will not see). A listed record passes -- report it to rec-4871's owner. Never edit known_red.yaml in this build.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-registry, environment-shaped one-time evidence for this build; validate_graduated_rerun on main-validate is the standing guard.
  - step: 5
    phase: pre-deploy
    action: The governed text matches the operator-approved sidecar word for word.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug retire-ci-only-red-records --base origin/main --expect e4618d6085541820ded46d538c67b5f90c9056afb823f2355e1d66731071f44a
    expected: Exit 0.
    fix_if: Any bound file differs from the sidecar beyond a filled {{DATE}} -- stop and ask; never re-derive the sidecar.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Base-relative to origin/main; vacuous after merge, when origin/main holds the bound text.
  - step: 6
    phase: pre-deploy
    action: Fast tier, including the registry differential (no added or modified live record), structural-size and contract checks.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: A failure names the contract's size -- the sidecar's compaction is the approved relief; any other relief needs the sidecar amended through the owning planning thread.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard); the tier itself is the standing guard.
  - step: 7
    phase: pre-deploy
    action: Full tier before handoff (Decision 163), backgrounded with a 2 h limit, read by its verdict file.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verdict check exits 0 for HEAD.
    fix_if: validate_graduated_rerun fails locally -- compare with step 4 and report to the owning planning thread; never list a record.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard); the full tier on main is the standing guard.
  - step: 8
    phase: post-deploy
    action: The first main-validate run on the merge commit is green with the re-run enforcing.
    command: >-
      mcp__github__actions_list(method=list_workflow_runs, owner=otl-labs, repo=ontheloop, resource_id=ci.yml,
      workflow_runs_filter={branch: main, event: push}) and pick the run whose head_sha is the squash-merge SHA, then
      mcp__github__get_job_logs(owner=otl-labs, repo=ontheloop, job_id=<its main-validate job>, return_content=true); find the "=== Graduated record re-run ===" header and its summary line
      "<N> graduated_records examined, <R> red (<L> listed), <S> load-sensitive" (it prints before the pytest output,
      so pass a tail_lines large enough to reach it, or read the Validation Summary).
    expected: >-
      main-validate conclusion success and its Validation Summary carries no GATE-FAILURE line for
      validate_graduated_rerun (a green run already implies R equals L: the check fails on an unlisted red and on a
      listed pass).
    fix_if: Another record is red only on the runner -- route it as red main (Decision 226) to a planning thread; never list it.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: Bundled rec closed by the Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4888']); s={x['id']:x['status'] for x in r};
      assert s.get('rec-4888')=='closed' and not m, (s,m); print('CLOSED', s)"
    expected: rec-4888 closed.
    fix_if: Read the ci.yml closure job's verdict; never close by hand without it.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: docs/contracts/verification-registry.yaml
    behavior: The governance note, the amendment row and the compacted rows match the operator-approved sidecar word for word.
    verification_step: 5
    command: approved_text verify --slug retire-ci-only-red-records
    waiver_reason: Governance prose with no behaviour; step 5 binds every word to the approved digest, and step 6's structural-size and contract checks cover the file's shape.
  - source: config/agent/verification_registry/entries/data-pipeline-excludes-control-module.yaml
    behavior: The record is no longer returned by the live loader.
    verification_step: 2
    test_selector: tests/verification_graduation/test_retired_ci_only_red_records.py
    red_green_expectation: Red before (the loader returns the id). Green after.
  - source: config/agent/verification_registry/entries/push-context-session-branch-guard.yaml
    behavior: The record is no longer returned by the live loader.
    verification_step: 2
    test_selector: tests/verification_graduation/test_retired_ci_only_red_records.py
    red_green_expectation: Red before (the loader returns the id). Green after.
  - source: config/agent/verification_registry/entries/deprecated/data-pipeline-excludes-control-module.yaml
    behavior: Byte-identical retired record in the loader-excluded subtree.
    verification_step: 1
    command: CI_ONLY_RED_RECORDS_RETIRED
    waiver_reason: A moved, unchanged record carries no behaviour; step 1 asserts the 100% rename.
  - source: config/agent/verification_registry/entries/deprecated/push-context-session-branch-guard.yaml
    behavior: Byte-identical retired record in the loader-excluded subtree.
    verification_step: 1
    command: CI_ONLY_RED_RECORDS_RETIRED
    waiver_reason: A moved, unchanged record carries no behaviour; step 1 asserts the 100% rename.
constraints:
  - IMPLEMENTATION only (Decision 67 STRATEGIC freeze).
  - 'Red-main route (Decision 226): forward fix; no revert, no inline workaround, and never an addition to known_red.yaml (Decision 244 cl.2 and cl.5; validate_known_red_shrinks refuses it).'
  - Never edit a retired record's content or a resolved plan; never install ripgrep in CI (vp-red-before.yaml rg_portability_lint).
  - Contract text is exactly the sidecar; nothing is loosened to obtain green (Decisions 181, 235).
  - No edit to validate_graduated_rerun, the differential gate, known_red.yaml or any other record (rec-4889 and rec-3286 own those).
context:
  - "Decision-scout r1 FLAGS_FOUND. Decisions triaged: 197 of 197. Roadmap items intersected: 1; CONFLICT: 0; RELATED: 1. CITE 244, 235, 176, 226, 163, 201. WARN 226 cl.5 (Track B needs a class-level preventive): filed rec-4889 (refuse rg-dependent and live-checkout-dependent registry commands; CI-parity local re-run). NOTE 181 (acceptance edit in a red repair): rec-4888's acceptance, which asked to list both ids and so can never be met, was repointed through the portal to the retirement; the operator's approval card names it. SPIRIT 244: the data-pipeline workflow-trigger half is recorded in the note as one-time evidence, and the exclude row's scd2 condition is stated."
  - Failing run 41729004349 (main-validate, merge 816be583 of PR 1836), corroborated by run 41739762537 at 6425ff09 (exactly the two ids red, no listed id passing); CI-RCA rec rec-4888 (Critical, filed 2026-11-03T23:08Z, 4 h SLO). PR 1847's three new records were unmeasured on the runner at planning; steps 4 and 8 halt and route on a third red.
  - "Measured on main a1634813: run_differential rejects both claim-preserving repairs (rg to grep; repoint push-context to its unit test) as tautological, so in-place repair is unavailable until rec-3286. A trial retirement on main passed --pre."
  - The CI runner has no rg. main-validate checks out branch main with origin/main equal to HEAD; the push-context record pops GITHUB_EVENT_NAME itself, so its failure there is the branch-main and merge-base conjunct alone (scripts/checks/_common.py push_context_base). Step 4's GITHUB_EVENT_NAME=push models other records, not this one.
  - "Operator approval precondition: this plan merges only after the operator's Decision 235 cl.1 approval of the two retirements and of the sidecar wording in the planning thread; the approval itself is recorded in the handoff, never in the repository."
  - "Related-work: red_overlap verdict clear on 2026-11-03 (rec-4888 repairs_this_red; rec-4872 track_a_in_slo, no shared file). rec-4871 (known-red triage) is untouched: neither id is on the list."
  - "Size: plan_obligations reports verification-registry.yaml NEAR_CAP (492 of 500 on main, 491 after the sidecar, headroom 9); the sidecar's compaction block is the relief, measured by the wording check."
  - "Merge-overlap gate (PR 1839): if main changes verification-registry.yaml before merge, merge origin/main in (the handoff hook allows only a non-force push) and re-run step 5."
  - 'Owner of this plan: the planning thread "Fix red main from graduated re-run". Build defects route there.'
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
  - {gate: wording-check, round: 1, verdict: FAIL, digest: 4419efd9381e73595abd2bd006e271ee2c680bebcd0da82bdd00152c109d7525, base: 7042ba3a8d63c62ecc781464734b180a976be51e, selection: complete}  # pragma: allowlist secret
  - {gate: wording-check, round: 2, verdict: PASS, digest: e4618d6085541820ded46d538c67b5f90c9056afb823f2355e1d66731071f44a, base: 7042ba3a8d63c62ecc781464734b180a976be51e, selection: complete}  # pragma: allowlist secret
  - {gate: plan-critique, round: 1, verdict: REVISE, blocking: 1, nits: 6}
  - {gate: plan-critique, round: 2, verdict: REVISE, blocking: 1, nits: 6}
