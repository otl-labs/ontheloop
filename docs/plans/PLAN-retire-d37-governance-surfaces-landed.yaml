acceptance_criteria:
  - d37-governance-surfaces-landed is no longer a live record and sits byte-identical in entries/deprecated/ (rec-5621's acceptance).
  - No live surface outside entries/deprecated/, the new test and docs/plans/ names the id.
  - The retained guards for legs 1 and 6 still pass (VP 3), so those claims stay asserted.
  - The full tier is green locally, and the first post-merge main-validate run is green with validate_graduated_rerun failing nothing.
  - rec-5621 closes through its Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      STALE-REFERENCE SWEEP (Closure Obligation, surface-retiring): the record leaves entries/ by a 100% rename into
      entries/deprecated/, and no tracked file names the id outside the retired file, the new test and docs/plans/
      (resolved plans' historical steps are never edited).
    command: >-
      E=config/agent/verification_registry/entries; id=d37-governance-surfaces-landed;
      R=$(git diff -M --name-status origin/main -- $E);
      test -f $E/deprecated/$id.yaml && test ! -e $E/$id.yaml
      && printf '%s\n' "$R" | grep -qxF "$(printf 'R100\t%s\t%s' $E/$id.yaml $E/deprecated/$id.yaml)"
      && ! git grep -l -e "$id" -- . ':!docs/plans/' ":!$E/deprecated/"
      ':!tests/verification_graduation/test_retired_d37_governance_surfaces_landed.py'
      && echo D37_RECORD_RETIRED
    expected: Exit 0 and the marker line.
    fix_if: The rename is not R100 (content edited) or a live surface names the id -- restore the content, or reword the surface; never edit a resolved plan.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-time retirement sweep over this diff, base-relative to origin/main; once merged the deprecated subtree is
      loader-excluded and step 2's test carries the durable claim.
    expected_literals: []
  - step: 2
    phase: pre-deploy
    action: The new regression test fails before the change and passes after it.
    command: >-
      bin/venv-python -m pytest -q
      "tests/verification_graduation/test_retired_d37_governance_surfaces_landed.py::test_retired_id_is_not_a_live_record"
      "tests/verification_graduation/test_retired_d37_governance_surfaces_landed.py::test_retired_record_sits_in_deprecated_under_its_own_id"
    expected: Exit 0, 2 passed. Red before (on origin/main the record is live and entries/deprecated/ lacks it).
    fix_if: A test fails -- fix the retirement; never loosen the test.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The suite runs this file on every PR that affects it and on every main full tier; a test_selector record would
      add only node-id resolution, and no other plan pins these nodes.
    expected_literals: []
  - step: 3
    phase: pre-deploy
    action: >-
      The retained guards for the two legs whose claims stay live still pass: leg 1's Decision 37 currency (the
      TestCurrencyProjection node) and leg 6's taxonomy row (validate_ci_rca_taxonomy, which fails on any registered
      check absent from function_to_category).
    command: >-
      bin/venv-python -m pytest -q
      "tests/test_decisions_index.py::TestCurrencyProjection::test_representative_classes_and_compacted_set_equals_status_marker_set"
      && bin/venv-python -c "from scripts.checks import registry; f=[]; registry.resolve('validate_ci_rca_taxonomy')(f);
      assert not f, f; print('TAXONOMY_GUARD_OK')"
    expected: Exit 0, 1 passed, and the marker line.
    fix_if: Either fails or the node no longer resolves -- stop and report to the owning planning thread; the leg map's retained-guard claim would be false.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Both guards already run standing: the node in the suite, validate_ci_rca_taxonomy in every fast tier; a new
      record pinning either would pass at origin/main and be refused by run_differential.
    expected_literals: []
  - step: 4
    phase: pre-deploy
    action: Fast tier, including the registry differential (no added or modified live record) and plan checks.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Any failure -- diagnose and fix on the branch; never loosen a check.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard); the tier itself is the standing guard.
  - step: 5
    phase: pre-deploy
    action: Full tier before handoff (Decision 163), backgrounded with a 2 h limit from the top-level session, read by its verdict file.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verdict check exits 0 for HEAD.
    fix_if: validate_graduated_rerun fails -- report the red record to the owning planning thread; never list it on known_red.yaml.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard); the full tier on main is the standing guard.
  - step: 6
    phase: post-deploy
    action: >-
      The main-validate run that covers the merge commit (Decision 254 cl.4; full-tier-range.yaml covering_run) is
      green with the graduated re-run enforcing.
    command: >-
      bin/venv-python -m scripts.ci.trailer_range covering --sha "$(git log -1 --format=%H origin/main --grep 'Resolves: rec-5621')"
      to resolve the covering run, then mcp__github__get_job_logs(owner=otl-labs, repo=ontheloop, job_id=<that run's
      main-validate job>, return_content=true) and read its Validation Summary.
    expected: The covering run's main-validate conclusion is success with no GATE-FAILURE line for validate_graduated_rerun.
    fix_if: >-
      No covering run yet -- wait for the next main push run; never poll in a loop. validate_graduated_rerun red --
      attribute it through Decision 254 cl.3's culprit step and route as red main (Decision 226); never list the
      record. main-validate red for an unrelated reason -- record this plan's leg as passed and route the other failure.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Bundled rec closed by the Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5621']); s={x['id']:x['status'] for x in r};
      assert s.get('rec-5621')=='closed' and not m, (s,m); print('CLOSED', s)"
    expected: rec-5621 closed.
    fix_if: Read the ci.yml closure job's verdict; never close by hand without it.
    hermetic: false
    graduation: not-applicable
