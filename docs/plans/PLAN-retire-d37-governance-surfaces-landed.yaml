  compaction can land without turning a standing guard red (Decision 235 cl.1 forbids retiring a check on the change
  that turns it red). The record is a one-time "migration landed" claim (Decision 244 cl.4); every leg is either
  already vacuous or held by a retained guard (context, leg map).
