pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- >-
  Before any edit, ask Benjamin in the build thread for VP step 5 (revoke the token on GitHub and reply "PAT
  revoked"); continue with the other steps while waiting.
- >-
  terraform/personal/prod_lambdas.tf -- delete the "GitHub PAT secret" comment block and resource
  "aws_secretsmanager_secret" "github_pat"; delete the Sid GithubPatRead statement from aws_iam_role_policy
  scheduled_agent_dispatcher and from findings_processor; delete GITHUB_PAT_SECRET_ARN from both functions'
  environment.variables. Reword the two execution-role header comments that say the role reads the GitHub PAT secret
  (scheduled-agent-dispatcher: drop "reads the GitHub PAT secret to call the GitHub Models API"; findings-processor:
  drop "reads the GitHub PAT secret"). Run terraform fmt on the file.
- >-
  Both handlers -- _get_github_pat becomes: return os.environ.get("GITHUB_PAT", "").strip(), with a one-line
  docstring saying the Lambda path has no PAT since rec-4539 (GitHub Models retired) and GITHUB_PAT is local-only.
  Remove the GITHUB_PAT_SECRET_ARN docstring entries. findings_processor_handler keeps its S3 boto3 use.
- >-
  tests/test_github_pat_retirement.py -- module docstring naming rec-4539. TestPatSurfaceRetired, with
  comments stripped before matching: (a) no terraform/personal/*.tf contains 'resource "aws_secretsmanager_secret"
  "github_pat"', 'aws_secretsmanager_secret.github_pat', 'GITHUB_PAT_SECRET_ARN' or 'agent-platform-github-pat';
  (b) neither aws_iam_role_policy scheduled_agent_dispatcher nor findings_processor has a statement naming a
  secretsmanager action; (c) the control: both policies keep their S3 statements unchanged (the Sids other than
  GithubPatRead are present); (d) docs/contracts/secret-material-handling.yaml's patterns.domains has no entry
  mentioning the GitHub PAT, and docs/contracts/inference-provider.yaml's secrets_manager list has no
  agent-platform-github-pat entry (parse the YAML; red cases on synthetic YAML). Red cases on synthetic HCL for (a),
  (b) and (c). TestHandlersIgnoreSecretArn, for each handler module: GITHUB_PAT unset,
  GITHUB_PAT_SECRET_ARN set to a placeholder, boto3.client patched with a MagicMock; _get_github_pat() == "" and the
  mock was not called; and with GITHUB_PAT set it returns that value. Reuse tests/fixtures/terraform_hcl_blocks.py
  helpers where they fit; no cross-test imports.
- >-
  tests/data/handlers/scheduled_agent_handler/test_helpers.py -- rewrite test_fetches_from_secrets_manager_when_arn_set
  as test_ignores_secret_arn_and_never_calls_secrets_manager and test_returns_empty_on_secrets_manager_failure as
  test_returns_empty_with_only_secret_arn_set, asserting "" and boto3.client not called. Create the step 1 registry
  entry.
- |-
  docs/contracts/secret-material-handling.yaml -- delete the domains line
      - "GitHub PAT -- terraform/personal/prod_lambdas.tf (T2.43)"
  and prepend to amendment_log:
    - date: "<implementation date>"
      semantic_break: false
      change_class: accepted_values_narrow
      summary: >-
        PLAN-retire-github-pat-secret (rec-4539): the GitHub PAT domain is removed; agent-platform-github-pat is
        deleted by this plan's gated apply (30-day recovery window), not moved, because its GitHub Models API was retired on 2026-07-30. Patterns and value_exceptions
        are unchanged.
- |-
