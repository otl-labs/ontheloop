  disposition: planned-change
  cite: "acceptance_criteria[0]"
- candidate: "[test-removed] tests/data/handlers/scheduled_agent_handler/test_helpers.py::TestGetGithubPat::test_returns_empty_on_secrets_manager_failure"
  disposition: planned-change
  cite: "acceptance_criteria[0]"
constraints:
- >-
  Always-ask, each needing Benjamin's own typed word in the build thread: the IAM changes (merge), the governed
  prod-Lambda deploy the merge fires (merge), the tf-gated-apply approval (his, in GitHub), the token revocation (VP
  step 5), and rec-2692's closure. The merge happens only when code review is PROCEED, CI is green on the head, VP
  step 5 is recorded and he has typed the word naming this PR.
- "No apply or deploy by an agent: CI applies terraform/personal and deploy-prod-lambdas.yml deploys the code (Decision 125/126). Never build_lambda --deploy."
- "Never read the PAT's value, not even to identify the token; GitHub's token list is enough."
- "terraform/bootstrap is out of scope (admin-only apply); its PAT grants are rec-4626, which also takes the iam-simulate-fixture p0-6-update-secret-enumerated row and the 'exactly five' enumerated-secret comments (bootstrap SecretsManagerUpdateEnumerated, scripts/checks/iam_tf/_write_coverage.py)."
- "Public repo (Decision 101): no account id or ARN in any file, comment or evidence."
- "Identity calls stay off the eu-west-2 STS host; ENVIRONMENT CHECKs use scripts.aws_identity caller-arn (Plan A, #1640)."
- No rescue agents or workaround loops (Decision 55).
