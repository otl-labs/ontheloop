schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: retire-github-pat-secret
intent: >-
  Plan 0 of five in the credential-proxy workstream's plan D (Secrets Manager to SSM). Delete the GitHub Models PAT
  secret instead of moving it: its API was retired on 2026-07-30 and nothing has read it since 2026-07-14 (rec-4539).
  The two Lambda roles lose their grant on it and both functions lose the env var. One less credential to copy in
  plan D. The planner's PAT read is already gone: plan N1 (neon-key-out-of-pr-plans, rec-4616) deletes it.
implementation_declared: false
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-retire-github-pat-secret.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): rec-4539. No tier_item criterion claimed; no roadmap exit criterion
  closes. First of plan D's five plans (this plan, then secrets-to-ssm-grants, -expand, -cutover and -retire).
scope:
- file: terraform/personal/prod_lambdas.tf
  action: Modify
  purpose: >-
    Delete resource "aws_secretsmanager_secret" "github_pat" and the comment block directly above it; delete the
    GithubPatRead statement from both execution-role policies (scheduled_agent_dispatcher, findings_processor);
    delete the GITHUB_PAT_SECRET_ARN entry from both functions' environment variables (re-align the remaining
    entries for terraform fmt). Every other resource stays byte-identical.
- file: src/data/handlers/scheduled_agent_handler.py
  action: Modify
  purpose: >-
    _get_github_pat returns the GITHUB_PAT env var or "" and never touches Secrets Manager (the boto3 import and the
    GITHUB_PAT_SECRET_ARN branch go); module docstring drops the GITHUB_PAT_SECRET_ARN entry and names GITHUB_PAT as
    the local-only source. The github-models provider path is otherwise unchanged.
- file: src/data/handlers/findings_processor_handler.py
  action: Modify
  purpose: >-
    Same change to its _get_github_pat (keep the "No PAT available; skipping recommendation comparison" path, so
    the deploy smoke's skipped_comparison=true stays the steady state); docstring drops GITHUB_PAT_SECRET_ARN.
- file: tests/test_github_pat_retirement.py
  action: Create
  purpose: >-
    rec-4539 guard: TestPatSurfaceRetired (pure HCL and source text predicates, red cases on synthetic
    text) and TestHandlersIgnoreSecretArn (both handlers return "" with only GITHUB_PAT_SECRET_ARN set and never
    construct a boto3 client). No network, terraform or AWS.
- file: tests/data/handlers/scheduled_agent_handler/test_helpers.py
  action: Modify
  purpose: >-
    The two TestGetGithubPat cases that assert a Secrets Manager fetch (test_fetches_from_secrets_manager_when_arn_set,
    test_returns_empty_on_secrets_manager_failure) are rewritten in place to the retired behaviour: with only the ARN
    set, the result is "" and boto3.client is not called. This removes assertions of deleted behaviour; named here so
    the human gate on verification weakening (Decision 235 cl.1) is met by this plan's approval.
- file: config/agent/verification_registry/entries/github-pat-secret-retired.yaml
  action: Create
  purpose: >-
    Graduation record for VP step 1: check_id == filename stem == graduation_check_id, primitive_slot test_selector,
    guard_target terraform/personal/prod_lambdas.tf, guard_symbol null, plan_slug retire-github-pat-secret,
    graduated_at the implementation date, graduated_by implement-agent, check_spec.node_id
    "tests/test_github_pat_retirement.py".
- file: docs/contracts/secret-material-handling.yaml
  action: Modify
  purpose: >-
    Remove the domains row "GitHub PAT -- terraform/personal/prod_lambdas.tf (T2.43)" (rec-4539 asks for this Decision
    175 domain row update) and prepend the amendment_log entry pinned in execution step 6. Nothing else changes.
- file: docs/contracts/inference-provider.yaml
  action: Modify
  purpose: >-
    Remove the agent-platform-github-pat entry (name and note lines) from the secrets_manager list and prepend the
    amendment_log entry pinned in execution step 7.
- file: docs/contracts/account-credential-inventory.yaml
  action: Modify
  purpose: >-
    Row GH-14 flips to status retired with owner_today none (the maintenance.stage_rule), one evidence_ledger entry is
    appended citing this plan and the revocation (VP step 5's message id), and the amendment_log entry pinned in
    execution step 8 is appended (Class D, validate_contract_drift). Only after VP step 5 (the token is revoked).
bundled_recommendations:
- rec-4539
followon_recs:
- rec-4626
infrastructure_dependencies:
- >-
  terraform/personal at merge through terraform-apply-sandbox.yml: destroy aws_secretsmanager_secret.github_pat
  (recovery window 30 days, the provider default; Decision 157 residual (b) forbids force-delete), in-place updates
  of aws_iam_role_policy.scheduled_agent_dispatcher and aws_iam_role_policy.findings_processor, and of both
  aws_lambda_function environments. The destroy makes the guard
  ROUTE the whole plan to the tf-gated-apply Environment (Decision 77/92); Benjamin approves it there.
- >-
  Code: the same merge fires .github/workflows/deploy-prod-lambdas.yml (src/data/handlers/** path), the governed
  channel for the decoupled_build_pipeline class (Decision 125/126), which builds, deploys and smoke-invokes both
  functions. Order is safe either way: old code with the env var gone logs and returns ""; new code ignores the var.
- terraform/bootstrap is not touched; its two enumerated grants on the PAT ARN go with the next bootstrap apply (rec-4626).
acceptance_criteria:
- No terraform/personal file declares the PAT secret, a grant on it or the GITHUB_PAT_SECRET_ARN env var, and neither handler reads Secrets Manager (TestPatSurfaceRetired, TestHandlersIgnoreSecretArn).
- The PAT is revoked on GitHub before merge, and after merge the secret is scheduled for deletion, both functions' environments lack GITHUB_PAT_SECRET_ARN, the governed prod-Lambda deploy and its smoke are green, and the live Lambda roles deny GetSecretValue on the PAT ARN.
- rec-4539 closes through the Resolves trailer; GH-14 is retired with a ledger entry.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The PAT surface is gone from terraform/personal and both handlers
  command: bin/venv-python -m pytest tests/test_github_pat_retirement.py -q
  expected: every test passes; before the change the file does not exist (exit 4, red)
  fix_if: >-
    a red case passes silently, or a real-tree case fails -- fix the HCL or handler to the planned shape; if a
    predicate misreads real HCL, fix the predicate without loosening what it asserts
  hermetic: true
  graduation: graduate
  graduation_check_id: github-pat-secret-retired
- step: 2
  phase: pre-deploy
  action: The existing handler suites still pass with the rewritten helper cases
  command: bin/venv-python -m pytest tests/data/handlers/scheduled_agent_handler tests/test_findings_processor_handler.py -q
  expected: all pass
  fix_if: a failure outside TestGetGithubPat -- the change reached past _get_github_pat; narrow it back
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Existing suites already run in the fast and full tiers; step 1 carries this plan's durable assertions.
- step: 3
  phase: pre-deploy
  action: Stale-reference sweep for the retired surface (it also proves N1's planner deletions are on the base)
  command: >-
    ! grep -rn -e GITHUB_PAT_SECRET_ARN -e 'aws_secretsmanager_secret.github_pat' -e 'agent-platform-github-pat'
    terraform/personal src/data/handlers
    && echo PAT_SURFACE_SWEEP_OK
  expected: prints PAT_SURFACE_SWEEP_OK
  fix_if: >-
    any hit -- remove it. The two contracts are outside the sweep paths because their pinned amendment_log entries name
    the deleted secret; TestPatSurfaceRetired (d) asserts both removals on the parsed YAML
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Grep sweep restating step 1's graduated assertions over terraform/personal and both handlers (TestPatSurfaceRetired also covers both contract files on parsed YAML).
- step: 4
  phase: pre-deploy
  action: Provider-free formatting check on the touched root (Decision 119; init/validate/plan are CI-delegated)
  command: terraform fmt -check terraform/personal
  expected: exit 0
  fix_if: run terraform fmt on prod_lambdas.tf only
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The required terraform-validate CI job already enforces fmt on terraform/personal; a registry row would duplicate it.
- step: 5
  phase: pre-deploy
  action: HUMAN -- Benjamin revokes the GitHub Models token on GitHub before merge (rec-4539 says revocation is an operator console step)
  command: >-
    echo 'HUMAN: in GitHub settings (Applications / tokens) revoke the token stored in agent-platform-github-pat, then
    reply in the build thread "PAT revoked". It is an OAuth gho_ token: GitHub lists authorized OAuth apps, not single
    tokens, so revoking means revoking that app, which also ends every other token the app holds for the account (for
    example a GitHub CLI login). Benjamin decides which app it is before revoking'
  expected: Benjamin's own message "PAT revoked" in the build thread, recorded by message id in the PR body
  fix_if: no reply -- the PR stays unmerged; never read the secret value to find the token
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: The speculative plan on the PR shows exactly the planned changes and the guard routes it
  command: >-
    echo 'VIA MCP: mcp__github__pull_request_read(method="get_comments", owner="otl-labs", repo="ontheloop",
    pullNumber=<this PR>) -- read the "Terraform Speculative Plan" comment for the PR head sha'
  expected: >-
    1 to destroy (aws_secretsmanager_secret.github_pat) and 5 to change in place (the two Lambda execution-role
    policies, the two aws_lambda_function environments, and aws_iam_role_policy.github_ci_branch, whose data.aws_iam_policy_document.github_ci_branch is read during apply because it references the ARNs of Lambdas with pending changes, so the comment shows the whole document removed and re-added as (known after apply)), nothing to add;
    the deferred read's statement blocks, as the comment prints them, are the same Sids, actions and resources as the
    policy's current statements (no ProdLambdaInvokeCI ARN changes, since only the two functions' environments change);
    "Predicted guard verdict: BLOCKED" (guard exit 2: the destroy routes the plan to tf-gated-apply). This comment is
    what Benjamin approves before merge.
  fix_if: >-
    any other resource change, a deferred-read statement that differs from the current policy, or the verdict is
    ERROR -- stop and return to the planner; never merge
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: ENVIRONMENT CHECK before the live reads -- describe-secret, get-function-configuration and simulate-principal-policy need the ADMIN chain
  command: >-
    bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
    'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
  expected: ADMIN_CHAIN_OK in this project's ADMIN environment
  fix_if: ADMIN_CHAIN_ABSENT -- hand step 8 to an ADMIN session through the coordinator; never substitute a weaker check
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: Applied -- the gated apply is green, the secret is scheduled for deletion, the env var is gone and neither Lambda role can read it
  command: |-  # pragma: allowlist secret
    bin/venv-python -c "import boto3; s=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); sm=s.client('secretsmanager'); lam=s.client('lambda'); iam=s.client('iam'); sec=sm.describe_secret(SecretId='agent-platform-github-pat'); deleted=sec.get('DeletedDate') is not None; envs=tuple('GITHUB_PAT_SECRET_ARN' in lam.get_function_configuration(FunctionName=f).get('Environment',{}).get('Variables',{}) for f in ('agent-platform-scheduled-agent-dispatcher','agent-platform-findings-processor')); d=lambda role: iam.simulate_principal_policy(PolicySourceArn=iam.get_role(RoleName=role)['Role']['Arn'], ActionNames=['secretsmanager:GetSecretValue'], ResourceArns=[sec['ARN']])['EvaluationResults'][0]['EvalDecision']; sim=tuple(d(f) for f in ('agent-platform-scheduled-agent-dispatcher','agent-platform-findings-processor')); got=(deleted, envs, sim); print('LIVE', got); assert got==(True, (False, False), ('implicitDeny','implicitDeny')), got; print('PAT_RETIRED_LIVE_OK')"
  expected: >-
    The tf-gated-apply run for the merge commit is green (mcp__github__actions_list / actions_get), then LIVE (True,
    (False, False), ('implicitDeny', 'implicitDeny')) and PAT_RETIRED_LIVE_OK. The role names equal the function names
    (prod_lambdas.tf locals). The simulated resource is the secret's real ARN from describe_secret (it still answers
    while deletion is scheduled), because both role policies name that exact suffixed ARN and a made-up suffix would
    deny before the change too. No STS call. Read-only admin calls. Post only the LIVE tuple, never an ARN or account
    id.
  fix_if: >-
    the apply is red or still pending -- follow deploy-paths.yaml's reconcile row, never a local apply; any other
    tuple -- stop and RCA (Decision 55)
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: post-deploy
  action: The governed prod-Lambda deploy for the merge commit is green, including both smoke invokes
  command: >-
    echo 'VIA MCP: mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
    resource_id="deploy-prod-lambdas.yml") -- the run for the merge commit sha, then actions_get for its jobs'
  expected: >-
    conclusion success; the log shows "OK scheduled-agent-dispatcher smoke: status=disabled" and "OK findings-processor
    smoke: skipped_comparison=true" for the merge sha
  fix_if: >-
    red -- RCA the deploy run; never a local build_lambda --deploy (break-glass only, Decision 125). Green with the
    smoke job skipped (deployed=false, a no-op because DEPLOY_ROLE_PROVISIONED is not 'true') is not a pass -- stop and
    show Benjamin
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: post-deploy
  action: The bundled rec closed through the Resolves trailer, and rec-2692's closure is proposed
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
    fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4539']); print(sorted((r['id'],
    r['status']) for r in rows))"
  expected: >-
    [('rec-4539', 'closed')] after ci.yml's closure job for the merge commit. Then present
    the propose_or_close_rec(rec-2692, 'superseded', ..., deterministic=False) output to Benjamin (its smoke assertion
    can no longer break: the functions can no longer obtain a PAT) and run it only on his word.
  fix_if: a rec still open after the closure job -- read the closure job log; never update_rec by hand without cause
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: pre-deploy
  action: Fast tier before push
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0; validate_graduation_completeness, validate_contract_drift and the iam_tf checks PASS
  fix_if: any failure -- fix on the branch
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole fast-tier run over diff-relative state; graduate steps may not invoke scripts.validate (recursion), and step 1 carries the durable regression.
- step: 12
  phase: pre-deploy
  action: Full tier, then HEAD attestation, on the committed rebased tree before push (handoff_policy)
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: the full tier exits 0 and the validation result attests the current HEAD's tree
  fix_if: any failure -- fix and rerun the full tier from the start; never push on a partial or timed-out run
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The full tier cannot graduate (recursion refusal) and depends on the whole tree at HEAD; it is the handoff gate, not a regression check.
