    gate, precommit or status", and the same text gains that from parser_version 6 the claude_code producer emits
    status:<source>.skipped (severity warning) and status:<source>.failed (severity error) from STATUS v1 lines in the
    last 200 output lines of a Bash tool_call whose command names a repo CLI (-m scripts. or scripts/), role
    gate_event.<n>, done emitting nothing, reason never stored, a source over 192 characters dropped and counted; and
    two declared residuals: an echoed or printed whole STATUS line inside such a command's output mints a row, and until the reader's friction rules gain a status row (rec-4605) r91 labels a status warning hook_fault
    and r90 a status error unmapped_block. One flow-form amendment_log entry: governance_note_add, semantic_break true and a migration_story carrying 'census: 0 violators (<build date>)', because the rule ratchet (scripts/checks/contracts/_rule_ratchet.py) treats any pattern_when params change as a narrowing and a widening has zero violators by construction; it names the new source and cl.4 (the merge deploys the writer before any producer can emit it). The file is at 497 of its 500 effective lines and
