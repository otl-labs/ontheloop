    (c.get('tags') or []) and c['status']=='open';print('RECS_OK')" && bin/venv-python -m pytest
    tests/session/test_session_cli_retired.py::test_preflight_refuses_the_retired_flags
    tests/session/test_session_cli_retired.py::test_postflight_refuses_the_retired_flags
    tests/session/test_session_cli_retired.py::test_retired_symbols_are_gone
    tests/session/test_session_cli_retired.py::test_no_command_or_skill_invokes_the_retired_cli -q
  expected: Exit 0, RECS_OK printed, and the acceptance command passes.
  fix_if: >-
    A field still carries the old text: re-run the execution step 10 update_rec call (after get_rec_write_guidance); if
    the portal refuses, read its error, never write around it.
  hermetic: false
  graduation: not-applicable
- step: 12
  phase: pre-deploy
  action: Fast tier, then the full tier on the committed, rebased, clean tree before handoff.
  command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Exit 0 on a completed full run with the head verified; a timeout is not a pass (handoff_policy).
  fix_if: Fix the named check at root cause and rerun from the start; never raise a budget, skip a check or weaken an assertion.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
- step: 13
  phase: post-deploy
  action: >-
    The governed deploy of the merge commit succeeded, each job included, and the --lambda-telemetry smoke accepted the
    status vector. Read with mcp__github__actions_list (list_workflow_runs, workflow deploy-ducklake-lambdas.yml,
    head_sha $MERGE_SHA) then list_workflow_jobs, written to $DEPLOY_JOBS_JSON; the smoke job's log
    (mcp__github__get_job_logs) to $SMOKE_LOG_FILE.
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && test -s "$SMOKE_LOG_FILE" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));jobs={x['name']:x.get('conclusion')
    for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke'];assert
    all(any(n.startswith(w) and c=='success' for n,c in jobs.items()) for w in want),jobs" && grep -qF 'LAMBDA_TELEMETRY OK'
    "$SMOKE_LOG_FILE" && echo STATUS_SOURCE_LIVE_OK
  expected: >-
    Every named job concluded success (a skipped job fails this step) and STATUS_SOURCE_LIVE_OK printed. The sibling
    plan's emitters may not merge before this passes. If the workflow's job names have changed since this plan, assert
    the same set under their current names and record them.
  fix_if: >-
    A red job means reading its log first; a refused status vector means the projection did not deploy. STOP and RCA (Decision 55), and tell the coordinator so the sibling's emitters stay held; the golden replay's skew guard holds replays until the deploy is fixed.
  hermetic: false
- step: 14
  phase: post-deploy
  action: >-
    After the squash merge carries "Resolves: rec-4589": the closure job closed rec-4589, and the
    telemetry-golden-replay run that workflow_run starts when the merge commit's deploy completes replays the v6 trees,
    the status case included, through the deployed writer and reader; its job log saved to $REPLAY_LOG and its head
    confirmed to be the merge commit.
  command: >-
    bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;s=(f('rec-4589') or
    {}).get('status');print('rec-4589',s);assert s=='closed'" && grep -E "GOLDEN_SMOKE trees=[1-9][0-9]*
    expectations=[1-9][0-9]* .*mismatches=0" "$REPLAY_LOG"
  expected: rec-4589 closed and one matching GOLDEN_SMOKE line from a run that concluded success; report it verbatim.
  fix_if: >-
    rec-4589 open: check ci.yml's closure job on the squash commit (its acceptance verdict); close through update_rec
    with the PR as evidence only if the verdict holds. A replay refusal of the status case with VP 13 red is the deploy
    failure, not a replay defect. A replay mismatch with the local harness green is an engine or transport defect: file
    it through the portal and fix forward; never relax an expectation.
  hermetic: false
- step: 15
  phase: post-deploy
  action: >-
    A session started on the merged main, whose first turn invokes a workflow skill, lands its root open row with that
    workflow: run in its second turn after turn 1's Stop pass (the coordinator starts it).
  command: >-
    T="$(ls -t ~/.claude/projects/*/*.jsonl | head -1)" && AWS_PROFILE=agent_platform bin/venv-python -m
    scripts.telemetry_capture probe --tree "$T" --require telemetry_sessions && bin/venv-python -c "import sys;from
    pathlib import Path;from src.turn_capture.transcript import FsTree;from src.turn_capture.record_turn import
    record_turn,PARSER_VERSION;rows=record_turn(FsTree(Path(sys.argv[1])),None,project_ref='synthetic:local',session_final=False).sessions;w=[r.get('workflow')
    for r in rows if r.get('event_kind')=='open' and not r.get('parent_session_ref')];print('v',PARSER_VERSION,'root_workflow',w);assert
    PARSER_VERSION==6 and w and w[0] not in ('claude_code','subagent')" "$T"
  expected: >-
    The probe's sessions rows above zero with no halt, then one line with v 6 and a root workflow other than the
    fallbacks. Counts and the workflow token only.
  fix_if: If the root reads claude_code, inspect the first turn's Skill tool_use block against WA-2; file a rec and fix forward.
  hermetic: false
