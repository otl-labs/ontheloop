    tests/turn_capture/test_record_turn.py::test_finalize_resume_schedules_emit_each_row_once
    tests/turn_capture/test_record_turn.py::test_incremental_equals_full_at_every_line_cut
    tests/turn_capture/test_record_turn.py::test_finalize_equals_virtual_prompt_at_eof
    tests/turn_capture/test_record_turn.py::test_new_cases_are_built_from_their_builders
    tests/turn_capture/test_record_turn.py::test_rows_use_only_caller_known_columns tests/telemetry/test_parser_version_registry.py::test_registry_matches_producer tests/telemetry/test_parser_version_registry.py::test_declared_signature_prefixes_match_the_corpus tests/telemetry/test_parser_version_registry.py::test_cases_match_index tests/telemetry/test_parser_version_registry.py::test_full_output_cap_agrees_with_contract -q
