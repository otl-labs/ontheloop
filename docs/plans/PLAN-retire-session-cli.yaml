    bin/venv-python -c "import glob,json;from collections import Counter;from pathlib import Path;from
    src.turn_capture.transcript import FsTree;from src.turn_capture.record_turn import
    record_turn,PARSER_VERSION;W=('orient','planning','implement','overseer','audit-prompt','plan-critique','decision-scout','code-review','executor-rca');P=glob.glob(str(Path.home()/'.claude/projects/*/*.jsonl'));c=Counter(r.get('workflow')
