  phase: pre-deploy
  action: The contract's name rule names the status source and the projection matches it exactly.
  command: >-
    bin/venv-python -m scripts.schema_to_field_semantics --check && bin/venv-python -m pytest
    tests/telemetry/test_retire_session_cli_contract_notes.py::test_observations_name_rule_accepts_the_status_source
    tests/turn_capture/test_markers.py::test_signature_pattern_equals_contract_class -q
  expected: Exit 0, every node passes and the projection check reports no drift.
  fix_if: Drift means field_semantics.yaml was hand-edited or not regenerated; regenerate it, never edit it.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-status-source-declared
- step: 2
