    All but one of its nodes are already graduated standing checks (turn-capture-golden-corpus, turn-capture-r7-incremental-equals-full, turn-capture-finalize-resume-emits-each-row-once, telemetry-parser-version-registry, parser-v3-declared-prefixes-match-corpus, telemetry-parser-cap-agreement); test_new_cases_are_built_from_their_builders is a corpus-authoring consistency node whose v6 change is only the new builders' registration; their red state comes from the
