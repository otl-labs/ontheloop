execution_steps:
- >-
  1. Precondition: Benjamin's word that the freeze is over. Rebase onto main. Confirm PARSER_VERSION is still 5 and the
  golden index lists 47 cases; if another parser bump or golden change landed, or the sibling plan's build merged
  first, STOP and tell the coordinator before writing code.
- >-
  2. Status source: edit telemetry_observations.yaml's name rule (scope row), regenerate field_semantics.yaml, add the
  append vector and its test; run VP 1 and VP 2.
- >-
  3. Retirement: delete the functions, flags, constants, command-doc steps and no-op tests (scope rows); add the
  tombstone module; add tests/fixtures/retired_session_cli.py and point the tombstone and both decomposition tests at it; keep `import subprocess` in preflight.py
  with noqa; run VP 4.
- >-
  4. Contracts and Decision text: session-id.yaml (fields and the joins comment), _joins.yaml, telemetry_sessions.yaml, the status-rows sentence and residuals in
  telemetry_observations.yaml, ports.yaml SA-02, the Decision 199 Update line, each with its amendment_log entry dated
  the build day. telemetry_observations.yaml ends at or under 498 effective lines (room the sibling plan's realization
  block needs): compact the name field's block-form 2026-09-24 amendment_log entry to the one-line flow form, wording
  unchanged. Size relief order if a contract would exceed 500 effective lines: new amendment_log entries in the
  one-line flow form; notes extend existing lines (never past 2,000 characters); then compact remaining block-form
  amendment_log entries of that file to the one-line form (the git-ops.yaml precedent, #1535); wording never changes.
- >-
  5. Markers (rule ST-1, markers.py): a STATUS marker is a whole normalised line equal to
