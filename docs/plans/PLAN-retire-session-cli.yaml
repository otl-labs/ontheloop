    bin/venv-python -c "import re,yaml;j=yaml.safe_load(open('docs/contracts/_joins.yaml'))['joins']['planning_session_id_join_execution_plans_to_sessions']['description'];assert not re.search('legacy|live UUID4',j),j;assert not any('legacy-producer migration' in l for l in open('docs/contracts/session-id.yaml'));f=yaml.safe_load(open('docs/contracts/session-id.yaml'))['fields']['session_id'];t=' '.join(str(f.get(k))
    for k in ('semantics','populated_by','governance_notes'));assert 'open_telemetry_session' not in t and 'live-producer' not in t, t;print('SWEEP_CLEAN')"
  expected: Exit 0 and SWEEP_CLEAN printed.
