constraints:
- >-
  Freeze (Benjamin, 2026-10-20 and 2026-10-24): no build, push, PR or merge until he lifts the transfer freeze. This
  plan's own PR merges under the plan merge gate once the freeze lifts.
- >-
  Retire, never re-wire (rec-4589 FINDINGS section 4, decided with notice): no state file, no session id, no
  self-reported outcome or diff counts anywhere. Outcome and duration stay transcript-derived (C9, Decision 228).
- >-
  Purity (envelope R7, Decision 207): the open row's workflow reads only records at or before the open bound and never
  a tool_result, so any pass that emits it emits the same content. A row built differently by two passes is a defect,
  never a test to relax.
- >-
  Typed columns only (Benjamin, 2026-10-17): no new column and no new metadata key. Status rows carry name and
  severity; reason is never stored.
- >-
  Release order (Decision 210 cl.4): no repository file holds a whole-line skipped or failed STATUS v1 literal; tests
  and fixtures build those lines at run time (format_status_marker, or JSON whose line breaks are escaped), so no
  command output before this plan's deploy can carry one. The sibling's emitters merge only after VP 13 passes.
- >-
  Tests assert on built STATUS lines by value and never print, log or echo one (pytest's captured-output section prints at column 0), so the build session's own v6 capture of a scripts.validate run cannot send a status row to the not-yet-deployed writer.
- >-
  Graduated checks (turn-capture-*, telemetry-parser-version-registry) keep resolving and are never weakened; the only
  assertion changes are the sanctioned ones in scope, and the only deleted tests are the retirement rows. Any further weakening candidate the PR surfaces is recorded in this plan's weakening_dispositions (validate_weakening_dispositions reads only those; the PR body lists it) or the change is reworked. The shrunk FROZEN_EXPORTS parametrize cases are named in the PR body (the candidate surfacer keys on functions, not parametrize ids).
- >-
  No file crosses 500 SLOC, tests included (Decision 128/130); contracts stay under 500 effective lines by relief,
  never a raise or split (Decision 166); telemetry_observations.yaml ends at or under 498.
- >-
  Public repository (Decision 101): fixtures synthetic; integration and probe steps print counts and workflow tokens only.
- No rescue agents or workaround loops (Decision 55); a failed live step stops for RCA.
