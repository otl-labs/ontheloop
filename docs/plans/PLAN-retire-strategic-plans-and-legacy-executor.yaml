schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "retire-strategic-plans-and-legacy-executor"
intent: >-
  Retire the legacy single-process Python executor and the STRATEGIC plan type for good through one new Decision
  that supersedes Decision 67 and disposes of CD.17, and record their replacement: an item too large for one plan is
  decomposed by its planner into child work items that ride the parent's approval only through a deterministic
  check, with deeper or wider splits going to triage (operator rulings 2026-10-19 and 2026-11-02, rec-4478). Every
  instruction surface stops describing a temporary freeze, so agents plan against the system as it is.
plan_type: IMPLEMENTATION
verification_tier: V2
tier_waiver: >-
  V2 retained despite one active-manifest Lambda-bundled asset in scope (docs/ROADMAP-PLATFORM.yaml, a packaged asset of
  data-pipeline): the edit is roadmap bookkeeping with no packaged code change; see the LAMBDA-DEPLOY DEFERRED context line.
plan_path: docs/plans/PLAN-retire-strategic-plans-and-legacy-executor.yaml
phase: >-
  ad_hoc_rec (soft-warn category; rec-4478, no tier_item claimed, so the Tier Item Freshness Gate is skipped). Adds
  forward-intent criteria to T4.31 and T4.4 and drops T5.6's depends_on T4.2; closes no criterion.
closes_criteria: []
implementation_declared: false
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the sidecar: the new Decision (heading number {{N}}, renumbered at merge by scripts.session.rebase_resolve
      if taken; under the 6,144-byte entry cap), Decision 67 compacted in place to the Decision 149 stub (header line
      unchanged; Superseded by the new Decision), and one dated "> **Amended by Decision {{N}} ({{DATE}}):**" note each
      on Decisions 73, 90, 182, 203 and 229, appended after each entry's last line, never inside a body.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Roadmap data, not sidecar-bound: CD.17 state pending -> superseded and stored compact in the CD.14 shape (Decision 147
      points 1 and 4): its detail block is dropped, the narrative living in the new Decision and git history; title,
      gates [], affects and narrowly_supersedes unchanged; check_roadmap_regrowth lists no CD.17 under TERMINAL-CD; the document header bullet on strategic: true (lines 64-71) says the flag marks
      decomposition need only; the waits keyed to CD.17 reversal re-key to T4.2's completion -- T2.15 (intent lines on the
      CD.17 freeze reversal and CD.17 telemetry trust, the 'cite CD.11/CD.16/CD.17 as the live owners' sentence, criterion texts and progress_note; a re-keyed criterion that still
      reads "gated on" T4.2 converts to object form with blocked_by [{ref: T4.2, until: complete}] for
      validate_roadmap_liveness leg C -- cycle-safe, nothing depends on T2.15 or T3.19), T3.19 (intent line and progress_note), T4.2's stability criterion (c5; re-worded
      with no "CD.17" token, e.g. "the bar stands as T4.2's own; its former candidate-decision trigger is superseded,
      Decision {{N}}") and T4.2's intent (both the STRATEGIC-filing sentence and the 2026-10-19 Decision 229 annotation
      sentence "CD.17's trigger text is unchanged until rec-4478's plan disposes of it", re-worded with no "CD.17" token); new open criteria on T4.31 (met at MVP by child recs: plan_agent decomposes an
      oversized item by filing child recs, ends decomposed, starts nothing and raises the promotion event to triage; the
      kind-epic/part_of form is forward work that lands with T4.23's work-item store, with no blocked_by edge from this
      MVP criterion to deferred T4.23, so the criterion text uses none of validate_roadmap_liveness leg C's blocking
      phrases ('gated on', 'blocked by/on', 'requires ... complete', 'cannot ... until', 'before ... completes'). The same
      edit says a decomposed run is the one exception to T4.31 c2 (identifiers only) and c6 (the drafted plan is the run's
      only output): its output is the child rec ids and no plan PR. It names plan_agent's rec-filing authority through
      the portal, which Decision 205's credential-less plan_agent lacks today, as T4.31 forward work; and the planning
      skill's file-count heuristic is replaced by the measured breadth number plan_agent splits on, per the Decision 182
      note) and T4.4 (the
      five-test inheritance check as a Decision 235 cl.2 ladder lane; the same leg C phrase constraint applies, since the
      lane's build waits on deferred T3.7 and CD.46); T5.6 depends_on [T4.2] -> [] (operator fork 2 and the approved
      re-pin; plain roadmap data, because approved_text binds whole files and the roadmap's other edits are not in the
      sidecar) and stays
      deferred_post_mvp (operator, fork 2, 2026-11-02) and T5.6's progress_note reactivation trigger becomes "rec-4827 is
      picked up, or the executor code blocks a change", with a dated clause saying its intent and c2 still describe the
      T4.2 cutover and are re-worded when rec-4827 reactivates it; T4.4's progress_note gains a dated clause naming
      Decision {{N}} as the source of the new lane criterion (PLAN-coordination-model's "no criterion is added while
      this item is live" sentence stands for its own Decision; "Decision 241" stays out of T4.4's exit_criteria); each "inert under the Decision 67 / CD.17 freeze" note, say the legacy executor is retired
      (Decision {{N}}); CD.27's two lines citing the STRATEGIC suspension and the CD.17 reversal
      trigger, and CD.29's phrase "CD.17's post-reversal merge-authority clause (cross-referenced there)" re-key the
      same way (CD.29's own VF-11 unattended-merge rule sentence is kept; only the pointer phrase changes). Historical narration (freeze-override comments, "authored as atomic IMPLEMENTATION plans
      per Decision 67") stays as written.
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      PlanType drops STRATEGIC; the work_areas validator rejects any non-empty list with a message naming the new
      Decision (the field stays: 388 plans carry work_areas: []). Net SLOC falls.
  - file: tests/roadmap/plan_document/test_schema.py
    action: Modify
    purpose: >-
      New test_strategic_plan_type_refused and test_work_areas_refused_on_every_plan_type (parametrised over
      IMPLEMENTATION and REPORT-ONLY); TestPlanDocumentSchema::test_strategic_requires_work_areas and
      ::test_strategic_with_work_areas_validates are deleted; ::test_work_areas_on_implementation_fail keeps its name and
      its raises match moves to the new message; TestSchemaVersion3::test_non_implementation_forbids_policy keeps only
      its REPORT-ONLY case and loses the STRATEGIC branch. weakening_dispositions pre-lists the four predicted candidates;
      execution step 4 reconciles the list against validate_weakening_candidates' output.
  - file: tests/test_plan_obligations.py
    action: Modify
    purpose: test_non_implementation_plan_grandfathered uses REPORT-ONLY instead of the retired STRATEGIC type (housekeeping only; plan_obligations reads plain YAML, so the old fixture would still pass).
  - file: tests/test_decisions_index.py
    action: Modify
    purpose: Exactly the sidecar -- Decision 67's representative currency class becomes superseded_compacted (planned change).
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: Exactly the sidecar -- the IMPLEMENTATION Commit Flow slice runs to the end of the skill, since the STRATEGIC Commit Flow section (its old end marker) is removed.
  - file: tests/decisions/test_decision_67_supersession.py
    action: Create
    purpose: >-
      rec-4478's acceptance node test_decision_67_superseded_and_cd17_disposed: the new Decision's envelope supersedes
      [67]; Decision 67 is a compacted stub pointing at it; CD.17 state superseded with gates [] and affects unchanged
      and no detail; PlanDocument refuses STRATEGIC; T2.15's intent, criteria and progress_note, T3.19's intent and
      progress_note and T4.2's intent and stability criterion contain no "CD.17" and T3.19's intent or progress_note
      names "T4.2"; the raw roadmap text, whitespace-normalised and casefolded, contains no "inert under the decision
      67 / cd.17 freeze", no "suspended while the cd.17" and no "strategic remains suspended"; T4.2 is not in T5.6's depends_on; T4.31 and T4.4 each carry their new criterion text (matched on
      "decomposed" and "inherit" respectively; status is not asserted, so closing a criterion or reactivating T5.6
      never reddens this graduated node). Plus
      test_live_instruction_surfaces_carry_no_freeze: AGENTS.md, README.md, docs/PROJECT_CONTEXT.md, .claude/skills/**,
      .claude/commands/**, docs/contracts/*.yaml (amendment_log entries excluded) and config/agent/** (.yaml and .md;
      the historical human-decision records under config/agent/data_quality/decisions/ excluded) contain no
      "STRATEGIC plans suspended", "Decision 67 reversal", "CD.17 reversal", "CD.17 / T4.2", "(frozen, Decision 67)",
      "temporary strategic/executor freeze", "Executor frozen (Decision 67)", "executor is frozen (Decision 67)" or
      "CD.17-frozen", "frozen pending Decision 67" or "executor unfreeze" phrase (whitespace-normalised, casefolded), and no
      .claude/commands/develop-executor.md exists.
  - file: tests/instructions/__init__.py
    action: Create
    purpose: Package marker for the new test directory.
  - file: tests/instructions/test_interim_coordinator_wording.py
    action: Create
    purpose: >-
      rec-4479's acceptance node test_overseer_wording_names_interim_coordinator_runs: AGENTS.md's /overseer sentence and
      the overseer skill's guardrail say the overseer starts no planning or implementation agent of its own, the
      coordinator dispatches each as one human-gated persona step on an operator-chosen rec, never the rec queue, hub and
      spoke (Decision 229 cl.1-2 and its 2026-11-02 Update note, rec-4825); and neither text still says the overseer
      composes or dispatches subagents.
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Exactly the sidecar: the Temporary Operational Constraints STRATEGIC bullet removed; the Skills and slash commands
      paragraph names the three-command workflow, the retired /develop-executor, the two plan types and decomposition
      into child items, and the /overseer's interim-coordinator persona step (rec-4479). Net bytes fall.
  - file: README.md
    action: Modify
    purpose: Exactly the sidecar -- the Autonomous Executor status row drops "executor freeze active pending CD.17 / T4.2 reversal".
  - file: docs/PROJECT_CONTEXT.md
    action: Modify
    purpose: Exactly the sidecar -- line 118's constraints sentence drops the temporary freeze, and line 152's "frozen pending Decision 67 reversal" becomes retired (Decision {{N}}), boundary kept.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Exactly the sidecar: Complexity Assessment (decomposition, not STRATEGIC), the non-automatable preflight bullet
      (Decision 73 cl.4 permanent), template plan_type and work_areas comments, Step 10 and Confirmation Messages lose
      the STRATEGIC branch.
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Exactly the sidecar -- steps 5 and 8 lose the STRATEGIC branch (step 8's pinned IMPLEMENTATION sentence kept
