fallback_reevaluation:
  reevaluated_on: "2026-11-02"
  substrate_status: CD.27 pending; executor substrate unratified; T4.2 and T4.4 not built; the T4.15 spike has not run.
  verdict: continue_on_current_substrate
  basis: >-
    Criteria and edge text only: T4.4 gains the inherited-approval ladder lane and T4.31 the decomposition criterion,
    identically under every candidate substrate, and T5.6 drops its depends_on T4.2. The retired executor is the
    single-process Python one, not a CD.27 substrate. Forms no substrate evidence and pre-empts no T4.15 ruling.
bundled_recommendations: [rec-4478, rec-4479]
followon_recs: [rec-4827, rec-4829]
infrastructure_dependencies: []
weakening_dispositions:
  - candidate: '[test-removed] tests/roadmap/plan_document/test_schema.py::TestPlanDocumentSchema::test_strategic_requires_work_areas'
    disposition: planned-change
    cite: acceptance_criteria[3]
  - candidate: '[test-removed] tests/roadmap/plan_document/test_schema.py::TestPlanDocumentSchema::test_strategic_with_work_areas_validates'
    disposition: planned-change
    cite: acceptance_criteria[3]
  - candidate: '[assertion-changed] tests/roadmap/plan_document/test_schema.py::TestPlanDocumentSchema::test_work_areas_on_implementation_fail'
    disposition: planned-change
    cite: acceptance_criteria[3]
  - candidate: '[assertion-changed] tests/roadmap/plan_document/test_schema.py::TestSchemaVersion3::test_non_implementation_forbids_policy'
    disposition: planned-change
    cite: acceptance_criteria[3]
acceptance_criteria:
  - The new Decision is in docs/DECISIONS.md word for word as the sidecar holds it, supersedes [67], and is under 6,144 bytes.
  - Decision 67 is a compacted stub; Decisions 73, 90, 182, 203 and 229 each carry one dated Amended-by note; no graduated registry check guarding docs/DECISIONS.md or docs/ROADMAP-PLATFORM.yaml newly fails versus origin/main (VP 7).
  - CD.17 is state superseded with gates and affects unchanged; T2.15, T3.19 and T4.2's stability criterion wait on T4.2, not CD.17.
  - PlanDocument refuses plan_type STRATEGIC and any non-empty work_areas; every existing plan still validates.
  - No live instruction surface describes a temporary STRATEGIC or executor freeze, and /develop-executor is gone.
  - rec-4478 and rec-4479 acceptance tests pass; both close through the Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-4478's acceptance node.
    command: bin/venv-python -m pytest tests/decisions/test_decision_67_supersession.py::test_decision_67_superseded_and_cd17_disposed -q
    expected: exit 0; one test passes. Red before (file absent on main).
    fix_if: Fix the Decision, the roadmap or the schema, never the assertion.
    hermetic: true
    expected_literals:
      - 1 passed
    graduation: graduate
    graduation_check_id: decision-67-superseded-cd17-disposed
  - step: 2
    phase: pre-deploy
    action: >-
      The stale-reference sweep; graduates as a command_exit_zero registry row. rec-4479's overseer-wording node runs in
      step 3 and does not graduate, because rec-4829 deletes the overseer files it reads.
    command: >-
      bin/venv-python -m pytest -q
      tests/decisions/test_decision_67_supersession.py::test_live_instruction_surfaces_carry_no_freeze
    expected: exit 0; one test passes. Red before (file absent on main; the phrases are live on main).
    fix_if: A surface still names the freeze; restore the sidecar text. Never widen the phrase list's exemptions.
    hermetic: true
    expected_literals:
      - 1 passed
    graduation: graduate
    graduation_check_id: no-live-strategic-freeze-wording
  - step: 3
    phase: pre-deploy
    action: Schema, index and skill pins, whole files.
    command: >-
      bin/venv-python -m pytest -q tests/roadmap/plan_document tests/test_plan_obligations.py tests/test_decisions_index.py
      tests/test_workflow_skill_antidrift.py tests/decisions_md tests/platform_roadmap_state
      tests/instructions/test_interim_coordinator_wording.py
    expected: exit 0; every test passes and none fails (the count is not pinned).
    fix_if: Fix the code or the surface; a pin that fails means the surface drifted from the sidecar.
    hermetic: true
    expected_literals:
      - passed
    graduation: waive
    graduation_waiver_reason: Ordinary suites the --pre affected set selects for these scope files.
  - step: 4
    phase: pre-deploy
    action: Every existing plan still validates under the narrowed schema.
    command: bin/venv-python -c "from scripts.checks.roadmap.validate_plan_documents import validate_plan_documents as v; f=[]; v(f); assert not f, f; print('PLAN_DOCUMENTS_OK')"
    expected: exit 0; no plan fails schema validation.
    fix_if: A historical plan carries plan_type STRATEGIC or non-empty work_areas -- stop and report; never edit a merged plan.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: validate_plan_documents already runs in both tiers.
  - step: 5
    phase: pre-deploy
    action: The approved text binds the build's edits.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug retire-strategic-plans-and-legacy-executor --base origin/main
    expected: exit 0; no block reported.
    fix_if: Restore the bound file to the sidecar's words; a needed wording change goes back to the operator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Base-relative to origin/main and plan-bound; meaningless once the build merges, and validate_merge_step re-checks the binding in the PR fast tier.
  - step: 6
    phase: pre-deploy
    action: Fast tier, including validate_decisions_size, validate_candidate_decision_ratification, the decision envelope and supersession checks and the differential admission gate for the two re-pinned registry entries (--pre runs only added or modified entries; step 7 runs the rest).
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0.
    fix_if: Diagnose and fix; never edit a graduated registry entry to pass (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard, vp-red-before.yaml recursion_refusal); it is the fast-tier gate itself, not a regression guard.
  - step: 7
    phase: pre-deploy
    action: >-
      Every graduated registry check guarding docs/DECISIONS.md or docs/ROADMAP-PLATFORM.yaml runs on the branch and on an
      origin/main worktree (each side with its own registry); the branch's failing set must be a subset of main's. Covers
      the hand-authored roadmap re-keys the plan-time rehearsal did not, and the unmodified pins --pre never executes. 11
      entries are already red on main (rec-4831); they stay out of scope. A check that reads the roadmap but guards
      another file (e.g. ports-sandbox-runtime-adapters) is outside the filter; rec-4831 owns the general re-run.
    command: >-
      bin/venv-python -c "from scripts.verification_graduation import load_entries, materialize_check_in_tree, git_worktree;
      from scripts.verification_checks import CheckStatus; g=lambda root: {r['check_id'] for r in load_entries(root) if
      any(t in str(r.get('guard_target','')) for t in ('ROADMAP-PLATFORM','DECISIONS.md')) and materialize_check_in_tree(r,
      root).run().status is not CheckStatus.PASS}; import atexit; head=g(None); wt=git_worktree('origin/main');
      w=wt.__enter__(); atexit.register(wt.__exit__, None, None, None); main=g(w); new=sorted(head-main); assert not new, new; print('NO_NEW_GRADUATED_RED', len(head))"
    expected: exit 0 and NO_NEW_GRADUATED_RED printed (about 3 minutes); the count is main's pre-existing reds.
    fix_if: Fix the surface the named check reads; never edit a graduated registry entry to pass (Decision 235). A check red on both sides is rec-4831's, not this build's.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Base-relative to origin/main; meaningless once the build merges. rec-4831 owns making graduated entries re-run in a tier.
  - step: 8
    phase: pre-deploy
    action: Full presubmit tier before handoff, on the committed, rebased tree.
    command: bin/venv-python -m scripts.validate
    expected: Exit 0.
    fix_if: Diagnose the named failing check on the branch (Decision 55); a failure outside this scope is recorded as a rec, not patched inline.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard, vp-red-before.yaml recursion_refusal); it is the handoff gate itself, not a regression guard.
  - step: 9
    phase: post-deploy
    action: Both bundled recs closed by the merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, missing = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4478', 'rec-4479']); s = {r['id']: r['status'] for r in rows}; print(s, missing); assert not missing and set(s.values()) == {'closed'}, s"
    expected: both statuses closed.
    fix_if: Follow git-ops.yaml resolves_trailer's fallback; never close by hand without the acceptance verdict.
    hermetic: false
    graduation: not-applicable
