  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Exactly the sidecar: the interactive-era alarm and T3.19 forward-note re-key from the freeze to T4.2; the
      decomposition-hint paragraph loses the freeze wording; the Strategic Scoping Rules section (cited only by the
