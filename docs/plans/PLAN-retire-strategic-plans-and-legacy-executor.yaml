  - "Graduated pins: persona-first-decision-annotations needs exactly one '> **Update (' line naming Decision 229 in Decision 90 and keeps its 'Executor and STRATEGIC plans are frozen per Decision 67 / CD.17' line; persona-first-decision-recorded allows only 205/217 amends-or-supersedes edges inside Decision 229 and needs 'Interim reading, pending rec-4478'. Use Amended-by notes only."
