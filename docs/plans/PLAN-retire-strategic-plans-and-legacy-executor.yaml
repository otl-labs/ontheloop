gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Apply the sidecar to every bound file; confirm with approved_text verify (VP 5).
  - docs/ROADMAP-PLATFORM.yaml edits per its scope row.
  - plan_document.py and the schema tests; tests/test_plan_obligations.py; tests/test_decisions_index.py; antidrift slice.
  - Create the two new test directories and tests; delete .claude/commands/develop-executor.md.
  - scripts/decisions_md.py docstring example.
  - Lower config/prose_budgets.yaml entries to measured sizes if the ratchet asks (decrease only).
  - Execute Verification Plan -- run each step; loop until pass; on unrecoverable failure stop and RCA (Decision 55)
  - 'Report: what was implemented, verification results'
rollback: Revert the squash commit; the Decision number, if already backfilled, is re-synced by ops_data_portal --backfill-decisions-md.
