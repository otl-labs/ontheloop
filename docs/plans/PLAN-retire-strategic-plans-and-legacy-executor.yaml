schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "retire-strategic-plans-and-legacy-executor"
intent: >-
  Retire the legacy single-process Python executor and the STRATEGIC plan type for good through one new Decision
  that supersedes Decision 67 and disposes of CD.17, and record their replacement: an item too large for one plan is
  decomposed by its planner into child work items that ride the parent's approval only through a deterministic
  check, with deeper or wider splits going to triage (operator rulings 2026-10-19 and 2026-11-02, rec-4478). Every
  instruction surface stops describing a temporary freeze, so agents plan against the system as it is.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-retire-strategic-plans-and-legacy-executor.yaml
phase: >-
  ad_hoc_rec (soft-warn category; rec-4478, no tier_item claimed, so the Tier Item Freshness Gate is skipped). Adds
  forward-intent criteria to T4.31 and T4.4 and drops T5.6's depends_on T4.2; closes no criterion.
closes_criteria: []
implementation_declared: true
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the sidecar: the new Decision (heading number {{N}}, renumbered at merge by scripts.session.rebase_resolve
      if taken; under the 6,144-byte entry cap), Decision 67 compacted in place to the Decision 149 stub (header line
      unchanged; Superseded by the new Decision), and one dated "> **Amended by Decision {{N}} ({{DATE}}):**" note each
      on Decisions 73, 90, 182, 203 and 229, appended after each entry's last line, never inside a body.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Roadmap data, not sidecar-bound: CD.17 state pending -> superseded (gates [] and affects unchanged; detail gains a
      one-line superseded-by note); the document header bullet on strategic: true (lines 64-71) says the flag marks
      decomposition need only; the waits keyed to CD.17 reversal re-key to T4.2's completion -- T2.15 (criterion texts and
      progress_note), T3.19 (intent line and progress_note), T4.2's stability criterion (annotation: CD.17 superseded,
      the bar stands as T4.2's own); new open criteria on T4.31 (plan_agent decomposes an oversized item by filing child
      work items part_of it, ends decomposed, starts nothing; raises the promotion event to triage) and T4.4 (the
      five-test inheritance check as a Decision 235 cl.2 ladder lane); T5.6 depends_on [T4.2] -> [] and stays
      deferred_post_mvp (operator, fork 2, 2026-11-02); its progress_note's reactivation trigger no longer names T4.2. Historical narration (freeze-override comments, "authored as atomic IMPLEMENTATION plans
      per Decision 67") stays as written.
  - file: scripts/roadmap/plan_document.py
    action: Modify
    purpose: >-
      PlanType drops STRATEGIC; the work_areas validator rejects any non-empty list with a message naming the new
      Decision (the field stays: 384 plans carry work_areas: []). Net SLOC falls.
  - file: tests/roadmap/plan_document/test_schema.py
    action: Modify
    purpose: >-
      STRATEGIC is refused; non-empty work_areas is refused on every plan type; the two STRATEGIC-accepting tests are
      retired (weakening_dispositions) and the REPORT-ONLY forbids-policy parametrisation keeps its REPORT-ONLY case.
  - file: tests/test_plan_obligations.py
    action: Modify
    purpose: test_non_implementation_plan_grandfathered uses REPORT-ONLY instead of the retired STRATEGIC type.
  - file: tests/test_decisions_index.py
    action: Modify
    purpose: Decision 67's representative currency class becomes superseded_compacted (planned change).
  - file: tests/test_workflow_skill_antidrift.py
    action: Modify
    purpose: The IMPLEMENTATION Commit Flow slice runs to the end of the skill, since the STRATEGIC Commit Flow section (its old end marker) is removed.
  - file: tests/decisions/__init__.py
    action: Create
    purpose: Package marker for the new test directory.
  - file: tests/decisions/test_decision_67_supersession.py
    action: Create
    purpose: >-
      rec-4478's acceptance node test_decision_67_superseded_and_cd17_disposed: the new Decision's envelope supersedes
      [67]; Decision 67 is a compacted stub pointing at it; CD.17 state superseded; PlanDocument refuses STRATEGIC. Plus
      test_live_instruction_surfaces_carry_no_freeze: AGENTS.md, README.md, docs/PROJECT_CONTEXT.md, .claude/skills/**
      and .claude/commands/** contain no "STRATEGIC plans suspended", "Decision 67 reversal", "CD.17 reversal",
      "CD.17 / T4.2" or "(frozen, Decision 67)" phrase, and no .claude/commands/develop-executor.md exists.
  - file: tests/instructions/__init__.py
    action: Create
    purpose: Package marker for the new test directory.
  - file: tests/instructions/test_interim_coordinator_wording.py
    action: Create
    purpose: >-
      rec-4479's acceptance node test_overseer_wording_names_interim_coordinator_runs: AGENTS.md's /overseer sentence and
      the overseer skill's guardrail say the overseer starts no planning or implementation agent of its own, the
      coordinator dispatches each as one human-gated persona step on an operator-chosen rec, never the rec queue, hub and
      spoke (Decision 229 cl.1-2 and its 2026-11-02 Update note, rec-4825); and neither text still says the overseer
      composes or dispatches subagents.
  - file: AGENTS.md
    action: Modify
    purpose: >-
      Exactly the sidecar: the Temporary Operational Constraints STRATEGIC bullet removed; the Skills and slash commands
      paragraph names the three-command workflow, the retired /develop-executor, the two plan types and decomposition
      into child items, and the /overseer's interim-coordinator persona step (rec-4479). Net bytes fall.
  - file: README.md
    action: Modify
    purpose: Exactly the sidecar -- the Autonomous Executor status row drops "executor freeze active pending CD.17 / T4.2 reversal".
  - file: docs/PROJECT_CONTEXT.md
    action: Modify
    purpose: Exactly the sidecar -- line 152's "frozen pending Decision 67 reversal" becomes retired (Decision {{N}}), boundary kept.
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Exactly the sidecar: Complexity Assessment (decomposition, not STRATEGIC), the non-automatable preflight bullet
      (Decision 73 cl.4 permanent), template plan_type and work_areas comments, Step 10 and Confirmation Messages lose
      the STRATEGIC branch.
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Exactly the sidecar -- steps 5 and 8 lose the STRATEGIC branch (step 8's pinned IMPLEMENTATION sentence kept
      verbatim); Step 12d is retired to a one-line schema pointer; the output template's Plan Type line.
  - file: .claude/skills/implement/SKILL.md
    action: Modify
    purpose: >-
      Exactly the sidecar: the interactive-era alarm and T3.19 forward-note re-key from the freeze to T4.2; the
      decomposition-hint paragraph loses the freeze wording; the Strategic Scoping Rules section (cited only by the
      STRATEGIC branch of commands/implement.md, also removed) and the STRATEGIC Commit Flow are removed.
  - file: .claude/skills/orient/SKILL.md
    action: Modify
    purpose: Exactly the sidecar -- strategic pending items are listed as "decompose first", not "blocked by executor freeze".
  - file: .claude/skills/overseer/SKILL.md
    action: Modify
    purpose: >-
      Exactly the sidecar -- the Decision 67 guardrail becomes the retired-executor guardrail: the overseer starts no
      planning or implementation agent of its own, the coordinator dispatches each (rec-4479, Decision 229 Update note).
      The skill body's dispatch recipes are left for the overseer's own retirement.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: Exactly the sidecar -- Step 4 item 5 and Step 10 lose the STRATEGIC branch.
  - file: .claude/commands/implement.md
    action: Modify
    purpose: Exactly the sidecar -- description, Intent, Step 2, Step 3 and Step 9 lose the STRATEGIC branch.
  - file: .claude/commands/overseer.md
    action: Modify
    purpose: Exactly the sidecar -- the guardrail list cites the new Decision instead of Decision 67.
  - file: .claude/commands/develop-executor.md
    action: Delete
    purpose: The retired fourth tier's command (Decision {{N}} cl.1); the executor-rca skill stays.
  - file: docs/contracts/git-ops.yaml
    action: Modify
    purpose: Exactly the sidecar -- the scope({slug}) prefix row marked retired; contract_version bump and amendment_log entry.
  - file: docs/contracts/tier-item-lifecycle.yaml
    action: Modify
    purpose: Exactly the sidecar -- the decomposition-hint freeze sentence; version bump and amendment_log entry.
  - file: docs/contracts/instruction-architecture.yaml
    action: Modify
    purpose: Exactly the sidecar -- line 141's "frozen pending Decision 67 reversal"; version bump and amendment_log entry.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: Exactly the sidecar -- the amended class's "e.g. Decision 67" example (Decision 67 leaves that band); version bump and amendment_log entry.
  - file: scripts/decisions_md.py
    action: Modify
    purpose: The same example in the currency docstring; comment-only, no behaviour change.
  - file: docs/plans/approved/retire-strategic-plans-and-legacy-executor.yaml
    action: Create
    purpose: The approved-text sidecar binding every always-ask edit above word for word (lands with this plan PR).
bundled_recommendations: [rec-4478, rec-4479]
followon_recs: [rec-4827]
infrastructure_dependencies: []
weakening_dispositions:
  - candidate: '[test-removed] tests/roadmap/plan_document/test_schema.py::test_strategic_with_work_areas_validates'
    disposition: retirement
    cite: Decision {{N}} cl.2 retires the STRATEGIC plan type; tests/decisions/test_decision_67_supersession.py asserts the refusal.
  - candidate: '[test-removed] tests/roadmap/plan_document/test_schema.py::test_strategic_requires_work_areas'
    disposition: retirement
    cite: Decision {{N}} cl.2; test_work_areas_refused_on_every_plan_type replaces it.
  - candidate: '[assert-changed] tests/test_decisions_index.py::test_representative_classes_and_compacted_set_equals_status_marker_set'
    disposition: planned-change
    cite: Decision 67 is compacted (Decision 149 stub), so its currency moves from amended to superseded_compacted.
acceptance_criteria:
  - The new Decision is in docs/DECISIONS.md word for word as the sidecar holds it, supersedes [67], and is under 6,144 bytes.
  - Decision 67 is a compacted stub; Decisions 73, 90, 182, 203 and 229 each carry one dated Amended-by note; every graduated registry check reading them still passes.
  - CD.17 is state superseded with gates and affects unchanged; T2.15, T3.19 and T4.2's stability criterion wait on T4.2, not CD.17.
  - PlanDocument refuses plan_type STRATEGIC and any non-empty work_areas; every existing plan still validates.
  - No live instruction surface describes a temporary STRATEGIC or executor freeze, and /develop-executor is gone.
  - rec-4478 and rec-4479 acceptance tests pass; both close through the Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-4478's acceptance node.
    command: bin/venv-python -m pytest tests/decisions/test_decision_67_supersession.py::test_decision_67_superseded_and_cd17_disposed -q
    expected: exit 0; one test passes. Red before (file absent on main).
    fix_if: Fix the Decision, the roadmap or the schema, never the assertion.
    hermetic: true
    expected_literals:
      - 1 passed
    graduation: graduate
    graduation_check_id: decision-67-superseded-cd17-disposed
  - step: 2
    phase: pre-deploy
    action: The stale-reference sweep and the interim-coordinator wording (rec-4479's node).
    command: >-
      bin/venv-python -m pytest -q
      tests/decisions/test_decision_67_supersession.py::test_live_instruction_surfaces_carry_no_freeze
      tests/instructions/test_interim_coordinator_wording.py::test_overseer_wording_names_interim_coordinator_runs
    expected: exit 0; two tests pass. Red before (files absent on main; the phrases are live on main).
    fix_if: A surface still names the freeze; restore the sidecar text. Never widen the phrase list's exemptions.
    hermetic: true
    expected_literals:
      - 2 passed
    graduation: graduate
    graduation_check_id: no-live-strategic-freeze-wording
  - step: 3
    phase: pre-deploy
    action: Schema, index and skill pins, whole files.
    command: >-
      bin/venv-python -m pytest -q tests/roadmap/plan_document tests/test_plan_obligations.py tests/test_decisions_index.py
      tests/test_workflow_skill_antidrift.py tests/decisions_md tests/platform_roadmap_state
    expected: exit 0; every test passes and none fails (the count is not pinned).
    fix_if: Fix the code or the surface; a pin that fails means the surface drifted from the sidecar.
    hermetic: true
    expected_literals:
      - passed
    graduation: waive
    graduation_waiver_reason: Ordinary suites the --pre affected set selects for these scope files.
  - step: 4
    phase: pre-deploy
    action: Every existing plan still validates under the narrowed schema.
    command: bin/venv-python -m scripts.checks.roadmap.validate_plan_documents
    expected: exit 0; no plan fails schema validation.
    fix_if: A historical plan carries plan_type STRATEGIC or non-empty work_areas -- stop and report; never edit a merged plan.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: validate_plan_documents already runs in both tiers.
  - step: 5
    phase: pre-deploy
    action: The approved text binds the build's edits.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug retire-strategic-plans-and-legacy-executor --base origin/main
    expected: exit 0; no block reported.
    fix_if: Restore the bound file to the sidecar's words; a needed wording change goes back to the operator.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Fast tier, including validate_decisions_size, validate_candidate_decision_ratification, the decision envelope and supersession checks and every graduated registry check reading DECISIONS.md or the roadmap.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0.
    fix_if: Diagnose and fix; never edit a graduated registry entry to pass (Decision 235).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Both bundled recs closed by the merge's Resolves trailer.
    command: >-
      bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f; s={r: f(r, profile='agent_platform')['status'] for r in ('rec-4478','rec-4479')}; print(s); assert set(s.values())=={'closed'}, s"
    expected: both statuses closed.
    fix_if: Follow git-ops.yaml resolves_trailer's fallback; never close by hand without the acceptance verdict.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/roadmap/plan_document.py
    behavior: STRATEGIC and non-empty work_areas are refused on every plan.
    verification_step: 1
    test_selector: tests/decisions/test_decision_67_supersession.py::test_decision_67_superseded_and_cd17_disposed
    red_green_expectation: red before (STRATEGIC validates on main), green after.
  - source: docs/DECISIONS.md
    behavior: The new Decision supersedes 67, 67 is a stub, the notes are present.
    verification_step: 1
    test_selector: tests/decisions/test_decision_67_supersession.py::test_decision_67_superseded_and_cd17_disposed
    red_green_expectation: red before, green after.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: CD.17 superseded, gates and affects unchanged.
    verification_step: 1
    test_selector: tests/decisions/test_decision_67_supersession.py::test_decision_67_superseded_and_cd17_disposed
    red_green_expectation: red before (state pending), green after.
  - source: AGENTS.md
    behavior: No temporary-freeze wording; the /overseer starts no author agent, the coordinator dispatches each.
    verification_step: 2
    test_selector: tests/instructions/test_interim_coordinator_wording.py::test_overseer_wording_names_interim_coordinator_runs
    red_green_expectation: red before, green after.
constraints:
  - Always-ask surfaces change exactly as the sidecar says (approved_text verify); any other wording goes back to the operator.
  - Decision bodies are append-only (Decision 177); Decision 67's compaction follows decision-entry.yaml stub_grammar exactly.
  - Never edit a graduated registry entry to make it pass (Decision 235); design the annotations around their pins.
  - Executor code, its tests, config/agent/executor/* and capabilities.yaml are out of scope (T5.6 follow-on); capabilities.yaml is re-homed, never deleted.
  - No rescue agents or workaround loops (Decision 55).
