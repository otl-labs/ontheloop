    behavior: STRATEGIC is refused (VP 1); non-empty work_areas stays refused on every plan type with the new message (test_schema.py::TestPlanDocumentSchema::test_work_areas_refused_on_every_plan_type, run by VP 3).
    verification_step: 1
    test_selector: tests/decisions/test_decision_67_supersession.py::test_decision_67_superseded_and_cd17_disposed
    red_green_expectation: red before (STRATEGIC validates on main), green after.
  - source: docs/DECISIONS.md
    behavior: The new Decision supersedes 67 and 67 is a stub (VP 1); the five dated Amended-by notes are bound word for word by VP 5.
    verification_step: 1
