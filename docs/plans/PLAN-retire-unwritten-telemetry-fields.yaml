execution_steps:
  - Run bin/venv-python -m scripts.ci_rca.red_overlap --plan docs/plans/PLAN-retire-unwritten-telemetry-fields.yaml; on blocked, stop and report.
  - "Schema, realization rules and owners command first (contracts_schema.py, validate_telemetry_field_realization.py, scripts/telemetry_verify/__main__.py, telemetry-verification.yml) with their tests (VP 1 red, then green)."
  - "Contracts: the 14 retired populated_by lines, the re-owned populated_by lines and the realization blocks; record the weakening disposition."
  - "Commit, then execute the Verification Plan (VP 1-5) on the committed tree; loop until pass; on an unrecoverable failure stop and report (Decision 55)."
  - Code review via a fresh code-review subagent; fix blocking findings and rerun VP 1-5.
  - >-
    CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): set implementation_declared true; commit; rebase
    on origin/main; re-run red_overlap; run VP 6 on the committed clean HEAD; push; open the build PR; subscribe; run
    merge_step premerge; squash-merge on code review PROCEED and green CI with "Resolves: rec-4606" in the commit body;
    run merge_step readback; then VP 7.
  - >-
    Report, as separate facts: what was implemented; readiness state; the full-tier exit plus validation_result
    --verify-head for the pushed HEAD; structured postflight evidence (bin/venv-python -m scripts.session.postflight
    --evidence logs/debug/postflight-retire-unwritten-telemetry-fields.json); the push, PR number, CI result and read-back merge SHA; VP 7's read-back.
