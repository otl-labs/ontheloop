schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: retire-unwritten-telemetry-fields
intent: >-
  Every declared telemetry column that nothing writes is either retired or owned by an open rec whose own text names it.
  The 14 columns no producer has ever written are marked retired in the four telemetry contracts, each owned by
  its table's drop rec (rec-4599, rec-4600, rec-4601, rec-4711), which drops it at that table's next production column
  change; the still-wanted unwritten columns move to recs that name them; the bare hold label leaves the owner grammar;
  and checks prove that an owner is open and names its field (rec-4606; audit TFC-06 and TFC-07). No column, type,
  rule, writer config, producer or reader changes, so nothing is deployed.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-retire-unwritten-telemetry-fields.yaml
phase: >-
  Maintenance of met T3.20:c7 (telemetry schema accuracy; the rec-4589 field-realization prevention line; audit
  telemetry-field-consolidation TFC-06 and TFC-07). Closes no exit criterion, so closes_criteria is empty.
closes_criteria: []
cites: [dec:62, dec:66, dec:84, dec:210, dec:215, dec:235, dec:244, dec:275, dec:279]
scope:
  - file: docs/contracts/telemetry_sessions.yaml
    action: Modify
    purpose: >-
      Retire steps_total, failure_phase, coverage_before, coverage_after, plan_slug and scope_drift_files under rec-4599
      (retirement rule in context: populated_by only). Re-own rec_ids, pr_url, ci_outcome, files_changed, lines_added and
      lines_removed from held:feedback-loop-gate to rec-5270 (populated_by "unproduced: rec-5270 (no producer writes
      it)"), unless realization.produced already has a ci_annotate key (the merge-annotate producer build landed first),
      in which case those six are left as they are. realization: unproduced becomes {rec-5270: [the six]} (the key line
      is removed if empty); retired: {rec-4599: [the six retired]}.
    new_imports: []
  - file: docs/contracts/telemetry_observations.yaml
    action: Modify
    purpose: >-
      Retire acceptance_passed, time_lost_seconds and rec_id under rec-4600. cost_usd_reported populated_by "unproduced:
      rec-4031 (no producer writes it)"; exit_code populated_by "unproduced: rec-5483 (no producer writes it)" (nothing
      else on exit_code changes). realization: unproduced {rec-4031:
      [cost_usd_reported], rec-5483: [exit_code]}; retired: {rec-4600: [the three]}.
    new_imports: []
  - file: docs/contracts/telemetry_agents.yaml
    action: Modify
    purpose: >-
      Retire provider, findings_count and lambda_request_id under rec-4711. recs_created and queue_entries_written
      populated_by "unproduced: rec-5484 (no producer writes it)". realization: unproduced {rec-5484: [recs_created,
      queue_entries_written]} (T4.32:c1 and rec-4711 keys gone); retired: {rec-4711: [the three]}.
    new_imports: []
  - file: docs/contracts/telemetry_transcripts.yaml
    action: Modify
    purpose: >-
      Retire token_count and rec_id under rec-4601. realization: the unproduced line is removed; retired: {rec-4601:
      [token_count, rec_id]}.
    new_imports: []
  - file: scripts/contracts_schema.py
    action: Modify
    purpose: >-
      Realization gains retired: dict[str, list[str]] (default empty, extra=forbid kept); its docstring names the third
      placement and that retired owners are the drop recs.
    new_imports: []
  - file: scripts/checks/contracts/validate_telemetry_field_realization.py
    action: Modify
    purpose: >-
      Stays hermetic (no reader import). (a) R1: a stored field sits in exactly one of produced, unproduced or retired
      (the existing "stored field is in neither" and "stored field is both produced and unproduced" prefixes are kept;
      new messages name the other pairs); a retired name must be a stored contract field. (b) R5: no retired field is non-null in
      any producer's golden rows. (c) R7: _OWNER_RE drops held:feedback-loop-gate; a retired owner must match rec-N; a
      criterion owner's criterion text value (not its keys) must contain each owned field as a whole word (new
      criterion_text helper beside criterion_status, which yaml-loads that one criterion's block so folded >- and quoted
      text both read, a targeted lookup, Decision 208). (d) R8: a retired field's populated_by starts "retired: <owner>".
      (e) New pure owner_recs(contracts) -> sorted rec ids owning any field under unproduced or retired, and pure
      owner_errors(contracts, rows, missing) -> list[str]: each owner rec is found, has a status, status is open, and its
      title + context + acceptance contain each owned field as a whole word (regex (?<![\w-])<name>(?![\w-]), so
      "provider" never matches "inference-provider"). Docstring rules list gains the new rules.
    new_imports: []
  - file: scripts/telemetry_verify/__main__.py
    action: Modify
    purpose: >-
      New subcommand owners [--no-alarms] [--assert-green] and run_owners_command(args, reader, now, portal): loads the four contracts
      through the realization module, reads owner_recs once with src.common.ducklake_reader_client.fetch_recs_by_ids(reader,
      ids) over main's routed reader (recs_by_ids routes to the ops reader), and prints "OWNERS status=green|red|skipped
      examined=<n> findings=<n>" (skipped when no owner rec exists: nothing judged, never green) then "OWNERS_FINDING <table>.<field> <rec>" per finding (field names, rec ids and class
      names only, Decision 101). A reader error prints "OWNERS_STOP class=<exception class>" and exits 1 (2 under --assert-green), never a pass
      (Decision 215 cl.2; no skip site, so Decision 155 cl.3 is not engaged). On red without --no-alarms it files or
      updates one telemetry_verify rec through raise_alarms, called directly with acceptance_for=lambda _:
      OWNERS_ACCEPTANCE (the monitor's _file hard-codes the monitor acceptance) (finding class field_owner, count = findings, scope "owners",
      file scripts/telemetry_verify/__main__.py, acceptance OWNERS_ACCEPTANCE = "AWS_PROFILE=agent_platform
      bin/venv-python -m scripts.telemetry_verify owners --no-alarms --assert-green"), the monitor's Decision 62 route.
      Exits: --assert-green gives 0 only after a completed read with examined > 0 and findings 0, else 2 (the monitor's
      _verdict shape, so the acceptance lints decidable; skipped gives 2); otherwise 0 once green, skipped or filed, 1 when --no-alarms and red, or
      when filing fails (ALARMS_FAILED, as _file prints). The module docstring names owners.
    new_imports: [src.common.ducklake_reader_client, scripts.checks.contracts.validate_telemetry_field_realization]
  - file: .github/workflows/telemetry-verification.yml
    action: Modify
    purpose: >-
      One step after "Verify the quiet trees", named "Check telemetry field owners are open", with if: "!cancelled()",
      timeout-minutes: 5, and run ".venv/bin/python -m scripts.telemetry_verify owners" under set -euo pipefail (the job
      already holds the OIDC role and the reader and writer URLs). The header's time paragraph gains the owners step's
      allowance: one read and at most one filing, inside the 150 s the monitor budget leaves (runs took 3 to 19 minutes,
      2026-11-12 to 11-21); a monitor run that used its whole budget can leave it expired credentials, which reads as
      OWNERS_STOP and a red run, never a pass (kept after the monitor so the monitor's arrival read keeps its full
      margin; a persistent red still shows in sensor_liveness). No trigger, permission or other step changes.
    new_imports: []
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      r3_workflows gains ".github/workflows/telemetry-verification.yml::monitor::check-telemetry-field-owners-are-open": 2
      beside the verify-the-quiet-trees entry (Decision 162 cl.3; validate_composite_action_shell_bodies).
    new_imports: []
  - file: tests/checks/contracts/test_validate_telemetry_field_realization.py
    action: Modify
    purpose: >-
      Synthetic world: T1.1:c1's text names its field g (_ROADMAP literal); _table() and
      test_clean_synthetic_world_passes are otherwise unchanged (its examined count stays 6 per table). New helper
      _with_retired(world) adds field x (populated_by "retired: rec-9 ...") under retired {rec-9: [x]} to every table.
      New DEFECTS rows, each applying _with_retired first where it needs a retired field: R1-retired-and-produced,
      R1-retired-and-unproduced, R1-retired-unknown, R5-retired-emitted, R7-held-label (u moved under
      held:feedback-loop-gate; "owner 'held:feedback-loop-gate' is malformed"), R7-retired-owner-not-rec,
      R7-criterion-not-named, R8-retired-prefix. test_live_contract_mutations_are_caught's setup line becomes
      block.setdefault("unproduced", {}).setdefault("rec-4599", []).append("harness_session_key") (rec-4599 leaves
      sessions' unproduced, which may itself go; both assertions unchanged). New tests: test_clean_world_with_retired_passes (no errors; examined
      counts the retired field); test_owner_recs_lists_unproduced_and_retired_rec_owners (criterion owners excluded);
      test_closed_rec_owner_is_reported (rec-4606's acceptance; a closed owner row yields an error naming table, field
      and rec); test_rec_owner_must_name_each_field (also: text holding only "inference-provider" does not name
      provider); test_folded_criterion_text_names_its_field (a text: >- criterion naming g passes); test_missing_owner_rec_is_reported (a missing id, and a returned row
      without status, each fail); test_live_retired_columns_are_stubs (a lasting rule, so the drop plans never retire it,
      Decision 244 cl.4-5: each of the 14 names is either absent from its contract's fields, or listed under retired with
      its table's rec and populated_by starting "retired: <that rec>"; none is under produced or unproduced and no
      producer's golden rows emit it; a future producer for one of them changes this guard with the operator's word,
      Decision 235, as its docstring says).
    new_imports: []
  - file: tests/telemetry_verify/test_main.py
    action: Modify
    purpose: >-
      New tests: test_owners_command_green_prints_the_owner_line (fake reader with open naming rows; exit 0; zero
      findings; the ids asked are exactly owner_recs of the live contracts; no filing); test_owners_command_red_files_one_alarm
      (a closed row; one OWNERS_FINDING line; the fake portal receives one telemetry_verify rec with finding_class=field_owner
      and the owners --no-alarms acceptance; exit 0); test_owners_command_no_alarms_red_exits_1 (no filing);
      test_owners_command_reader_error_stops (the fake reader raises a ReaderInvokeError, then an OSError; exit 1,
      OWNERS_STOP with the class name only, no filing); test_owners_assert_green_exits_0_only_when_green (green 0; red 2;
      reader error 2; zero owners prints status=skipped and gives 2); test_owners_failed_filing_exits_1 (the fake portal
      raises; ALARMS_FAILED; exit 1); test_owners_acceptance_lints_decidable (lint_acceptance_command(OWNERS_ACCEPTANCE,
      require_decidable=True) accepts it); test_owners_builds_the_routed_reader (main builds the routed reader once).
    new_imports: []
  - file: tests/test_telemetry_verification_workflow.py
    action: Modify
    purpose: >-
      New test_owners_step_runs_after_the_monitor: the step exists after the monitor command, its if is !cancelled(), its
      run is the owners command without --no-alarms (test_workflow_shape passes unchanged).
    new_imports: []
  - file: tests/test_contracts_schema.py
    action: Modify
    purpose: >-
      New test_realization_retired_shape: a Class A document with realization.retired validates; a retired value that is
      not a list of strings is refused.
    new_imports: []
  - file: tests/checks/contracts/test_telemetry_top_level_agent_run.py
    action: Modify
    purpose: >-
      Line 122's pin moves to the new state with the same fields: set(realization.retired["rec-4711"]) >=
      {"lambda_request_id", "findings_count"} (weakening_dispositions).
    new_imports: []
