schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: retire-unwritten-telemetry-fields
intent: >-
  Every declared telemetry column that nothing writes is either retired or owned by an open rec whose own text names it.
  The 14 columns no producer has ever written become short retired stubs in the four telemetry contracts, each owned by
  its table's drop rec (rec-4599, rec-4600, rec-4601, rec-4711), which drops it at that table's next production column
  change; the still-wanted unwritten columns move to recs that name them; the bare hold label leaves the owner grammar;
  and checks prove that an owner is open and names its field (rec-4606; audit TFC-06 and TFC-07). No column, type,
  rule, writer config, producer or reader changes, so nothing is deployed.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-retire-unwritten-telemetry-fields.yaml
phase: >-
  T3.20 follow-on (field realization, the rec-4589 prevention line; audit telemetry-field-consolidation TFC-06 and
  TFC-07). Closes no exit criterion, so closes_criteria is empty.
closes_criteria: []
cites: [dec:66, dec:170, dec:210, dec:215, dec:275, dec:279]
scope:
  - file: docs/contracts/telemetry_sessions.yaml
    action: Modify
    purpose: >-
      Retire steps_total, failure_phase, coverage_before, coverage_after, plan_slug and scope_drift_files as stubs (stub
      rule in context) owned by rec-4599; coverage_after's dq_intent (required_when annotate and its temporary exemption
      owned by rec-4599) stays byte for byte. steps_completed_total: its semantics drops the sentence pairing it with
      steps_total (exact text in context), with a prose_improvement row (semantic_break false). Re-own rec_ids, pr_url,
      ci_outcome, files_changed, lines_added and lines_removed from held:feedback-loop-gate to rec-5270 (populated_by
      "unproduced: rec-5270 (no producer writes it)"), unless realization.produced already has a ci_annotate key (the
      merge-annotate producer build landed first), in which case those six are left as they are. realization: unproduced
      loses the held key, gains rec-5270 (when re-owned) and loses rec-4599; retired: {rec-4599: [the six]}. One terse
      top-level amendment_log row (semantic_break true, governance_note_add).
    new_imports: []
  - file: docs/contracts/telemetry_observations.yaml
    action: Modify
    purpose: >-
      Retire acceptance_passed, time_lost_seconds and rec_id as stubs owned by rec-4600 (time_lost_seconds keeps the
      rules-file sentence and its 2026-10-05 prose_improvement row, see context). cost_usd_reported populated_by
      "unproduced: rec-4031 (no producer writes it)"; exit_code populated_by "unproduced: rec-5483 (no producer writes
      it)" (populated_by only; any rewording of exit_code belongs to the metadata key registry plan). realization:
      unproduced {rec-4031: [cost_usd_reported], rec-5483: [exit_code]}; retired: {rec-4600: [the three]}. One terse
      top-level row as above.
    new_imports: []
  - file: docs/contracts/telemetry_agents.yaml
    action: Modify
    purpose: >-
      Retire provider, findings_count and lambda_request_id as stubs owned by rec-4711. recs_created and
      queue_entries_written populated_by "unproduced: rec-5484 (no producer writes it)". realization: unproduced
      {rec-5484: [recs_created, queue_entries_written]} (T4.32:c1 and rec-4711 keys gone); retired: {rec-4711: [the
      three]}. One terse top-level row as above.
    new_imports: []
  - file: docs/contracts/telemetry_transcripts.yaml
    action: Modify
    purpose: >-
      Retire token_count and rec_id as stubs owned by rec-4601. realization: no unproduced key; retired: {rec-4601:
      [token_count, rec_id]}. One terse top-level row as above.
    new_imports: []
  - file: scripts/contracts_schema.py
    action: Modify
    purpose: >-
      Realization gains retired: dict[str, list[str]] (default empty, extra=forbid kept); its docstring names the third
      placement and that retired owners are the drop recs.
    new_imports: []
  - file: scripts/checks/contracts/validate_telemetry_field_realization.py
    action: Modify
    purpose: >-
      (a) R1: a stored field sits in exactly one of produced, unproduced or retired (messages name which two); a retired
      name must be a stored contract field. (b) R5: no retired field is non-null in any producer's golden rows. (c) R7:
      _OWNER_RE drops held:feedback-loop-gate; a retired owner must match rec-N; a criterion owner's criterion block text
      must contain each owned field as a whole word (new criterion_text helper beside criterion_status). (d) R8: a
      retired field's populated_by starts "retired: <owner>". (e) New pure owner_errors(contracts, rows, missing): for
      every rec owner under unproduced or retired, the rec is found, status is open, and title + context + acceptance
      contain each owned field name as a whole word (regex \b<name>\b). (f) New registered wrapper
      validate_telemetry_field_owners(failed, *, root=None, fetch=None): loads the four contracts, reads the owner recs
      once through fetch_recs_by_ids(make_reader(), ids) (imported inside the function), declares
      registry.examined(<owner recs>, unit="owner recs"), and on any reader exception appends one fail-closed message to
      failed (never registry.skipped; Decisions 170, 215). Docstring rules list gains the new rules.
    new_imports: [src.common.ducklake_reader_client]
  - file: scripts/checks/contracts/_manifest.py
    action: Modify
    purpose: >-
      One Entry: name validate_telemetry_field_owners, the same module, attr validate_telemetry_field_owners, pre False,
      pre_globs None, full_segment full_after_lint (reader-backed; pr-validate has no credentials, and every full segment runs with the same main-validate credentials; the segment already lists the contracts domain).
    new_imports: []
  - file: tests/checks/contracts/test_validate_telemetry_field_realization.py
    action: Modify
    purpose: >-
      Synthetic world: T1.1:c1's text names its field g; one retired field. New DEFECTS rows: R1 retired-and-produced,
      R1 retired-and-unproduced, R1 retired unknown name, R5 retired non-null in golden rows, R7 held label refused, R7
      retired owner not a rec, R7 criterion text does not name its field, R8 retired prefix. New tests:
      test_closed_rec_owner_is_reported (rec-4606's acceptance; a closed owner row yields an error naming table, field
      and rec), test_rec_owner_must_name_each_field, test_missing_owner_rec_is_reported,
      test_owner_wrapper_fails_closed_on_reader_error (injected fetch raises; failed non-empty, no skipped),
      test_owner_wrapper_passes_on_open_naming_rows (injected fetch), test_live_retired_columns_are_stubs (the 14 names
      sit under retired with their table's rec, each with populated_by starting "retired: <that rec>", and no producer
      credits any of them).
    new_imports: []
  - file: tests/checks/contracts/test__manifest.py
    action: Modify
    purpose: >-
      New class TestTelemetryFieldOwnersRegistered: the entry runs in the full sequence and not in the pre sequence.
    new_imports: []
  - file: tests/test_contracts_schema.py
    action: Modify
    purpose: A Class A document with realization.retired validates; a retired value that is not a list of strings is refused.
    new_imports: []
  - file: tests/checks/contracts/test_telemetry_top_level_agent_run.py
    action: Modify
    purpose: >-
      Line 122's pin moves to the new state with the same fields: set(realization.retired["rec-4711"]) >=
      {"lambda_request_id", "findings_count"} (weakening_dispositions).
    new_imports: []
bundled_recommendations: [rec-4606]
followon_recs: []
infrastructure_dependencies:
  - "None: no IAM, Terraform, DDL, producer, reader or deploy; config/lambda/ducklake/field_semantics.yaml stays byte-identical."
acceptance_criteria:
  - >-
    The 14 columns are retired stubs under their table's drop rec, and no stored telemetry field is owned by the hold
    label or by a criterion whose text does not name it (validate_telemetry_field_realization passes and its new
    mutations fail).
  - config/lambda/ducklake/field_semantics.yaml is unchanged, so the writer and the deployed artifacts are unchanged.
  - >-
    The full-tier owner check passes on the live warehouse, and fails on a closed owner rec, a rec that does not name its
    field, a missing rec, or a reader error.
  - rec-4606 closes through the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The realization rules, including the new retired, naming and hold-label rules, and the owner check's pure function and wrapper.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_telemetry_field_realization.py tests/test_contracts_schema.py tests/checks/contracts/test__manifest.py -q
    expected: exit 0; before the build test_closed_rec_owner_is_reported and the new DEFECTS ids do not exist (collection error or failures).
    fix_if: a planted defect passes, or the live repository fails a rule
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: telemetry-field-owner-liveness
  - step: 2
    phase: pre-deploy
    action: Tests that pin the touched fields still hold (agent-run shape, event-journal shape, lifecycle friction wording, annotate link row write, write-time conformance).
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_telemetry_top_level_agent_run.py
      tests/checks/contracts/test_telemetry_event_journal_contracts.py tests/telemetry/test_contract_lifecycle_friction.py
      tests/telemetry/test_annotate_link_row_write.py tests/checks/contracts/test_write_time_enforcement_conformance.py -q
    expected: exit 0 (the friction pin on time_lost_seconds and the coverage_after required_when pin pass unchanged).
    fix_if: a stub lost the rules-file sentence or its 2026-10-05 row, or coverage_after's dq_intent changed
    hermetic: true
    expected_literals: [" passed"]
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: The writer config is byte-identical and the contract checks pass.
    command: >-
      bin/venv-python -m scripts.schema_to_field_semantics --check && git diff --exit-code origin/main --
      config/lambda/ducklake/field_semantics.yaml && bin/venv-python -m scripts.validate --only validate_telemetry_field_realization
      && bin/venv-python -m scripts.validate --only validate_contract_drift
    expected: exit 0; no diff on field_semantics.yaml; both checks PASS.
    fix_if: a stub changed type, iceberg_type, nullable or dq_intent (restore it), or a description change lacks its field row
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads git and the working tree; the drift and realization checks already run in both tiers, and step 1 carries the durable rules.
  - step: 4
    phase: pre-deploy
    action: The owner check against the live warehouse (every owner rec open and naming its fields).
    command: AWS_PROFILE=agent_platform bin/venv-python -m scripts.validate --only validate_telemetry_field_owners
    expected: PASS naming the owner recs examined (rec-4031, rec-4599, rec-4600, rec-4601, rec-4711, rec-5483, rec-5484, and rec-5270 when re-owned).
    fix_if: an owner rec is closed or does not name a field it owns; fix the rec text through the portal (update_rec) or the realization owner, never the check
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A live warehouse read; the check itself runs in the full tier every merge, and step 1 graduates its logic.
  - step: 5
    phase: pre-deploy
    action: Stale-reference sweep for the retired hold label.
    command: "! grep -rn 'held:feedback-loop-gate' docs/contracts scripts/checks src"
    expected: exit 0 (no match).
    fix_if: a populated_by or the grammar still names the hold label
    hermetic: true
    expected_literals: []
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 (including validate_telemetry_field_owners) and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and step 1 carries the durable regressions.
  - step: 7
    phase: post-deploy
    action: rec-4606 is closed by the merge's Resolves trailer (its acceptance is a node id this build creates).
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import
      fetch_recs_by_ids,make_reader;r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-4606']);
      st=r[0]['status'] if r else None;assert not m and st=='closed', (m, st);print('REC_CLOSED')"
    expected: REC_CLOSED.
    fix_if: >-
      Still open: read the ci.yml closure job's log for this merge (a missing Resolves trailer, or an acceptance verdict
      other than pass); fix the cause and close through the portal with the merge sha as evidence.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/contracts/validate_telemetry_field_realization.py
    behavior: retired placement, the hold label refused, criterion and rec owners must name their fields, closed owners fail, reader errors fail closed
    verification_step: 1
    test_selector: tests/checks/contracts/test_validate_telemetry_field_realization.py::test_closed_rec_owner_is_reported
    red_green_expectation: red before (the test and owner_errors do not exist), green after
  - source: scripts/contracts_schema.py
    behavior: Realization accepts retired and refuses a malformed one
    verification_step: 1
    test_selector: tests/test_contracts_schema.py
    red_green_expectation: red before (extra=forbid refuses retired), green after
  - source: scripts/checks/contracts/_manifest.py
    behavior: the owner check is a full-tier-only entry
    verification_step: 1
    test_selector: tests/checks/contracts/test__manifest.py::TestTelemetryFieldOwnersRegistered
    red_green_expectation: red before (no entry), green after
  - source: docs/contracts/telemetry_sessions.yaml
    behavior: the six sessions columns are retired under rec-4599 and the link columns have a naming owner
    verification_step: 1
    test_selector: tests/checks/contracts/test_validate_telemetry_field_realization.py::test_live_retired_columns_are_stubs
    red_green_expectation: red before (no retired key), green after
  - source: docs/contracts/telemetry_observations.yaml
    behavior: the three observations columns are retired under rec-4600; cost_usd_reported and exit_code have naming owners
    verification_step: 1
    test_selector: tests/checks/contracts/test_validate_telemetry_field_realization.py::test_live_retired_columns_are_stubs
    red_green_expectation: red before, green after
  - source: docs/contracts/telemetry_agents.yaml
    behavior: the three agents columns are retired under rec-4711; the work metrics are owned by rec-5484
    verification_step: 1
    test_selector: tests/checks/contracts/test_validate_telemetry_field_realization.py::test_live_retired_columns_are_stubs
    red_green_expectation: red before, green after
  - source: docs/contracts/telemetry_transcripts.yaml
    behavior: token_count and rec_id are retired under rec-4601
    verification_step: 1
    test_selector: tests/checks/contracts/test_validate_telemetry_field_realization.py::test_live_retired_columns_are_stubs
    red_green_expectation: red before, green after
