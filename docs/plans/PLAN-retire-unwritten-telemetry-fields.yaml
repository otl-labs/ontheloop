acceptance_criteria:
  - >-
    The 14 columns are retired stubs under their table's drop rec, and no stored telemetry field is owned by the hold
    label or by a criterion whose text does not name it (validate_telemetry_field_realization passes and its new
    mutations fail).
  - config/lambda/ducklake/field_semantics.yaml is unchanged, so the writer and the deployed artifacts are unchanged.
  - >-
    The full-tier owner check passes on the live warehouse, and fails on a closed owner rec, a rec that does not name its
    field, a missing rec, or any reader error.
  - rec-4606 closes through the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The new tests (closed owner reported, per rec-4606; live retired columns are stubs; retired schema shape; full-tier
      entry; hold label refused; criterion must name its field; retired and produced are exclusive).
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_telemetry_field_realization.py::test_closed_rec_owner_is_reported
      tests/checks/contracts/test_validate_telemetry_field_realization.py::test_live_retired_columns_are_stubs
      tests/test_contracts_schema.py::test_realization_retired_shape
      tests/checks/contracts/test__manifest.py::TestTelemetryFieldOwnersRegistered
      'tests/checks/contracts/test_validate_telemetry_field_realization.py::test_each_rule_fails_closed[R7-held-label]'
      'tests/checks/contracts/test_validate_telemetry_field_realization.py::test_each_rule_fails_closed[R7-criterion-not-named]'
      'tests/checks/contracts/test_validate_telemetry_field_realization.py::test_each_rule_fails_closed[R1-retired-and-produced]' -q
    expected: exit 0; before the build the seven named new tests do not exist, so pytest exits 4 (target absent).
    fix_if: a planted defect passes, or the live repository fails a rule
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: telemetry-field-owner-liveness
  - step: 2
    phase: pre-deploy
    action: >-
      The whole realization, schema and manifest test files (every planted defect, naming, hold-label and outage test), and
      the tests that pin the touched fields (agent-run shape, event-journal shape, lifecycle friction wording, annotate link
      row write, write-time conformance).
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_telemetry_field_realization.py tests/test_contracts_schema.py
      tests/checks/contracts/test__manifest.py tests/checks/contracts/test_telemetry_top_level_agent_run.py
      tests/checks/contracts/test_telemetry_event_journal_contracts.py tests/telemetry/test_contract_lifecycle_friction.py
      tests/telemetry/test_annotate_link_row_write.py tests/checks/contracts/test_write_time_enforcement_conformance.py
      tests/checks/ci_guards/test_validate_ci_rca_taxonomy.py::TestValidateCiRcaTaxonomy::test_complete_map_passes -q
    expected: exit 0 (the friction pin on time_lost_seconds and the coverage_after required_when pin pass unchanged).
    fix_if: a planted defect passes, a stub lost the rules-file sentence or its 2026-10-05 row, or coverage_after's dq_intent changed
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Regression suites already green on the unbuilt tree; the new rules graduate through step 1, and these files run in
      both tiers on every change that touches them.
  - step: 3
    phase: pre-deploy
    action: The writer config is byte-identical, and the contract and size checks pass (all four contracts at or under their line and byte budgets).
    command: >-
      bin/venv-python -m scripts.schema_to_field_semantics --check && git diff --exit-code origin/main --
      config/lambda/ducklake/field_semantics.yaml && bin/venv-python -c "import sys; from scripts.checks.contracts.validate_telemetry_field_realization import
      validate_telemetry_field_realization as f; from scripts.checks.contracts.validate_contract_drift import
      validate_contract_drift as g; from scripts.checks.structural.size_limits import validate_structural_size_limits as h;
      e = []; f(e); g(e); h(e); print(e or 'PASS'); sys.exit(bool(e))"
    expected: exit 0; no diff on field_semantics.yaml; all three checks PASS.
    fix_if: >-
      a stub changed type, iceberg_type, nullable or dq_intent (restore it), a description change lacks its field row, or
      a contract is over a budget (shorten stub wording; never raise a budget)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads git and the working tree; the drift and realization checks already run in both tiers, and step 1 carries the durable rules.
  - step: 4
    phase: pre-deploy
    action: The owner check against the live warehouse (every owner rec open and naming its fields).
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "import sys; from scripts.checks.contracts.validate_telemetry_field_realization import
      validate_telemetry_field_owners as f; e = []; f(e); print(e or 'PASS'); sys.exit(bool(e))"
    expected: PASS naming the owner recs examined (rec-4031, rec-4599, rec-4600, rec-4601, rec-4711, rec-5483, rec-5484, and rec-5270 when re-owned).
    fix_if: an owner rec is closed or does not name a field it owns; fix the rec text through the portal (update_rec) or the realization owner, never the check
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A live warehouse read; the check itself runs in the full tier every merge, and step 1 graduates its logic.
  - step: 5
    phase: pre-deploy
    action: Stale-reference sweep for the retired hold label.
    command: "! grep -rnI --include='*.py' --include='*.yaml' 'held:feedback-loop-gate' docs/contracts scripts/checks src"
    expected: exit 0 (no match).
    fix_if: a populated_by or the grammar still names the hold label
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      The lasting rule (the owner grammar refuses the hold label) graduates through step 1's R7-held-label node; this
      sweep only catches stale prose naming it.
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 (including validate_telemetry_field_owners) and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and step 1 carries the durable regressions.
  - step: 7
    phase: post-deploy
    action: rec-4606 is closed by the merge's Resolves trailer (its acceptance is a node id this build creates).
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import
      fetch_recs_by_ids,make_reader;r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-4606']);
      st=r[0]['status'] if r else None;assert not m and st=='closed', (m, st);print('REC_CLOSED')"
    expected: REC_CLOSED.
    fix_if: >-
      Still open: read the ci.yml closure job's log for this merge (a missing Resolves trailer, or an acceptance verdict
      other than pass); fix the cause and close through the portal with the merge sha as evidence.
    hermetic: false
    graduation: not-applicable
