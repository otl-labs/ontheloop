    fix_if: a populated_by or the grammar still names the hold label
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      The lasting rule (the owner grammar refuses the hold label) graduates through step 1's R7-held-label node; this
      sweep only catches stale prose naming it.
  - step: 6
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and step 1 carries the durable regressions.
  - step: 7
    phase: post-deploy
    action: rec-4606 is closed by the merge's Resolves trailer (its acceptance is a node id this build creates).
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import
      fetch_recs_by_ids,make_reader;r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-4606']);
      st=r[0]['status'] if r else None;assert not m and st=='closed', (m, st);print('REC_CLOSED')"
    expected: REC_CLOSED.
    fix_if: >-
      Still open: read the ci.yml closure job's log for this merge (a missing Resolves trailer, or an acceptance verdict
      other than pass); fix the cause and close through the portal with the merge sha as evidence.
    hermetic: false
    graduation: not-applicable
