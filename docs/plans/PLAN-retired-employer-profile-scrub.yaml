  test_selector: tests/test_retired_employer_profile.py
  red_green_expectation: red before (file absent; today's default is the retired token), green after
- source: scripts/build_lambda.py
  behavior: --profile defaults to None and main() resolves it by the repo rule; an explicit value, including "", wins
  verification_step: 2
  test_selector: tests/test_retired_employer_profile.py
  red_green_expectation: red before (default is the retired token), green after
- source: scripts/build_lambda_deploy.py
  behavior: the DuckLake build passes its resolved profile through with no remap
  verification_step: 2
