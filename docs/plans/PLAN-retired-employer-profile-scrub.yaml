schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: retired-employer-profile-scrub
intent: >-
  Remove the retired company-aws-profile token (the AWS CLI profile of the founder's former employer's account,
  retired in the 2026-05 migration) from live code, tests, config and living roadmap text, now that "company" means
  On The Loop Labs Limited (Decision 195). The two scripts that still default to it resolve the profile through the
  repo's existing scripts/aws_profile.py rule, a standing check stops the token returning, and Decision 113 gains a
  dated clarification. Closes rec-3924.
implementation_declared: true
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-retired-employer-profile-scrub.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-3924, a Decision 195 follow-on owned by the company migration
  project. No tier_item criterion claimed; T5.2 is renamed and its criteria reformatted, never re-scoped.
scope:
- file: scripts/run_scheduled_agent.py
  action: Modify
  purpose: >-
    _trigger_lambda and _smoke_test's S3 verify step stop defaulting AWS_PROFILE to the retired token; each builds its
    profile argv from scripts.aws_profile.resolve_aws_profile() (lazy import, the repo's precedent), omitting
    --profile when it returns None.
- file: scripts/build_lambda.py
  action: Modify
  purpose: >-
    --profile default None, resolved once in main() to resolve_aws_profile() or "" (explicit values, including "",
    win). Drop the _resolve_ducklake_profile facade import and its two call sites.
- file: scripts/build_lambda_deploy.py
  action: Modify
  purpose: Delete _resolve_ducklake_profile (it becomes the identity function) and its mention in the module docstring.
- file: tests/test_retired_employer_profile.py
  action: Create
  purpose: >-
    Red-before/green-after tests for both scripts' profile resolution (env cleared, AWS_PROFILE set, environment
    credentials present, explicit override), and the DuckLake passthrough. Never spells the retired token.
- file: tests/test_build_lambda.py
  action: Modify
  purpose: Remove the _resolve_ducklake_profile row from the facade identity map.
- file: tests/build_lambda_deploy/test_canary_layers.py
  action: Modify
  purpose: >-
    Retire TestResolveDucklakeProfile's two mapping tests with the function; the orchestrator test passes an explicit
    profile through unchanged (renamed to say so).
- file: tests/build_lambda_deploy/test_update_functions.py
  action: Modify
  purpose: Arbitrary profile value becomes "test-profile".
- file: tests/build_lambda_deploy/test_bucket_argv.py
  action: Modify
  purpose: Arbitrary profile value becomes "test-profile".
- file: tests/sync/recommendations/test_sync_recommendations.py
  action: Modify
  purpose: Arbitrary profile value becomes "test-profile".
- file: docs/contracts/build-lambda.yaml
  action: Modify
  purpose: The flag-defaults comment names the new --profile resolution (operator-approved wording W4).
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    NS.2 phrase plus a dated note (W2); T5.2 name (W3) and its three exit criteria converted to {id, status: open,
    text} objects with text unchanged (Decision 136). Nothing else in the file changes.
- file: config/agent/verification_registry/entries/ns2-names-owning-entity.yaml
  action: Modify
  purpose: The second required term changes from the retired token to "former employer"; still two required terms.
- file: config/agent/verification_registry/entries/retired-employer-profile-absent.yaml
  action: Create
  purpose: Graduation record for VP step 1 (command_exit_zero).
- file: config/agent/verification_registry/entries/retired-employer-profile-defaults.yaml
  action: Create
  purpose: Graduation record for VP step 2 (test_selector on tests/test_retired_employer_profile.py).
- file: docs/DECISIONS.md
  action: Modify
  purpose: Decision 113 gains the operator-approved "> **Update (2026-10-21):**" line (W1); no other byte changes.
- file: docs/plans/PLAN-retired-employer-profile-scrub.yaml
  action: Modify
  purpose: implementation_declared flips to true in the build PR.
bundled_recommendations:
- rec-3924
followon_recs:
- rec-4544
- rec-4547
- rec-4548
infrastructure_dependencies:
- >-
  data-pipeline (src/lambdas/data-pipeline/manifest.yaml, active) packages scripts/run_scheduled_agent.py and
  docs/ROADMAP-PLATFORM.yaml. run_scheduled_agent.py is in deploy-prod-lambdas.yml's push filter, so the merge runs
  the governed deploy and smoke of the scheduled-agent dispatcher and findings processor (VP step 9). The roadmap
  asset has no deploy trigger (rec-3990). No other scope file is Lambda-packaged; no .tf file is in scope.
acceptance_criteria:
- No tracked file under scripts/, src/, tests/, config/, bin/, .github/, .claude/, docs/contracts/ or terraform/ names the retired profile (VP step 1); rec-3924's amended, decidable oracle passes (VP steps 4 and 11).
- With AWS_PROFILE and environment credentials unset, run_scheduled_agent's invoke and S3 verify commands and build_lambda's resolved profile are agent_platform; AWS_PROFILE overrides both; under environment credentials no --profile flag is passed; an explicit build_lambda --profile, including "", is honoured.
- _resolve_ducklake_profile is no longer defined or referenced in scripts/, src/ or tests/ other than the new absence assertion; the DuckLake build passes its profile through unchanged.
- NS.2, T5.2, the build-lambda.yaml comment and Decision 113 carry exactly the approved wording W1-W4; ns2-names-owning-entity still asserts two terms and passes.
- The governed deploy-prod-lambdas run on the merge commit deploys and its smoke job succeeds (not skipped); rec-3924 is closed.
verification_plan:
- step: 1
  phase: pre-deploy
  action: No tracked code, config or workflow file names the retired profile
  command: >-
    bash -c "! git grep -nE 'company-aws-profil[e]' -- 'scripts/**' 'src/**' 'tests/**' 'config/**' 'bin/**'
    '.github/**' '.claude/**' 'docs/contracts/**' 'terraform/**'"
  expected: exit 0 with no output; on today's tree it lists the four script defaults, the test values and the build-lambda.yaml comment (red)
  fix_if: any hit -- remove it; never narrow the pathspecs or exempt a file
  hermetic: true
  graduation: graduate
  graduation_check_id: retired-employer-profile-absent
- step: 2
  phase: pre-deploy
  action: Both scripts resolve the profile by the repo rule
  command: bin/venv-python -m pytest tests/test_retired_employer_profile.py -q
  expected: every test passes; on today's tree the file does not exist (red)
  fix_if: a case fails -- fix the script, never the expectation
  hermetic: false
  graduation: graduate
  graduation_check_id: retired-employer-profile-defaults
- step: 3
  phase: pre-deploy
  action: The touched and neighbouring suites stay green
  command: >-
    bin/venv-python -m pytest tests/test_build_lambda.py tests/build_lambda_deploy tests/test_run_scheduled_agent.py
    tests/sync/recommendations/test_sync_recommendations.py tests/platform_roadmap_state tests/decisions_md -q
  expected: every test passes
  fix_if: a failure -- fix on the branch; never delete a test outside the two retired mapping tests
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Runs existing suites that CI already runs on every PR; steps 1-2 carry the new durable guards.
- step: 4
  phase: pre-deploy
  action: rec-3924's amended acceptance oracle holds, and the deleted remap helper is named nowhere in code or tests
  command: |-
    ! grep -rqn 'company-aws-profile' scripts/ tests/ && grep -q 'resolve_aws_profile' scripts/build_lambda.py && ! git grep -n _resolve_ducklake_profile -- 'scripts/**' 'src/**' 'tests/**' ':!tests/test_retired_employer_profile.py'
  expected: exit 0 with no output
  fix_if: >-
    a hit -- remove it, including the module docstring mention in scripts/build_lambda_deploy.py (a hit only in a
    __pycache__ file is stale bytecode; delete the cache and rerun)
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    The token half duplicates step 1's graduated guard over a narrower path set and the anchor half is the rec's own
    oracle; the helper-name half is a one-time removal proof that step 2's attribute-absence test guards durably.
- step: 5
  phase: pre-deploy
  action: Roadmap text carries W2 and W3 and the NS.2 check passes
  command: &roadmap_check |-
    bin/venv-python -c "import sys,yaml; r=yaml.safe_load(open('docs/ROADMAP-PLATFORM.yaml')); d=[p for p in r['north_star']['principles'] if p['id']=='NS.2'][0]['detail']; t=[i for i in r['tier_items'] if i['id']=='T5.2'][0]; w2='is distinct from the founder\x27s former employer\x27s shared work account that T5.2 tears down;'; note='[Amendment 2026-10-21, rec-3924: the former employer\x27s retired AWS profile name is replaced by a plain description; meaning unchanged.]'; crit=['30 days elapsed since T2.1 + T2.2 completion (both completed 2026-05-28/29; grace elapses ~2026-06-28)', 'Old account S3 buckets / data tables / DynamoDB tables removed or marked for retention if needed', 'Cost-report confirms zero billing in old account post-teardown']; ok=('On The Loop Labs Limited' in d and w2 in d and d.endswith(' ' + note) and 'company-aws' not in d and t['name']=='Former-employer AWS account teardown (30d grace)' and [(c.get('id'), c.get('status'), c.get('text')) for c in t['exit_criteria']]==[('c' + str(n), 'open', x) for n, x in enumerate(crit, 1)]); print('ROADMAP_OK' if ok else 'ROADMAP_BAD'); sys.exit(0 if ok else 1)"
  expected: ROADMAP_OK
  fix_if: ROADMAP_BAD -- fix NS.2 and T5.2 to W2/W3 exactly; the three criteria texts are the literals in the command, unchanged from main
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    T5.2 leaves the live roadmap under rec-4544 (Decision 227 archival), so a standing T5.2-keyed guard would go red on
    that planned move; NS.2's lasting content is guarded by ns2-names-owning-entity's two positive terms, and the
    token's absence from code and config by step 1.
- step: 6
  phase: pre-deploy
  action: >-
    Decision 113 carries the full W1 line once, docs/DECISIONS.md has no deleted line, the roadmap archive is untouched,
    and build-lambda.yaml carries W4
  command: |-
    test "$(grep -cxF $'> **Update (2026-10-21):** "company-account (company-aws-profile)" above names the founder\'s former employer\'s AWS account, retired in the 2026-05 migration (T2.3; Decision 24\'s update), per the operator\'s confirmation of 2026-10-21 (rec-3924). It is not an account of On The Loop Labs Limited (Decision 195). This entry sets no requirement for how that company\'s accounts authenticate; that stays with this entry\'s reversal condition and Decision 195 clause 3.' docs/DECISIONS.md)" = 1 && test "$(git diff --numstat origin/main -- docs/DECISIONS.md | cut -f2)" = 0 && git diff --quiet origin/main -- docs/ROADMAP-PLATFORM-ARCHIVE.yaml && grep -qxF '# Flag DEFAULTS (--profile: $AWS_PROFILE else agent_platform via scripts.aws_profile.resolve_aws_profile; --region=eu-west-2) are OUT of registry scope.' docs/contracts/build-lambda.yaml
  expected: exit 0
  fix_if: >-
    a removed line -- restore it (Decision 177 append-only); a missing or doubled W1 line, or a W4 line that does not
    match whole -- fix to the approved text exactly
  hermetic: false
  graduation: waive
  graduation_waiver_reason: PR-relative diff check; a standing guard would pin one annotation line for no lasting benefit.
- step: 7
  phase: pre-deploy
  action: Fast tier before push
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0, including validate_graduation_completeness, validate_decisions_index_freshness and validate_platform_roadmap
  fix_if: any failure -- fix on the branch
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole fast-tier run; graduate steps may not invoke scripts.validate (recursion).
- step: 8
  phase: pre-deploy
  action: Full tier, then HEAD attestation, before commit and push (handoff_policy)
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: the full tier exits 0 and the validation result attests the current HEAD's tree
  fix_if: any failure -- fix and rerun the full tier from the start; never push on a partial or timed-out run
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The full tier cannot graduate (recursion refusal); it is the handoff gate.
- step: 9
  phase: post-deploy
  action: >-
    V3 governed deploy and smoke (Decisions 79, 126). The merge changes scripts/run_scheduled_agent.py, so
    deploy-prod-lambdas.yml runs on push; never a local build_lambda --deploy.
  command: >-
    mcp__github__actions_list(owner="benjamin-blake", repo="theseus", method="list_workflow_runs",
    resource_id="deploy-prod-lambdas.yml") for the merge commit, then mcp__github__actions_get on that run and its jobs
  expected: >-
    The run for the merge sha concluded success; the deploy job set deployed true and the smoke job concluded success,
    not skipped (a skipped smoke is not a pass). Model-ID validation is not applicable: no model config or routing is
    in scope, and the smoke asserts the dispatcher returns status disabled without a model call. If the organisation
    transfer (Decision 218) has landed by then, use owner otl-labs, repo ontheloop.
  fix_if: >-
    smoke skipped -- the deploy no-opped; read the assume-role step. Smoke or deploy failed -- stop and RCA (Decision
    55); never re-dispatch into green and never fall back to the local break-glass command.
  hermetic: false
- step: 10
  phase: post-deploy
  action: rec-3924 is closed by the squash commit's Resolves trailer
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, missing =
    fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-3924']); assert not missing and
    rows[0]['status'] == 'closed', 'rec-3924 is not closed'; print('REC-3924 CLOSED')"
  expected: REC-3924 CLOSED
  fix_if: >-
    still open -- read ci.yml's trailer-acceptance-evaluate and trailer-closure job logs on the merge commit; a fails
    verdict means the oracle does not hold at the merge sha, and an out_of_grammar verdict means the stored oracle is
    not the amended decidable one (step 11) -- RCA either way, never close around the gate (Decision 201)
  hermetic: false
- step: 11
  phase: pre-deploy
  action: rec-3924's stored acceptance is the amended, decidable oracle that the trailer gate can evaluate
  command: |-
    bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; from scripts.executor.acceptance_lint import lint_acceptance_command as L; from scripts import rec_trailer_acceptance as T; rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-3924']); assert L(rows[0]['acceptance'], require_decidable=True)[0] and T.census(['rec-3924'], rows=rows)[0]['bucket'] == 'probeable'; print('REC_ORACLE_DECIDABLE')"
  expected: REC_ORACLE_DECIDABLE
  fix_if: >-
    the stored acceptance is still the bare negated grep -- stop and return to the planning thread; the oracle is
    amended there with the operator's word, never by the build
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Reads live warehouse state (the rec's stored acceptance); credential-dependent, not kernel-expressible as a standing check.
