constraints:
- "W1-W4 are operator-approved wording (Decision text, a north star per Decision 196, contract text): land them byte-for-byte; any other change to them goes back to the operator through the planning thread."
- "Freeze: the build starts only on the operator's own word in the build thread, and that ask names the governed prod Lambda deploy the merge triggers."
- "Historical records stay byte-identical: Decision 24, every other Decision body (Decision 177), docs/plans/, docs/ROADMAP-PLATFORM-ARCHIVE.yaml and the archived T2.3 stub."
- "No local build_lambda --deploy or --smoke-test run: the routine deploy is the governed channel (Decisions 125, 126)."
- "Public repo (AGENTS.md PUBLIC repository section; Decisions 73, 83, 101): no employer name, account id or ARN anywhere; the wording stays generic."
- "Never weaken a check to get green (Decision 181); the two retired mapping tests go with the function they tested."
- No rescue agents or workaround loops (Decision 55).
context:
- "Decision-scout verdict: FLAGS_FOUND. CITE: Decisions 79, 126, 113, 195, 101, 177, 196, 132, 189, 181, 201. Decisions triaged: 183 of 183. Roadmap items intersected: 6; CONFLICT: 0; RELATED: 6"
- "gates: decision-scout=FLAGS_FOUND; plan-critique=PROCEED after 3 round(s); round 3 on the operator's word (r1 REVISE, 8 findings fixed; r2 REVISE, 7 fixed and rec-3924's oracle amended; r3 PROCEED: F1 weakening list, F2 VP 11 scheduled, F3 criterion wording, F4 citation, F6 guard pathspecs applied; F5 filed as rec-4548)"
- "Scout flags resolved: Decision 136 (touched T5.2 keeps bare-string criteria) -> format-only conversion; Decision 125 (a bare local build_lambda --deploy now reaches a working profile instead of failing) -> accepted: break-glass status is enforced by docs/contracts/deploy-paths.yaml and AGENTS.md, never by a broken default; CI keeps --profile \"\"."
- "Operator approvals (Benjamin): 2026-10-21 cmsg_017f94mmYqSe3q2p9o6tPW3UPG9zJ1pL6GwgkYer99BkNd (the token is the previous employer's; scrub it); 2026-10-21 14:26Z cmsg_017f94mmYqSe3q2p9o6tPW3U1P2mvjgZqkZqejHzom3eUc ('happy with all of the wording, write the plan'; no access to the former employer's account): this design, roadmap scrubbed here, W1-W4 as in execution_steps. Variance: none; every date lands as 2026-10-21 whatever the landing day (the operator's confirmation date), so VP steps 5 and 6 pin it. Presentation /mnt/project-files/old-employer-profile-scrub/step6b-presentation.md; ADVICE.md; scout-report.md."
- "rec-3924's acceptance oracle was amended through the portal on 2026-10-22 on the operator's word (cmsg_017f94mmYqSe3q2p9o6tPW3U5zCKmgST2AEwrZCe1rRMmZ, 'one more round, amend the oracle'): the stored bare negated grep was out_of_grammar at the trailer gate (critique round 2 F1); VP 4 and VP 11 read the amended one."
- "Out of scope, filed: rec-4547 (critique F7) -- once the default resolves, run_scheduled_agent --smoke-test's local build_lambda --deploy leg reaches a working profile; never run it (constraints), and rec-4547 retires or gates it."
- "Out of scope, filed: rec-4548 (critique round 3 F5) -- publish_canary_layers builds a raw --profile pair, so under environment credentials it would pass --profile \"\"; it failed there before this plan too (agent_platform), its only caller is local, and the fix is a one-line switch to _aws_profile_args."
- "T5.2 retirement (no access, so its teardown cannot be done) is rec-4544, deliberately outside this plan: G.10 is pinned by tests/platform_roadmap_state/test_state_dict_and_feeds.py and retirement triggers the Decision 227 archival move."
- "Decision 101(b) reading: its frozen rows (restated by Decision 171 clause 1) are the agent-platform-* names, the agent_platform profile and Glue database and project_id; the retired token is not among them, so rec-3924's premise that 101(b) froze it is mistaken. The new default lands on the frozen agent_platform row."
- "Why resolve_aws_profile: it is the registered reader of clouds.aws.profile (Decision 224) and the session hook's rule; _smoke_test spawns build_lambda --deploy without --profile (run_scheduled_agent.py:290), so both defaults must follow one rule. In the ADMIN container AWS_PROFILE=agent_platform_admin, so a local run there uses the admin role like every other repo script."
- "Lazy imports of scripts.aws_profile follow scripts/checks/_scaffolding.py:329 and scripts/ducklake_smoke/core.py:101; aws_profile.py is itself packaged (build_lambda_config.py:98) and must not be edited (it is in deploy-prod-lambdas.yml's filter)."
- "Overlap: docs/ROADMAP-PLATFORM.yaml is a rec-3903 sweep pin (descriptive_literals); this plan never touches its old-identity line, so the pin and the sweep's count checks stay valid. The AWS account path plan rebases onto this one and keeps ns2-names-owning-entity's two terms (told 2026-10-21)."
- "Retired-token pattern in step 1 is bracketed so the registry row does not match itself; new tests assert positive values and never spell the token."
- "CI-RCA: no open critical rec at plan start (ci_rca_unresolved_recs empty); red_overlap verdict clear, reds [] (2026-10-21)."
pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- only the plan-cited decision sections
- All files in scope located and readable
- Acceptance criteria understood and verifiable
- The operator's freeze word for this build is in the build thread
execution_steps:
- |-
  scripts/run_scheduled_agent.py -- in _trigger_lambda and in _smoke_test's S3 verify step, replace
  `profile = os.environ.get("AWS_PROFILE", ...)` with a function-local
  `from scripts.aws_profile import resolve_aws_profile  # noqa: PLC0415` and `profile = resolve_aws_profile()`, and
  replace the `"--profile", profile,` argv pair with `*(["--profile", profile] if profile else []),`. Nothing else in
  the file changes.
- |-
  scripts/build_lambda.py -- `--profile` default None with help "AWS CLI profile (default: $AWS_PROFILE, else
  agent_platform; none under environment credentials)"; in main(), directly after parse_args(), add
  `if args.profile is None: args.profile = resolve_aws_profile() or ""` with a top-level
  `from scripts.aws_profile import resolve_aws_profile`; delete the `_resolve_ducklake_profile` facade import and the
  two `args.profile = _resolve_ducklake_profile(args.profile)` lines (in _run_ducklake_build and the
  --ducklake-publish-canary-layers branch).
- scripts/build_lambda_deploy.py -- delete _resolve_ducklake_profile and drop its name from the module docstring's list.
- |-
  tests/test_retired_employer_profile.py -- create. Clear AWS_PROFILE, AWS_ACCESS_KEY_ID and AWS_LAMBDA_FUNCTION_NAME with
  monkeypatch.delenv(raising=False) in every case. run_scheduled_agent: patch subprocess.run, tempfile.mkstemp, open,
