schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: retired-repo-identity-sweep
intent: >-
  After the GitHub transfer-and-rename is proven, move every forward-standing reference to the retired repository
  identity (benjamin-blake/theseus) to otl-labs/ontheloop and forbid the old identity from then on (rec-3903;
  Decision 218; docs/contracts/github-org-transfer.yaml breakage_map rows dependabot_repository_guard,
  owner_literal_defaults, codeowners, descriptive_literals), so no script, workflow, contract or document relies on
  GitHub's redirect from the old path.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-retired-repo-identity-sweep.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- resolves rec-3903 (Medium). Post-transfer: the last removal step of
  docs/contracts/github-org-transfer.yaml phases.predecessor_removal (the contract's order, kept by the operator on
  2026-10-15). No tier_item criterion claimed.
closes_criteria: []
scope:
- file: .github/workflows/dependabot-auto-merge.yml
  action: Modify
  purpose: The auto-merge job gate names only otl-labs/ontheloop (breakage_map.dependabot_repository_guard, old name dropped).
- file: tests/checks/ci_guards/test_validate_dependabot_automation.py
  action: Modify
  purpose: >-
    _JOB_IF and the line-245 fixture move to the target-only gate; the real-workflow test that
    PLAN-repo-identity-transfer-readiness added becomes test_real_auto_merge_gate_names_only_the_target.
- file: scripts/repo_identity.py
  action: Modify
  purpose: FALLBACK_FULL_NAME becomes otl-labs/ontheloop (breakage_map.owner_literal_defaults).
- file: tests/test_repo_identity.py
  action: Modify
  purpose: The unset/malformed-environment fallback assertions name otl-labs/ontheloop.
- file: tests/checks/misc/test_validate_ghas_probe.py
  action: Modify
  purpose: >-
    TestDefaultRepoSlug's env-unset default assertion and the readiness plan's
    test_malformed_repository_falls_back_to_the_default name otl-labs/ontheloop.
- file: scripts/convergence_health/escalate.py
  action: Modify
  purpose: _ACCEPTANCE_STUCK_APPROVAL's gh api path names otl-labs/ontheloop.
- file: tests/convergence_health/test_escalate.py
  action: Modify
  purpose: Add test_stuck_approval_acceptance_names_the_new_repository (red before, green after).
- file: scripts/telemetry_verify/completeness.py
  action: Modify
  purpose: >-
    REPOSITORIES keeps only otl-labs/ontheloop (breakage_map.owner_literal_defaults; both full names accepted before
    the sweep, the old one dropped after, as the dependabot gate; amended 2026-10-20, #1568).
- file: tests/telemetry_verify/test_completeness.py
  action: Modify
  purpose: >-
    The shared in-scope URL fixture names otl-labs/ontheloop; add test_only_the_target_repository_is_in_scope (red
    before, green after).
- file: .github/workflows/ghas-probe.yml
  action: Modify
  purpose: The GHAS_PROBE_TOKEN scope comment names otl-labs/ontheloop.
- file: COMMERCIAL-LICENSE.md
  action: Modify
  purpose: The issues URL names otl-labs/ontheloop (operator-approved wording).
- file: config/agent/verification_registry/entries/licensed-work-mark-and-historical-split.yaml
  action: Modify
  purpose: Its COMMERCIAL-LICENSE.md issues-URL assertion names otl-labs/ontheloop (same PR as the text, Decision 132/176).
- file: config/agent/verification_registry/entries/roadmap-retired-brand-tokens-absent.yaml
  action: Modify
  purpose: Asserts zero benjamin-blake/theseus and at least one otl-labs/ontheloop in docs/ROADMAP-PLATFORM.yaml.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: The OIDC tier item's exit criterion names otl-labs/ontheloop (precedent PLAN-repo-rename-relicense).
- file: docs/contracts/package-registry-reservation.yaml
  action: Modify
  purpose: pypi_trusted_publisher.repository names otl-labs/ontheloop, plus the approved amendment_log entry.
- file: tests/test_ontheloop_placeholder_packages.py
  action: Modify
  purpose: test_publish_workflow_shape_and_trust_triple asserts the trust triple's repository is otl-labs/ontheloop.
- file: packages/ontheloop-js-scoped/package.json
  action: Modify
  purpose: Description and repository URL name otl-labs/ontheloop (source only; nothing is republished).
- file: packages/ontheloop-js/package.json
  action: Modify
  purpose: Description and repository URL name otl-labs/ontheloop (source only).
- file: packages/ontheloop-py/pyproject.toml
  action: Modify
  purpose: Description and Repository URL name otl-labs/ontheloop (source only).
- file: packages/ontheloop-py/src/ontheloop/__init__.py
  action: Modify
  purpose: Module docstring URL names otl-labs/ontheloop.
- file: packages/ontheloop-rs/Cargo.toml
  action: Modify
  purpose: Description and repository URL name otl-labs/ontheloop (source only).
- file: packages/ontheloop-rs/src/lib.rs
  action: Modify
  purpose: Crate doc comment URL names otl-labs/ontheloop.
- file: terraform/github/CLAUDE.md
  action: Modify
  purpose: >-
    The module subject line names otl-labs/ontheloop, and the first-time import instructions name the repository
    ontheloop (operator-approved 2026-10-15; net 0 bytes against its prose budget: -4 on line 6, +2 on each import line).
- file: scripts/checks/hygiene/validate_licence_consistency.py
  action: Modify
  purpose: >-
    Docstring line 13 reads "agent-platform -> theseus under the same owner" instead of naming the retired full
    name; meaning and code unchanged.
- file: bin/setup-cloud-env.sh
  action: Modify
  purpose: >-
    The operator comment names the post-rename checkout directory (cd /home/user/ontheloop); comment-only. The
    GitHub MCP token comment is not swept: PLAN-github-transfer-credential-prestage retired that token (2026-10-21).
- file: scripts/checks/contracts/_retired_identity.py
  action: Modify
  purpose: >-
    SWEEP_PINS becomes empty, so the old identity is forbidden everywhere outside the named survivors; SURVIVOR_PINS
    gains config/agent/verification_registry/entries/roadmap-retired-brand-tokens-absent.yaml, whose approved clause
    asserts the retired full name is absent and so must name it.
- file: tests/checks/contracts/test__retired_identity.py
  action: Modify
  purpose: Add test_sweep_set_is_empty (red before, green after).
bundled_recommendations:
- rec-3903
followon_recs:
- rec-4357
infrastructure_dependencies:
- >-
  data-pipeline (src/lambdas/data-pipeline/manifest.yaml, active) packages docs/ROADMAP-PLATFORM.yaml as an asset,
  so compute_affected_artifacts() reports it. NO deploy is performed or needed (Decision 198 and
  PLAN-telemetry-event-journal-contracts precedent; asserted by VP step 14; rec-3990 tracks the asset deploy-trigger
  gap). No other scope file is Lambda-packaged; no .tf file is in scope.
acceptance_criteria:
- >-
  scripts/checks/contracts/_retired_identity.py SWEEP_PINS is empty and validate_github_org_transfer passes: no
  tracked file outside historical records, the files of static rows owned by other recs, and the named permanent
  survivors names the retired identity.
- >-
  The dependabot auto-merge gate names only otl-labs/ontheloop, and the first dependabot PR after merge shows the
  auto-merge job ran rather than being skipped (or the post-deploy step records it as pending).
- scripts/repo_identity.py falls back to otl-labs/ontheloop when GITHUB_REPOSITORY is unset or malformed.
- >-
  Every swept line differs from main only by benjamin-blake/theseus -> otl-labs/ontheloop, except the approved
  edits (the bin/setup-cloud-env.sh checkout comment, validate_licence_consistency docstring line 13, the two
  terraform/github/CLAUDE.md import lines, the dependabot gate, the two registry clauses) and the plan-authored edits
  (validate_licence_consistency.py docstring lines 28-29 and inline comment line 63; the completeness monitor's
  REPOSITORIES tuple dropping the retired name and its new test); no person reference, frozen internal identifier or
  historical record changed.
- >-
  The telemetry completeness monitor treats only otl-labs/ontheloop sessions as in scope, and the sweep runs only
  once the monitor's default judged day (UTC today minus 2) is after the transfer's last evidence_ledger day, so no
  default judged window holds pre-transfer sessions.
- The two verification-registry rows change in the same PR as the text they assert; each fails on origin/main and passes on HEAD.
- rec-3903's acceptance is the operator-approved oracle, it holds at the closing sha, and rec-3903 is closed.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Preconditions: the transfer contract records the prove phase as passed and the sweep has not run yet, the old
    OIDC segment is gone from both trust lists (the first predecessor removal), the identity readiness plan is
    built, terraform/github/variables.tf no longer names the old owner, and the repository answers on its new path.
  command: >-
    bin/venv-python -c "import yaml,json,urllib.request,pathlib; c=yaml.safe_load(open('docs/contracts/github-org-transfer.yaml',encoding='utf-8'));
    ph=c['identity']['phase']; assert ph=='proven', ph;
    assert all('benjamin-blake@' not in pathlib.Path(f).read_text(encoding='utf-8') for f in ('terraform/personal/oidc.tf','terraform/bootstrap/github_ci_apply.tf'));
    assert pathlib.Path('scripts/repo_identity.py').is_file() and pathlib.Path('scripts/checks/contracts/_retired_identity.py').is_file();
    assert 'benjamin-blake' not in pathlib.Path('terraform/github/variables.tf').read_text(encoding='utf-8');
    r=json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop',timeout=30));
    assert r['full_name']=='otl-labs/ontheloop', r['full_name']; print('PRECONDITIONS_OK', ph)"
  expected: Exit 0 and PRECONDITIONS_OK printed with the phase.
  fix_if: >-
    Any assertion failing means the sweep is early (it is the last predecessor-removal step under the contract's
    order): STOP and report which precondition is unmet. Never edit the contract, the trust lists or terraform/github
    from this plan (other plans own them).
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: >-
    The sweep set on origin/main (before this change) is covered by this plan's scope, so no pinned file is left
    behind.
  command: >-
    bin/venv-python -c "import ast,subprocess,yaml; src=subprocess.check_output(['git','show','origin/main:scripts/checks/contracts/_retired_identity.py'],text=True,encoding='utf-8');
    pins=next(ast.literal_eval(n.value) for n in ast.parse(src).body if isinstance(n,(ast.Assign,ast.AnnAssign)) and getattr(n.targets[0] if isinstance(n,ast.Assign) else n.target,'id','')=='SWEEP_PINS');
    scope={e['file'] for e in yaml.safe_load(open('docs/plans/PLAN-retired-repo-identity-sweep.yaml',encoding='utf-8'))['scope']};
    missing=sorted(set(pins)-scope); print('SWEEP_SET', len(pins), 'MISSING', missing); assert pins and not missing"
  expected: Exit 0, SWEEP_SET with a positive count and MISSING [] printed.
  fix_if: >-
    A missing path means a file gained the old identity after this plan merged: STOP before editing anything and
    route a scope amendment to the planning thread (implement-scope-boundary.yaml amendment_procedure).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    A one-time bridge between the identity readiness plan's pins and this plan's scope; once origin/main's sweep set
    is empty the command fails by design, and the standing guards are validate_github_org_transfer (ungated in --pre and in the full tier) and test__retired_identity.py::test_sweep_set_is_empty (pytest_diff and the full tier); graduated registry rows re-run only when added or modified.
- step: 3
  phase: pre-deploy
  action: The sweep set is empty and the transfer contract's check passes on the swept tree.
  command: >-
    bin/venv-python -c "from scripts.checks.contracts import _retired_identity as r; from scripts.checks.contracts.validate_github_org_transfer import validate_github_org_transfer as v;
    assert not r.SWEEP_PINS, sorted(r.SWEEP_PINS); f=[]; v(f); assert not f, f; print('SWEEP_SET_EMPTY')"
  expected: Exit 0 and SWEEP_SET_EMPTY printed.
  fix_if: >-
    A non-empty set means a pinned file was not swept; a check failure names the file and line still carrying the
    retired identity. Sweep it if it is a forward-standing reference in scope; if it is an absence assertion of the
    retired identity (a test or registry clause that must name it), add it to SURVIVOR_PINS with that reason. Never
    reword approved text; anything else, STOP and route an amendment.
  hermetic: true
  graduation: graduate
  graduation_check_id: retired-repo-identity-sweep-set-empty
- step: 4
  phase: pre-deploy
  action: rec-3903's new acceptance (operator-approved, REC_3903_ACCEPTANCE) holds on the swept tree.
  command: >-
    ! git grep -n -E "benjamin-blake/theseus|[\"']benjamin-blake[\"']" -- scripts/ .github/workflows/ terraform/github/variables.tf
    ':!scripts/checks/contracts/_retired_identity.py' && bin/venv-python -m pytest -q tests/checks/contracts/test__retired_identity.py::test_sweep_set_is_empty
  expected: Exit 0 (no match; empty sweep set).
  fix_if: A match names a forward-standing old-identity literal the sweep missed; sweep it or route an amendment.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    This is rec-3903's own acceptance (lint-clean and probeable per VP step 16), verified at closure by the
    Decision 201 trailer gate; the standing guards are validate_github_org_transfer (ungated in --pre and in the full tier) and test__retired_identity.py::test_sweep_set_is_empty (pytest_diff and the full tier); graduated registry rows re-run only when added or modified.
- step: 5
  phase: pre-deploy
  action: >-
    Behavior tests for the gate, the resolver fallback, the escalation acceptance, the trust triple, the completeness
    monitor's scope and the empty sweep set.
  command: >-
    bin/venv-python -m pytest -q
    tests/checks/ci_guards/test_validate_dependabot_automation.py::test_real_auto_merge_gate_names_only_the_target
    tests/test_repo_identity.py::test_unset_environment_falls_back_to_the_constant
    tests/test_repo_identity.py::test_malformed_environment_falls_back_to_the_constant
    tests/checks/misc/test_validate_ghas_probe.py::TestDefaultRepoSlug::test_default_repo_is_the_renamed_slug_when_env_unset
    tests/checks/misc/test_validate_ghas_probe.py::test_malformed_repository_falls_back_to_the_default
    tests/convergence_health/test_escalate.py::test_stuck_approval_acceptance_names_the_new_repository
    tests/test_ontheloop_placeholder_packages.py::test_publish_workflow_shape_and_trust_triple
    tests/telemetry_verify/test_completeness.py::test_only_the_target_repository_is_in_scope
    tests/telemetry_verify/test_completeness.py::test_unjoinable_out_of_scope_and_keyless_are_counted_apart
    tests/checks/contracts/test__retired_identity.py::test_sweep_set_is_empty
  expected: Exit 0; every node and parametrized case passes (pytest exits non-zero on any failure or missing node).
  fix_if: A failing node names the file whose substitution is wrong or missing.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The named pytest nodes are themselves the standing guards; pytest_diff runs them when a PR touches their modules
    or the code they cover, and the full tier runs them always.
- step: 6
  phase: pre-deploy
  action: >-
    Only the retired full name changed: every removed line naming theseus named benjamin-blake/theseus, except the two
    approved terraform/github/CLAUDE.md import lines (the setup-script MCP comment is no longer swept: amendment
    2026-10-21), so no frozen identifier, brand continuity text or person reference was touched.
  command: >-
    test -z "$(git diff origin/main -U0 -- . ':!scripts/checks/contracts/_retired_identity.py' ':!tests/checks/contracts/test__retired_identity.py' ':!docs/plans/'
    | grep '^-[^-]' | grep -i 'theseus' | grep -v 'benjamin-blake/theseus'
    | grep -v 'import the existing .theseus. repository' | grep -v 'github_repository.this theseus')" &&
    test -z "$(git diff --name-only origin/main | grep -E '^(\.github/CODEOWNERS|terraform/github/environments\.tf|\.github/workflows/tf-gated-apply-prototype\.yml|\.claude/|terraform/personal/|terraform/bootstrap/)')"
  expected: Exit 0 (both lists empty).
  fix_if: >-
    A listed line or file is an unapproved change: restore it. Person references, frozen identifiers and the OIDC
    trust files are out of this plan's scope.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: A one-time diff check of this sweep against origin/main; it has no meaning once merged.
- step: 7
  phase: pre-deploy
  action: The two modified registry rows fail on origin/main and pass on HEAD (the registry's differential gate).
  command: >-
    bin/venv-python -c "from scripts.checks.verification.validate_verification_registry import validate_verification_registry as v; f=[]; v(f); assert not f, f; print('REGISTRY_OK')"
  expected: Exit 0 and REGISTRY_OK printed.
  fix_if: A row passing on origin/main means its assertion does not discriminate; tighten it to the new text.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_verification_registry is itself a registered check in both tiers.
- step: 8
  phase: pre-deploy
  action: >-
    Public-boundary sweep of every changed file (absorbs the contract build's partial-coverage follow-up): no
    12-digit id, e-mail address, token or ExternalId shape in any added line.
  command: >-
    git rev-parse --verify -q origin/main >/dev/null && ! git diff origin/main -- . ':!docs/plans/' | grep '^+' | grep -v '^+++' | cut -c2- | grep -Eq '[0-9]{12}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[a-z]{2,}|ghp_|github_pat_|ExternalId'
  expected: Exit 0 (no match).
  fix_if: A match is a Decision 101 breach; remove the value.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The never-commit hook and secret scanning are the standing guards; this is the plan's one-time diff sweep.
- step: 9
  phase: pre-deploy
  action: Fast tier.
  command: bin/venv-python -m scripts.validate --pre
  expected: Exit 0.
  fix_if: Fix the named failure at its root; never skip, disable or quarantine a test.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: scripts.validate is the aggregate presubmit entrypoint; graduating it would recurse the harness into itself.
- step: 10
  phase: pre-deploy
  action: Full tier before handoff (about 10 minutes; run in the background with a 30-minute timeout).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: A timeout blocks; it never passes. Fix the named failure at its root.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: scripts.validate is the aggregate presubmit entrypoint; graduating it would recurse the harness into itself.
- step: 11
  phase: post-deploy
  action: >-
    rec-3903 is closed after the squash merge carrying "Resolves: rec-3903".
  command: >-
    bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f; s=f('rec-3903')['status']; print('REC_3903', s); assert s=='closed'"
  expected: Exit 0 and REC_3903 closed printed.
  fix_if: >-
    Open means the closure job did not see a holds verdict: check the Decision 201 acceptance verdict on the closing
    sha (the rewritten acceptance must have been written before the merge).
  hermetic: false
- step: 12
  phase: post-deploy
  action: >-
    Live proof of the target-only gate: the first completed dependabot-auto-merge run on a dependabot/ branch after
    the merge ran its auto-merge job (not skipped). Non-dependabot PRs always produce skipped runs, so they are
    filtered out; times compare as UTC epochs.
  command: >-
    bin/venv-python -c "import json,urllib.request,subprocess,datetime; t=int(subprocess.check_output(['git','log','-1','--format=%ct','--grep=Resolves: rec-3903','origin/main'],text=True).strip());
    ep=lambda s:datetime.datetime.fromisoformat(s.replace('Z','+00:00')).timestamp();
    runs=json.load(urllib.request.urlopen('https://api.github.com/repos/otl-labs/ontheloop/actions/workflows/dependabot-auto-merge.yml/runs?per_page=100&actor=dependabot%5Bbot%5D',timeout=30))['workflow_runs'];
    after=sorted((r for r in runs if ep(r['created_at'])>t and (r.get('head_branch') or '').startswith('dependabot/') and r['status']=='completed'),key=lambda r:ep(r['created_at']));
    print('DEPENDABOT_RUNS_AFTER_MERGE', [(r['id'],r['conclusion']) for r in after]); assert after, 'pending';
    assert after[0]['conclusion'] in ('success','failure'), after[0]['conclusion']"
  expected: >-
    Exit 0 with the first dependabot-branch run after the merge concluding success or failure (a failure from the
    policy script still proves the gate matched); skipped means the gate did not match.
  fix_if: >-
    'pending' means no dependabot PR has opened since the merge: record the step as unproven in the PR and the
    rec-3903 resolution, and re-run at the next dependabot PR. A skipped run means the gate is wrong: STOP and RCA
    (Decision 55).
  hermetic: false
- step: 13
  phase: pre-deploy
  action: >-
    Each swept file checked here names otl-labs/ontheloop and no longer the retired full name (workflow comment,
    package metadata, roadmap criterion, licence-check docstring, setup-script comments, completeness monitor tuple and
    its test fixture).
  command: >-
    ! grep -n 'benjamin-blake/theseus' .github/workflows/ghas-probe.yml && grep -q 'repo-scoped to otl-labs/ontheloop only' .github/workflows/ghas-probe.yml &&
    ! grep -n 'benjamin-blake/theseus' packages/ontheloop-js-scoped/package.json && grep -q 'github.com/otl-labs/ontheloop.git' packages/ontheloop-js-scoped/package.json &&
    ! grep -n 'benjamin-blake/theseus' packages/ontheloop-js/package.json && grep -q 'github.com/otl-labs/ontheloop.git' packages/ontheloop-js/package.json &&
    ! grep -n 'benjamin-blake/theseus' packages/ontheloop-py/pyproject.toml && grep -q 'Repository = "https://github.com/otl-labs/ontheloop"' packages/ontheloop-py/pyproject.toml &&
    ! grep -n 'benjamin-blake/theseus' packages/ontheloop-py/src/ontheloop/__init__.py && grep -q 'github.com/otl-labs/ontheloop' packages/ontheloop-py/src/ontheloop/__init__.py &&
    ! grep -n 'benjamin-blake/theseus' packages/ontheloop-rs/Cargo.toml && grep -q 'repository = "https://github.com/otl-labs/ontheloop"' packages/ontheloop-rs/Cargo.toml &&
    ! grep -n 'benjamin-blake/theseus' packages/ontheloop-rs/src/lib.rs && grep -q 'github.com/otl-labs/ontheloop' packages/ontheloop-rs/src/lib.rs &&
    test "$(grep -c 'otl-labs/ontheloop' docs/ROADMAP-PLATFORM.yaml)" -ge 1 && test "$(grep -c 'benjamin-blake/theseus' docs/ROADMAP-PLATFORM.yaml)" = 0 &&
    grep -q 'agent-platform -> theseus under the same owner' scripts/checks/hygiene/validate_licence_consistency.py &&
    grep -q 'cd /home/user/ontheloop && bash bin/setup-cloud-env.sh' bin/setup-cloud-env.sh && grep -q "printf 'proxy-injected" bin/setup-cloud-env.sh &&
    ! grep -q 'github_repository.this theseus' terraform/github/CLAUDE.md && ! grep -q 'existing .theseus. repository' terraform/github/CLAUDE.md &&
    grep -qx 'REPOSITORIES = ("otl-labs/ontheloop",)' scripts/telemetry_verify/completeness.py &&
    grep -qx 'URL = "https://github.com/otl-labs/ontheloop"' tests/telemetry_verify/test_completeness.py
  expected: Exit 0.
  fix_if: The first failing clause names the file whose substitution is missing or not verbatim.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Positive spot checks bound to this sweep's approved text; the standing guards are validate_github_org_transfer (ungated in --pre and in the full tier) and test__retired_identity.py::test_sweep_set_is_empty (pytest_diff and the full tier); graduated registry rows re-run only when added or modified.
- step: 14
  phase: pre-deploy
  action: Assert the ground for NO Lambda redeploy despite touching the data-pipeline packaged roadmap asset (Decision 198 precedent).
  command: >-
    grep -q 'the schedule stays disabled' src/lambdas/data-pipeline/manifest.yaml && ! grep -q 'ROADMAP-PLATFORM' .github/workflows/deploy-prod-lambdas.yml
  expected: Exit 0 -- schedules still disabled and the deploy channel does not path-trigger on the roadmap.
  fix_if: >-
    If schedules are re-enabled the V2 tier no longer holds -- escalate to V3 via the governed deploy-prod-lambdas
    workflow, never a local build_lambda --deploy. If the workflow path-triggers on the roadmap, rec-3990 landed;
    retire this step.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Green on the un-implemented tree (both facts hold today), so graduating would redden this plan's own PR under
