schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: reviewer-read-tree-wording
intent: >-
  Opt the code_reviewer verdict persona into the read_tree capability rec-5724 builds (head and main trees, deliberately high limits,
  review_incomplete on a limit hit) and give both review lanes the operator's two-part review scope (the review files plus the change's
  reach), through an operator approval run, so the CI reviewer can follow callers, contracts and documents past its bundle before
  dual-run (rec-5725, the wording half of rec-5709).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-reviewer-read-tree-wording.yaml
phase: 'T4.28 (code_reviewer persona) c4 ADD: step 3 of 4, wording half (the code half is rec-5724, PLAN-reviewer-read-tree). Neither
  T4.28 c4 nor T4.32 c1 closes here; dual-run (rec-5710) waits on this plan.'
closes_criteria: []
cites:
- dec:205
- dec:229
- dec:246
- dec:247
- dec:279
amends: []
introduces: []
scope:
- file: docs/contracts/personas/code_reviewer.yaml
  action: Modify
  purpose: 'contract_version one above main''s (main after rec-5724); capabilities read_tree:head and read_tree:main; budget.read_tree
    {max_calls: 600, max_read_bytes: 65536, max_search_results: 500, max_total_bytes: 8388608} (high on purpose, operator 2026-11-27
    12:10 UTC; rec-5721 tunes them); failure_outputs review_incomplete; the How to read paragraph for read_tree; step 2''s two-part
    review scope (operator 2026-11-27 12:41-12:44 UTC); rendered_prompt_sha256. Exactly the sidecar''s code-reviewer-yaml blocks.'
- file: docs/contracts/personas/rendered/code_reviewer.txt
  action: Modify
  purpose: Re-rendered by scripts.persona_contracts.render --write code_reviewer; exactly the sidecar's code-reviewer-txt blocks.
- file: .claude/skills/code-review/SKILL.md
  action: Modify
  purpose: 'The in-session lane takes the same two-part review scope: review files where any issue is reported, plus the change''s reach,
    found by searching the repository for each changed path, module and symbol, where an issue is reported only when the change causes
    it, anchored where it breaks. The skill is at its 12568 B prose budget, so the same sidecar compacts four other lines. Exactly the
    sidecar''s SKILL-md blocks; config/prose_budgets.yaml changes only if the build measures a shrink, which then lowers the entry.'
- file: docs/plans/approved/reviewer-read-tree-wording.yaml
  action: Create
  purpose: The approved-text sidecar over the three bound files (Decision 246 approval run). Committed with the plan, never edited by
    the build.
- file: tests/persona_contracts/test_verdict_persona_contracts.py
  action: Modify
  purpose: 'Adds test_code_reviewer_reads_trees_under_its_budget (rec-5725 acceptance): code_reviewer names read_tree:head and read_tree:main,
    budget.read_tree carries max_calls, max_read_bytes, max_search_results and max_total_bytes as positive integers (values not pinned:
    rec-5721 tunes them), failure_outputs lists review_incomplete, and both the prompt_template and the code-review skill carry the
    change''s reach rule (the phrase "the change neither causes nor depends on"), so the two lanes cannot drift apart. No exact-count
    assertion (tests/CLAUDE.md test-count coupling). Any other node that pins code_reviewer''s capabilities, failure ids or contract_version
    on main after rec-5724 is updated in place, never dropped.'
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- tests/persona_contracts/test_verdict_persona_contracts.py::test_code_reviewer_reads_trees_under_its_budget passes (rec-5725 acceptance)
  and fails on main before the build.
- 'scripts.roadmap.approved_text verify --slug reviewer-read-tree-wording passes on the build head: the three bound files carry exactly
  the approved words.'
- After merge and the image re-pin, the first persona-verdict/code_reviewer check on a code PR carries a Reads section in its text, and
  that run's results artifact lists at least one read_tree read.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The new contract node passes (absent before the build, so the plan-time replay reads target_absent).
  command: bin/venv-python -m pytest tests/persona_contracts/test_verdict_persona_contracts.py::test_code_reviewer_reads_trees_under_its_budget
    -q
  expected: exit 0, one passed
  fix_if: the node fails; fix the contract text only through the plan owner (the words are approved), never the assertion
  hermetic: true
  expected_literals:
  - 1 passed
  graduation: graduate
  graduation_check_id: reviewer-read-tree-wording-contract
- step: 7
  phase: pre-deploy
  action: The persona contract, evaluator, verdict-consistency, loader and render suites pass on the real tree with the new contract.
  command: bin/venv-python -m pytest tests/persona_contracts/test_verdict_persona_contracts.py tests/checks/contracts/test_validate_persona_contracts.py
    tests/persona_backends/test_verdict_consistency.py tests/persona_backends/test_contract.py tests/persona_contracts/test_render.py
    -q
  expected: exit 0, no failures
  fix_if: a node fails; fix the contract text only through the plan owner (the words are approved), never the assertion
  hermetic: true
  expected_literals:
  - passed
  graduation: waive
  graduation_waiver_reason: existing suites already run in the fast tier by path; the only new node is VP 1's
- step: 2
  phase: pre-deploy
  action: The bound files carry exactly the approved words and the rendered prompts are fresh.
  command: bin/venv-python -m scripts.roadmap.approved_text verify --slug reviewer-read-tree-wording && bin/venv-python -m scripts.persona_contracts.render
    --check
  expected: exit 0; the render check prints RENDER-CHECK OK
  fix_if: 'a block differs: apply the sidecar block exactly; a stale render: re-run render --write code_reviewer'
  hermetic: true
  expected_literals:
  - RENDER-CHECK OK
  graduation: waive
  graduation_waiver_reason: validate_merge_step and validate_persona_contracts already enforce both on every PR
- step: 3
  phase: post-deploy
  action: 'The squash commit carries Resolves: rec-5725 and merge_step readback reads it.'
  command: bin/venv-python -m scripts.session.merge_step readback --slug reviewer-read-tree-wording --sha <merge_sha>
  expected: readback OK naming rec-5725, then (after ci.yml's closure job) its status leg reads closed
  fix_if: 'MISSING: follow merge_step recover'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a per-merge read-back, not a repository property
- step: 4
  phase: post-deploy
  action: The image pin is re-pinned to a build that contains the merge (persona_image_pin update opens the pin PR; the operator merges
    it).
  command: 'git fetch origin main --quiet && git merge-base --is-ancestor <merge_sha> "$(git show origin/main:config/persona_image.yaml
    | sed -n ''s/^source_commit: "\([0-9a-f]*\)".*/\1/p'')" && echo PINNED'
  expected: prints PINNED
  fix_if: 'no PINNED: open the pin PR with bin/venv-python -m scripts.ci.persona_image_pin update after persona-image-publish succeeds
    on the merge, and stop to the operator for its merge'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a one-time live pin read-back
- step: 5
  phase: post-deploy
  action: 'Live read-back: on the first code PR after the re-pin, the persona-verdict/code_reviewer check comes from the verdict App
    and its text carries the Reads section.'
  command: gh api repos/otl-labs/ontheloop/commits/<head_sha>/check-runs --jq '.check_runs[] | select(.name=="persona-verdict/code_reviewer")
    | .output.text' | grep -c '^Reads'
  expected: prints 1 (any conclusion; the check is advisory)
  fix_if: 'prints 0: read that head''s persona-verdict run results artifact (reads, trees) and stop to the plan owner with the run id'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a one-time live proof of the capability on a real PR
- step: 6
  phase: post-deploy
  action: 'Close the umbrella rec-5709 once both children read closed and its own acceptance node passes on main (Decision 247, children-miss-parent).'
  command: bin/venv-python -m pytest tests/persona_backends/test_repo_read.py::test_reads_are_bounded_recorded_and_traversal_refused
    -q && bin/venv-python -m scripts.ops_data_portal --update-rec rec-5709 --status closed --resolution "Children rec-5724 and rec-5725
    merged; acceptance node passes on main"
  expected: the node passes and recs_by_ids shows rec-5709 closed
  fix_if: 'the node fails or a child is open: leave rec-5709 open and report to the coordinator'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a one-time rec closure read-back
test_obligations:
- source: docs/contracts/personas/code_reviewer.yaml
  behavior: code_reviewer opts into read_tree with its budget and review_incomplete, and both lanes carry the reach rule
  verification_step: 1
  test_selector: tests/persona_contracts/test_verdict_persona_contracts.py::test_code_reviewer_reads_trees_under_its_budget
  red_green_expectation: red before (node absent; main's contract names no read_tree), green after
- source: .claude/skills/code-review/SKILL.md
  behavior: the in-session lane carries the same reach rule as the CI lane and keeps its step ids
  verification_step: 1
  test_selector: tests/persona_contracts/test_verdict_persona_contracts.py::test_code_reviewer_reads_trees_under_its_budget
  red_green_expectation: red before (the skill has no reach rule), green after
- source: docs/contracts/personas/rendered/code_reviewer.txt
  behavior: the rendered prompt matches its template and hash
  verification_step: 2
  command: bin/venv-python -m scripts.persona_contracts.render --check
  waiver_reason: a generated file guarded by the render check on every PR; no behaviour of its own
constraints:
- 'Build only after rec-5724''s build (PLAN-reviewer-read-tree) has merged: read_tree, budget.read_tree rules and the reference_hits field
  must exist on main, else validate_persona_contracts refuses the contract.'
- The three bound files change by exactly the sidecar's blocks (docs/plans/approved/reviewer-read-tree-wording.yaml); any other wording
  change goes back to the plan owner.
- Caps are deliberately high (operator 2026-11-27 12:10 UTC); rec-5721 tunes them. No spend mechanism (operator ruling 2026-11-27, rec-5707).
- No rescue agents or workaround loops (Decision 55).
context:
- rec-5725 (primary), split of rec-5709 by the operator 2026-11-27 12:57 UTC; sibling rec-5724 (code half, PLAN-reviewer-read-tree, owner
  thread Plan read-only repo tools for reviewers). Brief /mnt/project-files/reviewer-read-tree/HANDOFF-wording-half.md.
- 'Operator 2026-11-27 12:41-12:44 UTC: keep "no issues outside the review scope" but define the scope as the review files plus the
  change''s reach, in both lanes; "write the plan" given on that approach.'
- 'Wording class: persona contracts and the code-review skill are notice class (Decision 279); the sidecar is used because rec-5709
  asks for the operator''s approval run and the prompt defines a future gate.'
- 'Sequencing: the sidecar blocks are drafted against main plus rec-5724''s expected code_reviewer.yaml edits (contract_version 3, reference_hits);
  after rec-5724 merges they are regenerated on real main and the wording check (rec-5723 gap) and approval run follow. Draft tools
  /mnt/project-files/reviewer-read-tree/wording-half/.'
- 'Decided with notice (consistency-only, Decisions 205 cl.2 and 280 cl.5 precedent; flagged by rec-5724''s scout): the How to read
  paragraph tells the reviewer to read the rules it judges against (AGENTS.md, CLAUDE.md, skills, contracts) in tree main, since the
  head copies are the change under review; rec-5722 is the human-flag backstop. The operator sees these words on the approval run.'
- 'Measure deferral (Decision 231, T4.14 deferred_post_mvp): no offline eval record is pre-registered for the widened reach findings
  or the new review_incomplete outcome; rec-5710''s dual-run is where reach-finding quality and the review_incomplete rate are first
  observed.'
- 'Self-review residual (Decision 229): the build edits the code-review skill, so its fresh-context code review reads main''s copy (git
  show origin/main:.claude/skills/code-review/SKILL.md), never the branch''s; rec-4476 owns the general residual.'
- 'Decision-scout r1 FLAGS_FOUND (fingerprint v1:ad110c071cacd0956ce3e09c13aeeecc9b1c7f319d25b6ba47d0f523b3c39971): WARN 189 answered
  (VP 1 is the node, sweep moved to waive VP 7); SPIRIT 229 answered (build review reads main''s skill); SPIRIT 231 answered (measure
  deferral above). CITE 205, 229, 246, 247, 279. Decisions triaged: 238 of 238. Roadmap items intersected: 3; CONFLICT: 0; RELATED:
  3. Serves: NS.8 3/5.'
- 'Known window: between this build''s merge and the re-pin PR''s merge the image still carries contract 3, so runs read only their
  bundle; VP 4 closes it.'
- Follow-on recs already filed by the rec-5709 planner - rec-5721 (tune caps), rec-5722 (human flag for reviewer-rules PRs).
