pre_implementation_checklist:
- Branch confirmed not on main
- rec-5724's build merged (read_tree in executor-personas.yaml capability_vocabulary on main)
- The last gate_rounds wording-check row is PASS on the regenerated sidecar (its digest equals approved_text record's digest) with
  a complete selection, and the operator approved that sidecar's approval run
- SKILL.md re-measured after regeneration at or under its config/prose_budgets.yaml entry
- docs/PROJECT_CONTEXT.md read
- Only the plan-cited decision sections read
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- 'Set implementation_declared: true in this plan file in the build commit.'
- 'Apply the sidecar''s blocks to the three bound files exactly, then run bin/venv-python -m scripts.persona_contracts.render --check.
  Post: VP 3 passes.'
- 'Add test_code_reviewer_reads_trees_under_its_budget; update in place any node that pins code_reviewer''s capabilities, failure ids
  or contract_version. Post: VP 1 and VP 2 pass.'
- Execute the Verification Plan pre-deploy steps; then validate --pre; then the full tier as a tracked background run (Bash run_in_background,
  timeout 7200000) and bin/venv-python -m scripts.checks.validation_result --verify-head.
- 'CLOSURE (implement skill Commit Flows): PR titled build(reviewer-read-tree-wording); code review in a fresh context that loads
  main''s copy of the code-review skill (git show origin/main:.claude/skills/code-review/SKILL.md), not the branch''s; squash-merge
  on green with Resolves: rec-5725; then VP 4, VP 5 (the pin PR the operator merges), VP 6 and VP 7.'
- 'Report: what was implemented, verification results, run ids.'
rollback: Revert the build PR and the pin PR; code_reviewer returns to reading only its bundle and both lanes to the review-files-only
  scope.
