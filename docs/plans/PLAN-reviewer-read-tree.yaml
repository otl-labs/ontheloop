slug: reviewer-read-tree
intent: Give verdict reviewer personas a bounded, recorded, read-only read_tree capability over the change's head tree and main (opted
  into per contract), deliver both trees read-only into the sealed persona container without giving the root launcher any caller-chosen
  path, record every read with both tree commits in the run's results and check text, and add the whole-tree reference_hits floor to
  code_reviewer's input, so the wording half (rec-5725) can opt code_reviewer in and the CI reviewer reads alike to the in-session one
  before dual-run (rec-5724, the code half of rec-5709).
plan_type: IMPLEMENTATION
verification_tier: V3
