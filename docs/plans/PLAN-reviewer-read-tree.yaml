    one, and not_examined (first 100 paths, then a count), inside TEXT_LIMIT. Each path is head-tree data: it is rendered through _escape
    on a line prefix override.FINDING_RE and rescout.input_line cannot match, and a path with a newline or control character is shown
    as its repr. reads_unknown shows as ''read records unavailable'', never as zero calls.'
