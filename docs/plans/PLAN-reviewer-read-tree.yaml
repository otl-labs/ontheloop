  action: The launcher, floor, tree packer, host, shell, provider and contract suites pass with root-held tree mounts and no workflow
    change. conformance_suite.py's new leg needs Docker and runs in ci.yml's existing suite job, its pre-merge control.
  command: bin/venv-python -m pytest tests/personas/test_egress_launcher.py tests/personas/test_egress_floor_container.py tests/personas/test_materialise.py
    tests/persona_hosts/local_container/test_adapter.py tests/persona_hosts/local_container/test_cli.py tests/personas/test_keyed_run.py
    tests/personas/test_post_verdict.py tests/personas/test_review_input.py tests/personas/test_reference_hits.py tests/checks/contracts/test_validate_persona_contracts.py
    tests/checks/contracts/test_validate_ports_contract.py tests/persona_contracts/test_verdict_persona_contracts.py tests/persona_contracts/test_render.py
    -q
  expected: exit 0, no failures
  fix_if: a node fails; fix the code or the pin, never the assertion
  hermetic: true
  expected_literals:
  - passed
  graduation: waive
  graduation_waiver_reason: existing suites already run in the fast tier by path; the new nodes are mirror-test nodes of changed files
    run by --pre pytest_diff
- step: 3
  phase: pre-deploy
  action: The rendered prompts are fresh and no contract names read_tree yet.
  command: bin/venv-python -m scripts.persona_contracts.render --check && ! grep -rl 'read_tree:' docs/contracts/personas/ && echo NO-OPT-IN
  expected: exit 0; prints RENDER-CHECK OK then NO-OPT-IN
  fix_if: 'a stale render: re-run render --write code_reviewer; a read_tree capability in a contract: remove it (rec-5725 owns the opt-in)'
  hermetic: true
  expected_literals:
  - RENDER-CHECK OK
  - NO-OPT-IN
  graduation: waive
  graduation_waiver_reason: validate_persona_contracts already enforces render freshness on every PR; the opt-in absence is a one-time
    sequencing check
- step: 4
  phase: post-deploy
  action: 'The squash commit carries Resolves: rec-5724 and merge_step readback reads it.'
  command: bin/venv-python -m scripts.session.merge_step readback --slug reviewer-read-tree --sha <merge_sha>
  expected: readback OK naming rec-5724, then (after ci.yml's closure job) its status leg reads closed
  fix_if: 'MISSING: follow merge_step recover'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a per-merge read-back, not a repository property
- step: 5
  phase: post-deploy
  action: The image pin is re-pinned to a build that contains the merge (the pin PR persona_image_pin update opens; the operator merges
    it).
  command: 'git fetch origin main --quiet && git merge-base --is-ancestor <merge_sha> "$(git show origin/main:config/persona_image.yaml
    | sed -n ''s/^source_commit: "\([0-9a-f]*\)".*/\1/p'')" && echo PINNED'
  expected: prints PINNED
  fix_if: 'no PINNED: open the pin PR with bin/venv-python -m scripts.ci.persona_image_pin update after persona-image-publish succeeds
    on the merge, and stop to the operator for its merge'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a one-time live pin read-back
- step: 6
  phase: post-deploy
  action: 'Live read-back: on the first code PR after the re-pin, the persona-verdict/code_reviewer check posted by the verdict App
    carries the Reads section (zero read_tree calls until rec-5725; not_examined from reference_hits).'
  command: 'gh api repos/otl-labs/ontheloop/commits/<head_sha>/check-runs --jq ''.check_runs[] | select(.name=="persona-verdict/code_reviewer"
    and .app.id==<app_id>) | .output.text'' | grep -c ''^Reads''  # <app_id> = gates.verdict_app.app_id in docs/contracts/project-configuration.yaml
    on origin/main'
  expected: prints 1 or more (one per run of the check; any conclusion, the check is advisory)
  fix_if: 'prints 0: read that head''s persona-verdict run results artifact and stop to the plan owner with the run id'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a one-time live proof of the capability on a real PR
