  reference_hits (input_unusable); advisory only, VP 5 closes it. Fixture routes have no window: the launcher''s argv and image tail
  are unchanged and no route sends trees until a contract names read_tree (rec-5725, after the re-pin).'
- 'Live assumption: tracked files are 84,795,298 B on 2026-11-27 (git ls-files -z | xargs -0 stat -c %s | awk ''{s+=$1} END {print s}''),
