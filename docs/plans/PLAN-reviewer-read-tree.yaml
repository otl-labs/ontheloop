- file: scripts/personas/keyed_run.py
  action: Modify
  purpose: 'request_main adds trees (the routed contract''s read_tree parameters) and, when head is named, head_tree_bytes and the raw
    bytes of prepared/head.tar after the request line (materialise''s failure file already covers an absent tar). _record writes reads
    only from parsed events (at most 2000 entries, then reads_dropped; an empty list when the run made no read_tree call); when events
    are absent or unreadable it writes reads_unknown: true instead, never an empty list. It records trees {head: prepared/resolution.json''s
    head_sha, main: checked_out_sha(root)} so a replay knows both tree commits (Decision 231); when the prepared input carries reference_hits,
    it writes not_examined: the hit paths whose in_bundle is false and that no ok read record of tree head names, sorted.'
- file: scripts/personas/post_verdict.py
  action: Modify
