  (about 90 MB), streamed raw after the request line, outside MAX_REQUEST, under a 1 GiB cap; rec-5721 tunes caps with this trajectory.
  Only runs that route a read_tree persona carry it; the floor''s main copy is a direct file copy on every container run. UNPROVEN until
  rec-5725''s first live read run.'
- 'Decision-scout r1 and r2 (pre-split; fingerprints in gate_rounds): NOTE 206 cl.7, NOTE/WARN 212, SPIRIT 231, WARN 282 answered in
  scope; 246 cites left with the wording (rec-5725).'
- 'Operator 2026-11-27 13:14 UTC (decision card): confirmed the named loosening of test_capabilities_are_read_input_over_every_input_only
  to admit read_tree:head and read_tree:main (Decision 235 cl.1); recorded in weakening_dispositions and the plan PR body.'
- 'Critique r1 REVISE (6 blocking, 15 nits) folded: no caller path into the root launcher, so sudoers, argv, the image tail, persona-verdict.yml
  and its guards are unchanged and fixture routes have no re-pin window. N-08 (CRI1-14) disputed: closes_criteria stays [] by design.'
- 'Decision-scout r3-r5 FLAGS_FOUND (fingerprints in gate_rounds): NOTE 212 cl.1 answered by the conformance tree leg; NOTE 235 discharged
  by the operator''s confirmation (now CITE); SPIRIT 280 cl.5 deferred (no opt-in here; rec-5725''s prompt sends rule-bearing reads
