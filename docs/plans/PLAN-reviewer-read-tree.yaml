verification_plan:
- step: 1
  phase: pre-deploy
  action: The read_tree server, contract loader, backend, producer and entry point nodes pass.
  command: bin/venv-python -m pytest tests/persona_backends/test_repo_read.py::test_reads_are_bounded_recorded_and_traversal_refused
    tests/persona_backends/test_repo_read.py::test_call_and_byte_caps_return_a_cap_record tests/persona_backends/test_repo_read.py::test_search_and_list_are_capped
    tests/persona_backends/test_litellm_backend_read_tree.py::test_reads_land_on_the_turn_record tests/persona_backends/test_litellm_backend_read_tree.py::test_cap_ends_the_run_as_review_incomplete
    tests/persona_backends/test_litellm_backend_read_tree.py::test_missing_head_tree_is_run_refused tests/persona_backends/test_litellm_backend_read_tree.py::test_read_tree_spec_is_in_tools_sha256
    tests/persona_backends/test_litellm_backend_read_tree.py::test_search_past_deadline_is_review_incomplete tests/persona_backends/test_litellm_backend_read_tree.py::test_unnamed_trees_are_ignored
    tests/persona_backends/test_contract.py::test_read_tree_needs_its_budget_and_failure_output tests/persona_backends/test_contract.py::test_read_tree_names_only_head_or_main
    tests/persona_backends/test_contract.py::test_capability_gate_matches_index tests/turn_capture/test_litellm_producer.py::test_turn_reads_are_ignored_by_the_producer
    tests/test_run_persona.py::test_mounted_trees_reach_run_persona tests/test_run_persona.py::test_no_trees_when_none_mounted tests/personas/test_egress_trees.py::test_check_request_refuses_bad_tree_fields
    tests/personas/test_egress_trees.py::test_extract_cli_reads_stdin tests/personas/test_egress_trees.py::test_extract_refuses_bad_members
    tests/personas/test_egress_trees.py::test_pack_then_extract_keeps_dotfiles_and_skips_git_and_links -q
  expected: exit 0, no failures
  fix_if: a node fails or is missing; create or fix the module and the named node, never the assertion
  hermetic: true
  expected_literals:
  - passed
  graduation: graduate
  graduation_check_id: reviewer-read-tree-units
- step: 2
  phase: pre-deploy
  action: The launcher, floor, tree packer, host, shell, provider and contract suites pass with root-held tree mounts and no workflow
    change. conformance_suite.py's new leg needs Docker and runs in ci.yml's existing suite job, its pre-merge control. tests/personas/test_container_egress.py's
    edited node is twin-only (PERSONA_TWIN=1, root, dockerd) and skips here.
  command: bin/venv-python -m pytest tests/personas/test_egress_launcher.py tests/personas/test_egress_floor_container.py tests/personas/test_materialise.py
    tests/persona_hosts/local_container/test_adapter.py tests/persona_hosts/local_container/test_cli.py tests/personas/test_keyed_run.py
    tests/personas/test_execute.py tests/personas/test_post_verdict.py tests/personas/test_review_input.py tests/personas/test_reference_hits.py
    tests/checks/contracts/test_validate_persona_contracts.py tests/checks/contracts/test_validate_ports_contract.py tests/checks/contracts/test_ports_verdict_chain_records.py
    tests/checks/contracts/test_gate_verdict_source_rows.py tests/persona_contracts/test_verdict_persona_contracts.py tests/persona_contracts/test_render.py
    tests/persona_backends/test_events.py tests/persona_backends/test_litellm_backend.py -q
  expected: exit 0, no failures
  fix_if: a node fails; fix the code or the pin, never the assertion
  hermetic: false
  graduation: waive
  graduation_waiver_reason: existing suites already run in the fast tier by path; the new nodes are mirror-test nodes of changed files
    run by --pre pytest_diff
- step: 3
  phase: pre-deploy
  action: The rendered prompts are fresh and no contract names read_tree yet.
  command: bin/venv-python -m scripts.persona_contracts.render --check && ! grep -rl 'read_tree:' docs/contracts/personas/ && echo NO-OPT-IN
  expected: exit 0; prints RENDER-CHECK OK then NO-OPT-IN
  fix_if: 'a stale render: re-run render --write code_reviewer; a read_tree capability in a contract: remove it (rec-5725 owns the opt-in)'
  hermetic: true
  expected_literals:
  - RENDER-CHECK OK
  - NO-OPT-IN
  graduation: waive
  graduation_waiver_reason: validate_persona_contracts already enforces render freshness on every PR; the opt-in absence is a one-time
    sequencing check
- step: 4
  phase: pre-deploy
  action: Full tier before handoff.
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Full tier passes and --verify-head confirms it for the head. Start it as a harness-tracked background run (Bash run_in_background,
    timeout 7200000) from the top-level session with HOME set to an empty directory.
  fix_if: a failure in scope is fixed; one outside scope is a STOP to the plan owner; never loosen a check (Decision 235)
  hermetic: false
  graduation: waive
  graduation_waiver_reason: is the full tier itself
- step: 5
  phase: post-deploy
  action: 'The squash commit carries Resolves: rec-5724 and merge_step readback reads it.'
  command: bin/venv-python -m scripts.session.merge_step readback --slug reviewer-read-tree --sha <merge_sha>
  expected: readback OK naming rec-5724, then (after ci.yml's closure job) its status leg reads closed
  fix_if: 'MISSING: follow merge_step recover'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a per-merge read-back, not a repository property
- step: 6
  phase: post-deploy
  action: The image pin is re-pinned to a build that contains the merge (the pin PR persona_image_pin update opens; the operator merges
    it).
  command: 'git fetch origin main --quiet && git merge-base --is-ancestor <merge_sha> "$(git show origin/main:config/persona_image.yaml
    | sed -n ''s/^source_commit: "\([0-9a-f]*\)".*/\1/p'')" && echo PINNED'
  expected: prints PINNED
  fix_if: 'no PINNED: open the pin PR with bin/venv-python -m scripts.ci.persona_image_pin update after persona-image-publish succeeds
    on the merge, and stop to the operator for its merge'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a one-time live pin read-back
- step: 7
  phase: post-deploy
  action: 'Live read-back: on the first code PR after the re-pin, read the persona-verdict/code_reviewer check runs on the head (mcp__github__
    check-run read in a session, or the gh command below where gh is authenticated); the one posted by the verdict App carries the Reads
    section. This proves only that the Reads section reaches the App''s check; it does not prove tree delivery, since no route sends
    trees until rec-5725. The live delivery proof (ok read records for trees head and main, trees.head equal to the PR head SHA, the
    launcher''s head-bytes and /run free-space line, no LAUNCHER-REFUSED head tree) is a post-deploy step of rec-5725''s plan on its
    first read_tree run (its planner asked 2026-11-27).'
  command: 'gh api ''repos/otl-labs/ontheloop/commits/<head_sha>/check-runs?check_name=persona-verdict%2Fcode_reviewer&per_page=100''
    --jq ''.check_runs[] | select(.app.id==<app_id>) | .output.text'' | awk ''/^Reads/{s=1} s'' | grep -c ''read_tree calls''  # <app_id>
    = gates.verdict_app.app_id in docs/contracts/project-configuration.yaml on origin/main; the mcp read uses the same check_name filter'
  expected: 'prints 1 or more: a Reads section with read_tree call counts (zero until rec-5725), not only ''read records unavailable'';
    any conclusion, the check is advisory'
  fix_if: 'prints 0: read that head''s persona-verdict run results artifact and stop to the plan owner with the run id'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: a one-time live read-back that the Reads section reaches the verdict App's check
