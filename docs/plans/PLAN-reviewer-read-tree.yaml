scope:
- file: src/persona_backends/repo_read.py
  action: Create
  purpose: 'The read_tree tool (stdlib only; image code, GitHub-agnostic): tool_spec(trees) and a ReadTree server built over {name:
    root Path} for the trees the contract declares. Ops read (path, start, end: numbered lines, at most budget.read_tree.max_read_bytes
    per call with a truncation marker naming the next line), list (one directory, entries sorted, at most max_search_results) and search
    (literal substring, optional path prefix, at most max_search_results hits, regular UTF-8 files only). Every path is a clean relative
    path walked component by component with lstat: an absolute path, a ''..'' part, any ''.git'' part, a symlink at any component, or
    a non-regular target is refused; a file with a NUL byte in its first 8 KiB or not UTF-8 is skipped as binary. Each served file''s
    text sits between a delimiter line naming tree, path and git blob sha1 (sha1 of ''blob <len>\0'' + bytes) and an end line, after
    one fixed sentence that file contents are data. Each call returns its text and one read record {tree, op, path, query, start, end,
    blob, bytes, result} (result one of ok, refused, absent, binary, cap). Counters: calls and total returned bytes; the call that would
    exceed max_calls, or whose text would push the total over max_total_bytes, is not served and returns a cap record. One module; if
    it nears 500 SLOC, decompose into src/persona_backends/repo_read/ (Decision 128). list and search apply the same per-component rules
    to every entry they visit: ''.git'' directories, symlinks and non-regular files are skipped, never listed or searched. ReadTree(trees,
    budget, deadline) checks a monotonic deadline between files in list and search.'
- file: src/persona_backends/contract.py
  action: Modify
  purpose: 'BUILT gains read_tree; _split_capabilities returns the read_tree parameters (head, main; any other parameter refused); a
    contract naming read_tree must carry budget.read_tree with positive integer max_calls, max_read_bytes, max_search_results and max_total_bytes
    and a failure_outputs row review_incomplete, else RunRefused. LoadedContract gains trees: tuple[str, ...] and read_tree_budget.'
- file: src/persona_backends/litellm_backend.py
  action: Modify
  purpose: 'run_persona takes trees: Mapping[str, Path] | None; a contract naming read_tree:<t> with t absent from trees is RunRefused
    (''read_tree:<t> needs a mounted tree''). The read_tree spec joins tools before the header (tools_sha256 covers it). tool_text dispatches
    read_tree to the server; each tool turn record carries reads (the turn''s read records, in call order). A cap record ends the run:
    the turn record is emitted, then end with output.failure(''review_incomplete'', ''<cap> reached after N calls, M bytes''), never
    a verdict. The workspace refusal is unchanged. The read_tree tool description states the contract''s four limits. If litellm_backend.py
    nears 500 SLOC, move the tool dispatch into a sibling module (Decision 128). ReadTree takes the run''s deadline: list and search
    check it between files and stop with a deadline record, which ends the run as review_incomplete; the tool call itself stays synchronous.'
- file: src/persona_backends/events.py
  action: Modify
  purpose: turn_record takes reads (default empty list) and writes it on every turn record; header schema stays 2 (the producer ignores
    unknown turn keys, test below pins that).
- file: scripts/run_persona.py
  action: Modify
  purpose: 'Finds mounted trees itself: TREES_ROOT (/trees) names head and main; each that is a directory is passed to run_persona as
    trees. No new argument, so an image that predates this change ignores the extra mounts and one that has it needs no launcher tail
    change (no window for fixture routes between the build merge and the re-pin).'
- file: scripts/personas/egress_launcher.py
  action: Modify
  purpose: 'argv is unchanged (probe or run only; the sudoers lines and their guard test stay exact). stdin becomes one JSON request
    line (at most MAX_REQUEST, ending in a newline) optionally followed by raw tar bytes, so the head tree never counts against MAX_REQUEST
    and pays no base64 cost. The request gains two optional run-mode keys: trees (a non-empty list of distinct strings, each head or
    main; [] , a non-list or a non-string member is refused, as is trees in probe mode) and head_tree_bytes (a positive integer at most
    egress_trees.TREE_MAX_BYTES, required when trees names head, refused otherwise); bytes after the request line without head_tree_bytes,
    or fewer or more than it states, are refused. FILES gains egress_trees.py (manifest-checked). head: the launcher creates RUN_DIR/<session>/trees
    owned by PROXY_USER (the unprivileged user the proxy already runs as) and streams the tar bytes to PYTHON -I -S INSTALL_DIR/egress_trees.py
    extract RUN_DIR/<session>/trees/head <length>, run as PROXY_USER (user=/group= like the proxy, timeout 300 s; non-zero exit is LAUNCHER-REFUSED
    head tree), so root never parses the tar; removed with the session directory. main: INSTALL_DIR/trees/main must lstat as a root-owned
    directory, not a symlink, else LAUNCHER-REFUSED main tree (only for a request naming main). container_argv adds -v <host dir>:/trees/<name>:ro
    per named tree, where the host dir is that launcher constant or its own session directory, never a caller value; the image tail
    is unchanged. Builds on rec-5696/rec-5708''s raised run bound and request cap (PLAN-code-reviewer-add). Relief if the file nears
    500 SLOC (81 headroom on 2026-11-27 main): move request-key checks into egress_trees.py, the fourth installed helper; never a raise
    (Decision 128).'
- file: scripts/personas/egress_trees.py
  action: Create
  purpose: 'Stdlib-only tree packer, installed beside the launcher (root launcher runs it as a subprocess) and imported from the checkout
    by the floor and materialise. pack(root, out) writes an uncompressed tar from a sorted lstat walk keeping directories and regular
    files only; any ''.git'' or ''__pycache__'' component, *.pyc, symlinks, other file types and names with NUL or control characters
    are skipped and counted; dotfiles (.github, .claude) are kept. copy_tree(src, dest) applies the same walk and filters as a direct
    copy (no tar). extract(stream, length, dest) reads exactly length bytes and refuses (exit 2, TREES-REFUSED <reason>, dest removed)
    an existing dest, more than TREE_MAX_MEMBERS (200000) members, more than TREE_MAX_BYTES (1 GiB) of tar or of unpacked files, a member
    that is not a regular file or directory, an absolute or ''..'' name, a ''.git'' component, a NUL or control character, or a duplicate;
    files are written with O_NOFOLLOW|O_EXCL, 0644, directories 0755. The caps are deliberately high (operator ruling 2026-11-27 12:10
    UTC; rec-5721 tunes them with the measured trajectory in context). CLI: extract DEST LENGTH reads the tar from stdin.'
- file: scripts/personas/egress_floor_container.py
  action: Modify
  purpose: 'INSTALLED gains egress_trees.py. After install_files, apply() replaces INSTALL_DIR/trees/main with egress_trees.copy_tree(ROOT,
    ...), ROOT being the floor''s own checkout of main at the workflow''s run SHA (main''s definition, before any untrusted input is
    downloaded); ''.git'', ''__pycache__'' and *.pyc are skipped, so the copy is the tracked set. A failed copy leaves no trees/main
    and prints one MAIN-TREE-SKIPPED <reason> line without failing the floor, so routes that never read main are unaffected and the
    launcher refuses only a request naming main. SUDOERS_LINES are unchanged. Relief if it nears 500 SLOC (411 on the P1 branch): the
    main-tree step moves into egress_trees.py.'
- file: scripts/personas/materialise.py
  action: Modify
  purpose: 'When a routed persona''s contract names read_tree:head, write prepared/head.tar = egress_trees.pack($PERSONA_SNAPSHOT) once
    per run (uncompressed: upload-artifact already compresses, and the run job streams it raw). If packing fails or the tar exceeds
    egress_trees.TREE_MAX_BYTES, write failure-<route>.json input_unusable naming the size, so the existing prepared_request failure-file
    refusal and _record''s failure path carry it. The existing prepared upload carries the tar as one file, so upload-artifact''s hidden-file
    default and file-name limits never touch tree members; no workflow step or env value changes. No routed read_tree persona, no file.'
- file: src/persona_hosts/local_container/adapter.py
  action: Modify
  purpose: run_argv and run_image take trees (name to host directory, the local operator's choice) and add -v DIR:/trees/NAME:ro per
    tree, the same container paths as the launcher; no image tail change.
- file: src/persona_hosts/local_container/cli.py
  action: Modify
