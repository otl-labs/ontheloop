- file: scripts/personas/egress_launcher.py
  action: Modify
  purpose: 'argv is unchanged (probe or run only; the sudoers lines and their guard test stay exact). stdin framing: every request is
    one JSON object followed by exactly one newline; the launcher reads sys.stdin.buffer.readline(MAX_REQUEST + 2) and refuses a line
    not ending in a newline (no EOF-terminated line in either mode; launcher and writers come from main at the same SHA). All later
    bytes are read from the same sys.stdin.buffer object, never fd 0, in bounded chunks: with no head tree the next read must be empty;
    with one, exactly head_tree_bytes are relayed to the extract''s stdin and one more read must be empty, else refused. The request
    gains two optional run-mode keys: trees (a non-empty list of distinct strings, each head or main; [], a non-list or a non-string
    member is refused, as is trees in probe mode) and head_tree_bytes (type int, not bool, at least 1 and at most a launcher-local TREE_MAX_BYTES
    that a test pins equal to egress_trees.TREE_MAX_BYTES, since the -I -S launcher cannot import it; required when trees names head,
    refused otherwise). FILES gains egress_trees.py (manifest-checked). head, in this order: read the request line, take the lock, create
    the session base (both RUN_DIR and the session base stay root 0700; never 0711) and <session>/trees owned by PROXY_USER, mode 0700;
    set session.started so cleanup''s survivor wait covers the extract; start PYTHON -I -S INSTALL_DIR/egress_trees.py extract head
    <length> with Popen(cwd=<session>/trees, user=PROXY_USER, group=its group, extra_groups=[]) so the relative destination needs search
    permission only on the cwd; stderr inherited, not piped; stdout=DEVNULL (the launcher''s stdout is the result channel); the extract
    runs under RLIMIT_NPROC 1 (PRLIMIT = "/usr/bin/prlimit" --nproc=1:1 first in its argv, an absolute constant like DOCKER and PYTHON)
    so it cannot fork; a 300 s deadline covers the relay and the wait (a timer kills the child, so a blocked write fails with BrokenPipe);
    non-zero exit or a timeout is LAUNCHER-REFUSED head tree (reasons carry class words only); after exit 0, proxy_survivors() must
    be empty (no PROXY_USER process may exist when the proxy starts), else LAUNCHER-REFUSED; then trees/head must lstat as a directory;
    it prints one stderr line with the head bytes and os.statvfs(RUN_DIR) free bytes; only then the port and name check, make_dirs and
    start_proxy. main: INSTALL_DIR/trees/main must lstat as a root-owned directory, not a symlink, with mode & 0o022 == 0, else LAUNCHER-REFUSED
    main tree (only for a request naming main). container_argv adds -v <host dir>:/trees/<name>:ro per named tree, where the host dir
    is that launcher constant or its own session directory, never a caller value; the image tail is unchanged. Builds on rec-5696/rec-5708''s
    raised run bound and request cap (PLAN-code-reviewer-add). Relief, expected to fire (419 of 500 SLOC on 2026-11-27 main; this row
    adds about 80-90): the tree-key checks move into the in-scope egress_trees.py as a check-request subcommand given only the trees
    and head_tree_bytes fields, never the key; never a raise (Decision 128). The relay''s read side is bounded by the same 300 s deadline
    only through the writer: the writer is main''s keyed_run streaming a file, and the job''s timeout-minutes is the backstop for a
    stalled writer. If the check-request relief fires, the launcher runs PYTHON -I -S INSTALL_DIR/egress_trees.py check-request as root
    with stdin {mode, trees, head_tree_bytes}, never the key. make_dirs takes the already-created session base, so there is one session
    base, one cleanup entry, and one directory that the head -v path and in/events share. Session keeps the extract Popen (session.extract);
    cleanup kills and waits it before the rmtree. Second relief, if the first is not enough: the main-tree lstat, owner and mode check
    and the statvfs line move into egress_trees.py check-request too.'
- file: scripts/personas/egress_trees.py
  action: Create
  purpose: 'Stdlib-only tree packer, installed beside the launcher (root launcher runs it as a subprocess) and imported from the checkout
    by the floor and materialise. pack(root, out) writes an uncompressed tar from a sorted lstat walk keeping directories and regular
    files only; any ''.git'' or ''__pycache__'' component, *.pyc, symlinks, other file types and names with NUL or control characters
    are skipped and counted; dotfiles (.github, .claude) are kept. copy_tree(src, dest) applies the same walk and filters as a direct
    copy (no tar). extract(stream, length, dest) reads exactly length bytes and refuses (exit 2, TREES-REFUSED <reason>, dest removed)
    an existing dest, more than TREE_MAX_MEMBERS (200000) members, more than TREE_MAX_BYTES (1 GiB) of tar or of unpacked files, a member
    that is not a regular file or directory, an absolute or ''..'' name, a ''.git'' component, a NUL or control character, or a duplicate;
    files are written with O_NOFOLLOW|O_EXCL, 0644, directories 0755. The caps are deliberately high (operator ruling 2026-11-27 12:10
    UTC; rec-5721 tunes them with the measured trajectory in context). CLI: extract DEST LENGTH reads the tar from stdin. The relative
    destination is resolved against the caller''s cwd (the launcher sets it). copy_tree opens each source with O_NOFOLLOW, requires
    fstat to show a regular file, and writes 0644 files and 0755 directories like extract. A check-request subcommand (the launcher''s
    relief) validates the trees and head_tree_bytes fields from stdin JSON. check-request takes {mode, trees, head_tree_bytes} on stdin
    and exits 2 with TREES-REFUSED <reason> on any refused form the launcher row lists.'
