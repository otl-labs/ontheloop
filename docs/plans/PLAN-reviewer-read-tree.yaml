constraints:
- Rules always come from main (main's workflow_run definition, the image pinned from main, the contract inside the image); head content
  is data, never imported, executed or installed; no write tool and no network beyond the existing model endpoint (Decision 205 cl.1-2).
- 'The root launcher takes no tree path from anyone: its argv stays probe|run, main''s tree is a root-held copy made at floor time,
  and the head tree is request data unpacked host-side by an unprivileged subprocess in its own session directory.'
- 'No persona contract names read_tree in this change, and code_reviewer''s prompt wording and review scope are unchanged: both are
  rec-5725''s (operator split 2026-11-27 12:57 UTC).'
- Caps are deliberately high (operator 2026-11-27 12:10 UTC); rec-5721 tunes them. No spend mechanism (operator ruling 2026-11-27, rec-5707).
- 'Build only after PLAN-code-reviewer-add (rec-5696, rec-5708) is merged and built: this plan edits its review_input.py, test_review_input.py,
  launcher and keyed_run.py, and builds on its raised launcher limits.'
- Decompose, never raise, a file that crosses its SLOC budget (Decision 128); persona-verdict.yml and its guards are not edited.
- No rescue agents or workaround loops (Decision 55).
