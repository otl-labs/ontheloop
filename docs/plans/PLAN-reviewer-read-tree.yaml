  this code half; rec-5725 the wording half (code_reviewer opts into read_tree, two-part review scope in both lanes, approval run),
  briefed at /mnt/project-files/reviewer-read-tree/HANDOFF-wording-half.md; rec-5709 waits on both.'
- 'Follow-on recs filed 2026-11-27: rec-5721 (tune read_tree caps; depends on rec-5725), rec-5722 (human flag for PRs that edit the
  reviewer''s own rules, before the T4.28 c6 flip), rec-5723 (wording-check gap).'
- 'Unbuilt plan editing the same files: PLAN-code-reviewer-add (branch claude/project-thread-hdq7da): egress_launcher.py, keyed_run.py,
  materialise.py, test_materialise.py, executor-personas.yaml, review_input.py; this plan rebases onto its build.'
- 'Design notes: target tree is distinct from repo (a writable workspace verdict personas still may not name); ''main'' is main at the
  workflow''s run SHA (the in-session lane''s origin/main), not the merge base; a cap hit ends the run at once; not_examined is shell-computed.
  Delivery (critique r1): the root launcher takes no tree path; main is copied root-side at floor time from the floor''s own checkout,
  the head tree arrives as raw tar bytes after the stdin request line and is unpacked by an unprivileged subprocess, so sudoers, argv,
  the workflow and its guards are unchanged.'
