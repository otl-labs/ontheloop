    characters dropped). One whole-tree pass over the head snapshot (regular UTF-8 files up to 2 MiB; binaries, symlinks, ''.git'' and
    the plan''s own path skipped) matches the escaped terms as whole words; output JSON {terms: [{term, kind, source, hits: [{path,
