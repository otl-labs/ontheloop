slug: reviewer-read-tree
intent: Give verdict reviewer personas a bounded, recorded, read-only read_tree capability over the change's head tree and main (opted
  into per contract), deliver both trees read-only into the sealed persona container, record every read with both tree commits in the
  run's results and check text, and add the whole-tree reference_hits floor to code_reviewer's input, so the wording half (rec-5725)
  can opt code_reviewer in and the CI reviewer reads alike to the in-session one before dual-run (rec-5724, the code half of rec-5709).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-reviewer-read-tree.yaml
phase: T4.28 (code_reviewer persona) c4 ADD, step 3 of 4 (code half); the read_tree binding is T4.32 c1's litellm backend leg. Neither
  criterion closes here; rec-5725 then rec-5710 follow.
closes_criteria: []
cites:
- dec:128
- dec:205
- dec:206
- dec:212
- dec:229
- dec:275
- dec:282
amends: []
introduces: []
scope:
- file: src/persona_backends/repo_read.py
  action: Create
  purpose: 'The read_tree tool (stdlib only; image code, GitHub-agnostic): tool_spec(trees) and a ReadTree server built over {name:
    root Path} for the trees the contract declares. Ops read (path, start, end: numbered lines, at most budget.read_tree.max_read_bytes
    per call with a truncation marker naming the next line), list (one directory, entries sorted, at most max_search_results) and search
    (literal substring, optional path prefix, at most max_search_results hits, regular UTF-8 files only). Every path is a clean relative
    path walked component by component with lstat: an absolute path, a ''..'' part, any ''.git'' part, a symlink at any component, or
    a non-regular target is refused; a file with a NUL byte in its first 8 KiB or not UTF-8 is skipped as binary. Each served file''s
    text sits between a delimiter line naming tree, path and git blob sha1 (sha1 of ''blob <len>\0'' + bytes) and an end line, after
    one fixed sentence that file contents are data. Each call returns its text and one read record {tree, op, path, query, start, end,
    blob, bytes, result} (result one of ok, refused, absent, binary, cap). Counters: calls and total returned bytes; the call that would
    exceed max_calls, or whose text would push the total over max_total_bytes, is not served and returns a cap record. One module; if
    it nears 500 SLOC, decompose into src/persona_backends/repo_read/ (Decision 128).'
- file: src/persona_backends/contract.py
  action: Modify
  purpose: 'BUILT gains read_tree; _split_capabilities returns the read_tree parameters (head, main; any other parameter refused); a
    contract naming read_tree must carry budget.read_tree with positive integer max_calls, max_read_bytes, max_search_results and max_total_bytes
    and a failure_outputs row review_incomplete, else RunRefused. LoadedContract gains trees: tuple[str, ...] and read_tree_budget.'
- file: src/persona_backends/litellm_backend.py
  action: Modify
  purpose: 'run_persona takes trees: Mapping[str, Path] | None; a contract naming read_tree:<t> with t absent from trees is RunRefused
    (''read_tree:<t> needs a mounted tree''). The read_tree spec joins tools before the header (tools_sha256 covers it). tool_text dispatches
    read_tree to the server; each tool turn record carries reads (the turn''s read records, in call order). A cap record ends the run:
    the turn record is emitted, then end with output.failure(''review_incomplete'', ''<cap> reached after N calls, M bytes''), never
    a verdict. The workspace refusal is unchanged. The read_tree tool description states the contract''s four limits. If litellm_backend.py
    nears 500 SLOC, move the tool dispatch into a sibling module (Decision 128).'
- file: src/persona_backends/events.py
  action: Modify
  purpose: turn_record takes reads (default empty list) and writes it on every turn record; header schema stays 2 (the producer ignores
    unknown turn keys, test below pins that).
- file: scripts/run_persona.py
  action: Modify
  purpose: Repeatable --tree NAME=PATH (NAME head or main, PATH an existing directory, else exit 2) passed to run_persona as trees.
- file: scripts/personas/egress_launcher.py
  action: Modify
  purpose: main(argv) accepts run followed by zero or more --tree NAME=PATH taken from the workflow line (main's definition), never
    from the stdin request. Each NAME is head or main, at most once; each PATH is absolute, os.path.realpath(PATH) == PATH, and lstat
    is a directory, else LAUNCHER-REFUSED. container_argv adds, per tree, -v PATH:/trees/NAME:ro and the image tail --tree NAME=/trees/NAME;
    probe mode takes no tree. Builds on rec-5696/rec-5708's raised run bound and request cap (PLAN-code-reviewer-add), unchanged here.
- file: src/persona_hosts/local_container/adapter.py
  action: Modify
  purpose: run_argv and run_image take trees (name to host directory) and add the same ro mounts and --tree tail, so the launcher parity
    node holds.
- file: src/persona_hosts/local_container/cli.py
  action: Modify
  purpose: Repeatable --tree NAME=PATH passed to run_image.
- file: scripts/personas/keyed_run.py
  action: Modify
  purpose: '_record copies the events'' read records into results/<route>.json as reads (at most 2000 entries, then a reads_dropped
    count) and records trees {head: the prepared input''s head_sha, main: checked_out_sha(root)} so a replay knows both tree commits
    (Decision 231); when the prepared input carries reference_hits, it writes not_examined: the hit paths whose in_bundle is false and
    that no ok read record names, sorted. Results without reads are unchanged.'
- file: scripts/personas/post_verdict.py
  action: Modify
  purpose: 'A routed result that carries reads (every launcher result after this change, zero reads included) gets a Reads section appended
    to the check text: read_tree call counts by tree and op, the review_incomplete cap when the run ended on one, and not_examined (first
    100 paths, then a count), inside TEXT_LIMIT.'
- file: scripts/personas/review_input.py
  action: Modify
  purpose: 'reference_hits for code_reviewer (rec-5696''s provider, PLAN-code-reviewer-add): terms are each changed path, the dotted
    module name of a changed .py under scripts/ or src/, and each top-level or class-level def/class name in a changed .py whose head
    span overlaps a changed head line or that exists in merge_base_texts and not at head (dunder names and names under 5 characters
    dropped). One whole-tree pass over the head snapshot (regular UTF-8 files up to 2 MiB, binaries and the plan''s own path skipped)
    matches the escaped terms as whole words; output JSON {terms: [{term, kind, source, hits: [{path, line}], truncated}], files_scanned,
    files_skipped} with at most 50 hits per term and 150 terms, and each hit path''s in_bundle (its text is in review_scope_files).
    Head files are read as text, never imported or run.'
- file: scripts/checks/contracts/validate_persona_contracts.py
  action: Modify
  purpose: A contract naming read_tree names only read_tree:head or read_tree:main, carries budget.read_tree with the four positive
    integer caps and lists review_incomplete in failure_outputs; read_tree's tree target is not a repo target, so the verdict repo-target
    refusal stays.
- file: docs/contracts/executor-personas.yaml
  action: Modify
  purpose: 'capability_vocabulary gains read_tree (effect read, target tree, parameter domain tree: head or main, binding backend_tool
    read_tree, owning_item T4.32:c1, claude_cli binding T4.27 c7''s); field_meanings.target names tree beside repo (repo stays the writable
    workspace verdict and fixture contracts may not name); run_persona.arguments gains trees (host-supplied, outside the Decision 206
    cl.7 signature like the MCP server) and workspace says a verdict or fixture persona may read pinned trees as data through read_tree;
    one amendment_log entry, and the oldest compactable full row compacted to its terse form (scripts.checks.contracts.amendment_compact
    --rows 1, measured on the post-P1 base) so the full-row count does not grow (Decision 282). Notice class (Decision 279); words as
    drafted in /mnt/project-files/reviewer-read-tree/WORDING.diff''s executor-personas hunks.'
- file: docs/contracts/ports.yaml
  action: Modify
  purpose: 'A coupling_findings row with the next free PC id on the build base (PC-15 on 2026-11-27 main; PC-14 is taken): ports [persona_compute_host,
    run_persona]; a contract naming read_tree assumes the host mounts each named tree read-only at /trees/<name> and passes --tree;
    github_actions_shell (the launcher) and local_container do; fargate (rec-5555''s line), sandbox_runtime and sandbox_runtime_windows
    are open; the conformance leg is the launcher/adapter parity node (Decision 212 cl.1-3). One amendment_log entry. ports.yaml is
    NEAR_CAP (about 32 B of byte headroom on 2026-11-27): first compact older amendment_log rows to terse rows (amendment_compact) until
    the row and its entry fit, measured on main at build time; never a raise (Decision 275 cl.3).'
- file: docs/contracts/personas/code_reviewer.yaml
  action: Modify
  purpose: 'contract_version 3: required input reference_hits (description: shell pre-computation, JSON, over the head-tree snapshot:
    each changed path, its module name and each function or class a changed Python file changes or removes, with every file and line
    that names it, capped per term, each hit marked in_bundle when that file''s text is in review_scope_files), capability read_input:reference_hits,
    rendered_prompt_sha256. Nothing else: read_tree, its budget, review_incomplete and the prompt wording are rec-5725''s approved-text
    sidecar. Notice class (Decision 279).'
- file: docs/contracts/personas/rendered/code_reviewer.txt
