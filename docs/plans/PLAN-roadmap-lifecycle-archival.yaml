bundled_recommendations: [rec-4131]
followon_recs: [rec-4458]
infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition. compute_affected_artifacts(<this
    plan's scope>) returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']}, because the live roadmap is a packaged
    asset of the active data-pipeline artifact (src/lambdas/data-pipeline/manifest.yaml). No build, deploy or smoke test
    is owed:
    - the change to that asset is data only;
    - its sole runtime reader, src/data/handlers/scheduled_agent_handler.py, puts the raw text into a prompt behind a
      disabled schedule, and T4.12 cF owns repointing the data-pipeline manifest consumers;
    - the manifest is left unchanged and the archive is NOT added as an asset, because nothing at runtime reads it;
    - making the handler hydrate would touch src/data/handlers/** and so trigger V3 and deploy-prod-lambdas.yml.
    VP step 16 asserts this ground. Precedents: PLAN-roadmap-terminal-compaction VP 9 / rec-3990 and
    PLAN-project-configuration-homes. No .tf file is in scope.
acceptance_criteria:
  - >-
    Every tier_item that origin/main records as status complete or reserved, except those in archival_exceptions (10 at planning), is a
    stub in docs/ROADMAP-PLATFORM.yaml equal to derive_stub of its record. Its record sits byte-for-byte in
    docs/ROADMAP-PLATFORM-ARCHIVE.yaml, in live-file order, and the live id order is identical to origin/main's (VP 8).
  - >-
    scripts.platform_roadmap_state.load returns a document whose model_dump equals origin/main's, with
    document.agent_instructions set aside because it gains only the appended archive bullet. compute_state_dict on both
    trees is error-free and equal. A stub that differs from its record, a record without a stub, a stub without a
    record, or an absent archive behind stubs fails the load, and validate_platform_roadmap FAILs with the archive
    integrity message (VP 2, 3, 6, 9).
  - >-
    The following all pass: validate_platform_roadmap, check_roadmap_regrowth, validate_roadmap_liveness, the two
    candidate-decision guards, validate_work_item_pilot, validate_ports_contract and validate_project_configuration.
    check_roadmap_regrowth reports escalate=false with headroom of at least 500 (re-simulated at about 1,765), and the
    archive stays under the unchanged 10,000-line ceiling. _ROADMAP_MAX_LINES, _CEILING_LINES and
    _ESCALATE_HEADROOM_LINES are unchanged (VP 10).
  - >-
    Five guards are extended to archived records (Decision 181):
    - criterion (ii) fails an archived record that is edited and still carries a bare-string criterion, and passes a
      pure move;
    - regrowth in an archived record is reported;
    - liveness leg C does not read unchanged archived criteria as added;
    - pilot refs to archived criteria resolve;
    - the licence class-(a) pattern covers the archive.
    The five whole-file absence shards' phrases are asserted absent from the archive by the graduated
    roadmap-archive-absence-guards step (VP 4-6, 11-12).
  - >-
    Every changed scripts/ file reaches 100% line coverage from its own mirror test (VP 7).
  - >-
    Decision NNN lands verbatim (APPROVED TEXT A), under the 6,144-byte cap and conformant, and its reversal-conditions
    stanza parses. Decisions 114 and 147 carry notes B and C, docs/decisions-index.json is fresh, and
    authorization_failure(dec-NNN, docs/ROADMAP-PLATFORM-ARCHIVE.yaml) is False (VP 13-15).
  - >-
    The archive is registered as a docs-root governance file and a platform-roadmap route target, it defers to
    validate_platform_roadmap in the structural-size engine, and the pre-glob closure audit is clean (VP 12). The
    data-pipeline artifact is touched only through its roadmap asset, and no src/, terraform/ or workflow path is in
    the diff (VP 16).
  - >-
    tier-item-lifecycle.yaml carries lifecycle_archival (with an un-archive clause) and archival_exceptions. Every
    exception id is a live, non-stub, retired item whose pinned_by file exists. governance_notes declares the coverage
    and the two residuals, both owned by rec-4458, which stays open; rec-3960's context names rec-4458 (VP 6, 18).
  - >-
    Every scripts/ or src/ .py file that names ROADMAP-PLATFORM at implement time is in this plan's reviewed reader set
    (VP 17). The fast tier passes, and the full tier passes on the committed, rebased tree with --verify-head
    (VP 19-20).
  - >-
    After the squash-merge, rec-4131 is closed through the Resolves trailer with its acceptance holding on main,
    rec-4458 stays open, and dec-NNN reaches ops_decisions (VP 21-22).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Pre-build gate, run once before any edit. Check that the branch contains current origin/main, that no archive
      exists there yet, and that PLAN-project-configuration-homes's check has landed, then print the BEFORE growth
      line.
    command: >-
      git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && ! git cat-file -e origin/main:docs/ROADMAP-PLATFORM-ARCHIVE.yaml 2>/dev/null && test -f scripts/checks/contracts/validate_project_configuration.py && bin/venv-python -c "from scripts.checks.roadmap.check_roadmap_regrowth import growth_line; print('BEFORE', growth_line(len(open('docs/ROADMAP-PLATFORM.yaml', encoding='utf-8').read().splitlines())).strip())"
    expected: >-
      Exit 0, printing a BEFORE growth line that reads escalate=true (at planning, origin/main 5420a3b8 gave lines=9955
      headroom=45). Copy the line into the PR body as the before count.
    fix_if: >-
      If HEAD does not contain origin/main, rebase onto it first (git-ops commit-flow rebase). An archive already on
      origin/main means another plan landed archival: stop and ask the coordinator. A missing
      validate_project_configuration.py means the branch predates commit 9f7aaa4f: rebase.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: Prove that a stub which differs from its archive record fails hydration. This is the defining integrity rule.
    command: >-
      bin/venv-python -m pytest tests/test_roadmap_archive.py::TestHydrate::test_a_stub_that_differs_from_its_record_fails_the_load -q
    expected: Exit 0, one node passes. Red before, because the test module does not exist (pytest exit 4).
    fix_if: A failure means integrity_issues does not compare the stub with derive_stub(record), or hydrate does not raise ArchiveIntegrityError.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: roadmap-archive-stub-must-match-record
  - step: 3
    phase: pre-deploy
    action: Prove that load() hydrates an archived fixture into a document identical to the unarchived one (the load-invariance property).
    command: >-
      bin/venv-python -m pytest tests/test_roadmap_archive.py::TestLoadHydrates::test_an_archived_fixture_loads_identically -q
    expected: Exit 0, one node passes. Red before, because the test module does not exist (pytest exit 4).
    fix_if: A model_dump difference means hydrate reorders items, or load() validates before it hydrates.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: roadmap-archive-load-hydrates-identically
  - step: 4
    phase: pre-deploy
    action: >-
      Prove that criterion (ii) covers archived records: an edited archived record with a bare-string criterion fails,
      and a byte-identical move passes.
    command: >-
      bin/venv-python -m pytest tests/test_roadmap_archive.py::TestCriterionIiArchive::test_an_edited_archived_record_with_a_bare_string_criterion_fails -q
    expected: Exit 0, one node passes. Red before, because the test module does not exist (pytest exit 4).
    fix_if: A failure means criterion_ii_archive_issues compares against the wrong base, or never reports the edited id.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: roadmap-archive-edited-record-structured
  - step: 5
    phase: pre-deploy
    action: Prove that check_roadmap_regrowth reports prose regrowth inside an archived record, so the Decision 163 detector still covers retired items.
    command: >-
      bin/venv-python -m pytest tests/checks/roadmap/test_check_roadmap_regrowth.py::TestArchivedRecords::test_regrowth_in_an_archived_record_is_reported -q
    expected: Exit 0, one node passes. Red before, because the node does not exist (pytest exit 4).
    fix_if: A failure means the regrowth scan reads only the live file.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: roadmap-archive-regrowth-reported
  - step: 6
    phase: pre-deploy
    action: Run every test module this plan creates or modifies, plus the roadmap-state and platform-roadmap suites the load() hook touches.
    command: >-
      bin/venv-python -m pytest tests/test_roadmap_archive.py tests/checks/roadmap/test_check_roadmap_regrowth.py tests/checks/roadmap/test_validate_roadmap_liveness.py tests/checks/roadmap/test_validate_work_item_pilot.py tests/checks/roadmap/test_validate_platform_roadmap.py tests/checks/hygiene/test_validate_licence_consistency.py tests/checks/contracts/test__manifest.py tests/checks/contracts/test_validate_ports_contract.py tests/checks/contracts/test_validate_project_configuration.py tests/platform_roadmap_state -q
    expected: Exit 0, and every case in execution step 19 passes.
    fix_if: Fix the behaviour under test, never the assertion (Decision 181).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A whole-file re-run of test files this plan creates or modifies (vp-red-before.yaml hermetic_authoring rule v).
      The fast tier's pytest diff runs them on every PR, and steps 2-5 graduate the four defining nodes.
  - step: 7
    phase: pre-deploy
    action: >-
      Coverage gate (F1). Every changed scripts/ file has a mirror test and reaches 100% line coverage from it. This is
      the same measurement the full tier's validate_test_coverage runs.
    command: >-
      bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage
    expected: Exit 0, with every mapping line 100.0%.
    fix_if: >-
      An uncovered line in a check names a branch that should have lived in roadmap_archive.py (move it there), or a
      missing case in that check's mirror test (add it there). Never add a coverage baseline entry, and never touch
      tests/checks/roadmap/test_validate_platform_roadmap.py (492 of 500 SLOC; Decision 128).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_test_coverage is registered in the full tier and measures every changed file on every run; this step runs it early so a gap is found before VP 20.
  - step: 8
    phase: pre-deploy
    action: >-
      Prove the move against origin/main:
      - live ids keep origin/main's order;
      - stubs and archive records are exactly the retired, non-exception set, in order;
      - every record equals origin/main's item, and every stub equals derive_stub(record);
      - every record's origin/main text block appears byte-for-byte in the archive.
    command: >-
      bin/venv-python -c "import subprocess, yaml; from scripts.roadmap.roadmap_archive import derive_stub; R=lambda p: open(p, encoding='utf-8').read(); B=subprocess.run(['git', 'show', 'origin/main:docs/ROADMAP-PLATFORM.yaml'], capture_output=True, text=True, encoding='utf-8', check=True).stdout; ex=set(yaml.safe_load(R('docs/contracts/tier-item-lifecycle.yaml'))['archival_exceptions']); bd=yaml.safe_load(B); want=[i['id'] for i in bd['tier_items'] if i.get('status') in ('complete', 'reserved') and i['id'] not in ex]; lv=yaml.safe_load(R('docs/ROADMAP-PLATFORM.yaml')); A=R('docs/ROADMAP-PLATFORM-ARCHIVE.yaml'); ar=yaml.safe_load(A); bi={i['id']: i for i in bd['tier_items']}; stubs=[i for i in lv['tier_items'] if i.get('archived') is True]; recs=ar['tier_items']; assert [i['id'] for i in lv['tier_items']] == [i['id'] for i in bd['tier_items']], 'live id order changed'; assert [s['id'] for s in stubs] == want == [r['id'] for r in recs], (len(stubs), len(recs), len(want)); assert all(r == bi[r['id']] and derive_stub(r) == s for r, s in zip(recs, stubs)), 'record or stub differs'; L=B.splitlines(keepends=True); s0=L.index('tier_items:\n'); e0=L.index('cross_tier_gates:\n'); st=[k for k in range(s0, e0) if L[k].startswith('  - id: ')]; blk={L[k][8:].strip(): ''.join(L[k:next((j for j in range(k + 1, e0) if L[j].startswith(('  - id: ', '  #')) or not L[j].strip()), e0)]) for k in st}; miss=[w for w in want if blk[w] not in A]; assert not miss, miss; print('ARCHIVE_MOVE_OK', len(recs), len(ex))"
    expected: Exit 0 and the marker with the record and exception counts (97 and 10 at planning; the record count follows main).
    fix_if: >-
      An order failure means a stub was moved. A set mismatch means a stale exception list or a missed newly retired
      item. A text-block miss means a record was reformatted rather than moved. Redo execution step 5 from
      origin/main; never hand-edit around it.
    hermetic: true
    expected_literals:
      - ARCHIVE_MOVE_OK
    graduation: waive
    graduation_waiver_reason: >-
      A one-time move proof relative to origin/main. It is PR-relative, so replay excludes it once the base collapses.
      After merge, the load-time integrity check (steps 2-3) guards the standing property.
  - step: 9
    phase: pre-deploy
    action: >-
      Prove that the hydrated document, and compute_state_dict on both trees, equal origin/main's unarchived roadmap, so
      no consumer sees a change. document.agent_instructions may differ only by the appended archive bullet. The
      snapshot dir symlinks plans/ to docs/plans, so both projections read the same plans.
    command: >-
      bin/venv-python -c "import json, os, subprocess, tempfile; from pathlib import Path; from scripts.platform_roadmap_state import compute_state_dict, load; B=subprocess.run(['git', 'show', 'origin/main:docs/ROADMAP-PLATFORM.yaml'], capture_output=True, text=True, encoding='utf-8', check=True).stdout; d=Path(tempfile.mkdtemp()); (d / 'ROADMAP-PLATFORM.yaml').write_text(B, encoding='utf-8'); os.symlink(Path('docs/plans').resolve(), d / 'plans'); old=load(d / 'ROADMAP-PLATFORM.yaml'); new=load(Path('docs/ROADMAP-PLATFORM.yaml')); a=old.model_dump(); b=new.model_dump(); ai=a['document'].pop('agent_instructions'); bi=b['document'].pop('agent_instructions'); assert a == b, 'hydrated document differs from origin/main'; assert bi.startswith(ai.rstrip()) and 'ROADMAP-PLATFORM-ARCHIVE.yaml' in bi[len(ai.rstrip()):], 'agent_instructions changed beyond the appended bullet'; so=compute_state_dict(d / 'ROADMAP-PLATFORM.yaml'); sn=compute_state_dict(Path('docs/ROADMAP-PLATFORM.yaml')); J=lambda x: json.dumps(x, sort_keys=True, default=str); assert 'error' not in so and 'error' not in sn, (so.get('error'), sn.get('error')); assert J(so) == J(sn), 'state projection differs'; print('HYDRATED_EQUIVALENT_OK', len(new.tier_items), len(sn['next_eligible']))"
    expected: >-
      Exit 0 and the marker with the tier_item count and the next_eligible count (176 and 11 in the origin/main
      5420a3b8 re-simulation).
    fix_if: >-
      A model_dump difference names a reordered or altered record: restore it from origin/main. An agent_instructions
      failure means more than the one bullet changed. An 'error' key means compute_state_dict's own load failed: read
      the message (an archive integrity issue) before comparing.
    hermetic: true
    expected_literals:
      - HYDRATED_EQUIVALENT_OK
    graduation: waive
    graduation_waiver_reason: >-
      A PR-relative one-time proof (the base collapses after merge); on the pre-change tree the documents are trivially
      equal. Steps 2-3 graduate the load-invariance rule on fixtures.
  - step: 10
    phase: pre-deploy
    action: >-
      Run every roadmap consumer gate on the real tree and print the AFTER growth line. Assert escalate=false
      (headroom of at least 500) and that the archive is under the unchanged ceiling.
    command: >-
      bin/venv-python -c "from scripts.checks.roadmap.validate_platform_roadmap import validate_platform_roadmap as a; from scripts.checks.roadmap.check_roadmap_regrowth import check_roadmap_regrowth as b, growth_line; from scripts.checks.roadmap.validate_roadmap_liveness import validate_roadmap_liveness as c; from scripts.checks.roadmap.validate_candidate_decision_ratification import validate_candidate_decision_ratification as d; from scripts.checks.roadmap.validate_candidate_decision_supersession import validate_candidate_decision_supersession as e; from scripts.checks.roadmap.validate_work_item_pilot import validate_work_item_pilot as g; from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as h; from scripts.checks.contracts.validate_project_configuration import validate_project_configuration as k; f=[]; [x(f) for x in (a, b, c, d, e, g, h, k)]; assert not f, f; n=len(open('docs/ROADMAP-PLATFORM.yaml', encoding='utf-8').read().splitlines()); m=len(open('docs/ROADMAP-PLATFORM-ARCHIVE.yaml', encoding='utf-8').read().splitlines()); gl=growth_line(n); assert 'escalate=false' in gl and m <= 10000, (gl, m); print('AFTER', gl.strip(), 'archive_lines=%d' % m); print('ARCHIVAL_GATES_OK')"
    expected: >-
      Exit 0, the AFTER line and the marker. The origin/main 5420a3b8 re-simulation, including the header and
      agent_instructions additions, gave lines=8235 headroom=1765 escalate=false archive_lines=2405 (the record count
      follows main). Copy the line into the PR body as the after count.
    fix_if: >-
      A gate failure names its rule: fix the hydration or the moved data, never the gate. escalate=true means main grew
      past the archival yield: stop and escalate to the operator and rec-4458 (Decision 55). Never raise a constant,
      and never widen archival to non-retired items.
    hermetic: true
    expected_literals:
      - ARCHIVAL_GATES_OK
    graduation: waive
    graduation_waiver_reason: >-
      Every gate called is registered in both tiers. Graduating the escalate=false assertion would install a second,
      lower ceiling beside Decision 114's (the PLAN-roadmap-terminal-compaction VP 2 precedent); check_roadmap_regrowth's
      escalate field stays the sanctioned observable.
  - step: 11
    phase: pre-deploy
    action: >-
      Archive absence guards (critique r2 F3). The phrases that the five whole-file absence shards forbid in the live
      roadmap must also be absent from the archive. Those shards are roadmap-retired-brand-tokens-absent,
      roadmap-port-adoption-criteria, rec-3226-sole-verifier-substrate-neutral, gc-c2-criterion-rewritten and
      requirements-lock-unreferenced-in-live-surfaces.
    command: >-
      bin/venv-python -c "import json, re, yaml; from pathlib import Path; t=Path('docs/ROADMAP-PLATFORM-ARCHIVE.yaml').read_text(encoding='utf-8'); j=json.dumps(yaml.safe_load(t)); bad=[p for p in ('port registry + trace schema', 'the executor runs neither in AWS', 'requirements.lock') if p in t] + [p for p in ('S3 storage confirmed stable after N maintenance cycles',) if p in j] + re.findall(r'portfolio purposes|portfolio-grade|portfolio-narrative|theseus init|theseus\.support|Theseus platform|theseus_cli', t, re.I); assert not bad, bad; print('ARCHIVE_ABSENCE_GUARDS_OK')"
    expected: >-
      Exit 0 and the marker; the re-simulated archive holds none of the phrases. Red before, because the archive does
      not exist (FileNotFoundError, exit 1).
    fix_if: >-
      A listed phrase means a moved record carries text the live shards forbid. Stop: VP 8 proves the move is
      byte-for-byte from a tree where those shards pass, so the record was edited.
    hermetic: true
    expected_literals:
      - ARCHIVE_ABSENCE_GUARDS_OK
    graduation: graduate
    graduation_check_id: roadmap-archive-absence-guards
  - step: 12
    phase: pre-deploy
    action: >-
      Prove the registrations: the docs-root allowlist and router targets, the structural-size limits and raise guard
      (the E3 deferral is authorized by dec-NNN), licence class-(a) hygiene over the archive, and the pre-glob closure
      audit.
    command: >-
      bin/venv-python -c "from scripts.checks.hygiene.validate_placement import validate_placement as a; from scripts.checks.structural.size_limits import validate_structural_size_limits as b; from scripts.checks.structural.budget_raises import validate_structural_size_budget_raises as c; from scripts.checks.hygiene.validate_licence_consistency import validate_licence_consistency as d; from scripts.checks.deps.validate_pre_glob_closure import validate_pre_glob_closure as e; f=[]; [x(f) for x in (a, b, c, d, e)]; assert not f, f; print('REGISTRATIONS_OK')"
    expected: >-
      Exit 0 and the marker. All five were measured red on a prototype without these edits: the docs-root allowlist,
      2,401 effective lines over the roadmaps limit of 500, and the closure audit naming scripts/roadmap/roadmap_archive.py.
    fix_if: >-
