  - >-
    Re-check Decision numbering (constraints). Choose NNN (at least 227), then substitute NNN and DATE wherever they
    appear in APPROVED TEXT A, B and C, in dec-NNN in config/structural_size_budgets.yaml, and in the Decision citations
    in tier-item-lifecycle.yaml and file-router.yaml. Substitute them nowhere else.
  - >-
    Create scripts/roadmap/roadmap_archive.py. It does no I/O at import and never raises at import; type hints are required. It
    parses YAML with scripts.contract_rules.parse_yaml, as load() does. Its public surface:
    - ARCHIVE_REL_PATH = "docs/ROADMAP-PLATFORM-ARCHIVE.yaml".
    - STUB_FIELDS = ("id", "tier", "name", "depends_on", "status", "completed_at") and RESERVED_STUB_FIELDS = ("id",
      "tier", "name", "intent", "depends_on", "status").
    - class ArchiveIntegrityError(ValueError), carrying .issues: list[str], whose str() starts "archive integrity: ".
    - archive_path_for(roadmap_path) returns the sibling <stem>-ARCHIVE<suffix>.
    - derive_stub(record) returns the record's present STUB_FIELDS (RESERVED_STUB_FIELDS when its status is
      reserved), plus archived: True.
    - integrity_issues(document, archive) returns a list of issues, each naming its id:
      (a) a non-None archive is a mapping whose keys are exactly archive_of (a non-empty str) and tier_items (a list of
          mappings with str ids);
      (b) record ids are unique, every record's status is complete or reserved, and no record carries archived;
      (c) every live item that carries an archived key has the value True;
      (d) stub ids are unique, every stub has exactly one record, and stub == derive_stub(record);
      (e) every record has exactly one stub;
      (f) stubs with a None archive are one issue.
    - hydrate(document, archive) returns a non-mapping document unchanged, and returns the document unchanged when it
      has no stubs and archive is None. Otherwise it returns a shallow copy whose tier_items have each stub replaced
      IN PLACE by its record, raising ArchiveIntegrityError on any issue.
    - has_stubs(document) is True when the document is a mapping whose tier_items hold any mapping carrying an archived
      key.
    - hydrate_base(document, archive_text) is the LENIENT diff-base hydrator, for origin/main, which was validated when
      it merged. It never raises. It returns the document unchanged when it has no stubs. It parses archive_text (None,
      unparseable or non-mapping text means no records) and replaces each stub in place by the record with the same id
      when one exists. It never compares the stub against derive_stub, so a future STUB_FIELDS revision cannot turn
      every archived record into a false "edited" (critique r3 F2).
    - read_archive(roadmap_path) returns the parsed sibling, or None when it is absent.
    - archive_texts(roadmap_path) returns [] when the sibling is absent, else [its text].
    - hydrate_from_disk(document, roadmap_path).
    - edited_records_with_bare_strings(archive, base_items) returns the sorted ids of archive records that differ from
      base_items[id] (or are absent from it) and carry a str entry in exit_criteria.
    - criterion_ii_archive_issues(roadmap_path, base_reader) returns [] when the sibling is absent. When
      base_reader(roadmap rel path) returns None, it prints "  SKIP: origin/main roadmap unreachable -- criterion (ii)
      archive leg not evaluated" and returns []. Otherwise base_items comes from hydrate_base(parsed base,
      base_reader(ARCHIVE_REL_PATH)), keyed by id, and it returns one FAIL line per edited id: "  FAIL: archived
      tier_item '<id>' is edited relative to origin/main but still has bare-string criteria -- convert to
      ExitCriterion objects".
  - >-
    scripts/platform_roadmap_state.py: load() becomes parse_yaml(text), then hydrate_from_disk(data, Path(path)), then
