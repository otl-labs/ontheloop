test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: Exactly the retired, non-exception items are stubs equal to derive_stub(record), in origin/main's id order.
    verification_step: 8
    command: >-
      ARCHIVE_MOVE_OK
    red_green_expectation: Red before, because no stub exists and the archive is absent, so the read raises (exit 1). Green after.
  - source: docs/ROADMAP-PLATFORM-ARCHIVE.yaml
    behavior: Every archived record equals origin/main's item and its text block appears byte-for-byte; none of the five absence shards' phrases appear.
    verification_step: 8
    command: >-
      blk[w] not in A
    red_green_expectation: Red before (the archive is absent, exit 1). Green after; VP 11 graduates the absence half.
  - source: scripts/roadmap/roadmap_archive.py
    behavior: >-
      A stub that differs from derive_stub(record) fails hydration with ArchiveIntegrityError naming its id. The mirror
      test covers the whole module at 100%.
    verification_step: 2
    test_selector: tests/test_roadmap_archive.py::TestHydrate::test_a_stub_that_differs_from_its_record_fails_the_load
    red_green_expectation: Red before, because the module and its mirror test do not exist (pytest exit 4). Green after.
  - source: scripts/platform_roadmap_state.py
    behavior: load() hydrates stubs before schema validation, so an archived fixture loads identically to its unarchived twin.
    verification_step: 3
    test_selector: tests/test_roadmap_archive.py::TestLoadHydrates::test_an_archived_fixture_loads_identically
    red_green_expectation: >-
      Red before (the node is absent, pytest exit 4). Without the load() hook, the archived fixture fails extra=forbid
      on archived: true. Green after.
  - source: scripts/checks/roadmap/validate_platform_roadmap.py
    behavior: >-
      The registered check FAILs on a broken archive (integrity message), on an oversized archive (the path is named),
      and on an edited archived record that keeps a bare-string criterion. A pure move passes.
    verification_step: 6
    test_selector: tests/test_roadmap_archive.py::TestValidatePlatformRoadmapWiring
    red_green_expectation: Red before (the class is absent). Without the two calls, the check passes all three broken fixtures. Green after.
  - source: scripts/checks/roadmap/check_roadmap_regrowth.py
    behavior: A progress_note re-grown inside an archived record is named on the TERMINAL-ITEM line, and nothing is ever failed or raised.
    verification_step: 5
    test_selector: tests/checks/roadmap/test_check_roadmap_regrowth.py::TestArchivedRecords::test_regrowth_in_an_archived_record_is_reported
    red_green_expectation: Red before (the node is absent, pytest exit 4). Green after.
  - source: scripts/checks/roadmap/validate_roadmap_liveness.py
    behavior: >-
      When the diff base carries stubs, leg C hydrates it leniently from the base archive, so an unchanged archived
      criterion never reads as added. A stub-less base is used unchanged, with no archive read.
    verification_step: 6
    test_selector: tests/checks/roadmap/test_validate_roadmap_liveness.py::TestLegCArchivedBase
    red_green_expectation: Red before (the class is absent). Without the change, a stub-bearing base yields no texts for archived items, so unchanged archived criteria read as added. Green after; the existing TestLegC cases stay green unchanged.
  - source: scripts/checks/roadmap/validate_work_item_pilot.py
    behavior: A Tx:cN ref to an archived item's structured criterion resolves, and a broken archive still fails closed.
    verification_step: 6
    test_selector: tests/checks/roadmap/test_validate_work_item_pilot.py::TestArchivedRoadmapRefs
    red_green_expectation: Red before (the class is absent). Without the change, the stub carries no exit_criteria and the ref fails. Green after.
  - source: scripts/checks/hygiene/validate_licence_consistency.py
    behavior: The archive carries the roadmap's class-(a) old-slug pattern.
    verification_step: 6
    test_selector: tests/checks/hygiene/test_validate_licence_consistency.py::test_the_archive_inherits_the_roadmap_class_a_pattern
    red_green_expectation: Red before (the node is absent; without the row, a KeyError). Green after.
  - source: scripts/checks/contracts/_manifest.py
