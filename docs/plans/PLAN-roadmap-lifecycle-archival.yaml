schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: roadmap-lifecycle-archival
intent: >-
  Restore durable headroom under docs/ROADMAP-PLATFORM.yaml's unchanged 10,000-line ceiling (Decision 114) so the
  platform's sole sequencing source can take the persona-first plans' additions. Retired tier_items move byte-for-byte
  to docs/ROADMAP-PLATFORM-ARCHIVE.yaml behind 7-line dependency-resolving stubs (Decision 147's first named reversal
  valve, licensed by Decision 197 clause 8). The roadmap loader hydrates every stub, so no consumer sees a different
  document. The live file goes from 9,955 lines (headroom 45, escalate=true) to about 8,235 with escalate=false
  (re-simulated on origin/main 5420a3b8), and every later wave grows the headroom.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-roadmap-lifecycle-archival.yaml
phase: >-
  ad_hoc_rec (soft-warn category): bundles rec-4131 (the Decision 147 regrowth escalation) and acts on rec-3960's
  structural-fix ownership, citing rec-3960 rather than closing it because its other residuals stay open. The plan
  names no tier_item, closes no exit criterion and adds no depends_on edge, so the Tier Item Freshness Gate is skipped.
  Overseer run persona-first-migration, Plan 0 (headroom for Plans 1-2).
closes_criteria: []
