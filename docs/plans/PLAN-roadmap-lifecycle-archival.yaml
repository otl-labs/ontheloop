    verification_step: 14
    command: >-
      validate_decisions_index_freshness as d
    red_green_expectation: Red before regeneration (the freshness check names the stale index). Green after the --write.
constraints:
  - "Decision 67: IMPLEMENTATION only."
  - >-
    No raise, ever, in this plan (Benjamin, 2026-10-18). _ROADMAP_MAX_LINES (10,000), check_roadmap_regrowth's
    _CEILING_LINES and _ESCALATE_HEADROOM_LINES (500), the roadmaps class limit, and every coverage threshold stay
    unchanged. The archive reuses the same constant, so no new number exists.
  - >-
    Decision 147 and Decision 197 clause 8: this is lifecycle archival, never another ad hoc trim and never a per-tier
    split. The move edits no record's content. Candidate decisions, north_star, cost_projection, every non-retired item
    and the 10 archival_exceptions items stay byte-identical.
  - >-
    Decision 181 (never weaken), bounded:
    - Exactly five guards are extended to cover archived records: criterion (ii), regrowth, liveness leg C, pilot
      resolution and licence class-(a).
    - The five whole-file absence shards (roadmap-retired-brand-tokens-absent, roadmap-port-adoption-criteria,
      rec-3226-sole-verifier-substrate-neutral, gc-c2-criterion-rewritten,
      requirements-lock-unreferenced-in-live-surfaces) stay untouched, because a modified shard must fail on
      origin/main to be admitted. Their phrases are covered for the archive by the NEW graduated step VP 11
      (roadmap-archive-absence-guards).
    - No test assertion, existing test mock or registry shard is edited or dropped. In particular, the existing
      TestLegC base-reader mocks stay unchanged, because leg C reads the archive only for a stub-bearing base (critique
      r3 F1). The _COPIED additions are fixture plumbing.
    Two declared residuals are owned by rec-4458: (1) archival's "when" is unenforced; (2) a FUTURE whole-file absence
    shard on the live roadmap is not mirrored automatically.
  - >-
    Coverage (validate_test_coverage, full tier) holds every changed scripts/ file to 100% line coverage from its OWN
    mirror test, and config/coverage_baseline.yaml has no entry for any scope file. Therefore:
    - the conditional logic of every archive-aware leg lives in scripts/roadmap/roadmap_archive.py, measured from
      tests/test_roadmap_archive.py;
    - validate_platform_roadmap.py gains only always-executed lines;
    - the new branches in check_roadmap_regrowth.py, validate_roadmap_liveness.py and validate_work_item_pilot.py are
      covered from their own mirror tests, all in scope.
  - >-
    Decision 128: no SLOC raise. SLOC (not raw lines) on main:
    - tests/checks/roadmap/test_validate_platform_roadmap.py is at 492 of 500. It is the binding constraint, and this
      plan does not touch it; its wiring cases live in tests/test_roadmap_archive.py.
    - test_validate_roadmap_liveness.py (423), test_validate_work_item_pilot.py (405) and test_check_roadmap_regrowth.py
      (318) take only their own small archive classes.
    - roadmap_archive.py stays well under 500.
    If any SOURCE file would cross 500, decompose it (facade pattern); never raise. If tests/test_roadmap_archive.py
    nears 500 SLOC, STOP and ask for a plan amendment rather than splitting the mirror test (map_source_to_test resolves
    exactly that one file for coverage).
  - >-
    Approved text. APPROVED TEXT A, B and C land verbatim. The only allowed variance is NNN (the next free Decision
    number at build time, the same everywhere, including dec-NNN in config/structural_size_budgets.yaml) and DATE (the
    merge date, YYYY-MM-DD). Benjamin approved the Decision route (Q2=A1) at Step 6b and confirms the wording on this
    plan's PR; any later change needs his word.
  - >-
