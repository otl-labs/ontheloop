    command: >-
      bin/venv-python -c "import re; from pathlib import Path; D=Path('docs/DECISIONS.md').read_text(encoding='utf-8'); n=int(re.search(r'^## Decision (\d+): Retired roadmap tier_items move to docs/ROADMAP-PLATFORM-ARCHIVE\.yaml', D, re.M).group(1)); import scripts.preflight.decision_conditions as dc; r={x.decision_id: x for x in dc.evaluate()}; assert n in r and r[n].state != 'MALFORMED' and r[n].error is None, r.get(n); from scripts.checks import _marker_guard as mg; assert not mg.authorization_failure('dec-%d' % n, 'docs/ROADMAP-PLATFORM-ARCHIVE.yaml', mg.load_decision_bodies()); S={int(m.group(1)): m.start() for m in re.finditer(r'^## Decision (\d+):', D, re.M)}; nxt=lambda k: min([v for v in S.values() if v > S[k]] + [len(D)]); assert all(('Amended by Decision %d' % n) in D[S[k]:nxt(k)] for k in (114, 147)); print('DECISION_ARCHIVE_AUTHORIZED_OK', n)"
