schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "roadmap-start-edges"
intent: >-
  Give the roadmap a typed start edge so planning eligibility can honour a START order without parsing prose: a
  tier_item's start_edges entry {ref, once: in_progress, note} lets the item become eligible once that depends_on
  entry is in_progress, while depends_on still orders completion. T4.32 gets the edge its approved START sentence
  describes (T4.10a in_progress), so the persona foundation can be planned while the persona contracts are being built.
  First of rec-5037's two plans (the code half); PLAN-planning-eligibility-start-edges rewords the eligibility sentences
  and closes rec-5037.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-roadmap-start-edges.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). First half of
  rec-5037, which T4.32's START annotation names as the fix due before T4.32's first plan.
scope:
  - file: scripts/platform_roadmap_models.py
    action: Modify
    purpose: >-
      Add `class StartEdge(BaseModel)` (extra="forbid"; `ref: str`, `once: Literal["in_progress"]`, `note: str | None =
      None`) beside CriterionBlocker, and `TierItem.start_edges: list[StartEdge] = Field(default_factory=list)`. In
      RoadmapDocument._validate_graph add one step: for every item's start edge, raise ValueError when `ref` matches
      _TIER_SHORTCUT_RE, when `ref` is not in the item's own depends_on, or when two edges share a ref; and when an item
      that carries start_edges has status complete while any depends_on entry is not complete (a concrete id whose
      status is not complete, or a tier shortcut with a live item that is not complete, ignoring reserved and
      deferred_post_mvp as tier_complete does, by reusing _INACTIVE_FOR_TIER from scripts.platform_roadmap_gate_rules, a module
      this file already imports, so new_imports stays empty). The completion guard is scoped to items with start edges only: 11 items
      on main are complete or in_progress with an unfinished dependency, and a global rule would make the roadmap
      unloadable (followon rec below).
    new_imports: []
  - file: scripts/platform_roadmap_state.py
    action: Modify
    purpose: >-
      Add `_start_satisfied(item, dep) -> bool`: True when _dep_satisfied(dep), or when one of item.start_edges has
      ref == dep and the dependency's status is in_progress. eligible_items(), compute_blocked() and _blocked_on() use
      it in place of _dep_satisfied, so their partition of not_started items stays complementary. _item_dict adds
      "start_edges": [edge.ref for edge in item.start_edges]; _item_dict feeds every row type (next_eligible, blocked,
      in_progress, strategic_pending, deferred_post_mvp and the slim /plan projection), and all of them carrying it is
      intended. tier_complete, _dep_satisfied, the gate evaluator and liveness keep demanding complete.
    new_imports: []
  - file: scripts/roadmap/platform_roadmap.py
    action: Modify
    purpose: Re-export StartEdge from the facade (import list and __all__) beside CriterionBlocker.
    new_imports: []
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      T4.32 only: insert after `depends_on: [T4.10a]` the block
      `start_edges:` / `- ref: T4.10a` / `once: in_progress` / `note: "START order from T4.32's approved annotation (PLAN-verdict-persona-roadmap-regrounding, after the pattern
      of T4.2's START ORDER): work may start once T4.10a is in_progress; depends_on still orders completion"`. T4.32's intent, including its approved START sentence, is not edited. No other item changes.
  - file: tests/platform_roadmap_state/test_start_edges.py
    action: Create
    purpose: >-
      Fixture-built (tests/fixtures/platform_roadmap_state.py helpers) and live-roadmap tests: (a) an item whose only
      depends_on is in_progress is blocked without a start edge and eligible with one, and _blocked_on names the
      dependency only while it is not_started; (b) a start edge never makes an item eligible while its dependency is
      not_started, and a second, edgeless depends_on entry still demands complete; (c) the model rejects a tier-shortcut
      ref, a ref outside depends_on, a duplicate ref, an unknown `once` value and an item at complete with an unfinished
      dependency, and accepts that item once the dependency is complete; (d) _item_dict and compute_state_dict's
      next_eligible and blocked rows carry start_edges; (e) on the live roadmap T4.32 carries exactly one start edge
      (ref T4.10a, once in_progress), asserted unconditionally; then, on an in-memory copy of the live roadmap that
      sets T4.32 to not_started and T4.10a first to not_started and then to in_progress (the document is never
      written), T4.32 is blocked and then eligible. No assertion reads a live status, so the test holds as T4.10a and
      T4.32 move through their lifecycles (the "statuses are never pinned" convention of
      tests/roadmap/test_verdict_persona_criteria.py).
  - file: tests/roadmap/test_verdict_persona_criteria.py
    action: Modify
    purpose: >-
      Extend test_t4_32_records_spend_ceiling's live branch: while T4.32 is live, its start_edges, compared over {ref,
      once} with note ignored, equal one edge {ref: T4.10a, once: in_progress} if and only if its bracket carries the
      START sentence, so the prose annotation and the
      typed field cannot drift apart. The terminal branch is unchanged.
  - file: docs/plans/PLAN-roadmap-start-edges.yaml
    action: Create
    purpose: This plan.
bundled_recommendations: []
followon_recs: [rec-5048, rec-5049]
infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition: compute_affected_artifacts(<this
    plan's scope>) returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']} because the roadmap is a packaged asset
    of the active data-pipeline artifact. No build, deploy or smoke test is owed: the roadmap change is one T4.32 data
    row, and no packaged code changes (the packaged scripts do not include platform_roadmap_models or
    platform_roadmap_state). deploy-prod-lambdas.yml does not path-trigger on the roadmap, so the asset refreshes at the
    next deploy a watched path starts. Its one runtime reader, src/data/handlers/scheduled_agent_handler.py, reads the
    file as raw text and runs only from the scheduled-agent dispatcher, whose EventBridge rule is provisioned DISABLED
    with SCHEDULED_AGENTS_ENABLED "false" (terraform/personal/prod_lambdas.tf), so a stale packaged copy reaches no
    running agent. No other scope file is Lambda-packaged and no .tf file is in scope (precedent:
    PLAN-verdict-persona-roadmap-regrounding).
acceptance_criteria:
  - A not_started tier_item whose depends_on entry is in_progress and named by a start edge is in eligible_items() and not in compute_blocked(); without the edge, or while the dependency is not_started, it is blocked.
  - RoadmapDocument refuses a start edge on a tier shortcut, outside depends_on, duplicated, or with any `once` other than in_progress, and refuses an item carrying start edges at complete while a dependency is unfinished.
  - The live roadmap loads and T4.32 carries start_edges [{ref T4.10a, once in_progress}]; on an in-memory copy with T4.32 not_started, T4.32 is blocked while T4.10a is not_started and eligible once T4.10a is in_progress, whatever the live statuses are.
  - next_eligible and blocked rows in the preflight state dict carry a start_edges list.
  - The existing roadmap state, model, preflight and persona-criteria suites pass unchanged except the added assertions.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Start-edge model, eligibility, projection and live T4.32 tests
    command: bin/venv-python -m pytest tests/platform_roadmap_state/test_start_edges.py -q
    expected: All pass; every test fails on main (no StartEdge, no start_edges key, T4.32 carries no edge).
    fix_if: Fix the model or state code; never weaken an assertion.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Unit tests under tests/ run in every tier through the fast-tier pytest selection, so the file guards the
      behaviour once it lands; a graduated shard would duplicate it.
  - step: 2
    phase: pre-deploy
    action: The prose annotation and the typed field stay tied, and the persona pins stay green
    command: bin/venv-python -m pytest tests/roadmap/test_verdict_persona_criteria.py -q
    expected: All pass; the extended spend test fails on main (T4.32 has a START sentence and no start edge).
    fix_if: Fix the roadmap row, never the pin.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: The file already runs in every tier; the added assertion is guarded with it.
  - step: 3
    phase: pre-deploy
    action: Existing roadmap state, model and preflight suites keep passing
    command: >-
      bin/venv-python -m pytest tests/platform_roadmap_state tests/platform_roadmap_models
      tests/test_session_preflight_platform_roadmap.py -q
    expected: All pass.
    fix_if: A regression in eligibility or the item projection; fix the code, never an assertion.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Existing suites that run in every tier.
  - step: 4
    phase: pre-deploy
    action: The live roadmap validates and the schema check passes
    command: bin/venv-python -m scripts.roadmap.platform_roadmap docs/ROADMAP-PLATFORM.yaml
    expected: Prints PASS for the live roadmap.
    fix_if: Fix the T4.32 row shape or the validator step.
    hermetic: true
    expected_literals: ["PASS"]
    graduation: waive
    graduation_waiver_reason: validate_platform_roadmap loads the same schema in both presubmit tiers.
  - step: 5
    phase: pre-deploy
    action: Full validation before handoff, attested for the pushed HEAD (backgrounded, 2 h limit, top-level session)
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Exit 0; --verify-head attests HEAD.
    expected_literals: []
    fix_if: >-
      A failure in scope is fixed on the branch and the run restarts from the start; never skip a test, relax an
      assertion or add a baseline. A failure outside scope becomes a rec via scripts.ops_data_portal (Decisions 55, 59).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
test_obligations:
  - source: scripts/platform_roadmap_models.py
    behavior: StartEdge shape and the start-edge validation step, including the scoped completion guard.
    verification_step: 1
    test_selector: tests/platform_roadmap_state/test_start_edges.py
    red_green_expectation: red before (StartEdge absent, no rejection), green after.
  - source: scripts/platform_roadmap_state.py
    behavior: A start edge relaxes eligibility to in_progress for its ref only; _item_dict carries start_edges.
    verification_step: 1
    test_selector: tests/platform_roadmap_state/test_start_edges.py
    red_green_expectation: red before (an in_progress dependency blocks), green after.
  - source: scripts/roadmap/platform_roadmap.py
    behavior: The facade exports StartEdge.
    verification_step: 1
    test_selector: tests/platform_roadmap_state/test_start_edges.py
    red_green_expectation: red before (import error), green after.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: T4.32 carries the start edge its approved START sentence describes.
    verification_step: 2
    test_selector: tests/roadmap/test_verdict_persona_criteria.py::test_t4_32_records_spend_ceiling
    red_green_expectation: red before (START sentence with no start edge), green after.
weakening_dispositions: []
constraints:
  - Completion semantics never change -- depends_on, tier_complete, the gate evaluator and platform_roadmap_liveness keep demanding complete.
  - T4.32's intent text and every other roadmap item stay byte-identical; only the start_edges block is added.
  - The planning skill, the orient skill and the roadmap agent_instructions are not edited here; PLAN-planning-eligibility-start-edges owns that approved wording.
  - No eval/exec, no import-time raise; ruff, line length 127; files stay under their SLOC budgets (Decision 128).
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout round 1 FLAGS_FOUND (two NOTEs, no contradiction). CITE: Decision 229, Decision 246, Decision 86. Decisions triaged: 202 of 202. Roadmap items intersected: 4; CONFLICT: 0; RELATED: 4. Serves: NS.4 3/5."
  - "red_overlap at 654b7797: verdict clear, no reds."
  - "Sign-off: Benjamin said 'please write the plans' on 2026-11-09 after the presentation (/mnt/project-files/rec-5037-plan/PRESENTATION.md)."
  - "Why typed (blind consult, design): every other roadmap edge is typed (CriterionBlocker, decision_required_before); rec-5037's critique note named a typed start edge; PLAN-verdict-persona-roadmap-regrounding's split consult (its Q8) chose a sentence for that plan and left the reconciliation to this rec."
  - "Two plans (settled on a blind consult): plan_wording_check places only sidecar words on main and runs --pre, and approved text binds whole files, so the T4.32 row cannot be approved text until this code is on main. This plan carries no governing wording; the T4.32 row encodes the START sentence already approved on GitHub for PLAN-verdict-persona-roadmap-regrounding."
  - "Field is authoritative; T4.32's START sentence is approved-text provenance, tied to the field by VP 2 while T4.32 is live; completion_compaction drops the sentence but keeps start_edges, which is harmless because the completion guard then holds (scout NS.4 note)."
  - "Window: after this build and before PLAN-planning-eligibility-start-edges builds, next_eligible honours start edges while the skills still describe the completion rule; harmless because T4.10a stays not_started until the verdict-slice build merges."
  - "Decision 241 cl.1 (scout RELATED): the post-MVP coordination engine that owns the ready frontier must read start_edges. Follow-ons: rec-5048 (report-only completion-order check over all items; 11 existing cases), rec-5049 (scout Decision 197 note: start qualifier in the work-item edge vocabulary, PLAN-work-graph-edge-model's contract)."
  - "fork: how eligibility learns a START order | chosen: a typed start_edges field that eligible_items() reads, never sentence parsing | class: consistency-only | precedent: Decision 86 | precedent_kind: decision | reversible: yes | persisted: scripts/platform_roadmap_models.py"
  - "fork: one plan or two for rec-5037 | chosen: two atomic plans, this code plan first | class: consistency-only | precedent: Decision 247 | precedent_kind: decision | reversible: yes | persisted: docs/plans/PLAN-roadmap-start-edges.yaml"
  - "fork: scope of the completion-order guard | chosen: items carrying start_edges only, the global report deferred to rec-5048 | class: consistency-only | precedent: docs/contracts/implement-scope-boundary.yaml | precedent_kind: contract | reversible: yes | persisted: scripts/platform_roadmap_models.py"
  - "fork: whether T4.32's start edge needs its own approval run | chosen: no, it rides in this plan (A) | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: docs/ROADMAP-PLATFORM.yaml"
  - "Sizes at 654b7797: platform_roadmap_state.py 356 SLOC, platform_roadmap_models.py 278 SLOC (of 500); roadmap 8,821 of 10,000 lines (Decision 114). plan_obligations' roadmap NEAR_CAP row reads the class's 500-line default; the file defers to validate_platform_roadmap's 10,000-line ceiling."
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
  - {gate: plan-critique, round: 1, verdict: REVISE, blocking: 3, nits: 6}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - Add StartEdge, TierItem.start_edges and the validation step to scripts/platform_roadmap_models.py; re-export from scripts/roadmap/platform_roadmap.py.
  - Add _start_satisfied and use it in eligible_items, compute_blocked and _blocked_on; add start_edges to _item_dict.
  - Add the T4.32 start_edges block to docs/ROADMAP-PLATFORM.yaml.
  - Write tests/platform_roadmap_state/test_start_edges.py and extend tests/roadmap/test_verdict_persona_criteria.py.
  - Run VP steps 1-4 until green; on an unrecoverable failure stop and RCA (Decision 55).
  - Code review via a fresh code-review subagent; fix blocking findings and rerun VP steps 1-4.
  - >-
    Commit (flip implementation_declared to true), rebase on origin/main, run VP step 5 on the committed clean HEAD,
    push, open the build PR, and merge on code review PROCEED and green CI (standing authorisation; no approved text).
  - >-
    Report, as separate facts: what was implemented; the full-tier exit plus validation_result --verify-head for the
    pushed HEAD; structured postflight evidence (scripts.session.postflight --evidence); the push, PR number, CI result
    and merge SHA.
rollback: Revert the PR; eligibility returns to complete-only and T4.32 loses its start edge. No data or infrastructure changes.
