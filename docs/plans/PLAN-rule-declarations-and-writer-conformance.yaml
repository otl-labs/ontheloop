# --- the shared reader, projections and engine -----------------------------------------------------------------
- file: scripts/contract_rules.py
  action: Modify
  purpose: >-
    Read not_null by presence: `true`, or a mapping, declares the rule (a mapping's exclude_before carries over);
    absence declares nothing. The legacy spelling stays readable so a merge-base snapshot parses: `{enforced: true}`
    is a rule, `{enforced: false}` is none. layer_rules reads presence on both sides before merging (a local block may
    add not_null, never drop it) and returns the presence form: no not_null key when neither side declares one, `True`
    when declared with no sub-keys, else a mapping of the kept sub-keys (exclude_before, note) with no `enforced` --
    so source-lineage's leg-less baseline under ops_recommendations' local `{exclude_before: D}` yields
    `{exclude_before: D}`, a rule (today's OR would yield `{exclude_before: D, enforced: False}`, which the presence
    reader must never see).
    `note` joins _LEG_META_KEYS (a documentation sub-key on telemetry accepted_values legs), so it never becomes a rule
    parameter. A `not_null: true` leg normalises to empty params. Any other non-mapping not_null (a literal `false`
    included: an optional column has no leg) fails with a ValueError naming table, column and kind (rec-4168
    behaviour kept). Docstrings drop "plan C owns the re-read".
- file: scripts/field_semantics_event_projection.py
  action: Modify
  purpose: >-
    _is_not_null reads presence (the legacy false still means no rule). A row-local rule key that the same intent
    exempts under write_time_exemptions is not projected as a rule (the exemption ships, the rule does not), so a
    staged or marked rule is never both enforced and exempt. The generated field_semantics.yaml is byte-identical for
    every leg this plan re-spells (measured on a prototype of the full re-spelling).
- file: scripts/field_semantics_rule_projection.py
  action: Modify
  purpose: >-
    Docstring: the enforced flag no longer exists; an exempt leg ships only as write_time_exemptions (unchanged
    behaviour). Gains the two sidecar guards the generator calls (kept here, not in schema_to_field_semantics.py,
    whose mapped test file is at 499 of 500 SLOC): validate_sidecar_rules(entries) runs RowRules.from_projection over
    each spliced dormant and smoke block, so a malformed sidecar rule fails the generator, not a Lambda; and
    refuse_contract_overlap(table_ids, contracts_dir) fails when docs/contracts/<id>.yaml exists for a dormant or
    smoke id, so a table can never have two rule sources (the hand-over to a contract moves the id between the
    generator's tuples and deletes the sidecar block in one change).
- file: scripts/contracts.py
  action: Modify
  purpose: >-
    _override_loosens reads presence: a referenced not_null (true, a mapping, or the legacy enforced true) cannot be
