# --- the declaration guard (decomposed, widened) ------------------------------------------------------------------
- file: scripts/checks/contracts/validate_ops_rule_source.py
  action: Modify
  purpose: >-
    Stays the registered entry point (name, module and attr unchanged, Decision 187 point 5) and becomes orchestration
    only, below 200 SLOC (Decision 128 decompose-by-default; it is 390 SLOC today). Scope widens from ops_recommendations
    and ops_decisions to every contract-backed writer table: each ops_tables key of config/lambda/ducklake/field_semantics.yaml
    that has docs/contracts/<table>.yaml (nine today), taken over base and head together so a PR removing a table and
    its contract cannot escape the ratchet, and the raw $ref baselines those contracts reach; the enforced ban alone
    scans every contract under docs/contracts/. Docstring: the transitional part was the ops.yaml parity leg, which the portal row-rule gate plan
    retires; the declaration guard stays, and writer coverage is the conformance check's.
- file: scripts/checks/contracts/_rule_grammar.py
  action: Create
  purpose: >-
    The declaration grammar, per table_class: SCD2 tables use the ops vocabulary (not_null, accepted_values,
    min_length, pattern, array_element_format, array_element_reference, acceptance_lint, not_before,
    write_time_exemptions); event tables the event projection's known keys; control tables not_null only. `enforced`
    is rejected on every leg of every contract under docs/contracts/ (a key scan, so a new contract cannot bring it
    back). not_null is `true` or `{exclude_before: ISO}`; a nullable false column must carry `not_null: true` (never
    dated -- the projection and engine refuse a dated not_null there -- never absent), the successor of today's
    "nullable false field" check, so a new SCD2 field on an existing contract is nullable with a dated not_null.
    Sub-key whitelists per ops kind without enforced; `note` allowed on accepted_values. ISO real dates, and the
    Decision 64 floor 2026-05-01 on ops_recommendations. RE2-and-Python regex subset for pattern,
    array_element_format and pattern_when patterns. Producer-side kinds need an exemption. Exemptions: class in
    {cross_row, repository_state, temporary}, a reason, an owner (a rec id for cross_row and temporary, an existing
    repository path for repository_state), review_by (an ISO date) required on temporary and refused elsewhere, and
    the exempted kind must be declared on the field -- a content-leg exemption (inline_within_threshold,
    uri_above_threshold, within_cap, integrity) counts as declared on the field that carries
    content_inline_threshold_bytes. The exemptable kinds are read from the engine, never listed: src.row_rules.rules
    exposes its waivable column kinds as a public frozenset beside EXEMPTABLE_LEGS and PRODUCER_SIDE_KINDS, and an
    exemption on any other kind (exactly_one_of, representation_of, content_inline_threshold_bytes) fails here rather
    than at generation. The class is bound to the exempted kind, so no row-local rule can be parked
    without a date: a producer-side kind takes its own class from a grammar table keyed by
    src.row_rules.rules.PRODUCER_SIDE_KINDS (array_element_reference -> cross_row, an existence lookup outside the
    row; acceptance_lint -> repository_state, a rule no write can decide) or, as the mark-then-drop transition before
    the leg is removed, class temporary with review_by and a rec owner; the other permanent class is refused; the test
    asserts that table's keys equal PRODUCER_SIDE_KINDS so a new producer-side kind fails until classified; every other
    exempted kind (each row-local kind, not_null, and each content leg in EXEMPTABLE_LEGS) must be class temporary with
    review_by. The
    three exemptions on the tree today satisfy it (acceptance_lint repository_state, dependencies'
    array_element_reference cross_row, and the transcripts content leg, which this plan makes temporary). `not_null: false` (or any non-bool, non-mapping value) is rejected: an optional
    column has no not_null leg. Moved from validate_ops_rule_source.py, then widened.
- file: scripts/checks/contracts/_rule_ratchet.py
  action: Create
  purpose: >-
    The merge-base ratchet over every in-scope table, reading a base snapshot of every in-scope contract, every $ref
    target it reaches and the source registry with the shared reader (both spellings). Fails on: (a) a leg removed
    unless it carried a class temporary exemption at the base (mark-then-drop: exempt in one PR, delete in a later
    one); a standing cross_row or repository_state exemption is not a mark, so removing acceptance_lint or
    array_element_reference first re-classes it to temporary (the grammar admits temporary on a producer-side kind for
    exactly this; the re-class is arm (d)'s class change with its semantic-break entry), as today's ratchet refuses
    every removal; (b) a value removed from an accepted_values leg unless that field's
    amendment_log gained, since the base, an entry with change_class accepted_values_narrow, semantic_break true and a
    migration_story naming every removed value (the census statement lives there; AmendmentLogEntry is extra=forbid),
    and likewise any other narrowing of a surviving leg -- any change to its params other than adding accepted values
    (min_length, pattern, array_element_format, pattern_when, required_when, null_or_zero_when, at_most,
    max_after_write_seconds, a content threshold or cap; a pattern's direction is undecidable, so any change counts)
    or its exclude_before moved earlier -- needs a field entry since the base with semantic_break true whose
    migration_story carries the census as the token `census: 0 violators (<ISO date>)` -- only a zero census passes,
    since a narrowing that strands a stored row waits for the data to be fixed at the source (Decision 70) (any
    change_class; the vocabulary has no params-specific member; the value-removal entry carries the same token); `note` and other meta
    keys are not params. The git snapshot seam (merge-base, git show) stays in the entry module, whose mirror test has
    _git_root cases; _rule_ratchet compares snapshots handed to it, so its own mirror test is git-free and covers it;
    (c) an exclude_before added to a leg that had none, moved later, or removed from a leg that stays -- unconditionally
    (Decision 64's 2026-10-04 update: "no date moves later or is removed once declared"; today's ratchet guards only the
    first two, and removing a date makes the rule bind every older row on update, the Decision 70 stranding shape), so a
    narrowing whose census is not zero waits for the data to be fixed at the source, and a date leaves only with its leg
    through arm (a);
    (d) an exemption added to a rule that existed un-exempted at the base, or an existing exemption's class changed
    from one class to another (adding a class to a class-less exemption is a grammar completion, not a loosening),
    unless the field gained an entry with semantic_break true. Arm (d) reads write_time_exemptions straight from the
    base and head intents (scripts.contract_rules.read_intents), keyed by (table, column, exemption key), never
    through DeclaredRule.exemption, which carries only exemptions named after a dq_intent key: the content legs
    inline_within_threshold, uri_above_threshold, within_cap and integrity are exempted by their own keys and would
    otherwise be invisible. A content-leg rule counts as existing at the base when the column carried
    content_inline_threshold_bytes there. A temporary exemption's review_by moved later (a renewal) also needs a field
    entry since the base (governance_note_add) naming the new date and why; a review_by added where the base exemption
    had none is never a renewal (the base was class-less, so the pair is a grammar completion -- this plan's own
    transcripts change). Removing a temporary exemption from an undated rule that stays on an SCD2 table re-arms it
    against every older row on update, so it needs the same semantic-break entry with the zero census token as arm
    (b). (e) a source registry id removed (moved,
    unchanged). (f) a leg added on an SCD2 table (one whose rows are updated: no table_class event, not a control
    table) without an exclude_before -- a rule introduced later carries its own effective date (Decision 64's
    2026-10-04 update), so it binds older rows only on columns a write changes; event tables never update a row and
    add legs freely. A contract absent at the base contributes no base legs, so a new contract's founding legs are free
    (the T4.3 and T4.5 hand-overs: a table with no contract had no rule to strand; rows a dormant table already holds
    are that plan's census).
    Free: accepted values added, a dated new SCD2 leg, any new event-table leg, a new contract's founding legs. The dormancy arm keys on the entry module validate_ops_rule_source.py being absent at the
    base, which it never is after plan A, so the widened ratchet is live on this plan's own PR. Reason: scripts/contracts_enforcement.py
    check_amendment_for_diff compares only description and semantics, so a rule-only diff was unguarded.
