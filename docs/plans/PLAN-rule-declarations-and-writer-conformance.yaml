- step: 1
  phase: pre-deploy
  action: rec-4158's acceptance node -- the conformance check on the real tree finds every declared write-decidable rule enforced.
  command: bin/venv-python -m pytest "tests/checks/contracts/test_write_time_enforcement_conformance.py::test_every_write_decidable_rule_has_a_writer_validator" -q
  expected: Exit 0, one passed.
  fix_if: >-
    A table matching no arm, or a declared rule missing from the projection -> fix the declaration or the projection,
    never the check; an undeclared projected rule is a second rule source (Decision 210 cl.3) -- remove it at the source.
  hermetic: true
  graduation: graduate
  graduation_check_id: write-time-conformance-every-rule-has-a-validator
- step: 2
  phase: pre-deploy
  action: Every failure arm of the conformance check fails closed on a fixture registry.
  command: bin/venv-python -m pytest "tests/checks/contracts/test_validate_write_time_enforcement_conformance.py::test_each_arm_fails_closed" -q
  expected: Exit 0; every parametrized arm passes.
  fix_if: An arm that passes on its fixture is a silent skip -- fix the check (Decision 55).
  hermetic: true
  graduation: graduate
  graduation_check_id: write-time-conformance-arms-fail-closed
- step: 3
  phase: pre-deploy
  action: Each writer adapter rejects a record breaking each rule kind its table declares (kinds derived from RowRules).
  command: bin/venv-python -m pytest "tests/checks/contracts/test_write_time_enforcement_conformance.py::test_each_writer_adapter_rejects_every_declared_kind" -q
  expected: Exit 0; every parametrized adapter and kind passes.
  fix_if: A kind an adapter does not reject -> the adapter skips the engine for that table; fix the adapter wiring, never drop the kind.
  hermetic: true
  graduation: graduate
  graduation_check_id: writer-adapters-reject-every-declared-kind
- step: 4
  phase: pre-deploy
  action: The grammar rejects the enforced key on every leg and baseline and accepts only the two not_null spellings.
  command: bin/venv-python -m pytest "tests/checks/contracts/test__rule_grammar.py::test_enforced_key_is_rejected_on_every_leg_and_baseline" -q
  expected: Exit 0.
  fix_if: A leg kind or baseline the ban misses -> widen the scan; never allowlist a contract.
  hermetic: true
  graduation: graduate
  graduation_check_id: rule-grammar-bans-enforced
- step: 5
  phase: pre-deploy
  action: The ratchet fails each loosening or narrowing move without its marker and passes it with the marker.
  command: bin/venv-python -m pytest "tests/checks/contracts/test__rule_ratchet.py::test_loosening_and_narrowing_need_their_marker" -q
  expected: >-
    Exit 0; every parametrized arm (value removal and every other params narrowing or earlier date, an undated new
    SCD2 leg, new or re-classed exemption including a content leg, a later review_by, leg removal, registry removal,
    and the unconditional added, later or removed date) passes.
  fix_if: An arm that passes without its marker -> fix the ratchet; tightenings must stay free.
  hermetic: true
  graduation: graduate
  graduation_check_id: rule-ratchet-loosening-and-narrowing
- step: 6
  phase: pre-deploy
  action: The engine records a row-local exemption and does not enforce it; an exempt rule that also ships raises.
  command: bin/venv-python -m pytest "tests/row_rules/test_rules.py::test_row_local_exemption_is_recorded_and_unenforced" -q
  expected: Exit 0.
  fix_if: An exempt rule enforced, or a shipped exempt rule accepted -> fix from_projection.
  hermetic: true
  graduation: graduate
  graduation_check_id: row-rules-record-row-local-exemption
- step: 7
  phase: pre-deploy
  action: The event projection reads not_null by presence and never projects an exempt rule.
  command: bin/venv-python -m pytest "tests/test_field_semantics_event_projection.py::test_not_null_by_presence_and_exempt_rule_not_projected" -q
  expected: Exit 0.
  fix_if: Fix _is_not_null or _column_rules.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Presence reading is guarded on every table by step 1's not_null comparison. No real contract carries a row-local
    exemption today; once one does, step 1's real-tree run builds RowRules.from_projection, which raises on an exempt
    rule that also ships (step 6), so the omission is guarded where it can matter.
- step: 8
  phase: pre-deploy
  action: The shared reader reads the new and the legacy not_null spellings alike, so merge-base snapshots parse.
  command: bin/venv-python -m pytest "tests/test_contract_rules.py::test_not_null_presence_and_legacy_spelling_read_alike" -q
  expected: Exit 0.
  fix_if: Fix _not_null_leg or layer_rules; the ratchet depends on the legacy read.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Step 5's ratchet node reads legacy-spelled base fixtures through the same reader, so the standing guard already
    covers this path; a separate row would duplicate it.
- step: 9
  phase: pre-deploy
  action: The writer refuses generic writes to a dormant table and still provisions it.
  command: bin/venv-python -m pytest "tests/lambdas/ducklake_writer/handler/test_ops_actions.py::test_dormant_tables_refuse_generic_writes_but_provision" -q
  expected: Exit 0.
  fix_if: Fix the handler; create_ops_tables must not refuse (catalog reinit and restore).
  hermetic: true
  graduation: graduate
  graduation_check_id: writer-refuses-dormant-tables
- step: 10
  phase: pre-deploy
  action: The generator refuses a sidecar table that also has a contract, and validates spliced sidecar rules.
  command: >-
    bin/venv-python -m pytest "tests/test_field_semantics_rule_projection.py::test_sidecar_table_with_a_contract_fails_the_generator"
    "tests/test_field_semantics_rule_projection.py::test_malformed_sidecar_rule_fails_the_generator" -q
  expected: Exit 0.
  fix_if: Fix the generator guards.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Both halves have standing guards in the conformance check: its sidecar-table-with-a-contract arm (steps 1 and 2)
    for the overlap, and its contract-less-entry-carries-a-rule-key arm (steps 1 and 2) for a malformed spliced
    sidecar rule; the generator guards are their early, build-time twins.
- step: 11
  phase: pre-deploy
  action: A past review_by on a temporary exemption fails the full-tier check, naming the owner.
  command: bin/venv-python -m pytest "tests/checks/contracts/test_validate_temporary_exemption_review.py::test_past_review_by_fails" -q
  expected: Exit 0.
  fix_if: Fix the check; it must not run in --pre.
  hermetic: true
  graduation: graduate
  graduation_check_id: temporary-exemption-review-date
- step: 12
  phase: pre-deploy
  action: >-
    The deploy gate's six dormant cases pass only on a 400 naming dormant, and fail on a 422 schema_gate, a 500
    runtime, a 409 referential, a 200 or a 400 that does not name dormant.
  command: bin/venv-python -m pytest "tests/ducklake_neon_smoke_test/test_lambda_ops_gates.py::test_dormant_refusal_cases_answer_400" -q
  expected: Exit 0; every parametrized answer passes.
  fix_if: An answer the gate accepts other than a 400 naming dormant -> fix the gate's discrimination, never the test.
  hermetic: true
  graduation: graduate
  graduation_check_id: row-rules-gate-refuses-dormant-tables
- step: 13
  phase: pre-deploy
  action: >-
    The re-spelling changes no rule: for every in-scope table and the two file-backed contracts, declared_rules at
    HEAD equals declared_rules read from
    origin/main's contracts (both spellings through the HEAD reader). Content-leg exemptions are not DeclaredRules;
    step 14 compares them in the projection.
  command: >-
    bin/venv-python -c "import subprocess,tempfile,pathlib,yaml;from scripts import contract_rules as c;
    root=pathlib.Path('.');fs=yaml.safe_load(open('config/lambda/ducklake/field_semantics.yaml'))['ops_tables'];
    ts=[t for t in fs if (root/'docs/contracts'/f'{t}.yaml').is_file()]+['exit-criteria-ledger','verification-registry'];d=pathlib.Path(tempfile.mkdtemp());
    [(d/'docs/contracts'/p.name).parent.mkdir(parents=True,exist_ok=True) or (d/'docs/contracts'/p.name).write_text(subprocess.run(['git','show','origin/main:docs/contracts/'+p.name],capture_output=True,text=True).stdout) for p in (root/'docs/contracts').glob('*.yaml')];
    (d/'config/agent/data_quality').mkdir(parents=True);(d/'config/agent/data_quality/source_registry.yaml').write_text(open('config/agent/data_quality/source_registry.yaml').read());
    k=lambda t,r:(r.column,r.kind,tuple(sorted((x,str(v)) for x,v in r.params.items() if x!='note')),r.exclude_before,tuple(sorted((x,str(v)) for x,v in (r.exemption or {}).items())));
    bad=[t for t in ts if sorted(k(t,r) for r in c.declared_rules(t))!=sorted(k(t,r) for r in c.declared_rules(t,contracts_dir=d/'docs/contracts',repo_root=d))];
    print('RULESETS_EQUAL' if not bad else bad);assert not bad,bad"
  expected: Exit 0 and RULESETS_EQUAL printed (git fetch origin main first).
  expected_literals:
  - RULESETS_EQUAL
  fix_if: >-
    A table listed -> the re-spelling changed a rule (a dropped exclude_before, a deleted leg that was enforced, a lost
    value): restore it; this plan adds, removes and re-dates no rule.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    PR-relative against origin/main: after merge the base collapses onto HEAD and the step proves nothing; the
    standing guards are steps 1 and 5.
- step: 14
  phase: pre-deploy
  action: >-
    The generated projection is current, and it differs from origin/main's only by the two dormant write_boundary keys
    and the transcripts exemption's class and review_by.
  command: >-
    bin/venv-python -m scripts.schema_to_field_semantics --check && bin/venv-python -c "import subprocess,yaml,copy;
    h=yaml.safe_load(open('config/lambda/ducklake/field_semantics.yaml'));
    b=yaml.safe_load(subprocess.run(['git','show','origin/main:config/lambda/ducklake/field_semantics.yaml'],capture_output=True,text=True).stdout);
    o=copy.deepcopy(h)['ops_tables'];[o[t].pop('write_boundary') for t in ('ops_priority_queue','ops_execution_plans')];
    e=o['telemetry_transcripts']['columns']['content'].get('write_time_exemptions',{}).get('inline_within_threshold',{});e.pop('class',None);e.pop('review_by',None);
    h['ops_tables']=o;ok=h==b;print('PROJECTION_DELTA_CONFINED' if ok else 'PROJECTION_DELTA_WIDER');assert ok"
  expected: Exit 0, an OK drift line, then PROJECTION_DELTA_CONFINED (git fetch origin main first).
  expected_literals:
  - PROJECTION_DELTA_CONFINED
  fix_if: >-
    Drift -> regenerate, never hand-edit. A wider delta -> a re-spelled leg changed the projection: restore it (the
    prototype measured zero change for the re-spelling). If the blob-route plan has merged first, the exemption is
    gone on both sides and the command still compares the rest; say so in the PR.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: PR-relative against origin/main; the drift gate and step 1 are the standing guards.
- step: 15
  phase: pre-deploy
  action: Live census through the DQ harness -- the re-spelled declarations still compile to the same rules and hold on the warehouse.
  command: bin/venv-python -m scripts.contract_rule_census
  expected: Exit 0; every compiled rule prints 0 violators with PASS; the two producer-side rules print as exempt.
  fix_if: >-
    A violator -> STOP, do not merge, return to /plan (this plan changes no rule, so a violator means the reader changed
    one). Exit 2 -> the reader is unavailable: wait or fix, never treat it as clean.
  hermetic: false
  graduation: not-applicable
- step: 16
  phase: pre-deploy
  action: >-
    The re-pinned, moved and new suites pass whole: the rule-source, bindings, conformance, contracts, contract-rules,
    projection, telemetry-contract and records tests.
  command: >-
    bin/venv-python -m pytest tests/checks/contracts/test_validate_ops_rule_source.py
    tests/checks/contracts/test__ops_rule_bindings.py tests/checks/contracts/test_validate_write_time_enforcement_conformance.py
    tests/checks/contracts/test_write_time_enforcement_conformance.py tests/checks/contracts/test_write_time_enforcement_decision.py
    tests/checks/contracts/test_telemetry_event_journal_contracts.py tests/checks/contracts/test_telemetry_dimension_contracts.py
    tests/telemetry/test_contract_amendments.py
    tests/telemetry/test_contract_lifecycle_friction.py tests/checks/contracts/test_ops_rule_source_records.py
    tests/test_contracts.py tests/test_contract_rules.py tests/test_field_semantics_event_projection.py
    tests/test_field_semantics_rule_projection.py tests/row_rules/test_rules.py
    tests/lambdas/ducklake_writer/handler/test_ops_actions.py tests/ducklake_neon_smoke_test/test_lambda_ops_gates.py
    tests/checks/contracts/test__rule_grammar.py tests/checks/contracts/test__rule_ratchet.py
    tests/checks/contracts/test_validate_temporary_exemption_review.py -q
  expected: Exit 0.
  fix_if: A failure -> fix the code or re-pin the test to the new spelling; never weaken an assertion (Decision 181 cl.1).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Whole-file re-run of files this plan scopes; the --pre pytest_diff phase already runs them on every PR, and the
    graduated node-level steps carry the standing guards.
- step: 17
  phase: pre-deploy
  action: >-
    Assert the ground for NO data-pipeline redeploy despite touching its packaged roadmap asset (Decision 198
    precedent): its schedules stay disabled and the prod-lambdas workflow is not path-triggered by the roadmap.
  command: >-
    grep -q 'the schedule stays disabled' src/lambdas/data-pipeline/manifest.yaml && ! grep -q 'ROADMAP-PLATFORM'
    .github/workflows/deploy-prod-lambdas.yml && echo INERT_OK
  expected: Exit 0 and INERT_OK printed.
  fix_if: >-
    Schedules re-enabled -> the asset change needs the governed deploy-prod-lambdas workflow, never a local
    build_lambda --deploy; the workflow path-triggering on the roadmap -> rec-3990 landed, retire this step.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Green on the un-implemented tree too, a per-PR transient; its durable form is rec-3990.
- step: 18
  phase: pre-deploy
  action: Full validation tier before handoff (includes validate_pre_glob_closure, contract drift, the structural budgets and the decisions size cap).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: Fix the named check; never raise a budget, skip a check or drop a pre_glob.
  hermetic: false
  graduation: not-applicable
- step: 19
  phase: post-deploy
  action: All six DuckLake deploy records name the commit that last touched the deploy paths (the governed workflow shipped this change).
  command: >-
    bin/venv-python -c "import json,subprocess,boto3;s=boto3.Session(profile_name='agent_platform').client('s3');
    h=subprocess.check_output(['git','log','-1','--format=%H','origin/main','--',':(glob)src/lambdas/ducklake_*/**',':(glob)src/common/ducklake_*.py','config/lambda/ducklake','src/row_rules','src/telemetry']).decode().strip();
    f=['writer','reader','telemetry-writer','catalog-dr','maintenance','maintenance-smoke'];
    bad=[x for x in f if json.loads(s.get_object(Bucket='agent-platform-data-lake',Key=f'deploy-records/ducklake/agent-platform-ducklake-{x}.json')['Body'].read()).get('source_git_sha')!=h];
    print('DEPLOY_RECORDS_FRESH' if not bad else bad);assert not bad"
  expected: Exit 0 and DEPLOY_RECORDS_FRESH printed (git fetch origin main first).
  fix_if: >-
    A stale record -> the workflow failed or skipped a function: read its run, RCA, re-dispatch the governed workflow;
    never a local build_lambda --deploy without the operator's direction (Decision 126). A later DuckLake merge ->
    compare against that sha.
  hermetic: false
- step: 20
  phase: post-deploy
  action: The deployed writer refuses the dormant tables and still enforces every row-rule class (the gate the workflow's smoke job ran).
  command: >-
    DUCKLAKE_WRITER_URL="$(aws ssm get-parameter --name /agent-platform/ducklake/writer_url --query Parameter.Value
    --output text --profile agent_platform --region eu-west-2)" DUCKLAKE_READER_URL="$(aws ssm get-parameter --name
    /agent-platform/ducklake/reader_url --query Parameter.Value --output text --profile agent_platform --region
    eu-west-2)" bin/venv-python -m scripts.ducklake_neon_smoke_test --lambda-row-rules --profile agent_platform
  expected: Exit 0 and LAMBDA_ROW_RULES OK printed, with the six dormant cases refused.
  fix_if: >-
    A 200 on a dormant case -> STOP, revert the merge (the workflow redeploys the prior code) and RCA (Decision 55);
    a row-rule case regression -> the same.
  hermetic: false
- step: 21
  phase: post-deploy
  action: >-
    The governed deploy run for the merge commit concluded success, so every smoke gate it runs passed, including
    --lambda-telemetry (the telemetry writer is invoked only by the CI role, never by the agent profile).
  command: >-
    bin/venv-python -c "import json,subprocess,urllib.request;
    h=subprocess.check_output(['git','log','-1','--format=%H','origin/main']).decode().strip();
    u='https://api.github.com/repos/benjamin-blake/theseus/actions/workflows/deploy-ducklake-lambdas.yml/runs?head_sha='+h;
    r=[x['conclusion'] for x in json.load(urllib.request.urlopen(u,timeout=30))['workflow_runs']];
    print('DEPLOY_RUN', r);assert r and r[0]=='success'"
  expected: Exit 0 and DEPLOY_RUN ['success'] printed (git fetch origin main first; run it on the merge commit).
  fix_if: >-
    failure -> read the run's failing job; a smoke failure means STOP, revert the merge and RCA (Decision 55); never
    re-run it into green. An empty list -> the workflow has not run for this commit yet, or a later merge superseded it.
  hermetic: false
- step: 22
  phase: post-deploy
  action: The positive path on production -- a rule-clean write, update and supersede on ops_recommendations.
  command: >-
    DUCKLAKE_WRITER_URL="$(aws ssm get-parameter --name /agent-platform/ducklake/writer_url --query Parameter.Value
    --output text --profile agent_platform --region eu-west-2)" DUCKLAKE_READER_URL="$(aws ssm get-parameter --name
    /agent-platform/ducklake/reader_url --query Parameter.Value --output text --profile agent_platform --region
    eu-west-2)" bin/venv-python -m scripts.ducklake_neon_smoke_test --ops-read-your-write --profile agent_platform
  expected: Exit 0 and OPS_RYW OK printed.
  fix_if: A row_rule 422 on the clean probe -> STOP, revert, RCA.
  hermetic: false
- step: 23
  phase: post-deploy
  action: Bookkeeping landed -- rec-4158 carries this plan's dated note and stays open for the portal row-rule gate plan.
  command: >-
    bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;b=f('rec-4158') or {};
    ok=b.get('status')=='open' and 'RULE DECLARATIONS AND WRITER CONFORMANCE DELIVERED' in (b.get('context') or '') and 'test_portal_gate_is_the_writer_gate' in (b.get('acceptance') or '');
    print('open', ok);assert ok"
  expected: Exit 0 and "open True" printed.
  fix_if: The note missing -> re-run the bookkeeping execution step through update_rec (get_rec_write_guidance first).
  hermetic: false
