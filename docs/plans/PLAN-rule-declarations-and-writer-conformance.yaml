- file: scripts/checks/contracts/validate_write_time_enforcement_conformance.py
  action: Create
  purpose: >-
    The all-writer conformance check (Decision 163 structural enforcement of Decision 210's coverage residual), owner
    platform, Decision 170 accounting (examined over rule legs, one unit since examined() is last-call-wins; the PASS
    line names the table count). Inventory = the writer's own
    registries, the same union validate_table_registration treats as writer-reachable: every ops_tables key and the
    `tables:` block of config/lambda/ducklake/field_semantics.yaml, plus control_table_names() from
    src/common/ducklake_control_tables.py (the writer's control-class registry; the import validate_table_registration
    already makes). Every entry must match
    exactly one arm, else it fails: (1) contract SCD2 or event table (docs/contracts/<table>.yaml exists): every
    declared write-decidable rule (scripts.contract_rules) equals, kind by kind, what RowRules.from_projection builds
    from that table's entry (the object the writer evaluates): not_null against the projected not-null set,
    accepted_values, min_length, pattern, pattern_when, array_element_format, required_when, not_before, at_most,
    null_or_zero_when, max_after_write_seconds, representation_of, exactly_one_of, the payload content rule, each
    exclude_before, and each exemption as an exemption (producer-side, content leg or waived) -- and no RowRules entry
    is undeclared; legs on derivation timing read fields are reported as read-derived, not write rules; an SCD2 entry
    carries no table-level rule (rules_for passes none); (2) control table (in control_table_names() and in
    ops_tables): the contract declares only not_null, exactly on the columns the control registry's spec marks
    nullable false (the DDL NOT NULL the writer creates); a control-registry table missing from ops_tables or without
    a contract matches no arm; (3) contract-less table with write_boundary dormant and a pending_contract row_rule_source
    whose owner resolves to a roadmap criterion (a targeted text lookup of the item's criterion id in
    docs/ROADMAP-PLATFORM.yaml, never a full YAML load on the fast tier, Decision 208); (4) smoke table: status smoke, id in the frozen set
    {ops_smoke_events}, smoke_harness disposition; (5) the `tables:` block holds exactly history and current (the
    smoke harness pair, rules_for None). Also fails when a contract-less entry's columns carry any rule key beyond
    role, sql_type and nullable, when a sidecar table also has a contract, or when config/agent/data_quality/ops.yaml
    names a table the registry lacks. Imports scripts.contract_rules, src.row_rules.rules,
    src.common.ducklake_control_tables and PyYAML only.
- file: scripts/checks/contracts/validate_temporary_exemption_review.py
  action: Create
  purpose: >-
