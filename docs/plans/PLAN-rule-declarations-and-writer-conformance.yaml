acceptance_criteria:
- >-
  No contract under docs/contracts/ carries an `enforced` key on any rule leg; not_null is spelled `true` or
  `{exclude_before: ISO}`; a field that declared only an optional not_null keeps an empty block where contract drift
  requires the key (`dq_intent: {}`) and otherwise loses it; the rule
  set every table declares is unchanged (step 13) and config/lambda/ducklake/field_semantics.yaml changes only by the
  two dormant write_boundary keys and the transcripts exemption's class and review_by (step 14).
- >-
  tests/checks/contracts/test_write_time_enforcement_conformance.py::test_every_write_decidable_rule_has_a_writer_validator
  passes (rec-4158's acceptance node), and every failure arm of the conformance check fails closed on a fixture.
- >-
  validate_ops_rule_source covers the nine contract-backed writer tables and their baselines (and bans `enforced` in
  every contract under docs/contracts/); its ratchet fails on a
  value removal or any other params narrowing or earlier date without a semantic-break entry carrying the census, an
  undated new SCD2 leg, a new or re-classed exemption or a later review_by without an entry, a leg removal without a
  prior exemption, and (unconditionally, Decision 64) a date added to a live leg, moved later or removed.
- >-
  The engine records an exemption on any row-local rule and does not enforce it; an exempt rule never ships as a rule;
  the event projection reads not_null by presence.
- >-
  The deployed writer refuses write_ops, file_ops and update_ops on ops_priority_queue and ops_execution_plans (400
  naming dormant) while create_ops_tables still provisions them; all six (table, verb) refusals are proven on every
  deploy by --lambda-row-rules, and provisioning by the handler node (step 9).
- A past review_by on a temporary exemption fails the full tier and no --pre run.
- >-
  The records carry the choice: the write-time-enforcement rule (grammar, ratchet, row-local coverage), one Decision
  210 annotation under the per-entry cap, T4.3 c6 and T4.5 c2, ducklake_writer.yaml's dormant refusal, and rec-4158's
  dated note.
