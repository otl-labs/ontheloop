constraints:
- >-
  No rule is added, removed or re-dated by the re-spelling (step 13); every exclude_before carries over (Decision 64);
  the projection changes only where step 14 allows.
- The build's merge redeploys all six DuckLake functions through the governed workflow only (Decisions 79, 125, 126); never a local build_lambda --deploy.
- The build amends Class A contracts and annotates Decision 210, so its merge waits for the operator's word even with code review PROCEED and CI green.
- No budget raise and no amendment_log compaction (Decisions 128, 166); validate_ops_rule_source.py decomposes; Decision 210 stays under 6,144 bytes.
- No pre_glob is dropped from any Entry (Decision 187); the check keeps its registered name.
- The portal, ops.yaml, write_validators.py and their tests are untouched here -- the portal row-rule gate plan owns them, and builds after this plan merges.
- Do not touch src/common/ducklake_write_rules.py or src/common/ducklake_writes.py; the writer already runs the engine on every table this plan covers.
- >-
  Every node a graduated registry row names inside a test file this plan scopes keeps its file and name and is
  re-pinned in place, never moved or weakened (Decision 181 cl.1). Measured: ops-rule-source-parity,
  ops-row-rules-ratchet, ops-contract-rule-table, ops-row-rules-wiring, ops-row-rules-engine,
  ops-row-rules-old-engine-gone, ops-row-rules-projection, ops-row-rules-contracts, ops-rule-source-records,
  write-time-enforcement-decision-declared, field-semantics-event-projection, growth-safe-snapshot-pins,
  telemetry-event-journal-contract-shape, telemetry-partition-calendar-day, telemetry-lifecycle-friction-amendment,
  telemetry-contract-risk-amendments, telemetry-name-rule-contract, telemetry-name-rule-engine,
  telemetry-rule-projection, telemetry-kernel-row-rules, telemetry-registry-consumer-safety,
  telemetry-dimension-contract-guards, telemetry-writer-contract-paths. An amendment_log pin is re-pinned to presence,
  never position (#1492).
- >-
  docs/contracts/data-modeling-standard.yaml is at 439 of its 500 effective lines: net additions stay under 40;
  compress the rule's own text rather than raise (Decision 128).
- >-
  Sequencing (whichever lands second adapts): blob route deletes the transcripts exemption and regenerates
  field_semantics.yaml (regenerate, never hand-merge), and also edits docs/contracts/storage-substrate.yaml and
  tests/test_field_semantics_event_projection.py (rebase and keep both changes; step 14 tolerates the exemption's
  absence). PLAN-telemetry-cache-token-totals adds two read-derived
  telemetry_agents fields with `dq_intent: {not_null: {enforced: false}}`: built after this plan, it writes `dq_intent:
  {}` (the --pre ban refuses the key; its verbatim checks pin descriptions and semantics, not dq_intent); built before,
  this build re-spells those two legs too (counts become 234 and 129). The coordinator carries this to that build.
  PLAN-reader-verbs-decision-notes edits telemetry_sessions' and telemetry_observations' KNOWN GAPS lists; both
  plans' contract checks are PR-relative, so the second rebases. Refusing ops_execution_plans makes T2.26 c9's
  write-path VP un-rerunnable until T4.5 lands its contract (accepted).
- No rescue agents or workaround loops (Decision 55).
