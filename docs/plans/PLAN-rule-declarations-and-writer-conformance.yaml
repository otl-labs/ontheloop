    ever fires on the legacy form.
- file: src/row_rules/rules.py
  action: Modify
  purpose: >-
    Exposes WAIVABLE_KINDS (public frozenset of the row-local column kinds below) beside EXEMPTABLE_LEGS and
    PRODUCER_SIDE_KINDS, so the grammar reads the exemptable set from the engine. RowRules.from_projection records an
    exemption on any row-local column rule kind (accepted_values, min_length,
    pattern, pattern_when, array_element_format, required_when, not_before, at_most, null_or_zero_when,
    max_after_write_seconds, and not_null on a nullable column) in a new `waived` mapping {(column, kind): (reason,
    owner)} and does not enforce it. It raises RuleProjectionError when the same column also carries that rule (an
    exempt rule must not ship) or when it exempts not_null on a nullable false column. Producer-side and content-leg
    exemptions keep today's handling. Stdlib only; no first-party import (the leaf contract stands). This makes an
    owned exemption a usable staging and mark-then-drop instrument on any rule (Decision 210 cl.3).
