execution_steps:
- >-
  Write the red tests first (the new nodes of steps 1-12) and confirm each fails on the unchanged tree.
- >-
  Readers before data: scripts/contract_rules.py, field_semantics_event_projection.py and contracts.py read not_null by
  presence and the legacy spelling alike; run step 8 and the existing projection tests on the unchanged contracts
  (byte-identical projection) before any contract changes.
- >-
  Re-spell the 18 contracts mechanically (a scratch script outside the repo; flow and block styles; an optional-only
  field keeps `dq_intent: {}`), then reword every prose mention of the enforced flag with its field-level
  prose_improvement entry, add one contract-level entry per contract, and add the transcripts exemption's class and
  review_by. Run steps 13 and 14 and the contract-drift check before going on.
- src/row_rules/rules.py waived exemptions; the event projection's exempt-rule omission; the generator's two guards.
- >-
  The sidecar dispositions and dormant boundary; regenerate field_semantics.yaml; the handler refusal;
  ducklake_writer.yaml; the gate's six dormant cases and the re-pin of the graduated test_lambda_row_rules_ok (derived
  from the case tuples, never weakened).
- >-
  Decompose validate_ops_rule_source into the entry module and its three helpers (move first, run the existing tests
  green, then widen and add the ratchet arms); then the conformance check and the review-date check, their manifest
  Entries, taxonomy rows and mirror tests; re-run validate_pre_glob_closure and add exactly what it reports.
- >-
  Records -- data-modeling-standard.yaml, storage-substrate.yaml, the Decision 210 annotation (measure its bytes),
  decisions-index, T4.3 c6 and T4.5 c2.
- Execute Verification Plan steps 1-18 -- loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
- Write the registry rows for the graduated steps (1, 2, 3, 4, 5, 6, 9, 11, 12) with the check ids declared on each step.
- >-
  Portal bookkeeping (get_rec_write_guidance first, Decision 66; fetch before update; prepend a dated note, never
  overwrite): rec-4158 gains '[<date> RULE DECLARATIONS AND WRITER CONFORMANCE DELIVERED via
  PLAN-rule-declarations-and-writer-conformance]' naming what landed and that the portal row-rule gate plan remains,
  and its acceptance moves to the portal plan's node
  (bin/venv-python -m pytest tests/test_ops_data_portal_validators.py::test_portal_gate_is_the_writer_gate -q), since
  this plan's merge makes the current node pass while the rec stays open for that plan.
- >-
  CLOSURE (implement skill Commit Flows; docs/contracts/git-ops.yaml): readiness, set implementation_declared true,
  rebase on origin/main, step 18 on the committed tree, postflight evidence, push, open the PR, subscribe. On green CI
  and code review PROCEED, STOP and ask the operator for the merge (Class A contract amendments, a Decision
  annotation, and a governed deploy). On his word squash-merge with the PR body as commit_message (no Resolves trailer:
  rec-4158 stays open), watch the deploy workflow to completion, then run steps 19-23.
- 'Report: what was implemented, verification results'
rollback: >-
  Revert the squash commit; the governed workflow redeploys the prior code and projection. The contracts return to the
  legacy spelling, which the prior reader reads, and the two tables become writable again (no row was written while
  they were refused). No warehouse row changes in either direction.
