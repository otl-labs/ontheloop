schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: rule-declarations-and-writer-conformance
intent: >-
  rec-4158 (Decision 210), the first of its two closing plans: make every rule declaration on every warehouse table say
  exactly what the writer enforces, and prove it on every PR. A declared rule IS enforced, so the `enforced` key is
  retired from every contract under docs/contracts/ (the warehouse contracts, their shared baselines and the two
  file-backed Class A contracts; staging is spelled only by an exclude_before date or an owned exemption). The
  declaration guard covers all nine contract-backed writer tables and ratchets the loosening and narrowing moves the
  amendment ritual never saw (a narrowed or removed rule parameter, an earlier date, an undated new SCD2 rule, a new
  exemption).
  A new all-writer conformance check (rec-4158's acceptance node) proves declared equals enforced for every table the
  writer can write. The writer refuses the two contract-less tables until their contracts land. The portal row-rule
  gate plan follows this one.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V3
plan_path: docs/plans/PLAN-rule-declarations-and-writer-conformance.yaml
phase: >-
  ad_hoc_rec rec-4158 (Decision 210 coverage: every writer, present and future -- the writer-conformance check);
  no tier_item claimed. Adds a contract-before-first-emit criterion to the priority-queue producer item and re-words
  the plan-projection item's contract criterion (both named in the roadmap scope row); closes no criterion.
scope:
