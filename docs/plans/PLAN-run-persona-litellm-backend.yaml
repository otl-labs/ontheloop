schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: run-persona-litellm-backend
intent: >-
  Build the run_persona port's litellm backend (T4.32 c1, backend leg; audit WP-07), plan 1 of the four plans the hint
  PLAN-run-persona-litellm-backend splits into (blind consult, settled). A persona-agnostic run loop under
  src/persona_backends/ loads a persona contract and its rendered prompt (hash-checked), refuses any capability whose
  binding this backend does not build, checks the materialised input against input_schema (input_incomplete with no
  model call), serves the read_input:<blob> tool, asks every call for a JSON object, checks each terminal turn against
  output_schema or the failure envelope, repairs at most max_revisions times (then schema_invalid), counts every
  provider attempt against max_turns, holds one monotonic deadline for max_wall_clock_seconds, uses the transport's
  outage-only first-call fail-over and keeps the fallback role after it, and records one turn record per transport
  call, carrying its attempts, rewritten atomically to an events file after every call. scripts/run_persona.py injects scripts.llm.litellm_transport into the
  backend (no src module imports scripts) and gives the verdict chain one command: input JSON in, the result JSON alone
  on stdout, events to a file. Later plans: verdict consistency (rec-5052), the telemetry producer (rec-4028, which maps
  the events file to rows and writes definition_sha256) and the warehouse_read MCP bridge (rec-5267). Serves NS.3: verdicts run on
  GitHub from main's definition.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-run-persona-litellm-backend.yaml
phase: >-
  T4.32 c1 (backend leg, part); closes no criterion. T4.32 is in_progress, and the hint's predecessors
  (PLAN-persona-contracts-verdict-slice, PLAN-llm-client-litellm-transport, rec-4433) are merged and built. The active
  data-pipeline manifest includes src/, so its excludes gain src/persona_backends (the src/turn_capture and
  src/sensitive_values precedent) and no artifact bundles the package; scripts/llm/ and scripts/run_persona.py are in
  no bundle, so nothing deploys (V2).
closes_criteria: []
cites: [dec:117, dec:173, dec:205, dec:206, dec:212, dec:246]
scope:
  - file: src/persona_backends/__init__.py
    action: Create
    purpose: >-
      Facade (the port), re-exports only (no logic, so coverage measures every line): run_persona, RunRefused,
      RunAborted and Transport from litellm_backend.py and the events types from events.py. litellm_backend.py defines
      `async def run_persona(contract_path: Path, materialised_input: dict, workspace: Path | None, backend: str, *,
      transport: Transport, on_event: Callable[[dict], None] | None = None, max_tokens: int = 32000, clock=time.monotonic,
      wall=time.time) -> tuple[dict, list[dict]]` returns (result, events). Refuses (RunRefused) a backend other than
      "litellm" (claude_cli is T4.27's, codex_cli reserved) and a workspace that is not None (no workspace capability is
      built; T4.15:c3). Names no persona id or contract path (implementation_binding).
  - file: src/persona_backends/contract.py
    action: Create
    purpose: >-
      `load(contract_path) -> LoadedContract` (persona, contract_version, input_schema, output_schema, capabilities,
      budget, failure ids, rendered prompt text and sha256, blob names). The rendered prompt is read from the contract's
      sibling rendered/<stem>.txt (the executor-personas.yaml rendered_prompt.location rule); its bytes' SHA-256 must equal
      rendered_prompt_sha256, else RunRefused. BUILT = frozenset({"read_input"}); a capability whose id (before ":") is not
      in BUILT is refused with RunRefused naming it. Budget values are read as integers; a missing one is refused. No
      jsonschema metaschema check (the full tier's validate_persona_contracts owns contract validity).
  - file: src/persona_backends/read_input.py
    action: Create
    purpose: >-
      The read_input tool. `tool_spec(blob_names)` returns one OpenAI-style function tool, parameters {blob: enum of the
      contract's read_input:<blob> names, mode: enum [lines, search], start: integer >= 1, end: integer >= 1, query:
      string}, required [blob, mode]. `serve(arguments_json, blobs) -> str`: a str value is served as-is, any other value
      as canonical JSON (sorted keys, two-space indent); lines mode returns "<n>: <line>" for start..end (default 1..
      the end), capped at READ_CAP_BYTES = 65536 with a final "[truncated: next line <n> of <total>]" line; search mode is
      a literal (never regex) substring match returning numbered matching lines, at most 200, then
      "[<k> more matches]"; every reply ends with "[<blob>: <total> lines]". An undeclared or absent blob, bad JSON or a
      bad mode returns "error: <reason>" as the tool result, never an exception.
  - file: src/persona_backends/output.py
    action: Create
    purpose: >-
      `check(content, finish_reason, loaded) -> Checked(value | None, errors: list[str])`. finish_reason "length",
      blank content, text that json.loads rejects or a non-object are errors. A value whose outcome is "failure" must have
      exactly the keys outcome, failure (a failure id the contract lists) and detail (a string); any other value is
      checked against output_schema with jsonschema.Draft202012Validator, errors as "<json path>: <message>" sorted, at
      most 20. `repair_message(errors)` is the fixed text "Your last reply is not a valid result:" followed by the error
      lines and "Reply with one JSON object only: the result, or a failure the contract lists." `failure(id, detail)`
      builds a failure value.
  - file: src/persona_backends/litellm_backend.py
    action: Create
    purpose: >-
      run_persona (above) and the run loop. (1) input check: Draft202012Validator(input_schema) over the materialised
      input with zero transport calls on any error: a "required" error returns failure input_incomplete; any other error
      returns input_unusable when the contract lists it, else input_incomplete (the nearest listed id); detail carries
      the error paths. (2) messages: system = the rendered
      prompt text; user = the fixed opening "Your input is attached as blobs you read with the read_input tool:" then one
      line per declared blob "<name>: <total> lines" and the change_id and head_sha values, then "Return your result as
      one JSON object." (3) each call: transport(persona, messages, max_tokens=max_tokens, tools=[read_input spec],
      response_format={"type": "json_object"}, timeout=min(600, remaining), role=role, fail_over=F, max_attempts=A)
      wrapped in asyncio.wait_for(remaining), where R = max_turns - turns_used, F = (first call and R >= 3), and A =
      min(3, (R - 1) // 2) when F else min(3, R), so primary attempts, the fallback's cold-start probe and fallback
      attempts together never pass R. turns_used += len(attempts) (TransportResult.attempts, or TransportError.attempts
      on a raise), plus one for the cold-start probe when the call failed over, which is when result.failed_over is
      true or, on a raise, when any returned attempt's role is warm_fetched_escape_hatch (acomplete merges the primary's
      attempts into a fallback TransportError but marks no fail-over) or when F was passed and the raise carries A
      primary outage attempts (the fallback's own setup refused after an asserted probe); either way the role then becomes
      warm_fetched_escape_hatch for the rest of the run. Where the attempts are unknown (a fallback_unavailable
      TransportError carries none; a wait_for timeout cancels the call), the turn record sets attempts_known false and
      turns_used adds the upper bound (A + 1 + A when F, else A). (4) a response with tool_calls: append result.message as the
      assistant message (reasoning fields kept as returned) and one role tool message per call with serve()'s text, in
      call order; an unknown tool name gets "error: unknown tool". (5) a response without tool_calls is terminal: check();
      valid -> return it; invalid -> revisions_used += 1, and past max_revisions return failure schema_invalid, else append
      the assistant message and repair_message() as a role user message. A TransportError of kind empty_output or
      malformed_output is an invalid terminal turn (revision counted) with no assistant message to append: only the
      role user repair message is appended; any other TransportError raises RunAborted(kind, events so far). The
      backend cannot import TransportError (the import boundary), so it recognises one by duck typing: an exception
      carrying a str kind and a tuple attempts; any other exception the transport raises (a TierSelectionError from
      role resolution, for example) is RunAborted with kind "transport_exception" and the exception's class name in
      detail, so the entry point still exits 4. (6)
      before every call: turns_used >= max_turns or remaining <= 0 returns failure budget_exhausted (detail names which);
      asyncio.TimeoutError from wait_for returns budget_exhausted. injection_suspected is only ever the model's own
      failure value. Under 500 SLOC; split a helper module out if it nears the limit.
  - file: src/persona_backends/events.py
    action: Create
    purpose: >-
      Run record types, plain dicts. header {schema: 1, backend: "litellm", contract_path, persona, contract_version,
      rendered_prompt_sha256, input_sha256 (SHA-256 of the canonical-JSON materialised input), started_at_ms (wall clock,
      integer epoch ms, taken once before the first call)}; one turn record per transport call {turn, role, attempts
      [{role, model, attempt, outcome, latency_ms}], attempts_known, probe_turn (1 after a fail-over, else 0), record (the CallRecord as a dict, or null on a raise), failed_over,
      finish_reason, tool_calls [names], tool_result_bytes [ints], kind (tool | terminal_valid | terminal_invalid |
      transport_error), revision, message (the assistant message as returned, or null), started_at_ms, ended_at_ms}; and
      an end record {outcome, failure (or null), turns_used, revisions_used, ended_at_ms}. On RunAborted the aborting call
      still gets a turn record (kind transport_error, with its attempts or attempts_known false) and the end record has
      outcome "aborted", failure null and an error field naming the kind, so the file is always whole. `write_atomic(path, header,
      turns, end)` writes one JSON document to <path>.tmp then os.replace. It holds no telemetry row shape: the producer
      plan (rec-4028) maps it (Decision 221 cl.7: a hand-off, not a second journal).
  - file: scripts/run_persona.py
    action: Create
    purpose: >-
      Entry point: `<python> [-I] scripts/run_persona.py --contract <path> --input <json path> --events <path>
      [--max-tokens N]`. Inserts its own repo root (Path(__file__).resolve().parents[1]) at sys.path[0] when absent, so it
      runs under python -I; imports src.persona_backends and the scripts.llm.litellm_transport module at module top and
      passes a wrapper that looks up litellm_transport.acomplete at call time as the transport; on_event
      rewrites the events file after every turn and once at the end. stdout carries only the result JSON (sorted keys,
      one line); exit 0 when a result (success or failure value) was produced, 2 on RunRefused or unreadable arguments
      (message on stderr), 4 on RunAborted (stderr carries {"error": <kind>} as JSON; the events file holds the turns so
      far). It reads no AWS credential and calls no GitHub API; the transport reads the key variable the shell sets.
  - file: tests/persona_backends/__init__.py
    action: Create
    purpose: Package marker; empty.
  - file: tests/persona_backends/fakes.py
    action: Create
    purpose: >-
      Scripted fake transport (an async callable replaying a list of TransportResult-shaped objects or TransportError
      raises, recording every call's kwargs) and a fake monotonic and wall clock; built on scripts.llm.litellm_wire's
      CallRecord, Attempt and TransportError and scripts.llm.litellm_transport's TransportResult so the fake keeps the real
      shapes.
  - file: tests/persona_backends/test_contract.py
    action: Create
    purpose: >-
      Mirror test: the fixture contract loads; a rendered prompt one byte off is refused; each of read_repo, run_tests,
      edit_repo and warehouse_read:<x> is refused by name; test_capability_gate_matches_index: over the live
      executor-personas.yaml vocabulary, BUILT equals the set of capabilities whose litellm binding is a backend_tool
      owned by T4.32:c1 (derived from the index, never a hardcoded list; red before the sidecar's e03-e05 are placed).
  - file: tests/persona_backends/test_read_input.py
    action: Create
    purpose: >-
      Mirror test: line ranges and numbering, default range, byte cap with the truncation line, literal search (a regex
      metacharacter query matches literally), match cap, a non-string blob served as canonical JSON, undeclared blob and
      bad arguments return error text.
  - file: tests/persona_backends/test_output.py
    action: Create
    purpose: >-
      Mirror test: a valid success, a listed failure, an unlisted failure id, extra failure keys, blank content,
      unparseable text, a non-object, finish_reason length and a schema violation each give the expected value or errors;
      repair_message lists the errors.
  - file: tests/persona_backends/test_litellm_backend.py
    action: Create
    purpose: >-
      Mirror test on the fake transport: tool call then final -> success and two turn events;
      test_invalid_then_valid_within_max_revisions; test_revisions_exhausted_returns_schema_invalid;
      test_empty_output_is_a_repair_turn; test_max_turns_counts_retried_attempts (a call carrying three attempts uses
      three turns); test_fail_over_attempts_stay_within_max_turns (max_turns 3 and 5 with a fake that fails over after
      primary outages: max_attempts and the probe turn keep turns_used at or under max_turns, and max_turns 2 passes
      fail_over=False); test_fail_over_then_fallback_empty_output_counts_probe (max_turns 6: two primary outages, the
      probe and a fallback empty_output count four turns, the next call passes role warm_fetched_escape_hatch and
      max_attempts 2, and turns_used never passes 6); test_deadline_returns_budget_exhausted (fake clock); test_wait_for_timeout_returns_budget_exhausted;
      test_input_incomplete_makes_no_call; test_type_error_returns_input_unusable_when_listed;
      test_fail_over_keeps_fallback_role (later calls pass role warm_fetched_escape_hatch, only the first passes
      fail_over=True); test_fallback_unavailable_counts_upper_bound; test_fallback_setup_refusal_counts_probe (F set; a missing_credential
      raise carrying A primary outages counts the probe and aborts); test_outage_raises_run_aborted_with_events;
      test_malformed_output_is_a_repair_turn; test_unknown_tool_gets_error_text;
      test_non_transport_exception_aborts (a plain exception from the transport is RunAborted transport_exception); every call passes response_format
      json_object and the read_input tool; the facade refuses claude_cli, codex_cli and a non-None workspace.
  - file: tests/persona_backends/test_events.py
    action: Create
    purpose: >-
      Mirror test: header fields (rendered_prompt_sha256 equals the contract's; started_at_ms an int), one turn record
      per call with its attempts, end record, write_atomic leaves no .tmp and a reader sees a whole document after each
      turn.
  - file: tests/persona_backends/test_package_boundary.py
    action: Create
    purpose: >-
      No module under src/persona_backends/ imports scripts (ast walk of Import and ImportFrom); .importlinter holds a
      forbidden contract whose source is src.persona_backends and whose forbidden_modules include scripts; and
      config/agent/executor/capabilities.yaml boundary_patterns cover src/persona_backends/__init__.py,
      tests/persona_backends/test_events.py, tests/fixtures/persona_backends/fixture_persona.yaml,
      scripts/run_persona.py and tests/test_run_persona.py; docs/contracts/file-router.yaml scripts_root_allowlist.allowed_files lists run_persona.py
      (entries are relative to scripts/); and test_excluded_from_data_pipeline, the twin of
      tests/lambda_manifest/test_bundle_checks.py's test_sensitive_values_excluded_from_data_pipeline: the data-pipeline
      manifest excludes src/persona_backends, compute_affected_artifacts over the package's files omits data-pipeline,
      and a staged bundle (stage_bundle, skip_pip=True) holds no persona_backends path.
  - file: tests/test_run_persona.py
    action: Create
    purpose: >-
      Mirror test for scripts/run_persona.py (Decision 131 maps a root script here): with
      scripts.llm.litellm_transport.acomplete monkeypatched to the fake (the entry point looks it up at call time), the
      result alone on stdout and exit 0, the events file rewritten per turn; exit 2 on a refused contract; exit 4 and
      {"error": "outage"} on stderr on RunAborted with the events file holding the turns so far; a subprocess run under
      python -I from a temporary working directory with a tmp copy of the fixture contract naming warehouse_read:x exits
      2 with the refusal on stderr, so the root resolution and the backend import are both exercised and no transport
      call is made.
  - file: tests/fixtures/persona_backends/fixture_persona.yaml
    action: Create
    purpose: >-
      An unregistered fixture verdict contract (persona fixture_persona, equal to its file stem as persona_contract
      requires; contract_version 1, input change_id, head_sha,
      notes; capabilities read_input:notes; output {outcome: success, verdict: PROCEED|REVISE, findings: [str]}; budget
      max_turns 6, max_wall_clock_seconds 60, max_revisions 1; the four required failure ids) whose
      rendered_prompt_sha256 is its rendered prompt's hash, on a line ending "# pragma: allowlist secret" (as
      docs/contracts/personas/plan_critic.yaml does).
  - file: tests/fixtures/persona_backends/rendered/fixture_persona.txt
    action: Create
    purpose: The fixture contract's rendered prompt (starts with executor-personas.yaml's quoted_content_clause).
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's six blocks (docs/plans/approved/run-persona-litellm-backend.yaml): the amendment_log row, the
