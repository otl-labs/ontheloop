execution_steps:
  - Read docs/contracts/executor-personas.yaml (run_persona, capability_vocabulary, persona_contract, budget_rules, failure_envelope, rendered_prompt, implementation_binding) and the transport's TransportResult, CallRecord, Attempt and TransportError.
  - Write tests/persona_backends/fakes.py, the fixture contract and its rendered prompt (compute rendered_prompt_sha256 from the file's bytes).
  - Write src/persona_backends/contract.py, read_input.py, output.py, events.py, litellm_backend.py and __init__.py with their mirror tests, red first.
  - Write scripts/run_persona.py and tests/test_run_persona.py.
  - Place the sidecar's six blocks in docs/contracts/executor-personas.yaml ({{DATE}} = build date).
  - Edit config/agent/executor/capabilities.yaml, .importlinter, src/lambdas/data-pipeline/manifest.yaml and docs/contracts/file-router.yaml (compaction first, measured on main), then tests/persona_backends/test_package_boundary.py.
  - Run bin/venv-python -m scripts.validate --pre and fix.
  - git add the new files (validate_placement reads git ls-files, so VP6's placement leg sees scripts/run_persona.py only once it is tracked).
  - Execute Verification Plan steps 1-6 -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
  - >-
    CLOSURE, each outcome reported separately: readiness, parent-validator evidence, postflight evidence and the real
    push and PR outcome (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence): bin/venv-python -m
    scripts.session.github_readiness; run /implement's Verification Graduation walk, which writes the registry shards
    for run-persona-litellm-backend-loop, run-persona-litellm-backend-contract-tool-events and run-persona-entry-point;
    set implementation_declared: true in this plan; commit (feat(run-persona-litellm-backend): ...); git fetch origin
    main && git rebase origin/main; VP step 7 on that committed, rebased tree; write
    /tmp/implementation-retrospective.json with the scripts.session.postflight_evidence.CATEGORIES keys and run
    bin/venv-python -m scripts.session.postflight --evidence /tmp/implementation-retrospective.json; push (git push -u
    origin HEAD as its own call); open the PR and report it as opened only with the returned PR number; subscribe to it;
    on green CI squash-merge. No roadmap edit (T4.32 c1 stays open).
  - 'Report: what was implemented, verification results, and anything UNPROVEN.'
