acceptance_criteria:
  - A fixture persona run through run_persona on a scripted fake transport returns a schema-valid success after a read_input tool turn, with one event per transport call and an end record.
  - An invalid terminal turn is repaired up to max_revisions and then returns schema_invalid; blank output is a repair turn.
  - max_turns counts every provider attempt, and the deadline and max_turns each return budget_exhausted.
  - An input missing a required field returns input_incomplete with no transport call.
  - A contract naming any capability other than read_input, a rendered prompt off its hash, a non-litellm backend or a non-None workspace is refused.
  - scripts/run_persona.py prints the result alone on stdout and exits 0, 2 or 4 as specified, and src/persona_backends imports nothing under scripts.
  - executor-personas.yaml carries the sidecar's six blocks word for word, and the persona contract checks stay green.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The run loop, output checks and budgets on the fake transport.
    command: bin/venv-python -m pytest tests/persona_backends/test_litellm_backend.py tests/persona_backends/test_output.py -q
    expected: Exit 0, every node passes. Red before (the modules and tests are absent).
    expected_literals:
      - ' passed'
    fix_if: >-
      A repair not counted, a retried attempt not counted as a turn, a deadline that lets a call start, or fail-over
      reused after the first call: fix the backend, never the fake or the expectation.
    hermetic: true
    graduation: graduate
    graduation_check_id: run-persona-litellm-backend-loop
  - step: 2
    phase: pre-deploy
    action: Contract loading and the capability gate (against the live index), read_input and the events file.
    command: bin/venv-python -m pytest tests/persona_backends/test_contract.py tests/persona_backends/test_read_input.py tests/persona_backends/test_events.py -q
    expected: Exit 0, every node passes. Red before (absent).
    expected_literals:
      - ' passed'
    fix_if: >-
      test_capability_gate_matches_index red after the sidecar is placed means a block was misplaced; a blob served
      beyond its cap or a regex search: fix the tool.
    hermetic: true
    graduation: graduate
    graduation_check_id: run-persona-litellm-backend-contract-tool-events
  - step: 3
    phase: pre-deploy
    action: The entry point's stdout, exit codes and events file, and its python -I root resolution.
    command: bin/venv-python -m pytest tests/test_run_persona.py -q
    expected: Exit 0, every node passes. Red before (absent).
    expected_literals:
      - ' passed'
    fix_if: Anything besides the result JSON on stdout, or a wrong exit code; fix the entry point.
    hermetic: true
    graduation: graduate
    graduation_check_id: run-persona-entry-point
  - step: 4
    phase: pre-deploy
    action: The import boundary (test and import-linter) and the executor boundary rows.
    command: bin/venv-python -m pytest tests/persona_backends/test_package_boundary.py -q && bin/venv-python -m scripts.import_governance --check-contracts
    expected: Exit 0 from both; the import-linter run lists src-persona-backends-imports-no-scripts as kept.
    expected_literals:
      - src.persona_backends imports nothing under scripts
    fix_if: A src module importing scripts -- inject the dependency from scripts/run_persona.py instead.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Two commands; the pytest half is a standing guard through the fast tier's own test run and the import-linter half
      is already a standing check (scripts.import_governance in the tier), so a registry shard would duplicate both.
  - step: 5
    phase: pre-deploy
    action: >-
      The placed contract text and the checks that read it: the sidecar binds executor-personas.yaml, the persona contract
      and binding checks pass, and placement accepts scripts/run_persona.py.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug run-persona-litellm-backend && bin/venv-python -c
      "from scripts.checks.contracts.validate_persona_contracts import validate_persona_contracts as a;
      from scripts.checks.contracts.validate_persona_contract_binding import validate_persona_contract_binding as b;
      from scripts.checks.hygiene.validate_placement import validate_placement as c;
      f=[];a(f);b(f);c(f);print(*f,sep='\n');print(f'contract checks: {len(f)} failures');assert not f"
    expected: The verify run passes and the last line reports 0 failures.
    expected_literals:
      - 'contract checks: 0 failures'
    fix_if: >-
      A verify mismatch: place the block word for word (never edit the sidecar). An owning_item not open: STOP to this
      planning thread. A placement failure: the allowlist row is missing.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Three registered checks already run in every tier and the approved-text verify runs in validate_merge_step; a shard
      would duplicate them.
  - step: 6
    phase: pre-deploy
    action: Pre-handoff full tier on the committed, rebased tree (Decision 163), read through its evidence file.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports the full tier passed on HEAD's tree.
    fix_if: Any failure; fix and re-run both from the start (timeout_disposition blocked).
    hermetic: false
    graduation: not-applicable
