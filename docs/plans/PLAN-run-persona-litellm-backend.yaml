weakening_dispositions: []
constraints:
  - >-
    Place every sidecar block word for word ({{DATE}} filled with the build date); never edit the sidecar (Decision 246).
    executor-personas.yaml gets no other edit. If the rebase moves a block's before text, STOP to this planning thread.
  - >-
    No code under src/persona_backends/ or scripts/run_persona.py names a registered persona id or contract path while
    its personas row is pending (implementation_binding; validate_persona_contract_binding); the fixture persona lives
    under tests/. No personas row changes status.
  - >-
    No telemetry row, writer call, AWS call, key read or GitHub API call (Decision 212 cl.3, T4.2 c8/c13); the events
    file is the only record. Leave scripts/personas/, tests/personas/ and tests/fixtures/persona_verdict/ (the verdict
    chain plan's) and scripts/llm/ untouched.
  - >-
    Every new module stays under 500 SLOC (Decision 128); if litellm_backend.py nears it, split a helper module inside
    src/persona_backends/ and add its mirror test, never a budget raise.
  - Public repository (Decision 101) -- fixtures are synthetic; no key, account id or hostname anywhere.
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
