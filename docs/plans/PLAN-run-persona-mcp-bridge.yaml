handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: run-persona-mcp-bridge
intent: >-
  Build the warehouse_read consumption leg of the run_persona litellm backend (T4.32 c1, T4.10a c7's consumption leg;
  rec-5267), plan 4 of the four plans PLAN-run-persona-litellm-backend split into. A stdio MCP client in
  src/persona_backends/mcp_bridge.py starts the one On The Loop MCP server (scripts/agent_sdk/mcp_server.py) once per
  run whose contract names warehouse_read:<named_read>, offers the model only the named reads the contract lists (with
  the server's own input schemas), and returns each call's text to the tool loop; scripts/run_persona.py injects the
  server's launch parameters (the module named by the index binding, run from the repository root, with an environment
  that carries the reader's configuration and credentials and never an inference key), so src/persona_backends still
  imports nothing under scripts. The capability gate admits warehouse_read, test_capability_gate_matches_index counts
  every T4.32:c1-owned binding, and run_persona.result says what the backend builds. Proven against a fake stdio server
  built on the real server module with a fake reader. Serves NS.5: personas reach the warehouse only through the named,
  typed verbs of the one server (NS.3 once a verdict contract names warehouse_read, after rec-5312).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-run-persona-mcp-bridge.yaml
implementation_declared: true
phase: >-
  T4.32 c1 (backend leg, part: the warehouse_read MCP consumption the item's T4.10a c7 annotation hands to c1); closes
  no criterion (c1's credential, chain, image and adapter legs stay open). T4.32 is in_progress and the backend plan's
  build merged (#2132, eed2f6e4). src/persona_backends is excluded from the data-pipeline bundle and scripts/run_persona.py
  is in no bundle, so nothing deploys (V2). closes_criteria is [] by exit-criteria-ledger.yaml's plan_closes_criteria
  default for a leg of an in_progress item (as PLAN-persona-image-channel).
closes_criteria: []
cites: [dec:84, dec:205, dec:206, dec:212, dec:246, dec:256, dec:263]
scope:
  - file: src/persona_backends/mcp_bridge.py
    action: Create
    purpose: >-
      The stdio MCP client (mcp 2.3.0; litellm.experimental_mcp_client is not used: experimental, not built for the mcp
      2.x client, and the spec conversion here is a few lines). `open_bridge(server: StdioServerParameters, verbs:
      tuple[str, ...], *, errlog: TextIO, startup_timeout: float)` (errlog must be a file object with a real fileno, as
      Popen needs one: tests pass a tmp file, never StringIO) is an async context manager yielding a Bridge: it runs
      stdio_client(server, errlog=errlog) and ClientSession, and initialize() plus list_tools() under
      anyio.fail_after(startup_timeout), raising BridgeTimeout when that expires. It raises BridgeUnavailable (class name
      only in its text, Decision 101) when the server cannot spawn (OSError), exits or fails during startup (an
      mcp.shared.exceptions.MCPError or a BaseExceptionGroup wrapping one from the client's task groups), or when a named
      verb is not among the listed tools (naming the verb). `Bridge.tool_specs()` returns one OpenAI-style
      function spec per named verb, in contract order: name = the verb, description and parameters = the listed tool's
      description and input_schema, verbatim; tools the server lists but the contract does not name are never offered
      (Decision 206 clause 1). `await Bridge.call(name, arguments_json) -> str`: a name outside verbs returns "error:
      unknown tool" without a server call (the ceiling is enforced where the session lives); arguments that are not a JSON
      object return "error: ..." text without a server call; a result with is_error returns "error: " + its text; otherwise the
      text contents joined by newlines; any reply past read_input.READ_CAP_BYTES is cut at that byte count (on a
      character boundary) and ends "[truncated: <total> bytes]". A failure of the session itself (closed stream, an
      MCPError, a BaseExceptionGroup, the process gone, or any other non-cancellation Exception from call_tool, such as
      its RuntimeError on output-schema validation or a pydantic ValidationError on a malformed result) raises
      BridgeFailed (class name only). An exception raised in the
      context's body (the run loop's RunAborted, RunRefused or any other) leaves open_bridge as itself, never wrapped:
      stdio_client and ClientSession each own an anyio task group, so a body exception otherwise surfaces as a nested
      ExceptionGroup (measured: ExceptionGroup([ExceptionGroup([E])])); open_bridge records the body's exception and,
      when a BaseExceptionGroup leaves the client contexts, re-raises that recorded exception (a bare raise of it, never
      `from None`, so a RunAborted keeps its __cause__), so only failures that originate in the session become
      BridgeFailed. The startup errors open_bridge raises itself inside the client contexts (BridgeTimeout,
      BridgeUnavailable) are recorded and re-raised the same way, so they too leave unwrapped (measured: unrecorded they
      leave as ExceptionGroup([ExceptionGroup([BridgeTimeout])])). The server's stderr goes
      only to the injected errlog, never to the run's own stdout or stderr. Names no persona id and no scripts path.
  - file: src/persona_backends/contract.py
    action: Modify
    purpose: >-
      BUILT = frozenset({"read_input", "warehouse_read"}). read_input:<blob> keeps its input_schema property check;
      warehouse_read:<verb> needs a non-empty parameter that is not "read_input" (the backend's own tool name), else
      RunRefused naming the capability. LoadedContract gains warehouse_verbs: tuple[str, ...] (contract order, duplicates
      dropped). Domain membership (an agent_facing NAMED_READS key) stays the full tier's validate_persona_contracts
      check; at run time the server's own tool list is the authority.
  - file: src/persona_backends/litellm_backend.py
    action: Modify
    purpose: >-
      run_persona gains keyword `mcp_server: Callable[[], StdioServerParameters] | None = None`, a factory called only in
      the warehouse branch (StdioServerParameters named under TYPE_CHECKING only), so building the parameters never
      imports mcp for a run that names no warehouse_read. A contract with warehouse_verbs and
      mcp_server None is RunRefused ("warehouse_read needs the MCP server"); keyword `mcp_errlog: TextIO | None = None`
      (None means os.devnull, opened by a synchronous helper outside the async function, as ruff ASYNC230 forbids
      open() inside it, opened only after mcp_server() returns and closed when the bridge exits, so no handle leaks per
      run) is passed through as open_bridge's errlog. The run's wall-clock deadline is taken once,
      before the bridge opens (moved out of go()), so startup counts against max_wall_clock_seconds. After the input check
      passes (so an input_incomplete run starts no server), a contract with warehouse_verbs opens open_bridge(mcp_server(),
      verbs, startup_timeout=deadline - clock()) around the run loop: BridgeTimeout returns failure budget_exhausted
      (detail "max_wall_clock_seconds reached while the MCP server started"), and BridgeUnavailable aborts with kind
      tool_server_unavailable (header and end records written, no model call); an ImportError from the in-branch mcp or
      mcp_bridge import, or any Exception from the mcp_server() factory, aborts with that same kind (class name only),
      so an image without mcp ends with an end record and exit 4, never a traceback. The tool list is the read_input spec when
      the contract names a read_input blob, then the bridge's specs (an empty list is sent as no tools, None, never []); the opening user message keeps its read_input blob
      lines only when the contract names a blob. Tool dispatch becomes async: read_input is served as now, a named verb
      awaits Bridge.call under asyncio.wait_for(deadline - clock() measured when the call starts) (a timeout returns
      budget_exhausted, as a transport timeout does), any other name gets "error: unknown tool"; BridgeFailed aborts with
      kind tool_server_error. The turn record of the provider call that asked for the tools is written before either
      exit (budget_exhausted from a call timeout, or the tool_server_error abort): ended_at_ms is taken when the
      transport returned (not when the record is written, so a model_call row never includes warehouse latency, on the
      success path too), turns_used counts that turn, and tool_result_bytes covers the calls that finished (tool calls dispatch one at a time in tool_calls order, so
      tool_result_bytes stays a positional prefix of tool_calls), so every
      billed model call keeps its model_call row (run_persona.events, one per turn) ahead of the end record, as plan 1's
      transport paths do. A RunAborted the loop raises while the bridge is open (transport outage or exception)
      reaches run_persona's caller as itself with its own kind (open_bridge's unwrapping above), never as an
      ExceptionGroup or as tool_server_error. mcp and mcp_bridge are imported inside the warehouse branch, so a run
      that names no warehouse_read never loads them. Tool turns keep the plan-1 turn
      record shape (tool_calls names, tool_result_bytes). A tool call spends no turn (a turn is a provider attempt).
      Stays under 500 SLOC.
  - file: scripts/run_persona.py
    action: Modify
    purpose: >-
      MCP_SERVER_MODULE = "scripts.agent_sdk.mcp_server"; `server_parameters(environ=os.environ)` imports mcp inside its
      body and returns StdioServerParameters(command=sys.executable, args=["-m", MCP_SERVER_MODULE], cwd=<repo root>, env=server_env(environ)).
      `server_env(environ)` returns only the environ variables whose names start with AWS_, DUCKLAKE_ or OTL_ and the
      proxy and CA-bundle variables (HTTPS_PROXY, HTTP_PROXY, NO_PROXY and their lowercase forms, SSL_CERT_FILE,
      REQUESTS_CA_BUNDLE, CURL_CA_BUNDLE); stdio_client itself merges it over the library's default environment (HOME,
      PATH and the like). It is the reader's configuration and credentials, never an inference key or GITHUB_TOKEN; the
      allow-list stays by prefix and no variable name such as GITHUB_TOKEN is spelled as a string constant in
      scripts/run_persona.py or src/persona_backends (the persona image plan's persona-code check reads those copies;
      tests may name it). main() passes mcp_server=server_parameters, uncalled, to run_persona with the default errlog (os.devnull), so the server's
      stderr (tracebacks that can name a reader host or carry response text, and runpy's warning) never reaches the run's
      stderr or an Actions log (Decision 101); failures surface as the class-only abort kind. The server is started only
      for a contract that names warehouse_read; stdout still carries only the result. Exit 4 covers the two new abort
      kinds.
  - file: tests/persona_backends/fake_mcp_server.py
    action: Create
    purpose: >-
      A stdio MCP server for tests, run as `python -m tests.persona_backends.fake_mcp_server [mode]` from the repository
      root: scripts.agent_sdk.mcp_server.create_server(reader=<fake reader>) served through that module's _run_stdio, so
      the client meets the real server projection. The fake reader's describe() lists two agent-facing verbs (one with a
      required array argument) and one agent_facing false verb; named() returns synthetic rows, or rows past the byte
      cap in mode big. Mode crash raises in describe() (the server exits at startup); mode die exits the process on the
      first call; mode hang answers nothing after starting (initialize never returns); mode slow answers initialize and
      list_tools but named() blocks (a call never returns). Mode crash first writes the line FAKE-SERVER-STDERR-MARKER to
      stderr and, when FAKE_MCP_RAN_FILE is set in its environment, creates that file, so a test can tell a server that
      ran from one that never spawned. Synthetic values only (Decision 101). Hang, slow and die cases cost a subprocess
      plus the client's kill escalation each, so each mode is exercised by the fewest cases that pin it.
  - file: tests/persona_backends/test_mcp_bridge.py
    action: Create
    purpose: >-
      Mirror test, every case through a real subprocess of fake_mcp_server: test_offers_only_named_verbs (specs equal
      the named verbs in contract order with the server's input_schema; the unnamed and the agent_facing false verbs are
      absent); test_call_returns_rows_text; test_server_input_error_is_error_text (a schema-invalid argument returns
      "error: Input validation error..."); test_bad_json_arguments_make_no_call; test_reply_past_cap_is_truncated;
      test_missing_verb_is_unavailable (names the verb); test_server_crash_at_start_is_unavailable;
      test_spawn_failure_is_unavailable (a command that does not exist); test_startup_hang_times_out (mode hang with a
      short startup_timeout raises BridgeTimeout); test_unnamed_verb_call_makes_no_server_call;
      test_server_stderr_goes_only_to_errlog (mode crash with errlog a tmp file under capfd: the marker line is in the
      file, a positive control, and absent from the captured fd 1 and fd 2; the error raised is BridgeUnavailable with the
      FAKE_MCP_RAN_FILE present, so a spawn failure cannot satisfy it); test_server_dying_mid_run_is_bridge_failed;
      test_body_exception_leaves_unwrapped (a sentinel raised inside the open_bridge context is caught as itself, not a
      BaseExceptionGroup, and not BridgeFailed); test_startup_errors_leave_unwrapped (BridgeTimeout and
      BridgeUnavailable are caught by an exact type check, not only pytest.raises, which matches inside groups). Every
      branch the build writes in mcp_bridge.py and litellm_backend.py has a listed or added case (validate_test_coverage's
      100% per-file line floor, full tier); a branch no case can reach is not written.
  - file: tests/persona_backends/test_contract.py
    action: Modify
    purpose: >-
      warehouse_read:x leaves the refused-by-name parametrisation and gets test_warehouse_read_loads_verbs (order kept,
      duplicates dropped) and test_warehouse_read_naming_read_input_is_refused; test_capability_gate_matches_index
      derives BUILT from every capability row whose litellm owning_item is T4.32:c1, of any binding kind (red before
      BUILT gains warehouse_read).
  - file: tests/persona_backends/test_litellm_backend.py
    action: Modify
    purpose: >-
      On the fake transport and the fake stdio server: test_warehouse_tool_turn_returns_server_text (a tool call to a
      named verb gets the server's rows text as its tool message, and the turn record lists the verb);
      test_offered_tools_are_read_input_then_named_verbs; test_warehouse_without_server_is_refused;
      test_input_incomplete_starts_no_server; test_unavailable_server_aborts_before_any_call (kind
      tool_server_unavailable, zero transport calls, end record aborted); test_server_failure_mid_run_aborts (kind
      tool_server_error; the transport called exactly once and a turn record listing the verb written before the end
      record); test_tool_turn_ended_at_is_transport_return (the wall fake, run_persona's
      wall injectable that stamps ended_at_ms, not the deadline clock, advanced inside the warehouse call through a
      monkeypatched wrapper around Bridge.call, shows the turn record's ended_at_ms equals the time the transport returned, before the warehouse call); test_startup_hang_returns_budget_exhausted (mode hang, a contract copy with
      max_wall_clock_seconds 1: the run returns budget_exhausted within seconds, with no transport call);
      test_warehouse_call_past_deadline_returns_budget_exhausted (mode slow, a roomy max_wall_clock_seconds, and
      asyncio.wait_for monkeypatched to time out the bridge call as test_wait_for_timeout_returns_budget_exhausted does,
      so startup time cannot satisfy it: the fake transport called exactly once, a turn record whose tool_calls lists the
      verb ahead of the end record, failure budget_exhausted, and a detail that is not the startup detail);
      test_transport_outage_with_bridge_open_aborts (the fake transport raises an outage after the bridge opened:
      RunAborted kind outage, not an ExceptionGroup and not tool_server_error); test_contract_without_read_input_blob_offers_no_read_input_tool (no
      read_input tool and no blob lines in the opening message); a contract naming no tools sends tools None; a contract without warehouse_read starts no server
      (an mcp_server factory that raises if called still succeeds); test_errlog_devnull_closed_after_run (the handle
      the helper opened, recorded through a monkeypatched helper, is closed after a warehouse run);
      test_factory_failure_aborts_unavailable (a factory raising ImportError aborts with kind tool_server_unavailable
      and an end record, and the recording devnull helper was never called); test_unavailable_server_aborts_before_any_call
      also asserts the devnull handle it recorded is closed, so the N3 open-after-factory, close-on-every-exit order is
      pinned on the abort paths too.
  - file: tests/test_run_persona.py
    action: Modify
    purpose: >-
      test_server_module_matches_index_binding (MCP_SERVER_MODULE as a path, scripts/agent_sdk/mcp_server.py, equals the
      warehouse_read row's binding server in executor-personas.yaml); test_server_env_withholds_inference_keys (an
      environ holding every kind: secret row's non-null variable in docs/contracts/project-configuration.yaml (read from
      the file: DEEPSEEK_API_KEY, ANTHROPIC_API_KEY, CLAUDE_CODE_OAUTH_TOKEN, GITHUB_TOKEN and
      WORKFLOW_DISPATCH_APP_PRIVATE_KEY today) plus AWS_ACCESS_KEY_ID yields exactly {AWS_ACCESS_KEY_ID});
      test_server_parameters_run_the_module_from_the_root; test_main_passes_no_server_stderr (server_parameters
      monkeypatched to the fake server in mode crash with FAKE_MCP_RAN_FILE set, main() run under capfd on a contract
      copy naming warehouse_read: exit 4, abort kind tool_server_unavailable, the ran file exists, and
      FAKE-SERVER-STDERR-MARKER is absent from captured fd 1 and fd 2; this also proves a warehouse run's abort exits
      4, not a traceback with exit 1); test_non_warehouse_run_imports_no_mcp (a fresh subprocess sets sys.modules["mcp"]
      to None, then runs scripts/run_persona.py through runpy on the fixture contract with an incomplete input: exit 0,
      result input_incomplete, the events file's turns empty; then a second leg in a fresh subprocess with the same
      block sets scripts.llm.litellm_transport.acomplete to a scripted read_input-then-final transport before runpy
      (runpy reuses the module already in sys.modules) and runs the good input: exit 0, outcome success, so the shared
      tool-dispatch path is mcp-free too; red while main() builds the parameters eagerly); the isolated-mode subprocess refusal case names
      read_repo in place of warehouse_read:x.
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's e01-e02 blocks (docs/plans/approved/run-persona-mcp-bridge.yaml): the amendment_log row and
      the run_persona.result sentence on what the litellm backend builds.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's e03-e04 blocks: one amendment_log row, and coupling PC-01's description gains one sentence,
      appended to its last line (no new line; the file is at 498 of 500 effective lines), recording scripts/run_persona.py
      handing the MCP server it starts for a warehouse_read run the AWS_, DUCKLAKE_, OTL_ and proxy variables, so such a
      run needs a host holding an AWS identity with a reader grant (Decision 212 clause 3; Decision 263 clause 2 gives the
      persona-verdict role none today); no port row is added.
bundled_recommendations:
  - rec-5267
followon_recs:
  - rec-5312
infrastructure_dependencies: []
acceptance_criteria:
  - A contract naming warehouse_read:<verb> runs with the model offered exactly the named verbs, with the server's input schemas, and a tool call to one returns the server's text as the tool message.
  - The bridge never offers or calls a verb the contract does not name, refuses a run whose named verb the server does not list, aborts (exit 4) when the server cannot spawn, start or keep its session, and a server startup that outlasts the run's wall clock returns budget_exhausted.
  - The server's stderr never reaches the run's stdout or stderr.
  - A run whose contract names no warehouse_read imports no mcp module, entry point included.
  - The server is started only for a contract that names warehouse_read, and only after the input check passes.
  - The server's environment carries AWS_, DUCKLAKE_ and OTL_ variables and the proxy and CA-bundle variables, and no inference key or GITHUB_TOKEN.
  - BUILT holds read_input and warehouse_read, equal to every T4.32:c1-owned binding in the live index; src/persona_backends imports nothing under scripts.
  - executor-personas.yaml and ports.yaml carry the sidecar's four blocks word for word, and the persona contract and ports checks stay green.
  - rec-5267 is closed by the build's merge (Resolves trailer).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The MCP client against a real subprocess of the fake stdio server (built on the real server module).
    command: bin/venv-python -m pytest tests/persona_backends/test_mcp_bridge.py -q
    expected: Exit 0, every node passes. Red before (the module and the test are absent).
    fix_if: >-
      An unnamed verb offered, an error result raised instead of returned as text, or a crash not reported as
      BridgeUnavailable or BridgeFailed: fix the bridge, never the fake server or the expectation.
    hermetic: false
    graduation: graduate
    graduation_check_id: run-persona-mcp-bridge-client
  - step: 2
    phase: pre-deploy
    action: The capability gate against the live index, and the run loop's warehouse tool turns, refusals and aborts.
    command: bin/venv-python -m pytest tests/persona_backends/test_contract.py tests/persona_backends/test_litellm_backend.py -q
    expected: >-
      Exit 0, every node passes. Red before: test_capability_gate_matches_index (widened) fails while BUILT lacks
      warehouse_read, and the new warehouse cases fail while run_persona has no mcp_server argument.
    fix_if: >-
      A server started for a contract without warehouse_read or before the input check, or a tool call spending a turn:
      fix the backend.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The kept shards run-persona-litellm-backend-contract-tool-events and run-persona-litellm-backend-loop already rerun
      these two files' standing nodes, and the fast tier runs both files whole.
  - step: 3
    phase: pre-deploy
    action: The entry point's server parameters, the environment allow-list and the module-to-binding tie.
    command: bin/venv-python -m pytest tests/test_run_persona.py -q
    expected: Exit 0, every node passes. Red before (server_parameters and server_env are absent).
    fix_if: An inference key or GITHUB_TOKEN in the server env, or a module that differs from the binding; fix the entry point.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The kept shard run-persona-entry-point already reruns this file's standing node, and the fast tier runs it whole.
  - step: 4
    phase: pre-deploy
    action: The import boundary still holds (the new module imports mcp, never scripts).
    command: bin/venv-python -m pytest tests/persona_backends/test_package_boundary.py -q && bin/venv-python -m scripts.import_governance --check-contracts
    expected: Exit 0 from both; the import-linter run lists the src.persona_backends contract as kept.
    expected_literals:
      - src.persona_backends imports nothing under scripts
    fix_if: A src module importing scripts -- inject the dependency from scripts/run_persona.py instead.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The pytest half is a standing guard through the fast tier's test run and the import-linter half is already a
      standing check (scripts.import_governance), so a shard would duplicate both.
  - step: 5
    phase: pre-deploy
    action: No artifact bundles a changed path and no deploy channel watches one (Decision 249 clause 2).
    command: >-
      bin/venv-python -c "import subprocess;from scripts.convergence_health.code_drift import PROD_SOURCE_PATHSPECS as P,DUCKLAKE_SOURCE_PATHSPECS as D;from scripts.lambda_manifest import compute_affected_artifacts as ca;import fnmatch;run=lambda a:subprocess.run(a,capture_output=True,text=True,check=True).stdout.split();mb=subprocess.run(['git','merge-base','HEAD','origin/main'],capture_output=True,text=True,check=True).stdout.strip();ch=sorted(set(run(['git','diff','--name-only',mb]))|set(run(['git','ls-files','--others','--exclude-standard'])));hit=lambda f,g:f==g or f.startswith(g.rstrip('/')+'/') or fnmatch.fnmatch(f,g);hits=sorted({f for f in ch for g in P+D if hit(f,g)});aff=ca(ch);print('changed',len(ch),'hits',hits,'affected',aff);assert 'src/persona_backends/mcp_bridge.py' in ch and 'scripts/run_persona.py' in ch;assert not hits and aff=={};print('NO_DEPLOY_TRIGGER_OK')"
    expected: >-
      Exit 0; the change list holds the bridge and the entry point, no changed path matches a PROD_SOURCE_PATHSPECS or
      DUCKLAKE_SOURCE_PATHSPECS entry, affected is empty, and the last line is NO_DEPLOY_TRIGGER_OK.
    fix_if: An artifact is affected or a pathspec hits; STOP to this planning thread, never deploy from this plan.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      It reads this branch's transient diff against the merge-base, empty on main; the data-pipeline exclude is held by
      test_package_boundary's test_excluded_from_data_pipeline in every tier.
  - step: 6
    phase: pre-deploy
    action: The placed contract text and the checks that read the two contracts.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug run-persona-mcp-bridge && bin/venv-python -c
      "from scripts.checks.contracts.validate_persona_contracts import validate_persona_contracts as a;
      from scripts.checks.contracts.validate_persona_contract_binding import validate_persona_contract_binding as b;
      from scripts.checks.contracts.validate_ports_contract import validate_ports_contract as c;
      f=[];a(f);b(f);c(f);print(*f,sep='\n');print(f'contract checks: {len(f)} failures');assert not f"
    expected: The verify run passes and the last line reports 0 failures.
    expected_literals:
      - 'contract checks: 0 failures'
    fix_if: >-
      A verify mismatch: place the block word for word (never edit the sidecar). A moved before-text after the rebase:
      STOP to this planning thread.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The three checks already run in every tier and the approved-text verify runs in validate_merge_step; a shard would
      duplicate them.
  - step: 7
    phase: pre-deploy
    action: >-
      Live read through the real server: the bridge, with run_persona.py's server parameters and this session's
      proxy-signed reader access (Decision 256), lists recs_by_ids and reads rec-5267.
    command: |-
      bin/venv-python - <<'PY'
      import asyncio, json, sys
      from scripts.run_persona import server_parameters
      from src.persona_backends.mcp_bridge import open_bridge
      async def main():
          async with open_bridge(server_parameters(), ("recs_by_ids",), errlog=sys.stderr, startup_timeout=300) as bridge:
              names = [spec["function"]["name"] for spec in bridge.tool_specs()]
              reply = await bridge.call("recs_by_ids", json.dumps({"ids": "rec-5267"}))
          print(names, reply[:200])
          assert names == ["recs_by_ids"] and "rec-5267" in reply and not reply.startswith("error:")
          print("LIVE_BRIDGE_OK")
      asyncio.run(main())
      PY
    expected: The probe prints the offered tool names (recs_by_ids only) and a reply naming rec-5267, then LIVE_BRIDGE_OK.
    fix_if: >-
      An "error: Input validation error" reply is an argument-shape fault in this probe (recs_by_ids takes ids as one
      comma-joined string), not an environment fault. A BridgeUnavailable at startup with the reader's failure on the
      probe's stderr means the allow-listed environment lacks a variable the reader needs: add its name and its test
      case to server_env, never pass the full environment.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Needs live reader credentials, which CI's fast tier does not hold; the hermetic legs are steps 1-3.
  - step: 8
    phase: pre-deploy
    action: >-
      After the rebase onto origin/main, ports.yaml (at 498 of 500 effective lines when planned; eleven unbuilt plans also
      scope it) stays within its 500-line cap with e03's line placed.
    command: >-
      bin/venv-python -c "from pathlib import Path;from scripts.checks.structural._classify import effective_lines as e;
      n=e(Path('docs/contracts/ports.yaml').read_text(encoding='utf-8'));print(f'ports.yaml effective lines: {n}');
      assert n<=500;print('PORTS_CAP_OK')"
    expected: The count is at most 500 and the last line is PORTS_CAP_OK.
    fix_if: >-
      Over 500 because other plans landed first: the sidecar's words cannot change, so STOP to this planning thread for a
      relief amendment; never raise the budget or reflow approved text.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The structural size-limit check already holds ports.yaml to its cap in every tier; this step only orders the
      measurement after the rebase so the build stops early.
  - step: 9
    phase: pre-deploy
    action: >-
      Pre-handoff full tier on the committed, rebased tree (Decision 163), read through its evidence file. It runs past
      the 10-minute foreground cap: start it backgrounded with a 2 h limit from the top-level session (AGENTS.md).
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports the full tier passed on HEAD's tree.
    fix_if: Any failure; fix and re-run both from the start (timeout_disposition blocked).
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: rec-5267 is closed by the build's squash-merge (its Resolves trailer and ci.yml's closure job).
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c;rows,missing=c.fetch_recs_by_ids(c.make_reader(),['rec-5267']);
      print([(r['id'],r['status']) for r in rows],missing);assert rows and rows[0]['status']=='closed';print('REC_5267_CLOSED')"
    expected: The row reads status closed and the last line is REC_5267_CLOSED.
    fix_if: >-
      Still open after the merge: check ci.yml's closure job on the merge commit and the Resolves trailer; if the job did
      not run, close it with update_rec naming the merge SHA (closing_sha), never by editing a cache.
