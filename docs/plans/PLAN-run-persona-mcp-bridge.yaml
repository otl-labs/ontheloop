slug: run-persona-mcp-bridge
intent: >-
  Build the warehouse_read consumption leg of the run_persona litellm backend (T4.32 c1, T4.10a c7's consumption leg;
  rec-5267), plan 4 of the four plans PLAN-run-persona-litellm-backend split into. A stdio MCP client in
  src/persona_backends/mcp_bridge.py starts the one On The Loop MCP server (scripts/agent_sdk/mcp_server.py) once per
  run whose contract names warehouse_read:<named_read>, offers the model only the named reads the contract lists (with
  the server's own input schemas), and returns each call's text to the tool loop; scripts/run_persona.py injects the
  server's launch parameters (the module named by the index binding, run from the repository root, with an environment
  that carries the reader's configuration and credentials and never an inference key), so src/persona_backends still
  imports nothing under scripts. The capability gate admits warehouse_read, test_capability_gate_matches_index counts
  every T4.32:c1-owned binding, and run_persona.result says what the backend builds. Proven against a fake stdio server
  built on the real server module with a fake reader. Serves NS.3: verdicts run on GitHub from main's definition.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-run-persona-mcp-bridge.yaml
phase: >-
  T4.32 c1 (backend leg, part: the warehouse_read MCP consumption the item's T4.10a c7 annotation hands to c1); closes
  no criterion (c1's credential, chain, image and adapter legs stay open). T4.32 is in_progress and the backend plan's
  build merged (#2132, eed2f6e4). src/persona_backends is excluded from the data-pipeline bundle and scripts/run_persona.py
  is in no bundle, so nothing deploys (V2).
closes_criteria: []
cites: [dec:84, dec:205, dec:206, dec:212, dec:246, dec:256, dec:263]
scope:
  - file: src/persona_backends/mcp_bridge.py
    action: Create
    purpose: >-
      The stdio MCP client. `open_bridge(server: mcp.client.stdio.StdioServerParameters, verbs: tuple[str, ...])` is an
      async context manager yielding a Bridge: it runs stdio_client and ClientSession, initialize() and list_tools(), and
      raises BridgeUnavailable (class name only in its text, Decision 101) when the server cannot start or initialise, or
      when a named verb is not among the listed tools (naming the verb). `Bridge.tool_specs()` returns one OpenAI-style
      function spec per named verb, in contract order: name = the verb, description and parameters = the listed tool's
      description and input_schema, verbatim; tools the server lists but the contract does not name are never offered
      (Decision 206 clause 1). `await Bridge.call(name, arguments_json) -> str`: arguments that are not a JSON object
      return "error: ..." text without a server call; a result with is_error returns "error: " + its text; otherwise the
      text contents joined by newlines; any reply past read_input.READ_CAP_BYTES is cut at that byte count (on a
      character boundary) and ends "[truncated: <total> bytes]". A failure of the session itself (closed stream, an
      McpError, the process gone) raises BridgeFailed (class name only). Names no persona id and no scripts path.
  - file: src/persona_backends/contract.py
    action: Modify
    purpose: >-
      BUILT = frozenset({"read_input", "warehouse_read"}). read_input:<blob> keeps its input_schema property check;
      warehouse_read:<verb> needs a non-empty parameter that is not "read_input" (the backend's own tool name), else
      RunRefused naming the capability. LoadedContract gains warehouse_verbs: tuple[str, ...] (contract order, duplicates
      dropped). Domain membership (an agent_facing NAMED_READS key) stays the full tier's validate_persona_contracts
      check; at run time the server's own tool list is the authority.
  - file: src/persona_backends/litellm_backend.py
    action: Modify
    purpose: >-
      run_persona gains keyword `mcp_server: StdioServerParameters | None = None`. A contract with warehouse_verbs and
      mcp_server None is RunRefused ("warehouse_read needs the MCP server"). After the input check passes (so an
      input_incomplete run starts no server), a contract with warehouse_verbs opens open_bridge(mcp_server, verbs) around
      the run loop; BridgeUnavailable aborts with kind tool_server_unavailable (header and end records written, no model
      call). The tool list is the read_input spec when the contract names a read_input blob, then the bridge's specs.
      Tool dispatch becomes async: read_input is served as now, a named verb awaits Bridge.call under
      asyncio.wait_for(remaining wall clock) (a timeout returns budget_exhausted, as a transport timeout does), any other
      name gets "error: unknown tool"; BridgeFailed aborts with kind tool_server_error. Tool turns keep the plan-1 turn
      record shape (tool_calls names, tool_result_bytes). A tool call spends no turn (a turn is a provider attempt).
      Stays under 500 SLOC.
  - file: scripts/run_persona.py
    action: Modify
    purpose: >-
      MCP_SERVER_MODULE = "scripts.agent_sdk.mcp_server"; `server_parameters(environ=os.environ)` returns
      StdioServerParameters(command=sys.executable, args=["-m", MCP_SERVER_MODULE], cwd=<repo root>, env=server_env(environ)).
      `server_env(environ)` is the mcp library's get_default_environment() plus the variables whose names start with
      AWS_, DUCKLAKE_ or OTL_ and the proxy and CA-bundle variables (HTTPS_PROXY, HTTP_PROXY, NO_PROXY and their lowercase
      forms, SSL_CERT_FILE, REQUESTS_CA_BUNDLE, CURL_CA_BUNDLE): the reader's configuration and credentials, never an
      inference key or GITHUB_TOKEN. main() passes mcp_server=server_parameters() to run_persona; the server is started
      only for a contract that names warehouse_read. The server's stderr is the entry point's stderr; stdout still
      carries only the result. Exit 4 covers the two new abort kinds.
  - file: tests/persona_backends/fake_mcp_server.py
    action: Create
    purpose: >-
      A stdio MCP server for tests, run as `python -m tests.persona_backends.fake_mcp_server [mode]` from the repository
      root: scripts.agent_sdk.mcp_server.create_server(reader=<fake reader>) served through that module's _run_stdio, so
      the client meets the real server projection. The fake reader's describe() lists two agent-facing verbs (one with a
      required array argument) and one agent_facing false verb; named() returns synthetic rows, or rows past the byte
      cap in mode big. Mode crash raises in describe() (the server exits at startup); mode die exits the process on the
      first call. Synthetic values only (Decision 101).
  - file: tests/persona_backends/test_mcp_bridge.py
    action: Create
    purpose: >-
      Mirror test, every case through a real subprocess of fake_mcp_server: test_offers_only_named_verbs (specs equal
      the named verbs in contract order with the server's input_schema; the unnamed and the agent_facing false verbs are
      absent); test_call_returns_rows_text; test_server_input_error_is_error_text (a schema-invalid argument returns
      "error: Input validation error..."); test_bad_json_arguments_make_no_call; test_reply_past_cap_is_truncated;
      test_missing_verb_is_unavailable (names the verb); test_server_crash_at_start_is_unavailable;
      test_server_dying_mid_run_is_bridge_failed.
  - file: tests/persona_backends/test_contract.py
    action: Modify
    purpose: >-
      warehouse_read:x leaves the refused-by-name parametrisation and gets test_warehouse_read_loads_verbs (order kept,
      duplicates dropped) and test_warehouse_read_naming_read_input_is_refused; test_capability_gate_matches_index
      derives BUILT from every capability row whose litellm owning_item is T4.32:c1, of any binding kind (red before
      BUILT gains warehouse_read).
  - file: tests/persona_backends/test_litellm_backend.py
    action: Modify
    purpose: >-
      On the fake transport and the fake stdio server: test_warehouse_tool_turn_returns_server_text (a tool call to a
      named verb gets the server's rows text as its tool message, and the turn record lists the verb);
      test_offered_tools_are_read_input_then_named_verbs; test_warehouse_without_server_is_refused;
      test_input_incomplete_starts_no_server; test_unavailable_server_aborts_before_any_call (kind
      tool_server_unavailable, zero transport calls, end record aborted); test_server_failure_mid_run_aborts (kind
      tool_server_error); test_contract_without_read_input_blob_offers_no_read_input_tool; a contract without
      warehouse_read starts no server (mcp_server pointing at a command that does not exist still succeeds).
  - file: tests/test_run_persona.py
    action: Modify
    purpose: >-
      test_server_module_matches_index_binding (MCP_SERVER_MODULE as a path, scripts/agent_sdk/mcp_server.py, equals the
      warehouse_read row's binding server in executor-personas.yaml); test_server_env_withholds_inference_keys (an
      environ holding DEEPSEEK_API_KEY, ANTHROPIC_API_KEY, GITHUB_TOKEN and AWS_ACCESS_KEY_ID yields an env with only the
      last); test_server_parameters_run_the_module_from_the_root; the isolated-mode subprocess refusal case names
      read_repo in place of warehouse_read:x.
  - file: docs/contracts/executor-personas.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's e01-e02 blocks (docs/plans/approved/run-persona-mcp-bridge.yaml): the amendment_log row and
      the run_persona.result sentence on what the litellm backend builds.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's e03-e04 blocks: one amendment_log row, and coupling PC-01's description gains one sentence,
      appended to its last line (no new line; the file is at 498 of 500 effective lines), recording scripts/run_persona.py
      handing the MCP server it starts for a warehouse_read run the AWS_, DUCKLAKE_, OTL_ and proxy variables, so such a
      run needs a host holding an AWS identity with a reader grant (Decision 212 clause 3; Decision 263 clause 2 gives the
      persona-verdict role none today); no port row is added.
