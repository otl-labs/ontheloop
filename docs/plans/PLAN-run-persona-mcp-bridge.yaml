execution_steps:
  - Read executor-personas.yaml (run_persona, capability_vocabulary.warehouse_read), scripts/agent_sdk/mcp_server.py and plan 1's src/persona_backends.
  - Write tests/persona_backends/fake_mcp_server.py, then src/persona_backends/mcp_bridge.py with tests/persona_backends/test_mcp_bridge.py, red first.
  - Modify src/persona_backends/contract.py and litellm_backend.py with their test changes, red first.
  - Modify scripts/run_persona.py and tests/test_run_persona.py.
  - Place the sidecar's four blocks ({{DATE}} = build date) in executor-personas.yaml and ports.yaml.
  - Run bin/venv-python -m scripts.validate --pre and fix.
  - git add the new files.
  - Execute Verification Plan steps 1-7 -- run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
  - >-
    CLOSURE, each outcome reported separately (implement skill Commit Flows; docs/contracts/git-ops.yaml
    handoff_sequence): bin/venv-python -m scripts.session.github_readiness; the Verification Graduation walk writes the
    run-persona-mcp-bridge-client shard; set implementation_declared: true in this plan; commit
    (feat(run-persona-mcp-bridge): ...); git fetch origin main && git rebase origin/main; VP step 8 on that committed,
    rebased tree; postflight evidence; push; open the PR and report it only with the returned PR number; subscribe; on
    green CI squash-merge with "Resolves: rec-5267" in the commit body. No roadmap edit (T4.32 c1 stays open).
  - 'Report: what was implemented, verification results, and anything UNPROVEN.'
rollback: >-
  Revert the build commit: no persona contract names warehouse_read, so nothing calls the bridge, no stored row or
  deployed artifact depends on it, and the contract sentences revert with it.
