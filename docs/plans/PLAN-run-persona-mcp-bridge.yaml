    Place every sidecar block word for word ({{DATE}} filled with the build date); never edit the sidecar (Decision 246).
    executor-personas.yaml and ports.yaml get no other edit. If the rebase moves a block's before text (plans 2 and 3
    of this split, or another unbuilt ports.yaml plan, landed first), STOP to this planning thread.
  - >-
    src/persona_backends imports nothing under scripts (the .importlinter contract); the bridge takes the server's
    launch parameters as an argument. No code names a registered persona id or contract path (implementation_binding).
  - >-
    The server's environment is the name allow-list in scripts/run_persona.py, never os.environ whole and never an
    inference key variable or GITHUB_TOKEN (Decision 205 clause 2). The server's own stderr goes only to the injected
    errlog (os.devnull from the entry point); bridge error text reaching the model, the events file or the run's stderr
    names an exception class only (Decision 101).
  - >-
    No telemetry row, writer call or GitHub API call; the only AWS reach is the server's own reader reads, and only in
    VP step 7's live probe. Leave scripts/agent_sdk/, scripts/llm/ and the verdict chain's paths untouched.
  - Every module stays under 500 SLOC (Decision 128); no budget raise.
  - Public repository (Decision 101) -- fixtures are synthetic; no key, account id or hostname anywhere.
  - No rescue agents or workaround loops (Decision 55); never skip, disable or quarantine a test (Decision 235).
