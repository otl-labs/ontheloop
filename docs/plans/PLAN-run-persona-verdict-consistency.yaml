acceptance_criteria:
  - >-
    On a fixture contract with a rule, the litellm backend returns schema_invalid, never the success, when every
    terminal turn contradicts the rule, returns the success when a repair turn fixes the verdict within max_revisions,
    and passes a failure value through unchecked; a contract without a rule behaves as before
    (tests/persona_backends/test_verdict_consistency.py).
  - >-
    verdict.expected gives the first holding case's verdict, else otherwise, on these cases: findings[].severity in
    [blocking] with one blocking finding (REVISE) and with nits only (PROCEED); an ordered three-case rule where a
    BLOCK-severity element and a CONFLICT row both hold (the first case wins), an array-only condition with one element
    (the second case), and a dotted roadmap.rows path holding only non-CONFLICT rows (otherwise); a missing path (otherwise).
  - >-
    validate_persona_contracts refuses a malformed rule, an array, field or in value that does not resolve in
    output_schema, a rule whose verdicts differ from the enum, a rule naming a value absent from the prose verdict_rule,
    and a compute_plane contract carrying a rule; the real tree (no rule yet) and the fixture tree (with a rule) stay green.
  - Every new line of verdict.py, contract.py and output.py is covered by its own mirror test (validate_test_coverage).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The evaluator and the repair loop with a rule (fixture copies on the fake transport).
    command: bin/venv-python -m pytest tests/persona_backends/test_verdict.py tests/persona_backends/test_verdict_consistency.py -q
    expected: Exit 0, every node passes. Red before (the test files and src/persona_backends/verdict.py are absent).
    fix_if: >-
      A contradictory success returned, a contradiction not counted as a revision, or a failure value verdict-checked:
      fix the backend, never the fake or the expectation.
    hermetic: false
    graduation: graduate
    graduation_check_id: run-persona-verdict-consistency
  - step: 2
    phase: pre-deploy
    action: Contract loading and the output check with and without a rule, and plan 1's suites.
    command: >-
      bin/venv-python -m pytest tests/persona_backends/test_contract.py tests/persona_backends/test_output.py
      tests/persona_backends/test_litellm_backend.py tests/test_run_persona.py -q
    expected: Exit 0, every node passes, the new rule nodes included.
    fix_if: A regression in plan 1's behaviour; fix the change, never loosen an assertion (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Existing mirror suites the full tier and the diff-selected --pre run execute; a shard would duplicate them.
  - step: 3
    phase: pre-deploy
    action: The validator's grammar rules, one red test each, and the real and fixture trees green.
    command: >-
      bin/venv-python -m pytest tests/checks/contracts/test_validate_persona_contracts.py
      tests/checks/contracts/test_validate_persona_contract_binding.py tests/persona_contracts -q
    expected: >-
      Exit 0, every node passes, including test_red_rule for the six verdict_rule_* rules (17 ids: one per
      MALFORMED_RULES entry plus the five others) and
      test_compute_plane_contract_with_verdict_rule_is_refused.
    fix_if: >-
      A red rule that does not fire: fix the validator. The real or fixture tree red: fix the validator or the fixture's
      rule, never a mutator's expectation.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The parametrized red-rule suite is the standing guard; the full tier and the diff-selected --pre run execute it; a
      shard would duplicate it.
  - step: 4
    phase: pre-deploy
    action: The real contracts are untouched and the contract checks stay green.
    command: >-
      git diff --quiet "$(git merge-base HEAD origin/main)" -- docs/contracts/ && test -z "$(git ls-files --others
      --exclude-standard docs/contracts/)" && bin/venv-python -m scripts.persona_contracts.render --check &&
      bin/venv-python -c "from scripts.checks.contracts.validate_persona_contracts import validate_persona_contracts as a;
      from scripts.checks.contracts.validate_persona_contract_binding import validate_persona_contract_binding as b;
      f=[];a(f);b(f);print(*f,sep='\n');print(f'contract checks: {len(f)} failures');assert not f"
    expected: >-
      No change under docs/contracts/, the render check prints RENDER-CHECK OK 5, and the last line reports 0 failures.
    expected_literals:
      - 'RENDER-CHECK OK 5'
      - 'contract checks: 0 failures'
    fix_if: >-
      A docs/contracts change: revert it (contract text is plan 2b's approved text). A binding failure: a
      src/persona_backends module names a persona id.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The two contract checks and the render rule run in every tier; the no-contract-change leg reads this branch's
      transient diff, which is empty on main.
  - step: 5
    phase: pre-deploy
    action: >-
      No Lambda artifact bundles a changed path and no PROD or DUCKLAKE source pathspec watches one (Decision 249 clause
      2). The persona image channel (PLAN-persona-image-channel, unbuilt) is not checked: if it builds first and its
      build.copy holds src/persona_backends, merging this plan republishes the image through that governed channel, which
      is its intended path, never a deploy from this plan.
    command: >-
      bin/venv-python -c "import subprocess;from scripts.convergence_health.code_drift import PROD_SOURCE_PATHSPECS as P,DUCKLAKE_SOURCE_PATHSPECS as D;from scripts.lambda_manifest import compute_affected_artifacts as ca;import fnmatch;run=lambda a:subprocess.run(a,capture_output=True,text=True,check=True).stdout.split();mb=subprocess.run(['git','merge-base','HEAD','origin/main'],capture_output=True,text=True,check=True).stdout.strip();ch=sorted(set(run(['git','diff','--name-only',mb]))|set(run(['git','ls-files','--others','--exclude-standard'])));hit=lambda f,g:f==g or f.startswith(g.rstrip('/')+'/') or fnmatch.fnmatch(f,g);hits=sorted({f for f in ch for g in P+D if hit(f,g)});aff=ca(ch);print('changed',len(ch),'hits',hits,'affected',aff);assert 'src/persona_backends/verdict.py' in ch;assert not hits and aff == {};print('NO_DEPLOY_TRIGGER_OK')"
    expected: >-
      Exit 0; the change list holds src/persona_backends/verdict.py, no changed path matches a PROD or DUCKLAKE source
      pathspec, affected is empty, and the last line is NO_DEPLOY_TRIGGER_OK.
    fix_if: An artifact is affected or a pathspec hits; STOP to this planning thread, never deploy from this plan.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      It reads this branch's transient diff against the merge-base, which is empty on main; plan 1's
      test_package_boundary holds the data-pipeline exclude in every tier.
  - step: 6
    phase: pre-deploy
    action: Pre-handoff full tier on the committed, rebased tree (Decision 163), read through its evidence file.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports the full tier passed on HEAD's tree (validate_test_coverage included).
    fix_if: >-
      Any failure; fix and re-run both from the start (timeout_disposition blocked). Main reds owned elsewhere (rec-5247,
      rec-5276) are deferred, never fixed here.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: src/persona_backends/verdict.py
    behavior: The expected verdict per ordered case, the holding element named in the reason, no element on a broken path, no error on agreement.
    verification_step: 1
    test_selector: tests/persona_backends/test_verdict.py
    red_green_expectation: red before (module and test absent), green after.
  - source: src/persona_backends/output.py
    behavior: A contradictory success gives the verdict error; a failure value is never verdict-checked; no rule, no check.
    verification_step: 2
    test_selector: tests/persona_backends/test_output.py
    red_green_expectation: red before (the success passes today), green after.
  - source: src/persona_backends/output.py
    behavior: >-
      In the run loop, a contradiction is a repair turn and past max_revisions schema_invalid; a repaired verdict returns
      the success; a failure value passes unchecked; a contract without a rule is unchanged.
    verification_step: 1
    test_selector: tests/persona_backends/test_verdict_consistency.py
    red_green_expectation: red before (absent; the contradictory success is returned today), green after.
  - source: src/persona_backends/contract.py
    behavior: LoadedContract carries the rule (None when absent); a malformed rule is refused.
    verification_step: 2
    test_selector: tests/persona_backends/test_contract.py
    red_green_expectation: red before (absent), green after.
  - source: scripts/checks/contracts/validate_persona_contracts.py
    behavior: The six grammar rules (test_red_rule[verdict_rule_*]) and the compute-plane refusal.
    verification_step: 3
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py
    red_green_expectation: red before (no rule is checked; the new red-rule ids and this node fail), green after.
  - source: scripts/persona_contracts/schema.py
    behavior: PersonaContract accepts the verdict_consistency mapping (the fixture tree's rule-bearing contract validates).
    verification_step: 3
    test_selector: tests/checks/contracts/test_validate_persona_contracts.py::test_fixture_tree_green
    red_green_expectation: red before (the fixture's rule makes the contract off its schema), green after.
