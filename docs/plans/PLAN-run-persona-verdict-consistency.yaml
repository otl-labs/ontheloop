    action: Modify
    purpose: >-
      Regenerated by `bin/venv-python -m scripts.persona_contracts.render --write code_reviewer` after c01-c04; the
      result equals sidecar blocks rc01-rc02 (contract version line, schema_invalid line). Never hand-edited.
  - file: docs/contracts/personas/rendered/plan_critic.txt
    action: Modify
    purpose: Regenerated by render --write plan_critic; equals sidecar blocks rp01-rp02.
  - file: docs/contracts/personas/rendered/decision_scout.txt
    action: Modify
    purpose: Regenerated by render --write decision_scout; equals sidecar blocks rd01-rd02.
  - file: scripts/persona_contracts/schema.py
    action: Modify
    purpose: >-
      Sidecar block s01 only: PersonaContract gains `verdict_consistency: dict[str, Any] | None = None` after
      skill_tether. It is a bound file, so no other edit here; the grammar is checked in the validator.
  - file: scripts/checks/contracts/validate_persona_contracts.py
    action: Modify
    purpose: >-
      `_verdict_rule_failures(persona, kind, raw, contract)` called from _contract_failures (no jsonschema import; fast
      tier). A kind verdict contract without verdict_consistency fails "lacks verdict_consistency"; a compute_plane one
      carrying it fails "verdict_consistency on a compute_plane contract". Shape: exactly the keys cases (non-empty list)
      and otherwise (str); each case exactly verdict (str) and any (non-empty list); each condition exactly array (str)
      plus optionally field and in together (field str, in a non-empty list of str), else "verdict_consistency is
      malformed". array is a dotted path walked through output_schema properties, every step an object property and the
      last of type array, else "array <path> is not an array of output_schema"; field is a property of that array's
      items carrying an enum, else "field <f> is not an enum property of <path>'s items"; each in value lies in that
      enum, else "in value <v> is outside <path>[].<f>'s enum". The case verdicts plus otherwise, as a list, hold each
      value of output_schema's verdict enum exactly once, else "verdict_consistency verdicts differ from the verdict
      enum". Every verdict and in value appears as a whole word (re \b) in skill_tether.verdict_rule, else
      "verdict_consistency names <v>, absent from skill_tether.verdict_rule". The module docstring names the rule.
  - file: src/persona_backends/contract.py
    action: Modify
    purpose: >-
      LoadedContract gains `verdict_consistency: dict[str, Any] | None` (the raw mapping, None when absent). load()
      refuses (RunRefused "verdict_consistency is malformed") a present value off the shape the validator checks (keys
      and types only; no output_schema walk), so a hand-run contract cannot crash the evaluator. Plan 4 (rec-5267)
      also edits this file (BUILT); whichever builds second rebases.
  - file: src/persona_backends/verdict.py
    action: Create
    purpose: >-
      Persona-agnostic evaluator, naming no persona id or contract path (implementation_binding). `expected(rule,
      value) -> tuple[str, str]` returns (verdict, reason): walk cases in order; a condition holds when the dotted array
      path resolves to a list in value with an element (whose `field` value is in `in`); reason names the first holding
      element ("findings[2].severity is High", "spirit[0] is present") or "no case holds". `verdict_errors(rule, value)
      -> list[str]`: [] when value["verdict"] equals expected, else one error "$['verdict']: is <actual>, but the verdict
      rule gives <expected> (<reason>)". A path step that is missing or not a dict or list means no element.
  - file: src/persona_backends/output.py
    action: Modify
    purpose: >-
      check(): after a success value passes output_schema with no errors and loaded.verdict_consistency is not None,
      errors = verdict.verdict_errors(loaded.verdict_consistency, value); a failure value (outcome failure) is never
      verdict-checked. The existing repair path (repair_message, revisions, schema_invalid past max_revisions) is
      unchanged, so a contradiction costs one revision exactly like a schema error.
  - file: tests/persona_backends/test_verdict_consistency.py
    action: Create
    purpose: >-
      rec-5052 acceptance and the backend behaviour on the fake transport (tests/persona_backends/fakes.py) and the real
      verdict contracts (loaded by path; tests are not landing_dirs). Nodes listed in test_obligations.
  - file: tests/persona_contracts/fixture_tree.py
    action: Modify
    purpose: >-
      The fixture verdict persona's output_schema gains `findings` (array of objects {severity: enum [blocking, nit]},
      additionalProperties false, required [severity]) and verdict_consistency (REVISE when any findings[].severity in
      [blocking], otherwise PROCEED); VERDICT_RULE becomes "Return REVISE when any blocking finding remains, else
      PROCEED." MUTATORS and EXPECTED gain verdict_rule_missing, verdict_rule_malformed, verdict_rule_array,
      verdict_rule_field, verdict_rule_in_outside_enum, verdict_rule_coverage and verdict_rule_untethered, each
      re-rendering, each expecting its validator message fragment.
  - file: tests/checks/contracts/test_validate_persona_contracts.py
    action: Modify
    purpose: >-
      test_compute_plane_contract_with_verdict_rule_is_refused (the existing compute-plane test's pattern, adding a
      verdict_consistency mapping). The parametrized test_red_rule picks up the new mutators unchanged.
bundled_recommendations: [rec-5052]
