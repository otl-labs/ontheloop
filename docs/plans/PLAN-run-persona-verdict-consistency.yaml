slug: run-persona-verdict-consistency
intent: >-
  Plan 2a of the run_persona litellm backend series (T4.32 c1, backend leg; rec-5052's code half): the
  persona-agnostic backend and the persona contract checker learn an optional verdict_consistency rule, a verdict
  persona's verdict rule as data in a closed grammar (ordered cases of "verdict V when any element of array A,
  optionally with field F in set S", then an otherwise verdict). validate_persona_contracts checks a present rule
  against the contract's output_schema, verdict enum and prose skill_tether.verdict_rule; the backend evaluates it after
  the output_schema check inside plan 1's bounded repair loop, so a contradiction is a repair turn and, past
  max_revisions, schema_invalid, never the contradictory success. No contract carries a rule yet: plan 2b (rec-5052)
  adds the three verdict contracts' rules, the index wording and the requirement under its own approval run. Serves
  NS.9: a verdict posted as a GitHub check cannot contradict its own findings.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-run-persona-verdict-consistency.yaml
phase: >-
  T4.32 c1 (backend leg, part); closes no criterion. T4.32 is in_progress; plan 1
  (PLAN-run-persona-litellm-backend) built as #2132 (eed2f6e4). src/persona_backends is excluded from the data-pipeline
  bundle (plan 1) and scripts/persona_contracts is in no bundle, so nothing deploys (V2).
closes_criteria: []
cites: [dec:206, dec:235, dec:246]
scope:
  - file: scripts/persona_contracts/schema.py
    action: Modify
    purpose: >-
      PersonaContract gains `verdict_consistency: dict[str, Any] | None = None` after skill_tether, so a contract may
      carry the rule (the model is extra=forbid). Only this line; the grammar is checked in the validator.
  - file: scripts/checks/contracts/validate_persona_contracts.py
    action: Modify
    purpose: >-
      `_verdict_rule_failures(persona, contract)` called from _contract_failures (no jsonschema import; fast tier); an
      absent rule passes (plan 2b makes it required through required_for_verdict). A compute_plane contract carrying a
      rule fails "verdict_consistency on a compute_plane contract". Shape: exactly the keys cases (non-empty list) and
      otherwise (str); each case exactly verdict (str) and any (non-empty list); each condition exactly array (str)
      plus optionally field and in together (field str, in a non-empty list of str), else "verdict_consistency is
      malformed"; a shape failure returns that one message before any output_schema, enum or tether check, so a bad
      shape never raises out of the check. array is a dotted path walked through output_schema properties, every step an object property and the
      last of type array, else "array <path> is not an array of output_schema"; field is a property of that array's
      items carrying an enum, else "field <f> is not an enum property of <path>'s items"; each in value lies in that
      enum, else "in value <v> is outside <path>[].<f>'s enum". The case verdicts plus otherwise, as a list, hold each
      value of output_schema's verdict enum exactly once, else "verdict_consistency verdicts differ from the verdict
      enum". Every verdict and in value appears as a whole word (\b plus re.escape(value)) in skill_tether.verdict_rule, else
      "verdict_consistency names <v>, absent from skill_tether.verdict_rule". The module docstring names the rule.
  - file: src/persona_backends/contract.py
    action: Modify
    purpose: >-
      LoadedContract gains `verdict_consistency: dict[str, Any] | None` (the raw mapping, None when absent). load()
      refuses (RunRefused "verdict_consistency is malformed") a present value off the shape the validator checks (keys
      and types only, with an isinstance guard before every .get, so a non-mapping rule, case or condition is refused,
      never an AttributeError; no output_schema walk); a rule that passes this shape but names paths the value lacks is safe because
      the evaluator never raises (verdict.py). Plan 4 (rec-5267, not
      yet built) also edits this file, at the BUILT constant; whichever builds second rebases.
  - file: src/persona_backends/verdict.py
    action: Create
    purpose: >-
      Persona-agnostic evaluator, naming no persona id or contract path (implementation_binding). `expected(rule,
      value) -> tuple[str, str]` returns (verdict, reason): walk cases in order; a condition holds when the dotted array
      path resolves to a list in value with an element (whose `field` value is in `in`); reason names the first holding
      element ("findings[2].severity is High", "spirit[0] is present") or "no case holds". Never raises on any value: a
      path step that is missing or not a mapping, or a last step that is not a list, means no element; under a field
      condition, an element that is not a mapping or lacks the field never matches. `verdict_errors(rule, value) ->
      list[str]`: [] when value.get("verdict") equals expected, else one error "$['verdict']: is <actual or absent>, but
      the verdict rule gives <expected> (<reason>); change the verdict, never the findings, to follow the rule" (a
      missing verdict is an error, never a crash).
  - file: src/persona_backends/output.py
    action: Modify
    purpose: >-
      check(): after a success value passes output_schema with no errors and loaded.verdict_consistency is not None,
      errors = verdict.verdict_errors(loaded.verdict_consistency, value); a failure value (outcome failure) is never
      verdict-checked. The repair path (repair_message, revisions, schema_invalid past max_revisions) is unchanged, so a
      contradiction costs one revision exactly like a schema error.
  - file: tests/persona_backends/fakes.py
    action: Modify
    purpose: >-
      `rule_contract(tmp_path, rule,
      output_schema=None) -> Path`: a tmp copy of fixture_persona.yaml carrying the rule
      (and, when given, a replacement output_schema) beside a copy of its rendered prompt, so load() hash-checks it as is
      (the rule and output_schema are not rendered into the fixture prompt). FIELD_SCHEMA: the fixture output_schema
      with findings as objects {severity: enum [blocking, nit]}. The fixture contract file itself is unchanged.
  - file: tests/persona_backends/test_verdict.py
    action: Create
    purpose: >-
      Mirror test of verdict.py (map_source_to_test): ordered cases and first-match, field/in and array-only
      conditions, a dotted path (roadmap.rows), the reason text, a missing, non-dict or non-list path step meaning no
      element, a non-mapping element or one lacking the field under a field condition (no match, no raise), a value
      without a verdict (one error, no raise), and verdict_errors' empty list on agreement and single error on
      contradiction. 100% line coverage of verdict.py on its own.
  - file: tests/persona_backends/test_contract.py
    action: Modify
    purpose: >-
      New nodes: a present rule loads into LoadedContract.verdict_consistency; an absent one gives None; each malformed
      shape in tests.persona_contracts.fixture_tree.MALFORMED_RULES is refused (test_malformed_verdict_rule_is_refused, parametrized),
      and a list-valued rule is refused (test_non_mapping_verdict_rule_is_refused; schema.py's dict type refuses it on
      the validator side). Covers every new contract.py line on its own (per-file
      coverage runs only the mirror test).
  - file: tests/persona_backends/test_output.py
    action: Modify
    purpose: >-
      New nodes on a rule_contract copy: a contradictory success gives the verdict error
      (test_contradictory_verdict_is_an_error); an agreeing success passes; a failure value with a rule present is not
      verdict-checked; a schema-invalid value reports schema errors only. Covers every new output.py line on its own.
  - file: tests/persona_backends/test_verdict_consistency.py
    action: Create
    purpose: >-
      The repair loop end to end on the fake transport and rule_contract copies, one node per AC1 behaviour:
      test_contradictory_verdict_returns_schema_invalid (every terminal turn contradicts; schema_invalid after
      max_revisions, the repair message carrying the verdict error), test_repaired_verdict_returns_success (one
      contradiction, then an agreeing reply; one revision), test_failure_value_passes_unchecked and
      test_contract_without_rule_is_unchanged. Plan 2b adds test_real_contract_rules here (rec-5052's acceptance node),
      so this plan must not create that node.
  - file: tests/persona_contracts/fixture_tree.py
    action: Modify
    purpose: >-
      The fixture verdict persona's output_schema gains `findings` (array of objects {severity: enum [blocking, nit]},
      additionalProperties false, required [severity]) as an optional property (top-level required stays [verdict], so
      test_schema_metaschema's {"verdict": "PROCEED"} stays valid) and its contract gains verdict_consistency (REVISE when any
      findings[].severity in [blocking], otherwise PROCEED); VERDICT_RULE becomes "Return REVISE when any blocking
      finding remains, else PROCEED." MALFORMED_RULES (here, beside the validator's fixture, with no backend imports):
      the one list of malformed rule shapes (missing otherwise, empty cases, a case without any, an empty any, field
      without in, an empty in, an extra key, a non-list in, a non-str verdict, a non-str array, a case that is not a mapping, a condition that is not a mapping; 12 entries) that
      test_contract's parametrized refusal and the verdict_rule_malformed mutators both iterate, so the two shape checks
      cannot drift. MUTATORS and EXPECTED gain verdict_rule_malformed (one id per MALFORMED_RULES entry), verdict_rule_array,
      verdict_rule_field, verdict_rule_in_outside_enum, verdict_rule_coverage and verdict_rule_untethered, each
      re-rendering, each expecting its validator message fragment.
  - file: tests/checks/contracts/test_validate_persona_contracts.py
    action: Modify
    purpose: >-
      test_compute_plane_contract_needs_no_skill_tether also pops verdict_consistency in its setup (the fixture now
      carries a rule a compute_plane contract may not; its assertion is unchanged). New
      test_compute_plane_contract_with_verdict_rule_is_refused: the same setup without that pop, expecting the
      compute_plane message. test_red_rule picks up the new mutators unchanged.
