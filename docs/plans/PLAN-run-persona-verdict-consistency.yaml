acceptance_criteria:
  - >-
    The litellm backend returns schema_invalid, never the success, for a verdict persona run whose every terminal turn
    contradicts its contract's verdict_consistency rule, and returns the success when a repair turn fixes the verdict
    within max_revisions (tests/persona_backends/test_verdict_consistency.py).
  - Each real verdict contract's rule gives the skill's verdict on the boundary cases in test_real_contract_rules.
  - >-
    validate_persona_contracts refuses a verdict contract without the rule, a malformed rule, an array, field or in value
    that does not resolve in output_schema, a rule whose verdicts differ from the enum, a rule naming a value absent from
    the prose verdict_rule, and a compute_plane contract carrying a rule; the real tree stays green.
  - The 23 sidecar blocks are placed word for word (approved_text verify) and every rendered prompt equals a fresh render.
  - rec-5052 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Verdict consistency in the backend on the fake transport and the real verdict contracts (rec-5052 acceptance).
    command: bin/venv-python -m pytest tests/persona_backends/test_verdict_consistency.py -q
    expected: Exit 0, every node passes. Red before (the test file and src/persona_backends/verdict.py are absent).
    fix_if: >-
      A contradictory success returned, a contradiction not counted as a revision, or a failure value verdict-checked:
      fix the backend, never the fake or the expectation. A real-contract case red: STOP to this planning thread (the
      sidecar rule, never the test, is the defect).
    hermetic: false
    graduation: graduate
    graduation_check_id: run-persona-verdict-consistency
  - step: 2
    phase: pre-deploy
    action: Plan 1's backend suites stay green with the new field loaded.
    command: >-
      bin/venv-python -m pytest tests/persona_backends/test_contract.py tests/persona_backends/test_output.py
      tests/persona_backends/test_litellm_backend.py tests/test_run_persona.py -q
    expected: Exit 0, every node passes.
    fix_if: A regression in plan 1's behaviour; fix the change, never loosen an assertion (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Existing suites that the fast tier's own pytest run already executes on every change; a shard would duplicate them.
  - step: 3
    phase: pre-deploy
    action: The validator's grammar rules, one red test each, and the real and fixture trees green.
    command: bin/venv-python -m pytest tests/checks/contracts/test_validate_persona_contracts.py tests/persona_contracts -q
    expected: Exit 0, every node passes, including test_red_rule[verdict_rule_*] (seven ids) and test_compute_plane_contract_with_verdict_rule_is_refused.
    fix_if: A red rule that does not fire, or the real tree red; fix the validator, never the mutator's expectation.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The parametrized red-rule suite is the standing guard and runs in every tier; a shard would duplicate it.
  - step: 4
    phase: pre-deploy
    action: The placed contract text and the checks that read it.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug run-persona-verdict-consistency &&
      bin/venv-python -m scripts.persona_contracts.render --check && bin/venv-python -c
      "from scripts.checks.contracts.validate_persona_contracts import validate_persona_contracts as a;
      from scripts.checks.contracts.validate_persona_contract_binding import validate_persona_contract_binding as b;
      f=[];a(f);b(f);print(*f,sep='\n');print(f'contract checks: {len(f)} failures');assert not f"
    expected: The verify run passes, the render check prints RENDER-CHECK OK 5, and the last line reports 0 failures.
    expected_literals:
      - 'RENDER-CHECK OK 5'
      - 'contract checks: 0 failures'
    fix_if: >-
      A verify mismatch: place the block word for word (never edit the sidecar). A render mismatch: re-run render
      --write, never hand-edit a rendered file. A binding failure: a src/persona_backends module names a persona id.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The two contract checks run in every tier, the render check is their rendered-prompt rule, and approved-text
      verify runs in validate_merge_step; a shard would duplicate them.
  - step: 5
    phase: pre-deploy
    action: No artifact bundles a changed path and no deploy channel watches one (Decision 249 clause 2).
    command: >-
      bin/venv-python -c "import subprocess;from scripts.convergence_health.code_drift import PROD_SOURCE_PATHSPECS as P,DUCKLAKE_SOURCE_PATHSPECS as D;from scripts.lambda_manifest import compute_affected_artifacts as ca;import fnmatch;run=lambda a:subprocess.run(a,capture_output=True,text=True,check=True).stdout.split();mb=subprocess.run(['git','merge-base','HEAD','origin/main'],capture_output=True,text=True,check=True).stdout.strip();ch=sorted(set(run(['git','diff','--name-only',mb]))|set(run(['git','ls-files','--others','--exclude-standard'])));hit=lambda f,g:f==g or f.startswith(g.rstrip('/')+'/') or fnmatch.fnmatch(f,g);hits=sorted({f for f in ch for g in P+D if hit(f,g)});aff=ca(ch);print('changed',len(ch),'hits',hits,'affected',aff);assert 'src/persona_backends/verdict.py' in ch;assert not hits and aff in ({},{'data-pipeline':['src/lambdas/data-pipeline/manifest.yaml']});print('NO_DEPLOY_TRIGGER_OK')"
    expected: >-
      Exit 0; the change list holds src/persona_backends/verdict.py, no changed path matches a PROD or DUCKLAKE source
      pathspec, affected is empty, and the last line is NO_DEPLOY_TRIGGER_OK.
    fix_if: An artifact is affected or a pathspec hits; STOP to this planning thread, never deploy from this plan.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      It reads this branch's transient diff against the merge-base, which is empty on main; plan 1's
      test_package_boundary holds the data-pipeline exclude in every tier.
  - step: 6
    phase: pre-deploy
    action: Pre-handoff full tier on the committed, rebased tree (Decision 163), read through its evidence file.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports the full tier passed on HEAD's tree.
    fix_if: Any failure; fix and re-run both from the start (timeout_disposition blocked). Main reds owned elsewhere (rec-5247, rec-5276) are deferred, never fixed here.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: rec-5052 is closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5052']); print(rows[0]['id'], rows[0]['status'])"
    expected: Prints rec-5052 closed after the closure job runs on the merge commit; record that run id.
    fix_if: >-
      Still open: read the closure job's log for a refusal marker; never close it with a direct status write after a
      Decision 186 refusal.
    hermetic: false
