slug: run-persona-verdict-consistency
intent: >-
  Plan 2 of the run_persona litellm backend series (T4.32 c1, backend leg; rec-5052): the backend refuses a verdict
  persona success whose verdict contradicts its own findings (for example PROCEED carrying a High finding). Each verdict
  persona contract gains verdict_consistency, its skill_tether.verdict_rule as data in a closed grammar (ordered cases
  of "verdict V when any element of array A, optionally with field F in set S", then an otherwise verdict), checked
  statically against the contract's output_schema, verdict enum and prose verdict_rule. The persona-agnostic backend
  evaluates it after the output_schema check inside plan 1's bounded repair loop, so a contradiction is a repair turn
  and, past max_revisions, schema_invalid, never the contradictory success. Serves NS.9: a verdict posted as a GitHub
  check cannot contradict its own findings.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-run-persona-verdict-consistency.yaml
phase: >-
  T4.32 c1 (backend leg, part); closes no criterion. T4.32 is in_progress; plan 1
  (PLAN-run-persona-litellm-backend) built as #2132 (eed2f6e4). src/persona_backends is excluded from the data-pipeline
  bundle (plan 1) and scripts/persona_contracts is in no bundle, so nothing deploys (V2).
closes_criteria: []
cites: [dec:206, dec:246]
