      the sentence after it; whichever builds second rebases); persona_contract.fields.verdict_consistency (the grammar);
      failure_envelope.required_ids.schema_invalid widened. required_for_verdict is NOT changed: the requirement is
      enforced by validate_persona_contracts (see context, wording-check constraint).
