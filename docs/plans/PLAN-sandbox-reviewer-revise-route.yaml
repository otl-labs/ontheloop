schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: sandbox-reviewer-revise-route
intent: >-
  Stop a sampled LLM verdict from halting the sandbox pipeline: on a push to main, a subagent plan-review REVISE routes
  the saved plan to the operator's tf-gated-apply approval, the way a deterministic-guard block already does, instead
  of latching the convergence record red with re-sampling as its only exit (rec-5205; NS.9: a human holds the gate, the
  engine never silently applies).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-sandbox-reviewer-revise-route.yaml
phase: >-
  ci_rca (soft-warn exception category): Track B preventive repair of rec-5205 under
  docs/contracts/red-main-recovery.yaml (Decision 226). No tier_item is targeted and no exit criterion is closed, so
  closes_criteria is empty.
closes_criteria: []
cites: [dec:55, dec:77, dec:92, dec:126, dec:154, dec:158, dec:162, dec:167, dec:181, dec:183, dec:190, dec:226, dec:235, dec:246]
scope:
  - file: .github/actions/subagent-plan-review/action.yml
    action: Modify
    purpose: >-
      New input revise-routes (required false, default "false"; description: "'true' makes a REVISE exit 0 with
      outcome=revise so the caller can route it to tf-gated-apply (Decision {{N}}); any other value keeps today's
      fail-closed exit 1. STARVED is unaffected.") passed to review.sh as env REVISE_ROUTES. The outcome output and
      every other input are unchanged. The description block names the input.
    new_imports: []
  - file: .github/actions/subagent-plan-review/review.sh
    action: Modify
    purpose: >-
      Header contract lists REVISE_ROUTES. In the REVISE case only: when "${REVISE_ROUTES:-}" is exactly "true" (the
      :- default is required: review.sh already runs under set -uo pipefail), print
      "Subagent returned REVISE; routing to tf-gated-apply for operator approval." to stderr instead of the
      failing-closed line, write the reason line and the existing summary block exactly as today, append to the step
      summary a line "Routed to the tf-gated-apply Environment: approve only after reading the reason above
      (rec-5205).", emit "::warning::[SUBAGENT-REVIEW] REVISE routed to tf-gated-apply (rec-5205)", write
      outcome=revise and exit 0. Any other REVISE_ROUTES value (unset, empty, false, TRUE, yes) runs today's REVISE
      branch byte for byte, exit 1. PROCEED, STARVED, the pre-written outcome=starved, the same-budget STARVED retry
      and every early-exit path are untouched; no retry on REVISE in either mode.
    new_imports: []
  - file: .github/workflows/terraform-apply-sandbox.yml
    action: Modify
    purpose: >-
      apply-sandbox only. (1) The review step passes `revise-routes: ${{ github.event_name == 'push' }}`. (2) The apply
      step's if becomes `success() && steps.guard.outputs.routed != 'true' && steps.review.outputs.outcome ==
      'proceed'`. (3) The job output routed becomes `${{ steps.guard.outputs.routed == 'true' || (github.event_name == 'push' && steps.review.outcome == 'success' && steps.review.outputs.outcome == 'revise')
      }}`, and the record_write step's routed input the same expression, so the record keeps its status and gains
      the existing pending_gated marker. The steps.review.outcome == 'success' conjunct is load-bearing: review.sh's
      default REVISE branch writes outcome=revise and then exits 1, so without it a REVISE that failed closed (a wiring
      omission, or a fault after the outcome write) would mark the record pending_gated while gated-apply, which needs
      apply-sandbox success, never runs; with it such a REVISE still latches red. (4) The wake step's ROUTED env
      becomes `${{ (github.event_name == 'push' && steps.review.outcome == 'success' && steps.review.outputs.outcome == 'revise') && 'revise' || steps.guard.outputs.routed }}`; its if and every other env line are
      unchanged. (5) The EMIT and
      upload steps (the dispatch fresh-plan hand-off) are unchanged, so a dispatch REVISE still fails red and uploads
      nothing. The comments on the review, apply and record_write steps, the file's header comment ("the guard plus the
      subagent review ARE the plan-content gate, and both fail closed") and the record_write comment's "an explicit
      REVISE" failure list say a push REVISE routes (Decision {{N}}); comments are zero effective lines.
      gated-apply, advisory-status and ducklake-artifacts jobs are unchanged. The record_write step's routed branch
      (write-convergence-record) still logs "Guard routed" on a REVISE route; rec-5220 owns that line. No new inline run step (composite-action body baseline r3 rows
      unchanged). Size: the file is at 407 of its 409 effective-line budget (NEAR_CAP, measured
      2026-11-16); these edits add exactly one effective line (the revise-routes `with:` line), every expression staying
      on the line it replaces. Relief: measure with plan_obligations on the build's base; if headroom there is below 1,
      stop with a plan-defect report, never a budget raise.
    new_imports: []
  - file: scripts/ci/apply_wake.py
    action: Modify
    purpose: >-
      render_message for job apply-sandbox: when routed == "revise" (the workflow's wake ROUTED value for a push
      REVISE route), return a distinct message: "sandbox subagent plan reviewer REVISEd {head_sha} on push, so it was routed to the tf-gated-apply job
      instead of latching red; read the REVISE reason in this run's apply-sandbox step summary, then approve or reject
      at: Actions -> gated-apply job. The convergence record is unchanged until the gated apply completes (commit_sha
      becomes {head_sha} on success). (Best-effort wake.)". Every other branch, including the guard-routed message
      for routed == "true", is unchanged. The gated-apply job's own success wake ("gated-apply converged GREEN ... (IAM/trust/destroy
      change applied in CD after reviewer approval)") is not edited, so it misnames a REVISE-routed apply; rec-5220
      owns that wording with the routed log line, since both need the route cause.
    new_imports: []
  - file: scripts/checks/ci_guards/validate_dispatch_gated_apply_topology.py
    action: Modify
    purpose: >-
      Five more invariants beside the eight, over the same parsed workflow (scripts.verify_ci_workflow._load), with the
      module docstring and the function docstring listing them and registry.examined(13, unit="topology_invariants");
      each failure appends one distinct "dispatch-gated-apply-topology: <label>" entry: (ix) apply-sandbox's review
      step (id review) passes revise-routes exactly "${{ github.event_name == 'push' }}"; (x) apply-sandbox's apply
      step if contains "steps.review.outputs.outcome == 'proceed'"; (xi) the job output routed, the record_write
      step's routed input and the wake step's ROUTED env each contain "github.event_name == 'push' &&
      steps.review.outcome == 'success' && steps.review.outputs.outcome == 'revise'" and "steps.guard.outputs.routed"; (xii) the upload_fresh_plan_sha256 EMIT step and the SANDBOX_FRESH_PLAN_ARTIFACT
      upload step ifs do not mention steps.review (invariant (iv) already pins their guard-routed conjunct); (xiii) in
      .github/workflows/reconcile.yml (read through the same _load) no step whose uses is ./.github/actions/subagent-plan-review passes
      revise-routes, and .github/actions/subagent-plan-review/action.yml declares revise-routes with default "false".
      If reconcile.yml or the action file cannot be read, (xiii) fails with its label (never a skip, since the
      sandbox workflow was read). The file stays a single module well under 500 SLOC (242 today; measure with
      plan_obligations on the build's base).
    new_imports: []
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      The validate_dispatch_gated_apply_topology Entry's pre_globs gain ".github/actions/subagent-plan-review/action.yml"
      (reconcile.yml and terraform-apply-sandbox.yml are already listed), so an edit to the action's input reaches the
      check in --pre. No other Entry changes.
    new_imports: []
  - file: tests/fixtures/review_sh_harness.py
    action: Create
    purpose: >-
      Importable harness (tests/fixtures is exempt from the cross-test-import guard) that runs review.sh under
      GitHub's composite argv `bash --noprofile --norc -e -o pipefail` with shimmed claude/python3/sudo/npm and the
      real scripts/ci/claude_p_retry.sh, exposing outcome (last GITHUB_OUTPUT write), rc, stderr, the step summary,
      claude invocation count and the retry transcript; the python3 shim passes review_verdict.py calls, including
      --reason, through to the real scripts/ci/review_verdict.py, so verdict exit codes and the reason line come from
      the real classifier, and stubs terraform_plan_digest.py with a fixed digest (a workdir plan.json of "{}"), as
      tests/test_subagent_review_wiring.py's harness does; any other python3 call runs the real interpreter. That file is not edited.
    new_imports: []
  - file: tests/test_subagent_plan_review_route.py
    action: Create
    purpose: >-
      Nodes: test_revise_routes_with_opt_in (REVISE_ROUTES=true: outcome revise, rc 0, one claude call, no retry
      transcript, summary carries the reason and the routed line, stderr the ::warning:: line);
      test_revise_fails_closed_without_opt_in parametrised over unset, "", "false", "TRUE", "yes" (rc 1, outcome
      revise, stderr carries "Subagent returned REVISE; failing closed.", summary lacks the routed line);
      test_starved_still_blocks_with_opt_in (STARVED twice: rc 1, outcome starved, retry ran once);
      test_proceed_unchanged_with_opt_in (rc 0, outcome proceed);
      test_action_maps_revise_routes_env (action.yml parsed with yaml: runs.steps[0].env.REVISE_ROUTES is exactly
      "${{ inputs.revise-routes }}" and inputs.revise-routes.default is "false", in the style of
      tests/test_subagent_review_wiring.py's TestActionAdapter); test_rec_5205_sid_removal_routes (the reviewer's
      recorded run-43871111764 REVISE reason as the transcript result: rc 0, outcome revise, reason in the summary).
      The reason text is saved at /mnt/project-files/reviewer-revise-route/REVISE-reason-run-43871111764.txt (copied
      from that run's apply-sandbox log; it begins "`aws_iam_role_policy.github_ci_trusted_plan` is losing the
      `TfstateGithubRead` SID"); the builder inlines it as the stub's result with its em dash replaced by a hyphen
      (ASCII-only code), or, if that file is gone, uses that opening sentence alone.
    new_imports: [tests.fixtures.review_sh_harness]
  - file: tests/checks/ci_guards/test_validate_dispatch_gated_apply_topology.py
    action: Modify
    purpose: >-
      TestPassPath::test_examined_count_is_eight_topology_invariants asserts count 13 in place of 8; its name is kept,
      though it now misstates the count, so the edit is one assertion-changed candidate, recorded under weakening_dispositions as planned-change. Additive
      nodes, in a new class TestRevisePathInvariants: for each of invariants (ix)-(xiii) a mutated in-memory copy fails with that invariant's label and only
      it; dropping the steps.review.outcome == 'success' conjunct from any one of the three (xi) sites fails (xi).
      Because (xiii) reads reconcile.yml and the action file through the same _load, the new nodes patch _load with a
      path-keyed side_effect (the sandbox, reconcile and action dicts by path), not the module's single
      return_value _run; the existing nodes and _run are not edited. Under the unedited _run every existing negative
      also fails (xiii), since the sandbox dict stands in for reconcile.yml and the action; no existing assert breaks
      ("(i)", "(ii)" and "(iii)" are not substrings of "(xiii)"), but the module docstring's "never trips a sibling
      invariant" no longer holds for those nodes: the builder updates that docstring sentence to say so, and this is
      expected, not a regression. One more new node, test_pre_globs_cover_every_file_read, asserts that
      .github/actions/subagent-plan-review/action.yml, .github/workflows/reconcile.yml and
      .github/workflows/terraform-apply-sandbox.yml each match some fnmatch pattern in the
      validate_dispatch_gated_apply_topology Entry's pre_globs (scripts.checks.ci_guards._manifest), since
      validate_pre_glob_closure follows import edges only and never sees a YAML file the check reads. reconcile.yml passing revise-routes "true" at one review
      site fails (xiii); the action's default flipped to "true" fails (xiii); an unreadable reconcile.yml fails (xiii)
      and does not skip. No other existing node or assert line changes.
    new_imports: []
  - file: tests/test_apply_wake.py
    action: Modify
    purpose: >-
      One additive node, test_apply_sandbox_revise_route_message (routed "revise": the new message names REVISE,
      gated-apply and the step summary, and not "out-of-budget IAM"); the existing guard-routed nodes already pin the
      routed "true" message. No existing node or assert line changes; the
      graduated shard gated-apply-wake-names-refusal, which names this file, is kept unchanged.
    new_imports: []
  - file: tests/checks/decisions/test_revise_route_decision_records.py
    action: Create
    purpose: >-
      Scoped to the new Decision's own block (found by its header text, never a file-wide grep): its yaml envelope
      has amends [154, 183] and kind direction, its reversal-conditions block names rubber-stamp, missed-defect and
      rejected-reapplied; Decision 154's and 183's blocks each carry an Update naming
      PLAN-sandbox-reviewer-revise-route; environment-taxonomy.yaml's sandbox_gated_apply text names the push REVISE
      route.
    new_imports: []
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the sidecar's blocks d01-decision-entry (the new Decision, newest first), d02-decision-154-note and
      d03-decision-183-note. {{N}} is the next free Decision number on the build's base, {{DATE}} the build date UTC.
    new_imports: []
  - file: docs/decisions-index.json
    action: Modify
    purpose: Regenerated with bin/venv-python -m scripts.decisions_index --write after the DECISIONS.md edit (companion, never hand-edited).
    new_imports: []
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar's blocks e01-sandbox-apply-gating, e02-sandbox-gated-apply and e04-amendment-row, the last
      being a new amendment_log entry (governance_note_add) for this Class D contract. The file is at 477 of 500
      effective lines (NEAR_CAP); the blocks add about 7. Relief: measure on the build's base; if it has no headroom,
      stop with a plan-defect report, never a budget raise.
    new_imports: []
bundled_recommendations: [rec-5205]
followon_recs: [rec-5213, rec-5220]
infrastructure_dependencies:
  - "No terraform/** change and no IAM change: gated-apply's environment OIDC sub is already trusted by github_ci_apply (Decision 94), and the push REVISE route fetches the saved plan.bin from S3 exactly as the guard route does."
acceptance_criteria:
  - "On a push run, a REVISE from the subagent reviewer leaves apply-sandbox green with outcome revise, skips its apply step, sets the job output routed to true, writes the pending_gated marker with the prior status unchanged, and lets gated-apply apply the saved plan.bin only after a tf-gated-apply approval."
  - "On a workflow_dispatch run and at both reconcile.yml review sites, a REVISE still exits 1 and latches red exactly as before; review.sh without revise-routes 'true' is byte-identical in behaviour."
  - "The sandbox apply step runs only on an explicit PROCEED; a STARVED verdict still blocks without writing the record."
  - "validate_dispatch_gated_apply_topology passes on the committed workflows in --pre with examined(13) and fails each of invariants (ix)-(xiii) alone on a mutated copy."
  - "DECISIONS.md and environment-taxonomy.yaml equal main plus the approved sidecar's blocks, word for word."
  - "rec-5205 reads closed after the merge, with its acceptance repointed to tests/test_subagent_plan_review_route.py::test_revise_routes_with_opt_in."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: this plan and its sidecar are on main; the branch is current."
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/approved/sandbox-reviewer-revise-route.yaml
      && git cat-file -e origin/main:docs/plans/PLAN-sandbox-reviewer-revise-route.yaml && git merge-base --is-ancestor
      origin/main HEAD && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: A missing file means the plan PR has not merged; stop. A failed ancestry test means a stale branch; merge origin/main first.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: DECISIONS.md and environment-taxonomy.yaml are exactly main plus the approved sidecar.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug sandbox-reviewer-revise-route --base origin/main
    expected: Exit 0, printing APPROVED-TEXT OK. Red before the blocks are placed.
    fix_if: >-
      A word mismatch means a placed block drifted: restore its after text exactly, never edit the sidecar. A moved
      anchor (another plan landed first) is a plan-defect report.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A base-relative, one-time binding of this build's diff to its sidecar; validate_merge_step enforces the same
      binding on the build PR's fast tier.
  - step: 3
    phase: pre-deploy
    action: review.sh's opt-in REVISE route and its unchanged default, STARVED and PROCEED paths.
    command: bin/venv-python -m pytest tests/test_subagent_plan_review_route.py tests/test_subagent_review_wiring.py tests/test_subagent_review_overflow_and_reason.py tests/test_subagent_plan_review_values_stripped.py -q
    expected: All pass. Red before (the new file is absent; with it, test_revise_routes_with_opt_in fails on rc 1).
    expected_literals: [" passed"]
    fix_if: Fix review.sh; never edit tests/test_subagent_review_wiring.py, the overflow-and-reason or values-stripped tests, or relax a default-mode assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: subagent-review-revise-routes-opt-in
  - step: 4
    phase: pre-deploy
    action: The workflow topology pins the push-only route, the PROCEED conjunct and Reconcile's fail-closed REVISE.
    command: >-
      bin/venv-python -m pytest tests/checks/ci_guards/test_validate_dispatch_gated_apply_topology.py::TestRevisePathInvariants -q
      && bin/venv-python -m pytest tests/checks/ci_guards/test_validate_dispatch_gated_apply_topology.py
      tests/test_convergence_infra_error_acceptance.py -q
    expected: All pass. Red before (the TestRevisePathInvariants class is absent; with it, the count node fails on 8).
    expected_literals: [" passed"]
    fix_if: Fix the workflow or the check; never relax an existing invariant (i)-(viii) or edit the infra-error test.
    hermetic: true
    graduation: graduate
    graduation_check_id: sandbox-revise-route-topology
  - step: 5
    phase: pre-deploy
    action: The wake message names the REVISE route; the guard-routed message and the record consumers are unchanged.
    command: >-
      bin/venv-python -m pytest tests/test_apply_wake.py::test_apply_sandbox_revise_route_message -q && bin/venv-python -m
      pytest tests/test_apply_wake.py tests/test_convergence_classify.py tests/convergence_health -q
    expected: All pass. Red before (the node is absent; with it, the REVISE wake node gets the default message).
    expected_literals: [" passed"]
    fix_if: Fix apply_wake.py; the guard-routed branch is not edited.
    hermetic: true
    graduation: graduate
    graduation_check_id: apply-wake-revise-route
  - step: 6
    phase: pre-deploy
    action: The new Decision and its notes are recorded.
    command: bin/venv-python -m pytest tests/checks/decisions/test_revise_route_decision_records.py -q
    expected: All pass. Red before (no such Decision).
    expected_literals: [" passed"]
    fix_if: Place the sidecar's blocks; never reword them.
    hermetic: true
    graduation: graduate
    graduation_check_id: revise-route-decision-records
  - step: 7
    phase: pre-deploy
    action: Fast tier on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the named failure on the branch; never skip, disable or quarantine a test.
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Full tier before handoff (handoff_policy), started in the background from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verify-head read reports a completed full run for HEAD with exit 0.
    fix_if: A red full tier blocks handoff; fix and rerun from the start. A timeout is blocked, never a warning.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      The first terraform-apply-sandbox push run whose head descends from the build's squash commit and whose Terraform
      apply step ran (not a guard or REVISE route) still auto-applies on PROCEED: its subagent review and Terraform
      apply steps both concluded success and the run succeeded. Routed runs before it are listed, not judged. The push
      trigger is path-filtered to terraform/personal/**, so such a run may not exist at merge time.
    command: >-
      MERGE_SHA=<build squash commit> bin/venv-python -c "import json, os, subprocess as sp; m = os.environ['MERGE_SHA'];
      gh = lambda *a: json.loads(sp.run(['gh', *a], capture_output=True, text=True, check=True).stdout); runs =
      sorted((r for r in gh('run', 'list', '--workflow', 'terraform-apply-sandbox.yml', '--event', 'push', '--limit',
      '200', '--json', 'databaseId,conclusion,headSha,createdAt') if sp.run(['git', 'merge-base', '--is-ancestor', m,
      r['headSha']]).returncode == 0), key=lambda r: r['createdAt']); runs = [(r, {s['name']: s['conclusion'] for j in
      gh('run', 'view', str(r['databaseId']), '--json', 'jobs')['jobs'] if j['name'] == 'apply-sandbox' for s in
      j['steps']}) for r in runs]; rev = lambda st: [v for k, v in st.items() if 'review' in k.lower()]; app = lambda
      st: [v for k, v in st.items() if k.lower().startswith('terraform apply')]; [print('ROUTED', r['databaseId']) for
      r, st in runs if app(st) == ['skipped']]; hit = next(((r, st) for r, st in runs if rev(st) == ['success'] and
      app(st) not in (['skipped'], [])), None); print('AWAITING' if hit is None else hit); hit and
      hit[0]['conclusion'] == 'success' and app(hit[1]) == ['success'] and print('PUSH-APPLY OK')"
    expected: >-
      Prints PUSH-APPLY OK, or AWAITING while no qualifying push run exists (git fetch origin main first so the
      ancestry test sees the runs' heads). AWAITING leaves the step open: it is reported UNPROVEN at handoff and
      rechecked after the next terraform/personal push, never counted as a pass. The session may read the same runs and
      jobs through mcp__github__actions_list instead of gh; the selection rule is the same.
    fix_if: >-
      A hit whose apply step failed is ci-rca's red; diagnose it before closing rec-5205. A ROUTED run whose
      apply-sandbox job carries no REVISE warning annotation, no guard route, no STARVED marker and no CONVERGENCE_RED
      refusal means the proceed conjunct or the outcome output is wrong. A REVISE-routed run is evidence for the route (record it), not a failure.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: rec-5205 closed through the squash commit's Resolves trailer, with its acceptance repointed first.
    command: >-
      bin/venv-python -c "from src.common import ducklake_reader_client as c; rows, missing =
      c.fetch_recs_by_ids(c.make_reader(), ['rec-5205']); s={r['id']: (r['status'], r['acceptance']) for r in rows};
      print(s, missing); assert not missing and s['rec-5205'][0] == 'closed' and 'test_revise_routes_with_opt_in' in
      s['rec-5205'][1]; print('REC-CLOSED OK')"
    expected: Prints REC-CLOSED OK.
    fix_if: An open rec means the closure job did not run or rejected the acceptance; read its CI run and close through ops_data_portal only with its acceptance passing.
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: .github/actions/subagent-plan-review/review.sh
    behavior: an opted-in REVISE exits 0 with outcome revise and the reason in the summary; every other REVISE_ROUTES value keeps the fail-closed exit 1; STARVED and PROCEED unchanged
