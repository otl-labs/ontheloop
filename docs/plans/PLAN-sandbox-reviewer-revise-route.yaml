    behavior: pending_gated names route_reason and the apply model names the push REVISE route
    verification_step: 6
    test_selector: tests/checks/decisions/test_revise_route_decision_records.py
    red_green_expectation: red before (no route_reason key), green after
constraints:
  - Place the sidecar's blocks byte for byte, filling only {{DATE}} and {{N}}; never edit the sidecar (Decision 246). Any other edit to the bound text fails approved_text verify.
  - "Fail closed: only REVISE_ROUTES exactly \"true\" routes; the shared action defaults to false; Reconcile and the dispatch never pass it (rec-5213 owns them, after rec-4230, since their hand-offs upload plan.bin)."
  - "No existing test, assertion or check is edited (tests/test_subagent_review_wiring.py, test_validate_dispatch_gated_apply_topology.py, test_convergence_infra_error_acceptance.py, tests/ci_rca/taxonomy/test_convergence.py stay byte-identical); new coverage is additive (Decision 235). If validate_weakening_candidates lists anything, stop with a plan-defect report."
  - "write-convergence-record's first step body stays at 97 effective lines, its r3 ceiling; never add a raise-approved marker for it."
  - "No new inline run step in any workflow or action (Decision 162); the routed signal is an expression, not an aggregator step."
  - "The REVISE reason never reaches a job output, an env interpolated into a run body, or the wake comment: it stays in the step summary and log, as today (LLM text is untrusted)."
