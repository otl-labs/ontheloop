    test_selector: tests/test_subagent_plan_review_route.py
    red_green_expectation: red before (file absent; with it, the opt-in node fails on rc 1), green after
  - source: .github/actions/subagent-plan-review/action.yml
    behavior: the revise-routes input defaults to false and reaches review.sh as REVISE_ROUTES
    verification_step: 3
    test_selector: tests/test_subagent_plan_review_route.py::test_action_maps_revise_routes_env
    red_green_expectation: red before (no input and no env mapping), green after
  - source: .github/workflows/terraform-apply-sandbox.yml
    behavior: push-only revise-routes, the PROCEED conjunct on apply, the routed disjunct on the output, record write and wake, and a guard-only dispatch hand-off
    verification_step: 4
    test_selector: tests/checks/ci_guards/test_validate_dispatch_gated_apply_topology.py
    red_green_expectation: red before (invariants (ix)-(xi) fail on the committed workflow), green after
  - source: scripts/ci/apply_wake.py
    behavior: a REVISE-routed apply-sandbox run gets the REVISE wake message; the guard-routed message is unchanged
    verification_step: 5
    test_selector: tests/test_apply_wake.py::test_apply_sandbox_revise_route_message
    red_green_expectation: red before (the guard message is returned), green after
