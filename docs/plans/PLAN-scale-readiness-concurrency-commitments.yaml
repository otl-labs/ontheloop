execution_steps:
- STEP 0 -- git fetch origin main and rebase. Set N = origin/main's max '## Decision NNN:' header + 1 (217 at drafting); if a header or a merged plan's draft already
  holds 217, use the next number held by neither. If N is not 217, substitute N for 217 in the header, the envelope number, the Warehouse ID, the stanza decision
  field and all four STEP 2 lines. DATE is the implement date (ISO YYYY-MM-DD), substituted for every DATE token in STEPS 1-2. rec-4321, rec-4322 and rec-4323 are
  writer-allocated ids filed at plan time and already literal throughout.
- "STEP 1 -- docs/DECISIONS.md, new entry inserted immediately above the current top entry (newest-first), verbatim with N and DATE substituted per STEP 0, followed\
  \ by one blank line before the next '## Decision' header. Authoritative drafted text (VP 2 asserts against it):\n\n## Decision 217: Scale-readiness commitments\
  \ gated on executor concurrency above 1 (amends Decisions 73, 196, 205, 206) (Decided)\n\n```yaml\nnumber: 217\nstatus: Decided\ndecided_date: \"DATE\"\namends:\
  \ [73, 196, 205, 206]\nsignificance:\n  value: numbered_decision\n  justification: >-\n    Durable, reversal-relevant commitments about system shape spanning Decisions\
  \ 73, 196, 205 and\n    206. Not a contract governance note: they set direction, not field semantics, and git-ops.yaml\n    owns procedure. Not amendment_forms\
  \ lines: one gated set spans four entries and needs one\n    monitored stanza.\n```\n\n**Status:** Decided\n**Date:** DATE\n**Warehouse ID:** dec-217 (per Decision\
  \ 84 backfill)\n\n**Problem:** Anthropic's post \"Redesigning source control at Anthropic\" (2026-10-13,\nhttps://www.anthropic.com/engineering/redesigning-source-control)\
  \ reports that once merges grew\ntenfold, infrastructure built for human scale became the bottleneck. Its transferable conclusions\n(no global merge lock, post-merge\
  \ testing, agents own textual conflicts, humans review intent,\nderived data computed on demand) match Decision 73. A review of this repository against it\n(https://claude.ai/code/session_011cfEwz5UxFbXnqycRhnXbL,\
  \ 2026-10-14) agreed commitments not\nactionable at rec-level concurrency 1 and with no roadmap home.\n\n**Intent:**\nScale-readiness direction is recorded with\
  \ triggers, so it self-surfaces when concurrency rises.\n\n**Decision:**\n1. **No global merge enforcer for red main.** Above concurrency 1, Decision 73 cl.4's\
  \ plan-time\n   block on an open ci-rca rec becomes an overlap block between the plan's and the red's affected\n   sets (Decision 135's import-closure and data-edge\
  \ channels, scripts/checks/deps/affected_tests.py).\n   A red whose file set cannot be determined still blocks (Decision 215). Until then cl.4 stands.\n2. **Textual\
  \ conflicts.** Once the git-ops procedure of rec-4323 lands, the implementing agent\n   resolves three mechanical classes (derived files by regeneration, rosters\
  \ by union, the\n   numbering race by renumbering) under the existing structural handoff gate (full tier on the\n   rebased tree) and stops only for judgment conflicts.\
  \ Above concurrency 1, a bounded rebase step\n   owns every textual conflict, two failures escalate via a rec, and semantic conflicts not\n   excluded by CD.37's\
  \ semantic locks (T4.8) stay post-merge (Decision 73).\n3. **Identity.** Interactive sessions keep the operator's identity (the CC-web proxy acts as the\n   operator).\
  \ The executor lane is ONE non-bypass GitHub App (confirms Decisions 185 cl.3 and\n   205), persona as metadata (branch prefix, label, trailer); per-persona Apps\
  \ wait on a measured\n   rate-limit breach. The free tier uses a repository-scoped fine-grained token.\n4. **Budget grain.** Tokens by kind are facts; dollars derive\
  \ via the telemetry contract's\n   effective-dated price table. The governor acts on each lane's binding unit: API lane, a dollar\n   cap per rec and per day; subscription\
  \ lane, turns and wall-clock plus Decision 206 cl.6's\n   plan-limit pause. Cost per verified merge is top-line; shadow dollars are never a spend.\n5. **Decision\
  \ identity.** When Decision 196 cl.8's per-file split executes, the file slug is the\n   identity and the index generator derives the sequence number from first-parent\
  \ merge order for\n   new entries only; existing numbers freeze and Decision 196 cl.6 prefixes are unchanged. Until\n   then numbers stay max-plus-one with the\
  \ re-check.\n6. **Non-atomic.** With the split, clause ids become addressable in the decision-entry grammar and\n   a supersession edge may target a clause.\n7.\
  \ **Index.** With the split, the index is generated into the gitignored runtime root (Decision\n   211 cl.5) at session start and in CI, never committed.\n8. **Review.**\
  \ The pre-merge scout on every plan PR head SHA (Decision 205 cl.1, T4.25 c1) is\n   unchanged and never sampled. Above concurrency 1, extending Decision 205 cl.1's\
  \ eligible list, a\n   push-to-main scout audits merged Tier C entries against Tier A and files a rec on a hit; human\n   review of Tier C is sampled, ratcheted\
  \ with the T4.4 gates.\n\n**Coverage:** none enforced today. Homes: cl.1-2, 8 T4.4 (cl.1-2 also T4.8); cl.3\nT4.1/T4.2/T4.9a; cl.4 T4.11 (Decision 185 cl.3 ceilings);\
  \ cl.5-7 T4.24 c7; cl.8 T4.25.\nMeasurement: rec-4321, rec-4322.\n\n**Rationale:** Recording the destination unbuilt follows Decision 197 cl.8 and is not frame-lock\n\
  (Decision 75): behaviour is unchanged until each trigger fires.\n\n```yaml reversal-conditions\ndecision: 217\nreview_by: 2027-03-31\non_trigger: \"re-plan the\
  \ gated clause via /plan; review_by backstops the manual conditions\"\nconditions:\n  - id: concurrency-raised\n    kind: manual\n    description: \"Executor concurrency\
  \ is configured above 1 (the T4.4 A2+ ratchet): clauses 1, 2 and 8.\"\n  - id: split-executing\n    kind: repo_state\n    predicate: roadmap_items_complete\n  \
  \  params:\n      items: [T4.24]\n    description: \"T4.24 complete: confirm clauses 5-7 landed with the split.\"\n  - id: rate-limit-breach\n    kind: manual\n\
  \    description: \"A GitHub primary or secondary rate limit is hit by agent traffic: clause 3.\"\n  - id: red-window-growth\n    kind: manual\n    description:\
  \ \"Red-main window times merge rate grows until unrelated PRs routinely land on a red base: clause 1 early.\"\n```\n\n**Related:** Decisions 73, 196, 205, 206\
  \ (amended), 135, 215, 177, 167, 197, 75, 211, 185, 86;\nCD.37.\n\n---\n"
- "STEP 2 -- docs/DECISIONS.md, annotations. Each line is its own paragraph (a blank line before it), placed as the LAST line of the entry, immediately before its\
  \ closing --- rule; Decision 73's goes after its existing '> **Amended by Decision 205 (2026-09-28):**' line. Verbatim, N and DATE substituted:\n  Decision 73:\n\
  \    > **Amended by Decision 217 (DATE):** Above executor concurrency 1, clause 4's plan-time block on an open ci-rca rec becomes an affected-set overlap block,\
  \ and a red whose file set cannot be determined still blocks (Decision 217 clause 1); until then clause 4 stands unchanged. Textual conflicts route per Decision\
  \ 217 clause 2.\n  Decision 196:\n    > **Amended by Decision 217 (DATE):** When clause 8's per-file split executes, the file slug is the decision identity, existing\
  \ numbers freeze and new numbers derive from first-parent merge order, clause ids become addressable, and the index is generated into the gitignored runtime root,\
  \ never committed (Decision 217 clauses 5-7); clause 6 prefixes are unchanged.\n  Decision 205:\n    > **Amended by Decision 217 (DATE):** The executor App is ONE\
  \ non-bypass App with persona carried as metadata; per-persona Apps wait on a measured rate-limit breach (Decision 217 clause 3). Above executor concurrency 1,\
  \ clause 1's eligible list gains a push-to-main decision-scout pass that audits merged Tier C entries against Tier A and files a rec on a hit; the pre-merge scout\
  \ on every plan PR is unchanged (Decision 217 clause 8).\n  Decision 206:\n    > **Amended by Decision 217 (DATE):** Clause 6's plan-limit pause, with turn and\
  \ wall-clock budgets, is the subscription lane's binding budget unit; its shadow dollars are never a spend, and cost per verified merge is the top-line metric (Decision\
  \ 217 clause 4).\n"
- STEP 3 -- bin/venv-python -m scripts.decisions_index --write; commit the regenerated docs/decisions-index.json.
- 'STEP 4 -- Run VP 2-8 and VP 10 on the working tree. Loop until green; on an unrecoverable failure, stop and RCA (Decision 55). Then register VP 2 and VP 3 as graduated
  verification-registry shards under their graduation_check_ids (sanctioned derived paths). Do NOT run VP 1 here: its --verify-head leg fails closed on an uncommitted
  tree.'
- 'STEP 5 -- Commit, then git fetch origin main and rebase. Run VP 1 (full tier plus validation_result --verify-head) on the committed, rebased, clean tree immediately
  before push (git-ops.yaml handoff_sequence). On red, fix, commit and re-run VP 1 from the start. Then push and open the PR per git-ops.yaml (squash-merge on green
  CI). No Resolves: trailer: this plan bundles no recommendation. After merge, run VP 9 (post-deploy) on an updated main checkout.'
- 'STEP 6 -- Report: the minted number, the entry and four amended-entry byte sizes, VP results, and the PR link.'
rollback: 'Pre-merge: close the PR. Post-merge: never delete the header or the Amended-by lines (Decision 149 never_remove_headers, Decision 177). Reversal is a later
  superseding Decision via the reversal stanza, re-decided through /plan.'
