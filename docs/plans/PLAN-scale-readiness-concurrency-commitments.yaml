  action: NO EXISTING DECISIONS.md LINE IS REMOVED OR REWRITTEN (Decision 177). The diff against origin/main adds lines only.
  command: test "$(git diff --numstat origin/main -- docs/DECISIONS.md | awk '{print $2}')" = "0"
  expected: Exit 0 (the numstat deletion count for docs/DECISIONS.md is exactly 0, so no line -- including a --- rule or a list item -- was removed).
  fix_if: A removed line means a body was edited. Restore it and re-apply STEPS 1-2 as insertions only.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: It asserts on this change's transient diff against origin/main, which is empty once merged, so a standing shard would be vacuous.
- step: 8
  phase: pre-deploy
  action: The three planning-time follow-on recs (rec-4321 conflict-stop recording, rec-4322 red-main baseline, rec-4323 git-ops mechanical-conflict procedure) read
    back open and tagged follow-on, through the recs_by_ids named verb (Decision 215 cl.7; rec_by_id is deprecated, removal rec-4240).
  command: 'bin/venv-python -c "from src.common.ducklake_reader_client import make_reader; ids=[''rec-4321'',''rec-4322'',''rec-4323'']; rows={r.get(''id''): r for
    r in make_reader().named(''recs_by_ids'', ids='',''.join(ids))}; bad=[i for i in ids if i not in rows or rows[i].get(''status'')!=''open'' or ''follow-on'' not
    in (rows[i].get(''tags'') or [])]; assert not bad, (''follow-on rec missing, not open, or untagged'', bad); print(''FOLLOWON_RECS_OK'', ids)"'
  expected: Prints the FOLLOWON_RECS_OK marker and the three ids.
  fix_if: 'A reader error means confirming aws sts get-caller-identity --profile agent_platform. A closed rec means it was resolved independently: keep the citation
    and note it in the report.'
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: pre-deploy
  action: 'Implement-time placement: each new Amended-by line is the LAST line before its entry''s closing --- rule, and Decision 73''s directly follows its Decision
    205 line.'
  command: 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m for m in re.finditer(r''^## Decision
    (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''Scale-readiness commitments gated on executor concurrency above 1'' in m.group(2)]; assert len(es)==1,
    (''expected exactly one scale-readiness Decision'', [e.group(1) for e in es]); n=es[0].group(1); b=es[0].group(0); blk=lambda k: re.search(r''^## Decision ''+k+r'':.*?(?=^##
    Decision |\Z)'', t, re.M|re.S).group(0); tail=lambda k: [l for l in blk(k).rstrip().split(chr(10)) if l.strip()]; A=r''> \*\*Amended by Decision ''+n+r'' \(\d{4}-\d{2}-\d{2}\):\*\*
    ''; pos=[k for k in [''73'',''196'',''205'',''206''] if tail(k)[-1]!=''---'' or not re.match(A, tail(k)[-2])]; assert not pos, (''Amended-by line is not the last
    line before the closing rule'', pos); assert tail(''73'')[-3].startswith(''> **Amended by Decision 205 (2026-09-28):**''), ''Decision 73 new line must directly
    follow its Decision 205 line''; print(''DEC_ANNOTATION_POSITION_OK'', n)"'
  expected: Prints the DEC_ANNOTATION_POSITION_OK marker and the number.
  expected_literals: []
  fix_if: Move the line to sit immediately before the closing rule (73's directly after its Decision 205 line).
  hermetic: true
  graduation: waive
  graduation_waiver_reason: 'The last-line position is true only at implement time: any later sanctioned Amended-by line on 73, 196, 205 or 206 legitimately moves
    it, so a standing shard would redden on a non-regression; VP 3''s graduated form guards count, text and placement.'
- step: 9
  phase: post-deploy
  action: After the squash-merge, rec-autoclose.yml's DECISIONS.md backfill (Decision 84) lands dec-N. Confirm the reader returns it with the new title.
  command: 'bin/venv-python -c "import re,pathlib; from scripts.ops_portal.decisions import _fetch_decision_from_reader as f; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''Scale-readiness commitments gated on executor concurrency
    above 1'' in m.group(2)]; assert len(es)==1, (''expected exactly one scale-readiness Decision'', [e.group(1) for e in es]); n=es[0].group(1); b=es[0].group(0);
    r=f(''dec-''+n); assert r and ''Scale-readiness commitments'' in str(r), (''dec-''+n+'' not in ops_decisions'', r); print(''DEC_WAREHOUSE_OK'', n)"'
  expected: Prints DEC_WAREHOUSE_OK and the number, run on an up-to-date main checkout after the backfill workflow is green.
  fix_if: 'None means the backfill has not run or failed: inspect the rec-autoclose run for the merge commit, then run bin/venv-python -m scripts.ops_data_portal
    --backfill-decisions-md (idempotent). There is no offline outbox (Decision 84 I-4).'
  hermetic: false
