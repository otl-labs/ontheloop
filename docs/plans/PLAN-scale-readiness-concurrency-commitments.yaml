schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: scale-readiness-concurrency-commitments
intent: 'Record, as one numbered Decision, eight scale-readiness commitments gated on executor concurrency rising above 1 (red main without a global merge enforcer,
  agent-owned textual conflicts, one executor App identity, budget grain, and decision identity, atomicity, index placement and review once Decision 196 clause 8''s
  split executes). A monitored reversal stanza makes them self-surface through preflight when a trigger fires, so the direction is kept without consuming roadmap
  lines or filing recs for direction. Measurement and the concurrency-1 conflict procedure are three follow-on recs. Governance encoding only: no code, roadmap, contract
  or AGENTS.md edit.'
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V1
plan_path: docs/plans/PLAN-scale-readiness-concurrency-commitments.yaml
phase: 'No tier_item: an operator-directed documentation-governance Decision (soft-warn category user_explicit_out_of_scope; Tier Item Freshness Gate skipped). It
  informs T4.24 c7, T4.25 c1, T4.11 and the executor autonomy-gate and executor-App items named in the entry''s Coverage line, by pointer only, without closing or
  advancing any criterion -- Decision 86''s precedent for a governance Decision with no tier home. ROADMAP-PLATFORM.yaml is at its line ceiling and reserved for MVP
  work.'
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: One new numbered Decision (217 at drafting; re-derived at STEP 0) titled 'Scale-readiness commitments gated on executor concurrency above 1 (amends Decisions
    73, 196, 205, 206)'. Full text in STEP 1, at or under 6,144 bytes (5,422 drafted, 722 headroom). Bare yaml envelope (amends [73, 196, 205, 206], significance
    numbered_decision) and a monitored reversal stanza. STEP 2 appends one dated '> **Amended by Decision N (DATE):**' line as the last line of Decisions 73, 196,
    205 and 206 (validate_supersession_annotations requires the new number on each amended block). No existing line is edited (Decision 177).
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write after the DECISIONS.md edit; never hand-edited (Decision 160/179).
bundled_recommendations: []
followon_recs:
- rec-4321
- rec-4322
- rec-4323
infrastructure_dependencies: []
acceptance_criteria:
- Exactly one Decision titled 'Scale-readiness commitments gated on executor concurrency above 1 (amends Decisions 73, 196, 205, 206) (Decided)' exists, at or under
  6,144 bytes heading to heading, with a bare yaml envelope (number N, amends [73, 196, 205, 206], value numbered_decision), title amends edges [73, 196, 205, 206],
  no body textual amends/supersedes edge, clauses 1-8, a Coverage line, the Rationale and the four-condition stanza (concurrency-raised manual, split-executing repo_state
  roadmap_items_complete [T4.24], rate-limit-breach manual, red-window-growth manual; review_by 2027-03-31). It cites rec-4321, rec-4322 and rec-4323 and carries
  no placeholder, 12-digit or ARN token.
- Decisions 73, 196, 205 and 206 each end with exactly one dated Amended-by line naming N, placed as the last line before the closing rule (73's after its existing
  Decision 205 line). Every original body is intact. The size WARNs this raises on 73, 196, 205 and 206 are WARN-only.
- bin/venv-python -m scripts.preflight.decision_conditions exits 0 and reports Decision N not-due with the four condition ids.
- docs/decisions-index.json is fresh (scripts.decisions_index --check exits 0) and the full presubmit tier passes on the committed, rebased tree.
- After merge, dec-N is present in ops_decisions with the new title.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Full presubmit tier on the committed, rebased, clean tree (git-ops.yaml handoff_sequence). It gates decision-entry conformance, the per-entry size cap,
    supersession annotations, reversal-stanza well-formedness, decision currency, index freshness and the graduated shards this diff adds.
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Exit 0 with the all-checks-passed summary, and --verify-head attests HEAD's committed tree.
  fix_if: A validate_decisions_size FAIL on the new entry means tighten its prose; never raise the cap. A validate_supersession_annotations FAIL means an amended
    entry lacks its Amended-by line. A conformance FAIL means the envelope or a marker drifted from STEP 1. WARN-only amendment-delta lines for Decisions 73, 196,
    205 and 206 are expected and are not failures.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: 'THE SCALE-READINESS DECISION EXISTS, IS ENVELOPED, FITS THE CAP, CARRIES EVERY CLAUSE AND STAYS INSIDE THE PUBLIC-CONTENT BOUNDARY. Located by title so
    the assertion survives the numbering race. Stanza checks are presence-only (fence, decision: N, the four ids) because stanza interiors are mutable under Decision
    177 cl.4; VP 4 checks review_by and kinds at implement time. Red on origin/main, where the entry is absent.'
  command: 'bin/venv-python -c "import re,pathlib; from scripts.decisions_md import extract_amends_edges as ae; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8'');
    es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''Scale-readiness commitments gated on executor concurrency
    above 1'' in m.group(2)]; assert len(es)==1, (''expected exactly one scale-readiness Decision'', [e.group(1) for e in es]); n=es[0].group(1); b=es[0].group(0);
    sz=len(b.encode(''utf-8'')); assert sz<=6144, (''over the 6144-byte cap'', sz); assert re.search(''^''+chr(96)*3+r''yaml\s*\nnumber: ''+n+r''\b'', b, re.M), ''no
    bare yaml envelope carrying number ''+n; assert ''value: numbered_decision'' in b, ''significance''; assert chr(10)+''amends: [73, 196, 205, 206]''+chr(10) in
    b, ''envelope amends list''; assert ae(es[0].group(2))==[73, 196, 205, 206], (''title amends edges'', ae(es[0].group(2))); edges=re.findall(r''(?:amends|Amends|supersedes|Supersedes)
    Decision (\d+)'', b); assert not edges, (''unexpected textual amends/supersedes edges'', edges); assert ''**Warehouse ID:** dec-''+n+'' (per Decision 84'' in
    b and ''decision: ''+n+chr(10) in b, ''Warehouse ID or stanza number drift''; need=[''No global merge enforcer for red main'', ''import-closure and data-edge
    channels'', ''still blocks (Decision 215)'', ''Until then cl.4 stands'', ''rec-4323 lands'', ''derived files by regeneration'', ''rosters by union'', ''numbering
    race by renumbering'', ''existing structural handoff gate'', ''two failures escalate via a rec'', ''ONE non-bypass GitHub App (confirms Decisions 185 cl.3 and'',
    ''per-persona Apps wait on a measured'', ''repository-scoped fine-grained token'', ''effective-dated price table'', ''cap per rec and per day'', ''plan-limit
    pause'', ''Cost per verified merge is top-line'', ''shadow dollars are never a spend'', ''first-parent merge order'', ''existing numbers freeze'', ''Decision
    196 cl.6 prefixes are unchanged'', ''a supersession edge may target a clause'', ''gitignored'', ''never committed'', ''unchanged and never sampled'', ''push-to-main
    scout audits merged Tier C entries against Tier A'', ''files a rec on a hit'', ''**Coverage:**'', ''T4.24 c7'', ''T4.11'', ''rec-4321'', ''rec-4322'', ''Decision
    197 cl.8'', ''not frame-lock'', ''redesigning-source-control'', ''session_011cfEwz5UxFbXnqycRhnXbL'', ''yaml reversal-conditions'', ''id: concurrency-raised'',
    ''id: split-executing'', ''id: rate-limit-breach'', ''id: red-window-growth'', ''excluded by CD.37'', ''semantic locks (T4.8) stay post-merge'', ''(cl.1-2 also
    T4.8)'', ''T4.1/T4.2/T4.9a'', ''CD.37.'', ''derived data computed on demand'']; miss=[p for p in need if p not in b]; assert not miss, (''scale-readiness Decision
    text missing'', miss); bad=[w for w in [''arn:'',''rec-AAAA'',''rec-BBBB'',''rec-CCCC'',''DATE''] if w in b]+re.findall(r''\b\d{12}\b'', b); assert not bad, (''placeholder
    or public-boundary token'', bad); print(''DEC_SCALE_READINESS_OK'', n, sz)"'
  expected: Prints the DEC_SCALE_READINESS_OK marker, the minted number and the entry's byte size (about 5,420).
  expected_literals: []
  fix_if: 'A missing phrase means STEP 1''s text drifted: restore it verbatim. Over the cap means tighten, never raise. A DATE or placeholder hit means STEP 0''s
    substitution was skipped.'
  hermetic: true
  graduation: graduate
  graduation_check_id: scale-readiness-decision-recorded
- step: 3
  phase: pre-deploy
  action: DECISIONS 73, 196, 205 AND 206 EACH CARRY EXACTLY ONE DATED AMENDED-BY LINE NAMING THE NEW NUMBER, with its required phrases, placed after the entry's Related
    marker (73's after its Decision 205 line). No last-line position assert, so a later sanctioned annotation cannot redden the shard (modelled on open-core-paywall-annotations);
    VP 10 checks the exact position at implement time. Red on origin/main, where no line cites the new Decision.
  command: 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m for m in re.finditer(r''^## Decision
    (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''Scale-readiness commitments gated on executor concurrency above 1'' in m.group(2)]; assert len(es)==1,
    (''expected exactly one scale-readiness Decision'', [e.group(1) for e in es]); n=es[0].group(1); b=es[0].group(0); blk=lambda k: re.search(r''^## Decision ''+k+r'':.*?(?=^##
    Decision |\Z)'', t, re.M|re.S).group(0); A=r''> \*\*Amended by Decision ''+n+r'' \(\d{4}-\d{2}-\d{2}\):\*\* ''; ann={''73'': [''affected-set overlap block'',
    ''cannot be determined still blocks'', ''Decision {n} clause 1'', ''clause 4 stands unchanged'', ''Decision {n} clause 2''], ''196'': [''file slug is the decision
    identity'', ''existing numbers freeze'', ''first-parent merge order'', ''gitignored runtime root'', ''Decision {n} clauses 5-7'', ''clause 6 prefixes are unchanged''],
    ''205'': [''ONE non-bypass App'', ''measured rate-limit breach'', ''Decision {n} clause 3'', ''push-to-main decision-scout pass'', ''files a rec on a hit'', ''pre-merge
    scout on every plan PR is unchanged'', ''Decision {n} clause 8''], ''206'': [''plan-limit pause'', ''shadow dollars are never a spend'', ''cost per verified merge'',
    ''Decision {n} clause 4'']}; got={k: [l for l in blk(k).splitlines() if re.match(A, l)] for k in ann}; one=[(k, len(got[k])) for k in ann if len(got[k])!=1];
    assert not one, (''expected exactly one Amended-by line citing ''+n+'' per entry'', one); miss=[(k,p) for k,ps in ann.items() for p in ps if p.replace(''{n}'',n)
    not in got[k][0]]; assert not miss, (''Amended-by line text missing'', miss); lo={k: blk(k).find(''**Related:**'') for k in ann}; lo[''73'']=blk(''73'').find(''>
    **Amended by Decision 205 (2026-09-28):**''); bad=[k for k in ann if lo[k] < 0 or not lo[k] < blk(k).find(got[k][0])]; assert not bad, (''Amended-by line misplaced
    (must follow the Related marker; 73 must follow its Decision 205 line)'', bad); print(''DEC_ANNOTATIONS_OK'', n, {k: len(blk(k).encode(''utf-8'')) for k in ann})"'
  expected: Prints the DEC_ANNOTATIONS_OK marker, the number and the four entry sizes (about 9,520 / 6,190 / 6,580 / 6,260).
  expected_literals: []
  fix_if: A count failure means a line is missing or duplicated. A placement failure means it sits above the Related marker (or above 73's Decision 205 line). A text
    failure means STEP 2's line drifted; restore it verbatim.
  hermetic: true
  graduation: graduate
  graduation_check_id: scale-readiness-annotations
- step: 4
  phase: pre-deploy
  action: 'The reversal-conditions monitor parses the new stanza: the CLI exits 0 (nonzero iff any stanza is malformed) and the new entry evaluates not-due with the
    four condition ids, concurrency-raised manual and split-executing repo_state.'
  command: 'bin/venv-python -m scripts.preflight.decision_conditions && bin/venv-python -c "import re,pathlib; from scripts.preflight.decision_conditions import evaluate;
    t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m for m in re.finditer(r''^## Decision (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t,
    re.M|re.S) if ''Scale-readiness commitments gated on executor concurrency above 1'' in m.group(2)]; assert len(es)==1, (''expected exactly one scale-readiness
    Decision'', [e.group(1) for e in es]); n=es[0].group(1); b=es[0].group(0); r=[x for x in evaluate() if x.decision_id==int(n)]; assert len(r)==1 and r[0].state==''not-due'',
    (''stanza state'', r); ids=[c.id for c in r[0].conditions]; assert ids==[''concurrency-raised'',''split-executing'',''rate-limit-breach'',''red-window-growth''],
    ids; k={c.id: c.kind for c in r[0].conditions}; assert k[''concurrency-raised'']==''manual'' and k[''split-executing'']==''repo_state'', k; assert r[0].review_by==''2027-03-31'',
    r[0].review_by; print(''DEC_STANZA_OK'', n)"'
  expected: Exit 0; the last line is the DEC_STANZA_OK marker and the number.
  expected_literals: []
  fix_if: 'MALFORMED names the bad key or kind: compare against _REQUIRED_TOP_KEYS / _REQUIRED_CONDITION_KEYS / _VALID_KINDS and restore STEP 1''s stanza.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Well-formedness duplicates the standing validate_reversal_stanzas check in both tiers, and the not-due state flips by calendar at review_by
    2027-03-31, so a standing shard would redden on a date, not a regression.
- step: 5
  phase: pre-deploy
  action: Measure the new entry's heading-to-heading span, the same span validate_decisions_size measures, and print the headroom under the 6,144-byte cap.
  command: 'bin/venv-python -c "import re,pathlib; t=pathlib.Path(''docs/DECISIONS.md'').read_text(encoding=''utf-8''); es=[m for m in re.finditer(r''^## Decision
    (\d+): (.*?)\n(.*?)(?=^## Decision |\Z)'', t, re.M|re.S) if ''Scale-readiness commitments gated on executor concurrency above 1'' in m.group(2)]; assert len(es)==1,
    (''expected exactly one scale-readiness Decision'', [e.group(1) for e in es]); n=es[0].group(1); b=es[0].group(0); hs=[m.start() for m in re.finditer(r''^## Decision
    \d+:'', t, re.M)]; s=es[0].start(); e=min([h for h in hs if h>s] or [len(t)]); sz=len(t[s:e].encode(''utf-8'')); assert sz<=6144, (''heading-to-heading span over
    the 6144-byte cap'', sz); print(''DEC_SPAN_BYTES'', n, sz, ''headroom'', 6144-sz)"'
  expected: Prints the DEC_SPAN_BYTES marker, the number, the span (about 5,420) and the headroom.
  expected_literals: []
  fix_if: 'Over the cap: trim the Related list first, then the Problem, never a clause; never raise the cap.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates validate_decisions_size's per-entry hard-fail and VP 2's graduated size assertion; this row only reports the measurement.
- step: 6
  phase: pre-deploy
  action: The decisions index is regenerated, not hand-edited. Red between the DECISIONS.md edit and --write; green after.
  command: bin/venv-python -m scripts.decisions_index --check
  expected: Exit 0.
  expected_literals: []
  fix_if: Run bin/venv-python -m scripts.decisions_index --write and commit the result.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates the standing validate_decisions_index_freshness check registered in both validate tiers.
- step: 7
