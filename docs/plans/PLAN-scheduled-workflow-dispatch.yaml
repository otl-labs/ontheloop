schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "scheduled-workflow-dispatch"
intent: >-
  Start terraform-drift.yml, convergence-health.yml and main-canary.yml on time from AWS, keeping each one's GitHub cron
  as the fallback (rec-4233: GitHub drops about 80% of their hourly ticks). Three EventBridge scheduled rules, rendered
  from one register (config/lambda/scheduled_workflow_dispatcher/schedules.yaml), invoke one Lambda,
  agent-platform-workflow-dispatcher, which mints a short-lived token from a dedicated GitHub App (Actions write and
  Metadata read, this repository only; key in one SSM /secret/ parameter, put out of band), starts the named workflow on
  main through workflow_dispatch, and revokes the token. Every other dispatchable workflow refuses a run whose
  github.actor is the App's bot; the liveness sensor counts the bot's runs as cadence and checks each tick for misuse
  of the App's Actions write; four production alarms watch the AWS side. The SIT copy is built switched off. A new
  Decision records the Decision 143 clause 1 gap as an accepted residual. Four PRs: (1) the apply role's IAMRolesRead
  pre-stage in terraform/bootstrap (admin root); (2) the handler, register, refusal guards, sensor, Decision and contract
  rows; (3) the terraform/personal stack (tf-gated-apply); (4) the deploy-channel wiring. Written against main after
  rec-5025's PR #1987 merges: every PR's build starts only after that merge.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-scheduled-workflow-dispatch.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): rec-4233, which the operator placed in the CI Reform project on 2026-11-12.
  No tier_item is targeted and no exit criterion is closed, so closes_criteria is empty.
closes_criteria: []
