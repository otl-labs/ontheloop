infrastructure_dependencies:
  - "PR 1 (terraform/bootstrap, admin-only root): the read-only ADMIN pre-merge plan of VP step 5 at the CI-green head, then the human-directed bootstrap apply of VP step 6 after the operator directs it in the ADMIN session. It builds only after PR #1987 (rec-5025, which also edits github_ci_apply_reads.tf) is merged AND applied, in its own admin window, and it must be applied BEFORE PR 3 merges, or the gated apply's own iam:GetRole after the create, and every later refresh, fail closed."
  - "PR 2: no infrastructure. Its merge wakes deploy-prod-lambdas.yml (src/data/handlers changed), which ships the bigger data-pipeline.zip (handler, register, PyJWT and cryptography) to the two existing functions; VP step 14 reads that deploy back, because PR 3's function is created from the same S3 object."
  - "Out of band (Decision 237 cl.3): the operator creates the GitHub App before PR 2's register is written (VP step 8) and puts its private key into /secret/agent-platform-workflow-dispatcher-app-key from AWS CloudShell in the production account before PR 3 merges (VP step 15). No Terraform change; SIT gets no key."
  - "PR 3 (terraform/personal): the file passes the trusted-plan HCL screen (Decision 238 cl.4: literal resources, no count, for_each, ? or file read); a new role routes to tf-gated-apply (guard exit 2); the operator approves the gated-apply job in Actions (VP step 18). The rules are ENABLED in production by the same apply, so dispatching starts then. The branch role's ProdLambdaInvokeCI grant on the new function is an in-budget inline-policy update in the same apply."
  - "PR 4: no infrastructure. Its merge wakes deploy-prod-lambdas.yml, which deploys the zip to all three functions (the new function's absent deploy record reads baseline_unknown, Decision 249) and runs the new smoke step (VP step 23)."
  - "Lambda: the data-pipeline.zip artifact (status active, Decision 79) gains one handler and two packages in PR 2 and one function in PR 4; the build, deploy and smoke sequence is VP steps 12, 14 and 23. PR 2's regenerated config/lambda/ducklake/field_semantics.yaml also changes the six active DuckLake artifacts it ships in (ducklake_writer, ducklake_reader, ducklake_maintenance, ducklake_maintenance_smoke, ducklake_telemetry_reader, ducklake_telemetry_writer): deploy-ducklake-lambdas.yml deploys them and VP step 14 reads its smoke, maintenance-smoke, telemetry-twin-smoke and telemetry-smoke jobs by name. Deploys consume the last-green ref (Decision 254 cl.5), so each read-back names the first deploy whose sha has the merge as ancestor."
  - "Holds: terraform/personal PRs are held from merge while Feedback Loop's rec-4913 hold stands (coordinator log, 2026-11-12); rec-4913 itself read closed on 2026-11-12, so VP 1's log read decides whether the hold still stands; PR 3 and PR 4 check the log before merging and wait if the hold is still open."
acceptance_criteria:
  - "Three EventBridge rules in production start terraform-drift.yml, convergence-health.yml and main-canary.yml on main through the dispatcher's bot at their register crons; each workflow keeps its on.schedule (VP steps 19, 20 and test_dispatch_bot_guard.py (b))."
  - "The dispatcher's role reads exactly its one /secret/ parameter by literal ARN and writes its own logs, nothing else; it carries the apply boundary (VP step 19's simulation and the stack test)."
  - "The App holds Actions write and Metadata read on this repository only, and its token cannot approve a pending deployment (VP steps 9 and 21)."
  - "Every dispatchable workflow outside the register refuses a workflow_dispatch run whose github.actor is the bot on each root and status-function job, while a workflow_run child of a bot-started register run still runs; a new dispatchable workflow that neither refuses nor is registered fails the test (test_dispatch_bot_guard.py)."
  - "The SIT copy is switched off three ways: rules DISABLED, the flag false and checked before any secret read, and SIT holds no key; its alarms exist with actions_enabled false (stack test, handler test)."
  - "loop_liveness_stale counts the bot's dispatches of the register's workflows as cadence (VP step 24), and each convergence-health tick runs the three integrity reads with no breach on a clean repository (VP steps 14 and 24)."
  - "Four production alarms exist on the alerts topic and read OK after the first three hours (VP step 24)."
  - "deploy-prod-lambdas.yml deploys and smoke-tests all three functions (VP step 23)."
  - "The Decision, the three settings rows, PC-10, GH-15 with its ledger entry and the three amendment_log entries match the approved sidecar word for word (approved_text verify at the recorded digest, VP step 13); the source_registry rows pass check_source_registry and the field_semantics drift gate (VP steps 11 and 26)."
