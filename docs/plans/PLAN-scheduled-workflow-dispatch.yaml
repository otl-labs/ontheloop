  (a revert's plan destroys them), then revert; the revert's plan destroys the role, its policy, the function, the
  rules, targets, permissions and alarms through tf-gated-apply, and the cron fallback keeps the three loops running.
  The operator then deletes the key parameter from CloudShell and the App's private key on GitHub (or the App itself).
  PR 2: revert it; the guards, sensor extension and integrity reads go, and the Decision is marked by a later Decision
  (Decision text is append-only, Decision 177); the settings and inventory rows return with a new amendment entry. PR 1:
  the pre-staged ARN is harmless if left (a read of a role that does not exist); remove it by a human-directed bootstrap
  apply of a revert.
