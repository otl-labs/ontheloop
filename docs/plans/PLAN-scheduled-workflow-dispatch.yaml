    action: Create
    purpose: >-
      PR 2. GitHub App token helpers, stdlib urllib plus PyJWT; jwt and cryptography imported inside the functions that
      need them (no import-time work). app_jwt(client_id, private_key_pem, now) -> RS256 JWT with iat = now - 60, exp =
      now + 540, iss = client_id. GitHubApi(base="https://api.github.com", timeout=10).call(method, path, token, body) ->
      (status, parsed JSON or None), headers Accept application/vnd.github+json, X-GitHub-Api-Version 2022-11-28 and a
      fixed User-Agent, Authorization "Bearer <token>"; a non-2xx raises GitHubApiError(status, method, path, message)
      whose text carries only the status, the method, the path and the response's message field, never a token, a JWT
      or a header. installation_token(api, jwt, repository, permissions) -> str: GET /repos/{repository}/installation,
      then POST /app/installations/{id}/access_tokens with {"repositories": [<name>], "permissions": permissions}; raises
      unless the response's permissions equal the requested map exactly and repository_selection is "selected".
      revoke(api, token): DELETE /installation/token, raises unless 204. Lives under src/data/handlers so the prod
      deploy gate's src/data/handlers pathspec covers it.
  - file: src/data/handlers/workflow_dispatcher_handler.py
    action: Create
    purpose: >-
      PR 2. handler(event, context) for agent-platform-workflow-dispatcher. Order: (1) an event with no "schedule"
      key imports jwt and cryptography.hazmat.primitives.serialization (so a zip missing either fails the smoke) and
      returns {"status": "smoke", "schedules": [sorted register names]} (the deploy smoke, no secret read, so a SIT
      copy's smoke passes too once SIT has a deploy channel, Decision 252 cl.6); (2) WORKFLOW_DISPATCH_ENABLED != "true"
      returns {"status": "disabled"} before anything else is read, so the SIT copy reads no secret;
      (3) load_register() and look the name up; an unknown name raises ValueError (the Errors alarm); (4) read
      key_parameter with boto3's ssm get_parameter(WithDecryption=True), refusing a name outside /secret/; (5) mint the JWT and an
      installation token for the register's repository with permissions {"actions": "write", "metadata": "read"}; (6)
      GET /repos/{repository}/actions/workflows/{workflow}/runs?created=>=<now minus skip_window_seconds, ISO
      UTC>&per_page=1; a non-zero total_count returns {"status": "skipped", "schedule", "workflow", "recent_run_id"};
      (7) otherwise POST /repos/{repository}/actions/workflows/{workflow}/dispatches with {"ref": register ref,
      "return_run_details": true} and no inputs, accepting 200 or 204, and return {"status": "dispatched", "schedule", "workflow", "workflow_run_id": the
      response's workflow_run_id or None}; (8) revoke the token in a finally block, after any outcome of steps 6-7; a
      revoke failure after a successful dispatch raises too. One log line per outcome, in key=value form
      ("status=<status> schedule=<name> workflow=<file> run_id=<id or none>"), never a token, JWT, key or response
      body. boto3 is imported inside the step-4 read only, so load_register and the CloudShell probe never import it.
      The handler is an exemption from src/data/handlers/CLAUDE.md's "All handlers must accept a force_{param} event
      field for plan-driven re-runs": a field that skipped step 6 would start a workflow inside the skip window, which
      Decision N clause 1 excludes, and a re-run is simply the next tick. An event key other than schedule is ignored. load_register(path=None) parses the register next to the bundle
      root (the same path in the repository and in the zip) and validates it at call time, raising ValueError on: no
      schedules, a workflow not matching ^[a-z0-9-]+\.yml$, ref other than main, key_parameter outside /secret/, a
      bot_login not ending in [bot], skip_window_seconds outside 60-3600, or an aws_cron not of the form cron(...).
