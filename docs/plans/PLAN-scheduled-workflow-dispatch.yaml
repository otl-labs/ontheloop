constraints:
  - "Never put a key value, an account id or an ARN with one in a file, a log, a PR, a comment or the thread (Decision 101). Simulation and plan evidence is markers and counts only. The App's slug, bot login and client id are public."
  - "Agents never apply terraform/bootstrap as a self-directed act: VP step 6 runs in an ADMIN session only after the operator directs it there; terraform/personal applies through tf-gated-apply behind his approval (Decision 126, Decision 144 cl.4)."
  - "Place every sidecar block word for word, filling only {{N}} and {{DATE}}; never edit the sidecar (Decision 246). Any other edit to the bound text fails approved_text verify. The source_registry rows, the size-budget line and the function lists are scope edits outside the sidecar."
  - "No key ever becomes an Actions secret, an Environment secret, a variable or a file in the repository; only the Lambda (at run time) and VP step 21's probe (inside its own process) read the key value."
  - "terraform-drift.yml, convergence-health.yml and main-canary.yml are never edited (rec-5107 is Agents in GitHub's lane on main-canary.yml); each keeps its on.schedule."
  - "Before editing each guarded workflow, re-read the open PRs that touch it; if another project's open PR changes it, ask the operator first. The coordinator posts the file list on the coordinator log when the plan PR opens (the operator's fork 4 condition)."
  - "Never loosen an existing assertion (Decision 235); the one changed assertion (the approved-text render job's if) keeps its main-only condition and gains the prefix."
  - "No new row in the register before rec-5126's 14-day soak ends (Decision N clause 6); rec-5113 adds rows."
  - "terraform/personal/scheduled_workflow_dispatch.tf passes scripts/ci/terraform_hcl_screen.py as it stands on main (Decision 238 cl.4); never widen the screen policy for this plan."
  - "PR 4's build fills weakening_dispositions from code review's stub for any candidate in PR 4's own diff (planned-change citing acceptance_criteria[7]); none is expected, so the plan carries none (a stale entry fails validate_weakening_dispositions)."
  - "No rescue agents or workaround loops (Decision 55); a failed apply is stopped and reported, never retried with -target."
  - "A Class D contract edit outside the sidecar (build-lambda.yaml) adds the amendment_log entry validate_contract_drift asks for, in the file's existing one-line form."
context:
  - "Decision-scout verdict + CITE list (round 1, 2026-11-12): Verdict: FLAGS_FOUND. Decisions triaged: 205 of 205. Roadmap items intersected: 10; CONFLICT: 0; RELATED: 10. Serves: NS.3 3/5. CITE: 250 cl.3, 205 cl.1/cl.3, 237 cl.1-3, 126, 125, 249 cl.2/cl.4, 79, 144 cl.2-3, 212 cl.3, 224 cl.6, 128, 162, 101. Flags and dispositions: WARN 143 cl.1 -- adopted as an accepted residual in the new Decision (clause 5) with the three integrity reads and the approval-bypass probe (VP 21), the operator's fork 3 answer; WARN 252 -- adopted, the SIT copy is built switched off three ways and the untried mint path is recorded against the production promotion item (Decision clause 4), the operator's fork 2 answer; NOTE NS.1 -- adopted, PC-10 in ports.yaml. Full text: /mnt/project-files/scheduled-dispatch/SCOUT-r1.md."
  - "Sign-off: the operator's 'write the plan' (2026-11-12 15:46 UTC) after his fork answers on /mnt/project-files/scheduled-dispatch/PRESENTATION.md: 1 EventBridge rules, not Scheduler; 2 the SIT copy switched off, plus a rec for SIT's own drift and health checks (rec-5127); 3 the Decision 143 gap recorded as an accepted residual in a new Decision; 4 every dispatchable workflow outside the three refuses the bot (option B), 'so long as the coordinator log is updated'; 5 a 14-day soak before tightening the floor (rec-5126) and starting rec-5113. After sign-off the planner corrected one claim in the thread (15:58 UTC): rules still need the one-line bootstrap pre-stage and its admin apply, as every new role has; the deploy-race split into a fourth PR followed in drafting and is told to him with the wording approval ask."
  - "Settled with notice on a blind Fable consult and its follow-up (/mnt/project-files/scheduled-dispatch/ADVICE.md): a dedicated Lambda and role; the key in SSM under /secret/ (Actions write cannot change a gate, Decision 248); github.actor, not triggering_actor, for the guard; the skip window in the Lambda, not a concurrency group on main-canary.yml (rec-5107's lane); deny-by-default with a classification test; the four alarm shapes; the SIT copy disabled, not count-gated, with the flag checked before any secret read and the alarms production-only; the accepted residual routed to a numbered Decision (decision-entry.yaml significance.routing_rule). One departure from the advice, recorded here: its item 6 suggested a guard that fails loudly; the plan uses a job-level if that skips silently, because a failing job on a refused bot dispatch would turn every such attempt red on GitHub and page ci-rca for no defect, while the integrity read (Decision clause 5) already files a High rec on any off-register bot dispatch."
  - "Critique round 1 corrections (2026-11-12): the guard is event-scoped, (github.event_name != 'workflow_dispatch' || github.actor != '<bot>'), because a workflow_run child keeps its upstream's actor: ci-rca.yml runs after Main Canary with the upstream actor (CI RCA run 43262113763, a user upstream; the same for an App bot is inferred), so an actor-only guard would silence ci-rca's red-main diagnosis of every bot-started canary (Decision 73 pt.3, Decision 226), and the integrity read would flag every such child. The integrity read now treats a bot-actor workflow_run run at run_attempt 1 as a chained child and keys re-runs on run_attempt and triggering_actor. ci-rca running claude on a canary failure is a GitHub-originated workflow_run on main, as it is today after a cron canary; the register workflows themselves stay deterministic (Decision clause 1). The Decision's kind is direction, since clause 5 moves Decision 143 clause 1's human gate (decision-kind.yaml tie_break)."
  - "Critique round 2 corrections (2026-11-12): the PR 3 stack is written for the trusted-plan HCL screen (Decision 238 cl.4; scripts/ci/terraform_hcl_screen.py refuses count, for_each, the ? operator and file reads outside its allowlist): three literal rule, target and permission sets and four literal alarms, the crons and periods repeated from the register and held equal by the stack test, rather than widening the code-owned screen policy to read the register. SIT therefore keeps its four alarms with actions_enabled false (the sidecar's clause 4 says so). Actions write can also approve fork pull-request runs, disable any workflow and delete runs and logs: the integrity read now flags any disabled workflow (all 39 are active today), and fork-run approval and run deletion are named in the Decision as accepted residuals. VP 15's metadata check runs as PlatformAdmin (PlatformDev has no ssm:DescribeParameters); VP 17 reads terraform-plan-trusted.yml. The handler asks the dispatch API for return_run_details. ports.yaml's budget line is re-measured at build: if another plan lands a line first, the number moves with the marker."
  - "Critique round 3 corrections (2026-11-12): requirements-fast.txt joins scope with the floor pyjwt[crypto]>=2.13,<3 (tests/validate/test_pytest_diff_runtime_dep_artifact.py requires every requirements.in distribution to be a fast-tier floor or a declared heavy exclusion); PR 3's plan updates three inline policies, aws_iam_role_policy.github_ci_planner and aws_iam_role_policy.github_ci_trusted_plan (both source ci_full_refresh_read, which holds IAMPlatformRolesRead, and each carries a 10,240 B precondition that fails closed at plan time) and aws_iam_role_policy.github_ci_branch (ProdLambdaInvokeCI); the log group is named /aws/lambda/${local.workflow_dispatcher_function}, the only form validate_agent_observability_read_coverage resolves; the not-fired alarms may page once right after the apply, before the first ticks land."
  - "Critique round 4 corrections (2026-11-12, measured from this cloud session): the session's GitHub egress proxy refuses /app, /app/installations, /installation/*, /user/installations, github.com/apps pages and actions/oidc/customization/sub (403 not permitted through this proxy), while actions/runs, actions/workflows and the run approvals paths answer. So the approval-bypass probe is operator step M3 in AWS CloudShell (direct egress, his own identity), with the session reading the approvals record independently; VP 8 and VP 9 rest on the operator's reads of the App and installation pages, and every Lambda mint re-proves the exact permission map; the integrity probe returns 2 on a proxy refusal and the session checks only off_register_run and disabled_workflow, the oidc_subject evidence coming from the convergence-health job log. convergence-health.yml's header (lines 56-62) will still say the sensor asserts the newest event=schedule run; the file is frozen here, so rec-5126's build corrects that comment. Optional hardening not taken: a run_attempt and triggering_actor leg on the guard would refuse bot re-runs too; re-runs stay detected, not refused (Decision clause 5), and the guard stays one expression. A workflow that exists only on a branch is outside the guard test (it reads main); the integrity read sees a bot dispatch of it."
  - "Decision 254 (2026-11-12 15:53 UTC, after the scout and the sign-off) is read and adopted: code deploys consume the last-green ref (cl.5), so VP 14 and VP 23 read the first deploy whose sha has the merge as an ancestor, and PR 3 waits for VP 14 (else its function would be created from a stale data-pipeline.zip); Main Canary skips a head whose full tier is pending, running or under 3 h old (cl.1, rec-5107's build), which turns some dispatched canary runs into quick skips, still a cadence run. No clause of 254 conflicts with this plan."
  - "Decision 237 fit: clause 1 derives a /secret/ name from a Secrets Manager name; this key never had one, so the name follows the /secret/agent-platform-<purpose> form and the grant is the literal ARN (clause 2). It is not in secret_parameters.tf's nine-name map (pinned by tests/test_secret_parameters_expand.py) because Terraform never writes the value and has nothing to copy; rec-5029's SCP must declare the dispatcher role as a /secret/ reader (noted on rec-5029, 2026-11-12). VP 21 (M3) reads the key with the operator's own CloudShell identity, so it runs before that SCP lands; if the SCP lands first, rec-5029's planning names the operator's admin identity as an exception or M3 waits for one."
  - "Why four PRs: PR 1 is the admin-root pre-stage (the apply role's own iam:GetRole read-back after the create); PR 3 creates the function from the S3 object PR 2's deploy shipped, so PR 2's zip must be live first; and the function joins deploy-prod-lambdas.yml's list only in PR 4, because the gate reads an absent deploy record as baseline_unknown and deploys (Decision 249), so listing it before PR 3's apply would make PR 2's own deploy fail on a missing function."
  - "Approvals at build start: approve admin-credential agent_platform_admin -- covers VP 4 (bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin), VP 5 and VP 6 command A (the materialisation's aws ssm get-parameter --name /secret/agent-platform-terraform-personal-tfvars --with-decryption --profile agent_platform_admin, then terraform -chdir=<worktree>/terraform/bootstrap init, plan and show on the bootstrap root's admin profile), VP 6 command B's admin profile and command C, VP 19 (aws sts get-caller-identity, aws iam simulate-principal-policy, aws lambda get-function-configuration, aws events list-rules and one aws lambda invoke with the {} smoke payload, each with --profile agent_platform_admin), VP 15's check (aws ssm describe-parameters with --profile agent_platform_admin, metadata only); approve secret-read /secret/agent-platform-terraform-personal-tfvars -- the one read in VP 5 and VP 6 command A, which writes the four bootstrap values to the gitignored terraform/bootstrap/terraform.bootstrap.tfvars and prints none. Each is a session line the operator writes in the ADMIN thread itself (approvals relayed by the coordinator do not count). VP 6 command B (the bootstrap apply) is tf-state-change, asked when command A prints its exact line. The build also asks, in the same first message, for the operator's word on VP 8 (M1, creating the App), VP 15 (M2, putting the key) and VP 21 (M3, the approval-bypass probe in CloudShell, which reads the key with his own identity there)."
  - "V3 resolution: the posted pre-merge gate evidence for PR 1's head (VP step 5) and PR 3's routed plan (VP step 17) substitute for pre-merge post-deploy evidence; the behavioural acceptance (Decision 48) is the post-merge walk of VP steps 6, 14, 18, 19, 20, 21, 23 and 24, evidenced by counts-only comments on the merged PRs. The approval-bypass probe needs a live token, so it runs after PR 3's apply."
