schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: scope-boundary-normalised-base-compare
intent: >-
  Unblock the build of PLAN-decisions-md-clause-qualifier-grammar (and so the revival of PR #1393) by fixing a false
  positive in validate_scope_boundary's prohibited-field arm at root cause: _check_prohibited_field_edits compares the
  base plan as raw YAML against the working plan as PlanDocument.model_dump(), so a scope row carrying
  `new_imports: []` (dropped by ScopeEntry's omit-empty serializer) or a quoted VP step id (int-coerced by
  VerificationStep) reads as a prohibited edit on the bare implementation_declared flip. The base side is normalised
  through the same PlanDocument model, so both sides compare in one canonical form, and the check stays fail-closed for
  real scope, acceptance_criteria and VP command/expected/expected_literals edits.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-scope-boundary-normalised-base-compare.yaml
phase: >-
  ad_hoc_rec (rec-3435; soft-warn category, no tier_item claimed, so the Tier Item Freshness Gate is skipped). Claims,
  moves and closes no tier_item criterion.
scope:
  - file: scripts/checks/verification/validate_scope_boundary.py
    action: Modify
    purpose: >-
      _check_prohibited_field_edits normalises the base-ref plan through PlanDocument.model_validate(...).model_dump()
      before both comparison arms (flat top-level fields and verification_plan[] per-step fields), so base and working
      are the same canonical form. A base payload that parses but fails PlanDocument validation appends a loud
      scope-boundary finding naming the plan and the validation error (fail-closed: the arm cannot prove no prohibited
      edit), never a silent skip and never a raise (Decision 55). The absent/unparseable-at-base skip
      (_plan_content_at_ref returning None) is unchanged. The function docstring names the normalised comparison.
  - file: tests/checks/verification/validate_scope_boundary/test_enforcing_leg.py
    action: Modify
    purpose: >-
      Adds four TestEnforcingLeg nodes: test_empty_new_imports_at_base_is_not_a_scope_edit (base scope row carries
      new_imports: [], the only edit is the flip; asserts no prohibited plan-field finding -- red against today's
      code); test_quoted_step_ids_at_base_match_integer_working_steps (rec-3435's acceptance node: base VP step ids
      quoted strings, working ids ints, flip only; asserts no 'deleted' and no prohibited finding -- red against
      today's code); test_genuine_prohibited_edit_still_caught_with_empty_new_imports, parametrized over one edit per
      prohibited sub-field (scope[].file, scope[].action, scope[].purpose, an added scope row, acceptance_criteria,
      verification_plan[].command, .expected, .expected_literals) on a plan whose base and working both carry
      new_imports: [] -- asserts the matching prohibited finding for every case, green before and after (the
      fail-closed guard, and the Decision 187 round-trip pin: a future lossy PlanDocument serializer or coercion on a
      prohibited field reddens its case); test_schema_invalid_base_plan_fails_closed (base
      parses as a dict but fails PlanDocument validation; asserts a scope-boundary finding naming the plan -- red
      against today's code, which compares the raw dict and reports nothing).
bundled_recommendations:
  - rec-3435
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A resolved plan whose base scope row carries new_imports: [] and whose only diff is implementation_declared: true
    yields no prohibited plan-field finding.
  - >-
    A resolved plan whose base VP step ids are quoted strings and whose working ids are ints, with the flip as the only
    semantic edit, yields no 'deleted' and no prohibited plan-field finding (rec-3435 acceptance).
  - >-
    An edit to any prohibited sub-field (scope file/action/purpose, an added scope row, acceptance_criteria, VP
    command/expected/expected_literals) on a plan carrying new_imports: [] is still reported as a prohibited edit; every pre-existing prohibited-edit node in test_enforcing_leg.py still passes unchanged.
  - >-
    A base plan that parses but fails PlanDocument validation yields a loud scope-boundary finding, never a silent pass
    and never an uncaught exception.
  - >-
    Run against the live PLAN-decisions-md-clause-qualifier-grammar.yaml with its flip applied in a scratch worktree of
    origin/main, validate_scope_boundary reports no prohibited plan-field finding.
  - rec-3435 reads status closed after the squash merge (Resolves trailer).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Empty new_imports at base is not a scope edit (the reported false positive).
    command: >-
      bin/venv-python -m pytest
      tests/checks/verification/validate_scope_boundary/test_enforcing_leg.py::TestEnforcingLeg::test_empty_new_imports_at_base_is_not_a_scope_edit
      -q
    expected: exit 0. Before the change the node does not exist (pytest exits 4); written against today's code it fails
      with "top-level field 'scope' changed from base".
    expected_literals:
      - 1 passed
    fix_if: The scope finding persists -- the base side is still compared raw, or only one arm was normalised. The node
      passes against today's code -- the fixture's base plan does not actually carry new_imports as an explicit empty
      list (yaml.dump of the dict must emit it).
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-empty-new-imports-not-scope-edit
  - step: 2
    phase: pre-deploy
    action: Quoted step ids at base match integer working steps (rec-3435 acceptance node).
    command: >-
      bin/venv-python -m pytest
      tests/checks/verification/validate_scope_boundary/test_enforcing_leg.py::TestEnforcingLeg::test_quoted_step_ids_at_base_match_integer_working_steps
      -q
    expected: exit 0. Before the change the node does not exist; against today's code it fails with a "was deleted"
      finding per base step.
    expected_literals:
      - 1 passed
    fix_if: A "was deleted" finding -- the per-step arm still keys base steps by raw YAML type. The node passes against
      today's code -- the base fixture's step ids are not quoted strings in the committed YAML.
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-quoted-step-ids-match
  - step: 3
    phase: pre-deploy
    action: Every prohibited sub-field edit is still caught when an empty new_imports list is present (fail-closed guard, Decision 187 round-trip pin).
    command: >-
      bin/venv-python -m pytest
      tests/checks/verification/validate_scope_boundary/test_enforcing_leg.py::TestEnforcingLeg::test_genuine_prohibited_edit_still_caught_with_empty_new_imports
      -q
    expected: exit 0 before and after the change, 8 parametrized cases passing (the guard must not go green-by-weakening).
    expected_literals:
      - 8 passed
    fix_if: A case reports no finding -- the normalisation dropped or equalised a real difference on that sub-field
      (compare the full dumped field, never only the file set); the PlanDocument serializer is lossy on it.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Green before and after by design, so the red-before replay a graduate step gets at plan-PR
      time would fail it; it runs in every --pre affected set touching validate_scope_boundary and in every full tier.
  - step: 4
    phase: pre-deploy
    action: A schema-invalid base plan fails closed.
    command: >-
      bin/venv-python -m pytest
      tests/checks/verification/validate_scope_boundary/test_enforcing_leg.py::TestEnforcingLeg::test_schema_invalid_base_plan_fails_closed
      -q
    expected: exit 0. Before the change the node does not exist; against today's code it fails because no finding is
      reported.
    expected_literals:
      - 1 passed
    fix_if: No finding -- the validation error is swallowed into the None-means-absent skip. An uncaught
      ValidationError -- the model_validate call is outside the try.
    hermetic: true
    graduation: graduate
    graduation_check_id: scope-boundary-schema-invalid-base-fails-closed
  - step: 5
    phase: pre-deploy
    action: Whole validate_scope_boundary test package, including every pre-existing prohibited-edit node.
    command: bin/venv-python -m pytest tests/checks/verification/validate_scope_boundary -q
    expected: exit 0, every node passes.
    fix_if: A pre-existing prohibited-edit node (acceptance_criteria, VP command, VP step deletion) fails -- the change
      weakened an arm; restore it, never edit the old test.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Live replay on the blocked plan -- in a scratch worktree of origin/main, apply only the implementation_declared
      flip to PLAN-decisions-md-clause-qualifier-grammar.yaml and run the check with the plan injected.
    command: >-
      W=$(mktemp -d) && git worktree add -q --detach "$W" origin/main &&
      P=docs/plans/PLAN-decisions-md-clause-qualifier-grammar.yaml &&
      bin/venv-python -c "import sys,yaml; p=sys.argv[1]; d=yaml.safe_load(open(p)); d['implementation_declared']=True;
      open(p,'w').write(yaml.safe_dump(d, sort_keys=False))" "$W/$P" &&
      bin/venv-python -c "import sys; from pathlib import Path;
      from scripts.checks.verification.validate_scope_boundary import validate_scope_boundary; f=[];
      validate_scope_boundary(f, plan_paths=[sys.argv[2]], changed_files=[sys.argv[2]], root=Path(sys.argv[1]));
      bad=[x for x in f if 'prohibited plan-field' in x]; print('PROHIBITED', len(bad)); [print(x) for x in bad]"
      "$W" "$P"; rc=$?; git worktree remove --force "$W"; exit $rc
    expected: Prints PROHIBITED 0. Against today's code it prints PROHIBITED 1 with the 'scope' finding (measured at
      planning time). If the plan has already been built on main (flip already true), the step still prints PROHIBITED 0.
    fix_if: PROHIBITED 1 naming 'scope' -- the fix did not reach the flat-field arm. Any other prohibited finding --
      the safe_dump rewrite changed a prohibited field's semantics; compare the dumped fields to locate it.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Corpus behaviour preservation -- every docs/plans/PLAN-*.yaml validates under PlanDocument, so no merged plan
      newly trips the fail-closed branch at its own build.
    command: >-
      bin/venv-python -c "from pathlib import Path; from scripts.contract_rules import parse_yaml;
      from scripts.roadmap.plan_document import PlanDocument; bad=[];
      [bad.append(p.name) for p in sorted(Path('docs/plans').glob('PLAN-*.yaml'))
      if not (lambda r: (PlanDocument.model_validate(r), True))(parse_yaml(p.read_text(encoding='utf-8')))];
      print('CORPUS_VALID', len(list(Path('docs/plans').glob('PLAN-*.yaml'))), 'bad', bad)"
    expected: Prints CORPUS_VALID with the plan count (668 at planning time, about 2 s) and an empty bad list; a
      ValidationError traceback names the plan that would newly fail closed.
    fix_if: A traceback -- that plan would fail closed at its own build; stop and report it (amend that plan, never relax
      the branch).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: Fast tier on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0.
    fix_if: Any red -- diagnose on the branch (AGENTS.md Merge protocol).
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Full tier pre-handoff, backgrounded with a 2 h limit from the top-level session.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: --verify-head reports a PASS for the pushed HEAD.
    fix_if: Any red -- fix on the branch; never read a pipe's exit status as the verdict.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: rec-3435 closed after the squash merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      rows,_=fetch_recs_by_ids(make_reader(), ['rec-3435']); print(rows[0]['id'], rows[0]['status'])"
    expected: Prints rec-3435 closed.
    fix_if: Still open -- the squash body lacked the Resolves paragraph, or the closure job failed; read the ci.yml
      closure job log.
    hermetic: false
test_obligations:
  - source: scripts/checks/verification/validate_scope_boundary.py
    behavior: The prohibited-field arm compares base and working plans in one PlanDocument-normalised form, and fails
      closed on a schema-invalid base.
    verification_step: 1
    test_selector: tests/checks/verification/validate_scope_boundary/test_enforcing_leg.py::TestEnforcingLeg::test_empty_new_imports_at_base_is_not_a_scope_edit
    red_green_expectation: red before (node absent; against today's code the 'scope' false positive), green after.
  - source: tests/checks/verification/validate_scope_boundary/test_enforcing_leg.py
    behavior: The quoted-step-id shape (rec-3435) and the schema-invalid-base fail-closed shape stay guarded.
    verification_step: 2
    test_selector: tests/checks/verification/validate_scope_boundary/test_enforcing_leg.py::TestEnforcingLeg::test_quoted_step_ids_at_base_match_integer_working_steps
    red_green_expectation: red before (node absent; against today's code 'was deleted' findings), green after.
constraints:
  - >-
    Never weaken the gate (Decision 181, Decision 235): no prohibited field leaves the contract, no arm is skipped, no
    existing test is edited or deleted; the only behaviour removed is the false positive between semantically equal
    plans.
  - No change to scripts/roadmap/plan_document.py (the omit-empty serializer stays), docs/contracts/implement-scope-boundary.yaml
    or any other check.
  - No rescue agents or workaround loops (Decision 55); a malformed base is a reported finding, never a raise.
  - No SLOC budget raise (test_enforcing_leg.py is 300 lines, validate_scope_boundary.py 358; both stay under 500).
context:
  - >-
    Decision-scout verdict + CITE list: FLAGS_FOUND (round 1); CITE Decision 181, Decision 235, Decision 59, Decision 187.
    "Decisions triaged: 194 of 194". "Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2" (T2.54, T4.23, prefix-only).
    Flag Decision 187 [NOTE] (head schema as the lens on the base plan could hide a lossy-serializer edit) -- resolved by
    the operator (2026-11-02): VP step 3's parametrized round-trip pin over every prohibited sub-field.
  - >-
    Evidence: the blocked implementer measured scope[0] of PLAN-decisions-md-clause-qualifier-grammar.yaml differing only
    on new_imports ([], None); reproduced at planning time (raw==dump False, normalised==dump True). Corpus sweep at
    planning time: 668 plans, 0 fail PlanDocument validation, 1 carries an explicit new_imports: [] today (the other
    instance, PLAN-plan-corpus-walkers-libyaml, was amended to drop the key).
  - >-
    rec-3435 carries all three evidenced shapes (quoted step ids, default-added field, explicit empty list); its filed
    acceptance names the pre-decomposition path tests/checks/verification/test_validate_scope_boundary.py, which no longer
    exists, so this planning session retargets it to the step 2 node via update_rec before the plan PR merges.
  - >-
    Gotcha: the test fixtures write plans with yaml.dump(dict), so the quoted-step-id fixture must write the base step
    as the string "1" in the dict (yaml.dump quotes it) and the working step as int 1.
  - >-
    The planning skill template's empty new_imports example line steers authors to the empty-list shape; after this fix
    that shape is harmless, so the skill is not edited.
  - "fork: compare form | chosen: normalise base through PlanDocument (both sides canonical) | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: scope"
  - "fork: Decision 187 flag | chosen: parametrized prohibited-sub-field round-trip pin | class: asked | precedent: none | precedent_kind: none | reversible: yes | persisted: scope, verification_plan"
  - "fork: fail-closed on schema-invalid base | chosen: loud finding (Decision 55) | class: consistency-only | precedent: _enforce's malformed-plan finding | precedent_kind: code | reversible: yes | persisted: scope"
  - "red_overlap verdict (planning time): clear -- no open reds."
  - Planning-session owner is this session, which lands the plan PR and hands the slug to the coordinating session.
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections read
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Tests first: add the four TestEnforcingLeg nodes named in the test file's scope row, reusing the conftest helpers
    (_init_repo, _write_contract, _plan_dict, _commit_all, _git). Confirm nodes 1, 2 and 4 fail against today's source
    and node 3 passes, then continue.
  - >-
    In _check_prohibited_field_edits, after the None check, normalise the base: try
    PlanDocument.model_validate(base_content).model_dump(); on ValidationError (or any Exception, BLE001-annotated)
    append "scope-boundary {plan_rel}: base plan at {base} fails PlanDocument validation, so the prohibited-field arm
    cannot prove no prohibited edit: {exc}" plus the row's disposition, and return. Import PlanDocument lazily via the
    same sys.path seam _common.load_plan uses, or at module top if the import graph allows (validate_pre_glob_closure
    must stay green; scripts/roadmap/plan_document.py is already reachable through _common.load_plan). Update the
    docstring.
  - Execute Verification Plan steps 1-9 -- loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
  - Code review via a fresh code-review subagent; fix blocking findings and rerun steps 1-8.
  - >-
    Commit Flow per the implement skill: flip implementation_declared, carry "Resolves: rec-3435" in the squash body,
    rebase, push, PR, subscribe, merge on green, then run VP step 10.
  - "Report: what was implemented, verification results, rec-3435 closure read-back."
rollback: Revert the squash commit; the arm returns to the raw-versus-dump comparison and its false positives.
