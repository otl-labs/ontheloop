  - {gate: wording-check, round: 1, verdict: PASS, digest: b58408954b0c5abcf6211f319697b861756ffecb4112e565a7749f7c2ec2305f, base: 3a857614db3b0f1428b4f3cd40ff6a5782c966cc, selection: complete}  # pragma: allowlist secret
