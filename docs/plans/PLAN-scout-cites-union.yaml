      - {id: SCU2-02, severity: nit, origin: mechanical, anchor: "context[2]", subject: "stdout readers include the cli-deterministic registry entry; three shards, not two", disposition: applied-wording}
      - {id: SCU2-03, severity: nit, origin: judgement, anchor: "execution_steps[3]", subject: "prose budget edit only if the applied bytes differ from net 0; growth needs compaction, not a raise", disposition: build-note}
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Set implementation_declared: true in this plan file in the build commit."
  - "scripts/roadmap/plan_fingerprint.py: add the cites= line to _run's default output. Pre: none. Post: VP 1."
  - "tests/test_plan_fingerprint.py: add the acceptance node and rename and tighten the CLI node. Post: VP 1, VP 2."
  - "Re-measure .claude/skills/planning/SKILL.md; lower its config/prose_budgets.yaml entry only if the file shrank (ratchet down). Edit tests/checks/roadmap/test__plan_rescout_barrier.py:326 to the first stdout line. Post: VP 2."
  - "Apply the sidecar's four after blocks word for word (plan.md, the two SKILL.md lines, the test pin). Post: VP 2, VP 3."
  - "CLOSURE (implement skill Commit Flows): commit with Resolves: rec-5689; rebase; VP 4; push; PR titled build(scout-cites-union); code review in a fresh context; merge on PROCEED and green CI with Resolves: rec-5689 in the squash body; then VP 5."
  - "In the build commit, append to weakening_dispositions: [test-removed] tests/test_plan_fingerprint.py::test_cli_prints_one_line_and_is_deterministic (refactor, acceptance_criteria[1], renamed and tightened) and [assertion-changed] tests/checks/roadmap/test__plan_rescout_barrier.py::test_barrier_value_equals_the_cli_digest (planned-change, acceptance_criteria[1]); plan-time entries may name only sidecar-created candidates."
  - "Build notes from critique r2 (not plan edits): SCU2-01 the plan.md after-text stays word for word as approved; SCU2-02 run the scout-input-fingerprint-cli-deterministic registry check once after the CLI change; SCU2-03 if SKILL.md's measured bytes differ from net 0, re-measure before committing, and growth needs compaction, never a raise."
  - "Report: what was implemented, verification results, run ids."
rollback: Revert the build PR; the CLI prints one line again and the instruction text returns to main's wording.
