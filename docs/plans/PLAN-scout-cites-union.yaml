schema_version: 7
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: scout-cites-union
intent: >-
  rec-5689: a cite the decision scout demotes to RELATED must not force a re-scout. Keep the union rule that the
  exit-criteria ledger already defines (the recorded fingerprint is the scouted input with the scout's CITE ids merged
  into cites). plan_fingerprint prints the merged cites list on a second line beside the fingerprint, and the planning
  skill and plan.md Step 6 tell the planner to set the plan's cites to that printed list, never to the --with-cites
  tokens alone, and name what moves the fingerprint.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-scout-cites-union.yaml
phase: ad_hoc_rec (soft-warn exception category) rec-5689 agent friction; no tier_item criterion claimed.
closes_criteria: []
cites: [dec:229, dec:246, dec:279]
amends: []
introduces: []
scope:
  - file: scripts/roadmap/plan_fingerprint.py
    action: Modify
    purpose: >-
      _run's default (non --json) output gains a second line, cites=<the payload's cites tokens joined by ",">, after
      the unchanged scout_input_fingerprint= line; an empty list prints "cites=". --json output, the payload, the
      digest, exit codes and FINGERPRINT-ERROR handling are unchanged. projection() and plan_edges are not edited, so
      scripts/personas/rescout.py computes exactly what it computes today.
    new_imports: []
  - file: tests/test_plan_fingerprint.py
    action: Modify
    purpose: >-
      Add test_scout_dropped_cite_does_not_force_rescout (rec-5689's acceptance node): a plan citing dec:211, dec:212
      and dec:229, run through pf.main with --with-cites dec:229,dec:246 (the scout dropped 211 and 212 and added 246);
      the plan's cites are then set to the printed cites= tokens and pf.main runs again with no --with-cites; the two
      printed fingerprints are equal, and the printed cites hold dec:211 and dec:212. A second leg shows the old
      instruction's result differs: cites set to the --with-cites tokens alone gives a different fingerprint. A third
      leg: --with-cites "" and a token already in the plan's cites each print the plan's own cites unchanged.
      test_cli_prints_one_line_and_is_deterministic is renamed test_cli_prints_fingerprint_and_cites_lines and asserts
      exactly two lines: the first is today's exact-length fingerprint assertion, the second is cites= with the
      fixture plan's tokens; determinism stays asserted.
    new_imports: []
  - file: .claude/skills/planning/SKILL.md
    action: Modify
    purpose: >-
      Decision Scout Gate section only, word for word from sidecar blocks planning-skill-scout-convergence ("the plan's
      `cites` holds the `dec:` tokens fed to `--with-cites`" becomes "the plan's `cites` is the printed `cites=` line")
      and planning-skill-gate-error-cites (a missing cites= line is an incomplete gate). The two edits net 0 bytes, so the
      file stays at its prose budget; the build re-measures it and lowers the config/prose_budgets.yaml entry only if it
      shrank (ratchet down, sanctioned by implement-scope-boundary.yaml's prose_budgets_ratchet_down row). No edit inside
      the gated Alignment Sign-off or Plan Lint sections.
  - file: .claude/commands/plan.md
    action: Modify
    purpose: >-
      Step 6 Decision Scout paragraph (sidecar block plan-md-step6-cites): the draft's cites is set to the printed cites=
      line (own cites plus the scout's CITE ids, so a dropped cite stays), and the paragraph names the hashed inputs that
      move the fingerprint and says context and verification_plan never do. plan.md is measured-only (no prose budget).
  - file: tests/test_planning_skill_scout_fingerprint.py
    action: Modify
    purpose: >-
      test_planning_skill_rescouts_on_scout_input_fingerprint_change, word for word from sidecar block
      skill-test-cites-pin: the old cites assertion moves to "the plan's `cites` is the printed `cites=` line", and new
      assertions require "`cites=` line printed under it", "a cite the scout left out stays" and "never context,
      verification_plan" in _step(_PLAN_MD, 6), and that "write the exact `dec:` tokens" is absent from it.
  - file: tests/checks/roadmap/test__plan_rescout_barrier.py
    action: Modify
    purpose: >-
      test_barrier_value_equals_the_cli_digest (line 326) parses the CLI's stdout; it takes the first line
      (out.splitlines()[0].removeprefix("scout_input_fingerprint=")) instead of the whole stripped output, keeping the
      exact equality against the barrier.
  - file: docs/plans/approved/scout-cites-union.yaml
    action: Create
    purpose: >-
      Approved-text sidecar, four blocks: plan.md Step 6 (gated, Decisions 246 and 279), the two SKILL.md Decision
      Scout Gate edits and the wording-pin test line (both ungated, bound so the wording check's tree holds every word
      the test pins).
bundled_recommendations: [rec-5689]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "tests/test_plan_fingerprint.py::test_scout_dropped_cite_does_not_force_rescout passes; on main it does not exist, and its legs fail without the cites= line."
  - "The default CLI output is exactly two lines, scout_input_fingerprint=v1:<64 hex> then cites=<tokens>; --json output and the digest are unchanged for every existing fixture."
  - "plan.md Step 6 and the planning skill's Convergence rule match the approved sidecar word for word (approved_text verify OK)."
  - "scripts/roadmap/plan_edges.py and scripts/personas/rescout.py are byte-identical to main."
  - "rec-5689 is closed by the merge's Resolves trailer, its acceptance node passing."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The acceptance node passes.
    command: bin/venv-python -m pytest tests/test_plan_fingerprint.py::test_scout_dropped_cite_does_not_force_rescout -q
    expected: exit 0 with 1 passed; on main the node does not exist
    fix_if: a leg fails; read which fingerprint or cites line differs
    hermetic: true
    expected_literals: ["1 passed"]
    graduation: waive
    graduation_waiver_reason: tests/test_plan_fingerprint.py runs in every fast and full tier already; a shard would duplicate it.
  - step: 2
    phase: pre-deploy
    action: The rest of both test files pass and the untouched consumers are unchanged.
    command: >-
      bin/venv-python -m pytest tests/test_plan_fingerprint.py tests/test_planning_skill_scout_fingerprint.py
      tests/personas/test_rescout.py tests/checks/roadmap/test__plan_rescout_barrier.py -q && git diff --exit-code origin/main -- scripts/roadmap/plan_edges.py
      scripts/personas/rescout.py
    expected: exit 0, no failures, and an empty diff
    fix_if: an existing node fails, or either consumer file differs from main
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Reads origin/main, so it is not hermetic; the files' own nodes already run in every tier.
  - step: 3
    phase: pre-deploy
    action: The instruction edits match the approved sidecar.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug scout-cites-union
    expected: OK, with the digest recorded on the wording-check gate row
    fix_if: a block mismatches; copy the sidecar's after text exactly, never edit the sidecar
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A per-slug check of this build's own sidecar; validate_merge_step already enforces the sidecar binding on the build PR.
  - step: 4
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it with Bash run_in_background and a 2 h timeout from the top-level session.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure; fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion).
  - step: 5
    phase: post-deploy
    action: rec-5689 is closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-5689']); print([(r['id'], r['status']) for r in rows])"
    expected: rec-5689 closed, after the closure job runs on the merge commit
    fix_if: rec-5689 still open; read the closure job log for the refusal marker and fix its cause, never a direct status write
    hermetic: false
test_obligations:
  - source: scripts/roadmap/plan_fingerprint.py
    behavior: the printed cites= list, written into the plan, reproduces the scout's printed fingerprint even when the scout dropped a plan cite
    verification_step: 1
    test_selector: tests/test_plan_fingerprint.py::test_scout_dropped_cite_does_not_force_rescout
    red_green_expectation: red before (the node does not exist and main prints no cites= line), green after
  - source: tests/test_plan_fingerprint.py
    behavior: the default CLI output is exactly the fingerprint line and the cites line
    verification_step: 2
    test_selector: tests/test_plan_fingerprint.py::test_cli_prints_fingerprint_and_cites_lines
    red_green_expectation: red before (main prints one line), green after
  - source: tests/test_planning_skill_scout_fingerprint.py
    behavior: plan.md Step 6 and the skill's Convergence rule keep the copy-the-printed-list wording
    verification_step: 2
    test_selector: tests/test_planning_skill_scout_fingerprint.py::test_planning_skill_rescouts_on_scout_input_fingerprint_change
    red_green_expectation: red before (main has the old wording), green after
weakening_dispositions:
  - candidate: "[assertion-changed] tests/test_planning_skill_scout_fingerprint.py::test_planning_skill_rescouts_on_scout_input_fingerprint_change"
    disposition: planned-change
    cite: "acceptance_criteria[2]"
constraints:
  - "Union semantics stay as they are: projection(), plan_edges.extract_edges and the exit-criteria ledger's plan_scout_input_fingerprint text are not edited."
  - "The renamed CLI test keeps the exact-length fingerprint assertion and determinism and adds an exact second-line assertion; nothing is loosened (Decision 235)."
  - "Instruction text and the pinned test line change only as the sidecar's after blocks say; the gated Alignment Sign-off and Plan Lint sections of SKILL.md are untouched."
  - "No rescue agents or workaround loops (Decision 55)."
context:
  - "rec-5689 case: scout round 3 of PLAN-apache-flip-precedes-client-work dropped dec:211 and dec:212; synced plan v1:30b81a68 vs scouted v1:f5058ca2. Union is at scripts/roadmap/plan_edges.py:75; the replace reading came from plan.md:63 and SKILL.md:272."
  - "Fork settled: blind Fable consult (/mnt/project-files/scout-cites-union/advisor-brief/ADVICE.md) advised union, because exit-criteria-ledger.yaml:329-330 defines the merged value and replace would stop scripts/personas/rescout.py seeing plan cites the persona did not CITE; it named the hand copy as the frame-lock and proposed the printed cites= line. Operator chose 'Tool prints merged list' on the card and wrote 'write the plan', 2026-11-26 19:09Z."
  - "Two readers parse the CLI's stdout (grep for scout_input_fingerprint= over scripts, .github, .claude, src, tests and config): tests/checks/roadmap/test__plan_rescout_barrier.py:326 moves to the first line; registry entry scout-input-fingerprint-cli-deterministic matches line by line and still passes with two lines. No production code parses it; the scout subagent prints it and planners copy it."
  - "PR #2505 (rec-5654 build, open at 2026-11-26 19:00Z) touches none of this plan's files."
  - "Decision-scout verdict NO_FLAGS (round 2, after the SCU1-01 scope row). CITE: 229, 246, 279. CONTRADICT: none. SPIRIT: none. RELATED: 262, 205, 235, 181, 189, 244, 127, 128, 233. Decisions triaged: 236 of 236. Roadmap items intersected: 4; CONFLICT: 0; RELATED: 4. Serves: NS.4 3/5."
  - "Graduated shards planning-skill-rescouts-on-fingerprint (file-level node_id), scout-input-fingerprint-completeness and plan-rescout-barrier-rules are kept unchanged: none names a renamed node, and all three keep running the edited files."
  - "docs/plans/PLAN-bootstrap-trusted-pr-plan.yaml (unbuilt) also scopes .claude/skills/planning/SKILL.md; whichever builds second rebases and re-measures the prose budget."
  - "Gated wording: plan.md is gated whole (approval-routing.yaml md_sections plus whole-file binding), so its edit rides docs/plans/approved/scout-cites-union.yaml with the ungated SKILL.md and test-pin blocks; the operator approves the approval run. The sidecar touches no HASHED_BLOCK_FILES entry, so it does not move the fingerprint."
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: NO_FLAGS, scout_input_fingerprint: "v1:0bf68f01bf5904148ec89777d4c7869b20290c932c52270d633e59fa7991043d"}  # pragma: allowlist secret
  - gate: plan-critique
    round: 1
    verdict: REVISE
    blocking: 2
    nits: 3
    findings:
      - {id: SCU1-01, severity: blocking, origin: mechanical, anchor: "scope", subject: "test__plan_rescout_barrier.py:326 parses the CLI stdout; add to scope, take the first line", disposition: fixed}
      - {id: SCU1-02, severity: blocking, origin: mechanical, anchor: "gate_rounds", subject: "no wording-check PASS row for the sidecar", disposition: fixed}
      - {id: SCU1-03, severity: nit, origin: judgement, anchor: "verification_plan[step=3].graduation", subject: "not-applicable on a single command step; waive with a reason", disposition: fixed}
      - {id: SCU1-04, severity: nit, origin: judgement, anchor: "scope[docs/plans/approved/scout-cites-union.yaml].purpose", subject: "sidecar text says two blocks; align with the bound blocks", disposition: fixed}
      - {id: SCU1-05, severity: nit, origin: judgement, anchor: "sidecar plan-md-step6-cites", subject: "'that line' antecedent; Gate-error names no cites= line", disposition: fixed}
