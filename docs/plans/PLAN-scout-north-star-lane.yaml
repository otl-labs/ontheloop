- source: config/prose_budgets.yaml
  behavior: Both entries equal the measured bytes, with no marker added.
  verification_step: 8
  command: bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as p; from scripts.checks.prose.prose_budget_raises
    import validate_prose_budget_raises as r; f=[]; p(f); r(f); assert not f, f; print('BUDGETS_OK')" && test "$(wc -c < .claude/skills/decision-scout/SKILL.md)"
    -le "$(git show origin/main:.claude/skills/decision-scout/SKILL.md | wc -c)" && test "$(wc -c < .claude/skills/plan-critique/SKILL.md)"
    -le "$(git show origin/main:.claude/skills/plan-critique/SKILL.md | wc -c)" && ! grep -n 'decision-scout/SKILL.md' config/prose_budgets.yaml
