constraints:
- 'Approved text: every byte the build writes to .claude/skills/decision-scout/SKILL.md, .claude/skills/plan-critique/SKILL.md and docs/contracts/instruction-architecture.yaml
  comes from docs/plans/approved/scout-north-star-lane.yaml; only {{DATE}} is filled (the build day). Never edit the sidecar in the
  build; any other wording needs Benjamin''s new approval.'
- 'No budget raise: Decision 165 authorizes a marker key-side and Decision 243''s body names no .claude/skills path, so a dec-243 marker
  fails validate_prose_budget_raises. Applying the sidecar shrinks the scout by 2 bytes and plan-critique by 17 from whatever base the
  build reads; any other delta means the text differs from the sidecar. Compaction spends the scout''s last slack; the next lane addition
  needs a Decision naming the skill path.'
- 'Approval provenance: PLAN-approved-text-operator-approval (on main at 211f307c, unbuilt) makes PR CI read GitHub''s record of the
  operator''s sidecar approval: validate_merge_step on this build''s PR, and validate_plan_documents on this plan''s PR if that plan
  builds first. If this sidecar merged after its GRANDFATHER_REF, PR CI reports provenance MISSING on an unchanged digest (that plan''s
  accepted window): ask the operator, through the coordinator, to approve this sidecar once on its gate. A session''s --pre printing
  UNVERIFIED (advisory) is expected; an UNVERIFIED in PR CI that persists on one re-run is a lookup failure to report, not an approval
  to ask for. Neither is a wording mismatch or a reason to edit the sidecar; approved_text verify (VP 5) reads no provenance.'
- 'file-router.yaml is not bound by the sidecar: its edit is one allowlist line, one log row and a words-unchanged compaction, the same
  mechanical shape PLAN-north-star-tier-a used. No route, rule or other entry changes.'
- 'Sibling overlap: PLAN-retire-strategic-plans-and-legacy-executor (build #1806, open) also edits plan-critique and instruction-architecture.yaml,
  on other lines. This sidecar''s log row is anchored below the 2026-11-02 row, which that sidecar anchors on, so both apply in either
  build order (validate_contract_drift reads new rows, not their order).'
- 'The CLI is pure-local, credential-free and read-only (Decision 105 R1-R3 guard, scope_projection.py precedent): no warehouse or portal
  call, no write, no import-time I/O, under 500 SLOC.'
- 'Standing guards on the scout pass unchanged and are never edited: scout-rationale-relocated-not-duplicated, decision-scout-spirit-section-present,
  decision-scout-bounded-read-protocol, no-whole-decisions-read-instructions, plan-obligations-critic-consumes-report, tests/test_scope_projection.py
  (Decision 244 cl.1).'
- 'A north star never raises CONTRADICT or BLOCK, and serves never makes a Decision CITE by itself (decision-entry.yaml serves semantics:
  advisory; carried_by is the authoritative link).'
- 'Out of scope: the planning skill (the copy instruction sits in the scout''s template, which the planning agent reads verbatim); applying
  the partial order at plan time (Q2); the scout verifying a drafted Decision''s serves claim and T4.32 c4''s fingerprint inputs (rec-4915,
  rec-4916); rec-curator''s north_star_impact score (its agent is off until T4.12).'
- No rescue agents or workaround loops (Decision 55).
