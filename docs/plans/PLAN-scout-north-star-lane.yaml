schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: scout-north-star-lane
intent: 'Build Decision 243 clause 8''s scout lane (T4.36 c5): the decision scout reads docs/contracts/north-star.yaml first, shortlists
  the Decisions that carry each north star the approach engages through a new credential-free projection, feeds north stars to its SPIRIT
  lane only, and owns the 1-5 alignment score, which plan-critique step 7 now quotes instead of re-scoring against the old NS.1-NS.5
  roadmap list. Both skills stay within their zero-headroom budgets: rationale sentences move into instruction-architecture.yaml gate_subagent_retrieval.'
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-scout-north-star-lane.yaml
phase: T4.36 (in_progress; follow-on plan mode). Closes c5 only; c1-c4 and c7 are met, c6 belongs to emergent-north-star-orient.
closes_criteria:
- T4.36:c5
scope:
- file: scripts/north_star_shortlist.py
  action: Create
  purpose: 'The carried_by shortlist projection the scout runs at step 3 (pure-local, credential-free, read-only; the scope_projection.py
    pattern: docstring, side-effect-free import, main(argv) -> int, sys.exit(main())). Imports only the standard library and scripts.north_star_models.
    shortlist(ids, doc, rows) takes north-star ids (NS.n or mission), the loaded NorthStarDocument and docs/decisions-index.json''s
    decisions rows, and returns {engaged (input order, deduplicated), carried_by (id -> its list), serves_only (live rows whose serves
    names an engaged NS.n and that no engaged carried_by lists), not_live (carried numbers with no live row), shortlist (sorted: live
    carried numbers plus serves_only)}. main prints that object as one JSON line and exits 0; exit 2 with a usage line on no arguments,
    or naming the ids when one is unknown or retired; exit 1 naming the error when either file fails to load (OSError, ValueError, or
    index JSON whose decisions is missing or not a list), checked before any id is resolved. The planning prototype under /mnt/project-files/scout-lane/draft/
    is illustrative only: do not copy its exception handling, which exits 2 on a missing decisions key and raises on a non-list one.'
- file: tests/test_north_star_shortlist.py
  action: Create
  purpose: 'V2 tests: union across overlapping entries in sorted order, input-order engaged with duplicates dropped, mission accepted,
    serves_only (a live row serving an engaged id outside carried_by is added; one serving a non-engaged id, an archived row, or a carried
    row is not), not_live excluded from shortlist, exit 2 on no arguments, an unknown id and a retired id, exit 1 on an unreadable north-star
    file, on index JSON without decisions and on {"decisions": {}} (a non-list), side-effect-free import (no first-party import but
    scripts.north_star_models), and a real-tree run through python -m that covers every active id''s carried_by. 100% line coverage.'
- file: .claude/skills/decision-scout/SKILL.md
  action: Modify
  purpose: 'Apply the scout-* blocks of the sidecar verbatim: step 0 reads north-star.yaml in full before the index; step 3 adds the
    second mechanical shortlist (the CLI, serves_only RELATED at most, carried_by by hand on a non-zero exit); step 8 adds the north-star
    rule (SPIRIT only, quote failure_signal or principle, shared cap with Decision flags first on a tie, fold into a CONTRADICT on a
    carrying Decision); the template gains the NORTH STAR section (Serves and Engaged lines) and ''Copy the Serves line too.''; the
    quality gate gains two checks. Funded by the relocations and redundancy cuts in the other scout-* blocks: a 2-byte net shrink (11294
    -> 11292 on 66ab746e).'
- file: .claude/skills/plan-critique/SKILL.md
  action: Modify
  purpose: 'Apply the critique-* blocks verbatim: step 7 quotes the scout''s Serves line from the plan''s context and never re-scores
    (absent: a nit); step 2 drops ''for North Star'' and reads north-star.yaml only when a Phase 2b answer turns on a north star; the
    intent line, Files Read and the output line follow. Step numbers unchanged (12b-12p are cross-referenced). A 17-byte net shrink
    (18640 -> 18623 on 66ab746e); a sibling build landing first changes the base, never the delta.'
- file: docs/contracts/instruction-architecture.yaml
  action: Modify
  purpose: 'Apply the ia-* blocks verbatim: gate_subagent_retrieval gains north_star_lane (the lane''s mechanics, pointing to Decision
    243 for the why) and receives the rationale sentences the scout skill gives up, appended to the topical keys; layer 2''s contains
    names the north-star pointer; one amendment_log row ({{DATE}} = build day).'
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: 'Execution step 3, mechanical and outside the sidecar (PLAN-north-star-tier-a precedent): north_star_shortlist.py in scripts_root_allowlist.allowed_files
    after north_star_models.py (validate_placement fails a depth-1 scripts/ file it does not list), and one amendment_log row naming
    this plan, paid for by compacting the three 2026-10-29 rows to one: the prefix ''Three entries compacted (PLAN-scout-north-star-lane),
    words unchanged.'' then each entry as ''2026-10-29 -- '' plus its summary verbatim, its ''Additive only.'' included (Decision 240''s
    records keep their wording). 500 of 500 effective lines on 66ab746e, 500 after (Decision 166, never a raise). Measure at build time:
    if a sibling used those rows, compact the next oldest uncompacted field_add rows the same way. Unbuilt editor: PLAN-work-graph-edge-model
    (plan_obligations also lists PLAN-telemetry-capture-hooks, whose row landed 2026-10-15).'
- file: tests/test_decision_scout_north_star_lane.py
  action: Create
  purpose: 'Anti-drift tests for the lane. Each phrase is matched case-sensitively after collapsing whitespace runs to one space (the
    skills wrap lines; the contract is read through yaml.safe_load), and every phrase below occurs in the sidecar''s after text exactly
    as written here. Step 0 precedes step 1 and names docs/contracts/north-star.yaml; step 3 names scripts.north_star_shortlist and
    ''serves_only: RELATED at most''; step 8 carries ''never CONTRADICT or BLOCK'', ''failure_signal or principle'', ''shares the cap''
    and ''carries NS.n''; the NORTH STAR heading, Serves and Engaged lines sit inside the fenced template before ### Verdict; ''Copy
    the Serves line too.'' follows ''copy both count lines verbatim''; the quality gate carries ''no north star in CONTRADICT'' and
    ''NORTH STAR carries a score''; every relocated phrase (worse than not running, bloat dilutes the signal, hard against noise, parsing
    logic never has to branch, cannot self-verify, live-file header count, terse-historical, widened for bounded retrieval) appears
    in gate_subagent_retrieval and not in the skill (each is in the skill and not the contract on 66ab746e, so both halves are red before);
    north_star_lane names scripts.north_star_shortlist and Decision 243; the critique carries no ''NS.1-NS.5'' and no ''Score North
    Star'', its step 7 names the Serves line, its step 2 names docs/contracts/north-star.yaml; layer 2 names docs/contracts/north-star.yaml.'
- file: config/prose_budgets.yaml
  action: Modify
  purpose: Ratchet both entries down to the bytes measured after the blocks apply (11292 and 18623 if main has not moved); the plan-critique
    line keeps its existing dec-75 marker. No marker is added.
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: '/implement''s bookkeeping walk on the verified VP pass: T4.36 c5 status met, met_by scout-north-star-lane; files_in_scope
    gains scripts/north_star_shortlist.py; T4.36 stays in_progress (c6 open) with the walk''s dated progress note.'
- file: config/agent/verification_registry/entries/roadmap-t436-north-star-item.yaml
  action: Modify
  purpose: 'Only check_spec.command changes: the open-only assertion over (''c5'', ''c6'') becomes "assert c[''c5''][''status''] ==
    ''met'' and c[''c5''][''met_by''] == ''scout-north-star-lane''; assert c[''c6''][''status''] == ''open''" (the c3 form tier-a-amendment-guard
    used in d1177d77). Every other assertion is unchanged. A tightening, never a loosening (Decision 235 clause 1): it fails on origin/main,
    where c5 is open, so validate_verification_registry''s modified-entry differential admits it, and passes at HEAD after the walk.
    Never the open-or-met form: that passes on origin/main and the differential refuses it as tautological.'
- file: config/agent/verification_registry/entries/north-star-shortlist-projection.yaml
  action: Create
  purpose: Registry shard for the graduated VP 2 check (test_selector over the CLI suite).
- file: config/agent/verification_registry/entries/scout-north-star-lane-pins.yaml
  action: Create
  purpose: Registry shard for the graduated VP 6 check (test_selector over the lane suite).
- file: docs/plans/approved/scout-north-star-lane.yaml
  action: Create
  purpose: 'The approved-text sidecar (git-ops.yaml approved_text_binding): 32 blocks over the two skills and the contract, merged with
    this plan; the build never edits it.'
- file: docs/plans/PLAN-scout-north-star-lane.yaml
  action: Create
  purpose: This plan artefact.
bundled_recommendations: []
followon_recs:
- rec-4915
- rec-4916
infrastructure_dependencies: []
acceptance_criteria:
- T4.36:c5 -- the scout reads docs/contracts/north-star.yaml before the index (step 0), feeds north stars to SPIRIT only (never CONTRADICT
  or BLOCK, the shared cap of 3, folded into a CONTRADICT on a carrying Decision), shortlists by carried_by through scripts.north_star_shortlist
  (serves_only RELATED at most), and owns the 1-5 score in its NORTH STAR section, copied into the plan's context; plan-critique step
  7 quotes that line and carries no NS.1-NS.5 reference. VP 5, 6.
- scripts.north_star_shortlist is pure-local and side-effect-free on import, prints the five-key JSON object, exits 2 on no arguments
  or an unknown or retired id and 1 on a load failure, and is fully covered. VP 2, 3, 4.
- Both skills fit their existing budgets with no raise marker added; each entry ratchets to the measured bytes. VP 8.
- file-router.yaml's scripts_root_allowlist lists north_star_shortlist.py, the file stays within 500 effective lines with no raise,
  and both edited contracts carry their amendment_log rows. VP 9.
- Every relocated sentence is in gate_subagent_retrieval and absent from the scout skill; the standing scout guards (SPIRIT heading
  once, four gate lines, 'copy both count lines verbatim', the CITE-lane rules, the relocation shard) pass unchanged. VP 6, 7, 9, 12
  (the full tier re-runs the shards).
- The two skills and the contract equal the sidecar's text, read at the base (docs/plans/approved/scout-north-star-lane.yaml). VP 5.
- T4.36 c5 is met by this plan, files_in_scope names the CLI, the re-pinned T4.36 shard prints T436_OK, and the registry's differential
  admits the re-pinned shard and the two new ones. VP 10.
- scripts.validate --pre and the full tier exit 0, and --verify-head attests HEAD. VP 11, 12.
verification_plan:
- step: 1
  phase: pre-deploy
  action: 'Precondition: the plan and its sidecar are on origin/main and the branch contains origin/main.'
  command: git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-scout-north-star-lane.yaml && git cat-file -e
    origin/main:docs/plans/approved/scout-north-star-lane.yaml && git merge-base --is-ancestor origin/main HEAD && echo PRECONDITION_OK
  expected: Prints PRECONDITION_OK.
  fix_if: 'A missing file means the plan PR has not merged: stop (the build never carries the sidecar). A failing ancestry test means
    the branch is stale: merge origin/main first.'
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: 'Run the CLI suite: projection rules, exit codes, import hygiene and the real-tree run.'
  command: bin/venv-python -m pytest tests/test_north_star_shortlist.py -q
  expected: 'Every node passes. Red before: the file does not exist (collection fails).'
  fix_if: A union or serves_only failure means the projection rule is wrong (serves only widens; a carried or non-live row never lands
    in serves_only); fix the module, never the assertion.
  hermetic: false
  graduation: graduate
  graduation_check_id: north-star-shortlist-projection
- step: 3
  phase: pre-deploy
  action: Prove the new module is fully covered (no coverage_baseline entry, so 100% applies).
  command: bin/venv-python -m pytest tests/test_north_star_shortlist.py --cov=scripts.north_star_shortlist --cov-report=term-missing
    --cov-fail-under=100 -q
  expected: 100% for scripts/north_star_shortlist.py; exit 0.
  fix_if: Cover the missing branch with a test; never register a coverage_baseline entry for a new file (Decision 159).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The standing coverage gate and test_coverage_checker --check-coverage enforce it on every run; a shard would
    duplicate them.
- step: 4
  phase: pre-deploy
  action: Run the CLI as the scout does, on the real files, with every active id plus mission, then an unknown id and no arguments.
  command: bin/venv-python -c "import json,subprocess as S; from scripts.north_star_models import load_north_star as L; d=L(); ids=['mission']+sorted(d.active_ids());
    r=S.run(['bin/venv-python','-m','scripts.north_star_shortlist',*ids],capture_output=True,text=True,check=True); o=json.loads(r.stdout);
    u=set(d.mission.carried_by)|{n for p in d.principles if p.status=='active' for n in p.carried_by}; bad=S.run(['bin/venv-python','-m','scripts.north_star_shortlist','NS.0'],capture_output=True,text=True).returncode;
    none=S.run(['bin/venv-python','-m','scripts.north_star_shortlist'],capture_output=True,text=True).returncode; print('SHORTLIST_OK
    keys=%s engaged_all=%s covers=%s unknown_rc=%d noargs_rc=%d' % (sorted(o), o['engaged']==ids, (set(o['shortlist'])|set(o['not_live']))==(u|set(o['serves_only'])),
    bad, none))"
  expected: 'Prints the SHORTLIST_OK line: the five keys, engaged equal to the input ids, shortlist plus not_live equal to the carried
    union plus serves_only, exit 2 for NS.0 and for no arguments. Red before: CalledProcessError (no module).'
  expected_literals:
  - SHORTLIST_OK keys=['carried_by', 'engaged', 'not_live', 'serves_only', 'shortlist'] engaged_all=True covers=True unknown_rc=2 noargs_rc=2
  fix_if: A covers=False means the CLI dropped or invented a number; fix shortlist(), never the check.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The graduated suite (VP 2) carries the same real-tree run through python -m; a second shard would duplicate
    it.
- step: 5
  phase: pre-deploy
  action: The skill and contract words equal the approved sidecar, read at the base.
  command: bin/venv-python -m scripts.roadmap.approved_text verify --slug scout-north-star-lane --expect ed925a97559a47fe8029e69ad9f404c951456cbde7d96777e342fe43ea75a02b
  expected: Exit 0 (APPROVED-TEXT OK ed925a97559a47fe8029e69ad9f404c951456cbde7d96777e342fe43ea75a02b).
  fix_if: 'A MISMATCH: restore the sidecar''s words exactly (only {{DATE}} may vary); any other wording needs Benjamin''s new approval.
    This step reads no approval provenance; PR CI''s provenance leg is in constraints.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Duplicates validate_merge_step's approved-text leg, which reads the sidecar at the PR base on every PR.
- step: 6
  phase: pre-deploy
  action: Run the lane's anti-drift suite over both skills and the contract.
  command: bin/venv-python -m pytest tests/test_decision_scout_north_star_lane.py -q
  expected: 'Every node passes. Red before: the file does not exist (collection fails).'
  fix_if: A relocated phrase found in the skill means it was copied, not moved; a missing one means it was paraphrased away. Restore
    the sidecar's text; never edit the test to match.
  hermetic: false
  graduation: graduate
  graduation_check_id: scout-north-star-lane-pins
- step: 7
  phase: pre-deploy
  action: Every standing suite that names either skill or either edited contract still passes unchanged (selected by grep, so a suite
    added later is included).
  command: bin/venv-python -m pytest $(grep -rlE 'decision-scout|plan-critique|instruction-architecture|file-router' tests --include='test_*.py'
    | sort) -q
  expected: Every node passes (1084 passed, 1 skipped on the 66ab746e preview tree with every block applied, before the new lane suite
    existed; the grep selects that suite too, so the build's count is higher).
  fix_if: 'A pinned literal was lost (for example ''CITE only when omission would meaningfully harm the plan'' or the four (i)-(iv)
    lines): restore it from the sidecar; never edit a standing test.'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: These suites and their registry shards already run in both tiers; a shard would be a third copy.
- step: 8
  phase: pre-deploy
  action: Both skills fit their budgets, the entries ratchet to the measured bytes, and no raise marker is added.
  command: bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as p; from scripts.checks.prose.prose_budget_raises
    import validate_prose_budget_raises as r; f=[]; p(f); r(f); assert not f, f; print('BUDGETS_OK')" && test "$(wc -c < .claude/skills/decision-scout/SKILL.md)"
    -le "$(git show origin/main:.claude/skills/decision-scout/SKILL.md | wc -c)" && test "$(wc -c < .claude/skills/plan-critique/SKILL.md)"
    -le "$(git show origin/main:.claude/skills/plan-critique/SKILL.md | wc -c)" && ! grep -n 'decision-scout/SKILL.md' config/prose_budgets.yaml
    | grep -q raise-approved && echo NO_RAISE
  expected: Exit 0 after printing BUDGETS_OK then NO_RAISE.
  fix_if: 'current<budget: lower the entry to the measured bytes. current>budget: the text differs from the sidecar; restore it. Never
    add a marker (Decision 165: Decision 243 does not name the skill path).'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_prose_limits and validate_prose_budget_raises run in both tiers on every surface.
- step: 9
  phase: pre-deploy
  action: 'Contract gates over both edited contracts: drift (each gains its amendment_log row), the layer check, the 500-line structural
    limit, and the scripts-root allowlist covering the new CLI before it is committed (validate_placement reads git ls-files, so the
    path is added explicitly).'
  command: bin/venv-python -c "from pathlib import Path; from scripts.checks.contracts.validate_contract_drift import validate_contract_drift
    as d; from scripts.checks.contracts.validate_instruction_architecture_layers import validate_instruction_architecture_layers as
    l; from scripts.checks.structural.size_limits import validate_structural_size_limits as s; from scripts.checks.hygiene import validate_placement
    as v; f=[]; d(f); l(f); s(f); a,g,_=v._load_scripts_root_allowlist(Path('docs/contracts/file-router.yaml')); f+=v._scripts_root_stray_files(set(v._snapshot_tracked_paths())|{'scripts/north_star_shortlist.py'},a,g);
    assert not f, f; print('CONTRACT_OK')"
  expected: 'Exit 0 after printing CONTRACT_OK. Red before: the allowlist leg names scripts/north_star_shortlist.py.'
  fix_if: 'A drift finding means an amendment_log row is missing or malformed (restore the sidecar''s ia-log block, or the router row).
    A file-router size finding means the compaction saved too little: compact one more oldest field_add row, never raise. An allowlist
    finding means the router entry is missing.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: validate_contract_drift, validate_instruction_architecture_layers, validate_structural_size_limits and validate_placement
    run in both tiers; once the CLI is committed, validate_placement covers the allowlist leg on every run.
- step: 10
  phase: pre-deploy
  action: The roadmap bookkeeping walk landed, the re-pinned T4.36 shard reads it, and the registry's differential admits the re-pinned
    shard and the two new ones (each fails on origin/main and passes at HEAD).
  command: 'bin/venv-python -c "import yaml; d=yaml.safe_load(open(''docs/ROADMAP-PLATFORM.yaml'', encoding=''utf-8'')); t=[x for x
    in d[''tier_items''] if x[''id'']==''T4.36''][0]; c={x[''id'']: x for x in t[''exit_criteria'']}; assert c[''c5''][''status'']==''met''
    and c[''c5''][''met_by'']==''scout-north-star-lane'', c[''c5'']; assert c[''c6''][''status'']==''open'', c[''c6'']; assert t[''status'']==''in_progress'',
    t[''status'']; assert ''scripts/north_star_shortlist.py'' in t[''files_in_scope'']; assert t.get(''progress_note''), t[''id''];
    print(''ROADMAP_OK'')" && bin/venv-python -c "$(bin/venv-python -c "import yaml; print(yaml.safe_load(open(''config/agent/verification_registry/entries/roadmap-t436-north-star-item.yaml'',
    encoding=''utf-8''))[''check_spec''][''command''][2])")" && bin/venv-python -c "from scripts.checks.verification.validate_verification_registry
    import validate_verification_registry as v; f=[]; v(f); assert not f, f; print(''REGISTRY_OK'')"'
  expected: Prints ROADMAP_OK, then T436_OK, then REGISTRY_OK.
  fix_if: 'Apply the bookkeeping walk (tier-item-lifecycle.yaml bookkeeping_walk). An AssertionError after ROADMAP_OK means the shard
    still pins c5 open: edit it as its scope row says. A ''tautological'' registry finding on roadmap-t436-north-star-item means the
    re-pin passes on origin/main: use the strict c5 form, never the open-or-met form.'
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: pre-deploy
  action: Validate the plan document, then the fast tier.
  command: bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-scout-north-star-lane.yaml && bin/venv-python -m scripts.validate
    --pre
  expected: Both exit 0.
  fix_if: Fix the named finding; never skip or disable a check.
  hermetic: false
  graduation: not-applicable
- step: 12
  phase: pre-deploy
  action: After the commit and rebase, run the full tier to completion (backgrounded, 2 h limit, top-level session), then attest HEAD.
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: Both exit 0.
  fix_if: A failure in scope is fixed on the branch; never skip a test or relax an assertion. A failure outside scope becomes a rec
    via scripts.ops_data_portal (Decisions 55, 59).
  hermetic: false
  graduation: not-applicable
