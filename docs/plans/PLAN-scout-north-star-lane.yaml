execution_steps:
- 'Preconditions on origin/main, before any edit; if any fails, stop and tell the coordinator: VP 1 passes; T4.36 c5 is open; `bin/venv-python
  -m scripts.roadmap.approved_text record --slug scout-north-star-lane` prints the plan''s digest; and every block applies exactly once
  to the unedited tree: `bin/venv-python -c "from scripts.roadmap.approved_text import load_sidecar, apply, words; s=load_sidecar(''scout-north-star-lane'');
  fs=sorted({b.file for b in s.blocks}); [apply(words(open(f, encoding=''utf-8'').read()), [b for b in s.blocks if b.file == f]) for
  f in fs]; print(''BLOCKS_APPLY_OK'', len(s.blocks))"` prints BLOCKS_APPLY_OK (an ApprovedTextError names the block whose before no
  longer occurs once). Byte sizes are measured after applying, never compared to a fixed figure: a sibling build may have landed first.'
- Create scripts/north_star_shortlist.py and tests/test_north_star_shortlist.py per their scope rows; run VP 2-4.
- Apply every block of docs/plans/approved/scout-north-star-lane.yaml to its file ({{DATE}} = build day, nothing else changed); make
  the docs/contracts/file-router.yaml edit per its scope row; ratchet config/prose_budgets.yaml to the measured bytes; create the lane
  suite; run VP 5-9.
- Create the two registry shards (test_selector over the VP 2 and VP 6 suites, plan_slug scout-north-star-lane); re-pin the T4.36 shard;
  after the verified VP pass, run the bookkeeping walk; run VP 10-11.
- 'Commit, fetch and rebase onto origin/main, run VP 12 on the clean committed tree (git-ops.yaml handoff_sequence). Push as its own
  tool call, open the build PR (no Resolves: trailer) and drive CI green by event-driven wake; a PR CI provenance MISSING on the unchanged
  sidecar (or an UNVERIFIED that persists on one re-run) is handled per constraints. Independent code review, then merge on code review
  PROCEED plus green CI under the project''s standing rule.'
- 'Closure evidence as four separate facts (implement skill Commit Flows): GitHub readiness, VP 12 plus --verify-head for the pushed
  HEAD, structured postflight evidence, and the real outcome (push, PR, CI green by wake, merge SHA).'
- 'Report: what was implemented and the verification results.'
rollback: 'Revert the build PR: the skills and contract return to their prior text, the CLI and shards go, and c5 returns to open.'
