schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "secret-read-exact-target"
intent: >-
  Make every protected-action approve line name exactly what it covers, so the operator's in-session acknowledgement
  of a secret read or an admin credential says which secret or profile it allows and nothing more (rec-5124; NS.9).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-secret-read-exact-target.yaml
phase: >-
  security_advisory (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped).
  Operator's choice on the CI Reform decision card 2026-11-12: "Exact secret only, drop any"; forks F1 and F2 (below)
  taken as recommended. Closes no roadmap criterion.
scope:
  - file: docs/contracts/protected-actions.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks protected-version (contract_version 2), protected-log (a new amendment_log entry),
      secret-read-target (entry_point_reads, its note, the new target text, target_case exact), admin-entry-point
      (admin-credential matches rule 4 and entry_point_profiles), grammar-notes and known-limit-branch
      (docs/plans/approved/secret-read-exact-target.yaml). entry_points stays a list of strings.
  - file: scripts/session/protected_action_match.py
    action: Modify
    new_imports: []
    purpose: >-
      secret-read targets per the contract's new target text: one Hit per named secret (every occurrence of
      --secret-id, --name, --names, --secret-id-list; multi-value flags take each following word up to the next
      word starting with -; --flag=value forms too), SSM :version/:label suffix dropped, unknown for the forms the
      target text lists; an entry point's targets come only from entry_point_reads (flags in its arguments are
      ignored), unknown when the map lacks it or is absent; inline code is unknown. Hit gains a field the
      approvals module reads to compare a target exactly when the class's target_case is exact. admin-credential
      adds a Hit with the profile for a command that runs an entry point in entry_point_profiles (none when the key
      is absent).
  - file: scripts/session/protected_action_approvals.py
    action: Modify
    new_imports: []
    purpose: >-
      Approve items keep the target as written (class word, approve keyword and commit stay case-insensitive);
      _session_ok approves a session hit only by an item naming its target (exactly when the hit says so, else
      case-insensitively), never by any, and never a hit whose target is unknown or any; an unknown session hit is
      denied with no approve line and a note naming how to rewrite it; one-shot comparisons stay case-insensitive.
  - file: tests/test_session_protected_action_match.py
    action: Modify
    purpose: >-
      Creates test_entry_point_target_is_its_declared_secret and test_entry_point_reads_bind_to_their_scripts; adds
      multi-value, repeated-flag, selector, ARN, non-literal, by-path, --filters/--cli-input-json, inline, missing-map
      and entry_point_profiles cases; existing expected targets of any become the declared name or unknown.
  - file: tests/test_session_protected_action_approvals.py
    action: Modify
    purpose: >-
      Creates test_secret_read_any_is_never_accepted (also unknown never approves, and admin-credential any never
      approves) and an exact-case case; grammar cases that used "approve secret-read any" as their sample line use a
      named target instead, each keeping its assertion's meaning.
  - file: tests/hooks/test_protected_action_gate.py
    action: Modify
    purpose: >-
      End to end through the real hook and the repo contract: the wildcard half of
      test_session_class_approval_from_principal_allows now expects exit 2 for both session classes; the operator's
      exact line clears bash bin/sync-terraform-assets.sh --tfvars only together with approve admin-credential
      agent_platform_admin; test_contract_shape_and_coarse_keywords also asserts entry_points are strings and every
      entry_point_reads and entry_point_profiles key is an entry_points spec; other "approve secret-read any" lines
      become exact names. test_protected_action_denied_without_authorisation (graduated shard
      protected-action-gate-hook, kept unchanged) keeps its name and assertions.
bundled_recommendations: [rec-5124]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    bash scripts/ci/neon_api_key.sh run -- echo --name harmless classifies as secret-read /secret/neon-api-key only,
    and bash bin/sync-terraform-assets.sh --tfvars as secret-read /secret/agent-platform-terraform-personal-tfvars plus
    admin-credential agent_platform_admin.
  - aws ssm get-parameters --names /a /b --with-decryption and --name /a --name /b each yield both /a and /b.
  - >-
    No approve line with target any approves any session class, an unknown target is never approvable, and a
    secret-read target matches only with its exact case.
  - >-
    Every entry_point_reads name equals the set of secrets its script (for sync-terraform-assets.sh, its delegate)
    reads, both ways, and the contract file holds exactly the approved sidecar's words.
  - After merge, a fresh check in the build session shows the live hook refusing the two probe commands with the exact
    approve lines, and rec-5124 is closed.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the gate's unit and end-to-end tests, including the new named tests.
    command: >-
      bin/venv-python -m pytest tests/test_session_protected_action_match.py tests/test_session_protected_action_approvals.py
      tests/test_session_protected_action_shell.py tests/hooks/test_protected_action_gate.py -q
    expected: All pass; the run includes the three new named tests.
    fix_if: Any failure; fix the code, never the assertion's meaning.
    hermetic: true
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: Run rec-5124's acceptance selector on its own (the closure evaluator runs exactly this).
    command: >-
      bin/venv-python -m pytest
      "tests/test_session_protected_action_match.py::test_entry_point_target_is_its_declared_secret"
      "tests/test_session_protected_action_approvals.py::test_secret_read_any_is_never_accepted" -q
    expected: Both pass on the build head; both fail (not found or red) on main before the change.
    fix_if: Either fails, or either passes on main; the node names must not change.
    hermetic: true
    graduation: not-applicable
  - step: 3
    phase: pre-deploy
    action: Prove the bound contract text equals the approved sidecar.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug secret-read-exact-target
    expected: Exit 0; every block of docs/plans/approved/secret-read-exact-target.yaml is found in the head text.
    fix_if: Any block differs; restore the sidecar's words exactly (never edit the sidecar in the build).
    hermetic: true
    graduation: not-applicable
  - step: 4
    phase: post-deploy
    action: >-  # pragma: allowlist secret
      After merge, in the build's main session (never a subagent): first, in its own call, git fetch origin main and
      git checkout --detach origin/main, so the hook runs the merged code against the merged contract; then, with no
      approve line for these targets in the thread, run this one probe call once and read the deny. It never reads a
      secret: the gate refuses the whole call before it runs, the first command names a parameter that does not
      exist, and the second runs true under the self-serve profile.
    command: >-
      aws ssm get-parameter --name /secret/rec-5124-probe --with-decryption --profile agent_platform;
      AWS_PROFILE=agent_platform bash scripts/ci/neon_api_key.sh run -- true --name harmless
    expected: >-
      The call is refused by protected-action-gate before it runs, and the deny lists two secret-read hits with approve
      lines approve secret-read /secret/rec-5124-probe and approve secret-read /secret/neon-api-key; no line names
      harmless or any.
    fix_if: Either runs, or a deny names harmless or any; stop and report (Decision 55), never approve to get past it.
    hermetic: false
  - step: 5
    phase: post-deploy
    action: Confirm rec-5124 was closed by the squash commit's Resolves trailer.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;
      print([(r['id'], r.get('status')) for r in fetch_recs_by_ids(make_reader(profile='agent_platform'),
      ['rec-5124'])[0]])"
    expected: rec-5124 status closed.
    fix_if: Still open; check the trailer and the closure job's run, then close through the portal with the merge SHA.
    hermetic: false
test_obligations:
  - source: scripts/session/protected_action_match.py
    behavior: >-
      Entry-point targets come only from entry_point_reads; one Hit per named secret; unknown for unnameable reads;
      entry_point_profiles raises admin-credential.
    verification_step: 1
    test_selector: tests/test_session_protected_action_match.py::test_entry_point_target_is_its_declared_secret
    red_green_expectation: red before (target harmless or any), green after
  - source: scripts/session/protected_action_approvals.py
    behavior: any never approves; unknown never approves; secret-read targets match exactly.
    verification_step: 1
    test_selector: tests/test_session_protected_action_approvals.py::test_secret_read_any_is_never_accepted
    red_green_expectation: red before (approve secret-read any approves), green after
  - source: docs/contracts/protected-actions.yaml
    behavior: Each declared name equals what its script reads, both ways.
    verification_step: 1
    test_selector: tests/test_session_protected_action_match.py::test_entry_point_reads_bind_to_their_scripts
    red_green_expectation: red before (no entry_point_reads key), green after
constraints:
  - No rescue agents or workaround loops (Decision 55).
  - The gate stays deny-only and an early warning; the contract's authority text is unchanged (Decision 239 cl.5).
  - >-
    The target text must not suggest an approval grants access: IAM stays the binding control (Decision 143 cl.1,
    Decisions 157 and 237).
  - >-
    The contract file gets exactly the sidecar's words; any other contract wording needs a new approval run
    (Decision 246 cl.1-3). The operator's word on the final diff is still required: the gate modules and contract are
    CODEOWNERS paths and security code (Decision 246 cl.4).
  - >-
    Every change tightens the gate; no assertion is loosened (Decision 235 cl.1). Reintroducing a wildcard later would
    be a weakening.
  - Logical names only in the contract and tests, never an ARN or account id (Decision 101).
  - Never read a secret during the build; probes are refused before they run, and tests never call AWS.
context:
  - >-
    Decision-scout verdict FLAGS_FOUND (r1). CITE: 239, 143, 233, 246, 237, 101, 235. NOTE 224: the names live in
    the contract as a copy; the script literal is the source and test_entry_point_reads_bind_to_their_scripts binds
    them. NOTE 163: more approve lines per session (operator's choice); the build-start ask and the deny already list
    every exact line. Decisions triaged: 205 of 205. Roadmap items intersected: 2; CONFLICT: 0; RELATED: 2. Serves:
    NS.9 3/5.
  - >-
    Defects found in planning [verified offline with classify() at 2fc58b50]: an entry point's target came from flags
    in its own arguments (neon_api_key.sh run -- echo --name harmless -> target harmless), and only the first value of
    --names or of a repeated flag counted. Both fixed here.
  - >-
    Forks: F1 (approve admin-credential any stops approving) and F2 (sync-terraform-assets.sh --tfvars also raises
    admin-credential agent_platform_admin, because its script sets that profile at bin/sync-terraform-assets.sh:125)
    taken as recommended. Settled on advisor evidence (/mnt/project-files/secret-read-scope/ADVICE.md is session
    context only): a new key beside entry_points, never retyping it (older-branch code calls spec.split() on each);
    exact case for secret names only; by-path, ARN, --filters, --cli-input-json and inline reads are unknown; SSM
    selectors are dropped; lifetime stays session.
  - >-
    Binding test shape: for each entry point, read its script (for bin/sync-terraform-assets.sh --tfvars, the
    DELEGATE path its DELEGATE= line names), join backslash continuations, resolve "$VAR" only through one top-level
    VAR="literal" assignment in that file, classify each line holding a secret-read verb with the real contract, and
    compare the set of names to entry_point_reads; fail on an unresolved value or any get_secret_value or
    WithDecryption in the script. For entry_point_profiles, the script holds AWS_PROFILE=<profile>.
  - >-
    Mixed versions: new code with a contract lacking entry_point_reads gives entry points target unknown (fails closed
    on the build branch until merge); old code ignores the new keys (entry_points stays strings). Named in
    known_limits.
  - >-
    Overlap: PLAN-sit-organization (rec-5026, unbuilt, this project) edits other lines of protected-actions.yaml
    (live_roots, admin_profiles, tf-state-change target, an amendment_log entry), fast_path_ok in
    protected_action_match.py and two of these test files; its sidecar blocks do not overlap these. Whichever builds
    second rebases. No other open PR touches these files.
  - >-
    ports.yaml SA-08 not edited (499/500 lines); the flag grammar lives in this contract's target text. Changed callers:
    any "approve secret-read any" ask; the tfvars recovery now needs the exact line plus the admin-credential line.
  - "red_overlap: clear (no reds). Owner: this planning thread, CI Reform 'Scope secret-read approvals to one secret'."
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
  - {gate: wording-check, round: 1, verdict: PASS, digest: 000abdeccbc2db26aadbcec6068a39980e5b54d156358242ca0398af701b913b, base: 35cb4f77be3c28a04b61f1450437fd7a262b69a6, selection: complete}  # pragma: allowlist secret
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (239, 143, 233, 246, 237, 101, 235)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Apply the sidecar to docs/contracts/protected-actions.yaml with the repo's approved-text tooling (fill {{DATE}}
    with the build date), touching nothing else in the file.
  - >-
    scripts/session/protected_action_match.py: implement the scope row (target extraction, entry_point_reads,
    unknown, Hit exact flag, entry_point_profiles). Keep fast_path_ok and COARSE unchanged. Pre: tests from step 4
    written and red. Post: they pass.
  - >-
    scripts/session/protected_action_approvals.py: implement the scope row. deny_message is unchanged: an empty
    approve line already prints "none until the command is rewritten".
  - >-
    Tests per the three test scope rows, written first and seen red on the unchanged code (record the red run).
  - >-
    Execute the Verification Plan: steps 1-3 before the PR; open the PR with the Resolves: rec-5124 trailer planned
    for the squash body; ask the operator for the final-diff word at CI green; merge; then steps 4-5 from the main
    session. Loop on pre-deploy failures; on an unrecoverable failure stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results, the merge SHA and the probe deny lines.'
rollback: >-
  Revert the squash commit (code and contract together). Until main carries the revert, sessions keep the stricter
  rule; nothing is stateful.
