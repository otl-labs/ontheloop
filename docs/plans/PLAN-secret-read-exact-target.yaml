pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (239, 143, 233, 246, 237, 101, 235)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - >-
    Tests per the three test scope rows, written first and seen red on the unchanged code (record the red run).
    Post: the named nodes exist and fail.
  - >-
    Hand-apply the sidecar to docs/contracts/protected-actions.yaml: replace each block's before text with its after
    text verbatim, {{DATE}} filled with the build date, touching nothing else; VP step 3 proves it.
  - >-
    scripts/session/protected_action_match.py: implement the scope row (target extraction, entry_point_reads,
    unknown, Hit exact flag, entry_point_profiles). Keep fast_path_ok and COARSE unchanged. Post: its named tests
    pass.
  - >-
    scripts/session/protected_action_approvals.py: implement the scope row. deny_message is unchanged: an empty
    approve line already prints "none until the command is rewritten". Post: its named tests pass.
  - >-
    Readiness: VP steps 1-3 pass and validate --pre is green on the committed tree. Validator evidence: VP step 4's
    full tier and validation_result --verify-head PASS for that HEAD. Push result: the branch pushed at that HEAD.
    PR result: the PR open with the Resolves: rec-5124 trailer planned for the squash body; at CI green ask the
    operator for the final-diff word; merge; then VP steps 5-6 from the main session. Loop on pre-deploy failures; on
    an unrecoverable failure stop and RCA (Decision 55).
  - 'Report: what was implemented, verification results, the merge SHA and the probe deny lines.'
rollback: >-
  Revert the squash commit (code and contract together). Until main carries the revert, sessions keep the stricter
  rule; nothing is stateful.
