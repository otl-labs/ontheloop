- file: src/lambdas/ducklake_telemetry_reader/manifest.yaml
  action: Modify
  purpose: The note naming TELEMETRY_DSN_SECRET_ID names TELEMETRY_DSN_PARAMETER and the SSM store.
- file: config/agent/verification_registry/entries/materialise-tfvars-single-implementation.yaml
