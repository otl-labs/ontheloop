bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
- >-
  Code: the merge fires .github/workflows/deploy-ducklake-lambdas.yml (src/lambdas/ducklake_*/**, src/common/ducklake_*.py),
  the governed channel (Decision 125/126), which builds, deploys and smoke-invokes every DuckLake function. The grants
  and parameters exist since secrets-to-ssm-expand, so order is safe.
- >-
  Code: src/common/neon_api.py is packaged by the data-pipeline artifact (active, Decision 79), and
  deploy-prod-lambdas.yml's push path filter does not include it, so after merge the build thread dispatches that
  governed workflow on main (workflow_dispatch, on Benjamin's word) to ship the artifact and run its two smoke gates.
  No Lambda calls fetch_api_key, so the deploy changes no runtime read.
- >-
  Workflows: the next terraform-apply-sandbox and terraform-drift runs read tfvars (materialise_tfvars.sh) and the Neon
  key (scripts/ci/neon_api_key.sh) from SSM under the apply role (secrets-to-ssm-grants) and the planner's drift
  session (secrets-to-ssm-expand). Once S3's (rec-4637) PR 3 has merged, its trusted plan job does the same under
  agent-platform-github-ci-trusted-plan (secrets-to-ssm-expand's PlanSecretParameterRead, and the tfvars read through
  ci_full_refresh_read). terraform/personal is not touched by this merge, so no apply runs for it.
- >-
  Telemetry hold and sequencing: while validate_reconcile_pending_gate --telemetry-hold reports held=true (it did on
  2026-10-29, telemetry_agents.host_run_ref pending), deploy-telemetry green-skips the production telemetry writer and
  reader, and PLAN-telemetry-top-level-agent-run's sequencing line binds: "the coordinator merges no other change to the
  production telemetry writer or reader in that window (concurrent-applies rule)" (the precedent rule; any later hold, a
  new pending telemetry_catalog column, gates this merge the same way). This plan changes both, so it merges
  only when origin/main reports held=false AND the hold-clearing deploy-ducklake-lambdas run is complete and green with
  no run queued or in progress (held=false flips at the sidecar PR's merge, before its run ships the pair). The hold
  clears after the operator's owner-login provision_telemetry_catalog re-run (Decision 230 cl.4, needing only
  Benjamin's word) and that plan's bookkeeping sidecar PR (the host_run_ref hold cleared this way at bd852062,
  2026-10-30, #1726). The build runs up to the "merge" ask meanwhile; never break-glass (Decision 125 cl.3).
- >-
  Telemetry project sequencing (agreed 2026-10-30 with that project's coordinator, relayed by Benjamin): the cutover
  merges before rec-4696's build (PLAN-telemetry-content-reader-lock, plan PR #1723, not before 30 Oct) and gets a
  production deploy-ducklake-lambdas run of its own: no other change to the production telemetry writer or reader
  merges in the same window, and that project orders its usage reader verbs and capture adapter (#1711) builds around
  it. Before the "merge" ask the build thread asks the coordinator to confirm a clear merge window with the telemetry
  project and to tell them the cutover is ready to merge. The overlap with rec-4696's build is textual only (it edits
  the content reader's handler.py docstring, manifest.yaml and test_packaging.py, and creates deploy_config.json);
  if that build merges first anyway, the manifest reads below return this build to the planner.
- >-
  The telemetry content reader is a stub (Decision 79): no build, deploy or smoke here. Its deploy channel, deploy
  config and grants arrive with rec-4696's build (PLAN-telemetry-content-reader-lock, plan PR #1723), which sets both
  TELEMETRY_DSN_SECRET_ID and TELEMETRY_DSN_PARAMETER and both grants. If that build merges first, the manifest reads
  active and this build returns to the planner (start conditions line).
acceptance_criteria:
- No consumer in src/, scripts/, .github/actions or .github/workflows calls Secrets Manager for any of the nine secrets (scripts/ops/secrets_to_ssm_copy.py, the one-time copy tool that reads them by design, excluded by name), and every default name is a /secret/ parameter (TestSecretsToSsmCutover).
- Before merge, the copy --verify run prints SECRETS_TO_SSM_COPY_OK 8/8 with eight unchanged lines and the DSN parameter still matches the secret.
- After merge (with the telemetry hold off), the DuckLake deploy and its smokes are green, every DSN-reading DuckLake function's deploy record descends from the merge commit, the catalog-DR gate and the next production maintenance run pass, the dispatched deploy-prod-lambdas run and its smokes are green, the next terraform-drift run is green with the apply role's and the trusted-plan role's SSM reads simulated allowed, and the inference smoke passes under PlatformDev.
verification_plan:
- step: 1
  phase: pre-deploy
  action: Every consumer reads SSM and nothing reads Secrets Manager
  command: bin/venv-python -m pytest tests/test_secrets_to_ssm_cutover.py -q
  expected: all pass; before the change the file does not exist (exit 4, red)
  fix_if: a red case passes silently, or a real-source case fails -- fix the consumer, never the predicate's intent
  hermetic: true
  graduation: graduate
  graduation_check_id: secrets-to-ssm-cutover
- step: 2
  phase: pre-deploy
  action: The updated consumer suites pass
  command: >-
    bin/venv-python -m pytest tests/common/test_ducklake_runtime.py tests/test_neon_api.py
    tests/test_smoke_test_inference_credentials.py tests/test_ducklake_maintenance_smoke_handler.py
    tests/lambdas/ducklake_telemetry_writer tests/lambdas/ducklake_telemetry_reader
    tests/lambdas/ducklake_telemetry_content_reader tests/lambdas/ducklake_maintenance
    tests/common/ducklake_event_reads tests/ducklake_neon_smoke_test tests/test_materialise_tfvars_delegate.py
    tests/test_ci_neon_api_key.py tests/checks/iam_tf/test_validate_planner_secret_value_reads.py
    tests/test_ducklake_facade.py tests/common/test_ducklake_catalog_owner_roles.py
    tests/common/test_ducklake_telemetry_writer_least_privilege.py tests/common/test_ducklake_telemetry_catalog_ownership.py
    tests/test_setup_cloud_env.py -q
  expected: all pass
  fix_if: >-
    a failure -- fix the consumer or the stub; a removed assertion needs a weakening_dispositions entry, never a silent
    delete. hermetic false (amendment 2026-10-30, vp-red-before.yaml hermetic_authoring carve-outs (i) and (v)): the
    three catalog-ownership suites need a live Postgres (DUCKLAKE_TEST_PG_ADMIN_DSN; a skip is a FAIL, rec-4071), and the
    whole run, measured at 135-152 s for about 1,360 tests, is longer than the entire 120 s replay aggregate
    (replay_bound), so no split fits it either. The build session runs it as written, and VP step 10's full tier
    runs every suite
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Existing suites already run in the fast and full tiers; step 1 carries this plan's assertions.
- step: 3
  phase: pre-deploy
  action: Stale-reference sweep for Secrets Manager reads of the nine secrets
  command: >-
    for f in src/common src/lambdas scripts/ducklake_smoke scripts/ducklake_neon_smoke_test.py
    scripts/smoke_test_inference_credentials.py scripts/ci/neon_api_key.sh .github/actions/materialise-tfvars
    .github/actions/terraform-init-retry; do test -e "$f" || { echo "MISSING $f"; exit 1; }; done &&
    ! grep -rn --exclude-dir=__pycache__ -e 'secretsmanager' -e 'get_secret_value' -e 'DSN_SECRET_ID' -e 'TELEMETRY_DSN_SECRET_ID'
    src/common src/lambdas scripts/ducklake_smoke scripts/ducklake_neon_smoke_test.py scripts/smoke_test_inference_credentials.py
    scripts/ci/neon_api_key.sh .github/actions/materialise-tfvars .github/actions/terraform-init-retry && echo CUTOVER_SWEEP_OK
  expected: prints CUTOVER_SWEEP_OK
  fix_if: any hit -- move it to SSM; terraform/personal and contract history are outside the sweep
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Grep sweep restating step 1's graduated assertions.
- step: 4
  phase: pre-deploy
  action: ENVIRONMENT CHECK before the live reads
  command: >-
    bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
    'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
  expected: ADMIN_CHAIN_OK in this project's ADMIN environment
  fix_if: ADMIN_CHAIN_ABSENT -- hand steps 5, 7, 12 and 13 to an ADMIN session through the coordinator
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: pre-deploy
  action: The copy is still exact at the CI-green head (read-only), so cutover reads the same values
  command: >-
    bin/venv-python -m scripts.ops.secrets_to_ssm_copy --profile agent_platform_admin --verify && bin/venv-python -c "import
    boto3, hmac; s=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2');
    a=s.client('secretsmanager').get_secret_value(SecretId='ducklake-neon-catalog-dsn')['SecretString'];
    v=s.client('ssm').get_parameter(Name='/secret/ducklake-neon-catalog-dsn', WithDecryption=True)['Parameter']['Value'];
    assert hmac.compare_digest(a.encode(), v.encode()); print('DSN_PARAMETER_MATCH_OK')"
  expected: eight unchanged lines, SECRETS_TO_SSM_COPY_OK 8/8, then DSN_PARAMETER_MATCH_OK; posted on the PR with $PR_HEAD_SHA
  fix_if: a mismatch -- a value changed during the freeze; stop and show Benjamin; --overwrite only on his word naming it
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: post-deploy
  action: The governed DuckLake deploy for the merge commit is green, including every function's smoke
  command: >-
    echo 'VIA MCP: mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
    resource_id="deploy-ducklake-lambdas.yml") -- the run for the merge sha, then actions_get for its jobs'
  expected: >-
    conclusion success; maintenance-smoke, telemetry-twin-smoke (the writer twin already carries TELEMETRY_DSN_PARAMETER,
    so it proves the new writer code's SSM read), smoke, deploy-telemetry (deployed, no TELEMETRY_PRODUCTION_HOLD notice:
    the merge waited for held=false) and telemetry-smoke are green. The channel does not smoke the production ducklake_maintenance function or
    ducklake_catalog_dr; VP step 12 covers those
  fix_if: >-
    red -- RCA the run; rollback is a revert PR (the old secrets still exist); never a local build_lambda --deploy.
    No completed run for the merge sha (a later push replaced it while pending) -- read the replacing run's jobs;
    VP step 13 still proves descent
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: >-
    The pipeline can read tfvars and the Neon key from SSM -- the next drift run is green, and the apply role is proven
    by simulate (this merge does not trigger terraform-apply-sandbox, which runs only on terraform/personal changes)
  command: |-  # pragma: allowlist secret
    echo 'VIA MCP: actions_list for terraform-drift.yml (trigger it with mcp__github__actions_run_trigger on main if no scheduled run follows the merge within a day); read the "Materialise tfvars" step and the init-retry neon-api-key check step' && bin/venv-python -c "import boto3; s=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); iam=s.client('iam'); a=s.client('sts', region_name='eu-west-1', endpoint_url='https://sts.eu-west-1.amazonaws.com').get_caller_identity()['Account']; p='arn:aws:ssm:eu-west-2:'+a+':parameter/secret/'; d=lambda n, r='agent-platform-github-ci-apply': iam.simulate_principal_policy(PolicySourceArn=iam.get_role(RoleName=r)['Role']['Arn'], ActionNames=['ssm:GetParameter'], ResourceArns=[p+n])['EvaluationResults'][0]['EvalDecision']; tp='agent-platform-github-ci-trusted-plan'; got=(d('neon-api-key'), d('agent-platform-terraform-personal-tfvars'), d('neon-api-key', tp), d('agent-platform-terraform-personal-tfvars', tp)); print('LIVE', got); assert got==('allowed',)*4, got; print('APPLY_ROLE_SSM_READS_OK')"
  expected: >-
    the drift run succeeds with the materialise step silent and the neon-api-key check passing (it now reads SSM); then
    LIVE ('allowed', 'allowed', 'allowed', 'allowed') and APPLY_ROLE_SSM_READS_OK (the last two: the trusted-plan role,
    rec-4683; if S3's PR 3 has merged, also read its trusted plan job's neon-api-key step on the next same-repo
    terraform/personal PR, MCP). eu-west-1 STS endpoint (Plan A); post only the tuple. The
    first real apply-role run after cutover is a secrets-to-ssm-retire start condition
  fix_if: an AccessDenied on GetParameter -- compare with secrets-to-ssm-expand's VP step 7 and stop; never re-grant Secrets Manager reads by hand
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: The inference smoke reads its keys from SSM under PlatformDev
  command: AWS_PROFILE=agent_platform bin/venv-python -m scripts.smoke_test_inference_credentials --provider anthropic
  expected: >-
    the fetch line names /secret/agent-platform-anthropic-api-key and the provider call succeeds; no key printed.
    AWS_PROFILE pins PlatformDev (resolve_aws_profile lets it win, so in ADMIN it would otherwise prove PlatformAdmin).
