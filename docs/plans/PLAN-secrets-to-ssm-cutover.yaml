constraints:
- >-
  fetch_dsn's SSM failures (a botocore ClientError, or the ValueError for a non-/secret/ name) propagate as they are and
  are never wrapped in DuckLakeRuntimeError or another DuckLake error class: the maintenance handler catches those
  classes into a 500 body, which would keep VP step 12's Errors == 0 green while every read fails.
- >-
  Always-ask, each needing Benjamin's own typed word in the build thread: the merge (it fires the governed DuckLake
  deploy and changes the Terraform pipeline's credential source; it is also his word on the final diff plus the
  admin-bypass merge while PRs are authored as him (he cannot approve his own PR; rec-2827), and the "merge" ask names
  every CODEOWNERS path the diff touches at the merge base: the content reader's three files today (Decision 239
  cl.5), and scripts/ci/neon_api_key.sh and .github/actions/materialise-tfvars/ too once S3's PR 3 adds them (Decision
  238 cl.2)),
  the deploy-prod-lambdas dispatch (VP step 11) and any --overwrite. Contract wording added in the build (the six scope rows under docs/contracts) is shown to him
  before merge; the pinned texts in execution step 4 are approved in the plan PR's wording review.
- "No Secrets Manager fallback in code; the rollback is a revert PR while the old secrets still exist."
- "Re-mints after the merge (N1's VP 15 project-scoped Neon key, the Anthropic key, a scoped-login rotation) write the /secret/ parameter (ssm put-parameter --overwrite, SecureString, under PlatformAdmin on Benjamin's word) and, until secrets-to-ssm-retire, the Secrets Manager secret too, so a revert stays valid. A re-mint that writes only the secret leaves consumers on the old value: its check would pass falsely, and revoking the old key would break them."
- "No terraform/personal edit: the old env vars, grants and secrets stay until secrets-to-ssm-retire."
- "Public repo (Decision 101): no account id, ARN, host or value in any file or evidence."
- "Identity calls stay off the eu-west-2 STS host (Plan A)."
- No rescue agents or workaround loops (Decision 55).
