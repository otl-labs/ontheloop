    secretsmanager call, and no file under .github/workflows names any of the nine secret names after a secretsmanager
    verb (text predicates); deploy-paths' mutation_1 calls ssm put_parameter on the login's /secret/ name before its one
    Secrets Manager write, which targets the same name without the /secret/ prefix; the secret-material-handling domains lines for the Neon key and the tfvars name their
    /secret/ parameters (the predicate checks the /secret/ name, never the file path the Neon line cites); red cases on
    synthetic sources.
