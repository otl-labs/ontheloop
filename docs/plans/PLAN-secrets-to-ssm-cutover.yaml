  command: |-
    test -n "$MERGED_AT" && DUCKLAKE_CATALOG_DR_URL="$(aws lambda get-function-url-config --function-name agent-platform-ducklake-catalog-dr --profile agent_platform_admin --query FunctionUrl --output text)" AWS_PROFILE=agent_platform_admin bin/venv-python -m scripts.ducklake_neon_smoke_test --lambda-catalog-dr && MERGED_AT="$MERGED_AT" bin/venv-python -c "import boto3, datetime, os; cw=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2').client('cloudwatch'); t0=datetime.datetime.fromisoformat(os.environ['MERGED_AT']); t1=datetime.datetime.now(datetime.timezone.utc); m=lambda n: sum(p['Sum'] for p in cw.get_metric_statistics(Namespace='AWS/Lambda', MetricName=n, Dimensions=[{'Name':'FunctionName','Value':'agent-platform-ducklake-maintenance'}], StartTime=t0, EndTime=t1, Period=3600, Statistics=['Sum'])['Datapoints']); got=(m('Invocations') > 0, m('Errors')); print('MAINT', got); assert got==(True, 0), got; print('MAINT_AFTER_CUTOVER_OK')"
  expected: >-
    the catalog-DR gate passes (its Function URL is read into the env var and never printed), then MAINT (True, 0) and
    MAINT_AFTER_CUTOVER_OK once at least one 6-hourly production maintenance run has happened since MERGED_AT (the
    merge commit's ISO timestamp with offset); counts only
  fix_if: a DSN fetch error -- the function's SSM grant from secrets-to-ssm-expand is missing live; stop and RCA; rollback is a revert PR
  hermetic: false
  graduation: not-applicable
- step: 13
  phase: post-deploy
  action: >-
    Every DSN-reading DuckLake function runs cutover code -- each deploy record descends from the merge commit and its
    commit's ducklake_runtime.py names the /secret/ DSN parameter (so a later revert reads False); a
    secrets-to-ssm-retire start condition
  command: |-
    test -n "$MERGE_SHA" && { test "$(git rev-parse --is-shallow-repository)" = false || git fetch -q --unshallow origin main; } && git fetch -q origin main && git cat-file -e "$MERGE_SHA^{commit}" && MERGE_SHA="$MERGE_SHA" bin/venv-python -c "import boto3, os, re, subprocess; from scripts.build_lambda_deploy import read_deploy_record; s3=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2').client('s3'); m=os.environ['MERGE_SHA']; fns=('writer', 'reader', 'maintenance', 'maintenance-smoke', 'catalog-dr', 'telemetry-writer', 'telemetry-writer-smoke', 'telemetry-reader'); sha=lambda f: (read_deploy_record('agent-platform-ducklake-'+f, s3_client=s3) or {}).get('source_git_sha') or ''; rc=lambda s: subprocess.run(['git', 'merge-base', '--is-ancestor', m, s], capture_output=True).returncode if s else 1; ssm=lambda s: bool(s) and re.search(r'^DSN_PARAMETER_NAME\b[^=\n]*= \"/secret/', subprocess.run(['git', 'show', s+':src/common/ducklake_runtime.py'], capture_output=True, text=True).stdout, re.M) is not None; shas=[sha(f) for f in fns]; codes=[rc(s) for s in shas]; assert not any(c not in (0, 1) for c in codes), 'MISSING_OBJECT'; got=tuple(c == 0 and ssm(s) for c, s in zip(codes, shas)); print('POST_CUTOVER', got); assert got == (True,)*8, got; print('ALL_DSN_READERS_POST_CUTOVER_OK')"
  expected: >-
    POST_CUTOVER with eight True and ALL_DSN_READERS_POST_CUTOVER_OK, run once VP step 6's run is green; MERGE_SHA is
    the merge commit; booleans only, no sha or value posted
  fix_if: >-
    MISSING_OBJECT -- the clone lacks a commit (shallow or stale), fetch and re-run, never read it as a deploy fault;
    False for a function -- RCA that function's deploy job (a telemetry pair skipped by a hold that re-armed in the seconds
    between the last pre-merge read and the merge: wait for its clearing run, never break-glass, Decision 125 cl.3); a red smoke -- first separate a DSN-read
    failure (ClientError or ValueError at fetch_dsn) from any other cause; only a DSN-read cause makes a revert PR the
    rollback
  hermetic: false
  graduation: not-applicable
