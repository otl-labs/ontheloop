    tfvars from Secrets Manager" (five steps in three workflows share it; secrets-to-ssm-retire keeps step names too).
    Code-owned with the rest of .github/actions/materialise-tfvars/.
- file: scripts/ci/neon_api_key.sh
  action: Modify
  purpose: >-
    N1's script. Both subcommands' one fetch becomes aws ssm get-parameter --name /secret/neon-api-key
    --with-decryption --query Parameter.Value --output text; the event skip as main has it at build time (S3, rec-4637,
    PR 3 narrows it to pull_request; whichever lands second rebases), the fail-closed empty and error paths, the
    single ::add-mask:: line, the per-process TF_VAR_neon_api_key export and the no-file rule are unchanged. No workflow
    changes: terraform-apply-sandbox.yml, terraform-drift.yml and the init-retry delegate call this script. In
    reconcile.yml only the `run --` prefix uses the dispatch-ref copy; materialise-tfvars and the init-retry check run
    the red commit's own copy, which for a pre-cutover red commit still reads Secrets Manager. That is harmless until
    secrets-to-ssm-retire deletes those secrets; retire records the residual (a red commit older than the cutover can no
    longer heal by reconcile, Decision 183). The callers' roles hold the SSM read since secrets-to-ssm-grants
    (agent-platform-github-ci-apply) and secrets-to-ssm-expand (the planner's drift session, and
    agent-platform-github-ci-trusted-plan's PlanSecretParameterRead, rec-4683, for S3's trusted plan job once S3's PR 3
    has merged).
- file: tests/test_ci_neon_api_key.py
  action: Modify
  purpose: >-
    The stub aws answers ssm get-parameter (and fails on any secretsmanager call); every existing assertion stays,
    re-pointed at the SSM verb, including any cases S3 (rec-4637) PR 3 added (the pull_request-only skip, the
    pull_request_target fetch). New case: the stub is called with --name /secret/neon-api-key and --with-decryption.
- file: tests/test_secrets_to_ssm_cutover.py
  action: Create
  purpose: >-
    No consumer reads Secrets Manager: fetch_dsn calls only ssm get_parameter with decryption and rejects a non-/secret/
