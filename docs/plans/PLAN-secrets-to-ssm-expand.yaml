schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: secrets-to-ssm-expand
intent: >-
  Plan 2 of plan D (Secrets Manager to SSM Parameter Store). Expand without switching anyone over: terraform/personal
  gains the /secret/ name and ARN map, the Neon catalog DSN as a Terraform-managed SecureString (the one declared value
  exception, same value as today's secret), an ssm:GetParameter grant beside every existing Secrets Manager value grant
  on the DuckLake Lambda roles and the trusted speculative-plan role (Decision 238), the planner's three parameter reads
  (tfvars, and the Neon key and DSN conditioned on the drift session), and new parameter-name env vars beside the old ones. After merge, the admin copy run puts the other
  eight values into SSM. Every consumer still reads Secrets Manager until secrets-to-ssm-cutover.
implementation_declared: true
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-secrets-to-ssm-expand.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): plan D's move to SSM (rec-4539 is closed by retire-github-pat-secret). No tier_item criterion claimed. Third of plan D's five
  plans (retire-github-pat-secret, secrets-to-ssm-grants, this plan, secrets-to-ssm-cutover, secrets-to-ssm-retire).
scope:
- file: terraform/personal/secret_parameters.tf
  action: Create
  purpose: >-
    locals secret_parameter_names (nine keys, each "/secret/<current Secrets Manager name>": neon_api_key,
    terraform_personal_tfvars, ducklake_neon_catalog_dsn, deepseek_api_key, anthropic_api_key, telemetry_writer_dsn,
    telemetry_writer_prod_dsn, telemetry_reader_dsn, smoke_maintainer_dsn), used for env vars only. No ARN local:
    every grant writes the literal "arn:aws:ssm:${var.aws_region}:${var.account_id}:parameter/secret/<name>" string,
    the one form the coverage and planner checks from secrets-to-ssm-grants recognise (a local reference fails
    closed there). A header comment names Decision N (from secrets-to-ssm-grants) and says only the DSN is
    Terraform-managed.
- file: terraform/personal/neon_ducklake_catalog.tf
  action: Modify
  purpose: >-
    The DSN JSON moves into local.ducklake_neon_dsn_document, used unchanged by
    aws_secretsmanager_secret_version.ducklake_neon_catalog_dsn (no diff) and by the new resource "aws_ssm_parameter"
    "ducklake_neon_catalog_dsn" (name the literal "/secret/ducklake-neon-catalog-dsn", type SecureString, tier
    Standard, no key_id, description and tags as the secret's). New output ducklake_neon_catalog_dsn_parameter_name.
- file: terraform/personal/ducklake_lambdas.tf
  action: Modify
  purpose: Writer and reader roles each gain Sid NeonDsnParameterRead (ssm:GetParameter on the DSN parameter ARN) beside NeonDsnRead.
- file: terraform/personal/ducklake_catalog_dr.tf
  action: Modify
  purpose: The DR role gains NeonDsnParameterRead beside NeonDsnRead.
- file: terraform/personal/ducklake_maintenance.tf
  action: Modify
  purpose: The maintenance role gains NeonDsnParameterRead on the five parameter ARNs matching its NeonDsnRead (the DSN and four logins).
- file: terraform/personal/ducklake_maintenance_smoke.tf
  action: Modify
  purpose: Gains NeonDsnParameterRead on the smoke maintainer parameter and env var DUCKLAKE_DSN_PARAMETER beside DUCKLAKE_DSN_SECRET_ID.
- file: terraform/personal/ducklake_telemetry_writer.tf
  action: Modify
  purpose: Gains TelemetryDsnParameterRead on the telemetry writer parameter and env var TELEMETRY_DSN_PARAMETER beside TELEMETRY_DSN_SECRET_ID.
- file: terraform/personal/ducklake_telemetry_writer_smoke.tf
  action: Modify
  purpose: Same as the writer (TelemetryDsnParameterRead, TELEMETRY_DSN_PARAMETER).
- file: terraform/personal/ducklake_telemetry_reader.tf
  action: Modify
  purpose: Gains TelemetryReaderDsnParameterRead on the reader parameter and TELEMETRY_DSN_PARAMETER beside TELEMETRY_DSN_SECRET_ID.
- file: tests/checks/iam_tf/test_ducklake_maintenance_gc_rule_invariants.py
  action: Modify
  purpose: >-
    test_maintenance_role_iam_is_not_widened pins the maintenance role's exact Sid list; it gains
    NeonDsnParameterRead (planned change, Decision 235 cl.1, shown to Benjamin with the plan). No other assertion moves.
- file: tests/checks/iam_tf/test_telemetry_reader_and_twin_pins.py
  action: Modify
  purpose: >-
    The helper reader_problems pins the reader's exact Sid set and an action allow-list without ssm:GetParameter; both
    gain exactly TelemetryReaderDsnParameterRead and ssm:GetParameter on that one parameter. The edit is helper-level, so
    validate_weakening_candidates lists no candidate for it; this plan text is its Decision 235 cl.1 gate (planned
    change, shown to Benjamin). The env test is untouched (reader_env_problems checks a subset of keys). Every mutation
    case stays.
- file: tests/test_terraform_plan_digest.py
  action: Modify
  purpose: >-
    One pin case (amendment 2026-10-28; the guard-masking rows this plan first carried were subsumed by #1678, rec-4639,
    which replaced the guard's digest with the names-only scripts/ci/terraform_plan_digest.py): a create of an
    aws_ssm_parameter of type SecureString whose after.value is a sentinel string prints the attribute name "value" and
    never the sentinel, with or without --literals-from. Green on arrival (no behaviour changes); it pins the threat this
    plan cares about, the DSN reaching the merge-time reviewer.
- file: terraform/personal/oidc_trusted_plan_role.tf
  action: Modify
  purpose: >-  # pragma: allowlist secret -- names a Sid and parameter ARN templates, no credential
    rec-4683. Directly after PlanSecretValueRead, Sid PlanSecretParameterRead: effect Allow, actions ["ssm:GetParameter"],
    resources the two literal strings "arn:aws:ssm:${var.aws_region}:${var.account_id}:parameter/secret/neon-api-key" and
    "arn:aws:ssm:${var.aws_region}:${var.account_id}:parameter/secret/ducklake-neon-catalog-dsn", no condition (the role's
    one trusted subject is the tf-trusted-plan Environment bound to main's workflow; Decision 237 cl.2 as annotated in
    execution step 5). Comment: one line naming Decision 237 and that secrets-to-ssm-retire deletes PlanSecretValueRead.
    The role needs it once S3 (rec-4637) runs a full refresh, which decrypts the DSN parameter, and once
    secrets-to-ssm-cutover moves scripts/ci/neon_api_key.sh to SSM. The tfvars parameter read and the DSN
    ListTagsForResource reach this role through ci_full_refresh_read (oidc.tf row below), which it sources.
- file: tests/checks/iam_tf/test_trusted_plan_identity.py
  action: Modify
  purpose: >-
    Planned change (Decision 235 cl.1, shown to Benjamin in the amendment's step 6b): _EXPECTED_SIDS gains
    "PlanSecretParameterRead": (["ssm:GetParameter"], [the two literal parameter ARNs above]); the module docstring's
    "exactly its four Sids" and test_policy_sids_are_exactly_the_four's meaning become "exactly its pinned Sids". The
    test function keeps its name (a rename is a test-removed weakening candidate). validate_weakening_candidates lists no
    candidate for this edit (checked against a simulated diff at planning time); if it lists one in the build, stop and
    return to the planner.
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    The dated trailer on Decision 237 (about cl.2) pinned in execution step 5 (blockquote update form,
    docs/contracts/decision-entry.yaml amendment_forms). Approved text; no other Decision text changes.
- file: terraform/personal/oidc.tf
  action: Modify
  purpose: >-
    In ci_full_refresh_read (the planner's shared refresh surface): SecretParameterTfvarsRead (ssm:GetParameter on the
    tfvars parameter, which every plan reads; the one exemption validate_planner_secret_value_reads allows) and
    SecretParameterMetadataRead (ssm:ListTagsForResource on the DSN parameter). The reserved session-name local's
    coupled-site comment goes from N1's 5 sites to 6 (site 6 is the drift statement below), and the "shared
    <N>-statement refresh-read surface" count N1 set in this file's header and at the matching line in
    oidc_pipeline_roles.tf goes up by two in both places. Nothing else changes.
- file: terraform/personal/oidc_pipeline_roles.tf
  action: Modify
  purpose: >-  # pragma: allowlist secret -- names a session-name local, no credential
    In data "aws_iam_policy_document" "github_ci_planner", directly after N1's DriftSessionSecretValueRead, add
    DriftSessionSecretParameterRead: ssm:GetParameter on the Neon key and DSN parameter ARNs, condition StringLike
    aws:userid "*:${local.convergence_writer_session_name}" (the local, never the literal). It is coupled site 6 of the
    reserved session name: its comment says "site 6/6", and every other "site N/5" annotation in this file becomes
    "N/6" (validate_convergence_writer_isolation does not count sites; the comments are the record).
- file: .github/workflows/terraform-drift.yml
  action: Modify
  purpose: >-
    Comment only: the coupled-site annotation becomes "site 4/6" and "other 4 sites" becomes "other 5 sites". No
    effective line changes.
- file: docs/contracts/secret-material-handling.yaml
  action: Modify
  purpose: >-
    value_exceptions gains aws_ssm_parameter.ducklake_neon_catalog_dsn (file terraform/personal/neon_ducklake_catalog.tf,
    the same in-band reason), plus the amendment_log entry pinned in execution step 4.
- file: tests/test_secret_parameters_expand.py
  action: Create
  purpose: >-
    Text predicates on terraform/personal: the nine names equal "/secret/" plus the matching aws_secretsmanager_secret
    name (or the two out-of-band names); the DSN parameter shape and the shared document local; each role's parameter
    grant equals its Secrets Manager grant mapped to parameter ARNs (the role table); the three planner statements and
    the drift condition; the trusted role's PlanSecretParameterRead (ssm:GetParameter on exactly the Neon key and DSN
    parameter ARNs, no condition); the env vars; every parameter grant is the literal template string (no local or var
    reference); red cases on synthetic HCL. Positive real-tree cases: _read_coverage._check_resource with the trusted
    role's resolved statements (data.aws_iam_policy_document.github_ci_trusted_plan through its source documents) under
    a role key "trusted" reports aws_ssm_parameter.ducklake_neon_catalog_dsn checked with no findings, and with
    PlanSecretParameterRead removed it reports the trusted-role finding (the coverage check's own role list stays apply
    and planner; S3 owns adding the trusted role there, PLAN-trusted-plan-identity context); _read_coverage._check_resource on the real
    planner statements reports aws_ssm_parameter.ducklake_neon_catalog_dsn checked with no findings, and with
    DriftSessionSecretParameterRead removed from the statements it reports the planner finding;
    validate_planner_secret_value_reads, run against a temp copy of every input it reads (terraform/personal,
    terraform/bootstrap and .github), passes on the unmutated copy and, with that statement's condition removed,
    fails with the finding naming DriftSessionSecretParameterRead.
- file: config/agent/verification_registry/entries/secret-parameters-expand.yaml
  action: Create
  purpose: Graduation record for VP step 1 (check_spec.node_id tests/test_secret_parameters_expand.py).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
- >-
  terraform/personal at merge through terraform-apply-sandbox.yml: 1 create (aws_ssm_parameter.ducklake_neon_catalog_dsn)
  and in-place updates of the eight Lambda role policies, aws_iam_role_policy.github_ci_planner,
  aws_iam_role_policy.github_ci_trusted_plan and four aws_lambda_function environments. In-budget inline-policy updates on boundary-carrying agent-platform-* roles and a
  non-IAM create auto-apply behind the guard (Decision 77/92 pt 5); a ROUTE instead goes to tf-gated-apply for
  Benjamin. The apply role's DSN write and read come from secrets-to-ssm-grants' admin apply.
- No code path changes, so no Lambda deploy channel fires.
- The admin copy run (VP step 8) after the apply, in ADMIN under PlatformAdmin's SecretParameterAdmin grant.
acceptance_criteria:
- terraform/personal declares the nine names, the DSN SecureString as the one declared exception, the per-role parameter grants mirroring the Secrets Manager grants (the trusted-plan role's included, rec-4683), the planner's three reads with the drift condition, and the new env vars (TestSecretParametersExpand).
- After the apply, the DSN parameter's value equals the DSN secret's value, and every grant simulates as planned (VP step 7).
- After the copy run, all eight out-of-band parameters exist and equal their secrets (SECRETS_TO_SSM_COPY_OK 8/8), and nothing reads them yet.
- The merge-time reviewer digest names the DSN parameter's value attribute but never prints its value (tests/test_terraform_plan_digest.py), and no public plan.bin run artifact from a run after the merge is left in place (VP step 11).
verification_plan:
- step: 1
  phase: pre-deploy
  action: The expand surface has the planned shape
  command: bin/venv-python -m pytest tests/test_secret_parameters_expand.py -q
  expected: all pass; before the change the file does not exist (exit 4, red)
  fix_if: a predicate misreads real HCL -- fix it without loosening; a shape difference -- fix the HCL
  hermetic: true
  graduation: graduate
  graduation_check_id: secret-parameters-expand
- step: 2
  phase: pre-deploy
  action: The rules from secrets-to-ssm-grants pass on the new surface (the first real SecureString)
  command: >-
    bin/venv-python -m pytest tests/checks/iam_tf tests/test_terraform_apply_guard.py tests/test_terraform_plan_digest.py -q && bin/venv-python -c "from
    scripts.checks.iam_tf.validate_secret_material_handling import validate_secret_material_handling as a; from
    scripts.checks.iam_tf.validate_secret_parameter_grants import validate_secret_parameter_grants as b; from
    scripts.checks.iam_tf.validate_ci_refresh_read_coverage import validate_ci_refresh_read_coverage as c; from
    scripts.checks.iam_tf.validate_planner_secret_value_reads import validate_planner_secret_value_reads as d; f=[];
    [fn(f) for fn in (a, b, c, d)]; print('FAILURES', f); assert not f; print('EXPAND_CHECKS_OK')"
  expected: >-
    all pass, then FAILURES [] and EXPAND_CHECKS_OK; no finding names aws_ssm_parameter.ducklake_neon_catalog_dsn (its
    positive coverage is asserted in tests/test_secret_parameters_expand.py)
  fix_if: >-
    a coverage or planner-check failure -- stop and return to the planner (the checks and the grant form were designed
    together); never relax a check
  hermetic: true
  graduation: waive
  graduation_waiver_reason: These suites and checks already run in the fast tier; step 1 carries this plan's assertions.
- step: 3
  phase: pre-deploy
  action: Provider-free formatting check on the touched root
  command: terraform fmt -check terraform/personal
  expected: exit 0
  fix_if: run terraform fmt on the touched files only
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The required terraform-validate CI job enforces fmt.
- step: 4
  phase: pre-deploy
  action: The speculative plan on the PR shows exactly the planned changes
  command: >-
    echo 'VIA MCP: mcp__github__pull_request_read(method="get_comments", owner="otl-labs", repo="ontheloop",
    pullNumber=<this PR>) -- read the "Terraform Speculative Plan" comment for the PR head sha'
  expected: >-
    1 to add (aws_ssm_parameter.ducklake_neon_catalog_dsn), 15 to change in place (eight Lambda role policies, the
    planner policy, the trusted-plan role policy, four Lambda functions' environments, and aws_iam_role_policy.github_ci_branch, whose data.aws_iam_policy_document.github_ci_branch is read during apply because it references the ARNs of Lambdas with pending changes, so the comment shows the whole document removed and re-added as (known after apply)), 0 to destroy; the deferred read's
    statement blocks equal the policy's current statements; "Predicted guard verdict: PASS" (the github_ci_branch and
    github_ci_trusted_plan updates are in-budget inline-policy updates on boundary-carrying agent-platform-* roles)
  fix_if: any other change, or the DSN secret version shows a diff -- stop and return to the planner; never merge
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: post-deploy
  action: ENVIRONMENT CHECK before the live reads
  command: >-
    bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
    'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
  expected: ADMIN_CHAIN_OK in this project's ADMIN environment
  fix_if: ADMIN_CHAIN_ABSENT -- hand steps 6-8 to an ADMIN session through the coordinator
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: post-deploy
  action: The apply is green and the DSN parameter holds the same value as the DSN secret (compared in memory, never printed)
  command: |-  # pragma: allowlist secret
    bin/venv-python -c "import boto3, hmac; s=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); a=s.client('secretsmanager').get_secret_value(SecretId='ducklake-neon-catalog-dsn')['SecretString']; p=s.client('ssm').get_parameter(Name='/secret/ducklake-neon-catalog-dsn', WithDecryption=True)['Parameter']; got=(p['Type'], hmac.compare_digest(a.encode(), p['Value'].encode())); print('LIVE', got); assert got==('SecureString', True), got; print('DSN_PARAMETER_MATCH_OK')"
  expected: >-
    the apply run for the merge commit is green (mcp__github__actions_list / actions_get), then LIVE ('SecureString',
    True) and DSN_PARAMETER_MATCH_OK. The apply role's own create and re-read are the first live proof that the aws/ssm
    key decrypts under the boundary.
  fix_if: the apply is red -- follow deploy-paths.yaml's reconcile row, never a local apply; a KMS AccessDenied -- stop and RCA (the key assumption in secrets-to-ssm-grants' context failed)
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: post-deploy
  action: Live simulate of the new grants (read-only, ADMIN)
  command: |-  # pragma: allowlist secret
    bin/venv-python -c "import boto3; s=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); iam=s.client('iam'); a=s.client('sts', region_name='eu-west-1', endpoint_url='https://sts.eu-west-1.amazonaws.com').get_caller_identity()['Account']; p='arn:aws:ssm:eu-west-2:'+a+':parameter/secret/'; d=lambda role,n,ctx=None: iam.simulate_principal_policy(PolicySourceArn='arn:aws:iam::'+a+':role/'+role, ActionNames=['ssm:GetParameter'], ResourceArns=[p+n], **({'ContextEntries':[{'ContextKeyName':'aws:userid','ContextKeyValues':['AROAEXAMPLE:'+ctx],'ContextKeyType':'string'}]} if ctx else {}))['EvaluationResults'][0]['EvalDecision']; pl='agent-platform-github-ci-planner'; tp='agent-platform-github-ci-trusted-plan'; got=(d('agent-platform-ducklake-writer','ducklake-neon-catalog-dsn'), d('agent-platform-ducklake-writer','agent-platform-ducklake-telemetry-writer-dsn'), d('agent-platform-ducklake-maintenance','agent-platform-ducklake-smoke-maintainer-dsn'), d(pl,'agent-platform-terraform-personal-tfvars','terraform-plan-pr'), d(pl,'neon-api-key','terraform-plan-pr'), d(pl,'neon-api-key','tf-drift-convergence-writer'), d(pl,'ducklake-neon-catalog-dsn','terraform-plan-pr'), d(tp,'neon-api-key'), d(tp,'ducklake-neon-catalog-dsn'), d(tp,'agent-platform-terraform-personal-tfvars'), d(tp,'agent-platform-ducklake-telemetry-writer-dsn')); print('LIVE', got); assert got==('allowed','implicitDeny','allowed','allowed','implicitDeny','allowed','implicitDeny','allowed','allowed','allowed','implicitDeny'), got; print('EXPAND_GRANTS_LIVE_OK')"
  expected: >-
    LIVE ('allowed', 'implicitDeny', 'allowed', 'allowed', 'implicitDeny', 'allowed', 'implicitDeny', 'allowed',
    'allowed', 'allowed', 'implicitDeny') and EXPAND_GRANTS_LIVE_OK (the last four rows: the trusted-plan role reads the
    Neon key, DSN and tfvars parameters, and nothing else under /secret/). Role names are the live names in the touched .tf files (fix the literal if one differs).
    eu-west-1 STS endpoint (Plan A). Post only the tuple.
  fix_if: any other tuple -- stop and RCA
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: HUMAN-DIRECTED ADMIN COPY RUN -- the eight out-of-band values into SSM, on Benjamin's word on the exact command
  command: >-
    echo 'ADMIN: present the exact command bin/venv-python -m scripts.ops.secrets_to_ssm_copy --profile agent_platform_admin;
    run it only after Benjamin replies naming it; then run it again with --verify'
  expected: >-
    His message id recorded; the run prints eight "created" lines and SECRETS_TO_SSM_COPY_OK 8/8; the --verify run
    prints eight "unchanged" lines and SECRETS_TO_SSM_COPY_OK 8/8. The tier column shows whether tfvars needed Advanced
    (USD 0.05 a month). No value or hash is printed.
  fix_if: a mismatch or failure line -- stop and show him the output; never pass --overwrite without his word naming it
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: Fast tier before push
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0
  fix_if: any failure -- fix on the branch
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole fast-tier run (recursion refusal for graduation); step 1 carries the durable regression.
- step: 10
  phase: pre-deploy
  action: Full tier, then HEAD attestation, before commit and push (handoff_policy)
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: the full tier exits 0 and the validation result attests the current HEAD's tree
  fix_if: any failure -- fix and rerun the full tier from the start
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The full tier cannot graduate (recursion refusal); it is the handoff gate.
- step: 11
  phase: post-deploy
  action: No public plan.bin run artifact is left from a run after the merge (rec-4230 is open; the rec-4230 constraint, constraints[7])
  command: >-
    echo 'VIA MCP: mcp__github__actions_list(method="list_workflow_runs") for terraform-apply-sandbox.yml and reconcile.yml
    since the merge commit; for each run, actions_list(method="list_workflow_run_artifacts") and count artifacts whose
    name starts with sandbox-fresh-plan- or reconcile-fresh-plan- and are not expired'
  expected: >-
    0 such artifacts, or each one listed has been deleted on Benjamin's word after its gated job consumed it or its run
    ended; post the count only
  fix_if: one exists -- ask Benjamin to delete it (his word on the exact artifact); never delete one before its gated job has run or the run has ended
  hermetic: false
  graduation: not-applicable
