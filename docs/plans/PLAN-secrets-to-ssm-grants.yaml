- |-
  docs/DECISIONS.md -- add one annotation line at the end of each amended entry (before its closing ---):
    Decision 101: [Amendment <date>, Decision N: point (b) gains the /secret/ SSM name family for secret values, a deliberate exclusion from /agent-platform/*.]
    Decision 213: [Amendment <date>, Decision N: cl.5's scoped-login value lives in its /secret/ SecureString parameter; the password is never displayed or stored outside it.]
    Decision 230: [Amendment <date>, Decision N: cl.4's login secrets are /secret/ SecureString parameters.]
- |-
