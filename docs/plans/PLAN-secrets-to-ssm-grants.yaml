schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: secrets-to-ssm-grants
intent: >-
  Plan 1 of plan D (Secrets Manager to SSM Parameter Store). Lay down the rules and the admin-root grants before any
  secret parameter exists: one new Decision for the /secret/ name family and its SSM value-verb rule, the
  secret-material-handling contract amendment, three check extensions (no pattern value grant covering /secret/, every
  SecureString a declared value exception, no data-source read of a secret), the terraform/bootstrap grants the later
  plans need (CI apply write on the DSN parameter and value reads on three parameters, PlatformDev reads on the two
  inference keys, the PlatformAdmin operator statement), the value-copy script, and rec-4626 (the PAT ARN leaves the
  bootstrap grants). Nothing in terraform/personal changes, so no secret parameter exists when this merges.
implementation_declared: true
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-secrets-to-ssm-grants.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): plan D's move to SSM (rec-4539 is closed by retire-github-pat-secret) and rec-4626. No tier_item criterion claimed. Second of
  plan D's five plans: retire-github-pat-secret, this plan, secrets-to-ssm-expand, secrets-to-ssm-cutover,
  secrets-to-ssm-retire.
scope:
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    Insert the new Decision pinned in execution step 2 directly above the newest entry (DECISIONS.md is newest-first;
    next free number at implementation, 237 today, above Decision 236) and one amendment annotation each under
    Decisions 101, 213 and 230 (execution step 3).
- file: tests/checks/decisions/test_secret_parameters_decision.py
  action: Create
  purpose: >-
    The Decision's entry, envelope (amends [101, 213, 230]), six numbered clauses, required tokens, reversal ids,
    6,144-byte cap and the three annotations (the test_telemetry_production_catalog_decision.py shape). N is read from
    validate_secret_parameter_grants.py's docstring citation, never hard-coded.
- file: docs/contracts/secret-material-handling.yaml
  action: Modify
  purpose: >-
    The value-material plane covers SSM SecureString parameters too: description, a secret_parameter_out_of_band
    pattern, runtime_fetch naming both stores, two domains rows, governance_notes naming the second evaluator rule set,
    the file header comment's first line, and the amendment_log entry, all pinned in execution step 4. value_exceptions
    is unchanged here (the DSN parameter's entry lands with the resource in secrets-to-ssm-expand).
- file: scripts/checks/iam_tf/validate_secret_material_handling.py
  action: Modify
  purpose: >-
    Two new rules beside the existing one: every resource "aws_ssm_parameter" whose type is "SecureString" is a
    declared value_exceptions entry (address aws_ssm_parameter.<name>); and no data "aws_secretsmanager_secret_version"
    block and no data "aws_ssm_parameter" block whose name is under /secret/ exists anywhere under terraform/ (the
    Decision's cl.3). An aws_ssm_parameter whose type is not a string literal, and a data "aws_ssm_parameter" whose
    name is not a string literal, fail closed.
    One Decision 170 examined() declaration counting all three resource kinds.
- file: tests/checks/iam_tf/test_validate_secret_material_handling.py
  action: Modify
  purpose: Red and green synthetic trees for the two new rules; the real tree passes.
- file: scripts/checks/iam_tf/validate_secret_parameter_grants.py
  action: Create
  purpose: >-
    New fast-tier check (the Decision's cl.2): no Allow statement in terraform/personal or terraform/bootstrap grants an
    SSM value verb (ssm:GetParameter, GetParameters, GetParametersByPath, GetParameterHistory, PutParameter, or any
    action wildcard covering one) on a Resource or NotResource whose wildcard pattern covers a parameter/secret/ ARN.
    The two exceptions the Decision names are matched by file and Sid: github_ci_apply_boundary.tf (a ceiling) and
    platform_admin_policies.tf Sid SecretParameterAdmin. Docstring cites "(Decision <N>, secret parameters)".
- file: tests/checks/iam_tf/test_validate_secret_parameter_grants.py
  action: Create
  purpose: >-
    Red cases on synthetic HCL in both statement styles, green controls, the two exceptions, and the real tree. Plus
    test_registered_in_pre_and_full_sequence: the check name is in registry.pre_sequence() and registry.full_sequence()
    (N1's shape).
- file: scripts/checks/iam_tf/_manifest.py
  action: Modify
  purpose: Register validate_secret_parameter_grants (pre=True, full_segment full_after_lint), beside validate_secret_material_handling.
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: >-
    function_to_category row for validate_secret_parameter_grants, iam_gap like validate_secret_material_handling,
    carrying the same "# pragma: allowlist secret -- check name, not a credential" comment (plan_obligations companion
    registration).
- file: scripts/checks/iam_tf/_read_coverage.py
  action: Modify
  purpose: >-
    _scan_resources also records the type attribute's literal for aws_ssm_parameter (None when it is not a literal).
    An aws_ssm_parameter whose type is "SecureString" (or not a literal) needs ALL-OF ssm:GetParameter and
    ssm:ListTagsForResource on a Resource covering its own name (its refresh decrypts), so a Describe*/List* grant cannot green it; other aws_ssm_parameter instances keep the
    ANY-OF markers. The match is path-aware (today's segment matcher returns False for parameter/secret/<name> against
    the name /secret/<name>): a quoted entry covers the parameter when, with each ${...} replaced by *, it fnmatches
    arn:aws:ssm:R:A:parameter<name>, or when the raw text references aws_ssm_parameter.<rname>. A bare local or var
    reference never covers (fail closed). The match lives in a new submodule
    scripts/checks/iam_tf/_secure_string_coverage.py (shared by both sides, under 500 SLOC); _check_resource gains only
    the call for the read side (Decision 128).
- file: scripts/checks/iam_tf/_write_coverage.py
  action: Modify
  purpose: >-
    Unchanged for SecureString logic (check_write_coverage receives only type, name and file, so the per-instance write
    rule runs from the facade instead; see validate_ci_refresh_read_coverage.py). rec-4626: the line-163 comment
    "ENUMERATED at five" says two.
- file: scripts/checks/iam_tf/validate_ci_refresh_read_coverage.py
  action: Modify
  purpose: >-
    The facade calls the new check_secure_string_write_coverage(apply_statements, resources, locals_map, attr_index,
    failed, key) beside check_write_coverage: a SecureString (or non-literal type) aws_ssm_parameter needs
    ssm:PutParameter, ssm:DeleteParameter, ssm:AddTagsToResource and ssm:RemoveTagsFromResource on a Resource covering
    its own name (the same path-aware match), not just the parameter/agent-platform/* marker. Other aws_ssm_parameter
    instances are unchanged. Its PASS line is unchanged.
- file: scripts/checks/iam_tf/_secure_string_coverage.py
  action: Create
  purpose: >-
    The path-aware SecureString match and check_secure_string_write_coverage (purposes above). Pure functions, no I/O.
- file: scripts/checks/iam_tf/_write_companions.py
  action: Modify
  purpose: rec-4626 -- the UpdateSecret why-string "ENUMERATED at five ARNs" says two (the PAT ARN is gone).
- file: tests/checks/iam_tf/test__secure_string_coverage.py
  action: Create
  purpose: >-
    (test__read_coverage.py is at 500 SLOC and unregistered, so the cases go here.) Read side: red for only
    ssm:Describe* on the name, a bare local reference, and parameter/secret/<other>; green for ssm:GetParameter on the
    real template "arn:aws:ssm:${var.aws_region}:${var.account_id}:parameter/secret/<name>" and on a resource reference.
    Write side: red for PutParameter only on parameter/agent-platform/*, and for missing tag verbs; green on the real
    template. Plus one end-to-end red case per side through validate_ci_refresh_read_coverage on a synthetic
    terraform/personal tree (a SecureString parameter with only ssm:Describe* for the planner; only the
    parameter/agent-platform/* marker for the apply role). No real-tree SecureString exists until secrets-to-ssm-expand,
    so every case is synthetic.
- file: scripts/checks/iam_tf/validate_planner_secret_value_reads.py
  action: Modify
  purpose: >-
    N1's check also covers SSM (the Decision's cl.2 planner sentence): an Allow statement in the planner's resolved
    policy whose actions cover an SSM value verb (the list in validate_secret_parameter_grants) on a parameter/secret/
    resource must carry N1's StringLike aws:userid reserved-session condition, except a statement whose only such
    resource is the /secret/agent-platform-terraform-personal-tfvars parameter. Resource forms (execution step 6):
    quoted strings only, each ${...} treated as *; an entry reaches /secret/ when it fnmatches
    arn:aws:ssm:R:A:parameter/secret/probe or contains ":parameter/secret/", or, for an action covering
    ssm:GetParametersByPath, when its path is an ancestor of /secret/ (it ends in ":parameter", ":parameter/",
    ":parameter/secret" or ":parameter/secret/"; a by-path grant covers every level below); any non-string resource expression on a
    statement with an SSM value verb fails closed. The exemption is one exact string,
    "arn:aws:ssm:${var.aws_region}:${var.account_id}:parameter/secret/agent-platform-terraform-personal-tfvars", added
    to ALLOWED_UNCONDITIONED under the authority of Decision N cl.2's planner sentence. Vacuous until
    secrets-to-ssm-expand adds the planner grants; the Secrets Manager half is unchanged.
- file: tests/checks/iam_tf/test_validate_planner_secret_value_reads.py
  action: Modify
  purpose: >-
    New failing-first fixtures: an unconditioned ssm:GetParameter on /secret/neon-api-key, ssm:Get* on parameter/secret/*,
    a condition naming another session, and a bare local reference as the resource; green fixtures: the conditioned
    drift read and the unconditioned tfvars read, both in the real template form.
- file: terraform/bootstrap/github_ci_apply_reads.tf
  action: Modify
  purpose: >-
    New Sid SecretParameterValueRead (ssm:GetParameter, ssm:ListTagsForResource) on exactly three parameter ARNs:
    /secret/neon-api-key, /secret/agent-platform-terraform-personal-tfvars, /secret/ducklake-neon-catalog-dsn. rec-4626:
    the PAT ARN leaves SecretsManagerValueReadEnumerated, whose comments at the Sid and near line 119 say four ARNs
    (today's "six" is stale; five remain before this edit, four after). N1's stale comment that neon-api-key's "sole
    consumer is a data.aws_secretsmanager_secret_version" says its consumer is scripts/ci/neon_api_key.sh.
- file: terraform/bootstrap/github_ci_apply_policy.tf
  action: Modify
  purpose: >-
    New Sid SecretParameterDsnWrite (ssm:PutParameter, DeleteParameter, AddTagsToResource, RemoveTagsFromResource) on
    exactly /secret/ducklake-neon-catalog-dsn, the one Terraform-managed secret parameter. rec-4626: the PAT ARN leaves
    SecretsManagerUpdateEnumerated (three ARNs today, two after) and its comment's stale "five" says two.
- file: terraform/bootstrap/platform_dev_policies.tf
  action: Modify
  purpose: >-
    New Sid InferenceCredentialsParameterRead (ssm:GetParameter) on exactly the two inference-key parameter ARNs, built
    from var.aws_region and var.account_id (the parameters do not exist yet, so no data-source lookup).
- file: terraform/bootstrap/platform_admin_policies.tf
  action: Modify
  purpose: >-
    New Sid SecretParameterAdmin (ssm:PutParameter, GetParameter, GetParameters, DeleteParameter, AddTagsToResource,
    RemoveTagsFromResource, ListTagsForResource) on parameter/secret/*, the operator statement the Decision's cl.2 names;
    the same verb set as SSMParameterProvisioning. SecretsManagerAdmin stays (the org-transfer credentials remain).
- file: docs/contracts/iam-simulate-fixture.yaml
  action: Modify
  purpose: >-
    rec-4626: p0-6-update-secret-enumerated targets the deepseek fixture ARN and says two. Three new flow-style rows for
    the apply role (allowed PutParameter on the DSN parameter; implicitDeny PutParameter on /secret/neon-api-key;
    implicitDeny GetParameter on /secret/agent-platform-deepseek-api-key), the p0-6 row compacted to one line, so the
    file stays within its 650-line structural budget; amendment_log entry (newest-first).
- file: scripts/ops/secrets_to_ssm_copy.py
  action: Create
  purpose: >-
    The one value-copy tool, run in ADMIN only on Benjamin's word on the exact command: for the eight out-of-band
    secrets, GetSecretValue then PutParameter as SecureString at /secret/<name> (aws/ssm key, standard tier unless over
    4,096 bytes), never overwriting a differing value without --overwrite; --verify is read-only. Prints only names,
    outcomes, tier and a match flag, never a value or hash. Its first line is #!/usr/bin/env python3 (scripts/ops/ has no
    __init__.py; the shebang clears ruff INP001, as every scripts/ci/*.py does), and no docstring or code line
    contains the token "sts" (Plan A's STS census scans non-comment lines).
- file: tests/test_secrets_to_ssm_copy.py
  action: Create
  purpose: >-
    Stubbed clients only: create, unchanged, mismatch-without-overwrite, tier selection at 4,096 bytes, --verify makes no
    write, exit codes, no value or digest in captured output, no STS client.
- file: config/agent/verification_registry/entries/secret-parameter-grant-rules.yaml
  action: Create
  purpose: Graduation record for VP step 1 (check_spec.node_id tests/checks/iam_tf/test_validate_secret_parameter_grants.py).
- file: config/agent/verification_registry/entries/secret-parameters-bootstrap-grants.yaml
  action: Create
  purpose: Graduation record for VP step 2 (check_spec.node_id tests/test_secret_parameters_bootstrap.py).
- file: config/agent/verification_registry/entries/secrets-to-ssm-copy-script.yaml
  action: Create
  purpose: Graduation record for VP step 3 (check_spec.node_id tests/test_secrets_to_ssm_copy.py).
- file: tests/test_secret_parameters_bootstrap.py
  action: Create
  purpose: >-
    Text predicates on the four bootstrap files: each new Sid's exact actions and ARNs, no data "aws_caller_identity"
    reference in a new statement, the PAT ARN gone from both enumerated Sids, and controls that the existing
    SSMParameterRead, SecretsManagerMetadataRead and SecretsManagerAdmin Sids are unchanged.
bundled_recommendations:
- rec-4626
followon_recs: []
infrastructure_dependencies:
- >-
  terraform/bootstrap (admin-only, Decision 126): after merge, Benjamin's word on the exact command, then an ADMIN apply
  from main updating four policies in place (aws_iam_role_policy.github_ci_apply, aws_iam_policy.github_ci_apply_reads,
  aws_iam_role_policy.platform_dev_runtime and aws_iam_role_policy.platform_admin_ops). Nothing is created or destroyed. Serialized with plan B's bootstrap
  apply: never two admin applies in flight.
- terraform/personal is not touched, so the merge fires no apply and no Lambda deploy channel.
acceptance_criteria:
- The new Decision is in DECISIONS.md with Benjamin's approved wording and its three annotations (test_secret_parameters_decision.py).
- validate_secret_parameter_grants, the extended validate_secret_material_handling and the SecureString coverage rules are in the fast tier and green on the real tree, each with red cases.
- After the admin apply, the live CI apply role may write only the DSN parameter and read only the three named parameters under /secret/, PlatformDev reads only the two inference parameters, and PlatformAdmin administers /secret/* (VP step 9).
- The copy script exists, is tested with stubs, and has not been run (its run follows secrets-to-ssm-expand's merge).
- rec-4626 closes through the Resolves trailer.
verification_plan:
- step: 1
  phase: pre-deploy
  action: The grant rule, the SecureString rules and both coverage overrides hold with red cases
  command: >-
    bin/venv-python -m pytest tests/checks/iam_tf/test_validate_secret_parameter_grants.py
    tests/checks/iam_tf/test_validate_secret_material_handling.py tests/checks/iam_tf/test__secure_string_coverage.py
    tests/checks/iam_tf/test__read_coverage.py tests/checks/iam_tf/test__write_coverage.py
    tests/checks/decisions/test_secret_parameters_decision.py
    tests/checks/iam_tf/test_validate_planner_secret_value_reads.py -q
  expected: all pass; before the change the new test file and the Decision test do not exist (red)
  fix_if: a red case passes silently or the real tree fails -- fix the check, never loosen what it asserts
  hermetic: true
  graduation: graduate
  graduation_check_id: secret-parameter-grant-rules
- step: 2
  phase: pre-deploy
  action: The bootstrap grants have exactly the planned shape and the PAT ARN is gone
  command: bin/venv-python -m pytest tests/test_secret_parameters_bootstrap.py -q
  expected: all pass; before the change the file does not exist (exit 4, red)
  fix_if: a predicate misreads real HCL -- fix the predicate without loosening it; a shape difference -- fix the HCL
  hermetic: true
  graduation: graduate
  graduation_check_id: secret-parameters-bootstrap-grants
- step: 3
  phase: pre-deploy
  action: The copy script never prints a value and never overwrites silently
  command: bin/venv-python -m pytest tests/test_secrets_to_ssm_copy.py -q
  expected: all pass; before the change the file does not exist (red)
  fix_if: any test fails -- fix the script; never weaken the no-value-output assertion
  hermetic: true
  graduation: graduate
  graduation_check_id: secrets-to-ssm-copy-script
- step: 4
  phase: pre-deploy
  action: The existing IAM check suites and the policy-size check still pass
  command: bin/venv-python -m pytest tests/checks/iam_tf -q
  expected: >-
    all pass. validate_iam_policy_size checks presence only; the byte headroom was measured at plan time (reads
    policy about 4.5 KB of 6,144 B, apply inline policy about 7,990 of 10,240 B), and VP step 7's AWS plan fails on a
    real overflow
  fix_if: the reads policy exceeds its byte limit -- stop and return to the planner; never split a Sid to dodge it
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Existing suites already run in the fast and full tiers; steps 1-3 carry this plan's assertions.
- step: 5
  phase: pre-deploy
  action: Provider-free formatting check on the touched root (init, validate and plan are the gate's job)
  command: terraform fmt -check terraform/bootstrap
  expected: exit 0
  fix_if: run terraform fmt on the touched files only
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The required terraform-validate CI job enforces fmt; a registry row would duplicate it.
- step: 6
  phase: pre-deploy
  action: ENVIRONMENT CHECK -- the gate and the post-merge apply need the ADMIN chain
  command: >-
    bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
    'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
  expected: ADMIN_CHAIN_OK in this project's ADMIN environment
  fix_if: ADMIN_CHAIN_ABSENT -- the PR waits at CI-green and steps 7-9 go to an ADMIN session through the coordinator
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: >-
    PRE-MERGE GATE (ADMIN) -- read-only plan of terraform/bootstrap at the CI-green PR head: exactly four in-place
    policy updates, nothing created or destroyed
  command: |-
    test -n "$PR_HEAD_SHA" && M="${TMPDIR:-/tmp}/ssm-grants-gate" && (umask 077 && mkdir -p "$M") && aws secretsmanager get-secret-value --secret-id agent-platform-terraform-personal-tfvars --profile agent_platform_admin --query SecretString --output text | grep -E '^[[:space:]]*(account_id|owner_email|platform_dev_external_id|platform_admin_external_id|agent_service_account_user_name)[[:space:]]*=' > "$M/bootstrap.tfvars" && W="$M/wt" && git fetch origin "$PR_HEAD_SHA" && git worktree add --detach "$W" "$PR_HEAD_SHA" > /dev/null && rc=0 && { terraform -chdir="$W/terraform/bootstrap" init -input=false > /dev/null && terraform -chdir="$W/terraform/bootstrap" plan -input=false -lock=false -var-file="$M/bootstrap.tfvars" -out="$M/head.tfplan" > /dev/null && terraform -chdir="$W/terraform/bootstrap" show -json "$M/head.tfplan" > "$M/head.json"; } || rc=1; git worktree remove --force "$W"; rm -f "$M/head.tfplan" "$M/bootstrap.tfvars"; test $rc -eq 0 && M="$M" bin/venv-python - <<'EOF'
    import json, os, sys
    m = os.environ["M"]
    rc = json.load(open(f"{m}/head.json")).get("resource_changes", [])
    os.remove(f"{m}/head.json")
    moving = sorted((r["type"], tuple(r["change"]["actions"])) for r in rc if r["change"]["actions"] not in (["no-op"], ["read"]))
    out = {"add": sum("create" in a for _, a in moving), "change": sum(a == ("update",) for _, a in moving), "destroy": sum("delete" in a for _, a in moving), "types": sorted({t for t, _ in moving})}
    print(json.dumps(out))
    sys.exit(0 if out == {"add": 0, "change": 4, "destroy": 0, "types": ["aws_iam_policy", "aws_iam_role_policy"]} else "PRE-MERGE PLAN STOP")
    EOF
  expected: >-
    one counts-only JSON line {"add": 0, "change": 4, "destroy": 0, "types": ["aws_iam_policy", "aws_iam_role_policy"]};
    posted on the PR with $PR_HEAD_SHA; a new head re-runs it. If live already differs from main, the counts differ:
    stop and show Benjamin before going on.
  fix_if: >-
    any other count or a plan error -- stop and RCA (Decision 55); never apply to make the plan match. If the session's
    permission layer refuses the tfvars read, ask Benjamin to allow this exact command. If Plan B already removed the
    two External ID lines from the tfvars, the grep finds fewer names: return to the planner for B's source
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: HUMAN-DIRECTED ADMIN APPLY of terraform/bootstrap from main, after Benjamin's word on the exact command
  command: >-
    echo 'ADMIN, after merge: present the exact command -- terraform -chdir=terraform/bootstrap plan -input=false
    -var-file=<scratch bootstrap.tfvars> -out=<scratch>/apply.tfplan then terraform -chdir=terraform/bootstrap apply
    <scratch>/apply.tfplan -- with the counts line from the same plan; run it only after Benjamin replies naming this
    PR; delete the tfvars and plan files in the same step'
  expected: Benjamin's own message approving the command (message id in the merged-PR comment); apply exits 0 with 0 added, 4 changed, 0 destroyed
  fix_if: >-
    the post-merge plan differs from the gate's counts -- stop and show him; an apply error -- stop and RCA, never
    retry with a narrower -target
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: post-deploy
  action: Live simulate of the new grants on the three roles (read-only, ADMIN)
  command: |-  # pragma: allowlist secret
    bin/venv-python -c "import boto3; s=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); iam=s.client('iam'); a=s.client('sts', region_name='eu-west-1', endpoint_url='https://sts.eu-west-1.amazonaws.com').get_caller_identity()['Account']; p='arn:aws:ssm:eu-west-2:'+a+':parameter/secret/'; d=lambda role,act,n: iam.simulate_principal_policy(PolicySourceArn='arn:aws:iam::'+a+':role/'+role, ActionNames=[act], ResourceArns=[p+n])['EvaluationResults'][0]['EvalDecision']; ap='agent-platform-github-ci-apply'; got=(d(ap,'ssm:PutParameter','ducklake-neon-catalog-dsn'), d(ap,'ssm:PutParameter','neon-api-key'), d(ap,'ssm:GetParameter','agent-platform-terraform-personal-tfvars'), d(ap,'ssm:GetParameter','agent-platform-deepseek-api-key'), d('PlatformDev','ssm:GetParameter','agent-platform-anthropic-api-key'), d('PlatformDev','ssm:GetParameter','neon-api-key'), d('PlatformAdmin','ssm:PutParameter','agent-platform-ducklake-telemetry-writer-dsn')); print('LIVE', got); assert got==('allowed','implicitDeny','allowed','implicitDeny','allowed','implicitDeny','allowed'), got; print('SECRET_PARAMETER_GRANTS_LIVE_OK')"
  expected: >-
    LIVE ('allowed', 'implicitDeny', 'allowed', 'implicitDeny', 'allowed', 'implicitDeny', 'allowed') and
    SECRET_PARAMETER_GRANTS_LIVE_OK; then bin/venv-python -m scripts.ci.iam_simulate passes on the fixture rows. The
    account lookup uses the eu-west-1 STS endpoint (Plan A). Post only the tuple, never an ARN or account id.
  fix_if: any other tuple -- stop and RCA; the PlatformDev and PlatformAdmin role names are the live names in terraform/bootstrap/platform_roles.tf
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: post-deploy
  action: rec-4626 closed through the Resolves trailer
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
    fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4626']); print(sorted((r['id'], r['status']) for r
    in rows))"
  expected: "[('rec-4626', 'closed')] after ci.yml's closure job for the merge commit"
  fix_if: still open -- read the closure job log; its oracle may need the post-apply state, so re-run after step 8
  hermetic: false
  graduation: not-applicable
- step: 11
  phase: pre-deploy
  action: Fast tier before push
  command: bin/venv-python -m scripts.validate --pre
  expected: exit 0; validate_secret_parameter_grants, validate_secret_material_handling, validate_contract_drift, validate_admin_root_premerge_gate and validate_graduation_completeness PASS
  fix_if: any failure -- fix on the branch
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A whole fast-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 1-3 carry the durable regressions.
- step: 12
  phase: pre-deploy
  action: Full tier, then HEAD attestation, before commit and push (handoff_policy)
  command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
  expected: the full tier exits 0 and the validation result attests the current HEAD's tree
  fix_if: any failure -- fix and rerun the full tier from the start
