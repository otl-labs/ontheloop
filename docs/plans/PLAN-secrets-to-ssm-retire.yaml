  purpose: >-
    In ci_full_refresh_read delete SecretsManagerTfvarsRead (its secret is deleted here) and N1's metadata-only
    SecretsManagerDuckLakeNeonDSNRead (its secret is destroyed here, so validate_ci_refresh_read_coverage no longer
