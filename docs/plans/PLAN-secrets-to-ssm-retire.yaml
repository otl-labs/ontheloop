constraints:
- >-
  Always-ask, each needing Benjamin's own action: the merge (his typed word; IAM and seven destroys), the
  tf-gated-apply approval (his, in GitHub), and the CloudShell blocks of VP steps 4, 5 and 7-10 (his paste; the build
  session holds no admin identity, Decision 257 cl.7). The console deletion of the two out-of-band secrets was his own
  action, done 2026-11-23. The contract texts (execution steps 5 and 6) were shown to him before the plan PR
  merged.
- "Every Secrets Manager deletion keeps the 30-day recovery window; never force-delete (Decision 157 residual (b))."
- "deploy-paths.yaml (gated text) and tests/test_secrets_to_ssm_cutover.py are out of scope: the scoped-login procedure is deferred to rec-5560 (operator choice 2026-11-24). Accepted residual against Decision 237 cl.6 (and 213 cl.5 / 230 cl.4 as it amends them): after this plan merges, mutation_1_write_secret still names the retired Secrets Manager write, so a run would write the /secret/ parameter and then fail before mutation_2 sets the Neon password -- a partial write. Nobody runs the procedure until rec-5560 lands (it is already unrunnable under Decision 256); the build PR body says so."
- "The bootstrap apply runs only after the personal gated apply is green: the apply role's DeleteSecret grants must still be live for the destroys."
- "Secrets Manager itself stays: the terraform/github apply App key (Decision 248) and the org-transfer operator credentials (Decision 218) remain there, and so do PlatformAdmin's SecretsManagerAdmin and the metadata prefix Sids."
- "Public repo (Decision 101): no account id, ARN or value in any file or evidence."
- "Agent-session identity calls stay off the eu-west-2 STS host (Plan A); the operator's CloudShell blocks are not proxied."
- No rescue agents or workaround loops (Decision 55).
- "Deadline: neon-api-key and the tfvars secret purge about 2026-12-23 (scheduled 2026-11-23, 30-day window); VP 5 and VP 10 run before 2026-12-22. After the purge, describing either returns ResourceNotFound: count it as deleted and drop their probes (apply_neon, planner_tfvars, planner_drift_neon, trusted_neon), noting it on the PR."
- "cites keeps dec:246 (critique R2-N6, disputed): the round-3 scout fingerprint was computed with it in cites (the tool unions them), and it is RELATED -- the approved-text route was considered and the gated procedure deferred to rec-5560. Dropping it changes no content and would force a re-scout."
- "Escalation (critique round 3, operator 2026-11-24, accept-with-deferral): R3-B1 and R3-B2, pre-existing planner-check bypasses unused in the live tree, are accepted residuals owned by rec-5600 (High, after this merge). rec-5547 (open CI red, vp-replay rule (v)) is owned by another agent and deferred on the operator's word; this plan's VP 1 and VP 2 already follow rule (v)."
