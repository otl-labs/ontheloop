bundled_recommendations: []
followon_recs: []
infrastructure_dependencies:
- >-
  terraform/personal at merge: seven aws_secretsmanager_secret destroys (30-day recovery window, the provider default;
  Decision 157 residual (b)), one version forgotten by the removed block, in-place updates of the eight Lambda role
  policies, the planner policy, the trusted-plan role policy and four Lambda environments. The destroys ROUTE the plan to tf-gated-apply; Benjamin
  approves it there. The apply role's DeleteSecret grants (SecretsManagerDuckLakeNeonDSN, SecretsManagerMetadataWrite)
  are still live at this point.
- >-
  terraform/bootstrap (admin-only): only after that gated apply is green, Benjamin's word on the exact command, then an
  ADMIN apply from main updating four policies in place. Serialized with plan B's admin apply.
- Benjamin deletes neon-api-key and agent-platform-terraform-personal-tfvars in the AWS console with the 30-day recovery window (no grant is added for it).
- No code path changes, so no Lambda deploy channel fires.
acceptance_criteria:
- "Before merge, the soak holds -- at least 7 days since secrets-to-ssm-cutover merged, eight secrets' LastAccessedDate is on or before the cutover date, and every DSN secret read since then is a Terraform refresh by the drift session, the apply role or the trusted-plan role (VP step 5)."
- terraform/personal and terraform/bootstrap hold no Secrets Manager resource, value grant, env var or output for the nine, the SSM counterparts remain (TestSecretsManagerRetired), and the planner's only drift-session value read is the SSM statement (validate_planner_secret_value_reads).
- After the gated apply and the admin apply, all nine secrets are scheduled for deletion, the live roles deny GetSecretValue on their real ARNs (the apply role on both its retired value reads, the planner also under the drift session, the trusted-plan role on the Neon key and DSN), the iam-simulate fixture passes with zero mismatches, and the drift run stays green (VP steps 8-10).
- No file under src/, scripts/, .github/, terraform/, bin/ or docs/runbooks/ reads one of the nine secrets from Secrets Manager (VP step 11).
verification_plan:
- step: 1
  phase: pre-deploy
  action: The Secrets Manager surface for the nine is gone and the SSM surface remains
  command: bin/venv-python -m pytest tests/test_secrets_manager_retired.py -q
  expected: all pass; before the change the file does not exist (exit 4, red)
  fix_if: a predicate misreads real HCL -- fix it without loosening; a leftover -- remove it
  hermetic: true
  graduation: graduate
  graduation_check_id: secrets-manager-retired
- step: 2
  phase: pre-deploy
  action: The IAM and coverage suites pass with the narrower tree
  command: bin/venv-python -m pytest tests/checks/iam_tf tests/test_secret_parameters_expand.py tests/test_secret_parameters_bootstrap.py tests/test_iam_simulate.py tests/test_secrets_to_ssm_cutover.py -q
  expected: all pass; the read and write coverage maps keep their Secrets Manager types (nothing declares them now)
  fix_if: a failure -- fix the HCL or the named test; never delete a check
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Existing suites already run in the fast and full tiers; step 1 carries this plan's assertions.
- step: 3
  phase: pre-deploy
  action: Provider-free formatting check on both touched roots
  command: terraform fmt -check terraform/personal && terraform fmt -check terraform/bootstrap
  expected: exit 0
  fix_if: run terraform fmt on the touched files only
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The required terraform-validate CI job enforces fmt.
- step: 4
  phase: pre-deploy
  action: ENVIRONMENT CHECK -- the soak read, the gate and the admin apply need the ADMIN chain
  command: >-
    bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q
    'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
  expected: ADMIN_CHAIN_OK in this project's ADMIN environment
  fix_if: ADMIN_CHAIN_ABSENT -- the PR waits at CI-green; steps 5, 7, 8, 9 and 10 go to an ADMIN session through the coordinator
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: pre-deploy
  action: >-
    The soak holds -- no read of eight old secrets since the cutover (LastAccessedDate), and every DSN secret read since
    then is a Terraform refresh by the drift session, the apply role or the trusted-plan role (S3's full refresh, if
    rec-4637 has landed) (CloudTrail; the version stays in state until
    this plan forgets it, so its LastAccessedDate always moves)
  command: |-  # pragma: allowlist secret
    test -n "$CUTOVER_DATE" && CUTOVER_DATE="$CUTOVER_DATE" bin/venv-python -c "import boto3, datetime, json, os; c=datetime.date.fromisoformat(os.environ['CUTOVER_DATE']); assert (datetime.date.today()-c).days >= 7, 'soak shorter than 7 days'; s=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); sm=s.client('secretsmanager'); names=['neon-api-key','agent-platform-terraform-personal-tfvars','agent-platform-deepseek-api-key','agent-platform-anthropic-api-key','agent-platform-ducklake-telemetry-writer-dsn','agent-platform-ducklake-telemetry-writer-prod-dsn','agent-platform-ducklake-telemetry-reader-dsn','agent-platform-ducklake-smoke-maintainer-dsn']; late=[n for n in names if (d:=sm.describe_secret(SecretId=n).get('LastAccessedDate')) and d.date() > c]; ct=s.client('cloudtrail'); ok=bad=0; start=datetime.datetime.combine(c+datetime.timedelta(days=1), datetime.time(), tzinfo=datetime.timezone.utc); ev=[e for pg in ct.get_paginator('lookup_events').paginate(LookupAttributes=[{'AttributeKey':'EventName','AttributeValue':'GetSecretValue'}], StartTime=start) for e in pg['Events']]; rows=[json.loads(e['CloudTrailEvent']) for e in ev]; rows=[r for r in rows if 'ducklake-neon-catalog-dsn' in str((r.get('requestParameters') or {}).get('secretId',''))]; arn=lambda r: (r.get('userIdentity') or {}).get('arn',''); ok=sum(':assumed-role/agent-platform-github-ci-planner/tf-drift-convergence-writer' in arn(r) or ':assumed-role/agent-platform-github-ci-apply/' in arn(r) or ':assumed-role/agent-platform-github-ci-trusted-plan/' in arn(r) for r in rows); bad=len(rows)-ok; print('SOAK late', late, 'dsn_reads_ok', ok, 'dsn_reads_other', bad); assert not late and bad == 0, (late, bad); print('SOAK_OK 9')"
  expected: >-
    SOAK late [] dsn_reads_ok <n> dsn_reads_other 0, then SOAK_OK 9, posted on the PR with $PR_HEAD_SHA (counts only;
    never a caller ARN). CUTOVER_DATE is secrets-to-ssm-cutover's merge date; CloudTrail event history keeps 90 days,
    far more than the soak
  fix_if: a late read or a DSN read by any other caller -- something still reads Secrets Manager; find it with CloudTrail (read-only) and fix it in its own PR before this one merges
  hermetic: false
  graduation: not-applicable
- step: 6
  phase: pre-deploy
  action: The speculative plan on the PR shows exactly the planned changes
  command: >-
    echo 'VIA MCP: mcp__github__pull_request_read(method="get_comments", owner="otl-labs", repo="ontheloop",
    pullNumber=<this PR>) -- read the "Terraform Speculative Plan" comment for the PR head sha'
  expected: >-
    0 to add, 15 to change in place (14 planned, the trusted-plan role policy among them, plus aws_iam_role_policy.github_ci_branch, whose data.aws_iam_policy_document.github_ci_branch is read during apply because it references the ARNs of Lambdas with pending changes, so the comment shows the whole document removed and re-added as (known after apply); its deferred statement blocks equal the
    current statements), 7 to destroy (the seven envelopes), the version forgotten (not destroyed); "Predicted guard
    verdict: BLOCKED" (the destroys route the plan to tf-gated-apply)
  fix_if: any other change -- stop and return to the planner; never merge
  hermetic: false
  graduation: not-applicable
- step: 7
  phase: pre-deploy
  action: >-
    PRE-MERGE GATE (ADMIN) -- read-only plan of terraform/bootstrap at the CI-green PR head: exactly four in-place
    policy updates
  command: |-
    test -n "$PR_HEAD_SHA" && M="${TMPDIR:-/tmp}/ssm-retire-gate" && (umask 077 && mkdir -p "$M") && aws ssm get-parameter --name /secret/agent-platform-terraform-personal-tfvars --with-decryption --profile agent_platform_admin --query Parameter.Value --output text | grep -E '^[[:space:]]*(account_id|owner_email|platform_dev_external_id|platform_admin_external_id|agent_service_account_user_name)[[:space:]]*=' > "$M/bootstrap.tfvars" && W="$M/wt" && git fetch origin "$PR_HEAD_SHA" && git worktree add --detach "$W" "$PR_HEAD_SHA" > /dev/null && rc=0 && { terraform -chdir="$W/terraform/bootstrap" init -input=false > /dev/null && terraform -chdir="$W/terraform/bootstrap" plan -input=false -lock=false -var-file="$M/bootstrap.tfvars" -out="$M/head.tfplan" > /dev/null && terraform -chdir="$W/terraform/bootstrap" show -json "$M/head.tfplan" > "$M/head.json"; } || rc=1; git worktree remove --force "$W"; rm -f "$M/head.tfplan" "$M/bootstrap.tfvars"; test $rc -eq 0 && M="$M" bin/venv-python - <<'EOF'
    import json, os, sys
    m = os.environ["M"]
    rc = json.load(open(f"{m}/head.json")).get("resource_changes", [])
    os.remove(f"{m}/head.json")
    moving = sorted((r["type"], tuple(r["change"]["actions"])) for r in rc if r["change"]["actions"] not in (["no-op"], ["read"]))
    out = {"add": sum("create" in a for _, a in moving), "change": sum(a == ("update",) for _, a in moving), "destroy": sum("delete" in a for _, a in moving), "types": sorted({t for t, _ in moving})}
    print(json.dumps(out))
    sys.exit(0 if out == {"add": 0, "change": 4, "destroy": 0, "types": ["aws_iam_policy", "aws_iam_role_policy"]} else "PRE-MERGE PLAN STOP")
    EOF
  expected: "one counts-only JSON line {\"add\": 0, \"change\": 4, \"destroy\": 0, ...}; posted with $PR_HEAD_SHA; a new head re-runs it"
  fix_if: any other count or a plan error -- stop and RCA; never apply before merge
  hermetic: false
  graduation: not-applicable
- step: 8
  phase: post-deploy
  action: The gated personal apply is green and the seven envelopes are scheduled for deletion
  command: |-  # pragma: allowlist secret
    bin/venv-python -c "import boto3; sm=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2').client('secretsmanager'); names=['ducklake-neon-catalog-dsn','agent-platform-deepseek-api-key','agent-platform-anthropic-api-key','agent-platform-ducklake-telemetry-writer-dsn','agent-platform-ducklake-telemetry-writer-prod-dsn','agent-platform-ducklake-telemetry-reader-dsn','agent-platform-ducklake-smoke-maintainer-dsn']; got=sum(sm.describe_secret(SecretId=n).get('DeletedDate') is not None for n in names); print('SCHEDULED', got); assert got==7; print('ENVELOPES_RETIRED_OK')"
  expected: the tf-gated-apply run for the merge commit is green (MCP actions_list / actions_get), then SCHEDULED 7 and ENVELOPES_RETIRED_OK
  fix_if: the apply is red -- follow deploy-paths.yaml's reconcile row, never a local apply
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: post-deploy
  action: HUMAN-DIRECTED ADMIN APPLY of terraform/bootstrap from main, only after step 8, on Benjamin's word on the exact command
  command: >-
    echo 'ADMIN: present terraform -chdir=terraform/bootstrap plan -input=false -var-file=<scratch bootstrap.tfvars>
    -out=<scratch>/apply.tfplan (the scratch bootstrap.tfvars built from the same SSM fetch as VP step 7) with its counts
    line, then terraform -chdir=terraform/bootstrap apply
    <scratch>/apply.tfplan; run it only after Benjamin replies naming this PR; delete the scratch files in the same step'
  expected: his message id recorded; apply exits 0 with 0 added, 4 changed, 0 destroyed
  fix_if: the counts differ from the gate's -- stop and show him
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: post-deploy
  action: >-
    HUMAN -- Benjamin deletes the two out-of-band secrets in the console; then the apply role's narrower grant surface
    is checked against the iam-simulate fixture (deploy-paths.yaml admin_out_of_band.procedure's completion condition
    for the VP step 9 apply) and the live state is probed
  command: |-  # pragma: allowlist secret
    bin/venv-python -m scripts.ci.iam_simulate --profile agent_platform_admin --fixture docs/contracts/iam-simulate-fixture.yaml && bin/venv-python -c "import boto3; s=boto3.Session(profile_name='agent_platform_admin', region_name='eu-west-2'); sm=s.client('secretsmanager'); iam=s.client('iam'); sec={n: sm.describe_secret(SecretId=n) for n in ('neon-api-key','agent-platform-terraform-personal-tfvars','ducklake-neon-catalog-dsn','agent-platform-deepseek-api-key')}; oob=sum(sec[n].get('DeletedDate') is not None for n in ('neon-api-key','agent-platform-terraform-personal-tfvars')); ctx=lambda v: [{'ContextKeyName':'aws:userid','ContextKeyValues':['AROAEXAMPLE:'+v],'ContextKeyType':'string'}]; d=lambda role,n,c=None: iam.simulate_principal_policy(PolicySourceArn=iam.get_role(RoleName=role)['Role']['Arn'], ActionNames=['secretsmanager:GetSecretValue'], ResourceArns=[sec[n]['ARN']], **({'ContextEntries':ctx(c)} if c else {}))['EvaluationResults'][0]['EvalDecision']; pl='agent-platform-github-ci-planner'; got=(oob, d('agent-platform-github-ci-apply','neon-api-key'), d(pl,'agent-platform-terraform-personal-tfvars'), d('agent-platform-github-ci-apply','ducklake-neon-catalog-dsn'), d(pl,'ducklake-neon-catalog-dsn','tf-drift-convergence-writer'), d(pl,'neon-api-key','tf-drift-convergence-writer'), d('PlatformDev','agent-platform-deepseek-api-key'), d('agent-platform-ducklake-writer','ducklake-neon-catalog-dsn'), d('agent-platform-github-ci-trusted-plan','neon-api-key'), d('agent-platform-github-ci-trusted-plan','ducklake-neon-catalog-dsn')); print('LIVE', got); assert got==(2,)+('implicitDeny',)*9, got; print('SECRETS_MANAGER_RETIRED_LIVE_OK')"
  expected: >-
    His message saying both are deleted (recovery window 30 days); iam_simulate exits 0 with zero mismatches; then LIVE (2, 'implicitDeny', 'implicitDeny',
    'implicitDeny', 'implicitDeny', 'implicitDeny', 'implicitDeny', 'implicitDeny', 'implicitDeny', 'implicitDeny') and
    SECRETS_MANAGER_RETIRED_LIVE_OK (the last two: the trusted-plan role no longer reads either secret).
    The apply role is probed on both of its retired value reads (SecretsManagerValueReadEnumerated via neon-api-key,
    SecretsManagerDuckLakeNeonDSN via the DSN). Every probe uses the secret's real ARN from describe_secret (it answers
    while deletion is scheduled), because the writer and PlatformDev grants named the exact suffixed ARN; the two planner drift probes carry the drift session's aws:userid,
    because the retired planner statement was conditioned on it. No STS call. Then the next scheduled terraform-drift
    run on main is green (MCP). Post only the tuple.
  fix_if: an iam_simulate mismatch or any other tuple -- stop and RCA; a wrong fixture row is fixed in a forward PR, a wrong grant goes back to Benjamin; never re-apply by hand
  hermetic: false
