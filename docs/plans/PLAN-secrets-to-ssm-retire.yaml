  command: >-
    for d in src scripts .github terraform bin docs/runbooks; do test -e "$d" || { echo "MISSING $d"; exit 1; }; done;
    ! git grep -n -E 'neon-api-key|agent-platform-terraform-personal-tfvars|ducklake-neon-catalog-dsn|agent-platform-(deepseek|anthropic)-api-key|agent-platform-ducklake-(telemetry-writer|telemetry-writer-prod|telemetry-reader|smoke-maintainer)-dsn|ducklake_neon_catalog_dsn_secret_arn|TELEMETRY_DSN_SECRET_ID|DUCKLAKE_DSN_SECRET_ID'
    -- src scripts .github terraform bin docs/runbooks ':!scripts/checks/iam_tf/_write_coverage.py'
    ':!scripts/checks/iam_tf/_read_coverage.py' | grep -v '/secret/' | grep -iE
    'secretsmanager|secret_arn|get-secret-value|get_secret_value|SecretId|_SECRET_ID' && echo RETIRE_SWEEP_OK
  expected: prints RETIRE_SWEEP_OK
