rollback: >-
  Consumers read SSM throughout, so nothing breaks while the secrets are scheduled for deletion and no restore is
  required. Inside the 30-day recovery window the operator may restore any of the nine from CloudShell (aws
  secretsmanager restore-secret --secret-id <name>, on his own word; read-only otherwise). Re-adopting a restored
  envelope into terraform/personal is not a revert PR with import blocks: the trusted-plan HCL screen refuses import
  blocks there (scripts/ci/terraform_hcl_screen_policy.py _PERSONAL imports_allowed false), so re-adoption runs through
  the operator-only break-glass loop (docs/contracts/terraform-cc-web-operations.yaml) or a separate plan that changes
  the screen policy. The bootstrap narrowing is undone by a forward PR re-adding the Sids, applied by the operator's
  CloudShell apply (Decision 257).
