infrastructure_dependencies:
- >-
  terraform/personal at merge: seven aws_secretsmanager_secret destroys (30-day recovery window, the provider default;
  Decision 157 residual (b)), one version forgotten by the removed block, in-place updates of the eight Lambda role
  policies, the planner policy, the trusted-plan role policy and four Lambda environments. The destroys ROUTE the plan to tf-gated-apply; Benjamin
  approves it there. The apply role's DeleteSecret grants (SecretsManagerDuckLakeNeonDSN, SecretsManagerMetadataWrite)
  are still live at this point.
- >-
  terraform/bootstrap: the merge's terraform-bootstrap-apply.yml push run previews and ends CLOUDSHELL_REQUIRED (the
  plan changes PlatformDev's and PlatformAdmin's inline policies, Decision 257 cl.2-3); only after the gated personal
  apply is green and no sandbox or reconcile run is in flight (PRE-APPLY drain), the operator applies the whole plan
  from CloudShell (VP step 9): four in-place policy updates. No other terraform/bootstrap apply may run in that sitting
  (the S3 lockfile serialises them, Decision 257 cl.6). Once the personal apply schedules the deletions, a
  terraform/bootstrap plan from an older base still holds the by-name data lookups and is expected to fail (inferred);
  open branches and unbuilt plans touching terraform/bootstrap rebase onto this merge, and an open terraform/personal
  PR's saved plan goes stale after the gated apply and re-plans on its next push (the build PR body says both).
- "Done ahead of the build: Benjamin deleted neon-api-key and agent-platform-terraform-personal-tfvars in the AWS console on 2026-11-23 with the 30-day recovery window (no grant was added for it); both are unread since the cutover and every consumer reads SSM. VP step 10 re-reads their DeletedDate."
- No code path changes, so no Lambda deploy channel fires.
acceptance_criteria:
- "Before merge, the soak holds -- at least 7 days since secrets-to-ssm-cutover merged, eight secrets' LastAccessedDate is on or before the cutover date, and every DSN secret read since then is a Terraform refresh by the drift session, the apply role or the trusted-plan role (VP step 5)."
- terraform/personal and terraform/bootstrap hold no Secrets Manager resource, value grant, env var or output for the nine, the SSM counterparts remain (TestSecretsManagerRetired), and the planner's only drift-session value read is the SSM statement (validate_planner_secret_value_reads).
- After the gated apply and the operator's CloudShell bootstrap apply, all nine secrets are scheduled for deletion, none of the probed roles (the apply role, planner, trusted-plan role, the DuckLake writer as the Lambda sample, and PlatformDev) is allowed GetSecretValue on their real ARNs, and the other Lambda roles hold no Secrets Manager grant (TestSecretsManagerRetired, VP 1) (PlatformAdmin's SecretsManagerAdmin keeps it by design) (the apply role on both its retired value reads, the planner also under the drift session, the trusted-plan role on the Neon key and DSN), the iam-simulate fixture passes with zero mismatches, and the drift run stays green (VP steps 8-10).
- No file under src/, scripts/, .github/, terraform/, bin/ or docs/runbooks/ reads one of the nine secrets from Secrets Manager (VP step 11).
verification_plan:
- step: 1
  phase: pre-deploy
  action: The Secrets Manager surface for the nine is gone and the SSM surface remains
  command: bin/venv-python -m pytest tests/test_secrets_manager_retired.py::TestSecretsManagerRetired tests/test_secrets_manager_retired.py::TestRedCases -q
  expected: >-
    all pass; before the change the file does not exist (exit 4, red). Class selectors, not the whole file, so the step
    stays hermetic under vp-red-before.yaml hermetic_authoring rule (v) (rec-5547); the build names the two classes
    exactly so.
  fix_if: a predicate misreads real HCL -- fix it without loosening; a leftover -- remove it
  hermetic: true
  graduation: graduate
  graduation_check_id: secrets-manager-retired
- step: 2
  phase: pre-deploy
  action: The IAM and coverage suites pass with the narrower tree
  command: bin/venv-python -m pytest tests/checks/iam_tf tests/test_secret_parameters_expand.py tests/test_secret_parameters_bootstrap.py tests/test_iam_simulate.py tests/test_secrets_to_ssm_cutover.py -q
  expected: all pass; the read and write coverage maps keep their Secrets Manager types (nothing declares them now)
  fix_if: a failure -- fix the HCL or the named test; never delete a check
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Existing suites already run in the fast and full tiers; step 1 carries this plan's assertions. Not hermetic: a
    whole-directory re-run of suites this plan modifies (hermetic_authoring rule (v), rec-5547).
- step: 3
  phase: pre-deploy
  action: Provider-free formatting check on both touched roots
  command: terraform fmt -check terraform/personal && terraform fmt -check terraform/bootstrap
  expected: exit 0
  fix_if: run terraform fmt on the touched files only
  hermetic: false
  graduation: waive
  graduation_waiver_reason: The required terraform-validate CI job enforces fmt.
- step: 4
  phase: pre-deploy
  action: >-
    ENVIRONMENT CHECK (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan), operator-run in AWS CloudShell in the
    PROD account as user/platform-breakglass once the PR is CI green. No agent session holds an admin identity
    (Decision 257 cl.7), so VP steps 5 and 7-10 are the operator's CloudShell blocks, which the build posts on the PR.
  command: >-
    ( printf 'caller-arn check: '; aws sts get-caller-identity --query Arn --output text 2> /dev/null | grep -q
    ':user/platform-breakglass$' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT )
  expected: caller-arn check, ADMIN_CHAIN_OK; the ARN itself is never printed
  fix_if: ADMIN_CHAIN_ABSENT -- the operator signs in as the break-glass user and re-runs; VP steps 5 and 7 wait
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: pre-deploy
  action: >-
    The soak holds, operator-run in CloudShell in VP 4's sitting -- no read of the eight old secrets since the cutover
    (LastAccessedDate), and every DSN secret read since then is a Terraform refresh by the drift session, the apply
    role or the trusted-plan role (CloudTrail; the version stays in state until this plan forgets it, so its
    LastAccessedDate always moves). Read-only; prints counts only.
  command: |-  # pragma: allowlist secret
    ( unset AWS_PROFILE; export AWS_REGION=eu-west-2 AWS_DEFAULT_REGION=eu-west-2; python3 - <<'EOF'
    import boto3, datetime, json
    c = datetime.date.fromisoformat("2026-11-02")
    assert (datetime.date.today() - c).days >= 7, "soak shorter than 7 days"
    s = boto3.Session()
    sm = s.client("secretsmanager")
    names = ["neon-api-key", "agent-platform-terraform-personal-tfvars", "agent-platform-deepseek-api-key",
             "agent-platform-anthropic-api-key", "agent-platform-ducklake-telemetry-writer-dsn",
             "agent-platform-ducklake-telemetry-writer-prod-dsn", "agent-platform-ducklake-telemetry-reader-dsn",
             "agent-platform-ducklake-smoke-maintainer-dsn"]
    late = [n for n in names if (d := sm.describe_secret(SecretId=n).get("LastAccessedDate")) and d.date() > c]
    start = datetime.datetime.combine(c + datetime.timedelta(days=1), datetime.time(), tzinfo=datetime.timezone.utc)
    pages = s.client("cloudtrail").get_paginator("lookup_events").paginate(
        LookupAttributes=[{"AttributeKey": "EventName", "AttributeValue": "GetSecretValue"}], StartTime=start)
    rows = [json.loads(e["CloudTrailEvent"]) for pg in pages for e in pg["Events"]]
    rows = [r for r in rows if "ducklake-neon-catalog-dsn" in str((r.get("requestParameters") or {}).get("secretId", ""))]
    ok_marks = (":assumed-role/agent-platform-github-ci-planner/tf-drift-convergence-writer",
                ":assumed-role/agent-platform-github-ci-apply/", ":assumed-role/agent-platform-github-ci-trusted-plan/")
    ok = sum(any(m in (r.get("userIdentity") or {}).get("arn", "") for m in ok_marks) for r in rows)
    print("SOAK late", len(late), "dsn_reads_ok", ok, "dsn_reads_other", len(rows) - ok)
    assert not late and len(rows) == ok, (len(late), len(rows) - ok)
    print("SOAK_OK 9")
    EOF
    )
  expected: >-
    SOAK late 0 dsn_reads_ok <n> dsn_reads_other 0, then SOAK_OK 9; the build posts the operator's counts on the PR
    with $PR_HEAD_SHA (never a caller ARN or a secret name list). CUTOVER is 2026-11-02 (secrets-to-ssm-cutover merge
    5d63b006, #1742); CloudTrail event history keeps 90 days. describe_secret still answers for neon-api-key and the
    tfvars while their deletion is scheduled. Planning-time read (2026-11-23, the operator's console list): the eight
    last retrieved 2026-11-02, the DSN 2026-11-23 (a refresh). That CloudShell's python3 imports boto3 is UNPROVEN
    until this step runs.
  fix_if: >-
    a late read or a DSN read by any other caller -- something still reads Secrets Manager; find it with CloudTrail
    (read-only) and fix it in its own PR before this one merges; ImportError on boto3 -- the operator runs pip3 install
    --user boto3 in CloudShell and re-runs
  hermetic: false
  graduation: not-applicable
