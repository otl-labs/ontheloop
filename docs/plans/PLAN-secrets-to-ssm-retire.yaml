slug: secrets-to-ssm-retire
intent: >-
  Plan 4, the last of plan D (Secrets Manager to SSM Parameter Store). After a soak with no read of the old secrets,
  retire them: terraform/personal destroys the seven Secrets Manager envelopes it manages (30-day recovery window kept)
  and forgets the DSN secret version, and every Secrets Manager value grant, old env var and secret-ARN output for the
  nine goes; terraform/bootstrap drops the enumerated Secrets Manager grants and lookups for them; the scoped-login
  procedure is deferred to rec-5560; the secret-material-handling contract says Secrets Manager is left only for
  operator-held credentials. Benjamin already deleted the two out-of-band secrets (neon-api-key, the tfvars) in the
  console on 2026-11-23. Spend falls by about USD 4 a month.
implementation_declared: false
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-secrets-to-ssm-retire.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): plan D's Secrets Manager retirement (rec-4539, the PAT half, is closed by
  retire-github-pat-secret; no rec is bundled here). No tier_item criterion claimed. Last of
  plan D's five plans.
cites: [dec:126, dec:157, dec:183, dec:235, dec:237, dec:244, dec:246, dec:248, dec:256, dec:257, dec:275, dec:277, dec:279]
