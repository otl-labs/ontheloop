schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
implementation_declared: true
slug: semanto-brand-identity
intent: >-
  Record the On The Loop brand-identity work as deferred_post_mvp Semanto rows -- the illustration commission, the
  OTL monogram logo system, the typography and the trademark filing -- and re-ground S1.9's positioning on
  milestone-and-gate dependency mapping, while discharging rec-3986 so the roadmap names On The Loop as the sole
  external brand (Decision 198) and points at Decision 101's clauses instead of restating them. When any S1.x item
  reactivates post-MVP it then starts from the current brand, audience pointer and open-core boundary, never from
  retired text, and every brand value it inherits is visibly provisional.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-semanto-brand-identity.yaml
phase: >-
  user_explicit_out_of_scope (soft-warn category) with bundled ad_hoc_rec rec-3986: no docs/ROADMAP-PLATFORM.yaml
  tier_item is claimed and no exit criterion is closed. The plan re-grounds deferred_post_mvp Semanto rows S1.1,
  S1.2, S1.6 and S1.9 and adds S1.10-S1.13, all deferred_post_mvp, with no depends_on edge from a live item
  (Decision 93). Names no CD.27-gated item, so no fallback_reevaluation block is owed. Slice semanto-brand-identity
  of overseer run otl-product-direction.
scope:
- file: docs/ROADMAP-SEMANTO.yaml
  action: Modify
  purpose: >-
    rec-3986 re-grounding of the header comment, document.description, agent_instructions and rows S1.1, S1.2 and
    S1.6 (On The Loop as the sole external brand; Decision 101 clauses pointed at as amended by Decisions 171, 198,
    202 and 209, never restated); S1.9 re-grounded with four open criteria; new deferred_post_mvp rows S1.10
    (illustration commission), S1.11 (OTL monogram logo system), S1.12 (typography) and S1.13 (trademark filing).
bundled_recommendations:
- rec-3986
followon_recs:
- rec-4557
- rec-4563
infrastructure_dependencies: []
acceptance_criteria:
- docs/ROADMAP-SEMANTO.yaml validates against RoadmapDocument, every tier_item stays deferred_post_mvp, and no
  docs/ROADMAP-PLATFORM.yaml item depends_on an S1.x id (Decision 93).
- No retired brand text remains -- zero matches for hiring managers, theseus.support and (case-insensitively)
  theseus -- and the header, description, agent_instructions, S1.1 and S1.6 point at Decision 101 as amended
  (Decisions 171, 198, 202, 209) instead of restating its clauses (b) and (f); S1.2 cites clause (e)'s operative
  domain value to Decision 198 clauses 2 and 3.
- S1.10-S1.13 exist with S1.11 and S1.12 depending on S1.10 and S1.13 on S1.11, user_action_required on S1.10 and
  S1.13, and structured open exit criteria. Every colour, palette and typeface value is a provisional placeholder
  (the palette entirely open, S1.10's brief naming the red/amber/green tension), and the brand tokens and colour
  rule are named as inputs to the visual-grammar contract, anchored by rec-4563 at exactly the four pointer sites
  the renderer plan repoints (agent_instructions, S1.10 c2, S1.11 c3, S1.12 c1), never defined in the roadmap.
- The visual language is credited to intuitive relationship mapping and schematic network diagrams, and the roadmap
  names no transit operator or transit mark anywhere, not even as a rule's reason; S1.11 c4 forbids a bisected or
  symmetrically intersected loop, and S1.13's clearance covers ring-and-bar marks.
- The agent_instructions, S1.10 c3 and S1.11 c6 state that the logo marks, illustrations, brand art and the visual
  identity as embodied in the commissioned works are On The Loop Labs Limited's, all rights reserved, covered
  neither by BUSL-1.1 nor by Apache-2.0 after the Decision 194 flip, each asset carrying its own notice; S1.12 c2
  points at S1.10 c3's notice; follow-on rec-4557 owns the explicit licence-surface exclusion.
- S1.9 carries the milestone-and-gate headline, the Signaller archetype by pointer to Decision 232 (whose section
  names the Signaller and credits no transit operator), described in marketing's own words, model-agnostic
  wording, the Decision 221 clause 4 hypothesis rule and a bare pointer to the open-core boundary as four open
  criteria.
- rec-3986's acceptance is re-authored to a decidable form that the trailer census buckets probeable (Decision
  201), and the squash commit's Resolves rec-3986 trailer closes it.
- The file stays inside the roadmaps size class (500 effective lines, 2,000-character lines; Decision 166) and the
  full validate tier passes on the committed, rebased tree.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    rec-3986's oracle in its decidable form (Decision 201): no retired brand text -- the restated hiring-manager
    audience line and the retired domain -- remains in the Semanto roadmap.
  command: >-
    test "$(grep -c 'hiring managers' docs/ROADMAP-SEMANTO.yaml)" -eq 0 && test "$(grep -c 'theseus.support'
    docs/ROADMAP-SEMANTO.yaml)" -eq 0
  expected: Exit 0 -- both counts are zero.
  fix_if: >-
    A non-zero count names the token: remove the restatement or point at Decision 101 as amended instead (S1.6's
    audience line, S1.2's domain). Never narrow the grep to make it pass.
  hermetic: true
  expected_literals: []
  graduation: graduate
  graduation_check_id: semanto-retired-brand-tokens-absent
- step: 2
  phase: pre-deploy
  action: >-
    Load the edited roadmap through RoadmapDocument (no validator reads this file until S1.5) and assert the
    slice's state: statuses, the new rows' edges and flags, S1.9's, S1.11's and S1.13's criteria, the provisional
    markers, the rec-4563 contract anchor at exactly four sites, the relationship-mapping source, the
    no-bisected-loop rule and no transit operator or transit mark named anywhere in the file, the
    all-rights-reserved brand-art rule and its rec-4557 owner, the positive Decision 101 pointer form (header,
    description, agent_instructions, S1.1, S1.2, S1.6) and S1.2's Decision 198 citations, vendor-neutral wording
    and no live dependent -- plus that Decision 232's own section (the sibling the overseer sequenced this
    implementation behind) names the Signaller and names no transit operator or mark (VP2's deny-list).
  command: >-
    bin/venv-python -c "import re, yaml; from pathlib import Path; from scripts.roadmap.platform_roadmap import
    RoadmapDocument; t = Path('docs/ROADMAP-SEMANTO.yaml').read_text(); d =
    RoadmapDocument.model_validate(yaml.safe_load(t)); s = {i.id: i for i in d.tier_items}; ai =
    d.document.agent_instructions; cr = lambda k: [c.text for c in s[k].exit_criteria]; deny =
    re.compile(r'(?i)London\s+Underground|\bTfL\b|Transport\s+for\s+London|\broundels?\b|\bBeck\b|\bTube\b|\bUnderground\b');
    p101 = 'Decision 101 as
    amended (Decisions 171, 198, 202, 209)'; assert all(i.status == 'deferred_post_mvp' for i in d.tier_items), [i.id
    for i in d.tier_items if i.status != 'deferred_post_mvp']; assert [s[k].depends_on for k in ('S1.10', 'S1.11',
    'S1.12', 'S1.13')] == [[], ['S1.10'], ['S1.10'], ['S1.11']]; assert s['S1.10'].user_action_required and
    s['S1.13'].user_action_required; assert [len(cr(k)) for k in ('S1.9', 'S1.10', 'S1.11', 'S1.12', 'S1.13')] ==
    [4, 3, 6, 3, 2]; assert all(c.status == 'open' for k in ('S1.9', 'S1.10', 'S1.11', 'S1.12', 'S1.13') for c in
    s[k].exit_criteria); assert 'milestones and gates' in s['S1.9'].name and 'Signaller' in s['S1.9'].intent and
    'Decision 232' in s['S1.9'].intent and 'champion' not in s['S1.9'].intent; assert 'placeholders' in
    s['S1.11'].intent and 'entirely open' in s['S1.11'].intent and 'provisional' in s['S1.12'].intent and
    'red/amber/green' in s['S1.10'].intent and 'Special Elite' in s['S1.12'].intent; assert 'rec-4563' in ai and all('rec-4563' in x for
    x in (cr('S1.10')[1], cr('S1.11')[2], cr('S1.12')[0])) and t.count('rec-4563') == 4; assert all('relationship mapping' in x for x in (ai,
    s['S1.9'].intent, s['S1.11'].intent)) and 'or a transit mark, as a source or as the reason for a rule' in ai and 'symmetrically intersected' in cr('S1.11')[3] and 'ring-and-bar marks' in
    cr('S1.13')[0]; assert not deny.search(t) and t.count('transit operator') == 1,
    (deny.findall(t), t.count('transit operator'));
    assert 'On The Loop Labs Limited' in s['S1.10'].intent and 'rec-4385' in s['S1.13'].intent and 'rec-4389' in
    ai and 'rec-4557' in ai; assert all('all rights reserved' in x for x in (ai, cr('S1.10')[2], cr('S1.11')[5])) and
    'S1.10 c3' in cr('S1.12')[1] and 'visual identity as embodied in the commissioned works' in ai and 'neither by BUSL-1.1 now nor by
    Apache-2.0' in ai; assert p101 in
    t.split('document:')[0] and p101 in d.document.description and p101 in ai and 'Decision 198 clause 2' in
    s['S1.2'].intent and 'Decision 198 clause 3' in s['S1.2'].intent and all('as amended' in x for x in (s['S1.1'].intent, s['S1.2'].intent,
    s['S1.6'].progress_note)); assert not re.search('(?i)theseus|hiring managers|OSS community|unchanged per Decision
    101|cheaper than|visual style', t); assert not re.search(r'(?i)\b(anthropic|openai|gemini|mistral)\b', t);
    assert not re.search(r'depends_on:.*\bS1\.', Path('docs/ROADMAP-PLATFORM.yaml').read_text()); m =
    re.search(r'(?ms)^## Decision 232:.*?(?=^## Decision |\Z)', Path('docs/DECISIONS.md').read_text()); assert m and
    'Signaller' in m.group(0) and not deny.search(m.group(0)), 'Decision 232 absent, names no Signaller, or
    names a transit operator or mark'; print('SEMANTO_BRAND_IDENTITY_OK')"
  expected: Exit 0 and the marker; no assertion trips.
  fix_if: >-
    A KeyError or failed assertion names the row or token: conform the row to execution steps 2-9 verbatim. A
    failure on the final assertion means product-surface-and-open-core has not merged Decision 232, its section does
    not name the Signaller, or it names a transit operator or mark (VP2's deny-list; the overseer reconciles that
    clause before the sibling merges) -- STOP and return BLOCKED (pre_implementation_checklist);
    never drop the assertion, the citation or the archetype name to make it pass, and never land the contradiction.
    A ValidationError names the malformed field.
  hermetic: true
  expected_literals:
  - SEMANTO_BRAND_IDENTITY_OK
  graduation: waive
  graduation_waiver_reason: >-
    It asserts this plan's own transient roadmap state -- every row deferred_post_mvp, S1.10-S1.13's edges, flags
    and criterion counts, all criteria open, the rec-4563 pointers the renderer plan will repoint, the Decision 232
    section -- which a legitimate per-item reactivation (Decision 93), criterion flip or repoint would redden. The
    standing Semanto validator is S1.5's. Step 1's graduated guard (rec-3986's own oracle) pins only its two tokens;
    the bare-theseus, OSS-community, unchanged-per, visual-style and vendor-name bans are deliberately transient,
    because rec-3925 keeps the ship-of-Theseus concept for taglines and documentation, so a standing whole-word ban
    would block a legitimate future row. The transit-name ban is permanent in substance but cannot graduate here:
    origin/main's roadmap already names no transit operator or mark, so a standing guard would be green before.
    After merge its standing carrier is the agent_instructions rule.
- step: 3
  phase: pre-deploy
  action: >-
    Full validate tier, the parent handoff verdict (closure step (c)): run on the committed, rebased, clean tree
    after the shard and the rec-3986 re-author exist -- YAML parse, plan schema, the structural-size class engine
    over docs/ROADMAP-SEMANTO.yaml (roadmaps class, 500 effective lines, 2,000-character lines), the verification
    registry over the graduated shard, and every other check.
  command: bin/venv-python -m scripts.validate
  expected: Exit 0 -- every check passes, including validate_structural_size_limits on the edited roadmap.
  fix_if: >-
    Read the failing check and fix the offending file; never weaken a check or raise a size limit. A size failure
    means the edit overshot (the draft measured 372 effective lines): compact the new rows' prose.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    It invokes scripts.validate, so the graduate partition would be refused statically (recursion_refusal), and PR
    CI already runs the --pre tier; this is the Decision 163 handoff full-tier run, not a standing guard.
- step: 4
  phase: pre-deploy
  action: >-
    Closure precondition (Decision 201): rec-3986's re-authored acceptance (execution step 11) is read back from the
    DuckLake reader, the trailer census buckets it probeable, and it holds on the edited tree. Reads the reader
    (credentials).
  command: >-
    bin/venv-python -c "import subprocess; from src.common.ducklake_reader_client import fetch_recs_by_ids,
    make_reader; from scripts.rec_trailer_acceptance import census; rows, _ = fetch_recs_by_ids(make_reader(),
    ['rec-3986']); e = census(['rec-3986'], rows=rows); assert [x['bucket'] for x in e] == ['probeable'], e;
    assert subprocess.run(rows[0]['acceptance'], shell=True).returncode == 0, rows[0]['acceptance'];
    print('REC_3986_ACCEPTANCE_PROBEABLE_AND_HOLDS')"
  expected: Prints the marker.
  fix_if: >-
    Bucket unprobeable_shape: the acceptance was not re-authored or still uses negated grep -q; redo execution
    step 11. Writer or reader unreachable: retry execution step 11 until it succeeds; do not open the
    implementation PR before this step passes, because an out_of_grammar refusal prints only a refusal marker and
    has no close_proposed route (ci_rca_lifecycle.close_recs_from_trailer). Still unreachable: STOP and return
    BLOCKED.
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: post-deploy
  action: >-
    CLOSURE OBLIGATION (bundled rec): rec-3986 is closed by the squash commit's Resolves rec-3986 trailer (ci.yml
    closure job, acceptance verdict holds). Reads the DuckLake reader (credentials).
  command: >-
    bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; rows, _ =
    fetch_recs_by_ids(make_reader(), ['rec-3986']); s = [r['status'] for r in rows]; assert s == ['closed'], s;
    print('REC_3986_CLOSED')"
  expected: Prints the marker.
  fix_if: >-
    Still open: read the closure job's per-rec log line at the merge sha. A refusal marker means the verdict did
    not hold -- diagnose why rec-3986's acceptance fails on main and fix it forward; VP step 4 passing before the PR
    rules out the out_of_grammar case. Never force-close it (Decision 201's amendment of Decision 186).
  hermetic: false
  graduation: not-applicable
