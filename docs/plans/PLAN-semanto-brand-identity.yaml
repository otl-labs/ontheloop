pre_implementation_checklist:
- Branch confirmed not on main
- docs/PROJECT_CONTEXT.md read
- 'Only the plan-cited decision sections read: 101 (with its dated amendments), 198, 93, 195, 209 cl.1, 221 cl.1/4/5,
  220 cl.7, 166, 201 and 232 (its Signaller definition, which S1.9 points at)'
- 'grep -q ''^## Decision 232:'' docs/DECISIONS.md succeeds on origin/main (product-surface-and-open-core merged), its
  section names the Signaller and names no transit operator or mark (VP2''s deny-list); if not, STOP and return
  BLOCKED -- never cite Decision 232 ahead of its merge or land a contradicting visual-language source'
- All files in scope located and readable
- Acceptance criteria understood and verifiable
execution_steps:
- 'Run git fetch origin main && git rebase origin/main first (the sibling merges before this implementation, so the
  branch must carry Decision 232 before VP step 2 reads it), then confirm the Decision 232 checklist item. Every
  edit below is to docs/ROADMAP-SEMANTO.yaml; S1.3, S1.4, S1.5, S1.7 and S1.8, candidate_decisions and
  cross_tier_gates stay byte-for-byte unchanged.'
- |-
  Header comment: replace the two lines "# Sibling roadmap: external-facing marketing / Semanto comms system." and
  "# Anchored by Decision 101 (External brand identity -- Theseus / Semanto)." with exactly these three lines:
  # Sibling roadmap: external-facing marketing, brand identity and comms for On The Loop.
  # Anchored by Decision 101 as amended (Decisions 171, 198, 202, 209). Decision 198: On The Loop is
  # the sole external brand; Semanto is this roadmap's internal name only, never a public-facing mark.
- |-
  document.description: replace the whole block scalar body with exactly:
      The Semanto marketing/comms roadmap. Semanto is this roadmap's internal name only, never a
      public-facing mark (Decision 198 clause 1). Governs the external-facing brand presence of On The
      Loop -- the single external mark for the platform and its products -- owned by On The Loop Labs
      Limited (Decisions 195, 198). All items are parked deferred_post_mvp (Decision 93) and none are
      eligible until the Platform MVP boundary is crossed and items are individually reactivated ->
      not_started.
      Decision 101 as amended (Decisions 171, 198, 202, 209) anchors the presentation-layer-only
      constraint, the marketing-prose exception, the public-content boundary, hosting and positioning.
      This file points at those clauses; it never restates or amends them.
- |-
  document.agent_instructions (other bullets unchanged). REPLACE the one-line bullet "- Decision 101 is the
