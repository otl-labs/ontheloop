  - Pinned-copy test with its DIVERGENCES list; run VP step 2.
  - >-
    Registry YAML, the two checks, manifest Entries, ci_rca_taxonomy rows, marker-grammar token, boundary_patterns,
    CODEOWNERS lines, check tests; run VP step 3.
  - Graduation shard for step 1.
  - Execute VP steps 4-6; on unrecoverable failure stop and RCA (Decision 55).
  - >-
    Closure evidence, recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state; parent
    validator evidence (VP step 6 full-tier exit 0 plus bin/venv-python -m scripts.checks.validation_result --verify-head for
    the pushed HEAD); structured postflight evidence (write the scripts.session.postflight_evidence.CATEGORIES JSON in
    the scratchpad, then bin/venv-python -m scripts.session.postflight --evidence <file>); the real outcome -- push, PR,
    CI green by event-driven wake (never polled), squash-merge on code review PROCEED under the standing rule.
