schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "sensitive-value-detectors"
intent: >-
  Give sensitive-value detection one home: a stdlib-only leaf package, src/sensitive_values, holding every detector class
  (seeded from the six existing redactors) and named profiles over them, so the production content reader (plan 2 of
  the rec-4481 program) masks transcript text with the same shapes the write-time scrubber uses, and the security
  project's rec-4657 widens one library instead of a seventh copy. The write-time scrubber becomes a byte-identical
  adapter (no parser bump). A corpus ratchet with a Decision-gated loosening marker fails any PR that lets a protected corpus
  case through unless a Decision names that case (Decision 235 class), and code-owned fingerprint pins make every other
  class-row or profile change a reviewed edit. The redactors that cannot import the package stay as copies, their pattern sets
  derived from their own code and pinned by tests to be no stronger than the read profile.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-sensitive-value-detectors.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Plan 1 of 3 for
  rec-4481 (High); plan 2 (PLAN-telemetry-content-reader) resolves rec-4481 at its acceptance test, so this plan bundles
  no rec. closes_criteria is empty: no tier_item criterion names this work.
closes_criteria: []
scope:
  - file: src/sensitive_values/__init__.py
    action: Create
    purpose: >-
      Facade (Decision 80/104/124 pattern) re-exporting the public surface: DetectorClass, MaskResult, mask,
      fingerprint, PROFILES, CLASSES, MARKER_FORMAT. No logic. Docstring: the single home for sensitive-value shapes; consumers pick a profile;
      a profile change that lowers a corpus count needs a detector-loosening-approved marker (Decision 235 cl.1).
  - file: src/sensitive_values/classes.py
    action: Create
    purpose: >-
      Frozen DetectorClass(id, family, pattern, kind, accept) rows, stdlib re only, compiled at import with no other
      import-time work. kind is whole (replace the match) or keep_prefix (keep group 1, replace the rest); no other kind until a row
      needs one. accept is None or a declared predicate spec (name, params) resolved by the
      engine, never a lambda, so the fingerprint can hash it: BEARER_TOKEN carries ("long_or_digit", min_len 32), scrub.py's
      heuristic. Every replaced part refuses to start at a marker ((?!\[REDACTED:) or a charset without "["), so a second
      pass counts nothing (scrub.py's idempotence semantics, tests/turn_capture/test_scrub.py). Rows,
      each with a one-line comment naming the redactor it was seeded from (ASSUMED_ROLE_SESSION's and URL_CREDENTIAL's
      comments mark what is new): AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
      AWS_SESSION_TOKEN, ANTHROPIC_API_KEY, GITHUB_TOKEN, BEARER_TOKEN (src/turn_capture/scrub.py, patterns copied
      character for character); URL_CREDENTIAL (a URL authority that carries userinfo -- user, password and host of
      a connection string -- replaced whole after the scheme, keep_prefix; seeded from the URL-credential branch of
      scripts/checks/ci_guards/validate_actions_evidence.py _SECRET_SHAPES, https?://[^/\s]+@, widened to any scheme
      so database DSNs are covered; no runtime redactor carries a URL-credential shape today);
      PASSWORD_ASSIGNMENT and X_AMZ_PARAM (src/common/ducklake_handler_errors.py's first two patterns, as keep_prefix so
      the key stays readable and only the value is masked); UNIQUE_ID (IAM unique IDs, every
      prefix in scrub.py's _KEY_PREFIXES except AKIA/ASIA, 16-17 characters, token-bounded as in
      scripts/ci/redaction_check.py:UNIQUE_ID_SHAPE); ACCOUNT_ID (redaction_check.py:ACCOUNT_ID_SHAPE verbatim,
      token-bounded so hex digests and SHAs are never hit, and an account inside an ARN is masked while the resource
      path stays, the rec-4656 mask_account_ids precedent; a UUID whose last group is all digits is a known false
      positive, about 0.35% of random UUIDs); ASSUMED_ROLE_SESSION (keep_prefix: keeps "assumed-role/<role>/" and
      masks the session name after it, which for an SSO session is the person's sign-in name; no copy carries it
      today); SSO_HUB_PROFILE (the third branch of .pre-commit-config.yaml's block-sensitive-identifiers regex verbatim,
      so the read profile covers every shape any copy blocks). No whole-ARN class: role and resource names are public in
      terraform/ or AWS-generated (AWSReservedSSO_<permission set>_<hash>), and the feedback loop needs them to read
      what an agent did; plan 2's Decision cl.2 carries the rule, and the reason lives here and in DIVERGENCES.
  - file: src/sensitive_values/profiles.py
    action: Create
    purpose: >-
      PROFILES: name -> ordered tuple of class ids, each applied once in order. write_time = scrub.py's CLASS_ORDER
      exactly. read_masked = write_time, then URL_CREDENTIAL, PASSWORD_ASSIGNMENT, X_AMZ_PARAM, UNIQUE_ID, ACCOUNT_ID,
      ASSUMED_ROLE_SESSION,
      SSO_HUB_PROFILE.
      MARKER_FORMAT "[REDACTED:{cls}]" for every profile (scrub.py's grammar). No S3 URI class: the data-lake bucket
      name is public in terraform/personal/main.tf, so masking it would cost transcript readability for no secrecy.
  - file: src/sensitive_values/engine.py
    action: Create
    purpose: >-
      mask(text, profile) -> MaskResult(text, counts), MaskResult a NamedTuple: applies the profile's classes in order
      with scrub.py's exact semantics (one re.sub per class, counts per class, only non-zero counts returned, never
      reports matched text, never raises on a str, idempotent with empty counts on a second pass). An unknown profile
      raises KeyError naming the profile only. ACCEPT, a closed name -> predicate-factory map ("long_or_digit": keep the
      match unless the token is at least min_len long or holds a digit); an unknown accept name raises KeyError.
      fingerprint(profile) -> "<profile>@<first 16 hex of sha256>" over each class's id, pattern source, flags, kind and
      accept spec (name and sorted params) in profile order, so a response names the exact detector set that masked it
      (plan 2) and an accept-spec name or parameter change changes the fingerprint. 16 hex, not 12: an all-digit 12-hex digest (about 0.36%)
      would be an account-shaped run that ACCOUNT_ID and the pinned copies mask; a 16-digit run is not.
  - file: src/turn_capture/scrub.py
    action: Modify
    purpose: >-
      Becomes an adapter: CLASS_ORDER = PROFILES["write_time"]; ScrubResult keeps its fields; scrub_text(text) returns
      ScrubResult(r.text, r.counts) for r = mask(text, "write_time"). The regexes and helper closures move to the package;
      scrub.py no longer imports re (asserted by test_write_time_identity). Output and counts are
      byte-identical (VP step 1), so parser_versions.yaml stays at claude_code 7 and the golden digest is unchanged. The
      docstring keeps the parser_version sentence and names the package as the pattern home.
  - file: tests/turn_capture/test_package_boundary.py
    action: Modify
    purpose: >-
      ALLOWED_FIRST_PARTY gains "src.sensitive_values" (planned-change, acceptance_criteria[2]): turn_capture stays
      plane-neutral because the new package is itself a stdlib leaf, enforced by the new importlinter contract. FORBIDDEN
      and the other two tests are unchanged.
  - file: .importlinter
    action: Modify
    purpose: >-
      New contract src-sensitive-values-is-a-leaf (forbidden: scripts, src.common, src.data, src.lambdas, src.schemas,
      src.telemetry, src.telemetry_client, src.turn_capture, src.row_rules), mirroring src-row-rules-is-a-leaf. The
      contract cannot forbid third-party imports; tests/sensitive_values/test_package_boundary.py asserts stdlib-only.
  - file: src/lambdas/data-pipeline/manifest.yaml
    action: Modify
    purpose: >-
      excludes gain src/sensitive_values beside src/turn_capture and src/row_rules, so the src/ include never bundles it
      and a package edit never marks data-pipeline affected (PLAN-ops-writer-row-rules precedent).
  - file: tests/lambda_manifest/test_bundle_checks.py
    action: Modify
    purpose: >-
      Add test_sensitive_values_excluded_from_data_pipeline, the twin of test_turn_capture_excluded_from_data_pipeline:
      the exclude is declared, compute_affected_artifacts over the package files omits data-pipeline, and a staged
      bundle holds no sensitive_values path.
  - file: scripts/checks/misc/sensitive_value_corpus.py
    action: Create
    purpose: >-
      Runtime-built corpus, no literal secret or account shapes (the never-commit hook and detect-secrets must never see
      one; Decision 138; tests/fixtures/turn_capture_corpus.build_secret's concatenation shapes are reused by copy because
      scripts/ cannot import tests/). Every case has a stable case_id matching ^[a-z0-9_]+$ (checked at call time), so a registry key never holds "/". POSITIVES, one Case(case_id, class_id, text,
      planted_value) per case, at least two per class and including scrub.py's JSON, export and Bearer-boundary shapes,
      ARNs in quoted, comma-terminated and AccessDenied contexts (planted value = the account field), 17-character unique
      IDs, credential-bearing URLs and DSNs, keep-prefix values, and hub profile names; NEGATIVES, Case(case_id, None, text, None) texts no
      read_masked class may touch (40-hex SHAs, sha256 and md5 digests, a hex digest holding an exactly-12-digit run
      bounded by hex letters (the PR #975 shape), 13-digit epoch milliseconds, UUIDs whose last group holds a letter,
      ISO timestamps, `token = get_token()`, a public s3:// path, an account-less ARN (the arn:aws:s3:::<bucket>
      shape), short Bearer words);
      KNOWN_FALSE_POSITIVES, the all-digit-last-group UUID with the class that hits it. A duplicate case_id raises at
      call time, never at import.
  - file: scripts/checks/misc/sensitive_value_detectors.py
    action: Create
    purpose: >-
      Two registered checks collocated with the registry's semantics (coverage_baseline.py shape). The registry's grain
      is one row per profile and POSITIVES case (Decision 187 cl.1: the population the ratchet protects is itself
      ratcheted, so a PR cannot loosen a class and swap the cases it now misses for ones it still catches).
      validate_detector_ratchet: (a) every live key -- "<profile>.<CLASS>.<case_id>@<first 8 hex of sha256(text + "\x00" + planted_value)>" for
      each POSITIVES case whose class is in the profile -- is registered, and every other registered key has value 0
      (a tombstone: a case or class retired by a marked drop, deletable later; the digest over text and planted value
      re-keys an in-place edit of either, so narrowing a planted value is a gated deletion like a text edit); (b) each live key's measured value -- 1 when the planted value is absent from mask(text, profile).text AND
      mask's counts[CLASS] >= 1 (attributed to its own class, so an earlier class cannot hide a loosening), else 0 --
      equals the registered value; (c) mask(text, profile) changes no NEGATIVES text; (d) every PROTECTED path
      (src/sensitive_values/, src/turn_capture/scrub.py, config/sensitive_value_detectors.yaml,
      scripts/checks/misc/sensitive_value_*.py, tests/sensitive_values/, tests/checks/misc/test_sensitive_value_*.py)
      is owned in .github/CODEOWNERS (validate_trusted_plan_environment._owned,
      GitHub last-match semantics, reused by import) and matches a Decision 117 boundary_patterns entry; (e) no
      narrowing, derived at the base ref (Decision 187 cl.1): HEAD's PROTECTED is a superset of the base check module's
      PROTECTED (ast.literal_eval of the base blob), and every base CODEOWNERS line and boundary_patterns entry that
      covers a base PROTECTED path is still present at HEAD; a base without the module (this plan's own PR) constrains
      nothing, and an unreachable base skips (e) alone with a printed SKIP line: (a)-(d) always run, and the check
      declares registry.examined over the keys and paths it checked, its unit text naming leg (e) as skipped when it was
      (Decision 170: a partial run never reads as complete). validate_detector_registry_edits: _marker_guard.check_state_diff plus check_present_markers
      on a RegistrySpec with token detector-loosening-approved, gated_direction down, weakened = head value < base value,
      gates_deletion = base value > 0 (a case or class leaves only after a marked drop to a 0 tombstone, which (a)
      admits), mention_candidates = the exact key only (the approving Decision names each case key; the "/"-free grammar keeps
      authorization at case level), reason_required true. Wired like scripts/checks/ci_guards/validate_schedule_removal_markers.py:
      SKIP (registry.skipped) when origin/main is unreachable or `git cat-file --batch` fails, the batched base reader
      (validate_schedule_removal_markers._batched_base_reader, reused by import, no third copy) returning "" for a file
      absent at the base (every entry new, so the plan's own PR passes), and registry.examined over the entry count.
  - file: config/sensitive_value_detectors.yaml
    action: Create
    purpose: >-
      The ratchet registry: one entry per profile and POSITIVES case, keyed "<profile>.<CLASS>.<case_id>@<8 hex of sha256(text + NUL + planted_value)>" (no "/", so
      _marker_guard's ancestor expansion, which splits on "/", yields no profile or class prefix that could authorize
      a whole class),
      value 1 (masked and attributed) or 0 (tombstone). Header comment names the marker grammar
      `# detector-loosening-approved: dec-NNN <reason>`, that a new case or a 0-to-1 raise is always free, and the
      mark-then-drop path for retiring a case.
  - file: scripts/checks/misc/_manifest.py
    action: Modify
    purpose: >-
      Entry rows for validate_detector_ratchet and validate_detector_registry_edits, pre=True, full_segment
      full_after_lint, no pre_globs (both run every tier; the ratchet is a few hundred regex calls).
  - file: docs/contracts/marker-grammar.yaml
    action: Modify
    purpose: >-
      New token detector-loosening-approved (direction down, reason_required true, used_by
      [validate_detector_registry_edits]) bound to the existing check_state_diff export, adding no export; its row
      comment says keys are "/"-free so a Decision authorizes one case, never a class (the tier-demotion-approved bare-key
      precedent, Decision 187 cl.4); one
      amendment_log entry (field_add, semantic_break false). The token puts detector loosening in Decision 235 cl.1's
      class by that clause's own wording.
  - file: config/agent/executor/capabilities.yaml
    action: Modify
    purpose: >-
      boundary_patterns gain src/sensitive_values/, src/turn_capture/scrub.py, config/sensitive_value_detectors.yaml,
      scripts/checks/misc/sensitive_value_, tests/sensitive_values/ and tests/checks/misc/test_sensitive_value_, under a comment citing Decision 235 cl.5 and the
      Decision 221 cl.2 precedent. Their checks then sit in Decision 235 cl.5's irreducible floor and T4.21's base-ref
      guard refuses executor diffs to them once built.
  - file: .github/CODEOWNERS
    action: Modify
    purpose: >-
      Six lines owned by the operator: /src/sensitive_values/, /src/turn_capture/scrub.py,
      /config/sensitive_value_detectors.yaml, /scripts/checks/misc/sensitive_value_*.py, /tests/sensitive_values/,
      /tests/checks/misc/test_sensitive_value_*.py (the pins only tests hold: identity digest, copy table,
      DIVERGENCES). Procedural until rec-2827
      (agent PRs are authored as the sole code owner); the binding controls are the ratchet and the plan 3 deploy lock.
  - file: tests/sensitive_values/__init__.py
    action: Create
    purpose: Package marker (empty), matching tests/turn_capture/.
  - file: tests/sensitive_values/test_engine.py
    action: Create
    purpose: >-
      Per class: every POSITIVES case of that class is masked by read_masked with the class marker and counted. For
      both profiles over every POSITIVES text: a second pass returns the same text and empty counts. Never raises on
      arbitrary str (including lone surrogates); counts carry class ids and integers only; an unknown profile and an
      unknown accept name raise KeyError; fingerprint is stable across calls, differs between profiles, and changes when
      a class's pattern, kind or accept param is monkeypatched; MaskResult unpacks as (text, counts).
  - file: tests/sensitive_values/test_write_time_identity.py
    action: Create
    purpose: >-
      test_write_time_matches_pre_library_digest: sha256 over scrub_text(text).text and sorted counts for the cases named
      in IDENTITY_CASE_IDS, a frozen tuple recorded in the test beside the digest, equals a constant the implementer
      computes on main BEFORE editing scrub.py (byte identity without a second copy of the old code; later corpus
      additions leave both untouched); the digest literal carries `# pragma: allowlist secret` (the
      tests/test_redaction_check.py convention). test_write_time_matches_mask_on_whole_corpus: scrub_text and
      mask(..., "write_time") agree on every case. test_scrub_holds_no_patterns: scrub.py's AST imports no re and calls
      no compile.
  - file: tests/sensitive_values/test_copies_no_stronger.py
    action: Create
    purpose: >-
      For each redactor that keeps its own copy -- scripts/ci/redaction_check.py mask_account_ids (system python3 in
      terraform-apply-sandbox.yml cannot import src), scripts/terraform_apply_guard.py _redact (stdlib, code-owned),
      src/common/ducklake_handler_errors.py redact (Lambda-packaged in four DuckLake bundles), scripts/ci/
      security_detector_probe.py redact, and the .pre-commit-config.yaml block-sensitive-identifiers regex: (a)
      COPY_PATTERNS, a closed table of rows (copy, exact pattern source and flags; for a hook branch, the first 16 hex
      of the sha256 of the branch source, so no account-shaped literal is restated in a test). The live side is DERIVED
      from each copy, never read from named attributes: for each of the four modules an AST walk finds every call that
      resolves to re.compile, sub, subn, search, match, fullmatch, findall, finditer or split, through `import re`,
      `import re as X` and `from re import ...` aliases, and collects its pattern and flags; a pattern that is not a
      string literal, or flags that are not absent, a re flag attribute or a | of them, FAILS the test naming the call
      (fail closed, so a pattern built by f-string, concatenation or a name cannot slip in), and the literal set must
      equal the module's rows in both directions (today 2, 2, 4 and 2 patterns, all redaction shapes), so an edited
      pattern, a new module-level compile or an inline re.sub fails until its strength is re-reviewed here. The test
      also imports all four modules by dotted name (scripts.ci.redaction_check, scripts.terraform_apply_guard,
      src.common.ducklake_handler_errors, scripts.ci.security_detector_probe; each imports cleanly with no AWS or duckdb dependency at module scope,
      ducklake_handler_errors also loading the src.common.ducklake_runtime facade and yaml), so
      the --pre affected-test import channel selects it whenever a copy changes. For the hook, the entry is parsed
      depth-aware (the outer group unwrapped, no split inside a (?:...) or (?!...) group) into branches whose digests
      must equal the hook rows, the hook's args must equal its pinned args (none today; --ignore-case or --negate would
      change its strength), and the set of language: pygrep hook ids must equal {block-sensitive-identifiers}, so a new
      pattern hook fails until it is pinned; every row matches at least one POSITIVES text whose planted value
      read_masked removes;
      (b) DIVERGENCES, a closed list (copy, pattern, reason) the test asserts exact: whole-ARN patterns remove the
      resource path read_masked keeps (public or AWS-generated role and resource names, readability; session names
      are masked by ASSUMED_ROLE_SESSION), and unbounded or digit-only-bounded 12-digit
      patterns hit 13-plus-digit runs and digits inside hex digests that read_masked spares (the rec-3322 false-positive
      class); each listed copy pattern must still hit a NEGATIVES text, so a stale entry fails; (c) ACCOUNT_ID's source
      equals redaction_check.ACCOUNT_ID_SHAPE's; UNIQUE_ID_SHAPE is a behavioural subset (every POSITIVES text it
      matches, read_masked masks), since the class adds the other key prefixes. Declared residual: a language: system
      grep hook, a pattern imported from another module, or a call reached through an assigned alias or getattr is
      out of reach.
  - file: tests/sensitive_values/test_classes.py
    action: Create
    purpose: >-
      Mirror home of classes.py (validate_test_coverage): every row compiles, ids are unique and in no profile twice,
      kinds are closed (whole, keep_prefix), keep_prefix rows carry group 1, accept specs name ACCEPT keys, and
      each replaced part refuses a marker; per-file coverage of classes.py through this file alone.
  - file: tests/sensitive_values/test_profiles.py
    action: Create
    purpose: >-
      Mirror home of profiles.py: write_time equals the pre-change CLASS_ORDER tuple (recorded literally), read_masked
