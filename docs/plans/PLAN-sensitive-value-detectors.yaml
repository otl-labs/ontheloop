      a marker citing a Decision naming only the profile or class fails, including a body holding the literal
      "<profile>.<CLASS>" prefix and one holding "<profile>/<CLASS>"; deleting a value-1 entry fails; deleting a 0
      tombstone passes; a new entry and a 0-to-1 raise pass; both SKIP paths are exercised. Wiring nodes:
      test_checks_are_registered (both names in registry.all_checks() through the misc manifest, pre=True),
      test_marker_token_declared (marker-grammar.yaml declares detector-loosening-approved, direction down,
      reason_required, used_by the edits check, bound to check_state_diff), test_checks_have_taxonomy_rows (both names
      in ci_rca_taxonomy.yaml's function_to_category).
  - file: config/agent/verification_registry/entries/sensitive-values-write-time-identity.yaml
    action: Create
    purpose: >-
      Graduation shard for VP step 1 (check_id sensitive-values-write-time-identity, primitive_slot test_selector,
      guard_target src/turn_capture/scrub.py, plan_slug sensitive-value-detectors, graduated_at the merge date,
