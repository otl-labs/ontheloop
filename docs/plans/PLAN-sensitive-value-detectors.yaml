      tests/sensitive_values/test_write_time_identity.py::test_write_time_matches_pre_library_digest).
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    src/turn_capture/scrub.py produces byte-identical text and identical counts to the pre-change scrubber on the whole
    corpus, parser_versions.yaml is unchanged, and every existing test in tests/turn_capture/test_scrub.py and
    tests/telemetry/test_parser_version_registry.py passes unmodified.
  - >-
    mask(text, "read_masked") masks every POSITIVES case, touches no NEGATIVES case, and counts nothing on a second
    pass; each copy module's AST-derived pattern set (no non-literal pattern or flags), each parsed hook branch, the
    hook's args and the pygrep hook set equal the exact COPY_PATTERNS table in both directions, every row hits at least one POSITIVES case whose planted value read_masked
    removes, and every copy pattern that hits a NEGATIVES text is on the exact DIVERGENCES list.
  - >-
    src.sensitive_values imports only the standard library (AST test) and no first-party package (importlinter contract
    src-sensitive-values-is-a-leaf), and src.turn_capture may import it (the one planned widening of
    tests/turn_capture/test_package_boundary.py).
  - >-
    validate_detector_ratchet and validate_detector_registry_edits are registered, run in the fast tier, pass on the
    committed tree, and fail on each loosening named in tests/checks/misc/test_sensitive_value_detectors.py.
  - >-
    No Lambda artifact changes: data-pipeline is reported affected only by its own manifest edit (new-path excludes,
    no sensitive_values path staged; no deploy), and no DuckLake artifact is affected.
  - >-
    The detector paths carry CODEOWNERS lines and boundary_patterns entries; a later PR that leaves the check module
    unedited cannot narrow them, the PROTECTED set or the protected case population (a dropped, swapped or edited case
    is a gated deletion, including a narrowed planted value) without the checks failing, and any class-row or profile
    change changes a pinned fingerprint.
    Loosening the corpus misses is the enumerated tamper set; a PR editing the check module itself is caught only by
    CODEOWNERS (procedural until rec-2827) and T4.21's base-ref guard once built.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The write-time scrubber is byte-identical after becoming an adapter; the parser registry and golden digest hold.
    command: >-
      bin/venv-python -m pytest tests/sensitive_values/test_write_time_identity.py::test_write_time_matches_pre_library_digest
      tests/turn_capture/test_scrub.py tests/telemetry/test_parser_version_registry.py -q
    expected: exit 0; all selected tests pass. Before the change the identity node does not exist.
    fix_if: >-
      The digest differs -- the adapter changed behaviour; fix the package or adapter, never the recorded digest. The
      golden digest drifts -- same; a parser_version bump is out of scope (rec-4657 owns write_time widening).
    hermetic: true
    expected_literals: ["passed"]
    graduation: graduate
    graduation_check_id: sensitive-values-write-time-identity
  - step: 2
    phase: pre-deploy
    action: The library masks every positive, spares every negative, and is at least as strong as each pinned copy.
    command: bin/venv-python -m pytest tests/sensitive_values tests/checks/misc/test_sensitive_value_corpus.py -q
    expected: exit 0; every test passes. Before the change the directory does not exist.
    fix_if: >-
      A copy removes a planted value read_masked keeps -- widen the class in the package; never drop the case. A new
      divergence -- record it with its reason only when the copy is broader by design.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-directory selection of test files this plan creates. Every tier's affected-test selection runs them on a
      package or test edit through the import channel, and on a copy edit because test_copies_no_stronger imports all
      four copy modules by dotted name (the --pre data-edge channel drops existing .py sources, so the import is what
      selects it). The registered ratchet re-asserts only the corpus counts and negatives, not idempotence,
      never-raises or the pinned copies, which is why the files stay in the suite rather than in the registry.
  - step: 3
    phase: pre-deploy
    action: The ratchet and tamper guard pass on the tree and fail on each loosening.
    command: >-
      bin/venv-python -m pytest tests/checks/misc/test_sensitive_value_detectors.py -q &&
      bin/venv-python -c "from scripts.checks import registry as g; from scripts.checks.misc.sensitive_value_detectors import validate_detector_ratchet as r, validate_detector_registry_edits as e; f=[]; d=[(setattr(g, '_CURRENT_DECLARATION', None), fn(f), g._CURRENT_DECLARATION)[2] for fn in (r, e)]; ok=all(x is not None and x.kind == 'examined' and x.count > 0 for x in d); print('DETECTOR_FAILS', len(f)); print('ENFORCED', ok); assert not f and ok, (f, d)"
    expected: >-
      exit 0; tests pass, then DETECTOR_FAILS 0 and ENFORCED True (both checks declared examined over a non-zero count,
      so a SKIP cannot pass as enforcement; run with origin/main fetched).
    fix_if: A loosening case passes -- fix the check; never relax the test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Both checks are registered in scripts/checks/misc/_manifest.py and run in every tier.
  - step: 4
    phase: pre-deploy
    action: Import boundaries hold and no Lambda artifact needs a deploy.
    command: >-
      bin/venv-python -m scripts.import_governance --check-contracts &&
      bin/venv-python -m pytest tests/turn_capture/test_package_boundary.py
      tests/lambda_manifest/test_bundle_checks.py::test_sensitive_values_excluded_from_data_pipeline
      tests/lambda_manifest/test_bundle_checks.py::test_turn_capture_excluded_from_data_pipeline
      tests/sensitive_values/test_package_boundary.py -q &&
      bin/venv-python -c "import fnmatch,subprocess,yaml;run=lambda a:subprocess.run(a,capture_output=True,text=True,check=True).stdout.split();mb=subprocess.run(['git','merge-base','HEAD','origin/main'],capture_output=True,text=True,check=True).stdout.strip();ch=sorted(set(run(['git','diff','--name-only',mb]))|set(run(['git','ls-files','--others','--exclude-standard'])));hits={wf:[f for f in ch if any(fnmatch.fnmatch(f,g) for g in ((w.get('on') or w.get(True))['push']['paths']))] for wf in ('deploy-ducklake-lambdas','deploy-prod-lambdas') for w in [yaml.safe_load(open('.github/workflows/%s.yml'%wf,encoding='utf-8'))]};hits={k:v for k,v in hits.items() if v};from scripts.lambda_manifest import compute_affected_artifacts as ca;aff=ca(ch);print('changed',len(ch),'hits',hits,'affected',aff);assert 'src/sensitive_values/engine.py' in ch and 'src/turn_capture/scrub.py' in ch;assert not hits and aff in ({},{'data-pipeline':['src/lambdas/data-pipeline/manifest.yaml']});print('NO_DEPLOY_TRIGGER_OK')"
    expected: >-
      exit 0; the change list (tracked diff against the merge-base plus untracked files) holds the package and scrub.py,
      no deploy workflow's push paths match, affected is empty or data-pipeline via its manifest only, and the last line
      is NO_DEPLOY_TRIGGER_OK.
    fix_if: >-
      An artifact is affected -- a package path is bundled somewhere; add the exclude, never deploy from this plan. An
      import contract fails -- the package imported a first-party module; remove the import.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The affected-artifact line reads this branch's transient diff; the tests run in every tier.
  - step: 5
    phase: pre-deploy
    action: SLOC and structural size limits hold with no raise.
    command: >-
      bin/venv-python -c "from scripts.checks.sloc.sloc_limits import validate_sloc_limits as c; from scripts.checks.structural.size_limits import validate_structural_size_limits as s; f=[]; c(f); s(f); print('SIZE_FAILS', len(f)); assert not f, f"
    expected: SIZE_FAILS 0; exit 0.
    fix_if: A file is over budget -- decompose or compact (Decision 128, 166); never raise.
    hermetic: true
    expected_literals: ["SIZE_FAILS 0"]
    graduation: waive
    graduation_waiver_reason: Replays the registered SLOC and structural-size checks that run in every tier.
  - step: 6
    phase: pre-deploy
    action: Discharge the handoff obligation with a full-tier run to completion (Decision 163).
    command: bin/venv-python -m scripts.validate
    expected: exit 0.
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test, relax an assertion, or add a baseline, allowlist or
      budget entry. A failure outside scope becomes a rec via scripts.ops_data_portal (Decision 59, 55).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      vp-red-before.yaml recursion_refusal: a graduated step may not invoke scripts.validate, so the full tier cannot
      graduate; it runs post-merge on main in every case.
