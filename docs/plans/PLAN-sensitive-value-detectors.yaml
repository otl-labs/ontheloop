  - file: tests/checks/misc/test_sensitive_value_corpus.py
    action: Create
    purpose: >-
      Mirror home of the corpus module: case_ids unique and matching ^[a-z0-9_]+$, at least two POSITIVES per class of
      every profile, every planted value occurs in its text, NEGATIVES carry no class, a duplicate or "/"-bearing
      case_id raises at call time; per-file
      coverage of the module through this file.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: >-
      function_to_category rows validate_detector_ratchet and validate_detector_registry_edits, both code_regression
      (validate_schedule_removal_markers precedent); validate_ci_rca_taxonomy fails on a registered check without one.
      The file sits at 499 of the config class's 500 effective lines (validate_structural_size_limits, Decision 166), so
      the stale validate_imports row is removed in the same edit (no registered check carries that name; the taxonomy
      check maps registered checks only), leaving 500. No budget entry.
  - file: docs/contracts/file-router.yaml
    action: Modify
    purpose: >-
      Route topic sensitive-values, targets [src/sensitive_values/, config/sensitive_value_detectors.yaml,
      scripts/checks/misc/sensitive_value_detectors.py], beside row-rules and turn-capture, plus one amendment_log entry
