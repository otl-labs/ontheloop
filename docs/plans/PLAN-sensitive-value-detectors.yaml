  - file: tests/checks/misc/test_sensitive_value_detectors.py
    action: Create
    purpose: >-
      Ratchet: passes on the committed tree; fails on a live key missing, an extra non-zero key, a value off, a
      monkeypatched loosened pattern, a case swap (one caught case removed and an uncaught one added in the same tree),
      an in-place case text edit, an in-place planted_value narrowing, a planted value removed by an earlier class but not attributed to its own, a
