schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: sensor-liveness-delivery-floor
intent: >-
  Stop the scheduled-loop liveness backstop (loop_liveness_stale) filing false "has not run within its derived
  threshold" recs for sub-daily crons (rec-4931 and eight siblings) by raising its threshold floor from 6 h to 24 h,
  fitted to 89 days of measured GitHub schedule delivery, so the alarm again separates a dead loop from GitHub's late
  delivery and the loop's own process signals stay trustworthy (NS.9, NS.6).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-sensor-liveness-delivery-floor.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): rec-4931, a loop_liveness_stale episode the operator assigned to the CI
  Reform project on 2026-11-11. No tier_item is targeted and no exit criterion is closed, so closes_criteria is empty.
closes_criteria: []
scope:
  - file: scripts/convergence_health/sensor_liveness.py
    action: Modify
    purpose: >-
      `_MIN_THRESHOLD_SECONDS = 6 * 3600` becomes `24 * 3600` (sensor_liveness.py:81). The 2x multiplier, the 45d
      ceiling, FLEET_COLLAPSE_MIN_STALE = 3 and every other line of logic stay as they are. The module docstring's
      "clamps 2x the nominal period into [6h, 45d]" (line 17) and staleness_threshold_seconds's docstring
      "clamp(2 x nominal period, 6h, 45d)" (line 174) say 24h instead.
  - file: tests/convergence_health/test_sensor_liveness.py
    action: Modify
    purpose: >-
      TestThresholdOracle (graduated record sensor-liveness-threshold-oracle): test_hourly_clamps_up_to_floor pins
      86400; test_three_hour_period_lands_exactly_on_floor is renamed test_three_hour_period_clamps_up_to_floor and pins
      86400; test_fleet_threshold_is_min_over_derived_peers pins 86400. No node is added to this file (498 of 500 SLOC,
      headroom 2): every edit replaces a line in place, so its SLOC count does not rise. TestFleetCollapse:
      test_open_per_loop_recs_are_suppressed_not_closed ages its peers by sl.fleet_threshold_seconds(peers) instead of
      the literal 21600; test_fleet_bucket_rises_when_a_new_peer_joins_after_closure keeps its 14d age and records the
      closed fleet rec at bucket 2 instead of 4 (at a 24h fleet threshold the own-anchor bucket is 4 > 2+1 and files,
      while the rejected min(bucket over stale peers) formula gives 1 <= 3 and would drop), with its comment updated to
      those numbers.
  - file: tests/convergence_health/test_sensor_liveness_episodes.py
    action: Modify
    purpose: >-
      TestTwoLegIntegration::test_fleet_collapse_counts_distinct_peers_not_leg_pairs ages its peers by
      sl.fleet_threshold_seconds(peers) instead of the literal 21600 (line 76); nothing else changes.
  - file: tests/convergence_health/test_sensor_liveness_delivery.py
    action: Create
    purpose: >-
      New test module beside the mirror file (own helpers, no import from another test_* module) with three nodes.
      test_every_sub_daily_shape_shares_the_floor: staleness_threshold_seconds returns 86400 for "13 */6 * * *" and
      "17 */12 * * *" and 172800 for "23 */24 * * *" (the shapes TestThresholdOracle does not pin, kept out of that
      near-cap file). test_measured_worst_gaps_raise_no_alarm: for each live sub-daily cron and its measured 89-day worst gap
      (("37 * * * *", 12.7 h), ("17 * * * *", 10.8 h), ("47 * * * *", 10.6 h), ("0 */3 * * *", 14.6 h),
      ("13 */6 * * *", 16.0 h), ("17 */12 * * *", 15.9 h)), a one-peer sl.detect_stale_loops whose newest scheduled run
      and newest successful run are that gap old files nothing and updates nothing (portal spy records no call); one
      more row, ("47 * * * *") with its newest scheduled run 1 h old and its newest successful run 13.0 h old (rec-4195's
      recorded success-leg age), files nothing either.
      test_floor_boundary_and_real_outage_still_alarm: a one-peer hourly ("17 * * * *") detect_stale_loops whose newest
      successful run is its newest scheduled run, at that run's age 86399 s files nothing; at 86400 s it files two recs,
      one per leg (cadence and success), each title carrying "Bucket: 1."; at 221.1 h (the measured terraform-drift
      outage) it files two recs each carrying "Bucket: 4.". A module docstring names the evidence: this plan's context
      and PLAN commit body. The two detect_stale_loops nodes inject open_recs=[], resolved_recs=[], a gh_caller and a
      portal spy, as the existing tests do, so no node reaches the live reader (red before fails on the assertion, not
      on a blocked socket).
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      loop_liveness_stale signal_interpretation clauses (a) threshold and detection latency and (b) fleet-collapse
      rationale, and clause (c)'s per-episode rec bound, word for word as the approved-text sidecar binds them (blocks
      registry-threshold, registry-latency, registry-fleet, registry-episode-bound). The YAML still parses and the folded scalar keeps its indentation.
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Two append-only blockquote_update lines (decision-entry.yaml amendment_forms, Decision 177), word for word as the
      sidecar binds them: one after Decision 250's Related line (block decision-250-update), one after Decision 62's
      2026-11-07 Update line (block decision-62-update). No ratified text is edited and no Decision is added.
  - file: docs/plans/approved/sensor-liveness-delivery-floor.yaml
    action: Create
    purpose: >-
      Approved-text sidecar (Decision 246) binding the four registry blocks and the two Decision update lines. Created
      by this plan PR, not by the build, which never edits it.
bundled_recommendations: [rec-4931, rec-4112, rec-3860, rec-4186, rec-4160, rec-4148, rec-4251, rec-4278, rec-4195]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - "staleness_threshold_seconds returns 86400 for the hourly, every-3-hours, every-6-hours and every-12-hours crons, 172800 for the every-24-hours cron (\"23 */24 * * *\"), 1209600 for a weekly cron and 3888000 for a monthly cron; fleet_threshold_seconds over a set holding any sub-daily peer returns 86400."
  - "A single sub-daily peer whose newest scheduled and newest successful runs are as old as its measured worst gap (12.7, 10.8, 10.6, 14.6, 16.0 and 15.9 hours for the six live sub-daily crons, over each peer's history in the 89-day window), and the security-detector-liveness peer whose newest scheduled run is 1 h old and newest successful run 13.0 h old (rec-4195's recorded success-leg age), files and updates no rec."
  - "An hourly peer whose newest success is its newest scheduled run files nothing at 86399 s, files one cadence and one success rec at Bucket 1 at 86400 s, and files both at Bucket 4 at 221.1 h, so a dead loop still alarms within 24 hours on both legs and a real outage keeps its log2 bucket."
  - "The loop_liveness_stale registry row and the two Decision update lines match the approved-text sidecar word for word."
  - "The nine bundled recs close through the merge's Resolves trailer, each with an acceptance that holds at the closing commit (Decision 201)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The threshold oracle re-pins the hourly, 3-hourly and fleet values to the 24 h floor and keeps weekly and monthly.
    command: bin/venv-python -m pytest "tests/convergence_health/test_sensor_liveness.py::TestThresholdOracle" -q
    expected: exit 0; red before (the hourly, 3-hourly and fleet pins read 21600 on the current code).
    fix_if: an hourly or 3-hourly shape or the fleet minimum returns other than 86400, or the weekly or monthly pins move
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      TestThresholdOracle is already the graduated record sensor-liveness-threshold-oracle (config/agent/verification_registry/entries/sensor-liveness-threshold-oracle.yaml);
      graduating it again would duplicate that record, whose claim this step re-pins with the operator's approval (Decision 244 cl.5, Decision 235 cl.1).
  - step: 2
    phase: pre-deploy
    action: The 6-hourly and 12-hourly shapes share the 24 h floor and a daily cron stays at 48 h.
    command: bin/venv-python -m pytest "tests/convergence_health/test_sensor_liveness_delivery.py::test_every_sub_daily_shape_shares_the_floor" -q
    expected: exit 0; red before (node absent; on the current code the 6-hourly shape returns 43200).
    fix_if: the 6-hourly or 12-hourly shape returns other than 86400, or the daily other than 172800
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: sensor-liveness-sub-daily-floor
  - step: 3
    phase: pre-deploy
    action: The measured worst delivery gaps of every live sub-daily cron raise no alarm.
    command: bin/venv-python -m pytest "tests/convergence_health/test_sensor_liveness_delivery.py::test_measured_worst_gaps_raise_no_alarm" -q
    expected: >-
      exit 0; red before (node absent; on the current code five of the six rows file, the hourly and 3-hourly gaps past their 6 h
      threshold and the 6-hourly gap past its 12 h threshold; the 12-hourly row is already fresh at 24 h and is a regression pin).
    fix_if: any gap files or updates a rec (the floor is not 24 h, or a peer's threshold is not its tightest cron's)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: sensor-liveness-measured-delivery-fresh
  - step: 4
    phase: pre-deploy
    action: A dead loop still alarms at the floor on both legs and a real outage keeps its bucket.
    command: bin/venv-python -m pytest "tests/convergence_health/test_sensor_liveness_delivery.py::test_floor_boundary_and_real_outage_still_alarm" -q
    expected: >-
      exit 0; red before (node absent; on the current code age 86399 s already files at bucket 2 on each leg and 221.1 h files at
      bucket 6).
    fix_if: 86399 s files, 86400 s does not file a cadence and a success rec each at Bucket 1, or 221.1 h does not file both at Bucket 4 (the floor masks a dead loop or the bucket arithmetic moved)
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: sensor-liveness-floor-anti-masking
  - step: 5
    phase: pre-deploy
    action: The fleet-collapse nodes hold their claims at the new fleet threshold.
    command: >-
      bin/venv-python -m pytest
      "tests/convergence_health/test_sensor_liveness.py::TestFleetCollapse::test_open_per_loop_recs_are_suppressed_not_closed"
      "tests/convergence_health/test_sensor_liveness.py::TestFleetCollapse::test_fleet_bucket_rises_when_a_new_peer_joins_after_closure"
      "tests/convergence_health/test_sensor_liveness_episodes.py::TestTwoLegIntegration::test_fleet_collapse_counts_distinct_peers_not_leg_pairs" -q
    expected: exit 0 on the build; these three nodes fail on the build's constant with their old literal ages and pass once aged by the fleet threshold.
    fix_if: a fleet node fails (its age or recorded bucket was not re-derived), or the fix edits the sensor rather than the fixture
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: >-
      Existing nodes whose claims do not change; they are green before and after the build because they now derive their age from
      fleet_threshold_seconds, so they cannot be red-before, and they already run in the full tier and --pre's diff-aware selection.
  - step: 6
    phase: pre-deploy
    action: Bind the registry row and the two Decision update lines to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug sensor-liveness-delivery-floor --base origin/main
    expected: exit 0; every block matches with only {{DATE}} filled.
    fix_if: any word differs; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar on every PR
      declaring this plan.
  - step: 7
    phase: pre-deploy
    action: Every test file that imports the sensor still passes, and the registry still parses through its own check.
    command: >-
      bin/venv-python -m pytest tests/convergence_health/ tests/checks/ops_governance/test_check_source_registry.py
      tests/checks/contracts/test_validate_arrival_expectations.py tests/checks/ci_guards/test_validate_schedule_removal_markers.py
      tests/session/preflight/ tests/test_session_preflight_decomposition.py tests/test_telemetry_arrival_workflow.py
      tests/test_telemetry_causal_chain_workflow.py tests/test_telemetry_golden_replay_workflow.py
      tests/test_telemetry_verification_workflow.py -q
    expected: exit 0. Measured at planning time with only the constant changed (scratch worktree of d8283f55) -- 6 failed, 1141 passed; the 6 are exactly steps 1 and 5's pinned nodes.
    fix_if: any other node fails -- read it before changing it; a node that pins the old floor is a step 1 or 5 candidate, anything else is a stop-and-report
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Whole-file re-run of the plan's own scope files plus their importers (vp-red-before hermetic_authoring (v)); steps 2, 3 and 4 carry the durable regressions.
  - step: 8
    phase: pre-deploy
    action: >-
      Live, before the PR merges, from the build session on the build branch (so the 24 h floor is in force) with a GitHub token
      set: every bundled rec's original live probe reads fresh.
    command: >-
      for a in "telemetry-causal-chain.yml" "terraform-drift.yml" "main-canary.yml" "security-detector-liveness.yml" ""
      "convergence-health.yml success" "terraform-drift.yml success" "main-canary.yml success"
      "security-detector-liveness.yml success"; do bin/venv-python -m scripts.convergence_health --liveness-probe $a || exit 1; done
    expected: >-
      every probe prints liveness_probe OK and the loop exits 0; record the output in the PR body. The empty argument is rec-4160's
      all-peers cadence probe.
    fix_if: >-
      liveness_probe FAILED is an environment fault (no or invalid GH_TOKEN, a dead query): fix the token and re-run, never read it as
      fresh or stale. A STALE peer is a real dead or failing loop that this plan does not excuse: do not merge; stop BLOCKED and report
      the peer, its rec and its newest run id to the coordinator for a plan amendment that drops that rec from bundled_recommendations
      and the Resolves trailer. No rec's acceptance has been changed at this point (the swap follows VP 8). Never widen the floor to
      clear it.
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: pre-deploy
    action: Full tier, then HEAD attestation, after the build commit and rebase and before the push (handoff_policy); start it from the top-level session, backgrounded with a 2 h limit, and read only the attestation.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: the full tier exits 0 and the validation result attests the current HEAD's tree
    fix_if: any failure -- fix and rerun the full tier from the start
    hermetic: false
    graduation: waive
    graduation_waiver_reason: A whole full-tier run; graduate steps may not invoke scripts.validate (recursion), and steps 2, 3 and 4 carry the durable regressions.
  - step: 10
    phase: post-deploy
    action: Live, from a cloud session on up-to-date main after the merge, the same probes still read fresh (evidence).
    command: >-
      for a in "telemetry-causal-chain.yml" "terraform-drift.yml" "main-canary.yml" "security-detector-liveness.yml" ""
      "convergence-health.yml success" "terraform-drift.yml success" "main-canary.yml success"
      "security-detector-liveness.yml success"; do bin/venv-python -m scripts.convergence_health --liveness-probe $a || exit 1; done
    expected: every probe prints liveness_probe OK and the loop exits 0; record the output in the handoff report.
    fix_if: >-
      FAILED: fix the token and re-run. STALE: the loop died after VP 8; the sensor files a fresh episode on its next tick (a new run
      anchor, so no same-anchor dwell applies); if the peer's rec was closed by this merge, reopen it through scripts.ops_data_portal
      --update-rec with the probe output as context and its original --liveness-probe acceptance restored (recorded in the PR body),
      and report it to the coordinator. Never widen the floor.
    hermetic: false
  - step: 11
    phase: post-deploy
    action: The nine bundled recs are closed by the merge's Resolves trailer.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      ids = ['rec-4931', 'rec-4112', 'rec-3860', 'rec-4186', 'rec-4160', 'rec-4148', 'rec-4251', 'rec-4278', 'rec-4195'];
      rows, _ = fetch_recs_by_ids(make_reader(), ids); s = {r['id']: r['status'] for r in rows}; print(s);
      raise SystemExit(0 if all(s.get(i) == 'closed' for i in ids) else 1)"
    expected: prints all nine closed and exits 0 after the closure job runs on the merge commit; record that run id.
    fix_if: >-
      any still open -- read the closure job's log for the acceptance refusal; fix the cause and re-run the closure route, never a
      direct status write
    hermetic: false
