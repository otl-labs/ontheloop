constraints:
  - "Verification weakening (Decision 235 cl.1): raising the floor makes the alarm slower for every sub-daily loop (a dead hourly, 3-hourly or 6-hourly loop is found in 24 h instead of 6 h; a dead 12-hourly loop is unchanged at 24 h), on both legs. The operator chose the 24 h floor on 2026-11-12 (decision card, option \"24 hours\") with this cost named, including security-detector-liveness, whose backstop role Decision 202 names. It also accepts that a real success-leg failure streak shorter than 24 h no longer alarms (measured: main-canary 18.1 h and 21.0 h, terraform-drift 23.4 h). Any larger floor, a changed multiplier or ceiling, or a per-peer threshold derived from observed history is out of scope and goes back to the operator."
  - "Changed constant and test pins take the planned-change review disposition citing acceptance_criteria[0] (implement-scope-boundary.yaml review_dispositions), never weakening."
  - "The registry row and the two Decision lines land word for word as docs/plans/approved/sensor-liveness-delivery-floor.yaml binds them (Decision 246); the build fills only {{DATE}}."
  - "Decisions are append-only (Decision 177): no ratified text, including the 2026-09-25 correction, is edited."
  - "The new test module defines its own helpers; it imports nothing from another test_* module (tests/CLAUDE.md)."
  - "No rescue agents or workaround loops (Decision 55)."
context:
  - "Decision-scout verdict FLAGS_FOUND (round 1, no CONTRADICT). Decisions triaged: 205 of 205. Roadmap items intersected: 5; CONFLICT: 0; RELATED: 5. Serves: mission 2/5 (loop-health hygiene). CITE: 250 (cl.3 annotated as an interim calibration; rec-4233 still owns delivery), 62 (2026-09-25 correction quotes the clamp), 177 (append-only Update lines), 235 (cl.1 weakening named in this plan; planned-change dispositions; cl.1's red bar and cl.5's floor not engaged), 244 (graduated threshold-oracle claim re-pinned; misnamed 3-hour node renamed), 201 (each bundled rec's acceptance must hold at the closing commit), 246 (sidecar approval run). SPIRIT NOTE 202: security-detector-liveness backstop latency 6 h -> 24 h, accepted by the operator; the trail's tamper and heartbeat alarms still cover it and rec-4234 moves the probe into AWS."
  - "Evidence (read-only GitHub API, 2026-11-12, event=schedule runs over 89 days from 2026-08-15): worst gaps hourly convergence-health 12.7 h (n=654), terraform-drift 10.8 h apart from one 221.1 h real outage (n=599), security-detector-liveness 10.6 h (n=219); main-canary (3 h) 14.6 h (n=433); telemetry-causal-chain (6 h) 16.0 h (n=37, first run 2026-10-29); telemetry-arrival (12 h) 15.9 h (n=9, first run 2026-11-08); security-detector-liveness's history starts 2026-09-26; daily 24.7 h; weekly 175.0 h. The delay is additive (up to about 12 h past nominal), not proportional. On the 6 h / 12 h thresholds the four 6 h peers breached 337 times in 89 days. Successful-run gaps match except where runs really failed (main-canary 18.1-29.7 h, terraform-drift 23.4-28.4 h, convergence-health 33.8 h, telemetry-arrival 45.2 h; evidence/success-gaps-89d.json), which the success leg still reports at 24 h except main-canary's 18.1 h and 21.0 h and terraform-drift's 23.4 h gaps."
  - "Bundled recs (each recorded age under 16 h, inside measured delivery): cadence rec-4931 (12.4 h), rec-4112, rec-3860, rec-4186, rec-4160 __fleet__ (8.3 h); success rec-4148, rec-4251 (10.5 h), rec-4278, rec-4195 (13.0 h). Not bundled: rec-4157 (290 h age contradicts the run history; needs its own look), rec-4054, rec-4041, rec-4042, rec-4531, rec-4672, rec-5094 (never-succeeded weeklies and dailies: real signals), rec-4233, rec-4234, rec-4688 (delivery itself)."
  - "Closure route (Decision 201): every bundled rec's acceptance today is a live `--liveness-probe` call, which the trailer-acceptance evaluator's network-less sandbox (ci.yml trailer-acceptance-evaluate, unshare -rmn) cannot run, so the trailer would refuse all nine. Before opening the build PR, the build updates each bundled rec's acceptance through `scripts.ops_data_portal --update-rec` to the hermetic VP 3 node `bin/venv-python -m pytest \"tests/convergence_health/test_sensor_liveness_delivery.py::test_measured_worst_gaps_raise_no_alarm\" -q` (junit-routed). VP 8 runs the original live probes on the build branch before the merge, so no rec of a loop that is really dead closes; VP 10 repeats them after the merge as evidence. Precedent: rec-5081's acceptance moved to its pinning test for the same reason."
  - "After the merge the build appends to rec-4233's context, through update_rec, that the sensor episodes it names were closed by this plan's floor (rec-4931) and that its remaining scope is real hourly delivery plus counting workflow_dispatch runs as cadence; it removes nothing from rec-4233's scope."
  - "Graduated shards kept unchanged (their nodes are not edited and their claims hold at any floor): sensor-liveness-anti-masking, sensor-liveness-episode-grain-verbs, sensor-liveness-peer-derivation-on-key (all on tests/convergence_health/test_sensor_liveness.py). sensor-liveness-threshold-oracle is re-pinned by VP 1, as approved; VP 2-4 mint sensor-liveness-sub-daily-floor, sensor-liveness-measured-delivery-fresh and sensor-liveness-floor-anti-masking; the floor-anti-masking and sub-daily-floor records pin the 24 h floor exactly, so rec-4233's later tightening must re-pin or retire them under Decision 244 cl.5."
  - "Size (plan_obligations at draft): sensor_liveness.py 495 of 500 SLOC and test_sensor_liveness.py 498 of 500, both NEAR_CAP. Relief: the sensor edit changes one constant and two docstring lines in place, and new tests go to the new file; measure both at build time against main, and if either would pass 500, stop BLOCKED and report for a plan amendment, never a raise (Decision 128)."
  - "plan_obligations reports the nine bundled recs' current acceptance (`--liveness-probe`) UNDECIDABLE (UNREACHABLE where the acceptance runner times out); the acceptance update in the Closure route context line is the fix. A planning-time update_rec was refused by this session's permission classifier on 2026-11-12, so the build makes it, and asks the operator if it is refused again."
