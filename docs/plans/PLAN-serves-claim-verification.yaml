schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: serves-claim-verification
intent: >-
  Make a drafted Decision's serves claim checked, not only declared (rec-4915): plan-critique step 12p adjudicates each
  serves id against the drafted Decision's own clauses beside its significance row and kind, decision-entry.yaml names
  that verifier and the evidence rule, and the planning-time drafts report prints each claimed north star's principle,
  failure signal and carried_by before the author writes the claim, so /orient's coverage signal rests on checked
  claims. This plan PR also removes the unverified serves: [NS.6] from the arrival-expectations approved text before
  its build lands it.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-serves-claim-verification.yaml
phase: >-
  ad_hoc_rec (soft-warn category; rec-4915 names no tier_item, so the Tier Item Freshness Gate is skipped). T4.36,
  whose c5 plan filed rec-4915, is complete (c1-c7 met on 9e5e15df).
scope:
  - file: .claude/skills/plan-critique/SKILL.md
    action: Modify
    purpose: >-
      Apply the five critique-12p-* blocks of the sidecar verbatim: the 12p header adds serves; the trigger's
      amendment-trailer sentence and the N/A branch are compacted (both fire conditions and the trailer exclusion
      are kept); the verdict also quotes, for each serves id, the sentence decision-entry.yaml serves.verification
      requires, and "Any mismatch" replaces "Either mismatch"; the Phase-3 output row names [row, kind, NS.n] and "or
      no sentence supports it". Step numbers are unchanged (12b-12p are cross-referenced). 18028 -> 18025 bytes on
      3e2eef70, a 3-byte net shrink; a sibling build landing first changes the base, never the delta.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      Apply the five entry-* blocks verbatim: metadata_envelope.field_shapes.serves.semantics names plan-critique
      step 12p as the verifier; a new verification key holds the evidence rule; one amendment_log row ({{DATE}} =
      build day); three older amendment_log rows (2026-11-02 twice, 2026-10-02) rewritten from block to flow style,
      words unchanged. 494 -> 493 effective lines on 3e2eef70 (Decision 166, limit 500, never a raise).
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: >-
      Ratchet the plan-critique entry to the bytes measured after the blocks apply (18025 if main has not moved); its
      existing dec-75 marker stays. No marker is added.
  - file: scripts/roadmap/plan_decision_drafts.py
    action: Modify
    purpose: >-
      Advisory INFO lines (the module stays total and advisory; Decision 66 pre-write injection). For each drafted
      Decision whose envelope lists serves, one line per id that resolves in docs/contracts/north-star.yaml, printed
      after that report's findings in envelope order: '  INFO <number> serves <NS.n>: principle "<principle>";
      failure_signal "<failure_signal, whitespace runs collapsed>"; carried_by [<numbers>]; links <comma-joined
      sorted intersection of the draft's amends, supersedes and Related decisions with carried_by, or none>
      (corroborate, never substitute)'. An id that does not resolve gets no INFO line (its serves FAIL stands). INFO
      lines are not findings: the header count, findings_for_plan and findings_for_draft are unchanged, so every
      existing test in tests/test_plan_decision_drafts.py passes unedited. Related numbers come from the shared
      parser's _extract_related_decisions over the drafted block (scripts.decisions_md, already imported); the
      north-star text from the load_north_star call the module already makes. A north-star file that fails to load
      yields no INFO line, never a raise. Stays under 500 SLOC.
    new_imports: []
  - file: tests/test_serves_claim_verification.py
    action: Create
    purpose: >-
      Three classes; the node ids named here are fixed, because rec-4915's acceptance names the first. Pins (each phrase matched case-sensitively after collapsing whitespace runs to one space; the contract read
      through yaml.safe_load; every phrase occurs in the sidecar's after text exactly as written here). plan-critique
      12p carries "kind and serves match its body", "for each `serves` id", "`serves.verification`" and "Any
      mismatch is REVISE-worthy on its own", keeps "Fires when EITHER" and "does not fire it: an amendment carries no
      envelope", and its Phase-3 row carries "[row, kind, NS.n]" and "or no sentence supports it"
      (TestCritiquePins::test_12p_adjudicates_each_serves_id). decision-entry.yaml serves.semantics carries "plan-critique step 12p verifies the claim" and not "the decision
      scout verifies the claim"; serves.verification carries "own_clauses", "an Intent or Problem sentence alone never
      counts", "corroborates and never substitutes", "is a witness, never the evidence" and "never add text to fit
      the claim" (TestContractPins). Drafts-report behaviour (TestDraftsReportInfo) over tmp plans and drafts (the tests/test_plan_decision_drafts.py helper
      shape), every north-star value derived at test time from load_north_star (never a hardcoded principle,
      carried_by or carrier number, so a later carrier promotion keeps the guard green, Decision 244 cl.4): a draft
      serving one id prints one INFO line naming that entry's principle, failure_signal and carried_by and "links
      none", under a header that still reads "1 drafted, 0 findings"; a Related line naming the entry's first
      carrier prints "links <that number>"; an amends edge into carried_by is a link; two ids print two lines in
      envelope order; an unknown id prints its FAIL and no INFO line; a draft without serves prints none;
      findings_for_plan returns no INFO severity; a missing north-star file (monkeypatch pdd.ROOT to a tmp dir, the
      seam tests/test_plan_decision_drafts.py already uses, since the module builds that path from ROOT, not the root
      argument) prints none and does not raise. Red before: the file does not exist; on origin/main the new-phrase
      pins and the INFO cases fail, while the kept-phrase pins and the no-INFO guard cases hold.
  - file: config/agent/verification_registry/entries/serves-claim-verification-pins.yaml
    action: Create
    purpose: >-
      Registry record for the graduated VP 2 check: check_id serves-claim-verification-pins, primitive_slot
      test_selector, guard_target .claude/skills/plan-critique/SKILL.md, guard_symbol null, plan_slug
      serves-claim-verification, check_spec.node_id tests/test_serves_claim_verification.py (the
      scout-north-star-lane-pins shape).
  - file: docs/plans/approved/serves-claim-verification.yaml
    action: Create
    purpose: >-
      The approved-text sidecar (git-ops.yaml approved_text_binding): 10 blocks over plan-critique and
      decision-entry.yaml, merged with this plan; the build never edits it.
  - file: docs/plans/PLAN-serves-claim-verification.yaml
    action: Create
    purpose: This plan artefact.
  - file: docs/plans/approved/arrival-expectations.yaml
    action: Modify
    purpose: >-
      This plan PR only (Benjamin 2026-11-07, Q4 Drop, bundled): the decision-new block's after text loses its one
      envelope line "serves: [NS.6]"; every other byte is unchanged. It needs its own wording-check row and Benjamin's
      approval of an approved-text-approval.yml run for slug arrival-expectations (Decision 246). This build never
      edits it.
  - file: docs/plans/PLAN-arrival-expectations.yaml
    action: Modify
    purpose: >-
      This plan PR only: gate_rounds gains the amendment's wording-check rows and context gains one line naming the
      amendment. No scope row, step or criterion changes. This build never edits it.
bundled_recommendations:
  - rec-4915
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    rec-4915: plan-critique step 12p adjudicates each drafted serves id against the sentence decision-entry.yaml
    serves.verification requires, as REVISE-worthy as its significance and kind verdicts, with both trigger conditions
    and the amendment-trailer exclusion kept; decision-entry.yaml serves.semantics names step 12p as the verifier and
    serves.verification holds the evidence rule (own clauses only, carried_by links corroborate, the scout's Serves
    line is a witness, drop or re-point, never add text). VP 2, 4.
  - >-
    The drafts report prints one INFO line per resolving serves id with the principle, failure signal, carried_by and
    the draft's links into it, never counted as a finding, and stays total. VP 2, 3.
  - The two files equal the sidecar's text, read at the base (docs/plans/approved/serves-claim-verification.yaml). VP 4.
  - >-
    plan-critique fits its existing budget with no marker added and ratchets to the measured bytes; decision-entry.yaml
    stays within 500 effective lines and carries its amendment_log row. VP 6, 7.
  - Every standing suite naming either file or the drafts report passes unchanged, and the registry admits the new record. VP 5, 8.
  - scripts.validate --pre and the full tier exit 0, and --verify-head attests HEAD. VP 9, 10.
  - 'rec-4915 is closed by the squash merge''s "Resolves: rec-4915" trailer. VP 11.'
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Precondition: the plan and its sidecar are on origin/main, the branch contains origin/main, and no live Decision
      on main whose title begins "Every warehouse table declares what should arrive" lists NS.6 in serves.
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-serves-claim-verification.yaml &&
      git cat-file -e origin/main:docs/plans/approved/serves-claim-verification.yaml && git merge-base --is-ancestor
      origin/main HEAD && bin/venv-python -c "import json; rows=json.load(open('docs/decisions-index.json',
      encoding='utf-8'))['decisions']; bad=[r['number'] for r in rows if r.get('live') and 'NS.6' in (r.get('serves')
      or []) and str(r.get('title', '')).startswith('Every warehouse table declares what should arrive')]; assert not
      bad, bad" && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      A missing file means the plan PR has not merged: stop (the build never carries the sidecar). A failing ancestry
      test means the branch is stale: merge origin/main. An AssertionError naming a number means the arrival Decision
      landed with NS.6 despite the amended sidecar: stop before any edit and tell the coordinator (constraints, race).
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: Run the plan's suite (12p and contract pins, drafts-report INFO lines).
    command: bin/venv-python -m pytest tests/test_serves_claim_verification.py -q
    expected: 'Every node passes. Red before: the file does not exist (collection fails).'
    fix_if: >-
      A missing phrase means the sidecar's words were not placed exactly: restore them, never edit the test to match.
      An INFO count failure means a line was counted as a finding or printed for an unresolved id: fix the module.
    hermetic: false
    graduation: graduate
    graduation_check_id: serves-claim-verification-pins
  - step: 3
    phase: pre-deploy
    action: >-
      Run the drafts report through plan_obligations against the real north-star file, on the committed conforming
      fixture with serves [NS.6] added and a Related line naming Decision 221.
    command: >-
      bin/venv-python -c "import pathlib, subprocess, tempfile; t=open('tests/fixtures/decision_drafts/placeholder_conforming.txt',
      encoding='utf-8').read().replace('kind:', 'serves: [NS.6]' + chr(10) + 'kind:', 1) + chr(10) + '**Related:** Decision
      221' + chr(10); d=pathlib.Path(tempfile.mkdtemp()) / 'd.txt'; d.write_text(t, encoding='utf-8');
      o=subprocess.run(['bin/venv-python', '-m', 'scripts.roadmap.plan_obligations', '--decision-draft', str(d)],
      capture_output=True, text=True, check=True).stdout.splitlines(); i=[x for x in o if x.lstrip().startswith('INFO')];
      print('DRAFT_INFO_OK header=%s lines=%d principle=%s carried=%s links=%s' % (o[0], len(i), 'principle
      \"Improvement is proven, never asserted.\"' in i[0], 'carried_by [221, 231]' in i[0], 'links 221 ' in i[0]))"
    expected: >-
      Prints the DRAFT_INFO_OK line: the header still counts 0 findings, one INFO line carrying NS.6's principle, its
      carried_by and the link to 221. Red before: IndexError (no INFO line).
    expected_literals:
      - 'DRAFT_INFO_OK header=decision_drafts: 1 drafted, 0 findings lines=1 principle=True carried=True links=True'
    fix_if: A missing or extra line, or a changed header, means the INFO rule is wrong; fix the module, never the check.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: The graduated suite (VP 2) covers the same report through report_for_draft; a second record would duplicate it.
  - step: 4
    phase: pre-deploy
    action: The skill and contract words equal the approved sidecar, read at the base.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug serves-claim-verification --expect
      3c06eb3ed0ee0029aa9ed22448d6ff8d57fd8587dbed6524e31253fe39ba8f00
    expected: Exit 0 (APPROVED-TEXT OK 3c06eb3ed0ee0029aa9ed22448d6ff8d57fd8587dbed6524e31253fe39ba8f00).
    fix_if: >-
      A MISMATCH: restore the sidecar's words exactly (only {{DATE}} may vary); any other wording needs Benjamin's new
      approval. This step reads no approval provenance; PR CI's provenance leg is in constraints.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Duplicates validate_merge_step's approved-text leg, which reads the sidecar at the PR base on every PR.
  - step: 5
    phase: pre-deploy
    action: >-
      Every standing suite that names plan-critique, decision-entry or the drafts report still passes unchanged
      (selected by grep, so a suite added later is included).
    command: >-
      bin/venv-python -m pytest $(grep -rlE 'plan-critique|decision-entry|plan_decision_drafts|plan_obligations' tests
      --include='test_*.py' | sort) -q
    expected: Every node passes.
    fix_if: >-
      A pinned literal was lost: restore it from the sidecar; never edit a standing test. A drafts test failing on a
      header or finding count means an INFO line leaked into the findings: fix the module.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: These suites and their registry records already run in both tiers; a record would be a third copy.
  - step: 6
    phase: pre-deploy
    action: plan-critique fits its budget, the entry ratchets to the measured bytes, and no raise marker is added.
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as p; from
      scripts.checks.prose.prose_budget_raises import validate_prose_budget_raises as r; f=[]; p(f); r(f); assert not
      f, f; print('BUDGETS_OK')" && test "$(wc -c < .claude/skills/plan-critique/SKILL.md)" -lt "$(git show
      origin/main:.claude/skills/plan-critique/SKILL.md | wc -c)" && test "$(grep -c 'raise-approved' config/prose_budgets.yaml)"
      -eq "$(git show origin/main:config/prose_budgets.yaml | grep -c 'raise-approved')" && echo NO_RAISE
    expected: Exit 0 after printing BUDGETS_OK then NO_RAISE.
    fix_if: >-
      current<budget: lower the entry to the measured bytes. current>budget or not smaller than main: the text differs
      from the sidecar; restore it. Never add a marker (Decision 165).
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_prose_limits and validate_prose_budget_raises run in both tiers on every surface.
  - step: 7
    phase: pre-deploy
    action: >-
      Contract gates over decision-entry.yaml: drift (the new amendment_log row) and the 500-line structural limit.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as d;
      from scripts.checks.structural.size_limits import validate_structural_size_limits as s, effective_lines as e;
      f=[]; d(f); s(f); assert not f, f; n=e(open('docs/contracts/decision-entry.yaml', encoding='utf-8').read());
      assert n <= 500, n; print('CONTRACT_OK')"
    expected: Exit 0 after printing CONTRACT_OK.
    fix_if: >-
      A drift finding means the entry-log-row block is missing or malformed: restore it from the sidecar. A size
      finding means a sibling build grew the file first: stop and report (compaction of other rows is new wording for
      Benjamin), never raise.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_contract_drift and validate_structural_size_limits run in both tiers.
  - step: 8
    phase: pre-deploy
    action: The registry admits the new record (it fails on origin/main, where the suite does not exist, and passes at HEAD).
    command: >-
      bin/venv-python -c "from scripts.checks.verification.validate_verification_registry import
      validate_verification_registry as v; f=[]; v(f); assert not f, f; print('REGISTRY_OK')"
    expected: Prints REGISTRY_OK.
    fix_if: Fix the record's shape or its check_id (it must equal VP 2's graduation_check_id, Decision 176).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_verification_registry runs in both tiers over every record; a record for it would duplicate it.
  - step: 9
    phase: pre-deploy
    action: Validate the plan document, then the fast tier.
    command: >-
      bin/venv-python -m scripts.roadmap.plan_document docs/plans/PLAN-serves-claim-verification.yaml && bin/venv-python
      -m scripts.validate --pre
    expected: Both exit 0.
    fix_if: Fix the named finding; never skip or disable a check.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: After the commit and rebase, run the full tier to completion (backgrounded, 2 h limit, top-level session), then attest HEAD.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Both exit 0.
    fix_if: >-
      A failure in scope is fixed on the branch; never skip a test or relax an assertion. A failure outside scope
      becomes a rec via scripts.ops_data_portal (Decisions 55, 59).
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: 'After the squash merge carries "Resolves: rec-4915", the closure job closed rec-4915.'
    command: >-
      bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f; s=(f('rec-4915',
      profile='agent_platform') or {}).get('status'); print('rec-4915', s); assert s == 'closed'"
    expected: rec-4915 closed.
    fix_if: >-
      Open: check ci.yml's closure job on the squash commit; close through update_rec with the PR as evidence only if
      its acceptance (the TestCritiquePins node, context) passes on main.
    hermetic: false
test_obligations:
  - source: .claude/skills/plan-critique/SKILL.md
    behavior: Step 12p adjudicates each serves id beside significance and kind, keeps both fire conditions and the trailer exclusion, and its output row names serves.
    verification_step: 2
    test_selector: tests/test_serves_claim_verification.py
    red_green_expectation: Red before (12p names no serves), green after.
  - source: docs/contracts/decision-entry.yaml
    behavior: serves.semantics names step 12p as the verifier and serves.verification holds the evidence rule.
    verification_step: 2
    test_selector: tests/test_serves_claim_verification.py
    red_green_expectation: Red before (semantics names the scout; no verification key), green after.
  - source: scripts/roadmap/plan_decision_drafts.py
    behavior: One INFO line per resolving serves id with principle, failure signal, carried_by and links, never counted as a finding.
    verification_step: 2
    test_selector: tests/test_serves_claim_verification.py
    red_green_expectation: Red before (the report prints no INFO line), green after.
  - source: config/prose_budgets.yaml
    behavior: The plan-critique entry equals the measured bytes, with no marker added.
    verification_step: 6
    command: >-
      bin/venv-python -c "from scripts.checks.prose.prose_limits import validate_prose_limits as p; from
      scripts.checks.prose.prose_budget_raises import validate_prose_budget_raises as r; f=[]; p(f); r(f); assert not
      f, f; print('BUDGETS_OK')"
    waiver_reason: Budget data; validate_prose_limits (current equals budget) and validate_prose_budget_raises are its standing tests in both tiers.
  - source: config/agent/verification_registry/entries/serves-claim-verification-pins.yaml
    behavior: Registry record for the graduated VP 2 check.
    verification_step: 9
    command: bin/venv-python -m scripts.validate --pre
    red_green_expectation: Red before (a graduate step with no registry record fails validate_graduation_completeness), green after.
constraints:
  - >-
    Approved text: every byte the build writes to .claude/skills/plan-critique/SKILL.md and
    docs/contracts/decision-entry.yaml comes from docs/plans/approved/serves-claim-verification.yaml; only {{DATE}} is
    filled (the build day). Never edit either sidecar in the build; any other wording needs Benjamin's new approval.
  - >-
    No budget raise: Decision 165 authorizes a marker key-side; the plan-critique line keeps its dec-75 marker and no
    marker is added. Applying the sidecar shrinks plan-critique by 3 bytes from whatever base the build reads; any
    other delta means the text differs from the sidecar.
  - >-
    Approval provenance (Decision 246): the binding approvals are Benjamin's on the approved-text Environment gate of
    two approved-text-approval.yml runs dispatched from main at the plan PR's head: slug serves-claim-verification
    (approved-words digest ddcb06ad5f3847e2651220aa7b9770c4ca869f44b6c21869c81fd94fef513bcf, fingerprint
    cairn-zinc-apple-storm) and slug arrival-expectations (approved-words digest
    5747958495dc01ee2388e542c86530e0774855bf4242e6b87a3ab9bd1ef6addd, fingerprint jacket-geyser-reef-pepper). His
    chat words are not the record (clause 1). validate_plan_documents keeps the plan PR red until both exist, and
    validate_merge_step reads each again for its build. A MISSING or UNVERIFIED at the build is answered by asking
    Benjamin, through the coordinator, to approve the gate once; never by editing a sidecar.
  - >-
    Race with the arrival-expectations build (outside this project): if this plan PR merges first, that build's flip
    of implementation_declared touches PLAN-arrival-expectations.yaml, which this PR changes, so Decision 245's merge
    gate forces an update-branch and a CI re-run, where validate_merge_step reads the amended sidecar at the new base
    and refuses a placed serves line; its Decision lands without NS.6 (an operator merge outside that agent gate
    leaves VP 1 as the backstop). If that build merges first, this plan PR drops its two arrival rows before it merges and handles the
    landed claim the way Benjamin chose on 2026-11-07, with its own wording approval; nothing in this build edits a
    landed envelope (Decision 177). VP 1 stops the build if the claim landed anyway.
  - >-
    12p judges only the drafted Decision's own serves ids, never the plan's alignment score: the decision scout's
    Serves line scores the plan and stays plan-critique step 7's (Decision 243 clause 8). The scout and planning skills
    are unchanged.
  - >-
    The INFO lines are advisory (Decision 66 pre-write injection): never a finding, never a gate input, and the
    module stays total (a finding or no line, never a raise). envelope_rules and the conformance gate are unchanged.
  - >-
    Out of scope: rec-4916 (T4.32 c4's fingerprint inputs, kept separate, Q3); landed Decisions (no live index row
    lists serves on 3e2eef70); rec-4879 and rec-4880 (open drafts-report hardening on the same module, unplanned).
  - No rescue agents or workaround loops (Decision 55).
