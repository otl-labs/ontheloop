acceptance_criteria:
- Exactly one Decision titled 'First showcase product -- a UK organisation graph over public money ...' exists (220 at drafting) with a bare yaml envelope (number, amends [209], significance numbered_decision justified by subject), title amends edges [209] and no other amends or supersedes edge, the STEP 3 text's required phrases, its filed rec ids, no 'amends Decision 209 clause 5' phrase, and a four-condition stanza that parses not-due (VP 2, VP 6); at implement time it is at or under 6,144 bytes with exactly four filed rec ids (VP 16).
- Exactly one Decision titled 'Recursive self-improvement is proven against a judge the loop cannot edit ...' exists (221 at drafting) with a bare envelope carrying no amends or supersedes edge, the STEP 3 text's required phrases, its filed rec ids, and a four-condition stanza that parses not-due (VP 3, VP 6); at implement time it is at or under 6,144 bytes with exactly two filed rec ids besides rec-4141 (VP 16).
- Decision 209 ends with exactly one dated Amended-by line naming the product-boundary entry, Decision 101 carries exactly one dated Update recording the operator's reading (financial performance of any kind) and the full-supersession rec, after its Decision 209 line, and Decision 178 carries exactly one dated Update inside its Intent pointing to the product-boundary entry's bounded bootstrapping exception; no existing DECISIONS.md line is removed or rewritten; the two entries are adjacent, newest first (VP 4, VP 5, VP 8, VP 14, VP 15).
- The REPORT exists with ten sections, is ASCII with no trailing whitespace or placeholder, and every file:line cite in both entries lands on whole-section bounds (VP 11).
- T4.24's related_decisions carries both new numbers; its criteria, status and depends_on equal origin/main's; the roadmap gates pass at or under 10,000 lines (VP 9, VP 10).
- Seven recommendations are filed through the ops portal, open, the receipts rec depending on rec-4141, their ids in the entries (R5 in Decision 101's Update; R6 only in followon_recs) and in followon_recs (VP 12).
- docs/decisions-index.json is fresh and the full presubmit tier passes on the committed, rebased tree (VP 1, VP 7); after merge both entries are in ops_decisions (VP 13).
