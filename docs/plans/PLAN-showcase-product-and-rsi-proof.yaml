phase: 'user_explicit_out_of_scope (soft-warn category): an operator-directed product-boundary and proof-design governance record. No tier_item is claimed and no exit criterion is closed or edited; T4.24 (deferred_post_mvp) gains two related_decisions back-references only. Tier Item Freshness Gate run on T4.24: no silent completion, no stale reference, no absorbing sibling, no gating CD or cross-tier gate -- nothing to close out.'
