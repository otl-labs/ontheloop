bundled_recommendations: [rec-3875]
followon_recs: [rec-4602, rec-4603, rec-4604, rec-4605, rec-4608]
infrastructure_dependencies:
  - >-
    FREEZE: nothing is pushed, PR'd or merged until Benjamin says the repository transfer freeze is over (memory
    PAUSE, 2026-10-20); building and committing locally is allowed (constraints[0]). After the lift: re-fetch, rebase
    onto the renamed repository's main, re-run VP 1 and VP 11 on the rebased tree, then push.
  - >-
    Release order: this build STARTS only after PLAN-retire-session-cli has merged and its deploy verification is green
    (the writer accepts status:<source>.<result> process events). Before that, a status line in the build session's
    own transcript (a failed --evidence during closure, or a failing test's captured stderr under -m scripts.validate)
    would be refused and halt that session's capture (runner.py writes halt.json on writer_refused).
  - >-
    No Lambda-packaged file, Terraform or IAM change: compute_affected_artifacts over scope is empty (scripts/, tests/,
    config/telemetry, config/agent, .claude/skills and docs/contracts are not packaged), and field_semantics.yaml is
    untouched (ops_recommendations governance_notes do not project; VP 9).
  - >-
    VP 13 (live status row) depends on rec-4292: the telemetry read verbs read the smoke catalog until slice 2c, so the
    step is "not run: unmeasurable" while rec-4292 is open. rec-4608 (dependencies rec-4292) carries the live check
    as a standing verification-monitor silent check, so it does not rest on this one-off probe.
acceptance_criteria:
  - >-
    Every roster CLI mode reports its outcome on every path except the --dry-run refusal and argparse usage errors
    (both before any mode runs): --file-rec prints done for
    an insert, skipped with ci_rca_open_duplicate or ci_rca_stale_rerun when it returns an existing id, and failed on
    every refusal and on a writer or reader error; --update-rec (a writer error included), postflight --metrics and
    --evidence print done or failed; each line parses through the v6 parser's markers.parse_markers as a status marker;
    stdout and exit codes are byte- and value-identical to today's.
  - >-
    validate_status_line_emitters is registered in both tiers, fails with an error naming the file and, where one
    exists, the source for each of E1-E6, and passes on the real tree; the roster names its residual owner rec-4602.
  - >-
    The two rec rules are authored in docs/contracts/ops_recommendations.yaml and served verbatim by
    get_rec_write_guidance(); the followon_recs rule is in exit-criteria-ledger.yaml; the parity test proves both.
  - >-
    replacement_closure_check step (5), the planning trigger, plan-critique 12k and the code-review pointer require
    caller disposition for a deleted writer, pinned by an anti-drift node; no prose, SLOC or structural budget is
    raised.
  - rec-3875 -- python -m scripts.ops_portal.cli --help prints usage, and rec-3875 is closed on merge.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Precondition: PLAN-retire-session-cli is merged with the grammar this plan builds on and this branch is rebased. Its deploy verification being green is confirmed with the coordinator before execution
      step 1, not only before the merge (not checkable from the tree; infrastructure_dependencies[1]).
    command: >-
      git fetch origin main --quiet && git merge-base --is-ancestor origin/main HEAD && grep -q "def
      format_status_marker" src/turn_capture/markers.py && grep -q "STATUS_SOURCE_MAX" src/turn_capture/markers.py &&
      grep -q "STATUS_COMMAND_TOKENS" src/turn_capture/gate_events.py && test -f tests/turn_capture/test_status_events.py &&
      echo PRECONDITION_OK
    expected: PRECONDITION_OK.
    fix_if: Main moved -- rebase. A missing symbol or file means the sibling has not merged -- stop and wait for the coordinator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A sequencing precondition on a sibling plan's merge, not a behaviour of this change; as a standing guard it would
      only re-assert that another plan landed.
  - step: 2
    phase: pre-deploy
    action: emit_status writes one parseable whole line to stderr and nothing to stdout.
    command: bin/venv-python -m pytest tests/telemetry_capture/test_status_line.py -q
    expected: Every node passes. Red before (scripts/telemetry_capture/status_line.py absent).
    fix_if: A line on stdout, two lines, or a parse mismatch is a helper bug.
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: >-
      Every roster emitter goes through this helper, and the graduated step 3 and 4 nodes parse the helper's real
      output through markers.parse_markers, so a helper regression reddens those standing guards.
  - step: 3
    phase: pre-deploy
    action: >-
      The portal emits done, skipped (both reasons) and failed on the right paths (writer_error and
      invalid_context_v2_json included), stdout and exit codes unchanged, and the lines parse as status markers.
    command: bin/venv-python -m pytest tests/ops_data_portal/test_cli_status_lines.py -q
    expected: Every node passes. Red before (no STATUS line is emitted; file_rec_with_outcome absent).
    fix_if: A dedup path reporting done means file_rec_with_outcome lost the branch's outcome; a stdout diff means the line went to stdout.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: status-line-cli-emitters
  - step: 4
    phase: pre-deploy
    action: postflight --metrics reports failed when a child step fails while still returning 0 with JSON stdout; --evidence reports done and failed.
    command: bin/venv-python -m pytest tests/session/postflight/test_status_lines.py tests/session/postflight/test_metrics_housekeeping.py -q
    expected: Every node passes, including the unchanged test_returns_combined_json. Red before (no line emitted).
    fix_if: A JSON parse failure in test_returns_combined_json means the line was printed to stdout.
    hermetic: true
    expected_literals: []
    graduation: graduate
    graduation_check_id: status-line-postflight-emitters
  - step: 5
    phase: pre-deploy
    action: Each roster rule fails closed on a planted defect, and the wrapper fails closed on unreadable input.
    command: >-
      bin/venv-python -m pytest
      tests/checks/hygiene/test_validate_status_line_emitters.py::test_each_rule_fails_closed
      tests/checks/hygiene/test_validate_status_line_emitters.py::test_missing_roster_fails
