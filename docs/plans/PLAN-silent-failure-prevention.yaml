- file: scripts/checks/hygiene/validate_status_line_emitters.py
  action: Create
  purpose: >-
    Registered fast-tier check (Decision 169 manifest, Decision 170 registry.examined(n, unit="status_sources")). Pure
    function emitter_errors(roster, modules) over parsed inputs; the wrapper reads the roster and AST-parses every .py
    under scripts/, src/ and .claude/hooks/. Rules: E1 each source fullmatches markers.SIGNATURE_PATTERN and is at most
    markers.STATUS_SOURCE_MAX characters; E2 results are a non-empty subset of markers.STATUS_RESULTS; E3 each row's
    module exists and holds at least one emit_status call with that literal source for each declared result and none
    with an undeclared result (literal result arguments), and every reason literal fullmatches the signature class; E4 every emit_status call anywhere uses literal source
    and result arguments and a literal reason or none, and names a source the roster assigns to that module; E5 each command contains one of
    src/turn_capture/gate_events.py STATUS_COMMAND_TOKENS (where the sibling defines it), so the v6 parser scans it; E6
    only src/turn_capture/markers.py and scripts/telemetry_capture/status_line.py call format_status_marker (AST) or hold the marker
    needle as raw text, the same matching mode as the sibling guard. The needle is built from markers constants
    (f"{STATUS_MARKER_PREFIX} v{STATUS_MARKER_VERSION}"), so this module's own source never holds it. Each error names
    the file and, where one exists, the source. Fails closed (Decision 170): a missing or unparseable roster, a roster
    that is not a source-keyed mapping, or a scanned file that does not parse appends a failure naming the file, never
    an examined(0) PASS. Imports PyYAML, ast and the turn_capture constants (deferred); under
    500 SLOC.
