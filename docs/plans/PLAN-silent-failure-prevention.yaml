    confirmation line, failed (invalid_update) on the rejected-flag, no-field and ValidationError/ValueError paths and
    failed (writer_error) before re-raising any other exception; exit codes unchanged. The only silent paths are the
    --dry-run refusal and argparse usage errors, both before any recording mode runs. rec-3875: add
    `if __name__ == "__main__": sys.exit(main())` so python -m scripts.ops_portal.cli is the CLI, not a silent no-op.
