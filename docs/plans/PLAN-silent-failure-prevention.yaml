schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: silent-failure-prevention
intent: >-
  Stop the three gaps that hid rec-4589 for two months. (1) No silent success: recording CLI modes report every
  outcome as a STATUS v1 line (PLAN-retire-session-cli's grammar and parser), so the capture records a skip as a skip
  and a failure as a failure row, not only as transcript text; a roster and a fast-tier check keep the emitters
  honest. First roster: the two modes that exit 0 on a skip or failure -- ops portal --file-rec (its ci_rca dedup and
  stale-rerun paths return an existing id with exit 0, indistinguishable from a fresh filing; those paths run mostly
  in the ci-rca GitHub Actions agent, captured once T3.20 c9 lands) and postflight --metrics (returns 0 when its child
  steps fail) -- plus --update-rec and postflight --evidence, the other two recording modes every /implement closure
  calls, whose failures today leave only an unattributed tool_call error row. (2) Rec hygiene:
  never append unrelated work to an existing rec, a rec's file is the surface its acceptance checks, and followon_recs
  defers to an existing rec only when that rec's acceptance fails while the work is undone -- authored in the
  contracts, served through get_rec_write_guidance, pinned by a parity test. (3) Deleting a writer disposes of every
  caller: tier-item-lifecycle's replacement closure check, the planning skill and plan-critique 12k require each caller
  of a deleted writer to be removed, rewired or made to fail loudly. Bundles rec-3875 (the portal's cli.py exits 0
  silently under python -m). Exit codes and stdout contracts do not change; nothing deploys.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V2
plan_path: docs/plans/PLAN-silent-failure-prevention.yaml
phase: >-
  ad_hoc_rec (defect prevention for rec-4589, with PLAN-telemetry-field-realization; Benjamin approved 2026-10-24).
  Closes no roadmap exit criterion: closes_criteria is empty by design (see context for the related tier item).
  PLAN-retire-session-cli (rec-4589 plan 1) builds first and
  owns the STATUS v1 grammar, formatter, parser and writer deploy.
closes_criteria: []
scope:
- file: scripts/telemetry_capture/status_line.py
  action: Create
  purpose: >-
    emit_status(source, result, reason=None) -> None, the one emitter helper. Home: the telemetry-capture package
    (file-router.yaml telemetry-capture route); a scripts-root module would be a validate_placement RS-01 stray. It
    deferred-imports src.turn_capture.markers (stdlib only, so the package stays stdlib only; the
    scripts/checks/validation_result.py precedent), builds the line with
    format_status_marker and prints it as one whole line to sys.stderr, flushed. stderr, not stdout, so the --file-rec
    rec-id line and the --metrics JSON stay the only stdout content (tests parse them); a Claude Code Bash tool_result's
    content carries stderr after stdout, which is what the v6 parser scans (last 200 lines of a repo-CLI command).
    Never raises: a formatter ValueError is caught and a one-line diagnostic without the marker goes to stderr instead,
    so a bad argument can never turn a successful insert into a non-zero exit and a re-file (E3 and E4 catch bad
    literals first). Its docstring
    describes the line without spelling the marker literal (the sibling guard and rule E6 match raw text).
- file: tests/telemetry_capture/test_status_line.py
  action: Create
  purpose: >-
    emit_status writes exactly one line to stderr and nothing to stdout; the line parses back through
    markers.parse_markers to Marker("status", "<source>.<result>", ..., result=<result>) for done, skipped and failed,
    with and without reason; a bad argument writes the diagnostic (no marker) and raises nothing.
- file: scripts/ops_data_portal.py
  action: Modify
  purpose: >-
    file_rec's body moves into file_rec_with_outcome(fields, profile=None, _migration_int_id=None, _skip_sync=False,
    context_v2_json=None) -> FileRecOutcome; file_rec keeps its exact signature and returns .rec_id, so its 30-odd
    callers and every patch site are unchanged (both stay facade-defined, Decision 124 patch-epicentre). The open-dedup
    branch returns FileRecOutcome(existing_id, inserted=False, reason="ci_rca_open_duplicate"), the closed-head drop
    branch FileRecOutcome(head.rec_id, inserted=False, reason="ci_rca_stale_rerun"), the insert FileRecOutcome(rec_id,
    inserted=True, reason=None). SLOC: 480 at main 2850f7be and the counter includes docstring lines, so the long
    docstring moves to file_rec_with_outcome and file_rec keeps a one-line docstring (estimate about 490). If the
    measured count still exceeds 500, decompose into a facade submodule (Decision 128), never a budget raise.
- file: scripts/ops_portal/outcomes.py
