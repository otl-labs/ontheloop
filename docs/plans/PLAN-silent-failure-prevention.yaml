  purpose: >-
    FileRecOutcome NamedTuple (rec_id str, inserted bool, reason str | None), re-exported by the facade. Its own small
    module because _common.py's docstring scopes it to shared ROOT and region constants.
- file: scripts/ops_portal/cli.py
