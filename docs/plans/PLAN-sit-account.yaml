schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: sit-account
intent: >-
  Create the empty SIT member account in the Organization's SIT OU, under the baseline SCP and with no root
  credentials (rec-5064), so SIT can be bootstrapped (rec-5027). The third T2.57 Organization step after the foundation
  (rec-5026). It is irreversible: an AWS account can only be closed, with a 90-day suspension.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-sit-account.yaml
phase: >-
  T2.57 c11 ("rec-5064: the SIT account exists in the SIT OU under the baseline, with no root credentials."), added
  open by PLAN-sit-organization's build; T2.57 is on main since the rec-5024 build (#1957). closes_criteria
  [T2.57:c11] is declared at the refresh (R9), once c11 is on main.
scope:
  # ------------------------------------------------------------ PR 1: the account-creation grant (reversible)
  - file: terraform/organization/management_admin.tf
    action: Modify
    purpose: >-
      PR 1: aws_iam_role_policy account_create, name agent-platform-org-security-account-create, on the OrganizationAdmin
      role, policy try(templatefile(organization_admin_account_create.json.tftpl, {}), <a single explicit Deny *
      statement>) as the foundation's other policies. Its own resource so rec-5065's PR removes the grant by deleting
      one resource. PR 2: aws_iam_role_policy sit_access, name agent-platform-org-security-sit-access, the same try()
      form over organization_admin_sit_access.json.tftpl with sit_account_id = aws_organizations_account.sit.id (a
      reference, never a literal).
  - file: terraform/organization/policies/organization_admin_account_create.json.tftpl
    action: Create
    purpose: >-
      PR 1: one statement allowing organizations:CreateAccount and organizations:DescribeCreateAccountStatus on
      Resource "*" (neither takes a resource ARN). Nothing else; no placeholders.
  - file: terraform/organization/policies/organization_admin.json.tftpl
    action: Modify
    purpose: >-
      PR 1: OrganizationAdminOps's Organizations write Sid gains organizations:MoveAccount (the provider moves a created
      account from the root to its parent_id; v5.80.0 account.go), and that Sid's Resource covers what MoveAccount and
      the provider's CreateAccount tagging (default_tags, so organizations:TagResource on the new account) authorise
      against: account ARNs (account/o-*/*), the root and the OUs; the foundation's Sid is on Resource "*" (its
      65feaf58), so no Resource change is expected (R3).
      Standing, reversible; rec-5065 then needs no MoveAccount of its own. No cloudtrail write verb in any template here
      (test_cloudtrail_write_grant_scoped.py reads them).
  - file: scripts/aws_identity.py
    action: Modify
    new_imports: []
    purpose: >-
      PR 1: member_session(profile, role_arn), which assumes a member-account role from a SEPARATE STS client in
      IDENTITY_PROBE_REGION with the profile's frozen credentials (the module's own rule for chained AssumeRole) and
      waits a bounded 6 tries 10 s apart on AccessDenied only (a new account's role is not assumable at once); and a
      member-root-audit subcommand (--profile, --account-name, --role-name default OrganizationAccountAccessRole) that
      prints only STATE (the Account State field; Status is retired since 2026-09-09), PARENT_OU (name), OU_POLICIES (names, sorted), ROOT_FEATURES (from the management side's
      iam list-organizations-features, sorted), and ROOT_PASSWORD, ROOT_ACCESS_KEYS, ROOT_SIGNING_CERTS and ROOT_MFA
      (SIT's get-account-summary AccountPasswordPresent, AccountAccessKeysPresent, AccountSigningCertificatesPresent,
      AccountMFAEnabled), never an id; a missing State or a key missing from the summary prints "absent" and exits 1
      (never read as 0). Failures print the exception class and error code only, through mask_account_ids, and exit 1.
      The module docstring gains one line: member_session is the one chained AssumeRole site, under the same rule.
  - file: tests/test_aws_identity.py
    action: Modify
    purpose: >-
      PR 1: member_session builds its STS client in IDENTITY_PROBE_REGION with the frozen credentials (never the
      profile's region), retries only AccessDenied and at most 6 times; member-root-audit prints the eight lines from
      stubbed clients whose DescribeAccount response carries State and no Status, masks every 12-digit id, exits 1 on
      a missing State or summary key, and exits 1 with no traceback on a ClientError.
  - file: tests/checks/iam_tf/test_organization_baseline.py
    action: Modify
    purpose: >-
      PR 1: the account-create policy allows exactly CreateAccount and DescribeCreateAccountStatus inside try() with a
      Deny-all fallback; the Organizations write Sid's pinned set gains MoveAccount and its Resource covers account
      ARNs, the root and OUs (or "*"); OrganizationAdminOps still holds none of the operator-only verbs (CloseAccount,
      RemoveAccountFromOrganization and the rest); all of OrganizationAdmin's inline templates, rendered with the
      foundation's 12-digit and region stand-ins, total at most 10,240 non-whitespace characters (IAM's per-role
      inline aggregate). PR 2: rec-5064's acceptance node test_sit_account_in_sit_ou_without_close_on_deletion
      (aws_organizations_account sit has parent_id the sit OU's reference, close_on_deletion false, prevent_destroy,
      iam_user_access_to_billing DENY, role_name OrganizationAccountAccessRole, ignore_changes exactly role_name and
      iam_user_access_to_billing, email from var.sit_account_email); the sit-access policy allows only sts:AssumeRole
      on the OrganizationAccountAccessRole ARN built from the account reference; sit_account_email is sensitive with no
      default; the aggregate case covers the sit-access template too. If the foundation's name-family case scans the
      account's name or role_name, PR 2 adds exactly "SIT" and OrganizationAccountAccessRole to its owned-name list
      and names that in the PR body for the operator's final-diff word (R5).
  # ------------------------------------------------------------ PR 2: SIT is created (irreversible)
  - file: terraform/organization/variables.tf
    action: Modify
    purpose: "PR 2: sit_account_email, sensitive, no default, a lowercase e-mail validation (email is ForceNew under prevent_destroy, so a case mismatch with AWS's stored value must not wedge later plans); its value lives only in the SSM tfvars parameter."
  - file: terraform/organization/accounts.tf
    action: Modify
    purpose: >-
      PR 2: aws_organizations_account sit: name "SIT", email var.sit_account_email, parent_id
      aws_organizations_organizational_unit.sit.id, role_name OrganizationAccountAccessRole (kept for rec-5027, which
      narrows or removes it), iam_user_access_to_billing DENY, close_on_deletion false, lifecycle prevent_destroy and
      ignore_changes [role_name, iam_user_access_to_billing] (both are not read back, so an import would null them).
  - file: terraform/organization/policies/organization_admin_sit_access.json.tftpl
    action: Create
    purpose: "PR 2: one statement allowing sts:AssumeRole on arn:aws:iam::${sit_account_id}:role/OrganizationAccountAccessRole; nothing else."
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      PR 3 (bookkeeping, after step 11's read-back is posted): T2.57 c11 flips met (met_by sit-account) in that PR's
      bookkeeping walk, on step 11's posted post-deploy evidence; PR 3 declares the plan and carries 'Resolves:
      rec-5064', so the rec closes only once SIT is proven, not at PR 2's merge.
bundled_recommendations: [rec-5064]
followon_recs: []
infrastructure_dependencies:
  - "terraform/organization exists on main and is applied (rec-5026 foundation): the Organization with centralized root access, the sit OU with the baseline SCP attached, OrganizationAdmin and the management environment (its step 10 read-back posted)."
  - "Two admin-tier applies of terraform/organization from the management environment (Decision 252 cl.7, Decision 248 cl.6), one each for PR 1 and PR 2 (PR 3 is bookkeeping with no apply), one at a time project-wide, each after its pre-merge plan."
  - "The SIT root e-mail: a company mailbox never used for any AWS account, receiving mail, written by the operator into the SSM parameter /secret/agent-platform-terraform-organization-tfvars as sit_account_email before PR 2's pre-merge plan."
  - "Running cost: $0 a month (an empty account; IAM policies and Organizations are free). The foundation's IAM self-change alarm fires once per sitting (expected)."
acceptance_criteria:
  - "rec-5064's acceptance node tests/checks/iam_tf/test_organization_baseline.py::test_sit_account_in_sit_ou_without_close_on_deletion passes, with every other case in that file and tests/test_aws_identity.py."
  - "After PR 1's apply, OrganizationAdmin's account-create policy allows exactly CreateAccount and DescribeCreateAccountStatus, and OrganizationAdminOps holds MoveAccount on a Resource covering account ARNs; a fresh plan exits 0."
  - "After PR 2's apply, member-root-audit reads STATE ACTIVE, PARENT_OU sit, OU_POLICIES FullAWSAccess baseline, ROOT_FEATURES RootCredentialsManagement RootSessions, and ROOT_PASSWORD 0, ROOT_ACCESS_KEYS 0, ROOT_SIGNING_CERTS 0, ROOT_MFA 0; a fresh plan exits 0."
  - "PR 2 applied only on the operator's own words naming the SIT account's creation; PR 2's apply comment quotes that message's id."
  - "rec-5064 reads closed by PR 3's Resolves trailer, and T2.57 c11 reads met, both only after step 11 passed."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The organization text tests, rec-5064's acceptance node first; the PR 2 cases are red until PR 2 lands.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_organization_baseline.py -q
    expected: exit 0 on each PR's head.
    fix_if: a case fails on the real tree -- fix the HCL or template, never the assertion (Decision 235)
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: The foundation graduates this file as the organization-baseline shard; the new cases run inside it in both tiers.
  - step: 2
    phase: pre-deploy
    action: The helper's tests and the STS census (aws_identity.py stays classed; no new STS file).
    command: bin/venv-python -m pytest tests/test_aws_identity.py tests/test_sts_call_sites.py -q
    expected: exit 0
    fix_if: the census names a new file -- the chained call belongs in scripts/aws_identity.py, not elsewhere
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: The aws-identity-caller-arn shard already runs tests/test_aws_identity.py in both tiers; the census test is itself a standing test.
  - step: 3
    phase: pre-deploy
    action: >-
      Credential-free init, validate and fmt of the root and the fast tier in the edit loop; then, before each PR's
      handoff, the full tier as a separate backgrounded run (2 h limit, top-level session) read with
      validation_result --verify-head.
    command: >-
      TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir=terraform/organization init -backend=false -input=false > /dev/null && terraform -chdir=terraform/organization validate -no-color && terraform fmt -check -recursive terraform/organization &&
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      exit 0; validate prints Success; fmt lists nothing; the fast tier passes; the full tier (the second validate
      call, started backgrounded with a 2 h limit from the top-level session, as each PR's CLOSURE step says) passes
      and --verify-head exits 0 for HEAD.
    fix_if: validate names an attribute -- fix the HCL
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The terraform-validate job runs init, validate and fmt on every _TERRAFORM_ROOTS member in CI.
  - step: 4
    phase: pre-deploy
    action: >-
      PR 1 and PR 2 do not declare the plan, so CI's scope check does not run on them: run validate_scope_boundary
      through its plan_paths seam on each of their branches.
    command: >-
      bin/venv-python -c "from scripts.checks.verification.validate_scope_boundary import validate_scope_boundary as v; f=[]; v(f, plan_paths=['docs/plans/PLAN-sit-account.yaml']); print('SCOPE_FAILS', len(f)); raise SystemExit(1 if f else 0)"
    expected: SCOPE_FAILS 0 and exit 0.
    fix_if: a touched path is outside scope -- drop it from that PR, or it is a plan defect (amendment)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: It binds this plan's path and the two non-declaring branches only; validate_scope_boundary is already a standing check for declaring PRs, which PR 3 is.
  - step: 5
    phase: pre-deploy
    action: >-
      Before PR 2's pre-merge plan, in the management environment under the secret-read approval: the tfvars parameter
      carries sit_account_email (a count, never the value). Operator, in words (always_ask): the SIT mailbox is a
      company mailbox never used for any AWS account and receives mail. The foundation's step 10 read-back comment is
      on its merged PR. A too-young Organization or management account makes CreateAccount fail with nothing created.
    command: >-
      aws ssm get-parameter --profile agent_platform_admin_org --name /secret/agent-platform-terraform-organization-tfvars --with-decryption --query Parameter.Value --output text | grep -c '^[[:space:]]*sit_account_email[[:space:]]*='
    expected: 1, then the operator's words for the mailbox.
    fix_if: 0 -- the operator adds the value to the parameter; PR 2 waits
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      ENVIRONMENT CHECK (deploy-paths.yaml pre_merge_live_plan) at the start of every management-environment sitting
      (steps 5, 7-11).
    command: >-
      bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin_org 2>/dev/null | grep -q 'assumed-role/OrganizationAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
    expected: ADMIN_CHAIN_OK
    fix_if: ADMIN_CHAIN_ABSENT -- STOP; not in the management environment, or its network secret or profile is wrong (the foundation's step 4)
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      Pre-merge read-only admin plan at each PR's CI-green $PR_HEAD_SHA (deploy-paths.yaml pre_merge_live_plan), in the
      management environment on the operator's direction: the foundation's step 7 command (literal worktree
      /tmp/org-wt, evidence in /tmp/org-evidence, -lock=false, plan file deleted) plus the resolved hashicorp/aws
      version. Counts, addresses and changed-attribute names on the PR.
    command: >-
      set -o pipefail; test -n "$PR_HEAD_SHA" || { echo PR_HEAD_SHA_UNSET; exit 1; }; R=$(tr -d '[:space:]' < config/aws-region); E=/tmp/org-evidence; rm -rf "$E"; mkdir -p "$E";
      { git worktree remove --force /tmp/org-wt 2> /dev/null; git worktree prune; git worktree add --detach /tmp/org-wt "$PR_HEAD_SHA" -q; } &&
      aws ssm get-parameter --profile agent_platform_admin_org --name /secret/agent-platform-terraform-organization-tfvars --with-decryption --query Parameter.Value --output text > "$E/terraform.organization.tfvars" &&
      terraform -chdir=/tmp/org-wt/terraform/organization init -input=false -backend-config="region=$R" > /dev/null 2>> "$E/tf.err" &&
      terraform -chdir=/tmp/org-wt/terraform/organization version -json | bin/venv-python -c "import json,sys; print('AWS_PROVIDER', json.load(sys.stdin)['provider_selections'].get('registry.terraform.io/hashicorp/aws'))" &&
      terraform -chdir=/tmp/org-wt/terraform/organization plan -input=false -no-color -lock=false -detailed-exitcode -var-file="$E/terraform.organization.tfvars" -out="$E/p.bin" > /dev/null 2>> "$E/tf.err"; rc=$?;
      terraform -chdir=/tmp/org-wt/terraform/organization show -json "$E/p.bin" 2>/dev/null | bin/venv-python -c "import json,sys,collections; p=json.load(sys.stdin); c=collections.Counter(); [c.update(['+'.join(r['change']['actions'])]) for r in p.get('resource_changes', [])]; print('COUNTS', dict(c)); d=lambda ch: sorted(k for k in set(ch.get('before') or {}) | set(ch.get('after') or {}) if (ch.get('before') or {}).get(k) != (ch.get('after') or {}).get(k)) if 'update' in ch['actions'] else []; [print(r['change']['actions'], r['address'], d(r['change'])) for r in p.get('resource_changes', []) if r['change']['actions'] != ['no-op']]";
      echo "EXIT $rc"; rm -f "$E/p.bin" "$E/terraform.organization.tfvars"; git worktree remove --force /tmp/org-wt
    expected: >-
      AWS_PROVIDER printed (if not 5.80.0, re-read account.go at that version before merging PR 2 and report any
      change to the create, move or retry paths); EXIT 2. PR 1: create aws_iam_role_policy.account_create and update
      in place the OrganizationAdminOps policy (changed attributes: policy only), nothing else. PR 2: create
      aws_organizations_account.sit and aws_iam_role_policy.sit_access, nothing else. 0 to destroy or replace in both.
    fix_if: any other address, a destroy or a replace -- STOP and report on the PR; EXIT 1 -- read /tmp/org-evidence/tf.err locally through scripts.ci.redaction_check.mask_account_ids
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      After each merge, on the operator's direction: the foundation's step 8 (worktree /tmp/org-merge/wt at the merge
      sha, plan.bin and tfvars outside it, Plan line, MERGE_PLAN_EXIT, WORKTREE_CLEAN); present the counts, the step 9
      command and the approve line. For PR 2 the operator's reply must also name the SIT account's creation in their
      own words; an approve line alone does not cover it.
    command: >-
      set -o pipefail; test -n "$MERGE_SHA" || { echo MERGE_SHA_UNSET; exit 1; }; R=$(tr -d '[:space:]' < config/aws-region); mkdir -p /tmp/org-merge;
      { git worktree remove --force /tmp/org-merge/wt 2> /dev/null; rm -rf /tmp/org-merge/wt; git worktree prune; git worktree add --detach /tmp/org-merge/wt "$MERGE_SHA" -q; } &&
      aws ssm get-parameter --profile agent_platform_admin_org --name /secret/agent-platform-terraform-organization-tfvars --with-decryption --query Parameter.Value --output text > /tmp/org-merge/terraform.organization.tfvars &&
      terraform -chdir=/tmp/org-merge/wt/terraform/organization init -input=false -backend-config="region=$R" > /dev/null 2>> /tmp/org-merge/tf.err &&
      terraform -chdir=/tmp/org-merge/wt/terraform/organization plan -input=false -no-color -detailed-exitcode -var-file=/tmp/org-merge/terraform.organization.tfvars -out=/tmp/org-merge/plan.bin 2>> /tmp/org-merge/tf.err | grep -E '^Plan:|No changes'; echo "MERGE_PLAN_EXIT ${PIPESTATUS[0]}";
      git -C /tmp/org-merge/wt status --porcelain --untracked-files=all | grep -q . && echo WORKTREE_DIRTY || echo WORKTREE_CLEAN
    expected: >-
      PR 1 "Plan: 1 to add, 1 to change, 0 to destroy."; PR 2 "Plan: 2 to add, 0 to change, 0 to destroy."; each with
      MERGE_PLAN_EXIT 2 and WORKTREE_CLEAN, then the operator's word.
    fix_if: counts differ from step 7 or MERGE_PLAN_EXIT 1 -- never run step 9; delete /tmp/org-merge and re-run step 7 at the merge sha
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Only after step 8 matched and the operator wrote "approve tf-state-change organization <merge sha>" (and, for PR
      2, words naming the creation): the foundation's step 9 apply, fresh plan and cleanup.
    command: >-
      set -o pipefail; terraform -chdir=/tmp/org-merge/wt/terraform/organization apply -input=false -no-color /tmp/org-merge/plan.bin 2>> /tmp/org-merge/tf.err | grep -E '^Apply complete!'; echo "APPLY_EXIT ${PIPESTATUS[0]}";
      terraform -chdir=/tmp/org-merge/wt/terraform/organization plan -input=false -no-color -detailed-exitcode -var-file=/tmp/org-merge/terraform.organization.tfvars > /dev/null 2>> /tmp/org-merge/tf.err; echo "ORG_PLAN_EXIT $?";
      rm -f /tmp/org-merge/plan.bin /tmp/org-merge/terraform.organization.tfvars; git worktree remove --force /tmp/org-merge/wt
    expected: '"Apply complete!" with step 8''s counts, APPLY_EXIT 0, then ORG_PLAN_EXIT 0. Counts-only comment on the merged PR.'
    fix_if: >-
      PR 2's apply errors after the account exists (a move failure, a tainted resource, or the account missing from
      state) -- STOP, read /tmp/org-merge/tf.err only through scripts.ci.redaction_check.mask_account_ids (provider
      errors embed the id), report, and take only the matching recovery in this plan's context on the operator's direction; never
      apply a plan that shows a replace or destroy of aws_organizations_account.sit
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      PR 1 read-back in the management environment: the actions and Resource patterns of the two grants, ids masked.
      Not the IAM simulator: OrganizationAdmin holds no iam:SimulatePrincipalPolicy, and adding one for a read-back
      widens the grant; the policy text read back is what the simulator would evaluate.
    command: >-
      P=agent_platform_admin_org;
      aws iam get-role-policy --profile $P --role-name OrganizationAdmin --policy-name agent-platform-org-security-account-create --query 'PolicyDocument.Statement[].[Action,Resource]' --output json | bin/venv-python -c "import sys; from scripts.ci.redaction_check import mask_account_ids; print(mask_account_ids(sys.stdin.read()))";
      aws iam get-role-policy --profile $P --role-name OrganizationAdmin --policy-name OrganizationAdminOps --query "PolicyDocument.Statement[?contains(to_string(Action), 'organizations:MoveAccount')].[Action,Resource]" --output json | bin/venv-python -c "import sys; from scripts.ci.redaction_check import mask_account_ids; print(mask_account_ids(sys.stdin.read()))"
    expected: >-
      organizations:CreateAccount and organizations:DescribeCreateAccountStatus on "*"; a statement holding
      organizations:MoveAccount and organizations:TagResource whose Resource covers account/o-*/* (or "*"). Post on PR 1.
    fix_if: either differs -- report on PR 1; PR 2 does not start
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: PR 2 read-back in the management environment through the helper (separate-region STS client, no ids).
    command: bin/venv-python -m scripts.aws_identity member-root-audit --profile agent_platform_admin_org --account-name SIT
    expected: >-
      STATE ACTIVE; PARENT_OU sit; OU_POLICIES FullAWSAccess baseline; ROOT_FEATURES RootCredentialsManagement
      RootSessions; ROOT_PASSWORD 0; ROOT_ACCESS_KEYS 0; ROOT_SIGNING_CERTS 0; ROOT_MFA 0; exit 0. Post on PR 2;
      rec-5027 and PR 3 do not start until it reads so.
    fix_if: >-
      the assume-role still fails after the bounded wait -- report, the operator decides; PARENT_OU is the root -- the
      move recovery; STATE PENDING_ACTIVATION -- not a failure, re-run step 11 later and report if it is not ACTIVE
      within the hour; ROOT_PASSWORD, ROOT_ACCESS_KEYS, ROOT_SIGNING_CERTS or ROOT_MFA 1 -- STOP, report to the
      operator (root credentials exist, so centralized root access was not in force at creation)
    hermetic: false
    graduation: not-applicable
  - step: 12
    phase: post-deploy
    action: rec-5064 closed by PR 3's squash Resolves trailer; read back from a default-environment session (the management environment has no agent_platform profile).
    command: bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5064']); print(rows[0]['id'], rows[0]['status'])"
    expected: rec-5064 closed
    fix_if: still open after the closure job ran -- read ci.yml's closure job log; never close by hand
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: terraform/organization/accounts.tf
    behavior: SIT in the sit OU, close_on_deletion false, prevent_destroy, billing DENY, the two ignore_changes
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_organization_baseline.py::test_sit_account_in_sit_ou_without_close_on_deletion
    red_green_expectation: red before PR 2 (no account resource), green after
  - source: terraform/organization/management_admin.tf
    behavior: the two new inline policies sit inside try() with a Deny-all fallback; the role's inline aggregate fits
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_organization_baseline.py
    red_green_expectation: the account-create case red before PR 1, the sit-access case red before PR 2
  - source: terraform/organization/policies/organization_admin_account_create.json.tftpl
    behavior: exactly CreateAccount and DescribeCreateAccountStatus
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_organization_baseline.py
    red_green_expectation: red before PR 1 (template absent)
  - source: terraform/organization/policies/organization_admin.json.tftpl
    behavior: MoveAccount granted on a Resource covering accounts; operator-only verbs still absent
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_organization_baseline.py
    red_green_expectation: the MoveAccount case red before PR 1
  - source: terraform/organization/policies/organization_admin_sit_access.json.tftpl
    behavior: only sts:AssumeRole on SIT's OrganizationAccountAccessRole
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_organization_baseline.py
    red_green_expectation: red before PR 2 (template absent)
  - source: terraform/organization/variables.tf
    behavior: sit_account_email sensitive with no default
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_organization_baseline.py
    red_green_expectation: red before PR 2
  - source: scripts/aws_identity.py
    behavior: chained assume through the probe-region client with a bounded AccessDenied wait; audit prints no id and fails closed
    verification_step: 2
    test_selector: tests/test_aws_identity.py
    red_green_expectation: the member_session and member-root-audit cases are red before PR 1
  - source: tests/test_aws_identity.py
    behavior: the new helper cases
    verification_step: 2
    test_selector: tests/test_aws_identity.py
