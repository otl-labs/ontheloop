      ACCOUNT_POLICIES FullAWSAccess, ROOT_FEATURES RootCredentialsManagement RootSessions, ROOT_PASSWORD 0,
      ROOT_ACCESS_KEYS 0, ROOT_SIGNING_CERTS 0, ROOT_MFA 0, ROOT_LOGIN_PROFILE 0. ROOT_MFA is reported but is not a pass condition: a root
      with no password cannot hold an MFA device, so the three credential lines decide. The operator sends the lines
      to the build thread.
    fix_if: >-
