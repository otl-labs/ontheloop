schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: sit-account
intent: >-
  Create the empty SIT member account in the Organization's SIT OU, under the baseline SCP and with no root
  credentials (rec-5064), so SIT can be bootstrapped (rec-5027). The step after the applied Organization foundation
  (rec-5026). It is irreversible: an AWS account can only be closed, with a 90-day suspension.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-sit-account.yaml
phase: >-
  T2.57 c11 ("rec-5064: the SIT account exists in the SIT OU under the baseline, with no root credentials."), open on
  main since the rec-5026 build (#2296). It needs post-deploy evidence, so it flips in PR 3 after step 8's read-back.
closes_criteria: [T2.57:c11]
cites: [dec:252, dec:256, dec:126, dec:248, dec:237, dec:101, dec:202, dec:247, dec:136]
scope:
  # ------------------------------------------------------------ PR 1: the grant (reversible)
  - file: terraform/organization/policies/organization_admin.json.tftpl
    action: Modify
    purpose: >-
      PR 1, four changes to OrganizationAdminOps and nothing else. (a) A new Sid AccountCreate allowing only
      organizations:CreateAccount on Resource "*" (it takes no resource ARN). DescribeCreateAccountStatus is already
      covered by OrgRead's organizations:Describe*, and the provider's CreateAccount tags need organizations:TagResource,
      which OrgManage already has. A Sid of its own lets rec-5065's PR remove it as an in-place policy update
      through SelfRole's iam:PutRolePolicy (the operator's card cmsg_01DE2cGfmCsT1URMgE9SxkYhFEModu1omCrKgquuna6gcr). OrganizationAdmin has no iam:DeleteRolePolicy, so it cannot delete a
      separate inline policy. (b) organizations:MoveAccount joins OrgManage (Resource "*"). The provider moves a created
      account from the root to parent_id, and rec-5065 then needs no MoveAccount of its own. (c) A new Sid RootAudit
      allowing only sts:AssumeRoot on Resource "*", with Condition StringEquals sts:TaskPolicyArn
      arn:aws:iam::aws:policy/root-task/IAMAuditRootUserCredentials (the operator's card
      cmsg_01DE2cGfmCsT1URMgE9SxkYhUamneiMzhqXQLUpNPaKF3q). It holds no account id, so it lands before the account
      exists. (d) A new Sid TfvarsWrite allowing only ssm:PutParameter on exactly
      arn:aws:ssm:${region}:${account_id}:parameter/secret/agent-platform-terraform-organization-tfvars, TfvarsRead's
      one ARN (Decision 237 cl.2). OrganizationAdmin can only read that parameter today, so step 4 has no way to add
      sit_account_email without a root sign-in. It is permanent: rec-5065's PROD e-mail and any later tfvars edit use it
      too. No cloudtrail write verb (test_cloudtrail_write_grant_scoped.py reads every template). Measured with the
      grant test's stand-ins: 5,710 characters today, 6,203 with all four, against the 7,000 and 10,240 caps.
  - file: tests/checks/iam_tf/test_organization_admin_grant.py
    action: Modify
    purpose: >-
      PR 1: sid_set_problems pins AccountCreate as exactly {organizations:CreateAccount}, RootAudit as exactly
      {sts:AssumeRoot} and TfvarsWrite as exactly {ssm:PutParameter}. grant_problems checks TfvarsWrite's Resource
      is the one literal parameter ARN, as it does for TfvarsRead, with red cases for a widened Resource (a trailing *)
      and ssm:PutParameter added to any other Sid. A new predicate checks three things: RootAudit's Condition is exactly that StringEquals
      sts:TaskPolicyArn on the IAMAuditRootUserCredentials ARN; organizations:MoveAccount is in OrgManage; and
      CreateAccount appears in no Sid but AccountCreate. It has a red case for each: the condition dropped, a second
      task policy, MoveAccount dropped and CreateAccount added to OrgManage. sid_set_problems gets red cases for a
      widened AccountCreate (organizations:CloseAccount added), a widened RootAudit (sts:AssumeRole added) and a
      widened TfvarsWrite (ssm:DeleteParameter added). The
      existing operator-only, Delete-verb and size checks run unchanged over the larger policy.
  # ------------------------------------------------------------ PR 2: SIT is created (irreversible)
  - file: terraform/organization/variables.tf
    action: Modify
    purpose: >-
      PR 2: sit_account_email, sensitive, no default. A validation block requires a lowercase address (condition
      var.sit_account_email == lower(var.sit_account_email)): the e-mail is ForceNew
      under prevent_destroy, so a case mismatch with AWS's stored value must never plan a replace. Its value lives only
      in the tfvars SecureString, which the operator's step 4 block writes through TfvarsWrite (Decision 237).
  - file: terraform/organization/accounts.tf
    action: Modify
    purpose: >-
      PR 2: aws_organizations_account sit, with these attributes:
      - name "SIT", email var.sit_account_email, parent_id aws_organizations_organizational_unit.sit.id.
      - role_name OrganizationAccountAccessRole, kept for rec-5027 to narrow or remove.
      - iam_user_access_to_billing DENY (card cmsg_01DE2cGfmCsT1URMgE9SxkYhSz5wQkp53y8Axfbr7c9Wed).
      - close_on_deletion false.
      - depends_on [aws_organizations_policy_attachment.baseline_sit, aws_iam_organizations_features.this]: the
        account is never created before the baseline is on the OU or before centralized root access is on (the
        foundation's parallel-create defect, rec-5465).
      - lifecycle prevent_destroy and ignore_changes [role_name, iam_user_access_to_billing]: provider v5.100.0
        reads neither back and both are ForceNew, so an edit or an import can never plan a replace.
      The existing comment line naming rec-5064 is replaced by the block.
  - file: tests/checks/iam_tf/test_organization_baseline.py
    action: Modify
    purpose: >-
      PR 2: rec-5064's acceptance node test_sit_account_in_sit_ou_without_close_on_deletion, through a new
      account_problems predicate. It checks every attribute above: the parent reference, close_on_deletion false,
      prevent_destroy, billing DENY, the role name, ignore_changes exactly those two, both depends_on entries, email
      from var.sit_account_email, and sit_account_email sensitive with no default and carrying the lowercase validation
      (its condition compares the value with lower(var.sit_account_email)). It has red cases for the lowercase validation
      dropped, sensitive = true dropped, billing DENY changed to ALLOW, the parent changed to the root,
      close_on_deletion true, prevent_destroy dropped, each depends_on entry dropped and the
      ignore_changes widened. The name-family check also covers the account: _NAME_ATTRS gains
      aws_organizations_account name and _FIXED_NAMES gains "SIT", with a red case for an account name outside both.
  # ------------------------------------------------------------ PR 3: bookkeeping
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      PR 3, only after step 9 posted step 8's read-back: T2.57 c11 flips met (met_by sit-account) in the bookkeeping
      walk, on that posted post-deploy evidence. PR 3 declares the plan and carries 'Resolves: rec-5064', so the rec
      closes only once SIT is proven, never at PR 2's merge.
bundled_recommendations: [rec-5064]
followon_recs: []
infrastructure_dependencies:
  - "terraform/organization applied (rec-5026, merge ae53954b, step 7 read-back on PR 2296): the Organization with centralized root access, the sit OU with the baseline SCP attached, OrganizationAdmin and its CloudShell lane."
  - "Two operator sittings of terraform/organization in AWS CloudShell, as org-admin-operator switched to role OrganizationAdmin (Decision 256 cl.3, Decision 252 cl.7 and its 2026-11-20 Update), one each for PR 1 and PR 2, each after its pre-merge plan block. One at a time project-wide. PR 3 has no apply."
  - "The SIT root e-mail: a company mailbox never used for any AWS account and receiving mail. After PR 1's apply and before PR 2's pre-merge block, the operator's step 4 block appends it to the SecureString /secret/agent-platform-terraform-organization-tfvars as sit_account_email = \"...\" (a new parameter Version), typed at a prompt that does not echo it."
  - "Running cost: $0 a month (an empty account; IAM, Organizations, SSM standard parameters and root sessions cost nothing). Every sitting fires the foundation's role-switch alarm, and PR 1's apply also fires the policy-change alarm, by design. PR 2's sitting, step 4's PutParameter and step 8's AssumeRoot fire no alarm of their own; each sits inside an alarmed role switch."
acceptance_criteria:
  - "rec-5064's acceptance node tests/checks/iam_tf/test_organization_baseline.py::test_sit_account_in_sit_ou_without_close_on_deletion passes, with every other case in the three organization test files (step 1)."
  - "After PR 1's apply (step 7): OPS_NEW_SIDS reads AccountCreate RootAudit TfvarsWrite, MOVE_ACCOUNT True, ROOT_AUDIT_TASK the IAMAuditRootUserCredentials ARN, SIT_ACCOUNTS 0 and ORG_PLAN_EXIT 0."
  - "After PR 2's apply (steps 7 and 8): SIT_ACCOUNTS 1 and ORG_PLAN_EXIT 0. Step 8 then reads STATE ACTIVE, PARENT_OU sit, OU_POLICIES FullAWSAccess baseline, ACCOUNT_POLICIES FullAWSAccess, ROOT_FEATURES RootCredentialsManagement RootSessions, and ROOT_LOGIN_PROFILE 0, ROOT_ACCESS_KEYS 0 and ROOT_SIGNING_CERTS 0, with ROOT_PASSWORD 0 (or None only when ROOT_LOGIN_PROFILE reads 0)."
  - "PR 2's step 7 block is posted only after the operator's own words naming the SIT account's creation, and step 9's comment on PR 2 quotes that message's id."
  - "rec-5064 reads closed by PR 3's Resolves trailer, and T2.57 c11 reads met; both happen only after step 9 has posted step 8's lines."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The three organization text suites (rec-5064's acceptance node first; the PR 2 cases are red until PR 2 lands)
      plus the guards that sweep every root: the trail-write grant scan, the session-user ban, lock coherence and
      readonly, and the admin-root gate's own tests.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_organization_baseline.py tests/checks/iam_tf/test_organization_admin_grant.py tests/checks/iam_tf/test_organization_alarms.py tests/checks/iam_tf/test_cloudtrail_write_grant_scoped.py tests/checks/iam_tf/test_agent_session_user.py tests/checks/iam_tf/test_validate_terraform_lock_coherence.py tests/validate/test_terraform_lock_readonly.py tests/checks/verification/test_validate_admin_root_premerge_gate.py -q
    expected: exit 0 on each PR's head.
    fix_if: a case fails on the real tree -- fix the HCL or template, never the assertion (Decision 235); a node needing more than the scope rows is a plan defect
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: The graduated shard organization-baseline is kept unchanged (its node is the whole test_organization_baseline.py, so the new acceptance node runs inside it in both tiers); the admin-grant file and the sweep guards are standing suites in both tiers.
  - step: 2
    phase: pre-deploy
    action: >-
      Credential-free init, validate and fmt of the root, then the fast tier in the edit loop. Before each PR's handoff,
      the full tier runs backgrounded with a 2 h limit from the top-level session, read with validation_result
      --verify-head. Not hermetic: the pr-validate runner has no terraform binary.
    command: >-
      TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir=terraform/organization init -backend=false -input=false -lockfile=readonly > /dev/null && terraform -chdir=terraform/organization validate -no-color && terraform fmt -check -recursive terraform/organization &&
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      exit 0; validate prints "Success! The configuration is valid."; fmt lists nothing; the fast tier passes; the
      full tier passes and --verify-head exits 0 for HEAD.
    fix_if: validate names an attribute -- fix the HCL; init refuses the lock -- the change needs no provider change, so read why rather than update the lock
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The terraform-validate job runs init, validate and fmt on every _TERRAFORM_ROOTS member in CI.
  - step: 3
    phase: pre-deploy
    action: >-
      PR 1 and PR 2 do not declare the plan, so CI's scope check does not run on them. Run validate_scope_boundary
      through its plan_paths seam on each of their branches.
    command: >-
      bin/venv-python -c "from scripts.checks.verification.validate_scope_boundary import validate_scope_boundary as v; f=[]; v(f, plan_paths=['docs/plans/PLAN-sit-account.yaml']); print('SCOPE_FAILS', len(f)); raise SystemExit(1 if f else 0)"
    expected: SCOPE_FAILS 0 and exit 0.
    fix_if: a touched path is outside scope -- drop it from that PR, or it is a plan defect (amendment)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: It binds this plan's path and the two non-declaring branches only; validate_scope_boundary is already a standing check for declaring PRs, which PR 3 is.
  - step: 4
    phase: pre-deploy
    action: >-
      OPERATOR STEP for PR 2, after step 9 posted PR 1's step 7 lines (TfvarsWrite is live) and before PR 2's step 5
      block. The operator first confirms in words (always_ask) that the SIT mailbox is a company mailbox never used for
      any AWS account, and that it receives mail. The build announces the sitting in the thread (the role switch;
      terraform/organization/CLAUDE.md), writes config/aws-region's value in (BLOCK_NOT_FILLED otherwise) and posts
      this block, pasted into CloudShell in the OrganizationAdmin role session. It checks the identity and reads the
      tfvars. If sit_account_email is already a key it prints SIT_EMAIL_ALREADY_SET and writes nothing. Otherwise it
      asks for the address at a prompt that does not echo it (read -rs, so it reaches neither the screen nor the shell
      history), refuses anything but one lowercase address of letters, digits and ._+- (SIT_EMAIL_REJECTED), appends
      sit_account_email = "<address>" to the value in a file only the operator can read, and writes it back as a
      SecureString with put-parameter --overwrite (TFVARS_WRITE_FAILED otherwise). It then prints TFVARS_VERSION and
      SIT_EMAIL_KEY, never the value. The parameter is taken to use the default aws/ssm key, as a console-created
      SecureString does (inferred). An EXIT trap deletes the file; errors go to ${TMPDIR:-/tmp}/sit-email.err, read in
      CloudShell only. The paste is the direction.
    command: >-
      ( set -o pipefail; umask 077; export LC_ALL=C; R=__REGION__; case "$R" in *__*) echo BLOCK_NOT_FILLED; exit 1 ;; esac; unset AWS_PROFILE; export AWS_REGION="$R" AWS_DEFAULT_REGION="$R";
      N=/secret/agent-platform-terraform-organization-tfvars; W="${TMPDIR:-/tmp}/sit-email"; L="${TMPDIR:-/tmp}/sit-email.err"; rm -rf "$W"; mkdir -p "$W"; : > "$L"; trap 'rm -rf "$W"' EXIT;
      printf 'caller-arn check: '; case "$(aws sts get-caller-identity --query Arn --output text 2>> "$L")" in *:assumed-role/OrganizationAdmin/*) echo ADMIN_CHAIN_OK ;; *) echo ADMIN_CHAIN_ABSENT; exit 1 ;; esac;
      V=$(aws ssm get-parameter --name $N --with-decryption --query Parameter.Value --output text 2>> "$L") && test -n "$V" || { echo TFVARS_READ_FAILED; exit 1; };
      if printf '%s\n' "$V" | grep -q '^[[:space:]]*sit_account_email[[:space:]]*='; then echo SIT_EMAIL_ALREADY_SET; else
      read -rs -p 'SIT root e-mail (not shown): ' E; echo; case "$E" in ''|*[!a-z0-9._+@-]*|*@*@*) echo SIT_EMAIL_REJECTED; exit 1 ;; ?*@?*.?*) ;; *) echo SIT_EMAIL_REJECTED; exit 1 ;; esac;
      printf '%s\nsit_account_email = "%s"\n' "$V" "$E" > "$W/new.tfvars"; unset E;
      aws ssm put-parameter --name $N --type SecureString --overwrite --value "file://$W/new.tfvars" > /dev/null 2>> "$L" || { echo TFVARS_WRITE_FAILED; exit 1; }; echo SIT_EMAIL_WRITTEN; fi; unset V;
      echo "TFVARS_VERSION $(aws ssm get-parameter --name $N --query Parameter.Version --output text 2>> "$L")";
      echo "SIT_EMAIL_KEY $(aws ssm get-parameter --name $N --with-decryption --query Parameter.Value --output text 2>> "$L" | grep -c '^[[:space:]]*sit_account_email[[:space:]]*=')" )
    expected: >-
      The operator's words for the mailbox, then caller-arn check: ADMIN_CHAIN_OK, SIT_EMAIL_WRITTEN (or
      SIT_EMAIL_ALREADY_SET on a re-paste), TFVARS_VERSION <n> and SIT_EMAIL_KEY 1. Step 5 then prints the same
      SIT_EMAIL_KEY and TFVARS_VERSION. The operator sends the lines to the build thread.
    fix_if: >-
      BLOCK_NOT_FILLED -- the build re-posts it filled; ADMIN_CHAIN_ABSENT -- switch role and reopen CloudShell in the
      role; SIT_EMAIL_REJECTED -- nothing was written: re-paste and type the address in lowercase; TFVARS_READ_FAILED or
      TFVARS_WRITE_FAILED -- read ${TMPDIR:-/tmp}/sit-email.err in CloudShell: an AccessDenied on ssm or kms is a grant
      defect (STOP, report; the parameter may use another key); SIT_EMAIL_KEY 2 or more -- STOP, the key is duplicated;
      SIT_EMAIL_ALREADY_SET on the first paste -- STOP, report: a key the operator did not write is there, and this
      block never prints or replaces it
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: >-
      OPERATOR STEP, PRE-MERGE GATE (ADMIN) and ENVIRONMENT CHECK (deploy-paths.yaml pre_merge_live_plan) for PR 1 and
      for PR 2, at each PR's CI-green head. The operator pastes one block into CloudShell in the OrganizationAdmin role
      session. It is the foundation's step 5 block without the state-bucket and metric-filter parts. The build announces
      the sitting in the thread first (the role switch; terraform/organization/CLAUDE.md) and writes the head sha in
      (BLOCK_NOT_FILLED otherwise). In order, it:
      - checks the identity and prints caller-arn check: ADMIN_CHAIN_OK only for an assumed-role/OrganizationAdmin/ session;
      - fetches the head into ${TMPDIR:-/tmp} and installs config/terraform-version's terraform, checked against
        HashiCorp's SHA256SUMS;
      - reads the tfvars at their current Version and prints TFVARS_VERSION, SIT_EMAIL_KEY (a count, never the value),
        SIT_ACCOUNTS (how many accounts are named SIT) and ROOT_TREE;
      - inits with -lockfile=readonly and prints AWS_PROVIDER;
      - plans with -lock=false to a saved file and prints COUNTS by action and type, CHANGED (the attribute names of each
        update), ADDED_SIDS and REMOVED_SIDS (the Sid names an inline policy update adds or drops, names only) and
        PLAN_DIGEST (sha256 of the sorted action and address lines);
      - prints EXIT and HEAD.
      An EXIT trap deletes the clone, tfvars and plan. Terraform errors go to ${TMPDIR:-/tmp}/sit-pre-tf.err, read in
      CloudShell only. The paste is the direction (Decision 126 cl.1, Decision 256 cl.3).
    command: >-
      ( set -o pipefail; H=__PR_HEAD_SHA__; case "$H" in *__*) echo BLOCK_NOT_FILLED; exit 1 ;; esac; W="${TMPDIR:-/tmp}/sit-pre"; L="${TMPDIR:-/tmp}/sit-pre-tf.err";
      rm -rf "$W"; mkdir -p "$W/bin" "$W/plugins"; : > "$L"; trap 'rm -rf "$W"' EXIT; unset AWS_PROFILE;
      printf 'caller-arn check: '; case "$(aws sts get-caller-identity --query Arn --output text 2>> "$L")" in *:assumed-role/OrganizationAdmin/*) echo ADMIN_CHAIN_OK ;; *) echo ADMIN_CHAIN_ABSENT; exit 1 ;; esac;
      { git init -q "$W/repo" && git -C "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git "$H" && git -C "$W/repo" checkout -q --detach FETCH_HEAD; } 2>> "$L" || { echo CLONE_FAILED; exit 1; };
      R=$(tr -d '[:space:]' < "$W/repo/config/aws-region"); export AWS_REGION="$R" AWS_DEFAULT_REGION="$R" TF_DATA_DIR="$W/tfdata" TF_PLUGIN_CACHE_DIR="$W/plugins" CHECKPOINT_DISABLE=1;
      V=$(tr -d '[:space:]' < "$W/repo/config/terraform-version"); case "$(uname -m)" in x86_64) P=linux_amd64 ;; aarch64) P=linux_arm64 ;; *) echo UNSUPPORTED_ARCH; exit 1 ;; esac; Z="terraform_${V}_${P}.zip";
      { curl -fsSL -o "$W/$Z" "https://releases.hashicorp.com/terraform/$V/$Z" && curl -fsSL -o "$W/sums" "https://releases.hashicorp.com/terraform/$V/terraform_${V}_SHA256SUMS" &&
      ( cd "$W" && grep " $Z\$" sums | sha256sum -c --quiet - ) && unzip -qo "$W/$Z" -d "$W/bin"; } >> "$L" 2>&1 || { echo TERRAFORM_INSTALL_FAILED; exit 1; }; export PATH="$W/bin:$PATH"; echo "TF_VERSION $V";
      N=/secret/agent-platform-terraform-organization-tfvars; aws ssm get-parameter --name $N --with-decryption --output json 2>> "$L" | python3 -c "import json,sys; p=json.load(sys.stdin)['Parameter']; open(sys.argv[1], 'w').write(p['Value'] + '\n'); print('TFVARS_VERSION', p['Version'])" "$W/vars.tfvars" 2>> "$L"; test -s "$W/vars.tfvars" || { echo TFVARS_ABSENT; exit 1; };
      echo "SIT_EMAIL_KEY $(grep -c '^[[:space:]]*sit_account_email[[:space:]]*=' "$W/vars.tfvars")"; echo "SIT_ACCOUNTS $(aws organizations list-accounts --query "length(Accounts[?Name=='SIT'])" --output text 2>> "$L")";
      echo "ROOT_TREE $(git -C "$W/repo" rev-parse HEAD:terraform/organization)"; O="$W/repo/terraform/organization";
      terraform -chdir="$O" init -input=false -lockfile=readonly -backend-config="region=$R" > /dev/null 2>> "$L" || { echo INIT_FAILED; exit 1; };
      terraform -chdir="$O" version -json | python3 -c "import json,sys; print('AWS_PROVIDER', json.load(sys.stdin)['provider_selections'].get('registry.terraform.io/hashicorp/aws'))";
      terraform -chdir="$O" plan -input=false -no-color -lock=false -detailed-exitcode -var-file="$W/vars.tfvars" -out="$W/p.bin" > /dev/null 2>> "$L"; rc=$?;
      terraform -chdir="$O" show -json "$W/p.bin" > "$W/p.json" 2>> "$L"; python3 -c "import json,sys,collections,hashlib; rc=[r for r in json.load(open(sys.argv[1])).get('resource_changes', []) if r['change']['actions'] != ['no-op'] or r['change'].get('importing')]; k=lambda r: ('import ' if r['change'].get('importing') else '') + '+'.join(r['change']['actions']); d=lambda ch: sorted(x for x in set(ch.get('before') or {}) | set(ch.get('after') or {}) if (ch.get('before') or {}).get(x) != (ch.get('after') or {}).get(x)); print('COUNTS', dict(sorted(collections.Counter(k(r) + ' ' + r['type'] for r in rc).items()))); print('CHANGED', [(r['address'], d(r['change'])) for r in rc if 'update' in r['change']['actions']]); sids=lambda v: {x.get('Sid') for x in json.loads(v)['Statement']} if v else set(); pol=[(sids((r['change'].get('before') or {}).get('policy')), sids((r['change'].get('after') or {}).get('policy'))) for r in rc if r['type'] == 'aws_iam_role_policy' and 'update' in r['change']['actions']]; print('ADDED_SIDS', sorted(set().union(*[a - b for b, a in pol]))); print('REMOVED_SIDS', sorted(set().union(*[b - a for b, a in pol]))); print('PLAN_DIGEST', hashlib.sha256('\n'.join(sorted(k(r) + ' ' + r['address'] for r in rc)).encode()).hexdigest())" "$W/p.json" 2>> "$L";
      echo "EXIT $rc"; echo "HEAD $H" )
    expected: >-
      caller-arn check: ADMIN_CHAIN_OK, TF_VERSION <config/terraform-version>, TFVARS_VERSION <n>, SIT_ACCOUNTS 0,
      ROOT_TREE <hash>, AWS_PROVIDER 5.100.0 (the committed lock), PLAN_DIGEST <hex>, EXIT 2 and HEAD <head sha>. PR 1: COUNTS
      {'update aws_iam_role_policy': 1}, CHANGED [('aws_iam_role_policy.organization_admin_ops', ['policy'])],
      ADDED_SIDS ['AccountCreate', 'RootAudit', 'TfvarsWrite'] and REMOVED_SIDS [] (SIT_EMAIL_KEY is not gated for PR 1). PR 2:
      SIT_EMAIL_KEY 1, COUNTS {'create aws_organizations_account': 1}, CHANGED [], ADDED_SIDS [] and REMOVED_SIDS
      []. Nothing to destroy or
      replace in either. The operator sends the printed lines to the build thread.
    fix_if: >-
      BLOCK_NOT_FILLED -- the build re-posts it filled; ADMIN_CHAIN_ABSENT -- switch role and reopen CloudShell in the
      role; SIT_ACCOUNTS not 0 -- an account named SIT already exists outside state: STOP, the import recovery in
      context, never a second create; AWS_PROVIDER not 5.100.0 -- STOP, the lock moved: re-read account.go at that
      version before PR 2; any other address, a destroy or a replace -- STOP and report; INIT_FAILED, EXIT 1 or any
      *_FAILED / TFVARS_ABSENT -- read ${TMPDIR:-/tmp}/sit-pre-tf.err in CloudShell, fix and re-paste; a new head re-runs
      this step
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      The build session, after the operator has sent step 5's lines. It checks them against step 5's expected lines,
      confirms the counts against the PR head's diff, and posts a counts-only comment on the PR with the head sha:
      COUNTS, CHANGED, ADDED_SIDS, REMOVED_SIDS, SIT_ACCOUNTS, EXIT and the four pins (PLAN_DIGEST, ROOT_TREE, TFVARS_VERSION, TF_VERSION),
      labelled operator-reported from the operator's CloudShell. No AWS credential is used.
    command: >-
      mcp__github__pull_request_read(method="get", owner="otl-labs", repo="ontheloop", pullNumber=<PR>) -> head sha equals
      the HEAD line (after a TREE_MISMATCH re-run of step 5 at the merge sha, HEAD equals that merge sha instead); then mcp__github__add_issue_comment on the PR with the lines above
    expected: Every line matches step 5's expected, compared with whitespace collapsed (text output joins lists with tabs); HEAD equals the PR's current head sha; the comment carries names, counts, hashes and shas only.
    fix_if: a line differs -- do not post success; report the exact line to the operator; HEAD differs from the current head (or from the merge sha on a TREE_MISMATCH re-run) -- step 5 is re-posted for the right sha
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      OPERATOR STEP after each merge: one block pasted into CloudShell in the OrganizationAdmin role session. It is the
      foundation's step 7 block, with a read-back for this plan. Before posting it the build:
      - announces the sitting in the thread (the role switch, and for PR 1 the policy write and its alarm;
        terraform/organization/CLAUDE.md);
      - writes in the merge sha and step 6's four pins;
      - checks locally that git rev-parse <merge sha>:terraform/organization equals ROOT_TREE;
      - for PR 2, posts it only after the operator's own words naming the SIT account's creation (an approve line or a
        paste of an earlier block does not cover it).
      In CloudShell the block repeats step 5's identity check, fetch and install. It refuses a different root tree
      (TREE_MISMATCH), terraform version (TF_VERSION_CHANGED) or tfvars Version (TFVARS_VERSION_CHANGED), and reads
      the tfvars at exactly that Version. It refuses to go on (SIT_PRESENT_BEFORE_APPLY) unless no account is named SIT
      and no account creation is running, which holds for PR 1 and PR 2 and stops a re-paste after a timed-out create;
      the recovery blocks, which expect SIT to exist, carry no such guard. It inits with -lockfile=readonly and plans with the state lock to a saved
      file. It applies that file only when the plan exit is 2 and its PLAN_DIGEST equals step 6's, then re-plans and
      reads back OPS_NEW_SIDS, MOVE_ACCOUNT, ROOT_AUDIT_TASK, SIT_ACCOUNTS and CREATE_IN_PROGRESS (a count of account creations still running). Otherwise it prints APPLY_SKIPPED with
      COUNTS. Errors go to ${TMPDIR:-/tmp}/sit-merge-tf.err, read in CloudShell only. No approve line is asked; the paste
      is the direction.
    command: >-
      ( set -o pipefail; M=__MERGE_SHA__; XD=__PLAN_DIGEST__; XT=__ROOT_TREE__; XV=__TFVARS_VERSION__; XF=__TF_VERSION__; case "$M$XD$XT$XV$XF" in *__*) echo BLOCK_NOT_FILLED; exit 1 ;; esac;
      W="${TMPDIR:-/tmp}/sit-merge"; L="${TMPDIR:-/tmp}/sit-merge-tf.err"; rm -rf "$W"; mkdir -p "$W/bin" "$W/plugins"; : > "$L"; trap 'rm -rf "$W"' EXIT; unset AWS_PROFILE;
      printf 'caller-arn check: '; case "$(aws sts get-caller-identity --query Arn --output text 2>> "$L")" in *:assumed-role/OrganizationAdmin/*) echo ADMIN_CHAIN_OK ;; *) echo ADMIN_CHAIN_ABSENT; exit 1 ;; esac;
      { git init -q "$W/repo" && git -C "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git "$M" && git -C "$W/repo" checkout -q --detach FETCH_HEAD; } 2>> "$L" || { echo CLONE_FAILED; exit 1; };
      [ "$(git -C "$W/repo" rev-parse HEAD:terraform/organization)" = "$XT" ] || { echo TREE_MISMATCH; exit 1; };
      R=$(tr -d '[:space:]' < "$W/repo/config/aws-region"); export AWS_REGION="$R" AWS_DEFAULT_REGION="$R" TF_DATA_DIR="$W/tfdata" TF_PLUGIN_CACHE_DIR="$W/plugins" CHECKPOINT_DISABLE=1;
      V=$(tr -d '[:space:]' < "$W/repo/config/terraform-version"); [ "$V" = "$XF" ] || { echo TF_VERSION_CHANGED; exit 1; }; case "$(uname -m)" in x86_64) P=linux_amd64 ;; aarch64) P=linux_arm64 ;; *) echo UNSUPPORTED_ARCH; exit 1 ;; esac; Z="terraform_${V}_${P}.zip";
      { curl -fsSL -o "$W/$Z" "https://releases.hashicorp.com/terraform/$V/$Z" && curl -fsSL -o "$W/sums" "https://releases.hashicorp.com/terraform/$V/terraform_${V}_SHA256SUMS" &&
      ( cd "$W" && grep " $Z\$" sums | sha256sum -c --quiet - ) && unzip -qo "$W/$Z" -d "$W/bin"; } >> "$L" 2>&1 || { echo TERRAFORM_INSTALL_FAILED; exit 1; }; export PATH="$W/bin:$PATH";
      N=/secret/agent-platform-terraform-organization-tfvars; [ "$(aws ssm get-parameter --name $N --query Parameter.Version --output text 2>> "$L")" = "$XV" ] || { echo TFVARS_VERSION_CHANGED; exit 1; };
      aws ssm get-parameter --name "$N:$XV" --with-decryption --query Parameter.Value --output text > "$W/vars.tfvars" 2>> "$L" && test -s "$W/vars.tfvars" || { echo TFVARS_ABSENT; exit 1; }; O="$W/repo/terraform/organization";
      PRE=$(aws organizations list-accounts --query "length(Accounts[?Name=='SIT'])" --output text 2>> "$L") || { echo SIT_READ_FAILED; exit 1; }; IP=$(aws organizations list-create-account-status --states IN_PROGRESS --query 'length(CreateAccountStatuses)' --output text 2>> "$L") || { echo CREATE_STATUS_READ_FAILED; exit 1; }; [ "$PRE" = 0 ] && [ "$IP" = 0 ] || { echo "SIT_PRESENT_BEFORE_APPLY $PRE $IP"; exit 1; };
      terraform -chdir="$O" init -input=false -lockfile=readonly -backend-config="region=$R" > /dev/null 2>> "$L" || { echo INIT_FAILED; exit 1; };
      terraform -chdir="$O" plan -input=false -no-color -detailed-exitcode -var-file="$W/vars.tfvars" -out="$W/merge.bin" > /dev/null 2>> "$L"; rc=$?; echo "MERGE_PLAN_EXIT $rc";
      D=$(terraform -chdir="$O" show -json "$W/merge.bin" 2>> "$L" | python3 -c "import json,sys,hashlib; rc=[r for r in json.load(sys.stdin).get('resource_changes', []) if r['change']['actions'] != ['no-op'] or r['change'].get('importing')]; k=lambda r: ('import ' if r['change'].get('importing') else '') + '+'.join(r['change']['actions']); print(hashlib.sha256('\n'.join(sorted(k(r) + ' ' + r['address'] for r in rc)).encode()).hexdigest())" 2>> "$L");
