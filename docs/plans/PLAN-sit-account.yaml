      echo "OPS_NEW_SIDS $($Q "PolicyDocument.Statement[?Sid=='AccountCreate' || Sid=='RootAudit' || Sid=='TfvarsWrite'].Sid")"; echo "MOVE_ACCOUNT $($Q "contains(PolicyDocument.Statement[?Sid=='OrgManage'].Action[], 'organizations:MoveAccount')")";
      echo "ROOT_AUDIT_TASK $($Q "PolicyDocument.Statement[?Sid=='RootAudit'].Condition.StringEquals.\"sts:TaskPolicyArn\"")"; echo "SIT_ACCOUNTS $(aws organizations list-accounts --query "length(Accounts[?Name=='SIT'])" --output text)"; echo "CREATE_IN_PROGRESS $(aws organizations list-create-account-status --states IN_PROGRESS --query 'length(CreateAccountStatuses)' --output text)"; } 2>> "$L";
      else echo APPLY_SKIPPED; [ "$rc" = 2 ] && terraform -chdir="$O" show -json "$W/merge.bin" 2>> "$L" | python3 -c "import json,sys,collections; rc=json.load(sys.stdin).get('resource_changes', []); print('COUNTS', dict(sorted(collections.Counter(('import ' if r['change'].get('importing') else '') + '+'.join(r['change']['actions']) + ' ' + r['type'] for r in rc if r['change']['actions'] != ['no-op'] or r['change'].get('importing')).items())))" 2>> "$L"; fi; echo "MERGE_SHA $M" )
    expected: >-
      caller-arn check: ADMIN_CHAIN_OK, MERGE_PLAN_EXIT 2, "Apply complete!" with step 5's counts, APPLY_EXIT 0,
      ORG_PLAN_EXIT 0, OPS_NEW_SIDS AccountCreate RootAudit TfvarsWrite (any order), MOVE_ACCOUNT True, ROOT_AUDIT_TASK
      arn:aws:iam::aws:policy/root-task/IAMAuditRootUserCredentials and MERGE_SHA <merge sha>. SIT_ACCOUNTS is 0 after
