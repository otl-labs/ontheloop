rollback: >-
  PR 1 is reversible: a revert PR with its own steps 5 and 7, whose plan is one in-place update of OrganizationAdminOps
  (the four additions leave). After PR 2, SIT exists and only the operator can close it, with a 90-day
  suspension. prevent_destroy and close_on_deletion false stop a revert from attempting that, and removal from state
  is a removed block with destroy = false. Undoing billing DENY means replacing it in the console: it needs a root
  password created through a root session (IAMCreateRootUserPassword) and a temporary detach of the sit OU's
  baseline so the root can sign in. Both are the operator's alone.
