  - "Provider fact (hashicorp/aws v5.100.0, the committed lock; internal/service/organizations/account.go read 2026-11-21). CreateAccount, with default_tags as account tags, is followed by DescribeCreateAccountStatus polling (create timeout 10 min), d.SetId, then ListParents and MoveAccount when parent_id differs. So SIT sits seconds in the root under FullAWSAccess, with no credentials and no workload, and a failed move leaves the account tainted in state. Only FinalizingOrganizationException is retried, never AccessDenied, which is why the grant is applied and read back first. email, role_name and iam_user_access_to_billing are ForceNew; name is updated in place through account:PutAccountName, which is not granted. The read still sets the computed status from the retired Account Status (an empty value, no diff)."
