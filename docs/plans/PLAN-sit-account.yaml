constraints:
  - "One admin act at a time across the project: no organization sitting beside any other admin apply, and PR 2 only after step 9 posted PR 1's step 7 lines."
  - "PR 2's step 7 block is posted only after the operator's own words naming the SIT account's creation (irreversible). An approve line or the paste of an earlier block does not cover it."
  - "No agent session holds or uses a management-account credential (Decision 256 cl.3). Every AWS call is in a block the operator pastes; the build session reads only GitHub and the rec warehouse."
  - "Never print or commit an account id, e-mail, credential or a rendered policy (Decision 101, Decision 239). Blocks print names, states, counts, booleans, hashes and shas only. SIT's id and the root-session credentials live in shell variables inside one subshell, and error files are read in CloudShell only."
  - "Never apply a plan that replaces or destroys aws_organizations_account.sit. Closing or removing an account is the operator's alone, and OrganizationAdmin holds no CloseAccount or RemoveAccountFromOrganization."
  - "No rescue agents or workaround loops (Decision 55); a block that prints an unexpected line stops, and is never re-pasted without a fresh read of the cause."
