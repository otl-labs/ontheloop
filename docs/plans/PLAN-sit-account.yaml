      planned: read ${TMPDIR:-/tmp}/sit-merge-tf.err in CloudShell, fix and re-paste; SIT_PRESENT_BEFORE_APPLY -- nothing
      was planned or applied:
      STOP, an account named SIT exists or a create is running, so read step 8's block and take the matching recovery,
      never a create; TREE_MISMATCH, TF_VERSION_CHANGED or TFVARS_VERSION_CHANGED --
      nothing was planned: step 5 re-runs at the merge sha and the build re-posts this block with the new pins;
      APPLY_SKIPPED -- nothing was applied: send COUNTS too, the build reports the difference as a plan defect, never a
      second paste; APPLY_EXIT not 0 on PR 1 -- STOP, read ${TMPDIR:-/tmp}/sit-merge-tf.err in CloudShell and report
      (PR 2 does not start); APPLY_EXIT not 0 on PR 2 with SIT_ACCOUNTS 0, CREATE_IN_PROGRESS 0 and a FailureReason
      in the err file (for example EMAIL_ALREADY_EXISTS or an account limit) -- CreateAccount failed and created
      nothing: STOP and report, the operator decides; APPLY_EXIT not 0 on PR 2 with CREATE_IN_PROGRESS above 0 or a
      timeout in the err file -- the create may still finish outside state: STOP and report, and the operator decides.
      They may re-paste step 8's read-only block until it reads STATE ACTIVE, or SIT_ABSENT with CREATE_IN_PROGRESS 0;
      recovery (2) runs only on their direction if the account exists. Step 7 is never re-pasted to retry a create
      without the operator's fresh words naming it; any other PR 2 combination -- STOP and report; APPLY_EXIT not 0 on PR 2 after the account exists (a move failure leaves it tainted in state, or it
      is missing from state) -- STOP, the operator reads ${TMPDIR:-/tmp}/sit-merge-tf.err in CloudShell only, and only
      the matching recovery in context runs on the operator's direction; ORG_PLAN_EXIT 2 after an apply -- STOP and
      report; never apply a plan that replaces or destroys aws_organizations_account.sit
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      OPERATOR STEP after PR 2's step 7. A read-only block pasted into CloudShell in the OrganizationAdmin role session,
      after the build announces the sitting in the thread (the role switch; terraform/organization/CLAUDE.md); the build
      writes config/aws-region's value in (BLOCK_NOT_FILLED otherwise). It reads SIT's id by name into a
      shell variable that is never printed, then reads from the management account:
      - STATE (the Account State field; Status is retired);
      - PARENT_OU (the parent's name) and OU_POLICIES;
      - ACCOUNT_POLICIES (the SCPs on the account itself);
      - ROOT_FEATURES.
      It then opens a 900-second root session into SIT with sts assume-root and the IAMAuditRootUserCredentials task
      policy, through the project region's STS endpoint (AssumeRoot refuses the global one). With those credentials,
      exported only inside the block's subshell, get-account-summary prints ROOT_PASSWORD, ROOT_ACCESS_KEYS,
      ROOT_SIGNING_CERTS and ROOT_MFA (AccountPasswordPresent, AccountAccessKeysPresent,
      AccountSigningCertificatesPresent, AccountMFAEnabled), and get-login-profile prints ROOT_LOGIN_PROFILE 0 on
      NoSuchEntity (no root password), a second read of the password that does not rest on the summary key.
      This is Decision 252 cl.7's read-back, not an out-of-Terraform act; the baseline's DenyRootUser exempts
      aws:AssumedRoot sessions. Errors go to ${TMPDIR:-/tmp}/sit-audit.err, read in CloudShell only. It may be re-pasted.
    command: >-
      ( set -o pipefail; R=__REGION__; case "$R" in *__*) echo BLOCK_NOT_FILLED; exit 1 ;; esac; export AWS_REGION="$R" AWS_DEFAULT_REGION="$R"; L="${TMPDIR:-/tmp}/sit-audit.err"; : > "$L"; unset AWS_PROFILE;
      printf 'caller-arn check: '; case "$(aws sts get-caller-identity --query Arn --output text 2>> "$L")" in *:assumed-role/OrganizationAdmin/*) echo ADMIN_CHAIN_OK ;; *) echo ADMIN_CHAIN_ABSENT; exit 1 ;; esac;
      echo "CREATE_IN_PROGRESS $(aws organizations list-create-account-status --states IN_PROGRESS --query 'length(CreateAccountStatuses)' --output text 2>> "$L")";
      A=$(aws organizations list-accounts --query "Accounts[?Name=='SIT'].Id" --output text 2>> "$L") || { echo SIT_READ_FAILED; exit 1; }; case "$A" in [0-9]*) ;; *) echo SIT_ABSENT; exit 1 ;; esac; case "$A" in *[!0-9]*) echo SIT_NOT_UNIQUE; exit 1 ;; esac;
      echo "STATE $(aws organizations describe-account --account-id "$A" --query Account.State --output text 2>> "$L")";
      read -r PT PI <<< "$(aws organizations list-parents --child-id "$A" --query 'Parents[0].[Type,Id]' --output text 2>> "$L")";
      if [ "$PT" = ORGANIZATIONAL_UNIT ]; then echo "PARENT_OU $(aws organizations describe-organizational-unit --organizational-unit-id "$PI" --query OrganizationalUnit.Name --output text 2>> "$L")"; echo "OU_POLICIES $(aws organizations list-policies-for-target --target-id "$PI" --filter SERVICE_CONTROL_POLICY --query 'sort(Policies[].Name)' --output text 2>> "$L")"; else echo "PARENT_OU $PT"; fi;
      echo "ACCOUNT_POLICIES $(aws organizations list-policies-for-target --target-id "$A" --filter SERVICE_CONTROL_POLICY --query 'sort(Policies[].Name)' --output text 2>> "$L")"; echo "ROOT_FEATURES $(aws iam list-organizations-features --query 'sort(EnabledFeatures)' --output text 2>> "$L")";
      read -r K S T <<< "$(aws sts assume-root --region "$R" --target-principal "$A" --task-policy-arn arn=arn:aws:iam::aws:policy/root-task/IAMAuditRootUserCredentials --duration-seconds 900 --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text 2>> "$L")"; test -n "$T" || { echo ASSUME_ROOT_FAILED; exit 1; };
      export AWS_ACCESS_KEY_ID="$K" AWS_SECRET_ACCESS_KEY="$S" AWS_SESSION_TOKEN="$T"; unset K S T A PI;
      aws iam get-account-summary --query 'SummaryMap.[AccountPasswordPresent,AccountAccessKeysPresent,AccountSigningCertificatesPresent,AccountMFAEnabled]' --output text 2>> "$L" | awk '{print "ROOT_PASSWORD " $1; print "ROOT_ACCESS_KEYS " $2; print "ROOT_SIGNING_CERTS " $3; print "ROOT_MFA " $4}';
      if aws iam get-login-profile > /dev/null 2> "${TMPDIR:-/tmp}/sit-lp.err"; then echo "ROOT_LOGIN_PROFILE 1"; elif grep -q NoSuchEntity "${TMPDIR:-/tmp}/sit-lp.err"; then echo "ROOT_LOGIN_PROFILE 0"; else cat "${TMPDIR:-/tmp}/sit-lp.err" >> "$L"; echo "ROOT_LOGIN_PROFILE error"; fi )
