schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: sit-decision
intent: >-
  Record the agreed SIT design (its own AWS account holding a reset copy of PROD; merges deploy to SIT; PROD receives
  only the identical artifact behind one human gate) in one Decision that ends the single-account-until-live_full rule,
  record the operator's 2026-11-09 move of the catalog to RDS PostgreSQL in a second, short Decision amending 214,
  align the environment taxonomy and the account inventory with it, and add two roadmap items whose criteria the later
  SIT items flip (rec-5024). Governed deploys keep a human gate outside the engine (NS.9).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-sit-decision.yaml
phase: >-
  T2.57 (created by this plan; closes T2.57:c1 and T2.57:c2). New items, so the Tier Item Freshness Gate has no prior
  state to check; T2.57 depends on T2.23 (complete) and T2.58 on T2.57.
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the sidecar blocks decision-new (two new Decisions, newest first: the catalog-on-RDS Decision above the
      SIT Decision) and decision-{24,73,77,126,144,202,214,237,242,249}-note (dated notes at each entry's end; 249's is
      an Update, the rest Amended-by pointers; 214's names the RDS Decision, the others the SIT Decision). At build the
      SIT Decision takes max existing + 1 and the RDS Decision max + 2; {{DATE}} = build date UTC.
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks taxonomy-rule (single_account_rule), taxonomy-conformance (the general_conformance
      multi-account line), taxonomy-tiers (axis_a SIT and PROD rows), taxonomy-note (mock_vs_real_note) and taxonomy-log
      (amendment_log row). No new axis_a row: the Organization and SIT bootstrap rows land with rec-5026 and rec-5027,
      together with protected-actions.yaml and deploy-paths.yaml (validate_admin_root_premerge_gate reads axis_a).
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks inventory-aws-01, inventory-aws-02 (target fields only) and inventory-log (one new
      amendment_log entry). No rows for accounts that do not exist yet; rec-5026 adds them with evidence.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Append tier items T2.57 and T2.58 after T2.56, exactly as execution step 3 gives them; T2.57's related_decisions
      carries the SIT Decision's number, T2.58's both new numbers.
  - file: tests/checks/decisions/test_sit_decision_records.py
    action: Create
    purpose: >-
      Pin the build's records, following tests/checks/decisions/test_secret_parameters_decision.py (tests.fixtures.
      decision_entry). Numbers come from the headings ('## Decision S: SIT is stood up now', '## Decision R: The DuckLake
      catalog moves to RDS'), never hard-coded. test_sit_and_rds_decisions_and_notes: R == S + 1; both entries within
      cap_bytes(); envelopes amends [24, 73, 77, 126, 144, 202, 237, 242] (S) and [107, 214] (R), kinds direction (S)
      and mechanism (R); the 214 and 107 notes read 'Amended by Decision R (' and the 84 note 'Decision R moves'; the
      24, 73, 77, 126, 144, 202, 237 and 242 notes read 'Amended by Decision S (' and the 249 note 'Decision S fires';
      no note cites the other number. test_account_rule_and_tier_gating: in environment-taxonomy.yaml
      single_account_rule (whitespace-normalised) contains "Only the SIT items of roadmap T2.57 and T2.58 author
      multi-account infrastructure" and "live_full is not a trigger"; no general_conformance item contains "do not
      author multi-account"; axis_a.SIT.apply_gating contains "deterministic guard" and axis_a.PROD.apply_gating starts
      "promote-only". test_sit_roadmap_items: T2.57 and T2.58 exist, T2.58 depends_on contains T2.57, every criterion
      text starts with a 'rec-NNNN:' prefix and no rec id leads two criteria, and T2.57 c1 and c2 read status met.
bundled_recommendations:
  - rec-5024
followon_recs: []
infrastructure_dependencies:
  - >-
    LAMBDA-DEPLOY DEFERRED (CD.16 / Decision 79), per-artifact reasoned disposition. compute_affected_artifacts(<this
    plan's scope>) returns {'data-pipeline': ['docs/ROADMAP-PLATFORM.yaml']}: the live roadmap is a packaged asset of the
    active data-pipeline artifact. No build, deploy or smoke test is owed: the change to that asset is data only (two new
    tier items; no packaged code), its sole runtime reader feeds raw text to a prompt behind a disabled schedule, and the
    asset refreshes with the artifact's next governed deploy. No other scope file is Lambda-packaged and no .tf file is
    in scope. Precedent: PLAN-work-graph-edge-model.
acceptance_criteria:
  - The build tree holds exactly the sidecar's words in the three bound files (approved_text verify exits 0).
  - rec-5024's acceptance command exits 0.
  - The three tests in tests/checks/decisions/test_sit_decision_records.py fail on main and pass on the build, binding each dated note to the right one of the two Decision numbers.
  - T2.57 and T2.58 validate under the roadmap schema; T2.57:c1 and c2 read met.
  - After merge, the decisions index holds both new Decisions (rec-autoclose backfill) and rec-5024 reads closed.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Pin both Decisions and their notes' numbers, the account rule, the tier gating and the roadmap items.
    command: bin/venv-python -m pytest tests/checks/decisions/test_sit_decision_records.py -q
    expected: exit 0, three tests passed
    fix_if: >-
      A note cites the wrong one of the two numbers, or a contract or roadmap string differs from the sidecar or step 3;
      fix the placement, never the sidecar
    hermetic: true
    expected_literals: ["3 passed"]
    graduation: waive
    graduation_waiver_reason: >-
      The new file is itself the standing guard and runs in every --pre pytest selection touching DECISIONS.md, the
      taxonomy or the roadmap; a registry row would duplicate it.
  - step: 2
    phase: pre-deploy
    action: Run rec-5024's own acceptance command.
    command: >-
      ! grep -q 'do not author multi-account' docs/contracts/environment-taxonomy.yaml && grep -qE '^## Decision
      [0-9]+: .*SIT' docs/DECISIONS.md && grep -qw SIT docs/ROADMAP-PLATFORM.yaml
    expected: exit 0
    fix_if: the old conformance line survives or the new Decision header is missing
    hermetic: true
    expected_literals: []
    graduation: waive
    graduation_waiver_reason: One-time grep on governance prose; step 1's test is the standing guard.
  - step: 3
    phase: pre-deploy
    action: Bind the edits to the approved words.
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug sit-decision --base origin/main
    expected: exit 0; every block matches with only {{N}} and {{DATE}} filled
    fix_if: any word differs; fix the edit, never the sidecar (operator-approved text)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      PR-relative to origin/main, so vacuous once merged; validate_merge_step's approved-text leg enforces the sidecar
      on every PR declaring this plan.
  - step: 4
    phase: pre-deploy
    action: >-
      Fast tier, then the full tier before handoff (handoff_policy), backgrounded with a 2 h limit from the top-level
      session.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: --pre exit 0; validation_result --verify-head exit 0 for HEAD
    fix_if: >-
      A failure in this plan's files: fix at root and rerun from the start. Decision size or glossary failures mean the
      placed text differs from the sidecar (the sidecar passed both at planning). A failure only in another open red is
      not this build's to fix; follow the implement skill's go/no-go.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: post-deploy
    action: Confirm both Decisions reached ops_decisions and rec-5024 closed.
    command: >-
      bin/venv-python -m scripts.sync.ops sync && grep -c "\"dec-$(grep -oE '^## Decision [0-9]+: SIT' docs/DECISIONS.md
      | grep -oE '[0-9]+')\"" logs/.decisions-index.jsonl && grep -c "\"dec-$(grep -oE '^## Decision [0-9]+: The DuckLake
      catalog moves' docs/DECISIONS.md | grep -oE '[0-9]+')\"" logs/.decisions-index.jsonl && bin/venv-python -c "from src.common.ducklake_reader_client
      import make_reader, fetch_recs_by_ids; print(fetch_recs_by_ids(make_reader(), ['rec-5024'])[0][0]['status'])"
    expected: two counts of at least 1, then closed
    fix_if: >-
      count 0: read the rec-autoclose run for the merge commit (its backfill step); rec still open: read the ci.yml
      closure job and close it through update_rec with the merge SHA.
    hermetic: false
test_obligations:
  - source: docs/DECISIONS.md
    behavior: Both Decisions land within the cap with their envelopes, and each dated note cites the right Decision number.
    verification_step: 1
    test_selector: tests/checks/decisions/test_sit_decision_records.py::test_sit_and_rds_decisions_and_notes
    red_green_expectation: red before (neither heading exists on main), green after.
  - source: docs/contracts/environment-taxonomy.yaml
    behavior: The account rule authorises only the SIT roadmap items; SIT auto-applies behind the guard; PROD is promote-only.
    verification_step: 1
    test_selector: tests/checks/decisions/test_sit_decision_records.py::test_account_rule_and_tier_gating
    red_green_expectation: red before (main keeps the single-account rule), green after.
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: T2.57 and T2.58 exist, T2.58 follows T2.57, each criterion leads with one rec, and T2.57 c1 and c2 read met.
    verification_step: 1
    test_selector: tests/checks/decisions/test_sit_decision_records.py::test_sit_roadmap_items
    red_green_expectation: red before (no T2.57), green after.
  - source: docs/contracts/account-credential-inventory.yaml
    behavior: AWS-01 and AWS-02 targets name the company Organization, word for word as approved.
    verification_step: 3
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug sit-decision --base origin/main
    waiver_reason: >-
      Two target strings and one log entry, prose only; no code reads these fields' wording, and approved_text verify
      binds every word to the operator-approved sidecar, so a pinning test would only duplicate that check.
constraints:
  - The DECISIONS.md, taxonomy and inventory words are operator-approved; place them exactly (sidecar), never re-word.
  - No infrastructure, IAM, workflow or code change; nothing is applied or deployed.
  - Merge only after rec-5023's spike result is in (execution step 1).
  - No rescue agents or workaround loops (Decision 55).
