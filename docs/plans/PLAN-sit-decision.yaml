  - "Catalog backend: the SIT Decision stays backend-neutral (catalog instance, catalog control-plane credential, copy port) and is at the 6,144-byte cap; the operator's RDS choice (2026-11-09, thread Decide between RDS and Neon; /mnt/project-files/rds-vs-neon/ FINDINGS.md and ROUND-2.md s7-9) is the second Decision. Its IAM (start/describe and stop on SIT's instance only) and spend land in rec-5027, rec-5028 and rec-4223, which this plan does not touch."
