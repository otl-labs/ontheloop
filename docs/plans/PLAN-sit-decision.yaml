gate_rounds:
  - {gate: decision-scout, round: 1, verdict: FLAGS_FOUND}
  - {gate: decision-scout, round: 2, verdict: FLAGS_FOUND}
  - {gate: wording-check, round: 1, verdict: PASS, digest: a1a750b60446843dfbfa915ec20b2f747fcf49b22ccb05a8f82bd693f7b3fed3, base: 75b7458e810f939c7096af11b3a25e325fe3bbb4, selection: complete}  # pragma: allowlist secret
  - {gate: plan-critique, round: 1, verdict: REVISE, blocking: 3, nits: 9}
  - {gate: wording-check, round: 2, verdict: PASS, digest: e4b19b39a3d5b558b27bbcbacc1af0fb682605306db5b0e52509dacfbdeb98ba, base: 75b7458e810f939c7096af11b3a25e325fe3bbb4, selection: complete}  # pragma: allowlist secret
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections (77, 144, 242, 249)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Precondition: rec-5023's result is in (its plan's build merged and its rec closed or its failure recorded). If the spike failed, T2.57:c2 still flips met (the result is recorded) and cl.4's fallback holds; stop only if the result contradicts other approved words (plan defect)."
  - "Place every sidecar block exactly (docs/plans/approved/sit-decision.yaml); the SIT Decision takes max Decision number + 1 and the RDS Decision + 2 (every {{N}} inside the RDS Decision and the 214 note is the RDS number), {{DATE}} = build date UTC; regenerate docs/decisions-index.json with the repo's generator."
  - |-
    docs/ROADMAP-PLATFORM.yaml: append these two items after T2.56, exactly, with {{N}} = the SIT Decision's number and
    {{N_RDS}} = the RDS Decision's number. Each later build flips its own criterion.
      - id: T2.57
        tier: T2
        name: SIT tier stood up
        intent: >-
          Forward intent only (Decision 86). SIT is stood up as its own AWS account under Decision {{N}}: a company
          Organization with a workload-free management account, today's account as PROD and a SIT member, every merge
          deploying to SIT, and a reset copy of PROD data in SIT behind the workload SCPs. Each criterion is flipped by the
          build of the rec it names.
        depends_on: [T2.23]
        exit_criteria:
          - {id: c1, text: "rec-5024: the SIT Decision is recorded with the taxonomy and inventory aligned to it.", status: met, met_by: sit-decision}
          - {id: c2, text: "rec-5023: the restore spike's result is recorded (a dump restores with data_path rewritten, or the fallback holds).", status: met, met_by: sit-restore-spike}
          - {id: c3, text: "rec-5025: the Terraform roots are account-portable (no literal bucket ARN, per-account names, backends and secret values).", status: open}
          - {id: c4, text: "rec-5026: the Organization, its management and SIT accounts, the baseline SCPs and the organisation trail exist.", status: open}
          - {id: c5, text: "rec-5027: SIT is bootstrapped (OIDC provider, CI and agent roles, SIT catalog instance, SIT secret values).", status: open}
          - {id: c6, text: "rec-5028: every merge deploys to SIT; PROD keeps today's gating until rec-5033.", status: open}
          - {id: c7, text: "rec-5029: the workload SCPs are attached and the pre-data checklist is green.", status: open}
          - {id: c8, text: "rec-5030: PROD data is replicated to SIT and reset on schedule.", status: open}
        related_decisions: [{{N}}]
        effort: XL
        strategic: false
        status: in_progress
      - id: T2.58
        tier: T2
        name: Promotion train and sandbox retirement
        intent: >-
          Forward intent only (Decision 86). On a standing SIT (T2.57): the PROD catalog moved to RDS (Decision {{N_RDS}}),
          catalog copies for risky changes, PROD promote-only behind one human gate, per-PR Lambda stacks, one OIDC repo
          list, and the sandbox label retired last (Decision {{N}}). Each criterion is flipped by the build of the rec it names.
        depends_on: [T2.57]
        exit_criteria:
          - {id: c1, text: "rec-4223: the PROD catalog has moved to RDS PostgreSQL after SIT rehearsed the restore.", status: open}
          - {id: c2, text: "rec-5031: catalog copies off SIT through the catalog port, with a TTL reaper, and copies never delete objects.", status: open}
          - {id: c3, text: "rec-5033: PROD receives only the artifact that ran on SIT, behind the fail-closed human gate.", status: open}
          - {id: c4, text: "rec-5032: per-PR Lambda stacks run from the shipped zip against a catalog copy.", status: open}
          - {id: c5, text: "rec-5034: one GitHub OIDC repo list serves both roots, trusted per account.", status: open}
          - {id: c6, text: "rec-5035: the sandbox label is retired from vocabulary, workflows and file names.", status: open}
        related_decisions: [{{N}}, {{N_RDS}}]
        effort: XL
        strategic: false
        status: not_started
  - "tests/checks/decisions/test_sit_decision_records.py: create the three tests named in scope; confirm each fails on main first."
  - "Execute Verification Plan steps 1-4; loop until pass; on an unrecoverable failure stop and send a plan-defect report (Decision 55)."
  - "The commit and the squash merge's commit_message carry 'Resolves: rec-5024' (git-ops.yaml resolves_trailer). After merge run step 5."
  - "Report: what was implemented, verification results, merge SHA, the Decision number."
rollback: Revert the squash commit; nothing was applied or deployed.
