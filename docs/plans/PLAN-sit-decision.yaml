  - "Evidence: /mnt/project-files/sit-decision/ (BRIEF, ADVICE, SCOUT-r1, PRESENTATION); itinerary /mnt/project-files/itinerary/ITINERARY.md."
  - "Decision-scout verdict FLAGS_FOUND (round 2, after the RDS Decision joined). CITE: Decisions 77, 144, 242, 249, 24, 237, 248, 223, 101, 246, 247, 86, 167, 177, 181, 214, 107, 84, 100, 212, 239. Decisions triaged: 202 of 202. Roadmap items intersected: 5; CONFLICT: 0; RELATED: 5. Serves: NS.9 4/5. Round 1: FLAGS_FOUND, 202 of 202, CONFLICT 0."
  - "Scout flags, all folded into the wording: D239 [WARN] (cl.5 keeps the masked-reader fence in SIT; operator fork 3); D73 [WARN] (73 in amends, cl.6); D77 [NOTE] (cl.6 names cl.3's rule); D126 [NOTE] (note; admin tier in cl.7); D202 [NOTE] (note; cl.8); D100 [NOTE] (cl.4 native primitives); D93 [SPIRIT] (cl.6 last sentence); T2.48 c6 [CITE]: its auto-apply track record moves to SIT once rec-5028 lands, recorded here, no criterion edit."
  - "Operator forks (presentation 2026-11-09), all answered and matched by the wording: admin-tier apply route with a SIT revisit condition (cl.7); plain Organizations (cl.2); transcripts copied unredacted under the Decision 239 fence as an accepted risk, masking later is rec-5043 (cl.5); SSE-S3, weekly plus pre-promotion reset, rehearsal deferred (cl.4, cl.9); company ownership and billing (cl.2). Approval run: approved-text-approval run 42666353785 (fingerprint planet-thunder-echo-bugle); the operator approves after critique PROCEED, before merge."
