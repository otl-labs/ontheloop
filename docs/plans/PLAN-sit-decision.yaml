  - "Size: the SIT entry measures 6,143 of 6,144 bytes under validate_decisions_size with 251 as its number; a three-digit number keeps it there, and the placed text must match the sidecar exactly."
  - "Sizes (plan_obligations 2026-11-09): environment-taxonomy.yaml 459 of 500 effective lines, about 462 placed (the wording check's --pre passed with it); the inventory 267 of 500; the roadmap's NEAR_CAP is the 500-line class default it is exempt from (ceiling 10,000, Decision 114), about 8,590 placed; the bundled-rec acceptance runner timed out (UNREACHABLE), and VP step 2 runs the same command."
