schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: sit-organization
intent: >-
  Stand up the company AWS Organization under the SIT Decision (rec-5026): a new workload-free management account with
  its own admin lane and trail, OUs for PROD and SIT carrying a baseline SCP, today's account invited in as PROD with
  that baseline attached one statement at a time, and an empty SIT account created last, straight into its OU. It is the
  second T2.57 item and the commitment point: an AWS account can only be closed, with a 90-day suspension.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-sit-organization.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-5026, which becomes T2.57 c4 once the rec-5024 build lands T2.57 in
  docs/ROADMAP-PLATFORM.yaml; the build re-reads that item at start.
scope:
  # ------------------------------------------------------------ PR 1: the root, its guards and the bound wording
  - file: terraform/organization/main.tf
    action: Create
    purpose: >-
      PR 1. terraform block (required_version >= 1.10, hashicorp/aws ~> 5.0 as terraform/bootstrap) with backend "s3"
      bucket agent-platform-organization-tfstate, key terraform.tfstate, encrypt, use_lockfile, no region (Decision 202
      cl.4; region at init by -backend-config). provider "aws" region = var.aws_region, profile = var.aws_profile,
      default_tags Project agent-platform, ManagedBy terraform-organization, Owner var.alerts_email. data
      aws_caller_identity for the management account id; no account id literal anywhere in the root (Decision 101).
  - file: terraform/organization/variables.tf
    action: Create
    purpose: >-
      PR 1. aws_region (default equal to config/aws-region, the one pinned literal), aws_profile (default
      agent_platform_admin_org), and no-default variables read from the gitignored terraform.organization.tfvars:
      prod_account_id (12-digit validation), prod_account_email, prod_breakglass_user_name, sit_account_email,
      alerts_email. Every e-mail and the break-glass name is sensitive. No ExternalId variable: the management key is
      held by one environment only.
  - file: terraform/organization/organization.tf
    action: Create
    purpose: >-
      PR 1. aws_organizations_organization (feature_set ALL, enabled_policy_types [SERVICE_CONTROL_POLICY],
      aws_service_access_principals []), with prevent_destroy; aws_organizations_organizational_unit prod and sit under
      the root, each with prevent_destroy. FullAWSAccess stays attached where AWS puts it.
  - file: terraform/organization/scps.tf
    action: Create
    purpose: >-
      PR 1. local.baseline_statements, a map of four statements keyed deny_leave_organization (Deny
      organizations:LeaveOrganization), deny_root_user (Deny * when aws:PrincipalArn is like arn:aws:iam::*:root),
      protect_cloudtrail (Deny the trail-mutation verbs cloudtrail:StopLogging, DeleteTrail, UpdateTrail,
      PutEventSelectors, PutInsightSelectors, CreateTrail and logs:DeleteLogGroup, DeleteMetricFilter,
      PutRetentionPolicy on log groups named platform-security-*, unless aws:PrincipalArn is like
      arn:aws:iam::*:role/PlatformAdmin or arn:aws:iam::*:user/${var.prod_breakglass_user_name}; reads are never
      denied, so the liveness probe and heartbeat canary keep reading) and deny_other_regions (Deny NotAction
      local.global_actions when aws:RequestedRegion is not var.aws_region). local.global_actions is AWS's published
      region-deny NotAction list (iam, organizations, sts, support, account, billing and the other global services)
      plus whatever step 6's lookback shows in use; sts:* is always in it. aws_organizations_policy baseline (all four
      statements) attached to the sit OU; aws_organizations_policy baseline_prod with only the statements named in
      local.prod_baseline_stages (empty in PR 1, so baseline_prod and its attachment use for_each over a one-element
      set that exists only while the list is non-empty) attached to the prod OU. Policy content via jsonencode; no
      conditional or comparison operator beyond for_each filtering. Rendered minified JSON of baseline stays under the
      5,120-character SCP limit.
  - file: terraform/organization/accounts.tf
    action: Create
    purpose: >-
      PR 1 creates the file with only a comment naming the PR 2 and PR 7 resources; PR 2 adds the PROD import (below);
      PR 7 adds the SIT account (below).
  - file: terraform/organization/state_bucket.tf
    action: Create
    purpose: >-
      PR 1. import block and aws_s3_bucket for agent-platform-organization-tfstate (created by step 7's CLI call,
      prevent_destroy), plus versioning Enabled, public-access block (all four true), SSE-S3 default encryption,
      ownership BucketOwnerEnforced and a bucket policy denying non-TLS access, each created by Terraform.
  - file: terraform/organization/management_admin.tf
    action: Create
    purpose: >-
      PR 1. import blocks plus aws_iam_user org-admin-agent, aws_iam_user_policy AssumeOrganizationAdmin (only
      sts:AssumeRole on the OrganizationAdmin role), aws_iam_role OrganizationAdmin (trust: that user only,
      max_session_duration 3600) and aws_iam_role_policy OrganizationAdminOps, all seeded by the operator in step 5
      from the same templates. Each policy and the trust document is try(templatefile("${path.module}/policies/<name>.json.tftpl",
      {...}), <a single explicit Deny * statement>) so a missing template fails closed. No aws_iam_access_key and no
      access-key verb anywhere (Decision 237: the key is minted out of band).
  - file: terraform/organization/policies/organization_admin.json.tftpl
    action: Create
    purpose: >-
      PR 1. OrganizationAdminOps, the narrow management grant: organizations Describe*/List* and CreateOrganization,
      EnablePolicyType, CreateOrganizationalUnit, UpdateOrganizationalUnit, CreatePolicy, UpdatePolicy, AttachPolicy,
      DetachPolicy, InviteAccountToOrganization, CancelHandshake, MoveAccount, CreateAccount,
      DescribeCreateAccountStatus, TagResource, UntagResource; iam:CreateServiceLinkedRole only for
      organizations.amazonaws.com; its state bucket and trail bucket; its trail, log group, metric filters, alarms
      and SNS topic by name prefix organization-security-; iam on itself (the user, its policy, this role and policy,
      the trail's log-delivery role, PassRole of that role to cloudtrail.amazonaws.com) for refresh and updates; ssm
      GetParameter on its tfvars parameter. Never DeleteOrganization, RemoveAccountFromOrganization, CloseAccount,
      LeaveOrganization, DeletePolicy, DeleteOrganizationalUnit or any access-key verb: those stay the operator's.
      Placeholders only (${account_id}, ${region}); no literal account id.
  - file: terraform/organization/policies/organization_admin_trust.json.tftpl
    action: Create
    purpose: "PR 1. Trust of OrganizationAdmin: Principal the org-admin-agent user ARN built from ${account_id}; no other principal."
  - file: terraform/organization/policies/assume_organization_admin.json.tftpl
    action: Create
    purpose: "PR 1. The user's only policy: sts:AssumeRole on the OrganizationAdmin role ARN built from ${account_id}."
  - file: terraform/organization/trail.tf
    action: Create
    purpose: >-
      PR 1. The management account's own trail (not an organisation trail; rec-5059 converts it): multi-region,
      global service events on, log file validation on, homed in var.aws_region, delivering to bucket
      organization-security-trail-<management account id>-<region> (name built from data sources at plan time, the
      PROD trail's pattern; prevent_destroy, versioning, public-access block, SSE-S3, lifecycle as PROD's trail) and
      to CloudWatch Logs group organization-security-cloudtrail (retention as PROD's) through a log-delivery role.
      Metric filters and alarms, each to SNS topic organization-security-alerts with an e-mail subscription to
      var.alerts_email: admin role assumed (AssumeRole of OrganizationAdmin, so every sitting alarms by design), the
      admin user acting other than AssumeRole, root activity (userIdentity.type Root outside AWS service events), and
      trail tampering (StopLogging, DeleteTrail, UpdateTrail, PutEventSelectors).
  - file: terraform/organization/CLAUDE.md
    action: Create
    purpose: >-
      PR 1. The procedure for this root (deploy-paths.yaml organization_provisioning names it): the management
      environment's setup (setup-script field writing ~/.aws/config with agent_static and agent_platform_admin_org,
      AWS_PROFILE=agent_platform_admin_org, the network secret holding only the management key for the project
      region's STS host); the operator's CloudShell seed commands, which fetch the three templates from the PR head sha
      of this public repository and render ${account_id} and ${region} with sed; tfvars from the SSM parameter into the
      gitignored terraform.organization.tfvars; the sitting order (steps 5-16) and the counts-only read-backs; the
      emergency detach (aws organizations detach-policy of baseline_prod, then a PR to match). Never names an account
      id, e-mail or the break-glass name.
  - file: .gitignore
    action: Modify
    purpose: PR 1. Ignore terraform/**/terraform.organization.tfvars (lock files are already ignored by terraform/**/.terraform.lock.hcl).
  - file: .github/CODEOWNERS
    action: Modify
    purpose: PR 1. /terraform/organization/ @benjamin-blake beside /terraform/bootstrap/.
  - file: config/agent/verification_registry/entries/codeowners-covers-gate-paths.yaml
    action: Modify
    purpose: PR 1. The required-path list gains /terraform/organization/ (a tightening; nothing loosened).
  - file: scripts/checks/_terraform.py
    action: Modify
    new_imports: []
    purpose: PR 1. _TERRAFORM_ROOTS gains terraform/organization, so the credential-free init -backend=false, validate and fmt run on it in the full tier and the terraform-validate job.
  - file: tests/validate/test_terraform_checks.py
    action: Modify
    purpose: PR 1. The expected -chdir list gains terraform/organization.
  - file: scripts/checks/ci_guards/validate_project_region.py
    action: Modify
    new_imports: []
    purpose: PR 1. _PINNED_VAR_FILES gains terraform/organization/variables.tf, so its aws_region default must equal config/aws-region and every other region literal under the root fails.
  - file: tests/checks/ci_guards/test_validate_project_region.py
    action: Modify
    purpose: PR 1. A case that terraform/organization/variables.tf is pinned (a mismatched default is red) and the real tree is green.
  - file: docs/contracts/protected-actions.yaml
    action: Modify
    purpose: >-
      PR 1. Exactly the sidecar blocks protected-live-roots, protected-admin-profiles, protected-target,
      protected-default-roots and protected-log, the last being a new amendment_log entry
      (docs/plans/approved/sit-organization.yaml).
  - file: tests/test_session_protected_action_match.py
    action: Modify
    purpose: >-
      PR 1. terraform -chdir=terraform/organization apply is tf-state-change with target organization; --profile
      agent_platform_admin_org is admin-credential; a plan on terraform/organization with no profile override is
      admin-credential by admin_default_roots.
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: PR 1. Exactly the sidecar blocks taxonomy-organization-row and taxonomy-log (a new amendment_log entry).
  - file: tests/checks/verification/test_validate_admin_root_premerge_gate.py
    action: Modify
    purpose: >-
      PR 1. Exactly the sidecar block premerge-gate-test-fixture (the synthetic _TAXONOMY gains a non-admin organization
      row, since the real protected-actions.yaml's new live root must map to an axis row in every fixture), plus a
      real-tree case that the real taxonomy derives both terraform/bootstrap and terraform/organization as admin-only
      roots and both are in gate.live_roots.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      PR 1. Exactly the sidecar blocks deploy-paths-organization-row, deploy-paths-premerge-roots,
      deploy-paths-env-check and deploy-paths-log (a new amendment_log entry). The file is at its 500-effective-line
      cap (contracts class, config/structural_size_budgets.yaml): the build writes each new scalar of the row on one
      line and re-flows pre_merge_live_plan's folded rule scalars onto fewer lines, word for word (the binding ignores
      wrapping), so the file ends at or under 500; it never raises the budget (Decision 128).
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: >-
      PR 1. Exactly the sidecar blocks inventory-organization-rows (AWS-12 company; AWS-13 to AWS-15 follow AWS-12),
      inventory-ledger (AWS-12's evidence_ledger entry, citing steps 4-5) and inventory-log (a new amendment_log
      entry).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: PR 1. Exactly the sidecar block decision-113-note (Decision 113's reversal reconsidered; the management lane).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      PR 1. T2.57 c4 text becomes "rec-5026: the Organization, its management and SIT accounts and the baseline SCPs
      exist, and the management account's own trail alarms on its admin key and root." (the organisation trail moves
      to rec-5059), and T2.57 gains c9 "rec-5058: the RDS apply-guard row and boundary denies are in force before any
      plan creates an aws_db_* resource." and c10 "rec-5059: the organisation trail replaces PROD's account trail,
      with the IAM-change detector moved onto it.", both open. PR 7 flips c4 met.
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: PR 1. Register terraform/organization/CLAUDE.md at its measured size (a new entry under the cap; no raise marker).
  - file: tests/checks/iam_tf/test_organization_baseline.py
    action: Create
    purpose: >-
      PR 1, extended in PR 2-7. Text tests over terraform/organization (rec-5026's acceptance node
      test_baseline_scps_deny_leaving_the_organization first): the baseline holds each of the four statements; the
      sit OU attaches baseline; baseline_prod's statements are exactly local.prod_baseline_stages and every stage
      key is a baseline key; global_actions contains sts:*, iam:*, organizations:* and support:*; protect_cloudtrail
      exempts exactly PlatformAdmin and the break-glass variable and denies no read verb; the rendered baseline is
      under 5,120 characters; no aws_iam_access_key resource and no access-key verb in any template;
      OrganizationAdminOps grants none of the operator-only verbs; every templatefile call sits inside try() with a
      Deny-all fallback; no 12-digit literal, e-mail or region literal outside variables.tf's default; each
      aws_organizations_* and account resource has prevent_destroy, and the SIT account has close_on_deletion false.
  # ------------------------------------------------------------ PR 2: PROD joins (after the invitation is accepted)
  - file: terraform/organization/accounts.tf
    action: Modify
    purpose: >-
      PR 2. import block (id = var.prod_account_id) and aws_organizations_account prod with parent_id the prod OU
      (the import's one change is that move), close_on_deletion false, lifecycle prevent_destroy and ignore_changes
      [email, name, role_name, iam_user_access_to_billing]; email = var.prod_account_email, name "PROD".
  # ------------------------------------------------------------ PR 3-6: one baseline statement each on PROD
  - file: terraform/organization/scps.tf
    action: Modify
    purpose: >-
      PR 3 to PR 6, one key each, in this order: deny_leave_organization (PR 3 creates baseline_prod and its
      attachment), deny_root_user, protect_cloudtrail, deny_other_regions (last; PR 6 also folds in step 13's
      re-lookback). Each PR changes one line of local.prod_baseline_stages and the matching test expectation.
  # ------------------------------------------------------------ PR 7: SIT is created (irreversible)
  - file: terraform/organization/accounts.tf
    action: Modify
    purpose: >-
      PR 7. aws_organizations_account sit: name "SIT", email var.sit_account_email, parent_id the sit OU (already
      carrying baseline), role_name OrganizationAccountAccessRole (kept for rec-5027, which narrows or removes it),
      iam_user_access_to_billing DENY, close_on_deletion false, prevent_destroy, ignore_changes [role_name].
  - file: terraform/organization/policies/organization_admin.json.tftpl
    action: Modify
    purpose: "PR 7. One statement: sts:AssumeRole on arn:aws:iam::${sit_account_id}:role/OrganizationAccountAccessRole (the id from the account resource at apply time)."
bundled_recommendations: [rec-5026]
followon_recs: [rec-5059]
infrastructure_dependencies:
  - "A new management account, signed up by the operator (company mailbox root e-mail, root MFA, company payment and tax), and its admin user, key and role seeded by the operator (step 5); both precede PR 1's pre-merge plan."
  - "A new cloud environment used only for Organization sittings, holding only the management key as its AWS network secret (operator's 2026-11-10 card choice); probed in step 5 before anything relies on it."
  - "terraform/organization: admin-tier applies (SIT Decision cl.7, Decision 248 cl.6) from that environment after each PR's pre-merge plan; seven PRs, seven applies, one at a time."
  - "PROD (today's account) is not changed by Terraform here: it joins by invitation (accepted by the operator as the break-glass user) and receives SCPs from the management account. terraform/bootstrap and terraform/personal are untouched and must plan zero changes after every stage."
  - "Running cost: about $0.50 a month (four alarms at $0.10, CloudWatch Logs and S3 for a near-idle management trail, the state bucket); Organizations, SCPs, the SSM standard parameter and empty accounts are free."
acceptance_criteria:
  - "rec-5026's acceptance node, tests/checks/iam_tf/test_organization_baseline.py::test_baseline_scps_deny_leaving_the_organization, passes, with every other case in that file."
  - "The bound files hold exactly the sidecar's words (validate_merge_step green on PR 1 against the operator's approval run)."
  - "protected-actions.yaml, environment-taxonomy.yaml and deploy-paths.yaml treat terraform/organization as an admin-only live root with the management profile, and their tests say so."
  - "From the management environment, OrganizationAdmin is the only identity in use and the provider initialises (step 5)."
  - "After PR 1's apply: the Organization has feature set ALL with SCPs enabled, OUs prod and sit, baseline attached to sit, the trail logging and four alarms present, and a fresh plan exits 0."
  - "PROD is a member (joined by invitation) in the prod OU (PR 2), and carries baseline_prod with all four statements after PR 6; after each stage PROD's portal round-trip, drift run, bootstrap plan and heartbeat are clean."
  - "SIT exists in the sit OU under baseline, with close_on_deletion off and root MFA on (PR 7)."
  - "rec-5026 reads closed with its closure trailer on PR 7, and T2.57 c4 reads met if T2.57 exists."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The new text tests over terraform/organization, rec-5026's acceptance node first. The file is absent on main, so
      it is red before.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_organization_baseline.py -q
    expected: exit 0; red before (file absent on main).
    fix_if: a guard case fails on the real tree -- fix the HCL or template, never the assertion
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: organization-baseline
  - step: 2
    phase: pre-deploy
    action: The contract, hook, region, root-list and CODEOWNERS tests PR 1 touches, plus the iam_tf and ci_guards suites.
    command: bin/venv-python -m pytest tests/test_session_protected_action_match.py tests/hooks/test_protected_action_gate.py tests/checks/verification/test_validate_admin_root_premerge_gate.py tests/checks/ci_guards/test_validate_project_region.py tests/validate/test_terraform_checks.py tests/checks/iam_tf tests/checks/ci_guards -q
    expected: exit 0
    fix_if: a node fails -- read whether the change or the node is wrong; never loosen an assertion (Decision 235), and a node needing more than the scope rows is a plan defect
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Pre-existing suites that already run in both tiers through their own shards; step 1's new shard carries the new behaviour.
  - step: 3
    phase: pre-deploy
    action: >-
      Credential-free init, validate and fmt of the new root, the bound-words check, then the fast and full tiers before
      handoff. Not hermetic: the pr-validate runner has no terraform binary.
    command: >-
      terraform -chdir=terraform/organization init -backend=false -input=false > /dev/null && terraform -chdir=terraform/organization validate && terraform fmt -check -recursive terraform/organization && bin/venv-python -m scripts.roadmap.approved_text verify --slug sit-organization &&
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      exit 0; validate prints Success; fmt lists nothing; approved_text verify exits 0; then the fast tier and the full
      tier (backgrounded with a 2 h limit from the top-level session, handoff_policy) with validation_result
      --verify-head exit 0 for HEAD.
    fix_if: validate names an attribute (fix the HCL); verify names a block (place the sidecar's words exactly)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The terraform-validate job runs init, validate and fmt on every _TERRAFORM_ROOTS member, and validate_merge_step binds the words in PR CI.
  - step: 4
    phase: pre-deploy
    action: >-
      Operator, before any agent sitting (always_ask admin steps; each check is theirs): sign up the management account
      with its company-mailbox root e-mail, root MFA on, company payment method and tax settings; confirm the SIT
      mailbox receives mail; confirm PROD holds no AWS credits or reservations that consolidated billing would move
      (or accept that it moves them).
    command: "Operator console steps (no agent command). The operator replies in the thread naming each item done."
    expected: The operator's words in the thread for each item.
    fix_if: an item cannot be done -- the build waits; nothing else in this plan starts
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: >-
      Operator seed and environment, then the agent's probe. In the management account's CloudShell (root with MFA),
      the operator runs the commands terraform/organization/CLAUDE.md gives, fetching the three templates from the PR
      head sha: create user org-admin-agent and its access key, put its AssumeOrganizationAdmin policy, create role
      OrganizationAdmin with the rendered trust and put OrganizationAdminOps; put the tfvars as SSM SecureString
      /secret/agent-platform-terraform-organization-tfvars. They create the management cloud environment with that key
      as its only AWS network secret (host sts.<project region>.amazonaws.com) and the setup-script field and
      AWS_PROFILE the CLAUDE.md gives. In a session in that environment the agent then runs this check (ENVIRONMENT
      CHECK, deploy-paths.yaml pre_merge_live_plan) and a provider init.
    command: >-
      bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin_org 2>/dev/null | grep -q 'assumed-role/OrganizationAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT;
      terraform -chdir=terraform/organization init -backend=false -input=false > /dev/null 2>&1 && echo PROVIDER_OK || echo PROVIDER_BLOCKED
    expected: >-
      ADMIN_CHAIN_OK and PROVIDER_OK. On ADMIN_CHAIN_ABSENT in the management environment, or PROVIDER_BLOCKED (the
      environment's network policy does not reach the Terraform registry; the PROD provider mirror is not readable
      from here by design), STOP: the CloudShell fallback changes who applies (SIT Decision cl.7 wording), so it needs
      the operator's word and a new approval run; it is never taken silently.
    fix_if: ADMIN_CHAIN_ABSENT -- check the network secret's host and the profile's role name; PROVIDER_BLOCKED -- the operator adds the registry hosts to that environment's network policy
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Region and root lookback over PROD's trail, read-only, in a PROD ADMIN session on the operator's direction:
      CloudWatch Logs Insights over platform-security-cloudtrail for its whole retention, events outside the pinned
      region by region and event source, and root events by name. Region and service names and counts only.
    command: >-
      R=$(tr -d '[:space:]' < config/aws-region); G=platform-security-cloudtrail; P=agent_platform_admin;
      aws logs describe-log-groups --profile $P --region $R --log-group-name-prefix $G --query 'logGroups[0].retentionInDays' --output text;
      S=$(( $(date +%s) - 400*86400 )); E=$(date +%s);
      Q1=$(aws logs start-query --profile $P --region $R --log-group-name $G --start-time $S --end-time $E --query-string "filter awsRegion != '$R' | stats count(*) as n by awsRegion, eventSource | sort n desc | limit 100" --query queryId --output text);
      Q2=$(aws logs start-query --profile $P --region $R --log-group-name $G --start-time $S --end-time $E --query-string "filter userIdentity.type = 'Root' | stats count(*) as n by eventName | sort n desc | limit 50" --query queryId --output text);
      sleep 60; for q in $Q1 $Q2; do aws logs get-query-results --profile $P --region $R --query-id $q --query 'results[*][*].value' --output text; echo ---; done
    expected: >-
      Retention days, then a table of (region, event source, count) and of (root event, count). Post them on PR 1.
      Every event source seen outside the pinned region is in local.global_actions; root events are none or
      explained by the operator.
    fix_if: >-
      an event source outside the pinned region is not a global service -- STOP and report it (a workload in another
      region would break under deny_other_regions; the operator decides); a global one not yet listed -- add it to
      local.global_actions and its test
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      State bucket, on the operator's direction in the management environment: one create-bucket in the project
      region and a read-back. PR 1's import block then adopts it, so no local state ever exists.
    command: >-
      R=$(tr -d '[:space:]' < config/aws-region); B=agent-platform-organization-tfstate;
      aws s3api create-bucket --profile agent_platform_admin_org --region $R --bucket $B --create-bucket-configuration LocationConstraint=$R > /dev/null &&
      aws s3api get-bucket-location --profile agent_platform_admin_org --bucket $B --query LocationConstraint --output text
    expected: The project region printed. BucketAlreadyOwnedByYou on a re-run is fine; BucketAlreadyExists (another owner) stops the build.
    fix_if: BucketAlreadyExists -- STOP; the name is taken globally and the plan's backend name needs an amendment
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: pre-deploy
    action: >-
      Pre-merge read-only admin plan of terraform/organization (deploy-paths.yaml pre_merge_live_plan) at the
      CI-green $PR_HEAD_SHA of each PR, in the management environment on the operator's direction, in a throwaway
      worktree with the tfvars fetched in, -lock=false, plan file deleted in the step; counts and addresses only on the
      PR with the head sha. There is no origin/main plan before PR 1 (the root is new).
    command: >-
      set -o pipefail; R=$(tr -d '[:space:]' < config/aws-region); W="${TMPDIR:-/tmp}/org-wt"; E="${TMPDIR:-/tmp}/org-evidence"; rm -rf "$E"; mkdir -p "$E";
      git worktree add --detach "$W" "$PR_HEAD_SHA" -q &&
      aws ssm get-parameter --profile agent_platform_admin_org --region $R --name /secret/agent-platform-terraform-organization-tfvars --with-decryption --query Parameter.Value --output text > "$W/terraform/organization/terraform.organization.tfvars" &&
      terraform -chdir="$W/terraform/organization" init -input=false -backend-config="region=$R" > /dev/null 2>> "$E/tf.err" &&
      terraform -chdir="$W/terraform/organization" plan -input=false -lock=false -detailed-exitcode -var-file=terraform.organization.tfvars -out="$E/p.bin" > /dev/null 2>> "$E/tf.err"; rc=$?;
      terraform -chdir="$W/terraform/organization" show -json "$E/p.bin" 2>/dev/null | bin/venv-python -c "import json,sys,collections; p=json.load(sys.stdin); c=collections.Counter(); [c.update(['import'] if r['change'].get('importing') else []) or c.update(['+'.join(r['change']['actions'])]) for r in p.get('resource_changes', [])]; print('COUNTS', dict(c)); [print(r['change']['actions'], r['address']) for r in p.get('resource_changes', []) if r['change']['actions'] != ['no-op']]";
      echo "EXIT $rc"; rm -f "${E:?}/p.bin"; git worktree remove --force "$W"
    expected: >-
      PR 1: imports exactly the state bucket, the user, its policy, the role and its policy (5), each with no-op or
      only a tag update; creates only the organization, two OUs, baseline and its sit attachment, the bucket's four
      settings and policy, the trail and its bucket, settings, log group, delivery role, metric filters, alarms, topic
      and subscription; 0 to destroy. PR 2: 1 import (PROD) with one in-place update (parent move). PR 3: 2 to add
      (baseline_prod and its attachment). PR 4 to PR 6: 1 in-place update (baseline_prod content). PR 7: 1 to add (SIT)
      and 1 in-place update (OrganizationAdminOps). Post COUNTS, the address list and EXIT on the PR with the head sha.
    fix_if: >-
      a delete or replace anywhere -- STOP; an imported IAM item shows a policy change -- the seed differs from the
      template: re-seed from the same sha, never edit the template to match a hand edit; EXIT 1 -- read the local tf.err
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Each PR's apply, after merge, on the operator's direction in the management environment, as two separate
      invocations (Decision 126: plan, present, accept, apply). Invocation A: in a worktree at the merge sha, a saved
      plan with -detailed-exitcode whose counts are presented; merge.bin and the worktree are kept. Invocation B, a
      separate tool call made only after the operator's word in that session and only when A's counts equal step 8's
      for that PR: apply merge.bin, a fresh plan, cleanup. PR 7's word must name the SIT account's creation
      (irreversible).
    command: >-
      A: set -o pipefail; R=$(tr -d '[:space:]' < config/aws-region); W="${TMPDIR:-/tmp}/org-merge"; git worktree add --detach "$W" "$MERGE_SHA" -q &&
      aws ssm get-parameter --profile agent_platform_admin_org --region $R --name /secret/agent-platform-terraform-organization-tfvars --with-decryption --query Parameter.Value --output text > "$W/terraform/organization/terraform.organization.tfvars" &&
      terraform -chdir="$W/terraform/organization" init -input=false -backend-config="region=$R" > /dev/null &&
      terraform -chdir="$W/terraform/organization" plan -input=false -detailed-exitcode -var-file=terraform.organization.tfvars -out=merge.bin 2>&1 | grep -E '^Plan:|No changes'; echo "MERGE_PLAN_EXIT ${PIPESTATUS[0]}"
      B: W="${TMPDIR:-/tmp}/org-merge";
      terraform -chdir="$W/terraform/organization" apply -input=false merge.bin 2>&1 | grep -E '^Apply complete';
      terraform -chdir="$W/terraform/organization" plan -input=false -detailed-exitcode -var-file=terraform.organization.tfvars > /dev/null; echo "ORG_PLAN_EXIT $?";
      rm -f "$W/terraform/organization/merge.bin" "$W/terraform/organization/terraform.organization.tfvars"; git worktree remove --force "$W"
    expected: >-
      A: the Plan line equal to step 8's counts for that PR and MERGE_PLAN_EXIT 2 (0 only if nothing was expected);
      B: Apply complete with the same counts and ORG_PLAN_EXIT 0. Record the merge sha and the lines as a counts-only
      comment on the merged PR.
    fix_if: >-
      A's counts differ from step 8's, or MERGE_PLAN_EXIT 1 -- never run B; delete merge.bin, the tfvars and the
      worktree, present the difference and re-run step 8 at the merge sha
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      PR 1 read-back in the management environment: organization feature set and SCP type, the two OUs, baseline on the
      sit OU, the trail logging, the alarms and the confirmed subscription (the operator clicks the confirmation
      e-mail first). Names, states and counts only.
    command: >-
      R=$(tr -d '[:space:]' < config/aws-region); P=agent_platform_admin_org;
      aws organizations describe-organization --profile $P --query 'Organization.FeatureSet' --output text;
      ROOT=$(aws organizations list-roots --profile $P --query 'Roots[0].Id' --output text);
      aws organizations list-roots --profile $P --query "Roots[0].PolicyTypes[?Type=='SERVICE_CONTROL_POLICY'].Status" --output text;
      aws organizations list-organizational-units-for-parent --profile $P --parent-id "$ROOT" --query 'OrganizationalUnits[].Name' --output text;
      SIT_OU=$(aws organizations list-organizational-units-for-parent --profile $P --parent-id "$ROOT" --query "OrganizationalUnits[?Name=='sit'].Id" --output text);
      aws organizations list-policies-for-target --profile $P --target-id "$SIT_OU" --filter SERVICE_CONTROL_POLICY --query 'Policies[].Name' --output text;
      aws cloudtrail get-trail-status --profile $P --region $R --name organization-security-trail --query IsLogging --output text;
      aws cloudwatch describe-alarms --profile $P --region $R --alarm-name-prefix organization-security- --query 'length(MetricAlarms)' --output text;
      aws sns list-subscriptions --profile $P --region $R --query "length(Subscriptions[?contains(TopicArn, 'organization-security-alerts') && SubscriptionArn!='PendingConfirmation'])" --output text
    expected: ALL; ENABLED; prod sit (either order); FullAWSAccess baseline (either order); True; 4; 1. Post on PR 1.
    fix_if: any value differs -- report it on PR 1; a missing subscription confirmation is the operator's click
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: >-
      Invitation, after PR 1's read-back: the agent sends it from the management environment on the operator's
      direction; the operator then accepts it in PROD's CloudShell as the break-glass user (one act; PlatformAdmin gets
      no Organizations grant). Accepting creates PROD's Organizations service-linked role, so PROD's IAM-change
      detector may alarm once: expected, named here. The agent reads back from the management side.
    command: >-
      P=agent_platform_admin_org; R=$(tr -d '[:space:]' < config/aws-region);
      PROD_ID=$(aws ssm get-parameter --profile $P --region $R --name /secret/agent-platform-terraform-organization-tfvars --with-decryption --query Parameter.Value --output text | sed -n 's/^prod_account_id *= *"\([0-9]*\)".*/\1/p');
      aws organizations invite-account-to-organization --profile $P --target "Id=$PROD_ID,Type=ACCOUNT" --query 'Handshake.State' --output text;
      echo "(operator accepts in PROD; then:)";
      aws organizations list-accounts --profile $P --query "length(Accounts[?JoinedMethod=='INVITED' && Status=='ACTIVE'])" --output text
    expected: OPEN (the invitation), then after acceptance 1 (PROD joined by invitation). Post both values.
    fix_if: >-
