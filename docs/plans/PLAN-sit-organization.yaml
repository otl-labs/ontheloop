rollback: >-
  Everything here is reversible by the operator before any child item runs: the Organization, its OUs, policies, root
  features, trail and admin lane can be deleted from the management root (no member account exists yet); the
  management account itself can only be closed (90-day suspension). Code reverts go forward through new PRs, each
  with its own pre-merge plan.
