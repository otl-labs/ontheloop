      ACC=$(aws sts get-caller-identity --profile agent_platform_admin --region us-east-1 --query Account --output text);
      for a in "PlatformDev cloudtrail:StopLogging" "PlatformAdmin cloudtrail:StopLogging" "PlatformAdmin organizations:LeaveOrganization"; do set -- $a;
      aws iam simulate-principal-policy --profile agent_platform_admin --policy-source-arn "arn:aws:iam::$ACC:role/$1" --action-names $2 --query 'EvaluationResults[0].OrganizationsDecisionDetail.AllowedByOrganizations' --output text | sed "s/^/$1 $2 /"; done;
      aws iam simulate-principal-policy --profile agent_platform_admin --policy-source-arn "arn:aws:iam::$ACC:role/PlatformDev" --action-names ec2:DescribeInstances --context-entries ContextKeyName=aws:RequestedRegion,ContextKeyValues=us-east-1,ContextKeyType=string --query 'EvaluationResults[0].OrganizationsDecisionDetail.AllowedByOrganizations' --output text | sed 's/^/PlatformDev ec2 other-region /';
      unset ACC
      -- then mcp__github__actions_run_trigger(method="run_workflow", workflow_id="terraform-drift.yml", ref="main") and
