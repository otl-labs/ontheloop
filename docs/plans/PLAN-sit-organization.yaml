rollback: >-
  Before PR 7, everything here is reversible by the operator: detach baseline_prod (immediate), remove PROD from the
  Organization from the management root, and delete the Organization and its resources; the management account
  itself can only be closed (90-day suspension). After PR 7, SIT can only be closed by the operator (90-day
  suspension); close_on_deletion false and prevent_destroy keep a revert of PR 7 from attempting it. Code reverts go
  forward through new PRs, each with its own pre-merge plan.
