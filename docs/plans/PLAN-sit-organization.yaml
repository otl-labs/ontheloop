  - file: tests/checks/iam_tf/test_organization_baseline.py
    action: Create
    purpose: >-
      Text tests over terraform/organization's SCPs, Organization and root hygiene (rec-5026's acceptance node
      test_baseline_scps_deny_leaving_the_organization first): the Organization has feature set ALL, the
      SERVICE_CONTROL_POLICY type enabled and the two OUs prod and sit (critique r9 N4); the baseline holds each of the four statements;
      deny_root_user carries the Null aws:AssumedRoot "true" condition; the sit OU attaches baseline;
      prod_baseline_stages is a list whose every key is a baseline key; global_actions contains sts:*, iam:*,
      organizations:* and support:*; protect_cloudtrail has no Condition and denies no read verb; a size precondition
      exists on the baseline policy; aws_service_access_principals holds iam.amazonaws.com, aws_iam_organizations_features
      enables both root features and depends on the organization; each aws_organizations_* resource has
      prevent_destroy; every resource name starts agent-platform- or is an IAM name the root owns (org-admin-operator,
      OrganizationAdmin); no 12-digit literal, e-mail or region literal outside variables.tf's default; the state
      bucket's settings and TLS-only policy; the backend has no region; the tfvars file is ignored (git check-ignore)
      and CODEOWNERS names the root. The admin grant and the alarms have their own files below, so no file nears the
      500-line limit (critique r8 B1; PROD's alarm test needed two helpers to stay under it). Each file may import
      the existing tests/checks/iam_tf/_platform_security_hcl.py parsers; if a file still nears 500 at build, STOP and
      amend the plan rather than add an undeclared helper.
  - file: tests/checks/iam_tf/test_organization_admin_grant.py
    action: Create
    purpose: >-
      Text tests over the admin lane: no aws_iam_access_key resource and no access-key verb in any template; every
      templatefile call sits inside try() with its fail-closed fallback (Deny-all for the policies, Deny of
      sts:AssumeRole for the trust); no aws_iam_user_login_profile or aws_iam_virtual_mfa_device resource; the trust admits the
      org-admin-operator user only and requires aws:MultiFactorAuthPresent true; the user's policy is only
      sts:AssumeRole on OrganizationAdmin; CloudShellUse holds exactly its seven verbs; OrganizationAdminOps grants none of the operator-only verbs, no StopLogging,
      DeleteTrail or cloudtrail:*, no UpdateAssumeRolePolicy and no Delete* except the state lock object's DeleteObject;
      each Sid's action set equals the template row's write or read set, so a missing refresh read is red;
      EnableAWSServiceAccess sits alone under its condition; the SSM grant is ssm:GetParameter alone on the one literal
      parameter ARN shape (validate_secret_parameter_grants reads only .tf files of two roots; critique r3 N7); all
      inline policies on OrganizationAdmin total under 10,240 characters and OrganizationAdminOps alone under 7,000.
  - file: tests/checks/iam_tf/test_organization_alarms.py
    action: Create
    purpose: >-
      Text and fixture tests over trail.tf's detector: the trail is multi-region in the pinned region with global
      events and log validation; each of the five metric filters' patterns names its exact event set and identities
      (the eleven IAM and Organizations policy-change events with no actor clause, no errorCode clause and no
      requestParameters clause, so denied attempts alarm, Decision 202; the tamper sources above, the sns clause matching requestParameters.topicArn or
      requestParameters.subscriptionArn on the topic; Root outside AWS
      service events; AssumeRole or SwitchRole to OrganizationAdmin; a failed or MFA-less ConsoleLogin or a non-read call
      by org-admin-operator outside signin other than AssumeRole);
      each pattern is a plain literal with no ${ interpolation and fits CloudWatch Logs' 1,024-character limit; each
      alarm targets the topic (critique r5 B2); the event fixture covers every filter with a match and a non-match,
      carries no 12-digit id, each denied event has null requestParameters, and at least one event with an errorCode
      lists the policy-change alarm in must_match (critique r6 B1, r8 N2).
bundled_recommendations: [rec-5026]
followon_recs: [rec-5059, rec-5064, rec-5065, rec-5066]
infrastructure_dependencies:
  - "A new management account, signed up by the operator (company mailbox root e-mail, root MFA, company payment and tax), its tfvars SecureString created in the console, and its console-only operator user and OrganizationAdmin role seeded by the operator's root block in AWS CloudShell (step 4); all precede the pre-merge plan. No access key and no agent cloud environment exist for this account (Decision 256 cl.3, Decision 257 cl.7; Amendment 1)."
  - "terraform/organization: one admin-tier apply (Decision 252 cl.7, Decision 248 cl.6), run by the operator from AWS CloudShell in the OrganizationAdmin role session after the pre-merge plan (steps 5 and 7). No CI role exists in the management account (Decision 252 cl.7)."
  - "PROD (today's account) is not touched: it is not invited here, and terraform/bootstrap and terraform/personal are untouched."
  - "Running cost: about $0.60 a month (five alarms at $0.10, CloudWatch Logs and S3 for a near-idle management trail, the state bucket); Organizations, SCPs, centralized root access, the SSM standard parameter, the OUs and AWS CloudShell are free."
acceptance_criteria:
  - "rec-5026's acceptance node, tests/checks/iam_tf/test_organization_baseline.py::test_baseline_scps_deny_leaving_the_organization, passes, with every other case in the three new test files test_organization_baseline.py, test_organization_admin_grant.py and test_organization_alarms.py (step 1)."
  - "The bound files hold exactly the sidecar's words (validate_merge_step green on the PR against the operator's approval run; step 3)."
  - "protected-actions.yaml, environment-taxonomy.yaml and deploy-paths.yaml treat terraform/organization as an admin-only live root the operator applies from CloudShell, the hook classifies an agent's terraform state change on it once the contract is on main, and their tests say so (step 2); the trail-write guard admits the management trail's one grant and treats Deny statements as no grant (step 2)."
  - "In the operator's CloudShell role session the identity is the assumed OrganizationAdmin role, the management account's root MFA is on with no root key, the state bucket's name was free and is owned by the management account, the plan at the PR head shows the expected counts, and every alarm's filter pattern matches exactly its fixture events when evaluated live (steps 4-6)."
  - "After the apply: the Organization has feature set ALL with SCPs enabled, both root features on, OUs prod and sit, baseline attached to sit, the trail logging and five alarms present, a fresh plan exits 0, the subscription is confirmed, and a real role switch and a real failed sign-in moved the role-assumed and sign-in alarms' metrics (steps 7-9)."
  - "T2.57 c4 reads met in the PR on acceptance criteria 1-4 and the step 6 evidence; rec-5026 reads closed with its closure trailer after merge (step 10)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The new text tests over terraform/organization, rec-5026's acceptance node first. The three files are absent on main, so
      the step is red before.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_organization_baseline.py tests/checks/iam_tf/test_organization_admin_grant.py tests/checks/iam_tf/test_organization_alarms.py -q
    expected: exit 0; red before (the three files absent on main).
    fix_if: a guard case fails on the real tree -- fix the HCL or template, never the assertion
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: organization-baseline
  - step: 2
    phase: pre-deploy
    action: The contract, matcher, region, root-list and CODEOWNERS tests this PR touches, plus the iam_tf and ci_guards suites.
    command: bin/venv-python -m pytest tests/test_session_protected_action_match.py tests/checks/verification/test_validate_admin_root_premerge_gate.py tests/checks/ci_guards/test_validate_project_region.py tests/validate/test_terraform_checks.py tests/checks/iam_tf tests/checks/ci_guards -q
    expected: exit 0
    fix_if: a node fails -- read whether the change or the node is wrong; never loosen an assertion (Decision 235), and a node needing more than the scope rows is a plan defect
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Pre-existing suites that already run in both tiers through their own shards; the new matcher cases sit beside them, and step 1's new shard carries the root's behaviour.
  - step: 3
    phase: pre-deploy
    action: >-
      Credential-free init, validate and fmt of the new root, the bound-words check, then the fast tier; then the full
      tier before handoff, started backgrounded with a 2 h limit from the top-level session and read on its completion
      with validation_result --verify-head. Not hermetic: the pr-validate runner has no terraform binary.
    command: >-
      TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir=terraform/organization init -backend=false -input=false > /dev/null && terraform -chdir=terraform/organization validate -no-color && terraform fmt -check -recursive terraform/organization && bin/venv-python -m scripts.roadmap.approved_text verify --slug sit-organization &&
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      exit 0; validate prints "Success! The configuration is valid."; fmt lists nothing; approved_text verify exits 0;
      then the fast tier and the full tier with validation_result --verify-head exit 0 for HEAD.
    fix_if: validate names an attribute (fix the HCL); verify names a block (place the sidecar's words exactly); the pinned aws provider lacks aws_iam_organizations_features (hashicorp providers resolve from the registry, not the mirror; pin a 5.x that carries it)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The terraform-validate job runs init, validate and fmt on every _TERRAFORM_ROOTS member, and validate_merge_step binds the words in PR CI.
  - step: 4
    phase: pre-deploy
    action: >-
      OPERATOR STEP (Amendment 1), at CI green, before any sitting. Console acts first: sign up the management account
      with its company-mailbox root e-mail, root MFA on, company payment method and tax settings; in Parameter Store
      create the SecureString /secret/agent-platform-terraform-organization-tfvars holding alerts_email = "<company
      alerts address>" (typed in the console, never in a shell). Then, signed in as root with MFA, the operator pastes
      this seed block into AWS CloudShell; the build writes the CI-green head sha and the three templates' sha256 values
      into it before posting (BLOCK_NOT_FILLED otherwise), so root runs only the reviewed templates. It renders
      ${account_id} and ${region} with sed in a folder under /tmp, creates user org-admin-operator with its
      AssumeOrganizationAdmin policy and role OrganizationAdmin with its trust and OrganizationAdminOps, and prints
      the lines below; an EXIT trap removes the folder, and the account id stays in a shell variable. Then in the IAM
      console the operator gives org-admin-operator a console password (no reset required) and a virtual MFA device,
      signs out of root, signs in as org-admin-operator with MFA, switches role to OrganizationAdmin and opens AWS
      CloudShell in that role (which proves CloudShellUse). The seed predates the trail, so it is unalarmed: the
      operator says in the thread when it ran. Registering a second root MFA device is advised, not required.
    command: >-
      ( set -o pipefail; H=__PR_HEAD_SHA__; S1=__SHA256_ORGANIZATION_ADMIN__; S2=__SHA256_ORGANIZATION_ADMIN_TRUST__; S3=__SHA256_ASSUME_ORGANIZATION_ADMIN__;
      case "$H$S1$S2$S3" in *__*) echo BLOCK_NOT_FILLED; exit 1 ;; esac; W="${TMPDIR:-/tmp}/org-seed"; rm -rf "$W"; mkdir -p "$W"; trap 'rm -rf "$W"' EXIT; unset AWS_PROFILE;
      case "$(aws sts get-caller-identity --query Arn --output text 2>/dev/null)" in *:root) ;; *) echo NOT_ROOT; exit 1 ;; esac;
      { git init -q "$W/repo" && git -C "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git "$H" && git -C "$W/repo" checkout -q --detach FETCH_HEAD; } 2>/dev/null || { echo CLONE_FAILED; exit 1; };
      P="$W/repo/terraform/organization/policies"; for f in "organization_admin $S1" "organization_admin_trust $S2" "assume_organization_admin $S3"; do set -- $f; echo "$2  $P/$1.json.tftpl" | sha256sum -c --quiet - > /dev/null 2>&1 || { echo "TEMPLATE_MISMATCH $1"; exit 1; }; done;
      ID=$(aws sts get-caller-identity --query Account --output text); R=$(tr -d '[:space:]' < "$W/repo/config/aws-region"); export AWS_REGION="$R" AWS_DEFAULT_REGION="$R";
      for n in organization_admin organization_admin_trust assume_organization_admin; do sed -e 's/\${account_id}/'"$ID"'/g' -e 's/\${region}/'"$R"'/g' "$P/$n.json.tftpl" > "$W/$n.json"; done;
      { aws iam create-user --user-name org-admin-operator > /dev/null && aws iam put-user-policy --user-name org-admin-operator --policy-name AssumeOrganizationAdmin --policy-document "file://$W/assume_organization_admin.json" &&
      aws iam create-role --role-name OrganizationAdmin --max-session-duration 3600 --assume-role-policy-document "file://$W/organization_admin_trust.json" > /dev/null &&
      aws iam put-role-policy --role-name OrganizationAdmin --policy-name OrganizationAdminOps --policy-document "file://$W/organization_admin.json"; } > /dev/null 2>&1 && echo SEED_OK || echo SEED_FAILED;
      aws ssm get-parameter --name /secret/agent-platform-terraform-organization-tfvars --query Parameter.Type --output text 2>/dev/null | sed 's/^/TFVARS_TYPE /'; echo "HEAD $H" )
    expected: >-
      SEED_OK, TFVARS_TYPE SecureString and HEAD <the CI-green head sha>, sent by the operator to the build thread, then
      CloudShell open in the OrganizationAdmin role session.
    fix_if: >-
      BLOCK_NOT_FILLED -- the build posted a block with a placeholder: it re-posts it filled; NOT_ROOT -- sign in as
      root for this block only; TEMPLATE_MISMATCH -- the posted sha256 values do not match the head: STOP, the build
      recomputes them at the head and re-posts; SEED_FAILED -- the operator reads the IAM console (an existing user or
      role from an earlier run is deleted there, then the block re-run); no TFVARS_TYPE line -- create the parameter;
      CloudShell refuses to open in the role -- STOP and amend CloudShellUse (never attach a managed policy)
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: >-
      OPERATOR STEP (Amendment 1): pre-merge admin plan (deploy-paths.yaml pre_merge_live_plan) at the CI-green head,
      one block pasted into CloudShell in the OrganizationAdmin role session; the build writes the head sha into it.
      It checks the identity (ADMIN_CHAIN_OK only for an assumed-role/OrganizationAdmin/ session) and root hygiene,
      probes the state bucket's global name (head-bucket with the expected owner: success ours, 404 free, otherwise
      taken) and creates it only when free, which is the block's one write and is said so on the PR; fetches the head
      into /tmp, installs the pinned terraform checked against HashiCorp's SHA256SUMS, reads the tfvars from SSM and
      prints their Version and the head's terraform/organization tree hash (the two values step 7 pins), inits with the
      backend, plans -lock=false to a saved file and prints counts by action and type, the changed attribute names of
      any imported item and PLAN_DIGEST (sha256 of the sorted action and address lines, imports included); then
      evaluates every filter pattern live with logs test-metric-filter against the committed JSON fixture (critique r6
      B1; PROD's precedent is PLAN-platform-role-iam-change-alarms step 13). The saved plan, tfvars and clone are
      deleted by an EXIT trap; terraform errors go to /tmp/org-pre-tf.err, read in CloudShell only. The operator's
      paste is the direction (Decision 126 cl.1, Decision 256 cl.3); no agent session runs it.
    command: >-
      ( set -o pipefail; H=__PR_HEAD_SHA__; case "$H" in *__*) echo BLOCK_NOT_FILLED; exit 1 ;; esac; W="${TMPDIR:-/tmp}/org-pre"; L="${TMPDIR:-/tmp}/org-pre-tf.err";
      rm -rf "$W"; mkdir -p "$W/bin" "$W/plugins"; : > "$L"; trap 'rm -rf "$W"' EXIT; unset AWS_PROFILE;
      case "$(aws sts get-caller-identity --query Arn --output text 2>> "$L")" in *:assumed-role/OrganizationAdmin/*) echo ADMIN_CHAIN_OK ;; *) echo ADMIN_CHAIN_ABSENT; exit 1 ;; esac;
      aws iam get-account-summary --query 'SummaryMap.[AccountMFAEnabled,AccountAccessKeysPresent]' --output text 2>> "$L" | awk '{print "ROOT_MFA " $1; print "ROOT_KEYS " $2}';
      { git init -q "$W/repo" && git -C "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git "$H" && git -C "$W/repo" checkout -q --detach FETCH_HEAD; } 2>> "$L" || { echo CLONE_FAILED; exit 1; };
      R=$(tr -d '[:space:]' < "$W/repo/config/aws-region"); export AWS_REGION="$R" AWS_DEFAULT_REGION="$R" TF_DATA_DIR="$W/tfdata" TF_PLUGIN_CACHE_DIR="$W/plugins" CHECKPOINT_DISABLE=1;
      V=$(tr -d '[:space:]' < "$W/repo/config/terraform-version"); case "$(uname -m)" in x86_64) P=linux_amd64 ;; aarch64) P=linux_arm64 ;; *) echo UNSUPPORTED_ARCH; exit 1 ;; esac; Z="terraform_${V}_${P}.zip";
      { curl -fsSL -o "$W/$Z" "https://releases.hashicorp.com/terraform/$V/$Z" && curl -fsSL -o "$W/sums" "https://releases.hashicorp.com/terraform/$V/terraform_${V}_SHA256SUMS" &&
      ( cd "$W" && grep " $Z\$" sums | sha256sum -c --quiet - ) && unzip -qo "$W/$Z" -d "$W/bin"; } >> "$L" 2>&1 || { echo TERRAFORM_INSTALL_FAILED; exit 1; }; export PATH="$W/bin:$PATH";
      ID=$(aws sts get-caller-identity --query Account --output text); B=agent-platform-organization-tfstate;
      if aws s3api head-bucket --bucket $B --expected-bucket-owner "$ID" > /dev/null 2> "$W/hb.err"; then echo BUCKET_OWNED;
      elif grep -q '(404)' "$W/hb.err"; then { aws s3api create-bucket --bucket $B --create-bucket-configuration LocationConstraint=$R > /dev/null && aws s3api head-bucket --bucket $B --expected-bucket-owner "$ID"; } 2>> "$L" && echo BUCKET_CREATED || { echo BUCKET_CREATE_FAILED; exit 1; };
      else echo NAME_TAKEN; exit 1; fi;
      N=/secret/agent-platform-terraform-organization-tfvars; aws ssm get-parameter --name $N --with-decryption --query Parameter.Value --output text > "$W/vars.tfvars" 2>> "$L" && test -s "$W/vars.tfvars" || { echo TFVARS_ABSENT; exit 1; };
      echo "TFVARS_VERSION $(aws ssm get-parameter --name $N --query Parameter.Version --output text)"; echo "ROOT_TREE $(git -C "$W/repo" rev-parse HEAD:terraform/organization)"; O="$W/repo/terraform/organization";
      terraform -chdir="$O" init -input=false -backend-config="region=$R" > /dev/null 2>> "$L" || { echo INIT_FAILED; exit 1; };
      terraform -chdir="$O" plan -input=false -no-color -lock=false -detailed-exitcode -var-file="$W/vars.tfvars" -out="$W/p.bin" > /dev/null 2>> "$L"; rc=$?;
      terraform -chdir="$O" show -json "$W/p.bin" 2>> "$L" | python3 -c "import json,sys,collections,hashlib; rc=[r for r in json.load(sys.stdin).get('resource_changes', []) if r['change']['actions'] != ['no-op'] or r['change'].get('importing')]; k=lambda r: ('import ' if r['change'].get('importing') else '') + '+'.join(r['change']['actions']); d=lambda ch: sorted(x for x in set(ch.get('before') or {}) | set(ch.get('after') or {}) if (ch.get('before') or {}).get(x) != (ch.get('after') or {}).get(x)); print('COUNTS', dict(sorted(collections.Counter(k(r) + ' ' + r['type'] for r in rc).items()))); print('IMPORT_CHANGES', [(r['address'], d(r['change'])) for r in rc if r['change'].get('importing') and 'update' in r['change']['actions']]); print('PLAN_DIGEST', hashlib.sha256('\n'.join(sorted(k(r) + ' ' + r['address'] for r in rc)).encode()).hexdigest())";
      echo 'jsonencode(local.org_security_filter_patterns)' | terraform -chdir="$O" console -var-file="$W/vars.tfvars" 2>> "$L" | python3 -c "import json,subprocess,sys; pats=json.loads(json.loads(sys.stdin.read())); ev=json.load(open(sys.argv[1]))['events']; bad=[(n, e['name']) for e in ev for n, p in pats.items() if bool(json.loads(subprocess.run(['aws', 'logs', 'test-metric-filter', '--filter-pattern', p, '--log-event-messages', json.dumps(e['event']), '--output', 'json'], check=True, capture_output=True, text=True).stdout)['matches']) != (n in e['must_match'])]; sys.exit('MISMATCH ' + repr(bad)) if bad else print('FILTERS OK -- %d patterns x %d events' % (len(pats), len(ev)))" "$W/repo/tests/fixtures/organization_security_filter_events.json";
      echo "EXIT $rc"; echo "HEAD $H" )
    expected: >-
      ADMIN_CHAIN_OK, ROOT_MFA 1, ROOT_KEYS 0, BUCKET_CREATED on the first sitting (BUCKET_OWNED on a re-run),
      TFVARS_VERSION <n>, ROOT_TREE <hash>, COUNTS with exactly: 5 imports (the state bucket,
      aws_iam_user.org_admin_operator, aws_iam_user_policy, aws_iam_role, aws_iam_role_policy), each no-op or a tag
      update only (IMPORT_CHANGES names tags or tags_all alone); creates: 1 aws_organizations_organization, 1
      aws_iam_organizations_features, 2 aws_organizations_organizational_unit, 1 aws_organizations_policy (baseline), 1
      aws_organizations_policy_attachment (sit), 5 state-bucket settings (versioning, public-access block, encryption,
      ownership, policy), 1 aws_cloudtrail, 1 trail bucket with its 5 settings, 1 log group, 1 delivery role with its
      policy, 5 metric filters, 5 alarms, 1 topic, 1 subscription; 0 to destroy; PLAN_DIGEST <hex>, FILTERS OK -- 5
      patterns x every fixture event, EXIT 2 and HEAD <head sha>. The operator sends the build thread the printed lines.
    fix_if: >-
      ADMIN_CHAIN_ABSENT -- CloudShell is not in the role session: switch role and reopen CloudShell; ROOT_MFA 0 or
      ROOT_KEYS not 0 -- the operator fixes root first (MFA on, any root key deleted); NAME_TAKEN -- STOP, the backend
      name needs an amendment; a delete or replace anywhere -- STOP; MISMATCH, or a Python traceback from a refused
      pattern or a throttled call -- fix the pattern in HCL (or the fixture if it does not carry CloudTrail's real
      shape), push, and re-run steps 1 and 5 at the new head; never drop a clause silently and never fix a MISMATCH by
      excluding errored events (denied attempts must alarm); IMPORT_CHANGES naming anything but tags or tags_all -- the
      seed differs from the template: re-seed from the same sha, never edit the template to match a hand edit; EXIT 1
      or any *_FAILED / TFVARS_ABSENT -- read /tmp/org-pre-tf.err in CloudShell, fix and re-paste; a new head re-runs
      this step
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      The build session, after the operator has sent step 5's lines: checks them against step 5's expected lines,
      confirms the create count against the merged code, and posts a counts-only comment on the PR with the head sha:
      COUNTS, IMPORT_CHANGES, BUCKET_CREATED or BUCKET_OWNED (named as the block's one write), FILTERS OK, EXIT and
      the three pins (PLAN_DIGEST, ROOT_TREE, TFVARS_VERSION), labelled operator-reported from the operator's
      CloudShell. No AWS credential is used.
    command: >-
      mcp__github__pull_request_read(method="get", owner="otl-labs", repo="ontheloop", pullNumber=<PR>) -> head sha equals
      the HEAD line; then mcp__github__add_issue_comment on the PR with the lines above
    expected: Every line matches step 5's expected; HEAD equals the PR's current head sha; the comment carries names, counts, hashes and shas only.
    fix_if: a line differs -- do not post success; report the exact line to the operator and the coordinator; HEAD differs from the current head -- the step 5 block is re-posted for the new head
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: >-
      OPERATOR STEP (Amendment 1): after merge, one block pasted into CloudShell in the OrganizationAdmin role session.
      Before posting it the build writes in the merge sha and step 6's three pins, and checks locally that
      git rev-parse <merge sha>:terraform/organization equals ROOT_TREE (a squash changes the commit, never this tree).
      The block repeats step 5's identity check, fetch and terraform install, refuses a different root tree
      (TREE_MISMATCH) or tfvars Version (TFVARS_VERSION_CHANGED), inits, plans with the state lock to a saved file and
      applies that saved file only when the plan exit is 2 and its PLAN_DIGEST equals step 6's; then it re-plans and
      reads back the Organization (feature set and SCP type, root features, the two OUs, the policies on the sit OU),
      the trail, the alarm count and the confirmed subscriptions, names, states and counts only. Otherwise it prints
      APPLY_SKIPPED with COUNTS. The digest does not cover attribute values; the tree and Version pins narrow that
      residual. The operator's paste is the direction (Decision 126 cl.1); no approve line is asked.
    command: >-
      ( set -o pipefail; M=__MERGE_SHA__; XD=__PLAN_DIGEST__; XT=__ROOT_TREE__; XV=__TFVARS_VERSION__; case "$M$XD$XT$XV" in *__*) echo BLOCK_NOT_FILLED; exit 1 ;; esac;
      W="${TMPDIR:-/tmp}/org-merge"; L="${TMPDIR:-/tmp}/org-merge-tf.err"; rm -rf "$W"; mkdir -p "$W/bin" "$W/plugins"; : > "$L"; trap 'rm -rf "$W"' EXIT; unset AWS_PROFILE;
      case "$(aws sts get-caller-identity --query Arn --output text 2>> "$L")" in *:assumed-role/OrganizationAdmin/*) echo ADMIN_CHAIN_OK ;; *) echo ADMIN_CHAIN_ABSENT; exit 1 ;; esac;
      { git init -q "$W/repo" && git -C "$W/repo" fetch -q --depth 1 https://github.com/otl-labs/ontheloop.git "$M" && git -C "$W/repo" checkout -q --detach FETCH_HEAD; } 2>> "$L" || { echo CLONE_FAILED; exit 1; };
      [ "$(git -C "$W/repo" rev-parse HEAD:terraform/organization)" = "$XT" ] || { echo TREE_MISMATCH; exit 1; };
      R=$(tr -d '[:space:]' < "$W/repo/config/aws-region"); export AWS_REGION="$R" AWS_DEFAULT_REGION="$R" TF_DATA_DIR="$W/tfdata" TF_PLUGIN_CACHE_DIR="$W/plugins" CHECKPOINT_DISABLE=1;
      V=$(tr -d '[:space:]' < "$W/repo/config/terraform-version"); case "$(uname -m)" in x86_64) P=linux_amd64 ;; aarch64) P=linux_arm64 ;; *) echo UNSUPPORTED_ARCH; exit 1 ;; esac; Z="terraform_${V}_${P}.zip";
      { curl -fsSL -o "$W/$Z" "https://releases.hashicorp.com/terraform/$V/$Z" && curl -fsSL -o "$W/sums" "https://releases.hashicorp.com/terraform/$V/terraform_${V}_SHA256SUMS" &&
      ( cd "$W" && grep " $Z\$" sums | sha256sum -c --quiet - ) && unzip -qo "$W/$Z" -d "$W/bin"; } >> "$L" 2>&1 || { echo TERRAFORM_INSTALL_FAILED; exit 1; }; export PATH="$W/bin:$PATH";
      N=/secret/agent-platform-terraform-organization-tfvars; [ "$(aws ssm get-parameter --name $N --query Parameter.Version --output text 2>> "$L")" = "$XV" ] || { echo TFVARS_VERSION_CHANGED; exit 1; };
      aws ssm get-parameter --name $N --with-decryption --query Parameter.Value --output text > "$W/vars.tfvars" 2>> "$L" && test -s "$W/vars.tfvars" || { echo TFVARS_ABSENT; exit 1; }; O="$W/repo/terraform/organization";
      terraform -chdir="$O" init -input=false -backend-config="region=$R" > /dev/null 2>> "$L" || { echo INIT_FAILED; exit 1; };
      terraform -chdir="$O" plan -input=false -no-color -detailed-exitcode -var-file="$W/vars.tfvars" -out="$W/merge.bin" > /dev/null 2>> "$L"; rc=$?; echo "MERGE_PLAN_EXIT $rc";
      D=$(terraform -chdir="$O" show -json "$W/merge.bin" 2>> "$L" | python3 -c "import json,sys,hashlib; rc=[r for r in json.load(sys.stdin).get('resource_changes', []) if r['change']['actions'] != ['no-op'] or r['change'].get('importing')]; k=lambda r: ('import ' if r['change'].get('importing') else '') + '+'.join(r['change']['actions']); print(hashlib.sha256('\n'.join(sorted(k(r) + ' ' + r['address'] for r in rc)).encode()).hexdigest())");
      if [ "$rc" = 2 ] && [ "$D" = "$XD" ]; then terraform -chdir="$O" apply -input=false -no-color "$W/merge.bin" 2>> "$L" | grep -E '^Apply complete!';
      terraform -chdir="$O" plan -input=false -no-color -detailed-exitcode -var-file="$W/vars.tfvars" > /dev/null 2>> "$L"; echo "ORG_PLAN_EXIT $?";
      echo "FEATURE_SET $(aws organizations describe-organization --query Organization.FeatureSet --output text)"; ROOT=$(aws organizations list-roots --query 'Roots[0].Id' --output text);
      echo "SCP_TYPE $(aws organizations list-roots --query "Roots[0].PolicyTypes[?Type=='SERVICE_CONTROL_POLICY'].Status" --output text)"; echo "ROOT_FEATURES $(aws iam list-organizations-features --query EnabledFeatures --output text)";
      echo "OUS $(aws organizations list-organizational-units-for-parent --parent-id "$ROOT" --query 'OrganizationalUnits[].Name' --output text)"; SIT=$(aws organizations list-organizational-units-for-parent --parent-id "$ROOT" --query "OrganizationalUnits[?Name=='sit'].Id" --output text);
      echo "SIT_OU_POLICIES $(aws organizations list-policies-for-target --target-id "$SIT" --filter SERVICE_CONTROL_POLICY --query 'Policies[].Name' --output text)"; echo "TRAIL_LOGGING $(aws cloudtrail get-trail-status --name agent-platform-org-security-trail --query IsLogging --output text)";
      echo "ALARMS $(aws cloudwatch describe-alarms --alarm-name-prefix agent-platform-org-security- --query 'length(MetricAlarms)' --output text)";
      else echo APPLY_SKIPPED; [ "$rc" = 2 ] && terraform -chdir="$O" show -json "$W/merge.bin" 2>> "$L" | python3 -c "import json,sys,collections; rc=json.load(sys.stdin).get('resource_changes', []); print('COUNTS', dict(sorted(collections.Counter(('import ' if r['change'].get('importing') else '') + '+'.join(r['change']['actions']) + ' ' + r['type'] for r in rc if r['change']['actions'] != ['no-op'] or r['change'].get('importing')).items())))"; fi; echo "MERGE_SHA $M" )
    expected: >-
      ADMIN_CHAIN_OK, MERGE_PLAN_EXIT 2, "Apply complete!" with step 5's counts, ORG_PLAN_EXIT 0, FEATURE_SET ALL,
      SCP_TYPE ENABLED, ROOT_FEATURES RootCredentialsManagement RootSessions (either order), OUS prod sit (either order),
      SIT_OU_POLICIES FullAWSAccess baseline (either order), TRAIL_LOGGING True, ALARMS 5 and MERGE_SHA <merge sha>,
      sent by the operator to the build thread.
    fix_if: >-
      BLOCK_NOT_FILLED -- the build re-posts it filled; TREE_MISMATCH or TFVARS_VERSION_CHANGED -- nothing was planned:
      STOP, step 5 re-runs at the merge sha (H set to it) and the build re-posts this block with the new pins;
      APPLY_SKIPPED -- nothing was applied: send COUNTS too; the build reports the difference to the coordinator as a
      plan defect, never a second paste; ORG_PLAN_EXIT 2 after the apply -- STOP and report; never paste again without
      a fresh read of the cause; any *_FAILED or TFVARS_ABSENT -- read /tmp/org-merge-tf.err in CloudShell, fix and
      re-paste; a read-back value differs -- report it, the build posts it on the PR
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      OPERATOR STEP (Amendment 1), the live alarm proof: the operator clicks the SNS confirmation e-mail, signs out,
      signs back in as org-admin-operator with MFA, switches role to OrganizationAdmin (a real SwitchRole after the
      trail exists) and opens CloudShell in the role; before that sign-in the operator makes one deliberate failed
      console sign-in as org-admin-operator (a wrong password), so the sign-in alarm is proven on a real event too
      (decision-scout r2 SPIRIT on Decision 202's 'proven live'); at least 15 minutes after the switch (CloudTrail to CloudWatch Logs
      delivery) the operator pastes this read-only block. It prints the confirmed subscription count and the sum over the
      last 6 hours of each alarm's metric, so a SwitchRole or failed ConsoleLogin shape the fixture got wrong shows as 0. The
      e-mail that switch sends is also the delivery proof. Names and counts only.
    command: >-
      ( unset AWS_PROFILE; T=$(aws sns list-topics --query "Topics[?ends_with(TopicArn, ':agent-platform-org-security-alerts')].TopicArn" --output text);
      echo "SUBSCRIPTIONS_CONFIRMED $(aws sns list-subscriptions-by-topic --topic-arn "$T" --query "length(Subscriptions[?SubscriptionArn!='PendingConfirmation'])" --output text)";
      aws cloudwatch describe-alarms --alarm-name-prefix agent-platform-org-security- --query 'MetricAlarms[].[AlarmName,Namespace,MetricName]' --output text | while read -r A NS MN; do
      echo "$A $(aws cloudwatch get-metric-statistics --namespace "$NS" --metric-name "$MN" --start-time "$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)" --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --period 21600 --statistics Sum --query 'sum(Datapoints[].Sum)' --output text)"; done )
    expected: >-
      SUBSCRIPTIONS_CONFIRMED 1; the role-assumed alarm's line and the sign-in alarm's line each show a sum of 1 or
      more (the switch and the failed sign-in for this block); the other three lines show what the sitting did (the policy-change alarm counts the apply's IAM and SCP writes),
      sent by the operator to the build thread.
    fix_if: >-
      SUBSCRIPTIONS_CONFIRMED 0 -- the operator clicks the confirmation e-mail and re-pastes; the role-assumed sum is 0
      or None after 30 minutes, or the sign-in sum is -- that pattern or fixture does not match CloudTrail's real event: the build
      files it as a plan defect with the alarm line, never edits a pattern outside a PR
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      The build session, after the operator has sent the lines of steps 7 and 8: checks them against those steps'
      expected lines and posts a counts-only comment on the merged PR naming the merge sha, labelled operator-reported
      from the operator's CloudShell. No AWS credential is used.
    command: >-
      mcp__github__add_issue_comment on the merged PR with the merge sha and the lines of steps 7 and 8
    expected: Every line matches; the comment carries names, states, counts and shas only.
    fix_if: a line differs -- do not post success; report the exact line to the operator and the coordinator
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      rec-5026 closed by the squash commit's Resolves trailer; read back from the build session as the proxy-held session
      user (Decision 256). If the reader is unreachable, the read-back is ci.yml's trailer-closure job on the merge sha.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows, _ =
      fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5026']); print(rows[0]['id'], rows[0]['status'])"
      || (mcp__github__actions_list(method="list_workflow_runs", resource_id="ci.yml", workflow_runs_filter={"event":
      "push", "branch": "main"}) -> the run whose head_sha is the merge sha; list_workflow_jobs -> job trailer-closure;
      mcp__github__get_job_logs on it)
    expected: >-
      rec-5026 closed; or, on the fallback, job trailer-closure concluded success and its log carries "rec-autoclose:
      closed rec-5026" or "rec-autoclose: rec-5026 already closed"; record it in a follow-up comment on the merged PR
    fix_if: still open after the closure job ran -- read ci.yml's closure job log; never close by hand without the trailer evidence
    hermetic: false
    graduation: not-applicable
