constraints:
  - "One admin act at a time across the project: no organization sitting beside a terraform/bootstrap apply (rec-5025's included), and no two organization sittings at once."
  - "Every out-of-Terraform agent act here is the state bucket's create-bucket (step 6), on the operator's direction in that session. The invitation and the emergency detach named in organization_provisioning belong to the child plans. Signing up, minting or rotating the key, seeding the role, removing an account and closing an account are the operator's alone."
  - "PROD is not touched: no invitation, no SCP and no change to terraform/bootstrap or terraform/personal."
  - "Never print or commit an account id, e-mail, the break-glass name, a key or a rendered policy (Decision 101, Decision 239): evidence is names, states, counts, booleans and shas; ids live only in shell variables."
  - "If the management environment cannot carry the key or reach the Organizations endpoint or the provider (step 4), STOP: the CloudShell route changes Decision 252 cl.7's actor and needs the operator's word and a new approval run."
  - No rescue agents or workaround loops (Decision 55).
