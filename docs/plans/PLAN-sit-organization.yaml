execution_steps:
  - "Create terraform/organization (main, variables, organization, scps, accounts comment, state_bucket, management_admin, trail, policies, CLAUDE.md) and test_organization_baseline.py; the fast-path change and the trail-write guard extension with their tests; place the sidecar's words in protected-actions.yaml, environment-taxonomy.yaml, deploy-paths.yaml, the inventory and DECISIONS.md; the roadmap, .gitignore, CODEOWNERS, registry shard, _terraform.py, region check and test edits. Run steps 1-3."
  - "Open the PR with the build session's own [hook_canary] state; at CI green ask the operator for step 4's acts, then steps 4-7 each on their own words in the management session; post the evidence."
  - "Merge on code review PROCEED, green CI, the operator's sidecar approval run and final-diff word, and the step 7 evidence; the squash body carries 'Resolves: rec-5026' and the bookkeeping walk's c4 flip. Then steps 8 and 9 on the operator's direction, step 10 and step 11."
  - "Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)"
  - "Report: what was implemented, verification results"
rollback: >-
  Everything here is reversible by the operator before any child item runs: the Organization, its OUs, policies, root
  features, trail and admin lane can be deleted from the management root (no member account exists yet); the
  management account itself can only be closed (90-day suspension). Code reverts go forward through new PRs, each
  with its own pre-merge plan.
