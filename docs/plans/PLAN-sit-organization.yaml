constraints:
  - "One admin act at a time across the project: no organization sitting beside a terraform/bootstrap apply (CI-gated or CloudShell), and no two organization sittings at once."
  - "Every admin act here is the operator's, in AWS CloudShell or the console (Decision 256 cl.3): no agent session holds, mints or relays a management-account credential, and no agent runs any of steps 4, 5, 7 or 8. The blocks' only out-of-Terraform write is the state bucket's create-bucket (step 5). The invitation and the emergency detach named in organization_provisioning belong to the child plans. Signing up, seeding the user and role, setting the user's password and MFA, removing an account and closing an account are the operator's alone."
  - "PROD is not touched: no invitation, no SCP and no change to terraform/bootstrap or terraform/personal."
  - "Never print or commit an account id, e-mail, the break-glass name, a key or a rendered policy (Decision 101, Decision 239): evidence is names, states, counts, booleans, hashes and shas; ids live only in shell variables inside a block."
  - "Every block the build posts is filled (no placeholder) and pins a full commit sha; a block that prints BLOCK_NOT_FILLED, or any line other than its step's expected ones, is never worked around in CloudShell: the build reports it and re-posts or amends."
  - "terraform/organization is outside Decision 257 cl.1-6 (they cover terraform/bootstrap's PROD backend only, and Decision 252 cl.7 allows no CI role in the management account), so it is applied under Decision 257 cl.7's 'other admin operations stay the operator's CloudShell steps', with Decision 256 cl.3 read against that clause (Decision 256's admin-path-lands trigger was answered by Decision 257 cl.7; decision-scout r2 NOTE)."
  - No rescue agents or workaround loops (Decision 55).
