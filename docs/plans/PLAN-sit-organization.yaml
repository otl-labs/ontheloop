  - file: tests/checks/iam_tf/test_organization_baseline.py
    action: Create
    purpose: >-
      Text tests over terraform/organization (rec-5026's acceptance node test_baseline_scps_deny_leaving_the_organization
      first): the baseline holds each of the four statements; deny_root_user carries the Null aws:AssumedRoot "true"
      condition; the sit OU attaches baseline; prod_baseline_stages is a
      list whose every key is a baseline key; global_actions contains sts:*, iam:*, organizations:* and support:*;
      protect_cloudtrail has no Condition and denies no read verb; a size precondition exists on the
      baseline policy; aws_service_access_principals holds iam.amazonaws.com and aws_iam_organizations_features enables
      both root features; no aws_iam_access_key resource and no access-key verb in any template; OrganizationAdminOps
      grants none of the operator-only verbs, no StopLogging, DeleteTrail or cloudtrail:*, no UpdateAssumeRolePolicy,
      and no Delete* except the state lock object's DeleteObject; each Sid's action set equals the template row's
      write or read set, so a missing refresh read is red; all inline policies on OrganizationAdmin total under 10,240 characters and OrganizationAdminOps alone under 7,000;
      each of the five metric filters' patterns names its exact event set and identities (the eleven IAM and
      Organizations policy-change events with no actor clause and no errorCode clause (denied attempts alarm, Decision
      202); the tamper event classes above; Root outside
      AWS service events; AssumeRole of OrganizationAdmin; the user acting other than AssumeRole and
      GetCallerIdentity), each pattern is a plain literal with no ${ interpolation and fits CloudWatch Logs' 1,024-character limit, and each alarm targets the topic
      (critique r5 B2); the event fixture covers every filter with a match and a non-match, carries no 12-digit id, and
      each denied event has null requestParameters (critique r6 B1); aws_iam_organizations_features depends on the organization; every
      templatefile call sits inside try() with a Deny-all fallback; the SSM grant is ssm:GetParameter alone on the one
      literal parameter ARN shape (validate_secret_parameter_grants reads only .tf files of two roots, so this test pins
      the template's grant; critique r3 N7); every resource name starts agent-platform- or is
      an IAM name the root owns (org-admin-agent, OrganizationAdmin); no 12-digit literal, e-mail or region literal
      outside variables.tf's default; each aws_organizations_* resource has prevent_destroy; the tfvars file is ignored
      (git check-ignore) and CODEOWNERS names the root.
bundled_recommendations: [rec-5026]
followon_recs: [rec-5059, rec-5064, rec-5065, rec-5066]
infrastructure_dependencies:
  - "A new management account, signed up by the operator (company mailbox root e-mail, root MFA, company payment and tax), and its admin user, key and role seeded by the operator (step 4); both precede the pre-merge plan."
  - "A new cloud environment used only for Organization sittings, holding only the management key as its AWS network secret (operator's card choice, re-chosen 2026-11-11 12:37Z); probed in step 4 before anything relies on it."
  - "terraform/organization: one admin-tier apply (Decision 252 cl.7, Decision 248 cl.6) from that environment after the pre-merge plan."
  - "PROD (today's account) is not touched: it is not invited here, and terraform/bootstrap and terraform/personal are untouched."
  - "Running cost: about $0.60 a month (five alarms at $0.10, CloudWatch Logs and S3 for a near-idle management trail, the state bucket); Organizations, SCPs, centralized root access, the SSM standard parameter and the OUs are free."
acceptance_criteria:
  - "rec-5026's acceptance node, tests/checks/iam_tf/test_organization_baseline.py::test_baseline_scps_deny_leaving_the_organization, passes, with every other case in that file (step 1)."
  - "The bound files hold exactly the sidecar's words (validate_merge_step green on the PR against the operator's approval run; step 3)."
  - "protected-actions.yaml, environment-taxonomy.yaml and deploy-paths.yaml treat terraform/organization as an admin-only live root with the management profile, the hook classifies every aws or terraform call under that ambient profile once the contract is on main, and their tests say so (step 2); the trail-write guard admits the management trail's one grant and treats Deny statements as no grant (step 2)."
  - "From the management environment the session's identity is the assumed OrganizationAdmin role, the management account's root MFA is on, every service host the apply uses answers and the provider initialises at the PR head (step 4), and the state bucket's name was free and is owned by the management account (steps 5-6); every alarm's filter
  pattern matches exactly its fixture events when evaluated live (step 7)."
  - "After the apply: the Organization has feature set ALL with SCPs enabled, iam.amazonaws.com trusted access and both root features on, OUs prod and sit, baseline attached to sit, the trail logging and five alarms present with a confirmed subscription, and a fresh plan exits 0 (steps 8-10)."
  - "T2.57 c4 reads met in the PR on acceptance criteria 1-4 and the step 7 plan; rec-5026 reads closed with its closure trailer after merge (step 11)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The new text tests over terraform/organization, rec-5026's acceptance node first. The file is absent on main, so
      it is red before.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_organization_baseline.py -q
    expected: exit 0; red before (file absent on main).
    fix_if: a guard case fails on the real tree -- fix the HCL or template, never the assertion
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: organization-baseline
  - step: 2
    phase: pre-deploy
    action: The contract, hook, region, root-list and CODEOWNERS tests this PR touches, plus the iam_tf and ci_guards suites.
    command: bin/venv-python -m pytest tests/test_session_protected_action_match.py tests/hooks/test_protected_action_gate.py tests/checks/verification/test_validate_admin_root_premerge_gate.py tests/checks/ci_guards/test_validate_project_region.py tests/validate/test_terraform_checks.py tests/checks/iam_tf tests/checks/ci_guards -q
    expected: exit 0
    fix_if: a node fails -- read whether the change or the node is wrong; never loosen an assertion (Decision 235), and a node needing more than the scope rows is a plan defect
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Pre-existing suites that already run in both tiers through their own shards; the new hook and matcher cases sit beside them, and step 1's new shard carries the root's behaviour.
  - step: 3
    phase: pre-deploy
    action: >-
      Credential-free init, validate and fmt of the new root, the bound-words check, then the fast tier; then the full
      tier before handoff, started backgrounded with a 2 h limit from the top-level session and read on its completion
      with validation_result --verify-head. Not hermetic: the pr-validate runner has no terraform binary.
    command: >-
      TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir=terraform/organization init -backend=false -input=false > /dev/null && terraform -chdir=terraform/organization validate -no-color && terraform fmt -check -recursive terraform/organization && bin/venv-python -m scripts.roadmap.approved_text verify --slug sit-organization &&
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      exit 0; validate prints "Success! The configuration is valid."; fmt lists nothing; approved_text verify exits 0;
      then the fast tier and the full tier with validation_result --verify-head exit 0 for HEAD.
    fix_if: validate names an attribute (fix the HCL); verify names a block (place the sidecar's words exactly); the pinned aws provider lacks aws_iam_organizations_features (hashicorp providers resolve from the registry, not the mirror; pin a 5.x that carries it)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The terraform-validate job runs init, validate and fmt on every _TERRAFORM_ROOTS member, and validate_merge_step binds the words in PR CI.
  - step: 4
    phase: pre-deploy
    action: >-
      The operator's acts, then the agent's probe. Operator, before any agent sitting (always_ask admin steps; each is
      theirs): sign up the management account with its company-mailbox root e-mail, root MFA on, company payment method
      and tax settings; in its CloudShell (root with MFA) run the seed commands terraform/organization/CLAUDE.md gives at
      the PR head sha (user org-admin-agent and its access key, its AssumeOrganizationAdmin policy, role OrganizationAdmin
      with the rendered trust and OrganizationAdminOps, the tfvars as SSM SecureString
      /secret/agent-platform-terraform-organization-tfvars); create the management cloud environment with that key as its
      only AWS network secret (host sts.<project region>.amazonaws.com) and the setup-script field and AWS_PROFILE the
      CLAUDE.md gives. Then, in a session in that environment whose first status reports its [hook_canary] line, the
      agent runs the ENVIRONMENT CHECK (deploy-paths.yaml pre_merge_live_plan), the root-MFA read, one read-only call
      per service host the apply uses (Organizations, CloudTrail, Logs, CloudWatch, SNS, SSM; IAM through the MFA read;
      S3 in step 5; the second-region STS host through the identity read) and a provider init in a worktree at the PR
      head (main has no terraform/organization before merge). Before merge the hook reads main's protected-actions.yaml,
      which does not name agent_platform_admin_org, so no admin-credential hit fires under that profile in steps 4-7:
      each agent act there runs only on the operator's own words naming it in that session (critique r2 BLK-6). The
      secret-read class does fire on the tfvars parameter whatever the profile (critique r3 B1), so the management
      session's first ask, before this step, is the secret-read approve line with the exact step 7 and step 8 reads.
    command: >-
      test -n "$PR_HEAD_SHA" || { echo PR_HEAD_SHA_UNSET; exit 1; }; git cat-file -e "$PR_HEAD_SHA^{commit}" 2>/dev/null || git fetch -q origin "$PR_HEAD_SHA"; X=agent-platform-org-security-;
      bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin_org 2>/dev/null | grep -q 'assumed-role/OrganizationAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT;
      aws iam get-account-summary --profile agent_platform_admin_org --query 'SummaryMap.AccountMFAEnabled' --output text | sed 's/^/ROOT_MFA /';
      aws organizations describe-organization --profile agent_platform_admin_org > /dev/null 2> /tmp/org-probe.err; { test ! -s /tmp/org-probe.err || grep -q AWSOrganizationsNotInUseException /tmp/org-probe.err; } && echo ORG_ENDPOINT_OK || echo ORG_ENDPOINT_BLOCKED;
      aws cloudtrail describe-trails --profile agent_platform_admin_org > /dev/null 2>&1 && echo CLOUDTRAIL_OK || echo CLOUDTRAIL_BLOCKED;
      aws logs describe-log-groups --profile agent_platform_admin_org --log-group-name-prefix $X > /dev/null 2>&1 && echo LOGS_OK || echo LOGS_BLOCKED;
      aws cloudwatch describe-alarms --profile agent_platform_admin_org --alarm-name-prefix $X > /dev/null 2>&1 && echo CLOUDWATCH_OK || echo CLOUDWATCH_BLOCKED;
      aws sns list-topics --profile agent_platform_admin_org > /dev/null 2>&1 && echo SNS_OK || echo SNS_BLOCKED;
      aws ssm get-parameter --profile agent_platform_admin_org --name /secret/agent-platform-terraform-organization-tfvars --query Parameter.Name --output text > /dev/null 2>&1 && echo SSM_OK || echo SSM_BLOCKED;
      { git worktree remove --force /tmp/org-probe-wt 2> /dev/null; git worktree add --detach /tmp/org-probe-wt "$PR_HEAD_SHA" -q; } &&
      terraform -chdir=/tmp/org-probe-wt/terraform/organization init -backend=false -input=false > /dev/null 2>&1 && echo PROVIDER_OK || echo PROVIDER_BLOCKED; git worktree remove --force /tmp/org-probe-wt; rm -f /tmp/org-probe.err
    expected: >-
      ADMIN_CHAIN_OK, ROOT_MFA 1, ORG_ENDPOINT_OK, CLOUDTRAIL_OK, LOGS_OK, CLOUDWATCH_OK, SNS_OK, SSM_OK and PROVIDER_OK
      (each read is granted by the seeded OrganizationAdminOps, so a failure is a blocked host or a seed gap). On
      ADMIN_CHAIN_ABSENT in the management environment, or any *_BLOCKED (the environment's network policy does not
      reach that service's endpoint or the Terraform registry), STOP: the
      CloudShell fallback changes who applies (Decision 252 cl.7 wording), so it needs the operator's word and a new
      approval run; it is never taken silently.
    fix_if: >-
      ADMIN_CHAIN_ABSENT -- check the network secret's host and the profile's role name; ROOT_MFA 0 -- the operator's
      sign-up step is not done; PR_HEAD_SHA_UNSET -- set it to the CI-green head; any *_BLOCKED -- re-run that one call to
      read its error: a network error means the operator adds the host to that environment's network policy, an
      AccessDenied means the seed differs from the template (re-seed from the same sha)
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: >-
      Read-only probe that the state bucket's global name is free before anything creates it (S3 head-bucket: 404 free,
      403 another owner's, success already ours), on the operator's words in the management environment. It also
      proves the S3 host is reachable.
    command: >-
      out=$(aws s3api head-bucket --profile agent_platform_admin_org --bucket agent-platform-organization-tfstate 2>&1); rc=$?;
      if [ $rc -eq 0 ]; then echo NAME_OURS; elif echo "$out" | grep -q '(404)'; then echo NAME_FREE; elif echo "$out" | grep -q '(403)'; then echo NAME_TAKEN; else echo S3_PROBE_ERROR; fi
    expected: NAME_FREE on first sitting, NAME_OURS on a re-run (step 6's owner check confirms it).
    fix_if: NAME_TAKEN -- STOP, the plan's backend name needs an amendment; S3_PROBE_ERROR -- a blocked S3 host (add it to the environment's network policy)
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      State bucket, on the operator's direction in the management environment: one create-bucket in the project region
      and a read-back that checks the owner. The import block then adopts it, so no local state ever exists.
    command: >-
      MGMT_ID=$(aws sts get-caller-identity --profile agent_platform_admin_org --query Account --output text); test -n "$MGMT_ID" || { echo MGMT_ID_UNSET; exit 1; };
      R=$(tr -d '[:space:]' < config/aws-region); B=agent-platform-organization-tfstate;
      aws s3api create-bucket --profile agent_platform_admin_org --bucket $B --create-bucket-configuration LocationConstraint=$R > /dev/null 2> /tmp/org-bucket.err;
      grep -q BucketAlreadyExists /tmp/org-bucket.err && echo BUCKET_TAKEN;
      aws s3api get-bucket-location --profile agent_platform_admin_org --bucket $B --expected-bucket-owner "$MGMT_ID" --query LocationConstraint --output text; rm -f /tmp/org-bucket.err
    expected: >-
      The project region printed and no BUCKET_TAKEN or MGMT_ID_UNSET. The account id stays in a variable of this one
      command and is never printed (an account-id read is exempt from the second-region identity rule; no --region
      override). BucketAlreadyOwnedByYou on a re-run is fine.
    fix_if: BUCKET_TAKEN, or the owner check fails -- STOP; the name is taken globally and the plan's backend name needs an amendment
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      Pre-merge read-only admin plan of terraform/organization (deploy-paths.yaml pre_merge_live_plan) at the CI-green
      $PR_HEAD_SHA, in the management environment on the operator's direction, in a worktree at the literal path
      /tmp/org-wt with the tfvars and plan file in /tmp/org-evidence outside it, -lock=false, plan file deleted in the
      step; counts and addresses only on the PR with the head sha. There is no origin/main plan (the root is new). Then
      every filter pattern is evaluated live with logs test-metric-filter against the committed fixture events, so a
      pattern that cannot match what CloudTrail emits is caught before merge (critique r6 B1; PROD's precedent is
      PLAN-platform-role-iam-change-alarms step 13).
    command: >-
      set -o pipefail; test -n "$PR_HEAD_SHA" || { echo PR_HEAD_SHA_UNSET; exit 1; }; git cat-file -e "$PR_HEAD_SHA^{commit}" 2>/dev/null || git fetch -q origin "$PR_HEAD_SHA"; R=$(tr -d '[:space:]' < config/aws-region); E=/tmp/org-evidence; rm -rf "$E"; mkdir -p "$E";
      { git worktree remove --force /tmp/org-wt 2> /dev/null; git worktree prune; git worktree add --detach /tmp/org-wt "$PR_HEAD_SHA" -q; } &&
      aws ssm get-parameter --profile agent_platform_admin_org --name /secret/agent-platform-terraform-organization-tfvars --with-decryption --query Parameter.Value --output text > "$E/terraform.organization.tfvars" &&
      terraform -chdir=/tmp/org-wt/terraform/organization init -input=false -backend-config="region=$R" > /dev/null 2>> "$E/tf.err" &&
      terraform -chdir=/tmp/org-wt/terraform/organization plan -input=false -no-color -lock=false -detailed-exitcode -var-file="$E/terraform.organization.tfvars" -out="$E/p.bin" > /dev/null 2>> "$E/tf.err"; rc=$?;
      terraform -chdir=/tmp/org-wt/terraform/organization show -json "$E/p.bin" 2>/dev/null | bin/venv-python -c "import json,sys,collections; p=json.load(sys.stdin); c=collections.Counter(); [c.update(['import']) if r['change'].get('importing') else c.update(['+'.join(r['change']['actions'])]) for r in p.get('resource_changes', [])]; print('COUNTS', dict(c)); d=lambda ch: sorted(k for k in set(ch.get('before') or {}) | set(ch.get('after') or {}) if (ch.get('before') or {}).get(k) != (ch.get('after') or {}).get(k)) if 'update' in ch['actions'] else []; [print(r['change']['actions'], r['address'], d(r['change'])) for r in p.get('resource_changes', []) if r['change']['actions'] != ['no-op']]";
      echo 'jsonencode(local.org_security_filter_patterns)' | terraform -chdir=/tmp/org-wt/terraform/organization console -var-file="$E/terraform.organization.tfvars" 2>> "$E/tf.err" | bin/venv-python -c "import json,subprocess,sys,yaml; pats=json.loads(json.loads(sys.stdin.read())); ev=yaml.safe_load(open('/tmp/org-wt/tests/fixtures/organization_security_filter_events.yaml'))['events']; bad=[]; [bad.append((name,e['name'],hit)) for e in ev for name,p in pats.items() for hit in [bool(json.loads(subprocess.run(['aws','logs','test-metric-filter','--filter-pattern',p,'--log-event-messages',json.dumps(e['event']),'--profile','agent_platform_admin_org','--output','json'],check=True,capture_output=True,text=True).stdout)['matches'])] if hit != (name in e['must_match'])]; sys.exit('MISMATCH '+repr(bad)) if bad else print('FILTERS OK -- '+str(len(pats))+' patterns x '+str(len(ev))+' events')";
      echo "EXIT $rc"; rm -f "$E/p.bin" "$E/terraform.organization.tfvars"; git worktree remove --force /tmp/org-wt
    expected: >-
      FILTERS OK -- 5 patterns x every fixture event, then EXIT 2 and exactly: 5 imports (the state bucket, aws_iam_user.org_admin_agent, aws_iam_user_policy, aws_iam_role,
      aws_iam_role_policy), each no-op or a tag update only; creates: 1 aws_organizations_organization, 1
      aws_iam_organizations_features, 2 aws_organizations_organizational_unit, 1 aws_organizations_policy (baseline), 1
      aws_organizations_policy_attachment (sit), 5 state-bucket settings (versioning, public-access block, encryption,
      ownership, policy), 1 aws_cloudtrail, 1 trail bucket with its 5 settings, 1 log group, 1 delivery role with its
      policy, 5 metric filters, 5 alarms, 1 topic, 1 subscription; 0 to destroy. The build confirms the create count
      against the merged code and posts COUNTS, the address list, FILTERS OK and EXIT on the PR with the head sha.
    fix_if: >-
      a delete or replace anywhere -- STOP; MISMATCH, or a Python traceback from a refused pattern or a throttled call
      -- fix the pattern in HCL (or the fixture if it does not carry CloudTrail's real shape), push, and re-run steps 1
      and 7 at the new head; never drop a clause silently and never fix a MISMATCH by excluding errored events (denied
      attempts must alarm); an imported IAM item's changed-attribute list names anything but tags or
      tags_all (the step prints attribute names, never values) -- the seed differs from the
      template: re-seed from the same sha, never edit the template to match a hand edit; EXIT 1 -- read
      /tmp/org-evidence/tf.err locally
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      After merge, on the operator's direction in the management environment: in a worktree at the literal path
      /tmp/org-merge/wt at the merge sha, a saved plan written to /tmp/org-merge/plan.bin with the tfvars beside it,
      both outside the worktree so it stays clean for the one-shot approval (protected-actions.yaml
      approval.one_shot_at_commit). Its counts are presented with the exact step 9 command and the line to write,
      "approve tf-state-change organization <merge sha>"; the worktree, plan.bin and the tfvars are kept for step 9.
      Nothing is applied here (Decision 126: plan, present).
    command: >-
      set -o pipefail; test -n "$MERGE_SHA" || { echo MERGE_SHA_UNSET; exit 1; }; git fetch -q origin main || { echo MAIN_FETCH_FAILED; exit 1; }; git merge-base --is-ancestor "$MERGE_SHA" origin/main || { echo MERGE_SHA_NOT_ON_MAIN; exit 1; }; R=$(tr -d '[:space:]' < config/aws-region); mkdir -p /tmp/org-merge;
      { git worktree remove --force /tmp/org-merge/wt 2> /dev/null; rm -rf /tmp/org-merge/wt; git worktree prune; git worktree add --detach /tmp/org-merge/wt "$MERGE_SHA" -q; } &&
      aws ssm get-parameter --profile agent_platform_admin_org --name /secret/agent-platform-terraform-organization-tfvars --with-decryption --query Parameter.Value --output text > /tmp/org-merge/terraform.organization.tfvars &&
      terraform -chdir=/tmp/org-merge/wt/terraform/organization init -input=false -backend-config="region=$R" > /dev/null 2>> /tmp/org-merge/tf.err &&
      terraform -chdir=/tmp/org-merge/wt/terraform/organization plan -input=false -no-color -detailed-exitcode -var-file=/tmp/org-merge/terraform.organization.tfvars -out=/tmp/org-merge/plan.bin 2>> /tmp/org-merge/tf.err | grep -E '^Plan:|No changes'; echo "MERGE_PLAN_EXIT ${PIPESTATUS[0]}";
      if ! test -d /tmp/org-merge/wt; then echo WORKTREE_ABSENT; elif git -C /tmp/org-merge/wt status --porcelain --untracked-files=all | grep -q .; then echo WORKTREE_DIRTY; else echo WORKTREE_CLEAN; fi
    expected: >-
      the Plan line equal to step 7's counts, MERGE_PLAN_EXIT 2 and WORKTREE_CLEAN; present them, the step 9 command
      and the approve line to the operator and wait for their word.
    fix_if: >-
      counts differ from step 7's, or MERGE_PLAN_EXIT 1 -- never run step 9; delete /tmp/org-merge and the worktree,
      present the difference and re-run step 7 at the merge sha (PR_HEAD_SHA=$MERGE_SHA); WORKTREE_DIRTY -- an init or plan wrote inside the
      worktree: clean it before asking, since the one-shot approval is refused on a dirty tree
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Only after step 8 printed matching counts and WORKTREE_CLEAN and the operator wrote "approve tf-state-change
      organization <merge sha>" in that session: apply the saved plan with -no-color, a fresh plan, cleanup. The apply
      names its root by the literal -chdir path, the form the protected-action gate resolves.
    command: >-
      terraform -chdir=/tmp/org-merge/wt/terraform/organization apply -input=false -no-color /tmp/org-merge/plan.bin 2>> /tmp/org-merge/tf.err | grep -E '^Apply complete!';
      terraform -chdir=/tmp/org-merge/wt/terraform/organization plan -input=false -no-color -detailed-exitcode -var-file=/tmp/org-merge/terraform.organization.tfvars > /dev/null 2>> /tmp/org-merge/tf.err; echo "ORG_PLAN_EXIT $?";
      rm -f /tmp/org-merge/plan.bin /tmp/org-merge/terraform.organization.tfvars; git worktree remove --force /tmp/org-merge/wt
    expected: >-
      "Apply complete!" with step 7's counts, then ORG_PLAN_EXIT 0. Record the merge sha and the lines as a counts-only
      comment on the merged PR.
    fix_if: the gate denies the apply (re-check WORKTREE_CLEAN and that the approve line names this merge sha); ORG_PLAN_EXIT 2 after the apply -- report on the PR and STOP; never apply again without a fresh step 8
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      Read-back in the management environment: feature set and SCP type, the root features, the two OUs, the policies
      on the sit OU, the trail logging, the alarms and the confirmed subscription (the operator clicks the confirmation
      e-mail first). Names, states and counts only; no --region override on any call that assumes the role.
    command: >-
      aws organizations describe-organization --profile agent_platform_admin_org --query 'Organization.FeatureSet' --output text;
      ROOT=$(aws organizations list-roots --profile agent_platform_admin_org --query 'Roots[0].Id' --output text);
      aws organizations list-roots --profile agent_platform_admin_org --query "Roots[0].PolicyTypes[?Type=='SERVICE_CONTROL_POLICY'].Status" --output text;
      aws iam list-organizations-features --profile agent_platform_admin_org --query 'EnabledFeatures' --output text;
      aws organizations list-organizational-units-for-parent --profile agent_platform_admin_org --parent-id "$ROOT" --query 'OrganizationalUnits[].Name' --output text;
      SIT_OU=$(aws organizations list-organizational-units-for-parent --profile agent_platform_admin_org --parent-id "$ROOT" --query "OrganizationalUnits[?Name=='sit'].Id" --output text);
      aws organizations list-policies-for-target --profile agent_platform_admin_org --target-id "$SIT_OU" --filter SERVICE_CONTROL_POLICY --query 'Policies[].Name' --output text;
      aws cloudtrail get-trail-status --profile agent_platform_admin_org --name agent-platform-org-security-trail --query IsLogging --output text;
      aws cloudwatch describe-alarms --profile agent_platform_admin_org --alarm-name-prefix agent-platform-org-security- --query 'length(MetricAlarms)' --output text;
      T=$(aws sns list-topics --profile agent_platform_admin_org --query "Topics[?ends_with(TopicArn, ':agent-platform-org-security-alerts')].TopicArn" --output text);
      aws sns list-subscriptions-by-topic --profile agent_platform_admin_org --topic-arn "$T" --query "length(Subscriptions[?SubscriptionArn!='PendingConfirmation'])" --output text
    expected: ALL; ENABLED; RootCredentialsManagement RootSessions (either order); prod sit (either order); FullAWSAccess baseline (either order); True; 5; 1. Post on the merged PR.
    fix_if: any value differs -- report it on the PR; a missing subscription confirmation is the operator's click
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: rec-5026 closed by the squash commit's Resolves trailer; read back from the build session in the default environment (the management environment has no agent_platform profile).
    command: bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5026']); print(rows[0]['id'], rows[0]['status'])"
    expected: rec-5026 closed
    fix_if: still open after the closure job ran -- read ci.yml's closure job log; never close by hand without the trailer evidence
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: terraform/organization/scps.tf
    behavior: the baseline denies leaving, long-term root (root sessions exempt), other regions and trail changes; stages are a subset; a size precondition exists
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_organization_baseline.py
    red_green_expectation: red before (file and root absent), green after
  - source: terraform/organization/organization.tf
