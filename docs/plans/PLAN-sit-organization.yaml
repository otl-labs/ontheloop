constraints:
  - "One admin act at a time across the project: no organization sitting beside a terraform/bootstrap apply (rec-5025's included), and no two organization sittings at once."
  - "Every out-of-Terraform act is named in organization_provisioning and runs only on the operator's direction in that session: create-bucket (step 7), invite (step 11), an emergency detach-policy (step 12). Removing PROD from the Organization, closing any account and minting or rotating the key are the operator's alone."
  - "PROD's roots never change here: after every stage terraform/bootstrap plans zero changes and the drift run is clean; a stage that breaks PROD is detached first, then reverted (forward fix only for the code)."
  - "PR 7 (SIT creation) applies only on the operator's words naming it, given after PR 6's battery is clean and step 14 passed."
  - "Never print or commit an account id, e-mail, the break-glass name, a key or a rendered policy (Decision 101, Decision 239): evidence is names, states, counts, booleans and shas; ids live only in shell variables."
  - "If the management environment cannot carry the key or reach the provider (step 5), STOP: the CloudShell route changes SIT Decision cl.7's actor and needs the operator's word and a new approval run."
  - No rescue agents or workaround loops (Decision 55).
context:
