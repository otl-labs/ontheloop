schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: sit-organization
intent: >-
  Stand up the foundation of the company AWS Organization under the SIT Decision (rec-5026): a new workload-free
  management account with its own admin lane, trail and alarms, the Organization with OUs for PROD and SIT, the
  baseline SCP on the SIT OU, centralized root access for member accounts, and the repo's guards for the new admin-only
  root. One PR and one admin apply. Creating the SIT account (rec-5064), PROD joining (rec-5065) and PROD's staged
  baseline (rec-5066) are child items, each planned on its own (Decision 247). It is the second T2.57 item.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-sit-organization.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-5026, which is T2.57 c4 once the rec-5024 build lands T2.57 in
  docs/ROADMAP-PLATFORM.yaml; the build re-reads that item at start and declares closes_criteria then.
scope:
  - file: terraform/organization/main.tf
    action: Create
    purpose: >-
      terraform block (required_version >= 1.10, hashicorp/aws ~> 5.0 as terraform/bootstrap, at a version that
      carries aws_iam_organizations_features) with backend "s3" bucket agent-platform-organization-tfstate, key
      terraform.tfstate, encrypt, use_lockfile, no region (Decision 202 cl.4; region at init by -backend-config).
      provider "aws" region = var.aws_region, profile = var.aws_profile, default_tags Project agent-platform, ManagedBy
      terraform-organization, Owner var.alerts_email. data aws_caller_identity for the management account id; no account
      id literal anywhere in the root (Decision 101).
  - file: terraform/organization/variables.tf
    action: Create
    purpose: >-
      aws_region (default equal to config/aws-region, the one pinned literal), aws_profile (default
      agent_platform_admin_org), and no-default sensitive alerts_email read from the gitignored
      terraform.organization.tfvars. The child plans add their own variables (member account ids and e-mails, the
      break-glass name). No ExternalId variable: the management key is held by one environment only.
  - file: terraform/organization/organization.tf
    action: Create
    purpose: >-
      aws_organizations_organization (feature_set ALL, enabled_policy_types [SERVICE_CONTROL_POLICY],
      aws_service_access_principals ["iam.amazonaws.com"] for centralized root access), with prevent_destroy;
      aws_iam_organizations_features with enabled_features [RootCredentialsManagement, RootSessions], so member accounts
      the Organization creates have no root credentials and a root-only task runs from the management account as a
      scoped root session (operator's 2026-11-11 card choice); aws_organizations_organizational_unit prod and sit under
      the root, each with prevent_destroy. FullAWSAccess stays attached where AWS puts it.
  - file: terraform/organization/scps.tf
    action: Create
    purpose: >-
      local.baseline_statements, a map of four statements keyed deny_leave_organization (Deny
      organizations:LeaveOrganization), deny_root_user (Deny * when aws:PrincipalArn is like arn:aws:iam::*:root),
      protect_cloudtrail (Deny cloudtrail:StopLogging, DeleteTrail, UpdateTrail, PutEventSelectors,
      PutInsightSelectors, CreateTrail and logs:DeleteLogGroup, DeleteMetricFilter, PutRetentionPolicy on log groups
      named platform-security-*, unless aws:PrincipalArn is like arn:aws:iam::*:role/PlatformAdmin and
      aws:PrincipalAccount is the PROD account id, a variable the PROD-joining plan adds; reads are never denied) and
      deny_other_regions (Deny NotAction local.global_actions when aws:RequestedRegion is not var.aws_region).
      local.global_actions is AWS's published region-deny NotAction list (iam, organizations, sts, support, account,
      billing and the other global services); sts:* is always in it. aws_organizations_policy baseline (all four
      statements) attached to the sit OU, so any account created later starts under it. local.prod_baseline_stages is
      an empty list here; the PROD baseline plan (rec-5066) creates baseline_prod from it one key at a time. Policy
      content via jsonencode, no conditional or comparison operator beyond for_each filtering, and a lifecycle
      precondition that length(jsonencode(...)) of the baseline content is at most 5,120 (the SCP size limit; Decision
      156's precondition pattern). In this PR protect_cloudtrail's exemption is a placeholder that no principal in the
      sit OU matches (the PROD account variable defaults to an empty set): SIT has no PlatformAdmin yet, so nothing
      there is exempt.
  - file: terraform/organization/accounts.tf
    action: Create
    purpose: >-
      Only a comment naming the child items that add resources here: rec-5064 (the SIT account) and rec-5065 (PROD's
      membership import).
  - file: terraform/organization/state_bucket.tf
    action: Create
    purpose: >-
      import block and aws_s3_bucket for agent-platform-organization-tfstate (created by step 6's CLI call,
      prevent_destroy), plus versioning Enabled, public-access block (all four true), SSE-S3 default encryption,
      ownership BucketOwnerEnforced and a bucket policy denying non-TLS access, each created by Terraform.
  - file: terraform/organization/management_admin.tf
    action: Create
    purpose: >-
      import blocks plus aws_iam_user org-admin-agent, aws_iam_user_policy AssumeOrganizationAdmin (only
      sts:AssumeRole on the OrganizationAdmin role), aws_iam_role OrganizationAdmin (trust: that user only,
      max_session_duration 3600) and aws_iam_role_policy OrganizationAdminOps, all seeded by the operator in step 4 from
      the same templates. Each policy and the trust document is try(templatefile("${path.module}/policies/<name>.json.tftpl",
      {...}), <a single explicit Deny * statement>) so a missing template fails closed. No aws_iam_access_key and no
      access-key verb anywhere (Decision 237: the key is minted out of band).
  - file: terraform/organization/policies/organization_admin.json.tftpl
    action: Create
    purpose: >-
      OrganizationAdminOps, the narrow management grant for this foundation: organizations Describe* and List* on
      Resource "*" (they take no resource ARN) and CreateOrganization, EnablePolicyType, EnableAWSServiceAccess for
      iam.amazonaws.com only, CreateOrganizationalUnit, UpdateOrganizationalUnit, CreatePolicy, UpdatePolicy,
      AttachPolicy, DetachPolicy, TagResource, UntagResource; iam:CreateServiceLinkedRole only for
      organizations.amazonaws.com; iam:EnableOrganizationsRootCredentialsManagement, EnableOrganizationsRootSessions
      and ListOrganizationsFeatures; iam:GetAccountSummary; its state bucket and trail bucket; on its trail exactly
      Decision 202 cl.2's six verbs (CreateTrail, UpdateTrail, PutEventSelectors, StartLogging, AddTags, RemoveTags)
      plus DescribeTrails and GetTrailStatus on Resource "*" (read verbs that take no ARN); logs CreateLogGroup,
      PutRetentionPolicy, PutMetricFilter and Describe* on its own log group; cloudwatch PutMetricAlarm and
      DescribeAlarms; sns CreateTopic, Subscribe, SetTopicAttributes, GetTopicAttributes and ListSubscriptions*; all
      on names with the prefix agent-platform-org-security-. No StopLogging, DeleteTrail, cloudtrail:* or any Delete*
      on cloudtrail, logs, sns or cloudwatch. iam on itself only for refresh (Get*/List* on the user, the role, their
      policies and the trail's log-delivery role) and Put/Update of the two inline policies and PassRole of the
      delivery role to cloudtrail.amazonaws.com; ssm GetParameter on its tfvars parameter. Never
      DeleteOrganization, RemoveAccountFromOrganization, CloseAccount, LeaveOrganization, DeletePolicy,
      DeleteOrganizationalUnit or any access-key verb: those stay the operator's. Each child plan adds only the verbs its
      own PR needs. Placeholders only (${account_id}, ${region}); no literal account id.
  - file: terraform/organization/policies/organization_admin_trust.json.tftpl
    action: Create
    purpose: "Trust of OrganizationAdmin: Principal the org-admin-agent user ARN built from ${account_id}; no other principal."
  - file: terraform/organization/policies/assume_organization_admin.json.tftpl
    action: Create
    purpose: "The user's only policy: sts:AssumeRole on the OrganizationAdmin role ARN built from ${account_id}."
  - file: terraform/organization/trail.tf
    action: Create
    purpose: >-
      The management account's own trail agent-platform-org-security-trail (not an organisation trail): multi-region,
      global service events on, log file validation on, homed in var.aws_region, delivering to bucket
      agent-platform-org-security-trail-<management account id>-<region> (56 characters, under S3's 63; built from data
      sources at plan time, the PROD trail's pattern; prevent_destroy, versioning, public-access block, SSE-S3, lifecycle
      as PROD's trail) and to CloudWatch Logs group agent-platform-org-security-cloudtrail (retention as PROD's) through a
      log-delivery role. Metric filters and alarms, each to SNS topic agent-platform-org-security-alerts with an e-mail
      subscription to var.alerts_email: admin role assumed (AssumeRole of OrganizationAdmin, so every sitting alarms by
      design); the admin user acting other than AssumeRole and GetCallerIdentity (the proxy re-signs the provider's
      identity call as the user, which is not a misuse); an IAM change by the management admin identities
      (PutRolePolicy, PutUserPolicy, AttachRolePolicy, AttachUserPolicy, CreateAccessKey, UpdateAssumeRolePolicy), so a
      self-grant is its own alarm and not hidden in the every-sitting one; root activity (userIdentity.type Root
      outside AWS service events); and trail tampering (StopLogging, DeleteTrail, UpdateTrail, PutEventSelectors). Names
      sit under the agent-platform-* family Decision 101(b) freezes, so no new name family is authorised.
  - file: terraform/organization/CLAUDE.md
    action: Create
    purpose: >-
      The procedure for this root (deploy-paths.yaml organization_provisioning names it): the management environment's
      setup (setup-script field writing ~/.aws/config with agent_static and agent_platform_admin_org,
      AWS_PROFILE=agent_platform_admin_org, the network secret holding only the management key for the project region's
      STS host); the operator's CloudShell seed commands, which fetch the three templates from the PR head sha of this
      public repository and render ${account_id} and ${region} with sed; tfvars from the SSM parameter into
      /tmp/org-merge, outside any worktree; the sitting order (steps 4-12) and the counts-only read-backs; the STS rule
      (no --region override on a call that assumes the role; a second-region identity read through
      scripts.aws_identity); that a root-only task in a member account runs as a centralized root session from this
      account; and the emergency detach (aws organizations detach-policy, then a PR to match). Never names an account
      id, e-mail or the break-glass name.
  - file: scripts/session/protected_action_match.py
    action: Modify
    new_imports: []
    purpose: >-
      fast_path_ok treats every profile whose name starts with agent_platform_admin as an admin ambient (today it
      hard-codes the one name agent_platform_admin), so in the management environment, whose ambient AWS_PROFILE is
      agent_platform_admin_org, a bare aws or terraform command is classified, never fast-pathed (critique r1 B1).
  - file: .claude/hooks/protected_action_gate.py
    action: Modify
    purpose: >-
      The deny message omits the "Self-serve fix: re-run with AWS_PROFILE=agent_platform" line when the ambient profile is
      agent_platform_admin_org: the management environment has no self-serve profile, so the hint would name one that
      does not exist there.
  - file: tests/hooks/test_protected_action_gate.py
    action: Modify
    purpose: >-
      With ambient AWS_PROFILE=agent_platform_admin_org, a bare aws s3 ls exits 2 naming admin-credential, and its deny
      message carries no self-serve line; with ambient agent_platform_admin the self-serve line stays.
  - file: .gitignore
    action: Modify
    purpose: Ignore terraform/**/terraform.organization.tfvars (lock files are already ignored by terraform/**/.terraform.lock.hcl).
  - file: .github/CODEOWNERS
    action: Modify
    purpose: /terraform/organization/ @benjamin-blake beside /terraform/bootstrap/.
  - file: config/agent/verification_registry/entries/codeowners-covers-gate-paths.yaml
    action: Modify
    purpose: The required-path list gains /terraform/organization/ (a tightening; nothing loosened).
  - file: scripts/checks/_terraform.py
    action: Modify
    new_imports: []
    purpose: _TERRAFORM_ROOTS gains terraform/organization, so the credential-free init -backend=false, validate and fmt run on it in the full tier and the terraform-validate job.
  - file: tests/validate/test_terraform_checks.py
    action: Modify
    purpose: The expected -chdir list gains terraform/organization.
  - file: scripts/checks/ci_guards/validate_project_region.py
    action: Modify
    new_imports: []
    purpose: >-
      _PINNED_VAR_FILES gains terraform/organization/variables.tf, so its aws_region default must equal config/aws-region
      and every other region literal under the root fails; the R3 docstring's root list names the new root.
  - file: tests/checks/ci_guards/test_validate_project_region.py
    action: Modify
    purpose: A case that terraform/organization/variables.tf is pinned (a mismatched default is red) and the real tree is green.
  - file: docs/contracts/protected-actions.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks protected-live-roots, protected-admin-profiles, protected-target and protected-log, the
      last being a new amendment_log entry (docs/plans/approved/sit-organization.yaml). terraform/organization is not
      added to admin_default_roots: that list's hit names admin_profiles[0] (agent_platform_admin, PROD's profile) as
      the approve target, and in the management environment rule (3) already classifies every call that contacts AWS
      by the ambient agent_platform_admin_org (critique r1 N8).
  - file: tests/test_session_protected_action_match.py
    action: Modify
    purpose: >-
      terraform -chdir=terraform/organization apply is tf-state-change with target organization; --profile
      agent_platform_admin_org is admin-credential with that target; a terraform plan on terraform/organization under
      ambient agent_platform_admin_org is admin-credential with target agent_platform_admin_org; fast_path_ok is False
      for aws s3 ls under ambient agent_platform_admin_org.
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: Exactly the sidecar blocks taxonomy-organization-row and taxonomy-log (a new amendment_log entry).
  - file: tests/checks/verification/test_validate_admin_root_premerge_gate.py
    action: Modify
    purpose: >-
      Exactly the sidecar block premerge-gate-test-fixture (the synthetic _TAXONOMY gains a non-admin organization row,
      since the real protected-actions.yaml's new live root must map to an axis row in every fixture), plus a real-tree
      case that the real taxonomy derives both terraform/bootstrap and terraform/organization as admin-only roots and
      both are in gate.live_roots.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks deploy-paths-organization-row, deploy-paths-premerge-roots, deploy-paths-env-check and
      deploy-paths-log (a new amendment_log entry). The file is at its 500-effective-line cap (contracts class,
      config/structural_size_budgets.yaml): the env-check block collapses eight lines to one and the row adds four, so
      the file nets about -3; the build writes each new scalar on one line and never raises the budget (Decision 128).
  - file: docs/contracts/account-credential-inventory.yaml
    action: Modify
    purpose: >-
      Exactly the sidecar blocks inventory-organization-rows (AWS-12 company; AWS-13 to AWS-15 follow AWS-12),
      inventory-ledger (AWS-12's evidence_ledger entry, citing step 4) and inventory-log (a new amendment_log entry).
  - file: docs/DECISIONS.md
    action: Modify
    purpose: Exactly the sidecar block decision-113-note (Decision 113's reversal reconsidered; the management lane).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      T2.57 c4 text becomes "rec-5026: the Organization, its management account with its own admin lane, trail and
      alarms, the OUs, centralized root access and the SIT OU's baseline SCP exist." and flips met in this PR's
      bookkeeping walk on the pre-deploy evidence (V3 resolution line). T2.57 gains, all open: c9 "rec-5058: the RDS
      apply-guard row and boundary denies are in force before any plan creates an aws_db_* resource."; c10 "rec-5059:
      the organisation trail replaces PROD's account trail, with the IAM-change detector moved onto it."; c11
      "rec-5064: the SIT account exists in the SIT OU under the baseline, with no root credentials."; c12 "rec-5065:
      PROD is a member of the Organization in the PROD OU."; c13 "rec-5066: PROD carries the full baseline SCP,
      attached one statement at a time with PROD's checks clean after each."
  - file: config/prose_budgets.yaml
    action: Modify
    purpose: Register terraform/organization/CLAUDE.md at its measured size (a new entry under the cap; no raise marker).
  - file: tests/checks/iam_tf/test_organization_baseline.py
    action: Create
    purpose: >-
      Text tests over terraform/organization (rec-5026's acceptance node test_baseline_scps_deny_leaving_the_organization
      first): the baseline holds each of the four statements; the sit OU attaches baseline; prod_baseline_stages is a
      list whose every key is a baseline key; global_actions contains sts:*, iam:*, organizations:* and support:*;
      protect_cloudtrail's exemption pins aws:PrincipalAccount and denies no read verb; a size precondition exists on the
      baseline policy; aws_service_access_principals holds iam.amazonaws.com and aws_iam_organizations_features enables
      both root features; no aws_iam_access_key resource and no access-key verb in any template; OrganizationAdminOps
      grants none of the operator-only verbs, no StopLogging, DeleteTrail or cloudtrail:*, and no Delete* on cloudtrail,
      logs, sns or cloudwatch, and its trail verbs are exactly Decision 202 cl.2's six plus the two reads; every
      templatefile call sits inside try() with a Deny-all fallback; every resource name starts agent-platform- or is
      an IAM name the root owns (org-admin-agent, OrganizationAdmin); no 12-digit literal, e-mail or region literal
      outside variables.tf's default; each aws_organizations_* resource has prevent_destroy; the tfvars file is ignored
      (git check-ignore) and CODEOWNERS names the root.
bundled_recommendations: [rec-5026]
followon_recs: [rec-5059, rec-5064, rec-5065, rec-5066]
infrastructure_dependencies:
  - "A new management account, signed up by the operator (company mailbox root e-mail, root MFA, company payment and tax), and its admin user, key and role seeded by the operator (step 4); both precede the pre-merge plan."
  - "A new cloud environment used only for Organization sittings, holding only the management key as its AWS network secret (operator's card choice, re-chosen 2026-11-11 12:37Z); probed in step 4 before anything relies on it."
  - "terraform/organization: one admin-tier apply (Decision 252 cl.7, Decision 248 cl.6) from that environment after the pre-merge plan."
  - "PROD (today's account) is not touched: it is not invited here, and terraform/bootstrap and terraform/personal are untouched."
  - "Running cost: about $0.60 a month (five alarms at $0.10, CloudWatch Logs and S3 for a near-idle management trail, the state bucket); Organizations, SCPs, centralized root access, the SSM standard parameter and the OUs are free."
acceptance_criteria:
  - "rec-5026's acceptance node, tests/checks/iam_tf/test_organization_baseline.py::test_baseline_scps_deny_leaving_the_organization, passes, with every other case in that file (step 1)."
  - "The bound files hold exactly the sidecar's words (validate_merge_step green on the PR against the operator's approval run; step 3)."
  - "protected-actions.yaml, environment-taxonomy.yaml and deploy-paths.yaml treat terraform/organization as an admin-only live root with the management profile, the hook classifies every aws or terraform call under that ambient profile, and their tests say so (step 2)."
  - "From the management environment the session's identity is the assumed OrganizationAdmin role, the management account's root MFA is on, the Organizations endpoint answers and the provider initialises at the PR head (step 4)."
  - "After the apply: the Organization has feature set ALL with SCPs enabled, iam.amazonaws.com trusted access and both root features on, OUs prod and sit, baseline attached to sit, the trail logging and five alarms present with a confirmed subscription, and a fresh plan exits 0 (steps 8-10)."
  - "T2.57 c4 reads met in the PR on acceptance criteria 1-4 and the step 7 plan; rec-5026 reads closed with its closure trailer after merge (step 11)."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The new text tests over terraform/organization, rec-5026's acceptance node first. The file is absent on main, so
      it is red before.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_organization_baseline.py -q
    expected: exit 0; red before (file absent on main).
    fix_if: a guard case fails on the real tree -- fix the HCL or template, never the assertion
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: organization-baseline
  - step: 2
    phase: pre-deploy
    action: The contract, hook, region, root-list and CODEOWNERS tests this PR touches, plus the iam_tf and ci_guards suites.
    command: bin/venv-python -m pytest tests/test_session_protected_action_match.py tests/hooks/test_protected_action_gate.py tests/checks/verification/test_validate_admin_root_premerge_gate.py tests/checks/ci_guards/test_validate_project_region.py tests/validate/test_terraform_checks.py tests/checks/iam_tf tests/checks/ci_guards -q
    expected: exit 0
    fix_if: a node fails -- read whether the change or the node is wrong; never loosen an assertion (Decision 235), and a node needing more than the scope rows is a plan defect
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: Pre-existing suites that already run in both tiers through their own shards; the new hook and matcher cases sit beside them, and step 1's new shard carries the root's behaviour.
  - step: 3
    phase: pre-deploy
    action: >-
      Credential-free init, validate and fmt of the new root, the bound-words check, then the fast tier; then the full
      tier before handoff, started backgrounded with a 2 h limit from the top-level session and read on its completion
      with validation_result --verify-head. Not hermetic: the pr-validate runner has no terraform binary.
    command: >-
      TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir=terraform/organization init -backend=false -input=false > /dev/null && terraform -chdir=terraform/organization validate -no-color && terraform fmt -check -recursive terraform/organization && bin/venv-python -m scripts.roadmap.approved_text verify --slug sit-organization &&
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      exit 0; validate prints "Success! The configuration is valid."; fmt lists nothing; approved_text verify exits 0;
      then the fast tier and the full tier with validation_result --verify-head exit 0 for HEAD.
    fix_if: validate names an attribute (fix the HCL); verify names a block (place the sidecar's words exactly); the mirror lacks the aws provider version that carries aws_iam_organizations_features (pin the newest mirrored 5.x that does, or stop and report)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The terraform-validate job runs init, validate and fmt on every _TERRAFORM_ROOTS member, and validate_merge_step binds the words in PR CI.
  - step: 4
    phase: pre-deploy
    action: >-
      The operator's acts, then the agent's probe. Operator, before any agent sitting (always_ask admin steps; each is
      theirs): sign up the management account with its company-mailbox root e-mail, root MFA on, company payment method
      and tax settings; in its CloudShell (root with MFA) run the seed commands terraform/organization/CLAUDE.md gives at
      the PR head sha (user org-admin-agent and its access key, its AssumeOrganizationAdmin policy, role OrganizationAdmin
      with the rendered trust and OrganizationAdminOps, the tfvars as SSM SecureString
      /secret/agent-platform-terraform-organization-tfvars); create the management cloud environment with that key as its
      only AWS network secret (host sts.<project region>.amazonaws.com) and the setup-script field and AWS_PROFILE the
      CLAUDE.md gives. Then, in a session in that environment whose first status reports its [hook_canary] line (the gate
      is the binding control there), the agent runs the ENVIRONMENT CHECK (deploy-paths.yaml pre_merge_live_plan), the
      root-MFA read, an Organizations reachability probe and a provider init in a worktree at the PR head (main has no
      terraform/organization before merge).
    command: >-
      bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin_org 2>/dev/null | grep -q 'assumed-role/OrganizationAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT;
      aws iam get-account-summary --profile agent_platform_admin_org --query 'SummaryMap.AccountMFAEnabled' --output text | sed 's/^/ROOT_MFA /';
      aws organizations describe-organization --profile agent_platform_admin_org > /dev/null 2> /tmp/org-probe.err; grep -q -e AWSOrganizationsNotInUseException -e '^$' /tmp/org-probe.err && echo ORG_ENDPOINT_OK || echo ORG_ENDPOINT_BLOCKED;
      test -n "$PR_HEAD_SHA" && { git worktree remove --force /tmp/org-probe-wt 2> /dev/null; git worktree add --detach /tmp/org-probe-wt "$PR_HEAD_SHA" -q; } &&
      terraform -chdir=/tmp/org-probe-wt/terraform/organization init -backend=false -input=false > /dev/null 2>&1 && echo PROVIDER_OK || echo PROVIDER_BLOCKED; git worktree remove --force /tmp/org-probe-wt; rm -f /tmp/org-probe.err
    expected: >-
      ADMIN_CHAIN_OK, ROOT_MFA 1, ORG_ENDPOINT_OK and PROVIDER_OK. On ADMIN_CHAIN_ABSENT in the management environment,
      ORG_ENDPOINT_BLOCKED or PROVIDER_BLOCKED (the environment's network policy does not reach the Organizations
      endpoint or the Terraform registry; the PROD provider mirror is not readable from here by design), STOP: the
      CloudShell fallback changes who applies (Decision 252 cl.7 wording), so it needs the operator's word and a new
      approval run; it is never taken silently.
    fix_if: ADMIN_CHAIN_ABSENT -- check the network secret's host and the profile's role name; ROOT_MFA 0 -- the operator's sign-up step is not done; ORG_ENDPOINT_BLOCKED or PROVIDER_BLOCKED -- the operator adds the hosts to that environment's network policy
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Read the management account id into a shell variable for the bucket-owner checks, never printing it.
    command: export MGMT_ID=$(aws sts get-caller-identity --profile agent_platform_admin_org --query Account --output text) && test -n "$MGMT_ID" && echo MGMT_ID_SET
    expected: MGMT_ID_SET (an account-id read is exempt from the second-region identity rule; no --region override).
    fix_if: empty -- re-run step 4's ENVIRONMENT CHECK
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      State bucket, on the operator's direction in the management environment: one create-bucket in the project region
      and a read-back that checks the owner. The import block then adopts it, so no local state ever exists.
    command: >-
      R=$(tr -d '[:space:]' < config/aws-region); B=agent-platform-organization-tfstate;
      aws s3api create-bucket --profile agent_platform_admin_org --bucket $B --create-bucket-configuration LocationConstraint=$R > /dev/null 2> /tmp/org-bucket.err;
      grep -q BucketAlreadyExists /tmp/org-bucket.err && echo BUCKET_TAKEN;
      aws s3api get-bucket-location --profile agent_platform_admin_org --bucket $B --expected-bucket-owner "$MGMT_ID" --query LocationConstraint --output text; rm -f /tmp/org-bucket.err
    expected: The project region printed and no BUCKET_TAKEN. BucketAlreadyOwnedByYou on a re-run is fine.
    fix_if: BUCKET_TAKEN, or the owner check fails -- STOP; the name is taken globally and the plan's backend name needs an amendment
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      Pre-merge read-only admin plan of terraform/organization (deploy-paths.yaml pre_merge_live_plan) at the CI-green
      $PR_HEAD_SHA, in the management environment on the operator's direction, in a worktree at the literal path
      /tmp/org-wt with the tfvars and plan file in /tmp/org-evidence outside it, -lock=false, plan file deleted in the
      step; counts and addresses only on the PR with the head sha. There is no origin/main plan (the root is new).
    command: >-
      set -o pipefail; R=$(tr -d '[:space:]' < config/aws-region); E=/tmp/org-evidence; rm -rf "$E"; mkdir -p "$E";
      { git worktree remove --force /tmp/org-wt 2> /dev/null; git worktree prune; git worktree add --detach /tmp/org-wt "$PR_HEAD_SHA" -q; } &&
      aws ssm get-parameter --profile agent_platform_admin_org --name /secret/agent-platform-terraform-organization-tfvars --with-decryption --query Parameter.Value --output text > "$E/terraform.organization.tfvars" &&
      terraform -chdir=/tmp/org-wt/terraform/organization init -input=false -backend-config="region=$R" > /dev/null 2>> "$E/tf.err" &&
      terraform -chdir=/tmp/org-wt/terraform/organization plan -input=false -no-color -lock=false -detailed-exitcode -var-file="$E/terraform.organization.tfvars" -out="$E/p.bin" > /dev/null 2>> "$E/tf.err"; rc=$?;
      terraform -chdir=/tmp/org-wt/terraform/organization show -json "$E/p.bin" 2>/dev/null | bin/venv-python -c "import json,sys,collections; p=json.load(sys.stdin); c=collections.Counter(); [c.update(['import']) if r['change'].get('importing') else c.update(['+'.join(r['change']['actions'])]) for r in p.get('resource_changes', [])]; print('COUNTS', dict(c)); [print(r['change']['actions'], r['address']) for r in p.get('resource_changes', []) if r['change']['actions'] != ['no-op']]";
      echo "EXIT $rc"; rm -f "$E/p.bin" "$E/terraform.organization.tfvars"; git worktree remove --force /tmp/org-wt
    expected: >-
      EXIT 2 and exactly: 5 imports (the state bucket, aws_iam_user.org_admin_agent, aws_iam_user_policy, aws_iam_role,
      aws_iam_role_policy), each no-op or a tag update only; creates: 1 aws_organizations_organization, 1
      aws_iam_organizations_features, 2 aws_organizations_organizational_unit, 1 aws_organizations_policy (baseline), 1
      aws_organizations_policy_attachment (sit), 5 state-bucket settings (versioning, public-access block, encryption,
      ownership, policy), 1 aws_cloudtrail, 1 trail bucket with its 5 settings, 1 log group, 1 delivery role with its
      policy, 5 metric filters, 5 alarms, 1 topic, 1 subscription; 0 to destroy. The build confirms the create count
      against the merged code and posts COUNTS, the address list and EXIT on the PR with the head sha.
    fix_if: >-
      a delete or replace anywhere -- STOP; an imported IAM item shows a policy change -- the seed differs from the
      template: re-seed from the same sha, never edit the template to match a hand edit; EXIT 1 -- read
      /tmp/org-evidence/tf.err locally
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      After merge, on the operator's direction in the management environment: in a worktree at the literal path
      /tmp/org-merge/wt at the merge sha, a saved plan written to /tmp/org-merge/plan.bin with the tfvars beside it,
      both outside the worktree so it stays clean for the one-shot approval (protected-actions.yaml
      approval.one_shot_at_commit). Its counts are presented with the exact step 9 command and the line to write,
      "approve tf-state-change organization <merge sha>"; the worktree, plan.bin and the tfvars are kept for step 9.
      Nothing is applied here (Decision 126: plan, present).
    command: >-
      set -o pipefail; test -n "$MERGE_SHA" || { echo MERGE_SHA_UNSET; exit 1; }; R=$(tr -d '[:space:]' < config/aws-region); mkdir -p /tmp/org-merge;
      { git worktree remove --force /tmp/org-merge/wt 2> /dev/null; rm -rf /tmp/org-merge/wt; git worktree prune; git worktree add --detach /tmp/org-merge/wt "$MERGE_SHA" -q; } &&
      aws ssm get-parameter --profile agent_platform_admin_org --name /secret/agent-platform-terraform-organization-tfvars --with-decryption --query Parameter.Value --output text > /tmp/org-merge/terraform.organization.tfvars &&
      terraform -chdir=/tmp/org-merge/wt/terraform/organization init -input=false -backend-config="region=$R" > /dev/null 2>> /tmp/org-merge/tf.err &&
      terraform -chdir=/tmp/org-merge/wt/terraform/organization plan -input=false -no-color -detailed-exitcode -var-file=/tmp/org-merge/terraform.organization.tfvars -out=/tmp/org-merge/plan.bin 2>> /tmp/org-merge/tf.err | grep -E '^Plan:|No changes'; echo "MERGE_PLAN_EXIT ${PIPESTATUS[0]}";
      git -C /tmp/org-merge/wt status --porcelain --untracked-files=all | grep -q . && echo WORKTREE_DIRTY || echo WORKTREE_CLEAN
    expected: >-
      the Plan line equal to step 7's counts, MERGE_PLAN_EXIT 2 and WORKTREE_CLEAN; present them, the step 9 command
      and the approve line to the operator and wait for their word.
    fix_if: >-
      counts differ from step 7's, or MERGE_PLAN_EXIT 1 -- never run step 9; delete /tmp/org-merge and the worktree,
      present the difference and re-run step 7 at the merge sha; WORKTREE_DIRTY -- an init or plan wrote inside the
      worktree: clean it before asking, since the one-shot approval is refused on a dirty tree
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Only after step 8 printed matching counts and WORKTREE_CLEAN and the operator wrote "approve tf-state-change
      organization <merge sha>" in that session: apply the saved plan with -no-color, a fresh plan, cleanup. The apply
      names its root by the literal -chdir path, the form the protected-action gate resolves.
    command: >-
      terraform -chdir=/tmp/org-merge/wt/terraform/organization apply -input=false -no-color /tmp/org-merge/plan.bin 2>> /tmp/org-merge/tf.err | grep -E '^Apply complete!';
      terraform -chdir=/tmp/org-merge/wt/terraform/organization plan -input=false -no-color -detailed-exitcode -var-file=/tmp/org-merge/terraform.organization.tfvars > /dev/null 2>> /tmp/org-merge/tf.err; echo "ORG_PLAN_EXIT $?";
      rm -f /tmp/org-merge/plan.bin /tmp/org-merge/terraform.organization.tfvars; git worktree remove --force /tmp/org-merge/wt
    expected: >-
      "Apply complete!" with step 7's counts, then ORG_PLAN_EXIT 0. Record the merge sha and the lines as a counts-only
      comment on the merged PR.
    fix_if: the gate denies the apply (re-check WORKTREE_CLEAN and that the approve line names this merge sha); ORG_PLAN_EXIT 2 after the apply -- report on the PR and STOP; never apply again without a fresh step 8
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: >-
      Read-back in the management environment: feature set and SCP type, the root features, the two OUs, the policies
      on the sit OU, the trail logging, the alarms and the confirmed subscription (the operator clicks the confirmation
      e-mail first). Names, states and counts only; no --region override on any call that assumes the role.
    command: >-
      P=agent_platform_admin_org;
      aws organizations describe-organization --profile $P --query 'Organization.FeatureSet' --output text;
      ROOT=$(aws organizations list-roots --profile $P --query 'Roots[0].Id' --output text);
      aws organizations list-roots --profile $P --query "Roots[0].PolicyTypes[?Type=='SERVICE_CONTROL_POLICY'].Status" --output text;
      aws iam list-organizations-features --profile $P --query 'EnabledFeatures' --output text;
      aws organizations list-organizational-units-for-parent --profile $P --parent-id "$ROOT" --query 'OrganizationalUnits[].Name' --output text;
      SIT_OU=$(aws organizations list-organizational-units-for-parent --profile $P --parent-id "$ROOT" --query "OrganizationalUnits[?Name=='sit'].Id" --output text);
      aws organizations list-policies-for-target --profile $P --target-id "$SIT_OU" --filter SERVICE_CONTROL_POLICY --query 'Policies[].Name' --output text;
      aws cloudtrail get-trail-status --profile $P --name agent-platform-org-security-trail --query IsLogging --output text;
      aws cloudwatch describe-alarms --profile $P --alarm-name-prefix agent-platform-org-security- --query 'length(MetricAlarms)' --output text;
      aws sns list-subscriptions --profile $P --query "length(Subscriptions[?contains(TopicArn, 'agent-platform-org-security-alerts') && SubscriptionArn!='PendingConfirmation'])" --output text
    expected: ALL; ENABLED; RootCredentialsManagement RootSessions (either order); prod sit (either order); FullAWSAccess baseline (either order); True; 5; 1. Post on the merged PR.
    fix_if: any value differs -- report it on the PR; a missing subscription confirmation is the operator's click
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: rec-5026 closed by the squash commit's Resolves trailer; read back.
    command: bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5026']); print(rows[0]['id'], rows[0]['status'])"
    expected: rec-5026 closed
    fix_if: still open after the closure job ran -- read ci.yml's closure job log; never close by hand without the trailer evidence
    hermetic: false
    graduation: not-applicable
