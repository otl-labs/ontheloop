schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: sit-organization
intent: >-
  Stand up the foundation of the company AWS Organization under the SIT Decision (rec-5026): a new workload-free
  management account with its own admin lane, trail and alarms, the Organization with OUs for PROD and SIT, the
  baseline SCP on the SIT OU, centralized root access for member accounts, and the repo's guards for the new admin-only
  root. One PR and one admin apply. Creating the SIT account (rec-5064), PROD joining (rec-5065) and PROD's staged
  baseline (rec-5066) are child items, each planned on its own (Decision 247). It is the second T2.57 item.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-sit-organization.yaml
phase: >-
  T2.57 (SIT environment), c4 (rec-5026); T2.57 landed on main with the rec-5024 build (#1957, 6f71e367,
  2026-11-11), so this plan declares the criterion now. Closes T2.57 c4 only.
closes_criteria: [T2.57:c4]
scope:
  - file: terraform/organization/main.tf
    action: Create
    purpose: >-
      terraform block (required_version >= 1.10, hashicorp/aws ~> 5.0 as terraform/bootstrap, at a version that
      carries aws_iam_organizations_features) with backend "s3" bucket agent-platform-organization-tfstate, key
      terraform.tfstate, encrypt, use_lockfile, no region (Decision 202 cl.4; region at init by -backend-config).
      provider "aws" region = var.aws_region, profile = var.aws_profile, default_tags Project agent-platform, ManagedBy
      terraform-organization, Owner var.alerts_email. data aws_caller_identity for the management account id; no account
      id literal anywhere in the root (Decision 101).
  - file: terraform/organization/variables.tf
    action: Create
    purpose: >-
      aws_region (default equal to config/aws-region, the one pinned literal), aws_profile (default
      agent_platform_admin_org), and no-default sensitive alerts_email read from the gitignored
      terraform.organization.tfvars. The child plans add their own variables (member account ids and e-mails, the
      break-glass name). No ExternalId variable: the management key is held by one environment only.
  - file: terraform/organization/organization.tf
    action: Create
    purpose: >-
      aws_organizations_organization (feature_set ALL, enabled_policy_types [SERVICE_CONTROL_POLICY],
      aws_service_access_principals ["iam.amazonaws.com"] for centralized root access), with prevent_destroy;
      aws_iam_organizations_features with enabled_features [RootCredentialsManagement, RootSessions], so member accounts
      the Organization creates have no root credentials and a root-only task runs from the management account as a
      scoped root session (operator's 2026-11-11 card choice); aws_organizations_organizational_unit prod and sit under
      the root, each with prevent_destroy. aws_iam_organizations_features carries an explicit depends_on
      aws_organizations_organization, since it needs IAM trusted access enabled first. FullAWSAccess stays attached
      where AWS puts it.
  - file: terraform/organization/scps.tf
    action: Create
    purpose: >-
      local.baseline_statements, a map of four statements keyed deny_leave_organization (Deny
      organizations:LeaveOrganization), deny_root_user (Deny * when aws:PrincipalArn is like arn:aws:iam::*:root and aws:AssumedRoot
      is absent, Null "true": AWS's documented form, which denies long-term root credentials but leaves a centralized
      root session its scoped tasks; without it the sit OU's baseline would block the RootSessions feature this plan
      enables),
      protect_cloudtrail (Deny cloudtrail:StopLogging, DeleteTrail, UpdateTrail, PutEventSelectors,
      PutInsightSelectors, CreateTrail and logs:DeleteLogGroup, DeleteMetricFilter, PutRetentionPolicy on log groups
      named platform-security-*, with no exemption condition in this PR; reads are never denied) and
      deny_other_regions (Deny NotAction local.global_actions when aws:RequestedRegion is not var.aws_region).
      local.global_actions is AWS's published region-deny NotAction list (iam, organizations, sts, support, account,
      billing and the other global services); sts:* is always in it. aws_organizations_policy baseline (all four
      statements) attached to the sit OU, so any account created later starts under it. local.prod_baseline_stages is
      an empty list here; the PROD baseline plan (rec-5066) creates baseline_prod from it one key at a time. Policy
      content via jsonencode, no conditional or comparison operator beyond for_each filtering, and a lifecycle
      precondition that length(jsonencode(...)) of the baseline content is at most 5,120 (the SCP size limit; Decision
      156's precondition pattern). protect_cloudtrail carries no exemption here: the sit OU holds no account and SIT
      has no PlatformAdmin, so nothing there needs one. A child plan that needs one adds it as a single ArnNotLike on
      that account's own role ARN (rec-5066 for PROD's PlatformAdmin), never an AND of two condition keys, which would
      exempt any principal matching either (critique r2 BLK-4).
  - file: terraform/organization/accounts.tf
    action: Create
    purpose: >-
      Only a comment naming the child items that add resources here: rec-5064 (the SIT account) and rec-5065 (PROD's
      membership import).
  - file: terraform/organization/state_bucket.tf
    action: Create
    purpose: >-
      import block and aws_s3_bucket for agent-platform-organization-tfstate (created by step 6's CLI call,
      prevent_destroy), plus versioning Enabled, public-access block (all four true), SSE-S3 default encryption,
      ownership BucketOwnerEnforced and a bucket policy denying non-TLS access, each created by Terraform.
  - file: terraform/organization/management_admin.tf
    action: Create
    purpose: >-
      import blocks plus aws_iam_user org-admin-agent, aws_iam_user_policy AssumeOrganizationAdmin (only
      sts:AssumeRole on the OrganizationAdmin role), aws_iam_role OrganizationAdmin (trust: that user only,
      max_session_duration 3600) and aws_iam_role_policy OrganizationAdminOps, all seeded by the operator in step 4 from
      the same templates. Each policy and the trust document is try(templatefile("${path.module}/policies/<name>.json.tftpl",
      {...}), <fallback>) so a missing template fails closed: for the two policies a single Deny of Action * on
      Resource *, and for the trust document a single Deny of sts:AssumeRole to Principal {"AWS": "*"} (a trust policy
      needs a Principal and an sts action, and a Deny-only trust admits no one). No aws_iam_access_key and no
      access-key verb anywhere (Decision 237: the key is minted out of band).
  - file: terraform/organization/policies/organization_admin.json.tftpl
    action: Create
    purpose: >-
      OrganizationAdminOps, the management grant for this foundation, as a write set and a refresh-read set per
      service, modelled on PROD's platform_security_admin_policy.tf (its Sid layout and read lists). All names carry
      the prefix agent-platform-org-security- unless stated; reads that take no resource ARN are on Resource "*".
      Organizations: Describe* and List* on "*"; CreateOrganization, EnablePolicyType, CreateOrganizationalUnit,
      UpdateOrganizationalUnit, CreatePolicy, UpdatePolicy, AttachPolicy, DetachPolicy, TagResource, UntagResource,
      all on Resource "*" (the Organization, root, OU and policy ids do not exist before the apply, and the child plans'
      account verbs, CreateAccount, MoveAccount and TagResource on the new account, then need no Resource change);
      EnableAWSServiceAccess in a statement of its own, only for iam.amazonaws.com (organizations:ServicePrincipal
      condition), since a condition applies to every action in its statement and that key is absent on the others
      (critique r4 N5);
      iam:CreateServiceLinkedRole only for organizations.amazonaws.com (iam:AWSServiceName condition). Root features:
      iam:EnableOrganizationsRootCredentialsManagement, EnableOrganizationsRootSessions, ListOrganizationsFeatures,
      GetAccountSummary. CloudTrail write (Sid OrgSecurityTrailManage): exactly Decision 202 cl.2's six verbs
      (CreateTrail, UpdateTrail, PutEventSelectors, StartLogging, AddTags, RemoveTags) on the one management trail ARN;
      CloudTrail read (Sid OrgSecurityTrailRead): GetTrail, GetTrailStatus, DescribeTrails, GetEventSelectors,
      GetInsightSelectors, ListTags on "*". S3, on the state bucket and the trail bucket only: CreateBucket, ListBucket,
      GetBucketLocation and PROD's full aws_s3_bucket refresh-read list (Acl, Versioning, Encryption, PublicAccessBlock,
      Policy, Tagging, Lifecycle, OwnershipControls, Accelerate, RequestPayment, Logging, Replication,
      ObjectLockConfiguration, CORS, Website) with the Put verbs for the settings this root declares; on the state
      bucket's objects GetObject, PutObject and DeleteObject for terraform.tfstate and its .tflock (use_lockfile).
      Logs: CreateLogGroup, PutRetentionPolicy, TagResource, TagLogGroup, ListTagsForResource, ListTagsLogGroup,
      PutMetricFilter on its log group; DescribeLogGroups, DescribeMetricFilters and TestMetricFilter on "*" (the last
      for step 7's live pattern check, as PROD's PlatformSecurityLogsRead grants it). CloudWatch: PutMetricAlarm,
      TagResource, ListTagsForResource on its alarms; DescribeAlarms on "*". SNS: CreateTopic, SetTopicAttributes,
      GetTopicAttributes, TagResource, ListTagsForResource, Subscribe, ListSubscriptionsByTopic on its topic; ListTopics
      and, in its own Sid TopicSubscriptionRead, GetSubscriptionAttributes on "*" (the repo's CI policies record that
      it takes no resource scoping: github_ci_apply_reads.tf Sid SNSSubscriptionRead; critique r5 B1). IAM, the delivery role (role/agent-platform-org-security-*):
      CreateRole, GetRole, TagRole, ListRoleTags, PutRolePolicy, GetRolePolicy, ListRolePolicies,
      ListAttachedRolePolicies, and PassRole only to cloudtrail.amazonaws.com (iam:PassedToService). IAM on itself (user
      org-admin-agent and role OrganizationAdmin): GetUser, TagUser, ListUserTags, GetUserPolicy, ListUserPolicies,
      ListAttachedUserPolicies, PutUserPolicy; GetRole, TagRole, ListRoleTags, GetRolePolicy, ListRolePolicies,
      ListAttachedRolePolicies, PutRolePolicy; never UpdateAssumeRolePolicy (a trust change stays the operator's). SSM:
      GetParameter on /secret/agent-platform-terraform-organization-tfvars (the AWS-managed aws/ssm key's policy
      already admits account principals). No StopLogging, DeleteTrail, cloudtrail:* or any Delete* on cloudtrail, logs,
      sns, cloudwatch or iam; the only Delete is the state lock object. Never DeleteOrganization,
      RemoveAccountFromOrganization, CloseAccount, LeaveOrganization, DeletePolicy, DeleteOrganizationalUnit or any
      access-key verb: those stay the operator's. Each child plan adds only the verbs its own PR needs. Placeholders
      only (${account_id}, ${region}); no literal account id. IAM caps the total of a role's inline policies at 10,240
      characters, and the child plans add their own small inline policies to OrganizationAdmin, so the test measures
      the total of every aws_iam_role_policy on that role (rendered, whitespace removed, placeholders filled by
      12-digit and region-length stand-ins) against 10,240 and OrganizationAdminOps alone against 7,000, leaving the
      children about 3,000 (raised by the rec-5064 planning thread). Measured at planning (2026-11-11): a draft of this
      grant (OrgRead, OrgManage, OrgTrustedAccessIam, OrgServiceLinkedRole, RootFeatures,
      OrgSecurityTrailManage, OrgSecurityTrailRead, BucketManage, StateObjects, LogGroupManage, LogsRead, AlarmManage,
      AlarmRead, TopicManage, TopicSubscriptionRead, DeliveryRole, DeliveryRolePass, SelfUser, SelfRole, TfvarsRead;
      20 statements, 105 actions after critiques r5 and r6) renders to 5,131 characters (re-measured after r6) with 12-digit and region stand-ins, json.dumps with no whitespace. If the build's grant measures
      over 7,000, STOP and amend the plan (an operator-seeded, imported customer-managed policy changes the seed, the
      import count and step 7's expected list) and re-critique; the build never mints or attaches a policy itself,
      as Decision 156 cl.3 keeps iam:CreatePolicy* off github_ci_apply's own identity, the precedent for a self-applying role (critique r4 BLK-1; critique r2
      BLK-1: round 1's list lacked the refresh reads, the delivery role's create and the tag verbs, which a create-only
      pre-merge plan cannot show).
  - file: terraform/organization/policies/organization_admin_trust.json.tftpl
    action: Create
    purpose: "Trust of OrganizationAdmin: Principal the org-admin-agent user ARN built from ${account_id}; no other principal."
  - file: terraform/organization/policies/assume_organization_admin.json.tftpl
    action: Create
    purpose: "The user's only policy: sts:AssumeRole on the OrganizationAdmin role ARN built from ${account_id}."
  - file: terraform/organization/trail.tf
    action: Create
    purpose: >-
      The management account's own trail agent-platform-org-security-trail (not an organisation trail): multi-region,
      global service events on, log file validation on, homed in var.aws_region, delivering to bucket
      agent-platform-org-security-trail-<management account id>-<region> (56 characters, under S3's 63; built from data
      sources at plan time, the PROD trail's pattern; prevent_destroy, versioning, public-access block, SSE-S3, lifecycle
      as PROD's trail) and to CloudWatch Logs group agent-platform-org-security-cloudtrail (retention as PROD's) through a
      log-delivery role. Metric filters and alarms, each to SNS topic agent-platform-org-security-alerts with an e-mail
      subscription to var.alerts_email: admin role assumed (AssumeRole of OrganizationAdmin, so every sitting alarms by
      design); the admin user acting other than AssumeRole and GetCallerIdentity (the proxy re-signs the provider's
      identity call as the user, which is not a misuse); an IAM or Organizations policy change by any principal (PutRolePolicy, PutUserPolicy, AttachRolePolicy,
      AttachUserPolicy, CreateAccessKey, CreateRole, UpdateAssumeRolePolicy, and organizations AttachPolicy,
      DetachPolicy, UpdatePolicy, DisablePolicyType, since OrganizationAdmin's policy verbs reach every target on
      Resource "*", PROD's OU once rec-5065 lands; critique r4 N6), never filtered by actor (Decision 202's rule,
      critique r6 N1), so a self-grant, a new role or an SCP change is its own alarm and not hidden in the
      every-sitting one; root activity (userIdentity.type Root outside AWS service events); and detector tampering, as
      PROD's detector-tamper filter does: any cloudtrail call that is not read-only; logs PutMetricFilter,
      DeleteMetricFilter, PutRetentionPolicy, DeleteLogGroup; sns Subscribe, Unsubscribe, SetTopicAttributes,
      DeleteTopic; cloudwatch PutMetricAlarm, DeleteAlarms, DisableAlarmActions; and s3 PutBucketPolicy,
      DeleteBucketPolicy, PutBucketLifecycle, PutBucketVersioning, DeleteBucket on the trail bucket (critique r6 N3, r7
      N2: OrganizationAdmin's own PutMetricAlarm could otherwise strip alarm actions unseen). Every pattern is a plain
      string literal with no interpolation, ARN clauses matching by suffix wildcard (PROD's rule: an unknown value
      would make step 7's console read unknown, and an account id would never match the fixture; critique r7 N1). The
      five patterns live in one map,
      local.org_security_filter_patterns, keyed by alarm name, so the fixture and the live check read them as PROD's do
      (local.platform_security_filter_patterns). Names
      sit under the agent-platform-* family Decision 101(b) freezes, so no new name family is authorised.
  - file: terraform/organization/CLAUDE.md
    action: Create
    purpose: >-
      The procedure for this root (deploy-paths.yaml organization_provisioning names it): the management environment's
      setup (setup-script field writing ~/.aws/config with agent_static and agent_platform_admin_org,
      AWS_PROFILE=agent_platform_admin_org, the network secret holding only the management key for the project region's
      STS host); the operator's CloudShell seed commands, which fetch the three templates from the PR head sha of this
      public repository and render ${account_id} and ${region} with sed; tfvars from the SSM parameter into
      /tmp/org-merge, outside any worktree; the sitting order (steps 4-11) and the counts-only read-backs; the STS rule
      (no --region override on a call that assumes the role; a second-region identity read through
      scripts.aws_identity); that a root-only task in a member account runs as a centralized root session from this
      account; and the emergency detach (aws organizations detach-policy, then a PR to match). Never names an account
      id, e-mail or the break-glass name.
  - file: scripts/session/protected_action_match.py
    action: Modify
    new_imports: []
    purpose: >-
      fast_path_ok treats every profile whose name starts with agent_platform_admin as an admin ambient (today it
      hard-codes the one name agent_platform_admin), so in the management environment, whose ambient AWS_PROFILE is
      agent_platform_admin_org, a bare aws or terraform command is classified, never fast-pathed (critique r1 B1).
  - file: .claude/hooks/protected_action_gate.sh
    action: Modify
    purpose: >-
      The fail-closed shim's admin-profile line (today [ "${AWS_PROFILE:-}" = "agent_platform_admin" ]) becomes a case
      match on agent_platform_admin*, so when the Python hook is missing or crashes an aws call under ambient
      agent_platform_admin_org is refused too, the same prefix rule fast_path_ok gets (critique r3 N2).
  - file: tests/hooks/test_protected_action_gate.py
    action: Modify
    purpose: >-
      With ambient AWS_PROFILE=agent_platform_admin_org and the repo's contract, a bare aws s3 ls exits 2 naming
      admin-credential (the Python hook is unchanged; the fast_path_ok change makes it classify); with the adapter missing,
      the shim refuses an aws call under ambient agent_platform_admin_org and still under agent_platform_admin. The deny message's
      self-serve hint stays as protected-actions.yaml gate.on_deny defines it (critique r2 BLK-5).
  - file: tests/checks/iam_tf/test_cloudtrail_write_grant_scoped.py
    action: Modify
    purpose: >-
      The cloudtrail-write-grant-scoped-to-platform-trail guard (Decision 202 cl.2, read per account by this plan's
      Decision 202 note). (1) Effect-aware: a quoted cloudtrail verb inside a statement whose Effect is Deny is not a
      grant, so rules (b) and (d) skip it (scps.tf's protect_cloudtrail names StopLogging and DeleteTrail in a Deny).
      (2) It also reads terraform/organization/policies/*.json.tftpl as JSON, and admits exactly one second write
      statement: Sid OrgSecurityTrailManage in organization_admin.json.tftpl, Action equal to the six, Resource the
      single management trail ARN template (trail/agent-platform-org-security-trail), its template read only by the
      aws_iam_role_policy on aws_iam_role.organization_admin. statements() parses only Statement = [ arrays, and
      scps.tf keeps its statements in the map local.baseline_statements, so the Effect test finds the enclosing
      statement object of each occurrence itself (critique r3 N4). Red cases: an Allow statement that only nests a
      Deny-shaped map stays red; an Allow of StopLogging in a template, a
      seventh verb in OrgSecurityTrailManage, that Sid on another trail ARN, a third write statement, a Deny of
      StopLogging staying green; the real tree green. The file has about 230 lines of headroom under the 500-line
      default; if the change would cross it, split the template reader into a helper module (Decision 128), never raise.
  - file: tests/fixtures/organization_security_filter_events.yaml
    action: Create
    purpose: >-
      Sanitised CloudTrail events in real CloudTrail shape for the five filters, PROD's
      tests/fixtures/platform_security_filter_events.yaml pattern: each entry names in must_match the exact set of
      alarm names its event must match, with at least one match and one near-miss non-match per filter. A denied
      PutRolePolicy in CloudTrail's real denied shape (null requestParameters, the target named in errorMessage) is in
      the policy-change filter's must_match, as PROD's platformdev-tag-role-denied event is; that filter's near-miss
      is an unlisted call such as GetRolePolicy (critique r7 B1). The account id is
      the literal ACCOUNT, never twelve digits. Read by test_organization_baseline.py (shape, coverage, no account id)
      and by step 7's live logs test-metric-filter run (critique r6 B1: text pins cannot prove a pattern matches what
      CloudTrail emits; PROD's filter 1 once never fired for that reason).
