schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: sit-portable-roots
intent: >-
  Make terraform/bootstrap and terraform/personal account-portable (rec-5025) so the same roots can later be applied to
  the SIT account under the SIT Decision (rec-5024), while today's account (sandbox, becoming PROD) renders
  byte-identical policies and plans as an exact no-op. It creates nothing in AWS; it is the first T2.57 item.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-sit-portable-roots.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category) -- rec-5025, which becomes T2.57 c3 once the rec-5024 build (thread "Build
  the SIT Decision and roadmap item") lands T2.57 in docs/ROADMAP-PLATFORM.yaml; the build re-reads that item at start
  and flips c3 if it exists.
scope:
  - file: terraform/bootstrap/account_names.tf
    action: Create
    purpose: >-
      The one home of this root's globally unique names: local.name_suffix = { sandbox = "", sit = "-sit" }[var.environment]
      (no conditional or comparison operator, matching terraform/personal's screen); data_lake_bucket_name/arn
      (agent-platform-data-lake + suffix), ducklake_dr_bucket_name/arn (agent-platform-ducklake-catalog-dr + suffix),
      bootstrap_state_bucket_name/arn (agent-platform-bootstrap-tfstate + suffix). Each ARN local is written as
      "arn:aws:s3:::${local.<name>_bucket_name}", never as a literal prefix plus suffix, so no full literal ARN appears
      even here. No account id, region or e-mail.
  - file: terraform/bootstrap/variables.tf
    action: Modify
    purpose: >-
      Add variable "environment" (string, default "sandbox", validation can(regex("^(sandbox|sit)$", var.environment))).
      The aws_region default line Decision 202 pins is untouched.
  - file: terraform/bootstrap/github_ci_apply_boundary.tf
    action: Modify
    purpose: Every literal data-lake ARN (9) becomes "${local.data_lake_bucket_arn}/<same suffix>"; no other text changes.
  - file: terraform/bootstrap/github_ci_apply_policy.tf
    action: Modify
    purpose: The 4 data-lake and 1 DR-bucket literal ARNs become local.data_lake_bucket_arn / local.ducklake_dr_bucket_arn forms.
  - file: terraform/bootstrap/github_ci_apply_reads.tf
    action: Modify
    purpose: >-
      The data-lake and DR-bucket bucket ARNs (lines 45-46) become the locals; the IAM role ARN
      agent-platform-ducklake-catalog-dr (line 96) is account-scoped and stays.
  - file: terraform/bootstrap/github_settings_apply.tf
    action: Modify
    purpose: github_settings_state_arn and github_settings_mirror_arn take local.data_lake_bucket_arn; values unchanged for sandbox.
  - file: terraform/bootstrap/platform_dev_policies.tf
    action: Modify
    purpose: Delete its local data_lake_bucket_arn (line 11); the 20 existing references resolve to account_names.tf's local.
  - file: terraform/bootstrap/platform_admin_data_policies.tf
    action: Modify
    purpose: >-
      The DR-bucket (3) and bootstrap-state-bucket (2 Resource lines plus the two self-access guard keys, lines 251-252)
      literals become the locals; the self-access guard keeps checking the same two ARNs for sandbox. The comment at
      line 224 names the bucket pattern, not the literal.
  - file: terraform/bootstrap/backend-sit.hcl
    action: Create
    purpose: >-
      Partial backend for the SIT bootstrap state: bucket agent-platform-bootstrap-tfstate-sit, key terraform.tfstate,
      encrypt, use_lockfile; no region (Decision 202 cl.4). main.tf's backend block stays as it is: a -backend-config
      file overrides the block's values (probed with Terraform 1.10.5, see context), so every existing sandbox init
      command keeps working and SIT inits with -backend-config=backend-sit.hcl.
  - file: terraform/bootstrap/CLAUDE.md
    action: Modify
    purpose: >-
      One-time provisioning names the SIT form: state bucket by one admin CLI create-bucket with versioning,
      encryption and public-access block plus a read-back, then `terraform init -backend-config=backend-sit.hcl` and
      `-var environment=sit`. The SIT apply itself is rec-5027's. The file is at its prose cap (NEAR_CAP, headroom 0):
      the edit is size-neutral or smaller, compacting the existing step 1 CLI block into the one-line pattern it
      already follows, and lowers its config/prose_budgets.yaml entry only if it shrinks.
  - file: terraform/personal/account_names.tf
    action: Create
    purpose: >-
      Same name_suffix map and data_lake / ducklake_dr name and ARN locals as the bootstrap file, byte-identical lines
      (checked by the new validator); no bootstrap_state local.
  - file: terraform/personal/variables.tf
    action: Modify
    purpose: Add variable "environment" exactly as in terraform/bootstrap/variables.tf.
  - file: terraform/personal/main.tf
    action: Modify
    purpose: aws_s3_bucket.data_lake.bucket = local.data_lake_bucket_name.
  - file: terraform/personal/ducklake_catalog_dr.tf
    action: Modify
    purpose: Delete its local ducklake_dr_bucket_name (line 27); the existing references resolve to account_names.tf's local.
  - file: terraform/personal/oidc_pipeline_roles.tf
    action: Modify
    purpose: The lock-object ARN's key segment tfstate/personal/sandbox/ becomes tfstate/personal/${var.environment}/ (line 142).
  - file: config/terraform/backend-personal-sit.hcl
    action: Create
    purpose: >-
      terraform/personal's SIT partial backend, kept outside terraform/personal because the trusted PR plan refuses any
      PR that adds a non-.tf file there (terraform_hcl_screen tree rule file_not_tf) or changes a main-only file such as
      backend-sandbox.hcl (terraform_hcl_screen_policy.py main_only_files; trusted_plan_overlay main_only_file_changed);
      rec-5028's SIT workflow passes it with -backend-config. Settings: bucket agent-platform-data-lake-sit, key
      tfstate/personal/sit/terraform.tfstate, encrypt, use_lockfile; no region (the region check scans only terraform/,
      so predicate (f) of the new validator holds it to that rule here).
      SIT keeps PROD's layout (state, saved plans and convergence records inside its data-lake bucket), so every CI
      policy reads the same prefixes in both accounts; rec-5030 carries the matching rule that replication and reset
      touch only replica data prefixes.
  - file: scripts/checks/iam_tf/_account_names.py
    action: Create
    purpose: >-
      Parses both roots' account_names.tf and variables.tf environment validation; render(text, env="sandbox")
      substitutes every ${local.<account-name local>} interpolation with its value for that env and every bare
      local.<account-name local> reference (main.tf's bucket = local.data_lake_bucket_name,
      platform_admin_data_policies.tf's [local.data_lake_bucket_arn]) with the quoted value, leaving every other token
      alone, so existing literal-matching checks and tests read the files as rendered for sandbox. Pure, no I/O at
      import.
  - file: scripts/checks/iam_tf/validate_account_portable_names.py
    action: Create
    purpose: >-
      validate_account_portable_names: (a) no literal agent-platform-data-lake, agent-platform-ducklake-catalog-dr or
      agent-platform-bootstrap-tfstate bucket in an S3 context (arn:aws:s3:::<name>, s3://<name>, or a bucket = "<name>"
      attribute) in any .tf of terraform/bootstrap or terraform/personal outside account_names.tf (comments excluded;
      backend blocks and .hcl files exempt; the IAM role and Lambda function named agent-platform-ducklake-catalog-dr are
      account-scoped and out of the predicate), and no literal tfstate/personal/sandbox/ key in a terraform/personal
      .tf; (b) the two account_names.tf files
      agree on every shared local; (c) both environment variables carry the same default and validation; (d) the
      sandbox render equals today's literal names (Decision 242 cl.1) and the sit render adds "-sit" to each; (e) the
      name_suffix map has exactly the environments the validation admits; (f) each SIT backend file agrees with the sit
      render: terraform/bootstrap/backend-sit.hcl's bucket is bootstrap_state_bucket_name(sit), config/terraform/backend-personal-sit.hcl's bucket is
      data_lake_bucket_name(sit) and its key is tfstate/personal/sit/terraform.tfstate (the same prefix the sit-rendered
      lock-key grant in oidc_pipeline_roles.tf names), and neither sets region.
  - file: scripts/checks/iam_tf/_manifest.py
    action: Modify
    purpose: >-
      Entry for validate_account_portable_names (pre=True, fast tier); pre_globs cover terraform/bootstrap/**,
      terraform/personal/**, config/terraform/backend-personal-sit.hcl, the check module and _account_names.py.
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      Entry validate_github_settings_apply's pre_globs gain every input the check now depends on through render:
      scripts/checks/iam_tf/_account_names.py, terraform/bootstrap/account_names.tf, terraform/bootstrap/variables.tf,
      terraform/personal/account_names.tf and terraform/personal/variables.tf (validate_pre_glob_closure follows import
      edges only, so a diff touching only account_names.tf would otherwise skip the check on --pre).
  - file: tests/checks/ci_guards/test__manifest.py
    action: Modify
    purpose: >-
      A closure case for validate_github_settings_apply modelled on test_dependabot_config_entry_closes_over_its_inputs:
      the five render inputs above are in its pre_globs.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: Taxonomy row validate_account_portable_names (environment class, like validate_terraform_try).
  - file: tests/checks/iam_tf/test_validate_account_portable_names.py
    action: Create
    purpose: Red cases per predicate (a)-(e) on synthetic trees, render() cases, the real tree green, and registration on the fast tier.
  - file: scripts/checks/iam_tf/_read_coverage.py
    action: Modify
    new_imports: [scripts.checks.iam_tf._account_names]
    purpose: >-
      Terraform text is read through _account_names.render before locals and names resolve, so aws_s3_bucket
      data_lake / ducklake_catalog_dr names and every policy ARN resolve exactly as today (fixes the
      ci-refresh-read, trusted read and agent-observability read real-tree reds the dry run showed).
  - file: scripts/checks/iam_tf/_write_coverage.py
    action: Modify
    new_imports: [scripts.checks.iam_tf._account_names]
    purpose: Reads bootstrap and personal text through render; _DATA_LAKE_BUCKET_ARN stays the sandbox literal it is matched against.
  - file: scripts/checks/ci_guards/validate_github_settings_apply.py
    action: Modify
    new_imports: [scripts.checks.iam_tf._account_names]
    purpose: >-
      Reads github_settings_apply.tf and platform_admin_policies.tf (lines 76-77, 519) through render, so its exact-ARN
      predicates (_STATE, the mirror ARN) hold unchanged.
  - file: tests/checks/ci_guards/test_validate_github_settings_apply.py
    action: Modify
    purpose: test_h_the_mirror_local_widened mutates the local's new text form (the widened suffix after ${local.data_lake_bucket_arn}); same assertion.
  - file: tests/checks/iam_tf/test_ci_branch_boundary_state_fence.py
    action: Modify
    purpose: _read renders the boundary through _account_names.render; the asserted ARNs and roles are unchanged.
  - file: tests/checks/iam_tf/test_telemetry_prefix_fence.py
    action: Modify
    purpose: Same render on read; assertions unchanged.
  - file: tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py
    action: Modify
    purpose: >-
      _bootstrap_texts renders through render; the two self-access-guard mutation cases replace the guard's new key
      text (${local.bootstrap_state_bucket_arn}) with a corrupted literal, keeping their detected-violation assertions.
bundled_recommendations: [rec-5025]
followon_recs: [rec-5058]
infrastructure_dependencies:
  - "terraform/bootstrap: admin-tier apply (Decision 126 cl.1, Decision 248 cl.6) after the pre-merge read-only ADMIN plan (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan); expected 0 to add, 0 to change, 0 to destroy, so the apply only proves the merged code is the applied code."
  - "terraform/personal: the PR's speculative plan must read No changes; the merge applies an empty saved plan (environment-taxonomy.yaml axis_a.sandbox)."
  - "No SIT resource is created here: the SIT state buckets and every SIT apply are rec-5027's."
acceptance_criteria:
  - "No literal arn:aws:s3:::agent-platform-data-lake remains in terraform/bootstrap, and config/terraform/backend-personal-sit.hcl exists (rec-5025's acceptance, as updated 2026-11-10)."
  - validate_account_portable_names passes on the real tree and each of its predicates has a red case.
  - Every pre-existing iam_tf and ci_guards node passes with no assertion loosened.
  - The pre-merge admin plan of terraform/bootstrap at the PR head shows zero changes and main's own plan shows zero rows.
  - The PR's speculative plan of terraform/personal reads No changes with predicted guard verdict PASS.
  - The post-merge admin apply of terraform/bootstrap applies zero changes and a fresh plan exits 0 with -detailed-exitcode.
  - rec-5025 reads closed with its closure trailer; T2.57 c3 is met if T2.57 exists on main.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The new validator's unit tests: one red case per predicate (a)-(e) on synthetic trees, render() for both envs,
      the real tree green, and the fast-tier registration. The file is absent on main, so this is red before.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_validate_account_portable_names.py -q
    expected: exit 0; red before (file absent on main).
    fix_if: a predicate has no red case, the real tree fails, or the Entry or taxonomy row is missing
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: account-portable-names
  - step: 2
    phase: pre-deploy
    action: >-
      The suites the dry run turned red, plus every iam_tf and ci_guards node, after the HCL edit and the render
      re-routing. A node that needed more than reading through render is a scope question, not a fix: stop and
      report it as a plan defect.
    command: bin/venv-python -m pytest tests/checks/iam_tf tests/checks/ci_guards tests/validate/test_terraform_checks.py tests/test_terraform_hcl_screen.py tests/test_trusted_plan_overlay.py tests/test_terraform_github_pr_plan.py -q
    expected: exit 0 (other tests that read terraform/personal outside these paths are left to the full tier)
    fix_if: >-
      a node fails: route its reader through _account_names.render; never change an expected ARN, count or Sid. If
      the fix needs anything else, file the plan defect.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: These pre-existing suites already run in both tiers through their own graduated shards; step 1's new shard carries the new behaviour.
  - step: 3
    phase: pre-deploy
    action: rec-5025's own acceptance probe on the head tree.
    command: "! grep -rq 'arn:aws:s3:::agent-platform-data-lake' terraform/bootstrap && test -f config/terraform/backend-personal-sit.hcl && echo ACCEPTANCE_OK"
    expected: ACCEPTANCE_OK printed; on main the grep finds the literal, so it is red before.
    fix_if: the grep finds a literal (a comment counts; rewrite the comment to name the local)
    hermetic: true
    expected_literals: [ACCEPTANCE_OK]
    graduation: waive
    graduation_waiver_reason: Subsumed by step 1's graduated predicates (a) and (f), which pin the same literal ban and the backend file in both tiers.
  - step: 4
    phase: pre-deploy
    action: >-
      Provider-free format check of both roots and the static region and screen checks, then the fast and full tiers
      before handoff. Not hermetic: the pr-validate runner has no terraform binary.
    command: >-
      terraform fmt -check -recursive terraform/bootstrap && terraform fmt -check -recursive terraform/personal && bin/venv-python -m pytest tests/checks/ci_guards/test_validate_trusted_plan_screen.py tests/checks/ci_guards/test_validate_project_region.py -q &&
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      exit 0, no file listed by fmt; then the fast tier and the full tier (backgrounded with a 2 h limit from the
      top-level session, handoff_policy) with validation_result --verify-head exit 0 for HEAD
    fix_if: >-
      fmt lists a file (run terraform fmt); the screen names account_names.tf (use the map index form, never ? or ==) or
      file_not_tf (a non-.tf file was added under terraform/personal: move it out); the region check names a backend
      file (remove the region)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The required terraform-validate job runs fmt -check on each root, and both pytest files already run in both tiers.
  - step: 5
    phase: pre-deploy
    action: ADMIN credential check (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan ENVIRONMENT CHECK).
    command: bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
    expected: ADMIN_CHAIN_OK; on ADMIN_CHAIN_ABSENT the PR waits at CI-green for an ADMIN session to run step 6.
    fix_if: ADMIN_CHAIN_ABSENT in a session expected to hold admin credentials; report it, never widen
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Pre-merge read-only ADMIN plan of terraform/bootstrap at the PR's CI-green head and at origin/main, each in a
      throwaway worktree with the gitignored terraform.bootstrap.tfvars copied in, -lock=false, plan files deleted in
      the step; counts and addresses only go on the PR with the head sha. On the operator's direction in that session
      (protected-actions.yaml), never standing.
    command: >-
      set -o pipefail; R=$(tr -d '[:space:]' < config/aws-region); E="${TMPDIR:-/tmp}/spr-evidence"; rm -rf "$E"; mkdir -p "$E";
      for ref in origin/main "$PR_HEAD_SHA"; do tag=$(echo "$ref" | tr '/' '-'); W="${TMPDIR:-/tmp}/spr-wt-$tag";
      git worktree add --detach "$W" "$ref" -q && cp terraform/bootstrap/terraform.bootstrap.tfvars "$W/terraform/bootstrap/" &&
      TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir="$W/terraform/bootstrap" init -input=false -backend-config="region=$R" > /dev/null 2>> "$E/tf.err" &&
      TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir="$W/terraform/bootstrap" plan -input=false -lock=false -detailed-exitcode -var-file=terraform.bootstrap.tfvars -out="$E/p.bin" > /dev/null 2>> "$E/tf.err"; rc=$?;
      terraform -chdir="$W/terraform/bootstrap" show -json "$E/p.bin" 2>/dev/null | bin/venv-python -c "import json,sys; p=json.load(sys.stdin); print(sys.argv[1], 'ROWS', sum(1 for r in p.get('resource_changes', []) if r['change']['actions'] != ['no-op']))" "$tag";
      echo "$tag EXIT $rc"; rm -f "${E:?}/p.bin"; git worktree remove --force "$W"; done
    expected: >-
      origin-main ROWS 0 and EXIT 0; the head line ROWS 0 and EXIT 0 (no resource or policy change, Decision 242 cl.1).
      Post both lines and the head sha on the PR; tf.err stays local.
    fix_if: >-
      head ROWS above 0: a rendered policy changed; diff the rendered policy JSON locally (never post it) and fix the
      local or reference. main ROWS above 0: someone else's unapplied bootstrap change or drift; STOP and report before
      merge. EXIT 1: read the local tf.err.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      On the open PR, the trusted terraform/personal plan (terraform-plan-trusted.yml, job plan) for the head sha is
      green, did not post a refusal comment, and its plan comment reads No changes with predicted guard verdict PASS.
      Read with the GitHub MCP tools (AGENTS.md: session-side GitHub reads use mcp__github__*).
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="terraform-plan-trusted.yml", workflow_runs_filter={"event": "pull_request", "branch": "<PR head
      branch>"}) -> the newest run whose head_sha is the head; list_workflow_jobs -> job plan's conclusion;
      mcp__github__pull_request_read(method="get_comments") -> the newest trusted-plan comment for that sha.
    expected: >-
      Job plan conclusion success; the comment's plan summary line reads No changes; its line "Predicted guard verdict:
      PASS" is present; no refusal comment for that sha. Record the run URL on the PR.
    fix_if: any change row -- the rename moved a value (most likely the bucket name or the lock key); fix and re-push
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      After merge, on the operator's direction in an ADMIN session: in a worktree at the merge sha, a saved plan of
      terraform/bootstrap whose counts are presented to the operator (zero rows expected); on their word, apply that
      saved plan (the Decision 126 procedure: plan, present, accept, apply), then a fresh plan with -detailed-exitcode.
      Then read back the merge-time apply-sandbox run.
    command: >-
      set -o pipefail; R=$(tr -d '[:space:]' < config/aws-region); W="${TMPDIR:-/tmp}/spr-merge"; git worktree add --detach "$W" "$MERGE_SHA" -q &&
      cp terraform/bootstrap/terraform.bootstrap.tfvars "$W/terraform/bootstrap/" && export TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc &&
      terraform -chdir="$W/terraform/bootstrap" init -input=false -backend-config="region=$R" > /dev/null &&
      terraform -chdir="$W/terraform/bootstrap" plan -input=false -var-file=terraform.bootstrap.tfvars -out=merge.bin 2>&1 | grep -E '^Plan:|No changes';
      echo "(present the line above; apply only on the operator's word)";
      terraform -chdir="$W/terraform/bootstrap" apply -input=false merge.bin 2>&1 | grep -E '^Apply complete';
      terraform -chdir="$W/terraform/bootstrap" plan -input=false -detailed-exitcode -var-file=terraform.bootstrap.tfvars > /dev/null; echo "BOOTSTRAP_PLAN_EXIT $?";
      rm -f "$W/terraform/bootstrap/merge.bin"; git worktree remove --force "$W"
      -- then mcp__github__actions_list(method="list_workflow_runs", resource_id="terraform-apply-sandbox.yml",
      workflow_runs_filter={"event": "push", "branch": "main"}) -> the run whose head_sha is the merge sha, and
      list_workflow_jobs -> its apply job's conclusion.
    expected: >-
      "No changes", then "Apply complete! Resources: 0 added, 0 changed, 0 destroyed", then BOOTSTRAP_PLAN_EXIT 0; the
      apply-sandbox run on the merge sha concluded success. Record the merge sha, the lines and the run URL on the PR.
    fix_if: >-
      the saved plan shows any row -- STOP before applying and present it; the merge differs from what step 6 planned
      (re-run step 6 at the merge sha)
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: rec-5025 closed by the squash commit's Resolves trailer; read back.
    command: bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5025']); print(rows[0]['id'], rows[0]['status'])"
    expected: rec-5025 closed
    fix_if: still open after the closure job ran -- read ci.yml's closure job log; never close by hand without the trailer evidence
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/iam_tf/validate_account_portable_names.py
    behavior: predicates (a)-(e)
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_validate_account_portable_names.py
    red_green_expectation: red before (module absent), green after; each predicate's synthetic red case fails without it
  - source: scripts/checks/iam_tf/_account_names.py
    behavior: render substitutes each account-name local for sandbox and sit, and leaves other tokens alone
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_validate_account_portable_names.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/checks/iam_tf/_manifest.py
    behavior: the new check runs on the fast tier
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_validate_account_portable_names.py
    red_green_expectation: the registration node is red before the Entry lands
  - source: scripts/checks/ci_guards/_manifest.py
    behavior: an edit to _account_names.py or to any file it parses triggers validate_github_settings_apply on --pre
    verification_step: 2
    test_selector: tests/checks/ci_guards/test__manifest.py
    red_green_expectation: the new closure case is red before the five globs land, green after
  - source: tests/checks/ci_guards/test__manifest.py
    behavior: the closure case for validate_github_settings_apply
    verification_step: 2
    test_selector: tests/checks/ci_guards/test__manifest.py
    red_green_expectation: red against main's pre_globs, green after the Entry change
  - source: config/ci_rca_taxonomy.yaml
    behavior: the new check has its taxonomy row
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_validate_account_portable_names.py
    red_green_expectation: the taxonomy-row node is red before the row lands
  - source: terraform/bootstrap/account_names.tf
    behavior: sandbox names equal today's literals; sit adds -sit
    verification_step: 1
    test_selector: tests/checks/iam_tf/test_validate_account_portable_names.py
    red_green_expectation: predicate (d)'s real-tree case is red before the file lands
  - source: terraform/personal/account_names.tf
