schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: sit-portable-roots
intent: >-
  Make terraform/bootstrap and terraform/personal account-portable (rec-5025) so the same roots can later be applied to
  the SIT account under the SIT Decision (rec-5024), while today's account (sandbox, becoming PROD) renders
  byte-identical policies and plans as an exact no-op. It creates nothing in AWS; it is the first T2.57 item.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-sit-portable-roots.yaml
phase: >-
  T2.57 (SIT environment), c3 (rec-5025); T2.57 landed on main with the rec-5024 build (#1957, 6f71e367,
  2026-11-11), so this plan declares the criterion now. Closes T2.57 c3 only.
closes_criteria: [T2.57:c3]
scope:
  - file: terraform/bootstrap/account_names.tf
    action: Create
    purpose: >-
      The one home of this root's globally unique names: local.name_suffix = { sandbox = "", sit = "-sit" }[var.environment]
      (no conditional or comparison operator, matching terraform/personal's screen); data_lake_bucket_name/arn
      (agent-platform-data-lake + suffix), ducklake_dr_bucket_name/arn (agent-platform-ducklake-catalog-dr + suffix),
      bootstrap_state_bucket_name/arn (agent-platform-bootstrap-tfstate + suffix). Each ARN local is written as
      "arn:aws:s3:::${local.<name>_bucket_name}", never as a literal prefix plus suffix, so no full literal ARN appears
      even here. No account id, region or e-mail.
  - file: terraform/bootstrap/variables.tf
    action: Modify
    purpose: >-
      Add variable "environment" (string, default "sandbox", validation can(regex("^(sandbox|sit)$", var.environment))).
      The aws_region default line Decision 202 pins is untouched.
  - file: terraform/bootstrap/github_ci_apply_boundary.tf
    action: Modify
    purpose: Every literal data-lake ARN (9) becomes "${local.data_lake_bucket_arn}/<same suffix>"; no other text changes.
  - file: terraform/bootstrap/github_ci_apply_policy.tf
    action: Modify
    purpose: The 4 data-lake and 1 DR-bucket literal ARNs become local.data_lake_bucket_arn / local.ducklake_dr_bucket_arn forms.
  - file: terraform/bootstrap/github_ci_apply_reads.tf
    action: Modify
    purpose: >-
      The data-lake and DR-bucket bucket ARNs (lines 45-46) become the locals; the IAM role ARN
      agent-platform-ducklake-catalog-dr (line 96) is account-scoped and stays.
  - file: terraform/bootstrap/github_settings_apply.tf
    action: Modify
    purpose: github_settings_state_arn and github_settings_mirror_arn take local.data_lake_bucket_arn; values unchanged for sandbox.
  - file: terraform/bootstrap/platform_dev_policies.tf
    action: Modify
    purpose: Delete its local data_lake_bucket_arn (line 11); the 20 existing references resolve to account_names.tf's local.
  - file: terraform/bootstrap/platform_admin_data_policies.tf
    action: Modify
    purpose: >-
      The DR-bucket (3) and bootstrap-state-bucket (2 Resource lines plus the two self-access guard keys, lines 251-252)
      literals become the locals; the self-access guard keeps checking the same two ARNs for sandbox. The comment at
      line 224 names the bucket pattern, not the literal.
  - file: terraform/bootstrap/backend-sit.hcl
    action: Create
    purpose: >-
      Partial backend for the SIT bootstrap state: bucket agent-platform-bootstrap-tfstate-sit, key terraform.tfstate,
      encrypt, use_lockfile; no region (Decision 202 cl.4). main.tf's backend block stays as it is: a -backend-config
      file overrides the block's values (probed with Terraform 1.10.5, see context), so every existing sandbox init
      command keeps working and SIT inits with -backend-config=backend-sit.hcl.
  - file: terraform/bootstrap/CLAUDE.md
    action: Modify
    purpose: >-
      One-time provisioning names the SIT form, run under the SIT account's admin credentials as rec-5027 defines them
      (never agent_platform_admin, which is PROD's): state bucket by one admin CLI create-bucket with versioning,
      encryption and public-access block plus a read-back, then `terraform init -backend-config=backend-sit.hcl` and
      `-var environment=sit`. The SIT apply itself is rec-5027's. The file is at its prose cap (NEAR_CAP, headroom 0):
      the edit is size-neutral or smaller, compacting the existing step 1 CLI block into the one-line pattern it
      already follows, and lowers its config/prose_budgets.yaml entry only if it shrinks. The compacted block reads the
      region as $(tr -d '[:space:]' < config/aws-region), the form section 2 already uses (Decision 202 cl.4), in
      place of today's literal --region and LocationConstraint values.
  - file: terraform/personal/account_names.tf
    action: Create
    purpose: >-
      Same name_suffix map and data_lake / ducklake_dr name and ARN locals as the bootstrap file, byte-identical lines
      (checked by the new validator); no bootstrap_state local.
  - file: terraform/personal/variables.tf
    action: Modify
    purpose: Add variable "environment" exactly as in terraform/bootstrap/variables.tf.
  - file: terraform/personal/main.tf
    action: Modify
    purpose: aws_s3_bucket.data_lake.bucket = local.data_lake_bucket_name.
  - file: terraform/personal/ducklake_catalog_dr.tf
    action: Modify
    purpose: Delete its local ducklake_dr_bucket_name (line 27); the existing references resolve to account_names.tf's local.
  - file: terraform/personal/oidc_pipeline_roles.tf
    action: Modify
    purpose: The lock-object ARN's key segment tfstate/personal/sandbox/ becomes tfstate/personal/${var.environment}/ (line 142).
  - file: config/terraform/backend-personal-sit.hcl
    action: Create
    purpose: >-
      terraform/personal's SIT partial backend, kept outside terraform/personal because the trusted PR plan refuses any
      PR that adds a non-.tf file there (terraform_hcl_screen tree rule file_not_tf) or changes a main-only file such as
      backend-sandbox.hcl (terraform_hcl_screen_policy.py main_only_files; trusted_plan_overlay main_only_file_changed);
      rec-5028's SIT workflow passes it with -backend-config. Settings: bucket agent-platform-data-lake-sit, key
      tfstate/personal/sit/terraform.tfstate, encrypt, use_lockfile; no region (the region check scans only terraform/,
      so predicate (f) of the new validator holds it to that rule here).
      SIT keeps PROD's layout (state, saved plans and convergence records inside its data-lake bucket), so every CI
      policy reads the same prefixes in both accounts; rec-5030 carries the matching rule that replication and reset
      touch only replica data prefixes.
  - file: scripts/checks/iam_tf/_account_names.py
    action: Create
    purpose: >-
      Parses both roots' account_names.tf and variables.tf environment validation; render(text, env="sandbox")
      substitutes every ${local.<account-name local>} interpolation with its value for that env and every bare
      local.<account-name local> reference (main.tf's bucket = local.data_lake_bucket_name,
      platform_admin_data_policies.tf's [local.data_lake_bucket_arn]) with the quoted value, leaving every other token
      alone, so existing literal-matching checks and tests read the files as rendered for sandbox. The values are read
      from _common.ROOT at call time (never at import), and render is the identity when account_names.tf is absent, so
      synthetic-tree and patched-ROOT tests keep working.
  - file: scripts/checks/iam_tf/validate_account_portable_names.py
    action: Create
    purpose: >-
      validate_account_portable_names, a standing check: (a) no literal agent-platform-data-lake, agent-platform-ducklake-catalog-dr or
      agent-platform-bootstrap-tfstate bucket in an S3 context (arn:aws:s3:::<name>, s3://<name>, or a bucket = "<name>"
      attribute) in any .tf of terraform/bootstrap or terraform/personal outside account_names.tf (comments excluded;
      backend blocks and .hcl files exempt; the IAM role and Lambda function named agent-platform-ducklake-catalog-dr are
      account-scoped and out of the predicate; a re-added name-literal local such as ducklake_catalog_dr.tf's line 27 is
      not an S3 context and is caught by step 4's validate as a duplicate local, not by (a), because the DR Lambda's
      function-name local is the same string; the failure message names the local to use), and no literal
      tfstate/personal/sandbox/ key in a terraform/personal
      .tf; (b) the two account_names.tf files
      agree on every shared local; (c) both environment variables carry the same default and validation; (d) the
      sandbox render equals today's literal names (Decision 242 cl.1) and the sit render adds "-sit" to each; (e) the
      name_suffix map has exactly the environments the validation admits; (f) each SIT backend file agrees with the sit
      render: terraform/bootstrap/backend-sit.hcl's bucket is bootstrap_state_bucket_name(sit), config/terraform/backend-personal-sit.hcl's bucket is
      data_lake_bucket_name(sit) and its key is tfstate/personal/sit/terraform.tfstate (the same prefix the sit-rendered
      lock-key grant in oidc_pipeline_roles.tf names), and neither sets region; (g) the same secret names in every
      account (Decision 237 cl.1, Decision 252 cl.3): no sandbox or sit token in any secret or SSM parameter name in
      either root, read from the name attribute of every aws_secretsmanager_secret and aws_ssm_parameter resource and
      data source (the block's own name line, never carried into the next block), every string in a local whose name
      ends in parameter_names or secret_names (terraform/personal/secret_parameters.tf's secret_parameter_names), and
      every secret:, parameter/ or /secret/ fragment in an IAM grant; a token is one bounded by -, _, / or a quote.
      Like (a), (g) skips comment lines and trailing comments (live comments already quote grant-shaped fragments).
      Comment detection is string-aware: # and // start a comment only outside a quoted string (s3://, https:// and
      #logsV2 live inside strings), and nothing strips /* */ blocks (the roots use none; /* appears in ARN wildcards).
  - file: scripts/checks/iam_tf/_manifest.py
    action: Modify
    purpose: >-
      Entry for validate_account_portable_names (pre=True, fast tier); pre_globs cover terraform/bootstrap/**,
      terraform/personal/**, config/terraform/backend-personal-sit.hcl, the check module, _account_names.py,
      scripts/checks/_common.py and scripts/checks/registry.py (as the sibling Entries list).
  - file: scripts/checks/ci_guards/_manifest.py
    action: Modify
    purpose: >-
      Entry validate_github_settings_apply's pre_globs gain every input the check now depends on through render:
      scripts/checks/iam_tf/_account_names.py, terraform/bootstrap/account_names.tf, terraform/bootstrap/variables.tf,
      terraform/personal/account_names.tf and terraform/personal/variables.tf (validate_pre_glob_closure follows import
      edges only, so a diff touching only account_names.tf would otherwise skip the check on --pre).
  - file: tests/checks/ci_guards/test__manifest.py
    action: Modify
    purpose: >-
      A closure case test_github_settings_apply_entry_closes_over_its_render_inputs in TestGatedEntryInputClosures, modelled on
      test_dependabot_config_entry_closes_over_its_inputs: the five render inputs above are in its pre_globs. Step 1
      runs and graduates it.
  - file: config/ci_rca_taxonomy.yaml
    action: Modify
    purpose: Taxonomy row validate_account_portable_names (environment class, like validate_terraform_try).
  - file: tests/checks/iam_tf/test_validate_account_portable_names.py
    action: Create
    purpose: >-
      Red cases per predicate (a)-(g) on synthetic trees (for (g) a -sit secret name, a sandbox parameter path in a local
      and a /secret/...-sit grant fragment; for (a) also an s3://<name> literal and a literal on a line carrying a /*
      ARN wildcard, both red), the real tree green, and registration on the fast tier.
  - file: tests/checks/iam_tf/test__account_names.py
    action: Create
    purpose: >-
      The mirror test validate_test_coverage maps _account_names.py to: render() for both environments, the
      interpolation and bare-reference forms, other tokens untouched, an absent account_names.tf (identity), and a
      patched ROOT read at call time; full line coverage.
  - file: scripts/checks/iam_tf/_read_coverage.py
    action: Modify
    new_imports: [scripts.checks.iam_tf._account_names]
    purpose: >-
      Terraform text is read through _account_names.render before locals and names resolve, so aws_s3_bucket
      data_lake / ducklake_catalog_dr names and every policy ARN resolve exactly as today (fixes the
      ci-refresh-read, trusted read and agent-observability read real-tree reds the dry run showed).
  - file: scripts/checks/ci_guards/validate_github_settings_apply.py
    action: Modify
    new_imports: [scripts.checks.iam_tf._account_names]
    purpose: >-
      Reads github_settings_apply.tf and platform_admin_policies.tf through render (this module's SETTINGS_TF and ADMIN_TF names at its lines 76-77, and _load_tree's bootstrap read at its line 519), so its exact-ARN
      predicates (_STATE, the mirror ARN) hold unchanged.
  - file: tests/checks/ci_guards/test_validate_github_settings_apply.py
    action: Modify
    purpose: >-
      Expected unchanged: render applies inside validate_github_settings_apply._load_tree (its bootstrap read), and the
      test's boot fixture comes from _load_tree, so test_h_the_mirror_local_widened's mutation acts on rendered text as
      today. The row stays in scope only so that, if the build finds a node that reads the raw file, it may point that
      node at the rendered text with the same assertion.
  - file: tests/checks/iam_tf/test_ci_branch_boundary_state_fence.py
    action: Modify
    purpose: _read renders the boundary through _account_names.render; the asserted ARNs and roles are unchanged.
  - file: tests/checks/iam_tf/test_telemetry_prefix_fence.py
    action: Modify
    purpose: Same render on read; assertions unchanged.
  - file: tests/checks/iam_tf/test_platform_iam_bootstrap_adoption.py
    action: Modify
    purpose: >-
      _bootstrap_texts renders through render; the mutation cases are unchanged (they act on the rendered text, whose
      literals and alignment match today's), keeping their detected-violation assertions.
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      T2.57 c3 (rec-5025: the roots are account-portable) flips to met in the build PR's bookkeeping walk
      (tier-item-lifecycle.yaml bookkeeping_walk), on step 1 green and the step 6 and step 7 zero-change evidence for the
      PR head. c3 is a property of the code, proven before merge; the post-merge apply (steps 8-9) is rec-5025's
      closure evidence, not c3's. Its met_by note says the per-account secret values land with c5 (rec-5027), so c3
      reads met for the names, backends and shared secret names this build delivers. No other criterion or item status
      changes.
implementation_declared: true
bundled_recommendations: [rec-5025]
followon_recs: [rec-5058]
infrastructure_dependencies:
  - "terraform/bootstrap: admin-tier apply (Decision 126 cl.1, Decision 248 cl.6) after the pre-merge read-only ADMIN plan (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan); expected 0 to add, 0 to change, 0 to destroy, so the apply only proves the merged code is the applied code."
  - "terraform/personal: the PR's speculative plan must read No changes; the merge applies an empty saved plan (environment-taxonomy.yaml axis_a.sandbox)."
  - "No SIT resource is created here: the SIT state buckets and every SIT apply are rec-5027's."
acceptance_criteria:
  - "No literal arn:aws:s3:::agent-platform-data-lake remains in terraform/bootstrap, and config/terraform/backend-personal-sit.hcl exists (rec-5025's acceptance, as updated 2026-11-10)."
  - validate_account_portable_names passes on the real tree and each of its predicates has a red case.
  - Every pre-existing iam_tf and ci_guards node passes with no assertion loosened.
  - The pre-merge admin plan of terraform/bootstrap at the PR head shows zero changes and main's own plan shows zero rows.
  - "The PR's trusted plan of terraform/personal reads State: NO_CHANGES with predicted guard verdict PASS."
  - The post-merge saved plan of terraform/bootstrap exits 0, its apply applies zero changes, and a fresh plan exits 0 with -detailed-exitcode.
  - "Every Secrets Manager secret and SSM parameter name declared, listed or granted in terraform/bootstrap and terraform/personal carries no account or environment token (sandbox, sit), so both accounts use the same names with per-account values; the one name containing prod (agent-platform-ducklake-telemetry-writer-prod-dsn) names the production telemetry catalog, not the account. Proven by step 1's standing predicate (g)."
  - "T2.57 c3 reads met in the build PR on the evidence of acceptance criteria 1-5 and 8 (no literal bucket ARN and the SIT backends: 1 and 2; per-account names rendering today's values: 2, 4 and 5; same secret names: 8), and rec-5025 reads closed with its closure trailer after merge."
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      The new validator's unit tests: one red case per predicate (a)-(g) on synthetic trees (for (f): a wrong bucket, a
      wrong key, a region set; for (g): an environment token in a secret name, a parameter path and a grant fragment),
      the real tree green and the fast-tier registration; render()'s own mirror test; and the new pre_globs closure
      case for validate_github_settings_apply. The first two files and the closure node are absent on main, so this is
      red before.
    command: bin/venv-python -m pytest tests/checks/iam_tf/test_validate_account_portable_names.py tests/checks/iam_tf/test__account_names.py "tests/checks/ci_guards/test__manifest.py::TestGatedEntryInputClosures::test_github_settings_apply_entry_closes_over_its_render_inputs" -q
    expected: exit 0; red before (file absent on main).
    fix_if: a predicate has no red case, the real tree fails, or the Entry or taxonomy row is missing
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: account-portable-names
  - step: 2
    phase: pre-deploy
    action: >-
      The suites the dry run turned red, plus every iam_tf and ci_guards node, after the HCL edit and the render
      re-routing. A node that needed more than reading through render is a scope question, not a fix: stop and
      report it as a plan defect.
    command: bin/venv-python -m pytest tests/checks/iam_tf tests/checks/ci_guards tests/validate/test_terraform_checks.py tests/test_terraform_hcl_screen.py tests/test_trusted_plan_overlay.py tests/test_terraform_github_pr_plan.py -q
    expected: exit 0 (other tests that read terraform/personal outside these paths are left to the full tier)
    fix_if: >-
      a node fails: route its reader through _account_names.render; never change an expected ARN, count or Sid. If
      the fix needs anything else, file the plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      These pre-existing suites run in both tiers through their own graduated shards; on a PR run, pytest_diff runs
      the 78 modules in the build diff's affected set and step 11 replays the other 25. Step 1's new shard carries
      the new behaviour.
  - step: 11
    phase: pre-deploy
    action: >-
      Runs with step 2: the 25 step-2 modules that the build diff's pytest_diff selection defers as transitive residue
      (derive_affected_tests over the diff against origin/main at build head 5f6f4d4c, cap 35, residue depth 2).
      Replaying them on every PR run keeps every step-2 module on the pre-merge gate. At the final head, re-derive the
      residue with the same derive_affected_tests call; a deferred module absent from this list is a vp_text plan
      defect for the coordinator, never an inline edit (a listed module that is selected after all is only run twice).
    command: bin/venv-python -m pytest tests/checks/ci_guards/test__agent_loop_caps.py tests/checks/ci_guards/test__github_settings_mirror.py tests/checks/ci_guards/test__trusted_plan_role_partition.py tests/checks/ci_guards/test__workflow_shell_bodies.py tests/checks/ci_guards/test_rec_autoclose_merge_leg.py tests/checks/ci_guards/test_terraform_github_plan_trusted.py tests/checks/ci_guards/test_terraform_plan_trusted.py tests/checks/ci_guards/test_validate_actions_account_id_masking.py tests/checks/ci_guards/test_validate_composite_action_shell_bodies.py tests/checks/ci_guards/test_validate_composite_action_shell_bodies_r2.py tests/checks/ci_guards/test_validate_masked_errexit_steps.py tests/checks/ci_guards/test_validate_pr_conflict_signal.py tests/checks/ci_guards/test_validate_trusted_plan_environment.py tests/checks/iam_tf/test_alerts_email_subscription.py tests/checks/iam_tf/test_ducklake_writer_error_alarms.py tests/checks/iam_tf/test_neon_catalog_history_retention.py tests/checks/iam_tf/test_platform_iam_admin_root_only.py tests/checks/iam_tf/test_telemetry_catalog_deploy_output.py tests/checks/iam_tf/test_telemetry_reader_and_twin_pins.py tests/checks/iam_tf/test_telemetry_shared_reader_pins.py tests/checks/iam_tf/test_telemetry_writer_invoke_grants.py tests/checks/iam_tf/test_validate_boundary_attached.py tests/checks/iam_tf/test_validate_iam_policy_size.py tests/checks/iam_tf/test_validate_secret_material_handling.py tests/validate/test_terraform_checks.py -q
    expected: exit 0
    fix_if: >-
      a node fails: as step 2 (route its reader through _account_names.render; never change an expected ARN, count or
      Sid). Measured cost 10-12s locally for 566 tests, about 15s on the CI runner by step 2's CI-to-local ratio.
    hermetic: true
    expected_literals: [" passed"]
    graduation: waive
    graduation_waiver_reason: These suites already run in both tiers through their own graduated shards; the list is the residue of one diff, not a standing check.
  - step: 3
    phase: pre-deploy
    action: rec-5025's own acceptance probe on the head tree.
    command: "! grep -rq 'arn:aws:s3:::agent-platform-data-lake' terraform/bootstrap && test -f config/terraform/backend-personal-sit.hcl && echo ACCEPTANCE_OK"
    expected: ACCEPTANCE_OK printed; on main the grep finds the literal, so it is red before.
    fix_if: the grep finds a literal (a comment counts; rewrite the comment to name the local)
    hermetic: true
    expected_literals: [ACCEPTANCE_OK]
    graduation: waive
    graduation_waiver_reason: Subsumed by step 1's graduated predicates (a) and (f), which pin the same literal ban and the backend file in both tiers.
  - step: 4
    phase: pre-deploy
    action: >-
      Provider-free format and validate checks of both roots (init -backend=false, so no AWS call; validate catches a
      duplicate local or a dangling reference) and the static region and screen checks, then the fast tier; then the
      full tier before handoff, started backgrounded with a 2 h limit from the top-level session (bin/venv-python -m
      scripts.validate) and read on its completion with bin/venv-python -m scripts.checks.validation_result
      --verify-head. Not hermetic: the pr-validate runner has no terraform binary.
    command: >-
      terraform fmt -check -recursive terraform/bootstrap && terraform fmt -check -recursive terraform/personal &&
      for r in bootstrap personal; do TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir=terraform/$r init -backend=false -input=false > /dev/null && terraform -chdir=terraform/$r validate -no-color || exit 1; done &&
      bin/venv-python -m pytest tests/checks/ci_guards/test_validate_trusted_plan_screen.py tests/checks/ci_guards/test_validate_project_region.py -q &&
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      exit 0, no file listed by fmt, "Success! The configuration is valid." for both roots; then the fast tier and the full tier (backgrounded with a 2 h limit from the
      top-level session, handoff_policy) with validation_result --verify-head exit 0 for HEAD
    fix_if: >-
      fmt lists a file (run terraform fmt); the screen names account_names.tf (use the map index form, never ? or ==) or
      file_not_tf (a non-.tf file was added under terraform/personal: move it out); the region check names a backend
      file (remove the region)
    hermetic: false
    graduation: waive
    graduation_waiver_reason: The required terraform-validate job (ci.yml, scripts.validate --terraform-only) runs fmt -check, init -backend=false and validate on each root, and both pytest files already run in both tiers.
  - step: 5
    phase: pre-deploy
    action: ADMIN credential check (deploy-paths.yaml admin_out_of_band.pre_merge_live_plan ENVIRONMENT CHECK).
    command: bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
    expected: ADMIN_CHAIN_OK; on ADMIN_CHAIN_ABSENT the PR waits at CI-green for an ADMIN session to run step 6.
    fix_if: ADMIN_CHAIN_ABSENT in a session expected to hold admin credentials; report it, never widen
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      Pre-merge read-only ADMIN plan of terraform/bootstrap at the PR's CI-green head and at origin/main, each in a
      throwaway worktree with the gitignored terraform.bootstrap.tfvars copied in, -lock=false, plan files deleted in
      the step; counts and addresses only go on the PR with the head sha. On the operator's direction in that session
      (protected-actions.yaml), never standing.
    command: >-
      set -o pipefail; R=$(tr -d '[:space:]' < config/aws-region); E="${TMPDIR:-/tmp}/spr-evidence"; rm -rf "$E"; mkdir -p "$E";
      test -n "$PR_HEAD_SHA" || { echo PR_HEAD_SHA_UNSET; exit 1; };
      for ref in origin/main "$PR_HEAD_SHA"; do tag=$(echo "$ref" | tr '/' '-'); W="${TMPDIR:-/tmp}/spr-wt-$tag";
      git worktree add --detach "$W" "$ref" -q && cp terraform/bootstrap/terraform.bootstrap.tfvars "$W/terraform/bootstrap/" &&
      TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir="$W/terraform/bootstrap" init -input=false -backend-config="region=$R" > /dev/null 2>> "$E/tf.err" &&
      TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc terraform -chdir="$W/terraform/bootstrap" plan -input=false -lock=false -detailed-exitcode -var-file=terraform.bootstrap.tfvars -out="$E/p.bin" > /dev/null 2>> "$E/tf.err"; rc=$?;
      terraform -chdir="$W/terraform/bootstrap" show -json "$E/p.bin" 2>/dev/null | bin/venv-python -c "import json,sys; p=json.load(sys.stdin); print(sys.argv[1], 'ROWS', sum(1 for r in p.get('resource_changes', []) if r['change']['actions'] != ['no-op']))" "$tag";
      echo "$tag EXIT $rc"; rm -f "${E:?}/p.bin"; git worktree remove --force "$W"; done
    expected: >-
      origin-main ROWS 0 and EXIT 0; the head line ROWS 0 and EXIT 0 (no resource or policy change, Decision 242 cl.1).
      Post both lines and the head sha on the PR; tf.err stays local.
    fix_if: >-
      head ROWS above 0: a rendered policy changed; diff the rendered policy JSON locally (never post it) and fix the
      local or reference. main ROWS above 0: someone else's unapplied bootstrap change or drift; STOP and report before
      merge. EXIT 1: read the local tf.err.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: >-
      On the open PR, the trusted terraform/personal plan (terraform-plan-trusted.yml, job plan) for the head sha is
      green, did not post a refusal comment, and its plan comment reads No changes with predicted guard verdict PASS.
      Read with the GitHub MCP tools (AGENTS.md: session-side GitHub reads use mcp__github__*).
    command: >-
      mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="terraform-plan-trusted.yml", workflow_runs_filter={"event": "pull_request_target", "branch":
      "<PR head branch>"} (the workflow triggers only on pull_request_target)) -> the newest run whose head_sha is the head; list_workflow_jobs -> job plan's conclusion;
      mcp__github__pull_request_read(method="get_comments") -> the newest trusted-plan comment for that sha.
    expected: >-
      Job plan conclusion success; the comment carries "State: NO_CHANGES", "0 to import, 0 to add, 0 to change, 0 to
      destroy (0 replaced)." and "Predicted guard verdict: PASS"; no refusal comment for that sha. Record the run URL.
    fix_if: any change row -- the rename moved a value (most likely the bucket name or the lock key); fix and re-push
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      After merge, on the operator's direction in an ADMIN session: in a worktree at the literal path
      /tmp/spr-merge/wt at the merge sha, a saved plan of terraform/bootstrap with -detailed-exitcode, written to
      /tmp/spr-merge/merge.bin outside the worktree so the worktree stays clean for the one-shot approval
      (protected-actions.yaml approval.one_shot_at_commit). Its counts are presented to the operator (zero rows
      expected) with the exact step 9 apply command and the line to write, "approve tf-state-change bootstrap <merge
      sha>"; the worktree and merge.bin are kept for step 9. Nothing is applied in this step (Decision 126: plan,
      present). Terraform errors go to /tmp/spr-merge/tf.err, never posted.
    command: >-
      set -o pipefail; test -n "$MERGE_SHA" || { echo MERGE_SHA_UNSET; exit 1; }; R=$(tr -d '[:space:]' < config/aws-region); mkdir -p /tmp/spr-merge; export TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc;
      { git worktree remove --force /tmp/spr-merge/wt 2> /dev/null; rm -rf /tmp/spr-merge/wt; git worktree prune; git worktree add --detach /tmp/spr-merge/wt "$MERGE_SHA" -q; } &&
      cp terraform/bootstrap/terraform.bootstrap.tfvars /tmp/spr-merge/ &&
      terraform -chdir=/tmp/spr-merge/wt/terraform/bootstrap init -input=false -backend-config="region=$R" > /dev/null 2>> /tmp/spr-merge/tf.err &&
      terraform -chdir=/tmp/spr-merge/wt/terraform/bootstrap plan -input=false -no-color -detailed-exitcode -var-file=/tmp/spr-merge/terraform.bootstrap.tfvars -out=/tmp/spr-merge/merge.bin > /dev/null 2>> /tmp/spr-merge/tf.err; echo "MERGE_PLAN_EXIT $?";
      git -C /tmp/spr-merge/wt status --porcelain --untracked-files=all | grep -q . && echo WORKTREE_DIRTY || echo WORKTREE_CLEAN
    expected: >-
      MERGE_PLAN_EXIT 0 (no changes) and WORKTREE_CLEAN; present both lines, the step 9 command and the approve line to
      the operator and wait for their word.
    fix_if: >-
      MERGE_PLAN_EXIT 2 -- STOP: never run step 9; delete /tmp/spr-merge and the worktree, present the change count and
      re-run step 6 at the merge sha (the merge differs from what step 6 planned); EXIT 1 -- read /tmp/spr-merge/tf.err
      locally; WORKTREE_DIRTY -- an init or plan wrote inside the worktree (check .gitignore covers .terraform/ and the
      lock file is unchanged); clean it before asking, since the one-shot approval is refused on a dirty tree
    hermetic: false
    graduation: not-applicable
  - step: 9
    phase: post-deploy
    action: >-
      Only after step 8 printed MERGE_PLAN_EXIT 0 and WORKTREE_CLEAN and the operator wrote "approve tf-state-change
      bootstrap <merge sha>" in that session: apply the saved /tmp/spr-merge/merge.bin with -no-color (an empty plan, so
      the apply proves the merged code is the applied code), a fresh plan with -detailed-exitcode, cleanup, then the
      merge-time run of terraform-apply-sandbox.yml read back (its job apply-sandbox). The apply names its root by the
      literal -chdir path, the form the protected-action gate resolves.
    command: >-
      export TF_CLI_CONFIG_FILE=$HOME/.terraform-mirror.tfrc;
      terraform -chdir=/tmp/spr-merge/wt/terraform/bootstrap apply -input=false -no-color /tmp/spr-merge/merge.bin 2>> /tmp/spr-merge/tf.err | grep -E '^Apply complete!';
      terraform -chdir=/tmp/spr-merge/wt/terraform/bootstrap plan -input=false -no-color -detailed-exitcode -var-file=/tmp/spr-merge/terraform.bootstrap.tfvars > /dev/null 2>> /tmp/spr-merge/tf.err; echo "BOOTSTRAP_PLAN_EXIT $?";
      rm -f /tmp/spr-merge/merge.bin /tmp/spr-merge/terraform.bootstrap.tfvars; git worktree remove --force /tmp/spr-merge/wt
      -- then mcp__github__actions_list(method="list_workflow_runs", owner="otl-labs", repo="ontheloop",
      resource_id="terraform-apply-sandbox.yml", workflow_runs_filter={"event": "push", "branch": "main"}) -> the run
      whose head_sha is the merge sha, and list_workflow_jobs -> job apply-sandbox's conclusion.
    expected: >-
      "Apply complete! Resources: 0 added, 0 changed, 0 destroyed", then BOOTSTRAP_PLAN_EXIT 0; job apply-sandbox of the
      run on the merge sha concluded success. Record the merge sha, the lines and the run URL as a counts-only comment on
      the merged PR.
    fix_if: >-
      the gate denies the apply (re-check WORKTREE_CLEAN and that the approve line names this merge sha); BOOTSTRAP_PLAN_EXIT
      2 after the apply -- report on the PR and STOP; never apply again without a fresh step 8
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: rec-5025 closed by the squash commit's Resolves trailer; read back.
    command: bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows, _ = fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5025']); print(rows[0]['id'], rows[0]['status'])"
    expected: rec-5025 closed
    fix_if: still open after the closure job ran -- read ci.yml's closure job log; never close by hand without the trailer evidence
    hermetic: false
    graduation: not-applicable
