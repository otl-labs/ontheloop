constraints:
  - "PROD must not change: zero rows in both plans (steps 6-8). Any non-zero row stops the build; nothing is applied to make a plan converge."
  - "No assertion, expected ARN, Sid or count in an existing check or test is changed; readers are re-routed through render only. A node that needs more is a plan defect, never a local fix."
  - "Never print or commit an account id, ExternalId, e-mail, tfvars value or rendered policy (Decision 101); posted evidence is counts, exit codes and shas."
  - "The bootstrap apply runs only on the operator's direction given in that ADMIN session (Decision 126 cl.1, protected-actions.yaml), one admin mutation at a time: not while another bootstrap apply (rec-5026's Organization sittings, T4.15 c13, rec-4694) is in flight."
  - "terraform/personal uses no conditional or comparison operator (Decision 238 cl.4 screen); the env map index is the only form."
  - No rescue agents or workaround loops (Decision 55).
