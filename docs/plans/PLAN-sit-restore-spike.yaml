constraints:
  - "Never write or delete under ducklake/, ducklake-telemetry/ or telemetry-blobs/; all scratch lives under ducklake-neon-smoke/restore-rehearsal/<run_id>/."
  - Never run a maintenance verb (merge, gc, expire, cleanup, catalog_reinit) on the restored catalog.
  - Each admin-profile command runs only on the operator's in-session approval line (protected-actions.yaml); calls that need no admin grant name agent_platform.
  - No Terraform, no IAM change, no standing resource, no /secret/ parameter.
  - "Public repository (Decision 101): evidence, fixtures and PR comments are counts-only."
  - Governing text lands exactly as the sidecar binds; nothing else in DECISIONS.md, restore-rehearsal.yaml or ducklake_maintenance.yaml changes.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout verdict (round 2): FLAGS_FOUND (Decisions triaged: 202 of 202; Roadmap items intersected: 7; CONFLICT: 0; RELATED: 7). Serves: NS.1 3/5. CITE: 81, 126, 204, 214, 143, 216, 100, 201, 247, 99, 79, 101. WARN 249 (fixed-key zip) resolved by the per-sha zip and CodeSha256 equality; WARN 239 (telemetry in the dump) resolved by an ops-only restore from a presigned URL, no dump in the smoke prefix, residual named; WARN 237 resolved by amending it (transient branch-scoped credential, PlatformAdmin-only readable); NOTE 81 cl.7 resolved by naming every read in cl.3 and the pointer; NOTE 126 deploy-paths row filed as rec-5045 (deploy-paths.yaml at cap); NOTE 143 resolved by the PlatformAdmin-only invoke fact; NOTE 214 resolved in context; SPIRIT 77 resolved by cl.4's wording. Reports: /mnt/project-files/restore-spike/decision-scout-report.md and decision-scout-report-r2.md."
  - "Network: no cloud container has TCP/5432 egress (deploy-paths.yaml scoped_login_provisioning), so all Neon SQL runs inside the ephemeral functions; S3 and Neon REST run over 443."
  - "The DR dump is weekly (ducklake_catalog_dr.tf cron Sunday 03:00 UTC), not daily as the handover says; the sitting takes one on-demand dump through the catalog-dr Function URL (lambda_maintenance_gates.py catalog_dr gate precedent)."
  - "Grants (read from terraform/bootstrap 2026-11-09): PlatformAdmin holds lambda Create/Delete/Invoke/InvokeFunctionUrl and DR-bucket List/Get (platform_admin_policies.tf, platform_admin_data_policies.tf); PlatformDev holds data-lake Get/Put/Delete, ListBucketVersions and GetObjectVersion on the smoke prefix. iam:PassRole is held (PlatformAdmin iam:*, platform_admin_policies.tf:13); a boundary denial would stop the sitting and be rec-filed."
  - "Sizes (PlatformDev listing 2026-11-09): ducklake/ 4,900 objects 60 MB; ducklake-telemetry/ 8,341 objects 2.1 GB (not copied); telemetry-blobs/ 87 MB. Dump size and the fit in 10240 MB /tmp and 900 s: UNPROVEN until the sitting."
  - "Criterion 3: PyPI has 1.5.5, 1.5.6 and 2.0.0; a local probe (DuckDB-file catalog) shows 2.0.0 keeps ducklake_metadata.version 1.0 and 1.5.4 re-attaches, so no migration exists through 2.0.0. The sitting records the restored catalog's format; the candidate-engine leg is rec-5036 (planning-time split)."
  - "Restore target is a Neon child branch with a new role and new database (ADVICE Q2): compute isolated from PROD, teardown one branch delete; --no-acl plus foreign_owned 0 and foreign_acl 0 prove the restored catalog depends on no PROD role. The operator's stated direction is RDS for SIT and PROD, pending the SIT Decision (rec-5024); restoring into that backend, and any Neon-to-RDS version or extension gap, is rec-5030's proof and unproven here. pg_restore recreates the stats index in the scratch database; the contract's residual records that Decision 214 cl.2 binds live catalog schemas, not a restored scratch copy."
  - "Code home (ADVICE Q4 adapted): dormant verb in the maintenance package, run on ephemeral functions from the CI-published zip, because a function-less separate artifact has no build precedent and stub manifests are skipped by the build; the role is the boundary either way."
  - "Profiles (operator rule 2026-11-09): agent_platform by default; agent_platform_admin only for the steps sitting.order names (dump invoke, DR read and copy, function create and delete, Neon target, step invokes); code ships only through CI. The sitting runs in an admin-container thread the coordinator starts."
  - "deploy-paths.yaml has no admin_out_of_band row for this sitting until rec-5045 lands (the file is at its 500-line cap); the new Decision's cl.1 and its Decision 126 pointer authorise the sitting meanwhile, and the handoff note says so. The sitting is also outside protected-actions.yaml admin-credential's rec-4707 rule (the admin profile serves only named bootstrap and admin deploys); the new Decision's cl.1 authorises it."
  - "Decision number race: nine unbuilt plans scope DECISIONS.md. If one lands a Decision first, the before anchor (the Decision 250 heading) still matches but the new entry must go above the newer one and take the next number, which approved_text verify does not accept; the build then rebases, re-runs the wording check on the new base and the operator approves through a fresh approval run before PR 1 merges."
  - "Approvals at build start: the operator's in-session approve lines for each admin-profile command (protected-actions.yaml admin-credential and secret-read for /secret/neon-api-key); the admin-route choice is recorded in the handoff note."
  - "rec-5024's plan (Plan the SIT Decision thread) sets T2.57 c2 met_by this slug and re-anchors its Decision after this one; told 2026-11-09."
  - "File-catalog leg (duckdb_copy): added 2026-11-09 at the request of the Decide between RDS and Neon thread, whose catalog-backend choice needs a real PROD catalog copied into a DuckDB file; synthetic proof at /mnt/project-files/rds-vs-neon/ROUND-2.md section 1. Reported, not gating; the file stays in the restore function's /tmp."
  - "Related, not bundled: rec-4300 (restore into a Postgres without pg_read_all_data), rec-4883 (canary teardown on CC-web; its lesson is the teardown-first rule), rec-4694 (telemetry redaction for SIT reads)."
  - "Evidence: /mnt/project-files/restore-spike/ (advisor-brief/BRIEF.md, ADVICE.md, decision-scout-report.md, PRESENTATION.md)."
