acceptance_criteria:
  - The restore_rehearsal verb refuses, before any connection, everywhere but a function named *-restore-rehearsal-ephemeral holding the matching token; prod_checksum refuses when a target DSN is set, and every other step refuses without a restore_rehearsal_ target or with scratch outside ducklake-neon-smoke/restore-rehearsal/.
  - catalog_dr's default restore argv is unchanged; no_acl=True adds --no-acl and schema adds --schema.
  - The orchestrator resolves teardown first, tears down everything it created on any failure, and its evidence and stdout carry no host, DSN, password, bucket name, account id or ARN.
  - test_local_rewrite_reads_every_table passes (not skipped) on the PG16 stage, executing rewrite_data_path_sql's exact (sql, params) through psycopg2.
  - DECISIONS.md, restore-rehearsal.yaml and ducklake_maintenance.yaml hold exactly the sidecar's words (validate_merge_step green on the operator's approval run).
  - After the deploy, one human-directed ADMIN sitting completes (a step error is fixed and the sitting re-run) and produces evidence that verify-evidence accepts, or names the failed criteria that send SIT to its fallback.
  - The versioning rehearsal recovers a deleted scratch object with a matching sha256, as PlatformDev.
  - PR 2 commits both evidence files and the branch's acceptance test (test_rewritten_data_path_reads_every_table, or test_restore_rehearsal_failed_criteria on a failed criterion) passes on them; rec-5023 reads back closed with its result.
