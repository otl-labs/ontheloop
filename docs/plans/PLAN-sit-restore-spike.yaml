      called. copy_data also records prefix_sizes (an S3 list of ducklake/, ducklake-telemetry/ and
      telemetry-blobs/ as agent_platform, counts and bytes only). Subcommands: run, version-recovery (contract sitting.version_recovery; it honours --dev-profile only,
      default agent_platform, and refuses --profile), and verify-evidence FILE (delegated to restore_rehearsal_evidence).
      --dry-run prints the ordered admin mutation list and calls nothing (sitting.order present); it mints the run_id
      and prints it, and the run takes it back through --run-id, so the operator approves the exact names that run. Both functions are
      created from lambda-packages/<sha>/ducklake-maintenance.zip, <sha> being source_git_sha in
      deploy-records/ducklake/agent-platform-ducklake-maintenance.json (Decision 249; a workflow_run head_sha is main's
      HEAD, not the deployed commit), and before any step each function's CodeSha256 must equal that record's
      code_sha256 and the production function's, or the run stops. Function names never start with agent-platform- (CI
      roles hold lambda:Get* on that prefix). teardown_handles stops before creating anything when a rehearsal function,
      branch or restore-rehearsal/ scratch prefix (listed as agent_platform) already exists, and teardown deletes only what this run created. Each step runs under the principal
      sitting.order names (--profile for admin, --dev-profile for agent_platform). Every invoke response, exception and
      stderr is redacted (restore_rehearsal_evidence) before any print, exception text or evidence write; a
      SmokeTestFailure never embeds a response body. Evidence is written for a completed run and for one stopped by
      rewritten false, missing files, a failed ATTACH or table read, or a Lambda limit (contract result_rule), never for
      a step error, which prints only the redacted step, error_class and code. --restore-final (passed only on the
      sitting re-run after one restore fix) makes a pg_restore non-zero exit a result: evidence with restore_ok false
      and its exit status (contract result_rule); without it, the same exit is a step error. A Lambda-limit stop
      writes host_limit with the step and limit.
    new_imports: [scripts.ducklake_smoke.canary, scripts.ducklake_smoke.restore_rehearsal_aws, scripts.ducklake_smoke.restore_rehearsal_evidence]
  - file: scripts/ducklake_smoke/restore_rehearsal_aws.py
    action: Create
    purpose: >-
      PR 1. Pre-declared split of the orchestrator: every AWS and Neon call, all in memory. The target DSN and the
      presigned URL never touch a file, argv or stdout: the two functions are created with boto3
      lambda.create_function(Environment=...) (the target DSN, in URI form, only in the restore function's environment;
