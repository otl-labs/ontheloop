      passed (it writes production prefixes). Layers, MemorySize and CodeSha256 are read from the production
      maintenance function; Runtime python3.12, Handler src.lambdas.ducklake_maintenance.handler.handler and
      Architectures x86_64 are fixed as in ducklake_maintenance.tf. From the ephemeral functions' responses only
      CodeSha256 and State are read; Environment is never read from any function. The dump is one SigV4-signed POST to
      the catalog-dr Function URL (the same signing as core._sigv4_invoke, whose 180 s timeout is fixed, with timeout
