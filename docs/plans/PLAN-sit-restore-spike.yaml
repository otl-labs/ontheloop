      calls go through src.common.neon_api. It reuses canary.py's _wait_function_active and _canary_delete_function.
    new_imports: [scripts.ducklake_smoke.canary, scripts.ducklake_smoke.restore_rehearsal_evidence, src.common.neon_api]
