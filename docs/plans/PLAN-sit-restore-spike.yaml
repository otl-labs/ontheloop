schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "sit-restore-spike"
intent: >-
  Prove, in today's single account and before any SIT infrastructure exists, the two mechanics the whole SIT design
  rests on and has never run: a PROD DuckLake catalog dump restores into an empty Neon target under its own role, and
  ducklake_metadata.data_path rewritten to a location outside the production data path reads every table and takes
  writes there only. Record the timings, sizes and catalog format SIT's reset depends on, and rehearse recovery of a
  deleted data-lake object from S3 versioning. The result feeds the SIT Decision's data-model clause (rec-5024); a
  failure sends SIT to its fallback (fresh-init catalog plus synthetic data).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-sit-restore-spike.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-5023,
  the first SIT item. The SIT tier item T2.57 lands with rec-5024's build, whose criterion c2 cites this plan's slug;
  this plan flips no criterion itself.
scope:
  # ------------------------------------------------------------ PR 1: code, contract and Decision (merge, deploy)
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      PR 1. The new Decision exactly as docs/plans/approved/sit-restore-spike.yaml binds (block decision-new): the
      human-directed ADMIN-agent rehearsal sitting carve-out, amending Decisions 81, 126 and 237, plus the one-line
      forward pointers on Decisions 126, 81 and 237 (blocks d126-pointer, d81-pointer, d237-pointer) the supersession
      guard requires. {{N}} and {{DATE}} are filled at build time. If another Decision lands first, the entry no
      longer sits directly above Decision 250 as approved_text verify expects, so the operator re-approves (context:
      Decision number race).
  - file: docs/contracts/restore-rehearsal.yaml
    action: Create
    purpose: >-
      PR 1. The Class D contract exactly as the sidecar binds (block contract-new): boundary, the restore_rehearsal verb
      and its seven steps, the sitting order with the principal of each call, the consistency rule, the evidence keys and
      the exit criteria the verifier checks.
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      PR 1. Two lines exactly as the sidecar binds (blocks maintenance-pointer, maintenance-log): the description names
      the ephemeral-only restore_rehearsal verb and its contract, plus one amendment_log row. The file is NEAR_CAP (495 of
      500 effective lines on main 2026-11-09; 497 after): add nothing else.
  - file: src/common/neon_api.py
    action: Modify
    purpose: >-
      PR 1. create_branch gains an optional name; add create_role(api_key, project_id, branch_id, role_name) -> password
      and create_database(api_key, project_id, branch_id, db_name, owner_name) over the existing _api_post (443, stdlib
      urllib). Neon serialises operations per branch: each call first waits, bounded, until the branch's operations have
      finished (GET /projects/{project_id}/operations, filtered to the branch_id; the exact filter is confirmed against
      Neon's API reference at build) and retries a 423 Locked a bounded number of times before failing. Loud-fail
      (NeonApiError) on any other non-2xx; the password is never in an exception, log line or return other than
      create_role's (no response body is quoted in any error: _api_request stops quoting its 500 characters and the existing
      create_branch loud-fails stop embedding the body, since a branch response can carry connection URIs).
      NeonApiError gains a status attribute, which the 423 retry reads. Orchestrator-only: no Lambda imports it,
      though data-pipeline packages src/ whole (VP 8 and its forced deploy).
  - file: src/common/catalog_dr.py
    action: Modify
    purpose: >-
      PR 1. run_pg_restore gains a clean passthrough (default True, today's behaviour); build_pg_restore_cmd and
      run_pg_restore gain keywords no_acl: bool = False (True adds --no-acl, so a restore
      never depends on roles that exist only in PROD) and schema: str | None = None (adds --schema=<s>, so the rehearsal
      restores ducklake_ops only and never the telemetry catalog, Decision 239). Default argv byte-identical to today (restore_drill and any real DR
      restore keep their grants). CatalogDrError gains a returncode attribute (pg_restore's exit status), so the restore
      step's value-free code needs no message. dsn_uri percent-encodes the user and password (urllib.parse.quote, safe
      ''), so a decoded password with reserved characters re-joins correctly; Neon's are alphanumeric today.
  - file: src/lambdas/ducklake_maintenance/restore_rehearsal_actions.py
    action: Create
    purpose: >-
      PR 1. action_restore_rehearsal(event, _con), dispatching on event.step to restore, rewrite, verify, prod_checksum,
      duckdb_copy, write_probe and teardown_scratch exactly as docs/contracts/restore-rehearsal.yaml verb.steps defines. First statement, before any
      connection: the contract's defence_in_depth refusals (function-name suffix -restore-rehearsal-ephemeral; env
      DUCKLAKE_RESTORE_REHEARSAL equals event.confirm; prod_checksum refuses when env DUCKLAKE_RESTORE_TARGET_DSN is set,
      and every other step refuses when it is absent or its username or dbname does not start restore_rehearsal_, which
      binds each step to its function; every scratch path under the smoke data path's restore-rehearsal/<run_id>/),
      raising RestoreRehearsalRefused. restore downloads the dump to /tmp from the presigned https S3 URL in its event (refused if
      the URL is not one; the URL is never logged or returned) creates schema ducklake_ops as the target role (a
      schema-filtered pg_restore never creates it: PG16 probe, critique round 2 B1), then calls run_pg_restore with
      clean=False, no_acl=True and schema="ducklake_ops" through one extracted helper, restore_ops_schema(dump_path, target_dsn, *, pg_restore_path=LAMBDA_PG_RESTORE_PATH),
      that the PG16 test calls; it deletes the local dump in a finally. Every exception
      raised beneath a step is caught and returned as {ok: false, step, error_class, code} with no message (code is a SQLSTATE or pg_restore's exit status) (pg_restore stderr,
      DuckDB connection errors and CatalogDrError text can name a host). absolute_paths counts ducklake_schema,
      ducklake_table, ducklake_data_file and ducklake_delete_file rows with path_is_relative false. foreign_owned and
      foreign_acl are measured only over the ducklake_ops namespace (the schema and its relations), never the target
      database's public schema or objects Neon creates. teardown_scratch
      deletes only under the run's scratch prefix. prod_checksum alone reads the function's own catalog DSN (rt.fetch_dsn) and only
      ATTACHes READ_ONLY, with DATA_PATH set to the production ops data path built from the bucket constant as restore_drill
      does (handler.py:144-145), never open_connection's smoke default. duckdb_copy writes its DuckDB-file catalog only under /tmp, never uploads or returns it, and
      returns only the contract's duckdb_copy fields. The rewrite SQL builder (rewrite_data_path_sql(meta_schema, new_path) -> (sql, params)) is a
      pure function the local test reuses; it updates only the global row (key 'data_path' and scope IS NULL). rewrite
      returns rewritten false and runs no UPDATE when absolute_paths is above 0. verify records attach_ok and each
      table's read_ok instead of raising when the ATTACH or a table read fails (a missing file fails the read). Checksum:
      one expression, SELECT count(*), sum(hash(t))::VARCHAR FROM <table> t AT (VERSION => n), the alias before AT
      (duckdb 1.5.4 rejects it after; each whole row hashed as a struct), shared by verify, prod_checksum and duckdb_copy. Responses carry only what the contract's responses line allows.
    new_imports: [src.common.catalog_dr, src.common.ducklake_runtime, src.lambdas.ducklake_maintenance._shared, src.lambdas.ducklake_maintenance.restore_rehearsal_file_catalog]
  - file: src/lambdas/ducklake_maintenance/restore_rehearsal_file_catalog.py
    action: Create
    purpose: >-
      PR 1. The duckdb_copy step only (pre-declared split so restore_rehearsal_actions.py stays under 500 SLOC): build
