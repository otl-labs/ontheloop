schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "sit-restore-spike"
intent: >-
  Prove, in today's single account and before any SIT infrastructure exists, the two mechanics the whole SIT design
  rests on and has never run: a PROD DuckLake catalog dump restores into an empty Neon target under its own role, and
  ducklake_metadata.data_path rewritten to a location outside the production data path reads every table and takes
  writes there only. Record the timings, sizes and catalog format SIT's reset depends on, and rehearse recovery of a
  deleted data-lake object from S3 versioning. The result feeds the SIT Decision's data-model clause (rec-5024); a
  failure sends SIT to its fallback (fresh-init catalog plus synthetic data).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-sit-restore-spike.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped). Executes rec-5023,
  the first SIT item. The SIT tier item T2.57 lands with rec-5024's build, whose criterion c2 cites this plan's slug;
  this plan flips no criterion itself.
scope:
  # ------------------------------------------------------------ PR 1: code, contract and Decision (merge, deploy)
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      PR 1. The new Decision exactly as docs/plans/approved/sit-restore-spike.yaml binds (block decision-new): the
      human-directed ADMIN-agent rehearsal sitting carve-out, amending Decisions 81 and 126, plus the one-line forward
      pointers on Decisions 126 and 81 (blocks d126-pointer, d81-pointer) the supersession guard requires. {{N}} and {{DATE}} are filled
      at build time; a clean tool-made renumber keeps the approval.
  - file: docs/contracts/restore-rehearsal.yaml
    action: Create
    purpose: >-
      PR 1. The Class D contract exactly as the sidecar binds (block contract-new): boundary, the restore_rehearsal verb
      and its seven steps, the sitting order with the principal of each call, the consistency rule, the evidence keys and
      the exit criteria the verifier checks.
  - file: docs/contracts/ducklake_maintenance.yaml
    action: Modify
    purpose: >-
      PR 1. Two lines exactly as the sidecar binds (blocks maintenance-pointer, maintenance-log): the description names
      the ephemeral-only restore_rehearsal verb and its contract, plus one amendment_log row. The file is NEAR_CAP (495 of
      500 effective lines on main 2026-11-09; 497 after): add nothing else.
  - file: src/common/neon_api.py
    action: Modify
    purpose: >-
      PR 1. create_branch gains an optional name; add create_role(api_key, project_id, branch_id, role_name) -> password
      and create_database(api_key, project_id, branch_id, db_name, owner_name) over the existing _api_post (443, stdlib
      urllib). Neon serialises operations per branch: each call first waits, bounded, until the branch's operations have
      finished (GET .../operations) and retries a 423 Locked a bounded number of times before failing. Loud-fail
      (NeonApiError) on any other non-2xx; the password is never in an exception, log line or return other than
      create_role's (response bodies of role calls are never quoted in errors). Orchestrator-only: no Lambda imports it,
      though data-pipeline packages src/ whole (VP 8).
  - file: src/common/catalog_dr.py
    action: Modify
    purpose: >-
      PR 1. build_pg_restore_cmd and run_pg_restore gain keywords no_acl: bool = False (True adds --no-acl, so a restore
      never depends on roles that exist only in PROD) and schema: str | None = None (adds --schema=<s>, so the rehearsal
      restores ducklake_ops only and never the telemetry catalog, Decision 239). Default argv byte-identical to today (restore_drill and any real DR
      restore keep their grants).
  - file: src/lambdas/ducklake_maintenance/restore_rehearsal_actions.py
    action: Create
    purpose: >-
      PR 1. action_restore_rehearsal(event, _con), dispatching on event.step to restore, rewrite, verify, prod_checksum,
      duckdb_copy and write_probe exactly as docs/contracts/restore-rehearsal.yaml verb.steps defines. First statement, before any
      connection: the contract's defence_in_depth refusals (function-name suffix -restore-rehearsal-ephemeral; env
      DUCKLAKE_RESTORE_REHEARSAL equals event.confirm; target DSN only from env DUCKLAKE_RESTORE_TARGET_DSN, username and
      dbname starting restore_rehearsal_; every scratch path under the smoke data path's restore-rehearsal/<run_id>/),
      raising RestoreRehearsalRefused. restore downloads the dump to /tmp from the presigned https S3 URL in its event (refused if
      the URL is not one; the URL is never logged or returned) and calls run_pg_restore with clean=False, no_acl=True and
      schema="ducklake_ops"; it deletes the local dump before returning. Every exception
      raised beneath a step is caught and returned as {ok: false, step, error_class} with no message (pg_restore stderr,
      DuckDB connection errors and CatalogDrError text can name a host). absolute_paths counts ducklake_schema,
      ducklake_table, ducklake_data_file and ducklake_delete_file rows with path_is_relative false. teardown_scratch
      deletes only under the run's scratch prefix. prod_checksum alone reads the function's own catalog DSN (rt.fetch_dsn) and only
      ATTACHes READ_ONLY. duckdb_copy writes its DuckDB-file catalog only under /tmp, never uploads or returns it, and
      returns only the contract's duckdb_copy fields. The rewrite SQL builder (rewrite_data_path_sql(meta_schema, new_path) -> (sql, params)) is a
      pure function the local test reuses. Checksum: one expression, SELECT count(*), sum(hash(t))::VARCHAR FROM <table> t
      (each whole row hashed as a struct), shared by verify, prod_checksum and duckdb_copy. Responses carry only what the contract's responses line allows.
    new_imports: [src.common.catalog_dr, src.common.ducklake_runtime]
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      PR 1. One _ACTIONS entry, "restore_rehearsal": restore_rehearsal_actions.action_restore_rehearsal;
      RestoreRehearsalRefused mapped to a 400 response beside the existing typed errors; and, at dispatch, a function
      whose AWS_LAMBDA_FUNCTION_NAME ends in -restore-rehearsal-ephemeral refuses every action but restore_rehearsal
      (400, before any connection). The module docstring names the verb. Nothing else (headroom 32 SLOC).
    new_imports: [src.lambdas.ducklake_maintenance.restore_rehearsal_actions]
  - file: src/lambdas/ducklake_maintenance/manifest.yaml
    action: Modify
    purpose: >-
      PR 1. Add src/lambdas/ducklake_maintenance/restore_rehearsal_actions.py to includes (the manifest lists files one
      by one; validate_lambda_bundle_completeness catches a miss) and name restore_rehearsal in the notes' list of
      ephemeral-only carve-outs. Decision 79.
  - file: scripts/ducklake_smoke/restore_rehearsal.py
    action: Create
    purpose: >-
      PR 1. Orchestrator implementing docs/contracts/restore-rehearsal.yaml sitting.order exactly (canary pattern, all
      calls over 443). It owns its create-function call (canary.py's helper hard-codes 512 MB and shorthand
      --environment, and canary.py stays out of scope): JSON --environment from a 0600 temp file removed at once, never
      argv; the target DSN in URI form; ephemeral storage 10240 MB, timeout 900 s, memory and layers read from the
      production maintenance function for both functions. It reuses canary.py's _aws_cmd, _wait_function_active,
      _canary_delete_function and _lambda_invoke_cli, and core._sigv4_invoke and core._function_url for the dump.
      --dry-run prints the ordered admin mutation list and calls nothing (sitting.order present). The dump reaches the
      restore function only as a 15-minute presigned GET in that one invoke's event, never printed, logged or written.
      Both functions are created from lambda-packages/<sha>/ducklake-maintenance.zip, <sha> being the head_sha of the
      newest successful deploy-ducklake-lambdas run that deployed the production maintenance function, and before any
      step each function's CodeSha256 must equal the production function's or the run stops (Decision 249). Each step runs under
      the principal sitting.order names (--profile for admin, --dev-profile for agent_platform). Invoke responses and
      subprocess stderr are redacted (host, DSN, password, bucket, account id, ARN patterns) before any print, exception
      text or evidence write; a SmokeTestFailure never embeds a response body. run_id is a UTC timestamp plus 6 hex
      characters. Every scratch key is built by one function that refuses a path outside
      ducklake-neon-smoke/restore-rehearsal/<run_id>/. The target DSN reaches only the restore function's environment
      (create-function --environment), never an invoke payload, stdout or the evidence. Subcommands: run, version-recovery
      (contract sitting.version_recovery, agent_platform only), and verify-evidence FILE (every exit_criteria entry;
      refuses evidence holding a host, DSN, password, bucket name, 12-digit account id or ARN; prints RESTORE_REHEARSAL_OK
      or VERSION_RECOVERY_OK, else names each failed criterion and exits 1; evidence is written only for a run that
      reached write_probe (contract result_rule); separately prints DUCKDB_COPY_OK or names
      each duckdb_copy_tables mismatch, which never changes the exit code).
    new_imports: [scripts.ducklake_smoke.core, scripts.ducklake_smoke.canary, src.common.neon_api]
  - file: scripts/ducklake_neon_smoke_test.py
    action: Modify
    purpose: >-
      PR 1. --restore-rehearsal and --restore-rehearsal-version-recovery join the mutually exclusive gate group, with
      --evidence-out PATH, --dev-profile (default agent_platform) and --dry-run, dispatching to scripts.ducklake_smoke.restore_rehearsal. Unbuilt plans PLAN-neon-key-out-of-pr-plans
      and PLAN-telemetry-owner-provisioning also scope this file; whichever builds second rebases.
    new_imports: [scripts.ducklake_smoke.restore_rehearsal]
  - file: tests/test_neon_api.py
    action: Modify
    purpose: PR 1. create_role and create_database request shapes; non-2xx loud-fail; the password never in exception text.
  - file: tests/test_catalog_dr.py
    action: Modify
    purpose: PR 1. no_acl=True adds --no-acl and schema adds --schema; the default argv list is unchanged.
  - file: tests/lambdas/ducklake_maintenance/test_restore_rehearsal_actions.py
    action: Create
    purpose: >-
      PR 1. Each refusal (production function name, missing or wrong token, a non-rehearsal target, a scratch path
      outside the prefix, rewrite with absolute_paths above 0) raises before any connection or subprocess; the rewrite SQL
      names only data_path in the named meta-schema; prod_checksum attaches READ_ONLY; duckdb_copy writes nothing outside /tmp and returns no file; no response field matches the
      forbidden patterns; _ACTIONS["restore_rehearsal"] is registered and a refusal maps to 400 on the production name;
      on an ephemeral name every other action (catalog_reinit, gc and the rest) refuses before any connection; a forced
      pg_restore error and a forced ATTACH error whose messages hold a fake host and password return only step and
      error_class; restore passes clean=False, no_acl=True and schema ducklake_ops, and refuses a non-S3 dump URL; absolute_paths counts all four path-bearing tables.
  - file: tests/ducklake_neon_smoke_test/test_restore_rehearsal.py
    action: Create
    purpose: >-
      PR 1. With the aws, Neon and invoke seams mocked: teardown handles resolve before anything is created; a raise at
      every later step still tears down each created resource and records it; the dump precedes the data copy; scratch
      keys never leave the prefix; the DSN reaches only the function environment; verify-evidence accepts a complete
      evidence file and names each failed criterion otherwise, and refuses forbidden patterns; a failing invoke whose
      response and stderr carry a fake host, DSN and password leaves none of them in stdout, the raised error or the
      evidence; --dry-run calls nothing; each step uses the principal sitting.order names; the target DSN never appears
      in argv; the presigned URL never reaches stdout or the evidence; a CodeSha256 mismatch stops the run before any
      step and still tears down. Plus
      test_local_rewrite_reads_every_table (@pytest.mark.integration, network fixture, skips only if the ducklake
      extension cannot be fetched): a real local DuckLake (DuckDB-file catalog, data inlining disabled) with two tables
      is copied to a second directory, rewritten with rewrite_data_path_sql, the original deleted, every table re-read
      without OVERRIDE_DATA_PATH with equal counts and checksums, and a write lands only in the new directory.
  # ------------------------------------------------------------ PR 2: the sitting's evidence (after the sitting)
  - file: tests/fixtures/restore_rehearsal/evidence.json
    action: Create
    purpose: >-
      PR 2. The sitting's counts-only evidence file as the orchestrator wrote it, unedited, from a completed run (no
      host, DSN, password, bucket name, account id or ARN; verify-evidence's forbidden-pattern check passes either way).
  - file: tests/fixtures/restore_rehearsal/version_recovery.json
    action: Create
    purpose: PR 2. The versioning rehearsal's evidence file, unedited.
  - file: tests/ducklake_neon_smoke_test/test_restore_rehearsal_evidence.py
    action: Create
    purpose: >-
      PR 2, written for the branch the sitting produced. Pass branch: test_rewritten_data_path_reads_every_table
      (rec-5023's acceptance, moved here by update_rec in PR 2): the committed evidence passes verify-evidence, every ops
      table's restored count and checksum equal PROD's, missing_files 0, write probe in scratch only, every torn_down
      true. Failure branch (a completed run with a failed criterion): test_restore_rehearsal_failed_criteria asserts
      verify-evidence names exactly the failed criteria recorded, every torn_down true and no forbidden pattern; rec-5023's
      acceptance is updated to that test, and the fallback goes to rec-5024's owner through the coordinator. test_version_recovery_evidence:
      sha256 match. test_duckdb_copy_evidence: the file-catalog leg's rows are present and reported (not asserted equal:
      that leg gates nothing). Pure JSON reads: hermetic, fast tier.
bundled_recommendations: [rec-5023]
followon_recs: [rec-5036, rec-5045]
infrastructure_dependencies: []
acceptance_criteria:
  - The restore_rehearsal verb refuses, before any connection, everywhere but a function named *-restore-rehearsal-ephemeral holding the matching token, a restore_rehearsal_ target and scratch under ducklake-neon-smoke/restore-rehearsal/.
  - catalog_dr's default restore argv is unchanged; no_acl=True adds --no-acl and schema adds --schema.
  - The orchestrator resolves teardown first, tears down everything it created on any failure, and its evidence and stdout carry no host, DSN, password, bucket name, account id or ARN.
  - test_local_rewrite_reads_every_table passes (not skipped) in the build session.
  - DECISIONS.md, restore-rehearsal.yaml and ducklake_maintenance.yaml hold exactly the sidecar's words (validate_merge_step green on the operator's approval run).
  - After the deploy, one human-directed ADMIN sitting completes (a step error is fixed and the sitting re-run) and produces evidence that verify-evidence accepts, or names the failed criteria that send SIT to its fallback.
  - The versioning rehearsal recovers a deleted scratch object with a matching sha256, as PlatformDev.
  - PR 2 commits both evidence files and the branch's acceptance test (test_rewritten_data_path_reads_every_table, or test_restore_rehearsal_failed_criteria on a failed criterion) passes on them; rec-5023 reads back closed with its result.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Neon API gains role and database creation without leaking the password
    command: bin/venv-python -m pytest tests/test_neon_api.py -k "create_role or create_database" -q
    expected: all selected pass; red before (functions absent)
    fix_if: fix neon_api; never print the password
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: neon-api-create-role-database
  - step: 2
    phase: pre-deploy
    action: pg_restore gains opt-in --no-acl and --schema; default argv unchanged
    command: bin/venv-python -m pytest tests/test_catalog_dr.py -k "no_acl or restore_schema" -q
    expected: selected pass; red before (no_acl keyword absent)
    fix_if: keep the default argv byte-identical
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: catalog-dr-restore-no-acl
  - step: 3
    phase: pre-deploy
    action: The rehearsal verb refuses everywhere but an ephemeral rehearsal function and returns allowed fields only
    command: bin/venv-python -m pytest tests/lambdas/ducklake_maintenance/test_restore_rehearsal_actions.py -q
    expected: all pass; red before (file absent)
    fix_if: tighten the guard; never relax a refusal
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: restore-rehearsal-refusal-guard
  - step: 4
    phase: pre-deploy
    action: Orchestrator sequencing, teardown, secret transport and evidence verifier
    command: bin/venv-python -m pytest tests/ducklake_neon_smoke_test/test_restore_rehearsal.py -m "not integration" -q
    expected: all pass; red before (file absent)
    fix_if: fix the orchestrator
    hermetic: true
    expected_literals: [" passed"]
    graduation: graduate
    graduation_check_id: restore-rehearsal-orchestrator
  - step: 5
    phase: pre-deploy
    action: A real local DuckLake rewrite reads every table and writes only to the new path
    command: bin/venv-python -m pytest tests/ducklake_neon_smoke_test/test_restore_rehearsal.py::test_local_rewrite_reads_every_table -q -rs
    expected: 1 passed and no SKIPPED line (fetches the ducklake extension over the network, hence not hermetic)
    fix_if: a skip means the extension could not be fetched; rerun with network; never accept a skip as a pass
    hermetic: false
    graduation: waive
    graduation_waiver_reason: needs a network fetch of the ducklake extension, so it cannot join the hermetic fast tier; the hermetic halves of the same file graduate through VP 4
  - step: 6
    phase: pre-deploy
    action: The bound files hold exactly the approved words
    command: bin/venv-python -m scripts.roadmap.approved_text verify --slug sit-restore-spike --base origin/main
    expected: verify passes (head words equal base words with each block applied; only {{N}} and {{DATE}} filled)
    fix_if: restore the sidecar's words exactly; a wording change needs a new approval run
    hermetic: false
    graduation: waive
    graduation_waiver_reason: compares the head against a base ref that moves with every merge; validate_merge_step on the approval run is the standing check
  - step: 7
    phase: pre-deploy
    action: Fast tier
    command: bin/venv-python -m scripts.validate --pre
    expected: exit 0
    fix_if: fix the failing check
    hermetic: false
    graduation: waive
    graduation_waiver_reason: this is scripts.validate itself; graduating it would recurse
  - step: 8
    phase: post-deploy
    action: The governed deploys shipped PR 1 to every affected artifact (ducklake_maintenance, ducklake_catalog_dr, data-pipeline) and their smoke jobs passed
    command: "mcp__github__actions_list(owner=otl-labs, repo=ontheloop, method=list_workflow_runs, resource_id=deploy-ducklake-lambdas.yml, workflow_runs_filter={event: workflow_run, status: completed}) and the same for resource_id=deploy-prod-lambdas.yml; then method=list_workflow_jobs on each run whose head_sha is at or after PR 1's merge sha"
    expected: deploy-ducklake-lambdas jobs deploy-maintenance, maintenance-smoke, deploy-serving and smoke success; deploy-prod-lambdas jobs deploy and smoke success
    fix_if: follow deploy-paths.yaml deploy_code recovery
  - step: 9
    phase: post-deploy
    action: ADMIN sitting -- credential check
    command: bin/venv-python -m scripts.aws_identity caller-arn --profile agent_platform_admin 2>/dev/null | grep -q 'assumed-role/PlatformAdmin/' && echo ADMIN_CHAIN_OK || echo ADMIN_CHAIN_ABSENT
    expected: ADMIN_CHAIN_OK; ADMIN_CHAIN_ABSENT stops here and asks the coordinator for an ADMIN cloud session
    fix_if: wrong environment
  - step: 10
    phase: post-deploy
    action: ADMIN sitting -- the rehearsal, each admin-profile command on the operator's in-session approval line
    command: bin/venv-python -m scripts.ducklake_neon_smoke_test --restore-rehearsal --profile agent_platform_admin --dev-profile agent_platform --evidence-out "${TMPDIR:-/tmp}/restore-rehearsal.json"; echo "EXIT=$?"
    expected: EXIT=0 and every torn_down flag true; a failed criterion gives EXIT=1 naming it, with teardown complete
    fix_if: first run with --dry-run and get the operator's approve line naming its list; a torn_down false is cleaned by hand at once (the named resource) and rec-filed; a step error is mechanical (contract result_rule), fixed in a PR and the sitting re-run; a failed criterion in a completed run is the spike's result, recorded, not patched
  - step: 11
    phase: post-deploy
    action: Evidence meets every exit criterion
    command: bin/venv-python -m scripts.ducklake_smoke.restore_rehearsal verify-evidence "${TMPDIR:-/tmp}/restore-rehearsal.json"
    expected: RESTORE_REHEARSAL_OK
    fix_if: a failed criterion is the result; record it and route the fallback to rec-5024's owner through the coordinator
  - step: 12
    phase: post-deploy
    action: Versioning recovery as PlatformDev
    command: bin/venv-python -m scripts.ducklake_neon_smoke_test --restore-rehearsal-version-recovery --profile agent_platform --evidence-out "${TMPDIR:-/tmp}/version-recovery.json" && bin/venv-python -m scripts.ducklake_smoke.restore_rehearsal verify-evidence "${TMPDIR:-/tmp}/version-recovery.json"
    expected: VERSION_RECOVERY_OK
    fix_if: an AccessDenied names the missing grant; rec-file it; never widen IAM in this plan
  - step: 13
    phase: post-deploy
    action: PR 2 -- committed evidence passes rec-5023's acceptance
    command: bin/venv-python -m pytest tests/ducklake_neon_smoke_test/test_restore_rehearsal_evidence.py -q
    expected: all pass on the committed fixtures, on whichever branch the sitting produced
    fix_if: a fixture is never edited by hand; rerun the sitting instead
  - step: 14
    phase: post-deploy
    action: rec-5023 closed with its result
    command: bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids; rows,_=fetch_recs_by_ids(make_reader(profile='agent_platform'),['rec-5023']); print(rows[0]['status'], rows[0]['acceptance'])"
    expected: closed, acceptance naming tests/ducklake_neon_smoke_test/test_restore_rehearsal_evidence.py::test_rewritten_data_path_reads_every_table (pass branch) or ::test_restore_rehearsal_failed_criteria (failure branch)
    fix_if: update_rec the acceptance in PR 2, then the Resolves trailer closes it
test_obligations:
  - source: src/common/neon_api.py
    behavior: role and database creation after the branch's operations finish, bounded 423 retry; password never in logs or errors
    verification_step: 1
    test_selector: tests/test_neon_api.py
    red_green_expectation: red before (functions absent), green after
  - source: src/common/catalog_dr.py
    behavior: opt-in --no-acl and --schema; default argv unchanged
    verification_step: 2
    test_selector: tests/test_catalog_dr.py
    red_green_expectation: red before (no_acl keyword absent), green after
  - source: src/lambdas/ducklake_maintenance/restore_rehearsal_actions.py
    behavior: ephemeral-only refusal before any connection; READ_ONLY prod checksum; rewrite touches only data_path; allowed response fields; message-free errors
    verification_step: 3
    test_selector: tests/lambdas/ducklake_maintenance/test_restore_rehearsal_actions.py
    red_green_expectation: red before (module absent), green after
  - source: src/lambdas/ducklake_maintenance/handler.py
    behavior: restore_rehearsal registered; a refusal maps to 400 on the production function name; an ephemeral rehearsal function refuses every other action
    verification_step: 3
    test_selector: tests/lambdas/ducklake_maintenance/test_restore_rehearsal_actions.py
    red_green_expectation: red before (action unregistered), green after
  - source: scripts/ducklake_smoke/restore_rehearsal.py
    behavior: teardown first, dump before copy, scratch-only keys, DSN only in the function environment, redaction on failure, dry-run, per-step principal, counts-only evidence, verifier
    verification_step: 4
    test_selector: tests/ducklake_neon_smoke_test/test_restore_rehearsal.py
    red_green_expectation: red before (module absent), green after
  - source: scripts/ducklake_neon_smoke_test.py
    behavior: the two flags dispatch to the orchestrator
    verification_step: 4
    test_selector: tests/ducklake_neon_smoke_test/test_restore_rehearsal.py
    red_green_expectation: red before (flags absent), green after
constraints:
  - "Never write or delete under ducklake/, ducklake-telemetry/ or telemetry-blobs/; all scratch lives under ducklake-neon-smoke/restore-rehearsal/<run_id>/."
  - Never run a maintenance verb (merge, gc, expire, cleanup, catalog_reinit) on the restored catalog.
  - Each admin-profile command runs only on the operator's in-session approval line (protected-actions.yaml); calls that need no admin grant name agent_platform.
  - No Terraform, no IAM change, no standing resource, no /secret/ parameter.
  - "Public repository (Decision 101): evidence, fixtures and PR comments are counts-only."
  - Governing text lands exactly as the sidecar binds; nothing else in DECISIONS.md, restore-rehearsal.yaml or ducklake_maintenance.yaml changes.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout verdict (round 2): FLAGS_FOUND (Decisions triaged: 202 of 202; Roadmap items intersected: 7; CONFLICT: 0; RELATED: 7). Serves: NS.1 3/5. CITE: 81, 126, 204, 214, 143, 216, 100, 201, 247, 99, 79, 101. WARN 249 (fixed-key zip) resolved by the per-sha zip and CodeSha256 equality; WARN 239 (telemetry in the dump) resolved by an ops-only restore from a presigned URL, no dump in the smoke prefix, residual named; WARN 237 resolved by amending it (transient branch-scoped credential, PlatformAdmin-only readable); NOTE 81 cl.7 resolved by naming every read in cl.3 and the pointer; NOTE 126 deploy-paths row filed as rec-5045 (deploy-paths.yaml at cap); NOTE 143 resolved by the PlatformAdmin-only invoke fact; NOTE 214 resolved in context; SPIRIT 77 resolved by cl.4's wording. Reports: /mnt/project-files/restore-spike/decision-scout-report.md and decision-scout-report-r2.md."
