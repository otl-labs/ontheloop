  - file: scripts/ducklake_smoke/restore_rehearsal.py
    action: Create
    purpose: >-
      PR 1. Orchestrator implementing docs/contracts/restore-rehearsal.yaml sitting.order exactly (canary pattern, all
      calls over 443): sequencing, run_id (lowercase [a-z0-9_] only, a UTC timestamp plus 6 hex characters such as 20261109t193000_a1b2c3, so
      restore_rehearsal_<run_id> is a plain Postgres identifier), the one scratch key builder that
      refuses a path outside ducklake-neon-smoke/restore-rehearsal/<run_id>/, teardown in finally, the evidence write
