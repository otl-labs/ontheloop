constraints:
  - "Never write or delete under ducklake/, ducklake-telemetry/ or telemetry-blobs/; all scratch lives under ducklake-neon-smoke/restore-rehearsal/<run_id>/."
  - Never run a maintenance verb (merge, gc, expire, cleanup, catalog_reinit) on the restored catalog.
  - Each admin-profile command runs only on the operator's in-session approval line (protected-actions.yaml); calls that need no admin grant name agent_platform.
  - No Terraform, no IAM change, no standing resource, no /secret/ parameter.
  - "Public repository (Decision 101): evidence, fixtures and PR comments are counts-only."
  - Governing text lands exactly as the sidecar binds; nothing else in DECISIONS.md, restore-rehearsal.yaml or ducklake_maintenance.yaml changes.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout verdict: FLAGS_FOUND (Decisions triaged: 202 of 202; Roadmap items intersected: 4; CONFLICT: 0; RELATED: 4). Serves: NS.1 3/5. CITE: 214, 81, 99, 249, 247, 216, 213, 101, 79. NOTE 126 (no Decision names an ADMIN-agent sitting that mints a Neon role and copies production data) resolved by the new Decision's cl.1; NOTE 143 cl.1 resolved by contract boundary.binding (roles are the boundary, refusals defence in depth) and its residual; NOTE 100 resolved by Decision cl.4; NOTE 237 resolved by the DSN-in-function-environment transport and no /secret/ parameter; NOTE 201 resolved by Decision cl.5 (PR 2 evidence fixture) and rec-5036 for the deferred leg; SPIRIT 230 resolved by the contract's residual (smoke gc grace outlives a sitting). Report: /mnt/project-files/restore-spike/decision-scout-report.md."
  - "Network: no cloud container has TCP/5432 egress (deploy-paths.yaml scoped_login_provisioning), so all Neon SQL runs inside the ephemeral functions; S3 and Neon REST run over 443."
  - "The DR dump is weekly (ducklake_catalog_dr.tf cron Sunday 03:00 UTC), not daily as the handover says; the sitting takes one on-demand dump through the catalog-dr Function URL (lambda_maintenance_gates.py catalog_dr gate precedent)."
  - "Grants (read from terraform/bootstrap 2026-11-09): PlatformAdmin holds lambda Create/Delete/Invoke/InvokeFunctionUrl and DR-bucket List/Get (platform_admin_policies.tf, platform_admin_data_policies.tf); PlatformDev holds data-lake Get/Put/Delete, ListBucketVersions and GetObjectVersion on the smoke prefix. iam:PassRole on the two execution roles is assumed from the canary precedent: UNPROVEN until the sitting; an AccessDenied stops it and is rec-filed."
  - "Sizes (PlatformDev listing 2026-11-09): ducklake/ 4,900 objects 60 MB; ducklake-telemetry/ 8,341 objects 2.1 GB (not copied); telemetry-blobs/ 87 MB. Dump size and the fit in 10240 MB /tmp and 900 s: UNPROVEN until the sitting."
  - "Criterion 3: PyPI has 1.5.5, 1.5.6 and 2.0.0; a local probe (DuckDB-file catalog) shows 2.0.0 keeps ducklake_metadata.version 1.0 and 1.5.4 re-attaches, so no migration exists through 2.0.0. The sitting records the restored catalog's format; the candidate-engine leg is rec-5036 (planning-time split)."
  - "Restore target is a Neon child branch with a new role and new database (ADVICE Q2): compute isolated from PROD, teardown one branch delete; --no-acl plus foreign_owned 0 and foreign_acl 0 prove the restored catalog depends on no PROD role."
  - "Code home (ADVICE Q4 adapted): dormant verb in the maintenance package, run on ephemeral functions from the CI-published zip, because a function-less separate artifact has no build precedent and stub manifests are skipped by the build; the role is the boundary either way."
  - "Approvals at build start: the operator's in-session approve lines for each admin-profile command (protected-actions.yaml admin-credential and secret-read for /secret/neon-api-key); the admin-route choice is recorded in the handoff note."
  - "rec-5024's plan (Plan the SIT Decision thread) sets T2.57 c2 met_by this slug and re-anchors its Decision after this one; told 2026-11-09."
  - "Related, not bundled: rec-4300 (restore into a Postgres without pg_read_all_data), rec-4883 (canary teardown on CC-web; its lesson is the teardown-first rule), rec-4694 (telemetry redaction for SIT reads)."
  - "Evidence: /mnt/project-files/restore-spike/ (advisor-brief/BRIEF.md, ADVICE.md, decision-scout-report.md, PRESENTATION.md)."
