      this non-gating leg cannot turn a result run into a step error. This module holds the one checksum expression
      (checksum_sql), which restore_rehearsal_actions imports for verify and prod_checksum, avoiding an import cycle; likewise every init, copy or type error after its
      refusals is caught and returned as all-false matches within the contract's fields.
    new_imports: [src.lambdas.ducklake_maintenance._shared]
  - file: src/lambdas/ducklake_maintenance/handler.py
    action: Modify
    purpose: >-
      PR 1. One _ACTIONS entry, "restore_rehearsal": restore_rehearsal_actions.action_restore_rehearsal;
      RestoreRehearsalRefused mapped to a 400 response beside the existing typed errors, carrying a fixed reason only (no
