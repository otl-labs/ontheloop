  - "PR 1: create restore_rehearsal_actions.py, and restore_rehearsal_file_catalog.py, register the verb in handler.py and both modules in manifest.yaml's includes, with their tests (VP 3) and the PG16 test (VP 5). Post: every refusal holds."
  - "PR 1: apply the sidecar's blocks to DECISIONS.md, restore-rehearsal.yaml and ducklake_maintenance.yaml word for word (VP 6)."
  - "PR 1: create restore_rehearsal.py, restore_rehearsal_evidence.py and the CLI flags with their tests (VP 4-5); then VP 7 and the full tier (handoff_policy)."
  - "PR 1: open with a title starting feat(sit-restore-spike): (VP 8 finds its squash commit by it), drive CI green, merge under standing authorisation once validate_merge_step reads the operator's approval run. The ducklake channel deploys maintenance and catalog-dr on its own (catalog-dr only while deploy-ducklake's reconcile gate is green). The prod channel's gate skips data-pipeline (no_source_change: PROD_SOURCE_PATHSPECS watch no src/common path), so dispatch deploy-prod-lambdas.yml with force true (the governed channel, deploy-paths.yaml deploy_code); then VP 8."
  - "Sitting, in an ADMIN cloud session with the operator present: VP 9-11, then VP 12 as PlatformDev. Save both evidence files to /mnt/project-files/restore-spike/ and post counts-only results on PR 1."
  - "PR 2: commit both evidence files unedited and the evidence test, regenerating .secrets.baseline for their sha256 values (implement-scope-boundary.yaml secrets_baseline_regeneration); update_rec rec-5023's acceptance to test_restore_rehearsal_evidence.py::test_rewritten_data_path_reads_every_table (pass branch) or ::test_restore_rehearsal_failed_criteria (failure branch); Resolves: rec-5023 in the squash body; VP 13-14."
  - "Report the data-model result (pass, or the failed criterion and the fallback) and the measured timings to the coordinator for rec-5024."
  - "Execute Verification Plan -- run each step; loop until pass; on unrecoverable V3 failure stop and RCA (Decision 55)"
  - "Report: what was implemented, verification results"
rollback: >-
  PR 1: revert (the verb is dormant; the Decision and contract revert with it). Sitting: teardown runs in the
  orchestrator's finally block; anything left is named in torn_down and deleted by hand at once (ephemeral functions,
  the Neon branch, the scratch prefix). PR 2: revert (fixtures only).
