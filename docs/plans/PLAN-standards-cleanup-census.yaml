    Decision 278 cl.3).
    S6 | reversal conditions computed where measurable | rec-5264, Decision 194 | manual_conditions | conform |
    rec-5450 | validate_reversal_stanzas | triage by rule pre-filter, then classification with operator sample review;
    conversions in approved-text batches.
    S7 | contract byte limit | Decision 275 cl.1-2 | byte_seeded | exempt | Decision 275 cl.2 |
    validate_structural_size_limits | seeded shrink-only; a raise needs a Decision; none of the eight is this
