execution_steps:
  - "1. Create scripts/checks/decisions/standards_census.py per its scope row; keep each query a pure function of a root path so the tests run on tmp_path fixtures."
  - "2. Create tests/checks/decisions/test_standards_census.py per its scope row; run VP 1 red (absent) then green."
  - >-
    3. Create audits/standards-cleanup-census.yaml with top-level keys schema_version: 1, rec: rec-5367, module:
    scripts/checks/decisions/standards_census.py, rows and exceptions. Class rows, as id | standard | source | query |
    measure | disposition | owner | guarded_by | reason:
    S1 | per-entry cap measured without envelope, stanza and options | Decision 276 cl.4, cl.6 | measured_cap_over |
    query | exempt | Decision 276 cl.6 | validate_decisions_size | grandfathered; a body may not grow past the cap,
    dated annotations still may (Decision 151); entries inside the six chains are cleaned by the S5 exceptions.
    S2 | options-considered block | Decision 276 cl.5, cl.7 | options_missing | query | exempt | Decision 276 cl.7 |
    validate_decisions_size | forward-only; rejected options written after the fact would be invented history.
    S3 | metadata envelope | Decision 167 cl.1 | envelope_missing | query | exempt | Decision 167 cl.1 |
    validate_decision_entry_conformance | forward-only; the legacy grammar is the permanent fallback.
    S4 | mechanism specification delegated to a contract key | Decision 276 cl.1-3 | null | judgement | exempt |
    Decision 276 cl.7 | validate_delegated_key_changes | not mechanically measurable; the six S5 consolidations
    delegate their chains' values (Decision 278 cl.1); any other entry moves its values when next amended.
    S5 | consolidation candidates | Decision 278 cl.2 | consolidation_candidates | query | consolidate | Decision 278
    cl.2 | validate_supersession_annotations | operator named all six on 2026-11-20, one at a time; a new candidate is
    nominated by the fast-tier WARN and needs the operator's naming.
    S6 | reversal conditions computed where measurable | rec-5264 (scripts/preflight/decision_conditions.py, the audit
    SEQ-02 stanza monitor) | manual_conditions | query | conform | rec-5450 | validate_reversal_stanzas | triage by
    rule pre-filter, then classification with operator sample review; conversions in approved-text batches.
    S7 | contract byte limit | Decision 275 cl.1-2 | byte_seeded | query | exempt | Decision 275 cl.2 |
    validate_structural_size_limits | seeded shrink-only; a raise needs a Decision; none of the eight is this
    project's.
    S8 | amendment_log retention | Decision 275 cl.4 | amendment_rows_over_keep | query | exempt | Decision 275 cl.4 |
    validate_contract_drift | operator ruling 2026-11-20: no sweep; the retention ratchet holds each file at
    max(keep_full, its base count) of full rows (Decision 275 cl.4), so none grows and compacting below that is an
