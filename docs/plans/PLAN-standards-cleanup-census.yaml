  - "2. Create tests/checks/decisions/test_standards_census.py per its scope row; run VP 1 red (absent) then green."
  - >-
    3. Create audits/standards-cleanup-census.yaml with top-level keys schema_version: 1, rec: rec-5367, module:
    scripts/checks/decisions/standards_census.py, and rows (id | standard | source | query | disposition | owner |
    guarded_by | reason): S1 | per-entry cap measured without envelope, stanza and options | Decision 276 cl.4, cl.6 |
    measured_cap_over | exempt | Decision 276 cl.6 | validate_decisions_size | grandfathered; a body may not grow past
    the cap, dated annotations still may (Decision 151); entries inside the six chains are cleaned by S5's owners.
    S2 | options-considered block | Decision 276 cl.5, cl.7 | options_missing | exempt | Decision 276 cl.7 |
    validate_decisions_size | forward-only; rejected options written after the fact would be invented history.
    S3 | metadata envelope | Decision 167 cl.1 | envelope_missing | exempt | Decision 167 cl.1 |
    validate_decision_entry_conformance | forward-only; the legacy grammar is the permanent fallback.
    S4 | mechanism specification delegated to a contract key | Decision 276 cl.1-3 | null (measure: judgement) |
    consolidate | Decision 276 cl.2 | validate_delegated_key_changes | not mechanically measurable; the six
