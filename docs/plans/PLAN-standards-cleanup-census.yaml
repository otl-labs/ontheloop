    S9 | contract line budget | Decision 166, Decision 275 cl.1 | null | gate | clean | Decision 275 cl.1 |
    validate_structural_size_limits | no contract over its budget; raises carry markers.
    S10 | evaluator coverage | rec-5263, Decision 168 | evaluator_zero_coverage | query | handed_off | T2.54 |
    validate_contract_drift | coverage debt is T2.54 c1's index; this query is its ranked input.
    S11 | append-only ratified text | Decision 177 | null | census_workflow | clean | Decision 177 |
