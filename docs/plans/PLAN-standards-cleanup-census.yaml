schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: standards-cleanup-census
intent: >-
  Give every live Decision and contract a recorded disposition against the standards the contract-first retrospective
  shipped (Decisions 275, 276 and 278, rec-5263, rec-5264), as a class-grain census whose members are computed by
  named queries, so the legacy stock is either owned by a rec that cleans it or exempt with a reason and a named
  guard, and agents stop paying for an unowned backlog.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-standards-cleanup-census.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped):
  rec-5367 (Medium, L), the final unit of the contract-first retrospective work order. Closes no roadmap criterion.
cites: [dec:167, dec:177, dec:247, dec:275, dec:276, dec:278]
scope:
  - file: scripts/checks/decisions/standards_census.py
    action: Create
    new_imports:
      - scripts.checks._common
      - scripts.checks.registry
      - scripts.checks.decisions.entry_measure
      - scripts.checks.decisions.consolidation
      - scripts.checks.contracts._amendment_retention
      - scripts.checks.contracts._evaluator_coverage
      - scripts.decisions_md
    purpose: >-
      Not a registered check (no manifest Entry, no fast-tier cost). (1) QUERIES: a QUERIES dict of named pure
      functions over a repository root, each returning a sorted list of member strings, reusing the shipped measures
      and never re-deriving a threshold: measured_cap_over (live, non-stub entries of docs/DECISIONS.md whose body
      measured without envelope, reversal stanza, options block and dated annotations, entry_measure.measured_bytes,
      exceeds decision-entry.yaml size_governance.measured_size_norm.cap_bytes); options_missing (live non-stub
      entries with no options block, excluding titles in config/decision_options_exemptions.yaml); envelope_missing
      (live non-stub entries with no metadata envelope, decisions_md.extract_entry_envelope); consolidation_candidates
      (consolidation.candidates at decision-compaction.yaml consolidation.threshold, rows from
      docs/decisions-index.json); manual_conditions ("<decision>:<condition id>" for each kind manual condition in a
      reversal-conditions stanza); byte_seeded (config/structural_size_budgets.yaml byte_budgets keys);
      amendment_rows_over_keep (docs/contracts files whose top-level amendment_log holds more full rows than
      contract-population.yaml amendment_log_retention.keep_full, _amendment_retention.full_rows);
      evaluator_zero_coverage (Class D contracts, contract.class D, with no body key asserted or instructed per
      contract-population.yaml evaluator_coverage, _evaluator_coverage.body_keys and instructed_keys). "Live" and
      "stub" read the decisions index row (live true, currency not superseded_compacted) and
      decisions_md.is_compacted_stub. (2) CENSUS READER: load(path) parses audits/standards-cleanup-census.yaml; verify(
      census, root) returns defects: a row missing any of id, standard, source, disposition, owner, reason,
      guarded_by; a disposition outside {exempt, consolidate, conform, handed_off, clean} (so "pending" is a defect);
      a query not in QUERIES (null allowed only with measure judgement); an owner that is not rec-NNNN, Decision N
      (cl.M), or a roadmap id T<n>.<n>; a guarded_by that is neither a name in registry.all_checks() nor an owner rec;
      a consolidation exception row whose root is not an int; a duplicate id. It returns notes (never defects) for a
      candidate root with no exception row and an exception root no longer a candidate. (3) CLI: --list <query>
      prints members one per line; --summary prints "<id> <query> <count>" per row; --verify <path> prints defects
      and notes and exits 1 on any defect, else 0; --read-owners (with --verify) reads every rec owner through
      fetch_recs_by_ids and adds a defect for a missing rec and a note for a closed owner rec whose row's query still
      has members (the row needs a new disposition). Nothing raises at import (AGENTS.md Safety).
  - file: tests/checks/decisions/test_standards_census.py
    action: Create
    new_imports:
      - scripts.checks.decisions.standards_census
    purpose: >-
      Mirror tests. Each query on a fixture root (tmp_path holding a two-to-four-entry DECISIONS.md, an index, the
      contract snippets it reads) returns exactly the violating members and not the conforming ones, including:
      a dated annotation does not push measured_cap_over; an exempt title drops out of options_missing; a compacted
      stub is skipped; a semantic_break row is not a full row. verify: a fixture row with disposition pending, an
      unknown query, an unregistered guarded_by and a malformed owner each yield one defect; a candidate root with no
      exception row yields a note, not a defect. TestCommittedCensus: verify(load(audits/standards-cleanup-census.yaml),
      repo root) returns no defects, and every query the committed census names runs on the real tree without
      raising.
  - file: audits/standards-cleanup-census.yaml
    action: Create
    purpose: >-
      The census (rec-5367 acceptance), with exactly the rows in execution step 3: one row per standard class S1-S12
      and six S5 exception rows. Holds dispositions, owners, reasons, guards and query names; never counts or member
      lists (Decision 86; the advisor's stale-row risk). A header comment names the module that computes membership.
bundled_recommendations: [rec-5367]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - audits/standards-cleanup-census.yaml exists and contains no "disposition:" pending row (rec-5367's acceptance).
  - standards_census --verify exits 0 on the committed census on the built tree and exits 1 on a fixture holding a pending row.
  - Each named query reproduces the shipped measure on fixtures, and on the built tree the --summary counts match the census measured in context (within the change since main moved).
  - Every rec that owns a row whose disposition is not clean reads back open through fetch_recs_by_ids (--verify --read-owners exits 0 with no missing rec).
  - No file under docs/contracts/, docs/DECISIONS.md or config/ is changed, and no check is registered.
  - rec-5367 is closed by the merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Queries on fixtures, verify on fixtures and on the committed census.
    command: bin/venv-python -m pytest tests/checks/decisions/test_standards_census.py -q
    expected: Exit 0, every node passes. Red before (the test file and module are absent on the plan-only tree).
    expected_literals:
      - ' passed'
    fix_if: Fix the module or the census rows; never loosen a fixture assertion.
    hermetic: true
    graduation: graduate
    graduation_check_id: standards-cleanup-census
  - step: 2
    phase: pre-deploy
    action: The census verifies, and rec-5367's own acceptance holds.
    command: >-
      bin/venv-python -m scripts.checks.decisions.standards_census --verify audits/standards-cleanup-census.yaml &&
      test -f audits/standards-cleanup-census.yaml && ! grep -q "disposition: pending" audits/standards-cleanup-census.yaml
    expected: Exit 0; the verify output names no defect.
    fix_if: A defect line names the row and field; fix the row.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Step 1's TestCommittedCensus graduates the same verify on the committed file; this is rec-5367's acceptance probe.
  - step: 3
    phase: pre-deploy
    action: Counts per class on the built tree, against the planning-time measure.
    command: bin/venv-python -m scripts.checks.decisions.standards_census --summary audits/standards-cleanup-census.yaml
    expected: >-
      One line per row with a query. On main at 66b8f945 the counts were measured_cap_over 51, options_missing 198
      or 199 (the exemption list holds one title), envelope_missing 111, consolidation_candidates 6,
      manual_conditions 241, byte_seeded 8, amendment_rows_over_keep 27, evaluator_zero_coverage 43. A count that
      differs is explained by a commit on main since (git log), never by changing a query to match.
    fix_if: An unexplained difference means the query diverges from the shipped measure; fix the query.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Moment claim (exact counts on one tree), which graduation_disposition_authoring names waive.
  - step: 4
    phase: pre-deploy
    action: Owner recs read back open.
    command: bin/venv-python -m scripts.checks.decisions.standards_census --verify audits/standards-cleanup-census.yaml --read-owners
    expected: Exit 0 with no missing-rec defect; a closed-owner note, if any, is reported in the PR body.
    fix_if: A missing rec means a typo in the census owner; a reader refused by the proxy stops the build and is reported.
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: Nothing outside scope changed and no check was registered.
    command: >-
      test -z "$(git diff --name-only origin/main...HEAD -- docs/contracts docs/DECISIONS.md config scripts/checks/decisions/_manifest.py)"
      && ! grep -q standards_census scripts/checks/decisions/_manifest.py
    expected: Exit 0.
    fix_if: Revert the out-of-scope edit; a regenerated graduated-record shard is the only generator-touched file (sanction_rows).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: Fast tier, then the full tier on the committed, rebased tree, backgrounded with a 2 h limit.
    command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Exit 0 on a completed full run with the head verified; a timeout is not a pass.
    fix_if: Fix the named check at root cause; never raise a budget or skip a check.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
  - step: 7
    phase: post-deploy
    action: 'After the squash merge carries "Resolves: rec-5367", the closure job closed it.'
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import make_reader, fetch_recs_by_ids;rows,missing=fetch_recs_by_ids(make_reader(),['rec-5367']);assert
      not missing and rows[0]['status']=='closed';print('REC_CLOSED')"
    expected: REC_CLOSED
    fix_if: Open after the closure job, so check the ci.yml closure job on the squash commit.
    hermetic: false
test_obligations:
  - source: scripts/checks/decisions/standards_census.py
    behavior: Each named query reproduces its shipped measure; verify rejects a pending, unknown-query, unguarded or malformed-owner row and passes the committed census.
    verification_step: 1
    test_selector: tests/checks/decisions/test_standards_census.py
    red_green_expectation: red before (absent), green after
constraints:
  - No Decision text, contract or config file is edited; no numbered Decision is drafted, so no approval run (the standards are forward-only by design, Decision 276 cl.7, Decision 167).
  - No new registered check and no workflow change (270 s fast-tier non-test budget; advisor point 8).
  - The census stores no counts or member lists beyond the six S5 exception roots; membership is a query result (AGENTS.md agent-first rules, Decision 86).
  - Queries reuse the shipped measures and read thresholds from their contract keys; none hard-codes a cap, threshold or keep_full value.
  - New module under 500 SLOC (Decision 128); its mirror test at the mirror path (Decision 131).
  - No rescue agents or workaround loops (Decision 55).
