schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "supersede-decision-133"
intent: >-
  Re-decide Decision 133's allocation of the operator's build capacity, overdue for review since 2026-09-30, by one
  short new Decision that supersedes it and sets no successor rule: this repository holds only On The Loop's source
  (Decision 178) and each adopter product orders its own work in the monorepo that holds it (Decisions 209 and 220). Decision
  133 compacts to a stub, so the condition monitor stops showing a review with no subject left.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-supersede-decision-133.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5273
  (High). Outside the contract-first retrospective remit; the operator approved planning it in the Decision Growth
  project (2026-11-17). Closes no roadmap criterion.
cites: [dec:93, dec:133, dec:146, dec:149, dec:177, dec:178, dec:209, dec:220, dec:235, dec:240, dec:246]
scope:
  - file: docs/DECISIONS.md
    action: Modify
    purpose: >-
      Exactly the three DECISIONS.md blocks of docs/plans/approved/supersede-decision-133.yaml: the new Decision
      (heading number {{N}}, filled at build per decision-entry.yaml metadata_envelope.number_assignment and renumbered
      at rebase if taken; envelope supersedes [133]; no reversal stanza) inserted after the corpus preamble sentence, so above the newest entry whatever lands first; Decision 133's
      whole body replaced by the Decision 149 compaction stub (header line unchanged; Superseded by: Decision {{N}}; its
      reversal stanza goes with the body under Decision 177 clause 2's stub bound, since clause 4's locked stanza existence binds only bodies not newly Superseded); one dated Update note appended after Decision 93's
      last line. {{DATE}} is the build date (UTC). Nothing else. docs/decisions-index.json is regenerated by
      `bin/venv-python -m scripts.decisions_index --write` (generator-touched, no row).
  - file: docs/contracts/glossary.yaml
    action: Modify
    purpose: >-
      Exactly the two glossary blocks of the sidecar: 133 leaves read_as.noted_decisions (validate_glossary's note leg
      fails a roster Decision without the reads-through note, and the stub carries none) and one amendment_log row
      records why.
  - file: tests/test_decision_conditions.py
    action: Modify
    purpose: >-
      TestPreflightBucket.test_bucket_shape_on_real_decisions_md asserts 133 is monitored on the real corpus, a fact the
      supersession ends. It now asserts the monitored list is non-empty and that 133 is neither monitored nor surfaced.
bundled_recommendations: [rec-5273]
followon_recs: [rec-5279]
infrastructure_dependencies: []
acceptance_criteria:
  - docs/DECISIONS.md and docs/contracts/glossary.yaml equal main's text with the sidecar's five blocks applied and the placeholders filled (scripts.roadmap.approved_text verify exits 0 with the recorded digest).
  - Decision 133's block is a compacted stub whose Superseded by pointer names the new Decision, the new Decision's envelope declares supersedes [133], and docs/decisions-index.json gives 133 currency superseded_compacted.
  - The condition monitor neither monitors nor surfaces Decision 133, and malformed stays empty.
  - rec-5273's acceptance command exits 0; after merge rec-5273 is closed with a resolution naming this plan, and ops_decisions dec-133 reads Superseded.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Prove the committed Decision and glossary text is exactly the approved text.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug supersede-decision-133 --expect
      cfb545b1eed33d18de57bc60a19f77aab2ead82fc2df0981990d862209d385fe  # pragma: allowlist secret
    expected: Exit 0.
    fix_if: A difference is reported -- restore the approved words; any other change is an approved_text plan defect.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Duplicates validate_merge_step's approved-text binding, which runs in the PR fast tier (git-ops.yaml
      merge_step_coverage).
  - step: 2
    phase: pre-deploy
    action: Prove 133 is a compacted stub pointing at the new Decision, which declares the edge, and the index agrees.
    command: >-
      bin/venv-python -c "import json; from scripts.decisions_md import parse_decisions_md, is_compacted_stub;
      rows={r['decision_id']: r for r in parse_decisions_md()}; s=rows[133]; n=int(str(s['superseded_by']).split('-')[-1]);
      assert is_compacted_stub(s['raw_block']), 'not a stub'; assert n == max(rows), (n, max(rows));
      assert 133 in (rows[n].get('title_supersedes') or []), rows[n].get('title_supersedes');
      assert 'reversal-conditions' not in s['raw_block'] and 'reversal-conditions' not in rows[n]['raw_block'];
      idx={int(r['number']): r for r in json.load(open('docs/decisions-index.json'))['decisions']};
      assert idx[133].get('currency') == 'superseded_compacted', idx[133].get('currency'); print('D133_STUB_OK')"
    expected: Prints the marker and exits 0.
    expected_literals: [D133_STUB_OK]
    fix_if: >-
      A failed assertion -- the stub or the new entry was applied wrongly or the index is stale; re-apply the sidecar
      and regenerate the index. If the index shape differs from this one-liner's reading, fix the one-liner's key access
      only, never its assertions.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Moment claim about one entry; validate_decision_entry_conformance (stub bound, envelope) and
      validate_supersession_annotations (forward pointer) guard the general rules in both tiers.
  - step: 3
    phase: pre-deploy
    action: Prove the monitor no longer reads 133 and the real-tree test guards it.
    command: >-
      bin/venv-python -m pytest -q
      tests/test_decision_conditions.py::TestPreflightBucket::test_bucket_shape_on_real_decisions_md
      tests/checks/ops_governance/test_validate_reversal_stanzas.py::TestValidateReversalStanzasRealTree
    expected: Both selected tests pass; before the DECISIONS.md change the edited test fails on the 133 assertion.
    fix_if: The edited test fails -- 133 still carries a stanza (stub not applied) or the test edit is wrong.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Both selected tests already run in the standing pytest suite in both tiers; graduating the step would duplicate
      them.
  - step: 4
    phase: pre-deploy
    action: Run rec-5273's own acceptance command.
    command: >-
      awk '/^## Decision 133:/{f=1;print;next} /^## Decision /{f=0} f' docs/DECISIONS.md | grep -q 'Superseded by: Decision'
      && ! awk '/^## Decision 133:/{f=1;print;next} /^## Decision /{f=0} f' docs/DECISIONS.md | grep -q 'review_by: 2026-09-30'
      && echo REC_5273_ACCEPT_OK
    expected: Prints the marker and exits 0.
    expected_literals: [REC_5273_ACCEPT_OK]
    fix_if: The stub was not applied or the stanza survived.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Moment claim tied to this one entry; the merge step runs the rec's own acceptance.
  - step: 5
    phase: pre-deploy
    action: Prove the generated index matches the edited corpus and the glossary roster passes.
    command: >-
      bin/venv-python -m scripts.decisions_index --check && bin/venv-python -c "from scripts.checks.contracts.validate_glossary
      import validate_glossary; f=[]; validate_glossary(f); assert not f, f; print('GLOSSARY_OK')"
    expected: Index fresh, then the marker.
    expected_literals: [GLOSSARY_OK]
    fix_if: Stale index -- run `bin/venv-python -m scripts.decisions_index --write`; a glossary finding -- the roster or amendment_log block was not applied.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: Duplicates validate_decisions_index_freshness and validate_glossary, which run in both tiers.
  - step: 6
    phase: pre-deploy
    action: Fast and full tiers before handoff.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: >-
      Both tiers pass and validation_result verifies the head sha. The full tier is started in the background with a
      2 h limit from the top-level session; its verdict is --verify-head's, never a pipe's exit status.
    fix_if: >-
      A failure caused by this diff is fixed on the branch; a failure that reproduces on origin/main is cited by its
      existing rec in the PR body, never fixed inline.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: post-deploy
    action: Prove rec-5273 closed and the warehouse reads 133 as superseded after the merge.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader; r=make_reader();
      rows, _ = fetch_recs_by_ids(r, ['rec-5273']); print(rows[0]['status'], rows[0]['resolution']);
      print(r.named('decision_by_id', id='dec-133'))"
    expected: >-
      Prints closed with a resolution naming PLAN-supersede-decision-133 and the merge SHA, then a dec-133 row whose
      status is Superseded (written by rec-autoclose.yml's post-merge backfill).
    fix_if: >-
      rec still open -- run the merge_step recover route in git-ops.yaml merge_step_coverage; dec-133 not Superseded --
      check the rec-autoclose run's backfill step; never close or write by hand without the merge SHA.
    hermetic: false
test_obligations:
  - source: docs/DECISIONS.md
    behavior: Decision 133 is no longer monitored or surfaced by the condition monitor once it is a stub.
    verification_step: 3
    test_selector: tests/test_decision_conditions.py::TestPreflightBucket::test_bucket_shape_on_real_decisions_md
    red_green_expectation: red before (133 still monitored on main), green after the stub lands.
  - source: docs/contracts/glossary.yaml
    behavior: validate_glossary's note leg passes once Decision 133 is a stub without the reads-through note, because 133 has left read_as.noted_decisions.
    verification_step: 5
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_glossary import validate_glossary; f=[]; validate_glossary(f); assert not f, f; print('GLOSSARY_OK')"
    red_green_expectation: >-
      Red with the DECISIONS.md stub applied and 133 still on the roster (the note leg reports Decision 133 lacks the
      reads-through note), green after the roster block lands.
weakening_dispositions:
  - candidate: "[assertion-changed] tests/test_decision_conditions.py::TestPreflightBucket::test_bucket_shape_on_real_decisions_md"
    disposition: planned-change
    cite: "acceptance_criteria[2]"
constraints:
  - "No rescue agents or workaround loops (Decision 55)."
  - "Only the five approved blocks change docs/DECISIONS.md and docs/contracts/glossary.yaml (Decision 177 append-only policy and its clause 2 stub bound; Decision 246 binding). A wording change needs a new approval run through the plan owner, never an in-build edit."
  - "The test edit replaces an assertion the supersession makes false (Decision 235 changed assertion, approved with this plan): it keeps a non-empty monitored floor and adds that 133 is neither monitored nor surfaced. No other assertion is loosened."
