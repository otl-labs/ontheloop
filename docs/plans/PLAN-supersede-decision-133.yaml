pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - Only the plan-cited decision sections (93, 133, 146, 149, 177, 178, 209, 220, 235, 240, 246)
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
  - "Start condition: this plan and its sidecar merged with the approved-text run approved."
execution_steps:
  - "Rebase onto origin/main; set {{N}} to max decision number + 1; apply the sidecar's five blocks verbatim with {{N}} and {{DATE}} (build date, UTC) filled. Post: VP 1, 2 and 4 pass."
  - "Edit tests/test_decision_conditions.py::TestPreflightBucket.test_bucket_shape_on_real_decisions_md as scoped (its weakening disposition is recorded below as planned-change, citing acceptance_criteria[2]), adding at most one SLOC net (relief: measure the file against main at build with `bin/venv-python -m scripts.roadmap.plan_obligations --plan docs/plans/PLAN-supersede-decision-133.yaml`; if the edit would cross 500, fold the new assertions into the replaced line; never raise the budget). Post: VP 3 passes (and fails with the DECISIONS.md change stashed)."
  - "Regenerate docs/decisions-index.json (`bin/venv-python -m scripts.decisions_index --write`). Post: VP 5 passes."
  - "Run the full tier per git-ops.yaml handoff_sequence; commit with `Resolves: rec-5273`; push; PR; CI green; merge (squash) under standing_authorisation."
  - "Execute Verification Plan: run each step; loop until pass; on an unrecoverable failure stop and RCA (Decision 55)."
  - "Report: what changed, the validation_result --verify-head verdict, VP 7's lines and the merge SHA."
rollback: >-
  A revert PR restores Decision 133's body and stanza, drops the new Decision and the Decision 93 note, and puts 133 back
  on the glossary roster; the monitor then shows 133's review as due again.
