  - "Decision-scout r4 NO_FLAGS after rebase onto c37b228a (Decision 269 on main, no conflict). Decisions triaged: 218 of 218. Roadmap items intersected: 5; CONFLICT: 0; RELATED: 5. Serves: NS.4 3/5. CITE: 93, 133, 146, 149, 177, 178, 209, 220, 235, 240, 246. Earlier, r3 FLAGS_FOUND (NOTE only): CONTRADICT none; SPIRIT NOTE Decision 178, two fixture files under tests/fixtures/decision_conditions/ still describe 133's stanza, disposed by widening rec-5279 (update_rec, read back by the scout); no plan or wording change. Decisions triaged: 217 of 217. Roadmap items intersected: 5; CONFLICT: 0; RELATED: 5 (T1.5, T1.17, T2.54, T2.48, T4.23). Serves: NS.4 3/5. CITE: 93, 133, 146, 149, 177, 178, 209, 220, 235, 240, 246."
  - "Number: {{N}} = max across docs/DECISIONS.md and DECISIONS_ARCHIVE.md + 1 at build (270 or higher; 269 landed on main 2026-11-17). Kind direction, significance numbered_decision; size 3.4 KB, under the 6 KB per-entry cap."
  - "Stale comments (scout SPIRIT note): scripts/preflight/decision_conditions.py, scripts/decisions_md.py, scripts/session/preflight.py, scripts/checks/ops_governance/validate_reversal_stanzas.py, tests/checks/ops_governance/test_validate_reversal_stanzas.py, tests/decisions_md/test_envelope.py, the tests/test_decision_conditions.py fixture docstring, docs/contracts/decision-entry.yaml metadata_envelope.fence_note and .claude/skills/orient/SKILL.md cite 133's stanza as provenance; repointing them is follow-on rec-5279 (filed 2026-11-17), out of this plan's scope."
  - "Collision: PR #2116 (condition reviews, Decisions 167/177/179) also edits docs/DECISIONS.md and the generated index; blocks are disjoint, so whichever merges second rebases, re-anchors and regenerates the index (Decision 245 merge overlap). The new Decision anchors on the corpus preamble sentence, which never moves, so other Decisions landing first need no re-anchor (critique r2)."
  - "Red-overlap 2026-11-17 16:50Z (after rebase onto c37b228a): verdict blocked by rec-5247 only (telemetry-reader smoke 504; slo_breached, shared none). Feedback Loop owns its repair; operator ruling 2026-11-17: defer and proceed for plan merges. Deferral rationale: this plan neither repairs nor touches the telemetry reader, so rec-5247 is deferred to its owner, not bundled."
  - "plan_obligations 2026-11-17 (re-run after rebase onto c37b228a): tests/test_decision_conditions.py is NEAR_CAP (488 of 500 SLOC, headroom 12); the test edit adds at most one SLOC net (relief step in execution_steps). 14 unbuilt plans also scope docs/DECISIONS.md; none binds Decisions 93 or 133, so whichever builds second rebases and re-anchors only."
  - "Critique r1 dispositions: VP 3 graduation -> waive (fixed); weakening disposition declared (fixed); dec:247 not added to cites, because cites holds the operator's ids plus the scout's CITE list and the scout rated 247 RELATED (disputed); glossary row accepted_values_narrow with semantic_break false kept, precedent docs/contracts/contract-population.yaml accepted_values_extend with false, and category 6 binds description/semantics diffs only (disputed); VP 4 multi-word grep warning is a false positive. Critique r2: B1 new-Decision anchor re-pointed at the corpus preamble after rebasing onto c37b228a (anchor-only; approved-words digest unchanged, ce17ef3e), VP 1 digest and the number, red-overlap and plan_obligations lines refreshed, the Decision 177 clause 2/4 reading stated in scope (fixed); N3 Decision 220 clause 1 cite kept, placement implies where ordering happens (accepted as is). Critique r3 PROCEED with nits: rec-5279's context now names the kept provenance mentions (fixed); the stub's still-cited-live list is incomplete but true and approved (no change); VP 4 grep warning a false positive (no change)."
  - "Approvals at build start: the Decision and glossary wording only, bound by the sidecar and its approved-text approval run (Decision 246); the build merges under standing_authorisation once validate_merge_step is green."
