    declaration and the contract edit without the swap is the split fallback, which only the operator chooses.
  - >-
    alternative_annotation_shape (if the operator declines the Decision 52 waivers): a dated trailer on Decision 37's
    compacted stub (operator-only: live file, fixed stub grammar), trailing_bracket amendments on archived Decisions 40
    and 49 (decision-entry.yaml amendment_forms; archive reach is R3's parked fork 5), a scope amendment adding both
    corpus files, closes_criteria [T1.17:c4] once T1.17 is in_progress, and a post-merge --backfill-decisions-md run
