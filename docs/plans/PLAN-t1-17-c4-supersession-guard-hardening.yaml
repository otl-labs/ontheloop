    edge at implement time is a stop-and-report.
  - >-
    No participle or gerund extraction and no hand-rolled widened regex: the edge grammar is scripts.decisions_md's
    shared helper (Decision 134 clause 3; CFG-06).
  - >-
    Preserve the R1 VP replay surface: extract_supersession_edges(root), _combined_number_to_block(root),
    _is_annotated(superseder, victim_block) -> bool and _load_waivers(root, failed) returning the waived-pair set
