schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: t1-17-c4-supersession-guard-hardening
intent: >-
  Discharge T1.17 c4 (Wave-3 hardening of the supersession-annotation guard) so the decision log's forward-pointer
  invariant holds on whole decision numbers and on every plural list the shared title grammar admits: _is_annotated
  stops accepting a numeric prefix, edge extraction reuses the shared title_relation_continuation grammar instead of a third
  hand-rolled regex (Decision 134 clause 3's last divergent consumer), and three re-derived Low findings are fixed.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-t1-17-c4-supersession-guard-hardening.yaml
phase: >-
  T1.17 (Decision-log premise-integrity audit follow-ups), criterion c4 only. No closes_criteria: T1.17 is not_started
  and the c4 closeout is staged in context (exit-criteria-ledger.yaml#plan_closes_criteria). c1-c3 are disjoint
  sibling plans (#1339, #1341, the c3 slice).
scope:
  - file: scripts/checks/decisions/validate_supersession_annotations.py
    action: Modify
    purpose: >-
      M1 whole-number annotation match; M2 edges from scripts.decisions_md._extract_title_relation_targets over each
      whole block for amends and supersedes, Decision 167 envelope union kept; L1 delete the unreachable header branch
      and _HEADER_SUPERSEDED_RE; L2 FAIL on an orphan waiver (stale stays WARN); L3 clean FAIL on a malformed waiver
      entry; keep main's registry.examined(_heading_count(root), unit="decisions") declaration (Decision 170
      touch-it-fix-it, landed by #1780); correct the stale docstring (FULL-only claim, singular-only limit).
  - file: tests/checks/decisions/test_validate_supersession_annotations.py
    action: Modify
    purpose: >-
      Mirror test (Decision 131): red-before cases for M1, M2, L2 and L3, plus participle-rejection regression cases.
      Existing cases stay unchanged; main's test_run_declares_the_heading_count (#1780) owns the declaration.
  - file: config/decision_supersession_waivers.yaml
    action: Modify
    purpose: >-
      Add the four waivers the widened extractor makes red (execution_steps[2]): 130->128, and 52->37, 52->40, 52->49
      under an OPERATOR-CONFIRM-PENDING ruling, with the header's admitted-category list amended in the same commit.
  - file: config/check_accounting_baseline.yaml
    action: Modify
    purpose: >-
      Already landed on main by #1780 (the roster no longer lists validate_supersession_annotations); no diff here.
      VP 3 still asserts absence.
  - file: docs/contracts/decision-entry.yaml
    action: Modify
    purpose: >-
      Retire the field_grammar.known_divergent_grammars _EDGE_RE row (leave the key as an empty list), repoint
      currency.consumer_contract's _EDGE_RE parenthetical to the shared helper, and add one amendment_log entry
      (prose_improvement, semantic_break false). Class D amendment-log rule (Decision 168, validate_contract_drift).
  - file: scripts/checks/decisions/_manifest.py
    action: Modify
    purpose: >-
      Already landed on main by #1780 (the stale Entry comment is gone); no diff here. No Entry field changes.
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    M1: a victim block that mentions only a longer number sharing the superseder's digits (Decision 52 for superseder
    5) does not count as annotated; "Decision 5" followed by a non-digit still does.
  - >-
    M2: plural lists the shared title grammar admits are enumerated (closed by ")" or ";", slash lists, or repeated
    "Decision" tokens: "(Supersedes Decisions 37, 40, 49)", "amends Decisions 102/128", "amends Decision 1 and
    Decision 2."), and every edge the pre-change regex finds is still found (0 dropped). The grammar's documented
    limit is pinned: a sentence-final bare-number continuation ("Supersedes Decisions 1, 2.") yields only the first
    victim.
  - >-
    Participle and gerund forms ("superseding Decision N", "amending Decision N", "does not amend Decision N",
    "superseded by Decision N") yield no edge: the shared helper anchors on the whole words "amends" and
    "supersedes" (decisions_md.py:363), and decision-entry.yaml's rejected_forms already rejects the inverse
    "amended by" case.
  - >-
    L1: the header-annotation branch and _HEADER_SUPERSEDED_RE are gone and the existing header test still passes.
    L2: a waiver naming no extracted edge appends a FAIL naming it; a stale waiver still only WARNs. L3: a waiver
    entry with a missing or non-integer superseder or victim appends a clean FAIL and raises nothing.
  - >-
    The guard declares examined() with the decision heading count (unit decisions, main's #1780 declaration), is
    absent from config/check_accounting_baseline.yaml, and validate_check_accounting passes.
  - >-
    decision-entry.yaml no longer names _EDGE_RE, carries the new amendment_log entry, and validate_contract_drift
    passes.
  - >-
    The real-repo guard is green with exactly four new waivers, and the full tier passes.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: Run the guard's mirror test file and the decisions manifest test.
    command: >-
      bin/venv-python -m pytest tests/checks/decisions/test_validate_supersession_annotations.py
      tests/checks/decisions/test__manifest.py -q
    expected: Exit 0, every test passes.
    fix_if: >-
      A failing M1/M2/L2/L3 case means that fix is missing or wrong; fix the module, never the assertion. A failing
      participle case means the grammar was widened past the contract's rejected_forms; narrow it back.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file pytest re-run of the guard's mirror test; pytest already runs it standing in both tiers, so a registry
      row adds no independence.
  - step: 2
    phase: pre-deploy
    action: >-
      Run the guard on the real corpus; assert 0 edges dropped against the pre-change regex, the four new edges are
      enumerated and waived, and the declaration counts every decision heading.
    command: >-
      bin/venv-python -c "import re,yaml;from pathlib import Path;from scripts.checks import registry;from
      scripts.decisions_md import _iter_decision_sections as it;from scripts.checks.decisions.validate_supersession_annotations
      import validate_supersession_annotations as v,extract_supersession_edges as x,_heading_count as hc;f=[];v(f);d=registry.pop_declaration();assert
      not f,f;e={(s,t) for s,t,_ in x(Path('.'))};o=re.compile(r'(?:Supersedes|supersedes|amends|Amends|partially
      supersedes)\s+Decision\s+(\d+)');old={(int(h.group(1)),int(m.group(1))) for p in ('docs/DECISIONS.md','docs/DECISIONS_ARCHIVE.md')
      for h,b in it(open(p).read()) for m in o.finditer(b) if int(m.group(1))!=int(h.group(1))};assert old<=e,old-e;n={(52,37),(52,40),(52,49),(130,128)};assert
      n<=e,n-e;w={(int(r['superseder']),int(r['victim'])) for r in yaml.safe_load(open('config/decision_supersession_waivers.yaml'))['waivers']};assert
      n<=w,n-w;assert len(e)>=110,len(e);assert d and d.kind=='examined' and d.unit=='decisions' and d.count==hc(Path('.')),d;print('guard
      OK',len(e))"
    expected: Exit 0 printing the guard line with the edge count (110 at plan time; it grows with the corpus).
    fix_if: >-
      A FAIL list means an edge is red; if it is not one of the four named edges, stop and report (never add an
      unplanned waiver). old-e non-empty means the swap dropped an edge; n-e means the swap did not land; a None or
      mismatched declaration means examined() is not reached on the pass path.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      The registered check runs on every --pre and full pass and fails on any red edge; validate_check_accounting
      enforces the declaration. A registry row would repeat both.
    expected_literals:
      - guard OK
  - step: 3
    phase: pre-deploy
    action: Confirm the check left the grandfather roster and the accounting guard is green.
    command: >-
      bin/venv-python -c "from scripts.checks.hygiene.validate_check_accounting import validate_check_accounting as
      v;f=[];v(f);assert not f,f;assert 'validate_supersession_annotations' not in
      open('config/check_accounting_baseline.yaml').read();print('accounting OK')"
    expected: Exit 0 printing the accounting line.
    fix_if: >-
      A touch-it-fix-it FAIL means the module edit landed without the declaration; a shrink FAIL means another roster
      line changed. Fix the module or the roster line, never the guard.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_check_accounting already runs standing in both tiers and enforces exactly this.
    expected_literals:
      - accounting OK
  - step: 4
    phase: pre-deploy
    action: Confirm the contract no longer names _EDGE_RE and its amendment-log rule passes.
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as
      v;f=[];v(f);assert not f,f;t=open('docs/contracts/decision-entry.yaml').read();assert '_EDGE_RE' not in t;assert
      'PLAN-t1-17-c4-supersession-guard-hardening' in t;print('contract OK')"
    expected: Exit 0 printing the contract line.
    fix_if: >-
      A drift FAIL naming decision-entry means the amendment_log entry is missing or malformed; '_EDGE_RE' still
      present means a row was not retired or repointed. If the drift check's import path or signature differs, read
      scripts/checks/contracts/ and call its registered entrypoint; do not weaken the assertions.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_contract_drift runs standing in both tiers; the symbol removal is a one-time fact.
    expected_literals:
      - contract OK
  - step: 5
    phase: pre-deploy
    action: Confirm the branch touches only the scope files.
    command: git diff --name-only origin/main...HEAD | sort
    expected: >-
      Exactly five paths: config/decision_supersession_waivers.yaml,
      docs/contracts/decision-entry.yaml, docs/plans/PLAN-t1-17-c4-supersession-guard-hardening.yaml,
      scripts/checks/decisions/validate_supersession_annotations.py and
      tests/checks/decisions/test_validate_supersession_annotations.py (the baseline and _manifest.py rows landed on
      main by #1780).
    fix_if: Any other path means scope leaked; revert it.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A one-time check on transient branch state (the diff against origin/main), which validate_scope_boundary
      enforces at implement time; a registry row has no stable subject.
  - step: 6
    phase: pre-deploy
    action: Run the fast presubmit tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0; PR CI's --pre run is the authoritative pre-merge gate (Decision 73).
    fix_if: Address the reported check; never add a suppression.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Run the full tier before handoff (Decision 163 clause 2, validate_handoff_full_tier).
    command: bin/venv-python -m scripts.validate
    expected: Exit 0.
    fix_if: >-
      A failure in a check this plan touches is this plan's to fix; a failure elsewhere is reported with its output,
      never suppressed (timeout_disposition blocked: rerun from the start).
    hermetic: false
    graduation: not-applicable
test_obligations:
  - source: scripts/checks/decisions/validate_supersession_annotations.py
    behavior: >-
      Whole-number annotation match, shared-grammar plural edges, participle rejection, orphan-waiver FAIL and
      malformed-waiver FAIL (the examined() declaration is main's, #1780, pinned by test_run_declares_the_heading_count).
    verification_step: 1
    test_selector: tests/checks/decisions/test_validate_supersession_annotations.py
    red_green_expectation: >-
      Red before: the M1 prefix fixture passes the guard wrongly, the plural fixtures yield no edge, the orphan fixture
      passes, and the missing-victim fixture raises KeyError and the non-integer one ValueError. Green after.
  - source: config/decision_supersession_waivers.yaml
    behavior: The four new red edges are waived and the real-repo guard is green.
    verification_step: 1
    test_selector: tests/checks/decisions/test_validate_supersession_annotations.py::TestNonVacuityRealRepo::test_real_repo_guard_is_green
    red_green_expectation: Red once the grammar swap lands without the waivers (four FAIL lines); green after.
  - source: config/check_accounting_baseline.yaml
    behavior: The roster no longer exempts the guard.
    verification_step: 3
    command: >-
      bin/venv-python -c "from scripts.checks.hygiene.validate_check_accounting import validate_check_accounting as
      v;f=[];v(f);assert not f,f;assert 'validate_supersession_annotations' not in
      open('config/check_accounting_baseline.yaml').read();print('accounting OK')"
    waiver_reason: >-
      A one-line roster removal enforced by validate_check_accounting's shrink and touch-it-fix-it legs, which run
      standing in both tiers; VP 3 exercises them.
  - source: docs/contracts/decision-entry.yaml
    behavior: The contract stops naming the retired regex and logs the amendment.
    verification_step: 4
    command: >-
      bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as
      v;f=[];v(f);assert not f,f;t=open('docs/contracts/decision-entry.yaml').read();assert '_EDGE_RE' not in t;assert
      'PLAN-t1-17-c4-supersession-guard-hardening' in t;print('contract OK')"
    waiver_reason: >-
      Prose and amendment-log edit with no runtime behavior; validate_contract_drift's Class D amendment-log rule is
      the standing guard and VP 4 exercises it.
  - source: scripts/checks/decisions/_manifest.py
    behavior: Comment-only edit; no Entry field changes.
    verification_step: 1
    test_selector: tests/checks/decisions/test__manifest.py
    waiver_reason: >-
      Comment-only change with no behavior; tests/checks/decisions/test__manifest.py already resolves every Entry.
