execution_steps:
  - >-
    scripts/checks/decisions/validate_supersession_annotations.py: (a) _is_annotated returns
    re.search(rf"\bDecision {superseder}(?!\d)", victim_block) is not None; delete _HEADER_SUPERSEDED_RE. (b) In
    extract_supersession_edges replace the _EDGE_RE loop with, for word in ("amends", "supersedes"),
    _extract_title_relation_targets(block, word) imported from scripts.decisions_md; keep the self-reference skip, the
    envelope union and the sorted set; delete _EDGE_RE. (c) _load_waivers: each waivers entry must be a mapping whose
    superseder and victim coerce to int; otherwise append a FAIL naming the entry index and the file and return None.
    (d) _check_supersession_annotations: after the edge loop, append one FAIL per waived pair absent from the extracted
    edge set ("orphan waiver S->V names no extracted edge -- delete it") and set any_fail. (e) Keep main's
    registry.examined(_heading_count(root), unit="decisions") (#1780); add no second declaration. (f) Docstring: the check runs
    in --pre and full (the _manifest.py Entry is authoritative); replace the singular-only limit with the shared
    grammar's actual reach: lists closed by ")" or ";", slash lists and repeated "Decision" tokens are enumerated; a
    sentence-final bare-number continuation is not (envelope-bearing entries are covered by the Decision 167 union);
    participle and gerund forms are not edges (whole-word anchor). State orphan FAIL and stale WARN.
  - >-
    tests/checks/decisions/test_validate_supersession_annotations.py: add classes for M1 (superseder 5, victim
    mentions only Decision 52 -> FAIL; "Decision 5." -> pass); M2, pinned to forms the grammar admits ("(Supersedes
    Decisions 1, 2)"; "amends Decisions 1/2."; "amends Decision 1 and Decision 2." -> every pair extracted) plus one
    documented-limit case ("Supersedes Decisions 1, 2." -> only (S, 1)); participle rejection (superseding, amending,
    does not amend, superseded by -> no edge); L2 orphan -> FAIL naming the pair (the stale -> WARN case already
    exists); and L3 missing victim and non-integer superseder -> FAIL without exception (main's
    test_run_declares_the_heading_count owns the declaration, #1780). The M2, participle and L3 cases are
    pytest.mark.parametrize tables (constraint SLOC). tmp_path fixtures; no absolute real-repo counts.
  - >-
    config/decision_supersession_waivers.yaml: append 130->128 with "Decision 130's title amends Decisions 102/128
    'scan scope' only (the tests/ grandfather); Decision 128's decompose-by-default rule stands. Same clause-level
    family as the operator-confirmed 128->102 waiver; never asserted before this plan's grammar swap." Then, under a
    comment line reading OPERATOR-CONFIRM-PENDING (MEMORY.md#parked R4), append 52->37, 52->40, 52->49, each with:
    "Archived Decision 52's title supersedes Decisions 37, 40, 49 (a full supersession). Decision 52 is itself 'now
    fully retired' (Decision 116). This victim already forward-points to its operative superseder, Decision <116 for
    37 and 49, 122 for 40>, chosen in the operator-confirmed PLAN-decisions-archival-hygiene move list. The edge was
    never asserted before this plan's grammar swap, so no existing assertion weakens (Decision 181)." In the same
    commit amend the header's admitted categories with a fourth: "a historical full supersession by a retired
    superseder whose victim already forward-points to its operative superseder". Remove the marker line once the
    operator confirms.
  - "config/check_accounting_baseline.yaml: delete the validate_supersession_annotations line."
  - >-
    docs/contracts/decision-entry.yaml: delete the known_divergent_grammars _EDGE_RE row (leave known_divergent_grammars:
    []); in currency.consumer_contract replace the _EDGE_RE parenthetical with one naming
    scripts.decisions_md._extract_title_relation_targets, which matches supersedes and amends identically; add an
    amendment_log entry (date, semantic_break false, change_class prose_improvement) citing
    PLAN-t1-17-c4-supersession-guard-hardening and Decision 134 clause 3.
  - "scripts/checks/decisions/_manifest.py: delete the stale-docstring sentences in the Entry comment; keep pre=True and pre_globs."
  - >-
    Execute the Verification Plan: run each step; loop until pass; on an unplanned red edge stop and report rather
    than waive (Decision 55).
