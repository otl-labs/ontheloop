schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: t2-19-c10-recs-read-topology-guard
intent: 'Close T2.19 c10 (audit F-004) in its realized form: one manifest-registered, AST-only --pre check, validate_recs_read_topology,
  that keeps the recs reader path DuckLake-only, so a regression that re-opens a non-DuckLake read path (an undeclared Reader
  implementation, a retired legacy-engine token, or a direct engine entry point outside the DuckLake plane) fails CI. It is
  the read-side complement of validate_warehouse_write_sources and detective defence in depth; IAM stays the boundary (Decision
  143).'
plan_type: IMPLEMENTATION
verification_tier: V2
implementation_declared: true
plan_path: docs/plans/PLAN-t2-19-c10-recs-read-topology-guard.yaml
phase: T2.19 (in_progress; follow-on plan for criterion c10)
scope:
- file: scripts/checks/ops_governance/validate_recs_read_topology.py
  action: Create
  purpose: 'The guard: a pure scan(root, *, allowlist=None, declared_readers=None) running legs R0-R4 (R4b: re-exported entry
    points) over every non-test .py under scripts/ and src/ (self-excluded via _self_path), with the frozen DECLARED_READERS
    and ALLOWLIST tuples (each row carries a reason), wrapped by the registered check. Filesystem-only, in-process, never imports
    a scanned module. Declares examined(files parsed). Spec in execution_steps[0].'
- file: scripts/checks/ops_governance/_manifest.py
  action: Modify
  purpose: 'Add the validate_recs_read_topology Entry directly after validate_warehouse_write_sources: pre=True, pre_globs=None
    (ungated: the scan scope is repo-wide; deviation 2026-10-02, context), full_segment "full_after_lint".'
- file: config/ci_rca_taxonomy.yaml
  action: Modify
  purpose: Map validate_recs_read_topology to code_regression under function_to_category, after validate_warehouse_write_sources.
- file: tests/checks/ops_governance/test_validate_recs_read_topology.py
  action: Create
  purpose: 'Mirror test (Decision 131): a red-before fixture per leg, the real reader client with an undeclared return injected,
    SyntaxError, non-UTF-8 and missing-client fixtures, the false-positive negatives, the ALLOWLIST globs pinned by equality,
    the empty-allowlist real-tree test proving each of the 13 live rows load-bearing, a no-stale-row test, examined accounting,
    and registration.'
closes_criteria:
- T2.19:c10
bundled_recommendations: []
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- 'T2.19:c10 (realized form, Decision 169): validate_recs_read_topology is registered in the ops_governance manifest (pre=True,
  pre_globs None, ungated, full_after_lint), dispatched in both tiers and mapped to code_regression; it passes on
  the current tree with examined(files parsed) declared (VP 1, VP 4, VP 5); each leg fails its own regression - an allowlist
  or declared row with an empty reason (R0), a make_reader return constructing an undeclared class including on the real
  reader client (R1), an undeclared class structurally implementing Reader (R2), a retired legacy-engine token (R3), a runtime
  engine import or a ducklake_runtime / ducklake_spike entry point imported or attribute-accessed outside the allowlist, aliased,
  unaliased or fully qualified (R4), the same entry point imported through a module-scope re-export of an allowlisted module
  (R4b), and a missing reader client, an unparseable or a non-UTF-8 file (Decision 55) - while docstrings, string-only action
  names, TYPE_CHECKING imports, constants-only ducklake_runtime imports, exception classes named *Reader* and allowlisted planes
  pass (VP 3); the ALLOWLIST globs equal the pinned tuple, every row matches a real file, and with the allowlist emptied exactly
  the 13 live rows absorb findings (VP 2, VP 3); the diff against the merge-base adds no suppression and touches only the scope
  files and this plan (VP 6, VP 7); and the full tier exits 0 (VP 8).'
verification_plan:
- step: 1
  phase: pre-deploy
  action: Run the new check against the real tree and assert a clean pass and the pinned row counts.
  command: bin/venv-python -c "from scripts.checks.ops_governance import validate_recs_read_topology as m;f=[];m.validate_recs_read_topology(f);assert
    not f,f;assert len(m.ALLOWLIST)==15 and len(m.DECLARED_READERS)==1,(len(m.ALLOWLIST),len(m.DECLARED_READERS));print('recs
    read topology OK')"
  expected: Exit 0 printing the pass line; red before because the module does not exist (ModuleNotFoundError).
  fix_if: 'A finding on the real tree is either a genuine out-of-boundary read (stop; it is an out-of-scope finding for a
    recommendation, never an inline allowlist row, Decision 59/181) or an AST false positive (narrow the detector, never the
    assertion). A row-count mismatch means the allowlist drifted from execution_steps[0]; restore it.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The registered check runs this exact call standing in both tiers once VP 4's registration lands,
    and the mirror test pins the rows; a registry row would execute the same function twice for no added independence.
  expected_literals:
  - recs read topology OK
- step: 2
  phase: pre-deploy
  action: Empty the allowlist over the real tree and prove exactly the 13 live rows are load-bearing (the two defensive rows
    absorb nothing).
  command: bin/venv-python -c "from fnmatch import fnmatch;from scripts.checks import _common;from scripts.checks.ops_governance
    import validate_recs_read_topology as m;r=m.scan(_common.ROOT,allowlist=());assert {f.leg for f in r.findings}=={'R4'},sorted({f.leg
    for f in r.findings});hit={g for g,_ in m.ALLOWLIST if any(fnmatch(f.path,g) for f in r.findings)};dead={g for g,_ in m.ALLOWLIST}-hit;assert
    dead=={'scripts/ducklake_neon_smoke_test.py','src/telemetry/**'},dead;print('allowlist load-bearing',len(hit))"
  expected: Exit 0 printing the load-bearing line with a count of 13; red before because the module does not exist.
  fix_if: 'A live row absorbing nothing means the detector lost a site (fix the detector) or the tree changed (re-derive and
    say so in the PR body); a defensive row absorbing findings means a new direct-engine site appeared there (report it).
    Never edit the expected set to get green.'
  hermetic: true
  graduation: waive
  graduation_waiver_reason: The mirror test carries the same empty-allowlist assertion standing in the pytest phase of both
    tiers; a registry row would duplicate it.
  expected_literals:
  - allowlist load-bearing 13
- step: 3
  phase: pre-deploy
  action: Run the mirror test (every leg's red-before fixture, the real-client injection, the SyntaxError, non-UTF-8 and missing-client
    fixtures, the negatives, the pinned globs, the load-bearing and stale-row tests, accounting and registration).
  command: bin/venv-python -m pytest tests/checks/ops_governance/test_validate_recs_read_topology.py -q
  expected: Exit 0, all tests pass under pytest-randomly's shuffled order.
  fix_if: A failing leg case means the leg misses its regression; fix the leg. A failing negative means a false positive;
    narrow the matcher, never widen the allowlist to absorb it. An order-dependent failure means a test leaked a monkeypatched
    constant or the registry declaration slot; isolate it.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Whole-file pytest re-run of a test file this plan creates (hermetic_authoring clause v); the pytest
    phase already runs it standing in both tiers.
- step: 4
  phase: pre-deploy
  action: Confirm registration across the manifest, both tier sequences, the ci_rca taxonomy and the accounting declaration.
  command: bin/venv-python -c "import yaml;from scripts.checks import registry;from scripts.checks.ops_governance import _manifest;e=[x
    for x in _manifest.ENTRIES if x.name=='validate_recs_read_topology'][0];assert e.pre and e.full_segment=='full_after_lint';assert
    e.pre_globs is None,e.pre_globs;assert 'validate_recs_read_topology' in [s.name for s in registry.pre_sequence()]
    and 'validate_recs_read_topology' in [s.name for s in registry.full_sequence()];t=yaml.safe_load(open('config/ci_rca_taxonomy.yaml'))['function_to_category'];assert
    t['validate_recs_read_topology']=='code_regression';f=[];registry.resolve('validate_recs_read_topology')(f);d=registry.pop_declaration();assert
    d and d.kind=='examined' and d.unit=='files' and d.count>400,d;print('registration OK')"
  expected: Exit 0 printing the registration line.
  fix_if: An IndexError means the Entry is missing; a KeyError means the taxonomy row is missing; a None declaration means
    examined() is not reached; a count at or below 400 means the walk lost a root (477 files at e2adb126). If Step objects
    expose the name under another attribute, read scripts/checks/registry.py's Step and use it; never weaken the membership
    assertion.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: Duplicates standing guards; test__manifest.py resolves every Entry, validate_ci_rca_taxonomy
    enforces the taxonomy row and validate_check_accounting enforces the declaration in both tiers.
  expected_literals:
  - registration OK
- step: 5
  phase: pre-deploy
  action: Run the ops_governance manifest test, which resolves the new Entry (ungated, so it carries no closure row).
  command: bin/venv-python -m pytest tests/checks/ops_governance/test__manifest.py -q
  expected: Exit 0, all tests pass, including the validate_recs_read_topology Entry parametrisations.
  fix_if: An Entry resolution failure means the module/attr literal is wrong; fix the Entry, never the test.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Whole-file pytest re-run of an existing test file that parametrises over the Entry this plan adds
    (hermetic_authoring clause v); the pytest phase already runs it standing.
- step: 6
  phase: pre-deploy
  action: Goodhart and branch-scope sweep against the merge-base - no net-new suppression, and the branch touches only the
    four scope files and this plan.
  command: bash -c 'b=$(git merge-base origin/main HEAD) && [ -n "$b" ] || { echo "no merge-base, fetch origin main"; exit
    1; }; git diff -U0 "$b" -- scripts tests config | grep -E "^\+.*(noqa|type:\s*ignore|pragma:\s*no
    cover|pytest\.mark\.(skip|xfail)|importorskip)" && exit 1; x=$(git diff --name-only "$b" | grep -vxF -e scripts/checks/ops_governance/validate_recs_read_topology.py
    -e scripts/checks/ops_governance/_manifest.py -e config/ci_rca_taxonomy.yaml -e tests/checks/ops_governance/test_validate_recs_read_topology.py
    -e tests/checks/ops_governance/test__manifest.py -e docs/plans/PLAN-t2-19-c10-recs-read-topology-guard.yaml); [ -z "$x" ]
    || { echo "out-of-scope $x"; exit 1; }; echo sweep-clean'
  expected: Exit 0 printing the clean marker.
  fix_if: A matched added line means a suppression slipped in; remove it and fix the underlying finding. An out-of-scope path
    means scope leaked (a scanned read-path file, the baseline or the roadmap); revert it. No merge-base means origin/main
    is missing or the clone is too shallow; git fetch origin main (deepen if needed), never drop the guard.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: PR-relative against the merge-base; it measures this branch only and is vacuous once merged, so
    it is not a standing regression guard.
- step: 7
  phase: pre-deploy
  action: Lint, format and type-check the new and modified Python files.
  command: bin/venv-python -m ruff check scripts/checks/ops_governance/validate_recs_read_topology.py scripts/checks/ops_governance/_manifest.py
    tests/checks/ops_governance/test_validate_recs_read_topology.py tests/checks/ops_governance/test__manifest.py && bin/venv-python
    -m ruff format --check scripts/checks/ops_governance/validate_recs_read_topology.py scripts/checks/ops_governance/_manifest.py
    tests/checks/ops_governance/test_validate_recs_read_topology.py tests/checks/ops_governance/test__manifest.py && bin/venv-python
    -m mypy scripts/checks/ops_governance/validate_recs_read_topology.py
  expected: Exit 0 from all three tools.
  fix_if: Fix the reported line; never add a suppression (VP 6 fails on one).
  hermetic: false
  graduation: waive
  graduation_waiver_reason: A ruff/mypy phase (hermetic_authoring clause v); the lint and typing phases of both tiers already
    run these standing.
- step: 8
  phase: pre-deploy
  action: Full presubmit tier before handoff (Decision 163 clause 2).
  command: bin/venv-python -m scripts.validate
  expected: Exit 0.
  fix_if: 'Diagnose the named failing check on the branch (Decision 55: no rescue loops); a failure unrelated to this scope
    is recorded, not patched inline (implement-scope-boundary.yaml).'
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Invokes scripts.validate (recursion hazard, vp-red-before.yaml recursion_refusal); it is the handoff
    gate itself, not a regression guard.
test_obligations:
- source: scripts/checks/ops_governance/validate_recs_read_topology.py
  behavior: Each of legs R0-R4b fails its own regression, a missing client, an unparseable and a non-UTF-8 file fail, the
    real reader client with an undeclared return fails R1, the negatives pass, the ALLOWLIST globs are pinned by equality,
    every row matches a real file, the 13 live rows are load-bearing, and examined(files) is declared on every exit path.
  verification_step: 3
  test_selector: tests/checks/ops_governance/test_validate_recs_read_topology.py
  red_green_expectation: Red before (the module does not exist, so collection fails with ModuleNotFoundError); green after.
- source: scripts/checks/ops_governance/_manifest.py
  behavior: The validate_recs_read_topology Entry exists with pre=True, pre_globs None (ungated) and full_after_lint.
  verification_step: 3
  test_selector: tests/checks/ops_governance/test_validate_recs_read_topology.py
  red_green_expectation: Red before (TestRegistration resolves the Entry by name with next(), so an absent Entry raises StopIteration
    rather than silently not parametrizing); green after.
- source: config/ci_rca_taxonomy.yaml
  behavior: validate_recs_read_topology maps to code_regression.
  verification_step: 3
  test_selector: tests/checks/ops_governance/test_validate_recs_read_topology.py
  red_green_expectation: Red before (TestRegistration hits a KeyError on the missing row); green after.
