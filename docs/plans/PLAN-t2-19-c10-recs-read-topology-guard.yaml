execution_steps:
- 'scripts/checks/ops_governance/validate_recs_read_topology.py: module docstring says detective defence in depth for the ops-store
  plane (IAM is the boundary, Decision 143), table-agnostic by construction, and that R4b follows module-scope re-exports of
  allowlisted modules only. Frozen constants: READER_CLIENT_REL = "src/common/ducklake_reader_client.py"; DECLARED_READERS
  = (("DuckLakeReader", "read-engine.yaml#reader_client; Decision 84 I-1"),); ALLOWLIST = 12 (glob, reason) rows, matched
  with fnmatch.fnmatch on the repo-relative POSIX path: src/common/ducklake_runtime.py (the primitive); src/common/ducklake_spike.py,
  src/common/ducklake_connect_probe.py, src/common/ducklake_maintenance.py (privileged-host operational tools); src/lambdas/ducklake_reader/**,
  src/lambdas/ducklake_writer/**, src/lambdas/ducklake_maintenance/**, src/lambdas/ducklake_maintenance_smoke/**, src/lambdas/ducklake_catalog_dr/**
  (the boundary itself, Decision 81 cl.1/cl.7); scripts/ducklake_smoke/**, scripts/ducklake_neon_smoke_test.py (break-glass
  smoke harness, DUCKLAKE_ALLOW_DIRECT_GATE, Decision 81 cl.7); src/telemetry/** (separate plane, Decision 184 cl.2); RETIRED_TOKENS
  = ("OPS_STORAGE_BACKEND", "DuckDBIcebergReader"); RETIRED_MODULES = ("pyiceberg", "iceberg_reader") matched as whole dotted
  segments, never substrings (iceberg_type passes); ENGINE_IMPORTS = ("duckdb", "psycopg2"); RUNTIME_MODULE = "src.common.ducklake_runtime"
  with ENTRY_POINTS = {open_connection, get_warm_connection, reset_warm_connection, fetch_dsn, libpq_conninfo}; SPIKE_MODULE
  = "src.common.ducklake_spike" with SPIKE_ENTRY = "_require_duckdb". API: Finding(leg: str, path: str (repo-relative POSIX), line:
  int, message: str) and ScanResult(findings, files_parsed) dataclasses; derive_exports(root, allowlist=None) -> dict[str,
  frozenset[str]] (the R4b map, seeds excluded) for the test; scan(root, *, allowlist=None, declared_readers=None) -> ScanResult, where None reads the module
  constant at call time (so tests may monkeypatch it); @registry.register("validate_recs_read_topology", owner="platform")
  validate_recs_read_topology(failed: list[str]) -> None prints "=== Recs read topology ===", calls scan(_common.ROOT), appends
  each finding as "<leg> <path>:<line>: <message> (Decision 84 closed boundary)", and calls registry.examined(files_parsed,
  unit="files") on every exit path. Walk every *.py under scripts/ and src/ except _self_path, sorted; read as UTF-8; an OSError,
  UnicodeDecodeError or SyntaxError is a FAIL naming the file (Decision 55), never a skip. Binding resolution, per file: a local
  name bound to a module is the asname, else the bound name, of `import a.b.c as X`, `from a.b import c` or `from a.b import
  c as X`; a bare `import a.b.c` binds the dotted chain, matched as an Attribute chain whose ast.unparse equals the module
  name. TYPE_CHECKING blocks: the body (never orelse) of an If whose test is the Name TYPE_CHECKING or an Attribute with attr
