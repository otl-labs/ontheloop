- No net-new suppressions (noqa, type ignore, pragma no cover, skip, xfail) in the diff (project Goodhart countermeasure);
  every new test fails on broken code. New module stays under 500 SLOC unregistered (Decision 128).
- No rescue agents or workaround loops (Decision 55). No emojis; ASCII hyphens only.
