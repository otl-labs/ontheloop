schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "t2-47-c2-pending-gated-ordering"
intent: >-
  Restore T2.47 c2 (DEP-11): the drift rec for a routed-pending episode names the pending PR again, the
  2.0h escalation red (kept by operator ruling) says it is an unapproved gated change rather than
  out-of-band drift and files a dedup-able rec, real drift during an approval window red-flips, and an
  approved gated apply can no longer write green over a drift red that postdates the route.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-t2-47-c2-pending-gated-ordering.yaml
phase: >-
  This repository's roadmap, tier T2, tier_item T2.47 (DEP-11), criterion c2 only. c2 was reopened by PR #1383 on operator
  decision (option (a) then (c), 2026-10-02T20:31Z); this is option (c). Evidence:
  PLAN-t2-47-recovery-semantics-closeout (#1354).
closes_criteria: ["T2.47:c2"]
scope:
  - file: scripts/ci/convergence_classify.py
    action: Modify
    purpose: >-
      Stdlib delegate owns every routed-pending decision (state matrix in context). (1) Pending-codification
      write, decision order escalate > pending_gated > pending_gated_flagged: a stale marker escalates first
      even when pending_gated.drift_flagged_at is already set; otherwise, with pending_gated present, the
      first tick returns "pending_gated" (stamps drift_flagged_at, write-once) and later ticks
      "pending_gated_flagged"; the pending_codification marker is always written so the Decision 190 pt 3
      bound runs. (2) Escalation sets stale_gated_approval (and names the pending commit and run in
      drift_reason) only when pending_gated is present and pending_codification.first_seen >=
      pending_gated.routed_at; derive_red_cause stays binary (Decision 190 pt 4 / Decision 142). (3) Both
      renderers word a stale-gated red as an unapproved gated change and name the heal (approve or reject the
      waiting gated run; after a rejection, the acknowledge-and-retry dispatch, Decision 183); the advisory
      description stays within GitHub's 140-character limit. (4) Out-of-band red-flip record builder (moved
      out of the inline shell): sets drift_detected_at, drift_run_url, drift_reason (naming the routed commit
      when pending_gated is present) and pops pending_codification and stale_gated_approval (Decision 190 pt
      3, marker superseded by the red). (5) prior-red short-circuit predicate: a prior red skips the tick
      EXCEPT a stale_gated_approval red meeting an out_of_band_drift verdict, which falls through to the
      red-flip. (6) --drift-guard, FAIL-CLOSED: prints false only when it positively clears the green write
      (NoSuchKey / empty record = pass-on-absent; a green record; a red without drift fields; a red whose
      drift_detected_at <= pending_gated.routed_at; a stale_gated_approval red); a non-NoSuchKey read error,
      an unparseable record, or a missing or malformed timestamp on a drift red prints true. The CLI takes the
      read's rc, stdout and stderr (NoSuchKey is recognised from stderr, as the prior_status step does at
      terraform-drift.yml's prior_status step, :163-193, NoSuchKey classification :178-185), so an unclassified read error is never treated as absent.
  - file: tests/test_convergence_classify.py
    action: Modify
    purpose: >-
      Unit tests for the state matrix: routed first/flagged ticks; escalation on the realistic record (stale
      pending_codification plus pending_gated with drift_flagged_at already set); stale_gated_approval only
      when first_seen >= routed_at; stale-gated red then real drift falls through and the guard then blocks;
      the red-flip pops pending_codification; fail-closed guard cases (unparseable record, read error,
      malformed timestamp); the 140-character advisory limit; the no-marker paths.
  - file: .github/workflows/terraform-drift.yml
    action: Modify
    purpose: >-
      Handle-drift step dispatches on the delegate. The prior-red short-circuit asks the delegate (R1: a
      stale-gated red meeting real drift falls through). "pending_gated" resolves the pending PR (existing
      GH_TOKEN commits/.../pulls lookup) and files the PR-naming tf_drift rec instead of the generic one;
      "pending_gated_flagged" files nothing; "escalated" files a tf_drift rec embedding the exact
      drift_run_url written to the record (Decision 142 dedup key, Decision 190 pt 5), naming the pending PR
      when pending_gated is present, on every escalation (marker or not). Verdict out_of_band_drift red-flips
      through the delegate's record builder whether or not pending_gated is present; the green-keeping
      PENDING_GATED_DRIFT branch is removed (Decision 190 pt 1). The PENDING_GATED rec keeps source tf_drift;
      its context drops "stays green" and its acceptance becomes "aws s3 cp
      s3://agent-platform-data-lake/convergence/personal/sandbox.json - | grep -qv pending_gated" (unchanged
      probe, true once a full write clears the marker) with the context naming the 2.0h red. The escalation
      rec's acceptance is "aws s3 cp s3://agent-platform-data-lake/convergence/personal/sandbox.json - | grep -q
      'status.: .green'" (no inner double quote, so test_portal_acceptance_passes_lint's --acceptance "..."
      extraction lints the whole value; it matches the full writer's json.dumps "status": "green" and is true
      only after a full green write). The comment at :66 that names the
      PENDING_GATED_DRIFT branch is re-pointed to the new dispatch.
  - file: tests/test_terraform_drift_acceptance.py
    action: Modify
    purpose: >-
      Disposition of the six pending_gated tests (five disposed, :148 kept; each replacement at least as strong, traced to Decision
      190 pt 1 or the operator ruling): test_drift_workflow_has_pending_gated_branch (:139) rewritten to
      assert the "pending_gated" action dispatch and the PR-naming rec title; test_drift_workflow_names_the_
      pending_pr_via_authenticated_lookup (:148) kept; test_drift_workflow_pending_gated_checked_before_out_of
      _band_flip (:169) replaced by test_drift_workflow_pending_gated_read_precedes_generic_rec, which asserts
      the pending_gated action dispatch (the ACTION check) precedes the generic rec filing (red on the current
      tree); test_drift_workflow_pending_gated_branch_never_red_flips (:180) replaced by an assertion that the
      out-of-band verdict red-flips regardless of pending_gated
      (test_drift_workflow_out_of_band_red_flips_with_pending_gated, which also asserts PENDING_GATED_DRIFT and
      ALREADY_FLAGGED are absent from the workflow); test_drift_workflow_stamps_drift_flagged_at
      _for_idempotency (:192) moved to a delegate unit test of the write-once stamp;
      test_drift_workflow_out_of_band_branch_still_gated_behind_marker_absence (:201) replaced by an
      assertion that the escalated branch files a rec carrying drift_run_url and that the prior-red
      short-circuit consults the delegate (test_drift_workflow_escalation_files_drift_run_url_rec).
  - file: .github/workflows/terraform-apply-sandbox.yml
    action: Modify
    purpose: >-
      The file sits at its 435-effective-line structural budget (config/structural_size_budgets.yaml), so the
      guard is paid for by a decomposition, never a raise (AGENTS.md SLOC governance; Decision 128/166). (A)
      Decomposition: both jobs' "Best-effort post-merge SHA->PR wake" run bodies (apply-sandbox, R3 13 lines;
      gated-apply, R3 11 lines) become a single-line call to scripts.ci.apply_wake (--job apply-sandbox |
      --job gated-apply); the inline ${{ github.sha }} moves to a HEAD_SHA env line; each step's name, if,
      continue-on-error, GH_TOKEN, REPO, SHA, APPLY_OUTCOME and (apply-sandbox) ROUTED stay as they are. (B)
      gated-apply job (starts about :666): a drift-guard step (id drift_guard, named "Drift guard (refuse green
      over a post-route drift red)" -- no "wake" in the name, validate_dispatch_gated_apply_topology invariant
      (vii) counts exactly two wake steps) after apply and before the record
      writer reads the record (passing the read's rc, stdout and stderr to the delegate) and runs
      scripts.ci.convergence_classify --drift-guard. The writer is wired fail-closed, refused set to
      steps.apply.outcome == 'success' && steps.drift_guard.outputs.refused != 'false', so an erroring or
      skipped guard can only block a green write, never a red one (Decision 92 pt 2). The comment at about :833
      ("the record cannot go red via the CD path while this job holds the group") is corrected: the drift
      workflow is outside that group. The gated-apply wake step's APPLY_OUTCOME env becomes 'refused' when
      steps.apply.outcome == 'success' and steps.drift_guard.outputs.refused != 'false' (else steps.apply.outcome),
      and scripts.ci.apply_wake renders a refusal message, so the wake never says "converged GREEN" when the
      record stayed red; the guard step emits a ::warning:: naming the acknowledge-and-retry heal. Net effective
      lines must fall (measured at build time against main); the budget entry is lowered to the measured count.
  - file: scripts/ci/apply_wake.py
    action: Create
    purpose: >-
      Decomposition target for scope row 5 (A). Stdlib-only (the jobs install no dependencies) best-effort PR
      wake: reads REPO, SHA, HEAD_SHA, APPLY_OUTCOME and ROUTED from the environment, resolves the PR through
      `gh api repos/{REPO}/commits/{SHA}/pulls --jq '.[0].number'`, renders the message and posts it with
      `gh pr comment`. --job apply-sandbox renders today's three messages (routed, converged GREEN, did NOT
      converge) byte-for-byte; --job gated-apply renders today's two plus the new refused message (record left
      red because a drift red postdates the route; heal is acknowledge-and-retry, Decision 183). Every gh error
      or unresolved PR prints a line and exits 0 (best-effort, matching today's `|| true` and continue-on-error).
      Under 120 SLOC.
  - file: tests/test_apply_wake.py
    action: Create
    purpose: >-
      Unit tests for scripts.ci.apply_wake with subprocess.run mocked (and Popen, tests/CLAUDE.md): each
      job/outcome message equals the literal the workflow body carried before the move (byte-parity, one test
      per message), the gated-apply refused message never contains "converged GREEN" and names
      acknowledge-and-retry (test_gated_apply_refused_message_names_ack_retry), no PR resolved posts nothing and exits 0, a gh failure exits 0.
  - file: config/structural_size_budgets.yaml
    action: Modify
    purpose: >-
      Lower the .github/workflows/terraform-apply-sandbox.yml entry from 435 to its measured post-change count (a
      decrease is unrestricted; no raise-approved marker). If the measured count is not below 435, the
      decomposition is incomplete: stop and amend the plan, never raise.
  - file: docs/contracts/environment-taxonomy.yaml
    action: Modify
    purpose: >-
      Operator-approved text, bound word for word by docs/plans/approved/t2-47-c2-pending-gated-ordering.yaml
      (approved 2026-11-02; wording-check PASS, see gate_rounds): convergence_marker_vocabulary (the sole SoT)
      gains the stale_gated_approval row and pending_gated's routed_at_role; the gated-apply three-branch write
      narrative's green branch names the drift-guard refusal; one dated amendment_log row. No other edit.
  - file: docs/contracts/deploy-paths.yaml
    action: Modify
    purpose: >-
      Operator-approved text, bound by the same sidecar: reconcile.heal_verb_selection names the heal for a
      stale_gated_approval red (approve or reject the waiting tf-gated-apply run; after a rejection,
      acknowledge-and-retry) and for a gated apply whose green write the drift guard refused; one dated
      amendment_log row. No other edit.
  - file: tests/test_gated_apply_drift_guard.py
    action: Create
    purpose: >-
      Structural mirror for the gated-apply wiring: the drift-guard step exists in gated-apply only, precedes
      the writer, invokes the delegate, and feeds refused through the fail-closed expression; the gated-apply
      wake step's APPLY_OUTCOME carries 'refused' on a guard refusal and both wake steps call
      scripts.ci.apply_wake; apply-sandbox, apply-reconcile and gated-apply-reconcile writers are untouched.
      Contract wiring (test_marker_vocabulary_registers_stale_gated_approval): every record field the delegate
      writes as a marker (pending_gated, pending_codification, stale_gated_approval) is a key of
      environment-taxonomy.yaml's convergence_marker_vocabulary, and deploy-paths.yaml's
      reconcile.heal_verb_selection names stale_gated_approval.
  - file: scripts/convergence_health/escalate.py
    action: Modify
    purpose: >-
      The pending_codification ticket context names the pending gated commit and run when pending_gated is
      also present and status is green, instead of the "land the codifying change" narrative (c2's
      health-verdict half; the trigger stays unconditional, Decision 190). A red record never gets this
      context (the red-flip pops pending_codification, scope row 1 item 4).
  - file: tests/convergence_health/test_escalate.py
    action: Modify
    purpose: Test for the pending_gated-aware pending_codification context.
  - file: config/agent/verification_registry/entries/drift-pending-gated-narrative.yaml
    action: Modify
    purpose: >-
      Graduated 2026-07-22, it greps for the PENDING_GATED_DRIFT literal this plan removes. Re-point its
      check_spec to the new dispatch (the delegate's pending_gated / pending_gated_flagged actions and the
      workflow's PR-naming rec); the modified entry fails on origin/main and passes on HEAD, so the
      differential gate admits it.
  - file: config/composite_action_body_baseline.yaml
    action: Modify
    purpose: >-
      r3_workflows: lower the handle-drift ceiling to its measured size (shrink-only; currently 116) and
      register the new gated-apply drift-guard body at its measured size (at most 3 effective lines); lower
      both best-effort-post-merge-sha-pr-wake entries (apply-sandbox 13, gated-apply 11) to their measured
      single-line size (scope row 5 (A); shrink-only).
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      /implement bookkeeping only: closes_criteria [T2.47:c2] flips c2 open -> met with met_by
      t2-47-c2-pending-gated-ordering and a dated progress_note line saying c2 is met on unit and structural
      evidence with live confirmation pending at the next routed-pending episode (VP 11). Item status stays
      operator-owned.
bundled_recommendations: []
followon_recs: [rec-4834]
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    A routed-pending episode (green record carrying pending_gated, plan with resource_changes and no
    resource_drift) files exactly one tf_drift rec that names the pending PR, on the first tick; later
    ticks file none; the pending_codification marker is still written.
  - >-
    After the 2.0h bound, on the realistic record (pending_gated already flagged), the record turns red carrying
    stale_gated_approval and a drift_reason naming the pending commit; a tf_drift rec embedding that drift_run_url and naming the pending PR is filed; the
    refusal and advisory text never say "MEASURED out-of-band drift" for this red and name the approve or
    reject heal.
  - >-
    Real drift (resource_drift non-empty) during an approval window red-flips the record, including after the
    2.0h stale-gated red; no branch keeps it green and an approval cannot green over it.
  - >-
    An approved gated apply does not overwrite a drift red whose drift_detected_at is newer than
    pending_gated.routed_at, and a guard error blocks the green write (fail-closed); it does overwrite a
    stale-gated red.
  - >-
    The no-pending_gated paths behave as before, except that every escalation now files a tf_drift rec
    carrying the record's drift_run_url (the escalation-rec fork) and the out-of-band red-flip pops
    pending_codification.
  - >-
    The handle-drift inline body is at or below its old 116-line ceiling and the baseline only shrinks or
    gains the new drift-guard entry; validate --pre is green.
  - >-
    c2's health-verdict half: HealthVerdict.pending_gated stays surfaced (existing evidence,
    tests/convergence_health/test___main__.py, unchanged) and the pending_codification ticket context names
    the pending gated commit and run when pending_gated is present (VP 7).
  - >-
    environment-taxonomy.yaml and deploy-paths.yaml carry exactly the sidecar's approved text
    (scripts.roadmap.approved_text verify passes) and every marker the delegate writes is registered (VP 6).
  - >-
    terraform-apply-sandbox.yml ends below 435 effective lines with its structural budget entry lowered to the
    measured count (no raise); both wake steps call scripts.ci.apply_wake and every pre-existing wake message
    is unchanged byte-for-byte.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: First routed-pending tick returns pending_gated, stamps drift_flagged_at once, and still writes the pending_codification marker
    command: bin/venv-python -m pytest "tests/test_convergence_classify.py::TestRoutedPending::test_first_tick_flags_pending_gated" "tests/test_convergence_classify.py::TestRoutedPending::test_later_tick_files_nothing" -q
    expected: Both pass.
    fix_if: The first tick still returns marked (the #1174 order), or a later tick re-flags.
    hermetic: true
    graduation: graduate
    graduation_check_id: routed-pending-tick-flags-pending-gated
  - step: 2
    phase: pre-deploy
    action: Escalation on the realistic flagged record marks stale_gated_approval, names the pending commit, and the refusal/advisory word it as an unapproved gated change
    command: bin/venv-python -m pytest "tests/test_convergence_classify.py::TestRoutedPending::test_escalation_marks_stale_gated_approval" "tests/test_convergence_classify.py::TestRoutedPending::test_stale_gated_refusal_is_not_out_of_band_wording" "tests/test_convergence_classify.py::TestRoutedPending::test_stale_gated_then_drift_falls_through_and_blocks" -q
    expected: All three pass.
    fix_if: >-
      The red still renders "MEASURED out-of-band drift", derive_red_cause gained a third value, a flagged
      record never escalates, or drift after the stale-gated red is swallowed.
    hermetic: true
    graduation: graduate
    graduation_check_id: stale-gated-red-names-pending-change
  - step: 3
    phase: pre-deploy
    action: The drift-guard predicate blocks only a drift red that postdates the route
    command: bin/venv-python -m pytest "tests/test_convergence_classify.py::TestDriftGuard" -q
    expected: >-
      Passes; cases cover drift-after-route, unparseable record, read error and malformed timestamp
      (blocked), and drift-before-route, stale-gated red, green record and NoSuchKey (not blocked).
    fix_if: A stale-gated red is blocked (approval could never clear it) or a post-route drift red is not.
    hermetic: true
    graduation: graduate
    graduation_check_id: gated-apply-drift-guard-predicate
  - step: 4
    phase: pre-deploy
    action: The no-pending_gated paths are unchanged
    command: bin/venv-python -m pytest tests/test_convergence_classify.py -q
    expected: The whole file passes, including every pre-existing test unmodified.
    fix_if: A pre-existing test needed editing to pass; stop and re-scope.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of a test file this plan's scope modifies; it is inside the --pre affected set and
      steps 1-3 graduate the new behavior.
  - step: 5
    phase: pre-deploy
    action: Drift workflow order and branches match the new behavior
    command: >-
      bin/venv-python -m pytest
      "tests/test_terraform_drift_acceptance.py::test_drift_workflow_pending_gated_read_precedes_generic_rec"
      "tests/test_terraform_drift_acceptance.py::test_drift_workflow_escalation_files_drift_run_url_rec"
      "tests/test_terraform_drift_acceptance.py::test_drift_workflow_out_of_band_red_flips_with_pending_gated" -q
    expected: >-
      All three pass; the rest of tests/test_terraform_drift_acceptance.py (the kept and rewritten dispositions)
      runs in step 9's --pre affected set.
    fix_if: The PENDING_GATED_DRIFT green branch survives, or the escalation branch files no rec.
    hermetic: true
    graduation: graduate
    graduation_check_id: drift-workflow-routed-pending-dispatch
  - step: 6
    phase: pre-deploy
    action: The gated-apply job wires the drift guard into the writer and touches no other writer
    command: >-
      bin/venv-python -m pytest
      "tests/test_gated_apply_drift_guard.py::test_gated_apply_writer_refused_fed_by_drift_guard"
      "tests/test_gated_apply_drift_guard.py::test_marker_vocabulary_registers_stale_gated_approval" -q
    expected: Both pass.
    fix_if: >-
      The guard feeds a writer other than gated-apply's, sits after the writer, or a marker field the delegate
      writes is missing from convergence_marker_vocabulary.
    hermetic: true
    graduation: graduate
    graduation_check_id: gated-apply-writer-fed-by-drift-guard
  - step: 7
    phase: pre-deploy
    action: The pending_codification ticket names the pending gated change when pending_gated is present
    command: bin/venv-python -m pytest "tests/convergence_health/test_escalate.py::test_pending_codification_context_names_pending_gated_change" -q
    expected: Passes.
    fix_if: The context still tells the operator to land a codifying change during a gated wait.
    hermetic: true
    graduation: graduate
    graduation_check_id: pending-codification-ticket-names-gated-change
  - step: 8
    phase: pre-deploy
    action: The extracted wake delegate keeps every pre-existing message and adds the gated-apply refusal
    command: bin/venv-python -m pytest "tests/test_apply_wake.py::test_gated_apply_refused_message_names_ack_retry" -q
    expected: >-
      Passes; the rest of tests/test_apply_wake.py (one byte-parity test per pre-existing message, the
      no-PR and gh-failure exits) runs in step 9's --pre affected set.
    fix_if: >-
      A moved message differs from the literal the workflow body carried, the refused message says converged
      GREEN, or a gh failure exits non-zero.
    hermetic: true
    graduation: graduate
    graduation_check_id: gated-apply-wake-names-refusal
  - step: 9
    phase: pre-deploy
    action: Fast presubmit, including the Decision 162 R3 body ceilings and the scope boundary
    command: bin/venv-python -m scripts.validate --pre
    expected: Exits 0; PR CI's --pre run is the authoritative gate (Decision 73).
    fix_if: An R3 ceiling grew (extract into the delegate, never raise), or a scope or registry check fails.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: pre-deploy
    action: Full validation tier before handoff (handoff_policy)
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      Run on the committed clean tree, backgrounded with a 2 h limit from the top-level session; exit 0, then
      --verify-head attests HEAD's tree (the verdict, never a pipe's exit status). A timeout is BLOCKED, never a
      pass.
    fix_if: Fix the failing check; a timeout is BLOCKED and the full tier reruns from the start.
    hermetic: false
    graduation: not-applicable
  - step: 11
    phase: post-deploy
    action: At the next routed-pending episode, confirm the drift rec names the pending PR (operator-observed)
    command: >-
      echo "During the next tf-gated-apply wait, call the ducklake-reads MCP verb
      recs_by_title_prefix(prefix='Terraform drift check found a pending-gated') (no shell reader CLI exists)
      and confirm the newest rec's context names the pending PR (title prefix exactly as the PR-naming rec
      filed by the pending_gated action)"
    expected: >-
      The source=tf_drift rec names the pending PR and run, and no generic tf_drift pending-codification rec is
      filed for that episode. The tf_convergence_stale ticket still files with its existing title (the title
      is escalate.py's close-time key); only its context names the gated change.
    fix_if: A generic rec appears; reopen c2 and RCA (Decision 55).
    hermetic: false
    graduation: not-applicable
