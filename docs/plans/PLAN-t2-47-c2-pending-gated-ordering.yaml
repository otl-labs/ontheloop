    test_selector: tests/test_convergence_classify.py::TestRoutedPending::test_first_tick_flags_pending_gated
    red_green_expectation: red before (returns marked, no flag), green after
  - source: scripts/ci/convergence_classify.py
    behavior: escalation on a flagged routed record marks stale_gated_approval and names the pending commit
    verification_step: 2
    test_selector: tests/test_convergence_classify.py::TestRoutedPending::test_escalation_marks_stale_gated_approval
    red_green_expectation: red before (no stale_gated_approval), green after
  - source: scripts/ci/convergence_classify.py
    behavior: the fail-closed drift guard blocks only a drift red that postdates the route
    verification_step: 3
    test_selector: tests/test_convergence_classify.py::TestDriftGuard
    red_green_expectation: red before (no --drift-guard), green after
  - source: .github/workflows/terraform-drift.yml
    behavior: the pending_gated action dispatch precedes the generic rec filing
    verification_step: 5
    test_selector: tests/test_terraform_drift_acceptance.py::test_drift_workflow_pending_gated_read_precedes_generic_rec
    red_green_expectation: red before (the #1174 order), green after
  - source: .github/workflows/terraform-drift.yml
    behavior: the escalated branch files a tf_drift rec carrying drift_run_url
    verification_step: 5
    test_selector: tests/test_terraform_drift_acceptance.py::test_drift_workflow_escalation_files_drift_run_url_rec
    red_green_expectation: red before (escalation exits with no rec), green after
  - source: .github/workflows/terraform-drift.yml
    behavior: an out_of_band_drift verdict red-flips even with pending_gated present
    verification_step: 5
    test_selector: tests/test_terraform_drift_acceptance.py::test_drift_workflow_out_of_band_red_flips_with_pending_gated
