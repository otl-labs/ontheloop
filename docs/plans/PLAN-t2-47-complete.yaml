schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "t2-47-complete"
intent: >-
  Complete T2.47 (Recovery-path unification + routed-pending observability, DEP-10/11) at the operator's request: both
  exit criteria already read met while the item status reads not_started. The build applies the operator-approved
  sidecar so the item reads complete in Decision 147 compact form, its still-open obligations carried by recs it names
  (rec-4870 for the unrun live V3 rehearsals, rec-4834 and rec-4842 to rec-4846 for the follow-ons) and the related
  open recs rec-4050 and rec-4839 named in the PR body, so nothing is hidden.
plan_type: IMPLEMENTATION
verification_tier: V1
plan_path: docs/plans/PLAN-t2-47-complete.yaml
phase: >-
  This repository's roadmap tier T2, tier_item T2.47. c1 met (met_by terraform-recovery-semantics), c2 met (met_by
  t2-47-c2-pending-gated-ordering, #1812 55ddbad0). Status-only closeout; no criterion text, status or met_by changes.
scope:
  - file: docs/ROADMAP-PLATFORM.yaml
    action: Modify
    purpose: >-
      Blocks t247-intent and t247-status of docs/plans/approved/t2-47-complete.yaml, verbatim: T2.47's intent collapses
      to one double-quoted line (256 bytes) naming rec-4870, rec-4834 and rec-4842 to rec-4846; files_in_scope becomes
      []; status not_started -> complete with completed_at set to the build date (the sidecar's only placeholder);
      progress_note dropped. exit_criteria, related_decisions, effort and strategic unchanged. No archive move (Decision
      227 clause 4: an operator wave archives it later, T2.46 precedent #1385 then #1575).
bundled_recommendations: []
followon_recs: [rec-4870]
infrastructure_dependencies: []
acceptance_criteria:
  - Plan and sidecar are on origin/main, the branch contains origin/main, and T2.47 reads not_started there (VP step 1).
  - The branch's docs/ROADMAP-PLATFORM.yaml equals origin/main with the two sidecar blocks applied, digest unchanged (VP step 2).
  - >-
    Loaded through scripts.platform_roadmap_state, T2.47 reads status complete, completed_at an ISO date, a one-line
    intent under 280 bytes naming rec-4870, rec-4834 and rec-4842 to rec-4846, files_in_scope [], no progress_note, and
    c1/c2 still met with their met_by unchanged (VP step 3).
  - validate_platform_roadmap passes on the edited roadmap (VP step 4).
  - Every rec the new intent names exists and is open, so the dropped prose has a live carrier (VP step 5).
  - rec-2920 records the T2.46/T2.47 adjudication and stays open for its coherence-guard acceptance (VP step 6).
  - The branch diff stays inside this plan's scope plus generator-touched files (VP step 7).
  - The fast tier passes on the branch (VP step 8) and the full tier passes and attests HEAD (VP step 9).
verification_plan:
  - step: 1
    phase: pre-deploy
    action: "Precondition: plan and sidecar merged, branch current, T2.47 still not_started on origin/main."
    command: >-
      git fetch origin main --quiet && git cat-file -e origin/main:docs/plans/PLAN-t2-47-complete.yaml &&
      git cat-file -e origin/main:docs/plans/approved/t2-47-complete.yaml && git merge-base --is-ancestor origin/main HEAD &&
      git show origin/main:docs/ROADMAP-PLATFORM.yaml | awk '/^  - id: T2.47$/{f=1;next} /^  - id: /{f=0} f' |
      grep -q '^    status: not_started$' && echo PRECONDITION_OK
    expected: Prints PRECONDITION_OK.
    fix_if: >-
      A missing plan or sidecar means the plan PR has not merged: stop (validate_merge_step fails a build PR that adds the
      sidecar). A failed ancestry test means a stale branch: merge origin/main first. T2.47 already complete on
      origin/main means another change landed it: stop and report to the coordinator.
    hermetic: false
    graduation: not-applicable
  - step: 2
    phase: pre-deploy
    action: The roadmap edit is exactly the approved sidecar, at the approved digest.
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug t2-47-complete --base origin/main
      --expect 550824905152b9f7b430bd674fe19cb3b811872af61287d214db4a27f8dc4f83
    expected: Exit 0. Red before the edit because the head words still equal the base words.
    fix_if: >-
      A word mismatch means the edit drifted from the approved text: restore the sidecar's after text exactly, never edit
      the sidecar. A digest mismatch means the sidecar on origin/main is not the approved one: stop and ask the operator.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A base-relative, one-time binding of this build's diff to its sidecar; validate_merge_step already enforces the
      same binding on the build PR's fast tier.
  - step: 3
    phase: pre-deploy
    action: T2.47 reads complete in compact form with its carriers named and its criteria untouched.
    command: >-
      bin/venv-python -c "import re; from scripts.platform_roadmap_state import load;
      t=[x for x in load('docs/ROADMAP-PLATFORM.yaml').tier_items if x.id=='T2.47'][0];
      assert t.status=='complete', t.status; assert re.fullmatch(r'\d{4}-\d{2}-\d{2}', str(t.completed_at)), t.completed_at;
      assert '\n' not in t.intent and len(t.intent.encode())<280, t.intent;
      assert all(r in t.intent for r in ('rec-4870','rec-4834','rec-4842 to rec-4846')), t.intent;
      assert list(t.files_in_scope)==[] and not t.progress_note, 'compaction';
      assert [(c.id,c.status,c.met_by) for c in t.exit_criteria]==[('c1','met','terraform-recovery-semantics'),('c2','met','t2-47-c2-pending-gated-ordering')];
      print('T247_COMPLETE_OK')"
    expected: Exit 0 and the marker line. Red before the edit (status not_started).
    expected_literals: []
    fix_if: A failed assertion names the field; re-apply that sidecar block verbatim.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      A one-time status closeout; validate_platform_roadmap and check_roadmap_regrowth already guard the roadmap's shape
      and compact form on every run, so a registry row would pin one item's bookkeeping forever.
  - step: 4
    phase: pre-deploy
    action: The edited roadmap passes its schema and integrity check.
    command: >-
      bin/venv-python -c "from scripts.checks.roadmap.validate_platform_roadmap import validate_platform_roadmap as v;
      f=[]; v(f); assert not f, f; print('ROADMAP_VALID')"
    expected: Exit 0 and the marker line.
    expected_literals: []
    fix_if: A finding names the defect; fix the edit to match the sidecar, never the check.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: validate_platform_roadmap is a registered check that runs on every fast and full run.
  - step: 5
    phase: pre-deploy
    action: Every rec the new intent names exists and is open (the carriers of the dropped progress_note).
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common import ducklake_reader_client as c;
      ids=['rec-4870','rec-4834','rec-4842','rec-4843','rec-4844','rec-4845','rec-4846'];
      rows,m=c.fetch_recs_by_ids(c.make_reader(),ids); s={r['id']:r['status'] for r in rows};
      assert not m and all(s.get(i)=='open' for i in ids), (m,s); print('CARRIERS_OPEN')"
    expected: Prints CARRIERS_OPEN.
    fix_if: >-
      A closed carrier is fine only if its work shipped; a missing or declined one means the intent names a dead carrier:
      stop and ask the operator (the wording is approved text).
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: rec-2920 carries the adjudication note and stays open.
    command: >-
      AWS_PROFILE=agent_platform bin/venv-python -c "from src.common import ducklake_reader_client as c;
      r=c.fetch_recs_by_ids(c.make_reader(),['rec-2920'])[0][0];
      assert r['status']=='open' and 'ADJUDICATED 2026-11' in r['context'] and 'PLAN-t2-47-complete' in r['context'], r['status'];
      print('REC_2920_NOTED')"
    expected: Prints REC_2920_NOTED. Red before execution step 2.
    fix_if: Re-run execution step 2's update_rec; never close rec-2920 here (its acceptance is the coherence guard).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: The branch diff stays inside this plan's scope plus generator-touched files.
    command: >-
      bin/venv-python -c "from scripts.checks.verification.validate_scope_boundary import validate_scope_boundary as v;
      f=[]; v(f, plan_paths=['docs/plans/PLAN-t2-47-complete.yaml']); assert not f, f; print('SCOPE_OK')"
    expected: Exit 0 and SCOPE_OK.
    fix_if: An out-of-scope path is a stray edit; revert it. A needed file outside scope is a plan defect (amendment mode).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      A base-relative check on this branch's transient diff; validate_scope_boundary is already a registered check that
      runs on every fast-tier PR run.
  - step: 8
    phase: pre-deploy
    action: The fast tier passes on the branch.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Diagnose and fix on the branch; a failure outside this diff is a red on main, handled per red-main-recovery.yaml.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      scripts.validate is the gate itself and vp-red-before.yaml forbids graduating it (recursion hazard); PR CI runs the
      same fast tier on every push.
  - step: 9
    phase: pre-deploy
    action: Full validation on the committed clean tree (after the commit and the origin/main merge), attested for HEAD.
    command: bin/venv-python -m scripts.validate && bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: Exit 0; --verify-head attests HEAD.
    expected_literals: []
    fix_if: >-
      A dirty_start verdict means the tree was not committed first: commit, then rerun. A failure in scope: fix on the branch, commit, and rerun from the start; never skip a test or relax an assertion. A failure
      outside scope becomes a rec via scripts.ops_data_portal (Decision 59, 55).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
test_obligations:
  - source: docs/ROADMAP-PLATFORM.yaml
    behavior: T2.47 reads complete in compact form with its carrier recs named and its criteria untouched
    verification_step: 2
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug t2-47-complete --base origin/main
      --expect 550824905152b9f7b430bd674fe19cb3b811872af61287d214db4a27f8dc4f83
    waiver_reason: >-
      Roadmap data, not behavior: a one-item status closeout bound word for word by the approved sidecar
      (validate_merge_step) and checked by VP step 3; no code path changes, so no new test applies.
constraints:
  - >-
    Status-Trusted-Never-Inferred (Decision 136; tier-item-lifecycle.yaml bookkeeping_walk): the authority for the flip is
    the operator's request and the approved sidecar, never the criteria alone.
  - Apply the sidecar verbatim (git-ops.yaml approved_text_binding); the only variance is DATE, filled with the build date.
  - completion_compaction (Decision 147) in the same edit; narrative and closeout evidence go to the PR body only.
  - Do not archive T2.47 (Decision 227 clause 4) and do not flip any other tier_item.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout verdict NO_FLAGS. CITE: 147, 227, 136, 181. Decisions triaged: 195 of 195. Roadmap items intersected: 0; CONFLICT: 0; RELATED: 0"
  - "Fork answers (operator, this session): carrier rec for the unrun rehearsals; archive in a later wave; rec-2920 note only, stays open."
  - "Approved text: docs/plans/approved/t2-47-complete.yaml, digest 550824905152b9f7b430bd674fe19cb3b811872af61287d214db4a27f8dc4f83, approved by the operator in planning session 01G2j5RgBpYaA9PQuMDgV8Me."
  - "rec-4870 (filed at planning) carries PLAN-terraform-recovery-semantics VP 11/12 and PLAN-t2-47-c2-pending-gated-ordering VP 11, all unrun."
  - "rec-2523/2461/2647/2648 are closed; the progress_note's claim that they are outstanding was stale."
  - "Also open, report-only: rec-4050, rec-4839 (DEP-11 surface), rec-2920 (coherence guard)."
  - "Report-only roadmap sweep: T2.47 is the only tier_item in either roadmap with every criterion met and a non-terminal status."
  - "Related-work check: red_overlap --plan verdict clear (rec-4866 and rec-4869 open, both disjoint)."
  - "Size headroom: the roadmap is NEAR_CAP (plan_obligations); this edit is its own relief, net -33 lines at 03ac4f9d (4 added, 37 removed) (re-measure at build)."
  - "Unbuilt plans also scoping docs/ROADMAP-PLATFORM.yaml: operator-decision-journal-kind, retire-strategic-plans-and-legacy-executor, retired-repo-identity-sweep, telemetry-capture-hooks, telemetry-producer-admission-plan-review-capture, work-graph-edge-model; whichever builds second rebases."
  - "Commit: roadmap(T2.47): complete -- apply approved closeout (PLAN-t2-47-complete). Plan owner: planning session 01G2j5RgBpYaA9PQuMDgV8Me."
gate_rounds:
  - {gate: decision-scout, round: 1, verdict: NO_FLAGS}
  - {gate: plan-critique, round: 1, verdict: REVISE, blocking: 1, nits: 2}
  - {gate: plan-critique, round: 2, verdict: REVISE, blocking: 2, nits: 2}
  - {gate: wording-check, round: 1, verdict: PASS, digest: 550824905152b9f7b430bd674fe19cb3b811872af61287d214db4a27f8dc4f83, base: 03ac4f9da9b7341e84f776865ddfad313c53f4cb, selection: complete}  # pragma: allowlist secret
pre_implementation_checklist:
  - Branch confirmed not on main
  - docs/PROJECT_CONTEXT.md read
  - only the plan-cited decision sections
  - All files in scope located and readable
  - Acceptance criteria understood and verifiable
execution_steps:
  - "Run VP step 1. Pre: plan PR merged. Post: PRECONDITION_OK."
  - >-
    Apply blocks t247-intent and t247-status of docs/plans/approved/t2-47-complete.yaml to docs/ROADMAP-PLATFORM.yaml,
    verbatim, filling DATE with the build date (ISO). Post: VP steps 2-4 pass. If .secrets.baseline line numbers shift,
    regenerate it with the repo's tool only.
  - >-
    Call ops_data_portal.update_rec('rec-2920', {'context': <current context> + ' ADJUDICATED 2026-11-03: T2.46 complete
    via #1385 (2026-10-02); T2.47 complete via PLAN-t2-47-complete (operator-requested, approved sidecar). Both
    adjudications are done; the remaining deliverable is the status_criteria_coherence guard.'}). Do not change its
    status. Post: VP step 6 passes.
  - "Run VP steps 5, 7 and 8 on the working tree. Post: CARRIERS_OPEN, SCOPE_OK, fast tier exit 0."
  - >-
    CLOSURE, each outcome reported separately: readiness, parent-validator evidence, postflight evidence and the real
    push and PR outcome (implement skill Commit Flows; docs/contracts/git-ops.yaml handoff_sequence):
    bin/venv-python -m scripts.session.github_readiness; commit (the context's commit subject); git fetch origin main
    and merge it (no force-push); VP step 9 (full tier on the committed clean tree, backgrounded with a 2 h limit, then
    --verify-head); write the implementation retrospective with the scripts.session.postflight_evidence.CATEGORIES keys
    and run bin/venv-python -m scripts.session.postflight --evidence on it; push (git push -u origin HEAD as its own
    call); open the PR; subscribe; fresh-context code review, fix every blocking finding; squash-merge on green CI per
    git-ops.yaml push_pr_ci_merge_flow. The PR body carries the closeout evidence (c1/c2 met_by, #1812 55ddbad0, the
    stale progress_note claims, rec-4870 and the open follow-ons) and names, for operator disposition without touching
    them, rec-4050 (likely stale -- it describes the ordering regression #1812 fixed; its acceptance test file does not
    exist) and rec-4839 (open DEP-11 registry-row follow-on not listed in the approved intent).
  - 'Report: what was implemented, verification results, the pushed SHA and PR number'
rollback: Revert the build commit; T2.47 returns to not_started with its progress_note. rec-4870 stays open either way.
