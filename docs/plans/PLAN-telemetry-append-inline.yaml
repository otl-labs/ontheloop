  action: The touched suites pass, the bundle imports cleanly and the import fences hold.
  command: >-
    bin/venv-python -m pytest tests/telemetry tests/turn_capture tests/common/test_ducklake_telemetry_append.py
    tests/common/test_ducklake_telemetry_txn.py tests/common/test_ducklake_telemetry_registration.py
    tests/test_ducklake_maintenance_smoke_handler.py tests/lambdas/ducklake_telemetry_writer tests/ducklake_neon_smoke_test -q && bin/venv-python -m scripts.lambda_manifest
    --check-bundles && .venv/bin/lint-imports
  expected: Exit 0 from all three; the telemetry writer bundle stages and imports its handler; no forbidden import chain.
  fix_if: A broken fence means the adapter is reachable from ducklake_runtime or scripts/ imports src.telemetry.append; remove that edge, never edit .importlinter.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Whole-directory re-runs of suites this plan modifies plus the bundle and import checks, green before and after by design; their standing forms are the fast tier, the full tier's bundle check and validate's import check.
- step: 9
  phase: pre-deploy
  action: Every amended contract passes the contract-drift gate and the size cap.
  command: >-
    bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v;f=[];v(f);assert
    not f, f;print('CONTRACTS_OK')" && bin/venv-python -c "from scripts.checks.structural._classify import effective_lines;n=[effective_lines(open(f).read())
    for f in ('docs/contracts/ducklake_telemetry_writer.yaml','docs/contracts/telemetry_transcripts.yaml','docs/contracts/project-id.yaml','docs/contracts/storage-substrate.yaml')];print(n);assert
    max(n)<=500;print('SIZE_OK')"
  expected: Exit 0, CONTRACTS_OK and SIZE_OK printed.
  fix_if: A missing amendment_log entry or an inconsistent change_class/semantic_break pair -> add or fix the entry; over 500 lines -> compact with content unchanged (Decision 166), never raise.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Duplicates the registered validate_contract_drift check (pre and full tiers) and is diff-relative to the merge base,
    so a standing copy adds nothing.
- step: 10
