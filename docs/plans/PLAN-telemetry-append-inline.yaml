    when the action is not dispatched (never the caller's string). (4) TelemetryRequest.invoke_bytes is computed from the
    event's body field as delivered, before any base64 decoding, as len(json.dumps(body_field)) (ASCII-escaped, an upper
    bound for non-ASCII bodies), beside part 1's request_bytes. (5) The stub's body parse answers 400 bad_request for every
    json.loads failure, RecursionError (deep nesting) and the int-digit-limit ValueError included; if the stub as built
