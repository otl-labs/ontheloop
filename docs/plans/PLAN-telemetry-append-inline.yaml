schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-append-inline
intent: >-
  Telemetry slice 2a-2, plan 3 part 2 (rec-4024 carrier, T2.36): ship append_telemetry, the producer verb, on the
  separate telemetry writer function (agent-platform-ducklake-telemetry-writer) for inline rows into the isolated
  ducklake_smoke catalog. One request carries up to four table batches for one project; the request grammar and every
  contract row rule run before any database work; one transaction registers a first-sight project under part 1's
  counter-row lock and writes every batch with one MERGE each, so an identical re-send is a no-op and a differing row is
  refused with nothing written (Decisions 199, 200, 207, 210). This is the write half slice 3b's producer (rec-4026)
  needs; plan 4's blob route follows and closes rec-4024.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-append-inline.yaml
implementation_declared: true
phase: >-
  T2.36 (telemetry re-lands on DuckLake). Writer-verb work carried by rec-4024; closes no exit criterion (c2 needs a
  producer and the production catalog, 2c; T3.20 c8 needs the hook half, rec-4026). Builds on
  PLAN-telemetry-registration-verbs (#1431) and the three plans merged in #1430.
scope:
- file: src/telemetry/request.py
  action: Create
  purpose: >-
    The plane-neutral append request grammar (stdlib only; imports src.telemetry.timestamps and nothing else from the
    kernel, so the .importlinter turn_capture fence stays open for a producer-side lint; Decision 184 cl.2, Decision 212
    cl.2). parse_append_request(body, shapes) -> AppendRequest(project_ref, component, batches as ordered (table, rows)
    pairs, producer, parser_version). Rules, in this order: no string anywhere in the body (key or value, walked
    iteratively, never recursively) contains a lone surrogate U+D800-U+DFFF, which json.loads accepts but UTF-8 encoding and
    DuckDB binding reject, and no key nor the project_ref, component or any row's producer contains U+0000, which a
    Postgres-backed DuckLake catalog cannot carry in the file-pruning SQL it renders from those values (a local Postgres
    16 repro raised an unmapped ParserException; NUL inside other free-text values commits safely, its stats going NULL,
    and stays accepted) (bad_request, reason invalid_unicode, position only); body keys within the allowlist {action, project_ref,
    component, batches} (so catalog, meta_schema, data_path, tenant_id and project_id are refused with no denylist);
    project_ref a non-empty str; component optional, default 'unknown', else ^[a-z][a-z0-9_-]{0,63}$; batches a non-empty
    list of objects with exactly the keys table and rows (a malformed batch is bad_request); table in the closed set the
    shapes name, each at most once; GENERATION_MARKER_TABLE telemetry_sessions last when present (write_order: inside one
    transaction batch order has no visibility effect, so the rule is a producer tripwire for the cross-request R7 order,
    telemetry-event-envelope.yaml R7); rows a
    list of objects; at least one row in the request; every present producer and parser_version value identical across
    the request (mixed_producer; envelope R1). Two temporary rules owned by rec-4024 and removed by plan 4 live here so
    every plane refuses alike (Decision 210 cl.5; decision scout): a row carrying the table's content-rule uri column is
    refused (bad_request, reason blob_route_unavailable), and while the table's inline_within_threshold exemption exists an
    inline content whose UTF-8 length exceeds the contract threshold is refused (payload_too_large, rule
    inline_within_threshold, the threshold number). Then every present TIMESTAMP WITH TIME ZONE column is decoded with
    parse_wire_timestamp into new row dicts (schema_gate, reason wire_timestamp, for a TimestampError and for the
    OverflowError a range-edge value with an offset raises, e.g. 9999-12-31T23:59:59.999-23:59). TableShape.from_spec reads an
    EventTableSpec-shaped object through a local typing.Protocol, never an import of src.telemetry.append, not even under
    TYPE_CHECKING (import-linter counts those edges: .importlinter sets no exclude_type_checking_imports): timestamp
    columns, the content rule's inline and uri columns, and the threshold only while exempt. A test pins the module's
    imports to the stdlib and src.telemetry.timestamps. RequestError(ValueError) carries error_type, table, row, column,
    rule, reason and threshold, and its message names only those, never a value; an undeclared name the caller sent (an
    unknown body key, table or column) is never carried, only its reason and position.
- file: src/telemetry/gate.py
  action: Modify
  purpose: >-
    Value-free structured kernel errors (Fable consult part 2 Q3). GateError gains keyword-only table, row, column and
    reason, default None. The closed reason tokens (unknown_column, derived_column, type, range, not_null, required_ref,
    invalid_ref, time_range, grain_key_null) are defined here and used by gate.py and append.py; every raise site in this
    module passes column and reason, except that unknown_column carries column None (the caller's undeclared key is never
    echoed into a body or log; the message may keep naming it for in-process callers); the BIGINT range and
    non-finite DOUBLE messages stop echoing the value, and the DOUBLE branch turns the OverflowError float() raises for an
    over-large JSON integer into GateError(column, reason range). RowRuleGateError(GateError) adds rule and is built from a
    RowRuleError (table, rule, column). GrainConflictError gains table, event_id and row; collapse_or_reject_duplicates
    sets event_id and the 0-based index of the second conflicting row. Existing pinned message texts keep matching.
- file: src/telemetry/append.py
  action: Modify
  purpose: >-
    _derive_row raises RowRuleGateError from the RowRuleError (the __cause__ pin in test_name_rule_ducklake_integration.py
    stays true). Its three own GateError raises pass column and reason: session_started_at missing (append.py:176, not_null),
    a required ref field missing (:182, required_ref, the ref field), external_ref or event_timestamp missing (:190,
    not_null, the missing column). It wraps the IdentityError raised by derive_entity_key / derive_event_id into GateError,
    value-free and `from exc`: reason time_range naming session_started_at (entity keys) or event_timestamp (event_id) when
    exc.__cause__ is a TimestampError (identity.py:120-123 converts a pre-epoch or out-of-range time basis that way), else
    invalid_ref naming the ref field; today these escape prepare_batch unmapped and echo the input, against its docstring.
    prepare_batch fills table and the row's 0-based index
    into a GateError or GrainConflictError lacking them; PreparedBatch gains source_index (event_id -> first index as sent);
    execute_prepared parses event_id from its own TELEMETRY_GRAIN_CONFLICT token and raises GrainConflictError(table,
    event_id, row) (event_id and row None if the parse misses, never a mapping failure). The pinned message substrings
    (tests/telemetry/test_prepare.py:63-90) keep matching.
- file: src/common/ducklake_telemetry_append.py
  action: Create
  purpose: >-
    The append adapter, imported only by the telemetry writer's edge (never by ducklake_runtime's closure or scripts/: the
    scripts-never-import-telemetry-append fence). append_request(con, request, *, tenant_id, specs, semantics, now=None,
    metric_sink=None) -> AppendOutcome(tenant_id, project_id, project_registration created|existing, per-table
    AppendResult, occ_retries, commit_ms). project_id from part 1's project-binding cache, else part 1's lookup_project
    before any transaction; on a miss whose purpose_for(project_ref) is not real, TelemetryRequestError(403,
    project_unregistered, {remedy: register_project}) before any transaction (project-id.yaml reserved namespace). now
    minted once, and part 1's registration identity (the ULIDs resolve_or_register_project takes) minted once, both outside
    the retry loop (Decision 81 cl.3; part 1's registration row). prepare_batch for every batch BEFORE BEGIN with the known
    id or SENTINEL_PROJECT_ID ('0' * 26), so a 422 or an in-batch 409 never opens a transaction (verdicts do not depend on
    the id; Fable consult part 2 Q2); an in-batch GrainConflictError raised under the sentinel has its event_id set to
    None before it propagates (that id can never exist in storage; the row index stays the locator). Then one
    run_telemetry_txn (part 1; terminal classes re-raise before is_occ_collision) whose body: on a miss,
    resolve_or_register_project(explicit=False) under the counter-row lock; re-runs prepare_batch only when the resolved id
    differs from the prepared one; asserts every prepared row's project_id equals the resolved id (the sentinel never
    reaches a MERGE); execute_prepared per batch in request order. The binding enters part 1's cache only after
    run_telemetry_txn returns. The append path passes run_telemetry_txn a recording metric sink, so OccRetryCount and
    CommitLatencyMs travel in the C6 line's EMF block rather than as PutMetricData calls on the hot path. Never logs or
    returns a row value or principal.ref. 2026-10-14 amendment (fix-forward; the file exists on main): AppendOutcome
    gains masked_commit_retries from TxnOutcome.
- file: src/common/ducklake_telemetry_txn.py
  action: Modify
  purpose: >-
    2026-10-14 amendment (part 1's module; the loop every telemetry verb shares). The writer role has no s3:DeleteObject
    by design (orphan deletion belongs to the maintenance role), so when DuckLake aborts a commit it cannot remove the
    files the transaction wrote, and COMMIT raises duckdb's TransactionException "TransactionContext Error: Failed to
    commit: Could not remove file ...: Forbidden" in place of the original cause (a lost race on the counter-row lock,
    seen live on append_telemetry and provision_telemetry 2026-10-14). A new pure predicate, is_masked_commit_failure(exc):
    type(exc).__name__ == "TransactionException" (no duckdb import) and str(exc).lower() contains "failed to commit:
    could not remove file"; never a bare "forbidden" match, never every TransactionException. run_telemetry_txn retries
    it only when raised by the COMMIT statement (a flag set immediately before COMMIT; the same text from a body
    statement propagates), after the terminal
    classes and inside the same attempt budget and backoff as an OCC collision, because every telemetry body is
    idempotent (insert-only MERGE, lookup-first registration, caches written after commit), not because the cause is
    known to be a conflict. TxnOutcome gains masked_commit_retries (int, default 0, a subset of occ_retries).
    Exhaustion raises TelemetryOCCRetryExhaustedError(OCCRetryExhaustedError), defined in this module (ducklake_writes.py
    is not touched), carrying reason ("occ" or "masked_commit", the last attempt's class) and masked_commit_retries; its
    message stays the existing fixed text; it chains from exc for an OCC collision as today, and for a masked failure it
    is raised after the except block has exited, so both __cause__ and __context__ are None and the bucket-naming text
    is not reachable from the exhaustion error; the handler's isinstance row still maps it to 503 occ_exhausted. The masked message is never logged, formatted or returned; only the count travels.
    ducklake_writes.is_occ_collision is unchanged (the shared writer has Delete; a blanket TransactionException match
    would also absorb DuckLake's own retry-exhaustion and metadata failures, which must stay loud).
- file: src/lambdas/ducklake_telemetry_writer/telemetry_edge.py
  action: Create
  purpose: >-
    Lambda-only transport policy and the verb body. MAX_INVOKE_BODY_BYTES 5 MiB (5242880) measured on
    TelemetryRequest.invoke_bytes, the body re-escaped as a JSON string (len(json.dumps(raw_body))): Lambda's 6 MiB
    synchronous limit applies to the invocation event, in which the body is so escaped, plus about 2.2 KB of envelope, so a
    raw 6.2 MB escape-free body passes while a 3.2 MB quote-dense one is refused by AWS before the handler (measured
    2026-10-09, /mnt/project-files/telemetry-slice2/evidence-invoke-payload-limit.md); the producer chunks on the same
    measure, len(json.dumps(S)) with S the exact request body string sent (relayed to rec-4026). MAX_ROWS_PER_TABLE 2000 and MAX_ROWS_PER_REQUEST 5000. Each a TelemetryRequestError
    413 (payload_too_large naming the measure / too_many_rows) checked before the kernel parse (rows counted only in
    well-formed batches; a malformed shape is left to the kernel's 400). Event specs and table shapes built lazily on the
    first call and cached per
    container from the bundled
    field_semantics.yaml. action_append_telemetry(request, con, deps): caps, parse_append_request (a RequestError becomes
    TelemetryRequestError with its status by error_type: bad_request / write_order / mixed_producer 400, payload_too_large
    413, schema_gate 422, and its value-free fields), tenant from part 1's tenant cache, else lookup_tenant on
    request.principal and cached after the read (Decision 88 cl.1(ii); missing -> 403 tenant_unresolved, remedy
    register_tenant), append_request, then the response {ok, tenant_id, project_id,
    project_registration, tables: {table: {submitted, collapsed, inserted}}, occ_retries, commit_ms as an integer}.
    describe_entry()
    gives the verb's description, params_schema and the three caps. 2026-10-14 amendment (fix-forward; the file exists on main): action_append_telemetry copies
    AppendOutcome.masked_commit_retries into stats.masked_commit_retries; the response body is unchanged (occ_retries
    stays the total retry count).
- file: src/lambdas/ducklake_telemetry_writer/telemetry_log.py
  action: Create
  purpose: >-
    C6 (REVIEW.md C6): emit_request_line(action, status, error_type, request, body) prints ONE JSON line to stdout for every
    request the handler answers: verb, component (from the body only when it matches request.py's component grammar,
    for every verb, else 'unknown'), status, error_type,
    per-table submitted and inserted, request_bytes, invoke_bytes, tenant_id, project_id, occ_retries, commit_ms,
    connect_reused and
    caller_role (CallerPrincipal.role_name only). Never an account id, an ARN, a hash of either (Decision 101;
    ops_tenants.yaml:63-72) or a row value. For the five data verbs (append_telemetry, register_tenant,
    register_project, provision_telemetry, telemetry_probe) the line carries a CloudWatch Embedded Metric Format _aws
    block: namespace DuckLakeTelemetryWriter, metric RequestCount with dimension set [Verb] (five series; operator
    accepted the spend 2026-10-08; no component dimension), with the EMF target members `Verb` and `RequestCount` (value
    1) at the line's top level beside the lowercase verb field; an append_telemetry line also carries the recording sink's
    OccRetryCount and CommitLatencyMs under an empty dimension set (the series part 1's sink already creates, so no new
    series), but that directive and its members appear only when the sink recorded values (a pre-BEGIN 422 or a 409
    records none, and a directive without its members would invalidate the block and drop RequestCount too). Every
    millisecond value in the line is an integer and every ratio has 3 decimal places (a raw float repr can carry a
    12-digit run that a leak scan would misread). 2026-10-14 amendment: RequestStats gains masked_commit_retries: int |
    None = None and the line carries it (the edge sets it from AppendOutcome; the handler sets it from a
    TelemetryOCCRetryExhaustedError on a 503), else null. It is a log field only: never passed to a metric sink, no EMF
    member, no series. Part 1's other verbs log null except on a masked-caused 503 (the handler copies the count from
    the exhaustion error for any verb); their successful masked retries count only inside part 1's existing
    OccRetryCount PutMetricData series, which now counts every retry of either kind. describe and attach_check get the line without the block. append_telemetry makes no PutMetricData call; part
    1's other verbs keep their sink; ducklake_metrics.py is unchanged.
- file: src/lambdas/ducklake_telemetry_writer/handler.py
  action: Modify
  purpose: >-
    (1) Dispatch append_telemetry (connectionful, through the pinned warm-connection opener), and describe gains
    telemetry_edge.describe_entry(). (2) Error-map rows, most specific first and before part 1's DuckLakeRuntimeError
    row: RowRuleGateError -> 422 row_rule {table, row, rule, column, exclude_before from the spec's rules};
    GateError -> 422 schema_gate {table, row, column, reason}; GrainConflictError -> 409 grain_conflict {table, event_id,
    row}; bodies built from attributes only, never str(exc). (3) The response builder calls telemetry_log.emit_request_line
