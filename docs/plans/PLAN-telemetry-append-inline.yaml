  fix_if: Fix the named check at its root cause (Decision 55); never raise a budget, skip a check or weaken an assertion.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
- step: 11
