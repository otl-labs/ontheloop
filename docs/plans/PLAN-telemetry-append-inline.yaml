constraints:
- >-
  Built on main at or after PLAN-telemetry-registration-verbs' implementation: if ducklake_telemetry_txn.py,
  ducklake_telemetry_registration.py, telemetry_actions.py or the part 1 gate vectors are missing, STOP and report.
- >-
  append_telemetry lives only on agent-platform-ducklake-telemetry-writer. Do not touch the shared writer, VERB_REGISTRY,
  ducklake_writer.yaml, ducklake_writes.py or ducklake_scd2_schema.py; reuse helpers by import.
- >-
  No Terraform, no IAM change, no workflow change. EMF metrics use namespace DuckLakeTelemetryWriter: RequestCount by
  Verb for the five data verbs (the accepted spend), plus append_telemetry's OccRetryCount and CommitLatencyMs with no
  dimensions when recorded (existing series); no component dimension and no other new series.
- >-
  Nothing in ducklake_runtime's import closure, and nothing under scripts/, may import a module that imports
  src.telemetry.append (.importlinter scripts-never-import-telemetry-append). request.py imports only
  src.telemetry.timestamps from the kernel.
- >-
  Public repository (Decision 101): no account id, ARN, host or hash of any of them in code, fixtures, logs, responses
  or gate output; no caller row value in any response body or log line. Tests build account-shaped strings at runtime.
- 'One rule source (Decision 210 cl.3): the 64 KiB threshold and its exemption are read from the bundled projection, never a literal.'
- >-
  Keep every new module and every file this plan grows (test_append.py at 440 SLOC, the telemetry writer handler, its
  tests, lambda_telemetry_gates.py) under 500 SLOC; decompose rather than raise a budget (Decision 128).
- 'No producer change: rec-4026 (slice 3b, parser_version 3) owns the producer and its chunking on len(json.dumps(S)) <= 5 MiB, S the exact body string sent.'
- 'Real DuckLake tests are never skipped or dropped for environment limits (rec-4071; Benjamin 2026-09-25).'
- >-
  The implementation merge redeploys every DuckLake function, so it waited for Benjamin's explicit word. Since his
  2026-10-14 message (cmsg_012XgaFy8VaDQbxP5D8nC9588rE3MxHqZ9YY2vtDVY2Rpr, CI-reviewed deploys should not wait on him)
  and the deploy rule as recorded in project memory, a CI-run DuckLake deploy merges on code review PROCEED and green
  CI unless it also carries IAM or security, spend, Class A contract or Decision text, public-surface artefacts or a
  manual or admin step; the 2026-10-14 fix-forward carries none of those (its contract is
  the Class B ducklake_telemetry_writer.yaml).
- No rescue agents or workaround loops (Decision 55).
