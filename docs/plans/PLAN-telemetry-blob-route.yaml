schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-blob-route
intent: >-
  Telemetry slice 2a-2, plan 4 (closes rec-4024, T2.36): make a transcript payload above 64 KiB storable through the
  claim-check route on the separate telemetry writer function, smoke catalog only. A new begin_blobs verb answers each
  content-addressed item with existed or a writer-issued, 15-minute presigned S3 PUT bound to the payload's SHA-256 and
  length; append_telemetry derives content_uri itself and HEAD-verifies the object before the row commits; the interim
  inline-size exemption is removed so inline content above 64 KiB is the kernel's 422; describe advertises the blob
  protocol and a caller-facing schema view as slice 3b's capability handshake; and a stdlib producer helper, first used
  by the deploy smoke gate, is what 3b's hook imports. Telemetry payloads are the learning signal (PROJECT_CONTEXT);
  without this route a large tool output would halt capture for its whole session.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-blob-route.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake). Closes T2.36:c4 (the claim-check route is proven not to be staging, with a
  standing structural guard). c1, c2 and c5 move to the 2c follow-on rec and c3 to the 2b follow-on rec. Builds on
  PLAN-telemetry-registration-verbs (#1431, #1434) and PLAN-telemetry-append-inline (#1433).
scope:
- file: src/telemetry/blobs.py
  action: Create
  purpose: >-
    The plane-neutral blob protocol shared by the writer and the producer (stdlib, src.telemetry.timestamps and
    src.telemetry.request only; never append, gate or identity, so scripts/ and src.telemetry_client may import it).
    BLOB_PROTOCOL_VERSION 1, GRANT_TTL_SECONDS 900, MAX_BLOB_ITEMS 200. parse_begin_blobs_request(body, *, threshold,
    cap) -> BeginBlobsRequest(project_ref, component, items) with keys within {action, project_ref, component, items};
    items a non-empty list of objects with exactly {session_ref, session_started_at, content_sha256, content_bytes};
    session_ref a non-empty str; session_started_at decoded by parse_wire_timestamp; content_sha256 ^[0-9a-f]{64}$;
    content_bytes an int with threshold < n <= cap (bad_request, reason below_threshold / above_cap, the bound named);
    more than MAX_BLOB_ITEMS items is error_type too_many_blobs (413), the same token append_telemetry answers. Errors are request.RequestError with the
    item index as row and the field as column, never a value; the lone-surrogate and NUL walk request.py applies runs
    here too. sha256_hex_to_b64(hex) and its inverse. Two predicates, each the single definition of its rule:
    spill_item(row, threshold) (a producer row whose content's UTF-8 length exceeds the threshold becomes an item) and
    blob_row(row, threshold, cap) (a writer row with no content, no content_omitted_reason, a well-formed digest and
    threshold < content_bytes <= cap). threshold and cap always come from the caller (the bundled projection on the
    writer, describe on the producer), never a literal (Decision 210 cl.3).
- file: src/telemetry/request.py
  action: Modify
  purpose: >-
    Removes part 2's two temporary rec-4024 rules: the inline_within_threshold 413 and TableShape's threshold-while-
    exempt plumbing go, so the kernel's row rule owns the size leg (422 row_rule inline_within_threshold). A
    caller-sent content_uri stays refused (bad_request), its reason renamed from blob_route_unavailable to
    writer_derived, because the writer derives content_uri after verification.
- file: src/telemetry_client/__init__.py
  action: Create
  purpose: >-
    Package marker and docstring only: the producer-side transport plane (agreed with the slice 3b thread, 2026-10-12).
    Stdlib only plus src.telemetry.blobs, request and timestamps; it may touch the network; it reaches the write
    boundary only through a transport callable its caller injects. 3b adds its own modules here.
- file: src/telemetry_client/blob_delivery.py
  action: Create
  purpose: >-
    The helper 3b's hook imports; the --lambda-telemetry gate is its first user. protocol_from_describe(body) ->
    BlobProtocol(version, inline_threshold_bytes, cap_bytes, max_items), raising HandshakeError when blob_protocol is
    absent or its version is not 1. deliver_blobs(rows, *, project_ref, invoke, protocol, component='unknown',
    max_workers=4, put=None) -> Delivery(wire_rows, existed, uploaded): rows are wire-form transcript dicts; each
    spill_item row is re-hashed (a digest or length mismatch is a defect before any call); items are chunked by
    max_items and sent as begin_blobs through invoke(payload) -> (status, body); each granted entry without
    duplicate_of is PUT once with urllib (Content-Type application/octet-stream, the grant's headers exactly, no other
    x-amz-* header, 120 s timeout, bounded parallelism); the returned rows have content removed from every spilled
    row. Idempotent. BlobDeliveryError(kind refused | defect | transient | proxy, status, s3_code) never carries a URL,
    key or payload: begin_blobs 400/403 refused; begin_blobs 500 defect with no retry (a typed 500 paging fault; a 502 is a runtime-level defect); 429 (the function's reserved concurrency is 5), 503 or a transport error retried 3 times with backoff then
    transient; PUT 403
    triggers one grant re-request then refused; PUT 400 (BadDigest, InvalidDigest, IncompleteBody) defect; PUT 5xx or
    timeout retried 3 times then transient; a 403 or 407 whose body is not S3 XML is proxy.
