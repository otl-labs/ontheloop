  telemetry_edge.py, telemetry_log.py, the part 2 vectors or the shared fakes are missing, STOP and report.
- >-
  Telemetry only: no change to the shared writer, VERB_REGISTRY, ducklake_writer.yaml, ducklake_writes.py,
  ducklake_runtime.py or ducklake_scd2_schema.py. No Terraform, no IAM, no workflow change.
- >-
  The writer never puts, reads or deletes blob bytes; its S3 calls are head_object, generate_presigned_url
  ('put_object') and the probe's list_objects_v2 only. No multipart, ever.
- >-
  Public repository (Decision 101): no presigned URL, X-Amz-* credential value, key, digest, account id, ARN or host in
  any log line, gate output, exception or fixture; tests build credential-shaped strings at runtime.
- 'One rule source (Decision 210 cl.3): the threshold and cap come from the bundled projection on the writer and from describe on the producer.'
- >-
  One new billed metric series only: RequestCount for Verb begin_blobs in namespace DuckLakeTelemetryWriter (Benjamin
  accepted 2026-10-12); no component dimension and no other new series.
- >-
  Nothing in ducklake_runtime's import closure, and nothing under scripts/, may import a module that imports
  src.telemetry.append; src.telemetry_client imports only the stdlib and src.telemetry.{blobs, request, timestamps}.
- >-
  Keep every module and test file this plan creates under 500 SLOC by decomposing (Decision 128). If a file an earlier
  plan grows (handler.py, telemetry_edge.py, telemetry_log.py, ducklake_telemetry_append.py, their tests,
  tests/telemetry/test_append.py at 440 of 500 on main) would exceed 500, STOP and return to /plan: a decomposition
  there is outside this scope, and a budget raise is never the fix.
- 'Real DuckLake tests are never skipped or dropped for environment limits (rec-4071).'
- The implementation merge redeploys every DuckLake function, so it waits for Benjamin's explicit word.
- No rescue agents or workaround loops (Decision 55).
