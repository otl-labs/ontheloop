    src.telemetry.identity. No existing contract changes.
- file: src/common/ducklake_telemetry_blobstore.py
  action: Create
  purpose: >-
    The content_blobs port's s3 adapter (ports.yaml). boto3 and botocore are imported only inside make_s3_client, so
    the module imports in the fast tier; errors are classified from the botocore error shape (Error.Code,
    ResponseMetadata.HTTPStatusCode) and exception class names. make_s3_client(region): Config(signature_version
    s3v4, s3 addressing_style virtual (the regional virtual-hosted endpoint), retries standard, short connect and read
    timeouts, max_pool_connections 32 so the 16-way fan-out never churns the pool). BlobRoot.from_env(blob_root, data_path, meta_schema): s3://<bucket>/telemetry-blobs/<meta_schema>/ only,
    disjoint from the catalog data path, else DuckLakeRuntimeError at first use (never at import). S3BlobStore:
    verify(content_uri, sha_hex, size, *, now) -> verified | missing | stale | mismatch from one head_object with
    ChecksumMode ENABLED (ContentLength and ChecksumSHA256 both equal, else mismatch, an absent checksum included;
    LastModified older than BLOB_COMMIT_MAX_AGE_DAYS 7 is stale). Missing never rests on the 404-versus-403 premise
    (S3 answers 404 for an absent key only when the caller holds ListBucket, and whether a prefix-conditioned grant
    counts in a HEAD request's context is unprobed): a 404 is missing; a 403 is followed by one list_objects_v2 with
    Prefix the exact key and MaxKeys 1 through the role's prefix-conditioned List, absent -> missing, present ->
    BlobStoreAccessError. grant_put(content_uri, sha_hex, size) -> Grant(url, headers, expires_at) from
    generate_presigned_url('put_object', ContentLength, ChecksumSHA256, ExpiresIn 900), then a self-check that
    X-Amz-SignedHeaders is exactly content-length;host;x-amz-checksum-sha256, X-Amz-Security-Token is present and no
    query parameter starts with x-amz-checksum- or x-amz-sdk-checksum (the botocore 1.36 default-checksum regression
    shape), else BlobGrantSelfCheckError; count_objects(prefix) for the probe (list_objects_v2 under the session
    prefix). Throttling, a 5xx or a timeout after botocore's retries is BlobStoreUnavailableError; any other client
    error is BlobStoreAccessError, never missing. The writer never puts, reads or deletes object bytes. No function
    logs or returns a URL beyond the Grant object.
- file: src/common/ducklake_telemetry_blobs.py
  action: Create
  purpose: >-
    The verb core and the append hook. content_uri_for(tenant_id, project_id, session_ref, session_started_at, sha):
    '<tenant>/<project>/<session_id>/<sha256>' with session_id from identity.derive_entity_key under
    KEY_PLANS['telemetry_transcripts']['session_id'], so it equals the session_id prepare_batch derives.
    begin_blobs(con, request, *, tenant_id, store, semantics, metric_sink=None) -> BeginBlobsOutcome: the project from
    part 1's binding cache, else lookup_project; on a miss a reserved ref is 403 project_unregistered before any S3
    call, else resolve_or_register_project(explicit=False) in its own run_telemetry_txn, the binding cached after it
    returns and every key built from the committed id; items deduplicated by content_uri; bounded parallel verify (16
    workers); verified -> existed, missing, stale or mismatch -> a grant (a mismatch is counted, never silent);
    counters items, distinct_keys, existed, granted, mismatched, stale, declared_bytes_total, declared_bytes_max,
    head_ms. For append: attach_blob_uris(rows, *, tenant_id, project_id, threshold, cap) sets content_uri on every
    blob_row (pure); verify_blob_rows(rows, *, store, now) runs the bounded parallel HEADs and returns the unverified rows (missing or
    stale) with their reasons; BlobStoreUnavailableError -> TelemetryRequestError(503, blob_store_unavailable);
    mismatch -> BlobIntegrityError (unmapped). require_stored(con, catalog, unverified_rows), run inside the
    transaction body only when an unverified row exists: one partition-bounded read of which of those rows'
    (producer, event_id, parser_version) are already stored; any that is not -> TelemetryRequestError(422,
    blob_not_verified, {table, row, reason missing | stale}). So an object is newly referenced only when it is present
    and younger than 7 days, while an identical re-send of a stored row stays a no-op whatever the object's age or
    presence (Decision 210 cl.1, Decision 207); the append verb never demands a re-upload for a stored row, but
    begin_blobs re-grants any missing object, so a producer's re-send restores an object an erasure deleted (recorded
    on rec-4029).
    Never logs a key, digest, URL or value.
