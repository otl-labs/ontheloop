bundled_recommendations:
- rec-4024
followon_recs:
- rec-4291
- rec-4292
closes_criteria:
- T2.36:c4
infrastructure_dependencies:
- >-
  No Terraform, no IAM and no workflow change. The telemetry writer role already holds s3:GetObject and s3:PutObject on
  telemetry-blobs/<meta_schema>/* and the prefix-conditioned ListBucket (TelemetryBlobReadWrite, TelemetryBlobList,
  #1425/#1442), with no Delete; the bucket is versioned, SSE-S3 (no KMS header to sign) and HTTPS-only, and
  telemetry-blobs-noncurrent-reclaim covers the prefix. Presigned PUTs carry the role's own session credentials, so
  producers need no S3 grant.
- >-
  Ordering: this implementation starts only after PLAN-telemetry-append-inline is implemented and deployed with its
  live gate green, and merges only on Benjamin's explicit word (the merge redeploys every DuckLake function through
  deploy-ducklake-lambdas.yml; src/telemetry/** and src/common/ducklake_*.py are push paths; Decisions 79/125/126).
- >-
  LAMBDA-DEPLOY DEFERRED for data-pipeline: its manifest gains excludes only and docs/ROADMAP-PLATFORM.yaml is an asset
  edit; zip contents are otherwise unchanged, refreshed at its next governed deploy.
acceptance_criteria:
- >-
  begin_blobs answers each in-bound item with existed (a verified object under the catalog-scoped blob root) or a
  15-minute presigned PUT whose signed headers are exactly content-length, host and x-amz-checksum-sha256; a first-sight
  non-reserved project_ref is registered once and its committed id keys every grant; out-of-bound items, an item cap
  breach and reserved refs are refused with typed, value-free errors.
- >-
  append_telemetry stores a transcript row above 64 KiB with content NULL and the writer-derived content_uri only after a
  HEAD proves the object's size and SHA-256; an unknown-project blob row answers 422 blob_not_verified before any S3 call;
  a missing object, or one older than 7 days, commits only as the no-op of an identical stored row (else 422
  blob_not_verified, reason missing or stale, and nothing from the request is written), so an identical re-send inserts
  nothing whatever the object's age or presence; a caller
  content_uri is 400; inline content above 64 KiB is 422 row_rule inline_within_threshold.
- >-
  A size or checksum mismatch, a grant failing its signed-header self-check, or an S3 client error other than
  throttling, a 5xx or a timeout (those answer 503), including a HEAD denied for an object the exact-key list shows
  present, emits the C6 line with status 500
  and answers a typed 500, so the alarm pages through Url5xxCount; a HEAD denied for a key the list
  shows absent is missing.
- >-
  describe advertises blob_protocol version 1 and a per-table schema view derived from the bundled projection; the
  producer helper delivers rows through it and is what the smoke gate uses.
- >-
  No log line, response other than begin_blobs' own, gate output or exception carries a presigned URL, an X-Amz-*
  credential name, a key, a digest, an account id or an ARN; begin_blobs' C6 line carries counts, declared bytes and
  the RequestCount EMF block.
- >-
  T2.36 c4 holds against the new write path: no active ops-outbox writer or VarChar-coercion surface exists; no
  DuckLake bundle reads S3 objects into the catalog (no object-read call outside the named get_blob seam and no SQL
  read of s3:// into a table); the telemetry writer's S3 calls are HEAD, presign-PUT and List only; and the c2 and c4
  texts name the claim-check route.
- >-
  After the governed deploy of the merge commit every blob vector passes in CI and in an independent PlatformDev run
  (if this session's proxy refuses the S3 endpoint, that run is recorded as environment-blocked with the proxy status
  and the CI gate stands as the route's evidence), and the function's AWS/Lambda Errors and Url5xxCount metrics are both zero since the deploy.
