- step: 7
  phase: pre-deploy
  action: The amended writer contract passes the contract-drift gate, the size cap and its own contract tests.
  command: >-
    bin/venv-python -c "from scripts.checks.contracts.validate_contract_drift import validate_contract_drift as
    v;f=[];v(f);assert not f, f;print('CONTRACTS_OK')" && bin/venv-python -c "from scripts.checks.structural._classify
    import effective_lines;n=effective_lines(open('docs/contracts/ducklake_telemetry_writer.yaml').read());print(n);assert
    n<=500;print('SIZE_OK')" && grep -c 'size_mismatch' docs/contracts/ducklake_telemetry_writer.yaml && bin/venv-python
    -m pytest tests/checks/contracts/test_telemetry_blob_contracts.py::test_writer_contract_carries_begin_blobs_and_the_claim_check
    tests/checks/contracts/test_telemetry_blob_contracts.py::test_commit_age_matches_the_contract -q
  expected: >-
    Exit 0, CONTRACTS_OK and SIZE_OK printed, size_mismatch appears in the contract, and both contract-test nodes pass.
  expected_literals: []
  fix_if: A drift finding, a contract over the cap, or no size_mismatch in the contract.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    The contract-drift and size checks already run in both tiers, and both contract-test nodes stay in the live
    telemetry-blob-contracts check (claim-additive edits). The grep only proves the edit landed and has no standing value
    as a regression guard.
- step: 8
  phase: pre-deploy
  action: Fast tier, then the full tier on the committed, rebased, clean tree before handoff (Decision 163).
  command: >-
    bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
    scripts.checks.validation_result --verify-head
  expected: Exit 0 on a completed full run and the head verified; a timeout is not a pass.
  expected_literals: []
  fix_if: Any failure; fix the cause, never weaken a check.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Invokes scripts.validate (the recursion refusal); the tiers are their own standing guard.
- step: 9
  phase: post-deploy
  action: >-
    The governed deploy of the merge commit succeeded, with every job included. Read it with mcp__github__actions_list
    (deploy-ducklake-lambdas.yml runs for head_sha = the merge commit) and save that run's jobs JSON to
    $DEPLOY_JOBS_JSON.
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));jobs={x['name']:x.get('conclusion')
    for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke'];assert
    all(any(n.startswith(w) and c=='success' for n,c in jobs.items()) for w in want),jobs;print('DEPLOY_OK')"
  expected: Every named job concluded success (a skipped job fails this step), then DEPLOY_OK.
  fix_if: A failed or skipped job; read its log and fix forward, never re-run to green without a cause (Decision 55).
  hermetic: false
- step: 10
  phase: post-deploy
  action: >-
    The CI smoke job ran the size-mismatch vector and every earlier blob vector. Save the smoke job's log
    (mcp__github__get_job_logs) to $SMOKE_LOG_FILE.
  command: >-
    test -s "$SMOKE_LOG_FILE" && for m in TELEMETRY_BLOB_PROTOCOL_OK TELEMETRY_BLOB_DELIVERED_OK
    TELEMETRY_BLOB_RESEND_EXISTED_OK TELEMETRY_BLOB_UNVERIFIED_OK TELEMETRY_BLOB_SIZE_MISMATCH_OK
    TELEMETRY_BLOB_S3_REJECTS_OK TELEMETRY_BLOB_BOUNDS_OK TELEMETRY_BLOB_AUTOREGISTER_OK; do grep -q "$m" "$SMOKE_LOG_FILE"
    || { echo "missing $m"; exit 1; }; done && echo SMOKE_MARKERS_OK
  expected: All eight markers, then SMOKE_MARKERS_OK.
  fix_if: A missing marker; the gate fails loudly on the vector that diverged, so read the line it printed.
  hermetic: false
- step: 11
  phase: post-deploy
  action: >-
    An independent live run of the gate from this session as PlatformDev, through the session's HTTPS proxy. This keeps
    the evidence from resting on the CI log alone.
  command: >-
    DUCKLAKE_TELEMETRY_WRITER_URL=$(aws ssm get-parameter --profile agent_platform --region eu-west-2 --name
    /agent-platform/ducklake/telemetry_writer_url --query Parameter.Value --output text) AWS_PROFILE=agent_platform
    bin/venv-python -m scripts.ducklake_neon_smoke_test --lambda-telemetry > "${TMPDIR:-/tmp}/telemetry_blob_size_gate.out"
    2>&1 && grep -q TELEMETRY_BLOB_SIZE_MISMATCH_OK "${TMPDIR:-/tmp}/telemetry_blob_size_gate.out" && echo LOCAL_SIZE_GATE_OK
  expected: Exit 0, then LOCAL_SIZE_GATE_OK.
  fix_if: >-
    A proxy block (the helper's kind=proxy) is an environment limit to report with its output, not a pass; any other
    failure is the writer's.
  hermetic: false
- step: 12
  phase: post-deploy
  action: >-
    The writer logged the gate's size-mismatch refusals as 422 blob_not_verified, and logged no status-500 line after the
    deploy, which would have paged.
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import datetime as d,json,os,boto3;b=boto3.Session(profile_name='agent_platform',region_name='eu-west-2');jobs=json.load(open(os.environ['DEPLOY_JOBS_JSON']));jobs=jobs.get('jobs')
    if isinstance(jobs,dict) else jobs;t=d.datetime.fromisoformat([x['completed_at'] for x in jobs if x['name'].startswith('deploy-serving')][0].replace('Z','+00:00'));s=int(t.timestamp()*1000);lg=b.client('logs');g='/aws/lambda/agent-platform-ducklake-telemetry-writer';f=lambda
    p:[e for pg in lg.get_paginator('filter_log_events').paginate(logGroupName=g,filterPattern=p,startTime=s) for e in pg['events']];bad=f('{ $.status = 500 }');nv=f('{ ($.status = 422) && ($.error_type = \"blob_not_verified\") }');print(len(bad),len(nv));assert
    not bad,'status-500 lines after the deploy';assert len(nv)>=3,len(nv);print('C6_SIZE_MISMATCH_OK')"
  expected: >-
    Exit 0 and C6_SIZE_MISMATCH_OK, with zero 500 lines and at least three 422 blob_not_verified lines: the unverified
    vector and the size-mismatch vector on both verbs.
  fix_if: >-
    A status-500 line means a vector or a real request paged; read it before anything else. Fewer than three 422 lines
    means a vector did not reach the writer.
  hermetic: false
- step: 13
  phase: post-deploy
  action: >-
    The bundled rec closed with the merge (Resolves: rec-4342 in the squash body), and the follow-on recs carry this
    plan's notes. Read rec-4342, rec-4291 and rec-4292 with recs_by_ids and save the JSON to $RECS_JSON.
  command: >-
    test -s "$RECS_JSON" && bin/venv-python -c "import json,os;r={x['id']:x for x in json.load(open(os.environ['RECS_JSON']))['rows']};assert
    r['rec-4342']['status']=='closed',r['rec-4342']['status'];assert all('telemetry-blob-size-mismatch' in r[k]['context']
    for k in ('rec-4291','rec-4292'));print('RECS_OK')"
  expected: RECS_OK.
  fix_if: >-
    An open rec-4342 means the trailer was missing from the squash body: close it through the portal citing the merge
    commit. A missing note: add it.
  hermetic: false
