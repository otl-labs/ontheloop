constraints:
  - >-
    Do not edit .claude/settings.json or .claude/hooks/hooks.json (the parallel statusMessage plan owns them) or anything
    under src/turn_capture/ (rec-4939's durable fix); PARSER_VERSION is unchanged. No plugin render or marketplace step:
    the project plugin follows hook file changes itself (Benjamin, 2026-11-05).
  - >-
    Alarm, never a gate (Decision 210 cl.2): no new path may change a pass outcome, the hook's exit code (always 0) or a
    merge; a failed filing is counted in the alarm marker, never silent (Decision 84 I-4).
  - >-
    Fixed tokens only (Decision 101): diagnostics, markers, the warning text and the rec context carry no content, ref or
    session id.
  - No SLOC budget raise (Decision 128).
  - No rescue agents or workaround loops (Decision 55).
