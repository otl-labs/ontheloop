execution_steps:
  - >-
    Create scripts/telemetry_capture/capture_warning.py per its scope row (rules DW-1..DW-3).
  - >-
    Warning templates (fixed ASCII, filled only with the integer streak and the validated version or "unknown"):
    deferred_no_pin: "[telemetry_capture] WARNING: turn capture is not recording this session. The last {n} Stop passes
    ended deferred_no_pin (no capture pin found; Claude Code {version}), so nothing from this session reaches the telemetry
    warehouse. Tell the operator in your next status. Detail: bin/venv-python -m scripts.telemetry_capture status --tree
    <this session's transcript>." halted: "[telemetry_capture] WARNING: turn capture is halted for this session. The last
    {n} Stop passes ended halted, so nothing new from this session reaches the telemetry warehouse.
    Tell the operator in your next status. Detail: bin/venv-python -m scripts.telemetry_capture status --tree <this
    session's transcript>; an operator clears it with clear-halt after fixing the cause."
  - >-
    Modify .claude/hooks/stop_log_turn.py, scripts/telemetry_capture/runner.py, scripts/telemetry_capture/__main__.py and
    scripts/telemetry_capture/verify.py per their scope rows.
