    --assert-zero column_mismatch on the unpinned tree exits 2;
    a tree with no passes: status=no_cursor, exit 2),
    test_first_stop_deferral_alone_stays_quiet, test_halted_streak_warns_without_filing,
    test_recovery_clears_marker_and_rearm_fires, test_stop_paths_print_nothing_new (both halves named in its
