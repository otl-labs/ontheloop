schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-capture-deferral-warning
intent: >-
  Make a Claude Code session whose turn capture keeps deferring (deferred_no_pin) or stays halted say so within two turns:
  the agent and the human see one in-session warning, a telemetry_verify alarm rec (one open rec for the class, its context naming the Claude Code version) leaves
  the container, and
  the operator verify command reports an unpinned tree as a finding, so the next capture break is a minutes-long noisy
  outage instead of a multi-day silent one (rec-4941, from the 2026-11-05 capture-pin outage).
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-capture-deferral-warning.yaml
phase: >-
  rec-4941 detection hardening (soft-warn category ad_hoc_rec) from the capture-pin outage postmortem, related to T3.20
  (in_progress); no exit criterion is closed: T3.20's only open criterion is c9 (unattended CI agents, owned by the CI agent
  capture plans), which this plan neither closes nor forecloses. closes_criteria is therefore empty.
closes_criteria: []
scope:
  - file: scripts/telemetry_capture/capture_warning.py
    action: Create
    purpose: >-
      Stdlib-only at import (json, os, re, tempfile, time, pathlib, typing; every other import is lazy inside the one
      function that files the alarm), so the UserPromptSubmit shim can import it before any switch or credential work.
      Holds: STATE_DIRNAME = "telemetry-capture" (a test pins it equal to state.STATE_DIRNAME), DIAGNOSTICS
      "diagnostics.jsonl", WARNING_MARKER "capture_warning.json", ALARM_MARKER "unpinned_alarm.json", STOP_EVENTS
      ("Stop", "StopFailure"), TRIGGER_PASSES = 2, REARM_EVERY = 25, ALARM_ATTEMPTS = 3, VERSION = ^\d+\.\d+\.\d+$.
      Rule DW-1 (trigger): over the tree's diagnostics records that are complete JSON objects whose event is in STOP_EVENTS
      and that carry an outcome (verify records and UserPromptSubmit passes are ignored), the persistent reason is
      "deferred_no_pin" when the trailing run of passes with outcome deferred and diag.deferred_no_pin is at least
      TRIGGER_PASSES long, "halted" when the trailing run of outcome halted is at least TRIGGER_PASSES long, else None; the
      streak is that run's length; persistent(transcript_path, session_id) returns (reason or None, streak) and
      alarm_marker(transcript_path, session_id) returns the alarm marker dict or None (both read-only, used by DW-2, DW-3,
      verify and VP step 9). Rule DW-2 (warning, once per episode): prompt_warning(transcript_path, session_id) returns
      the JSON line to print, or None. It returns a line when the reason is set and the marker is absent, names another
      reason, or holds a streak at least REARM_EVERY below the current one; it then writes the marker {reason, streak, at}
      by temp file plus os.replace (a failed write still returns the line: loud beats silent). When the latest Stop pass
      ended sent or no_rows it deletes the marker and returns None, so a recovered tree that breaks again warns afresh.
      The line is one JSON object {"hookSpecificOutput": {"hookEventName": "UserPromptSubmit", "additionalContext": TEXT},
      "systemMessage": TEXT} where TEXT is the fixed ASCII template for the reason (pinned in execution_steps[1]) filled
      with the streak and the latest Stop pass's cli_version (or "unknown" when absent or not matching VERSION). Reads only
      the diagnostics file (DIAGNOSTICS_KEEP bounds it at 500 lines) and the marker; takes no lock, starts no subprocess,
      tolerates a missing state directory, never raises. cli_version(root: bytes) returns the version field of the last
      root record that has one, if it matches VERSION, scanning from the end of the bytes and parsing only complete lines.
      Rule DW-3 (alarm): file_unpinned_alarm(transcript_path, session_id, *, portal=None, reader=None, now=None) acts only
      when the persistent reason is deferred_no_pin (a halt warns, never files) and the alarm marker is absent or records a
      failure with attempts below ALARM_ATTEMPTS. It calls scripts.telemetry_verify.alarms.raise_alarms with findings
      {"unpinned_tree": streak}, scope "claude_code=<version or unknown>", alarm_at None, file this module's path,
      acceptance_for scripts.telemetry_capture.verify.acceptance_for, declared (), parser_version PARSER_VERSION, then
      writes the alarm marker {action, version, at} (the episode action, or "alarm_error:<ExceptionClass>" with attempts
      incremented). Returns the action token; never raises. raise_alarms matches the one open rec on finding_class only, so
      every tree and version updates the same rec and scope= in its context is last-writer-wins: the version names the
      latest affected release, not a per-version rec. unpinned(tree_path, session_id) is True when the persistent
      reason is deferred_no_pin and project_ref_pin(FsTree(tree)) is None (both imported lazily).
  - file: .claude/hooks/stop_log_turn.py
    action: Modify
    purpose: >-
      On the UserPromptSubmit path only, after the payload's fields are read and before the prompt_id check, call
      capture_warning.prompt_warning(transcript, session_id) inside its own try and print the returned line to stdout
      (flushed); every failure is swallowed and the existing detach still runs. The Stop and StopFailure paths are
      unchanged: stdout stays empty and the stderr witness line stays the first and only stderr output (WT-1/WT-2). The
      module docstring's "prints the witness line only" sentence is updated to name the UserPromptSubmit warning line. No
      new import beyond the stdlib before the switch (the capture_warning import is stdlib-only at module level).
  - file: scripts/telemetry_capture/runner.py
    action: Modify
    purpose: >-
      The deferred_no_pin branch of _locked_pass records cli_version (capture_warning.cli_version over the pass's root
      bytes) on the diagnostics record when it matches VERSION, else records nothing. No other behaviour changes; the
      module docstring's "Nothing is ever printed" stays true.
  - file: scripts/telemetry_capture/__main__.py
    action: Modify
    purpose: >-
      _cmd_run: after run_pass, when the event is Stop or StopFailure and the outcome is deferred, call
      capture_warning.file_unpinned_alarm(Path(args.transcript), args.session_id) inside the existing silent try (after the
      lock is released, under no tree lock). _verify_exit: a result whose status is unpinned_tree exits 1 (a finding),
      including for --assert-zero unpinned_tree; DENOMINATOR_OF gains unpinned_tree -> root_checked so --assert-zero
      unpinned_tree on a pinned, completed tree exits 0 rather than 2.
  - file: scripts/telemetry_capture/verify.py
    action: Modify
    purpose: >-
      _load: a lost cursor reads status unpinned_tree (and counts unpinned_tree = 1) when capture_warning.unpinned(self.path,
      self.session_id) holds, else no_cursor as today; unpinned_tree joins PER_TREE_SKIPS (so it is BENIGN: no
      incomplete_streak bump, no verify_incomplete) and ALARM_CLASSES (so the VERIFY line's alarms field names it and
      --assert-zero accepts it). Shape that fits (measured by the critique on a scratch copy with ruff format at 127 columns:
      about +3 SLOC, 496 -> about 499): append "unpinned_tree" inside PER_TREE_SKIPS's existing line (127 columns exactly),
      add `| {"unpinned_tree"}` after the ALARM_CLASSES set the way DECLARED_CLASSES extends its set (appending inside the
      set's own line pushes it past 127 and ruff explodes it to about +11 SLOC), and a 2-line branch in _load. verify never
      files unpinned_tree itself: the detached runner is the single filer, so the
      rec's context carries one scope shape. Size: 496 SLOC of 500 at planning (measured by the decision scout); the change
      is at most 4 SLOC, and if the build would cross 500 the build stops and amends the plan (move the new branch into
      capture_warning or decompose verify.py into a facade package, Decision 128), never raises the budget.
  - file: docs/contracts/ports.yaml
    action: Modify
    purpose: >-
      SA-02's assumption text gains one sentence (pinned in execution_steps[4]): a UserPromptSubmit hook's exit-0 stdout
      JSON hookSpecificOutput.additionalContext reaches the agent's context and its systemMessage reaches the user where the
      surface shows one, and each transcript record carries the writing Claude Code release in a version field; plus one
      amendment_log row (field_add, semantic_break false). Class D; prose only, no code reads it.
  - file: tests/telemetry_capture/test_deferred_no_pin_surface.py
    action: Create
    purpose: >-
      The rec-4941 acceptance nodes and the guards listed in test_obligations, over tmp_path trees built with
      tests/fixtures/turn_capture_corpus.py and diagnostics records written through CaptureState.append_diagnostic.
bundled_recommendations:
  - rec-4941
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - >-
    After two Stop passes of one tree end deferred with deferred_no_pin, the shim's next UserPromptSubmit run prints exactly
    one JSON line (additionalContext and systemMessage carrying the reason, the streak and the Claude Code version) and the
    run after it prints nothing; one deferred Stop pass alone prints nothing.
  - >-
    A tree whose last two Stop passes ended halted warns with the halted text and files no alarm; a tree whose latest Stop
    pass ended sent prints nothing and has no marker; the warning re-arms after REARM_EVERY further deferred Stop passes.
  - >-
    The Stop and StopFailure shim paths print nothing on stdout and only the witness line on stderr, as before.
  - >-
    The detached run files raise_alarms({"unpinned_tree": n}) with scope claude_code=<version> exactly once per tree after
    the second deferred Stop pass, never for a halt, retries a failed filing at most ALARM_ATTEMPTS times, and records the
    action in the alarm marker.
  - >-
    scripts.telemetry_capture verify --tree on an unpinned tree prints VERIFY status=unpinned_tree with alarms=unpinned_tree
    and exits 1; a tree with no passes still prints status=no_cursor and exits 2.
  - >-
    A version value that does not match ^\d+\.\d+\.\d+$ is never recorded or printed; capture_warning imports only the
    stdlib at module level.
  - >-
    SA-02 states the two new Claude Code assumptions (asserted by test_sa02_states_the_deferral_warning_assumptions) and
    ports.yaml carries the amendment_log row.
  - rec-4941 closes on the squash merge's Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: The rec-4941 acceptance nodes.
    command: >-
      bin/venv-python -m pytest -q
      tests/telemetry_capture/test_deferred_no_pin_surface.py::test_second_deferred_stop_emits_one_warning
      tests/telemetry_capture/test_deferred_no_pin_surface.py::test_verify_reports_unpinned_tree
    expected: Exit 0. Red before (the test file does not exist on origin/main).
    fix_if: A node fails -- fix the code, never the node or the rec's acceptance string.
    hermetic: true
    graduation: graduate
    graduation_check_id: capture-deferral-warning-surface
    expected_literals: []
  - step: 2
    phase: pre-deploy
    action: >-
      The guards: first-Stop deferral stays quiet, halted warns without filing, recovery clears and re-arm fires, Stop paths
      unchanged, hostile version dropped, stdlib-only import, hook_canary shape parity, the alarm filed once and retried
      bounded, the UserPromptSubmit warning record is not a witness and changes no turn.
    command: bin/venv-python -m pytest -q tests/telemetry_capture/test_deferred_no_pin_surface.py
    expected: Exit 0.
    fix_if: A node fails -- fix the code; never weaken an assertion (Decision 235).
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-run of a test file this plan creates (hermetic_authoring rule v): always in the --pre pytest_diff set;
      step 1's graduated record is the standing guard for the rec's two nodes.
  - step: 3
    phase: pre-deploy
    action: The existing shim, runner, CLI and verify suites still pass (no_cursor, witness and silence contracts unchanged).
    command: >-
      bin/venv-python -m pytest -q tests/hooks/test_stop_log_turn.py tests/hooks/test_capture_hook_registration.py
      tests/telemetry_capture/test_runner.py tests/telemetry_capture/test_main.py tests/telemetry_capture/test_verify.py
      tests/telemetry_capture/test_state.py
    expected: Exit 0.
    fix_if: An existing node fails -- the change broke a pinned behaviour; fix the code, never the existing test.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      Whole-file re-runs of existing suites that the full tier runs before handoff and on every main push.
  - step: 4
    phase: pre-deploy
    action: verify.py stays within the 500-SLOC limit and no budget entry was added or raised.
    command: >-
      bin/venv-python -c "from scripts.checks.sloc.sloc_limits import validate_sloc_limits; f = []; validate_sloc_limits(f); assert not f, f" && ! git diff origin/main -- config/sloc_budgets.yaml | grep -q '^+'
    expected: Exit 0.
    fix_if: verify.py crosses 500 -- move the branch into capture_warning.py or decompose; never raise (Decision 128).
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: The ports contract validates with the SA-02 extension.
    command: bin/venv-python -m pytest -q tests/checks/contracts/test_validate_ports_contract.py
    expected: Exit 0.
    fix_if: The amendment_log row or SA-02 shape is rejected -- match the existing rows' shape.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: validate_ports_contract is already a registered check that the --pre tier runs on any ports.yaml edit.
  - step: 6
    phase: pre-deploy
    action: Fast tier.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0.
    fix_if: Fix the reported check on the branch (Git-ops step 6).
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Full tier on the rebased head, with the handoff verdict.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: >-
      The verdict check exits 0 for HEAD. Start the full tier backgrounded with a 2 h limit from the top-level session; its
      verdict is the verify-head exit, never a pipe's status.
    fix_if: A failure in this plan's files -- fix and rerun from the start (timeout_disposition blocked).
    hermetic: false
    graduation: not-applicable
  - step: 8
    phase: post-deploy
    action: >-
      The squash merge's "Resolves: rec-4941" trailer closed the rec. Export MERGE_SHA as the sha merge_pull_request
      returned; run after ci.yml's trailer-closure job on that commit finishes.
    command: >-
      test -n "$MERGE_SHA" && bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
      make_reader; rows, _ = fetch_recs_by_ids(make_reader(), ['rec-4941']); print([(r['id'], r['status']) for r in rows]);
      assert rows and rows[0]['status'] == 'closed'"
    expected: Prints rec-4941 closed; exit 0.
    fix_if: Still open -- read the trailer-closure job log; an AcceptanceVerdictRefused is fixed in code, never closed by hand.
    hermetic: false
  - step: 9
    phase: post-deploy
    action: >-
      Fresh-session read-back of all three deliverables (Decision 48 NOTE). In the first fresh cloud session started on main
      after the merge whose tree defers, on its third or a later prompt (a quick prompt can run before the second detached
      Stop pass, which first waits for its witness, writes its record): count the trailing deferred Stop passes from
      diagnostics.jsonl through DW-1, print the alarm marker, count the warning records in the transcript, and read back the
      open unpinned_tree rec. If the statusMessage fix or rec-4939 has restored pinning before then, record UNPROVEN-LIVE
      with the reason; the channel's delivery stays evidenced by hook_canary and the shape-parity node.
    command: >-
      T="$(ls -t ~/.claude/projects/*/*.jsonl | head -1)"; bin/venv-python -c "import json, sys; from pathlib import Path;
      from scripts.telemetry_capture import capture_warning as cw; t = Path(sys.argv[1]); reason, streak =
      cw.persistent(t, t.stem); print(json.dumps({'reason': reason, 'streak': streak, 'alarm': cw.alarm_marker(t,
      t.stem)}))" "$T"; grep -c 'telemetry_capture\] WARNING' "$T"; AWS_PROFILE=agent_platform bin/venv-python -c "from
      src.common.ducklake_reader_client import make_reader; print(make_reader().named('recs_by_title_prefix',
      title_prefix='telemetry verification alarm: unpinned_tree%'))"
    expected: >-
      Live: reason deferred_no_pin with streak at least 2, the alarm marker's action is file, update or unchanged, the grep
      counts at least 1 warning record, and the reader returns one open rec with source telemetry_verify; record its id.
      Recovered: reason null with the latest Stop pass sent, recorded as UNPROVEN-LIVE with the reason.
    fix_if: >-
      The tree defers on 2+ Stop passes but no warning is recorded -- the SA-02 channel assumption is wrong; file a rec. The
      alarm marker reads alarm_error:* or no rec is returned -- that is a finding: file a rec naming the token (the detached
      filing failed in the container, the failure class the postmortem section 5 names).
    hermetic: false
test_obligations:
  - source: scripts/telemetry_capture/capture_warning.py
    behavior: DW-1 trigger, DW-2 once-per-episode warning and re-arm, DW-3 bounded version-scoped alarm, stdlib-only import.
    verification_step: 1
    test_selector: tests/telemetry_capture/test_deferred_no_pin_surface.py::test_second_deferred_stop_emits_one_warning
    red_green_expectation: Red before (module and test absent). Green after.
  - source: .claude/hooks/stop_log_turn.py
    behavior: The UserPromptSubmit path prints the warning line once; Stop and StopFailure output is unchanged.
    verification_step: 2
    test_selector: tests/telemetry_capture/test_deferred_no_pin_surface.py::test_stop_paths_print_nothing_new
    red_green_expectation: >-
      Red before: the node holds both halves -- the UserPromptSubmit twin (one warning line over a two-deferral tree, none
      over a fresh tree, witness still first on stderr) fails on origin/main; the Stop and StopFailure half (empty stdout,
      stderr exactly the witness line, over the same two-deferral tree) is green before and after by design.
  - source: scripts/telemetry_capture/runner.py
    behavior: A deferred pass records a validated cli_version; a hostile value is dropped.
    verification_step: 2
    test_selector: tests/telemetry_capture/test_deferred_no_pin_surface.py::test_deferred_pass_records_only_a_valid_version
    red_green_expectation: Red before (no cli_version field). Green after.
  - source: scripts/telemetry_capture/__main__.py
    behavior: The detached run files the alarm once per tree.
    verification_step: 2
    test_selector: tests/telemetry_capture/test_deferred_no_pin_surface.py::test_detached_run_files_one_version_scoped_alarm
    red_green_expectation: Red before (raise_alarms never called on a deferred pass). Green after.
  - source: scripts/telemetry_capture/__main__.py
    behavior: >-
      verify exits 1 on unpinned_tree; --assert-zero unpinned_tree exits 1 on an unpinned tree and 0 on a pinned completed
      tree with root_checked at least 1 (the acceptance command the filed alarm rec carries).
    verification_step: 1
    test_selector: tests/telemetry_capture/test_deferred_no_pin_surface.py::test_verify_reports_unpinned_tree
    red_green_expectation: Red before (status no_cursor, exit 2, and --assert-zero unpinned_tree refused as not an alarm class). Green after.
  - source: scripts/telemetry_capture/verify.py
    behavior: An unpinned tree reads unpinned_tree, a fresh tree still reads no_cursor.
    verification_step: 1
    test_selector: tests/telemetry_capture/test_deferred_no_pin_surface.py::test_verify_reports_unpinned_tree
    red_green_expectation: Red before (status no_cursor, exit 2). Green after.
  - source: docs/contracts/ports.yaml
    behavior: SA-02 records the two new Claude Code assumptions.
    verification_step: 2
    test_selector: tests/telemetry_capture/test_deferred_no_pin_surface.py::test_sa02_states_the_deferral_warning_assumptions
    red_green_expectation: >-
      Red before (SA-02 lacks the additionalContext and version-field sentence). Green after; validate_ports_contract
      (step 5) checks the file's shape.
  - source: tests/telemetry_capture/test_deferred_no_pin_surface.py
    behavior: The test module itself.
    verification_step: 2
    command: bin/venv-python -m pytest -q tests/telemetry_capture/test_deferred_no_pin_surface.py
    waiver_reason: A test module; its nodes are the evidence for the source rows above.
constraints:
  - >-
    Do not edit .claude/settings.json or .claude/hooks/hooks.json (the parallel statusMessage plan owns them) or anything
    under src/turn_capture/ (rec-4939's durable fix); PARSER_VERSION is unchanged. No plugin render or marketplace step:
    the project plugin follows hook file changes itself (Benjamin, 2026-11-05).
  - >-
    Alarm, never a gate (Decision 210 cl.2): no new path may change a pass outcome, the hook's exit code (always 0) or a
    merge; a failed filing is counted in the alarm marker, never silent (Decision 84 I-4).
  - >-
    Fixed tokens only (Decision 101): diagnostics, markers, the warning text and the rec context carry no content, ref or
    session id.
  - No SLOC budget raise (Decision 128).
  - No rescue agents or workaround loops (Decision 55).
