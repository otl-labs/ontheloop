    Modify .claude/hooks/stop_log_turn.py, scripts/telemetry_capture/runner.py, scripts/telemetry_capture/__main__.py and
    scripts/telemetry_capture/verify.py per their scope rows.
  - >-
    Create tests/telemetry_capture/test_deferred_no_pin_surface.py with: test_second_deferred_stop_emits_one_warning,
    test_verify_reports_unpinned_tree (driven through cli.main with a fake reader_factory and verify.credentials_available
    monkeypatched to True, so no boto3 lookup runs; no cursor, two deferred Stop passes, no pin: VERIFY
    status=unpinned_tree, alarms=unpinned_tree, exit 1, no portal call; --assert-zero unpinned_tree on that tree exits 1;
    on a pinned completed tree, with run_verify returning a completed result whose counts hold root_checked 1, exits 0;
    a tree with no passes: status=no_cursor, exit 2),
    test_first_stop_deferral_alone_stays_quiet, test_halted_streak_warns_without_filing,
