constraints:
  - >-
    Rules, pinned (rule ids go into code docstrings and the envelope line). PW-1: the pin hook prints
    '[session_start_log_turn] capture pin project_ref=<ref>' after the facts line iff its argv holds exactly one
    --project-ref=<ref> with ref matching ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,199}$. P-2: per non-inherited root SessionStart
    hook attachment in file order (P-1, K-1), ref = witness_ref (exactly one stripped stderr line starting with the ref
    prefix, remainder well-formed) else command_ref (today's test); the first non-None ref pins. PV-1: is_pin_attachment
    = SessionStart and (command stem is the pin script or a stripped stderr line is the capture pin prefix, alone or
    followed by a space). WT-2: Stop, hook_success, stderr first line equals WITNESS_LINE; the command is never read.
    H-1: script stem from the command first; else pin attachment -> hook:session_start_log_turn, stderr first line equals
    WITNESS_LINE -> hook:stop_log_turn; else H-2. No rule parses a label; label grammar is observed, never relied on.
  - >-
    Purity (envelope R7, Decision 207): every verdict reads only the attachment's own fields; no rule reads settings, the
    environment, git or a clock. The pin of a tree that already has a cursor is reused across the v9 reset as today
    (Decision 199); a never-pinned outage-era tree pins fresh from its records on its first v9 pass (no operator-asserted
    pin: postmortem D2 closed no backfill).
  - >-
    Typed columns only (Benjamin, 2026-10-17): no new column and no new metadata key; pin_ref_disagreement is a pass
    diagnostic counter (DG-1), never a row value.
  - >-
    The statusMessage stopgap (#1881) stays exactly as it is (Fable consult F6): no edit to .claude/settings.json or
    .claude/hooks/hooks.json, so no plugin render; its removal is a later, separate choice once rec-4942's canary is live.
  - >-
    No file crosses 500 SLOC, tests included (Decision 128); observations.py grows at most 10 SLOC; contracts stay under
    500 effective lines and governance lines under 2000 characters (Decision 166), by relief, never a raise.
  - >-
    Graduated checks keep resolving and are never weakened beyond the four sanctioned assertion changes and the version
    constant listed in weakening_dispositions; any further weakening candidate stops the build for the coordinator.
  - >-
    Graduated shards kept unchanged (their check_spec and nodes stay; the nodes keep passing): capture-catalog-reset-resends-tree,
    capture-runner-waits-for-its-witness, parser-v3-declared-prefixes-match-corpus, telemetry-parser-cap-agreement,
    telemetry-parser-version-registry, telemetry-read-clients-use-the-route, telemetry-verify-cli-counts-only,
    telemetry-verify-never-gates-capture, turn-capture-late-hook-groups, turn-capture-v2-conformance,
    turn-capture-witness-frontier. turn-capture-stop-witness and capture-hooks-status-message-parser-parity keep their
    check_spec; only the sanctioned assertions inside their nodes change.
  - 'Public repository (Decision 101): fixtures synthetic; probe and integration steps print counts and fixed tokens only.'
  - >-
    Do not touch terraform/ (env-cleanup hold) or the arrival-checks plan's files (rec-4949/rec-4940: Decisions,
    data-modeling-standard.yaml, .github/workflows/). No admin credentials; every AWS call uses AWS_PROFILE=agent_platform.
  - No rescue agents or workaround loops (Decision 55); a failed live step stops for RCA.
