verification_plan:
  - step: 1
    phase: pre-deploy
    action: rec-4939's acceptance file plus the hook, observe, smoke, provenance and the two sanctioned-assertion nodes.
    command: >-
      bin/venv-python -m pytest tests/turn_capture/test_hook_label_shape.py tests/hooks/test_session_start_log_turn.py
      tests/hooks/test_capture_hook_registration.py
      tests/turn_capture/test_witness.py::test_witness_matches_only_the_capture_shim_line_at_stop
      tests/turn_capture/test_provenance.py::test_pin_ref_disagreement_is_counted_on_the_root_only
      tests/telemetry_capture/test_main.py::test_observe_counts_labelled_pin_records
      tests/telemetry_capture/test_smoke.py::test_synthetic_tree_records_the_label_shape -q
    expected: >-
      Exit 0, every node passes. Red before: the new file and nodes are absent, and on main a labelled pin returns None
      and a labelled Stop attachment is no witness.
    fix_if: >-
      A label pins without a stderr line, a gated copy pins or supplies facts, or the witness depends on the command. Fix
      the rule, never the fixture.
    hermetic: true
    graduation: graduate
    graduation_check_id: turn-capture-hook-labels
  - step: 2
    phase: pre-deploy
    action: Contract notes, their order relative to R8, and the ports validator.
    command: >-
      bin/venv-python -m pytest tests/telemetry/test_capture_hook_labels_contract_notes.py
      tests/telemetry/test_stop_turn_close_contract_notes.py -q && bin/venv-python -c "from
      scripts.checks.contracts.validate_ports_contract import validate_ports_contract as v;f=[];v(f);assert not f,
      f;print('PORTS_OK')"
    expected: Exit 0, every node passes, then PORTS_OK. Red before because the test file and texts are absent.
    fix_if: A note is missing, or the PARSER_VERSION 9 line is not between the PARSER_VERSION 8 line and R8.
    hermetic: true
    graduation: graduate
    graduation_check_id: telemetry-capture-hook-labels-declared
  - step: 3
    phase: pre-deploy
    action: >-
      The golden corpus at v9 and the registry: every case matches, the bump is recorded, incremental equals full at every
      line cut, finalize and resume schedules emit each row once, and the derived golden layer reconciles at 9.
    command: >-
      bin/venv-python -m pytest tests/turn_capture/test_record_turn.py::test_golden_cases_match_expected_rows
      tests/turn_capture/test_record_turn.py::test_incremental_equals_full_at_every_line_cut
      tests/turn_capture/test_record_turn.py::test_finalize_resume_schedules_emit_each_row_once
      tests/turn_capture/test_record_turn.py::test_finalize_equals_virtual_prompt_at_eof
      tests/turn_capture/test_record_turn.py::test_new_cases_are_built_from_their_builders
      tests/turn_capture/test_record_turn.py::test_finalization_cuts_are_recorded_once_and_survive_a_reset
      tests/telemetry/test_parser_version_registry.py tests/telemetry/test_derived_layer_reconciliation.py
      tests/telemetry_verify/test_derive.py -q
    expected: Exit 0, every node passes.
    fix_if: >-
      Regenerate expected_rows only after steps 1-2 pass. A line-cut failure is a prefix defect in a rule, never a test to
      relax. A derived-layer failure means a hand re-derivation is missing, never a value copied from a verb.
    hermetic: true
    graduation: waive
    graduation_waiver_reason: >-
      Most of its nodes already belong to graduated standing checks (turn-capture-golden-corpus,
      turn-capture-r7-incremental-equals-full, turn-capture-finalize-resume-emits-each-row-once and the parser version
      registry); the rest run in the full tier. The new cases join the corpus through the index, not a new check.
  - step: 4
    phase: pre-deploy
    action: >-
      Real-CLI proof without model spend: the label probe copies the capture registrations with every statusMessage
      stripped into a scratch project, runs the installed claude -p in cloud mode (CLAUDE_CODE_REMOTE=true) against a
      local mock Messages API, and parses the transcript with this checkout's parser, in the settings, plugin and combined
      shapes. No credential is present, so nothing is sent.
    command: >-
      for m in "" --plugin --combined; do bin/venv-python
      /mnt/project-files/capture-pin-outage/durable-fix/label-probe/probe.py $m | tee -a "$PROBE_LOG" | grep -q
      '"verdict": "PASS"' || exit 1; done; grep -c '"labels_seen": \["command hook' "$PROBE_LOG"
    expected: >-
      Three JSON lines with verdict PASS, pin ontheloop, pin_records 1, stop_witnesses at least 1 and a non-empty
      labels_seen, then the count 3. On main (2026-11-06, CLI 2.1.318) all three shapes printed FAIL with pin null.
    fix_if: >-
      HARNESS_ERROR: the CLI or the mock did not start; report it, never skip the step. FAIL with labels_seen empty: the
      CLI no longer labels (record its version and command shape in the PR body; the unit tests stay the guard). FAIL
      with labels present: a parser defect; stop and RCA (Decision 55).
    hermetic: false
    graduation: not-applicable
  - step: 5
    phase: pre-deploy
    action: >-
      Live proof against the production writer under a synthetic ref: the c8 smoke, now in the label shape, through the
      real hook entry points and runner.
    command: AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_capture.smoke
    expected: Ends with the PC_SMOKE PASS line; counts only.
    fix_if: Any failure -> STOP and RCA (Decision 55); never clear a halt and retry.
    hermetic: false
    graduation: not-applicable
  - step: 6
    phase: pre-deploy
    action: >-
      The always-ask text matches the approved sidecar at the build's base, and rec-4939's acceptance is unchanged and
      passes (Decision 201).
    command: >-
      bin/venv-python -m scripts.roadmap.approved_text verify --slug telemetry-capture-hook-labels --base origin/main &&
      bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;a=f('rec-4939',
      profile='agent_platform');want='bin/venv-python -m pytest
      tests/turn_capture/test_hook_label_shape.py::test_labelled_pin_attachment_pins_from_witness
      tests/turn_capture/test_hook_label_shape.py::test_labelled_stop_attachment_is_a_witness -q';assert
      a['status']=='open' and a['acceptance'].strip()==want, a['acceptance'];print('REC_OK')" && bin/venv-python -m pytest
      tests/turn_capture/test_hook_label_shape.py::test_labelled_pin_attachment_pins_from_witness
      tests/turn_capture/test_hook_label_shape.py::test_labelled_stop_attachment_is_a_witness -q
    expected: The verify line passes, REC_OK, then exit 0.
    fix_if: >-
      A verify mismatch means the edit differs from the approved words: restore the words, never edit the sidecar. A
      changed acceptance means someone re-authored it: read it and make it pass, or update it through the portal with
      get_rec_write_guidance first.
    hermetic: false
    graduation: not-applicable
  - step: 7
    phase: pre-deploy
    action: Fast tier, then the full tier on the committed, rebased, clean tree before handoff.
    command: >-
      bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate && bin/venv-python -m
      scripts.checks.validation_result --verify-head
    expected: Exit 0 on a completed full run with the head verified; a timeout is not a pass (handoff_policy).
    fix_if: >-
      Fix the named check at root cause and rerun from the start; never raise a budget, skip a check or weaken an
      assertion beyond the sanctioned changes.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion refusal); it is the handoff gate itself.
  - step: 8
    phase: post-deploy
    action: >-
      A session started on merged main (the next project thread the coordinator starts, run after its first Stop pass) is
      captured at v9 and pinned from the stderr line, and its rows read back through the production reader.
    command: >-
      T="$(ls -t ~/.claude/projects/*/*.jsonl | head -1)" && AWS_PROFILE=agent_platform bin/venv-python -m
      scripts.telemetry_capture probe --tree "$T" --require telemetry_sessions && bin/venv-python -c "import sys;from
      pathlib import Path;from src.turn_capture.transcript import FsTree,ROOT,read_lines,witness_ref,is_pin_attachment,project_ref_pin;from
      src.turn_capture.record_turn import PARSER_VERSION;t=FsTree(Path(sys.argv[1]));a=[l.data['attachment'] for l in
      read_lines(t.read(ROOT) or b'') if l.data and isinstance(l.data.get('attachment'),dict)];w=[witness_ref(x) for x in a
      if is_pin_attachment(x)];print('v',PARSER_VERSION,'pin_records',len(w),'with_ref_line',sum(x is not None for x in
      w));assert PARSER_VERSION==9 and 'ontheloop' in w and project_ref_pin(t)=='ontheloop'" "$T"
    expected: >-
      The probe's sessions rows above zero with no halt, then one line with v 9 and with_ref_line at least 1. Counts only.
    fix_if: >-
      No ref line: the session's checkout predates the merge (check git log); a halt or no rows: read the pass
      diagnostics, file a rec through the portal and fix forward.
    hermetic: false
  - step: 9
    phase: post-deploy
    action: 'After the squash merge carries "Resolves: rec-4939", the closure job closed rec-4939.'
    command: >-
      bin/venv-python -c "from scripts.ops_data_portal import _fetch_rec_from_reader as f;s=(f('rec-4939',
      profile='agent_platform') or {}).get('status');print('rec-4939',s);assert s=='closed'"
    expected: rec-4939 closed.
    fix_if: >-
      Open: check ci.yml's closure job on the squash commit; close through update_rec with the PR as evidence only if its
      acceptance passes on main.
    hermetic: false
