schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-capture-hook-labels
intent: >-
  Make Claude Code turn capture independent of the hook attachment's recorded command. Since Claude Code 2.1.317 a cloud
  session records that field as a label ('command hook', 'command hook N') unless the hook sets statusMessage, and every
  capture rule that read it (the pin P-2, checkout provenance PV-1, the Stop witness WT-2, hook names H-1) broke: no
  cloud session was captured from 2026-11-03 to 2026-11-06 (rec-4939, Critical). The statusMessage stopgap (#1881)
  restored capture by leaning on undocumented CLI behaviour; this plan makes the capture hooks' own stderr witness lines
  the identity, so the next upstream change to the command field cannot silently stop the learning signal the
  self-improvement loop depends on (PROJECT_CONTEXT, telemetry as evidence).
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-capture-hook-labels.yaml
phase: >-
  ad_hoc_rec (rec-4939, Critical, tagged telemetry-project and capture-outage; postmortem
  /mnt/project-files/capture-pin-outage/POSTMORTEM.md section 7.2, recommendations approved by Benjamin 2026-11-05 in
  thread cmsg_012XgaFy8VaDQbxP5D8nC958U5KXCpeStYsV1nBk9MWZWf). T3.20 owns turn capture; its one open criterion is c9 (CI
  agent capture, rec-4415), which this plan neither closes nor forecloses, so closes_criteria is empty by design. V3: the
  pre-merge proof runs the installed Claude Code CLI against a local mock Messages API (no model spend), and the
  post-merge proof reads a fresh session's rows back through the production reader. src/turn_capture and .claude/hooks are
  excluded from every Lambda bundle, so nothing deploys; sessions pick the change up from their checkout of main.
scope:
  - file: src/turn_capture/transcript.py
    action: Modify
    purpose: >-
      Rules P-2 and PV-1's shared predicate. New constants PIN_LINE_PREFIX ('[session_start_log_turn] capture pin') and
      PIN_REF_PREFIX (PIN_LINE_PREFIX + ' project_ref='); new pure functions witness_ref(att) (the ref of exactly one
      stripped stderr line starting with PIN_REF_PREFIX whose remainder fullmatches the ref grammar, else None),
      command_ref(att) (today's command-form test, unchanged: stem session_start_log_turn and exactly one well-formed
      --project-ref token) and is_pin_attachment(att) (hookEvent SessionStart and either the command names the pin
      script or a stripped stderr line equals PIN_LINE_PREFIX or starts with PIN_LINE_PREFIX plus a space).
      project_ref_pin keeps its signature, its P-1 earliest-first loop and the K-1 inherited-line skip, and takes
      witness_ref(att) or, as the legacy form, command_ref(att). Docstrings name the rules.
  - file: src/turn_capture/provenance.py
    action: Modify
    purpose: >-
      _is_pin delegates to transcript.is_pin_attachment (PV-1), so a labelled pin attachment supplies its checkout facts;
      pin_facts and _PIN_LINE unchanged (the facts line is untouched). open_provenance (root only) counts
      pin_ref_disagreement once per pin attachment in the stream whose witness_ref and command_ref are both present and
      differ (rule DG-1: a pass diagnostic, never a row value).
  - file: src/turn_capture/witness.py
    action: Modify
    purpose: >-
      Rule WT-2: is_witness_record drops the command test (Fable consult F3); a Stop hook_success attachment whose stderr
      first line equals WITNESS_LINE is a witness whatever its command (label, statusMessage free text, absent or the
      registered line). WITNESS_STEM is kept only if another module still imports it (grep at build time; delete it
      otherwise).
  - file: src/turn_capture/observations.py
    action: Modify
    purpose: >-
      Rule H-1: hook_name keeps the command's script stem first; when the command names no script, a pin attachment
      (transcript.is_pin_attachment) is named hook:session_start_log_turn and a hook record whose stderr first line equals
      witness.WITNESS_LINE (any event) is named hook:stop_log_turn; otherwise the H-2 hookName fallback as today. No other
      stderr tag is ever read as a name (Fable consult F4). Net growth at most 10 SLOC.
  - file: src/turn_capture/record_turn.py
    action: Modify
    purpose: PARSER_VERSION 9, PRODUCER_VERSION "turn-capture-9" (one above main's value at build time, see context).
  - file: config/telemetry/parser_versions.yaml
    action: Modify
    purpose: >-
      claude_code current 9; history entry v9 (build date, regenerated golden_digest, full_output_cap_bytes 8388608,
      signature_prefixes [hook, gate, precommit, status], a reason naming this plan, rec-4939 and rules P-2, PV-1, WT-2,
      H-1).
  - file: .claude/hooks/session_start_log_turn.sh
    action: Modify
    purpose: >-
      Rule PW-1: after the facts line, and only when its argv holds exactly one --project-ref=<ref> whose ref fullmatches
