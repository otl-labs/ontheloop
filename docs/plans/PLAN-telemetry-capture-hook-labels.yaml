acceptance_criteria:
  - >-
    A labelled SessionStart pin attachment pins the tree from its 'capture pin project_ref=' stderr line, whatever the
    label's form ('command hook', 'command hook N'), the label is never parsed, the command form still pins a transcript
    without the line, the line wins where both are present and a disagreement is counted pin_ref_disagreement, K-1 still
    skips copied fork records, and a gated plugin copy with empty stderr never pins (VP 1).
  - >-
    A Stop hook_success whose stderr opens with the witness line is a witness whatever its command; a labelled pin
    attachment supplies the open row's checkout facts; the observe CLI and the c8 smoke's synthetic tree use the same
    predicates (VP 1).
  - >-
    The capture records keep the names hook:session_start_log_turn and hook:stop_log_turn under labels, and every other
    labelled hook reads hook:<hookName> (VP 1, VP 3).
  - >-
    The pin hook prints the ref line only for exactly one well-formed --project-ref, keeps one stderr redirect, an empty
    stdout and exit 0 on every path (VP 1).
  - >-
    The golden corpus is regenerated at parser_version 9 with the registry bumped and two new cases, and no existing case
    changes beyond the version stamps; the derived golden state and rollups are re-authored by hand at 9 (VP 3).
  - >-
    The installed Claude Code CLI, run against a local mock Messages API in cloud mode with every statusMessage stripped,
    writes labels, and the parser still pins, sees a witness and reads checkout facts in the settings, plugin and
    combined shapes (VP 4; FAIL on main recorded 2026-11-06).
  - >-
    The envelope's PARSER_VERSION 9 line and amendment_log entry match the approved-text sidecar word for word and
