execution_steps:
- >-
  RULE HK-1 (registrations): SessionStart `bash "$CLAUDE_PROJECT_DIR/.claude/hooks/session_start_log_turn.sh"
  --project-ref=ontheloop` (no matcher, unquoted ref token; H-1 strips the path token's quotes, so the stem is
  session_start_log_turn); Stop and StopFailure `"$CLAUDE_PROJECT_DIR/bin/venv-python"
  "$CLAUDE_PROJECT_DIR/.claude/hooks/stop_log_turn.py"`; SessionEnd `"$CLAUDE_PROJECT_DIR/bin/venv-python"
  "$CLAUDE_PROJECT_DIR/.claude/hooks/session_end_log_turn.py"` with "timeout": 60 on that entry only. No "async".
  Existing entries keep their order.
- >-
  RULE HK-2 (pin hook): `printf '%s\n' "[session_start_log_turn] capture pin" >&2; exit 0`. No stdin read, no state, no
  pass, every source (fork included: P-B's fork obligation).
- >-
  RULE HK-3 (Stop shim): parse stdin JSON (malformed -> exit 0); stop_hook_active true -> exit 0;
  switch.capture_allowed false -> exit 0; else subprocess.Popen([sys.executable, "-m", RUNNER_MODULE, "run", "--event",
  <hook_event_name>, "--transcript", <transcript_path>, "--session-id", <session_id>], cwd=<repo root>, stdin, stdout and
  stderr DEVNULL, start_new_session=True, close_fds=True) and exit 0 without waiting. RUNNER_MODULE is the module
  constant "scripts.telemetry_capture"; no environment variable overrides it (step 2's wrapper patches it in process).
  The repo root is the shim's own parents[2]. The whole body sits in try/except -> exit 0; the
  switch is checked before any import beyond the stdlib and yaml.
- >-
  RULE HK-4 (SessionEnd): deadline = hook start + 50 s (the entry's timeout is 60 s; main() takes the 50 s as a
  parameter so tests scale it down). Same parse, switch and guards; try the tree's lock for up to 5 s inside the
  deadline; when held, run_pass(final=True, deadline) in process, which detaches the final pass instead of sending when
  less than 20 s remain after record_turn returns; when busy, detach a final pass exactly as HK-3 does (event
  SessionEnd, --final, its own lock wait up to 600 s) and exit 0.
- >-
  RULE SW-1 (switch and guards): capture_allowed is true iff config/telemetry/capture.yaml has enabled: true AND
  CLAUDE_CODE_REMOTE == "true" AND GITHUB_ACTIONS != "true" AND OTL_TURN_CAPTURE != "off". Credentials are checked by the
  runner (none -> diagnostic no_credentials, exit 0). RULE SW-2 (smoke override): OTL_TURN_CAPTURE_SMOKE_REF=<ref>
  allows capture regardless of the switch and CLAUDE_CODE_REMOTE only when <ref> starts with "synthetic:" and the tree's
  pinned project_ref equals it; the runner re-checks the pin before sending, so no real session can be enabled by it.
  GITHUB_ACTIONS == "true" and OTL_TURN_CAPTURE == "off" still win.
- >-
  RULE ST-1 (state home, ADVICE-5 F1): <dir of transcript_path>/<session_id>/telemetry-capture/ holding state.json,
  lock, halt.json, diagnostics.jsonl, writer_url and the OP-1 marker. FsTree reads only <sid>/subagents and
  <sid>/tool-results, so the directory is invisible to the parser. RULE ST-2 (state writes): temp file plus os.replace;
  when the pass loaded a valid cursor, refuse one whose root lines_consumed is below it (diagnostic cursor_regression);
  a cursor loaded as lost (missing, unparseable or failing ST-3) is replaced, never compared. RULE ST-3 (tail
  check): state.json = {cursor (format 2 JSON), root_tail_uuid}; root_tail_uuid is the uuid of the last root record
  below lines_consumed that carries one; on load, a missing file, a parse failure or a tail mismatch is a lost cursor
  (diagnostic cursor_lost or cursor_tail_mismatch). RULE ST-4 (diagnostics): one JSON line per pass with event, counts
  per request (submitted, inserted), the record_turn diagnostics and the outcome; keep the last 500 lines; never content,
  rows or credentials.
- >-
  RULE TR-1 (endpoint and auth): URL from DUCKLAKE_TELEMETRY_WRITER_URL, else an SSM get_parameter of
  /agent-platform/ducklake/telemetry_writer_url (transport's own call, not the reader client's private helper), cached
  in the state dir; botocore SigV4Auth (service "lambda", region from the URL) under
  scripts.aws_profile.resolve_aws_profile(); one botocore Config, retries {"total_max_attempts": 1} and connect plus
  read timeout at most the remaining budget, installed with set_default_client_config on the botocore session, so the
  SSM client and the assume-role STS client behind the profile both inherit it; body json.dumps(payload)
  (ensure_ascii default), Content-Type application/json; re-sign per attempt. RULE TR-2 (retry table): appends retry
  429, 503 and transport errors with full-jitter backoff (0.5 s base, 8 s cap) while the deadline allows; every other
  status returns at once. RULE TR-3 (chunking): per request <= 2000 rows per table, <= 5000 rows, <= protocol.max_items
  blob rows (counted with src.telemetry.blobs.blob_row, the blob route's single definition), and len(json.dumps(body))
  <= 5242880 measured on the exact body; data batches in record_turn order and the telemetry_sessions rows only in the
  pass's last request(s); any 413 (payload_too_large, too_many_rows, too_many_blobs or untyped) halves the chunk and
  retries down to one row. RULE TR-4 (budgets): a pass has one deadline (Stop: start + 600 s; SessionEnd: HK-4); every
  HTTP request and blob PUT timeout is min(130 s, remaining); the invoke and put callables passed to deliver_blobs carry
  the same clamp and make a single attempt each (deliver_blobs owns its own retries); deadline reached -> stop the pass
  (cursor unchanged, diagnostic deadline).
- >-
  RULE RN-1 (lock): flock the tree's lock; a Stop pass that cannot take it at once exits (the next pass catches up);
  SessionEnd per HK-4. RULE RN-2 (halt): halt.json present -> exit. RULE RN-3 (project_ref): the cursor's pin when a
  cursor exists, else transcript.project_ref_pin(tree); None -> defer (diagnostic deferred_no_pin, no request, no
  cursor). RULE RN-4 (pass): record_turn(FsTree(transcript), cursor, project_ref=..., session_final=final);
  PinOrderError, CursorError or SourceMutated -> halt with that class name. No rows -> persist next_cursor (when not
  None) and exit.
- >-
  RULE RN-5 (describe check): describe once per pass: append_telemetry in actions, data_path_is_smoke true (until 2c
  rebinds production), caps no lower than TR-3's limits, and blob_delivery.protocol_from_describe(body) succeeds; any
  failure -> stop with diagnostic describe_mismatch (not a halt: a deploy may fix it).
- >-
  RULE RN-6 (delivery): blob_delivery.deliver_blobs over the transcripts rows with the clamped invoke and put; append its
  wire_rows in place of the transcripts rows. BlobDeliveryError refused or defect -> halt; transient or proxy -> stop.
- >-
  RULE RN-7 (responses, responses.py): 200 -> next request; 403 tenant_unresolved -> register_tenant once, retry the
  request; 422 blob_not_verified -> re-run delivery for that request once, then halt; 409, other 422 (row_rule,
  schema_gate), 400 and 403 project_unregistered -> halt, recording status, error_type, rule, column and the 0-based row
  index from the body (never values); 413 -> TR-3 re-chunk; 500 -> stop (no retry; it pages); any other status
  (401, an untyped 403, 502, 504) -> stop, never halt. RULE RN-8 (persist): after
  the last request is acknowledged, write state.json (ST-2, ST-3) and the diagnostics line. A lost cursor replays from
  scratch; a 409 then halts with diagnostic grain_conflict_after_cursor_loss.
- >-
  RULE OP-1 (operator CLI, `python -m scripts.telemetry_capture <cmd>`): `run` (the detached entry); `pass --tree
  <root.jsonl> [--final]` runs RN-1..RN-8 on that tree (refusing a tree with no pinning attachment, K-1); `status --tree`
  prints positions, halt record and the last diagnostics line (counts only); `probe --tree [--require t1,t2]` calls
  telemetry_probe with the tree's {project_ref, root session_ref, session_started_at} from its cursor, prints grain
  counts per table and exits 1 when a required table reads zero or a halt is recorded; `observe --tree` prints
  SessionStart attachment counts by source, SessionEnd pass count from diagnostics, and the count of tool-results
  sidecars whose mtime is later than their tool_result record's timestamp; `mark --tree` writes a marker file, the root
  prefix sha256 and /proc/sys/kernel/random/boot_id under the state dir, and `observe` reports whether the boot id
  changed (a reclaim happened) and whether the marker and prefix hash still match;
  `clear-halt --tree`; `register --project-ref <ref> --name <n> --remote <url>` (register_tenant, then
  register_project). No sweep exists: no pass ever starts on a tree except through its own hook or an explicit --tree.
- >-
  RULE SM-1 (c8 smoke): ref synthetic:pc-smoke-<8 hex>; register_tenant and register_project; write a temp tree whose
  records follow 3b-observation-spike/record-shapes.json and the builders in tests/fixtures/turn_capture_corpus.py
  (copied shapes; scripts/ never imports tests/): a SessionStart hook attachment whose command is
  `bash "$CLAUDE_PROJECT_DIR/.claude/hooks/session_start_log_turn.sh" --project-ref=<ref>`, a prompt, an assistant reply
  with usage and a Bash tool_use, its tool_result with a persisted tool-results sidecar above 64 KiB, an Agent tool_use
  with its <sid>/subagents/agent-<id>.jsonl child (a prompt and a reply) and its completed tool_result, a final reply.
  Run 1: stop_log_turn.py with crafted Stop stdin and OTL_TURN_CAPTURE_SMOKE_REF=<ref>, poll state.json until it
  appears (60 s), then session_end_log_turn.py with SessionEnd stdin; telemetry_probe and compare grain_counts rows per
  table to record_turn's counts (all four tables above zero) and require the blob row delivered. Run 2: delete
  state.json and replay Stop then SessionEnd the same way; per table, the sum of submitted over run 2's diagnostics
  lines equals run 1's and inserted is 0. Print counts and "PC_SMOKE PASS" or "PC_SMOKE FAIL <reason>".
- >-
  RULE DG-1 (absent usage): in observations, a usage key that is absent counts absent_usage_key (one per key), and a
  message whose usage is absent or not a dict counts absent_usage; a present non-int value still counts non_int_usage.
- >-
  RULE PN-1 (rec-4308): hook_script strips quotes from token edges, so --project-ref="a/b" reaches project_ref_pin as
  the value `"a/b`; project_ref_pin drops one leading ' or " from the value before the ref pattern. hook_script is
  unchanged (hook_name shares it). test_project_ref_pin_quoted_flag_value pins --project-ref="a/b" (red before) and
  '--project-ref=a/b' (already pins).
- >-
  Bookkeeping walk (exit-criteria-ledger.yaml met_by flip procedure): c1, c2 and c8 are all this plan's closes_criteria,
  each flipped on its own verified VP pass. At the build closure flip exactly T3.20:c8 (met_by telemetry-capture-hooks,
  on step 8's PC_SMOKE PASS), correct files_in_scope's session_start_log_turn entry to .sh and add the dated
  progress_note. c1 and c2 stay open through the build; they flip (same met_by) in the step-11 roadmap PR, only after
  step 11's real-session read-back passes.
- Execute Verification Plan steps 1-9 -- loop until pass; on an unrecoverable failure stop and RCA (Decision 55).
- >-
  Closure sequence (implement skill, git-ops handoff_sequence), each outcome reported on its own: run the code-review
  gate (fresh sibling subagent); run scripts.session.github_readiness and report each state separately (unknown is
  unproven, never PASS); set implementation_declared true in this plan; rebase onto origin/main; write the
  retrospective evidence and run scripts.session.postflight --evidence; then VP step 9 on the committed, rebased, clean
  tree to completion, then scripts.checks.validation_result --verify-head exit 0. Push, open the PR, wait for CI by
  subscription, squash-merge with Resolves: rec-4308 in the squash body (rec-4026 stays open); then VP step 12, and
  steps 10-11 only on Benjamin's word.
- >-
  Closeout notes (ops portal update_rec, get_rec_write_guidance first): narrow rec-4026's context and acceptance (this
  build satisfies today's acceptance) to what remains (the enablement and step 11's read-back and observations; the
  session denominator, durable producer diagnostics and halt signal, the durable rejection record and the offline
  conformance job, all held by the feedback-loop gate); the new acceptance must stay unsatisfiable by this build and by
  the c1/c2 flip (it names the gated items' own proof), and the c1/c2 flip PR carries step 11's probe and observe
  output as its evidence (Decision 103); rec-4026's context also names the register re-run with the new remote after
  the org transfer (rec-3905); note on rec-4292 and rec-4207 that RN-5 stops capture when the writer rebinds
  production, so the producer must be re-pointed at 2c. Close nothing directly.
- 'Report: what was implemented, the VP results, the c8 smoke counts and whether enablement is pending.'
