schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-capture-hooks
intent: >-
  Turn on the platform's first real telemetry producer: Claude Code hooks that capture every completed agent turn and
  each session end through the merged parser v3 producer and send the rows to the live telemetry writer, deterministic
  and invisible to the agent. Agent-turn friction, cost and outcome rows are the learning input for the platform's
  recursive self-improvement loop (PROJECT_CONTEXT); until they flow, telemetry is blind. The hooks land inert behind a
  committed switch, the hook-to-writer path is proven end to end against the live smoke catalog first (T3.20 c8), and
  capture of real sessions starts with a one-line enablement on Benjamin's word.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-capture-hooks.yaml
phase: >-
  T3.20 (agent-turn telemetry capture), slice 3b plan P-C of three (Benjamin, 2026-10-12). Closes T3.20 c8 at the build
  merge (the hook-to-writer path proven end to end against a live catalog before broad enablement), and c1 (SessionStart
  and Stop hooks emit per-turn events with the pre-write credential scrub) and c2 (turn-grain rows on the canonical
  tables via the writer boundary) at the enablement change, after a real session's rows are read back (post-deploy steps
  10-11). rec-4026 is the carrier. Builds after the blob-route plan (PLAN-telemetry-blob-route) is built and deployed: the
  transport calls its client. c3, c6 and c7 stay open outside slice 3b.
closes_criteria:
- T3.20:c1
- T3.20:c2
- T3.20:c8
scope:
- file: .claude/hooks/session_start_log_turn.sh
  action: Create
  purpose: >-
    The capture pin hook (bash, no venv dependency). On every SessionStart source (startup, resume, clear, compact,
    fork) it prints exactly one fixed stderr line and exits 0, writing nothing to stdout, reading no state and starting
    no pass: Claude Code then records the SessionStart attachment whose command carries --project-ref=<ref>, which P-B's
    pin rules (P-1..P-4) and fork and resume boundaries read. It never captures (rule HK-2).
- file: .claude/hooks/stop_log_turn.py
  action: Create
  purpose: >-
    The Stop and StopFailure shim (rule HK-3). Reads the hook JSON from stdin; exits 0 at once when stop_hook_active is
    true, when the switch or a guard says no (rule SW-1), or on any error; otherwise starts the capture runner fully
    detached and exits 0 without waiting. Prints nothing on any path.
- file: .claude/hooks/session_end_log_turn.py
  action: Create
  purpose: >-
    The SessionEnd hook (rule HK-4): the same switch and guards, then one final pass (session_final true) in process
    under a single deadline measured from hook start (rule TR-4); when the tree's lock is busy it detaches a final pass
    that waits for the lock instead. Exit 0 always, nothing printed.
- file: .claude/settings.json
  action: Modify
  purpose: >-
    Registers the four hooks (rule HK-1), every path resolved from $CLAUDE_PROJECT_DIR (the cloud clone path changes
    at the org transfer): SessionStart `bash "$CLAUDE_PROJECT_DIR/.claude/hooks/session_start_log_turn.sh"
    --project-ref=ontheloop` (unquoted ref token), Stop and StopFailure the stop_log_turn.py shim, SessionEnd
    session_end_log_turn.py with "timeout": 60 on its own entry. No async entries; existing hooks unchanged and in order.
- file: config/telemetry/capture.yaml
  action: Create
  purpose: >-
    The committed capture switch (rule SW-1): `enabled: false` at this build; the enablement is a one-line change on
    Benjamin's word (post-deploy step 10). Comments name the guards and the disable-only environment variable.
- file: scripts/telemetry_capture/__init__.py
  action: Create
  purpose: >-
    Package docstring: the hook-side producer runtime for Claude Code turn capture (switch, state, transport, runner,
    operator CLI and the c8 smoke). Lives under scripts/ because src/turn_capture (stdlib only) and src/telemetry_client
    (stdlib plus src.telemetry) are fenced against network and botocore imports.
- file: scripts/telemetry_capture/switch.py
  action: Create
  purpose: >-
    capture_allowed(env, repo_root) per rule SW-1 and the synthetic-bound smoke override per SW-2. Reads only the switch
    file; imports nothing outside the stdlib and yaml.
- file: scripts/telemetry_capture/state.py
  action: Create
  purpose: >-
    The per-tree state directory <transcript dir>/<session id>/telemetry-capture/ (rules ST-1..ST-4): the cursor
    envelope (cursor plus root tail check; atomic, monotonic), the lock, the halt record and bounded diagnostics.
- file: scripts/telemetry_capture/transport.py
  action: Create
  purpose: >-
    The writer client (rules TR-1..TR-4): Function URL discovery, SigV4 POST, the retry table, request chunking, and
    budget-bounded invoke and put callables (every timeout clamped to the remaining budget).
- file: scripts/telemetry_capture/runner.py
  action: Create
  purpose: >-
    run_pass(transcript_path, session_id, event, final, deadline) per rules RN-1..RN-8: lock, halt check, cursor load
    and tail check, project_ref resolution and deferral, record_turn, the describe check, blob delivery through
    src.telemetry_client.blob_delivery, chunked appends in R7 order, cursor persistence only after every request is
    acknowledged, diagnostics. RN-7's table lives in responses.py, keeping runner.py under 400 SLOC (Decision 128).
- file: scripts/telemetry_capture/responses.py
  action: Create
  purpose: >-
    RN-7's response table as data plus classify(status, body) -> next action (ok, retry, rechunk, register_tenant,
    redeliver, halt, stop) and the value-free halt fields (status, error_type, rule, column, row index).
- file: scripts/telemetry_capture/__main__.py
  action: Create
  purpose: >-
    The runner entry the hooks detach (`python -m scripts.telemetry_capture run ...`) and the operator CLI over the same
    runner (rule OP-1): pass, status, probe, observe, mark, clear-halt, register.
- file: scripts/telemetry_capture/smoke.py
  action: Create
  purpose: >-
    The c8 proof (rule SM-1): registers synthetic:pc-smoke-<hex>, writes a synthetic transcript tree (one tool output
    above 64 KiB so blob delivery runs, one completed subagent spawn so all four tables carry rows) to a temp dir, drives
    the real Stop and SessionEnd entry points with crafted stdin, reads back with telemetry_probe, deletes the cursor and
    replays both entry points for the writer's identical-resend no-op. Prints counts and PASS/FAIL lines only.
- file: src/turn_capture/observations.py
  action: Modify
  purpose: >-
    Diagnostics only (rule DG-1): an absent model_call usage key counts absent_usage_key, and an absent or non-dict usage
    object counts absent_usage. No row changes, so no parser_version bump and no golden regeneration.
- file: src/turn_capture/transcript.py
  action: Modify
  purpose: >-
    rec-4308 (rule PN-1): project_ref_pin accepts a quoted --project-ref value by value-level quote stripping inside
    project_ref_pin only; hook_script (shared with hook_name) is unchanged. Pin only: no row change for any existing tree.
- file: tests/hooks/test_session_start_log_turn.py
  action: Create
  purpose: >-
    The pin hook: one stderr line, empty stdout, exit 0 for every source including fork, no file written anywhere, no
    venv needed (runs under env -i with only PATH).
- file: tests/hooks/test_stop_log_turn.py
  action: Create
  purpose: >-
    rec-4026's acceptance node test_turn_rows_written_once_per_turn (two Stop passes over a growing tree on a fake writer:
    every row sent exactly once, the cursor advances only after acknowledgement), the detach proof
    test_shim_detaches_silently (the test writes a sleeping fake runner module to tmp_path, puts tmp_path on PYTHONPATH
    and runs a wrapper that sets the shim's RUNNER_MODULE before calling its main(); the shim exits while the fake still
    sleeps, with empty stdout and stderr, and the fake records a new session id and /dev/null descriptors; the test reaps
    the child), stop_hook_active and guard inertness.
- file: tests/hooks/test_session_end_log_turn.py
  action: Create
  purpose: >-
    The final pass emits the root close row; against a hung fake writer the hook returns before its deadline
    (test_session_end_returns_within_deadline_against_a_hung_writer, run in process with the deadline scaled down through
    main()'s deadline parameter); a busy lock, or too little budget left after record_turn, detaches a final pass; every
    failure exits 0 silently.
- file: tests/hooks/test_capture_hook_registration.py
  action: Create
  purpose: >-
    The settings.json registrations (HK-1), "timeout": 60 on SessionEnd only, no async entries, existing order kept,
    every capture command resolved from $CLAUDE_PROJECT_DIR and no literal /home/user/ path in the new hooks or
    scripts/telemetry_capture, and pin parity: project_ref_pin over an attachment built from the registered SessionStart
    command returns ontheloop.
- file: tests/telemetry_capture/__init__.py
  action: Create
  purpose: Mirror-test package marker (Decision 131).
- file: tests/telemetry_capture/test_switch.py
  action: Create
  purpose: >-
    Mirror test for switch.py (SW-1, SW-2), including test_switch_off_keeps_every_hook_inert (the hook entry points run
    in process, so the suite's socket guard covers them).
- file: tests/telemetry_capture/test_state.py
  action: Create
  purpose: Mirror test for state.py (ST-1..ST-4), including the tail-check mismatch.
- file: tests/telemetry_capture/test_transport.py
  action: Create
  purpose: Mirror test for transport.py (TR-1..TR-4) on an injected HTTP seam; no socket.
- file: tests/telemetry_capture/test_runner.py
  action: Create
  purpose: >-
    Mirror test for runner.py (RN-1..RN-8) on a fake writer: deferral, halts, re-chunk on 413 and too_many_blobs, the
    blob-row cap, stops, lost-cursor and tail-mismatch replay (the lost cursor is replaced, not compared), a failed last
    chunk leaves the cursor and finalize_cuts unchanged, the describe check, blob delivery wiring, and
    test_sent_payloads_carry_no_secret_shaped_value (append bodies and blob PUT bodies both; one seeded secret sits
    inside a tool output above 64 KiB, so a PUT body carries its scrubbed form).
- file: tests/telemetry_capture/test_responses.py
  action: Create
  purpose: Mirror test for responses.py (every row of RN-7's table, including the default stop for unlisted statuses).
- file: tests/telemetry_capture/test_main.py
  action: Create
  purpose: Mirror test for __main__.py (the detached entry and every operator subcommand on fakes).
- file: tests/telemetry_capture/test_smoke.py
  action: Create
  purpose: Mirror test for smoke.py on a fake writer (the live run is VP step 8).
- file: tests/telemetry/test_process_event_name_rule.py
  action: Modify
  purpose: >-
    _HOOK_EVENTS gains SessionEnd and StopFailure, so every registered capture hook command still yields a contract-valid
    process_event name.
- file: tests/turn_capture/test_observations.py
  action: Modify
  purpose: The absent_usage_key and absent_usage counters (DG-1), node test_absent_usage_keys_are_counted.
- file: tests/turn_capture/test_transcript.py
  action: Modify
  purpose: rec-4308's acceptance node test_project_ref_pin_quoted_flag_value.
- file: docs/contracts/ports.yaml
  action: Modify
  purpose: >-
    Decision 212 cl.3: PC-01's description names scripts/telemetry_capture/transport.py as a further function_url client
    (no port row, cl.6), and a new structural_assumptions row SA-02 records the capture runtime's assumptions: Claude
    Code's hook stdin fields and output-channel semantics (an exit-0 stderr line records an invisible SessionStart
    attachment), its transcript layout (<transcript dir>/<sid>/ with subagents and tool-results, tolerating the foreign
    telemetry-capture/ directory) and .claude/settings.json registration (status open, owning_item "T4.24:c9", the SA-01
    precedent). One amendment_log entry (Class D, field_add, semantic_break false). Edited only after the blob-route
    build, which also touches this file, has merged.
- file: docs/contracts/file-router.yaml
  action: Modify
  purpose: >-
    A telemetry-capture route beside the turn-capture route, its targets listed explicitly (validate_placement takes no
    globs): scripts/telemetry_capture/, .claude/hooks/session_start_log_turn.sh, .claude/hooks/stop_log_turn.py,
    .claude/hooks/session_end_log_turn.py and config/telemetry/capture.yaml; one amendment_log entry. Edited only after
    the blob-route build has merged (the org-transfer plan also appends one route; a trivial merge).
- file: docs/ROADMAP-PLATFORM.yaml
  action: Modify
  purpose: >-
    Bookkeeping walk (tier-item-lifecycle.yaml bookkeeping_walk): at the build, flip T3.20 c8 open -> met with met_by
    this plan, correct files_in_scope's session_start_log_turn entry to .sh, and add a dated progress_note line (c1 and c2
    flip at enablement; c3, c6, c7 outside slice 3b). At the enablement change (step 10), flip c1 and c2 after step 11's
    read-back.
bundled_recommendations:
- rec-4308
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
- >-
  c1/c2 (rec-4026's acceptance): two Stop passes over a growing transcript send every row exactly once in R7 order (data
  batches, then the telemetry_sessions batch last), and the cursor advances only after every request is acknowledged
  (tests/hooks/test_stop_log_turn.py::test_turn_rows_written_once_per_turn).
- >-
  c1: the agent never sees the producer. No capture hook writes stdout; the Stop and SessionEnd hooks write no stderr;
  the SessionStart pin hook writes exactly one fixed stderr line; every hook exits 0 on every path, and the SessionEnd
  hook returns before its 60 s timeout even against a hung writer. The Stop shim exits while its detached runner (own
  session id, /dev/null descriptors) is still running.
- >-
  c1: capture runs only when the committed switch is on, CLAUDE_CODE_REMOTE is "true", GITHUB_ACTIONS is not "true",
  OTL_TURN_CAPTURE is not "off" and credentials resolve, or under the synthetic:-bound smoke override (SW-2); otherwise
  every hook exits 0 having opened no socket and written nothing under the session directory. At this build the switch
  is off.
- >-
  c2: a permanent refusal (409, 422 including blob_not_verified after one re-delivery, 400, 403 project_unregistered) or
  a producer pin error halts the tree: a halt record is written, later passes send nothing, and the cursor never advances
  past unacknowledged rows. 429 and 503 retry within the deadline; 413 payload_too_large and too_many_blobs re-chunk;
  5xx and blob transport failures stop the pass without halting. No request carries more blob rows than the writer's
  max_items.
- >-
  c2: a lost cursor, or a stored cursor whose root tail check fails, replays from scratch: identical rows are no-ops and
  a diverged key halts with diagnostic grain_conflict_after_cursor_loss. No pass starts on a tree without a pinning
  SessionStart attachment (deferral), and the SessionStart hook never runs a pass, so a fork is first captured only
  after its own fork attachment exists.
- >-
  c1's launch criterion holds on the hook path: a tree seeded with an AWS access key, an Anthropic key, a GitHub PAT and
  a Bearer token sends none of them in any request body.
- >-
  c8: scripts.telemetry_capture.smoke, driving the real Stop and SessionEnd entry points against the live writer under a
  registered synthetic: ref over a tree with one blob-delivered transcript row and one completed subagent spawn, reads
  back through telemetry_probe the rows record_turn built for all four tables; with the cursor deleted, replaying Stop
  then SessionEnd submits per table exactly the first run's total and inserts 0.
- >-
  c1 and c2 (the flip condition, after enablement): for a real cloud session on main, `probe --tree` reports rows above
  zero for observations and transcripts and the session's diagnostics show no halt; c1 and c2 flip only then.
- >-
  An absent model_call usage key and an absent usage object are counted in the pass diagnostics, with no row change.
  project_ref_pin accepts --project-ref="a/b" (rec-4308).
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Run rec-4026's acceptance node: two Stop passes over a growing tree on a fake writer send every row once.
  command: >-
    bin/venv-python -m pytest tests/hooks/test_stop_log_turn.py::test_turn_rows_written_once_per_turn -q
  expected: >-
    Exit 0, 1 passed. Red before: target_absent (the file does not exist on the plan-only tree).
  fix_if: >-
    A row sent twice: the cursor was persisted before acknowledgement or the prior set is not built from the cursor. A
    row missing: a chunk failure did not stop the pass, or the sessions batch was sent before the data batches.
  hermetic: true
  graduation: graduate
  graduation_check_id: capture-stop-pass-sends-each-row-once
  expected_literals:
  - 1 passed
- step: 2
  phase: pre-deploy
  action: >-
    Prove the Stop shim detaches silently: the real shim, run through a test wrapper that points RUNNER_MODULE at a
    sleeping fake, exits while the fake still runs, with empty stdout and stderr; the fake reports a new session id and
    /dev/null descriptors.
  command: >-
    bin/venv-python -m pytest tests/hooks/test_stop_log_turn.py::test_shim_detaches_silently -q
  expected: >-
    Exit 0, 1 passed. Red before: target_absent.
  fix_if: >-
    The shim waits: a pipe is still attached to the child (use subprocess.DEVNULL for all three descriptors and
    start_new_session=True). Output appears: an import or exception path prints.
  hermetic: true
  graduation: graduate
  graduation_check_id: capture-stop-shim-detaches-silently
  expected_literals:
  - 1 passed
- step: 3
  phase: pre-deploy
  action: >-
    Prove the registrations and the pin parity: settings.json registers the four hooks as HK-1 says, and project_ref_pin
    over an attachment built from the registered SessionStart command returns ontheloop.
  command: >-
    bin/venv-python -m pytest tests/hooks/test_capture_hook_registration.py tests/hooks/test_session_start_log_turn.py -q
  expected: >-
    Exit 0, all passed. Red before: target_absent.
  fix_if: >-
    Pin parity fails: the token is quoted or a wrapper token precedes the script (H-1 takes the first .py/.sh token).
  hermetic: true
  graduation: graduate
  graduation_check_id: capture-hooks-registered-with-pin-token
  expected_literals:
  - passed
- step: 4
  phase: pre-deploy
  action: >-
    Prove c1's launch criterion on the hook path: a tree seeded with an AWS access key, an Anthropic key, a GitHub PAT and
    a Bearer token, run through the runner on a fake writer, sends none of them in any request body.
  command: >-
    bin/venv-python -m pytest tests/telemetry_capture/test_runner.py::test_sent_payloads_carry_no_secret_shaped_value -q
  expected: >-
    Exit 0, 1 passed. Red before: target_absent.
  fix_if: >-
    A secret appears: a row field bypasses src/turn_capture/scrub.py (fix in the producer, never in the transport), or
    the runner sends something other than record_turn's rows.
  hermetic: true
  graduation: graduate
  graduation_check_id: capture-hook-payloads-scrubbed
  expected_literals:
  - 1 passed
- step: 5
  phase: pre-deploy
  action: >-
    Run rec-4308's acceptance node, the absent-usage counter node and the SessionEnd deadline node.
  command: >-
    bin/venv-python -m pytest tests/turn_capture/test_transcript.py::test_project_ref_pin_quoted_flag_value
    tests/turn_capture/test_observations.py::test_absent_usage_keys_are_counted
    tests/hooks/test_session_end_log_turn.py::test_session_end_returns_within_deadline_against_a_hung_writer -q
  expected: >-
    Exit 0, 3 passed. Red before: target_absent.
  fix_if: >-
    The quoted node fails: the value's leading quote survives (H-1 already strips the trailing one). The deadline node
    fails: an HTTP, PUT, SSM or STS timeout is not clamped to the remaining budget, or the lock wait is outside the
    deadline.
  hermetic: true
  graduation: graduate
  graduation_check_id: capture-pin-quote-usage-counter-session-end-deadline
  expected_literals:
  - 3 passed
- step: 6
  phase: pre-deploy
  action: >-
    Run every new and modified test module.
  command: >-
    bin/venv-python -m pytest tests/hooks/test_session_start_log_turn.py tests/hooks/test_stop_log_turn.py
    tests/hooks/test_session_end_log_turn.py tests/hooks/test_capture_hook_registration.py tests/telemetry_capture
    tests/telemetry/test_process_event_name_rule.py tests/turn_capture/test_observations.py
    tests/turn_capture/test_transcript.py tests/turn_capture/test_package_boundary.py -q
  expected: >-
    Exit 0, all passed.
  fix_if: >-
    Any failure: fix at root; never relax a guard or the silence assertions.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Whole-file re-runs of this plan's own test modules (vp-red-before.yaml hermetic_authoring (v)); the --pre pytest_diff
    and the full tier's unit-test scaffold run them on every change.
- step: 7
  phase: pre-deploy
  action: >-
    Prove the switch keeps everything inert: with the committed switch off, each hook entry run with crafted stdin exits
    0, opens no socket and writes nothing under the session directory.
  command: >-
    bin/venv-python -m pytest tests/telemetry_capture/test_switch.py::test_switch_off_keeps_every_hook_inert -q
  expected: >-
    Exit 0, 1 passed. Red before: target_absent.
  fix_if: >-
    A file appears under telemetry-capture/: a shim checks the switch after touching state.
  hermetic: true
  graduation: graduate
  graduation_check_id: capture-switch-off-keeps-hooks-inert
  expected_literals:
  - 1 passed
- step: 8
  phase: pre-deploy
  action: >-
    The c8 smoke proof against the live writer (smoke catalog): register a synthetic: ref, drive the real Stop and
    SessionEnd entry points over a synthetic tree with one blob-delivered row and one completed subagent spawn, read back
    with telemetry_probe, delete the cursor and replay both entry points.
  command: >-
    bin/venv-python -m scripts.telemetry_capture.smoke
  expected: >-
    Exit 0; per-table read-back counts equal the counts record_turn built, all four tables above zero; the blob row was
    delivered (uploaded or existed); the replay's submitted per table equals the first run's total and inserted is 0 for
    every table; the last line is "PC_SMOKE PASS". Counts only, no content.
  fix_if: >-
    403 tenant_unresolved: register_tenant was not called. 403 project_unregistered: the synthetic: ref was not
    registered first. Counts short: the runner deferred (no pinning attachment in the synthetic tree) or the read-back
    used a different session_started_at. Credentials or URL missing: run from a session with the agent_platform profile.
  hermetic: false
  graduation: not-applicable
- step: 9
  phase: pre-deploy
  action: >-
    Lint the changed Python files and run the full tier, as the handoff policy requires before commit.
  command: >-
    bin/venv-python -m ruff check scripts/telemetry_capture .claude/hooks/stop_log_turn.py
    .claude/hooks/session_end_log_turn.py tests/hooks tests/telemetry_capture src/turn_capture && bin/venv-python -m
    ruff format --check scripts/telemetry_capture .claude/hooks tests/hooks tests/telemetry_capture src/turn_capture &&
    bin/venv-python -m scripts.validate
  expected: >-
    ruff exit 0, then the full tier ends with "All checks passed." and exit 0.
  fix_if: >-
    Any failure: fix at root and rerun the full tier from the start (handoff_policy).
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: post-deploy
  action: >-
    Enablement, only on Benjamin's word in the thread and only after the reclaim observation (OP-1 mark, then observe
    after the session's VM was reclaimed: boot id changed, marker under <sid>/telemetry-capture/ present, root prefix
    hash equal; record the result in the thread, or "no reclaim seen, unproven" if none occurred, and proceed on his word
    either way). Then register ontheloop explicitly with the repository's GitHub URL of the day (origin's URL;
    rec-4026 owns the re-run after the org transfer: a new version of the project row, same project_id), and a one-line
    PR sets enabled: true and squash-merges on green CI outside the org-transfer freeze window.
  command: >-
    bin/venv-python -m scripts.telemetry_capture register --project-ref ontheloop --name "On The Loop platform"
    --remote "$(git remote get-url origin)" && git fetch origin main --quiet && git show
    origin/main:config/telemetry/capture.yaml | grep -q '^enabled: true'
  expected: >-
    The register call answers ok (created or existing) and main's switch reads enabled: true.
  fix_if: >-
    No word from Benjamin: do not enable; the build stays merged and inert. The marker did not survive or the prefix
    hash differs: report it; the tail check (ST-3) turns that case into a replay, so enablement may still proceed on his
    word.
  hermetic: false
- step: 11
  phase: post-deploy
  action: >-
    After enablement, read a real cloud session's rows back from the writer and record the open observations; then flip
    T3.20 c1 and c2 (bookkeeping walk) in a PR that touches only their status and met_by in docs/ROADMAP-PLATFORM.yaml.
  command: >-
    T="$(ls -t ~/.claude/projects/*/*.jsonl | head -1)" && bin/venv-python -m scripts.telemetry_capture probe --tree "$T"
    --require telemetry_observations,telemetry_transcripts && bin/venv-python -m scripts.telemetry_capture observe --tree "$T"
  expected: >-
    probe prints per-table row counts from telemetry_probe for this session's {project_ref, session_ref,
    session_started_at} and exits 0 only when observations and transcripts are above zero and no halt is recorded;
    observe prints the counts of SessionStart
    attachments by source (resume included), SessionEnd passes in diagnostics.jsonl, and tool-results sidecars written
    after their tool_result record. Unobserved items are reported as unproven, never as passes.
  fix_if: >-
    A halt: read diagnostics.jsonl (rule, column, row index) and the writer's C6 log line; fix the producer, then
    clear-halt. Zero rows: the pin attachment is missing (deferred_no_pin) or the switch is off on the session's branch.
  hermetic: false
- step: 12
  phase: post-deploy
  action: >-
