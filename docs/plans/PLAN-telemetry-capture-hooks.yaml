constraints:
- >-
  Only the files listed in scope may be modified, plus the registry shards of graduated steps; the roadmap edit is the
  bookkeeping walk's c8 flip, the files_in_scope re-grounding and the progress_note only (c1 and c2 flip in the
  enablement change, step 11).
- >-
  Agent invisibility is structural (operator ruling 2026-10-09): no capture hook writes stdout; only the SessionStart pin
  hook writes stderr (one fixed line, no values); every hook exits 0; Stop and StopFailure never run a pass in the hook
  process; no hook entry is async.
- >-
  No hard-coded clone path: hook commands resolve from $CLAUDE_PROJECT_DIR, the shims take the repo root from their
  own file location and the state directory from the hook's transcript_path; no
  environment variable can redirect the production runner module (test seams patch it in process).
- >-
  Do not edit the blob-route plan's files (src/telemetry_client/*, src/telemetry/blobs.py and request.py, the writer
  Lambda, .importlinter, the telemetry contracts, tests/turn_capture/test_record_turn.py,
  test_capture_ducklake_integration.py, test_real_transcript_conformance.py); call its client, never change it. The
  shared files docs/contracts/ports.yaml and docs/contracts/file-router.yaml are edited only after the blob build merged.
- >-
  No Lambda, Terraform, IAM, Class A contract or Decision change. The only active-manifest hit is docs/ROADMAP-PLATFORM.yaml
  as a data-pipeline asset (the rec-2910 over-inclusion; deploy-prod-lambdas.yml's trigger paths exclude it): scripts/
  is not Lambda-packaged and src/turn_capture is excluded by name (Decision 79), so V2 holds and no deploy is owed.
- >-
  The writer is pinned to the smoke catalog (Decision 216's disposable catalog): this plan writes no production rows
  (rec-4101's monitor precedes those), and after enablement real sessions' rows land there until 2c rebinds production;
  RN-5's data_path_is_smoke check then stops capture until the producer is re-pointed (noted on rec-4292 and rec-4207).
- >-
  Not in 3b (feedback-loop gate, Benjamin 2026-10-12): the SessionStart session denominator, durable producer-diagnostics
  storage and an operator signal for producer-side halts, a durable rejection record, the offline conformance job. They
  stay on rec-4026, which remains open as their carrier.
- >-
  Persist the cursor only after every request of the pass is acknowledged; never write a cut before sending (ADVICE-5
  F1: record_turn builds the prior set from finalize_cuts, so an unsent cut would mark its rows emitted).
- No rescue agents or workaround loops (Decision 55); a pinned rule that cannot hold on real data is a STOP back to /plan.
