    'ontheloop'); s=[x for x in r.sessions if x['event_kind']=='open']; m=[x for x in r.observations if
    x['observation_type']=='model_call']; print('v', PARSER_VERSION, 'open_with_key', sum(1 for x in s if
    x.get('harness_session_key')), 'open_with_checkout', sum(1 for x in s if x.get('checkout_sha')), 'open_with_base',
    sum(1 for x in s if x.get('checkout_base_sha')), 'calls', len(m),
    'with_requested_model', sum(1 for x in m if x.get('requested_model')), 'not_final', sum(1 for x in m if
    x.get('usage_final') is False), 'resume_with_checkout', sum(1 for x in r.sessions if x['event_kind']=='resume' and
    x.get('checkout_sha'))); assert PARSER_VERSION == 4 and s and all(x.get('harness_session_key') for x in s if
    x['entity_ref']==t.session_id) and all(x.get('requested_model') for x in m) and any(x.get('checkout_sha') for x in s
    if x['entity_ref']==t.session_id)" "$T" && bin/venv-python -m
    scripts.telemetry_capture probe --tree "$T" --require telemetry_observations,telemetry_transcripts,telemetry_sessions
  expected: >-
    Prints the counts with parser 4 (open_with_base measures the back-validation key's coverage); the root open row
    has harness_session_key and checkout_sha (asserted), every
    model_call has requested_model; resume rows with checkout_sha are reported when the session has resumed; the probe
    exits 0 with rows above zero and no halt.
