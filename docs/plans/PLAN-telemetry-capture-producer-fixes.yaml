    Exit 0, every node passes, the golden harness's header check, golden reconcile, oracle agreement and mutation nodes
    included.
  fix_if: >-
    A golden harness failure against an authored value is resolved by re-deriving it by hand from the formula, never by
    copying verb or oracle output. An oracle-versus-verb disagreement with no authored value behind it, or any golden
    harness file other than the two derived_golden files needing a change (scripts/telemetry_verify/**,
    tests/telemetry_verify/**, tests/fixtures/telemetry_golden_chain.py, tests/telemetry/test_derived_layer_reconciliation.py),
    means stop and escalate to the coordinator, never an inline edit.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Its nodes are the golden harness's graduated rows (telemetry-derived-layer-golden-reconcile, -mutation-evidence,
    -oracle-agreement, -conflicts-and-generations, -delivery-independence, telemetry-verify-ledger-and-shape-classify,
    telemetry-verify-oracle-matches-committed-cases), and the full tier runs them. Not hermetic for replay: a whole-module
    run whose cost-dominant modules the fast tier's pytest_diff selects on this diff (exception (v)'s rationale), measured
    at 155 s on the v3 tree and about 4 minutes on the build, above validate_vp_replay's 120 s MAX_AGGREGATE_SECONDS;
    the contract names no cost carve-out yet (rec-4421).
