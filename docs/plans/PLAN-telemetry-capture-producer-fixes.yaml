  command: >-
    T="$(ls -t ~/.claude/projects/*/*.jsonl | head -1)" && bin/venv-python -c "import sys; from pathlib import Path;
    from src.turn_capture.transcript import FsTree, project_ref_pin; from src.turn_capture.record_turn import
