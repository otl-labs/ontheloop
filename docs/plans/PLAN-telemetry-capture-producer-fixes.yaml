schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-capture-producer-fixes
intent: >-
  One parser_version bump (3 -> 4) of the claude_code transcript producer fixing the defects the slice 4 verification
  review found, so slice 4 (rec-4025) can join, reconcile and trust captured sessions: (1) each session row records the
  harness session id and the checkout the segment ran; (2) model_calls record the requested model, reasoning effort and
  the 1h/5m cache-write split; (3) rec-4354, partial sub-agent usage is flagged non-final and a sync sub-agent's last
  call takes the spawn result's final usage; (4) rec-4358, a background sub-agent's outcome follows its completion
  notice; (5) rec-4359, the capture switch is read from main; (6) rec-4382, every segment before a resume gets its close
  row. Every value is a typed column from PLAN-telemetry-column-additions, derived from the transcript alone (envelope
  R7). Telemetry is the learning signal for the recursive self-improvement loop (PROJECT_CONTEXT; checkout_base_sha and
  requested_model can also serve Decision 221's arm stamps and pinned versions); wrong tokens, outcomes or missing
  closes would teach it the wrong lessons.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-capture-producer-fixes.yaml
phase: >-
  T3.20 (agent-turn telemetry capture): producer correctness fixes from the slice 4 review, approved by Benjamin on
  2026-10-17 (soft-warn category ad_hoc_rec: a bundle of rec fixes). Closes no exit criterion (c3 is slice 4's orphan
  monitor; c6 and c7 are outside capture correctness). Preconditions: PLAN-telemetry-column-additions is merged AND its
  governed deploy run is green (the writer refuses undeclared columns with a sticky halt), and PLAN-telemetry-golden-harness's
  build is merged (it authors parser_version 3 values only and runs only while PARSER_VERSION is 3; coordinator
  ordering, 2026-10-17). V3 because the build proves the new rows against the live smoke-catalog writer; nothing here
  is Lambda-packaged and nothing deploys.
scope:
- file: src/turn_capture/provenance.py
  action: Create
  purpose: >-
    Session provenance, pure (stdlib and src.turn_capture only). pin_facts(att) parses the SessionStart pin hook's
    stderr line (rule PV-1) into (checkout_sha, checkout_base_sha, checkout_dirty), each None for "unknown" or absent;
    open_provenance(stream) reads the LAST pin attachment before the stream's first prompt record (PV-2);
    resume_provenance(stream, resume_rec) reads the last pin attachment inside that resume's hook group (PV-3; a hook group
    ends at the next prompt or assistant record, streams._walk's own reset rule, the one definition PV-3, SC-3 and the
    raw walks share);
    harness_session_key(stream, bound) reads the first remote_session_change attachment at or before the open row's bound
    and returns its url's last path segment when it matches ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$, else None (PV-4). Each
    miss is counted in the pass diagnostics (rule DG-1).
- file: src/turn_capture/usage.py
  action: Create
  purpose: >-
    model_call usage columns, pure: usage_columns(resp, spawn_usage, diag) returns the four token classes,
    reasoning_tokens, cache_creation_1h_tokens, cache_creation_5m_tokens, requested_model, reasoning_effort, usage_final
    and usage_source per rules US-1..US-4, moving the existing token/reasoning extraction out of observations.py
    unchanged in meaning. Every value it emits satisfies its column's write rule or is NULL and counted.
- file: src/turn_capture/streams.py
  action: Modify
  purpose: >-
    Rule BN-1: every background Spawn (in any stream) gains notices, each later record of its spawning stream that is a
    <task-notification> naming the agent, in file order; notice_status(rec) returns the <status> token
    ([a-z_]{1,32}), "malformed" when the tag holds anything else, or None when there is no tag. A background spawn in the
    ROOT stream with no notice before a later root SessionStart:resume boundary is complete at that boundary
    (completed_at_boundary true, close_rec None); a notice for it arriving after that boundary is counted
    notice_after_boundary. Spawns in child streams complete only at a notice (no cross-file boundary). Sync spawns are
    unchanged. Stays under 500 SLOC.
- file: src/turn_capture/sessions.py
  action: Modify
  purpose: >-
    SESSION_COLUMNS gains harness_session_key, checkout_sha, checkout_base_sha, checkout_dirty. Open rows carry PV-2 and
    PV-4 values; resume rows carry PV-3 values and are due only once their hook group has ended (rule SC-3); one close
    row per root resume boundary for the segment before it (SC-1, SC-2); background agent close rows one per notice with
    the BN-2 outcome mapping; rec-4309's counter (DG-1). build_sessions and build_agents take the pass diag Counter.
- file: src/turn_capture/observations.py
  action: Modify
  purpose: >-
    OBSERVATION_COLUMNS gains usage_final, usage_source, requested_model, reasoning_effort, cache_creation_1h_tokens,
    cache_creation_5m_tokens; the model_call row takes its usage columns from usage.usage_columns, passing the sync spawn
    result's usage for the child stream that spawn owns (US-3). No other row changes.
- file: src/turn_capture/record_turn.py
  action: Modify
  purpose: >-
    PARSER_VERSION 4, PRODUCER_VERSION "turn-capture-4"; _build_all passes the diag Counter to build_sessions and
    build_agents. Cut logic is unchanged: a resume boundary records no finalization cut (SC-1 derives the close from the
    tree), so the cursor's cuts grow only at SessionEnd passes.
- file: .claude/hooks/session_start_log_turn.sh
  action: Modify
  purpose: >-
    Rule PV-1: prints ONE stderr line "[session_start_log_turn] capture pin checkout=<HEAD|unknown> base=<merge-base of
    HEAD and origin/main|unknown> dirty=<true|false|unknown>" for the repository two levels above the script, each git
    call bounded by timeout 5 and each sha validated (^[0-9a-f]{40}([0-9a-f]{24})?$) before printing; dirty from git
    --no-optional-locks status --porcelain --untracked-files=no (never refreshes or locks the index; the precedent is
    scripts/checks/validation_result.py). Reads no stdin, writes no file, prints nothing on stdout, exits 0 on every path
    (git absent, not a repository, a timeout).
- file: scripts/telemetry_capture/switch.py
  action: Modify
  purpose: >-
    Rule SW-3 (rec-4359): switch_state(repo_root) -> (enabled, source). When git -C <repo_root> rev-parse
    --show-toplevel resolves to repo_root itself, try origin/main then main: a ref that resolves (git rev-parse --verify
    -q <ref>^{commit}) is decisive, its config/telemetry/capture.yaml read with git show <ref>:<path> and parsed as
    today, and a missing or malformed file at a resolving ref is OFF (never a fall-through, so deleting the file on main
    stops capture); only a ref that does not resolve falls through. Otherwise (or when neither ref resolves) the working
    tree, as today. Every git call is bounded by 2 s; a timeout counts as unresolved. switch_mode(env, repo_root) ->
    (mode, source | None) applies today's environment precedence and then switch_state; source is None when no switch
    read happens (OTL_TURN_CAPTURE=off, GITHUB_ACTIONS, the SMOKE override). switch_enabled, capture_allowed (the Stop and
    SessionEnd shims) and capture_mode (the runner; it wraps switch_mode) keep their signatures; switch_enabled returns
    switch_state(repo_root)[0], so there is one read path. OTL_TURN_CAPTURE=off,
    GITHUB_ACTIONS and the SW-2 smoke override keep their precedence. Still stdlib and yaml only.
- file: scripts/telemetry_capture/runner.py
  action: Modify
  purpose: >-
    Each pass's diagnostics line records the key switch_source:<source> (origin_main | main | working_tree) with count
    1, so a session that fell back to its own checkout is visible (DG-1); a pass with no switch read (the SMOKE override)
    records switch_source:none. The source comes from the same read that decided the mode (switch.py's switch_mode),
    never a second git read. test_diagnostics_record_the_switch_source pins both cases. No other behaviour changes.
- file: scripts/telemetry_capture/transport.py
  action: Modify
  purpose: >-
    make_client keeps no_credentials for an absent credential (get_credentials() None) and reports credential_error when
    the profile, STS or credential chain raised (the SessionEnd cause rec-4407 must establish), both fixed tokens,
    neither carrying a message; CaptureUnavailable's docstring names credential_error.
- file: scripts/telemetry_capture/smoke.py
  action: Modify
  purpose: >-
    The c8 synthetic tree gains a pin attachment carrying synthetic checkout facts, a remote_session_change attachment,
    requestedModel, effort and a cache_creation split on its assistant records, and a sync sub-agent whose last call has
    no stop_reason with a matching spawn-result usage, so the live read-back proves the writer accepts every new column.
    Counts only, as today.
- file: config/telemetry/parser_versions.yaml
  action: Modify
  purpose: >-
    claude_code current 4; history entry v4 (date, the new golden_digest, full_output_cap_bytes 8388608,
    signature_prefixes [hook, gate, precommit], reason naming this plan and the six fixes, and that input_key, earmarked
    for v4 by PLAN-telemetry-parser-v3, moves to a later version). Past entries untouched.
- file: config/telemetry/capture.yaml
  action: Modify
  purpose: >-
