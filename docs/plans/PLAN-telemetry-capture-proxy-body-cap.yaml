  - "No backfill: step 8 is ordinary capture of a transcript that still exists; reclaimed sessions are not recovered."
  - "No existing assertion is loosened (Decision 235); exact-header-dict assertions gain the new key as a planned change citing acceptance_criteria[0]."
  - "No rescue agents or workaround loops (Decision 55)."
