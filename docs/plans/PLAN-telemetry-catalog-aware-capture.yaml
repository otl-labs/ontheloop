    (verify.py _Check.run, before the tree lock, after its unlocked read of the verify state) as the counted, non-benign
    status verify_error:TelemetryCatalogUnresolved: the detached check records it, backs off with a growing retry and
    adds to incomplete_streak, so verify_incomplete fires at the streak threshold as for any failing check; _cmd_run's
    blanket except never sees it.
- file: scripts/telemetry_capture/verify.py
  action: Modify
  purpose: >-
    PR catalog awareness. (1) _Check.run first reads self.vstate = self.state.verify_state() (an unlocked read, safe
    because every state write is a temp file plus os.replace; _load re-reads it under the lock as today), then resolves
    the reader's catalog once, before the tree lock and only when self.credentials() is true (getattr(raw_reader,
    "catalog", None), the routed reader's): a failure there is the counted status verify_error:TelemetryCatalogUnresolved
    and no lock is taken until _finish's write, where _settlement and _finish compute from that pre-read state, so
    incomplete_streak and retry_s grow across failures and verify_incomplete fires at the streak threshold; _write then
    sends no verify_catalog (it is written only after _load, which needs the tree's recorded catalog), so the stored one
    stays. Without credentials nothing is resolved
    (no SSM call), the transcript legs run as today and the check ends with the benign no_credentials in _read_stored, so
    expired credentials never become a non-benign streak. No SSM call happens inside the lock window. (2) _load gains the
    catalog_skip token beside parser_version_skip: when that resolved catalog is set and the tree's recorded catalog
    (Loaded.catalog) differs, the check stops with catalog_skip, so a check never reads a tree in the catalog it was not
    sent to; PER_TREE_SKIPS gains catalog_skip. (3) Rule ST-6: _load takes its verify state through
    state.verify_view(verify_state, Loaded.catalog), so after an RN-9 reset the cached root_session_id (minted from
    catalog-scoped tenant and project ids, Decision 199 cl.3) is never used and _root_session_id re-derives it from the
    reader's catalog, and last_ledger_line and held_ledger_line restart at -1. _write records verify_catalog (CHECK owner
    only) and, when the view dropped them, puts None for each CATALOG_KEYED field the check did not re-derive; its
    filter that drops None values before merge_verify_state (:410) keeps those None entries (only for CATALOG_KEYED
    fields the view dropped), so the merge clears them. An operator check uses the view too but leaves verify_catalog and
    the floors to the next detached check, which therefore still sees the change. About fifteen lines inside the 26-line
    headroom; stays under 500 SLOC (474 today).
