execution_steps:
- >-
  1. Run VP step 1 and confirm rec-4488 is closed (recs_by_ids); if not, wait and tell the coordinator. Rebase onto
  origin/main. Read the merged telemetry reader (PLAN-telemetry-reader-and-smoke-twin:
  function name, SSM parameter, describe shape, github_ci_branch's GetFunctionUrlConfig) and the merged reader client
  (PLAN-telemetry-cold-read-deadline: _invoke, ReadDeadlineExceededError, errors.map_reader_error) and use them verbatim.
- >-
  2. PR deploy output: aws_ssm_parameter.ducklake_telemetry_catalog, its pin test and its registry shard; run VP steps
  2-3. Closure, each outcome reported separately: the readiness check (bin/venv-python -m scripts.session.github_readiness);
  implementation_declared stays unset; rebase on origin/main; step 3's full tier on the committed, clean tree, then
  bin/venv-python -m scripts.checks.validation_result --verify-head; the postflight evidence file and
  bin/venv-python -m scripts.session.postflight --evidence; push; PR; CI green; VP step 4 on the PR's final head. Merge
  under the standing rule; run VP step 5.
- >-
  3. PR catalog awareness. Rules: ST-5 (state envelope catalog, absent reads smoke), ST-6 (verify state keyed by
  catalog through verify_view), RN-5 (a known catalog with its paired data path), RN-9 (a recorded catalog that differs
  from describe's re-sends the whole tree through record_turn(resend_tree=True) and schedules a check; a 409 then halts
  as grain_conflict_after_catalog_reset), RD-1 (read_route: the catalog from the deploy output, resolved lazily, event
  verbs by it, ops reads always on the shared reader), RD-2 (each client reports an unresolved catalog in its own
  failure line or check status). Edit state.py, runner.py, record_turn.py (with the helper move), read_route.py (new),
  verify.py, the clients (capture __main__, mcp_server, telemetry_verify __main__, the preflight seam and gauge, the
  golden gates), the two workflows, completeness.py and ports.yaml PC-01, with every test the scope names. Run VP
  steps 6-14; write the graduated steps' registry shards under their graduation_check_id; run validate_weakening_candidates
  and record a disposition for every candidate; code review in a fresh context, fixing every blocking finding; then
  step 15.
- >-
  4. PR catalog awareness closure, each outcome reported separately: the readiness check; the coverage diagnostic
  (step 15's coverage command); implementation_declared true; rebase on origin/main; step 15's full tier on the
  committed, clean tree, then scripts.checks.validation_result --verify-head; the postflight evidence file and
  scripts.session.postflight --evidence; push; PR; CI green on the head. Merge under the standing rule; then VP steps
  16-17.
- 'Execute Verification Plan: run each step; loop until pass; on an unrecoverable V3 failure stop and RCA (Decision 55).'
- 'Report: what was implemented, the verification results, and that PLAN-telemetry-production-flip can start.'
