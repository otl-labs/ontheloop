- file: scripts/telemetry_capture/runner.py
  action: Modify
  purpose: >-
    PR catalog awareness. (1) RN-5 (_describe) returns (protocol, catalog) and accepts describe only when
    catalog.meta_schema is in state.KNOWN_CATALOGS AND catalog.data_path_is_smoke is exactly (meta_schema ==
    "ducklake_smoke"), beside today's caps and blob-protocol checks; anything else stays describe_mismatch (stopped,
    cursor not persisted, never a halt). No switch or config file is read for the catalog: capture follows the deployed
    writer. (2) Rule RN-9: when a valid loaded cursor's recorded catalog differs from the catalog describe answered, the
    pass counts catalog_reset and calls record_turn with resend_tree=True, so the whole tree (every turn, every
    finalization close) is sent to the writer's catalog; a 409 on that pass halts with reason
    grain_conflict_after_catalog_reset. (3) A sent pass persists the cursor with describe's catalog; a no-rows pass (no
    describe) keeps the loaded catalog. (4) The verify scheduling step treats a catalog_reset pass as due (scheduled_at
    = now, a RUNNER field) unless the tree's daily check cap is reached, so a check re-derives the session id and the
    ledger floors in the new catalog before verify_due reads the stale floors again (ST-6). (5) A catalog reset in a pass
    with detach_below set (only the in-hook SessionEnd pass, .claude/hooks/session_end_log_turn.py:69-84) returns
    short_budget right after describe, before the resend record_turn and without persisting, so the hook detaches the
    final pass with its own 600 s budget instead of letting the whole-tree resend run out of the hook's 50 s and stop
    with nothing detached. (6) Rule RN-10 (confirm a reset): append responses do not echo the catalog, so a pass that
    met the new describe could still have had some appends served by an old-configuration environment of the same
    unqualified function while the flip's update settles (rows landing in ducklake_smoke, or a begin_blobs/append split).
    A persisted reset pass therefore records reset_at = now; the first sent pass at least RESET_CONFIRM_AFTER_S = 1800
    (30 minutes) later calls record_turn with resend_tree=True once more (identical rows are no-ops, Decision 207; a
    missing row is written), counts catalog_reset_confirm and persists the cursor without reset_at; a 409 there halts
    as grain_conflict_after_catalog_reset. 1800 s exceeds Lambda's configuration-update window (the update settles within
    minutes, and an old-configuration environment's in-flight invocation ends within the writer's 120 s timeout) and the
    15-minute ceiling of a begin_blobs grant issued under the old binding. The module and RN-5 docstrings stop naming
    the smoke catalog. Not on the coverage checker's map (no grandfathered home), so its tests
    may live in a sibling module. Stays under 500 SLOC (356 today).
- file: src/turn_capture/record_turn.py
  action: Modify
  purpose: >-
    PR catalog awareness. record_turn gains keyword resend_tree: bool = False. When true with a cursor, base is
    cursor.reset(PARSER_VERSION) and the prior set is empty (the parser_version-bump path, matches false), so every row is
    re-emitted while the four pins and the finalization cuts are kept (Decision 207: an identical re-send is a no-op, and
    in a new catalog every row is first-sight). Rows are unchanged, so PARSER_VERSION does not move. Coverage maps this
    file to tests/turn_capture/test_record_turn.py only (100% today), so the branch-covering node lives there. Not
    Lambda-packaged (data-pipeline excludes src/turn_capture).
- file: scripts/telemetry_capture/read_route.py
  action: Create
  purpose: >-
    PR catalog awareness: the one routing helper every telemetry read client uses. Imports KNOWN_CATALOGS from state.py.
    TelemetryCatalogUnresolved(RuntimeError). resolve_catalog(profile=None) -> str: env DUCKLAKE_TELEMETRY_CATALOG (the
    deploy output's override for hermetic tests and CI, the DUCKLAKE_READER_URL precedent), then SSM
    /agent-platform/ducklake/telemetry_catalog; an unreadable parameter or a value outside KNOWN_CATALOGS raises
    TelemetryCatalogUnresolved naming the source only (never the value, never the AWS error text), raised from None so no
    chained exception carries a parameter address. EVENT_VERBS = frozenset of
    src.common.ducklake_event_read_verbs.EVENT_READS (pure data, no duckdb). TelemetryReader(DuckLakeReader) overrides
    _reader_url only: env DUCKLAKE_TELEMETRY_READER_URL, then SSM /agent-platform/ducklake/telemetry_reader_url, then
    lambda:GetFunctionUrlConfig on agent-platform-ducklake-telemetry-reader, through its own reads with no logging of the
    AWS error (never ducklake_reader_client._resolve_function_url_via_ssm, which logs the exception, so an access-denied
    text could reach a public Actions log); a loud RuntimeError naming the three sources, never their errors,
    otherwise; it inherits _invoke as PLAN-telemetry-cold-read-deadline merged it (a 504 read_deadline_exceeded raises
    ReadDeadlineExceededError after one POST); binding() returns describe's catalog object. RoutedReader(ops, profile) is
    lazy: the catalog, the event reader and the merged describe are resolved on first use and cached, so construction
    never reads SSM or the network and a failure raises at the first use, inside the caller's own handler. named(verb)
    goes to the event reader when verb is in EVENT_VERBS, else ops; describe() is ops.describe() on the shared route,
    else the ops rows that are not event verbs merged with the event reader's describe(); binding() is the event
    reader's on the telemetry route and None on the shared route; catalog and event_function are properties; every
    other attribute (current_state, latest_snapshot, query) delegates to ops. make_routed_reader(profile=None, ops=None,
    ops_verbs=None): ducklake_smoke routes events to the ops reader (the shared reader), ducklake_telemetry to
    TelemetryReader; ops_verbs, when given, is a describe the caller already fetched from ops, and the routed describe
    uses it instead of calling ops.describe() again.
