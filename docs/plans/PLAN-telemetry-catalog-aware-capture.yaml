constraints:
- No behaviour change in production or smoke at merge; the writer and the deploy output both read ducklake_smoke.
- No new Decision; the routing implements Decision B (PLAN-telemetry-reader-and-smoke-twin, the telemetry reader identity) for the read side, and the deploy output is Decision 224 cl.1's deploy_output class.
- No IAM change; query_ops and the shared reader handler are out of scope (the "Retire query_ops raw SQL" plan owns query_ops).
- No account id, ARN, hostname, URL or secret in any file, log line or PR body (Decision 101); gate and client failure output stays counts and class names.
- No rescue agents or workaround loops (Decision 55); a grain-conflict halt is reported, never cleared blindly.
- Every file stays under 500 SLOC (Decision 128); decompose rather than raise.
