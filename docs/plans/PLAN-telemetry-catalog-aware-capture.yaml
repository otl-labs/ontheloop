infrastructure_dependencies:
- >-
  Prerequisites (verified at build start, VP step 1): PLAN-telemetry-production-catalog built (catalog ducklake_telemetry,
  T2.36:c1 met); PLAN-telemetry-cold-read-deadline built (src/common/ducklake_read_deadline.py on main; the client's
  ReadDeadlineExceededError); PLAN-telemetry-reader-and-smoke-twin deployed (agent-platform-ducklake-telemetry-reader with
  its SSM URL parameter, github_ci_branch GetFunctionUrlConfig and URL-only invoke, PlatformDev URL-only invoke). The
  maintenance plan is not a prerequisite.
- >-
  PR deploy output, pre-merge: the PR's speculative plan shows exactly one create, aws_ssm_parameter.ducklake_telemetry_catalog,
  and a PASS predicted guard verdict (VP step 4); post-merge it auto-applies (non-IAM) and the parameter reads
  ducklake_smoke (VP step 5). It merges before the code PR, so no client ever runs routing code against a missing
  parameter.
- >-
  PR catalog awareness: no terraform and no Lambda redeploy (no deploy-ducklake-lambdas trigger path). Both PRs merge
  under the standing rule (critique PROCEED, code review PROCEED, CI green): neither carries an always-ask item (the
  SSM parameter is not IAM; the workflow edits add a masked URL read the CI role already holds). One DuckLake deploy or
  apply at a time; no merge during the org-transfer freeze window.
acceptance_criteria:
- >-
  The deploy output /agent-platform/ducklake/telemetry_catalog exists, reads the writer's pin local (ducklake_smoke
  today) and is pinned to that local by a standing guard.
- >-
  Capture accepts the writer's describe only for a known catalog with its paired data path (RN-5), records the catalog
  each tree was sent to, and re-sends the whole tree with its pins kept when the writer's catalog changes (RN-9), with
  no halt except a grain conflict (grain_conflict_after_catalog_reset, reachable on a flip rollback); a reset in the
  in-hook SessionEnd pass detaches to the final pass's own budget; the in-session check never reads a tree with a
  session id or ledger floors cached under another catalog
  (ST-6); with the writer on ducklake_smoke nothing changes for live sessions.
- >-
  Every telemetry read client (MCP tools, monitor, completeness, in-session check, preflight gauge, golden replay)
  routes event verbs by the deploy output through scripts/telemetry_capture/read_route.py; ops reads stay on the shared
  reader; the MCP server keeps its ops tools when the event route is unavailable; and an unresolvable catalog is a
  class-only line or a counted check status in each client, never a traceback.
- >-
  Golden replay stops before any registration when the writer's or the reader's catalog differs from the deploy
  output, and passes on smoke with zero mismatches after the merge; both scheduled workflows mask the telemetry reader's
  URL and each completes one run on main through the routed reader.
verification_plan:
- step: 1
  phase: pre-deploy
  action: >-
    Prerequisites are on main (c1 met, the cold-read build merged, the telemetry reader's URL parameter present).
  command: >-
    git fetch origin main --quiet && git cat-file -e origin/main:src/common/ducklake_read_deadline.py && git show
    origin/main:docs/ROADMAP-PLATFORM.yaml > "${TMPDIR:-/tmp}/roadmap_cac.yaml" && bin/venv-python -c "import os,yaml;
    d=yaml.safe_load(open(os.path.join(os.environ.get('TMPDIR','/tmp'),'roadmap_cac.yaml')));
    it=[i for i in d['tier_items'] if i['id']=='T2.36'][0];s={c['id']:c['status'] for c in it['exit_criteria']};print(s);
    assert s['c1']=='met', s;print('PREREQS_OK')" && aws ssm get-parameter --name
    /agent-platform/ducklake/telemetry_reader_url --profile agent_platform --query Parameter.Name --output text
  expected: The deadline module is on main, T2.36 c1 reads met, PREREQS_OK, then the telemetry reader's SSM parameter name.
  fix_if: Stop; this plan builds only after the production catalog, cold-read deadline and reader-and-twin plans are done.
  hermetic: false
  graduation: not-applicable
- step: 2
  phase: pre-deploy
  action: PR deploy output. The catalog parameter is the writer's pin local.
  command: >-
    bin/venv-python -m pytest tests/checks/iam_tf/test_telemetry_catalog_deploy_output.py::test_catalog_deploy_output_is_the_writer_pin
    tests/checks/iam_tf/test_telemetry_catalog_deploy_output.py::test_deploy_output_guard_rejects_a_literal_value -q
  expected: Exit 0. Red before because the module is absent.
  fix_if: Fix the Terraform value; never pin a literal catalog name.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Its nodes land in PR deploy output, which also creates the standing guard telemetry-catalog-deploy-output-follows-the-pin
    (a scope row), admitted by the differential gate against pre-PR main; the code PR's implementation_declared flip
    cannot graduate a row whose nodes are already on main, and a second entry would duplicate the first
    (PLAN-telemetry-transcript-content PR A precedent).
- step: 3
  phase: pre-deploy
  action: PR deploy output. Lint, Terraform format and the full tier before its commit.
  command: >-
    bin/venv-python -m ruff check tests/checks/iam_tf && bin/venv-python -m ruff format --check tests/checks/iam_tf && {
    ! command -v terraform >/dev/null || terraform -chdir=terraform/personal fmt -check; } && bin/venv-python -m
    scripts.validate
  expected: >-
    ruff exits 0, fmt exits 0 where a terraform binary exists (the DEV container has none; CI's terraform-validate runs
    fmt), then the full tier ends with "All checks passed." and exit 0.
  fix_if: Fix at root and rerun the full tier from the start (handoff_policy).
  hermetic: false
  graduation: not-applicable
- step: 4
  phase: pre-deploy
  action: >-
    PR deploy output. Before merge, the PR's speculative plan is exactly the one create. Save the "Terraform Speculative
    Plan" PR comment body for the PR's final head (mcp__github__pull_request_read get_comments) to a file, set
    SPEC_PLAN_FILE to its path and PR_HEAD_SHA to the head SHA.
  command: >-
    export SPEC_PLAN_FILE PR_HEAD_SHA && test -s "$SPEC_PLAN_FILE" && test -n "$PR_HEAD_SHA" && bin/venv-python -c "import
    os,re;t=open(os.environ['SPEC_PLAN_FILE'],encoding='utf-8',errors='replace').read();
    assert ('PR head SHA: '+chr(96)+os.environ['PR_HEAD_SHA']+chr(96)) in t, 'not the final head comment';m=re.search(r'Plan:
    (\d+) to add, (\d+) to change, (\d+) to destroy',t);assert m and m.groups()==('1','0','0'), m and m.group(0);assert
    'Predicted guard verdict: PASS' in t, 'not auto-apply';got={a:v for a,v in re.findall(r'# (\S+) (?:will|must) be
    (created|updated in-place|destroyed|replaced|read during apply)',t) if not a.startswith('data.')};assert
    got=={'aws_ssm_parameter.ducklake_telemetry_catalog':'created'}, got;print('SPEC_PLAN_OK',m.group(0))"
  expected: Exit 0 and SPEC_PLAN_OK with 1 to add, 0 to change, 0 to destroy and no other resource address.
  fix_if: Any other address or count is a stop; explain it mechanically before merging, never merge on an unexplained plan.
  hermetic: false
  graduation: not-applicable
- step: 5
  phase: post-deploy
  action: PR deploy output applied. The parameter reads the writer's current catalog.
  command: >-
    test "$(aws ssm get-parameter --name /agent-platform/ducklake/telemetry_catalog --profile agent_platform --query
    Parameter.Value --output text)" = ducklake_smoke && echo CATALOG_OUTPUT_OK
  expected: CATALOG_OUTPUT_OK.
  fix_if: A missing parameter means the apply has not landed; read the terraform run before opening the code PR.
  hermetic: false
  graduation: not-applicable
- step: 6
