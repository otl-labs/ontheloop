schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-catalog-aware-capture
intent: >-
  Telemetry slice 2c (rec-4292), the step before the production flip: capture follows the catalog the deployed writer
  serves, and every telemetry read client learns where that catalog is read from one deploy output. Capture accepts
  the writer's describe only for a known catalog with its paired data path, records the catalog each tree was sent
  to, and re-sends an in-flight tree whole when the writer's catalog changes; the in-session check keys its cached
  session id and ledger floors by that catalog. Terraform writes the writer's catalog pin to an SSM parameter beside its
  URL; the MCP tools, the monitor, completeness, the in-session check, the preflight gauge and golden replay route
  event verbs by it, and each client reports an unresolvable catalog through its own failure line. The flip
  (PLAN-telemetry-production-flip) is then one Terraform change that moves writer, capture and reads together, with no
  blackout and nothing for stale checkouts to fetch. Nothing changes behaviour here: the writer and the deploy output
  both read ducklake_smoke. Telemetry is the learning signal for recursive self-improvement (PROJECT_CONTEXT); this
  makes the move to production safe for sessions that span it.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-catalog-aware-capture.yaml
phase: >-
  T2.36 (telemetry re-lands on DuckLake), follow-on mode; closes no exit criterion (c2 is
  PLAN-telemetry-production-flip's, on this plan's ground). Built after PLAN-telemetry-production-catalog (c1),
  PLAN-telemetry-reader-and-smoke-twin (the telemetry reader it routes to) and PLAN-telemetry-cold-read-deadline (whose
  client changes the telemetry reader inherits), before PLAN-telemetry-production-flip. V3: two ordered PRs. PR "deploy
  output" adds one non-IAM terraform/personal resource (an SSM parameter, auto-applied by the speculative-plan
  pipeline); PR "catalog awareness" changes capture, the read clients, golden replay and the two scheduled telemetry
  workflows, flips implementation_declared, and is proven against the live smoke writer, the shared reader and the
  deployed telemetry reader. No Lambda redeploy (no deploy-ducklake-lambdas trigger path is touched).
closes_criteria: []
