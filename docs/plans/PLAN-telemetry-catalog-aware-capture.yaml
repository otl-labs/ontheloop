- step: 16
  phase: post-deploy
  action: >-
    PR catalog awareness merged: in this live cloud session, after checking out main and ending one turn, a Stop pass
    after the merge time (MERGE_TS, epoch seconds, set before the command) sent to smoke under the new RN-5 and recorded
    the catalog. The in-session check completes through the routed reader with compare_skipped=producer_modified for a
    tree that was in flight when this session edited record_turn.py (the runner set producer_changed and the compare is
    skipped for the rest of that tree's life), or none for a tree started after the edit; the routed event reads are proven by the golden replay leg, which reads
    every session verb through the routed reader with its catalog assertion; the routed client then reaches the deployed
    telemetry reader.
  command: >-
    test -n "$MERGE_TS" && export MERGE_TS && export TREE="$(ls -t "$HOME"/.claude/projects/*/*.jsonl | head -1)" &&
    bin/venv-python -c "import json,os,pathlib;t=pathlib.Path(os.environ['TREE']);d=t.parent/t.stem/'telemetry-capture';
    s=json.loads((d/'state.json').read_text());assert s.get('catalog')=='ducklake_smoke', s.get('catalog');
    r=[json.loads(x) for x in (d/'diagnostics.jsonl').read_text().splitlines() if x.strip()];r=[x for x in r if
    x.get('at',0)>=int(os.environ['MERGE_TS'])];assert any(x.get('outcome')=='sent' for x in r), 'no sent pass';
    assert not any('describe_mismatch' in (x.get('diag') or {}) for x in r), 'describe_mismatch';print('CAPTURE_SMOKE_OK',len(r))"
    && out="$(AWS_PROFILE=agent_platform bin/venv-python -m scripts.telemetry_capture verify --tree "$TREE" --no-alarms)" &&
    echo "$out" && echo "$out" | grep -Eq "VERIFY status=completed compare_skipped=(producer_modified|none)" &&
    AWS_PROFILE=agent_platform bin/venv-python -m scripts.ducklake_smoke.lambda_telemetry_golden_gates --no-alarms
    --assert-zero-mismatches && AWS_PROFILE=agent_platform bin/venv-python -c "from scripts.telemetry_capture.read_route
    import TelemetryReader;v=TelemetryReader().describe();assert 'session_tree_rows' in v and 'transcript_content' not in
    v;print('TELEMETRY_READER_ROUTE_OK')"
  expected: >-
    CAPTURE_SMOKE_OK, a VERIFY line with status=completed and compare_skipped producer_modified or none, GOLDEN_SMOKE ... skew=0
    mismatches=0 with exit 0, then TELEMETRY_READER_ROUTE_OK.
  fix_if: >-
    A describe_mismatch on smoke means RN-5 reads the wrong field: revert and fix before the flip. A telemetry reader
    resolution failure means its SSM parameter or PlatformDev's invoke is missing: report it to the reader-and-twin
    plan's owner.
  hermetic: false
  graduation: not-applicable
- step: 17
  phase: post-deploy
  action: >-
    The scheduled telemetry workflows run green through the routed reader on main. Save the latest completed runs of
    telemetry-golden-replay.yml and telemetry-verification.yml after the merge (mcp__github__actions_list, workflow runs
    on main) as one JSON list of {workflow, head_sha, conclusion, created_at} to a file, and set RUNS_FILE to its path and
    MERGE_SHA to the merge commit.
  command: >-
    export RUNS_FILE MERGE_SHA && test -s "$RUNS_FILE" && test -n "$MERGE_SHA" && bin/venv-python -c "import
    json,os,subprocess;runs=json.load(open(os.environ['RUNS_FILE']));m=os.environ['MERGE_SHA'];
    after=lambda s:subprocess.run(['git','merge-base','--is-ancestor',m,s],capture_output=True).returncode==0;
    ok={r['workflow'] for r in runs if r['conclusion']=='success' and after(r['head_sha'])};
    assert {'telemetry-golden-replay.yml','telemetry-verification.yml'}<=ok, ok;print('WORKFLOWS_OK')"
  expected: WORKFLOWS_OK (each workflow has a successful run on a commit at or after the merge).
  fix_if: >-
    A failed run means CI cannot resolve the catalog or the reader: read the job log and fix the client or report the
    missing grant; never edit the workflow to skip the step.
  hermetic: false
  graduation: not-applicable
