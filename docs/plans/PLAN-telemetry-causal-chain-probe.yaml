constraints:
  - >-
    No Terraform, IAM, Lambda, Neon, secret or AWS resource change; no admin credentials; no src/common/ducklake_*.py or
    config/lambda/ducklake/** edit (either would start the governed Lambda deploy channel).
  - >-
    scripts/telemetry_verify stays the producer-independent oracle: the probe imports from it (alarms, rows, compare,
    derive) but nothing is added to it, and tests/telemetry_verify/test_package_boundary.py is not widened.
  - >-
    Production writes are limited to the fixed synthetic:causal-chain-probe project, one root session per run attempt,
    explicitly registered and excluded from real reads (Decision 236 cl.1); no disposable deploy vectors on production.
  - >-
    Production is read only through the telemetry reader's named verbs (Decision 236 cl.2, Decision 84 I-3); no content
    read (Decision 236 cl.3). Post-commit blob object loss is a declared residual owned by the blob-root fence (Decision
    230 cl.5), not faked with a new S3 grant.
  - >-
    Alarm, not gate (Decision 210 cl.2): never a required check (Decision 83). Unavailable is its own loud class (exit
    3, red run) and never a loss alarm (Decision 215 cl.2); it does not reuse Decision 155's transient-reader tolerance
    (155 cl.3 confines that to its own call sites), so nothing imports scripts.ops_portal.reader_transient.
  - >-
    Unique entity_ref per run attempt (Decision 207: an identical re-send is a no-op and would read back old rows as a
    false pass); SLA_SECONDS and POST_PERSIST_BUDGET_S are named constants, never widened to make a run pass.
  - Counts and class names only in logs; mask Function URLs and hosts (Decision 101).
  - "SLOC: decompose rather than raise any budget (Decision 128); the probe is two modules from the start."
  - >-
    PROBE_SHAPE_VERSION is bumped, with a new SHAPE_DIGESTS entry, on any change to the transcript builder; prior runs
    of another shape version are skipped, never compared.
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Approval: Benjamin chose every 6 h on Actions 2026-10-28 16:17Z (cmsg_012XgaFy8VaDQbxP5D8nC958M4fzyyiWcE1SW3L4LYypjd; hourly off GitHub is rec-4688) and said 'write the plan on that basis' (cmsg_012XgaFy8VaDQbxP5D8nC958S6yP7MU3omMGX7Ard61PoF); presentation /mnt/project-files/telemetry-slice5/step6b-presentation.md."
  - "Why not scripts/verifiers: its REGISTRY entries run inside validate.py (validate_verification_harness), so a registered production probe would write production rows on every PR (Decisions 210 cl.2, 83, 236 cl.1). T2.15 c3 (deferred_post_mvp) still names CausalChainVerifier; untouched. Why not scripts/telemetry_verify (critique round 1): its AST boundary keeps the oracle free of producer and transport code; the probe runs the producer, so it sits beside golden replay in scripts/ducklake_smoke and imports the oracle, never the reverse."
  - "Why 6 h: matches telemetry merge_ops (every 6 h) and sensor_liveness's 6 h floor and ALARM_MIN_INTERVAL_S; GitHub Actions cron is best-effort (scheduled telemetry runs have landed about 5 h late)."
  - "Session id = derive_entity_key('telemetry_sessions:session_id', tenant, project, entity_ref, session_started_at): the transcript's first timestamp is the attempt's run_started_at so later runs can recompute it from the Actions API; the transcript is a deterministic function of shape version and run identity, so a prior run's expected rows are rebuilt, not stored."
  - "Cold reader: rec-4652 (golden replay red on the reader cold-start deadline) and rec-4474 are the known risk; the probe warms first and classes a reader with no 200 inside the SLA as unavailable (3), never as loss. While both stay open G.8 may see exit 3; sensor_liveness raises loop_liveness_stale if no run succeeds for 12 h."
  - "SLA_SECONDS = 180: Decision 214 measured reader/writer p95 of 26-55 s; a cold re-ATTACH costs about 11 s; 180 s covers a cold start plus polling with margin. Revisit with measured visible_after_s, never to make a failing run pass."
  - "Growth: about 120 probe sessions and as many small claim-check blobs a month stay in production under the synthetic project (blob deletion is admin-only); accepted with the approach (scout NOTE on Decision 236)."
  - "Follow-ons: rec-4688 (hourly off GitHub, needs a Decision vs CD.29), rec-4689 (CD.17 / G.8 read T3.2 latest_run.verdict, which nothing produces). T2.15 c3 (deferred_post_mvp) still says CausalChainVerifier is re-registered in scripts/verifiers; T3.2's re-grounded files_in_scope comment names that supersession so the drift is visible from the item T2.15 depends on, and T2.15's own plan re-grounds it (touching T2.15 now would force converting its criteria and shift the secrets-baseline line pins)."
  - "Unavailable alarm: dropped on critique round 2 -- sensor_liveness's success leg already raises loop_liveness_stale when this workflow has no success for 12 h (twice the 6 h cron), so a probe-specific causal_chain_unavailable class would double-record one event (the same reason the workflow is excluded from ci-rca)."
