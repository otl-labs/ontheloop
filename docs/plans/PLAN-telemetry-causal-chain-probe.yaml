      workflow body or one over its ceiling, which is the guard.
  - source: config/ci_rca_taxonomy.yaml
    behavior: The new workflow is classified not_a_gate and excluded from ci-rca.
    verification_step: 3
    command: bin/venv-python -m scripts.validate
    waiver_reason: >-
      Taxonomy data; the full tier's validate_ci_rca_taxonomy coverage check fails on a workflow with no taxonomy entry,
      which is the guard.
  - source: docs/ROADMAP-PLATFORM.yaml
