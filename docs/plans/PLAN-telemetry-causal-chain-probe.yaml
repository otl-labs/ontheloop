execution_steps:
  - >-
    Create scripts/ducklake_smoke/lambda_telemetry_causal_chain_prior.py and its tests, then
    scripts/ducklake_smoke/lambda_telemetry_causal_chain.py and its tests; run VP 1. Post: every stage's fault maps to
    its code with fakes only.
  - >-
    Create the workflow and its shape test, measure and register its inline run bodies in
    config/composite_action_body_baseline.yaml, add the ci_rca_taxonomy entry; run VP 2.
  - Run VP 3 (full tier) to completion.
  - >-
    Run VP 4 (the local leg against production) on the branch and paste its CAUSAL_CHAIN line into the PR as the V3
    merge-gate evidence.
  - >-
    Closure evidence recorded as four SEPARATE facts (implement skill Commit Flows): GitHub readiness state
    (bin/venv-python -m scripts.session.github_readiness); parent validator evidence (VP 3 full-tier exit 0 plus
    bin/venv-python -m scripts.checks.validation_result --verify-head for the pushed HEAD); structured postflight
    evidence (scripts.session.postflight --evidence); the real outcome -- push, PR, CI green by event-driven wake (never
    polled), squash-merge under the standing rule (no IAM, spend change beyond the approved cadence, Class A or
    Decision). The implementation PR does not touch T3.2's criteria.
  - >-
    After merge run VP 5 (dispatch); run VP 6 on the first scheduled run that has an earlier run to re-read. Only after
    VP 5 and VP 6 pass, open a roadmap-only bookkeeping PR: T3.2 c1-c3 -> met with met_by telemetry-causal-chain-probe,
    status stays in_progress until T2.36 is complete, progress_note line (exit-criteria-ledger status populated on a
    verified VP pass; precedents PLAN-telemetry-reader-verbs and PLAN-telemetry-production-maintenance #1672).
