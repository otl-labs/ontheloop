schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "telemetry-claude-p-capture-adapter"
intent: >-
  One shared, host-neutral capture adapter for every `claude -p` run in GitHub Actions, with ci-rca captured live: the
  shared retry wrapper fixes each attempt's session id and writes a manifest, one composite action reads the GitHub facts
  and calls one producer command that pins each session with a host-run sidecar and runs a synchronous final pass, and
  parser_version 8 writes the top-level agent run shape (T3.22 c5). It is the adapter the release's CLI persona backend
  reuses (Benjamin 2026-10-29, cmsg_012XgaFy8VaDQbxP5D8nC9584BNMSPTp1X5Q7G3F1m3eJ9), not a throwaway. No IAM change.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-claude-p-capture-adapter.yaml
phase: >-
  T3.20 (in_progress; c9 open, rec-4415). Plan 2 of 3 for c9: c9 names ci-rca AND subagent-plan-review, so it closes
  with plan 3 (producer admission and plan-review capture, rec-4420), not here. closes_criteria is therefore empty.
  Bundles rec-4424 (switch).
closes_criteria: []
scope:
  - file: scripts/ci/claude_p_retry.sh
    action: Modify
    purpose: >-
      Per attempt: a fresh uuid (`/proc/sys/kernel/random/uuid`, else `python3 -c 'import uuid;print(uuid.uuid4())'`)
      passed as `--session-id <uuid>` ahead of the caller's args; append (never truncate) two compact JSON lines to
      "${OUTPUT_FILE}.sessions.jsonl": BEFORE invoking claude {"attempt": n, "session_id": "<uuid>", "started_at":
      "<UTC ISO-8601 with milliseconds, Z>"} (`date -u +%Y-%m-%dT%H:%M:%S.%3NZ`) (so a session killed by a step timeout is still found), and after it {"session_id": "<uuid>",
      "exit": <int>, "transient": <bool>} (attempt counts per wrapper invocation; two invocations in one job, as
      reconcile does, append to the same file). A manifest write failure is ignored and never changes the exit code. A
      caller passing --session-id, --resume, --continue, --fork-session or --no-session-persistence (also the -r and -c
      short forms and any --flag=value spelling) gets the usage exit 1
      (capture needs one fresh persisted session per attempt). Reads no new environment variable, so it works under
      review.sh's env -i. Retry and exit semantics unchanged.
  - file: scripts/telemetry_capture/switch.py
    action: Modify
    purpose: >-
      rec-4424: in switch_state, a `git show` that returns None (timeout or OSError) after its ref resolved returns
      (False, source) instead of falling through to the next ref or the working tree. New ci_gate(repo_root, *,
      workflow_path, ref, repository) -> CiGate(mode, entry, source, reason): ONE read of capture.yaml by the SW-3 order
      (same rec-4424 rule), mode "ci" only when enabled is true AND ci_repository equals repository AND ref ==
      "refs/heads/main" AND exactly one well-formed ci_workflows entry has workflow == workflow_path; else mode "off"
      with one reason token (switch_off, repository_mismatch, ref_not_main, not_allow_listed, malformed_entry).
      switch_mode(env, repo_root, ci=None): with a CiGate, OTL_TURN_CAPTURE=off still wins, the GITHUB_ACTIONS,
      CLAUDE_CODE_REMOTE and smoke branches are skipped and the gate's mode is returned; without one (every hook
      caller) behaviour is unchanged, so hook capture stays off in Actions.
  - file: scripts/telemetry_capture/runner.py
    action: Modify
    purpose: >-
      run_pass gains keyword ci_gate (default None) handed to switch_mode; mode "ci" runs like "on". The pin step uses
      host_run.resolve_pin (rule P-5) instead of project_ref_pin: a conflict finishes "deferred" with diag pin_conflict,
      no pin finishes "deferred" with deferred_no_pin (unchanged token). Nothing else changes.
  - file: scripts/telemetry_capture/ci_pass.py
    action: Create
    purpose: >-
      `ci-pass`: takes the manifest globs and every host fact as arguments (Decision 212: no GITHUB_* read here):
      --manifest (repeatable glob), --workflow-path, --ref, --repository, --run-id, --run-attempt, --job, --event-name,
      --sha (the triggering commit), --checkout-sha (optional: the checked-out commit), --projects-dir (default $HOME/.claude/projects), --budget-s (default 180). Validates each fact (run id and
      attempt digits; job [A-Za-z0-9_.-]{1,100}; event one of the closed Actions trigger values plan 1 declares (workflow_run,
      workflow_dispatch, push, schedule; any other event is off reason unsupported_event); sha and checkout-sha 40 or 64 hex; workflow path under
      .github/workflows/), else off reason bad_host_fact. Reads every manifest line (malformed lines counted), merges the start and
      result lines by session_id (a start line alone is a killed attempt, still captured), and gives each session retry_ordinal = its 1-based rank by (started_at, then manifest order: file order, then line order) across all
      lines read, so one call per job covers every invocation. ci_gate first; off prints one line and exits 0. Per
      session: exactly one <projects-dir>/*/<sid>.jsonl (none: transcript_absent; several: transcript_ambiguous);
      writes <sid>/host-run.json by temp file and os.replace, unless a sidecar exists: identical bytes reuse it,
      different bytes skip the session as pin_sidecar_conflict (never overwritten). project_ref comes from the one
      registered home of project.ref (Decision 224): the --project-ref= flag of the session_start_log_turn SessionStart
      hook in <repo root>/.claude/settings.json, read by the SW-3 order like capture.yaml and parsed with
      transcript.hook_script and PIN_FLAG; none or several -> off reason no_project_ref. Sidecar = canonical JSON
      {schema_version: 1, project_ref, agent, content_policy, host: {kind: gha, run_id, run_attempt,
      job, retry_ordinal, event_name, repository, workflow_path, ref, sha, checkout_sha (absent when not given)}} (the
      gate's entry supplies agent and
      content_policy).
      Then run_pass(event "ci_final", final=True, ci_gate=gate, budget = the remaining total budget). Never runs the
      in-session source check or any reader call. Prints only counts and fixed tokens (Decision 101: no id, ref, sha,
      path or content): one `CI_CAPTURE session=<ordinal> outcome=<outcome> rows=<n>` line per session and one
      `CI_CAPTURE done sessions=<n> sent=<n> no_rows=<n> deferred=<n> stopped=<n> halted=<n> skipped=<n>` line, or
      `CI_CAPTURE off reason=<token> sessions=<n>`. Exits 0 on every path except argparse usage.
  - file: scripts/telemetry_capture/__main__.py
    action: Modify
    purpose: >-
      Register the ci-pass subcommand (a thin delegate to ci_pass.main_ci_pass) and name it in the module docstring;
      _cmd_pass's refusal uses host_run.resolve_pin, so an operator pass works on a sidecar-only tree and refuses a
      conflicted one with a fixed token.
  - file: config/telemetry/capture.yaml
    action: Modify
    purpose: >-
      Add ci_repository: otl-labs/ontheloop; ci_workflows: [{workflow: .github/workflows/ci-rca.yml, agent: ci_rca,
      content_policy: full}] (agent = the source_registry key, which plan 1 makes both agent_type and the root's
      workflow) (no project_ref: it has one home, .claude/settings.json); ci_uncaptured: [{call_site:
      .github/actions/subagent-plan-review, reason: "plan review needs the capture role (producer-admission plan)",
      owner: rec-4420}] (the one pending entry, deleted by plan 3). Header comment gains the CI path: read from
      origin/main first, so removing an entry (or enabled: false) on main stops CI capture at the next run.
  - file: .github/actions/telemetry-ci-capture/action.yml
    action: Create
    purpose: >-
      Composite action, no outputs. Inputs: manifests (required; newline-separated globs), aws-access-key-id,
      aws-secret-access-key, aws-session-token (optional, for plan 3's capture role; a composite never signs in itself,
      validate_actions_account_id_masking R4). One `shell: bash` step whose env block binds the inputs to
      CAPTURE_MANIFESTS and CAPTURE_AWS_* and whose run body is only `bash "${{ github.action_path }}/capture.sh"`
      (Decision 162 R2/R3 shape).
  - file: .github/actions/telemetry-ci-capture/capture.sh
    action: Create
    purpose: >-
      The tested delegate, TOTAL: `set +e`, exit 0 on every path, never writes GITHUB_OUTPUT, GITHUB_ENV or
      GITHUB_STEP_SUMMARY. Repo root = three levels above the script's own directory (github.action_path), so a caller
      can run a main-tooling copy while its root checkout is another commit. Derives the workflow path from
      GITHUB_WORKFLOW_REF (strip "${GITHUB_REPOSITORY}/" and "@<ref>") and passes GITHUB_REF, GITHUB_REPOSITORY,
      GITHUB_RUN_ID, GITHUB_RUN_ATTEMPT, GITHUB_JOB, GITHUB_EVENT_NAME and GITHUB_SHA (--sha, the triggering commit) as
      ci-pass arguments, plus --checkout-sha from `git -C "$GITHUB_WORKSPACE" rev-parse HEAD` when that succeeds (for
      workflow_run, GITHUB_SHA is main's head, not the checked-out failing commit), one
      --manifest per non-empty CAPTURE_MANIFESTS line. When all three CAPTURE_AWS_* are set, ci-pass runs under `env -u
      AWS_PROFILE -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN -u AWS_SECURITY_TOKEN` with only
      those three set. Runs `<root>/bin/venv-python -m scripts.telemetry_capture ci-pass` from <root> under `timeout
      240`; no executable venv python prints `CI_CAPTURE skipped reason=no_python`; a timeout prints `CI_CAPTURE
      skipped reason=timeout`. Echoes only ci-pass's CI_CAPTURE lines; a nonzero exit or no CI_CAPTURE line prints `CI_CAPTURE skipped
      reason=ci_pass_failed` (for example an import failure on old code).
  - file: .github/workflows/ci-rca.yml
    action: Modify
    purpose: >-
      Job timeout-minutes 20 -> 25; the "Run ci-rca agent" step gains timeout-minutes 17 (keeps today's effective agent
      budget); a new last step "Capture agent telemetry" with `if: always()`, `continue-on-error: true` (the workspace is
      the failing commit, which may predate this action: a missing action must never red the job), timeout-minutes 5,
      `uses: ./.github/actions/telemetry-ci-capture`, `with: manifests: /tmp/ci-rca-output.json.sessions.jsonl`. Runs
      under the branch role already configured in the job (it holds the writer URL invoke and SSM read; no IAM change).
      No transcript is ever uploaded as an artifact.
  - file: src/turn_capture/transcript.py
    action: Modify
    purpose: >-
      TranscriptTree gains host_run() -> bytes | None (HOST_RUN_FILE = "host-run.json"): FsTree reads
      <session dir>/host-run.json, MemTree reads files["<sid>/host-run.json"]. project_ref_pin is unchanged (the hook pin
      alone).
  - file: src/turn_capture/host_run.py
    action: Create
    purpose: >-
      Pure, stdlib only. parse_host_run(bytes) -> HostRun | None (strict schema_version 1 shape and the ci-pass value
      grammar; anything else None, counted host_run_malformed). render_host_run_ref(host) ->
      "gha:<run_id>/<run_attempt>/<job>/<retry_ordinal>", checked against the sibling contract's host_run_ref grammar.
      resolve_pin(tree) -> (project_ref | None, token) implementing rule P-5: hook pin only -> it; sidecar only -> its
      project_ref; both equal -> it; both differ -> (None, "pin_conflict"); neither -> (None, "no_pin"). A malformed
      sidecar counts as absent. top_level_agent_rows(parsed, ctx, host, diag): for the ROOT stream once its open row is
      due (rule D-1), one telemetry_agents open row at session_started_at and, when parsed.final, one close row at the
      root close anchor with the root close outcome (C-3); shaped as plan 1's run_shapes.top_level: session_ref = the root
      session ref, entity_ref = "<root session entity_ref>/run", external_ref = "<root session entity_ref>/run#0/open"
      and "#0/close", no observation_ref (observation_id NULL), agent_type = the sidecar agent, trigger = the host
      event_name verbatim, workflow_run_id = run_id, host_run_ref from the sidecar, model = the root's first model,
      version = the first record version. Sub-agent rows are unchanged.
  - file: src/turn_capture/record_turn.py
    action: Modify
    purpose: >-
      PARSER_VERSION 8, PRODUCER_VERSION "turn-capture-8". Reads tree.host_run() once per pass into the Ctx (host and
      content_policy, default "full" when no sidecar) and appends top_level_agent_rows to the telemetry_agents batch.
      billing_shape and persona_backend unchanged (Decision 206 cl.8: CI model_call rows keep persona_backend NULL and
      billing_shape fixed_non_rollover_allowance).
  - file: src/turn_capture/transcripts.py
    action: Modify
    purpose: >-
      Ctx gains host and content_policy fields. When content_policy is "withheld", every row that would carry content
      is a typed omission instead: content_omitted_reason withheld_by_policy, content and content_uri absent,
      content_sha256 = SHA-256 of the empty byte string and content_bytes 0 (plan 1's write-enforced definition; a raw
      digest of a short reply is guessable, Decision 238 cl.1); so no
      blob is delivered for such a tree. "full" is today's behaviour.
  - file: src/turn_capture/sessions.py
    action: Modify
    purpose: >-
      With a sidecar: the root open row's workflow is the sidecar agent (the source_registry key, plan 1's rule; ahead
      of WA-1..WA-3); checkout_sha,
      checkout_base_sha and checkout_dirty come from the hook pin where present, else checkout_sha = the sidecar's
      checkout_sha when present (counted checkout_from_host_run; never the triggering sha). Without a sidecar: unchanged.
  - file: config/telemetry/parser_versions.yaml
    action: Modify
    purpose: claude_code current 8 and a v8 history entry (date, regenerated golden_digest, reason naming P-5, the sidecar and the top-level rows).
