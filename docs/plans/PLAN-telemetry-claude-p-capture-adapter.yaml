      bin/venv-python -m pytest tests/telemetry/test_capture_v8_contract_notes.py tests/telemetry/test_append_host_run_ref.py
      tests/row_rules/test_rules.py tests/telemetry/test_append.py -q &&
      bin/venv-python -c "from scripts.checks.contracts.validate_write_time_enforcement_conformance import
      validate_write_time_enforcement_conformance as v;f=[];v(f);assert not f, f;print('CONFORMANCE_OK')"
    expected: All pass, then CONFORMANCE_OK.
    fix_if: >-
      The trigger condition is refused by any rule reader (contract_rules, RowRules.from_projection, the grammar), or the
      smoke vector or a sub-agent row trips it: STOP and bring the condition back to planning, never weaken a reader.
