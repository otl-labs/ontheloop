    expected_literals: [passed]
    graduation: waive
    graduation_waiver_reason: >-
      The corpus, line-cut, schedule and registry nodes already belong to graduated standing checks
      (turn-capture-golden-corpus, turn-capture-r7-incremental-equals-full, the parser version registry); the new cases join
      them through the index.
