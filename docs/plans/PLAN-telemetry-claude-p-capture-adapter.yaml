constraints:
  - No IAM, no Terraform, no admin credential, no break-glass deploy; PlatformDev (--profile agent_platform) for every AWS call the build makes; deploys only through the governed CI channels.
  - Decision 212 -- GITHUB_* is read only in capture.sh; the producer and ci-pass take host facts as arguments.
  - Decision 101 -- every CI and operator line is counts and fixed tokens; no transcript is ever a workflow artifact.
  - Hook capture stays off in Actions; .claude/hooks and .claude/settings.json are not edited (so no plugin_hooks render).
  - The capture step can never red ci-rca (if always, continue-on-error, total delegate); the agent step's semantics are unchanged.
  - CI transcripts use the same pre-write scrub (src/turn_capture/scrub.py) as interactive sessions; the content-reader thread's shared detector library upgrades both; do not fork it. Known gap (rec-4657) -- ARNs and account ids that reach a full-policy transcript are stored but not served; this plan neither widens nor closes it.
  - Every file under 500 SLOC; decompose before any raise (Decision 128). Fast tier stays light.
  - Never weaken a test or a rule reader to pass (Decision 55); a v8 line-cut failure is a purity defect.
  - No rescue agents or workaround loops (Decision 55).
