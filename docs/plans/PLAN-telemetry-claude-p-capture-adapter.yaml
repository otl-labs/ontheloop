rollback: >-
  Fast stop without a deploy: delete the ci-rca entry from ci_workflows (or set enabled: false) on main; ci-pass reads
  origin/main first, so the next run is off. Full rollback: revert the PR; the writer redeploys without the rule, and the
  already-written rows stay valid (append-only, nullable column).
