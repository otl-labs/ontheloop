  - step: 9
    phase: pre-deploy
    action: >-
      Local integration on the pinned CLI (counts only), run AFTER the build commit. Install CLI 2.1.148 into a scratch
      dir (both npm packages, then node install.cjs by hand, per the probe note), shallow-clone the committed branch into
      a scratch git dir (so its .claude/settings.json pin hook fires; OTL_TURN_CAPTURE=off keeps the clone's interactive
      capture hooks from sending the probe sessions to production), run the real wrapper there twice with a one-word
      prompt against one output file, then run ci-pass with a repository the gate refuses (deterministic before merge,
      since the gate reads origin/main first), and parse each found tree locally with record_turn and a hand-written
      sidecar.
    command: >-
      S=$(mktemp -d) && npm install -s --prefix "$S/cli" @anthropic-ai/claude-code@2.1.148
      @anthropic-ai/claude-code-linux-x64@2.1.148 && (cd "$S/cli/node_modules/@anthropic-ai/claude-code" && node
      install.cjs) && git clone -q --depth 1 "file://$PWD" "$S/repo" && (cd "$S/repo" && for i in 1 2; do printf 'Reply
      ok.' | env -u CLAUDE_CODE_INCLUDE_PARTIAL_MESSAGES -u CLAUDE_CODE_SESSION_ID -u CLAUDE_CODE_REMOTE_SESSION_ID -u
      CLAUDE_CODE_CHILD_SESSION OTL_TURN_CAPTURE=off PATH="$S/cli/node_modules/.bin:$PATH" bash scripts/ci/claude_p_retry.sh "$S/out.json" --
      --output-format json --max-turns 1 >/dev/null 2>&1; done) && wc -l < "$S/out.json.sessions.jsonl" &&
      bin/venv-python -m scripts.telemetry_capture ci-pass --manifest "$S/out.json.sessions.jsonl" --workflow-path
      .github/workflows/ci-rca.yml --ref refs/heads/main --repository otl-labs/probe --run-id 1 --run-attempt 1 --job rca
      --event-name workflow_dispatch --sha "$(git rev-parse HEAD)"
    expected: >-
      The manifest has 4 lines (a start and a result line per attempt); ci-pass prints CI_CAPTURE off
      reason=repository_mismatch sessions=2 and writes nothing. Then, by hand, each session's tree is found under
      ~/.claude/projects and record_turn at v8 with a full sidecar yields a top-level telemetry_agents open row and a
      telemetry_sessions open row whose checkout_sha is the clone's HEAD.
    fix_if: A session id is not honoured on 2.1.148 (fall back to the result JSON session_id and re-plan), or the tree is not found.
    hermetic: false
    graduation: not-applicable
  - step: 10
