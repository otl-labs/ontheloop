bundled_recommendations:
  - rec-4424
followon_recs: []
infrastructure_dependencies:
  - >-
    No Terraform and no IAM: ci-rca's existing branch role (agent-platform-github-ci-branch) already holds the telemetry
    writer URL invoke grant and SSM /agent-platform/* read (FINDINGS.md section 1).
  - >-
    Merge redeploys through governed CI channels only: field_semantics.yaml and src/row_rules consumers -> every DuckLake
    Lambda (deploy-ducklake-lambdas); ducklake_event_read_sql.py and ducklake_event_read_verbs.py -> the telemetry
    reader; ducklake_reader_client.py -> data-pipeline (deploy-prod-lambdas). The build re-runs compute_affected_artifacts
    over its final diff and names every artifact in the PR body. No break-glass deploy, no admin credential.
acceptance_criteria:
  - Every claude_p_retry.sh attempt runs under its own --session-id and leaves a start line and a result line in the manifest; two invocations append to one manifest.
  - ci-pass captures an allow-listed workflow on refs/heads/main of otl-labs/ontheloop and is off, with one fixed token, for every other gate input; no GITHUB_* is read by ci_pass.py, runner.py or src/turn_capture (switch.py's GITHUB_ACTIONS hook veto is the sole exception).
  - Hook capture stays off in Actions (switch_mode without a gate is unchanged); a switch git-show timeout after a resolved ref reads OFF (rec-4424).
  - The sidecar is written once and never overwritten with different content; rule P-5 defers a project_ref conflict.
  - Parser v8 writes one top-level telemetry_agents open/close pair per root session whose tree carries a valid host-run sidecar, with observation_id NULL, host_run_ref, workflow_run_id and trigger; workflow = the source_registry key; withheld policy yields plan 1's withheld_by_policy omissions (empty-string digest, 0 bytes); the golden corpus, registry and digest are at 8.
  - The writer rejects a top-level telemetry_agents row without host_run_ref and accepts sub-agent rows unchanged.
  - Completeness counts top-level-run roots as captured_host_runs, never as captured_without_key.
  - The pairing rule fails an unpaired claude_p_retry.sh call site, a stale exemption and a listed claude.yml, and passes the real tree.
  - The first post-merge ci-rca run whose agent step succeeded is captured end to end in production, and the capture step does not change the job's conclusion.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      Wrapper behaviour: the two new nodes (the whole module, incl. the env -i and refused-flag nodes, runs in execution
      step 3).
    command: bin/venv-python -m pytest tests/test_ci_claude_p_retry.py::test_each_attempt_runs_under_its_own_session_id tests/test_ci_claude_p_retry.py::test_manifest_appends_start_and_result_lines_across_invocations -q
    expected: Both pass; both are absent before the change.
    fix_if: A retry reuses a session id, a start or result line is missing, the manifest is truncated, or an exit code changes.
    hermetic: true
    expected_literals: [passed]
    graduation: graduate
    graduation_check_id: claude-p-retry-session-manifest
  - step: 2
    phase: pre-deploy
    action: rec-4424's acceptance node and the CI gate (the whole test_switch.py module runs in execution step 2).
    command: >-
      bin/venv-python -m pytest tests/telemetry_capture/test_switch.py::test_switch_show_timeout_after_a_resolved_ref_reads_off
      tests/telemetry_capture/test_switch.py::test_ci_gate_reads_ci_only_for_an_allow_listed_main_run -q
    expected: Both pass; both are absent before the change (today the timeout falls through to the working tree).
    fix_if: A timeout still falls through, a gate input outside the allow-list reads ci, or a hook caller reads on under GITHUB_ACTIONS.
    hermetic: true
    expected_literals: [passed]
    graduation: graduate
    graduation_check_id: telemetry-capture-ci-gate
  - step: 3
    phase: pre-deploy
    action: ci-pass and the runner's ci mode.
    command: >-
      bin/venv-python -m pytest tests/telemetry_capture/test_ci_pass.py tests/telemetry_capture/test_runner.py
      tests/telemetry_capture/test_main.py tests/telemetry_capture/test_cursor_tree.py -q
    expected: All pass; test_ci_pass.py is red before (module absent).
    fix_if: A sidecar is overwritten, a printed line carries an id, sha or path, verify or a reader is called, or a path exits nonzero.
    hermetic: true
    expected_literals: [passed]
    graduation: graduate
    graduation_check_id: telemetry-capture-ci-pass
  - step: 4
    phase: pre-deploy
    action: The composite action, its delegate and the ci-rca wiring.
    command: bin/venv-python -m pytest tests/test_telemetry_ci_capture_action.py tests/test_subagent_review_wiring.py -q
    expected: All pass; red before (action absent).
    fix_if: capture.sh exits nonzero on any path, writes a GITHUB_* file, leaks ambient AWS_* when credential inputs are set, or the ci-rca step is not last with if always and continue-on-error.
    hermetic: true
    expected_literals: [passed]
    graduation: graduate
    graduation_check_id: telemetry-ci-capture-action
  - step: 5
    phase: pre-deploy
    action: Parser v8 rules, then the golden corpus at 8, the registry, line-cut purity and the derived layer.
    command: >-
      bin/venv-python -m pytest tests/turn_capture/test_host_run.py tests/turn_capture/test_sessions.py
      tests/turn_capture/test_transcripts.py tests/turn_capture/test_transcript.py
      tests/turn_capture/test_record_turn.py::test_golden_cases_match_expected_rows
      tests/turn_capture/test_record_turn.py::test_incremental_equals_full_at_every_line_cut
      tests/turn_capture/test_record_turn.py::test_finalize_resume_schedules_emit_each_row_once
      tests/turn_capture/test_record_turn.py::test_new_cases_are_built_from_their_builders
      tests/telemetry/test_parser_version_registry.py tests/telemetry/test_derived_layer_reconciliation.py
      tests/telemetry_verify/test_derive.py -q
    expected: All pass.
    fix_if: >-
      Regenerate expected_rows only after test_host_run.py passes. A line-cut failure is a purity defect in a v8 rule,
      never a test to relax; a change in an existing case other than parser_version is a defect to explain or fix.
