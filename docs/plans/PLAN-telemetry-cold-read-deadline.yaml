    jobs={x['name']:x.get('conclusion') for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);
    want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke']; assert all(any(n.startswith(w)
    and c=='success' for n,c in jobs.items()) for w in want),jobs;print('DEPLOY_OK')"
  expected: Every named job concluded success (a skipped job fails this step), then DEPLOY_OK.
  fix_if: A failed deploy or smoke step is this plan's to root-cause and fix forward, never a re-run to green (Decision 55).
  hermetic: false
- step: 12
  phase: post-deploy
  action: >-
    Forced-cold reads on the deployed reader (reset_warm_connection, then one read, retried up to three times until
    its invocation line shows connect_reused false): the busiest day and a 3-day window, with each read's server line,
    elapsed time and Max Memory Used from CloudWatch.
  command: |-
    export DUCKLAKE_READER_URL=$(aws ssm get-parameter --profile agent_platform --region eu-west-2 --name /agent-platform/ducklake/reader_url --query Parameter.Value --output text) && AWS_PROFILE=agent_platform bin/venv-python - <<'EOF'
    import json, re, time, boto3
    from scripts.ducklake_smoke import core
    U = core._function_url("reader"); G = "/aws/lambda/agent-platform-ducklake-reader"
    L = boto3.Session(profile_name="agent_platform").client("logs", region_name="eu-west-2")
    def server(rid):
        for _ in range(18):
            ev = L.filter_log_events(logGroupName=G, filterPattern=f'"{rid}"', startTime=int((time.time() - 1800) * 1000))["events"]
            rep = [e for e in ev if e["message"].startswith("REPORT")]
            if rep:
                break
            time.sleep(10)
        else:
            raise SystemExit(f"no REPORT line for {rid} after 3 minutes: report it, never guess")
        lo, hi = min(e["timestamp"] for e in ev), max(e["timestamp"] for e in ev)
        body = L.get_log_events(logGroupName=G, logStreamName=ev[0]["logStreamName"], startTime=lo, endTime=hi + 1, startFromHead=True)["events"]
        inv = [json.loads(e["message"]) for e in body if '"ducklake_invocation"' in e["message"]][-1]
        mem = int(re.search(r"Max Memory Used: (\d+) MB", rep[0]["message"]).group(1))
        return inv, mem, "Status: timeout" in rep[0]["message"]
    def cold(day_from, day_to):
        for _ in range(3):
            core._sigv4_invoke(U, {"action": "reset_warm_connection"})
            t = time.perf_counter()
            r = core._sigv4_invoke(U, {"action": "named_read", "verb": "sessions_window", "params": {"day_from": day_from, "day_to": day_to, "as_of": "2026-10-19T00:30:00+00:00"}})
            dt = time.perf_counter() - t
            inv, mem, timed_out = server(r.headers["x-amzn-RequestId"])
            if not inv["connect_reused"]:
                typed = r.status_code == 504 and r.json().get("error_type") == "read_deadline_exceeded"
                assert (r.status_code == 200 or typed) and dt < 120 and mem < 900 and not timed_out, (r.status_code, dt, mem)
                return r.status_code, round(dt, 1), inv["elapsed_ms"], mem
        raise SystemExit("never landed cold after three resets")
    day = cold("2026-10-17", "2026-10-17")
    print("COLD_DAY", *day, "target_met" if day[0] == 200 and day[1] < 110 else "target_missed")
    print("COLD_3DAY", *cold("2026-10-16", "2026-10-18"))
    print("COLD_READS_OK")
    EOF
  expected: >-
    A COLD_DAY line (status, wall seconds, server ms, memory MB, target_met or target_missed), a COLD_3DAY line, then
    COLD_READS_OK. Report both lines verbatim; they go on rec-4474 for the compaction plan.
  fix_if: >-
    A runtime 502, a timeout, or a read over 120 s means the deadline failed: stop and RCA. Memory at or above 900 MB:
    stop and RCA before more traffic (rec-4296 exits share this function). target_missed is not a failure: report it to
    the coordinator with the numbers. If a response lacks the x-amzn-RequestId header, find the log line by time window
    and say so.
  hermetic: false
- step: 13
  phase: post-deploy
  action: >-
    A cold read with deadline_ms 5000 through the client raises ReadDeadlineExceededError after one call, the reader
    answers within the 10 s margin of that deadline, and the next read on the same container answers 200 on the kept
    (or probe-reopened) slot.
  command: |-
    export DUCKLAKE_READER_URL=$(aws ssm get-parameter --profile agent_platform --region eu-west-2 --name /agent-platform/ducklake/reader_url --query Parameter.Value --output text) && AWS_PROFILE=agent_platform bin/venv-python - <<'EOF'
    import json, time, boto3
    from scripts.ducklake_smoke import core
    from src.common.ducklake_reader_client import DuckLakeReader, ReadDeadlineExceededError
    U = core._function_url("reader"); G = "/aws/lambda/agent-platform-ducklake-reader"
    L = boto3.Session(profile_name="agent_platform").client("logs", region_name="eu-west-2")
    P = {"day_from": "2026-10-16", "day_to": "2026-10-18", "as_of": "2026-10-19T00:30:00+00:00"}
    def stream_and_line(rid):
        for _ in range(18):
            ev = L.filter_log_events(logGroupName=G, filterPattern=f'"{rid}"', startTime=int((time.time() - 1800) * 1000))["events"]
            if any(e["message"].startswith("REPORT") for e in ev):
                break
            time.sleep(10)
        else:
            raise SystemExit(f"no REPORT line for {rid} after 3 minutes: report it, never guess")
        lo, hi = min(e["timestamp"] for e in ev), max(e["timestamp"] for e in ev)
        body = L.get_log_events(logGroupName=G, logStreamName=ev[0]["logStreamName"], startTime=lo, endTime=hi + 1, startFromHead=True)["events"]
        return ev[0]["logStreamName"], [json.loads(e["message"]) for e in body if '"ducklake_invocation"' in e["message"]][-1]
    for _ in range(3):
        core._sigv4_invoke(U, {"action": "reset_warm_connection"})
        t = time.perf_counter()
        try:
            DuckLakeReader(profile="agent_platform")._invoke({"action": "named_read", "verb": "sessions_window", "params": P, "deadline_ms": 5000})
            continue
        except ReadDeadlineExceededError as exc:
            wall, err = time.perf_counter() - t, exc
        b = core._sigv4_invoke(U, {"action": "named_read", "verb": "sessions_window", "params": {**P, "day_from": "2026-10-14", "day_to": "2026-10-14"}})
        (sa, ia), (sb, ib) = stream_and_line(err.body["request_id"]), stream_and_line(b.headers["x-amzn-RequestId"])
        if sa == sb and not ia["connect_reused"]:
            break
    else:
        raise SystemExit("no cold deadline answer followed by a same-container read in three attempts")
    late_ms = ia["elapsed_ms"] - (ia["connect_ms"] or 0) - 5000
    print("CLIENT_DEADLINE", err.status, err.body.get("error_type"), round(wall, 1), "late_ms", round(late_ms))
    print("NEXT", b.status_code, "reused", ib["connect_reused"], "reopened", ib["reopened"])
    assert err.status == 504 and err.body["error_type"] == "read_deadline_exceeded" and wall < 60 and late_ms < 10000 and b.status_code == 200
    print("DEADLINE_OK")
    EOF
  expected: >-
    A CLIENT_DEADLINE line (504, read_deadline_exceeded, wall seconds under 60, late_ms under 10,000), a NEXT line (200,
    and whether the slot was reused or reopened after the probe), then DEADLINE_OK. Report both lines: late_ms is the
    evidence for the 10 s margin, and reused or reopened tells the compaction plan whether interrupts break the catalog
    connection.
  fix_if: >-
    late_ms at or above 10,000: the margin is too small for real reads (bind or plan time is not interruptible); stop,
    report it, and raise DEADLINE_MARGIN_S in a forward fix after RCA. A 500 on the next read means a broken interrupted
    slot escaped the probe: stop and RCA. A 502 instead of the 504 means the interrupt overran the Lambda timeout: stop
    and RCA. Three attempts without a cold same-container pair: report it with the CLIENT_DEADLINE line and the unit
    evidence.
  hermetic: false
- step: 14
  phase: post-deploy
  action: >-
    rec-2879 closed through the squash-merge Resolves trailer; rec-4474 stays open with a dated note appended to its
    existing context carrying the step 12 and 13 lines.
  command: >-
    AWS_PROFILE=agent_platform bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids,
    make_reader; rows, missing = fetch_recs_by_ids(make_reader(), ['rec-2879','rec-4474']); st={r['id']: r['status']
    for r in rows}; ctx={r['id']: r['context'] for r in rows}; print(st, missing); assert not missing and st ==
    {'rec-2879': 'closed', 'rec-4474': 'open'}, st; assert 'telemetry-cold-read-deadline' in ctx['rec-4474'] and
    ctx['rec-4474'].startswith('2026-10-19 investigation'); print('RECS_OK')"
  expected: rec-2879 closed, rec-4474 open with its original context kept and this plan's note appended, then RECS_OK.
  fix_if: >-
    rec-2879 open: check the trailer and the ci.yml closure job's run, then close it through the portal with this
    plan's evidence. rec-4474 without the note: append it through the portal (read the context first, write it back
    with the note added).
  hermetic: false
