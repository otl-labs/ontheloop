schema_version: 5
implementation_declared: true
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-cold-read-deadline
intent: >-
  Cold telemetry window reads stop timing out on the DuckLake reader (rec-4474): the reader's telemetry slot reads its
  many small Parquet files at 8 DuckDB threads instead of 1, and an event-journal read that still cannot finish is
  interrupted before the Lambda timeout and answers a typed 504 read_deadline_exceeded that the client never retries,
  so the execution environment (both warm slots and the file cache) survives instead of being reset. Session reads are
  the inputs slice 4 verification and the feedback loop depend on (PROJECT_CONTEXT telemetry as evidence). Compaction of
  the telemetry tables, the durable fix, stays with rec-4474 for a later plan.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-cold-read-deadline.yaml
phase: >-
  ad_hoc_rec (rec-4474, stopgap half; rec-2879 bundled); related tier item T2.36 (telemetry re-lands on DuckLake).
  Closes no exit criterion. V3: the merge redeploys the DuckLake Lambdas (ducklake_event_reads.py and the new module
  are in the active ducklake_reader manifest, Decision 79) through deploy-ducklake-lambdas.yml (Decision 126).
scope:
- file: src/common/ducklake_read_deadline.py
  action: Create
  purpose: >-
    Leaf module (stdlib plus src.common.ducklake_handler_errors only; no Lambda context, Decision 212).
    DEADLINE_MARGIN_S = 10.0; RESEND_INTERVAL_S = 0.05; READ_DEADLINE_ERROR_TYPE = "read_deadline_exceeded".
    fire_after_s(remaining_ms, caller_ms) returns the earlier of remaining_ms / 1000 - DEADLINE_MARGIN_S and
    caller_ms / 1000 (either may be None; None when both are), never floored, so a spent deadline reads at or below 0.
    run(con, call, fire_after, on_fire): fire_after None runs call() directly; fire_after <= 0 calls on_fire() and raises
    the deadline fault without calling call(); otherwise a daemon threading.Timer(fire_after) callback sets a fired flag,
    calls on_fire(), then calls con.interrupt() again every RESEND_INTERVAL_S until a done Event is set (DuckDB 1.5.4
    drops an interrupt that arrives before execution starts and honours one only between tasks, so a single send can be
    lost; verified at plan critique), checking the done Event immediately before each send. The done Event is set, the
    timer cancelled and joined (timeout 2 * RESEND_INTERVAL_S) in a finally on every path, so no callback thread
    outlives the call into the next invocation (Lambda freezes threads between invocations). An exception from call() whose class is InterruptException (module
    _duckdb or duckdb, matched by name like the handler's caller-input classes) is raised as TypedFault(504,
    READ_DEADLINE_ERROR_TYPE, "reader_deadline") from it only when the flag is set; any other exception, and an
    InterruptException without the flag, propagates unchanged. runner(remaining_ms, caller_ms, on_fire) returns a
    callable runner(con, call) that evaluates remaining_ms() (a zero-arg callable or None) and fire_after_s at the moment
    it is invoked, after the connection was acquired, so an ATTACH never eats the margin.
- file: src/common/ducklake_event_reads.py
  action: Modify
  purpose: >-
    Imports ducklake_read_deadline at module scope (unlike its function-local reader-only imports), so the staged-bundle
    handler import check (scripts.lambda_manifest --check-bundles) proves the manifest include. (1) TELEMETRY_THREADS =
    8 beside TELEMETRY_MEMORY_LIMIT; _telemetry_opener runs SET threads to it and SET
    pg_use_ctid_scan=false after the memory_limit statement: the extra threads parallelise Parquet I/O only, and catalog
    scans keep today's serial single-connection shape (the postgres extension opens extra Neon connections beyond its
    pool for parallel ctid scans; Decision 88 budget). open_connection and the ops slot keep threads=1. (2) An optional
    named_read envelope field deadline_ms (beside limit, never inside params): for an event verb it must be a positive
    integer (not a bool), else EventReadInputError(verb, "deadline_ms", ...) before any ATTACH; acquirer_for refuses
    deadline_ms on a named_read of a non-event verb with DuckLakeRuntimeError before any connect. (3)
    deadline_guard(action, payload, remaining_ms) returns ducklake_read_deadline.runner(remaining_ms,
    payload's deadline_ms, a closure marking the telemetry slot interrupted) for a named_read of an event verb, and
    runner(None, None, a no-op) for every other action. (4) The telemetry acquire passes probe_sql = a catalog-touching
    probe over the small DuckLake metadata table (__ducklake_metadata_<telemetry alias>.ducklake_metadata) to
    rt.get_warm_connection on the first acquire after the slot was marked, then clears the mark; otherwise the default
    SELECT 1. A failed probe reopens through get_warm_connection's existing probe-failure path; no new reopen trigger and
    no per-acquire catalog round trip.
- file: src/lambdas/ducklake_reader/handler.py
  action: Modify
  purpose: >-
    Straight-line wiring only (so tests/test_ducklake_reader_handler.py's existing paths cover it, 495 SLOC there):
    handler() passes getattr(context, "get_remaining_time_in_millis", None) into _handle; _handle obtains
    ev.deadline_guard(action, payload, remaining_ms) and runs both the first fn(payload, con) call and the reopen-once
    call through it (each attempt gets its own deadline, computed when it starts). A TypedFault from the guard reaches
    handler_errors.terminal unchanged (504 body {ok, error_type, reason, request_id, action} and one ducklake_typed_fault
    log line). ducklake_handler_errors.py is not edited, so the writer bundles' code is unchanged.
- file: src/lambdas/ducklake_reader/manifest.yaml
  action: Modify
  purpose: includes gains src/common/ducklake_read_deadline.py.
- file: src/lambdas/data-pipeline/manifest.yaml
  action: Modify
  purpose: excludes gains src/common/ducklake_read_deadline.py with the comment "reader-bundle only (rec-4474)".
- file: src/common/ducklake_reader_client.py
  action: Modify
  purpose: >-
    ReadDeadlineExceededError(ReaderInvokeError), raised after one POST when the reader answers 504 with body error_type
    read_deadline_exceeded (the ResponseTooLargeError shape); _READ_DEADLINE_ERROR_TYPE literal (the client cannot
    import the reader-only module: data-pipeline bundles this file). Every other 502/503/504 keeps today's two retries
    and _READER_TRANSIENT_STATUS stays {502, 503, 504} (Decision 155 parity). rec-2879: the retry log line and the
    comment above the constants stop calling every 5xx a cold-resume (a 502 now means a process exit or a deadline
    overrun, a 503 catalog_unavailable).
- file: scripts/agent_sdk/errors.py
  action: Modify
  purpose: >-
    ReaderDeadlineError(AgentToolError) for error_type read_deadline_exceeded, its message telling the agent to narrow
    the window; the module docstring's status list gains the 504 line.
- file: scripts/ops_portal/reader_transient.py
  action: Modify
  purpose: >-
    Docstring only: the sentence naming the reader client's cold-resume log line as an uncorrected mislabel is removed
    (rec-2879 corrects it), and the consumer-impact note records that 504 read_deadline_exceeded carries an error_type
    and so gates, answered only by event-journal verbs, which none of the listed consumers call.
- file: docs/contracts/ducklake_reader.yaml
  action: Modify
  purpose: >-
    Class B. named_read: payload_schema_ref names the optional deadline_ms (event verbs only, a positive integer of
    milliseconds, applied per query attempt); response_codes gain 504 read_deadline_exceeded and the 400 row names
    deadline_ms, the 500 row and the runtime typed_error name deadline_ms on a non-event verb beside limit on a
    non-paginable verb; typed_errors gain read_deadline_exceeded ("an event-journal verb still running at the reader's
    deadline, the Lambda's remaining time when the attempt starts minus 10 s or the caller's deadline_ms if earlier, is
    interrupted: 504 {error_type, reason: reader_deadline, request_id, action}; never retried; narrow the window"). The
    no-502 invariant is amended: a deadline answers 504; process-level failures (an interrupt that overruns the margin,
    for example during query bind or planning where DuckDB does not honour it, out of memory, Runtime.ExitError, an init
    failure) remain the runtime's 502, rec-4296 owning the exits. A telemetry-slot invariant states threads 8 for I/O
    overlap on many small files with serial catalog scans (the ops slot keeps 1) and the one catalog probe after an
    interrupt. amendment_log entry (field_add, semantic_break false, migration_story: additive; a read that used to time
    out as a retried 502 is now a non-retried typed 504).
- file: tests/common/test_ducklake_read_deadline.py
  action: Create
  purpose: >-
    Mirror test of the new module, with fake connections whose execute blocks until interrupt() is called:
    test_deadline_interrupts_and_answers_typed_504 (TypedFault 504, error_type and reason, on_fire called, timer
    cancelled, the done Event set and the timer thread no longer alive when run returns), test_interrupt_is_resent_until_the_call_returns (a fake that ignores every
    interrupt sent before its execute starts still answers the 504), test_spent_deadline_answers_504_without_running_the_call,
    test_runner_reads_remaining_time_when_invoked (a remaining-time callable that falls between building the runner and
    invoking it), test_unflagged_interrupt_is_not_a_deadline, test_other_errors_pass_through_and_cancel_the_timer,
    test_no_deadline_runs_the_call_directly, test_fire_after_is_the_earlier_deadline (margin, caller, negative, None);
    test_contract_declares_the_deadline_answer (named_read 504 row, typed_errors entry, deadline_ms named, the amended
    no-502 invariant, the amendment_log entry). With a function-level pytest.importorskip("duckdb"), on an in-memory
    DuckDB and a range query that runs well over 10 s uninterrupted:
    test_real_duckdb_interrupt_answers_504_and_the_connection_survives (a short fire_after: TypedFault 504, then SELECT 1
    answers on the same connection), test_real_duckdb_early_interrupt_is_resent (fire_after 0.0001: the 504 arrives
    within 2 s), test_real_duckdb_spent_deadline_never_runs_the_query (fire_after 0: the 504 without executing) and
    test_real_duckdb_accepts_the_telemetry_slot_settings (LOAD postgres, then the opener's SET threads and SET
    pg_use_ctid_scan statements built from ducklake_event_reads' constants, read back with current_setting).
- file: tests/common/test_ducklake_event_reads.py
  action: Modify
  purpose: >-
    The existing opener test keeps calls[0] as the memory_limit statement; new nodes
    test_telemetry_opener_sets_threads_and_serial_catalog_scans, test_deadline_ms_is_refused_before_any_attach (0, -1,
    True, "5" each an EventReadInputError naming deadline_ms, nothing opened), test_deadline_ms_on_an_ops_verb_is_refused,
    test_deadline_guard_is_identity_off_event_verbs, test_deadline_guard_marks_the_slot_on_a_spent_deadline (an event
    verb's runner with a remaining time under the margin answers the TypedFault without running the call and marks the
    slot) and test_interrupted_slot_probes_the_catalog_once (the next acquire passes the catalog probe, a failing probe
    reopens, the acquire after uses SELECT 1). Stays under 500 SLOC (392 today); the runner's own behaviour is tested in
    the new module's mirror file.
- file: tests/lambdas/ducklake_reader/test_event_routing.py
  action: Modify
  purpose: >-
    Through the real handler with the existing wiring fixture and fake contexts: test_event_verb_past_its_deadline_answers_504
    (remaining time under the margin: body shape, status 504, the ops slot untouched),
    test_ops_verbs_run_without_a_deadline (an ops read under the same context answers 200) and
    test_reopen_once_runs_under_the_deadline (a remaining-time callable above the margin on the first attempt, whose
    query raises the fixture's dead-session error, and below it on the second: the slot reopens, then the second attempt
    answers 504).
- file: tests/common/ducklake_reader_client/test_reader_deadline.py
  action: Create
  purpose: >-
    test_deadline_504_is_raised_after_one_post (one requests.post, ReadDeadlineExceededError carrying status and body),
    test_other_5xx_still_retry_twice (untyped 502, 503 catalog_unavailable, 504 without the type),
    test_error_type_literal_matches_the_reader (client literal equals ducklake_read_deadline.READ_DEADLINE_ERROR_TYPE)
    and test_retry_log_does_not_claim_a_cold_resume (rec-2879's re-grounded acceptance names this node).
- file: tests/test_agent_sdk_errors.py
  action: Modify
  purpose: New node test_read_deadline_maps_to_reader_deadline_error.
bundled_recommendations:
- rec-2879
followon_recs:
- rec-4474
closes_criteria: []
infrastructure_dependencies:
- >-
  No Terraform, IAM, Lambda size or timeout change. The merge redeploys the DuckLake Lambdas through
  deploy-ducklake-lambdas.yml (governed CI, Decision 125/126); the coordinator sequences it against any other DuckLake
  deploy, apply or replay (one at a time).
- >-
  data-pipeline (Decision 79 deferral, confirmed at Step 6b): its zip carries ducklake_reader_client.py, but
  deploy-prod-lambdas.yml does not trigger on src/common/** and none of its bundled entry points calls a named verb
  (step 8 proves it), so the new 504 is unreachable there; it takes the client change at its next governed deploy.
acceptance_criteria:
- >-
  The telemetry slot runs DuckDB at 8 threads with serial catalog scans (VP 2, VP 3); open_connection and the ops slot
  keep 1 thread (the existing SET threads=1 nodes in tests/common/test_ducklake_runtime.py, unchanged, in the tiers VP
  10 runs).
- >-
  An event-journal read still running at the deadline is interrupted (re-sent until it lands) and answers 504
  read_deadline_exceeded through the handler; a deadline already spent answers 504 without running the query; an
  interrupt the deadline did not fire stays 500 unmapped; ops actions run with no deadline; the interrupted slot is kept
  and its next acquire runs one catalog probe, reopening if it fails (VP 1-4).
- >-
  The client raises ReadDeadlineExceededError after one POST for that answer and keeps today's retries for every other
  502/503/504; the agent SDK maps it to ReaderDeadlineError; no log line calls a 5xx a cold-resume; data-pipeline
  never calls a named verb (VP 5-8).
- The reader contract declares deadline_ms, the 504 and the amended no-502 invariant (VP 1).
- >-
  Deployed, forced cold: the busiest day (2026-10-17) and a 3-day window (2026-10-16..18) each answer 200 or a typed
  504 within 120 s, never the runtime's 502 or a timeout, with Max Memory Used below 900 MB. The busiest day answering
  200 within 110 s is the target: reported on rec-4474 either way, and a miss is reported, not rolled back (VP 12).
- >-
  Deployed: a cold read with deadline_ms 5000 makes the client raise ReadDeadlineExceededError after one call, the
  reader answers within the 10 s margin of its deadline, and the next read on the same container answers 200 on the
  kept or probe-reopened slot (VP 13).
- rec-2879 reads closed; rec-4474 stays open with the measured numbers appended for the compaction plan (VP 14).
