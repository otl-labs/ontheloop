    tests/common/test_ducklake_read_deadline.py::test_spent_deadline_answers_504_without_running_the_call
    tests/common/test_ducklake_read_deadline.py::test_runner_reads_remaining_time_when_invoked
    tests/common/test_ducklake_read_deadline.py::test_unflagged_interrupt_is_not_a_deadline
