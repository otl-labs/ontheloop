constraints:
- >-
  Compaction is out of scope (Decisions 88, 143 and 191 own its scope; rec-4474 carries it). No Terraform, IAM, Lambda
  memory or timeout change, no new verb and no caller SQL (Decision 84 I-3).
- >-
  The deadline covers event-journal verbs only: ops reads keep their current failure shape, so Decision 155's
  consumers (DCG-03, the DQ runner, the CI-RCA gauges) see no change. _READER_TRANSIENT_STATUS and the classifier's
  allow-list stay unchanged.
- >-
  No new reopen trigger (Decision 88 cl.1(i)): the interrupted slot reuses get_warm_connection's existing probe-failure
  reopen; the catalog probe runs on one acquire per interrupt, never per acquire; catalog scans stay serial.
- >-
  The Lambda context is read only in the handler (Decision 212); src/common receives plain numbers and callables.
- Files stay under 500 SLOC; decompose, never raise a budget (Decision 128).
- 'Public repository (Decision 101): live steps print statuses, timings and counts only.'
- No rescue agents or workaround loops (Decision 55); a failed live step stops for RCA.
