  2. A telemetry column ships contract first, as a nullable field_add, through the governed deploy, and no producer
  emits it before that deploy is green: the writer refuses undeclared columns (Decision 210 cl.4 applied to columns).
  3. On a production telemetry catalog (slice 2c onward) adding a column stays an admin step under the owner login
  (Decision 216 cl.3); the telemetry-schema-churn condition keeps counting production changes only. Rationale: a
  nullable addition is the one schema change that keeps every stored row valid and every reader and writer path
  unchanged; DuckLake supports ADD COLUMN (the ops precedent, ducklake_tables.reconcile_table_columns) and owner ALTERs
  keep the scoped login's access through default privileges (Decision 216's measurement, re-run here). Rejected: an
  admin drop and re-create of the smoke tables; a JSON metadata column (values unchecked at write; the operator's
