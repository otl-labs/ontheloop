schema_version: 5
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-column-additions
intent: >-
  Give the claude_code capture producer typed, write-checked homes for the facts the slice 4 verification review found
  missing (rec-4025 inputs; rec-4354, rec-4359): four nullable columns on telemetry_sessions (harness_session_key, the
  harness's own session id and the join key to its session lists; checkout_sha, checkout_base_sha and checkout_dirty,
  the code each session segment ran) and six on telemetry_observations (usage_final and usage_source, whether a
  model_call's tokens are final and where they came from; requested_model; reasoning_effort; cache_creation_1h_tokens
  and cache_creation_5m_tokens). The disposable smoke catalog's owner-login table step learns to add a declared
  nullable column an existing telemetry table lacks, under a new numbered Decision amending Decision 216. Lands
  before PLAN-telemetry-capture-producer-fixes, whose parser_version 4 fills the columns: the writer refuses
  undeclared columns, so the columns must be live first. Telemetry is the learning signal for the recursive
  self-improvement loop (PROJECT_CONTEXT); slice 4 can only prove it correct once these facts are stored.
plan_type: IMPLEMENTATION
implementation_declared: true
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-column-additions.yaml
phase: >-
  T3.20 (agent-turn telemetry capture) and T2.36 (telemetry re-lands on DuckLake): the schema half of the capture
  producer fixes Benjamin approved on 2026-10-17. Closes no exit criterion: T3.20 c3 is slice 4's orphan monitor, c6 and
  c7 are outside this work; T2.36 c1 (production residency, slice 2c) is unchanged because every column is a
  non-breaking field_add at contract_version 2.
scope:
- file: docs/contracts/telemetry_sessions.yaml
  action: Modify
  purpose: >-
    field_add (Class A, semantic_break false, contract_version stays 2) of four nullable columns, each with type,
    iceberg_type, description, semantics, populated_by and dq_intent exactly as execution step 1 pins:
    harness_session_key (string; pattern ^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$), checkout_sha and checkout_base_sha
    (string; pattern ^([0-9a-f]{40}|[0-9a-f]{64})$), checkout_dirty (boolean). One contract-level amendment_log entry
    (change_class field_add) dated the build day, with a migration_story. No other field's text changes, except the
    structural relief execution step 1 names (older block-form amendment_log entries compacted to the one-line form).
- file: docs/contracts/telemetry_observations.yaml
  action: Modify
  purpose: >-
    field_add (Class A, semantic_break false, contract_version stays 2) of six nullable columns as execution step 1
    pins: usage_final (boolean), usage_source (string; accepted_values [record, spawn_result]), requested_model
    (string), reasoning_effort (string; pattern ^[a-z][a-z0-9_-]{0,31}$), cache_creation_1h_tokens and
    cache_creation_5m_tokens (bigint; at_most tokens_cache_creation). One contract-level amendment_log entry
    (change_class field_add) with a migration_story. No other field's text changes, except the structural relief
    execution step 1 names.
- file: config/lambda/ducklake/field_semantics.yaml
  action: Modify
  purpose: >-
    Regenerated by bin/venv-python -m scripts.schema_to_field_semantics (never hand-edited); the projection gains the
    ten columns and their rules. This redeploys every DuckLake function through the governed channel.
- file: src/common/ducklake_telemetry_provision.py
  action: Modify
  purpose: >-
    create_telemetry_tables gains the additive leg (Decision N cl.1). Order: existing tables -> _refuse_half_pairs ->
    partition drift and column drift are checked first, where the ONLY tolerated drift is a declared column that an
    existing EVENT table (the four telemetry_* tables) lacks and that the CONTRACT leaves optional: its projection entry
    is nullable true, it carries no not_null rule (staged or not) and no required_when rule, and it
    is not in spec.not_null or tenant_id/project_id (spec.not_null is only the engine's NOT NULL set, narrower than the
    contract's); every other problem (a live column the spec does not declare, a missing NOT NULL column,
    any partition drift, any column drift on a dimension or counter table, a half-present pair) raises the same loud
    DuckLakeRuntimeError before any DDL, naming tables and columns only. Then one ALTER TABLE
    ops_catalog.<table> ADD COLUMN <name> <sql_type> per missing column (declared type, no default, no NOT NULL), in
    sorted (table, column) order; then check_existing_tables re-runs and must pass exactly; then absent tables are
    created as today. CreateResult gains added: tuple[str, ...] of "<table>.<column>" (empty when nothing was added).
    check_existing_tables and provision_telemetry_catalog (the writer's scoped login, DML only) are unchanged: they still
    demand live columns == declared, so the writer's telemetry gate stays red until the owner step has run. Never drops,
    renames or retypes; writes no row. Module docstring cites Decision N. Stays under 500 SLOC.
- file: src/lambdas/ducklake_maintenance_smoke/telemetry_actions.py
  action: Modify
  purpose: >-
    The response gains "added": sorted(result.added); the docstring's "create-only (no drop, no re-ALTER, no row write)"
    becomes create-or-add-nullable-column (no drop, no rename or retype, no row write) and cites "(Decision N, amending
    Decision 216 clause 2)". Nothing else changes: env pin, the pre and post ownership checks and the class-only error
    wrapping stay as they are.
- file: src/lambdas/ducklake_maintenance_smoke/handler.py
  action: Modify
  purpose: >-
    Docstring only: "plus the create-only owner-login telemetry DDL verb" becomes "plus the owner-login telemetry DDL
    verb (create-if-absent and the Decision N additive leg)". The "(Decision 216, amending Decision 143 clause 2)"
    citation stays verbatim (test_owner_provisioning_decision.py resolves Decision 216 from it).
- file: src/lambdas/ducklake_maintenance_smoke/manifest.yaml
  action: Modify
  purpose: >-
    Comments only (lines 24 and 52): "create-only" becomes "create-if-absent plus additive nullable columns". No include,
    path or field changes.
- file: scripts/ducklake_smoke/lambda_maintenance_gates.py
  action: Modify
  purpose: >-
    The create-telemetry gate fails with "MAINTENANCE_CREATE_TELEMETRY FAIL: the response did not list added columns"
    when "added" is absent or not a list of strings, and its OK line becomes "MAINTENANCE_CREATE_TELEMETRY OK created=<n>
    added=<m> foreign_owned=0 scoped_create=false" (counts only; column names never printed, the public-log rule).
- file: tests/common/test_ducklake_telemetry_provision.py
  action: Modify
  purpose: >-
    New fast-tier nodes (VP 1): test_create_tables_adds_declared_nullable_columns_an_event_table_lacks,
    test_create_tables_refuses_a_missing_not_null_column_before_any_ddl,
    test_create_tables_refuses_an_extra_live_column_before_any_ddl,
    test_create_tables_adds_no_column_to_a_dimension_or_counter_table,
    test_create_tables_adds_nothing_when_live_equals_declared and
    test_create_tables_refuses_a_missing_required_when_column_before_any_ddl and
    test_provision_still_refuses_a_missing_nullable_column. Fixtures pinned: every refusal node ALSO removes one
    tolerated optional column from an event table, so the refusal is proven to fire before that column's ALTER, and
    asserts no ALTER or CREATE statement was recorded; the not-null node removes telemetry_observations.observation_type
    (contract nullable false, no engine NOT NULL), the required_when node removes telemetry_sessions.workflow, and the
    dimension/counter node removes a nullable column from ops_tenants' history table (with an event table also missing
    one). The recording FakeCon applies each ADD COLUMN to its column map, so the post-ALTER drift re-check sees it.
    Existing nodes are unchanged (the graduated test_create_tables_never_re_alters_existing still holds: equal columns
    issue no ALTER).
- file: tests/test_ducklake_maintenance_smoke_handler.py
  action: Modify
  purpose: >-
    New node test_create_telemetry_response_lists_added_columns. SANCTIONED ASSERTION CHANGE (strengthening): the
    graduated test_create_telemetry_response_shape's key set gains "added" and it asserts out["added"] == [] for the
    fixture's all-declared tables.
- file: tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py
  action: Modify
  purpose: >-
    New nodes test_create_telemetry_gate_prints_added_count (fed real-shaped "<table>.<column>" names, asserting none
    of them appears in stdout) and test_create_telemetry_gate_fails_without_an_added_list.
    SANCTIONED ASSERTION CHANGE: test_create_telemetry_gate_passes_on_a_clean_report's exact OK line gains "added=<m>",
    and the shared _CREATE_OK fixture gains "added": [] so every node built on it (the ownership, table-count, not-ok
    and missing-created nodes) keeps its path once the gate requires the list.
- file: tests/common/test_ducklake_telemetry_column_add_integration.py
  action: Create
  purpose: >-
    pytest.mark.integration (never gates CI, rec-4071; a skip is a FAIL, the registration-integration fixture
    pattern): on a file-backed DuckLake catalog aliased ops_catalog, create the tables from the projection with the ten
    new columns removed, append rows to telemetry_sessions and telemetry_observations through
    src.telemetry.append.prepare_batch/execute_prepared, then run create_telemetry_tables with the real projection.
    Asserts: added lists the ten columns; the old rows survive and read NULL in them; partition specs are unchanged
    (inspect_partitions all true); provision_telemetry_catalog then passes; a new append carrying all ten columns lands
    and reads back equal; an identical re-send inserts 0; a second create adds nothing. The create runs through
    run_telemetry_txn, as the verb does. Then ducklake_flush_inlined_data and the catalog-wide GC calls
    ducklake_expire_snapshots (older_than now), ducklake_cleanup_old_files and ducklake_delete_orphaned_files run, and
    the reads and inspect_partitions are re-asserted: GC is catalog-wide and reaches these tables on every later deploy,
    while the smoke merge is limited to the smoke pair (GC_TABLE_SCOPE).
- file: tests/common/test_ducklake_telemetry_catalog_ownership.py
  action: Modify
  purpose: >-
    New Postgres 16 integration node test_owner_adds_a_missing_nullable_column_and_the_scoped_login_still_writes: the
    owner creates from the reduced projection; a scoped connection is opened and appends (the warm writer); the owner's
    create with the full projection adds the columns; that SAME scoped connection, never re-attached, then provisions
    and appends a row carrying them (the deploy ordering makes a writer container that attached before the ALTER the
    common case), a fresh scoped connection does the same, and the ownership report stays (0, True, False, False).
- file: tests/checks/contracts/test_telemetry_event_journal_contracts.py
  action: Modify
  purpose: >-
    New node test_capture_provenance_and_usage_columns_are_nullable_and_ruled: the ten fields exist, nullable true,
    with the pinned types and dq_intent rules, the two field_add amendment_log entries carry semantic_break false, and
    contract_version is still 2 on both contracts.
- file: tests/checks/contracts/test_write_time_enforcement_conformance.py
  action: Modify
  purpose: >-
    The rule-clean model_call scenario gains cache_creation_1h_tokens and cache_creation_5m_tokens no larger than its
    tokens_cache_creation (the at_most breaker needs a row carrying both columns, and exercised == expected fails
    otherwise), and the clean records gain a valid checkout sha, harness_session_key, reasoning_effort and usage_source
    where the derived adapter test needs one to break each new rule; no rule is skipped or excluded.
- file: tests/telemetry/test_prepare.py
  action: Modify
  purpose: >-
    SANCTIONED ASSERTION CHANGE (the projection grows): the exact at_most map over the contract-derived specs (:114)
    gains cache_creation_1h_tokens and cache_creation_5m_tokens, both mapping to tokens_cache_creation;
    reasoning_tokens -> tokens_output and the not_before assertion are unchanged.
- file: docs/DECISIONS.md
  action: Modify
  purpose: >-
    NEW numbered Decision N (origin/main max + 1 at build time; 222 at plan time: 220 and 221 are on main and 219 is
    reserved by PLAN-platform-iam-personal-release's approved text), amends [216], at most
    6,144 bytes, content pinned in execution step 6; dated trailing-bracket annotations on Decision 216 and Decision
    143 naming it (Decision 177 dialect; neither entry's text is rewritten).
- file: docs/decisions-index.json
  action: Modify
  purpose: Regenerated by bin/venv-python -m scripts.decisions_index --write.
- file: tests/checks/decisions/test_telemetry_column_additions_decision.py
  action: Create
  purpose: >-
    test_decision_entry_and_annotations: resolves N from telemetry_actions.py's "(Decision N, amending Decision 216
    clause 2)" docstring citation (never hard-coded; the test_owner_provisioning_decision.py precedent); the entry exists
    and is at most 6,144 bytes; envelope number N, amends [216], significance numbered_decision; clauses 1-3; a Coverage
    (Decision 181 cl.2) line; tokens create_telemetry_tables, ADD COLUMN, rec-4071 and rec-4316; the reversal stanza
    ids; the trailing --- separator; the dated annotations on 216 and 143, each above its entry's trailing ---; and
    Decision 216's span still at most 6,144 bytes (tests/checks/decisions/test_owner_provisioning_decision.py asserts it
    too and must stay green unchanged).
bundled_recommendations: []
followon_recs:
- rec-4408
closes_criteria: []
infrastructure_dependencies:
- >-
  No Terraform, no IAM change, no role SQL change and no admin step. The maintenance-smoke function already connects as
  the catalog owner, is env-pinned to ducklake_smoke and is the only CI-reachable DDL path (Decision 216 cl.2); owner
  ALTERs stay reachable by the scoped login through default privileges (Decision 216 rationale; VP 7 re-measures it).
- >-
  Deploy: the merge redeploys every DuckLake function (field_semantics.yaml and src/common/ducklake_*.py change). The
  pipeline's deploy-serving job does not wait for maintenance-smoke, so for a few minutes the new writer's MERGE may
  name columns the smoke tables do not have yet: such an append fails as a typed 500 (unmapped), which the capture
  runner treats as stopped and retries on its next pass (scripts/telemetry_capture/responses.py: 500 -> STOP, never
  HALT). No v3 producer row carries the new columns, so nothing is refused. The maintenance-smoke step then adds the
  ten columns and the smoke job's telemetry gate proves live == declared.
- >-
  Ordering with the producer plan: PLAN-telemetry-capture-producer-fixes merges only after this plan's deploy run is
  green, because its parser_version 4 rows carry the new columns and the writer answers an undeclared column with a 422
  schema_gate that halts that session's capture until cleared by hand. The coordinator also sequences this merge against
  any other DuckLake deploy (concurrent-applies rule).
acceptance_criteria:
- >-
  Both contracts declare the ten nullable columns with the pinned types and rules at contract_version 2, and
  field_semantics.yaml is their regenerated projection (VP 3, VP 4).
- >-
  create_telemetry_tables adds exactly the declared columns an existing event table lacks that the contract leaves
  optional (nullable, no not_null or required_when rule) and refuses every other drift before any DDL;
  provision_telemetry_catalog still issues no DDL and still refuses any column drift (VP 1).
- >-
  On a real DuckLake catalog the additive leg keeps old rows (NULL in the new columns), keeps partitions, and a row
  carrying the new columns appends, reads back and re-sends idempotently; on Postgres 16 the scoped login keeps writing
  after the owner's ADD COLUMN (VP 6, VP 7).
- >-
  The maintenance-smoke verb reports the added columns and the deploy gate prints their count (VP 2).
- Decision N is in docs/DECISIONS.md in the pinned shape, annotates Decisions 216 and 143, and Decision 216 stays within the 6,144-byte cap (VP 5).
- >-
  After the governed deploy, the smoke catalog carries the columns: the owner step reported them and the writer's
  telemetry gate (exact live == declared) passed (VP 10, VP 11, VP 12).
verification_plan:
- step: 1
  phase: pre-deploy
  action: The additive leg adds only declared nullable columns on event tables and refuses everything else before any DDL.
  command: >-
    bin/venv-python -m pytest
    tests/common/test_ducklake_telemetry_provision.py::test_create_tables_adds_declared_nullable_columns_an_event_table_lacks
    tests/common/test_ducklake_telemetry_provision.py::test_create_tables_refuses_a_missing_not_null_column_before_any_ddl
    tests/common/test_ducklake_telemetry_provision.py::test_create_tables_refuses_a_missing_required_when_column_before_any_ddl
    tests/common/test_ducklake_telemetry_provision.py::test_create_tables_refuses_an_extra_live_column_before_any_ddl
    tests/common/test_ducklake_telemetry_provision.py::test_create_tables_adds_no_column_to_a_dimension_or_counter_table
    tests/common/test_ducklake_telemetry_provision.py::test_create_tables_adds_nothing_when_live_equals_declared
    tests/common/test_ducklake_telemetry_provision.py::test_provision_still_refuses_a_missing_nullable_column -q
  expected: Exit 0, every node passes. Red before because the nodes are absent.
  fix_if: >-
    A node fails or is missing: the leg tolerated a drift it must refuse, issued DDL before the refusal, or provision
    started issuing DDL.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-create-adds-nullable-columns
- step: 2
  phase: pre-deploy
  action: The maintenance-smoke verb returns the added list and the deploy gate checks and counts it.
  command: >-
    bin/venv-python -m pytest
    tests/test_ducklake_maintenance_smoke_handler.py::test_create_telemetry_response_lists_added_columns
    tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py::test_create_telemetry_gate_prints_added_count
    tests/ducklake_neon_smoke_test/test_lambda_maintenance_gates.py::test_create_telemetry_gate_fails_without_an_added_list
    -q
  expected: Exit 0, every node passes. Red before because the nodes are absent.
  fix_if: The response lacks added, or the gate passes a response without it, or prints column names.
  hermetic: true
  graduation: graduate
  graduation_check_id: maintenance-smoke-create-reports-added-columns
- step: 3
  phase: pre-deploy
  action: Both contracts carry the ten nullable, ruled columns at contract_version 2.
  command: >-
    bin/venv-python -m pytest
    tests/checks/contracts/test_telemetry_event_journal_contracts.py::test_capture_provenance_and_usage_columns_are_nullable_and_ruled
    -q
  expected: Exit 0, the node passes. Red before because the node is absent.
  fix_if: A field is missing, not nullable, carries a different rule, or a contract_version moved.
  hermetic: true
  graduation: graduate
  graduation_check_id: telemetry-capture-columns-declared
- step: 4
  phase: pre-deploy
  action: >-
    The projection is regenerated from the contracts, every contract edit passes the contract-drift gate, and both
    contracts stay inside the contracts class's structural limits.
  command: >-
    bin/venv-python -m scripts.schema_to_field_semantics --check && bin/venv-python -c "from
    scripts.checks.contracts.validate_contract_drift import validate_contract_drift as v;f=[];v(f);assert not f,
    f;print('CONTRACTS_OK')" && bin/venv-python -c "from scripts.checks.structural.size_limits import
    validate_structural_size_limits as v;f=[];v(f);assert not f, f;print('SIZE_OK')"
  expected: Exit 0 from the projection check, then CONTRACTS_OK and SIZE_OK.
  fix_if: >-
    Regenerate with bin/venv-python -m scripts.schema_to_field_semantics; fix the amendment_log shape the drift gate
    names; a size failure takes the next relief in execution step 1's order, never a budget raise or a split.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    Three commands; all already run as standing checks in scripts.validate (the field_semantics projection check,
    validate_contract_drift and validate_structural_size_limits), so a registry row would duplicate them.
- step: 5
  phase: pre-deploy
  action: Decision N is on main in the pinned shape and annotates the two Decisions it amends.
  command: >-
    bin/venv-python -m pytest tests/checks/decisions/test_telemetry_column_additions_decision.py::test_decision_entry_and_annotations
    -q && bin/venv-python -m scripts.decisions_index --check
  expected: Exit 0 from both. Red before because the test file is absent.
  fix_if: Rewrite the entry to the pinned shape, add the annotations, regenerate the index.
  hermetic: true
  graduation: waive
  graduation_waiver_reason: >-
    A one-time text check of an append-only Decision entry; the standing decision-entry conformance and index checks
    in scripts.validate already guard the corpus.
- step: 6
  phase: pre-deploy
  action: On a real file-backed DuckLake catalog, the additive leg keeps rows and partitions and the new columns round-trip.
  command: >-
    bin/venv-python -m pytest tests/common/test_ducklake_telemetry_column_add_integration.py -m integration -q -rs 2>&1
    | tee "${TMPDIR:-/tmp}/column_add_int.log" && ! grep -Eq "[0-9]+ (skipped|failed|error)"
    "${TMPDIR:-/tmp}/column_add_int.log" && grep -Eq "[0-9]+ passed" "${TMPDIR:-/tmp}/column_add_int.log"
  expected: Exit 0 with every node passing and none skipped (a skip is a FAIL, rec-4071); the log goes in the PR description.
  fix_if: >-
    DuckLake refuses ADD COLUMN on a partitioned table with rows, re-partitions it, or the round trip differs: STOP and
    RCA (Decision 55); this is Decision N's reversal condition ducklake-alter-breaks-table.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    Needs the pinned ducklake extension download (network), which no CI tier provides until rec-4071; run before
    handoff and logged in the PR.
- step: 7
  phase: pre-deploy
  action: >-
    On Postgres 16 with a Neon-shaped non-superuser owner, the scoped login keeps verifying and writing after the
    owner's ADD COLUMN, and the single-owner report stays clean.
  command: >-
    test -n "$DUCKLAKE_TEST_PG_ADMIN_DSN" && bin/venv-python -m pytest tests/common/test_ducklake_telemetry_catalog_ownership.py
    -m integration -q -rs 2>&1 | tee "${TMPDIR:-/tmp}/ownership_pg.log" && ! grep -Eq "[0-9]+ (skipped|failed|error)"
    "${TMPDIR:-/tmp}/ownership_pg.log" && grep -Eq "[0-9]+ passed" "${TMPDIR:-/tmp}/ownership_pg.log"
  expected: Exit 0 with every node passing and none skipped; the log goes in the PR description.
  fix_if: >-
    The scoped login loses access after the ALTER or a foreign-owned relation appears: STOP; Decision N cannot hold
    and the design returns to /plan.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: Needs a local Postgres 16 server, which no CI tier provides until rec-4071.
- step: 8
  phase: pre-deploy
  action: >-
    The writer adapter still refuses a break of every declared rule, the new ones included, and each changed module
    reaches 100% coverage from its mapped test.
  command: >-
    bin/venv-python -m pytest tests/checks/contracts/test_write_time_enforcement_conformance.py -q &&
    bin/venv-python -m scripts.test_coverage_checker --check-tests --check-coverage --files
    src/common/ducklake_telemetry_provision.py src/lambdas/ducklake_maintenance_smoke/telemetry_actions.py
  expected: >-
    Exit 0 from both. scripts/ducklake_smoke/lambda_maintenance_gates.py is not in the checker's source-to-test map, so
    VP 2's nodes are its proof.
  fix_if: >-
    A new rule has no rejecting vector: give the clean record a valid value (never exclude the rule); cover the new
    branches in the mapped tests.
  hermetic: false
  graduation: waive
  graduation_waiver_reason: >-
    A whole-file re-run of a standing conformance test plus the coverage checker; both already run in scripts.validate.
- step: 9
  phase: pre-deploy
  action: Fast tier, then the full tier before handoff.
  command: bin/venv-python -m scripts.validate --pre && bin/venv-python -m scripts.validate
  expected: Exit 0 on a completed full run; a timeout is not a pass (handoff_policy).
  fix_if: Fix the named check; never skip or weaken one.
  hermetic: false
  graduation: not-applicable
- step: 10
  phase: post-deploy
  action: >-
    The governed deploy of the merge commit succeeded, each job included. Read with mcp__github__actions_list
    (list_workflow_runs, workflow deploy-ducklake-lambdas.yml, head_sha $MERGE_SHA) then list_workflow_jobs, written to
    $DEPLOY_JOBS_JSON.
  command: >-
    test -s "$DEPLOY_JOBS_JSON" && bin/venv-python -c "import json,os;j=json.load(open(os.environ['DEPLOY_JOBS_JSON']));jobs={x['name']:x.get('conclusion')
    for x in (j.get('jobs') if isinstance(j,dict) else j)};print(jobs);want=['deploy-maintenance','maintenance-smoke','reconcile-gate','deploy-serving','smoke'];assert
    all(any(n.startswith(w) and c=='success' for n,c in jobs.items()) for w in want),jobs;print('DEPLOY_OK')"
  expected: Every named job concluded success (a skipped job fails this step), then DEPLOY_OK.
  fix_if: >-
    A red maintenance-smoke or smoke job: read its log (step 11) before anything else; a red deploy blocks the producer
    plan's merge. On unrecoverable failure STOP and RCA (Decision 55).
  hermetic: false
- step: 11
  phase: post-deploy
  action: >-
    The owner step added the columns and the writer's telemetry gate passed live. Save the maintenance-smoke and smoke
    job logs (mcp__github__get_job_logs) to $MAINT_LOG_FILE and $SMOKE_LOG_FILE.
  command: >-
    test -s "$MAINT_LOG_FILE" && test -s "$SMOKE_LOG_FILE" && grep -Eq "MAINTENANCE_CREATE_TELEMETRY OK created=[0-9]+
    added=(10|0) foreign_owned=0 scoped_create=false" "$MAINT_LOG_FILE" && grep -q TELEMETRY_PROVISION_OK "$SMOKE_LOG_FILE"
    && echo COLUMN_ADDITIONS_LIVE_OK
  expected: >-
