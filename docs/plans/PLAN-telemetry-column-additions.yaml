execution_steps:
- >-
  1. Contracts. In docs/contracts/telemetry_sessions.yaml add, after coverage_after, four fields (type/iceberg_type,
  nullable true): harness_session_key (str/string) -- description "The harness's own identifier for this session, as
  the harness spells it (Claude Code: the remote session id, session_<id>); the join key to the harness's own session
  lists."; semantics "Stored exactly as the source gives it, never normalised at write: Claude Code's environment spells
  the same session cse_<same suffix>, so a reader joins on the suffix. Set on open rows by a producer that reads it from
  its source; NULL otherwise. The claude_code producer sets it from parser_version 4 (PLAN-telemetry-capture-producer-fixes)
  on every stream's open row."; populated_by "the producer, at the open event."; dq_intent {pattern:
  '^[A-Za-z0-9][A-Za-z0-9_.:-]{0,127}$'}. checkout_sha (str/string) -- description "The git commit (HEAD) the session's
  checkout was on when this session start or resume began, as the session's own start hook recorded it."; semantics
  "Per-segment provenance of the code that ran: an open row carries the startup checkout, each resume row its own. Read
  from the source transcript, never from a live git call, so it is a pure function of the source (envelope R7). NULL
  when the source does not record it (a checkout whose start hook predates it)."; populated_by "the producer, at the
  open and resume events."; dq_intent {pattern: '^([0-9a-f]{40}|[0-9a-f]{64})$'}. checkout_base_sha (str/string) --
  description "The merge-base of the checkout with the repository's default branch at that start: the main commit the
  session's code was cut from."; semantics "The back-validation key: a fix merged to main as commit C reaches this
  segment's code when C is an ancestor of checkout_base_sha. NULL when it could not be resolved at that moment (a
  shallow clone, or the default branch not yet fetched), never guessed. Same source and purity rule as checkout_sha.";
  same populated_by and pattern. checkout_dirty (bool/boolean) -- description "Whether tracked files differed from
  checkout_sha at that start."; semantics "true means the code that ran is not exactly checkout_sha. NULL when unknown.
  Same source and purity rule as checkout_sha."; same populated_by; dq_intent {}. In
  docs/contracts/telemetry_observations.yaml add, after reasoning_tokens, six fields (nullable true): usage_final
  (bool/boolean) -- description "Whether this model_call's four token classes are the call's final usage."; semantics
  "true when the source recorded the call as finished (Claude Code: the response record carries a stop_reason) or a
  final source replaced the record's usage (usage_source spawn_result); false marks the four classes as a lower bound,
  a snapshot taken while the response was still streaming (rec-4354), so a sum over such rows undercounts. NULL when the
  producer does not say (claude_code before parser_version 4). Set on model_call points only. Coverage (Decision 181
  cl.2): model_call-only is not write-enforced (the grammar's null_or_zero_when reads false as 0); the claude_code
  producer is pinned by its tests (PLAN-telemetry-capture-producer-fixes), every other producer is an unenforced
  residual owned by rec-4028, and the write-time leg is owned by rec-4408."; populated_by "the
  producer, at the model_call point event."; dq_intent {}. usage_source (str/string) -- description "Where this
  model_call's token classes came from: record | spawn_result."; semantics "record: the call's own source record.
  spawn_result: a sync sub-agent's last call whose own record was not final, taken from the parent's spawn result, which
  carries that call's final usage; used only when its three input classes equal the record's. Set on model_call points
  only; NULL when the producer does not say."; dq_intent {accepted_values: {values: [record, spawn_result]}}.
  requested_model (str/string) -- description "The model id the caller requested for this call, when the harness records
  it (Claude Code: requestedModel, e.g. claude-opus-5-5[1m])."; semantics "model stays the id that served the call
  (Claude Code: message.model). Claude Code's own per-model usage ledger is keyed by the requested id, so per-model
  reconciliation joins on this column. NULL when not recorded."; dq_intent {}. reasoning_effort (str/string) --
  description "The reasoning-effort setting in force for this call, when the harness records it (Claude Code: effort,
  e.g. xhigh)."; semantics "A confounder for any before/after comparison of model behaviour. The set is open; a closed
  set would be declared here (Decision 210 cl.3). NULL when not recorded."; dq_intent {pattern: '^[a-z][a-z0-9_-]{0,31}$'}.
  cache_creation_1h_tokens and cache_creation_5m_tokens (int/bigint) -- description "Provider-reported cache-write tokens
  of this model_call with a 1-hour (resp. 5-minute) cache lifetime: a subset of tokens_cache_creation, never a fifth
  billing class."; semantics "Cache writes are priced by lifetime, so cost at read needs the split. NULL when the
  provider did not report it; never a local estimate. The pair's sum is at most tokens_cache_creation; only each
  column's own bound is write-enforced, because the row-rule grammar has no sum leg. Coverage (Decision 181 cl.2): the
  claude_code producer is pinned by its tests (PLAN-telemetry-capture-producer-fixes); every other producer is an
  unenforced residual owned by rec-4028; the write-time sum leg is owned by rec-4408."; dq_intent {at_most:
  tokens_cache_creation}. Each contract gains
  one contract-level amendment_log entry {date: <build day>, semantic_break: false, change_class: field_add, summary
  naming this plan and the columns, migration_story: "Nullable additions: every stored row stays valid and reads NULL;
  no producer emits them before PLAN-telemetry-capture-producer-fixes; the smoke tables gain them through Decision N's
  owner step."}. Structural size (Decision 166 contracts class: 500 effective lines, 2,000-character lines; today
  observations 454, sessions 445): write each new field's dq_intent in flow form and its notes as folded scalars, and
  before adding, compact the file's older block-form amendment_log entries to the one-line flow form (the git-ops.yaml
  precedent, #1535: observations 3 entries, -22 lines; sessions 4 entries, -24 lines); if a file still exceeds 500,
