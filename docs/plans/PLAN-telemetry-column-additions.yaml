  provenance and model_call usage columns the slice 4 review found missing), but create_telemetry_tables only creates
  absent tables and its drift check refuses any column difference, so a contract column add reds the deploy's
  maintenance-smoke stage and telemetry gate; the only other path is an admin drop of the smoke tables, which loses the
