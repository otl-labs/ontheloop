work_areas: []
rollback: >-
  If the live owner step FAILS (reversal condition ducklake-alter-breaks-table), the tables never gained the columns
  and every append against the new projection answers 500: revert the whole PR in a new PR, contract fields included
  (safe, because live == the old declared set), and STOP for RCA. If it SUCCEEDED, the additions are forward-only on
  the smoke catalog. Reverting the contract fields after the deploy makes the live
  tables carry undeclared columns, which reds both the owner step and the telemetry gate, and no column is ever dropped
  (Decision 55). So a rollback reverts only the code edits (provision, verb, gate) in a new PR and keeps the contract
  fields; with the columns already present the reverted create finds no drift. Decision N stays in DECISIONS.md and is
  superseded by a later Decision if the design is reversed.
