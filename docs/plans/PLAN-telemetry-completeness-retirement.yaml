constraints:
  - "The arrival oracle's behaviour is unchanged (inferred from Decision 250 cl.5's set inclusion on harness_session_key and data-modeling-standard.yaml's telemetry_sessions join_key): normalise_key moves verbatim and session_presence.py changes nothing else."
  - "Every loosened assertion and retired record is one this plan names (Decision 235 cl.1); nothing is loosened to obtain green (Decision 181)."
  - "Retired records move by git mv, content untouched; replaced records get new check_ids (verification-registry.yaml check_id semantics, Decision 176)."
  - "No other graduated record changes; telemetry-verify-monitor-rederivation keeps its node name."
  - No rescue agents or workaround loops (Decision 55).
context:
  - "Decision-scout verdict FLAGS_FOUND (round 1). CITE: 235 (cl.1 the named weakenings and retirements need this human-confirmed plan; cl.5 floor not engaged), 244 (cl.5 retire by git mv; cl.1 surviving nodes stay pinned), 176 (cl.5 deprecated/ retirement, new check_ids), 250 (cl.3 the routine was never an enforcing check; cl.5 normalise_key behaviour unchanged), 181 (cl.1 nothing loosened to obtain green; disposition retirement for deleted subjects). CONTRADICT NOTE 254 (cl.1, cl.4 batched main runs): adopted, VP 9 reads the first completed run whose range holds the merge SHA. RELATED: 132, 189, 187, 166, 168, 62, 218, 255, 201, 226, 55, 174, 86, 127. Decisions triaged: 215 of 215. Roadmap items intersected: 4; CONFLICT: 0; RELATED: 4. Serves: NS.4 3/5 -- removing a dead module, subcommand and records stops agents reading a retired check as live. Round 2 (after the critique added tests/test_session_session_trailer.py): NO_FLAGS; CITE adds 254 (VP 9 range-aware read); Decisions triaged: 215 of 215; Roadmap items intersected: 4; CONFLICT: 0; RELATED: 4."
  - "Related-work: red_overlap verdict clear (2026-11-16, no reds)."
  - "rec-5099 (Low, open, read back 2026-11-16). Sibling rec-4439 (open, file scripts/telemetry_verify/completeness.py, read back 2026-11-16) keeps the monitor's coverage residuals and is not bundled; the closure step re-keys its file to monitor.py so it does not go stale_target (scripts/rec_relevance.py), read back by VP 10."
