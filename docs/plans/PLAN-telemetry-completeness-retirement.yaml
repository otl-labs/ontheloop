schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: telemetry-completeness-retirement
intent: >-
  Retire the dead telemetry completeness check (rec-5099): the module, its CLI subcommand, its tests and the
  registry records that pin them, so no surface suggests a live check that the operator retired on 2026-11-10 and
  Decision 250's arrival check replaced. The one helper the arrival check still uses (normalise_key) moves into
  session_presence.py unchanged.
plan_type: IMPLEMENTATION
verification_tier: V2
plan_path: docs/plans/PLAN-telemetry-completeness-retirement.yaml
phase: >-
  ad_hoc_rec (soft-warn exception category): rec-5099, split from rec-4439 on 2026-11-12. No tier_item is targeted
  and no exit criterion is closed, so the Tier Item Freshness Gate is skipped and closes_criteria is empty.
closes_criteria: []
cites: [dec:176, dec:181, dec:235, dec:244, dec:250, dec:254]
scope:
  - file: scripts/telemetry_verify/completeness.py
    action: Delete
    purpose: The retired completeness join (harness session lists against captured roots); nothing in .github/workflows calls it.
  - file: scripts/telemetry_verify/session_presence.py
    action: Modify
    purpose: >-
      Own normalise_key and its _PREFIXES tuple, moved verbatim from completeness.py (same name, signature, docstring
      and behaviour); drop the completeness import; the module docstring's import sentence then names only the standard library, yaml and its first-party imports (read_route is no longer named unless imported).
  - file: scripts/telemetry_verify/__main__.py
    action: Modify
    purpose: >-
      Remove the completeness subcommand and everything only it uses (DEFAULT_LISTS_DIR, COMPLETENESS_FILE,
      _COMPLETENESS_CLASS, _COMPLETENESS_DEFAULTS, completeness_line, run_completeness_command, the import); acceptance_for
      returns the monitor form for every class; --no-alarms and --assert-zero stay on monitor; the docstring names
      monitor|arrival. The word completeness no longer appears in the file (rec-5099's acceptance).
  - file: scripts/telemetry_verify/__init__.py
    action: Modify
    purpose: Drop the completeness re-exports (V4_FIRST_JUDGED_DAY, CompletenessResult, Listed, Lists, compare_sessions, lists_cover, load_lists) and their __all__ names.
  - file: tests/telemetry_verify/test_completeness.py
    action: Delete
    purpose: Tests of the deleted module; the one surviving behaviour (prefix normalisation) moves to test_session_presence.py.
  - file: tests/telemetry_verify/test_main.py
    action: Modify
    purpose: >-
      Delete the completeness-only tests (test_completeness_command_prints_the_pinned_grammar_only,
      test_completeness_line_prints_captured_host_runs, test_completeness_refuses_a_day_before_the_catalogs_first_judged_day),
      COMPLETENESS_LINE and, in the _early_v4_day autouse fixture, only the monkeypatch.setattr(completeness, "V4_FIRST_JUDGED_DAY", ...) line (its read_route.CATALOG_ENV setenv stays). In mixed tests drop only the completeness legs: test_a_reader_error_prints_class_and_status_only,
      test_acceptances_lint_as_decidable (the completeness class and its assertion), test_arguments_are_validated,
      test_an_unresolved_catalog_prints_a_class_only_stop_line. Rename test_main_builds_the_routed_reader to
      test_monitor_and_arrival_build_the_routed_reader with the completeness leg replaced by an arrival leg (session_presence.run
      monkeypatched), keeping the two-builds assertion. Replace test_a_short_list_is_refused_and_the_entry_point_builds_its_own_reader
      with test_the_entry_point_builds_its_own_reader, keeping its runpy leg on monitor. Add
      test_the_retired_completeness_command_is_refused: the parser rejects the bare word completeness as a command
      (SystemExit) and acceptance_for of any class names the monitor command. It names no module path or module import
      of the retired module (the file's absence is VP 1's and rec-5099's acceptance), so VP 1's sweep stays at zero
      matches. The module docstring names the monitor and
      arrival commands.
  - file: tests/telemetry_verify/test_alarms.py
    action: Modify
    purpose: _callers drops the COMPLETENESS_FILE caller and its id; the completeness_listed_not_captured class case becomes a monitor class (harness_key_missing) with the same scope shape, so the row-gate coverage per caller is unchanged.
  - file: tests/telemetry_verify/test_monitor.py
    action: Modify
    purpose: >-
      test_monitor_reports_rederivation_orphan_and_completeness_counts loses its completeness tail (the Listed rows and
      compare_sessions call); its monitor assertions are unchanged and its name is kept, since the graduated record
      telemetry-verify-monitor-rederivation pins it.
  - file: tests/telemetry_verify/test_session_presence.py
    action: Modify
    purpose: >-
      Drop the completeness import; the open-start lost-window test compares against the literal 2026-10-28 (the
      production first judged day the constant held). Add test_normalise_key_strips_either_prefix, carrying the cases of
      the deleted test_harness_key_join_normalises_both_prefixes against session_presence.normalise_key.
  - file: tests/test_session_session_trailer.py
    action: Modify
    purpose: >-
      Drop the completeness import; test_parity_with_the_arrival_oracle compares st.normalise against
      sp.normalise_key (the arrival oracle's own helper after the move) over the same values. The node name and its
      parity claim are unchanged, so session-trailer-oracle-parity, premerge-trailer-attribution and
      session-trailer-commit-check stay as they are.
  - file: scripts/checks/contracts/_retired_identity.py
    action: Modify
    purpose: Remove the two SWEEP_PINS rows for the deleted completeness.py and test_completeness.py; the check fails a pin whose file no longer names the retired identity.
  - file: docs/contracts/data-modeling-standard.yaml
    action: Modify
    purpose: >-
      The telemetry_sessions join_key pointer names scripts/telemetry_verify/session_presence.py normalise_key instead
      of completeness.py (a meaning-free pointer swap), with a new one-line flow-style amendment_log entry
      (semantic_break false, change_class correction, naming this plan and rec-5099). The file is at its 533-line cap, so the 2026-10-30
      PLAN-glossary amendment_log row is compacted to flow style with its words unchanged, netting four lines of
      headroom; no other text changes.
  - file: config/agent/data_quality/source_registry.yaml
    action: Modify
    purpose: >-
      The telemetry verification findings description drops "and session-list completeness" from the monitor's list,
      which then reads "re-derived verb outputs, orphans and silent-failure checks".
  - file: config/agent/verification_registry/entries/telemetry-verify-completeness-join.yaml
    action: Delete
    purpose: Retired by git mv into entries/deprecated/ (100% rename); it pins only tests of the deleted module (Decision 235 cl.1, operator-approved with this plan).
  - file: config/agent/verification_registry/entries/deprecated/telemetry-verify-completeness-join.yaml
    action: Create
    purpose: The git mv destination, byte-identical.
  - file: config/agent/verification_registry/entries/telemetry-completeness-host-runs.yaml
    action: Delete
    purpose: Retired by git mv into entries/deprecated/ (100% rename); it pins one test of the deleted module.
  - file: config/agent/verification_registry/entries/deprecated/telemetry-completeness-host-runs.yaml
    action: Create
    purpose: The git mv destination, byte-identical.
  - file: config/agent/verification_registry/entries/telemetry-read-clients-use-the-route.yaml
    action: Delete
    purpose: Retired by git mv into entries/deprecated/ (100% rename); three of its nine nodes change (two deleted, test_main_builds_the_routed_reader renamed), and an in-place edit would be refused as tautological. VP 3 graduates its replacement.
  - file: config/agent/verification_registry/entries/deprecated/telemetry-read-clients-use-the-route.yaml
    action: Create
    purpose: The git mv destination, byte-identical.
  - file: config/agent/verification_registry/entries/telemetry-verify-commands-counts-only.yaml
    action: Delete
    purpose: Retired by git mv into entries/deprecated/ (100% rename); one of its seven nodes is deleted. VP 2 graduates its replacement.
  - file: config/agent/verification_registry/entries/deprecated/telemetry-verify-commands-counts-only.yaml
    action: Create
    purpose: The git mv destination, byte-identical.
bundled_recommendations: [rec-5099]
followon_recs: []
infrastructure_dependencies: []
acceptance_criteria:
  - scripts/telemetry_verify/completeness.py and tests/telemetry_verify/test_completeness.py are deleted, and the word completeness is absent from scripts/telemetry_verify/__main__.py (rec-5099's acceptance passes).
  - python -m scripts.telemetry_verify completeness is refused by the parser; monitor and arrival behave as before.
  - session_presence.normalise_key strips either prefix exactly as completeness.normalise_key did, and the arrival suite passes unchanged apart from the moved helper.
  - The four registry records move byte-identical into entries/deprecated/; the two replacement records keep every surviving node of the records they replace and are admitted by the differential gate; the moved helper's test is graduated.
  - "The completeness legs removed from test_main.py, test_alarms.py, test_monitor.py and test_session_presence.py and the four retired records are the operator-approved weakenings of this plan (Decision 235 cl.1); no other assertion is loosened."
  - "No live tracked file outside docs/plans/, entries/deprecated/ and docs/DECISIONS*.md matches VP 1's identifier and path patterns (the module path or import, its symbols, its test file, its subcommand invocation, its lists directory, its alarm class). Prose that only names the word, such as the T3.20 c3 residual and dated history rows (roadmap progress notes, contract amendment_log rows), is out of this criterion."
  - The full tier is green before handoff and on the first main run after merge, with validate_graduated_rerun failing nothing; rec-5099 closes through its Resolves trailer.
verification_plan:
  - step: 1
    phase: pre-deploy
    action: >-
      STALE-REFERENCE SWEEP (surface-retiring): the module and its test are gone, the four records leave entries/ by
      100% renames into entries/deprecated/, and no live surface names the retired surface.
    command: >-
      E=config/agent/verification_registry/entries; R=$(git diff -M --name-status origin/main -- $E);
      test ! -e scripts/telemetry_verify/completeness.py && test ! -e tests/telemetry_verify/test_completeness.py || exit 1;
      for id in telemetry-verify-completeness-join telemetry-completeness-host-runs telemetry-read-clients-use-the-route telemetry-verify-commands-counts-only; do
      test -f $E/deprecated/$id.yaml && test ! -e $E/$id.yaml && printf '%s\n' "$R" | grep -qxF "$(printf 'R100\t%s\t%s' $E/$id.yaml $E/deprecated/$id.yaml)" || exit 1; done;
      ! git grep -n -E 'telemetry_verify[/.]completeness|telemetry_verify import[^#]*\bcompleteness\b|\bcompleteness\.(normalise_key|Listed|Lists|compare_sessions|load_lists|lists_cover|first_judged_day|PRODUCTION_FIRST_JUDGED_DAY|V4_FIRST_JUDGED_DAY|THREAD_FILE|SESSIONS_FILE)|test_completeness\.py|telemetry_verify completeness|DEFAULT_LISTS_DIR|telemetry-slice4/completeness|completeness_listed_not_captured'
      -- . ':!docs/plans/' ":!$E/deprecated/" ':!docs/DECISIONS.md' ':!docs/DECISIONS_ARCHIVE.md' || exit 1;
      echo COMPLETENESS_SURFACE_RETIRED
    expected: >-
      Exit 0 and the marker line. Red before: on origin/main the module exists and the grep matches, among others,
      tests/test_session_session_trailer.py's import line.
    fix_if: A rename is not R100, or a live surface still names the retired surface; reword or remove it, never edit a resolved plan or a Decision.
    hermetic: true
    expected_literals: [COMPLETENESS_SURFACE_RETIRED]
    graduation: waive
    graduation_waiver_reason: A one-time sweep of this diff against origin/main; once merged, VP 2's retired-command node carries the durable claim.
  - step: 2
    phase: pre-deploy
    action: The commands print counts only, and the CLI offers monitor and arrival only (replacement of telemetry-verify-commands-counts-only).
    command: >-
      bin/venv-python -m pytest
      tests/telemetry_verify/test_main.py::test_monitor_command_prints_the_pinned_grammar_only
      tests/telemetry_verify/test_main.py::test_a_reader_error_prints_class_and_status_only
      tests/telemetry_verify/test_main.py::test_assert_zero_needs_a_completed_run_and_a_denominator
      tests/telemetry_verify/test_main.py::test_acceptances_lint_as_decidable
      tests/telemetry_verify/test_main.py::test_a_failed_filing_exits_1
      tests/telemetry_verify/test_main.py::test_arguments_are_validated
      tests/telemetry_verify/test_main.py::test_the_retired_completeness_command_is_refused -q
    expected: Exit 0, 7 passed. Red before (the last node is absent on origin/main, where the parser accepts completeness).
    fix_if: A node fails or does not resolve; fix the code or the test, never drop a node.
    hermetic: true
    expected_literals: [7 passed]
    graduation: graduate
    graduation_check_id: telemetry-verify-commands-monitor-arrival-counts-only
  - step: 3
    phase: pre-deploy
    action: Every read client still builds the routed reader (replacement of telemetry-read-clients-use-the-route).
    command: >-
      bin/venv-python -m pytest
      tests/test_agent_sdk_mcp_server.py::TestCreateServer::test_default_reader_is_the_routed_reader
      tests/test_agent_sdk_mcp_server.py::TestCreateServer::test_ops_tools_survive_an_unavailable_event_reader
      tests/telemetry_capture/test_main.py::test_verify_builds_the_routed_reader
      tests/telemetry_capture/test_main.py::test_an_unresolved_catalog_is_a_counted_check_status
      tests/telemetry_verify/test_main.py::test_monitor_and_arrival_build_the_routed_reader
      tests/telemetry_verify/test_main.py::test_an_unresolved_catalog_prints_a_class_only_stop_line
      tests/session/preflight/test_telemetry_health.py::test_gauge_reads_through_the_common_event_reader_seam -q
    expected: Exit 0, 7 passed. Red before (the renamed node is absent on origin/main).
    fix_if: A node fails or does not resolve; fix the code or the test, never drop a node.
    hermetic: true
    expected_literals: [7 passed]
    graduation: graduate
    graduation_check_id: telemetry-read-clients-build-the-routed-reader
  - step: 4
    phase: pre-deploy
    action: The moved helper normalises both prefixes as before.
    command: bin/venv-python -m pytest tests/telemetry_verify/test_session_presence.py::test_normalise_key_strips_either_prefix -q
    expected: Exit 0. Red before (node absent on origin/main).
    fix_if: The helper's behaviour changed in the move; restore the verbatim body.
    hermetic: true
    expected_literals: [1 passed]
    graduation: graduate
    graduation_check_id: session-presence-normalise-key
  - step: 5
    phase: pre-deploy
    action: >-
      The whole telemetry_verify suite and the session-trailer suite pass, including the package-boundary scan, the
      arrival oracle and the trailer parity node.
    command: bin/venv-python -m pytest tests/telemetry_verify tests/test_session_session_trailer.py -q
    expected: Exit 0.
    fix_if: Any failure; a node outside the scope tests failing means the removal reached live code.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: >-
      The full tier runs both selectors; steps 2-4 graduate the new and replaced claims. Not hermetic because
      test_monitor.py is guarded on duckdb, which PR CI's fast tier lacks.
  - step: 6
    phase: pre-deploy
    action: rec-5099's own acceptance, verbatim, and the retired-identity check with the two pins removed.
    command: >-
      test ! -e scripts/telemetry_verify/completeness.py && ! grep -q "completeness" scripts/telemetry_verify/__main__.py &&
      bin/venv-python -c "from scripts.checks.contracts.validate_github_org_transfer import validate_github_org_transfer as v;
      f=[]; v(f); assert not f, f; print('ORG_TRANSFER_CLEAN')"
    expected: Exit 0 and ORG_TRANSFER_CLEAN.
    fix_if: A stale or missing pin is reported; fix _retired_identity.py's SWEEP_PINS, never the contract.
    hermetic: true
    expected_literals: [ORG_TRANSFER_CLEAN]
    graduation: waive
    graduation_waiver_reason: The first half is the rec's acceptance, which the closure job runs; the org-transfer check runs in both tiers.
  - step: 7
    phase: pre-deploy
    action: Fast tier, including the registry differential gate admitting the three new records and no modified live record.
    command: bin/venv-python -m scripts.validate --pre
    expected: Exit 0; the differential lines read admitted for the three new check_ids.
    fix_if: A record is not admitted; fix its command or its new node, never loosen a node.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard); the tier itself is the standing guard.
  - step: 8
    phase: pre-deploy
    action: Full tier before handoff, backgrounded from the top-level session with a 2 h limit, then the HEAD attestation.
    command: bin/venv-python -m scripts.validate; bin/venv-python -m scripts.checks.validation_result --verify-head
    expected: The verdict check exits 0 for HEAD, with validate_graduated_rerun failing nothing.
    fix_if: Any failure; fix and rerun the full tier from the start.
    hermetic: false
    graduation: waive
    graduation_waiver_reason: Invokes scripts.validate (recursion hazard); the full tier on main is the standing guard.
  - step: 9
    phase: post-deploy
    action: The first main-validate run on the squash-merge commit is green, and rec-5099 is closed by the Resolves trailer.
    command: >-
      mcp__github__actions_list(method=list_workflow_runs, owner=otl-labs, repo=ontheloop, resource_id=ci.yml,
      workflow_runs_filter={branch: main, event: push}); from its result take, among runs with status completed, the
      earliest whose head_sha is the merge SHA or a descendant of it (git merge-base --is-ancestor <merge> <head_sha>),
      which is the first completed run whose range holds the merge SHA (Decision 254 cl.1 and cl.4); then
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-5099']); print(r[0]['id'], r[0]['status'])"
    expected: main-validate success with no GATE-FAILURE for validate_graduated_rerun; rec-5099 closed. Record the run id and merge SHA.
    fix_if: A red record names a node this plan touched; fix forward through the owning planning thread. rec-5099 still open; read the closure job's verdict, never close it by hand.
    hermetic: false
    graduation: not-applicable
  - step: 10
    phase: post-deploy
    action: rec-4439 stays open and no longer points at the deleted module.
    command: >-
      bin/venv-python -c "from src.common.ducklake_reader_client import fetch_recs_by_ids, make_reader;
      r,m=fetch_recs_by_ids(make_reader(profile='agent_platform'), ['rec-4439']); x=r[0];
      assert x['status']=='open' and x['file']=='scripts/telemetry_verify/monitor.py', (x['status'], x['file']);
      print('REC_4439_REKEYED')"
    expected: Exit 0 and REC_4439_REKEYED.
    fix_if: The file is still completeness.py; re-run the closure step's Python update_rec call (never the CLI's --file, never a direct writer call) and read it back.
    hermetic: false
    graduation: not-applicable
