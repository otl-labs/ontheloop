  - file: .github/workflows/deploy-telemetry-content.yml
    action: Create
    purpose: >-
      name: deploy-telemetry-content (the slug ci-rca.yml derives, the taxonomy key and the evidence rows'
      workflow_name). Header comment naming Decisions 239 cl.5, 249, 254, 270 and {{N}}. on: workflow_run (workflows [CI], types
      [completed], branches [main]) and workflow_dispatch (inputs force and rebaseline, boolean, default false; rebaseline is the recovery
      for a BASELINE_UNPROVEN run: the summary lists every bundled commit since ddb28a40 and both baseline checks are
      skipped for that run only). Top-level permissions contents: read.
      concurrency: group deploy-telemetry-content, cancel-in-progress false (a newer pending run replaces an older
      pending one; an in-flight deploy always completes). Every non-local uses: is pinned to a 40-hex commit SHA with a
      version comment. Jobs, in order:
        - gate: the deploy-prod-lambdas.yml gate job's if: expression verbatim (dispatch on main by a non-bot actor, or a
          successful same-repo push run of CI), uses ./.github/workflows/deploy-gate.yml with channel telemetry-content
          and force set to force || rebaseline (a rebaseline dispatch is never skipped as already_deployed), secrets inherit, permissions id-token write, contents read, actions read.
        - build: needs gate, if needs.gate.outputs.deploy == 'true'. No environment and no id-token; permissions
          contents read and actions read. Steps: checkout with ref needs.gate.outputs.sha, fetch-depth 0 and
          persist-credentials false; "Check the telemetry-content-deploy Environment has reviewers" (python3 -I
          scripts/ci/environment_reviewer_preflight.py environment --environment telemetry-content-deploy
          --require-no-admin-bypass, GH_TOKEN and REVIEWER_LOGINS from vars.TF_GITHUB_GATED_APPLY_REVIEWER_LOGINS);
          setup-python 3.12 and pip install -c requirements.txt pyyaml pydantic; the telemetry hold (python -m
          scripts.checks.ops_governance.validate_reconcile_pending_gate --telemetry-hold, held exported as an output,
          held=true writing a TELEMETRY_PRODUCTION_HOLD notice, a green skip); python -m scripts.build_lambda
          --content-reader-only with its CONTENT_READER_SHA256 exported as output sha256; upload
          lambda-packages/ducklake-telemetry-content-reader.zip as artifact telemetry-content-<sha256>, retention-days
          30, if-no-files-found error; "List the watched and bundled paths" (python -m scripts.ci.deploy_gate pathspecs
          --channel telemetry-content > protective-paths.txt; python -m scripts.build_lambda --list-bundle
          ducklake_telemetry_content_reader > bundle-paths.txt); "Prove the recorded baseline" when needs.gate.outputs.record_sha is non-empty and
          rebaseline is not true (git worktree add at record_sha, python -m scripts.build_lambda --content-reader-only
          there, and fail with BASELINE_UNPROVEN unless base64 of that digest equals needs.gate.outputs.record_code_sha256:
          the deploy record is writable by agent-reachable identities, so the summary's commit range is trusted only
          once the recorded commit is shown to build the recorded code; decision-scout r3 NOTE); "Write the approval
          summary" (bash scripts/ci/telemetry_content_deploy.sh summary with GATE_SHA, HEAD_SHA (github.sha), RECORD_SHA
          (empty, or rebaseline, means the range starts at ddb28a40), RUN_URL of the waking CI run, CONTENT_SHA256 and
          HELD through env).
        - deploy: needs [gate, build], if needs.build.outputs.held == 'false', environment telemetry-content-deploy,
          permissions id-token write, contents read and actions read. Steps: checkout (ref gate sha, persist-credentials
          false) for the scripts and deploy_config.json, then a second checkout at path .dispatch-tooling (the
          workflow's own ref, persist-credentials false), as validate_environment_reviewer_preflight (c) requires of a
          job whose first checkout takes a ref; "Check the reviewer approval for telemetry-content-deploy" (python3 -I
          scripts/ci/environment_reviewer_preflight.py approvals, working-directory .dispatch-tooling, before any other
          non-checkout step; the job's only python, stdlib, before any credential); ./.github/actions/aws-region;
          download the artifact by its digest name; configure-aws-credentials with role-to-assume
          arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/telemetry-content-deploy, aws-region env.AWS_REGION and
          MASK_AWS_ROLE_ID_ACCOUNT_PART from secrets.AWS_ROLE_ID_ACCOUNT_PART in the step env; bash
          scripts/ci/telemetry_content_deploy.sh deploy with ZIP, CONTENT_SHA256, RECORD_CODE_SHA256
          (needs.gate.outputs.record_code_sha256) and REBASELINE through env, exporting code_sha256.
          It runs no pip install and no repo Python while it holds the role.
        - record: needs [gate, deploy], if needs.deploy.result == 'success'. permissions id-token write, contents read.
          Checkout at the gate sha; aws-region; setup-python and pip install -c requirements.txt pyyaml pydantic, before
          any credential; configure-aws-credentials for agent-platform-github-ci-deploy (the deploy-prod-lambdas.yml
          form); python -m
          scripts.ci.telemetry_content_record with CODE_SHA256 (needs.deploy.outputs.code_sha256) and
          LAMBDA_ARTIFACT_SHA (gate sha) through env, which refuses an empty or non-base64 digest and writes
          deploy-records/telemetry-content/agent-platform-ducklake-telemetry-content.json through
          scripts.build_lambda_deploy._write_ducklake_deploy_record (schema_version 2 run facts).
  - file: scripts/ci/telemetry_content_deploy.sh
    action: Create
    purpose: >-
      Bash, set -euo pipefail, using only aws, jq, sha256sum, base64, git and the two path-list files; every error names
      a step, never a value. aws calls use --query and --output text (or json piped to jq for the read-back
      comparison), so no full function configuration or ARN is printed.
      Subcommands:
        - summary: reads two path lists the build job wrote before it with no credential (PROTECTIVE_PATHS_FILE from
          python -m scripts.ci.deploy_gate pathspecs --channel telemetry-content, BUNDLE_PATHS_FILE from python -m
          scripts.build_lambda --list-bundle ducklake_telemetry_content_reader, which lists the bundled .py files and
          assets), and writes $GITHUB_STEP_SUMMARY, intent and evidence first (Decision 232 cl.4): the protective-set
          commits since RECORD_SHA (git log --oneline over the protective list, or "first deploy" with the range from
          ddb28a40), the waking CI run URL, the built digest, the hold state and the deploy_config.json layer pins;
          then every commit going out over the bundle list, the build tooling that assembles the zip
          (scripts/build_lambda.py, scripts/build_lambda_packaging.py, scripts/build_lambda_config.py,
          scripts/lambda_manifest.py; decision-scout r4 NOTE) and the deploy path that applies it
          (.github/workflows/deploy-telemetry-content.yml, scripts/ci/telemetry_content_deploy.sh,
          scripts/ci/telemetry_content_record.py, scripts/build_lambda_deploy.py, scripts/ci/deploy_gate.py,
          .github/workflows/deploy-gate.yml, scripts/ci/environment_reviewer_preflight.py, .github/actions/aws-region,
          scripts/checks/ops_governance/validate_reconcile_pending_gate.py; decision-scout r7 NOTE, r8 advisory) -- neither wakes the channel, both are shown on the next approval; then
          deploy_config.json's diff over the range; then the line "CI
          publishes the layers: a pin proves which bytes run, not who built them (rec-4742)". It prints gate and HEAD
          shas. It reads no credential.
        - deploy: fails unless sha256sum(ZIP) equals CONTENT_SHA256; adds a mask for the STS account; when
          RECORD_CODE_SHA256 is non-empty and REBASELINE is not true, fails at step baseline unless get-function's live
          Configuration.CodeSha256 equals it (the live reader is the recorded one, so the approved summary listed
          everything that changes); for each
          deploy_config.json layer resolves its version ARN and fails unless get-layer-version's Content.CodeSha256
          equals the pin; update-function-configuration with exactly --handler, --layers and --environment from
          deploy_config.json, wait function-updated-v2; update-function-code --zip-file, wait again; fails unless the
          live CodeSha256 equals base64 of the digest bytes (Decision 154) and get-function-configuration reads back
          the handler, the resolved layer ARNs and the environment exactly; writes code_sha256 to GITHUB_OUTPUT. Nothing
          prints a value from the environment block.
