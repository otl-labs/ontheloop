schema_version: 6
handoff_policy:
  full_validation_required_before_commit: true
  timeout_disposition: blocked
slug: "telemetry-content-deploy-channel"
intent: >-
  Plan A of rec-5246 (plan 2 of rec-4696; plan 1 is PLAN-telemetry-content-reader-api-lock, Decision 270, live since
  ddb28a40). Take the masked telemetry content reader live, so the feedback loop's forensic reads can read production
  transcripts masked through the DuckLake API's telemetry/content route. deploy-telemetry-content.yml is woken like
  every governed code-deploy channel (Decisions 249 and 254: the last-green main commit) but, by the operator's ruling
  of 2026-11-17 recorded as a new Decision, only when the reader's protective set changed. A credential-free build job
  builds the reader zip and records its digest; the deploy job waits in the reviewer-gated telemetry-content-deploy
  Environment and, as telemetry-content-deploy, deploys exactly that digest with the handler, layers and environment
  pinned in deploy_config.json, then reads back the live CodeSha256 and configuration (Decision 239 cl.5, Decision 154).
  A record job writes the channel's deploy record under the CI deploy role, so the gate's skip rules and the deploy
  history cover the reader. A repo check keeps the channel's premises; the new files join PROTECTED, CODEOWNERS and
  boundary_patterns; the manifest flips to active. The protected-path edit hook and the golden replay's masked
  read-back leg are plan B (rec-5322). Closes rec-4696 and rec-5246.
plan_type: IMPLEMENTATION
verification_tier: V3
plan_path: docs/plans/PLAN-telemetry-content-deploy-channel.yaml
phase: >-
  ad_hoc_rec (soft-warn category; no tier_item claimed, so the Tier Item Freshness Gate is skipped): rec-5246 (High)
  and rec-4696 (High), a prerequisite on the operator's feedback-loop gate before T3.3/T3.4 waves 2-4. closes_criteria
  is empty.
cites: [dec:239, dec:270, dec:249, dec:254, dec:154, dec:125, dec:126, dec:79, dec:238, dec:232, dec:246, dec:267, dec:162]
